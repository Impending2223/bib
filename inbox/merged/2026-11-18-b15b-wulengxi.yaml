- add:
    entry:
      id: cal.1960-04.china-leadership-5
      when: Apr., early
      date: 1960-04
      thread: china-leadership
      also:
      - soviet-union
      at: before 1960-04-01
      c: 'Two Secretariat meetings, Deng Xiaoping presiding, on the first drafts of the Lenin-anniversary pieces: the *Renmin ribao* editorial (Hu Qiaomu, Wu Lengxi), Lu Dingyi''s speech, the *Hongqi* editors'' article (Chen Boda), and the pamphlets of Lenin''s writings. Seven matters set: the era, Leninism not outdated, revolutionary doctrine, war and peace, imperialism''s nature, revolution and parliament, revisionism and dogmatism. The editorial to take the situation and the United States, Lu proletarian revolution and dictatorship, *Hongqi* the era; unity kept, Yugoslavia the target.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 259–260. Made public: 1999. Names: Deng Xiaoping, Lu Dingyi, Chen Boda. Check: the days: "early April".'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:lu-dingyi
      - name:chen-boda
      - vis:only:prc
      src:
        c: 6de39839
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 259–260: all'
- add:
    entry:
      id: cal.1960-04.china-leadership-6
      when: Apr., early
      date: 1960-04
      thread: china-leadership
      also:
      - soviet-union
      at: before 1960-04-01
      c: Politburo Standing Committee at Mao's house, afterward ("later"), Deng reporting the Secretariat's points. Liu Shaoqi and Zhou Enlai agree to the division of the three pieces; Mao too. Reason fully, treat opponents differently, leave room; criticize chiefly the Yugoslav views, quote no Soviet and above all not Khrushchev.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 260–261. Made public: 1999. Names: Deng Xiaoping, Liu Shaoqi, Zhou Enlai, Mao Zedong, Khrushchev. Check: the day: Wu says only that it followed the Secretariat; before the pieces ran (Apr. 16, 22).'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: 1982d583
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 260–261: all'
      follows:
      - cal.1960-04.china-leadership-5
- add:
    entry:
      id: cal.1960-04-22.china-leadership-4
      when: Apr. 22
      date: '1960-04-22'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The Central Committees meeting for Lenins ninetieth anniversary hears Lu Dingyis report, "Unite under Lenins Revolutionary Banner": Leninisms essence its revolutionary spirit; revisionism, fearing war, comes to fear revolution, and opposes it in others. No Soviet text quoted.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 262–264 (the plate, 264: the report dated Apr. 22). See [[cal.1960-04-16.china-leadership]], [[cal.1960-04-20.china-leadership]]. Names: Lu Dingyi. Check: the place of the meeting.'
      tags:
      - polity:prc
      - name:lu-dingyi
      src:
        c: 7f00c3c8
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 262–264: all'
- add:
