      when: May 15
      date: '1960-05-15'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao telephones Zhou Enlai, just back at Nanning from Vietnam, to fly to Wuhan to confer on the international situation.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 268. Made public: 1999. See [[cal.1960-05-16.china-leadership]]. Names: Mao Zedong, Zhou Enlai. Check: the place: Wu has Zhou at Nanning; the calendar has him going from Nanning to Guilin and Changsha on the 15th.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
