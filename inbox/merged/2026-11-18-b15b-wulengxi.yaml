- add:
    entry:
      id: cal.1960-06-16.soviet-union
      when: June 16
      date: '1960-06-16'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. Peng Zhen's delegation, left Peking that day, meets Kozlov of the Presidium for eight hours of argument. Kozlov faults the three Lenin articles and the Peking trade-union meeting, in theory and in organization, a typed document of some twenty pages in hand; asked how the Bucharest meeting is to go, he says it will be settled there. The delegation cables that it is not a good sign.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 279–280. Made public: 1999. See [[cal.1960-06-12.china-leadership]]. Names: Peng Zhen, Kozlov. Check: Wu gives the first day only, "June 16" for the departure; the 8 hours as the delegation cabled them.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:kozlov-frol-r
      - vis:only:prc+ussr
      src:
        c: 29cdd746
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 279–280: all'
- add:
    entry:
      id: cal.1960-06-20.soviet-union
      when: June 20–25
      date: '1960-06-20'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Bucharest. The Romanian Workers'' Party''s third congress, June 20–25. Khrushchev''s long speech is cheered; Peng Zhen''s greeting, on the views of the three Lenin articles, is applauded by the hall and coldly met on the platform. The Chinese delegation is shut off: other delegations do not call, the Romanian liaison will not say where they stay, visits are not arranged.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 280. Made public: 1999. Names: Khrushchev, Peng Zhen. Check: the delegation''s account as relayed; Khrushchev''s speech date within the congress.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - name:peng-zhen
      src:
        c: bb2d5b36
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 280: all'
- add:
    entry:
      id: cal.1960-06-22.soviet-union
      when: June 22
      date: '1960-06-22'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Bucharest. Khrushchev receives the Chinese delegation, after delay, for six hours, most of it his reproaches; the delegation, by plan, lets him speak. By its cable: the great leap leaves people without trousers; the hundred flowers; Stalin''s coffin to Peking; "east wind"; Genghis Khan; the India conflict China''s own doing, the Soviet neutral statement a help; Indonesia China''s fault. The delegation concludes the meeting is to attack China.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 280–281. Made public: 1999. Names: Khrushchev, Peng Zhen. Check: the delegation''s account as Wu gives it.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - name:peng-zhen
      - vis:only:prc+ussr
      src:
        c: 2cdca7f0
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 280–281: all'
- add:
    entry:
      id: cal.1960-06-23.soviet-union
      when: June 23
      date: '1960-06-23'
      time_range:
      - 1960-06-23T04:00Z
      - 1960-06-23T10:00Z
      time_band: morning
      time_zone: Europe/Bucharest
      thread: soviet-union
      also:
      - china-leadership
      c: Bucharest, morning. The Soviet delegation hands Peng Zhen's delegation the CPSU Central Committee's letter, dated June 21, in seven parts (the era; war and peace; peaceful coexistence; forms of transition; international mass organizations; China's breaches of the Declarations; unity). The same text had gone to the other parties as a "notification" on June 21, before the Chinese had it, by the Vietnamese, Korean and Albanian delegations' word. A draft communique follows, for discussion on the 24th. The delegation cables the points.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 281–283, 285 ("the morning of the 23rd", 285). Made public: 1999. Names: Peng Zhen.'
      tags:
      - polity:prc
