      also:
      - soviet-union
      at: before 1960-09-01
      c: 'The Center answers the CPSU Central Committee, after the Standing Committee''s discussion: the two parties'' talks to come first, as Hồ Chí Minh, and the Polish and Hungarian parties, had urged.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 351. Made public: 1999. See [[cal.1960-08-19.china-leadership]]. Names: Hồ Chí Minh. Check: the day: Wu gives "early September".'
      tags:
