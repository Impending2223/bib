      - china-leadership
      c: Bucharest, morning. The twelve parties' "talks," Gheorghiu-Dej presiding, turn on China from the CPSU notice; Bulgarian, Czechoslovak and East German delegates the sharpest, the Albanians, Koreans and Vietnamese against such a meeting. Khrushchev's closing attack. Peng Zhen answers him alone, on Khrushchev's own words, and objects to a communique not announced beforehand; Khrushchev demands signature; a half-hour recess; Gheorghiu-Dej calls on China for unity. That night the delegation cables Peking, inclined to sign with a statement.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 285–288 ("the morning of the 24th", 285). Made public: 1999. See [[cal.1960-06-23.soviet-union]]. Names: Khrushchev, Peng Zhen. Check: the account is the delegation''s, by cable and later telling.'
