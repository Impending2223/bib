- add:
    entry:
      id: cal.1960-06-25.china-leadership-2
      when: June 25
      date: '1960-06-25'
      time_range:
      - 1960-06-24T22:00Z
      - 1960-06-25T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, morning. The delegation''s cable of the night of the 24th reaches the Center. Deng Xiaoping, by telephone with Liu Shaoqi and Zhou Enlai (Mao still asleep), decides on a statement, and dictates its substance to Hu Qiaomu and Wu Lengxi at the Juren Tang, the Secretariat''s building; written up, it is printed for the Standing Committee. Hu and Wu draft with it a cable to the delegation, printed for Mao, Liu and Zhou: strike back, name Khrushchev and no other party, keep room; read the statement at the meeting or hand it out, then sign.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 288–289. Made public: 1999. See [[cal.1960-06-25.china-leadership]]. Names: Deng Xiaoping, Liu Shaoqi, Zhou Enlai, Mao Zedong, Khrushchev. Check: the place: Liu and Zhou were at Shanghai by the Zhou nianpu, which has Zhou drafting a letter to the delegation that day.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: 04f034d5
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 288–289: all'
- add:
    entry:
      id: cal.1960-06-25.china-leadership-3
      when: June 25
      date: '1960-06-25'
      time_range:
      - 1960-06-25T04:00Z
      - 1960-06-25T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Afternoon. Mao convenes the Standing Committee on the cable to the delegation and the draft statement, at the Yinian Tang by Wu''s account. Mao: a counter-encirclement; Khrushchev''s June 2 letter his decision to press, the June 7 letter a lie, the fifty or sixty pages of the notification long prepared. Liu: Khrushchev like Gao Qiu, lawless and a rogue; Mao: a Jiang Menshen. Mao: the basic difference is whether the two-thirds outside the socialist states want revolution, and whether the other third will go on with it. The statement''s five points go to Bucharest: the Soviet delegation''s surprise attack, China''s loyalty to the 1957 Declaration, unity, the difference partial, no assent to the communique draft.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 289–291. Made public: 1999. See [[cal.1960-06-23.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Khrushchev. Check: the place: the Mao nianpu has Mao at Shanghai through June 28; Wu has the Yinian Tang.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: '29380372'
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 289–291: all'
      follows:
      - cal.1960-06-25.china-leadership-2
- add:
    entry:
      id: cal.1960-06-25.soviet-union
      when: June 25
      date: '1960-06-25'
      time_range:
      - 1960-06-25T04:00Z
      - 1960-06-25T17:00Z
      time_band: daytime
      time_zone: Europe/Bucharest
      thread: soviet-union
      also:
      - china-leadership
      c: Bucharest, morning and afternoon. Khrushchev enlarges the meeting to fifty-one parties, unannounced to the Chinese, who find Europe, Latin America, Asia and Africa represented; the sessions are one attack on China, mostly from parties resident in the USSR and eastern Europe. Peng says only that the meeting is not what the June 7 letter said; the delegation has no authority to sign, and awaits the Center. That evening the Center's statement reaches the delegation, which meets through the night.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 291–293 (the sessions "of the morning and afternoon of the 25th", 292). Made public: 1999. See [[cal.1960-06-24.soviet-union]]. Names: Peng Zhen. Check: the account is the delegation''s.'
      tags:
      - polity:prc
      - name:peng-zhen
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia
      - vis:only:prc@F
      src:
