    reads: Peng Zhen reports on the conference's second day, July 6
    at: '309'
- cite:
    id: cal.1960-07-14.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 314–315 (decided by the Standing Committee; Zhou speaks three days, July 14 to 16, in five periods from the Comintern''s founding to the latest; the first period 1919–27; mornings)'
    units: A, B
- variant:
    id: cal.1960-07-14.china-leadership
    unit: B
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: Zhou's report on three mornings, July 14–16, "each day a morning"
    at: 314–315
- cite:
    id: cal.1960-07-18.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 335 (Mao, as Li Fuchun spoke of Khrushchev''s pressing the Chinese at Bucharest: the Soviet people''s past help not to be forgotten, but self-reliance now; Lenin''s road, socialism in one country; Mao stressed it on the 18th because the CPSU''s letter of the 16th had come)'
    units: C, D
- cite:
    id: cal.1960-07-31.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 337–338 (Zhou on the experts, the aid projects, trade and debt; the experts to be talked to by their unit heads, thanked, seen off warmly in small farewells, a large one later in Peking)'
    units: B
- cite:
    id: cal.1960-08-10.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 339–343 (Mao''s closing words: the Sino-Soviet matter neither large nor small; 90 percent of Soviet people and experts good, to be seen off well; hold out ten years; then Deng (a year to catch breath, 2 billion rubles of exports next year, six regional bureaus of the Center) and Liu Shaoqi (revisionism a stage of Leninism''s growth))'
    units: C, E
- cite:
    id: cal.1960-08-08.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 344–345 (Zhou and Deng talked with Hồ twice, he came to Beidaihe near the conference''s end with Hoàng Văn Hoan and Nguyễn Xuân Thủy, as a go-between; his plan: the two parties'' talks, then the drafting committee, then the parties'' meeting, and a visit to Moscow first)'
    units: A
- cite:
    id: cal.1960-08-10.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 345–348 (Mao, a night without sleep, came to the beach early morning, talked with Hồ and swam; Liu, Zhou and Deng sent for; Hồ''s points "basically good"; Mao declines to meet Khrushchev himself, Liu, Deng or Peng could; lunch at the bathing place, Hồ asks Liu to visit Vietnam in spring)'
    units: A, B, E, F
- cite:
    id: cal.1960-08-15.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 351 (the CPSU''s two letters, handed "on the 14th", two days after Hồ reached Moscow, Aug. 12: the one on the two parties'' meeting and unity, the other rebutting the Chinese statement at Bucharest)'
    units: A
- variant:
    id: cal.1960-08-15.china-leadership-2
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: 'the two letters reach China Aug. 14 (Mao, to Hồ, Aug. 19: "on the 14th they gave us two letters")'
    at: '351'
- cite:
    id: cal.1960-08-19.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 349–351 (Hồ returns to Peking the 19th; Mao receives him that evening at the Qinzheng Hall; Hồ''s account of the Soviet complaints; Mao on the joint fleet, the long-wave station, the air force)'
    units: A, B, D, G
- cite:
    id: cal.1960-09-07.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 352–353 (the Reply in twelve parts, five chief matters (the surprise attack at Bucharest; the extension to state relations and the experts'' withdrawal; Khrushchev on India; on Eisenhower; the "yellow peril" to Adenauer); the writers drafting from Beidaihe, Deng directing, Hu Qiaomu, Lu Dingyi and Kang Sheng chiefly; the Reply to go before the two parties'' talks, as the Standing Committee decided at several meetings in Peking after Beidaihe)'
    units: B, C, D, E, F, G
