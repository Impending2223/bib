    id: cal.1960-07.china
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 335–336, 338 (the CPSU Central Committee''s note handed July 16, decided at its plenum of July 13–16: all experts out between July 28 and Sept. 1; 1,299 experts and over 1,700 dependents; 304 projects, 156 of Stalin''s time and 148 of Khrushchev''s, 109 done by 1959, 48 due in 1960, 147 left)'
    units: A
