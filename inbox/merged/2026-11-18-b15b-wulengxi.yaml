      at: before 1960-03-11
      c: James Edward Walsh, an American who stayed in Shanghai at its liberation, is sentenced to twenty years, charged with directing for American intelligence the group under Gong Pinmei, the Shanghai bishop, already sentenced.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 247. To check: the announcement of the sentence (Xinhua, Mar. 1960). See [[cal.1960-01.china-leadership]]. Check: the day: Wu gives mid-March. Check: the court and place; Wu gives neither.'
      tags:
