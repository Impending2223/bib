      when: Apr. 22
      date: '1960-04-22'
      thread: china-leadership
      also:
      - soviet-union
      c: '*Renmin ribao*''s editorial for Lenin''s ninetieth anniversary, "Forward along the Path of the Great Lenin": three tasks, socialist construction, world peace, unity with friends; the weight on peace and on American aggression, thirty-five American acts since Camp David listed. No Soviet text quoted.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 262–264 (the plate, 264: the issue of Apr. 22). See [[cal.1960-04-20.china-leadership]], [[cal.1960-04-22.china-leadership-4]].'
      tags:
      - polity:prc
      src:
        c: 7055cbe5
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 262–264: all'
- add:
    entry:
      id: cal.1960-04-26.china-leadership-3
      when: Apr. 26
      date: '1960-04-26'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, at Mao''s house. The Politburo Standing Committee, after the three Lenin pieces: ordinary international questions to be commented on as before, articles on modern revisionism suspended. Mao: imperialism''s anti-China campaign comes in intervals; as between battles, a pause, a wave; the struggle to go back and forth, stopping and starting, for ten years or more.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 265–266. Made public: 1999. See [[cal.1960-04-26.china-leadership]]. Names: Mao Zedong. Check: the place: Mao''s meeting of the same day on the *Selected Works* is at Diaoyutai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: d7d87ee7
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 265–266: all'
- add:
    entry:
      id: cal.1960-05-04.china-leadership-2
      when: May 4
      date: '1960-05-04'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The Secretariat, Deng Xiaoping presiding (Mao in the south, Liu on tour in the northwest and southwest, Zhou abroad), on the U-2 incident. Khrushchev''s protest held right, answering opinion at home and abroad; the three Lenin articles'' timing good. Two courses expected: Eisenhower smooths it and the summit meets, or he refuses and Khrushchev boycotts. Wu asks how *Renmin ribao* is to print Khrushchev''s Supreme Soviet speech; Deng: front page, not the lead, with Eisenhower''s stand beside it.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 266–268. Made public: 1999. Names: Deng Xiaoping, Khrushchev, Eisenhower. Check: the day: Wu writes 4 May; the Supreme Soviet speech was May 5.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:khrushchev-nikita-s
      - name:eisenhower-dwight-d
      - vis:only:prc
      src:
        c: 9f569c9c
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 266–268: all'
