- cite:
    id: cal.1960-01-07.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 236–237 (Jan. 7–17, the Jinjiang Hotel; the first secretaries and ministers attending; the plan and defense strategy, then Khrushchev)'
    units: A, B
- cite:
    id: cal.1960-01-17.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 242–246 (Mao''s closing speech, five points: the plan the one decision; the two Soviet books to be read; the United States and Khrushchev''s trip; unity; no world war now, war not called avoidable while imperialism lasts)'
    units: C, D, E, F, I
- cite:
    id: cal.1960-03-22.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 255–258 (the comment on the Pakistan embassy''s telegram, written two days before the Tianjin meeting; 5 percent, at most 10 percent; the Delhi pavilion''s 3.5 million visitors; given to those on the train)'
    units: A
- cite:
    id: cal.1960-03-24.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 253–254, 258 (Wu, Hu Qiaomu, Chen Boda and Kang Sheng told the morning of Mar. 23 to go to Tianjin, by car to a railway siding by the airport outside the city, on Mao''s train; told on arrival the meeting was at 2 p.m.; the attendance in part (Liu, Zhou, Deng, Peng Zhen, Li Fuchun, Bo Yibo, Tan Zhenlin, Huang Huoqing); called on the communes, the urban ones above all, it turned to Sino-Soviet relations and the propaganda of Mao''s thought; in fact an enlarged Standing Committee, Mar. 24 and 25)'
    units: A, B
- cite:
    id: cal.1960-03-24.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 254–255 (at the opening Liu proposed that Mao Zedong thought be put with Marxism–Leninism; Deng the form "Marxism–Leninism, Mao Zedong thought" for home use; Mao agreed, and said only Marxism–Leninism abroad; the four writers present)'
    units: B, C, D
- variant:
    id: cal.1960-03-24.china-leadership-2
    unit: C
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: 'Liu Shaoqi raises it at the opening of the meeting; Deng proposes the formula for home use; Mao approves (Mao: not abroad); the discussion with the four writers present, not after the session'
    at: 254–255
- cite:
    id: cal.1960-03-25.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 258 (the meeting ends that evening; the four writers spend the night in Tianjin city and return to Peking the next day)'
    units: A
- cite:
    id: cal.1960-04-16.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 263–264 (the *Hongqi* editors'' article: the era unchanged, Leninism not outdated; no Khrushchev or Soviet press quoted)'
    units: A
- cite:
    id: cal.1960-05-16.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 268 (Mao talked with Zhou "a morning" on the 16th)'
    units: D
- cite:
    id: cal.1960-05-17.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 268–269 (Zhou back that day; the Politburo meeting that afternoon, Deng chairing, he conveys Mao''s views: Khrushchev has hardened, the summit will be wrecked, support him; mass meeting at Tiananmen; propaganda to hit Eisenhower)'
    units: A, B
- cite:
    id: cal.1960-05-20.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 269 (the rally of 1.2 million on the 20th, Zhu De, Soong Ching-ling, Zhou and Deng attending)'
    units: A
- cite:
    id: cal.1960-05-21.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 269–270 (Mao receives Kim Il Sung at Hangzhou on the 21st, who came to exchange views after the summit''s collapse; the first exchange of the two parties'' views on the CPSU after the 20th Congress)'
    units: B
- cite:
    id: cal.1960-05-22.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 270 (the Standing Committee at Hangzhou; Liu from Wuhan, Zhou and Deng from Peking with Kim, Chen Yun attending; Wu not there; on the summit''s collapse and Khrushchev)'
    units: B, C, D
- cite:
    id: cal.1960-06-02.soviet-union
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 273 (the CPSU Central Committee''s letter of June 2 proposes a Bucharest meeting of socialist parties during the Rumanian congress)'
    units: A
- cite:
    id: cal.1960-02.soviet-union-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 252 (Khrushchev visits India and Indonesia "in February," while the anti-China waves in both were high)'
    units: A
- cite:
    id: cal.1960-06-08.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 277 (the CPSU letter of June 7; the reply of June 10 sent unchanged, as it already proposed the postponement; the Standing Committee discussed and revised the reply before the Shanghai meeting)'
    units: E
- cite:
    id: cal.1960-06-08.china-leadership-4
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 277–278 (the meeting began on the 8th with a symposium under Liu; Zhou on the international situation (the summit''s collapse) and his tour with Chen Yi)'
    units: A, B
- cite:
    id: cal.1960-06-10.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 277–278 (the reply sent June 10 after the Standing Committee had revised it; Mao: prepare two ways, to be attacked and to be courted)'
    units: A
- cite:
    id: cal.1960-06-11.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 278–279 (Peng Zhen, left in Peking, called to Shanghai after the delegation was chosen, joined the Standing Committee''s talk on its line; Mao''s six phrases as Peng later told Wu)'
    units: B, C
- cite:
    id: cal.1960-06-17.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 278 (Mao speaks at the meeting on industry, commerce, agriculture and the communes)'
    units: B
- cite:
    id: cal.1960-06-18.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 278 (Mao''s talk "Ten-Year Summary" takes up relations with the CPSU: anti-revisionist propaganda to pause June to September; no polemic like the Lenin articles for four months; prepare for the fight at the parties'' meeting)'
    units: B
- cite:
    id: cal.1960-06-09.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 278 (before the meeting closed the Standing Committee named Peng Zhen to lead the delegation to the Romanian congress and the meeting of the parties at Bucharest)'
    units: B
- cite:
    id: cal.1960-06-23.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 283–285 (Mao called the Standing Committee that day, before the letter or the delegation''s account of the 22d arrived (the time differs five or six hours); Mao: the common ground shrinks, break neither wanted; Deng drafts the cable; no articles criticizing revisionism for two months)'
    units: B
- cite:
    id: cal.1960-07-05.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 308 (the conference July 5 to Aug. 10; its two matters, the economy''s adjustment and Sino-Soviet relations; attention went to the second; Wu the only one of the writers a member of the conference)'
    units: A, B
- cite:
    id: cal.1960-07-08.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 309–313 (Peng Zhen''s report on Bucharest at the conference''s second day, with seven points the discussion took up (two lines, war and peace, Khrushchev''s rage, the surprise attack, a long struggle, no fear of a break, the reply to the notification); Mao''s closing remarks on the counter-encirclement)'
    units: A
- variant:
    id: cal.1960-07-08.china-leadership
    unit: A
