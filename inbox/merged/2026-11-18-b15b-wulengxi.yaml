        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 291–293: all'
- add:
    entry:
      id: cal.1960-06-26.soviet-union-2
      when: June 26
      date: '1960-06-26'
      time_range:
      - 1960-06-26T03:00Z
      - 1960-06-26T06:00Z
      time_band: early morning
      time_zone: Europe/Bucharest
      thread: soviet-union
      also:
      - china-leadership
      c: 'Bucharest, the Romanian Workers'' Party''s headquarters, early morning. Peng Zhen''s delegation calls on Gheorghiu-Dej, most of the Romanian Politburo present: the meeting irregular, not as the CPSU''s letter of June 7 said; the communique to be amended. Gheorghiu-Dej: the Romanians did not want it so, and knew neither how it would be run nor of the CPSU''s notice; the Czechoslovaks gone home the night before, the Poles against making it so grave.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 293–294. Made public: 1999. See [[cal.1960-06-25.soviet-union]]. Names: Peng Zhen. Check: the account is the delegation''s.'
      tags:
      - polity:prc
      - name:peng-zhen
      - vis:only:prc+romania
      src:
        c: 1d4c0138
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 293–294: all'
- add:
    entry:
      id: cal.1960-06-26.soviet-union
      when: June 26
      date: '1960-06-26'
      time: 1960-06-26T09:00Z
      time_approx: true
      time_zone: Europe/Bucharest
      thread: soviet-union
      also:
      - china-leadership
      c: 'Bucharest, the meeting, near 11. Peng Zhen''s amendments to the communique refused by Khrushchev, "not a word"; near noon Peng says China will sign for unity, and the delegation hands its statement round. Khrushchev does not answer it; he proposes the parties'' meeting for the October Revolution''s anniversary, the drafting committee the twelve and ten more; China proposes Japan and Australia, agreed. Afternoon: Khrushchev''s rejoinder; Peng answers, on the "father party" and the forced signature, and they quarrel, Khrushchev on the long-wave station; at his call Zhivkov adds a dozen labels; Hysni Kapo of Albania: his Central Committee does not approve such a meeting. Gheorghiu-Dej closes, the communique adopted.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 294–298 ("near 11", 294). Made public: 1999. See [[cal.1960-06-26.soviet-union-2]]. Names: Khrushchev, Peng Zhen. Check: the day: Wu says "the next day" after the 25th; the account is the delegation''s.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - name:peng-zhen
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia
      src:
        c: 549561e1
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 294–298: all'
      follows:
      - cal.1960-06-26.soviet-union-2
- add:
    entry:
      id: cal.1960-06-30.china-leadership-3
      when: June 30
      date: '1960-06-30'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Politburo meeting, Mao presiding, Peng Zhen reporting on the Bucharest delegation. Taken as a surprise attack and an encounter; Mao: Khrushchev decided on June 2 to bring China to heel, the June 7 letter a deceit; a counter-encirclement, to stop short, as in the Central Soviet''s campaigns. The first round; a hard fight expected at the parties'' meeting in November. The Beidaihe work conference in July to take up Sino-Soviet relations; a circular to senior cadres on Bucharest; no polemic in print, unsigned or not, until the November meeting, current commentary on America and the nationalist states going on.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 298–300. Made public: 1999. Names: Mao Zedong, Peng Zhen. Check: the place: Mao was at Shanghai late June; Wu gives none.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-zhen
      - vis:only:prc
      src:
        c: 36d2505e
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 298–300: all'
- add:
    entry:
      id: cal.1960-07.china-leadership
      when: July, after the 18th
      date: 1960-07
      thread: china-leadership
      also:
      - soviet-union
      at: after 1960-07-18
      c: 'Beidaihe. The Politburo on the experts'' recall: to count on all experts gone, all equipment withheld, the treaties torn up. The 304 projects'' cost 15.2 billion rubles, 7.2 billion repaid, 7.9 billion owed, three-quarters of the debt for arms of the Korean War at half price; Zhou Enlai''s reckoning, at 500 million a year sixteen years, at 800 million ten; decided, five. Mao: the arms at the half price agreed, not a ruble short; the equipment too. Foreign-trade groups at the center and in the provinces to squeeze out goods.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 336–337. Made public: 1999. See [[cal.1960-07.china]]. Names: Zhou Enlai, Mao Zedong. Check: the day: Wu places it after the note of July 16 and before Zhou''s report of July 31; the Mao nianpu has Mao on July 31: pay it all next year.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 54ca1950
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 336–337: all'
