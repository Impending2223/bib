patch: 2026-11-18-b15b-wulengxi
by: 'Claude (batch 15, second wave: Wu Lengxi, Shinian lunzhan, the cite pass, Jan. 6, 1960 onward), Nov. 18, 2026'
ops:
- edit:
    id: cal.1960-01-07.china-leadership
    base: 9a7d2690
    set:
      when: Jan. 7
      c: 'Shanghai. The enlarged Politburo opens (to Jan. 17), Mao presiding: the Politburo, the provinces'' first secretaries, the central departments. Reports: Li Fuchun, the 1960 plan and the three- and eight-year projections (approved); Lin Biao, defense; Nie Rongzhen, science; Lu Dingyi, education. 1960 to be another leap: steel 18.4 million tons, grain 600 billion jin; Britain overtaken by 1962; in eight years, the four modernizations and the passage to ownership by the whole people. Mess halls, urban communes. Mao''s opening, Jan. 7: the plan above all; the "frontier" weapons to be had in eight years, "kept, not used"; against the Soviet textbook''s stress on material incentives.'
      src:
        c: e5bd5e3a
        rows:
        - 'w.zedong-mao-zedong-nianpu IV, Jan. 7, 1960: ?'
        - 'w.zhou-enlai-nianpu-1949 II, 277, Jan. 7–17, 1960: A'
- add:
    entry:
      id: cal.1960-01.china-leadership
      when: Jan., after the 17th
      date: 1960-01
      thread: china-leadership
      also:
      - soviet-union
      - china
      at: after 1960-01-17
      c: Several meetings of the Politburo Standing Committee after the Shanghai meeting, by Wu Lengxi's account. Unity with the USSR and the other socialist states, criticism for Yugoslavia only and by stages; the Propaganda Department to draft an article on the Yugoslav views for Lenin's ninetieth anniversary. Warsaw talks with the United States to go on, "talk without breaking, talk without hurry," no recognition yet; American spies held to be tried; border settlements to be sought with India and the other neighbors by mutual concession, Zhou Enlai to visit India in time.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 246–248. Made public: 1999. Names: Zhou Enlai. Check: the days; Wu gives none, only that they followed the Shanghai meeting and (p. 248) that Burma''s treaty of late January and Nepal''s of March carried them out.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
      src:
        c: 60cb64f3
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 246–248: all'
- add:
    entry:
      id: cal.1960-02-04.soviet-union
      when: Feb. 4
      date: '1960-02-04'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The Warsaw Treaty states'' summit, with Chinese observers. By the Chinese delegation''s report as Wu Lengxi gives it, Khrushchev blames China for the Indian border conflict and the Dalai Lama''s flight: they cost the Indian Communists Kerala and bred distrust of socialist states in South and Southeast Asia. He says he does not believe India the aggressor and will not study the details.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 250–251. Made public: 1999. See [[cal.1960-02-10.china-leadership]]. Names: Khrushchev. Check: the account is the delegation''s, at second hand.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania
      src:
        c: 91f4c2b8
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 250–251: all'
- add:
    entry:
      id: cal.1960-02-04.soviet-union-2
      when: Feb. 4
      date: '1960-02-04'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow, the reception after the Warsaw Treaty summit. Khrushchev, after some drink, on those who want the USSR to lead: it can give neither bread and butter nor moral and political support; communism is only a form, its content bread and butter. China''s "led by the USSR" is meant to watch him err and criticize; an old man not wise is a pair of old galoshes, thrown in a corner. "Now we go our own road." By the delegation''s report as Wu gives it.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 251–252. Made public: 1999. See [[cal.1960-02-04.soviet-union]]. Names: Khrushchev. Check: the day: Wu places the remarks at the reception of the summit and gives no separate date.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania
      src:
        c: 91f645cb
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 251–252: all'
- add:
    entry:
      id: cal.1960-02-22.china-leadership
      when: Feb. 22
      date: '1960-02-22'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking, the Yinian Tang. Mao convenes the Politburo Standing Committee on Khrushchev's attacks at the Warsaw Treaty summit. Taken as a sign he courts the West by turning on China, as with the Tass statement before the American trip and the cancelled atomic-sample agreement, and means to lower China's standing against his concessions. The diplomatic moves planned after Shanghai to be hurried; a counter to be prepared.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 252–253. Made public: 1999. See [[cal.1960-02-21.china-leadership]], [[cal.1960-02-26.china-leadership]]. Names: Mao Zedong, Khrushchev. Check: the day and place: the Mao nianpu has Mao at Canton on Feb. 21 and 26.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: ba432cb4
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 252–253: all'
