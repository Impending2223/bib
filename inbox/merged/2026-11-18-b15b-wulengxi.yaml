- add:
    entry:
      id: cal.1960-05.china-leadership-3
      when: May, after the 22nd
      date: 1960-05
      thread: china-leadership
      also:
      - soviet-union
      at: after 1960-05-22
      c: 'Peking. Deng Xiaoping reports the Hangzhou Standing Committee to the Secretariat; Wu Lengxi hears it. Khrushchev right to refuse Paris, but to Paris with conditions shows illusions; no world war from the summit''s failure; cold-war coexistence, ten or fifteen years, to be sought. Mao: Khrushchev two-sided, "semi-revisionist" (his first such word), a not very clever bourgeois politician; criticism internal, no public naming, "never the first under heaven"; *Renmin ribao*, Xinhua and radio to watch.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 270–273. Made public: 1999. See [[cal.1960-05-22.china-leadership]]. Names: Deng Xiaoping, Mao Zedong, Khrushchev. Check: the day: Wu says only that Deng reported on return to Peking.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: aa2659f0
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 270–273: all'
- add:
    entry:
      id: cal.1960-06-04.china-leadership-2
      when: June 4
      date: '1960-06-04'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The Secretariat, Deng Xiaoping presiding, on the CPSU letter of June 2. Agrees to a meeting on the common ground (the Moscow Declaration, Khrushchev''s line for the summit) and to shielding Khrushchev, on what base to be settled; suspects the meeting aims to attack China. No meeting now: put off to about November, August at the earliest; widen it to all parties as in 1957, with a drafting committee and a Sino-Soviet joint group; at Bucharest only talks. Deng: spread the views of the Lenin articles. A reply to be drafted at Peking and finished at Shanghai.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 273–276. Made public: 1999. See [[cal.1960-06-02.soviet-union]]. Names: Deng Xiaoping, Khrushchev. Check: the day: Wu writes 4 June.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: bd776e73
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 273–276: all'
- add:
    entry:
      id: cal.1960-06-05.china-leadership
      when: June 5
      date: '1960-06-05'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. Deng Xiaoping, Liu Shaoqi and Zhou Enlai attend the Central Committee's symposium with the heads of the communist and workers' parties among the delegations to the World Federation of Trade Unions' council. Liu Ningyi, heading the Chinese delegation, states China's views; Grishin, heading the Soviet delegation, objects, refuses Deng's explanation and Liu's and Zhou's plea to stay, and walks out.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 276. Made public: 1999. See [[cal.1960-06.china]]. Names: Deng Xiaoping, Liu Shaoqi, Zhou Enlai. Check: Wu has it from Yang Shangkun, not an eyewitness; the Soviet side later made the walkout a ground of complaint (p. 276).'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:liu-shaoqi
      - name:zhou-enlai
      - vis:only:prc+ussr
      src:
        c: 843c8512
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 276: all'
- add:
    entry:
      id: cal.1960-06.china-leadership-2
      when: June, after the 4th
      date: 1960-06
      thread: china-leadership
      also:
      - soviet-union
      at: after 1960-06-04
      c: 'Peking. Hu Qiaomu and Wu Lengxi begin the Center''s reply to the CPSU letter at the Secretariat meeting: two proposals, to widen the conference to the world''s parties and put it off to about the revolution anniversary, and a drafting committee with a Sino-Soviet joint group. Mao telephones from Hangzhou: the Shanghai meeting is to take up the CPSU letter as well; Deng takes the writers to Shanghai ahead.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 276–277. Made public: 1999. Names: Deng Xiaoping, Mao Zedong. Check: the days; Zhou flew to Shanghai June 7 ([[cal.1960-06-07.china-leadership-2]]).'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:mao-zedong
      - vis:only:prc
      src:
        c: c08f0ded
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 276–277: all'
- add:
    entry:
      id: cal.1960-06-12.china-leadership-2
      when: June 12
      date: '1960-06-12'
      thread: china-leadership
      also:
      - soviet-union
      c: Shanghai. Liu Shaoqi informs the work conference of the Standing Committee's view of the CPSU's letters and of China's reply.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 278. Made public: 1999. See [[cal.1960-06-10.china-leadership]]. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
      src:
