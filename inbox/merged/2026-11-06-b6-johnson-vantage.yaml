      when: Jan. 31
      date: '1967-01-31'
      thread: space-apollo
      c: 'Arlington, the funerals of the Apollo astronauts: Grissom in the morning, Chaffee in the afternoon, Johnson at both.
        Lady Bird Johnson at West Point for White''s.'
      n: '[[w.johnson-vantage-point]], 271. Names: Grissom, Chaffee, Edward White, Johnson, Lady Bird Johnson.'
      src:
