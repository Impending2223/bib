      when: Mar. 6
      date: '1968-03-06'
      thread: vietnam-205000
      c: Rusk has an assistant draft a cable to Bunker describing the bombing cutback and asking his judgment. He and Johnson
        hold it back, lest the initiative become known before it is tried, by Johnson's account.
      n: '[[w.johnson-vantage-point]], 401. See [[cal.1968-03-04.vietnam]]. Names: Rusk, Bunker, Johnson.'
