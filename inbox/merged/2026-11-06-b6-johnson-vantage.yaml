      date: '1968-03-29'
      thread: vietnam-205000
      also:
      - vietnam-saigon
      c: 'The morning. Johnson receives Bunker''s thirty-fourth weekly report: the Vietnamese mobilizing; "U.S. and government
        forces increasingly took the initiative last week while the level of enemy activity declined"; pacification reviving.'
      n: '[[w.johnson-vantage-point]], 421. Check: the report''s date; its text. Names: Johnson, Bunker.'
