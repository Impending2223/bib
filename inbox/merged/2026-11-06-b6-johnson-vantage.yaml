- add:
    entry:
      id: cal.1967-06-04.middle-east-six-day-war
      when: June 4
      date: '1967-06-04'
      thread: middle-east-six-day-war
      c: 'The declaration on innocent passage through the Gulf of Aqaba, sought with the British: eight countries agreed by
        June 4, the United States, Britain, Israel, the Netherlands, Australia, Iceland, Belgium and New Zealand; West Germany,
        Argentina, Portugal, Canada and Panama still studying it, by Johnson''s account.'
      n: '[[w.johnson-vantage-point]], 296.'
      src:
        rows:
        - 'w.johnson-vantage-point 296: all'
        c: 4e6a06f2
- add:
    entry:
      id: cal.1967-06-29.poverty
      when: June 29
      date: '1967-06-29'
      thread: poverty
      c: 'Philadelphia, 10:12 a.m. Johnson at Leon Sullivan''s Opportunities Industrialization Center, Sullivan his guide:
        "I believe we are going to make it." He signs there the bill enlarging the Teacher Corps.'
      n: 'Remarks in Philadelphia at the Opportunities Industrialization Center, [1967 Pub. Papers 664](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=732)
        (June 29, 1967). [[w.johnson-vantage-point]], 85 (the visit; 1,500 enrolled, 10,000 waiting). Names: Johnson.'
      src:
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=732: all'
        - 'w.johnson-vantage-point 85: A'
        c: 5e24c7b2
      tags:
      - name:johnson-lyndon-b
      - state:pa
      - city:philadelphia
- add:
    entry:
      id: cal.1967-08-02.economy-surcharge
      when: Aug. 2
      date: '1967-08-02'
      thread: economy-surcharge
      c: 'The tax message''s final draft, worked over with Mills, by Johnson''s account. Mills had objected to a passage that
        seemed to promise more spending; the final text: "we must move with determination to assure that those for whom these
        programs were begun are not robbed by the inflation that would accompany an unacceptable deficit."'
      n: '[[w.johnson-vantage-point]], 446–47. See [[cal.1967-08-03.economy]]. Names: Mills, Johnson.'
      src:
        rows:
        - 'w.johnson-vantage-point 446–47: all'
        c: 88b96a63
      tags:
      - name:mills-wilbur-d
      - name:johnson-lyndon-b
