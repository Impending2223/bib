patch: 2026-11-06-b6-johnson-vantage
by: Claude (batch 6 reader, Johnson, The Vantage Point; R18 as amended Nov. 6, 2026)
ops:
- add:
    entry:
      id: cal.1963-11-22.succession-16
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'The Executive Office Building, at night, by Johnson''s account. Johnson to McNamara: if he ever tries to quit, Johnson
        will send the White House police after him.'
      n: '[[w.johnson-vantage-point]], 20. Names: Johnson, McNamara.'
      src:
        rows:
        - 'w.johnson-vantage-point 20: all'
        c: 7a119627
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- cite:
    id: cal.1963-11-22.succession-14
    item: '[[w.johnson-vantage-point]], 26 (Carpenter: "the salvation of Texas is that the Governor was hit"; Lady Bird Johnson:
      "I only wish it could have been me"; told Johnson at home that night)'
- add:
    entry:
      id: cal.1963-11-26.succession-4
      when: Nov. 26
      date: '1963-11-26'
      thread: succession
      c: 'Jacqueline Kennedy to Johnson, by letter: thanks for walking behind the President''s coffin to the church, "You
        did not have to do that—I am sure many people forbid you to take such a risk—but you did it anyway."'
      n: '[[w.johnson-vantage-point]], 33 n. Names: Jacqueline Kennedy, Johnson.'
      src:
        rows:
        - 'w.johnson-vantage-point 33: all'
        - 'via w.johnson-vantage-point 33 n.star: all'
        c: 3c396fae
      tags:
      - name:kennedy-jacqueline
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-02-05.cuba
      when: Feb. 5–6
      date: '1964-02-05'
      thread: cuba
      c: 'Johnson in New York, engagements accepted earlier: the Joseph P. Kennedy, Jr., Foundation''s awards dinner, the
        Americana, 9:33 p.m.; the Weizmann Institute''s dinner, the Waldorf-Astoria, Feb. 6. In touch by telephone with Rusk
        on the seized Cuban fishing boats, by Johnson''s account; Salinger with him.'
      n: 'Remarks at the Joseph P. Kennedy, Jr., Foundation Awards Dinner, [1963–64 Pub. Papers 269](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=353)
        (Feb. 5, 1964); Remarks at the Dinner of the Weizmann Institute of Science, [1963–64 Pub. Papers 270](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=354)
        (Feb. 6, 1964). [[w.johnson-vantage-point]], 185 (the trip; Rusk by telephone). See [[cal.1964-02-06.cuba]]. Names:
        Johnson, Rusk, Salinger.'
      src:
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=353: A'
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=354: A'
        - 'w.johnson-vantage-point 185: A-B'
        c: b4fb3f3b
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:salinger-pierre
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1964-04-01.cuba
      when: Apr. 1
      date: '1964-04-01'
      thread: cuba
      also:
      - defense
      c: Guantánamo. Construction begins on the base's own desalination plant, after Cuba's cutting off of the water; finished
        by early December. The Cuban work force, 2,000, released within the year.
      n: '[[w.johnson-vantage-point]], 186. See [[cal.1964-02-06.cuba]].'
      src:
        rows:
        - 'w.johnson-vantage-point 186: all'
        c: aa84bf99
- add:
    entry:
      id: cal.1965-01.medicare-2
      when: Jan., the last days
      date: 1965-01
      thread: medicare
      c: Ways and Means begins its meetings on the hospital insurance bill, H.R. 1, King's. Mills sets Mar. 15 as the target
        date for sending it to the floor.
      n: '[[w.johnson-vantage-point]], 214–15. Check: the day. Names: Mills.'
      src:
        rows:
        - 'w.johnson-vantage-point 214–15: all'
        c: daece60f
      tags:
      - name:mills-wilbur-d
- add:
    entry:
      id: cal.1965-03-14.voting-rights-3
      when: Mar. 14
      date: '1965-03-14'
      thread: voting-rights
      c: 'Sunday morning, by Johnson''s account. The Justice Department''s draft of the voting rights bill nearly done: federal
        registrars and trigger provisions, the criteria for sending them in, decided. Left open: the message in person or
        in writing.'
      n: '[[w.johnson-vantage-point]], 163. See [[cal.1965-03-14.voting-rights-2]]. Names: Johnson.'
      src:
        rows:
        - 'w.johnson-vantage-point 163: all'
        c: b8cc8ecd
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-07-27.medicare-2
      when: July 27
      date: '1965-07-27'
      thread: medicare
      c: 'Johnson telephones Truman, 3:15 p.m., to arrange a visit: he means to sign Medicare in Truman''s presence at the
        Truman Library, before the end of July, by Johnson''s account.'
      n: '[[w.johnson-vantage-point]], 219. To check: [Johnson and Truman, 3:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-truman-office-secretary-and-marvin),
        Conversation WH6507-08-8404 (Miller Center). Names: Johnson, Truman.'
      src:
        rows:
        - 'w.johnson-vantage-point 219: all'
        c: 8baef037
      tags:
      - name:johnson-lyndon-b
      - name:truman-harry-s
- add:
    entry:
      id: cal.1966-06-07.vietnam-elections
      when: June 7
      date: '1966-06-07'
      thread: vietnam-elections
      c: Saigon. The Election Law Drafting Committee, meeting since May, submits to the government its proposed rules for
        electing a constituent assembly.
      n: '[[w.johnson-vantage-point]], 247. Check: the day the rules were submitted.'
      src:
        rows:
        - 'w.johnson-vantage-point 247: all'
        c: a172d040
