    entry:
      id: cal.1961-01-21.laos
      when: Jan. 21
      date: '1961-01-21'
      thread: laos
      also:
      - vietnam-congress-mansfield
      c: 'Mansfield, the new majority leader, to Kennedy by memorandum, the first of two (the second Jan. 23): neutralize Laos, in the pattern of Burma or Cambodia, under a commission of Asians alone, India, Pakistan and Afghanistan; cut military aid, the French training mission to replace the American. Otherwise no way to limit the commitment or avoid a SEATO involvement. The plan may let the United States out of "an untenable over-commitment."'
      n: '[[w.gibbons-u-s-government-and]], II, 10. Check: Gibbons quotes the two memoranda together; which says what not given. To check: Mansfield to Kennedy, Jan. 21 and 23, 1961, POF Country File, Laos, Kennedy Library (cited by [[w.gibbons-u-s-government-and]], II, 10 n.22). See [[cal.1961-01-07.laos-2]]. Names: Mansfield, Kennedy.'
      src:
        c: 9db92054
        rows:
        - 'w.gibbons-u-s-government-and II, 10: all'
        - 'via w.gibbons-u-s-government-and II, 10 n.22a: all'
        - 'via w.gibbons-u-s-government-and II, 10 n.22b: all'
