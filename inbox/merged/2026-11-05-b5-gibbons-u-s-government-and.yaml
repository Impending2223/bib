- edit:
    id: cal.1963-10-05.vietnam-2
    base: 33d9ef46
    set:
      c: 'The Cabinet Room, a Saturday: Kennedy with Johnson, Rusk, McNamara, Harriman, Taylor, McCone, Bell, Bundy and Forrestal on the McNamara–Taylor report and Lodge''s instructions. The Commodity Import Program''s suspension weighed. No formal or public statement. Rusk and McNamara, before committees in executive session the next week, to say only that the programs are under continuing review. The withdrawal of 1,000 advisers by December not raised formally with Diệm, but carried out "routinely." Kennedy, recorded: if the war is going badly, a formal announcement "would seem illogical"; do it "by rotation."'
      n: '[FRUS 1961–63, IV, doc. 179](https://history.state.gov/historicaldocuments/frus1961-63v04/d179) (Forrestal''s memorandum: 9:30 a.m.); [doc. 181](https://history.state.gov/historicaldocuments/frus1961-63v04/d181) (telegram 534 to Lodge). [John F. Kennedy, David E. Bell, McGeorge Bundy and others, 11 a.m.](https://prde.upress.virginia.edu/conversations/4022295), JFK Meeting Tape 114_A50.2 (PRDE only). [[w.selverstone-kennedy-withdrawal]], 184–86 (the meeting; the thousand by rotation, from the Miller Center''s draft transcript); [[w.mcnamara-in-retrospect]], ch. 3 at n.41 (Kennedy approves the report''s section on coup planning: "no initiative should be taken to encourage actively a change in government"; instructions by the CIA''s channels). [[w.reeves-president-kennedy]], 615–16 (the import program; no statement). [[w.gibbons-u-s-government-and]], II, 188 (the meeting; no statement; the testimony; the withdrawal). Check: the hour (Forrestal gives 9:30 a.m., PRDE 11 a.m.); the recording not heard. Made public: FRUS 1961–63, IV (1991). See [[cal.1963-10-02.vietnam]]. Names: Kennedy, Johnson, Rusk, McNamara, Harriman, Taylor, McCone, Bell, Bundy, Forrestal, Lodge, Ngô Đình Diệm.'
