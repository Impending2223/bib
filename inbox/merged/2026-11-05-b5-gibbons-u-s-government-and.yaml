      c: 'Foreign Relations reports the foreign aid bill with a substitute for Church''s amendment: aid to South Vietnam extended or withheld at the President''s discretion, to further "victory in the war against communism" and the Americans'' return home. Its report: the more drastic steps of Church''s S. Res. 196 to be considered if the political situation worsens.'
