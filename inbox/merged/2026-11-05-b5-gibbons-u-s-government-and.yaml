- edit:
    id: cal.1964-12-01.vietnam
    base: d21185c7
    set:
      c: 'Taylor and the principals with Johnson. A first phase approved for thirty days: armed reconnaissance and air strikes against the infiltration routes in Laos, reprisals for any major attack. A second phase, direct military pressure on the North, "after the GVN has shown itself firmly in control." Johnson: tell a few members, "Give good and bad"; Rusk to see Fulbright, Hickenlooper, Saltonstall and Russell, and in the House Mahon, perhaps Ford. Taylor''s instructions, Dec. 3.'
      n: 'FRUS 1964–68, I, docs. [432](https://history.state.gov/historicaldocuments/frus1964-68v01/d432), [433](https://history.state.gov/historicaldocuments/frus1964-68v01/d433), [434](https://history.state.gov/historicaldocuments/frus1964-68v01/d434), [435](https://history.state.gov/historicaldocuments/frus1964-68v01/d435); [FRUS 1964–68, XXVIII, doc. 148](https://history.state.gov/historicaldocuments/frus1964-68v28/d148). [[w.gibbons-u-s-government-and]], II, 374–76, 379; [[w.cosmas-joint-chiefs-of-staff-2012]], 180–182, 189; [[w.dallek-flawed-giant]], 241–42; [[w.moyar-triumph-forsaken]], 341–42; [[w.macv-command-history-1964]], 162 (Taylor''s talks in Washington, Dec. 1, a phased program); [[w.mcnamara-in-retrospect]], ch. 6 at nn.17–18 (Humphrey present; the options; Johnson: "I am hesitant to sock my neighbor if my fever is 104 degrees"; Taylor: "I doubt that Hanoi will slap back"). [[w.ball-past-has-another-pattern]], 388–89 (the first phase approved, the second conditioned on Saigon''s reforms); [[w.branch-pillar-of-fire]], 543. To check: [[w.pentagon-papers]], II, 422; III, 247–59 (cited by [[w.branch-pillar-of-fire]], 543). See [[cal.1964-11-01.vietnam]]. Names: Taylor, Johnson, Rusk, Fulbright, Hickenlooper, Saltonstall, Russell, Mahon, Ford. Check: Moyar, 341, dates Johnson''s decision Nov. 29, quoting him from the notes of the meeting of Dec. 1.'
