      id: cal.1964-07-02.black-nationalism
      when: July 2
      date: '1964-07-02'
      thread: black-nationalism
      c: 'Los Angeles. Evelyn Williams and Lucille Rosary, former secretaries, file paternity suits against Elijah Muhammad;
        their counsel Gladys Towles Root, retained at Malcolm X''s instance. Malcolm X escapes assailants with knives outside
        his home: "I''m trying to stay alive."'
      n: '[[w.branch-pillar-of-fire]], 384–85. To check: Perry, Malcolm, pp. 305-8 (cited by [[w.branch-pillar-of-fire]],
        384); [[w.goldman-death-and-life-of]], 203–4 (cited by [[w.branch-pillar-of-fire]], 384); Domestic Intelligence Division
        unsigned cover note to teletype dated July 4, 1964, FMX-126 (cited by [[w.branch-pillar-of-fire]], 384); Perry, Malcolm,
        p. 306 (cited by [[w.branch-pillar-of-fire]], 385). See [[cal.1964-06-28.black-nationalism]]. Names: Muhammad, Malcolm
        X.'
      src:
        c: 35ad6344
        rows:
        - 'w.branch-pillar-of-fire 384–85: all'
        - 'via w.branch-pillar-of-fire 384 n.filed-paternity-suits: all'
