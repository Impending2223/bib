      c: 'New York. The FBI''s intercept on King''s lodging and its tap on Rustin: King''s camp expects Johnson to keep the
        white South''s hope; King weighs staying away from the meeting. DeLoach''s summaries to the White House: King told
        to "speak up to the President."'
      n: '[[w.branch-pillar-of-fire]], 453. To check: King and his family were staying with Justine and Louis Smad- beck,
        friends of Coretta King. Garrow, FBI and Martin, p. 118 (cited by [[w.branch-pillar-of-fire]], 453); Coretta King,
        My Life, p. 251 (cited by [[w.branch-pillar-of-fire]], 453); [[w.garrow-bearing-the-cross]], 346 (cited by [[w.branch-pillar-of-fire]],
        453); NY LHM dated Aug. 20, 1964, FR-NR (cited by [[w.branch-pillar-of-fire]], 453). See [[cal.1964-08-17.king]].
        Names: King, Rustin, DeLoach.'
