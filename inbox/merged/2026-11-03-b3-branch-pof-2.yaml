      when: Oct. 22
      date: '1964-10-22'
      thread: testing
      also:
      - mississippi
      c: Near Hattiesburg, Miss., the Atomic Energy Commission detonates a 5-kiloton device underground, the first nuclear
        test east of the Mississippi; residents evacuated. The surface lifted ten inches.
      n: '[[w.branch-pillar-of-fire]], 442 n.. To check: New York Times, Oct. 23, 1964, p. 2. Also NYT, Oct. 12, 1964, p.
        23, Oct. 13, 1964, p. 86, Oct. 27, 1964, p. 77, Oct. 29, 1964, p. 70, Nov. 18, 1964, p. 30. “Officials refused to
        go ahead with the test until wind conditions were right,” the Times reported on Oct. 23, “in view of the possibility
        that the explosion might crack the earth and permit radioactivity to escape....On the surface of the blast site were
        a collection of instruments, a Confederate battle flag, and a small sign that read, “The South Shall Rise Again.’”
        (cited by [[w.branch-pillar-of-fire]], 442).'
