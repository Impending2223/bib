        library closed again on a second group.
      n: '*Adickes v. S. H. Kress & Co.*, [398 U.S. 144](https://tile.loc.gov/storage-services/service/ll/usrep/usrep398/usrep398144/usrep398144.pdf)
        (1970). [[w.branch-pillar-of-fire]], 449–50. To check: Interview with Sandra Adickes, June 25, 1994. Adickes, a young
        teacher of four years’ experience in New York City elementary schools, had been introduced to movement-style education
        in 1963 as a volunteer in Prince Edward County, Virginia, where public schools had been closed since 1959 to avoid
        integration. Smith, Closed Their Schools, passim (cited by [[w.branch-pillar-of-fire]], 449); [[w.branch-parting-the-waters]],
        413 (cited by [[w.branch-pillar-of-fire]], 449); New York Times, Aug. 15, 1964, p. 22 (cited by [[w.branch-pillar-of-fire]],
        449); Holt, The Summer, p. 239. Mayor Pittman told reporters that routine inventory would be completed over the weekend,
        but he closed the library indefinitely when a second group of Freedom Schoolers presented themselves Monday morning.
        NYT, Aug. 19, 1964, p. 26 (cited by [[w.branch-pillar-of-fire]], 449); Adickes v. S. H. Kress & Co. 398 US. 144 (1970)
