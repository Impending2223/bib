      id: cal.1964-08-06.poverty
      when: Aug. 6
      date: '1964-08-06'
      thread: poverty
      c: 'Mahon to Johnson by telephone: "this Adam Yarmanlisky [sic], whatever his name is, he is not an asset." Shriver,
        in McCormack''s office with the Southern holdouts, that only the President can hire and fire; McCormack: "That isn''t
        going to satisfy those people." Shriver, from a hallway telephone, is told to settle it himself.'
      n: '[[w.branch-pillar-of-fire]], 444. To check: [Conversation with GEORGE MAHON, 9:30 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-mahon-august-6-1964),
        Conversation WH6408-08-4770 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 444); Interview with Sargent Shriver,
        Feb. 21, 1991 (cited by [[w.branch-pillar-of-fire]], 444); Lemann, The Promised Land, a ee : Yarmolinsky had spearheaded:
        Interview with Robert McNamara, June 18, 1991 (cited by [[w.branch-pillar-of-fire]], 444); “We seriously objected
        to Adam Yarmolinsky...we knew something about his own background ... [wanted] to be sure that we had a person who
        was not controversial, who would not become controversial.... They did get rid of Mr. Yarmolinsky.” Rep. L. H. Fountain
        (D.-N.C.) Oral History, July 15, 1969, pp. 16-17, LBJ Library (cited by [[w.branch-pillar-of-fire]], 444). See [[cal.1964-08-01.poverty]].
        Names: Mahon, Johnson, Yarmolinsky, Shriver, McCormack.'
      src:
        c: 24a5c38a
        rows:
        - 'w.branch-pillar-of-fire 444: all'
        - 'via w.branch-pillar-of-fire 444 n.johnson-knew: all'
        - 'via w.branch-pillar-of-fire 444 n.shriver-squirmed: all'
        - 'via w.branch-pillar-of-fire 444 n.from-a-phone-in: all'
        - 'via w.branch-pillar-of-fire 444 n.ouster-of-adam-yarmolinsky.a: all'
        - 'via w.branch-pillar-of-fire 444 n.ouster-of-adam-yarmolinsky.b: all'
        - 'via w.branch-pillar-of-fire 444 n.bellwether-symbol-of-controversy: all'
      tags:
      - name:mahon-george-h
      - name:johnson-lyndon-b
      - name:yarmolinsky-adam
      - name:shriver-r-sargent
      - name:mccormack-john-w
- add:
