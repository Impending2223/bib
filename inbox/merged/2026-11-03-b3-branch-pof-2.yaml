      when: Aug. 7
      date: '1964-08-07'
      thread: poverty
      c: 'Shriver tells the holdout Democrats he will not recommend Yarmolinsky for a post; their votes carry the poverty
        bill that night. Shriver to Yarmolinsky: "Well, we''ve just thrown you to the wolves, and this is the worst day in
        my life." Halleck holds out for an embossed copy, putting the vote off a day.'
      n: '[[w.branch-pillar-of-fire]], 445. To check: New York Times, Aug. 7, 1964, p. 1 (cited by [[w.branch-pillar-of-fire]],
        445); Adam Yarmolinsky Oral History, July 13, 1970, pp. 17-19, LBJ. (“Tt was like a funeral in the offices when we
        heard Shriver had caved in,” recalled one of Shriver’s deputies at the poverty task force. Interview with Hyman Bookbinder,
        March 21, 1991.) (cited by [[w.branch-pillar-of-fire]], 445). See [[cal.1964-08-06.poverty]]. Names: Shriver, Yarmolinsky,
        Halleck.'
