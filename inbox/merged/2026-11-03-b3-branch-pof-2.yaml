      date: '1964-07-06'
      thread: black-nationalism
      c: Chicago. Hassan Sharrieff, Elijah Muhammad's grandson, testifies in open court that the Nation's enforcers beat Muslims
        of independent mind; he and Wallace Muhammad, the leader's son, go to the police and the FBI for protection.
      n: '[[w.branch-pillar-of-fire]], 385. Check: the day of the testimony; Branch: "Within a week of the Los Angeles filing"
        (385), the Chicago Daily Defender reporting it July 6. To check: Chicago Daily Defender, July 6, 1964, pp. 1, 8, CDD,
        July 9, 1964, p. 3 (cited by [[w.branch-pillar-of-fire]], 385); Chicago Daily Defender, July 8, 1964, p. 12 (cited
        by [[w.branch-pillar-of-fire]], 385); Statement of Hassan Sharrieff at 3rd District police station, dated June 23,
        1964, plus two memos dated July 8, 1964, “Muslims-Chicago Branch,” RS File No. 589, CHS (cited by [[w.branch-pillar-of-fire]],
        385); SAC, Chicago, to Director, July 10, 1964, FMXNY-4711 (cited by [[w.branch-pillar-of-fire]], 385); Chicago LHM
        dated July 10, 1964, FMXNY-4710 (cited by [[w.branch-pillar-of-fire]], 385); SAC, Chicago, to Director, July 23, 1964,
        FMXNY-4766, pp. 7-8 (cited by [[w.branch-pillar-of-fire]], 385); Chicago Daily Defender, July 8, 1964, p. 3 (cited
        by [[w.branch-pillar-of-fire]], 385). See [[cal.1964-07-02.black-nationalism]]. Names: Muhammad.'
