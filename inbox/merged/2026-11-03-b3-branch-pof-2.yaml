    entry:
      id: cal.1964-07-01.desegregation-public-places
      when: July 1
      date: '1964-07-01'
      thread: desegregation-public-places
      c: 'St. Augustine, Trinity Church. Bishop Hamilton West, of the Episcopal Diocese of Florida, to the vestry: rebukes
        the locked doors against "certain persons"; rejects the vestry''s 9–1 vote asking the rector, Charles Seymour, to
        resign. Vestryman Tebeault, owner of the local paper, resigns from the Episcopal Church; two vestrymen follow.'
      n: '[[w.branch-pillar-of-fire]], 382–83. To check: Bishop West to Rev. Seymour, July 1, 1964, SAHS (cited by [[w.branch-pillar-of-fire]],
        382); [[w.colburn-racial-change-and-community]], 170–72, 172 (cited by [[w.branch-pillar-of-fire]], 383); Notes of
        Trinity Parish Church vestry meeting, July 1, 1964, 4:30 p.m., Colburn Papers, UF (cited by [[w.branch-pillar-of-fire]],
        383). See [[cal.1964-06-30.desegregation-public-places]].'
      src:
        c: 064bdbbb
        rows:
        - 'w.branch-pillar-of-fire 382–83: all'
        - 'via w.branch-pillar-of-fire 382 n.outside-influences-have-created: all'
        - 'via w.branch-pillar-of-fire 383 n.either-that-or-be: all'
      tags:
      - state:fl
      - city:st-augustine
