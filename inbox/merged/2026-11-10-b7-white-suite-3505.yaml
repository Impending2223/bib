- add:
    entry:
      id: cal.1964-06-08.goldwater-2
      when: June 8
      date: '1964-06-08'
      thread: goldwater
      also:
      - elections-1964
      c: 'Cleveland, the Sheraton. Goldwater to the Governors'' Conference banquet, greeted by many who had sought another
        candidate. Asked whether he will answer the Republican governors'' questions, as Romney and Scranton had proposed:
        all Republicans know his views. At the banquet with Eisenhower and the governors, Scranton and Rockefeller among them.
        By White''s account.'
      n: '[[w.white-suite-3505]], 367. See [[cal.1964-06-07.states-and-cities-us]]. Names: Goldwater, Romney, Scranton, Eisenhower,
        Rockefeller.'
      tags:
