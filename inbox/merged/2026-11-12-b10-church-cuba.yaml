patch: 2026-11-12-b10-church-cuba
by: Claude (batch 10 reader, Sonnet; S. Rep. 94-465, the Cuba chapter, pp. 71–180, and "Executive Action," pp. 181–89, AARC
  chapter PDFs); audited and corrected by the batch 10 auditor (Opus), Nov. 12, 2026, every op read on the page image
ops:
- add:
    entry:
      id: cal.1960-11-25.cuba
      when: Nov. 25
      date: '1960-11-25'
      thread: cuba
      c: 'Eisenhower, 10:40 a.m., with Gray present: operations in another country; "there was also some discussion of Cuba."
        Dulles then alone with the President, ten minutes.'
      n: '[[w.sen-church-alleged-assassination-plots]], 112 n.1 (Gray''s memorandum of Nov. 28, 1960; the one time in the
        fall of 1960 that Dulles was alone with Eisenhower). Made public: the Church Committee''s interim report, Nov. 20,
        1975. To check: Memorandum, Nov. 28, 1960, by Gordon Gray, of Meeting with the President, Nov. 25, 1960, at 10:40
        a.m., Eisenhower Library (cited by [[w.sen-church-alleged-assassination-plots]], 112 n.1). Names: Eisenhower, Dulles,
        Gray.'
      tags:
      - name:eisenhower-dwight-d
      - name:dulles-allen-w
      - name:gray-gordon
- add:
    entry:
      id: cal.1960-02-25.middle-east
      when: Feb. 25
      date: '1960-02-25'
      thread: middle-east
      c: 'The CIA''s Near East Division asks the "Health Alteration Committee" to endorse a "special operation" to "incapacitate"
        an Iraqi colonel believed to be "promoting Soviet bloc political interests in Iraq": a technique "certain to prevent
        the target from pursuing his usual activities for a minimum of three months." "We do not consciously seek subject''s
        permanent removal from the scene; we also do not object should this complication develop."'
      n: '[[w.sen-church-alleged-assassination-plots]], 181 n. (Memo, Acting Chief, Near East Division, to DC/CI, Feb. 25,
        1960). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Acting Chief, N.E. Division,
        to DC/CI, Feb. 25, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 181 n.).'
      tags: []
- add:
    entry:
      id: cal.1960-04.middle-east
      when: Apr.
      date: 1960-04
      thread: middle-east
      c: 'The "Health Alteration Committee," unanimously, to the Deputy Director for Plans: a "disabling operation" against
        the Iraqi colonel, the Chief of Operations advising it "highly desirable." Barnes approves for Bissell. The operation
        approved: a monogrammed handkerchief with an incapacitating agent, to be mailed to the colonel from an Asian country.'
      n: '[[w.sen-church-alleged-assassination-plots]], 181 n. (Memo, Deputy Chief CI to DDP, dated as printed "4/1/62";
        the mailing, by Scheider''s recollection, undated; the CIA, 1975: the handkerchief "in fact never received (if, indeed,
        sent)"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Deputy Chief CI to DDP
        (cited by [[w.sen-church-alleged-assassination-plots]], 181 n.). See [[cal.1960-02-25.middle-east]]. Names: Barnes,
        Bissell. Check: the day; the memorandum''s year printed 1962.'
      tags: [name:barnes-c-tracy, name:bissell-richard-m-jr]
- add:
    entry:
      id: cal.1961-07-21.cuba
      when: July 21
      date: '1961-07-21'
      thread: cuba
      c: The Special Group agrees that "the basic objective toward Cuba was to provide support to a U.S. program to develop
        opposition to Castro and to help bring about a regime acceptable to the U.S."
      n: '[[w.sen-church-alleged-assassination-plots]], 135–36 (Memo for the Record, July 21, 1961; occasional harassment
        operations through the summer, "no overall strategy and little activity"). Made public: the Church Committee''s interim
        report, Nov. 20, 1975. To check: Memo for the Record, July 21, 1961 (cited by [[w.sen-church-alleged-assassination-plots]],
        136). Names: Castro. Check: the day (the memorandum''s, not the meeting''s).'
      tags:
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-10-05.cuba
      when: Oct. 5
      date: '1961-10-05'
      thread: cuba
      c: 'Bundy to the Secretary of State, NSAM 100, "Contingency Planning for Cuba": "In confirmation of oral instructions
        conveyed to Assistant Secretary of State Woodward, a plan is desired for the indicated contingency."'
      n: '[[w.sen-church-alleged-assassination-plots]], 136 ("stated in full"; the contingency, by the Committee''s account,
        Castro''s removal from the Cuban scene). To check: NSAM 100, Oct. 5, 1961, Bundy to the Secretary of State (cited
        by [[w.sen-church-alleged-assassination-plots]], 136). See [[cal.1961-10.cuba]]. Names: Bundy, Woodward.'
      tags:
      - name:bundy-mcgeorge
      - name:woodward-robert-f
- add:
    entry:
      id: cal.1961-10-05.cuba-2
      when: Oct. 5
      date: '1961-10-05'
      thread: cuba
      c: 'Parrott, secretary of the Special Group, to the Deputy Assistant Secretary for Latin American Affairs: "what was
        wanted was a plan against the contingency that Castro would in some way or other be removed from the Cuban scene";
        "the presence and positions of Raul (Castro) and Che Guevara must be taken into account." Taylor, by Parrott, preferred
        "the President''s interest in the matter not be mentioned." Parrott asks Barnes of the CIA for an up-to-date report
        on "what is going on and what is being planned."'
      n: '[[w.sen-church-alleged-assassination-plots]], 136 (Parrott, memorandum for the record, Oct. 5, 1961; Parrott, 1975:
        removal by means "short of being killed," 137). Made public: the Church Committee''s interim report, Nov. 20, 1975.
        To check: Memorandum for the Record, Parrott, Oct. 5, 1961 (cited by [[w.sen-church-alleged-assassination-plots]],
        136). See [[cal.1961-10-05.cuba]]. Names: Castro, Raúl Castro, Guevara, Taylor, Barnes.'
      tags: [name:castro-fidel, name:castro-raul, name:guevara-ernesto, name:taylor-maxwell, name:barnes-c-tracy]
- add:
    entry:
      id: cal.1961-10-06.cuba
      when: Oct. 6
      date: '1961-10-06'
      thread: cuba
      c: 'The Special Group told that, besides an overall plan for covert operations in Cuba, "a contingency plan in connection
        with the possible removal of Castro from the Cuban scene" is in preparation.'
      n: '[[w.sen-church-alleged-assassination-plots]], 136 (Memorandum for the Record of the Special Group''s meeting, Oct.
        6, 1961). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum for the Record,
        Special Group, Oct. 6, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 136). See [[cal.1961-10-05.cuba]];
        [[cal.1961-10-05.cuba-2]]. Names: Castro.'
      tags: [name:castro-fidel]
- add:
    entry:
      id: cal.1961-11-02.cuba
      when: Nov. 2
      date: '1961-11-02'
      thread: cuba
      c: 'Goodwin to the President and the Attorney General, "eyes only": a suggested organization for what became Mongoose,
        five "staff components," among them "intelligence collection," "guerrilla and underground" and "propaganda." "As for
        propaganda, I thought we might ask Tad Szulc to take a leave of absence from the *Times* and work on this one—although
        we should check with [USIA Director] Ed Murrow and Dick Bissell."'
      n: '[[w.sen-church-alleged-assassination-plots]], 138 n.2 (Memo, Goodwin to the President and the Attorney General,
        Nov. 2, 1961, 2). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Goodwin to the
        President and the Attorney General, Nov. 2, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 138 n.2).
        See [[cal.1961-11-01.cuba]]. Names: Goodwin, Szulc, Murrow, Bissell.'
      tags:
      - name:goodwin-richard-n
      - name:szulc-tad
      - name:murrow-edward-r
      - name:bissell-richard-m-jr
- add:
    entry:
      id: cal.1961-11-15.cuba
      when: Nov. 15
      date: '1961-11-15'
      thread: cuba
      c: 'Lansdale to Robert Kennedy, outlining the Mongoose proposal: a "picture of the situation has emerged clearly enough
        to indicate what needs to be done and to support your sense of urgency concerning Cuba."'
      n: '[[w.sen-church-alleged-assassination-plots]], 139 (Memo, Nov. 15, 1961; the Committee''s text gives "November 1962"
        for the proposal''s year, its notes 1961). Made public: the Church Committee''s interim report, Nov. 20, 1975. To
        check: Memo, Lansdale to Robert Kennedy, Nov. 15, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 139).
        See [[cal.1961-11-01.cuba]]. Names: Lansdale, Robert Kennedy.'
      tags:
      - name:lansdale-edward-g
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-01-27.cuba
      when: Jan. 27
      date: '1962-01-27'
      thread: cuba
      c: 'Lansdale to the Attorney General: "we might uncork the touchdown play independently of the institutional program
        we are spurring." Candidates: labor operators to "stir up workers in Latin America and Cuba," "ethnic-language groups,"
        the "youth element," "the families through the Church," "an imaginative defection project which cracks the top echelon
        of the Communist gang now running Cuba." Lansdale, 1975: "a breezy way of referring to a Cuban revolt to overthrow
        the regime."'
      n: '[[w.sen-church-alleged-assassination-plots]], 142–43 (Memo, Lansdale to Attorney General, Jan. 27, 1962, 1; Lansdale,
        testimony, July 8, 1975, 45). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo,
        Lansdale to Attorney General, Jan. 27, 1962 (cited by [[w.sen-church-alleged-assassination-plots]], 142 n.). Names:
        Lansdale.'
      tags:
      - name:lansdale-edward-g
- add:
    entry:
      id: cal.1962-01-30.cuba
      when: Jan. 30
      date: '1962-01-30'
      thread: cuba
      c: 'The Special Group (Augmented) approves Lansdale''s 33 tasks for planning purposes; Task 33, to "incapacitate" Cuban
        sugar workers in the harvest by chemical warfare means, with the notation that it would require "policy determination"
        before final approval.'
      n: '[[w.sen-church-alleged-assassination-plots]], 143 (SGA Minutes, Jan. 30, 1962, 1; later, a study finding Task 33
        unfeasible, it was cancelled, never submitted to the Group, by Lansdale''s testimony, July 8, 1975, 29). Made public:
        the Church Committee''s interim report, Nov. 20, 1975. To check: Special Group (Augmented) Minutes, Jan. 30, 1962
        (cited by [[w.sen-church-alleged-assassination-plots]], 143). See [[cal.1962-01-18.cuba-2]]; [[cal.1962-01-19.cuba]].
        Names: Lansdale.'
      tags:
      - name:lansdale-edward-g
- add:
    entry:
      id: cal.1962-01-30.cuba-2
      when: Jan. 30
      date: '1962-01-30'
      thread: cuba
      c: 'Craig, for the Defense Department and the Joint Chiefs on the Mongoose working group, to Lansdale: Operation Bounty,
        "a system of financial rewards, commensurate with position and stature, for killing or delivering alive known Communists,"
        from $5,000 for an "informer" to $100,000 for "government officials"; a reward of "2¢" for Castro. Lansdale, 1975,
        "tabled" it: "I did not think that it was something that should be seriously undertaken or supported further."'
      n: '[[w.sen-church-alleged-assassination-plots]], 144 (Memo, Craig to Lansdale, Jan. 30, 1962; Lansdale, testimony,
        July 8, 1975, 26; never brought before the Group). Made public: the Church Committee''s interim report, Nov. 20, 1975.
        To check: Memo, Craig to Lansdale, Jan. 30, 1962 (cited by [[w.sen-church-alleged-assassination-plots]], 144). Names:
        Lansdale, Castro.'
      tags:
      - name:lansdale-edward-g
      - name:castro-fidel
- add:
    entry:
      id: cal.1962-03-05.cuba-2
      when: Mar. 5
      date: '1962-03-05'
      thread: cuba
      c: 'The Special Group (Augmented): major operations going beyond the collection of intelligence to have its advance
        approval; "preliminary actions" such as spotting, assessing and training action-type agents to be held under tight
        control, though many of the agents infiltrated would be of an all-purpose type, trained in paramilitary skills too.
        Lansdale''s five-stage plan for an October revolt cut back to an intelligence collection plan for March–May.'
      n: '[[w.sen-church-alleged-assassination-plots]], 144–46, 152 (SGA Minutes, Mar. 5, 1962; Memo, Lansdale, Mar. 2, 1962;
        Lansdale to Helms, Mar. 5). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Special
        Group (Augmented) Minutes, Mar. 5, 1962; Memo by Lansdale, Mar. 2, 1962 (cited by [[w.sen-church-alleged-assassination-plots]],
        144–46). See [[cal.1962-02-20.cuba]]. Names: Lansdale. Check: the day (144 has the six-phase plan tabled "in February
        1962" and cites the minutes of Mar. 5; 145 cites Lansdale''s memorandum of Mar. 2 for the cut-back).'
      tags:
      - name:lansdale-edward-g
- add:
    entry:
      id: cal.1962-03-22.cuba
      when: Mar. 22
      date: '1962-03-22'
      thread: cuba
      c: 'The Special Group (Augmented), a note on the minute of Mar. 16 on the President''s progress report: "The Group was
        unanimous in feeling that no authorization, either tacit or otherwise, was given by higher authority." The members
        ask that the minute be amended to show the Group itself had decided to proceed in accordance with the Guidelines.'
      n: '[[w.sen-church-alleged-assassination-plots]], 145 n.1 (note dated Mar. 22, 1962 at the foot of the SGA Memo for
        the Record, Mar. 16, 1962). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: SGA Memo
        for the Record, Mar. 16, 1962, with the note of Mar. 22 (cited by [[w.sen-church-alleged-assassination-plots]], 145
        n.1). See [[cal.1962-03-16.cuba]]; [[cal.1962-03-14.cuba]].'
      tags: []
- add:
    entry:
      id: cal.1962-03-23.crime-and-hijacking-maheu
      when: Mar. 23
      date: '1962-03-23'
      thread: crime-and-hijacking-maheu
      c: 'Hoover to Edwards: the Criminal Division asks that the CIA "specifically advise whether it would or would not object
        to the initiation of criminal prosecution" of Balletti, Maheu and J. W. Harrison for conspiracy to violate the wiretapping
        statute. Edwards had told the Bureau Feb. 7 the CIA would object; an early reply wanted.'
      n: '[[w.sen-church-alleged-assassination-plots]], 130–31 (Hoover to Edwards, Mar. 23, 1962, the day after Hoover''s
        luncheon with the President). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo,
        Hoover to Edwards, Mar. 23, 1962 (cited by [[w.sen-church-alleged-assassination-plots]], 130–31). See [[cal.1962-03-22.transition-and-staff]];
        [[cal.1962-02-07.crime-and-hijacking]]. Names: Hoover, Edwards, Maheu.'
      tags:
      - name:hoover-j-edgar
      - name:edwards-sheffield
      - name:maheu-robert-a
- add:
    entry:
      id: cal.1962-04-08.cuba-2
      when: Apr. 8–9
      date: '1962-04-08'
      thread: cuba
      c: New York. Harvey, the Support Chief and Rosselli meet, their second meeting. By the Inspector General's report Apr.
        8–9; by Edwards's memorandum of May 14, set for Apr. 9.
      n: '[[w.sen-church-alleged-assassination-plots]], 84, 134 (I.G. Report, 43; Edwards, memorandum of May 14, 1962). Made
        public: the Church Committee''s interim report, Nov. 20, 1975. To check: Inspector General''s Report, 1967, 43 (cited
        by [[w.sen-church-alleged-assassination-plots]], 84); Memo, Edwards to the Attorney General, May 14, 1962 (cited by
        [[w.sen-church-alleged-assassination-plots]], 134). See [[cal.1962-04.cuba-2]]. Names: Harvey, Rosselli, Edwards.
        Check: the day.'
      tags:
      - name:harvey-william-k
      - name:rosselli-john
      - name:edwards-sheffield
- add:
    entry:
      id: cal.1962-04-10.cuba-3
      when: Apr. 10
      date: '1962-04-10'
      thread: cuba
      c: 'Harvey to McCone: "To permit requisite flexibility and professionalism for a maximum operational effort against
        Cuba, the tight controls exercised by the Special Group and the present time-consuming coordination and briefing procedures
        should, if at all possible, be made less restrictive and less stultifying."'
      n: '[[w.sen-church-alleged-assassination-plots]], 145 (Memo, Harvey to McCone, Apr. 10, 1962; Harvey''s complaint about
        the Special Group (Augmented)''s requirement of advance approval for "major operations going beyond the collection
        of intelligence"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Harvey to McCone,
        Apr. 10, 1962 (cited by [[w.sen-church-alleged-assassination-plots]], 145). See [[cal.1962-03-14.cuba]]. Names: Harvey,
        McCone.'
      tags:
      - name:harvey-william-k
      - name:mccone-john-a
- add:
    entry:
      id: cal.1962-08-13.cuba
      when: Aug. 13
      date: '1962-08-13'
      thread: cuba
      c: 'Lansdale to Harvey and the working group, after the meeting of Aug. 10: an outline of an alternate Course B, by
        objectives and activities under Intelligence, Political, Economic, Psychological, Paramilitary and Military. Harvey
        to prepare "Intelligence, Political, [words deleted], Economic, (sabotage, limited deception), and Paramilitary."
        The words deleted, by Harvey''s memorandum of Aug. 14: "including liquidation of leaders."'
      n: '[[w.sen-church-alleged-assassination-plots]], 161–62 (Lansdale memorandum, Aug. 13, 1962; copies to Hurwitch of
        State, Harris of Defense and Wilson of USIA). Made public: the Church Committee''s interim report, Nov. 20, 1975.
        To check: Memo, Lansdale to Harvey and members of the working group, Aug. 13, 1962 (cited by [[w.sen-church-alleged-assassination-plots]],
        161–62). See [[cal.1962-08-10.cuba]]. Names: Lansdale, Harvey.'
      tags:
      - name:lansdale-edward-g
      - name:harvey-william-k
- add:
    entry:
      id: cal.1962-08-14.cuba
      when: Aug. 14
      date: '1962-08-14'
      thread: cuba
      c: 'Harvey to Helms, with Lansdale''s memorandum, "including liquidation of leaders" excised: "The question of assassination,
        particularly of Fidel Castro, was brought up by Secretary McNamara at the meeting of the Special Group (Augmented)
        in Secretary Rusk''s office on 10 August. It was the obvious consensus at that meeting, in answer to a comment by
        Mr. Ed Murrow, that this is not a subject which has been made a matter of official record." He has told Lansdale''s
        office "the inadmissability and stupidity of putting this type of comment in writing in such a document," and that
        the CIA "would write no document pertaining to this and would participate in no open meeting discussing it."'
      n: '[[w.sen-church-alleged-assassination-plots]], 162 (Memo, Harvey to Helms, Aug. 14, 1962). Made public: the Church
        Committee''s interim report, Nov. 20, 1975. To check: Memo, Harvey to Helms, Aug. 14, 1962 (cited by [[w.sen-church-alleged-assassination-plots]],
        162). See [[cal.1962-08-10.cuba]]; [[cal.1962-08-13.cuba]]. Names: Harvey, Helms, Castro, McNamara, Rusk, Murrow,
        Lansdale.'
      tags:
      - name:harvey-william-k
      - name:helms-richard
      - name:castro-fidel
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:murrow-edward-r
      - name:lansdale-edward-g
- add:
    entry:
      id: cal.1962-08-20.cuba
      when: Aug. 20
      date: '1962-08-20'
      thread: cuba
      c: 'Taylor to the President: the Special Group (Augmented) sees no likelihood that Castro''s government will be overturned
        by internal means without direct United States military intervention, and favors a more aggressive Mongoose program.'
      n: '[[w.sen-church-alleged-assassination-plots]], 147 (Memo, Taylor to the President, Aug. 20, 1962). Made public: the
        Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Taylor to the President, Aug. 20, 1962 (cited by
        [[w.sen-church-alleged-assassination-plots]], 147). See [[cal.1962-08-10.cuba]]. Names: Taylor, Castro.'
      tags:
      - name:taylor-maxwell
      - name:castro-fidel
- add:
    entry:
      id: cal.1962-08-30.cuba-2
      when: Aug. 30
      date: '1962-08-30'
      thread: cuba
      c: 'The Special Group (Augmented) instructs the CIA to submit a list of possible sabotage targets: "The Group, by reacting
        to this list, could define the limits within which the Agency could operate on its own initiative."'
      n: '[[w.sen-church-alleged-assassination-plots]], 147 (Minutes of Aug. 30, 1962). Made public: the Church Committee''s
        interim report, Nov. 20, 1975. To check: Special Group (Augmented) Minutes, Aug. 30, 1962 (cited by [[w.sen-church-alleged-assassination-plots]],
        147). See [[cal.1962-08-10.cuba]].'
      tags: []
- add:
    entry:
      id: cal.1962-09-07.cuba-3
      when: Sept. 7
      date: '1962-09-07'
      thread: cuba
      c: 'Miami. Harvey meets Rosselli, the first of two meetings (the second Sept. 11). Reported at them: the Cuban preparing
        another three-man team to penetrate Castro''s bodyguard; the pills, "the medicine," still "safe" in Cuba. Harvey,
        1975: by this time he had grave doubts, and told Rosselli "there''s not much likelihood that this is going anyplace,
        or that it should be continued."'
      n: '[[w.sen-church-alleged-assassination-plots]], 84 (I.G. Report, 51; Harvey, testimony, June 25, 1975, 103–4; the
        report gives the two meetings together). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check:
        Inspector General''s Report, 1967, 51 (cited by [[w.sen-church-alleged-assassination-plots]], 84). See [[cal.1962-06.cuba-2]].
        Names: Harvey, Rosselli, Castro. Check: which of the two meetings.'
      tags:
      - name:harvey-william-k
      - name:rosselli-john
      - name:castro-fidel
- add:
    entry:
      id: cal.1962-09-11.cuba-2
      when: Sept. 11
      date: '1962-09-11'
      thread: cuba
      c: Miami. Harvey meets Rosselli again, the second of two meetings.
      n: '[[w.sen-church-alleged-assassination-plots]], 84 (I.G. Report, 51). Made public: the Church Committee''s interim
        report, Nov. 20, 1975. See [[cal.1962-09-07.cuba-3]]. Names: Harvey, Rosselli.'
      tags:
      - name:harvey-william-k
      - name:rosselli-john
- add:
    entry:
      id: cal.1962-09-14.cuba-2
      when: Sept. 14
      date: '1962-09-14'
      thread: cuba
      c: The Special Group (Augmented) approves in principle a proposed set of operations. Bundy "made it clear that this
        did not constitute a blanket approval of every item in the paper and that sensitive ones such as sabotage, for example,
        will have to be presented in more detail on a case by case basis."
      n: '[[w.sen-church-alleged-assassination-plots]], 146 (Memo of SGA Meeting, Sept. 14, 1962, 1). Made public: the Church
        Committee''s interim report, Nov. 20, 1975. To check: Memo of Special Group (Augmented) Meeting, Sept. 14, 1962 (cited
        by [[w.sen-church-alleged-assassination-plots]], 146). See [[cal.1962-08-10.cuba]]. Names: Bundy.'
      tags:
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1963-04-23.cuba
      when: Apr. 23
      date: '1963-04-23'
      thread: cuba
      c: The NSC Standing Group first discusses Bundy's "Cuba Alternatives." Robert Kennedy proposes a study of the "measures
        we would take following contingencies such as the death of Castro or the shooting down of a U-2." Alternatives considered,
        none involving assassination; no conclusions reached.
      n: '[[w.sen-church-alleged-assassination-plots]], 171–72 (Summary Record of Standing Group Meeting, Apr. 23, 1963; Bundy,
        testimony, July 11, 1975, 130, 14). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check:
        Summary Record of NSC Standing Group Meeting, Apr. 23, 1963; Memorandum for Members of the Standing Group, May 2,
        1963 (the Office of National Estimates assigned to assess Castro''s death) (cited by [[w.sen-church-alleged-assassination-plots]],
        171). See [[cal.1963-04-21.cuba]]. Names: Bundy, Robert Kennedy, Castro.'
      tags:
      - name:bundy-mcgeorge
      - name:kennedy-robert-f
      - name:castro-fidel
- add:
    entry:
      id: cal.1963-08-16.cuba
      when: Aug. 16
      date: '1963-08-16'
      thread: cuba
      c: 'Helms, asked by McCone about the *Chicago Sun-Times* of this day, which says the CIA had a connection with Giancana,
        brings him the only copy in the Agency of Edwards''s memorandum of May 14, 1962 to the Attorney General: "I assume
        you are aware of the nature of the operation discussed in the attachment." McCone, by Elder''s account, reads it and
        hands it back: "Well, this did not happen during my tenure." By the Inspector General''s report, the earliest date
        on which McCone is shown aware of any aspect of the scheme.'
      n: '[[w.sen-church-alleged-assassination-plots]], 107–8 (Memorandum to the DCI, re Sam Giancana, from Helms, Aug. 16,
        1963; Elder, testimony, Aug. 13, 1975, 16–17, 58; I.G. Report, 70). Made public: the Church Committee''s interim report,
        Nov. 20, 1975. To check: Memo, Helms to the Director of Central Intelligence, Aug. 16, 1963 (cited by [[w.sen-church-alleged-assassination-plots]],
        107); Elder, testimony, Aug. 13, 1975 (cited by [[w.sen-church-alleged-assassination-plots]], 108). See [[cal.1962-05-07.robert-kennedy]].
        Names: Helms, McCone, Giancana, Edwards. Check: McCone, 1975, first that Helms told him orally "on that day in August"
        that it involved assassination (107 n.4), later that he could not recall but the $150,000 told him the aim (108).'
      tags:
      - name:helms-richard
      - name:mccone-john-a
      - name:giancana-sam
      - name:edwards-sheffield
- add:
    entry:
      id: cal.1963-10-03.cuba
      when: Oct. 3
      date: '1963-10-03'
      thread: cuba
      c: The Special Group approves nine operations in Cuba, several of them sabotage.
      n: '[[w.sen-church-alleged-assassination-plots]], 173 (Memorandum, July 11, 1975, CIA Review Staff to the Select Committee,
        "Approved CIA Covert Operations into Cuba"). To check: Memorandum, July 11, 1975, CIA Review Staff to the Select Committee
        (cited by [[w.sen-church-alleged-assassination-plots]], 173). See [[cal.1963-06-19.cuba]].'
      tags: []
- add:
    entry:
      id: cal.1963-10-24.cuba-3
      when: Oct. 24
      date: '1963-10-24'
      thread: cuba
      c: The Special Group approves thirteen major sabotage operations in Cuba for November 1963 through January 1964, among
        them an electric power plant, an oil refinery and a sugar mill.
      n: '[[w.sen-church-alleged-assassination-plots]], 173 (Memorandum, July 11, 1975, CIA Review Staff to the Select Committee,
        "Approved CIA Covert Operations into Cuba"). To check: Memorandum, July 11, 1975, CIA Review Staff to the Select Committee
        (cited by [[w.sen-church-alleged-assassination-plots]], 173). See [[cal.1963-10-03.cuba]].'
      tags: []
- add:
    entry:
      id: cal.1963-11-18.cuba-2
      when: Nov. 18
      date: '1963-11-18'
      thread: cuba
      c: 'Attwood, by his testimony in 1975, telephones a member of Castro''s staff in Cuba. On White House instructions:
        the United States favors preliminary negotiations at the United Nations, not in Cuba as the Cubans proposed, and wants
        to work out an agenda.'
      n: '[[w.sen-church-alleged-assassination-plots]], 174 (Atwood, testimony, July 10, 1975, 8–9; the report spells Atwood).
        Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1963-10-24.cuba]].
        Names: Attwood, Castro.'
      tags:
      - name:attwood-william
      - name:castro-fidel
- add:
    entry:
      id: cal.1964-03.cuba
      when: Mar.
      date: 1964-03
      thread: cuba
      c: One cache of arms for AM/LASH delivered in Cuba, by CIA cables.
      n: '[[w.sen-church-alleged-assassination-plots]], 89, 176 (CIA cables). Made public: the Church Committee''s interim
        report, Nov. 20, 1975. To check: CIA cables, March 1964 (cited by [[w.sen-church-alleged-assassination-plots]], 89).
        See [[cal.1963-11-22.cuba]]. Check: the day.'
      tags: []
- add:
    entry:
      id: cal.1964-04-08.cuba
      when: Apr. 8
      date: '1964-04-08'
      thread: cuba
      c: 'McCone''s memorandum, the day after Johnson decided to stop CIA-controlled sabotage operations: "the real issue
        to be considered at the meeting and by the President was a question of whether we wished to implement the policy (outlined
        in certain memoranda) or abandon the basic objective of bringing about the liquidation of the Castro Communist entourage
        and the elimination of Communist presence in Cuba and thus rely on future events of an undisclosed nature which might
        accomplish this objective." The "future events": "extreme economic distress caused by a sharp drop in sugar prices"
        and "other external factors."'
      n: '[[w.sen-church-alleged-assassination-plots]], 177 n.2 (Memorandum by McCone, Apr. 8, 1964, 1, 8; McCone, testimony,
        June 6, 1975, 32). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum by McCone,
        Apr. 8, 1964 (cited by [[w.sen-church-alleged-assassination-plots]], 177 n.2). See [[cal.1964-04-07.cuba]]. Names:
        Johnson, McCone, Castro.'
      tags:
      - name:johnson-lyndon-b
      - name:mccone-john-a
      - name:castro-fidel
- add:
    entry:
      id: cal.1964-05-05.cuba
      when: May 5
      date: '1964-05-05'
      thread: cuba
      c: 'The CIA''s AM/LASH file: the case officer asks the Technical Services Division to produce, on a "crash basis," a
        silencer to fit an FAL rifle.'
      n: '[[w.sen-church-alleged-assassination-plots]], 89 (an entry in the AM/LASH file for May 5, 1964). Made public: the
        Church Committee''s interim report, Nov. 20, 1975. To check: the AM/LASH file, entry of May 5, 1964 (cited by [[w.sen-church-alleged-assassination-plots]],
        89). See [[cal.1964-03.cuba]].'
      tags: []
- add:
    entry:
      id: cal.1964-06.cuba
      when: June
      date: 1964-06
      thread: cuba
      c: A second cache of arms for AM/LASH delivered in Cuba, by CIA cables.
      n: '[[w.sen-church-alleged-assassination-plots]], 89, 176 (CIA cables). Made public: the Church Committee''s interim
        report, Nov. 20, 1975. To check: CIA cables, June 1964 (cited by [[w.sen-church-alleged-assassination-plots]], 89).
        See [[cal.1964-03.cuba]]. Check: the day.'
      tags: []
- add:
    entry:
      id: cal.1964-06-10.cuba
      when: June 10
      date: '1964-06-10'
      thread: cuba
      c: 'Helms to McCone: Agency officials have learned of several plots by Cuban exiles to assassinate Castro and other
        Cuban leaders; several involve "people apparently associated with the Mafia," offered $150,000. The sources, parties
        to the plots, presumably expect legal immunity if they succeed. Nothing of the CIA''s own plots; "Agency officers
        made clear to each of the sources that the United States Government would not, under any circumstances, condone the
        planned actions."'
      n: '[[w.sen-church-alleged-assassination-plots]], 177–78 (Memorandum, Helms to McCone, June 10, 1964). Made public:
        the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, Helms to McCone, June 10, 1964 (cited
        by [[w.sen-church-alleged-assassination-plots]], 177). Names: Helms, McCone, Castro.'
      tags:
      - name:helms-richard
      - name:mccone-john-a
      - name:castro-fidel
- add:
    entry:
      id: cal.1964-06-18.cuba
      when: June 18
      date: '1964-06-18'
      thread: cuba
      c: 'The Special Group on Helms''s report of the exile plots. McCone "somewhat skeptical," opposes more investigation;
        "others, including Mr. Bundy, felt that the United States was being put on notice and should do everything in its
        power to ascertain promptly the veracity of the reports and then undertake prevention." The Group decides to send
        the reports to the Attorney General "as a matter of law enforcement." McCone''s memorandum: the Group "overly exercised";
        "Miami cocktail party talk."'
      n: '[[w.sen-church-alleged-assassination-plots]], 178 (Memorandum of Special Group Meeting, June 18, 1964; Memorandum
        by McCone, June 18, 1964, 1). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum
        of Special Group Meeting, June 18, 1964; Memorandum by McCone, June 18, 1964 (cited by [[w.sen-church-alleged-assassination-plots]],
        178). See [[cal.1964-06-10.cuba]]. Names: McCone, Bundy.'
      tags:
      - name:mccone-john-a
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-06-22.cuba
      when: June 22
      date: '1964-06-22'
      thread: cuba
      c: Robert Kennedy, informed a few days after the Special Group's decision of June 18 of the exile plots against Castro,
        says the Justice Department will investigate.
      n: '[[w.sen-church-alleged-assassination-plots]], 178 (Memorandum of Meeting, June 22, 1964). Made public: the Church
        Committee''s interim report, Nov. 20, 1975. To check: Memorandum of Meeting, June 22, 1964 (cited by [[w.sen-church-alleged-assassination-plots]],
        178). See [[cal.1964-06-18.cuba]]. Names: Robert Kennedy, Castro. Check: the day (the memorandum''s).'
      tags:
      - name:kennedy-robert-f
      - name:castro-fidel
- add:
    entry:
      id: cal.1964-08-19.cuba
      when: Aug. 19
      date: '1964-08-19'
      thread: cuba
      c: 'McCone to Bundy, for the Special Group: the FBI''s investigation of the exile plots, summarized in seven reports.
        Several of those interviewed say they knew of the plot and reported it to the CIA; others deny knowing of it.'
      n: '[[w.sen-church-alleged-assassination-plots]], 178 and n.1 (McCone to Bundy Memorandum, Aug. 19, 1964). Made public:
        the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, McCone to Bundy, Aug. 19, 1964 (cited
        by [[w.sen-church-alleged-assassination-plots]], 178). See [[cal.1964-06-22.cuba]]. Names: McCone, Bundy.'
      tags:
      - name:mccone-john-a
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-01-03.cuba
      when: Jan. 3
      date: '1965-01-03'
      thread: cuba
      c: 'A CIA document: B-1, leader of an anti-Castro group, in a lengthy interview with a case officer, says he and AM/LASH
        have agreed on six points. B-1 to provide a silencer for the FAL or cache a rifle with scope and silencer plus bombs;
        escape routes B-1 controls; arms caches in a western province; B-1 in Cuba a week before "the elimination of Fidel";
        recognition by at least five Latin American countries for a junta; commando attacks raised to a maximum one month
        before.'
      n: '[[w.sen-church-alleged-assassination-plots]], 90 (CIA document, Jan. 3, 1965). Made public: the Church Committee''s
        interim report, Nov. 20, 1975. To check: CIA document, Jan. 3, 1965 (cited by [[w.sen-church-alleged-assassination-plots]],
        90). See [[cal.1964-11.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
- add:
    entry:
      id: cal.1967-03-06.cuba
      when: Mar. 6
      date: '1967-03-06'
      thread: cuba
      c: 'The FBI to Attorney General Ramsey Clark, under "Central Intelligence Agency''s Intentions to Send Hoodlums to Cuba
        to Assassinate Castro": "it appears that data which came to our attention in October 1966 possibly pertains to the
        above-captioned matter." An internal FBI memorandum of the same day, used in preparing it, cites two other references
        in the files, one Giancana''s statement that in October 1960 he met the man who was to assassinate Castro in November
        1960.'
      n: '[[w.sen-church-alleged-assassination-plots]], 128 n.1 (two FBI memoranda, Mar. 6, 1967). Made public: the Church
        Committee''s interim report, Nov. 20, 1975. To check: FBI memoranda, Mar. 6, 1967 (the first to the Attorney General)
        (cited by [[w.sen-church-alleged-assassination-plots]], 128 n.1). Names: Clark, Giancana, Castro.'
      tags:
      - name:clark-ramsey
      - name:giancana-sam
      - name:castro-fidel
- add:
    entry:
      id: cal.1967-04-14.cuba
      when: Apr. 14
      date: '1967-04-14'
      thread: cuba
      c: 'McCone, out of the CIA, dictates a memorandum on the meeting of Aug. 10, 1962, after talking by telephone, at Robert
        Kennedy''s request, with Jack Anderson, who is preparing a column on Castro assassination attempts implicating the
        President and Robert Kennedy: of several Mongoose meetings on Aug. 8, 9 or 10, "I recall a suggestion being made to
        liquidate top people in the Castro regime, including Castro." "I took immediate exception to this suggestion"; "At
        no time did the suggestion receive serious consideration."'
      n: '[[w.sen-church-alleged-assassination-plots]], 164 and n.2 (McCone, memorandum of Apr. 14, 1967). Made public: the
        Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum by McCone, Apr. 14, 1967 (cited by [[w.sen-church-alleged-assassination-plots]],
        164 n.2). See [[cal.1962-08-10.cuba]]; [[cal.1967-03-04.robert-kennedy-3]]. Names: McCone, Robert Kennedy, Anderson,
        Kennedy, Castro.'
      tags:
      - name:mccone-john-a
      - name:kennedy-robert-f
      - name:anderson-jack
      - name:kennedy-john-f
      - name:castro-fidel
- add:
    entry:
      id: cal.1962-04-26.cuba
      when: Apr. 26
      date: '1962-04-26'
      thread: cuba
      c: 'The Special Group (Augmented). Lansdale: Harvey in Florida "initiating a new series of agent infiltrations," back
        in Washington Apr. 30. Taylor asks that Harvey "attend the next meeting and report on agent activities."'
      n: '[[w.sen-church-alleged-assassination-plots]], 104, 153–54 (Memo for the SGA from Lansdale, Apr. 26, 1962; McCone''s
        memorandum for the record, dated Apr. 26 at 154, Apr. 27 at 104; Elder''s memorandum to Harvey of Apr. 27 relays
        the request and McCone''s wish to see him and Lansdale "immediately on your return"). Made public: the Church Committee''s
        interim report, Nov. 20, 1975. To check: Memo for the SGA, Lansdale, Apr. 26, 1962; Memo for the Record, McCone,
        Apr. 26, 1962 (cited by [[w.sen-church-alleged-assassination-plots]], 104, 153–54). See [[cal.1962-04-18.cuba]]. Names:
        Lansdale, Harvey, Taylor.'
      tags:
      - name:taylor-maxwell
      - name:harvey-william-k
      - name:lansdale-edward-g
- add:
    entry:
      id: cal.1962-05-14.crime-and-hijacking-maheu
      when: May 14
      date: '1962-05-14'
      thread: crime-and-hijacking-maheu
      c: 'Edwards, with Houston''s help, to the Attorney General: a memorandum of the briefing of May 7. The operation "conducted
        during the period approximately August 1960 to May 1961"; "After the failure of the invasion of Cuba word was sent
        through Maheu to Rosselli to call off the operation and Rosselli was told to tell his principal that the proposal
        to pay one hundred fifty thousand dollars for completion of the operation had been definitely withdrawn." After the
        offer, Edwards "briefed the proper senior officials of [the] Agency," who "duly orally approved"; "knowledge" kept
        to six persons.'
      n: '[[w.sen-church-alleged-assassination-plots]], 98, 132 (Memo from Edwards to the Attorney General, May 14, 1962).
        Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Edwards to the Attorney General,
        May 14, 1962 (cited by [[w.sen-church-alleged-assassination-plots]], 98, 132). See [[cal.1962-05-07.robert-kennedy]];
        [[cal.1962-05-10.crime-and-hijacking-maheu]]. Names: Edwards, Houston, Maheu, Rosselli.'
      tags:
      - name:edwards-sheffield
      - name:houston-lawrence
      - name:maheu-robert-a
      - name:rosselli-john
- add:
    entry:
      id: cal.1962-05-14.cuba
      when: May 14
      date: '1962-05-14'
      thread: cuba
      c: 'Edwards, for his own files, the same day: "On this date Mr. Harvey called me and indicated that he was dropping
        any plans for the use of Subject (Rosselli) for the future." Harvey, 1975: the memorandum "was not true, and Colonel
        Edwards knew it was not true," written so the record would show the operation closed out.'
      n: '[[w.sen-church-alleged-assassination-plots]], 134 (Memorandum for the Record, Edwards, May 14, 1962; Harvey, testimony,
        June 25, 1975, 97, 101–2, 109). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum
        for the Record, Edwards, May 14, 1962 (cited by [[w.sen-church-alleged-assassination-plots]], 98 n.1, 134). See [[cal.1962-05-14.crime-and-hijacking-maheu]].
        Names: Edwards, Harvey, Rosselli.'
      tags:
      - name:edwards-sheffield
      - name:harvey-william-k
      - name:rosselli-john
- add:
    entry:
      id: cal.1962-05-14.cuba-2
      when: May 14
      date: '1962-05-14'
      thread: cuba
      c: Harvey, by his account to the Inspector General, briefs Helms on the meeting with the Attorney General, as told him
        by Edwards. Harvey "advised against briefing Mr. McCone and General Carter," and Helms concurred.
      n: '[[w.sen-church-alleged-assassination-plots]], 104 (I.G. Report, 65; Harvey, testimony, June 25, 1975, 99). Made
        public: the Church Committee''s interim report, Nov. 20, 1975. To check: Inspector General''s Report, 1967, 65 (cited
        by [[w.sen-church-alleged-assassination-plots]], 104). See [[cal.1962-05-14.cuba]]. Names: Harvey, Helms, Edwards,
        McCone, Carter.'
      tags:
      - name:harvey-william-k
      - name:helms-richard
      - name:edwards-sheffield
      - name:mccone-john-a
      - name:carter-marshall-s
- cite:
    id: cal.1960-03-10.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 93, 114 (the NSC''s meeting of Mar. 10, 1960, from its minutes: Eisenhower,
      "we might have another Black Hole of Calcutta in Cuba"; Burke, any plan for the removal of Cuban leaders "should be
      a package deal"; not the rest of C–E)'
    units: '?'
- cite:
    id: cal.1960-11-03.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 99, 116 (Special Group Minutes, Nov. 3, 1960, quoted: Merchant''s
      question on "direct positive action" and the Cuban government "leaderless and probably brainless"; Cabell''s reply,
      the instruments "must be Cubans," the action "beyond our capabilities"; Parrott the author of the minutes; not who was
      present or C)'
    units: A, B
- cite:
    id: cal.1960-11-18.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 120 (Dulles and Bissell "jointly briefed" the President-elect in
      "the latter part of November 1960" on "the most important details with respect to the operation which became the Bay
      of Pigs," by Bissell''s testimony of June 9, 1975, 34; not Palm Beach, the day or the details)'
    units: '?'
- cite:
    id: cal.1960-09.cuba-4
    item: '[[w.sen-church-alleged-assassination-plots]], 79, 125–26 (Hoover to Bissell, Oct. 18, 1960, with copies to other
      members of the intelligence community: a source "whose reliability has not been tested" reports that Giancana said Castro
      "was to be done away with very shortly," the assassination to "occur in November," by a "pill" in Castro''s food or
      drink; for the meeting with Maheu see Variant)'
    units: A
- variant:
    id: cal.1960-09.cuba-4
    unit: B
    witness: w.sen-church-alleged-assassination-plots
    reads: Rosselli introduced Maheu to Giancana in Miami "certainly prior to October 18"; Maheu recalls first meeting him
      after November 1960, at the Fountainebleau Hotel; FBI records place Maheu and Rosselli at the Kennilworth Hotel Oct.
      11–30
    at: 76–77 and 76 n.2
- cite:
    id: cal.1961-03.cuba-bay-of-pigs
    item: '[[w.sen-church-alleged-assassination-plots]], 123–24 (Smathers, testimony, July 23, 1975, 6–7, 16–25, and his Oral
      History interview of Mar. 31, 1964: the conversation on the White House lawn "probably" in 1961, before the Bay of Pigs,
      the White House logs showing two meetings alone with the President, both in March; for B see Variant)'
    units: A, C, D
- variant:
    id: cal.1961-03.cuba-bay-of-pigs
    unit: B
    witness: w.sen-church-alleged-assassination-plots
    reads: the President did not indicate directly that assassination had been proposed to him; Smathers's "impression" was
      that someone else "had apparently discussed this and other possibilities with respect to Cuba" with him, of which he
      had no direct knowledge
    at: '124'
- cite:
    id: cal.1961-04-22.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 121, 135 (on Apr. 22, 1961 the President asked Taylor to reevaluate
      "our practices and programs in the areas of military and paramilitary, guerilla and anti-guerilla activity which fall
      short of outright war," with special attention to Cuba, Robert Kennedy to be his principal colleague; the Board: Robert
      Kennedy, Taylor, Dulles and Burke; not the Camp David meeting)'
    units: B
- cite:
    id: cal.1961-05.cuba-bay-of-pigs-2
    item: '[[w.sen-church-alleged-assassination-plots]], 122–23 (Bissell, testimony, June 11, 1975, 27, July 22, 1975, 53–56:
      "the Underworld against the Castro regime"; "no idea" whether he said it included actual attempts to kill Castro, "no
      knowledge" that the Attorney General was "specifically advised"; Hoover''s memorandum of May 22, 1961 quoting Edwards;
      not the words as c has them)'
    units: '?'
- cite:
    id: cal.1961-06-06.crime-and-hijacking-maheu
    item: '[[w.sen-church-alleged-assassination-plots]], 128 (Evans to Belmont, FBI, June 6, 1961: "We are conducting a full
      investigation in this wiretap case"; for B see Variant)'
    units: A
- variant:
    id: cal.1961-06-06.crime-and-hijacking-maheu
    unit: B
    witness: w.sen-church-alleged-assassination-plots
    reads: '"the Attorney General will be orally assured that we are following up vigorously"'
    at: '128'
- cite:
    id: cal.1961-08.crime-and-hijacking-maheu
    item: '[[w.sen-church-alleged-assassination-plots]], 128 (on Aug. 16, 1961 the Assistant United States Attorney in Las
      Vegas "reported his reluctance to proceed with the case because of deficiencies in the evidence and his concern that
      CIA''s alleged involvement might become known"; not the investigator)'
    units: '?'
- cite:
    id: cal.1961-10-05.crime-and-hijacking-maheu
    item: '[[w.sen-church-alleged-assassination-plots]], 128–29 (a Justice Department file entry of Oct. 6, 1961: "Yesterday
      P.M. told me that A.G. had inquired as to status of this case and think Harold [Shapiro] got it taken care of OK"; no
      other activity in the case from September 1961 through January 1962; for B see Variant)'
    units: '?'
- variant:
    id: cal.1961-10-05.crime-and-hijacking-maheu
    unit: B
    witness: w.sen-church-alleged-assassination-plots
    reads: the Special Group's minutes of October 6, 1961 state that the Group was told that "a contingency plan in connection
      with the possible removal of Castro from the Cuban scene" was in preparation
    at: '136'
- cite:
    id: cal.1961-10.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 136–37 (the CIA Board of National Estimates'' "The Situation and
      Prospects in Cuba," 9: Castro''s loss "by assassination or by natural causes, would have an unsettling effect, but would
      almost certainly not prove fatal to the regime," the Communist Party''s influence "significantly" increased; for A:
      NSAM 100 of Oct. 5, Parrott''s memorandum of Oct. 5 and the Special Group''s minutes of Oct. 6, a plan wanted "against
      the contingency that Castro would in some way or other be removed from the Cuban scene," not the Group''s request "from
      whatever cause"; see [[cal.1961-10-05.cuba]])'
    units: B
- check:
    id: cal.1961-10.cuba
    text: 'Check: the days: [[w.sen-church-alleged-assassination-plots]], 136: NSAM 100 and Parrott''s memorandum, Oct. 5,
      1961; the Special Group''s minutes, Oct. 6.'
- cite:
    id: cal.1961-06-13.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 121, 135 (the "Taylor Report," issued June 13, 1961, makes no mention
      of the assassination plot; its conclusion that "there can be no long-term living with Castro as a neighbor" and its
      recommendation that the Cuban situation be "reappraised"; not B–D)'
    units: A
- cite:
    id: cal.1961-11-16.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 83, 188–89 (Harvey''s notes, by the I.G. Report, 39: Bissell asked
      Harvey to take over the gambling syndicate operation and they discussed the "application of ZR/RIFLE program to Cuba"
      on Nov. 16, 1961; Bissell confirms; for A see Variant)'
    units: B
- variant:
    id: cal.1961-11-16.cuba
    unit: A
    witness: w.sen-church-alleged-assassination-plots
    reads: 'Harvey "did not recall any mention of the White House or any authority higher than the DDP in his November 1961
      meeting with Bissell"; the "twice urged" of his missing notes belongs to their first talk of Executive Action, early
      1961; Bissell, last, the capability "undoubtedly," or "very much more likely," initiated within the Agency'
    at: 183–89
- check:
    id: cal.1961-11-16.cuba
    text: 'Check: the day: [[w.sen-church-alleged-assassination-plots]], 83, has Harvey''s notes on Nov. 16, 1961; 188, on
      Nov. 15.'
- cite:
    id: cal.1962-01-18.cuba-2
    item: '[[w.sen-church-alleged-assassination-plots]], 142 (on Jan. 18, 1962 Lansdale assigned 32 planning tasks to the
      agencies and sent the Attorney General a copy with a note: "my review does not include the sensitive work I have reported
      to you; I felt you preferred informing the President privately"; his memorandum of Jan. 20, a "combat situation"; not
      A–B or the dates)'
    units: '?'
- cite:
    id: cal.1962-03-16.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 145 n.1 (SGA Memo for the Record, Mar. 16, 1962, "Discussion of Operation
      MONGOOSE with the President": in the presence of the Special Group (Augmented) he was given a progress report, the Guidelines
      of Mar. 14 used as its basis; the Group and Lansdale "given tacit authorization to proceed in accordance with the Guidelines";
      the Group''s note of Mar. 22 on the minute; not A–C)'
    units: '?'
- cite:
    id: cal.1962-04.cuba-2
    item: '[[w.sen-church-alleged-assassination-plots]], 83 (Harvey, on "explicit orders" from Helms by his testimony, asked
      Edwards in early April 1962 to put him in touch with Rosselli; the Support Chief introduced them in Miami; Harvey told
      Rosselli to keep his Cuban contacts but not to deal with Maheu or Giancana, "untrustworthy" and "surplus")'
    units: A
- cite:
    id: cal.1962-05.cuba-2
    item: '[[w.sen-church-alleged-assassination-plots]], 84, 131 (Harvey arrived in Miami Apr. 21, 1962 and gave Rosselli
      the pills, four, given to the Support Chief Apr. 18 by the Technical Services Division''s notation; arms bought for
      about $5,000, a U-Haul truck rented under an assumed name and left in a parking lot; Rosselli reported in May that the
      pills and guns had arrived in Cuba; "In the latter half of April 1962 William Harvey ... gave poison pills to Roselli";
      see Variant)'
    units: '?'
- variant:
    id: cal.1962-05.cuba-2
    unit: A
    witness: w.sen-church-alleged-assassination-plots
    reads: '"The keys were given to Rosselli, who watched the delivery with the Support Chief from across the street"'
    at: '84'
- variant:
    id: cal.1962-05.cuba-2
    unit: B
    witness: w.sen-church-alleged-assassination-plots
    reads: Harvey arrived in Miami on April 21 and gave the pills to Rosselli, before the Attorney General's briefing of May
      7; "In the latter half of April 1962"
    at: 84, 131
- cite:
    id: cal.1962-05-09.crime-and-hijacking-maheu
    item: '[[w.sen-church-alleged-assassination-plots]], 132–33 and n.2 (Hoover''s memorandum for the record of May 10, 1962,
      of the conference of May 9: the Attorney General "wanted to advise me of a situation in the Giancana case which had
      considerably disturbed him": CIA had hired Maheu to approach Giancana with a proposition of paying $150,000 to hire
      gunmen to go into Cuba and kill Castro, and "admitted that they had assisted Maheu in making this installation"; he
      had ordered the CIA "to never again in the future take such steps without first checking with the Department of Justice";
      Hoover: "Stated as he [Kennedy] well knew the ''gutter gossip''" of Giancana and Sinatra; "met" and "a conference," not
      who called on whom; not D)'
    units: B, C, E
- cite:
    id: cal.1962-05-10.crime-and-hijacking-maheu
    item: '[[w.sen-church-alleged-assassination-plots]], 132 (Edwards, with Houston''s help, prepared a memorandum of the
      May 7 briefing dated May 14; for the day of the request see Variant)'
    units: '?'
- variant:
    id: cal.1962-05-10.crime-and-hijacking-maheu
    unit: A
    witness: w.sen-church-alleged-assassination-plots
    reads: On May 11 the Attorney General requested Edwards to prepare a memorandum of the May 7 briefing
    at: '132'
- cite:
    id: cal.1962-08-10.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 147, 161–66 (the meeting chaired by Rusk with McNamara, McCone and
      Murrow present; the Group decides against Lansdale''s "stepped-up Course B" for a plan advanced by McCone; assassination
      raised, by Harvey''s recollection by McNamara, and kept out of the record (Harvey''s memorandum of Aug. 14, McCone''s
      of Apr. 14, 1967, the minutes of Aug. 10 with no reference to assassination); not C)'
    units: A, B, D
- cite:
    id: cal.1962-10-16.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 146, 147 n.2 (Helms''s memorandum of the meeting of Oct. 16, 1962:
      Robert Kennedy, "the general dissatisfaction of the President" with Mongoose, will give it "more personal attention
      in view of the lack of progress" and hold daily meetings with the working group representatives (Lansdale, Harvey, the
      other Agency members); not 9:30, A, B as worded, D–F)'
    units: C
- cite:
    id: cal.1962-12.cuba-5
    item: '[[w.sen-church-alleged-assassination-plots]], 85–86 ("Plans in Early 1963": Donovan, "not aware of the plan," to
      present Castro a contaminated diving suit; the I.G. dates it January 1963, though "likely" earlier, Donovan having completed
      his negotiations by mid-January; TSD dusted the inside with a fungus (Madura foot) and contaminated the breathing apparatus
      with tubercle bacillus; for A see Variant)'
    units: '?'
- variant:
    id: cal.1962-12.cuba-5
    unit: A
    witness: w.sen-church-alleged-assassination-plots
    reads: 'the suit only planned, Donovan "not aware of the plan": the Inspector General, abandoned because Donovan gave Castro
      a different diving suit on his own initiative; Helms, the suit "never left the laboratory"; its inside dusted with a fungus
      that would produce a chronic skin disease (Madura foot), the breathing apparatus contaminated with a tubercle bacillus'
    at: '86'
- check:
    id: cal.1962-12.cuba-5
    text: 'Check: the month: [[w.sen-church-alleged-assassination-plots]], 85–86, has the plan "in early 1963," the Inspector
      General''s January 1963, "likely" earlier.'
- cite:
    id: cal.1963-04-21.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 170–72 (Bundy''s memorandum of Apr. 21, 1963 for the Standing Group,
      three alternatives: forcing "a non-Communist solution in Cuba by all necessary means," "major but limited ends," or
      "gradual development of some form of accommodation with Castro"; not B; for the title see Variant)'
    units: '?'
- variant:
    id: cal.1963-04-21.cuba
    unit: A
    witness: w.sen-church-alleged-assassination-plots
    reads: a memorandum entitled "Cuba Alternatives"
    at: '170'
- cite:
    id: cal.1963-10-24.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 174 (Daniel, "Unofficial Envoy," New Republic, Dec. 14, 1963: he
      met Kennedy Oct. 24, 1963; they discussed the prospects of reestablishing United States–Cuba relations and Kennedy asked
      him to report after seeing Castro; Atwood, testimony, July 10, 1975, 19, arranged the visit; not the hour or C–E)'
    units: '?'
- cite:
    id: cal.1963-10-29.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 174–75 (Fitzgerald "met AM/LASH in October 1963," as the personal
      representative of Robert Kennedy, with "assurances of full support" should AM/LASH overthrow Castro; the I.G. Report,
      88–89: Helms and Fitzgerald decided "it was not necessary to seek approval from Robert Kennedy"; Helms, 1975, no such
      recollection; not the day, C–E)'
    units: '?'
- cite:
    id: cal.1964-04-07.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 177 (Special Group meeting, Apr. 7, 1964: Johnson "decided to discontinue
      the use of CIA-controlled sabotage raids against Cuba"; Rusk opposed them, a "high noise level"; McCone disagreed; Bundy''s
      memorandum of Apr. 7 lists seven aspects of the program "in effect"; not C or D)'
    units: '?'
- cite:
    id: cal.1964-11.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 89 (a CIA file entry of 1965: after Nov. 22, 1963 the CIA decided
      it "could have no part in the assassination of a government leader (including Castro)"; AM/LASH "was not informed of
      (this decision) until he was seen by the case officer in November, 1964"; "In fact, however, assassination efforts involving
      AM/LASH continued into 1965"; not B or C)'
    units: '?'
- cite:
    id: cal.1965-06.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 90 ("In June 1965, CIA terminated all contact with AM/LASH and his
      associates for reasons related to security," I.G. Report, 104–5; not B or C)'
    units: A
- add:
    entry:
      id: cal.1960-08-16.cuba
      when: Aug. 16
      date: '1960-08-16'
      thread: cuba
      c: An official of the CIA given a box of Castro's favorite cigars, with instructions to treat them with lethal poison,
        by a notation in the records of the Operations Division, the Office of Medical Services.
      n: '[[w.sen-church-alleged-assassination-plots]], 73 (I.G. Report, 21–22; the cigars contaminated with a botulinum toxin,
        ready Oct. 7, 1960). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Inspector General''s
        Report, 1967, 21–22 (cited by [[w.sen-church-alleged-assassination-plots]], 73). See [[cal.1960-07-21.cuba]]. Names:
        Castro.'
      tags: [name:castro-fidel]
- add:
    entry:
      id: cal.1960-11.cuba
      when: Nov., early
      date: 1960-11
      thread: cuba
      c: 'Miami. Hughes, by telephone, asks Maheu to come back to the West Coast. Maheu, by his testimony of 1975, "definitely
        told him that the project was on behalf of the United States Government, that it included plans to dispose of Mr.
        Castro in connection with a pending invasion."'
      n: '[[w.sen-church-alleged-assassination-plots]], 75 n.2 (Maheu, testimony, July 29, 1975, 22–23: "shortly before the
        election in November 1960"). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-10-31.crime-and-hijacking-maheu]].
        Names: Hughes, Maheu, Castro. Check: the day.'
      tags: [name:hughes-howard-r-jr, name:maheu-robert-a, name:castro-fidel]
- add:
    entry:
      id: cal.1961-05-18.cuba
      when: May 18
      date: '1961-05-18'
      thread: cuba
      also: [cuba-bay-of-pigs]
      c: The Taylor board interviews several Cuban exile leaders of the Bay of Pigs, among them the leader who had cooperated
        in the plot to poison Castro; Robert Kennedy present. The subject, by the session's summary, the Bay of Pigs.
      n: '[[w.sen-church-alleged-assassination-plots]], 125 (the summary of the session). Made public: the Church Committee''s
        interim report, Nov. 20, 1975. To check: the summary of the board''s session, May 18, 1961 (cited by [[w.sen-church-alleged-assassination-plots]],
        125). See [[cal.1961-04-22.cuba]]. Names: Robert Kennedy, Castro.'
      tags: [name:kennedy-robert-f, name:castro-fidel]
- add:
    entry:
      id: cal.1962-01-19.cuba
      when: Jan. 19
      date: '1962-01-19'
      thread: cuba
      c: 'Lansdale adds a thirty-third task to the 32 of Jan. 18: a plan to "incapacitate" Cuban sugar workers during the harvest
        by chemical warfare means. Lansdale, 1975: nonlethal chemicals, to keep them from the fields for 24 to 48 hours "without
        ill effects."'
      n: '[[w.sen-church-alleged-assassination-plots]], 143 (Lansdale, testimony, July 8, 1975, 29). Made public: the Church
        Committee''s interim report, Nov. 20, 1975. See [[cal.1962-01-18.cuba-2]]. Names: Lansdale.'
      tags: [name:lansdale-edward-g]
- add:
    entry:
      id: cal.1962-01-24.cuba
      when: Jan. 24
      date: '1962-01-24'
      thread: cuba
      c: 'A CIA memorandum for the Special Group (Augmented) on Task 5 of Lansdale''s 32, the "defection of top Cuban government
        officials": planning will "necessarily be based upon an appeal made inside the island by intermediaries"; "crime syndicates"
        among the possible intermediaries.'
      n: '[[w.sen-church-alleged-assassination-plots]], 143 n.3 (CIA Memorandum, Jan. 24, 1962). Made public: the Church Committee''s
        interim report, Nov. 20, 1975. To check: CIA Memorandum for the SGA, Jan. 24, 1962 (cited by [[w.sen-church-alleged-assassination-plots]],
        143 n.3). See [[cal.1962-01-19.cuba]].'
      tags: []
- add:
    entry:
      id: cal.1962-04-18.cuba
      when: Apr. 18
      date: '1962-04-18'
      thread: cuba
      c: Four poison pills given to the Support Chief, by a notation in the files of the CIA's Technical Services Division;
        passed to Harvey.
      n: '[[w.sen-church-alleged-assassination-plots]], 84 (I.G. Report, 46–47). Made public: the Church Committee''s interim
        report, Nov. 20, 1975. To check: Inspector General''s Report, 1967, 46–47 (cited by [[w.sen-church-alleged-assassination-plots]],
        84). See [[cal.1962-04-08.cuba-2]]. Names: Harvey.'
      tags: [name:harvey-william-k]
- add:
    entry:
      id: cal.1962-05-03.cuba
      when: May 3
      date: '1962-05-03'
      thread: cuba
      c: 'The Special Group (Augmented). Harvey, back from Miami, reports on "agent teams" and the "general field of intelligence":
        three agent teams infiltrated, 72 actual or potential reporting sources in place.'
      n: '[[w.sen-church-alleged-assassination-plots]], 104, 154 (Memo of SGA Meeting, May 3, 1962; Harvey, testimony, July
        11, 1975, 16–17: he did not report the passage of the pills to Rosselli). Made public: the Church Committee''s interim
        report, Nov. 20, 1975. To check: Memorandum of the SGA meeting, May 3, 1962 (cited by [[w.sen-church-alleged-assassination-plots]],
        154). See [[cal.1962-04-26.cuba]]. Names: Harvey.'
      tags: [name:harvey-william-k]
- add:
    entry:
      id: cal.1962-05-07.cuba-2
      when: May 7
      date: '1962-05-07'
      thread: cuba
      c: Taylor gives the President what he calls a "routine briefing," after the Special Group (Augmented)'s meeting of May
        3.
      n: '[[w.sen-church-alleged-assassination-plots]], 154 (Memo for Record, May 7, 1962, by Taylor, without reference to
        Harvey''s contacts with Rosselli; Taylor, testimony, July 9, 1975, 27). Made public: the Church Committee''s interim
        report, Nov. 20, 1975. To check: Memo for Record, May 7, 1962, by Taylor (cited by [[w.sen-church-alleged-assassination-plots]],
        154). See [[cal.1962-05-03.cuba]]. Names: Taylor, Kennedy. Check: the day (the memorandum''s).'
      tags: [name:taylor-maxwell, name:kennedy-john-f]
- add:
    entry:
      id: cal.1962-08-10.cuba-2
      when: Aug. 10
      date: '1962-08-10'
      thread: cuba
      c: 'McCone telephones McNamara, Elder listening on a speaker: "the subject you just brought up, I think it is highly
        improper. I do not think it should be discussed. It is not an action that should ever be condoned. It is not proper
        for US to discuss, and I intend to have it expunged from the record." McNamara, by Elder, "more or less accepted what
        Mr. McCone said without comment or rejoinder."'
      n: '[[w.sen-church-alleged-assassination-plots]], 105, 165–66 and 166 n.1 (Elder, testimony, Aug. 13, 1975, 23–24;
        Harvey, testimony, June 25, 1975, 71; McCone, memorandum of Apr. 14, 1967: "Immediately after the meeting, I called
        on Secretary McNamara personally"; McCone, testimony, June 6, 1975, 39; McNamara, testimony, July 11, 1975, 7–8: "I
        agreed with Mr. McCone that no such planning should be undertaken"). Made public: the Church Committee''s interim
        report, Nov. 20, 1975. See [[cal.1962-08-10.cuba]]. Names: McCone, McNamara. Check: the day: by Harvey''s account
        the afternoon or evening of Aug. 10; by McCone''s memorandum of 1967, in person, immediately after the meeting; by
        his testimony, after Lansdale''s memorandum of Aug. 13; McNamara, "several days later."'
      tags: [name:mccone-john-a, name:mcnamara-robert-s]
- add:
    entry:
      id: cal.1962-08-11.cuba
      when: Aug. 11
      date: '1962-08-11'
      thread: cuba
      c: 'McCone''s morning briefing, by Harvey''s account. Harvey: the question of assassination inappropriate "in this form
        and at that forum." McCone agrees; he had, the afternoon or evening before, personally called the one who made the
        proposal; "if I got myself involved in something like this, I might end up getting myself excommunicated." Harvey
        says nothing of the operation through Rosselli.'
      n: '[[w.sen-church-alleged-assassination-plots]], 105 (Harvey, testimony, June 25, 1975, 71). Made public: the Church
        Committee''s interim report, Nov. 20, 1975. See [[cal.1962-08-10.cuba-2]]. Names: McCone, Harvey, Rosselli.'
      tags: [name:mccone-john-a, name:harvey-william-k, name:rosselli-john]
- add:
    entry:
      id: cal.1962-08-31.cuba
      when: Aug. 31
      date: '1962-08-31'
      thread: cuba
      c: 'Lansdale, in a proposed projection of actions for Phase II of Mongoose, includes a task "to provoke incidents between
        Cubans and Bloc personnel to exacerbate tensions."'
      n: '[[w.sen-church-alleged-assassination-plots]], 147 n.1 (Memo to SGA, Action No. 47, Aug. 31, 1962). Made public:
        the Church Committee''s interim report, Nov. 20, 1975. To check: Memo to the SGA, Action No. 47, Aug. 31, 1962 (cited
        by [[w.sen-church-alleged-assassination-plots]], 147 n.1). See [[cal.1962-08-30.cuba-2]]. Names: Lansdale.'
      tags: [name:lansdale-edward-g]
- add:
    entry:
      id: cal.1962-09-12.cuba
      when: Sept. 12
      date: '1962-09-12'
      thread: cuba
      c: 'Lansdale to Taylor, Rusk and McNamara: the Special Group, as a means of "emphasizing such activity," has replaced
        the task with one to "cause actions by Cubans against Bloc personnel," and noted that "consideration will be given
        to provoking and conducting physical attacks on Bloc personnel."'
      n: '[[w.sen-church-alleged-assassination-plots]], 147 n.1 (Memo to Taylor, Rusk, and McNamara, from Lansdale, Sept.
        12, 1962, 1–2). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Lansdale to Taylor,
        Rusk and McNamara, Sept. 12, 1962 (cited by [[w.sen-church-alleged-assassination-plots]], 147 n.1). See [[cal.1962-08-31.cuba]];
        [[cal.1962-09-09.cuba]]. Names: Lansdale, Taylor, Rusk, McNamara. Check: the day of the Group''s decision.'
      tags: [name:lansdale-edward-g, name:taylor-maxwell, name:rusk-dean, name:mcnamara-robert-s]
- add:
    entry:
      id: cal.1963-01.cuba-2
      when: Jan., early
      date: 1963-01
      thread: cuba
      c: Harvey pays Rosselli $2,700 to defray the Cuban's expenses.
      n: '[[w.sen-church-alleged-assassination-plots]], 84 (I.G. Report, 52). Made public: the Church Committee''s interim
        report, Nov. 20, 1975. To check: Inspector General''s Report, 1967, 52 (cited by [[w.sen-church-alleged-assassination-plots]],
        84). See [[cal.1962-09-11.cuba-2]]. Names: Harvey, Rosselli. Check: the day.'
      tags: [name:harvey-william-k, name:rosselli-john]
- add:
    entry:
      id: cal.1963-06.cuba-2
      when: June
      date: 1963-06
      thread: cuba
      c: Harvey and Rosselli at a farewell dinner, before Harvey goes on another assignment, watched by the FBI. Papich, the
        FBI's liaison with the CIA, tells Harvey that Hoover will be informed.
      n: '[[w.sen-church-alleged-assassination-plots]], 104 n.1 (I.G. Report, 51; Harvey then told Helms, who agreed, by the
        report, "there was no need to brief McCone unless a call from Hoover was expected"). Made public: the Church Committee''s
        interim report, Nov. 20, 1975. To check: Inspector General''s Report, 1967, 51 (cited by [[w.sen-church-alleged-assassination-plots]],
        104 n.1). See [[cal.1963-02.cuba]]. Names: Harvey, Rosselli, Hoover. Check: the day; the report has the new assignment,
        not the dinner, in June 1963.'
      tags: [name:harvey-william-k, name:rosselli-john, name:hoover-j-edgar]
- add:
    entry:
      id: cal.1963-08-16.crime-and-hijacking
      when: Aug. 16
      date: '1963-08-16'
      thread: crime-and-hijacking
      also: [cuba]
      c: 'The *Chicago Sun-Times*: the CIA had a connection with Giancana. "Justice Department sources" believe he never
        did any spying for the CIA, but pretended to go along with the Agency "in the hope that the Justice Department''s
        drive to put him behind bars might be slowed—or at least affected—by his ruse of cooperation with another government
        agency."'
      n: '[[w.sen-church-alleged-assassination-plots]], 107 and n.3. See [[cal.1962-05-09.crime-and-hijacking-maheu]]. Names:
        Giancana.'
      tags: [name:giancana-sam]
- add:
    entry:
      id: cal.1967-05-23.cuba
      when: May 23
      date: '1967-05-23'
      thread: cuba
      c: The CIA Inspector General's report on the plots against Castro, made at Johnson's direction to Helms after Pearson's
        column, dated this day.
      n: '[[w.sen-church-alleged-assassination-plots]], 179 (Helms, testimony, June 13, 1975, 35–38; after receiving it Helms
        briefed the President "orally about the contents," the day not given, his notes carrying the story through mid-1963).
        Made public: in part, the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1967-04-24.cuba]]. Names: Johnson,
        Helms, Pearson, Castro.'
      tags: [name:johnson-lyndon-b, name:helms-richard, name:pearson-drew, name:castro-fidel]
- cite:
    id: cal.1961-04-19.cuba-3
    item: '[[w.sen-church-alleged-assassination-plots]], 124 (a CIA memorandum for the record of Apr. 24, 1961: on Apr. 19–20
      the President and other officials, McNamara and Lemnitzer among them, met a translator and several members of Cuban
      groups of the Bay of Pigs, one of them a party to the passage of poison pills to Cuba in March or April; the atmosphere
      one of depression over the failure; not the Council by name, Opa-Locka, Berle and Schlesinger, the hour or the words)'
    units: '?'
