    units: A
- check:
    id: cal.1962-06.cuba-2
    text: 'Check: the day: [[w.sen-church-alleged-assassination-plots]], 84, has Rosselli''s report of the team to Harvey June
      21, 1962.'
- cite:
    id: cal.1963-01.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 86, 87 n.2 (the Inspector General''s report: January 1963, "when
      Fitzgerald replaced Harvey as Chief of Task Force W"; the Special Affairs Staff the new name)'
    units: A
- cite:
    id: cal.1963-02.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 84 (Harvey terminated the operation in mid-February 1963, at a meeting
      with Rosselli in Los Angeles, Rosselli to taper off his communications with the Cubans, I.G. Report, 52–53; his doubts
      by September 1962)'
    units: A
- check:
    id: cal.1963-02.cuba
    text: 'Check: the day: [[w.sen-church-alleged-assassination-plots]], 84: "mid-February 1963," at a meeting with Rosselli
      in Los Angeles.'
- cite:
    id: cal.1963-10-11.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 87 (at a meeting "late in the fall of 1963," AM/LASH, raising again
      the possibility of defecting, asked for military supplies, a device to protect himself and a meeting with Robert Kennedy,
      by Case Officer 2''s testimony, Aug. 1, 1975, 48–50; not Paris, or Cubela by name)'
    units: '?'
- check:
    id: cal.1963-10-11.cuba
    text: 'Check: the day: [[w.sen-church-alleged-assassination-plots]], 87, puts AM/LASH''s request to meet Robert Kennedy
      at a meeting "late in the fall of 1963."'
- cite:
    id: cal.1962-09-09.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 147 n.1 (the record of the Special Group (Augmented)''s meeting of
      Sept. 9, 1962: "It was suggested that the matter of attacking and harassing of Soviet personnel within Cuba should be
      considered"; not the place, McNamara or Robert Kennedy''s notes)'
    units: '?'
- variant:
    id: cal.1961-11-09.cuba
