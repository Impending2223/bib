    item: '[[w.sen-church-alleged-assassination-plots]], 72–73, 93–94 (the cable to the Havana Station early July 21, "Possible
      removal top three leaders is receiving serious consideration at HQS," the Cuban to arrange an "accident" for Raúl Castro,
      $10,000 "after successful completion"; the cable of July 22, signed by Barnes: "Do not pursue ref. Would like to drop
      matter"; not "the chief of station")'
    units: B
- cite:
    id: cal.1961-02.cuba-2
    item: '[[w.sen-church-alleged-assassination-plots]], 73 (I.G. Report, 21–22: the botulinum toxin; ready Oct. 7, 1960;
