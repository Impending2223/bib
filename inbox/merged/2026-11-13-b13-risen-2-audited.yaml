      when: Apr. 7
      date: '1964-04-07'
      thread: civil-rights-bill
      c: 'Tuesday. Mansfield and Humphrey bring some thirty absent Democratic senators into a meeting, seated in rows before a table with the two, Magnuson and Hart. Mansfield: "I do not relish the job to which you have elected me"; he cannot do it unless they meet him halfway. Humphrey: a quorum duty roster; the senators to report whenever away from the Capitol.'
      n: '[[w.risen-bill-of-the-century]], 196–97 (the meeting; the words in part). To check: statement by Senator Mansfield, Apr. 7, box 28, series 22, Mike Mansfield Papers, University of Montana; notes by Raymond Wolfinger, Apr. 9, 1964, box 23, Filvaroff and Wolfinger Papers; [[w.whalen-longest-debate]], 157–58 (cited by [[w.risen-bill-of-the-century]], 197 n.20). See [[cal.1964-04-04.civil-rights-bill-4]]. Names: Mansfield, Humphrey, Magnuson, Hart.'
