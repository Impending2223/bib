    units: A, B, D
- check:
    id: cal.1964-04-21.civil-rights-bill
    text: 'Check: Risen, 208–09, has Dirksen offer his statute-of-limitations amendment and Talmadge call up his jury trial amendment "a few minutes" after on Apr. 20; his note 58 gives the Record of Apr. 21, 8613–66.'
- cite:
    id: cal.1964-04-21.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 208–09, 212 (Talmadge asks that his amendment be read and made the pending business: a jury trial for anyone charged with violating a court decree under the antidiscrimination titles, 209; "all criminal contempt cases," 212; the Magna Carta; Risen''s day Apr. 20; not the thirty-seven days)'
    units: '?'
- check:
    id: cal.1964-04-21.republican-party-congress
    text: 'Check: Risen, 209, has the quiet talk with Humphrey at Dirksen''s desk on the day Talmadge offered his amendment (Apr. 20 by his text), Wolfinger''s diary of "the next day"; the entry has it the afternoon of Apr. 21.'
- cite:
    id: cal.1964-04-21.republican-party-congress
    item: '[[w.risen-bill-of-the-century]], 209 (Dirksen to Humphrey at his desk: he wants the bill to pass and needs one more amendment, to Title II, to leave his mark; Humphrey tells his aides; Wolfinger''s diary)'
    units: '?'
- cite:
    id: cal.1964-04-23.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 209–10 (Mansfield telephones Dirksen into his office, where he sits with Humphrey, Kennedy, Katzenbach, Valeo and Manatos: Talmadge''s amendment would probably pass, a counter-amendment needed; the bargain on days, sixty, Dirksen''s ten, Humphrey''s forty-five, settled at thirty days or $300; not Marshall)'
    units: B, D
- cite:
    id: cal.1964-04-24.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 210 (Apr. 24, Dirksen offers the amendment, to be taken up at once; Stennis: "a slight concession in name"; Russell: "just a mustard plaster on a cancer")'
    units: '?'
- cite:
    id: cal.1964-04-28.civil-rights-bill-2
    item: '[[w.risen-bill-of-the-century]], 210 (Apr. 28, Humphrey bursts in on Johnson, past Bundy and McNamara waiting outside, as he dresses; warns of Dirksen and urges a hard line; Johnson listens, says little)'
    units: '?'
- cite:
    id: cal.1964-04-28.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 211 (that evening, McDonough Hall; Humphrey, Kuchel, Javits and Keating; a choir; Bishop Smith, Archbishop Shehan, Rabbi Miller, Blake; Blake''s speech next day''s headlines; not Humphrey''s suggestion or the lobbying after)'
