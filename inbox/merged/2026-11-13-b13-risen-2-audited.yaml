    entry:
      id: cal.1964-05-07.civil-rights-bill-4
      when: May 7
      date: '1964-05-07'
      thread: civil-rights-bill
      c: 'Mitchell, at his first meeting since the Dirksen talks began, demands the text of Dirksen''s amendments; Katzenbach: there is none, it is being rewritten. Mitchell: the talks should be called off. Humphrey, coming in: his purpose is a bill, the House''s; no title eliminated, none emasculated; "I''d rather have no bill than the shell of a bill." It is not pleasant for him and Kuchel to look as if Dirksen "is writing the ticket." Mitchell, for once, is silent.'
      n: '[[w.risen-bill-of-the-century]], 216–17 (the next day after Morton''s vote, May 6). To check: notes for May 11, 1964, by Raymond Wolfinger, box 23, Filvaroff and Wolfinger Papers; Horn log, May 7, 10:45 (cited by [[w.risen-bill-of-the-century]], 216–17 nn.80–81). See [[cal.1964-05-06.civil-rights-bill]]. Names: Mitchell, Katzenbach, Humphrey, Kuchel, Dirksen.'
      src:
        c: fc053bb0
        rows:
        - 'w.risen-bill-of-the-century 216–17: all'
      tags:
      - name:mitchell-clarence-jr
      - name:katzenbach-nicholas
      - name:humphrey-hubert-h
      - name:kuchel-thomas-h
      - name:dirksen-everett
