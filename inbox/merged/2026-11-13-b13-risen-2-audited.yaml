    entry:
      id: cal.1964-06-16.civil-rights-bill-2
      when: June 16
      date: '1964-06-16'
      thread: civil-rights-bill
      c: 'About seven in the evening. Eastland moves to adjourn, with Dominick and Mechem of the Republicans for him. Dirksen runs to Dominick, jabs a finger at his chest: he will do what the leadership wants. Mechem, who has left the chamber, is sent for by pages; Dirksen takes him by the arm, drags him under a desk and tells him to change his vote. He does.'
      n: '[[w.risen-bill-of-the-century]], 234 (Wolfinger''s account, in part). To check: Wolfinger, "Final Dictated Thoughts" (cited by [[w.risen-bill-of-the-century]], 234 n.39). See [[cal.1964-06-16.civil-rights-bill]]. Names: Eastland, Dominick, Mechem, Dirksen.'
