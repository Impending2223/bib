- cite:
    id: cal.1964-05-13.civil-rights-bill-3
    item: '[[w.risen-bill-of-the-century]], 217 (the morning of May 13, before the day''s talks, Humphrey to Johnson: "We''ve got a much better bill than anybody ever dreamed possible")'
