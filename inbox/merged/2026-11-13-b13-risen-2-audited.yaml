      date: '1964-06-16'
      thread: civil-rights-bill
      c: 'As the session ends, Russell to Hill, overheard by Stewart: if Hill will handle Thurmond, he will take care of Ervin and Long, who are "disgracing all of us."'
      n: '[[w.risen-bill-of-the-century]], 234 (the words in part; Stewart overhearing). To check: Wolfinger, "Final Dictated Thoughts on the Civil Rights Debate," box 15, Filvaroff and Wolfinger Papers, University at Buffalo; *New York Times*, June 17, 1964, 1 (cited by [[w.risen-bill-of-the-century]], 234 n.41). See [[cal.1964-06-16.civil-rights-bill]]. Names: Russell, Hill, Thurmond, Ervin, Long.'
