      when: Feb. 28
      date: '1964-02-28'
      thread: civil-rights-bill
      c: '11 a.m., Humphrey''s whip office. Humphrey with Katzenbach and Marshall to join the White House''s and the Senate''s plans. Katzenbach: work with the Republicans, whatever it looks like; the bill needs a united front. Every amendment to go through the two parties'' leaders, Humphrey and Kuchel.'
      n: '[[w.risen-bill-of-the-century]], 180 (Katzenbach''s two points). To check: minutes of meeting with Katzenbach et al., Feb. 28, box 28, series 22, Mike Mansfield Papers, University of Montana (cited by [[w.risen-bill-of-the-century]], 180 n.38). See [[cal.1964-02-28.civil-rights-bill]]. Names: Humphrey, Katzenbach, Marshall, Kuchel.'
