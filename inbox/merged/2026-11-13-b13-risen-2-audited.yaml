      thread: civil-rights-bill
      c: 'Valeo, Secretary of the Senate, to Mansfield by memorandum: by Apr. 20 they must face where to go next. Thirty-eight senators, Dirksen among them, dead against cloture; eleven more strongly leaning against.'
      n: '[[w.risen-bill-of-the-century]], 196 (the memorandum, in part). To check: Valeo to Mansfield, Apr. 9, 1964, box 99, series 22, Mike Mansfield Papers, University of Montana (cited by [[w.risen-bill-of-the-century]], 196 n.18). See [[cal.1964-04-06.republican-party-congress]]. Names: Valeo, Mansfield, Dirksen.'
