      when: Apr. 10
      date: '1964-04-10'
      thread: civil-rights-bill
      c: 'Mitchell to the NAACP''s chapters, by memorandum: "Senator Dirksen''s amendments are poison for the most part." All senators to be pressed to oppose them.'
      n: '[[w.risen-bill-of-the-century]], 202 (the words in part). To check: Senate Letter No. 5, Apr. 10, 1964, box 231, part IX, NAACP Papers, Library of Congress (cited by [[w.risen-bill-of-the-century]], 202 n.38). See [[cal.1964-04-07.republican-party-congress]]. Names: Mitchell, Dirksen.'
