      - civil-rights-bill
      c: 'Dirksen says he has pared his amendments from seventy to fifteen, ten of them on Title VII, from forty. He keeps the largest: state fair employment bodies to supersede the federal, no suits by the commission. He drops the two-year delay in Title VII.'
      n: '[[w.risen-bill-of-the-century]], 203 (the cut; the two-year delay dropped). To check: *Los Angeles Times*, Apr. 11, 1964, A2; *Washington Post*, Apr. 11, 1964, A2; Horn log, Apr. 16 (cited by [[w.risen-bill-of-the-century]], 203 n.42). See [[cal.1964-04-07.republican-party-congress]]. Names: Dirksen.'
