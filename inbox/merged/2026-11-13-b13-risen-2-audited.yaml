      when: June 11
      date: '1964-06-11'
      thread: civil-rights-bill
      c: 'Bipartisan Civil Rights Newsletter, the morning after cloture: some of the amendments may "have hidden dangers behind an appealing facade"; supporters to stay on the floor or in their offices while the Senate sits.'
      n: '[[w.risen-bill-of-the-century]], 230 (the words in part). To check: Bipartisan Civil Rights Newsletter, June 11, 1964, box 32, series 18, Mike Mansfield Papers, University of Montana (cited by [[w.risen-bill-of-the-century]], 230 n.25). See [[cal.1964-04-09.civil-rights-bill-3]].'
