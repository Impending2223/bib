    entry:
      id: cal.1964-05-25.civil-rights-bill-2
      when: May 25
      date: '1964-05-25'
      thread: civil-rights-bill
      c: Morning, the Department of Justice. Staff for the key senators settle the last differences. Humphrey and Mansfield have agreed that Dirksen's amendments go in as one joint substitute. Nothing in the bill to justify minority hiring quotas; the atheists' exclusion from Title VII dropped; the waiting period for voluntary compliance in Titles II and VII cut from sixty days to thirty.
      n: '[[w.risen-bill-of-the-century]], 222 (the meeting and its terms). To check: "Ray''s Running Journal," May 25, 1964, box 23, Filvaroff and Wolfinger Papers (cited by [[w.risen-bill-of-the-century]], 222 n.97). See [[cal.1964-05-26.civil-rights-bill]]. Names: Humphrey, Mansfield, Dirksen.'
      src:
        c: 47b52a76
        rows:
        - 'w.risen-bill-of-the-century 222: all'
      tags:
      - name:humphrey-hubert-h
      - name:mansfield-mike
      - name:dirksen-everett
- add:
    entry:
      id: cal.1964-06-06.civil-rights-bill-2
      when: June 6
      date: '1964-06-06'
      thread: civil-rights-bill
      c: 'Saturday. Mansfield rises to present the cloture motion and at once offers to put it off if the Senate will vote on Hickenlooper''s amendments. The Southerners, checkmated either way, agree. Russell: "a very graceful ballet," of which he has "not derived much pleasure."'
      n: '[[w.risen-bill-of-the-century]], 224 (the offer; Russell''s words in part; Hickenlooper''s amendments offered that afternoon for a vote Tuesday). To check: *Washington Post*, June 7, 1964, 1; Humphrey, "Memorandum," 91 (cited by [[w.risen-bill-of-the-century]], 224 nn.1–3). See [[cal.1964-06-05.republican-party-congress]]. Names: Mansfield, Hickenlooper, Russell.'
      src:
        c: d7d87618
        rows:
        - 'w.risen-bill-of-the-century 224: all'
      tags:
      - name:mansfield-mike
      - name:hickenlooper-bourke-b
