- cite:
    id: cal.1964-04-29.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 211–12 (Dirksen to reporters beforehand, "Now it''s your play"; he offers twenty-two to twenty-five votes for cloture for Johnson''s endorsement; Johnson accepts a commemorative clock; afterward, to reporters, they barely discussed civil rights)'
    units: B
- cite:
    id: cal.1964-04-29.civil-rights-bill-3
    item: '[[w.risen-bill-of-the-century]], 212 (Johnson to Mansfield before the meeting: "acting like a shit ass"; not the beagles)'
    units: '?'
- cite:
    id: cal.1964-05-01.civil-rights-bill-2
    item: '[[w.risen-bill-of-the-century]], 212 (May 1, Russell, worn down on Thurmond''s absolutists, will allow a vote in five days; Morton''s perfecting amendment limiting Talmadge''s to civil rights cases; Dirksen that afternoon calls the supporters and staffs to his office to say he will negotiate)'
    units: '?'
- check:
