- check:
    id: cal.1964-05-26.civil-rights-bill-4
    text: 'Check: Risen, 226, has Cannon at the White House May 27; the entry has Tuesday, May 26.'
- cite:
    id: cal.1964-05-26.civil-rights-bill-4
    item: '[[w.risen-bill-of-the-century]], 226 (Cannon at the White House to see the President, "the Johnson treatment"; the steel workers'' pressure; the silver-dollar mint, by Biedler''s account; Risen''s day May 27)'
    units: '?'
- cite:
    id: cal.1964-06-10.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 224–25, 227–29 (Morton''s amendment, jury trials for all criminal contempt but under Title I, adopted Tuesday 51 to 48, 224–25; cloture, 71 to 29, 44 Democrats and 27 Republicans for, 23 and 6 against, the first on a civil rights measure; Byrd''s fourteen hours thirteen minutes; Dirksen, up at 5 a.m. at Broad Run, his speech, cut off by Metcalf; Engle wheeled in, his finger to his eye, Kuchel''s request; all 100 senators present; 534 hours 1 minute 51 seconds of debate in seventy-five days; O''Brien: "like the home team winning the Super Bowl")'
    units: A, B, C, D
- cite:
    id: cal.1964-06-10.civil-rights-bill-5
    item: '[[w.risen-bill-of-the-century]], 230–31 (Ervin''s double jeopardy amendment, the first after cloture: 47 to 48, Talmadge withdraws his, a recount 49 to 48; Mansfield recesses just after noon; six hundred amendments in prospect)'
