- cite:
    id: cal.1964-06-02.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 223 (Russell''s offer to allow votes on the jury trial amendments, to win back filibuster-weary Republicans and upset the leadership''s timing; the Democrats'' counter-filibuster; Risen''s day June 1)'
