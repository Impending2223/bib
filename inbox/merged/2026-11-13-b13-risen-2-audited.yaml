      when: July 2
      date: '1964-07-02'
      thread: civil-rights-bill
      c: 'At the signing Johnson takes Katzenbach aside: "What are we going to do next year in civil rights?" Katzenbach: "we just spent two years on this bill and practically nothing else happened." Johnson: "Let''s get a voting rights bill."'
      n: '[[w.risen-bill-of-the-century]], 250 (the exchange). To check: [[w.stern-calculating-visions]], 184 (cited by [[w.risen-bill-of-the-century]], 250 n.30). See [[cal.1964-07-02.civil-rights-bill]]. Names: Johnson, Katzenbach.'
      src:
        c: 4146ebe0
        rows:
        - 'w.risen-bill-of-the-century 250: all'
      tags:
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
- add:
