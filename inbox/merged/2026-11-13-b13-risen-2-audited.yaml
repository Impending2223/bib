- cite:
    id: cal.1964-06-05.republican-party-congress
    item: '[[w.risen-bill-of-the-century]], 223–25 (Hickenlooper''s rebellion, as many as twenty senators; Dirksen ill at his farm; his amendments, the Morton jury trial, Cotton''s limit of Title VII to employers of a hundred, his own to strike school desegregation aid; Mansfield''s offer Saturday, June 6, and that evening Humphrey''s commitments from Mundt, Hruska and Cotton, the unanimous consent agreement "brought us the extra votes that we needed," by Humphrey''s memorandum)'
