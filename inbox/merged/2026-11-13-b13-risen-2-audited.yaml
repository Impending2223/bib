    id: cal.1964-05-26.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 222 (May 26, Dirksen, Mansfield, Humphrey and Kuchel present the compromise: "we have at long last fashioned ... a workable bill"; the joint substitute of May 25)'
