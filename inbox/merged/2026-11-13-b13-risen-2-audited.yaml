      c: 'After the House''s session, Rusk to Weltner of Atlanta by telephone: congratulations on his vote for the bill, against his vote of February.'
      n: '[[w.risen-bill-of-the-century]], 241 (the call; Weltner''s speech that morning, 240–41, belongs to the House''s debate and vote, [[cal.1964-07-02.civil-rights-bill]]). To check: Leadership Conference on Civil Rights, Memo No. 44, July 6, 1964, Leadership Conference on Civil Rights Papers, Library of Congress; 110 Cong. Rec. 15,869–97 (1964); *Washington Post*, July 3, 1964, A1; *Los Angeles Times*, July 3, 1964, 1 (cited by [[w.risen-bill-of-the-century]], 241 n.4). Names: Rusk, Weltner.'
