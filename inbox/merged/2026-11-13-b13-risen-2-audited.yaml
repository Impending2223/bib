    id: cal.1964-06-09.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 226 (Humphrey tells Johnson at 7:30 he has the votes; Johnson: it would be difficult; Humphrey in private worried)'
    units: '?'
- cite:
    id: cal.1964-06-09.civil-rights-bill-5
    item: '[[w.risen-bill-of-the-century]], 226 (Humphrey to dinner at the Monocle with Andrew Glass while Byrd speaks; then the telephones through the night; Williams and Curtis pass word for cloture; no word from Edmondson, Yarborough and Cannon by 1 a.m.)'
