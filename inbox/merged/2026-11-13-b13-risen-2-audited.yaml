      when: June 10
      date: '1964-06-10'
      thread: civil-rights-bill
      c: 'Senate, before the roll. Mansfield, playing down his support for the bill: "The Senate now stands at the crossroads of history." He reads a letter from a young Montana mother, her children to learn that justice and freedom are birthrights.'
      n: '[[w.risen-bill-of-the-century]], 227 (the speech and the letter in part). To check: 110 Cong. Rec. 12855–68 (1964) (cited by [[w.risen-bill-of-the-century]], 227 n.13). See [[cal.1964-06-10.civil-rights-bill]]. Names: Mansfield.'
