- cite:
    id: cal.1964-05-20.republican-party-congress
    item: '[[w.risen-bill-of-the-century]], 221 (the day after the sermon Dirksen meets the Republicans on Title VII; Hickenlooper to reporters: "serious reservations"; Dirksen''s changes)'
