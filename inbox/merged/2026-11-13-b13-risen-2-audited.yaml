- cite:
    id: cal.1964-06-16.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 233–34 (June 16, Russell''s morning meeting of the Southerners fails; Mansfield''s "harsher tactics"; thirty-four roll calls, 12:01 a.m., a thirteen-hour session, more than the sixteen of 1951; fourteen by Thurmond, eight by Ervin, seven by Long; Dirksen''s outburst at Long)'
