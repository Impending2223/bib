      c: 'Clark to Dirksen in the well of the Senate, of his last unrevealed amendment, to Title II: "hydrogen bomb"? Dirksen: not a hydrogen bomb, "more like a firecracker that a twelve-year-old boy would set off." Clark: by "a nice boy or by a juvenile delinquent"?'
