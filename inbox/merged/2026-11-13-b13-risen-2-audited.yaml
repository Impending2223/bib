      c: Evening, the National Theater, the Royal Shakespeare Company in *The Comedy of Errors*, cohosted by Mrs. Johnson and Udall; several senators there. A quorum call comes by telephone to the theater office. Udall will not stop the play. The quorum is made by the others.
      n: '[[w.risen-bill-of-the-century]], 202 (the evening of the baseball game). To check: Loevy, *To End All Segregation*, 194; Finch, *Legacies*, 78 (cited by [[w.risen-bill-of-the-century]], 202 n.37). See [[cal.1964-04-13.civil-rights-bill]]. Names: Lady Bird Johnson, Stewart Udall.'
