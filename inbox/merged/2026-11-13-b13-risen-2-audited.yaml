      id: cal.1964-03-30.civil-rights-bill-2
      when: Mar. 30
      date: '1964-03-30'
      thread: civil-rights-bill
      c: 'Humphrey to Stewart, his assistant, by memorandum: "we are beginning to lose the public relations battle" on the bill; the Coordinating Committee''s advertisements "are having their effect." Racial violence may come in the summer, "small Algerias." The answer is to pass the bill fast, and a publicity campaign of religious leaders, doctors and business people at once.'
      n: '[[w.risen-bill-of-the-century]], 190 (the memorandum, in part; the leaving out of the civil rights groups and labor is Risen''s remark). To check: Humphrey to Stewart, Mar. 30, 1964, box 15, David B. Filvaroff and Raymond E. Wolfinger Civil Rights Act Papers, University at Buffalo (cited by [[w.risen-bill-of-the-century]], 190 n.3). See [[cal.1964-03-30.civil-rights-bill]]. Names: Humphrey.'
