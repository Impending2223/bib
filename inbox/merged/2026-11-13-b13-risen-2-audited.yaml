    item: '[[w.risen-bill-of-the-century]], 214 & n.74 (Mitchell, for arrests at quorum calls: "Who is Senator Russell that cannot be arrested, if by being arrested he''ll save some lives in Mississippi this summer?"; the day by n.74, Wolfinger''s notes of the Apr. 30, 9:30 meeting; Mitchell and Rauh shunted aside, wanting briefing on the afternoon talks; not his words in the entry)'
