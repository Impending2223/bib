      when: June 10
      date: '1964-06-10'
      thread: civil-rights-bill
      c: 'Russell, thirty minutes, the last attack: the bill will "destroy forever the doctrine of the separation of powers."'
      n: '[[w.risen-bill-of-the-century]], 227 (the speech, thirty minutes; the words in part). To check: 110 Cong. Rec. 12855–68 (1964) (cited by [[w.risen-bill-of-the-century]], 227 n.14). See [[cal.1964-06-10.civil-rights-bill-9]]. Names: Russell.'
      src:
