- cite:
    id: cal.1964-05-06.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 216 (May 6, the Morton amendment; the first vote 45 to 45; Moss, kept outside on a telephone call, late, lights into Mansfield and votes against tabling out of spite; Mansfield clears the floor of all but senators; Moss placated, the second motion to table carried; Russell objects to moving to the Dirksen-Mansfield amendment)'
