      when: Feb. 20
      date: '1964-02-20'
      thread: civil-rights-bill
      c: 'Mansfield''s advisers, from interviews with senators and their staffs, to Mansfield: a cloture attempt "precarious at best" even with Dirksen. A try that fails will encourage the Southerners and mark who will not vote for it; the Southern chairmen''s power over the uncommitted is great.'
      n: '[[w.risen-bill-of-the-century]], 175–76 (the study; Risen gives the words in part). To check: Conclusions of Cloture Study, Feb. 20, 1964, box 14, David B. Filvaroff and Raymond E. Wolfinger Civil Rights Act Papers, University at Buffalo (cited by [[w.risen-bill-of-the-century]], 175 n.25). See [[cal.1964-02-19.civil-rights-bill]]. Names: Mansfield, Dirksen.'
