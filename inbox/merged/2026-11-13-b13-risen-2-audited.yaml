    id: cal.1964-06-05.republican-party-congress
    text: 'Check: Risen, 224, has Humphrey win the commitments of Mundt, Hruska and Cotton the evening of Saturday, June 6, after Mansfield''s offer that day.'
- cite:
    id: cal.1964-06-08.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 225 (Monday, Mansfield''s cloture motion, signed by 27 Democrats and 11 Republicans, intentionally fewer than the support; the two-day wait, the vote Wednesday)'
