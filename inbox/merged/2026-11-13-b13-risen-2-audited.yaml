    id: cal.1964-05-05.elections-1964
    item: '[[w.risen-bill-of-the-century]], 214–15 (Indiana, May 5: Wallace 30 percent of the Democratic vote, less than some expected; strongest near Gary and in the middle of the State; Satterfield''s committee''s advertisements in the Polish, Serbian and German papers; Goldwater: the Wallace showing "might take out" the public accommodations section and FEPC; not the Ohio or D.C. results)'
