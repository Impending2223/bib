- cite:
    id: cal.1964-05-12.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 217 (the Tuesday leaders'' breakfast, Mansfield: progress "nil"; Johnson shouts at Mansfield and Humphrey to enforce round-the-clock sessions; they refuse; the Senate ties the filibuster record that day; not Humphrey''s count)'
