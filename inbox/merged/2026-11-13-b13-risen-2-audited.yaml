    item: '[[w.risen-bill-of-the-century]], 231–32 (June 11, the civil rights forces regroup in Humphrey''s office; Justice''s language limits the double jeopardy bar to "the laws of the United States"; four of Miller''s perfecting amendments accepted, twelve roll calls on Southern amendments lost; not 80 to 16)'
