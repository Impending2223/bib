      n: '[[w.risen-bill-of-the-century]], 200 (the night, the copy, Wolfinger''s words in part). To check: Wolfinger, recollection (cited by [[w.risen-bill-of-the-century]], 200 n.31, notes by Raymond Wolfinger, Apr. 9, 1964, box 23, Filvaroff and Wolfinger Papers, University at Buffalo). See [[cal.1964-03-30.republican-party-congress]]. Names: Mitchell, Humphrey, Dirksen.'
