      when: July 2
      date: '1964-07-02'
      thread: civil-rights-bill
      c: 'The East Room, after Johnson''s remarks. Johnson hands out pens, an aide fetching more. At the back Robert Kennedy stands alone; Roy Reuther drags him to the desk: "I know you have reserved a pen for your attorney general." Johnson shoves a handful at him: "Give this one to Burke Marshall. Give this one to John Doar." A second pen on top. Fauntroy, for SCLC: the sadness in Kennedy''s eyes, the coldness of the President''s manner.'
      n: '[[w.risen-bill-of-the-century]], 243–44 (Roy Reuther''s act, Victor Reuther''s and Fauntroy''s words). To check: [[w.shesol-mutual-contempt]], 165 (cited by [[w.risen-bill-of-the-century]], 244 n.9). See [[cal.1964-07-02.civil-rights-bill]]. Names: Robert Kennedy, Johnson, Marshall, Doar.'
      src:
