      id: cal.1964-07-02.civil-rights-bill-20
      when: July 2
      date: '1964-07-02'
      thread: civil-rights-bill
      c: 'The Senate leaders of the bill gather in Humphrey''s suite for a toast. Magnuson: enjoy the party, "just wait until the professors of government descend"; how many dissertations will be written. A few hours later Humphrey and Stewart leave; hundreds still wait on the sidewalk for him.'
