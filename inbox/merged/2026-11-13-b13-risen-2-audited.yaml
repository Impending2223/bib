      id: cal.1964-04-01.civil-rights-bill
      when: Apr. 1
      date: '1964-04-01'
      thread: civil-rights-bill
      c: 'Justice Department officials meet on the bill''s acceptance in the South once it is law. The networks to carry it: Oberdorfer''s committees of Southern business and civic leaders, by trade; Miller and Spike''s clergy; the Potomac Institute''s editors and civic groups. The message: the law is coming, the government will enforce it, the whole region going along at once.'
      n: '[[w.risen-bill-of-the-century]], 192–93 (the meeting and its plan). To check: Fleming to ad hoc committee members, Mar. 26 and Apr. 7, 1964, box 27, Burke Marshall Papers, Kennedy Library (cited by [[w.risen-bill-of-the-century]], 192 n.9). Names: Oberdorfer, Miller.'
