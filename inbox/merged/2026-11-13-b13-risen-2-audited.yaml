      when: Feb. 19
      date: '1964-02-19'
      thread: civil-rights-bill
      c: 'Morning. Mansfield with Russell on how each side will meet the bill: he will make no major move without telling Russell first; he means to put the House bill on the calendar, past Judiciary. Russell: he will not hold up the tax bill and will let committees sit during the debate, though he cannot answer for the others; he will filibuster the motion, a few weeks, and then drop it.'
      n: '[[w.risen-bill-of-the-century]], 175 (the meeting and its terms). To check: notes on meeting with Senator Russell, Feb. 19, 1964, box 28, series 22, Mike Mansfield Papers, University of Montana; Meeting on Civil Rights, two memoranda, Feb. 19, box 99, series 22 (cited by [[w.risen-bill-of-the-century]], 175 nn.24–25). See [[cal.1964-02-17.civil-rights-bill]]. Names: Mansfield, Russell.'
      src:
        c: baedca46
        rows:
        - 'w.risen-bill-of-the-century 175: all'
      tags:
      - name:mansfield-mike
      - name:russell-richard-b
