- cite:
    id: cal.1964-05-26.civil-rights-bill-3
    item: '[[w.risen-bill-of-the-century]], 222 (Russell on the compromise: it "puts Charles Sumner, Thaddeus Stevens, and Ben Wade to shame"; Dirksen "has killed off a rapidly growing Republican Party in the South")'
