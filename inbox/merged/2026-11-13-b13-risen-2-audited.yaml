    units: A, D
- cite:
    id: cal.1964-05-20.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 219–20 (the remark, "no army can withstand the strength of an idea whose time has come," to reporters the afternoon of May 19 by Risen, with the civil service, women''s suffrage and child labor; not "the bill will pass")'
