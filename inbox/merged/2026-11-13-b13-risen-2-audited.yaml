      date: '1964-04-04'
      thread: civil-rights-bill
      c: 'After the quorum failure, Humphrey in an emergency meeting of Democratic senators demands to know where the missing are; he telegraphs each of them to return at once. Three Democratic title captains among them: Magnuson, Pastore, Long of Missouri.'
      n: '[[w.risen-bill-of-the-century]], 196 (the meeting, the telegrams, the three). To check: [[w.whalen-longest-debate]], 157–58 (the telegrams). See [[cal.1964-04-04.civil-rights-bill]]. Names: Humphrey, Magnuson, Pastore, Long.'
