      c: Two hundred clergymen of the three faiths kneel on the Supreme Court steps across from the Capitol. Spike of the National Council of Churches prays that those who consider legislation "see the larger need, and ... hear the voice of the oppressed rather than the complaints of the comfortable."
      n: '[[w.risen-bill-of-the-century]], 221–22 (the service; the prayer in part). To check: *New York Times*, May 25, 1964, 1 (cited by [[w.risen-bill-of-the-century]], 222 n.96). See [[cal.1964-05-18.civil-rights-organizations]].'
