- cite:
    id: cal.1964-04-19.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 205 (Apr. 19, three seminarians, a Catholic, a Protestant and a Jew, stand before the Lincoln Memorial for hours, relieved by another three, for weeks; students from seventy-five schools follow; Molnar, Levine and Leatherwood the organizers; not the numbers on the first day)'
    units: '?'
- cite:
    id: cal.1964-04-16.civil-rights-bill-2
    item: '[[w.risen-bill-of-the-century]], 202–03 (Apr. 16, Rauh and Mitchell with Humphrey and Senate staffers: "Cloture means compromise," "To date, the South has the advantage"; Humphrey: "We will have to plan on cloture"; the President grabbed his shoulder, "damn near broke my arm," three weeks before; the quorum bell ends it)'
    units: A, E, F
- cite:
    id: cal.1964-04-16.republican-party-congress
    item: '[[w.risen-bill-of-the-century]], 203 (Apr. 16, Dirksen introduces the pared amendments but does not call them up; a further Title VII amendment promised; the list, as announced Apr. 11, ten on Title VII, keeping the state FEPCs over the federal commission and barring its own suits)'
    units: '?'
- check:
    id: cal.1964-04-16.republican-party-congress
    text: 'Check: Risen, 203, has the pared list (announced Apr. 11, introduced Apr. 16) keep a rule letting the state FEPCs supersede the federal commission and barring the commission''s own suits; the entry has the power to sue left and the States not given precedence.'
- cite:
    id: cal.1964-04-20.civil-rights-organizations
    item: '[[w.risen-bill-of-the-century]], 207 (Apr. 20, Wagner''s four-hour meeting at Gracie Mansion; his "holding a gun to the heart of the city," no day; not the officials, the demands or the decision)'
