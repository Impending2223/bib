    text: 'Check: Risen, 216, has the first vote 45–45 on taking up the Morton amendment, the first motion to table defeated with Moss voting against, and the second carried; the entry has the amendment failing on the tie and, reconsidered, again 45–46.'
- cite:
    id: cal.1964-05-07.civil-rights-bill-3
    item: '[[w.risen-bill-of-the-century]], 217 (the day after Morton''s vote: Dirksen''s objection to "massive resistance" in Title II; after lunch Flynn proposes "pattern or practice"; Ferris to Katzenbach and Marshall at Justice; Marshall: "Jump at it, Charlie")'
