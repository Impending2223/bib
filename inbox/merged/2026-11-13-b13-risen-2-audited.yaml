      when: Mar. 12
      date: '1964-03-12'
      thread: civil-rights-bill
      c: 'The Democratic floor leaders, Humphrey, Hart, Douglas and others: signs that the Republicans mean to bring in strengthening amendments, to embarrass the Democrats, who must vote them down. A Senate staffer, after a talk with Horn, Kuchel''s aide: Kuchel not yet committed to routing amendments through the leaders.'
      n: '[[w.risen-bill-of-the-century]], 187 (the agenda; the staffer''s report, no day). To check: agenda for Democratic Floor Leader Conference, Mar. 12, 1964, box 10, Filvaroff and Wolfinger Papers (cited by [[w.risen-bill-of-the-century]], 187 n.60). See [[cal.1964-02-28.civil-rights-bill-2]]. Names: Humphrey, Hart, Douglas, Kuchel, Horn. Check: the day of the staffer''s report.'
