    id: cal.1964-05-07.civil-rights-bill-2
    item: '[[w.risen-bill-of-the-century]], 215 & n.77 (Udall to Johnson "a few days later," May 7 by n.77: "your gambit on cloture with the Senator at our Tuesday meeting was very persuasive"; not the Nevada senators)'
