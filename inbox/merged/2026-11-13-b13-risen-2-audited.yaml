- cite:
    id: cal.1964-06-10.civil-rights-bill-6
    item: '[[w.risen-bill-of-the-century]], 226–27 (7:30 a.m., Humphrey calls Johnson, then Edmondson, Yarborough and Cannon; Cannon will wait in the cloakroom; orange juice with Cecil Newman; the note to Hart, "69"; Curtis and Williams the night before)'
