- cite:
    id: cal.1964-05-25.elections-1964
    item: '[[w.risen-bill-of-the-century]], 222 (after a long meeting with Wilkins, Eisenhower''s front-page piece urging Senate Republicans to back the bill: "as the party of Lincoln"; "responsible, forward-looking Republicanism"; not Thayer)'
