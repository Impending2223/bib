- cite:
    id: cal.1964-06-09.civil-rights-bill-4
    item: '[[w.risen-bill-of-the-century]], 224–27 (Hickenlooper''s amendment to strike school desegregation aid, Cotton''s for employers of a hundred or more, 224–25; Tuesday, 40 to 56 and 34 to 63; Ervin''s motion to strike Title VII defeated; 7:38 p.m., Byrd begins, a black leather notebook; fourteen hours thirteen minutes; the eight-hundred-page speech, 227)'
