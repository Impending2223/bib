      when: June 15
      date: '1964-06-15'
      thread: civil-rights-organizations
      also:
      - civil-rights-bill
      c: 'About twelve hundred union and church demonstrators, up from New York in 95-degree heat, speak at the Washington Monument, as at the March on Washington, then go through the Senate''s offices. Their demand: no "crippling amendments" to the bill, an end to the amendments and a vote.'
      n: '[[w.risen-bill-of-the-century]], 233 (the day, the numbers, the demand in part). To check: *New York Times*, June 16, 1964, 18 (cited by [[w.risen-bill-of-the-century]], 233 n.36). See [[cal.1964-06-15.civil-rights-bill]].'
