      when: Apr. 13
      date: '1964-04-13'
      thread: civil-rights-bill
      c: 'Mitchell, at a meeting with the Senate leadership, on Dirksen''s amendments: "If we let the Dirksen amendments prevail, it will be a disaster. There will be a Negro revolution around the country." Humphrey, laughing: "Don''t break out in a sweat, Clarence"; the amendments to be analyzed and then tabled.'
      n: '[[w.risen-bill-of-the-century]], 202 (three days after the memorandum of Apr. 10). To check: Horn log, Apr. 13, 1964 (cited by [[w.risen-bill-of-the-century]], 202 n.39). See [[cal.1964-04-10.civil-rights-bill-3]]. Names: Mitchell, Humphrey, Dirksen.'
