      when: Mar. 7
      date: '1964-03-07'
      thread: civil-rights-bill
      c: 'News conference, two days before the motion to take up the bill. Asked how long the filibuster might last, Johnson: the leadership can best assess it; he would not estimate; senators on both sides to have "adequate opportunity" to speak, and then the majority "an opportunity to work its will."'
      n: 'The President''s News Conference of March 7, 1964, [1963–64 Pub. Papers 338](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=422), 342–43. [[w.risen-bill-of-the-century]], 183 (the answer). See [[cal.1964-03-07.vietnam-force-levels]]. Names: Johnson.'
