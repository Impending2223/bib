      n: '[[w.risen-bill-of-the-century]], 246 (the day, the film, the gas). To check: *Tuscaloosa News*, May 1, 2011; "Compliance with Title II: A Summary of Field Reports from Southern States," box 27, Burke Marshall Papers, John F. Kennedy Library (cited by [[w.risen-bill-of-the-century]], 246 n.17).'
