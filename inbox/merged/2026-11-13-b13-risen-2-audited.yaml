    text: 'Check: Risen, 217, has Humphrey''s words to Johnson the morning of May 13, before the negotiations of that day; the entry has them as a call "on the agreement with Dirksen."'
- cite:
    id: cal.1964-05-13.civil-rights-bill-2
    item: '[[w.risen-bill-of-the-century]], 218 (May 13, Kennedy at the table; Dirksen drops a new Title XII, accepts "pattern or practice" for Titles II and VII; Kennedy makes him drop his opposition to Title I''s voting-fraud provisions, to keep McCulloch; Clark''s walkout "prearranged"; the three in a row to reporters; the agreement not binding until the conferences)'
