    id: cal.1964-05.republican-party-congress
    item: '[[w.risen-bill-of-the-century]], 222–23 & n.100 (Mansfield''s concession to Dirksen: no cloture filing until after the June 2 primaries, so June 9 at the earliest, for fear of upsetting the coronation of Goldwater; reported, by n.100, in the *Washington Post* of May 28)'
