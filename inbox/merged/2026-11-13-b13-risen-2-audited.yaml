      when: Feb. 6
      date: '1964-02-06'
      thread: civil-rights-bill
      c: 'House floor. Zelenko, Judiciary counsel, hears Celler accept Willis''s amendment on the Civil Rights Commission and private clubs, and goes to the gallery to ask Marshall whether Justice will step in. Marshall: "We have to give away things. ... After all, we have to deal with the Southerners tomorrow."'
