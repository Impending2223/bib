    text: 'Check: Risen, 212, has Dirksen call the bill''s supporters and staffs to his office "that afternoon" (May 1) and say he will begin negotiations; the entry has the invitation for Tuesday, May 5.'
- cite:
    id: cal.1964-05-04.civil-rights-bill
    item: '[[w.risen-bill-of-the-century]], 214 (May 4, a handful of senators, Smathers speaking on jury trials; Kenneth Washington shouts from the gallery; not the words of the entry)'
