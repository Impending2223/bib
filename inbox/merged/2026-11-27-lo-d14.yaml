      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 23 and 24, 1965 (Jan. 23: 下午，主持召开中共中央政治局常委扩大会议，听取余秋里汇报; Jan. 24: 下午，继续主持). The time is the first day''s. [[w.zhou-enlai-nianpu-1949]], II, 703 (Jan. 23, 1965: the enlarged Standing Committee called on Zhou''s advice to hear Yu Qiuli''s oral report and discuss the revolution in planning); [[w.macfarquhar-origins-of-the-cultural]], III, 426–27 (the officials of the third front''s National Economic Supreme Command to take over the Planning Commission''s role as the "small planning commission," answering to Zhou); [[w.deng-xiaoping-nianpu-1904]], III, 1845 (Jan. 23 and 24, 1965; afternoons, 下午; Deng at the enlarged Politburo Standing Committee meetings Mao presides over, which hear Yu Qiuli on some ideas for the long-range plan). Made public: 1997. Check: the day of the decision; the book has Mao decide it "at this point," before Jan. 14, and his comment of Jan. 21 on a report of Li Fuchun''s names the small planning commission (III, 426–27 n.149). To check: [[w.lieberthal-policy-making-in-china]], 189–90 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 427 n.149a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1205–11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 427 n.149b); Mao Zedong, comment of Jan. 21, 1965, on Li Fuchun''s report, in [[w.zedong-jianguo-yilai-mao-zedong]], 11, 316–17 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 427 n.149c). Names: Mao Zedong, Yu Qiuli, Gu Mu.'
