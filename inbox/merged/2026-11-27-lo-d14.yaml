- edit:
    id: cal.1965-02-10.china-leadership-3
    base: 95f8dd40
    kind: correct
    set:
      n: '"[Record of the Fifth Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin (1)](https://digitalarchive.umd.edu/document/165487)" (Feb. 10, 1965), PRC FMA 109-03957-06, 121–135, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou to Kosygin, 3:20 p.m.: at "our mass meeting this morning" Liu Ningyi spoke of the United States letting the South Vietnamese army invade the North for the first time, giving the DRV the right to strike back; not the number or the leaders present). [[w.zhou-enlai-waijiao-huodong]], 435 (Feb. 10, 1965; Beijing; the time not given); [[w.lengxi-shinian-lunzhan-1956-1966]], 913 (the rally of Feb. 10, Mao and the leaders on Tiananmen; the number, see the variant); [[w.macfarquhar-origins-of-the-cultural]], III, 371 (Mao and his senior colleagues at the anti-American rally of 1,500,000 in Beijing, Feb. 10); [[w.yang-shangkun-riji]], II, 508 (Feb. 9, 1965; Tiananmen 天安门, 10 a.m. to before noon: the anti-American demonstration, Yang with Mao and the Standing Committee; Peng Zhen 彭真, Liu Ningyi 刘宁一, Hoàng Bắc 黄北, the DRV embassy''s chargé (the editors'' note), and the South Vietnamese representative speak; Zhou not named; the words: 上午10时，随主席等常委同志，去天安门参加反美示威，12时前结束); [[w.deng-xiaoping-nianpu-1904]], III, 1845 (Feb. 10, 1965; morning, 上午; Deng with Mao, Liu Shaoqi, Zhou Enlai and others at the rally of 1.5 million of the capital''s people in Tiananmen Square against American armed aggression against the DRV); [[w.peng-zhen-nianpu-1902]], IV, 396 (Feb. 10, 1965; Tiananmen Square; Peng Zhen presides at the meeting of 1.5 million supporting the Vietnamese people against U.S. armed aggression, Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others there, and speaks: China cannot ignore the U.S. bombing and strafing of the DRV''s towns and villages; the whole people to strengthen preparations on every front to support Vietnam and beat back U.S. war provocations); [[w.chen-yi-nianpu]], 1084 (Feb. 10, 1965, morning, Tiananmen Square; Chen Yi with Mao, Liu Shaoqi and the other leaders). The day: Feb. 10. Zhou, talking with Kosygin on Feb. 10, speaks of "our mass meeting this morning" and "yesterday, on the 9th" (Wilson Center, doc. 165487, the fifth contact); the demonstration Yang puts on Feb. 9 (II, 508) is a variant; the same day''s entry in Yang has Kosygin back from Vietnam "today," which the record (3:20 p.m., "Arriving from Vietnam"), the Waijiao (435) and the Chen Yi nianpu (1084) put on Feb. 10. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
