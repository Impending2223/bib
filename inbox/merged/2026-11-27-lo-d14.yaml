      place:
      - washington
      - nyc
      n: '[Johnson and Fortas, 3:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-abe-fortas-october-14-1964), Conversation WH6410-08-5876 (Miller Center: "Fortas tells LBJ that Walter Jenkins has been hospitalized ...; Fortas'' and Clifford''s efforts to suppress news stories of arrest"). [[w.clifford-counsel-to-the-president-2]], 401 (Fortas and Clifford, calling from Moyers''s office, reach the President by telephone "at about 4 p.m."; "Oh, no, not Walter," is all he can say; frantic calls that afternoon before he agrees to let Fortas go to the hospital for the resignation); [[w.perlstein-before-the-storm]], 489 ("at four that afternoon, they gave Lyndon Johnson the news"). The hour and the place: the recording, Miller Center and PRDE, the President at the Waldorf-Astoria, New York. Check: White has Clifford give him "the full story" only "early evening," on his arrival at the Waldorf (369); the recording of 3:56 p.m. is placed at the Waldorf. See [[cal.1964-10-14.elections-1964]]. Names: Johnson, Clifford, Fortas, Moyers, Jacqueline Kennedy.'
      src:
        c: c1d9f4cc
        rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-abe-fortas-october-14-1964: all'
