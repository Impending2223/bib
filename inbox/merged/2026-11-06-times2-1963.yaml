        n: '*Beckwith v. State*, [707 So. 2d 547](https://static.case.law/so2d/707/case-pdfs/0547-01.pdf) (Miss. 1997). [[w.dittmer-local-people]], 165–67 (the shooting at 12:20 a.m.; Arlington; not the arrest''s day); [[w.branch-pillar-of-fire]], 108, 112 (Beckwith''s arrest, 112); [[w.branch-parting-the-waters]], 824–25; [[w.thomas-robert-kennedy]], 249 (the night of the speech; shot in the back, coming home); [[w.young-easy-burden]], 252 (shot in the back in his driveway in Jackson, just after midnight; Young in Birmingham). Check: Branch, 824–25: home past midnight from a strategy session, all but nine of the seven hundred jailed out; shot in the back from a honeysuckle stand by a .30-06 deer rifle, the bullet through the window to the refrigerator; his last words, "Sit me up! ... Turn me loose!"; dead an hour later. Evers had asked to invite King; the NAACP ignored it. To check: [[w.evers-for-us-the-living]]; [[w.autobiography-of-medgar-evers]]; [[w.williams-medgar-evers]]; [[w.nossiter-of-long-memory]]; [[w.vollers-ghosts-of-mississippi]]; *New York Times*, June 13 and 14, 1963 (cited by [[w.dittmer-local-people]], 166 n.55). See [[cal.1963-05-28.mississippi]]. Names: Evers, Beckwith. Check: the hour, Dittmer''s 12:20 a.m., read at Central standard time; Jackson''s clock in June 1963 not settled.'
