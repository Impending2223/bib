        457); “Essential Legal Points for Briefing the Delegates,” b16f740, Edwin King Papers, TOU (cited by [[w.branch-pillar-of-fire]],
        457); Harris, Dreams Die Hard, p. 71 (cited by [[w.branch-pillar-of-fire]], 457); Interview with Charles Cobb, Aug.
        20, 1991 (cited by [[w.branch-pillar-of-fire]], 457). See [[cal.1964-08-06.mississippi]]. Names: Hamer, Gray.'
