      when: Aug. 21
      date: '1964-08-21'
      thread: elections-1964
      also:
      - alabama
      c: 'Atlantic City, before the convention. Wallace to a preconvention hearing: national Democrats "would sell the birthright
        of our nation" for "an alien philosophy of government"; "I''m not here to beg"; repeal the civil rights law, or an
        "uprising"; a conservative movement to "take charge of one of the parties in the next four years." Alabama''s new
        law has kept Johnson''s electors off its ballot.'
      n: '[[w.branch-pillar-of-fire]], 456. To check: New York Times, Aug. 22, 1964, p. 6, WP, Aug. 22, 1964, p. 5 (cited
        by [[w.branch-pillar-of-fire]], 456); New York Times, Aug. 21, 1964, p. 1 (cited by [[w.branch-pillar-of-fire]], 456).
        See [[cal.1964-08-24.alabama]]. Names: Wallace.'
      src:
        c: d09369b1
        rows:
        - 'w.branch-pillar-of-fire 456: all'
        - 'via w.branch-pillar-of-fire 456 n.wallace-hotly-denounced: all'
        - 'via w.branch-pillar-of-fire 456 n.arranged-by-recent-state: all'
      tags:
