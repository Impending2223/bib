      when: Aug. 19
      date: '1964-08-19'
      thread: mississippi
      c: 'Tougaloo. Moses closes COFO''s three-day staff conference: some two hundred of seven hundred volunteers to stay
        on or be replaced. To reporters: 250 arrests and fifty-two beatings, few new voters; Mississippi opened to common
        citizenship.'
      n: '[[w.branch-pillar-of-fire]], 454. To check: New York Times, Aug. 20, 1964, p. 1 (cited by [[w.branch-pillar-of-fire]],
        454); Holt, The Summer, pp. 246-47 (cited by [[w.branch-pillar-of-fire]], 454). See [[cal.1964-08-16.mississippi]].
        Names: Moses.'
      src:
        c: e6ca72b0
        rows:
        - 'w.branch-pillar-of-fire 454: all'
        - 'via w.branch-pillar-of-fire 454 n.moses-ended-the-three.a: all'
        - 'via w.branch-pillar-of-fire 454 n.moses-ended-the-three.b: all'
      tags:
