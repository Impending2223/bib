      c: 'Jenkins to Johnson by telephone, 8:30 p.m.: the hearing room big enough for one pool camera, the networks "raising
        hell," Rauh too, his clients shut out. 8:56 p.m., to Reuther, Johnson gives Rauh the ballroom and the cameras: "I
        don''t give a damn if he puts on a little show, as long as he just don''t wreck us." Reuther: he has told Rauh they
        will "part company" unless he settles.'
      n: '[[w.branch-pillar-of-fire]], 457–58, 469. To check: [Conversation with WALTER JENKINS and OFFICE CONVERSATION, 8:30
        p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-jenkins-and-office-conversation-0),
        Conversation WH6408-32-5107 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 457); [[w.mills-this-little-light-of]],
        116 (cited by [[w.branch-pillar-of-fire]], 457); Interview with Joseph Rauh, Oct. 17, 1983 (cited by [[w.branch-pillar-of-fire]],
        457); [Conversation with WALTER REUTHER, 8:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-reuther-august-22-1964),
        Conversation WH6408-32-5112 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 458); [Conversation with WALTER
        REUTHER, 8:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-reuther-august-22-1964),
        Conversation WH6408-32-5112 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 469). See [[cal.1964-08-22.mississippi]].
        Names: Jenkins, Johnson, Rauh, Reuther.'
      src:
        c: d4e8184d
        rows:
