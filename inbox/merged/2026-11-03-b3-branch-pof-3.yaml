      - state:ms
- add:
    entry:
      id: cal.1964-08-19.mississippi-2
      when: Aug. 19
      date: '1964-08-19'
      thread: mississippi
      c: 'Philadelphia, Miss. Ten volunteers open a COFO office; Deputy Price serves eviction notices and a summons for trespass;
        a caller: "The end is tonight"; armed whites circle all night. Churches near Meridian burned that night and the next.'
      n: '[[w.branch-pillar-of-fire]], 454. To check: New York Times, Aug. 23, 1964, p. 85 (cited by [[w.branch-pillar-of-fire]],
        454); New York Times, Aug. 20, 1964, p. 13 (cited by [[w.branch-pillar-of-fire]], 454); “Mississippi: Bombings, Burnings
        Since June 16,” A/SN36f6 (cited by [[w.branch-pillar-of-fire]], 454). See [[cal.1964-08-19.mississippi]]. Names: Price.'
      src:
        c: 8b17a1ab
        rows:
        - 'w.branch-pillar-of-fire 454: all'
        - 'via w.branch-pillar-of-fire 454 n.the-end-is-tonight: all'
