      id: cal.1961-03.transition-and-staff-2
      when: Mar.
      date: 1961-03
      thread: transition-and-staff
      c: 'Ball, troubled by Rusk''s seeming indifference to his work, to Battle of the Department''s secretariat. Battle,
        laughing: "Only the other day Dean told me, ''I wish I knew what Ball''s doing; he goes his own way and never talks
        to me.''" Thereafter regular talks between Rusk and Ball. By Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 169. Check: the day; Ball: "During my first months in the Department." Names:
        Ball, Rusk, Battle.'
      tags:
      - name:ball-george-w
