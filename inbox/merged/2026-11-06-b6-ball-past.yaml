      id: cal.1961-07-11.japan
      when: July 11–13
      date: '1961-07-11'
      thread: japan
      c: 'Tokyo, Geihinkan, the government guesthouse. Ikeda''s party for Ball and his wife, the first high official of the
        Kennedy administration to visit Japan: a Japanese and a Western dinner, Noh and Kabuki. Ikeda later attacked in the
        Diet for the extravagance. By Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 197. Check: the day; Ball: during the DAC''s meeting, July 11–13. See [[cal.1961-07-11.foreign-aid]].
        Names: Ikeda, Ball.'
