- add:
    entry:
      id: cal.1968-11-08.elections-1968-2
      when: Nov. 8
      date: '1968-11-08'
      thread: elections-1968
      also:
      - press-and-broadcasting
      c: 'Aboard the *France*, sailed the morning after the election, a gale the night before. Ball at breakfast to Arthur
        Sulzberger, publisher of the *New York Times*: "My God, Punch, think what this means. Nixon''s been elected for only
        three days and already we''ve been on the verge of shipwreck!"'
      n: '[[w.ball-past-has-another-pattern]], 448. Check: the day; Ball: "elected for only three days," the next-to-last
        night of the crossing. Names: Ball, Nixon.'
      tags:
      - name:ball-george-w
      - name:nixon-richard-m
      src:
        c: 5d24d097
        rows:
        - 'w.ball-past-has-another-pattern 448: all'
- add:
    entry:
      id: cal.1969-01.transition-and-staff
      when: Jan.
      date: 1969-01
      thread: transition-and-staff
      also:
      - elections-1968
      c: 'Ball back at Lehman Brothers after six weeks in France and Spain. Not asked back to the boards of Standard Oil of
        California and the Singer Corporation, nor to Upjohn''s International Advisory Board; one company''s chairman: Ball''s
        attacks on Nixon "excessive," his shareholders displeased. By Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 448–49. Check: the day, and whether the boards'' word came before Jan. 20.
        Names: Ball, Nixon.'
      tags:
