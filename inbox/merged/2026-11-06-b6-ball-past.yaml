      c: Tokyo. The meeting that makes the Development Assistance Group the Development Assistance Committee, Ball there.
        Between sessions Ball sounds the delegations, one by one, for Japan's membership in the OECD, and reviews with Japanese
        ministers the trade problems between the two governments. By Ball's account.
      n: '[[w.ball-past-has-another-pattern]], 195–97. See [[cal.1961-07-01.japan]]. Names: Ball.'
