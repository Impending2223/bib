      id: cal.1961-08.transition-and-staff
      when: Aug.
      date: 1961-08
      thread: transition-and-staff
      c: 'Rusk draws Ball aside: "I want you to take over more and more political matters and get yourself injected into them.
        Chet isn''t up to it." By Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 171. Check: the day; Ball: "One day during the latter part of the summer of
        1961." See [[cal.1961-08-04.transition-and-staff]]. Names: Rusk, Ball, Bowles.'
