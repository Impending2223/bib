      time: 1967-03-02T20:04Z
      n: '[FRUS 1964–68, V, doc. 96](https://history.state.gov/historicaldocuments/frus1964-68v05/d96) (the call;
        Russell''s words); [Johnson and Russell, 3:04 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-march-2-1967),
        Citation #11605 (Miller Center). [[w.barrett-uncertain-warriors]], 68 (Russell called off the floor; his
        notes; his refusal). Made public: FRUS 1964–68, V (2002). [[w.mann-grand-delusion]], 535 (Russell declines).
        To check: Russell''s notes, intra-office communications, Mar. 2, 1967, Russell Library (cited by [[w.barrett-uncertain-warriors]],
        68 n.23). See [[cal.1967-03-02.robert-kennedy]]. Names: Johnson, Russell, Robert Kennedy. Check: FRUS''s
        source note gives the recording 3:15 p.m., its heading 3:04.'
