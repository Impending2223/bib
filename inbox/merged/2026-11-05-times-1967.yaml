      n: '[[w.macv-command-history-1967]], 429; [[w.cosmas-joint-chiefs-of-staff]], 17 (the resumption, a day after
        the Tet stand-down); [[w.drea-mcnamara-clifford-and-the-2011]], 204 (Feb. 11, Johnson approves McNamara''s
        proposal to resume as far north as the 20th parallel; strikes resumed Feb. 14). Check: the hour, the History''s
        "131600W." Check: Drea dates the strikes'' resumption Feb. 14 (204). The time: 131600W, zone W (UTC−10),
        10 a.m. Feb. 14 in Saigon.'
