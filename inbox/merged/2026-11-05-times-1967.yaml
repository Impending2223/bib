      n: 'The President''s News Conference of November 17, 1967, [1967 Pub. Papers 1045](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=437)
        (Nov. 17, 1967), at 1046 (dissent), 1050 (the surcharge). [[w.herring-lbj-and-vietnam]], 146–47 (the conference,
        conversational; "storm trooper bullying"); [[w.berman-lyndon-johnsons-war]], 115 (Americans want a war "decided
        quickly; get in or get out"; "We are making progress"; Rostow: the conference "made big strides"). [[w.califano-triumph-and-tragedy-of]],
        245 (the microphone; the surcharge); [[w.zelizer-fierce-urgency-of-now]], 283 (Mills and Ford will "live
        to rue the day"); [[w.bernstein-guns-or-butter]], 371 (Ford and Mills: "They will live to rue the day").
        See [[cal.1967-11-13.vietnam]]. Names: Johnson, Ford, Mills. Check: the hour; the Papers'' note on the news
        conference, as the scan''s text reads, "at n a.m.," taken as 11 a.m.'
