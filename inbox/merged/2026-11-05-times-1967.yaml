- edit:
    id: cal.1967-03-02.soviet-union
    base: 26ac84d3
    set:
      time: 1967-03-02T16:25Z
      n: 'The President''s News Conference, [1967 Pub. Papers 259](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=327)
        (Mar. 2, 1967). FRUS 1964–68, XI, docs. [178](https://history.state.gov/historicaldocuments/frus1964-68v11/d178)
        (Johnson''s letter, dated Jan. 21), [185](https://history.state.gov/historicaldocuments/frus1964-68v11/d185)
        (Kosygin''s reply, Feb. 27), [186](https://history.state.gov/historicaldocuments/frus1964-68v11/d186) (Gromyko
        to Thompson, Feb. 28); XI, doc. [191](https://history.state.gov/historicaldocuments/frus1964-68v11/d191)
        (the principals on a proposal on strategic offensive and defensive missiles, Mar. 14). [[w.drea-mcnamara-clifford-and-the-2011]],
        365 (the reply, and the news conference of Mar. 2); [[w.thomas-robert-kennedy]], 335 (the day of Robert
        Kennedy''s speech, an impromptu news conference: the Soviets agree to arms control talks). To check: [[w.newhouse-cold-dawn]];
        [[w.seaborg-stemming-the-tide]]; [[w.halperin-decision-to-deploy-the]]. See [[cal.1966-12-06.defense]].
        Names: Kosygin, Thompson, Johnson. Check: Johnson''s letter dated Jan. 21 by FRUS (doc. 178) and Drea (364);
        Johnson gave Jan. 27. Check: the hour; the Papers'' note on the news conference, as the scan''s text reads,
        "at 11:25," no a.m. or p.m.'
