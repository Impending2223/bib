      time_range: ['1966-08-03T16:00Z', '1966-08-03T21:55Z']
      time_zone: America/New_York
      n: '[[w.zelizer-fierce-urgency-of-now]], 245; [[w.zelizer-fierce-urgency-of-now]], 244 (Moore''s amendment to strike the housing title; Mathias''s new amendment, brokers bound unless the owner instructs; 60 percent of the housing stock exempted; Celler: "the all-or-nothing approach produces nothing except a slogan"); [[w.ralph-northern-protest]], 176 (the House narrows Title IV after July 31). The House met at noon, its standing hour ([Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=1)), and adjourned at 5:55 p.m. ([Daily Digest, D405](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=403)). To check: Richard Lyons, "House Softens Rights Housing by 1 Vote Margin," *Washington Post*, Aug. 4, 1966; John Herbers, "Exemption of 60% in Open Housing Voted by House," [*New York Times*, Aug. 4, 1966](https://timesmachine.nytimes.com/timesmachine/1966/08/04/issue.html) (cited by [[w.zelizer-fierce-urgency-of-now]], 245 nn.47–48). See [[cal.1966-07-27.open-housing]]. The bill: [[cal.1966-08-09.open-housing]]. Names: Mathias, Bolling.'
