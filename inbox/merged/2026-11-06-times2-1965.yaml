      n: 'Statement by the President on the Flight of Gemini 7, [1965 Pub. Papers 1135](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=609) (Dec. 4, 1965); Statement by the President on the Delayed Takeoff of Gemini 6, [1965 Pub. Papers 1151](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=625) (Dec. 12, 1965); Telegram to the Administrator, NASA, Following the Meeting in Space of Gemini 6 and Gemini 7, [1965 Pub. Papers 1156](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=630) (Dec. 15, 1965); Letters to the Gemini 6 and Gemini 7 Astronauts After the Successful Completion of Their Mission, [1965 Pub. Papers 1159](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=633) (Dec. 18, 1965). [Kennedy Space Center, *Summary of Major NASA Launchings, October 1, 1958–September 30, 1973* (1973), PDF p. 114](https://ntrs.nasa.gov/api/citations/19740015280/downloads/19740015280.pdf#page=114) (the launch, 8:37 a.m. EST). To check: [[w.hacker-on-the-shoulders-of]]; [[w.mcdougall-heavens-and-the-earth]]. See [[cal.1965-03-23.space]]; [[cal.1965-08-21.space]]. Names: Schirra, Stafford, Borman, Lovell, Webb.'
