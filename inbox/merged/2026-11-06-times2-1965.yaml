      n: 'Message of Congratulations Following the Orbital Flight of Russian Spaceship Voskhod 2, [1965 Pub. Papers 299](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=375) (Mar. 19, 1965); Statement by the President on the Flight of Gemini 3, [1965 Pub. Papers 310](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=386); Telephone Conversation With Gus Grissom and John Young Following the Orbital Flight of Gemini 3, [1965 Pub. Papers 309](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=385) (Mar. 23, 1965). [Kennedy Space Center, *Summary of Major NASA Launchings, October 1, 1958–September 30, 1973* (1973), PDF p. 112](https://ntrs.nasa.gov/api/citations/19740015280/downloads/19740015280.pdf#page=112) (the launch, 9:24 a.m. EST). To check: [[w.hacker-on-the-shoulders-of]]; [[w.mcdougall-heavens-and-the-earth]]; [[w.siddiqi-challenge-to-apollo]]. See [[cal.1964-07-31.space]]. Names: Grissom, Young.'
