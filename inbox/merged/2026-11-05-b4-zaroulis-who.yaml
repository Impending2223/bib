      thread: press-and-broadcasting
      also:
      - war-opposition
      c: 'The *New York Times*, an editorial, answers Bertrand Russell''s letter of the week before: the United States waging a war of annihilation in Vietnam, napalm and chemical warfare. Russell in a "never-never land"; his letter an "unthinking receptivity to the most transparent Communist propaganda."'
      n: '[[w.zaroulis-who-spoke-up]], 8. Check: the day of Russell''s letter; Zaroulis and Sullivan, 8, give only the week before Easter.'
