      date: '1963-04-14'
      thread: war-opposition
      c: 'New York, Easter Sunday. The Easter Peace Walk, for the test ban and *Pacem in Terris*, Rustin chairman: some 7,000 at the United Nations Plaza. Signs against the war in Vietnam; the organizers ask that they come down; Dellinger and Halstead refuse. Dellinger and Muste speak on Vietnam. SANE''s men warn Dellinger he will not speak at their rallies again.'
      n: '[[w.zaroulis-who-spoke-up]], 7–8. Names: Rustin, Dellinger, Muste.'
