      thread: war-opposition
      c: New York. After Thích Quảng Đức's death, Tom Cornell and Christopher Kearns of the Catholic Worker picket the residence of South Vietnam's observer at the United Nations ten days, "WE DEMAND AN END TO U.S. MILITARY SUPPORT OF DIEM'S GOVERNMENT"; some 250 join them the tenth day; ABC's evening news carries it.
      n: '[[w.zaroulis-who-spoke-up]], 12–13. Check: the days. Names: Thích Quảng Đức.'
