      c: 'Zhou Enlai, on the news that Long Qian, curator and first Party secretary of the Museum of the Chinese Revolution, is near death after rebels held a private court and tortured him, instructs: "act first, report after"; the Peking Garrison command is to send a responsible comrade to the museum at once to get him out; no mass organization may arrest people or hold private courts and torture. On July 4 the museum''s masses had written to Kang Sheng and Cao Yiou; Kang passed it to Zhou, Chen Boda and Yao Wenyuan to read and proposed no measure.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 239 (July 6, 1968). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Chen Boda, Yao Wenyuan.'
