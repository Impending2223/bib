      c: 'Zhou Enlai, at dawn, telephones Xie Xuegong: on the Cultural Revolution Group''s liaison meeting''s view, Jiang Feng, a vice-chairman of Tianjin''s revolutionary committee, is not to be announced removed or struggled against; it is not the time and no hurry, announcing it at once could set mass organizations attacking each other and start a chain of reactions in society; it may be cleared up internally in a small circle.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 239 (July 4, 1968). Made public: 2020. Names: Zhou Enlai.'
