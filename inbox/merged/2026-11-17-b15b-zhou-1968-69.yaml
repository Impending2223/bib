      thread: china-leadership
      also:
      - defense
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the report that secret materials at a plant in the defense research system have been stolen again and again, writes Huang Yongsheng and Wang Bingzhang: "the case being so serious, may the move be stopped for now, this cleaning of ranks and the case done within the year, then the war-preparation move made?"'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 330 (Dec. 5, 1969). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
      tags:
