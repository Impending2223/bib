      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai has his secretary tell Li Xiannian that relief of Henan and Anhui's floods is to be planned together, directly by telephone with the heads of both provinces' revolutionary committees, with airdrops of relief supplies timely, exact and safe, and one province in charge at their junction. Before dawn next day he calls the Navy and Air Force heads and Li Xiannian on the relief.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 241 (July 18, 1968). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
