      when: July 12
      date: '1969-07-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on a paper on international questions, writes: documents of this kind are to go to the four old comrades studying international questions, Ye Jianying, Chen Yi, Xu Xiangqian and Nie Rongzhen.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 303 (July 12, 1969). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Chen Yi, Xu Xiangqian, Nie Rongzhen.'
