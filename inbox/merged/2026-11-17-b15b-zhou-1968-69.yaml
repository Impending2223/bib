      when: Feb. 15
      date: '1968-02-15'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives Zhejiang''s army cadres and the "Lianzong" and "Hongbao" delegates in Peking and conveys Mao''s instruction of Feb. 12: Jiang Hua, from history, is good, went up Jinggangshan with Mao, and the Center does not count him among those to be overthrown.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 215 (Feb. 15, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-16.china-leadership
      when: Feb. 16
      date: '1968-02-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai drafts for the Center, State Council, Military Commission and Cultural Revolution Group the telegram to all places: telegrams to come are to be sent by the nature of the question to the departments concerned, not to individuals. On Feb. 25 he has his secretary tell each province, municipality and region''s leaders in his charge to follow it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 215 (Feb. 16, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
