      c: 'Zhou Enlai to Mao and Lin Biao, by letter: stopping armed fights and arson and restoring rail traffic will be the first task of the political mobilization in Guangxi.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 243 (July 24, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
