      c: 'Zhou Enlai holds talks with Lt. Gen. Hamid Khan on Sino-Pakistani relations and the international situation. On local conflicts since the Second World War: world politics is interesting, with fighting and talking together, as China has done, fighting while talking, tense and loose by turns since 1953; first Korea, where China and the Americans fought and talked three years to a cease-fire; second Berlin, also tense; third Vietnam, fighting in the south and none in the north, a special case; fourth China, not wholly unified, American troops not yet out of Taiwan, in fact split in two, as his own country in fact is; also the Middle East, where after the war Israel was founded and Palestine split in two.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 319 (Oct. 2, 1969). Made public: 2020. Names: Zhou Enlai.'
