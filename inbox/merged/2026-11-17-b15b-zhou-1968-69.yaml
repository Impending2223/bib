      when: Feb. 13
      date: '1968-02-13'
      thread: china-leadership
      also:
      - china
      c: Ninety-one leading cadres of the Foreign Ministry post at the ministry a big-character poster, "Expose the enemy, defeat him, thoroughly criticize the reactionary slogan 'Down with Chen Yi'."
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 215 (Feb. 13, 1968). Made public: 2020. The nianpu''s note: the poster''s attitude and intent were right, to protect Chen Yi, but posting it then did not help stability and told against him. Names: Chen Yi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
