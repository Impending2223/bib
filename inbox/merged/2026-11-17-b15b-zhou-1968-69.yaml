      c: 'The Center, State Council, Military Commission and Cultural Revolution Group issue the directive on mobilizing urgently for a high tide of spring farm production: revolutionary committees and military control commissions at every level to take firm charge of farm work and set up production leadership groups at once; peasants to hold their posts and get spring sowing done.'
