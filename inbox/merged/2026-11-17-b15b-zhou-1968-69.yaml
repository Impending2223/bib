      date: '1968-02-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai hears the report of Tianjin's leaders. Beforehand he asked Jiang Qing whether Xie Xuegong, head of Tianjin's revolutionary committee, should attend, the meeting coming after the mass meeting and the core group's, and whether it might have bad effects.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 217 (Feb. 29, 1968). Made public: 2020. Names: Zhou Enlai, Jiang Qing.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:jiang-qing
      - vis:only:prc
- add:
    entry:
