      when: Apr. 27
      date: '1968-04-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai writes Mao: at tonight''s liaison meeting it was held that the State Physical Culture and Sports Commission may come under the Military Commission''s Office Group with military control, the National Defense Sports Commission abolished and its work wholly taken over by the services and military regions. Mao: do it. On May 12 the Center, State Council, Military Commission and Cultural Revolution Group order the whole national sports system taken over by the PLA.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 226 (Apr. 27, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
