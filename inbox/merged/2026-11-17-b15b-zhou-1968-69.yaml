      when: Feb. 28
      date: '1968-02-28'
      thread: china-leadership
      also:
      - china
      c: Chen Yi writes Zhou Enlai that he fully agrees with Zhou's criticism of the poster; with Zhou's consent the letter is posted at the Foreign Ministry Mar. 1.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 215 (Feb. 28, 1968). Made public: 2020. See [[cal.1968-02-13.china-leadership-3]]. Names: Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
