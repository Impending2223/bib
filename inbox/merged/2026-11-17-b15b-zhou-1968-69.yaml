      c: 'Zhou Enlai presides over the enlarged presidium meeting of the Ninth Congress, explains the Regulations as Mao approved them and sets the schedule of election work. He also asks every province, municipality, region and unit to check how it has gone about spreading Mao Zedong Thought and to watch certain things: much that is formalism, and dancing and singing that has become unserious, without rhythm, only enthusiasm.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 16, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
