      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-17.china-leadership-3
      when: Feb. 17
      date: '1968-02-17'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: 'Zhou Enlai receives Vietnam''s Ambassador Ngô Minh Loan and its Vice Minister of Foreign Trade, Lý Ban (the nianpu''s "Li Ban"). The Vietnamese ask help with the rail transport of aid materials. Zhou: for a year he has run rail transport and asked about it every week; the trouble in transport is a side effect of the Cultural Revolution; a stern order has gone out and a sterner internal one is planned. Train raiders are not rebels but counterrevolutionaries; Hunan''s "Sheng Wulian" is ultra-left on the surface, ultra-right in substance, a black-gang organization of dregs, rightists and labor-reform convicts. He told Wei Guoqing yesterday to hold a meeting on Guangxi''s railways and report today; if unsolved he will go himself.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 216 (Feb. 17, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - vis:only:prc+drv
- add:
