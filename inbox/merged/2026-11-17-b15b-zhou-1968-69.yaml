- add:
    entry:
      id: cal.1968-04-26.china-leadership
      when: Apr. 26
      date: '1968-04-26'
      thread: china-leadership
      also:
      - africa
      - china
      c: 'Zhou Enlai receives the Guinean government''s economic delegation: cultural independence is slower and harder than economic, old ideas having sat in heads for thousands of years. On economic cooperation: first make the facts clear, lest raw materials fall short or an enterprise outgrow home needs with no export market; second, development must serve self-reliance, not lean on foreign men and materials, starting with light industry, small to large, to accumulate funds; third, design on the spot. Aid from the earlier independent to the later must be on equal terms, else it is neo-colonialism.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 225–226 (Apr. 26, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:guinea
      - name:zhou-enlai
      - vis:only:prc+guinea
- add:
    entry:
      id: cal.1968-04-26.china-leadership-2
      when: Apr. 26
      date: '1968-04-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai telephones Kong Shiquan about Guangzhou''s Pearl River film studio "East Is Red" and other groups that want a meeting to mark a year since Zhou cleared the studio''s "East Is Red": Kong is to tell the organizers in Zhou''s name that a few in Guangzhou holding such a commemoration by highlighting his name this April is extremely wrong and he firmly opposes it; all to be vigilant against the enemy''s sowing of discord.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 226 (Apr. 26, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
