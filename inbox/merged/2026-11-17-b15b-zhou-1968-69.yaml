      thread: china-leadership
      also:
      - europe-and-the-alliance
      - china
      c: Zhou Enlai, receiving in the evening Babani, the chargé of the Albanian embassy, delivers the reply to Hoxha's letter of July 3. International activity is less because the documents are buried in the provinces; he says frankly he is busier than in the three-year war of liberation, every day brings problems and time never suffices, and the Liaison Department's minister cannot be found. This Cultural Revolution is unprecedented; two or three years were wanted, plus the wind-up; now three are needed and perhaps more after, longer than first reckoned. Rail, coal and production are hit; the Wuhan Steel works is still not united. The old saying was that a scholar meeting soldiers cannot argue his case; now it is the reverse, the army meeting scholars.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 247 (Aug. 20, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:albania
