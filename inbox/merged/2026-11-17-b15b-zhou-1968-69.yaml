      id: cal.1968-11-30.china-leadership-3
      when: Nov. 30
      date: '1968-11-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai goes to the hospital to take leave of the body of Xu Teli, just dead, and next day attends the memorial meeting.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 262 (Nov. 30, 1968). Made public: 2020. Names: Zhou Enlai.'
