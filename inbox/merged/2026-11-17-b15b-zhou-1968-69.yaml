      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 245–246 (Aug. 1, 1968). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan, Mao Zedong.'
