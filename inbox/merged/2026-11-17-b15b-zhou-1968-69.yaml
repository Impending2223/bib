      when: July 21
      date: '1968-07-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai reports to Mao and Lin Biao in writing the Cultural Revolution Group's two views on the Twelfth Plenum.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 241 (July 21, 1968). Made public: 2020. See [[cal.1968-07-18.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
