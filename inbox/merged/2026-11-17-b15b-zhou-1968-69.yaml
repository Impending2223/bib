      - china
      c: 'Zhou Enlai sends Mao the Foreign Ministry''s three telegrams from China''s representative in Warsaw on the meeting with the American ambassador: "please read; I propose to put it aside a while and see the reactions before deciding how to answer." Mao: do so.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 331 (Dec. 12, 1969). Made public: 2020. See [[cal.1969-12-11.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
