      c: Zhou Enlai reads the Hebei revolutionary committee's report on setting up its work organs (80 staff) and proposes to Mao and Lin Biao that it be forwarded to all provinces, municipalities and regions as a model; after Mao approves he drafts the forwarding comment for the Center, State Council, Military Commission and Cultural Revolution Group.
