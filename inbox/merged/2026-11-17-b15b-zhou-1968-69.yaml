    entry:
      id: cal.1968-09-29.china-leadership-2
      when: Sept. 29
      date: '1968-09-29'
      thread: china-leadership
      also:
      - soviet-union
      - china
      c: Zhou Enlai gives a banquet in the evening welcoming the Albanian party and government delegation under Balluku, Politburo member, vice-chairman of the Council of Ministers and defense minister, and in his speech supports Albania's withdrawal from the Warsaw Pact.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 256 (Sept. 29, 1968). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
