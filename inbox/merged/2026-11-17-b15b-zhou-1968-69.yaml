      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai strikes from "The Jiangxi Military District's experience in educating troops by the two lines" a sentence naming the district's commander, substitutes "certain leaders", and sends it to Mao and Lin Biao.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 213 (Feb. 9, 1968). Made public: 2020. Names: Zhou Enlai, Lin Biao, Mao Zedong.'
