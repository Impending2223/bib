      when: Feb. 14
      date: '1968-02-14'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'On Zhou Enlai''s proposal the Military Commission''s Office Group puts to Mao and the Center a plan to assign the thirteen former provincial leaders to study classes run by the Center. Mao: to be settled at the liaison meeting, Zhou to handle it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 214 (Feb. 14, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
