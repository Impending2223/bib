      at: before 1969-06-01
- add:
    entry:
      id: cal.1969-06.china-leadership-3
      when: June, before the 2nd
      date: 1969-06
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai tells Chen Yi and the others of the International Problems Study Group: Mao gave them this task because he holds that further study is needed; Mao''s constant thought is that subjective understanding should accord with objective reality, which keeps changing, so earlier views and conclusions are to be changed in part or wholly in time, and they are not to be boxed in. International struggle is sharp and complex while the departments are all massed on struggle-criticism-reform and can only handle the "shop front"; most cadres who know international questions are not yet freed, and he himself, busy from morning to night with daily work, cannot find time to weigh the world''s great matters. Mao has not sent them back to their posts so that, beside staying in the units, they may be free of administrative interference some days a week and think over the situation; they are marshals with strategic vision who can help Mao see strategic trends. Chen is to sum up several points for Zhou to pass to Mao. The Foreign Ministry sends Xiong Xianghui and Yao Guang to help. In July and September Chen and three others send Zhou written reports titled "A preliminary estimate of the war situation" and "Views on the present situation."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 296 (June 1969). Made public: 2020. Names: Zhou Enlai, Chen Yi, Mao Zedong. Check: the nianpu says only that it was before June 2.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
      - name:ye-jianying
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:mao-zedong
      - vis:only:prc
      at: before 1969-06-02
- add:
    entry:
