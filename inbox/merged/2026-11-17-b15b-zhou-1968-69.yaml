      when: May 27
      date: '1968-05-27'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: 'Zhou Enlai receives Nepal''s Deputy Prime Minister and Foreign Minister Bista: China has many people in Nepal, the embassy''s among them, who will have wrong ideas and an attitude of great-power chauvinism; he asks to be told through diplomatic channels so they can be corrected. Each country''s social system is its own people''s affair. On development: the general course is first agriculture, then light industry, then heavy; it takes time, but they cannot wait, and may start some light and heavy industry along with farming.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 232 (May 27, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:nepal
