      when: Oct. 8
      date: '1968-10-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai at the Cultural Revolution Group's liaison meeting, which fixes the draft list of those to attend the enlarged Twelfth Plenum of the Eighth Central Committee at 133. On Oct. 9 he drafts an explanation of the list and sends it with the list to Mao and Lin Biao for decision.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 257 (Oct. 8, 1968). Made public: 2020. Names: Zhou Enlai, Lin Biao, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:lin-biao
      - name:mao-zedong
      - vis:only:prc
