      when: May
      date: 1969-05
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai tells the departments concerned to hold an on-the-spot conference at Sanmenxia to study the project's further rebuilding, and proposes that teachers and students of Tsinghua's hydraulic engineering department attend, to join it with the revolution in education. In June he entrusts Liu Jianxun with a conference at Sanmenxia of Shanxi, Shaanxi, Shandong and Henan on controlling the Yellow River, to study the second rebuilding of the Sanmenxia works and the flood season.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 295 (May 1969). Made public: 2020. Names: Zhou Enlai.'
