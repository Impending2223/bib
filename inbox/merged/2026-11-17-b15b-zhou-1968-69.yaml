      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-01-18.china-leadership
      when: Jan. 18
      date: '1969-01-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the report that the men returning from observing the "Dongfeng 3" missile test were attacked by a mass organization at Lop county, Xinjiang, and their top-secret papers and all their arms seized, notes: the act "may be counterrevolutionary and premeditated"; Long Shujin is to be told by telephone that the Hotan sub-district is first to recover the secret papers quickly, the "Xin Nong Zong" group to hand over its chief plotters, and the leaders of "San Xin" in the regional committee to help. Mao: do as the Premier says.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 270 (Jan. 18, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-01-18.china-leadership-2
      when: Jan. 18
      date: '1969-01-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with the New Zealand Communist Party delegation of Politburo members Jie Mansheng and La Tigeman (as the nianpu writes the names): any country joining the universal truth of Marxism-Leninism and Mao Zedong Thought to its own revolution must create for itself, and without creation the revolution cannot succeed; the young united with experienced old comrades, or revolution is hard to win.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 270–271 (Jan. 18, 1969). Made public: 2020. Names: Zhou Enlai. Check: the delegates'' names.'
      tags:
      - polity:prc
      - polity:nz
      - name:zhou-enlai
      - vis:only:prc+nz
- add:
    entry:
      id: cal.1969-01-21.china-leadership
      when: Jan. 21
      date: '1969-01-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, on the Yunnan revolutionary committee's arbitrary decision to pull down civilians' homes in Kunming to put up a statue of Mao and an exhibition hall "Long live the victory of Mao Zedong Thought", tells the committee to cancel the decision, make a public self-criticism to the masses saying the act goes against Mao's standing instruction, and pay for the demolished homes at once; it is also to be sent to all the provincial committees, so that no more "act first, report after" happens.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 271 (Jan. 21, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
