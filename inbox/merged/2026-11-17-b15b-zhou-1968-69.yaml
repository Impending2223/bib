      c: 'Zhou Enlai talks with the Vietnamese guests Phạm Hùng and Hoàng Văn Thái: in any work at any time there are shortcomings, and what matters is to sum up experience and find the rules. On Apr. 21 he talks with them again on the international situation and stresses the policy of independence and self-reliance.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 20, 1969). Made public: 2020. Names: Zhou Enlai, Hoàng Văn Thái.'
