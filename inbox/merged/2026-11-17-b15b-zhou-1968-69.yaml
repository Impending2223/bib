      when: Sept. 28
      date: '1968-09-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'A member of Xinhua''s military control group says a Xinhua item should have mentioned a salute to Mao by letter. Zhou Enlai: now every matter, great or small, brings a salute telegram to Mao; the habit is bad and is to be stopped.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 256 (Sept. 28, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
