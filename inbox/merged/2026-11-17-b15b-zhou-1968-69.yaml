      when: Feb. 8
      date: '1968-02-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai drafts for the Military Commission and the Cultural Revolution Group the comment forwarding the Hubei Military District provisional Party committee''s report on the Cultural Revolution in the province''s districts and counties: the report is very good, its points to be studied and followed. The report says six of eight districts and 49 of 77 counties and cities have revolutionary committees.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 213 (Feb. 8, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
