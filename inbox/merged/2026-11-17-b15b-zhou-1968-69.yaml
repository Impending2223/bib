    entry:
      id: cal.1968-09-01.china-leadership-2
      when: Sept. 1
      date: '1968-09-01'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai at the Cultural Revolution Group's liaison meeting, which discusses and passes the Xinjiang Military Region's report on setting up the Xinjiang Uighur Autonomous Region's revolutionary committee and the Center's instruction on it. The same day, with Mao's consent, the Center, State Council, Military Commission and Group approve the committee.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 250 (Sept. 1, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-01.china-leadership-3
      when: Sept. 1
      date: '1968-09-01'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the liaison meeting that discusses and revises the Peking revolutionary committee''s "Several provisions on selecting and sending workers'' Mao Zedong Thought propaganda teams": workers are to be drawn from factories that have achieved great alliance, set up committees and cleared class ranks with marked results, only outstanding industrial workers, none still tied to the factions of the unit they are sent to; about a tenth of the city''s industrial workers, so long as production is not hurt. On Sept. 2 Zhou proposes to Mao that the provisions go to the whole country; Mao approves, and on Sept. 5 Zhou drafts the Center''s covering comment.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 250–251 (Sept. 1, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-02.china-leadership
      when: Sept. 2
      date: '1968-09-02'
      thread: china-leadership
      also:
      - china
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the meeting of Xinjiang''s delegates, announcing the approval of the Xinjiang Uighur Autonomous Region''s revolutionary committee: once set up, the committee must first achieve "grasping revolution by trades"; very few of Xinjiang''s prefectures, autonomous prefectures and counties have committees, because the organizations there have long cut across trades, and what cuts across trades cannot be organized by trade.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 250 (Sept. 2, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-02.china-leadership-2
      when: Sept. 2
      date: '1968-09-02'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: 'Zhou Enlai attends and speaks at the reception given by Vietnam''s ambassador, Ngô Minh Loan, for the 23rd anniversary of Vietnam''s independence: if the Vietnamese people hold to protracted war and oppose capitulation and compromise they will certainly win final victory in the war against the Americans for national salvation.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 251 (Sept. 2, 1968). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1968-09-03.china-leadership
      when: Sept. 3, 4
      date: '1968-09-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai convenes the State Council business group on Sept. 3 and 4, on the metallurgical and defense industry conferences and the study class of the National Defense Science and Technology Commission.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 251 (Sept. 3, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-04.china-leadership
      when: Sept. 4
      date: '1968-09-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, on the report of the Peking revolutionary committee''s forum of the workers'' and PLA propaganda teams, writes to Lin Biao, Zhou Enlai and the Cultural Revolution Group: some concrete policies need fixing now; this paper is good, and he suggests forwarding it for reference. On Sept. 6 Zhou drafts the Center''s covering comment.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 250 (Sept. 4, 1968). Made public: 2020. See [[cal.1968-08-30.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-05.china-leadership
      when: Sept. 5
      date: '1968-09-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai receives the delegates to the metallurgical and defense industry conferences, hears the metallurgical conference's report, asks about production in some plants and mines and urges the steel plants' two factions to form great alliance and three-in-one, to put "private" down and "public" first and restore production.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 251 (Sept. 5, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-05.china-leadership-2
      when: Sept. 5
      date: '1968-09-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on a Third Ministry of Machine Building cadre''s letter proposing that the industrial ministries'' revolutionary committees include outstanding worker delegates from mines and enterprises, writes: not only the industrial departments but all state organs should do so, the defense industry too; he proposes to Mao that the letter be forwarded to the state organs and the revolutionary committees of all provinces, municipalities and regions.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 251 (Sept. 5, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-05.china-leadership-3
      when: Sept. 5
      date: '1968-09-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: The revolutionary committees of the Tibet and Xinjiang Autonomous Regions are set up. Every province, municipality and region but Taiwan, twenty-nine, now has a revolutionary committee.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 251 (Sept. 5, 1968). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1968-09-06.china-leadership-2
      when: Sept. 6
      date: '1968-09-06'
      thread: china-leadership
      also:
      - middle-east
      - china
      c: 'Zhou Enlai with Chen Yi receives the visiting delegation of leaders of the Palestine Liberation Movement: he welcomes their opposition to Zionism but not to all Jews; Jewish working people are to be won over, a hard task, else the Chinese would be like Hitler, who killed working Jews and not capitalists. Revolutionaries most fear defeatism; there should be optimism, and a long-term plan for the movement. China''s experience is only for reference; Mao''s revolutionary principles hold everywhere but must be joined to the country''s own practice.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 251–252 (Sept. 6, 1968). Made public: 2020. Names: Zhou Enlai, Chen Yi, Mao Zedong. Check: the Palestinian movement''s name in the nianpu; no polity in the series'' list.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-06.china-leadership-3
      when: Sept. 6
      date: '1968-09-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai that evening, with Jiang Qing, Chen Boda, Kang Sheng and others, receives the workers'' and PLA Mao Zedong Thought propaganda teams of the art colleges: art itself has an accumulation; without it one is a pure outsider, with ideas perhaps but too rough in art.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 252 (Sept. 6, 1968). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Chen Boda, Kang Sheng.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:jiang-qing
      - name:chen-boda
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-07.china-leadership
      when: Sept. 7
      date: '1968-09-07'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai asks Mao, on the Peking revolutionary committee''s plan to hold a 100,000-strong rally that afternoon for the setting up of the 29 committees: by telephone they agreed that all the Cultural Revolution Group''s liaison members should attend, with Zhou and Jiang Qing to say a few words of congratulation and encouragement. Mao agrees. In the afternoon Zhou attends with Chen Boda, Jiang Qing and the others and says that, with all China red, they must hold high the banner of Mao Zedong Thought and welcome the new high tide of struggle-criticism-reform; Jiang Qing and others also speak.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 252 (Sept. 7, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Chen Boda, Jiang Qing.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:chen-boda
      - name:jiang-qing
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-07.china-leadership-2
      when: Sept. 7
      date: '1968-09-07'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: After the rally Mao criticizes it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 252 (Sept. 7, 1968). Made public: 2020. See [[cal.1968-09-07.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-07.china-leadership-3
      when: Sept. 7
      date: '1968-09-07'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai talks with the duty-room staff about sending staff to support industry and agriculture. Soon after, the State Council premier's duty room is abolished, one man (Qian Jiadong) left, one more (Ji Dong) added a month or two later. On Nov. 17 Zhou tells an Albanian delegation he has only two secretaries now, the rest gone to support industry and agriculture; each works twelve hours of the twenty-four, and he lets them go at night and writes and does some things himself.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 252 (Sept. 7, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-08.china-leadership
      when: Sept. 8
      date: '1968-09-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, Kang Sheng, Chen Boda and Jiang Qing jointly write a self-criticism of the rally: it was not first discussed at the liaison meeting, the speakers did not name the Cultural Revolution Group, did not stress the Cultural Revolution and the Red Guards'' merit, and representative figures such as Kuai Dafu did not attend, all from the leadership''s lack of preparation. On Sept. 9 Mao orders Zhou''s and Jiang Qing''s speeches printed as they stand.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 252 (Sept. 8, 1968). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Chen Boda, Jiang Qing, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:kang-sheng
      - name:chen-boda
      - name:jiang-qing
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-09.china-leadership-2
      when: Sept. 9
      date: '1968-09-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai attends the forum on Party rectification in some Peking suburban factories and mines and remarks in the report: "Party members" set against "the masses" is always illogical, as though Party members were not masses and only non-members were; it has become an idiom; the words should be "Party members" and "non-Party members".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 252–253 (Sept. 9, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-10.china-leadership
      when: Sept. 10
      date: '1968-09-10'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai calls Luo Guibo and others to talk on Hong Kong.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 253 (Sept. 10, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-12.china-leadership
      when: Sept. 12
      date: '1968-09-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai at the Cultural Revolution Group's liaison meeting on the report of the leading group for the National Day preparations.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 253 (Sept. 12, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-13.china-leadership
      when: Sept. 13
      date: '1968-09-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai writes Mao and Lin Biao: in the report they named the main heads of the 29 provinces'', municipalities'' and regions'' committees to try to hold the Twelfth Plenum before National Day; if too late, a few main heads attending the review would be good too.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 253 (Sept. 13, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-14.china-leadership
      when: Sept. 14
      date: '1968-09-14'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, at dawn, talks with responsible people of the Academy of Sciences and the National Defense Science and Technology Commission on the backward state of military radio technology: the old ways of thirty years ago, a set needing many men and men to guard it; could they all be transistorized; copying alone will not do, create; mobilize the masses and it can be done next year; the Fourth Ministry and the Signal Corps are to do it within half a year. By the end of 1972 an all-transistor tactical radio is made, half the weight of the valve set.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 253 (Sept. 14, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-14.china-leadership-2
      when: Sept. 14
      date: '1968-09-14'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai with the Cultural Revolution Group''s liaison members receives the capital''s workers'' and PLA propaganda teams and cites Mao''s Sept. 1 instruction that most students trained in the old schools can join workers and peasants, some inventing and creating, under correct leadership and the education of workers, peasants and soldiers: a development of the earlier policy on intellectuals. Of the Hongqi note of Sept. 5 on the Shanghai Machine Tool Institute he repeats that even the worst of the old intellectuals must be given a way out. Of the Cultural Revolution: frankly, he did not understand it at first, did not foresee today''s situation; Red Guards stormed Zhongnanhai more than ten times and each time he worked on them and did not fall out.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 253 (Sept. 14, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-16.china-leadership
      when: Sept. 16
      date: '1968-09-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai with the Cultural Revolution Group''s members and Li Fuchun, Li Xiannian and Yu Qiuli hears delegates of the defense industry conference, asks about production, criticizes plants stopped a dozen months running and orders them to unite quickly and restore output: the defense industry must be pushed up, two years are lost and no more delay is allowed. He asks the Shanghai Machine Tool Plant''s delegate whether the many visitors hinder production: it is bad, some limit is needed, to be notified to all places.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 254 (Sept. 16, 1968). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-17.china-leadership-2
      when: Sept. 17
      date: '1968-09-17'
      thread: china-leadership
      also:
      - africa
      - china
      c: 'Zhou Enlai receives Zambia''s Minister of State for Foreign Affairs, Robert Makasa, and Mumba, head of its Foreign Ministry''s Europe-Asia department: China supports every national liberation movement of the oppressed; if Nigeria unifies on the equality of its peoples, China keeps its policy of non-intervention, supports African states'' independence and respects their sovereignty, as it declared on its African tours.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 254 (Sept. 17, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:zambia
      - name:zhou-enlai
      - vis:only:prc+zambia
- add:
    entry:
      id: cal.1968-09-18.china-leadership
      when: Sept. 18
      date: '1968-09-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the forum with the performers of the symphonic "Red Lantern": China can hardly produce an artistic film now and has none to give foreign friends who ask; this has gone on two years and should not go on, the film stock in store is going to waste. Art is the widest field and has been stopped longest; film is the biggest lack. Most or a good many Chinese intellectuals are willing to join the workers, peasants and soldiers.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 254 (Sept. 18, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-20.china-leadership-2
      when: Sept. 20
      date: '1968-09-20'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the forum on Party rectification in Peking''s industrial system: the Party is to go back to the masses and take their supervision, or it parts from them and becomes officials and lords; Party members hold some political privilege, so non-Party masses fear them and dare not criticize them, the most dangerous sign. To one who calls himself a criminal he says it is an error, not a crime; the word is not to be used loosely; they should dare to state their shortcomings and errors before the masses.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 254–255 (Sept. 20, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-24.china-leadership
      when: Sept. 24
      date: '1968-09-24'
      thread: china-leadership
      also:
      - middle-east-yemen
      - middle-east
      - china
      c: 'Zhou Enlai receives South Yemen''s Foreign Minister (the nianpu''s Saif Ahmed Zalai): revolution not to skip stages, true; they should first make national independence thorough and firm, socialism being the next stage. China''s aid must serve their economic independence and not breed dependence; aid that does is harm, and the giver no true friend; China will help as it can those who struggle for independence.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 255 (Sept. 24, 1968). Made public: 2020. Names: Zhou Enlai. Check: the minister''s name; no South Yemen polity in the series'' list.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-25.china-leadership-2
      when: Sept. 25–28
      date: '1968-09-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai attends the Cultural Revolution Group''s liaison meetings of Sept. 25 to 28; on the 25th they discuss the National Day slogans.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 255 (Sept. 25, 1968). Made public: 2020. See [[cal.1968-09-25.china-leadership]]. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
