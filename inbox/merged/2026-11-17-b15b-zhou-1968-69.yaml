      c: 'Zhou Enlai, after watching a sports display at the Capital Gymnasium, talks with the heads of the Sports Commission''s military control commission and the Physical Culture Institute''s PLA propaganda team and asks in detail about the athletes'' thinking, training and life. Of those who call taking part in international matches "carrying the sedan chair for imperialists, revisionists and reactionaries", "capitulationism" and "national betrayal", and the athletes who won honor for the country "seedlings of revisionism": "this is glory for the motherland! they do not want patriotism, we still do!" Of the athletes struck in the Cultural Revolution: most famous ones were locked up, like model workers; they are to stand the test; the great majority are good, bred by Mao Zedong Thought; "we must not negate ourselves." Sports dress is to be reformed: one cannot wear Mao''s badge or carry his quotations while exercising; rules are not all to be negated, some cut, some reformed, some developed. On Oct. 23 he asks again about the study and training of Li Furong and other athletes and says training is to be pressed and technique restored.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 321 (Oct. 10, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
