      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai convenes the State Council business group on farm output, coal and rail traffic, with Li Xiannian, Su Jing, Zhao Qimin, Peng Deqing, Wang Su and Fan Wencai.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 213–214 (Feb. 10, 1968). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
