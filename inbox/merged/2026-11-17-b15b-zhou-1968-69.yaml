- add:
    entry:
      id: cal.1968-06-22.china-leadership
      when: June 22
      date: '1968-06-22'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai sees Nyerere off for North Korea. On the way to the airport: though socialism has been built nearly nineteen years, much of the democratic and national revolution is unfinished; China will not expand or invade, but will destroy an invader at home. Taiwan, Hong Kong and Macao are best settled by negotiation, and the chance rises with the people''s and the state''s strength; the anti-imperialist task is not done. Of the current clean-up of class ranks: it must not be enlarged; those who erred and mended are to go on working, not all be overthrown.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 236 (June 22, 1968). Made public: 2020. Names: Zhou Enlai, Nyerere.'
      tags:
      - polity:prc
      - polity:tanzania
      - name:zhou-enlai
      - name:nyerere-julius-k
      - vis:only:prc+tanzania
