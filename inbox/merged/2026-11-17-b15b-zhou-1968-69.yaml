      date: '1968-11-13'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      - vietnam-paris
      c: Zhou Enlai holds three talks with Phạm Văn Đồng, passing through Peking on his way home from the Soviet Union at the head of the Vietnamese delegation; Phạm reports on the Soviet visit. On Nov. 17 Zhou accompanies Mao in receiving the Vietnamese guests.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 261 (Nov. 13, 1968). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng, Mao Zedong.'
