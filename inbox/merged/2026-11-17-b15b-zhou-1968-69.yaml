      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting on the four questions Mao set July 17: the international situation, the domestic situation, the Ninth Congress and the Eighth Central Committee''s Twelfth Plenum. On the plenum two views: if held to prepare the Ninth Congress, its main task is the preparation; if held to put the Congress off, it is to sum up two years of Cultural Revolution, set tasks for complete victory and settle the organizational questions that need settling.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 241 (July 18, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
