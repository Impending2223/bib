      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-30.china-leadership
      when: Oct. 30
      date: '1968-10-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai revises the Center''s notice on conveying the enlarged Twelfth Plenum and handling its documents: areas and units without three-in-one revolutionary committees are not to be told for now; non-Party members may not attend; conveyance is oral, at province and city or county level, to congresses of delegates of the Party core groups of units'' revolutionary committees, the army to decide its own.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 259 (Oct. 30, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-11-01.china-leadership-2
      when: Nov. 1
      date: '1968-11-01'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, learning that Wang Shifen, a young woman worker at Peking's fireworks factory, was burned over 98 percent of her body, 88 percent in third and fourth degree, in an accidental explosion of powder, orders the hospital to do everything to save her and several times sends liaison men to ask after her condition, treatment and spirits and to encourage her to overcome her pain. She is saved.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 260 (Nov. 1, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-11-05.china-leadership
      when: Nov. 5
      date: '1968-11-05'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: 'Zhou Enlai asks Mao about the credentials of Pakistan''s new ambassador: by past custom Pakistan''s president signs the letter to China''s chairman of state; the chairmanship being vacant, he proposes telling Pakistan to address it to the vice-chairman, without a name, and China''s new envoys'' credentials to be signed by Vice-Chairman Dong Biwu, and so on until the state system is changed. Mao: agreed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 260 (Nov. 5, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Dong Biwu.'
      tags:
      - polity:prc
      - polity:pakistan
      - name:zhou-enlai
      - name:mao-zedong
      - name:dong-biwu
      - vis:only:prc+pakistan
