    entry:
      id: cal.1969-07-13.china-leadership-2
      when: July 13–16
      date: '1969-07-13'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: Zhou Enlai holds talks with Pakistan's government friendship delegation, invited to China, under Nur Khan, member of the President's executive council; Nur Khan hands over President Yahya Khan's reply to Zhou. Zhou says the two countries strictly observe the five principles of mutual respect for sovereignty and territorial integrity, mutual non-aggression, non-interference in internal affairs, equality and mutual benefit, and peaceful coexistence.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 303 (July 13, 1969). Made public: 2020. See [[cal.1969-07-13.china-leadership]]. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:pakistan
      - name:zhou-enlai
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1969-07-17.china-leadership
      when: July 17
      date: '1969-07-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, receiving people of the Seventh Ministry, gives a stern warning of the two factions'' long factionalism, which badly hurts the cutting-edge work: if it goes on, in the end discipline will be applied and both organizations declared dissolved. Petty-bourgeois anarchism must be struck hard, and so must bourgeois factionalism; these two are the ministry''s fatal wounds. On the "651" test project he is to give a death order: everyone on it goes to the line and has it done in a week: "don''t you want revolution? this is revolution"; Qian Xuesen is to lead, the Party Center gives him a death order; those who do not are dismissed from public posts and Party members expelled from the Party; it is not that they cannot but that they will not; those breaking discipline are to be dealt with as breaking Party, state and army law, from warning and docked pay to dismissal.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 303–304 (July 17, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-18.china-leadership
      when: July 18
      date: '1969-07-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the two Seventh Ministry factions'' seizing each other''s materials: it is banditry, lawless anarchism; he decides that Garrison troops go to bring both factions'' heads together and recover the seized material.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 18, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-18.china-leadership-2
      when: July 18
      date: '1969-07-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: A strong earthquake strikes the Bohai Gulf at noon and does damage on the coasts of Liaoning, Hebei and Shandong, the worst in Shandong. At 6 p.m. Zhou Enlai calls an emergency meeting with heads of the Academy of Sciences, the Ministry of Geology and others on watching for earthquakes and relief, and decides to form an earthquake work group with Li Siguang leader and Liu Xiyao deputy, send observation groups to Shandong, Liaoning and elsewhere to strengthen observation and forecasting, and send an air observation group to see the damage and its changes.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 18, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-18.china-leadership-3
      when: July 18
      date: '1969-07-18'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Zhou Enlai receives at short notice, at their request, Vietnam''s Vice Minister of Foreign Trade, Lý Ban, and Ambassador Ngô Minh Loan. Lý says President Hồ much hopes to come to China. Zhou: China is ready at any time to receive and welcome Hồ for convalescence, but given Hồ''s heart trouble it cannot invite him casually; it is for the doctors to judge and the Vietnam Workers'' Party Central Committee to decide.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 18, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1969-07-18.china-leadership-4
      when: July 18
      date: '1969-07-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai passes to the Politburo''s members in Peking the report of July 17 by the Peking Hospital''s revolutionary committee and PLA propaganda team on Fan Wenlan''s illness: Fan, in hospital with pneumonia and due to rest, left early to work and "caused a new serious cerebral arteriosclerosis"; saved, but not out of danger and "still being watched and rescued". Fan dies July 29.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 18, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-22.china-leadership
      when: July 22, 23
      date: '1969-07-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai presides over the Politburo''s meeting on Shanxi, which passes the paper settling Shanxi''s problem; afterward he reports the Politburo''s view to Mao and Lin Biao.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 22, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
