      when: Oct. 4
      date: '1968-10-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai with the Cultural Revolution Group's liaison members receives the heads of the provincial, municipal and regional revolutionary committees.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 257 (Oct. 4, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-06.china-leadership
      when: Oct. 6
      date: '1968-10-06'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: Zhou Enlai, on Vietnam's request to send a delegation to China, drafts for the Foreign Ministry a telegram to Chen Shuliang, the chargé in Vietnam, to see Prime Minister Phạm Văn Đồng at once and tell him that, busy with domestic affairs in October, China's Party and government leaders cannot receive a Vietnamese Party and government delegation; the relief Vietnam needs for its typhoon losses and the needs of the war in the South may first be adjusted in the 1969 aid agreement. On Oct. 9, receiving Vietnam's Vice Minister of Foreign Trade, Lý Ban, he states the same.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 257 (Oct. 6, 1968). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - name:pham-van-dong
      - vis:only:prc+drv
