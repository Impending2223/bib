      c: 'Zhou Enlai telephones Wei Guoqing on the report that Guilin''s Mao Zedong Thought propaganda teams, with PLA men, entered the strongholds held by the former "Rebel Army" and forcibly took arms: propaganda teams with armed troops behind them, and not bare-handed, easily set off armed fights; they are to go bare-handed or not at all. The team at Guilin North Station is to change its method at once, send out outsiders, promote great alliance of the two factions'' rail workers and favor neither.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 247–248 (Aug. 22, 1968). Made public: 2020. Names: Zhou Enlai.'
