      c: 'The Renmin ribao prints the slogans for the 20th anniversary of the People''s Republic, 29 in all, supplemented and revised before printing by Zhou Enlai and others and passed by the Politburo, among them: "Do struggle-criticism-reform well! Consolidate the dictatorship of the proletariat further!", "Prepare for war, prepare against famine, for the people!", "Raise vigilance, defend the motherland, be ready at any time to wipe out invaders!".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 17, 1969). Names: Zhou Enlai.'
      tags:
