      when: Sept.
      date: 1968-09
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai instructs, on the army''s radio communications equipment: field communications gear is to be made lighter and smaller faster.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 256 (Sept. 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-03.china-leadership
      when: Oct. 3
      date: '1968-10-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai attends the meeting of heads of news organizations and asks the heads of Xinhua, Renmin ribao and Jiefangjun bao why they cannot merge: each sends a big bundle of photographs for review, wasting much effort and the state''s foreign exchange and funds; drop the display of themselves and it will be easier.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 257 (Oct. 3, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
