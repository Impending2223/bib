      when: Nov. 16
      date: '1968-11-16'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the Foreign Ministry''s request on seeing off the Chinese Party, government and army delegation to Albania under Huang Yongsheng, notes: no masses to be organized to see them off.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 261 (Nov. 16, 1968). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:huang-yongsheng
