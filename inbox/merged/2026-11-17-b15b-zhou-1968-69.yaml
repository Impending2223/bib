      when: Mar. 3
      date: '1968-03-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai convenes the State Council business group on the 1968 national economic plan; present: Li Fuchun, Li Xiannian, Nie Rongzhen, Xie Fuzhi, Chen Yi, Su Yu, Yu Qiuli and others.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 218 (Mar. 3, 1968). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Nie Rongzhen, Xie Fuzhi, Chen Yi.'
      tags:
