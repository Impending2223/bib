    entry:
      id: cal.1968-04-30.china-leadership-2
      when: Apr. 30
      date: '1968-04-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting: the list for the May Day Tiananmen rostrum. Beforehand he asks Li Fuchun and Li Xiannian to consider Gao Wenhua, Chen Zhengren, Xiao Ke, Qian Zhiguang and Sha Qianli. Next day Xiao Ke, Qian Zhiguang and Sha Qianli attend the May Day evening celebration on Tiananmen.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 227 (Apr. 30, 1968). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian.'
