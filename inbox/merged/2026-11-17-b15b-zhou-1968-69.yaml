      also:
      - middle-east
      - china
      c: 'Zhou Enlai with Chen Yi receives the UAR''s ambassador in Peking, Imam: on the UAR''s difficulties, a nation that will not yield in hardship can stand up and make something.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 241–242 (July 19, 1968). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
