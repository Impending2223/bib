      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-04.china-leadership
      when: May 4
      date: '1969-05-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, in a letter passing on to the military representatives at the National People''s Congress and the Political Consultative Conference what the State Council''s directly attached sector''s representatives were told: the military representatives sent to the democratic parties'' organs should be "spoken to on policy"; the task of the organs'' rebels is to clean up the ranks of the organs'' cadres, not to struggle against the parties'' leaders, their Central and provincial and municipal committee members; should a present counterrevolutionary appear among them it is another matter, but the military representatives are first to be told and action taken only when the Center or the provincial or municipal committee agrees; the organs'' cadres in the cleaning of ranks are to be treated by case and not held to the Communist Party''s standard.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 289 (May 4, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-04.china-leadership-2
      when: May 4
      date: '1969-05-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the disorder in prison management and on prisoners deprived of the political and living treatment due them, instructs the departments concerned: specially held prisoners are to have more nourishing food, to keep them from wasting to death; the messing is to be checked. On May 31 he adds: those in danger of life are to go to a hospital, and all prisoners are to be given books and papers; the Central Case Group''s Second and Third Offices are to follow it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 289 (May 4, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-05.china-leadership-2
      when: May 5
      date: '1969-05-05'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives the delegations of patriotic Hong Kong and Macao compatriots who came for the May Day celebrations.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 289 (May 5, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-05.china-leadership-3
      when: May 5
      date: '1969-05-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai that evening presides over a meeting of the Politburo''s members in Peking on a paper Mao sent, on a Peking northern-suburb lumber yard''s firm carrying out of the Party''s policies toward the national bourgeoisie and the petty bourgeoisie: capitalists are to be told from small owners and independent workers; in the 1956 high tide of socialist transformation private industrialists and merchants were all called "private side" or capitalists, and some of them are now to be set apart and treated as small owners. On May 7 Zhou reports the discussion to Mao and on May 8 the Center issues the paper.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 289–290 (May 5, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-07.china-leadership
      when: May 7, 9, 10
      date: '1969-05-07'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai receives the heads of the joint leading group of the National Defense Industry Office, the National Defense Science and Technology Commission and the Seventh Ministry and hears the report on the work of the workers' and PLA Mao Zedong Thought propaganda teams in the ministry. While affirming the teams' results since last August he stresses that they must persuade by reason and not force, without impatience or feeling, or they lose their temper and speak wrongly and hurt feelings; the working class leading everything is not suppressing everything. He asks that factionalism's disruption be removed, national honor cherished and research and production pressed, and criticizes mass organizations that aim at Li Fuchun, Su Yu and others.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 290 (May 7, 1969). Made public: 2020. Names: Zhou Enlai, Li Fuchun.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-fuchun
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-10.china-leadership
      when: May 10
      date: '1969-05-10'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Politburo''s forum on Shandong, on Tan Qilong: the provincial secretaries were all brought to Peking by Mao in hope that they would reflect, and Tan was let go back to Shandong to criticize himself with Mao''s agreement; he is fairly honest and they are asked to unite. The meeting decides to remove Wang Xiaoyu from leadership and put Yang Dezhi in charge of Shandong. Of the votes for the Ninth Central Committee: after the election some groups'' delegates were "extremely indignant" that Jiang Qing and others of the Cultural Revolution Group did not get every vote and that some put an "X" on the names of Chen Boda, Jiang Qing, Zhang Chunqiao and Yao Wenyuan, and called it a new trend of class struggle; after asking Mao, Zhou did not circulate those groups'' bulletins. At the Politburo he says: a few votes short is nothing, why haggle over a vote or two; what are a few "X"s over a head?'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 290 (May 10, 1969). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Chen Boda, Zhang Chunqiao, Yao Wenyuan, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:jiang-qing
      - name:chen-boda
      - name:zhang-chunqiao
      - name:yao-wenyuan
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-11.china-leadership
      when: May 11
      date: '1969-05-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Center''s meeting on Guizhou: they had asked to stay after the Ninth Congress to talk; Guizhou''s alliance by trade has run two years and has been less steady since last year, so after Zhejiang''s problem was settled they were called in. Yunnan and Guizhou, with Sichuan, are the nation''s great rear, the Third Front. Everything divides in two, and so it does with views of the rebels: some do not advance, some may be bad; capitalist-roaders are of the repentant and the unrepentant; nothing is absolute but developing; the few who have not united must unite wherever there are masses.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 290–291 (May 11, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-12.china-leadership
      when: May 12
      date: '1969-05-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the seizure of command at the Chengdu-Kunming railway''s construction headquarters, armed fights at the sites and the flight of many workers that have paralyzed the line, rules: "southwest railway building is under the unified command of the Railway Corps." In early December he orders that the whole Chengdu-Kunming line open by July 1, 1970, and work then resumes quickly.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 291 (May 12, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-13.china-leadership
      when: May 13
      date: '1969-05-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'With Mao''s agreement Zhou Enlai from May 13 talks four whole nights running with the Party, government and army heads of Inner Mongolia: since Nov. 1968 the core group''s chief leaders of the region''s revolutionary committee had confused two kinds of contradiction in cleaning the class ranks and digging out the "Inner Mongolian People''s Revolutionary Party", with much forced confession, harming cadres and masses and national unity; he asks them to unite, correct the errors and steady the situation.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 291 (May 13, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
