      when: Feb. 24
      date: '1968-02-24'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai criticizes the Foreign Ministry's ninety-one's poster of Feb. 13.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 215 (Feb. 24, 1968). Made public: 2020. See [[cal.1968-02-13.china-leadership-3]]. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
