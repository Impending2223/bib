    entry:
      id: cal.1969-01-12.china-leadership
      when: Jan. 12
      date: '1969-01-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai drafts for the Center telegrams to the Xinjiang and Yunnan revolutionary committees. To Xinjiang: its delegates to the Ninth Congress are to include Wang Enmao, for whom a place is kept; if persuading the Party cadres and the masses takes time, Wang''s whole family may meanwhile be sent to Peking so he can go on working. To Yunnan: its delegates are to include Chen Kang, whose representativeness Mao long ago spoke to, by supplementary election. He sends the drafts to Mao noting that from the delegates'' lists received, Wang is not yet elected and Chen has been passed over, which may hurt the whole.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 269–270 (Jan. 12, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
