      date: '1968-05-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai hears the report of the coal conference. At word that Henan''s Pingdingshan mine''s two factions are still fighting he says it is Henan''s biggest problem, a great mine whose coal Guangdong, Hunan and Hubei burn. Jiang Qing says revolution must be grasped or production cannot be promoted; after the meeting she asks Li Fuchun who arranged the speeches there. Zhou had arranged them, adding two old workers, from the Kailuan and Pingxiang mines, to the list.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 231–232 (May 26, 1968). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Li Fuchun.'
