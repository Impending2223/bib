      when: Mar. 21
      date: '1969-03-21'
      thread: china-leadership
      also:
      - soviet-union
      - china
      c: Zhou Enlai calls Huang Yongsheng, Wu Faxian, Wen Yucheng, Chen Xilian and the General Staff Operations Department's people and, in view of the likelihood that Soviet troops will seize Zhenbao, settles to strengthen forces on China's bank, deploy in strength, wait at ease and prepare to strike after the enemy has.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 281 (Mar. 21, 1969). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Wu Faxian, Chen Xilian.'
