      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai at the first talks with Nyerere. On water conservancy: the greatest mistake was not to inherit critically the people''s thousands of years of experience in controlling water and join it to practice; the responsibility is the Premier''s, Qian Zhengying only carried it out. On preventing capitalist restoration: the first thing is real Marxism-Leninism, not false or merely verbal, proved in practice and gone deep among the masses, not only the leaders.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 235–236 (June 19, 1968). Made public: 2020. Names: Zhou Enlai, Nyerere.'
      tags:
      - polity:prc
      - polity:tanzania
      - name:zhou-enlai
      - name:nyerere-julius-k
      - vis:only:prc+tanzania
