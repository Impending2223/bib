      when: Feb. 16
      date: '1968-02-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai at the Cultural Revolution Group's liaison meeting; beforehand he proposes to Chen Boda, Kang Sheng and Jiang Qing that Chen Xilian and Song Renqiong attend to discuss the make-up of the Jilin revolutionary committee's leadership.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 215 (Feb. 16, 1968). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Chen Xilian.'
