      c: 'Zhou Enlai drafts for the Center the reply wire to the Jiangsu revolutionary committee on putting Mao portraits and political slogans on the Nanjing Yangtze Bridge''s girders: three portraits, at the centre and both sides, would be much remarked if badly fitted; it is better to use only Mao''s quotations.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 244 (July 25, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
