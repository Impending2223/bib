      c: 'Zhou Enlai, on the State Council duty room''s request whether Mao''s Jan. 3 instruction may be conveyed to the State Planning Commission, the Petroleum Ministry, the Seventh Ministry, the Foreign Ministry and the Commission for Cultural Relations with Foreign Countries, where some of the masses want to criticize Li Fuchun, Yu Qiuli, Nie Rongzhen and Chen Yi, notes: "Do so."'
