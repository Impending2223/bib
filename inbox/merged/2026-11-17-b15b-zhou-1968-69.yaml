      - defense
      - china
      c: 'Zhou Enlai, on the former Ministry of Grain''s and the Military Commission''s General Rear Services Department''s report on building grain depots for war on the coastal islands, notes: for islands guarded by the coast where people live, grain is to be stored both in caves and with the people, dispersed to suit the place, growing and changed yearly.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 317 (Sept. 24, 1969). Made public: 2020. Names: Zhou Enlai.'
