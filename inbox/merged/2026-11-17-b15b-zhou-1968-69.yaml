      date: '1969-01-24'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the Petroleum Ministry''s report on organizing a petroleum prospecting campaign in the Jianghan area of Hubei, writes Yu Qiuli: please draft for the Center, the Cultural Revolution Group, the State Council and the Military Commission a comment agreeing to the report and its requests, encouraging their success in study and hoping they go on working hard and guard against arrogance and impatience.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 271 (Jan. 24, 1969). Made public: 2020. Names: Zhou Enlai.'
