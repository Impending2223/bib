      c: Zhou Enlai drafts the "Regulations (draft) on the Ninth Congress's election of the Ninth Central Committee", covering the provisional number of members, the range of candidates and the election procedure; Mao approves them. From Apr. 15 to 24 the Congress begins to sound out the new Central Committee.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 15, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
