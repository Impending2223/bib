    entry:
      id: cal.1968-09-26.china-leadership-2
      when: Sept. 26
      date: '1968-09-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the Central propaganda work conference, on propaganda abroad: there is no business apart from politics; no Red Guard naivety that exports must all serve working people and none the bourgeoisie, which cannot be; China has a surplus of such things to exchange for what it needs, trade being exchange of wares, and it helps China grow.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 255 (Sept. 26, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-26.china-leadership-3
      when: Sept. 26
      date: '1968-09-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives people of Xinhua and the Central News Documentary Film Studio and instructs on news photography: Xinhua, Renmin ribao and the radio are to cooperate and keep one another informed, to avoid bourgeois things and not to scoop each other.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 255 (Sept. 26, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
