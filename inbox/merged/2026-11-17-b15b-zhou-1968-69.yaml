      id: cal.1968-06-02.china-leadership
      when: June 2
      date: '1968-06-02'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Jiang Qing, on the pretext of a fault in the procedure for circulating a paper, loses her temper and writes on it that if the Premier''s secretaries and the Central Office''s secretariat think circulation unnecessary, it is to go only to Mao, Lin Biao and Chen Boda, the political responsibility on those secretaries. The paper is the June 1 telephone record on setting up Sichuan''s revolutionary committee, which Zhou had seen and filed with another folder, found only a day late; his secretary, asked whether it still need circulate as the June 2 Renmin ribao had printed the news, said the Group''s office might be asked.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 233 (June 2, 1968). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Lin Biao, Chen Boda, Mao Zedong.'
      tags:
