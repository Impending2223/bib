- add:
    entry:
      id: cal.1969-12-16.china-leadership
      when: Dec. 16
      date: '1969-12-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai revises the draft Center decision on full military control of Inner Mongolia: since work there does not meet the situation and the leaders are not of one mind, a Party leading group of nine, the "forward command" of the Peking Military Region under Huang Zhentang, deputy political commissar, and Du Wenda, deputy commander, is set up to exercise unified leadership.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 332 (Dec. 16, 1969). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:huang-yongsheng
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-17.china-leadership
      when: Dec. 17
      date: '1969-12-17'
      thread: china-leadership
      also:
      - economy
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives the delegates to the preparatory meeting of the national conference on advance ordering of machinery products and stresses that production must go on and thrift be strictly kept: though it is said to prepare for a big war, an early one, both a fight and no fight are to be prepared for; a great production problem is to raise rail transport, and industry, farming and light industry must go on and not slacken or stop. Of the unplanned printing and making of Mao''s works and badges, which strains paper and aluminium and leads some to speculation, he says: "the figures are too big, more than the population! it is disrespect to Chairman Mao"; paper production is to be planned as a whole and printing controlled, next year''s tasks are enough, too much printed is waste, and any who use it for illegal acts are to be dealt with by law. The nianpu''s note puts the national printing at 800 million sets of the Selected Works, 500 million copies of the Quotations and 1.2 billion portraits of Mao.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 332–333 (Dec. 17, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-20.china-leadership
      when: Dec. 20
      date: '1969-12-20'
      thread: china-leadership
      also:
      - defense
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai speaks at the army-wide war preparation conference, held in Peking Dec. 11 to 23, on the home and foreign situation: it is moving in a direction favorable to the peoples; at home the most important thing is to grasp war preparation and production and join revolution with war preparation; coal, power, metallurgy, transport, oil and chemicals are to be raised, agriculture is the basis of war preparation and its failure hurts all, light industry too is to grow; next year production should have a new high tide, with revolution and production both reaping. In some places cleaning of class ranks has been enlarged, a "left" error, and in correcting it they opposed enlargement by enlargement, not following the Center''s instructions. The conference announces that the three eastern leagues of Inner Mongolia go to the Northeast and the three western banners to the Northwest.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 333 (Dec. 20, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-23.china-leadership
      when: Dec. 23
      date: '1969-12-23'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, on the report of Dec. 22 by Liang Xingchu, Zhang Guohua and Li Dazhang of the Sichuan revolutionary committee on Li Jingquan's illness, notes that he proposes to agree to his treatment. The report says that, by the Peking Garrison's guard troops, the 267th Hospital found his blood pressure raised, his heart's blood supply short, signs of hardened lungs and swollen face and limbs, and that moving is hard, and recommends treatment in hospital.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 333 (Dec. 23, 1969). Made public: 2020. Names: Zhou Enlai, Li Jingquan. Check: the nianpu''s words after "propose to agree" read by OCR; the sense of Zhou''s note.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-jingquan
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-24.china-leadership
      when: Dec. 24
      date: '1969-12-24'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai presides over the Politburo meeting on Sichuan; next day he reports the meeting to Mao and Lin Biao.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 333–334 (Dec. 24, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-25.china-leadership-3
      when: Dec. 25
      date: '1969-12-25'
      thread: china-leadership
      also:
      - economy
      - india-and-china-cultural-revolution
      c: Zhou Enlai that afternoon calls Yu Qiuli to talk on the plan; on Dec. 26 and 29 he calls meetings on planning.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 334 (Dec. 25, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-28.china-leadership
      when: Dec. 28
      date: '1969-12-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai instructs on Peking''s traffic management: the fast and slow lane marks on the east-west Chang''an Avenue, the ring roads and main streets, and from Wukesong north to the junction for the western suburb airport, are to be thickened and made clear, the crosswalk marks too, and the "safety island" at the centre of Chang''an Avenue restored.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 334 (Dec. 28, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-28.china-leadership-2
      when: Dec. 28
      date: '1969-12-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai presides over the Politburo meeting on Inner Mongolia; next day he reports it to Mao and Lin Biao.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 334 (Dec. 28, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-29.china-leadership-2
      when: Dec. 29
      date: '1969-12-29'
      thread: china-leadership
      also:
      - china
      - soviet-union
      c: 'Zhou Enlai to Mao, on revising the Foreign Ministry''s reply to the Chinese embassies in France and Switzerland: the Foreign Ministry took an attitude of refusing everything, not quite fitting; the reply is now changed to take a line of only receiving and only listening, no answer for now, and answering only when contact favors China. On the Sino-American ambassadorial talks at Warsaw he proposes to answer early in January: "fixed for Feb. 20 to resume the talks". Mao: agreed. The nianpu''s note: the Ministry''s first draft would have refused if the American side asked to see China''s ambassador or chargé, and received only ordinary staff, two Chinese present, to listen without speaking and pass on but give no date for a reply.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 334 (Dec. 29, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-31.china-leadership
      when: Dec. 31
      date: '1969-12-31'
      thread: china-leadership
      also:
      - defense
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai sends Mao the "Minutes of the army-wide war preparation conference" the Military Commission''s Office Group sent that day. Mao: do it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 334 (Dec. 31, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1970-01-01.china-leadership
      when: Jan. 1
      date: '1970-01-01'
      thread: china-leadership
      also:
      - economy
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the request of Anhui, Jiangsu, Zhejiang and Shanghai of Dec. 30 on the East China power grid''s present state and problems, writes: the State Council''s business group is to meet East China''s first-quarter coal allocation as asked; the East China grid is to be allotted by Shanghai; whether the Xuzhou grid is allotted by Xuzhou, Jiangsu or Shanghai is for the business group to settle.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 335 (Jan. 1, 1970). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1970-01-01.china-leadership-2
      when: Jan. 1
      date: '1970-01-01'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on a paper on factional quarrels and unending armed fights in some places in Xinjiang that badly hurt local industry, farming and the people''s life, writes: where armed fights have not stopped, production does not rise and revolutionary committees cannot be set up, and repeated advice goes unheeded, "war-preparation military control is to be put in"; those who do not obey the military control order are to be brought to Peking to study.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 335 (Jan. 1, 1970). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1970-01-05.china-leadership
      when: Jan. 5
      date: '1970-01-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai hears the report of a strong earthquake of 7.3 at 1 a.m. in the Yuxi and Honghe districts of Yunnan. On Jan. 7, on the telegram of Sichuan''s revolutionary committee and the Chengdu Military Region on sending a delegation to console and relieve the stricken area, he writes: the stress should be on raising high the great red banner of Mao Zedong Thought, rousing morale, strengthening medical care (fifty-odd is too few; Sichuan can send two hundred capable medical men, with medicine and instruments), self-reliance and rebuilding homes. The same day, on the Foreign Ministry''s paper on other countries'' reactions to the Yunnan earthquake, he proposes that Xinhua issue a short item on it, to answer well-meant inquiries.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 335 (Jan. 5, 1970). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1970-01-06.china-leadership
      when: Jan. 6
      date: '1970-01-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, on a letter about the conference on controlling schistosomiasis in south China, tells the departments concerned to draft for the Center a notice approving the Shanghai revolutionary committee's report, the list of the schistosomiasis control leading group and its work plan, to be passed to the thirteen provinces, municipalities and regions concerned to try, and to the other northern provinces for reference on endemic disease in the north.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 335–336 (Jan. 6, 1970). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1970-01-08.china-leadership
      when: Jan. 8
      date: '1970-01-08'
      thread: china-leadership
      also:
      - economy
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on Shanghai No. 5 Steel Plant''s design and building of a five-ton vacuum refining furnace, writes Li Xiannian, Ji Dengkui and Yu Qiuli: "please congratulate Shanghai No. 5 Steel and ask them to write a report on the whole course of designing, building, installing and producing with the five-ton vacuum furnace refining high-temperature alloy steel, with a little of the product sent for me to see."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 8, 1970). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1970-01-15.china-leadership
      when: Jan. 15
      date: '1970-01-15'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai revises the Foreign Ministry's telegram to Lei Yang, the Chinese chargé in Poland, and the draft Chinese statement for the 135th Sino-American ambassadorial talks soon to be held, adding that if after China's statement the American side raises again its treaty relation with Taiwan, China is to answer that the "American-Chiang treaty" is not recognized by all the Chinese people, and if the American side asks what "higher-level talks or other channels" mean, China may answer that if the American government is interested it may put forward a plan, or one may be worked out between the two sides at the ambassadorial talks. The talks resume Jan. 20, after a break of over two years.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 15, 1970). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1970-01-18.china-leadership
      when: Jan. 18
      date: '1970-01-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the Central General Office''s letters and visits section''s investigation of big building and non-productive building at Xi''an and other places, orders the report printed and sent to all the Politburo''s members. Where the report says some who wrote of such extravagance were charged with "illegal activity", "going over heads", "having no regard for the city committee" and "breaking organizational principles", he writes in the margin: Li Ruishan is to be told by telephone to attend to correcting this abnormal act against the new Party constitution.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 18, 1970). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1970-01-18.china-leadership-2
      when: Jan. 18
      date: '1970-01-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai revises the Center''s draft notice against extravagance and waste, to be printed for the Politburo''s discussion: new, extended and rebuilt halls and hostels are strictly forbidden and those begun stopped; he adds that the provincial, municipal and regional committees are to turn them to other uses by local conditions and then reset the economical building plan and carry it out, and in the handling that "the very serious are to be given criminal punishment". The Politburo passes the draft Jan. 30 and the notice goes out Feb. 5.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 18, 1970). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1970-01-19.china-leadership
      when: Jan. 19
      date: '1970-01-19'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai writes Mao and Lin Biao reporting the factional struggles in Inner Mongolia and Sichuan, and the same day presides over a Politburo meeting to settle them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 19, 1970). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06-15.china-leadership
      when: June 15
      date: '1969-06-15'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: Zhou Enlai receives Nguyễn Văn Quảng, head of the National Liberation Front's permanent delegation in China, and for the Chinese government congratulates and recognizes the Provisional Revolutionary Government of the Republic of South Vietnam.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 298–299 (June 15, 1969). See [[cal.1969-06-14.china-leadership-2]]. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
