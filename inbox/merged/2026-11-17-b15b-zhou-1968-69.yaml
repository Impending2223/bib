      when: July 23
      date: '1969-07-23'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai sees Han Xianchu, Yang Dezhi and others in turn.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 305 (July 23, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-25.china-leadership
      when: July 25
      date: '1969-07-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai receives the "two teams and one committee", the workers' and PLA propaganda teams and the military control commission, of the Seventh Ministry and the cadres and mass delegates of its systems, and reads the Center's July 23 notice on Shanxi. He lists the ministry's two factions' long extreme anarchism and extreme democracy and calls on them to wipe out bourgeois factionalism as the notice requires. With the American moon landing a success and other countries' science and technology leaping forward, they need the spirit of internationalism and patriotism, to grasp revolution, promote production, work and war preparation, to steady order and uphold the country's honor.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 305 (July 25, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-26.china-leadership
      when: July 26
      date: '1969-07-26'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives a letter from Sihanouk forwarding the letter of June 17 from Mansfield, the Senate's Democratic leader, asking to come to China to see Zhou and make contact on Sino-American relations. The nianpu adds that afterward President Nixon, on visits to some Asian and European countries, said repeatedly that the United States does not agree to the Soviet proposal of a system of "Asian collective security", will not join any action to isolate China, and is willing to talk with China.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306 (July 26, 1969). Made public: 2020. The nianpu''s note puts the proposal''s origin at Brezhnev''s June 1969 speech at the Moscow meeting. Names: Zhou Enlai, Mike Mansfield, Richard Nixon.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mansfield-mike
      - name:nixon-richard-m
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-26.china-leadership-2
      when: July 26
      date: '1969-07-26'
      thread: china-leadership
      also:
      - soviet-union
      - china
      c: Soviet First Deputy Foreign Minister Kuznetsov summons China's chargé in the Soviet Union and hands him the Soviet Council of Ministers' internal statement to China's State Council, asking for high-level Sino-Soviet talks.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306 (July 26, 1969). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1969-07-26.china-leadership-3
      when: July 26–28
      date: '1969-07-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai convenes a flood-control conference with the Peking Military Region, the Hebei revolutionary committee, the provincial military district and the 38th Army, and hands down the flood-fighting tasks fixed by the Center.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306 (July 26, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-28.china-leadership
      when: July 28
      date: '1969-07-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai reads the Peking Military Region''s "Request on drawing troops for flood fighting" and the Hebei revolutionary committee''s notice and reports to Mao and Lin Biao: this year''s floods are heavier than usual; the Jingjiang dyke was breached opposite Jiayu through armed fights and neglect of its protection, with no small loss; the flood season has come in North China while the Baoding area''s armed fights have not stopped, and after discussion all agree to put the thousand-li dyke of the south branch of the Daqing River under military control.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306 (July 28, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-30.china-leadership
      when: July 30
      date: '1969-07-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai tells all the members of the Xuzhou-Haizhou study class run by the Center that the Xuzhou-Haizhou situation has long lagged; set against the Center''s July 23 notice on Shanxi, its problems are quite grave, chiefly because bourgeois factionalism and armed fights greatly hurt farm and industrial production. The notice applies to the whole country and Xuzhou-Haizhou must carry it out: stop armed fights, hand in arms, grasp revolution by trades and catch up, above all at this urgent time of preparing for war and famine and serving the people, to unite and get production restored fast.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306–307 (July 30, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-03.china-leadership
      when: Aug. 3, 6
      date: '1969-08-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives reporters of Xinhua and its Guizhou branch: besides hearing both sides'' views they are to hear third parties, report the situation truly to the Center and let it judge, and check the facts; "we trust you so much, you must tell us the facts."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 3, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-05.china-leadership
      when: Aug. 5
      date: '1969-08-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on learning that a rebel group in Guizhou means to attack the political-legal building at Guiyang, instructs Wu Faxian to telephone Li Zaihan: the military region must send troops into the building to protect the files, none to be lost.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 5, 1969). Made public: 2020. Names: Zhou Enlai, Wu Faxian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:wu-faxian
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-08.china-leadership
      when: Aug. 8
      date: '1969-08-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai revises the draft Center notice on strictly controlling those coming to Peking, adding that by the Ninth Congress's spirit all petitioners, investigators outside, visitors, those on errands, those seeking treatment and those who have drifted out are to return to their own localities and units, achieve great alliance and three-in-one, do struggle-criticism-reform well and truly "grasp revolution, promote production, work and war preparation".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 8, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-09.china-leadership
      when: Aug. 9
      date: '1969-08-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai presides over the conference on cutting-edge defense research with the heads of the National Defense Industry Office, the National Defense Science and Technology Commission and the Second Ministry. Since some experts and engineers cannot work freely to break the technical barriers, he announces: Qian Xuesen is to be commander and Yang Guoyu political commissar, the two responsible; Yang is the political guarantee, and if Qian or other experts are seized and cannot work normally he will hold Yang to account. He approves a list of several hundred engineers and technicians to be specially protected, all of the best in defense research, even those not directly on a project: to be protected chiefly politically, none to be molested or seized, and if anyone means to fight or seize them, by force of arms if need be.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 9, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-09.china-leadership-2
      when: Aug. 9
      date: '1969-08-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai announces, for the Center and the State Council, the order sending down over 9,600 people of the Seventh Ministry and its systems, and takes responsibility for the leadership's having failed in two years and more to persuade the two factions to overcome factionalism and stop the "civil war".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 9, 1969). Made public: 2020. See [[cal.1969-07-25.china-leadership]]. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-09.china-leadership-3
      when: Aug. 9
      date: '1969-08-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Jiang Qing writes Lin Biao on the present literary and art work and on popularizing the "revolutionary model operas", asking that her views be sent to all places. The Politburo members in Peking agree to forward it, on Lin's note of Aug. 15; Zhou Enlai and Jiang Qing then agree to ask Mao first, and the paper is shelved.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 9, 1969). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Lin Biao, Mao Zedong. Check: the day; the nianpu places the item at Aug. 9 yet cites Lin''s note of the 15th.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:jiang-qing
      - name:lin-biao
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-12.china-leadership
      when: Aug. 12
      date: '1969-08-12'
      thread: china-leadership
      also:
      - defense
      - china
      c: 'Zhou Enlai presides over the 20th meeting of the Central Special Committee. Learning from the Second Ministry that Lin Biao on July 2 at the conference of the "three norths" (Northeast, North, Northwest) ordered the atomic energy plants in Gansu and Inner Mongolia moved wholly to the Third Front in 1970, he instructs, to avoid a break in nuclear fuel production: the first-line plants are not to move, but to go on, speed up, produce more and store more, while for war preparation the Third Front plants are rushed up.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 12, 1969). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-12.china-leadership-2
      when: Aug. 12
      date: '1969-08-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on a paper on street propaganda at Guiyang, notes: some loudspeakers disturbing the propaganda of the July 23 notice are to be stopped, and factional acts excluded when the Center''s notice is propagated.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 12, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-13.china-leadership
      when: Aug. 13
      date: '1969-08-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives the delegates to the national conference on building county farm-machinery repair and manufacturing stations and speaks: the time has come to grasp farm mechanization and it can be put off no more; machines are wanted from conventional to advanced for harvest, processing, transport, electric power, pest killing and plastic film. Every county is to have such a station, its tasks in time of peace and war both to repair and make, repair first, and later to join repair and making; they are to create every type of farm machine for the soils, transport and irrigation of China and for cotton and other crops as well as grain.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 13, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-15.china-leadership
      when: Aug. 15
      date: '1969-08-15'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives the members of the leading group of the national health work conference and some delegates: health work is first for the countryside, second for factories and mines, third for cities, first of all for workers, peasants and soldiers; it must treat the commonest diseases of the broadest working people, train doctors for the villages, spread Chinese herbs and fit rural medical equipment; Western and Chinese medicine alike are to be accepted critically, theory joined to practice and Western medicine to traditional Chinese, with the ambition to create a new China''s medicine. On policy he repeats that, but for present counterrevolutionaries, anyone whose historical problems are explained clearly and who has a skill, in Chinese or Western medicine, can be placed and used.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 15, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-15.china-leadership-2
      when: Aug. 15
      date: '1969-08-15'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on Guizhou''s armed fights, has the Military Commission''s Office Group wire Guizhou''s leaders: first political work, then persuasion to hand in arms and education; on no account to open fire; only after surrounding and splitting them may arms be taken by force from the bad ringleaders.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 309 (Aug. 15, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:wu-faxian
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-16.china-leadership
      when: Aug. 16
      date: '1969-08-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the Hebei revolutionary committee''s report of Aug. 15 on an outbreak of Japanese encephalitis, tells the Ministry of Health to pass on to the provinces, municipalities and regions: "watch prevention and strengthen the patriotic health movement."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 309 (Aug. 16, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-18.china-leadership
      when: Aug. 18
      date: '1969-08-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, on the Inner Mongolia revolutionary committee core group's request of Aug. 16 on settling the question of additional wages rationally (the scope, standard and time of restoring workers' additional wages), asks the comrades concerned to discuss it and to correct any inappropriate or inexact sentence in the report.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 309 (Aug. 18, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-18.china-leadership-2
      when: Aug. 18
      date: '1969-08-18'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai meets Edgar Snow and his wife.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 309 (Aug. 18, 1969). Made public: 2020. The nianpu files the meeting under 1969; Snow''s visit to China is elsewhere dated August 1970 to February 1971 (a lead, not read), which would put it outside the span. Names: Zhou Enlai. Check: the year.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-21.china-leadership-2
      when: Aug. 21
      date: '1969-08-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, on a digest item "Bank robbed at Wuda city, Inner Mongolia", proposes that the Inner Mongolia core group, the region's committee and the military region discipline the bad ringleaders of the Wuda Mining Bureau who made trouble at the city committee and took a million yuan from the bank's treasury, and arrest them if identified.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 309 (Aug. 21, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-22.china-leadership-2
      when: Aug. 22
      date: '1969-08-22'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the Academy''s Department of Philosophy and Social Sciences'' request on revising and continuing Fan Wenlan''s "Modern History of China" and "Concise General History of China", writes: "This matter was handed down by the Chairman; it is very important."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 309 (Aug. 22, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-24.china-leadership
      when: Aug. 24
      date: '1969-08-24'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: Zhou Enlai learns of the Vietnam Workers' Party Central Committee's urgent telegram that Hồ Chí Minh is critically ill, asking China to send more doctors, and that evening talks with the second group of doctors for Vietnam. Next day four of the Chinese medical group reach Hanoi.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 309 (Aug. 24, 1969). Made public: 2020. Names: Zhou Enlai, Hồ Chí Minh.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - name:ho-chi-minh
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1969-08-25.china-leadership
      when: Aug. 25
      date: '1969-08-25'
      thread: china-leadership
      also:
      - defense
      - china
      c: Zhou Enlai goes to an armored unit to watch a display of new weapons.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 310 (Aug. 25, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-26.china-leadership
      when: Aug. 26
      date: '1969-08-26'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: The Chinese Central Committee wires the Vietnam Workers' Party Central Committee its concern at Hồ Chí Minh's illness, hoping he will rest in peace of mind, and tells it a third group of five emergency medical personnel has left for Hanoi. On Aug. 27 Hồ's condition worsens.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 310 (Aug. 26, 1969). Made public: 2020. Names: Hồ Chí Minh.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - name:ho-chi-minh
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1969-08-26.china-leadership-2
      when: Aug. 26
      date: '1969-08-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Liu Qingtang, deputy head of the core group of the Central Ballet Troupe, writes Jiang Qing: class struggle in the literary and art world is in essence still the struggle of the two headquarters, between carrying out her instructions and resisting them, and power there is not yet truly in the proletariat''s hands. The nianpu notes that she had told him that summer: criticism in the literary world has one difficulty, there is the Premier, and some things were the Premier''s proposals.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 310 (Aug. 26, 1969). Made public: 2020. Names: Jiang Qing.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:jiang-qing
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-28.china-leadership
      when: Aug. 28
      date: '1969-08-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - defense
      c: The national leading group for civil air defense is set up, with Mao's approval, Zhou Enlai its head.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 310 (Aug. 28, 1969). Made public: 2020. See [[cal.1969-08-27.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-28.china-leadership-2
      when: Aug. 28
      date: '1969-08-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives all the delegates to the national health work conference: in China medicine was by herbs, and herbs and chemical drugs are to be joined; every good folk method handed down is to be gathered, analyzed and raised, the people''s wisdom pooled, the essence taken and the dross dropped.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 311 (Aug. 28, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-31.china-leadership-2
      when: Aug. 31
      date: '1969-08-31'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: The Chinese side sends another medical expert, the noted Wu Jieping, to Vietnam. Before he leaves Zhou Enlai tells him to be back in Peking the same day, as he will hear the report overnight.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 311 (Aug. 31, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1969-08-31.china-leadership-3
      when: Aug. 31
      date: '1969-08-31'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the report of the Center''s production and disaster relief group in Hubei on the floods, writes: the State Council''s business group is to talk it over tonight and help settle what Hubei raised; the "absenteeism" in heavy industry in Hubei and Henan, above all at Wuhan (the Wuhan Steel works, the heavy machinery works and shipbuilding), and on the Zhengzhou Railway Bureau, is to be put on the agenda for a discussion. The report says heavy rains brought floods and dykes burst, with over 15 million mu hit and 5.52 million people in Huanggang and Jingzhou districts and elsewhere.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 311 (Aug. 31, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08.china-leadership
      when: Aug.
      date: 1969-08
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, with the third Pacific typhoon about to strike the southeast coast, orders its strength, speed and probable landfall time and place wired in detail to Guangdong and other provinces, and says that in future when typhoons and other great disasters of weather may strike Taiwan, forecasts and warnings are to be issued in time to tell the Taiwan compatriots to guard against them. He himself revises and passes the text of the first typhoon warning broadcast to them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 311 (Aug. 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-09-02.china-leadership
      when: Sept. 2
      date: '1969-09-02'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai receives the members of the Mao Zedong Thought study classes run by the Center and people from Inner Mongolia, Tibet and Guizhou in Peking and says that the struggle-criticism-reform stage has begun, its aim to consolidate the dictatorship of the proletariat, raise the Party Center's prestige and bring in unified collective leadership by the revolutionary committees; Party leadership is to be shown, policies carried out and care taken not to confuse the two kinds of contradiction; the army is the pillar of the dictatorship and there must be no more seizing of arms and no more besieging or beating of PLA men, any such act being counterrevolutionary and to be met by encirclement and political disintegration. The nianpu's note gives the stage's content, after the Ninth Congress, as three-in-one revolutionary committees, great criticism, cleaning class ranks, Party rectification, cutting organs, reforming unreasonable rules and sending staff down.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 311–312 (Sept. 2, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-09-02.china-leadership-2
      when: Sept. 2
      date: '1969-09-02'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: Zhou Enlai talks with Wu Jieping and Liang Feng, back from Hanoi, and hears their report on Hồ Chí Minh's illness; after discussion it is decided to send Wu and Liang again with other doctors, carrying medicine and equipment, to try to save him.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 312 (Sept. 2, 1969). Made public: 2020. Names: Zhou Enlai, Hồ Chí Minh.'
