    entry:
      id: cal.1968-03.china-leadership
      when: Mar., mid
      date: 1968-03
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai presides in the Great Hall over a meeting on the Northeast''s problems and the return to work of Song Renqiong. Jiang Qing, on the pretext that Zhou''s guard commander Cheng Yuangong had not let her into the room, makes a scene aimed at Zhou, and he has to adjourn, saying no such thing happened; she goes on for over an hour. A few days later she makes a row again over it, and Cheng leaves Zhou''s place for a study class, later to a cadre school.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 220–221 (Mar. 1968). Made public: 2020. By Cheng''s recollection, in the nianpu''s note: before the meeting Jiang''s guard telephoned that she wanted food ready; Cheng had it set in a side hall and waited with Wang Dongxing at the door. Names: Zhou Enlai, Jiang Qing. Check: the day.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:jiang-qing
      - vis:only:prc
