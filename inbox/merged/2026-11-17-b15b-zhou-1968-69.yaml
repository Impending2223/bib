      - soviet-union
      - china
      c: 'Zhou Enlai receives Pakistan''s ambassador, Kaiser: in 1959 Khrushchev himself cancelled the agreement on atomic energy cooperation with China, but China must thank him, for one push and it came out; when he fell in 1964 China had just exploded its first atomic bomb.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 283 (Mar. 28, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
