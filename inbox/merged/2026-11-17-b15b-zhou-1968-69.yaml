      c: 'Zhou Enlai to Mao and Lin Biao, by letter: tonight he plans to meet the presidium''s members and other delegates and speak of joining the study and propaganda of Mao Zedong Thought to revolutionary practice, seeking truth from facts, and correcting the boasting, formalism, extravagance and even revival of old ways that have appeared, done for their own needs; if this is not said during the Congress, nor what is advocated and opposed, delegates will take the style home to the harm of conveying the Congress. Mao: to be talked about.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 285 (Apr. 8, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
