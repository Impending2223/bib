      c: 'Zhou Enlai at the second talks with Nyerere: Chinese aid is to go truly to the country''s people and benefit independent states; its projects must be designed to suit local conditions and respect their system.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 236 (June 21, 1968). Made public: 2020. Names: Zhou Enlai, Nyerere.'
