    entry:
      id: cal.1968-11-26.china-leadership
      when: Nov. 26
      date: '1968-11-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai to Xie Fuzhi and Wen Yucheng: the education funds of the middle schools in Peking''s counties and districts are to be divided to the rural part by the school-age children and the towns'' distribution, to see what each school-age child''s share comes to in yuan and jiao; handed to the poor and lower-middle peasants to manage, as Mao instructed, would it do, or must communes and brigades add something? A model trial and report are asked, for the Center to fix next year''s education budget.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 261 (Nov. 26, 1968). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:xie-fuzhi
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-11-28.china-leadership-2
      when: Nov. 28
      date: '1968-11-28'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai holds talks with Hill, chairman of the Communist Party of Australia (Marxist-Leninist), before accompanying Mao in receiving him.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 262 (Nov. 28, 1968). Made public: 2020. See [[cal.1968-11-28.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
