    entry:
      id: cal.1968-07-21.china-leadership-2
      when: July 21
      date: '1968-07-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai to Mao and Lin Biao, by letter: Shaanxi has two views. A Center notice was drafted on Mao''s instruction; then some comrades, fearing it would lower the Shaanxi revolutionary committee''s role, had Shaanxi''s comrades write a resolution of their own; Li Ruishan and two others write that a Center notice is better, to be decided at tomorrow night''s liaison meeting. The coal conference is nearly over and its resolution draft being revised, with metallurgical and defense industry conferences to follow to spur second-half production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 242 (July 21, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1968-07-21.china-leadership-3
      when: July 21
      date: '1968-07-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai to Mao, Lin Biao and the liaison members, by letter, on sending and adding a batch of military control men to the Center''s organs and State Council ministries: the largest dispatch and supplement yet, he proposes to agree; of about 42 government units, a third have achieved great alliance and may reach three-in-one, and the new men may speed it. When the five border regions'' committees are nearly ready in August, the ministries can be taken up by sector at the liaison meeting.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 242 (July 21, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1968-07-16.china-leadership
      when: July 16–24
      date: '1968-07-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai revises several times the Center, State Council, Military Commission and Cultural Revolution Group''s notice on stopping armed fights in Shaanxi and elsewhere, adding: distinguish an organization''s bad ringleaders from its masses; some are also deceived; stop armed fights at once, remove works, strongholds and checkpoints, disband the specialized fighting teams and persuade the peasants to return to production; interrupted vehicle and boat traffic, post and telecommunications to be restored unconditionally; arms and equipment seized from the PLA to be returned unconditionally and quickly.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 242–243 (July 16, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-07-22.china-leadership
      when: July 22
      date: '1968-07-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting on how the July 3 notice is being publicized and carried out: it is to be explained by area and unit, with careful political and ideological work and no mass mobilization meetings, which would give those who sing another tune a chance to make trouble; in view of Shaanxi, the meeting agrees that the Center issue a notice on Shaanxi.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 242 (July 22, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-07-23.china-leadership
      when: July 23
      date: '1968-07-23'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: 'Zhou Enlai, receiving the Vietnamese government''s economic delegation under Vice-Premier Lê Thanh Nghị after the signing: in 1965 Kosygin came to China to make a joint action to tie China down; they want to control everything, and it ends in opposition. One of the great diseases in building socialism is to be cut off from the masses, with too many and too heavy organs, which breeds bureaucracy, the more so the bigger the country.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 243 (July 23, 1968). Made public: 2020. See [[cal.1968-07-23.china]]. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - vis:only:prc+drv
