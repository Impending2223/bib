      when: June
      date: 1969-06
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai says in a talk that old translators with problems are to be used as fits once they have explained them clearly; he then instructs the Foreign Ministry with the International Liaison Department, the Foreign Languages Bureau, the Foreign Economic Liaison Commission and the Foreign Trade Ministry to investigate and register the diplomatic and translation staff of the central units and propose how to manage them better.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 300 (June 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-02.china-leadership
      when: July 2
      date: '1969-07-02'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai calls the heads of the Health Ministry''s military control commission and hears of the line and questions for the national health work conference. On cleaning the ranks, citing the AB League of history and the recent digging out of the "Inner Mongolian People''s Revolutionary Party", he stresses guarding against enlargement: but for present counterrevolutionaries, agents and renegades, general political and historical problems need only be explained clearly; many who erred as capitalist-roaders erred in understanding; the cleaning is to be both serious and calm, with no forced confession. On medical research: the nation''s medical workers are a great force to be roused to catch up with the world''s best; a good doctor is most studious, modest, objective and calm; giving up treatment and research on a common disease is against Mao Zedong Thought, and the nation is to be called on to have someone study the cure for tumors.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 300–301 (July 2, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-02.china-leadership-2
      when: July 2
      date: '1969-07-02'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the briefing "On certain policy limits in the Foreign Ministry''s deep digging of ''May 16''", writes: the Foreign Ministry''s great-alliance committee, military representatives and Party committee are to be told to guard against enlarging the "May 16" case and to forbid forced confession, to investigate, to value witnesses, material evidence and corroboration and not trust confessions lightly; so great a revolution cannot be without bad people and counterrevolutionaries sowing discord, vigilance is needed but also care not to fall into their schemes.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 301 (July 2, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-03.china-leadership-2
      when: July 3
      date: '1969-07-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai again reports to Mao on the arrangement for Ji Dengkui and Li Desheng: their division of work is settled at the Center''s meetings; beside collective meetings and temporary tasks Ji is to manage Party rectification and building and the workers'', youth and women''s movements, Li the Military Commission Office Group''s general political work; both join the State Council''s business group and keep their posts in the provinces and army. The Politburo''s daily working meeting is, the nianpu notes, thirteen: Zhou, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Ye Qun, Xie Fuzhi, Li Zuopeng, Qiu Huizuo, Li Desheng and Ji Dengkui.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 301 (July 3, 1969). Made public: 2020. See [[cal.1969-06-25.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Ye Qun, Xie Fuzhi, Li Zuopeng, Qiu Huizuo.'
      tags:
