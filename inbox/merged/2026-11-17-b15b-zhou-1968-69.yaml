      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai has his secretary telephone Li Zhen of the Ministry of Public Security to ask where Dong Biwu''s son Dong Lianghe is held; once found, Dong Biwu''s secretary is to be told that the family may send summer clothes, and that Dong Lianghe''s problem can soon be settled.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 233 (May 29, 1968). Made public: 2020. Names: Zhou Enlai, Dong Biwu.'
