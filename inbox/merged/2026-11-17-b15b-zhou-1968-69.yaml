      when: Oct. 12
      date: '1968-10-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai at the Cultural Revolution Group's liaison meeting that evening, on the list of the plenum's groups and their conveners. On Oct. 13 he drafts the list and an explanation and sends them to Mao and Lin Biao for decision.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 258 (Oct. 12, 1968). Made public: 2020. See [[cal.1968-10-12.china-leadership]]. Names: Zhou Enlai, Lin Biao, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:lin-biao
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-13.china-leadership-3
      when: Oct. 13
      date: '1968-10-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, after the opening of the enlarged Twelfth Plenum, calls the first meeting of the plenum''s group conveners and introduces the papers printed for it: secrecy is to be kept, each is to take his own notes, nothing is to go outside; the old are to be given medical care.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 258 (Oct. 13, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-16.china-leadership
      when: Oct. 16
      date: '1968-10-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai speaks at the sixth group of the enlarged Twelfth Plenum: he had no experience in this movement either; the key is the attitude toward the masses, which Mao had laid down at the Central Work Conference of October 1966, though some on returning home feared the masses. Not only ministers: he was ordered to bring the heads of the provinces, municipalities and regions to Peking, among them Huang Huoqing, Ouyang Qin, Tan Qilong, Jiang Hua, Zhang Pinghua, Wei Guoqing, Yang Shangkui, Liu Junxiu, Ye Fei, Jiang Weiqing and Zhang Tixue, and told them to reflect on their errors; unable to go himself, he had Tan Zhenlin and Li Xiannian speak to them. At Zhongnanhai Tan Zhenlin, Li Xiannian, Li Fuchun, Yu Qiuli and Gu Mu met together, and from the army Xu Xiangqian and Nie Rongzhen; some were upset. By Mao''s instruction he protected the most, Yu Qiuli, Gu Mu and over ten ministers; when Yu was seized he reported to Mao, who told him to protect him.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 258 (Oct. 16, 1968). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin, Li Xiannian, Li Fuchun, Xu Xiangqian, Nie Rongzhen, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:tan-zhenlin
      - name:li-xiannian
      - name:li-fuchun
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-17.china-leadership
      when: Oct. 17
      date: '1968-10-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the death of Sun Weishi, his and Deng Yingchao''s adopted daughter, in custody on Oct. 14, of which he learns only today, writes: whether suicide or silencing is worth investigating; an autopsy and laboratory tests are to establish the cause.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 259 (Oct. 17, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-17.china-leadership-2
      when: Oct. 17
      date: '1968-10-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: At the first group of the enlarged Twelfth Plenum, Kang Sheng charges the participants in the "February counter-current" with "opposing Chairman Mao", "negating the Yan'an rectification" and "reversing the verdict on the Wang Ming line"; Jiang Qing calls Chen Yi, Ye Jianying and Xu Xiangqian disorderers of the army; Huang Yongsheng and Wu Faxian call Zhu De an old right opportunist and a black commander. The nianpu says that from Oct. 17 to 28 Lin Biao, Jiang Qing, Kang Sheng and Xie Fuzhi organized attacks in the groups on Chen Yi, Ye Jianying, Xu Xiangqian, Li Fuchun, Li Xiannian and Nie Rongzhen, Tan Zhenlin being barred from the meetings, and charged Zhu De, Chen Yun and Deng Zihui with consistent right deviation.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 259 (Oct. 17, 1968). Made public: 2020. The nianpu''s wording is the compilers''. Names: Kang Sheng, Jiang Qing, Huang Yongsheng, Wu Faxian, Chen Yi, Ye Jianying, Xu Xiangqian, Zhu De, Lin Biao, Xie Fuzhi, Li Fuchun, Li Xiannian, Nie Rongzhen, Tan Zhenlin, Chen Yun, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:kang-sheng
      - name:jiang-qing
      - name:huang-yongsheng
      - name:wu-faxian
      - name:chen-yi
      - name:ye-jianying
      - name:xu-xiangqian
      - name:zhu-de
      - name:lin-biao
      - name:xie-fuzhi
      - name:li-fuchun
      - name:li-xiannian
      - name:nie-rongzhen
      - name:tan-zhenlin
      - name:chen-yun
      - name:mao-zedong
      - vis:only:prc
