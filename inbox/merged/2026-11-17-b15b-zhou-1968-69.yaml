      c: 'Zhou Enlai, on the telegram of the Hengyang prefecture''s production command and flood command in Hunan, instructs Huang Yongsheng and Wu Faxian to tell Li Yuan and Long Shujin: on the Guangzhou Garrison''s model, the Hengyang Railway Bureau''s military control commission, the Hengyang revolutionary committee, sub-district and garrison are to call a meeting of the revolutionary committee and the delegates'' congresses under the July 3 notice and settle a few relief measures, which the garrison and both factions must carry out; vehicles and boats must be returned for relief, no supplies seized, and those who obstruct relief dealt with as offending public opinion. The telegram says over 200 communes were flooded in late June, over 500,000 mu of paddy drowned and over 10,000 houses fell, and the two factions'' fights and the stopping of vehicles and boats had halted all transport.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 240 (July 13, 1968). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Wu Faxian.'
      tags:
