      c: 'Zhou Enlai receives Sugimoto Shigezo and other delegates of the Japan-China friendship trade mission of the Japan Industrial Exhibition, and Furui Yoshimi and Okazaki Kaheita of the Japan office for Japan-China memorandum trade: trade may not be developed by giving up principle, nor trade pursued without regard to politics, else they would be merchants, not statesmen; "we do not trade principles."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 218 (Mar. 6, 1968). Made public: 2020. Names: Zhou Enlai.'
