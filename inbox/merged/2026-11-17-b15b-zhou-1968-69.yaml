      c: 'Zhou Enlai telephones Zeng Yongya of the Tibet Military Region: at the Tibet study class some say Ngapoi Ngawang Jigme was a serf-owner and cannot join Tibet''s revolutionary committee; it would help to keep one or two former aristocrat lords who served Tibet''s liberation and are willing to follow Mao and the Party. Earlier, in the study class, he told Ren Rong to work among the masses and have Ngapoi serve as a vice-chairman: a good man, patriotic, who trusts the Communist Party, who signed the 1951 agreement and in 1956, taken to India with the Dalai Lama, flatly refused those who urged them to stay and urged the Dalai Lama home. In the Cultural Revolution Zhou received Tibetan army, local leaders and delegates sixteen times.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 248–249 (Aug. 29, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
