      when: Feb. 29
      date: '1968-02-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on Wei Guoqing''s telephone request whether to send a battalion to recover the arms and ammunition a Guangxi mass organization took from a PLA unit: if one battalion is not enough, two may be sent to surround it, with a strong political offensive, on the southeast Shanxi method, approaching its works and persuading it to return the arms.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 217–218 (Feb. 29, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
