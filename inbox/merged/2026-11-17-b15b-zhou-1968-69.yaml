      when: June 14
      date: '1969-06-14'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: Zhou Enlai wires Huỳnh Tấn Phát, chairman of the Provisional Revolutionary Government of the Republic of South Vietnam, congratulating it on its proclamation and recognizing it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 298–299 (June 14, 1969). See [[cal.1969-06-14.china-leadership]]. Names: Zhou Enlai.'
