      date: '1968-07-31'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai revises the draft "notice" of the Center, State Council, Military Commission and Cultural Revolution Group on counterrevolutionary incidents, and notes "revised, rush for approval"; later he notes "not to be issued, kept for now at the Chairman''s place." The draft lists ten crimes of the few counterrevolutionaries: wrecking rail, air, transport and post; murder, arson, poisoning; plunder of state goods, vehicles, boats and depots; beating and killing PLA men and seizing arms; manipulating armed fights; seizing state files and secrets; private radio; underground groups and "fighting teams"; storming prisons and labor farms; counterrevolutionary rumor.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 244–245 (July 31, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
