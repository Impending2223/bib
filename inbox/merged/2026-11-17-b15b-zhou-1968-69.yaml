      c: 'The State Council forwards the report of the military control commission of the First Ministry of Machine Building on speeding up the Second Automobile Plant: it is a key Third Front project, all sides are to cooperate closely and assure that the plant produces military cross-country vehicles in batches by 1972 as scheduled. The nianpu notes that Zhou fixed its site at Shiyan, Hubei; construction began in 1969, and in 1975 the first model, a 2.5-ton cross-country vehicle, went into production.'
