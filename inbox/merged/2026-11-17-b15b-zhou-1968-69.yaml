      - china
      c: 'Zhou Enlai reports the content of the Sino-Soviet talks to Mao and holds that it is the first contact of this kind between the two governments; China is to try for the four-point agreement on the border situation to be realized, to publish a diplomatic document and to promote the boundary negotiations. Mao: "agreed."'
