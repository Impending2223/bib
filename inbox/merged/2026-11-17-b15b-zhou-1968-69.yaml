      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: At midnight at Peking's railway station Zhou Enlai hears the report of the collision that day of two passenger trains in the station, helps analyze the causes and proposes more crossings and safety sidings on the approaches of the Peking-Shanhaiguan and Peking-Chengde lines, stressing safe rail transport and strict rules to cut errors.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 295 (May 29, 1969). Made public: 2020. Names: Zhou Enlai.'
