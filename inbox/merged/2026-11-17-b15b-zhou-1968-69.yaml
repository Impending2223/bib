      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai attends the rally of 100,000 soldiers and civilians of the capital on thoroughly smashing the new counter-attack of the "February counter-current". The decision of the Center, State Council, Military Commission and Cultural Revolution Group removing Yang Chengwu, Yu Lijin and Fu Chongbi and naming Huang Yongsheng chief of the General Staff and Wen Yucheng commander of the Peking Garrison is read, and he speaks on the "Yang-Yu-Fu incident". On production: most present are workers; they must not only do the revolution well but unite on its principles and keep production up, with no absences.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 222 (Mar. 27, 1968). Names: Zhou Enlai, Huang Yongsheng.'
