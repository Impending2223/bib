      date: '1969-12-04'
      thread: china-leadership
      also:
      - africa
      - china
      c: 'Zhou Enlai receives Tanzania''s departing ambassador, Salim: he is not well today, his heart not good, so says little; he asks to be remembered to the President and is glad to know he returned home safe and sound. Nyerere is a rare leader in East Africa and had best travel abroad little; he says so as an old friend.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 330 (Dec. 4, 1969). Made public: 2020. Names: Zhou Enlai, Nyerere.'
      tags:
      - polity:prc
      - polity:tanzania
