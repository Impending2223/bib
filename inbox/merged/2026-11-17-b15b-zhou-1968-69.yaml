      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives the delegates of the Seventh Ministry''s two mass organizations and again sharply criticizes their zeal for factionalism and fighting: the ministry is a cutting-edge department and they still wage civil war, each striving to win, unmoved by the Center''s instructions; the two factions are known in Peking and across the country, and he does not believe the revolutionary masses will follow them; he calls on them to smash factionalism, grasp revolution, promote production and push the cutting-edge forward. On June 26, finding them still factional over the revolutionary committee, he says they have no notion of the enemy, and are now state organs'' staff, not Red Guards.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 299 (June 16, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
