      c: 'Zhou Enlai writes Kang Sheng on the first self-criticism by the Inner Mongolia revolutionary committee core group''s chief leaders: it is "a plain narrative, not bringing out the enlargement errors made in cleaning the class ranks before the Center''s instruction", so it is not focused; "in fact those errors come from misjudging the situation and ultra-left policy errors."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 291–292 (May 21, 1969). Made public: 2020. See [[cal.1969-05-13.china-leadership]]. Names: Zhou Enlai, Kang Sheng.'
