      c: Zhou Enlai revises the "Outline of the 1969 national economic plan (draft)". In the health section he adds "with Shanghai as centre, to reorganize the prevention and treatment of schistosomiasis in twelve southern provinces and cities"; he strikes from "clear away the remaining poison of a handful of capitalist-roaders" the names of Deng, Tao, Peng, He, Peng, Luo, Lu, Yang, Tan, Bo and An (Deng Xiaoping, Tao Zhu, Peng Dehuai, He Long, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun, Tan Zhenlin, Bo Yibo, An Ziwen); and in "grasp revolution, press production hard, raise a new high tide of struggle-criticism-reform and of farm and industrial output" he changes "struggle-criticism-reform" to "war preparation".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 280 (Mar. 17, 1969). Made public: 2020. Names: Zhou Enlai, Deng Xiaoping, Tao Zhu, Peng Dehuai, He Long, Peng Zhen, Luo Ruiqing, Lu Dingyi, Tan Zhenlin, Bo Yibo.'
