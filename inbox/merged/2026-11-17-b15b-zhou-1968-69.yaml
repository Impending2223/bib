      date: '1968-02-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai convenes the State Council business group again on the Liujiaxia leak and proposes that Qian Zhengying be put back to work. Afterward Qian Zhengying and Du Xingyuan go to the site and settle the leak with the experts. Unit 1 begins generating Mar. 29, 1969.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 212 (Feb. 8, 1968). Made public: 2020. Names: Zhou Enlai.'
