      when: Feb. 17
      date: '1968-02-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - vietnam-hanoi
      c: Zhou Enlai tells Wei Guoqing to take hold of the Liuzhou rail backlog himself, 75 trains stuck by the 16th through the two factions' fighting, and to send mobile forces to keep the line open if need be. Next day he has the General Staff, the Railway, Foreign Trade and Foreign Ministries form a supervising group to inspect the southwest railways.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 215–216 (Feb. 17, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-17.china-leadership-2
      when: Feb. 17
      date: '1968-02-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai notes on the thirteen leaders'' assignments: cases differ; Mao''s instruction is to be followed, each case discussed one by one at the liaison meeting first before any arrangement.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 214 (Feb. 17, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
