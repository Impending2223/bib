      when: Oct. 25
      date: '1968-10-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai at the Cultural Revolution Group's liaison meeting, which discusses and revises the draft Constitution of the Communist Party of China and the draft decision on it, written under Kang Sheng, Zhang Chunqiao and Yao Wenyuan. Zhou then sends the revised draft to Mao and Lin Biao with a note of the changes; Mao cuts and revises it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 259 (Oct. 25, 1968). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Zhang Chunqiao, Yao Wenyuan, Mao Zedong, Lin Biao.'
