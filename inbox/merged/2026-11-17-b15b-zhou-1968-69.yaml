      c: 'Zhou Enlai, on a telegram to the Center signed by five members of the Shanxi revolutionary committee, tells Wu Faxian to pass to Wang Liangen: henceforth telegrams from provinces and great military regions need only two signatures once drafted and passed, not so many, to avoid leaks; any with leakable content is to be held back.'
