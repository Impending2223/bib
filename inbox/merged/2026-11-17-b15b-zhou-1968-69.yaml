      c: Zhou Enlai, hearing the State Capital Construction Commission's military representative on sending staff down, proposes that Gu Mu need not go to a cadre school but go to the Third Front capital construction engineer corps to investigate and sum up experience.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 326 (Nov. 8, 1969). Made public: 2020. Names: Zhou Enlai.'
