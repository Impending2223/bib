      when: Nov. 17
      date: '1968-11-17'
      thread: china-leadership
      also:
      - europe-and-the-alliance
      - china
      c: Zhou Enlai holds talks with the Albanian government economic delegation under Adil Çarçani, Politburo member of the Albanian Party of Labor. On Nov. 22 he attends the signing of the China-Albania economic and trade agreement.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 261 (Nov. 17, 1968). Made public: 2020. Names: Zhou Enlai. Check: Çarçani''s office as the nianpu gives it.'
      tags:
      - polity:prc
      - polity:albania
      - name:zhou-enlai
      - vis:only:prc+albania
