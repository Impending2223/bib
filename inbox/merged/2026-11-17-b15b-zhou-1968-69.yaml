      thread: china-leadership
      also:
      - africa
      - china
      c: 'Zhou Enlai, on Morocco''s authorities holding the Chinese ship Wuxi out of port because it flew Mao''s quotations, and the Chinese embassy''s chargé''s protest to Morocco''s Foreign Ministry, instructs within the leadership: the Wuxi''s flying Mao''s quotations in Morocco was wrong.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 261 (Nov. 19, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
