    entry:
      id: cal.1968-06-27.china-leadership
      when: June 27
      date: '1968-06-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - vietnam-hanoi
      c: 'Zhou Enlai, revising the first draft of the notice on Guangxi, adds: "firmly stop the mass organizations of the railway system and of the localities from linking up with one another"; all are to go back to their own units to grasp revolution and promote production; staff returned to offices and students to schools must be warmly welcomed, with no discrimination; and the instigators who wreck rail transport and ignore repeated advice are to be dealt with by law. The troops at Liuzhou, Guilin and Nanning are to uphold the Three-Eight style and "four firsts", take no side, and be guided to the "four nots" policy, to tell the two kinds of contradiction apart and isolate the few class enemies. The sentences on taking no side and the "four nots" are not in the notice as issued.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 238 (June 27, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
