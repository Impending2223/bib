patch: b15b-zhou-1968-69
by: 'Claude (batch 15, second wave, reader 5: *Zhou Enlai nianpu, 1949–1976*, the 2020 edition, vol. III (下卷), Jan. 1968 to Jan. 19, 1970; the 1997 middle volume ends with 1965), Nov. 16–17, 2026'
ops:
- add:
    entry:
      id: cal.1968-01-01.china-leadership
      when: Jan. 1
      date: '1968-01-01'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'The Renmin ribao, Hongqi and Jiefangjun bao print the New Year editorial "Greet the all-round victory of the Great Proletarian Cultural Revolution": the year''s tasks are to seize victory ideologically, politically, economically and organizationally; bourgeois and petty-bourgeois factionalism to be overthrown.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 207 (Jan. 1, 1968). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1968-01-01.china-leadership-2
      when: Jan. 1, 3, 10
      date: '1968-01-01'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates to the Hong Kong and Macao conference. On the summer of 1967: the domestic press''s propaganda on Hong Kong in June to September was faulty, its slogans near those used at home, the Red Guards'' slogans carried over into reports on Hong Kong.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 207 (Jan. 1, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-02.china-leadership
      when: Jan. 2
      date: '1968-01-02'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: Zhou Enlai welcomes Hồ Chí Minh.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 207 (Jan. 2, 1968). Made public: 2020. Names: Zhou Enlai, Hồ Chí Minh. Check: no place or occasion given.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
