      when: Oct. 11
      date: '1968-10-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai sends Mao for decision the list, in order, of the ten to be added to the Central Committee, the order fixed at the meeting at Mao''s on Oct. 9, with nine more alternate members.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 257 (Oct. 11, 1968). Made public: 2020. See [[cal.1968-10-09.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
