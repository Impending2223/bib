      - china
      c: 'Zhou Enlai again meets Maurer and his delegation. On the international communist movement: it has entered a period of independent development in each country, not of joint action; the world is in great upheaval, division and reorganization, and everywhere each Communist Party is tested on whether it can lead revolution, or each is tempered by itself, in parallel.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 313 (Sept. 11, 1969). Made public: 2020. Names: Zhou Enlai, Ion Gheorghe Maurer.'
