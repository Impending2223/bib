      thread: china-leadership
      also:
      - africa
      - testing-npt
      c: Zhou Enlai meets Tanzania's President Nyerere at the airport on his state visit. On the way to the guesthouse he says Tanzania and Zambia voted bravely at the General Assembly against the Soviet-American treaty; in the evening, in his speech at the banquet for Nyerere, he condemns it again.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 235 (June 18, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
