      c: 'Zhou Enlai attends the report meeting of delegates of the Red Guard congress of Peking''s colleges and middle schools. A Peking Petroleum Institute group criticizes another organization for opposing the Vice-Premier, Yu Qiuli and the Premier in 1967; Jiang Qing then says: was it right to bombard Tan Zhenlin in the February counter-current? The counter-current was meant to overthrow the proletarian headquarters under Mao.'
