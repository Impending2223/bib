- add:
    entry:
      id: cal.1968-03-03.china-leadership-2
      when: Mar. 3
      date: '1968-03-03'
      thread: china-leadership
      c: 'Zhou Enlai goes to the hospital to take leave of the body of Xu Guangping, Lu Xun''s widow, and consoles her family. Lu Xun''s son Zhou Haiying gives him her last letter, asking that Lu Xun''s letter manuscripts be found. On Mar. 2 she had written the Center: the Lu Xun Museum held 15 pages of a manuscript and 1,054 letters (1,524 pages, mostly unprinted), taken from it June 30, 1966 by the old Ministry of Culture, then in spring 1967 by Qi Benyu; she does not know where they are.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 218 (Mar. 3, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-04.china-leadership
      when: Mar. 4
      date: '1968-03-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, at dawn at Xu Guangping's home, reads her letter aloud to Chen Boda, Jiang Qing, Yao Wenyuan and others and demands that the matter of Qi Benyu's taking of the letters be cleared up and Lu Xun's manuscripts recovered at once.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 218 (Mar. 4, 1968). Made public: 2020. Names: Zhou Enlai, Chen Boda, Jiang Qing, Yao Wenyuan.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-boda
      - name:jiang-qing
      - name:yao-wenyuan
      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-04.china-leadership-2
      when: Mar. 4
      date: '1968-03-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: That night the Cultural Revolution Group's liaison meeting, called by Zhou Enlai, decides to look into the Lu Xun manuscripts and sends Fu Chongbi and others to question Qi Benyu.
