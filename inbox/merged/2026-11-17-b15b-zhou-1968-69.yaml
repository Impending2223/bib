      when: Dec. 6
      date: '1969-12-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the Hunan revolutionary committee''s fourth plenum''s taking some of Mao''s talks on his Hunan tour as meeting documents, tells Wang Liangen: draft a notice again forbidding strictly the private compiling and printing of Mao''s and Lin Biao''s talks and inspection-tour talks and of the speeches and talks of other Central comrades, and informal rumors, copies, papers and books about them; if the provinces'' committees, military regions, regional Party committees or like bodies break it again, discipline will be applied, and below the military districts they are to examine and punish. On Dec. 25 he reports to Mao and Lin with Chen Boda and Kang Sheng that such private compiling, printing and passing round of the talks and picture books is much and loose and will not stop unless warned several times and recalled and destroyed, and sends the Center''s notice draft passed by the Politburo with two annexes. Mao: do it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 330–331 (Dec. 6, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao, Chen Boda, Kang Sheng.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - name:chen-boda
      - name:kang-sheng
