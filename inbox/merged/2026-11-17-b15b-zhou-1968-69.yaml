      c: 'Zhou Enlai receives the members of the study class run by the Center to settle Sichuan''s problem and tells the Dukou delegates: put the whole first and the Third Front first, put politics in command and go all out to see that Dukou produces iron and the Chengdu-Kunming line is wholly open before July 1, 1970.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 330 (Dec. 4, 1969). Made public: 2020. Names: Zhou Enlai.'
