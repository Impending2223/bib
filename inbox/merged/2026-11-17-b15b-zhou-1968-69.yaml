      when: Mar. 27
      date: '1969-03-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the plenary session of the Ninth Congress preparatory meeting sets three things to be done before the Congress opens: to sound out in the groups the names of those to sit on the presidium, to discuss the Party constitution and to discuss the political report; secrecy is to be kept and the meeting''s content not leaked before it ends.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 282–283 (Mar. 27, 1969). Made public: 2020. Names: Zhou Enlai.'
