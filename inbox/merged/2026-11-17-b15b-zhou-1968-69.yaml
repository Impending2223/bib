      when: June 8, 9
      date: '1969-06-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai calls the people concerned to talk on defense industry questions.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 297 (June 8, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06-10.china-leadership
      when: June 10
      date: '1969-06-10'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai tells the meeting of heads of the State Council''s directly attached departments, army cadres and mass delegates among them, of the plan to cut the government''s departments discussed by the Center: the State Council''s former 61 ministries, commissions and bureaus are merged into 19 working departments. Struggle-criticism-reform in the central Party and state organs has come to settling their organizational form; revolutionary committees in the ministries are to be set up carefully (foreign affairs, finance, defense), not all questions can be taken to them, there must be a core leading group, whose members are to be chosen the more carefully, later the Party group or committee. Many leaders are "standing aside", none are capitalist-roaders, and hardly any ministry can avoid it; levels are to be cut with departments, to raise efficiency; cuts are to suit the place and the matter, and the specific plan is to be taken up and settled by the masses. To grasp revolution is to promote production, and the business most urgent is that of industry and communications. The State Council''s business group is announced to add Ji Dengkui and Li Desheng.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 297–298 (June 10, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06-10.china-leadership-2
      when: June 10
      date: '1969-06-10'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: 'Zhou Enlai receives Pakistan''s ambassador, Kaiser, who hands over President Yahya Khan''s letter inviting Zhou to Pakistan. Zhou: several countries have asked when he can go abroad, but, much occupied at home, he cannot now; many friendly countries understand, and a Pakistani visit too is probably not to be fixed this year.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 298 (June 10, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:pakistan
      - name:zhou-enlai
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1969-06-11.china-leadership-3
      when: June 11
      date: '1969-06-11'
      thread: china-leadership
      also:
      - soviet-union
      - china
      c: Zhou Enlai receives those attending the 15th regular meeting on navigation of the Sino-Soviet boundary rivers. The meeting is held at Khabarovsk from June 18 to Aug. 8; the two sides agree on certain concrete questions and sign minutes.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 298 (June 11, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06-12.china-leadership
      when: June 12
      date: '1969-06-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'By Mao''s instruction the Center issues "Opinions on several matters to watch in propagating Mao''s image", saying that propaganda now shows "no stress on politics, a pursuit of form, boasting and waste": without the Center''s approval no more Mao badges are to be made; no "loyalty movement"; no "asking for instructions in the morning and reporting in the evening", no reciting quotations before meals, no bowing to Mao''s portrait, and like formalism.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 298 (June 12, 1969). Made public: 2020. See [[cal.1969-06-11.china-leadership-2]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
