      date: '1969-09-30'
      thread: china-leadership
      also:
      - defense
      - india-and-china-cultural-revolution
      c: Late at night Zhou Enlai learns by telephone from Huang Yongsheng that Lin Biao, to guard against enemy bombing at the holiday breaching the Miyun reservoir's dam, proposes letting the reservoir's water out. Zhou opposes it, as it would drown people downstream; at dawn he calls the heads of the Ministry of Water Resources to a meeting, which overrules Lin's proposal.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Sept. 30, 1969). Made public: 2020. Names: Zhou Enlai, Lin Biao, Huang Yongsheng.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:lin-biao
      - name:huang-yongsheng
