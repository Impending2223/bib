      - vietnam-hanoi
      c: 'Zhou Enlai orders the Guangxi Military District to send troops to cover the masses fighting a fire at Nanning: on July 17 mass organizations holding Jiefang Road and Xinhua Street had set public buildings and houses afire and looted.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 241 (July 19, 1968). Made public: 2020. Names: Zhou Enlai.'
