      id: cal.1968-05-02.china-leadership
      when: May 2
      date: '1968-05-02'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai tells Li Xiannian to call Wen Yucheng, Li Qiang and others to study the main areas that lately hamper rail transport, and orders the rebel leaders in Liuzhou, Guangzhou, Kunming, Chongqing, Chengdu, Luoyang, Xi'an, Zhengzhou and Shenyang who wreck rail traffic to come to Peking by a set date, to be taken there under escort if they refuse.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 227 (May 2, 1968). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-xiannian
      - vis:only:prc
