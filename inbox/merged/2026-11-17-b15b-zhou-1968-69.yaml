      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai revises the notice on assigning the 1968 college graduates; the Center, State Council, Military Commission and Cultural Revolution Group issue it Nov. 15.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 261 (Nov. 12, 1968). Made public: 2020. Names: Zhou Enlai.'
