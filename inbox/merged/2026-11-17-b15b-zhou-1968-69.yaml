    entry:
      id: cal.1969-02-02.china-leadership-2
      when: Feb. 2
      date: '1969-02-02'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai writes Mao and Lin Biao proposing that within a day or two they call all the liaison meeting''s members to a meeting on preparations for the Ninth Congress: once the Zhejiang talks end, the liaison meeting turns to the Congress''s preparations.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Feb. 2, 1969). Made public: 2020. See [[cal.1969-02-02.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-02-05.china-leadership
      when: Feb. 5
      date: '1969-02-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai sends Mao the list of the Eighth Central Committee''s members and alternates attending the Twelfth Plenum who have and have not been proposed as delegates to the Ninth Congress, noting that he meant to report it in talk but the meeting is put off, so he sends first the written paper agreed at the liaison meeting, for Mao to think over beforehand. Mao: Chen Qihan, a deputy president of the Supreme People''s Court, seems to be worth considering.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 5, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-02-09.china-leadership
      when: Feb. 9
      date: '1969-02-09'
      thread: china-leadership
      also:
      - africa
      - china
      c: 'Zhou Enlai receives Guinea''s ambassador, Camara Kiko: an armed force counts not in numbers but in loyalty to the people and the nation, firmly under patriots'' leadership, so as to defend national independence. China has feeling for Africa, which shared its past experience.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 9, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:guinea
      - name:zhou-enlai
      - vis:only:prc+guinea
- add:
    entry:
      id: cal.1969-02-09.china-leadership-2
      when: Feb. 9
      date: '1969-02-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai convenes the military control group of the defense industry, the National Defense Science and Technology Commission, the National Defense Industry Office and the military control commissions and heads of the Second to Seventh Ministries of Machine Building on defense production, with instructions on its plans and layout. Anti-aircraft weapons are to be pressed hard and caught up in two or three years, a plan made and building hurried; of AA gun radar and directors he repeats that the electronics industry is most backward, radio plants must cooperate with outside plants, shutting oneself off stops progress, and a socialist enterprise monopolizing or blockading is wrong. Research may and should be joined to production. On imported machines: take care not to be cheated, test them at the port of entry and, if they fail, deal with the sellers there; do not buy what can be made at home.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 274–275 (Feb. 9, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-02-11.china-leadership
      when: Feb. 11
      date: '1969-02-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the second defense industry meeting: production is to be pressed of rifles, machine guns, anti-aircraft guns, ground-to-air missiles, aircraft, submarines and anti-tank weapons, since war rests mainly on conventional arms, though advanced and conventional arms must go together; of advanced weapons China is to beat the enemy by quality, with numbers not too large, or they become a burden. Hearing the shipbuilding report he says the shipbuilding industry is not matched up, steel plate output to be considered, and the quality of the 10,000-ton ships already built watched.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 275 (Feb. 11, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-02-16.china-leadership
      when: Feb. 16–Mar. 24
      date: '1969-02-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: The national planning forum meets in Peking. Prepared on Zhou Enlai's instruction of Dec. 12 by a new plan-drafting group of military representatives, old cadres and rebels, it takes up the 1969 economic plan, direction and tasks, the year's output targets and the scale of capital construction. From January Zhou repeatedly called the responsible people to plan it, revised the State Council's notice convening it, read its bulletins in detail and often talked with those in charge. Learning that the Ministry of Materials had not, as he ordered, recovered 5,000 tons of aluminium set aside for Mao badges, he asks why, saying that spreading Mao Zedong Thought must be effective, that the badges grow ever bigger and the Chairman does not approve; the ministry sends out a notice that night to recover it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 275 (Feb. 16, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-02-18.china-leadership
      when: Feb. 18
      date: '1969-02-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the suggestion of the Lanzhou Military Region and the Water and Power Ministry''s military control commission to import some electrical equipment and conductors for the 330-kilovolt Liujiaxia to Guanzhong extra-high-voltage line, writes Yu Qiuli: mobilizing the potential of Shanghai and Harbin should do it; to be discussed at the national planning conference.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 275 (Feb. 18, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
