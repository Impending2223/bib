      - defense
      c: 'The State Council and the Military Commission send out a notice merging the General Staff''s Military Meteorological Bureau with the Central Meteorological Bureau: the Staff bureau is abolished and the Central Meteorological Bureau, so named, comes under the General Staff.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 325–326 (Dec. 14, 1969). Made public: 2020. Names: Zhou Enlai.'
