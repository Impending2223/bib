      date: '1968-07-13'
      thread: china-leadership
      also:
      - china
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on mass organizations'' repeated assaults at Quanzhou, Fujian, on the "641" transmitter and seizure of the guard unit''s arms and ammunition, leaving its safety and broadcasting unprotected, tells Huang Yongsheng and Wu Faxian to consult Han Xianchu: "641" is a central transmitter, to be put under military control at once; the two sides'' people in Peking are to be made to telephone home to demand return of the arms and equipment, else it plays to what Taiwan and the Americans want; other disputes are best settled on the spot or by sending both sides'' people to the study class.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 240–241 (July 13, 1968). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Wu Faxian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:huang-yongsheng
      - name:wu-faxian
      - vis:only:prc
