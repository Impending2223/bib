      date: '1969-09-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - defense
      c: 'Zhou Enlai speaks at the army''s war preparation conference on the international and domestic situation: the international situation is tense, so China must prepare for war and above all guard against surprise attack and keep strict watch. On the new tasks after the Ninth Congress: the Party''s leadership is to be exercised; there is to be no more "seizing power"; every Party member is held to proletarian Party spirit; mass organizations are to protect the interests of the great majority, and "grasp revolution by trades", never again to set up mountaintops or fight. With the fourth quarter near, work is to be done well to open a new face, and the Fourth and Fifth Five-Year Plans fulfilled, to make China in the near future a great socialist power.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 316 (Sept. 22, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-09-24.china-leadership-2
      when: Sept. 24
      date: '1969-09-24'
      thread: china-leadership
      also:
      - soviet-union
      - china
      c: 'Zhou Enlai writes Mao and Lin Biao: the Soviet government''s statement of June 13 must be answered publicly by the Chinese government, setting out China''s whole position on the settling of the boundary question and the truth of the border clashes, to win the initiative; the day after the government statement is issued a Foreign Ministry paper on the Soviet statement of June 13 is to follow. The Soviet statement had said that the sharpening of Soviet-Chinese relations was wholly caused by China''s actions and that the Chinese statement of May 24 made baseless demands to add trouble to trouble.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 316–317 (Sept. 24, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
