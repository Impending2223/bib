    entry:
      id: cal.1968-11-12.china-leadership
      when: Nov. 12
      date: '1968-11-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Romania''s ambassador, Duma, and answers his questions on relations between the two countries: exchanges between them are proper; the present state is wholly because of the Cultural Revolution.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 260–261 (Nov. 12, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:romania
