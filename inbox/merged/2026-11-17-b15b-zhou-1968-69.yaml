      c: Zhou Enlai, having read the Guangzhou Military Region and Guangdong revolutionary committee's report on Guangzhou workers and poor and lower-middle peasants going to the universities to spread the "July 3" and "July 24" notices, proposes to Mao and Lin Biao in writing that a month's results and experience in Guangdong, Guangzhou first, of full mobilization, wide propaganda of the notices and of joint action by workers, peasants and soldiers to dissuade armed fights, rouse the masses, even street residents, to expose class enemies and seize bad people behind the scenes, be written up by the Military Commission's Office Group in a general report, then, with the agreement of Guangdong's committee and the Region, put to the liaison meeting and a Center instruction drafted for the whole country. Mao approves.
