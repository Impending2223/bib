      c: 'Zhou Enlai, on whether schools take the summer holiday: junior middle and primary schools to have it, colleges, technical schools and senior middle schools not, so that graduates can be assigned; to be put to the liaison meeting and then reported up.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 237 (June 28, 1968). Made public: 2020. Names: Zhou Enlai.'
