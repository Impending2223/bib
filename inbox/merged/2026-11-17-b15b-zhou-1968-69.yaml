      - india-and-china-cultural-revolution
      - defense
      c: Zhou Enlai presides over the Politburo meeting on the Sino-Soviet boundary talks, in recess because the Soviet delegates went home, and on war preparation, next year's production plan, Third Front construction and Inner Mongolia and Sichuan. Next day he reports the meeting to Mao in writing.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 331 (Dec. 11, 1969). Made public: 2020. See [[cal.1969-12.china-leadership-3]]. Names: Zhou Enlai, Mao Zedong.'
