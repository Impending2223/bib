      when: Apr. 29
      date: '1968-04-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai revises the Center, State Council, Military Commission and Cultural Revolution Group's notice on assigning the 1967 college graduates, adding that the educated are to develop morally, intellectually and physically, that education must serve proletarian politics and join productive labor, the working people to become intellectuals and the intellectuals laborers. On May 2 he attends the liaison meeting that discusses the notice.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 226 (Apr. 29, 1968). Made public: 2020. Names: Zhou Enlai.'
