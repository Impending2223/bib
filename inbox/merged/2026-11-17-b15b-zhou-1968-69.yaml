      when: July 24
      date: '1968-07-24'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - vietnam-hanoi
      c: 'Zhou Enlai that evening, with the Cultural Revolution Group''s liaison members, receives the delegates of Guangxi''s two factions studying in Peking and some army cadres, and sharply criticizes the siege of the prison, the seizure of aid materials for Vietnam and of PLA arms, and the cutting of the railway. They are to telephone back at once, withdraw from the No. 3 prison and let the army take it over; armed fights are to stop and traffic reopen, the July 3 notice may not go unimplemented in Guangxi. The Liuzhou railway is the key: how much longer to stop it? There have been no trains for nearly two months; an agreement is to be reached this afternoon and the line opened.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 243 (July 24, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - vis:only:prc
