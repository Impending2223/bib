      c: 'Zhou Enlai, on the Henan revolutionary committee and military district''s report of an "against restoration" trend in society, notes: it is a social current; stopped in one place it spills over into others.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 293 (May 22, 1969). Made public: 2020. Names: Zhou Enlai.'
