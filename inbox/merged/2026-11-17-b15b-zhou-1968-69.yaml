      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Lin Biao tells the plenum that the "February counter-current" was the most serious anti-Party incident since the Eleventh Plenum, a rehearsal of capitalist restoration.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 259 (Oct. 20, 1968). Made public: 2020. Names: Lin Biao.'
