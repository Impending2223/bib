      when: July 7
      date: '1969-07-07'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the Shanxi revolutionary committee core group''s notice to the Cultural Revolution Group on reopening the south Datong-Puzhou railway, writes Chen Boda, Xie Fuzhi and Ji Dengkui: the text only once says that if such incidents go on they will be traced severely and the ringleaders punished by law, but how to forbid, how to punish is not said, and troublemakers can ignore it; they might be asked for a further notice strictly forbidding each item, those who break it to be arrested by force and punished by law. On July 8 the core group replies that it has revised the notice as he said.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 302 (July 7, 1969). Made public: 2020. Names: Zhou Enlai, Chen Boda, Xie Fuzhi.'
