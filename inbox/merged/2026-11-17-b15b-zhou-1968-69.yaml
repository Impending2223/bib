- add:
    entry:
      id: cal.1968-04-20.china-leadership-2
      when: Apr. 20
      date: '1968-04-20'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives delegates of the National Defense Science and Technology Commission, the National Defense Industry Office, the Seventh Ministry of Machine Building and the Academy of Sciences: others are to be allowed their mistakes and not beaten dead at one blow; several of the Commission''s deputy directors erred and are to be helped to mend; Zhao Erlu is dead and someone would still bring him down, a fair word is that he worked in rear services, diligent and faithful, "the living to be protected, the dead too"; he knows Nie Rongzhen well, old comrades, and Mao told him to help him. Because bad people were found in defense research and production does not mean the leadership is worthless; the teams must be formed now, production not going up pains him; end the arguments quickly.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 224–225 (Apr. 20, 1968). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen, Zhao Erlu, Mao Zedong.'
