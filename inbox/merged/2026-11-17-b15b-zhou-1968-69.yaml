      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the Navy Party committee''s report on enemy papers'' fabrication that a certain general was captured and turned in the war of liberation: reports of this kind, with living witnesses to refute the enemy papers'' invention, are to be deposited in the archives with a photocopy of the papers, to close the case and spare later argument.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 224 (Apr. 17, 1968). Made public: 2020. Names: Zhou Enlai.'
