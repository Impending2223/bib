      c: 'Zhou Enlai talks with Nyerere at the capital airport as he passes through Peking from North Korea: to find an economic outlet the United States has made a pan-American economic unification, to tie an all-in economy to its own and its investment abroad; coffee countries can only grow coffee and sugar countries sugar, all machines and parts come from the United States, and it invests where profit is highest. Neo-colonialism controls more tightly than the old.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 236–237 (June 25, 1968). Made public: 2020. Names: Zhou Enlai, Nyerere.'
      tags:
      - polity:prc
      - polity:tanzania
      - name:zhou-enlai
      - name:nyerere-julius-k
      - vis:only:prc+tanzania
