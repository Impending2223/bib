      when: Feb. 24
      date: '1968-02-24'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai with Chen Boda, Kang Sheng, Jiang Qing and Yang Chengwu receives the delegations of Jilin and Liaoning: one organization''s factionalism is not to sway the revolutionary committees; minority cadres and masses to be drawn in. Last year''s great linking up and power seizures hurt production, this year they should not; normal production is to begin in March.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 217 (Feb. 24, 1968). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
