      when: Feb. 13
      date: '1968-02-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting: the urgent notice on further economy and strict cuts in spending is passed. The State Council business group drafted it on his instruction after a survey of ten Peking units; Mao approves it and the Center, State Council, Military Commission and Group issue it Feb. 18.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 214–215 (Feb. 13, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
