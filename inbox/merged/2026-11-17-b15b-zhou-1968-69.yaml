      - china
      c: Liu Xiwen, Wang Xiaoyun and Sun Pinghua for China's memorandum trade office and Furui Yoshimi and Okazaki Kaheita for Japan's sign the talks communiqué. Drawn from Zhou Enlai's several talks with Matsumura Kenzo, it reaffirms the three political principles of Sino-Japanese relations and that politics and economics are inseparable, the political basis between the two offices.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 218–219 (Mar. 6, 1968). Names: Zhou Enlai.'
