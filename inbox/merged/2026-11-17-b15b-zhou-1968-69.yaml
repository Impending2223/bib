      date: '1968-06-18'
      thread: china-leadership
      also:
      - testing-npt
      - china
      c: 'Zhou Enlai sends the draft statement on the non-proliferation treaty to Mao for approval and notes, against Kang Sheng''s view that it need not be hurried or issued: the government''s statement may be put off but is still needed; Chen Yi''s speech at the banquet for Nyerere, the Renmin ribao commentator''s article and his own speech tonight cannot serve as the state''s attitude; the treaty is to be looked down on but also exposed. At the liaison meeting on June 17 he said the treaty, made by the United States and the Soviet Union together, is aimed at non-nuclear states, to put them under a "nuclear umbrella" as protected states. Mao: agreed to put off publication.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 235 (June 18, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Kang Sheng, Chen Yi.'
      tags:
      - polity:prc
