      when: Feb. 28
      date: '1968-02-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting: the notice on checking cadres'' files and the notice on the 1968 spring export fair.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 217 (Feb. 28, 1968). Made public: 2020. Names: Zhou Enlai.'
