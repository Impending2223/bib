      when: June 3
      date: '1968-06-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai goes to Mao''s in the evening, then accompanies Mao in receiving the delegates of the Nanjing and Shenyang military regions'' and PLA headquarters'' and service arms'' Mao Zedong Thought study classes. Mao, speaking with the central leaders, says that those who want to bring down Chen Yi include the Foreign Languages school''s "June 16" group; Zhou: "June 16" also wants to bring me down; Mao: with Chen Yi down, you are about next.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 233 (June 3, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Chen Yi. Check: whether the evening is that of [[cal.1968-06-03.china-leadership]].'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:chen-yi
      - vis:only:prc
- add:
    entry:
      id: cal.1968-06-07.china-leadership
      when: June 7
      date: '1968-06-07'
      thread: china-leadership
      also:
      - china
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, having read the State Council Foreign Experts Bureau''s report on the foreign experts'' state of mind, sends it to Mao with a letter: most experts are keen on their work; our forcing ourselves on foreign masses, as Mao says, is a serious phenomenon. He proposes that the liaison meeting first discuss it, and people then go to every place with foreign experts: the Chinese staff must have military control representatives and Mao Zedong Thought propaganda teams, study classes, struggle against self and criticism of revisionism and a clean-up of class ranks, before relations can be set right. Mao on June 8 agrees to a discussion at the meeting. The report says experts have long complained of the Friendship Hotel''s rude service and bad food, of units that treat them as foreign spies, and that no one cares for them politically, in work or in life.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 234 (June 7, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
