      c: 'Zhou Enlai, on a PLA unit''s report that two large tombs have been found at Lingshan, west of Mancheng, Hebei, orders the site protected and the Academy of Sciences to organize a scientific excavation. The nianpu''s note: they proved to be the tombs of Liu Sheng, Prince Jing of Zhongshan, and his wife Dou Wan, of the Western Han, the great find the gold-thread jade suits.'
