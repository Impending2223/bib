      date: 1968-07
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai revises the directive on reforming propaganda abroad, adding: against formalism and imposing on others, against vulgarization; Mao Zedong Thought is to be spread by vivid facts, accurate statement and clear stand, "seeking truth from facts", not by academic recitation or dogmatic preaching; "self-trumpeting" in propaganda abroad is to be overcome.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 245 (July 1968). Made public: 2020. Names: Zhou Enlai.'
