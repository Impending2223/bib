      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the handling after Liu Peishan''s suicide, has Huang Yongsheng, Wu Faxian and Tan Furen tell Liu''s wife, Zuo Ying: the Center holds that Liu is himself responsible for his suicide, but for other, objective reasons it was not suicide to evade guilt, and he was not a traitor; a revolutionary of decades, his family is to have a revolutionary cadre''s family treatment, and his ashes may be placed at Yuhuatai, Nanjing.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 231 (May 18, 1968). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Wu Faxian.'
