      when: Feb. 21
      date: '1968-02-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting: the draft emergency supplementary order on rail transport, the notice on the 1968 Guangzhou spring export fair and the order on army discipline.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 217 (Feb. 21, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
