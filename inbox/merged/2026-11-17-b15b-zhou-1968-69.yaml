      date: '1968-10-10'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai drafts for the Center and the Cultural Revolution Group the notice convening the enlarged Twelfth Plenum of the Eighth Central Committee.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 257 (Oct. 10, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
