- add:
    entry:
      id: cal.1968-12-03.china-leadership
      when: Dec. 3
      date: '1968-12-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai drafts for the Center and the Cultural Revolution Group the comment forwarding the report on the Xinhua Printing Works with Mao''s note: "Study Chairman Mao''s instruction and note seriously, study this summing-up of experience, link it with local conditions, tell the two kinds of contradiction apart, rely on the masses and firmly carry out Chairman Mao''s policy of giving a way out." The document goes out the same day.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 262–263 (Dec. 3, 1968). Made public: 2020. See [[cal.1968-12-01.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-04.china-leadership
      when: Dec. 4
      date: '1968-12-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on a dispute over slogans written on a Chinese ship bound for Denmark: propaganda abroad must follow Mao Zedong Thought, and the ultra-left trend must be criticized.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 263 (Dec. 4, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-05.china-leadership
      when: Dec. 5
      date: '1968-12-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - china
      c: 'Zhou Enlai at the meeting of the heads of the State Council ministries'' military control commissions, Mao Zedong Thought propaganda teams and great-alliance committees: erring cadres are to be treated by policy, given a way out and freed once they admit the error. The "February counter-current" has its bounds; those men, Tan Zhenlin, Chen Yi, Li Xiannian, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Yu Qiuli and others, gave many instructions, to be judged by whether each is right, many following the Center''s policy; not every word is "counter-current", nor everything its men did to be denied; the policy stays "criticize one, protect two, watch three"; where a unit still argues without end, send in a propaganda team. Of the old comrades of the counter-current, Mao said this time that he hopes they will be elected delegates to the Ninth Congress, but they should be the more vigilant. Li Siguang of the Ministry of Geology is a good comrade whom some would bring down; learn from him. Of the Foreign Ministry: "peaceful coexistence" is not a poisonous weed, the struggle abroad is exceedingly complex, foreign work cannot stop and most fears interference, right or "left"; so too the Foreign Economic Liaison Commission.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 263 (Dec. 5, 1968). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin, Chen Yi, Li Xiannian, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:tan-zhenlin
      - name:chen-yi
      - name:li-xiannian
      - name:ye-jianying
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-09.china-leadership
      when: Dec. 9
      date: '1968-12-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, finding the customs inspection at the capital airport run by several units, the Civil Aviation Administration, Public Security Bureau and Customs, in a way that leaves gaps, tells the head of the Peking Garrison to look into it; the report comes back Dec. 9 and he notes: (1) the Civil Aviation Administration is to go to the Air Force as a military formation, its uniform to be drawn up; (2) the frontier inspection posts and the posts for foreigners'' entry and exit are to be run together by the Garrison or the guard area, and customs and quarantine together by the Civil Aviation Administration, which is also to control the frontier and entry-exit posts under military control; (3) experience is to be summed up and a few rules fixed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 263–264 (Dec. 9, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-09.china-leadership-2
      when: Dec. 9
      date: '1968-12-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the demand of the Central Investigation Department''s mass organization to seize Kong Yuan and others back to Peking for struggle, writes Wang Dongxing: at this time it is better to criticize him back-to-back than to seize him back for struggle.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 264 (Dec. 9, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-11.china-leadership
      when: Dec. 11
      date: '1968-12-11'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: 'Zhou Enlai receives Pakistan''s ambassador, Sultan Muhammad Khan, and asks about Pakistan''s experience of family planning; learning that Pakistan has more drugs in this field, he hopes it will supply China some kinds. On China''s farming: good harvests several years running and some rules found; this year the south had floods and the north drought, yet output rose, by men''s effort, with small water works, manure, seed selection, deep plowing and soil improvement.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 264 (Dec. 11, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:pakistan
      - name:zhou-enlai
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1968-12-11.china-leadership-2
      when: Dec. 11, 13
      date: '1968-12-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai convenes meetings of the Central Special Committee and hears Qian Xuesen's report on the test of the "Dongfeng 3" medium-range ground-to-ground missile; he says to clear away interference and practice boldly.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 264 (Dec. 11, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-14.china-leadership-2
      when: Dec. 14
      date: '1968-12-14'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on receiving Mao''s comment on the poor and lower-middle peasants of Anjiabao commune, Wanquan county, Hebei, managing trade, calls the heads of the Supply and Marketing Cooperatives, the Ministries of Commerce, Grain, Foreign Trade and Finance and the People''s Bank, and proposes: (1) discussion and pilots, actively begun, of poor and lower-middle peasants joining the management of rural grain trade and workers, peasants and soldiers that of the towns''; (2) rural areas in time basically to buy and not sell grain; (3) in time every team to have reserves and every household surplus grain, "grain stored with the people"; (4) every team to have storehouses, keeping its own reserves and some state grain too, and the state''s rural warehouses in part handed to the poor and lower-middle peasants to manage; (5) grain and oil processing in the countryside gradually mechanized and done by communes and teams themselves.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 264–265 (Dec. 14, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-18.china-leadership
      when: Dec. 18–21
      date: '1968-12-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai calls the military representatives of the industry and communications sector on Dec. 18; from the evening of Dec. 19 those of defense, foreign affairs, finance and trade, culture and education, industry and communications, and agriculture and forestry; on Dec. 21 the State Council's meeting of all sectors.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 265 (Dec. 18, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-19.china-leadership-2
      when: Dec. 19
      date: '1968-12-19'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai to Li Xiannian: the proposal that rural supply and marketing cooperatives be managed by the poor and lower-middle peasants is to be tried out by people sent down by the Supply and Marketing Cooperative, to get a few rules within the year before the Center issues them; his proposal must on no account be sent down as an instruction now.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 265 (Dec. 19, 1968). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-21.china-leadership-2
      when: Dec. 21
      date: '1968-12-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai tells the Peking subway bureau, on its request whether to pull down the old astronomical observatory, a Yuan building, for the subway: it is not to be pulled down; see whether the line can go around it, what the difficulties are, and write a report with the design plan.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 265 (Dec. 21, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-24.china-leadership
      when: Dec. 24, 25, 29
      date: '1968-12-24'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai talks with Railway Ministry people on Xuzhou's railway on Dec. 24, calls Xuzhou's two factions to a meeting Dec. 25 and receives their delegates Dec. 29.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 265 (Dec. 24, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-26.china-leadership
      when: Dec. 26
      date: '1968-12-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai tells Yu Qiuli that only five days of the year are left and next year''s plan not made: a national planning conference approved early in December, with a list of people from the Capital Construction, Planning and Economic Commissions, the Ministry of Finance and the National Defense Industry Office, had been given up because the meeting turned to mass criticism. Without a plan how can they place the production of key means of production and necessities and the routes of transport? He asks Yu first to draw up the first quarter''s plan for 1969.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 265 (Dec. 26, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-26.china-leadership-2
      when: Dec. 26
      date: '1968-12-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai signs out the Center''s and the Cultural Revolution Group''s notice on keeping to policy in the struggle against the enemy: in naming enemies no vague words that blur the two kinds of contradiction and widen the blow; cases settled by leaders and masses together, the slogan of "masses settle cases" not to replace it; those fixed as traitors, agents or unrepentant capitalist roaders are to be told from cadres "standing aside" whose cases are not decided, and the two not both called "black gang" or "ox-ghosts and snake-spirits". Zhou notes that it may go to local factories, mines, enterprises and institutions'' primary units, commune and brigade revolutionary committees or military control commissions, and army regimental (or independent battalion) Party committees. In revising it Mao added that the unrepentant are a few among those who made capitalist-roader errors and most can be educated and correct them, and that even the children of counterrevolutionaries and the unrepentant should be called "children who can be educated". Afterward some cadres overthrown are "freed".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 265–266 (Dec. 26, 1968). Made public: 2020. See [[cal.1968-12-21.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-27.china-leadership-3
      when: Dec. 27
      date: '1968-12-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the Shenyang Military Region''s report to the Military Commission on the conscription pilot, notes: he proposes adopting the Northeast''s trial method of communes carrying out conscription under the counties'' unified leadership; every province to run a pilot after the new year, and if it works to extend it generally around the Spring Festival.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 266 (Dec. 27, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-28.china-leadership
      when: Dec. 28
      date: '1968-12-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives the two factions'' mass delegates of the National Defense Science and Technology Commission''s and the Seventh Ministry''s study classes: the Seventh Ministry''s tasks are heavy and production may not be delayed again. Of the successful test of the Dongfeng-3 missile: it was made just when the Seventh Ministry''s armed fights were fiercest and many parts were not up to specification, yet it flew by the working class; old workers spent a month, checking many times, and found over 200 problems, over 70 critical, and solved them one by one, some by doing them again.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 266–267 (Dec. 28, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-29.china-leadership
      when: Dec. 29
      date: '1968-12-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the material the Military Commission''s Office Group forwards from the Party branch of Xu Xiangqian''s office on his recent state of mind, suggests that the Office Group send someone to talk with the branch''s comrades: "do not make it too tense, guard against accidents." Mao agrees, and on Jan. 3, 1969 writes that none of the old comrades connected with the "February counter-current", or their families, are to be criticized, and relations are to be put right.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 267 (Dec. 29, 1968). Made public: 2020. Names: Zhou Enlai, Xu Xiangqian, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:xu-xiangqian
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-29.china-leadership-2
      when: Dec. 29
      date: '1968-12-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, on Xu Shiyou's telephone report that Zhejiang is gravely disordered by wild criticism, struggle and naming and his request to come to Peking to report, drafts on Mao's instruction the telephone reply agreeing, asking Xu for a list of those from Zhejiang, Jiangsu and the Nanjing Military Region to attend the discussion; he also notifies the Jinan Military Region and the Shandong revolutionary committee to list those to come to the Center to settle the Xuzhou-Haizhou question.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 267 (Dec. 29, 1968). Made public: 2020. Names: Zhou Enlai, Xu Shiyou, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:xu-shiyou
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-30.china-leadership
      when: Dec. 30
      date: '1968-12-30'
      thread: china-leadership
      also:
      - europe-and-the-alliance
      - china
      c: 'Zhou Enlai receives Albania''s ambassador, Tateli: China''s papers often print long articles nobody reads and Mao often criticizes it; editorials are shorter but the reports still long, some two pages, hard to read, and long broadcasts few hear. On China''s farming: the first half-year was hit by armed fights, but in the second half many places overshot their targets.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 267 (Dec. 30, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - polity:albania
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1968-12-31.china-leadership
      when: Dec. 31
      date: '1968-12-31'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai sits all night with Li Fuchun, Li Xiannian, Yu Qiuli and the whole group drafting the 1969 national economic plan: radio is the biggest short line; electronics, military and civil, is to catch up in two years, with ambition; radio is the worst; Japan made semiconductors ten years after the war and, China able to make a hydrogen bomb, he does not believe it cannot make semiconductors.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 267 (Dec. 31, 1968). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12.china-leadership
      when: Dec.
      date: 1968-12
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai drafts the Center''s "list of delegates to the Ninth Congress and provisional list". The list agreed at the enlarged Twelfth Plenum has fourteen: Mao, Lin Biao, Zhou, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Xie Fuzhi, Huang Yongsheng, Wu Faxian, Ye Qun, Wang Dongxing and Wen Yucheng. The list of Central Committee members and alternates provisionally put forward has thirty-nine, among them Zhu De, Dong Biwu, Deng Yingchao, Deng Zihui, Hu Yaobang, Li Fuchun, Li Xiannian, Wang Zhen, Liu Bocheng, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Chen Yi and Saifudin; five need discussion and the approval of Mao and Lin Biao first, among them Chen Yun, Fang Yi, Yang Yong and Tan Qilong.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 267–268 (Dec. 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Xie Fuzhi, Huang Yongsheng, Wu Faxian, Ye Qun, Zhu De, Dong Biwu, Liu Bocheng, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Chen Yi, Li Fuchun, Li Xiannian, Chen Yun. Check: the OCR-read names of the 39; the nianpu''s list not read name by name.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - name:zhang-chunqiao
      - name:yao-wenyuan
      - name:xie-fuzhi
      - name:huang-yongsheng
      - name:wu-faxian
      - name:ye-qun
      - name:zhu-de
      - name:dong-biwu
      - name:liu-bocheng
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:ye-jianying
      - name:chen-yi
      - name:li-fuchun
      - name:li-xiannian
      - name:chen-yun
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12.china-leadership-2
      when: Dec.
      date: 1968-12
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, reading the Military Commission Office Group''s reply, in the Commission''s name, to a report of the National Defense Science and Technology Commission and the Air Force, strikes the closing greeting "long life to Chairman Mao" and writes: "please note, no more such phrases." Zhou Enlai, returning the paper, notes: the Chairman''s comment is inside, all the Office Group''s comrades and those drafting reports and replies are to take note.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 268 (Dec. 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968.china-leadership-2
      when: '1968'
      date: '1968'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai drafts documents to stop armed fights, among them: specialized fighting teams abolished; the great alliance and three-in-one accepted by trade; no re-forming ranks or setting up separate mountaintops; revolutionary committees and military representatives to see that no worker or staff is driven from his post; free linking up away from posts stopped; no more seizing arms and ammunition, no attacking buildings and setting up strongholds, no seizing any public store of goods, still less killing or arson.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 268 (1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-01-01.china-leadership
      when: Jan. 1–4
      date: '1969-01-01'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai drafts a report to Mao, Lin Biao, the Center and the Cultural Revolution Group: of the State Council''s 62 units, all but a very few achieved great alliance long ago. For the 1969 national economic plan he proposes to strive to reach ahead of time the main production targets set for 1970 in the Third Five-Year Plan. Two oral contraceptives have been trial-made, 99.9 percent effective, to be sold cheap from this year.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 269 (Jan. 1, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
