      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at a meeting at Mao''s: Mao says rebellion depends on whom one rebels against, not against the proletariat; wrecking the railways is not allowed. Zhou: in the first quarter transport, industry and coal are to be raised; great alliance and three-in-one.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 214 (Feb. 11, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
