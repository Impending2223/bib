      c: 'Zhou Enlai, on Li Xiannian''s letter on Tsinghua University''s funds, notes: the money is to be paid in the amount Tsinghua''s workers'' and PLA propaganda team reported directly to the Peking revolutionary committee, to pass to the team and to Tsinghua''s committee, with the Ministry of Education told; all universities directly under Peking are to be dealt with so hereafter.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 295 (May 31, 1969). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
