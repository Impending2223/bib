      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on Zhang Shizhao''s letter that Qin Rui, daughter of Qin Zhen, formerly vice-president of the Kuomintang''s Judicial Yuan, is being struggled against at Nanjing on her father''s account, tells Wu Dasheng by telephone, then forwards the letter for him to handle: (1) Qin Zhen did have a united-front relation with the Party in the anti-Japanese war, an anti-Chiang man; (2) care for Qin''s family was indeed Mao''s instruction; (3) Zhang Shizhao''s statement in his letter is true; (4) if Qin Rui is unsuited to teach at Nanjing''s No. 23 middle school she may be moved, to avoid conflict with the masses. At month''s end the local garrison sends men to the school, says her father was a united-front object and her case is not to be pursued.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 249 (Aug. 27, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-08-29.china-leadership-2
      when: Aug. 29
      date: '1968-08-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives Xinjiang''s delegates and presses the mass organizations to take Wang Enmao into the Xinjiang Uighur Autonomous Region''s revolutionary committee: nineteen years in Xinjiang he did something for the Party and people; he has not reached the line of the enemy, it is still a contradiction among the people, and he will go on working in Xinjiang. On students: they led at the start, but it cannot go on so; "you stop classes to make revolution, for how many years?" Next evening he calls several Xinjiang leaders to talk.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 249 (Aug. 29, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-08-30.china-leadership
      when: Aug. 30
      date: '1968-08-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai attends the forum called by Peking's revolutionary committee of delegates of the workers' and PLA Mao Zedong Thought propaganda teams stationed at Peking University, Tsinghua, the Aeronautics Institute, the Geology Institute and other colleges, hears the report and gives instructions. On Aug. 31 the committee calls the heads of the teams at 59 colleges, and asks that the two teams be under unified, collective leadership, that the majority of the masses be trusted and the Red Guards' merits and faults rightly weighed, that great alliance come through great criticism by classes and offices, and that investigation be strengthened.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 250 (Aug. 30, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
