      id: cal.1968-06-28.china-leadership-2
      when: June 28
      date: '1968-06-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Albanian delegation from the Vau-i-Dejës hydropower station: China has built many dams in nineteen years but has not summed up its experience, critically, from old and new, Chinese and foreign. Overall planning of water works means flood control first, then irrigation, power and transport; none of China''s reservoirs yet serves all four. He invites them to see the Yangtze Bridge and Sanmenxia, and says that if the Cultural Revolution is finished and he is not yet dead or overthrown or dismissed he will go with the head of the delegation; the great revolution now is like a civil war.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 237 (June 28, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:albania
      - name:zhou-enlai
      - vis:only:prc+albania
