      c: Zhou Enlai calls Wen Yucheng, Li Qiang, Yang Jie and Guo Lu to talk on reopening the railways at Liuzhou, Hengyang and Xi'an and the shipment of aid materials to Vietnam, and tells them to go to Wei Guoqing, Hu Wei and Long Shujin to settle it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 239 (July 9, 1968). Made public: 2020. Names: Zhou Enlai.'
