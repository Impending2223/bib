      - vis:only:prc+australia
- add:
    entry:
      id: cal.1968-11-29.china-leadership
      when: Nov. 29, 30
      date: '1968-11-29'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Pan Ba (as the nianpu writes it), a leader of the Cambodian People''s Revolutionary Party, and holds talks. On Nov. 30: Johnson will soon be out and Nixon, coming in, will probably try to improve relations with China, so there may be some new change in Sino-American relations. On the struggle against imperialism, revisionism and reaction: policy and tactics are needed, a strategic plan and flexible tactics, to defeat them one by one; for a time seize one main enemy and its most faithful partner and strike at them together; use their contradictions and their different interests; unite all revolutionary peoples that can be united, the revolutionary nationalists among them, and use forces in conflict with the main enemy as indirect allies.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 262 (Nov. 29, 1968). Made public: 2020. Names: Zhou Enlai. Check: the visitor''s name and the party.'
      tags:
      - polity:prc
      - polity:cambodia
      - name:zhou-enlai
      - vis:only:prc+cambodia
- add:
    entry:
      id: cal.1968-11-30.china-leadership-2
      when: Nov. 30
      date: '1968-11-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on a set of commemorative pictures of Shaoshan, Mao''s birthplace, printed by the Hunan Handicraft Art Company with the words "Mao clan ancestral hall": the Military Commission''s Office Group is first to telephone Hunan''s revolutionary committee to stop sales at once; then the Cultural Revolution Group in its own name is to criticize the committee sternly.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 262 (Nov. 30, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
