      when: May 22
      date: '1969-05-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai drafts the Center''s instruction on settling Guizhou''s problem: unity inside the army, among the masses and between army and government and between army and people is to be strengthened, the Center''s instructions widely spread, shortcomings and errors on every side corrected, experience summed up and policy carried out; Guizhou''s situation is to be steadied, the fight against drought won, Third Front construction speeded and Mao''s strategic plan "prepare for war, prepare against famine, for the people" realized.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 292–293 (May 22, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
