    entry:
      id: cal.1969-04-12.china-leadership
      when: Apr. 12
      date: '1969-04-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai calls the military control commissions and production heads of the National Defense Industry Office and the Ministries of Metallurgy and the First, Third and Seventh Machine Building and sharply criticizes the repeated quality accidents in aircraft production that followed the abolition of reasonable rules: aircraft accidents hurt war preparation, aid abroad and safety; "you came from the Air Force, how can you be so careless of comrades'' lives?" Plant 410 abolished its inspection system, and they must be told at once to restore it, not "gradually"; unreasonable rules are to be changed and reasonable ones kept, abolishing all is not Mao Zedong Thought and not respect for science, and some who want to smash every system hold an ultra-left trend. The northwest, southwest and northeast are to be inspected. Over twenty years Mao''s red line has been the main thing and all is not to be denied, or industry could not have grown.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 286 (Apr. 12, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
