      c: 'Zhou Enlai, on the report that He Sijing, former Party committee member of Renmin University and chairman of its law and philosophy departments, a first-rank professor, was beaten to death, writes Xie Fuzhi: such deaths by beating, whether suicide or killing to silence, are most at Renmin; he proposes that the Ministry of Public Security tell the Peking Public Security Bureau''s military control commission to set up a special office to trace such cases to the bottom, else any mass organization may arrest, question, beat and kill while the organs of dictatorship ignore it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 239–240 (July 10, 1968). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi.'
