      date: '1968-03-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting hears Hunan. The Hunan preparatory group''s report asking to set up the provincial revolutionary committee had quoted Mao''s and Zhou''s instructions on Hunan; Zhou struck the passages on himself. Jiang Qing says she has had no hand in Hunan, nor would others let her; they have no revolutionary leaders in their eyes, only conservative ones; do not call it a revolutionary committee, call it the old conservatives turning the sky. Zhou sets her interruptions aside, goes on discussing the Hunan report and reports the result to Mao. The Hunan committee is approved Apr. 6.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 223 (Mar. 30, 1968). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Mao Zedong.'
