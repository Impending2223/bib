      when: Sept. 27
      date: '1968-09-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai instructs the Xinhua general agency: bourgeois papers live on rumor, but the serious ones attend to fact, and proletarian papers should the more.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 255–256 (Sept. 27, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-28.china-leadership
      when: Sept. 28
      date: '1968-09-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the overturning of 21 oil tank cars at Baita station, Inner Mongolia, writes Wu Faxian, Xie Fuzhi, Wen Yucheng, Zheng Weishan and Yang Jie: the railways near Peking have had three accidents in September; workers, suburban poor and lower-middle peasants, PLA men, students, staff, cadres and organized street residents are to be roused to raise vigilance a hundredfold against hidden enemies'' sabotage, each to see that his own post makes no error. He proposes that the Military Commission''s Office Group send a telephone notice to every military region to take the same steps and see that National Day passes safely.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 256 (Sept. 28, 1968). Made public: 2020. Names: Zhou Enlai, Wu Faxian, Xie Fuzhi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:wu-faxian
      - name:xie-fuzhi
      - vis:only:prc
- add:
    entry:
