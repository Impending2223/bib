      date: '1968-02-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, learning that the delegates of Yunnan's two factions in Peking have agreed to stop armed fights, restore transport and keep post and telegraph clear, tells the Cultural Revolution Group's liaison members to receive both delegations and the Kunming Military Region's people in Peking that night.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 214 (Feb. 13, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
