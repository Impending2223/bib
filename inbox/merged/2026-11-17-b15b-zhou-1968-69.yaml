      date: '1969-09-30'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai speaks at the reception for the 20th anniversary of the People''s Republic: in twenty years the socialist revolution and building in China, under the Communist Party, has won victory after victory; the motherland has been changed from a poor, backward, bullied, semi-feudal, semi-colonial country into a socialist country that keeps its independence and has gained a first prosperity.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Sept. 30, 1969). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
