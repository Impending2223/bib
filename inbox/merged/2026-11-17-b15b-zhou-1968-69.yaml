      date: '1969-02-01'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai presides over the farewell ceremony for Li Zongren.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Feb. 1, 1969). See [[cal.1969-01-31.china-leadership]]. Names: Zhou Enlai.'
