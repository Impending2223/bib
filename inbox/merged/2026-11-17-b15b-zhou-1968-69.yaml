      when: Apr. 30
      date: '1968-04-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai receives Shaanxi's delegation in Peking and urges that organizations cutting across trades be dropped, factionalism that blocks union and production be done away with, great alliance advanced and the rail and coal output raised. Yao Wenyuan reads the Center's instruction on setting up the Shaanxi revolutionary committee.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 226 (Apr. 30, 1968). Made public: 2020. Names: Zhou Enlai, Yao Wenyuan.'
