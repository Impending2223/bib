      c: 'Zhou Enlai at the reception of the delegates of Sichuan''s congress in Peking: after the Center''s instruction approving Sichuan''s revolutionary committee is announced, he says Sichuan is the homeland''s great rear; Third Front building is almost stopped in many places because the two factions'' fights hit production. Sichuan''s strategic place is very important in farming, industry, defense industry, transport and the Third Front.'
