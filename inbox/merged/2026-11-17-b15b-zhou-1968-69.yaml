      c: 'Zhou Enlai to Chen Xilian, on the Northeast Bureau organs'' and mass organizations'' demand that Gu Zhuoxin and Yu Ping be seized from Peking and brought to Shenyang for struggle: at the liaison meeting on the evening of Mar. 22 all agreed to hand them to the Bureau organs and mass organizations to take to Shenyang, but they must be told there is to be no armed struggle or interrogation, and if they cannot guard them after each session, the military region is to take custody.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 222 (Mar. 24, 1968). Made public: 2020. Names: Zhou Enlai, Chen Xilian.'
