      c: Zhou Enlai, on Peking Foreign Languages Institute students sent down to a PLA farm and given only an hour a day for foreign language, rules that an hour is not enough, in fact it is half an hour; art students spend four hours a day on basic skill, foreign-language students need at least three or the language is lost. He has the Foreign Ministry send the farm a notice to assure three hours a day, and later gives several more specific instructions on foreign-language students on farms and on translators in cadre schools. The nianpu notes that this year the Center decided to send graduates of the foreign-language institutes and students back from abroad to PLA farms to work and be tempered.
