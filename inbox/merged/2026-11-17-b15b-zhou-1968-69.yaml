      date: '1969-12-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on a bulletin by the Peking Public Security Bureau''s military control commission on Korean nationals living in China, writes: Koreans who ask to return home, if there is no special reason, would best be approved in numbers.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 331 (Dec. 9, 1969). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
