      - china
      c: 'Zhou Enlai, on Li Xiannian''s proposal to buy part of the fertilizer early, the state having more foreign exchange, foreign currency being unstable and foreign fertilizer prices low, agrees and adds: Japanese fertilizer''s landed price is low, and more may be bought.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 30, 1969). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
