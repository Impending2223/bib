      date: '1968-02-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai twice calls Li Xiannian, Yu Qiuli, Su Yu, Luo Shunchu, Qiu Huizuo and others to talk over the 1968 national economic plan.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 217 (Feb. 21, 1968). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Qiu Huizuo.'
