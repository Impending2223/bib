      when: Aug. 30
      date: '1968-08-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai again receives Tibet's delegates and announces the Center's approval of Tibet's revolutionary committee.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 249 (Aug. 30, 1968). Made public: 2020. Names: Zhou Enlai.'
