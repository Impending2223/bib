      thread: china-leadership
      also:
      - africa
      - china
      c: 'Zhou Enlai receives Mali President Keita''s special envoy, Madou Tala (as the nianpu writes the name): on sending students abroad, if the home economy is undeveloped, with few factories, little mechanization and poor working conditions, returned students are the more discontented; China has sent students abroad for nearly a hundred years with painful lessons; one who learns much abroad and cannot use it at home will worship foreigners and despise his own.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 243–244 (July 25, 1968). Made public: 2020. Names: Zhou Enlai. Check: the envoy''s name.'
      tags:
      - polity:prc
      - polity:mali
      - name:zhou-enlai
      - vis:only:prc+mali
