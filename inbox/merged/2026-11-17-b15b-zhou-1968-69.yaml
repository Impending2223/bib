    entry:
      id: cal.1969-01-14.china-leadership
      when: Jan. 14
      date: '1969-01-14'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai to Mao, Lin Biao and the Cultural Revolution Group''s liaison meeting, by letter: on Dec. 13 Mao told him to talk with the finance, banking and commerce departments on rural trade run by the poor and lower-middle peasants. All agree that rural supply and marketing and credit cooperatives go down to the communes and teams under the poor and lower-middle peasants, that rural purchasing runs through commune and team service stations, and that state commerce keeps only wholesale and purchase stations and state shops in county towns and cities.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 270 (Jan. 14, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
