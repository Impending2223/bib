      when: Apr. 26–27
      date: '1968-04-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai attends the Cultural Revolution Group's liaison meetings of Apr. 26 and 27; the 27th takes up Sichuan.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 226 (Apr. 26, 1968). Made public: 2020. Names: Zhou Enlai.'
