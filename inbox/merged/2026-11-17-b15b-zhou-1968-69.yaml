      c: Zhou Enlai, on the Vietnamese Foreign Trade Ministry's request for another urgent 1.2 million doses of plague vaccine, plague still spreading in Vietnam's newly liberated areas, tells Qiu Huizuo to call the units concerned at once to settle it, with Li Qiang and civil aviation to take part, meet the request as far as possible and deliver on schedule.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 220 (Mar. 13, 1968). Made public: 2020. Names: Zhou Enlai, Qiu Huizuo.'
