      when: Feb. 18
      date: '1968-02-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - vietnam-hanoi
      c: 'Zhou Enlai revises the Center, State Council, Military Commission and Cultural Revolution Group''s urgent supplementary order. To keep aid transport to Vietnam clear: (1) inciting fire on trains, disorder at stations and ports, fights among rail workers, and beating and kidnapping military control men is counterrevolutionary banditry, to be dealt with by the Feb. 6 order; (2) rail and port workers hold their posts, no late arrival or early leaving, pay docked for unexplained absence; (3) military control men, line-guard troops and garrisons stop linking up and fights, and apply the Feb. 6 order if they fail; (4) the Center sends supervising groups at once to the main stations and ports.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 216–217 (Feb. 18, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
