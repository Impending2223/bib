      when: Mar. 26
      date: '1969-03-26'
      thread: china-leadership
      also:
      - middle-east
      - china
      c: 'Zhou Enlai receives the delegation of the Palestinian Fatah: any nation that wants independence must rely on itself; independence, self-reliance and hard struggle hold for large and small nations alike and are the decisive thing; independence not fought for by the nation itself is not dependable and is dangerous; in the twentieth century many countries show that where the leaders look to foreign aid the people suffer.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 282 (Mar. 26, 1969). Made public: 2020. Names: Zhou Enlai. Check: no Palestinian polity in the series'' list.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
