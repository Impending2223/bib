    entry:
      id: cal.1968-05-04.china-leadership
      when: May 4
      date: '1968-05-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, at dawn, receives the National Defense Science and Technology Commission''s delegates, whose congress of activists in studying Mao''s works is to meet that day: (1) it should go well under the Commission''s leadership, with no armed fights; (2) its outcome should serve grasping revolution, promoting production and business; (3) defense production and research units are not to link up with the schools, each to do its own struggle-criticism-reform; (4) no leaking of secrets. The third year of the Cultural Revolution has begun; having settled the provinces, they turn to the state organs'' ministries; revolution and production go together.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 227 (May 4, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-06.china-leadership
      when: May 6
      date: '1968-05-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, on learning that Guangxi mass organizations took over 7,000 guns and over 1.2 million rounds from the Military District's arsenal at Changgangling, Nanning, wires the Guangxi preparatory group and Military District that Wei Guoqing is to call the organization's people at once and make them return the arms and ammunition within 24 hours. On May 12 Liuzhou organizations seize over 300 guns and 10,000 rounds from a PLA unit there; the same day a Military District head summons the leaders of the Guangxi gun-seizing groups and repeats Zhou's order.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 227–228 (May 6, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-06.china-leadership-2
      when: May 6
      date: '1968-05-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai has his secretary ask Yu Qiuli about output at Ningxia's Shizuishan coal mine.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 228 (May 6, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-06.china-leadership-3
      when: May 6
      date: '1968-05-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai talks with Wang Xiaoyu and Yang Dezhi and, on their draft report on the Xuzhou and Haizhou question, writes Zhao Jun and Liang Jiwei of the Jiangsu Military District: five points in it bear on the District and the provincial revolutionary committee; they are to call the District''s standing committee members in the study class and the people of the Xuzhou-Haizhou sub-districts and armed forces departments and give their views in writing, for discussion at tomorrow night''s liaison meeting, then Xu Shiyou''s view, then the Center. The report proposes dissolving the "Northern Jiangsu Joint Committee" at Guanyun, a cross-province, cross-trade secret body and a main source of the long fighting at Lianyungang, handing Xu-Hai''s farm, industrial and civil affairs to the Jiangsu committee, and relieving the Xuzhou sub-district and the eight counties'' armed forces departments of the support-the-left task.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 228 (May 6, 1968). Made public: 2020. Names: Zhou Enlai, Xu Shiyou.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:xu-shiyou
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-06.china-leadership-4
      when: May 6
      date: '1968-05-06'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, answering Li Fuchun and Li Xiannian on whether the foreign-dealing units of the Ministry of Communications'' ports and other departments are to use their revolutionary committees'' names or the old: outward dealings are all to use the old names, with no documents issued or signed in the committees'' names.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 228 (May 6, 1968). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-07.china-leadership
      when: May 7
      date: '1968-05-07'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam-paris
      c: 'Zhou Enlai to Xuân Thủy, Vietnam''s Foreign Minister: Korea''s talks were not like Vietnam''s; that was half of Korea, this is the unification of Vietnam, half of Vietnam being fourteen years old. After recounting the Korean negotiations: they produced only an armistice and no other political agreement; the basic point is that what is not won on the battlefield cannot be won at the table. The Americans and South Vietnam have a million troops; unless their backbone is broken, or five or six of ten fingers, they will not admit defeat or leave.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 228–229 (May 7, 1968). Made public: 2020. Names: Zhou Enlai, Xuân Thủy.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - name:xuan-thuy
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1968-05-08.china-leadership-2
      when: May 8
      date: '1968-05-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai with Mao at the reception of the PLA commanders and fighters, local cadres and mass delegates in Peking''s Mao Zedong Thought study classes and the delegates to the national railway and communications conference.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 229 (May 8, 1968). Made public: 2020. See [[cal.1968-05-08.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-09.china-leadership
      when: May 9
      date: '1968-05-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai with the Cultural Revolution Group''s liaison members receives Liaoning''s delegates: dropping cross-trade organizations is a pressing task for Liaoning, organizational, political and a task of grasping revolution and promoting production; the Northeast''s three provinces'' output is crucial, above all rail and coal.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 229 (May 9, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-11.china-leadership-2
      when: May 11
      date: '1968-05-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai to Chen Boda, Kang Sheng, Jiang Qing and Zhang Chunqiao, on the Heilongjiang revolutionary committee''s request to name Song Renqiong in the papers and seize him back to Harbin for struggle: he will telephone that for now he is not to be named in the press or brought back to the Northeast; "back-to-back" struggle may go on. Earlier he had asked Mao whether the Center''s instruction approving the Liaoning committee should name Song Renqiong, Ouyang Qin and Huang Huoqing; Mao: leave room, no names.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 229 (May 11, 1968). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - name:zhang-chunqiao
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-11.china-leadership-3
      when: May 11
      date: '1968-05-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai tells Li Xiannian, Wen Yucheng, Yang Jie and the Railway Ministry''s military representatives to meet and go over the national railway and communications conference''s papers: criticism by name in them is to be fitting, taking the lesson of Liu Peishan''s suicide; a short outline may be written setting out the questions that need the Center''s position.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 229–230 (May 11, 1968). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-12.china-leadership
      when: May 12
      date: '1968-05-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the Taiyuan Heavy Machinery Plant''s mass organization robbing banks twice, in the plant revolutionary committee''s name, of 1.64 million yuan, instructs Shanxi''s committee and Liu Geping, Zhang Riqing and Xie Zhenhua: the province''s committee is first to order the plant''s committee to have the masses return both sums and hand in arms; if not by the deadline, announce that the plant committee disobeys, put the plant under military control and reorganize the committee. Use this wholly illegal act to rouse the masses step by step to act as masters, tidy ranks and find bad people, not by administrative order.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 230 (May 12, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-13.china-leadership
      when: May 13
      date: '1968-05-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai calls Li Fuchun, Li Xiannian and Yu Qiuli to talk on railways, coal and the assignment of graduates.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 230 (May 13, 1968). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-14.china-leadership
      when: May 14
      date: '1968-05-14'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on the request of Peking University''s Cultural Revolution committee to hold a meeting on the 16th to struggle against Peng Zhen, Liu Ren, Wan Li, Wu Zimu and Song Shuo: the five cannot be present; the university''s two sides'' armed fights have not stopped, so how can such a meeting be held.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 230 (May 14, 1968). Made public: 2020. Names: Zhou Enlai, Peng Zhen.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-15.china-leadership
      when: May 15–18
      date: '1968-05-15'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai attends the Cultural Revolution Group's liaison meetings daily. On May 15, hearing Jiangxi's revolutionary committee, he finds its work good and has the Xinhua Jiangxi branch write a general report on grasping revolution and promoting production there and a special one on Pingxiang coal mine's record of 5,560 tons a day, to spur other provinces; the meeting also agrees that Liu Junxiu, Bai Dongcai and Huang Zhizhen return to work in Jiangxi.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 230–231 (May 15, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
