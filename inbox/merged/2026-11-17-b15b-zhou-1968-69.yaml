      when: Sept. 26
      date: '1969-09-26'
      thread: china-leadership
      also:
      - soviet-union
      - china
      c: 'Kosygin, replying to Zhou''s letter of Sept. 18, says the Soviet side has taken practical steps to normalize the border on the assumption that China will take like measures, appoints a delegation under Kuznetsov for talks and proposes that boundary talks begin in Peking from Oct. 10. On Sept. 29 Qiao Guanhua, in an "oral notice", approved by Zhou, to the Soviet chargé Yelizavetin: Kosygin''s letter is being studied, the talks are put off to begin Oct. 20, and the Soviet statement of June 13 will be answered publicly after National Day. On Oct. 14 Kosygin writes again that the delegation will reach Peking before Oct. 20.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 317 (Sept. 26, 1969). Made public: 2020. See [[cal.1969-09-17.china-leadership]]. Names: Zhou Enlai, Kosygin.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:kosygin-aleksei
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1969-09-27.china-leadership
      when: Sept. 27
      date: '1969-09-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'The Center issues its instruction on Wuhan, whose problem has not been settled since the Center''s May meeting: the Center''s May 27 instruction, the July 23 notice and the Aug. 28 order must be carried out in all Hubei and all Wuhan firmly, unconditionally and in full; revolution is to be grasped and production pressed, labor discipline kept and anarchism opposed; proletarian Party spirit is to be strengthened and bourgeois factionalism overcome, all factional bodies of sects and mountaintops opposed; and the Center decides to open Mao Zedong Thought study classes in Peking for Hubei and Wuhan.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 317 (Sept. 27, 1969). Made public: 2020. Names: Zhou Enlai. Check: the day it was issued.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
