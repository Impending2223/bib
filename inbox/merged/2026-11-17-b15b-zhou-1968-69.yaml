- add:
    entry:
      id: cal.1968-01-03.china-leadership
      when: Jan. 3
      date: '1968-01-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, to the delegates to the national public health work conference: the one great problem is medicine and medicinal materials, unsolved. Drugs are few, fewer in the countryside; plain drugs are to be made for the countryside, not only costly ones.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 207 (Jan. 3, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-04.china-leadership
      when: Jan. 4
      date: '1968-01-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai has his secretary telephone Wei Guoqing: find out more on the "Red Iron Army" and its harm to Liuzhou; if true, the local garrison may surround it, open a political offensive and make it hand over its arms and its bad leaders, but no firing.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 207 (Jan. 4, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-05.china-leadership
      when: Jan. 5–11
      date: '1968-01-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai attends and speaks at the national railway system's "grasp revolution, promote production" conference, Peking; each railway bureau and branch reaches an agreement on revolutionary great alliance. The conference closes Jan. 11.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 207–208 (Jan. 5, 1968). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1968-01-05.china-leadership-2
      when: Jan. 5
      date: '1968-01-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting: the draft notices on strengthening market control and striking speculation and on opposing counterrevolutionary economism, the decision on investigation trips outside, and Mao''s instructions on health work.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 208 (Jan. 5, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-06.china-leadership-2
      when: Jan. 6
      date: '1968-01-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai convenes the State Council business group: this year''s national economic plan, coal output, the defense industry''s plan and the defense budget, the "three-in-one" leadership of the Second Ministry of Machine Building and study classes in several advanced factories, rail transport.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 208 (Jan. 6, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-08.china-leadership
      when: Jan. 8
      date: '1968-01-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, commenting on the Shenyang and other railway bureaus'' alliance agreements, adds: rail transport bears directly on the national economy and livelihood and on defense, war preparation and aid abroad; all are to obey the decision on full military control of the railways and break off ties with and subordination to local mass organizations.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 208 (Jan. 8, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-08.china-leadership-2
      when: Jan. 8–9
      date: '1968-01-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai talks with Du Ping on Jiangsu's problems.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 208 (Jan. 8, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-10.china-leadership
      when: Jan. 10
      date: '1968-01-10'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai twice instructs on the looting of arms depots in Shaanxi, and orders the Shaanxi Military District's commander to report details and the handling.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 208 (Jan. 10, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-10.china-leadership-2
      when: Jan. 10
      date: '1968-01-10'
      thread: china-leadership
      c: 'Zhou Enlai to Jiang Qing, by letter: the materials on the "Wu Hao notice" are photographed and filed. In 1931 and 1932 anyone who knew Shanghai politics and the Communist movement knew it forged; he told it in full at the 1943 Yan''an rectification and a Central forum that year. He will tell it again at a small liaison meeting, have it recorded and put in the Central archive. In Oct. and Dec. 1967 he had filed photographs of the newspaper with the forged notice and of his May 19, 1967 letter to Mao with Mao''s comment.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 208 (Jan. 10, 1968). Made public: 2020. To check: the letter''s text in the Central archive. Names: Zhou Enlai, Jiang Qing, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:jiang-qing
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-10.china-leadership-3
      when: Jan. 10
      date: '1968-01-10'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai has his secretary telephone Tan Furen, for the heads of the Hunan study classes: no one in any class, army or local, of whatever faction, is to seize another; violators are to be investigated, to protect personal safety.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 208 (Jan. 10, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-11.china-leadership
      when: Jan. 11
      date: '1968-01-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai revises the Center, State Council, Military Commission and Cultural Revolution Group''s notice on the railway bureaus'' alliance agreements and sends it to Mao. His marginal note: to settle this year, first on the railways, the matter on which grasping revolution and promoting production nationwide turns; a Central directive is drafted and passed by the Group''s enlarged liaison meeting. Mao circles it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 208–209 (Jan. 11, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-11.china-leadership-2
      when: Jan. 11
      date: '1968-01-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai to Mao, by letter: health work has lately been put in the hands of the Military Commission''s General Rear Services Department and the Ministry of Health; over a hundred met on disease prevention and decided to put the weight of medical work on the countryside, with small complete medical teams by commune, itinerant treatment and education.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 209 (Jan. 11, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-13.china-leadership
      when: Jan. 13
      date: '1968-01-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai receives all the delegates to the railway conference.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 208 (Jan. 13, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-13.china-leadership-2
      when: Jan. 13
      date: '1968-01-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives Yunnan delegates and criticizes the saying that the 13th and 14th Armies are the poison left by Bo Yibo: wrong. The army too is to drop factionalism, not join or link up with local mass organizations, and keep its own stability; to avoid factional ties, the families of army leaders are not to join local mass organizations.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 209 (Jan. 13, 1968). Made public: 2020. Names: Zhou Enlai, Bo Yibo.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
      - name:bo-yibo
- add:
    entry:
      id: cal.1968-01-17.china-leadership
      when: Jan. 17
      date: '1968-01-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives representatives of the defense-industry ministries and criticizes their rebels'' zeal for factionalism, heedless of production: "uneasy, uneasy, uneasy"; defense production stopped by factional fights; destroying equipment and production is, strictly, counterrevolutionary. Production and research units are to cut their ties with other sectors of society; a large batch of cadres is to be freed on the basis of great alliance; "grasp revolution, promote production" is the foremost slogan.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 209–210 (Jan. 17, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-17.china-leadership-2
      when: Jan. 17
      date: '1968-01-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai at the Central Case Group, on the line for trying cases: forced confession is a wrong line; "kill none, arrest few" still holds; do not trust confessions, weigh evidence and corroboration; hold those who erred to strict account yet keep unity; leniency for confession, severity for resistance; win them to confess of themselves, not under compulsion.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 210 (Jan. 17, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-18.china-leadership
      when: Jan. 18–19
      date: '1968-01-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, before dawn on Jan. 18, receives in turn the Jiangsu army representatives, the Zhejiang "Red Rebel" delegates and Hunan's cadres; before dawn on the 19th he talks with the members of the Hunan preparatory group.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 210 (Jan. 18, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-20.china-leadership
      when: Jan. 20, 27
      date: '1968-01-20'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai convenes the State Council business group.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 210 (Jan. 20, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-22.china-leadership
      when: Jan. 22
      date: '1968-01-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, before dawn, telephones the Guangdong rebel leaders and orders the meeting set for Jan. 22 to mark the first anniversary of Guangdong''s "seizure of power" cancelled: its direction is wrong, they are not to wreck Guangdong''s good situation; the ultra-left trend of Hunan''s "Sheng Wulian" is reactionary and to be criticized, and they are not to be taken in by it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 210 (Jan. 22, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-22.china-leadership-2
      when: Jan. 22–28
      date: '1968-01-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai attends the Cultural Revolution Group's liaison meetings every day but the 25th, settling the problems of Guangdong, Hebei, Gansu, Henan, Hunan, Liaoning, Jilin and Jiangsu.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 210 (Jan. 22, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-23.china-leadership
      when: Jan. 23
      date: '1968-01-23'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai has his secretary wire the Guangdong preparatory group: no mass organization is to hold a meeting on its own; they are to educate the masses to resist bourgeois factionalism, bring about great alliance and turn as one on the enemy.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 210 (Jan. 23, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-24.china-leadership
      when: Jan. 24
      date: '1968-01-24'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai receives the whole Hunan study class and the members of the Hunan preparatory group and repeats that the ultra-left trend of the Hunan "Sheng Wulian" is to be criticized. At midnight on the 26th he talks with the members of the Hunan preparatory group.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 210 (Jan. 24, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-26.china-leadership
      when: Jan. 26
      date: '1968-01-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai receives delegates of Liaoning and Jilin and criticizes the wrecking of the state's production equipment by armed fights and factionalism, halting production; he enjoins them to put the whole first, overcome factionalism, strengthen Party spirit and achieve great alliance. Before the reception he spoke with Chen Xilian and Song Renqiong.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 211 (Jan. 26, 1968). Made public: 2020. Names: Zhou Enlai, Chen Xilian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-xilian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-28.china-leadership
      when: Jan. 28
      date: '1968-01-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai receives army and local mass organization delegates of Jiangsu: cadres are to be freed, and leading cadres must be in the three-in-one. Reading and explaining the Center''s instruction on the Nanjing Military Region Party committee''s self-criticism, he says the Center trusts the Region; Xu Shiyou is a tested comrade with great merit in the revolutionary, anti-Japanese and liberation wars. The army''s work in support of industry and agriculture is the main thing; where its support of the left erred, it has corrected, and the Center agrees.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 211 (Jan. 28, 1968). Made public: 2020. Names: Zhou Enlai, Xu Shiyou.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:xu-shiyou
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-29.china-leadership
      when: Jan. 29
      date: '1968-01-29'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: Zhou Enlai visits Hồ Chí Minh.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 211 (Jan. 29, 1968). Made public: 2020. Names: Zhou Enlai, Hồ Chí Minh.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - name:ho-chi-minh
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1968-01-31.china-leadership
      when: Jan. 31
      date: '1968-01-31'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai has his secretary telephone Wei Guoqing: Guangxi mass organizations have lain on the rails to stop a PLA unit stationed at Nanning from moving; Wei is to work on them and explain that they may not interfere with troop movements, that the act violates the Sept. 5 order, hinders war preparation and is not allowed by military discipline and the law.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 211 (Jan. 31, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-02.china-leadership
      when: Feb. 2
      date: '1968-02-02'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai speaks to the representatives'' meeting of the industry and communications, finance and trade, and agriculture and forestry ministries and State Council units: ministries are to achieve great alliance, promote three-in-one and take up their business work. Last year the task was setting up local provisional organs of power, the revolutionary committees; now it is the State Council''s ministries. At this stage the two-line struggle is the struggle of public against private, Party spirit against factionalism; cadres must be freed for three-in-one; business teams to be formed in February.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 211–212 (Feb. 2, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-03.china-leadership
      when: Feb. 3
      date: '1968-02-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai has his secretary obtain the coal output bulletins of the last few days.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 212 (Feb. 3, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-03.china-leadership-2
      when: Feb. 3
      date: '1968-02-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai convenes the State Council business group on the Liujiaxia hydroelectric station, whose gates leak so badly the reservoir cannot fill. Before the meeting he asks the Water and Power Ministry's military control commission whether some ministers besides the military representatives may attend.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 212 (Feb. 3, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-04.china-leadership-2
      when: Feb. 4
      date: '1968-02-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'On the Railway Ministry''s military control commission''s report of the grave stoppage of rail traffic in the Xuzhou area, Zhou Enlai at once convenes a liaison meeting and fixes measures, then writes Mao with the report: damage is worst on the cross of Xuzhou, Bengbu, Zhengzhou and Lianyungang, next on the Hengyang, Liuzhou and Guangzhou triangle, then on Kunming and Chengdu in the southwest. The wrecking of lines and bridges is past factionalism, done by counterrevolutionaries and agents mixed into one or both factions. The Jinan Military Region is first to move mobile forces to close on them along the line, combining political attack with military encirclement until they lay down all arms; ringleaders are then to be treated apart from those coerced; a local proclamation is to declare the sabotage counterrevolutionary and subject to dictatorship, to take effect that night, ahead of the national order.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 212–213 (Feb. 4, 1968). Made public: 2020. To check: the letter in the Central archive. See [[cal.1968-02-04.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-05.china-leadership
      when: Feb. 5
      date: '1968-02-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Zhou Enlai, after talking with Nan Ping, Chen Liyun and others on Zhejiang's problems, talks separately with the delegates of Zhejiang's "Hongbao" and "Lianzong" factions.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 213 (Feb. 5, 1968). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-06.china-leadership
      when: Feb. 6
      date: '1968-02-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'The Center, the State Council, the Military Commission and the Cultural Revolution Group issue an order: the few bad ringleaders who incite, manipulate and direct the wrecking of railways, the blowing up of bridges, firing on trains, killing and robbing of goods are counterrevolutionaries, to be firmly suppressed and prosecuted.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 213 (Feb. 6, 1968). Made public: 2020. See [[cal.1968-02-04.china-leadership]]. Names: Zhou Enlai. Check: whether the order was printed at the time.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-07.china-leadership-2
      when: Feb. 7
      date: '1968-02-07'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: 'Zhou Enlai, in his talk with Hồ Chí Minh after the meeting with Mao: at this stage of the war in Vietnam, might one to three field corps be organized, each of 30,000 to 40,000 men, striving to destroy whole units of four or five thousand in each battle; they should fight far from home, in this war zone or another. Against isolated enemy, approach by tunnel and fight at night and close, so that aircraft and artillery lose their effect; tunnels dug at three or four points to carry troops and ammunition; some force also to hit the enemy''s reinforcements.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 213 (Feb. 7, 1968). Made public: 2020. See [[cal.1968-02-07.china-leadership]]. Names: Zhou Enlai, Hồ Chí Minh, Mao Zedong. Check: the Vietnamese record.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - name:ho-chi-minh
      - name:mao-zedong
      - vis:only:prc+drv
- add:
    entry:
