      when: Feb. 12
      date: '1968-02-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Zhou Enlai, on whether thirteen former provincial, municipal and regional leaders at the Central direct organs'' guesthouse should join study classes: Yang Chengwu and Wu Faxian are to consider which classes suit each.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 214 (Feb. 12, 1968). Made public: 2020. Names: Zhou Enlai, Wu Faxian.'
