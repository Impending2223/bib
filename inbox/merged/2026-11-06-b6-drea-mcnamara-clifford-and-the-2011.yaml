by: 'Claude (batch 6: the private, social and draft rows re-ruled under R18 as amended Nov. 6, 2026; Drea, McNamara, Clifford,
  and the Burdens of Vietnam), Nov. 10, 2026'
ops:
- add:
    entry:
      id: cal.1968-08-05.soviet-union-czechoslovakia
      when: Aug. 5
      date: '1968-08-05'
      thread: soviet-union-czechoslovakia
      also:
      - defense
      c: 'Clifford, relieved, thinks the Czechoslovak crisis past, the Soviets seeming to pull back from military action.
        Wheeler, less sanguine: the Soviets have moved large numbers of men and equipment undetected by American intelligence,
        and those forces could overrun Czechoslovakia in 48 hours.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 497 & n.44. To check: Elsey, notes of the Secretary of Defense''s morning
        staff conference, Aug. 5, 1968, Elsey Papers, LBJ Library; Nitze, staff meeting notes, Aug. 3, 1968, Nitze Papers,
        Library of Congress (both cited by [[w.drea-mcnamara-clifford-and-the-2011]], 497 n.44). Check: the day and the meeting
        of Wheeler''s remark; the note cites Elsey''s notes of Aug. 5 and Nitze''s of Aug. 3. Names: Clifford, Wheeler.'
      src:
        c: eb2df80f
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 497: all'
        - 'via x.1968-08-05.elsey-notes-secdef-morning-staff-conference: A'
        - 'via x.1968-08-03.nitze-staff-meeting-notes: B'
