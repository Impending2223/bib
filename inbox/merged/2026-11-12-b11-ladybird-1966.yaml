      when: Aug. 20
      date: '1966-08-20'
      thread: vietnam-support
      c: 'Manchester, N.H. Johnson to the Navy League''s luncheon on Vietnam: "Perhaps it reflects poorly on our world that men must fight limited wars in order to keep from fighting larger wars; but that may be the condition that exists today." He introduces a young soldier back wounded.'
      n: '[[w.johnson-white-house-diary]], 413 (Lady Bird Johnson''s account). To check: the Public Papers, remarks to the Navy League, Aug. 20, 1966. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
