      when: Sept. 5
      date: '1966-09-05'
      thread: elections-1966
      also:
      - vietnam-support
      c: Dayton, Ohio, the Montgomery County Fair Grounds, a week after racial unrest that called out the Guard. Governor Rhodes, Congressman Rodney Love and Senator Frank Lausche with Johnson. He speaks on youth and public service; a banner, "Thou Shalt Not Kill," about thirty-five in the group, scuffling, police link arms.
      n: '[[w.johnson-white-house-diary]], 420 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at Dayton, Sept. 5, 1966. Names: Johnson, Rhodes, Lausche.'
      tags:
      - name:johnson-lyndon-b
