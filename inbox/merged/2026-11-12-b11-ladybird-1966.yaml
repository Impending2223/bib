    entry:
      id: cal.1966-08-20.program
      when: Aug. 20
      date: '1966-08-20'
      thread: program
      c: Portland, Me. At the State Pier at 8, an hour and a half late, Johnson boards the USS Northampton and invites all the Senators and Governors of the day aboard for dinner; Mrs. Johnson and James Symington send the invitations and seat two long tables; lobster.
      n: '[[w.johnson-white-house-diary]], 414 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
