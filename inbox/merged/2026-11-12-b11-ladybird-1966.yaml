      when: July 23
      date: '1966-07-23'
      thread: vietnam-support
      c: 'George Rogers Clark National Historical Park, Vincennes, Ind. Johnson to forty thousand on Vietnam: "Stop, look, and listen as you hear the voices talking about what''s wrong with your country." He had not heard many commentators lecture the enemy on the North Vietnamese bombing of hospitals for American servicemen in South Vietnam.'
      n: '[[w.johnson-white-house-diary]], 398 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at Vincennes, July 23, 1966. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:in
- add:
    entry:
      id: cal.1966-07-23.vietnam-support-4
      when: July 23
      date: '1966-07-23'
      thread: vietnam-support
      c: 'Lawrenceville, Ill. Johnson''s airport rally: thousands of people, "in this heartland of America that''s not supposed to be our territory." One sign, "President Goldwater."'
      n: '[[w.johnson-white-house-diary]], 397 (Lady Bird Johnson''s account). Mrs. Johnson says "I believe" of the sign. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
