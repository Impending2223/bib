      when: June 28
      date: '1966-06-28'
      thread: conservation
      c: 'The White House. A beautification awards ceremony: plaques to winners in three categories, commercial, public and neighborhood. Mrs. Johnson: "Using the White House as a podium—hopefully—to thank, to applaud, to advertise, to rally citizens to action in improving our environment."'
      n: '[[w.johnson-white-house-diary]], 390 (Lady Bird Johnson''s account).'
