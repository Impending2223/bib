      when: Nov. 17
      date: '1966-11-17'
      thread: economy
      c: 'Bethesda Naval Hospital. Johnson in bed meets the "big four" of fiscal and budgetary matters: Fowler, Schultze, Okun and William McChesney Martin.'
      n: '[[w.johnson-white-house-diary]], 454 (Lady Bird Johnson''s account). The subjects are not given. Names: Johnson, Fowler, Schultze, Okun, Martin.'
      tags:
      - name:johnson-lyndon-b
      - name:fowler-henry-h
      - name:schultze-charles-l
      - name:okun-arthur-m
