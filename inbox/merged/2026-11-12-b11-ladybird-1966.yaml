      when: Sept. 1
      date: '1966-09-01'
      thread: economy-investment-credit
      c: 'The White House, near 11 p.m. Johnson in his office with about a half-dozen men, Carl Albert, "looking very weary," and Califano among them. Albert: he "didn''t see how Lyndon could do it." Mrs. Johnson gets Albert, Califano and Johnson to sit down to supper just before midnight.'
      n: '[[w.johnson-white-house-diary]], 418 (Lady Bird Johnson''s account). The others are not named. Made public: 1970. Names: Johnson, Albert, Califano.'
