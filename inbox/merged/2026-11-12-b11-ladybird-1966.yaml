      when: July 13
      date: '1966-07-13'
      thread: program
      c: Navy Yard, Washington. Johnson at the commissioning of the Oceanographer, the floating laboratory for a six-month world tour; he invites eleven nations, the Soviet Union among them, to put scientists aboard; one aim is marine food. Hornig, the Science Adviser, and the Secretary of Commerce there.
      n: '[[w.johnson-white-house-diary]], 391–92 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at the commissioning, July 13, 1966. Names: Johnson, Hornig.'
