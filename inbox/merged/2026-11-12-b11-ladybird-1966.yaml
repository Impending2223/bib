- add:
    entry:
      id: cal.1966-11-17.press-and-broadcasting
      when: Nov. 17
      date: '1966-11-17'
      thread: press-and-broadcasting
      c: 'Bethesda Naval Hospital, the big conference room, the Johnsons'' thirty-second wedding anniversary. A cake from the White House kitchen reading "32 happy years," newswomen (Helen Thomas, Frances Lewine, Isabelle Shelton, Nancy Dickerson and others), a dozen photographers, staff and the Humphreys. Humphrey proposes a toast in coffee; Dickerson answers for the press. Johnson refuses cake: "Make mine tapioca."'
      n: '[[w.johnson-white-house-diary]], 454–55 (Lady Bird Johnson''s account). Names: Johnson, Humphrey.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1966-11-17.succession
      when: Nov. 17
      date: '1966-11-17'
      thread: succession
      c: Bethesda Naval Hospital. Eisenhower visits Johnson, forty-five minutes.
      n: '[[w.johnson-white-house-diary]], 454 (Lady Bird Johnson''s account). Names: Eisenhower, Johnson.'
      tags:
      - name:eisenhower-dwight-d
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-11-28.white-house
      when: Nov. 28
      date: '1966-11-28'
      thread: white-house
      c: 'The White House, the East Room. Mrs. Johnson launches *The Living White House*: Melville Bell Grosvenor of the National Geographic Society and David Finley of the White House Historical Association speak; Bruce Catton wrote the foreword. Descendants of Presidents in the receiving line with Mrs. Eisenhower: Grant, Harrison, Taft, Cleveland, Madison and Monroe, Roosevelt; veteran reporters Bob Allen, Gould Lincoln and Bill White.'
      n: '[[w.johnson-white-house-diary]], 455–58 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-12-01.conservation
      when: Dec. 1
      date: '1966-12-01'
      thread: conservation
      c: New York. Mrs. Johnson, a couple of hours on beautification planning with Laurance Rockefeller, Mary Lasker and other fellow workers.
      n: '[[w.johnson-white-house-diary]], 458 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Laurance Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:rockefeller-laurance-s
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1966-12-01.program
      when: Dec. 1
      date: '1966-12-01'
      thread: program
      c: New York, the Plaza. The National Institute of Social Sciences' awards dinner, for distinguished service to humanity, to Mrs. Johnson, Keith Funston, David Sarnoff, Danny Kaye and Cardinal Spellman. She tells of Sputnik in October 1957 and the Gemini awards in her front yard, 430 satellites in orbit. Spellman to go to Vietnam in two weeks for Christmas.
      n: '[[w.johnson-white-house-diary]], 458–60 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Spellman.'
      tags:
      - name:johnson-lady-bird
      - name:spellman-francis
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1966-12-13.program
      when: Dec. 13
      date: '1966-12-13'
      thread: program
      c: 'The White House, a snowstorm. The Christmas dinner for the National Council on the Arts, twenty-six members, outgoing and incoming. Johnson''s toast: he wants American art enjoyed "at the grass-roots level," as by "the top-hat crowd." Mrs. Johnson sums up the Council''s work: new life in community theaters, sixteen professional theaters, touring dance, opera and ballet groups. Gregory Peck introduces the APA Repertory Company.'
      n: '[[w.johnson-white-house-diary]], 460–62 (Lady Bird Johnson''s account). Johnson''s words as Mrs. Johnson gives them. To check: the Public Papers, the toast, Dec. 13, 1966. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-12-16.vietnam-diplomacy
      when: Dec. 16
      date: '1966-12-16'
      thread: vietnam-diplomacy
      also:
      - vietnam-support
      c: 'The White House, the evening of the Johnsons'' departure for Texas at about 9. Johnson "in serious talk" with Lodge, McNamara, Goldberg, Harriman and the Vice President, whom he brings over from the office. McNamara leaves first: "Margy is waiting for me." The rest dine.'
      n: '[[w.johnson-white-house-diary]], 463–64 (Lady Bird Johnson''s account). The subject is not given. Names: Johnson, Lodge, McNamara, Goldberg, Harriman, Humphrey.'
      tags:
      - name:johnson-lyndon-b
      - name:lodge-henry-cabot
      - name:mcnamara-robert-s
      - name:goldberg-arthur-j
      - name:harriman-w-averell
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1966-12-24.vietnam-support
      when: Dec. 24
      date: '1966-12-24'
      thread: vietnam-support
      c: 'Kelly Air Force Base, San Antonio. Johnson, with Mrs. Johnson, Lynda, Jake Jacobsen and Dr. Burkley, meets an ambulance plane with twenty evacuees from Vietnam, wounded; Congressman Henry Gonzalez there. He goes aboard. A mother: "We just heard last night that he had been hit"; Pfc. Alex Hudson III. The small crowd applauds.'
      n: '[[w.johnson-white-house-diary]], 464–65 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Gonzalez, Jacobsen, Burkley.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:gonzalez-henry-b
      - name:jacobsen-jake
      - name:burkley-george-g
      - state:tx
      - city:san-antonio
- cite:
    id: cal.1966-01.steel
    item: '[[w.johnson-white-house-diary]], 347–48 (Jan. 5, noon: "the papers reported that the steel companies had settled for $2.75 instead of the $5.00 they had demanded"; the diary names neither company nor product; it dates the report, not the settlement)'
    units: '?'
- cite:
    id: cal.1966-01-12.program
    item: '[[w.johnson-white-house-diary]], 351–52 (Mrs. Johnson in the gallery: four-year terms for the House; aid to nations controlling population growth, "the first time a President has declared himself on the birth control issue"; "We must change to master change"; "three hundred private talks for peace in Vietnam" in 1965, no bombs "for twenty days"; about fifty-seven applauses; "almost no participation by the Republicans"; no approval from Russell or McClellan, "scant occasional expression" from Mansfield; she meets Johnson in the Speaker''s office afterward; not the hour or the text beyond these)'
    units: '?'
- cite:
    id: cal.1966-01-17.cities-and-housing
    item: '[[w.johnson-white-house-diary]], 352–53 (Jan. 18, 10 a.m., the East Room: the swearing in of Weaver, "the first Negro member of a President''s Cabinet," and Wood; Roy Wilkins, James Nabrit, Whitney Young, Walter Washington and Louie Martin present; coffee upstairs with the Weavers, the Woods, Young and Martin afterward)'
    units: '?'
- cite:
    id: cal.1966-02-06.vietnam
    item: '[[w.johnson-white-house-diary]], 358–59 (Feb. 5, noon, the Diplomatic Reception Room: Johnson leaves for Hawaii to meet Thieu, Kỳ, the Ambassador and Westmoreland on "the non-military side of pacification and economic development"; Katherine Westmoreland, the General''s daughter, flies out with him; not the arrival)'
    units: '?'
- cite:
    id: cal.1966-02-20.vietnam-2
    item: '[[w.johnson-white-house-diary]], 361 (Bundy on television "precise, razor sharp"; his quotations from President Kennedy on similar situations in Communist-infiltrated countries, against Senator Kennedy''s "espousal of the Viet Cong being included in a coalition government, before and not as the result of an election"; the Johnsons ask the Bundys, the Cliffords and Mary Margaret Valenti to dinner)'
    units: '?'
- cite:
    id: cal.1966-03-12.vietnam-us
    item: '[[w.johnson-white-house-diary]], 371 (Mar. 11 evening: Johnson to say "about forty-six or forty-seven of the Governors coming for all-day briefings"; the diary does not give the resolution)'
    units: '?'
- cite:
    id: cal.1966-03-12.press-and-broadcasting
    item: '[[w.johnson-white-house-diary]], 371 (Mar. 13: Johnson "made a surprise visit the night before to the Gridiron Dinner")'
    units: '?'
- cite:
    id: cal.1966-03-13.vietnam
    item: '[[w.johnson-white-house-diary]], 371–72 (Nixon in Johnson''s bedroom when Mrs. Johnson brings coffee, Johnson in pajamas drinking tea; Johnson names as outstanding military men Westmoreland, Goodpaster and Abrams; Nixon for the most part "in strong support"; the Chinese cautious, any discussion with China "should come now, rather than later"; leaving: "Mr. President, you know this is campaign year ... there won''t be anything personal about you in what I say about the Democratic Administration")'
    units: '?'
- cite:
    id: cal.1966-03-28.india-and-china
    item: '[[w.johnson-white-house-diary]], 374–76 (the South Lawn, about 11 a.m.: Johnson greets Mrs. Gandhi as "the leader of our sister democracy"; she warns the two nations "could not take each other for granted or allow our relations to drift"; the State Dinner, Johnson''s toast quoting her father; her reply, quoting him, on poverty as "our major problem"; the exchange of gifts in the Yellow Room; at dinner the remark to Mrs. Johnson, "Your husband is a passionate man," which the page gives to "Nehru")'
    units: '?'
- cite:
    id: cal.1966-06-28.vietnam-congress-4
    item: '[[w.johnson-white-house-diary]], 390–91 (Marvin Watson brings Russell to the house; "a quiet dinner, just Lyndon and Dick and I"; two hours on "the military future of the country," the Senate "and its problems and personalities and new faces"; she asks no questions and takes the decision to be "to bomb the enemy''s fuel depots," her inference; the Meredith march and Carmichael are not mentioned)'
    units: '?'
- cite:
    id: cal.1966-06-29.vietnam-air-war
    item: '[[w.johnson-white-house-diary]], 391 (after Russell leaves, Johnson asks Luci for a Catholic church that is open; Johnson, Luci and Mrs. Johnson to the monks'' church in the southwest of the city, a Brother lets them in; "Nobody at all knew"; the diary has no hour and does not name the church)'
    units: '?'
- cite:
    id: cal.1966-07-20.vietnam-prisoners
    item: '[[w.johnson-white-house-diary]], 396 (Mrs. Johnson in the front row; "full dress with television"; "hit-and-miss" on Vietnam and inflation; the Women''s Wear Daily reporter asks whether it is unfair that his paper is barred from the wedding; Johnson would "step aside" from discussing arrangements)'
    units: '?'
- cite:
    id: cal.1966-07-23.vietnam-2
    item: '[[w.johnson-white-house-diary]], 396–97 (Air Force One with Yarborough and, through the day, Governors Branigin, Kerner and Breathitt and Senators Bayh, Hartke, Cooper, Morton and Douglas; the Soldiers and Sailors Monument, some forty-two thousand in the circle; signs "We love Luci," "We are backing you on Vietnam," "We have a date in ''68," "Vance speaks for us"; not the words or the hour)'
    units: '?'
- cite:
    id: cal.1966-07-23.civil-disorders
    item: '[[w.johnson-white-house-diary]], 397, 398–99 (the Indianapolis Athletic Club, a stag luncheon for some 475 men hosted by Eugene Pulliam; "the most important speech of the day ... that riots must stop," as Mrs. Johnson heard of it on the plane: they "start a chain reaction," "do not bring about lasting reforms," "make reform more difficult"; not the sentences quoted in the entry)'
    units: '?'
- cite:
    id: cal.1966-08-06.war-opposition-2
    item: '[[w.johnson-white-house-diary]], 409 (leaving the church, "I myself did not see the pickets. I understand they were there somewhere"; the press and television on the Portico for the photographs)'
    units: '?'
- cite:
    id: cal.1966-08-20.open-housing-2
    item: '[[w.johnson-white-house-diary]], 411–12 (Rhode Island University, Kingston: a good speech on restraint in civil rights demonstrations, the Molotov cocktail "destroys far more than the police car or pawn shop"; "no one needs the law more than they"; no "magic sword" to cut the chain of poverty; demonstrators in the quadrangle with "Stop Escalation"; not the quotation in the entry)'
    units: '?'
- cite:
    id: cal.1966-08-31.europe-and-the-alliance
    item: '[[w.johnson-white-house-diary]], 417 (Sept. 1, the morning headlines: "Democratic Policy Committee Recommends Moving Troops Out of Europe," "apparently the decision was unanimous," Russell, Long and Mansfield among the members; Mrs. Johnson: "playing poker with a serious adversary and showing him your hand before you begin betting"; the diary does not name S. Res. 300)'
    units: '?'
- cite:
    id: cal.1966-09-21.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 428 (Sept. 23, on what she learns at the Ranch of "a busy four days": Johnson had appointed Katzenbach to the number two place at State, Ball''s, Eugene Rostow the number three and Foy Kohler the number four; not the day, not the news conference)'
    units: '?'
- cite:
    id: cal.1966-10-06.cities-and-housing
    item: '[[w.johnson-white-house-diary]], 428–29 (the news conference, the East Room, 3 p.m., Mrs. Johnson in the front row; among the questions "the Cities Bill"; not the words in the entry)'
    units: '?'
- cite:
    id: cal.1966-10-17.vietnam
    item: '[[w.johnson-white-house-diary]], the plates after 406 (unnumbered captions: "The President and First Lady arrive in New Zealand for first leg of Far East trip, October 17–November 2"; "Toasting with a native chief in Pago Pago, October 18")'
    units: '?'
- cite:
    id: cal.1966-10-24.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 434 (Oct. 25: the six Chiefs of State, Holt, Holyoake, Thanom, Park, Johnson and Marcos, "closeted in Malacanang Palace discussing all the military, civil, and diplomatic dimensions of Vietnam and hammering out a statement" while the wives toured; not the order of business)'
    units: '?'
- cite:
    id: cal.1966-10-28.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 436–37, 439–42 (the entry says to check the day of arrival: Oct. 27, "about noon" from Manila, a three-hour flight to U Ta Pao, Prime Minister Thanom and Ambassador Martin; F-105s on each wing; helicopter forty miles to Bang Saen; Oct. 29 in Bangkok, Chulalongkorn University''s honorary degree for Johnson from the King, his appeal to Hanoi''s leaders, and his signing of the International Education Act, "the first time any American legislation has ever been signed on foreign soil," as she was told; Thanom''s reception; the banquet for the King and Queen, Johnson''s toast on King Mongkut''s offer of elephants to Lincoln, Stan Getz)'
    units: '?'
- cite:
    id: cal.1966-10-30.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 442–46 (Sunday, Oct. 30: arrival at Kuala Lumpur at 9:45 a.m., the King and the Tunku; a twenty-one-gun salute; Johnson on Malaysia''s struggle against the guerrillas; the palace call; the Tunku''s dinner in the Parliament Building; a demonstration in which Chinese youths tore down American flags and "one had been shot by the police and killed," as Mrs. Johnson heard it later)'
    units: '?'
- cite:
    id: cal.1966-11-01.vietnam
    item: '[[w.johnson-white-house-diary]], 446–53 (Oct. 31: arrival in Seoul at about 3 p.m., Park at the foot of the steps, 350,000 estimated at City Hall Plaza, the Golden Key; Johnson: "To an American, the free soil of Korea is hallowed ground"; State Dinner at the Capitol after the Blue House; Nov. 2: the National Cemetery, the National Assembly, "I leave today with a deep sense of confidence in the future of Asia and the Pacific"; the National Assembly on Nov. 2, as the entry; the diary has no entry for Nov. 1)'
    units: '?'
- cite:
    id: cal.1966-11-02.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 453 (landing at Dulles at 8 p.m. "on a windy, wet evening," after a night in Alaska and the dateline, "another November 2"; the Cabinet, the Diplomatic Corps, a banner "Well done, Mr. President," a twenty-one-gun salute)'
    units: '?'
- cite:
    id: cal.1966-11-16.succession
    item: '[[w.johnson-white-house-diary]], 453 (Nov. 17: "Lyndon had come in late Tuesday and had been operated on early yesterday to repair the scar ... and to remove the polyp in his throat"; the growth benign)'
    units: '?'
- cite:
    id: cal.1966-12-14.robert-kennedy
    item: '[[w.johnson-white-house-diary]], 462 (Dec. 16: "Yesterday came the announcement of Bill Moyers'' departure"; not *Newsday*, not the lunch)'
    units: '?'
- cite:
    id: cal.1966-12-16.assassination
    item: '[[w.johnson-white-house-diary]], 462 ("Mrs. Kennedy is filing suit to block publication of the book")'
    units: '?'
- cite:
    id: cal.1966-10-19.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 429–31 (Oct. 20: Wellington, "sixty thousand people lined the streets" on the newspapers'' account, the motorcade to Parliament nearly an hour; a few demonstrators outside Parliament with "Hey, hey, LBJ, how many kids have you killed today?" and "Withdraw from Vietnam"; Prime Minister Holyoake on the flight to Ohakea, a botanist; a sheep farm)'
    units: '?'
- cite:
    id: cal.1966-10-20.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 431–32 (Canberra, about 6:15 p.m., met by Holt, Lord Casey and Ambassador Ed Clark; a twenty-one-gun salute; Johnson: "I cannot say that miracles will occur at Manila. I carry no magic wand"; the papers: "a near-riot"; nine stops on the ride to Government House; not Melbourne, Sydney, Brisbane or Townsville)'
    units: '?'
- cite:
    id: cal.1966-10-20.vietnam-asian-trip-2
    item: '[[w.johnson-white-house-diary]], 430 (the demonstrators outside Parliament, "few in number," with signs "Hey, hey, LBJ, how many kids have you killed today?" and "Withdraw from Vietnam"; the diary has no V sign and no "STOP THE WAR" banners)'
    units: '?'
- check:
    id: cal.1966-06-28.vietnam-congress-4
    text: 'Check: alone; Lady Bird Johnson, 390, has her at the dinner: "just Lyndon and Dick and I."'
- check:
    id: cal.1966-10-28.vietnam-asian-trip
    text: 'Check: Lady Bird Johnson, 436, has the party leave Manila about noon on Thursday, Oct. 27, and land at U Ta Pao that day, three hours later.'
- check:
    id: cal.1966-12-14.robert-kennedy
    text: 'Check: the day of the announcement; Lady Bird Johnson, 462, writing Dec. 16, has it "yesterday," Dec. 15.'
- cite:
    id: cal.1966-07-31.jobs-and-wages-airlines
    item: '[[w.johnson-white-house-diary]], 400 (Aug. 1: the settlement of the airline strike, "which we had celebrated on Friday—came unglued Sunday")'
    units: '?'
- add:
    entry:
      id: cal.1966-06-13.court-3
      when: June 13
      date: '1966-06-13'
      thread: court
      also:
      - congress
      c: 'The Supreme Court, 7 p.m. Justice Tom Clark and Mary Clark''s party for Luci Johnson and Pat Nugent, the first "wedding party" held in the Court: the Justices but Douglas, away making a speech; Speaker and Mrs. McCormack; "quite a number of the Texas Congressmen"; Perle Mesta; Ambassador and Anne Clark. Johnson comes a little past 8. Clark''s toast; a charm of the Court for Luci, cuff links for Nugent.'
      n: '[[w.johnson-white-house-diary]], 388–90 (Lady Bird Johnson''s account). Names: Tom Clark, Douglas, McCormack, Johnson, Lady Bird Johnson.'
      tags:
      - name:clark-tom-c
      - name:douglas-william-o
      - name:mccormack-john-w
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1966-06-13.opinion-4
      when: June 13
      date: '1966-06-13'
      thread: opinion
      c: 'Gallup: "President''s Standing Lowest in Thirty Months": approve of Johnson''s handling of his job 46 percent, 54 in May; disapprove up one point; no opinion 20 percent, 13 in May. Eisenhower''s low 49 percent, Truman''s 23.'
      n: '[[w.johnson-white-house-diary]], 388–89 (Lady Bird Johnson''s account), quoting the headline and the figures. Check: the day of release; Mrs. Johnson writes of "the new Gallup Poll" on June 13. See [[cal.1966-06-04.opinion]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-08-01.white-house
      when: Aug. 1
      date: '1966-08-01'
      thread: white-house
      also:
      - soviet-union
      c: Washington, the Harrimans' house, from 5 p.m. Averell and Marie Harriman's party for Luci Johnson and Pat Nugent. Sevilla-Sacasa, Dean of the Diplomatic Corps, presents the Corps' joint gift, a silver tea service, from all 114 members; nearly every country represented, chargés if the Ambassadors are away, all the Soviet bloc among them, Harriman says. Johnson comes a little before 7.
      n: '[[w.johnson-white-house-diary]], 401–02 (Lady Bird Johnson''s account). Names: Harriman, Johnson, Lady Bird Johnson.'
      tags:
      - name:harriman-w-averell
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1966-09-20.congress
      when: Sept. 20–22
      date: '1966-09-20'
      thread: congress
      c: Washington. Johnson to dinner at the Monroneys', Mary Ellen and Mike, with Florence Mahoney and George Wood.
      n: '[[w.johnson-white-house-diary]], 428 (Lady Bird Johnson''s account). Check: the day; Mrs. Johnson, away in California and New Mexico, writes on Sept. 23 that he had gone out to dinner each night of "a busy four days." Names: Johnson, Monroney.'
      tags:
      - name:johnson-lyndon-b
      - name:monroney-almer-s
      - city:washington
- add:
    entry:
      id: cal.1966-10-06.vietnam-asian-trip
      when: Oct. 6
      date: '1966-10-06'
      thread: vietnam-asian-trip
      also:
      - transition-and-staff
      c: 'News conference, the East Room, 3 p.m. Johnson names Sol Linowitz Ambassador to the Organization of American States, Llewellyn Thompson Ambassador to the Soviet Union and Ellsworth Bunker, as Mrs. Johnson has it, "Ambassador to the government of Vietnam." The trip: from Oct. 17, seventeen days, twenty-five thousand miles, New Zealand, Australia, the Philippines, Thailand, Malaysia, South Korea, a refueling stop in Alaska; the Manila Conference of all the nations in the war "the important business"; Mrs. Johnson to go. On the Great Society: "When you pass eighty-five bills out of ninety recommended, I think that is a pretty good box score."'
      n: '[[w.johnson-white-house-diary]], 428–29 (Lady Bird Johnson''s account). Check: Bunker''s post. To check: The President''s News Conference of October 6, 1966, [1966 Pub. Papers 1117](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=491). Names: Johnson, Thompson, Bunker, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:thompson-llewellyn-e
      - name:bunker-ellsworth
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-10-29.vietnam-asian-trip
      when: Oct. 29
      date: '1966-10-29'
      thread: vietnam-asian-trip
      c: Bangkok. Mrs. Johnson on the Klong in Queen Sirikit's launch, with Mrs. Martin, the Ambassador's wife, Khunying Molee Khoman, the Foreign Minister's wife, and two ladies-in-waiting for the Queen, who has a cold; hundreds of Thais on the banks; a boat of the press behind.
      n: '[[w.johnson-white-house-diary]], 438–39 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:bangkok
- add:
    entry:
      id: cal.1966-10-29.vietnam-asian-trip-2
      when: Oct. 29
      date: '1966-10-29'
      thread: vietnam-asian-trip
      c: Bangkok, the Red Cross Building. Queen Sirikit gives Mrs. Johnson a Medal of Merit; they talk of the Red Cross and the need for more hospitals, and Mrs. Johnson of the Senate Ladies' Red Cross unit.
      n: '[[w.johnson-white-house-diary]], 440–41 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:bangkok
- add:
    entry:
      id: cal.1966-10-30.vietnam-asian-trip-2
      when: Oct. 30
      date: '1966-10-30'
      thread: vietnam-asian-trip
      c: 'Kuala Lumpur. Before the Johnsons pass, a small demonstration: young Chinese race up and down the streets tearing down American flags; "one had been shot by the police and killed."'
      n: '[[w.johnson-white-house-diary]], 445 (Lady Bird Johnson''s account), as she heard it later. See [[cal.1966-10-30.vietnam-asian-trip]].'
      tags:
      - polity:us
      - city:kuala-lumpur
- add:
    entry:
      id: cal.1966-10.vietnam-asian-trip-2
      when: Oct.
      date: 1966-10
      thread: vietnam-asian-trip
      c: 'Los Baños, the Philippines, the Rice Institute. Johnson, leaving, to its head scientist, Robert F. Chandler: "Well, Dr. Chandler, if you just keep on producing better strains of rice and Margaret Sanger''s folks keep on doing what they are doing, this old world might be saved yet."'
      n: '[[w.johnson-white-house-diary]], 458 (Lady Bird Johnson''s account), told to the Bundys Dec. 1. Check: the day; the visit was during the Manila stay, Oct. 24–27. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-11-17.congress
      when: Nov. 17
      date: '1966-11-17'
      thread: congress
      c: Bethesda Naval Hospital. Carl Albert, recuperating from his heart attack in September, visits Johnson.
      n: '[[w.johnson-white-house-diary]], 454 (Lady Bird Johnson''s account). See [[cal.1966-11-17.succession]]. Names: Albert, Johnson.'
      tags:
      - name:albert-carl
      - name:johnson-lyndon-b
