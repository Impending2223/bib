      when: Sept. 1
      date: '1966-09-01'
      thread: economy-investment-credit
      c: 'A New York Times story with details of a proposed tax measure, including removal of the 7 percent tax credit for plant expansion. Mrs. Johnson: the details "were known to only two or three people. How did they get in the paper?"'
      n: '[[w.johnson-white-house-diary]], 417 (Lady Bird Johnson''s account). See [[cal.1966-08-30.economy-investment-credit]]. To check: the *Times* of Sept. 1, 1966. Names: Lady Bird Johnson.'
