      - name:lausche-frank-j
      - state:oh
      - city:dayton
- add:
    entry:
      id: cal.1966-09-05.elections-1966-2
      when: Sept. 5
      date: '1966-09-05'
      thread: elections-1966
      c: 'Lancaster, Ohio, Fairfield County Fair Grounds. Johnson, two hours late, stops fourteen times on the way from Columbus, speaking on a bull horn; twenty-six school bands; the Congressman''s wife, Mrs. Walter Moeller. A newsman: "If crossroads Ohio were his meat, Lancaster was the President''s triumph."'
      n: '[[w.johnson-white-house-diary]], 420–21 (Lady Bird Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:oh
      - city:lancaster
- add:
    entry:
      id: cal.1966-09-05.health
      when: Sept. 5
      date: '1966-09-05'
      thread: health
      c: 'Battle Creek, Mich. Johnson at the Battle Creek Sanitarium''s centennial: the health achievements of the Administration and the hope of giving the world the medical knowledge accumulated; praise of the freshman Congressman Paul Todd, no plea to elect him. Sixty-five thousand estimated along the way.'
      n: '[[w.johnson-white-house-diary]], 419–20 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at Battle Creek, Sept. 5, 1966. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:mi
      - city:battle-creek
- add:
    entry:
      id: cal.1966-09-05.vietnam-support
      when: Sept. 5
      date: '1966-09-05'
      thread: vietnam-support
      c: 'Detroit, Cobo Hall, Labor Day, some five thousand. Governor Romney meets Johnson at the airport. A heckler: "Let''s settle the war in Vietnam!" Johnson, off his text: "If anyone will show me the time schedule when aggression and infiltration and ''might makes right'' will be halted, then I, as President of this country, will lay on the table the schedule for the withdrawal of all of our forces from Vietnam." The hall rises. No parade; "almost no blue shirts."'
      n: '[[w.johnson-white-house-diary]], 418–19 (Lady Bird Johnson''s account). To check: the Public Papers, Labor Day remarks at Detroit, Sept. 5, 1966. Names: Johnson, Romney.'
      tags:
      - name:johnson-lyndon-b
      - name:romney-george-w
      - state:mi
      - city:detroit
- add:
    entry:
      id: cal.1966-09-07.soviet-union
      when: Sept. 7
      date: '1966-09-07'
      thread: soviet-union
      also:
      - program
      c: 'The White House, the East Room. Reception for the winners of the Tschaikovsky Competition, the thirteen winners'' parents invited. Johnson, the spotlight failing, in the dark: they are "a national treasure." Van Cliburn master of ceremonies; Jane Marsh first prize. Alexander Zinchuk, the Soviet Embassy''s Minister Counselor, in the front row, the Dobrynins in Moscow. Steinbeck in the line.'
      n: '[[w.johnson-white-house-diary]], 421–23 (Lady Bird Johnson''s account). Names: Johnson, Dobrynin.'
      tags:
      - name:johnson-lyndon-b
      - name:dobrynin-anatoly
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-09-20.conservation
      when: Sept. 20
      date: '1966-09-20'
      thread: conservation
      c: Point Reyes, Cal. Mrs. Johnson dedicates the Point Reyes National Seashore.
      n: '[[w.johnson-white-house-diary]], 423 (Lady Bird Johnson''s account). Mrs. Johnson writes on Sept. 21 "Yesterday." Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:ca
- add:
    entry:
      id: cal.1966-09-21.conservation
      when: Sept. 21
      date: '1966-09-21'
      thread: conservation
      c: 'Monterey, Cal., Colton Hall. Mrs. Johnson with Governor Brown, Senator Fred Farr and the Mayor, Minnie Coyle: "conservation, beautification, call it what you will, is more than just one tree, or one historic building, or one scenic highway. It is a frame of reference, a way of life." She plants a chestnut seedling carried from the East.'
      n: '[[w.johnson-white-house-diary]], 423–25 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Edmund Brown.'
      tags:
      - name:johnson-lady-bird
      - name:brown-edmund-g
      - state:ca
      - city:monterey
- add:
    entry:
      id: cal.1966-09-21.conservation-2
      when: Sept. 21
      date: '1966-09-21'
      thread: conservation
      c: Hurricane Point, Big Sur, Cal. Mrs. Johnson dedicates the Big Sur Scenic Highway; Governor Brown, Senator Farr, Nathaniel Owings and she speak; a plaque with Robinson Jeffers's lines. Liz Carpenter holds the photographers back.
      n: '[[w.johnson-white-house-diary]], 425 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Edmund Brown, Liz Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:brown-edmund-g
      - name:carpenter-liz
      - state:ca
- add:
    entry:
      id: cal.1966-09-21.conservation-3
      when: Sept. 21
      date: '1966-09-21'
      thread: conservation
      c: 'San Simeon, Cal., Hearst Castle, now a State park. Mrs. Johnson and Governor Brown and Mrs. Brown receive three or four hundred guests at the Neptune Pool: conservationists, museum directors, college presidents, Pulitzer winners, movie stars, businessmen, Hearsts; a barbecue; Danny Kaye master of ceremonies, gibes at Udall.'
      n: '[[w.johnson-white-house-diary]], 426–27 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Edmund Brown, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:brown-edmund-g
      - name:udall-stewart-l
      - state:ca
- add:
    entry:
      id: cal.1966-09-23.poverty
      when: Sept. 23
      date: '1966-09-23'
      thread: poverty
      c: 'San Ildefonso Pueblo, N.M. Mrs. Johnson with Udall: Head Start children being fed in one home; the studio of Maria and her son Popovi Da, black-on-black pottery.'
      n: '[[w.johnson-white-house-diary]], 427 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - state:nm
- add:
    entry:
      id: cal.1966-10-25.vietnam-asian-trip-2
      when: Oct. 25
      date: '1966-10-25'
      thread: vietnam-asian-trip
      c: 'Manila. The First Ladies of the conference, Mrs. Marcos, Madame Kỳ, Mrs. Holt and Mrs. Johnson, tour the city by bus: Luneta Park, the Intramuros restoration, St. Augustine Church, the Santa Ana dig. Mrs. Marcos gives each a mahogany chest of handicrafts. Bamboo screening along the streets; signs reading "Fierce Vultures" and "Wolves."'
      n: '[[w.johnson-white-house-diary]], 432–34 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:manila
- add:
    entry:
      id: cal.1966-10-25.vietnam-asian-trip-3
      when: Oct. 25
      date: '1966-10-25'
      thread: vietnam-asian-trip
      c: Manila, Malacañang Palace, evening. The Barrio Fiesta ends the conference. The "Summit Conference Pact" was completed late in the afternoon; the fiesta late because the men finished their communiqué so late; at the banquet table several Chiefs of State add their signatures to the final document. Johnson drives a tilbury; three thousand guests; a crown of flowers for each Chief of State.
      n: '[[w.johnson-white-house-diary]], 434–35 (Lady Bird Johnson''s account). The diary calls the document the "Summit Conference Pact" and the "final document." See [[cal.1966-10-24.vietnam-asian-trip]]. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-10-27.succession
      when: Oct. 27
      date: '1966-10-27'
      thread: succession
      c: 'Manila, the morning, before leaving. Dr. Burkley''s telephone call to Dr. James Cain, who has talked with the throat specialists and Willis Hurst: the general feeling is that Johnson should go ahead with the operation to remove the growth in his throat and repair the incisional hernia from the gall bladder operation. Cain and probably the others to come to Washington when the party returns and set the time, after a week or so of rest.'
      n: '[[w.johnson-white-house-diary]], 436 (Lady Bird Johnson''s account). To check: the operation''s date and the doctors'' account. Made public: 1970. Names: Burkley, Hurst, Johnson.'
      tags:
      - name:burkley-george-g
      - name:hurst-e-h
      - name:johnson-lyndon-b
