      when: July 20
      date: '1966-07-20'
      thread: program
      c: The White House. Johnson meets sub-Cabinet officers of the AEC, AID, the Export-Import Bank, NASA, the USIA and the Arms Control and Disarmament Agency.
      n: '[[w.johnson-white-house-diary]], 396 (Lady Bird Johnson''s account). The subjects are not given. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-07-20.war-opposition
      when: July 20
      date: '1966-07-20'
      thread: war-opposition
      also:
      - civil-rights-organizations
      c: 'The White House. Mrs. Johnson with Inspector Glenard Lanier, Agent Bill Duncan, Milton Semer and Bess on parking for seven hundred wedding guests on Aug. 6: a peace organization has asked the National Park Service for a permit to picket in Lafayette Park that afternoon (to have it from 6 p.m. if it insists); another group has marched at the White House fence with banners since July 19; the Student Nonviolent Coordinating Committee, "I think it is," led by Stokely Carmichael, means to picket as close as it can to the Shrine. Guests to park at the Ellipse and enter by the Treasury.'
      n: '[[w.johnson-white-house-diary]], 395–96 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Carmichael.'
      tags:
      - name:johnson-lady-bird
      - name:carmichael-stokely
- add:
    entry:
      id: cal.1966-07-23.conservation
      when: July 23
      date: '1966-07-23'
      thread: conservation
      c: 'Jeffersonville, Ind. Johnson presents a beautification award to the Post Office, his ninth speech of the day, near 10 p.m., an hour late; he throws the text aside: "It may be old-fashioned, but I still believe that my country does most things right." Mrs. Johnson''s note: "Great speech—but time to stop."'
      n: '[[w.johnson-white-house-diary]], 398 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - state:in
- add:
    entry:
      id: cal.1966-07-23.vietnam-support
      when: July 23
      date: '1966-07-23'
      thread: vietnam-support
      c: Washington, the morning. Johnson dedicates the AMVETS Building; Speaker McCormack and Mrs. Johnson unveil a bronze bust of Johnson.
      n: '[[w.johnson-white-house-diary]], 396 (Lady Bird Johnson''s account). Names: Johnson, McCormack, Lady Bird Johnson.'
