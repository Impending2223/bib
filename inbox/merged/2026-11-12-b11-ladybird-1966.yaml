      when: July 20
      date: '1966-07-20'
      thread: governors
      c: 'The White House. Johnson meets members of the Midwest Governors Conference: Branigin of Indiana, Kerner of Illinois, Knowles of Wisconsin, Rhodes of Ohio.'
      n: '[[w.johnson-white-house-diary]], 396 (Lady Bird Johnson''s account). Names: Johnson, Branigin, Kerner, Knowles, Rhodes.'
