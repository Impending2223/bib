      when: July 13
      date: '1966-07-13'
      thread: vietnam-support
      c: 'The Sequoia. Johnson''s stag dinner for Prime Minister Holt of Australia and a group of Ambassadors. About 10 p.m. the two come in to the White House; Holt''s stories of his travels: "Holt''s the name."'
      n: '[[w.johnson-white-house-diary]], 393 (Lady Bird Johnson''s account). Names: Johnson, Holt.'
      tags:
      - name:johnson-lyndon-b
      - name:holt-harold-e
- add:
    entry:
      id: cal.1966-07-13.white-house
      when: July 13
      date: '1966-07-13'
      thread: white-house
      c: 'The White House, 6:30 p.m., the Truman Balcony. Mrs. Johnson, Bruce Thomas, Nash Castro, Joe Bruno, Liz Carpenter, Mr. West and, later, Marvin Watson on keeping the house open to visitors: 1.8 million in 1964, 1.7 million in 1965; closed eight times and the hours cut ten times in the first half of 1966; guidebook buyers 20 percent in 1964, 16 in 1965, 11 in 1966. Castro: tourists to walk the drive when a State luncheon closes the house. Mrs. Johnson: the house, closed for Luci''s wedding, to open the Monday after, 8 to 4, though never open on Mondays.'
      n: '[[w.johnson-white-house-diary]], 392–93 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Liz Carpenter, Watson.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
      - name:watson-w-marvin
- add:
    entry:
      id: cal.1966-07-20.elections-1968-johnson
      when: July 20
      date: '1966-07-20'
      thread: elections-1968-johnson
      also:
      - program
      c: 'The White House, about 5 a.m. Johnson and Mrs. Johnson, unable to sleep, talk of each of the children, "all the troubles that beset Lyndon and about his future," and of what she wants to do before they leave the house and after: grandchildren, wildflowers, travel, running rivers.'
      n: '[[w.johnson-white-house-diary]], 395 (Lady Bird Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
