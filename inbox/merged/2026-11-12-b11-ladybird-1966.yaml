      when: Aug. 20
      date: '1966-08-20'
      thread: economy
      c: 'Lewiston, Me., City Park. Johnson on inflation: what America needs is "a strong dose of self-discipline." Margaret Chase Smith beside Mrs. Johnson in the motorcade; Muskie with Johnson.'
      n: '[[w.johnson-white-house-diary]], 414 (Lady Bird Johnson''s account). The words in quotation marks are Mrs. Johnson''s. To check: the Public Papers, remarks at Lewiston, Aug. 20, 1966. Names: Johnson, Margaret Chase Smith, Muskie.'
