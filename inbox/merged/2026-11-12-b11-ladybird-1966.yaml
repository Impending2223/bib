    entry:
      id: cal.1966-08-02.middle-east
      when: Aug. 2
      date: '1966-08-02'
      thread: middle-east
      c: The White House. State Dinner for President Zalman Shazar of Israel and Mrs. Shazar, 190 guests; the Johnsons, a few minutes late, meet them on the front Portico just before 8; Rudolf Serkin plays.
      n: '[[w.johnson-white-house-diary]], 402–04 (Lady Bird Johnson''s account). To check: the Public Papers, the toasts, Aug. 2, 1966. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
