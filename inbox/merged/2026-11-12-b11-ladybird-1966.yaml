      date: '1966-07-20'
      thread: latin-america
      c: The White House. Johnson's stag luncheon for President René Barrientos of Bolivia.
      n: '[[w.johnson-white-house-diary]], 396 (Lady Bird Johnson''s account). Names: Johnson, Barrientos.'
