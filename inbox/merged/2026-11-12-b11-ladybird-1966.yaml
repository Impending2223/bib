patch: 2026-11-12-b11-ladybird-1966
by: 'Claude (batch 11: Lady Bird Johnson, A White House Diary, 1966), Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1966-01-01.vietnam-pause
      when: Jan. 1
      date: '1966-01-01'
      thread: vietnam-pause
      also:
      - steel
      c: 'LBJ Ranch. Thomas Mann, back from Mexico on the peace appeal: in all his years of Mexico and its politicians he had never found them so friendly to the United States. In the car to Enchanted Rock, calls to Johnson on the car telephone from Moyers and Califano: reports from the peace seekers and the price increases in steel.'
      n: '[[w.johnson-white-house-diary]], 345–46 (Lady Bird Johnson''s account). See [[cal.1966-01-01.steel]]. Made public: 1970. Names: Mann, Johnson, Moyers, Califano.'
      tags:
      - name:mann-thomas-c
      - name:moyers-bill
      - name:califano-joseph-a-jr
      - state:tx
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-03.vietnam-pause-4
      when: Jan. 3
      date: '1966-01-03'
      thread: vietnam-pause
      c: 'The White House. Johnson to Mrs. Johnson, swimming, on the week: the Budget, the State of the Union Message and, "if nothing, nothing, nothing comes of the peace offensive," when to resume the bombing. In the morning he had said that, sleeping little, he had thought about Vietnam "just as long as he could," then about the Budget.'
      n: '[[w.johnson-white-house-diary]], 347 (Lady Bird Johnson''s account). See [[cal.1966-01-03.vietnam-pause]]. Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-01-05.press-and-broadcasting
      when: Jan. 5
      date: '1966-01-05'
      thread: press-and-broadcasting
      c: 'The White House, 5 p.m. Mrs. Johnson interviewed by Howard Taubman of the New York Times on art and on how her feelings and the President''s are reflected in the Administration and its legislation; she shows him the Homer, the Sully and the Cassatt acquired for the house and names the paintings she wants: a Copley, a West, a Bingham, an Eakins, an Innes.'
      n: '[[w.johnson-white-house-diary]], 348–49 (Lady Bird Johnson''s account). To check: the Times''s piece. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-01-05.steel
      when: Jan. 5
      date: '1966-01-05'
      thread: steel
      c: 'The White House, morning. Johnson, leaving, to Mrs. Johnson: "We''ve lost the steel fight; we may lose the war." He had slept from 12:30 to 2:30.'
      n: '[[w.johnson-white-house-diary]], 347 (Lady Bird Johnson''s account). See [[cal.1966-01-02.steel]]. Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-07.peace-corps
      when: Jan. 7
      date: '1966-01-07'
      thread: peace-corps
      also:
      - transition-and-staff
      c: 'The White House. Galbraith declines the directorship of the Peace Corps, which Johnson had offered about a week before: he is about six months short of finishing a book. If Johnson ever has a job that absolutely had to be done by "a sort of a fringe liberal considered dangerous by some," he wants to do it. Mrs. Johnson meets Johnson, Cain and Galbraith leaving the elevator.'
      n: '[[w.johnson-white-house-diary]], 349 (Lady Bird Johnson''s account). Galbraith''s words as Mrs. Johnson gives them. Made public: 1970. Names: Galbraith, Johnson.'
      tags:
      - name:galbraith-john-kenneth
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-11.conservation
      when: Jan. 11
      date: '1966-01-11'
      thread: conservation
      c: Washington, the Statler Ballroom. The National Wildlife Federation's dinner with the Sears Roebuck Foundation. Udall master of ceremonies, Freeman the main speaker. Mrs. Johnson presents four awards, whooping-crane statuettes, and receives one; Nelson Rockefeller's award for "dynamic leadership" against water pollution; her check to landscape the National Zoo's new automobile entrance.
      n: '[[w.johnson-white-house-diary]], 349–50 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Udall, Freeman, Nelson Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - name:freeman-orville-l
      - name:rockefeller-nelson
      - city:washington
- add:
    entry:
      id: cal.1966-01-11.elections-1968-johnson
      when: Jan. 11
      date: '1966-01-11'
      thread: elections-1968-johnson
      also:
      - program
      c: 'The White House, the early hours. Johnson, awake, and Mrs. Johnson talk of "the prospects for the years ahead." Her advice: "stay healthy, laugh a little, remember you are as tough as other Presidents who have lived through the same or worse."'
      n: '[[w.johnson-white-house-diary]], 349 (Lady Bird Johnson''s account). Her own thought, not said: the end of the term "like a light at the end of a tunnel." Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-01-11.program-2
      when: Jan. 11
      date: '1966-01-11'
      thread: program
      also:
      - poverty
      c: Night. Mrs. Johnson reads the final draft of the domestic part of the State of the Union Message and suggests a sentence on thrift and common sense in the war on poverty, with respect for the taxpayer's dollar.
      n: '[[w.johnson-white-house-diary]], 351 (Lady Bird Johnson''s account). She writes on Jan. 12 "Last night." See [[cal.1966-01-11.program]]. Made public: 1970. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-01-11.white-house
      when: Jan. 11
      date: '1966-01-11'
      thread: white-house
      c: 'Three or four press stories on "gumshoe practice in the White House": every trip in a White House car logged, who and where, to end social and personal chauffeuring, the price of cutting the chauffeurs from one hundred to sixty; telephone lines too to be cut to need, not status.'
      n: '[[w.johnson-white-house-diary]], 350 (Lady Bird Johnson''s account). Mrs. Johnson dates the stories, not the cut, and writes "our effort"; no one is named.'
      tags: []
- add:
    entry:
      id: cal.1966-01-12.conservation
      when: Jan. 12
      date: '1966-01-12'
      thread: conservation
      c: 'Washington. Mrs. Johnson with Brooke Astor, Mary Lasker, Walter Washington and Nash Castro on beautification: the schools, playgrounds and community parks, Hains Point and a future of cherry-tree alleys; the shortage of labor for park maintenance and highway beautification, and of nursery stock.'
      n: '[[w.johnson-white-house-diary]], 351–52 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Walter Washington.'
      tags:
      - name:johnson-lady-bird
      - city:washington
      - name:washington-walter-e
- add:
    entry:
      id: cal.1966-01-18.program
      when: Jan. 18
      date: '1966-01-18'
      thread: program
      c: The White House. Bill Heath, with Clark Clifford, tells Mrs. Johnson that the University of Texas has named a committee of four, Heath, Norman Hackerman, Harry Ransom and Frank Erwin, to make recommendations on getting the School of Public Service under way; an advisory committee to be formed from the faculty.
      n: '[[w.johnson-white-house-diary]], 353–54 (Lady Bird Johnson''s account). Mrs. Johnson had asked Galbraith on Jan. 7 for an hour on the School (349). Names: Clifford, Lady Bird Johnson.'
      tags:
      - name:clifford-clark
      - name:johnson-lady-bird
      - state:tx
- add:
    entry:
      id: cal.1966-01-23.press-and-broadcasting
      when: Jan. 23
      date: '1966-01-23'
      thread: press-and-broadcasting
      also:
      - europe-and-the-alliance
      c: 'Telstar. Rusk interviewed by newspapermen in Rome, Paris, Bonn and London, watched in the West Hall. Asked in one question of Rhodesia and South Africa: "If you don''t mind, I''d like to take my crises one at a time."'
      n: '[[w.johnson-white-house-diary]], 355 (Lady Bird Johnson''s account). Names: Rusk.'
      tags:
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-01-23.program
      when: Jan. 23
      date: '1966-01-23'
      thread: program
      also:
      - vietnam-support
      - economy
      c: 'The White House, dinner for the Tom Manns, the Kermit Gordons, the John Macys, Tyler and Bess, and, added by Johnson, the Vice President. Talk of a medical team and an agricultural team, headed by Freeman, for Vietnam. Johnson: "The thing I want most is a Tax Bill by April 15"; "We will not pass much this year." Kermit Gordon: "It seems to me, Mr. President, this was the way you were talking in January 1965."'
      n: '[[w.johnson-white-house-diary]], 355 (Lady Bird Johnson''s account). The talk of the teams came as the guests were leaving; she writes "Tyler and Bess" without surnames. Made public: 1970. Names: Mann, Kermit Gordon, Macy, Humphrey, Freeman, Johnson.'
      tags:
      - name:mann-thomas-c
      - name:gordon-kermit
      - name:macy-john-w-jr
      - name:humphrey-hubert-h
      - name:freeman-orville-l
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-23.white-house
      when: Jan. 23
      date: '1966-01-23'
      thread: white-house
      c: 'The White House. Results of the security check on telephones and contacts, read by Mrs. Johnson: for 1965 "more than fifty-one thousand ''unfriendly contacts,''" from abusive telephone calls and threatening letters to 166 picketings, over three hundred "unwelcome visitors" at the Main Gate, 112 of them arrested or committed for mental observation, and seven persons apprehended climbing the fence.'
      n: '[[w.johnson-white-house-diary]], 354–55 (Lady Bird Johnson''s account). The diary dates her reading, not the report. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-02-05.vietnam-honolulu
      when: Feb. 5
      date: '1966-02-05'
      thread: vietnam-honolulu
      c: The White House, Mrs. Johnson's dinner on the State floor, Leonard Marks and Diana and Donald MacArthur her guests. Marks on his trip the next day to Hawaii and then Saigon. Talk of the audio-visual requirements of the Lyndon Baines Johnson Library.
      n: '[[w.johnson-white-house-diary]], 359 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Marks.'
      tags:
      - name:johnson-lady-bird
      - name:marks-leonard-h
- add:
    entry:
      id: cal.1966-02-13.vietnam-support
      when: Feb. 13
      date: '1966-02-13'
      thread: vietnam-support
      also:
      - war-opposition
      c: 'The White House, evening. Johnson to Mrs. Johnson on Hawaii: impressed with Westmoreland, "rather impressed" with Kỳ; wounded to a hospital within three hours. The SEATO Treaty: Senate, February 1955, 82 to 1, Langer against; he at the Mayo Clinic, Kennedy absent with his back. "We are trying to carry out the contracts they made." Lafayette Park full of picketers; the White House picketed 166 times in 1965. "This thing is assuming dangerous proportions, dividing the country and giving our enemies the wrong idea of the will of this country to fight." Taylor "tremendous on TV"; the Johnsons call him: "I was just warming up for the Senate Committee."'
      n: '[[w.johnson-white-house-diary]], 359–60 (Lady Bird Johnson''s account). The vote and its day are Mrs. Johnson''s report of Johnson''s words. Made public: 1970. To check: the vote on the SEATO Treaty, Feb. 1, 1955. Names: Johnson, Westmoreland, Kỳ, Taylor, John Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:nguyen-cao-ky
      - name:taylor-maxwell
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1966-02-20.vietnam-support
      when: Feb. 20
      date: '1966-02-20'
      thread: vietnam-support
      c: 'The White House, dinner: the Bundys, the Cliffords, Mary Margaret Valenti, the Fowlers (a party of nine). Johnson on Vietnam, "about two thirds of what we talk about these days": "There''s not a mother in the world who cares more about it than I do, because I have two hundred thousand of them over there—and they think I am in charge, and if I am not, God help them—who the Hell is!" Mrs. Johnson tells Bundy how sad she is that he is leaving.'
      n: '[[w.johnson-white-house-diary]], 361–62 (Lady Bird Johnson''s account). Made public: 1970. Names: Johnson, Bundy, Clifford, Fowler.'
      tags:
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - name:clifford-clark
      - name:fowler-henry-h
- add:
    entry:
      id: cal.1966-02-20.white-house
      when: Feb. 20
      date: '1966-02-20'
      thread: white-house
      c: 'St. Mark''s Church. Leaving, Johnson takes the hand of Coco McPherson, who has come up to him, and of her friend Janice, ten, a Negro member of the choir; they and Mrs. Johnson walk out hand in hand past Helen Thomas and the cameras. Johnson: "if you don''t watch out, she''ll be announcing your wedding." The four ride to the White House; the girls in Johnson''s office, pencils and keepsakes, then the dogs. Harry and Clay McPherson, Bill Baxter and his wife are asked to lunch.'
      n: '[[w.johnson-white-house-diary]], 360–61 (Lady Bird Johnson''s account). Names: Johnson, McPherson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1966-02-25.congress
      when: Feb. 25
      date: '1966-02-25'
      thread: congress
      also:
      - vietnam-congress-armed-services
      c: 'The White House, after 9:30 p.m. Johnson in his small office with Richard Russell. Mrs. Johnson: "Whatever lack of red-hot enthusiasm he may have for the Great Society, when the going is rough and Lyndon needs the advice of an old hand, a wise old hand, Dick Russell will usually be there."'
      n: '[[w.johnson-white-house-diary]], 366 (Lady Bird Johnson''s account). The subject is not given. Names: Johnson, Russell.'
      tags:
      - name:johnson-lyndon-b
      - name:russell-richard-b
- add:
    entry:
      id: cal.1966-02-25.women
      when: Feb. 25
      date: '1966-02-25'
      thread: women
      also:
      - alabama
      - poverty
      c: 'Tuscaloosa, Ala. Mrs. Johnson to the Leadership Conference of Women at the University of Alabama (the American Association of University Women, the State federations of business and professional women''s and of women''s clubs, the League of Women Voters), Frank Rose its host. Robert Shelton, the Klan''s imperial wizard, of Tuscaloosa, had objected to "Pinko tripe"; she arrives a day after Lurleen Wallace''s announcement. Signs: "We support LBJ on Vietnam" and "Draft Lady Bird for Governor of Alabama." Rose has a contract to train Head Start teachers for Alabama and adjoining States; the auditorium is where Wallace and Katzenbach faced each other. A chartered plane of newspaperwomen. The League of Women Voters has set up poll tax booths in supermarkets and school lobbies.'
      n: '[[w.johnson-white-house-diary]], 363–66 (Lady Bird Johnson''s account). See [[cal.1966-02-24.elections-1966]]. Names: Lady Bird Johnson, Lurleen Wallace, George Wallace, Katzenbach.'
      tags:
      - name:johnson-lady-bird
      - name:wallace-lurleen-b
      - name:wallace-george-c
      - name:katzenbach-nicholas
      - state:al
      - city:tuscaloosa
- add:
    entry:
      id: cal.1966-03-03.congress
      when: Mar. 3
      date: '1966-03-03'
      thread: congress
      c: 'The White House, 6:30 to 8:30 p.m. The Congressional Reception, about a thousand guests. At Johnson''s suggestion the Leadership, committee chairmen, Cabinet and some staff are greeted upstairs thirty minutes early; the Leadership photographed in the Lincoln Room with the Johnsons and the Humphreys: Hayden, Kuchel, Dirksen, Mansfield, Boggs, McCormack, Albert, Arends. Dirksen leads the Marine Band in "Danny Boy"; Thurmond brings the Georgia Peach Queen; Morse and Bobby and Teddy Kennedy do not come. Johnson to the newswomen: of some 2,000 votes in ten days "have not been more than 200 votes against any of my bills"; the Economic Aid Bill with less than forty against, the Asian Bank, military aid (the House lost four, the Senate two), the vote on rescinding the President''s power (five), the Tax Bill "130 to nothing."'
      n: '[[w.johnson-white-house-diary]], 368–69 (Lady Bird Johnson''s account). Betty Beale and Dorothy McCardle report Johnson''s words; the tally is as quoted. To check: the Washington Star and the Post of Mar. 4. Names: Johnson, Humphrey, Hayden, Kuchel, Dirksen, Mansfield, Boggs, McCormack, Albert, Arends, Thurmond, Morse, Robert Kennedy, Edward Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:hayden-carl
      - name:kuchel-thomas-h
      - name:dirksen-everett
      - name:mansfield-mike
      - name:boggs-hale
      - name:mccormack-john-w
      - name:albert-carl
      - name:arends-leslie-c
      - name:thurmond-strom
      - name:morse-wayne
      - name:kennedy-robert-f
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1966-03-10.congress
      when: Mar. 10
      date: '1966-03-10'
      thread: congress
      c: The White House, the Yellow Oval Room. Johnson with the Leadership "for several hours"; Mrs. Johnson meets him after 8 going back to his office.
      n: '[[w.johnson-white-house-diary]], 369 (Lady Bird Johnson''s account). The subject and the members are not given. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-03-10.program
      when: Mar. 10
      date: '1966-03-10'
      thread: program
      also:
      - europe-and-the-alliance
      - latin-america-dominican-republic
      c: 'The White House, dinner at 10:50 p.m., with Oveta Hobby and the Jim Cains. Johnson in a "thumbnail sketch": the Guatemala election, the turmoil in the Dominican Republic, de Gaulle''s ultimatums and the tightrope Wilson walks.'
      n: '[[w.johnson-white-house-diary]], 369–70 (Lady Bird Johnson''s account). Made public: 1970. Names: Johnson, Hobby.'
      tags:
      - name:johnson-lyndon-b
      - name:hobby-oveta-culp
- add:
    entry:
      id: cal.1966-03-11.vietnam-pacification
      when: Mar. 11
      date: '1966-03-11'
      thread: vietnam-pacification
      c: 'The White House, evening. Johnson to Oveta Hobby and Dr. James Cain, leaving the next morning for Vietnam: "I would have a fast inoculation program"; "the simple three R''s" in school; "I want to do something about the conditions that have caused this war"; Freeman''s mission, two-hundred-pound hogs for one-hundred-pound; "I want to get out of there more than anybody, including the Marines." The man who has helped most and asked least: Eisenhower. "I''m like a prize fighter in the ring. The right fist is the military, the left fist is aid—medical, agricultural, educational."'
      n: '[[w.johnson-white-house-diary]], 370–71 (Lady Bird Johnson''s account). Hobby and Cain were briefed all day. Made public: 1970. Names: Johnson, Hobby, Freeman, Eisenhower.'
      tags:
      - name:johnson-lyndon-b
      - name:hobby-oveta-culp
      - name:freeman-orville-l
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1966-03-17.congress
      when: Mar. 17
      date: '1966-03-17'
      thread: congress
      c: The White House. Johnson with Mrs. Johnson and the Charles Engelhards celebrates Mansfield's birthday with the Senator and Maureen Mansfield, half an hour.
      n: '[[w.johnson-white-house-diary]], 373 (Lady Bird Johnson''s account). "A short celebration of the Senator''s birthday." Names: Johnson, Mansfield.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
- add:
    entry:
      id: cal.1966-03-17.program
      when: Mar. 17
      date: '1966-03-17'
      thread: program
      c: 'The White House. The National Gallery of Art''s awards to twenty-five teachers of the visual arts, presented by Mrs. Johnson, a gold medal each and $500. John Walker: "At no time in our history have a President and a Congress done so much to create an America in which the arts have their proper place." Winners include Erwin Panofsky, Howard Conant, Wilbur Stilwell of Vermillion, S.D., Mrs. Alvin Bippus of Toledo and Marie Larkin.'
      n: '[[w.johnson-white-house-diary]], 372–73 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:sd
- add:
    entry:
      id: cal.1966-03-17.program-2
      when: Mar. 17
      date: '1966-03-17'
      thread: program
      c: Washington. The twenty-fifth anniversary exhibition of the National Gallery, the Mellon loan of more than two hundred French Impressionists, about nine thousand guests; Mrs. Johnson arrives at 10:20 p.m., the opening set for about 9:30, with the Paul Mellons and John Walker; forty-five minutes of "a purely public show." A toast to Andrew Mellon.
      n: '[[w.johnson-white-house-diary]], 373–74 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1966-04-02.conservation
      when: Apr. 2
      date: '1966-04-02'
      thread: conservation
      c: 'Presidio, Tex., and Big Bend National Park. Mrs. Johnson, Udall and about seventy newspeople: 3,500 at the Presidio airport, the Sul Ross band, sombreros for all; lunch at Panther Junction, where she hands George Hartzog a check for a Golden Eagle Park Pass; a two-hour hike on the Lost Mine Trail with Udall; a campfire supper, Joe Frantz on the history of the West.'
      n: '[[w.johnson-white-house-diary]], 376–80 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - state:tx
- add:
    entry:
      id: cal.1966-04-03.conservation
      when: Apr. 3
      date: '1966-04-03'
      thread: conservation
      c: 'Big Bend National Park, Palm Sunday. Mrs. Johnson plants a pinon tree by the new concessions building; an eleven-mile raft trip of over five hours down the Rio Grande through Mariscal Canyon, twenty-four rafts, 139 people. Udall: "You have had a wilderness experience." Dinner at the Rio Grande Village Camp Ground with Nash Castro and Congressman Dick White; Udall gives the press certificates as "Original American Wet-bottoms."'
      n: '[[w.johnson-white-house-diary]], 380–83 (Lady Bird Johnson''s account). See [[cal.1966-04-02.conservation]]. Names: Lady Bird Johnson, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - state:tx
- add:
    entry:
      id: cal.1966-04-13.conservation
      when: Apr. 13
      date: '1966-04-13'
      thread: conservation
      c: 'Hains Point, Washington. Tree planting: Mrs. Johnson with Mary Lasker and Mr. and Mrs. Laurance Rockefeller.'
      n: '[[w.johnson-white-house-diary]], the plates after 406 (unnumbered; the caption, "Tree planting at Hains Point with Mary Lasker and Mr. and Mrs. Laurance Rockefeller, April 13"). Not in the text of the diary. Names: Lady Bird Johnson, Laurance Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:rockefeller-laurance-s
      - city:washington
- add:
    entry:
      id: cal.1966-04-19.democratic-party
      when: Apr. 19
      date: '1966-04-19'
      thread: democratic-party
      c: The White House. Mrs. Johnson's tea for 3,600 Democratic women in Washington for a three-day conference and workshop, in three waves, the first of about 1,200 at 2 p.m. Johnson comes in; they rush him, kissing his face and hand. Photograph of the women on the steps and porch. In the crush an antique lamp in the Red Room and a bust of Henry Clay topple.
      n: '[[w.johnson-white-house-diary]], 383–85 (Lady Bird Johnson''s account). Dorothy McCardle and the United Press are quoted by Mrs. Johnson. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-06-03.program
      when: June 3
      date: '1966-06-03'
      thread: program
      also:
      - latin-america-dominican-republic
      - space
      - vietnam-elections
      c: 'Air Force One, to the Ranch. Johnson: "It''s been the best week we''ve had in a long time . . . ." Three things, by Mrs. Johnson: a peaceful election in the Dominican Republic; the soft landing of Surveyor on the moon; and the South Vietnamese government''s asking for United Nations supervision of elections.'
      n: '[[w.johnson-white-house-diary]], 386 (Lady Bird Johnson''s account). She writes on June 4 "Yesterday." See [[cal.1966-06-02.space]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-06-04.elections-1966
      when: June 4
      date: '1966-06-04'
      thread: elections-1966
      c: Texas, the Democratic primary runoff. Johnson and Mrs. Johnson vote at the Courthouse a little before 4 p.m.
      n: '[[w.johnson-white-house-diary]], 386 (Lady Bird Johnson''s account). The town is not given. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:tx
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-06-28.conservation
      when: June 28
      date: '1966-06-28'
      thread: conservation
      c: The White House. A Beautification Committee meeting views Nathaniel Owings's model of the Mall.
