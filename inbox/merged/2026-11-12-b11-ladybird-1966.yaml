      when: Aug. 1
      date: '1966-08-01'
      thread: jobs-and-wages-airlines
      c: 'The White House, evening. Johnson with Califano; legislation on the Hill "had gone very badly"; Congress, determined to do something, will direct the President to "use his discretion" to end the strike, leaving him to sign or veto. Mrs. Johnson: "a sharp and skillful knife to insert between the President and Labor."'
      n: '[[w.johnson-white-house-diary]], 402 (Lady Bird Johnson''s account). See [[cal.1966-07-31.jobs-and-wages-airlines]]. Made public: 1970. Names: Johnson, Califano.'
