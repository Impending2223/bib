patch: 2026-11-26-via-notes-c
by: 'reader (via-notes batch c); audited on Opus, Nov. 26, 2026 (notes/via-read/audit-c.md): the cite of Fursenko and Naftali 271 n.27 dropped (the entry already cites "271 and n.27" on those words), the parenthetical on Yang II, 3 n.2 made exact'
ops:
  - cite:
      id: cal.1961-01-21.china-leadership-3
      item: '[[w.jianguo-yilai-mao-zedong]], XV, 482–83 nn.1–3 (the communiqué printed Jan. 21; Mao''s comments and additions to the draft; the passage on capital construction and the pace)'
      'on': '*Renmin ribao* 人民日报 prints the communiqué of the Ninth Plenum of the Eighth Central Committee, as revised by Mao 毛泽东: capital construction cut and the pace adjusted in 1961;'
  - cite:
      id: cal.1961-02-24.soviet-union
      item: '[[w.fursenko-khrushchevs-cold-war]], 345 n.29 (the Albanian congress''s attack before the Pospelov delegation)'
      'on': The Presidium, after the Albanian party's congress attacks Khrushchev before a Soviet delegation under Pospelov.
  - cite:
      id: cal.1961-03-25.china-leadership-7
      item: '[[w.yang-shangkun-riji]], I, 667 n.1 (the directive named)'
      'on': the Center has issued a directive on it, sent to the printers that day.
  - cite:
      id: cal.1961-05-08.china-leadership-3
      item: '[[w.yang-shangkun-riji]], II, 3 n.2 (the revision named: of the draft regulations for the rural people''s communes, the business of the work conference of May 21–June 12)'
      'on': the meeting agrees his plan for the delegation's work, takes up revision of the draft commune regulations, and hears Bo Yibo on industrial output.
