patch: b3-followups-13
by: 'Claude (merger, Nov. 4, 2026): the pinpoints notes/book-checks/macv-command-history.md held for entries then pending'
ops:
- cite:
    id: cal.1964-09-20.vietnam
    item: '[[w.macv-command-history-1964]], 122–24, 192 (the rising of Sept. 19–20 at four camps; Ban Mê Thuột and Gia Nghĩa
      the objectives; Ban Mê Thuột''s garrison warned by American advisers; the stand-off and Khánh''s acceptance of the surrender,
      with amnesty; Bon Sar Pa, 192)'
- primary:
    id: cal.1964-09-20.vietnam
    text: '[FRUS 1964–68, I, doc. 358](https://history.state.gov/historicaldocuments/frus1964-68v01/d358), Saigon 937, Sept.
      24, 1964 (the Rhade uprising in Darlac; the aims: better treatment, Montagnards in office, aid, autonomy).'
- cite:
    id: cal.1964-06-20.vietnam
    item: '[[w.macv-command-history-1964]], 9, 188 (Westmoreland COMUSMACV, June 20)'
    units: all
- cite:
    id: cal.1965-03-06.vietnam
    item: '[[w.macv-command-history-1965]], 37–38 (Westmoreland''s answer to the JCS: the Viet Cong hold the initiative; in
      six months the South''s forces clustered about the cities, "end the war" groups; his recommendations: all available
      tactical air, coastal surveillance, a MEB to Đà Nẵng)'
    units: all
- cite:
    id: cal.1965-03.vietnam-force-levels
    item: '[[w.macv-command-history-1965]], 38–39 (the Commander''s Estimate of Mar. 26: RVNAF built up to the maximum, a
      division on the Qui Nhơn–Pleiku axis, a brigade at Biên Hòa–Vũng Tàu, a MEB in I Corps, some 33,000 men, by June 1965;
      the force ratios)'
    units: all
- cite:
    id: cal.1965-06-24.vietnam-force-levels
    item: '[[w.macv-command-history-1965]], 40–41 (Westmoreland''s exception to any withdrawal and to 23 battalions as a ceiling;
      another division; the 44-battalion force to establish a favorable balance by the year''s end)'
    units: all
- check:
    id: cal.1965-06-24.vietnam-force-levels
    text: 'Check: the entry''s MAC 3240 against the History''s MAC 3237 and 3320.'
- cite:
    id: cal.1965-06-27.vietnam-operations
    item: '[[w.macv-command-history-1965]], 166–67, 480 (June 27–30; two ARVN airborne battalions, the 48th Regiment, the
      Australians; over 25 enemy killed, 200 tons of food and supplies destroyed, some 50 tons of rice recovered; "the first
      time in over a year" friendly forces in War Zone D)'
    units: all
- check:
    id: cal.1965-03.vietnam-force-levels
    text: 'Check: the History dates the estimate Mar. 26 (38–39).'
