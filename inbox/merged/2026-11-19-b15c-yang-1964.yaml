        n: '[[w.yang-shangkun-riji]], II, 429–432 (Dec. 3, 1964). The words: 午饭后到晚饭时(7时)一直在老安家中汇报情况……晚饭后到10时，继续汇报 (II, 429). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: An Yumi, Yang Shangkun.'
