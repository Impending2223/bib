        c: 'Niujiao 牛角, at An Yumi''s 安于密, to 7 p.m. and after dinner to 10. All nine teams'' reports pooled; Niujiao''s features and the next stage discussed. Yang Shangkun''s 杨尚昆 judgment: most cadres gravely "four-unclean," some degenerated into a rich stratum; the brigade''s center team no. 4, its leader Zhang ×× 张×× (so the editors), a Party member, holding Party and administrative power, of a landlord family, once a bao clerk; the democratic revolution unfinished; the collective weak, about 30 percent of households a month or more short of grain.'
