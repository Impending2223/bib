      id: cal.1964-09-28.elections-1964-johnson
      when: Sept. 28
      date: '1964-09-28'
      thread: elections-1964-johnson
      c: 'New England, at one of the stops, by White''s account. Johnson urges one of New England''s most distinguished Senators, unnamed, to join the press bus and tell the correspondents the crowds are bigger than Kennedy''s: "If you tell them, they''ll believe you—they won''t believe Jack [Valenti]." The Senator demurs.'
      n: '[[w.white-making-of-the-president-1965]], 367. Check: the day; White places it on the New England tour. See [[cal.1964-09-28.elections-1964]]. Names: Johnson, Kennedy, Valenti.'
      src:
