- add:
    entry:
      id: cal.1964-10-16.conservation
      when: Oct. 16
      date: '1964-10-16'
      thread: conservation
      c: 'The South Lawn, the morning, between the news of Khrushchev''s fall and of China''s bomb. Johnson plants a laurel oak and a willow oak: "the real work of any President is not for his own time but times to come." "We have a change of leadership in the Soviet Union and we have an announcement that the Chinese have detonated their bomb." Heaving the dirt, by White''s account: "I did this for a living for two years from dawn-up to sunset."'
      n: 'Remarks at a Tree-Planting Ceremony at the White House, [1963–64 Pub. Papers 1355](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=595) (Oct. 16, 1964). [[w.white-making-of-the-president-1965]], 372 (the ceremony between the morning''s meetings; the shovel and the words to it). Names: Johnson, Khrushchev.'
      src:
        c: 33e99653
        rows:
