      c: 'Cleveland, the Governors'' Ball. John Bailey, the Democratic National Chairman, asked whether the Democrats too could make news of the conference: "I hope not." Romney, Scranton and his wife stay for the ball.'
      n: '[[w.white-making-of-the-president-1965]], 153. See [[cal.1964-06-09.elections-1964]]. Names: Romney, Scranton.'
