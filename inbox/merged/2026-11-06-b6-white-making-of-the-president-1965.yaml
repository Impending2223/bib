      when: Nov. 22
      date: '1963-11-22'
      thread: elections-1964-scranton
      c: 'Harrisburg. Scranton, presiding over a lunch, told the news in mid-sentence, finishes the sentence: "Gentlemen, the President is dead." A minute of prayer; he goes to the Pine Street Presbyterian Church.'
      n: '[[w.white-making-of-the-president-1965]], 6. Names: Scranton.'
