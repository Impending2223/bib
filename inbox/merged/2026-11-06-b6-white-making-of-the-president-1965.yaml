      id: cal.1964-06.elections-1964-2
      when: June
      date: 1964-06
      thread: elections-1964
      also:
      - vietnam
      c: 'Rockefeller, riding home to Tarrytown, N.Y., from New York a few days after his defeat in California, by White''s account, talks of the worsening situation in Vietnam: "Sometimes with a defeat there''s a gain—there are things you don''t have to worry about any more, like do you have to take the country into war over Vietnam."'
      n: '[[w.white-making-of-the-president-1965]], 139. Check: the day. See [[cal.1964-06-02.elections-1964]]. Names: Rockefeller.'
      src:
