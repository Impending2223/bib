patch: 2026-11-13-b13-risen
by: 'Claude (b13-risen: Risen, The Bill of the Century, PDF text to printed p. 145), Nov. 12-13, 2026; audited by Claude (Opus), Nov. 13, 2026'
ops:
- add:
    entry:
      id: cal.1963-10-21.civil-rights-bill
      when: Oct. 21
      date: '1963-10-21'
      thread: civil-rights-bill
      c: 'Libonati, late in the afternoon, to Harvard undergraduates lobbying on Capitol Hill for the bill: he will
        withdraw his amendment. The Harvard Crimson reports it next day.'
      n: '[[w.risen-bill-of-the-century]], 124 (the students'' visit). To check: *Harvard Crimson*, Oct. 22, 1963,
        "Lobbyists Press for Civil Rights Bill" (cited by [[w.risen-bill-of-the-century]], 124 n.30). See [[cal.1963-10-10.civil-rights-bill]].
        Names: Libonati.'
      tags:
      - name:libonati-roland-v
      src:
        c: '9ef261dd'
        rows:
        - 'w.risen-bill-of-the-century 124: all'
- add:
    entry:
      id: cal.1963-10-21.civil-rights-bill-2
      when: Oct. 21
      date: '1963-10-21'
      thread: civil-rights-bill
      c: McCulloch, told that Libonati will withdraw his amendment, telephones Robert Kennedy's office. Kennedy out;
        a message left, which Kennedy later swears he never had.
      n: '[[w.risen-bill-of-the-century]], 124–25 (the call; McCulloch "had known the day before," 125). See [[cal.1963-10-21.civil-rights-bill]].
        Names: McCulloch, Libonati, Robert Kennedy.'
      tags:
      - name:mcculloch-william-m
      - name:libonati-roland-v
      - name:kennedy-robert-f
      src:
        c: '52ee1614'
        rows:
        - 'w.risen-bill-of-the-century 124–25: all'
- add:
    entry:
      id: cal.1963-07-17.civil-rights-bill-2
      when: July 17
      date: '1963-07-17'
      thread: civil-rights-bill
      c: 'Satterfield, in a memorandum, plans a Coordinating Committee for Fundamental American Freedoms against
        the civil rights bill: offices near Capitol Hill, a research staff, files on vulnerable Senators, witnesses,
        pamphlets and ads, mailing lists, editorial pages in the Midwest and mountain States; $100,000 for six months.'
      n: '[[w.risen-bill-of-the-century]], 98–99 (the memorandum of July 17; later William Loeb chairman, Kilpatrick
        vice chairman, Draper''s $215,000 by way of the Mississippi State Sovereignty Commission, 99). To check: "Rough
        Memo Concerning Preparation for Work of the Committee to Defeat the Civil Rights Act of 1963," box 17, Filvaroff
        and Wolfinger Papers, University at Buffalo Library (cited by [[w.risen-bill-of-the-century]], 99 n.74).'
      tags: []
      src:
        c: 39123b2d
        rows:
        - 'w.risen-bill-of-the-century 98–99: all'
- add:
    entry:
      id: cal.1963-07-11.civil-rights-bill
      when: July 11
      date: '1963-07-11'
      thread: civil-rights-bill
      c: 'Washington, the Mayflower Hotel. Satterfield''s first off-the-record breakfast for his committee against
        the civil rights bill: seventy-five representatives of the Chamber of Commerce, the American Bar Association
        and other groups; none agrees to join.'
      n: '[[w.risen-bill-of-the-century]], 99 (the breakfast; the meeting in Chicago, undated, a bigger failure by
        the account of Synon, the committee''s staff director). To check: John Synon, interview by Raymond Wolfinger,
        Sept. 7, 1965, box 22, Filvaroff and Wolfinger Papers, University at Buffalo Library (cited by [[w.risen-bill-of-the-century]],
        99 n.75).'
      tags: []
      src:
        c: aea5b59e
        rows:
        - 'w.risen-bill-of-the-century 99: all'
- add:
    entry:
      id: cal.1963-06-07.civil-rights-bill
      when: June 7
      date: '1963-06-07'
      thread: civil-rights-bill
      c: 'Biemiller of the AFL-CIO leaves a memorandum at the White House on the coming bill, labor''s position: "The
        package is inadequate"; fair employment wanted.'
      n: '[[w.risen-bill-of-the-century]], 108. To check: "Labor Views on Administration Civil Rights Program," June
        7, 1963, box 9, Filvaroff and Wolfinger Civil Rights Act Papers, University at Buffalo Library (cited by [[w.risen-bill-of-the-century]],
        108 n.100). Names: Biemiller.'
      tags:
      - name:biemiller-andrew-j
      src:
        c: '4466fb6d'
        rows:
        - 'w.risen-bill-of-the-century 108: all'
- add:
    entry:
      id: cal.1963-06-07.civil-rights-bill-2
      when: June 7
      date: '1963-06-07'
      thread: civil-rights-bill
      c: 'Biemiller, called by Meany from Italy that afternoon, sees Kennedy on the AFL-CIO''s memorandum. By Biemiller''s
        account Kennedy says they will "kill the bill"; fair employment not as important as the rest: "I can''t go
        with you."'
      n: '[[w.risen-bill-of-the-century]], 108 (Biemiller''s recollection; "kill the bill" his paraphrase). To check:
        Biemiller, interview by Stern, May 24, 1979, JFK Library (cited by [[w.risen-bill-of-the-century]], 108 n.101).
        See [[cal.1963-06-07.civil-rights-bill]]. Names: Biemiller, Meany, Kennedy.'
      tags:
      - name:biemiller-andrew-j
      - name:meany-george
      - name:kennedy-john-f
      src:
        c: 'a839a5c2'
        rows:
        - 'w.risen-bill-of-the-century 108: all'
