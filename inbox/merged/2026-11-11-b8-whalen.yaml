    item: '[[w.whalen-longest-debate]], 217 (Kennedy and Bayh by private plane to New England after the final roll call on
      H.R. 7152; fog and a thunderstorm; the plane plunges into an apple orchard; the pilot and a member of Kennedy''s staff
      killed; Bayh drags Kennedy from the plane; Kennedy seriously injured; not Moss''s name, the broken back or the place)'
    units: '?'
