    id: cal.1964-06-19.congress
    text: 'Check: Whalen, 217, has the convention at Springfield and the plane approaching Barnes Airport, Westfield; Bayh
      and his wife with minor injuries; Kennedy in Cooley Dickinson Hospital.'
