    units: B
- cite:
    id: cal.1960-09-12.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 353–355 (the Reply: it answers the notice''s contradictions and its misstatements of China''s views; the 1957 memorandum, in which China had set down its reservations to the Moscow Declaration, is attached as an annex so that all brother parties see it; the Reply answers the claims that revolution can come by peaceful coexistence, that China is against negotiating, and Khrushchev''s abuse at Bucharest; "head" does not mean father party)'
    units: A
- cite:
    id: cal.1960-09-07.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 355–357 (the Reply''s five proposals: Marxism–Leninism and the 1957 declarations the basis of unity; relations equal and comradely; disputes settled by calm discussion, not by vote; no word or act to harm the parties'' unity; the November conference to be prepared by consultation; the Standing Committee on Sept. 7, at Mao''s, all stressed these, finished the Reply at the meeting, and the experts'' group had it translated)'
    units: B
- cite:
    id: cal.1960-09-13.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 358 (the Standing Committee at Mao''s house, the evening of the 13th, on the line for the talks: it expects a sharp quarrel; the delegation to test whether the Soviets want unity or Bucharest''s pressure; Mao and Liu say both may be; Khrushchev agreed to the talks, Wu says, under pressure from the Vietnamese party and others)'
    units: B
- variant:
    id: cal.1960-09-12.china-leadership
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
