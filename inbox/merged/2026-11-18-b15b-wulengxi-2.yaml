      - 1960-11-15T09:00Z
      time_band: morning
      time_zone: Europe/Moscow
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The conference, morning: delegates of six parties name and criticize the Chinese Party.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 384 ("the 15th", six parties naming China). Made public: 1999. See [[cal.1960-11-14.soviet-union-2]].'
      tags:
      - polity:prc
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
