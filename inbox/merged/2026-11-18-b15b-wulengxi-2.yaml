- add:
    entry:
      id: cal.1960-10-02.soviet-union
      when: Oct. 2
      date: '1960-10-02'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The drafting committee of twenty-six parties opens, to prepare a draft statement for the world conference. The CPSU prepared the draft. The Chinese delegation, having criticized the CPSU''s views in the Reply and the party talks, finds that the Soviets have patched it: some Marxist-Leninist principles added, some plain errors cut, many errors left. The committee sits three weeks.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 365–367 (from Oct. 2; the Chinese in strength, most of the writers with them; Wu and Chen Boda in Peking turn the delegation''s cables into suggestions for the Standing Committee). Made public: 1999. Names: Chen Boda. Check: the account is the Chinese delegation''s.'
      tags:
      - polity:prc
      - name:chen-boda
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia
      src:
