    at: 365–367
- cite:
    id: cal.1960-10-24.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 366–367 (after three weeks the committee had no agreed text; four "nails" in the Soviet draft by Wu''s account: the Twentieth Congress''s line wholly right; unnamed attacks on "factional activity"; condemnation of the personality cult; war avoidable; the revised text and the open points to go to the November conference)'
    units: D
- variant:
    id: cal.1960-09-19.soviet-union
