- add:
    entry:
      id: cal.1960-09-17.soviet-union
      when: Sept. 17
      date: '1960-09-17'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The talks of the CPSU and the CCP open. Suslov leads the Soviet side, with Kozlov, Andropov and Pospelov; for China Deng Xiaoping, Peng Zhen, Lu Dingyi and Kang Sheng. Suslov speaks first: the CPSU wants the differences gone; on a first reading of the Reply they have grown; the Reply is full of anti-Marxist-Leninist views, the gravest attack on the CPSU since Trotsky in the twenties; he answers it at length. Deng: the CPSU''s notice was grave and the Reply answers it, as it answers the withdrawal of the experts and the tearing up of contracts; the CPSU has made no self-criticism. At the close he asks where the Soviets mean to take the ideological differences.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 358–360 (the first day; Suslov spoke first). Made public: 1999. See [[cal.1960-09-15.soviet-union]]. Names: Suslov, Kozlov, Andropov, Deng Xiaoping, Peng Zhen, Lu Dingyi, Kang Sheng. Check: the account is the Chinese delegation''s.'
      tags:
      - polity:prc
      - name:suslov-mikhail-a
      - name:kozlov-frol-r
      - name:andropov-yuriy-vladimirovich
      - name:deng-xiaoping
      - name:peng-zhen
      - name:lu-dingyi
      - name:kang-sheng
      - vis:only:prc+ussr
      src:
