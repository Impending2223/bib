      c: Moscow. The delegation's work at the conference over, Liu Shaoqi begins an official visit to the USSR as head of state, with Li Jingquan, Lu Dingyi, Yang Shangkun, Liu Xiao, Liu Ningyi and advisers, Wu Lengxi and Qiao Guanhua among them. At 10 p.m. he leaves Moscow by special train for Leningrad; Brezhnev sits with him awhile and says little. Deng Xiaoping, Peng Zhen, Kang Sheng, Hu Qiaomu, Liao Chengzhi and the rest fly home that night.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 430–431 ("at 10 o''clock in the evening" of Dec. 2). Made public: 1999. See [[cal.1960-12-01.soviet-union-2]]. Names: Liu Shaoqi, Li Jingquan, Lu Dingyi, Qiao Guanhua, Brezhnev, Deng Xiaoping, Peng Zhen, Kang Sheng.'
