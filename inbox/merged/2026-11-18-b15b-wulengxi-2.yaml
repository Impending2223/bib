      c: 'Moscow. At the talks of the 21st the Chinese delegation, after asking Peking, proposes that the two parties'' talks end for now: the differences are large and cannot be settled at once; the drafting committee meets soon, and what is open can wait for it. The Soviet side whispers together and agrees.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 363 (the talks of the 21st). Made public: 1999. See [[cal.1960-09-20.soviet-union]].'
      tags:
      - polity:prc
      - vis:only:prc+ussr
      src:
