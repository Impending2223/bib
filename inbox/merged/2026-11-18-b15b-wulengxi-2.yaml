      c: Peking. The delegation at Moscow cables each day's session to the Center. Mao presides at the Standing Committee many times on its reports and requests, and answers by cable.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 363–364 (no days given). Made public: 1999. See [[cal.1960-09-17.soviet-union]]. Names: Mao Zedong. Check: the days; Wu gives none, only that it was "many times" while the delegation was in Moscow.'
      tags:
