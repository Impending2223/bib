- cite:
    id: cal.1961-10-20.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 475–478 (Liu''s meeting of Oct. 20 on a conference of brother parties, should Khrushchev ask one; Liu had settled the line with Mao by telephone: resist, never attend; Deng: since the 81-party meeting the CPSU, bound a little by the Statement, calmer in public, not within; before the Congress unnamed attacks on China as expositions of the Programme; Albania attacked for backing China at Bucharest and Moscow, the chicken killed to scare the monkey; another argument unavoidable, in theory first; no conference without Albania; the mass organizations of Asia, Africa and Latin America kept; Liu''s four cases: Albania absent, China absent; Albania and China asked, Sino-Soviet talks first; no agreement in preparing it, oppose it and stay away; held anyway with twenty or thirty parties, stay away and issue a statement; Zhou''s address in answer to Khrushchev needed and measured; the result cabled to the delegation at Moscow)'
    units: B, C, D
- variant:
    id: cal.1961-10-20.china-leadership
