      c: Peking, then Moscow. Liu Shaoqi leaves in the morning for Moscow by Tu-104, with Deng Xiaoping, Yang Shangkun, Hu Qiaomu, Lu Dingyi, Wu Lengxi and Qiao Guanhua. At Moscow Khrushchev and Brezhnev, then Chairman of the Presidium of the Supreme Soviet, meet him. Brezhnev's welcome is cool. Liu's reply is applauded four times, longest at the 860 million people of the two countries. To his hosts he says the delegation has come to make the conference a success and to strengthen Sino-Soviet unity, and, if it goes well, he will make a state visit. The delegation lodges in three villas on the Lenin Hills, Liu, Deng and Peng Zhen each in one; the staff go to the Chinese embassy.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 369–372 ("the morning of Nov. 5" (369); the landing day not given, but Liu (446) says the Chinese reached Moscow on Nov. 5). Made public: 1999. See [[cal.1960-11-04.soviet-union]]. Names: Liu Shaoqi, Deng Xiaoping, Lu Dingyi, Qiao Guanhua, Khrushchev, Brezhnev, Peng Zhen. Check: the hour of landing; Wu gives the morning of departure only.'
