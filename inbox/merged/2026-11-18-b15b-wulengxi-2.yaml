    reads: Khrushchev went to the United Nations in mid-October, and took the heads of six East European states with him
    at: 366–367
- cite:
    id: cal.1960-11-02.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 368 (the delegation as Wu lists it: Liu head, Deng deputy; members Peng Zhen and Li Jingquan, alternates Lu Dingyi and Kang Sheng, the Secretariat''s alternate secretaries Yang Shangkun and Hu Qiaomu, three Central Committee members Liu Ningyi, Liao Chengzhi and Liu Xiao; many advisers, Wu and Qiao Guanhua among them; Wu was to have stayed in Peking, and went because Liu''s state visit after the conference needed hands)'
    units: B
- cite:
    id: cal.1960-11.soviet-union
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 377–378, 424 (the conference opened Nov. 10, in the afternoon, in the Kremlin''s St. George''s Hall; its plenary and signing Dec. 1; the Chinese delegation''s account of the sessions, 377–441)'
    units: A
- cite:
    id: cal.1960-11-13.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 381–384 (Deng''s speech of Nov. 14 as Wu gives it: much of the Reply of Sept. 10, a dozen matters; Mao''s order, given before the delegation left, to keep some shot back: the Korean War, the joint fleet, the long-wave station, Soviet air forces in China)'
    units: A
- check:
    id: cal.1960-11-16.china-leadership
    text: 'Check: the day: Wu (387) has the delegation cable Peking on the night of the 15th and Zhou Enlai telephone the embassy at Moscow the next morning, "discussed, agreed"; this meeting is the evening of the 16th.'
- cite:
    id: cal.1960-11-28.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 407–409 (the Center''s answer, which reached the delegation after dinner of the 28th: the neutral parties waver, most not ready to break with Khrushchev, all progressive forces want the conference to succeed, so seek agreement now, no longer the edge of a break; four cases: all nails out and no internal resolution, sign; the nails kept and an internal resolution, refuse; the nails out and a resolution against China or by majority, sign and issue a statement against it; factional activity and national communism out, the Twentieth Congress kept, a resolution, the likeliest, sign after changing the Twentieth''s wording, with a statement; in any case the delegation to issue its own statement; an Appeal like 1957''s)'
    units: C, D, E
- cite:
    id: cal.1960-12-03.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 438–442 (Wu''s account of the talks with the Vietnamese delegation, Hồ Chí Minh, Lê Duẩn and Hoàng Văn Hoan, on its way home from Moscow, early December: Mao thanks Hồ as peacemaker, peace and quarrels alternate, the principle of consultation to agreement the chief result, the gentleman''s agreement to stop mutual attacks; Hồ: no more cigarettes thrown, hand them round; Deng and Peng Zhen on the conference; Mao: not all the shot fired, Khrushchev afraid of Deng''s stick; of Hồ''s midnight call, Mao: not yet time, a day short; Zhou: the Center''s cable was drafted to give ground only when Khrushchev gave)'
    units: A
- cite:
    id: cal.1960-12-09.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 438 (Liu left Irkutsk by air in the afternoon and reached Peking very late; Mao, the Standing Committee, the whole Politburo, the NPC Standing Committee''s chairman and vice-chairmen and the heads of the democratic parties were at the airport)'
    units: A
- cite:
    id: cal.1961-01-14.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 442–445 (the plenum on Deng''s report on the Moscow meeting: the meeting the largest, longest, fiercest yet, its result fairly good; the open argument from TASS''s statement of Sept. 9, 1959 to the meeting, fifteen months; the CPSU''s means, cold treatment, watching, pressure, siege, fatigue, and its two trumps, pressure and the majority; Deng''s four gains: a good statement, the lid off, the Marxist-Leninist ranks tempered, consultation to agreement set up between the parties; Wu has the plenum decide to put its strength into home adjustment from 1961)'
    units: B
- cite:
    id: cal.1961-01-18.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 449–451 (Mao''s long speech before the plenum closed on the 18th: of the international matter, the Center investigated well and so was resolute; Khrushchev rushed to Bucharest and to the decision sent down to the branches, fearing the three articles; he called them and Deng''s speech ("Nov. 10") China''s factional programme; the 81-party meeting a great success; unity now, even with parties that cursed China; no struggle now, last year''s was needed; Marxism-Leninism to be made concrete in each country, as trunk and branches)'
    units: B
- cite:
    id: cal.1961-01-04.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 452 (Zhou led the government delegation to Burma in January 1961 to exchange the instruments of ratification of the boundary treaty and complete its legal steps; signed before the Moscow conference)'
    units: A
- cite:
    id: cal.1961-10-15.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 469 (the delegation left Peking by air on the 15th for Moscow; Khrushchev met Zhou at the airport himself and went with him to the villa, talking and laughing on the way)'
    units: A
- cite:
    id: cal.1961-10-18.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 471–472 (after Khrushchev''s report, the delegation cabled Peking; Liu Shaoqi convened the Politburo, which decided to add to Zhou''s address a passage against the open attack on Albania; Wu drafted it; the Center amended it and Mao approved)'
    units: B
- check:
    id: cal.1961-10-18.china-leadership
    text: 'Check: Wu (471–472) has Liu Shaoqi convene the Politburo, which decided on the passage, with Mao approving the text after; this entry has Mao''s meeting with Liu, Deng and Yang.'
- cite:
    id: cal.1961-10-19.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 472 (the added passage, as Wu gives it: disputes between brother parties to be settled patiently, in the spirit of proletarian internationalism, equality and consultation; public one-sided charges against any brother party do not help unity or a settlement; to show disputes to the enemy is not serious Marxist-Leninist conduct; the speech of the 19th, not naming Khrushchev)'
    units: C, D, E
- variant:
    id: cal.1961-10-22.china-leadership-2
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: 'the talks of the 22nd: the Chinese Zhou Enlai, Peng Zhen and the rest of the delegation; the Soviet Khrushchev, Mikoyan, Suslov and Brezhnev; no mention of Kozlov or Andropov'
    at: '473'
- cite:
    id: cal.1961-10-22.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 473–474 (Zhou rebukes Khrushchev for the open attack on Albania in his report, and its steps: the Warsaw Treaty resolution of March, the Vlora withdrawal of May, the refusal of the Albanian delegate in August; Mao''s talks on Stalin with Mikoyan in April 1956 and Yudin in October and November 1956, Liu''s and Zhou''s with Khrushchev in October–December 1956, the two *Renmin ribao* articles; Khrushchev refuses, says China backs the anti-party group, he will back the anti-party in the Chinese Party, "now we are strong, we go our own way"; no conference of brother parties raised)'
    units: A
- cite:
    id: cal.1961-10-24.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 478 (Mao, with Zhou, Liu and Deng, to the Yinian Tang for Zhou''s account of the talks with Khrushchev; Zhou: at the Congress over forty delegation heads followed Khrushchev against Albania, thirty-two did not; Khrushchev refused China''s criticism, but without strength; Wu was not at the meeting)'
    units: B
- cite:
    id: cal.1961-10-25.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 478–479 (Zhou, in his office, tells Wu of the plan settled at the Yinian Tang: *Renmin ribao* to print together the Soviet and Albanian papers'' documents on Soviet–Albanian relations at the Congress; Wu does so)'
    units: A, B
- cite:
    id: cal.1961-10-30.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 480 (Peng Zhen, acting head of the delegation, home Oct. 30, reports to the Standing Committee; some analysis of the Congress, no detailed talk, the Center being busy preparing the Central Work Conference)'
    units: B
- cite:
    id: cal.1961-11-17.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 479 (Aidit, home from the Congress through Peking, tells Mao that when Soviet or other delegates attacked Albania he took notes)'
    units: A
- cite:
    id: cal.1961-11.vietnam-hanoi
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 479 (Hồ Chí Minh to Mao, after the Congress: at the attack on Albania he did not applaud; how those on the rostrum behaved: Ghose of India looked at his papers, Aidit and Gollan of Britain took notes, Nosaka closed his eyes, Hồ and Lê Duẩn put hands under the table; Peng Zhen laid his flat on the table, still)'
    units: A
- cite:
    id: cal.1962-01-27.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 482–486 (Liu, in his speech explaining the written report, takes the international matter first: Moscow-type revisionism from the Twentieth Congress, now a fair system after the Twenty-second, the "four antis"; the 1957 and 1960 meetings checked but did not bind; the Soviet break with Albania; the Soviets as bad to friends, mild to foes; division of the movement unavoidable, good in a sense; for Sino-Soviet relations three possibilities, as now, worse without a break, an open break, cadres to prepare for the worst; self-reliance, trade with imperialism if Soviet trade stops)'
    units: C
- cite:
    id: cal.1962-01-30.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 488–489 (Mao on the Soviet relation: not necessarily Albania''s way; if the USSR breaks, China need not; it asks talks and proposes a conference of the 81 parties; break to be avoided or put off even for a bad appearance of none; no counter-articles now, let them curse; the Seven Thousand stand for 650 million people and fear no isolation; 90 percent of the world will in the end stand with China; the page opening the passage, 487, is missing from the scan)'
    units: F
- cite:
    id: cal.1961-06-12.china-leadership-3
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 453 (Phạm Văn Đồng invited in June)'
    units: A
- cite:
    id: cal.1961-06-13.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 453 (Sukarno invited in June)'
    units: B
- cite:
    id: cal.1961-07-10.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 453 (the treaty of friendship, cooperation and mutual assistance with the DPRK signed in July)'
    units: D
- cite:
    id: cal.1961-10-03.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 453 (the Sino-Nepalese boundary treaty signed in October)'
    units: B
- cite:
    id: cal.1961-05-16.laos
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 453–454 (the Chinese delegation under Chen Yi, Vice-Premier and Foreign Minister, at the first stage of the conference, May to July; it settled the Chinese plan first with the DRV and the Soviets, then with the three princes; Gromyko''s delegation in a supporting part; China and Vietnam in the front line against the Americans, with Souphanouvong; China and the USSR little at odds)'
    units: A
