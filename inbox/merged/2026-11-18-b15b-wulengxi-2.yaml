- cite:
    id: cal.1960-11-04.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 368–369 (Wu''s account of the several meetings of the Politburo and its Standing Committee before the delegation left, no day given: Khrushchev, after the party talks and the drafting committee, holds to his line and will press China with a larger so-called majority; whether he will break uncertain, China being no small party, the Asian, African and Latin American parties near it, the Western parties unwilling to follow him to a break, the Soviet party and people friendly to China; Mao: a bitter fight, the debate sharp, perhaps to the edge of a break, be ready for one, agreement still possible; the line: hold to principle and to unity, fight freely, fear no break, win unity and a measure of agreement by struggle; the delegation to act as occasion serves, cable major questions to Peking, in an emergency act first and report after)'
    units: A
