      c: Moscow. Liu Shaoqi returns at 10 a.m.; Mikoyan and the other members of the Presidium meet him at the station. In the afternoon he visits the Likhachev auto works; in the evening, at the Bolshoi, he sees Ulanova in ballet fragments.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 432 ("10 o''clock in the morning"; "in the afternoon"; "in the evening"). See [[cal.1960-12-05.soviet-union]]. Names: Liu Shaoqi, Mikoyan.'
