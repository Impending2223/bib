- add:
    entry:
      id: cal.1961.soviet-union
      when: '1961'
      date: '1961'
      thread: soviet-union
      also:
      - china
      c: 'Moscow. The World Federation of Trade Unions'' meeting. Soviet delegates put disarmament and the "world without arms, armies or wars" first, above everything; delegates of Asia, Africa and Latin America, under old and new colonial rule, oppose it. The Chinese say disarmament is not above everything: peoples'' national independence, national economies, workers'' struggles in Europe and America against monopoly must have support. The Soviet delegates are isolated even in Moscow.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 454–455 ("in 1961"; the day not given). Check: the date, and the Chinese delegates'' names; Wu gives the year only.'
      tags:
      - polity:prc
      src:
        c: 60f68c87
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 454–455: all'
- add:
    entry:
      id: cal.1961.soviet-union-2
      when: '1961'
      date: '1961'
      thread: soviet-union
      also:
      - china
      c: New Delhi. The Afro-Asian Solidarity Council's meeting. Soviet delegates again put disarmament and the "world without arms" first and are left cold. India's delegate, for fear of offending the United States, whose aid it wants, will not raise the anti-colonial banner, which Afro-Asian and Latin American delegates resent. The Chinese call for support of peoples' struggles against old and new colonialism and national independence and economies, and most delegates agree.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 454–455 ("in 1961"; the day not given). See [[cal.1961.soviet-union]]. Check: the date and the Chinese delegates'' names; Wu gives the year only.'
      tags:
