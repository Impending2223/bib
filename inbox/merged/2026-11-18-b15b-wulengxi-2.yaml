- add:
    entry:
      id: cal.1960-09-19.soviet-union-2
      when: Sept. 19
      date: '1960-09-19'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. Second session. Kozlov speaks first: the Reply is grave and cannot be accepted; the differences are the Chinese Party''s doing; since Bucharest it has attacked parties without naming them, as in *Renmin ribao*, a *Guizhou ribao* article and *Hongqi*''s "Emancipate the mind"; why does it raise old differences and set the Soviets against Poland and Hungary; the Twentieth Congress and Stalin; let China take up the substance: the era, war and peace, disarmament, coexistence. Deng and Peng Zhen answer point by point: do not quibble, face the facts, an error is an error. Andropov and Pospelov break in; Suslov, red in the face, joins them. Deng proposes to adjourn, the Chinese to reply systematically.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 360–362 (the second meeting, the 19th). Made public: 1999. See [[cal.1960-09-17.soviet-union]]. Names: Kozlov, Deng Xiaoping, Peng Zhen, Andropov, Suslov. Check: the account is the Chinese delegation''s.'
      tags:
      - polity:prc
      - name:kozlov-frol-r
      - name:deng-xiaoping
      - name:peng-zhen
      - name:andropov-yuriy-vladimirovich
      - name:suslov-mikhail-a
      - vis:only:prc+ussr
      src:
        c: f942f0ec
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 360–362: all'
- add:
    entry:
      id: cal.1960-09-20.soviet-union
      when: Sept. 20
      date: '1960-09-20'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. Third session. Deng replies in full to Suslov and Kozlov, on two matters: friend and foe, and relations among brother parties. Since the Korean War, he says, the CPSU has turned friend and foe round (the Congo, Algeria, Hungary); after the TASS statement it praised the reactionaries and attacked brother parties; Khrushchev praised Eisenhower and called China "Trotskyite" and "neither war nor peace." The CPSU is a "father party": he lists the joint fleet, the long-wave station, the experts withdrawn and contracts torn up, the ban on *Youhao* in the USSR, the border quarrels the Soviets would stir, Khrushchev''s abuse of China and Mao at the Warsaw Treaty dinner. China will make good its losses by self-reliance, asks no compensation and will repay its debt. No Soviet answer; Suslov reddens. Deng hopes the USSR will sit down and talk. The Soviet side had a joint statement drafted and does not table it.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 362–363 (the third meeting, the 20th). Made public: 1999. See [[cal.1960-09-17.soviet-union]]. Names: Deng Xiaoping, Suslov, Khrushchev. Check: the account is the Chinese delegation''s; the list of Deng''s charges is Wu''s.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:suslov-mikhail-a
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr
      src:
        c: '89c94743'
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 362–363: all'
