      c: Moscow, the Kremlin. After the plenary the CPSU gives a great reception for the delegations. Liu Shaoqi sits between Khrushchev and Brezhnev at the head table, Khrushchev cordial. Delegates who attacked China in the hall tell the Chinese that there were quarrels, some not civil, and that is past. The Chinese answer that disagreement is natural, parties differ in situation and experience, and that agreement was reached is good. Some delegations, Wu hears, had feared a break above all, and a split of the movement, which would have made going home hard for the Western parties.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 425–426 ("after the meeting"; the Kremlin banquet). Made public: 1999. See [[cal.1960-12-01.soviet-union]]. Names: Liu Shaoqi, Khrushchev, Brezhnev.'
