- add:
    entry:
      id: cal.1960-11-07.china-leadership-5
      when: Nov. 7
      date: '1960-11-07'
      time_range:
      - 1960-11-07T19:00Z
      - 1960-11-07T21:00Z
      time_band: night
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow. The Chinese delegation, reading the Soviet letter as the storm coming, has it translated a page at a time and resolves to raise the tone of its speech and to answer the charge against Liu: Liu has said Mao made Marxism–Leninism Chinese, and the letter, without naming him, calls that nationalism. Four matters to stress: where the quarrel comes from; that it is Marxism against revisionism and opportunism; that the state of relations is the CPSU''s doing though China wants unity; that parties are equal, independent, to agree by consultation, not father and son. The tone that of the wronged, come for unity and attacked on the eve. The writers revise through the night, each a part, Hu Qiaomu going over the whole, to revise again after Khrushchev speaks.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 374–375 (the letter read the same day; the revising "that night"). Made public: 1999. See [[cal.1960-11-07.soviet-union-2]]. Names: Liu Shaoqi, Mao Zedong.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 'ff3699a5'
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 374–375: all'
      follows:
      - cal.1960-11-07.soviet-union-2
- add:
    entry:
      id: cal.1960-11-05.soviet-union-2
      when: Nov. 5–9
      date: '1960-11-05'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. In the days before the conference members and advisers of the Chinese delegation call widely on the other parties'' delegations. By Wu''s account, many do not approve the CPSU''s line; some openly back China and ask it to criticize the CPSU''s errors pointedly; more disapprove of mutual charges, neither the CPSU''s charges against China nor China''s answering in kind; some say they will sign the declaration only if all agree; many want unity and no second Bucharest; not a few, on the CPSU''s baton, are ready for a fight with China.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 375–376 ("these few days"). Made public: 1999. See [[cal.1960-11-05.soviet-union]]. Check: the days; Wu says only "these few days" before the opening; the stretch given by his sequence.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: '13b44591'
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 375–376: all'
- add:
    entry:
      id: cal.1960-11-09.soviet-union-2
      when: Nov. 9
      date: '1960-11-09'
      time_range:
      - 1960-11-09T09:00Z
      - 1960-11-09T15:00Z
      time_band: afternoon
      time_zone: Europe/Moscow
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow, the Chinese delegation''s quarters, the afternoon before the conference. Suslov, Kozlov and Mikoyan call; Deng Xiaoping and Peng Zhen receive them. Khrushchev''s speech tomorrow, they say, will stress unity, friendly in tone, leave out the Sino-Soviet quarrel, keep to the draft statement and Soviet home matters; the CPSU does not want an argument at the conference, will look ahead, regards its letter as settled and unconnected with the meeting, and wants better relations with Albania. Mikoyan: after the conference the Soviets will take up trade, aid and experts with China; the oil stop, of which the Presidium did not know, will be lifted soon; experts can stay if China stops giving them papers against the CPSU''s Central Committee. Deng: China came for unity and for agreement on Marxist-Leninist ground; the letter of Nov. 5 poisoned the air and the CPSU began it, so China must answer at the conference. China will stay friendly with no Soviet aid and no experts, and build on its own strength.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 376–377 ("that afternoon", the day before the opening). Made public: 1999. See [[cal.1960-11-07.soviet-union-2]]. Names: Suslov, Kozlov, Mikoyan, Deng Xiaoping, Peng Zhen. Check: the account is the Chinese delegation''s.'
      tags:
      - polity:prc
      - name:suslov-mikhail-a
      - name:kozlov-frol-r
      - name:mikoyan-anastas
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc+ussr
      src:
        c: cb2c9ae1
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 376–377: all'
- add:
    entry:
      id: cal.1960-11-09.china-leadership-2
      when: Nov. 9
      date: '1960-11-09'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, the Chinese embassy. After the call the delegation meets. It reads the visit as an attempt to coax China into swallowing the letter, the CPSU having seen that the letter has gone badly with the parties. It will not be taken in: since the Soviets have started the quarrel, it will carry it to the conference, to rally the left, win the center and isolate the right. The speech''s tone to be raised, to leave Khrushchev no way down.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 377 (after the call). Made public: 1999. See [[cal.1960-11-09.soviet-union-2]]. Names: Khrushchev.'
      tags:
