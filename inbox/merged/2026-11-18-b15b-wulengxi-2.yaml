- add:
    entry:
      id: cal.1960-11-29.soviet-union-4
      when: Nov. 29
      date: '1960-11-29'
      time_range:
      - 1960-11-29T16:00Z
      - 1960-11-29T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The Chinese delegation tells the Albanian, Vietnamese and Korean delegations, and some capitalist-country parties near China, of the agreement with Kozlov. Albania and Korea welcome the nails'' going and ask for more, above all on the wording against the personality cult: the Koreans say the CPSU stirred men in their party against Kim Il Sung under that slogan; the Albanians, that a woman member of their Politburo used it against Hoxha.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 414–415 ("that evening" of the 29th). Made public: 1999. See [[cal.1960-11-29.soviet-union-3]]. Names: Kim Il Sung.'
      tags:
      - polity:prc
      - name:kim-il-sung
      - vis:only:prc+albania+drv+dprk
      src:
        c: 'b7601697'
        rows:
