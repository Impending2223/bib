      c: Moscow. In the afternoon, after the parade, Andropov, head of the Central Committee's liaison department, brings the Chinese delegation the CPSU's letter in answer to the Reply (the letter dated Nov. 5). He says the letter is one thing, the conference another. Suslov had told Deng after the celebrations that the answer was coming and had some pepper. The letter defends the CPSU and denies it said what the Reply says; attacks China, Mao and Liu; charges China with setting parties against one another, in the cases of Albania, Poland, Hungary, and the Australian and American parties; and presses hardest on Albania.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 373–374 ("that afternoon", after the parade; dated Nov. 5 at 377, 380 and 446). Made public: 1999. See [[cal.1960-11-07.soviet-union]]. Names: Andropov, Suslov, Deng Xiaoping, Mao Zedong, Liu Shaoqi. Check: the account is the Chinese delegation''s; Wu says the letter was "distributed" to the parties before the conference (374), and has Liu say it was issued on Nov. 5 (446).'
