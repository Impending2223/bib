      c: Minsk. Liu Shaoqi arrives in the morning. Kozlov, who has gone ahead, with the Byelorussian and Minsk Party and government heads meets him at the station. He visits a collective farm near the city and sees a song-and-dance program in the evening. He leaves Minsk by train that night.
