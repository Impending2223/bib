- add:
    entry:
      id: cal.1960-11-16.soviet-union
      when: Nov. 16
      date: '1960-11-16'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. Eight parties speak. Hoxha, for Albania, gives case after case of the CPSU's great-power ways, meddling in the Albanian Party's affairs and plotting, threats to cut aid, breach of internationalism and betrayal of Lenin and the October Revolution; he speaks with heat. The Soviet side is tense. Hoxha goes home after speaking.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 384, 395 ("the 16th"; at 395 Wu says Hoxha left for home after his speech of the 16th). Made public: 1999. See [[cal.1960-11-15.soviet-union]].'
      tags:
      - polity:prc
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
        c: '37923ed0'
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 384, 395: all'
- add:
    entry:
      id: cal.1960-11-16.china-leadership-4
      when: Nov. 16
      date: '1960-11-16'
      time_range:
      - 1960-11-16T03:00Z
      - 1960-11-16T09:00Z
      time_band: morning
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking to Moscow, by telephone, in the morning. Zhou Enlai calls the Chinese embassy at Moscow for Yang Shangkun, who has waited there for the Center''s cable. He asks how the delegation lives, then says one thing: it has been discussed, the Center agrees with your view. Nothing more, the Soviets listening.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 387 ("the next morning"; whose clock not stated). Made public: 1999. See [[cal.1960-11-15.china-leadership-4]]. Names: Zhou Enlai. Check: the hour and clock; Wu says "next morning" without a place; the tree has Mao''s meeting on the telegram that evening ([[cal.1960-11-16.china-leadership]]).'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
      src:
        c: 32dc79c1
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 387: all'
      follows:
      - cal.1960-11-15.china-leadership-4
- add:
    entry:
      id: cal.1960-11-16.china-leadership-5
      when: Nov. 16–18
      date: '1960-11-16'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow. With the Center''s approval the whole Chinese delegation, on the 16th, 17th and 18th, calls on the delegations of the West European, Latin American, Asian and East European parties to declare China''s firm stand. Liao Chengzhi and Liu Ningyi, who know many of the parties, the Liaison Department''s old hands of the world student, youth and trade-union bodies, and the interpreters go out. By Wu: the left firmer, the center ready to ask the CPSU to give way, the right quieter; the Soviet delegation sullen for days and, meeting Chinese, looks away.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 387–388 ("on the 16th, 17th and 18th"). Made public: 1999. See [[cal.1960-11-16.china-leadership-4]].'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: a1b55b86
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 387–388: all'
      follows:
      - cal.1960-11-16.china-leadership-4
- add:
    entry:
      id: cal.1960-11.china-leadership-4
      when: Nov., after the 16th
      date: 1960-11
      at: after 1960-11-16
      thread: china-leadership
      also:
      - soviet-union
      c: Moscow. The delegation, meeting on its second speech, decides to answer all the slanders and gross errors in the speeches, naming only Khrushchev; the rest are his views again. It will speak after Khrushchev's second speech, as Deng's first will have drawn one, as at Bucharest; Deng to speak again, Liu keeping his reserve, the deputy against Khrushchev, a way of slighting him.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 388–389 (after the contacts of the 16th–18th, the day not given). Made public: 1999. See [[cal.1960-11-16.china-leadership-5]]. Names: Deng Xiaoping, Khrushchev, Liu Shaoqi. Check: the day; Wu gives none, only that it came before the 21st.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:khrushchev-nikita-s
      - name:liu-shaoqi
      - vis:only:prc
      src:
        c: '82013298'
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 388–389: all'
- add:
    entry:
      id: cal.1960-11-21.soviet-union
      when: Nov. 21
      date: '1960-11-21'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The conference resumes after the recess of the 20th. The Hungarian delegation tables a draft resolution on relations among parties, to be adopted at the conference, kept internal: six points, chief that international meetings decide by majority, and that two parties unable to settle a difference ask a third to arbitrate, and failing that put it to the international meeting by majority vote. A charter in effect.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 389–390 ("on the 21st"). Made public: 1999. See [[cal.1960-11-14.soviet-union-2]]. Check: the account is the Chinese delegation''s; Wu says the CPSU planned it.'
      tags:
      - polity:prc
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
        c: 6da548a2
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 389–390: all'
- add:
    entry:
      id: cal.1960-11-21.china-leadership-4
      when: Nov. 21
      date: '1960-11-21'
      time_range:
      - 1960-11-21T16:00Z
      - 1960-11-21T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: Moscow, the Chinese embassy, evening. The delegation, reading the Hungarian draft as the CPSU's sword over China's head, resolves to oppose its being discussed and, if it is, not to take part, as a warning that China does not fear a break. It reports to Peking that night.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 390 ("the evening of the 21st"; the report "that night"). Made public: 1999. See [[cal.1960-11-21.soviet-union]].'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: e9388660
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 390: all'
      follows:
      - cal.1960-11-21.soviet-union
- add:
    entry:
      id: cal.1960-11-22.china-leadership-4
      when: Nov. 22
      date: '1960-11-22'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow. The delegation receives the Center''s answer: it agrees to knock down the Hungarian proposal. Through its liaison men it tells every delegation China''s stand. The delegations are shaken; many say that China''s staying out of the discussion means a break. To the Hungarian delegation the Chinese say they backed Hungary in its worst days and did not look for this; a member of it shrugs and says nothing.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 390 ("the next day" after the 21st). Made public: 1999. See [[cal.1960-11-21.china-leadership-4]]. Check: the hour; Wu gives the day only.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: e1532d06
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 390: all'
      follows:
      - cal.1960-11-21.china-leadership-4
- add:
    entry:
      id: cal.1960-11-22.soviet-union
      when: Nov. 22
      date: '1960-11-22'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The first round of speeches ends with the morning session. From Nov. 10 to 22, the 13th and 20th recess days, 77 parties spoke, by Wu''s count: 51, Khrushchev among them, wholly on Khrushchev''s side; 15 between; 11, China''s among them, mostly against his views. The chair announces that Khrushchev will speak tomorrow.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 388, 390 ("the morning of the 22nd"; the count at 388). Made public: 1999. See [[cal.1960-11-21.soviet-union]]. Names: Khrushchev. Check: the count is the Chinese delegation''s (388: 51 parties, the CPSU among them; "the 50" that followed Khrushchev).'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
        c: 8ca5c3b3
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 388, 390: all'
- add:
    entry:
      id: cal.1960-11-22.china-leadership-5
      when: Nov. 22
      date: '1960-11-22'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, the Chinese embassy. After the session the delegation weighs what Khrushchev will say on the 23rd. Two possibilities: he abuses China again and presses the Hungarian draft; or, seeing China firm, he lowers his tone and coaxes China into signing. Most think the second. It decides to lower the tone of Deng''s second speech, not to answer other parties'' anti-Chinese views, to take up the disputed matters of the statement draft and what Khrushchev said and the letter of Nov. 5 left unanswered, and on the Hungarian draft to be firm in matter, mild in voice, as the wronged. The writers, who had raised the tone, work it down again.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 390–392 ("after the close on the 22nd"). Made public: 1999. See [[cal.1960-11-22.soviet-union]]. Names: Khrushchev, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - name:deng-xiaoping
      - vis:only:prc
      src:
        c: c1de8afb
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 390–392: all'
      follows:
      - cal.1960-11-22.soviet-union
- add:
    entry:
      id: cal.1960-11-23.soviet-union
      when: Nov. 23
      date: '1960-11-23'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. Khrushchev speaks a second time, an hour and twenty minutes. He backs those who attacked China; the meeting is at "a very high level," most speeches a contribution; only China and Albania hold to their own views on a string of questions. He takes up the era, war and peace, coexistence, peaceful transition, national liberation, and Stalin, defending himself and agreeing with some Chinese points: imperialist aggression to be stopped by socialism and the peoples'' revolution, not that he fears war; two possibilities of transition, as the Twentieth Congress and the 1957 declaration said; condemning Stalin''s cult necessary, no time to consult the parties, and the CPSU has since passed a full resolution. He attacks China and Albania for factional activity and, unnamed, the cult of personality: some take themselves for saints and cannot be talked to. He ends: look ahead, argument has a limit, he can yield but not on principle, he does not fear struggle and wants unity. No one asks the floor; the chair rises.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 392–394 ("on Nov. 23"; "1 hour 20 minutes"). Made public: 1999. See [[cal.1960-11-22.soviet-union]]. Names: Khrushchev. Check: the account is the Chinese delegation''s.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
        c: f68cafcb
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 392–394: all'
- add:
    entry:
      id: cal.1960-11-23.china-leadership-3
      when: Nov. 23
      date: '1960-11-23'
      time_range:
      - 1960-11-23T16:00Z
      - 1960-11-23T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: Moscow, the Chinese embassy. The delegation finds Khrushchev's tone low and decides Deng's speech tomorrow shall be milder, three or four degrees down, not eight, yet sharp in matter, to show the nature of Khrushchev's revisionism and to name the worst offenders, Gomułka and Thorez, large parties of influence, both attacking Albania. The writers work through the night, Hu Qiaomu reading each part, then the delegation, then Liu and Deng settle the text; the interpreters labor a day and a night, the speech to be done by simultaneous interpretation.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 394 ("that night"; the speech "next day, the 24th"). Made public: 1999. See [[cal.1960-11-23.soviet-union]]. Names: Khrushchev, Deng Xiaoping, Gomułka, Thorez, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - name:deng-xiaoping
      - name:gomulka-wladyslaw
      - name:thorez-maurice
