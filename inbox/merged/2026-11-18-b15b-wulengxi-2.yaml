      c: 'Moscow. At the dinner for the Chinese delegation Khrushchev speaks at length of Stalin: Lenin a saint, Stalin a bandit; Lenin is the Soviets'', Stalin not. He says it is false that he is isolated and that Suslov and Mikoyan are his enemies.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 373 ("in the evening", at the dinner). Made public: 1999. See [[cal.1960-11-06.soviet-union]]. Names: Khrushchev, Suslov, Mikoyan. Check: the day; Wu says "in the evening" without a date, after Liu''s call.'
