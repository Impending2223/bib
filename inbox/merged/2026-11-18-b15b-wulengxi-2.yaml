    entry:
      id: cal.1960-12-01.soviet-union
      when: Dec. 1
      date: '1960-12-01'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow, the Kremlin''s St. George''s Hall. The conference holds its closing plenary and the heads of the delegations sign the Statement. Liu Shaoqi speaks, as planned. He congratulates the conference: through all the labor an agreed programme and an Appeal to the world''s peoples have been made. Differences, natural and unavoidable, can be settled on the ground of Marxism–Leninism by consultation to agreement, the one right way. The conference had turns, difficulties, obstacles, struggle, and overcame them. China wants stronger unity, differences removed, attacks stopped, above all Sino-Soviet unity. The hall applauds many times.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 424–425 (the plenary on "Dec. 1"). Made public: 1999. See [[cal.1960-11-10.soviet-union]]. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
