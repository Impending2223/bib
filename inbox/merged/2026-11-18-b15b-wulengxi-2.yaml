- add:
    entry:
      id: cal.1960-11-12.soviet-union
      when: Nov. 12
      date: '1960-11-12'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The conference, morning: delegates of seven parties speak, the Dutch party''s general secretary among them, who criticizes revisionism in plain terms and urges unity. The conference rises in the afternoon and does not sit the 13th.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 381 (the morning of the 12th; "recess" that afternoon and the 13th). Made public: 1999. See [[cal.1960-11-11.soviet-union]].'
      tags:
      - polity:prc
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
