- add:
    entry:
      id: cal.1960-11-25.soviet-union
      when: Nov. 25
      date: '1960-11-25'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. The drafting committee of twenty-six parties resumes after the plenary. The first day's argument is as sharp as before. The CPSU yields nothing and will not change a word of the draft.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 396–397 ("from the 25th"). Made public: 1999. See [[cal.1960-11-24.soviet-union-2]].'
      tags:
      - polity:prc
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia
      src:
        c: 28caa957
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 396–397: all'
- add:
    entry:
      id: cal.1960-11-25.china-leadership
      when: Nov. 25
      date: '1960-11-25'
      time_range:
      - 1960-11-25T09:00Z
      - 1960-11-25T19:00Z
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      - vietnam-hanoi
      c: 'Moscow, the Chinese embassy, afternoon to night. The delegation weighs the last stage. Holding firm through the second round, it judges, has shaken the delegations: the left heartened, the center, among them the capitalist countries'' parties and some ruling ones, alarmed at a split of two great parties, Khrushchev''s followers afraid to bear a break. Hồ Chí Minh tells the Chinese he will lead a delegation to both parties to urge a compromise. Decisions: keep the resolve not to fear a break; all the "nails" and the unnamed attacks out, or no signature; none for a majority-rule resolution even if the nails go. Signing is form; the draft otherwise an anti-Chinese text, for history to judge. A break would mean the CPSU''s anti-China course, Soviet and East European aid cut, party ties cut, a diplomatic blockade and state relations ended, isolation in international bodies, separate courses on imperialism, national liberation and the workers'' movement: none enough to bend China. Six open questions: father-and-son or equal parties; majority rule or consultation to agreement; what factional activity is and who does it; what national communism is and who; whether the Twentieth and Twenty-first Congresses are affirmed; the cult of personality. The delegation cables Peking deep at night for what it may yield and when sign or not.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 397–400 ("the afternoon to the evening of the 25th"; the cable "deep at night" of the 25th). Made public: 1999. See [[cal.1960-11-25.soviet-union]]. Names: Hồ Chí Minh.'
      tags:
      - polity:prc
      - name:ho-chi-minh
      - vis:only:prc
      src:
        c: c019af1e
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 397–400: all'
- add:
    entry:
      id: cal.1960-11-26.soviet-union
      when: Nov. 26
      date: '1960-11-26'
      thread: soviet-union
      also:
      - vietnam-hanoi
      - china-leadership
      c: 'Moscow. Hồ Chí Minh leads a petition group to Khrushchev: delegates of a Northern European party, a Latin American party and several Asian parties, to urge the CPSU to give way. Khrushchev is hard, with no room to bargain. The Twentieth Congress must go in; he had held for both the Twentieth and the Twenty-first and now says only the Twentieth. Against factional activity must go in, or an internal resolution. Against the personality cult must go in, since the 1957 Declaration has it. He attacks the paper tiger, the Hundred Flowers, the Great Leap and the communes. The group is much concerned and still wants China and the CPSU to consult and agree.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 400–401 (the 26th; the Vietnamese told the Chinese that evening). Made public: 1999. See [[cal.1960-11-25.china-leadership]]. Names: Hồ Chí Minh, Khrushchev. Check: the account is the Vietnamese delegation''s, as told that evening to the Chinese.'
      tags:
      - polity:prc
      - name:ho-chi-minh
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr+drv
      src:
        c: a7d04d38
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 400–401: all'
- add:
    entry:
      id: cal.1960-11-26.soviet-union-2
      when: Nov. 26
      date: '1960-11-26'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow, the Chinese delegation''s quarters. Khrushchev sends Mikoyan and Kozlov; Deng Xiaoping and Peng Zhen talk with them. Their points: the Twentieth Congress must go in; the wording against factional activity may be considered, a slight give; whether there is an internal resolution on the Hungarian proposal depends on China''s attitude; if the conference ends well the Sino-Soviet differences end, look ahead, make unity; and the Chinese delegation is asked to tour the USSR after the conference, Liu''s visit as head of state widened to the whole party and government delegation. Deng: the conference is in substance an anti-China conference the CPSU set going, to China''s deep regret and wrath; the CPSU still holds its wrong line, and China urges it not to go to the end but to look further and put the large matter first; only with all the nails out of the draft, no resolution against China and no majority-rule resolution will China sign. Mikoyan and Kozlov cannot accept, will report to the Presidium.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 401–402 ("the 26th"; Wu''s bracketed asides, that the wording point was "a slight loosening" and that the Hungarian point was a threat, are his). Made public: 1999. See [[cal.1960-11-26.soviet-union]]. Names: Mikoyan, Kozlov, Deng Xiaoping, Peng Zhen, Liu Shaoqi. Check: the account is the Chinese delegation''s.'
      tags:
      - polity:prc
      - name:mikoyan-anastas
      - name:kozlov-frol-r
      - name:deng-xiaoping
      - name:peng-zhen
      - name:liu-shaoqi
      - vis:only:prc+ussr
      src:
        c: fb1ace3e
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 401–402: all'
- add:
    entry:
      id: cal.1960-11-26.china-leadership-4
      when: Nov. 26
      date: '1960-11-26'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, the Chinese embassy. The delegation meets at once after Mikoyan and Kozlov leave. It reads their call as chiefly to urge surrender, repulsed, the door not shut, since they would report to their Central Committee. It will go on: all nails out, no resolution against China, none by majority. The Center''s answer to the request of the 25th has not come.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 402 ("at once"). Made public: 1999. See [[cal.1960-11-26.soviet-union-2]]. Names: Mikoyan, Kozlov.'
      tags:
      - polity:prc
      - name:mikoyan-anastas
      - name:kozlov-frol-r
      - vis:only:prc
      src:
        c: b4ba3611
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 402: all'
      follows:
      - cal.1960-11-26.soviet-union-2
- add:
    entry:
      id: cal.1960-11-27.soviet-union
      when: Nov. 27
      date: '1960-11-27'
      thread: soviet-union
      also:
      - vietnam-hanoi
      - china-leadership
      c: 'Moscow. Hồ Chí Minh leads the petition group to the Chinese delegation. The Indonesian, Korean and Australian delegates are firm; the Japanese, fair; the Indian wants agreement; the Vietnamese press hardest for a compromise. The Chinese tell them what Mikoyan and Kozlov were told: the conference in effect an anti-China one; no signature unless the nails go and no resolution against China or by majority; the group to press the CPSU, and to bring Asian, African, Latin American and European parties to press it. China is driven to the wall; if it signs it can answer to neither its Central Committee nor the Chinese people nor the movement nor history; it has compromised much, some of the CPSU''s wording is in the statement, some points give both sides'' views; on the last six questions it has no room. Hồ asks China to think again and yield where it can; he will work on other parties. The group leaves impressed that China can give no more.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 402–403 ("the next day, the 27th"). Made public: 1999. See [[cal.1960-11-26.soviet-union-2]]. Names: Hồ Chí Minh.'
      tags:
      - polity:prc
      - name:ho-chi-minh
      - vis:only:prc+drv+dprk+indonesia
      src:
        c: 4ac7af4b
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 402–403: all'
- add:
    entry:
      id: cal.1960-11-28.soviet-union
      when: Nov. 28
      date: '1960-11-28'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. In the drafting committee the Soviet delegate agrees to cut "national communism," one of the six points; the rest to stay, above all the stand against factional activity and the affirming of the Twentieth Congress. The Chinese delegate counters: the statement must say plainly the principle of consultation to unanimity, not majority rule, raised in discussing the statement, not the Hungarian draft. Argued again, without result.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 403–404 ("the 28th"). Made public: 1999. See [[cal.1960-11-25.soviet-union]].'
      tags:
      - polity:prc
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia
      src:
        c: ec118561
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 403–404: all'
- add:
    entry:
      id: cal.1960-11-28.china-leadership-5
      when: Nov. 28
      date: '1960-11-28'
      time_range:
      - 1960-11-28T09:00Z
      - 1960-11-28T15:00Z
      time_band: afternoon
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, the Chinese embassy. The delegation, meeting in the afternoon, takes the Soviet agreement to cut "national communism" as a first step back: they cannot hold out, they fear the blame for a break, other parties press them. Both sides have played on the edge of a break; China to stay with Khrushchev and see who outlasts. Peking has not answered the request of the 25th; the delegation has cabled it the three days'' events.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 404–405 ("in the afternoon of the 28th"). Made public: 1999. See [[cal.1960-11-28.soviet-union]]. Names: Khrushchev.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: 92d1a5e5
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 404–405: all'
      follows:
      - cal.1960-11-28.soviet-union
- add:
    entry:
      id: cal.1960-11-28.china-leadership-6
      when: Nov. 28
      date: '1960-11-28'
      time_range:
      - 1960-11-28T16:00Z
      - 1960-11-28T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, the Chinese embassy, after dinner. The Center''s answer to the request of the 25th comes, Peking having studied it two days; the delegation reads it page by page as it is decoded. That night it decides four things: (1) to prepare wordings on the Twentieth Congress, four, from tight to a copy of the 1957 Declaration''s; (2) to prepare the statements it will make in the three cases: no signature, signature with protest against an internal resolution, and keeping the Twentieth with an internal resolution; (3) in the first case, Liu Shaoqi to speak after signing, for unity, for the fight against imperialist aggression and war policy, for world peace; (4) to propose to the CPSU Sino-Soviet talks on the 29th, and till then to watch quietly in the drafting committee.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 407, 409–410 ("soon after dinner" of the 28th). Made public: 1999. See [[cal.1960-11-28.china-leadership-5]]. See [[cal.1960-11-28.china-leadership]]. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
      src:
        c: c5d865df
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 407, 409–410: all'
- add:
    entry:
      id: cal.1960-11-28.vietnam-hanoi
      when: Nov. 28
      date: '1960-11-28'
      time: 1960-11-28T21:00Z
      time_zone: Europe/Moscow
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china-leadership
      c: 'Moscow, midnight. Hồ Chí Minh telephones the Chinese delegation and asks Liu Shaoqi to come to him, to talk it over. Liu, asleep, rises and calls Deng Xiaoping and Peng Zhen. The call is odd: Hồ has always come to them. Liu declines, telling Hồ China''s stand was given yesterday; let him go to Khrushchev, pass it on, and make Khrushchev choose between a break and none. Hồ then says he is asking Khrushchev too, that all may talk. Liu, with Deng and Peng, declines again: if Khrushchev wants a settlement, let him come; no third party between. The Chinese take it that Hồ is again a go-between with Khrushchev''s consent.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 405–407 ("at 12 at night" of the 28th). Made public: 1999. See [[cal.1960-11-28.china-leadership-6]]. Names: Hồ Chí Minh, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Khrushchev. Check: the hour is the night of the 28th, so the first minutes of the 29th; Hồ, at Peking, puts it on the 29th (441).'
      tags:
      - polity:prc
      - name:ho-chi-minh
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:peng-zhen
      - name:khrushchev-nikita-s
      - vis:only:prc+drv
      src:
        c: 12bd0afc
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 405–407: all'
      follows:
      - cal.1960-11-28.china-leadership-6
- add:
    entry:
      id: cal.1960-11-29.soviet-union
      when: Nov. 29
      date: '1960-11-29'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. The drafting committee. The Polish delegate proposes to drop the Twenty-first Congress from the statement and to keep the Twentieth's wording; Soviet followers one after another press the Chinese to accept it without giving reasons. Then a subcommittee for the Appeal is proposed; the Soviet delegate hands in a list; the Chinese ask one or two more parties on it; refused outright. Peng Zhen, leading the Chinese delegation (Liu never sat in the committee, Deng seldom), protests that only the Chinese Party sits for Asia and says China will not take part.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 410–411 ("on Nov. 29"). Made public: 1999. See [[cal.1960-11-28.soviet-union]]. Names: Peng Zhen, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia
      src:
        c: fcd698c7
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 410–411: all'
- add:
    entry:
      id: cal.1960-11-29.soviet-union-2
      when: Nov. 29
      date: '1960-11-29'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow, a room beside the hall (the committee suspended an hour for coffee). Peng Zhen asks Kozlov out. Is it your design to break the conference? If so, say it openly and China will issue a statement. Kozlov, "No, no, we want it to go well." Peng proposes a gentleman''s agreement: (1) no internal resolution, neither anti-Chinese nor by majority; (2) neither national communism nor factional activity attacked in the statement; (3) the principle of consultation to agreement written in; (4) the Twentieth Congress may go in, the wording amended. Kozlov agrees to all four and asks the Chinese wording of the Twentieth. Peng: they agree "before Lenin''s portrait"; each to report to his Central Committee. Kozlov can speak for the CPSU Central Committee but must report to the Presidium for approval. Both telephone their delegations; the committee and the Appeal subcommittee adjourn.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 411–413 (the same day, after the hour''s recess). Made public: 1999. See [[cal.1960-11-29.soviet-union]]. Names: Peng Zhen, Kozlov. Check: the account is Peng Zhen''s side''s, from the delegation.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:kozlov-frol-r
      - vis:only:prc+ussr
      src:
        c: 9a361f33
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 411–413: all'
      follows:
      - cal.1960-11-29.soviet-union
- add:
    entry:
      id: cal.1960-11-29.soviet-union-3
      when: Nov. 29
      date: '1960-11-29'
      time_range:
      - 1960-11-29T16:00Z
      - 1960-11-29T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. In the evening Kozlov telephones Peng Zhen: the Presidium has met, Khrushchev presiding, and in the main approves the noon oral agreement, but asks for formal talks of the two delegations. He proposes 10 a.m. tomorrow, the Lenin Hills conference hall, three a side: Khrushchev, Suslov and Kozlov. Peng, after consulting the delegation, answers: Liu, Deng and Peng for China, the hour 11. The Soviets agree.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 414–415 ("toward evening" of the 29th). Made public: 1999. See [[cal.1960-11-29.soviet-union-2]]. Names: Kozlov, Peng Zhen, Khrushchev, Suslov, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:kozlov-frol-r
      - name:peng-zhen
      - name:khrushchev-nikita-s
      - name:suslov-mikhail-a
