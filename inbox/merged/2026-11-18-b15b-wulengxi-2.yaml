    at: '364'
- cite:
    id: cal.1960-09-23.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 364–365 (the report; Mao''s talk after it: both parties still to unite, a Marxist-Leninist agreement the only basis; the Soviets used to scold brother parties as a father his son; this time both spoke, argued, settled nothing; at Bucharest the aim to isolate China failed, for China did not yield and other parties did not approve; the line: unity, struggle, no break; Liu and Zhou agree the delegation fought well)'
    units: C, D, E, F
- variant:
    id: cal.1960-10-24.china-leadership
    unit: B
    witness: w.lengxi-shinian-lunzhan-1956-1966
