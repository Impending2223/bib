- add:
    entry:
      id: cal.1960-11-24.soviet-union
      when: Nov. 24
      date: '1960-11-24'
      time_range:
      - 1960-11-24T03:00Z
      - 1960-11-24T09:00Z
      time_band: morning
      time_zone: Europe/Moscow
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow, morning. Deng Xiaoping, for the Chinese delegation, speaks a second time, fifty minutes. He restates China''s views on the era, war and peace, coexistence, peaceful transition and support of national liberation against the CPSU''s. In particular: Khrushchev''s line is in substance to bow to imperialism and the world bourgeoisie, from not making revolution to opposing others'' revolution; and he answers Khrushchev''s attack on Mao, on "the east wind prevails over the west wind," "paper tigers" and "I am not imperialism''s chief of staff," as metaphysics, abuse without right or wrong. Hoxha having gone, he rebukes the French and Polish delegates for injustice to Albania. He declares China wholly opposes the Hungarian draft, will not join its discussion and will fight it to the end: the CPSU''s method is Bucharest''s, father party, majority over minority, great-power chauvinism. The Comintern was dissolved seventeen years ago and the Cominform is no more; when did the brother parties agree to an international body, or to majority rule? The hall is silent.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 395–396 ("the morning of Nov. 24", fifty minutes). Made public: 1999. See [[cal.1960-11-23.soviet-union]]. Names: Deng Xiaoping, Khrushchev, Mao Zedong. Check: the account is Wu''s summary of the speech.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:khrushchev-nikita-s
      - name:mao-zedong
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
        c: e645394a
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 395–396: all'
- add:
    entry:
      id: cal.1960-11-24.soviet-union-2
      when: Nov. 24
      date: '1960-11-24'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. After Deng's speech more than ten delegates speak abusing China, banging tables, stamping. Delegates of the Indonesian, Indian and Brazilian parties speak against the attacks on China. The Dutch party's general secretary, much moved, says this is no way for comrades to discuss; he urges the majority to give up the method, end the discussion, take counsel outside the hall, first between the two parties. No one asks the floor; the chair adjourns, the drafting committee to sit from tomorrow.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 396 (after Deng''s speech, the 24th). Made public: 1999. See [[cal.1960-11-24.soviet-union]].'
      tags:
      - polity:prc
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
