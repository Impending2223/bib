      c: Moscow. After the ballet Liu Shaoqi calls Wu Lengxi and others to his office to revise the speech for tomorrow's rally; he changes some main passages himself. The Liaison Department drafted it, with the Foreign Ministry and Pu Shouchang; Xiong Fu revised it at Moscow; Wu, Qiao Guanhua and Pu went over it from beginning to end on the way from Minsk. Liu faults it as all principle and general talk, not concrete or lively, and has it open with his journey to Soviet Russia in 1921, the three months from Vladivostok, the Soviet people's feeling for the Chinese comrades; the writers revise it there.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 432–433 ("after the ballet" on the 6th). Made public: 1999. See [[cal.1960-12-06.soviet-union]]. Names: Liu Shaoqi, Qiao Guanhua.'
