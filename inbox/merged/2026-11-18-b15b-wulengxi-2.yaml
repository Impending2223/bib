      c: 'Peking, for Moscow. The Chinese delegation to the party talks leaves in two planes, for safety: Deng Xiaoping and Lu Dingyi in one, Peng Zhen and the rest in the other. Deng''s lands at Moscow that day. Peng''s, held by weather at Sverdlovsk, goes on by train and reaches Moscow Sept. 16.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 357–358 (Deng head, Peng Zhen deputy; some dozens, with heads of the Liaison Department and the Foreign Ministry and a company of writers; Wu stays in Peking by Mao''s order). Made public: 1999. See [[cal.1960-09-13.china-leadership]]. Names: Deng Xiaoping, Lu Dingyi, Peng Zhen.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:lu-dingyi
      - name:peng-zhen
      - vis:only:prc+ussr
