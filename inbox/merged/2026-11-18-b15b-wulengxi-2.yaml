      c: Irkutsk, the hotel, soon after 10 p.m. Liu Shaoqi sends for Wu Lengxi, Qiao Guanhua and Pu Shouchang to amend the speech for the Irkutsk banquet, read by him on the flight. He dictates a passage to be added; they take it down.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 436 ("10 o''clock at night" on arrival at the hotel). Made public: 1999. See [[cal.1960-12-08.soviet-union]]. Names: Liu Shaoqi, Qiao Guanhua.'
