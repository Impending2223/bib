- cite:
    id: cal.1961-08-03.soviet-union
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 456, 473 (the Warsaw Treaty states'' summit "in August" refuses the Albanian delegate a seat, in effect putting Albania out of the alliance)'
