      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow, the Palace of Sports at the Central Lenin Stadium, 2 p.m. The CPSU Central Committee and the Supreme Soviet hold a rally for Liu Shaoqi, 12,000 in the hall. Khrushchev leads the Presidium, Brezhnev, Kozlov and Mikoyan with him. The Moscow city secretary welcomes; a Likhachev worker, an academician and a Moscow University delegate speak; Brezhnev speaks; Liu last. He congratulates the Soviet people and the conference, and speaks of 1921: from Shanghai to Vladivostok, under Japanese occupation, round the city by rail via Chita, three months, now nine days from Peking; no coal, wood-burning engines, Soviet railwaymen helping gather wood and mend the line; he joined the Party at Moscow that winter, not in China. Unity is life, strength, victory; imperialism will see Sino-Soviet separation no sooner than the sun rising in the west; no force can break the unity of the two parties, states, peoples. The hall applauds 36 times, rises and shouts "Hurrah"; Liu stands arm in arm with Khrushchev, Brezhnev, Mikoyan and Kozlov.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 433–435 ("the afternoon of the 7th", "at 2 o''clock"; 36 rounds of applause "by our rough count"). See [[cal.1960-12-06.china-leadership-6]]. Names: Liu Shaoqi, Khrushchev, Brezhnev, Kozlov, Mikoyan.'
