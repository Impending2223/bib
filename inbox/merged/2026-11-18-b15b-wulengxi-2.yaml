      c: Moscow, then by air. Liu Shaoqi calls on Khrushchev at the Central Committee in the morning to take leave, a short talk, words for unity; goes to the airport, all the Presidium seeing him off; and flies with Brezhnev for Irkutsk, with a stop at Omsk, arriving at 10 p.m.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 436 ("on the morning of the 8th"; "10 o''clock" at night at Irkutsk). Made public: 1999. See [[cal.1960-12-07.soviet-union]]. Names: Liu Shaoqi, Khrushchev, Brezhnev.'
