      - 1960-11-30T15:00Z
      time_band: afternoon
      time_zone: Europe/Moscow
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The same afternoon Deng Xiaoping and Peng Zhen for China, Suslov and Kozlov for the CPSU, each with a few aides, settle the wording on the Twentieth Congress and on the personality cult. On the Twentieth the Chinese fall back to their fourth wording, the 1957 Declaration''s; the Soviets accept. On the cult the wording is mostly the 1957 Declaration''s, with a phrase added: some brother parties have made gains against it. Suslov would drop the consultation-to-unanimity principle from the statement, agreement being reached; the Chinese hold out and it is written in plainly. Deng and Suslov also agree that *Renmin ribao* and *Pravda* each print the other''s editorial on the statement the day it is published.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 418–419, 428 ("that afternoon"; the editorials, 428). Made public: 1999. See [[cal.1960-11-30.soviet-union]]. Names: Deng Xiaoping, Peng Zhen, Suslov, Kozlov.'
