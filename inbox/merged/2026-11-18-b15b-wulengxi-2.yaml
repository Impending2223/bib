      also:
      - china-leadership
      c: 'Moscow, the Kremlin, St. George''s Hall. The conference of 81 communist and workers'' parties opens in the afternoon (to Dec. 1). Suslov reports for the drafting committee: he gives the Soviet side''s views and little of the others'', above all the Chinese; revives points already agreed and since withdrawn; speaks of the four disputed "nails" as if they could pass as drafted; says there were differences without saying what.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 377–378 ("in the afternoon" of the 10th; the closing plenary, 424). Made public: 1999. See [[cal.1960-11.soviet-union]]. Names: Suslov. Check: the account is the Chinese delegation''s; the days to Dec. 1 from p. 424.'
      tags:
      - polity:prc
      - name:suslov-mikhail-a
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
        c: 2b6f9d05
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 377–378: all'
- add:
    entry:
      id: cal.1960-11-10.soviet-union-2
      when: Nov. 10
      date: '1960-11-10'
      time_range:
      - 1960-11-10T09:00Z
      - 1960-11-10T15:00Z
      time_band: afternoon
      time_zone: Europe/Moscow
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. After a fifteen-minute recess Khrushchev speaks, over two hours, eleven points, none naming China. The era is not only that of imperialism and proletarian revolution; imperialism's nature has not stayed unchanged. Socialist states to divide labor; building alone does not succeed, going it alone is nationalism. The Soviets have made a few mistakes, some roughness, with socialist states. Local wars may come, war is not inevitable. Peaceful coexistence is the general line of socialist foreign policy; disarmament the way. New states may develop non-capitalistically. Peaceful transition is more likely; parliaments may become the people's. Against nationalism, Yugoslavia's chief mark being national communism. Not only revisionism but dogmatism and sectarianism may be the chief danger, above all "left" adventurism; against factional activity, in parties and in the movement. No more "head" of the camp, the CPSU cannot be one; the parties to "check their watches" with one another.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 378–380 (after Suslov''s report and a recess of fifteen minutes; "over two hours"). Made public: 1999. See [[cal.1960-11-10.soviet-union]]. Names: Khrushchev. Check: the account is the Chinese delegation''s; the eleven points are Wu''s summary.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
        c: 1e2f4a4f
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 378–380: all'
      follows:
      - cal.1960-11-10.soviet-union
- add:
    entry:
      id: cal.1960-11-10.china-leadership-3
      when: Nov. 10
      date: '1960-11-10'
      time_range:
      - 1960-11-10T16:00Z
      - 1960-11-10T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, the Chinese embassy, that evening. The delegation judges most of Khrushchev''s speech aimed at China though it names no one, the points being those of the Bucharest notice and the letter of Nov. 5. It resolves to raise the tone and name Khrushchev, so that every party hears China''s stand. By the Politburo''s line, Liu Shaoqi in the second rank, Deng Xiaoping and Peng Zhen in the first, Deng is to speak. The draft to be amended with the points Khrushchev raised.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 380 ("that evening"). Made public: 1999. See [[cal.1960-11-10.soviet-union-2]]. Names: Khrushchev, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
      src:
