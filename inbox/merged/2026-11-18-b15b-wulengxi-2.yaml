      c: 'Leningrad, the Moscow station, 10 a.m. The special train arrives. Kozlov, once Leningrad''s city secretary, has come ahead from Moscow with the city''s Party, government and army heads to meet Liu Shaoqi, and a mass rally is held in the square before the station. The city secretary welcomes him; Liu speaks. Wu: the crowd is cool at the start, the CPSU having spread its answer to the Reply a month before; at Liu''s words, that the Aurora''s first shot in the October Revolution brought Marxism–Leninism to China, it warms, applauds and long shouts Sino-Soviet friendship.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 431 ("10 o''clock in the morning"). See [[cal.1960-12-02.soviet-union]]. Names: Kozlov, Liu Shaoqi.'
