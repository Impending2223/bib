- cite:
    id: cal.1961-01-18.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 445–448 (Liu Shaoqi''s speech of Jan. 18 on the Moscow conference, as Wu summarizes it: Mao rightly kept out and made Liu head, in the second line, not arguing openly with Khrushchev; his seniority from Moscow in 1921 counted a little; the Soviets looked strong and were weak at heart: the letter of Nov. 5, then the call of Nov. 9 to say it had nothing to do with the conference; after *Long Live Leninism* they had to grant imperialism unchanged, to seize on the 1957 Declaration, to write in anti-imperialism and support of national liberation, and to sign a statement for unity; Mikoyan and Kozlov came Nov. 26, after Hồ''s petition, to feel China out with the lure of restored aid; Hồ''s invitation of the 28th to meet Khrushchev refused; the Soviets had asked Liu to visit from fear of a split; the struggle may ease: lengthen it, put the strength into home work, start no debate, study basic theory, Stalin''s among it; Mao interjects: not afraid to print their pieces or of a split, only trade would stop; be ready for cultural and economic ties cut, diplomatic ones alone; Liu: the struggle to rise and fall ten years at least; some parties new Social Democrats; capitalism can come back where there is revisionism, as Mao has said; *Pravda* cut the Irkutsk passage)'
    units: A
- cite:
    id: cal.1961-01-18.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 448–449 (Chen Yun at the plenum''s close, mainly on planning and agriculture, also on the Moscow conference: a success, the delegation''s work good; revisionism abroad no wonder; right to fight it, or owe history as a communist; the struggle bears long on the fate of the world''s peoples)'
    units: A
- check:
    id: cal.1961-01-18.china-leadership
    text: 'Check: the speakers: Wu (445–449) has Liu Shaoqi and Chen Yun speak on the Moscow conference at the plenum''s close, Jan. 18, as well as Mao.'
- add:
    entry:
      id: cal.1961-09-05.china-leadership-2
      when: Sept. 5
      date: '1961-09-05'
      time_range:
      - 1961-09-05T04:00Z
      - 1961-09-05T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Lushan, Mao''s new house by the artificial lake, afternoon. The Standing Committee meets; of the writers Wu Lengxi alone is there, Hu Qiaomu, ill since the summer, resting by Mao''s order. Zhou Enlai raises the CPSU''s published draft Programme: very long, no time yet to read it, the Peking comrades say it is no good programme. Two views. It is the CPSU''s own affair, not a document of the brother parties'' meeting; China cannot oppose it now nor wholly approve it, may support what is positive and pass the negative, as in what the Soviets do on it abroad; its "state of the whole people" and "party of the whole people" are against Marxism–Leninism and worth study. And the Twenty-second Congress, to take up the Programme: China will say nothing of it but must reckon that the Congress will attack China, or Albania alone; if so, to answer point for point. The Liaison Department and the Foreign Ministry to consider now what to do either way and report. Mao: the draft is long, to be read at leisure, the writers above all.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 457–459 ("the afternoon of Sept. 5"). Made public: 1999. See [[cal.1961-09-05.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
      src:
        c: b822623c
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 457–459: all'
- cite:
    id: cal.1961-09-15.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 459–467 (the afternoon of Sept. 15, at Mao''s residence, the Standing Committee on the CPSU''s draft Programme, Lu Dingyi, Wang Jiaxiang, Liu Ningyi, Zhang Hanfu, Peng Zhen, Yang Shangkun and Wu present, Deng Xiaoping, there for the first half, gone to lead a delegation to Korea; Mao: Old Mrs. Wang''s foot-bindings, long and foul, no head or tail, no conclusion today; Lu Dingyi: two-faced, behind the 1957 Declaration and the 1960 Statement, errors struck out at Moscow put back, no class struggle, reformism, humanism, the "state" and "party of the whole people" a dropping of the dictatorship of the proletariat, abroad level with Kennedy, "first inside, then outside"; Mao in interjections: two years'' struggle did not hold Khrushchev; a high-salaried stratum, a new bourgeoisie; self-reliance learned from Lenin and Stalin; mend the fortress, prepare for a fight at the Twenty-second Congress, publish the Programme once adopted and answer it, the 1957 and 1960 documents as weapons, lengthen the thaw, a "self-defense counterattack" if attacked; Liu: the line since the Twentieth Congress made systematic, "three peaces and two wholes")'
    units: B
- check:
    id: cal.1961-09-15.china-leadership
    text: 'Check: the matters: Wu (459–467) has the Standing Committee at Mao''s residence that afternoon on the CPSU''s draft Programme; whether one session or two.'
- add:
    entry:
      id: cal.1961-09-20.china-leadership-5
      when: Sept. 20
      date: '1961-09-20'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. Liu Shaoqi calls a small meeting on the CPSU''s Twenty-second Congress, Mao away. Liu: the draft Programme is aimed at China and at Albania, neither named. The delegation is to follow Mao''s line from the end of the Lushan conference: hold to principle and to unity, oppose attacks on Albania, strike back if China is attacked. Three points. (1) The Programme''s plan to build communism only to be spoken to, in empty words, no substance, the Programme itself not named. (2) Mao and Liu not to go, Zhou Enlai to head the delegation and stay only a week, not till the close, for home affairs, the seven-year plan to go to the Central Work Conference and the National People''s Congress. (3) If the CPSU proposes a conference of brother parties, resist: without Albania, as at the Warsaw summit, it would be a split meeting. Reported to Mao, who agrees; Zhou begins to form the delegation, Peng Zhen and Kang Sheng among its members.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 468–469 ("a small meeting called by Liu Shaoqi on Sept. 20"). Made public: 1999. See [[cal.1961-09-15.china-leadership]]. Names: Liu Shaoqi, Mao Zedong, Zhou Enlai, Peng Zhen, Kang Sheng. Check: whether this is the Politburo meeting of that day in [[cal.1961-09-20.china-leadership]], whose matters differ; Wu names a small meeting.'
      tags:
