- add:
    entry:
      id: cal.1960-11-14.soviet-union
      when: Nov. 14
      date: '1960-11-14'
      time_range:
      - 1960-11-14T03:00Z
      - 1960-11-14T09:00Z
      time_band: morning
      time_zone: Europe/Moscow
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. Kim Il speaks for the Korean party the whole morning. He twice names the USSR and China together as heads of the camp and twice China's aid to Korea; says the Chinese revolution and building have great historic meaning and its experience means much to backward countries, and that the Chinese Party is loyal to revolution and internationalism; speaks at length of Korea's own fight against copying foreign experience as dogmatism; on the movement, the chief danger is revisionism; against charges of factionalism; the parties equal, to proceed by consultation to agreement.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 381 ("in the morning" of the 14th, "a whole morning"; the speaker 金一, Kim Il, the image read). Made public: 1999. See [[cal.1960-11-12.soviet-union]].'
      tags:
      - polity:prc
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
        c: '80698006'
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 381: all'
- add:
    entry:
      id: cal.1960-11-14.soviet-union-2
      when: Nov. 14
      date: '1960-11-14'
      time_range:
      - 1960-11-14T09:00Z
      - 1960-11-14T15:00Z
      time_band: afternoon
      time_zone: Europe/Moscow
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow, St. George''s Hall, afternoon, the hall full, the whole CPSU Presidium there. Deng Xiaoping speaks for China, a dozen matters, much that of the Reply of Sept. 10. The differences were first raised by the CPSU; it brought them into an international meeting and sprang the surprise attack on China at Bucharest; carried an ideological quarrel into relations of states, tore up every agreement and contract and withdrew every Soviet expert; and first made the differences known to the world. Khrushchev''s "division of labor" and "equal consultation" are false: he wants all to follow his baton and strikes at those who do not. On Poland in 1956 the Soviets prepared to move troops; China opposed it and helped bring the two parties to terms; on Hungary, China, with Liu at Moscow, urged the Soviets not to leave the Hungarian people, and they, after refusing, sent troops back the next day. Both times China helped the Soviets, and Khrushchev bears it a grudge: he says China lectured him, and gnashes at Zhou Enlai''s lessons in Moscow in January 1957. China cannot "check watches" with him. Khrushchev loves the enemy: he lauded Eisenhower around Camp David, and in September 1955 told Adenauer China''s numbers meant a "yellow peril." More could be said, not today. By Mao''s order before the delegation left, not all the shot is fired: the Korean War, the joint fleet, the long-wave station, Soviet air forces in China are held back.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 381–384 ("the afternoon of the 14th"; "silent" hall). Made public: 1999. See [[cal.1960-11-10.soviet-union]]. Names: Deng Xiaoping, Khrushchev, Zhou Enlai, Liu Shaoqi, Mao Zedong. Check: the account is Wu''s summary of the speech.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:khrushchev-nikita-s
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:mao-zedong
      - vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia+indonesia
      src:
        c: 58025b3c
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 381–384: all'
      follows:
      - cal.1960-11-14.soviet-union
- add:
    entry:
      id: cal.1960-11-15.china-leadership-4
      when: Nov. 15
      date: '1960-11-15'
      time_range:
      - 1960-11-15T19:00Z
      - 1960-11-15T21:00Z
      time_band: night
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, the Chinese embassy. The delegation meets the nights of Nov. 14 and 15 on the first round. Its reading: the CPSU holds to pressing China by a majority, as at Bucharest; many delegates abuse China without reason, some from parties China helped; the middle parties dislike it and fear a break; the left pleased by Deng''s naming, afraid of the consequence. It resolves (1) to tell the drafting committee, through each delegation''s liaison man, that China will sign no statement that, unnamed, charges the Chinese Party: the "nails" must come out; (2) to be ready for a break and to fight on that footing; Liu: with the back to the river, a fight to the end. It cables Peking late on the 15th for leave.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 385–387 ("the night of the 14th" and "the night of the 15th"; the cable "on the night of the 15th"). Made public: 1999. See [[cal.1960-11-14.soviet-union-2]]. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
      src:
        c: 695e24f3
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 385–387: all'
