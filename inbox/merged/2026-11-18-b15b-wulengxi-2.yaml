      date: '1960-12-09'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Irkutsk. Liu Shaoqi visits the hydroelectric station and Lake Baikal, and attends the banquet of the city and regional Party committees, where he makes his last speech in the USSR, the dictated passage in it: the impression of these days is that Soviet and Chinese peoples alike strongly want unity of the two parties, states and peoples; whatever harms the base of that unity, the basic principles of Marxism–Leninism, will not pass among the Chinese, the Soviet, the socialist camp''s peoples, or the 90 percent of the world''s. In the afternoon he flies home.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 436–438 ("the next day, the 9th"; the banquet called welcome (436) and farewell (437); the flight "that afternoon"; *Pravda*''s text of the speech omits the passage, 437). See [[cal.1960-12-08.china-leadership-2]]. Names: Liu Shaoqi.'
      tags:
