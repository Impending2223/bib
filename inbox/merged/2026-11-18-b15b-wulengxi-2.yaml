      id: cal.1960-11-11.soviet-union
      when: Nov. 11
      date: '1960-11-11'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. The conference goes on; delegates of eleven parties speak.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 381 (the 11th). Made public: 1999. See [[cal.1960-11-10.soviet-union]].'
      tags:
      - polity:prc
