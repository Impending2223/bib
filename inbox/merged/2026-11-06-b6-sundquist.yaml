      id: cal.1965-05-14.open-housing
      when: May 14
      date: '1965-05-14'
      thread: open-housing
      also:
      - press-and-broadcasting
      c: 'Evans and Novak in the *Washington Post*: several members of the President''s Committee on Equal Opportunity in
        Housing, its Negro members among them, will resign if Johnson rejects its call for a broader order. That would mean
        "the virtual dissolution of the Lawrence committee" and "would trigger recriminations from responsible civil rights
        leaders."'
      n: '[[w.sundquist-politics-and-policy]], 276. To check: Rowland Evans and Robert Novak, *Washington Post*, May 14, 1965
        (cited by [[w.sundquist-politics-and-policy]], 276 n.173). Names: Evans, Novak, Johnson, Lawrence.'
