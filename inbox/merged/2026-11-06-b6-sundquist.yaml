      when: Feb.–Mar.
      date: 1961-02
      thread: medicare
      c: Mills, "tentatively opposed" to the administration's bill, sends word to the President that "something can be worked
        out" if he is given time; his committee to be bypassed, the measure begun in the Senate as an amendment to a House-passed
        bill. Kennedy "kept after" Mills; Mills does not move.
      n: '[[w.sundquist-politics-and-policy]], 308. Check: the day; Sundquist places it after the bill''s introduction and
        before April. To check: [[w.sorensen-kennedy]], 343 (cited by [[w.sundquist-politics-and-policy]], 308 n.61). See
        [[cal.1961-02-09.medicare]]. Names: Mills, Kennedy.'
