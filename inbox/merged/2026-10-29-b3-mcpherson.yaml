        rows:
        - 'w.mcpherson-political-education 284: all'
- add:
    entry:
      id: cal.1966-11-08.conservation
      when: Nov. 8
      date: '1966-11-08'
      thread: conservation
      c: 'McPherson to Johnson, 6:45 p.m., on the geothermal steam bill: "a bad bill and I believe you should veto it." Perpetual
        leases; grandfather rights for mineral leases held Sept. 7, 1965; no renegotiation; competitive bidding only in known
        areas; royalties only on steam sold or used; a 15-year primary term; 51,200 acres. FPC, Budget and CEA against; Interior
        for signing.'
      n: '[[w.mcpherson-political-education]], 274–76 (the memorandum, quoted). Names: McPherson, Johnson.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      src:
        c: 2bd410ce
        rows:
        - 'w.mcpherson-political-education 274–76: all'
- add:
    entry:
      id: cal.1966-11-13.conservation
      when: Nov. 13
      date: '1966-11-13'
      thread: conservation
      c: 'The Geothermal Steam Act, S. 1674, vetoed by memorandum: "many of the principles embodied in the bill violate the
        public interest."'
      n: 'Memorandum of Disapproval of the Geothermal Steam Bill, [1966 Pub. Papers 1386](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=760)
        (Nov. 13, 1966). [[w.mcpherson-political-education]], 276 (vetoed, its sponsor an old friend). See [[cal.1966-11-08.conservation]].
        Names: Johnson.'
      tags:
