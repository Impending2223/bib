- add:
    entry:
      id: cal.1966-01-25.poverty
      when: Jan. 25
      date: '1966-01-25'
      thread: poverty
      also:
      - farm
      c: 'Message on rural America: "I do not believe we should stand idly by and permit our rural citizens to be ground into
        poverty." A Commission on Rural Poverty to be appointed, its recommendations within a year.'
      n: 'Special Message to the Congress Proposing a Program for Rural America, [1966 Pub. Papers 77](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=153)
        (Jan. 25, 1966). [[w.mcpherson-political-education]], 299 (McPherson''s draft; the commission his idea, Freeman and
        the President agreeing; its report, *The People Left Behind*, filed away). Names: Johnson, McPherson, Freeman.'
      tags:
      - name:johnson-lyndon-b
