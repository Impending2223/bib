      - name:enthoven-alain-c
      - name:roche-john-p
      - name:brzezinski-zbigniew
      src:
        c: 401ae1c6
        rows:
        - 'w.mcpherson-political-education 293–94: all'
- add:
    entry:
      id: cal.1967-06-05.middle-east-six-day-war
      when: June 5
      date: '1967-06-05'
      thread: middle-east-six-day-war
      c: 'Tel Aviv. McPherson, sent on from Saigon to carry Johnson''s concern to Eshkol, with Barbour and Amit: the Egyptian
        buildup in Sinai, shelling of the Negev; no need to go to the shelter. By McPherson''s account, the general''s calm
        tells them the Egyptian air force is destroyed. Telegram 3937.'
      n: 'FRUS 1964–68, XIX, doc. [158](https://history.state.gov/historicaldocuments/frus1964-68v19/d158) (its note: telegram
        3937 from Tel Aviv, June 5, the meeting of Amit, Barbour and McPherson). [[w.mcpherson-political-education]], 413–15
        (the meeting; McPherson''s inference). Check: McPherson dates his arrival June 6 (414). See [[cal.1967-06-05.middle-east]].
        Names: McPherson, Johnson, Eshkol, Barbour.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      - name:eshkol-levi
      - name:barbour-walworth
      src:
        c: c9e46438
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v19/d158: A-B, E'
        - 'w.mcpherson-political-education 413–15: all'
- add:
    entry:
      id: cal.1967-06-13.vietnam-2
      when: June 13
      date: '1967-06-13'
      thread: vietnam
      c: 'McPherson to Johnson, 8:15 p.m., after two weeks in Vietnam: the campus question, whether to be there, "almost beside
        the point"; "We are there in such enormous force." Kỳ on corruption: "You live with it in Chicago and New York"; on
        a program, "We''ll all sound like Roosevelts." Pacification needs "constant pressure from here."'
      n: 'FRUS 1964–68, V, doc. [197](https://history.state.gov/historicaldocuments/frus1964-68v05/d197). [[w.mcpherson-political-education]],
        404–13 (the trip; the memorandum, quoted in part). Made public: FRUS 1964–68, V (2002). Names: McPherson, Johnson,
        Nguyễn Cao Kỳ.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      - name:nguyen-cao-ky
      src:
        c: '28568505'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d197: all'
        - 'w.mcpherson-political-education 404–13: all'
- add:
    entry:
      id: cal.1967-08-01.civil-disorders
      when: Aug. 1
      date: '1967-08-01'
      thread: civil-disorders
      c: 'McPherson to Christian: "we look awfully programmatic and legalistic"; quit "beating up on Congress" over the rat
        bill unless the President goes before a joint session; "rewarding" the rioters "a hollow issue." A visit to Newark
        with Governor Hughes. Shown to the President; no answer known.'
      n: '[[w.mcpherson-political-education]], 360–61 (the memorandum, quoted). Names: McPherson, Christian, Richard Hughes.'
      tags:
      - name:mcpherson-harry
      - name:christian-george
      - name:hughes-richard-j
      src:
        c: 3118e253
        rows:
        - 'w.mcpherson-political-education 360–61: all'
- add:
    entry:
      id: cal.1967-09-14.crime-and-hijacking
      when: Sept. 14
      date: '1967-09-14'
      thread: crime-and-hijacking
      also:
      - civil-disorders
      c: 'Kansas City, the International Association of Chiefs of Police, McPherson''s draft: "Much can explain—but nothing
        can justify—the riots of 1967"; the agitators "poisonous propagandists." Johnson adds: "We cannot tolerate behavior
        that destroys what generations of men and women have built here in America."'
      n: 'Remarks in Kansas City, Missouri, at the Meeting of the International Association of Chiefs of Police, [1967 Pub.
        Papers 831](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=223) (Sept. 14, 1967).
        [[w.mcpherson-political-education]], 377–79 (the draft; the line added extemporaneously; the chiefs'' applause). Names:
        Johnson, McPherson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      src:
        c: b536372d
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=223: all'
        - 'w.mcpherson-political-education 377–79: all'
- add:
    entry:
      id: cal.1968-03.elections-1968-2
      when: Mar.
      date: 1968-03
      thread: elections-1968
      c: 'Lunch at the edge of the Rose Garden, Johnson with Califano and McPherson: he has thought of not running. McPherson:
        "Of course you must run." Johnson: "Give me three good reasons why"; Nixon, McCarthy or Kennedy could get a program
        through next year better than he: "Congress and I are like an old man and woman who''ve lived together for a hundred
        years." By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 427–28. Check: the day; McPherson, "mid-March," a few days before his memorandum
        of Mar. 18. Names: Johnson, Califano, McPherson, Nixon, McCarthy, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:mcpherson-harry
      - name:nixon-richard-m
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      src:
        c: 4578914a
        rows:
        - 'w.mcpherson-political-education 427–28: all'
- add:
    entry:
      id: cal.1968-03.vietnam-205000
      when: Mar.
      date: 1968-03
      thread: vietnam-205000
      c: 'Clifford to McPherson by telephone, after the fourth draft of the address: the war cannot be won at the present
        level, only prolonged; wind it down, beginning with no substantial new forces. "We must be watchful for any sign that
        the war is to be wound up again, and not down." By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 431. Check: the day; McPherson, mid-March, six weeks after the first draft.
        Names: Clifford, McPherson.'
      tags:
      - name:clifford-clark
      - name:mcpherson-harry
      src:
        c: a729eed4
        rows:
        - 'w.mcpherson-political-education 431: all'
- add:
    entry:
      id: cal.1968-03-23.vietnam-205000
      when: Mar. 23
      date: '1968-03-23'
      thread: vietnam-205000
      c: 'McPherson to Johnson, 12:20 p.m.: a sequence. Announce the bombing halted north of the 20th parallel and representatives
        sent to Geneva and Rangoon; when Hanoi asks a full halt, offer it if they spare the bases, the cities of I Corps and
        Saigon and stop shelling from the DMZ. "Purpose of the exercise: to show the American people that we are willing to
        do every reasonable thing." Johnson: "Walt—For Rostow, Rusk, Clifford, comments at once."'
      n: 'FRUS 1964–68, VI, doc. [152](https://history.state.gov/historicaldocuments/frus1964-68v06/d152). [[w.mcpherson-political-education]],
        432–33 (the memorandum; the President sends for more copies). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-22.vietnam-205000]].
        Names: McPherson, Johnson, Rostow, Rusk, Clifford.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      - name:rostow-walt-w
      - name:rusk-dean
      - name:clifford-clark
      src:
        c: a3f1dff0
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d152: all'
        - 'w.mcpherson-political-education 432–33: A-C'
- add:
    entry:
      id: cal.1968-03-29.vietnam-205000-2
      when: Mar. 29
      date: '1968-03-29'
      thread: vietnam-205000
      c: 'Morning. Johnson to McPherson by telephone on the two drafts of the address: "Now, I don''t want to say that on
        page 3 . . ."; he is working from the alternative, the speech for peace. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 437. See [[cal.1968-03-28.vietnam]]. Names: Johnson, McPherson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      src:
        c: e3a157cf
        rows:
        - 'w.mcpherson-political-education 437: all'
