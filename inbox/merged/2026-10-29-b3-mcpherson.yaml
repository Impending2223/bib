- add:
    entry:
      id: cal.1961-09.rules
      when: Sept.
      date: 1961-09
      thread: rules
      c: 'Mansfield in the Senate on Rule XXII, McPherson''s draft: "I could not endorse majority cloture"; but "a time does
        come when the arguments, although relatively germane, have been repeated sufficiently to be heard by those who have
        ears to hear," and then a "substantial majority" should close debate. Three-fifths. Johnson and Russell congratulate
        him.'
      n: '[[w.mcpherson-political-education]], 186–87. Check: the day and the Record''s page; McPherson puts it "in late summer,"
        when the debate resumed. See [[cal.1961-01-11.rules]]. Names: Mansfield, McPherson, Johnson, Russell.'
