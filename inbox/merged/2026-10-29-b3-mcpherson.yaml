        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=760: all'
        - 'w.mcpherson-political-education 276: A'
- add:
    entry:
      id: cal.1967-03.vietnam-air-war
      when: Mar.
      date: 1967-03
      thread: vietnam-air-war
      c: 'McPherson to Johnson: "I believe in the policy of bombing the North," but cannot see where bombing around Hanoi
        and Haiphong "will get us"; on Hồ''s staff he would expect it and prepare. Saturate a band thirty to fifty miles north
        of the 17th parallel, in North Vietnam and Laos, the North warned; then renew the effort to talk.'
      n: '[[w.mcpherson-political-education]], 400–01 (the memorandum, quoted). Check: the day. Names: McPherson, Johnson,
        Hồ Chí Minh.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      - name:ho-chi-minh
      src:
        c: 01189525
        rows:
        - 'w.mcpherson-political-education 400–01: all'
- add:
    entry:
      id: cal.1967-04-19.jobs-and-wages
      when: Apr. 19
      date: '1967-04-19'
      thread: jobs-and-wages
      c: 'McPherson to Johnson, 5:20 p.m., on the AFL-CIO''s request of March: an executive order barring government contracts
        to firms that persistently violate the labor laws. The one such firm, J. P. Stevens: about $75 million of Defense
        work in fiscal 1966, $42 million this year, 5 percent of its business; its labor practices "Neanderthal." No order
        now; the Labor-Management Advisory Committee to study it.'
      n: '[[w.mcpherson-political-education]], 288–90 (the memorandum, quoted). Names: McPherson, Johnson.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      src:
        c: a4e8a9dc
        rows:
        - 'w.mcpherson-political-education 288–90: all'
- add:
    entry:
      id: cal.1967-05.vietnam-support
      when: May
      date: 1967-05
      thread: vietnam-support
      c: 'Lunch, at Cater''s and McPherson''s suggestion: Johnson with intellectuals of his administration, Gardner, Wood,
        Haar, Harold Brown, Enthoven, the economic advisers, Roche and others. The war has soured the academic world; Brzezinski:
        the President''s style. Johnson: he has enacted what they asked; he will not agonize in public; explain him to their
        colleagues.'
      n: '[[w.mcpherson-political-education]], 293–94. Check: the day. Names: Cater, McPherson, Johnson, Gardner, Wood, Haar,
        Harold Brown, Enthoven, Roche, Brzezinski.'
      tags:
      - name:cater-s-douglass
      - name:mcpherson-harry
