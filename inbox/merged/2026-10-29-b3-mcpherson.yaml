- add:
    entry:
      id: cal.1966-09-12.civil-rights-the-executive
      when: Sept. 12
      date: '1966-09-12'
      thread: civil-rights-the-executive
      also:
      - civil-rights-organizations
      c: 'McPherson to Johnson, 7 p.m.: "The civil rights movement is obviously in a mess"; this year''s bill lost; "You are
        the principal civil rights leader in the country." Call in a dozen for advice: Randolph, King, Wilkins, Young, Leon
        Sullivan, Barbara Jordan, Higginbotham and others; SNCC and CORE no longer needed. No meeting held.'
      n: '[[w.mcpherson-political-education]], 355–58 (the memorandum, quoted; Katzenbach''s reply against a meeting and McPherson''s
        answer, undated). Names: McPherson, Johnson, Randolph, Martin Luther King, Wilkins, Young, Jordan, Higginbotham, Katzenbach.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
