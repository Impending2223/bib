        rows:
        - 'w.mcpherson-political-education 186–87: all'
- add:
    entry:
      id: cal.1963-12-01.transition-and-staff
      when: Dec. 1
      date: '1963-12-01'
      thread: transition-and-staff
      c: 'Sunday. Johnson, back from St. Mark''s with McPherson, in the Oval Office: Rowe, estranged since the 1960 campaign,
        comes in; Johnson apologizes, asks his support and counsel: "Damn it, can''t you be content to be the first man the
        thirty-sixth President of the United States has apologized to?" By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 215–16. Check: the day; McPherson, "the following week" after Sunday, Nov.
        24. Names: Johnson, McPherson, Rowe.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      - name:rowe-james-h-jr
      src:
        c: 59b9559b
        rows:
        - 'w.mcpherson-political-education 215–16: all'
