        - 'w.mcpherson-political-education 299: all'
- add:
    entry:
      id: cal.1966-05-14.conservation
      when: May 14
      date: '1966-05-14'
      thread: conservation
      c: 'McPherson to Johnson, 1:45 p.m.: the Corps of Engineers charging user fees at unimproved sites under the Land and
        Water Conservation Fund Act; Mills''s bill against it, Edmondson and Albert for it, Dingell against. The Corps agrees
        to take down the signs and charge only where there is improvement; Albert and Edmondson not to press the bill.'
      n: '[[w.mcpherson-political-education]], 283–84 (the memorandum, quoted). Names: McPherson, Johnson, Mills, Edmondson,
        Albert, Dingell.'
      tags:
      - name:mcpherson-harry
