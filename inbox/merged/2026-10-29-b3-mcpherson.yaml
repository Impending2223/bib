      - name:edmondson-edmond-a
      - name:albert-carl
      - name:dingell-john-d
      src:
        c: b0ff618e
        rows:
        - 'w.mcpherson-political-education 283–84: all'
- add:
    entry:
      id: cal.1966-09-09.defense
      when: Sept. 9
      date: '1966-09-09'
      thread: defense
      c: 'McPherson to Johnson, 9:15 a.m., on the military construction authorization bill: base closings to wait 30 days
        of "continuous session"; Justice: a veto could rest on the Constitution if the wait is unreasonable; Defense dislikes
        it, its program not hurt. Sign, with a statement.'
      n: '[[w.mcpherson-political-education]], 276–78 (the memorandum, quoted). Names: McPherson, Johnson.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      src:
        c: 785c1006
        rows:
        - 'w.mcpherson-political-education 276–78: all'
- add:
    entry:
      id: cal.1966-09-12.defense
      when: Sept. 12
      date: '1966-09-12'
      thread: defense
      c: The military construction authorization bill, S. 3105, signed. Thirty days of "continuous session" before a base
        closing, "a flat bar" while Congress is away; Johnson's "serious doubts" resolved for approval, revision to be sought.
      n: 'Statement by the President Upon Signing the Military Construction Authorization Bill, [1966 Pub. Papers 1008](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=382)
        (Sept. 12, 1966). [[w.mcpherson-political-education]], 276–78 (McPherson''s advice to sign). Check: the Statutes at
        Large. See [[cal.1966-09-09.defense]]. Names: Johnson.'
      tags:
