- add:
    entry:
      id: cal.1965-04-03.health
      when: Apr. 3
      date: '1965-04-03'
      thread: health
      also:
      - congress
      c: 'Johnson names a committee to review the closing of veterans hospitals: Prettyman chairman; Russell Long, Teague
        and Adair; Gleason, Gruenther, Paul Dudley White, Harwick. The hearings "have raised some doubts in my mind." Report
        by June 1.'
      n: 'Statement by the President Upon Appointing a Committee To Review the Closing of Veterans Hospitals, [1965 Pub. Papers
        379](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=455) (Apr. 3, 1965). [[w.mcpherson-political-education]],
        281–82 (the committee McPherson''s proposal, Johnson amending the statement). Check: the closings announced in January,
        and the committee''s report (McPherson: nine of eleven kept, 282). Names: Long, Teague, Adair, Gruenther, Johnson,
        McPherson.'
      tags:
