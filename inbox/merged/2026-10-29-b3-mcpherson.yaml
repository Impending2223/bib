        - 'w.mcpherson-political-education 355–58: all'
- add:
    entry:
      id: cal.1966-10-05.program
      when: Oct. 5
      date: '1966-10-05'
      thread: program
      c: 'McPherson to Johnson, 6:30 p.m.: the Hirshhorn Gallery bill passes the House only if the armed forces pathologists,
        whose museum it replaces, get a building of their own. Defense to support a museum-laboratory at Walter Reed, McNamara
        not tied to a schedule; Gray''s bill reported by Rivers at once.'
      n: '[[w.mcpherson-political-education]], 284 (the memorandum, quoted). Names: McPherson, Johnson, McNamara, Gray, Rivers.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
