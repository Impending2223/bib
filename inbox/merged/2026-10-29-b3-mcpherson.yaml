      when: June 5
      date: '1968-06-05'
      thread: civil-disorders
      also:
      - robert-kennedy-campaign
      c: 'Address to the nation after the shooting of Robert Kennedy: "Two hundred million Americans did not strike down Robert
        Kennedy last night"; a commission on the causes and control of violence, Milton Eisenhower its chairman; the "insane
        traffic in guns" to be halted.'
      n: 'Address to the Nation Following the Attack on Senator Kennedy, [1968–69 Pub. Papers 691](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=769)
        (June 5, 1968). [[w.mcpherson-political-education]], 380–81 (written with Fortas and McPherson). See [[cal.1968-06-05.civil-disorders]].
        Names: Robert Kennedy, Eisenhower, Johnson, Fortas, McPherson.'
      tags:
      - name:kennedy-robert-f
      - name:eisenhower-milton-s
      - name:johnson-lyndon-b
      - name:fortas-abe
      - name:mcpherson-harry
      src:
        c: 2a8ec22f
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=769: all'
        - 'w.mcpherson-political-education 380–81: all'
- add:
    entry:
      id: cal.1968-06-14.crime-and-hijacking-safe-streets
      when: June 14
      date: '1968-06-14'
      thread: crime-and-hijacking-safe-streets
      c: 'McPherson to Johnson, 6:50 p.m.: "I recognize that you must sign this bill. But it is the worst bill you will have
        signed since you took office." Title III, wiretapping, "extremely dangerous"; Title II manageable. Blast the obnoxious
        provisions in signing and seek their repeal; attack the gun provision''s weakness.'
      n: '[[w.mcpherson-political-education]], 280 (the memorandum, quoted). Names: McPherson, Johnson.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      src:
