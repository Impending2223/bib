      id: cal.1965-03.vietnam-congress-2
      when: Mar.
      date: 1965-03
      thread: vietnam-congress
      c: 'Capitol Hill, the "Szilard group" of members, staff and journalists, at dinner on Vietnam. Hans Morgenthau: no anchor
        for containment in Asia; get out by negotiation. Chalmers Roberts and Edward P. Morgan against him. Church for negotiating
        a withdrawal as soon as possible; Bartlett with Church. McPherson''s memorandum on it to Johnson unanswered.'
      n: '[[w.mcpherson-political-education]], 389–90. Check: the day; McPherson, soon after he joined the staff in March,
        the memorandum on Johnson''s desk about the time of Selma. Names: Roberts, Church, Bartlett, McPherson, Johnson.'
      tags:
      - name:roberts-chalmers-m
      - name:church-frank
      - name:bartlett-edward-l
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      src:
        c: 815ebbab
        rows:
        - 'w.mcpherson-political-education 389–90: all'
- add:
    entry:
      id: cal.1965-03-01.school-aid
      when: Mar. 1
      date: '1965-03-01'
      thread: school-aid
      c: 'Johnson to the National Conference on Educational Legislation at the White House, 6:10 p.m.: the bill "can be improved";
        the first train from Fredericksburg: "they will never get her started, and if they do they will never get her stopped."'
      n: 'Remarks Before the National Conference on Educational Legislation, [1965 Pub. Papers 226](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=302)
        (Mar. 1, 1965). [[w.mcpherson-political-education]], 249–50 (the remarks, mostly extemporaneous; to send the educators
        to the Capitol to lobby). See [[cal.1965-01-12.school-aid]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: 093c381f
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=302: all'
