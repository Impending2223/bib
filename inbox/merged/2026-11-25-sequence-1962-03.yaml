- edit:
    id: cal.1962-03-15.china-leadership-6
    base: 5544bab2
    set:
      n: '[[w.yang-shangkun-riji]], II, 133 (Mar. 15, 1962). The words: 下午 (II, 133). After [[cal.1962-03-15.china-leadership-4|Li Boren''s talk]]: the diary''s order alone, both in one sentence of the afternoon (II, 133). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Li Fuchun, Yang Shangkun.'
- edit:
    id: cal.1962-03-18.china-leadership-6
    base: e02fb7ee
    set:
      n: '[[w.zhu-de-nianpu-xinbian]], III, 1832. The words: 晚 (1832). After [[cal.1962-03-18.china-leadership-5|the mills]]: the mills are in Shanghai, and he leaves Shanghai that evening (III, 1832). Names: Zhu De.'
- edit:
    id: cal.1962-03-20.china-leadership-10
    base: 437cf21b
    set:
      n: '[[w.peng-zhen-nianpu-1902]], IV, 180; [[w.zhu-de-nianpu-xinbian]], III, 1832 (Mar. 20, 1962; Zhu De 朱德 presides at the fifty-first session of the Second National People''s Congress Standing Committee 第二届全国人大常委会第五十一次会议, which discusses the agenda of the Congress''s third session, the lists of its presidium and secretary-general and the members of its motions committee). The words: 下午 (IV, 180). After [[cal.1962-03-20.china-leadership-12|Zhu De''s return]]: on the train at Jinan Mar. 19, he is back in Peking Mar. 20 and presides there (III, 1832). Names: Peng Zhen, Zhu De.'
- edit:
    id: cal.1962-03-23.china-leadership
    base: c9746a62
    set:
      time: 1962-03-23T08:00Z
      time_zone: Asia/Shanghai
      n: '[[w.zhou-enlai-nianpu-1949]], II, 465 (Mar. 23, 1962); [[w.yang-shangkun-riji]], II, 136 (Mar. 23, 1962; 4 to 5:30 p.m., the Great Hall, the CPPCC''s plenary opens; Yang Shangkun attends; note 3: the third session of the Third National Committee); [[w.deng-xiaoping-nianpu-1904]], III, 1697 (Mar. 23–Apr. 18, 1962; Deng at the CPPCC''s session); [[w.chen-yi-nianpu]], 911 (Mar. 23–Apr. 18, 1962; Chen Yi at the session in the Great Hall of the People, and speaks on Apr. 17); [[w.peng-zhen-nianpu-1902]], IV, 181 (Mar. 23–Apr. 18, 1962; Peng Zhen at the CPPCC''s session). The words: 下午4时到5时半 (II, 136). Names: Zhou Enlai.'
- edit:
    id: cal.1962-03-23.china-leadership-4
    base: af2235fb
    set:
      n: '[[w.yang-shangkun-riji]], II, 136 (Mar. 23, 1962); [[w.deng-xiaoping-nianpu-1904]], III, 1697 (Mar. 23, 1962; Deng presides on the draft replies to the CPSU and the Indonesian party). After [[cal.1962-03-23.china-leadership|the CPPCC''s opening]]: the diary''s order alone, the Secretariat written after the opening, 4 to 5:30 p.m., and before the evening (II, 136). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). See [[cal.1962-03-03.china-leadership-4]]. Names: Deng Xiaoping.'
- edit:
    id: cal.1962-03-30.king
    base: aa2c97ae
    set:
      time: 1962-03-30T21:00Z
      time_approx: true
      time_zone: America/New_York
      n: '[[w.branch-parting-the-waters]], 583–84. The words: "this conversation ended about four o''clock that afternoon" (584); the time is the call''s end. Branch, 584: the White House had announced White''s choice hours before the action memorandum landed that evening; the book does not say whether before or after the call. To check: microphone notes, Mar. 30, 1962, FBI file 100-392452, subfile 5; Baumgardner to Sullivan, Mar. 30, 1962, serial 148 (cited by [[w.branch-parting-the-waters]], 583 n.3, 584 n.1); [*New York Times*, Mar. 31, 1962](https://timesmachine.nytimes.com/timesmachine/1962/03/31/issue.html), at 1 (cited by [[w.branch-parting-the-waters]], 584 n.2). See [[cal.1962-03-30.court]]. Names: Levison, Whittaker, Ribicoff, Byron White.'
    unset: [time_range, time_band, range_basis]
