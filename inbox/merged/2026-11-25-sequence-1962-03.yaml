- edit:
    id: cal.1962-03-05.china-leadership-6
    base: 1d5f7b47
    set:
      n: '[[w.yang-shangkun-riji]], II, 131 (Mar. 5, 1962). The words: 上午 (II, 131). After [[cal.1962-03-05.china-leadership-5|Shi Shuhan''s talk]]: the diary''s order alone, both in the morning (II, 130–31). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Li Fuchun, Yang Shangkun.'
- edit:
    id: cal.1962-03-05.china-leadership-8
    base: 303fc748
    set:
      n: '[[w.yang-shangkun-riji]], II, 131 (Mar. 5, 1962; note 1: Wei Wenbo). The words: 上午 (II, 131). After [[cal.1962-03-05.china-leadership-6|Li Fuchun''s talk]]: the diary''s order alone, both in the morning (II, 131). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Wei Wenbo.'
- edit:
    id: cal.1962-03-06.china-leadership-4
    base: 60dd2fa2
    set:
      n: '[[w.yang-shangkun-riji]], II, 131 (Mar. 6, 1962). The words: 5时至6时半 (II, 131). After [[cal.1962-03-06.china-leadership-3|the Secretariat]]: the diary''s order alone, the afternoon''s meeting written before the talk from 5 p.m. (II, 131). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Wang Jiaxiang, Yang Shangkun.'
- edit:
    id: cal.1962-03-06.china-leadership-10
    base: 8374a666
    set:
      n: '[[w.zhu-de-nianpu-xinbian]], III, 1830. After [[cal.1962-03-06.china-leadership-8|Maoping]] and [[cal.1962-03-06.china-leadership-9|the forum there]]: 随后，从茅坪来到宁冈县城砻市 (III, 1830). Made public: 2016. Names: Zhu De.'
- edit:
    id: cal.1962-03-06.china-leadership-11
    base: 4d95c0ec
    set:
      n: '[[w.zhu-de-nianpu-xinbian]], III, 1830. The words: 下午 (1830). After [[cal.1962-03-06.china-leadership-10|Longshi]]: the day runs from Ciping down the mountain to Maoping and then (随后) to Longshi (III, 1829–30); the arrival at Yongxin, in the afternoon, ends it. Names: Zhu De.'
- edit:
    id: cal.1962-03-08.china-leadership-7
    base: 13f634bd
    set:
      n: '[[w.yang-shangkun-riji]], II, 131 (Mar. 8, 1962). The words: 下午在家看文件，准备明天开第二次精简小组会议 (II, 131). After [[cal.1962-03-08.china-leadership-5|Zeng San''s talk]]: the diary''s order alone, Zeng San written before the afternoon (II, 131). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). See [[cal.1962-02-27.china-leadership-3]]. Names: Yang Shangkun.'
- edit:
    id: cal.1962-03-12.china-leadership-3
    base: b68c7c84
    set:
      n: '[[w.yang-shangkun-riji]], II, 132 (Mar. 12, 1962; note 1: Ye Zilong). The words: 上午 (II, 132). After [[cal.1962-03-12.china-leadership|the Streamlining Group''s papers]]: the diary''s order alone, both in the morning (II, 132). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Ye Zilong, Yang Shangkun.'
- edit:
    id: cal.1962-03-13.china-leadership-4
    base: ef01165f
    set:
      n: '[[w.yang-shangkun-riji]], II, 133 (Mar. 13, 1962). The words: 晚间 (II, 133). After [[cal.1962-03-13.china-leadership-3|Tian Jiaying''s call]]: the diary''s order alone, Tian''s call written after the afternoon''s meeting and before the evening (II, 133). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Luo Ruiqing, Yang Shangkun.'
