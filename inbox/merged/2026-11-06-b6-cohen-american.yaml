- add:
    entry:
      id: cal.1968-08-24.elections-1968-johnson
      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968-johnson
      c: 'Johnson at Southwest Texas State''s summer commencement, San Marcos, 9:27 a.m.: "I am not a candidate for anything, except maybe a rocking chair." The campaign''s rhetoric to deal with shortcomings "real or imagined"; the surest way to lose is "to drop out of the system."'
      n: 'Address at the Summer Commencement Exercises of Southwest Texas State College, [1968–69 Pub. Papers 910](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=220) (Aug. 24, 1968). [[w.cohen-american-pharaoh]], 470 (the day; "a college audience"). See [[cal.1968-08-09.democratic-party]]. Names: Johnson.'
      src:
