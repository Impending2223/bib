      when: Mar. 17
      date: '1966-03-17'
      thread: mayors
      c: 'Chicago. Daley leads the St. Patrick''s Day parade down State Street: 70,000 marching, 350,000 watching. The machine''s politicians, from Senator Paul Douglas to the precinct captains, on the reviewing stand.'
      n: '[[w.cohen-american-pharaoh]], 368–69. To check: *Chicago Tribune*, Mar. 18, 1966 (cited by [[w.cohen-american-pharaoh]], 368–69 n.20). Names: Daley, Paul Douglas.'
