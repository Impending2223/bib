      id: cal.1968-08.elections-1968-chicago-4
      when: Aug.
      date: 1968-08
      thread: elections-1968-chicago
      c: 'Chicago. Daley, hoping Johnson will accept a draft, makes ready for his birthday, the convention''s second day: a Texas-sized cake, a reservation at the Stockyard Inn for a party, signs hidden in the hall, "Birthday Greetings" and "We Love You LBJ."'
      n: '[[w.cohen-american-pharaoh]], 470. To check: *Washington Post*, Aug. 27, 1968; *Chicago Tribune*, Aug. 25, 1968 (cited by [[w.cohen-american-pharaoh]], 470 n.21); [[w.chester-american-melodrama]], 539, 569 (cited by [[w.cohen-american-pharaoh]], 470 n.21). Check: the days. See [[cal.1968-08-09.democratic-party]]. Names: Daley, Johnson.'
