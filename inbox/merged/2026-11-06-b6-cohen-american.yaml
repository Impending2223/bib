      date: '1964-11-21'
      thread: mayors
      c: 'Chicago. Daley''s daughter Mary Carol marries Robert Vanecko at Nativity of Our Lord Church. Kerner, Shapiro and other elected officials attend; a telegram from Johnson among the stack the family receives.'
      n: '[[w.cohen-american-pharaoh]], 324. To check: *Chicago Sun-Times*, Nov. 22, 1964; *Chicago Tribune*, Nov. 21, 1964 (cited by [[w.cohen-american-pharaoh]], 324 nn.78–79). Names: Daley, Kerner, Shapiro, Johnson.'
