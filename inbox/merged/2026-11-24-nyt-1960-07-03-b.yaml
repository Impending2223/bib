- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-4
      when: July 2
      date: '1960-07-02'
      thread: elections-1960-nomination
      c: 'Symington, in a brief statement, thanks Truman for his continued support: "we will have an open convention"; will work for a united party.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 ("Johnson''s Forces See New Hope of Blocking a Rush to Kennedy," the runover of John D. Morris''s story, Washington, July 2). See [[cal.1960-07-02.elections-1960-2]]. Names: Symington, Truman.'
      tags: [ok:fields-place, name:symington-william-s, name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-5
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: elections-1960-nomination
      c: 'Humphrey: Truman''s statement "a nice boost" for Symington and for Johnson; expects an open convention.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 ("Humphrey Is ''Impressed''," Washington, July 2, UPI). See [[cal.1960-07-02.elections-1960-2]]. Names: Humphrey, Truman, Symington, Johnson.'
      tags: [name:humphrey-hubert-h, name:truman-harry-s, name:symington-william-s, name:johnson-lyndon-b]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-6
      when: July 2
      date: '1960-07-02'
      place: hartford
      thread: elections-1960-nomination
      c: 'Ribicoff: Truman''s press conference part of the "last-minute desperation tactics" of a few men who would choose the candidate in a smoke-filled room; sad to see Truman join the effort to stop Kennedy.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 ("Ribicoff Chides Truman," Hartford, July 2, UPI: "tonight"). See [[cal.1960-07-02.elections-1960-2]]. Names: Ribicoff, Truman, Kennedy.'
      tags: [name:ribicoff-abraham, name:truman-harry-s, name:kennedy-john-f, state:ct, city:hartford]
      time_range:
      - 1960-07-02T23:00Z
      - 1960-07-03T02:00Z
      time_band: evening
      time_zone: America/New_York
      range_basis: record
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-7
      when: July 2
      date: '1960-07-02'
      place: sacramento
      thread: elections-1960-nomination
      c: 'Gov. Brown sees no signs of a rigged convention; Truman spoke as Symington''s "principal backer."'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 ("Brown Doubts Rigging," Sacramento, July 2, UPI). See [[cal.1960-07-02.elections-1960-2]]. Names: Brown, Truman, Symington.'
      tags: [name:brown-edmund-g, name:truman-harry-s, name:symington-william-s, state:ca, city:sacramento]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-8
      when: July 2
      date: '1960-07-02'
      place: libertyville
      thread: elections-1960-nomination
      c: 'Stevenson declines comment on Truman''s statement; regrets Truman will not be at the convention, where his presence "would add a great deal."'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 ("Stevenson Declines Comment," Libertyville, Ill., July 2, AP). See [[cal.1960-07-02.elections-1960-2]]. Names: Stevenson, Truman.'
      tags: [name:stevenson-adlai-e, name:truman-harry-s, state:il]
- add:
    entry:
      id: cal.1960-07-02.republican-party
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: republican-party
      also: [elections-1960-nomination]
      c: 'Rep. William E. Miller, Republican Congressional campaign chairman, endorses Truman''s charge: the Democratic convention a "rigged deal"; the networks should bill it as "the big pay-off" and send the bill to Kennedy.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 ("Many Republicans Happy," in Morris''s story). See [[cal.1960-07-02.elections-1960-2]]. Names: Miller, Truman, Kennedy.'
      tags: [name:miller-william-e, name:truman-harry-s, name:kennedy-john-f]
- add:
    entry:
      id: cal.1960-07-02.republican-party-congress
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: republican-party-congress
      also: [elections-1960-nomination]
      c: 'Halleck, House Republican leader, on Truman''s charge: "For once I find myself in agreement with Harry Truman."'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 (in Morris''s story; Nixon no comment). See [[cal.1960-07-02.elections-1960-2]]. Names: Halleck, Truman.'
      tags: [name:halleck-charles-a, name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-9
      when: July 2
      date: '1960-07-02'
      thread: elections-1960-nomination
      c: 'Eugene McCarthy, named on Truman''s list: "the podium seems to be a bit crowded"; pleased to be mentioned.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 (in Morris''s story). See [[cal.1960-07-02.elections-1960-2]]. Names: McCarthy, Truman.'
      tags: [ok:fields-place, name:mccarthy-eugene-j, name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-10
      when: July 2
      date: '1960-07-02'
      thread: elections-1960-nomination
      c: 'Gore, by telegram, thanks Truman for his "generous reference"; "a high compliment."'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 (in Morris''s story). See [[cal.1960-07-02.elections-1960-2]]. Names: Gore, Truman.'
      tags: [ok:fields-place, name:gore-albert-sr, name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-11
      when: July 2
      date: '1960-07-02'
      thread: elections-1960-nomination
      c: 'Henry Jackson, named by Truman: "flattered" but "obviously not a candidate."'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 (in Morris''s story). See [[cal.1960-07-02.elections-1960-2]]. Names: Jackson, Truman.'
      tags: [ok:fields-place, name:jackson-henry-m, name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-12
      when: July 2
      date: '1960-07-02'
      thread: elections-1960-nomination
      c: 'Joseph Clark, named by Truman, flattered; not a candidate for President and does not intend to become one.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 (in Morris''s story). See [[cal.1960-07-02.elections-1960-2]]. Names: Clark, Truman.'
      tags: [ok:fields-place, name:clark-joseph-s, name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-13
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: elections-1960-nomination
      also: [elections-1960-nixon]
      c: 'Kennedy''s Senate office staff, their set broken, watch Truman''s telecast in Nixon''s office, at the invitation of Klein, his press secretary; Nixon out.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 ("Kennedy Aides Watch Truman on Nixon TV," Washington, July 2, UPI). See [[cal.1960-07-02.elections-1960-2]]. Names: Kennedy, Truman, Nixon, Klein.'
      tags: [name:kennedy-john-f, name:truman-harry-s, name:nixon-richard-m, name:klein-herbert-g]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-14
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: elections-1960-nomination
      c: 'Johnson, by statement: agrees with Truman that the delegates should have a democratic choice; an effort to control the convention would leave bitter resentment; appreciates Truman''s "generous words." His supporters hope it will check an early-ballot rush to Kennedy; Kennedy withholds comment.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 19 (John D. Morris, "Johnson Staff Encouraged by Call for Open Contest," Washington, July 2: the statement''s text, at 1). See [[cal.1960-07-02.elections-1960-2]]. Names: Johnson, Truman, Kennedy.'
      tags: [ok:fields-time, name:johnson-lyndon-b, name:truman-harry-s, name:kennedy-john-f]
