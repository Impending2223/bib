      thread: cuba
      also: [oil]
      c: 'Cubana''s Madrid flight temporarily cancelled the night of July 1, the plane not to be refueled at Bermuda; July 2, the Miami flight leaves with twenty passengers, under half its load, to carry the most fuel.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 15 (Tad Szulc, "Cuban Airline Flights Cut as Oil Concerns Ask Cash," Havana, July 2: "last night," "today"). The time is the first day''s.'
