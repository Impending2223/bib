      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 10 (Middleton, "British Weighing Cabinet Shuffle"). Check: the day. Names: Home, Macmillan.'
      tags: [ok:fields-place, name:douglas-home-alec, name:macmillan-harold]
