      when: July 2
      date: '1960-07-02'
      thread: democratic-party
      also: [elections-1960-nomination]
      c: 'Butler, the Democratic National Chairman, after nearly three hours with advisers, decides to make no comment on Truman''s statement; Samuel Brightman, the committee''s publicity director, announces it.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1 (Leo Egan, "Kennedy Demands Air Time to Reply," Los Angeles, July 2: "this afternoon," the Los Angeles dateline''s clock; where Butler sat not said). See [[cal.1960-07-02.elections-1960-2]]. Names: Truman.'
      tags: [ok:fields-place, name:truman-harry-s]
