      thread: cuba
      also: [oil]
      c: 'Esso''s affiliates instructed to make Cubana, the state airline, pay cash in the country''s currency for each refueling. Allied New York Services, at Idlewild, puts Cubana on a cash basis the same day.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 15 ("Esso Explains Action," in Szulc''s runover: "Friday"; Cubana paid in dollars at Idlewild July 2).'
