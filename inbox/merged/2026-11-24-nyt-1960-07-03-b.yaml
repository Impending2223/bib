      c: 'Four Polish chemistry students jailed for smuggling dollars, Czarist gold rubles and platinum between Warsaw and Moscow.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 2 ("Students Jailed in Smuggling," Warsaw, July 2, Reuters: "yesterday").'
- add:
    entry:
