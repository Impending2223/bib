      when: July 2
      date: '1960-07-02'
      thread: china
      c: 'Peking radio: "thousands and even millions of people" mobilized against a nine-month drought in north China; Shansi (Shanxi) Province added to the areas affected, with Honan and Hopei.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 2 ("North China Drought Widens," Tokyo, July 2, UPI).'
      tags: [ok:fields-place]
