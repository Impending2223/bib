      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 10 (Drew Middleton, "British Weighing Cabinet Shuffle," London, July 2: "highly qualified Government sources"). Check: the day. Names: Macmillan.'
