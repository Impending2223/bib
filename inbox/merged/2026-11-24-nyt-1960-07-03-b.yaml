      when: July 2
      date: '1960-07-02'
      thread: europe-and-the-alliance-britain
      c: 'Aneurin Bevan, deputy leader of the Labor party, critically ill at his home in Buckinghamshire, six months after a major abdominal operation; announced by his physicians. Jennie Lee cancels a speaking engagement.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 2 ("Bevan Is Critically Ill," London, July 2).'
      tags: [ok:fields-place, ok:name-untagged]
- add:
    entry:
