      when: July 2
      date: '1960-07-02'
      place: accra
      thread: africa
      c: 'Balewa, Nigeria''s Federal Prime Minister, arrives in Accra for Ghana''s republic celebrations; talks with Nkrumah set for July 3. The two differ on African cooperation.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 2 ("Nigeria-Ghana Talk Set," Accra, July 2: "this morning"). Names: Balewa, Nkrumah.'
      tags: [name:balewa-abubakar-tafawa, name:nkrumah-kwame]
