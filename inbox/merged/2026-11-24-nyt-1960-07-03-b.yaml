      when: 'By July 2'
      date: '1960-07-02'
      place: geneva
      thread: testing
      c: 'Tsarapkin, the Soviet delegate at the Geneva test-ban talks, to ADN, the East German agency: the Soviet Union would break off the talks if the United States set off a nuclear explosion without Soviet agreement; aimed at the American proposal of a research program on test detection using nuclear explosives.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 2 ("Moscow Threatens to Quit Atom Talks," Bonn, July 2: the interview in Geneva, quoted "today"). Check: the interview''s day. Names: Tsarapkin.'
      tags: [name:tsarapkin-semen-k]
