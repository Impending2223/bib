patch: uppersouth
by: agent
ops:
  # ---------------------------------------------------------------- 1960
  - add:
      entry:
        id: cal.1960-05-28.governors-nc
        when: May 28
        date: '1960-05-28'
        thread: governors
        also: [elections-1960]
        c: 'North Carolina, Democratic primary for governor: Sanford, a former State senator, 269,463, 41.3 percent; Lake, a law professor, for keeping the schools segregated, 181,692, 27.8; Seawell 101,148, 15.5; Larkins 100,757, 15.4. A runoff.'
        n: 'Votes: [N.C. *Manual*, 1961, p. 242](https://archive.org/details/northcarolinaman1961nort/page/n255). [[w.drescher-triumph-of-good-will]]; [[w.covington-terry-sanford]]; [[w.black-southern-governors-and-civil]]. Names: Sanford (K–J Cong. III.F); Lake, Seawell, Larkins (K–J Cong. III.K).'
        tags: [state:nc, name:sanford-terry, name:lake-i-beverly, name:seawell-malcolm-b, name:larkins-john-d-jr]
  - add:
      entry:
        id: cal.1960-06-25.governors-nc
        when: June 25
        date: '1960-06-25'
        thread: governors
        also: [elections-1960]
        c: 'North Carolina, Democratic runoff for governor: Sanford 352,133, 56.1 percent; Lake 275,905.'
        n: 'Votes: [N.C. *Manual*, 1961, p. 242](https://archive.org/details/northcarolinaman1961nort/page/n255). See [[cal.1960-05-28.governors-nc]]. Names: Sanford (K–J Cong. III.F); Lake (K–J Cong. III.K).'
        tags: [state:nc, name:sanford-terry, name:lake-i-beverly]
  - add:
      entry:
        id: cal.1960-07-26.governors-ar
        when: July 26
        date: '1960-07-26'
        thread: governors
        also: [elections-1960]
        c: 'Arkansas, Democratic primary for governor: Faubus, for a fourth term, 238,997, 58.7 percent; Joe Hardin 66,499, 16.3; Bruce Bennett 58,400, 14.4; two others. No runoff.'
        n: 'Votes: [Ark. *Historical Report of the Secretary of State* (2018), p. 411](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=420). [[w.reed-faubus]]; [[w.faubus-down-from-the-hills]]. Names: Faubus (K–J Cong. III.F); Hardin, Bennett (K–J Cong. III.K).'
        tags: [state:ar, name:faubus-orval-e, name:hardin-joe-c, name:bennett-bruce]
  - add:
      entry:
        id: cal.1960-11-08.state-constitutions-ky
        when: Nov. 8
        date: '1960-11-08'
        thread: state-constitutions
        c: 'Kentucky''s voters refuse a convention to revise the constitution of 1891, called for by Combs and approved by the General Assembly in its special session of December 1959 and again in 1960. Lost by almost 18,000 votes (Check).'
        n: 'Check: the Secretary of State''s tabulation (the State Board''s file for 1960 holds the federal races only); the margin is Wikipedia''s ("Bert Combs"). [[w.pearce-divide-and-dissent]]; [[w.harrison-new-history-of-kentucky]]. Names: Combs (K–J Cong. III.F).'
        tags: [state:ky, name:combs-bert-t]
  # ---------------------------------------------------------------- 1961
  - add:
      entry:
        id: cal.1961-06-15.state-and-city-finance-nc
        when: June 15
        date: '1961-06-15'
        thread: state-and-city-finance
        c: 'North Carolina. The General Assembly ratifies Sanford''s revenue bill for his Quality Education Program: exemptions from the 3 percent retail sales tax removed, food''s among them; a surtax of 2 percent on liquor.'
        n: '[N.C. Sess. Laws 1961, ch. 826, p. 1053](https://archive.org/details/sessionlawsresol1961nort/page/n1106) (S.B. 78, ratified June 15, 1961). [[w.covington-terry-sanford]]; [[w.drescher-triumph-of-good-will]]. Names: Sanford (K–J Cong. III.F).'
        tags: [state:nc, name:sanford-terry]
  - add:
      entry:
        id: cal.1961-07-11.governors-va
        when: July 11
        date: '1961-07-11'
        thread: governors
        also: [elections-1961]
        c: 'Virginia, Democratic primary for governor: Harrison, the attorney general, the Byrd organization''s candidate, 199,519, 56.7 percent; Stephens, the lieutenant governor, running against the organization, 152,639, 43.3.'
        n: 'Votes: Wikipedia, ["1961 Virginia gubernatorial election"](https://en.wikipedia.org/wiki/1961_Virginia_gubernatorial_election), from Our Campaigns. Check: State Board of Elections, *Statement of the Vote*, Democratic Primary, July 11, 1961 (the Department of Elections'' historical database). [[w.wilkinson-harry-byrd-and-the]]; [[w.heinemann-harry-byrd-of-virginia]]; [[w.ely-crisis-of-conservative-virginia]]. Names: Harrison (K–J Cong. III.F); Stephens (K–J Cong. III.K); Byrd (K–J Cong. III.B).'
        tags: [state:va, name:harrison-albertis-s-jr, name:stephens-a-e-s, name:byrd-harry-f]
  - add:
      entry:
        id: cal.1961-11-07.governors-va
        when: Nov. 7
        date: '1961-11-07'
        thread: governors
        also: [elections-1961]
        c: 'Virginia: Harrison (D) elected governor over Pearson (R), a former delegate, 251,861 to 142,567, 63.8 percent. Godwin lieutenant governor.'
        n: 'Votes: Wikipedia, ["1961 Virginia gubernatorial election"](https://en.wikipedia.org/wiki/1961_Virginia_gubernatorial_election), from Our Campaigns. Check: State Board of Elections, *Votes Cast for Governor, Lieutenant Governor and Attorney General ... General Election, November 7, 1961*. See [[cal.1961-07-11.governors-va]]. Names: Harrison (K–J Cong. III.F); Pearson, Godwin (K–J Cong. III.K).'
        tags: [state:va, name:harrison-albertis-s-jr, name:pearson-h-clyde, name:godwin-mills-e-jr]
  - add:
      entry:
        id: cal.1961-11-07.mayors-louisville
        when: Nov. 7
        date: '1961-11-07'
        thread: mayors
        also: [elections-1961]
        c: 'Louisville: Cowger (R) elected mayor, succeeding Hoblitzell (D); Schmied (R) to the board of aldermen, its president (Check: the opponent and the vote).'
        n: 'Check: the Jefferson County returns; the *Courier-Journal*, Nov. 8, 1961. [[w.kmeyer-civil-rights-in-the]]. See [[cal.1961-11-07.states-and-cities]].'
        tags: [state:ky, city:louisville, name:cowger-william-o]
  # ---------------------------------------------------------------- 1962
  - add:
      entry:
        id: cal.1962-05-29.legislatures-tn
        when: May 29–June 22
        date: '1962-05-29'
        thread: legislatures
        c: 'Tennessee. Called by Ellington after *Baker v. Carr*, the General Assembly meets in extraordinary session May 29 and reapportions both houses, June 6, the first time since 1901; Ellington signs June 7. June 22, the three-judge court at Nashville: neither act apportions either house on the number of voters, and at least one must be; the August and November elections to go forward under them, the General Assembly so chosen to act by June 3, 1963.'
        n: '*Baker v. Carr*, [206 F. Supp. 341](https://static.case.law/f-supp/206/html/0341-01.html) (M.D. Tenn. 1962). [[w.graham-one-man-one-vote]]; [[w.smith-on-democracys-doorstep-2014]]; [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1962-03-26.court]].'
        tags: [state:tn, name:ellington-buford]
  - add:
      entry:
        id: cal.1962-06-28.states-and-cities-nashville
        when: June 28
        date: '1962-06-28'
        thread: states-and-cities
        also: [mayors]
        c: 'Nashville. Davidson County''s voters approve the charter of a Metropolitan Government of Nashville and Davidson County, city and county merged; a first charter had failed in 1958, and the city since annexed some 42 square miles. A General Services District, the county, and an Urban Services District, taxed more for the city''s services; a council of 40, five at large (Check: the vote, in the city and outside it).'
        n: 'Check: the Davidson County Election Commission''s returns. [[w.hawkins-nashville-metro]].'
        tags: [state:tn, city:nashville]
  - add:
      entry:
        id: cal.1962-07-31.governors-ar
        when: July 31
        date: '1962-07-31'
        thread: governors
        also: [elections-1962]
        c: 'Arkansas, Democratic primary for governor: Faubus 208,996, 51.6 percent, a fifth nomination without a runoff; McMath, governor 1949–53, 83,473, 20.6; Dale Alford, a Representative, 82,815, 20.4; three others.'
        n: 'Votes: [Ark. *Historical Report of the Secretary of State* (2018), p. 412](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=421). [[w.reed-faubus]]. Names: Faubus, McMath (K–J Cong. III.F).'
        tags: [state:ar, name:faubus-orval-e, name:mcmath-sidney-s, name:alford-thomas-d]
  - add:
      entry:
        id: cal.1962-08-02.governors-tn
        when: Aug. 2
        date: '1962-08-02'
        thread: governors
        also: [elections-1962]
        c: 'Tennessee, Democratic primary for governor: Clement, governor 1953–59, 309,333, 42.5 percent; Olgiati, mayor of Chattanooga, 211,812, 29.1; William Farris, of Memphis, 202,813, 27.9. A plurality nominates.'
        n: 'Votes: Wikipedia, ["1962 Tennessee gubernatorial election"](https://en.wikipedia.org/wiki/1962_Tennessee_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: Tenn. *Blue Book*. [[w.greene-lead-me-on]]. Names: Clement (K–J Cong. III.K); Olgiati (K–J Cong. III.F); Farris (K–J Cong. III.K).'
        tags: [state:tn, name:clement-frank-g, name:olgiati-p-r, name:farris-william-w]
  - add:
      entry:
        id: cal.1962-11-28.legislatures-va
        when: Nov. 28
        date: '1962-11-28'
        thread: legislatures
        also: [court]
        c: '*Mann v. Davis*: the three-judge court, one judge dissenting, holds the apportionment of Virginia''s General Assembly, made by the 1962 session, a denial of equal protection; the suit of Arlington and Fairfax voters, filed Apr. 9. The injunction stayed to Jan. 31, 1963, for the General Assembly to act or the State to appeal. Dec. 15, the Chief Justice stays it pending appeal; the 1963 elections held under the 1962 act.'
        n: '*Mann v. Davis*, [213 F. Supp. 577](https://static.case.law/f-supp/213/html/0577-01.html) (E.D. Va. 1962); *Davis v. Mann*, [377 U.S. 678](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377678/usrep377678.pdf), 683–84 (1964). [[w.cortner-apportionment-cases]]; [[w.smith-on-democracys-doorstep-2014]]. Names: Warren (K–J Cong. III.G).'
        tags: [state:va, name:warren-earl]
  # ---------------------------------------------------------------- 1963
  - add:
      entry:
        id: cal.1963-05.desegregation-public-places-greensboro
        when: May–June
        date: '1963-05'
        thread: desegregation-public-places
        also: [civil-rights-organizations]
        c: 'Greensboro. Demonstrations, the largest in the State''s history, led by students of A&T, for the desegregation of public accommodations and hiring by merit. The city and its businesses open further public facilities; the city changes its hiring.'
        n: '[[w.chafe-civilities-and-civil-rights]]. See [[cal.1960-02-01.sit-ins]].'
        tags: [state:nc, city:greensboro]
  - add:
      entry:
        id: cal.1963-05-14.desegregation-public-places-louisville
        when: May 14
        date: '1963-05-14'
        thread: desegregation-public-places
        c: 'Louisville''s Board of Aldermen passes an ordinance forbidding discrimination by race in places of public accommodation, with Cowger''s support (Check: the date and the vote).'
        n: 'Check: the ordinance, Louisville Board of Aldermen, 1963. [[w.kmeyer-civil-rights-in-the]]; [[w.harrison-new-history-of-kentucky]]. See [[cal.1961-11-07.mayors-louisville]].'
        tags: [state:ky, city:louisville, name:cowger-william-o]
  - add:
      entry:
        id: cal.1963-05-28.governors-ky
        when: May 28
        date: '1963-05-28'
        thread: governors
        also: [elections-1963]
        c: 'Kentucky, Democratic primary for governor: Breathitt, of Combs''s faction, 318,858, 53.8 percent; Chandler, governor 1935–39 and 1955–59, 256,451, 43.2. Nunn the Republican nominee, 77,455 to 10,039.'
        n: 'Votes: [Ky. *Statement of the Official Vote*, Democratic and Republican Primaries, May 28, 1963, sheets 1–2](https://elect.ky.gov/results/1973-1979/Documents/1963.pdf). [[w.pearce-divide-and-dissent]]; [[w.harrison-new-history-of-kentucky]]. Names: Combs, Chandler (K–J Cong. III.F); Breathitt, Nunn (K–J Cong. III.K).'
        tags: [state:ky, name:breathitt-edward-t, name:combs-bert-t, name:chandler-a-b, name:nunn-louie-b]
  - add:
      entry:
        id: cal.1963-06-26.antisubversion-nc
        when: June 26
        date: '1963-06-26'
        thread: antisubversion
        also: [students]
        c: 'North Carolina. In the session''s last hours, without hearings, the General Assembly passes the Act to Regulate Visiting Speakers: no college or university receiving State funds to let its facilities be used for speaking by a known member of the Communist Party, one known to advocate overthrow of the federal or State constitution, or one who has pleaded the Fifth Amendment on Communist or subversive connections. Three readings in the House in four minutes. The governor has no veto; Sanford opposed the bill.'
        n: '[N.C. Sess. Laws 1963, ch. 1207, pp. 1687–88](https://archive.org/details/sessionlawsresol1963nort/page/n1738) (H.B. 1395, ratified June 26, 1963). [[w.billingsley-communists-on-campus]]; [[w.link-william-friday]]. Names: Sanford (K–J Cong. III.F).'
        tags: [state:nc, name:sanford-terry]
  - add:
      entry:
        id: cal.1963-06-26.desegregation-public-places-ky
        when: June 26
        date: '1963-06-26'
        thread: desegregation-public-places
        c: 'Kentucky. Combs''s executive order, the Fair Services Code: no discrimination by race in the State''s public accommodations, and none in State contracts (Check: the date). Nunn, the Republican nominee for governor, calls it "rule by executive decree."'
        n: 'Check: the order and its date. [[w.harrison-new-history-of-kentucky]], 390; [[w.pearce-divide-and-dissent]]. Names: Combs (K–J Cong. III.F); Nunn (K–J Cong. III.K).'
        tags: [state:ky, name:combs-bert-t, name:nunn-louie-b]
  - add:
      entry:
        id: cal.1963-07-18.poverty-nc
        when: July 18
        date: '1963-07-18'
        thread: poverty
        c: 'The North Carolina Fund incorporated by Sanford and others: a private nonprofit corporation, for five years, for experiments against poverty in education, health, job training, housing and community development, and for racial equality. The Ford Foundation commits $7 million.'
        n: '[[w.korstad-to-right-these-wrongs]], 82; [[w.covington-terry-sanford]]. Names: Sanford (K–J Cong. III.F).'
        tags: [state:nc, name:sanford-terry]
  # ---------------------------------------------------------------- 1964
  - add:
      entry:
        id: cal.1964-01-14.poverty-nc
        when: Jan. 14
        date: '1964-01-14'
        thread: poverty
        c: 'Johnson to Sanford''s conference on poverty at Raleigh: "The North Carolina Fund promises to make an exciting and important contribution." The federal departments to cooperate.'
        n: '[Telegram to Governor Sanford on His Attack on Poverty in North Carolina](https://www.presidency.ucsb.edu/documents/telegram-governor-sanford-his-attack-poverty-north-carolina) (Jan. 14, 1964). See [[cal.1963-07-18.poverty-nc]]. Names: Sanford (K–J Cong. III.F); Johnson (K–J Adm. III.D).'
        tags: [state:nc, name:sanford-terry, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1964-03-05.desegregation-public-places-ky
        when: Mar. 5
        date: '1964-03-05'
        thread: desegregation-public-places
        c: 'Frankfort, Ky. Some 10,000 march on the Capitol for a State public accommodations bill; King, Abernathy and Jackie Robinson speak (Check: the date). The bill dies in committee.'
        n: 'Check: the *Courier-Journal*, Mar. 6, 1964. [[w.harrison-new-history-of-kentucky]]; [[w.kmeyer-civil-rights-in-the]]. See [[cal.1963-06-26.desegregation-public-places-ky]]. Names: King, Abernathy (K–J Cong. III.H); Robinson (K–J Cong. III.K).'
        tags: [state:ky, name:king-martin-luther-jr, name:abernathy-ralph-david, name:robinson-jackie]
  - add:
      entry:
        id: cal.1964-05-30.governors-nc
        when: May 30
        date: '1964-05-30'
        thread: governors
        also: [elections-1964]
        c: 'North Carolina, Democratic primary for governor: Preyer 281,430, 36.6 percent; Moore, a former Superior Court judge, 257,872, 33.5; Lake 217,172, 28.2; three others. A runoff. Gavin the Republican nominee.'
        n: 'Votes: [N.C. *Manual*, 1965, p. 278](https://archive.org/details/northcarolinaman1965nort/page/n295). [[w.covington-terry-sanford]]; [[w.black-southern-governors-and-civil]]. See [[cal.1960-05-28.governors-nc]]. Names: Moore (K–J Cong. III.F); Lake (K–J Cong. III.K).'
        tags: [state:nc, name:preyer-lunsford-r, name:moore-dan-k, name:lake-i-beverly]
  - add:
      entry:
        id: cal.1964-06-27.governors-nc
        when: June 27
        date: '1964-06-27'
        thread: governors
        also: [elections-1964]
        c: 'North Carolina, Democratic runoff for governor: Moore 480,431, 62.0 percent; Preyer 293,863.'
        n: 'Votes: [N.C. *Manual*, 1965, p. 278](https://archive.org/details/northcarolinaman1965nort/page/n295). See [[cal.1964-05-30.governors-nc]]. Names: Moore (K–J Cong. III.F).'
        tags: [state:nc, name:moore-dan-k, name:preyer-lunsford-r]
  - add:
      entry:
        id: cal.1964-07-28.governors-ar
        when: July 28
        date: '1964-07-28'
        thread: governors
        also: [elections-1964]
        c: 'Arkansas, Democratic primary for governor: Faubus, for a sixth term, 239,890, 65.7 percent; three others. Winthrop Rockefeller unopposed for the Republican nomination.'
        n: 'Votes: [Ark. *Historical Report of the Secretary of State* (2018), p. 412](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=421). [[w.reed-faubus]]; [[w.ward-arkansas-rockefeller]]. Names: Faubus (K–J Cong. III.F); Rockefeller (Opp. III.H).'
        tags: [state:ar, name:faubus-orval-e, name:rockefeller-winthrop]
  - add:
      entry:
        id: cal.1964-09-18.legislatures-va
        when: Sept. 18
        date: '1964-09-18'
        thread: legislatures
        c: 'Virginia. On the mandate in *Davis v. Mann*, the three-judge court reaffirms its order of 1962: the terms of the senators and delegates elected in 1963 to end by January 1966; enforcement stayed to Dec. 15 for a special session to reapportion. The General Assembly reapportions both houses in special session before then (Check: its dates).'
        n: '*Mann v. Davis*, [238 F. Supp. 458](https://static.case.law/f-supp/238/html/0458-01.html) (E.D. Va. 1964). See [[cal.1962-11-28.legislatures-va]]; [[cal.1964-06-15.court]].'
        tags: [state:va]
  - add:
      entry:
        id: cal.1964-11-03.state-constitutions-ar
        when: Nov. 3
        date: '1964-11-03'
        thread: state-constitutions
        also: [voting-rights]
        c: 'Arkansas''s voters adopt Amendment 51: the poll tax, its rolls the State''s only registration of voters, gives way as the condition of voting to a system of registration (Check: the vote). Faubus re-elected over Rockefeller the same day.'
        n: '[Ark. *Historical Report of the Secretary of State* (2018), p. 346](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=355). Check: the vote, Ark. Secretary of State. [[w.johnson-arkansas-in-modern-america]]. See [[cal.1964-01-23.voting-rights]]; [[cal.1964-11-03.elections-1964-2]]. Names: Faubus (K–J Cong. III.F); Rockefeller (Opp. III.H).'
        tags: [state:ar, name:faubus-orval-e, name:rockefeller-winthrop]
  # ---------------------------------------------------------------- 1965
  - add:
      entry:
        id: cal.1965-01-28.legislatures-ar
        when: Jan. 28–Feb. 3
        date: '1965-01-28'
        thread: legislatures
        also: [court]
        c: 'Arkansas. *Yancey v. Faubus*: the three-judge court holds the apportionment of both houses invalid under *Reynolds v. Sims* and directs the Board of Apportionment, Faubus, the secretary of state and the attorney general, to make a valid one by June 15; the General Assembly, in session, may act itself. Feb. 3, *Park v. Faubus*: the congressional districts of 1961 void, further elections under them enjoined.'
        n: '*Yancey v. Faubus*, [238 F. Supp. 290](https://static.case.law/f-supp/238/html/0290-01.html) (E.D. Ark. 1965); *Park v. Faubus*, [238 F. Supp. 62](https://static.case.law/f-supp/238/html/0062-01.html) (E.D. Ark. 1965). [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1964-06-15.court]]. Names: Faubus (K–J Cong. III.F).'
        tags: [state:ar, name:faubus-orval-e]
  - add:
      entry:
        id: cal.1965-04-09.legislatures-va
        when: Apr. 9
        date: '1965-04-09'
        thread: legislatures
        c: '*Mann v. Davis*: Virginia''s reapportionment of 1964 upheld against Henrico County, which asked delegates of its own apart from Richmond, and against Richmond''s petitioners; Shenandoah County, under-represented, to be relieved before the July primaries.'
        n: '*Mann v. Davis*, [245 F. Supp. 241](https://static.case.law/f-supp/245/html/0241-01.html) (E.D. Va. 1965). [[w.moeser-politics-of-annexation]]. See [[cal.1964-09-18.legislatures-va]].'
        tags: [state:va, city:richmond]
  - add:
      entry:
        id: cal.1965-11-17.antisubversion-nc
        when: Nov. 17
        date: '1965-11-17'
        thread: antisubversion
        also: [students]
        c: 'North Carolina. The General Assembly, in extra session, amends the Speaker Ban Law: the trustees of each State-supported college and university to adopt and publish the rules for visiting speakers of the three kinds the law names. A commission to study the law had been created June 16.'
        n: '[N.C. Sess. Laws, Extra Sess. 1965, ch. 1](https://archive.org/details/sessionlaws19656667nort) (H.B. 1, ratified Nov. 17, 1965); the commission, [N.C. Sess. Laws 1965, Res. 85](https://archive.org/details/sessionlaws196365nort) (ratified June 16, 1965). See [[cal.1963-06-26.antisubversion-nc]].'
        tags: [state:nc]
  - add:
      entry:
        id: cal.1965-11-22.civil-rights-organizations-charlotte
        when: Nov. 22
        date: '1965-11-22'
        thread: civil-rights-organizations
        also: [desegregation-schools]
        c: 'Charlotte. Bombs at the homes of four Negro leaders: Julius Chambers, counsel in the suit against the city''s and county''s schools, its first hearings under way; Kelly Alexander, State president of the NAACP; his brother Fred Alexander, a city councilman; Reginald Hawkins. No one hurt.'
        n: '[[w.douglas-reading-writing-and-race]]. Names: Chambers, Kelly Alexander, Fred Alexander, Hawkins (K–J Cong. III.K).'
        tags: [state:nc, city:charlotte, name:chambers-julius-l, name:alexander-kelly-m-sr, name:alexander-fred-d, name:hawkins-reginald-a]
  - add:
      entry:
        id: cal.1965-11-30.legislatures-nc
        when: Nov. 30
        date: '1965-11-30'
        thread: legislatures
        also: [court]
        c: '*Drum v. Seawell*: the three-judge court holds void North Carolina''s apportionment of both houses, the constitution''s Representative for every county with it, and its congressional districts. Elections enjoined, the order stayed for the State to act before the primary of May 28, 1966.'
        n: '*Drum v. Seawell*, [249 F. Supp. 877](https://static.case.law/f-supp/249/html/0877-01.html) (M.D.N.C. 1965). See [[cal.1964-06-15.court]].'
        tags: [state:nc]
  # ---------------------------------------------------------------- 1966
  - add:
      entry:
        id: cal.1966-01.desegregation-public-places-ky
        when: Jan.
        date: '1966-01'
        thread: desegregation-public-places
        also: [jobs-and-wages, open-housing]
        c: 'Kentucky Civil Rights Act, passed by the General Assembly and signed by Breathitt: discrimination by race forbidden in public accommodations and in employment by firms of eight or more; cities empowered to forbid it in housing; the dead segregation laws, the Day Law among them, repealed. The first such act of a Southern State.'
        n: '1966 Ky. Acts ch. 2 (KRS ch. 344; [the history note](https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=32602)). Check: the day signed. [[w.harrison-new-history-of-kentucky]]; [[w.kmeyer-civil-rights-in-the]]. See [[cal.1964-03-05.desegregation-public-places-ky]]. Names: Breathitt (K–J Cong. III.K).'
        tags: [state:ky, name:breathitt-edward-t]
  - add:
      entry:
        id: cal.1966-01-13.legislatures-nc
        when: Jan. 13–Feb. 18
        date: '1966-01-13'
        thread: legislatures
        c: 'North Carolina''s General Assembly, in extra session, reapportions: the Senate, Jan. 13; the House, in 49 districts, and the congressional districts, Jan. 14. Feb. 18, the three-judge court approves the Senate and House, their population variance ratios 1.32 and 1.33 to 1; the congressional districts short of "as nearly ... equal population as is practicable," but the 1966 elections allowed under them.'
        n: '[N.C. Sess. Laws, Extra Sess. 1966, chs. 1, 5–7](https://archive.org/details/sessionlaws19656667nort); *Drum v. Seawell*, [250 F. Supp. 922](https://static.case.law/f-supp/250/html/0922-01.html) (M.D.N.C. 1966). See [[cal.1965-11-30.legislatures-nc]].'
        tags: [state:nc]
  - add:
      entry:
        id: cal.1966-01-15.state-and-city-finance-va
        when: Jan. 15–Mar.
        date: '1966-01-15'
        thread: state-and-city-finance
        c: 'Virginia. Godwin inaugurated governor, Jan. 15. The General Assembly enacts the Virginia Retail Sales and Use Tax Act, the State''s first general sales tax, with his support (Check: the rates, the localities'' share, the date approved).'
        n: '1966 Va. Acts c. 151 (the history note, Va. Code § 58.1-603). Check: *Acts of the General Assembly*, 1966. [[w.atkinson-dynamic-dominion]]; [[w.wilkinson-harry-byrd-and-the]]. See [[cal.1965-11-02.states-and-cities-2]]. Names: Godwin (K–J Cong. III.K).'
        tags: [state:va, name:godwin-mills-e-jr]
  - add:
      entry:
        id: cal.1966-08-04.governors-tn
        when: Aug. 4
        date: '1966-08-04'
        thread: governors
        also: [elections-1966]
        c: 'Tennessee, Democratic primary for governor: Ellington, governor 1959–63, 413,950, 53.5 percent; John Jay Hooker, a Nashville lawyer, 360,105. No Republican nominee.'
        n: 'Votes: Wikipedia, ["1966 Tennessee gubernatorial election"](https://en.wikipedia.org/wiki/1966_Tennessee_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: Tenn. *Blue Book*. [[w.greene-lead-me-on]]. Clement and Bass the same day: [[cal.1966-08-04.elections-1966]]. Names: Hooker (K–J Cong. III.K).'
        tags: [state:tn, name:ellington-buford, name:hooker-john-jay]
  - add:
      entry:
        id: cal.1966-11-08.governors-ar
        when: Nov. 8
        date: '1966-11-08'
        thread: governors
        also: [elections-1966]
        c: 'Arkansas: Winthrop Rockefeller (R) elected governor over Jim Johnson (D), 306,324 to 257,203, 54.4 percent, the State''s first Republican governor since Reconstruction. Faubus not running.'
        n: 'Votes: [Ark. *Historical Report of the Secretary of State* (2018), p. 413](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=422). [[w.ward-arkansas-rockefeller]]; [[w.urwin-agenda-for-reform]]; [[w.reed-faubus]]. See [[cal.1966-07-26.elections-1966]]. Names: Rockefeller (Opp. III.H); Johnson (K–J Cong. III.K); Faubus (K–J Cong. III.F).'
        tags: [state:ar, name:rockefeller-winthrop, name:johnson-james-d, name:faubus-orval-e]
  - add:
      entry:
        id: cal.1966-11-08.state-constitutions-ky
        when: Nov. 8
        date: '1966-11-08'
        thread: state-constitutions
        c: 'Kentucky''s voters reject the new constitution drafted by the Constitution Revision Assembly and submitted by the General Assembly (S.B. 161), 517,034 to 143,133; Breathitt had backed it. The constitution of 1891 stands.'
        n: 'Votes: [Ky. *Official Tabulation of Votes Cast*, Nov. 8, 1966, sheet 12](https://elect.ky.gov/results/1973-1979/Documents/1966.pdf#page=12). [[w.harrison-new-history-of-kentucky]]. See [[cal.1960-11-08.state-constitutions-ky]]. Names: Breathitt (K–J Cong. III.K).'
        tags: [state:ky, name:breathitt-edward-t]
  - add:
      entry:
        id: cal.1966-11-08.states-and-cities-memphis
        when: Nov. 8
        date: '1966-11-08'
        thread: states-and-cities
        also: [mayors]
        c: 'Memphis''s voters approve a new charter: a mayor and a council of 13, six elected at large and seven by district, in place of the city commission, from 1968 (Check: the date and the vote).'
        n: 'Check: the Shelby County Election Commission''s returns; the *Commercial Appeal*, Nov. 9, 1966.'
        tags: [state:tn, city:memphis]
