      c: After the Bay of Pigs, Goldwater privately urges Kennedy to have the United States invade Cuba "to rid the hemisphere of the threat of extended Communism." Kennedy rejects the counsel.
      n: '[[w.goldberg-barry-goldwater]], 156. To check: [*New York Times*, Aug. 2, 1971](https://timesmachine.nytimes.com/timesmachine/1971/08/02/issue.html), 1 (cited by [[w.goldberg-barry-goldwater]], 156 n.37). Check: the day; Goldberg: "in the wake of the Bay of Pigs fiasco"; perhaps the visit of [[cal.1961-04.cuba-bay-of-pigs-4]]. Names: Goldwater, Kennedy.'
