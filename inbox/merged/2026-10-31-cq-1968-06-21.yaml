    entry:
      id: cal.1968-06-20.elections-1968-3
      when: June 20
      date: '1968-06-20'
      thread: elections-1968
      c: 'Washington, the National Press Club. Humphrey''s "agenda" of civil order and social justice: State laws on incitement strengthened, federal money for the police, registration of all firearms; enough to eat, a job, an education for all. No break with the administration on Vietnam: "One does not repudiate his family in order to establish his own identity."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1542. Asked, he has not talked of the second place with Edward Kennedy or anyone (1542). Names: Humphrey, Kennedy.'
      tags:
      - name:humphrey-hubert-h
      - name:kennedy-edward-m
