      id: cal.1968-06.elections-1968-6
      when: June
      date: 1968-06
      thread: elections-1968
      c: 'McCarthy''s organization at mid-June, by CQ''s list. Washington headquarters: Blair Clark national campaign manager; Gans in the day-to-day decisions; Stephen Mitchell, the convention; Sam Brown, the students; Philip Murphy, press. Arnold Hiatt finance director. In New York, the Coalition for a Democratic Alternative, Harold Ickes and Sarah Kovner directors, and Finletter''s Citizens for McCarthy.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1537–38. CQ''s list besides: Grace Bassett; Tom Mechling, Donald Green and Thomas Finney, the delegates; Peter Barnes, Norval Reece, Jed Schilling, Arthur Michaelson; Jerry Eller, Emerson Hynes and Louise FitzSimons of his Senate staff; Lowell, traveling with him; Jonathan Schell, Jeremy Larner and Michael Arlen, speeches; Goodwin expected back; Charles Callanan; Howard Stein, Coretta King, Alvin Friedman and Martin Peretz, fund-raising; the CDA''s cochairmen Eleanor Clark French, Clarence Jones and Richard Lipsitz; John Shea; Republicans for McCarthy; a Science Advisory Board, Kistiakowsky and Paul Dudley White among its members; an economic group of twelve, Galbraith, Robert Gordon and Robert Triffin among them; supporters Rauh, David Riesman, Henry Steele Commager, Don Edwards, Paul Newman, Julian Bond, Reinhold Niebuhr. Names: McCarthy, Gans, Mitchell, Brown, Finletter.'
      tags:
      - name:mccarthy-eugene-j
      - name:gans-curtis
      - name:mitchell-stephen-a
