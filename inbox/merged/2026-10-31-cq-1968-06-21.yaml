      c: 'The Rockefeller for President Committee organized: J. Irwin Miller, of the Cummins Engine Company, chairman; Morton and Bertha Adkins cochairmen. On its organizing committee four other former Republican national chairmen, Alcorn, Hugh Scott, Leonard Hall and William Miller; Chafee, Brooke, Dellenback, Findley and Goodell among its members.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1534. Check: the day. See [[cal.1968-04-07.elections-1968]]. Names: J. Irwin Miller, Morton, Adkins, Alcorn, Scott, Hall, William Miller, Chafee, Brooke, Dellenback, Findley, Goodell.'
