      id: cal.1968-06.robert-kennedy
      when: June
      date: 1968-06
      thread: robert-kennedy-campaign
      c: Robert Kennedy's campaign, by CQ's list after his death. Stephen Smith campaign manager; Mankiewicz press secretary, with Hugh McDonald, Richard Drayne and Salinger; Dolan scheduling; Peter Edelman and Milton Gwirtzman research; Walinsky, Greenfield and Michael Schwartz speeches. Sorensen, O'Brien, O'Donnell, Dutton, Schlesinger, Burke Marshall and vanden Heuvel on strategy; Edward Kennedy a close adviser, his staff lent.
      n: '[[w.cq-weekly-report]], June 21, 1968, 1539–40. CQ''s list besides: Jacqueline Kennedy campaigned; Goodwin, from McCarthy''s campaign; Lewis Kaden, Dun Gifford, James Flug and David Burke, research and speeches; Tom Johnston from the New York office; Gerald Bruno, advance; Oberdorfer and Walter Sohier, the volunteer groups; John Siegenthaler, the South; Unruh, the West; Edith Green, Oregon''s primary; William Haddad; Yarmolinsky, the universities. Names: Robert Kennedy, Smith, Mankiewicz, Salinger, Dolan, Walinsky, Greenfield, Sorensen, O''Brien, O''Donnell, Dutton, Schlesinger, Marshall, vanden Heuvel, Edward Kennedy.'
