      when: June 18
      date: '1968-06-18'
      thread: elections-1968-chicago
      also:
      - democratic-party
      c: 'Bailey''s officers for the Democratic convention, accepted by its arrangements committee in Washington: Albert permanent chairman; Inouye temporary chairman and keynoter; Richard Hughes, credentials; Boggs, resolutions; Samuel Shapiro, rules; Faye Broderick, permanent organization; McCormack honorary chairman.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1548–49. Bailey conferred with Connell for Humphrey and Stephen Mitchell for McCarthy; O''Donnell, for Robert Kennedy''s people, asks about a memorial program; the committee to meet again late in July, McCarthy''s request to address the convention before it (1549). Names: Albert, Inouye, Hughes, Boggs, Shapiro, McCormack.'
      tags:
      - name:albert-carl
      - name:inouye-daniel-k
