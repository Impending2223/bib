- add:
    entry:
      id: cal.1968-06.elections-1968-2
      when: June
      date: 1968-06
      thread: elections-1968
      c: 'Nixon''s organization at mid-June, by CQ''s list. The Nixon for President Committee, New York and Washington: Mitchell, a law partner, national campaign manager; Ellsworth political director; Kleindienst field director. Haldeman chief of staff; Klein communications; Stans fund-raising chairman; United Citizens for Nixon, Charles Rhyne national chairman.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1533–34. CQ''s list besides (1533–34): Rose Mary Woods, his secretary; Buchanan, briefing books; Whitaker and Chapin, scheduling; Agnes Waldron, research; McWhorter, strategist; Price, Martin Anderson, Glenn Olds and Whalen, advisers on issues; Donald L. Jackson, congressional liaison; the law partners Sears (the delegate search), Garment (recruiting aides) and Thomas W. Evans (United Citizens); field men Don Whitehead, Holton, MacGregor, Wayne Hood, Gerhard Bleicken, Brad Hays, Mardian and Ralph Clark; Babcock and Hickel, cochairmen in the West; with Stans, Courtney Burton, John Clifford Folger, Daniel Gainey and Spencer Olin, and Textor, treasurer; Lamar Alexander, planning; Lodge''s Ambassadors for Nixon, Annis''s Doctors for Nixon, the Nixon Network (Donald Whyte); advertising, Fuller & Smith & Ross, and Feeley & Wheeler in the primaries; friends and advisers Hillings, Harlow, Rinfret, Burns, Saulnier, Robert C. Hill, Seaton, Finch. Names: Nixon, Mitchell, Ellsworth, Kleindienst, Haldeman, Klein, Stans.'
