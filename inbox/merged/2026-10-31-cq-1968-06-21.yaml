      id: cal.1968-06.elections-1968-7
      when: June
      date: 1968-06
      thread: elections-1968
      c: 'Wallace''s organization at mid-June, by CQ''s list. Headquarters at Montgomery; a temporary office in each State while his American Independent Party qualifies for its ballot, closed after. Bill Jones and Ed Ewing national coordinators, Ewing the ballot drive; Cecil Jackson and Seymore Trammell national directors; John DeCarlo, Joe Fine, Stanley Sikes and Tom Turnipseed State coordinators. Fund-raising: Dick Smith, Earl Goodwin, J. C. Bull, C. W. Russell.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1538–39. CQ''s list besides: Otto Bailey and Thomas Gallion, MacDonald Gallion''s son; Richard Stone, office manager; aides called on as needed, some leaving State posts after Lurleen Wallace''s death: Eli Howell, Robert Cleckler, Arlis Fant, Allen Brislin, Doug Benton, John Pemberton, Earl Mornam; supporters Perez, Marvin Griffin (mentioned for the second place), T. Coleman Andrews, Kent Courtney, Jim Clark. Names: George Wallace.'
      tags:
