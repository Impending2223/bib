      when: June 17
      date: '1968-06-17'
      thread: vietnam-paris
      also:
      - elections-1968
      c: 'Paris. North Vietnamese diplomatic quarters, by report: interested in McCarthy''s hope to talk with the participants in the negotiations.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1543. See [[cal.1968-04-15.elections-1968]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
