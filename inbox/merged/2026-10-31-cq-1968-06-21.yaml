- add:
    entry:
      id: cal.1968-06-18.elections-1968-ny
      when: June 18
      date: '1968-06-18'
      thread: elections-1968
      c: 'New York''s primary: the district delegates to the conventions, no candidate''s name on the ballot. Democratic, 123, three a district: McCarthy at least 52, the Kennedy delegates 26, Humphrey 6; Sorensen beaten in the 17th by a McCarthy delegate. Republican, 82: Rockefeller 77, Nixon 5; Rockefeller''s slate unopposed in 71.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1544–45. Under 21 percent of the State''s 3,533,000 registered Democrats voting, on the Senate primary''s returns (1545). Check: the State''s returns. Names: McCarthy, Kennedy, Humphrey, Sorensen, Rockefeller, Nixon.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
