    entry:
      id: cal.1968-06-18.elections-1968
      when: June 18
      date: '1968-06-18'
      thread: elections-1968
      c: 'Charleston, S.C., the Southern Governors'' Conference in session. Wallace, a news conference: "sorry" Winthrop Rockefeller thinks him a demagogue; "The Rockefellers are high-priced people."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1544. The governors at the conference, by CQ: Wallace a good chance in Alabama, Mississippi, Georgia, Louisiana and South Carolina; several, in North Carolina, Florida, Arkansas, Tennessee and Virginia too (1544). See [[cal.1968-06-17.elections-1968-4]]. Names: Wallace, Winthrop Rockefeller.'
      tags:
      - name:wallace-george-c
      - name:rockefeller-winthrop
      - state:sc
- add:
    entry:
      id: cal.1968-06-18.elections-1968-2
      when: June 18
      date: '1968-06-18'
      thread: elections-1968
      also:
      - republican-party-congress
      c: 'Rockefeller with the Republican members of Congress, a series of meetings. To some 100 House Republicans: their chance of a majority best with him at the head of the ticket; "an open Convention."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1541. Republicans 31 seats short of a House majority (1541). Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-06-18.elections-1968-3
      when: June 18
      date: '1968-06-18'
      thread: elections-1968
      c: 'Sherman, Humphrey''s press secretary, a statement: the Vice President "does not follow the practice of thinking one thing in private and saying another thing in public."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1542. See [[cal.1968-06-16.elections-1968-2]]. Names: Sherman, Humphrey.'
      tags:
      - name:sherman-norman
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-06-18.elections-1968-4
      when: June 18
      date: '1968-06-18'
      thread: elections-1968
      c: 'Rowan, in the Washington *Evening Star*: Humphrey will not disavow the administration''s Vietnam policy. Quotes him: "I have supported this policy enthusiastically"; "100 doubts and more" on some of the war, but no public differences while the talks go on.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1542. Names: Rowan, Humphrey.'
      tags:
      - name:rowan-carl-t
      - name:humphrey-hubert-h
