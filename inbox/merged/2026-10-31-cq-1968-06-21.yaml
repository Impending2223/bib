    entry:
      id: cal.1968-06-20.elections-1968-4
      when: June 20
      date: '1968-06-20'
      thread: elections-1968
      c: 'Chicago, McCarthy''s strategists: Blair Clark, Martin Gleason for the delegates and the convention, Gans, and many of the State chairmen.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1543. Names: Gans, McCarthy.'
      tags:
      - name:gans-curtis
      - name:mccarthy-eugene-j
