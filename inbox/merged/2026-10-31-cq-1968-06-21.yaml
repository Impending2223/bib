      when: June 17
      date: '1968-06-17'
      thread: elections-1968
      c: 'Maine''s House primaries. 1st District, Democratic: Kyros over Plato Truman and David Graham, 14,928 to 3,120, 75.0 percent, Graham 1,857, 9.3 percent. Republican: Horace Hildreth Jr. over David Ault, 23,594 to 6,448, 66.1 percent, Garry Merrill 5,674, 15.9 percent. 2nd District: Hathaway and Elden Shute unopposed.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1547 (incomplete, unofficial returns). Check: the State''s returns. Names: Kyros, Hathaway.'
      tags:
      - name:kyros-peter-n
      - name:hathaway-william-d
      - state:me
