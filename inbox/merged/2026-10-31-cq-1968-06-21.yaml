      id: cal.1968-06-18.elections-1968-5
      when: June 18
      date: '1968-06-18'
      thread: elections-1968
      c: 'Mondale and Fred Harris, a news conference: Rowan''s column "reflects what (we) think" Humphrey''s views on Vietnam to be.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1542. See [[cal.1968-06-18.elections-1968-4]]. Names: Mondale, Harris, Rowan, Humphrey.'
      tags:
      - name:mondale-walter-f
      - name:harris-fred-r
      - name:rowan-carl-t
      - name:humphrey-hubert-h
