- add:
    entry:
      id: cal.1968-06-11.elections-1968-3
      when: June 11–17
      date: '1968-06-11'
      thread: elections-1968
      c: 'Wallace''s tour of the South for $10 million for his campaign, rallies and $25-a-plate dinners: Memphis, June 11; Chattanooga, 12; Atlanta, 13; Nashville, 14; Charlotte, 15; Richmond, 17. Against the school guidelines, both parties, the national newspapers, the Supreme Court; no racist, he says. At Atlanta, the federal suit charging eight Alabama agencies with discrimination in employment "purely political."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1544. Most of his money from gifts under five dollars, he says (1544). Names: Wallace.'
      tags:
      - name:wallace-george-c
- add:
    entry:
      id: cal.1968-06-11.elections-1968-4
      when: June 11
      date: '1968-06-11'
      thread: elections-1968
      c: 'Agnew: willing to give up his favorite-son status to head a delegation pledged to Nixon, Rockefeller or Reagan.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1547–48. Names: Agnew, Nixon, Rockefeller, Reagan.'
      tags:
      - name:agnew-spiro-t
      - name:nixon-richard-m
      - name:rockefeller-nelson
      - name:reagan-ronald
      - state:md
- add:
    entry:
      id: cal.1968-06-12.elections-1968
      when: June 12
      date: '1968-06-12'
      thread: elections-1968
      c: 'Nixon, through a spokesman: no debate with Rockefeller; it "would only serve the Democrats by promoting divisive tendencies among Republicans."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1540. Names: Nixon, Rockefeller.'
      tags:
      - name:nixon-richard-m
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-06-12.elections-1968-2
      when: June 12
      date: '1968-06-12'
      thread: elections-1968
      c: 'Los Angeles, the Town Hall. Rockefeller resumes his campaign: the policy of protecting Europe to "give way to a true Atlantic partnership"; a summit of heads of state on East-West relations, trade and the other common matters. America cannot enter the 1970s with the policies of the 1940s and 1950s.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1541. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-06-12.elections-1968-3
      when: June 12
      date: '1968-06-12'
      thread: elections-1968
      c: 'Los Angeles. Rockefeller at a high school in Watts, unscheduled: the nation can "no longer tolerate" the racism, poverty and hunger there. That evening, with Reagan''s chief backers.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1541. Rockefeller: "there were some real friendships made" (1541). Names: Rockefeller, Reagan.'
      tags:
      - name:rockefeller-nelson
      - name:reagan-ronald
- add:
    entry:
      id: cal.1968-06-12.elections-1968-4
      when: June 12
      date: '1968-06-12'
      thread: elections-1968
      c: 'Washington, 1145 Connecticut Avenue. Stassen opens his campaign''s headquarters: as President, "a truly national administration," Democrats with Republicans; asks the networks to let every candidate for the nomination debate. Some delegates pledged to him, most uncommitted.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1542. Names: Stassen.'
      tags:
      - name:stassen-harold-e
- add:
    entry:
      id: cal.1968-06-13.elections-1968
      when: June 13
      date: '1968-06-13'
      thread: elections-1968
      c: 'San Francisco, the Commonwealth Club. Rockefeller: Robert Kennedy''s death no reason to be "stifled by guilt"; "a divided people," not "a doomed people." In the questions he quotes Callaway, Nixon''s Southern manager, June 1: "perhaps we can get George Wallace on our side"; Nixon "has got to denounce that statement."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1541. Check: Callaway''s words as Rockefeller quotes them; Callaway''s own account of them, June 24. Names: Rockefeller, Kennedy, Callaway, Wallace, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:kennedy-robert-f
      - name:callaway-howard-h
      - name:wallace-george-c
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-06-13.elections-1968-2
      when: June 13
      date: '1968-06-13'
      thread: elections-1968
      c: 'San Francisco, a news conference. Rockefeller challenges Nixon to debate: "three or four debates in different parts of the country." Of Nixon''s refusal: "Maybe he''s got a conditioned reaction to debates."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1541. See [[cal.1968-06-12.elections-1968]]. Names: Rockefeller, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-06-13.elections-1968-3
      when: June 13
      date: '1968-06-13'
      thread: press-and-broadcasting
      also:
      - elections-1968
      c: 'ABC: it has asked Nixon and Rockefeller to appear on *Issues and Answers*; Rockefeller accepts, Nixon has not answered, a second invitation sent.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1540. Names: Nixon, Rockefeller.'
      tags:
      - name:nixon-richard-m
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-06-13.elections-1968-4
      when: June 13
      date: '1968-06-13'
      thread: elections-1968
      c: 'Rockefeller''s aides on his advertising: full pages weekly in 41 newspapers in 33 cities from about June 1; three one-minute television spots a week in 35 markets; $3 million to $5 million in all, to the convention.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1541–42. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-06-13.crime-and-hijacking-guns
      when: June 13
      date: '1968-06-13'
      thread: crime-and-hijacking-guns
      also:
      - elections-1968
      c: 'Rockefeller: Congress to pass the President''s gun program; federal standards for State and local licensing of all firearms'' owners and registration of handguns; arms and ammunition barred from States without licensing after two years.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1541. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-06-13.elections-1968-5
      when: June 13
      date: '1968-06-13'
      thread: elections-1968
      c: 'McCarthy, to editors and reporters of the *New York Times*: "the country is ready to accept even withdrawal" from Vietnam, a unilateral one too.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1543. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-06-13.elections-1968-6
      when: June 13
      date: '1968-06-13'
      thread: elections-1968
      c: 'New York, the Fellowship of Reconciliation. McCarthy''s first speech since Robert Kennedy''s death: a "fatal mistake" to make punishment and law and order the answer to violence; its "real causes" to be met.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1543. Names: McCarthy, Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-06-13.elections-1968-7
      when: June 13
      date: '1968-06-13'
      thread: elections-1968
      c: 'Minnesota''s Republican State convention. Stassen: both Vietnams into the United Nations, a settlement enforced by its police; a "crackdown, swift, hard and just" on lawlessness, with steps of social justice; a two-year moratorium on violence on television and in films.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1542. Names: Stassen.'
      tags:
      - name:stassen-harold-e
      - state:mn
- add:
    entry:
      id: cal.1968-06-13.governors-nd
      when: June 13–15
      date: '1968-06-13'
      thread: governors
      also:
      - republican-party
      c: 'Fargo. North Dakota''s Republican convention endorses Edward Doherty, a newspaper publisher of New Rockford, N.D., for governor over four others, Richard Elkin, the State''s Nixon chairman, among them; McCarney, not seeking it, to run in the Sept. 3 primary. Young, Andrews and Kleppe endorsed. Its platform statement: the Great Society a "Grim Society of riots and assassinations."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1548. Clayburgh national committeeman, succeeding Rolland Meidinger; Katherine Burgum committeewoman, succeeding Marian Bertsch (1548). Andrews: interest rates the highest since the Civil War, wheat the lowest since 1942 (1548). Names: Doherty, McCarney, Young, Andrews, Kleppe.'
      tags:
      - name:doherty-edward-w
      - name:mccarney-robert-p
      - name:young-milton-r
      - name:andrews-mark
      - name:kleppe-thomas-s
      - state:nd
- add:
    entry:
      id: cal.1968-06-14.elections-1968-2
      when: June 14
      date: '1968-06-14'
      thread: elections-1968
      c: 'Idaho Falls, Idaho, the Democratic State convention. McCarthy: reject the administration''s Vietnam policy even at the risk of the election; Humphrey for not keeping issues "ahead of the party," as he urged in 1948.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1543. Names: McCarthy, Humphrey.'
      tags:
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - state:id
- add:
    entry:
      id: cal.1968-06-14.republican-party
      when: June 14–15
      date: '1968-06-14'
      thread: republican-party
      also:
      - elections-1968-miami
      c: 'Tulsa. Twenty of the 26 Republican governors on the platform and the campaign. June 14, a resolution: the Governors'' Policy Committee''s handbook of "suggested solutions," from Shafer''s nine regional hearings, to go to the executive committee of the convention''s resolutions committee, June 19. In it a negative income tax; federal jobs for all able to work; a Fair Housing Commission; "standards of racial balance" in schools.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1547. Absent: Laxalt, Samuelson, LeVander, McCall, Chafee, Knowles (1548). Names: Shafer.'
      tags:
      - name:shafer-raymond-p
      - name:laxalt-paul
      - name:samuelson-don
      - name:levander-harold
      - name:mccall-tom
      - name:chafee-john-h
      - name:knowles-warren-p
- add:
    entry:
      id: cal.1968-06-15.elections-1968-2
      when: June 15
      date: '1968-06-15'
      thread: elections-1968
      also:
      - king-poor-peoples
      c: 'Humphrey''s statement on the Poor People''s Campaign''s demands, the first of a major candidate''s: not every jobless man for the government to hire, but "the maximum number of jobs"; income maintenance for the 91st Congress; "every American must be provided enough to eat"; repeal of the 1967 welfare amendments.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1542–43. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-06-15.elections-1968-3
      when: June 15
      date: '1968-06-15'
      thread: elections-1968
      c: 'Phoenix. McCarthy: the Democratic convention to hear him and Humphrey before it chooses.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1543, 1549 (Bailey: the arrangements committee to take it up). Names: McCarthy, Humphrey.'
      tags:
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-04-15.elections-1968
      when: Apr. 15
      date: '1968-04-15'
      thread: elections-1968
      also:
      - vietnam-paris
      c: Phoenix. McCarthy hopes to go to Paris in July to talk with the American negotiators and "other participants."
      n: '[[w.cq-weekly-report]], June 21, 1968, 1543. Check: the day; CQ prints Apr. 15, and has him at Phoenix June 15. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-06-15.elections-1968-4
      when: June 15
      date: '1968-06-15'
      thread: elections-1968
      c: 'The national board of Americans for Democratic Action reaffirms its endorsement of McCarthy: "no man who carries the albatross of the Vietnam war" can represent the party. Galbraith, its chairman: it would probably support Humphrey if he were nominated.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1543. Names: McCarthy, Galbraith, Humphrey.'
      tags:
      - name:mccarthy-eugene-j
      - name:galbraith-john-kenneth
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-06-15.elections-1968-5
      when: June 15–16
      date: '1968-06-15'
      thread: elections-1968
      c: 'Chicago, Nixon''s strategists, two days. Mitchell, June 16, by the AP: no "exchange of charge and counter-charge" with Rockefeller; "The polls don''t elect Presidents, the people do." Nixon to drop most of his campaigning for the rest of June; United Citizens for Nixon for the independents'' and Democrats'' votes.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1540. A Nixon aide, in the *New York Times* of June 15: "We''ve gotten where we are without using the politics of confrontation" (1540). Names: Nixon, Mitchell, Rockefeller.'
      tags:
      - name:nixon-richard-m
      - name:mitchell-john-n
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-06-16.elections-1968
      when: June 16
      date: '1968-06-16'
      thread: elections-1968
      also:
      - vietnam
      c: '*U.S. News and World Report*, an interview with Rockefeller released: escalation cannot win, Peking and Moscow able to meet it; negotiate, defend the population centers, more of the war to the South Vietnamese, then withdraw in order. The Viet Cong no "democratic element."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1541. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-06-16.elections-1968-2
      when: June 16
      date: '1968-06-16'
      thread: elections-1968
      c: 'Moyers, on a "hunch": Humphrey will "emerge on his own" within a week or so, his differences with the administration on Vietnam stated; he has "always questioned" American military power in a war like Vietnam''s.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1542. Names: Moyers, Humphrey.'
      tags:
      - name:moyers-bill
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-06-16.elections-1968-3
      when: June 16
      date: '1968-06-16'
      thread: elections-1968
      also:
      - crime-and-hijacking-guns
      c: 'McCarthy: no gun law "under panic conditions"; for registration of "sidearms" and heavy arms. He will not lead a third party; might support one if the two parties offered no choice.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1544. Check: one occasion or two. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-06-16.elections-1968-4
      when: June 16
      date: '1968-06-16'
      thread: elections-1968
      also:
      - press-and-broadcasting
      c: '*Meet the Press*, Republican governors from Tulsa. Romney: no endorsement before late July, perhaps not before the convention; favorite sons moving now could settle it for Nixon. Bartlett will free his delegates before the first ballot: 17 of Oklahoma''s for Nixon, five for Reagan, he estimates. Agnew: Rockefeller "waited too long"; Nixon "a very likely winner."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1547–48. All four (Shafer the fourth): Nixon far ahead, Rockefeller still a chance (1548). Names: Romney, Bartlett, Agnew, Nixon, Reagan, Rockefeller.'
      tags:
      - name:romney-george-w
      - name:bartlett-dewey-f
      - name:agnew-spiro-t
      - name:nixon-richard-m
      - name:reagan-ronald
      - name:rockefeller-nelson
      - name:shafer-raymond-p
- add:
    entry:
      id: cal.1968-06-17.elections-1968
      when: June 17
      date: '1968-06-17'
      thread: elections-1968
      also:
      - crime-and-hijacking-guns
      c: 'Nixon, from his New York headquarters: control the interstate mail-order shipment of shotguns and rifles, to keep them from minors, criminals and the mentally ill and to stop the circumvention of State and local laws. Johnson "dragging his feet" on signing the crime bill.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1540. Names: Nixon, Johnson.'
      tags:
      - name:nixon-richard-m
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-06-17.elections-1968-2
      when: June 17
      date: '1968-06-17'
      thread: elections-1968
      also:
      - states-and-cities
      c: 'Rockefeller on federal aid: grants for specific programs to give way to per-capita payments to States and cities by population and tax effort, unrestricted; broad grants for education, health and law enforcement; special grants only where experiment is wanted.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1541. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-06-17.elections-1968-3
      when: June 17
      date: '1968-06-17'
      thread: elections-1968
      c: Landon, the 1936 nominee, endorses Rockefeller; Humphrey to be the Democrats' choice; Nixon "has failed to clarify his views on Vietnam."
      n: '[[w.cq-weekly-report]], June 21, 1968, 1542. Names: Rockefeller, Humphrey, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:humphrey-hubert-h
      - name:nixon-richard-m
