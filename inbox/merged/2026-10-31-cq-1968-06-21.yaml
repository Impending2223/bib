      - name:nixon-richard-m
      - state:ny
- add:
    entry:
      id: cal.1968-06-18.elections-1968-ny-2
      when: June 18
      date: '1968-06-18'
      thread: elections-1968
      c: 'New York''s Senate primaries. Democratic: O''Dwyer, for McCarthy, over Nickerson, the Nassau County Executive, 266,500 to 250,405, 36.3 percent; Resnick 217,141, 29.6 percent. Liberal: Javits over Murray Baron, 8,424 to 3,452, 70.9 percent. Javits unopposed for the Republican nomination.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1545 (unofficial, 13,408 election districts). O''Dwyer: "I fought for the overriding issue of this campaign—peace"; Humphrey, if nominated, would lose New York (1545). Mankiewicz and Salinger, among Robert Kennedy''s aides, for Nickerson (1545). Check: the State''s returns. Names: O''Dwyer, McCarthy, Resnick, Javits.'
      tags:
      - name:odwyer-paul
      - name:mccarthy-eugene-j
      - name:resnick-joseph-y
      - name:javits-jacob-k
      - name:mankiewicz-frank
      - name:salinger-pierre
      - state:ny
- add:
    entry:
      id: cal.1968-06-18.elections-1968-ny-3
      when: June 18
      date: '1968-06-18'
      thread: elections-1968
      c: 'New York''s House primaries. 10th District, two members put in one district: Celler over Edna Kelly, 20,303 to 11,785, 56.2 percent; Robert Heller 4,019, 11.1 percent. 5th: Lowenstein over Albert Vorspan, the organization''s, 14,141 to 10,472, 57.5 percent. 12th, new for Bedford-Stuyvesant: Chisholm over William Thompson, 5,431 to 4,634, 46.0 percent; Dollie Robinson 1,751, 14.8 percent. 17th: Koch over Paul Rao, 15,040 to 6,638, 59.1 percent; John McKean 3,771, 14.8 percent. 18th: Powell over John Young, 6,665 to 4,367, 60.4 percent.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1545–46 (incomplete returns). The rest, CQ''s figures (1545–46): 1st, Pike over Walter Burke, 8,451 to 1,803; 5th, Republican, Mason Hampton over Thomas Brennan, 12,392 to 9,333; 8th, Rosenthal over Saul Davis, 18,919 to 2,772; 13th, Podell over Melvin Dubin, 23,098 to 16,066, Eugene Victor 4,716; 14th, Rooney over Frederick Richmond, 10,498 to 9,207, Peter Eikenberry 2,772; 16th, Murphy over Joseph Kottler, 17,669 to 9,880; 17th, Republican, Whitney Seymour over William Green, 12,291 to 10,351; 19th, Farbstein over Theodore Weiss, 16,027 to 12,677; 21st, Scheuer over Irma Santaella, 14,384 to 7,665; 22nd, Gilbert over Nathan Straus, 8,370 to 7,055; 23rd, Bingham over Patrick Cunningham, 27,699 to 13,685; 27th, Republican, McKneally over Joseph Eley, 9,373 to 8,193, Frederick Roland 3,861, Edwin Lally 910; 28th, Fish for the Republicans, no returns, Liddy losing; 39th, Republican, Daniel Weber over Pillion, 14,155 to 9,802; 41st, Dulski over Charles Black, 21,307 to 11,412. Farmer unopposed for the Republican and Liberal nominations in the 12th. Check: the State''s returns; CQ gives Fish''s service as 1920–45. Names: Celler, Kelly, Lowenstein, Chisholm, Koch, Powell.'
