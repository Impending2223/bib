      when: June 18
      date: '1968-06-18'
      thread: elections-1968-chicago
      also:
      - democratic-party
      c: 'Stephen Mitchell, for McCarthy, on Bailey''s officers: "the Johnson-Humphrey Administration has picked officers to run the convention their way"; Boggs "a confirmed hawk"; Shapiro unfit. He had proposed Sanders for rules, Muskie and Collins for other posts.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1549. Check: the day. See [[cal.1968-06-18.elections-1968-chicago]]. Names: Mitchell, Boggs, Shapiro, Sanders, Muskie, Collins, Johnson, Humphrey, McCarthy.'
