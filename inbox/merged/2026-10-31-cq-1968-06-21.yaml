      when: June 17
      date: '1968-06-17'
      thread: elections-1968
      c: 'Winthrop Rockefeller: Wallace "a demagogue."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1544. Names: Winthrop Rockefeller, Wallace.'
      tags:
      - name:rockefeller-winthrop
      - name:wallace-george-c
