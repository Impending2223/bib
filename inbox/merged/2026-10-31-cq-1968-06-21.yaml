      id: cal.1968-06.elections-1968-4
      when: June
      date: 1968-06
      thread: elections-1968
      c: 'Rockefeller''s organization at mid-June, by CQ''s list. Robert Douglass, his counsel at Albany, campaign manager; Leonard Hall director of political activity; Hinman the delegate search, John Deardourff his regional staff. Emmet John Hughes over research, speeches and advertising: Oscar Ruebhausen research, Richard Nathan the domestic group, Kissinger the foreign. Fund-raising: John Hay Whitney and Walter Thayer.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1534–36. CQ''s list besides: James Henderson and Jerry Olson under Douglass; Douglas Bailey and David Goldberg of Campaign Consultants in the delegate hunt; William Treadwell in the West, Michael O''Neil and Robert Snodgrass in nine Southern States; Malcolm Wilson in the field; Albert Abrahams, the Washington office; the staff, Slote (press), Alton Marshall, Robert McManus, Joseph Boyd (advance), Anne Whitman, Jackie Robinson; Hugh Morrow, Joseph Persico and David Nevin, speeches; Thomas Losee and Jack Tinker & Partners, advertising; Archibald Gillies, fund-raising; advisers David and Winthrop Rockefeller and William Ronan. Check: CQ prints George A. Hinman. Names: Nelson Rockefeller, Hall, Hinman, Hughes, Nathan, Kissinger, Whitney.'
