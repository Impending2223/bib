    entry:
      id: cal.1968-06-18.elections-1968-6
      when: June 18
      date: '1968-06-18'
      thread: elections-1968
      c: 'Cleveland, the American Newspaper Guild. McCarthy: the President''s powers to be decentralized; "When a Cabinet becomes ''my Cabinet'' or a party becomes ''my party'' the process of government is distorted."'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1544. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
