      id: cal.1968-06.elections-1968-5
      when: June
      date: 1968-06
      thread: elections-1968
      c: 'Humphrey''s organization at mid-June, by CQ''s list. United Democrats for Humphrey, Washington: Truman honorary chairman; Fred Harris and Mondale cochairmen and managers; Richard Maguire vice chairman, treasurer and fund-raiser; Gronouski executive vice chairman. Citizens for Humphrey, the volunteers: Ginsburg and Robert Short cochairmen, Kenneth Birkhead director. Abel''s National Labor Committee for Humphrey, some 150 leaders; every leading labor man for him but Reuther.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1535–37. CQ''s list besides: Geri Joseph, the women''s division; Lawrence Hayes, executive director; Alvin Spivack, information; Albert Mark, Joseph O''Neill, D. J. Leary, George Brooker, Eiler Ravnholt, Martin McNamara; on Citizens'' organizing committee Acheson, Isaac Stern, Ralph Ellison, Eric Hoffer, James Ling; Sidney Weinberg''s own fund-raising; the National Committee for the Nomination of Hubert Humphrey, John Loeb and Connor, Edgar Kaiser vice chairman, Rowe and Rabb counsel; Gardner and John Cowles, Dwayne Andreas, fund-raising; Joseph Keenan, the labor committee''s secretary-treasurer; Doyle Dane Bernbach, advertising; friends and advisers Foley, Fred Gates, Kampelman, Sanford (the South), M. W. Thatcher, Clifton Carter, Paul Gibson, Edwin Firmage, Meany, H. W. Brawley. The Vice President''s own staff (1537): William Connell, William Welsh, Julius Cahn, Sherman, Ofield Dukes, David Gartner, Neal Peterson, Rielly, John Stewart, Van Dyk, Vi Williams. Names: Humphrey, Truman, Harris, Mondale, Gronouski, Ginsburg, Abel, Reuther.'
