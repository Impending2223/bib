      - congress
      c: 'The House tables Gross''s privileged resolution returning the conference report on H.R. 15414 to the Senate, the surcharge having originated there: 257–162. Recommittal refused by voice vote.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1507. Check: the roll call on Voteview. See [[cal.1968-06-20.economy]]. Names: Gross.'
