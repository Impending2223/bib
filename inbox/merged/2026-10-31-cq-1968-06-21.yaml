      when: Apr. 11
      date: '1968-04-11'
      thread: elections-1968
      c: 'United Democrats for Humphrey: its organizing committee announced, Truman honorary chairman. Senators Fred Harris and Mondale; Representatives Boggs, Gonzalez, Holifield, O''Hara and Zablocki; Governors Ellington and Guy; Mayors Ivan Allen and Cervantes; Meany; Farley, Benton, Sanford, Rowe, Patricia Harris, George Weaver, Robert Nathan of ADA, Maguire, Heineman, Robert Partridge.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1537 (the committee), 1536 (Birkhead organized it after Johnson''s withdrawal). See [[cal.1968-04-27.elections-1968]]. Names: Humphrey, Truman, Fred Harris, Mondale, Boggs, Gonzalez, Holifield, O''Hara, Zablocki, Ellington, Guy, Allen, Cervantes, Meany, Benton, Sanford, Rowe, Patricia Harris, Weaver, Heineman.'
