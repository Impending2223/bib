ops:
  - add:
      entry:
        id: cal.1961-09-19.berlin-and-vienna-2
        when: Sept. 19
        date: '1961-09-19'
        thread: berlin-and-vienna
        also: [defense]
        c: McNamara announces some 73,000 reservists called. Two National Guard divisions, the 32nd Infantry of Wisconsin and the 49th Armored of Texas, with 249 support units, to be activated Oct. 15; 25,500 of the Ready Reserve to fill them. Kennedy had approved the two divisions after the Chiefs' meeting of Sept. 18, against any move overseas now.
        n: '[[w.poole-joint-chiefs-of-staff]], 153. Names: McNamara, Kennedy.'
        src:
          c: becacef1
          rows:
            - 'w.poole-joint-chiefs-of-staff 153: all'
        tags: [name:mcnamara-robert-s, name:kennedy-john-f]
      section: '196109'
  - add:
      entry:
        id: cal.1961-09.berlin-and-vienna-3
        when: Late Sept.
        date: 1961-09
        thread: berlin-and-vienna
        also: [defense]
        c: More forces for the European Command authorized, a week after the call-up's announcement. The 3rd Armored Cavalry Regiment to Germany; eleven Air National Guard squadrons, 275 aircraft, to Europe by Nov. 1, seven regular squadrons, 126 aircraft, home.
        n: '[[w.poole-joint-chiefs-of-staff]], 155. Check: the day. See [[cal.1961-09-19.berlin-and-vienna-2]].'
        src:
          c: 9d928d50
          rows:
            - 'w.poole-joint-chiefs-of-staff 155: all'
      section: '196109'
  - add:
      entry:
        id: cal.1962-10-26.missile-crisis-10
        when: Oct. 26
        date: '1962-10-26'
        thread: missile-crisis
        c: The Joint Chiefs, in their morning meeting, direct Dennison to stop work on OPLAN 314 and concentrate on 316, the invasion of Cuba; ten transports to be pre-positioned, McNamara approving, 29 civilian cargo ships to be chartered, put off.
        n: '[[w.poole-joint-chiefs-of-staff]], 178. Names: McNamara.'
        src:
          c: fe015a45
          rows:
            - 'w.poole-joint-chiefs-of-staff 178: all'
        tags: [name:mcnamara-robert-s]
      section: '196210'
  - add:
      entry:
        id: cal.1962-11-05.missile-crisis-2
        when: Nov. 5
        date: '1962-11-05'
        thread: missile-crisis
        c: 'Kennedy to McNamara: OPLAN 316 "thin." He would use the Army''s three uncommitted divisions in the general reserve for the invasion and activate National Guard divisions in their place.'
        n: '[[w.poole-joint-chiefs-of-staff]], 183. See [[cal.1962-10-26.missile-crisis-10]]. Names: Kennedy, McNamara.'
