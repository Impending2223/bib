      when: Oct.
      date: 1965-10
      thread: middle-east
      c: 'Israel, its tank negotiations done, asks the United States for 210 new fighter-bombers, almost nine times the "few"
        proposed before: neither Britain nor France can supply them. After months of delay Defense and State back 36 fighters
        for Jordan and up to 48 fighter-bombers for Israel.'
