      - defense
      c: 'McNamara''s new policy on lending military equipment to police: offensive equipment by himself, his deputy or the
        Chairman of the Joint Chiefs only; protective equipment delegable by the service secretaries to local commanders.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 277. Names: McNamara.'
