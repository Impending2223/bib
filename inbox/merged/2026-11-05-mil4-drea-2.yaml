      date: '1967-09-21'
      thread: war-opposition
      also:
      - defense
      c: OSD and the Army speed their preparations against the march, on intelligence that the Pentagon is the marchers' main
        target.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 280.'
