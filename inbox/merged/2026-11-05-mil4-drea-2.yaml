      also:
      - defense
      c: 'McNamara names McGiffert, Under Secretary of the Army, to head a task force on the control of civil disturbances
        in the Washington area. It meets that day: a temporary plan, the police "the first line of defense," then the federalized
        District Guard and Army and Marine units, Cabin Guard.'
