      when: May 31
      date: '1967-05-31'
      thread: middle-east-six-day-war
      c: Johnson, unenthusiastic, with McNamara and Rusk on the naval probe. He agrees to a maritime declaration; State sends
        the draft to all posts the same day.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 436. See [[cal.1967-05-30.middle-east]]. Names: Johnson, McNamara, Rusk.'
      src:
