      when: June 1
      date: '1967-06-01'
      thread: middle-east-six-day-war
      c: 'Rusk, McNamara with him, assures Senate Foreign Relations: no final decision to use force until the UN''s remedies
        are exhausted and Congress''s support won.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 436. Names: Rusk, McNamara.'
