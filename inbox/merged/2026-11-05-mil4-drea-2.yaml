    entry:
      id: cal.1967-05-28.middle-east-six-day-war
      when: May 28
      date: '1967-05-28'
      thread: middle-east-six-day-war
      c: 'The Control Group''s draft presidential memorandum: a multinational declaration on free passage of the Strait, a
        scenario to test it, a supporting congressional resolution. McNamara demurs: the resolution does not clearly allow
        military action, without which neither planning nor declaration could be backed in a showdown.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 435. Names: McNamara.'
      src:
        c: edc5d852
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 435: all'
      tags:
      - name:mcnamara-robert-s
    section: '196705'
