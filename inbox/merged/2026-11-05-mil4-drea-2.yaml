      date: '1967-10-02'
      thread: war-opposition
      also:
      - defense
      c: 'Nitze, McGiffert, Clark and others agree: no blocking a permitted demonstration; no one into a federal building;
        the protesters at the Pentagon confined to North Parking; medical and sanitary amenities only at the last minute.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 281. See [[cal.1967-09-26.war-opposition]]. Names: Nitze.'
