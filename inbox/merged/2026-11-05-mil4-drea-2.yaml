    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 274–76 (some 2,000 guardsmen by 5 a.m. July 24; nearly 15,000 Guard
      and Regular troops by 4 a.m. July 25; 37 civilians dead by July 28, the Guard''s 155,000 rounds; federal troops out
      July 28–30, the state of emergency ended Aug. 6)'
