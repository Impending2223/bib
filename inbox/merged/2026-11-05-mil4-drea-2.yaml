      date: 1966-02
      thread: middle-east
      c: Johnson instructs McNamara to make a hard-nosed deal for Israel's aircraft, on its promise to "sew up everyone in
        Congress to keep quiet about our Jordan and Israeli sales."
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 426. Names: Johnson, McNamara.'
