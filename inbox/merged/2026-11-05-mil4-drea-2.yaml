      when: May 19
      date: '1967-05-19'
      thread: middle-east-six-day-war
      c: McNamara and Wheeler, on ISA's recommendation, move major Sixth Fleet units from the Italian coast to the eastern
        Mediterranean.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 429. Names: McNamara, Wheeler.'
