      when: May 14
      date: '1967-05-14'
      thread: middle-east-six-day-war
      c: The first of Johnson's ad hoc groups on the crisis, under Eugene Rostow, to watch the interdepartmental work. Two
        weeks later Rostow chairs the Control Group, on its long-range diplomatic and military aspects, reporting to Rusk;
        the Joint Chiefs have no regular member.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 428. Names: Eugene Rostow, Rusk.'
