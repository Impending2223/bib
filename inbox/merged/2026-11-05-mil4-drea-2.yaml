      c: After more Syrian-inspired attacks, Israel asks 200 armored personnel carriers and $2 million in M-48 tank spares
        as grants, and $14 million in credits for Hawk missiles and M-48 tanks. Washington, having never given Israel grant
        aid, refuses the precedent.
