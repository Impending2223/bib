      when: Oct.
      date: 1967-10
      thread: middle-east-six-day-war-aftermath
      c: 'Eban to Rusk: Israel needs "security frontiers." Reminded that Eshkol disclaimed territorial ambitions: "That was
        before Syria and Jordan entered the war."'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 450. Names: Eban, Rusk, Eshkol.'
      src:
        c: 4d595a53
        rows:
