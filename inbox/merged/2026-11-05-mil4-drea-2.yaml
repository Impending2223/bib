      - defense
      c: 'McNamara with Defense, Justice, State and GSA officials, fifteen minutes with Johnson on the FBI''s estimate of
        40,000 to 50,000 marchers against the Capitol, the White House and the Pentagon. McNamara: troops to ring the Pentagon,
        marshals between them and the protesters, reserves in the courtyard; he, Wheeler and Christopher to watch from his
        office and the roof.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 280. Names: McNamara, Johnson, Wheeler.'
