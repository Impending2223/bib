      thread: civil-disorders
      also:
      - defense
      c: 'McGiffert''s task force gives McNamara its formal plan: "maximum application of manpower and minimum application
        of force," no "shoot-to-kill"; local police first, then the federalized Guard and the designated federal units together.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 277. See [[cal.1967-07-27.civil-disorders-3]]. Names: McNamara.'
