    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 429–30 (Thomson in Washington May 24 with Eugene Rostow and Rusk; Johnson
      hears the gist of the British plan at the NSC at midday)'
- add:
    entry:
      id: cal.1967-05-26.middle-east-six-day-war
      when: May 26
      date: '1967-05-26'
      thread: middle-east-six-day-war
      c: 'Eban at the Pentagon, midmorning, with McNamara, Wheeler and OSD''s officials: the closure of the Gulf of Aqaba
        would isolate Israel from half the world "and leave it crippled"; he cites the aide-memoire of February 1957. ISA
        asks Israel''s thirty-day requirements and what American sources could fill.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 432–33. See [[cal.1967-05-25.middle-east]]. Names: Eban, McNamara, Wheeler.'
      src:
        c: 9ce72f51
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 432–33: all'
      tags:
      - name:eban-abba-s
      - name:mcnamara-robert-s
      - name:wheeler-earle
    section: '196705'
- add:
    entry:
      id: cal.1967-05-27.middle-east-six-day-war
      when: May 27
      date: '1967-05-27'
      thread: middle-east-six-day-war
      c: The Joint Chiefs warn McNamara that every proposed course for a probe of the Strait risks war or an armed clash with
        the UAR; nothing to be done unless the consequences are accepted. Courses III and IV need reinforcements through the
        Suez Canal, not assembled before June 20; to the British a probe must come between May 28 and June 1.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 434–35. Names: McNamara.'
      src:
        c: ed9f24f1
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 434–35: all'
      tags:
      - name:mcnamara-robert-s
    section: '196705'
- cite:
    id: cal.1967-05-27.middle-east
    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 434 (Kosygin, dissatisfied with Johnson''s letter of May 22: Israel
      preparing to attack)'
    units: A
- cite:
    id: cal.1967-05-28.middle-east
    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 434 (the afternoon of May 28; Johnson to Kosygin the same day, his "maximum
      effort" for moderation)'
    units: A
