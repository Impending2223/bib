- add:
    entry:
      id: cal.1960-10-06.vietnam
      when: Oct. 6
      date: '1960-10-06'
      thread: vietnam
      c: 'State and Defense agree on a joint message: Durbrow, McGarr and the country team to draw up "an overall plan to
        support the Diem government in [a] ''national emergency effort'' to defeat the Viet Cong," from CINCPAC''s outline
        plan, for review in Washington. The country team''s plan forwarded in January 1961.'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 26. Names: Durbrow, McGarr.'
      src:
        c: 06c23e1b
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 26: all'
      tags:
      - name:durbrow-elbridge
      - name:mcgarr-lionel-c
- add:
    entry:
      id: cal.1961-01-07.laos
      when: Jan. 7
      date: '1961-01-07'
      thread: laos
      c: 'Felt on CINCPAC''s OPLAN 32-60: acting alone, the task force would "deploy rapidly to Laos and make an airborne
        and airlanded operation," the key points on the Plain of Jars seized.'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 38. Names: Felt.'
      src:
        c: 06f827f9
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 38: all'
      tags:
      - place:plain-of-jars
      - name:felt-harry-d
- add:
    entry:
      id: cal.1961-03-20.laos-2
      when: Mar. 20
      date: '1961-03-20'
      thread: laos
      c: 'The Joint Chiefs to CINCPAC: the Royalists must retake the crossroads, then the original plan for the Plain of
        Jars; what weapons do they need?'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 49. To check: msg, JCS to CINCPAC, JCS 992240, Mar. 20, 1961 (cited by
        [[w.schulimson-joint-chiefs-of-staff]], 49 n.95).'
      src:
        c: 84ffff76
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 49: all'
        - 'via x.1961-03-20.msg-jcs-to-cincpac-jcs-992240: all'
      tags:
      - place:plain-of-jars
- add:
    entry:
      id: cal.1961-03-21.laos-3
      when: Mar. 21
      date: '1961-03-21'
      thread: laos
      c: 'Felt answers the Chiefs: weapons matter less than Phoumi''s will to carry the fight to the enemy; without the
        attack on the road junction "we are spinning our wheels."'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 49. To check: msg, CINCPAC to JCS, DA IN 95339, Mar. 21, 1961 (cited by
        [[w.schulimson-joint-chiefs-of-staff]], 49 n.96). See [[cal.1961-03-20.laos-2]]. Names: Felt, Phoumi.'
      src:
        c: c3289443
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 49: all'
        - 'via x.1961-03-21.msg-cincpac-to-jcs-da-in: all'
      tags:
      - name:felt-harry-d
      - name:phoumi-nosavan
- add:
    entry:
      id: cal.1961-04-03.laos-2
      when: Apr. 3
      date: '1961-04-03'
      thread: laos
      c: 'The Joint Chiefs report on the decisions of Mar. 9: a base in Thailand with a joint command for Marine helicopters
        and four Air Force C-130s to ferry supplies into Laos; enough airlifted to equip some 3,800 Meo.'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 66. To check: msg, JCS 993269, Apr. 3, 1961 (cited by [[w.schulimson-joint-chiefs-of-staff]],
        66 n.18). See [[cal.1961-03-09.laos]].'
      src:
        c: d6adf63e
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 66: all'
        - 'via x.1961-04-03.msg-jcs-993269-apr-3-1961: all'
- add:
    entry:
      id: cal.1961-04-04.laos
      when: Apr. 4
      date: '1961-04-04'
      thread: laos
      c: 'The Joint Chiefs to Felt: with negotiations possible, presidential approval needed for more transport flights
        into Laos. McNamara has asked State to seek Thailand''s leave for B-26 operations over Laos from Thai bases.'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 66. To check: msg, JCS 993343, Apr. 4, 1961 (cited by [[w.schulimson-joint-chiefs-of-staff]],
        66 n.19). Names: Felt, McNamara.'
      src:
        c: e276463c
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 66: all'
        - 'via x.1961-04-04.msg-jcs-993343-apr-4-1961: all'
      tags:
      - name:felt-harry-d
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1961-04-16.laos
      when: Apr. 16
      date: '1961-04-16'
      thread: laos
      also:
      - soviet-union
      c: 'Moscow. Gromyko hands the British ambassador a counterproposal on a cease-fire and a conference: the essentials
        accepted, the cease-fire at once, the Control Commission to verify it.'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 70. Names: Gromyko.'
      src:
        c: 508a105c
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 70: all'
      tags:
      - name:gromyko-andrei
- add:
    entry:
      id: cal.1961-04-27.laos-3
      when: Apr. 27
      date: '1961-04-27'
      thread: laos
      c: Bangkok. At SEATO's Council of Representatives the American chargé again asks a Code Yellow alert for SEATO Plan
        5; each member to seek instructions. Britain and France opposed.
      n: '[[w.schulimson-joint-chiefs-of-staff]], 78. See [[cal.1961-04-27.laos]].'
      src:
        c: da2d3d9b
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 78: all'
- add:
    entry:
      id: cal.1961-05-02.laos-2
      when: May 2
      date: '1961-05-02'
      thread: laos
      c: 'The Joint Chiefs to Felt: SEATO Plan 5 questioned "at high levels": could the forces at hand take the plan''s
        first objectives?'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 83. See [[cal.1961-05-02.laos]]. Names: Felt.'
      src:
        c: 083343bd
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 83: all'
      tags:
      - name:felt-harry-d
- add:
    entry:
      id: cal.1961-08-14.laos
      when: Aug. 14
      date: '1961-08-14'
      thread: laos
      also:
      - vietnam
      c: The Joint Chiefs send their own team under Brigadier General William A. Craig to South Vietnam, Thailand and Laos,
        on the feasibility of SEATO Plan 5. In Laos he finds the situation chaotic.
      n: '[[w.schulimson-joint-chiefs-of-staff]], 105. To check: msg, JCS 1126 to Craig, 142346Z Aug 61 (cited by [[w.schulimson-joint-chiefs-of-staff]],
        105 n.72).'
      src:
        c: 94c458a3
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 105: all'
        - 'via x.1961-08-14.msg-jcs-1126-to-craig-142346z: all'
- add:
    entry:
      id: cal.1961-09-15.laos
      when: Sept. 15
      date: '1961-09-15'
      thread: laos
      also:
      - vietnam
      c: 'Craig back: a sixteen-page report to Lemnitzer; he briefs Taylor and Rostow. Rostow to Kennedy: the build-up of
        Pathet Lao and Viet Minh forces in southern Laos, pressure on central Vietnam; Plan 5 now, or the command and logistic
        base laid.'
      n: 'Rostow to Kennedy, [FRUS 1961–63, I, doc. 131](https://history.state.gov/historicaldocuments/frus1961-63v01/d131)
        (Sept. 15). [[w.schulimson-joint-chiefs-of-staff]], 110–11. To check: Craig Rpt, Encl to DJSM-1259-61, Oct. 13,
        1961, JMF 9050/5420 (10 Aug 61) (cited by [[w.schulimson-joint-chiefs-of-staff]], 110 n.10). Check: the day of the
        briefing; FRUS''s note has Taylor''s appointment book give Sept. 16. See [[cal.1961-08-14.laos]]. Names: Lemnitzer,
        Taylor, Rostow, Kennedy.'
      src:
        c: c494a1d2
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 110–11: all'
        - 'via x.1961-09-15.craig-rpt-encl-to-djsm-1259: all'
      tags:
      - name:lemnitzer-lyman-l
      - name:taylor-maxwell
      - name:rostow-walt-w
      - name:kennedy-john-f
- cite:
    id: cal.1961-08-29.laos
    item: '[[w.schulimson-joint-chiefs-of-staff]], 106 (Lemnitzer presents the revised SEATO Plan 5: a Thai, South Vietnamese
      and American force under an American commander into southern Laos, some 13,000 Americans to hold the Mekong towns)'
    units: all
- add:
    entry:
      id: cal.1961-10-03.laos-2
      when: Oct. 3
      date: '1961-10-03'
      thread: laos
      c: 'Lemnitzer sends McNamara an "outline program for limited holding actions in Southeast Asia," should negotiation
        fail and SEATO Plan 5 not be carried out: to delay Communist expansion and keep "fluidity."'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 210. Names: Lemnitzer, McNamara.'
      src:
        c: bb3a0e42
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 210: all'
      tags:
      - name:lemnitzer-lyman-l
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1961-11-03.vietnam-2
      when: Nov. 3
      date: '1961-11-03'
      thread: vietnam
      c: Lemnitzer, on a Joint Staff study, proposes "three separate and sequential programs" of defoliation, as the country
        team outlined, common weed killers; charges of chemical warfare possible. Felt had found the tests inconclusive,
        Oct. 21.
      n: '[[w.schulimson-joint-chiefs-of-staff]], 148. Names: Lemnitzer, Felt.'
      src:
        c: 0b00d787
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 148: all'
      tags:
      - name:lemnitzer-lyman-l
      - name:felt-harry-d
- add:
    entry:
      id: cal.1961-11-16.vietnam-macv
      when: Nov. 16
      date: '1961-11-16'
      thread: vietnam-macv
      c: The Joint Staff gives the Joint Chiefs a draft order for "a joint command with headquarters in Saigon," operational
        control of all American forces in Vietnam; CINCPAC to keep the forces round it. The Chiefs back CINCPAC's view.
      n: '[[w.schulimson-joint-chiefs-of-staff]], 157. See [[cal.1961-11.vietnam-macv]].'
      src:
        c: 36016fe4
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 157: all'
- add:
    entry:
      id: cal.1961-11-30.vietnam
      when: Nov. 30
      date: '1961-11-30'
      thread: vietnam
      c: 'NSAM 115, "Defoliant Operations in Vietnam," approved: Washington to consider and authorize any plan CINCPAC and
        the country team make under it.'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 150. Names: Kennedy.'
      src:
        c: 38f9f52f
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 150: all'
      tags:
