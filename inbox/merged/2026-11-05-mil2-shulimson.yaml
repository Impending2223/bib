        aid fail. McNamara: American forces to be introduced before the loss of the whole interior.'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 187. Check: Shulimson rests the meeting on Clifton''s account. See [[cal.1962-02-27.vietnam]].
