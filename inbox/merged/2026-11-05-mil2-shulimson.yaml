- add:
    entry:
      id: cal.1961-11-30.vietnam-2
      when: Nov. 30
      date: '1961-11-30'
      thread: vietnam
      c: 'Nolting to State: the "Thompson Mission is badly off rails from standpoint US-UK coordination"; Thompson''s recommendations,
        made to Diệm without consulting the Americans, complicate the reforms sought of Saigon. McGarr had protested Thompson''s
        views to the Chiefs and Felt.'
      n: 'Nolting to State, [FRUS 1961–63, I, doc. 299](https://history.state.gov/historicaldocuments/frus1961-63v01/d299).
        [[w.schulimson-joint-chiefs-of-staff]], 164 (Nolting''s cable; McGarr''s protest). Names: Nolting, Thompson, Diệm,
        McGarr, Felt.'
      src:
        c: d6c74371
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d299: A-B'
        - 'w.schulimson-joint-chiefs-of-staff 164: all'
      tags:
      - name:nolting-frederick-e-jr
      - name:thompson-robert
      - name:ngo-dinh-diem
      - name:mcgarr-lionel-c
      - name:felt-harry-d
- add:
    entry:
      id: cal.1961-12-14.vietnam
      when: Dec. 14
      date: '1961-12-14'
      thread: vietnam
      c: Minh briefs Diệm on the Zone D operation; Diệm rejects its command arrangements, the task force under Minh's Field
        Army Group. Nhu and loyal officers suspect a coup. CINCPAC's campaign plan, given McGarr to "sell" to Minh, comes
        to nothing.
      n: '[[w.schulimson-joint-chiefs-of-staff]], 166. Names: Diệm, McGarr.'
      src:
        c: fe5997c5
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 166: all'
      tags:
      - name:ngo-dinh-diem
      - name:mcgarr-lionel-c
- add:
    entry:
      id: cal.1961-12-26.laos
      when: Dec. 26
      date: '1961-12-26'
      thread: laos
      c: 'The Joint Chiefs approve CINCPAC''s new plan for SEATO: Force Alpha, two Marine battalion landing teams with Thai
        and Pakistani battalions, to hold the north from Vientiane to Thakhek.'
      n: '[[w.schulimson-joint-chiefs-of-staff]], 212. To check: JCS approval of CINCPAC''s plan for SEATO, Dec. 26, 1961
        (cited by [[w.schulimson-joint-chiefs-of-staff]], 212 n.61).'
      src:
        c: 04674e9a
        rows:
        - 'w.schulimson-joint-chiefs-of-staff 212: all'
        - 'via x.1961-12-26.jcs-approval-of-cincpac-s-plan: all'
