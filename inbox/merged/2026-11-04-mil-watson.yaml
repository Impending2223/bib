- add:
    entry:
      id: cal.1960-03-18.defense
      when: Mar. 18
      date: '1960-03-18'
      thread: defense
      c: 'Gates with Eisenhower on speeding Polaris. Eisenhower: no operational test of the missile yet, so no larger program;
        Gates: an underwater firing set for August, the 2,500-mile missile below ship construction. Eisenhower suggests long
        lead-time procurement for 12 vessels.'
      n: '[[w.watson-into-the-missile-age]], 376. To check: Goodpaster''s memorandum of conference with the President, Mar.
        18, 1960, DDE Diary series, Whitman File, Eisenhower Library (cited by [[w.watson-into-the-missile-age]], 376 n.92).
        Names: Gates, Eisenhower.'
      src:
        c: 14ad8d0a
        rows:
        - 'w.watson-into-the-missile-age 376: all'
        - 'via x.1960-03-18.goodpaster-conference-polaris: all'
      tags:
      - name:gates-thomas-s-jr
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-03-23.defense
      when: Mar. 23
      date: '1960-03-23'
      thread: defense
      c: Eisenhower directs OSD to make a "quick study" of the cost of long lead-time items for six or nine more Polaris submarines,
        the money perhaps from reprogramming.
      n: '[[w.watson-into-the-missile-age]], 376. To check: Goodpaster''s memorandum for the record, Mar. 23, 1960, Office
        of the Staff Secretary, White House Office, Eisenhower Library (cited by [[w.watson-into-the-missile-age]], 376 n.92).
        See [[cal.1960-03-18.defense]]. Names: Eisenhower.'
      src:
        c: 9a7b225a
        rows:
        - 'w.watson-into-the-missile-age 376: all'
        - 'via x.1960-03-23.goodpaster-memrcd-polaris: all'
      tags:
      - name:eisenhower-dwight-d
