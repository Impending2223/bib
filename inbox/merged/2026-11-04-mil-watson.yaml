      id: cal.1960-03-25.defense-2
      when: Mar. 25
      date: '1960-03-25'
      thread: defense
      c: 'Douglas tells the Air Force: production commitments for 150 Minuteman missiles by the end of fiscal 1963; the rest
        of its plan of Jan. 12 (400 by December 1963, a second plant) held. He asks Gray for the President''s approval of
        the force goals.'
      n: '[[w.watson-into-the-missile-age]], 370. To check: Douglas to the chairman, AF BMC, and to Gray, both Mar. 25, 1960,
        OSD CCS files 1960, Acc 64-A2093 (cited by [[w.watson-into-the-missile-age]], 370 n.56). Names: Douglas, Gray.'
      src:
        c: 0b58fee6
        rows:
        - 'w.watson-into-the-missile-age 370: all'
        - 'via x.1960-03-25.douglas-to-af-bmc-minuteman: A-B'
        - 'via x.1960-03-25.douglas-to-gray-minuteman: C'
      tags:
      - name:douglas-james-h-jr
      - name:gray-gordon
