      n: '[[w.watson-into-the-missile-age]], 373. To check: the ARDC termination report, Dec. 15, 1960; Ravenstein, *Air Force
        Combat Wings*, 292; Werrell, *The Evolution of the Cruise Missile*, 96–97 (cited by [[w.watson-into-the-missile-age]],
        373 n.71). Check: the day.'
