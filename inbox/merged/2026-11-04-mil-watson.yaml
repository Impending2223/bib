      when: Apr. 6
      date: '1960-04-06'
      thread: defense
      c: 'Eisenhower with Gates decides "three and nine" for Polaris: three submarines funded in the 1961 budget, advance
        procurement for nine more. The missile''s range to 2,500 miles, the Navy to pay by reprogramming.'
      n: '[[w.watson-into-the-missile-age]], 376. To check: Goodpaster''s memorandum of conference with the President, Apr.
        6, 1960, DDE Diary series, Whitman File, Eisenhower Library (cited by [[w.watson-into-the-missile-age]], 376 n.93).
        See [[cal.1960-03-18.defense]]. Names: Eisenhower, Gates.'
      src:
        c: 37edfd7b
        rows:
        - 'w.watson-into-the-missile-age 376: all'
        - 'via x.1960-04-06.goodpaster-conference-polaris: all'
