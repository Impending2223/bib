      id: cal.1960-05-12.berlin-and-vienna
      when: May 12
      date: '1960-05-12'
      thread: berlin-and-vienna
      c: 'The Joint Chiefs answer Douglas on Berlin (JCSM-202-60): the posture in midsummer will permit the courses of action
        of the Geneva conference, with readiness measures if they must be carried out; no new measures for a separate treaty.
        A "delicate balance" between preparing for the worst and alarming the public.'
      n: '[[w.watson-into-the-missile-age]], 616. To check: Douglas to the Chairman, JCS, Mar. 28, 1960; JCSM-202-60, May
        12, 1960, OSD CCS files 1959, Acc 63-B1574 (cited by [[w.watson-into-the-missile-age]], 616 nn.114–15). Check: Watson''s
        text dates Douglas''s questions Mar. 23, the note Mar. 28. Names: Douglas.'
      src:
        c: 4964f0fa
        rows:
        - 'w.watson-into-the-missile-age 616: all'
        - 'via x.1960-05-12.jcsm-202-60-berlin: all'
      tags:
      - name:douglas-james-h-jr
