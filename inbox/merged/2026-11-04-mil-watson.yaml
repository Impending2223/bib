- add:
    entry:
      id: cal.1960-02-26.berlin-and-vienna
      when: Feb. 26
      date: '1960-02-26'
      thread: berlin-and-vienna
      c: 'Herter to Eisenhower, from the South American trip: the British and French agree on the procedures for resuming
        high-altitude flights in the Berlin air corridors; he asks authority to notify the Soviets and resume them. Eisenhower
        approves.'
      n: '[FRUS 1958–60, IX: Berlin Crisis 1959–1960; Germany; Austria, doc. 82](https://history.state.gov/historicaldocuments/frus1958-60v09/d82)
        (A). [[w.watson-into-the-missile-age]], 614 (the allies'' concurrence in February; Herter''s reply of Feb. 26 that
        the President approved). To check: State''s Tosec 17 to Rio de Janeiro, Feb. 25, 1960, and Herter''s Secto 11 from
        Buenos Aires, Feb. 26, OSD Hist (cited by [[w.watson-into-the-missile-age]], 614 n.106). Made public: FRUS 1958–60,
        IX (1993). Names: Herter, Eisenhower.'
      src:
        c: c0b08ac9
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v09/d82: A'
        - 'w.watson-into-the-missile-age 614: all'
        - 'via x.1960-02-26.secto-11-herter-to-state: B'
      tags:
      - name:herter-christian-a
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-03-04.berlin-and-vienna
      when: Mar. 4
      date: '1960-03-04'
      thread: berlin-and-vienna
      c: 'Gates and Douglas with the Joint Chiefs on the Berlin flights. White and Russell for them; Lemnitzer would first
        weigh a Soviet or East German reaction; Shoup fears they might bring on a world war. The Chiefs'' memorandum the same
        day: "prepared" to resume them, the matter "primarily a cold war tactic."'
      n: '[[w.watson-into-the-missile-age]], 614–15. To check: Col. Black''s memorandum for the record, dated Mar. 3, 1960,
        OSD CCS files, Acc 64-B2093; JCSM-84-60, Mar. 4, 1960, OSD CCS files 1959, Acc 63-B1574 (cited by [[w.watson-into-the-missile-age]],
        615 n.108). Check: Watson notes the memorandum''s date is "evidently erroneous" (614 n.107). See [[cal.1960-02-26.berlin-and-vienna]].
        Names: Gates, Douglas, White, Lemnitzer, Shoup.'
      src:
        c: fe82a4b2
        rows:
        - 'w.watson-into-the-missile-age 614–15: all'
        - 'via x.1960-03-03.memrcd-col-black-high-altitude-flights: A-D'
        - 'via x.1960-03-04.jcsm-84-60-berlin-flights: E'
      tags:
      - name:gates-thomas-s-jr
      - name:douglas-james-h-jr
      - name:white-thomas-d
      - name:lemnitzer-lyman-l
      - name:shoup-david-m
- add:
    entry:
      id: cal.1960-03-08.berlin-and-vienna
      when: Mar. 8
      date: '1960-03-08'
      thread: berlin-and-vienna
      c: 'Eisenhower with Herter, Merchant, Bohlen, Kohler, Gates, Douglas, Irwin and White on the Berlin flights, after Alsop''s
        column of Feb. 29. The Chiefs: not needed for operational reasons. Eisenhower: tell the British and French "that we
        made a mistake"; until the note goes to the Soviets, "the whole matter is in a study phase." The flights dropped.'
      n: '[FRUS 1958–60, IX: Berlin Crisis 1959–1960; Germany; Austria, doc. 84](https://history.state.gov/historicaldocuments/frus1958-60v09/d84)
        (A-C). [[w.watson-into-the-missile-age]], 615 (Alsop''s column of Feb. 29, the *Times* of Mar. 1, the meeting, the
        flights dropped). To check: Douglas''s interview by T. H. Baker, Oct. 23, 1972, 42–43, Columbia University Oral History
        (cited by [[w.watson-into-the-missile-age]], 615 n.110). Made public: FRUS 1958–60, IX (1993). See [[cal.1960-02-26.berlin-and-vienna]].
        Names: Eisenhower, Herter, Merchant, Bohlen, Kohler, Gates, Douglas, Irwin, White, Alsop.'
      src:
        c: d0ef93f7
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v09/d84: A-C'
        - 'w.watson-into-the-missile-age 615: all'
        - 'via x.1960-03-08.goodpaster-conference-berlin-flights: A-C'
        - 'via x.1972-10-23.douglas-oral-history-baker: B-D'
      tags:
      - name:eisenhower-dwight-d
      - name:herter-christian-a
      - name:merchant-livingston-t
      - name:bohlen-charles-e
      - name:kohler-foy-d
