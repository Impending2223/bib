      when: June 20
      date: '1960-06-20'
      thread: berlin-and-vienna
      c: 'Norstad approves CINCBAOR''s plan for restoring ground access to Berlin: a force of battalion size. The British:
        a battalion, backed by the nuclear threat, enough; a division-size plan left unsettled at year''s end.'
      n: '[[w.watson-into-the-missile-age]], 617–18. To check: Brig. Gen. L. J. Fields to Merchant, July 8, 1960, OSD Hist;
        USCINCEUR''s messages of Aug. 25 and Sept. 23, 1960, ibid. (cited by [[w.watson-into-the-missile-age]], 618 n.122).
        See [[cal.1960-05-12.berlin-and-vienna]]. Names: Norstad.'
