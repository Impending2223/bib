      thread: defense
      c: The Air Force announces three Minuteman squadrons at Malmstrom AFB, Mont., construction to begin in January 1961.
      n: '[[w.watson-into-the-missile-age]], 370. To check: *Annual Report of the Secretary of Defense, July 1, 1959, to June
