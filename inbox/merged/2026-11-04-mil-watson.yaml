      id: cal.1960-04-01.defense
      when: Apr. 1
      date: '1960-04-01'
      thread: defense
      c: 'The NSC, 439th meeting, on Minuteman. Douglas recommends the Air Force''s plan. Eisenhower, by Kistiakowsky''s account:
        "Why don''t we go completely crazy and plan on a force of 10,000?" He approves it, to be kept informed, the missile
        untested.'
      n: '[[w.watson-into-the-missile-age]], 370–71. To check: [[w.kistiakowsky-scientist-at-the-white]], 293; Boggs''s memorandum
        of discussion, 439th NSC meeting, Apr. 1, 1960, OSD Hist (cited by [[w.watson-into-the-missile-age]], 371 n.57). See
        [[cal.1960-03-25.defense-2]]. Names: Douglas, Eisenhower, Kistiakowsky.'
      src:
        c: a1125338
        rows:
        - 'w.watson-into-the-missile-age 370–71: all'
