- add:
    entry:
      id: cal.1960-07-14.defense
      when: July 14
      date: '1960-07-14'
      thread: defense
      c: 'Gates with the Joint Chiefs: a list of measures to raise military capability, within "reasonable" expenditures;
        more aircraft on alert, another attack carrier deployed.'
      n: '[[w.watson-into-the-missile-age]], 359. Gates''s proposals to the President after it: two more carriers deployed,
        SAC''s readiness, three B-47 wings kept, the B-70 and the reconnaissance satellites expanded, the M-60 tank, more
        Polaris submarines and a 2,500-mile Polaris by 1965, by reprogramming (Watson, 359–60). To check: Burke''s memorandum
        for the record, July 14, 1960, Originator file, Burke papers, Naval Historical Center; Herter to Gates, July 20, 1960,
        OSD CCS files 1960, Acc 64-A2093 (cited by [[w.watson-into-the-missile-age]], 359 n.178). Names: Gates.'
      src:
        c: e420d832
        rows:
        - 'w.watson-into-the-missile-age 359: all'
        - 'via x.1960-07-14.burke-memrcd-readiness-measures: all'
      tags:
      - name:gates-thomas-s-jr
