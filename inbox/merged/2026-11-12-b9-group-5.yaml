patch: 2026-11-12-b9-group-5
by: 'Claude (batch 9, group 5, audited Nov. 11–12, 2026 by the auditor; reader: white, anderson, gavin, moyar, rfk-own-words, smith, cq; the "already in" rows), Nov. 11, 2026'
ops:
- cite:
    id: cal.1965-01-27.vietnam-2
    item: '[[w.white-making-of-the-president-1969]], 19 (the "Fork-in-the-Y" memorandum from McNamara and Bundy: one fork complete withdrawal, the other an increased commitment, by ground troops or air strikes on the north; not the words, the courses as the entry gives them, or Rusk)'
    units: '?'
- check:
    id: cal.1965-01-27.vietnam-2
    text: 'Check: the day: White, 19, has McNamara and Bundy deliver the "Fork-in-the-Y" memorandum "On January 25th, five days after his inaugural address"; the entry has Jan. 27, on FRUS 1964–68, II, doc. 42.'
- cite:
    id: cal.1967-07-12.civil-disorders
    item: '[[w.white-making-of-the-president-1969]], 202 (July 12: a Negro taxi driver arrested and dragged to a police station; a crowd; a Molotov cocktail; the next night, Thursday, July 13, looting on a larger scale; not the precinct or the traffic stop)'
    units: '?'
- cite:
    id: cal.1967-07-17.civil-disorders-newark
    item: '[[w.white-making-of-the-president-1969]], 202 (July 17, the National Guard withdrawn; twenty-three killed, among them a white detective, a white fireman, six Negro women and two Negro children; not the State Police or the Kerner Commission as source)'
    units: '?'
- cite:
    id: cal.1967-07-23.civil-disorders
    item: '[[w.white-making-of-the-president-1969]], 202 (July 23, Detroit; City Police, National Guard, State Police and the Army; 43 killed, 33 black and 10 white; property damage some $45,000,000; not the raid, Romney or the arrests)'
    units: '?'
- variant:
    id: cal.1967-07-23.civil-disorders
    unit: B
    witness: w.white-making-of-the-president-1969
    reads: six days of death and destruction
    at: '202'
- cite:
    id: cal.1967-06-12.civil-disorders
    item: '[[w.white-making-of-the-president-1969]], 201 (Cincinnati, June 1967: "a five-day orgy of Molotov cocktails and fires," the worst arson in the city''s record; not the days of the month, the arrest, the Guard or the arrests)'
    units: '?'
- cite:
    id: cal.1967-05-02.black-nationalism-oakland
    item: '[[w.white-making-of-the-president-1969]], 206 (May 1967, the Black Panthers of Oakland "with guns in hand" invade the galleries of the California Assembly at Sacramento; not the day, the number, Seale or the bill)'
    units: '?'
- cite:
    id: cal.1967-07-24.civil-disorders
    item: '[[w.white-making-of-the-president-1969]], 205 (Brown "declaiming in Cambridge, Maryland": "Burn this town down. But don''t tear down your own stuff"; other words than the entry''s, no day; not the shots, the fire or the charges)'
    units: '?'
- cite:
    id: cal.1967-07-27.civil-rights-organizations
    item: '[[w.white-making-of-the-president-1969]], 205 (Brown, in Washington, D.C.: "I say there should be more shooting than looting, so if you loot, loot a gun store"; Carmichael, "from Cuba," "alleged to have said": "We are preparing groups of urban guerrillas for our defense in the cities"; White''s version has a first sentence on Newark; no days, not the church or the cherry pie)'
    units: '?'
- cite:
    id: cal.1968-02-08.south-carolina
    item: '[[w.white-making-of-the-president-1969]], 206 (Orangeburg, S.C., Feb. 8, 1968, a "riot"; not the bowling alley, the patrolmen or the Guard)'
    units: '?'
- variant:
    id: cal.1968-02-08.south-carolina
    unit: C
    witness: w.white-making-of-the-president-1969
    reads: two killed and forty injured
    at: '206'
- cite:
    id: cal.1966-05-16.civil-rights-organizations
    item: '[[w.white-making-of-the-president-1969]], 205 (May 1966, Carmichael, twenty-four, elected chairman of SNCC; not the day, the place or Lewis)'
    units: '?'
- cite:
    id: cal.1966-06-16.mississippi
    item: '[[w.white-making-of-the-president-1969]], 204 ("Black Power" first gained currency in Mississippi in June 1966, uttered by Carmichael on the march with Meredith; not the day, the town or the words)'
    units: '?'
- add:
    entry:
      id: cal.1967-06.civil-disorders
      when: June
      date: 1967-06
      thread: civil-disorders
      c: 'Cincinnati. H. Rap Brown arrives on the third day of the rioting: no peace "until the honky cops get out." Later that day: "SNCC has declared war."'
      n: '[[w.white-making-of-the-president-1969]], 201 (the third day of "a five-day orgy"; no day of the month). Check: the day; the entry for the riot gives June 12–15. See [[cal.1967-06-12.civil-disorders]]. Names: Brown.'
      tags:
      - name:brown-h-rap
      - state:oh
      - city:cincinnati
- add:
    entry:
      id: cal.1968-08-07.elections-1968-miami-9
      when: Aug. 7
      date: '1968-08-07'
      thread: elections-1968-miami
      c: 'Miami. About eleven that night, Nixon goes for a half-hour drive around the city. To two pool reporters: he wants a Vice President he can trust, who can work with him for four years and who understands the cities. He can handle foreign affairs.'
      n: '[[w.white-making-of-the-president-1969]], 250 (the drive "At about eleven"; Wednesday evening, after the nominations began). Check: the hour, by White''s "about eleven." See [[cal.1968-08-07.elections-1968-miami-6]]. Names: Nixon.'
      tags:
      - name:nixon-richard-m
      - state:fl
      - city:miami
- cite:
    id: cal.1963-08-28.march-on-washington
    item: '[[w.anderson-confronting-the-color-line]], 116 (more than two hundred thousand persons; Bayard Rustin managed the details; King "intoned his dream of an integrated America"; more than twenty-five hundred from Chicago boarded trains for the march; not the places, Randolph, the order of speakers or Lewis''s text)'
    units: '?'
- cite:
    id: cal.1967-04-04.king
    item: '[[w.anderson-confronting-the-color-line]], 319–20 (the address at Riverside Church for Clergy and Laymen Concerned about Viet Nam; "the greatest purveyor of violence in the world today—my own government"; the government urged to end the bombing, declare a unilateral cease-fire, curtail the buildup in Thailand and Laos, accept the National Liberation Front as "a political fact" in Vietnam''s future, set a date for removing all foreign troops, and to grant asylum and make reparations; not the title)'
    units: B, D, G
- cite:
    id: cal.1967-04-04.mayors-chicago
    item: '[[w.anderson-confronting-the-color-line]], 323 (Daley reelected for a fourth term "by a landslide," by more than 500,000 votes, against 140,000 in 1963; not the figures or the wards)'
    units: '?'
- add:
    entry:
      id: cal.1967-04-09.king-2
      when: Apr. 9
      date: '1967-04-09'
      thread: king
      c: 'The Chicago Sun-Times, a political writer, on Daley''s reelection: Martin Luther King''s Chicago Freedom Movement "has been pretty much of a political bust." Daley''s majority more than 500,000, against 140,000 in 1963.'
      n: '[[w.anderson-confronting-the-color-line]], 323. To check: *Chicago Sun-Times*, Apr. 9, 1967 (cited by [[w.anderson-confronting-the-color-line]], 488 nn.21–22). Check: the day, by the note''s date. See [[cal.1967-04-04.mayors-chicago]]. Names: King, Daley.'
      tags:
      - name:king-martin-luther-jr
      - name:daley-richard-j
- add:
    entry:
      id: cal.1967-04-10.king-2
      when: Apr. 10
      date: '1967-04-10'
      thread: king
      c: 'The Chicago Daily News, editorial, on King''s attack on the Vietnam war: "Dr. Martin Luther King has begun to sound like a demagog." His "intemperance," with his call for marches into Cicero. If he continues against the war "he should get out of the civil rights controversy."'
      n: '[[w.anderson-confronting-the-color-line]], 321. To check: *Chicago Daily News*, Apr. 10, 1967 (cited by [[w.anderson-confronting-the-color-line]], 488 n.17). See [[cal.1967-04-04.king]]. Names: King.'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1967-04-13.king
      when: Apr. 13
      date: '1967-04-13'
      thread: king
      c: 'Bunche, United Nations Under Secretary for political affairs, of King: he should "positively and publicly give up one role or the other."'
      n: '[[w.anderson-confronting-the-color-line]], 321 (no day). To check: *Chicago Sun-Times*, Apr. 13, 1967 (cited by [[w.anderson-confronting-the-color-line]], 488 n.18). Check: the day, by the note''s date. See [[cal.1967-04-04.king]]. Names: Bunche, King.'
      tags:
      - name:bunche-ralph-j
      - name:king-martin-luther-jr
- cite:
