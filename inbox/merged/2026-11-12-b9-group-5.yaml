      date: 1962-03
      thread: laos
      c: The Kennedy administration gives Thailand the pledge it had asked, to defend it unilaterally.
      n: '[[w.moyar-triumph-forsaken]], 162 ("in March"; not the day, the form or the signers). Check: the day. See [[cal.1962-02-27.laos]].'
