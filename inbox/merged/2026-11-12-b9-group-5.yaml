    item: '[[w.moyar-triumph-forsaken]], 144 (Kennedy, "at year''s end," approves Rusk''s and McNamara''s recommendation of limited defoliation, first the clearance of key routes, then crop destruction in areas the Viet Cong hold; not NSAM 115 by name or the procedure)'
    units: '?'
- add:
