- cite:
    id: cal.1962-02.laos
    item: '[[w.moyar-triumph-forsaken]], 162 (Kennedy, at Harriman''s recommendation, cuts aid to the royal Laotian government, and within a few weeks Phoumi agrees to a coalition under Souvanna; dated April; not Boun Oum, the payroll, the Chiefs or the CIA)'
    units: '?'
- check:
    id: cal.1962-02.laos
    text: 'Check: the month: [[w.moyar-triumph-forsaken]], 162, has Kennedy cut aid to the royal government "In April, at Harriman''s recommendation"; the entry has the money held back in February, by Kaplan; whether one act or two.'
- cite:
    id: cal.1962-05-06.laos
    item: '[[w.moyar-triumph-forsaken]], 162 (the attack on Nam Tha by several of the best Pathet Lao battalions and six North Vietnamese battalions, four thousand Chinese logistical troops supplying them; the 4,500 royalist soldiers flee in disarray; no day; not the Mekong)'
    units: '?'
- cite:
    id: cal.1961-08-17.berlin-and-vienna-2
    item: '[[w.robert-kennedy-in-his]], 275 (Kennedy of a White House meeting at which sending Johnson to Berlin and sending a regiment into Berlin were discussed, the President ordering the troops; not Lemnitzer, the Chiefs'' proposal or the advisers'' objection)'
    units: '?'
- check:
    id: cal.1961-08-17.berlin-and-vienna-2
    text: 'Check: the day: [[w.robert-kennedy-in-his]], 275, has the meeting "on, I think, Sunday morning" ("There hadn''t been any meeting on the Wall ... prior to that time"; "I think the Wall went up on a Friday, as I remember"); the entry has Aug. 17, a Thursday.'
- cite:
    id: cal.1961-08-19.berlin-and-vienna
    item: '[[w.robert-kennedy-in-his]], 276 (the troops reached Berlin "a Saturday or a Sunday"; the President "very relieved" when they got through; not Johnson, Clay or the 18th Infantry)'
    units: '?'
