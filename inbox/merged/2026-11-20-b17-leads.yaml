      c: Peking. Ung Văn Khiêm, the DRV's foreign minister, arrives at 3 p.m. from the Soviet Union, which he left on the 19th, by his word to Zhou the next day.
      n: '"[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Ung: "I set out from the Soviet Union on the 19th and arrived here in Beijing yesterday at 3 o''clock in the afternoon"; back from Geneva by way of several fraternal countries). Names: Ung Văn Khiêm, Zhou Enlai. Check: the year the Archive posted the document.'
      tags:
      - polity:drv
      - name:ung-van-khiem
      - name:zhou-enlai
