- add:
    entry:
      id: cal.1965.korea
      when: 1965, spring
      date: '1965'
      thread: korea
      also:
      - soviet-union
      - vietnam
      c: 'Kim Il Sung receives the Soviet ambassador, leaving for home, who asks his view of the Soviet Central Committee. Kim: support Vietnam more strongly, by deeds; cool relations with the United States; end interference in other parties, the Japanese first and the Indonesian second. So Kim tells Lê Thanh Nghị''s delegation in July.'
      n: '"[Lê Thanh Nghị, ''Report on Meetings with Party Leaders of Eight Socialist Countries''](https://digitalarchive.umd.edu/document/134601)" (1965), 8058 – "Báo cáo của Phó Thủ tướng Lê Thanh Nghị về việc gặp các đồng chí lãnh đạo của Đảng và Nhà nước 8 nước xã hội chủ nghĩa năm 1965," Phủ Thủ tướng, Vietnam National Archives Center 3 (Hanoi), trans. Merle Pribbenow, obtained by Pierre Asselin, Wilson Center Digital Archive (the section "People''s Democratic Republic of Korea," Kim''s point 7: "This spring, before leaving to go home, the previous Soviet ambassador came to see me"; the record names neither ambassador). Kim''s account: [[cal.1965-07.vietnam-hanoi-4]]. Names: Kim Il Sung. Check: the day. Check: the year the Archive posted the document.'
