ops:
- edit:
    id: cal.1961-08-13.soviet-union
    base: 613df5da
    set:
      c: 'The Albanian Party of Labor''s Central Committee cables the Vietnam Workers'' Party: it agrees to Hồ Chí Minh''s mediation with Moscow and will invite him to Tirana after mid-November, as Zhou tells Ung Văn Khiêm on Aug. 21, from what the Albanians had told China. Ung''s account in the same talk: Tirana''s reply to the Workers'' Party''s cable finds the Soviet attitude not Marxist-Leninist and the fault the Soviet Union''s, and asks Hồ to lead a party and government delegation to Albania in November.'
      n: '"[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou''s account: the telegram "was sent on the 13th"; "according to what the Albanian Party has made known to us". Ung''s account: when Hồ went to Moscow no reply had come, the DRV''s ambassador having called on Albania''s chargé d''affaires; "The next day, we finally received Tirana''s reply"). Names: Hồ Chí Minh, Zhou Enlai, Ung Văn Khiêm. Check: the day the reply reached the Vietnamese; Ung has it the day after Hồ went to Moscow, Zhou has Hồ see it on arriving, Aug. 14. Check: the year the Archive posted the document.'
- edit:
    id: cal.1961-08-14.vietnam-hanoi
    base: 454abfef
    set:
      c: 'Moscow. Hồ Chí Minh arrives, sees the Albanian Central Committee''s telegram and seeks out Albania''s envoy: he will go, and to Tirana first; the settlement lies with the Albanian side. So Zhou tells Ung Văn Khiêm on Aug. 21. Ung''s account in the same talk: Hồ asks Albania''s chargé d''affaires to his residence and tells him his purpose; he never meant to go to Tirana first.'
      n: '"[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou''s account: "Ho, arriving on the 14th in Moscow, saw this telegram, sought out Albania''s envoy". Ung''s account: "After receiving Albania''s telegram", Hồ asked the chargé d''affaires to his residence; his intent was to see Khrushchev first). See [[cal.1961-08-13.soviet-union]]. Names: Hồ Chí Minh, Zhou Enlai, Ung Văn Khiêm. Check: the day of the call on Albania''s envoy (the record''s 14th is the arrival''s). Check: the year the Archive posted the document.'
- edit:
    id: cal.1966-06-25.china-leadership-2
    base: 83eca8c3
    set:
      c: 'Zhou holds the second talks with Hoxha, Shehu and the other Albanian leaders at the Partisan Palace in Tirana. Hoxha''s exposé, by Zhou''s word of June 27 in the Albanian record: common enemies with Korea.'
      src:
        c: b23e5da0
        rows:
        - 'w.zhou-enlai-waijiao-huodong 498: A'
        - 'https://digitalarchive.umd.edu/document/300029: B'
      tags: [polity:prc, name:zhou-enlai, vis:only:prc+albania, polity:albania]
- edit:
    id: cal.1966-06-26.china-leadership-3
    base: 31946d84
    set:
      c: 'Zhou holds the third talks with Hoxha, Shehu and the other Albanian leaders at the Partisan Palace. Hoxha, by Zhou''s word of June 27 in the Albanian record: the draft fourth five-year plan goes to the Central Committee''s plenum, then to the masses for discussion, then to the Fifth Party Congress.'
      src:
        c: 64dd1681
        rows:
        - 'w.zhou-enlai-waijiao-huodong 499: A'
        - 'https://digitalarchive.umd.edu/document/300029: B'
      tags: [polity:prc, name:zhou-enlai, polity:albania, vis:only:prc+albania]
