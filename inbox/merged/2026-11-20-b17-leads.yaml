- add:
    entry:
      id: cal.1961-08-15.soviet-union
      when: Aug. 15
      date: '1961-08-15'
      thread: soviet-union
      also:
      - vietnam-hanoi
      c: 'The Albanian Party answers Hồ Chí Minh''s second cable. By Ung Văn Khiêm''s account to Zhou, Aug. 21, it repeats the invitation for November and suggests he first talk with the fraternal parties of Eastern Europe; by Zhou''s, in the same talk, from the Albanians, it cables in haste that it does not want him to come.'
      n: '"[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Ung: "The next day, the Albanian Party reiterated", the day after Hồ''s second cable; Zhou: Albania, "very nervous, quickly responded by telegram", Hồ "having received the second telegram" going to Sochi; the record names no place). See [[cal.1961-08-14.vietnam-hanoi-2]]. Names: Hồ Chí Minh, Ung Văn Khiêm, Zhou Enlai. Check: the day (Ung''s "the next day"). Check: the year the Archive posted the document.'
      tags:
      - polity:albania
      - polity:drv
      - name:ho-chi-minh
      - name:ung-van-khiem
      - name:zhou-enlai
      - vis:only:albania+drv
      - vis:from:prc:1961-08-21
- add:
