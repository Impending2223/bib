      c: Hồ Chí Minh goes from Moscow to Sochi to see Khrushchev, alone, to see him twice and stay five days, by Ung Văn Khiêm's account to Zhou, Aug. 21.
      n: '"[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Ung: "He went five days ago"; Hồ "went the next day to see Khrushchev", after the Albanians'' second answer; he would not have the ambassador or Ung go with him; Zhou: "He went to Sochi"). The Soviet record has the first talk at Pitsunda the next day. See [[cal.1961-08-15.soviet-union]]. Names: Hồ Chí Minh, Khrushchev, Ung Văn Khiêm, Zhou Enlai. Check: the year the Archive posted the document.'
      tags:
      - polity:drv
      - polity:ussr
      - name:ho-chi-minh
      - name:khrushchev-nikita-s
      - name:ung-van-khiem
      - name:zhou-enlai
