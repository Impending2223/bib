- add:
    entry:
      id: cal.1965.korea-2
      when: '1965'
      date: '1965'
      thread: korea
      also:
      - soviet-union
      - vietnam
      c: 'The new Soviet ambassador brings Kim Il Sung a letter from Brezhnev: his task is to strengthen relations, and the Soviets agree with what Kim told his predecessor. He speaks of active support for Vietnam, presents the list of Soviet military aid to it, speaks of cooler relations with the United States, and says relations with China are a big problem; he invites Kim to the Soviet Union. Kim: he will visit neither the Soviet Union nor China. So Kim tells Lê Thanh Nghị''s delegation in July.'
      n: '"[Lê Thanh Nghị, ''Report on Meetings with Party Leaders of Eight Socialist Countries''](https://digitalarchive.umd.edu/document/134601)" (1965), 8058 – "Báo cáo của Phó Thủ tướng Lê Thanh Nghị về việc gặp các đồng chí lãnh đạo của Đảng và Nhà nước 8 nước xã hội chủ nghĩa năm 1965," Phủ Thủ tướng, Vietnam National Archives Center 3 (Hanoi), trans. Merle Pribbenow, obtained by Pierre Asselin, Wilson Center Digital Archive (Kim''s point 7: "When the new Soviet ambassador arrived"; the letter does not name Kim''s three points; the ambassador then invites him to stop in the Soviet Union on his way to the Second Asian–African Conference, and Kim says, privately to the Vietnamese, that Choe Yong-geon will go). The talk with his predecessor, in the spring: [[cal.1965.korea]]. Kim''s account: [[cal.1965-07.vietnam-hanoi-4]]. Names: Kim Il Sung, Brezhnev. Check: the day; the record places the arrival after the spring talk only. Check: the year the Archive posted the document.'
