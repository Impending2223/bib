      c: 'Hanoi, the morning. Kosygin''s delegation and the DRV sign the accords on aid and other economic measures, by Kosygin''s account to Zhou in Peking that day: arms free of charge, loan repayments deferred and the interest, about 50 million new rubles, cancelled, six fishing ships with their gear and crews to instruct. The communiqué signed in Hanoi leaves the aid out.'
      n: '"[Record of the Fifth Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin (1)](https://digitalarchive.umd.edu/document/165487)" (Feb. 10, 1965), PRC FMA 109-03957-06, 121–135, trans. Stephen Mercado, Wilson Center Digital Archive (Kosygin: "This morning we signed all these accords"; of the communiqué "that we just signed over there", that "these issues are not written" in it, a political communiqué; the measures in the record''s summary and in the talk). See [[cal.1965-02-06.soviet-union]]. Names: Kosygin, Zhou Enlai. Check: whether the communiqué was signed at the same sitting. Check: the year the Archive posted the document.'
      tags:
      - polity:ussr
      - polity:drv
      - name:kosygin-aleksei
      - name:zhou-enlai
      - vis:only:ussr+drv
      - vis:from:prc:1965-02-10
      - ok:fields-place
- add:
    entry:
      id: cal.1965-03.soviet-union
      when: Mar.
      date: 1965-03
      thread: soviet-union
      also:
      - china
      c: 'The Soviet ambassador to France affirms that the Soviet Union is a European country. So Zhou tells Hồ Chí Minh, June 15, against the Soviet case for a seat at the Second Asian–African Conference.'
      n: '"[Record of Conversation between Premier Zhou Enlai and Chairman Ho Chi Minh](https://digitalarchive.umd.edu/document/165383)" (June 15, 1965), PRC FMA 106-00861-02, 11–22, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou: "In March this year, the Soviet ambassador to France affirmed that the Soviet Union is a European country"; the record names neither the ambassador nor the occasion). Names: Zhou Enlai, Hồ Chí Minh. Check: the day. Check: the year the Archive posted the document.'
      tags:
      - polity:ussr
      - name:zhou-enlai
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1965-03-03.soviet-union-2
      when: Mar. 3
      date: '1965-03-03'
      time_range:
      - 1965-03-03T03:00Z
      - 1965-03-03T09:00Z
      time_band: morning
      time_zone: Europe/Moscow
      place: moscow
      thread: soviet-union
      also:
      - vietnam
      c: 'Moscow, the morning. The Vietnamese students tell the Soviet central authorities of their plan for another demonstration against the bombing; the Soviets send them to the Foreign Ministry, which has not answered by the time of the Chinese embassy''s cable that day. By the embassy''s account, from the Vietnamese students.'
      n: '"[Cable from the Chinese Embassy in the Soviet Union to the Ministry of Foreign Affairs, ''Chinese Students Intending to Participate in the Demonstrations Organized by the Vietnamese Students''](https://digitalarchive.umd.edu/document/119953)" (Mar. 3, 1965), PRC FMA 109-03984-02, 1–2, obtained by You Lan, trans. Jake Tompkins, Wilson Center Digital Archive (the students say they reported it "to the Soviet central authorities this morning"; they will march the next day whether the Soviets agree or not). The cable: [[cal.1965-03-03.china]]. Check: the year the Archive posted the document.'
      tags:
      - polity:ussr
      - vis:only:ussr
      - vis:from:prc:1965-03-03
- add:
    entry:
      id: cal.1965-04.soviet-union
      when: Apr.
      date: 1965-04
      place: jakarta
      thread: soviet-union
      also:
      - indonesia
      - china
      c: 'Jakarta, the preparatory committee of the Second Asian–African Conference. Before its vote on Soviet participation, the Soviet side holds a ceremony giving ten ships to Indonesia; Subandrio attends it and leaves the committee, the Afghan representative acting as host. So Chen Yi tells Hồ Chí Minh, June 15.'
      n: '"[Record of Conversation between Premier Zhou Enlai and Chairman Ho Chi Minh](https://digitalarchive.umd.edu/document/165383)" (June 15, 1965), PRC FMA 106-00861-02, 11–22, trans. Stephen Mercado, Wilson Center Digital Archive (Chen Yi''s account, the Soviet side thinking the ships would "plug Indonesia''s mouth"; Zhou dates the preparatory conference "in April this year in Jakarta"). Names: Chen Yi, Subandrio, Hồ Chí Minh. Check: the day. Check: the year the Archive posted the document.'
      tags:
      - polity:ussr
      - polity:indonesia
      - name:chen-yi
      - name:subandrio
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1965-04.soviet-union-2
      when: Apr.
      date: 1965-04
      place: jakarta
      follows:
      - cal.1965-04.soviet-union
      thread: soviet-union
      also:
      - indonesia
      - china
      c: 'Jakarta. The preparatory committee of the Second Asian–African Conference reaches no agreement on Soviet participation, by Zhou''s account to Hồ Chí Minh, June 15; the Soviet participation stays refused, Chen Yi adds.'
      n: '"[Record of Conversation between Premier Zhou Enlai and Chairman Ho Chi Minh](https://digitalarchive.umd.edu/document/165383)" (June 15, 1965), PRC FMA 106-00861-02, 11–22, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou: "At the preparatory conference convened in April this year in Jakarta, there was no agreement on the issue of Soviet participation"; Chen Yi: after the ships'' ceremony "the issue of Soviet participation remains denied"). See [[cal.1965-04.soviet-union]]. Names: Zhou Enlai, Chen Yi, Hồ Chí Minh. Check: the day. Check: the year the Archive posted the document.'
      tags:
      - polity:ussr
      - name:zhou-enlai
      - name:chen-yi
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1965-05.south-asia
      when: May
      date: 1965-05
      thread: south-asia
      also:
      - china
      - soviet-union
      c: 'India seeks Soviet participation in the Second Asian–African Conference and argues it with China, "acting under the influence of the United States," by Zhou''s account to Hồ Chí Minh, June 15.'
      n: '"[Record of Conversation between Premier Zhou Enlai and Chairman Ho Chi Minh](https://digitalarchive.umd.edu/document/165383)" (June 15, 1965), PRC FMA 106-00861-02, 11–22, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou: "Recently, in May, India ... sought Soviet participation and argued with us"; India also "has put the Soviet Union and ''Malaysia'' together"; no day or place). Names: Zhou Enlai, Hồ Chí Minh. Check: the day. Check: the year the Archive posted the document.'
      tags:
      - polity:india
      - polity:prc
      - name:zhou-enlai
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1965-06.soviet-union
      when: June, during Zhou's visit to Tanzania
      date: 1965-06
      at: after 1965-06-04
      thread: soviet-union
      also:
      - africa
      - china
      c: Malik, visiting Nigeria, says that if anyone opposes Soviet participation in the Second Asian–African Conference, the Soviet Union will have to "strike back." So Zhou tells Hồ Chí Minh, June 15.
      n: '"[Record of Conversation between Premier Zhou Enlai and Chairman Ho Chi Minh](https://digitalarchive.umd.edu/document/165383)" (June 15, 1965), PRC FMA 106-00861-02, 11–22, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou: "Malik, visiting Nigeria while I was on my visit to Tanzania"; the record names no city). See [[cal.1965-06-04.china-leadership]]. Names: Zhou Enlai, Hồ Chí Minh. Check: which Malik; the record gives the surname only. Check: the day. Check: the year the Archive posted the document.'
      tags:
      - polity:ussr
      - name:zhou-enlai
      - name:ho-chi-minh
- add:
