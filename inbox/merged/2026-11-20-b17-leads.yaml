      c: Subandrio goes to Addis Ababa, to go on to Kenya and Morocco before Algiers, by Sabri's word to Zhou the next day.
      n: '"[Record of Conversation between Premier Zhou and Premier Sabry](https://digitalarchive.umd.edu/document/165427)" (June 19, 1965), PRC FMA 107-01081-05, trans. Stephen Mercado, Wilson Center Digital Archive (Sabri, asked whether Subandrio will pass through Cairo: "Yesterday he went to Addis Ababa"). Names: Subandrio, Sabri, Zhou Enlai. Check: whether the day is his departure or his arrival. Check: the year the Archive posted the document.'
