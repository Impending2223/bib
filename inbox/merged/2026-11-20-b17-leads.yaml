- add:
    entry:
      id: cal.1964-11.china-leadership-5
      when: Nov., at the October Revolution's anniversary
      date: 1964-11
      at: after 1964-11-05
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou, in the Soviet Union for the October Revolution's anniversary, asks Gromyko whether he remembers China's word in the Quemoy shelling of 1958, that China would not ask the Soviet Union to send troops if the United States made war on it. Gromyko does; Zhou says China holds to it. So Zhou tells Ben Bella, Mar. 31, 1965.
      n: '"[Record of the Second Meeting between Premier Zhou and President Ben Bella](https://digitalarchive.umd.edu/document/165405)" (Mar. 31, 1965), PRC FMA 203-00651-02, 55–85, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou: "when I went last year to the Soviet Union to participate in the October Revolution Day"; no day or place given). See [[cal.1964-11-05.china-leadership-5]]. Names: Zhou Enlai, Gromyko, Ben Bella. Check: the day. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:gromyko-andrei
      - name:ben-bella-ahmed
      - vis:only:prc+ussr
      - vis:from:algeria:1965-03-31
- add:
    entry:
      id: cal.1965-02.china-leadership-2
      when: Feb., Kosygin's passage through China
      date: 1965-02
      at: after 1965-02-05
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou, with Kosygin on his way through China to and from Vietnam, raises again China''s word: even if the United States strikes China, China will not ask the Soviet Union to take part in the war. So Zhou tells Ben Bella, Mar. 31.'
      n: '"[Record of the Second Meeting between Premier Zhou and President Ben Bella](https://digitalarchive.umd.edu/document/165405)" (Mar. 31, 1965), PRC FMA 203-00651-02, 55–85, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou: "In February this year, Kosygin visited Vietnam and Korea, stopping by China along the way. Once again I raised this matter"; no talk named). See [[cal.1964-11.china-leadership-5]]; the visit''s first talk, [[cal.1965-02-05.china-leadership]]. Names: Zhou Enlai, Kosygin, Ben Bella. Check: the day, and in which talk. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:kosygin-aleksei
      - name:ben-bella-ahmed
      - vis:only:prc+ussr
      - vis:from:algeria:1965-03-31
