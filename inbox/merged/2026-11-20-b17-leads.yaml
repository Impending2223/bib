      c: 'Moscow. Hồ Chí Minh, after calling in Albania''s chargé d''affaires, cables the Albanian Party again: may he go to Tirana? So Ung Văn Khiêm tells Zhou, Aug. 21.'
      n: '"[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Ung''s account: "Chairman Ho wrote another telegram", after the chargé''s call; the day by Ung''s sequence: the Albanian answer "the next day", Hồ''s going to Khrushchev the day after it, "five days ago" on Aug. 21). See [[cal.1961-08-14.vietnam-hanoi]]. Names: Hồ Chí Minh, Ung Văn Khiêm, Zhou Enlai. Check: the year the Archive posted the document.'
      tags:
      - polity:drv
