      - name:taft-robert-jr
      - name:lindsay-john-v
      - name:hatfield-mark-o
      - name:reagan-ronald
      - name:percy-charles-h
- add:
    entry:
      id: cal.1965-09-29.opinion
      when: Sept. 29
      date: '1965-09-29'
      thread: opinion
      also:
      - jobs-and-wages
      c: 'Gallup, Aug. 27–Sept. 1: the $1.25 minimum wage: increase 55 percent, leave as is 39. Of those for an increase, about $1.50, 53; $1.75, 21; $2.00, 11. Manual workers 69 for an increase, farmers
        32.'
      n: '*The Gallup Poll*, III, 1963 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-10-08.opinion
      when: Oct. 8
      date: '1965-10-08'
      thread: opinion
      also:
      - welfare
      - poverty
      c: 'Gallup, Sept. 16–21: a guaranteed minimum annual income for every family in place of relief and welfare: favor 19 percent, oppose 67.'
      n: '*The Gallup Poll*, III, 1965 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-10-10.opinion
      when: Oct. 10
      date: '1965-10-10'
      thread: opinion
      also:
      - jobs-and-wages
      c: 'Gallup, Sept. 16–21: a worker in a unionized plant required to join the union: should 44 percent, should not 47. South 34 should, 54 not; East 52 and 39; college-educated 22 and 71.'
      n: '*The Gallup Poll*, III, 1965–66 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-10-13.opinion
      when: Oct. 13
      date: '1965-10-13'
      thread: opinion
      c: 'Gallup, Sept. 16–21: the most important problem: civil rights 27 percent; Vietnam 19; threat of general war 17; prestige abroad 7; world communism 6; cost of living 5; poverty 3.'
      n: '*The Gallup Poll*, III, 1966 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-10-22.opinion
      when: Oct. 22
      date: '1965-10-22'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Sept. 16–21: the Johnson Administration''s handling of Vietnam: approve 58 percent, disapprove 22.'
      n: '*The Gallup Poll*, III, 1967 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-10-27.opinion
      when: Oct. 27
      date: '1965-10-27'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Sept. 16–21: Humphrey 43 percent, Romney 43; Johnson 59, Romney 33. Independents: Romney 50, Humphrey 26; Johnson 50, Romney 37.'
      n: '*The Gallup Poll*, III, 1967 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Humphrey (K–J Cong. III.A); Romney (Opp. III.H).'
      tags:
