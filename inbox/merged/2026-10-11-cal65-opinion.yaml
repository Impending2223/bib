      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Oct. 29–Nov. 2: a candidate for Congress for sending many more men to Vietnam: more inclined 46 percent, less 31. For a compromise peace: more 66, less 20. Should have become involved,
        64; not, 21. How the war will end: stalemate like Korea 30; American victory 29; long conflict 10; world war 4.'
      n: '*The Gallup Poll*, III, 1971–72 (K–J Cong. II.E).'
