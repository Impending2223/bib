      c: 'Gallup, Oct. 29–Nov. 2: Senator Robert Kennedy as capable as his brother was as a Senator: yes 38 percent, no 44. Wants to be President, 74. Will win the nomination: yes 55, no 33. Would like
        to see him President: yes 40, no 46; Democrats 56, independents 30, Republicans 20.'
      n: '*The Gallup Poll*, III, 1972–73 (K–J Cong. II.E). Names: Robert Kennedy (K–J Adm. III.A).'
      tags:
