      - name:percy-charles-h
      - name:hatfield-mark-o
- add:
    entry:
      id: cal.1965-04-02.opinion
      when: Apr. 2
      date: '1965-04-02'
      thread: opinion
      also:
      - foreign-aid
      c: 'Gallup, Feb. 19–24: foreign aid in general: for 57 percent, against 33. Johnson''s $3.4 billion for aid: decreased 49, kept the same 33, increased 6.'
      n: '*The Gallup Poll*, III, 1932 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-04-07.opinion
      when: Apr. 7
      date: '1965-04-07'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Mar. 11–16: start peace negotiations with the Communist leaders now, 41 percent; send more troops and airplanes to strengthen our position, 42; no opinion 17.'
      n: '*The Gallup Poll*, III, 1932–33 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-04-11.opinion
      when: Apr. 11
      date: '1965-04-11'
      thread: opinion
      also:
      - civil-rights-the-executive
      c: 'Gallup, Mar. 18–23: the Johnson Administration pushing integration too fast, 34 percent; not fast enough, 17; about right, 38. Southern whites 67 too fast; whites outside the South 28. Clergymen
        of one''s own church in civil rights protest marches: approve 32, disapprove 56; Protestants 29 approve, Catholics 40.'
      n: '*The Gallup Poll*, III, 1933 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-04-14.opinion
      when: Apr. 14
      date: '1965-04-14'
      thread: opinion
      also:
      - voting-rights
      c: 'Gallup, Mar. 18–23: a law to send federal officials to register voters where turnout was low: favor 76 percent, oppose 16. Southern whites 49 favor, 37 oppose. Republicans 72 favor; Democrats
        80; independents 70.'
      n: '*The Gallup Poll*, III, 1933–34 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-04-16.opinion
      when: Apr. 16
      date: '1965-04-16'
      thread: opinion
      c: 'Gallup, Mar. 18–23: the most important problem: civil rights 52 percent; foreign affairs 39; immorality, crime, delinquency 4; cost of living 3; unemployment 2.'
      n: '*The Gallup Poll*, III, 1934 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-04-23.opinion
      when: Apr. 23
      date: '1965-04-23'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Apr. 2–7: what to do next in Vietnam: withdraw completely 17 percent; negotiate, stop fighting 12; continue present policy 14; step up military activity 12; go all out, declare war 19;
        no opinion 28. Handling Vietnam as well as could be expected, 55; badly, 26.'
      n: '*The Gallup Poll*, III, 1934–35 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-05-07.opinion
      when: May 7
      date: '1965-05-07'
      thread: opinion
      also:
      - students
      c: 'Gallup, special survey of students at 97 four-year colleges: continue the draft, or depend on volunteers. Men: continue 61 percent, volunteers 37. Women: 76 and 20.'
      n: '*The Gallup Poll*, III, 1938–39 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-05-09.opinion
      when: May 9
      date: '1965-05-09'
      thread: opinion
      c: 'Gallup, Apr. 2–7: the domestic problems the Government should attend to most, three chosen from ten: public education 45 percent; crime 41; killer diseases 37; unemployment 35; poor areas 32;
        racial discrimination 29; housing and slums 21; highway safety 18; pollution of air and water 17; beautifying America 3.'
      n: '*The Gallup Poll*, III, 1939 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-05-12.opinion
      when: May 12
      date: '1965-05-12'
      thread: opinion
      also:
      - civil-rights-the-executive
      c: 'Gallup, Apr. 2–7: the Johnson Administration pushing integration too fast, 45 percent; not fast enough, 14; about right, 32. Southern whites 70 too fast; whites outside the South 41.'
      n: '*The Gallup Poll*, III, 1939 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-05-16.opinion
      when: May 16
      date: '1965-05-16'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Apr. 23–28: what to do next in Vietnam: withdraw 13 percent; negotiate 12; continue 13; step up 8; go all out 15; others, no opinion 39. Handling South Vietnam as well as could be expected,
        52; badly, 27. Should have become involved, 52; not, 26. The bombing of North Vietnam: stop 21, continue 59.'
      n: '*The Gallup Poll*, III, 1939–40 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-05-23.opinion
      when: May 23
      date: '1965-05-23'
      thread: opinion
      also:
      - desegregation-schools
      c: 'Gallup, Apr. 23–28: white parents who would object to a school where a few of the children are colored: outside the South 7 percent, South 37; where half are, 28 and 68; where more than half are,
        52 and 78.'
      n: '*The Gallup Poll*, III, 1940–41 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-06-02.opinion
      when: June 2
      date: '1965-06-02'
      thread: opinion
      also:
      - latin-america
      c: 'Gallup, May 13–18: Johnson''s sending troops into the Dominican Republic: approve 76 percent, disapprove 17. The troops likely to stay a year or two, 41; out soon, 24.'
      n: '*The Gallup Poll*, III, 1942–43 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-06-11.opinion
      when: June 11
      date: '1965-06-11'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, May 13–18: the most important problem: Vietnam 23 percent; civil rights 23; threat of war 16; prestige abroad 9; world communism 9; the Dominican Republic 4; cost of living 4.'
      n: '*The Gallup Poll*, III, 1944 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-06-13.opinion
      when: June 13
      date: '1965-06-13'
      thread: opinion
      also:
      - jobs-and-wages
      c: 'Gallup, May 13–18: a worker in a unionized plant required to join the union: should 43 percent, should not 49; union members 66 and 30. Approve of labor unions, 70. Unions have too much power:
        agree 57; big business has: agree 54.'
      n: '*The Gallup Poll*, III, 1944 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-06-27.opinion
      when: June 27
      date: '1965-06-27'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, June 4–9: Republicans'' best candidate for 1968: Nixon 25, Lodge 14, Goldwater 13, Romney 11, Dirksen 7, Scranton 7, Rockefeller 6, Lindsay 5, Taft 3, Reagan 3, Hatfield 2, Percy 1. Independents:
        Lodge 20, Nixon 14, Romney 12, Goldwater 11, Scranton 9.'
      n: '*The Gallup Poll*, III, 1946 (K–J Cong. II.E). Names: Lodge (K–J Adm. III.E); Dirksen (K–J Cong. III.A); Nixon (Opp. III.E); Goldwater, Hatfield, Percy (Opp. III.B); Lindsay (Opp. III.D); Reagan
        (Opp. III.F); Romney, Scranton, Rockefeller (Opp. III.H).'
      tags:
      - name:nixon-richard-m
      - name:lodge-henry-cabot
      - name:goldwater-barry-m
      - name:romney-george-w
      - name:dirksen-everett
      - name:scranton-william-w
      - name:rockefeller-nelson
      - name:lindsay-john-v
      - name:taft-robert-jr
      - name:reagan-ronald
      - name:hatfield-mark-o
      - name:percy-charles-h
- add:
    entry:
      id: cal.1965-07-18.opinion
      when: July 18
      date: '1965-07-18'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, June 24–29: those approving the Administration''s handling of Vietnam: Johnson knows the situation 40 percent; contain communism 24; we are committed 14. Those disapproving: none of our
        business 23; be more aggressive 18; too many boys killed 18. If South Vietnam stops fighting: the United States to go on alone 19, withdraw 65.'
      n: '*The Gallup Poll*, III, 1951 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-07-25.opinion
      when: July 25
      date: '1965-07-25'
      thread: opinion
      also:
      - immigration
      c: 'Gallup, June 24–29: in admitting immigrants, very important: occupational skills 71 percent; relatives who are citizens 55; country of birth 33. Immigration kept at its present level 39, decreased
        33, increased 8. Admit those who escape communism, 64. Admission by skills instead of the quotas: favor 51, oppose 32.'
      n: '*The Gallup Poll*, III, 1952–53 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-08-06.opinion
      when: Aug. 6
      date: '1965-08-06'
      thread: opinion
      also:
      - civil-rights-the-executive
      c: 'Gallup, July 16–21: the Johnson Administration pushing integration too fast, 40 percent; not fast enough, 13; about right, 38. Southern whites 69 too fast; whites outside the South 36. Republicans
        46 too fast; Democrats 35; independents 43.'
      n: '*The Gallup Poll*, III, 1955–56 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-08-22.opinion
      when: Aug. 22
      date: '1965-08-22'
      thread: opinion
      c: 'Gallup, July 16–21: would vote for a well-qualified man of one''s party for President who was a Jew, 80 percent; a Catholic, 87; a Negro, 59 (no, 34).'
      n: '*The Gallup Poll*, III, 1958 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-08-25.opinion
      when: Aug. 25
      date: '1965-08-25'
      thread: opinion
      also:
      - voting-rights
      c: 'Gallup, July 16–21: persons of 18, 19 and 20 permitted to vote: yes 57 percent, no 39.'
      n: '*The Gallup Poll*, III, 1958 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-08-29.opinion
      when: Aug. 29
      date: '1965-08-29'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Aug. 5–10: the move to ask the UN to work out its own formula for peace in Vietnam: approve 74 percent, disapprove 13; Democrats 77, Republicans 71. How the war will end: most often, a
        compromise like Korea.'
      n: '*The Gallup Poll*, III, 1958–59 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-09-12.opinion
      when: Sept. 12
      date: '1965-09-12'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Aug. 27–Sept. 1, South only: Johnson 44 percent, Nixon 47. The Johnson Administration pushing integration too fast: Southern whites 69, whites outside the South 36.'
      n: '*The Gallup Poll*, III, 1961 (K–J Cong. II.E). The integration figures are those printed for July 16–21 ([[cal.1965-08-06.opinion]]). Check. Names: Johnson (K–J Adm. III.D); Nixon (Opp. III.E).'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1965-09-17.opinion
      when: Sept. 17
      date: '1965-09-17'
      thread: opinion
      c: 'Gallup, Aug. 27–Sept. 1, whites: advice to Negroes seeking better jobs and respect: more education 44 percent; work harder 19; be law-abiding, earn respect 15; be less aggressive, go slower 14;
        stop riots and civil rights activities 12.'
      n: '*The Gallup Poll*, III, 1961 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-09-22.opinion
      when: Sept. 22
      date: '1965-09-22'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Aug. 27–Sept. 1: a candidate for Congress for sending a great many more men to Vietnam: more inclined to vote for him 33 percent, less 38. For trying harder for a compromise peace: more
        inclined 68, less 14. Republicans and Democrats alike.'
      n: '*The Gallup Poll*, III, 1962 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-09-26.opinion
      when: Sept. 26
      date: '1965-09-26'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Aug. 27–Sept. 1: Republicans'' first choice for 1968: Nixon 28, Romney 15, Lodge 12, Goldwater 9, Scranton 8, Rockefeller 7, Dirksen 5, Taft 3, Lindsay 3, Hatfield 2, Reagan 2, Percy 1.
        Know something about: Nixon 79, Goldwater 75, Lodge 68, Rockefeller 68, Romney 48, Reagan 46.'
      n: '*The Gallup Poll*, III, 1963 (K–J Cong. II.E). Names: Lodge (K–J Adm. III.E); Dirksen (K–J Cong. III.A); Nixon (Opp. III.E); Goldwater, Hatfield, Percy (Opp. III.B); Lindsay (Opp. III.D); Reagan
        (Opp. III.F); Romney, Scranton, Rockefeller (Opp. III.H).'
      tags:
      - name:nixon-richard-m
      - name:romney-george-w
      - name:lodge-henry-cabot
      - name:goldwater-barry-m
      - name:scranton-william-w
