patch: cal65-opinion
by: Claude (Gallup, *The Gallup Poll*, III, read off the page images)
ops:
- add:
    entry:
      id: cal.1965-01-03.opinion
      when: Jan. 3
      date: '1965-01-03'
      thread: opinion
      also:
      - medicare
      c: 'Gallup, Dec. 11–16, 1964: a compulsory program of hospital and nursing home insurance for the elderly, paid for by higher Social Security taxes: approve 63 percent, disapprove 28. Know why the
        American Medical Association opposes it: 52.'
      n: '*The Gallup Poll*, III, 1915 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-01-10.opinion
      when: Jan. 10
      date: '1965-01-10'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Dec. 11–16, 1964: Republicans'' first choice to lead the party: Nixon 27, Lodge 18, Goldwater 15, Romney 14, Scranton 8, Rockefeller 6, Taft 4, Hatfield 3, Percy 2. Independents: Lodge
        21, Romney 19, Nixon 18, Goldwater 14. Nov. 20–25, 1964: Romney over Goldwater for the leadership, 51 to 34.'
      n: '*The Gallup Poll*, III, 1916–17 (K–J Cong. II.E). Names: Lodge (K–J Adm. III.E); Nixon (Opp. III.E); Goldwater, Hatfield, Percy (Opp. III.B); Romney, Scranton, Rockefeller (Opp. III.H).'
      tags:
      - name:nixon-richard-m
      - name:lodge-henry-cabot
      - name:goldwater-barry-m
      - name:romney-george-w
      - name:scranton-william-w
      - name:rockefeller-nelson
      - name:taft-robert-jr
      - name:hatfield-mark-o
      - name:percy-charles-h
- add:
    entry:
      id: cal.1965-01-15.opinion
      when: Jan. 15
      date: '1965-01-15'
      thread: opinion
      c: 'Gallup, special mail survey of 1,395 Republican county chairmen: Burch to stay as national chairman, 46 percent; to go, 43. South 66 stay; West 53; Midwest 43; East 26 stay, 63 go.'
      n: '*The Gallup Poll*, III, 1917–18 (K–J Cong. II.E). Names: Burch (Opp. III.E).'
      tags:
      - name:burch-dean
- add:
    entry:
      id: cal.1965-01-17.opinion
      when: Jan. 17
      date: '1965-01-17'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, the same county chairmen, their own first choice to lead the party: Nixon 29, Goldwater 28, Scranton 13, Romney 11, Hatfield 5, Taft 3, Percy 3, Rockefeller 3, Lodge 2. The strongest candidate
        if the election were held now: Nixon 47, Romney 18, Scranton 11, Goldwater 8.'
      n: '*The Gallup Poll*, III, 1918 (K–J Cong. II.E). Names: Lodge (K–J Adm. III.E); Nixon (Opp. III.E); Goldwater, Hatfield, Percy (Opp. III.B); Scranton, Romney, Rockefeller (Opp. III.H).'
      tags:
      - name:nixon-richard-m
      - name:goldwater-barry-m
      - name:scranton-william-w
      - name:romney-george-w
      - name:hatfield-mark-o
      - name:taft-robert-jr
      - name:percy-charles-h
      - name:rockefeller-nelson
      - name:lodge-henry-cabot
- add:
    entry:
      id: cal.1965-01-31.opinion
      when: Jan. 31
      date: '1965-01-31'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Jan. 7–12: the United States should have become involved with its military forces in Southeast Asia, 50 percent; should not, 28. Johnson to call a conference with the leaders of Southeast
        Asia and China to seek a peace agreement: favor 81, oppose 11.'
      n: '*The Gallup Poll*, III, 1921–22 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-07.opinion
      when: Feb. 7
      date: '1965-02-07'
      thread: opinion
      also:
      - crime-and-hijacking
      c: 'Gallup, Jan. 7–12: a police permit required to buy a gun: favor 73 percent, oppose 23. A gun in the home: 48.'
      n: '*The Gallup Poll*, III, 1922–23 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-02-16.opinion
      when: Feb. 16
      date: '1965-02-16'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, special survey, no field dates printed: have heard of the recent developments in Vietnam, 91 percent. Of them, the action taken by the United States in the last few days: approve 67, disapprove
        15. Continue present efforts in South Vietnam, 64; pull out, 18. Continue at the risk of nuclear war, 31; not, 21.'
      n: '*The Gallup Poll*, III, 1925 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-02-17.opinion
      when: Feb. 17
      date: '1965-02-17'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, special survey: Vietnam likely to lead to a bigger war, 45 percent; not, 44. The United States handling South Vietnam as well as could be expected, 62; badly, 22. A UN army to deal with
        Southeast Asia and Vietnam: approve 60, disapprove 20.'
      n: '*The Gallup Poll*, III, 1925 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-02-21.opinion
      when: Feb. 21
      date: '1965-02-21'
      thread: opinion
      c: 'Gallup, Jan. 28–Feb. 2: liked best about Johnson: personality, character, 17 percent; experience, ability, 17; the war on poverty 8; cares for the working man 6; Medicare 6; civil rights 5; continuing
        Kennedy''s policies 5. Liked least: too much a politician 7; dull 7; civil rights 7; foreign policy 4; spending 4.'
      n: '*The Gallup Poll*, III, 1925–26 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-03-05.opinion
      when: Mar. 5
      date: '1965-03-05'
      thread: opinion
      also:
      - poverty
      c: 'Gallup, Jan. 28–Feb. 2: pay in the Neighborhood Youth Corps set by each community, 54 percent; the federal minimum of $1.25 required, 38. The pay for part-time work: $1.00 or less, 41; more, 46.
        South 54 for $1.00 or less.'
      n: '*The Gallup Poll*, III, 1927–28 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-03-07.opinion
      when: Mar. 7
      date: '1965-03-07'
      thread: opinion
      also:
      - school-aid
      c: 'Gallup, Jan. 28–Feb. 2: the Federal Government to pay more of the public schools'' costs, 49 percent; the States and localities as now, 42. The money to public schools only, 41; to Catholic and
        other private schools as well, 51.'
      n: '*The Gallup Poll*, III, 1928 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1965-03-12.opinion
      when: Mar. 12
      date: '1965-03-12'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Feb. 19–24: continue present efforts in South Vietnam, 66 percent; pull out, 19. A bigger war: likely 44, not 43. A conference called by Johnson with the leaders of Southeast Asia and
        China: yes 81, no 11.'
      n: '*The Gallup Poll*, III, 1929 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-03-24.opinion
      when: Mar. 24
      date: '1965-03-24'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Feb. 19–24: Republicans'' choice to lead the party: Nixon 36, Lodge 16, Romney 14, Goldwater 11, Scranton 8, Rockefeller 4, Taft 4, Percy 2, Hatfield 2. Independents: Nixon 29, Lodge 18,
        Romney 14, Goldwater 10, Scranton 7, Rockefeller 7.'
      n: '*The Gallup Poll*, III, 1930 (K–J Cong. II.E). Names: Lodge (K–J Adm. III.E); Nixon (Opp. III.E); Goldwater, Percy, Hatfield (Opp. III.B); Romney, Scranton, Rockefeller (Opp. III.H).'
      tags:
      - name:nixon-richard-m
      - name:lodge-henry-cabot
