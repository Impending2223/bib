      when: Mar. 14
      date: '1965-03-14'
      thread: vietnam-air-war
      c: 'Rolling Thunder VI, put off by weather to Mar. 13, then by Kỳ, his pilots "not in operational posture," flown Mar.
        14: the American primary target weathered out, the Americans only support the VNAF''s strikes.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 231. To check: JCS 7025 to CINCPAC, Mar. 13, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
