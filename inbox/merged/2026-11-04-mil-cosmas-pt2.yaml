        approve in advance within the limits set above him. By the month's end, three of the four increments done.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 210. To check: JCS 3995 to CINCPAC and COMUSMACV, Jan. 21, 1965 (cited
