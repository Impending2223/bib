      when: Mar. 3
      date: '1966-03-03'
      thread: vietnam-air-war
      c: Vance grants the Joint Chiefs execution authority for all B-52 strikes in South Vietnam, as they asked Jan. 22; strikes
        risking a border violation or noncombatants' deaths still to go to State. Mar. 15, the Chiefs delegate approval jointly
        to CINCPAC and CINCSAC.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 466. To check: Vance to the Chairman, JCS, Mar. 3, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        466 n.2); JCS 6125 to CINCPAC and CINCSAC, Mar. 15, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 466 n.2).
        See [[cal.1965-06-18.vietnam]]. Names: Vance.'
