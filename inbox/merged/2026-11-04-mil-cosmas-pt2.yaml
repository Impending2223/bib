      also:
      - vietnam-air-war
      c: 'McNamara to CINCPAC: "cutting pattern to cloth" does not mean curtailing necessary operations against future shortages
        of munitions.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 498. To check: DEF 8126 to CINCPAC, Apr. 9, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
