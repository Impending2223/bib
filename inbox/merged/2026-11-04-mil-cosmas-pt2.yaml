      when: July 20
      date: '1966-07-20'
      thread: vietnam-force-levels
      c: The United States and the Philippines sign a military working arrangement putting the Philippine Civic Action Group
        under a Philippine commander.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 436. See [[cal.1966-06-05.vietnam-force-levels]].'
