      when: Feb. 26–27
      date: '1965-02-26'
      thread: vietnam-air-war
      c: 'Rolling Thunder III and IV called off for bad weather, Feb. 26 and 27. Feb. 26, the Joint Chiefs authorize for planning
        reconnaissance for the program, Blue Tree: medium-level, six aircraft at a time, chiefly along the North''s main routes.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 227. To check: JCS 5959 to CINCPAC, Feb. 26, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
