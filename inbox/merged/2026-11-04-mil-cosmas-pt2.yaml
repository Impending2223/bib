    entry:
      id: cal.1965-03-01.vietnam-air-war-2
      when: Mar. 1
      date: '1965-03-01'
      thread: vietnam-air-war
      c: 'The Joint Chiefs issue the execute order for the first Rolling Thunder strike actually flown, RT V, held from Mar.
        1 so as not to coincide with the Communist conference opening in Moscow: daylight, Mar. 2, "if, but only if, US and
        VNAF primary targets can both be struck"; the Americans on the Xóm Bàng ammunition depot, the VNAF on the Quảng Khê
        naval base. No reconnaissance over the targets before the raids.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 227. To check: JCS 6071 to CINCPAC, Feb. 28, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        227 n.17). See [[cal.1965-02-13.vietnam]].'
