      date: '1966-04-14'
      thread: defense
      also:
      - vietnam-air-war
      c: 'The Joint Chiefs give CINCPAC full authority to assign nonnuclear air munitions among his component commanders,
        the allies and CINCSAC''s B-52s: to set stock levels and consumption rates and fit tasks to them.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 499. To check: JCS 8558 to CINCPAC, CINCSAC, Apr. 14, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        499 n.27). See [[cal.1966-04-03.defense]].'
