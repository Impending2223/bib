      id: cal.1966-09-03.vietnam-air-war-2
      when: Sept. 3
      date: '1966-09-03'
      thread: vietnam-air-war
      c: The Joint Chiefs approve for planning 800 Arc Light sorties a month from Jan. 1, 1967, as Westmoreland and Sharp
        urge. Bomb production delays hold it at 600 to Feb. 1.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 469. To check: JCS 1805 to CINCSAC and CINCPAC, Sept. 3, 1966 (cited by
        [[w.cosmas-joint-chiefs-of-staff-2012]], 469 n.14). See [[cal.1965-06-18.vietnam]]. Names: Westmoreland, Sharp.'
