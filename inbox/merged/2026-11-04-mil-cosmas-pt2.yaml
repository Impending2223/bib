      thread: vietnam-operations
      c: Night leaflet drops against the North Vietnamese in Cambodia authorized, the leaflets released over South Vietnam
        for the wind to carry across, not over Cambodia as Westmoreland, Lodge and Sharp asked. June 6, extended to a wider
        area, the release still over the South.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 476. To check: Joint State-Defense-USIA message, State 3641 to Saigon and
        CINCPAC, May 26, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 476 n.38); Joint State-Defense-USIA message,
