patch: mil-cosmas-pt2
by: 'Claude (the military re-read: Cosmas, The Joint Chiefs of Staff and the War in Vietnam, 1960-1968, pt. 2, 2012), Nov.
  5, 2026'
ops:
- add:
    entry:
      id: cal.1964-03-06.vietnam-34a
      when: Mar. 6
      date: '1964-03-06'
      thread: vietnam-34a
      c: Honolulu, CINCPAC's headquarters. McNamara and Taylor, with Sullivan and William Bundy, on the way to Saigon. Felt
        agrees with the Joint Chiefs' proposals of Mar. 2 but the blockade. A briefing on OPLAN 34A, its failures to date.
        McNamara directs CINCPAC to begin training South Vietnamese pilots in aerial mine-laying at once.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 32. To check: JCS 2343/341, Mar. 10, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        32 n.15). Names: McNamara, Taylor, Sullivan, William Bundy, Felt.'
      src:
        c: 010514f3
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 32: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 32 n.15: all'
      tags:
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:sullivan-william-h
      - name:bundy-william
      - name:felt-harry-d
- add:
    entry:
      id: cal.1964-03-18.vietnam-air-war
      when: Mar. 18
      date: '1964-03-18'
      thread: vietnam-air-war
      c: 'The Joint Chiefs direct CINCPAC to draw into one operation plan the actions of Recommendation 12 of NSAM 288: border
        control, retaliation and graduated overt pressure on the North, "to permit sequential implementation as may be desired
        by higher authority."'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 44. To check: JCS 5390 to CINCPAC, Mar. 18, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        44 n.50). See [[cal.1964-03-17.vietnam]].'
      src:
        c: 0c0de473
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 44: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 44 n.50: all'
- add:
    entry:
      id: cal.1964-03-30.vietnam-air-war
      when: Mar. 30
      date: '1964-03-30'
      thread: vietnam-air-war
      c: 'Felt submits CINCPAC OPLAN 37-64, "Military Actions to Stabilize the Situation in RVN": South Vietnamese border
        control in Laos and Cambodia and South Vietnamese retaliation on the North on 72 hours'' notice, American and South
        Vietnamese pressure on the North on 30 days''; the northern ports mined from the air by the VNAF; air attacks by the
        VNAF and Farm Gate, reinforced by two B-57 squadrons.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 45. To check: CINCPAC OPLAN 37-64, "Military Actions to Stabilize the Situation
        in RVN," Mar. 30, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 45 n.53). See [[cal.1964-03-18.vietnam-air-war]].
        Names: Felt.'
      src:
        c: e5452dce
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 45: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 45 n.53: all'
      tags:
      - name:felt-harry-d
- add:
    entry:
      id: cal.1964-05-05.laos
      when: May 5
      date: '1964-05-05'
      thread: laos
      c: The Joint Chiefs authorize CINCPAC and COMUSMACV to plan with the South Vietnamese the covert reconnaissance patrols
        into Laos that Taylor outlined.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 43. To check: JCS 6163 to CINCPAC, May 5, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        43 n.44). Names: Taylor.'
      src:
        c: 853c73ea
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 43: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 43 n.44: all'
      tags:
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1964-05-11.laos
      when: May 11
      date: '1964-05-11'
      thread: laos
      c: 'Harkins gets Khánh''s agreement to the patrols into Laos: South Vietnamese Special Forces, trained and advised by
        the American, in six-man teams out of uniform, put in and taken out by air, fighting only in self-defense. Later set:
        June 15 to begin, four teams.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 43. To check: MAC 2310 to JCS, May 12, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        43 n.44). See [[cal.1964-05-05.laos]]. Names: Harkins, Nguyễn Khánh.'
      src:
        c: 1e034fb2
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 43: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 43 n.44: all'
      tags:
      - name:harkins-paul-d
      - name:nguyen-khanh
- add:
    entry:
      id: cal.1964-05-13.laos
      when: May 13
      date: '1964-05-13'
      thread: laos
      c: 'Saigon. Harkins briefs McNamara on the reconnaissance into Laos. McNamara: the patrols to find all they can of Hanoi''s
        help to the Viet Cong; the teams to double every 30 days, eight ready by July 15.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 43. Check: the day; Cosmas has "During his mid-May visit." To check: COMUSMACV
        J1 3849 to CINCPAC, 140330Z May 64 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 43 n.45). See [[cal.1964-05-05.laos]].
        Names: Harkins, McNamara.'
      src:
        c: c49f54db
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 43: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 43 n.45: all'
      tags:
      - name:harkins-paul-d
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-06-08.laos-2
      when: June 8
      date: '1964-06-08'
      thread: laos
      c: On orders from Washington, CINCPAC moves eight F-100s from Takhli, Thailand, to Tân Sơn Nhứt.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 78. To check: NMCC OPSUM 55-64, June 9, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        78 n.34). See [[cal.1964-06-06.laos]].'
      src:
        c: 83108c9b
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 78: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 78 n.34: all'
      tags:
      - place:tan-son-nhut
- add:
    entry:
      id: cal.1964-06-13.laos-2
      when: June 13
      date: '1964-06-13'
      thread: laos
      c: The Air Force moves the eight F-100s from Tân Sơn Nhứt to Đà Nẵng, to fly escort over Laos as needed.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 78. To check: DJSM-1011-64 to CJCS, June 17, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        78 n.34). See [[cal.1964-06-06.laos]].'
      src:
        c: 809f5197
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 78: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 78 n.34: all'
      tags:
      - place:da-nang
- add:
    entry:
      id: cal.1964-06-30.defense
      when: June 30
      date: '1964-06-30'
      thread: defense
      c: Felt steps down as Commander in Chief, Pacific. Sharp, from the Pacific Fleet, succeeds him.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 83. Names: Felt, Sharp.'
      src:
        c: 4ed2d900
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 83: all'
      tags:
      - name:felt-harry-d
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-07-03.defense
      when: July 3
      date: '1964-07-03'
      thread: defense
      c: Wheeler takes up the chairmanship of the Joint Chiefs from Taylor, gone to Saigon. Harold K. Johnson succeeds him
        as Army Chief of Staff.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 83. Names: Wheeler, Taylor, Harold K. Johnson.'
      src:
        c: bb4bba55
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 83: all'
      tags:
      - name:wheeler-earle
      - name:taylor-maxwell
      - name:johnson-harold-k
- add:
    entry:
      id: cal.1964-07-20.vietnam-force-levels
      when: July 20
      date: '1964-07-20'
      thread: vietnam-force-levels
      c: New Zealand sends a military engineer team and a surgical team to South Vietnam, for civic action.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 97. To check: MACV Command History, 1965, p. 71 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        97 n.44).'
      src:
        c: ad913bb6
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 97: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 97 n.44: all'
- add:
    entry:
      id: cal.1964-08-04.vietnam-tonkin
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-tonkin
      c: Under four hours after the Pierce Arrow order, the Joint Chiefs direct CINCPAC, CINCSTRIKE and CINCSAC to air, sea
        and ground deployments and movement alerts from OPLAN 37-64. Among them two B-57 squadrons, from the Philippines to
        Biên Hòa, where they stay.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 107. Check: the B-57s'' day of arrival. To check: JCS 7729 to CINCPAC,
        CINCSTRIKE and CINCSAC, 050043Z Aug 64 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 107 n.24); NMCC OPSUM 102-64,
        Aug. 5, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 107 n.24). See [[cal.1964-08-02.vietnam]].'
      src:
        c: 31923f4f
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 107: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 107 n.24: all'
      tags:
      - place:bien-hoa
- add:
    entry:
      id: cal.1964-08-07.vietnam-air-war
      when: Aug. 7
      date: '1964-08-07'
      thread: vietnam-air-war
      c: 'The United States finds 36 MiG-15s and MiG-17s arrived at Phúc Yên: by North Vietnam''s account the 921st Fighter
        Regiment, its first jet unit, back from training abroad.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 111. To check: CINCPAC Command History, 1964, p. 373 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        111 n.35); [[w.vietnam-victory-in-vietnam]] (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 111 n.35).'
      src:
        c: 67ad60e2
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 111: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 111 n.35: all'
- add:
    entry:
      id: cal.1964-08-07.vietnam-force-levels
      when: Aug. 7
      date: '1964-08-07'
      thread: vietnam-force-levels
      c: 'McNamara orders the accelerated schedule: the units, men and equipment Westmoreland asked, with a few exceptions,
        readied to reach South Vietnam by Sept. 30; the helicopters and Caribous too, over LeMay''s and Greene''s objections;
        MAP funds for the construction. The manpower ceilings left to another day.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 88–89. To check: McNamara to the Chairman, JCS, "Additional Support for
        Republic of Vietnam on an Accelerated Basis," Aug. 7, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 89 n.12).
        See [[cal.1964-07-27.vietnam]]. Names: McNamara, Westmoreland, LeMay, Greene.'
      src:
        c: cd0de408
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 88–89: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 89 n.12: all'
      tags:
      - name:mcnamara-robert-s
      - name:westmoreland-william
      - name:lemay-curtis-e
      - name:greene-wallace-m-jr
- add:
    entry:
      id: cal.1964-08-14.vietnam-force-levels
      when: Aug. 14
      date: '1964-08-14'
      thread: vietnam-force-levels
      c: 'Wheeler to McNamara, CM-80-64: Westmoreland''s new phase-in schedule, 4,566 of the reinforcements in South Vietnam
        by Dec. 1, the rest by Feb. 1, 1965. American military strength authorized: 22,226.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 89. To check: CM-80-64 to the Secretary of Defense, Aug. 14, 1964 (cited
        by [[w.cosmas-joint-chiefs-of-staff-2012]], 89 n.13). See [[cal.1964-07-27.vietnam]]. Names: Wheeler, McNamara, Westmoreland.'
      src:
        c: ed9f73de
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 89: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 89 n.13: all'
      tags:
      - name:wheeler-earle
      - name:mcnamara-robert-s
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-09-01.vietnam-force-levels
      when: Sept. 1
      date: '1964-09-01'
      thread: vietnam-force-levels
      c: On Westmoreland's recommendation after the Gulf of Tonkin, the Defense Department alerts a Marine Hawk antiaircraft
        missile battalion in the United States for Đà Nẵng.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 192. See [[cal.1964-08-31.vietnam-force-levels]]. Names: Westmoreland.'
      src:
        c: 256f2a3e
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 192: all'
      tags:
      - name:westmoreland-william
      - place:da-nang
- add:
    entry:
      id: cal.1964-09-09.vietnam-macv
      when: Sept. 9
      date: '1964-09-09'
      thread: vietnam-macv
      c: 'Johnson rules, outside NSAM 314, that American jets not be used against the Viet Cong for the present: Westmoreland
        had proposed it; Sharp and Taylor against.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 136. To check: COMUSMACV MACV-J3 8887 to CINCPAC, Aug. 29, 1964 (cited
        by [[w.cosmas-joint-chiefs-of-staff-2012]], 136 n.33); CINCPAC to JCS, 310100Z Aug 64 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        136 n.33). See [[cal.1964-09-09.vietnam]]. Names: Johnson, Westmoreland, Sharp, Taylor.'
      src:
        c: 7a367d57
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 136: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 136 n.33: all'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:sharp-u-s-grant
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1964-09-10.vietnam-tonkin
      when: Sept. 10
      date: '1964-09-10'
      thread: vietnam-tonkin
      c: Under NSAM 314, the Joint Chiefs authorize CINCPAC a three-day Desoto patrol in the Gulf of Tonkin from Sept. 15,
        Saigon time. If attacked, ships and aircraft may pursue into territorial waters and air space, but "will confine their
        actions to the attacking ships and/or aircraft."
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 133. To check: JCS 8518 to CINCPAC, Sept. 10, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        133 n.22). See [[cal.1964-08-02.vietnam]].'
      src:
        c: 1fdc8db1
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 133: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 133 n.22: all'
- add:
    entry:
      id: cal.1964-09-19.vietnam-tonkin
      when: Sept. 19
      date: '1964-09-19'
      thread: vietnam-tonkin
      c: 'The Joint Chiefs tell Sharp to await further instructions before another Desoto patrol: the patrols in effect suspended.
        The *Morton* and *Edwards* end theirs without further incident.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 134. See [[cal.1964-09-18.vietnam]]. Names: Sharp.'
      src:
        c: 61586ebd
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 134: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-09-20.vietnam-tonkin
      when: Sept. 20
      date: '1964-09-20'
      thread: vietnam-tonkin
      c: 'Wheeler asks Sharp and Westmoreland what the Desoto patrols are worth. Both defend them, for their intelligence
        on the North; Sharp: "our right to go any place we desire on the high seas ... a right we must never give up."'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 134. To check: JCS 4593 to CINCPAC and COMUSMACV, Sept. 20, 1964 (cited
        by [[w.cosmas-joint-chiefs-of-staff-2012]], 134 n.25); CINCPAC to CJCS, 210025Z Sep 64 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        134 n.25); COMUSMACV MAC 5147 to CJCS, Sept. 21, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 134 n.25).
        See [[cal.1964-09-18.vietnam]]. Names: Wheeler, Sharp, Westmoreland.'
      src:
        c: 7b53c6cd
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 134: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 134 n.25: all'
      tags:
      - name:wheeler-earle
      - name:sharp-u-s-grant
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-10-16.laos
      when: Oct. 16
      date: '1964-10-16'
      thread: laos
      c: 'Unger: the Laotian air force should finish its strikes on the first thirteen targets in the corridor by Oct. 23.
        American planes give the Lao combat air patrol and high cover only, not flak suppression.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 135. See [[cal.1964-10-13.laos]]. Names: Unger.'
      src:
        c: 36eb3613
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 135: all'
      tags:
      - name:unger-leonard
- add:
    entry:
      id: cal.1964-10-20.laos
      when: Oct. 20
      date: '1964-10-20'
      thread: laos
      c: 'The Joint Chiefs to McNamara, JCSM-889-64: the corridor targets beyond the first thirteen the most significant militarily;
        American planes to join the attacks, as the Lao ask.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 135. To check: JCSM-889-64 to the Secretary of Defense, Oct. 20, 1964 (cited
        by [[w.cosmas-joint-chiefs-of-staff-2012]], 135 n.29). See [[cal.1964-10-13.laos]]. Names: McNamara.'
      src:
        c: 13647ab8
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 135: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 135 n.29: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-10-29.laos
      when: Oct. 29
      date: '1964-10-29'
      thread: laos
      c: 'McNamara answers the Joint Chiefs on the corridor: their memoranda on cross-border operations sent to State and
        kept under review; no early decision.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 135. To check: McNamara to the Chairman, JCS, "US Support, Laos Operations,"
        Oct. 29, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 135 n.29). See [[cal.1964-10-13.laos]]. Names: McNamara.'
      src:
        c: f8f0ffbe
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 135: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 135 n.29: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-12-07.vietnam-force-levels
      when: Dec. 7
      date: '1964-12-07'
      thread: vietnam-force-levels
      c: 'The Marine Hawk battalion, sailed Nov. 18, disembarks at Okinawa: Saigon slow to turn over land at Đà Nẵng for the
        battery positions, Taylor and Westmoreland divert it.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 192. To check: COMUSMACV MAC 6373 to CJCS, Dec. 9, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        192 n.22). See [[cal.1964-11-14.vietnam-force-levels]]. Names: Taylor, Westmoreland.'
      src:
        c: 1160e959
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 192: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 192 n.22: all'
      tags:
      - name:taylor-maxwell
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-12-11.vietnam-force-levels
      when: Dec. 11
      date: '1964-12-11'
      thread: vietnam-force-levels
      c: State and Defense authorize Taylor to tell Saigon two Hawk batteries are ready to deploy whenever needed. After the
        new political crisis, the deployment held back for the rest of the year.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 192. To check: Joint State-Defense message, State 1247 to Saigon, Dec.
        11, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 192 n.22). See [[cal.1964-11-14.vietnam-force-levels]].
        Names: Taylor.'
      src:
        c: 610e9a24
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 192: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 192 n.22: all'
      tags:
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1964-12-11.laos
      when: Dec. 11
      date: '1964-12-11'
      thread: laos
      c: The Joint Chiefs alert CINCPAC to be ready for the first two missions of armed reconnaissance in Laos; the same day,
        JCSM-1041-64 to McNamara.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 189–90. To check: JCS 2848 to CINCPAC, Dec. 11, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        190 n.11); JCSM-1041-64 to the Secretary of Defense, Dec. 11, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        190 n.11). See [[cal.1964-12-10.laos]].'
      src:
        c: 91de9498
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 189–90: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 190 n.11: all'
- add:
    entry:
      id: cal.1964-12-12.vietnam-34a
      when: Dec. 12
      date: '1964-12-12'
      thread: vietnam-34a
      c: 'The Joint Chiefs to McNamara, JCSM-1042-64, after Sharp and Westmoreland: 34A''s Package One, shallow raids on the
        North''s coast from about Dec. 15 for 30 days or more, the capture of naval craft and the destruction of junks among
        them; Package Two, with American planes to cover the boats, possible by Jan. 15, 1965.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 187–88. To check: JCSM-1042-64 to the Secretary of Defense, Dec. 12, 1964
        (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 188 n.5). See [[cal.1964-01-24.vietnam]]. Names: McNamara, Sharp,
        Westmoreland.'
      src:
        c: '58963796'
