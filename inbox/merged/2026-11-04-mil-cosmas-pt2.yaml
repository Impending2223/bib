      id: cal.1965-06-15.vietnam-air-war
      when: June 15
      date: '1965-06-15'
      thread: vietnam-air-war
      c: 'Rolling Thunder 19: a military complex and ammunition depot north of the 21st parallel bombed. McNamara turns down
        the Joint Chiefs on Phúc Yên, Taylor and Westmoreland against and the bombers judged no offensive threat, and on striking
        the SAM sites, which have not yet interfered.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 366, 371, 374. To check: McNamara to the Chairman, JCS, June 15, 1965 (cited
        by [[w.cosmas-joint-chiefs-of-staff-2012]], 374 n.49); JCS 3944 to CINCPAC, June 15, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        366 n.16). See [[cal.1965-03-02.vietnam]]. Names: McNamara, Taylor, Westmoreland.'
      src:
