        - 'via w.cosmas-joint-chiefs-of-staff-2012 373 n.43: all'
- add:
    entry:
      id: cal.1965-08-17.vietnam-air-war-2
      when: Aug. 17
      date: '1965-08-17'
      thread: vietnam-air-war
      c: In the planning for Rolling Thunder 28/29, CINCPAC authorized for the first time to attack SAMs "in mobile mode"
        throughout the armed reconnaissance area, but for the circles round Hanoi and Phúc Yên. The Joint Staff raises the
        sorties to 1,000 for the two weeks; of CINCPAC's 15 fixed targets it turns down eight.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 369. To check: Briefing for the JCS on ROLLING THUNDER 28/29, Aug. 13,
        1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 369 n.27). See [[cal.1965-03-02.vietnam]].'
      src:
        c: 53fa63c7
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 369: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 369 n.27: all'
- add:
    entry:
      id: cal.1965-08-24.vietnam-air-war
      when: Aug. 24
      date: '1965-08-24'
      thread: vietnam-air-war
      c: 'The Joint Chiefs authorize CINCPAC to fly Blue Tree reconnaissance at his discretion throughout the armed reconnaissance
        area, its southern edge moved to 20 degrees 30 minutes north: twenty two-sortie missions a week, low level allowed,
        MiG cover to withdraw if MiGs are sighted. Sharp the same day: his tactics will destroy the SA-2 "provided intelligence
        can fix the site."'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 373, 375. To check: JCS 8977 to CINCPAC, Aug. 24, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        375 n.54); CINCPAC to JCS, 240238Z Aug 65 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 373 n.44). See [[cal.1965-03-02.vietnam]].
        Names: Sharp.'
      src:
        c: 3fc32235
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 373, 375: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 375 n.54: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 373 n.44: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1965-09-20.vietnam-air-war
      when: Sept. 20
      date: '1965-09-20'
      thread: vietnam-air-war
      c: 'Cao Nung, northeast of Hanoi: thirteen SAMs fired against a strike on the Hanoi–Đồng Đăng rail line, all missing.
        In September the missiles bring down a drone and an F-105.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 373. See [[cal.1965-07-24.vietnam]].'
      src:
        c: 3b03b2ee
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 373: all'
- add:
    entry:
      id: cal.1965-08-16.vietnam-air-war-2
      when: Aug. 16
      date: '1965-08-16'
      thread: vietnam-air-war
      c: 'Westmoreland proposes five Free Bomb Zones for Arc Light: Viet Cong strongholds free of friendly forces and away
        from the borders, approved by the Joint General Staff and Saigon, Lodge agreeing; strikes there to be approved in
        advance.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 347. See [[cal.1965-06-18.vietnam]]. Names: Westmoreland, Lodge.'
      src:
        c: 4ba20160
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 347: all'
      tags:
      - name:westmoreland-william
      - name:lodge-henry-cabot
- add:
    entry:
      id: cal.1965-12-03.vietnam-air-war
      when: Dec. 3
      date: '1965-12-03'
      thread: vietnam-air-war
      c: 'Bushmaster II, the Michelin plantation: the enemy attacks American and South Vietnamese troops, Westmoreland calls
        for B-52s and asks Arc Light''s channels decentralized as for Silver Bayonet. Approved.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 348. See [[cal.1965-06-18.vietnam]]. Names: Westmoreland.'
      src:
        c: '10766252'
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 348: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-12-18.vietnam-air-war
      when: Dec. 18
      date: '1965-12-18'
      thread: vietnam-air-war
      c: McNamara approves, slightly changed, the sixth Free Bomb Zone the Joint Chiefs proposed Oct. 23, but no more on Saigon's
        and the ambassador's say alone. The Joint Chiefs to review Arc Light's procedures "with the objective of establishing
        a firm basis for providing the highest level of effectiveness, flexibility and responsiveness."
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 349. See [[cal.1965-06-18.vietnam]]. Names: McNamara.'
      src:
        c: 4ea43a4d
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 349: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-09-18.laos
      when: Sept. 18
      date: '1965-09-18'
      thread: laos
      c: 'McNamara approves in principle the concept of cross-border operations into Laos, Shining Brass: Phase I under Sullivan''s
        limits, the two southernmost areas of the panhandle only, no deeper than 20 kilometers; 48 hours'' notice to him of
        each launch; the funds provided.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 353. Names: McNamara, Sullivan.'
      src:
        c: 397698cb
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 353: all'
      tags:
      - name:mcnamara-robert-s
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1965-11-21.vietnam-operations
      when: Nov. 21
      date: '1965-11-21'
      thread: vietnam-operations
      c: 'The Joint Chiefs authorize the forces in Silver Bayonet to defend themselves against attack from Cambodia: returning
        fire and crossing the border while engaged, with artillery and close air support. No strikes on Cambodia''s populated
        areas, nor on enemy base areas but in self-defense.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 353–54. See [[cal.1965-11-14.vietnam]].'
      src:
        c: 37b5f52d
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 353–54: all'
      tags:
      - place:pleiku
- add:
    entry:
      id: cal.1965-12-18.vietnam-operations
      when: Dec. 18
      date: '1965-12-18'
      thread: vietnam-operations
      c: 'MACV establishes Task Force 116, Game Warden: Navy boat patrols and inshore surveillance on the Delta''s rivers
        and estuary coast and in the Rừng Sát, to enforce curfews and stop the Viet Cong''s movement and supply.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 472.'
      src:
        c: '79748650'
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 472: all'
