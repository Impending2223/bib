      when: Mar. 18
      date: '1965-03-18'
      thread: vietnam-force-levels
      c: McNamara approves the Joint Chiefs' recommendations for a new airfield at Chu Lai and a second runway with taxiways
        at Đà Nẵng, construction to begin at once; the Navy to sponsor and fund them from its construction program.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 265. To check: McNamara to the Chairman, JCS, "Additional Airfield Support
