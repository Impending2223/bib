    entry:
      id: cal.1965-02-18.vietnam-air-war
      when: Feb. 18
      date: '1965-02-18'
      thread: vietnam-air-war
      c: 'After the NSC agrees on a new round, the Joint Chiefs send CINCPAC the execute order for Rolling Thunder I, Feb.
        20: American planes on the Quảng Khê naval base, Vinh Linh and Vit Thu Lu barracks the weather alternates; the VNAF
        on Vu Con barracks or Đồng Hới airfield. Called off after the coup attempt of Feb. 19, the VNAF caught up in it.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 226–27. To check: JCS 5555 to CINCPAC, Feb. 18, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        226 n.14); JCS 5572 to CINCPAC, Feb. 19, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 227 n.15). See [[cal.1965-02-13.vietnam]].'
      src:
        c: e2010cc3
        rows:
