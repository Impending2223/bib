      when: Mar. 9
      date: '1965-03-09'
      thread: vietnam-air-war
      c: Johnson adds napalm to the weapons of Rolling Thunder, after the Joint Chiefs' recommendation of Feb. 25.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 230. To check: JCSM-127-65 to the Secretary of Defense, Feb. 25, 1965 (cited
