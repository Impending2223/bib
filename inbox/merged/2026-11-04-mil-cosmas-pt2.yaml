      when: Mar. 9
      date: '1965-03-09'
      thread: vietnam-air-war
      c: 'The Joint Chiefs order Sharp to fly Rolling Thunder VI by day on Mar. 11: for the Americans an ammunition depot
        north of the 19th parallel, for the VNAF a barracks; two weather alternates and three.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 231. To check: JCS 6703 to CINCPAC, Mar. 9, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
