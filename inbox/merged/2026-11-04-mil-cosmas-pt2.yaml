      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-12-10.vietnam-2
      when: Dec. 10
      date: '1966-12-10'
      thread: vietnam
      c: The Joint Chiefs tell CINCPAC his urgent request of Nov. 24, artillery and naval gunfire on military activity north
        of the demarcation line, is "not favorably considered at this time."
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 522. See [[cal.1966-10-25.vietnam]].'
      src:
        c: 82bcc2eb
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 522: all'
- add:
    entry:
      id: cal.1966-12-15.vietnam-air-war
      when: Dec. 15
      date: '1966-12-15'
      thread: vietnam-air-war
      c: After the protests, Johnson directs the Yên Viên rail yard and the Văn Điển truck park not be struck again; the Joint
        Chiefs order CINCPAC to suspend attacks on both until further notice.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 518. See [[cal.1966-12-02.vietnam-marigold]]. Names: Johnson.'
      src:
