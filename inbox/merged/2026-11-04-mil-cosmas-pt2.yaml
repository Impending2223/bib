      when: Nov.
      date: 1966-11
      thread: vietnam-force-levels
      c: CINCPAC moves the first tactical fighter squadrons to Tuy Hòa, the field not fully operational until 1967.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 494. Check: the day. See [[cal.1966-05-26.vietnam-force-levels]].'
