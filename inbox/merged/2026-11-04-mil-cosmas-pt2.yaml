      when: Aug. 11
      date: '1965-08-11'
      thread: vietnam-air-war
      c: The Joint Chiefs order CINCPAC to low-altitude armed reconnaissance in the Rolling Thunder area, outside the forbidden
        zones, to destroy SAM sites.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 372–73. To check: JCS 7691 to CINCPAC, Aug. 11, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
