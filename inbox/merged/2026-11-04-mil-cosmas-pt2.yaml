    entry:
      id: cal.1965-08-12.vietnam-air-war
      when: Aug. 12–13
      date: '1965-08-12'
      thread: vietnam-air-war
      c: 'A SAM brings down another American jet some 50 miles southwest of Hanoi, Aug. 12. CINCPAC''s carrier planes hunt
        the site, 124 sorties in 30 hours: no site found, five Navy planes lost to ground fire and seven damaged.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 373. To check: JCS 8113 to CINCPAC, Aug. 12, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        373 n.43). See [[cal.1965-07-24.vietnam]].'
