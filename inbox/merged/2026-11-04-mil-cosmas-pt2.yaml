      when: Oct. 25
      date: '1965-10-25'
      thread: vietnam-34a
      c: Word reaches the Joint Chiefs that Vance has authorized more 34A missions with A-1Gs, for leaflets, radios and gift
        kits dropped on chosen population centers in the North.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 356. See [[cal.1964-12-12.vietnam-34a]]. Names: Vance.'
