      date: '1966-08-16'
      thread: vietnam-force-levels
      c: 'The Philippine Civic Action Group begins to arrive in South Vietnam: engineer, medical and rural development teams
        with their security.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 436. See [[cal.1966-06-05.vietnam-force-levels]].'
