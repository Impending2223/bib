- add:
    entry:
      id: cal.1966-10-10.vietnam-air-war
      when: Oct. 10
      date: '1966-10-10'
      thread: vietnam-air-war
      c: A SAM installation seen some 12 to 15 miles northeast of Đồng Hới, within range of the B-52s near the zone; tactical
        aircraft attack it Oct. 12. Oct. 18, two pilots report a missile in flight about 16 miles north of the 17th parallel.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 482. To check: COMUSMACV 46395 to CINCPAC, Oct. 20, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        482 n.65). See [[cal.1966-09-15.vietnam-air-war]].'
      src:
        c: 514d9962
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 482: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 482 n.65: all'
      tags:
      - place:dong-hoi
- add:
    entry:
      id: cal.1966-10-25.vietnam
      when: Oct. 25
      date: '1966-10-25'
      thread: vietnam
      c: 'Sea Dragon begins: two American destroyers on gunfire missions against the North''s coastal traffic, within the
        limits approved in part from the Joint Chiefs'' proposal of May 13. Oct. 29, CINCPAC lets them fire on logistic craft
        beached or moored.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 521–22. To the end of December, two destroyers on station sink 382 waterborne
        logistic craft and damage 325, destroy five shore batteries and damage two, destroy two radar sites and damage two;
        the coastal traffic between the 17th and 18th parallels nearly stopped (522). To check: Vance to the Chairman, JCS,
        Sept. 23, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 522 n.49).'
      src:
        c: c6ce3de2
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 521–22: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 522 n.49: all'
- add:
    entry:
      id: cal.1966-11-11.vietnam-air-war-2
      when: Nov. 11
      date: '1966-11-11'
      thread: vietnam-air-war
      c: Antiaircraft fire from the Demilitarized Zone destroys four American aircraft in one day.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 483, 522. See [[cal.1966-07-24.vietnam-air-war]].'
      src:
        c: 4f6f7aa4
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 483, 522: all'
- add:
    entry:
      id: cal.1966-11-11.vietnam-3
      when: Nov. 11
      date: '1966-11-11'
      thread: vietnam
      c: With Rolling Thunder 52, Johnson raises the limit of Sea Dragon's gunfire on waterborne military traffic to the 18th
        parallel.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 522. See [[cal.1966-10-25.vietnam]]. Names: Johnson.'
      src:
        c: 75b46c99
        rows:
