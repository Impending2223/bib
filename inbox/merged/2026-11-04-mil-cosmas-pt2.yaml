- add:
    entry:
      id: cal.1965-03-15.vietnam-air-war-2
      when: Mar. 15
      date: '1965-03-15'
      thread: vietnam-air-war
      c: 'Johnson approves lifting the restrictions on Rolling Thunder that General Harold K. Johnson listed: American strikes
        no longer tied to VNAF strikes or to their primary targets; wider limits on targets; alternate targets struck without
        Washington''s approval. The ban on classified ammunition only partly lifted, each request to the Joint Chiefs.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 231–32. To check: DJSM-379-65 to CJCS, Mar. 27, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        232 n.30). See [[cal.1965-03-02.vietnam]]. Names: Johnson, Harold K. Johnson.'
      src:
        c: 8ca263ee
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 231–32: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 232 n.30: all'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-harold-k
- add:
    entry:
      id: cal.1965-04-29.vietnam-air-war
      when: Apr. 29
      date: '1965-04-29'
      thread: vietnam-air-war
      c: 'Rolling Thunder 12 ends, the last of the blocks since RT 9 of Apr. 2 against the North''s lines of communication
        into Laos and the South: bridges and ferries by day and night, armed reconnaissance against rolling stock, trucks
        and shipping, up to 24 strike sorties a day; six more allowed in RT 12 against trucks and trains. By its end, 26 bridges
        and seven ferries struck.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 363–64. By the end of April 60 of the Joint Chiefs'' targets in the North
        struck, 43 by American planes and 17 by the VNAF; 86 armed reconnaissance missions; of 474 sorties authorized on fixed
        targets 316 flown, of 264 on armed reconnaissance 249 (Cosmas, 363–64). To check: CM-568-65 to D/JS, Apr. 26, 1965
        (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 364 n.9). See [[cal.1965-03-02.vietnam]].'
      src:
        c: 28dbf8cb
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 363–64: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 364 n.9: all'
- add:
    entry:
      id: cal.1965-06-04.vietnam-macv
      when: June 4
      date: '1965-06-04'
      thread: vietnam-macv
      c: 'McNamara approves a 10th ARVN division made of three separate regiments, as Westmoreland asked May 5 and the Joint
        Chiefs May 27: the ARVN''s authorized strength to 261,158.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 333. Check: the strength; the scan reads "261,15s." To check: McNamara
        to the Chairman, JCS, June 4, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 333 n.40). See [[cal.1965-05-05.vietnam-4]].
        Names: McNamara, Westmoreland.'
      src:
        c: a34b6c6f
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 333: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 333 n.40: all'
      tags:
      - name:mcnamara-robert-s
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-06-15.vietnam-macv
      when: June 15
      date: '1965-06-15'
      thread: vietnam-macv
      c: Battle losses and desertion above forecast, the Joint Chiefs tell Westmoreland to put off the activation of 11 ARVN
        battalions due in the next months.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 333. See [[cal.1965-06-04.vietnam-macv]]. Names: Westmoreland.'
      src:
