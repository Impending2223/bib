      when: June 9
      date: '1966-06-09'
      thread: laos
      also:
      - vietnam-operations
      c: 'The Joint Chiefs authorize American forces near the Laotian border, in emergencies, to take counteraction "in the
        exercise of the right of self-defense" against attack from across it: artillery, air strikes, maneuver into Laos while
        engaged; villages not to be attacked unless fired from.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 477. See [[cal.1965-11-21.vietnam-operations]].'
