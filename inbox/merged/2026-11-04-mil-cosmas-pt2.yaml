      when: Mar. 15
      date: '1965-03-15'
      thread: vietnam-operations
      c: 'Sharp to the Joint Chiefs: the Viet Cong''s new family of Communist-bloc weapons will need more supply from the
        North, likely by sea. The coast to be "sanitized"; the rules confine American ships to surveillance; Saigon to be
        brought to ask for American help.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 254. To check: CINCPAC to JCS, 152206Z Mar 65 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        254 n.42). See [[cal.1965-03-11.vietnam-operations]]. Names: Sharp.'
