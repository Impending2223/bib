- add:
    entry:
      id: cal.1965-04-17.vietnam-macv
      when: Apr. 17
      date: '1965-04-17'
      thread: vietnam-macv
      c: The Joint Chiefs send CINCPAC the revised rules of engagement for Southeast Asia, McNamara's amendments of Apr. 12
        unchallenged (in effect a 12-mile limit off China); immediate pursuit into China still sought. "Hostile aircraft"
        defined over South Vietnam, Thailand and international waters, not the North.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 357–58. See [[cal.1965-01-06.vietnam-macv]]. Names: McNamara.'
      src:
        c: 6b51ab6a
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 357–58: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-04-30.vietnam-air-war
      when: Apr. 30
      date: '1965-04-30'
      thread: vietnam-air-war
      c: 'The Joint Chiefs to CINCPAC and CINCSAC: B-52s may be used for area saturation attacks on known Viet Cong installations
        lacking precise target data. CINCSAC to develop the capability and plan with CINCPAC; each mission for Johnson or
        McNamara to approve.'
