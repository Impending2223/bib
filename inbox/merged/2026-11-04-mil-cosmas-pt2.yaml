      when: Apr. 17–18
      date: '1965-04-17'
      thread: vietnam-force-levels
      c: 'The Joint Chiefs tell CINCPAC some 5,000 more Marines are approved for planning "at the highest level." Wheeler,
        at Honolulu, knows of no such approval; Goodpaster, Apr. 18: the Chiefs took it from a meeting with Johnson.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 282. To check: JCS 9310 to CINCPAC, Apr. 17, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
