      c: The last of the 25th Infantry Division's three brigades in South Vietnam; American strength there 255,574 by early
        May. The same day the Korean reinforcement, a division and a regiment announced Feb. 28, begins to deploy.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 316, 434.'
