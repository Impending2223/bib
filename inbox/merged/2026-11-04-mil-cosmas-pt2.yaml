      when: Dec. 22
      date: '1966-12-22'
      thread: vietnam-force-levels
      c: Holt announces Australia will send a squadron of Canberra bombers, a new guided-missile destroyer and 900 more soldiers,
        to about 6,300 in all; in Vietnam only in the spring of 1967.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 436. To check: MACV Command History, 1966, p. 94 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
