      when: Mar. 24
      date: '1965-03-24'
      thread: vietnam-air-war
      c: 'At McNamara''s direction, the Joint Chiefs authorize CINCPAC''s Rolling Thunder VIII, Mar. 26–Apr. 1: radar sites
        the American primary targets, with armed reconnaissance against patrol boats along the coast and the islands; for
        the VNAF, barracks, an airfield and Route 12.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 234. Check: the note dates the message "2 Mar 65." To check: JCS 7672 to
        CINCPAC, Mar. 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 234 n.38). See [[cal.1965-03-02.vietnam]]. Names:
        McNamara.'
