      when: Feb. 14
      date: '1966-02-14'
      thread: vietnam-macv
      c: With McNamara's approval, the Joint Chiefs direct the Chief of Naval Operations and CINCPAC to set up the new naval
        command under Westmoreland, Naval Forces, Vietnam, over the Naval Advisory Group and Task Forces 115 and 116; III
        Marine Amphibious Force a separate command under MACV. Apr. 1, Rear Adm. Norvell G. Ward takes command of Naval Forces,
        Vietnam.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 474. To check: JCS 3964 to CNO and CINCPAC, Feb. 14, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        474 n.29). Names: McNamara, Westmoreland.'
