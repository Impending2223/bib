      when: Mar. 11
      date: '1965-03-11'
      thread: vietnam-operations
      c: Without waiting for formal approval, American naval forces set up a patrol of South Vietnam's coast. The rules of
        engagement allowing no boarding or search on the high seas, they detect and track suspect craft for the Vietnamese
        navy to stop and search.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 254. To check: CNOM-113-65 to the JCS, Apr. 1, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
