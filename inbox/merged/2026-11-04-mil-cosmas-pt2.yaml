      when: Mar. 16
      date: '1965-03-16'
      thread: vietnam-air-war
      c: After Johnson's decision, the Joint Chiefs direct CINCPAC to carry out the next block of strikes, Rolling Thunder
        VII.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 232. To check: JCS 7185 to CINCPAC, Mar. 16, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
