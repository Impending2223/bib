      when: Dec. 19
      date: '1966-12-19'
      thread: vietnam-force-levels
      c: 'The first elements of the 9th Infantry Division land in South Vietnam, for the Delta: a battalion task force to
        Đồng Tâm by late January.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 433, 453. To check: MACV Command History, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
