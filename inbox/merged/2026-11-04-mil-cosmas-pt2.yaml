      when: Mar. 18
      date: '1965-03-18'
      thread: vietnam-operations
      c: The Joint Chiefs approve CINCPAC's concept for sanitizing the South Vietnamese coast, but hold him to the present
        rules of engagement for Southeast Asia.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 254. To check: JCS 7307 to CINCPAC, Mar. 18, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
