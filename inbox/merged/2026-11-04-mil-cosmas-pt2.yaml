      when: Mar. 16
      date: '1965-03-16'
      thread: vietnam-air-war
      c: 'Wheeler to CINCPAC: Johnson "announced" Mar. 15 that operations likely to bring air clashes with MiGs near Hanoi
        be avoided; to Wheeler, no strikes north of the 20th parallel for now. The Joint Chiefs limit Blue Tree reconnaissance
        to the south of the 20th, its combat air patrol to withdraw on sighting MiGs.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 232. To check: JCS 0936-65 to CINCPAC, Mar. 16, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        232 n.31). See [[cal.1965-03-02.vietnam]]. Names: Wheeler, Johnson.'
