      when: Feb. 11
      date: '1965-02-11'
      thread: vietnam-air-war
      c: The Joint Chiefs order CINCSAC to deploy 30 B-52s, refitted for large conventional loads, to Andersen, Guam, and
        30 KC-135 tankers to Kadena, Okinawa, for possible use against the North; the bombers to be ready to operate on arrival.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 297. To check: JCS 5000 to CINCSAC, Feb. 11, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
