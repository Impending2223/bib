- add:
    entry:
      id: cal.1966-03-10.vietnam-force-levels
      when: Mar. 10
      date: '1966-03-10'
      thread: vietnam-force-levels
      c: 'McNamara makes Case I "the revised approved deployment plan for South Vietnam," against the Joint Chiefs'' preference
        for a stretch-out: no reserves called, no terms extended. American strength to 283,500 by June 1966, 415,000 by December,
        425,600 by June 1967; 52 maneuver battalions in June, 79 by the year''s end; attack-capable aircraft from 711 in December
        1965 to 866 by mid-1966 and 1,087 by the end of 1966.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 316. Names: McNamara.'
      src:
        c: f3b3f658
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 316: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-03.vietnam-operations
      when: Mar., mid-month
      date: 1966-03
      thread: vietnam-operations
      c: 'Lincoln: Westmoreland''s spoiling attacks in western Pleiku Province by the Cambodian border. He asks authority
        to maneuver troops into Cambodia, Lodge supporting.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 474. Names: Westmoreland, Lodge.'
      src:
        c: 1c412250
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 474: all'
      tags:
