      id: cal.1965-05-27.vietnam-air-war
      when: May 27
      date: '1965-05-27'
      thread: vietnam-air-war
      c: 'The Joint Chiefs to McNamara, JCSM-415-65: five Soviet light jet bombers arrived at Phúc Yên during May threaten
        Đà Nẵng; the field to be struck, the bombers and the MiGs with it. Sharp had urged it May 9.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 374. To check: JCSM-415-65 to the Secretary of Defense, May 27, 1965 (cited
        by [[w.cosmas-joint-chiefs-of-staff-2012]], 374 n.49); CINCPAC to CJCS, 092218Z May 65 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        374 n.49). See [[cal.1964-08-07.vietnam-air-war]]. Names: McNamara, Sharp.'
