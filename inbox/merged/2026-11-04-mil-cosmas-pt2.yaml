      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-06-21.vietnam-34a
      when: June 21
      date: '1965-06-21'
      thread: vietnam-34a
      c: 'Increments 9 to 11 of the 34A maritime raids approved: reconnaissance and infiltration, an amphibious raid, coastal
        harassment; no bombardments north of the 17th parallel. Later in the year Vance extends the raids to the 20th parallel.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 355. See [[cal.1964-12-12.vietnam-34a]]. Names: Vance.'
      src:
        c: fbb652b9
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 355: all'
      tags:
      - name:vance-cyrus
- add:
    entry:
      id: cal.1965-04-23.vietnam-operations
      when: Apr. 23
      date: '1965-04-23'
      thread: vietnam-operations
      c: Saigon asks formally for American help in guarding its coastal waters. Within a day Taylor tells it the request is
        granted. Apr. 27, Saigon announces it will enforce Decree 81/NG on its territorial waters.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 256. See [[cal.1965-03-11.vietnam-operations]]. Names: Taylor.'
      src:
        c: 747d6c82
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 256: all'
      tags:
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1965-04-22.vietnam-operations
      when: Apr. 22
      date: '1965-04-22'
      thread: vietnam-operations
      c: Near Đà Nẵng, a small patrol of Marines and South Vietnamese in a fire fight with the Viet Cong, the first combat
        encounter of an American unit.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 338. To check: NMCC OPSUM 93-65, Apr. 22, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        338 n.1).'
      src:
        c: 151c57c2
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 338: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 338 n.1: all'
      tags:
      - place:da-nang
- add:
    entry:
      id: cal.1965-10.vietnam-air-war
      when: Oct., late
      date: 1965-10
      thread: vietnam-air-war
      c: 'Rolling Thunder by late October: of the 240 targets on the Joint Chiefs'' list for the North, 126 struck; of the
        114 left, 75 in the sanctuaries. Over 740 bridges attacked, at least 145 destroyed or impassable; 6,752 sorties against
        fixed targets, 11,149 on armed reconnaissance.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 379–80. Of the fixed-target sorties over a third on barracks, about a sixth
        on ammunition depots; four airfields, two naval bases, thirteen radar sites, four SAM sites struck; armed reconnaissance
        destroyed 328 vessels, 423 vehicles, 181 railway cars and engines (Cosmas, 380). To check: CM-940-65 to the Secretary
        of Defense, Oct. 30, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 380 n.66). See [[cal.1965-03-02.vietnam]].'
      src:
        c: 273c4c98
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 379–80: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 380 n.66: all'
- add:
    entry:
      id: cal.1966-10.vietnam-air-war
      when: Oct., late
      date: 1966-10
      thread: vietnam-air-war
      c: By the end of October the North Vietnamese have fired 890 SAMs at American planes and brought down 32. CINCPAC holds
        a conference at his headquarters on countering the missile.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 514. By late August 122 missile sites identified; since the first firing
        in July 1965, 662 missiles and 28 planes down (Cosmas, 509–10). See [[cal.1965-07-24.vietnam]].'
      src:
        c: bb21a692
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 514: all'
- add:
    entry:
      id: cal.1966-12-24.vietnam-air-war-2
      when: Dec. 24
      date: '1966-12-24'
      thread: vietnam-air-war
      c: 'American air losses over the North to Dec. 24: 171 aircraft shot down and 450 damaged, most by the North''s 6,900
        antiaircraft guns. From Apr. 3, 1965, to Jan. 2, 1967, 13 planes lost to MiGs, 34 claimed by American pilots.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 524. Check: the day; the figures from the Joint Staff''s appraisal of 1966.
        See [[cal.1965-03-02.vietnam]].'
      src:
        c: 28d25fec
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 524: all'
