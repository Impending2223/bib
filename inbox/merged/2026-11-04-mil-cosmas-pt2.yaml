    entry:
      id: cal.1966-04-03.defense
      when: Apr. 3
      date: '1966-04-03'
      thread: defense
      also:
      - vietnam-air-war
      c: 'Vance, in Saigon, learns the air munitions shortage is critical and production will not meet the need before early
        1967: bomb loads cut, substitutes used; of the stocks required, 73 percent of the bombs and 33 percent of the CBU-2
        cluster munitions on hand.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 498. Sharp had warned McNamara of shortages Jan. 26; by Mar. 1 MACV reported
        air munitions "critically short generally" (498). To check: CINCPAC to SecDef, 290445Z Jan 66 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        498 n.23). Names: Vance.'
      src:
        c: c001ef92
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 498: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 498 n.23: all'
      tags:
      - name:vance-cyrus
- add:
    entry:
      id: cal.1966-04-08.defense
      when: Apr. 8
      date: '1966-04-08'
      thread: defense
      also:
      - vietnam-air-war
      c: 'Westmoreland to Sharp and Wheeler: "The lack of USAF aircraft munitions in SEA ... has reached the point where I
        consider it an emergency situation"; 233 strike sorties canceled or not scheduled in four days. McNamara, "shocked
        by the evidence of maldistribution," promises immediate action. The Joint Chiefs authorize CINCPAC to divert air munitions
        anywhere in the Pacific Command to his components in Southeast Asia, whoever owns them, the reserves held for Korea
        among them.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 498. To check: COMUSMACV to CINCPAC and CJCS, Apr. 8, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        498 n.24); DEF 8036 to COMUSMACV, Apr. 8, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 498 n.25); JCS 8037
        to CINCPAC, Apr. 8, 1966 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 498 n.26). See [[cal.1966-04-03.defense]].
        Names: Westmoreland, Sharp, Wheeler, McNamara.'
      src:
        c: ea8a7951
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 498: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 498 n.24: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 498 n.25: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 498 n.26: all'
      tags:
      - name:westmoreland-william
      - name:sharp-u-s-grant
      - name:wheeler-earle
      - name:mcnamara-robert-s
