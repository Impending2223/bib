      when: Apr. 11–12
      date: '1966-04-11'
      thread: defense
      also:
      - vietnam-air-war
      c: 'Hawaii. The air munitions conference: six courses agreed, sortie plans by month, weapon and service; operating stock
        levels; western Pacific stocks drawn from home; better management of bomb components; a realistic pipeline; faster
        production. A loading of 1.66 tons a sortie accepted for planning.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 499–500. See [[cal.1966-04-03.defense]].'
      src:
        c: 840c8cd8
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 499–500: all'
