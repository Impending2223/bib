      date: '1966-06-22'
      thread: vietnam-air-war
      c: 'After the NSC, the Joint Chiefs authorize CINCPAC to bomb the seven oil targets and the radar at Kép airfield at
        first light June 24: Hanoi''s and Haiphong''s oil the same day if possible; good weather only; not on Sunday, June
        26.'
