      date: '1966-07-02'
      thread: vietnam-force-levels
      c: 'McNamara issues Southeast Asia Deployment Program #3: 391,000 Americans in South Vietnam by the end of 1966; 82
        maneuver battalions by June 1967, 431,000 men. Nine more battalions in the second half of 1966, three meant for the
        Dominican Republic and six of the new 9th Infantry Division, for 79 by the year''s end.'
