      when: Dec. 21
      date: '1966-12-21'
      thread: vietnam-air-war
      c: CINCPAC learns its planes attacking the Yên Viên rail yard struck by mistake another target two and a half miles
        southwest on the same line, cloud and heavy defenses contributing.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 518. To check: CINCPAC to JCS, 232042Z Dec 66 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
