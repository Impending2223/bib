      when: May 26
      date: '1966-05-26'
      thread: vietnam-force-levels
      c: The Joint Chiefs ask McNamara, JCSM-355-66, to have the jet airfield at Tuy Hòa built by the Air Force's turnkey
        procedure, a civilian contractor, after five months' disagreement over the site.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 494. To check: JCSM-355-66 to the Secretary of Defense, May 26, 1966 (cited
