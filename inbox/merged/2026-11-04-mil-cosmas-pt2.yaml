      when: July 28
      date: '1965-07-28'
      thread: vietnam-34a
      c: Vance approves the 34A fast patrol boats against the North's shipping between the 17th and 19th parallels, as Sharp
        proposed May 16, but without the American Navy advisers aboard.
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 355–56. See [[cal.1964-12-12.vietnam-34a]]. Names: Vance, Sharp.'
