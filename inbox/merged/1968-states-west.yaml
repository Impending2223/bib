patch: west
by: agent
ops:
  # ---------------------------------------------------------------- national bodies
  - add:
      entry:
        id: cal.1968-02-28.states-and-cities-us
        when: Feb. 28–Mar. 1
        date: '1968-02-28'
        thread: states-and-cities
        c: 'Washington. The National Governors'' Conference''s first Mid-Year Meeting, on federal-state relations, set by its 59th Annual Meeting: its eleven committees with the administration''s and Congress''s leaders on pending federal bills. Johnson opens it, Feb. 29.'
        n: '[Remarks Opening the Midyear Conference of Governors of the States and Territories](https://www.presidency.ucsb.edu/documents/remarks-opening-the-midyear-conference-governors-the-states-and-territories) (Feb. 29, 1968). National Governors'' Conference, [*Summary of the Mid-Year Meeting on Federal-State Relations, February 28–March 1, 1968*, 1](https://www.nga.org/wp-content/uploads/2021/03/1968NGAWinterMeeting.pdf). [[w.sabato-goodbye-to-good-time]]. See [[cal.1967-10-16.states-and-cities-us]]. Names: Johnson.'
        tags: [name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-07-21.states-and-cities-us
        when: July 21–24
        date: '1968-07-21'
        thread: states-and-cities
        also: [civil-rights-the-executive]
        c: 'Cincinnati. The National Governors'' Conference, its 60th meeting. July 23, Johnson to the governors. July 24, Romney''s "Declaration of Conscience," against racism, human rights and property rights "interlinked," adopted by a show of hands, 21–5, the governors of Alabama and Georgia speaking against. Ellington elected chairman.'
        n: '*Proceedings of the National Governors'' Conference, 1968*, [89–92](https://www.nga.org/wp-content/uploads/2021/03/1968NGAAnnualMeeting.pdf#page=104), 105. [Remarks Before the National Governors'' Conference in Cincinnati](https://www.presidency.ucsb.edu/documents/remarks-before-the-national-governors-conference-cincinnati) (July 23, 1968). [[w.sparacino-democratic-and-republican-governors]]. See [[cal.1968-02-28.states-and-cities-us]]. Names: Johnson, Romney, Maddox, Ellington.'
        tags: [name:johnson-lyndon-b, name:romney-george-w, name:maddox-lester, name:ellington-buford]
  - add:
      entry:
        id: cal.1968-12.states-and-cities-us
        when: Dec.
        date: 1968-12
        thread: states-and-cities
        also: [elections-1968]
        c: The Republican Governors Association elects Reagan chairman, in place of Chafee, beaten for re-election in November.
        n: '[Wikipedia, "Governorship of Ronald Reagan"](https://en.wikipedia.org/wiki/Governorship_of_Ronald_Reagan). [[w.sparacino-democratic-and-republican-governors]]; [[w.cannon-governor-reagan]]. Names: Reagan, Chafee. Check: the meeting, its place and day.'
        tags: [name:reagan-ronald, name:chafee-john-h, state:ca]
  - add:
      entry:
        id: cal.1968-12.court-us
        when: Dec.
        date: 1968-12
        thread: court
        also: [states-and-cities, legislatures]
        c: 'Dirksen''s convention on apportionment, at the year''s end: no legislature applies in 1968; the count stays at 32, of the 34 needed, by the Article V Library''s list.'
        n: '[Article V Library, applications on apportionment](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0). See [[cal.1967-12.court-us]]. Names: Dirksen.'
        tags: [name:dirksen-everett]
  # ---------------------------------------------------------------- Washington and Seattle
  - add:
      entry:
        id: cal.1968-02-13.state-and-city-finance-seattle
        when: Feb. 13
        date: '1968-02-13'
        thread: state-and-city-finance
        also: [transportation, cities-and-housing]
        c: 'Seattle and King County vote on Forward Thrust''s twelve bond propositions, each needing 60 percent. Seven carry, among them parks, $118 million, 64.7 percent; a domed stadium, $40 million, 62.3; arterial highways, $81.6 million, 62.2. Rapid transit, $385 million with $765 million federal, fails, 50.8 percent; low-income housing, $3 million, 57.9.'
        n: 'Votes: [Wikipedia, "Forward Thrust"](https://en.wikipedia.org/wiki/Forward_Thrust), from HistoryLink; Check: the King County canvass, Feb. 13, 1968. [[w.schwantes-pacific-northwest]]; [[w.peirce-pacific-states-of-america]]. See [[cal.1964-03-10.mayors-seattle]].'
        tags: [state:wa, city:seattle]
  - add:
      entry:
        id: cal.1968-09-17.governors-wa
        when: Sept. 17
        date: '1968-09-17'
        thread: governors
        also: [elections-1968]
        c: 'Washington''s blanket primary, for governor. Governor Evans (R) 305,897, 43.4 percent; O''Connell (D), the attorney general, 182,969, 26.0; Durkan (D), a State senator, 162,382, 23.0; five others. In November Evans over O''Connell, 692,378 to 560,262, 54.7 percent.'
        n: 'Votes: [Wikipedia, "1968 Washington gubernatorial election"](https://en.wikipedia.org/wiki/1968_Washington_gubernatorial_election), from the Secretary of State''s *Official Abstract of Votes, Primary Election Held on September 17, 1968*, and the general''s; Check: the Abstracts (HathiTrust, bot-checked from here). [[w.peirce-pacific-states-of-america]]. See [[cal.1964-11-03.governors-wa]]. Names: Evans, O''Connell, Durkan.'
        tags: [state:wa, name:evans-daniel-j, name:oconnell-john-j, name:durkan-martin-j]
  # ---------------------------------------------------------------- Montana
  - add:
      entry:
        id: cal.1968-06-04.governors-mt
        when: June 4
        date: '1968-06-04'
        thread: governors
        also: [elections-1968]
        c: 'Montana''s primaries for governor. Democratic: Forrest Anderson, the attorney general, 39,057, 38.4 percent; Mahoney, a State senator, 35,562, 34.9; four others. Republican: Governor Babcock 50,369, 55.1 percent; Lieutenant Governor James 36,664, 40.1; two others.'
        n: '[*Report of the Official Canvass of the Vote Cast at the Primary Election in the State of Montana, June 4, 1968*](https://archive.org/details/primaryofficial1968montrich/page/n1); the shares, [Wikipedia, "1968 Montana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Montana_gubernatorial_election). [[w.malone-montana]]; [[w.peirce-mountain-states-of-america]]. See [[cal.1964-06-02.governors-mt]]. Names: Anderson, Mahoney, Babcock, James.'
        tags: [state:mt, name:anderson-forrest-h, name:mahoney-eugene-h, name:babcock-tim-m, name:james-ted]
  - add:
      entry:
        id: cal.1968-11-05.governors-mt
        when: Nov. 5
        date: '1968-11-05'
        thread: governors
        also: [elections-1968, state-and-city-finance]
        c: 'Montana. Forrest Anderson (D) governor over Governor Babcock (R), 150,481 to 116,432, 54.1 percent; a third candidate, of the New Reform Party, 4.0. Babcock had asked for a sales tax; Anderson against it (Check).'
        n: '[*Official Montana General Election Returns, November 5, 1968*](https://archive.org/details/officialmontanag1968montrich/page/n1). [[w.malone-montana]]. See [[cal.1968-06-04.governors-mt]]. Names: Anderson, Babcock.'
        tags: [state:mt, name:anderson-forrest-h, name:babcock-tim-m]
  # ---------------------------------------------------------------- Arizona, Utah, New Mexico
  - add:
      entry:
        id: cal.1968-09-10.governors-az
        when: Sept. 10
        date: '1968-09-10'
        thread: governors
        also: [elections-1968]
        c: 'Arizona''s primaries. Governor, Democratic: Goddard, governor 1965–67, 112,948, 73.4 percent; two others. Governor Williams unopposed. Senate, Hayden retiring: Elson, his administrative assistant, the Democrats'' nominee, 95,231, 62.7 percent; Goldwater the Republicans''. In November Williams over Goddard, 279,923 to 204,075, 57.8 percent; Goldwater over Elson.'
        n: 'Votes: [Wikipedia, "1968 Arizona gubernatorial election"](https://en.wikipedia.org/wiki/1968_Arizona_gubernatorial_election), from the canvasses; [Wikipedia, "1968 United States Senate election in Arizona"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Arizona), from Our Campaigns. Check: [Ariz. *Official Canvass, Primary Election, September 10, 1968*](https://azmemory.azlibrary.gov/nodes/view/102664) and [*General Election, November 5, 1968*](https://azmemory.azlibrary.gov/nodes/view/102663) (bot-checked from here). [[w.shermer-sunbelt-capitalism]]; [[w.goldberg-barry-goldwater]]; [[w.peirce-mountain-states-of-america]]. See [[cal.1966-11-08.governors-az]]. Names: Goddard, Williams, Hayden, Elson, Goldwater.'
        tags: [state:az, name:goddard-samuel-p-jr, name:williams-jack, name:hayden-carl, name:elson-roy-l, name:goldwater-barry-m]
  - add:
      entry:
        id: cal.1968-09-10.governors-ut
        when: Sept. 10
        date: '1968-09-10'
        thread: governors
        also: [elections-1968]
        c: 'Utah''s Republican primary for governor: Buehner, once a general authority of the Church of Jesus Christ of Latter-day Saints, 93,635, 70.1 percent, over one other. Governor Rampton unopposed. In November Rampton over Buehner, 289,283 to 131,729, 68.7 percent, as Nixon carries the State.'
        n: 'Votes: [Utah, *Abstract of the Returns of an Election Held in the State of Utah, Tuesday, November 5, 1968*](https://vote.utah.gov/wp-content/uploads/2023/09/1968Gen.pdf); the primary, [Wikipedia, "1968 Utah gubernatorial election"](https://en.wikipedia.org/wiki/1968_Utah_gubernatorial_election) (Check: the primary abstract, at the Utah State Archives). [[w.peirce-mountain-states-of-america]]. See [[cal.1964-11-03.governors-ut]]. Names: Buehner, Rampton, Nixon.'
        tags: [state:ut, name:buehner-carl-w, name:rampton-calvin-l, name:nixon-richard-m]
  - add:
      entry:
        id: cal.1968-11-05.governors-nm
        when: Nov. 5
        date: '1968-11-05'
        thread: governors
        also: [elections-1968]
        c: 'New Mexico. Cargo (R) re-elected over Chavez (D), once a State senator, 160,140 to 157,230, 50.2 percent; the People''s Constitutional Party''s candidate, in Tijerina''s place, 1,540. In the primaries Cargo over Hawley, 54.9 percent; Chavez first of six Democrats, 30.9. The last two-year term.'
        n: 'Votes: [Wikipedia, "1968 New Mexico gubernatorial election"](https://en.wikipedia.org/wiki/1968_New_Mexico_gubernatorial_election), from *New Mexico Election Returns, 1911–1969* and *America Votes 8*; Check: N.M., *Official Returns*, 1968 (paper, State Records Center and Archives), and the primaries'' date. T. Phillip Wolf, [*The 1968 Elections in New Mexico*, 22 W. Pol. Q. 510](https://www.jstor.org/stable/446344) (1969); [[w.peirce-mountain-states-of-america]]. See [[cal.1966-11-08.governors-nm]]. Names: Cargo, Chavez, Tijerina, Hawley. Check: the ruling that kept Tijerina off the ballot.'
        tags: [state:nm, name:cargo-david-f, name:chavez-fabian-jr, name:tijerina-reies-lopez, name:hawley-clifford-j]
  - add:
      entry:
        id: cal.1968-12.states-and-cities-nm
        when: Dec.
        date: 1968-12
        thread: states-and-cities
        c: 'Albuquerque. Tijerina, defending himself, acquitted by a State district court jury of the charges of the courthouse raid of June 5, 1967, on which he was tried (Check: the day, the counts).'
        n: '[Wikipedia, "Reies Tijerina"](https://en.wikipedia.org/wiki/Reies_Tijerina). See [[cal.1967-06-05.states-and-cities-nm]]. Names: Tijerina.'
        tags: [state:nm, name:tijerina-reies-lopez]
  # ---------------------------------------------------------------- Nevada
  - add:
      entry:
        id: cal.1968-04-26.testing-nv
        when: Apr. 26
        date: '1968-04-26'
        thread: testing
        also: [states-and-cities]
        c: 'Nevada Test Site, Pahute Mesa. Boxcar, an underground test of 1.3 megatons. Howard Hughes, in the Desert Inn, had pressed the government to put it off (Check: his appeal to Johnson).'
        n: 'Department of Energy, Nevada Operations Office, *United States Nuclear Tests, July 1945 through September 1992* (DOE/NV-209); Check: the page. [Wikipedia, "Operation Crosstie"](https://en.wikipedia.org/wiki/Operation_Crosstie). [[w.drosnin-citizen-hughes]]; [[w.elliott-history-of-nevada]]. See [[cal.1967-03-22.states-and-cities-nv]]. Names: Hughes.'
        tags: [state:nv, city:las-vegas, name:hughes-howard-r-jr]
  # ---------------------------------------------------------------- Oregon
  - add:
      entry:
        id: cal.1968-05-28.elections-1968-or
        when: May 28
        date: '1968-05-28'
        thread: elections-1968
        also: [war-opposition]
        c: 'Oregon''s Democratic primary for the Senate. Morse, seeking a fifth term, 185,091, 49.0 percent; Duncan, U.S. Representative 1963–67, who supports the war, 174,795, 46.3; one other 4.7. Packwood, a State representative, the Republican nominee.'
        n: 'Votes: [Wikipedia, "1968 United States Senate election in Oregon"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Oregon), from Our Campaigns; Check: [Or. *Official Abstract of Votes, Primary Election, May 28, 1968*](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411031/File/document) (the server failed from here, Oct. 17, 2026). [[w.drukman-wayne-morse]]. See [[cal.1966-05-24.elections-1966]]; [[cal.1968-05-28.elections-1968]]. Names: Morse, Duncan, Packwood.'
        tags: [state:or, name:morse-wayne, name:duncan-robert-b, name:packwood-robert-w]
  # ---------------------------------------------------------------- Alaska
  - add:
      entry:
        id: cal.1968-03-12.states-and-cities-ak
        when: Mar. 12
        date: '1968-03-12'
        thread: states-and-cities
        also: [conservation]
        c: 'Alaska. Atlantic Richfield and Humble Oil confirm oil at Prudhoe Bay State No. 1, on State land on the North Slope (Check: the day of the announcement).'
        n: '[Wikipedia, "Prudhoe Bay Oil Field"](https://en.wikipedia.org/wiki/Prudhoe_Bay_Oil_Field). [[w.coates-trans-alaska-pipeline-controversy]]; [[w.naske-alaska]]; [[w.hickel-who-owns-america]].'
        tags: [state:ak]
  - add:
      entry:
        id: cal.1968-08-27.elections-1968-ak
        when: Aug. 27
        date: '1968-08-27'
        thread: elections-1968
        also: [war-opposition]
        c: 'Alaska''s primary, every party on one ballot. Democratic, for the Senate: Gravel, once Speaker of the State House, 17,971, 52.9 percent, over Gruening, Senator since statehood, 16,015, 47.1. Republican: Rasmuson, an Anchorage banker, 10,320, 53.1; Stevens 9,111, 46.9.'
        n: 'Votes: [Wikipedia, "1968 United States Senate election in Alaska"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Alaska), from Our Campaigns; Check: [Alaska, *Official Returns by Election Precincts, Primary Election, August 27, 1968*](https://www.elections.alaska.gov/Core/Archive/68PRIM/68prim.pdf) (refused from here: the site''s certificate). [[w.gruening-many-battles]]; [[w.gravel-political-odyssey]]; [[w.naske-alaska]]. See [[cal.1966-11-08.governors-ak]]. Names: Gravel, Gruening, Rasmuson, Stevens.'
        tags: [state:ak, name:gravel-mike, name:gruening-ernest, name:rasmuson-elmer-e, name:stevens-ted-f]
  - add:
      entry:
        id: cal.1968-11-05.elections-1968-ak
        when: Nov. 5
        date: '1968-11-05'
        thread: elections-1968
        c: 'Alaska. Gravel (D) elected to the Senate, 36,527, 45.1 percent; Rasmuson (R) 30,286, 37.4; Gruening, on write-ins, 14,118, 17.4.'
        n: 'Votes: [Wikipedia, "1968 United States Senate election in Alaska"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Alaska), from Our Campaigns; Check: [Alaska, *Official Returns by Election Precincts, General Election, November 5, 1968*](https://www.elections.alaska.gov/Core/Archive/68GENR/68genr.pdf), and the Clerk''s *Statistics*. See [[cal.1968-08-27.elections-1968-ak]]; [[cal.1968-11-05.elections-1968]]. Names: Gravel, Rasmuson, Gruening.'
        tags: [state:ak, name:gravel-mike, name:rasmuson-elmer-e, name:gruening-ernest]
  # ---------------------------------------------------------------- legislatures, Nov. 5
  - add:
      entry:
        id: cal.1968-11-05.legislatures-ca
        when: Nov. 5
        date: '1968-11-05'
        thread: legislatures
        also: [elections-1968]
        c: 'California. Republicans take both houses: the Assembly 41 R–39 D, from 38–42; the Senate 21–19, from 20–20. Monagan, the Republican leader, Speaker in Unruh''s place at the session''s opening, Jan. 6, 1969 (Check the day).'
        n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1968 and 1969 (Check against Cal., *Statement of Vote, General Election, November 5, 1968*). [[w.boyarsky-big-daddy]]; [[w.cannon-governor-reagan]]. See [[cal.1966-01-11.legislatures-ca]]. Names: Monagan, Unruh.'
        tags: [state:ca, name:monagan-robert-t, name:unruh-jesse-m]
  - add:
      entry:
        id: cal.1968-11-05.legislatures-ak
        when: Nov. 5
        date: '1968-11-05'
        thread: legislatures
        also: [elections-1968]
        c: 'Alaska. Democrats take the House, 22–18, from 15 D–25 R; the Senate stays Republican, 11–9.'
        n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1968 and 1969 (Check against Alaska, *Official Returns*, Nov. 5, 1968). [[w.naske-alaska]].'
        tags: [state:ak]
  - add:
      entry:
        id: cal.1968-11-05.legislatures-nv
        when: Nov. 5
        date: '1968-11-05'
        thread: legislatures
        also: [elections-1968]
        c: 'Nevada. Republicans take the Assembly, 22–18, from 19 R–21 D; the Senate stays Democratic, 11–9.'
        n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1968 and 1969 (Check against the *Political History of Nevada*). [[w.elliott-history-of-nevada]]. See [[cal.1965-10-25.legislatures-nv]].'
        tags: [state:nv]
  # ---------------------------------------------------------------- Hawaii and Honolulu
  - add:
      entry:
        id: cal.1968-10-05.mayors-honolulu
        when: Oct. 5
        date: '1968-10-05'
        thread: mayors
        also: [elections-1968]
        c: 'Honolulu''s primaries for mayor, Blaisdell, mayor since 1955, running for the House. Democratic: Fasi, of the City Council, 44,034, 44.5 percent; Lemke 30,982, 31.3; two others. Republican: D. G. Anderson 20,704, 76.2. Nov. 5, Fasi elected over Anderson; Blaisdell beaten (Check: the figures).'
        n: '[*Primary Election, State of Hawaii, October 5, 1968*, final summary report](https://archive.org/download/HI-hist/1968_Primary.pdf); Check: the general election''s Oahu returns, [*Result of Votes Cast, General Election, November 5, 1968*](https://archive.org/download/HI-hist/1968_General.pdf). [[w.coffman-island-edge-of-america]]. Names: Blaisdell, Fasi, Lemke, Anderson.'
        tags: [state:hi, city:honolulu, name:blaisdell-neal-s, name:fasi-frank-f, name:lemke-herman-g-p, name:anderson-d-g]
  - add:
      entry:
        id: cal.1968-11-05.state-constitutions-hi
        when: Nov. 5
        date: '1968-11-05'
        thread: state-constitutions
        also: [legislatures]
        c: 'Hawaii. Of the 23 amendments the constitutional convention of 1968 proposed, the voters ratify 22; the eighth fails, 96,283 to 99,257. A legislature''s amendment carries, 111,911 to 59,661.'
        n: '[*Result of Votes Cast, General Election, November 5, 1968*](https://archive.org/download/HI-hist/1968_General.pdf), summary of votes cast by counties, certified Nov. 25, 1968. [[w.meller-with-an-understanding-heart]]; [[w.coffman-island-edge-of-america]]. See [[cal.1966-04-25.legislatures-hi]]. Check: the convention''s call, dates and president; the eighth amendment''s subject (the voting age?); the legislature''s amendment.'
        tags: [state:hi]
  # ---------------------------------------------------------------- California
  - add:
      entry:
        id: cal.1968-03-01.students-los-angeles
        when: Mar. 1–8
        date: '1968-03-01'
        thread: students
        also: [desegregation-schools]
        c: 'Los Angeles. Mexican American students walk out of the East Side''s high schools: Wilson, Mar. 1; Garfield, some 2,000, Mar. 5; Lincoln, Roosevelt and Garfield, Mar. 6; Belmont, Mar. 7; again Mar. 8. Mar. 28, the Board of Education hears the Educational Issues Coordinating Committee''s 39 demands. Thirteen organizers, Castro, a teacher at Lincoln, among them, later indicted for conspiracy (Check: the date, May 31).'
        n: '[Wikipedia, "East L.A. walkouts"](https://en.wikipedia.org/wiki/East_L.A._walkouts); Check: the board''s minutes, Mar. 28, 1968, and its answer; the grand jury''s indictment. [[w.haney-lopez-racism-on-trial]]; [[w.garcia-blowout]]; [[w.felker-kantor-policing-los-angeles]]. Names: Castro.'
        tags: [state:ca, city:los-angeles, name:castro-sal]
  - add:
      entry:
        id: cal.1968-10-02.students-los-angeles
        when: Oct. 2
        date: '1968-10-02'
        thread: students
        c: 'Los Angeles. Thirty-five arrested at the Board of Education after an eight-day sit-in for Castro''s return to his classroom at Lincoln. The board returns him (Check: the date).'
        n: '[Wikipedia, "East L.A. walkouts"](https://en.wikipedia.org/wiki/East_L.A._walkouts). See [[cal.1968-03-01.students-los-angeles]]. Names: Castro.'
        tags: [state:ca, city:los-angeles, name:castro-sal]
  - add:
      entry:
        id: cal.1968-06-04.elections-1968-ca
        when: June 4
        date: '1968-06-04'
        thread: elections-1968
        c: 'California''s primaries for the Senate. Republican: Rafferty, Superintendent of Public Instruction, 1,112,947, 50.0 percent; Kuchel, the minority whip, seeking a fourth term, 1,043,315, 46.9; three others. Democratic: Cranston, State controller 1959–67, 1,681,825, 59.0 percent; Beilenson, a State senator, 22.6; three others.'
        n: 'Cal., [*Statement of Vote, Consolidated Primary Election, June 4, 1968*](https://archive.org/details/californiastate196668cali/page/n152); the figures as [Wikipedia, "1968 United States Senate election in California"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_California), gives them, from Our Campaigns (Check against the Statement, its page). [[w.kabaservice-rule-and-ruin]]; [[w.peirce-megastates-of-america]]. See [[cal.1968-06-04.elections-1968]]. Names: Rafferty, Kuchel, Cranston, Beilenson.'
        tags: [state:ca, name:rafferty-max, name:kuchel-thomas-h, name:cranston-alan, name:beilenson-anthony-c]
  - add:
      entry:
        id: cal.1968-09-20.students-ca
        when: Sept. 20
        date: '1968-09-20'
        thread: students
        also: [black-nationalism]
        c: 'Berkeley. The Regents of the University of California limit a lecturer without faculty appointment to one appearance a quarter in a course for credit: Cleaver, of the Black Panthers, engaged to give most of the lectures of Social Analysis 139X. Reagan, a Regent, against his teaching.'
        n: '[[w.rorabaugh-berkeley-at-war]]; [[w.rosenfeld-subversives]]; [[w.cannon-governor-reagan]]. See [[cal.1967-01-20.students]]. Names: Cleaver, Reagan. Check: the day of the Regents'' vote, the vote and the resolution''s terms; the sit-in at Moses Hall, Oct. 23, and the arrests.'
        tags: [state:ca, city:berkeley, name:cleaver-eldridge, name:reagan-ronald]
  - add:
      entry:
        id: cal.1968-11-05.state-constitutions-ca
        when: Nov. 5
        date: '1968-11-05'
        thread: state-constitutions
        also: [state-and-city-finance]
        c: 'California''s propositions. Adopted: 1-A, a homeowner''s exemption from the property tax, the State paying the localities what they lose, from the extraordinary session Reagan called in 1968, 3,500,368 to 3,058,978, 53.4 percent. Rejected: 9, Watson''s initiative limiting the property tax, 2,146,010 to 4,570,097, 32.0 percent; 1, a revision of the constitution''s articles on schools, cities and counties and public utilities, 2,606,748 to 3,462,301; 3, bonds for the State colleges, the University and urban schools.'
        n: 'Cal., [*Statement of Vote, General Election, November 5, 1968*, 27–31](https://archive.org/details/californiastate196668cali/page/n204) (Proposition 9, [30](https://archive.org/details/californiastate196668cali/page/n207)); 1-A: S.C.A. 1, ch. 9, and S.B. 8, ch. 1, Cal. Stats. 1968, 1st Ex. Sess. [[w.cannon-governor-reagan]]; [[w.peirce-megastates-of-america]]. See [[cal.1967-07-29.state-and-city-finance-ca]]; [[cal.1966-11-08.state-constitutions-ca]]. Names: Reagan, Watson. Check: the vote on 3.'
        tags: [state:ca, name:reagan-ronald, name:watson-philip-e]
  # ---------------------------------------------------------------- San Francisco State
  - add:
      entry:
        id: cal.1968-11-13.students-san-francisco
        when: Nov. 13–20
        date: '1968-11-13'
        thread: students
        c: 'San Francisco State. President Smith closes the college after the day''s fighting. Reagan: "an act of capitulation"; "as long as I am Governor, our publicly supported institutions of higher education are going to stay open." Unruh wires him to reopen it. The trustees, Nov. 18, against negotiation. Classes resume Nov. 20 with a convocation.'
        n: '[[w.orrick-shut-it-down]], 45–46. See [[cal.1968-11-06.students]]. Names: Smith, Reagan, Unruh.'
        tags: [state:ca, city:san-francisco, name:smith-robert-r, name:reagan-ronald, name:unruh-jesse-m]
  - add:
      entry:
        id: cal.1968-11-26.students-san-francisco
        when: Nov. 26
        date: '1968-11-26'
        thread: students
        c: 'Los Angeles. Smith resigns the presidency of San Francisco State at the trustees'' meeting, unable "to reconcile effectively the conflicts between the Trustees and Chancellor, the faculty groups on campus, the militant student groups, and political forces of the State." The trustees adopt ten disciplinary rules. Hayakawa, of the English faculty, acting president.'
        n: '[[w.orrick-shut-it-down]], 54–55, 62. See [[cal.1968-11-06.students]]. Names: Smith, Hayakawa.'
        tags: [state:ca, city:san-francisco, name:smith-robert-r, name:hayakawa-s-i]
  - add:
      entry:
        id: cal.1968-12-02.students-san-francisco
        when: Dec. 2–3
        date: '1968-12-02'
        thread: students
        c: 'San Francisco State, reopened by Hayakawa under a "state of emergency" declared Nov. 30. Dec. 2: he climbs a strikers'' sound truck and pulls out its wires. Dec. 3, "Bloody Tuesday": 9 injured, 31 arrested; black community leaders on the campus for the students'' demands.'
        n: '[[w.orrick-shut-it-down]], 58–61. See [[cal.1968-11-06.students]]. Names: Hayakawa.'
        tags: [state:ca, city:san-francisco, name:hayakawa-s-i]
  - add:
      entry:
        id: cal.1969-01-06.students-san-francisco
        when: Jan. 6
        date: '1969-01-06'
        thread: students
        also: [jobs-and-wages]
        c: 'San Francisco State. The American Federation of Teachers'' local strikes, sanctioned by the San Francisco Labor Council: grievance procedures, amnesty for the strikers, the students'' demands settled, the trustees'' ten rules rescinded. Hayakawa: "a militant minority of the faculty has hitchhiked onto the militant, violence-ridden student strike for a vicious power grab."'
        n: '[[w.orrick-shut-it-down]], 62–63. See [[cal.1968-11-06.students]]. Names: Hayakawa.'
        tags: [state:ca, city:san-francisco, name:hayakawa-s-i]
