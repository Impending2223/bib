- edit:
    id: cal.1967-06-06.middle-east
    base: a7d2889a
    kind: correct
    set:
      c: 'The Security Council, unanimous, Resolution 233: a cease-fire.{1}'
      n: 'Security Council Resolution [233 (1967)](https://undocs.org/S/RES/233(1967)). See [[cal.1967-06-05.middle-east]]. The oil embargo: [[cal.1967-06-06.oil]]. Split under R25b and R17: FRUS XXXIV,
        doc. 233, gives Radio Cairo''s charge its own hour, 7:40 a.m.; it, the closing of the canal and the breaks in relations are entries of their own, with their sources (Drea, 443, and his list of the
        breaks, there). The Papers'' note (598) gives Johnson''s statement its own hour, 8 p.m.'
      src:
        rows:
        - 'https://undocs.org/S/RES/233(1967): 1'
    settles:
    - 'Check: Drea lists Algeria'
    unset:
    - tags
- add:
    entry:
      id: cal.1967-06-06.middle-east-six-day-war-6
      when: June 6
      date: '1967-06-06'
      place: washington
      thread: middle-east-six-day-war
      follows:
      - cal.1967-06-06.middle-east
      time: 1967-06-07T00:00Z
      time_zone: America/New_York
      c: 'Johnson, reading a statement in the White House Theater, 8 p.m.: the Security Council''s cease-fire vote "opens a very hopeful path away from danger in the Middle East"; a cease-fire the necessary
        "first step" toward "settled peace."'
      n: 'Statement by the President on the United Nations Security Council''s Cease-Fire Vote in the Middle East Situation, [1967 Pub. Papers 598](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=666)
        (June 6, 1967) (the Papers'' note: read by the President at 8 p.m. in the White House Theater). [[w.dallek-flawed-giant]], 430–31 (the evening of June 6, Johnson announces support of "a simple cease-fire"
        as a necessary first step toward a "settled peace"). See [[cal.1967-06-06.middle-east]]. The order: after [[cal.1967-06-06.middle-east]], the vote it welcomes. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- edit:
    id: cal.1967-06-09.middle-east
    base: c7e3b77e
    kind: correct
    set:
      c: June 9, Israel attacks Syria on the Golan Heights.{1}
      n: 'FRUS 1964–68, XIX, docs. [243](https://history.state.gov/historicaldocuments/frus1964-68v19/d243), [244](https://history.state.gov/historicaldocuments/frus1964-68v19/d244), [246](https://history.state.gov/historicaldocuments/frus1964-68v19/d246),
        [247](https://history.state.gov/historicaldocuments/frus1964-68v19/d247), [252](https://history.state.gov/historicaldocuments/frus1964-68v19/d252), [255](https://history.state.gov/historicaldocuments/frus1964-68v19/d255).
        [[w.dobrynin-in-confidence]], 165–66 (the hot line, the fleet, the break, the cease-fire; not the words quoted, nor the men with Johnson); [[w.dallek-flawed-giant]], 431 (Syria agrees to halt June
        9, Israel fights on, to June 10; Johnson orders the Sixth Fleet east; Israel agrees to a cease-fire on all fronts; not the hot-line text or the others at the table). Made public: Helms''s account
        of the morning of June 10, in Saunders''s memorandum of Oct. 22, 1968, FRUS 1964–68, XIX (2004). See [[cal.1967-06-05.middle-east]]. Split under R25b and R17: FRUS XIX, doc. 243, gives Kosygin''s
        message on the hot line its own hour, 8:48 a.m., June 10 (already an entry of June 10); the Soviet break with Israel, the cease-fire on the Syrian front and Resolution 236 are now entries of their
        own. FRUS XIX, doc. 223, has the UAR''s acceptance by the end of June 8, and doc. 236, note 2, Nasser''s address of June 9 and his withdrawal the next day. Check: FRUS XIX, doc. 223 (June 8, 9:53
        p.m.), has the artillery and air bombardment of the Syrian positions on the heights begun June 8.'
      when: June 9
    unset:
    - tags
- add:
    entry:
      id: cal.1967-06-08.middle-east-six-day-war-2
      when: June 8
      date: '1967-06-08'
      place: nyc
      thread: middle-east-six-day-war
      c: 'Egypt accepts the cease-fire, provided Israel does too: the UAR government notifies the Secretary-General, U Thant, by the end of the day.'
      n: '[FRUS 1964–68, XIX, doc. 223](https://history.state.gov/historicaldocuments/frus1964-68v19/d223) (circular telegram, June 8, 9:53 p.m.: "By end of day UAR Government notified SYG Thant it accepts
        cease-fire provided Israel does too"; Israel had already signified it would). Check: the hour; the older line has the night of June 8. See [[cal.1967-06-09.middle-east]]. Names: U Thant.'
      tags:
      - name:u-thant
      - ok:fields-time
