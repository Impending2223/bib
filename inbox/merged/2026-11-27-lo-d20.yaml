      n: 'FRUS 1964–68, VI, doc. [63](https://history.state.gov/historicaldocuments/frus1964-68v06/d63) (Saigon, "February 9, 1968, 1633Z"). [[w.westmoreland-soldier-reports]], 350–51 (Westmoreland: the
        82d Airborne and half a Marine division, "a six-month loan"; the enemy''s three phases); [[w.drea-mcnamara-clifford-and-the-2011]], 182 (Westmoreland''s assessment of Feb. 9: reinforcements welcome
        at any time); 182 n.41 (msg MAC 1858 Westmoreland to Wheeler, 9 Feb 68). Made public: the Pentagon Papers (1971); FRUS 1964–68, VI (2002). See [[cal.1968-01-30.vietnam]]; [[cal.1968-02-08.vietnam-tet-4]].
        The document is Westmoreland''s MAC 1858, answering Wheeler''s JCS 1590 (090021Z) and Sharp''s cable of 090359Z; FRUS VI, doc. 63, notes 1 and 2, dates Wheeler''s JCS 1529 Feb. 7 and JCS 1590 Feb.
        9. The day is the cable''s date-time group''s, 091633Z, as FRUS prints it: 1633Z is 11:33 a.m. Feb. 9 in Washington, 12:33 a.m. Feb. 10 in Saigon. Names: Wheeler, Westmoreland, Sharp. Check: the
        day by Saigon''s clock, Feb. 10.'
