- edit:
    id: cal.1967-06-09.middle-east-six-day-war-2
    base: acbe0e53
    set:
      n: '[Notes of a Meeting of the Special Committee, June 9, 1967, 6:30 p.m., FRUS 1964–68, XIX: Arab-Israeli Crisis and War, 1967, doc. 236](https://history.state.gov/historicaldocuments/frus1964-68v19/d236)
        (Saunders''s notes; the President present 6:53 to 7:53 p.m., by the Daily Diary; note 8: "Israel: leaves stuff in pipeline"). [[w.drea-mcnamara-clifford-and-the-2011]], 446. See [[cal.1967-06-07.middle-east-six-day-war-4]].'
      time: 1967-06-09T22:30Z
      time_zone: America/New_York
      place: washington
    unset:
    - time_range
    - time_band
    - range_basis
- add-words:
    id: cal.1967-06-09.middle-east-six-day-war-2
    after: end
    words: 'The committee meets at 6:30 p.m., Johnson in and out from 6:53 to 7:53. Rusk: not to proceed on the basis that Nasser is out. Clifford on the *Liberty*: handle it as if the Arabs or the Soviets
      had done it, and punish the Israelis responsible; Johnson, by the note-taker, "subscribed 100%." McGeorge Bundy: stop everything to Lebanon, Jordan and the countries that broke relations; "Help them
      come apart." Johnson on Eshkol: "I had a firm commitment from Eshkol & he blew it."'
    text: FRUS 1964–68, XIX, doc. [236](https://history.state.gov/historicaldocuments/frus1964-68v19/d236)
