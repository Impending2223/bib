      c: 'Zhou Enlai, at the Diaoyutai, chairs the Center''s small briefing meeting, Chen Boda, Kang Sheng and Jiang Qing attending: "today''s meeting relays an important decision of Chairman Mao." He reads
        out Yang Chengwu''s record of Mao''s instruction word for word. Wang Li and Guan Feng are then put under isolation and examination.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179 (Aug. 26, 1967: after Yang''s noon report, 之后, the 中央小碰头会, Chen Boda, Kang Sheng, Jiang Qing and others; Mao''s instruction conveyed; 随后, then, Wang
        Li and Guan Feng isolated for examination; read on the page image); [[w.yang-jisheng-tiandi-fanfu]], I, 545 (晚上, in the evening, at the Diaoyutai; the words quoted; Yang''s record read word for
        word; then the isolation); [[w.jian-zhou-enlai]], 583 (that evening Zhou reads Mao''s instructions, sentence by sentence, to Jiang Qing, Chen Boda, Kang Sheng and the other Group members; Wang and
        Guan promptly arrested); [[w.mao-zedong-zhuan]], VI, ch. 76 n.68 (that night at the Diaoyutai Zhou chairs a small meeting of the Center''s leaders, Chen Boda, Kang Sheng, Jiang Qing and others attending,
        and reads out Mao''s instruction word by word; Wang Li and Guan Feng are then isolated); [[w.jianguo-yilai-mao-zedong]], XIX, 440 n.14 (the editors: in Aug. 1967 the Center decided to suspend Wang
        Li and Guan Feng from their posts for investigation; no day); [[w.liu-jixian-ye-jianying-nianpu]], II, 970 (Aug. 26, 1967; on Mao''s instruction Wang Li 王力 and Guan Feng 关锋 put in isolation for
        examination 隔离审查). Made public: 2020. To check: Central Committee, decision of Aug. 1967 to suspend Wang Li and Guan Feng for investigation (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 440 n.14a);
        Yang Chengwu 杨成武, account of Mao''s decision on Wang Li, Guan Feng and Qi Benyu, Aug. 1967, in [[w.zhang-zishen-yang-chengwu-jiangjun-fangtanlu]], 43–45 (cited by [[w.mao-zedong-zhuan]], VI, ch.
        76 n.68); [[w.zhou-enlai-zhuan-1949]], 1928 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 545 n.78); Yan Changgui 閻長貴, 〈戚本禹、閻長貴說「文革」〉, *Wangshi* 《往事》, no. 119 (Mar. 29, 2013) (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 545 n.79); Han Suyin 韓素音, *Zhou Enlai he ta de shiji* 《周恩來和他的世紀》 (Zhongyang wenxian chubanshe, 1992), 472 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 545 n.80). See [[cal.1967-08-26.china-leadership]].
        The order: after [[cal.1967-08-26.china-leadership]], Zhou told at noon, the nianpu, III, 179 ("之后"), and Yang Jisheng, I, 545. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yang Chengwu,
        Mao Zedong, Wang Li, Guan Feng.'
      tags:
