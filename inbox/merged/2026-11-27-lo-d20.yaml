      thread: vietnam-tet
      c: 'Wheeler to Westmoreland, JCS 1529: the enemy''s build-up at Khe Sanh may be meant to draw his troops north and expose the South; the 82d Airborne and half a Marine division could be sent. "If
        you need more troops, ask for them."'
