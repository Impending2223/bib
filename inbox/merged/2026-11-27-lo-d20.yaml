      c: In the afternoon Zhou Enlai flies back to Peking from Wuhan with Li Zuopeng, by Yang Jisheng's account taking off after the plane carrying Wang Li and Xie Fuzhi.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967: 下午，飞回北京, "in the afternoon, flies back to Peking," read on the page image); [[w.yang-jisheng-tiandi-fanfu]], I, 537 (the afternoon of
        the 22nd: Zhou puts Wang Li and Xie Fuzhi on their plane; his and Li Zuopeng''s plane takes off later; over Peking he has theirs circle so that he lands first); [[w.macfarquhar-maos-last-revolution]],
        212 (Zhou has Xie and Wang''s plane circle so that his own lands first). Made public: 2020. See [[cal.1967-07-22.china-leadership-4]]. The order: after [[cal.1967-07-22.china-leadership-4]], the
        meeting at the Wangjiadun airfield, the nianpu, III, 168 ("下午," after it). Names: Zhou Enlai, Li Zuopeng, Wang Li, Xie Fuzhi.'
      tags:
