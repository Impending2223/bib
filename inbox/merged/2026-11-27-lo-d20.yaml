        235 n.17, n.19); Daily Guide, Aug. 24, 1967 (cited by [[w.califano-triumph-and-tragedy-of]], 235 n.18). See [[cal.1967-08-22.states-and-cities]]. Names: Johnson, Califano. Check: the day. Califano''s
