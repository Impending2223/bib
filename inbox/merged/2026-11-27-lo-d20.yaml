        [[w.barrett-uncertain-warriors]], 115 (Feb. 8: "if you need more troops ask for them"); [[w.drea-mcnamara-clifford-and-the-2011]], 182 (Feb. 8, the first of two cables: MACV needs reinforcements);
        181 n.35 (msg JCS 1529 Wheeler to Westmoreland, 8 Feb 68). To check: Wheeler to Westmoreland, JCS 1529, Westmoreland Eyes Only message files, Feb. 1968, CMH (cited by [[w.drea-mcnamara-clifford-and-the-2011]],
        181 n.35); [[w.schandler-unmaking-of-a-president]], 92, 95 (cited by [[w.barrett-uncertain-warriors]], 115 n.20). Made public: FRUS 1964–68, VI (2002). Check: the day: FRUS''s note has Feb. 7; Drea
        (182; 181 n.35) and Barrett (115) have Feb. 8. Names: Wheeler, Westmoreland.'
      tags:
      - name:wheeler-earle
      - name:westmoreland-william
