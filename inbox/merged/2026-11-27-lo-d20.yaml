      - vis:only:prc
      gloss:
        title: Commentary
        text:
        - 'Yan Changgui (2013), then Jiang Qing''s secretary, as Yang Jisheng quotes him: Jiang Qing wept when Zhou left, her heart "very heavy" at the isolation of Wang Li and Guan Feng ([[w.yang-jisheng-tiandi-fanfu]],
          I, 545).'
