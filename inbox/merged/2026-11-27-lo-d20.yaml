- edit:
    id: cal.1967-07-22.china-leadership-4
    base: 5cb312bb
    kind: correct
    set:
      c: Zhou Enlai calls Ye Ming, Kong Qingde, Li Zuopeng and Liu Feng at the Wangjiadun airfield, Wuhan, and has Kong Qingde run the Wuhan Military Region for the time. The Wuhan air force is under double
        leadership and is to follow the Region's command, not take stands at will. Chen Zaidao and Zhong Hanhua are to take a stand quickly and win the initiative.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967); [[w.macfarquhar-maos-last-revolution]], 212 (at the city airport Zhou hands command of the Region to Kong Qingde and Ye Ming, to work
        from the 29th Division''s headquarters). After [[cal.1967-07-22.china-leadership-6|Shanpo]]: Zhou sees Wang Li and Xie Fuzhi off at Shanpo, "then rushed to the city airport," where he hands Kong
        Qingde and Ye Ming the Region ([[w.macfarquhar-maos-last-revolution]], 212). Made public: 1994. To check: [[w.li-insiders-account-of-the]], 73 (cited by [[w.macfarquhar-maos-last-revolution]], 212
        n.49a). The nianpu (III, 168, read on the page image) has his flight back to Peking that afternoon, an act of its own. Names: Zhou Enlai, Ye Ming, Kong Qingde, Li Zuopeng, Liu Feng, Chen Zaidao,
        Zhong Hanhua.'
- add:
