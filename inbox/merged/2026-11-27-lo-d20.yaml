- edit:
    id: cal.1967-08-16.vietnam-support
    base: 7cd720e9
    kind: correct
    set:
      c: 'East Room, 1:18 p.m.: Johnson presents the Vietnam Civilian Service Awards to six civilians of the USIA, State and AID, Francis Savage posthumously. Lady Bird Johnson and Henry Cabot Lodge, the
        former Ambassador, are on the stage. By Mrs. Johnson''s account the recipients, AID workers and members of a church group, worked in Saigon hospitals and schools.'
      n: 'Remarks Upon Presenting the Vietnam Civilian Service Awards, [1967 Pub. Papers 779](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=171) (Aug. 16, 1967) (the Papers''
        note: spoken at 1:18 p.m. in the East Room; awards to Scotton, Kim, O''Neill, James, Shepley and Savage, the last posthumous). [[w.johnson-white-house-diary]], 559. The Papers give 1:18 p.m. and
        the six names; Mrs. Johnson''s diary has "early" and a small group with a church group among it. Names: Johnson, Lady Bird Johnson, Lodge.'
      time: 1967-08-16T17:18Z
      time_zone: America/New_York
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:lodge-henry-cabot
- edit:
    id: cal.1967-08-21.press-and-broadcasting
    base: 3f3d2b11
    kind: correct
    set:
      n: '[[w.califano-triumph-and-tragedy-of]], 172; [[w.graham-uncertain-triumph]], 174–75. Check: Graham, 174, has Cater persuade Johnson to approve the leak (Cater to Johnson, July 12, 1967, 257 n.31).
        To check: Califano to Johnson, July 24, 1967, 11 a.m., Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 172 n.13); [*New York Times*, Aug. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/08/21/issue.html)
        (cited by [[w.graham-uncertain-triumph]], 175 n.33). Califano (172) has Cater''s scolding that morning, after the story. Names: Califano, Johnson.'
      c: 'Marjorie Hunter in the *New York Times*, the second lead on the front page: the Friday task force''s secret report on education, the programs to stay concentrated on poor urban and rural children.{1}
        Califano had leaked it through an intermediary at Johnson''s order.{2}'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
