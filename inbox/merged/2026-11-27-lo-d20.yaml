    set:
      c: 'New York, the day Johnson names Clifford for McNamara. Robert Kennedy, in the car to Westchester County with Newfield and Ronnie Eldridge: "He might just as well have appointed Attila the Hun!"{1}
        Before he would run, Johnson shown psychotic, or the Senate''s doves asking him, or "one more politician of the national stature of Unruh."{2}'
      n: '[[w.chester-american-melodrama]], 107–8; [[w.shesol-mutual-contempt]], 412 ("He might just as well have appointed Attila the Hun!"); [[w.schlesinger-robert-kennedy-and-his]], 838 ("if one more
        politician, on the level of Unruh, asks me to run, I''ll do it"; none of the Senate doves wants it). See [[cal.1968-01-19.defense]]. Chester (108) and Schlesinger (838) have the dinner after the
        cocktail party, that night. Names: Robert Kennedy, Clifford, McNamara, Unruh, Johnson, Newfield.'
