      c: 'The Senate Foreign Relations Committee, in closed session, on the Gulf of Tonkin attacks of August 1964: McNamara and Wheeler before Fulbright''s committee.{1} McNamara: the second attack, Aug.
        4, took place.{2} McNamara: the suggestion that the government induced the incident "monstrous."{4} Fulbright: "I regret it more than anything I have ever done in my life, that I was the vehicle
        which took that resolution to the floor." Morse: "a confused bungle."{5}'
      n: 'Daily Digest, [114 Cong. Rec. D52](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=50). *The Gulf of Tonkin, the 1964 Incidents: Hearing Before the Senate
        Committee on Foreign Relations*, 90th Cong., 2d Sess. (1968). [[w.mann-grand-delusion]], 578–80; [[w.cq-weekly-report]], Mar. 1, 1968, 384. [[w.mcnamara-in-retrospect]], ch. 5 at n.18 (Fulbright:
        "I never meant to leave the impression that I thought you were deliberating trying to deceive us"; Mansfield, Pell and Symington the same). [[w.woods-j-william-fulbright-vietnam]], 168–69 (the closed
        session, seven and a half hours; Herrick''s cables of Aug. 3 and 4, 1964, read by Fulbright; McNamara''s 21-page statement to the press after, "monstrous"); [[w.woods-fulbright]], 477–78 (seven
        and a half hours; Herrick''s cables; McNamara''s twenty-one pages to the press, "monstrous"); [[w.zaroulis-who-spoke-up]], 154 (Feb. 20: McNamara before Fulbright''s committee; "highly classified
        and unimpeachable intelligence" confirms the attacks of Aug. 2 and 4, 1964; the ships on "an intelligence gathering mission"; the testimony released four days later). Check: Woods''s note (169 n.33)
        gives the hearing as of Feb. 21. Check: Woods dates the hearing Feb. 20 (477) and cites the transcript as of Feb. 21 (477 n.36). To check: [[w.moise-tonkin-gulf-and-the]]; [[w.goulden-truth-is-the-first]];
