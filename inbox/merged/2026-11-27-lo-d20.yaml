        FRUS VI, doc. 79, has the testimony made public on Feb. 24. Check: FRUS VI, doc. 79, has McNamara release a statement on his testimony, without the committee''s approval, on Feb. 21 (citing the
        *New York Times* of that day); Woods (169, 477–78) has the twenty-one pages to the press after the session, with "monstrous." Names: McNamara, Wheeler, Fulbright, Morse.'
