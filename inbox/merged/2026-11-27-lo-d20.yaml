      time: 1968-02-09T00:21Z
      time_zone: America/New_York
      c: 'Wheeler to Westmoreland, JCS 1590, 7:21 p.m.: he is not trying to sell more forces, which he cannot guarantee, but "the critical phase of the war is upon us"; Westmoreland should not "refrain
        from asking for what you believe is required." By Clifford''s account he asks that further messages on troops go by the back channel.'
      n: 'FRUS 1964–68, VI, doc. [63](https://history.state.gov/historicaldocuments/frus1964-68v06/d63), note 2 (JCS 1590, "February 9"), and the document''s reference line, "JCS 01590, DTG 090021Z." [[w.drea-mcnamara-clifford-and-the-2011]],
        182 (the same day as Bunker''s cable of Feb. 8, the second of Wheeler''s two cables urges Westmoreland to ask for more troops); 181 n.35 (msg JCS 1590 Wheeler to Westmoreland, 8 Feb 68); [[w.longley-lbjs-1968]],
        62 (Feb. 8, the words quoted); [[w.westmoreland-soldier-reports]], 351 (the words quoted, no day); [[w.clifford-counsel-to-the-president-2]], 476–77 (after a meeting Clifford dates Feb. 8, the words
        quoted; further messages on troops by the back channel). Made public: the Pentagon Papers (1971); FRUS 1964–68, VI (2002). The day is Washington''s: 090021Z, the date-time group, is 7:21 p.m. Feb.
        8 there; FRUS''s note 2, and Drea''s notes 37 and 39 (182), give Feb. 9, the Zulu day. Check: Clifford''s note (477 n.12) gives the words to JCS 01589 of Feb. 9. See [[cal.1968-02-07.vietnam-tet-3]].
        Names: Wheeler, Westmoreland.'
