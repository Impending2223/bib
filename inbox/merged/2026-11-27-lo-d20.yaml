    base: 52384d7c
    kind: correct
    set:
      c: Johnson's deputy mayor, Thomas Fletcher of San Diego, found by the FBI at a traffic light in Rapid City, S.D., at about 11 a.m., flown by jet fighter from Ellsworth Air Force Base.
      n: '[[w.califano-triumph-and-tragedy-of]], 235 (at about eleven that morning, at a traffic light in Rapid City, an FBI agent tells him to call the White House; Califano on the telephone: he is needed
        that evening; the FBI has his suit pressed and drives him to Ellsworth, where a jet fighter takes him to Andrews). To check: President''s Daily Diary, Aug. 24, 1967 (cited by [[w.califano-triumph-and-tragedy-of]],
        235 n.17, n.19); Daily Guide, Aug. 24, 1967 (cited by [[w.califano-triumph-and-tragedy-of]], 235 n.18). Califano (235) has him in his office by 7:15 that evening and the night in the mansion, acts
        of their own. Names: Johnson. Check: the day. Califano''s text runs from Monday, Aug. 21, to "the next day" and "the next morning," Aug. 23, but his notes cite the President''s Daily Diary of Aug.
        24 for the morning and the bedroom (235 n.17, n.19) and the Daily Guide of Aug. 24 for 7:15 p.m. (235 n.18); his "a week later, on September 6" would make it Aug. 30. Check: whose clock "about eleven"
        is, Washington''s or Rapid City''s.'
      time: 1967-08-23T17:00Z
      time_approx: true
      time_zone: America/Denver
      place: rapid-city
      tags:
      - name:johnson-lyndon-b
