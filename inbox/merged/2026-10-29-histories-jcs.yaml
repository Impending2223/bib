- add:
    entry:
      id: cal.1965-05-14.vietnam
      when: May 14
      date: '1965-05-14'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Westmoreland''s first request for B-52 strikes in South Vietnam, MACV 16006: area targets in Kon Tum Province and War Zone D, where his intelligence places the headquarters of the 325th North Vietnamese Division and of two Viet Cong military regions. "I strongly recommend, therefore, that as a matter of urgency, we be authorized to employ SAC B-52 aircraft against selected targets in RVN."'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 298. To check: COMUSMACV 16006 to CINCPAC, May 14, 1965, JCS IN 59699 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 298 n.18). See [[cal.1965-04-20.vietnam]]. Names: Westmoreland.'
