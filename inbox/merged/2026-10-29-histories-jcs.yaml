- add:
    entry:
      id: cal.1968-05-21.vietnam-force-levels
      when: May 21
      date: '1968-05-21'
      thread: vietnam-force-levels
      also:
      - defense
      c: 'JCSM-315-68, Wheeler for the Joint Chiefs to Clifford, answering his questions of May 13: "What can we do to get help to Westmoreland if he becomes involved in another major enemy offensive?" No Army forces in the United States deployable; four brigades above Program 6, about 17,000 men, in May–August, by drawing down the strategic reserve, and not to be sustained; the Seventh Fleet for a surge of about 30 days, carriers on line from three to five; one and one-ninth Marine division/wing teams only by extending terms of service, and not sustained without mobilization.'
      n: 'FRUS 1964–68, VI, doc. [239](https://history.state.gov/historicaldocuments/frus1964-68v06/d239). [[w.cosmas-joint-chiefs-of-staff]], 207 (the question; the reply). See [[cal.1968-05-05.vietnam]]. Names: Wheeler, Clifford, Westmoreland. Check: Cosmas, 207, has the four brigades in July and August.'
      tags:
      - name:wheeler-earle
      - name:clifford-clark
      - name:westmoreland-william
      src:
        c: a2f65c88
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d239: all'
