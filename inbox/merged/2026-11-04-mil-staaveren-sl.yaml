patch: mil-staaveren-sl
by: 'Claude (the military re-read, group af: Van Staaveren, Interdiction in Southern Laos, 1993), Nov. 5, 2026'
ops:
- add:
    entry:
      id: cal.1964-06-24.laos
      when: June 24
      date: '1964-06-24'
      thread: laos
      also:
      - vietnam
      c: 'Leaping Lena: the first team of South Vietnamese scouts parachuted into the Laotian panhandle, three more the next
        day, a fifth July 2, to watch the routes for up to thirty days. Nearly a total failure: one team lost, one captured.'
      n: '[[w.staaveren-u-s-air-force]], 30.'
      src:
        c: e689898f
        rows:
        - 'w.staaveren-u-s-air-force 30: all'
- add:
    entry:
      id: cal.1964-06-27.laos
      when: June 27
      date: '1964-06-27'
      thread: laos
      also:
      - vietnam
      c: State and Defense approve, for the first time, joint American and South Vietnamese planning for covert and overt
        operations across the border into Laos.
      n: '[[w.staaveren-u-s-air-force]], 32. See [[cal.1964-06-24.laos]].'
      src:
        c: 64b4ea83
        rows:
        - 'w.staaveren-u-s-air-force 32: all'
- add:
    entry:
      id: cal.1965-04-05.laos
      when: Apr. 5
      date: '1965-04-05'
      thread: laos
      c: The Navy's first Steel Tiger mission, five A-1Hs to strike, two F-8Ds against the flak, two F-8s; the Air Force's
        F-105s' first, Apr. 11, on two routes and a military site at Ban Langkhang.
      n: '[[w.staaveren-u-s-air-force]], 59. See [[cal.1965-04-03.laos]].'
      src:
        c: a388060a
        rows:
        - 'w.staaveren-u-s-air-force 59: all'
- add:
    entry:
      id: cal.1965-05-23.laos
      when: May 23
      date: '1965-05-23'
      thread: laos
      c: The first Whiplash F-105 strike, on an enemy village, a Victor control C-123 with a Laotian observer as forward air
        controller; fifteen rockets and 20-mm fire.
      n: '[[w.staaveren-u-s-air-force]], 65. See [[cal.1965-04-17.laos]].'
      src:
        c: ea6f35c6
        rows:
        - 'w.staaveren-u-s-air-force 65: all'
- add:
    entry:
      id: cal.1965-10-18.laos-2
      when: Oct. 18–22
      date: '1965-10-18'
      thread: laos
      also:
      - vietnam
      c: 'Shining Brass''s first team, eleven South Vietnamese and some American Army advisers, flown by VNAF CH-34 into the
        panhandle with an Air Force forward air controller and two strike planes: it finds an encampment and supply base;
        its Vietnamese leader killed in a skirmish; lifted out early Oct. 22. Launch put off from Oct. 15 by weather.'
      n: '[[w.staaveren-u-s-air-force]], 92. See [[cal.1964-06-27.laos]].'
      src:
        c: 06f9a6ba
        rows:
        - 'w.staaveren-u-s-air-force 92: all'
- add:
    entry:
      id: cal.1965-11-23.laos
      when: Nov. 23
      date: '1965-11-23'
      thread: laos
      c: Westmoreland's first request for a B-52 strike in Laos, on a jungle area on the border of Thac Hiet and Quang Tin.
      n: '[[w.staaveren-u-s-air-force]], 95. Names: Westmoreland.'
      src:
        c: 86dfdab3
        rows:
        - 'w.staaveren-u-s-air-force 95: all'
      tags:
      - name:westmoreland-william
- cite:
    id: cal.1965-12-06.laos
    item: '[[w.staaveren-u-s-air-force]], 97, 100–01 (approved Dec. 3; the first missions Dec. 5; defoliation of routes from
      Dec. 6 by two Ranch Hand UC-123s)'
- check:
    id: cal.1965-12-06.laos
    text: 'Check: Van Staaveren dates the first Tiger Hound missions Dec. 5 (100)'
- add:
    entry:
      id: cal.1965-12-10.laos
      when: Dec. 10
      date: '1965-12-10'
      thread: laos
      also:
      - vietnam-air-war
      c: Twenty-four B-52s from Guam, refueled by KC-135s, strike suspected infiltration targets in Laos along the South Vietnamese
        border, the first B-52 strike in Laos; bomblets and 750-pound bombs. The news leaks; Sullivan asks no more until he
        can assure Souvanna Phouma of no publicity.
      n: '[[w.staaveren-u-s-air-force]], 101. Check: Van Staaveren gives Dec. 12 for the first B-52 strike in Laos on 133.
        See [[cal.1965-11-23.laos]]. Names: Sullivan, Souvanna Phouma.'
      src:
        c: a7ca23e5
        rows:
        - 'w.staaveren-u-s-air-force 101: all'
      tags:
      - name:sullivan-william-h
      - name:souvanna-phouma
- add:
    entry:
      id: cal.1966-01-21.laos
      when: Jan. 21
      date: '1966-01-21'
      thread: laos
      c: Cricket begins in central Laos, the first meshing of Thai-based Air Force O-1 forward air controllers with tribal
        roadwatch teams against truck traffic. Five more O-1s and six pilots to Nakhon Phanom Feb. 8.
      n: '[[w.staaveren-u-s-air-force]], 107, 110.'
      src:
        c: 66f8e716
        rows:
        - 'w.staaveren-u-s-air-force 107, 110: all'
- add:
    entry:
      id: cal.1966-03-01.laos
      when: Mar. 1
      date: '1966-03-01'
      thread: laos
      c: The first Cricket AC-47 night mission over Laos; twenty-one flares, some 13,000 rounds on road construction.
      n: '[[w.staaveren-u-s-air-force]], 110. See [[cal.1966-01-21.laos]].'
      src:
        c: 12009a5b
        rows:
        - 'w.staaveren-u-s-air-force 110: all'
