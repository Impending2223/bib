      when: June 19
      date: '1967-06-19'
      thread: economy
      c: 'Fowler, Bator and Okun with Schiller, the German Economics Minister, 2:30 p.m., on international liquidity. Schiller: the Common Market united on an 85 percent vote to activate any new reserves. Fowler: the world sees the Common Market as "hard-nosed central bankers preoccupied with gold"; a 75 percent vote instead for an agreed minimum over five years. Schiller: the Germans want to revive the Franco-German treaty.'
      n: 'Memorandum of conversation, [FRUS 1964–68, VIII, doc. 129](https://history.state.gov/historicaldocuments/frus1964-68v08/d129). [[w.schwartz-lyndon-johnson-and-europe]], 178–79. Made public: FRUS 1964–68, VIII (1998). See [[cal.1967-08-26.economy]]. Names: Fowler, Bator, Okun, Schiller.'
