      when: Dec. 18
      date: '1967-12-18'
      thread: economy-gold
      c: 'Mansfield and Johnson by telephone. Johnson: the French and the Soviets "and all of our enemies" after American gold to bring the dollar down, helped by the want of a tax bill; Mills coming to see that "he''s wrecking the damn world"; the dollar could be "busted like the pound was busted." Mansfield: "It''s Wilbur''s fault."'
      n: 'Recording of telephone conversation, Johnson and Mansfield, Dec. 18, 1967, LBJ Library, as FRUS summarizes it, [FRUS 1964–68, VIII, doc. 158](https://history.state.gov/historicaldocuments/frus1964-68v08/d158) n. 6. [[w.schwartz-lyndon-johnson-and-europe]], 195 (Johnson''s complaint). Made public: FRUS 1964–68, VIII (1998). See [[cal.1967-11-18.economy]]. Names: Mansfield, Johnson, Mills.'
