    set:
      c: 'Revenue and Expenditure Control Act. Johnson to the Speaker: pass it. The House adopts the conference report, [268–150](https://voteview.com/rollcall/RH0900357). Mills, opening the debate: the inflation now "demand-pull," not "cost-push"; gross national product up $19.4 billion in the first quarter, nearly half of it inflation; without the act, a deficit of $24 billion in fiscal 1969 on the unified budget.'
      n: 'Letter to the Speaker of the House Urging Passage of the Tax Bill, [1968–69 Pub. Papers 729](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=807) (June 20, 1968). Mills, [114 Cong. Rec. 18000](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt14/pdf/GPO-CRECB-1968-pt14-2-1.pdf#page=42) (June 20, 1968). [[w.zelizer-taxing-america]], 275–76 (the House''s adoption; Mills). To check: [[w.bernstein-guns-or-butter]]; [[w.okun-political-economy-of-prosperity]]; [[w.president-and-the-council]]. See [[cal.1968-05-05.economy]]. Names: McCormack, Johnson, Mills.'
