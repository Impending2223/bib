      date: '1965-07-27'
      thread: economy
      c: 'Sterling. Bundy and Mitchell by telephone, by the British record, the day of Britain''s emergency measures. Mitchell: as far as a Labour government can go; and if Britain is "forced over the edge" into devaluation? Bundy: "Don''t"; devaluation "unthinkable" in Washington.'
