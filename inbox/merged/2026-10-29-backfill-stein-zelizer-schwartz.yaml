      when: Sept. 24
      date: '1963-09-24'
      thread: economy
      c: 'Dillon with Byrd, on the eve of the House''s vote, to speed the Finance Committee: Byrd sets out ten days of staff briefings, four weeks of witnesses, Gore''s amendments, two weeks to write a Senate bill, and the civil rights filibuster to follow. Byrd''s offer: wait until January and a reduced budget, and he will "personally guarantee" the cut, retroactive to Jan. 1. Dillon refuses.'
      n: '[[w.stein-fiscal-revolution-in-america]], 451 (by *Newsweek*''s account). To check: *Newsweek*, Oct. 7, 1963, 31 (cited by [[w.stein-fiscal-revolution-in-america]], 451 n.53). Check: the day; *Newsweek* has it "on the eve of the House''s tax vote." See [[cal.1963-09-24.economy]]. Names: Dillon, Byrd, Gore.'
