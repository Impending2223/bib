      c: 'Bator to Johnson: McGeorge Bundy to explore an East-West institute, the Acheson committee''s idea of June, for the problems all advanced economies share, "factories and cities, subway systems and air traffic, hospitals and water pollution." Johnson approves; the appointment announced in December.'
