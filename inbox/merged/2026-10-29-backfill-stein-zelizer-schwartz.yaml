      c: 'Grewe, the German representative at NATO, brings Rusk Erhard''s letter of Sept. 30: the MLF treaty to be signed at the end of November or early December, by Germany and the United States alone if no third government is ready. Rusk to Grewe: consultation on nuclear strategy, but no veto or control over the American deterrent for countries not taking the same commitments and risks.'
      n: 'Erhard to Johnson, Sept. 30, 1964, [FRUS 1964–68, XIII, doc. 36](https://history.state.gov/historicaldocuments/frus1964-68v13/d36) (the letter; its delivery and Rusk''s answer, n. 4). [[w.schwartz-lyndon-johnson-and-europe]], 42 (Erhard''s proposal). Made public: FRUS 1964–68, XIII (1995). See [[cal.1964-06-12.europe-and-the-alliance]]. Names: Grewe, Erhard, Rusk.'
