      thread: economy
      c: 'Kennedy off the record with Mills, O''Brien and Dillon, by the meeting''s transcript. Mills: his Arkansas constituents leave the tax bill to him, "not twisting my arm"; he can pass the bill within a few months, but only if the President stresses his commitment to expenditure control.'
