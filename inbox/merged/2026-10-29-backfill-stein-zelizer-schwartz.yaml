- edit:
    id: cal.1964-01-08.economy
    base: 9dae85d7
    set:
      c: 'After the State of the Union, Johnson by telephone on the budget held under $98 billion. To Byrd, 3:25 p.m.: "You are my inspiration for doing it." Fowler, 5:40 p.m.: "making an honest man out of me and out of Wilbur Mills in one day." Robert Anderson, 8:15 p.m.: Byrnes calls it the first chance of bipartisan support for a tax cut and "real fiscal responsibility"; Eisenhower asks Anderson to tell Johnson "how very happy" he is at the reversal of the trend toward "bigger budgets."'
      n: '[Johnson and Byrd, 3:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-january-8-1964), Conversation WH6401-08-1247; [Johnson and Fowler, 5:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-henry-fowler-january-8-1964), Conversation WH6401-08-1254; [Johnson and Robert Anderson, 8:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-anderson-and-lady-bird-johnson-january), Conversation WH6401-10-1288 (Miller Center). [[w.zelizer-taxing-america]], 203–04; [[w.caro-passage-of-power]], 553 (the call to Byrd). See [[cal.1964-01-08.program]]; [[cal.1963-01-24.economy]]. Names: Johnson, Byrd, Fowler, Mills, Anderson, Byrnes, Eisenhower.'
      tags:
