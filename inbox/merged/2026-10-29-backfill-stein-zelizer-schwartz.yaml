      date: '1965-02-10'
      thread: europe-and-the-alliance
      also:
      - vietnam
      c: 'Wilson to Johnson by telephone, after Pleiku and the bombing of the North, hoping to come to Washington. Johnson: "Why don''t you run Malaysia and let me run Vietnam?" The talk ends with assurances of British support.'
      n: '[[w.schwartz-lyndon-johnson-and-europe]], 85. To check: memorandum of telephone conversation, Wilson and Johnson, Feb. 10, 1965, NSF, Memos to the President, Bundy Files, Box 2, LBJ Library (cited by [[w.schwartz-lyndon-johnson-and-europe]], 85 n.160); Sylvia A. Ellis, "Lyndon Johnson, Harold Wilson and the Vietnam War," in Jonathan Hollowell, ed., *Twentieth-Century Anglo-American Relations* (2001), 195 (cited by [[w.schwartz-lyndon-johnson-and-europe]], 85 n.159). See [[cal.1964-12-07.europe-and-the-alliance]]. Names: Wilson, Johnson.'
