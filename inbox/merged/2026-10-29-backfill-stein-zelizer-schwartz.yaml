      when: Oct. 24
      date: '1963-10-24'
      thread: europe-and-the-alliance
      c: 'Kennedy on European matters, the Cabinet Room, 10:30 a.m. Ground forces equivalent to six divisions to stay in Germany as long as required, Rusk to say so at Frankfurt; redeployments not to be discussed until decided. Approved: the six Berlin "Roundout" units home in fiscal 1964; the B-47s out of Spain and Britain by spring 1965. NSAM 270, Oct. 29, records it.'
      n: 'NSAM 270, [FRUS 1961–63, XIII, doc. 216](https://history.state.gov/historicaldocuments/frus1961-63v13/d216) (Oct. 29, 1963). [[w.schwartz-lyndon-johnson-and-europe]], 16 (the six divisions). Made public: FRUS 1961–63, XIII (1994). Names: Kennedy, Rusk.'
