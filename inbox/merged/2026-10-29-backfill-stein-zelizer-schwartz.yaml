      when: Sept. 24
      date: '1963-09-24'
      thread: economy
      c: 'House opens debate on H.R. 8363 under a closed rule. Mills: "two roads," "the tax reduction road" and "the road of Government expenditure increases"; "The route I prefer is the tax reduction road." He quotes the President''s letter of Aug. 21. Curtis: the cut meaningful only with expenditure reform, and how would the bonds for the deficit be marketed?'
      n: 'House, Sept. 24, 1963: [109 Cong. Rec. 17900](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-2.pdf#page=2) (the rule); [17907–09](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-2.pdf#page=9) (Mills, the letter); [17912](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-2.pdf#page=14) (Curtis). [[w.stein-fiscal-revolution-in-america]], 449–50, 511 n.50 (Mills; Curtis on debt management); [[w.zelizer-taxing-america]], 206 (Mills). See [[cal.1963-01-24.economy]]; [[cal.1963-08-21.economy]]. Names: Mills, Curtis.'
