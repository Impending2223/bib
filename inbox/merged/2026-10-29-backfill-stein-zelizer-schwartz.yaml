      when: July 30–31
      date: '1965-07-30'
      thread: economy
      c: 'Sterling. Trend, Wilson''s Cabinet Secretary, in Washington with White House and Cabinet officers: sterling and the British presence east of Suez; tighter economic policies pressed on the British, no direct link to Vietnam. Fowler, July 31: devaluation "on a modest scale would be useless, while on a drastic scale it would be like lighting a match to find a gold piece in a barn stocked with kerosene."'
      n: 'Wilson to Johnson, July 29, [FRUS 1964–68, XII, doc. 246](https://history.state.gov/historicaldocuments/frus1964-68v12/d246) (Trend to explain the British position to Bundy). [[w.schwartz-lyndon-johnson-and-europe]], 79 (the talks, by the British records). To check: meeting with Fowler, July 31, 1965, PREM 13/672, Public Record Office (cited by [[w.schwartz-lyndon-johnson-and-europe]], 79 n.135). See [[cal.1965-06-28.economy]]. Names: Trend, Wilson, Fowler.'
