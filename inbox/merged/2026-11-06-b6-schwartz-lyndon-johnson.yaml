      id: cal.1966-05.europe-and-the-alliance
      when: May
      date: 1966-05
      thread: europe-and-the-alliance
      c: 'Wilson to Bruce, of Erhard: he "had few ideas about foreign policy, and changed his mind all the time." Bruce agrees;
        Johnson had expected Erhard to follow up on nuclear sharing, and so had urged Wilson to act. Bruce, with Wilson: "whatever
        one might think of Adenauer, his judgment of Erhard was almost certainly right."'
      n: '[[w.schwartz-lyndon-johnson-and-europe]], 114–15. Check: the day; Schwartz, 114, puts it after Erhard''s talks with
        Wilson in May 1966, from a letter of May 11. To check: Stewart to MacLehose, May 11, 1966, FO 371/185011, Public Record
        Office (cited by [[w.schwartz-lyndon-johnson-and-europe]], 282 n.85). Names: Wilson, Bruce, Erhard, Johnson, Adenauer.'
      src:
        c: 444458a8
        rows:
