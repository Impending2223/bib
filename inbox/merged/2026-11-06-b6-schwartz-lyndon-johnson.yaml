- add:
    entry:
      id: cal.1968-03-15.economy-gold
      when: Mar. 15
      date: '1968-03-15'
      thread: economy-gold
      c: 'Wilson to Johnson, by message: the Barbara Ward paper Johnson read him in February foresaw a "remorseless development
        of events which could land us back in 1931. At that time you thought it might come from the weakness of sterling,
        in fact it has come through the scramble for gold."'
      n: '[[w.schwartz-lyndon-johnson-and-europe]], 199–200. To check: Wilson to Johnson, Mar. 15, 1968, PREM 13/2051, Public
        Record Office (cited by [[w.schwartz-lyndon-johnson-and-europe]], 297 n.69). See [[cal.1968-02-08.europe-and-the-alliance]].
        Names: Wilson, Johnson.'
      src:
        c: 424f1d10
        rows:
