      c: Sussex, England, the first meeting on an East–West institute of applied systems analysis. The Soviets, at the last
        minute, stay away, citing new tensions over Berlin. West Germany, France, Italy, Britain and the United States meet;
        a small planning group under Zuckerman, Wilsons chief scientific adviser.
      n: '[[w.schwartz-lyndon-johnson-and-europe]], 212. Check: the day. To check: Alan McDonald, "The International Institute
        for Applied Systems Analysis," unpublished case study, Harvard University, Mar. 13, 1997 (cited by [[w.schwartz-lyndon-johnson-and-europe]],
        300 n.118). Names: Wilson.'
      src:
