      c: 'Goldwater meets Johnson at the White House, 5:25 p.m., at his own request, some sixteen minutes: neither to inflame racial feeling in the campaign. Johnson at his press conference earlier that day: no issue can be "eliminated from the campaign in a free society." Check.'
      n: '[Johnson, Goldwater, Reedy, and Valenti, 5:25 p.m.](https://prde.upress.virginia.edu/conversations/4002458), Conversation WH6407-24-4468, 4469 (PRDE). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1053) (July 24, 1964). See [[cal.1964-07-15.elections-1964]]. Names: Goldwater (Opp. III.B).'
