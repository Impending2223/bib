patch: thread-goldwater
by: goldwater drafter
ops:
- add:
    entry:
      id: kjc.who.ginzburg-ralph
      s: Ginzburg, Ralph
      r: Publisher of *Fact*; its Goldwater issue, Sept.–Oct. 1964; Goldwater's libel verdict against him, 1968
    section: III.K
- add:
    entry:
      id: cal.1961-10-08.goldwater
      when: Oct. 8
      date: '1961-10-08'
      thread: goldwater
      also:
      - elections-1964
      c: 'Chicago, a motel. F. Clifton White and some two dozen conservative Republicans, most from the Young Republicans, meet in secret on the nomination of 1964: the South and the Midwest enough, without New York and New England. Goldwater their man. Check the number.'
      n: 'White, *Suite 3505*; Rusher, *The Rise of the Right*; Perlstein, *Before the Storm*; Middendorf, *A Glorious Disaster*; Goldberg, *Barry Goldwater* (Opp. II.B). Novak, *The Agony of the G.O.P. 1964* (Opp. II.A). White, *The Making of the President 1964* (Opp. II.E). Made public: White, *The Making of the President 1964* (1965), at the latest. Check. Names: White (Opp. III.F); Goldwater (Opp. III.B).'
      tags:
      - name:white-f-clifton
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1961-11-18.goldwater
      when: Nov. 18
      date: '1961-11-18'
      thread: goldwater
      c: 'Atlanta, to Southern Republicans. Asked whether he writes off the Negro vote in the South: "We''re not going to get the Negro vote as a bloc in 1964 and 1968, so we ought to go hunting where the ducks are." School integration the States'' business. The *Courier-Journal*, Nov. 19: he writes off no bloc of voters. Check the date and the wording.'
      n: 'Perlstein, *Before the Storm*; Goldberg, *Barry Goldwater* (Opp. II.B). Kabaservice, *Rule and Ruin* (Opp. II.A). See [[cal.1961-10-08.goldwater]]. Names: Goldwater (Opp. III.B).'
      tags:
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1962-03-07.goldwater
      when: Mar. 7
      date: '1962-03-07'
      thread: goldwater
      c: 'Madison Square Garden, the Young Americans for Freedom''s rally: some 18,000, a full house. Thurmond and Tower honored. Goldwater the last speaker: conservatism "the wave of the future."'
      n: 'Mary Perot Nichols, *Village Voice*, Mar. 15, 1962 ([text](https://www.villagevoice.com/yaf-goes-wild-for-barry-goldwater/)). Andrew, *The Other Side of the Sixties*; Schneider, *Cadres for Conservatism*; Perlstein, *Before the Storm* (Opp. II.B). Names: Goldwater (Opp. III.B); Thurmond (K–J Cong. III.B); Tower (K–J Cong. III.E).'
      tags:
      - name:goldwater-barry-m
      - name:thurmond-strom
      - name:tower-john-g
- add:
    entry:
      id: cal.1962-12-02.goldwater
      when: Dec. 2
      date: '1962-12-02'
      thread: goldwater
      also:
      - elections-1964
      c: 'Chicago, a motel. White''s draft group meets in secret, some forty by the UPI''s count, many from the South: a Goldwater drive, and Rockefeller stopped. The meeting in the papers Dec. 3. Goldwater: he knew nothing of it. Jan. 1963, he receives White: not a candidate; the draft not disowned. Check the number.'
      n: 'UPI, *University Daily Kansan*, Dec. 4, 1962 ([KU Libraries](https://digital.lib.ku.edu/islandora/object/ku-udk%3A12052)). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1961-10-08.goldwater]]. Made public: UPI, Dec. 3, 1962. Names: White (Opp. III.F); Rockefeller (Opp. III.H); Goldwater (Opp. III.B).'
      tags:
      - name:white-f-clifton
      - name:rockefeller-nelson
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1963-11-22.goldwater
      when: Nov. 22–25
      date: '1963-11-22'
      thread: goldwater
      also:
      - elections-1964
      c: 'Goldwater in Muncie, Indiana, with his wife, at her mother''s funeral. He and Kennedy had talked of campaigning together in 1964: "Standing up to state our points, our issues, and then debating each other." In December, he later wrote, he meant to refuse to be a candidate. Check the dates.'
      n: 'Goldwater, *With No Apologies* (Opp. II.G.1). Edwards, *Goldwater*; Goldberg, *Barry Goldwater*; Perlstein, *Before the Storm* (Opp. II.B). White, *The Making of the President 1964* (Opp. II.E). Names: Goldwater (Opp. III.B).'
      tags:
      - name:goldwater-barry-m
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1964-01-07.goldwater
      when: Jan. 7
      date: '1964-01-07'
      thread: goldwater
      also:
      - elections-1964
      c: 'Concord, New Hampshire, the campaign''s first week: "I would like to suggest one change, that social security be made voluntary." Rockefeller takes it up; Goldwater denies he would wreck the system.'
      n: 'Quoted with its date in Humphrey''s speech at Bakersfield, Cal., 1964 ([Humphrey papers, MNHS](https://www2.mnhs.org/library/findaids/00442/pdfa/00442-01375.pdf)); the Democrats'' spot ["Social Security"](https://www.livingroomcandidate.org/commercials/1964/social-security) (1964). White, *The Making of the President 1964* (Opp. II.E). Perlstein, *Before the Storm* (Opp. II.B). See [[cal.1964-01-03.elections-1964]]. Names: Goldwater (Opp. III.B); Rockefeller (Opp. III.H).'
      tags:
      - name:goldwater-barry-m
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1964-05-24.goldwater
      when: May 24
      date: '1964-05-24'
      thread: goldwater
      also:
      - elections-1964
      - vietnam
      c: 'ABC''s *Issues and Answers*, recorded. Goldwater on the Viet Cong''s supply lines: "defoliation of the forests by low-yield atomic weapons" could be done; he did not think it would be. Later: a suggestion of "competent military people," not his own. Check the wording.'
      n: 'Mann, *Daisy Petals and Mushroom Clouds* (K–J Cong. II.E). Perlstein, *Before the Storm*; Goldberg, *Barry Goldwater* (Opp. II.B). See [[cal.1964-01-03.elections-1964]]. Names: Goldwater (Opp. III.B).'
      tags:
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-08-04.goldwater
      when: Aug. 4
      date: '1964-08-04'
      thread: goldwater
      also:
      - vietnam
      - elections-1964
      c: 'Johnson calls Goldwater, 10:06 p.m., before his address on the Tonkin Gulf: reads him the statement; its timing, so as not to endanger the forces. Goldwater for the action.'
      n: '[Johnson and Goldwater, 10:06 p.m.](https://prde.upress.virginia.edu/conversations/4000966), Conversation WH6408-06-4715 (PRDE). See [[cal.1964-08-04.vietnam]]. Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
      tags:
      - name:johnson-lyndon-b
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-09-03.goldwater
      when: Sept. 3
      date: '1964-09-03'
      thread: goldwater
      also:
      - elections-1964
      c: Prescott, Arizona. Goldwater opens his campaign from the north steps of the Yavapai County Courthouse, where he had begun each race for national office.
      n: 'Shadegg, *What Happened to Goldwater?*; Perlstein, *Before the Storm* (Opp. II.B). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1964-07-15.elections-1964]]. Names: Goldwater (Opp. III.B).'
      tags:
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-09.goldwater
      when: Sept.
      date: '1964-09'
      thread: goldwater
      also:
      - elections-1964
      c: '*Fact*, September–October issue: "The Unconscious of a Conservative: A Special Issue on the Mind of Barry Goldwater." Its poll of 12,356 psychiatrists: 2,417 answer; 1,189 call him unfit for the Presidency, 657 fit, 571 cannot say. Advertised in mid-September. Sept. 1965, Goldwater sues the magazine, its publisher Ginzburg and its managing editor for libel.'
      n: '*Goldwater v. Ginzburg*, [414 F.2d 324](https://static.case.law/f2d/414/html/0324-01.html) (2d Cir. 1969). *Goldwater v. Ginzburg* (Opp. II.H.1). Perlstein, *Before the Storm* (Opp. II.B). Names: Goldwater (Opp. III.B); Ginzburg (K–J Cong. III.K).'
      tags:
      - name:goldwater-barry-m
      - name:ginzburg-ralph
- add:
    entry:
      id: cal.1964-08.goldwater
      when: Aug.–Oct.
      date: '1964-08'
      thread: goldwater
      also:
      - elections-1964
      c: 'The CIA and the Goldwater campaign. Hunt, of the Domestic Operations Division, later claimed he had watched it for the White House. The CIA''s own inquiry, Dec. 1973: the campaign''s press releases and travel schedules, advance copies passed to the White House some three hours before release; the idea Barnes''s, not McCone''s or Helms''s. Check.'
      n: 'CIA, [memorandum, "Howard Hunt''s Claim That He Spied on Goldwater in the 1964 Election Campaign," Dec. 20, 1973](https://www.cia.gov/readingroom/docs/JFK%20Case%20HOWARD%20HUNTS%20CLA%5B15658047%5D.pdf); [memorandum for the record, "E. Howard Hunt," Dec. 20, 1973](https://archive.org/download/JFKNovember32017Release/104-10173-10130_text.pdf) (NARA 104-10173-10130); [memorandum of a conversation with Nedzi, Dec. 27, 1973](https://www.cia.gov/readingroom/docs/conversation%20with%20chairma%5B15132634%5D.pdf). Hunt, *Undercover* (Wg. II.E). Made public: the *Washington Post*, Dec. 20 and 21, 1973; the CIA''s findings, Colby to Nedzi, Dec. 27, 1973. Names: Hunt (Wg. III.C); McCone, Helms (K–J Adm. III.I); Goldwater (Opp. III.B).'
      tags:
      - name:hunt-e-howard
      - name:barnes-c-tracy
      - name:mccone-john-a
      - name:helms-richard
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-10-19.goldwater
      when: Oct. 19
      date: '1964-10-19'
      thread: goldwater
      also:
      - elections-1964
      c: Jenkins. Goldwater, once his commanding officer in an Air Force Reserve unit, questioned by FBI agents, asks Hoover why Jenkins had no rigorous security check before he joined the White House. On the stump, no more than an allusion to Johnson's "curious crew"; his staff told to make no use of the arrest, by one of their accounts. Check the date.
      n: '[E. W. Kenworthy, "Goldwater Asks F.B.I. to Explain Check on Jenkins," *New York Times*, Oct. 20, 1964](https://www.nytimes.com/1964/10/20/archives/goldwater-asks-fbi-to-explain-check-on-jenkins.html). Middendorf, *A Glorious Disaster*; Perlstein, *Before the Storm* (Opp. II.B). See [[cal.1964-10-14.elections-1964]]. Names: Jenkins (K–J Adm. III.C); Hoover (K–J Adm. III.I); Goldwater (Opp. III.B).'
      tags:
      - name:goldwater-barry-m
      - name:jenkins-walter-w
      - name:hoover-j-edgar
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-10-20.goldwater
      when: Oct. 20–22
      date: '1964-10-20'
      thread: goldwater
      also:
      - elections-1964
      c: '"Choice," a half-hour film for Mothers for Moral America, a unit of Citizens for Goldwater-Miller: riots, protests, the decline of morals. Some 200 prints out; NBC to show it Oct. 22. Goldwater, having seen it, calls it "a racist film" and stops it. Check the dates.'
      n: 'Perlstein, *Before the Storm*; Middendorf, *A Glorious Disaster* (Opp. II.B). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1964-09-03.goldwater]]. Names: Goldwater (Opp. III.B).'
      tags:
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-10-27.goldwater
      when: Oct. 27
      date: '1964-10-27'
      thread: goldwater
      also:
      - elections-1964
      c: 'Moyers, in the campaign''s last days, asks the FBI for name checks on everyone in Goldwater''s Senate office. Hoover to Moyers, Oct. 27: information on two of the staff.'
      n: '[S. Rep. No. 94-755, Book II, 117, 228 (1976)](https://www.intelligence.senate.gov/sites/default/files/94755_II.pdf#page=241) (K–J Adm. II.H.3). Made public: the Church Committee, Book II (1976), pp. 117, 228. Check whether earlier. Names: Moyers (K–J Adm. III.C); Hoover (K–J Adm. III.I); Goldwater (Opp. III.B).'
      tags:
      - name:moyers-bill
      - name:hoover-j-edgar
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1965-06-17.goldwater
      when: June 17
      date: '1965-06-17'
      thread: goldwater
      c: 'Washington. Goldwater announces the Free Society Association, a movement of conservative political education. Kitchel its executive director: 500,000 members expected. June 15, Goldwater will run in 1968 for Hayden''s Senate seat "regardless of who runs."'
      n: 'The Ripon Society, newsletter, July 1965, [p. 1](https://riponsociety.org/wp-content/uploads/2023/12/1965-07_Vol-1_No-5.pdf). Kabaservice, *Rule and Ruin* (Opp. II.A). Goldberg, *Barry Goldwater* (Opp. II.B). See [[cal.1965-01-12.elections-1964]]. Names: Goldwater (Opp. III.B); Kitchel (Opp. III.E); Hayden (K–J Cong. III.A).'
      tags:
      - name:goldwater-barry-m
      - name:kitchel-denison
      - name:hayden-carl
- add:
    entry:
      id: cal.1965-08-30.goldwater
      when: Aug. 30
      date: '1965-08-30'
      thread: goldwater
      c: 'Johnson calls Goldwater, 2:58 p.m.: asks after his health; invites him to the White House for a drink and a military briefing. The steel talks, the pay bills, Aspinall and the Central Arizona Project.'
      n: '[Johnson, Goldwater, Moyers, Roberts, and the operator, 2:58 p.m.](https://prde.upress.virginia.edu/conversations/4020894), Conversation WH6508-13-8674 (PRDE). Goldberg, *Barry Goldwater* (Opp. II.B). See [[cal.1964-08-04.goldwater]]. Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
      tags:
      - name:johnson-lyndon-b
      - name:goldwater-barry-m
      - name:aspinall-wayne-n
