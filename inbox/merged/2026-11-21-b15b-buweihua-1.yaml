    set:
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 440; [[w.yang-jisheng-tiandi-fanfu]], I, 107 (October 1964, in Peking; Li Xifan, an editor of the *Renmin ribao*''s arts department,
        takes it as an academic piece and finds the tie to the 1962 "go-it-alone wind" hard to make; the note gives Bu Weihua''s June or July 1964). Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]).
        To check: [[w.jin-1949-1989-niande-zhongguo]], 609 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 440 n.62); Informant I, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]],
        III, 440 n.63b). Names: Jiang Qing.'
- edit:
    id: cal.1966-03.china-leadership-5
    base: 532161e9
    set:
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 143; [[w.peng-zhen-nianpu-1902]], IV, 472 (Mar., 1966; in the exposure of Luo Ruiqing and the drafting of the work group''s report to the
        Center and Mao, Peng Zhen says again and again: seek truth from facts, one is one, three parts of error not called seven, no overstatement; a speech at a criticism meeting not
        a verdict; facts and grounds weighed; anything Luo can disprove with evidence to be dropped). Made public: 2008. See [[cal.1966-03-04.china-leadership]]. Names: Peng Zhen, Luo
        Ruiqing. Check: the day.'
