- cite:
    id: cal.1965-12-08.china-leadership
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 28–29 (sixty-one present, thirty-four of them senior officers; none but Mao and Lin Biao knew the subject beforehand; no notes allowed; Mao:
      Luo''s thinking distant from ours, he treats Lin as an enemy, a careerist; Mao has Ye Qun called from Suzhou to speak; three speeches, ten hours, her chief proof the four points
      Liu Yalou passed her before his death for Lin: to leave the political stage in time, guard his health, leave the army to others, give Luo a free hand; and Liu''s word that Luo
      would not forget her; Wu Faxian, in a speech of over 10,000 characters, that Liu Yalou had told him the four points too)'
    units: A, C
