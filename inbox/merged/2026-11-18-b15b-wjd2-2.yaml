      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 298–299 (Aug. 30, 1963; Zhou receives the Algerian press delegation led by Mohammed (穆罕默德), and says that the Algerian armed struggle has greatly influenced all Africa; France''s refusal to recognize Algeria''s independence and repression for seven years brought a new situation with two roads before the African peoples, independence by fighting and independence by talks, which are not opposed, there being fighting in talks and talks in fighting; countries that gained independence by talks are half independent and must go on to full and economic independence)'
      units: B-E
