  - cite:
      id: cal.1963-12-27.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 310–311 (Dec. 21–27, 1963; Zhou visits Algeria officially at President Ben Bella''s invitation and holds several talks with him; Dec. 27, the joint communique of the two governments: both firmly support the anti-imperialist, anti-colonialist, anti-neocolonialist struggle of the peoples of Asia, Africa and Latin America and the defense of national independence; general disarmament and the complete prohibition and destruction of nuclear weapons are an important task for defending world peace; Zhou declares the five principles of China''s relations with the Arab states and the African states)'
      units: A
  - cite:
      id: cal.1963-12-27.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 311 (Dec. 27–30, 1963; Zhou visits Morocco officially at King Hassan II''s invitation, Chen Yi among those accompanying him; Zhou and Chen Yi hold talks with the King, Prime Minister Bahnini and Foreign Minister Guedira)'
      units: A
  - cite:
      id: cal.1963-12-27.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 311–312 (Dec. 31, 1963; the joint communique: China supports Morocco''s policy of peace and nonalignment; both approve the peaceful coexistence of countries of different systems, wide international cooperation, general disarmament and the complete prohibition and destruction of nuclear weapons; economic independence the ground of true independence; noninterference; disputes among Asian and African countries, those left by history among them, to be settled by negotiation; an end to the remains of colonialism)'
      units: F
  - cite:
      id: cal.1963-12-31.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 312 (Dec. 31, 1963–Jan. 9, 1964; Zhou visits Albania at the invitation of Mehmet Shehu, Chairman of the Council of Ministers, and holds several talks with Enver Hoxha, First Secretary of the Albanian Party of Labor, Shehu, Haxhi Lleshi and others, the book saying the two sides'' positions and views were wholly in agreement)'
      units: A
  - cite:
      id: cal.1964-01-08.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 312 (Jan. 9, 1964, the book''s day for the issue of the joint statement; the two sides condemn the partial test ban treaty signed by the U.S., Britain and the Soviet Union as a big fraud on the world''s peoples meant to monopolize nuclear weapons; both stand for general disarmament and the complete prohibition and destruction of nuclear weapons; both hold that to oppose modern revisionism and modern dogmatism and to defend the purity of Marxism-Leninism and the revolutionary principles of the 1957 declaration and 1960 statement is the sacred duty of every communist party)'
      units: A-B
  - cite:
      id: cal.1964-01-09.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 313 (Jan. 9–10, 1964; Zhou and Chen Yi visit Tunisia officially at President Bourguiba''s invitation; Zhou exchanges views with Bourguiba on relations between the two countries and on the international situation)'
      units: A
  - cite:
