      entry:
        id: cal.1962-05-19.china
        when: May 19
        date: '1962-05-19'
        thread: china
        also: [south-asia]
        c: The Chinese government protests to the Indian government, a serious protest at the recent provocation by Indian troops in Tibet, a grave intrusion into Chinese territory at Longju.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 228 (May 19, 1962).'
        tags: [polity:prc, polity:india]
        src:
          c: cb48c755
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 228: all'
  - add:
      entry:
        id: cal.1962-05-19.china-2
        when: May 19
        date: '1962-05-19'
        thread: china
        also: [soviet-union]
        c: Zhang Hanfu, Vice-Minister of Foreign Affairs, hands the Soviet ambassador Chervonenko the second Chinese aide-memoire on the flight of Xinjiang border people to the Soviet Union. The Soviet side is not unable to stop them but does not stop them, and does not send them back; those who cross are met and settled with preparation, which no humanitarian motive explains.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 228 (May 19, 1962). Made public: 2001. Names: Chervonenko.'
        tags: [polity:prc, polity:ussr, vis:only:prc+ussr, name:chervonenko-stepan-v]
        src:
          c: '11174155'
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 228: all'
  - add:
