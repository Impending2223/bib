        c: At Cotonou the Chinese government and the government of the Republic of Dahomey sign a joint communique on establishing diplomatic relations at the ambassadorial level. The Dahomey government recognizes the People's Republic as the sole legal government representing the whole Chinese people. The two governments agree to develop cooperation between the two countries on the five principles of peaceful coexistence.
