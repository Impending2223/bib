        when: May 28
        date: '1962-05-28'
        thread: china
        also: [south-asia]
        c: The Chinese government sends India a strong protest at its setting up of more military posts inside Chinese territory in the western sector of the boundary and its continued intrusions and provocations. It demands that India withdraw at once the posts newly set up inside China and stop all illegal intrusion.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 229 (May 28, 1962).'
        tags: [polity:prc, polity:india]
        src:
          c: 2d5b25a4
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 229: all'
  - add:
      entry:
        id: cal.1962-05-29.china
        when: May 29
        date: '1962-05-29'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy. It protests that the Indian government did not publish the summary of the Chinese–Indian officials' report on the boundary question or the Chinese embassy's press communique on the Foreign Ministry's note of Apr. 30, 1962. It flatly rejects India's protest at the embassy's publishing the two documents.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 229 (May 29, 1962).'
        tags: [polity:prc, polity:india]
        src:
          c: 1fae4b7e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 229: all'
  - add:
      entry:
        id: cal.1962-05-30.china
        when: May 30
        date: '1962-05-30'
        thread: china
        also: [south-asia]
        c: 'The Chinese government again protests Indian aircraft''s violations of Chinese airspace: 67 sorties between Mar. 6 and Apr. 30. It says the frequent flights directly support the ground intrusions from the military posts India has set up on Chinese territory.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 229 (May 30, 1962).'
        tags: [polity:prc, polity:india]
        src:
          c: '76676765'
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 229: all'
  - add:
      entry:
        id: cal.1962-05-31.china
        when: May 31
        date: '1962-05-31'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, flatly rejecting India's May 10 protest at the China–Pakistan boundary talks. The boundary between Xinjiang and the area Pakistan actually controls, hundreds of kilometers long, has never been formally delimited. The Chinese government's talks with Pakistan on a provisional agreement, to await the final settlement of Kashmir, are necessary, just, lawful and in international practice. India's use of the Kashmir dispute against the talks, and its slander and intimidation, are wholly unreasonable.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 229–230 (May 31, 1962).'
        tags: [polity:prc, polity:india, polity:pakistan]
        src:
          c: 8a8ce61d
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 229–230: all'
