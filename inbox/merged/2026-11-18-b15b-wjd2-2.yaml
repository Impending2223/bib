      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 369 (Oct. 27, 1964; Zhou receives the postal and telecommunications delegations of 11 socialist countries, the Soviet Union, Albania, Bulgaria and Korea among them, taking part in the conference of vice-ministers of posts and telecommunications of the Socialist Countries'' Posts and Telecommunications Cooperation Organization held at Peking)'
