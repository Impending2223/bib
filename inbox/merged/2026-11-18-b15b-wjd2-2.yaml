        id: cal.1962-07-09.china-2
        when: July 9
        date: '1962-07-09'
        thread: china
        also: [laos]
        c: 'Geneva. Zhang Hanfu, acting head of the Chinese delegation, at the 41st plenary meeting of the enlarged conference on Laos: China warmly welcomes the Laotian government''s declaration of neutrality. Since the participants all say they respect Laos''s independence and the Lao people''s will, they should declare plainly that SEATO''s "protection" is given up, and give up any attempt to touch the reorganization of Laotian forces in any document in any form. The Chinese delegation hopes for a final agreement within a few days and asks that the Western countries not drag on.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 235 (July 9, 1962).'
        tags: [polity:prc, polity:laos]
        src:
          c: 2be815f5
