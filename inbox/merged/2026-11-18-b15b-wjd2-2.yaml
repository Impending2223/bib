      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 252 (Nov. 4, 1962; Zhou, at the banquet welcoming the DPRK government''s trade delegation: China will never give up its efforts for a peaceful settlement of the Sino-Indian boundary question, but no one should expect China to yield before force; the Chinese government and people firmly support Castro''s five demands and the Cuban people''s just struggle)'
