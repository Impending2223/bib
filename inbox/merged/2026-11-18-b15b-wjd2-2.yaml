  - add:
      entry:
        id: cal.1964-04-11.china-leadership-3
        when: Apr. 11
        date: '1964-04-11'
        thread: china-leadership
        also: [indonesia]
        c: Chen Yi speaks at the plenary session of the preparatory meeting at Jakarta. The 1.7 billion peoples of Asia and Africa are growing in anti-imperialist unity; opposing imperialism, winning and defending national independence, is the common most urgent task of Asian and African countries, and the Chinese government and people will, as always, join the peoples of Asia and Africa in the anti-imperialist, anti-colonialist struggle for lasting world peace, supporting, helping and encouraging one another. He asks the Asian and African states to strengthen their unity and cooperation further, and hopes that in the spirit of seeking common ground while keeping differences, equality and mutual understanding, the preparatory meeting will be opened.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 329 (Apr. 11, 1964). Names: Chen Yi.'
        tags: [polity:prc, polity:indonesia, name:chen-yi]
        src:
          c: 0a032b11
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 329: all'
  - add:
      entry:
        id: cal.1964-04-12.china
        when: Apr. 12
        date: '1964-04-12'
        thread: china
        also: [latin-america]
        c: The Foreign Ministry spokesman issues a statement of strong protest at the Brazilian authorities' arrest of nine Chinese personnel, among them Geng Yaozeng, deputy representative of the China Council for the Promotion of International Trade in Brazil, and Wang Weizhen, Xinhua correspondent. The nine had gone to Brazil for trade, exhibition preparation and news work, under agreements between the two countries and with the Brazilian government's consent, and their entry and stay are wholly lawful. The arrest violates international law and runs against the wish of the two peoples for trade and friendship. China demands the immediate release of the arrested, the protection of their persons and lawful interests, and the restoration of their normal work.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 329–330 (Apr. 12, 1964). Check: the names are 耿耀增 and 王唯真 in the book; the Latin forms are back-converted.'
        tags: [polity:prc, polity:brazil]
        src:
          c: ddbe0c60
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 329–330: all'
