      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 270–271 (Feb. 15, 1963; Zhou at Sihanouk''s banquet for the Chinese leaders: relations of mutual respect, not imposing on one another, equal and not one above another, mutually beneficial and not harmful, have stood the test of time; China holds that nations, large or small, should be treated as equals and each play its own independent part in international affairs)'
