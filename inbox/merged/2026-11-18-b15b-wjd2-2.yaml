  - cite:
      id: cal.1962-09-01.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 241 (Sept. 1, 1962; the reception, Zhou, Deng Xiaoping and Chen Yi attending; Chen Yi speaks: the U.S. obstructs the Geneva agreement on Laos through the provisional government of national union''s exercise of its powers and incites Thailand and South Vietnam to armed provocation against Cambodia; the U.S. warships'' shelling of peaceful residents of Havana foreshadows a larger invasion of Cuba)'
