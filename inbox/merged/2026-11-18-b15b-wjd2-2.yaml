        when: July 15
        date: '1963-07-15'
        thread: china
        also: [africa]
        c: 'Xinhua, by authority, issues a statement: the Chinese government will go on having no economic or trade relations with the South African colonial authorities, and firmly supports the just struggle of the South African people.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 288–289 (July 15, 1963).'
