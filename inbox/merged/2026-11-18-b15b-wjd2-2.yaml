        c: 'The Chinese government issues a statement on the U.S.''s repeated wrecking of the Geneva agreements and its creating of a more serious situation in Laos. It fully supports the statement of Sept. 11 by Souphanouvong, Chairman of the Neo Lao Hak Xat, and Prince Souvanna Phouma, Deputy Prime Minister of the Lao government of national union (the editors'' note: they protest the provocation of the U.S. and the Lao right wing it backs, which aims to wreck the Geneva agreement and Laos''s neutrality, and call on the Lao people to defend the government of national union).'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 299 (Sept. 13, 1963). Names: Souphanouvong, Souvanna Phouma. Check: the book''s editors'' note calls Souvanna Phouma Deputy Prime Minister; so as the book prints it.'
