  - cite:
      id: cal.1964-01-21.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 316–317 (Jan. 21–26, 1964; Zhou visits Guinea officially at President Sékou Touré''s invitation, with Chen Yi accompanying him)'
      units: A
  - cite:
      id: cal.1964-01-26.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 316–317 (Jan. 21–26, 1964; Zhou in his talks with Touré says that African unity first requires the most awakened African leaders to set an example, unite and become the core of African unity; differences that may exist among the most awakened states are, beside the wish for unity, secondary; they should unite first, help one another and lead the others)'
      units: B-C
  - cite:
      id: cal.1964-01-26.china-leadership-5
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 317 (Jan. 26, 1964; the joint communique: both resolve to go on working to oppose imperialism and defend world peace; they stand for general disarmament and the complete prohibition and destruction of nuclear weapons, a matter of the vital interest of all peoples in which all the world''s big and small countries have a right to speak; they oppose the arbitrary practices of the highly developed countries in economic and technical relations and trade, a habit of ruling and exploiting the developing countries)'
      units: B
  - add:
      entry:
        id: cal.1964-01-23.china
        when: Jan. 23
        date: '1964-01-23'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at the Indian aircraft's 42 sorties violating Chinese airspace in the fourth quarter of 1963.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 317 (Jan. 23, 1964).'
        tags: [polity:prc, polity:india]
        src:
          c: 98b4f759
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 317: all'
  - cite:
      id: cal.1964-01-27.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 317 (Jan. 27, 1964; Mao receives Suzuki Kazuo, executive director of the Japan–China Trade Promotion Association and vice-chairman of the Japan–China Friendship Association, an executive director of the Japan Asia–Africa Solidarity Committee, Saionji Kinkazu, and Takano Yoshihisa, Akahata correspondent in Peking, and says of the Jan. 26 anti-U.S. demonstration in Japan that the Chinese people support the Japanese people''s great patriotic struggle and are convinced that their wish for independence, democracy, peace and neutrality will come true)'
      units: A-B
  - cite:
      id: cal.1964-01-27.europe-and-the-alliance
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 317–318 (Jan. 27, 1964; China and France establish diplomatic relations; the joint communique: the two governments agree to establish relations and to name ambassadors within three months)'
      units: A
  - cite:
      id: cal.1964-01-28.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 318 (Jan. 27–30, 1964; Zhou visits the Sudan at the invitation of Ibrahim Abboud, Chairman of the Supreme Council of the Armed Forces, with Chen Yi accompanying him, and holds talks with Abboud)'
      units: A
  - cite:
      id: cal.1964-01-30.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 318 (Jan. 30, 1964; the joint communique: without eliminating imperialism, the direct root of world war, there is no peace for mankind; both are ready to struggle with all countries and peoples for general disarmament and the complete prohibition of nuclear weapons and destruction of their stocks)'
      units: A
  - cite:
      id: cal.1964-01-28.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 318 (Jan. 28, 1964; the Foreign Ministry spokesman, by order, issues a statement on the Sino-French negotiations: the People''s Republic of China reached the agreement with France as the sole legal government representing the Chinese people; by international practice recognizing a country''s new government implies, without saying so, no longer recognizing the old ruling clique the people overthrew, whose representatives cannot go on being taken for the country''s representatives or sit with the new government''s representatives in one country or one international organization; Taiwan is Chinese territory, and any attempt to tear it from China or to make "two Chinas" the Chinese government and people can never accept)'
      units: A-D
  - add:
      entry:
        id: cal.1964-01-28.china-leadership-6
        when: Jan. 28
        date: '1964-01-28'
        thread: china-leadership
        also: [africa-algeria-morocco]
        c: Mao Zedong receives all the members of an Algerian lawyers' delegation led by Abdelhamid Rabeh and Ben Abdallah (the book's 阿卜杜希德·日拉伯 and 以本·阿卜杜拉·阿德萨马德), together with members of the central leadership of the National Liberation Front, one of whom is in charge of the executive and finance committee.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 319 (Jan. 28, 1964). Names: Mao Zedong. Check: the names are given in Chinese in the book and are garbled in this print; the Latin forms are not recovered. The book does not give a talk.'
        tags: [polity:prc, polity:algeria, name:mao-zedong]
        src:
          c: d5f139fa
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 319: all'
  - cite:
      id: cal.1964-01-30.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 319 (Jan. 30–Feb. 1, 1964; Zhou visits Ethiopia at Emperor Haile Selassie''s invitation, Chen Yi accompanying him; he holds talks with the Emperor, a frank exchange on the great questions facing the world, above all general disarmament and world peace, the days not given)'
      units: A
  - cite:
      id: cal.1964-01-30.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 319 (Feb. 1, 1964, the book''s day for the joint communique, which the entry has signed Jan. 31; both sides will go on supporting the freedom struggle of the African peoples still not independent and working to relax tension, defend peace and win general disarmament and the complete prohibition and destruction of nuclear weapons)'
      units: D
  - add:
      entry:
        id: cal.1964-01-30.china-leadership-7
        when: Jan. 30
        date: '1964-01-30'
        thread: china-leadership
        c: 'Mao Zedong, receiving a delegation of French members of parliament headed by François Bénard, says: we have common points, first to oppose the bullying of big powers, and second to let our two countries trade and share culture. As to the United Nations, China lived without it for 15 years and could live another 15, 30, 100; but China will not accept "two Chinas" or "one and a half Chinas", or Taiwan as China''s autonomous territory. Another thing in common is the three-power treaty (the editors'' note: the partial test ban treaty signed at Moscow on July 25, 1963 by the U.S., Britain and the Soviet Union): China does not join it, for it is a fraud that pins China down. After China and the U.S. settle the Taiwan question, China wants to restore diplomatic relations; even then, if the U.S. goes on interfering and controlling as now, China will still oppose it.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 319–320 (Jan. 30, 1964). Made public: 2001. Names: Mao Zedong. Check: the head is 弗朗索瓦·贝纳尔 in the book (François Bénard?); the book gives the talk as Mao''s words. Whether it was reported then.'
        tags: [polity:prc, polity:fr, polity:us, polity:roc, vis:only:prc+fr, name:mao-zedong]
        src:
          c: 51e0550e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 319–320: all'
  - cite:
      id: cal.1964-02-04.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 320 (Feb. 1–4, 1964; Zhou visits Somalia at the invitation of Prime Minister Abdirashid Ali Shermarke, with Chen Yi accompanying him; Feb. 4, the joint communique: the two sides agree on defending peace and security in Africa and Asia; to prevent another world war they must struggle unceasingly against imperialism''s policy of aggression and war; both call for general disarmament and the complete destruction of nuclear weapons, so that Africa becomes a nuclear-free zone; both will work to eliminate every form of imperialism, colonialism and neocolonialism and foreign military bases in Africa and Asia; aid must follow equality and mutual benefit with no political conditions; Zhou states the five principles of China''s relations with the African states)'
      units: A-B
  - cite:
      id: cal.1964-02-03.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 321 (Feb. 3, 1964; Zhou at the Mogadishu mass meeting: independent African peoples dare to be their own masters, to run their own countries, to despise every enemy and to fight every old and new oppressor; this fearless spirit is the most precious wealth of all the newly rising countries; to win complete independence they must win economic independence, relying mainly on their own countries'' strength, foreign aid being only an auxiliary; in the struggle against imperialism and old and new colonialism and for the building of their national economies, the Chinese people are always the African peoples'' reliable friends)'
      units: A-B
  - cite:
      id: cal.1964-02-03.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 321 (Feb. 3, 1964; Zhou at Mogadishu, answering the Agence France-Presse reporter Tesseyre (特塞兰): the establishment of Sino-French relations is a major event; France''s agreement with China does not mean recognizing the representatives of the Chiang Kai-shek clique or the so-called "Republic of China"; the Chinese people will never agree to the U.S. plot of two Chinas or of making Taiwan another China or an independent political unit; Taiwan is an inalienable part of Chinese territory over which China''s sovereignty is not to be impaired, interfered with or encroached on; the Chinese people firmly oppose nuclear war)'
      units: A
  - add:
      entry:
        id: cal.1964-02-12.china-leadership
        when: Feb. 12
        date: '1964-02-12'
        thread: china-leadership
        also: [japan]
        c: Deng Xiaoping, General Secretary, receives the delegation of the Japanese Local Assemblymen's League for the Promotion of International Trade, headed by its chairman Saitō Uzuke.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 321 (Feb. 12, 1964). Names: Deng Xiaoping. Check: the chairman is 斋藤卯助 in the book; the Latin form is back-converted.'
        tags: [polity:prc, polity:japan, name:deng-xiaoping]
        src:
          c: 5c7e2044
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 321: all'
  - add:
      entry:
        id: cal.1964-02-13.china
        when: Feb. 13
        date: '1964-02-13'
        thread: china
        also: [japan]
        c: The China Council for the Promotion of International Trade, its chairman Nan Hanchen, and the chairman of the Japanese Local Assemblymen's League for the Promotion of International Trade, Saitō, sign a joint statement at Peking. Both sides agree that the restoring of Sino-Japanese diplomatic relations is the common wish of the two peoples. The Chinese side says that the Chinese people can never tolerate the making of "two Chinas". The Japanese side says that China can only be one, the People's Republic of China.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 322 (Feb. 13, 1964). Check: Nan Hanchen is 南汉宸 in the book; no name entry.'
        tags: [polity:prc, polity:japan]
        src:
          c: 829239f7
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 322: all'
  - cite:
      id: cal.1964-02-18.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 322 (Feb. 14–18, 1964; Zhou visits Burma at the invitation of General Ne Win, chairman of the Revolutionary Council, with Chen Yi accompanying him, and holds talks with Ne Win on matters of common concern and international questions; Feb. 18, the joint communique: both resolve, with all peace-loving peoples and countries, to work for general disarmament, including the complete prohibition and destruction of nuclear weapons; every country has the right to choose and develop its political and social system and way of life as its conditions, needs and wishes require, with no outside interference or pressure)'
      units: A
  - cite:
      id: cal.1964-02-23.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 322–323 (Feb. 18–26, 1964; Zhou and Chen Yi visit Pakistan at the invitations of President Ayub Khan and Foreign Minister Bhutto; Zhou and Ayub reach full understanding on matters of common concern; the joint communique: the two countries are to go on friendly cooperation within the Bandung ten principles and the five principles, firmly oppose colonialism of every kind and place, and hope it will soon be rooted out; the Sino-Indian boundary dispute should and can be settled by negotiation and peacefully; both hope the Kashmir dispute can be settled as the Indian and Pakistani governments assured, in accordance with the wishes of the people of Kashmir)'
      units: A-B
  - add:
      entry:
        id: cal.1964-02-22.china
        when: Feb. 22
        date: '1964-02-22'
        thread: china
        also: [congo]
        c: The Chinese and Congolese (Brazzaville) governments issue a joint communique on establishing diplomatic relations. The two governments decide to recognize each other and establish relations at the ambassadorial level. They agree to develop their relations on the five principles of peaceful coexistence.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 323 (Feb. 22, 1964).'
        tags: [polity:prc, polity:congo-brazzaville]
        src:
          c: 8499029c
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 323: all'
  - add:
      entry:
        id: cal.1964-02-24.china-leadership-5
        when: Feb. 24
        date: '1964-02-24'
        thread: china-leadership
        also: [japan]
        c: Zhou Enlai and Chen Yi each cable condolences on the death of Takasaki Tatsunosuke, the well-known Japanese politician and adviser of the Liberal Democratic Party. Zhou says in his cable that Takasaki at the Bandung conference, with the leaders of the Asian and African countries, jointly founded the Bandung ten principles and in later years made an important contribution to the development of Sino-Japanese trade and of Sino-Japanese friendship.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 323 (Feb. 24, 1964). Names: Zhou Enlai, Chen Yi, Takasaki.'
        tags: [polity:prc, polity:japan, name:zhou-enlai, name:chen-yi, name:takasaki-tatsunosuke]
        src:
          c: cc03a1f6
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 323: all'
  - cite:
      id: cal.1964-02-24.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 323 (Feb. 24, 1964; Zhou at the special meeting of the West Pakistan Provincial Assembly: since Bandung, the struggle to win and defend national independence has spread over Asia and Africa like a prairie fire; the just struggle of the Afro-Asian peoples has become a mighty force for defending world peace; the rising Asian and African states are resolved to go the way of independence and self-reliance and develop their own national economies; to treat the new Asian and African countries with the imperialist attitude of the large bullying the small and the strong the weak, or with great-power chauvinism, must run into walls)'
      units: A-B
  - cite:
      id: cal.1964-02-25.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 323–324 (Feb. 25, 1964; Zhou, answering the chief reporter of the Associated Press of Pakistan, Qureshi (古莱希): the root of the tension in Sino-American relations is the U.S. government''s persistent policy of hostility to China; the only way to improve them is for the U.S. government to show by deeds that it is willing to change that policy; on Kashmir, he hopes it will be settled according to the wishes of the Kashmiri people; to settle the Sino-Indian boundary peacefully China has done all it could and will keep trying)'
      units: B, D-E
  - cite:
      id: cal.1964-02-29.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 324 (Feb. 26–29, 1964; Soong Ching Ling and Zhou visit Ceylon at the invitation of Prime Minister Bandaranaike, with Chen Yi accompanying; the two prime ministers hold talks; the joint communique: both firmly oppose colonialism in every form and manifestation; they resolve to cooperate with other countries to win general disarmament and the complete prohibition and destruction of nuclear weapons; the leaders support nuclear-free zones anywhere in the world and hold that the nuclear-armed states should bear the corresponding obligations toward such zones)'
      units: A
  - add:
      entry:
        id: cal.1964-02-28.china
        when: Feb. 28
        date: '1964-02-28'
        thread: china
        also: [south-asia]
        c: The Chinese and Ceylonese government trade delegations exchange letters at Peking on the agreement reached on developing economic and trade relations, and at the same time sign contracts for the Chinese government to supply Ceylon with cotton cloth and other goods worth 20 million rupees.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 324 (Feb. 28, 1964). Check: the book gives the goods as 棉布等合同, worth 2,000万 rupees.'
        tags: [polity:prc, polity:ceylon]
        src:
