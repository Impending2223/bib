      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 235–236 (July 12, 1962; the banquet of the DPRK ambassador, Han Ik Su (韩益洙), for the treaty''s first anniversary; Chen Yi speaks: the U.S. government must answer for any military adventure by the Chiang Kai-shek clique; China welcomes and supports the Laotian government''s declaration of neutrality and hopes the Geneva conference will soon reach its final agreement)'
      units: B
  - cite:
      id: cal.1962-07-15.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 236 (July 15, 1962; Mao receives the Pakistani ambassador, Rashidi (拉希迪); the book gives his words on the Asian, African and Latin American countries, two-thirds of the world, ahead in numbers and behind in economy, science and culture, and so bound to help one another, neighbors with common borders, among them Pakistan, Nepal, Bhutan, Burma, Laos and Vietnam)'
      units: B
  - add:
      entry:
        id: cal.1962-07-16.china-2
        when: July 16
        date: '1962-07-16'
        thread: china
        also: [laos]
        c: Vientiane. Liu Chun, chargé d'affaires ad interim of the Chinese embassy in Laos, gives a press conference on China–Laos relations. The establishment of diplomatic relations and the exchange of ambassadors is a major step in the friendship of the two countries. He notes that the U.S. is actively directing the Chiang Kai-shek clique's illegal activities, seeking to set up a so-called "embassy" at Vientiane and create "two Chinas" and so disrupt the friendship. The Chinese people can in no way tolerate it.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 236 (July 16, 1962). Names: Chiang Kai-shek. Check: Liu Chun is 刘春 in the book; no name entry.'
        tags: [polity:prc, polity:laos, polity:roc, polity:us, name:chiang-kai-shek]
