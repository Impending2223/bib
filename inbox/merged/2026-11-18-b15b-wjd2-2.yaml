        when: Oct. 24
        date: '1963-10-24'
        thread: china
        c: The Foreign Ministry issues a statement on the United States' again manipulating the United Nations General Assembly to block the restoration of China's lawful rights. China is a founding member of the United Nations and a permanent member of its Security Council. Only the People's Republic has the right to all of China's lawful rights in the United Nations. Taiwan is an inalienable part of its territory. China firmly opposes, and will never let succeed, any form of the U.S. and its followers' plot of "two Chinas".
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 304 (Oct. 24, 1963).'
        tags: [polity:prc, polity:us, polity:un, polity:roc]
