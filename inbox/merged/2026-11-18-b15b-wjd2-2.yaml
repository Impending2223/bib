      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 313 (Jan. 10, 1964; the joint communique: the two countries decide to establish diplomatic relations; both support the efforts of the African peoples for decolonization, firmly support the struggle of the Palestinian people to win back their lawful rights, and hope for general disarmament and a complete ban on nuclear weapons soon)'
      units: A-B
  - cite:
