        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at Indian troops' renewed intrusion, on the 10th of this month, into the 呷林公 plateau on the line of actual control of Nov. 7, 1959 in the eastern sector. They crossed the line and made reconnaissance, and China demands that India stop the intrusion at once.
