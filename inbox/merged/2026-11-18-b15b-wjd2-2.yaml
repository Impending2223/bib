        when: Apr. 30
        date: '1962-04-30'
        thread: china-leadership
        c: Chen Yi, Vice-Premier, receives Claude Thomas Bissell, president of the University of Toronto, and Geoffrey Clement Andrew, executive director of the Canadian Universities Foundation.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 225 (Apr. 30, 1962). Names: Chen Yi. Check: the book gives the names in Chinese (克劳德·托马斯·比斯尔, 吉弗雷·克利门特·安德鲁) and the second man''s body as 加拿大大学基金会; the Latin forms are back-converted.'
        tags: [polity:prc, polity:canada, name:chen-yi]
