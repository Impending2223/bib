        when: May 26
        date: '1964-05-26'
        thread: china-leadership
        also: [laos]
        c: Chen Yi, Foreign Minister, replies to the British Foreign Secretary on the U.S. distortion of the Lao situation. The coup of the middle-way forces at Vientiane was the inevitable result of the Vientiane coup, he says, and he hopes the British government will seriously consider the proposals in the Chinese government's letter of May 26 to the Geneva conference co-chairmen and participants, and uphold the Geneva agreement.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 339 (May 26, 1964). Names: Chen Yi. Check: the book''s sentence on the ''middle forces'' (查尔平原中间派部队起义) is read as the Plain of Jars middle-group troops'' rising; the Foreign Secretary''s name is not given.'
        tags: [polity:prc, polity:laos, polity:us, polity:uk, name:chen-yi]
        src:
          c: 13343ab7
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 339: all'
