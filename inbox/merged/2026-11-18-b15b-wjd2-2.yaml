        when: June 24–29
        date: '1963-06-24'
        thread: china
        also: [soviet-union]
        c: A Chinese women's delegation led by Yang Yunyu, secretary of the Secretariat of the All-China Women's Federation, attends the World Congress of Women at Moscow, June 24–29. The delegation issues statements on the Sino-Indian boundary question, on the "Letter to the Women of the World" and on the "Program of the International Democratic Federation of Women".
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 287 (June 24–29, 1963). Check: Yang Yunyu is 杨蕴玉 in the book; no name entry.'
        tags: [polity:prc, polity:ussr]
        src:
          c: 488e3086
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 287: all'
  - add:
