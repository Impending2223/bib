  - cite:
      id: cal.1962-06-04.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 230 (June 1–14, 1962, the visit; the talks at Dalian: Zhou meets Penn Nouth at Luda and says that all favor settling the South Vietnam and Laos questions by peaceful negotiation, since China, the Soviet Union and the Southeast Asian states, above all Cambodia and Burma, so favor, and Britain and France to some degree; on the Sino-Indian boundary, that it cannot be settled by talks because India means to use the border question to please the Western countries and win aid)'
      units: H
      E-G: null
  - add:
      entry:
        id: cal.1962-06-02.china
        when: June 2
        date: '1962-06-02'
        thread: china
        also: [south-asia]
        c: 'The Foreign Ministry sends a second note to the Indian embassy, flatly rejecting the Indian government''s reply of May 14 on responsibility for the areas it has invaded. China has always held that the boundary question should be settled by negotiation and peaceful means, but will never yield to a threat of force. It restates its protests and demands of Apr. 30 and May 28: India must stop the military provocations and withdraw its posts and troops from inside Chinese territory.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 230 (June 2, 1962). Check: the book calls it the Ministry''s note ''again'' (再次); whether the note of May 14 is India''s reply to China''s of Apr. 30, as the text implies.'
        tags: [polity:prc, polity:india]
        src:
          c: 8290ae5d
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 230: all'
  - add:
      entry:
        id: cal.1962-06-03.china
        when: June 3
        date: '1962-06-03'
        thread: china
        also: [south-asia]
        c: The 1954 Sino-Indian agreement on trade and intercourse between the Tibet region of China and India, signed for eight years, expires. China twice proposed negotiations for a new agreement; India refused the friendly proposals and insisted on unreasonable preconditions, so no talks were held.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 230 (June 3, 1962).'
        tags: [polity:prc, polity:india]
        src:
          c: 8fdc76c6
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 230: all'
  - add:
      entry:
        id: cal.1962-06-09.china
        when: June 9
        date: '1962-06-09'
        thread: china
        also: [vietnam-hanoi]
        c: The Foreign Ministry issues a statement on the "special report" of the Indian and Canadian members of the International Commission in Vietnam, which charges the DRV with "aggression and subversion" in South Vietnam. The report slanders the DRV and can only be taken as serving as an accomplice of the U.S. aggression. The DRV rightly condemns the two members' mistaken act and asks the two Geneva co-chairmen to reject the report. The Chinese government fully supports the DRV's stand and hopes the Indian and Canadian members will consider their position and contribute to upholding the Geneva agreements.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 231 (June 9, 1962).'
        tags: [polity:prc, polity:drv, polity:india, polity:canada, polity:us]
        src:
          c: e2f2c581
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 231: all'
