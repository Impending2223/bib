        thread: china
        c: At Rome the China Council for the Promotion of International Trade and the Italian Foreign Trade Association sign an agreement on setting up non-governmental trade representative offices in each other's capitals. The representatives will have a degree of diplomatic treatment.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 375 (Nov. 30, 1964).'
