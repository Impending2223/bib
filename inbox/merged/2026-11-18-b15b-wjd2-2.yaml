  - cite:
      id: cal.1964-12-31.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 378–379 (Dec. 31, 1964; Zhou receives the delegation of Lebanese members of parliament led by Kamal Jumblatt (卡迈勒·琼卜拉特) and his deputy (阿迪卜·费泽利); he says that the unity and solidarity of the Arab states is very important, for it is the need of anti-imperialism, anti-colonialism and the defense of your national independence; we have a common struggle and a common aim; the common struggle is that we both oppose imperialism and neocolonialism; the common task is to defend state sovereignty and national independence and win respect; to oppose any outsider''s aggression against us and any outsider''s interference in us; and to hold for trade between our countries on equality and mutual benefit; if we can realize these requirements we can realize peaceful coexistence)'
      units: A
  - cite:
      id: cal.1962-08-15.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 239 (Aug. 15, 1962; Mao Zedong, Liu Shaoqi and Zhou Enlai cable Khrushchev, First Secretary of the CPSU Central Committee and Chairman of the Council of Ministers, and Brezhnev, Chairman of the Presidium of the Supreme Soviet, congratulating them on the launching, formation flight and landing of Vostok 3 and Vostok 4)'
      units: all
  - cite:
      id: cal.1963-08-01.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 292 (Aug. 1, 1963; the rally supports the ninth World Conference against Atomic and Hydrogen Bombs, to meet at Hiroshima; it says the Chinese people will join the Japanese and all the world''s peoples in the struggle for the complete, thorough and resolute prohibition and destruction of nuclear weapons and firmly oppose the partial test ban treaty signed by the U.S., Britain and the Soviet Union; Zhou, Chen Yi, Vice-Premier Luo Ruiqing and other leaders attend)'
      units: B
  - cite:
