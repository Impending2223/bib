      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 341 (June 1–11, 1964; President Abdullah al-Sallal of the Yemen Arab Republic visits China at invitation; Mao receives him; Liu Shaoqi and Zhou hold talks with him; a treaty of friendship and agreements on economic and technical and on cultural cooperation are signed, the days not given in the book)'
