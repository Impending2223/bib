  - cite:
      id: cal.1963-12-14.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 308–309 (Dec. 14–21, 1963; Zhou visits the UAR officially at the invitation of President Nasser and Ali Sabri, Chairman of the Executive Council; he holds several talks with Nasser on Sino-UAR relations and matters of common concern)'
      units: A
  - cite:
      id: cal.1963-12-21.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 309 (Dec. 21, 1963; the joint communique: the Bandung conference was a glorious turning point in the Afro-Asian peoples'' anti-imperialist unity, and both sides resolve to keep its spirit; Zhou declares five principles of China''s relations with the Arab states and all African states: support for the Arab peoples'' struggle against imperialism and for national independence; for the Arab governments'' policy of peace, independence and nonalignment; for the Arab peoples'' wish for unity by the way they choose; for the Arab states'' settling their disputes by peaceful consultation; and for the Arab states'' sovereignty to be respected by all other states, against aggression and interference)'
      units: A
  - cite:
      id: cal.1963-12-19.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 309–310 (Dec. 19, 1963; at the third talk with Nasser Zhou says on Taiwan: the Cairo declaration promised that Japan would return the territories seized from China since 1894; after Japan''s surrender the Chiang Kai-shek government sent men in 1945 to take over Taiwan and made a man governor; if it were not Chinese, Chiang could not now hold it; Truman once declared Taiwan Chinese, but in the Korean war the U.S. made it its protectorate; the civil war between the Chinese people and Chiang is not ended, the way to end it being China''s own matter; the U.S. holding of Taiwan is an international question and must not be mixed with it; the China question cannot be discussed with the German and Korean questions, which are the result of the Second World War)'
      units: A-E
  - cite:
      id: cal.1963-12-20.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 310 (Dec. 20, 1963; Zhou''s press conference at Cairo: the aim of the African visit is to seek friendship and cooperation and to learn more; active support for the national democratic movements of Asia, Africa and Latin America is a chief part of China''s foreign policy; the first Asian–African conference succeeded by seeking common ground and putting differences aside and by keeping imperialism out and settling Afro-Asian questions among themselves; China has always supported the efforts of the Colombo states to mediate the Sino-Indian boundary dispute and promote direct talks)'
      units: B-E
  - add:
