  - add:
      entry:
        id: cal.1962-05-11.china
        when: May 11
        date: '1962-05-11'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, rejecting again India's proposal to negotiate a new trade and transit agreement in place of the 1954 agreement on Tibet. It regrets the proposal and rebuts the pretexts. It restates China's firm adherence to the five principles and its efforts to improve relations. The liberated new China cannot be pushed back to the position of the old China, and its territorial sovereignty is not to be violated.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 227 (May 11, 1962).'
        tags: [polity:prc, polity:india]
        src:
          c: b3785105
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 227: all'
  - add:
      entry:
        id: cal.1962-05-11.china-2
        when: May 11
        date: '1962-05-11'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a second note to the Indian embassy, a serious protest at Indian troops' intrusion into Tibet south of Spanggur Lake. It points out that the Indian government means to heighten tension along the western sector of the boundary. It demands that the Indian troops withdraw from their posts at once and stop all provocation; if not, India will bear all the consequences.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 227–228 (May 11, 1962).'
        tags: [polity:prc, polity:india]
        src:
          c: 19530eee
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 227–228: all'
  - add:
      entry:
        id: cal.1962-05-18.china-leadership-4
        when: May 18
        date: '1962-05-18'
        thread: china-leadership
        c: 'Chen Yi, Vice-Premier, with a Swiss National Council member: Switzerland keeps its political and military neutrality, which does no harm to the socialist camp. On the Sino-Soviet differences he says that, as Confucius said, brothers quarrel at home but together resist insult from outside. China has its independent views and the Soviet Union has its own; neither can force them on the other.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 228 (May 18, 1962). Made public: 2001. Names: Chen Yi. Check: the councillor is 福雷耳·阿曼特 in the book (the Latin form not recovered). Whether the talk was reported then.'
        tags: [polity:prc, polity:switzerland, polity:ussr, vis:only:prc+switzerland, name:chen-yi]
        src:
          c: 6e877577
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 228: all'
