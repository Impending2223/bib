        when: Oct. 29
        date: '1964-10-29'
        thread: china
        also: [africa]
        c: At Lusaka the Chinese ambassador to the United Republic of Tanzania, He Ying, as representative of the Chinese government, and Zambia's Foreign Minister, Kapwepwe, exchange letters establishing formal diplomatic relations between China and Zambia and the exchange of ambassadors. He Ying says in his letter that China welcomes Zambia's opening an embassy in China; Kapwepwe informs the Chinese representative that Zambia agrees to China's opening an embassy at Lusaka.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 369 (Oct. 29, 1964). Names: Kapwepwe. Check: the book gives the foreign minister as 卡普韦普韦; the book gives Zhou''s and Chen Yi''s congratulatory cables on Nov. 5.'
