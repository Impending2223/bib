      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 361–362 (Sept. 28–Oct. 3, 1964; President Alphonse Massamba-Débat of Congo (Brazzaville) comes to the 15th anniversary celebrations and visits China; Mao receives him; Liu Shaoqi and Zhou hold friendly talks with him; on Oct. 2 the two sides sign the treaty of friendship, and the agreements on economic and technical cooperation, on cultural cooperation and on maritime transport)'
