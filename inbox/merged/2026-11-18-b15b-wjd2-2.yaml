        when: July 21
        date: '1962-07-21'
        thread: china
        also: [laos]
        c: 'Geneva. Chen Yi, head of the Chinese delegation and Foreign Minister, at the 42nd plenary meeting of the enlarged conference on Laos: an international agreement for a peaceful settlement of the Laos question is a great contribution to peace. China will carry out the obligations it takes on, and hopes all participants will keep the common agreement. China hopes the settlement can be a new starting point for easing the tension in Southeast Asia. The U.S. should withdraw its troops from Thailand completely and stop its armed interference in South Vietnam.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 236–237 (July 21, 1962). Names: Chen Yi.'
        tags: [polity:prc, polity:laos, polity:us, polity:rvn, name:chen-yi]
        src:
          c: becfcc79
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 236–237: all'
  - cite:
      id: cal.1962-07-22.china-leadership-5
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 237 (July 22, 1962; Zhou receives the new Danish ambassador, Anker Svart (安克尔·斯怀特), and says: West German air force bases and training grounds in France, Britain and Belgium are agreed to by those governments but their peoples are not content; if Japanese militarism revives and sends troops to Korea, Taiwan, the Philippines, Indonesia, Malaya, Indochina, Thailand and Burma, even for exercises, the peoples there and Asians in general will not allow it)'
      units: B
  - cite:
      id: cal.1962-07-23.laos
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 237 (July 23, 1962; the enlarged Geneva conference on the peaceful settlement of the Laos question ends; the declaration on the neutrality of Laos and its protocol, adopted unanimously, take effect on signing; the fourteen signatories undertake to recognize and respect Laos''s sovereignty, independence, neutrality, unity and territorial integrity)'
      units: B-C
  - cite:
      id: cal.1962-07-25.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 237–238 (July 25, 1962; Zhou receives Renato Gaona (雷纳托·高纳), Chilean deputy and chairman of the Chamber''s public works committee)'
      units: B-C
  - cite:
      id: cal.1962-07-27.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 238 (July 27, 1962; Zhou gives the banquet for the Vietnamese delegation head, Foreign Minister Ung Van Khiem, and the Laotian delegation member Phoumi Vongvichit, attending the enlarged Geneva conference; his speech: the signing of the agreement is the start of a new struggle; its carrying out depends on all sides, above all the Lao people; the three Laotian sides should keep unity; the Geneva states have only the duty to keep it and no right to interfere in Laos''s internal affairs)'
      units: A-D
