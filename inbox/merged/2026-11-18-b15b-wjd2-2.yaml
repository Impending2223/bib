  - cite:
      id: cal.1963-10-09.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 302 (Oct. 9, 1963; Zhou receives Ishibashi Tanzan, a former Prime Minister and chairman of the Japanese industrial exhibition society, and tells him of four possible ways to normalize Sino-Japanese relations: Japan voids the Japan–Taiwan treaty and formally signs a treaty with China; Japan does not void it but signs with China, which the Chinese people will not accept; Japan''s present responsible officials, the Prime Minister or Foreign Minister, visit China and declare that they recognize only the People''s Republic, an indirect way; or a former Prime Minister visits China and makes a statement recognizing it; China in fact takes the fourth way and strives for the first, and hopes Ishibashi will work for it)'
      units: A-C
