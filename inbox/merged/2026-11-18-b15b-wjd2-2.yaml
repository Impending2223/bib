        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 305 (Oct. 27, 1963). Names: Ben Bella. Check: the book names the Party, government and military heads as 刘宁一, 方毅 and 李志民; the heads of the women''s and youth delegations are given in the book and are not entered here.'
        tags: [polity:prc, polity:algeria, name:ben-bella-ahmed]
        src:
