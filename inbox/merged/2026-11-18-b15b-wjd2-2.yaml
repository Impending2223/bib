        when: June 1
        date: '1964-06-01'
        thread: china
        also: [laos]
        c: Wang Bingnan, Vice-Minister of Foreign Affairs, receives the British chargé d'affaires, Garvey, and replies to the oral message the British Foreign Secretary sent through him on May 27. Only a conference of the foreign ministers of the Geneva states can be a practicable step to save the Laos situation. The Chinese government cannot agree to the British proposal of sounding out at Vientiane; that, it says, is plainly an attempt to excuse the U.S. wrecking of the Geneva agreement.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 341 (June 1, 1964). Made public: 2001. Check: the chargé is 贾维 in the book (Garvey?); Wang Bingnan is 王炳南, no name entry under that spelling.'
        tags: [polity:prc, polity:uk, polity:laos, polity:us, vis:only:prc+uk]
