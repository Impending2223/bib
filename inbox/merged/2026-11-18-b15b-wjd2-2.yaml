      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 370 (Oct. 31, 1964; Liu Shaoqi and Zhou jointly reply by cable to Sihanouk, head of state of Cambodia, strongly condemning the crimes of the U.S. and South Vietnamese troops in repeatedly invading Cambodia, raiding Cambodian villages and killing peaceful Cambodian civilians, and firmly supporting the just struggle of the Cambodian government and people to defend their sovereignty and territorial integrity; the reply says China cannot look on at any aggression that threatens the security of the Kingdom of Cambodia)'
      units: A
  - cite:
      id: cal.1964-11-04.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 371 (Nov. 4, 1964; Sukarno, President of Indonesia, returning from a visit to Korea, stops briefly at Shanghai; Zhou flies from Peking to meet him and holds talks with him; the two exchange views on the international situation and agree that world developments favor the peoples'' anti-imperialist struggle; Sukarno states Indonesia''s support for China''s nuclear test and for convening a conference of heads of government; Zhou says China proposed the conference to break the nuclear monopoly)'
      units: A-B
  - cite:
      id: cal.1964-11-05.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 371–372 (Nov. 5–13, 1964; the Chinese Party and government delegation, Zhou leading it and He Long, Vice-Premier and Marshal, deputy head, goes to the Soviet Union at the invitation of the CPSU Central Committee and Soviet government for the celebrations of the 47th anniversary of the October Revolution; the delegation attends the Moscow meeting of celebration and holds three talks, on Nov. 9, 11 and 12, with First Secretary Brezhnev, Kosygin, Chairman of the Council of Ministers, and other Soviet leaders)'
      units: A, C
  - add:
      entry:
        id: cal.1964-11-05.china-leadership-3
        when: Nov. 5
        date: '1964-11-05'
        thread: china-leadership
        also: [soviet-union]
        c: Mao Zedong, Liu Shaoqi, Zhu De and Zhou Enlai cable Brezhnev, First Secretary of the CPSU Central Committee, Kosygin, Chairman of the Council of Ministers, and Mikoyan, Chairman of the Presidium of the Supreme Soviet, congratulating them on the 47th anniversary of the October Revolution. The cable says that the Chinese people sincerely hope that the Chinese and Soviet parties, the two countries and their great peoples, on the basis of Marxism-Leninism and proletarian internationalism, and of the revolutionary principles of the 1957 declaration and the 1960 statement, will unite closely and oppose our common enemy, and so promote our common cause. The firmer our unity, the happier the revolutionary peoples of the world and the more our enemies fear.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 371 (Nov. 5, 1964). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Brezhnev, Mikoyan, Kosygin.'
        tags: [polity:prc, polity:ussr, name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:zhou-enlai, name:brezhnev-leonid, name:mikoyan-anastas, name:kosygin-aleksei]
