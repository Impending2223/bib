      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 269–270 (Feb. 8–28, 1963; Prince Norodom Sihanouk, head of state of Cambodia, visits China; Mao and Liu Shaoqi receive him and Zhou and Liu hold talks with him, the days not given; the calendar has him leave Peking on Feb. 18)'
      units: A
  - add:
      entry:
        id: cal.1963-02.china
        when: Feb., after the 8th
        date: 1963-02
        at: after 1963-02-08
        thread: china
        also: [south-asia]
        c: China and Cambodia issue a joint communique on Sihanouk's visit. Both consider the friendly, good-neighborly relations of mutual respect and equality between China and Cambodia a good model of peaceful coexistence of countries with different social systems. China thanks Prince Sihanouk for his sincere efforts for a peaceful settlement of the Sino-Indian boundary question and for direct talks, and for his fair attitude. Sihanouk holds that China's unilateral cease-fire and withdrawal show its wish for a peaceful settlement, and welcomes its understanding and cooperation toward the Colombo conference. China strongly condemns imperialism and its followers' infringement of Cambodia's sovereignty, independence and neutrality, and actively supports the measures the Cambodian government takes to respect its neutrality and territorial integrity.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 269–270 (Feb., after the 8th, 1963). Names: Norodom. Check: the book dates the communique within the visit of Feb. 8–28 and gives no day.'
