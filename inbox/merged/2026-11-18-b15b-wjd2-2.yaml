        when: June 13
        date: '1962-06-13'
        thread: china
        also: [laos]
        c: The Chinese government issues a statement on the three Laotian princes' agreement to form a provisional government of national union. It calls the agreement a great victory in the Lao people's struggle for peace, independence and neutrality. It warmly congratulates the Lao people. It sincerely hopes the government will soon be formed, and the people's wish for peace, independence and neutrality soon realized. The book's editors' note names the agreement as reached on June 12 on the Plain of Jars by Prime Minister Souvanna Phouma, Souphanouvong, chairman of the Neo Lao Hak Xat, and Boun Oum of Vientiane.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 231 (June 13, 1962). Names: Souvanna, Souphanouvong, Boun.'
        tags: [polity:prc, polity:laos, name:souvanna-phouma, name:souphanouvong, name:boun-oum-na-champassak]
        src:
          c: afb43210
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 231: all'
