      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 297–298 (Aug. 29, 1963; Mao''s statement against the aggression of the U.S.–Ngô Đình Diệm clique in South Vietnam and its slaughter of the South Vietnamese people: the Chinese people condemn the bloody suppression and support Hồ Chí Minh''s statement; the U.S. wrecked the first Geneva agreements and blocked Vietnam''s unification, wages the so-called special war in the south, and has wrecked the second Geneva agreement too and interferes in Laos; only deceivers or the very naive believe a piece of paper will make it lay down its butcher''s knife; the oppressed peoples must win liberation by unity and struggle)'
