  - cite:
      id: cal.1964-03-31.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 327 (Mar. 31, 1964; the reception, with other words of Zhou''s: Zhou receives Alvin Hamilton (汉密尔顿), Canadian M.P. and former Minister of Agriculture, and his wife; on Sino-American relations Zhou says they cannot be settled mainly for two key reasons the U.S. will not accept: first, that China and the U.S. can live in peaceful coexistence on the five principles of mutual respect for territorial sovereignty, nonaggression, noninterference in internal affairs, equality and mutual benefit; second, that the U.S. in principle agree to withdraw its forces from Taiwan and the Taiwan Strait, after which concrete talks can follow; China has proposed this many times and been refused)'
      units: A
  - add:
      entry:
        id: cal.1964-03-31.china
        when: Mar. 31
        date: '1964-03-31'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, flatly rejecting the Indian government's protest at the Chinese forces' setting up of stone cairns in the western sector of the boundary to mark the line of actual control between the two sides, and its other unreasonable protests to China. The purpose of such talk, with no basis in fact, is to poison the relaxed atmosphere of the boundary and to carry on anti-Chinese propaganda. China believes the Sino-Indian boundary question can be settled by negotiation and peacefully, and in the end it must be.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 327–328 (Mar. 31, 1964).'
        tags: [polity:prc, polity:india]
        src:
