      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 341 (June 9, 1964, the book''s day for the joint communique of Liu and Sallal; and the day of Zhou''s speech at the reception given by Sallal: the one effective way to settle the Laos question is an international conference of the states attending the Geneva conference; any attempt to exclude some of the participants or any of the three Lao sides is against the spirit of the Geneva agreement and cannot solve the question)'
