        when: June 26
        date: '1963-06-26'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, rejecting the Indian government's lie that China "violated Indian territory" and flatly refusing India's baseless protest. It says China is extremely indignant at the Indian government's unscrupulous repeated fabrication of absurd charges.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 287–288 (June 26, 1963).'
        tags: [polity:prc, polity:india]
