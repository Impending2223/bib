        thread: china
        also: [middle-east]
        c: Chen Yi cables the Foreign Minister of Iraq, Taleb Hussein Shabib, that the Chinese government decides to recognize the new Iraqi government. The coup of Feb. 8 put the "National Revolutionary Council" in power.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 270 (Feb. 12, 1963). Names: Chen Yi. Check: the book gives the minister as 塔列布·侯赛因·谢比卜; the Latin form is back-converted.'
