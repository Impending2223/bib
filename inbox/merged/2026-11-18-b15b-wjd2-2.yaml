        when: Feb. 9
        date: '1963-02-09'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry spokesman issues a statement sternly rejecting the *Times of India*'s fabricated report that China means to build a naval base in Ceylon. China has always opposed any country's setting up military bases on another's territory and any country's using aid to harm another's sovereignty. The fabrication is to harm China–Ceylon relations and the two countries' prestige. Ceylon's Defense and External Affairs Ministry also issues a communique denying the report.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 270 (Feb. 9, 1963). Check: the book''s 《印度时报》 is the Times of India.'
