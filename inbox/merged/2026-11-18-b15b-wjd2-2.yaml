      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 368 (Oct. 20, 1964; Zhou cables the heads of government of the world''s states, passing on the proposal in the Chinese government''s statement of Oct. 16 that a conference of heads of government be held to discuss the complete prohibition and thorough destruction of nuclear weapons: China holds for their complete prohibition and thorough destruction; its nuclear tests and the development of nuclear weapons were forced on it, to defend itself and its people against the U.S. nuclear threat; it solemnly declares it will never be the first to use them; it sincerely hopes the proposal will be given favorable consideration and a positive response)'
