        thread: china-leadership
        c: 'Liu Shaoqi and Zhou Enlai cable Prince Norodom Sihanouk, warmly congratulating the Kingdom of Cambodia on the 11th anniversary of its complete independence. The cable says: we sincerely thank His Highness and the Cambodian government for their support of the Chinese people in the struggles against U.S. imperialism and for the defense of national sovereignty and territorial integrity, and ...'
