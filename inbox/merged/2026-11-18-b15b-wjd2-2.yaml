  - cite:
      id: cal.1963-06-06.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 285–286 (June 5–23, 1963; Choe Yong Gon, Chairman of the Standing Committee of the DPRK Supreme People''s Assembly and Vice-Chairman of the Workers'' Party Central Committee, visits China; Mao receives him; Liu Shaoqi and Zhou first talk with him, the book saying the two sides'' positions and views were wholly in agreement)'
      units: A
  - cite:
      id: cal.1963-06-23.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 286 (June 5–23, 1963; the joint statement of the visit, the day not given in the book: the socialist countries must firmly oppose imperialism''s policy of aggression and war and support every struggle of oppressed peoples and nations; China fully supports the Korean government''s stand for Korea''s peaceful reunification; Korea fully supports China''s struggle to liberate Taiwan and its position on a peaceful settlement of the Sino-Indian boundary question; both firmly oppose the U.S. revival and rearming of Japanese militarism and the plot of a Northeast Asia military alliance; on the basis of the Moscow declaration, to strengthen the unity of the socialist camp and the communist movement is the fundamental interest of all peoples)'
      units: all
  - add:
      entry:
        id: cal.1963-06-06.china
        when: June 6
        date: '1963-06-06'
        thread: china
        also: [soviet-union]
        c: Zeng Yongquan, Vice-Minister of Foreign Affairs, receives the Soviet ambassador, Chervonenko, and hands over China's reply to the Soviet aide-memoire of Apr. 20 on the nonproliferation of nuclear weapons. The Soviet aim, it says, to please the U.S. by weakening the defense power of other socialist countries, above all by denying China nuclear weapons as the price of the U.S. signing a nonproliferation agreement, is a mistaken stand. China's resolve to oppose imperialism, uphold world peace and prevent nuclear war is unshakable. Whatever pressure is used, the Chinese people will never admit that one or several big powers hold a monopoly of nuclear power and a privilege of ordering other countries about.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 286 (June 6, 1963). Made public: 2001. Names: Chervonenko. Check: the vice-minister is 曾涌泉 in the book; no name entry.'
        tags: [polity:prc, polity:ussr, polity:us, vis:only:prc+ussr, name:chervonenko-stepan-v]
        src:
          c: e5221cb5
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 286: all'
  - add:
      entry:
        id: cal.1963-06-06.china-2
        when: June 6
        date: '1963-06-06'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, rejecting the Indian government's defense of its persecution of overseas Chinese. It demands that India at once stop all persecution of overseas Chinese, release unconditionally all those detained, compensate all their losses, give at once a full list of those held, and not use any pretext to hinder those in distress from returning home.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 287 (June 6, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: 86c1db84
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 287: all'
  - add:
