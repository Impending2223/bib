        c: The Foreign Ministry spokesman issues a statement on the Indian government's asking Bhutan to let Indian troops into Bhutan. The Sino-Indian military conflict is confined to the Sino-Indian border. Given the long friendship of China and Bhutan, to invent a Chinese threat or ambition against Bhutan only betrays the inventors' other purposes.
