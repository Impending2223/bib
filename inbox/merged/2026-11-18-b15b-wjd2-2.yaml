        c: China's first ambassador to France, Huang Zhen, presents his credentials to President de Gaulle. He reached Paris on June 2.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 341 (June 6, 1964). Names: Huang. Check: the book gives the president as 戴高乐.'
        tags: [polity:prc, polity:fr, name:huang-chen]
        src:
          c: 0f5943ac
          rows:
