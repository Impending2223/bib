      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 252 (Nov. 4, 1962; Zhou writes again to Nehru, urging him to consider the three proposals of the Oct. 24 statement: they were made in the spirit of the friendly relations before 1959; the line of actual control he means is basically that of Nov. 7, 1959; the proposals are reciprocal and equal, not one-sided or a demand for submission; India''s reply, however, offers only terms fit for a defeated enemy)'
      units: A
