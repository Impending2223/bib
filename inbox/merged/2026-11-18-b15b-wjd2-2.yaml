        when: July 30
        date: '1963-07-30'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at the Indian troops' two intrusions, on July 4 and 11, into the 呷咖公 plateau on the line of actual control of Nov. 7, 1959 in the eastern sector of the boundary.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 291 (July 30, 1963). Check: the place is 呷咖公台地 in the book; the Latin form is not recovered.'
        tags: [polity:prc, polity:india]
        src:
          c: 1c529bde
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 291: all'
  - cite:
      id: cal.1963-07-31.china
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 291–292 (July 31, 1963; the Chinese government''s statement on the partial nuclear test ban treaty signed at Moscow on July 25 by the U.S., Britain and the Soviet Union: they mean through the treaty to consolidate their nuclear monopoly and bind all countries threatened by nuclear weapons; the treaty, which separates stopping nuclear tests from the complete prohibition of nuclear weapons and makes it lawful for the three powers to go on making, stockpiling and using them, is a big fraud on the world''s peoples; China firmly opposes it and holds that nuclear weapons must be completely prohibited and destroyed, by practical, effective steps, to prevent nuclear war)'
      units: B
  - add:
      entry:
        id: cal.1963-07-31.china-2
        when: July 31
        date: '1963-07-31'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, once again protesting at the Indian troops' intrusion into Chinese territory at the Nathu La pass on the China–Sikkim boundary. It once again asks India to take down at once the works it has built inside China and to withdraw at once the Indian troops that have intruded into Chinese territory.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 292 (July 31, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: b57dc3d5
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 292: all'
  - cite:
