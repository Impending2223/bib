        id: cal.1962-05-23.china
        when: May 23
        date: '1962-05-23'
        thread: china
        also: [africa]
        c: China and Sudan sign their first trade agreement at Peking. Each grants the other most-favored-nation treatment in all matters of trade relations.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 228 (May 23, 1962).'
