        thread: china-leadership
        also: [laos]
        c: General Kong Le, chairman of the Laotian National Military Committee, begins a visit to China at the head of a Laotian military delegation (to June 16). Liu Shaoqi receives the delegation, the day not given.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 231 (June 10–16, 1962). Names: Liu Shaoqi, Kong Le. Check: the book does not give the day of Liu''s reception.'
