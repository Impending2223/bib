        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, again a serious protest at Indian troops' crossing the Nathu La pass on the China–Sikkim boundary and intruding into Chinese territory.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 285 (June 4, 1963). Check: the book''s 乃堆拉山口 is Nathu La, back-converted.'
