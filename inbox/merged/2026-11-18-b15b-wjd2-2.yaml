        when: Mar. 25
        date: '1963-03-25'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry spokesman issues a statement on the Indian government's press communique of Mar. 17, which defends its continued detention of overseas Chinese. The Chinese government and people are extremely indignant at this grave breach of international law. India must give the facilities customary in international practice for China to bring them home, and put no obstruction in the way.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 275 (Mar. 25, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: 472c0a62
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 275: all'
  - add:
