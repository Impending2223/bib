        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 225 (Apr. 30, 1962). Names: Liu Shaoqi. Check: the ambassador is 阿卜杜勒·拉赫曼·兹尼贝尔 in the book; the Latin form is back-converted. Zhou received him on May 22, [[cal.1962-05-22.china-leadership]].'
        tags: [polity:prc, polity:morocco, name:liu-shaoqi]
        src:
          c: '38207594'
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 225: all'
