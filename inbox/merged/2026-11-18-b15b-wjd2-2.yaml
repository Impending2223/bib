      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 377 (Dec. 24, 1964; Zhou receives the Cuban government''s trade delegation led by Raúl Maldonado (劳尔·马耳多纳多), Vice-Minister of Foreign Trade)'
