        id: cal.1963-02-23.china
        when: Feb. 23
        date: '1963-02-23'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, once more a strong protest at the Indian side's freezing and seizing the Bank of China's assets in India and its further persecution of the bank's staff. It restates that, since the Indian side sealed up the bank's offices in India and froze and seized its assets, India must bear all the losses to the Chinese side; China reserves all rights to compensation.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 272 (Feb. 23, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: cff9996e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 272: all'
