        when: Apr. 14
        date: '1964-04-14'
        thread: china
        also: [latin-america]
        c: The Foreign Ministry spokesman again issues a statement of strong protest at the Brazilian authorities' cruel torture of the arrested Chinese personnel. He demands that Brazil stop the persecution at once and release them, and protect their persons and lawful interests; otherwise the Brazilian military-political authorities must answer for all the grave consequences.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 330 (Apr. 14, 1964).'
        tags: [polity:prc, polity:brazil]
        src:
