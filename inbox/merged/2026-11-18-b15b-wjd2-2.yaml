        also: [japan]
        c: The Chinese People's Institute of Foreign Affairs and the Japan Socialist Party delegation sign a joint statement. The two sides unanimously confirm that the late Chairman Asanuma Inejirō's famous words, "U.S. imperialism is the common enemy of the Chinese and Japanese peoples", are right, and they are resolved to carry on and develop the "Asanuma spirit" and go on struggling with the peoples of Asia and the world to defeat the U.S. policy of aggression and war.
