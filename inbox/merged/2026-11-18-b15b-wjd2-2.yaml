        when: July 9
        date: '1962-07-09'
        thread: china
        also: [soviet-union]
        c: Mao Dun, chairman of the Chinese Writers' Association, speaks at the World Congress for General Disarmament and Peace at Moscow. Defend world peace, oppose imperialist aggression and keep imperialism from a new world war. U.S. imperialism pursues aggression and war, speeds arms and war preparation and makes tension in Asia, Latin America, Africa and Europe. The great unity of all the world's peoples is the surest guarantee of the cause of peace and general disarmament.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 235 (July 9, 1962). Check: Mao Dun is not tagged: no name entry.'
