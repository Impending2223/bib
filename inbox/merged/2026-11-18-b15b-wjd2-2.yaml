        date: '1963-01-17'
        thread: china
        c: The Foreign Ministry sends the British government a strong protest at the Hong Kong British authorities' attempt to pull down the houses of Kowloon Walled City and force its residents to move, a serious infringement of China's sovereignty. It stresses that Kowloon Walled City is Chinese territory and that jurisdiction over it has historically been China's. The British authorities should withdraw the demolition order at once and stop all removals.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 267 (Jan. 17, 1963).'
