      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 359–360 (Oct. 5, 1964; Liu Shaoqi and Sihanouk sign, for their two states, the joint communique: they strongly condemn the U.S. wrecking of the Geneva agreements of 1954 and 1962 and its stepped-up aggression and interference in Cambodia, Laos and Vietnam; the Indochina question can be settled only by convening a conference of the relevant Geneva states, and every other way is impracticable; if the U.S. persists in isolating itself and widening the war it will in the end suffer for it; both sides are very satisfied with the mutual support and economic and cultural cooperation of the two countries, closer than ever)'
      units: A
  - cite:
