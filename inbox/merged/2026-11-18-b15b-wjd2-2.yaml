  - cite:
      id: cal.1964-01-15.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 315 (Jan. 15, 1964; at Accra, answering Ghana News Agency reporters, Zhou announces the eight principles of the Chinese government''s economic and technical aid to other countries: aid on the principle of equality and mutual benefit, regarded as mutual; strict respect for the receiving country''s sovereignty, never asking privileges or attaching conditions; aid in the form of interest-free or low-interest loans, with repayment dates extended when needed; the aim to help the receiving country gradually to self-reliant, independent development; projects need little investment and bring quick returns; China supplies the best equipment and materials it makes, at international market prices; in giving technical aid, it ensures that the receiving country''s personnel master the technique fully; and its experts get the same material treatment as the receiving country''s own, with no special demands or privileges)'
      units: B
  - cite:
      id: cal.1964-01-16.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 315 (Jan. 16–21, 1964; Zhou visits Mali officially at President Modibo Keita''s invitation, with Chen Yi accompanying him, and holds talks with Keita)'
      units: A
  - cite:
      id: cal.1964-01-21.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 315 (Jan. 21, 1964; the joint communique: the central question of the international situation is the great struggle of the world''s peoples to defend world peace and promote human progress; both are resolved to work harder, by winning general disarmament and the complete prohibition and destruction of nuclear weapons, by opposing imperialism and every form of colonialism and by winning the peaceful coexistence of countries of different social systems, to defend world peace and develop international cooperation; both favor holding the second Asian–African conference; and the book notes that this was the first time the eight principles of China''s economic and technical aid were formally written into a joint communique)'
      units: B
  - add:
