  - cite:
      id: cal.1964-10-28.china
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 369 (Oct. 28–29, 1964; Zhou receives the Soviet ambassador Chervonenko, proposes contacts between the two parties, and informs him that the Chinese Central Committee has decided to send a party and government delegation under Zhou to Moscow; he proposes that the Soviet Central Committee and government use the October Revolution anniversary to invite representatives of 12 socialist countries to Moscow to celebrate it, so that contacts may be made)'
