  - add:
      entry:
        id: cal.1964-06-09.china
        when: June 9
        date: '1964-06-09'
        thread: china
        also: [middle-east-yemen]
        c: China and the Yemen Arab Republic issue a joint communique of Liu Shaoqi and Abdullah al-Sallal. The two sides hold that the main root of the present tension in the international situation is imperialism's policy of aggression and war. The solidarity of the Arab peoples and the solidarity of the Asian peoples is the basic interest of the Arab and Asian peoples; both firmly oppose any outside aggression and interference. They agree that a second Asian–African conference should be convened soon, to save the dangerous situation in the Indochina peninsula and to defend Asian and world peace.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 341 (June 9, 1964). Names: Liu Shaoqi, Sallal. Check: the book dates the communique June 9 within the visit of June 1–11; the Yemeni signatory is the President, Sallal.'
        tags: [polity:prc, polity:yemen, name:liu-shaoqi, name:sallal-abdullah-al]
        src:
          c: ca4da59f
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 341: all'
  - add:
