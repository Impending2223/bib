        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 374 (Nov. 25–Dec. 5, 1964). Names: Li Xiannian. Check: the book gives Li here as a Member of the Politburo (in the Oct. 5 item as an alternate member); the calendar has Zhou seeing him off on Nov. 23, [[cal.1964-11-23.china-leadership-2]].'
