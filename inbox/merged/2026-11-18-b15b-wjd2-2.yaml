  - cite:
      id: cal.1964-10-16.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 367 (Oct. 16, 1964; the Chinese government''s statement: China exploded its first atomic bomb at 15:00 on Oct. 16, 1964, and made its first nuclear test successfully, a major result of the Chinese people''s struggle to strengthen national defense and oppose the U.S. imperialist nuclear fraud and blackmail; China solemnly declares that it will never be the first to use nuclear weapons at any time or in any circumstances; it proposes to the governments of all countries a conference of heads of government to discuss the complete prohibition and thorough destruction of nuclear weapons, and as a first step an agreement of the nuclear and soon-to-be nuclear states to undertake not to use them, not to use them against non-nuclear states or zones, and not to use them against each other)'
      units: A-D
  - cite:
      id: cal.1964-10-16.china-leadership
