  - add:
      entry:
        id: cal.1963-02-17.china-leadership-2
        when: Feb. 17
        date: '1963-02-17'
        thread: china-leadership
        also: [south-asia]
        c: Chen Yi, Vice-Premier and Foreign Minister, receives Karlsson, a reporter of Swedish Radio and Television, and gives a television interview on the Sino-Indian boundary dispute. The large-scale armed conflict on the boundary was wholly started by India; the Chinese frontier troops' counterattack was wholly forced. China has always kept the five principles of peaceful coexistence in its relations with India, and holds for settling the border question amicably through negotiation on them. Until it is settled, the status quo on the boundary should be kept and armed conflict avoided.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 271 (Feb. 17, 1963). Names: Chen Yi. Check: the book gives the reporter as 卡尔逊.'
        tags: [polity:prc, polity:sweden, polity:india, name:chen-yi]
        src:
          c: acdc227a
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 271: all'
  - add:
      entry:
        id: cal.1963-02-21.china
        when: Feb. 21
        date: '1963-02-21'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, sternly rejecting the Indian government's note of last Dec. 31, which slandered China by way of the agreement in principle reached in the China–Pakistan boundary talks, and flatly refusing India's baseless protest. China has always kept out of the India–Pakistan dispute over Kashmir; the China–Pakistan boundary talks and agreement do not touch the ownership of Kashmir and are no concern of a meeting on that question between India and Pakistan. India's renewed slander, it says, shows it means to go on poisoning the atmosphere between China and India and to wreck China–Pakistan relations.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 271–272 (Feb. 21, 1963).'
        tags: [polity:prc, polity:india, polity:pakistan]
        src:
          c: 0701ec24
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 271–272: all'
  - add:
