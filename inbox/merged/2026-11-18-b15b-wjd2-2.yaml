        when: Nov. 24
        date: '1962-11-24'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strongest protest at the Indian government's cruel acts against overseas Chinese. On Nov. 20 the Indian government ordered all persons of Chinese blood in five counties of Assam and West Bengal to be detained and cruelly persecuted. This is a grave breach of international law and the norms of international relations. China firmly demands that India at once release all the detained Chinese, stop all persecution and truly protect the lives and property of the overseas Chinese. It reserves the right to claim compensation for the losses they suffer.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 256–257 (Nov. 24, 1962). Check: the book says 五县 (five counties) for the places; the districts are not named.'
