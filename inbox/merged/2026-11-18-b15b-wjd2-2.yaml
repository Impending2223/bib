  - add:
      entry:
        id: cal.1962-05-03.china
        when: May 3
        date: '1962-05-03'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry issues a press communique on the China–Pakistan agreement to negotiate on the boundary. The boundary between Xinjiang and the areas Pakistan actually controls has never formally been delimited. The two governments will negotiate to reach a common understanding of its alignment and sign a provisional agreement on that basis. Once the Kashmir dispute between Pakistan and India is settled, the sovereign authority will renegotiate the Kashmir boundary with China and sign a formal boundary treaty in place of the provisional agreement.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 226 (May 3, 1962).'
        tags: [polity:prc, polity:pakistan, polity:india]
        src:
          c: fa338d17
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 226: all'
  - add:
      entry:
        id: cal.1962-05-08.china
        when: May 8
        date: '1962-05-08'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy. India has unreasonably refused to let the All-India Trade Union Congress send delegates, at the invitation of the All-China Federation of Trade Unions, to visit China and attend the May Day celebration. China is surprised and regrets it. It says India is using the border question to obstruct the normal friendly contacts of the two peoples and to harm their friendship.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 226–227 (May 8, 1962).'
        tags: [polity:prc, polity:india]
        src:
          c: 6dc4a743
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 226–227: all'
  - add:
      entry:
        id: cal.1962-05-09.china-leadership-2
        when: May 9
        date: '1962-05-09'
        thread: china-leadership
        also: [soviet-union]
        c: Zhu De and Chen Yi attend the reception given by Czechoslovakia's ambassador, Josef Sedivy, for the 17th anniversary of the country's liberation. Chen Yi, in his speech, stresses the new U.S. atmospheric nuclear tests over the Pacific as a provocation. The Chinese people will work with the Czechoslovak people to oppose and stop the new war danger of a revived West German militarism.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 227 (May 9, 1962). Names: Zhu De, Chen Yi.'
        tags: [polity:prc, polity:czechoslovakia, polity:us, polity:frg, name:zhu-de, name:chen-yi]
        src:
          c: a0c2a019
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 227: all'
  - add:
      entry:
        id: cal.1962-05-04.china-leadership-3
        when: May 4
        date: '1962-05-04'
        thread: china-leadership
        also: [soviet-union]
        c: 'Chen Yi, Vice-Premier, receives the Mongolian ambassador, Sharab: China''s foreign policy holds first to friendship and mutual aid with the Soviet Union and the brother socialist countries, its foundation now and later; their internal differences can be settled by consultation or, failing that, set aside for now and kept from the enemy; differences among brothers are secondary and partial.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 226 (May 4, 1962). Made public: 2001. Names: Chen Yi. Check: the book''s 沙拉布 is the calendar''s Sharab; Zhou''s diplomatic chronology has Zhou receive him the same day, [[cal.1962-05-04.china-leadership-2]]: one meeting or two.'
        tags: [polity:prc, polity:mongolia, vis:only:prc+mongolia, name:chen-yi]
        src:
          c: 32489e78
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 226: all'
