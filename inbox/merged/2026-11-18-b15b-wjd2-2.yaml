patch: 2026-11-18-b15b-wjd2-2
by: 'Claude (batch 15, second wave: cite pass of the Foreign Ministry''s *Zhonghua renmin gongheguo waijiao dashiji*, vol. 2, Apr. 26, 1962-Dec. 31, 1964), Nov. 18, 2026'
ops:
  - add:
      entry:
        id: cal.1962-04-26.china-leadership-3
        when: Apr. 26
        date: '1962-04-26'
        thread: china-leadership
        also: [africa]
        c: 'Chen Yi, Vice-Premier, receives Ghana''s ambassador, Kobina Kesse. China does not believe a few big powers can decide the world''s fate: only the unity of the socialist countries and of the Asian, African and Latin American countries can. China''s taking part, as some say it might, would not alone settle the questions. That unity can restrain imperialism and keep it from a world war; only full independence of those countries makes imperialism fear; lasting peace is secure only when the peoples ruled by imperialism awake.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 224–225 (Apr. 26, 1962). Made public: 2001. Names: Chen Yi. Check: the ambassador is 科比纳·克西 in the book (Kobina Kesse?); Zhou received him the next day, [[cal.1962-04-27.china-leadership-4]].'
        tags: [polity:prc, polity:ghana, vis:only:prc+ghana, name:chen-yi]
        src:
          c: 7eb9e596
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 224–225: all'
