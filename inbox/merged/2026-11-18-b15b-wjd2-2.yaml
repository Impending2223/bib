        id: cal.1963-06-13.china
        when: June 13
        date: '1963-06-13'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at the serious incident of the Indian authorities' kidnapping and threatening overseas Chinese in distress and insulting Chinese diplomatic officials. It demands that the Indian government keep the arrangement the two sides reached on receiving them and ensure that all the detained overseas Chinese can return to the motherland with their families.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 287 (June 13, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: 2990e3e0
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 287: all'
