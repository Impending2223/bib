        also: [vietnam-hanoi]
        c: The Chinese government issues a statement supporting the Cambodian government in defending its sovereignty and opposing foreign interference and aggression. China, a neighbor of Cambodia and a party and guarantor of the 1954 Geneva agreements, cannot look on while the U.S. wrecks the international agreements and openly invades Cambodia. If Cambodia, which holds firmly to a policy of peace and neutrality, is invaded by the U.S. and its followers, the Chinese government and people will stand firmly on its side and support it with all their strength.
