        date: '1963-10-18'
        thread: china
        also: [vietnam-hanoi]
        c: The Foreign Ministry issues a statement on the United Nations' sending an "investigation mission" to South Vietnam. China fully supports the just stand set out in the DRV's statement of Oct. 14, condemns the new U.S. plot to wreck the Geneva agreements, and calls on all peace-loving countries and peoples to act to support the DRV's just proposals, to press the U.S. to withdraw its armed forces and all military personnel from South Vietnam and let the South Vietnamese people settle South Vietnam's question themselves.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 303 (Oct. 18, 1963).'
