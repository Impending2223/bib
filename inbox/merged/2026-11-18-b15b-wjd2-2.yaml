      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 304 (Oct. 21–Nov. 5, 1963; Edgar Faure, former Prime Minister of France, and his wife visit China; Mao and Liu Shaoqi each receive him; Zhou and Chen Yi hold several earnest and frank talks with him)'
      units: A
  - cite:
      id: cal.1963-11-02.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 304 (the visit''s end, the day not given in the book; Zhou, Chen Yi and Faure reach three tacit understandings on the basis of improving relations: Faure proposed direct relations between China and France and an immediate exchange of ambassadors; France recognizes only the government of the People''s Republic as the sole legal government representing the Chinese people; France supports the People''s Republic''s lawful rights and status in the United Nations; and after relations are established, when the Taiwan so-called "Republic of China" withdraws its "diplomatic representative" and its offices from France, France will correspondingly withdraw its diplomatic representative and offices from Taiwan)'
      units: A
  - cite:
