        when: Nov. 1
        date: '1962-11-01'
        thread: china
        also: [cuba]
        c: 'Chen Yi replies by note to the Cuban embassy''s chargé d''affaires: China fully supports the five demands in Prime Minister Castro''s statement of Oct. 28. The editors'' note gives them: that the U.S. at once end its naval and economic blockade, its subversive and sabotage activities and its pirate attacks on Cuba, stop violating Cuba''s territory and airspace, and withdraw from the Guantánamo base and return it. Chen Yi stresses that Cuba''s fate is in the Cuban people''s hands, not in any other country''s, and that Cuba''s independence and sovereignty are not negotiable and its freedom and rights not to be traded.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 251 (Nov. 1, 1962). Names: Chen Yi, Castro. Check: the chargé is 雷希诺·佩罗斯·阿尔达玛 in the book; the Latin form is not recovered.'
        tags: [polity:prc, polity:cuba, polity:us, name:chen-yi, name:castro-fidel]
        src:
          c: f900630e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 251: all'
