        c: A communique on the Chinese–Cuban economic and trade talks is issued. Both sides agree that they wish to strengthen further their economic and trade mutual aid and cooperation, to promote the development of the two peoples' common cause of opposing imperialism and building socialism.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 269 (Feb., after the 8th, 1963). Check: the book dates the communique within the visit of Feb. 8–23 and gives no day.'
