      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 268 (Jan. 19, 1963; Zhou replies to Prime Minister Bandaranaike of Ceylon''s letter of Jan. 14, saying that China in principle accepts the Colombo conference''s proposals as a preliminary basis for a meeting of Chinese and Indian officials to discuss a stable cease-fire and disengagement and to promote talks on the boundary, but keeps two explanations, to carry out the principles of equality of the two sides and consistency along every sector of the boundary)'
      units: A-B
  - add:
