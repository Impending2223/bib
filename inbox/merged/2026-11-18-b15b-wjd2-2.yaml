        when: Dec. 31
        date: '1964-12-31'
        thread: china-leadership
        also: [laos, vietnam-hanoi]
        c: Chen Yi, Vice-Premier and Foreign Minister, cables Prince Souphanouvong, Deputy Prime Minister of Laos, and Xuân Thủy, Foreign Minister of the DRV. China supports the Lao and Vietnamese peoples' just struggle and condemns the U.S. for widening the war of aggression from South Vietnam to Laos. It entirely agrees with Souphanouvong's proposal to convene a conference of the 14 states party to the Geneva agreement, to seek a peaceful settlement of the Lao question. He hopes the two co-chairmen of the Geneva conference will take on the duty of upholding the Geneva agreement and the peace of Indochina, and take the necessary measures to stop the U.S. widening of the war in Indochina.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 378 (Dec. 31, 1964). Names: Chen Yi, Souphanouvong, Xuân Thủy.'
        tags: [polity:prc, polity:laos, polity:drv, polity:us, name:chen-yi, name:souphanouvong, name:xuan-thuy]
        src:
          c: a9a4dd7a
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 378: all'
