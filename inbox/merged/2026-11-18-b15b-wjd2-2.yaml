        when: July 27
        date: '1963-07-27'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at Prime Minister Nehru's and other senior Indian officials' openly receiving personnel of the Chiang Kai-shek clique.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 291 (July 27, 1963). Names: Chiang Kai-shek, Nehru.'
        tags: [polity:prc, polity:india, polity:roc, name:chiang-kai-shek, name:nehru-jawaharlal]
        src:
          c: 52225c62
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 291: all'
