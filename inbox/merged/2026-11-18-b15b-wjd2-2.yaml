        when: Feb. 16
        date: '1963-02-16'
        thread: china
        c: The Chinese government replies to the Swiss government on its preparing to let Taiwan's authorities make "two Chinas" at the 20th International Red Cross Conference. Only representatives of the People's Republic of China are qualified to take part for the whole of China, Taiwan included. China resolutely opposes any plot to make "two Chinas".
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 271 (Feb. 16, 1963).'
