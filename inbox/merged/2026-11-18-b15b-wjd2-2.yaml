        c: The Foreign Ministry calls in the Indian embassy and informs it that the Chinese frontier troops have completed the withdrawal along the whole line and have set up checkposts on the Chinese side of the line of actual control of Nov. 7, 1959. It hopes the Indian government will respond positively to China's efforts for peace.
