        at: after 1963-01-20
        thread: china-leadership
        also: [south-asia]
        c: Chen Yi, Foreign Minister, speaks at the farewell banquet given by Tulsi Giri, Vice-Chairman of Nepal's Council of Ministers and Foreign Minister. The Chinese government in principle accepts the Colombo conference's proposals as a preliminary basis for talks between Chinese and Indian officials; China keeps its explanations of some points, and the Indian government may have its own. Where they differ, the two sides can try for a solution in direct negotiation.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 268 (Jan., after the 20th, 1963). Names: Chen Yi. Check: the book dates the speech within Giri''s visit of Jan. 18–24, after the signing of Jan. 20, with no day; the banquet is Giri''s, as the book words it. Whether the talk was reported then.'
