  - add:
      entry:
        id: cal.1964-05-13.china-leadership-5
        when: May 13
        date: '1964-05-13'
        thread: china-leadership
        also: [laos]
        c: Chen Yi, Vice-Premier and Foreign Minister, writes separately to Prince Souphanouvong, Deputy Prime Minister of the Lao government of national union, and to the two co-chairmen of the Geneva conference. China firmly opposes the U.S. wrecking of the peace and neutrality of Laos and fully supports the Lao people's struggle to defend the government of national union and the Geneva agreement. In his letter to the co-chairmen Chen Yi says that if the Lao situation goes on worsening, the Chinese government asks them to consider seriously Prince Sihanouk's proposal to reconvene the Geneva conference, and to consult on ways to remove the tension in Laos and Indochina.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 336 (May 13, 1964). Names: Chen Yi, Souphanouvong, Norodom.'
        tags: [polity:prc, polity:laos, polity:us, name:chen-yi, name:souphanouvong, name:norodom-sihanouk]
