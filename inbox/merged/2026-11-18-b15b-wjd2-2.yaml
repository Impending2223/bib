  - cite:
      id: cal.1964-04-18.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 330 (Apr. 12–May 5, 1964; Zhou and Chen Yi receive Matsumura Kenzō and his party; on the policy of independence and self-reliance Zhou says that if one does not firmly carry it out one becomes a satellite and the lackey of imperialism, a dependent state; independence does not exclude cooperation, for no country today can shut itself up and stand alone; true independence does not exclude international cooperation, that is, cooperation among truly friendly countries; China opposes the use of war and nuclear weapons by a few to deceive the world''s peoples and bully the weak; the book dates this to the visit, not to a day)'
      units: A-C
  - add:
      entry:
        id: cal.1964-04-15.china-leadership-3
        when: Apr. 15
        date: '1964-04-15'
        thread: china-leadership
        also: [africa-algeria-morocco]
        c: 'Mao Zedong receives all the members of the Algerian cultural delegation headed by Malek Bennabi, adviser to the leadership of the Algerian National Liberation Front. Mao says that Algeria''s victory is a great event: Africa has a country that fought its way out, and it has raised a banner for Africa that has great influence on Asia and Latin America too.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 331 (Apr. 15, 1964). Made public: 2001. Names: Mao Zedong. Check: the head is 马利克·本·纳比 in the book (Malek Bennabi?); back-converted. Whether the talk was reported then.'
        tags: [polity:prc, polity:algeria, vis:only:prc+algeria, name:mao-zedong]
        src:
          c: f6e7805e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 331: all'
  - cite:
      id: cal.1964-04-16.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 331 (Apr. 16, 1964; Mao, Liu Shaoqi, Zhu De and Zhou cable Khrushchev, First Secretary and Chairman of the Council of Ministers, congratulating him on his 70th birthday; the cable says that although there are differences between us on a series of questions of Marxism-Leninism and a state of disunity, we firmly believe it is temporary; once a great event occurs in the world, the Chinese and Soviet parties, the two countries and their peoples will stand together to deal with imperialism and the reactionaries of all countries, and they will tremble before our unity and always fail)'
      units: A-C
  - cite:
      id: cal.1964-04-16.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 331–332 (Apr. 16, 1964; Mao, receiving the special envoy of Congo (Brazzaville), Mabundi? Antoine (马布恩古·安托万), and a member of the Politburo of Congo (Léopoldville)''s African Solidarity Party, Mikedi (米都迪): we can aid each other; you help us as we help you; your opposing imperialism there and weakening one part of imperialism is good for the world''s peoples; we do not take your affairs as yours but as ours; we make no distinction of Asian, African, Latin American or European, so long as they are revolutionary; we have a duty to support you, and you have a right to our support; if the Chinese people did not support you they would be on the side of imperialism, not true Marxist-Leninists but selfish nationalists)'
      units: A, E
