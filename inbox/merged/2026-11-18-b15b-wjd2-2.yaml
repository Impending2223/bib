        when: Mar. 25
        date: '1963-03-25'
        thread: china-leadership
        c: Liu Shaoqi receives the Queen of Burundi, visiting China.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 275–276 (Mar. 25, 1963). Names: Liu Shaoqi. Check: the book gives the Queen as 德雷丝·卡尼昂加 (Thérèse Kanyonga?); back-converted.'
        tags: [polity:prc, polity:burundi, name:liu-shaoqi]
        src:
          c: 85ccd7da
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 275–276: all'
  - add:
      entry:
        id: cal.1963-03-25.china-2
        when: Mar. 25
        date: '1963-03-25'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, sternly pointing out that China and Pakistan have the right to negotiate the boundary and sign an agreement, and rejecting India's slander of their settlement. The provisional character of the China–Pakistan agreement and its not touching the ownership of Kashmir are quite clear. India's insisting that China has agreed with Pakistan on Kashmir's ownership is pure fabrication. India should not go on slandering and intimidating China but honestly learn from the friendly, good-neighborly, equal and mutually accommodating spirit the two sides showed in their talks, and settle the Sino-Indian boundary.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 276 (Mar. 25, 1963).'
        tags: [polity:prc, polity:india, polity:pakistan]
        src:
          c: 24d396aa
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 276: all'
  - add:
      entry:
        id: cal.1963-03-25.china-3
        when: Mar. 25
        date: '1963-03-25'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at India's use of the Tibetan rebel clique to interfere in China's internal affairs. For years the Indian government has let the clique, refugees in India, work subversion against Tibet. India says it will not allow the rebels political activity in India; yet the clique has just issued a statement as an "exile government" and a "Tibetan constitution", which is the result of Indian connivance and proof against India's own words.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 276 (Mar. 25, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: 6a5c624b
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 276: all'
  - add:
      entry:
        id: cal.1963-04-02.china
        when: Apr. 2
        date: '1963-04-02'
        thread: china
        also: [south-asia]
        c: The Defense Ministry spokesman issues a statement that the Chinese government has decided to release and send back all the Indian personnel captured, in batches and at places, beginning Apr. 10. Since the Chinese frontier troops began their unilateral cease-fire China has made a series of major efforts to create an atmosphere and conditions for peaceful settlement. It is regrettable that the Indian side has done nothing positive in response and has gone on with war mobilization and anti-Chinese activity.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 276–277 (Apr. 2, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: b95715e4
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 276–277: all'
  - add:
      entry:
        id: cal.1963-04-02.china-2
        when: Apr. 2
        date: '1963-04-02'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy on the decision to release and send back all the captured Indian personnel. It hopes the Indian government will rightly understand China's efforts and respond positively to China's proposal for early direct talks.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 277 (Apr. 2, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: 1e393c59
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 277: all'
  - add:
      entry:
        id: cal.1963-04-02.china-3
        when: Apr. 2
        date: '1963-04-02'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a serious protest at Indian reconnaissance in the course of intrusions. Since last December the Indian side has taken advantage of the Chinese frontier troops' unilateral cease-fire and withdrawal to intrude into Chinese territory in the western sector 16 times. China asks the Indian government to note the serious consequences of such intrusions and to stop all intrusion at once.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 277 (Apr. 2, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: c4f0e4bc
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 277: all'
  - cite:
      id: cal.1963-04-20.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 277–278 (Apr. 12–20, 1963; Liu Shaoqi visits Indonesia at invitation, holds talks with Sukarno and signs a joint statement, the day not given: the two sides will further consolidate their solidarity and friendship and expand economic and technical cooperation and cultural exchange; China firmly supports Indonesia''s struggle to recover West Irian and unify the country; Indonesia fully supports China''s struggle to liberate Taiwan and oppose "two Chinas" and to restore its lawful seat in the United Nations; both oppose outside interference in the Sino-Indian boundary dispute and hold imperialism and colonialism the root cause of the threat to world peace; China fully supports Indonesia''s proposals for a second Asian–African conference and for a "new emerging forces" games)'
      units: all
  - add:
      entry:
        id: cal.1963-04-16.china
        when: Apr. 16
        date: '1963-04-16'
        thread: china
        also: [laos]
        c: The Chinese government issues a statement on the situation in Laos. It strongly condemns the U.S. for plotting to overthrow Laos's provisional government of national union, firmly supports the Lao patriotic forces' strengthening of unity and opposition to U.S. interference and aggression. If the situation in Laos worsens, China demands that the 14-nation Geneva conference on Laos be reconvened.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 278 (Apr. 16, 1963).'
        tags: [polity:prc, polity:laos, polity:us]
        src:
          c: bd67f055
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 278: all'
  - cite:
      id: cal.1963-04-17.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 278 (Apr. 17, 1963; the capital''s mass rally commemorating the victory at Playa Girón and supporting the struggle of the peoples of Latin America, Zhou attending)'
      units: A
  - cite:
      id: cal.1963-04-18.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 278 (Apr. 18, 1963; a mass rally in the capital marks the eighth anniversary of the Bandung conference; Zhou and Vice-Premier He Long attend, He Long speaking: China supports the holding of a second Asian–African conference and of a three-continent conference at Havana)'
      units: A
  - add:
      entry:
        id: cal.1963-04.china-2
        when: Apr., after the 20th
        date: 1963-04
        at: after 1963-04-20
        thread: china
        also: [south-asia]
        c: China and Burma issue a joint communique on Liu Shaoqi's visit to Burma, Apr. 20–26. The Burmese side values the unilateral cease-fire and withdrawal and the release of prisoners China has taken for a peaceful settlement of the Sino-Indian boundary question. The Chinese side thanks the Burmese government for its sincere efforts to bring about direct China–India talks and for its fair attitude, and affirms that China will work unceasingly for a peaceful settlement of the question. Both sides stress that all countries have the right to choose freely their own political, economic and social systems and ways of life, with no outside interference or pressure.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 278–279 (Apr., after the 20th, 1963). Names: Liu Shaoqi. Check: the book dates the communique within the visit of Apr. 20–26 and gives no day; the leaders'' talks are given as several, with no days.'
        tags: [polity:prc, polity:burma, polity:india, name:liu-shaoqi]
        src:
          c: 13d658cb
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 278–279: all'
  - cite:
      id: cal.1963-04-20.china-leadership-5
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 278 (Apr. 20–26, 1963; Liu Shaoqi visits Burma at invitation; the leaders of the two sides hold talks several times, the days not given)'
      units: all
  - cite:
      id: cal.1963-04-21.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 279 (Apr. 21–25, 1963; Ali Sabri, Chairman of the Executive Council of the United Arab Republic, visits China; Mao receives him; Zhou holds talks with him on the Sino-Indian boundary question, matters of common concern, the situation in Asia and Africa and the further development of friendly cooperation between the two countries; the talks'' days are not given)'
      units: A
  - cite:
      id: cal.1963-04-21.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 279–280 (Apr. 21, 1963; Zhou, at the banquet welcoming Sabri: he sternly condemns the U.S. for directing and planning a series of political assassinations and armed clashes in Laos in an attempt to rekindle civil war; the co-chairmen of the Geneva conference and all its participants have a duty to stop U.S. interference and aggression there; China firmly supports Laos''s independence, peace and neutrality and its patriotic forces'' unity against the provocations of the Lao reactionaries)'
      units: B-C
  - add:
      entry:
        id: cal.1963-04-25.china
        when: Apr. 25
        date: '1963-04-25'
        thread: china
        also: [middle-east, south-asia]
        c: China and the United Arab Republic issue a joint communique on Sabri's visit. Both are convinced that the friendly relations built on the five principles and the ten principles of the Bandung conference will be consolidated and developed. China reaffirms its support for the Arab nation's struggle to safeguard independence and gain unity and for the rights of the Palestinian Arab people. The UAR reaffirms its support for the Chinese people's struggle to liberate Taiwan and for restoring China's lawful seat in the United Nations. For Asian–African unity and the interests of world peace, China and India should settle the boundary question peacefully by direct negotiations.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 279 (Apr. 25, 1963). Names: Sabri.'
        tags: [polity:prc, polity:uar, polity:india, name:sabri-ali]
        src:
          c: fa5bac15
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 279: all'
  - cite:
      id: cal.1963-04-23.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 280 (Apr. 23, 1963; Zhou, at the banquet given by Sabri: all Asian and African states, independent or not, face the common task of opposing imperialist and old and new colonialist aggression and interference, so their solidarity and mutual support are their highest interest; disputes among them are secondary and should be settled fairly on the basis of that common interest or, if that cannot be done, set aside for a time; they must watch for imperialism''s using them to sow discord)'
      units: B-E
  - cite:
      id: cal.1963-04-24.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 280 (Apr. 24, 1963; Zhou, on the trip with Sabri, on the philosophy behind China''s foreign policy: wait, and do not force one''s views on others; never fire the first shot; there is an old saying that courtesy must be returned, and if you wrong me I must hit back or be taken for weak; and "avoid three times", you come, I retreat first and warn you, again and again, but no more than three times)'
      units: D-G
  - add:
      entry:
        id: cal.1963-04-24.china
        when: Apr. 24
        date: '1963-04-24'
        thread: china
        also: [africa]
        c: China's first ambassador to Uganda, He Ying, presents his credentials to Dermot Joseph Sheridan, Uganda's Chief Justice, acting as Governor-General. He reached Kampala on Apr. 22.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 281 (Apr. 24, 1963). Check: the book gives the Chief Justice as 德莫特·约瑟夫·谢里丹; the Latin form is back-converted. He Ying is also the ambassador to Tanganyika, [[cal.1962-12-14.china]].'
        tags: [polity:prc, polity:uganda]
        src:
          c: df52a102
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 281: all'
  - cite:
      id: cal.1963-04-25.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 281 (Apr. 25, 1963; Mao receives José Matar (何塞·马塔), chairman of the national committee of Cuba''s Committees for the Defense of the Revolution; on the U.S. imperialists'' talk of "democracy": it is a high-handed, overbearing democracy and their words cannot be believed; they speak of complete disarmament, but what they do is expand arms everywhere)'
      units: B
  - add:
      entry:
        id: cal.1963-04-25.china-2
        when: Apr. 25
        date: '1963-04-25'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, rejecting the Indian government's slander of China on the release of the captured Indian personnel and the bringing home of overseas Chinese, and protesting India's stepped-up persecution of overseas Chinese.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 281 (Apr. 25, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: 9ad04629
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 281: all'
  - cite:
      id: cal.1963-04-30.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 281 (Apr. 25–May 4, 1963; the Guinean government''s economic delegation under Keita N''Famara, Minister of Trade, visits China; the 1963 trade agreement and a supplementary protocol to the economic and technical cooperation agreement are signed; Mao receives the delegation)'
      units: A
  - cite:
      id: cal.1963-05-03.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 281–282 (Mao receives the Guinean delegation, the day not given in the book: some want to bully us and think we are born incapable, fated to be oppressed by imperialism for ten thousand years, unable to run a country, do industry, feed ourselves or advance in science and culture; they should consider that this state of things is of their making, the low level of economy and culture being their doing)'
      units: B, G
  - add:
      entry:
        id: cal.1963-04-27.china
        when: Apr. 27
        date: '1963-04-27'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at the Indian government's cruel persecution of overseas Chinese. It makes four demands of the Indian government, among them that it punish the murderers of overseas Chinese, guarantee that persecution and ill-treatment will not occur again, and punish those responsible.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 282 (Apr. 27, 1963). Check: the book names four demands and gives only some; the rest are not in the book''s wording.'
        tags: [polity:prc, polity:india]
        src:
          c: e58d7837
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 282: all'
  - cite:
      id: cal.1963-05-05.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 282 (May 1–6, 1963; Liu Shaoqi visits Cambodia, holds talks with Sihanouk on strengthening the friendship of the two countries and on international questions of common concern, above all the Southeast Asian situation, and the two sign a joint statement, the day not given in the book: the two sides will keep the five principles and the Bandung ten principles; China supports Cambodia''s struggle for its sovereignty and territorial integrity and its policy of peace and neutrality; Cambodia holds that Taiwan is an inalienable part of China and supports China''s lawful rights in the United Nations; on the Sino-Indian boundary, Cambodia values China''s unilateral cease-fire and withdrawal and release of prisoners; both support a second Asian–African conference)'
      units: all
  - cite:
      id: cal.1963-05-15.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 283 (May 5–16, 1963; the Somali government delegation under Ali Mohamed Hirave, Minister of Information, visits China, to discuss developing trade and economic cooperation; Zhou, Li Xiannian and Vice-Premier Luo Ruiqing receive it; the book gives Zhou''s words, day not given: old colonialism took territory or split a people to rule it; new colonialism grants independence, even lets a country into the United Nations, but controls it in politics and economics, and a country not independent in economy cannot be so in politics and the military; for African peoples'' unity each country must first be independent, as a body is healthy only when each cell is)'
      units: A
  - add:
      entry:
        id: cal.1963-05-15.china
        when: May 15
        date: '1963-05-15'
        thread: china
        also: [africa]
        c: China and Somalia issue a joint communique on the Somali government delegation's visit, on the day they sign the first trade and payments agreement between the two governments.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 283 (May 15, 1963). See [[cal.1963-05-15.china-leadership-3]]. Check: the book gives only that a communique was issued; its content is not given.'
        tags: [polity:prc, polity:somalia]
        src:
          c: 283ce8e0
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 283: all'
  - cite:
      id: cal.1963-05-16.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 283–284 (May 10–16, 1963; Liu Shaoqi visits Vietnam; he and Hồ Chí Minh hold talks on common international questions and the two countries'' friendship and cooperation and sign a joint statement, the day not given in the book: the aggressive nature of imperialism will not change; the peoples must unite and struggle without letup against the imperialism headed by the U.S.; Vietnam firmly supports China''s consistent stand on settling the Sino-Indian boundary dispute by negotiation and peaceful means, and warmly values China''s cease-fire, withdrawal and release of prisoners; both stress that to defend and strengthen the unity of the socialist camp and of the international communist movement they must follow the Moscow declaration and statement)'
      units: all
  - cite:
      id: cal.1963-05-12.china
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 284 (May 12, 1963; Liu Shaoqi at the Hanoi mass rally of welcome: affirms the decisive influence and example of the socialist camp, which does not mean replacing or abolishing the revolutionary struggle of oppressed nations and peoples or class struggle within countries; the victories of the world''s peoples can be won only by each people''s own firm revolutionary struggle; the foreign policy of the socialist countries is, in essence, to develop mutual aid among them, hold to peaceful coexistence with countries of different systems and firmly support the revolutionary struggles of the oppressed; it cannot be reduced to peaceful coexistence alone, or replace the revolutionary line of the proletariat of each country)'
      units: A
  - add:
      entry:
        id: cal.1963-05-11.china
        when: May 11
        date: '1963-05-11'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a serious protest at Indian military personnel's repeated intrusion into Chinese territory and their deliberate making of tension on the boundary again.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 284 (May 11, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: 3109463f
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 284: all'
  - add:
      entry:
        id: cal.1963-05-20.china
        when: May 20
        date: '1963-05-20'
        thread: china
        also: [laos]
        c: The Foreign Ministry spokesman issues a statement on the situation in Laos. Only an immediate halt to U.S. aggression and interference in Laos can turn round the present dangerous situation. China fully supports the proposal made on May 5 by Souphanouvong, Deputy Prime Minister of the Lao government of national union and chairman of the Neo Lao Hak Xat, and fully supports the stand in the Vietnamese Foreign Ministry's statement of May 12. It hopes the two Geneva co-chairmen will carry out their duties and uphold the Geneva agreement.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 284–285 (May 20, 1963). Names: Souphanouvong.'
        tags: [polity:prc, polity:laos, polity:us, polity:drv, name:souphanouvong]
        src:
          c: 4cc01118
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 284–285: all'
  - cite:
      id: cal.1963-05-26.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 285 (May 26, 1963; the Defense Ministry spokesman''s statement: all the captured Indian military personnel released and sent back; China has made a series of major efforts of its own accord for Sino-Indian reconciliation; whether the boundary question is settled peacefully and soon depends wholly on the Indian government''s attitude)'
      units: A, C-D
