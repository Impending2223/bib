        c: Chen Yi, Vice-Premier and Foreign Minister, begins a visit to Indonesia (to Dec. 3). In the visit, the days not given, he meets President Sukarno and members of the cabinet presidium, and holds talks with First Deputy Prime Minister and Foreign Minister Subandrio and the Army Commander, Yani, exchanging information and experience on the common struggle against imperialism and colonialism.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 374 (Nov. 27–Dec. 3, 1964). Names: Chen Yi, Sukarno, Subandrio. Check: the book gives Yani as 陆军司令 (the Army''s Commander) with the name 雅尼; no name entry. The days of the single meetings are not given.'
