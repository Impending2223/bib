      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 292 (Aug. 1, 1963; Zhou receives the Japanese friends visiting Peking, Hoashi Kei, a member of the House of Representatives of the Japan Socialist Party, and others)'
      units: B
  - add:
      entry:
        id: cal.1963-08-01.china
        when: Aug. 1
        date: '1963-08-01'
        thread: china
        also: [south-asia]
        c: China and Afghanistan reach agreement on a draft boundary treaty. The Chinese and Afghan delegations' talks at Kabul, from June 17 to Aug. 1, on formally delimiting the boundary between the two countries, end in success. The two sides reach agreement on the position and alignment of the boundary line and on a draft of a boundary treaty, and issue a press communique.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 293 (Aug. 1, 1963).'
        tags: [polity:prc, polity:afghanistan]
        src:
          c: 180b6b18
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 293: all'
  - cite:
      id: cal.1963-08-02.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 293 (Aug. 2, 1963; Zhou writes to the heads of government of the world''s states, passing on the proposal of the Chinese government''s statement of July 31 that a conference of heads of government discuss the complete, thorough, resolute prohibition and destruction of nuclear weapons)'
      units: A
  - cite:
      id: cal.1963-08-03.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 293 (Aug. 3, 1963; Mao receives John Marks, in the book a member of the national executive committee of the African National Congress of South Africa, who has come to take part in China''s "South Africa Freedom Day" events)'
      units: B
  - cite:
      id: cal.1963-08-04.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 293–294 (Aug. 4–10, 1963; Prime Minister Abdirashid Ali Shermarke of Somalia visits China; Mao and Liu Shaoqi each receive him; Zhou holds talks with him and agreement is reached; the book dates Zhou''s statement to him of the principles of Chinese aid to Aug. 5: no demand for privileges or political conditions, which would be imperialism or great-power chauvinism; the purpose only to help build a national independent economy by degrees, not to block it or increase reliance on outside; experts sent or students received only to raise their own builders; aid to the measure of means and no promise that cannot be kept)'
      units: A, E
  - cite:
      id: cal.1963-08-09.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 293 (Aug. 9, 1963; the two governments sign the agreement on economic and technical cooperation: China agrees to give Somalia, from Oct. 1, 1963 to Sept. 30, 1970, an interest-free loan without conditions or privileges of 80 million Swiss francs, to supply complete sets of equipment, technical aid and other goods)'
      units: B
  - add:
      entry:
        id: cal.1963-08-10.china
        when: Aug. 10
        date: '1963-08-10'
        thread: china
        also: [africa]
        c: China and Somalia issue a joint communique on Prime Minister Shermarke's visit. Shermarke says that the African countries, once independent, should consolidate their political independence further and win economic independence; the Chinese Premier fully agrees. The two sides agree that aid to any country must respect the receiving country's independence and sovereignty and help its self-reliant economy, with no political conditions attached. They resolutely support the just struggle of the African peoples still under colonial rule for independence and freedom, and hold that disputes among Asian and African states should be settled by peaceful means.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 293–294 (Aug. 10, 1963). Names: Shermarke.'
        tags: [polity:prc, polity:somalia, name:abdirascid-ali-shermarke]
        src:
          c: af285de7
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 293–294: all'
  - cite:
      id: cal.1963-08-09.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 294 (Aug. 8, 1963; Mao receives African guests, among them Ali Mohamed Chamy (阿里·穆哈默德·沙米), chairman of the Comoro national liberation movement, and issues a statement calling on the world''s peoples to unite against the racial discrimination of U.S. imperialism and to support the struggle of American Blacks against it)'
      units: A
  - cite:
      id: cal.1963-08-11.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 294–295 (Aug. 11, 1963; Zhou receives a Colombian parliamentary delegation headed by the Speaker of the Chamber, José Antonio Anzisa Lopez (何塞·安西萨·洛佩斯); on the ban on nuclear weapons: China holds for complete, thorough and resolute prohibition and destruction; the nuclear powers say it cannot be done at a stroke; so let a Latin American and African nuclear-free zone be set up first, with the future possible nuclear powers also bound not to use, import, stock or test; if Latin American or African governments propose it, China will respond first and take on the duty)'
      units: A, C-D
  - cite:
      id: cal.1963-08-12.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 295 (Aug. 12, 1963; Zhou and Chen Yi receive the Pakistani ambassador, Raza (罗查); Chen Yi on the three powers'' test ban treaty: the treaty''s fraud must be seen through, for after its signing underground tests are made lawful, which in truth is a nuclear monopoly and a political monopoly, and China must stress exposing and opposing it; on Sino-American relations, Zhou says that the U.S. is not truly trying to improve them, and Chen Yi that to improve them the U.S. must settle the Taiwan question, restore China''s lawful rights in the United Nations, lift the economic blockade and withdraw the military bases threatening China, nuclear bases among them)'
      units: A-B
