  - add:
      entry:
        id: cal.1962-09-03.china
        when: Sept. 3
        date: '1962-09-03'
        thread: china
        also: [soviet-union]
        c: 'Huang Zhen, Vice-Minister of Foreign Affairs, receives the Soviet embassy''s chargé d''affaires and hands over China''s reply (an aide-memoire) to the Soviet government''s notification of Aug. 25 on stopping the spread of nuclear weapons. China holds that all countries should have no nuclear weapons: first the countries that now have them must bind themselves to ban the testing, making, stocking and use of nuclear weapons, and destroy all they hold. Until imperialism accepts a total ban, the socialist countries should work for nuclear superiority. Rusk''s suggestion is a big plot to bind China to a duty not to have them. China declares that no international disarmament agreement or other agreement made without the formal participation and signature of the People''s Republic''s representative can bind China.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 241 (Sept. 3, 1962). Made public: 2001. Names: Huang, Rusk. Check: the chargé is 梅晓兹夫 in the book; the Latin form is not recovered. The Soviet notification of Aug. 25 is not in the calendar.'
        tags: [polity:prc, polity:ussr, polity:us, vis:only:prc+ussr, name:huang-chen, name:rusk-dean]
        src:
          c: 58fa777c
          rows:
