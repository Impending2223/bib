  - add:
      entry:
        id: cal.1964-12-03.china
        when: Dec. 3
        date: '1964-12-03'
        thread: china
        also: [indonesia]
        c: China and Indonesia issue a joint press communique on Chen Yi's visit. The two sides agree that the struggles against imperialism and colonialism in the world today are an indivisible whole. The peoples of the Asian, African and Latin American countries and all the new emerging forces in the world must support one another, strengthen unity and cooperate closely. The Indonesian government again states its firm support for China's struggle to recover its lawful rights in the United Nations.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 374–375 (Dec. 3, 1964). Names: Chen Yi.'
        tags: [polity:prc, polity:indonesia, name:chen-yi]
