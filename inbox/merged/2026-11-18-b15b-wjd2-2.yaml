        date: '1962-12-08'
        thread: china
        also: [south-asia]
        c: 'The Foreign Ministry sends a note to the Indian embassy: the Indian government has demanded that China withdraw its consulates general at Calcutta and Bombay, tearing up the agreement on the mutual setting up of consulates general unilaterally. China protests strongly. It decides to withdraw the two consulates general and recall their staff from Dec. 15, but says the decision does not mean China accepts India''s unreasonable demand or agrees to India''s one-sided action.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 258–259 (Dec. 8, 1962).'
