      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 314 (Jan. 12, 1964; Liu Shaoqi and Zhou jointly cable Panama''s President Chiari, expressing the Chinese government''s and people''s great indignation at the U.S. violation of Panama''s sovereignty and killing of its people, and their high respect for the struggle to defend sovereignty and oppose U.S. aggression)'
      units: A
