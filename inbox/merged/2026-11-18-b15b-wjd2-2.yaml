        c: The Defense Ministry spokesman issues a statement on the Chinese frontier troops' continuing to withdraw of their own accord along the whole Sino-Indian boundary. The troops are loyally carrying out the Chinese government's decision and have created the most favorable conditions for talks. It is regrettable, he says, that the Indian authorities go on making war preparations and repeatedly send aircraft and armed police into Chinese territory and airspace to harass and provoke. This cannot fail to draw the serious attention of all who care for world and Asian peace.
