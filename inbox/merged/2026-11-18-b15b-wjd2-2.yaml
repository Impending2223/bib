      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 274 (Mar. 6–10, 1963; King Savang Vatthana of Laos visits China; Liu Shaoqi and Zhou talk with the King and Prime Minister Souvanna Phouma on respect for Laos''s independence and neutrality and other questions)'
      units: A
  - cite:
      id: cal.1963-03-07.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 274 (Mar. 6–10, 1963; the book gives Mao''s words to the King and his party: we are friends; we respect you; your affairs you should manage yourselves, and foreign interference in them is a very bad thing; the day is not given)'
      units: D-F
  - add:
      entry:
        id: cal.1963-03-10.china
        when: Mar. 10
        date: '1963-03-10'
        thread: china
        also: [laos]
        c: China and Laos issue a joint communique on the King's visit. The Chinese government will, as before, faithfully carry out its international obligations under the Geneva conference and firmly support the Lao royal government's policy of peace and neutrality. The Lao side thanks China for its important contribution to Laos's peace, independence and neutrality. Both sides declare that they will go on developing friendly and good-neighborly relations on the five principles of peaceful coexistence and the spirit of the Bandung conference.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 274 (Mar. 10, 1963). Names: Savang Vatthana, Souvanna.'
        tags: [polity:prc, polity:laos, name:savang-vatthana, name:souvanna-phouma]
        src:
          c: 70b09d95
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 274: all'
  - add:
      entry:
        id: cal.1963-03-10.china-2
        when: Mar. 10
        date: '1963-03-10'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a serious protest at Indian troops' renewed intrusion into the Pangong Lake area of Tibet. The places the Indian troops entered are places where, last year, Indian troops intruded and set up aggressive posts, and the Chinese side, after beating off the attack Indian troops launched, withdrew of its own accord. If the Indian side continues the intrusions it can in no way escape the responsibility for stirring up tension on the boundary again and blocking a peaceful settlement.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 274 (Mar. 10, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: e01c34b0
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 274: all'
  - add:
      entry:
        id: cal.1963-03-13.china-leadership-3
        when: Mar. 13
        date: '1963-03-13'
        thread: china-leadership
        also: [latin-america]
        c: 'Mao Zedong receives a delegation of the Cuban Communist Youth League led by a member of its national committee, with other Latin American guests. He says that to build a country well takes time and depends on the support and help of friends everywhere, but first on oneself and then on others. Help is mutual: the people of one country help the people of another, and the oppressed of the whole world help one another.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 274–275 (Mar. 13, 1963). Made public: 2001. Names: Mao Zedong. Check: the Cuban leader is 豪尔赫·加粕多尔 in the book (the Latin form is not recovered). Whether the talk was reported then.'
        tags: [polity:prc, polity:cuba, vis:only:prc+cuba, name:mao-zedong]
        src:
          c: 4c05d48e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 274–275: all'
  - add:
      entry:
        id: cal.1963-03-15.china
        when: Mar. 15
        date: '1963-03-15'
        thread: china
        also: [middle-east]
        c: Chen Yi cables Syria's Foreign Minister, Salah al-Din Bitar, that the Chinese government decides to recognize the new Syrian government. The editors' note gives the coup of Mar. 8, in which the "National Command of the Revolution" took power and formed a new government.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 275 (Mar. 15, 1963). Names: Chen Yi. Check: the book gives the minister as 萨拉赫丁·比塔尔; the Latin form is back-converted.'
        tags: [polity:prc, polity:syria, name:chen-yi]
        src:
          c: 5ead5183
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 275: all'
  - add:
      entry:
        id: cal.1963-03-24.china
        when: Mar. 24
        date: '1963-03-24'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, again a serious protest at Indian troops' repeated intrusion into Chinese territory and airspace on the China–Sikkim boundary. It formally demands that the Indian government stop all intrusions on the boundary, remove all the works, large and small, it has set up illegally inside China, and order the intruding troops to leave Chinese territory at once.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 275 (Mar. 24, 1963).'
        tags: [polity:prc, polity:india]
        src:
          c: c27f899b
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 275: all'
