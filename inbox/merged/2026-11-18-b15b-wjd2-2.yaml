          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 332: all'
  - cite:
      id: cal.1964-04-23.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 332–333 (Apr. 23, 1964; Zhou receives the Kansai economic friendship delegation led by Sugano Watarō (菅野和太郎), Liberal Democratic Party Diet member and adviser of the Kansai headquarters of the Japan International Trade Promotion Association; Zhou says that to run its own country China must be independent in economy and technique too; true independence is still some way off; but a policy of closing the door and standing alone is impossible, China hopes to cooperate with other countries on mutual respect and equality and mutual benefit if they wish it)'
      units: A, C
