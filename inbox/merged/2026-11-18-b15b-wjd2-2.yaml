        c: The Foreign Ministry spokesman, by order, issues the 227th to the 274th serious warnings at U.S. military aircraft and warships entering Chinese airspace and waters off Guangdong, Guangxi, Fujian, Jiangsu and Shandong. The chronology gives the run as Jan. 13 to Dec. 27.
