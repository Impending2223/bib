  - add:
      entry:
        id: cal.1964-05-26.china-leadership
        when: May 26
        date: '1964-05-26'
        thread: china-leadership
        also: [laos]
        c: Chen Yi, Foreign Minister, writes to the two co-chairmen of the Geneva conference and the participants, proposing a conference of the foreign ministers of 14 states at Geneva in June, to discuss Laos first. The Lao situation, he says, is getting more serious by the day. U.S. aircraft's bombing and reconnaissance flights in Laos are the first step of direct armed interference; at the same time the U.S. and its followers have stepped up attacks and aggression against Cambodia and publicly plot to widen the war of aggression in South Vietnam, so that the peace and security of the whole Indochina region are gravely threatened. China thinks that to save Laos from this danger a reconvening of the Geneva conference of the participants is quite necessary and urgent. He hopes the co-chairmen will bring the three Lao sides together to form a delegation of the three forces to attend, so that the conference may meet soon.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 338–339 (May 26, 1964). Names: Chen Yi.'
        tags: [polity:prc, polity:laos, polity:us, polity:cambodia, name:chen-yi]
        src:
          c: 52876f31
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 338–339: all'
