          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 288–289: all'
  - cite:
      id: cal.1963-07-12.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 290 (July 12 and 20, 1963; Zhou receives twice the representatives of Bertrand Russell, Ralph Schoenman and Patrick Pottle; when Schoenman says he fears a nuclear war may start from a false report, or from leaders not bearing tension and judging wrongly, Zhou says that people attend to accidents when the harm is small and still more when it is large; now that the destructiveness of nuclear war is known, insurance and defense against it are attended to; the countries that hold nuclear weapons know they hurt the holder too; the world''s people and the peace movement can go further, so that the owners agree not to use them)'
      units: A, D-E
  - cite:
      id: cal.1963-07-20.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 290 (July 20, 1963; Zhou receives the two representatives of Russell a second time)'
      units: A
  - add:
      entry:
        id: cal.1963-07-18.china
        when: July 18
        date: '1963-07-18'
        thread: china
        also: [soviet-union]
        c: The Foreign Ministry sends a note to the Soviet embassy, replying to the Soviet explanation of Sept. 19, 1962 of its subversive activities in Xinjiang and holding that China should answer for the illegal border crossings. Forced beyond endurance, it says, China has told the truth about the Soviet side's subversion in Xinjiang. It cites facts that the Soviet side not only incited and helped the illegal crossings but that the Soviet consulates and the Soviet expatriates' association, under the consulates' direction, plotted from within Xinjiang, causing the mass crossings of April and May 1962. The editors' note gives the Yining armed riot of May 29, 1962, in which Soviet expatriates took part and called on Chinese citizens to go to the Soviet Union. China is willing once more to urge the Soviet government, for Sino-Soviet unity, to return at once and unconditionally all the illegally crossed Chinese citizens, stop its subversion, and control the border strictly.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 289 (July 18, 1963). Made public: 2001.'
        tags: [polity:prc, polity:ussr, vis:only:prc+ussr]
        src:
          c: 4915da95
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 289: all'
  - add:
      entry:
        id: cal.1963-07-18.china-2
        when: July 18
        date: '1963-07-18'
        thread: china
        also: [vietnam-hanoi]
        c: The Foreign Ministry issues a statement sternly condemning the U.S. for wrecking the Geneva agreements and blocking the peaceful reunification of Vietnam. China firmly opposes the U.S. war of aggression in South Vietnam and says it fully supports the DRV's just demands and serious stand.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 289 (July 18, 1963).'
        tags: [polity:prc, polity:drv, polity:us]
        src:
          c: a1228181
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 289: all'
  - add:
      entry:
        id: cal.1963-07-19.china
        when: July 19
        date: '1963-07-19'
        thread: china
        also: [soviet-union]
        c: The Foreign Ministry spokesman issues a statement of strong protest at the Czechoslovak government's demand that China recall three Xinhua correspondents, one of them 黄振声. It is a step, he says, that worsens Sino-Czechoslovak relations and deepens the divergence in the international communist movement.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 290 (July 19, 1963). Check: the correspondent is 黄振声 in the book, named with two others not named.'
        tags: [polity:prc, polity:czechoslovakia]
        src:
          c: 877f9526
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 290: all'
  - add:
      entry:
        id: cal.1963-07-20.china-leadership-8
        when: July 20
        date: '1963-07-20'
        thread: china-leadership
        also: [south-asia]
        c: 'Mao Zedong, receiving the Ceylonese ambassador, Perera, says that a country''s affairs should be handled by itself and others should not interfere. Any country, big or small, should have equal relations; that is the five principles: nonaggression, mutual respect for territorial sovereignty and integrity and the rest. He says the U.S. hand reaches far: once it reached Asia, India; now Africa, Europe, Australia, Canada. This will lead to a change; the controlled countries and peoples will one day rise against the U.S.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 290 (July 20, 1963). Made public: 2001. Names: Mao Zedong. Check: the ambassador is 佩雷拉 in the book (the calendar''s Perera, [[cal.1963-06-29.china-leadership]]). Whether the talk was reported then.'
        tags: [polity:prc, polity:ceylon, polity:us, vis:only:prc+ceylon, name:mao-zedong]
        src:
          c: 66d5891c
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 290: all'
  - cite:
      id: cal.1963-07-23.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 291 (July 23, 1963; the reception, Zhou and Chen Yi attending; Chen Yi speaks: the joint exercise of the U.S., British and Indian air forces to be held in India is a step by India toward reliance on imperialism and makes tension on the boundary, and the Colombo conference states should note it; it threatens India''s neighbors, Pakistan above all; China''s resolve to settle the boundary question peacefully will not change)'
      units: B
  - add:
