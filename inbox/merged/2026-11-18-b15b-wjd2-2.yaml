        date: '1963-06-20'
        thread: china-leadership
        c: Zhu De receives Chilean guests, among them a deputy and the chairman of the Christian Democratic Party's group in the Chamber.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 287 (June 20, 1963). Names: Zhu De. Check: the book gives the chairman as 卡洛斯·席博里·阿尔塞雷卡; the Latin form is not recovered.'
        tags: [polity:prc, polity:chile, name:zhu-de]
        src:
