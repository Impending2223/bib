  - cite:
      id: cal.1964-05-14.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 337–338 (May 14, 1964; Zhou receives the well-known Liberal Democratic Party men Kitamura Tokutarō and Kawasaki Hideji and others and says that U.S. policy toward China had three stages: the first, when the Yangtze was nearly crossed and China nearly freed in 1950, the U.S. was ready to recognize new China on condition that it stay neutral between the U.S. and the Soviet Union; the second, the Korean war, when the U.S. turned its face and sent the Seventh Fleet to Taiwan; the third, now, with France''s recognition, the U.S. policy of hostility to China can no longer be kept up and it is ready to recognize the People''s Republic but to exclude Taiwan and make it an independent political unit, "one China, one Taiwan", which is in fact "two Chinas", opposed not only by the Chinese people but by Chiang Kai-shek)'
      units: A, F
