        c: 'At Peking, Matsumura Kenzō takes part, as the Japanese representative, in the exchange of notes on three sets of minutes of talks: the Liao Chengzhi Office''s and the Takasaki Office''s minutes on exchanging representatives and setting up liaison offices, the minutes on exchanging journalists between China and Japan, and the minutes of the memorandum trade talks.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 330 (Apr. 19, 1964). Names: Takasaki. Check: the book gives the offices as 廖承志办事处 and 高崎办事处; the Latin forms are back-converted. Matsumura is not tagged: no name entry.'
