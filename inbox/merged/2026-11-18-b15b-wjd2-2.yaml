        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at Indian reconnaissance across the line of actual control of Nov. 7, 1959 at the Dongmula pass in the eastern sector. It demands that India stop such intrusions.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 288 (June 28, 1963). Check: the book''s 东姆拉山口 is back-converted (Dongmula).'
