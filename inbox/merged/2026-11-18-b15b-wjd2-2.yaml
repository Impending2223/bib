      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 301 (Sept. 29–Oct. 9, 1963; Ammar Ouzegane (阿马·乌兹加尼), Algeria''s Minister of State, leads a government delegation visiting China; Zhou and Chen Yi hold talks with it; the Chinese government agrees to give Algeria a long-term interest-free loan with no conditions attached)'
      units: A
  - cite:
      id: cal.1963-09-30.china-leadership-7
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 301 (Sept. 30, 1963; Zhou at the National Day reception: in international affairs China firmly holds that all countries, large or small, should be equal and each country''s affairs decided by its own people; it opposes big-power oppression of small countries, the manipulation of international affairs by a few big powers and big-power chauvinism of every kind; it gives its utmost support to the national and democratic movements of Asia, Africa and Latin America and actively develops friendly relations with those countries on the five principles of peaceful coexistence)'
      units: B
