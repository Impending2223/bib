  - cite:
      id: cal.1964-12-19.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 376 (Dec. 18–24, 1964; Aziz Sidqi, Deputy Prime Minister of the United Arab Republic, leads an industrial and economic delegation visiting China; Liu Shaoqi and Zhou each receive Sidqi, his wife and the members of the delegation; Vice-Premier Bo Yibo holds talks with Sidqi, and the two sides sign an agreement on economic and technical cooperation between the two governments)'
      units: A
  - add:
      entry:
        id: cal.1964-12-19.china-leadership-5
        when: Dec. 19
        date: '1964-12-19'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Zhou Enlai cables Nguyễn Hữu Thọ, Chairman of the Central Committee of the National Liberation Front of South Vietnam, warmly congratulating the Front on its 4th anniversary. The Front is the glorious standard-bearer and outstanding leader of the South Vietnamese people's struggle for national liberation. The South Vietnamese people have again and again defeated the U.S. plans of aggression and war and made an extremely important contribution to defending peace in the Indochina peninsula and Southeast Asia, and have set up a glorious example in the anti-imperialist struggle of the world's oppressed peoples. The Chinese government and people have always firmly supported the South Vietnamese people's just patriotic struggle against the U.S.; the 650 million Chinese people are forever the close comrades-in-arms of the South Vietnamese people.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 376 (Dec. 19, 1964). Names: Zhou Enlai, Nguyen. Check: the book gives the Front''s chairman as 阮友寿; the cable is the book''s item.'
        tags: [polity:prc, polity:nlf, polity:us, name:zhou-enlai, name:nguyen-huu-tho]
        src:
          c: 21af25c3
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 376: all'
  - cite:
      id: cal.1964-12-21.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 376–377 (Dec. 22, 1964; Zhou gives the Government Work Report at the first session of the Third National People''s Congress; on foreign policy he says China will go on carrying out its line, struggling with the peoples of the world firmly against U.S. imperialism and its running dogs, for new victories in the struggle for world peace, national liberation, people''s democracy and socialism; on the Sino-Indian boundary, China too strives to get India to settle through peaceful negotiation; Zhou denounces the U.S. for long occupying Taiwan, blocking the restoration of China''s lawful rights in the United Nations and plotting "two Chinas" or "one China, one Taiwan"; the People''s Republic is the only legal government representing the whole Chinese people, no other person or group may represent China or a part of its territory in any name or hold its seat in the United Nations; unless the United Nations drives out the Chiang Kai-shek clique''s representatives and fully restores China''s lawful rights, China will have nothing to do with it)'
      units: A-E
  - add:
      entry:
        id: cal.1964-12-23.china
        when: Dec. 23
        date: '1964-12-23'
        thread: china
        also: [latin-america]
        c: The Chinese government issues a statement strongly protesting the Brazilian authorities' yielding to U.S. will in illegally sentencing the Chinese personnel. The Brazilian authorities have dared to disregard the just warnings and the fair opinion of the world, to go on acting perversely, and to uphold their illegal sentencing of our people. This is a grave political persecution of the Chinese personnel and a further step in the U.S.-planned anti-China plot in Brazil. The Chinese government and people are greatly indignant. China again warns the Brazilian authorities to restore the nine Chinese their freedom at once, or they must bear all the consequences.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 377 (Dec. 23, 1964).'
        tags: [polity:prc, polity:brazil, polity:us]
        src:
          c: bf88aa73
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 377: all'
