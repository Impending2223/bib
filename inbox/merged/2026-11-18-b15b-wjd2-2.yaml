  - cite:
      id: cal.1963-12-05.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 307–308 (Dec. 5, 1963; Zhou gives a television interview to the British writer Greene (格林): China is ready to realize peaceful coexistence with all countries, the U.S. included, on the five principles; self-reliance means developing one''s economy by one''s own people''s labor and wisdom and the resources of the country and trading with other countries on equality and mutual benefit, not autarky or a closed door; no country can make all it needs, but one that does not make what it can make has nothing to exchange; loans must be repaid, and no country can live on borrowing forever)'
