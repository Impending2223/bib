      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 374 (Nov. 25, 1964; Zhou receives the Japanese delegation escorting the remains of the Chinese martyrs, headed by Kuroda Hisao (黑田寿男) and with two deputy heads, all its members)'
      units: A
  - add:
      entry:
        id: cal.1964-11-26.china
        when: Nov. 26
        date: '1964-11-26'
        thread: china
        also: [congo, africa]
        c: The Chinese government issues a statement expressing great indignation and strong protest at the U.S. and Belgian armed invasion of the Congo (Leopoldville). It calls on the African peoples and the world's peoples to act together to stop the grave U.S. and Belgian provocation. It declares that China will, with the peoples of the world, take every possible measure and resolutely support the Congolese people's national liberation struggle.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 374 (Nov. 26, 1964).'
