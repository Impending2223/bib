      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 306 (Nov. 20, 1963; Zhou receives all the members of the Soviet–China Friendship Association delegation headed by Afanasenko (阿法纳先科))'
      units: B
  - cite:
      id: cal.1963-12-25.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 311 (Dec. 25, 1963; Zhou speaks at the congress of cadres of the Algerian National Liberation Front: the armed suppression of oppressed nations by imperialism can be met only by revolutionary arms against counter-revolutionary arms; only so can independence and liberation be won)'
      units: B
  - cite:
