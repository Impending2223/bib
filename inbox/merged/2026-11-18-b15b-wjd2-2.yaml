        when: Jan. 25
        date: '1963-01-25'
        thread: china
        also: [africa]
        c: 'A Chinese delegation led by Liu Ningyi, Vice-Chairman of the China Asian–African Solidarity Committee, goes to the Third Afro-Asian People''s Solidarity Conference at Moshi, Tanganyika (to Feb. 10, the delegation''s days). In the conference, the days not given: Liu Ningyi speaks and makes six proposals on unity against imperialism; the conference adopts a general declaration, a political resolution and 27 resolutions on particular questions, its resolution on China saying that the Chinese people are fully entitled to liberate Taiwan at any time, by any means they choose.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 268 (Jan. 25–Feb. 10, 1963). Check: Liu Ningyi is 刘宁一 in the book; no name entry. The book gives the delegation''s days and none for the conference or its acts.'
