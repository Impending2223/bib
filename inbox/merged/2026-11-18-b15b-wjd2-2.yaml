      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 374 (Nov. 24, 1964; Zhou cables the international conference supporting the Vietnamese people against U.S. imperialist aggression and defending peace, wishing it complete success; the cable says that the Chinese people will not sit by while their brothers and neighbors are invaded, and will not allow U.S. imperialism to do as it pleases in the Indochina peninsula)'
