        thread: china-leadership
        also: [africa-algeria-morocco]
        c: Chen Yi, Member of the Politburo, Vice-Premier and Foreign Minister, begins a visit to Algeria at the head of a Chinese Party and government delegation, for the celebrations of the 10th anniversary of the Algerian revolution (to Nov. 5). In the visit, the days not given, he holds talks with President Ben Bella on the international situation and Sino-Algerian relations, and meets Hadj Ben Alla, president of the National Assembly, Houari Boumédiène, First Deputy Prime Minister and Minister of Defense, Said (赛德), Second Deputy Prime Minister, and Foreign Minister Bouteflika.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 370 (Oct. 30–Nov. 5, 1964). Names: Chen Yi, Ben Bella, Boumédiène, Bouteflika. Check: the book gives the names as 哈吉·本·阿拉, 布迈蒂, 赛德 and 特弗利卡 (Bouteflika, as the calendar has 布特弗利卡); the other Latin forms are back-converted, and the Second Deputy Prime Minister''s is not recovered with certainty; the days of the talks and meetings are not given.'
        tags: [polity:prc, polity:algeria, name:chen-yi, name:ben-bella-ahmed, name:boumediene-houari, name:bouteflika-abdel-aziz]
        src:
