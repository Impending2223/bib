        date: '1962-12-14'
        thread: china
        also: [south-asia]
        c: Zhang Wenjin, Director of the First Asian Department of the Foreign Ministry, twice calls in the Indian embassy's chargé d'affaires and hands him a note. To show its sincerity in seeking a peaceful settlement of the boundary question, China has directed its frontier troops to hand over to India the arms, ammunition and military stores the Indian troops left behind at Walong, Dirang Dzong and other places, and hopes India will send administrative personnel to take them over. A list of the stores is attached.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 260 (Dec. 14–16, 1962). Names: Zhang. Check: the place names are 里米金、梅楚卡、吉牙、德让宗 and 瓦弄 in the book; the Latin forms are back-converted; the chargé is 纳吉 and the days of the two calls are not given.'
