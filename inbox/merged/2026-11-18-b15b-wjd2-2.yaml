        c: 'A Chinese delegation led by Liao Chengzhi attends the session of the World Peace Council at Warsaw, Nov. 28–Dec. 3. In four commissions it puts forward its own draft resolutions on four questions: the prohibition of nuclear weapons and disarmament, national independence, the development of economy and culture, and future peace activities.'
