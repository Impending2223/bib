  - add:
      entry:
        id: cal.1964-06-08.china
        when: June 8
        date: '1964-06-08'
        thread: china
        c: The State Council issues an order promulgating the Regulations on the Management of the Passage of Foreign Non-military Ships through the Qiongzhou Strait. The strait is China's inland sea, no foreign military vessel may pass, and any foreign non-military vessel that needs to pass must apply for approval under the regulations.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 341–342 (June 8, 1964).'
        tags: [polity:prc]
        src:
          c: c3c3c307
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 341–342: all'
  - add:
      entry:
        id: cal.1964-06-09.china-2
        when: June 9
        date: '1964-06-09'
        thread: china
        also: [laos]
        c: 'The Chinese government issues a statement on the Laos situation: all questions of Laos can be settled only through consultations among all sides, in the international sphere by the 14-nation agreement and in the internal sphere by the agreement of the three sides. Any attempt to set aside one country or one party, or to impose one side''s will on another, is bound to fail.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 342 (June 9, 1964).'
        tags: [polity:prc, polity:laos]
        src:
          c: ed02c90e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 342: all'
  - cite:
      id: cal.1964-06-09.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 342 (June 9, 1964; Zhou receives the French ambassador, Lucien Paye, and sets out the historical background of the Taiwan question and the long settled status of Taiwan, and refutes point by point the three U.S. fallacies, "two Chinas", "one China, one Taiwan" and "Taiwan''s status undetermined"; he says Chiang Kai-shek and China have in common that both oppose "two Chinas", both hold that the military conflict between Chiang and the mainland is a continuation of the civil war, and both oppose the "status undetermined" theory, so the U.S. plot cannot succeed)'
      units: A-C
  - cite:
      id: cal.1964-06-11.china-leadership-5
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 342–343 (June 10–19, 1964; Rashidi Kawawa, Second Vice-President of Tanzania, leads a friendly economic delegation of the Tanzanian government visiting China; Mao and Liu Shaoqi receive Kawawa and the delegation, and Zhou holds talks with him)'
      units: B
  - cite:
      id: cal.1964-06-11.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 343 (June 11, 1964; Zhou''s speech at the banquet welcoming Kawawa: the Chinese government has always taken helping Afro-Asian states as its own international duty and stresses that every aid must follow equality and mutual benefit, strictly respect the receiving country''s sovereignty, and firmly oppose attaching privileges and political conditions or using aid to control and interfere; on Indochina, to convene the conference of the Geneva states to discuss Laos is the one effective way to stop the dangerous situation there from developing)'
      units: C-D
  - add:
      entry:
        id: cal.1964-06-12.china
        when: June 12
        date: '1964-06-12'
        thread: china
        also: [congo]
        c: China's first ambassador to Congo (Brazzaville), Zhou Qiuye, presents his credentials to President Massamba-Débat. He reached Brazzaville on June 8.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 343 (June 12, 1964). Check: the ambassador is 周秋野 in the book; no name entry.'
        tags: [polity:prc, polity:congo-brazzaville]
        src:
          c: c2597424
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 343: all'
  - add:
      entry:
        id: cal.1964-06-13.china
        when: June 13
        date: '1964-06-13'
        thread: china
        also: [laos]
        c: The Chinese government issues a statement strongly protesting the bombing of the Chinese economic and cultural mission's quarters in Laos by U.S. aircraft. It calls it a further breach of the Geneva agreement, a widening of the armed interference in Laos, and a plain provocation against the Chinese people. The Lao situation, it says, has gone grave; the two co-chairmen of the Geneva conference have a duty at once to stop the U.S. from widening its war in Laos and to convene the 14-nation conference as soon as possible.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 343–344 (June 13, 1964).'
        tags: [polity:prc, polity:laos, polity:us]
        src:
          c: ca00f637
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 343–344: all'
  - add:
      entry:
        id: cal.1964-06-13.china-leadership-3
        when: June 13
        date: '1964-06-13'
        thread: china-leadership
        also: [laos]
        c: Chen Yi, Foreign Minister, writes to the two co-chairmen of the Geneva conference, demanding that they fulfil their duty, stop the U.S. aggression and provocation, and convene the 14-nation conference as soon as possible.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 344 (June 13, 1964). Names: Chen Yi.'
        tags: [polity:prc, polity:laos, polity:us, name:chen-yi]
        src:
          c: 30251e40
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 344: all'
  - cite:
      id: cal.1964-06-14.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 344 (June 14, 1964; Mao receives Kawawa; Mao: Africa''s problem now is independence and opposing outside interference, military, political, economic and cultural; China must keep the eight principles of its aid (the editors'' note), and its people abroad whose attitude to foreigners is bad must correct it or be called home)'
      units: B
  - add:
      entry:
        id: cal.1964-06-16.china
        when: June 16
        date: '1964-06-16'
        thread: china
        also: [laos]
        c: Dai Lu, head of the Chinese economic and cultural mission in Laos, meets the representatives of the two co-chairmen of the Geneva conference at Khang Khay, and indignantly accuses the U.S. of the barbarous bombing of the Chinese mission's quarters, which wounded five of the mission's staff and killed one.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 344 (June 16, 1964). Check: the head is 戴路 in the book; no name entry.'
        tags: [polity:prc, polity:laos, polity:us]
        src:
          c: 97fafa7b
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 344: all'
  - add:
      entry:
        id: cal.1964-06-19.china-leadership-4
        when: June 19
        date: '1964-06-19'
        thread: china-leadership
        also: [japan]
        c: 'Chen Yi, Vice-Premier and Foreign Minister, answering the head of the Tokyo Broadcasting System''s news bureau, Hashimoto Hiroshi, on four points. On restoring Sino-Japanese diplomatic relations: the key to normalization is that the two governments carry out an independent policy by their own peoples'' interests and remove foreign obstruction by degrees. On Sino-American relations: they can improve not on China but on the U.S.; once the U.S. withdraws its armed forces from Taiwan and the Taiwan Strait they will improve of themselves. On China''s entering the United Nations: China will not trade principle and sovereignty, and any idea of enticing it with its seat in the U.N. into accepting "two Chinas" is bound to fail. On nuclear weapons: while several big powers hold a monopoly and carry out nuclear blackmail, China, for the sake of its own security and world peace, cannot be without its own nuclear self-defense force; but it does not decide its foreign policy by whether it has nuclear weapons.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 344–345 (June 19, 1964). Names: Chen Yi. Check: the interviewer is 桥本博 of Tokyo Broadcasting (东京广播) in the book; the Latin form is back-converted.'
        tags: [polity:prc, polity:japan, polity:us, name:chen-yi]
        src:
          c: ab98e280
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 344–345: all'
  - add:
      entry:
        id: cal.1964-06-19.china
        when: June 19
        date: '1964-06-19'
        thread: china
        also: [africa]
        c: China and Tanzania issue a joint communique on the visit of the Tanzanian government's friendly economic delegation, and sign an agreement on economic and technical cooperation. The two sides hold that the imperialist policy of aggression and war is the root of present international tension, and that so long as the peoples of all countries unite and struggle firmly, world peace can be kept. To shake off poverty and backwardness the African and Asian countries must first rely on their own peoples and resources for construction, and second need mutual aid and economic cooperation among the Asian and African states on equality and mutual benefit.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 343 (June 19, 1964).'
        tags: [polity:prc, polity:tanzania]
        src:
          c: f4340532
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 343: all'
  - cite:
      id: cal.1964-06-21.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 345 (June 19–July 4, 1964; Jean-Marie Koné, Mali''s Minister of State in charge of planning and economic coordination, leads a government delegation visiting China; Mao, Liu Shaoqi and Zhou receive it, and Chen Yi and Li Xiannian hold talks with it)'
      units: A
  - add:
      entry:
        id: cal.1964-06-23.china-leadership-2
        when: June 23
        date: '1964-06-23'
        thread: china-leadership
        also: [latin-america]
        c: 'Mao Zedong, receiving all the members of the delegation of Chilean press workers, says: China wants peace, and we favor whoever speaks of peace. We do not favor war. But we must support the peoples of all countries in their wars against imperialism. This side of our policy is announced publicly and will not be given up.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 345 (June 23, 1964). Made public: 2001. Names: Mao Zedong. Check: the head is 雷纳托·席尔瓦·巴伦瑞托 in the book; the Latin form is not recovered. Whether the talk was reported then.'
        tags: [polity:prc, polity:chile, vis:only:prc+chile, name:mao-zedong]
        src:
          c: 8417255d
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 345: all'
  - cite:
      id: cal.1964-06-24.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 346 (June 24, 1964; the Mali ambassador''s banquet for the Mali government delegation, Zhou attending; Chen Yi speaks: he condemns the U.S. attempt to widen the war in Indochina; the Chinese people will not let the flames of war reach their doorstep; whoever takes China''s call for a Geneva conference as weakness will regret it)'
      units: B
  - add:
      entry:
        id: cal.1964-06-26.china
        when: June 26
        date: '1964-06-26'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at the visit the Indian parliamentary delegation made to China's Taiwan province on June 18, a so-called visit. It is another serious step by the Indian government in following the U.S. plot of "two Chinas" and a public provocation against the Chinese people. The Chinese people will certainly complete the unification of the motherland by recovering Taiwan; China's internal affairs allow no outside interference. China advises the Indian government to respect the norms of international relations and stop at once its making of "two Chinas".
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 346 (June 26, 1964).'
        tags: [polity:prc, polity:india, polity:roc]
        src:
          c: 8527fca2
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 346: all'
  - cite:
      id: cal.1964-06-27.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 346 (June 27, 1964; Zhou receives the Afghan head of the China–Afghanistan joint boundary commission, Prince Sultan Mahmud Ghazi, director of Afghan civil aviation, and all the Afghan guests who came to Peking with him)'
      units: A
  - add:
      entry:
        id: cal.1964-06-27.china-leadership-4
        when: June 27
        date: '1964-06-27'
        thread: china-leadership
        c: 'Dong Biwu, Vice-Chairman of the Republic, receives the Buddhist delegations and representatives of ten countries and regions: Cambodia, Ceylon, Indonesia, Japan, Laos, Mongolia, Nepal, Pakistan, South Vietnam (the Front) and Vietnam.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 346 (June 27, 1964). Names: Dong Biwu. Check: the book lists the ten as printed, 越南南方 being the South Vietnam side.'
        tags: [polity:prc, polity:cambodia, polity:ceylon, polity:indonesia, polity:japan, polity:laos, polity:mongolia, polity:nepal, polity:pakistan, polity:drv, polity:nlf, name:dong-biwu]
