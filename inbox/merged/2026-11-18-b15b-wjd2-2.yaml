        c: China and Afghanistan issue a joint communique on the King's visit. The two sides hold that the successive completion of the treaty formally delimiting the boundary between the two countries and of the work of setting up boundary markers is a vivid sign of mutual friendship, full understanding and good-neighborliness. The two sides agree that the development of the present world situation has played a positive part in defeating imperialist policies and in promoting national independence movements.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 370 (Nov. 2, 1964). Check: the book dates the communique Nov. 2 and calls it the joint communique of the two governments, signed by the two states.'
