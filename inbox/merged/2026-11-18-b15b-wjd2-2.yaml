        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 316 (Jan. 17, 1964). Names: Chen Yi. Check: the book gives the minister as 阿卜杜勒·拉赫曼·穆罕默德·巴布; the Latin form is back-converted.'
        tags: [polity:prc, polity:tanzania, name:chen-yi]
