        thread: china-leadership
        c: Zhu De cables the chairman of Cambodia's Council of the Kingdom, Norodom Montana, and the chairman of the National Assembly, Hoang Hongsa, on behalf of the Standing Committee of the National People's Congress and the Congress. It warmly and firmly supports the just demands in the "Letter to the Parliaments of All Countries" the Cambodian Council of the Kingdom and National Assembly issued on Mar. 10. It says the Chinese government and people fully support the Cambodian people's just struggle to defend their state's sovereignty, independence, neutrality and territorial integrity, and it condemns the U.S. plots of aggression and subversion against Cambodia.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 327 (Mar. 31, 1964). Names: Zhu De. Check: the book gives the Assembly chairman as 黄鸿萨; the Latin form is back-converted.'
