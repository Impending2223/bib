        when: July 12
        date: '1963-07-12'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a serious protest at the 17 sorties of Indian aircraft that violated Chinese airspace in April, May and June this year.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 288 (July 12, 1963).'
