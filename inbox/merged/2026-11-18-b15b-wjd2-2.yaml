        date: '1962-12-09'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry hands the Indian embassy an aide-memoire asking the Indian government to answer three questions plainly. Does India agree to a cease-fire? Does it agree that the two armed forces disengage and each withdraw 20 kilometers from the line of actual control of Nov. 7, 1959? Does it agree that officials of both sides meet to discuss forming demilitarized zones, setting up checkposts and returning prisoners?
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 259 (Dec. 9, 1962).'
        tags: [polity:prc, polity:india]
