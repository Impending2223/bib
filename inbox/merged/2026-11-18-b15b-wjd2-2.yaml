  - cite:
      id: cal.1963-08-26.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 296–297 (Aug. 26, 1963; Zhou receives the Belgian M.P. Scheyven (哈蒙·舍伊文) and says that states of different systems can live in peaceful coexistence on the five principles of respecting one another and living together in peace, not merely feasible but realizable; those who slander China as wanting war and expansion ignore the facts; peaceful coexistence is only between independent states, not between a colony and a colonial power nor a ruled class and a ruling class, nor between unequals; to beg for it invites aggression and insult)'
      units: A-B, D-E
