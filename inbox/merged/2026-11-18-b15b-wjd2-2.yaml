  - cite:
      id: cal.1963-08-29.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 297–298 (Aug. 29, 1963; Mao receives the delegation of the National Liberation Front of South Vietnam under Nguyễn Thị Bình (阮氏苹), which has come to take part in the rally of all circles in the capital supporting the patriotic struggle of the South Vietnamese people and Buddhists against the U.S. and the Ngô Đình Diệm clique)'
      units: B
  - cite:
      id: cal.1963-09-29.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 300–301 (Sept. 26–Oct. 10, 1963; Lukman, Deputy Speaker of Indonesia, leads the delegation of the Mutual Cooperation Parliament, 鲁克曼 in the book, visiting China; Mao, Liu Shaoqi, Zhu De, Zhou and Deng Xiaoping, General Secretary, each receive it, the days not given)'
      units: B
  - add:
