      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 313 (Jan. 11–16, 1964; Zhou visits Ghana at President Nkrumah''s invitation, with Chen Yi accompanying him, and holds talks with Nkrumah)'
      units: A
  - cite:
      id: cal.1964-01-16.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 313–314 (Jan. 16, 1964; the joint communique: a conference of heads of government of all countries to conclude a treaty banning the development and use of all nuclear weapons and destroying existing ones and their stocks would be useful; both sides resolve to go on supporting peaceful efforts to promote direct Sino-Indian talks and hold that Asian and African countries should settle all disputes among themselves on the five principles and the Bandung ten principles; Ghana reaffirms its support for China''s restoring its lawful rights in the United Nations and opposes making "two Chinas"; China reaffirms its support for more seats for African and Asian countries in the organs of the United Nations)'
      units: A-C
  - cite:
      id: cal.1964-01-12.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 314 (Jan. 12, 1964; Mao''s statement to a People''s Daily reporter on the Panamanian people''s anti-U.S. patriotic struggle: it is a great patriotic struggle; the Chinese people firmly stand on Panama''s side and fully support their just action to demand the return of the Canal Zone; he calls on all countries invaded, controlled, interfered with and bullied by the U.S. to unite in the broadest united front against the U.S. policy of aggression and war and to safeguard world peace)'
      units: A, C
  - cite:
