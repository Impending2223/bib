        when: June 29
        date: '1964-06-29'
        thread: china
        c: The Foreign Ministry spokesman, by order, issues the 300th serious warning to the United States, at a U.S. submarine's entry into Chinese territorial waters south of Pinghai, Guangdong.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 346 (June 29, 1964). See [[cal.1964.china]].'
        tags: [polity:prc, polity:us]
        src:
          c: 0ad12898
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 346: all'
  - cite:
      id: cal.1964-06-30.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 347 (June 30, 1964; Zhou receives all the members of the Argentine parliamentary delegation led by Dr. Ferreyra (费雷拉) and his deputy Mechetti Martínez (梅切蒂·马丁内斯); Zhou says on Sino-American relations that the two ambassadors have talked eight years at Warsaw with no result: the first, China asks the U.S. to agree, on the five principles, to a principled agreement on peaceful coexistence, which it always refuses; the second, the U.S. will not withdraw its armed forces from Taiwan and the Taiwan Strait before concrete talks, wanting China to recognize its illegal seizure of Taiwan and the making of Taiwan an independent unit, which would be unjust; and if China agreed, the U.S. could at once recognize and restore its lawful place in the United Nations, which is quite impossible)'
      units: A, E
  - add:
      entry:
        id: cal.1964-06-30.china
        when: June 30
        date: '1964-06-30'
        thread: china
        c: At Ulan Bator the China–Mongolia boundary protocol is signed.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 347 (June 30, 1964).'
        tags: [polity:prc, polity:mongolia]
        src:
          c: f466e6a4
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 347: all'
  - add:
      entry:
        id: cal.1964-07-01.china
        when: July 1
        date: '1964-07-01'
        thread: china
        c: The *Renmin ribao* publishes an editorial, "Resolutely smash the U.S. imperialist war threats and provocations". It says that since Sept. 7, 1958 U.S. military ships have entered Chinese territorial waters and airspace 315 ships in 201 sorties, and aircraft 405 in 233 sorties. Such open and flagrant provocation, year after year, by one country against another has no precedent in international relations. The records show that the U.S. is the greatest threat to peace and security in the Far East and Asia, and that it means to keep up hostility to the Chinese people. The U.S. repeated violation of Chinese waters and airspace is part of its hostile policy toward China.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 347 (July 1, 1964). Check: the book gives the figures as 315 艘、201次 (ships) and 405 架、233次 (aircraft).'
        tags: [polity:prc, polity:us]
        src:
          c: 0e18905e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 347: all'
  - add:
      entry:
        id: cal.1964-07-04.china
        when: July 4
        date: '1964-07-04'
        thread: china
        also: [africa]
        c: Zhou Enlai and Chen Yi each cable Hastings Banda, Prime Minister of Malawi (Nyasaland), congratulating Malawi on its declaring independence (July 6), and inform him that the Chinese government decides to recognize Malawi.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 348 (July 4, 1964). Names: Zhou Enlai, Chen Yi. Check: the book gives the prime minister''s name as 海斯廷·班达; the cables are dated July 4, two days before the independence day.'
        tags: [polity:prc, name:zhou-enlai, name:chen-yi]
        src:
          c: fec8e56f
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 348: all'
  - add:
      entry:
        id: cal.1964-07-06.china-leadership-2
        when: July 6
        date: '1964-07-06'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Chen Yi, Foreign Minister, writes to Xuân Thủy, Foreign Minister of the DRV, on the situation in South Vietnam. The Chinese government and people firmly support the DRV government's just stand that the countries concerned stop U.S. aggression against South Vietnam and its provocation of the North. China and Vietnam are close neighbors, like lips and teeth, and any aggression on the DRV cannot be met with China folding its hands. He restates that U.S. interference and aggression in South Vietnam must stop and U.S. forces and military personnel must withdraw from it altogether, and that the internal affairs of South Vietnam can be settled only by the South Vietnamese people themselves.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 348 (July 6, 1964). Names: Chen Yi, Xuân Thủy.'
        tags: [polity:prc, polity:drv, polity:us, name:chen-yi, name:xuan-thuy]
        src:
          c: 86b8a3f2
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 348: all'
  - add:
      entry:
        id: cal.1964-07-07.china
        when: July 7
        date: '1964-07-07'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at the Indian side's repeated serious intrusions into Chinese territory and airspace in the first half of the year. In the first half there were 23 Indian military intrusions into Chinese territory; Indian troops at the Nathu La pass kept on probing and lurking inside China and moved about at four places; and in the same period 26 Indian aircraft violated Chinese airspace. China demands that India stop the intrusions at once, to keep the Sino-Indian boundary calm.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 348 (July 7, 1964).'
        tags: [polity:prc, polity:india]
        src:
          c: 0ff3a60f
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 348: all'
  - add:
      entry:
        id: cal.1964-07-08.china
        when: July 8
        date: '1964-07-08'
        thread: china
        c: At the Mongolian government's request, and by arrangement of the two sides, the Chinese workers aiding Mongolia, who began returning home in batches on Apr. 24 of this year, send home the last batch, which leaves Ulan Bator today. In the nine years the Chinese workers have given their strength to Mongolia's construction.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 348–349 (July 8, 1964). Check: the book gives no reason beyond Mongolia''s proposal.'
        tags: [polity:prc, polity:mongolia]
        src:
          c: d9c7eab9
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 348–349: all'
  - cite:
      id: cal.1964-07-10.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 349 (July 10–11, 1964; Zhou and Chen Yi visit Burma; Zhou holds talks with Ne Win, chairman of the Revolutionary Council, on matters of common concern and current international questions, above all Southeast Asia)'
      units: A
  - cite:
      id: cal.1964-07-11.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 349 (July 11, 1964; the joint communique: the two leaders are deeply concerned at the worsening situation in Southeast Asia, above all in South Vietnam and Laos, and resolve to seek its peaceful settlement; a conference of the 14 states of the Geneva agreement on Laos should be convened; the obligations of Article 3 of the China–Burma treaty of friendship and mutual nonaggression stressed (the editors'' note: neither to commit aggression against the other or join a military alliance against it))'
      units: A
  - add:
      entry:
        id: cal.1964-07-10.china-leadership-3
        when: July 10
        date: '1964-07-10'
        thread: china-leadership
        also: [japan]
        c: 'Mao Zedong receives Sasaki Kōzō and other Japanese friends of the Japan Socialist Party. He says: the two peoples should unite and oppose the common enemy. In economy we should help each other to raise the people''s living; in culture too. You are more developed in economy, culture and technique, and so you will fear talking of help from us; it is you who help us. As to politics, are we not helping each other politically? Or opposing each other, as we did more than ten years ago? The result of that opposition was good neither for you nor for us. The opposition of twenty years ago taught the Japanese people and taught the Chinese people.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 350 (July 10, 1964). Made public: 2001. Names: Mao Zedong. Check: the book gives the visitor as 佐佐木更三 (Sasaki Kōzō) as a member of the House of Representatives of the Japan Socialist Party; the calendar has Zhou receiving him on July 2, [[cal.1964-07-02.china-leadership-3]]. Whether the talk was reported then.'
        tags: [polity:prc, polity:japan, vis:only:prc+japan, name:mao-zedong]
        src:
          c: 6a09e891
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 350: all'
  - add:
      entry:
        id: cal.1964-07-11.china-2
        when: July 11
        date: '1964-07-11'
        thread: china
        also: [africa]
        c: A Chinese government friendship and trade delegation led by Lu Xuzhang, Vice-Minister of Foreign Trade, begins a tour (to Oct. 5) of Mali and Congo (Brazzaville), with which China has established relations, and of Niger, Nigeria, Dahomey, Cameroon and the Central African Republic, with which it has not.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 350 (July 11–Oct. 5, 1964). Check: Lu Xuzhang is 卢绪章 in the book; no name entry. The days of the visits to the single countries are not given.'
        tags: [polity:prc, polity:mali, polity:congo-brazzaville, polity:niger, polity:nigeria, polity:dahomey, polity:cameroon, polity:central-african-republic]
        src:
          c: ee9825b0
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 350: all'
  - cite:
      id: cal.1964-07-14.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 350 (July 14, 1964; the French ambassador Paye''s national day reception; Chen Yi speaks: he condemns the U.S. armed interference in Laos, its widening of the war against South Vietnam and its obstruction of the 14-nation conference on Laos; force against revolutionary peoples brings the U.S. ever more tragic failure; the conference must meet sooner or later, the sooner the better)'
      units: B
  - add:
      entry:
        id: cal.1964-07-09.china-leadership-3
        when: July 9
        date: '1964-07-09'
        thread: china-leadership
        c: Mao Zedong receives the representatives of Vietnam, Japan, Indonesia, Ceylon, Thailand, Syria, Pakistan, North Kalimantan, Mali, the Sudan, Angola, Kenya, Somalia, Mozambique, Australia and some other countries and regions attending the Second Asian Economic Seminar, and answers the questions they put. He says our relations with one another are fraternal. We must consolidate unity and build a broad united front, whatever the people's color, black, white or yellow, whatever their religion, atheist, Christian, Muslim or Buddhist, and including part of the national bourgeoisie, so long as they are anti-imperialist and oppose imperialism's running dogs; only the running dogs of imperialism in those countries are excluded.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 349 (July 9, 1964). Made public: 2001. Names: Mao Zedong. Check: the book names the countries as printed, among them 北加里曼丹; the tags are those in the list that sources/polities.yaml has. Whether the talk was reported then.'
        tags: [polity:prc, polity:drv, polity:japan, polity:indonesia, polity:ceylon, polity:thailand, polity:syria, polity:pakistan, polity:mali, polity:sudan, polity:kenya, polity:somalia, name:mao-zedong, vis:only:prc+drv+japan+indonesia+ceylon+thailand+syria+pakistan+mali+sudan+kenya+somalia]
        src:
          c: f5309a47
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 349: all'
  - add:
      entry:
        id: cal.1964-07-16.china
        when: July 16
