        c: Liu Shaoqi replies by letter to President Sékou Touré of Guinea, warmly welcoming the positive results of the conference of African heads of state in strengthening African unity and opposing old and new colonialism, and wishing the friendly cooperation of China and Guinea ever greater strength.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 288 (July 10, 1963). Names: Liu Shaoqi, Toure.'
