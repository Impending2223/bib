          c: 18fd54e1
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 374–375: all'
  - cite:
      id: cal.1964-11-28.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 375 (Nov. 28, 1964; Mao''s statement supporting the Congolese (Leopoldville) people against U.S. aggression: the U.S. armed invasion of the Congo is a most serious matter, it is spreading its grip everywhere and with each place it invades it puts a new noose round its own neck; the Congolese people''s just struggle is not isolated, all the Chinese people support them and all the anti-imperialist people of the world support them; let the world''s people unite and defeat the U.S. aggressors and all their running dogs)'
      units: A
