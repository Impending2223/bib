  - cite:
      id: cal.1963-01-17.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 267 (Jan. 16–23, 1963; the Ghana government''s friendship delegation under Kofi Asante Ofori-Atta, Minister of Justice, visits China; Liu Shaoqi and Soong Ching Ling receive it, Zhou and Chen Yi hold talks with it, the days of the receptions not given)'
      units: A
  - add:
      entry:
        id: cal.1963-01.china
        when: Jan., after the 17th
        date: 1963-01
        at: after 1963-01-17
        thread: china
        also: [south-asia, africa]
        c: China and Ghana issue a joint communique on the Ghana government's friendship delegation's visit. China thanks the Ghana government for its efforts for a peaceful settlement of the Sino-Indian boundary question, and Ghana values China's unilateral cease-fire and withdrawal and welcomes China's positive and cooperative attitude toward the six-state Colombo conference. The two sides agree that, in the interest of Afro-Asian unity and world peace, direct talks between China and India should not be put off, and that the Colombo conference's proposals offer a preliminary basis, without prejudice to any reservation either side may discuss and settle by negotiation.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 267 (Jan., after the 17th, 1963). Check: the book dates the communique within the visit of Jan. 16–23 and gives no day.'
        tags: [polity:prc, polity:ghana, polity:india]
        src:
          c: a59b0485
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 267: all'
