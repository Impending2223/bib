          c: '78056001'
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 225: all'
  - add:
      entry:
        id: cal.1962-04-30.china-2
        when: Apr. 30
        date: '1962-04-30'
        thread: china
        also: [south-asia]
        c: 'The Foreign Ministry sends a note to the Indian government, a most strong protest: in the 17 days from Apr. 11 to 27 Indian troops made 18 intrusions into Xinjiang and set up new military posts. It demands that India withdraw the posts and men from Chinese territory. If it refuses and goes on provoking, the border guards will defend themselves, and India will bear all the consequences.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 225 (Apr. 30, 1962).'
        tags: [polity:prc, polity:india]
        src:
          c: 627cd2f0
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 225: all'
