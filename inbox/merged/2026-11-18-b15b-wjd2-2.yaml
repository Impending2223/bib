        when: Dec. 3
        date: '1962-12-03'
        thread: china-leadership
        also: [latin-america]
        c: Mao Zedong, receiving Brazilian guests, says that anywhere a struggle against imperialism and against its running dogs is waged, China supports it, whatever the nation and whether or not they know one another, near or far. Latin America is far from China and its people are not of one nation with the Chinese, but China regards their revolutionary movement as its own.
