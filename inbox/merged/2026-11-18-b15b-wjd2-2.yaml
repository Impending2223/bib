      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 370 (Oct. 30–Nov. 13, 1964; King Mohammed Zahir Shah of Afghanistan and Queen Humaira visit China; Mao receives the King and Queen; Liu Shaoqi and Zhou hold talks with the King)'
