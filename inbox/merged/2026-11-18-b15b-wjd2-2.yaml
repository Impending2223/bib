        when: June 1
        date: '1962-06-01'
        thread: china
        c: Prince Penn Nouth, First Minister of the Royal Government of Cambodia, begins a visit to China (to June 14).
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 230 (June 1–14, 1962). Names: Penn Nouth. Check: the book''s 宾努 is Penn Nouth; it gives the visit''s span and Zhou''s meeting with him at Luda, no other day.'
        tags: [polity:prc, polity:cambodia, name:penn-nouth]
        src:
