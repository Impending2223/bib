      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 256 (Nov. 24, 1962; Zhou replies by letter to Bertrand Russell, the famous British pacifist and philosopher, thanking him for his concern; Russell had written and telegraphed three times, Nov. 8, 16 and 19, urging a halt to the conflict and talks; Zhou tells him of the Chinese cease-fire from 00:00 on Nov. 22 and hopes he will move the Indian government to respond to the three proposals of Oct. 24)'
      units: A-C
