        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at Indian troops' crossing north of the "McMahon Line" and shooting at Tibetan border residents. It demands a thorough investigation, punishment of those responsible, compensation to the victims' families, and effective measures against a repetition.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 232 (June 18, 1962).'
