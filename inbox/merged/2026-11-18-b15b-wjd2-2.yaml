  - add:
      entry:
        id: cal.1964-03-23.china
        when: Mar. 23
        date: '1964-03-23'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, a strong protest at the Indian government's continuing to support Tibetan rebels in India in acts against the motherland and in gross interference in China's internal affairs. Five years ago the Indian government plotted and backed the rebellion of the upper-class reactionary clique in Tibet; now it not only supports the rebel clique's issuing a statement of treason, but publicly charges activity in areas other than India, to provoke China's friendly relations with Southeast Asian countries. China again warns India that it will in no way permit interference in its internal affairs, and that India's delusion of Chinese expansion in Tibet is, like the dream of the Tibetan exile serf-owners of a restoration, bound to be shattered.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 326 (Mar. 23, 1964).'
        tags: [polity:prc, polity:india]
        src:
