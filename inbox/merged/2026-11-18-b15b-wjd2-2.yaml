        date: '1963-06-02'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, flatly rejecting the Indian government's baseless protest in its note of May 11 about three Chinese soldiers' entering the Pangong Lake area. The Pangong Lake area has always been Chinese territory, so the Indian government has no right to object to Chinese activity there.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 285 (June 2, 1963).'
