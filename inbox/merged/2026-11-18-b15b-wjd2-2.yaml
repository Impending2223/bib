        when: Nov. 21
        date: '1964-11-21'
        thread: china
        also: [japan]
        c: The Foreign Ministry spokesman issues a statement on the Satō government's refusal to let a Chinese Communist Party delegation led by Peng Zhen enter Japan for the ninth Japanese Communist Party congress. The Chinese people feel deep resentment at the Japanese government's unreasonable measure. Sino-Japanese friendship, he says, is the common wish of the two peoples; the Chinese side's sending a delegation led by Peng Zhen at the invitation is a major step in strengthening it, welcomed by the Chinese and Japanese peoples. The Satō government's present unreasonable measure obviously goes against the wishes of the broad Japanese people and is bound to harm the development of Sino-Japanese relations.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 373 (Nov. 21, 1964). Names: Peng Zhen, Satō. Check: the book gives the prime minister as 佐藤 (Satō).'
