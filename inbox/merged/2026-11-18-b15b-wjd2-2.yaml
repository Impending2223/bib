        c: The Defense Ministry spokesman issues a statement on the Chinese frontier troops' continuing their unilateral withdrawal from the eastern and western sectors of the boundary. They continue to withdraw on Dec. 30. By the end of December, in the east, except the Tawang area, both groups have withdrawn north of the line of actual control of Nov. 7, 1959 and to areas near it; in the west most have withdrawn to 20 kilometers from the line. This, he says, shows China's positive effort to consolidate the cease-fire, ease border tension and settle the Sino-Indian boundary question peacefully.
