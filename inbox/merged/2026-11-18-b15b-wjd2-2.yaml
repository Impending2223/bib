      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 267–268 (Jan. 18–24, 1963; Tulsi Giri, Vice-Chairman of Nepal''s Council of Ministers and Foreign Minister, visits China, signing the China–Nepal boundary protocol; Liu Shaoqi, Soong Ching Ling and Zhou each receive him, the days not given; the protocol is signed at Peking on Jan. 20; the book does not say Liu attended the signing)'
