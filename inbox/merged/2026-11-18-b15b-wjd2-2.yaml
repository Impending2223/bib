        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 285 (June 1, 1963). Names: Zhou Enlai, Kenyatta.'
        tags: [polity:prc, polity:kenya, name:zhou-enlai, name:kenyatta-jomo]
