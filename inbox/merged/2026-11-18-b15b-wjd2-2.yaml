        thread: china
        also: [south-asia]
        c: The Foreign Ministry sends a note to the Indian embassy, sternly rejecting the Indian Ministry of External Affairs' rumor, got up on June 26 and July 2, that Chinese aircraft flew over Indian airspace. It flatly refuses the Indian ministry's groundless charges and unreasonable protest. The book gives the notes of July 8 and 9 together.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 288 (July 8, 1963). Check: the book gives the notes of July 8 and 9 as one item with one text.'
