  - cite:
      id: cal.1964-05-30.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 340 (May 30, 1964; the Chinese government''s statement criticizing the Soviet government''s statement on the second Asian–African conference preparatory meeting: as a unified whole the Soviet Union''s political center has always been in Europe and it is traditionally taken as a European country; however large its Asian part, it cannot make the Soviet Union an Asian country; the Asian states did not invite the Soviet Union to the first Asian–African conference, which the five Colombo powers settled ten years ago; as a European state the Soviet Union was not invited to the group of Asian–African countries at the United Nations and did not ask to join; the Asian–African conference is the first summit of the Asian and African states; the principle is not shaken by China''s relations with the Soviet Union)'
      units: A
  - cite:
