        c: Chen Yi, Vice-Premier and Foreign Minister, leads the Chinese government delegation to the preparatory meeting for the second Asian–African conference, which opens at Jakarta (to Apr. 15).
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 329 (Apr. 10–15, 1964). Names: Chen Yi.'
