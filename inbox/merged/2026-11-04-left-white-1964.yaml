- add:
    entry:
      id: cal.1963-12.elections-1964-8
      when: Dec.
      date: 1963-12
      thread: elections-1964
      c: 'Rockefeller with Theodore White, by White''s account: his chances slim; no one would vote for him unless a national
        crisis forced it; Mrs. Rockefeller against his running; at Lehman''s funeral people turned to shake his hand. The
        politicians do not want him: the primaries, New Hampshire, Oregon, California, the only way.'
      n: '[[w.white-making-of-the-president-1965]], 82–83. Check: the day (White: about ten days after the assassination;
        Lehman''s funeral, two weeks after Kennedy''s, had passed). See [[cal.1963-11-07.elections-1964]]; [[cal.1963-12-05.democratic-party]].
        Names: Rockefeller, White.'
      tags:
      - name:rockefeller-nelson
      - name:white-theodore-h
- add:
    entry:
      id: cal.1965-01-15.desegregation-schools
      when: Jan. 15
      date: '1965-01-15'
      thread: desegregation-schools
      c: New York. The Board of Education reports white children a minority in the city's elementary schools, 49.2 percent.
      n: '[[w.white-making-of-the-president-1965]], 239–40 n.7. To check: the Board''s report.'
      tags:
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1964-08-20.goldwater
      when: Aug. 20
      date: '1964-08-20'
      thread: goldwater
      c: 'The Interpublic Group''s task force, retained by the Republicans for television, begins work, through Guylay of
        the strategy board: the last three campaigns analyzed by computer, the swing States charted, the two hundred major
        television markets.'
      n: '[[w.white-making-of-the-president-1965]], 322. Names: Goldwater.'
      tags:
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-09.elections-1964-7
      when: Sept.
      date: 1964-09
      thread: elections-1964
      c: 'Doland, S.D., Humphrey''s boyhood town, at the beginning of his campaign, on the plane *Happy Warrior*, a champagne
        breakfast paid by the national committee. The schoolhouse; on Main Street, from a little platform: opportunity and
        government; education "the secret of power"; "The only aristocracy that we have in America is the aristocracy of achievement
        and merit."'
      n: '[[w.white-making-of-the-president-1965]], 308–10. Check: the day. See [[cal.1964-09-05.elections-1964-2]]. Names:
        Humphrey.'
      tags:
      - name:humphrey-hubert-h
      - state:sd
- add:
    entry:
      id: cal.1964-09.elections-1964-8
      when: Sept.
      date: 1964-09
      thread: elections-1964
      c: 'Humphrey, the morning after Doland: a stop at Rapid City, S.D., by Ellsworth Air Force Base; over Mount Rushmore;
        to Denver, where he answers the newsmen on beef imports, the drought, the bomb, the income tax, rioting in the streets,
        the John Birch Society and Vietnam.'
      n: '[[w.white-making-of-the-president-1965]], 310–13. Check: the day. See [[cal.1964-09.elections-1964-7]]. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
      - state:sd
      - state:co
- add:
    entry:
      id: cal.1964-09.goldwater-3
      when: Sept., end
      date: 1964-09
      thread: goldwater
      c: 'Hammond, Ind., from the whistle-stop train: six thousand, many of them East European mill workers, signs against
        Tito. Goldwater for the liberation of Eastern Europe: "We are at war in Vietnam. We are at war regardless of what
        the administration says"; if the Communists "ever should push the button, we would destroy them." Mohr of the *Times*
        counts nearly thirty such phrases. Three Negro Republicans on the platform; the band closes with "Bye, Bye Blackbird."'
      n: '[[w.white-making-of-the-president-1965]], 325 and n.4. Check: the day (White, 324: four days at the end of September
        through Ohio, Indiana and Illinois; Goldberg, in [[cal.1964-09-28.goldwater]], five). See [[cal.1964-09-28.goldwater]].
        Names: Goldwater.'
      tags:
      - name:goldwater-barry-m
      - state:in
- add:
    entry:
      id: cal.1964-09.goldwater-4
      when: Sept., end
      date: 1964-09
      thread: goldwater
      c: 'Effingham, Ill., the railway station, from the train. Introduced as the one candidate "who would not take us down
        the road to socialism." Goldwater: "What good is prosperity if you are a slave? ... this country will stay free ...
        We will place power back to the people."'
      n: '[[w.white-making-of-the-president-1965]], 326–27. Check: the day (White, 324: four days at the end of September
        through Ohio, Indiana and Illinois; Goldberg, in [[cal.1964-09-28.goldwater]], five). See [[cal.1964-09-28.goldwater]].
        Names: Goldwater.'
      tags:
      - name:goldwater-barry-m
      - state:il
- add:
    entry:
      id: cal.1964-09.goldwater-5
      when: Sept., end
      date: 1964-09
      thread: goldwater
      c: 'La Salle, Ill., from the train. Goldwater: "What would you do if I told you you had to line up at six in the morning
        tomorrow and get a number? ... Freedom is lost through inattention."'
      n: '[[w.white-making-of-the-president-1965]], 327. Check: the day (White, 324: four days at the end of September through
        Ohio, Indiana and Illinois; Goldberg, in [[cal.1964-09-28.goldwater]], five). See [[cal.1964-09-28.goldwater]]. Names:
        Goldwater.'
      tags:
      - name:goldwater-barry-m
      - state:il
- add:
    entry:
      id: cal.1964-09.goldwater-6
      when: Sept., end
      date: 1964-09
      thread: goldwater
      also:
      - governors
      c: 'Illinois, the second day, late afternoon: Percy, the Republicans'' candidate for governor, joins Goldwater for three
        whistle stops. Percy on the at-large ballot''s sample, 118 bogus Democrats named Daley, against Daley''s rule of the
        State party.'
      n: '[[w.white-making-of-the-president-1965]], 327–28. Check: the day (White, 324: four days at the end of September
        through Ohio, Indiana and Illinois; Goldberg, in [[cal.1964-09-28.goldwater]], five). See [[cal.1964-09-28.goldwater]].
        Names: Percy, Goldwater, Daley.'
      tags:
      - name:percy-charles-h
      - name:goldwater-barry-m
      - name:daley-richard-j
      - state:il
- cite:
    id: cal.1964-09-28.elections-1964
    item: '[[w.white-making-of-the-president-1965]], 347, 362–67 (Providence: "we''re in favor of a lot of things and we''re
      against mighty few"; the Warren report read at the Ranch, Sept. 26–27; Providence at 9:30 a.m., some 3,000 at the airport;
      thirteen stops, Brown''s convocation; Hartford, two hours late, the business leaders and Rayburn''s story; on to Burlington,
      Portland, Manchester and Boston, the day ending at 2 a.m.)'
