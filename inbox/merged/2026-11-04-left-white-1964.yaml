- add:
    entry:
      id: cal.1963-05.elections-1964-5
      when: May
      date: 1963-05
      thread: elections-1964
      c: Chicago. The Young Adults for Rockefeller disband in anger at his remarriage.
      n: '[[w.white-making-of-the-president-1965]], 80. Check: the day. See [[cal.1963-05-04.elections-1964]]. Names: Rockefeller.'
      tags:
