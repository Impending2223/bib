- add:
    entry:
      id: cal.1964-08.republican-party
      when: Aug.
      date: 1964-08
      thread: republican-party
      c: 'Harrisburg, the Scranton headquarters, some weeks after the convention. Reichley''s internal memorandum: the convention
        ended not only the Eisenhower era but "the reign of pragmatism" in the Republican Party; Taft "the most representative
        American Puritan since Cotton Mather."'
      n: '[[w.white-making-of-the-president-1965]], 217–18 (White quotes and draws on it, 217 n.4). Check: the day. See [[cal.1964-07-15.elections-1964]].
        Names: Scranton.'
      tags:
      - name:scranton-william-w
- src:
    id: cal.1964-08.republican-party
