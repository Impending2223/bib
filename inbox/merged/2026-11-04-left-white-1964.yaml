- add:
    entry:
      id: cal.1964-10-14.elections-1964-5
      when: Oct. 14
      date: '1964-10-14'
      thread: elections-1964
      c: New York, the Waldorf-Astoria. Johnson, told the full story of Jenkins by Clifford, calls on Jacqueline Kennedy,
        then speaks briefly at the Alfred E. Smith Memorial Foundation's dinner, Cardinal Spellman's, as the story moves on
        the wires.
      n: 'Remarks in New York City at the Annual Dinner of the Alfred E. Smith Memorial Foundation, [1963–64 Pub. Papers 1329](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=569)
        (Oct. 14, 1964). [[w.white-making-of-the-president-1965]], 369. See [[cal.1964-10-14.elections-1964]]. Names: Johnson,
        Clifford, Jacqueline Kennedy, Spellman.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:kennedy-jacqueline
      - name:spellman-francis
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1964-10-22.goldwater
      when: Oct. 22
      date: '1964-10-22'
      thread: goldwater
      c: 'Goldwater flies from New York, after Hoover''s funeral, to Los Angeles, the Boeing 727''s first nonstop crossing
        without refueling. Over Phoenix he speaks by the plane''s radio to a $100-a-plate dinner below: "I can see the lights
        of Phoenix very clearly ... down to the left. I hate to say ''left,'' but that''s where it is."'
      n: '[[w.white-making-of-the-president-1965]], 335–36. Check: the day (White gives none; the southern California tour
        eleven days before the election). Names: Goldwater.'
      tags:
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-10-23.goldwater
      when: Oct. 23
      date: '1964-10-23'
      thread: goldwater
      c: 'Goldwater''s one-day whistle-stop through southern California: Los Angeles, the railway station, no more than seven
        hundred, the regular Republicans gone to Murphy''s campaign; Pico Rivera, on Baker and Jenkins; Fullerton: "A government
        that is big enough to give everything that you need and want is also big enough to take it all away"; Santa Ana; San
        Clemente, Oceanside, La Jolla; San Diego, a speech first given in Philadelphia.'
      n: '[[w.white-making-of-the-president-1965]], 336–37, 339 (a cry of "Kill Johnson!" in California). Check: the day (White
        gives none; the southern California tour eleven days before the election). Names: Goldwater, Murphy.'
      tags:
      - name:goldwater-barry-m
      - name:murphy-george
      - state:ca
- add:
    entry:
      id: cal.1964-10-24.goldwater
      when: Oct. 24
      date: '1964-10-24'
      thread: goldwater
      c: 'Goldwater in Texas, against Humphrey, the "semi-socialist" a heartbeat from the Presidency: Austin, the galleries
        chanting "Fairies, fairies," and his rebuke to those booing Johnson, "he is your President"; Corpus Christi, the ADA;
        Wichita Falls: "Let my people go!" On the plane, the sombrero drawn for the press.'
      n: '[[w.white-making-of-the-president-1965]], 337–40. Check: the day (White: the day after California). Names: Goldwater,
        Humphrey, Johnson.'
      tags:
      - name:goldwater-barry-m
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1964-10-28.elections-1964-2
      when: Oct. 28
      date: '1964-10-28'
      thread: elections-1964
      c: 'Johnson to correspondents on the plane into Los Angeles, his polls beside the *Congressional Quarterly*''s, *Newsweek*''s
        and *Time*''s: "We just got no business carrying New Hampshire"; Texas 53 or 54 percent; Goldwater to have Arizona,
        Mississippi, Alabama, South Carolina, Louisiana, Georgia and Florida. After the election, some Navy Yards to close;
        the Great Society''s task forces. Goodwin wrote the Boston speech, Wirtz the Pittsburgh. "We''re gonna do something
        about this morality."'
      n: '[[w.white-making-of-the-president-1965]], 375–76. See [[cal.1964-10-28.elections-1964]]. Names: Johnson, Goodwin,
        Wirtz, Goldwater.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:wirtz-w-willard
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-10-29.elections-1964-3
      when: Oct. 29
      date: '1964-10-29'
      thread: elections-1964
      c: Salt Lake City, the Mormon Tabernacle, 9:03 a.m. Johnson's address; Moss, who introduces him, and Rampton, the Democrats'
        candidate for governor, on the platform.
      n: 'Remarks in Salt Lake City at the Mormon Tabernacle, [1963–64 Pub. Papers 1513](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=753)
        (Oct. 29, 1964). [[w.white-making-of-the-president-1965]], 360, 376 (the address). Names: Johnson, Moss, Rampton.'
      tags:
      - name:johnson-lyndon-b
      - name:moss-frank-e
      - name:rampton-calvin-l
      - state:ut
- add:
    entry:
      id: cal.1964-11-02.goldwater-3
      when: Nov. 2
      date: '1964-11-02'
      thread: goldwater
      c: 'Phoenix, Election Eve, the Camelback Inn: Goldwater''s farewell drink with the press corps. Of Kennedy: "He would
        have debated me. It would have been good for the campaign."'
      n: '[[w.white-making-of-the-president-1965]], 343. See [[cal.1964-11-02.goldwater]]. Names: Goldwater, Kennedy.'
      tags:
      - name:goldwater-barry-m
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1964-03.goldwater-8
      when: Mar., after New Hampshire
      date: 1964-03
      thread: goldwater
      c: After his defeat in New Hampshire Goldwater talks with his aides of withdrawing entirely; Kleindienst and F. Clifton
        White dissuade him.
      n: '[[w.white-making-of-the-president-1965]], 343. Check: the day. See [[cal.1964-03-10.elections-1964]]. Names: Goldwater,
        Kleindienst, F. Clifton White.'
      tags:
      - name:goldwater-barry-m
      - name:kleindienst-richard-g
