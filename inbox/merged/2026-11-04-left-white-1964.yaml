- add:
    entry:
      id: cal.1964-04-23.program
      when: Apr. 23
      date: '1964-04-23'
      thread: program
      also:
      - democratic-party
      c: 'Chicago, McCormick Place, the Democratic Club of Cook County''s dinner. Johnson: "we have been called upon—are you
        listening?—to build a great society of the highest order." The phrase''s first public use; the speech Moyers''s.'
      n: 'Remarks in Chicago at a Fundraising Dinner of the Democratic Club of Cook County, [1963–64 Pub. Papers 527](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=611)
        (Apr. 23, 1964). [[w.white-making-of-the-president-1965]], 390 (the first use in public; the speech Moyers''s). See
        [[cal.1964-03-02.program]]. Names: Johnson, Moyers, Daley.'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:daley-richard-j
      - city:chicago
      - state:il
- add:
    entry:
      id: cal.1964-07.press-and-broadcasting
      when: July
      date: 1964-07
      thread: press-and-broadcasting
      also:
      - elections-1964
      c: 'The three networks, after racing each other to the call in California''s primary, some 50,000 poll watchers at a
        combined $1 million, agree to pool their counting; the AP and UPI join: the Network Election Service, under Eames
        of CBS, Jordan of NBC and Snyder of ABC, its tabulating center at the Hotel Edison, New York.'
      n: '[[w.white-making-of-the-president-1965]], 378 n.1. Check: the day (White: five weeks after the primary of June 2).'
      tags: []
- add:
    entry:
      id: cal.1964-09-16.conservation
      when: Sept. 16
      date: '1964-09-16'
      thread: conservation
      also:
      - elections-1964
      c: Johnson and Pearson proclaim the Columbia River Treaty, at the border; Pearson welcomed at Malmstrom Air Force Base,
        Mont., Johnson at Vancouver, B.C.
      n: 'Remarks of Welcome at Malmstrom Air Force Base to Prime Minister Pearson of Canada, [1963–64 Pub. Papers 1072](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=312);
        The President''s Response to Remarks of Welcome by Prime Minister Pearson at Vancouver International Airport, [1963–64
        Pub. Papers 1074](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=314); Remarks With
        Prime Minister Pearson Upon Proclaiming the Columbia River Treaty, [1963–64 Pub. Papers 1075](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=315)
        (Sept. 16, 1964). [[w.white-making-of-the-president-1965]], 355 (the President at the Columbia River Basin, crossing
        into Canada to greet its Prime Minister). Check: the treaty''s U.S.T. and U.N.T.S. cites. Names: Johnson, Pearson.'
      tags:
      - name:johnson-lyndon-b
      - name:pearson-lester-b
      - state:mt
- add:
    entry:
      id: cal.1964-09-25.elections-1964-3
      when: Sept. 25
      date: '1964-09-25'
      thread: elections-1964
      c: 'Oklahoma City, the opening of the State Fair, after Eufaula. Johnson rides a roan to the stand: "I came here today
        to talk to happy people. I came here to talk about what is right." The capitalist, his "reasonable return"; the manager;
        the worker.'
      n: 'Remarks in Oklahoma City at the Opening of the State Fair, [1963–64 Pub. Papers 1128](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=368)
        (Sept. 25, 1964). [[w.white-making-of-the-president-1965]], 359–60 (the roan; the routine of capitalist, manager and
        worker). See [[cal.1964-09-25.elections-1964]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:ok
- add:
    entry:
      id: cal.1964-09-29.defense
      when: Sept. 29
      date: '1964-09-29'
      thread: defense
      also:
      - elections-1964
      - europe-and-the-alliance
      c: Omaha, Offutt Air Force Base. Johnson inspects SAC's headquarters with Brosio, NATO's Secretary General, his guest
        at the White House the day before.
      n: 'Toasts of the President and the Secretary General of the North Atlantic Treaty Organization, [1963–64 Pub. Papers
        1169](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=409); Remarks Upon Arrival at
        Offutt Air Force Base in Omaha, [1963–64 Pub. Papers 1171](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=411);
        Remarks Upon Completing an Inspection of SAC Headquarters, Offutt Air Force Base, Omaha, [1963–64 Pub. Papers 1172](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=412)
        (Sept. 29, 1964). [[w.white-making-of-the-president-1965]], 355–56 (the bombers and the missiles shown to Brosio).
        Check: the toasts'' day. Names: Johnson, Brosio.'
      tags:
      - name:johnson-lyndon-b
      - name:brosio-manlio-g
      - state:ne
- add:
    entry:
      id: cal.1964-10.goldwater-3
      when: Oct., mid-month
      date: 1964-10
      thread: goldwater
      c: 'Burch cancels the Opinion Research Corporation''s polls for the Goldwater headquarters. A last question, whether
        the respondent knew anyone secretly for Goldwater: 45 percent thought there might be some in the neighborhood.'
      n: '[[w.white-making-of-the-president-1965]], 333 n.10. Check: the day. Names: Burch, Goldwater.'
      tags:
      - name:burch-dean
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-10.goldwater-4
      when: Oct., mid-month
      date: 1964-10
      thread: goldwater
      c: 'Citizens for Goldwater-Miller, at F. Clifton White''s direction, take a last hard look at the campaign: Goldwater
        to carry five States.'
      n: '[[w.white-making-of-the-president-1965]], 333 n.10. Check: the day. Names: F. Clifton White, Goldwater.'
      tags:
      - name:white-f-clifton
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-10-14.elections-1964-4
      when: Oct. 14
      date: '1964-10-14'
      thread: elections-1964
      c: 'Mrs. Johnson, from the White House, on Jenkins: "My heart is aching today for someone who has reached the end point
        of exhaustion in dedicated service to his country."'
      n: '[[w.white-making-of-the-president-1965]], 368–69. See [[cal.1964-10-14.elections-1964]]. Names: Lady Bird Johnson,
        Jenkins.'
      tags:
      - name:johnson-lady-bird
      - name:jenkins-walter-w
