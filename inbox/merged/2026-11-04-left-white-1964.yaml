- add:
    entry:
      id: cal.1960-07-10.elections-1960-6
      when: July 10
      date: '1960-07-10'
      thread: elections-1960
      c: 'Beverly Hills, Stevenson''s cottage, Sunday. Philip Graham and his wife with Stevenson, by Graham''s account: Johnson
        had canceled at midnight the breakfast Rowe arranged; Stevenson cannot nominate Kennedy unless Johnson and Symington
        concur, having told all three he would help none.'
      n: '[[w.white-making-of-the-president-1965]], 408 (Graham''s memorandum of July 19 and 24, 1960, app. B). See [[cal.1960-07-11.elections-1960-2]].
        Names: Stevenson, Johnson, Kennedy, Rowe, Symington.'
      tags:
      - name:stevenson-adlai-e
      - name:johnson-lyndon-b
      - name:kennedy-john-f
      - name:rowe-james-h-jr
      - name:symington-william-s
- add:
    entry:
      id: cal.1960-07-12.press-and-broadcasting
      when: July 12
      date: '1960-07-12'
      thread: press-and-broadcasting
      also:
      - elections-1960
      c: 'The *Washington Post*, Tuesday: "the word in Los Angeles is that Kennedy will offer the VPship to Lyndon Johnson."
        Graham, its publisher, would let Friendly and Roberts write no more strongly.'
      n: '[[w.white-making-of-the-president-1965]], 409 (Graham''s account). To check: the *Washington Post*, July 12, 1960.
        See [[cal.1960-07-11.elections-1960-2]]. Names: Roberts, Kennedy, Johnson.'
      tags:
      - name:roberts-chalmers-m
      - name:kennedy-john-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-07-12.elections-1960-10
      when: July 12
      date: '1960-07-12'
      thread: elections-1960
      c: 'Joseph Alsop''s party, Tuesday evening, about 9:30 or 10. Stephen Smith reaches Graham: the man to nominate Kennedy
        to be chosen that night. Graham: let Kennedy put it to Stevenson, Johnson leaving him free to decide. Smith: they
        are urging Stevenson, with little luck.'
      n: '[[w.white-making-of-the-president-1965]], 410 (Graham''s account). See [[cal.1960-07-11.elections-1960-2]]. Names:
        Stephen Smith, Alsop, Kennedy, Stevenson, Johnson.'
      tags:
      - name:smith-stephen-e
      - name:alsop-joseph
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-07-13.elections-1960-8
      when: July 13
      date: '1960-07-13'
      thread: elections-1960
      c: 'Los Angeles, 10:40 a.m. Graham with Kennedy, alone in a convention car to a farm caucus at the Statler-Hilton, by
        Graham''s account: his plan, a message from Kennedy for Stevenson to read Thursday asking the delegates to draft Johnson;
        "Leave it with me only." Kennedy might be twenty votes short; could the offer win any of Johnson''s? Graham: his nomination
        assured "by res ipsa loquitur."'
      n: '[[w.white-making-of-the-president-1965]], 410–11 (Graham''s account). See [[cal.1960-07-11.elections-1960-2]]. Names:
        Kennedy, Stevenson, Johnson, Smathers.'
      tags:
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      - name:johnson-lyndon-b
      - name:smathers-george-a
