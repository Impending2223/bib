        move not only toward the rich society and the powerful society, but toward the great society." Never delivered; Goodwin
        joins the White House staff soon after.'
      n: '[[w.white-making-of-the-president-1965]], 389–90. See [[cal.1964-01-08.program]]. Names: Goodwin, Johnson.'
