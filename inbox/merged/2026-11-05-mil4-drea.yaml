      when: July 9
      date: '1965-07-09'
      thread: vietnam-july-decision
      c: 'McNamara with OSD''s top officials: schedules, requirements, tasks toward the buildup decisions on his return; Vance
        over the working groups; no net cut in NATO; a congressional resolution, as for Berlin in 1961, over a declared emergency;
        173,000 men by Nov. 1, the Army Reserve and the 4th Marine Division called, a supplemental.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 38. See [[cal.1965-07-07.vietnam-july-decision]]. Names: McNamara, Vance.'
