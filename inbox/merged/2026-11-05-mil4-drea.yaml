- add:
    entry:
      id: cal.1965-07-13.vietnam-july-decision
      when: July 13
      date: '1965-07-13'
      thread: vietnam-july-decision
      c: 'McNaughton''s draft, "Analyses and Options for South Vietnam," for McNamara''s trip book: 180,000 Americans and
        more than 20,000 allied ground troops in a conventional war; the reserves mobilized; an electrified fence across the
        trail in Laos; the bombing about as now. Likely a stalemate and compromise.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 39. Names: McNaughton, McNamara.'
      src:
        c: 295e1c53
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 39: all'
      tags:
      - name:mcnaughton-john-t
      - name:mcnamara-robert-s
    section: '196507'
- add:
    entry:
      id: cal.1965-07-14.vietnam-july-decision-3
      when: July 14
      date: '1965-07-14'
      thread: vietnam-july-decision
      c: 'The Goodpaster study group''s report to McNamara, the day he leaves for Saigon: large enemy units fought away from
        the cities, more air attacks on the North; no reason the United States cannot win, at least 75 percent of the organized
        Communist battalions destroyed, given the will. McNamara takes no "explicit action" on it.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 39–40. Names: Goodpaster, McNamara.'
      src:
        c: 6c145b11
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 39–40: all'
      tags:
      - name:goodpaster-andrew-j
      - name:mcnamara-robert-s
    section: '196507'
- add:
    entry:
      id: cal.1965-07-15.vietnam-july-decision
      when: July 15
      date: '1965-07-15'
      thread: vietnam-july-decision
      c: 'Vance''s first meeting with the service secretaries and OSD''s assistant secretaries, a July 19 deadline: a presidential
        statement drafted; warning orders already out to the airmobile division and its support, about 28,000; Plan I''s guidance
        for mobilization and expansion. July 16, Vance to McNamara in Saigon, "literally eyes only": three meetings with "Highest
        Authority," whose "current intention" is the 34 battalions and a call-up law, but no large supplemental.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 40. See [[cal.1965-07-12.vietnam-july-decision]]. Names: Vance, McNamara.'
      src:
        c: 148a4926
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 40: all'
      tags:
      - name:vance-cyrus
      - name:mcnamara-robert-s
    section: '196507'
