      id: cal.1965-07-20.vietnam-july-decision-3
      when: July 20
      date: '1965-07-20'
      thread: vietnam-july-decision
      c: 'The CIA, in an assessment State asked at Vance''s insistence: larger American ground forces and more air attacks
        will not move Hanoi from its course in the South.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 41.'
      src:
