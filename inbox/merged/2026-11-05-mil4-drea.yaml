      when: Mar. 6
      date: '1965-03-06'
      thread: vietnam-force-levels
      c: 'Late morning, Wheeler with McNamara: MACV''s pessimistic assessment of the day before; more Marines to Đà Nẵng at
        once.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 24. See [[cal.1965-03-06.vietnam-force-levels]]. Names: Wheeler, McNamara.'
