      when: July 12
      date: '1965-07-12'
      thread: vietnam-july-decision
      c: 'McNamara with the service secretaries and his staff: a joint resolution for a 24-month call-up of the reserves,
        release after 12 if possible; a plan from 34 to 63 combat battalions. Vance to meet the principals daily from July
        13, in strict secrecy, and to see Stennis on deferring a supplemental.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 39. See [[cal.1965-07-09.vietnam-july-decision]]. Names: McNamara, Vance,
        Stennis.'
