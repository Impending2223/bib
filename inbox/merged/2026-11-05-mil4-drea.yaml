- cite:
    id: cal.1965-03-06.vietnam-force-levels
    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 24 (the afternoon order, 3,500 Marines; the announcement held to the
      next afternoon, a Sunday; Johnson''s "60-40 against" a big land war)'
    units: A, E
- add:
    entry:
      id: cal.1965-03-09.vietnam-2
      when: Mar. 9
      date: '1965-03-09'
      thread: vietnam
      c: 'McNaughton, back from Saigon ahead of General Johnson''s team, at the Tuesday lunch: pressure the North; sustain
        the South, "lots of U.S. and if poss[ible] Allied troops"; or "get out with limited humiliation." Johnson: "I''d much
        prefer to stay in SVN—but after 15 mo[nths] we all agree we have to do more."'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 25. To check: Bundy, meeting notes, Mar. 9, 1965, box 3, McGeorge Bundy
        Papers, LBJ Library (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 25 n.10). Names: McNaughton, Johnson.'
      src:
        c: 1ffb0249
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 25: all'
        - 'via x.1965-03-09.bundy-meeting-notes-mar-9-1965: all'
      tags:
      - name:mcnaughton-john-t
      - name:johnson-lyndon-b
    section: '196503'
- cite:
    id: cal.1965-03-10.vietnam-3
    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 25 (the talks at Camp David with McNamara and Rusk among others)'
    units: A
- cite:
    id: cal.1965-03-11.vietnam
    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 25 (the testimony: Burma and Laos to go Communist, Thailand threatened,
      Indonesia''s party to take over)'
    units: A
- cite:
    id: cal.1965-03-15.vietnam-force-levels
    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 25–26 (General Johnson back Mar. 14, his 21 steps and two more; four
      or five divisions against infiltration; Mar. 15, Johnson reviews it with the Chiefs, McNamara and Vance, approves the
      21 measures in principle, the divisions put off)'
    units: A
- cite:
    id: cal.1965-03-16.vietnam
    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 26 (the Tuesday lunch; Johnson asks his advisers for more ideas)'
    units: A, C
- add:
    entry:
      id: cal.1965-03-16.vietnam-force-levels
      when: Mar. 16
      date: '1965-03-16'
      thread: vietnam-force-levels
      c: 'Wheeler to Sharp and Westmoreland: the Joint Chiefs considering three courses: escalate gradually; ground combat
        forces to the central highlands; coastal enclaves for offensive operations.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 26. To check: JCS 0936-65, Wheeler to Sharp and Westmoreland, Mar. 16,
        1965, Greene Papers (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 26 n.14). Names: Wheeler, Sharp, Westmoreland.'
      src:
        c: 6e53418f
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 26: all'
        - 'via x.1965-03-16.jcs-0936-65-to-cincpac-mar-16: all'
      tags:
      - name:wheeler-earle
      - name:sharp-u-s-grant
      - name:westmoreland-william
    section: '196503'
- add:
    entry:
      id: cal.1965-03-17.vietnam-force-levels-3
      when: Mar. 17
      date: '1965-03-17'
      thread: vietnam-force-levels
      c: 'McNamara with the Joint Chiefs on a three-division force. Harold K. Johnson and Greene, differing on where, agree
        to "bite [the] bullet"; McConnell against a ground buildup before a wider air campaign; McDonald for a gradual deployment,
        not to the highlands first; Wheeler: "we are losing [the] war." Mar. 18 and 19, the Chiefs still divided.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 26. See [[cal.1965-03-15.vietnam-force-levels]]. Names: McNamara, Harold
        K. Johnson, Greene, McConnell, McDonald, Wheeler.'
      src:
        c: ada9a716
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 26: all'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-harold-k
      - name:greene-wallace-m-jr
      - name:mcconnell-john-p
      - name:mcdonald-david-l
      - name:wheeler-earle
    section: '196503'
