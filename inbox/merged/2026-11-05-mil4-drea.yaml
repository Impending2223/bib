      when: July 20
      date: '1965-07-20'
      thread: vietnam-july-decision
      c: 'Vance''s committee, fifth and last meeting: the call-up and the extension cut to 12 months; budget requests at "minimum
        essential"; a scenario of the President briefing the leaders.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 40. See [[cal.1965-07-17.vietnam-july-decision]]. Names: Vance.'
