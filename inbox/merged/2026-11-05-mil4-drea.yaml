      id: cal.1965-04-03.vietnam-force-levels
      when: Apr. 3
      date: '1965-04-03'
      thread: vietnam-force-levels
      c: 'Wheeler, for the Joint Chiefs, to Sharp and Westmoreland: the logistic reinforcements approved Apr. 1 and 2 preparatory
        to a probable three-division deployment; the Joint Staff plans on that basis.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 29. To check: JCS 1181-65 to COMUSMACV and CINCPAC, Apr. 3, 1965, Eyes
