- add:
    entry:
      id: cal.1965-03-05.vietnam-2
      when: Mar. 5
      date: '1965-03-05'
      thread: vietnam
      c: 'Rusk, McGeorge Bundy and McNamara in a long discussion on South Vietnam''s future, without the Joint Chiefs. Bundy
        to Johnson: "the brutal fact is that we have been losing ground at an increasing rate in the countryside in January
        and February"; only a small circle of civilians, no written record.'
      n: 'Bundy to Johnson, Mar. 6, [FRUS 1964–68, II, doc. 183](https://history.state.gov/historicaldocuments/frus1964-68v02/d183).
        [[w.drea-mcnamara-clifford-and-the-2011]], 24. Names: Rusk, McGeorge Bundy, McNamara.'
      src:
        c: c0ff84c3
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d183: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 24: all'
        - 'via x.1965-03-06.mcgeorge-bundy-to-the-president: all'
      tags:
