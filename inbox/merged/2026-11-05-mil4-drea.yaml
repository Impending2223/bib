      when: July 14
      date: '1965-07-14'
      thread: vietnam-july-decision
      c: 'McNamara tells Stennis: a reserve call-up, higher draft calls and a supplemental request will come with more forces
        for Vietnam.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 39. See [[cal.1965-07-12.vietnam-july-decision]]. Names: McNamara, Stennis.'
