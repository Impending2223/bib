      date: '1965-04-05'
      thread: vietnam-force-levels
      c: McNamara asks the Joint Chiefs for a detailed schedule to bring a two- or three-division force into South Vietnam
        "at the earliest practicable date."
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 29. Names: McNamara.'
