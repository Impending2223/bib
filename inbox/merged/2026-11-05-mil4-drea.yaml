      when: July 17
      date: '1965-07-17'
      thread: vietnam-july-decision
      c: 'Vance''s committee, third meeting: legislation to call up 250,000 reservists, chiefly Army and Marine, for two years,
        and to extend enlistments two years; Niederlehner to draft it, acceptable to Russell and Rivers.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 40. See [[cal.1965-07-15.vietnam-july-decision]]. Names: Vance, Russell,
        Rivers.'
