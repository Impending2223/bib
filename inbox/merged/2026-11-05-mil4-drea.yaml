      thread: japan-and-korea-korean-troops
      also:
      - vietnam-force-levels
      c: 'Johnson authorizes further approaches to Australia, New Zealand and South Korea for combat forces. Already in Vietnam:
        160 Australians, 30 New Zealanders, some 2,400 Korean engineers and security men.'
