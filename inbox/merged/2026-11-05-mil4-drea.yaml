      when: Mar. 26
      date: '1965-03-26'
      thread: vietnam
      c: 'The NSC: the intelligence community reports Hanoi infiltrating regular North Vietnamese units into the South, unconvinced
        it cannot win, unwilling to negotiate. Johnson wants to meet the Joint Chiefs the next week on their new plans.'
      n: 'Summary notes of the 550th NSC, 1:15–2:40 p.m., [FRUS 1964–68, II, doc. 217](https://history.state.gov/historicaldocuments/frus1964-68v02/d217)
        (Hanoi unconvinced it cannot win, not ready to negotiate; the Chiefs to meet him next week). [[w.drea-mcnamara-clifford-and-the-2011]],
        26–27. Names: Johnson.'
      src:
        c: d321a4f7
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d217: A-B'
        - 'w.drea-mcnamara-clifford-and-the-2011 26–27: all'
        - 'via x.1965-03-26.smith-summary-notes-550th-nsc: all'
      tags:
      - name:johnson-lyndon-b
    section: '196503'
