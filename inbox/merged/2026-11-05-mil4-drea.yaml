    section: '196504'
- add:
    entry:
      id: cal.1965-04-12.vietnam-force-levels
      when: Apr. 12
      date: '1965-04-12'
      thread: vietnam-force-levels
      c: 'Westmoreland, told of the decision for more Marines only: he still needs the airborne brigade, for airfield security
        and a mobile reserve. In late March he had asked an infantry division, an airborne brigade and a Marine battalion.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 29. To check: COMUSMACV to CINCPAC, 121530Z Apr 65, Eyes Only files,
        Westmoreland Papers, CMH (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 29 n.25). Names: Westmoreland.'
      src:
        c: bd2a3b55
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 29: all'
        - 'via x.1965-04-12.comusmacv-121530z-apr-65-to-cincpac: all'
      tags:
      - name:westmoreland-william
    section: '196504'
- add:
    entry:
      id: cal.1965-04-13.vietnam-force-levels-3
      when: Apr. 13
      date: '1965-04-13'
      thread: vietnam-force-levels
      c: 'The Tuesday lunch. Johnson withholds the three divisions, 180,000 men, lacking congressional support; "tired of
        taking the blame." He agrees to Westmoreland''s airborne brigade and several more Marine battalions, 33,000 men with
        support. McNamara to the Chiefs: caution. Wheeler, after he leaves: their civilian leaders have led them into a trap.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 29. To check: Greene, memorandum for the record, JCS conference with
        the President, Apr. 13, 1965, Greene Papers (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 29 n.26). See [[cal.1965-04-13.vietnam-force-levels-2]].
        Names: Johnson, Westmoreland, McNamara, Wheeler.'
      src:
        c: '14535242'
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 29: all'
        - 'via x.1965-04-13.cmc-memorandum-jcs-conference-with-president: all'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:mcnamara-robert-s
      - name:wheeler-earle
    section: '196504'
- add:
    entry:
      id: cal.1965-04-14.vietnam-force-levels-3
      when: Apr. 14
      date: '1965-04-14'
      thread: vietnam-force-levels
      c: 'Taylor, told of the decision by the Joint Chiefs'' message of Apr. 13, cables his surprise: "an impression of eagerness
        in some quarters to deploy forces"; no more needed now; delay asked. Rusk to McNamara: not sure what the President
        decided; Bundy: the Chiefs "confused matters."'
      n: '[FRUS 1964–68, II, doc. 252](https://history.state.gov/historicaldocuments/frus1964-68v02/d252) (Saigon 3384, 8
        p.m.). [[w.drea-mcnamara-clifford-and-the-2011]], 29–30 (told by the Chiefs'' message; the calls). See [[cal.1965-04-13.vietnam-force-levels-3]].
        Names: Taylor, Rusk, McNamara, McGeorge Bundy.'
      src:
        c: f9556b5d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d252: A-B'
        - 'w.drea-mcnamara-clifford-and-the-2011 29–30: A, C-E'
      tags:
      - name:taylor-maxwell
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
    section: '196504'
- add:
    entry:
      id: cal.1965-04-15.vietnam-force-levels-2
      when: Apr. 15
      date: '1965-04-15'
      thread: vietnam-force-levels
      c: 'The joint State-Defense directive to Taylor, DEF 9164: "something new must be added in the South to achieve victory."
        Experimental steps: Americans to encadre South Vietnamese battalions, some 50 men in each of about ten, and combined
        operations; a brigade to the Biên Hòa–Vũng Tàu area; battalions at coastal enclaves.'
      n: '[FRUS 1964–68, II, doc. 256](https://history.state.gov/historicaldocuments/frus1964-68v02/d256) (DEF 9164, 6:39
        p.m.). [[w.drea-mcnamara-clifford-and-the-2011]], 30. See [[cal.1965-04-13.vietnam-force-levels-3]]. Names: Taylor.'
      src:
        c: 4324a849
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d256: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 30: A, C-D'
        - 'via x.1965-04-15.def-9164-joint-state-defense-to-saigon: A-D'
      tags:
      - name:taylor-maxwell
    section: '196504'
- add:
    entry:
      id: cal.1965-04-17.vietnam-force-levels-2
      when: Apr. 17
      date: '1965-04-17'
      thread: vietnam-force-levels
      c: 'Taylor to Bundy, eyes only, the first of four cables that day: "greatly troubled" by the directive of Apr. 15; the
        Quát government already charged with a 21-point military, a 41-point non-military, a 16-point USIS and a 12-point
        CIA program. Bundy to Taylor: Johnson, in Texas, suspends all actions and visits until McNamara''s meetings with Westmoreland
        at Honolulu.'
      n: '[FRUS 1964–68, II, doc. 258](https://history.state.gov/historicaldocuments/frus1964-68v02/d258) (Saigon 3421, 3:33
        p.m.); [FRUS 1964–68, II, doc. 262](https://history.state.gov/historicaldocuments/frus1964-68v02/d262) (CAP 65120,
        5:32 p.m.). [[w.drea-mcnamara-clifford-and-the-2011]], 30. See [[cal.1965-04-15.vietnam-force-levels-2]]. Names: Taylor,
        McGeorge Bundy, Johnson, McNamara, Westmoreland.'
      src:
        c: c58b4953
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d258: A-B'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d262: C'
        - 'w.drea-mcnamara-clifford-and-the-2011 30: all'
        - 'via x.1965-04-17.taylor-to-bundy-protected-from-our-friends: all'
        - 'via x.1965-04-17.bundy-cap-65120-to-taylor: all'
      tags:
      - name:taylor-maxwell
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:westmoreland-william
    section: '196504'
- add:
    entry:
      id: cal.1965-04-19.vietnam-force-levels-2
      when: Apr. 19
      date: '1965-04-19'
      thread: vietnam-force-levels
      c: 'The Joint Chiefs to McNamara, on the eve of Honolulu, answering his request of Apr. 5: CINCPAC''s plan, three divisions
        and the 173d Airborne Brigade, in four stages, coastal enclaves to inland bases and offensives from them. McNamara
        unenthusiastic.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 30. Check: the day ("On the eve of McNamara''s departure for Honolulu").
        To check: JCS 00913 to CINCPAC et al., Apr. 17, 1965, SecDef Cable files (cited by [[w.drea-mcnamara-clifford-and-the-2011]],
        30 n.30). See [[cal.1965-04-05.vietnam-force-levels]]. Names: McNamara.'
