- add:
    entry:
      id: cal.1965-04-08.vietnam-force-levels-2
      when: Apr. 8
      date: '1965-04-08'
      thread: vietnam-force-levels
      c: 'The Joint Chiefs with Johnson, who wants advice on how "to kill more Viet Cong." Greene: Johnson does "not seem
        to grasp the military details of what can and cannot be done in Vietnam."'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 29. To check: Greene, memorandum for the record, conference with the
        President, Apr. 8, 1965, Greene Papers (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 29 n.25). Names: Johnson,
        Greene.'
      src:
        c: a51f943d
        rows:
