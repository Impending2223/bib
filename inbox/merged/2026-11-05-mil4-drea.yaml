    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 27 (Taylor to McNamara and the Chiefs: the three-division plan excessive;
      McNamara agrees, but for large reinforcements "as rapidly as possible" if need be)'
    units: A
- cite:
    id: cal.1965-04-01.vietnam-force-levels-2
    item: '[[w.drea-mcnamara-clifford-and-the-2011]], 27 (late afternoon; Wheeler for three divisions, "we are losing the
      war out there," and a reserve call-up; McNamara and Rusk for deferring; some 20,000 logistical troops, more Marines,
      offensive operations)'
    units: A-C
- add:
    entry:
      id: cal.1965-04-01.japan-and-korea-korean-troops
