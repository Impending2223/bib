- add:
    entry:
      id: cal.1960-12.oil
      when: Dec.
      date: 1960-12
      thread: oil
      c: 'The world''s crude oil output in 1960, as the Bureau of Mines first counted it: 21.0 million barrels a day. The United States 7.04, the Soviet Union 2.95, Venezuela 2.85, Kuwait 1.62, Saudi Arabia 1.25. Proved reserves, the Oil and Gas Journal''s year-end count: 301 billion barrels; Kuwait 62, Saudi Arabia 50, the United States 33.5.'
      n: Bureau of Mines, [*Minerals Yearbook 1960*, II, Table 89, pp. 486–487](https://archive.org/details/pub_usgov-minerals-yearbook_1960_2/page/n493) (1961); [*The Oil and Gas Journal*, Dec. 26, 1960, 98–99](https://archive.org/details/sim_oil-gas-journal_1960-12-26_58_52/page/n105). [[w.adelman-world-petroleum-market]]; [[w.yergin-prize]].
      tags:
      - oilworld:1960
