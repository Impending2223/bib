- add:
    entry:
      id: cal.1960-08-09.oil
      when: Aug. 9
      date: '1960-08-09'
      thread: oil
      also:
      - middle-east
      c: 'Esso Export cuts its posted prices for Middle East crude 4 to 14 cents a barrel: Arabian light at Ras Tanura $1.90 to $1.76, Kuwait $1.67 to $1.58, Iranian at Abadan $1.81 to $1.69. Its reasons: discounts below the postings, and Soviet offers.'
      n: '[*The Oil and Gas Journal*, Aug. 15, 1960, 83](https://archive.org/details/sim_oil-gas-journal_1960-08-15_58_33/page/n94), the postings; the day: CIA, [*Central Intelligence Bulletin*, Aug. 16, 1960](https://archive.org/details/cia-readingroom-document-03185153), and [*Current Intelligence Weekly Summary*, Aug. 18, 1960](https://archive.org/details/cia-readingroom-document-02967359). [[w.adelman-world-petroleum-market]]; [[w.sampson-seven-sisters]]; [[w.skeet-opec]]; [[w.yergin-prize]]; [[w.garavini-rise-and-fall-of]].'
      tags:
      - oilprice:ras-tanura
- add:
    entry:
      id: cal.1960-09-12.oil
      when: Sept. 12–16
      date: '1960-09-12'
      thread: oil
      also:
      - middle-east
      c: 'Esso Export restores up to 4 cents a barrel of its Middle East cuts, to the other companies'' postings: Arabian light at Ras Tanura $1.80, Iranian at Bandar Mashur $1.78, Iraq''s at Fao $1.72, Kuwait $1.59, Qatar $1.95.'
      n: '[*The Oil and Gas Journal*, Sept. 19, 1960, 81](https://archive.org/details/sim_oil-gas-journal_1960-09-19_58_38/page/n88) ("last week"). Check: the day. See [[cal.1960-08-09.oil]].'
- add:
    entry:
      id: cal.1962-06-04.oil
      when: June 4
      date: '1962-06-04'
      thread: oil
      also:
      - middle-east
      c: 'OPEC''s Fourth Conference, Geneva, adopts Resolutions IV.30–36: negotiations with the companies "forthwith," so that oil is paid for at posted prices no lower than before August 1960; royalties at a uniform rate, not credited against income tax; no share in the companies'' marketing expenses. Iran and Saudi Arabia to negotiate.'
      n: '[FRUS 1961–63, IX, doc. 354](https://history.state.gov/historicaldocuments/frus1961-63v09/d354) (Tehran, July 2). Made public: given to the press, July 2, 1962 (doc. 354 and its note). See [[cal.1960-09-10.middle-east]].'
- edit:
    id: cal.thread.oil
    base: 6e05229d
    set:
      c: Oil imports, the import program, and the world's oil. Esso's cut and OPEC at Baghdad; Nixon at Centralia; the ceiling on demand; the East Coast's residual oil; Libya's first exports; Iraq's Law 80; OPEC at Geneva; the petroleum study; Kennedy to Udall; the ceiling on production; the world's output, year by year.
      c2: Oil imports, the import program, and the world's oil. The Appeals Board; the ceiling on the period's own production; foreign-trade zones, petrochemicals and Puerto Rico; the world's output, year by year.
      c3: Oil imports, the import program, and the world's oil. Asphalt; the Arab embargo; Rusk to Udall; the emergency declared; the OECD's industry body; low-sulfur residual oil; Iraq and Saudi Arabia resume; the Virgin Islands; the unused licenses; Prudhoe Bay; the world's output, year by year.
