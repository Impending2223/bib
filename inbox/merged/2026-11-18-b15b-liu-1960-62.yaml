    entry:
      id: cal.1960-06-16.china-leadership-2
      when: June 16
      date: '1960-06-16'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi writes the editor''s note for the article of the Chengdu measuring and cutting tools plant''s Party committee, "A new-type system of socialist enterprise management," for *Renmin ribao*, and sends the paper with a letter to Li Jingquan and Li Xuefeng. The note: the "two participations, one reform, three combinations" has made important progress these two years, a very welcome thing; plants and mines able to are to spread the Chengdu experience and others to create the conditions; two conditions: cadres follow the mass line and take part in labor, and workers'' political awareness lets them treat state enterprises as masters. Note and article appear in *Renmin ribao* June 24.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 489–490 (June 16, 1960). Footnote 1 (489) gives Li Jingquan as then Sichuan Party secretary. Made public: 1996. To check: *Renmin ribao*, June 24, 1960, the editor''s note and the Chengdu plant''s article (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 490). Names: Liu Shaoqi, Li Jingquan.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:li-jingquan
      - vis:only:prc
- add:
    entry:
      id: cal.1960-06-18.china-leadership-3
      when: June 18
      date: '1960-06-18'
      thread: china-leadership
      also:
      - china
      c: 'Shanghai. Liu Shaoqi speaks at the enlarged Politburo meeting. The Center and the provinces now agree that agriculture is the base, but capital construction is still not settled: too many want more of it and will not hold back, and the rush to start projects will keep the economy passive. How many projects are started must follow how much material and labor there is, and they are to be finished one battle after another, one by one.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 490 (June 18, 1960). Made public: 1996. See [[cal.1960-06-18.china-leadership-2]]. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
