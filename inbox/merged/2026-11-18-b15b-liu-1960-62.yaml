- add:
    entry:
      id: cal.1962-11-12.china-leadership-2
      when: Nov. 12
      date: '1962-11-12'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi talks with the heads of the Central Committee''s Organization Department and the bureaus'' organization departments who are at the organization work conference, on building the ruling Party. The two chief questions are basic-level Party organizations and cadres. Organization work must be regularized; where no one manages the Party, the Party is not well managed and someone has to. Cadres are to be re-educated, chosen and appraised so that the ranks stay pure. More is asked of cadres than of Party members; among cadres, high and middle ones above all, there are bad ones, turned bad and decayed, whose influence differs from that of a few members at the base. People outside the Party fear that Party rule may corrupt it, a real problem Lenin raised too; if we do not notice it the Party may degenerate. Corrupt and fallen cadres are to be dealt with openly, reported to the whole Party and used for education; major cases that cannot be disposed of have someone holding them
        up, and fear not: most would support the handling. Do not cut off from the majority of Party members, cadres, workers and peasants; practice democratic centralism, criticism and self-criticism, one leader and a majority.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 565–566 (Nov. 12, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-27.china-leadership-3
      when: Nov. 27
      date: '1962-11-27'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the Politburo briefing and hears Li Fuchun and Li Xiannian on the national planning conference. The spirit of the May conference is to go on being carried out; capital construction is still to come down where it can and the town population to go on being cut, or the Center will be put in a very passive position. Next year''s plan may be on the large side; not to be made big at once and then adjusted again. For two years great effort turned the situation; not to turn it again, which would not do, wasting time and bringing hardship to the people and loss to the state: better a tight, smaller plan now.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 566 (Nov. 27, 1962). Made public: 1996. Names: Liu Shaoqi, Li Fuchun, Li Xiannian. Check: whether the same meeting as Zhou Enlai''s at the Secretariat, Nov. 26–27, hearing Li Fuchun and Li Xiannian ([[cal.1962-11-26.china-leadership]]).'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:li-fuchun
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1962-12-10.china-leadership-2
      when: Dec. 10
      date: '1962-12-10'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi comments on the Central Committee General Office work group''s "Report on the relations of industry and commerce in Shijiazhuang and their handling," to Li Xiannian, Bo Yibo and Zihua: it deals with the relations of industry and commerce within the whole-people ownership, which long disputed, hindered production, and in three weeks was settled to fair satisfaction. They are to study it and fix at once some rules to settle quickly such relations everywhere, or a comment may be added fixing methods for the paper to be sent on to other places.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 566–567 (Dec. 10, 1962). Made public: 1996. To check: Central Committee General Office work group, "Report on the relations of industry and commerce in Shijiazhuang and their handling" (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 566). Names: Liu Shaoqi, Li Xiannian, Bo Yibo.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:li-xiannian
      - name:bo-yibo
      - vis:only:prc
