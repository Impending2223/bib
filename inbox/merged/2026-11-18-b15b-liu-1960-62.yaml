- add:
    entry:
      id: cal.1962-08-20.china-leadership
      when: Aug. 20
      date: '1962-08-20'
      thread: china-leadership
      also:
      - china
      c: Beidaihe. Liu Shaoqi asks in the central group how the conference is to be conveyed. The conference discussed class and class struggle; to speak of them touches very many matters and in conveying it the education of cadres must be linked, to good effect; but in practice it is a complicated question, and linking everything to class struggle, as with private plots, the responsibility system and contracting output to households, can cause a reaction. Class analysis cannot easily be applied to all; the question needs study, and the scope of conveyance should be fixed. Mao agrees with Liu's view.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559 (Aug. 20, 1962). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-01.china-leadership-4
      when: Aug. 1
      date: '1962-08-01'
      thread: china-leadership
      also:
      - china
      c: '*Hongqi* and *Renmin ribao* reprint Liu Shaoqi''s important work of 1939 at Yan''an, *Lun Gongchandangyuan de xiuyang* (How to be a good Communist). In September the People''s Publishing House brings it out as a separate book, with important additions and revisions: the chapters on "theoretical study and ideological training are one" strengthen the theoretical argument, add the Party''s important strategic and tactical thought, and stress that a Communist, after taking power, must work harder on ideological training.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559 (Aug. 1, 1962). To check: *Hongqi* and *Renmin ribao*, Aug. 1, 1962, the reprint of *Lun Gongchandangyuan de xiuyang*; the People''s Publishing House edition of Sept. 1962 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
