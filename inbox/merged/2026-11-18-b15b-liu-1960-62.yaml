      when: Aug. 24, 26
      date: '1960-08-24'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the symposium of the Communist Party and the democratic parties on Sino-Soviet relations. On the 26th he tells the parties the Central Committee''s attitude and line on the Soviet government''s recent tearing up of contracts, withdrawal of experts in China and halt of main equipment supplies: the unity of the members'' speeches is a good spirit; China, oppressed for over a hundred years, will not be crushed; policy: hold position, hold principle, hold unity, and handle it with care.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 492–493 (Aug. 24, 26, 1960). Made public: 1996. Check: whether it is the enlarged plenary meetings of the six parties'' central committees where Zhou Enlai spoke Aug. 24 ([[cal.1960-08-24.china-leadership]]). Names: Liu Shaoqi.'
