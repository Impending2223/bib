      - china
      c: Liu Shaoqi reaches Tianhua production brigade, Guangfu commune, Changsha county, to stay and investigate, and lodges at the landlord house of Wangjiatang. On the way he hears reports on the Wangjiatang area.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 511 (Apr. 12, 1961). The chronology gives "Wangjiatang" as the brigade''s house (大队部所在地王家塘); the page header reads 1960年4月 for the 1961 pages 511–519, a misprint. Made public: 1996. Names: Liu Shaoqi.'
