- add:
    entry:
      id: cal.1960-02-05.china-leadership-2
      when: Feb. 5
      date: '1960-02-05'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi''s comment on the All-China Women''s Federation''s request to print records of talks by Mao Zedong, Liu and other leaders: the Center has repeatedly forbidden printing records of leaders'' talks they have not reviewed. Comrades who hear a leader are to think it over and, if it is right and important, put it in their own words and discuss it; less appeal to authority, more free discussion.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 477–478 (Feb. 5, 1960). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:mao-zedong
      - vis:only:prc
