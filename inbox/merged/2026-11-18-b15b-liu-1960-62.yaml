      - china
      c: Liu Shaoqi, with Deng Xiaoping, meets Miyamoto Kenji, general secretary of the Japanese Communist Party.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543 (Oct. 28, 1961). Names: Liu Shaoqi, Deng Xiaoping.'
