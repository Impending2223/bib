    entry:
      id: cal.1960-06-10.china-leadership-2
      when: June 10
      date: '1960-06-10'
      thread: china-leadership
      also:
      - china
      c: 'Shanghai. Liu Shaoqi presides at the symposium of the regions'', provinces'', cities'' and central departments'' chief officials. He opens: in the last half-year the work has had serious problems, in grain, dropsy, abnormal deaths, accidents and the fulfillment of the plan. Everyone wants more and faster, a bigger plate, more construction; the plan has been too high, the demands too urgent, the press too loud, and the Center is included. The Lushan meeting meant to sum this up, but the Peng Dehuai affair pushed it aside. If not corrected the problems, now one finger, may grow to two or three.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 488–489 (June 10, 1960). Made public: 1996. Names: Liu Shaoqi, Peng Dehuai.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:peng-dehuai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-06-11.china-leadership-2
      when: June 11
      date: '1960-06-11'
      thread: china-leadership
      also:
      - china
      c: 'Shanghai. Liu Shaoqi presides at the symposium again. Interjecting in Ke Qingshi''s speech: can the masses elect the cadres they dislike, or is election a form; the Soviet experience calls for more restraint on privilege; differences of treatment follow differences of need, and those who get higher treatment should not arrange it themselves. In Wang Renzhong''s: big harvests mean heavy accumulation, small ones light; to pile up in a great disaster against the objective law. He closes: keep up drive, strive upward, but start from the real situation.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 489 (June 11, 1960). Made public: 1996. Names: Liu Shaoqi, Ke Qingshi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:ke-qingshi
      - vis:only:prc
