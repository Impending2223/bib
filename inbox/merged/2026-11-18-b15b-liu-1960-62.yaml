    entry:
      id: cal.1961-09-18.china-leadership-2
      when: Sept. 18
      date: '1961-09-18'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi receives the credentials of Sweden's new ambassador (切尔·厄贝尔 in the chronology). China wants better relations with Sweden's people and government, and with those of every country; Sweden was lucky not to be drawn into the two world wars, China was and has had civil wars for decades; China is a large country but a backward one, and needs a peaceful international environment for decades or centuries.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 539 (Sept. 18, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:sweden
      - vis:only:prc+sweden@B-D
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1961-09-22.china-leadership-9
      when: Sept. 22
      date: '1961-09-22'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi receives Field Marshal Montgomery. Asked what the final aim of the Chinese Communist Party''s Central Committee and the government is, he says it is the Chinese people''s: to build China well, keep it independent and sovereign and better the people''s economic and cultural life, to achieve socialism and communism. Asked whether a China of a billion people in thirty, forty or fifty years will invade or press outward, he says a nation that oppresses others has no freedom and no good result; China will not oppress the British or small neighbors, Burma, Thailand, Cambodia, Nepal, India, and will build friendship on mutual sovereignty and the five principles, and teach its descendants never to invade or oppress.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 539–540 (Sept. 22, 1961). Made public: 1996. Names: Liu Shaoqi, Montgomery. Check: Zhou Enlai''s chronology has Zhou answer Montgomery on China''s final aim the same day ([[cal.1961-09-22.china-leadership-2]]); one meeting or two.'
      tags:
      - polity:prc
      - polity:uk
      - name:liu-shaoqi
      - name:montgomery-of-alamein-bernard-l
      - vis:only:prc+uk
- add:
    entry:
      id: cal.1961-09-23.china-leadership-5
      when: Sept. 23
      date: '1961-09-23'
      thread: china-leadership
      also:
      - china
      c: 'Mao Zedong, speaking to Xiong Xianghui, deputy director of the Foreign Ministry''s general office, and Pu Shouchang, secretary in the Premier''s office, who are looking after Montgomery''s visit: the Eighth Congress''s Party constitution has a clause for an honorary chairman "if need be," and Mao would be it; the vice-chairmen are six, and Liu Shaoqi first among them, in effect first vice-chairman, who runs the first line of work; Liu is no Malenkov. Two years before, the chairman of the republic changed his surname, from Mao to Liu, as the National People''s Congress chose; before, two chairmen were both Mao, now one Mao and one Liu, and in time both Liu. If Marx does not invite him, he will be the honorary chairman.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 540–541 (Sept. 23, 1961). The chronology marks it as a second item of the day (△). Pu Shouchang is given as secretary of the Premier''s office (总理办公室秘书). Made public: 1996. Names: Liu Shaoqi, Mao Zedong, Malenkov, Montgomery.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:mao-zedong
      - name:malenkov-georgiy-maksimilianovich
      - name:montgomery-of-alamein-bernard-l
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-24.china-leadership-3
      when: Sept. 24
      date: '1961-09-24'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi receives the credentials of Romania''s new ambassador (乔治乌·杜米特鲁 in the chronology). People''s subjective thought reflects the objective, sometimes not fully at once; different views come out and, after discussion, agree, until some new question arises: a law of development and a constant task. The Party is the same.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 541 (Sept. 24, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:romania
      - vis:only:prc+romania@B-D
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1961-10-13.china-leadership-2
      when: Oct. 13
      date: '1961-10-13'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi talks with U Nu, Prime Minister of Burma, with Zhou Enlai. U Nu says the settlement of the boundary and the fast growth of friendship show China has no great-power chauvinism; Liu: "we are afraid of great-power chauvinism," we are a big country and it is good to fear it, and we teach our descendants not to commit it; if one slips, he is to correct it at once, apologize and own the error.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 542 (Oct. 13, 1961). Made public: 1996. The protocol''s signing that day is [[cal.1961-10-11.china-leadership-2]]. Names: Liu Shaoqi, Zhou Enlai, U Nu.'
      tags:
      - polity:prc
      - polity:burma
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:u-nu
      - vis:only:prc+burma
- add:
    entry:
      id: cal.1961-10-19.china-leadership-4
      when: Oct. 19
      date: '1961-10-19'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi hears Li Xiannian and others on commerce. To use the state''s goods as a weapon to seek private convenience is not allowed, still less to take things through the "back door" and swap them at will; the commercial ranks and their cadres are to be strengthened; a city needs a commercial inspection organ, whose supervision is joined to the masses''. The free market in the villages is to be given up, but not left unmanaged: it breeds some capitalism, bourgeois elements and some rogues, even some underground factories; do not fear them, for what they make is what the people need, and shows our lack; having seen the gaps they go at it, and that makes up for our gaps.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 542–543 (Oct. 19, 1961). Made public: 1996. Names: Liu Shaoqi, Li Xiannian.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-25.china-leadership-2
      when: Oct. 25
      date: '1961-10-25'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi hears Tan Zhenlin, a vice-premier, and Luo Yuchuan, Zhang Zhao and Liang Changwu of the Ministry of Forestry on the Northeast and Inner Mongolia forestry work conference held in Peking. He proposes: wages in the forest areas are high, so some goods are to be sent in, and schools and other welfare run, to settle people; a three-year period of no purchase quota may be tried, to encourage family sidelines in the forest areas; order in the forest areas is poor and is to be set right; forestry production is to raise mechanization, and renewal of machines is a long-range policy.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543 (Oct. 25, 1961). Made public: 1996. Names: Liu Shaoqi, Tan Zhenlin.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:tan-zhenlin
      - vis:only:prc
