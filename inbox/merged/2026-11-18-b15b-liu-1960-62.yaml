      - china
      c: 'Liu Shaoqi comments on the Central Committee General Office''s *Qingbao jianbao* no. 553, compiled Oct. 8, which prints the Hubei Party committee''s instruction to deal with the "communist wind" at county level and above: the phenomena probably exist everywhere in some degree; the departments concerned should study it and fix some measures to put it right.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 494 (Oct. 9, 1960). Made public: 1996. Names: Liu Shaoqi.'
