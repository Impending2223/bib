      id: cal.1962-09-01.china-leadership-3
      when: Sept. 1
      date: '1962-09-01'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi receives the credentials of Pakistan''s new ambassador (罗查 in the chronology) and talks with him. Our policy is friendship with all countries on the five principles: all states, great or small, strong or weak, are to practice non-interference, nonaggression, mutual respect, equality and peaceful coexistence; whether the other great powers like it or not, China will hold to them.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559–560 (Sept. 1, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:pakistan
      - vis:only:prc+pakistan@B-C
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1962-09-26.china-leadership
      when: Sept. 26
      date: '1962-09-26'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi speaks at the Tenth Plenum and says he agrees with Mao Zedong''s views. Before the difficulties there are three attitudes: the first, to overcome them and hold to the socialist road; the second, to be frightened and abandon the socialist road, retreating; the third, to use our difficulties to attack the Party and try to overthrow its Marxist-Leninist leadership. The first is right and the second and third wrong and reactionary. He proposes that the spirit of the plenum be conveyed within a scope, not below, so as not to tie everything to class struggle and spend the whole Party''s strength on class struggle. Mao accepts the views of Liu and others: the spirit is to be conveyed only to cadres of grade 17 and above in the administration, and the whole Party is told not to slacken economic work but put it first, so that after the plenum the adjustment can go on in the main by the plan already fixed.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 560–561 (Sept. 26, 1962). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-10-10.china-leadership-2
      when: Oct. 10
      date: '1962-10-10'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi hears the State Economic Commission Party group on a pilot of materials management. Materials management is new work, and ideas about it are at first not one, naturally; it is to be tried on a small scale, carefully, step by step, to be done well in three years. The Tenth Plenum made a decision on commerce, whose principles hold for materials too: the materials departments are commercial departments for production goods, with great power; they must not hold men in a difficulty by the neck, but serve production and construction. Everything possible is to be done to keep plant production steady, with strictness in plans and contracts: whoever orders and then, halfway, will not take the goods pays the loss and admits the error; goods not up to plan or contract quality are the producer''s to repair, return or guarantee; and goods of old production out of standard are cut in price, never sold as good goods.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 561 (Oct. 10, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-10-14.china-leadership-2
      when: Oct. 14
      date: '1962-10-14'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi recommends two articles to his children Maomao (Liu Yunruo) and Taotao (Liu Tao), "On the principle of proletarian morality and utilitarianism" (*Guangming ribao*, Oct. 5, 1962) and "The sources and the course of development of Greek ethical thought" (*Wenhui bao*, Sept. 9, 1962), and writes to them: ethics or moral science is a social science, treating the different standards of morality of the several classes of society, a tool of class struggle, its basic object good and evil (loyal and traitor, good and bad); if you find people judge good and evil of a social phenomenon differently, you will find their class stands differ; for all social and political phenomena class analysis is a basic method, Marxism''s way to know them correctly.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 561–562 (Oct. 14, 1962). Made public: 1996. To check: "On the principle of proletarian morality and utilitarianism," *Guangming ribao*, Oct. 5, 1962; "The sources and the course of development of Greek ethical thought," *Wenhui bao*, Sept. 9, 1962 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 561). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-10-15.china-leadership
      when: Oct. 15, 16
      date: '1962-10-15'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the Politburo briefing meetings and hears Tan Zhenlin, vice-premier, on current farm work, the 1963 plan, the allotment of capital construction investment, the 1965–70 outlook and the Third Five-Year Plan. On trying weed-killers next year: some may be imported, a little of each, small trials; foreign experience is to be taken in. On forestry: close the hills for forest and raise artificial planting greatly, but large forests still rest on natural renewal. On farm research and teaching: both schools that design and make farm machinery and those that teach management are needed, and there are too few; the making and fitting of village processing machinery needs attention too.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 562 (Oct. 15, 16, 1962). Made public: 1996. Names: Liu Shaoqi, Tan Zhenlin.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:tan-zhenlin
      - vis:only:prc
- add:
    entry:
      id: cal.1962-10-19.china-leadership-2
      when: Oct. 19
      date: '1962-10-19'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi presides at the Politburo briefing and hears Zhao Erlu, deputy director of the State Council Office of Defense Industry, on the defense industry's basic situation, this year's plan's execution and the 1963 and Third Five-Year Plan arrangements. Missiles and atomic bombs both need a special organ at the Center to direct organization, coordination and orders; a small body is to be had, or by dragging it out time passes. Every country has done this, and ours is to do it still better by creating conditions to let it go forward smoothly.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 562–563 (Oct. 19, 1962). Made public: 1996. Names: Liu Shaoqi, Zhao Erlu.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:zhao-erlu
      - vis:only:prc
- add:
    entry:
      id: cal.1962-10-20.china-leadership
      when: Oct. 20, 22
      date: '1962-10-20'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the Politburo briefings and hears Bo Yibo on industrial-communications matters and the 1963 plan. Heavy industry is to serve agriculture and light industry, not light industry heavy industry, and not agriculture heavy industry. On more kinds of products: the key steels, machines and chemicals the Soviet Union does not give us we must get as we can from the capitalist side, at a price, for we too must spend time and money; the departments of foreign trade are to look to capitalist outlets. On quality: if prices rise with quality, and fall with lower quality, check it; every product from the factory should carry a form guaranteeing its grade and standard, and the unqualified be returned, cut in price or fined; no cheating the using departments and the consumers: socialism''s advantage is to be honest. Capitalism values credit; Soviet goods, consumer goods most, are poor. The investment arrangements are too weak to hold production at its present level: after
        so bitter a suffering and so great a price we know our ignorance, and need first simple reproduction, then enlargement; building new plants is worse than enlarging old, enlarging old worse than keeping simple reproduction.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 563 (Oct. 20, 22, 1962). Made public: 1996. Names: Liu Shaoqi, Bo Yibo.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:bo-yibo
      - vis:only:prc
