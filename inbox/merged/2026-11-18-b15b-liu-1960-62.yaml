      c: Minsk. At the welcome banquet of the Byelorussian Party Central Committee, Supreme Soviet and Council of Ministers, Liu Shaoqi speaks. The Byelorussians waged wide guerrilla war in the Patriotic War and struck the invaders hard, in step with the Soviet army's frontal war; their deeds are especially dear to the Chinese, who fought Japan chiefly by guerrilla war.
