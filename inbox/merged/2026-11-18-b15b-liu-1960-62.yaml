      id: cal.1961.china-leadership-10
      when: '1961'
      date: '1961'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi inscribes for the Chinese People''s Revolutionary Military Museum: "The People''s Liberation Army is both the defender and the builder of the socialist cause." And for its hall of the war to resist America and aid Korea: "We must educate our people and army in the spirit of internationalism joined to patriotism."'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 544 (1961, 1961). The second inscription is marked as a second item (△). Check: the day; the chronology gives only the year. Names: Liu Shaoqi.'
