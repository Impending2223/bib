    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 517 (Apr. 30, 1961; afternoon, Liu''s speech at the all-cadre meeting of the provincial, city and county work teams on investigation and the mass line: investigation is to solve problems, not for its own sake; the questions are the policies the Center has put into effect, whether more are needed, and the problems nobody has yet thought of; investigating and remaking the world are one; the subjective world reflecting the objective is a long, even winding process)'
- cite:
    id: cal.1961-04-12.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 511–518 (Apr. 12–30, 1961; Liu''s stay at Tianhua brigade, day by day: Apr. 13 the brigade cadres'' forum, Apr. 14 the team cadres, Apr. 15 the Shijiachong mess hall and members'' forum, Apr. 17 the general branch committee, Apr. 19–22 the work group on dropping the mess halls and restitution, Apr. 24 handicrafts, Apr. 25 commerce and housing, Apr. 27 the peasants and the Sixty Articles, Apr. 30 the work group and the work teams)'
- cite:
    id: cal.1961-04-01.china-leadership-2
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 510 (Apr. 1–8, 1961; Liu leaves Canton for Changsha Apr. 1, having told the Central-South Bureau''s and the Hunan committee''s officials that he will go to the peasants'' homes as in the old base areas, with few people, everything simple; Apr. 2 reaches Wangjiawan team, Donghutang commune, Ningxiang, lodging in the old pig farm; hears the work groups Apr. 3 and 4–7; Apr. 8 leaves for Shaoshan)'
- check:
    id: cal.1961-04-28.china-leadership-2
    text: 'Check: Liu''s chronology (II, 518–519) puts his talk with Hu Jiwei and other *Renmin ribao* men on the press, three years of exaggeration and "blind command" in coverage, at Changsha May 1; Apr. 28 there is only a hearing of the work group on Tianhua''s leadership.'
- check:
    id: cal.1961-04-16.china-leadership
    text: 'Check: Liu''s chronology (II, 512) has Liu at Tianhua brigade on Apr. 16 (visiting members'' homes) and Apr. 17 (general branch meeting), and does not mention the meeting at the Rong Garden.'
- cite:
    id: cal.1961-05-02.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 519 (May 2–7, 1961; Liu reaches Ningxiang county town May 2; evening of May 3 he goes to Tanzichong brigade, Huaminglou commune, his native place, and lodges in his old house; May 6 he talks with peasants there; May 7 afternoon, the forum of grassroots cadres and members)'
- variant:
    id: cal.1961-05-02.china-leadership
    unit: A
    witness: w.shaoqi-liu-shaoqi-nianpu-chronology
    reads: Liu Shaoqi reaches Ningxiang county town May 2, hears the county committee, and goes on the evening of May 3 to Tanzichong; the forum and the mess hall decision follow May 7 and after
    at: 519–520
- cite:
    id: cal.1961-05-07.china-leadership-2
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 520–521 (May 7, 1961; morning, Liu sweeps his mother''s grave at Shouzichong; afternoon, at the forum of grassroots cadres and members of Tanzichong brigade he says he has not been home in nearly forty years, and life is hard; the work was done badly, and he is sorry to them; production fell and life worsened chiefly through errors, not the weather; the mess halls have no advantage, save neither labor nor firewood, and are to be dissolved; housing, private plots, hogs and fowl, forests are then to be settled; the talk is in his Selected Works as "Talk with Tanzichong peasants")'
- to-check:
    id: cal.1961-05-07.china-leadership-2
    add:
    - '[[w.shaoqi-liu-shaoqi-xuanji-selected]], the "Talk with the peasants of Tanzichong" (同炭子冲农民的谈话) (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 521).'
- cite:
    id: cal.1961-05-31.china-leadership-2
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 524–525 (May 31, 1961; Liu presides at the Central Work Conference''s plenary meeting and sums up: the peasants of Hunan say "three parts natural calamity, seven parts man-made"; for the country as a whole natural calamity is the main cause in some places, but not in most, where the faults and errors in work are the main cause; in carrying out the general line, organizing communes and the Leap there were many faults, some serious; some inexperience made unavoidable, some avoidable and earlier discoverable)'
- cite:
    id: cal.1961-06-04.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 525 (June 3, 1961; Liu''s review of the draft and his added opening; issued June 23)'
    units: A
- cite:
    id: cal.1961-06-12.china-leadership-3
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 526 (June 12–15, 1961; June 12 Liu, with Soong Ching-ling, Dong Biwu, Zhu De and Zhou Enlai, meets the DRV government delegation under Phạm Văn Đồng, premier; Liu: shortcomings and errors in work, joined to two years of calamity, have added to the losses; this makes China careful, and makes cadres and leaders clear-headed, not muddled; the slogan is that cadres must know the laws of socialist economic development)'
    units: A
- cite:
    id: cal.1961-06-13.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 526 (June 13, 1961; Liu, with Dong Biwu, Zhu De and Zhou Enlai, talks with Sukarno; June 14 he attends the capital''s mass welcome rally for Sukarno and the exchange of the instruments of ratification of the China–Indonesia friendship treaty, and receives from Sukarno the Order of the Republic of Indonesia, first class)'
    units: B
- cite:
    id: cal.1961-06-16.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 526 (June 16, 1961; Liu, with Mao and Deng Xiaoping, meets Aidit, chairman of the Indonesian Communist Party)'
    units: C
- cite:
    id: cal.1961-06-20.china-leadership-3
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 527 (June 20, 1961; Liu, with Zhu De, Deng Xiaoping and Dong Biwu, meets the Japanese Communist Party''s Diet members'' delegation, its head Shiga Yoshio, member of the Party''s Central Committee politburo)'
    units: A
- cite:
    id: cal.1961-06-30.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 527 (June 30, 1961; Liu''s speech at the rally for the Party''s fortieth anniversary: a review of the Party''s history, its stand on the great questions at home and abroad and the tasks ahead; forty years of heroic struggle and great victory; two great undertakings, the people''s democratic revolution and socialist revolution and construction; every member, new or old, is to study socialist construction carefully and systematically, in a new Party-wide study campaign to know and master the objective laws of building socialism)'
    units: C
- cite:
    id: cal.1961-07-06.china-leadership-2
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 528 (July 6, 1961; Liu presides at the Politburo meeting, which discusses and in the main passes Nie Rongzhen''s request report on several policy questions in current natural-science work and the National Science Commission Party group''s and Academy of Sciences Party group''s "Fourteen opinions on the present work of natural-science research bodies (draft)"; Liu in his summing up: a good document; the problem is that the work is biased and must be admitted; the Party''s leadership position in science is good, but there is a bias of blind command; "when there is a bias, correct it"; the Center issues both July 19)'
    units: A
- cite:
    id: cal.1961-07-10.china-leadership-2
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 528–529 (July 10–11, 1961; July 10 Liu, with Zhou Enlai and Deng Xiaoping, talks with Kim Il Sung, chairman of the Korean Workers'' Party Central Committee and the DPRK''s premier; July 11 Liu attends the signing of the Sino-Korean treaty of friendship, cooperation and mutual assistance)'
    units: B
- cite:
    id: cal.1961-08-14.china-leadership-2
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 537 (Aug. 14–18, 1961; Aug. 14 Liu, with Zhou Enlai, Dong Biwu and Zhu De, talks with Kwame Nkrumah, president of Ghana and head of government: his visit is a contribution to China-Ghana friendship; China fully supports the African peoples'' struggle and will help as it can, though its own economy and culture are backward, perhaps more in ten years; Aug. 15 he goes on talking, and explains the people''s communes and ownership: three levels of management committees elected by members, the team the production unit, the brigade the basic accounting unit, and two kinds of ownership, by the whole people and by the collective, with a small personal share; Aug. 18 he attends the signing of the joint communiqué and friendship treaty and signs the communiqué)'
    units: A
- cite:
    id: cal.1961-08-23.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 538 (Aug. 23–Sept. 16, 1961; Liu attends the Central Work Conference at Lushan: industry, grain, finance and education; it makes the "Instruction on current industrial problems" and passes the Education Ministry''s directly run colleges'' work regulations (draft), the "Sixty Articles on Higher Education," and the work regulations of state industrial enterprises (draft), the "Seventy Articles on Industry")'
- check:
    id: cal.1961-09-22.china-leadership-2
    text: 'Check: Liu''s chronology (II, 539–540) has Liu Shaoqi receive Montgomery Sept. 22, and answer the question of the Chinese Party''s and government''s final aim; whether it is the same meeting, or a second, is not settled.'
- cite:
    id: cal.1961-09-22.china-leadership-6
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 540 (Sept. 22, 1961; Liu, with Zhou Enlai, Dong Biwu and Zhu De, holds talks with Osvaldo Dorticós Torrado, president of Cuba)'
- cite:
    id: cal.1961-09-23.china-leadership-3
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 540 (Sept. 23, 1961; Liu, with Zhou Enlai, continues the talks with Dorticós: socialist states are to raise the people''s living standards; in propaganda say less, and more of the people''s hard struggle; do more in fact and say less, and the people are still satisfied)'
    units: B
- cite:
    id: cal.1961-09-24.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 541 (Sept. 24, 1961; at Wuhan Mao meets Montgomery, who asks who his successor is; Mao: very clear, Liu Shaoqi, first vice-chairman of the Party; after Mao''s death, him; asked if Zhou Enlai follows Liu, Mao says he does not care about what is after Liu)'
- cite:
    id: cal.1961-09-28.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 541 (Sept. 28, 1961; Liu, with Mao and Zhou Enlai, meets Dorticós)'
    units: B
- cite:
    id: cal.1961-09-30.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 542 (Sept. 30, 1961; Liu, with Mao, Zhou Enlai and Zhu De, meets King Mahendra and the Queen)'
    units: C
- cite:
    id: cal.1961-10-12.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 542 (Oct. 12, 1961; Liu, with Mao, Zhou Enlai, Zhu De, Chen Yun, Lin Biao and Deng Xiaoping, meets Hồ Chí Minh, chairman of the Vietnam Workers'' Party Central Committee and president of the DRV, and Lê Duẩn, first secretary)'
- cite:
    id: cal.1961-10-24.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543 (Oct. 24, 1961; Liu, with Mao, Zhu De and Deng Xiaoping, meets Zhou Enlai at the airport, back from the CPSU''s 22nd Congress, which he left early)'
- cite:
    id: cal.1961-11-06.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543 (Nov. 6–10, 1961; Liu presides at the meeting of the first secretaries of the Central Committee''s bureaus on the system of the people''s communes, the market and grain)'
    units: A
- cite:
    id: cal.1961-11-14.china-leadership-5
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543 (Nov. 14, 1961; Liu, with Mao, Zhou Enlai and Deng Xiaoping, meets Hồ Chí Minh, chairman of the Vietnam Workers'' Party Central Committee)'
    units: A
- cite:
    id: cal.1961-12-20.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543–544 (Dec. 20, 1961–Jan. 10, 1962; Liu attends the Central Work Conference on the international and domestic situation, the 1962 national economic plan and the long-term plan, and the Party''s work, to prepare the enlarged Central Work Conference; late in the meeting Liu chiefly directs the drafting of the report the Central Committee is to give to the enlarged conference)'
    units: A
- cite:
    id: cal.1962-01-11.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 545 (Jan. 11–Feb. 7, 1962; Liu attends the enlarged Central Work Conference, "the Seven Thousand Cadres Conference": 7,118 leading cadres of the Center, the bureaus, the provincial, prefectural and county committees, major plants and mines and the army; its aim to sum up experience, unify understanding, strengthen democratic centralism and carry out the policy of adjusting the national economy; Jan. 11–24 the Center''s draft report is given out for discussion and views, and the Center decides to set up a 21-man drafting committee under Liu)'
- cite:
    id: cal.1962-01-17.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 545 (Jan. 17–24, 1962; Liu presides at eight meetings of the report drafting committee, which revises the report on the views of the conference''s groups)'
- cite:
    id: cal.1962-01-14.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 545 (Jan. 14, 1962; Liu, with Mao, meets the Albanian government economic delegation and talks with its head, Abdyl Këllezi, vice-chairman of the Council of Ministers)'
- cite:
    id: cal.1962-01-25.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 545–546 (Jan. 25, 1962; Liu presides at the enlarged Politburo meeting, which discusses and in the main passes the report drafted under him; in discussion Liu: here is a conference of seven thousand, county first and second secretaries and men of every plant and department; so many must unify thinking and understanding; since 1958 so many problems have arisen, with many successes and many faults and errors, and how to see them is the great question; unified understanding and thinking, so later also a unified plan and action, is the key question of this critical time for the Party)'
    units: B
- cite:
    id: cal.1962-01-27.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 547–548 (Jan. 27, 1962; Liu''s supplementary talk to the enlarged conference: shortcomings and successes were once spoken of as one finger to nine, but for the country as a whole they are three fingers to seven, and in some places more than three fingers; in Hunan the peasants say "three parts natural calamity, seven parts man-made"; in a part of the country faults and errors are the main thing, not successes; to admit faults, sum up experience and learn; to clear up the slogans of recent years, "as bold as the man, as high the yield" and the labelling of attention to objective conditions as the "theory of conditions," and the claim that "left" is better than right; the Party is to take up again the tradition of seeking truth from facts, investigate, and develop democracy within the Party and among the people; the talk is in his Selected Works)'
    units: C, D, E, F
- cite:
    id: cal.1962-01-30.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 548 (Jan. 30, 1962; Liu attends the conference''s plenary meeting at which Mao speaks: the democratic centralism of the Party must be strengthened; the understanding of the laws of socialist construction is to be deepened on the sum of experience positive and negative; Mao takes responsibility for the faults and errors of recent years)'
- cite:
    id: cal.1962-02-21.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 549 (Feb. 21–23, 1962; Liu presides at the enlarged Politburo Standing Committee meeting at Xilou on the 1962 state budget and the economy; Liu: the work conference did not bring the difficulties fully to light; "if there is a problem, who does not wish to uncover it, afraid to say all is black?"; the present is a period of recovery, unlike the three years after 1949, an abnormal period with the character of an emergency, and not to be met by normal means; Chen Yun speaks on the economic situation and ways to overcome the difficulties, Liu approving, and Liu proposes a State Council meeting at which Chen Yun speaks more fully; Feb. 26 Chen Yun gives his report "Some measures for the present financial and economic situation and for overcoming difficulties" to the Party-group members of the State Council''s departments, with Li Fuchun and Li Xiannian on industry, construction, finance, credit and the market; afterward Liu proposes that
      the Center forward Chen Yun''s and the others'' reports to the whole country)'
    units: B, C, D
- cite:
    id: cal.1962-03-13.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 550 (Mar. 12 and 13, 1962; Liu presides at the enlarged Politburo Standing Committee, which discusses and passes the Center''s comment forwarding Chen Yun''s and others'' Feb. 26 talk at the State Council Party-group members'' meeting, the Center''s urgent instruction on economy and the Center''s instruction on getting through the hard year; on the 13th it is proposed that Chen Yun be head of the Center''s finance and economics small group, and the participants agree)'
    units: A
- cite:
    id: cal.1962-03-16.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 551 (Mar. 16, 1962; Liu, with Zhou Enlai and Deng Xiaoping, goes to Wuhan to report to Mao on the Politburo Standing Committee meeting''s decisions of the 12th and 13th, to forward Chen Yun''s talk, and on the proposal that Chen Yun head the finance and economics small group; Mao agrees; the Center''s forwarding document issues the 18th and the notice naming Chen Yun group leader Apr. 19)'
- cite:
    id: cal.1962-03-21.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 552 (Mar. 21, 1962; Liu presides at the Supreme State Conference, on the opening policy of the Third Session of the Second National People''s Congress, and speaks, reporting the spirit of the enlarged Central Work Conference: the domestic situation is to be told truly; the economy has quite large difficulties, from three years of natural calamities and largely from faults and errors in work and style; investigation was insufficient, leaders listened to reports without doing their own and believed the exaggerated ones; many high targets came from above, not from the masses; the democratic centralism of the masses was hurt; he hopes all see the difficulties and the bright future, with high ideals and careful work)'
- cite:
    id: cal.1962-04-09.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 553 (Apr. 9, 1962; Liu presides at the Supreme State Conference, which hears the bulletin on what the Conference of Mar. 21 discussed)'
    units: B
- cite:
    id: cal.1962-05-07.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 554–555 (May 7–11, 1962; Liu presides at the Central Work Conference (the "May conference"), chiefly on the Finance and Economics Small Group''s report on the 1962 adjustment plan; May 7, after Li Fuchun and Li Xiannian on further reducing the town population, cutting staff, shortening the industrial front, grain and foreign exchange, Liu: if no measures are taken this year, next year''s situation will be worse; the trend, if not turned, is a very bad one and the economy will collapse)'
    units: B
- cite:
    id: cal.1962-05-11.china-leadership-2
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 555 (May 11, 1962; Liu''s closing talk: how stands the economic situation? a very difficult one, not a great one; the most difficult period has not passed in the cities and in industry; the main danger is still underestimating the difficulties; the town population is to be cut by more than twenty million, and the national economy adjusted at once; the talk is in his Selected Works as "What after all is the present economic situation?")'
    units: B, D
- cite:
    id: cal.1962-08-05.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559 (July 25–Aug. 24, 1962; Liu attends the Central Work Conference at Beidaihe; planned chiefly for agriculture, grain, commerce and the state''s support of agriculture, with groups on the draft documents for more than ten days; Aug. 6 Mao speaks to the plenary on "classes, the situation and contradictions," and six times after in the central group, criticizing the "wind of going it alone," the "wind of reversing verdicts" and the "dark wind")'
- cite:
    id: cal.1962-08-11.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559 (Aug. 11, 1962; Liu, in the central group, makes a self-criticism on the assessment of the situation at the May conference and admits that he overestimated the difficulties)'
    units: B
- cite:
    id: cal.1962-09-21.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 560 (Sept. 21, 1962; Liu, with Mao, Zhou Enlai and Deng Xiaoping, meets Nguyễn Duy Trinh, Politburo member and vice-premier of the DRV, head of the delegation)'
    units: A
- cite:
    id: cal.1962-09-24.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 560 (Sept. 24–27, 1962; Liu attends the Tenth Plenum of the Eighth Central Committee, which passes decisions on further consolidating the collective economy of the people''s communes, on the revised draft Rural People''s Commune Work Regulations, on commerce, on the planned and stepwise exchange of the chief Party and government leaders at every level, and on strengthening the Party''s supervisory organs)'
    units: A
- cite:
    id: cal.1962-10-05.vietnam-hanoi
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 561 (Oct. 5, 1962; Liu, with Mao, Zhou Enlai, Zhu De and Deng Xiaoping, meets the Vietnamese military delegation headed by Võ Nguyên Giáp)'
    units: C
- cite:
    id: cal.1962-10-18.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 562 (Oct. 18, 1962; Liu presides at the enlarged Politburo meeting, which conveys and discusses the Standing Committee''s decision on the military line toward India on the border; on the 20th the Indian army attacks in force along the border and the Chinese frontier guards strike back in self-defense and remove the strongholds the Indians had built within Chinese territory)'
    units: A
- cite:
    id: cal.1962-12-26.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 567 (Dec. 26, 1962; Liu, with Dong Biwu and Zhou Enlai, meets Tsedenbal, chairman of the Mongolian Council of Ministers; on settling the boundary: it is fixed by treaty after talks, good for both peoples; as brother neighbors on mutual respect and equality, in a spirit of mutual understanding and concession, the boundary was settled smoothly; the same principles settle China''s boundaries with other brother countries)'
    units: A
