- add:
    entry:
      id: cal.1960-02-13.china-leadership-2
      when: Feb. 13, 15, 17, 18
      date: '1960-02-13'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi presides at the Politburo meetings. They hear in turn Bo Yibo on industrial production, Li Xiannian on finance and trade, Liao Luyan on agriculture, Sun Zhiyuan on strengthening the management of materials, Liu Ningyi on trade-union work, Hu Yaobang on the Youth League and Cai Chang on women's work.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 479 (Feb. 13, 15, 17, 18, 1960). Footnotes 1–2 (479): Sun Zhiyuan, vice-chairman of the State Economic Commission; Liu Ningyi, chairman of the All-China Federation of Trade Unions. The chronology does not say which report on which day. Check: Sun Zhiyuan here and the kja entry (Third Ministry of Machine Building, from 1963). Made public: 1996. Names: Liu Shaoqi, Bo Yibo, Li Xiannian, Sun Zhiyuan.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:bo-yibo
      - name:li-xiannian
      - name:sun-zhiyuan
      - vis:only:prc
- add:
    entry:
      id: cal.1960-02-20.china-leadership
      when: Feb. 20
      date: '1960-02-20'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi drafts the Center''s approval of the Railway, Communications and Commerce ministries'' Party groups'' report on the campaign to carry goods on the way (shaojiao yunshu): all localities, departments and units are to use every empty returning car and boat for freight and passengers, and coal and ore cars standing empty near mines are to be used by industries set up there. The Center issues it Feb. 22.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 479 (Feb. 20, 1960). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1960-02-20.china-leadership-2
      when: Feb. 20
      date: '1960-02-20'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi, receiving Sándor Nógrádi, the Hungarian Ambassador, says the Soviet political economy textbook is wrong on some points: it stresses personal material incentives too much; under socialism pay by labor must be kept, but political education must go with it so that workers work for society''s and communism''s interest.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 479–480 (Feb. 20, 1960). The chronology marks it as a second item of the day (△). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:hungary
      - name:liu-shaoqi
      - vis:only:prc+hungary
