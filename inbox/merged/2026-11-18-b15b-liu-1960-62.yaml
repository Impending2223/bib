    entry:
      id: cal.1961-01-09.china-leadership-6
      when: Jan. 9
      date: '1961-01-09'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi speaks at the Central Work Conference's fifth report session. The peasants are economically very fragile, and so fragile in resisting lawlessness; this economic and political fragility easily makes trouble. Leaders at every level are to treat peasant questions with special care and make the peasants' living better.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 501 (Jan. 9, 1961). Made public: 1996. Names: Liu Shaoqi. Check: whether the same session as Mao''s meeting of the Standing Committee and the regional secretaries that day ([[cal.1961-01-09.china-leadership]]).'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-10.china-leadership-2
      when: Jan. 10
      date: '1961-01-10'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi comments on the Henan Party committee's forwarding of Ji Dengkui's report on the experience of the "cashing-in meetings" held level by level in communes such as Dawang in Lingbao county. To carry out the Center's twelve articles, the first thing is to make good the goods taken in the "communist wind", and many cadres in the one-and-two-category teams still resist it. The greatest resolve is needed at the province, prefecture, county and commune levels, with work teams sent down and a great mass movement set going, so that goods are made good before spring plowing.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 501–502 (Jan. 10, 1961). Footnote 1 (501) gives Ji Dengkui as then first secretary of the Luoyang prefectural committee. Made public: 1996. To check: Henan Party committee''s forwarding of Ji Dengkui''s "Report on the experience of the cashing-in meetings in Dawang and other communes of Lingbao county" and Liu''s comment (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 501–502). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-15.china-leadership-2
      when: Jan. 15
      date: '1961-01-15'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi, with Deng Xiaoping, receives Lawrence Louis Sharkey, general secretary of the Communist Party of Australia.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 502 (Jan. 15, 1961). Names: Liu Shaoqi, Deng Xiaoping.'
