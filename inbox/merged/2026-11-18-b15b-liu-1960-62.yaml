      date: '1961-09-13'
      thread: china-leadership
      also:
      - china
      c: 'Lushan. Liu Shaoqi reviews and revises the draft "Central Committee instruction on current industrial problems" and adds to Article 6: every state enterprise has the right to carry on independent economic accounting as the state provides.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 539 (Sept. 13, 1961). Made public: 1996. Names: Liu Shaoqi.'
