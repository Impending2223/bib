    entry:
      id: cal.1961-03-20.china-leadership-4
      when: Mar. 20
      date: '1961-03-20'
      thread: china-leadership
      also:
      - china
      c: Canton. Liu Shaoqi receives Victor George Wilcox, general secretary of the New Zealand Communist Party's national committee.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 509 (Mar. 20, 1961). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1961-03-21.china-leadership-2
      when: Mar. 21
      date: '1961-03-21'
      thread: china-leadership
      also:
      - china
      c: 'Canton. Liu Shaoqi speaks at the Central-South and North China groups of the Central Work Conference. Free markets cannot be led by administrative orders alone but by economic competition: when egg prices rise on the free market the state is to give farmers more cigarettes per egg in exchange, so the free-market price falls and the market comes under the state''s lead. Light industrial goods should go first to the countryside, to be exchanged for farm goods. Economic work is to be ever finer: grain purchase is not to be flat but graded, and pay by labor, more work more food, is to be carried through.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 509–510 (Mar. 21, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-03-25.china-leadership-3
      when: Mar. 25
      date: '1961-03-25'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi comments on the Central Committee General Office secretariat's "Reflection on the problem of rectification in Henan," which went to Tao Zhu, first secretary of the Central-South Bureau, Wang Renzhong, Hubei first secretary and bureau secretary, and Wu Zhipu, Henan first secretary and governor. The Henan rectification has struck cadres too widely; once the masses are set going, most cadres who erred are to be won back without hurting the masses' zeal, by careful work. Physical punishment is never to be used in rectification, and any instance is to be stopped at once and investigated. Bad elements mixed into the newly risen backbone are to be watched.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 510 (Mar. 25, 1961). Made public: 1996. To check: Central Committee General Office secretariat, "Reflection on the problem of rectification in Henan Province" (Mar. 25, 1961) (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 510). Names: Liu Shaoqi, Tao Zhu.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:tao-zhu
      - vis:only:prc
