      also:
      - china
      c: 'Liu Shaoqi receives the delegation of workers'' officials of the Hungarian Socialist Workers'' Party. On politics in command: it means watching the contradiction between superstructure and economic base and resolving it; it is aimed at material incentives. Pay by labor must be kept under socialism; but material incentive is a system, not a slogan, and propaganda is to preach communism, work without thought of pay, the whole and the lasting first, the personal second.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 491 (July 2, 1960). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:hungary
      - name:liu-shaoqi
      - vis:only:prc+hungary
