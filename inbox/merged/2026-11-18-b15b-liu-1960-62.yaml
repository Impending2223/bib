    entry:
      id: cal.1961-08-25.china-leadership
      when: Aug. 25
      date: '1961-08-25'
      thread: china-leadership
      also:
      - china
      c: 'Lushan. Liu Shaoqi comments on the finance and trade rectification pilot work group''s report on the "back door" in grain and commerce at Xinxiang, Henan. The tighter goods and markets, the worse the "back door": some commodities go mostly out the back and peasants cannot buy them. The grain and commercial departments are to blame, and Party and government leaders at every level too; if it is not checked, the plan to exchange goods with the peasants for farm produce and to pay workers by labor in kind will largely fail. How to stop the back door and have the state''s goods most needed by the people distributed fairly is one of the important problems of grain and the market. The comment is printed as a work conference document.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 538 (Aug. 25, 1961). Made public: 1996. To check: Finance and trade rectification pilot work group''s report on the "back door" in grain and commercial departments at Xinxiang, Henan (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 538). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-08-28.china-leadership-2
      when: Aug. 28
      date: '1961-08-28'
      thread: china-leadership
      also:
      - china
      c: 'Lushan. Liu Shaoqi interjects in Li Xiannian''s report to the Central Work Conference on market problems: if enterprises are kept so full of people they will go bankrupt, and if it is not settled the whole country will go bankrupt and collapse and the economy break down. Some factories are to be closed; they cannot lose money so.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 538 (Aug. 28, 1961). Made public: 1996. Names: Liu Shaoqi, Li Xiannian.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-10.china-leadership
      when: Sept. 10
      date: '1961-09-10'
      thread: china-leadership
      also:
      - china
      c: 'Lushan. Liu Shaoqi presides at the Central Work Conference, which hears Bo Yibo on the draft industrial enterprise regulations and Lu Dingyi on the education regulations and the rotation training of cadres. In Lu Dingyi''s report, where it comes to some Party struggle being widened, Liu interjects: the Party has again made the mistake of "cruel struggle, merciless blows," in part of its organizations, especially at the middle levels and below, below the province, fairly widely.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 539 (Sept. 10, 1961). Made public: 1996. Names: Liu Shaoqi, Bo Yibo, Lu Dingyi.'
      tags:
      - polity:prc
