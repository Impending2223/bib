      when: Aug. 1
      date: '1961-08-01'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi leaves Harbin for the Daxing'anling forest region.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 534 (Aug. 1, 1961). Made public: 1996. Names: Liu Shaoqi.'
