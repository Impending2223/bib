    entry:
      id: cal.1962-10-26.china-leadership
      when: Oct. 26
      date: '1962-10-26'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the Politburo briefing and hears Zhang Jichun, director of the State Council''s Office of Culture and Education, on the 1962 adjustment and execution in culture and education and the 1963 arrangements. The song-and-dance troupes are to be cut greatly, and are cut too little; they are not good to run, and what is to become of the children dancing and singing half-trained? For dancing there are dancing schools, for singing music schools; the troupes are to be cut. Village health: the rural health work needs a presentable hospital in each county, the hard cases to be treated there, and a part of the funds for village relief may go to medical care.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 564 (Oct. 26, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-10-27.china-leadership-3
      when: Oct. 27
      date: '1962-10-27'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the Politburo briefing and hears Han Guang, deputy director of the State Science Commission, on science and its tasks. Science must be grasped: without modernizing the research departments first the whole country cannot be modernized. On farm science: our population is three times the Soviet Union''s and four times America''s but our cultivated land is only 1.6 billion mu, fewer than theirs; Americans eat less grain and more meat than we do, ours is enough; so mountains and forests and wild plants are to be developed greatly, livestock raising too. On certificates and prizes for invention: a little bonus is also needed; besides politics, some material stimulus.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 564 (Oct. 27, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-10-31.china-leadership-2
      when: Oct. 31, Nov. 1
      date: '1962-10-31'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi presides at the Politburo briefings and hears Li Fuchun, vice-premier, on the 1963 national economic plan, and Gu Zhuoxin, deputy director of the State Planning Commission, on capital construction. The economy has begun to turn, but work must still be kept tight.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 564 (Oct. 31, Nov. 1, 1962). Made public: 1996. Names: Liu Shaoqi, Li Fuchun.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:li-fuchun
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-02.china-leadership-3
      when: Nov. 2
      date: '1962-11-02'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the Politburo briefing and hears Li Xiannian on national finance. On expenditure, city upkeep should include repairing houses; cities know only how to build new houses and not to mend old, which is like enlarging reproduction without simple reproduction; he proposes an urban construction ministry to manage houses, repairs and all city construction, taking in the rent; the Center and the budgets have not looked after it, and all old houses henceforth are to be repaired and every builder is to collect rent. On credit: watch the balance of credit receipts and payments, which in the past was not watched; when imbalance, a deficit or inflation is found, report at once and take measures; this is where leaks have come.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 564–565 (Nov. 2, 1962). Made public: 1996. Names: Liu Shaoqi, Li Xiannian.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-03.china-leadership-3
      when: Nov. 3
      date: '1962-11-03'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi convenes the responsible officials of the forestry work in Heilongjiang, Jilin and Inner Mongolia. Timber prices are to be set properly: for big timber, the exit price down and the selling price up; for small, the exit price up and the selling price down, so that price promotes production and thrift in timber. A way is to be found for the replanting of the large area of felled land: first, natural renewal; second, artificial promotion; third, sowing by hand and transplanting. The forestry academy is to study them and the allocation of timber, now that they allot timber unused, as when ice-lolly sticks are cut from big timber.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 565 (Nov. 3, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
