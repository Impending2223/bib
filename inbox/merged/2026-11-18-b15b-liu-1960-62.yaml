      when: Aug. 8
      date: '1961-08-08'
      thread: china-leadership
      also:
      - china
      c: Harbin. Liu Shaoqi hears the leading group of the Northeast and Inner Mongolia forestry work conference and members of the Heilongjiang committee's secretariat on work, and visits the Northeast Forestry Institute (now Northeast Forestry University) and its experimental forest.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 535–536 (Aug. 8, 1961). Made public: 1996. Names: Liu Shaoqi.'
