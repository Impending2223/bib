- add:
    entry:
      id: cal.1961-01-20.china-leadership-3
      when: Jan. 20
      date: '1961-01-20'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi hears Liu Lantao, first secretary of the Northwest Bureau, and the first secretaries Zhang Desheng (Shaanxi), Zhang Zhongliang (Gansu), Wang Feng (Ningxia), Gao Feng (Qinghai) and Wang Enmao (Xinjiang) on their work. Cadres' level is a matter of tying theory to practice; Marxism-Leninism's universal truth fits different places, masses, cadres and times. Leaders should do typical investigations and keep a style of talking things over with the masses. Where leaders back a good style the cadres take it up, and it outlives them; if they back a bad one the old cadres go bad and new ones cannot grow.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 502–503 (Jan. 20, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-21.china-leadership-2
      when: Jan. 21
      date: '1961-01-21'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi hears Zhang Dingcheng, procurator-general of the Supreme People's Procuratorate, on its work. Lawlessness has come to light, in Xinyang in Henan, Tianshui in Gansu, and some places in Shandong and Guizhou; the procuratorates are to check it, not to be weakened but strengthened.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 503 (Jan. 21, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-27.china-leadership-5
      when: Jan. 27
      date: '1961-01-27'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi talks with Gong Zirong, deputy director of the Central Committee General Office, and others on handling people's letters and visits. Letters touching many people or policy are for the Party committee to decide, some for the Center; no office may examine, hold or pursue a letter, even a counterrevolutionary one, at will; reprisal against letter-writers occurs because the level above does not answer and passes the letter down to the accused, and it kills people. Staff should learn from Bao Zheng, take typical cases and see them through.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 503 (Jan. 27, 1961). Footnote 1 (503) is a gloss on Bao Zheng (Song official); it names no work. Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01.china-leadership-4
      when: Jan., last ten days
      date: 1961-01
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi reviews the Central Committee's notice on strengthening the management of commercial networks, adding after the sentence that points removed or men cut too far must be resolutely restored that later adjustments of unreasonable shops in old city districts need the city committee's unified leadership, overall planning and the masses' agreement and are not to be handled at will. The comment is issued as a Center document Jan. 28.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 503–504 (Jan., last ten days, 1961). Check: the day; the chronology gives the last ten days (下旬) and the issue on the 28th. Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
      at: after 1961-01-20
- add:
    entry:
      id: cal.1961-01-29.china-leadership
      when: Jan. 29
      date: '1961-01-29'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi drafts the Center''s comment forwarding the Hubei Party committee''s summary report on the second stage of the rectification of communes at Tonghaikou commune, Mianyang county, directed at the "five winds": every area where the five winds are serious is to rectify by the Tonghaikou method, mainly democratic education and class education.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 504 (Jan. 29, 1961). Footnote 1 (504) glosses the "five winds": the communist wind, exaggeration, cadres'' privilege, blind command and coercive command, which arose in the Great Leap Forward and communization; it names no work. Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-04.china-leadership-4
      when: Feb. 4
      date: '1961-02-04'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi drafts the Center's comment forwarding three documents of the Henan Party committee and the Luoyang prefectural committee on cashing in the policies. Dismantling the goods taken in the "communist wind" is hard in the one- and two-category teams and meets resistance and much false show; correcting commandism and privilege is hard too, as the Tonghaikou experience shows. For the Center's policies to be honored there must be firm leadership, a full mobilization of the masses and reliance on poor and lower-middle peasants, and after several hard struggles all power must go to the representative assemblies.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 504 (Feb. 4, 1961). Made public: 1996. To check: Henan Party committee''s forwarding of the Luoyang prefectural committee''s two reports on carrying out the Center''s twelve articles; the Luoyang prefectural committee and Lingbao county committee rectification work group''s second bulletin on the Dawang commune''s experience of cashing in policy; the Luoyang prefectural committee''s report on cashing in the twelve articles (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 504 n.2a–c). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-06.china-leadership-3
      when: Feb. 6
      date: '1961-02-06'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi receives a Nicaraguan cultural delegation and a Costa Rican cultural friendship delegation. China's enemies in the revolution were imperialism abroad and feudalism, the landlord class and the comprador bourgeoisie at home, chiefly imperialism; the revolution won, the country is building, but is still behind in economy and culture and means to catch up.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 504–505 (Feb. 6, 1961). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:nicaragua
      - polity:costa-rica
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1961-02-08.china-leadership-3
      when: Feb. 8
      date: '1961-02-08'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi, receiving Paul Wandel, the German Democratic Republic's ambassador to China, says China copied the Soviet Union in the first Five-Year Plan, having no experience. From 1958 it used some methods the Soviet Union did not; 1958 was fast on all sides and the contradictions came out and brought hardship; the way to socialist construction suited to China will be found, by the third and fourth plans.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 505–506 (Feb. 8, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:gdr
      - name:liu-shaoqi
      - vis:only:prc+gdr
- add:
    entry:
      id: cal.1961-02-10.china-leadership-2
      when: Feb. 10
      date: '1961-02-10'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi drafts the Center''s comment forwarding the Central-South Bureau''s instruction on Li Li''s report on how Panyu county committee should do its general-front work: in rectifying the communes, besides the key teams, attend at once to the general front, set the policies'' first cashing-in going quickly, raise the masses'' zeal and bring a high tide of preparation for spring plowing.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 506 (Feb. 10, 1961). Footnote 1 (506) gives Li Li as then head of the Central-South Bureau''s Organization Department. Made public: 1996. To check: Central-South Bureau''s instruction on Li Li''s report on Panyu (Fanyu) county committee''s general-front work (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 506). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-10.china-leadership-3
      when: Feb. 10
      date: '1961-02-10'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi sends the Hebei Party committee a report written by a Central Committee General Office staff member after a deep investigation in Hebei, and writes to Liu Zihou, its secretary and the province''s governor: some cadres seal off the Center''s policies from the masses and attend to no production, and go on in lawless acts; where the masses are not set going, nor the policies put to them openly, nothing will change.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 506 (Feb. 10, 1961). The chronology marks it as a second item of the day (△). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-10.china-leadership-4
      when: Feb. 10
      date: '1961-02-10'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi comments on an article in *Gong''an gongzuo jianbao* (Public security work bulletin) 1961 no. 8, on the Hunan Public Security Department''s opinion on handling the Liu Guiyang case: he agrees with it, and suggests the Hunan provincial committee have Zhang Pinghua talk with her himself, encouraging her to report rural conditions to the Center and criticizing her view of the communes and her methods. The Center issues the comment Feb. 14.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 506–507 (Feb. 10, 1961). The chronology marks it as a second item of the day (△). Footnote 2 (506) describes the case: Liu Guiyang, a woman, then a temporary worker at an electric plant in Chen county, Hunan, posted slogans against the communes outside the State Council''s north gate in Peking in Sept. 1960 and was sentenced by the county court to five years; the Hunan department held that the motive was not to overthrow the people''s democratic power and the case could be treated as a matter among the people. Footnote 3 gives Zhang Pinghua as then Hunan first secretary. Neither names a work. Made public: 1996. To check: *Gong''an gongzuo jianbao* 1961 no. 8, the article on the Hunan Public Security Department''s opinion on the Liu Guiyang case; the Center''s document of Feb. 14, 1961 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 506). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-12.china-leadership-2
      when: Feb. 12
      date: '1961-02-12'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi receives the Nepalese members of the China–Nepal boundary joint committee, headed by Major General Padma Bahadur Khatri. China will never oppress or bully weak small states: the nature of the state and Party forbids it, and a Communist-led state that invaded or oppressed others would be neither Communist nor socialist.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 507 (Feb. 12, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:nepal
      - name:liu-shaoqi
      - vis:only:prc+nepal
- add:
    entry:
      id: cal.1961-02-26.china-leadership-3
      when: Feb. 26
      date: '1961-02-26'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi drafts the Center''s comment forwarding "The experience of the rectification of the communes in Tantian commune, Zhongshan county, Guangdong": spring plowing is at hand or begun, and rectification is to be done in time with production at the center; when plowing starts, see to the plowing first and use the slack between farm jobs for rectification. It is to be carried through by stages and groups, and must not hold up present farm production.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 507 (Feb. 26, 1961). The commune is printed 坦田. Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
