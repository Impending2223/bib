      - china
      c: 'Liu Shaoqi reads the Finance Ministry''s report "Why Peking Iron and Steel Plant has to run large losses this year," which shows a plant whose production plans far exceeded the state''s targets, making losses year after year that nearly wipe out the state''s investment, and comments, to be read by Peng Zhen and Liu Ren: if state factories go on like this, what will come of it; can it not mean ruin?'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 549–550 (Feb. 26, 1962). Made public: 1996. To check: Finance Ministry, "Why Peking Iron and Steel Plant has to run large losses this year" (Feb. 1962) (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 549). Names: Liu Shaoqi, Peng Zhen.'
