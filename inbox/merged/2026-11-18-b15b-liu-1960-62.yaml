      - china
      c: 'Shanghai. Liu Shaoqi speaks to the national on-the-spot conference on technical innovation and technical revolution in the machinery industry. The nationwide movement has found a Chinese road, the mass line joining experts, masses and cadres. Production relations must be adjusted as the movement grows: wage systems, the trusts, comprehensive companies; leading cadres to take part in production; leave some reserve of the masses'' zeal; materials allocation to go by areas, as the commercial departments run living supplies.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 486–487 (May 26, 1960). Made public: 1996. Names: Liu Shaoqi.'
