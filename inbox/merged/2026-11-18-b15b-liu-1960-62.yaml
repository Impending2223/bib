- add:
    entry:
      id: cal.1960-02-11.china-leadership-2
      when: Feb. 11
      date: '1960-02-11'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the Politburo meeting. It takes up the Education Ministry Party group''s reports on the titles and duties of college teachers and their treatment, and on 1960 pay for full-day primary and middle school teachers (both issued Mar. 7). It hears Li Weihan and Xu Dixin of the United Front Work Department on the second congress of the China Democratic National Construction Association and the third congress of the All-China Federation of Industry and Commerce. Liu: most of the bourgeoisie are willing to be remolded; as they draw close, the Party will relax toward them in thought, work, living and political care, and keep them to the end.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 478 (Feb. 11, 1960). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1960-02-12.china-leadership-3
      when: Feb. 12
      date: '1960-02-12'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi receives the delegates to the second congress of the China Democratic National Construction Association and the third congress of the All-China Federation of Industry and Commerce, and talks with their leaders Huang Yanpei, Chen Shutong, Sheng Pihua, Hu Ziang, Sun Qimeng, Hu Juewen and Shi Fuliang. Some fear the government will not look after the industrialists. Liu: those who accept remolding, work for the state and cooperate with the Party will be looked after in livelihood to the end; they must also advance in thought.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 478–479 (Feb. 12, 1960). Footnotes 1–3 (478) give the posts of Chen Shutong (chairman, Federation of Industry and Commerce), Sheng Pihua, Hu Ziang, Sun Qimeng (vice-chairmen of the Association and of the Federation) and Hu Juewen, Shi Fuliang (vice-chairmen of the Association). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
- add:
    entry:
