- add:
    entry:
      id: cal.1960-03-28.china-leadership-2
      when: Mar. 28
      date: '1960-03-28'
      thread: china-leadership
      also:
      - china
      c: 'Tianjin. Liu Shaoqi hears the Hebei Party committee on its work. Agriculture is the base and every sector must support it; 80 percent of the people work to feed the country, so the technical revolution in farming must be done well. The "equalize and transfer" (yiping erdiao) and "communist wind" are wrong: transition to communism cannot be skipped, the change in relations of production must open the way to productive forces, and transition too early hurts them. The materials and trade departments are to be joined. That evening he returns to Peking.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 482 (Mar. 28, 1960). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
