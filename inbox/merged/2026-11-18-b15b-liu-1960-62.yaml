      - china
      c: Liu Shaoqi presides at the Politburo meeting. It approves the Guangdong Party committee's instruction on some problems in current people's commune work, the Guizhou committee's report on the rural public mess halls and the Jilin committee's report on the technical-innovation and technical-revolution movement.
