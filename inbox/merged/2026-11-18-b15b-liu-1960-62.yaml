    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 497 (Dec. 3, 1960; Liu visits the Hermitage in the Winter Palace and the Kirov works, and speaks at the mass welcome meeting in the works'' tenth shop)'
    units: B, D
- cite:
    id: cal.1960-12-03.soviet-union-2
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 497 (Dec. 4, 1960; Liu visits the cruiser *Aurora* and the Smolny and tours the city by car; meets the Chinese students and trainees there; speaks at the banquet of the Leningrad Party committee and the city soviet''s executive committee: Leningrad the cradle of the October Revolution, which brought Marxism-Leninism to China; then leaves for Minsk)'
    units: B, E
- cite:
    id: cal.1960-12-19.china-leadership-3
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 499 (Dec. 19, 1960; Liu attends the signing and signs the joint statement)'
    units: B
- cite:
    id: cal.1960-12-19.china-leadership-4
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 499 (Dec. 19, 1960; Liu attends the capital''s mass meeting welcoming Sihanouk and marking the treaty''s signing)'
    units: B
