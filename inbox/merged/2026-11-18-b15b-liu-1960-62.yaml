      c: 'Liu Shaoqi comments on an item in the Commerce Ministry''s *Shangye gongzuo jianbao*, "Serious shortage of firewood and coal for the masses in some rural areas": the commercial organs of the Center and the localities cannot leave the masses'' firewood alone, or production is hurt; but how to manage it must be studied.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 550 (Mar. 5, 1962). The chronology marks it as a second item of the day (△). Made public: 1996. Names: Liu Shaoqi.'
