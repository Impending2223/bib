    entry:
      id: cal.1962-04-17.china-leadership-3
      when: Apr. 17
      date: '1962-04-17'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi hears the Central Committee General Office''s materials investigation group, back from Shijiazhuang, on materials work. Materials management is no special department but a comprehensive one; it is also a commercial department and should follow the commercial departments'' way: if commerce can supply 600 million people, can it not supply 210,000 enterprises? Men who know technology are to be drawn to fill out the materials ranks.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 553 (Apr. 17, 1962). Made public: 1996. Names: Liu Shaoqi.'
