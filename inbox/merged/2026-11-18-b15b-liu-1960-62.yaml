      when: Mar. 14
      date: '1961-03-14'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi flies from Peking to Canton.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 508 (Mar. 14, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
