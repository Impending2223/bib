      c: Wangjiawan. Liu Shaoqi hears the Central Committee work group and the Hunan provincial committee's work teams on rural conditions.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 510 (Apr. 4–7, 1961). Made public: 1996. Names: Liu Shaoqi.'
