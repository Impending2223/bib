    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 483 (Apr. 4, 1960; Liu presides at the Politburo meeting on the State Planning Commission Party group''s key points of the supplementary plan for 1960–62 and Tan Zhenlin''s report to the Congress)'
    units: A
- cite:
    id: cal.1960-06-01.china-leadership
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 487 (June 2, 1960; Liu presides at the public funeral of Lin Boqu)'
    units: C
- cite:
    id: cal.1960-08-10.china-leadership-2
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 492 (Aug. 10, 1960; Liu presides at the plenary session and speaks, summing up: the capital construction line compressed, agriculture put first for some years at least and industry to serve it; cadres'' labor, education joined to labor and a small gap between top and bottom pay to be kept up and handed down)'
    units: B
- cite:
    id: cal.1960-09-07.china-leadership-4
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 493 (Sept. 7, 1960; Liu with Mao, Zhou Enlai and Zhu De)'
    units: A
- cite:
