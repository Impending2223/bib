      id: cal.1962-04-16.china-leadership-2
      when: Apr. 16
      date: '1962-04-16'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi writes to Mao Zedong: he asked Deng Xiaoqun to find Chen Yun''s views on economic work of the past years, and has an abstract made; he sends it for Mao to read. Chen Yun''s talk to the Finance and Economics Small Group of Mar. 7 also has some very important views and is well worth reading. The General Office is sending these papers to the Standing Committee, the Secretariat and the small group''s members; whether to send them to others is for Mao to decide, and Chen Yun''s views to be asked again.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 553 (Apr. 16, 1962). Made public: 1996. To check: Abstract of Chen Yun''s views on economic work of recent years, and his talk to the Finance and Economics Small Group of Mar. 7, 1962 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 553). Names: Liu Shaoqi, Mao Zedong, Chen Yun.'
