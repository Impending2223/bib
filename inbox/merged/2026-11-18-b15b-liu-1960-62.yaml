      when: Aug. 13
      date: '1961-08-13'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi receives the credentials of Ceylon's new ambassador (阿尔温·伯纳德·佩雷拉 in the chronology, Perera). Ceylon is not large but can play a part in world affairs; China welcomes a conference of nonaligned states, which may help world peace and national liberation; Western states, who want the contrary, will find it hard to oppose either; national liberation and independence can be won by different means.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 536 (Aug. 13, 1961). Made public: 1996. Names: Liu Shaoqi.'
