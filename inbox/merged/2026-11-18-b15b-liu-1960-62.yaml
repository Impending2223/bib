      when: May 8
      date: '1961-05-08'
      thread: china-leadership
      also:
      - china
      c: Tanzichong. Liu Shaoqi visits the commune members in the temporary hospital of Tanzichong brigade, and calls on his elder sister Liu Shaode at Zhaojiachong.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 521 (May 8, 1961). Made public: 1996. Names: Liu Shaoqi.'
