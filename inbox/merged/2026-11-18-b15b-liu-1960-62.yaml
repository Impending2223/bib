    entry:
      id: cal.1961-05-09.china-leadership-5
      when: May 9
      date: '1961-05-09'
      thread: china-leadership
      also:
      - china
      c: Tanzichong. Liu Shaoqi talks with the Huaminglou commune rectification work team. Democracy is not to be bestowed; it is fought for. Some cadres say the higher level forbids speaking but do not fight for democracy themselves, and fear the masses. That the masses call the team "clear skies" (qingtian) shows it has done some good, but it is the team freeing the masses, not the masses freeing themselves; if the team too were "Lord Clear Sky" it would be no good and the mass line not followed. In the afternoon he inspects the Huangcai reservoir on the way back to Ningxiang county town, and is there in the evening.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 521 (May 9, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-10.china-leadership-3
      when: May 10
      date: '1961-05-10'
      thread: china-leadership
      also:
      - china
      c: Ningxiang. Liu Shaoqi hears the head of the Hunan Public Security Department on the department's work.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 521 (May 10, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-11.china-leadership-3
      when: May 11
      date: '1961-05-11'
      thread: china-leadership
      also:
      - china
      c: 'Ningxiang. Liu Shaoqi hears the Central Committee investigation group on commerce. Socialist trade should be done better than capitalist: goods turned over fast, costs and losses low, distribution fairer, convenient to the masses. The supply and marketing cooperatives in the villages are bound to be restored, not as a simple return to the old, but as collective commerce suited to commune, brigade and team production and serving their family sidelines and the people''s living.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 522 (May 11, 1961). The chronology marks it as a second item of the day (△). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-12.china-leadership-2
      when: May 12
      date: '1961-05-12'
      thread: china-leadership
      also:
      - china
      c: Ningxiang. Liu Shaoqi hears the Central Committee investigation group on handicrafts. The handicraft cooperatives' passage to ownership by the whole people was too fast; what was taken over is to be returned, the cooperatives restored, with their own basic accounting as before, and their products not levelled and transferred but exchanged at equal values. That evening he goes to Changsha.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 522–523 (May 12, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-13.china-leadership-3
      when: May 13
      date: '1961-05-13'
      thread: china-leadership
      also:
      - china
      c: 'Changsha. Liu Shaoqi hears the Xiangyin county committee on rectifying the communes. Peasants'' interests are not to be taken; restitution is to be thorough, but not all in money: goods, to help production and living. On "dividing the land to households": say plainly it is wrong and educate the masses; production is collective, and private plots, field margins and bank slopes are the members'' own. The work team is not to bestow favors; the masses call it "Bao Qingtian" and Liu thinks they are criticizing it. Cadres cannot be left without the mass line for want of skill; they are to be taught.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 523 (May 13, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-15.china-leadership-2
      when: May 15
      date: '1961-05-15'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi leaves Changsha for Peking. At Zhengzhou he hears the Henan Party committee's officials on their work; the key to doing it well is to rely on the masses and follow the mass line, which protects most of the masses' views and can withstand wrong command from above.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 523 (May 15, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-16.china-leadership
      when: May 16
      date: '1961-05-16'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi returns to Peking.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 524 (May 16, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-24.china-leadership-2
      when: May 24
      date: '1961-05-24'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi speaks at the third group (Central-South and North China) of the Central Work Conference on the draft Rural People''s Commune Work Regulations. Right opportunism is the main danger, and has been fought some years; since the Zhengzhou meeting the practice in the villages was in truth to oppose "left" errors, the Lushan meeting also touched it but did not make a slogan of it. Whether to put forward the slogan against "left" now is for consideration. Experience is rich but experience of building socialism is short: in farming, the field crops on one side and family sidelines, pigs and hens on the other, and abolishing private plots was a large mistake which lowered production and living and hurt industry. The whole Party, all cadres and people have gone hungry, a deep lesson.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 524 (May 24, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-03.china-leadership-3
      when: June 3
      date: '1961-06-03'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi reviews the draft "Central Committee instruction on running Kangda-style political schools to train a batch of intellectual youth of the revolution for work in the villages," drawn up by the Central Committee''s culture and education group, and adds at the start: to teach the peasants by the socialist spirit, so that they grow into builders of socialism of their own accord, is the most important historic task of the Party. The Central Work Conference discusses it and the Center issues it June 23.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 525 (June 3, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-06.china-leadership-5
      when: June 6
      date: '1961-06-06'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi presides at the plenary meeting of the Central Work Conference and hears Zhou Enlai explain the "Nine measures on reducing the urban population and compressing the sales of grain in towns."
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 525 (June 6, 1961). Made public: 1996. Names: Liu Shaoqi, Zhou Enlai.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-08.china-leadership-6
      when: June 8
      date: '1961-06-08'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi, with Deng Xiaoping, talks with Aidit and the Indonesian Communist Party's delegation. Among so many states and parties, and a world so complex, full agreement on every question is impossible; different views and positions are to be allowed, discussed, adjusted and respected; where they differ, not argued in public meetings or censured openly. Brother parties may discuss; if agreement comes, good; if not, set aside for later. In no case may one interfere in another brother party's internal affairs.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 525–526 (June 8, 1961). Made public: 1996. Names: Liu Shaoqi, Deng Xiaoping, Aidit.'
      tags:
      - polity:prc
      - polity:indonesia
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:aidit-dipa-nusantara
      - vis:only:prc+indonesia
- add:
    entry:
      id: cal.1961-06-09.china-leadership-3
      when: June 9
      date: '1961-06-09'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi, receiving the German Democratic Republic's ambassador (黑根 in the chronology), says China is taking measures to encourage the working people's zeal. The farm harvest affects the whole economy; with so many people China cannot rely on buying grain abroad; it plans to buy five million tons of grain this year, a great quantity but little for such a country, and still not enough. It is considering moving some industrial and other population to the villages.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 526 (June 9, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:gdr
      - name:liu-shaoqi
      - vis:only:prc+gdr
- add:
    entry:
      id: cal.1961-06-17.china-leadership-3
      when: June 17
      date: '1961-06-17'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi comments, for Li Xiannian, on a report of how Fulin commune in Changsha county handled cadres'' privilege and back-door dealing: take a few provinces, counties, communes and brigades, publish the commodity accounts from top to bottom, check them closely, to learn how goods were distributed before and how to improve distribution. In the past year and more the commercial and grain departments, besides other errors, made many extreme errors of cutting loose from the masses in the distribution of goods; you and we are still not clear on it, and it must be cleared up and the errors resolutely corrected.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 526–527 (June 17, 1961). Made public: 1996. Names: Liu Shaoqi, Li Xiannian.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-30.china-leadership-3
      when: June 30
      date: '1961-06-30'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi receives the credentials of Kai Bahadur (凯·巴哈杜尔), Nepal's new ambassador. China is a backward country and has much to do; it wants good relations with its neighbors and every country, on equality and mutual respect and aid, never harm; it has no conflict of interest with others, only with the United States, which occupies Taiwan; if America quits Chinese territory and withdraws the Seventh Fleet there will be no conflict.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 527–528 (June 30, 1961). The chronology marks it as a second item of the day (△). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:nepal
      - vis:only:prc+nepal@B-E
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1961-07-10.china-leadership-5
      when: July 10
      date: '1961-07-10'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi reads the Hunan Public Security Department''s report of June 30, "Investigation report on the case of Feng Guoquan, a member of Tianhua brigade, Guangfu commune, Changsha county, said to have destroyed a plow ox," and writes to Xie Fuzhi, Minister of Public Security: wrongful cases like Feng Guoquan''s still exist elsewhere, and public security organs everywhere are to investigate and study them seriously and reach conclusions that fit the facts.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 518 (July 10, 1961). Made public: 1996. To check: Hunan Public Security Department, "Report on the investigation of the case of Feng Guoquan, member of Tianhua brigade, Guangfu commune, Changsha county, alleged to have destroyed a plow ox" (June 30, 1961), sent to the Hunan Party committee and the Ministry of Public Security (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 518). Names: Liu Shaoqi, Xie Fuzhi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:xie-fuzhi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-12.china-leadership-4
      when: July 12
      date: '1961-07-12'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi hears Luo Yuchuan, Zhang Zhao and Yang Yansen, vice-ministers of forestry, on forestry in Heilongjiang, Jilin and Inner Mongolia. As many trees as are cut are to be planted, and planting is the root policy; the replanted forest must be larger than the old; China's forests are few, to be used so as to last forever. Old cutting and new planting together; "if we ruin the forests we shall be judged after we die."
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 529 (July 12, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-14.china-leadership-3
      when: July 14
      date: '1961-07-14'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi, receiving R. K. Nehru, Secretary-General of India''s Ministry of External Affairs, says the people''s communes: whether they help farm production or not, three years of trial show some problems and faults, unavoidable in any historic undertaking; the trial period is at least ten years more before a summing up. The peasants themselves joined the advanced cooperatives into communes, hoping for better farming; China''s task is to set concrete policies and methods so that the communes develop normally.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 529 (July 14, 1961). Made public: 1996. Names: Liu Shaoqi, R. K. Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:liu-shaoqi
      - name:nehru-r-k
      - vis:only:prc+india
- add:
    entry:
      id: cal.1961-07-14.china-leadership-4
      when: July 14
      date: '1961-07-14'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi drafts the Center''s comment forwarding Zhang Dingcheng''s report on his investigation in the Minxi (western Fujian) region: the seriousness of the rural situation, and the difficulty of turning it and the whole national economy, must be fully reckoned with, and cautious steps suited to conditions taken seriously, a long effort being needed to turn it fully. The comment was not issued, Deng Xiaoping having already forwarded the report to the Fujian provincial committee and the East China Bureau.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 529–530 (July 14, 1961). The chronology marks it as a second item of the day (△). Footnote 1 (530) says Deng Xiaoping had forwarded the report to the Fujian committee and the East China Bureau before this, and Liu''s comment was not issued. Made public: 1996. To check: Zhang Dingcheng''s report on his investigation in the Minxi region, Fujian, and Deng Xiaoping''s forwarding of it to the Fujian committee and the East China Bureau (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 530 n.1a). Names: Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-15.china-leadership-2
      when: July 15
      date: '1961-07-15'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi, after reading the Changsha county people''s court''s report on people''s tribunal work, writes to Peng Zhen, Xie Fuzhi, Xie Juezai and Zhang Dingcheng: the report is very good; the Center''s small group should discuss it and, better, try it in other places, to sum up further. A great part of the public-order work cannot be left alone by the Party committees and governments, which can only manage it through the political and legal organs; what form and method they use is to be settled in practice; a little over a month''s experience in Changsha shows the way to solve it.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 530 (July 15, 1961). Footnote 2 and 3 (530) give Peng Zhen (Politburo member, Secretariat first secretary, vice-chairman and secretary-general of the NPC Standing Committee) and Xie Juezai (president of the Supreme People''s Court). Made public: 1996. To check: Changsha county people''s court, report on the work of the people''s tribunals (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 530). Names: Liu Shaoqi, Peng Zhen, Xie Fuzhi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:peng-zhen
      - name:xie-fuzhi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-16.china-leadership-2
      when: July 16
      date: '1961-07-16'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi leaves Peking to inspect the Northeast.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 530 (July 16, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-17.china-leadership-4
      when: July 17
      date: '1961-07-17'
      thread: china-leadership
      also:
      - china
      c: Shenyang. Liu Shaoqi hears the Northeast Bureau's officials on their work. Some now have doubts, grievances and complaints and ask to speak; let them, and do not stop them for a doubt. The three red banners may be doubted a few years, but difficulties are not to be used to make trouble; make an effort and unite to get past them. The people's communes have advantages; what was lost was the advanced cooperatives' set of ways, egalitarianism, supply, mess halls; with the advanced cooperatives kept the communes could have more. If the advantages are not seen, it is hard to persuade the peasants; when the economy recovers in three or five years the communes will show more, and then the argument will be with facts. Forestry needs long-range planning, or the resource is ruined, and cutting methods need study.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 530–531 (July 17, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-18.china-leadership
      when: July 18
      date: '1961-07-18'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi leaves Shenyang for Harbin.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 531 (July 18, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-19.china-leadership-2
      when: July 19
      date: '1961-07-19'
      thread: china-leadership
      also:
      - china
      c: 'Harbin. Liu Shaoqi inspects the Harbin boiler plant, the turbine plant and the electrical machinery plant, and hears the Heilongjiang committee''s first secretary Ouyang Qin and Li Fanwu on agriculture and forestry. On forestry: piece-rate for felling, hauling and tree planting; contracting in several forms, including the collective, the individual and the "big army campaign" (against planting). On ownership: do not run three kinds together, or the economy is dead; a state enterprise cannot be levelled; accounts must be settled to firm up ownership. On the three red banners: doubts are understandable, given the setbacks of the Leap and the communes'' advantages being less plain; do not boast of the advanced cooperatives'' advantages, and keep them where there is no better. On investigation: not only the problem but the way to solve it, agreed by the locality; investigate one typical case, revisit it after two or three years.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 531 (July 19, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-20.china-leadership
      when: July 20
      date: '1961-07-20'
      thread: china-leadership
      also:
      - china
      c: 'Harbin. Liu Shaoqi talks with members of the Heilongjiang committee''s secretariat on forestry: small timber could be priced higher and prices set by dense or sparse forest; workers could be paid by output as in a piece-rate system, so that the more they produce the more they earn; selling prices to differ by quality and the processing needed. He then leaves Harbin for Xiaoxing''anling, and hears the head of the Dailing forestry experiment bureau on its work.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 531–532 (July 20, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-21.china-leadership-2
      when: July 21
      date: '1961-07-21'
      thread: china-leadership
      also:
      - china
      c: Xiaoxing'anling. In rain, Liu Shaoqi inspects the Liangshuigou experimental forest farm's artificial young forest and arboretum, of the Dailing forestry experiment bureau.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 532 (July 21, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-22.china-leadership
      when: July 22
      date: '1961-07-22'
      thread: china-leadership
      also:
      - china
      c: Xiaoxing'anling. Liu Shaoqi inspects the Shengli forest farm and watches chain-saw felling and tractor hauling. In the evening he convenes the bureau's heads and workers' delegates on timber felling and forest planting.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 532 (July 22, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-23.china-leadership-2
      when: July 23
      date: '1961-07-23'
      thread: china-leadership
      also:
      - china
      c: Xiaoxing'anling. Liu Shaoqi convenes a forum of heads of part of the Dailing forestry system. All work follows the mass line and hears opinions, even one-sided ones, which may have a one-sided reason; less commandism; not everything is to be an instruction, and there is to be a lively political situation. He then leaves for the Fenglin forestry bureau (now Wuying), hearing on the way the Yichun city committee on forestry.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 532 (July 23, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-24.china-leadership-2
      when: July 24
      date: '1961-07-24'
      thread: china-leadership
      also:
      - china
      c: 'Fenglin forestry bureau. Liu Shaoqi sees the primeval red-pine forest, the Fourth Forest Farm and felling with tractor hauling, and the small forest railway. To the bureau''s heads: the Party committee leads the large things, not the small; it cannot escape the daily business and the factory director''s responsibility under the committee''s leadership is gone; leadership is to be strengthened; workers'' participation in management is only participation and does not replace management. Good old systems are to be restored; the sign of good management is that felling, planting, hauling, loading are done, labor productivity rises, costs fall, quality rises, materials are saved; wages go by checking attendance, and "more work worse than less" is to be corrected.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 532 (July 24, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-25.china-leadership-3
      when: July 25
      date: '1961-07-25'
      thread: china-leadership
      also:
      - china
      c: 'Yichun. Liu Shaoqi inspects the Yichun timber processing plant, and at a meeting of the city''s forestry cadres says: use the forest resources fully, meet the needs of the state and every side as far as can be, and tie resources to needs; that is the work, from the Ministry of Forestry down to the forest farm. Wages and prices are to be adjusted together: buying prices high for small logs (for the labor) and cheap for big (labor saved); selling prices by grade, dearer for big logs; wages to follow buying prices. Good rules are to be restored; felling and regeneration are to be joined, artificial regeneration by contract to the farms, work sections, groups and families.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 533 (July 25, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-26.china-leadership-3
      when: July 26
      date: '1961-07-26'
      thread: china-leadership
      also:
      - china
      c: Hegang. Liu Shaoqi hears the Hegang city committee and the Hegang mining bureau's heads on their work. On mine safety, systems, the technical ones above all, must make engineers and technicians responsible; they know how a mine is opened and how to organize continuous production without accident, and they should have a great say. He then reaches Jiamusi and inspects the Jiamusi paper mill.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 533 (July 26, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-27.china-leadership
      when: July 27
      date: '1961-07-27'
      thread: china-leadership
      also:
      - china
      c: Mudanjiang. Liu Shaoqi inspects the Jingpohu power station, an artificial red-pine forest and a ginseng nursery, tours Jingpohu lake and visits a geological prospecting team resting there. On the 29th he hears the head of the Dongjingcheng forestry bureau at Jingpohu on its work and urges trials of mixed planting of conifers and broadleaf trees and of artificial regeneration.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 533 (July 27, 1961). Made public: 1996. Names: Liu Shaoqi.'
