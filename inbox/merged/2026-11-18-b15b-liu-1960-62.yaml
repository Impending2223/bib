      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-07-18.china-leadership-2
      when: July 18
      date: '1962-07-18'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi receives the bureau chiefs and higher cadres of the Central Committee''s departments and the state organs who are being sent down to the main grain-producing areas, and gives them five tasks: strengthen the prefectural, county and basic-level leadership; carry out the Center''s correct policy; report conditions as they are; change the incorrect style of some local Party organizations; consolidate the collective economy and develop farm production. Policy is made by the Center, which alone may decide it; a place with special conditions may make its own policy, but it must be decided and approved by the Center. A policy carried out well or ill, wholly or in part, mechanically or by truth from facts, makes a great difference; a market divided into closed districts against the national unified market, as one that bars goods from another district, is not permitted. The talk is in his Selected Works as "Strengthen basic-level leadership and improve the style of work."'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 558 (July 18, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
