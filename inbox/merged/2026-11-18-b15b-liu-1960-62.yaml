      - china
      c: On the way back to Harbin, Liu Shaoqi inspects the Qiqihar steel plant and the Fularji heavy machinery plant No. 1, and holds a forum with local cadres at the Daqing oilfield.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 535 (Aug. 7, 1961). Made public: 1996. Names: Liu Shaoqi.'
