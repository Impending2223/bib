      when: July 3
      date: '1962-07-03'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi comments on the Shijiazhuang city committee''s report "Some opinions on methods for streamlining the placement of staff and workers," for Zhou Enlai and Yang Shangkun: it was drawn up by the Central Committee General Office''s work group and the city committee, and he finds it good; the streamlining small group is asked to discuss it and decide whether, after some changes, it can be sent to other places.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 558 (July 3, 1962). Made public: 1996. To check: Shijiazhuang city committee, "Some opinions on methods for streamlining the placement of staff and workers" (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 558). Names: Liu Shaoqi, Zhou Enlai.'
