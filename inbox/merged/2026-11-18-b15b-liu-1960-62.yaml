    entry:
      id: cal.1961-04-24.china-leadership-5
      when: Apr. 24
      date: '1961-04-24'
      thread: china-leadership
      also:
      - china
      c: Tianhua brigade. Liu Shaoqi convenes the work group on rural handicrafts. Handicraftsmen's pay is to be raised above peasants' and with a marked difference, or they will not take up the craft; the 1957 level of morale, pay, labor efficiency, quality and the number of products is to be restored first, then some progress; the county and commune industries are to run with careful accounts.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 515 (Apr. 24, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-25.china-leadership-5
      when: Apr. 25
      date: '1961-04-25'
      thread: china-leadership
      also:
      - china
      c: 'Tianhua brigade. In the morning Liu Shaoqi climbs Tianhua Hill to see the forest destruction. Afterward he convenes the work group on rural commerce: the supply and marketing cooperative is to belong to the members'' congress, not to the commune; its Party and political work are under the commune''s Party committee, and the commune may supervise it economically. In the afternoon he convenes the group on housing: houses pulled down must be paid for, brigade and commune cadres bearing the duty, and the compensation come out of the commune''s public fund. Housing is not to be settled in a year; two, three, four, five years if need be. In the evening he goes to Changsha.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 515–516 (Apr. 25, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-26.china-leadership-3
      when: Apr. 26
      date: '1961-04-26'
      thread: china-leadership
      also:
      - china
      c: 'Changsha. Liu Shaoqi receives guests from Africa: Abdoulaye Diallo, secretary-general of the All-African Peoples'' Conference, Camara Bengaly (卡马拉·本加里), member of the Guinean Democratic Party''s politburo, Sow Mamadou (索·玛玛杜), deputy head of the Guinean government''s planning ministry, and Keita Koumandian (凯塔·库曼迪亚), general secretary of Guinea''s teachers'' union. African peoples'' struggle against imperialism and colonialism is advancing; imperialism is isolated in Africa and its agents are few; it still has strength and is slippery, will change its method, and the aim is still profit; full independence will take a long struggle.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 516 (Apr. 26, 1961). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:guinea
      - name:liu-shaoqi
