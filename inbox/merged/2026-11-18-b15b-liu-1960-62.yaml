- add:
    entry:
      id: cal.1962-01-27.china-leadership-2
      when: Jan. 27
      date: '1962-01-27'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi, for the Central Committee, presents the written report to the enlarged Central Work Conference, formally issued to the participants. It analyzes the economy''s present state and the causes of the difficulties, sums up the lessons of socialist construction since 1958 and takes the Central Committee''s responsibility. The main faults and errors since 1958: plan targets for industry and agriculture too high and the capital construction line too long, so the national economy''s proportions, consumption and accumulation, fell badly out of balance; in the communes many places for a time blurred the line between collective and whole-people ownership, broke the rules of pay by work and exchange at equal value, and did the "communist wind" and other egalitarianism; many complete industrial systems set up everywhere and too much power sent down, so decentralism grew; the speed of farm growth overestimated and construction demanded too fast, so the town population grew wrongly
        large. The causes: the Party''s inexperience in building, and many leading comrades not modest and careful enough, against the Party''s tradition of seeking truth and the mass line, and in some degree weakening democratic centralism. The present difficulties are fairly serious and must be reckoned fully; adjustment begun in agriculture a year before is to go on for a time. The report is in his Selected Works.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 546–547 (Jan. 27, 1962). Made public: 1996. To check: [[w.shaoqi-liu-shaoqi-xuanji-selected]], the report to the enlarged Central Work Conference (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 547). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-30.china-leadership-4
      when: Jan. 30, Feb. 3, 9
      date: '1962-01-30'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi sits with the Anhui group of the enlarged Central Work Conference and speaks. Meanwhile he hears the Anhui prefectural committees separately and talks with the provincial committee's chief officials one by one, inquiring into and settling the "communist wind" and "exaggeration wind" errors of recent years and the still concealing of the facts. In the group he takes the Center's responsibility for what happened in Anhui and sharply criticizes the provincial committee's chief officials' errors; Anhui's delegates at the conference are to bring democracy fully into play, seek truth from facts in finding why the errors were made, draw the lesson and do the work well when they return.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 548 (Jan. 30, Feb. 3, 9, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-02-08.china-leadership-4
      when: Feb. 8
      date: '1962-02-08'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the enlarged Central Work Conference and speaks. On drafting the written report, decentralism had been criticized as the chief problem and the problems in democratic centralism overlooked; he proposes to change the second part''s "On concentration and unity" into "Strengthen democratic centralism and strengthen concentrated unity," and to add Mao''s words on democratic centralism. In these years the Party has paid for not investigating and for not practicing democracy: not developing democracy, not listening to others, not discussing among the people, not honestly seeking their agreement; a great lesson. An atmosphere in which men can say what they wish is to be formed; so in the Party and still more outside; the Party is never to substitute for the government. The system of people''s congresses is to be used to practice the people''s democracy.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 548–549 (Feb. 8, 1962). Made public: 1996. Names: Liu Shaoqi, Mao. Check: the enlarged conference closed Feb. 7 ([[cal.1962-02-07.china-leadership]]); the chronology''s name for the meeting of Feb. 8.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:mao-zedong
      - vis:only:prc
