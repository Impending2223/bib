      - china
      c: Liu Shaoqi, receiving Josef Sedivy (约瑟夫·赛迪维), Czechoslovakia's new ambassador, says the people's communes are China's experiment and a large historical one, of the rural China of five hundred million; two years is too soon for a conclusion. As things stand they can go on; if it fails the method is bad, if it succeeds the method is good.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 494 (Sept. 26, 1960). Made public: 1996. Names: Liu Shaoqi.'
