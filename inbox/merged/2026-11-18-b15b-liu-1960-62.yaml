      when: June 27
      date: '1962-06-27'
      thread: china-leadership
      also:
      - china
      - soviet-union
      c: 'Liu Shaoqi, with Deng Xiaoping and Peng Zhen, receives the delegation of the Albanian Party of Labor led by Hysni Kapo, member of the politburo and secretary of the Central Committee. On the international situation: an anti-imperialist united front is to be built, taking in true Communists, revolutionaries, the revolutionary bourgeoisie of colonial countries, and revisionists too; if the unity of the communist movement were to rest wholly on Marxism-Leninism, only a very few could be united; to unite most parties, all of them, there can be agreement only on some important questions, not all; keep what is common, set aside differences, and what is not agreed is not written into documents; the movement''s present unity has something of the character of a united front.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 557–558 (June 27, 1962). Made public: 1996. Names: Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
