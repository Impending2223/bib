    entry:
      id: cal.1961-08-03.china-leadership-2
      when: Aug. 3
      date: '1961-08-03'
      thread: china-leadership
      also:
      - china
      c: 'Daxing''anling. In rain Liu Shaoqi inspects the Wufengshan forest farm of the Genhe forestry bureau, Yakeshi (now Xiguitu banner), Inner Mongolia, and holds a forum with its leading cadres and workers'' representatives on forest regeneration, restoring rules and setting up a responsibility system. On wages he says the forest-area allowance, 33 percent here and 25 percent in Xiaoxing''anling, is egalitarian: it should be divided by whether men live in the hills or in town, climb more or sit in an office, winter or summer, fine weather or rain. The state still gives the 33 percent, not a cent less; how it is shared is to be studied with the workers.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 534 (Aug. 3, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-08-04.china-leadership-2
      when: Aug. 4
      date: '1961-08-04'
      thread: china-leadership
      also:
      - china
      c: Daxing'anling. Liu Shaoqi inspects the Xiniqi forestry bureau and talks with local cadres and workers' delegates. The first aim of felling is to get timber, the second to help regeneration; the getting of timber is to go with regeneration and the felling method to serve it.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 534–535 (Aug. 4, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-08-05.china-leadership-4
      when: Aug. 5
      date: '1961-08-05'
      thread: china-leadership
      also:
      - china
      c: Hulunbuir League. Liu Shaoqi reaches Hailar, the league's seat. In the afternoon he goes to the Ewenki banner (now Ewenki autonomous banner), to the Xibo production team of Xihe commune on the Xini river and the Bayan Huxuo team, where he is welcomed by herdsmen of Mongol, Ewenki, Daur and Han peoples, watches horse racing, wrestling and lasso throwing, and is a guest in a herdsman's home.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 535 (Aug. 5, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-08-06.china-leadership-3
      when: Aug. 6
      date: '1961-08-06'
      thread: china-leadership
      also:
      - china
      c: Hailar. Liu Shaoqi speaks to the Hulunbuir League's forestry cadres. The line is to use forest resources fully and meet the needs of state and people in many ways; relations of production that do not fit hinder productive forces and are to be adjusted. Rules once abolished are to be restored; every forestry bureau is to have a mechanical and a forestry engineer, with an engineer responsibility system; a bureau's vice-chiefs must include a forestry college graduate and each farm a vice-head who is a secondary forestry school graduate. Regeneration is to be mainly artificial, "two legs walking," with specialist teams and contracting for planting, tending and forest. The talk is in his Selected Works as "Speech at the Hulunbuir League forestry cadres' meeting."
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 535 (Aug. 6, 1961). Made public: 1996. To check: [[w.shaoqi-liu-shaoqi-xuanji-selected]], "Speech at the Hulunbuir League forestry cadres'' meeting" (在呼伦贝尔盟林业干部会上的讲话) (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 535). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
