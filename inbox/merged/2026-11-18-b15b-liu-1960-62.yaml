    entry:
      id: cal.1960-10.china-leadership-4
      when: Oct., first half
      date: 1960-10
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi''s comment on the Light Industry Ministry Party group''s report to the Center of the 6th on developing small-commodity production further: the small commodities everywhere are to be managed by the commercial departments, mainly the local ones, which will plan, supply raw materials, process, order, and sell; the output stays under light industry. Small commodities are many and the commercial departments most sensitive: at a problem they act at once or put a demand to the leadership.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 495 (Oct., first half, 1960). Check: the day; the chronology says only "the first half of October" (10月上半月). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
      at: before 1960-10-16
- add:
    entry:
      id: cal.1960-10.china-leadership-5
      when: Oct.
      date: 1960-10
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi revises the draft of the Center's "Urgent directive letter on current policy questions in the rural people's communes" (the "Twelve Articles"). In Article 2 he adds that the three-level ownership of the communes on the production team as base must be fixed for a period, and no encroachment on it, above all from above, is allowed, and what has been encroached on must be made good. In Article 4 he adds that "big armies" and "big harvests" imposed on the production teams are not to be used; for the present agricultural production and harvest are to be organized in the main by the team. The letter issues Nov. 3 in the Center's name.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 495–496 (Oct., 1960). Check: the day; the chronology gives only "October" (10月), the entry following Oct. 27 and preceding Nov. 2. Liu''s additions say the production team (生产队) as base. Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
