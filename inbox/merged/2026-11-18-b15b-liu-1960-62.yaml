      c: 'Liu Shaoqi hears Han Guang, executive vice-chairman of the State Science and Technology Commission, and Zhang Jingfu, vice-president of the Academy of Sciences, on technical tests. Liu: scientific research needs a great quantity of tests and no fear of failure; for some new things destructive tests are needed to get the most scientific data.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 480 (Mar. 3, 1960). Made public: 1996. Names: Liu Shaoqi.'
