    entry:
      id: cal.1962-10-23.china-leadership
      when: Oct. 23
      date: '1962-10-23'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi presides at the Politburo briefing and hears Li Xiannian on the market and foreign exchange. On farm-product purchase: this year''s purchase may not be met, a serious problem; some goods, grain for one, may not enter the free market before the purchase task is done.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 563–564 (Oct. 23, 1962). Made public: 1996. Names: Liu Shaoqi, Li Xiannian.'
      tags:
      - polity:prc
