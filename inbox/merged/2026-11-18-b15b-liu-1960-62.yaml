      when: Apr. 4
      date: '1962-04-04'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi comments on the Public Security Ministry Party group''s draft, sent for his review, of the record of his Mar. 17 talk with Luo Ruiqing, Wang Renzhong and Xie Fuzhi: the record is not to be printed; they have in the past printed a bit too much, and it will do harm later. Four years'' work in public security, the procuracy and the courts does hold much new experience to sum up; if they gather the materials he can take part and sum it up with them carefully and systematically, a serious matter, not to be handled with rash, scattered printing.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 552–553 (Apr. 4, 1962). Made public: 1996. Names: Liu Shaoqi, Luo Ruiqing, Xie Fuzhi.'
