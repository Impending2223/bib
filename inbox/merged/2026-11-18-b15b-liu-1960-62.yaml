- add:
    entry:
      id: cal.1960-01-31.china-leadership-3
      when: Jan. 31
      date: '1960-01-31'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi has Wang Guangmei''s brothers Wang Guangqi, Wang Guangchao and Wang Guangying and their children to his home. At their request he talks on remolding one''s world outlook: each class has its own; personal and passing interests are to give way to the group''s and the lasting.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 476–477 (Jan. 31, 1960). Liu: to take a small loss now for a large gain is the law of opposites (吃小亏，占大便宜, 477). Footnotes 1–3 (476) give the brothers'' posts: Foreign Trade Ministry cadre; Peking Medical College first affiliated hospital professor of dermatology; chairman of the Tianjin Federation of Industry and Commerce. Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
