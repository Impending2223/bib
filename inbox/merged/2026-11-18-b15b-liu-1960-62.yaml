- add:
    entry:
      id: cal.1961-04-13.china-leadership-3
      when: Apr. 13
      date: '1961-04-13'
      thread: china-leadership
      also:
      - china
      c: Tianhua brigade. Liu Shaoqi convenes the brigade's cadres on the Sixty Articles (the draft Rural People's Commune Work Regulations), chiefly on mess halls, distribution, grain and housing. He tells them to speak freely, free of fear, with no caps and no criticism; not to fear that dropping the mess halls is not socialism or the communes; the test is what helps production and the masses' convenience, and what benefits state, collective and members alike. The mess halls were stressed too far in propaganda; those to be dropped are to be dropped well, those to be kept kept well, small ones divided properly; not a sudden order.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 511 (Apr. 13, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-14.china-leadership-3
      when: Apr. 14
      date: '1961-04-14'
      thread: china-leadership
      also:
      - china
      c: 'Tianhua brigade. Liu Shaoqi hears the Central Committee work group in the morning. In the afternoon he calls the brigade''s production-team cadres for their views on the Sixty Articles. Hearing them on the mess halls, he lists their faults: they take the main laborers to grow vegetables and cut firewood; they hurt production by gathering everyone in; they cut manure; they burn hard firewood and wreck the forests; they spoil the pigs; grain is eaten in a way that does not fit; vegetable land is taken; sharing out costs quarrels; there are too many people and the big pot of vegetables is poor.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 511–512 (Apr. 14, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-15.china-leadership-4
      when: Apr. 15
      date: '1961-04-15'
      thread: china-leadership
      also:
      - china
      c: 'Tianhua brigade. Liu Shaoqi examines the Shijiachong mess hall in the morning. In the afternoon he calls members of the team to a forum for views on mess halls and supply, and opens: many things have gone wrong in these years, the Center, province and county share the blame, and the commune and brigade too. Hearing the masses, he says the life is worse than before because of the mess halls: no private plots, no pigs or hens, fewer goods; the policy of taking back private plots, pulling down houses and part supply was wrong; many people "ride the big boat" and are not keen. It is the Center that bears the blame first: bureaucracy.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 512 (Apr. 15, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-16.china-leadership-4
      when: Apr. 16
      date: '1961-04-16'
      thread: china-leadership
      also:
      - china
      c: Tianhua brigade. Liu Shaoqi visits members' homes.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 512 (Apr. 16, 1961). Made public: 1996. Check: [[cal.1961-04-16.china-leadership]] puts Liu at Mao''s meeting at the Rong Garden, Changsha, that evening; the chronology says nothing of it. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-17.china-leadership-2
      when: Apr. 17
      date: '1961-04-17'
      thread: china-leadership
      also:
      - china
      c: 'Tianhua brigade. Liu Shaoqi attends the brigade''s general branch committee meeting. He says most members do not want the mess halls and ask to dismiss them, and he thinks it right: since communizing the mess halls the troubles are solved but over 80 percent of the peasants are not keen. The call of Oct. 1, 1958 to set up mess halls was a big mistake from which lessons are to be drawn; the mess halls have a great egalitarianism. Polarization between rich and poor need not be feared: with supply, a little social insurance for the specially hard-pressed, some difference is fine; equal sharing is against the socialist principle, "from each according to his ability, to each according to his work."'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 512–513 (Apr. 17, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-18.china-leadership-8
      when: Apr. 18
      date: '1961-04-18'
      thread: china-leadership
      also:
      - china
      c: Tianhua brigade. Liu Shaoqi tells the head of the Hunan Public Security Department, who accompanies him, to study quickly setting up public security stations in the countryside and restoring people's courts, as convenient to the masses and good for public order.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 513 (Apr. 18, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-19.china-leadership-7
      when: Apr. 19
      date: '1961-04-19'
      thread: china-leadership
      also:
      - china
      c: 'Tianhua brigade. Liu Shaoqi hears the Central Committee work group on the brigade in the morning. He says a wind is blowing in which all starts from the intention of those above, which is non-Marxist; the Communist''s discipline is to start from reality. The mess hall is one socialist position among others, not the most important; the three-level ownership is the root position and the collective economy the main; the mess hall organized by force is egalitarianism. To call it the focus of the two-road struggle is wrong: the masses are not against socialism, only against having to eat in the mess hall. In the evening he talks with the officials of Hunan, Changsha city and Changsha county on the work team.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 513–514 (Apr. 19, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-20.china-leadership-5
      when: Apr. 20
      date: '1961-04-20'
      thread: china-leadership
      also:
      - china
      c: Tianhua brigade. Liu Shaoqi studies the mess halls with the Central Committee work group and the brigade's cadres. Over 90 percent want them dropped, and if they are kept the Party loses touch with 90 percent. Mess halls are to be "stopped," not "dissolved"; those who wish to leave leave, those who wish to eat there may.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 514 (Apr. 20, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-21.china-leadership-5
      when: Apr. 21
      date: '1961-04-21'
      thread: china-leadership
      also:
      - china
      c: Tianhua brigade. Liu Shaoqi hears the Central Committee work group on dropping the mess halls. Dropping them is not to hurt production; major questions are to go to the members' congress so as to avoid or reduce mistakes.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 514 (Apr. 21, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-22.china-leadership-3
      when: Apr. 22
      date: '1961-04-22'
      thread: china-leadership
      also:
      - china
      c: 'Tianhua brigade. Liu Shaoqi hears the work group on dropping the mess halls and making restitution. Hunan''s report says 90 percent restituted; he has not heard a member. Province, county, commune, brigade, team: nobody has heard a single team member. What the "reality" is, the Center does not know, nor the province, county, commune or brigade; even newspaper reports of production teams doing this or that well are in part false. Members are to be asked their views and democracy practiced; team cadres and Party members are not to profit; the mess-hall pots and tools are to be settled under leadership.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 514–515 (Apr. 22, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
