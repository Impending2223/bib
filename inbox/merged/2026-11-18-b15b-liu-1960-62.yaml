      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi goes from Changsha to Tianhua brigade, talks with the peasants and explains the Sixty Articles to them.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 516 (Apr. 27, 1961). Made public: 1996. Names: Liu Shaoqi.'
