    entry:
      id: cal.1961-04-23.china-leadership-3
      when: Apr. 23
      date: '1961-04-23'
      thread: china-leadership
      also:
      - china
      c: Tianhua brigade. Liu Shaoqi visits members' homes.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 515 (Apr. 23, 1961). Made public: 1996. Names: Liu Shaoqi.'
