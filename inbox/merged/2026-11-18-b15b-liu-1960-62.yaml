    entry:
      id: cal.1962-04-23.china-leadership
      when: Apr. 23
      date: '1962-04-23'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi presides at the enlarged Politburo Standing Committee meeting, which hears the report on streamlining in the Northeast region and the Finance and Economics Small Group's report on the 1962 plan to adjust the national economy. The economy is out of balance on all sides and must be adjusted on all sides; the situation is underestimated now, not overestimated. There is no great situation in the economy; the "great situation" is political, in the Party's unity and the people's unity.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 553 (Apr. 23, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-24.china-leadership-4
      when: Apr. 24
      date: '1962-04-24'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi meets members of the Central Committee General Office''s materials investigation groups at Shijiazhuang and Wuxi. The economic situation is complex, the problems many: the economy out of balance, great stocks of goods piled up, capital turning over with difficulty. The cause lies chiefly above, in errors of plan and policy; they should tell the comrades in the plants so and admit the errors, speak by his report to the enlarged work conference, Chen Yun''s talk and the Center''s forwarded financial report; the Center and the municipality alike make their self-criticism, right and wrong distinguished, truth sought from facts. Materials work must grasp both ends, supply and sales, to serve the plants; plants are to produce to the demands of the materials and commercial departments, not blindly; work groups are to make a model of running a plant well.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 553–554 (Apr. 24, 1962). Made public: 1996. Names: Liu Shaoqi, Chen Yun.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:chen-yun
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-28.china-leadership-3
      when: Apr. 28
      date: '1962-04-28'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi hears Xie Juezai, president of the Supreme People''s Court, and Xie Fuzhi, Minister of Public Security, on public security and political and legal work. Our proletarian law is not yet formed or truly established; Lenin wrote *State and Revolution*, Stalin did something, and Mao set the line of dictatorship work and raised the two kinds of contradictions. Experience is on two sides: Khrushchev wanted no dictatorship, Stalin in his later years widened the suppression of counterrevolution, and we too have mixed the two kinds of contradiction. Now correct it and sum up, in theory, policy principle, division of organs and concrete methods. The procuracy and courts are to work independently and the Party committee is not to interfere in particular cases; reports on public security matters to the level above go straight, not through the Party committee for approval. The "left" errors of these years were committed in the Party committees'' absolute leadership: an important lesson.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 554 (Apr. 28, 1962). Made public: 1996. Names: Liu Shaoqi, Xie Fuzhi, Mao, Stalin, Khrushchev.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:xie-fuzhi
      - name:mao-zedong
      - name:stalin-joseph
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-29.china-leadership
      when: Apr. 29
      date: '1962-04-29'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi reads an item in the Central Committee General Office''s *Qunzhong fanying* ([62] no. 38) on the Changchun Fifth Tank Technical School, which disregarded the Center''s order to stop construction of non-productive buildings and under various pretexts built a great hall, and comments: "Take solid measures to stop such capital construction."'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 554 (Apr. 29, 1962). Made public: 1996. To check: Central Committee General Office, *Qunzhong fanying* ([62] no. 38), the item on the Changchun Fifth Tank Technical School (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 554). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-05-17.china-leadership-2
      when: May 17
      date: '1962-05-17'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi writes to Li Xiannian after reading the East China Bureau office''s *Neibu ziliao* no. 9, which prints "Anhui assigns the Guest House restaurant to the commercial department to run": might all buildings, halls, houses and offices built by every place, department and organ above county level be taken over by the state, a housing management office set up to manage them, and users pay rent by one standard? That would check blind building and the blind taking of houses.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 555–556 (May 17, 1962). Made public: 1996. To check: Central Committee East China Bureau office, *Neibu ziliao* no. 9 (1962), "Anhui assigns the Guest House restaurant to the commercial department to run" (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 555). Names: Liu Shaoqi, Li Xiannian.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1962-05-23.china-leadership-2
      when: May 23
      date: '1962-05-23'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi invites the members of the Central Committee's political and legal small group to talk about drafting the "Summing-up report on political and legal work since 1958." The chief lesson in these years of political-legal work is mixing two contradictions of different nature, mainly taking our own for enemies and striking too wide; the two kinds of contradiction must be distinguished strictly, and so must the two methods of handling them; most of the errors lay in handling contradictions among the people by the method for enemies, in the Party and government, including the Kuomintang-style handling of Party problems, which sharpens contradictions and may split. The public security organs, the procuracy and the courts are organs of dictatorship over enemies, and for the people are to be organs for handling contradictions among the people. Independent trial by the courts is right and constitutional; the Party committee and government should not meddle in their cases; if a local
        committee's decision clashes with law and the Center's policy, obey the law and the Center's policy. The talk is in his Selected Works as "Political and legal work and the correct handling of contradictions among the people."
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 556 (May 23, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-03.china-leadership-2
      when: June 3
      date: '1962-06-03'
      thread: china-leadership
      also:
      - china
      - vietnam-hanoi
      c: 'Liu Shaoqi receives Hồ Chí Minh, chairman of the Vietnam Workers'' Party Central Committee. On lessons from China''s economic building: how large an industry, how large a culture and education enterprise, depends on how much grain and goods the peasants can supply, as Marx says in *Capital*: what the peasants provide beyond their own consumption fixes how much labor can go to material and spiritual production; material production is industry and spiritual production is science, culture and art; the first proportion in a planned economy is that between industry and agriculture, and it must be right.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 556–557 (June 3, 1962). Made public: 1996. Names: Liu Shaoqi, Hồ Chí Minh.'
      tags:
      - polity:prc
      - polity:drv
      - name:liu-shaoqi
      - name:ho-chi-minh
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1962-06-05.china-leadership
      when: June 5
      date: '1962-06-05'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi meets the heads of provincial materials departments and bureaus attending the national materials work conference. Rely on pilots and sum up experience; every region, province and city must try; without a pilot, a general spread makes mistakes. Materials work, begun with a firm foundation, is to be strict and by the rules, with scientific management and a system of rules; the materials departments supervise production, check cost, supervise quality and report; later they may do processing and ordering like the commercial departments, with the plants producing on their direction, which avoids blindness in production.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 557 (June 5, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
