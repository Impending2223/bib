      c: 'Liu Shaoqi comments on the item "Public security organs in Qinghai are very seriously breaking the law and the discipline" in the Central Supervisory Commission''s *Dang de jiancha gongzuo fanying*: to Deng Xiaoping and Peng Zhen after reading, and then to Xie Fuzhi; the Public Security Ministry is to send men to Qinghai to deal with it seriously with the provincial committee. The lawlessness of Qinghai''s public security organs is to be a lesson.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 550 (Mar. 5, 1962). Made public: 1996. To check: Central Supervisory Commission, *Dang de jiancha gongzuo fanying*, the item "Public security organs in Qinghai are very seriously breaking the law and the discipline" (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 550). Names: Liu Shaoqi, Deng Xiaoping, Peng Zhen, Xie Fuzhi.'
