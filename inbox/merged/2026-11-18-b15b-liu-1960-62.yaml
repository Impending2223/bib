    entry:
      id: cal.1961-04-29.china-leadership-2
      when: Apr. 29
      date: '1961-04-29'
      thread: china-leadership
      also:
      - china
      c: 'Tianhua brigade. Liu Shaoqi calls a meeting of the workers in commune-run industry for their views, then tells the work group''s leaders that the handicraft wage system must be reformed: handicraft workers'' pay is to exceed the peasants'' income, and with a marked difference, so that men will learn the trade.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 516 (Apr. 29, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-30.china-leadership-2
      when: Apr. 30
      date: '1961-04-30'
      thread: china-leadership
      also:
      - china
      c: 'Tianhua brigade. In the morning Liu Shaoqi convenes the work group on what to do next: the mass line to be carried through from start to end, the "charity" view dropped; it is easy to say and hard to do; in these three years the masses were not allowed to run their own affairs, and that is why houses were pulled down and residents moved. In the evening he talks with some of the brigade''s cadres, hoping they will draw the lesson, correct the errors and make the brigade well. Afterward he goes to Changsha.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 516–518 (Apr. 30, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04.china-leadership-9
      when: Apr., mid to late
      date: 1961-04
      thread: china-leadership
      also:
      - china
      c: 'At Tianhua brigade Liu Shaoqi learns of the case of Feng Guoquan and his son, the brigade''s stock-keepers: a plow ox they fed died in Feb. 1957, a three-inch iron wire was found in its lung at autopsy, and they were criticized and held as saboteurs. Liu orders the Hunan Public Security Department to look into it; it reviews the case, the verdict is reversed and Feng is cleared.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 518 (Apr., mid to late, 1961). The chronology gives only "mid and late April" (4月中下旬) for Liu''s learning of it. Its sequel: the Hunan department''s report to the Hunan committee and the Ministry of Public Security of June 30, and Liu''s reading of it in Peking July 10, are entries of their own. Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
      at: after 1961-04-10
- add:
    entry:
      id: cal.1961-05-01.china-leadership
      when: May 1
      date: '1961-05-01'
      thread: china-leadership
      also:
      - china
      c: Changsha. Liu Shaoqi attends the meeting celebrating International Labor Day.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 518 (May 1, 1961). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1961-05-01.china-leadership-2
      when: May 1
      date: '1961-05-01'
      thread: china-leadership
      also:
      - china
      c: 'Changsha. Liu Shaoqi talks with Hu Jiwei, deputy editor-in-chief of *Renmin ribao*, and others. The paper should sum up the experience of three years: its exaggeration in reporting production and construction, its blind command in spreading model experience, its one-sidedness in propaganda on policy and theory have done real harm. It put forward many high targets and launched "satellites" and wrong things the Center had put forward. There are two deviations: cutting loose from the local Party committee, and doing only what the committee says, hence the boasting of good mess halls and "satellites." A Communist journalist joins principle to discipline: obeys the leadership, reports problems and gives opinions. Every article should come from investigation; a journalist and editor should be a truth-seeking Marxist-Leninist.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 518–519 (May 1, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-01.china-leadership-3
      when: May 1
      date: '1961-05-01'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi writes to Zhang Pinghua: the housing problem in Hunan''s villages is an important one needing settlement now, though it will take two or three years; the work team''s investigation and opinion on housing in Tianhua brigade, Guangfu commune, is a reference for handling it elsewhere; should it be issued to every place? That day the Hunan provincial committee sends the letter and the Central Committee investigation group''s "Investigation and opinion on the housing situation of Tianhua brigade, Guangfu commune" to the whole province.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 519 (May 1, 1961). The chronology marks it as a second item of the day (△). Made public: 1996. To check: Central Committee investigation group, "Investigation and opinion on the housing situation of Tianhua brigade, Guangfu commune" (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 519). Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-02.china-leadership-5
      when: May 2
      date: '1961-05-02'
      thread: china-leadership
      also:
      - china
      c: Ningxiang. Liu Shaoqi reaches the county town, hears the Ningxiang county committee in the afternoon, calls the county's and communes' industrial cadres in the evening, and tours the town afterward.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 519 (May 2, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-03.china-leadership-2
      when: May 3
      date: '1961-05-03'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi hears the Ningxiang county public security bureau on political and legal work in the morning, and calls the county's commercial cadres in the afternoon. In the evening he goes to Tanzichong brigade, Huaminglou commune, his native place, and lodges in his old house.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 519 (May 3, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-04.china-leadership-2
      when: May 4
      date: '1961-05-04'
      thread: china-leadership
      also:
      - china
      c: 'Tanzichong. Liu Shaoqi hears the Huaminglou commune rectification work team. Mess halls were set up grudgingly and are most unpopular; "we made mistakes on this, and went at it for three years without understanding." In the evening he hears the Tanzichong brigade work team: a mess hall should save labor, and the present ones waste it, and what does not save labor is not to be kept. On housing, not to take back houses wholesale "to the original owner": investigate and treat each as it is; the brigade is to help members settle it.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 519 (May 4, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-05.china-leadership-2
      when: May 5
      date: '1961-05-05'
      thread: china-leadership
      also:
      - china
      c: 'Tanzichong. In the morning Liu Shaoqi inspects the public mess hall of Anhutang production team, Huaminglou commune, and talks with the peasants. In the afternoon he talks with the peasant Cheng Jingchang: he hears work has gone badly, members hungry, many ill, some dead, fields waste; he came back to see, late, and is sorry to the members; policy is not yet right and all are to discuss it. His old house, kept as a memorial, is not to be kept: the houses and their contents go to the members. In the evening he talks with the peasant Li Guisheng.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 519–520 (May 5, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-06.china-leadership-2
      when: May 6
      date: '1961-05-06'
      thread: china-leadership
      also:
      - china
      c: 'Tanzichong. In the morning Liu Shaoqi talks with the peasant Wang Shengping, whose letters on rural conditions were held back: if those you accuse accuse you in turn, come to Peking, and I will pay the fare and the board. In the afternoon, with the peasants Ou Yinchun, Ou Fengqiu and Ou Ronghua: people do not yet trust policy because ownership is not yet settled; what is yours is yours and mine mine, and what is taken must be paid back. In the evening he hears the rectification work team''s head: the masses are not at ease, cadres dare not speak; the team is to see to pots, spades, tongs and jars for the mess halls'' dissolution and tell the committees to have them made; goods once made good, the masses will believe it.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 520 (May 6, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
