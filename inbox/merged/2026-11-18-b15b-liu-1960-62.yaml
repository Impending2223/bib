      when: Apr. 2
      date: '1961-04-02'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi reaches Wangjiawan production team, Donghutang commune, Ningxiang county, Hunan, and lodges in a dilapidated empty room in the old team pig farm.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 510 (Apr. 2, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-03.china-leadership-6
      when: Apr. 3
      date: '1961-04-03'
      thread: china-leadership
      also:
      - china
      c: Wangjiawan. Liu Shaoqi hears in the morning, at his lodging, the Central Committee work group that arrived earlier. To Zhang Pinghua and others he says Ningxiang county's trouble is so grave that to call natural calamity the main cause would hardly persuade; without investigation the lesson is large; leaders must put down their airs to go deep, and what is decided without investigation cannot fit the facts. In the afternoon he surveys local production.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 510 (Apr. 3, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
