    entry:
      id: cal.1960-05-02.china-leadership-2
      when: May 2–3
      date: '1960-05-02'
      thread: china-leadership
      also:
      - china
      c: 'Chengdu. Liu Shaoqi hears Sichuan Party committee secretaries Chen Gang, Liao Zhigao and others on their work. On timber: cut and plant together, plant more than is cut. On leaders and the masses: cadres are to take part in production and share the workers'' lives; leaders trust the masses and the masses the leaders; "worry before the world worries" (先天下之忧而忧).'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 485 (May 2–3, 1960). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1960-05-05.china-leadership-4
      when: May 5
      date: '1960-05-05'
      thread: china-leadership
      also:
      - china
      c: Chengdu. Liu Shaoqi inspects the Chengdu measuring and cutting tools plant and the Chengdu pharmaceutical plant. The tools plant works by diligent management, many forms of operation and the mass line (group work); its "two participations, one reform, three combinations" has progressed. Workers can be trusted to manage plants, cities and the state; as their cultural and political level rises, the roots of bureaucracy are cut.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 485 (May 5, 1960). Footnote 1 (485) glosses "two participations, one reform, three combinations" as the Anshan Iron and Steel Company''s management experience of 1960: cadres take part in collective production labor and workers in management; irrational rules reformed and sound ones set up; leaders, technicians or managers and workers combined. It names no work. Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
