      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-30.china-leadership-2
      when: July 30
      date: '1961-07-30'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi leaves Mudanjiang for Harbin. On the way he hears the Mudanjiang prefectural committee's officials on work. Those who do more should get more than those who do less; he is told workers say more work is no better than less work, less no better than none, since pay is 70 percent of the quota for not working and 70 to 80 percent for working, a fault of wage administration. A forest farm running farming cannot be "both worker and farmer"; the peasants should do the farming and forestry; forestry that raises grain loses; it must take the collective road, under a responsibility system.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 533–534 (July 30, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-31.china-leadership
      when: July 31
      date: '1961-07-31'
      thread: china-leadership
      also:
      - china
      c: 'Harbin. Liu Shaoqi receives the responsible cadres of the Northeast and Inner Mongolia forestry work conference and the Heilongjiang committee''s secretariat members. Planting and regeneration are to be valued; many leaders attend only to cutting. Regeneration is mainly artificial, with artificial promotion of natural regeneration. On felling, Japanese, old China''s and Chinese Republic''s methods were bad: cutting only the thick logs; the aim now is to get timber and also to help young trees grow; clear-felling harms young trees too much and selective cutting may serve the forest better.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 534 (July 31, 1961). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
