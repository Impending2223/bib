    entry:
      id: cal.1962-03-08.china-leadership-4
      when: Mar. 8
      date: '1962-03-08'
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi has Gu Mu, deputy director of the State Economic Commission, and Yuan Baohua, deputy director of the Commission and head of the State Materials Bureau, report on materials supply. The materials departments are a leading department, not a rear service; state planning is to rest on materials and the materials in hand, or the plan is empty; materials are a comprehensive department and its management is to be comprehensive and centralized, in the service of production. The key is to turn from the main goods within the plan to the goods that have no one in charge, outside the plan; do not fear difficulty, but one pushed to the extreme turns back into disorder, and order comes after; administrative organs short and lean, those that run and manage to be filled out and strengthened.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 550 (Mar. 8, 1962). Made public: 1996. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-03-15.china-leadership
      when: Mar. 15
      date: '1962-03-15'
      thread: china-leadership
      also:
      - china
      c: 'Liu Shaoqi, after reading *Gong''an gongzuo jianbao* no. 6, writes to Xie Fuzhi: this is the good side that you can control; look at the other side. Since 1959 many public security organs, even at commune and brigade level, have held people long, put them to long labor reform and labor re-education, in fact arresting many, and starved or tortured to death some, and you cannot control or count them, or the count is not exact. In 1961 it had not wholly stopped; last year in Hunan he saw this himself. They are to check, expose, criticize and correct it strictly.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 551 (Mar. 15, 1962). Made public: 1996. Names: Liu Shaoqi, Xie Fuzhi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:xie-fuzhi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-03-17.china-leadership-2
      when: Mar. 17
      date: '1962-03-17'
      thread: china-leadership
      also:
      - china
      c: 'Wuhan. Liu Shaoqi talks with Luo Ruiqing, Wang Renzhong and Xie Fuzhi on public security work: the lessons of four years are many, and the chief one is mixing the two kinds of contradiction; enemies are to be regarded as enemies, but the chief fault is to treat our own as enemies. Under the law, counties, communes and even brigades have used long detention, labor and labor re-education, and no one knows how many were tortured to death. To check, expose and criticize thoroughly: it is ugly, but should one fear the ugliness? If not exposed today, it will be tomorrow, and by the next generation. When Xie Fuzhi and Wang Renzhong speak of being criticized in these years as "right-leaning," Liu: are you afraid of "right deviation"? At the worst you lose your post; to hold to truth and lose it is honorable.'
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 551 (Mar. 17, 1962). Footnote 1 (551) gives Luo Ruiqing as then Chief of the General Staff of the PLA. Made public: 1996. Names: Liu Shaoqi, Luo Ruiqing, Xie Fuzhi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:luo-ruiqing
      - name:xie-fuzhi
      - vis:only:prc
