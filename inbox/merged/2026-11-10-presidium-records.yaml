# The owner, Nov. 6, 2026, of cal.1960-01-29.cuba: "Don't we have the Presidium resolutions now?" Every To-check item naming a
# Presidium protocol, resolution or stenogram of 1960-64 looked for in vols. I and III; book check: notes/book-checks/prezidium-tsk-kpss-1954.md.
patch: presidium-records
by: 'Claude (reader: the Presidium records in Prezidium TsK KPSS, I and III)'
ops:
- cite:
    id: cal.1962-05-11.soviet-union-2
    item: '[[w.prezidium-tsk-kpss-1954]], I, 1100 n.2 (the editors, quoting the letter: the debts written off; two years'' free "arms and ammunition for the Cuban army, including missile and other arms"; the plan approved May 11)'
    units: A-B
- src:
    id: cal.1962-05-11.soviet-union-2
    rows:
    - 'via x.2003.prezidium-i-p1100-n2-1962-05-11: A-B'
- cite:
    id: cal.1962-05-24.missile-crisis
    item: '[[w.prezidium-tsk-kpss-1954]], I, 1100 n.4 (the editors: the Defense Council decides, May 24, the troops and equipment to move to Cuba in secret; the Presidium''s resolution P 32/1 the same day, unanimous)'
    units: A
- src:
    id: cal.1962-05-24.missile-crisis
    rows:
    - 'via x.2003.prezidium-i-p1100-n4-1962-05-24: A'
- check:
    id: cal.1962-05-24.missile-crisis
    text: 'Check: the editors (I, 1100 n.4), from S. P. Ivanov''s recollection as Volkogonov gives it, have Mikoyan object at the Defense Council; they cite the resolution, APRF, f. 3, op. 65, d. 872, l. 49, and do not print it.'
- cite:
    id: cal.1962-11-22.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 403–04 (the additional instructions to Mikoyan, P 68/V)'
    units: B-C
- src:
    id: cal.1962-11-22.soviet-union
    rows:
    - 'via x.1962-11-22.presidium-resolution-p68-v-instructions-to-mikoyan: B-C'
- check:
    id: cal.1962-11-22.soviet-union
    text: 'Check: the instructions (III, 403–04) quote the Cuban Foreign Ministry''s directive to Lechuga, "У нас есть тактическое атомное оружие, которое нужно сохранить" (we have tactical atomic weapons, which must be kept); all nuclear weapons, "as we told the Americans," already "вывезено" (removed) from Cuba, not yet to come out; the telegram sent Nov. 22 (Gromyko''s note to Malin, Nov. 26, 403). The volume prints RGANI''s copy (f. 3, op. 18, d. 108); Fursenko and Naftali cite APRF''s (f. 3, op. 65, d. 912).'
- variant:
    id: cal.1962-11-22.soviet-union
    unit: A
    witness: x.1962-11-22.presidium-resolution-p68-v-instructions-to-mikoyan
    reads: с Кубы же, как мы заявили американцам, все ядерное оружие вывезено (from Cuba, as we told the Americans, all nuclear weapons have been removed)
    at: III, 404
- variant:
    id: cal.1962-10.south-asia
    unit: A
    witness: x.1962-10-14.presidium-protocol-59
    reads: Задержать отправку в Индию самолетов МИГ-21 (hold back the dispatch of the MiG-21s to India)
    at: I, 616
- check:
    id: cal.1962-06-10.missile-crisis
    text: 'Check: under P 35/I, June 10, Rashidov''s report, the volume prints only "Решение – особая папка" (decision: special file) ([[w.prezidium-tsk-kpss-1954]], III, 283); its note: the text never reached the archive (III, 1001 n.1). The Presidium''s materials are not printed.'
- cite:
    id: cal.1961-05-26.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 169 (the resolution, P 331/I)'
    units: A
- src:
    id: cal.1961-05-26.soviet-union
    rows:
    - 'via x.1961-05-26.presidium-resolution-p331-i: A'
- check:
    id: cal.1961-05-26.soviet-union
    text: 'Check: the resolution (III, 169) agrees "с позициями, изложенными тов. Хрущевым" (with the positions Comrade Khrushchev set out) and has the Foreign Ministry prepare the materials for Vienna as an aide-mémoire; nothing of approving the Ministry''s paper as written.'
- variant:
    id: cal.1961-05-26.soviet-union
    unit: B
    witness: x.1961-05-26.presidium-resolution-p331-i
    reads: Согласиться с позициями, изложенными тов. Хрущевым Н.С. (agree with the positions Khrushchev set out); the Foreign Ministry to prepare the materials as an aide-mémoire
    at: III, 169
- edit:
    id: cal.1960-02-01.soviet-union
    base: 375c0c2c
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 255–56; [[w.prezidium-tsk-kpss-1954]], I, 422–35 (Protocol 262 and the stenogram). Check: the stenogram (I, 435) has Khrushchev: "Now they themselves think we are stronger, and we propose this"; the words in c are Fursenko and Naftali''s. See [[cal.1960-01-14.soviet-union]]. Names: Khrushchev, Brezhnev, Gromyko, de Gaulle.'
- edit:
    id: cal.1960-04-07.soviet-union
    base: 77ba6796
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 270; [[w.prezidium-tsk-kpss-1954]], I, 437–38 (Protocol 274). Check: the protocol (I, 438) has the letter read at the session, the political education of the commanders weak, perhaps lectures for the officers; no order of Khrushchev''s, no system of reporting what they say. Its item I (437): Khrushchev on France, the draft resolution "too hurrah," the failure to agree to be said too. See [[cal.1960-01-14.soviet-union]]. Names: Khrushchev.'
- edit:
    id: cal.1960-04-28.soviet-union
    base: d57f2a2f
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 271 and n.27; [[w.prezidium-tsk-kpss-1954]], I, 440–41 (Protocol 277). Check: the protocol (I, 440) has Voroshilov on the scrap premiums, "a great misunderstanding"; out of the protocol, whether Khrushchev should speak on foreign and home policy at the Supreme Soviet''s session, no decision. See [[cal.1960-04-07.soviet-union]]. Names: Voroshilov, Khrushchev.'
- edit:
    id: cal.1960-05-04.soviet-union
    base: 7f65d480
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 273; [[w.prezidium-tsk-kpss-1954]], I, 441–42 (Protocol 279). Check: the protocol (I, 441–42) has Kosygin first deputy chairman of the Council of Ministers, Polyansky a member of the Presidium, Podgorny from candidate to member; nothing of Kosygin''s Presidium seat. Names: Khrushchev, Brezhnev, Voroshilov, Kosygin, Podgorny.'
- edit:
    id: cal.1960-10-15.soviet-union
    base: a5e9e09b
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 317, 319–20; [[w.prezidium-tsk-kpss-1954]], I, 444–46 (Protocol 306). Check: the protocol (I, 444–46) has nothing of Hammarskjöld; it has the Geneva talks on a test ban to be slowed and tied to a general agreement on disarmament (445), Zorin to back the neutrals'' draft resolution (446; [[w.prezidium-tsk-kpss-1954]], III, 133). See [[cal.1960-09-23.soviet-union]]. Names: Khrushchev, Nkrumah, Hammarskjöld.'
- edit:
    id: cal.1961-02-16.soviet-union
    base: 3c2c72e2
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 343–44; [[w.prezidium-tsk-kpss-1954]], I, 480, 487, 490 (Protocol 315 and the stenogram). Check: the stenogram (I, 490) has Khrushchev: "We save gold, and then buy butter and give 23 tons," better spent on fertilizer and herbicides; no London, no $26 million. The cows (480, 487): a secretary who bought and slaughtered 100,000 workers'' cows in 1959, since moved to Kaluga. Names: Khrushchev.'
- edit:
    id: cal.1961-02-24.soviet-union
    base: 505b8a1f
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 345; [[w.prezidium-tsk-kpss-1954]], I, 493–94 (Protocol 316). Check: the protocol (I, 493–94) has Khrushchev on "principled positions" in trade with Albania, polemic with Mikoyan; Mikoyan''s concern that "the Chinese and others" could say Moscow presses a small country; the decision not to break off trade, the trade agreement not signed now, the radio station dismantled. Names: Khrushchev, Mikoyan.'
- edit:
    id: cal.1961-03-25.soviet-union
    base: 2b0a7a4e
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 343–45; [[w.prezidium-tsk-kpss-1954]], I, 494–96 (Protocols 320 and 321). Check: the protocols (I, 494–96) have "Cut off the noise" (шумиху); no word of fudging the figures, only, on Mar. 23, the upward corrections without their sources and whether the figures are real. Names: Khrushchev.'
- edit:
    id: cal.1961-06-17.soviet-union
    base: d9f541cf
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 365–66; [[w.prezidium-tsk-kpss-1954]], III, 170–71 (the resolution, P 334/I); [[w.prezidium-tsk-kpss-1954]], I, 527–28 (the stenogram). To check: the resolution, June 17, 1961, Bohlen Papers, NARA (cited by [[w.fursenko-khrushchevs-cold-war]], 365 n.91). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Khrushchev, Castro.'
- edit:
    id: cal.1962-01-08.soviet-union
    base: 4b8513ed
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 5–6, 412–16; [[w.prezidium-tsk-kpss-1954]], I, 535–49 (Protocol 11 and the stenogram). Made public: the stenogram, some forty years later ([[w.fursenko-khrushchevs-cold-war]], 5). See [[cal.1962-01-02.berlin-and-vienna]]. Names: Khrushchev, Kennedy, Eisenhower, Mikoyan.'
- edit:
    id: cal.1962-05-31.soviet-union
    base: 55037edc
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 430–31; [[w.prezidium-tsk-kpss-1954]], I, 557–60 (the shortfalls, 557–58; the defense cut, 560). Check: the protocol and stenogram (I, 557–67) have higher prices for vodka and cars considered, the staples'' not found; 2.4 billion rubles already cut from defense and perhaps 3 more, Kozlov, Kosygin and the Minister of Defense to recount (560), not Mikoyan. Names: Kozlov, Kosygin, Mikoyan.'
- edit:
    id: cal.1962-07-01.berlin-and-vienna
    base: 3bdd06dc
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 440–43; [[w.prezidium-tsk-kpss-1954]], I, 569–70 (Protocol 39). Check: the protocol (I, 569) lists Mikoyan present; it has nothing of the UN taking up Germany once the missiles are in Cuba. See [[cal.1962-06-10.missile-crisis]]. Names: Mikoyan, Khrushchev, McNamara, Raúl Castro.'
- edit:
    id: cal.1962-07-06.missile-crisis
    base: 842a31ec
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 444–45; [[w.prezidium-tsk-kpss-1954]], I, 571 (Protocol 40). Check: the protocol (I, 571) has Pliev to command, the defensive means first, then the others, and Kennedy''s and Rusk''s Independence Day speeches to be answered; nothing of the Cubans'' or Dementyev''s urging, or of the ships. See [[cal.1962-07.missile-crisis]]. Names: Khrushchev, Raúl Castro.'
- edit:
    id: cal.1962-10-11.south-asia
    base: 2dde9267
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 497; [[w.prezidium-tsk-kpss-1954]], I, 596 (Protocol 58). Check: the protocol (I, 596) has "seek reconciliation," a "subtle document" for both sides; the McMahon line hard for China to accept; Peking''s proposal to pull back its troops "reasonable"; Amer''s request for T-16s for Yemen "impossible.".'
- edit:
    id: cal.1962-10-14.soviet-union
    base: 2d9af219
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 460, 464, 497; [[w.prezidium-tsk-kpss-1954]], I, 616–17 (Protocol 59). Check: the protocol (I, 616) has the MiG-21s for India held back, and the initiative on a test ban before Nov. 6. Names: Khrushchev, Ulbricht.'
- edit:
    id: cal.1962-10-22.soviet-union
    base: fdb9984e
    set:
      n: '[[w.fursenko-one-hell-of-a]], 240–43; [[w.fursenko-khrushchevs-cold-war]], 468–70 (from Malin''s and Serov''s notes: Malinovsky, "some kind of preelection trick"; Khrushchev: "All we wanted to do was to threaten them"; "This may end in a big war"); [[w.prezidium-tsk-kpss-1954]], I, 617–18 (Protocol 60). Check: in Fursenko and Naftali''s later account (467–74) the session opens at 10 p.m. Moscow time, all twelve members there; Khrushchev dictates leave for Pliyev to use the tactical atomic weapons against a landing; Mikoyan objects, and after Kosygin speaks the instruction is revised: "all means except those controlled by Statsenko and Beloborodov," sent at 11:55 p.m., Malinovsky asking only that it wait for the speech''s text; Kuznetsov brings the translation at 1:15 a.m. (by Serov''s notes, RGANI, and Mikoyan''s unpublished memoir, RGASPI, cited by [[w.fursenko-khrushchevs-cold-war]], 468 n.10, 472 n.26). Penkovsky arrested just before the session: [[w.fursenko-khrushchevs-cold-war]], 476. To check: Malinovsky to Pliyev, Oct. 22, 1962, sent 2:35 p.m. Moscow time, AGSRF (cited by [[w.fursenko-one-hell-of-a]], 242 n.2, 243 n.6). See [[cal.1962-10-22.missile-crisis]]. Names: Malinovsky, Khrushchev.'
- edit:
    id: cal.1962-10-25.soviet-union
    base: de802bea
    set:
      n: '[[w.fursenko-one-hell-of-a]], 259–60; [[w.fursenko-khrushchevs-cold-war]], 483–84 ("Apparently Kennedy slept with a wooden knife"; the trade; "the rockets can appear there again"); [[w.prezidium-tsk-kpss-1954]], I, 620–22 (Protocol 61, Malin''s notes and Serov''s record). Check: by Serov''s note, Fursenko and Naftali have the colleagues vote "that night" (484), and Khrushchev ask that the last ship with "special cargo" be brought home. On [[cal.1962-10-25.missile-crisis-2|Kennedy''s letter]], delivered 1:45 a.m. Washington: [[w.fursenko-one-hell-of-a]], 259–60. Check: Malin''s notes (I, 620) have one ship with special cargo turned back, not four. To check: Khrushchev, *Khrushchev Remembers* (1970), 497 (cited by [[w.fursenko-one-hell-of-a]], 260 n.11). Check: Volkogonov''s account differs, *Sem Vozhdei*, 429–30 (259 n.9). See [[cal.1962-10-25.missile-crisis-2]]. Names: Kennedy, Khrushchev.'
- edit:
    id: cal.1962-10-28.soviet-union
    base: 369aad76
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 489–91 (from Malin''s notes; the report of a SAM fired without leave, Castro''s letter); [[w.prezidium-tsk-kpss-1954]], I, 624–25 (Protocol 63). Check: Fursenko and Naftali number the protocol 64 here (616 n.86), 63 in [[w.fursenko-one-hell-of-a]]. Check: the volume prints it as Protocol 63 (I, 624). See [[cal.1962-10-27.missile-crisis]]. Names: Khrushchev, Robert Kennedy, Dobrynin.'
- edit:
    id: cal.1962-10-28.missile-crisis-4
    base: 125d08be
    set:
      n: '[[w.fursenko-one-hell-of-a]], 291; [[w.prezidium-tsk-kpss-1954]], III, 384–85 (the instructions, P 63/IV). See [[cal.1962-10-26.soviet-union]]. Names: Castro, Scali, Kennedy.'
- edit:
    id: cal.1962-11-21.laos
    base: fec5f979
    set:
      n: '[[w.fursenko-one-hell-of-a]], 323; [[w.fursenko-khrushchevs-cold-war]], 504–05 ("We will not do it!"; "Peace has been made without winners and losers"; "We did everything we could"); [[w.prezidium-tsk-kpss-1954]], I, 646 (Protocol 68, item II). Names: Khrushchev.'
- edit:
    id: cal.1962-12-03.soviet-union
    base: 0c70ebb5
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 506–07; [[w.prezidium-tsk-kpss-1954]], I, 663 (Protocol 71). See [[cal.1962-11-29.missile-crisis]]. Names: Mikoyan, Khrushchev, Kennedy, Malinovsky.'
- edit:
    id: cal.1963-01-29.china
    base: 72b32ebe
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 510, 526; [[w.prezidium-tsk-kpss-1954]], I, 695–96 (Protocol 80). Names: Khrushchev.'
- edit:
    id: cal.1963-03-12.china
    base: 713fc507
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 515; [[w.prezidium-tsk-kpss-1954]], I, 700 (Protocol 87). See [[cal.1963-03-09.china]]. Names: Khrushchev, Mao.'
- edit:
    id: cal.1963-03-21.soviet-union-space
    base: fe7ec365
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 514; [[w.prezidium-tsk-kpss-1954]], I, 700–01 (Protocol 89). See [[cal.1963-02-09.soviet-union]]. Names: Khrushchev.'
- edit:
    id: cal.1963-06-13.soviet-union
    base: 980f19bf
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 525–26; [[w.prezidium-tsk-kpss-1954]], I, 733 (Protocol 101, continued). Check: the volume prints it as Protocol 101, continued, June 13, on Smirnov''s telegram from Bonn of June 12 (I, 732–33). See [[cal.1963-06-11.europe-and-the-alliance]]. Names: Khrushchev, Adenauer.'
- edit:
    id: cal.1963-07-23.china
    base: 8ae8a6f2
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 528; [[w.prezidium-tsk-kpss-1954]], I, 734 (Protocol 107). Check: the protocol (I, 734) has also Gromyko reading the draft test-ban treaty; a nonaggression pact between NATO and the Warsaw Pact to be sought, not tied directly to it; the communiqué approved with amendments. See [[cal.1963-07-05.china]]. Names: Khrushchev.'
- edit:
    id: cal.1964-05-26.soviet-union
    base: 1a132771
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 531; [[w.prezidium-tsk-kpss-1954]], I, 822–25 (Protocol 145). See [[cal.1964-05.middle-east]]. Names: Khrushchev, Nasser, Aref, Gromyko.'
- edit:
    id: cal.1964-07-30.soviet-union
    base: 9daeb3b3
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 532; [[w.prezidium-tsk-kpss-1954]], I, 827–28 (Protocol 152). See [[cal.1963-12-23.soviet-union]]. Names: Khrushchev.'
- edit:
    id: cal.1964-10-08.soviet-union
    base: 32e8097f
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 535; [[w.prezidium-tsk-kpss-1954]], I, 861–62 (Protocol 162). See [[cal.1964-05.soviet-union]]. Names: Suslov, Khrushchev.'
- edit:
    id: cal.1964-10-14.soviet-union
    base: e8ee5d71
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 537–38; [[w.prezidium-tsk-kpss-1954]], I, 871–72 (Malin''s notes). To check: Fursenko''s interviews with veterans of the Kremlin guard, Oct. 2005 (cited by [[w.fursenko-khrushchevs-cold-war]], 538 n.28). See [[cal.1964-10-13.soviet-union]]. Names: Mikoyan, Khrushchev, Brezhnev.'
- edit:
    id: cal.1962-10-23.soviet-union
    base: 87b52ae1
    set:
      n: '[[w.fursenko-one-hell-of-a]], 247–48; [[w.fursenko-khrushchevs-cold-war]], 476–80 (the *Aleksandrovsk* to come in; the ships in the Mediterranean home; the submarines); [[w.prezidium-tsk-kpss-1954]], I, 618–19 (Protocol 60). Check: Fursenko and Naftali''s later account (476–80) has the Presidium sit again at 10 a.m., after lunch and in the evening, Oct. 23: the ships in the Atlantic to go no farther than the approaches to Cuba; Mikoyan twice overruled on the submarines, then Gorshkov''s map, the four to hold two days'' sail from Cuba, an order none of them received; the ships with the R-14s told to turn only Oct. 25 (477 n.47). Check: the volume prints these decisions in Protocol 60, the session of Oct. 22 (I, 617–19): the ships in the Mediterranean back to the Black Sea, the ships not yet arrived turned back, the four submarines on, the *Aleksandrovsk* to the nearest port; the Warsaw Pact''s commander called in. Check: the volume''s resolution of Oct. 23 under Protocol 60, P 60/I ([[w.prezidium-tsk-kpss-1954]], III, 339–40), approves the government''s statement, the letters to Kennedy and to Castro and Zorin''s instructions; nothing of the ships or the alert. To check: the extracts of Protocol 60, APRF (cited by [[w.fursenko-one-hell-of-a]], 247 n.12, 248 n.13). See [[cal.1962-10-22.soviet-union]].'
- edit:
    id: cal.1962-10.south-asia
    base: 63f639ac
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 497; [[w.prezidium-tsk-kpss-1954]], I, 616 (Protocol 59, item 33); [[w.prezidium-tsk-kpss-1954]], I, 1108–09 n.2 (the editors). Check: the day: the work cites the Presidium''s protocols of Oct. 11 and 14 (497 n.21) and the *Post* of Oct. 30 (n.22). Check: the protocol of Oct. 14 (I, 616) has the MiG-21s for India held back, "Задержать отправку" (hold back the dispatch), not the order cancelled; no number, no December; the editors (I, 1108–09 n.2): the new MiG-21s of the agreement of Aug. 29, 1962 not sent for now. Protocol 58, Oct. 11 (I, 596), has nothing of the aircraft. To check: "MiG Deal with India Appears Off," *Washington Post*, Oct. 30, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]], 497 n.22). See [[cal.1962-10-11.south-asia]].'
