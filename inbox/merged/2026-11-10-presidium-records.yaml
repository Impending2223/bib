- edit:
    id: cal.1962-11-16.soviet-union
    base: ba32a377
    set:
      n: '[[w.fursenko-one-hell-of-a]], 306–307; [[w.fursenko-khrushchevs-cold-war]], 502–03 (Castro''s order for Nov. 17 or 18; the announcement held; every nuclear warhead to come out, the Lunas and some FKRs left without them); [[w.prezidium-tsk-kpss-1954]], I, 646 (Protocol 66); [[w.prezidium-tsk-kpss-1954]], III, 392–98 (the instructions to Mikoyan, P 66/I). Check: the instructions (III, 392–98) have the Cubans'' protest to the Security Council on the overflights, with the warning that the planes will be shot down (394); an oral assurance to Kennedy on the Il-28s if he lifts the quarantine (396); the Cubans to choose U Thant''s men, the five Latin American ambassadors or the nine neutrals (396); without Cuba''s cooperation, conclusions "in regard to our people who are in Cuba" (397); nothing of the assurance held a few days. See [[cal.1962-11-10.soviet-union]]. Names: Castro, U Thant, Khrushchev, Kennedy, Mikoyan.'
