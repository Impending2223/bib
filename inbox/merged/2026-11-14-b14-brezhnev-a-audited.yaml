- add:
    entry:
      id: cal.1966-10-21.soviet-union-leadership
      when: Oct. 21
      date: '1966-10-21'
      thread: soviet-union-leadership
      also:
      - vietnam
      - china
      c: 'Moscow. The meeting of the party and government leaders and defense ministers of Bulgaria, Czechoslovakia, the GDR, Hungary, Mongolia, Poland, Romania and the USSR, with Dorticós of Cuba, after their visit to Baikonur: Zhivkov, Novotný, Ulbricht, Kádár, Tsedenbal, Gomułka and Ceaușescu. Gromyko reports on the General Assembly and his talks with Johnson and Rusk, Gomułka on a conference of the European parties. Brezhnev''s sketches for his closing words: China, everything military; Johnson''s proposals; aid to Vietnam to go on, military, economic and political; the dispute with China no longer with its party alone.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 162–65 (№ 38, Brezhnev''s sketches for his closing speech, Oct. 21), 178, 180–81 nn.107, 138–42 (the editors: the visit to Baikonur Oct. 19–20; the meeting of Oct. 21 in Moscow and the reports; Vienna named by the Poles and French as the seat of the European parties'' meeting, Karlovy Vary chosen in February 1967). Made public: 2016. To check: the records of the meeting; the sketches are his, not the speech. Names: Dorticós, Zhivkov, Novotný, Ulbricht, Kádár, Tsedenbal, Gomułka, Ceaușescu, Gromyko, Johnson, Rusk, Brezhnev.'
