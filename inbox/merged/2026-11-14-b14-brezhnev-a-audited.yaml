    entry:
      id: cal.1968-03-06.soviet-union-leadership
      when: Mar. 6–7
      date: '1968-03-06'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Sofia. The Warsaw Pact''s Political Consultative Committee, Zhivkov opening, Gomułka presiding; the Soviet delegation Brezhnev, Kosygin, Grechko, Rusakov and Puzanov, Suslov with them. Three questions: the nonproliferation treaty, Vietnam, a staff and military council for the Joint Command. Ceaușescu tries to change the third item, citing an agreed agenda, and "meets a rebuff."'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 301–02 (№ 72, Brezhnev''s notes, "1968 г. 6 марта София. Заседание ПКК" (Mar. 6, 1968, Sofia, session of the Consultative Committee)), 339 nn.42–43 (the editors: the Soviet delegation; the three questions). Made public: 2016. To check: the stenogram or the Warsaw Pact records of the session; the notes do not say what Brezhnev or Ceaușescu said. Names: Zhivkov, Gomułka, Brezhnev, Kosygin, Grechko, Suslov, Ceaușescu.'
