- add:
    entry:
      id: cal.1966-06-16.soviet-union-leadership
      when: June 16
      date: '1966-06-16'
      thread: soviet-union-leadership
      c: 'The Politburo. Brezhnev''s notes for it: a state reserve of bread, 30 to 35 million tons; grain purchases abroad in 1966 and 1967; procurement; the failures in building, a resolution to be discussed. The Ukrainian party allowed its own Politburo, without an entry in the protocol.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 136 (№ 31, Brezhnev''s notes for the Politburo of June 16: "На ПБ" (for the Politburo)), 172 nn.29–34 (the editors: the Politburo of June 16 allowed the Ukrainian party a Politburo, without a protocol entry, and took up the grain reserve and purchases). Made public: 2016. To check: the protocol of June 16. Names: Brezhnev.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - vis:only:ussr
- add:
    entry:
      id: cal.1966-06-20.soviet-union-leadership
      when: June 20–22
      date: '1966-06-20'
      thread: soviet-union-leadership
      also:
      - europe-and-the-alliance-france
      c: 'Moscow. De Gaulle''s state visit (June 20–July 1); Brezhnev in the talks with him June 21 and 22. Brezhnev''s list of questions for them: the frontiers in Europe, the line between the two German states among them, "inviolable," and what de Gaulle has said of it; the Paris and Brussels agreements; the French troops in West Germany; nonproliferation and the Soviet position; general disarmament; a direct Moscow–Paris line.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 137–38 (№ 33, "О прямой линии связи" (on the direct line) and the notes for the talks), 172, 177–78 nn.35–40, 93–98 (the editors: the visit; the talks; the agreements of June 30). Made public: 2016. To check: the Soviet record of the talks; the notes are the list of questions, not the answers. Names: de Gaulle, Brezhnev.'
      tags:
      - polity:ussr
      - polity:fr
      - name:brezhnev-leonid
      - name:de-gaulle-charles
      - vis:only:ussr+fr
- add:
    entry:
      id: cal.1966-08-18.soviet-union-leadership
      when: Aug. 18
      date: '1966-08-18'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Yalta. Brezhnev and Ponomarev with the Italian Communist leaders, Longo, Pajetta, Alicata and Scoccimarro. His notes of Longo: the United States cannot win by arms, nor leave beaten; an Italian delegation to Vietnam; whether Moscow can speak of the socialist countries'' help to Vietnam; a conference of the parties on European security; the joining of the Communist and Social Democratic parties; the party press losing money, *L''Unità* at 290,000, and a request for material help.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 151–53 (№ 35, "Заметки Л.И. на переговорах с итальянск. тт. (Ялта, 18.8.66)" (notes of the talks with the Italian comrades, Yalta, Aug. 18, 1966)), 179 n.110 (the editors: Brezhnev and Ponomarev with Longo, Pajetta, Alicata and Scoccimarro; Longo''s question on a delegation to Vietnam). Made public: 2016. To check: the Italian record. Names: Longo, Pajetta, Brezhnev, Ponomarev.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:ponomarev-boris-n
      - vis:only:ussr
- add:
    entry:
      id: cal.1966-09-10.soviet-union-leadership
      when: Sept. 10
      date: '1966-09-10'
      thread: soviet-union-leadership
      c: 'Moscow. Ulbricht with Brezhnev (visit Sept. 10–11). His notes of Ulbricht: socialism to be built to 1975, no talk of communism; the gap with the West widening, the GDR needing computers and automatic lines, not only oil and metal; oil, 10 million tons in 1970 and 16 by 1975; Bonn tied to Washington over Vietnam; no military threat, a political and economic struggle; laws on the GDR''s citizenship.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 154–61 (№ 36, Brezhnev''s notes of Ulbricht''s statement, Sept. 10), 176, 179–80 nn.71, 119–28 (the editors: the visit Sept. 10–11 by the Politburo''s decision of Sept. 8; the congress; the oil; his plan to visit Yugoslavia; a conference on European security not now realistic). Made public: 2016. Names: Ulbricht, Brezhnev.'
      tags:
      - polity:ussr
      - polity:gdr
      - name:brezhnev-leonid
      - name:ulbricht-walter
      - vis:only:ussr+gdr
- add:
    entry:
      id: cal.1966-10-15.soviet-union-leadership
      when: Oct. 15
      date: '1966-10-15'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Moscow. Brezhnev, Kosygin, Suslov, Andropov and others in talks with Gomułka and Cyrankiewicz (in Moscow Oct. 10–15). His notes of Gomułka, Oct. 15: the war "within Vietnam," as Hanoi says; the Vietnamese party "dictates the terms of internationalism" through the aid, regardless of the givers'' views; a joint appeal of all who give aid, and consultation on ending the war; China''s "cultural revolution" a struggle inside the party.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 161–62 (№ 37, Brezhnev''s notes made during Gomułka''s speech, Oct. 15), 175, 180 nn.62–64, 135–37 (the editors: the Polish delegation Oct. 10–15 by the Politburo''s decision of Oct. 8; the Soviet side named; the Polish memorandum handed at the Warsaw Pact leaders'' meeting). Made public: 2016. To check: the Polish record. Names: Gomułka, Cyrankiewicz, Brezhnev, Kosygin, Suslov, Andropov.'
      tags:
      - polity:ussr
      - polity:poland
      - name:brezhnev-leonid
      - name:gomu-ka-w-adys-aw
      - name:kosygin-aleksei
