- add:
    entry:
      id: cal.1964-11-11.soviet-union-leadership
      when: Nov. 11
      date: '1964-11-11'
      thread: soviet-union-leadership
      also:
      - cuba
      c: 'Moscow. Brezhnev with Guevara, at the head of the Cuban delegation (Nov. 5–18), "a hard talk." Khrushchev''s pressure put in the past, Cuba asks whether the Soviet Union will say publicly that an attack on Cuba is an attack on the whole camp; the statement on Vietnam weak; Castro''s last letter asks the camp''s, or at least the Soviet Union''s, military and economic help. Castro''s question: will the Soviet Union go to war with America. Brezhnev''s note of the answer: roughly so; the point is that the Americans understand it.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 58–59 (№ 7, Brezhnev''s notes, "Тяжелый разговор" (a hard talk)), 72 nn.103–106 (the editors: the delegation in the USSR Nov. 5–18, the talk with Guevara Nov. 11; Khrushchev''s last letter to Castro of Apr. 28, 1964, Castro''s of July 4; the TASS statement on Vietnam of Sept. 22). Made public: 2016. To check: the Soviet and Cuban records of the talk; the notes after "Рауль" are struck out and not printed in full. Names: Guevara, Brezhnev, Khrushchev, Castro.'
      tags:
      - polity:ussr
      - polity:cuba
      - name:brezhnev-leonid
      - name:guevara-ernesto
      - name:khrushchev-nikita-s
      - name:castro-fidel
      - vis:only:ussr+cuba
- add:
    entry:
      id: cal.1964-11-26.soviet-union-leadership
      when: Nov. 26
      date: '1964-11-26'
      thread: soviet-union-leadership
      c: 'The Presidium. Brezhnev''s list for the session: the Rostov and Kuban obkoms, Kazakhstan; Malinovsky''s report on the Army; foreign articles "undermining the foundations of communism" and silence at home; Albania in the Political Consultative Committee; the Polish proposal of a conference on European security; Kovalev for Zakharov in Finland; Gromyko''s trip to the General Assembly and the hot line. Decided that day, by the editors: delegations of the Supreme Soviet to Turkey under Podgorny and to the UAR under Shelepin.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 51–52 (№ 3, "Заметки к заседанию Президиума ЦК КПСС 26 ноября 1964 г." (notes for the session of Nov. 26)), 70–71 nn.81–92 (the editors: the Presidium of Nov. 26 on the two delegations; Yusupov''s request to be relieved, Dec. 7, Kunaev elected; Skryabin and Solomentsev, Vorobyev; the Consultative Committee, Jan. 18–23, 1965; the Polish proposal and the reply of Nov. 19; Kovalev for Zakharov, Dec. 11; Gromyko and the Moscow–Washington line). Made public: 2016. To check: the protocol of Nov. 26; the notes are Brezhnev''s list, not the decisions. Names: Brezhnev, Malinovsky, Gromyko, Podgorny, Shelepin.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:malinovsky-rodion-y
      - name:gromyko-andrei
      - name:podgorny-nikolai-v
      - name:shelepin-aleksandr-n
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-12-15.soviet-union-leadership
      when: Dec. 15
      date: '1964-12-15'
      thread: soviet-union-leadership
      c: 'The Presidium on Khrushchev''s keep, amending its decision of Oct. 22. Brezhnev''s note of his asks: his household staff kept at pay, a larger canteen allowance, no removal from the house until a flat is found. The Presidium''s answer: a pension of 500 rubles, the Kremlin canteen, the Fourth Chief Directorate''s care for him and his wife only, a dacha on the Istra for the one at Semenovskoe, a flat in town, a Volga.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 62 (№ 9, "Хрущев Н.С. Просит" (Khrushchev asks) and "Хрущеву"), 73–74 nn.124–128 (the editors: the Presidium''s decision of Dec. 15 amends that of Oct. 22; the pension 500 rubles, in old and new money; the dacha on the Istra; the Fourth Chief Directorate for him and his wife). Made public: 2016. Names: Khrushchev, Brezhnev.'
      tags:
      - polity:ussr
      - name:khrushchev-nikita-s
      - name:brezhnev-leonid
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-04-06.soviet-union-leadership
      when: Apr. 6
      date: '1965-04-06'
      thread: soviet-union-leadership
      c: 'Warsaw. Brezhnev, at the head of the Soviet delegation (Apr. 5–9), with Gomułka and the Polish leaders. His notes of their account: the elections to the local councils and the Sejm; housing, the state to stop building after 1970 and turn to cooperatives, rents low, the member to put down 15 to 22 percent; capital investment planned two years ahead; weak design bureaus.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 80–81 (№ 14, "Записки Л.И. Брежнева — с беседы с польскими друзьями (т. Гомулкой и др.) в Варшаве. 6 апреля 1965 года" (the cover note)), 119 n.24 (the editors: the delegation in Poland Apr. 5–9, by the Presidium''s decision of Mar. 19). Made public: 2016. Names: Brezhnev, Gomułka.'
      tags:
      - polity:ussr
      - polity:poland
      - name:brezhnev-leonid
      - name:gomu-ka-w-adys-aw
      - vis:only:ussr+poland
- add:
    entry:
      id: cal.1965-05-14.soviet-union-leadership
      when: May 14
      date: '1965-05-14'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev receives Shastri, the Indian Prime Minister (visit May 12–19). His notes of Shastri: he will speak "not as a diplomat"; India''s policy friendship with all, peaceful coexistence, nonalignment, and cooperation with the Soviet Union; the Chinese aggression, Indonesia, Pakistan''s attack; he has come for support at a hard moment.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 83–84 (№ 16, Brezhnev''s notes; the cover note: "принимал премьер-министра Индии Л.Б. Шастри" (received the Prime Minister of India)), 120 nn.36–41 (the editors: the visit May 12–19 by the Presidium''s decision of May 4; the Sino-Indian border war of 1962; the Beijing–Jakarta axis; the first stage of the Indo-Pakistani conflict). Made public: 2016. Names: Shastri, Brezhnev.'
      tags:
      - polity:ussr
      - polity:india
      - name:brezhnev-leonid
      - name:shastri-lal-bahadur
      - vis:only:ussr+india
- add:
    entry:
      id: cal.1965-05-24.soviet-union-leadership
      when: May 24–25
      date: '1965-05-24'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Moscow. Brezhnev in talks with Kádár and the Hungarian delegation, on Kádár''s letter of Apr. 29. His outline for his part: at home, the March plenum on the village, a plenum on industry to come, the Twenty-third Congress "probably February 1966"; abroad, Romania in "a special position," a long disagreement with China to be lived with; Vietnam, Soviet aid considerable, Hanoi counting on a military victory, almost no information; de Gaulle might shake NATO; the Warsaw Pact''s command to be put in order; an international conference of the parties; Tito''s visit, June 18.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 84–88 (№ 17, Brezhnev''s notes, dated May 24–25), 121–22 nn.42–57 (the editors: Kádár''s letter of Apr. 29; the talks in Moscow May 24–25; the Plenums of Mar. 24–26, Sept. 27–29 and Dec. 6; the 23rd Congress; the Presidium''s decision of May 11 on Turkey; Kádár''s questions on the Warsaw Pact command). Made public: 2016. To check: whether the outline is for the talks with Kádár or with the Hungarian delegation as a whole (the notes do not name him; the editors'' note 42 ties the item to his letter). Names: Kádár, Brezhnev, Tito, de Gaulle.'
      tags:
      - polity:ussr
      - polity:hungary
      - name:brezhnev-leonid
      - name:tito-josip-broz
      - name:kadar-janos
      - name:de-gaulle-charles
      - vis:only:ussr+hungary
- add:
    entry:
      id: cal.1965-07-08.soviet-union-leadership
      when: July 8
      date: '1965-07-08'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'The Presidium, on Brezhnev''s report: more aid to the DRV, special equipment and repair plants, after the talks with Lê Thanh Nghị (the agreement of July 10); the delegation to the Romanian party''s congress approved, Brezhnev, Andropov, Komyakhov, Egorychev and Zhigalin; a 50 percent bonus on the purchase prices of wheat and rye.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 93 (№ 18, the list for the Presidium and the congress documents), 122–23, 127 nn.58, 75, 79, 95 (the editors: the Presidium of July 8 on aid to the DRV, the Romanian congress delegation, the farm prices; the talks with Lê Thanh Nghị). Made public: 2016. To check: the protocol of July 8. Names: Brezhnev, Lê Thanh Nghị, Andropov.'
      tags:
      - polity:ussr
      - polity:drv
      - name:brezhnev-leonid
      - name:andropov-yuriy-vladimirovich
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-09-07.soviet-union-leadership
      when: Sept. 7
      date: '1965-09-07'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev with Novotný, at the head of the Czechoslovak party-government delegation (Sept. 6–15). His notes of Novotný: industry up 8.7 percent in seven months, the crops short by 900,000 tons of grain, bread to be bought abroad; capital building behind; credits asked for ore, copper, lead and fertilizer; the arms, 17 air regiments for the 20; trade with the Federal Republic profitable, a meeting of the first secretaries on Bonn wanted; Ulbricht "teaches and criticizes everyone"; the Chinese "seek to provoke" a Soviet–American clash.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 107–10 (№ 19, Brezhnev''s notes; the editors call the record after the opening inexact), 129–30 nn.122–131 (the editors: the visit Sept. 6–15; Novotný''s figures and proposals; the Czechoslovak congress of May 30–June 6, 1966; the Algiers youth festival not held). Made public: 2016. Names: Novotný, Brezhnev, Ulbricht.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:novotny-antonin
      - name:ulbricht-walter
      - vis:only:ussr+czechoslovakia
- add:
    entry:
      id: cal.1965-09-27.soviet-union-leadership
      when: Sept. 27
      date: '1965-09-27'
      thread: soviet-union-leadership
      c: 'Moscow. The plenum of the Central Committee (Sept. 27–29), the first day: Kosygin''s report on the management of industry, planning and incentives. Brezhnev''s notes: a gradual transition; Gosplan an organ of the government and the Central Committee, its chairman in the Presidium; a committee for military industry under the Council of Ministers; the cross-branch enterprises to the ministries; the editor of *Pravda*.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 114–16 (№ 21, Brezhnev''s notes, "вероятно, сделанные во время доклада А.Н. Косыгина" (probably made during Kosygin''s report)), 130 nn.135–140 (the editors: Kosygin''s proposals on Gosplan, the military-industrial commission of 1957, the bonuses). Made public: 2016. To check: the Plenum''s stenogram and the report as printed in Pravda, Sept. 28. Names: Kosygin, Brezhnev.'
      tags:
      - polity:ussr
      - name:kosygin-aleksei
      - name:brezhnev-leonid
- add:
    entry:
      id: cal.1965-10-12.soviet-union-leadership
      when: Oct. 12
      date: '1965-10-12'
      thread: soviet-union-leadership
      c: 'Brezhnev to Novotný, by telephone: 800,000 tons of grain for the first half of 1966, as Novotný''s letter of Oct. 2 asked; Chervonenko, in Prague, told of the decision the same day. The Presidium had taken up the letter that day, without an entry in the protocol, and agreed to Brezhnev''s visit in mid-October.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 91 (№ 18, "12 октября 1965 г. говорил с тов. Новотным" (Oct. 12, spoke with Comrade Novotný) and the ambassador told), 122–23 nn.61, 70–71 (the editors: the Presidium of Oct. 12, no protocol entry; the grain decided Oct. 14; the talk not in the reception-room secretaries'' log). Made public: 2016. To check: the protocol of Oct. 14 on the grain. Names: Brezhnev, Novotný, Chervonenko.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:novotny-antonin
      - name:chervonenko-stepan-v
      - vis:only:ussr+czechoslovakia
- add:
    entry:
      id: cal.1965-10-13.soviet-union-leadership
      when: Oct. 13
      date: '1965-10-13'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Moscow. The first talk with Phạm Văn Đồng''s party-government delegation of the DRV (in Moscow Oct. 12–18; talks Oct. 13–15 and 18): for the Soviet side Brezhnev, Mazurov, Andropov, Kuznetsov, Zakharov, Skachkov and the ambassador Shcherbakov. Brezhnev opens on the Chinese position. The DRV asks air defense strengthened, lost arms made good, instructors, arms for the South, aluminum, machine tools, 2,000 trucks, small power plants, a long-term credit of 150 million rubles. Phạm Văn Đồng: the Americans mean to stay in the South; contacts not refused; the Chinese for talks in principle, the conditions not ripe; no unity of action while the CPSU and the Chinese party differ.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 99–104 (№ 18, Brezhnev''s notes, "Переговоры с Фам Ван Донгом" (talks with Phạm Văn Đồng), Oct. 13), 127 nn.92–100 (the editors: the delegation Oct. 12–18, talks Oct. 13–15 and 18 by the Presidium''s decision of Sept. 28; the talks with Lê Thanh Nghị in July; U Thant''s letter; Nasser''s five conditions of Sept. 9). Made public: 2016. To check: the Soviet and Vietnamese records of the talks; the identity of the DRV chief of staff named in the notes. Names: Phạm Văn Đồng, Brezhnev, Mazurov, Andropov.'
      tags:
      - polity:ussr
      - polity:drv
      - name:brezhnev-leonid
      - name:pham-van-dong
      - name:andropov-yuriy-vladimirovich
      - name:mazurov-kirill-t
      - vis:only:ussr+drv
- add:
    entry:
      id: cal.1965-10-16.soviet-union-leadership
      when: Oct. 16
      date: '1965-10-16'
      thread: soviet-union-leadership
      c: Prague. Brezhnev, in Czechoslovakia Oct. 15–17 at Novotný's invitation, meets the Czechoslovak Politburo, six and a half hours.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 104 (№ 18, "15 октября — Вечером прибыл в Прагу... имел встречу с Политбюро" (Oct. 15, arrived in Prague that evening... had a meeting with the Politburo)), 127 n.101 (the editors: the friendly visit Oct. 15–17 at Novotný''s invitation). Made public: 2016. To check: what was said; not in the volume. Names: Brezhnev, Novotný.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:novotny-antonin
