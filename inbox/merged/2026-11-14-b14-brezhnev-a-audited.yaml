patch: 2026-11-14-b14-brezhnev-a
by: 'Claude (batch 14, reader 1: Brezhnev''s workbooks, vol. I, Oct. 1964–Dec. 1969), Nov. 14, 2026; audited by Claude (Opus), batch 14 audit, Nov. 14, 2026 (each entry against its pages; c clipped to the event and quotations put in translation; one event an entry; doubles with vol. II and the khrushchev patch settled; the visibility rulings with Hungary, Bulgaria and Mongolia named; the July 8, 1968 note read as the Dubček call; the Sept. 5, 1968 and Nov. 14, 1966 dates settled by the editors'' notes and the secretaries'' record)'
ops:
- add:
    entry:
      id: cal.1964-10-15.soviet-union-leadership
      when: Oct. 15
      date: '1964-10-15'
      thread: soviet-union-leadership
      c: 'Moscow. The secretaries of the republics'' central committees, the krai committees and the obkoms meet, called by Brezhnev the day after the plenum, to carry its decision to the party aktiv. His notes: thanks for their "courage" and the Presidium''s support; Khrushchev''s style and methods and his cult criticized, and his request for release on age and health granted; the line of the Twentieth to Twenty-second Congresses, the Program and peaceful coexistence unchanged; the matter not to be narrowed to the cult; the harvest, the grain plans and potatoes first. Aktiv meetings follow, Oct. 15–17, in every republic, krai and oblast.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 42–43 (№ 2, Brezhnev''s notes "К совещанию" (for the meeting)), 65 n.21 (the editors: the meeting, called on his initiative; the aktiv meetings Oct. 15–17). Made public: 2016. To check: the stenogram or the minutes of the meeting, not printed in the volume. Names: Brezhnev, Khrushchev.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-10-29.soviet-union-leadership
      when: Oct. 29
      date: '1964-10-29'
      thread: soviet-union-leadership
      also:
      - china
      c: 'The Presidium on the invitations for Nov. 7: whether the Chinese party-government delegation is to come with the other socialist parties''; directives approved for consultations that day by the high-frequency line, Brezhnev with Gomułka, Gheorghiu-Dej and Novotný, Podgorny with Kádár and Ulbricht, Suslov with the Bulgarians. Brezhnev''s notes of the replies: Gomułka, invite the Chinese, at the top level, the Poles'' to be "simply a delegation of Poland"; Novotný, invite them, a refusal would be used against both parties, Albania not; Gheorghiu-Dej (by the editors'' guess), the moment to be used "cleverly," Romania to send a delegation.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 56–57 (№ 6, "Готовить директивы для переговоров" (prepare directives for the talks) and the replies), 72 nn.100–102 (the editors: the Presidium of Oct. 29 took up the paper of the Central Committee''s department and the Foreign Ministry on the Chinese delegation, decided on consultations that day with the leaders of the fraternal parties and approved the directives for them by the high-frequency line, given to Brezhnev, Podgorny and Suslov), 69 n.69 (the invitations fixed Oct. 30; Albania invited, absent). Made public: 2016. To check: the Polish, Czechoslovak and Romanian accounts of the calls. Names: Brezhnev, Gomułka, Gheorghiu-Dej, Novotný, Podgorny, Kádár, Ulbricht, Suslov.'
      tags:
      - polity:ussr
      - polity:poland
      - polity:czechoslovakia
      - polity:romania
