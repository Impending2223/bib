- add:
    entry:
      id: cal.1966-11-14.soviet-union-leadership
      when: Nov. 14
      date: '1966-11-14'
      thread: soviet-union-leadership
      c: 'Sofia. The Bulgarian Communist party''s Ninth Congress opens, Zhivkov presiding; Brezhnev heads the CPSU delegation (Kulakov, Lyashko, Rusakov, Organov). His marks of the speeches: Romania, Mongolia, Finland, Italy, the GDR and Yugoslavia weak; the Africans, Spain and France strong.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 165–66 (№ 39, Brezhnev''s notes in Sofia, Nov. 14–19), 181 nn.143–45 (the editors print the Congress as Dec. 14–19, against the heading; the secretaries'' record has Brezhnev leave Moscow Nov. 12 and speak Nov. 15, II, 157). Made public: 2016. Names: Zhivkov, Brezhnev.'
      tags:
      - polity:ussr
      - polity:bulgaria
      - name:brezhnev-leonid
      - name:zhivkov-todor
- add:
    entry:
      id: cal.1966-12-07.soviet-union-leadership
      when: Dec. 7–8
      date: '1966-12-07'
      thread: soviet-union-leadership
      also:
      - china
      c: 'Moscow. Brezhnev with Kim Il Sung, in the USSR in the first half of December with a party-government delegation of the DPRK. His notes of Kim: frank talks his aim, and the doctors; the party conference of Oct. 5–12 held amid China''s "cultural revolution," against left and right opportunism; Korean pilots in Vietnam, a battalion as "specialists," to become a regiment. His own: the shipments across China to stop; the Chinese to be left to fight among themselves, the CPSU carrying the banner of Marxism-Leninism; the call for a communist conference to be thought out better, lest the split be laid on the CPSU; more visits of other parties to Korea.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 167–69 (№№ 40–41, Brezhnev''s notes, Dec. 7–8, "вероятно... переговоров с партийно-правительственной делегацией КНДР во главе с Ким Ир Сеном" (probably the talks with the party-government delegation of the DPRK under Kim Il Sung)), 181 nn.146–52 (the editors: the visit by the Politburo''s decision of Dec. 4; Kim and Brezhnev at Vladivostok, May 20–21; the Korean conference of Oct. 5–12; the Korean pilots sent to Vietnam; the delegation on to Romania after Dec. 9). Made public: 2016. To check: the Korean record. Names: Kim Il Sung, Brezhnev.'
      tags:
      - polity:ussr
      - polity:dprk
      - name:brezhnev-leonid
      - name:kim-il-sung
      - vis:only:ussr+dprk
- add:
    entry:
      id: cal.1967-03-13.soviet-union-leadership
      when: Mar. 13
      date: '1967-03-13'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev with Zhivkov and the Bulgarian party-government delegation (Mar. 13–15), the first talk. His notes of Zhivkov: a new stage in drawing the economies together, direct links between enterprises, perhaps one planning organ as an experiment; energy 30 percent of Bulgaria''s investment, no way but Soviet gas and oil; Bulgaria "in debt," and a slower pace would bring unemployment; the Kremikovtsi works; timber from Mongolia and Guinea; what if something happens to Romania or Yugoslavia.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 196–97 (№ 50, "Краткая запись выступления Т. Живкова на первой беседе" (a short record of Zhivkov''s speech at the first talk)), 274 n.86 (the editors: the timber from Mongolia and Guinea). Made public: 2016. To check: the Bulgarian record; the Soviet answers, not set down. Names: Zhivkov, Brezhnev.'
      tags:
      - polity:ussr
      - polity:bulgaria
      - name:brezhnev-leonid
      - name:zhivkov-todor
      - vis:only:ussr+bulgaria
- add:
    entry:
      id: cal.1967-03-17.soviet-union-leadership
      when: Mar. 17
      date: '1967-03-17'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev with Ceaușescu and Maurer, come to discuss the draft treaty on nonproliferation. His notes: unity needed on disarmament; there will be states with and without nuclear arms, the Soviet weapon the guarantor of the socialist states'' security; the treaty limits the non-nuclear states'' peaceful use of the atom; opinion to be mobilized to press the United States. Maurer: why "impoverish our own positions" because the Americans disagree.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 198–99 (№ 52, "Беседа с т. Чаушеску" (talk with Comrade Ceaușescu), Mar. 17), 275 nn.95–97 (the editors: Ceaușescu came expressly to discuss Romania''s position on the nonproliferation treaty; the Romanian side tied the treaty to a disarmament agreement; the treaty approved by the General Assembly June 12, 1968). Made public: 2016. To check: the Romanian record. Names: Ceaușescu, Maurer, Brezhnev.'
      tags:
      - polity:ussr
      - polity:romania
      - name:brezhnev-leonid
      - name:ceausescu-nicolae
      - name:maurer-ion-gheorghe
      - vis:only:ussr+romania
- add:
    entry:
      id: cal.1967-05-22.soviet-union-leadership
      when: May 22–23
      date: '1967-05-22'
      thread: soviet-union-leadership
      also:
      - berlin-and-vienna
      c: 'Moscow. Brezhnev receives a delegation of the German Communist party, banned in the Federal Republic, under Max Reimann. His notes: the Soviet "firm position" has dispelled illusions in West Germany; Bonn''s policy unchanged in substance, the Social Democrats brought in as its support; the unions, the workers and the intelligentsia against the emergency laws; a firm line against the Kiesinger government; neo-Nazi influence to be watched, a difference between Brandt and Wehner.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 214–17 (№ 56, "Рабочие записи... во время встречи с делегацией ЦК Компартии Германии во главе с М. Рейманом" (notes during the meeting with the delegation of the German Communist party under M. Reimann), May 22–23), 282 nn.180–186 (the editors: the SED congress, the Karlovy Vary conference of Apr. 24–26, the emergency laws, Romania the exception to the firm position). Made public: 2016. To check: the German record. Names: Reimann, Brezhnev, Kiesinger, Brandt, Wehner.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:brandt-willy
      - name:reimann-max
      - name:kiesinger-kurt-georg
      - name:wehner-herbert
      - vis:only:ussr
- add:
    entry:
      id: cal.1967-06-12.soviet-union-leadership
      when: June 12
      date: '1967-06-12'
      thread: soviet-union-leadership
      also:
      - middle-east
      c: 'Moscow. Brezhnev and other leaders with Boumediene, flown in after the Six-Day War. Brezhnev''s list for the talks: how the war began and its results, the Security Council and the General Assembly, a four-power meeting, the slogan of liquidating Israel unpopular, whether to renew the war now. Boumediene''s account, as Brezhnev noted it: the Arabs have lost the first battle; Israel an imperialist base; the defeat may cost the Soviet Union its revolutionary standing in the Third World, and Moscow should ask whether to revise peaceful coexistence; the aim at least the withdrawal of troops.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 221–24 (№ 58, "К переговорам с Бумедьеном — 12го июня" (for the talks with Boumediene, June 12) and the notes of the talks), 283 n.192 (the editors: urgent help to the forces of the UAR, Syria and Algeria on the Politburo''s decisions). Made public: 2016. To check: the Soviet and Algerian records of the talks; which of the notes are Brezhnev''s questions and which Boumediene''s words (the book does not mark them). Names: Boumediene, Brezhnev.'
      tags:
      - polity:ussr
      - polity:algeria
      - name:brezhnev-leonid
      - name:boumediene-houari
      - vis:only:ussr+algeria
- add:
    entry:
      id: cal.1968-01-22.soviet-union-leadership
      when: Jan. 22
      date: '1968-01-22'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Telephone. Kádár to Brezhnev on his weekend in Slovakia with Dubček, Jan. 20–21: Dubček, in a hard place, wants to come to the USSR first, for a few days, to consult, but must first speak at home; the nationalities question to be handled warily; cadres judged by their present work, not by their part against Novotný. Brezhnev''s note of Dubček: thin and pale, an honest man who will keep to the line.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 294–96 (№ 72, Brezhnev''s notes of the telephone talk with Kádár of Jan. 22), 336 nn.5–8 (the editors: the Jan. 5 plenum of the Czechoslovak party divided the posts and elected Dubček; Brezhnev''s call with Kádár of Dec. 13, 1967; Dubček in the USSR unofficially Jan. 29–30). Made public: 2016. To check: the Hungarian record, and Kádár''s own report of the talk with Dubček. Names: Kádár, Dubček, Brezhnev, Novotný.'
      tags:
      - polity:ussr
      - polity:hungary
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:kadar-janos
      - name:dubcek-alexander
      - name:novotny-antonin
      - vis:only:ussr+hungary
- add:
    entry:
      id: cal.1968-04-19.soviet-union-leadership
      when: Apr. 19
      date: '1968-04-19'
      thread: soviet-union-leadership
      also:
      - middle-east
      c: 'Zavidovo. Brezhnev with Riad, the UAR Foreign Minister, on the Middle East. His notes: "we have done all to settle the conflict"—"all?"; a new Security Council resolution might be weaker than Resolution 242; the Council to answer for carrying it out; Arab unity a sickness to be overcome by patient work; the contacts with Jarring useful.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 315–16 (№ 73, "Рабочие записи... во время беседы с М. Риалом 19 апреля" (notes during the talk with M. Riad, Apr. 19)), 343 nn.105–107 (the editors: Resolution 242; Riad''s talks with Jarring in 1967–68, Jarring special envoy of the Secretary-General). Made public: 2016. To check: the Egyptian record. Names: Riad, Brezhnev.'
      tags:
      - polity:ussr
      - polity:uar
      - name:brezhnev-leonid
      - name:riad-mahmoud
      - vis:only:ussr+uar
- add:
    entry:
      id: cal.1968-04-22.soviet-union-leadership
      when: Apr. 22–24
      date: '1968-04-22'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Moscow. Talks with the party-government delegation of the DRV under Phạm Văn Đồng (in the USSR Apr. 20–26). Brezhnev''s sketches for his statement: the main requests granted, the rest to be taken up; Hanoi asks five surface-to-air missile regiments; if the DRV works out its initiative for contacts in detail and makes it public, the Soviet Union will back it with a large political and diplomatic effort, the contacts with the United States best held in Moscow; China might at some stage strike a bargain with the United States; Haiphong''s defense.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 316–18 (№ 74, "Наброски... к выступлению во время переговоров" (sketches for his speech during the talks), Apr. 22–24), 343 n.108 (the editors: the delegation in the USSR Apr. 20–26). Made public: 2016. To check: the Soviet and Vietnamese records; the sketches are Brezhnev''s, not what was said. Names: Phạm Văn Đồng, Brezhnev.'
      tags:
      - polity:ussr
      - polity:drv
      - name:brezhnev-leonid
      - name:pham-van-dong
      - vis:only:ussr+drv
- add:
    entry:
      id: cal.1968-07-04.soviet-union-leadership
      when: July 4
      date: '1968-07-04'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Telephone. Chervonenko, the ambassador in Prague, to Brezhnev: the Soviet assessment right, the picture in general right, the question how to set things right; the district conferences more or less satisfactory; he agrees with the Soviet judgment of the "Two Thousand Words" and of the Czechoslovak answer to it; at Ostrava Kovalčík elected.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 320–21 (№ 77, "т. Червоненко С.В. у телефона" (Comrade Chervonenko at the telephone), July 4). Made public: 2016. To check: Chervonenko''s reports to the Politburo. Names: Chervonenko, Brezhnev.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:chervonenko-stepan-v
      - vis:only:ussr
- add:
    entry:
      id: cal.1968-07-08.soviet-union-leadership
      when: July 8
      date: '1968-07-08'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Telephone. Dubček to Brezhnev, by the editors'' reading, on the Czechoslovak Presidium''s session that day: Švestka charged with a draft; the letter to be translated and discussed Monday or Tuesday; the parties that wrote, the Bulgarian, Hungarian, East German and Polish, with the CPSU; the regional conferences.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 321–22 (№ 78, "Был Президиум" (there was a Presidium), July 8; the editors: probably notes of a telephone talk with Dubček), 343–44 nn.114–16 (the editors: the Czechoslovak Presidium of July 8 on the answers to the letters of the CPSU and the other parties, and its decision to send them; the regional conferences before the Fourteenth Congress). Made public: 2016. To check: the Czechoslovak record of the Presidium of July 8. Names: Dubček, Brezhnev, Švestka.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:dubcek-alexander
      - vis:only:ussr+czechoslovakia
