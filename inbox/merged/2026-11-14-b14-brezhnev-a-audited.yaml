- add:
    entry:
      id: cal.1965-10-18.soviet-union-leadership
      when: Oct. 18
      date: '1965-10-18'
      thread: soviet-union-leadership
      c: Moscow. The Defense Council meets in the Central Committee building, 4 p.m., Brezhnev presiding.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 104 (№ 18, "18 Октября... провели заседание Совета Обороны в здании ЦК" (Oct. 18... held the Defense Council in the Central Committee building)), 122 n.61 (the editors: in Brezhnev''s office on Staraya Ploshchad; what was taken up not established). Made public: 2016. To check: the questions taken up. Check: the secretaries'' record names the Higher Military Council, 4 to 7:30 p.m., in the Presidium''s new hall (II, 78). Names: Brezhnev.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-12-02.soviet-union-leadership
      when: Dec. 2
      date: '1965-12-02'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'The Presidium. Brezhnev''s list for it and for the session of Dec. 4: a plenum to be called (Dec. 6, Baibakov on the plan and the budget); Kádár to be received (Dec. 11–13); Novotný''s invitation to a short rest declined; measures on Vietnam and a trip there; the Timiryazev Academy''s order; the group drafting the Congress report.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 105 (№ 18, Brezhnev''s notes "относящиеся к повестке заседаний Президиума ЦК КПСС 2 и 4 декабря" (for the agenda of the Presidium''s sessions of Dec. 2 and 4)), 124, 128–29 nn.88, 113–16 (the editors: the Presidium of Dec. 2 called the plenum, fixed Kádár''s visit and the Timiryazev award; Novotný answered by letter Dec. 9). Made public: 2016. To check: the protocols of Dec. 2 and 4. Names: Brezhnev, Baibakov, Kádár, Novotný.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:novotny-antonin
      - name:kadar-janos
      - name:baibakov-nikolai-k
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-12-15.soviet-union-leadership
      when: Dec. 15
      date: '1965-12-15'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev with Boumediene, the Algerian head of state, on his visit (Dec. 13–18). His notes: "we feel the imperialists'' pressure"; the Algerian events a moral success for imperialism; Boumediene''s requests; the French Communists not to attack him; the regime changed without democratic institutions.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 116 (№ 22, Brezhnev''s notes, Dec. 15–16), 130 nn.141–42 (the editors: the visit Dec. 13–18 by the Presidium''s decision of Dec. 11; the army''s removal of Ben Bella in June). Made public: 2016. To check: the requests, not set down in the notes. Names: Boumediene, Brezhnev.'
      tags:
      - polity:ussr
      - polity:algeria
      - name:brezhnev-leonid
      - name:boumediene-houari
      - vis:only:ussr+algeria
- add:
    entry:
      id: cal.1966-04-27.soviet-union-leadership
      when: Apr. 27
      date: '1966-04-27'
      thread: soviet-union-leadership
      c: 'Tashkent, the day after the earthquake. Brezhnev, there with Kosygin Apr. 26–28, hears Novikov, chairman of the government commission, and holds the meeting on the damage. His notes: some 10,800 families to be moved, tents registered, lump-sum payments watched; the homeless housed for two or three years at least; bricks from the whole country, a strong design bureau and a building industry, every republic and even cities to help, building cut elsewhere in Uzbekistan for now; a bold plan for the center.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 133–34 (№ 27, "Доклад тов. Новикова И.Т. в Ташкенте" (Comrade Novikov''s report in Tashkent); № 28, "Совещание в Ташкенте после землетрясения" (the meeting in Tashkent after the earthquake), Apr. 27), 170 nn.2–5 (the editors: the quake Apr. 26, 28 to 36 thousand buildings down, over 300,000 homeless; Brezhnev and Kosygin there Apr. 26–28; the commission set up by the Politburo Apr. 26; the resolution of June 14). Made public: 2016. Names: Brezhnev, Kosygin, Novikov.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      - vis:only:ussr
- add:
    entry:
      id: cal.1966-05-04.soviet-union-leadership
      when: May 4
      date: '1966-05-04'
      thread: soviet-union-leadership
      c: 'The Politburo, on Brezhnev''s agenda of May 3: the appeal to the voters for the Supreme Soviet elections; the Warsaw Pact''s Consultative Committee at Bucharest prepared, with meetings of the defense and foreign ministers; Brezhnev to Romania to meet Ceaușescu (May 10–13); Kosygin''s trip to the UAR and Nasser''s questions; Kim Il Sung''s request for an unofficial meeting, granted; grain procurement; trade with Singapore; the plenum''s papers; the reply to the Turks on Patolichev''s trip; Brazil.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 134–35 (№ 29, "Повестка ПБ на 3 мая" (the Politburo''s agenda for May 3), Brezhnev''s notes for the session), 170–71 nn.6–18 (the editors: the Politburo of May 4; the Bucharest meeting July 4–6; the trips to Romania and the UAR; Kim Il Sung''s request for an unofficial meeting, held at Vladivostok, the talks May 20–22). Made public: 2016. To check: the protocol of May 4. Names: Brezhnev, Kosygin, Ceaușescu, Nasser, Kim Il Sung, Patolichev.'
