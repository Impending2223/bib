    entry:
      id: cal.1968-04-09.soviet-union-leadership
      when: Apr. 9–10
      date: '1968-04-09'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Moscow. The plenum of the Central Committee. Brezhnev reports on the international situation and the CPSU''s struggle for the unity of the world communist movement. His marks of the speakers: Grishin; Shelest, to make public that Maurer laid a wreath at Mannerheim''s grave; Kunaev on a Chinese television center near the border; Tolstikov on admission to the colleges; Masherov, Rashidov, Katushev and others.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 302–03 (№ 72, Brezhnev''s notes at the plenum, Apr. 9–10), 339 nn.45–46 (the editors: the report; the plenum of Apr. 9–10). Made public: 2016. To check: the plenum''s stenogram; the notes are Brezhnev''s marks of the speakers, not their words. Names: Brezhnev, Grishin, Shelest, Maurer, Kunaev, Katushev.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:shelest-petro-y
      - name:maurer-ion-gheorghe
      - name:katushev-konstantin-f
- add:
    entry:
      id: cal.1968-09-05.soviet-union-leadership
      when: Sept. 5
      date: '1968-09-05'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'The Politburo, after Brezhnev''s meeting that morning with the ambassadors to the socialist countries. His notes: back from Moscow, they "all speak of unity," a harmful slogan; the petty bourgeoisie the force the counterrevolution used; Prague''s propaganda plays up Smrkovský, not Svoboda, Černík and Husák; each country''s ambassador to be heard in the Politburo; powerful transmitters at Brest; ambassadors on the military councils; Yugoslavia the center of revisionism; Romania, some contact, no open criticism. Baibakov''s paper on wider economic ties with Bulgaria.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 322–24 (№ 79, Brezhnev''s notes, dated September), 344 nn.117–24 (the editors: the notes to "Пиллер" are his at the Politburo of Sept. 5, 322 n.d; before it his meeting with the ambassadors, which he reported, and Chervonenko''s information; Baibakov''s paper on Bulgaria; the letter to Romania of Aug. 24). Made public: 2016. To check: the protocol of Sept. 5. Names: Smrkovský, Svoboda, Černík, Husák, Baibakov, Brezhnev.'
      tags:
