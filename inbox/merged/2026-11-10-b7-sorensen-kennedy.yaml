- add:
    entry:
      id: cal.1961-03-21.testing
      when: Mar. 21
      date: '1961-03-21'
      thread: testing
      c: Geneva. The Conference on the Discontinuance of Nuclear Weapon Tests resumes. The Soviet delegation, before hearing
        the new American proposals, demands a tripartite administrator, a troika, with a veto over inspection.
      n: '[FRUS 1961–63, VII–IX, microfiche supp., doc. 7](https://history.state.gov/historicaldocuments/frus1961-63v07-09mSupp/d7)
        (the conference resuming Mar. 21; the delegation''s instructions, Mar. 15: present the new proposals in the early
        meetings); [FRUS 1961–63, VII–IX, microfiche supp., doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v07-09mSupp/d9)
        (the demand made before the American proposals were heard). [[w.sorensen-kennedy]], 293 (Mar. 21, the troika veto
        over all inspection). Dean''s cable on it: [[cal.1961-03-24.testing]].'
      src:
        c: 503b3de7
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v07-09mSupp/d7: A'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v07-09mSupp/d9: B'
        - 'w.sorensen-kennedy 293: all'
- add:
    entry:
      id: cal.1961-03-24.testing
      when: Mar. 24
      date: '1961-03-24'
      thread: testing
      c: 'Dean from Geneva, Supnu 1428: why the Soviets, before hearing any American proposal, demanded a tripartite administrator,
        an absolute veto on the control system. Four guesses: a known impossible condition, to put the break on Washington;
        delay, or concessions on inspections and staffing; an occasion to end the talks; no single administrator as a precedent
        for general disarmament. Tsarapkin noncommittal, friendly.'
      n: '[FRUS 1961–63, VII–IX, microfiche supp., doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v07-09mSupp/d9).
        See [[cal.1961-03-21.testing]]. Names: Dean, Tsarapkin.'
      tags:
      - name:dean-arthur-h
      - name:tsarapkin-semen-k
