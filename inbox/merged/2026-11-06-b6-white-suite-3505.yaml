ops:
- add:
    entry:
      id: cal.1962-06-20.goldwater
      when: June 20
      date: '1962-06-20'
      thread: goldwater
      c: 'New York, a lunch, by White''s account. The president of a corporation, once White''s client, hints at a responsible
        place in his firm; later a firm offer, at a salary well above anything in politics. The draft group''s money running
        out, White turns it down: "close to treason to desert my friends in the group."'
      n: '[[w.white-suite-3505]], 69. See [[cal.1962-06.goldwater]]. Check: the day of the refusal. Names: White.'
      tags:
      - name:white-f-clifton
      src:
        c: 330c9501
        rows:
        - 'w.white-suite-3505 69: all'
- add:
    entry:
      id: cal.1963-09.goldwater-6
      when: Sept., early fall
      date: 1963-09
      thread: goldwater
      c: New York to Washington, a commercial flight, by White's account. Kitchel with Goldwater and a Republican Senator,
        talking politics all the way down; at the end Kitchel asks the Senator his line of work.
      n: '[[w.white-suite-3505]], 200. See [[cal.1963-09.goldwater-3]]. Check: the day; the Senator unnamed. Names: Kitchel,
        Goldwater.'
      tags:
      - name:kitchel-denison
      - name:goldwater-barry-m
      src:
        c: '90773447'
        rows:
        - 'w.white-suite-3505 200: all'
- add:
    entry:
      id: cal.1964-01-09.goldwater-4
      when: Jan. 9
      date: '1964-01-09'
      thread: goldwater
      follows:
      - cal.1964-01-09.goldwater-2
      c: Pease Air Force Base, N.H., the storm closing in, by White's account. A reporter asks a ride to Washington on Goldwater's
        plane if Logan is closed; Tony Smith, Goldwater's press aide, agrees. An Air Force major, back from the tower with
        Logan's weather, has the plane's door slammed in his face, Goldwater standing just inside. Never in the press.
      n: '[[w.white-suite-3505]], 285–86. See [[cal.1964-01-09.goldwater-2]]. Names: Goldwater.'
      tags:
      - name:goldwater-barry-m
      src:
        c: 57755e62
        rows:
        - 'w.white-suite-3505 285–86: all'
