      c: 'The Senate Caucus Room, where his brother had announced in 1960: Robert Kennedy a candidate for the Democratic nomination.
        "I do not run for the Presidency merely to oppose any man but to propose new policies."'
      n: '[*New York Times*, Mar. 17, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/17/issue.html). [[w.schlesinger-robert-kennedy-and-his]],
        851–57 (the Caucus Room; not the quotation); [[w.dallek-flawed-giant]], 527–28 (the announcement); [[w.clifford-counsel-to-the-president-2]],
        502–05 (the announcement, Mar. 16); [[w.white-making-of-the-president-1969]], 166 (the Caucus Room); [[w.shesol-mutual-contempt]],
        422–23 (the announcement: "I do not run for the Presidency merely to oppose any man but to propose new policies";
        "My decision reflects no personal animosity or disrespect toward President Johnson"; at the press conference after:
        "it''s been put in the context of a personal struggle between myself and President Johnson"); [[w.bernstein-guns-or-butter]],
        501 (the Caucus Room; "I do not run for the Presidency merely to oppose any man"); [[w.thomas-robert-kennedy]], 360
        (the Senate Caucus Room reserved; "I do not run for the presidency merely to oppose any man, but to propose new policies").
        [[w.berman-lyndon-johnsons-war]], 187 (the announcement, Mar. 16). [[w.longley-lbjs-1968]], 76–78 (the announcement);
        [[w.palermo-in-his-own-right]], 143–44 (the Caucus Room and the quotation). Check: Bernstein dates the announcement
        Mar. 15 (501) and Mar. 16 (480, 505). To check: [[w.witcover-85-days]]; [[w.newfield-robert-kennedy]]; [[w.clarke-last-campaign]];
        "Statement of Senator Robert F. Kennedy, Washington, DC, March 16, 1968," Edelman Papers, box 11, JFK Library; "Transcript,
        3/16 RFK Announcement, Senate Caucus," 1968 Presidential Campaign Files, Media Division, box 3, JFK Library (cited
        by [[w.shesol-mutual-contempt]], 422). See [[cal.1968-03-14.robert-kennedy]]. Names: Robert Kennedy.'
