- edit:
    id: cal.1968-03-14.robert-kennedy
    base: 48b36671
    set:
      when: Mar. 14
      c: 'Robert Kennedy and Sorensen with Clifford at the Pentagon: Kennedy would stay out of the race if Johnson named a
        commission to review the war''s policy, Kennedy and nine others its members; Johnson refuses.'
      n: 'FRUS 1964–68, VI, doc. [123](https://history.state.gov/historicaldocuments/frus1964-68v06/d123). [Johnson and Daley,
        5:00 p.m., Mar. 13](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-and-office-conversation-march-13),
        Conversation WH6803-02-12810 (Miller Center). [[w.schlesinger-robert-kennedy-and-his]], 851–57 (the meeting with Clifford,
        by Clifford''s memorandum; Johnson''s refusal); [[w.dallek-flawed-giant]], 527–28 (Kennedy to Clifford, Mar. 14; Johnson''s
        refusal); [[w.clifford-counsel-to-the-president-2]], 502–05 (Edward Kennedy''s call before midnight, Mar. 13; Johnson
        and Fortas in the bedroom, Mar. 14; the meeting at 11 a.m., the ten names; Clifford''s three comments; Johnson, Humphrey
        and Fortas at 3:30 p.m.; Clifford''s call to Sorensen and Kennedy, Johnson listening); [[w.white-making-of-the-president-1969]],
        163–64 (Mar. 13, Kennedy to Daley, Daley to Johnson; Mar. 14, nearly two hours with Clifford; Johnson''s no at five);
        [[w.shesol-mutual-contempt]], 420 (from Clifford''s memorandum of the meeting; it and his memoirs differ); [[w.thomas-robert-kennedy]],
        359–60 (the peace commission, from Clifford''s memorandum); [[w.branch-at-canaans-edge]], 710 (Johnson listening on
        an extension); [[w.humphrey-education-of-a-public-1976]], 363–64 (a Kennedy commission to examine the war, the price
        of staying out of the primaries; Clifford sent by the President to hear it and refuse it); [[w.barrett-uncertain-warriors]],
        138 (Kennedy through Clifford: he would stay out of the race if Johnson named a commission, its members of Kennedy''s
        suggestion, to reevaluate the war; Johnson told Clifford to reject it; Sorensen reached by an aide; no day). [[w.longley-lbjs-1968]],
        76–78 (Kennedy and Sorensen with Clifford; Johnson''s refusal); [[w.palermo-in-his-own-right]], 135–37 (the meeting
        at the Pentagon at eleven, by Clifford''s memorandum, and its list; Johnson''s refusal, with Fortas and Humphrey).
        [[w.chester-american-melodrama]], 120–24 (Daley''s idea of Feb. 8; the meeting of Mar. 14, both accounts; the refusal
        by telephone that night). To check: New York Times, March 18, 1968, p. 1 (cited by [[w.branch-at-canaans-edge]], 710);
        The White House account of the Clifford meeting of Mar. 14, 1968 (cited by [[w.chester-american-melodrama]], 121);
        Robert Kennedy''s office''s account of the Sorensen and Clifford meetings, Mar. 1968 (cited by [[w.chester-american-melodrama]],
        121). See [[cal.1968-03-11.robert-kennedy-campaign]]. Names: Robert Kennedy, Sorensen, Clifford, Johnson. Check: Palermo,
        136, has Edward Kennedy telephoning Clifford at home on the evening of Mar. 13, and the commission Daley''s idea of
        early February.'
