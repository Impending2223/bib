patch: 2026-11-06-b6-fursenko-one-hell-of-a
by: 'Claude (batch 6: the private, social and draft rows re-ruled under R18 as amended Nov. 6, 2026; Fursenko and Naftali,
  "One Hell of a Gamble"), Nov. 10, 2026'
ops:
- add:
    entry:
      id: cal.1960-07-31.cuba
      when: July 31
      date: '1960-07-31'
      thread: cuba
      also:
      - soviet-union
      c: 'Alekseyev to Moscow: Castro''s "deep gratitude to the Soviet government and especially N. S. Khrushchev for the
        satisfaction of all requests for the supply of military weapons." The same telegram: Czechoslovakia and Cuba signed
        July 29 for "special property," 130 million rubles of arms without repayment, 114 million of it from the Soviet Union.'
      n: '[[w.fursenko-one-hell-of-a]], 55 & n.75. To check: Alekseyev''s telegram, July 31, 1960, as reported in Protocol
        294, the Presidium of Aug. 4, 1960, f. 3, op. 65, d. 871, 102–8, APRF (cited by [[w.fursenko-one-hell-of-a]], 55 n.75).
        Made public: [[w.fursenko-one-hell-of-a]] (1997). Names: Castro, Khrushchev.'
      src:
        c: 243b0cb5
        rows:
        - 'w.fursenko-one-hell-of-a 55: all'
        - 'via x.1960-07-31.alekseyev-to-moscow-castro-gratitude: all'
      tags:
      - name:castro-fidel
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-10-18.missile-crisis-excomm-2
      when: Oct. 18
      date: '1962-10-18'
      thread: missile-crisis-excomm
      c: 'Sorensen drafts an address for the President to follow an air attack on Cuba: an invitation to Moscow to a summit,
        and a pledge to remove the American IRBMs from Turkey and Italy in time.'
      n: '[[w.fursenko-one-hell-of-a]], 245. Check: the draft itself (no note). See [[cal.1962-10-18.missile-crisis-6]]. Names:
        Sorensen.'
      src:
        c: b34ec8b5
        rows:
        - 'w.fursenko-one-hell-of-a 245: all'
      tags:
      - name:sorensen-theodore-c
- add:
    entry:
      id: cal.1962-10-22.soviet-union-2
      when: Oct. 22
      date: '1962-10-22'
      thread: soviet-union
      also:
      - missile-crisis-diplomacy
      c: 'The night after the address, Khrushchev sleeps on a couch in his office, in his clothes: "I was ready for alarming
        news to come any moment, and I wanted to be ready to react immediately." By his memoir.'
      n: '[[w.fursenko-one-hell-of-a]], 248 & n.16 (the night Oct. 22, by the Kremlin''s documents). To check: [[w.khrushchev-khrushchev-remembers]],
        497 (cited by [[w.fursenko-one-hell-of-a]], 248 n.16). Check: the day; Khrushchev gives none. See [[cal.1962-10-22.soviet-union]].
        Names: Khrushchev.'
      src:
        c: b42c95c3
        rows:
        - 'w.fursenko-one-hell-of-a 248: all'
        - 'via w.fursenko-one-hell-of-a 248 n.16: all'
      tags:
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-11-14.cuba
      when: Nov. 14
      date: '1962-11-14'
      thread: cuba
      also:
      - missile-crisis-settlement
      c: 'Havana. The Cubans set no meetings with Mikoyan for Wednesday or Thursday. He sends Alekseyev to Dorticós: the Cubans
        angry that the draft Kuznetsov gave Stevenson differs from the one Castro approved. After consulting Castro, Dorticós
        agrees Castro will dine at the embassy, 8 p.m. Thursday.'
      n: '[[w.fursenko-one-hell-of-a]], 304 & nn.61–62. To check: Mikoyan to Khrushchev, Nov. 17, 1962, f. 3, op. 65, d. 911,
        100–103, APRF (cited by [[w.fursenko-one-hell-of-a]], 304 n.61). Made public: [[w.fursenko-one-hell-of-a]] (1997).
        Names: Mikoyan, Dorticós, Kuznetsov, Stevenson, Castro.'
      src:
        c: e0d9a82e
        rows:
        - 'w.fursenko-one-hell-of-a 304: all'
        - 'via x.1962-11-17.mikoyan-to-khrushchev: all'
      tags:
      - name:mikoyan-anastas
      - name:dorticos-torrado-osvaldo
      - name:kuznetsov-vasily-v
      - name:stevenson-adlai-e
      - name:castro-fidel
- add:
    entry:
      id: cal.1963-11-22.soviet-union-2
      when: Nov. 22
      date: '1963-11-22'
      thread: soviet-union
      also:
      - assassination
      c: Moscow, the evening. Gromyko tells Khrushchev that Kennedy is dead. The confidential channel through Karpovich of
        the KGB, which Kennedy had sought through Salinger on Sept. 30 and Khrushchev approved, goes unused.
      n: '[[w.fursenko-one-hell-of-a]], 339 & n.1. To check: Semichastny to Khrushchev, Oct. 2, 1963, on the channel (cited
        by [[w.fursenko-one-hell-of-a]], 339 n.1). See [[cal.1963-11-22.soviet-union]]. Names: Gromyko, Khrushchev, Kennedy,
        Salinger.'
      src:
