patch: mil3-futrell
by: 'Claude (the military re-read, third run: Futrell, The Advisory Years to 1965, 1981), Nov. 5, 2026'
ops:
- add:
    entry:
      id: cal.1961-05-19.vietnam
      when: May 19
      date: '1961-05-19'
      thread: vietnam
      c: 'The Joint Chiefs'' committee proposes objectives for American forces that might go to Vietnam: deter North Vietnam
        and China, free Vietnamese forces for operations, train local troops, form a nucleus for a buildup, show firmness;
        two training centers, each run by a reinforced infantry battalion; minimal air and naval forces against infiltration.'
      n: '[[w.futrell-united-states-air-force]], 70. See [[cal.1961-05-11.vietnam]].'
      src:
        c: dccf3e9a
        rows:
        - 'w.futrell-united-states-air-force 70: all'
- add:
    entry:
      id: cal.1961-09-19.vietnam
      when: Sept. 19
      date: '1961-09-19'
      thread: vietnam
      c: Zuckert recommends to McNamara that a detachment of the 4400th Combat Crew Training Squadron (Jungle Jim), just operationally
        ready, go to Vietnam, to gain counterinsurgency experience and train the Vietnamese.
      n: '[[w.futrell-united-states-air-force]], 79–80. See [[cal.1961-09-05.vietnam]]. Names: Zuckert, McNamara.'
      src:
        c: db7a2755
        rows:
        - 'w.futrell-united-states-air-force 79–80: all'
      tags:
      - name:zuckert-eugene-m
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1962-01-02.vietnam
      when: Jan. 2–14
      date: '1962-01-02'
      thread: vietnam
      c: 'Transports of the 315th Air Division airlift the tactical air control system''s men and equipment into South Vietnam:
        the 5th Tactical Control Group at Tân Sơn Nhứt and Đà Nẵng, Vietnamese at Pleiku; communications circuits to Đà Nẵng,
        Biên Hòa, Pleiku. Feb. 15, five Air Force forward air controllers arrive.'
      n: '[[w.futrell-united-states-air-force]], 106.'
      src:
        c: 52b28a1d
        rows:
        - 'w.futrell-united-states-air-force 106: all'
- add:
    entry:
      id: cal.1962-01-05.vietnam
      when: Jan. 5
      date: '1962-01-05'
      thread: vietnam
      c: 'An operation to rescue prisoners from a Viet Cong camp near Saigon: a Vietnamese forward air controller directs
        AD-6s, T-28s and B-26s; thirty-one helicopters carry in 1,000 Vietnamese troops. The information proves wrong.'
      n: '[[w.futrell-united-states-air-force]], 128.'
      src:
        c: 788674d4
        rows:
        - 'w.futrell-united-states-air-force 128: all'
- cite:
    id: cal.1962-02-27.vietnam
    item: '[[w.futrell-united-states-air-force]], 129 (the two pilots divert their AD-6s from a strike in the delta; two flights
      of AD-6s scrambled; one attacker downed and captured, the other crash-lands at Phnom Penh; a vendetta against Nhu; Diệm
      grounds the air force, then allows only 20-mm ammunition)'
- check:
    id: cal.1962-02-27.vietnam
    text: 'Check: Futrell dates it the morning of Feb. 26 (129).'
- add:
    entry:
      id: cal.1962-03-01.vietnam-2
      when: Mar. 1
      date: '1962-03-01'
      thread: vietnam
      c: The night of Mar. 1, the Viet Cong storm an outpost some thirty miles north of Saigon; an SC-47 flareship and two
        T-28s, vectored by radar at Tân Sơn Nhứt, strike by flarelight; the attack broken off, the outpost held; five bodies
        found next day.
      n: '[[w.futrell-united-states-air-force]], 121.'
      src:
        c: b0d905d4
        rows:
        - 'w.futrell-united-states-air-force 121: all'
- add:
    entry:
      id: cal.1962-03-02.vietnam
      when: Mar. 2
      date: '1962-03-02'
      thread: vietnam
      c: 'On II Corps''s request, two Vietnamese AD-6s and a Farm Gate B-26 strike a Viet Cong meeting at Hung Nhon, some
        105 miles northeast of Saigon, napalm and fragmentation bombs: at least twelve killed.'
      n: '[[w.futrell-united-states-air-force]], 121, 137. Check: Futrell dates the strike Mar. 3 (121) and Mar. 2 (137).'
      src:
        c: 3145b412
        rows:
        - 'w.futrell-united-states-air-force 121, 137: all'
- add:
    entry:
      id: cal.1962-03-03.vietnam
      when: Mar. 3
      date: '1962-03-03'
      thread: vietnam
      c: 'Nolting meets Harkins, Timmes, Jablonsky and Anthis on Jablonsky''s report that the Viet Cong exploit air strikes
        for propaganda; Nolting thinks of curbing air activity; Harkins: tighter curbs would help only the Viet Cong. Reexamined
        at the Honolulu conference, Mar. 21: McNamara lets air operations go on under strict controls.'
      n: '[[w.futrell-united-states-air-force]], 137–38. See [[cal.1962-03-02.vietnam]]. Names: Nolting, Harkins, Anthis,
        McNamara.'
      src:
        c: 1bc1f123
        rows:
        - 'w.futrell-united-states-air-force 137–38: all'
      tags:
      - name:nolting-frederick-e-jr
      - name:harkins-paul-d
      - name:anthis-rollen-h
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1962-03-04.vietnam
      when: Mar. 4
      date: '1962-03-04'
      thread: vietnam
      c: A Vietnamese L-19 spots a Viet Cong company some thirty miles northeast of Tân Sơn Nhứt; Vietnamese AD-6s, with cannon
        only, bombs forbidden them, and Farm Gate strike; the Vietnamese claim fifty to sixty dead, an American adviser twenty-five.
      n: '[[w.futrell-united-states-air-force]], 121–22. See [[cal.1962-03-01.vietnam-2]].'
      src:
        c: f4fd64a9
        rows:
        - 'w.futrell-united-states-air-force 121–22: all'
- add:
    entry:
      id: cal.1962-06-05.vietnam
      when: June 5
      date: '1962-06-05'
      thread: vietnam
      c: 'A demonstration of the fire brigade, a quick-reaction force on thirty minutes'' alert: five C-123s, five C-47s and
        an L-19 drop all its 500 Vietnamese paratroopers.'
      n: '[[w.futrell-united-states-air-force]], 112.'
      src:
        c: 1b4dd74b
        rows:
        - 'w.futrell-united-states-air-force 112: all'
- add:
    entry:
      id: cal.1962-06-15.vietnam
      when: June 15
      date: '1962-06-15'
      thread: vietnam
      c: Twelve C-123s of the 777th Troop Carrier Squadron, from Pope, N.C., arrive at Đà Nẵng, the second C-123 unit; four
        more go on to Thailand.
      n: '[[w.futrell-united-states-air-force]], 111.'
      src:
        c: 03aece39
        rows:
        - 'w.futrell-united-states-air-force 111: all'
- add:
    entry:
      id: cal.1962-07-21.vietnam
      when: July 21
      date: '1962-07-21'
      thread: vietnam
      c: Felt orders three Navy AD-5Q interceptors from Cubi Point, the Philippines, to relieve the F-102s at Tân Sơn Nhứt;
        thereafter the two alternate in six-week tours. Aug. 22, MACV orders every American military aircraft so equipped
        to emit IFF.
      n: '[[w.futrell-united-states-air-force]], 131. Names: Felt.'
      src:
        c: 4c75c136
        rows:
        - 'w.futrell-united-states-air-force 131: all'
      tags:
      - name:felt-harry-d
- add:
    entry:
      id: cal.1962-08-20.vietnam-diplomacy
      when: Aug. 20
      date: '1962-08-20'
      thread: vietnam-diplomacy
      c: Cambodia, threatened by South Vietnam and Thailand, asks Kennedy for a neutral status like Laos's; Diệm resents the
        implication.
      n: '[[w.futrell-united-states-air-force]], 140. Names: Diệm.'
      src:
        c: 1f16fe46
        rows:
        - 'w.futrell-united-states-air-force 140: all'
      tags:
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1962-09-10.vietnam-diplomacy
      when: Sept. 10
      date: '1962-09-10'
      thread: vietnam-diplomacy
      c: Sihanouk charges that South Vietnamese amphibious craft under air cover violated Cambodian soil; more would mean
        a break in relations, recognition of North Vietnam, closer ties with China.
      n: '[[w.futrell-united-states-air-force]], 141. See [[cal.1962-08-20.vietnam-diplomacy]]. Names: Sihanouk.'
      src:
        c: 2c53ada3
        rows:
        - 'w.futrell-united-states-air-force 141: all'
      tags:
      - name:norodom-sihanouk
- add:
    entry:
      id: cal.1962-08-28.vietnam
      when: Aug. 28
      date: '1962-08-28'
      thread: vietnam
      c: A Farm Gate T-28 shot down. Oct. 17, a U-10; Nov. 5, a low-flying B-26.
      n: '[[w.futrell-united-states-air-force]], 146.'
      src:
        c: 412e4f4c
        rows:
        - 'w.futrell-united-states-air-force 146: all'
- add:
    entry:
      id: cal.1962-09-22.vietnam
      when: Sept. 22
      date: '1962-09-22'
      thread: vietnam
      c: At Đà Nẵng the 2d Division's commander plans a heliborne attack for Sept. 24; the six T-28s on hand too few for its
        support; put off until fresh aircraft come, it goes Sept. 26, the Viet Cong gone.
      n: '[[w.futrell-united-states-air-force]], 146.'
      src:
        c: 7f9e0465
        rows:
        - 'w.futrell-united-states-air-force 146: all'
- add:
    entry:
      id: cal.1962-10-03.vietnam
      when: Oct. 3
      date: '1962-10-03'
      thread: vietnam
      c: For the air campaign against War Zones D and X, the 5th Division submits 129 targets; Diệm orders a five-day bombing
        of Zone D from Nov. 1, then a Special Forces penetration.
      n: '[[w.futrell-united-states-air-force]], 140. Names: Diệm.'
      src:
        c: 08e86318
        rows:
        - 'w.futrell-united-states-air-force 140: all'
      tags:
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1962-11-20.vietnam
      when: Nov. 20
      date: '1962-11-20'
      thread: vietnam
      c: 'Zone D: AD-6s bomb before the landing; five Mule Train C-123s and twelve Vietnamese C-47s drop 500 paratroopers
        at a base camp on its eastern edge. Dec. 19, the troops move in under eighty-foot canopy, eight interdiction strikes
        and close support; B-26 napalm Dec. 23; a B-26 and two T-28s Jan. 1, 1963.'
      n: '[[w.futrell-united-states-air-force]], 156. See [[cal.1962-10-03.vietnam]].'
      src:
        c: d4114de2
        rows:
        - 'w.futrell-united-states-air-force 156: all'
- add:
    entry:
      id: cal.1962-12-14.vietnam
      when: Dec. 14
      date: '1962-12-14'
      thread: vietnam
      c: Harkins asks for four more Army OV-1 Mohawks, citing their results, though armed and flying with Americans aboard.
      n: '[[w.futrell-united-states-air-force]], 148. Names: Harkins.'
      src:
        c: 8b3a8a94
        rows:
        - 'w.futrell-united-states-air-force 148: all'
      tags:
      - name:harkins-paul-d
- add:
    entry:
      id: cal.1963-01-10.vietnam
      when: Jan. 10
      date: '1963-01-10'
      thread: vietnam
      c: An Army OV-1 lost on an unreported flight out of Qui Nhơn; over 250 search sorties to find it. In March the Flight
        Service Center and Network set up at Tân Sơn Nhứt.
      n: '[[w.futrell-united-states-air-force]], 170.'
      src:
        c: 9e75d67f
        rows:
        - 'w.futrell-united-states-air-force 170: all'
- add:
    entry:
      id: cal.1963-10-19.vietnam-operations
      when: Oct. 19
      date: '1963-10-19'
      thread: vietnam
      c: Near Sóc Trăng, T-28s support the first helicopter lift; stiffer fire pins down the second, and hits a B-26 and a
        T-28, which leave their stations.
      n: '[[w.futrell-united-states-air-force]], 184. See [[cal.1963-09-10.vietnam-operations]].'
      src:
        c: 7f0a67fe
        rows:
        - 'w.futrell-united-states-air-force 184: all'
- add:
    entry:
      id: cal.1963-11-07.vietnam-operations
      when: Nov. 7
      date: '1963-11-07'
      thread: vietnam
      c: Some 200 Viet Cong attack a pagoda and hole up in a fishing settlement some twenty miles from Sóc Trăng; surrounded
        by regulars and the Civil Guard, they are left to four T-28s' repeated strikes, no assault made.
      n: '[[w.futrell-united-states-air-force]], 184. See [[cal.1963-10-19.vietnam-operations]].'
      src:
        c: c56c4c1b
        rows:
        - 'w.futrell-united-states-air-force 184: all'
- cite:
    id: cal.1961-02-01.defense
    item: '[[w.futrell-united-states-air-force]], 63 (Kennedy directs McNamara to expand the counterinsurgency forces)'
- cite:
    id: cal.1963-05-06.vietnam-force-levels
    item: '[[w.futrell-united-states-air-force]], 185 (Nolting on relations with Diệm, at the Secretary of Defense Conference)'
- add:
    entry:
      id: cal.1963-08.vietnam-diplomacy-2
      when: Aug., late
      date: 1963-08
      thread: vietnam
      c: Cambodia breaks diplomatic relations with South Vietnam, citing border violations and the treatment of the Buddhists.
        At the request of Asian and African members, U Thant writes Diệm on the Buddhists.
      n: '[[w.futrell-united-states-air-force]], 188. Check: the days; the copy read drops them. Names: Diệm, U Thant.'
      src:
        c: 70a02732
        rows:
        - 'w.futrell-united-states-air-force 188: all'
      tags:
      - name:ngo-dinh-diem
      - name:u-thant
- check:
    id: cal.1963-08.vietnam-diplomacy
    text: 'Check: Futrell dates de Gaulle''s offer of his good offices two days after Cambodia broke relations with South
      Vietnam (188).'
- add:
    entry:
      id: cal.1963-11-08.vietnam
      when: Nov. 8
      date: '1963-11-08'
      thread: vietnam
      c: The United States recognizes the new government in Saigon.
      n: '[[w.futrell-united-states-air-force]], 191. See [[cal.1963-11-04.vietnam-3]].'
      src:
        c: 59f7e4a3
        rows:
        - 'w.futrell-united-states-air-force 191: all'
- add:
    entry:
      id: cal.1963-12-06.vietnam-operations
      when: Dec. 6
      date: '1963-12-06'
      thread: vietnam
      c: An L-19 and two T-28s answer a request for an immediate strike on a Viet Cong battalion; ten minutes out, the controller
        turns back to refuel at Tây Ninh, and the three lunch while refueling.
      n: '[[w.futrell-united-states-air-force]], 197.'
      src:
        c: 9cfb7e6b
        rows:
        - 'w.futrell-united-states-air-force 197: all'
- add:
    entry:
      id: cal.1964-02-06.vietnam-operations
      when: Feb. 6
      date: '1964-02-06'
      thread: vietnam
      c: Before dawn, nearly a thousand guerrillas drive the militia out of Ben Cau and make the villagers dig firing positions
        while they wait for the government's forces.
      n: '[[w.futrell-united-states-air-force]], 199.'
      src:
        c: de52f2c6
        rows:
        - 'w.futrell-united-states-air-force 199: all'
- add:
    entry:
      id: cal.1964-02-11.vietnam-diplomacy
      when: Feb. 11
      date: '1964-02-11'
      thread: vietnam
      c: Sihanouk charges that two South Vietnamese aircraft attacked a Cambodian village and killed five; the United States
        partly to blame for having "overarmed" South Vietnam.
      n: '[[w.futrell-united-states-air-force]], 199. See [[cal.1962-09-10.vietnam-diplomacy]]. Names: Sihanouk.'
      src:
        c: 1b2563de
        rows:
        - 'w.futrell-united-states-air-force 199: all'
      tags:
      - name:norodom-sihanouk
- cite:
    id: cal.1964-03-19.vietnam
    item: '[[w.futrell-united-states-air-force]], 199 (in South Vietnamese border actions; Scobel and the Vietnamese observer)'
- cite:
    id: cal.1964-02-20.vietnam
    item: '[[w.futrell-united-states-air-force]], 199 (Johnson has McNamara set the Joint Chiefs to study how to decrease
      Hanoi''s support; McNamara sends the directive to Taylor Feb. 21)'
- cite:
    id: cal.1964-03-26.vietnam
    item: '[[w.futrell-united-states-air-force]], 203 (McNamara''s address)'
- cite:
    id: cal.1964-03-27.vietnam-2
    item: '[[w.futrell-united-states-air-force]], 203 (to the border where it is a river or road; elsewhere 2,000 meters under
      a forward air controller)'
- add:
    entry:
      id: cal.1964-03-08.vietnam-operations
      when: Mar. 8
      date: '1964-03-08'
      thread: vietnam
      c: Col. Thomas M. Hergert, deputy chief of the MAAG's Air Force Section, killed flying an A-1H as wingman to a Vietnamese
        leader on an interdiction mission. Mar. 18, the new Vietnamese 518th Fighter Squadron begins combat from Biên Hòa
        with ten of its twenty-five aircraft.
      n: '[[w.futrell-united-states-air-force]], 213, 218.'
      src:
        c: 04f7c1bb
        rows:
        - 'w.futrell-united-states-air-force 213, 218: all'
- add:
    entry:
      id: cal.1964-03-24.vietnam-operations
      when: Mar. 24
      date: '1964-03-24'
      thread: vietnam
      c: 'A Farm Gate T-28B loses a wing on a bomb run near Sóc Trăng: Capt. Edwin G. Shank, Jr., and the Vietnamese crewman
        killed. The B-26s and RB-26s to be ferried to Clark by Apr. 8.'
      n: '[[w.futrell-united-states-air-force]], 213, 218. See [[cal.1964-03-08.vietnam-operations]].'
      src:
        c: '89676953'
        rows:
        - 'w.futrell-united-states-air-force 213, 218: all'
- add:
    entry:
      id: cal.1964-05-20.vietnam-operations
      when: May 20
      date: '1964-05-20'
      thread: vietnam
      also:
      - laos
      c: Six of the 1st Air Commando Squadron's borrowed T-28s go to Laos; June 30, twelve A-1Es on hand at Biên Hòa, the
        T-28s retired.
      n: '[[w.futrell-united-states-air-force]], 220–21. See [[cal.1964-03-24.vietnam-operations]].'
      src:
        c: 7d9a93ff
        rows:
        - 'w.futrell-united-states-air-force 220–21: all'
- add:
    entry:
      id: cal.1964-04-30.vietnam-3
      when: Apr. 30
      date: '1964-04-30'
      thread: vietnam
      c: 'A Ranch Hand spray plane meets .50-caliber fire: the copilot wounded, forty holes; fighters escort the spray missions
        thereafter.'
      n: '[[w.futrell-united-states-air-force]], 248.'
      src:
        c: 442aa2ce
        rows:
        - 'w.futrell-united-states-air-force 248: all'
- cite:
    id: cal.1964-07-29.vietnam
    item: '[[w.futrell-united-states-air-force]], 248 (Taylor may approve crop destruction without referring it to Washington)'
- add:
    entry:
      id: cal.1964-10-30.vietnam
      when: Oct. 30
      date: '1964-10-30'
      thread: vietnam
      c: At Taylor's direction Ranch Hand begins spraying crop targets the VNAF helicopters cannot reach.
      n: '[[w.futrell-united-states-air-force]], 248. See [[cal.1964-07-29.vietnam]]. Names: Taylor.'
      src:
        c: 65961bbf
        rows:
        - 'w.futrell-united-states-air-force 248: all'
      tags:
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1964-09-23.vietnam-operations
      when: Sept. 23
      date: '1964-09-23'
      thread: vietnam
      c: Two A-1Es of the 1st Air Commando Squadron shot down at night, silhouetted by flares on a low napalm pass; eight
        of its aircraft crashed in all. Sept. 25, McNamara allows A-1E combat with a Vietnamese observer or student aboard.
      n: '[[w.futrell-united-states-air-force]], 237. See [[cal.1964-05-20.vietnam-operations]]. Names: McNamara.'
      src:
        c: ecab0924
        rows:
        - 'w.futrell-united-states-air-force 237: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-10-12.vietnam-operations
      when: Oct. 12
      date: '1964-10-12'
      thread: vietnam
      c: The Air Force's 602d Fighter Commando Squadron organized under the 34th Tactical Group; the 520th, the fourth Vietnamese
        fighter squadron, formed at Biên Hòa in October for Cần Thơ. From Dec. 20 the 602d sends a detachment of five daily.
      n: '[[w.futrell-united-states-air-force]], 237. See [[cal.1964-09-23.vietnam-operations]].'
      src:
        c: 4ca0dcc8
        rows:
        - 'w.futrell-united-states-air-force 237: all'
- add:
    entry:
      id: cal.1964-11-02.vietnam-operations
      when: Nov. 2
      date: '1964-11-02'
      thread: vietnam
      c: 'Briefed on the armed C-47, LeMay orders a combat evaluation: from early December, two of the 34th Tactical Group''s
        C-47s with miniguns, Maj. Ronald W. Terry''s team; an instant success. Dec. 24, an AC-47''s miniguns blast guerrillas
        off the wall of a fort under attack.'
      n: '[[w.futrell-united-states-air-force]], 241, 260. Names: LeMay.'
      src:
        c: 0713f4f1
        rows:
        - 'w.futrell-united-states-air-force 241, 260: all'
      tags:
      - name:lemay-curtis-e
- add:
    entry:
      id: cal.1964-12-20.vietnam-air-war
      when: Dec. 20
      date: '1964-12-20'
      thread: vietnam
      c: MACV forms the Central Target Analysis and Research Center at Tân Sơn Nhứt, under its J-2, to coordinate Army and
        Air Force infrared reconnaissance.
      n: '[[w.futrell-united-states-air-force]], 245.'
      src:
        c: 738b70ac
        rows:
        - 'w.futrell-united-states-air-force 245: all'
- add:
    entry:
      id: cal.1964-12-09.vietnam-operations-3
      when: Dec. 9
      date: '1964-12-09'
      thread: vietnam
      c: 'A-1Hs of the Vietnamese 516th Fighter Squadron strike the Viet Cong force that attacked the An Lão district headquarters
        Dec. 7: thirty-three dead.'
      n: '[[w.futrell-united-states-air-force]], 259. See [[cal.1964-12-07.vietnam-operations]].'
      src:
        c: 643f1465
        rows:
        - 'w.futrell-united-states-air-force 259: all'
- add:
    entry:
      id: cal.1964-12-10.vietnam-operations
      when: Dec. 10
      date: '1964-12-10'
      thread: vietnam
      c: Long Mỹ, Chương Thiện. The night of Dec. 10, two Viet Cong battalions strike outposts and ambush the relief; an Army
        L-19 finds the ambush; Army helicopters from Sóc Trăng hold the enemy until Vietnamese A-1Hs arrive; one A-1H downed,
        five helicopters damaged; some four hundred enemy killed.
