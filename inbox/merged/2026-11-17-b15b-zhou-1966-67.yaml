        id: cal.1966-02.china-leadership
        when: Feb.
        date: 1966-02
        thread: china-leadership
        c: 'Zhou Enlai instructs Xinhua on *Cankao xiaoxi*: not only reactions favorable to China; print some of the opposite kind, too.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 16 (Feb. 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
