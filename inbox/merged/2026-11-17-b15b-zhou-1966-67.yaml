      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121 (Feb. 7, 1967; Mao''s note to Lin Biao, Zhou, Ye Jianying, Nie Rongzhen and Xu Xiangqian: some questions handled too slowly, Xinjiang to be settled sooner, some great ones too fast)'
  - cite:
      id: cal.1967-03-21.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 136 (Mar. 21, 1967; Zhou at Mao''s, reporting on the seven criticism meetings)'
  - cite:
      id: cal.1967-05-31.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (May 31, 1967; Zhou at Mao''s at noon: rail and shipping are the country''s arteries, and their military control cannot wait)'
  - cite:
      id: cal.1967-07-21.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 21, 1967; Zhou arranges Mao''s departure from Wuhan before dawn)'
  - cite:
      id: cal.1967-09-29.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 29, 1967; Zhou at Mao''s meeting on convening the Ninth Congress)'
  - cite:
      id: cal.1967-11-05.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 5, 1967; Zhou at the Group''s small liaison meeting at Mao''s)'
  - cite:
      id: cal.1967-11-07.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 7, 1967; Zhou''s letter to Mao proposing the telegram)'
  - cite:
      id: cal.1966-08-04.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 4, 1966; Zhou present, after the Cultural Revolution Group''s meeting; Mao on the work groups, a question of direction and line)'
  - cite:
      id: cal.1967-07-18.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 18, 1967, the item after; Zhou at Mao''s evening meeting with Chen Zaidao, Zhong Hanhua and others)'
