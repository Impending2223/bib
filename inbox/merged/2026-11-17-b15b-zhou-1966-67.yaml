  - add:
      entry:
        id: cal.1966-05-01.china-leadership
        when: May 1
        date: '1966-05-01'
        thread: china-leadership
        c: 'Zhou Enlai tells press photographers: on May Day, take many crowd scenes, many of the guests, and of Vice-Chairman Soong Ching Ling''s doings.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 28 (May 1, 1966). Names: Zhou Enlai, Soong Ching Ling.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-05-01.china-leadership-2
        when: May 1
        date: '1966-05-01'
        thread: china-leadership
        c: 'Zhou Enlai, on the program of the State Council offices party: *Three Old Men Watch the Crops* overdraws the peasants backwardness and makes them ugly, an old stage trick; *Cotton-Picking Dance* shows skill but not a harvest, form and content ill joined. An evening is not only amusement; the Culture Ministry should take performances seriously.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 28–29 (May 1, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-05-03.china-leadership
        when: May 3
        date: '1966-05-03'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, with the Albanian party and government delegation, at the Daqing oilfield. At the refinery: Chinese refining has advanced; staff are few by home standards but many by foreign. In the evening he hears work reports. Of 5,800 workers, over half have families who cannot come: with more grain, families can come, to be put to work, and birth control kept up; build a new kind of mining district joining farming and industry, town and country. Half-work, half-study schools to form a whole system of education; teaching, research and production joined.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 29 (May 3, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1966-05-04.china-leadership-2
        when: May 4
        date: '1966-05-04'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, at Daqing, on the Petroleum Ministry''s delegations abroad: they should include geologists, drillers, machine and bit makers, and political workers. Build the field and plant trees and keep the cover; Daqing is a success but one must see two sides and never be content. That evening at the Heilongjiang committees party he questions Harbin Linen Textile Mill workers; the linen is not up to standard: put politics first, quality first, export goods especially, the 3,000 workers led by Party and Youth League members.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 29 (May 4, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1966-05-05.china-leadership-2
        when: May 5–7
        date: '1966-05-05'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai goes with Shehu and the Albanian delegation to Shanghai, and is back in Peking the evening of the 7th.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 30 (May 5, 1966). Made public: 2020. See [[cal.1966-05-05.china-leadership]]. Names: Zhou Enlai, Shehu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1966-05-09.china-leadership-2
        when: May 9
        date: '1966-05-09'
        thread: china-leadership
        also: [testing, china]
        c: China explodes a nuclear device with thermonuclear material. Before the test Zhou Enlai telephones Zhang Aiping and Liu Xiyao at the test front command post several times on aircraft loading and weather, and reports to the Standing Committee members in Peking and to Mao away from the capital. After it succeeds he credits leaders, experts and masses together, education, research and production together.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 30 (May 9, 1966). Made public: 2020. Names: Zhou Enlai, Zhang Aiping, Liu Xiyao, Mao Zedong.'
        tags: [name:zhou-enlai, name:zhang-aiping, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-05-10.china-leadership
        when: May 10
        date: '1966-05-10'
        thread: china-leadership
        also: [china, soviet-union]
        c: 'Zhou Enlai, at Shehu''s farewell banquet, sharply denounces the collusion of the U.S. and the Soviet Union in a nuclear monopoly: China''s test is a great encouragement to all peoples; in no circumstances will China use nuclear weapons first.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 30 (May 10, 1966). Made public: 2020. Names: Zhou Enlai, Shehu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1966-05-10.china-leadership-2
        when: May 10–11
        date: '1966-05-10'
        thread: china-leadership
        also: [china, soviet-union]
        c: Zhou Enlai, through the nights of the 10th and 11th, drafts the China–Albania joint statement.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 30 (under May 10, 1966). Made public: 2020. See [[cal.1966-05-10.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - check:
      id: cal.1966-05-10.china
      text: 'Check: Zhou''s chronology records his speech at Shehu''s farewell banquet on May 10, with no first use of nuclear weapons by China, but not the words here; whether this is that occasion.'
