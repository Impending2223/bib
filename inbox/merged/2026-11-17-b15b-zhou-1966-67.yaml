        date: '1966-07-10'
        thread: china-leadership
        c: 'Zhou Enlai to Li Xiannian, on an imported item of technical equipment whose supplier cannot meet the agreement reached in talks: call the parties and decide finally; if cancelling would harm later orders, import it, and rule that talks end before they are concluded, orders be made with more care, through several checks and then the import technical groups request for approval.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 43 (July 10, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
