  - add:
      entry:
        id: cal.1966-07-22.china-leadership
        when: July 22
        date: '1966-07-22'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Zhou Enlai, with Liu Shaoqi, Soong Ching Ling, Dong Biwu, Zhu De and Deng Xiaoping, attends the Tiananmen Square rally and march of a million of the capitals people supporting the Vietnamese people's struggle against the U.S. to final victory.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (July 22, 1966). Names: Zhou Enlai, Liu Shaoqi, Soong Ching Ling, Dong Biwu, Zhu De, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:dong-biwu, name:zhu-de, name:deng-xiaoping, polity:prc]
  - add:
      entry:
        id: cal.1966-07-22.china-leadership-2
        when: July 22
        date: '1966-07-22'
        thread: china-leadership
        c: 'Liao Chengzhi, reviewing the Xinhua photographs of the rally, conveys to Xinhua Zhou Enlai''s recent instructions on its reporting: the new leadership must correct two faults of the past, reporters writing the story before the event and merely filling in names at the scene, not listening to the speakers; and news photographs pasted up from several.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (July 22, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liao Chengzhi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-07-23.china-leadership-2
        when: July 23
        date: '1966-07-23'
        thread: china-leadership
        c: Zhou Enlai hears reports on the Cultural Revolution from several universities, the Commission for Cultural Relations with Foreign Countries and the Academy of Sciences' Institute of Physics.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (July 23, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-07-23.china-leadership-3
        when: July 23
        date: '1966-07-23'
        thread: china-leadership
        c: Zhou Enlai at Liu Shaoqi's in the evening, with Deng Xiaoping, on the work-group question.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (July 23, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-07-24.china-leadership-3
        when: July 24
        date: '1966-07-24'
        thread: china-leadership
        c: 'Zhou Enlai, at 4 a.m., writes Liu Shaoqi and Deng Xiaoping: on last night''s talk, after thought and more papers, the differences come from the reading of the situation and of the problem, not other causes; better not to talk of them. In Peking sending work groups was general and necessary, but each groups case is special and needs a local inquiry; working relations must be settled and fixed, or work is hard. He went this morning to the Foreign Languages Institute to read the wall posters.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 40–41 (July 24, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-07-24.china-leadership-4
        when: July 24
        date: '1966-07-24'
        thread: china-leadership
        c: Zhou Enlai, after the meeting at Liu Shaoqi's, calls the heads of the State Council's branches on the Cultural Revolution.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 41 (July 24, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-07-24.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 41 (July 24–25, 1966; Zhou at Mao''s meeting of the Standing Committee and the Cultural Revolution Group, where Mao criticizes the work groups and decides to withdraw them; the next day Mao again to the regional bureau secretaries and the Group)'
  - add:
      entry:
        id: cal.1966-07-24.china-leadership-5
        when: July 24–26
        date: '1966-07-24'
        thread: china-leadership
        c: Zhou Enlai goes to the Peking No. 2 Foreign Languages Institute to read the wall posters. He says he has come to look and will report to Chairman Mao; at each step of the work one should check for errors.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 41 (July 24, 25, 26, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
