        when: June 24–28
        date: '1966-06-24'
        thread: china-leadership
        c: Zhou Enlai leads the Chinese party and government delegation to Albania and holds many talks with its leaders.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 37 (June 24, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1966-06-27.china-leadership
        when: June 27
        date: '1966-06-27'
        thread: china-leadership
        also: [soviet-union]
        c: Zhou Enlai speaks at a mass rally at Tirana. How to keep revisionism from usurping Party and state, and capitalism from returning, no socialist state has a full experience; China, by Mao's teaching, has taken basic measures. The Cultural Revolution of recent months is a sharp class struggle in ideology, in the end "a struggle of restoration against anti-restoration", which will strengthen the dictatorship of the proletariat.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 37–38 (June 27, 1966). To check: the speech as printed in the *Renmin ribao*. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
