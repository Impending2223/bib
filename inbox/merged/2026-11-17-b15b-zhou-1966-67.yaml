        date: '1966-03-29'
        thread: china-leadership
        c: Zhou Enlai attends the foreign affairs systems meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 12 (Feb. 8–9, 1966, next item). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-02.china-leadership
        when: Mar. 2–5
        date: '1966-03-02'
        thread: china-leadership
        c: 'Zhou Enlai hears reports on drought resistance in the eight northern provinces. On the 5th: model experience spreads where cadres stay at a point and learn from the masses; working groups not to command blindly; rely mainly on the localities; try first and spread what works, not praise too soon, as in 1958; few circulars from the Center; wells and plans from below; no rush, equalizing transfers or mass armies.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 16 (Mar. 2, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-03.china-leadership
        when: Mar. 3
        date: '1966-03-03'
        thread: china-leadership
        c: 'Zhou Enlai drafts the Center''s reply to the Shanghai Party committee and to Chen Pixian on Chen''s nasal treatment: agreed with the plan; Chen to rest at ease, the experts sure to cure the early-stage nasopharyngeal tumor.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 16 (Mar. 3, 1966). Made public: 2020. Names: Zhou Enlai, Chen Pixian.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-05.china-leadership
        when: Mar. 5
        date: '1966-03-05'
        thread: china-leadership
        c: 'Zhou Enlai reports on the international and domestic situation to the national industry-and-transport work conference and political work conference. On the eight northern provinces: they long drew grain from the south; farming has not passed the test, which harms industry, war preparation and construction. Industry to help farming, but farming to rely mainly on itself; support should go where needed, through to the end. Industry and transport to support basic industry, mines above all; the weak base leaves the seat unsteady.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 17 (Mar. 5, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-06.china-leadership
        when: Mar. 6
        date: '1966-03-06'
        thread: china-leadership
        c: Zhou Enlai calls Lin Hujia and Yu Qiuli in turn on drought in the eight northern provinces.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 17 (Mar. 6, 1966). Made public: 2020. Names: Zhou Enlai, Lin Hujia, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-07.china-leadership
        when: Mar. 7
        date: '1966-03-07'
        thread: china-leadership
        c: Zhou Enlai at the Secretariat meeting, reports the drought work in the eight northern provinces.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 17 (Mar. 7, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-07.china-leadership-2
        when: Mar. 7
        date: '1966-03-07'
        thread: china-leadership
        c: Zhou Enlai chairs the northern agricultural groups meeting. Keep on with drought work from below; the aim is to change the areas backwardness within three to five years and end the grain haul from the south. Guard against slackening after two snows, and blind command. Land improvement; small waterworks; farm manure first; good tools; small Third Front works, which are sometimes a small city moved; the south not slackened.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 17 (Mar. 7, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-08.china-leadership
        when: Mar. 8
        date: '1966-03-08'
        thread: china-leadership
        c: 'Zhou Enlai receives Romania''s ambassador (Qiaozhiwu, 乔治乌) and his wife. On farming: living standards have risen but are not to be overrated; the country''s must be raised too, or the gap widens.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 17–18 (Mar. 8, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+romania]
  - add:
      entry:
        id: cal.1966-03-08.china-leadership-2
        when: Mar. 8
        date: '1966-03-08'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai receives Algeria''s ambassador (Muhammad Sharif Sahli, 穆罕默德谢里夫·萨赫利) and exchanges views on language and script: besides the national tongue, a foreign language helps; language is a tool; on script reform, Putonghua promotion works best, simplified characters help but meet obstacles, and Latin spelling meets great resistance and may not replace characters.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 18 (Mar. 8, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+algeria]
  - add:
      entry:
        id: cal.1966-03-08.china-leadership-3
        when: Mar. 8
        date: '1966-03-08'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, learning of the strong earthquake at Xingtai, Hebei, orders medical teams from the Health Ministry, men and medical units of the 63rd Army, and a watch on the quake by the Academy of Sciences and the State Science Commission. That night he tells Liu Shaoqi, Deng Xiaoping and others of four measures: scientific teams to the site; Zeng Shan to arrange relief; staff from the ministries; his own flight to Shijiazhuang next day.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 18 (Mar. 8, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Zeng Shan.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-09.china-leadership
        when: Mar. 9
        date: '1966-03-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai and Zhou Rongxin, the State Council''s secretary-general, report to the Center and Mao on the Xingtai earthquake: over thirty communes of Longyao, Ningjin and Julu counties worst hit, 320,000 people; first count over 7,000 dead, over 20,000 badly hurt, some 80 percent of houses down. A Center delegation under Zeng Shan; troops of the 63rd Army and medical teams sent; aid from the trade, grain and finance ministries.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 18–19 (Mar. 9, 1966). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin, Zeng Shan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-09.china-leadership-2
        when: Mar. 9
        date: '1966-03-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, in the afternoon, goes to the quake zone for the Center and the State Council: Shijiazhuang, the Xingtai prefectural leaders at 4 p.m., Longyao County at 11 p.m. At the county''s relief headquarters, six points: self-reliance, hard work, rebuilding homes and production; three or four cadres to each brigade; the 63rd Army to command; record the experience; quakes'' laws "we must solve"; cooking pots within two days.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 19–20 (Mar. 9, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-10.china-leadership-2
        when: Mar. 10
        date: '1966-03-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, back at Shijiazhuang at 1 a.m., questions the prefectural and city Party leaders on grain, water, fertilizer, seed and land improvement: why are some thoughts hard to settle? One must grasp both ends, the masses first; the Center''s things come from the masses; set models. After the quake, practise self-reliance, "troubles make a nation".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20 (Mar. 10, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-10.china-leadership-3
        when: Mar. 10
        date: '1966-03-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, at Baijiazhai in Longyao County, the worst-hit place, speaks at a mass meeting: move mountains like the Foolish Old Man; "fight" the earth; Communists, Youth League members and Young Pioneers to lead the relief. Leads the crowd in shouting the four slogans (strive, self-reliance, produce, rebuild homes). Visits families struck by the quake: record the lessons for later generations. Leaves for Peking at 5 p.m.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20 (Mar. 10, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-12.china-leadership-2
        when: Mar. 12
        date: '1966-03-12'
        thread: china-leadership
        c: 'Zhou Enlai writes Liu Shaoqi, Peng Zhen, Chen Yi, Li Xiannian and Kang Sheng: he goes this noon to Tianjin for the North China Bureau meeting on five questions (war preparation, the small Third Front, drought, passing the grain test, study of Mao''s works), about five days; he plans a month of investigation and study in Hebei and Peking. He leaves arrangements on foreign affairs, defence, the Military Commission, the Secretariat and the State Council, and reports to Mao. Leaves for Tianjin at 12:30.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20 (Mar. 12, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Peng Zhen, Chen Yi, Li Xiannian, Kang Sheng, Mao Zedong.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:peng-zhen, name:chen-yi, name:li-xiannian, name:kang-sheng, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-12.china-leadership-3
        when: Mar. 12–16
        date: '1966-03-12'
        thread: china-leadership
        c: Zhou Enlai attends the North China Bureau meeting, Tianjin.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20 (Mar. 12, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-12.china-leadership-4
        when: Mar. 12–15
        date: '1966-03-12'
        thread: china-leadership
        c: 'Zhou Enlai sees the Tianjin Song and Dance Theatre perform three times, the 12th, 14th and 15th, and tells the performers to go down to the grass roots and live among the people. On the 12th: Peking units sending small teams down is good; "do not make a movement only above". On the 15th: go quickly to the villages, train yourselves and spread and raise culture there, with small programs; dance and opera not to be too separate.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 21 (Mar. 12–16, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-15.china-leadership
        when: Mar. 15
        date: '1966-03-15'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai meets the responsible officials on Xingtai earthquake relief. On the relief funds he has approved: he is uneasy that announcing them will breed dependence and take away self-reliance.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 21–22 (Mar. 15, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-16.china-leadership-2
        when: Mar. 16
        date: '1966-03-16'
        thread: china-leadership
        c: 'Zhou Enlai reports to the North China Bureau meeting. China is still poor, industry and farming backward; in a war grain supply might be worse than in the civil war, "I am uneasy". North China may be the enemy''s main thrust: prepare on a war footing, end the grain haul from the south, keep surpluses in the teams and state reserves. Plans from below; talk of war and famine without alarm.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20–21 (Mar. 16, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-16.china-leadership-3
        when: Mar. 16
        date: '1966-03-16'
        thread: china-leadership
        c: 'Zhou Enlai at the North China Bureau meeting, on the *Song of Wang Jie*: right to show Wang Jie growing; things rise step by step, and no one is born knowing everything.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 21 (Mar. 12–16, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-16.china-leadership-4
        when: Mar. 16
        date: '1966-03-16'
        thread: china-leadership
        c: Zhou Enlai returns to Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 22 (Mar. 16, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-17.china-leadership-3
        when: Mar. 17
        date: '1966-03-17'
        thread: china-leadership
        c: Zhou Enlai flies to Shanghai, then goes on to Hangzhou.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 22 (Mar. 17, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-03-17.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 22 (Mar. 18–20, 1966; Zhou''s attendance and his interjection on the defence industry)'
  - add:
      entry:
        id: cal.1966-03-20.china-leadership-2
        when: Mar. 20
        date: '1966-03-20'
        thread: china-leadership
        c: Zhou Enlai goes to Shanghai, and flies back to Peking that night.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 22 (Mar. 20, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-21.china-leadership-2
        when: Mar. 21
        date: '1966-03-21'
        thread: china-leadership
        c: Zhou Enlai talks with the Party-group secretaries of the ministries and the heads of directly attached bureaus on farm mechanization.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 22 (Mar. 21, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-21.china-leadership-3
        when: Mar. 21
        date: '1966-03-21'
        thread: china-leadership
        c: Zhou Enlai at Peking Hospital, to take leave of the body of Guo Dejie, Li Zongren's wife.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 22 (Mar. 21, 1966). Made public: 2020. Names: Zhou Enlai, Guo Dejie, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-23.china-leadership
        when: Mar. 23
        date: '1966-03-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the second strong quake in the Xingtai area on the afternoon of the 22nd and the rumors in Peking, instructs: keep both watchfulness and calm; strengthen observation at the epicenter, flying seismographs to Lushan and Gengzhuangqiao and opening wire and radio links through Shijiazhuang to Peking; the quake area to prepare to cut losses; trace the rumors, correcting and educating those who passed on a mistake and prosecuting the malicious.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26 (Mar. 23, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-23.china-leadership-2
        when: Mar. 23
        date: '1966-03-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai calls Li Siguang, Zhang Jingfu, Zhang Youxuan and Wu Heng, with officials and experts of the Petroleum Ministry and the Academy of Sciences'' Institute of Geophysics, on the earthquake: prediction is to be done well.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26–27 (Mar. 23, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Siguang, Zhang Jingfu, Zhang Youxuan, Wu Heng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-26.china-leadership
        when: Mar. 26
        date: '1966-03-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the North China Bureau''s report, forwarded by the Xingtai relief headquarters, on losses and relief goods distributed in five Julu brigades, to Li Xiannian and Zhou Rongxin: at the coming conference of prefectural secretaries of the hard-hit areas, raise what needs care, so that state help does not bring dependence.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Mar. 26, 1966). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Zhou Rongxin.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-28.china-leadership-3
        when: Mar. 28
        date: '1966-03-28'
        thread: china-leadership
        c: Zhou Enlai calls Lin Mohan, Li Qi and Zhou Weizhi on the Peking-opera revolution festival of modern plays, an experimental Peking-opera troupe, and Culture Ministry artists going among the people. Actors must live among the people; the Peking People's Art Theatre's *Live Like Him* (on Nguyễn Văn Trỗi) lacked the life of the people, the actors in love with themselves. Many theatres stay too long in town; first be revolutionary people. War plays to show the hardship of war, not make it look easy.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Mar. 28, 1966). Made public: 2020. Names: Zhou Enlai, Lin Mohan, Li Qi, Zhou Weizhi, Nguyễn Văn Trỗi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-29.china-leadership-3
        when: Mar. 29
        date: '1966-03-29'
        thread: china-leadership
        c: Zhou Enlai calls Li Xiannian, Tan Zhenlin, Wang Guangwei, Chen Zhengren, Qian Zhengying and Zhou Rongxin on farming.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Mar. 29, 1966). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Tan Zhenlin, Wang Guangwei, Chen Zhengren, Qian Zhengying, Zhou Rongxin.'
        tags: [name:zhou-enlai, name:li-xiannian, name:tan-zhenlin, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-31.china-leadership
        when: Mar. 31
        date: '1966-03-31'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, with Peng Zhen and others, hears Kang Sheng relay Mao''s talks, held away from Peking, with Kang, Jiang Qing and Zhang Chunqiao. Mao calls the February Outline wrong, confusing class lines and reversing friend and enemy; the Propaganda Department is the Palace of the King of Hell: overthrow the King, free the little devils.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27–28 (Mar. 31, 1966). Made public: 2020. See [[cal.1966-03-28.china-leadership-2]]. Names: Zhou Enlai, Peng Zhen, Kang Sheng, Mao Zedong, Jiang Qing, Zhang Chunqiao.'
        tags: [name:zhou-enlai, name:peng-zhen, name:kang-sheng, name:mao-zedong, name:jiang-qing, name:zhang-chunqiao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-31.china-leadership-2
        when: Mar. 31
        date: '1966-03-31'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai flies to Shijiazhuang.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 28 (Mar. 31, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-01.china-leadership
        when: Apr. 1
        date: '1966-04-01'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, in the second quake zone (Dongwang and Gengzhuangqiao communes in Ningjin, Matouli and Hejiazhai in Julu), inspects drought work and spring sowing and speaks at a mass meeting: production first, houses after; self-reliance, the state''s help secondary; record the costly lessons for later generations. He visits over 140 patients at Dongwang''s temporary hospital and reaches Xingtai at night.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 24 (Apr. 1, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-01.china-leadership-2
        when: Apr. 1
        date: '1966-04-01'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai at Gengzhuangqiao, inspecting the Academy of Sciences'' earthquake team: prediction must be accurate and in time. To the University of Science and Technology''s seismology students: he hopes their generation will solve earthquake prediction. He orders Peking''s building designers brought to the site, to settle what houses will stand a quake.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 24 (Apr. 1, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-02.china-leadership-2
        when: Apr. 2
        date: '1966-04-02'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, Handan, talks with provincial and prefectural leaders and hears of the well-digging drought work. He doubts the order to dig 7,000 wells in the area by the end of April: first save the wheat harvest and spring sowing; wells after the wheat or autumn harvest. "Haste makes waste."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 24–25 (Apr. 2, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-03.china-leadership
        when: Apr. 3
        date: '1966-04-03'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai at the Zhanghe Forest brigade, Wei County: write Party members and non-members, all are masses. In the afternoon at Qiansangquan brigade, Daming County, he has Qian Zhengying send men to guide the well work; told the brigade paid no cash for two years and its grain is 5.7 liang a day, he says he is sorry. In the evening, with Daming''s county committee, on labor drawn to the Haihe works.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 25 (Apr. 3, 1966). Made public: 2020. Names: Zhou Enlai, Qian Zhengying.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-04.china-leadership
        when: Apr. 4
        date: '1966-04-04'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, Linzhang County, talks with cadres and villagers and the county secretary: decades of backwardness in farming cannot be turned in a year; the county''s well plan cannot be done in a year; "I reserve on watering everything in one year."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 25 (Apr. 4, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-05.china-leadership
        when: Apr. 5
        date: '1966-04-05'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai at Ci County, to officials of Hebei, Handan and the central departments, repeating what the day''s inspection showed. The drive for wells has run hot: "active attitude, steady steps, voluntary, self-reliance", neither phrase to be dropped; no added burdens on the people; mechanization step by step; relief joined to production, loans to spur self-help, not dependence.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 25–26 (Apr. 5, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-05.china-leadership-2
        when: Apr. 5
        date: '1966-04-05'
        thread: china-leadership
        c: 'Zhou Enlai inspects the Yuecheng Reservoir. A reservoir serves flood control and irrigation together: in a dry year irrigation counts more; plan for all uses, farm and forest too; the water department to see it through. Told part of the main dam was built by dumping earth into water, he calls it unsafe, to be watched, and the method to be recorded in the project file: do not hide faults from later generations. On earthquakes: find their laws; prediction not yet solved anywhere; "why not we first?"'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26 (Apr. 5, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-06.china-leadership
        when: Apr. 6
        date: '1966-04-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, before dawn, on the way back through Shijiazhuang, talks with the Xingtai and Shijiazhuang prefectural committees and the garrison. The quake may be nearly over; the State Council will issue an all-clear; production, water and drought work to be done.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26 (Apr. 6, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-07.china-leadership
        when: Apr. 7
        date: '1966-04-07'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai meets researchers of the State Science Commission, the Academy of Sciences, the Geology Ministry and others on earthquake prediction and zoning.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26 (Apr. 7, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-10.china-leadership-3
        when: Apr. 10
        date: '1966-04-10'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai meets researchers of the State Science Commission, the Academy of Sciences, the Geology Ministry and others on earthquake prediction and zoning, a second time. Stresses its importance and possibility; every faint change to be recorded and weighed; work to meet real needs, not papers.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26–27 (Apr. 7, 10, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-12.china-leadership
        when: Apr. 12
        date: '1966-04-12'
        thread: china-leadership
        c: Zhou Enlai, with Deng Xiaoping and Peng Zhen, writes Mao on the Secretariat meeting; proposes that Deng, Li Fuchun, Yu Qiuli, Bo Yibo and Gu Mu report to Mao on the trip to the Northwest, chiefly on thoughts for the Five-Year Plan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Apr. 12, 1966). Made public: 2020. See [[cal.1966-04-09.china-leadership]]. Names: Zhou Enlai, Deng Xiaoping, Peng Zhen, Mao Zedong, Li Fuchun, Yu Qiuli, Bo Yibo, Gu Mu.'
        tags: [name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:mao-zedong, name:li-fuchun, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-10.china-leadership-4
        when: Apr. 10
        date: '1966-04-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the correspondent of Pakistan''s *Dawn* (伊查效·侯赛因) and answers his ten written questions. China''s four sentences on the U.S.: China will not start a war on it; China means what it says, aiding any state the U.S. attacks; China is prepared, and an invader will not get out; once war starts it has no bounds. The obstacle to normal ties is U.S. aggression against China.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Apr. 10, 1966). To check: the interview as printed in *Dawn* and the *Renmin ribao*. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-04-11.china-leadership
        when: Apr. 11
        date: '1966-04-11'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai to the Peking Military Region''s 187th Division, doing relief propaganda in the Xingtai area, after villagers said spring plowing left no time to study Mao''s works: a month''s relief propaganda must also help the villagers farm; teach in the gaps of sowing, manuring and watering; never stop work to study and lose the season.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27–28 (Apr. 11, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
