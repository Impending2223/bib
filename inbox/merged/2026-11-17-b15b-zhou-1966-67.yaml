      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 41 (July 26–27, 1966; Zhou at the meeting, on Lin Biao''s phrases "summit", "highest and liveliest" and "highest instruction"; his review, July 27, of the Peking committee''s decision withdrawing the work groups, issued July 28)'
  - cite:
