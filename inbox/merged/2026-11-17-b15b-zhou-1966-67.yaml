  - add:
      entry:
        id: cal.1966-05-13.china-leadership
        when: May 13
        date: '1966-05-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Albania''s ambassador (Natanaili, 纳塔奈利): the visit to Albania planned will be put off to June, because urgent domestic matters must be handled. The ambassador says Albania will learn from China''s experience; Zhou: Chinese experience is not for blind use; select, digest.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 13, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1966-05-15.china-leadership
        when: May 15
        date: '1966-05-15'
        thread: china-leadership
        also: [china, soviet-union]
        c: The China–Albania joint statement is issued.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 10–11, 1966). To check: the text, as printed in the *Renmin ribao* of May 15. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-05-15.china-leadership-2
        when: May 15
        date: '1966-05-15'
        thread: china-leadership
        c: 'Zhou Enlai and Ye Jianying report jointly to Mao and the Standing Committee on the guard of the capital, as Mao directed: a Capital Work Group, Ye leader, Yang Chengwu and Xie Fuzhi deputies, with Liu Zhijian, Li Xuefeng, Wang Dongxing, Zhou Rongxin, Zheng Weishan, Fu Chongbi, Wan Li and Su Qianyi, answering directly to the Standing Committee.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 15, 1966). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Mao Zedong, Yang Chengwu, Xie Fuzhi, Liu Zhijian, Li Xuefeng, Wang Dongxing, Zhou Rongxin, Zheng Weishan, Fu Chongbi, Wan Li, Su Qianyi.'
        tags: [name:zhou-enlai, name:ye-jianying, name:mao-zedong, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-05-17.china-leadership-2
        when: May 17
        date: '1966-05-17'
        thread: china-leadership
        also: [japan]
        c: Zhou Enlai talks with Matsumura Kenzō, adviser of Japan's Liberal Democratic Party.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 17, 1966). Made public: 2020. Names: Zhou Enlai, Matsumura Kenzō.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1966-05-19.china-leadership
        when: May 19
        date: '1966-05-19'
        thread: china-leadership
        also: [japan]
        c: Liao Chengzhi and Matsumura Kenzō continue talks on the Liao–Takasaki trade memorandum and reach agreement.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 17, 1966; the 19th). Made public: 2020. Names: Zhou Enlai, Liao Chengzhi, Matsumura Kenzō, Takasaki Tatsunosuke.'
        tags: [name:zhou-enlai, name:takasaki-tatsunosuke, polity:prc, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1966-05-20.china-leadership
        when: May 20
        date: '1966-05-20'
        thread: china-leadership
        c: Zhou Enlai has his secretary tell Wang Dongxing that Lu Dingyi's place has no guards; after today's Politburo meeting he will talk with Wang about it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 20, 1966). Made public: 2020. Names: Zhou Enlai, Wang Dongxing, Lu Dingyi.'
        tags: [name:zhou-enlai, name:lu-dingyi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-05-21.china-leadership-2
        when: May 21
        date: '1966-05-21'
        thread: china-leadership
        c: 'Zhou Enlai at the enlarged Politburo meeting, on three questions: preventing a counter-revolutionary coup; leaders and masses; keeping one''s integrity in later years.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 21, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-05-25.china-leadership
        when: May 25
        date: '1966-05-25'
        thread: china-leadership
        c: At Kang Sheng's and Cao Yiou's prompting, seven of Peking University's philosophy department under Nie Yuanzi put up a wall poster attacking the university's Party committee and the Peking committee. Zhou Enlai that night sends officials of the North China Bureau, the Foreign Affairs Office and the Ministry of Higher Education to rebuke Nie for going against the Center's plans and to restate the rule keeping inside and outside apart.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31–32 (May 25, 1966). Made public: 2020. Names: Zhou Enlai, Nie Yuanzi, Kang Sheng, Cao Yiou.'
        tags: [name:zhou-enlai, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-06-01.china-leadership-3
        when: June 1
        date: '1966-06-01'
        thread: china-leadership
        c: Zhou Enlai, asked that night by Chen Yi why so large a step was taken with no notice, answers that he too heard from Kang Sheng by telephone only shortly before the broadcast, that evening, over the central station, of the Peking University poster; Mao had told Kang and Chen Boda that morning to have it broadcast in full.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 32 (May 25, 1966). Made public: 2020. Names: Zhou Enlai, Chen Yi, Kang Sheng, Mao Zedong, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-yi, name:kang-sheng, name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-05-26.china-leadership
        when: May 26
        date: '1966-05-26'
        thread: china-leadership
        c: 'Zhou Enlai at the first full meeting of the Capital Work Group, Ye Jianying presiding, which settles its tasks, organization and work, and the moving in of two army divisions. Zhou: the capital''s garrison work is to be firm and steady, not hurried; the counter-revolutionaries are few, the army reliable. If troops must move urgently when Zhou is away, Deng Xiaoping may be asked.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 32 (May 26, 1966). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:ye-jianying, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-05-31.china-leadership-2
        when: May 31
        date: '1966-05-31'
        thread: china-leadership
        c: Zhou Enlai reports to Mao on the Capital Work Group's first full meeting and its arrangements.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 32 (under May 26, 1966). Made public: 2020. See [[cal.1966-05-26.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-05-27.china-leadership
        when: May 27
        date: '1966-05-27'
        thread: china-leadership
        also: [testing]
        c: Zhou Enlai receives a Chilean parliamentary delegation under the second vice-president of the Chamber (Xiboli Kalousi, 席博里·卡洛斯). Small countries often do great things; China as a large one takes care to do no injustice nor meddle in others' affairs. China's tests are for defence and world peace; China will never use nuclear weapons first, and wants all banned and destroyed. The U.S.–Soviet non-proliferation treaty aims at China and at isolating it. At home output has risen but is small beside need; keep the economy in proportion; big cities strain supply and traffic.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 32–33 (May 27, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+chile]
  - add:
      entry:
        id: cal.1966-05-28.china-leadership-2
        when: May 28
        date: '1966-05-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates to the Xingtai earthquake science conference: the richest in over a dozen years. Do not stop at phenomena; seismic stations and staff are far too few, and quality is needed as well as number; the State Science Commission and Nie Rongzhen to carry on, as oil has shone so earthquakes should; two "threes": leaders, experts and masses, and research with teaching and production. Analyze first-hand data, find contradictions, no cliques; dare to think, speak, act, argue and make revolution.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 33 (May 28, 1966). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen.'
        tags: [name:zhou-enlai, name:nie-rongzhen, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-05-28.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 33 (May 28, 1966; the Center''s notice setting up the Central Cultural Revolution Group: Chen Boda head, Kang Sheng adviser, Jiang Qing, Wang Renzhong, Liu Zhijian and Zhang Chunqiao deputies, Wang Li, Guan Feng, Qi Benyu, Yao Wenyuan and others members)'
  - cite:
      id: cal.1966-05-29.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 34 (May 29, 1966; Zhou telephones Mao at Hangzhou for approval; May 30 letter, May 31 entry)'
  - cite:
      id: cal.1966-05-04.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 29–30 (May 4–26, 1966; Zhou attends from the 16th; the Circular of May 16 and Lin Biao''s speech of May 18)'
  - add:
      entry:
        id: cal.1966-05-18.china-leadership-3
        when: May 18
        date: '1966-05-18'
        thread: china-leadership
        c: 'Zhou Enlai consults Yang Chengwu and the Peking Military Region on moving troops to strengthen the guard of the capital, and reports in writing to Mao: the 189th Division of the 63rd Army, at Shijiazhuang, and the 193rd Division of the 65th Army, at Zhangjiakou, to come to Peking for garrison duty, Fu Chongbi garrison commander. When they arrive, the guard of the key offices in Peking and of the broadcast and propaganda organs is to be re-ordered. Mao reads it and writes: do as proposed.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 18, 1966). Made public: 2020. See [[cal.1966-05-18.china-leadership-2]]. Names: Zhou Enlai, Yang Chengwu, Mao Zedong, Fu Chongbi.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
