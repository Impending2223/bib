        c: Zhou Enlai hears reports on the Cultural Revolution in the State Council's branches. Third Front construction differs from the first and second fronts and is not to be affected; to brand a man "black gang" and yet rely on him is bad; no light conclusions on organization; those criticized are neither sent down nor away, but kept in their offices under supervision.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 38 (July 7–8, 1966). Made public: 2020. Names: Zhou Enlai.'
