        date: '1966-07-27'
        thread: china-leadership
        c: Zhou Enlai reviews the Peking committee's decision, made on Mao's view, on withdrawing the work groups from the colleges.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 41 (July 27, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-07-27.china-leadership-4
        when: July 27
        date: '1966-07-27'
        thread: china-leadership
        c: At a mass meeting of ten thousand at Peking University, Chen Boda, Kang Sheng and Jiang Qing propose withdrawing the work group and dismissing Zhang Chengxian.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42 (July 27, 1966, the item after). Made public: 2020. Names: Chen Boda, Kang Sheng, Jiang Qing, Zhang Chengxian.'
        tags: [name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-07-27.china-leadership-5
        when: July 27
        date: '1966-07-27'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou Enlai, at midnight, receives Pakistan''s Commerce Minister and the President''s adviser on defence, Faruque. Told that Iran''s and Turkey''s leaders are interested in visiting China: they may find an official delegation hard just now, but semi-official or near-official people could come; China would welcome them and be ready to receive them; the systems differ, the interests are shared.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42 (July 27, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1966-07-28.china-leadership
        when: July 28
        date: '1966-07-28'
        thread: china-leadership
        c: Zhou Enlai receives an Afghan economic delegation under Minister of Agriculture and Irrigation Mir Reza and asks about farming, water and reservoir silting. Afghanistan has good experience of silt control; he tells Fang Yi, director of the Commission for Economic Relations with Foreign Countries, to have the Chinese embassy study the local silting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42 (July 28, 1966). Made public: 2020. Names: Zhou Enlai, Fang Yi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+afghanistan]
  - add:
      entry:
        id: cal.1966-07-28.china-leadership-2
        when: July 28–29
        date: '1966-07-28'
        thread: china-leadership
        c: 'Zhou Enlai goes to the Peking No. 2 Foreign Languages Institute to take part in the students debate. After hearing each side: one revolutionary in intention may still err; opposing each other is bad, strengthen unity; the Cultural Revolution begins in Party and government offices, cultural and educational units, above all schools; the work group should stay to learn, and so does he.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42 (July 28, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-07-29.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42–43 (July 29, 1966; Zhou''s speech after Dengs: the movement went from early heat to a cooler middle for two reasons, the leaders misjudgment of the situation and fear of disorder, and the hasty decision to send work groups everywhere; most work-group members are good, old revolutionaries meeting new problems; the three tasks; the school Cultural Revolution''s bodies after the withdrawal; Liu Shaoqi speaks after him)'
  - add:
      entry:
        id: cal.1966-07-30.china-leadership
        when: July 30
        date: '1966-07-30'
        thread: china-leadership
        c: Zhou Enlai talks with members of the Tsinghua University work group, and then with two groups of Tsinghua students.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 43 (July 30, 1966). Made public: 2020. Names: Zhou Enlai.'
