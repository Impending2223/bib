        c: Zhou Enlai receives Madeira Keita, Politburo member of Mali's Union Soudanaise party and Justice Minister, and his delegation. Independence is kept by relying on the masses and holding arms; the center is whether the economy grows independent, whether the masses wholly back their leader, whether the army is reliable.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 36 (June 7, 1966). Made public: 2020. Names: Zhou Enlai, Madeira Keita.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+mali]
