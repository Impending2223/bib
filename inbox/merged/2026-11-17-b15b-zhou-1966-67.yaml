        when: July 17
        date: '1966-07-17'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai receives Kabila and others, leaders of the eastern front in the Congo (Léopoldville): China does not turn away friends defeated on the revolutionary road and welcomes them; setbacks cannot be avoided; make as few mistakes as possible; most basic is to continue the revolution.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 43–44 (July 17, 1966). Made public: 2020. Names: Zhou Enlai, Kabila.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+congo]
  - cite:
      id: cal.1966-07-19.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 40 (July 19, 22, 1966; Zhou attends both meetings; Chen Boda''s proposal to withdraw the work groups opposed by Liu, Deng and most)'
  - add:
