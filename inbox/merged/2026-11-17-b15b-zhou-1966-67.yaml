        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 38 (June 28, 1966). Made public: 2020. Names: Zhou Enlai, Ayub Khan.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, vis:only:prc+pakistan]
