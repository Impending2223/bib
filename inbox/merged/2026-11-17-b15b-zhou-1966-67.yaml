patch: b15b-zhou-1966-67
by: 'Claude (batch 15, second wave, reader 4: *Zhou Enlai nianpu, 1949–1976*, the 2020 edition, vol. III (下卷), 1966–67; the 1997 middle volume ends with 1965), Nov. 16–17, 2026'
ops:
  - add:
      entry:
        id: cal.1966-01-04.china-leadership
        when: Jan. 4
        date: '1966-01-04'
        thread: china-leadership
        c: Zhou Enlai meets Huang Zhong, Rong Gaotang, Zhang Yan, Li Chang and Chen Shuliang on arrangements for the Asian Games of the New Emerging Forces.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 1 (Jan. 4, 1966). Made public: 2020. Names: Zhou Enlai, Huang Zhong, Rong Gaotang, Zhang Yan, Li Chang, Chen Shuliang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-05.china-leadership-2
        when: Jan. 5
        date: '1966-01-05'
        thread: china-leadership
        c: 'Zhou Enlai approves the State Planning Commission''s report (Song Shaowen) on opposing waste, practising thrift, the "three inspections" of stocks and the recovery of scrap metal: a nationwide output-and-thrift drive; scrap steel to furnaces first, handicrafts second, others third. Song to draft the note of the Center and the State Council; a State Council leading group is set up, and units and provinces are to set up theirs.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 1 (Jan. 5, 1966). Made public: 2020. To check: the report *Guanyu fandui langfei, lixing jieyue, kaizhan "sancha" he fei jinshu huishou gongzuo de baogao* (关于反对浪费、厉行节约、开展“三查”和废金属回收工作的报告) and the Center''s and State Council''s notice of Jan. 16, 1966 (named by the chronology, not printed in it). Names: Zhou Enlai, Song Shaowen.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-16.china-leadership-3
        when: Jan. 16
        date: '1966-01-16'
        thread: china-leadership
        c: The Center and the State Council forward to the whole country the State Planning Commission's report on opposing waste, practising thrift and recovering scrap metal.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 1 (under Jan. 5, 1966). Made public: 2020. See [[cal.1966-01-05.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-06.china-leadership-2
        when: Jan. 6
        date: '1966-01-06'
        thread: china-leadership
        c: 'Zhou Enlai hears Xie Fuzhi on a national public security conference to be called. Public security is run by the whole Party and people, under the Party committees, against vertical command and mystery. Six points on secrecy: officials transferred away not to meddle in their old units or keep their papers and passes; no "old chief" ties; a national secrecy conference with the security conference, Peng Zhen presiding.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 1–2 (Jan. 6, 1966). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi, Peng Zhen.'
        tags: [name:zhou-enlai, name:xie-fuzhi, name:peng-zhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-07.china-leadership
        when: Jan. 7
        date: '1966-01-07'
        thread: china-leadership
        also: [japan, vietnam-hanoi]
        c: 'Zhou Enlai receives the Japan Socialist Party Diet member Okada Haruo and Tsukada Shōhei, vice-chairman of the Hokkaido assembly. On Asia and Vietnam, at their request: Vietnam is the focus of the world''s contradictions; two camps, the U.S. insisting on the war, the rest demanding U.S. troops leave the South; the U.S. in a dilemma.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 2 (Jan. 7, 1966). Made public: 2020. Names: Zhou Enlai, Okada Haruo, Tsukada Shōhei.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1966-01-08.china-leadership
        when: Jan. 8
        date: '1966-01-08'
        thread: china-leadership
        c: 'Zhou Enlai at the Secretariat meeting, which hears Jiang Nanxiang on the national conference on half-work, half-study higher education. Zhou: go carefully and steadily or it will collapse; reform of the humanities needs at least two years of trial; the Ministry of Higher Education to go down and see; do not cut specialties so fine.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 2 (Jan. 8, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Nanxiang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-09.china-leadership
        when: Jan. 9
        date: '1966-01-09'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai orders the air force to fight U.S.-made Nationalist aircraft over the territorial sea. The same day an air force unit shoots down one U.S.-made aircraft over East China.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 2 (Jan. 9, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-10.china-leadership
        when: Jan. 10
        date: '1966-01-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, answering the General Staff Operations Department on whether to fire on the transport plane carrying Zhang Qun to inspect Quemoy: "Better not to fire."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 2 (Jan. 10, 1966). Made public: 2020. Names: Zhou Enlai, Zhang Qun.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-12.china-leadership-2
        when: Jan. 12
        date: '1966-01-12'
        thread: china-leadership
        c: Zhou Enlai meets the responsible officials on the price question.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 3 (Jan. 12, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-13.china-leadership
        when: Jan. 13
        date: '1966-01-13'
        thread: china-leadership
        c: Zhou Enlai hears the report on the Fifth National Cotton Conference.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 3 (Jan. 13, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-15.china-leadership
        when: Jan. 15
        date: '1966-01-15'
        thread: china-leadership
        c: Zhou Enlai at the closing session of the Fifth National Cotton Conference, on preparing for war, for famine and for the people. China will not start a war, but with the Vietnam war widening every field is to build with war in mind; some disaster is certain, so leave a margin. Cotton acreage cut only after consulting the communes, by the mass line, with no forced quotas; grain first.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 3 (Jan. 13, 1966; the 15th). Made public: 2020. To check: the speech as printed, if printed. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-14.china-leadership
        when: Jan. 14
        date: '1966-01-14'
        thread: china-leadership
        c: Zhou Enlai meets Ding Laifu, Xu Zirong and Yang Chengwu on the security of radio stations.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 3 (Jan. 14, 1966). Made public: 2020. Names: Zhou Enlai, Ding Laifu, Xu Zirong, Yang Chengwu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-16.china-leadership-2
        when: Jan. 16
        date: '1966-01-16'
        thread: china-leadership
        c: 'Zhou Enlai reports to the all-army political work conference on the international situation and, at home, on preparing for war, for famine and for the people. On fighting aggression: lure the enemy deep into our own territory, where the terrain is known and the people close, to destroy him in large numbers. On farming: grain output first; a Party that leaves the people has nothing to lead.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 3–4 (Jan. 16, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-17.china-leadership
        when: Jan. 17
        date: '1966-01-17'
        thread: china-leadership
        c: 'Zhou Enlai receives a delegation of the Progressive Labor Party of the United States led by Max, and recounts the Chinese party''s early history and lessons: the task is to defeat U.S. imperialist aggression; ending U.S. imperialism is the Americans'' own domestic affair, for their party and people.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4 (Jan. 17, 1966). Made public: 2020. Names: Zhou Enlai, Max.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+us]
  - add:
      entry:
        id: cal.1966-01-18.china-leadership
        when: Jan. 18
        date: '1966-01-18'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Zhou Enlai talks with the DRV government economic delegation under Deputy Premier Lê Thanh Nghị. On the Soviet cut-off of aid: the harm may do no damage and some good, forcing self-reliance; had Soviet help continued, China''s atomic bomb would not have gone off, or would have been controlled; science needs practice.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4 (Jan. 18, 1966). Made public: 2020. Names: Zhou Enlai, Lê Thanh Nghị.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1966-01.china-leadership
        when: Jan., mid
        date: 1966-01
        thread: china-leadership
        c: 'Zhou Enlai revises the Center''s and State Council''s notice forwarding Zhejiang''s report on hog trading: the 1965 national loss on hogs was 4.4 billion yuan; commercial departments to follow Zhejiang''s experience. Zhou adds a line: buy in time within the province, push sales, face the countryside.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4 (Jan., mid, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1966-01-11
  - add:
      entry:
        id: cal.1966-01-21.china-leadership
        when: Jan. 21
        date: '1966-01-21'
        thread: china-leadership
        also: [vietnam-hanoi, africa]
        c: Zhou Enlai writes Tanzania's President Nyerere on Vietnam, exposing the U.S. President's "fourteen points" for a "peaceful settlement" as a plot, and reaffirming support for the DRV's position. Asks Nyerere to speak out among the Afro-Asian states.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4 (Jan. 21, 1966). Made public: 2020. To check: the letter, if printed. Names: Zhou Enlai, Nyerere, Johnson. Check: the chronology ties the "fourteen points" to a Honolulu conference; the Honolulu conference met Feb. 6–8, 1966.'
        tags: [name:zhou-enlai, name:nyerere-julius-k, name:johnson-lyndon-b, polity:prc, vis:only:prc+tanzania]
  - add:
      entry:
        id: cal.1966-01-22.china-leadership
        when: Jan. 22
        date: '1966-01-22'
        thread: china-leadership
        also: [japan, china]
        c: 'Zhou Enlai receives the Japan–China Trade Promotion Association delegation under Kawase Ikkan, with Kimura Ichizō of the Kansai trade promotion body. An air agreement: both need it; the Ikeda and Satō governments opposed it because "the U.S. does not permit". At Warsaw the U.S. refused China''s proposals on peaceful coexistence and withdrawal from Taiwan. China will not start a war but, if forced, is ready.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4–5 (Jan. 22, 1966). Made public: 2020. Names: Zhou Enlai, Kawase Ikkan.'
        tags: [name:zhou-enlai, name:ikeda-hayato, polity:prc, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1966-01-22.china-leadership-2
        when: Jan. 22
        date: '1966-01-22'
        thread: china-leadership
        c: Zhou Enlai, at the Peking Hotel weekend party, watches the Central Nationalities Song and Dance Ensemble. Art for the masses is the direction and comes from the people; keep the Western, raise the national; singing while dancing is good and to be kept up.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 5 (Jan. 22, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-23.china-leadership
        when: Jan. 23
        date: '1966-01-23'
        thread: china-leadership
        c: 'Zhou Enlai writes Deng Xiaoping, Peng Zhen and Li Fuchun: he goes to Tianjin this afternoon to treat a hand ailment; urgent diplomatic and defence matters to Deng for decision, the State Council''s routine requests to Li Fuchun.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 5 (Jan. 23, 1966). Made public: 2020. Names: Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Fuchun.'
        tags: [name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:li-fuchun, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-24.china-leadership
        when: Jan. 24
        date: '1966-01-24'
        thread: china-leadership
        c: Zhou Enlai, Tianjin, hears Lin Tie, Liu Zihou and Yan Dakai on drought resistance and farm output. Drought touches every side of production; cadres go down level by level, provincial secretaries each to cover one or two prefectures; emulation drives four times a year; do not let the Four Cleanups hurt production; city industry to support farming; side occupations needed.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 5–6 (Jan. 24, 1966). Made public: 2020. Names: Zhou Enlai, Lin Tie, Liu Zihou, Yan Dakai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-26.china-leadership
        when: Jan. 26–31
        date: '1966-01-26'
        thread: china-leadership
        c: Zhou Enlai attends the agriculture conference in Peking. From the 27th to the 31st he hears seven reports on farming.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 6 (Jan. 26, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-28.china-leadership
        when: Jan. 28
        date: '1966-01-28'
        thread: china-leadership
        c: Zhou Enlai, Tianjin, hears the city's responsible officials on farm leadership, land clearing, tree planting and learning from other places. The municipal committee to give half its strength to farming, its secretaries and mayors each taking a district and visiting four times a year; plant by the teams own discussion; grain first on new land; tree the Peking–Tianjin road; learn from others and keep a local banner.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 6 (Jan. 28, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-28.china-leadership-2
        when: Jan. 28
        date: '1966-01-28'
        thread: china-leadership
        c: 'Zhou Enlai finishes revising the Propaganda Department''s forwarding note and Qian Xinzhong''s report on family planning. The report: a natural increase of 27.8 per thousand a year; the note: family planning is a great matter, to be pressed as the Center''s and State Council''s instruction of December 1962 directs. Zhou adds Tianjin''s birth rate, over 30 per thousand after liberation, 13 in 1964, and calls for late marriage first in the cities.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 6–7 (Jan. 28, 1966). Made public: 2020. Names: Zhou Enlai, Qian Xinzhong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-30.china-leadership
        when: Jan. 30
        date: '1966-01-30'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, with Deng Xiaoping and Peng Zhen, calls Luo Ruiqing in for a talk.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 7 (Jan. 30, 1966). Made public: 2020. Names: Zhou Enlai, Deng Xiaoping, Peng Zhen, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-31.china-leadership
        when: Jan. 31
        date: '1966-01-31'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai writes Deng Xiaoping and Peng Zhen on the Center''s planned circulation of three documents criticizing Luo Ruiqing''s "errors": issue them through the General Political Department as an internal document, leaving some room.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 7 (Jan. 31, 1966). Made public: 2020. Names: Zhou Enlai, Deng Xiaoping, Peng Zhen, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-01-31.china-leadership-2
        when: Jan. 31
        date: '1966-01-31'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai has his secretary trace the sources of three sayings: "military affairs is politics", "military and politics equally important", "military and politics take turns in the lead". The secretary reports, after asking the General Political Department and Liu Zhijian, that Lin Biao framed the three as a summary; Luo Ruiqing said things of the kind in several talks but never so summed up.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 7 (Jan. 31, 1966). Made public: 2020. Names: Zhou Enlai, Luo Ruiqing, Lin Biao, Liu Zhijian.'
        tags: [name:zhou-enlai, name:luo-ruiqing, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-01.china-leadership-2
        when: Feb. 1
        date: '1966-02-01'
        thread: china-leadership
        c: 'Zhou Enlai chairs the drought-resistance conference of eight provinces, municipalities and regions (Peking, Hebei, Inner Mongolia, Shanxi, Shaanxi, Shandong, Henan, Liaoning), and gives the summing-up report. The area is a weak one for "preparing for war and famine, for the people": the task, to resist drought and waterlogging, win harvests and shake off backwardness; grain self-supply, surplus in the teams, a state reserve. Proposes central and local farm leading groups; the eight divided into seven groups, Zhou heading Hebei and Peking.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 7–8 (Feb. 1, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-02.china-leadership-2
        when: Feb. 2
        date: '1966-02-02'
        thread: china-leadership
        also: [africa, vietnam-hanoi]
        c: Zhou Enlai receives the departing Guinean Ambassador Camara Mamadi and a Guinean economic delegation. The U.S. is set on widening the war in Vietnam; its "peace offensive" deceives world opinion. Message for President Touré. Education to join life, history and production; socialist states should help the nationalist states to self-reliance; victories come by struggle, not talks.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 8 (Feb. 2, 1966). Made public: 2020. Names: Zhou Enlai, Camara Mamadi, Touré.'
        tags: [name:zhou-enlai, name:toure-ahmed-sekou, polity:prc, vis:only:prc+guinea]
  - add:
      entry:
        id: cal.1966-02-02.china-leadership-3
        when: Feb. 2
        date: '1966-02-02'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou Enlai to Li Tianyou and Li Qiang, on the Vietnamese foreign trade ministry''s complaint that Chinese departments, ignorant of the facts, insisted on shipping aid goods in covered wagons or not at all: "Why so mechanical? Not like wartime transport. Correct it at once; sum up and do not repeat it."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 8 (Feb. 2, 1966). Made public: 2020. Names: Zhou Enlai, Li Tianyou, Li Qiang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1966-02-03.china-leadership-3
        when: Feb. 3
        date: '1966-02-03'
        thread: china-leadership
        c: Zhou Enlai meets Tan Zhenlin, Li Xiannian, Yu Qiuli, Wang Guangwei, Chen Manyuan, Jiang Yizhen, Hao Zhongshi, Chen Zhengren, Qian Zhengying and Hui Zhongquan on farming in the Northwest and Southwest.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 9 (Feb. 3, 1966). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin, Li Xiannian, Yu Qiuli, Wang Guangwei, Chen Manyuan, Jiang Yizhen, Hao Zhongshi, Chen Zhengren, Qian Zhengying, Hui Zhongquan.'
        tags: [name:zhou-enlai, name:tan-zhenlin, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-04.china-leadership
        when: Feb. 4–5
        date: '1966-02-04'
        thread: china-leadership
        c: Zhou Enlai sees the officials concerned on farming and water conservancy.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 9 (under Feb. 3, 1966). Made public: 2020. See [[cal.1966-02-03.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-05.china-leadership-4
        when: Feb. 5
        date: '1966-02-05'
        thread: china-leadership
        c: Zhou Enlai attends the meeting Liu Shaoqi calls on studying Mao's works. Mid-month the Center issues a notice forwarding the units' reports on strengthening the study of Mao's works.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 10 (Feb. 5, 1966). Made public: 2020. To check: the Center''s notice, mid-Feb. 1966 (named by the chronology, not printed in it). Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-02-02.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 9 (Feb. 2–20, 1966; the forum; Jiang Qing''s attack on Zhou''s call for "separate first, then merge" and on *The East Is Red*; the summary and its issue Apr. 10, note 1)'
  - cite:
      id: cal.1966-02-03.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 10 (Feb. 3, 1966; the Five-Man Group''s meeting and the Outline, with Peng Zhen and Lu Dingyi to Wuchang on the 8th)'
  - add:
      entry:
        id: cal.1966-02-06.china-leadership-2
        when: Feb. 6
        date: '1966-02-06'
        thread: china-leadership
        c: Zhou Enlai meets Foreign Ministry staff on the Foreign Ministry's Fourth Conference of Ambassadors Abroad.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 11 (Feb. 6, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-07.china-leadership
        when: Feb. 7
        date: '1966-02-07'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou Enlai, before dawn, writes Liu Shaoqi, Deng Xiaoping and Peng Zhen: he had meant to take up the international questions (diplomacy, war preparation, aid abroad, the Vietnam war) after Peng Zhen''s talk at the Chairman''s; it is better not to wait; proposes a talk at Liu''s at 3:30 that afternoon, and has Li Zhizhong summon Li Fuchun, Li Xiannian, Lu Dingyi, Kang Sheng, Wu Lengxi, Liao Chengzhi, Liu Ningyi, Zhang Hanfu, Qiao Guanhua and Li Tianyou. Liu: agreed.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 11 (Feb. 7, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Li Zhizhong, Li Fuchun, Li Xiannian, Lu Dingyi, Kang Sheng, Wu Lengxi, Liao Chengzhi, Liu Ningyi, Zhang Hanfu, Qiao Guanhua, Li Tianyou.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:li-fuchun, name:li-xiannian, name:lu-dingyi, name:kang-sheng, name:qiao-guanhua, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-07.china-leadership-2
        when: Feb. 7
        date: '1966-02-07'
        thread: china-leadership
        c: Zhou Enlai at Liu Shaoqi's, 3:30 p.m., for the talk on international questions.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 11 (Feb. 7, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-08.china-leadership-2
        when: Feb. 8–9
        date: '1966-02-08'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou Enlai reports to the Foreign Ministry''s Fourth Conference of Ambassadors Abroad on five matters: the situation, the international anti-U.S. united front, the Vietnam war, foreign work and the study of Mao''s works. Foreign policy is the Center''s to hold and report to; but do not ask the Center on technical and routine acts; the fronts commanders, guided by Mao''s thought, to act flexibly. Foreign work has Party, state and people''s sides, to be joined; foreign trade and foreign economic work too; front-line work to be led as one, in the embassy''s Party committee.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 11–12 (Feb. 8, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-10.china-leadership
        when: Feb. 10–17
        date: '1966-02-10'
        thread: china-leadership
        also: [africa, indonesia]
        c: Zhou Enlai, in the days after the Conference of Ambassadors, talks with envoys serving in West Asia, Africa, Northwest Europe, Indonesia and other regions on foreign affairs.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 11–12 (Feb. 8–9, 1966, next item). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-09.china-leadership-3
        when: Feb. 9
        date: '1966-02-09'
        thread: china-leadership
        also: [africa, vietnam-hanoi]
        c: 'Zhou Enlai receives the departing Ghanaian ambassador (Mai Ye, 麦耶) on the Vietnam war and on President Nkrumah''s visit to China. He exposes the U.S. and South Vietnamese leaders joint communiqué at Honolulu: the U.S., its "peace talk" ruse failing and wary of widening the war, wants a joint statement to deceive the world''s peoples and meet quarrels at home.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 12 (Feb. 9, 1966). Made public: 2020. Names: Zhou Enlai, Nkrumah.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, polity:prc, vis:only:prc+ghana]
  - add:
      entry:
        id: cal.1966-02-12.china-leadership-3
        when: Feb. 12
        date: '1966-02-12'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou Enlai at the Politburo Standing Committee, Liu Shaoqi presiding, hears Yu Qiuli, back from the Southwest and Northwest, on Third Front construction. On air-raid safety of factories moved to the Third Front: concealment first, but also mountain sites and dispersal, the three combined; the Construction Commission to send someone to Vietnam to see how raids are met.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 12 (Feb. 12, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Yu Qiuli.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-13.china-leadership
        when: Feb. 13
        date: '1966-02-13'
        thread: china-leadership
        c: 'Zhou Enlai talks with some Chinese ambassadors on scientific and technical study tours: examine exits more strictly, stagger them, not many to one country; some foreign things are not advanced; badly chosen tours give away China''s own bottom; the State Council''s Foreign Affairs Office to hold the gate. Embassies to take up scientific and technical research; diplomats in the West and their wives to learn some science.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 12 (Feb. 13, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-15.china-leadership
        when: Feb. 15
        date: '1966-02-15'
        thread: china-leadership
        c: 'Zhou Enlai hears Chen Zhengren on the Hebei groups drought work, and on method: working groups add no burden, do not point and order, learn from local cadres and masses, help and take direction ("one learn, two help, three obey"), settle disagreements within the group and then speak singly to local leaders; no "five manys".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 12–13 (Feb. 15, 1966). Made public: 2020. Names: Zhou Enlai, Chen Zhengren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-16.china-leadership
        when: Feb. 16
        date: '1966-02-16'
        thread: china-leadership
        c: Zhou Enlai calls Yang Chengwu, Xiao Hua and the Railway Corps' responsible officers in turn on Railway Corps matters.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 13 (Feb. 16, 1966). Made public: 2020. Names: Zhou Enlai, Yang Chengwu, Xiao Hua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-16.china-leadership-2
        when: Feb. 16
        date: '1966-02-16'
        thread: china-leadership
        also: [vietnam-hanoi, africa]
        c: 'Zhou Enlai tells the Foreign Ministry to cable Huang Hua, chargé in Ghana, to tell President Nkrumah, soon to visit Vietnam: the U.S. has exposed its "sincerity for peace" by its own acts; any talks proposal now can only help it keep the South and divide Vietnam for good, and deprive the Vietnamese of the right to resist.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 13 (Feb. 16, 1966). Made public: 2020. Names: Zhou Enlai, Huang Hua, Nkrumah.'
        tags: [name:zhou-enlai, name:huang-hua, name:nkrumah-kwame, polity:prc, vis:only:prc+ghana]
  - add:
      entry:
        id: cal.1966-02-17.china-leadership
        when: Feb. 17
        date: '1966-02-17'
        thread: china-leadership
        c: 'Zhou Enlai, on the Central General Office cipher bureaus written report on reforming cipher work (Li Zhizhong had called the Foreign Ministry, Investigation Department, General Staff and the bureau to meet): agreed; first the code books, then compilation, printing, delivery, use, custody and destruction.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 13 (Feb. 17, 1966). Made public: 2020. Names: Zhou Enlai, Li Zhizhong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-17.china-leadership-2
        when: Feb. 17
        date: '1966-02-17'
        thread: china-leadership
        c: 'Zhou Enlai reads Yu Qiuli''s outline on Third Front construction: the large and small fronts have done well; steel still lags, and mine construction is the core fault. Sends it to Mao: "Worth a look; please skim."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 13 (Feb. 17, 1966). Made public: 2020. Names: Zhou Enlai, Yu Qiuli, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-17.china-leadership-3
        when: Feb. 17
        date: '1966-02-17'
        thread: china-leadership
        c: Zhou Enlai attends the Standing Committee meeting under Liu Shaoqi and hears Yang Chengwu.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 13 (Feb. 17, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Yang Chengwu.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-18.china-leadership
        when: Feb. 18
        date: '1966-02-18'
        thread: china-leadership
        c: Zhou Enlai calls Wang Lin, Chen Manyuan, Hui Zhongquan and Wang Guangwei in turn on farming.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14 (Feb. 18, 1966). Made public: 2020. Names: Zhou Enlai, Wang Lin, Chen Manyuan, Hui Zhongquan, Wang Guangwei.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-18.china-leadership-2
        when: Feb. 18
        date: '1966-02-18'
        thread: china-leadership
        c: 'Zhou Enlai to Zhang Jichun, on the epidemic meningitis: have the health, commerce and chemical industry ministries, with Yao Yilin and Tong Xiaopeng, meet and settle at once prevention, treatment, and drug production and supply.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14 (Feb. 18, 1966). Made public: 2020. Names: Zhou Enlai, Zhang Jichun, Yao Yilin, Tong Xiaopeng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-19.china-leadership-2
        when: Feb. 19
        date: '1966-02-19'
        thread: china-leadership
        c: 'Zhou Enlai at the Politburo Standing Committee, Liu Shaoqi presiding, hears Bo Yibo and Tao Lujia on the national industry-and-transport work conference and its political work conference. Transport, then power, go first; if they fail, nothing else rises. On support for farming: the norths eight provinces first.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14 (Feb. 19, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Bo Yibo, Tao Lujia.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-19.china-leadership-3
        when: Feb. 19
        date: '1966-02-19'
        thread: china-leadership
        c: Zhou Enlai at Zhongshan Hall in Zhongshan Park, to mourn and join the public memorial for Chen Shutong, vice-chairman of the National People's Congress Standing Committee.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14 (Feb. 19, 1966). Names: Zhou Enlai, Chen Shutong.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-02-20.china-leadership
        when: Feb. 20
        date: '1966-02-20'
        thread: china-leadership
        c: 'Zhou Enlai reads the First Machine Ministry''s report on measures against drought in the eight northern provinces: the spirit and measures are good; whether they disturb the plan and the production and materials set earlier is to be seen; Bo Yibo and Yu Qiuli to settle and report.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14 (Feb. 20, 1966). Made public: 2020. Names: Zhou Enlai, Bo Yibo, Yu Qiuli.'
        tags: [name:zhou-enlai, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-09.china-leadership-3
        when: Mar. 9
        date: '1966-03-09'
        thread: china-leadership
        c: Yu Qiuli tells Zhou Enlai that, with some adjustment and untapped capacity, the First Machine Ministry's drought measures will mostly not disturb the plan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14 (under Feb. 20, 1966). Made public: 2020. See [[cal.1966-02-20.china-leadership]]. Names: Zhou Enlai, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-21.china-leadership-3
        when: Feb. 21–25
        date: '1966-02-21'
        thread: china-leadership
        c: Zhou Enlai revises several times the draft Center and State Council directive on fighting drought and waterlogging to change the norths farm backwardness, adding that soil moisture is under 10 percent in many places, and that cadres are to study and spread Jiao Yulu's example at Lankao. Later, as it lacks concrete plans, he proposes not issuing it for the time being.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14–15 (Feb. 21, 1966). Made public: 2020. Names: Zhou Enlai, Jiao Yulu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-22.china-leadership
        when: Feb. 22
        date: '1966-02-22'
        thread: china-leadership
        c: Zhou Enlai amends the Center's and State Council's notice forming an agricultural leading group for the eight northern provinces, municipalities and regions (Shanxi, Hebei, Shandong, Henan, Shaanxi, Inner Mongolia, Liaoning, Peking), their farming a main strategic thrust. Zhou is group leader and heads the Hebei and Peking sections.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 15 (Feb. 22, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-23.china-leadership-2
        when: Feb. 23
        date: '1966-02-23'
        thread: china-leadership
        c: Zhou Enlai talks with the Northwest forestry officials and Forestry Ministry leaders at the national forestry conference. Tree planting is a hundred-year plan; plant as well as fell, on two legs, relying on the farmers; the masses first over state forests, tending over felling; Northwest planting to focus on the Yellow River's silt sources. He worries most that water control has gone wrong and the forests are overfelled; as Premier he cannot account for two things, the Yellow River and forestry.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 15 (Feb. 23, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-24.china-leadership
        when: Feb. 24–28
        date: '1966-02-24'
        thread: china-leadership
        also: [africa]
        c: Zhou Enlai receives Ghana's President Nkrumah, in China on a visit, and holds five talks with him.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 15 (Feb. 24, 1966). Made public: 2020. Names: Zhou Enlai, Nkrumah.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, polity:prc, vis:only:prc+ghana]
  - cite:
      id: cal.1966-02-24.africa
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 15 (Feb. 24–28, 1966; Nkrumah in Peking; the chronology dates Zhou''s five talks with him Feb. 24–28)'
