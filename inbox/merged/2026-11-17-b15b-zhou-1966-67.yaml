  - add:
      entry:
        id: cal.1966-06-18.china-leadership
        when: June 18
        date: '1966-06-18'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou Enlai, in talks with the Romanian leaders, on China: the first Five-Year Plan had to copy Soviet experience for want of any; at its end China resolved to build its own socialist road on the three transformations, self-reliant. A nation has a dependence habit, most in intellectuals, to be long cured; science and technology have advanced but unevenly; China is poor and blank and may need twenty or thirty years, near the century''s end, to escape backwardness. The aim of socialist construction is to narrow the three differences; for that, the superstructure must be attended to.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 37 (June 18, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+romania]
  - add:
