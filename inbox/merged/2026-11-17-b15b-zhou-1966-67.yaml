        id: cal.1966-06-16.china-leadership-2
        when: June 16–24
        date: '1966-06-16'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Zhou Enlai leads the Chinese party and government delegation to Romania. On the way he stops briefly in Afghanistan and tells Prime Minister Maiwandwal that the key to Vietnam is restoring the Geneva Agreements, and the key to that the withdrawal of U.S. troops and its allies troops from the South and the rest of Indochina, the end of aggression, and the Vietnamese and Indochinese peoples settling their own affairs.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 37 (June 16, 1966). Names: Zhou Enlai. Check: the day of the Afghan stop.'
