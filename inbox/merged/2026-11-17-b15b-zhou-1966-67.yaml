  - cite:
      id: cal.1966-08-01.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 43 (Aug. 1, 1966; Zhou at the opening; Deng gives the agenda; Liu Shaoqi''s report and his taking responsibility for the work groups; Chen Boda charges the groups with wrong)'
  - cite:
      id: cal.1966-08-01.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 43 (Aug. 1–3, 1966; Zhou handles Tsinghua for Mao: Aug. 1 Wang Guangmei, Ye Lin, and twice Kuai Dafu; Aug. 2 and 3 Wang and Ye again, and Tsinghua students and some of the work group)'
  - add:
      entry:
        id: cal.1966-08-02.china-leadership
        when: Aug. 2
        date: '1966-08-02'
        thread: china-leadership
        c: Zhou Enlai, after a meeting at Mao's, speaks at the Eleventh Plenum on four years' experience and the Cultural Revolution. Since the Tenth Plenum every major decision was Mao's own; Mao had the Nie Yuanzi poster printed, and withdrew the work groups. For the work groups the Standing Committee, above all those running the Center in Peking, bear the responsibility; most of their cadres are good.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 2, 1966). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Nie Yuanzi.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-03.china-leadership-3
        when: Aug. 3
        date: '1966-08-03'
        thread: china-leadership
        c: 'Zhou Enlai has his secretary tell Ye Lin that the Tsinghua all-staff-and-student meeting is put off to Aug. 4: some speeches are not ready, and the Center''s Cultural Revolution Group is to be consulted; Ye is to send the draft speech.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 3, 1966). Made public: 2020. Names: Zhou Enlai, Ye Lin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-03.china-leadership-4
        when: Aug. 3
        date: '1966-08-03'
        thread: china-leadership
        c: Zhou Enlai calls Wang Li and Guan Feng on Tsinghua, then Ye Lin and some of the work group separately.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 3, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Wang Li, Guan Feng, Ye Lin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-03.china-leadership-5
        when: Aug. 3
        date: '1966-08-03'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, answering Liu Zhijian''s request on whether to withdraw the work groups from the army''s colleges: take it up at today''s afternoon meeting of the Center; it must be reported to the Chairman.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 3, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Zhijian.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-04.china-leadership-3
        when: Aug. 4
        date: '1966-08-04'
        thread: china-leadership
        c: Zhou Enlai attends the Cultural Revolution Group's meeting, before the enlarged Standing Committee meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 4, 1966). Made public: 2020. See [[cal.1966-08-04.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-04.china-leadership-4
        when: Aug. 4
        date: '1966-08-04'
        thread: china-leadership
        c: Zhou Enlai speaks that evening at the Tsinghua all-staff-and-student debate meeting, Li Xuefeng presiding. He comes as a Center worker to learn and to support carrying the Cultural Revolution through; Mao and the Standing Committee had him look into it at Tsinghua. He criticizes the work groups "errors" and clears Kuai Dafu; most of the group are old revolutionaries meeting new problems. Forming associations of workers, poor peasants and cadres' children in the schools is wrong; unite 90 percent of the masses and 95 percent of the cadres.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44–45 (Aug. 4, 1966). To check: the speech as circulated at Tsinghua. Names: Zhou Enlai, Li Xuefeng, Kuai Dafu.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-08-05.china-leadership-5
        when: Aug. 5
        date: '1966-08-05'
        thread: china-leadership
        c: Zhou Enlai, after a meeting at Mao's, telephones Liu Shaoqi and advises him not to appear in public for now and not to receive foreign guests (Liu had that day received a delegation under Zambia's Minister of Commerce and Industry, Chimba).
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (Aug. 5, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-05.china-leadership-6
        when: Aug. 5
        date: '1966-08-05'
        thread: china-leadership
        c: Zhou Enlai calls He Long, Nie Rongzhen, Chen Yi, Xu Xiangqian, Ye Jianying, Yang Chengwu and Liu Zhijian.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (Aug. 5, 1966, the item after). Made public: 2020. Names: Zhou Enlai, He Long, Nie Rongzhen, Chen Yi, Xu Xiangqian, Ye Jianying, Yang Chengwu, Liu Zhijian.'
        tags: [name:zhou-enlai, name:he-long, name:nie-rongzhen, name:chen-yi, name:xu-xiangqian, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-06.china-leadership-3
        when: Aug. 6
        date: '1966-08-06'
        thread: china-leadership
        c: Zhou Enlai calls other heads of the armed forces.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (under Aug. 5, 1966). Made public: 2020. See [[cal.1966-08-05.china-leadership-6]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-05.china-leadership-7
        when: Aug. 5
        date: '1966-08-05'
        thread: china-leadership
        c: Zhou Enlai tells the duty secretary to wake him at any hour if Mao's office calls him to a meeting or a talk.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (Aug. 5, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-05.china-leadership-8
        when: Aug. 5–11
        date: '1966-08-05'
        thread: china-leadership
        c: Zhou Enlai goes every day to Mao's for meetings, and talks with Liu Shaoqi, Deng Xiaoping, Chen Yun, Tao Zhu, Kang Sheng, Chen Boda, Xie Fuzhi and others.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (Aug. 5–11, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Chen Yun, Tao Zhu, Kang Sheng, Chen Boda, Xie Fuzhi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:chen-yun, name:tao-zhu, name:kang-sheng, name:chen-boda, name:xie-fuzhi, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-08-06.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (Aug. 6, 1966; at Mao''s on the lists of Standing Committee, Politburo and Secretariat members and candidates; Zhou drafts a list for Mao and Lin Biao; Mao moves Tao Zhu from seventh to fourth)'
  - cite:
      id: cal.1966-08-05.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45–46 (Aug. 7, 1966; the plenum circulates Mao''s "Bombard the Headquarters", which calls the Nie Yuanzi poster the country''s first Marxist-Leninist one and charges that for fifty-odd days from early June leaders from the Center down stood on the reactionary bourgeois side and ran a bourgeois dictatorship)'
  - add:
      entry:
        id: cal.1966-08-07.china-leadership-3
        when: Aug. 7
        date: '1966-08-07'
        thread: china-leadership
        c: Zhou Enlai tells Zhou Rongxin to explain quickly to the State Council reception staff the view of the Cultural Revolution and the attitude to the masses who come with reports, and to settle the fear of disorder and exaggerated reporting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 46 (Aug. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-08.china-leadership-2
        when: Aug. 8
        date: '1966-08-08'
        thread: china-leadership
        c: 'Zhou Enlai presides over the plenary session of the Eleventh Plenum. It adopts the Decision on the Great Proletarian Cultural Revolution, the Sixteen Points. In the discussion Zhou, after consulting Tao Zhu, strikes out "black gang" and "black line" and adds limits: sharply separate the two kinds of contradiction, treat cadres by case, unite over 95 percent of cadres and masses, do not set the movement against production, argument not force, protect scientists and technicians; these were taken in.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 46 (Aug. 8, 1966). Made public: 2020. See [[cal.1966-08-01.china-leadership]]. Names: Zhou Enlai, Tao Zhu.'
        tags: [name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-09.china-leadership
        when: Aug. 9
        date: '1966-08-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives an Albanian hydroelectric delegation under Deputy Minister of Construction Shali Angeni, and tells the officials of the Commission for Economic Relations with Foreign Countries at the reception: let those who know the facts attend; no diplomatic formalism. Aid construction needs inquiry and practice on the site in the recipient country, or the aid is dangerous: China gets no experience and the recipient is harmed.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 46–47 (Aug. 9, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1966-08-09.china-leadership-2
        when: Aug. 9
        date: '1966-08-09'
        thread: china-leadership
        c: 'Zhou Enlai reviews the Peking committees university Cultural Revolution committees draft notice on withdrawing work groups from colleges and middle schools: groups not yet withdrawn to leave within two or three days of the notice and gather for training. He sends it to Chen Boda and Kang Sheng for the Cultural Revolution Group to consider.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 47 (Aug. 9, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-10.china-leadership-2
        when: Aug. 10–14
        date: '1966-08-10'
        thread: china-leadership
        c: Zhou Enlai hears Yu Qiuli on the on-site conference on farm mechanization, on the 10th, 11th and 14th.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 47 (Aug. 10, 11, 14, 1966). Made public: 2020. Names: Zhou Enlai, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-16.china-leadership-2
        when: Aug. 16
        date: '1966-08-16'
        thread: china-leadership
        c: 'Zhou Enlai receives all the delegates to the on-site conference on farm mechanization. Press it hard and keep at it: only faster mechanization will raise output and the productivity of labor; be realistic, suit it to the place, be timely and prudent, chase no figures; train technical talent, and the Gongda (the Jiangxi Communist Labor University) is to be run well.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 47 (Aug. 10, 11, 14, 1966; the 16th). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-08-12.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 47–48 (Aug. 12, 1966; Zhou at the closing session under Lin Biao: the Standing Committee enlarged from seven to eleven, the order as given, the Vice-Chairmen other than Lin no longer mentioned; Zhou speaks on the personnel changes and on farm mechanization)'
  - cite:
      id: cal.1966-08-13.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 48 (Aug. 13, 1966; Zhou at the Central Work Conference under Lin Biao, who calls for a few months of uproar, a purge of "ghosts and monsters", and removals and promotions)'
  - add:
      entry:
        id: cal.1966-08-13.china-leadership-2
        when: Aug. 13
        date: '1966-08-13'
        thread: china-leadership
        c: Zhou Enlai sends Liu Xiyao at once to the Academy of Sciences as liaison, to keep track of its Cultural Revolution.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 48 (Aug. 13, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Xiyao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-14.china-leadership
        when: Aug. 14
        date: '1966-08-14'
        thread: china-leadership
        c: 'Zhou Enlai receives Poland''s departing ambassador (Keluotai, 克诺泰) and answers his questions on the Cultural Revolution: the natural result of the socialist revolution and education movement, a long task of breaking old thought, culture, custom and habit; most economic experts and authorities are patriotic and serve the people; with the Cultural Revolution as the key link, grasp revolution and promote production, which keeps growing.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 48 (Aug. 14, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+poland]
  - add:
      entry:
        id: cal.1966-08-15.china-leadership-3
        when: Aug. 15
        date: '1966-08-15'
        thread: china-leadership
        c: Zhou Enlai attends the Politburo Standing Committee meeting at Lin Biao's.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 48 (Aug. 15, 1966). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
        tags: [name:zhou-enlai, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-15.china-leadership-4
        when: Aug. 15
        date: '1966-08-15'
        thread: china-leadership
        c: Zhou Enlai calls Li Jingquan on the Southwest railway construction.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 48 (Aug. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Jingquan.'
        tags: [name:zhou-enlai, name:li-jingquan, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-08-18.india-and-china-cultural-revolution
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 48–49 (Aug. 18, 1966; Zhou with Mao and Lin Biao at the rally; Lin''s speech; Zhou''s: serve the people, be pupils of the masses before teachers, no doing for them and no commanding from above)'
  - add:
      entry:
        id: cal.1966-08-18.china-leadership-2
        when: Aug. 18–20
        date: '1966-08-18'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou Enlai talks with Vietnam''s Premier Phạm Văn Đồng. On the Cultural Revolution: a new revolutionary movement; old revolutionaries are strange to it and become conservatives, so continuing revolution is not easy.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 49 (Aug. 18, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
        tags: [name:zhou-enlai, name:pham-van-dong, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1966-08-18.china-leadership-3
        when: Aug. 18
        date: '1966-08-18'
        thread: china-leadership
        c: Zhou Enlai, that evening, learns that Red Guards intend, in the name of breaking the "four olds", to enter the Palace Museum. He orders it closed and has the Peking garrison send a battalion to guard it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 49 (Aug. 18, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-19.china-leadership
        when: Aug. 19
        date: '1966-08-19'
        thread: china-leadership
        c: Red Guards try to storm the Palace Museum; the staff, on Zhou Enlai's instruction, turn them back.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 49 (Aug. 18, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-19.china-leadership-2
        when: Aug. 19–20
        date: '1966-08-19'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai talks with Zambia''s Vice-President Reuben Kamanga. Western states ruled the Afro-Asian countries nearly a hundred years and cultural aggression was part of it; after independence, recovering national culture is as hard as building an independent economy. Many African states have no national language: language is a tool but not wholly, for the people or for imperialism to use.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 49 (Aug. 19, 1966). Made public: 2020. Names: Zhou Enlai, Reuben Kamanga.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+zambia]
  - cite:
      id: cal.1966-08-21.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 49 (Aug. 19–21, 1966; Zhou''s talks with Kamanga on the 19th and 20th, and at Mao''s reception on the 21st)'
  - add:
      entry:
        id: cal.1966-08-22.china-leadership
        when: Aug. 22
        date: '1966-08-22'
        thread: china-leadership
        c: 'Zhou Enlai, at a Tsinghua University mass meeting, on responsibility for sending work groups: as said before, it belongs to the new Peking committee and the Center comrades working in Peking, not to the school''s work groups alone.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 49–50 (Aug. 22, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-23.china-leadership
        when: Aug. 23
        date: '1966-08-23'
        thread: china-leadership
        c: 'Zhou Enlai reviews the ten-point draft on the Cultural Revolution in the State Council''s branches, which Li Fuchun drew with Li Xiannian, Tan Zhenlin, Bo Yibo, Yu Qiuli and Yao Yilin: stronger leadership, state secrets protected, care for cadres under attack. He notes that it fits the three excepted branches too, and sends it through Chen Boda to Mao and Lin Biao. Mao does not agree.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 50 (Aug. 23, 1966). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Yu Qiuli, Yao Yilin, Chen Boda, Mao Zedong, Lin Biao.'
        tags: [name:zhou-enlai, name:li-fuchun, name:li-xiannian, name:tan-zhenlin, name:bo-yibo, name:chen-boda, name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-08-29.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 50 (Aug. 23, 29, 1966; Mao, at the enlarged Standing Committee meeting of Aug. 29, on the ten points of the State Council''s branches: "not one; why ten, when there are the Sixteen Points")'
  - add:
      entry:
        id: cal.1966-08-23.china-leadership-2
        when: Aug. 23
        date: '1966-08-23'
        thread: china-leadership
        c: Zhou Enlai goes to Mao's for a meeting, then to Lin Biao's for a talk.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 50 (Aug. 23, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
        tags: [name:zhou-enlai, name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-24.china-leadership
        when: Aug. 24
        date: '1966-08-24'
        thread: china-leadership
        c: 'Zhou Enlai attends the Center''s "meeting of heads": in fact the enlarged Standing Committee meeting, ordinarily called by Zhou, since Lin Biao, after the Eleventh Plenum, chaired a few and then left the Center''s daily work to Zhou.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 50 (Aug. 24, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-26.china-leadership-3
        when: Aug. 26
        date: '1966-08-26'
        thread: china-leadership
        c: Zhou Enlai speaks at the founding meeting of the Red Guard general liaison station of Peking's colleges and middle schools. Set up a general station, branch stations in the districts; its main task is to help and protect the Red Guards and to explain Party policy. The Peking committee set it up on Zhou's instruction.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 50 (Aug. 26, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-08-26.china-leadership-4
        when: Aug. 26
        date: '1966-08-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai telephones Tan Qilong, about to leave Jinan to deal with the Qingdao colleges attack on the city committee and their struggle against its leaders: no attacking the municipal committee, and struggling the cadres is wrong; stop it.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 50–51 (Aug. 26, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tan Qilong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08.china-leadership
        when: Aug., late
        date: 1966-08
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, a few days after, telephones Tan Qilong again: the Shandong committee can hardly work; put on uniform and, as first political commissar of the Jinan Military Region, go out and work on both factions.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 51 (Aug. 26, 1966, "几天后"). Made public: 2020. Names: Zhou Enlai, Tan Qilong. Check: the day; the chronology says a few days after Aug. 26.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1966-08-21
  - add:
      entry:
        id: cal.1966-08-27.china-leadership
        when: Aug. 27
        date: '1966-08-27'
        thread: china-leadership
        c: Zhou Enlai, at 11 p.m. at the Working People's Cultural Palace, receives delegates of the Capital Colleges Red Guard Headquarters (the first headquarters). Zhongnanhai, the Great Hall, the radio stations, the newspapers and the airports are absolutely not to be stormed; the Red Guards are to help the PLA keep order in the capital; heads in the General Staff and elsewhere to serve as liaison and give them offices, transport, communications and propaganda gear.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 51 (Aug. 27, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-08-28.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 51 (Aug. 28, 1966; Mao to Tang Pingzhu and Hu Chi: the students to sweep ghosts and monsters in society; Tao Zhu: 140,000 out-of-town students in Peking; Mao: let them all come; the Cultural Revolution to run at least to the Spring Festival)'
  - add:
      entry:
        id: cal.1966-08-28.china-leadership-4
        when: Aug. 28
        date: '1966-08-28'
        thread: china-leadership
        c: Zhou Enlai, after Mao's remarks, begins arranging for housing Red Guards in Zhongnanhai and does a great deal of work on it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 51 (Aug. 28, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-28.china-leadership-5
        when: Aug. 28–30
        date: '1966-08-28'
        thread: china-leadership
        c: Zhou Enlai attends the mass meeting at the National Defense Science Commission's Institute of Metrology, to learn how the Cultural Revolution stands in the Commission.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 51 (Aug. 28, 29, 30, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-29.china-leadership-2
        when: Aug. 29
        date: '1966-08-29'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou Enlai, told that Red Guards of a Peking middle school will rename Yangwei Road, before the Soviet embassy, "Anti-Revisionist Road" and hold a naming meeting on the spot, calls an emergency meeting at 2 a.m. and talks them round: the renaming is allowed, but no anti-revisionist wall posters on the embassy or its wall, and no cursing at it. After the meeting he has Fu Chongbi send a battalion of the garrison, unarmed, to the spot to prevent the embassy being stormed, and tells the duty secretary to report at once any emergency.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 51–52 (Aug. 29, 1966). Made public: 2020. Names: Zhou Enlai, Fu Chongbi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-30.china-leadership-3
        when: Aug. 30
        date: '1966-08-30'
        thread: china-leadership
        c: Zhou Enlai calls Tao Zhu, Li Fuchun, Kang Sheng, Ye Jianying, Xie Fuzhi, Li Xiannian, Tan Zhenlin, Bo Yibo, Chen Yi, Wu De, Wang Dongxing and Zhou Rongxin on the political education of the Red Guards.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52 (Aug. 30, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Li Fuchun, Kang Sheng, Ye Jianying, Xie Fuzhi, Li Xiannian, Tan Zhenlin, Bo Yibo, Chen Yi, Wu De, Wang Dongxing, Zhou Rongxin.'
        tags: [name:zhou-enlai, name:tao-zhu, name:li-fuchun, name:kang-sheng, name:ye-jianying, name:xie-fuzhi, name:li-xiannian, name:tan-zhenlin, name:bo-yibo, name:chen-yi, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-08-30.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52 (Aug. 30, 1966; Zhou''s three orders on Zhang Shizhao and the list of persons to be protected)'
  - add:
      entry:
        id: cal.1966-08-30.china-leadership-4
        when: Aug. 30
        date: '1966-08-30'
        thread: china-leadership
        c: Zhou Enlai tells the Ministry of Public Security to pass his list of persons to be protected to the United Front Work Department, which is to mark out the range by it and draw up a list of non-Party figures. The list takes in, besides those named in Zhou's three orders, the state Vice-Chairmen, the vice-chairmen and members of the NPC Standing Committee, the CPPCC vice-chairmen, the State Council's vice-premiers, ministers and vice-ministers, the heads of the democratic parties, and the presidents of the Supreme People's Court and Procuratorate.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52 (Aug. 30, 1966, the item after). Made public: 2020. See [[cal.1966-08-30.china-leadership]]. Names: Zhou Enlai, Soong Ching Ling, Guo Moruo, Zhang Shizhao, Cheng Qian, He Xiangning, Fu Zuoyi, Zhang Zhizhong, Shao Lizi, Cai Tingkai, Li Zongren, Sha Qianli, Zhang Naiqi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-30.china-leadership-5
        when: Aug. 30
        date: '1966-08-30'
        thread: china-leadership
        c: 'Zhou Enlai meets the delegates of the two factions at the Academy of Sciences. He asks whether Hua Luogeng''s house was searched and whether he was struggled or beaten: searching a professors house is not good. Disorder is not feared, but disorder must make sense and follow policy. As to Zhang Jingfu''s statement: he may declare his stand first; do not press so hard; there must be facts and reasoning in debate, no labelling; the Academy''s people to keep a scientific attitude.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52–53 (Aug. 30, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Hua Luogeng, Zhang Jingfu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-31.china-leadership-3
        when: Aug. 31
        date: '1966-08-31'
        thread: china-leadership
        c: 'Zhou Enlai reviews the draft Center and State Council notice on specific problems in the Cultural Revolution, written by Tao Zhu''s staff on his instruction: key and secret organs and units, from the armed forces and public security to Xinhua, the radio, archives, airfields, ports and banks, to be firmly protected. He adds the *Renmin ribao*, *Jiefangjun bao* and *Hongqi* and sends it to Mao, Lin Biao and others; Jiang Qing proposes the Standing Committee discuss it.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 31, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Mao Zedong, Lin Biao, Jiang Qing.'
        tags: [name:zhou-enlai, name:tao-zhu, name:mao-zedong, name:lin-biao, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-01.china-leadership-4
        when: Sept. 1
        date: '1966-09-01'
        thread: china-leadership
        c: 'Mao on the draft notice on specific problems in the Cultural Revolution: "This paper is not to be issued."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 31, 1966). Made public: 2020. See [[cal.1966-08-31.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-08-31.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 31, 1966; Zhou with Mao and Lin Biao at the second reception of out-of-town teachers, students and Red Guards; Lin''s speech; Zhou: learn from the PLA, serve the people, keep the three main rules and eight points, argument, not force)'
  - add:
      entry:
        id: cal.1966-08.china-leadership-2
        when: Aug., late
        date: 1966-08
        thread: china-leadership
        c: 'Zhou Enlai repeatedly dissuades Red Guards of the Tibet Nationalities Institute, the Central Nationalities Institute and others from struggling the Panchen Lama: minority leaders such as Ulanhu and the Panchen are to be protected.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 1966). Made public: 2020. Names: Zhou Enlai, Ulanhu, Panchen Lama.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1966-08-21
  - add:
      entry:
        id: cal.1966-08.china-leadership-3
        when: Aug., late
        date: 1966-08
        thread: china-leadership
        c: 'Zhou Enlai, learning that some Red Guards seized the Panchen Lama at his residence and held him at the Central Nationalities Institute, has the Peking garrison send men to stop it: no insulting struggle. He tells Xu Bing and Liu Shuzhou that the masses struggle is to be back to back, Party members to keep their posts, and to protect the Panchen even if they are themselves struggled. Xu, Liu, Zhou''s liaison man and garrison officers go to the Institute and move the Panchen to safety.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53–54 (Aug. 1966, "八月下旬"). Made public: 2020. Names: Zhou Enlai, Panchen Lama, Xu Bing, Liu Shuzhou.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1966-08-21
  - add:
      entry:
        id: cal.1966-08.china-leadership-4
        when: Aug., late
        date: 1966-08
        thread: china-leadership
        c: 'Zhou Enlai, learning that Red Guards are attacking Hangzhou''s Lingyin Temple, a national key cultural relic, has his secretary telephone the Zhejiang committee: protect it, and the committee to do its work. He later wires it to close the temple for the time.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 54 (Aug., end 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1966-08-21
  - add:
      entry:
        id: cal.1966-08.china-leadership-5
        when: Aug., late
        date: 1966-08
        thread: china-leadership
        c: 'Zhou Enlai tells the head of the Party''s United Front Work Department, as many democrats, non-Party patriots and business leaders are attacked and the policy undermined: the Department is not to waver on the policy nor let go; the work must go on.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 54 (Aug., end 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1966-08-21
  - add:
      entry:
        id: cal.1966-09-01.china-leadership-6
        when: Sept. 1
        date: '1966-09-01'
        thread: china-leadership
        c: 'Zhou Enlai tells Hospital 301 to be ready to receive Zhang Zhizhong, Zhang Shizhao, Cheng Qian, Fu Zuoyi, Cai Tingkai, Li Zongren and Shao Lizi: old and ill, the government is to protect them.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52 (Aug. 30, 1966; "九月一日"). Made public: 2020. See [[cal.1966-08-30.china-leadership]]. Names: Zhou Enlai, Zhang Zhizhong, Zhang Shizhao, Cheng Qian, Fu Zuoyi, Cai Tingkai, Li Zongren, Shao Lizi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-01.china-leadership-7
        when: Sept. 1
        date: '1966-09-01'
        thread: china-leadership
        c: 'Zhou Enlai at the symposium of Red Guard delegates of the capital''s colleges and middle schools. Organize first, then unite, with a general meeting, a delegates'' congress and a leading body. Do not disturb production or work units; factories and power stations cannot stop. Do not overthrow ordinary bourgeois persons or raid houses. Respect Soong Ching Ling: wall posters at her house are improper.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 54–55 (Sept. 1, 1966). Made public: 2020. Names: Zhou Enlai, Soong Ching Ling.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09.china-leadership
        when: Sept., early
        date: 1966-09
        thread: china-leadership
        c: 'Zhou Enlai, on Li Fuchun''s proposal and Mao''s approval, has Yu Qiuli and Gu Mu moved to the State Council to help run the economy: "help me hold the economic line; if the base stays in order the situation holds; if it falls into chaos it cannot be mended; production must not stop." As the Red Guard exchange of experience begins, to ease the railways he has Gu Mu and Yu Qiuli draw up a detailed rail transport plan, freight needed for production first, then passenger plans with a margin for student travel.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 55 (Sept., early 1966). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Mao Zedong, Yu Qiuli, Gu Mu.'
        tags: [name:zhou-enlai, name:li-fuchun, name:mao-zedong, polity:prc, vis:only:prc]
        at: before 1966-09-01
  - add:
      entry:
        id: cal.1966-09-12.china-leadership
        when: Sept. 12
        date: '1966-09-12'
        thread: china-leadership
        c: Zhou Enlai tells Gu Mu to collect the figures on rail freight.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 55 (Sept., early 1966; the 12th). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09.china-leadership-2
        when: Sept., late
        date: 1966-09
        thread: china-leadership
        c: Zhou Enlai tells Gu Mu to draft a notice against any casual interference with rail and shipping order.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 55 (Sept., early 1966; "月底"). Made public: 2020. Names: Zhou Enlai, Gu Mu. Check: the day; the chronology says months end.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1966-09-21
  - add:
      entry:
        id: cal.1966-09-02.china-leadership-2
        when: Sept. 2
        date: '1966-09-02'
        thread: china-leadership
        c: Zhou Enlai drafts "Several Points on the Red Guards" (unfinished), ten demands. The Red Guards to learn from the PLA, with organization and discipline; to master policy; the united front still right; democrats with legal standing and scientists who have contributed to be protected; argument, not force; searches settled with the Peking committee, the garrison and public security; linking up not to hinder head and key organs, transport, foreign relations, production or research.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 55–56 (Sept. 2, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-03.china-leadership-2
        when: Sept. 3
        date: '1966-09-03'
        thread: china-leadership
        c: Zhou Enlai makes the last revisions to the Points on the Red Guards at dawn and has his secretary call Tao Zhu, Kang Sheng, Li Fuchun, Xie Fuzhi, Chen Yi, Yang Chengwu, Wu De, Jiang Qing, Wang Renzhong, Zhang Chunqiao, Liu Zhijian, Yao Wenyuan, Wang Li, Guan Feng and Qi Benyu to discuss them in the morning. Tao Zhu, Chen Yi and others approve; Kang Sheng and others are against. The Points are not issued.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 56 (Sept. 3, 1966). Made public: 2020. See [[cal.1966-09-02.china-leadership-2]]. Names: Zhou Enlai, Tao Zhu, Kang Sheng, Li Fuchun, Xie Fuzhi, Chen Yi, Yang Chengwu, Wu De, Jiang Qing, Wang Renzhong, Zhang Chunqiao, Liu Zhijian, Yao Wenyuan, Wang Li, Guan Feng, Qi Benyu.'
        tags: [name:zhou-enlai, name:tao-zhu, name:kang-sheng, name:li-fuchun, name:xie-fuzhi, name:chen-yi, name:jiang-qing, name:zhang-chunqiao, name:yao-wenyuan, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-09-02.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 56 (Sept. 2, 1966; on the Second Ministry''s report that Red Guards at Lanzhou, Xining and elsewhere seek to enter its secret plants, Zhou telephones the Qinghai leaders to persuade the Red Guards courteously, and signs the Center''s and Military Commission''s urgent telegram to the committees and military regions of Qinghai, Gansu, Hunan, Sichuan and Inner Mongolia)'
  - add:
      entry:
        id: cal.1966-09-02.china-leadership-3
        when: Sept. 2
        date: '1966-09-02'
        thread: china-leadership
        also: [china]
        c: 'The Center forwards the Ministry of Public Security Party groups "Four Questions on the Relations between Public Security Organs and the Masses in the Cultural Revolution", drawn up on Zhou Enlai''s view: students and masses not to enter public security offices to seize the "black gang" nor storm police stations; the organs secrets not to be given to the masses; the masses not to punish prisoners in prisons and detention houses; unreasonable rules of the organs to be reformed, those of national range after general study.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 56–57 (Sept. 2, 1966, the item after). Made public: 2020. To check: the document as the Center forwarded it. Names: Zhou Enlai. Check: the day; the chronology gives it after the entries of Sept. 2–3.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-04.china-leadership
        when: Sept. 4
        date: '1966-09-04'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai chairs the Center''s liaison meeting, which drafts two urgent telegrams to the Xinjiang committee and the Northwest Bureau: in Yili, Tacheng, Altay and the other border areas the "four bigs" may expose problems, but leaders are adjusted from above, not dismissed by the masses; out-of-town students to keep out; the Center protects Saifudin; Wang Enmao acted rightly. Sent to Mao, who writes "issue".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 57 (Sept. 4, 1966). Made public: 2020. See [[cal.1966-09-01.china-leadership-2]]. Names: Zhou Enlai, Saifudin, Wang Enmao, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-05.china-leadership-5
        when: Sept. 5
        date: '1966-09-05'
        thread: china-leadership
        c: 'Zhou Enlai revises the "Provisional Rules on the Procedure for Appointing and Removing Party and Government Cadres", discussed at the Center''s liaison meeting, and sends them to Mao. Bureau secretaries, the provinces'' first and second secretaries, governors and ministers: fixed by the Standing Committee or proposed by its liaison meeting to Mao and Lin Biao; department and bureau heads: approved by Tao Zhu; the military regions'' leaders: reported to Mao.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 57 (Sept. 5, 1966). Made public: 2020. Reply: [[cal.1966-09-08.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Lin Biao, Tao Zhu.'
        tags: [name:zhou-enlai, name:mao-zedong, name:lin-biao, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-06.china-leadership
        when: Sept. 6
        date: '1966-09-06'
        thread: china-leadership
        c: 'Zhou Enlai chairs the Center''s liaison meeting: Tao Zhu, Kang Sheng, Li Fuchun, Xie Fuzhi, Ye Jianying, Chen Yi, Wang Dongxing, Zhou Rongxin and others.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 57 (Sept. 6, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Kang Sheng, Li Fuchun, Xie Fuzhi, Ye Jianying, Chen Yi, Wang Dongxing, Zhou Rongxin.'
        tags: [name:zhou-enlai, name:tao-zhu, name:kang-sheng, name:li-fuchun, name:xie-fuzhi, name:ye-jianying, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-07.china-leadership-2
        when: Sept. 7
        date: '1966-09-07'
        thread: china-leadership
        also: [china]
        c: 'The *Renmin ribao* prints the editorial "Grasp Revolution, Promote Production", drafted by Tao Zhu on Zhou Enlai''s instruction: revolution and production both; production units and offices to strengthen leadership; workers, commune members, technicians and others to hold their posts; students not to go to the villages and factories to interfere.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 57–58 (Sept. 7, 1966). Names: Zhou Enlai, Tao Zhu.'
        tags: [name:zhou-enlai, name:tao-zhu, polity:prc]
  - add:
      entry:
        id: cal.1966-09-07.china-leadership-3
        when: Sept. 7
        date: '1966-09-07'
        thread: china-leadership
        c: 'Zhou Enlai, at the meeting of out-of-town students in Peking and at the debate meeting of the Academy of Sciences, refers to the editorial and asks that it be studied. At the Academy: besides the Cultural Revolution, the production struggle and scientific experiment go on; the Academy''s advanced research and many key experiments cannot be left aside as now; as for his own responsibility, he cannot watch it continue; the most urgent and needed work must not suffer in the Cultural Revolution.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 58 (Sept. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-07.china-leadership-4
        when: Sept. 7
        date: '1966-09-07'
        thread: china-leadership
        c: 'Zhou Enlai, told that 340,000 out-of-town students are in Peking and still rising, beyond the reception offices strength, writes Jiang Qing and the Cultural Revolution Group, copy to Mao, Lin Biao, the Standing Committee and Secretariat: the Center should notify the provinces of the rise and its practical difficulties, and a central leader should urge the students in Peking to go home early.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 58 (Sept. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Mao Zedong, Lin Biao.'
        tags: [name:zhou-enlai, name:jiang-qing, name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-08.china-leadership-2
        when: Sept. 8
        date: '1966-09-08'
        thread: china-leadership
        c: 'Zhou Enlai convenes the Center''s liaison meeting, which adopts the Center''s Provisions on the Cultural Revolution in the Villages below the County: it goes with the Four Cleanups; no linking up by students and Red Guards below the county; the autumn harvest first; cadres removed only by the higher committee, not by the masses. It also discusses Mao''s instruction of Sept. 7 on Qingdao.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 58–59 (Sept. 8, 1966). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-08.china-leadership-3
        when: Sept. 8
        date: '1966-09-08'
        thread: china-leadership
        c: 'Zhou Enlai reviews the Center''s Notice on Grasping Revolution and Promoting Production: industry, farming, transport and commerce to form command organs; production and research staff to keep their posts; students and Red Guards not to enter factories; no dismissal of leaders by the masses. He sends it and the rural provisions to Mao: after the Jiangsu and Shangrao telegrams, both need a Politburo discussion before they go out.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 59–60 (Sept. 8, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-08.china-leadership-4
        when: Sept. 8
        date: '1966-09-08'
        thread: china-leadership
        c: 'Zhou Enlai telephones Liu Lantao and the student delegates fasting before the gate of the Shaanxi Party committee: stop fasting, eat and get treatment; they may make demands, but not require Liu alone to answer; he himself cannot answer at once, knowing nothing of the facts; "you cannot stop eating because some have not been struck down and your demands are unanswered."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60 (Sept. 8, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Lantao. Check: the day; the chronology gives it under Sept. 8 with no day of its own.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-08.china-leadership-5
        when: Sept. 8
        date: '1966-09-08'
        thread: china-leadership
        c: Zhou Enlai goes to Mao's for a meeting, and talks in turn with Deng Xiaoping and Tao Zhu.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60 (Sept. 8, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Deng Xiaoping, Tao Zhu. Check: the day.'
        tags: [name:zhou-enlai, name:mao-zedong, name:deng-xiaoping, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-10.china-leadership-2
        when: Sept. 10
        date: '1966-09-10'
        thread: china-leadership
        c: 'Zhou Enlai speaks at the meeting of all the "expeditionary fighters" of the Capital Colleges Red Guard Headquarters, giving those about to link up elsewhere three tasks: fighting teams, study teams, propaganda teams. In factories and villages do not hamper production in the autumn season. Shanghai''s output bears on the whole country: force nothing on it. A proletarian dictatorship needs order in revolution and construction.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60 (Sept. 10, 1966). To check: the speech as printed or circulated. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-09-10.china-leadership-3
        when: Sept. 10
        date: '1966-09-10'
        thread: china-leadership
        c: Zhou Enlai, at the second symposium of Red Guard delegates of the capital's colleges and middle schools, answers their questions. Break the four olds and oppose the bourgeois power-holders, but not every leader takes the capitalist road; do not call every leader "black gang", a term the Center has dropped. Stopping trains at will is anarchism; it upsets transport, and Peking's grain comes from outside.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60–61 (Sept. 10, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-11.china-leadership-2
        when: Sept. 11
        date: '1966-09-11'
        thread: china-leadership
        c: Zhou Enlai calls Zhao Erlu and Liu Jie on the problem of Plant 221.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 61 (Sept. 11, 1966). Made public: 2020. Names: Zhou Enlai, Zhao Erlu, Liu Jie.'
        tags: [name:zhou-enlai, name:zhao-erlu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-12.china-leadership-2
        when: Sept. 12
        date: '1966-09-12'
        thread: china-leadership
        c: 'Zhou Enlai chairs the Center''s liaison meeting: Tao Zhu, Kang Sheng, Li Fuchun, Ye Jianying, Xie Fuzhi, Gu Mu, Yu Qiuli, Zhao Erlu, Li Xiannian, Tan Zhenlin, Wang Dongxing, Zhou Rongxin, Zhang Chunqiao and Tong Xiaopeng attend.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 61 (Sept. 12, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Kang Sheng, Li Fuchun, Ye Jianying, Xie Fuzhi, Gu Mu, Yu Qiuli, Zhao Erlu, Li Xiannian, Tan Zhenlin, Wang Dongxing, Zhou Rongxin, Zhang Chunqiao, Tong Xiaopeng.'
        tags: [name:zhou-enlai, name:tao-zhu, name:kang-sheng, name:li-fuchun, name:ye-jianying, name:xie-fuzhi, name:zhao-erlu, name:li-xiannian, name:tan-zhenlin, name:zhang-chunqiao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-12.china-leadership-3
        when: Sept. 12
        date: '1966-09-12'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, on seeing a leaflet of the "Eliminate Islam Revolutionary Combat Team" (a body drawn from part of the Chinese Islamic Association), "Rise Up and Fight to Eliminate Islam to the End", that night has Xiao Xianfa, head of the State Council's Religious Affairs Bureau, find out the facts. He tells Zhang Jingwu by telephone that the leaflet is seriously wrong and he is to settle it on the 13th.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 61 (Sept. 12, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Xiao Xianfa, Zhang Jingwu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-13.china-leadership-2
        when: Sept. 13
        date: '1966-09-13'
        thread: china-leadership
        also: [china]
        c: 'Zhang Jingwu convenes the State Council''s Religious Affairs Bureau and the Islamic Association, conveys Zhou Enlai''s instruction, and notifies the religious and nationalities offices and schools of 27 provinces, municipalities and regions: the leaflet is seriously wrong and void; each place to control and recall it.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 61–62 (Sept. 12, 1966, the item after). Made public: 2020. See [[cal.1966-09-12.china-leadership-3]]. Names: Zhou Enlai, Zhang Jingwu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-13.china-leadership-3
        when: Sept. 13
        date: '1966-09-13'
        thread: china-leadership
        c: Zhou Enlai speaks to over 12,000 of the Second Headquarters of the capital's college Red Guards about to leave for Guangxi, Changsha, Chengdu and Canton. Tell argument from force and the two kinds of contradiction. Not all power-holders take the capitalist road; a leader who erred in line is not "black gang". He did say the Shanghai committee was revolutionary. The Cultural Revolution is China's own affair; abroad, propaganda only.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 62 (Sept. 13, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-09-14.china-leadership-4
        when: Sept. 14
        date: '1966-09-14'
        thread: china-leadership
        c: 'Zhou Enlai chairs the Center''s liaison meeting, which agrees to study at once the economic and social policies of the Cultural Revolution: groups under each branch''s heads to gather material and make first proposals for the liaison meeting, then Mao''s approval or the Politburo.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 62 (Sept. 14, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-14.china-leadership-5
        when: Sept. 14
        date: '1966-09-14'
        thread: china-leadership
        c: 'Zhou Enlai reviews Tao Zhu''s draft Notice on Pressing the Study of Social Policy Questions in the Cultural Revolution, which lists eight areas needing policy: the reform of landlords, rich peasants, counter-revolutionaries, bad elements and rightists; democratic parties, the national bourgeoisie, the federation of industry and commerce and their figures; natural scientists and other senior intellectuals; overseas Chinese, religion, foreign affairs, nationalities. He revises it many times.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 62–63 (Sept. 14, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu.'
        tags: [name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-23.china-leadership
        when: Sept. 23
        date: '1966-09-23'
        thread: china-leadership
        c: Zhou Enlai, revising the Notice on social policy questions, adds that the Cultural Revolution Group should first send reporters of the newspapers and other staff to the places concerned and to important cities to inquire and collect material; and that after National Day the liaison meetings sessions on principle will take the questions one by one, by urgency and readiness.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63 (Sept. 14, 1966; "九月二十三日"). Made public: 2020. See [[cal.1966-09-14.china-leadership-5]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-09-15.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63 (Sept. 15, 1966; Zhou''s speech: farm and industrial output; workers, commune members, technicians and cadres to keep their posts; Red Guards not to link up in factories and below the county)'
  - add:
      entry:
        id: cal.1966-09-15.china-leadership-3
        when: Sept. 15
        date: '1966-09-15'
        thread: china-leadership
        c: Zhou Enlai, learning late at night that two organizations at the Peking No. 1 Cotton Mill are in fierce dispute and may come to blows, telephones Gu Mu to settle it, and Qian Zhiguang to have Jiao Shanmin find and settle it that night.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63 (Sept. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu, Qian Zhiguang, Jiao Shanmin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-15.china-leadership-4
        when: Sept. 15
        date: '1966-09-15'
        thread: china-leadership
        c: Zhou Enlai calls Nie Rongzhen on problems of the Seventh Ministry of Machine Building.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63 (Sept. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen.'
        tags: [name:zhou-enlai, name:nie-rongzhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-16.china-leadership-2
        when: Sept. 16
        date: '1966-09-16'
        thread: china-leadership
        c: 'Zhou Enlai chairs the Center''s liaison meeting, which discusses, among other matters, Li Xiannian''s draft report on policy questions in finance, trade and handicrafts: joint state-private firms to become state ones and the capitalists'' fixed interest to end; large cooperative shops step by step to state shops; small traders and peddlers to remain; the non-farm grain ration not to be raised for now.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63–64 (Sept. 16, 1966). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-23.china-leadership-4
        when: Sept. 23
        date: '1966-09-23'
        thread: china-leadership
        c: The Center sends out Li Xiannian's report on policy questions in finance, trade and handicrafts, as Zhou Enlai's liaison meeting discussed it on Sept. 16.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63–64 (under Sept. 16, 1966). Made public: 2020. See [[cal.1966-09-16.china-leadership-2]]. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-16.china-leadership-3
        when: Sept. 16
        date: '1966-09-16'
        thread: china-leadership
        c: 'Zhou Enlai receives E. F. Hill, chairman of the Communist Party of Australia (Marxist-Leninist). On the Cultural Revolution: the views in the wall posters are not wholly ours; many are those of one school, one Red Guard squad or one group.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 16, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Hill.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+australia]
  - add:
      entry:
        id: cal.1966-09-16.china-leadership-4
        when: Sept. 16
        date: '1966-09-16'
        thread: china-leadership
        c: 'Zhou Enlai reviews Gu Mu''s report on settling the struggle of the two organizations at the State Economic Commission, agrees that students may not link up in factories and still less move into the ministries and commissions and disturb the state organs, and writes: hold to keeping revolutionary teachers and students out of liaison stations in the ministries and commissions, though liaison men may visit them regularly.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 16, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-17.china-leadership-2
        when: Sept. 17
        date: '1966-09-17'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai revises and issues the Center''s and State Council''s telegram to the bureaus and the provincial, municipal and regional committees on securing rail transport: rail transport is under great strain, and so as not to hurt farm and industrial output the revolutionary teachers and students of each place are for now not to go to other provinces and cities to link up.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 17, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-17.china-leadership-3
        when: Sept. 17
        date: '1966-09-17'
        thread: china-leadership
        c: Zhou Enlai telephones Deng Xiaoping.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 17, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-18.china-leadership
        when: Sept. 18
        date: '1966-09-18'
        thread: china-leadership
        c: 'Zhou Enlai drafts the Center''s reply to the Jilin committee, copy to the bureaus, on the pay of those criticized and struggled against: even those whose case is decided, no change for now; if a man draws less pay, or gives part of it as Party dues, that is his own wish, not to be forced, and he is not to be made ill by spending less; those not yet decided keep their pay.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 18, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-18.china-leadership-2
        when: Sept. 18
        date: '1966-09-18'
        thread: china-leadership
        c: Zhou Enlai calls Song Renqiong, Li Fuchun, Tao Zhu, Kang Sheng and Cultural Revolution Group staff to discuss the Cultural Revolution in the three Northeast provinces.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 18, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Song Renqiong, Li Fuchun, Tao Zhu, Kang Sheng.'
        tags: [name:zhou-enlai, name:li-fuchun, name:tao-zhu, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-21.china-leadership
        when: Sept. 21
        date: '1966-09-21'
        thread: china-leadership
        c: Zhou Enlai calls Song Renqiong, Gu Zhuoxin, Ma Mingfang and Pan Fusheng on Heilongjiang.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64–65 (Sept. 18, 1966, the item after; "二十一日"). Made public: 2020. Names: Zhou Enlai, Song Renqiong, Gu Zhuoxin, Ma Mingfang, Pan Fusheng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-20.china-leadership
        when: Sept. 20
        date: '1966-09-20'
        thread: china-leadership
        c: 'Zhou Enlai writes Jiang Qing: the two notices on economic policy in the Cultural Revolution, on farming and industry and on research, have helped production; the revised draft on finance, trade and handicrafts has been with the Cultural Revolution Group some days, and Chen Boda is asked to attend to it, so that it may be discussed and put to the Politburo.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 65 (Sept. 20, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Chen Boda.'
        tags: [name:zhou-enlai, name:jiang-qing, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-21.china-leadership-2
        when: Sept. 21
        date: '1966-09-21'
        thread: china-leadership
        c: Zhou Enlai talks with representatives of three Red Guard groups of the Harbin Engineering Institute. Industry hit means less output, and the advanced projects have lost a month. Support the Heilongjiang committee's leadership and see two sides in each cadre; the Center no longer uses "black gang". A leaflet to overthrow Islam would split the nationalities. Papers, Xinhua and radio are tools of dictatorship; no group may occupy them.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 65 (Sept. 21, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-22.china-leadership
        when: Sept. 22
        date: '1966-09-22'
        thread: china-leadership
        c: 'Zhou Enlai convenes the Party-group members of the State Council''s branches and ministries: cadres must stand the test and not fear "shelling"; support the Red Guards and explain policy to them; drop "black gang" and "five black categories". Policy on democratic parties, religion, nationalities, intellectuals, overseas Chinese and foreign affairs to be taken up after National Day. Ulanhu, Saifudin and Ngapo to be protected.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 65–66 (Sept. 22, 1966). Made public: 2020. Names: Zhou Enlai, Ulanhu, Saifudin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-22.china-leadership-2
        when: Sept. 22
        date: '1966-09-22'
        thread: china-leadership
        c: Zhou Enlai views the film of the nuclear test.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (Sept. 22, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-23.china-leadership-2
        when: Sept. 23
        date: '1966-09-23'
        thread: china-leadership
        c: 'Zhou Enlai, on the appeal from the Haocun agricultural middle school, Jiaohe County, Hebei, to the farmers of the country to hand all private plots, gardens and trees to the commune, notes: he has asked the farm office to send cadres to Haocun and to Peking''s outer counties to find in what circumstances and by whom the appeal was made, since it has good and bad sides; if agricultural middle schools below the county spring up everywhere at once, farming suffers.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (Sept. 23, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-23.china-leadership-3
        when: Sept. 23
        date: '1966-09-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai tells Red Guards about to go to eastern Inner Mongolia to investigate that they may not go to the areas near the border: that breaks the rule.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (Sept. 23, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-24.china-leadership-2
        when: Sept. 24
        date: '1966-09-24'
        thread: china-leadership
        c: 'Zhou Enlai reviews the General Political Department''s and General Staff''s report proposing that villages, mines, enterprises, institutions, offices and mass bodies form no Red Guards, and the Center''s note forwarding it: Red Guards are spreading to villages and enterprises, some in the militia carry arms and have used force; on Xu Xiangqian''s proposal none in villages and enterprises, and the militia to hold its posts and bring in the harvest.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (Sept. 24, 1966). Made public: 2020. See [[cal.1966-09-17.china-leadership]]. Names: Zhou Enlai, Xu Xiangqian.'
        tags: [name:zhou-enlai, name:xu-xiangqian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-25.china-leadership-3
        when: Sept. 25
        date: '1966-09-25'
        thread: china-leadership
        c: The Center forwards to the country the General Political Department's and General Staff's report against forming Red Guards in villages, mines, enterprises and offices.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (under Sept. 24, 1966). Made public: 2020. See [[cal.1966-09-24.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-09-24.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 67 (Sept. 24, 1966; Zhou chairs the Center''s liaison meeting, which settles the telegram on the Peking Red Guards plan to parade a hundred or two hundred capitalists in Shanghai; sent that night with Mao''s consent)'
  - add:
      entry:
        id: cal.1966-09-25.china-leadership
        when: Sept. 25
        date: '1966-09-25'
        thread: china-leadership
        also: [testing]
        c: Zhou Enlai chairs the 16th meeting of the Central Special Commission. Factories, research bodies and offices form no Red Guards, those formed to dissolve; put the energy into research and production. The atomic bomb owes much to the experts, who are not capitalists or rightists; unite with them. To give the organs of dictatorship to the masses is a Right deviation in "Left" form. Restore the rules wrongly smashed.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 67 (Sept. 25, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-25.china-leadership-2
        when: Sept. 25
        date: '1966-09-25'
        thread: china-leadership
        c: 'Zhou Enlai receives the leaders of the Capital Colleges Red Guard Revolutionary Rebel Headquarters. His Sept. 15 speech is no poisonous weed: the Center studied it and Mao read it. Linking up elsewhere is to stop; capitalists are not to be paraded nor their homes searched. One who erred in line is not counter-revolutionary: he too once erred in line. The Party''s history should be told the young entire, errors with successes.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 67–68 (Sept. 25, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-26.china-leadership
        when: Sept. 26
        date: '1966-09-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai chairs the Center''s liaison meeting on the East China Bureau''s request for a way to settle students and Red Guards linking up in hospitals and the disorder there. Decided: wire the bureau, all bureaus, the provincial committees and the Health Ministry that the Center agrees Red Guards are not to link up at hospitals, and the hospitals are to follow the Center''s forwarding on Sept. 25 of the General Staff and General Political Department report; those already formed are to dissolve of themselves.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 68 (Sept. 26, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-26.china-leadership-2
        when: Sept. 26
        date: '1966-09-26'
        thread: china-leadership
        c: 'Zhou Enlai receives all the people of the Red Guards'' Third Headquarters: what they think correct and true they may hold for a time.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 68 (Sept. 26, 1966, the item after; "次日"). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-27.china-leadership-4
        when: Sept. 27
        date: '1966-09-27'
        thread: china-leadership
        c: 'Zhou Enlai has his secretary write the Red Guards'' Third Headquarters: his remark of the day before, that what they think true they may hold for a time, was incomplete; what debate and practice show wrong is to be admitted and corrected, what right held to.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 68 (under Sept. 26, 1966). Made public: 2020. See [[cal.1966-09-26.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-26.china-leadership-3
        when: Sept. 26
        date: '1966-09-26'
        thread: china-leadership
        c: 'Zhou Enlai, on a report from the Peking committees general office that 34 Peking middle schools and out-of-town students have formed an "East Is Red Preparatory Committee" which would rename Peking "East Is Red City" and remove the Tiananmen ornamental columns and the two stone lions to set up bronze statues of Mao and heroes, writes to the committee and to Zhou Rongxin: tell them through the liaison station that this is a state matter, of concern abroad; they may care and propose, but not decide or name; a naming without force costs credit.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 68 (Sept. 26, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-27.china-leadership
        when: Sept. 27
        date: '1966-09-27'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, told that Red Guards of the Hejiang labor-reform sub-bureau in Heilongjiang are linking with other units to hold a "bombard the headquarters" meeting at the labor farms, wires Xie Fuzhi: tell the provincial public security office that no great linking up and no such meeting.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 68–69 (Sept. 27, 1966). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi.'
        tags: [name:zhou-enlai, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-27.china-leadership-2
        when: Sept. 27
        date: '1966-09-27'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, to protect Ngapo Ngawang Jigme, wires the responsible Tibetan officials: the Center sends a special plane to Lhasa tomorrow to bring Ngapo and his wife to Peking. On their arrival Zhou himself arranges their quarters and guard.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 69 (Sept. 27, 1966). Made public: 2020. Names: Zhou Enlai, Ngapo Ngawang Jigme.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-28.china-leadership
        when: Sept. 28
        date: '1966-09-28'
        thread: china-leadership
        c: Zhou Enlai chairs the Center's liaison meeting, hearing Yu Qiuli and Gu Mu on industrial output and capital construction.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 69 (Sept. 28, 1966). Made public: 2020. Names: Zhou Enlai, Yu Qiuli, Gu Mu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-28.china-leadership-2
        when: Sept. 28
        date: '1966-09-28'
        thread: china-leadership
        c: 'Zhou Enlai revises Yu Qiuli''s draft, written on his instruction, of the points for oral explanation to foreign guests at National Day: the great achievements; self-reliance and reliance on the people, with cooperation between friendly states and learning from others'' good experience, the base self-reliance; and, added by Zhou, the need for exchange of goods in international trade.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 69 (Sept. 28, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-29.china-leadership
        when: Sept. 29
        date: '1966-09-29'
        thread: china-leadership
        c: Zhou Enlai attends the founding meeting of the Capital Red Guard United Committee and speaks on National Day cultural matters.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 69 (Sept. 29, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-09-29.china-leadership-2
        when: Sept. 29
        date: '1966-09-29'
        thread: china-leadership
        c: Zhou Enlai talks with E. F. Hill, chairman of the Communist Party of Australia (Marxist-Leninist). The Cultural Revolution is without precedent and no one has experience; policies will be completed and filled in during the struggle, and the Center has made decisions to supplement the Sixteen Points.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 69 (Sept. 29, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Hill.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+australia]
  - add:
      entry:
        id: cal.1966-09-29.china-leadership-3
        when: Sept. 29
        date: '1966-09-29'
        thread: china-leadership
        c: Zhou Enlai calls on Soong Ching Ling.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 69 (Sept. 29, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Soong Ching Ling.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09-30.china-leadership-2
        when: Sept. 30
        date: '1966-09-30'
        thread: china-leadership
        c: Zhou Enlai tells Jin Cheng of the United Front Work Department to sort the non-Party guests who will be on Tiananmen at tomorrow's National Day into three classes (government ministers, heads of democratic parties, others), so that he may talk with them in groups during the pause in the ceremony. (Because of other business the talks did not take place.)
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 69 (Sept. 30, 1966). Made public: 2020. Names: Zhou Enlai, Jin Cheng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09.china-leadership-3
        when: Sept.
        date: 1966-09
        thread: china-leadership
        c: 'Zhou Enlai approves the list of scientists and technicians for the Tiananmen stand at National Day: agreed, the principle has Mao''s approval.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70 (Sept. 1966). Made public: 2020. Names: Zhou Enlai. Check: the day; the chronology says "this month", after its Sept. 30 item.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09.china-leadership-4
        when: Sept.
        date: 1966-09
        thread: china-leadership
        c: 'Xinhua asks Tao Zhu whether the names of the heads of the big cities are to go out in the National Day reports from the provinces; Tao: issue, and ask the Premier; Zhou: as Tao Zhu says.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70 (Sept. 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu.'
        tags: [name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09.china-leadership-5
        when: Sept.
        date: 1966-09
        thread: china-leadership
        c: 'Zhou Enlai, on a hospital crowd''s wish to struggle against Hu Yousong, Li Zongren''s wife: she has faults and may be criticized, but not at Li''s home; no struggle there.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70 (Sept. 1966, the item after). Made public: 2020. Names: Zhou Enlai, Hu Yousong, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-01.china-leadership-6
        when: Oct. 1
        date: '1966-10-01'
        thread: china-leadership
        c: 'Zhou Enlai, on the Tiananmen stand, tells Li Zongren to spend a few days in Hospital 301: the Red Guards are young and warm but know little of Party policy and may disturb him.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70 (under Sept. 1966). Made public: 2020. See [[cal.1966-09.china-leadership-5]]. Names: Zhou Enlai, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-09.china-leadership-6
        when: Sept., late
        date: 1966-09
        thread: china-leadership
        c: At several days of reports to Zhang Chunqiao (Wang Li, Guan Feng, Qi Benyu and Yao Wenyuan present) from Tsinghua, Peking Normal, Peking Forestry and other colleges mass organizations, some people attack Zhou Enlai as "mixing in mud". Zhang has the record printed and sent to Jiang Qing, Chen Boda and others; Jiang has Chen send one to Zhou.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70 (Sept., end 1966). Made public: 2020. Names: Zhou Enlai, Zhang Chunqiao, Wang Li, Guan Feng, Qi Benyu, Yao Wenyuan, Jiang Qing, Chen Boda.'
        tags: [name:zhou-enlai, name:zhang-chunqiao, name:yao-wenyuan, name:jiang-qing, name:chen-boda, polity:prc, vis:only:prc]
        at: before 1966-09-21
  - add:
      entry:
        id: cal.1966-10-01.china-leadership-3
        when: Oct. 1
        date: '1966-10-01'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai revises the *Renmin ribao* editorial for the 17th anniversary, "Arm Seven Hundred Million People with Mao Zedong Thought", as Chen Boda revised it: those who do not yet understand Mao''s line are no longer equated with deliberate opponents. To Mao he notes that two passages on p. 3 confuse the two kinds of contradiction; the wording he leaves to Tang Pingzhu. Mao circles it.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70–71 (Oct. 1, 1966). Names: Zhou Enlai, Chen Boda, Mao Zedong, Tang Pingzhu.'
        tags: [name:zhou-enlai, name:chen-boda, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1966-10-01.china-leadership-4
        when: Oct. 1
        date: '1966-10-01'
        thread: china-leadership
        also: [china]
        c: 'The *Hongqi*, issue 13, prints the editorial "Advance on the Broad Road of Mao Zedong Thought": a very few oppose the Sixteen Points and hold to the bourgeois reactionary line, which must be thoroughly criticized, with no eclecticism. Zhou Enlai tells his liaison man Liu Xiyao that Chen Boda published it without the Center''s discussion; no one was ready, and many leading cadres are now in difficulty.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 71 (Oct. 1, 1966). Names: Zhou Enlai, Chen Boda, Liu Xiyao, Mao Zedong.'
        tags: [name:zhou-enlai, name:chen-boda, name:mao-zedong, polity:prc]
  - cite:
      id: cal.1966-10-02.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 71 (Oct. 1, 1966; the *Hongqi* editorial, which the *Renmin ribao* reprints the next day; Zhou''s doubts and Mao''s reply on "reactionary line")'
  - add:
      entry:
        id: cal.1966-10-01.china-leadership-5
        when: Oct. 1
        date: '1966-10-01'
        thread: china-leadership
        c: Zhou Enlai talks with Chen Boda at midnight.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 71 (Oct. 1, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-02.china-leadership-2
        when: Oct. 2
        date: '1966-10-02'
        thread: china-leadership
        c: 'Zhou Enlai tells Wu Jingtian, vice-minister of railways, on arranging trains for out-of-town students going home: the Ministry is to take responsibility and organize it, and send the students home soon.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 71 (Oct. 2, 1966). Made public: 2020. Names: Zhou Enlai, Wu Jingtian.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-02.china-leadership-3
        when: Oct. 2
        date: '1966-10-02'
        thread: china-leadership
        c: Zhou Enlai talks in turn with student delegates and liaison men living in Zhongnanhai and with the worker and peasant delegates at the National Day ceremony.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 71 (Oct. 2, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-03.china-leadership
        when: Oct. 3
        date: '1966-10-03'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks with the Red Guard delegates in Peking for National Day: grasp revolution and promote production; linking up strains transport and grain. Errors of line by Party leaders are among the people; most leading organs are not a black gang. Cherish the minorities'' leaders; keep the Political Consultative Conference and the democratic parties. Arrest belongs to the courts, the press and radio to no Red Guard group.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 71–72 (Oct. 3, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - cite:
      id: cal.1966-10-04.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 72 (Oct. 4, 1966; Zhou, with Tao Zhu and military heads, reports on the Cultural Revolution to Mao at the enlarged Politburo meeting; Mao proposes a Central Work Conference of the local heads)'
  - add:
      entry:
        id: cal.1966-10-05.china-leadership-2
        when: Oct. 5
        date: '1966-10-05'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Zhou Enlai talks with Ion Gheorghe Maurer, chairman of Romania''s Council of Ministers, who reports his talks in Vietnam. Zhou: on Vietnam the Chinese and Soviet positions are wholly opposite, with no joint action; Vietnam will be talked of when the time comes, the issue is the conditions, the moment and who decides, and Vietnam decides; anyone mobilized by the Soviet Union and the U.S. to press Vietnam may cross China if Vietnam invites, with exceptions, such as U Thant, who would have to be considered; aid goods to Vietnam go through China under the agreements.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 72 (Oct. 5, 1966). Made public: 2020. Names: Zhou Enlai, Maurer, U Thant.'
        tags: [name:zhou-enlai, name:maurer-ion-gheorghe, name:u-thant, polity:prc, vis:only:prc+romania]
  - cite:
      id: cal.1966-10-05.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 72–73 (Oct. 5, 1966; the Center''s forwarding, with Mao''s approval, of the Military Commission''s and General Political Department''s Emergency Instruction on the Cultural Revolution in the army''s academies)'
  - add:
      entry:
        id: cal.1966-09-27.china-leadership-3
        when: Sept. 27
        date: '1966-09-27'
        thread: china-leadership
        also: [china]
        c: The East China Bureau wires that cadres and masses are agreed that Zhou Enlai's talk of Sept. 10 settled many questions of thought and policy, and proposes to put it in order for open publication or to issue it as a formal document to convey to the masses.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60–61 (Sept. 10, 1966; "二十七日"). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-06.china-leadership
        when: Oct. 6
        date: '1966-10-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai attends the Central Cultural Revolution Group's rally of revolutionary teachers and students from all over the country in Peking, "to open fire fiercely on the bourgeois reactionary line". Chen Boda and Jiang Qing speak; Zhang Chunqiao reads the Emergency Instruction on the Cultural Revolution in the army's academies.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 73 (Oct. 6, 1966). See [[cal.1966-10-05.china-leadership]]. Names: Zhou Enlai, Chen Boda, Jiang Qing, Zhang Chunqiao.'
        tags: [name:zhou-enlai, name:chen-boda, name:jiang-qing, name:zhang-chunqiao, polity:prc]
  - cite:
      id: cal.1966-10-07.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 73 (Oct. 7, 1966; Zhou''s letter to Mao on whether to hold the Central Work Conference now, and Mao''s reply: hold it as planned, but seven days, not three)'
  - add:
      entry:
        id: cal.1966-10-07.china-leadership-2
        when: Oct. 7
        date: '1966-10-07'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, on the Heilongjiang committees secrecy office reporting leaks of long-distance telephone calls and cipher telegrams to the Center, Red Guards and telephone operators tapping the committees and the public security offices calls to the Center, tells Xie Fuzhi to consult Pan Fusheng and tighten control of the secret lines.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 73 (Oct. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi, Pan Fusheng.'
        tags: [name:zhou-enlai, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-07.china-leadership-3
        when: Oct. 7
        date: '1966-10-07'
        thread: china-leadership
        c: Zhou Enlai chairs the Center's liaison meeting on preparations for the Central Work Conference.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 73 (Oct. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-07.china-leadership-4
        when: Oct. 7
        date: '1966-10-07'
        thread: china-leadership
        c: Zhou Enlai, on Tan Zhenlin's request for a way to deal with Xinjiang students who came to Peking and are making trouble at the Ministry of State Farms and Land Reclamation, tells Xiao Ke, Chen Manyuan and Jiang Qixian to stay calm and step forward when students come; if in error, admit it and promise to correct; if not, explain well and hurt no one. It is a test for the Ministry's Party committee.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 73 (Oct. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin, Xiao Ke, Chen Manyuan, Jiang Qixian.'
        tags: [name:zhou-enlai, name:tan-zhenlin, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-08.china-leadership
        when: Oct. 8
        date: '1966-10-08'
        thread: china-leadership
        c: Zhou Enlai proposes to Lin Biao, Tao Zhu, Chen Boda, Kang Sheng, Chen Yi, Liu Ningyi, Xiao Hua and Liao Chengzhi a special group to study how the Cultural Revolution is to be carried out in China's organs abroad.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 74 (Oct. 8, 1966). Made public: 2020. Names: Zhou Enlai, Lin Biao, Tao Zhu, Chen Boda, Kang Sheng, Chen Yi, Liu Ningyi, Xiao Hua, Liao Chengzhi.'
        tags: [name:zhou-enlai, name:lin-biao, name:tao-zhu, name:chen-boda, name:kang-sheng, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-08.china-leadership-2
        when: Oct. 8
        date: '1966-10-08'
        thread: china-leadership
        also: [testing, china]
        c: 'Zhou Enlai convenes the Central Special Commission and hears Zhang Zhenhuan on the preparations and the date for the flight test of a missile with a nuclear warhead, on China''s own mainland: inspect the cold test round strictly and the hot more so; the warhead to be shock-tested so that no nuclear explosion follows any mishap. The cold flight test about Oct. 15, the results in two or three days for Mao''s decision; armed guard against Red Guard interference.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 74 (Oct. 8, 1966). Made public: 2020. Names: Zhou Enlai, Zhang Zhenhuan, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-13.china-leadership-4
        when: Oct. 13
        date: '1966-10-13'
        thread: china-leadership
        also: [testing, china]
        c: The first cold test round of the missile with a nuclear warhead is fired successfully.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 74 (under Oct. 8, 1966). Made public: 2020. See [[cal.1966-10-08.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-16.china-leadership-2
        when: Oct. 16
        date: '1966-10-16'
        thread: china-leadership
        also: [testing, china]
        c: The second cold test round of the missile with a nuclear warhead is fired successfully.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 74 (under Oct. 8, 1966). Made public: 2020. See [[cal.1966-10-08.china-leadership-2]]. Names: Zhou Enlai. Check: the day; the chronology''s item of Oct. 15 has Zhou agree to the second cold test on the 17th.'
        tags: [polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-10-09.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 74, 76 (Oct. 9–28, 1966; Zhou attends the Central Work Conference; Chen Boda''s report and Lin Biao''s speech attacking Liu Shaoqi and Deng Xiaoping)'
  - add:
      entry:
        id: cal.1966-10-09.china-leadership-2
        when: Oct. 9
        date: '1966-10-09'
        thread: china-leadership
        c: 'Zhou Enlai proposes how the Central Work Conference is to be run: speakers to give views and raise problems; in each region one comrade to speak first, the rest after, or two different views together; speech orally or in writing, democracy in full, all who can to speak, differing views stated outright.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 74 (Oct. 9, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-09.china-leadership-3
        when: Oct. 9
        date: '1966-10-09'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of eight Tsinghua organizations who want Wang Guangmei to make a self-criticism at Tsinghua at once: too fast; she is in Zhongnanhai, the Center answers for her and must discuss it; she needs time, and may make it back to back, not at Tsinghua. Nor does he agree to the name "black five categories": they do not form a class.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 74–75 (Oct. 9, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Wang Guangmei.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10.china-leadership
        when: Oct., early
        date: 1966-10
        thread: china-leadership
        c: 'The Center decides to let students link up for another month in October and has the railways plan for 1.5 to 1.7 million students each way into and out of Peking. Gu Mu reports the railways difficulties; Zhou: draft three plans, with methods and difficulties, for him to put to the Standing Committee; he fears most a halt or block of the railways, the great artery, whose stoppage would paralyze the whole economy.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 75 (Oct., early 1966). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1966-10-01
  - add:
      entry:
        id: cal.1966-10-11.china-leadership
        when: Oct. 11
        date: '1966-10-11'
        thread: china-leadership
        c: 'Zhou Enlai, at the Fifth Group of the Central Work Conference, says: take the initiative; some provincial and municipal committee comrades who do not will go on being passive; the comrades in the ministries must liberate themselves.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 75 (Oct. 11, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-11.china-leadership-2
        when: Oct. 11
        date: '1966-10-11'
        thread: china-leadership
        c: Zhou Enlai sends Xu Ming and Yang Qiqing to see the wall posters against Wang Guangmei and Li Xuefeng.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 75 (Oct. 11, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Wang Guangmei, Li Xuefeng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-12.china-leadership
        when: Oct. 12
        date: '1966-10-12'
        thread: china-leadership
        c: Zhou Enlai attends the memorial meeting for Sun Zhiyuan, minister of the Third Ministry of Machine Building. During Sun's grave illness Zhou had ordered special planes to bring experts from Sichuan and Shanghai to Peking to consult.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 75 (Oct. 12, 1966). Names: Zhou Enlai, Sun Zhiyuan.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-10-12.china-leadership-2
        when: Oct. 12
        date: '1966-10-12'
        thread: china-leadership
        c: 'Zhou Enlai, on the Tsinghua Red Guards "invitation" to Wang Guangmei to attend a criticism meeting there, to the Cultural Revolution Group office for Chen Boda, Kang Sheng and Jiang Qing: he will send someone to record the meeting and bring the tape to Wang, and she is not to attend.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 75 (Oct. 12, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Wang Guangmei, Chen Boda, Kang Sheng, Jiang Qing.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-13.china-leadership
        when: Oct. 13
        date: '1966-10-13'
        thread: china-leadership
        c: 'Zhou Enlai, at the Fifth Group of the Central Work Conference, says: dare to make revolution, including against oneself, not against one''s whole political life but against the bourgeois world outlook in one''s thinking. No one was fully ready or had experience; Mao saw the movements course plainly; if we do not, no matter: follow Mao closely and do not fall behind.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 75–76 (Oct. 13, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-13.china-leadership-2
        when: Oct. 13
        date: '1966-10-13'
        thread: china-leadership
        c: 'Zhou Enlai, on the demand of the "88 Red Flag Fighting Corps" of the Harbin Military Engineering Institute that Lu Yang of the National Defense Science Commission hand over his "black list" and work notes, rules: the corps may state its views or send delegates, the all-army Cultural Revolution Group and the Commission present; the notes are state secrets, to be sealed by the Military Commission; cadres may attend criticism meetings but must be let rest.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76 (Oct. 13, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Lu Yang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-17.china-leadership-2
        when: Oct. 17
        date: '1966-10-17'
        thread: china-leadership
        c: Zhou Enlai tells Liu Zhijian that his three points on the Harbin Military Engineering Institute's "88" corps apply to the National Defense Science Commission's eleven institutes.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76 (under Oct. 13, 1966). Made public: 2020. See [[cal.1966-10-13.china-leadership-2]]. Names: Zhou Enlai, Liu Zhijian.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-13.china-leadership-3
        when: Oct. 13
        date: '1966-10-13'
        thread: china-leadership
        c: Zhou Enlai and Tao Zhu write Mao on the progress of the Central Work Conference and suggest Mao talk with the Standing Committee on the 14th or 15th and hear reports.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76 (Oct. 13, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Mao Zedong.'
        tags: [name:zhou-enlai, name:tao-zhu, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-14.china-leadership-2
        when: Oct. 14
        date: '1966-10-14'
        thread: china-leadership
        c: 'Zhou Enlai, on the Academy of Sciences'' Cultural Revolution, to Liu Xiyao: tell the General Political Department that the liaison men are to prepare to work formally at the Academy, not temporarily.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76 (Oct. 14, 1966). Made public: 2020. Names: Zhou Enlai, Liu Xiyao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-15.china-leadership-2
        when: Oct. 15
        date: '1966-10-15'
        thread: china-leadership
        c: 'Zhou Enlai receives eleven Tibetan students of the Central Nationalities Institutes cadre course, Sonam Dondrub and others. The Panchen Lama is to stay in Peking. Of the demand that serf-owners children be sent back to Tibet to be reformed, and called "black five categories": the Center has not approved the name, nor are "red five categories" red from birth, which would mean no need of reform, a fatalism and new superstition; old superstition to be broken, and new.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76 (Oct. 15, 1966). Made public: 2020. Names: Zhou Enlai, Panchen Lama.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-15.china-leadership-3
        when: Oct. 15
        date: '1966-10-15'
        thread: china-leadership
        c: 'Zhou Enlai, with Jiang Qing and others, receives people of the Capital Colleges Red Guard Revolutionary Rebel Headquarters. Asked about the charge that Shanghai uses Zhou''s statement that the Shanghai committee is correct as a shield to suppress revolution, he says he told the committee by telephone that they were not a black gang but revolutionary: revolutionary or not is enemy against us, correct or not is among the people; two questions of different nature, not to be confused, as he has said many times.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76–77 (Oct. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing.'
        tags: [name:zhou-enlai, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-15.china-leadership-4
        when: Oct. 15
        date: '1966-10-15'
        thread: china-leadership
        also: [testing]
        c: 'Zhou Enlai, on the National Defense Science Commission''s request on the nuclear test: if the weather allows, agreed to a second cold test on the 17th; after it Zhang Zhenhuan may fly to the base to inspect on the spot and bring all those concerned back to Peking to report.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Zhang Zhenhuan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-15.china-leadership-5
        when: Oct. 15
        date: '1966-10-15'
        thread: china-leadership
        c: 'Zhou Enlai, on Liu Jie''s request on handling the files of the Four Cleanups work group at Plant 221 in Qinghai: the group has been disbanded and all files are to be sealed; the "Prairie Red Guards" are to be led to see that they must make revolution by the plants and places own strength and not link up.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Jie.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-16.china-leadership
        when: Oct. 16
        date: '1966-10-16'
        thread: china-leadership
        c: 'Zhou Enlai, on the People''s Publishing House Red Guards refusal, as bourgeois, to print selected works of Sun Yat-sen, Soong Ching Ling, Liao Zhongkai, He Xiangning, Liu Yazi and Zhu Zhixin: he agrees to bring out only Sun''s and Soong''s before the centenary of Sun''s birth, the rest later or by other presses.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 16, 1966). Made public: 2020. Names: Zhou Enlai, Sun Yat-sen, Soong Ching Ling, Liao Zhongkai, He Xiangning, Liu Yazi, Zhu Zhixin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-17.china-leadership
        when: Oct. 17
        date: '1966-10-17'
        thread: china-leadership
        c: Zhou Enlai, deep at night, goes to Tiananmen to inspect the reception ground and calls Ye Jianying, Xie Fuzhi, Yang Chengwu, Zhou Rongxin, Qi Benyu and others of the reception command to meet on it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 17, 1966). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Xie Fuzhi, Yang Chengwu, Zhou Rongxin, Qi Benyu.'
        tags: [name:zhou-enlai, name:ye-jianying, name:xie-fuzhi, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-10-18.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 18, 1966; Zhou with Mao at the fifth reception of out-of-town teachers, students and Red Guards, after the fourth on Oct. 1)'
  - add:
      entry:
        id: cal.1966-10-18.china-leadership-2
        when: Oct. 18
        date: '1966-10-18'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, learning of a great earthquake in Peru and a tsunami across the Pacific, orders that the General Staff at once send an urgent notice to the coastal military regions, services and provinces to heed and take defensive measures.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 18, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-19.china-leadership
        when: Oct. 19
        date: '1966-10-19'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls Tao Zhu, Tong Xiaopeng and Zhou Rongxin and arranges to dissuade the teachers and students of the Harbin Institute of Technology from posting at Tiananmen a big-character poster against Liu Shaoqi.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 19, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Tong Xiaopeng, Zhou Rongxin, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:tao-zhu, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-19.china-leadership-2
        when: Oct. 19
        date: '1966-10-19'
        thread: china-leadership
        c: 'Zhou Enlai, on the "Mao Zedong Thought Red Guards" of the Peking Institute of Foreign Trade, who want Li Xiannian at their criticism of the bourgeois reactionary line on the 20th and three loudspeaker cars to play Li''s recorded speech in the streets: Li may attend; the three cars are not allowed.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77–78 (Oct. 19, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-20.china-leadership
        when: Oct. 20
        date: '1966-10-20'
        thread: china-leadership
        c: 'Zhou Enlai, before dawn, receives Red Guard delegates of the Harbin Institute of Technology and warns them not to post at Tiananmen a poster against Liu Shaoqi: Liu, a Standing Committee member and head of state, cannot now answer; what the Center has not urged and the Sixteen Points lack, think twice. Workers and peasants cannot take leave to link up.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 78 (Oct. 20, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-20.china-leadership-2
        when: Oct. 20
        date: '1966-10-20'
        thread: china-leadership
        c: Zhou Enlai chairs the Center's liaison meeting to study concrete measures on some policies.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 78 (Oct. 20, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-20.china-leadership-3
        when: Oct. 20
        date: '1966-10-20'
        thread: china-leadership
        also: [testing, china]
        c: 'Zhou Enlai convenes the Central Special Commission. After hearing Zhang Zhenhuan on the missile–nuclear test he again inspects its preparation and safety fully: three-way unity of leaders, masses and experts, no haste; keep steady at the time of the shot, with nothing left to chance. On the strain of the mass movement: for Communists it is a test, as jail once was; the Lu Xun spirit of bowing as an ox for the people is to be put into the test. He asks Nie Rongzhen to go to the site and direct.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 78 (Oct. 20, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Zhang Zhenhuan, Nie Rongzhen.'
        tags: [name:zhou-enlai, name:nie-rongzhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-20.china-leadership-4
        when: Oct. 20
        date: '1966-10-20'
        thread: china-leadership
        c: Zhou Enlai, told that students of the Peking Geological and Aeronautics institutes plan a rally of 500,000 to a million at Tiananmen on the 21st or 22nd, "to the death in defence of Chairman Mao", aimed at Liu Shaoqi and Deng Xiaoping, has Zhou Rongxin and the Cultural Revolution Group office send men to persuade them separately not to hold it. It is not held.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 20, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-20.china-leadership-5
        when: Oct. 20
        date: '1966-10-20'
        thread: china-leadership
        c: Zhou Enlai, after going to Mao's, talks with Liu Shaoqi and Deng Xiaoping in the Henan Hall of the Great Hall.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 20, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Mao Zedong.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-21.china-leadership
        when: Oct. 21
        date: '1966-10-21'
        thread: china-leadership
        c: Zhou Enlai calls Li Xuefeng, Liu Lantao, Song Renqiong, Li Jingquan, Wei Wenbo, Wang Renzhong, Wei Guoqing and other regional heads, with Tao Zhu, Chen Boda, Li Fuchun, Chen Yi, Ye Jianying, Tan Zhenlin, Xiao Hua and Jiang Qing, on the manner of Liu Shaoqi's and Deng Xiaoping's self-criticisms.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 21, 1966). Made public: 2020. Names: Zhou Enlai, Li Xuefeng, Liu Lantao, Song Renqiong, Li Jingquan, Wei Wenbo, Wang Renzhong, Wei Guoqing, Tao Zhu, Chen Boda, Li Fuchun, Chen Yi, Ye Jianying, Tan Zhenlin, Xiao Hua, Jiang Qing, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:li-jingquan, name:tao-zhu, name:chen-boda, name:li-fuchun, name:chen-yi, name:ye-jianying, name:tan-zhenlin, name:jiang-qing, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-21.china-leadership-2
        when: Oct. 21
        date: '1966-10-21'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of teachers and students of half-work, half-study schools come to Peking. Asked whether these are Mao''s educational thought: half-work, half-study with study first is, but it must be made concrete; the aim is a socialist-minded, educated laborer developed morally, mentally and physically; a school, whether full-time or half-work, is to put study first and learn work, farming and soldiering in the course. Not every school has "one small group"; some leaders have only individual or partial faults and are not power-holders on the capitalist road.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 21, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-22.china-leadership-2
        when: Oct. 22
        date: '1966-10-22'
        thread: china-leadership
        c: Zhou Enlai, with Tao Zhu and Li Fuchun, talks with Deng Xiaoping.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 22, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Li Fuchun, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:tao-zhu, name:li-fuchun, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-22.china-leadership-3
        when: Oct. 22
        date: '1966-10-22'
        thread: china-leadership
        c: Zhou Enlai talks with the Red Guards of the Second Headquarters of Peking and some out-of-town student delegates and asks the Red Guard bodies to open their doors to rectification and examine their own errors. Anyone may err, and to say so is not eclecticism; do not press extreme demands, for going too "Left" is Right in "Left" form. Army, courts and organs of propaganda are to stay under Party leadership, and not everything is to be stormed. Yang Xiufeng is not a black gang.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79–80 (Oct. 22, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Yang Xiufeng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-23.china-leadership-2
        when: Oct. 23
        date: '1966-10-23'
        thread: china-leadership
        c: 'Zhou Enlai calls the State Council''s vice-premiers and branch heads, the ministries'' Party-group secretaries and heads of the Center''s organs and the Military Commission, on easing the strain between the work groups and the students: the groups'' chief men to take responsibility; their errors are among the people. The Military Commission, Defense, Public Security and Foreign Affairs are not to open their posters and files to students.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 80 (Oct. 23, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-23.china-leadership-3
        when: Oct. 23
        date: '1966-10-23'
        thread: china-leadership
        c: 'Zhou Enlai answers Liu Zhijian''s telephoned request on how to characterize the errors of the work groups: follow Article 7 of the Sixteen Points. It says that some schools, units and work-group leaders, Party and government cadres included, erred in direction and line, not all the groups; the groups error was chiefly carrying out a line, but to speak of it generally as Article 7 does, so that the masses do not ask whose wrong line it was.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 80 (Oct. 23, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Zhijian.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-24.china-leadership-4
        when: Oct. 24
        date: '1966-10-24'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou Enlai receives Pakistan''s Foreign Minister Pirzada: the two countries differ in system, nation and belief but have a basis for peaceful coexistence and both will keep the Five Principles.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 80 (Oct. 24, 1966). Made public: 2020. Names: Zhou Enlai, Pirzada.'
        tags: [name:zhou-enlai, name:pirzada-sharifuddin, polity:prc, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1966-10-24.china-leadership-5
        when: Oct. 24
        date: '1966-10-24'
        thread: china-leadership
        c: Zhou Enlai tells Tao Lujia to work in person on the industry-and-transport liaison station not to hold a mass meeting to criticize Bo Yibo.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 80 (Oct. 24, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Lujia, Bo Yibo.'
        tags: [name:zhou-enlai, name:bo-yibo, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-10-24.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 80–81 (Oct. 24, 1966; Zhou at the report meeting at Mao''s; Mao on the wall posters against Liu and Deng, on Ah Q and on "mixing mud", and on the Eighth Congress report, which the Congress passed)'
  - cite:
      id: cal.1966-10-25.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 81 (Oct. 25, 1966; Zhou at the plenary session of the Central Work Conference, where Lin Biao and Mao speak)'
  - add:
      entry:
        id: cal.1966-10-26.china-leadership
        when: Oct. 26
        date: '1966-10-26'
        thread: china-leadership
        c: 'Zhou Enlai speaks to the East China group of the Central Work Conference. The Cultural Revolution has no precedent, even in other socialist countries; each lacks experience of practice and of history; the line struggle was raised after the Cultural Revolution Group talked with the minority, and he did not foresee it and risks falling behind. Plans for receiving the students linking up have always been too conservative: the limit was to be about 1.5 million; Mao says no, prepare to pass two or three million.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 81–82 (Oct. 26, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-26.china-leadership-2
        when: Oct. 26
        date: '1966-10-26'
        thread: china-leadership
        c: Zhou Enlai, after talks with Tao Zhu, Li Fuchun and Ye Jianying, meets the chief men of the regions, provinces and cities and the heads of the State Council's branches and the Cultural Revolution Group on conveying the spirit of the Central Work Conference and on policies and measures of the movement.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 82 (Oct. 26, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Li Fuchun, Ye Jianying.'
        tags: [name:zhou-enlai, name:tao-zhu, name:li-fuchun, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-26.china-leadership-3
        when: Oct. 26
        date: '1966-10-26'
        thread: china-leadership
        also: [testing]
        c: Zhou Enlai approves the launch time fixed by the base committee, 9 a.m. on the 27th, and asks everyone again to keep steady for the test.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 78 (Oct. 20, 1966; "二十六日"). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-27.china-leadership
        when: Oct. 27
        date: '1966-10-27'
        thread: china-leadership
        also: [testing, china]
        c: China holds its first test combining missile and nuclear warhead, and it succeeds; China now has missile-borne nuclear weapons fit for use in war.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 78–79 (Oct. 20, 1966; "二十七日"). Names: Zhou Enlai. Check: the nianpu names the date but not the place, the yield or the Chinese announcement.'
        tags: [name:zhou-enlai, polity:prc]
  - cite:
      id: cal.1966-10-28.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 82 (Oct. 28, 1966; Zhou at Mao''s, asking about conveying the conferences spirit and concrete policies)'
  - add:
      entry:
        id: cal.1966-10-28.china-leadership-2
        when: Oct. 28
        date: '1966-10-28'
        thread: china-leadership
        c: 'Zhou Enlai speaks at the closing plenary session of the Central Work Conference, explaining rules: Peking''s students not to link up outside for now; Red Guards limited to school youth under thirty, none in villages, factories or offices; the army, police, courts, Xinhua and the press held by the Party; leaders not to be dismissed, seized or beaten by Red Guards; Four Cleanups teams are not work groups. "I never dreamed of such a situation."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 82 (Oct. 28, 1966, the item after). Made public: 2020. See [[cal.1966-10-09.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-28.china-leadership-3
        when: Oct. 28
        date: '1966-10-28'
        thread: china-leadership
        c: Zhou Enlai talks with Xu Ming and Yang Dezhong on students of Zhengzhou University entering Zhongnanhai.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83 (Oct. 28, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Xu Ming, Yang Dezhong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-29.china-leadership
        when: Oct. 29
        date: '1966-10-29'
        thread: china-leadership
        c: 'Zhou Enlai receives Red Guard delegates of Jiangxi and Xinjiang: factories, enterprises and research units cannot stop work; not everyone in the country can go linking up.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83 (Oct. 29, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-10-29.china-leadership-2
        when: Oct. 29
        date: '1966-10-29'
        thread: china-leadership
        c: Zhou Enlai, told that rebels broke open Tao Lujia's office and took some papers, orders all files of the State Economic Commission gathered and sealed by the State Council, none to be moved without the State Council's approval.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83 (Oct. 29, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Lujia.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-30.china-leadership
        when: Oct. 30
        date: '1966-10-30'
        thread: china-leadership
        c: 'Zhou Enlai, before dawn, calls the two factions at the Great Hall of the People and tells them to stop quarrelling, as it hurts the work: the Hall serves the Center, not for their debates; the small reasons yield to the large; school forms and ways of struggle are not to come into the Hall.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83 (Oct. 30, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-30.china-leadership-2
        when: Oct. 30
        date: '1966-10-30'
        thread: china-leadership
        c: 'Zhou Enlai, on Tao Lujia''s question whether to send someone to the criticism of Bo Yibo called for Nov. 2 by the industry-and-transport colleges: only a man of the industry-and-transport political department may sit in, saying he is unprepared and cannot speak.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83 (Oct. 30, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Lujia, Bo Yibo.'
        tags: [name:zhou-enlai, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-02.china-leadership-2
        when: Nov. 2
        date: '1966-11-02'
        thread: china-leadership
        c: Zhou Enlai has Tao Lujia tell the industry-and-transport college students that Bo Yibo is ill and, with the Center's approval, under treatment elsewhere, and cannot attend their criticism meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83 (under Oct. 30, 1966). Made public: 2020. See [[cal.1966-10-30.china-leadership-2]]. Names: Zhou Enlai, Tao Lujia, Bo Yibo.'
        tags: [name:zhou-enlai, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-30.china-leadership-3
        when: Oct. 30
        date: '1966-10-30'
        thread: china-leadership
        c: Zhou Enlai drafts the Center's Provisions on Handling Archive Materials and Other Matters in the Cultural Revolution. Errors of the bourgeois reactionary line are among the people; student bodies are not to curb the work groups' or leaders' movement or rest. Organs of dictatorship, secret and key organs, the press and radio and the Center's and bureaus' head organs are closed to linking up; no sealing of offices.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83–84 (Oct. 30, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-30.china-leadership-4
        when: Oct. 30–31
        date: '1966-10-30'
        thread: china-leadership
        c: Zhou Enlai calls Xie Fuzhi, Yang Chengwu, Lü Zhengcao, Zheng Weishan, Fu Chongbi, Wu De, Wang Dongxing and Zhou Rongxin on rail transport and the reception of students.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 30, 31, 1966). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi, Yang Chengwu, Lü Zhengcao, Zheng Weishan, Fu Chongbi, Wu De, Wang Dongxing, Zhou Rongxin.'
        tags: [name:zhou-enlai, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10-31.china-leadership-2
        when: Oct. 31
        date: '1966-10-31'
        thread: china-leadership
        also: [china]
        c: The Center and the State Council issue, reviewed and revised by Zhou Enlai, an urgent notice on keeping order on the railways. Order is badly disturbed; to secure the transport of teachers, students, passengers and state goods each place is to bring students to Peking by plan and control the numbers, following the notice of Sept. 5; Nov. 1–5 the students of all places are to pause in coming; Red Guards to follow the railway rules and never stop or hold trains; the railways to restore order quickly.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 31, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-10-31.china-leadership-3
        when: Oct. 31
        date: '1966-10-31'
        thread: china-leadership
        c: Zhou Enlai, with Tao Zhu, Chen Boda, Kang Sheng, Jiang Qing and Yao Wenyuan, attends the capital's meeting marking the thirtieth anniversary of Lu Xun's death. Yao Wenyuan, speaking, calls for criticism of "eclecticism, fairness and compromise", a hint at Zhou.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 31, 1966, the item after). Names: Zhou Enlai, Tao Zhu, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan.'
        tags: [name:zhou-enlai, name:tao-zhu, name:chen-boda, name:kang-sheng, name:jiang-qing, name:yao-wenyuan, polity:prc]
  - add:
      entry:
        id: cal.1966-10-31.china-leadership-4
        when: Oct. 31
        date: '1966-10-31'
        thread: china-leadership
        c: Zhou Enlai receives the Red Guard delegates of Tianjin Engineering College and criticizes Red Guards who halted a train for over ten hours to search it for "black five categories", hampering its running.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 31, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10.china-leadership-2
        when: Oct.
        date: 1966-10
        thread: china-leadership
        c: 'Zhou Enlai tells his health doctor, Zhang Zuoliang, to go and see Liu Shaoqi and find how he is. Liu answers: thanks for the Premier''s concern, how is he, is he well? Zhang: well, only too busy and rests too little. Liu: "give my regards to him, and ask him to look after himself."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-10.china-leadership-3
        when: Oct.
        date: 1966-10
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, during the Central Work Conference, talks with Yang Yichen: Heilongjiang''s defence place is important, it must not fall into disorder, nor production be left to collapse; few there are grasping production, and Yang should come out and work, not be held by the rebels over disagreement about the Cultural Revolution; create conditions and concentrate on production.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 1966, the item after). Made public: 2020. Names: Zhou Enlai, Yang Yichen. Check: the day; the chronology says "during the Central Work Conference" (Oct. 9–28).'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-02.china-leadership
        when: Nov. 2
        date: '1966-11-02'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reviews and revises the Center''s and State Council''s urgent notice asking out-of-town revolutionary teachers, students and Red Guards in Peking to leave in good order: having met Mao''s wish, to go quickly and keep discipline and the railways clear.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 2, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-11-03.china-leadership-2
        when: Nov. 3
        date: '1966-11-03'
        thread: china-leadership
        c: 'Zhou Enlai, before the sixth reception, calls the heads of Peking''s Red Guard bodies: Peking''s teachers and students are not to take part in the Tiananmen review; to help the PLA and others with propaganda and order; and after the out-of-town teachers and students are reviewed, urge them home to run their own Cultural Revolution.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 3, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-11-03.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 3, 1966; Zhou with Mao at the sixth reception on Tiananmen)'
  - add:
      entry:
        id: cal.1966-11-04.china-leadership-2
        when: Nov. 4
        date: '1966-11-04'
        thread: china-leadership
        c: 'Zhou Enlai receives the Chinese sports delegation to the first Asian Games of the New Emerging Forces. Of some who petitioned at He Long''s home and would not leave, wearing the marshal down: this is wrong; "I was very displeased to hear of it."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 4, 1966). Names: Zhou Enlai, He Long.'
        tags: [name:zhou-enlai, name:he-long, polity:prc]
  - add:
      entry:
        id: cal.1966-11-06.china-leadership-2
        when: Nov. 6
        date: '1966-11-06'
        thread: china-leadership
        c: 'Zhou Enlai writes Soong Ching Ling: busier lately, he has held her article back until now and is uneasy; he sends the Chinese and English versions, revised, for her to look over.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 6, 1966). Made public: 2020. Names: Zhou Enlai, Soong Ching Ling.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-13.china-leadership-2
        when: Nov. 13
        date: '1966-11-13'
        thread: china-leadership
        c: The *Renmin ribao* prints Soong Ching Ling's article, as Zhou Enlai revised it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (under Nov. 6, 1966). See [[cal.1966-11-06.china-leadership-2]]. Names: Zhou Enlai, Soong Ching Ling.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-11-07.china-leadership
        when: Nov. 7
        date: '1966-11-07'
        thread: china-leadership
        c: Zhou Enlai talks with rebel delegates of the Academy of Sciences.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 7, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-12.china-leadership
        when: Nov. 12–29
        date: '1966-11-12'
        thread: china-leadership
        c: Zhou Enlai holds over ten talks with Academy of Sciences delegates and with members of the Academy's Party committee.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 7, 1966; "十二日至二十九日"). Made public: 2020. Names: Zhou Enlai. Check: the days of the talks.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-08.china-leadership-2
        when: Nov. 8
        date: '1966-11-08'
        thread: china-leadership
        c: 'Liao Chengzhi and Li Jinde telephone Zhou Enlai: should Liu Shaoqi and Deng Xiaoping attend the Nov. 12 meeting for the centenary of Sun Yat-sen''s birth, which over a thousand Red Guards are to attend? If they come, they fear Red Guards will rush the platform or shout unfit slogans. Zhou: "Liu and Deng may ask leave and not attend; Red Guards may be invited, with work done beforehand."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 8, 1966). Made public: 2020. Names: Zhou Enlai, Liao Chengzhi, Li Jinde, Liu Shaoqi, Deng Xiaoping, Sun Yat-sen.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-08.china-leadership-3
        when: Nov. 8
        date: '1966-11-08'
        thread: china-leadership
        c: 'Zhou Enlai talks with delegates of the three Red Guard headquarters of Peking''s colleges. To one who would let the whole country go into disorder: like surrounding Zhongnanhai''s west gates against Tao Zhu? That is feudal thought. Tao was elected to the Standing Committee at the Eleventh Plenum under Mao. The gates are so blocked that Mao goes by a small one: "I look on with sorrow."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85–86 (Nov. 8, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Mao Zedong.'
        tags: [name:zhou-enlai, name:tao-zhu, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-09.china-leadership
        when: Nov. 9
        date: '1966-11-09'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou Enlai talks with the Vietnam Workers'' Party delegation under Lê Duẩn. On the Cultural Revolution: if a party rests on a few men''s prestige and not on Marxism-Leninism and Mao Zedong Thought taken to the masses, a few men of prestige can change its nature wholly; an error of line is not being anti-Party, we count it as a contradiction among the people; we say democratic centralism, but how socialist and proletarian democracy are to work has no model yet.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 86 (Nov. 9, 1966). Made public: 2020. Names: Zhou Enlai, Lê Duẩn.'
        tags: [name:zhou-enlai, name:le-duan, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1966-11-09.china-leadership-2
        when: Nov. 9
        date: '1966-11-09'
        thread: china-leadership
        c: 'Zhou Enlai chairs the discussion revising the *Renmin ribao* editorial "More on Grasping Revolution and Promoting Production": production and construction cannot be broken or stalled; he rejects talk that stresses "grasp revolution" and never production.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 86–87 (Nov. 9, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-11-10.china-leadership-4
        when: Nov. 10
        date: '1966-11-10'
        thread: china-leadership
        c: 'The *Renmin ribao* prints the editorial "More on Grasping Revolution and Promoting Production": the economy is a whole; the Revolution in mines, enterprises and villages is not to take production time or leave production posts.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 86–87 (under Nov. 9, 1966). See [[cal.1966-11-09.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-11-09.china-leadership-3
        when: Nov. 9
        date: '1966-11-09'
        thread: china-leadership
        also: [china]
        c: The Shanghai Workers' Revolutionary Rebel General Headquarters, under Wang Hongwen, is founded. The Shanghai committee, by the Sixteen Points and the Center's rule against organizations across trades, decides on a stand of not approving, not supporting and not joining.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 9, 1966). Made public: 2020. Names: Zhou Enlai, Wang Hongwen.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-10.china-leadership-2
        when: Nov. 10
        date: '1966-11-10'
        thread: china-leadership
        also: [china]
        c: Before dawn the General Headquarters of Shanghai's rebel workers, in the name of going to Peking to "lodge a complaint", lies on the rails at Anting station near Shanghai and stops the trains, cutting the Shanghai–Nanjing line for thirty-one hours.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 10, 1966). Made public: 2020. See [[cal.1966-11-09.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-10.china-leadership-3
        when: Nov. 10
        date: '1966-11-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, told of the Anting stoppage, has Chen Boda wire the East China Bureau''s Han Zheyi that the Bureau and the Shanghai committee must stand firm: the General Headquarters is not to be recognized as lawful, nor lying on the rails as revolutionary action. He wires the Shanghai workers at Anting that their act harms their units'' output and the country''s traffic, and asks them to return to Shanghai at once.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 9, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Han Zheyi.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11.china-leadership
        when: Nov., early
        date: 1966-11
        thread: china-leadership
        c: 'Zhou Enlai rules on the Red Guards plan to hold a rally of a hundred thousand at Tiananmen to criticize Tan Qilong and parade him: the criticism meeting is not to be held, nor the parade.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov., early 1966). Made public: 2020. Names: Zhou Enlai, Tan Qilong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1966-11-01
  - cite:
      id: cal.1966-11-10.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 10–11, 1966; Zhou with Mao at the seventh reception, two million out-of-town teachers, students and Red Guards)'
  - add:
      entry:
        id: cal.1966-11-12.china-leadership-2
        when: Nov. 12
        date: '1966-11-12'
        thread: china-leadership
        c: 'Zhou Enlai speaks at the meeting for the centenary of Sun Yat-sen''s birth. Sun was a great revolutionary of the Chinese bourgeois-democratic revolution; the 1911 Revolution he led had great historical meaning: it did not finish the democratic task against imperialism and feudalism, but it ended over two thousand years of feudal monarchy and raised the spirit of democracy; the Chinese people will always remember his part.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87–88 (Nov. 12, 1966). Names: Zhou Enlai, Sun Yat-sen.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-11-13.china-leadership
        when: Nov. 13
        date: '1966-11-13'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, with Tao Zhu, Chen Yi, He Long, Xu Xiangqian, Ye Jianying, Xiao Hua, Yang Chengwu and the heads of the General Department's and services, receives at the Workers' Stadium those in Peking from the army's academies and from cultural and sports units. He walks the field with Tao Zhu to meet the delegates and leaves. Chen Yi, Xu Xiangqian, Ye Jianying and others criticize extreme practices in the Cultural Revolution and stress that the army must not fall into disorder.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 13, 1966). Names: Zhou Enlai, Tao Zhu, Chen Yi, He Long, Xu Xiangqian, Ye Jianying, Xiao Hua, Yang Chengwu.'
        tags: [name:zhou-enlai, name:tao-zhu, name:chen-yi, name:he-long, name:xu-xiangqian, name:ye-jianying, polity:prc]
  - add:
      entry:
        id: cal.1966-11-14.china-leadership-2
        when: Nov. 14
        date: '1966-11-14'
        thread: china-leadership
        c: Zhou Enlai chairs the Center's liaison meeting. Gu Mu reports his views on the "Twelve Instructions on the Cultural Revolution in Factories" Chen Boda drafted in the Cultural Revolution Group's name and proposes a national industry-and-transport conference on how mines and factories are to carry it out. Zhou agrees and has the Twelve taken to the meeting for opinions.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 14, 1966). Made public: 2020. Names: Zhou Enlai, Gu Mu, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-14.china-leadership-3
        when: Nov. 14
        date: '1966-11-14'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on Wei Wenbo''s report that rebels keep on struggling against Li Baohua and Li Renzhi, tells Tao Zhu to telephone the Anhui committee; if true, to telephone the head of the "Aug. 27 Rebel Corps": in any case free Li and Li and let them go home to rest.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 14, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Wei Wenbo, Li Baohua, Li Renzhi, Tao Zhu.'
        tags: [name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-14.china-leadership-4
        when: Nov. 14
        date: '1966-11-14'
        thread: china-leadership
        c: 'Zhou Enlai calls an emergency meeting of the heads of Peking''s college Red Guards: the weather turns cold and many out-of-town students are in Peking; whichever faction, take united action and help the PLA receive them well and give them political study and military training.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 14, 1966, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-11-14.china-leadership-5
        when: Nov. 14
        date: '1966-11-14'
        thread: china-leadership
        c: Zhou Enlai, on Yan Dakai's request to return to Hebei for farm output, tells Tao Zhu, Li Fuchun and Li Xuefeng that if the North China Bureau names Xie Xueheng first secretary of the Tianjin committee, it is better for Yan to go back and run farming in Hebei.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 14, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Yan Dakai, Tao Zhu, Li Fuchun, Li Xuefeng.'
        tags: [name:zhou-enlai, name:tao-zhu, name:li-fuchun, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-11-15.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 15, 1966; Zhou at Mao''s on archive materials; next day the Politburo meeting revises the supplementary rules by Mao''s view, issued with his approval the same day)'
  - add:
      entry:
        id: cal.1966-11-16.china-leadership-2
        when: Nov. 16
        date: '1966-11-16'
        thread: china-leadership
        c: 'Zhou Enlai receives Red Guard delegates of some Tianjin universities: Chen Boda''s speech is not to spread, for it is still being revised; a national Red Guard organization will hardly do, an international one still less.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 16, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-11-16.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 16, 1966; Zhou finishes the Center''s and State Council''s notice on revolutionary linking up and sends it to Mao, who writes "return to the Premier to handle"; issued the same day: from Nov. 21 to the spring thaw teachers, students and Red Guards everywhere stop going by rail, ship and bus to Peking or elsewhere to link up)'
  - add:
      entry:
        id: cal.1966-11-16.china-leadership-3
        when: Nov. 16
        date: '1966-11-16'
        thread: china-leadership
        c: Zhou Enlai attends the Peking middle schools meeting to criticize the bourgeois reactionary line.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 16, 1966, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-11-17.china-leadership-3
        when: Nov. 17
        date: '1966-11-17'
        thread: china-leadership
        c: Zhou Enlai tells Zheng Weishan that, from the trend of Red Guards coming to Peking, to prepare to receive three million. After they arrive they will have short military and political training by plan; 100,000 to 110,000 cadres of squad rank and above and old soldiers to be drawn from the army for the Red Guards military training.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 17, 1966). Made public: 2020. Names: Zhou Enlai, Zheng Weishan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-17.china-leadership-4
        when: Nov. 17
        date: '1966-11-17'
        thread: china-leadership
        c: Zhou Enlai lists eleven points for special guard (Zhongnanhai, Diaoyutai, the Defense Ministry, Public Security, Foreign Ministry, State Planning Commission, Xinhua, the *Renmin ribao*, the broadcasting building, the post and telegraph building, the Great Hall of the People) and orders their guard strengthened so that no one from outside can get in in any case.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89–90 (Nov. 17, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-17.china-leadership-5
        when: Nov. 17
        date: '1966-11-17'
        thread: china-leadership
        c: Zhou Enlai receives delegates of the "88 Corps" and the "East Is Red" of the Harbin Military Engineering Institute and rebukes the 88 Corps for storming the National Defense Science Commission at Sanzuomen and seizing Lu Yang. Under Nie Rongzhen the Defense and State Science commissions did mostly well, the atom bomb and the missile are in the sky; to doubt everything is not scientific, nor Mao Zedong Thought, nor seeking truth from facts.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 90 (Nov. 17, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Lu Yang, Nie Rongzhen.'
        tags: [name:zhou-enlai, name:nie-rongzhen, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-11-17.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 90 (Nov. 17–23, 1966; before the planning and the industry-and-transport conferences Zhou has Yu Qiuli press the preparation, so as to fix the 1967 plan early and well, and has Gu Mu form a team on carrying out "grasp revolution, promote production"; the delegates reject the Twelve Instructions allowance of factory factions and student link-ups; Gu Mu drafts the Fifteen Articles)'
  - add:
      entry:
        id: cal.1966-11-19.china-leadership
        when: Nov. 19
        date: '1966-11-19'
        thread: china-leadership
        c: 'Zhou Enlai attends the industry-and-transport symposium under Gu Mu and sums up the situation in four phrases: "just rising and hard to stop; the trend of the time; go with it and guide it." Go in with the attitude "if I do not enter the sea of woe, who will?"; guide the tide, stand forth to guard the Party''s and states interest, and not complain if swept away oneself.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 90 (Nov. 19, 1966). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-11-22.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 90–91 (Nov. 22, 1966; Zhou and Li Fuchun report to Mao that Chen Boda and the Cultural Revolution Group object to the Fifteen Articles; Mao''s four points)'
  - add:
      entry:
        id: cal.1966-11-19.china-leadership-2
        when: Nov. 19
        date: '1966-11-19'
        thread: china-leadership
        c: 'Zhou Enlai, told that the Peking Institute of Political Science and Law will hold a mass meeting to criticize Li Xuefeng and to chase Liu Shaoqi and Deng Xiaoping, tells Xinhua: the Center has settled the Liu and Deng question and it is not to be taken to the masses; the Center does not support such a meeting; Xinhua, the *Renmin ribao* and the radio are to send no reporters.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 91 (Nov. 19, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Xuefeng, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-11-20.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 91 (Nov. 20, 1966; Zhou''s instruction to forward the Peking committees Nov. 18 Important Notice to the bureaus and provincial committees, each to print it in its own name and post it in schools, mines and offices: no private detention, courts or beating)'
  - add:
      entry:
        id: cal.1966-11-21.china-leadership
        when: Nov. 21
        date: '1966-11-21'
        thread: china-leadership
        c: 'Zhou Enlai, on the Peking Foreign Languages Institute students appeal, wall posters and loudspeakers at the Foreign Ministry over an exhibition abroad: tell the students he will see their delegates this week; no more protests at the Ministry or loudspeakers before the talk.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 91 (Nov. 21, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-23.china-leadership
        when: Nov. 23
        date: '1966-11-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, answering Du Ping, political commissar of the Nanjing Military Region, on students demand that Jiang Weiqing come to a meeting to make a self-criticism: tell the students he is ill and cannot attend, and could not make one if forced; when cured he will; the provincial committee to work with the students and avoid a deadlock.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 91 (Nov. 23, 1966). Made public: 2020. Names: Zhou Enlai, Du Ping, Jiang Weiqing.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-11-24.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 24, 1966; Zhou''s draft telegram to the Northwest Bureau on Liu Lantaos release from prison, with his letter to Mao: the Seventh and Eighth Congresses examined it, so the Center must admit it knew; Mao: "do as proposed")'
  - cite:
      id: cal.1966-11-25.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 24, 1966; Zhou reviews and issues the Center''s and State Council''s telegram to the East China Bureau and Zhejiang committee, copy to all: public security organs are organs of dictatorship, to be kept working; masses who entered must leave at once; students and masses had burst into public security offices and hurt policemen in Zhejiang, Fujian, Xinjiang, Yunnan, Jilin and Hebei)'
  - add:
      entry:
        id: cal.1966-11-24.china-leadership-3
        when: Nov. 24
        date: '1966-11-24'
        thread: china-leadership
        c: 'Zhou Enlai at the discussion and revision of the draft Provisions on the Cultural Revolution in Mining and Industrial Enterprises. Liu Lanbo, Lü Zhengcao and Lü Dong express anger at Chen Boda''s and the Cultural Revolution Group''s efforts to throw industry and transport into disorder. Zhou: "if we do not go to hell, who will? if we do not enter the tigers lair, who will?" All are to give up personal interest for the Party and state, in the spirit of going into the tigers lair for its cub, and to resolve to enter "hell".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 24, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Lanbo, Lü Zhengcao, Lü Dong, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-11-25.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 25–26, 1966; Zhou with Mao at the eighth reception of out-of-town teachers, students and Red Guards)'
  - add:
      entry:
        id: cal.1966-11-26.china-leadership
        when: Nov. 26
        date: '1966-11-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, receiving the delegates of the Sichuan group come to Peking to lodge complaints, orders: the Military Commission will take back tonight the weapons stored by the "East Is Red Commune" and the "Aug. 1 Red Flag Fighting Corps" of the Chengdu Geological Institute; the Commission is to check, not one bullet missing.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 93 (Nov. 26, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-27.china-leadership
        when: Nov. 27
        date: '1966-11-27'
        thread: china-leadership
        c: 'Zhou Enlai speaks at the collective reception of out-of-town teachers, students and masses: the present situation is "the trend of the time", to be guided, not blocked. Those who erred in line are generally among the people. Great democracy has limits. Respect the organs of dictatorship and the PLA; do not disturb the press, radio, foreign affairs or key organs; removal of leaders belongs to the committees and the Center.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 93 (Nov. 27, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-11-28.china-leadership
        when: Nov. 28
        date: '1966-11-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai revises and approves the State Council''s telegram to the Chengdu workers who would come to Peking to petition, adding: think carefully, thousands of workers petitioning in Peking is hard to receive and talk with and hurts the factories output; if the other sides workers come likewise, output suffers more.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 93 (Nov. 28, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-28.china-leadership-2
        when: Nov. 28
        date: '1966-11-28'
        thread: china-leadership
        c: Zhou Enlai at the arts world's Cultural Revolution rally under Chen Boda. After Jiang Qing calls for exposing the old Peking committee and the Propaganda and Culture departments, Zhou says the Revolution's aim is to strengthen proletarian dictatorship, dig out revisionism's roots and speed production; the arts revolution has won over the revisionist black line. The Group announces Jiang Qing as the PLA's adviser on cultural work.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 93 (Nov. 28, 1966, the item after). See [[cal.1966-11-24.china-leadership]]. Names: Zhou Enlai, Chen Boda, Jiang Qing.'
        tags: [name:zhou-enlai, name:chen-boda, name:jiang-qing, polity:prc]
  - add:
      entry:
        id: cal.1966-11-29.china-leadership
        when: Nov. 29
        date: '1966-11-29'
        thread: china-leadership
        c: Zhou Enlai, at the Workers' Stadium, appears before the hundred thousand of the army's academies and cultural and sports units in Peking, and leaves. Chen Yi, Ye Jianying and others again criticize wrong practices in the Cultural Revolution.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 13, 1966; "二十九日"). Names: Zhou Enlai, Chen Yi, Ye Jianying.'
        tags: [name:zhou-enlai, name:chen-yi, name:ye-jianying, polity:prc]
  - add:
      entry:
        id: cal.1966-11-30.china-leadership
        when: Nov. 30
        date: '1966-11-30'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai wires the "Red Rebel Corps" of the Jilin "Mao Zedong Thought Education University" and the Jilin Normal University Red Guards: on Zhao Lin''s release from prison, the Center on Nov. 26 replied to the Northeast Bureau and the Jilin committee; he asks them to follow it: the Center knows, and if they have new material they may send delegates to the Center, not publish or hunt it in meetings.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 94 (Nov. 30, 1966). Made public: 2020. Names: Zhou Enlai, Zhao Lin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-30.china-leadership-2
        when: Nov. 30
        date: '1966-11-30'
        thread: china-leadership
        c: 'Zhou Enlai, on Shaanxi Secretary Li Ruishan''s wire that the Red Guards led by Xian Jiaotong University want delegates to sit in at the provincial committees three-level cadres meeting to hear self-criticisms of Liu Lantao and Zhao Shiyan, rules: Mao did say Red Guards and revolutionary students are not to attend the Party''s three-level cadre meetings.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 94 (Nov. 30, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Ruishan, Liu Lantao, Zhao Shiyan, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-11-30.china-leadership-3
        when: Nov. 30
        date: '1966-11-30'
        thread: china-leadership
        c: 'Zhou Enlai speaks at the collective reception by the Center''s leaders of masses from factories, mines, institutions and offices around the country. Because of the Cultural Revolution all have had problems; the Center is studying them and drafting decisions; they have been long away from their units, with production and work, and most may go back, leaving a few delegates. Chen Boda adds that in a word it is the Premier''s instruction, the Center''s spirit: make revolution and grasp and promote production, without hampering production.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 94 (Nov. 30, 1966, the item after). Names: Zhou Enlai, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc]
  - add:
      entry:
        id: cal.1966-12-01.china-leadership
        when: Dec. 1
        date: '1966-12-01'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reviews the Center''s and State Council''s Supplementary Notice on Revolutionary Linking Up by Teachers and Students of Colleges and Middle Schools and sends it to Mao: out-of-town teachers, students and Red Guards to leave Peking, and all linking up elsewhere to be back, by Dec. 20; no free rides from Dec. 21; those still in Peking to get military and political training from the PLA.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 94–95 (Dec. 1, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-12-02.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 1, 1966; Zhou''s draft of the supplementary notice, sent Dec. 1, and Mao''s return of it)'
  - add:
      entry:
        id: cal.1966-12-02.china-leadership-2
        when: Dec. 2
        date: '1966-12-02'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai drafts the Center General Office''s wire to Sichuan''s Mianyang county committee, for the responsible man: of the thousand-odd workers taking different roads from Mianyang to Peking, send someone to Guangyuan to work on them, urge them by all means to go back to Chengdu by train, and let only delegates go north.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 2, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-02.china-leadership-3
        when: Dec. 2
        date: '1966-12-02'
        thread: china-leadership
        c: Zhou Enlai calls Tao Zhu, Li Fuchun, Yu Qiuli, Gu Mu and Cultural Revolution Group staff to discuss the Eight Points on Grasping Revolution and Promoting Production that Chen Boda drafted separately; the meeting makes them ten. He writes Mao on the meeting and suggests Mao talk with them on the 3rd or 4th about how revolution is to go in mines and enterprises.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 2, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Li Fuchun, Yu Qiuli, Gu Mu, Chen Boda, Mao Zedong.'
        tags: [name:zhou-enlai, name:tao-zhu, name:li-fuchun, name:chen-boda, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-02.china-leadership-4
        when: Dec. 2
        date: '1966-12-02'
        thread: china-leadership
        c: 'Zhou Enlai reviews Xinhua''s draft report of the speeches of Chen Boda, Jiang Qing, Zhou and others at the Nov. 28 arts rally and draws double lines beside three passages naming Peng Zhen, Lu Dingyi, Zhou Yang and others as "counter-revolutionary revisionists". He sends it to Mao: the Cultural Revolution Group has passed it and Lin Biao reviewed it; whether the naming is fit is for the Chairman to say.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 2, 1966, the item after). Made public: 2020. See [[cal.1966-11-28.china-leadership-2]]. Names: Zhou Enlai, Peng Zhen, Lu Dingyi, Zhou Yang, Mao Zedong, Lin Biao.'
        tags: [name:zhou-enlai, name:peng-zhen, name:lu-dingyi, name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-12-03.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 3, 1966; Mao strikes the three passages of names and returns it "to the Premier, changed, please consider again"; Zhou has Chen Boda, Kang Sheng and Jiang Qing read it and Tang Pingzhu print it as Mao marked)'
  - add:
      entry:
        id: cal.1966-12-03.china-leadership-3
        when: Dec. 3
        date: '1966-12-03'
        thread: china-leadership
        c: Zhou Enlai receives delegates of twelve mass organizations of the Peking Foreign Languages Institute and does not agree to their going to the Foreign Ministry to "feel for the black line". Mao does not favor the names "royalist" and "black gang". He defends Feng Zhi and Chen Yi, a comrade long known; they are not to storm the Foreign Ministry, Public Security, Defense, Zhongnanhai or the Great Hall.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95–96 (Dec. 3, 1966). Made public: 2020. Names: Zhou Enlai, Feng Zhi, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-04.china-leadership-2
        when: Dec. 4
        date: '1966-12-04'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, told that Jiang Qing, Qi Benyu and others prompted some people to seize Peng Zhen, Liu Ren, Wan Li, Lin Mohan, Xia Yan, Tian Han and Xu Liqun before dawn: no precedent is to be set; men are not to be taken away at will. He has the Peking garrison and Public Security find them, rebukes the student bodies for abduction, gets the men back and has the garrison plan their protection.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 96 (Dec. 4, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Qi Benyu, Peng Zhen, Liu Ren, Wan Li, Lin Mohan, Xia Yan, Tian Han, Xu Liqun.'
        tags: [name:zhou-enlai, name:jiang-qing, name:peng-zhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-04.china-leadership-3
        when: Dec. 4
        date: '1966-12-04'
        thread: china-leadership
        c: 'Zhou Enlai receives worker delegates from Chengdu who came to Peking and criticizes their forcing their way onto trains: the Red Guards transport is stopped chiefly to speed materials, fuel and other goods; as the working class they should know the Cultural Revolution is not to hurt production.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 96 (Dec. 4, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-12-04.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 96 (Dec. 4–6, 1966; Zhou at the enlarged Politburo meeting under Lin Biao: Gu Mu reports on the industry-and-transport symposium; Lin Biao, Kang Sheng, Chen Boda and Wang Li attack Gus outline as saying "do not make the Cultural Revolution"; on the 6th, on Chen''s charge that Gu did not consult him, Zhou says he had Gu write it, overnight, with no time to ask opinion, and that though it has faults it did some work)'
  - add:
      entry:
        id: cal.1966-12-06.china-leadership
        when: Dec. 6
        date: '1966-12-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls Chen Yi, Liao Chengzhi and Foreign Ministry officials on the Macao question.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 97 (Dec. 6, 15, 1966). Made public: 2020. Names: Zhou Enlai, Chen Yi, Liao Chengzhi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-15.china-leadership-2
        when: Dec. 15
        date: '1966-12-15'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls Chen Yi, Liao Chengzhi and Foreign Ministry officials again on the Macao question.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 97 (Dec. 6, 15, 1966). Made public: 2020. Names: Zhou Enlai, Chen Yi, Liao Chengzhi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-06.china-leadership-2
        when: Dec. 6
        date: '1966-12-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, told by people from Shanghai of a large-scale armed clash of masses in Shanghai that left several dead, has Tong Xiaopeng send someone to talk with the Shanghai students and report the record to him.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 97–98 (Dec. 6, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tong Xiaopeng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-07.china-leadership
        when: Dec. 7
        date: '1966-12-07'
        thread: china-leadership
        c: Zhou Enlai receives delegates of the Academy of Sciences' units outside Peking. Sweep away ghosts and monsters but not all cadres; not everyone with a fault or a bad habit is one. Scientists of great contribution are to be protected, and ordinary scientists who are not anti-Party or anti-socialist too. The Academy is to centre on research and join teaching and production; not to be an office, but to join theory and production and take up advanced and guiding work.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 98 (Dec. 7, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-08.china-leadership
        when: Dec. 8
        date: '1966-12-08'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the public security delegates of Peking and from other places. Public security is an organ of dictatorship and must keep its dignity: no one is to storm in at will. He announces that garrison troops will hold the Ministry of Public Security and no one may storm it; its men are to keep discipline, not leave their posts or take leave to make revolution.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 98 (Dec. 8, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-12-09.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 98 (Dec. 9, 1966; Zhou chairs the Politburo liaison meeting at Mao''s on conveying the spirit of the industry-and-transport symposium; on the Cultural Revolution Group''s wish to circulate the Fifteen Articles nationally for open criticism, he says the criticism is not to widen: the regional heads present to speak of it to Standing Committee members at home)'
  - add:
      entry:
        id: cal.1966-12-10.china-leadership
        when: Dec. 10
        date: '1966-12-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai calls a symposium of provincial and municipal heads who attended the industry-and-transport symposium or were "seized" and brought to Peking. Prepare for a rising tide that cannot be stopped, only guided. Form production teams of those who know production. Three rules toward the Red Guards: welcome their criticism; study and accept what is reasonable; keep to principle and sign not everything.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 98 (Dec. 10, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-11.china-leadership
        when: Dec. 11
        date: '1966-12-11'
        thread: china-leadership
        also: [testing, space]
        c: Zhou Enlai chairs the 17th meeting of the Central Special Commission on the artificial satellite. Dongfeng-3 to be built in 1968; Dongfeng-4 may be tried; an intercontinental missile may also be built; all to be settled within these four years.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 11, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-12.china-leadership
        when: Dec. 12
        date: '1966-12-12'
        thread: china-leadership
        c: 'Zhou Enlai talks with delegates of four mass organizations of the Academy of Sciences: no one thought great democracy would come to this; he never dreamed the movement would come so hard; how high the tide will go will be seen only after it comes.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 12, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-13.china-leadership
        when: Dec. 13
        date: '1966-12-13'
        thread: china-leadership
        c: Zhou Enlai talks with delegates of several Red Guard bodies of the Peking Foreign Languages Institute and orders the Institute's "armed work team", which stormed the Foreign Ministry to seize Chen Yi, to leave within three days, or unarmed garrison troops will go to pull them out.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 13, 1966). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-13.china-leadership-2
        when: Dec. 13
        date: '1966-12-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai chairs the Center''s liaison meeting. With rail and ship stopping and posts and telecommunications disturbed everywhere, it drafts a notice of the Center and State Council: no person, body or office is to hinder or stop the running of trains, buses and ships, force a way aboard, or force into the work rooms of post, telecommunications and broadcasting; their staffs must hold their posts. Zhou revises it and sends it to the Cultural Revolution Group with a table of the month''s train-stopping across the country.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 13, 1966, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-12-14.china-leadership
        when: Dec. 14
        date: '1966-12-14'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks twice with delegates of the Chengdu "Workers Rebel Corps". Think of the whole, not the individual; large industry is linked and one link out of joint touches all; over two thousand have left their posts for Peking though he wired them not to come; think of thirty million workers, the farmers, the army; if workers, peasants and soldiers all came it would be a great affair. Keep the two kinds of contradiction apart; do not club to death every committee head and Southwest Bureau leader who erred.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 14, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-12-15.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99–100 (Dec. 13, 15, 1966; Zhou''s letter of the 13th to Mao on the Instruction on the Cultural Revolution in the Villages, proposing to drop the line that other revolutionary mass organizations may also be set up, since the villages have poor and lower-middle peasant associations, committees, militia and Red Guards; Mao agrees; on the 15th the enlarged Politburo meeting under Lin Biao adopts the draft, Lin charging that phasing the revolution in the villages is the same spirit as work groups; issued the same day)'
  - add:
      entry:
        id: cal.1966-12-16.china-leadership-2
        when: Dec. 16
        date: '1966-12-16'
        thread: china-leadership
        c: 'Zhou Enlai tells Liu Jie, through his staff, to stay some days more at Plant 221: besides ensuring the quality of the fifth tests product, he is to look into and work on the plants Cultural Revolution problems.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100 (Dec. 16, 1966). Made public: 2020. Names: Zhou Enlai, Liu Jie.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-17.china-leadership
        when: Dec. 17
        date: '1966-12-17'
        thread: china-leadership
        c: Zhou Enlai calls Tao Zhu, Li Fuchun, Li Xiannian, Yu Qiuli and others on the arrangement of the 1967 national economic plan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100 (Dec. 17, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Li Fuchun, Li Xiannian, Yu Qiuli.'
        tags: [name:zhou-enlai, name:tao-zhu, name:li-fuchun, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-17.china-leadership-2
        when: Dec. 17
        date: '1966-12-17'
        thread: china-leadership
        c: 'Zhou Enlai tells Xinhua: no "black gang" or "black line" in print.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100 (Dec. 17, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-19.china-leadership
        when: Dec. 19
        date: '1966-12-19'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates of the Jiangxi "accusation group" in Peking and asks the factions to unite on the common aim: if production stops, one cannot serve the people.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100 (Dec. 19, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-19.china-leadership-2
        when: Dec. 19
        date: '1966-12-19'
        thread: china-leadership
        c: Zhou Enlai tells Gu Mu that the two hundred liaison men drawn for the Cultural Revolution in mines and enterprises may be drawn and trained first, the time to go down to be fixed later.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100 (Dec. 19, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-19.china-leadership-3
        when: Dec. 19
        date: '1966-12-19'
        thread: china-leadership
        c: 'Zhou Enlai speaks at the collective reception of out-of-town teachers, students and Red Guards. The Cultural Revolution''s speed, breadth and depth were beyond what was foreseen; no one, himself included, was spiritually ready enough. Of the beating and corporal punishment that goes on despite prohibition: it should be punished and such lawlessness struck, or it will become white terror.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100–101 (Dec. 19, 1966, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-12-21.china-leadership-2
        when: Dec. 21
        date: '1966-12-21'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of demobilized and transferred servicemen. Their wish for an independent organization is a matter of principle, unsuitable and needless: go back to your units and grasp revolution and production. Told some doubt the three directives Mao approved, he says there are three, Mao approved them himself, they are not false, and reads them out.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 21, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-21.china-leadership-3
        when: Dec. 21
        date: '1966-12-21'
        thread: china-leadership
        c: 'Zhou Enlai tells Luo Qingchang, head of the Party''s Liaison Department, how to approach the Cultural Revolution: "no self in the heart, active in revolution, seek truth from facts."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 21, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Luo Qingchang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-21.china-leadership-4
        when: Dec. 21
        date: '1966-12-21'
        thread: china-leadership
        c: Zhou Enlai receives staff of Shanghai's Jinjiang Hotel who came to Peking; he first sent word that their occupying the Foreign Ministry was wrong and they must leave it, or he would not see them.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 21, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-22.china-leadership
        when: Dec. 22
        date: '1966-12-22'
        thread: china-leadership
        c: Zhou Enlai receives delegates of the 1965 and 1966 college and technical-school graduates. He does not agree that graduates all go back to their schools to "make revolution" nor that the class of 1965 form an organization cut off from their units.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 22, 1966). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-23.china-leadership
        when: Dec. 23
        date: '1966-12-23'
        thread: china-leadership
        c: Xu Ming, deputy secretary-general of the State Council, dies, wronged, persecuted by Jiang Qing and others.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 23, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing.'
        tags: [name:zhou-enlai, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-24.china-leadership
        when: Dec. 24
        date: '1966-12-24'
        thread: china-leadership
        c: 'Zhou Enlai, told before dawn that Tsinghua Red Guards, backed by the Cultural Revolution Group, will march one or two thousand today and press at Zhongnanhai''s west gate to take Wang Guangmei back to Tsinghua for self-criticism, tells his staff that anyone who comes for her must ask him. He tells Tong Xiaopeng and Wang Dongxing the students are not to storm Zhongnanhai and are to be talked out of seizing Liu Shaoqi and Deng Xiaoping: to seize Wang is to tie her to Liu.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101–102 (Dec. 24, 1966). Made public: 2020. Names: Zhou Enlai, Wang Guangmei, Tong Xiaopeng, Wang Dongxing, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-24.china-leadership-2
        when: Dec. 24
        date: '1966-12-24'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai wires the Southwest Bureau on Red Guards of the Peking Aeronautics Institute and others who went to the Southwest Third Front Construction Commission to seize Peng Dehuai: the Chengdu Military Region to send troops with them to escort Peng to Peking by train, no one to hold or insult him on the way; the Peking garrison to meet him and arrange his lodging.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 24, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Peng Dehuai.'
        tags: [name:zhou-enlai, name:peng-dehuai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-24.china-leadership-3
        when: Dec. 24
        date: '1966-12-24'
        thread: china-leadership
        c: Zhou Enlai talks with He Long. As the rebels of the State Physical Culture and Sports Commission harass He without end, he proposes He stop work and rest.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 24, 1966, the item after). Made public: 2020. Names: Zhou Enlai, He Long.'
        tags: [name:zhou-enlai, name:he-long, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-26.china-leadership-8
        when: Dec. 26
        date: '1966-12-26'
        thread: china-leadership
        c: Zhou Enlai, learning that staff have put He Long at Diaoyutai, where Jiang Qing and Kang Sheng live, has him moved to the New Sixth Institute.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (under Dec. 24, 1966). Made public: 2020. See [[cal.1966-12-24.china-leadership-3]]. Names: Zhou Enlai, He Long, Jiang Qing, Kang Sheng.'
        tags: [name:zhou-enlai, name:he-long, name:jiang-qing, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12.china-leadership-3
        when: Dec., after the 26th
        date: 1966-12
        thread: china-leadership
        c: Zhou Enlai takes He Long and Xue Ming to his own home, the Xihuating.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (under Dec. 24, 1966). Made public: 2020. Names: Zhou Enlai, He Long. Check: the day; the chronology says soon after Dec. 26.'
        tags: [name:zhou-enlai, name:he-long, polity:prc, vis:only:prc]
        at: after 1966-12-26
  - add:
      entry:
        id: cal.1966-12-26.china-leadership-4
        when: Dec. 26
        date: '1966-12-26'
        thread: china-leadership
        also: [china]
        c: 'The *Renmin ribao* prints the editorial "Welcome the High Tide of the Cultural Revolution in Mines and Enterprises": it is not optional but must be done, and done on a great scale; workers have the right to form revolutionary organizations; the working class should welcome revolutionary students to the factories to link up.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 26, 1966). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-12-26.china-leadership-5
        when: Dec. 26
        date: '1966-12-26'
        thread: china-leadership
        c: Zhou Enlai speaks at the collective reception of out-of-town workers' delegates, asking the workers to go home soon and make revolution there.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 26, 1966, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1966-12-26.china-leadership-6
        when: Dec. 26
        date: '1966-12-26'
        thread: china-leadership
        c: 'Zhou Enlai, asked by Wu De what attitude the Peking committee should take to the Dec. 27 meeting of the capital''s colleges to criticize Liu Shaoqi and Deng Xiaoping, writes: it may stay away.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 26, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Wu De, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-26.china-leadership-7
        when: Dec. 26
        date: '1966-12-26'
        thread: china-leadership
        c: 'Zhou Enlai receives Red Guard delegates of Peking''s First and Second Foreign Languages Institutes: to promote linking up and mind policy at once, keep policy and routine business apart; policy may be discussed, specific work not interfered with, for it has some secrecy; not all of diplomacy goes on wall posters.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 26, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-27.china-leadership
        when: Dec. 27
        date: '1966-12-27'
        thread: china-leadership
        c: Zhou Enlai chairs the Center's liaison meeting, Dec. 27 and 28. Jiang Qing and others charge Tao Zhu with being "China's biggest royalist".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 27, 28, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Tao Zhu.'
        tags: [name:zhou-enlai, name:jiang-qing, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-28.china-leadership-2
        when: Dec. 28
        date: '1966-12-28'
        thread: china-leadership
        c: Zhou Enlai chairs the Center's liaison meeting, the second day; Jiang Qing and others charge Tao Zhu with being "China's biggest royalist".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 27, 28, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Tao Zhu.'
        tags: [name:zhou-enlai, name:jiang-qing, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-28.china-leadership-3
        when: Dec. 28
        date: '1966-12-28'
        thread: china-leadership
        c: 'Zhou Enlai has his secretary telephone Deng Zihui: he may plead illness and stay away from today''s criticism meeting of the farm branch.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 28, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Deng Zihui.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-12-29.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 29, 1966; Zhou at Mao''s meeting, where Mao criticizes Jiang Qing for charging Tao Zhu with error of direction and line without discussion by the Center)'
  - add:
      entry:
        id: cal.1966-12-30.china-leadership-2
        when: Dec. 30
        date: '1966-12-30'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the State Economic Commission rebels'' plan to go to Canton, seize Bo Yibo and bring him to Peking, wires Guangdong: the Military Region is to send troops and escort Bo by train on the three rules used for Peng Dehuai.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 30, 1966). Made public: 2020. Names: Zhou Enlai, Bo Yibo, Peng Dehuai.'
        tags: [name:zhou-enlai, name:bo-yibo, name:peng-dehuai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-31.china-leadership-3
        when: Dec. 31
        date: '1966-12-31'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai tells the General Staff's Operations Department that the Canton Military Region is to watch the route of Bo Yibo's escort and prevent accident.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (under Dec. 30, 1966). Made public: 2020. See [[cal.1966-12-30.china-leadership-2]]. Names: Zhou Enlai, Bo Yibo.'
        tags: [name:zhou-enlai, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-31.china-leadership-2
        when: Dec. 31
        date: '1966-12-31'
        thread: china-leadership
        c: 'Zhou Enlai talks with Kuai Dafu and other Tsinghua rebel leaders. Mao does not agree to Wang Guangmei going back to Tsinghua to make self-criticism; give him an outline of the questions and she will answer. To a claim that Liu Shaoqi''s case is one between enemy and us: "I do not see it so; do not impose your view on me." Do not post "Down with Liu Shaoqi" at Tiananmen.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 31, 1966). Made public: 2020. Names: Zhou Enlai, Kuai Dafu, Wang Guangmei, Liu Shaoqi, Mao Zedong.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12.china-leadership
        when: Dec.
        date: 1966-12
        thread: china-leadership
        c: 'Zhou Enlai telephones Peking Hospital himself on the hospital rebels refusal to let Pu Yi be treated in a ward for senior cadres: allow it, and give active treatment and nursing.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 1966). Made public: 2020. Names: Zhou Enlai, Pu Yi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12.china-leadership-2
        when: Dec.
        date: 1966-12
        thread: china-leadership
        c: By Zhou Enlai's desk calendar, from the start of the Red Guard movement to the end of 1966 he received delegates of Red Guards and mass organizations from Peking and all over the country more than 160 times.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 ("下半年", 1966). Made public: 2020. Names: Zhou Enlai. Check: the span; the chronology says the second half of the year, by his desk calendar.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-01.china-leadership-2
        when: Jan. 1
        date: '1967-01-01'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai telephones Chen Pixian in Shanghai before dawn: the Center has decided he is to come out and work; Shanghai must not fall into disorder, and the north–south railway must not be cut.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 1, 1967). Made public: 2020. Names: Zhou Enlai, Chen Pixian.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-01.china-leadership-3
        when: Jan. 1
        date: '1967-01-01'
        thread: china-leadership
        c: 'Zhou Enlai, on Beijing Iron and Steel Institute students hunger strike demanding Lü Dong be dismissed, tells Li Fuchun: persuade the students to stop; the dismissal cannot be forced on the Center; Lü Dong''s case is for the Center to examine and settle.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Lü Dong.'
        tags: [name:zhou-enlai, name:li-fuchun, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-01-01.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 1, 1967; the *Renmin ribao*–*Hongqi* New Year editorial, "Carry the Great Proletarian Cultural Revolution Through to the End", reviewed by Mao: 1967 is to be the year of a general attack on the power-holders on the capitalist road)'
  - add:
      entry:
        id: cal.1967-01-02.china-leadership-2
        when: Jan. 2
        date: '1967-01-02'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, before dawn, calls delegates in Peking of over twenty railway units and tells them the railways must never be paralyzed, not for a moment: a break hurts production, the Cultural Revolution, the Third Five-Year Plan and the people''s livelihood. The national railway rebel liaison station should form a liaison committee quickly to keep the lines open.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 2, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-01-02.china-leadership-3
        when: Jan. 2
        date: '1967-01-02'
        thread: china-leadership
        c: Zhou Enlai chairs the Center's liaison meeting on East China and on the military training of college and middle-school students; Jiang Qing, Zhang Chunqiao, Wang Li and Yao Wenyuan also attend. From now the main members of the Cultural Revolution Group take part in the Center's liaison meetings.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Zhang Chunqiao, Wang Li, Yao Wenyuan.'
        tags: [name:zhou-enlai, name:jiang-qing, name:zhang-chunqiao, name:yao-wenyuan, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-02.china-leadership-4
        when: Jan. 2
        date: '1967-01-02'
        thread: china-leadership
        c: Zhou Enlai tells Liao Chengzhi through his secretary not to attend the criticism meeting of Fang Fang that morning.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liao Chengzhi, Fang Fang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-03.china-leadership
        when: Jan. 3
        date: '1967-01-03'
        thread: china-leadership
        c: 'Zhou Enlai, at the pledge meeting of returned overseas Chinese in Peking for a new victory in the Cultural Revolution of overseas Chinese affairs, says the Red Guards should foster three spirits, the revolutionary, the scientific and organization and discipline: learn the PLA''s discipline, the Three Main Rules and Eight Points, and the "three-eight style".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104–105 (Jan. 3, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-01-03.china-leadership-2
        when: Jan. 3
        date: '1967-01-03'
        thread: china-leadership
        c: Zhou Enlai has his secretary tell Xiao Hua and Liu Zhijian to attend that afternoons meeting of the Cultural Revolution Group and to speak of the Jan. 5 meeting of 35 army academies to criticize the bourgeois reactionary line.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 3, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Xiao Hua, Liu Zhijian.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-03.china-leadership-3
        when: Jan. 3–4
        date: '1967-01-03'
        thread: china-leadership
        c: Zhou Enlai talks three times with rebel delegates of army academies and arts units, to persuade them to cancel the Jan. 5 meeting "to criticize the bourgeois reactionary line", aimed at Ye Jianying and Chen Yi. To aim the criticism of the army's bourgeois reactionary line at the two Vice-Chairmen is a wrong direction; to take Ye and Chen as its representatives is false to fact; the meeting cannot be held. The rebels agree to put it off.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 3, 4, 1967). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Chen Yi.'
        tags: [name:zhou-enlai, name:ye-jianying, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-04.china-leadership-2
        when: Jan. 4
        date: '1967-01-04'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai confers with Tao Zhu on what the Politburo meeting is to settle. Meanwhile Chen Boda, Kang Sheng and Jiang Qing receive the "Corps to Canton to seize Wang Renzhong" of the Central-South Bureau and charge that Tao Zhu is "a faithful executor of the Liu–Deng bourgeois reactionary line", "China's biggest royalist" and "the backstage boss of the Central-South Bureau". Slogans "Down with Tao Zhu" and "Drag out Tao Zhu" appear everywhere.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Chen Boda, Kang Sheng, Jiang Qing, Wang Renzhong.'
        tags: [name:zhou-enlai, name:tao-zhu, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-01-04.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967; Zhou at Mao''s: asked about Jiang Qing''s charge that Tao "suppressed the masses", he reports how Tao received the Canton corps on Dec. 30, 1966: not suppression)'
  - add:
      entry:
        id: cal.1967-01-04.china-leadership-3
        when: Jan. 4
        date: '1967-01-04'
        thread: china-leadership
        c: 'Zhou Enlai has his secretary tell Kuai Dafu to convey Mao''s view to the "Corps to Canton to seize Wang Renzhong": do not bring Wang to Peking; let him make his self-criticism at Wuhan.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Kuai Dafu, Wang Renzhong, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-04.china-leadership-4
        when: Jan. 4
        date: '1967-01-04'
        thread: china-leadership
        c: Zhou Enlai talks with Zhou Rongxin, whom Jiang Qing named in criticism.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin, Jiang Qing.'
        tags: [name:zhou-enlai, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-04.china-leadership-5
        when: Jan. 4
        date: '1967-01-04'
        thread: china-leadership
        c: Zhou Enlai talks with Liu Jiandong, Fu Chongbi and Zheng Weishan on Peking's reception work and on the garrisons custody of cadres "struck down", and asks them for lists.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105–106 (Jan. 4, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liu Jiandong, Fu Chongbi, Zheng Weishan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-05.china-leadership
        when: Jan. 5
        date: '1967-01-05'
        thread: china-leadership
        c: 'Zhou Enlai talks before dawn with Tao Zhu and tells him to stay at home and rest for some days. Then he talks twice with the rebels massed at Zhongnanhai''s west gate to seize Tao, urging them home: Tao''s case is for Mao and the Center to discuss.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (Jan. 5, 7, 23, 1967). Made public: 2020. Names: Zhou Enlai, Tao Zhu.'
        tags: [name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-07.china-leadership-4
        when: Jan. 7
        date: '1967-01-07'
        thread: china-leadership
        c: 'Zhou Enlai, receiving the "Liaison Station to Criticize Tao Zhu": Tao is a Standing Committee member; a meeting to criticize him is not fit while the Standing Committee has not discussed it.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (under Jan. 5, 1967). Made public: 2020. See [[cal.1967-01-05.china-leadership]]. Names: Zhou Enlai, Tao Zhu.'
        tags: [name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-23.china-leadership-3
        when: Jan. 23
        date: '1967-01-23'
        thread: china-leadership
        c: Zhou Enlai, before Jiang Qing and Chen Boda, tells delegates of the capital's students that the Eleventh Plenum elected Tao Zhu and he has no ground to distrust him.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (under Jan. 5, 1967). Made public: 2020. See [[cal.1967-01-05.china-leadership]]. Names: Zhou Enlai, Tao Zhu, Jiang Qing, Chen Boda.'
        tags: [name:zhou-enlai, name:tao-zhu, name:jiang-qing, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-05.china-leadership-2
        when: Jan. 5
        date: '1967-01-05'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks with Chen Yi. On Foreign Ministry rebels "bombardment" of its political department and their demand to dismiss Fu Hao, Xi Yi and Wang Luming and hold a criticism meeting: the Center''s spirit is to dismiss no one lightly, and let those who erred keep on in the movement under test; dismissal harms normal work; the Ministry''s Party committee is to tell the rebels that Zhou and Chen Yi will not attend the meeting.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (Jan. 5, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi, Fu Hao, Wang Luming.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-05.china-leadership-3
        when: Jan. 5
        date: '1967-01-05'
        thread: china-leadership
        c: 'Xinhua asks how to issue its piece on Chen Yi''s reception of a foreign guest. Zhou Enlai: "Vice-Premier Chen has no problem; issue it."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (Jan. 5, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-06.china-leadership-3
        when: Jan. 6
        date: '1967-01-06'
        thread: china-leadership
        also: [china]
        c: Shanghai rebels under Wang Hongwen, planned by Zhang Chunqiao and Yao Wenyuan, seize power from the Shanghai Party committee and municipal people's council. After it a storm of seizing power rises across the country, from the Center's ministries to local Party and government offices and every trade; the anarchism of "overthrow all" floods, and society falls into unprecedented chaos.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (Jan. 6, 1967). Made public: 2020. Names: Zhou Enlai, Wang Hongwen, Zhang Chunqiao, Yao Wenyuan.'
        tags: [name:zhou-enlai, name:zhang-chunqiao, name:yao-wenyuan, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-06.china-leadership-4
        when: Jan. 6
        date: '1967-01-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, told that Tsinghua's "Jinggangshan" Red Guards under Kuai Dafu have tricked Wang Guangmei out of Zhongnanhai, sends his secretary Sun Yue to Tsinghua to get her back and telephones Kuai to release her.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106–107 (Jan. 6, 7, 1967). Made public: 2020. Names: Zhou Enlai, Wang Guangmei, Kuai Dafu, Sun Yue.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-06.china-leadership-5
        when: Jan. 6
        date: '1967-01-06'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on a report that rebels of army academies in Peking and Red Guards of Tsinghua and other colleges have formed a "liaison committee to thoroughly overthrow the anti-Party He Long clique" and plan next day a meeting to criticize and parade He Long: "do not stir it; I will deal with it."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai, He Long.'
        tags: [name:zhou-enlai, name:he-long, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-06.china-leadership-6
        when: Jan. 6–7
        date: '1967-01-06'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks three times by telephone with Jiang Weiqing on the armed clashes of two factions at Nanjing and the stopped traffic, and proposes remedies. He twice receives the Nanjing University Red Guards corps to Peking: transport is the most pressing, Shanghai''s coal is short too; first restore traffic, which worries him most; those who start the fighting between the sides are to be tried at law.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 6, 7, 1967). Made public: 2020. Names: Zhou Enlai, Jiang Weiqing.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-07.china-leadership
        when: Jan. 7
        date: '1967-01-07'
        thread: china-leadership
        c: 'Zhou Enlai talks with both factions of the Peking Institute of Civil Engineering, who plan a joint action to Zhongnanhai to seize Liu Shaoqi: they may send posters but not seize, for the Party''s and states standing.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-07.china-leadership-2
        when: Jan. 7
        date: '1967-01-07'
        thread: china-leadership
        c: 'Jiang Qing writes on a paper to Zhou Enlai: the masses want to struggle against Zhou Rongxin and Tong Xiaopeng, who should come when called.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Zhou Rongxin, Tong Xiaopeng.'
        tags: [name:zhou-enlai, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-09.china-leadership-4
        when: Jan. 9
        date: '1967-01-09'
        thread: china-leadership
        c: 'Zhou Enlai notes to Wang Li on Jiang Qing''s paper: Zhou Rongxin and Tong Xiaopeng must examine themselves deeply, but say "come when criticized", not "come when called", or he cannot find them to work.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (under Jan. 7, 1967). Made public: 2020. See [[cal.1967-01-07.china-leadership-2]]. Names: Zhou Enlai, Jiang Qing, Zhou Rongxin, Tong Xiaopeng, Wang Li.'
        tags: [name:zhou-enlai, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-07.china-leadership-3
        when: Jan. 7–8
        date: '1967-01-07'
        thread: china-leadership
        c: 'Zhou Enlai, till the morning of the 8th, receives the two factions of the Seventh Ministry of Machine Building and warns them to beware of sliding into confusing the two kinds of contradiction. No fighting, and restore normal order; open-door rectification; seize no men, not Tan Zhenlin or Li Fuchun or other vice-premiers, nor Liu Shaoqi and Deng Xiaoping, nor Tao Zhu: "if all those around Chairman Mao are seized, how is the Party Center to be guarded? Liu, Deng and Tao are Standing Committee members and I must still protect them"; hold a work meeting; military training for discipline.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin, Li Fuchun, Liu Shaoqi, Deng Xiaoping, Tao Zhu.'
        tags: [name:zhou-enlai, name:tan-zhenlin, name:li-fuchun, name:liu-shaoqi, name:deng-xiaoping, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-08.china-leadership-2
        when: Jan. 8
        date: '1967-01-08'
        thread: china-leadership
        c: Zhou Enlai, before dawn, told that rebels are storming the gates of Zhongnanhai to seize Liu Shaoqi, Deng Xiaoping, Tao Zhu and other Center leaders, calls them to the Great Hall of the People and urges them not to. The Party Center does not agree; those they want to seize, Tan Zhenlin, Chen Yi, Li Fuchun, Li Xiannian, Yu Qiuli, are on the first line of Party and government, by Mao's side doing real work, and the day's great matters need them.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107–108 (Jan. 8, 1967). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Tao Zhu, Tan Zhenlin, Chen Yi, Li Fuchun, Li Xiannian, Yu Qiuli.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:tao-zhu, name:tan-zhenlin, name:chen-yi, name:li-fuchun, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-08.china-leadership-3
        when: Jan. 8
        date: '1967-01-08'
        thread: china-leadership
        c: Zhou Enlai speaks at the national petroleum system's meeting to criticize the bourgeois reactionary line. Daqing's leadership is paralyzed and the "Iron Man" Wang Jinxi struggled; Wang was right to oppose workers leaving the field. To down Daqing is a plot against the model Mao set up. When rebels shout down with Liu Shaoqi and Deng Xiaoping he turns his back in protest.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 108 (Jan. 8, 1967, the item after). Names: Zhou Enlai, Wang Jinxi, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc]
  - add:
      entry:
        id: cal.1967-01-09.china-leadership
        when: Jan. 9
        date: '1967-01-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, told that Red Guards have moved into He Long''s house to struggle him, talks with He, who lives with him at the Xihuating: "do not go home; I will stand in front." He telephones the house to tell the Red Guards to move out: "if there is anything, tell me." In the evening he receives the Red Guards of the Peking Physical Culture Institute at the Great Hall.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 108 (Jan. 9, 1967). Made public: 2020. Names: Zhou Enlai, He Long.'
        tags: [name:zhou-enlai, name:he-long, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-09.china-leadership-2
        when: Jan. 9
        date: '1967-01-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates of the public security, procuratorial and court systems who came to Peking to link up: the mass bodies formed in these organs are to be independent and not led by outsiders; linking up in designated places; no giving up or hampering the work of dictatorship and the defence of the people, which is their glorious first task.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 108 (Jan. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-09.china-leadership-3
        when: Jan. 9
        date: '1967-01-09'
        thread: china-leadership
        c: 'Zhou Enlai receives the rebel delegates of the foreign affairs system. Told by some to overthrow Chen Yi: "I oppose it; I cannot accept it. How can it be so arbitrary?" Foreign work is an important branch bearing on the states fate; he proposes forming a liaison general station of the foreign affairs system.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 108–109 (Jan. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-10.china-leadership-2
        when: Jan. 10
        date: '1967-01-10'
        thread: china-leadership
        c: 'Zhou Enlai receives the Railways Ministry liaison station and Peking''s train crews: revolution at home is the way to promote production, and going elsewhere only wrecks it. Over 10,000 left Daqing for Peking, and many wells have stopped; "losing production to run after revolution" is false revolution. The railways are to be mobilized from top to bottom to keep transport going; Lü Zhengcao is not to be dragged about but tested in work.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 10, 1967). Made public: 2020. Names: Zhou Enlai, Lü Zhengcao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-10.china-leadership-3
        when: Jan. 10
        date: '1967-01-10'
        thread: china-leadership
        c: 'Zhou Enlai, with Chen Boda, Kang Sheng and Jiang Qing, meets delegates of the Peking "Third Headquarters", the Peking Aeronautics Institute "Red Flag" and other mass organizations: "because of rebelling they do no work; what rebellion is that? I cannot find the man running the railways and must have Li Xiannian grasp it, or do it myself." Since the end of last year he has meant to bring the railway systems delegates into one general liaison station, and it has not been done; Lü Zhengcao is to do it.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Li Xiannian, Lü Zhengcao.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, name:li-xiannian, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-01-11.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 11, 1967; Zhou at the Politburo meeting: on the big-character posters on He Long, Mao says the Politburo and Standing Committee are not to name him in public but have him call to hear criticism; the Red Guards not to seize him; the meeting passes five papers, the Notice against economism and the congratulation to Shanghai''s rebel bodies among them)'
  - check:
      id: cal.1967-01-11.china-leadership-2
      text: 'Check: Zhou''s chronology says Lin Biao presided, at Mao''s proposal; this entry has Zhou presiding.'
  - cite:
      id: cal.1967-01-11.china-leadership-3
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 11, 1967; the Military Commission''s notice reorganizing the All-Army Cultural Revolution Group: Xu Xiangqian head, Jiang Qing adviser, Xiao Hua, Yang Chengwu and others deputies)'
  - add:
      entry:
        id: cal.1967-01-12.china-leadership-2
        when: Jan. 12
        date: '1967-01-12'
        thread: china-leadership
        c: 'Zhou Enlai tells the staff receiving visitors in Peking to tell the Red Guards and masses plainly that leading cadres are not to be seized: seizing stops their work; cadres who erred should be tried in their work and given a chance to correct.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109–110 (Jan. 12, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-12.china-leadership-3
        when: Jan. 12
        date: '1967-01-12'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, after days of talks with Kunming Military Region officers and Kunming rebels about rebels breaking into the Region''s compound, learns that they will withdraw and has a telegram sent in the Center''s and State Council''s name to the Kunming rebels united command, for workers, peasants and students: leave the compound.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 12, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-12.china-leadership-4
        when: Jan. 12
        date: '1967-01-12'
        thread: china-leadership
        c: At Jiang Qing's instigation, rebels of Zhongnanhai storm the homes of Liu Shaoqi, Deng Xiaoping and Tao Zhu, and seize and surround them.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 16, 1967, the item after; "十二日"). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Liu Shaoqi, Deng Xiaoping, Tao Zhu.'
        tags: [name:zhou-enlai, name:jiang-qing, name:liu-shaoqi, name:deng-xiaoping, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-13.china-leadership-2
        when: Jan. 13
        date: '1967-01-13'
        thread: china-leadership
        c: 'Zhou Enlai talks with Chemical Industry Ministry people who seized secret papers of the Defense Ministry: the papers were taken, and he must take it up.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 13, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-13.china-leadership-3
        when: Jan. 13
        date: '1967-01-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai attends the Politburo meeting, which adopts the Several Provisions on Strengthening Public Security Work in the Cultural Revolution (the "six public security articles"), issued the same day: real counter-revolutionaries who kill, burn, cause traffic accidents, storm prisons, steal state secrets or slander Mao and Lin Biao to be punished by law; revolutionary masses and Leftists protected; landlords, rich peasants, bad elements and rightists not to link up or enter revolutionary organizations.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 13, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-01-13.china-leadership-4
        when: Jan. 13
        date: '1967-01-13'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of the 1965 college graduates: those assigned to mines, enterprises and institutions are not to leave their posts for their old schools, nor link up in other factories and villages, but learn from workers and peasants in their units.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-14.china-leadership-2
        when: Jan. 14
        date: '1967-01-14'
        thread: china-leadership
        c: 'Zhou Enlai talks with the regional heads and provincial secretaries: some of our leading cadres cannot keep up, resist in thought, even oppose; a new high tide is starting and they must prepare in spirit and get through this pass.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 14, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-14.china-leadership-3
        when: Jan. 14
        date: '1967-01-14'
        thread: china-leadership
        c: 'Zhou Enlai receives rebels from Anhui and the National Women''s Federation: the Cultural Revolution is spreading to factories and villages; those at production posts should grasp revolution and promote production in their units, organized by system and post. The Center does not approve national organizations; the "National Federation of Transferred, Demobilized, Honored and Disabled Servicemen" is not recognized.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110–111 (Jan. 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-14.china-leadership-4
        when: Jan. 14
        date: '1967-01-14'
        thread: china-leadership
        also: [china]
        c: 'With Zhou Enlai''s support and after a fight by Ye Jianying and other marshals, the Center issues the Notice that the Spearhead of Struggle Must Not Be Pointed at the Army: the army has the task of war preparation and defence, and no one or body may storm the PLA.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 14, 1967, the item after). Made public: 2020. To check: the notice, as issued. Names: Zhou Enlai, Ye Jianying.'
        tags: [name:zhou-enlai, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-15.china-leadership
        when: Jan. 15
        date: '1967-01-15'
        thread: china-leadership
        c: 'Zhou Enlai speaks at the meeting called in Peking by over 150 units to grasp revolution and promote production: each unit, factory and school to rely on itself, organize its strength and do its work well.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 15, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-01-15.china-leadership-2
        when: Jan. 15
        date: '1967-01-15'
        thread: china-leadership
        c: Zhou Enlai, learning that the United Front Work Department's files were seized, has the Public Security Ministry and the Center's General Office, in his and Li Fuchun's name, confer with the rebels who seized them and the masses who guarded them, and seal the files for the time.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 15, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun.'
        tags: [name:zhou-enlai, name:li-fuchun, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-16.china-leadership-2
        when: Jan. 16
        date: '1967-01-16'
        thread: china-leadership
        c: 'Zhou Enlai receives the national petroleum system workers rebel liaison station and delegates of the Peking Petroleum Institute. Seizing power is complicated, and in most units it is not yet prepared; they may seize leadership of the Cultural Revolution, but over production supervise only; they may form a united committee to hold the systems Cultural Revolution. The Daqing red flag must not fall. He tells Kang Shien: production is yours to run, and its tasks must not fail.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 16, 1967). Made public: 2020. Names: Zhou Enlai, Kang Shien.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-01-16.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 16, 1967; Zhou at the Center''s liaison meeting where Mao says it is good that Left masses rise to seize power: take over, run affairs only, not the work)'
  - add:
      entry:
        id: cal.1967-01-16.china-leadership-3
        when: Jan. 16
        date: '1967-01-16'
        thread: china-leadership
        c: 'Zhou Enlai telephones Wang Guangmei: be able to stand the test.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 16, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wang Guangmei.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-17.china-leadership-3
        when: Jan. 17
        date: '1967-01-17'
        thread: china-leadership
        c: Zhou Enlai receives the rebel delegates of the State Science Commission. Some advanced tasks are to be done; their struggle-criticism-reform to follow in three months. Liu Shaoqi and Deng Xiaoping, Standing Committee members, are not named in the press; do not pull them into your meetings, or the leaders will not attend.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 17, 1967). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-18.china-leadership
        when: Jan. 18
        date: '1967-01-18'
        thread: china-leadership
        c: Zhou Enlai, at the forum on the Cultural Revolution of "Left" students and cadres, says that seizing power is to seize the leadership of the Cultural Revolution.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111–112 (Jan. 18, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-18.china-leadership-2
        when: Jan. 18
        date: '1967-01-18'
        thread: china-leadership
        c: Zhou Enlai tells the national finance-and-trade systems meeting that rebel and revolutionary bodies everywhere should organize by industry and system, so as to grasp revolution and promote production; finance and trade, petroleum, industry and transport, railways, foreign affairs, defence industry, politics and law and research are all to form them.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 18, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-01-18.china-leadership-3
        when: Jan. 18
        date: '1967-01-18'
        thread: china-leadership
        c: 'Zhou Enlai receives rebels of the Academy of Sciences who charge that the liaison men he sent are "mud-mixers": look to the main direction, not to want no fault; the liaison men have worked hard and he thinks the estimate unfair.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-18.china-leadership-4
        when: Jan. 18
        date: '1967-01-18'
        thread: china-leadership
        c: 'Zhou Enlai has his secretary tell Liu Jie: do not admit to being anti-Party or anti-socialist.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liu Jie.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-01-19.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 19, 1967; Zhou and Li Fuchun with He Long: Lin Biao says He spread talk that Lin has a bad history and does not propagate Mao Thought; Mao and Zhou protect him; Zhongnanhai is unsafe, Zhu Des chest was even searched; Zhou will find a quiet place and fetch him back in autumn)'
  - add:
      entry:
        id: cal.1967-01-20.china-leadership
        when: Jan. 20
        date: '1967-01-20'
        thread: china-leadership
        c: Zhou Enlai, at dawn, has Yang Dezhong secretly escort He Long and Xue Ming to Xiangbizigou near Xiangshan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 19, 1967, the item after; "次日"). Made public: 2020. Names: Zhou Enlai, He Long, Xue Ming, Yang Dezhong.'
        tags: [name:zhou-enlai, name:he-long, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-18.china-leadership-7
        when: Feb. 18–19
        date: '1967-02-18'
        thread: china-leadership
        c: 'Zhou Enlai twice has his secretary tell the State Physical Culture Commission''s rebels, who clamor to seize He Long, that the Premier does not agree to struggle against him: the Center''s decision.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (under Jan. 20, 1967). Made public: 2020. See [[cal.1967-01-20.china-leadership]]. Names: Zhou Enlai, He Long.'
        tags: [name:zhou-enlai, name:he-long, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-19.china-leadership-3
        when: Jan. 19
        date: '1967-01-19'
        thread: china-leadership
        c: 'Zhou Enlai, seeing Ye Jianying''s report on the enlarged Military Commission meeting of the day (Cultural Revolution Group members attending), and that Jiang Qing and Chen Boda mean to hold a mass meeting of 100,000 that night to struggle against Xiao Hua, telephones Ye: without my order Xiao Hua is not to go to make self-criticism at the meeting.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Xiao Hua, Jiang Qing, Chen Boda.'
        tags: [name:zhou-enlai, name:ye-jianying, name:jiang-qing, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-19.china-leadership-4
        when: Jan. 19
        date: '1967-01-19'
        thread: china-leadership
        c: Zhou Enlai has the Cultural Revolution Group's working office send reporters to learn how the factions stand in seizing the Peking committees power, and how farm and forestry units stand in seizing theirs.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-20.china-leadership-2
        when: Jan. 20–21
        date: '1967-01-20'
        thread: china-leadership
        c: 'Zhou Enlai talks with the Railways Ministry rebels, the night of the 20th into the 21st: the Ministry is to form a Left alliance or the work will be hard to do; the rebels of the country''s railways must unite to grasp revolution and promote production, and try to send over sixty trains a day in the last ten days of the month.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 20, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01.china-leadership
        when: Jan., early
        date: 1967-01
        thread: china-leadership
        c: Zhou Enlai, told that rebels ransacked Chen Yun's home, sends Tong Xiaopeng to stop it and has Yang Dezhong move Chen Yun from the New Sixth Institute to a safe place.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan., early and mid 1967). Made public: 2020. Names: Zhou Enlai, Chen Yun, Tong Xiaopeng, Yang Dezhong.'
        tags: [name:zhou-enlai, name:chen-yun, polity:prc, vis:only:prc]
        at: before 1967-01-01
  - add:
      entry:
        id: cal.1967-01-21.china-leadership-5
        when: Jan. 21
        date: '1967-01-21'
        thread: china-leadership
        c: 'Zhou Enlai receives the rebel delegates of the Second Ministry of Machine Building, telling its vice-ministers that to seize the leadership of the Cultural Revolution in the ministry is in keeping with the Center, but over production and finance only supervision may be exercised. To the rebels: do not seize and drag about leading cadres.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 21, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-21.china-leadership-6
        when: Jan. 21
        date: '1967-01-21'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of the two factions of the Academy of Sciences: the Center''s power is not to be seized.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-01-23.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 21, 23, 1967; Mao to Lin Biao that troops must back the broad Left masses, the earlier "no involvement" being false; the Center, State Council, Military Commission and Cultural Revolution Group issue on the 23rd the decision that the PLA firmly support the revolutionary Left)'
  - add:
      entry:
        id: cal.1967-01-22.china-leadership-3
        when: Jan. 22
        date: '1967-01-22'
        thread: china-leadership
        c: Zhou Enlai tells the meeting of mass delegates from other places in Peking that in takeovers there must be a great alliance, against dispersion, each one for himself and anarchism; seizing power is no self-seeking scramble of individuals or small groups; some units, the army and war-preparation offices among them, cannot take the form of mass seizure.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 22, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-01-22.china-leadership-4
        when: Jan. 22
        date: '1967-01-22'
        thread: china-leadership
        c: 'Zhang Linzhi, minister of coal, is hounded to death by rebels. Zhou Enlai, on hearing, says in grief: "A minister dead and no one knows how; how can I answer to the Party Center?" He has the Public Security Ministry report the autopsy and in later talks with mass delegates often speaks of Zhang''s death: cadres may not be struggled thus, and old cadres are not to be seen with hostility, for they are the Party''s and states treasure.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Zhang Linzhi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-23.china-leadership-2
        when: Jan. 23
        date: '1967-01-23'
        thread: china-leadership
        c: 'Zhou Enlai has his secretary tell Zhou Rongxin''s liaison man: if the Geology Ministry rebels come to seize Zhou Rongxin, answer that he will first make his self-criticism inside the office, and outside after.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113–114 (Jan. 23, 1967). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-24.china-leadership
        when: Jan. 24
        date: '1967-01-24'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of military academies in Peking and from elsewhere: military organs are not to be stormed, posters may be sent; the staff, political, rear services and communications work of every service cannot stop; do not settle contradictions among the people by the means for enemy contradictions.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114 (Jan. 24, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-24.china-leadership-2
        when: Jan. 24
        date: '1967-01-24'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on Anhui and Guizhou control-commission rebels'' wish to seize Qian Ying and take her back to the province for struggle: not now.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114 (Jan. 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Qian Ying.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-25.china-leadership
        when: Jan. 25
        date: '1967-01-25'
        thread: china-leadership
        c: 'Zhou Enlai receives the finance-and-trade rebels: seize only the leadership of the Cultural Revolution and supervise business; do not cast aside all with "head" in their titles; keep some for work to go smoothly; seizing ministers at will without notice is not what is urged. Mu Xin is not to be set down as a counter-revolutionary revisionist; no material shows Ye Jizhuang tied to the "black gang".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114 (Jan. 25, 1967). Made public: 2020. Names: Zhou Enlai, Mu Xin, Ye Jizhuang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-25.china-leadership-2
        when: Jan. 25
        date: '1967-01-25'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai tells Wu Faxian through his secretary to draft at once, in the State Council's and Military Commission's names, an order announcing that the army takes over civil aviation, with all airfields and ports; operations stay with the old leaders.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114 (Jan. 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wu Faxian.'
        tags: [name:zhou-enlai, name:wu-faxian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-26.china-leadership-4
        when: Jan. 26
        date: '1967-01-26'
        thread: china-leadership
        also: [china]
        c: The State Council and the Military Commission order the army to take over civil aviation, with all airfields and ports.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114 (under Jan. 25, 1967). Made public: 2020. See [[cal.1967-01-25.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-25.china-leadership-3
        when: Jan. 25
        date: '1967-01-25'
        thread: china-leadership
        c: Zhou Enlai speaks at the Peking science and technology circles meeting "to smash the bourgeois reactionary lines new counter-attack". Seizing power must be serious, not left to drift, and anarchy is not allowed; see two sides of cadres who erred; "doubt everything, overthrow everything" is anarchism, not Mao Zedong Thought; revolutionary character must join scientific character; that one has made revolution is no license to do as one pleases.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114–115 (Jan. 25, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-01-26.china-leadership-2
        when: Jan. 26
        date: '1967-01-26'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai has his secretary ask the liaison man whether Wang Enmao was taken back last night.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 26, 1967). Made public: 2020. Names: Zhou Enlai, Wang Enmao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-26.china-leadership-3
        when: Jan. 26
        date: '1967-01-26'
        thread: china-leadership
        c: 'Zhou Enlai receives the rebel delegates of the industry-and-transport branches. Seizing power presupposes the Party''s leadership and is first of the Cultural Revolution''s leadership; not every power-holder is bourgeois. Yu Qiuli''s problems are among the people; Mao has said to protect him. When Yu was struggled, Zhou''s liaison man set three rules: two hours at most, no corporal punishment, no seizing him away.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-27.china-leadership-2
        when: Jan. 27
        date: '1967-01-27'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Xinjiang rebels before dawn and warns them: the Cultural Revolution in the Xinjiang Military Region has stopped, by the Center''s decision; they are not to kick aside the regional committee and the Region''s leaders. The same day he criticizes the Tianjin rebels for kidnapping the municipal leaders.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 27, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-27.china-leadership-3
        when: Jan. 27
        date: '1967-01-27'
        thread: china-leadership
        c: Zhou Enlai talks with Li Xiannian on railway problems.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 27, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-28.china-leadership-2
        when: Jan. 28
        date: '1967-01-28'
        thread: china-leadership
        c: Zhou Enlai chairs, before dawn, the meeting of Standing Committee members and the Cultural Revolution Group on the draft of the Military Commission's "eight articles".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 28, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-01-28.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 28, 1967; Zhou at Mao''s in the afternoon, then with Xu Xiangqian, Nie Rongzhen and Ye Jianying revising the "eight articles", striking the sentence "resist Right attack from now, welcome Left attack"; the Military Commission issues the eight orders the same day: firm support for the true proletarian revolutionaries, posts held, the two kinds of contradiction kept apart, no free arrest or house-search, no storming of military leading organs, no linking up, army-level organs to take the Cultural Revolution by stages)'
  - add:
      entry:
        id: cal.1967-01-28.china-leadership-3
        when: Jan. 28
        date: '1967-01-28'
        thread: china-leadership
        c: 'Zhou Enlai receives the railway system rebels and requires the Railways Ministry rebels to form at once a business group: choose it now, keep a duty man, and keep work from breaking off, for he must have someone at every minute on the telephone. Rail transport cannot stop an hour; the whole before the part.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-28.china-leadership-4
        when: Jan. 28
        date: '1967-01-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Zhejiang rebel delegates and tells those who broke into the provincial military district to leave at once. Not all in power take the capitalist road. Five points on seizing power: from below; rebels at the core, uniting the majority; each unit''s own rebels first; the Cultural Revolution''s leadership seized, production supervised; from the top down. Jiang Hua, an old Jinggangshan comrade, is to be protected.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 116 (Jan. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Hua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-28.china-leadership-5
        when: Jan. 28
        date: '1967-01-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the attack of rebels on troops the Heilongjiang Military District sent to Yichun to take over public security, posts and forestry, writes the General Staff: two regiments are to go, with Red Guards to do propaganda; reactionary ringleaders, once exposed or isolated, are to be arrested; if they fire on arrest or hit the PLA, fire back where necessary; ordinarily fire into the air, warn and order arms handed in.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 116 (Jan. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-29.china-leadership
        when: Jan. 29
        date: '1967-01-29'
        thread: china-leadership
        c: 'Zhou Enlai receives, before dawn, the rebels of the Peking Military Region''s Zhanyou Song and Dance Troupe: putting tall hats on people, kneeling, tearing off insignia, parading and house-searching are bad and a slur on the PLA. Hearing that they will no longer sing Xiao Hua''s *Long March Suite* he says: "because a man made a mistake, you will not even sing his songs? Sing it; I will sing it myself. Xiao Hua''s is a contradiction among the people; he was once a little red devil."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 116–117 (Jan. 29, 1967). Made public: 2020. Names: Zhou Enlai, Xiao Hua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-29.china-leadership-2
        when: Jan. 29
        date: '1967-01-29'
        thread: china-leadership
        c: 'Zhou Enlai receives, before dawn, delegates of the Wuhan "Command to Struggle Against Wang Renzhong" who came to Peking: let Tao Zhu stay in Zhongnanhai and struggle against him back to back; the Center does not agree to face-to-face struggle by seizing him.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Wang Renzhong.'
        tags: [name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-29.china-leadership-3
        when: Jan. 29
        date: '1967-01-29'
        thread: china-leadership
        c: 'Zhou Enlai has his secretary tell the head of the Ninth Academy rebels of the Second Ministry of Machine Building that Liu Xiyao may not be held: the Academy of Sciences'' affairs are his to settle.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liu Xiyao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-30.china-leadership-3
        when: Jan. 30
        date: '1967-01-30'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai drafts the decision of the Center, State Council and Military Commission on the recent events in Zhejiang: the masses of the "Zhejiang Revolutionary Rebel United Headquarters" who broke into the provincial military district are quickly and of themselves to leave the compound.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 30, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-30.china-leadership-4
        when: Jan. 30
        date: '1967-01-30'
        thread: china-leadership
        c: Zhou Enlai, told that Gu Mu, just back from inquiring into the Third Front, was kidnapped by Construction Commission rebels, sends a liaison man to the commissions rebels to demand his return to Zhongnanhai, "the Premier wants Gu Mu's report".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-31.china-leadership-3
        when: Jan. 31
        date: '1967-01-31'
        thread: china-leadership
        c: 'Zhou Enlai receives rebels of the North China Bureau: the power of the Bureau''s secretariat is not to be seized; the Bureau is an organ sent out by the Center, and seizing its power is seizing the Center''s. Li Xuefeng is at work on Tianjin and not for now to return to make his self-criticism.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 31, 1967). Made public: 2020. Names: Zhou Enlai, Li Xuefeng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-31.china-leadership-4
        when: Jan. 31
        date: '1967-01-31'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of army academies, arts troupes, hospitals and military factories and explains the "eight orders": the army differs from civilian places and cannot take leave to make revolution as schools do; like factories and transport the army''s work cannot stop; the Cultural Revolution only in spare time; military organs and war-preparation systems not to be stormed; the army must keep firmly steady.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 31, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-31.china-leadership-5
        when: Jan. 31
        date: '1967-01-31'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of staff of organs from all over the country, and criticizes Peking rebels who seize leaders of the Center, the State Council''s ministries and the provincial committees without notice: notice must be given beforehand, or an accident may follow, and no small one but one touching the Party''s, the states and the people''s fate. He warns staff of the Center''s General Office, Guard Bureau, Secretariat and State Council''s Secretariat: "I fear a knife from inside, a stab in the back, when we have no guard."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 31, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-01-31.china-leadership-6
        when: Jan. 31
        date: '1967-01-31'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reviews and revises the telegram of the Center, State Council and Military Commission to the Xinjiang regional committee, the Xinjiang Military Region and the regional "Revolutionary Power-Seizing Command": stop at once all armed clashes among the people; no one and no mass body may storm or seize power in the Region''s leading offices, nor the Region''s armed, cipher and troop units and the Production and Construction Corps.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Jan. 31, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-31.china-leadership-7
        when: Jan. 31
        date: '1967-01-31'
        thread: china-leadership
        c: Zhou Enlai agrees, on Ye Jianying's proposal, to bring Qin Jiwei to Peking for treatment of illness.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Jan. 31, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Qin Jiwei.'
        tags: [name:zhou-enlai, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01.china-leadership-2
        when: Jan.
        date: 1967-01
        thread: china-leadership
        c: By Zhou Enlai's desk calendar, besides central meetings and major events, in January he talked on all kinds of questions with central, local and army leaders 88 times, and received delegates of Red Guards, rebels and masses 114 times.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Jan. 1967, the last item). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-01.china-leadership-2
        when: Feb. 1
        date: '1967-02-01'
        thread: china-leadership
        c: 'Zhou Enlai tells the army reception staff brought in: the key problem in seizing power, which the *Hongqi* editorial does not mention, is to seize the "self" in each of our own thoughts and rid it of selfish ideas. Support the youngs warmth and courage and help them in good faith; to see them err and not say so would be our crime.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Feb. 1, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-01.china-leadership-3
        when: Feb. 1
        date: '1967-02-01'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the Railways Ministry rebels and rebukes them: "why can you not unite?" If it goes on he will put the Ministry under military control; he has held seven meetings large and small with them on the main artery not stopping for a moment. Think whether one unit or the whole country is more important, one man or 700 million; seize "self" in your heads. Not all old cadres are to be struck down in a lump.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Feb. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-01.china-leadership-4
        when: Feb. 1
        date: '1967-02-01'
        thread: china-leadership
        c: 'Zhou Enlai receives the industry-and-transport rebels and criticizes the tall hats and parading as disguised corporal punishment. Not every minister and head of province or city is a power-holder on the capitalist road; if all provinces and cities were "black line", where was Mao''s "red line" of these years? Gu Mu is not "black gang", he has work at the State Council; do not drag him about. On Daqing, now much confused, with attacks on Yu Qiuli and the Iron Man Wang Jinxi: "I am very worried and wish I could fly there."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119 (Feb. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu, Yu Qiuli, Wang Jinxi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-02.china-leadership-2
        when: Feb. 2
        date: '1967-02-02'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai convenes the vice-premiers' office meeting on the draft notice of the Center and State Council on revolutionary teachers and students linking up on foot, and sends it after to the Cultural Revolution Group and Mao.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119 (Feb. 2, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-02-03.china-leadership-2
        when: Feb. 3
        date: '1967-02-03'
        thread: china-leadership
        also: [china]
        c: 'The Center and the State Council issue the notice on linking up on foot: long-distance marches stop for now; those out return, in principle on foot, paying their own city fares and meals; from Feb. 8 board in Peking is no longer free.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119 (under Feb. 2, 1967). Made public: 2020. See [[cal.1967-02-02.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1967-02-02.china-leadership-3
        when: Feb. 2
        date: '1967-02-02'
        thread: china-leadership
        c: 'Zhou Enlai writes Chen Boda, Jiang Qing and the Cultural Revolution Group proposing two series of meetings: Monday, Wednesday and Friday at 10 p.m. at Diaoyutai, on the Cultural Revolution, he attending; Tuesday, Thursday and Saturday at 3:30 p.m. at the Huairen Hall or the State Council, four Standing Committee members with the vice-premiers and Ye Jianying, on Party and government business, a Group member to come.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119 (Feb. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Jiang Qing, Ye Jianying.'
        tags: [name:zhou-enlai, name:chen-boda, name:jiang-qing, name:chen-yi, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-04.china-leadership-2
        when: Feb. 4
        date: '1967-02-04'
        thread: china-leadership
        c: 'Mao writes on Zhou Enlai''s letter of Feb. 2 proposing two series of liaison meetings: "This paper is not used; return to Zhou."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119 (under Feb. 2, 1967). Made public: 2020. See [[cal.1967-02-02.china-leadership-3]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-02.china-leadership-4
        when: Feb. 2
        date: '1967-02-02'
        thread: china-leadership
        c: Zhou Enlai, after long exhaustion, feels unwell and the doctors find heart disease; he tells his secretary to keep it quiet.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119–120 (Feb. 2–4, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-03.china-leadership-3
        when: Feb. 3
        date: '1967-02-03'
        thread: china-leadership
        c: Zhou Enlai's staff, worried by his health, write a big-character poster on his office door asking him to change his way of work and rest; Chen Yi, Nie Rongzhen, Li Xiannian, Ye Jianying and others sign it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119–120 (under Feb. 2, 1967). Made public: 2020. See [[cal.1967-02-02.china-leadership-4]]. Names: Zhou Enlai, Chen Yi, Nie Rongzhen, Li Xiannian, Ye Jianying.'
        tags: [name:zhou-enlai, name:chen-yi, name:nie-rongzhen, name:li-xiannian, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-04.china-leadership-3
        when: Feb. 4
        date: '1967-02-04'
        thread: china-leadership
        c: 'Zhou Enlai writes on his staff''s poster "Accept sincerely; see in practice"; Deng Yingchao adds five proposals: less night work, gaps between meetings, room in each day''s schedule, rest on return, shorter meetings.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119–120 (under Feb. 2, 1967). Made public: 2020. See [[cal.1967-02-02.china-leadership-4]]. Names: Zhou Enlai, Deng Yingchao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-02-03.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 3, 1967; Zhou with Mao at the meeting with Hysni Kapo and Beqir Balluku of Albania)'
  - add:
      entry:
        id: cal.1967-02-04.china-leadership
        when: Feb. 4
        date: '1967-02-04'
        thread: china-leadership
        c: Zhou Enlai sends to find the cause of the death of Zhao Erlu, who died after repeated struggle meetings, and presses for the autopsy findings.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 4, 6, 1967). Made public: 2020. Names: Zhou Enlai, Zhao Erlu.'
        tags: [name:zhou-enlai, name:zhao-erlu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-06.china-leadership-6
        when: Feb. 6
        date: '1967-02-06'
        thread: china-leadership
        c: Zhou Enlai attends the memorial meeting for Zhao Erlu and Yang Zhicheng.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (under Feb. 4, 1967). Made public: 2020. See [[cal.1967-02-04.china-leadership]]. Names: Zhou Enlai, Zhao Erlu, Yang Zhicheng.'
        tags: [name:zhou-enlai, name:zhao-erlu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-05.china-leadership
        when: Feb. 5
        date: '1967-02-05'
        thread: china-leadership
        c: Zhou Enlai, told that people are making trouble at the Military Commission office at Sanzuomen, aimed at Xu Xiangqian, has Nie Rongzhen, Ye Jianying, Yang Chengwu, Xiao Hua and Fu Chongbi find out what lies behind it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 5, 1967). Made public: 2020. Names: Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Yang Chengwu, Xiao Hua, Fu Chongbi.'
        tags: [name:zhou-enlai, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-06.china-leadership-3
        when: Feb. 6
        date: '1967-02-06'
        thread: china-leadership
        c: 'Zhou Enlai writes Mao: some urgent questions, the takeover of the Tianjin and Peking public security bureaus and the seizure of power in some central departments and provinces, need his instruction; he proposes Mao see the four Standing Committee men, Chen Yi, Ye Jianying, Xie Fuzhi and Jiang Qing that afternoon. In the afternoon he goes to Mao''s.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 6, 1967). Made public: 2020. See [[cal.1967-02-06.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Chen Yi, Ye Jianying, Xie Fuzhi, Jiang Qing.'
        tags: [name:zhou-enlai, name:mao-zedong, name:chen-yi, name:ye-jianying, name:xie-fuzhi, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-06.china-leadership-4
        when: Feb. 6
        date: '1967-02-06'
        thread: china-leadership
        c: Zhou Enlai calls Nie Rongzhen, Chen Yi, Xu Xiangqian, Ye Jianying, Xiao Hua and Yang Chengwu on the army question.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen, Chen Yi, Xu Xiangqian, Ye Jianying, Xiao Hua, Yang Chengwu.'
        tags: [name:zhou-enlai, name:nie-rongzhen, name:chen-yi, name:xu-xiangqian, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-06.china-leadership-5
        when: Feb. 6
        date: '1967-02-06'
        thread: china-leadership
        c: Zhou Enlai tells Li Xiannian through his secretary that the Finance Ministry's business power cannot be seized.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-02-07.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120–121 (Feb. 7, 1967; Zhou reviews and revises the Foreign Affairs Office draft instruction on the Cultural Revolution in embassies and consulates, stressing that fighting groups already formed become study groups under the Party committee, with a right to criticize and suggest, none to supervise, and none to meddle directly with the committees authority)'
  - add:
      entry:
        id: cal.1967-02-07.china-leadership-4
        when: Feb. 7–8
        date: '1967-02-07'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Nie Rongzhen, Ye Jianying, Xu Xiangqian and the Xinjiang regional leaders on Xinjiang; judging the conditions for seizing power in the Region not ripe, he proposes military control of the Region and the Production and Construction Corps to push forward the "three-in-one".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121 (Feb. 7, 8, 1967). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen, Ye Jianying, Xu Xiangqian.'
        tags: [name:zhou-enlai, name:nie-rongzhen, name:ye-jianying, name:xu-xiangqian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-08.china-leadership-2
        when: Feb. 8
        date: '1967-02-08'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai twice, with Ye Jianying, Nie Rongzhen, Xu Xiangqian and Xiao Hua, talks with Zhang Guohua and Chen Mingyi on Tibet. The rebels hold the regional Party committees and people''s councils power but work is paralyzed: keep the Military Commission''s eight orders, guard the Region''s command and the arsenals absolutely, and allow no rebels to storm in and seize power or arms.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121 (Feb. 8, 1967). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Nie Rongzhen, Xu Xiangqian, Xiao Hua, Zhang Guohua, Chen Mingyi.'
        tags: [name:zhou-enlai, name:ye-jianying, name:nie-rongzhen, name:xu-xiangqian, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-02-08.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121 (Feb. 8, 1967; Zhou''s letter to Mao and Lin Biao reporting Xinjiang, Tibet, Shandong, Jiangsu, Hunan, Shaanxi, Zhejiang, Yunnan and Guangxi, and proposing to bring Ye Fei, Tan Qilong, Jiang Weiqing, Yang Shangkui, Liu Junxiu and Jiang Hua to Peking to rest, and military control of Peking and Tianjin, beginning with the public security bureaus)'
  - add:
      entry:
        id: cal.1967-02-09.china-leadership-2
        when: Feb. 9
        date: '1967-02-09'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai chairs the Center's liaison meeting, which adopts the notice, to be issued by the Public Security Ministry and the Peking garrison, that the garrison's headquarters takes over the Peking Public Security Bureau, sets up a military control committee and puts all its subordinate organs under military control.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121–122 (Feb. 9, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-02-11.china-leadership-6
        when: Feb. 11
        date: '1967-02-11'
        thread: china-leadership
        also: [china]
        c: The Public Security Ministry and the Peking garrison issue, with Mao's approval, the notice putting the Peking Public Security Bureau under the garrison's military control.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121–122 (under Feb. 9, 1967). Made public: 2020. See [[cal.1967-02-09.china-leadership-2]]. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1967-02-09.china-leadership-3
        when: Feb. 9
        date: '1967-02-09'
        thread: china-leadership
        c: Zhou Enlai tells Wu Faxian and Zou Renong through his secretary to put the Peking and Shanghai civil aviation administrations and airports under military control as fast as possible.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wu Faxian.'
        tags: [name:zhou-enlai, name:wu-faxian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-09.china-leadership-4
        when: Feb. 9
        date: '1967-02-09'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai has Fu Chongbi and Huang Zuozhen meet the delegates of the Tongxian armory technical school and the "Workers Red Rebel Headquarters", and order both sides to stop the armed fight, leave the scene and return the guns.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Fu Chongbi, Huang Zuozhen.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-09.china-leadership-5
        when: Feb. 9
        date: '1967-02-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on whether the Zhejiang Military District should join the criticism of Jiang Hua called by the "Zhejiang Revolutionary Rebel United Command": it may attend but not speak or take a stand.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Hua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-10.china-leadership-2
        when: Feb. 10
        date: '1967-02-10'
        thread: china-leadership
        c: 'Zhou Enlai, after the meeting at Mao''s, calls the liaison meeting of Center Party, government and army heads and Cultural Revolution Group members, which adopts the Military Commission''s Several Provisions on the Cultural Revolution in Organs above Army Level: the "four bigs" by stages, under the Party committees; none in units below army level; no seizing of power from below, no storming of military leading organs, no fighting groups in them. He sends it to Mao and Lin Biao.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 10, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
        tags: [name:zhou-enlai, name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-11.china-leadership-2
        when: Feb. 11
        date: '1967-02-11'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Xian delegates from eight units. Wang Renzhong is gravely ill and Mao told him to bring Wang back to rest; for ten days he could not find him, and had to order the military region to find him by a time; only today was Wang handed over: "anarchism and liberalism have flooded to the edge."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122–123 (Feb. 11, 1967). Made public: 2020. Names: Zhou Enlai, Wang Renzhong, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-11.china-leadership-3
        when: Feb. 11
        date: '1967-02-11'
        thread: china-leadership
        c: 'Zhou Enlai chairs the Center''s liaison meeting at Huairen Hall. Ye Jianying and Xu Xiangqian and others confront face to face the Cultural Revolution Group''s throwing the Party and the army into confusion. Ye to Chen Boda: "you have thrown the Party into confusion, the government, the factories and villages, and still not enough, you must throw the army too; what do you want? Can there be revolution without the Party''s leadership? Without the army?" Xu, thumping the table: the army is the pillar of the dictatorship of the proletariat; shall men like Kuai Dafu command it?'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Xu Xiangqian, Chen Boda, Kuai Dafu.'
        tags: [name:zhou-enlai, name:ye-jianying, name:xu-xiangqian, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-11.china-leadership-4
        when: Feb. 11
        date: '1967-02-11'
        thread: china-leadership
        also: [china]
        c: 'Du Ping, political commissar of the Nanjing Military Region, as the Center''s representative at the Zhejiang Military District, meets Chen Liyun, Nan Ping, Ruan Xianbang and rebel delegates and conveys Zhou Enlai''s instruction: the Center sends a special plane the evening of the 11th to take Jiang Hua to Peking, and he must be taken safely to Jiaxing airfield.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Du Ping, Jiang Hua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-11.china-leadership-5
        when: Feb. 11
        date: '1967-02-11'
        thread: china-leadership
        c: 'Zhou Enlai receives the rebel delegates of the Agriculture, State Farms and Land Reclamation and Aquatic Products ministries, the Meteorological Bureau and the Farm Office, which have seized power: fire the first shot of spring plowing; farming is seasonal and lost once the season is gone; each unit to study its production team well; the farm branch to prepare an appeal to the whole country to grasp revolution and promote production.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-13.china-leadership
        when: Feb. 13
        date: '1967-02-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates of the Harbin "Red Rebels United Headquarters": to throw Daqing into disorder is very dangerous; it is so important that the army must take it over. The Northeast''s farming has not passed, coal output is down, transport has trouble; help part of the cadres of the provincial committee to stand forth and grasp production.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 13, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-14.china-leadership-2
        when: Feb. 14
        date: '1967-02-14'
        thread: china-leadership
        c: Zhou Enlai chairs the Center's liaison meeting on seizing power in the Peking municipality and the Center's ministries and commissions.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 14, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-02-15.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 15, 1967; Zhou with Mao receiving the Mauritanian delegation)'
  - cite:
      id: cal.1967-02-16.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 16, 1967; Zhou chairs at Huairen Hall; the meeting was to take up grasping revolution and promoting production in the State Council''s branches; Tan Zhenlin, Chen Yi, Ye Jianying, Li Xiannian and Yu Qiuli lose their temper at the Cultural Revolution Group''s Jiang Qing, Chen Boda and Kang Sheng for confusing Party and army and persecuting old cadres; Tan to Zhang Chunqiao: "you want to knock the old cadres down one by one; I will fight to the end, though they cut off my head, jail me and expel me from the Party"; Tan starts to leave and Zhou calls him back; Zhou asks Chen Boda why the *Hongqi* editorial of issue 13 was not shown to the Standing Committee)'
  - add:
      entry:
        id: cal.1967-02-16.china-leadership-3
        when: Feb. 16
        date: '1967-02-16'
        thread: china-leadership
        c: 'Zhang Chunqiao, Yao Wenyuan and Wang Li with Jiang Qing, after the Huairen Hall meeting, draw up a "record" and report to Mao, Zhang adding that Zhou has objected to the *Hongqi* editorial of issue 13 not being sent to him for review. Mao: the Party constitution does not require that editorials go through the Standing Committee. He tells Zhang to talk with Zhou: the Cultural Revolution Group is to be treated as a secretariat, and major Party and state questions put first to it for discussion.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 16, 1967, the item after). Made public: 2020. See [[cal.1967-02-16.china-leadership]]. Names: Zhou Enlai, Zhang Chunqiao, Yao Wenyuan, Wang Li, Jiang Qing, Mao Zedong.'
        tags: [name:zhou-enlai, name:zhang-chunqiao, name:yao-wenyuan, name:jiang-qing, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-16.china-leadership-4
        when: Feb. 16
        date: '1967-02-16'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, in the evening, receives the Inner Mongolia regional committees and military regions' heads and the Inner Mongolia rebel delegates, and stresses that the army must stay steady; to storm the army is "not thinking of the nation's whole interest"; the military region may not be stormed, nor the military factories, and the army does not seize power; trust and cherish the PLA.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 16, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-17.china-leadership
        when: Feb. 17
        date: '1967-02-17'
        thread: china-leadership
        c: Zhou Enlai, before dawn, receives the finance-and-trade rebels and orders on the spot the arrest of Du Xiangguang, who seized the Finance Ministry's business power. Finance power cannot be seized; seizures the Center has not recognized do not count. The Finance and Commerce ministries' Party groups are restored under Li Xiannian, Wu Bo and Yao Yilin. Parading leaders in tall hats is "cruel struggle, merciless blows".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 125 (Feb. 17, 1967). Made public: 2020. Names: Zhou Enlai, Du Xiangguang, Li Xiannian, Wu Bo, Yao Yilin.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-17.china-leadership-2
        when: Feb. 17
        date: '1967-02-17'
        thread: china-leadership
        c: 'Tan Zhenlin writes Lin Biao, going on against Jiang Qing and others: "the Premier has been worked over enough; he is broad-minded and can endure; wait and see."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 125 (Feb. 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin, Lin Biao, Jiang Qing.'
        tags: [name:zhou-enlai, name:tan-zhenlin, name:lin-biao, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-18.china-leadership-2
        when: Feb. 18
        date: '1967-02-18'
        thread: china-leadership
        c: 'Zhou Enlai, before dawn, receives the finance-and-trade bureau chiefs and above: power seizure has gone off; correct it. Seize only the leadership of the Cultural Revolution; the Center''s power and the Party''s leadership, and the governments finance, public security, foreign affairs and defence powers, are not to be seized; the rebels may supervise business, not go past it; no supervision of finance in full. Cadres who erred are not to be given "cruel struggle, merciless blows", nor endless struggle.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 125 (Feb. 18, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-02-18.china-leadership-3
        when: Feb. 18
        date: '1967-02-18'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, in talk of the army, says the Military Commission''s emergency instruction of Oct. 5 had a mobilizing effect and a side effect: of late the storming of military organs is very fierce.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 125 (Feb. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-18.china-leadership-4
        when: Feb. 18
        date: '1967-02-18'
        thread: china-leadership
        c: Zhou Enlai chairs the liaison meeting at Huairen Hall.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-18.china-leadership-5
        when: Feb. 18
        date: '1967-02-18'
        thread: china-leadership
        c: 'Zhou Enlai receives rebel delegates of the defence-industry branch and, told that the Second Ministry''s rebels seized its Party committee''s leadership, says: "you have no limit." Rebels may seize only the Cultural Revolution''s leadership and supervise business; finance, foreign affairs, defence, defence industry and propaganda belong to the Center. Beating, boards and parading are "cruel struggle, merciless blows".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-02-18.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967; Zhou reads the draft *Hongqi* editorial "Cadres Must Be Treated Rightly", which holds the great majority of cadres good and calls refusal of class analysis of power-holders, and doubt and overthrow of all, an anarchist trend; he notes that it is very important and timely and proposes it be discussed at the Party-government-army-Group liaison meeting before it appears; Mao agrees and asks the three-in-one be written in; printed Mar. 1)'
  - add:
      entry:
        id: cal.1967-02-18.china-leadership-6
        when: Feb. 18
        date: '1967-02-18'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai has his secretary telephone the Jiangxi committee: the Jiangxi rebels are to take Yang Shangkui and Liu Junxiu safely to Peking by Feb. 20.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 127 (Feb. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yang Shangkui, Liu Junxiu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-02-19.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 127 (Feb. 19, 1967; Zhou at the Politburo meeting; Zhou also makes self-criticism at the "life meetings" of Feb. 25 to Mar. 18; the Politburo stops meeting and the Cultural Revolution Group in effect takes its place; the liaison meeting Zhou led, with the vice-premiers and others, is replaced by the Cultural Revolution Group''s, which Wu Faxian and others join)'
  - add:
      entry:
        id: cal.1967-02-19.china-leadership-6
        when: Feb. 19
        date: '1967-02-19'
        thread: china-leadership
        c: Zhou Enlai, told that the "West Suburb Preparatory Office to Struggle against the Peng, Lu, Luo and Yang Counter-revolutionary Revisionist Clique" of Peking University and Tsinghua rebels will hold criticism meetings on Feb. 26 and 27 and will "seize above and sweep below", parading twenty-six, Peng Zhen and Lu Dingyi among them, asks Chen Boda, Kang Sheng and Jiang Qing whether "sweeping below" is fit and whether dragging out so many helps the criticism.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 127 (Feb. 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Peng Zhen, Lu Dingyi, Chen Boda, Kang Sheng, Jiang Qing.'
        tags: [name:zhou-enlai, name:peng-zhen, name:lu-dingyi, name:luo-ruiqing, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-20.china-leadership
        when: Feb. 20
        date: '1967-02-20'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai tells the briefing on power seizure in Shanxi that there is a chain reaction: since January the rebels seize whether or not a department has a power-holder on the capitalist road. Not all the Center''s ministers are such; the Center''s Party, finance, foreign and cultural powers cannot be seized; military power is the Center''s, and to seize a military region''s is "a mistake of the whole direction". Farming presses.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128 (Feb. 20, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - cite:
      id: cal.1967-02-19.china-leadership-5
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128 (Feb. 20, 1967; Zhou reviews the Center''s Letter to the Poor and Lower-Middle Peasants and Cadres of the People''s Communes: most commune cadres good; those who erred to make good in spring plowing; he proposes at once a three-level cadre meeting of commune, brigade and team to arrange spring work; he sends it to Wang Dongxing for Mao, who writes "do as proposed")'
  - add:
      entry:
        id: cal.1967-02-21.china-leadership-2
        when: Feb. 21
        date: '1967-02-21'
        thread: china-leadership
        c: Zhou Enlai, after going to Mao's, talks with Chen Yi and Tan Zhenlin.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128 (Feb. 21, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi, Tan Zhenlin, Mao Zedong.'
        tags: [name:zhou-enlai, name:chen-yi, name:tan-zhenlin, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-22.china-leadership
        when: Feb. 22
        date: '1967-02-22'
        thread: china-leadership
        c: Zhou Enlai talks before dawn with Chen Boda, Jiang Qing, Kang Sheng, Wang Li and Guan Feng.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128 (Feb. 22, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda, Jiang Qing, Kang Sheng, Wang Li, Guan Feng.'
        tags: [name:zhou-enlai, name:chen-boda, name:jiang-qing, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-22.china-leadership-2
        when: Feb. 22
        date: '1967-02-22'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reviews and revises the Center''s Notice on the supplementary explanation of the Military Commission''s eight orders: all but the seventh apply to the localities. Those linking up elsewhere to return at once; military organs and the war-preparation and cipher systems not to be stormed; the Party Center''s organs, key ministries and commissions, the banks, the main papers, Xinhua and the Broadcasting Bureau not to be taken over by outsiders. Mao approves.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128–129 (Feb. 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-23.china-leadership
        when: Feb. 23
        date: '1967-02-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks with the heads of the large military regions: provinces, prefectures and counties are to be put into action, with the military departments foremost, and form production offices at each level to lead spring plowing, quickly. The regions'' commanders take charge and draw in the provincial and prefectural cadres; leaders who have not passed their test may come out and work first.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129 (Feb. 23, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-23.china-leadership-2
        when: Feb. 23
        date: '1967-02-23'
        thread: china-leadership
        also: [china]
        c: The Military Commission issues its instruction on the army's help to the localities in spring production.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129 (under Feb. 23, 1967). Made public: 2020. See [[cal.1967-02-23.china-leadership]]. Names: Zhou Enlai.'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-27.china-leadership
        when: Feb. 27
        date: '1967-02-27'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai attends the Cultural Revolution Group''s liaison meeting on Guangdong, then writes Mao: the Guangdong committees principal men were wrong to "yield power" to the rebels; the situation will not bear long delay; he proposes military control at once and a three-in-one revolutionary committee to be prepared, and the same for Yunnan, much like Guangdong. Mao: "Agreed."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129 (Feb. 27, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02-28.china-leadership-2
        when: Feb. 28
        date: '1967-02-28'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with the leaders of the Guangdong committee and the Canton Military Region and announces that the Canton Military Region and the Guangdong Military District will form a military control over the province, in two teams, one for the Cultural Revolution and one for business. The same day he talks with Yunnan officials and rebels on military control of Yunnan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129 (Feb. 28, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-02.china-leadership
        when: Feb.
        date: 1967-02
        thread: china-leadership
        c: By Zhou Enlai's desk calendar, in February he talked on all kinds of questions with central, local and army leaders 43 times, and received delegates of mass organizations 27 times.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129 (Feb. 1967, the last item). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-01.china-leadership
        when: Mar. 1
        date: '1967-03-01'
        thread: china-leadership
        c: 'Zhou Enlai convenes the ministers of the industry-and-transport branches and rebel delegates and hears each ministry on its business. Mao agrees that supervision of business is best. To the rebels: no more random seizing and struggling of cadres; the wind of beating, smashing, looting, house-searching and seizing must stop; not every wrong word is "anti-Party". The ministries to restore normal order and their cadres to work.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129–130 (Mar. 1, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-03-01.china-leadership-2
        when: Mar. 1
        date: '1967-03-01'
        thread: china-leadership
        also: [china]
        c: The *Hongqi* prints the editorial "Cadres Must Be Treated Rightly".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967). See [[cal.1967-02-18.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-03-02.china-leadership
        when: Mar. 2
        date: '1967-03-02'
        thread: china-leadership
        c: Zhou Enlai talks with Yang Dezhong on military control of the Peking Hotel.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 2, 1967). Made public: 2020. Names: Zhou Enlai, Yang Dezhong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-02.china-leadership-2
        when: Mar. 2
        date: '1967-03-02'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates of the "Xian Workers'' Rebel Command" and Xian Jiaotong students: rebel bodies to rectify against headline-chasing and anarchism; the Xian slogan "hit, harden, grab" is reactionary; no "great alliance, great seizure", no more marches or loudspeaker trucks; respect for the PLA marks true revolution; give leaders a chance to examine themselves; alliances by system, not across trades.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-02.china-leadership-3
        when: Mar. 2
        date: '1967-03-02'
        thread: china-leadership
        c: Zhou Enlai talks with Yu Qiuli, Song Renqiong, Chen Xilian and Kang Shien on the Daqing oilfield.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yu Qiuli, Song Renqiong, Chen Xilian, Kang Shien.'
        tags: [name:zhou-enlai, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-03.china-leadership-2
        when: Mar. 3
        date: '1967-03-03'
        thread: china-leadership
        c: 'Zhou Enlai attends and speaks at the meeting for Xiao Hua''s self-criticism: Xiao''s mistakes were not done knowingly, from lack of experience; he is a "little red devil", whose history is glorious; do not use a magnifying glass on a mans error of the moment, look at his whole history. House-searching Xiao Hua''s home is a "witch wind".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 3, 1967). Made public: 2020. Names: Zhou Enlai, Xiao Hua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-06.china-leadership
        when: Mar. 6
        date: '1967-03-06'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates of mass organizations from Zhejiang: the root remedy is rectification, not wrangling; study Mao''s works and the Center''s documents well.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 6, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-08.china-leadership
        when: Mar. 8
        date: '1967-03-08'
        thread: china-leadership
        c: 'Zhou Enlai has the original report from a corps of the Peking Military Region on the Yanan Middle School of Tianjin and Mao''s note of the 7th printed for the members of the liaison meeting and the delegates to the meeting of army-level cadres, and has a covering note drawn up for the Center to forward to the whole country. Mao''s note: the paper may go to the country for reference, and the army should give military training by stages to colleges, middle schools and upper primary classes; do not shut out erring teachers and cadres from it.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 7, 1967; "次日"). Made public: 2020. See [[cal.1967-03-07.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-07.china-leadership-4
        when: Mar. 7
        date: '1967-03-07'
        thread: china-leadership
        c: 'Zhou Enlai, on the spread of meningitis in Anhui, Jiangsu, Zhejiang, Shanghai, Jiangxi and Fujian, writes Li Fuchun and Li Xiannian: at once see Sun Zheng, Qian Xinzhong, Cui Yitian and Huang Shuze of the Health Ministry and the three rebel bodies ("Red Rebel Corps", "Revolutionary Rebel United Headquarters", "East Is Red Commune"); best to set up a meningitis prevention office of Qian, Cui and one man from each, to begin work at once, undisturbed by other work.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Qian Xinzhong, Cui Yitian, Huang Shuze, Sun Zheng.'
        tags: [name:zhou-enlai, name:li-fuchun, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-07.china-leadership-5
        when: Mar. 7
        date: '1967-03-07'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Li Xuefeng, Zheng Weishan, Chen Boda, Kang Sheng, Li Fuchun and Xie Fuzhi on Tianjin.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Xuefeng, Zheng Weishan, Chen Boda, Kang Sheng, Li Fuchun, Xie Fuzhi.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:li-fuchun, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-08.china-leadership-2
        when: Mar. 8
        date: '1967-03-08'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai has his secretary tell Zhang Chunqiao: Mar. 12 is the 42nd anniversary of Sun Yat-sen''s death; Shanghai is to mark it as in other years, and its Party and government heads are to lay a wreath at his former residence.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 8, 1967). Made public: 2020. Names: Zhou Enlai, Zhang Chunqiao, Sun Yat-sen.'
        tags: [name:zhou-enlai, name:zhang-chunqiao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-10.china-leadership-3
        when: Mar. 10
        date: '1967-03-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai revises the draft Center telegram, in reply to the Nanjing Military Region, the Jiangsu Military District, Zhang Chunqiao and Yao Wenyuan, on Jiangsu: as the mass bodies there cannot soon unite and the conditions for the three-in-one are not ripe, the Center decides that the Nanjing Military Region and the Jiangsu Military District set up a military control committee, in two teams, one to grasp revolution and one to run production, including industry, farming, finance and trade.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 10, 1967). Made public: 2020. See [[cal.1967-03-10.china-leadership]]. Names: Zhou Enlai, Zhang Chunqiao, Yao Wenyuan.'
        tags: [name:zhou-enlai, name:zhang-chunqiao, name:yao-wenyuan, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-03-10.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 10, 1967; Zhou''s report of Mar. 10 on carrying out Mao''s Mar. 9 instruction, with his revision, the same day, of the Center''s reply on Jiangsu)'
  - add:
      entry:
        id: cal.1967-03-10.china-leadership-4
        when: Mar. 10
        date: '1967-03-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the Kunming Iron and Steel Company''s request for military takeover: agreed; Ye Jianying to telephone the Region.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (Mar. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ye Jianying.'
        tags: [name:zhou-enlai, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-13.china-leadership
        when: Mar. 13
        date: '1967-03-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai speaks to the conference of army-level cadres: settle the leading bodies of the provinces in March, mainly of PLA men, or a production command first. Paralyzed units, frontier, coastal and transport points, organs of dictatorship, secret and key organs and defence enterprises all to be under military control. Epidemic prevention is very urgent. Reactionary organizations and leakers of state secrets to be arrested.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (Mar. 13, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-03-13.china-leadership-2
        when: Mar. 13
        date: '1967-03-13'
        thread: china-leadership
        also: [testing, china]
        c: 'Zhou Enlai reviews and signs the State Council''s and Military Commission''s telegram to the Lanzhou Military Region on military control of Plant 504 and the Xigu power plant: a top-secret plant, power not to be seized; absolute safety and stable output; no linking up with outside bodies inside the plant.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (Mar. 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-25.china-leadership
        when: Mar. 25
        date: '1967-03-25'
        thread: china-leadership
        also: [testing, china]
        c: 'Zhou Enlai signs another telegram on Plant 504: not to be seized or stopped; the "four bigs" to cease and give way to positive education.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (under Mar. 13, 1967). Made public: 2020. See [[cal.1967-03-13.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967.china-leadership-7
        when: 1967, Mar.–Nov.
        date: '1967'
        thread: china-leadership
        also: [testing, china]
        c: From mid-March to the end of November Zhou Enlai signs eleven urgent telegrams to nuclear-industry plants for their production safety.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (under Mar. 13, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-13.china-leadership-3
        when: Mar. 13
        date: '1967-03-13'
        thread: china-leadership
        also: [china, vietnam-hanoi]
        c: 'Zhou Enlai telephones Wei Guoqing: Guangxi is at the front of the aid to Vietnam against America, so full military control; Wei to come forward as head of the control committee.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (Mar. 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wei Guoqing.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-14.china-leadership-2
        when: Mar. 14
        date: '1967-03-14'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reviews the proclamation of military control of factories, drafted by the Peking garrison on the views of the State Council and Military Commission: all factory staff to hold their production posts, keep discipline and obey command; those long away from the plant to return within a week or be disciplined, down to dismissal.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 14, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-03-15.china-leadership-2
        when: Mar. 15
        date: '1967-03-15'
        thread: china-leadership
        also: [china]
        c: The liaison meeting adopts the proclamation of military control of factories; Zhou Enlai sends it to Mao.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (under Mar. 14, 1967). Made public: 2020. See [[cal.1967-03-14.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1967-03-16.china-leadership-3
        when: Mar. 16
        date: '1967-03-16'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai drafts the Center's note forwarding the proclamation of military control of factories for the whole country to follow.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (under Mar. 14, 1967). Made public: 2020. See [[cal.1967-03-14.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-03-14.china-leadership-3
        when: Mar. 14
        date: '1967-03-14'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai drafts the telegram of the Center, State Council and Military Commission to all provincial and military-region committees: Peking''s Huairou County has done well to set up a front-line command, mainly of military delegates, to grasp revolution and promote production, and all places, above all counties, should do likewise for spring plowing. He sends it to Chen Boda for Mao.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Mao Zedong.'
        tags: [name:zhou-enlai, name:chen-boda, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-15.china-leadership
        when: Mar. 15
        date: '1967-03-15'
        thread: china-leadership
        c: 'Zhou Enlai chairs the Cultural Revolution Group''s liaison meeting on the Center''s Letter to the Workers, Staff and Cadres of the Country''s Factories, Mines and Enterprises: the working class to be the model of grasping revolution and promoting production, of great alliance and of opposing anarchism; keep the eight-hour day; fight absence without cause, slipshod work and waste.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 15, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-03-16.china-leadership-4
        when: Mar. 16
        date: '1967-03-16'
        thread: china-leadership
        c: Zhou Enlai sends the Center's letter to the workers, staff and cadres of factories, mines and enterprises to Mao for approval, and orders it broadcast and printed.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (under Mar. 15, 1967). Made public: 2020. See [[cal.1967-03-15.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - cite:
      id: cal.1967-03-18.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 15–16, 1967; Zhou''s part in the Center''s letter to the workers, staff and cadres of factories, mines and enterprises, as chronicled for the 15th and 16th)'
  - cite:
      id: cal.1967-03-17.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 17, 1967; Zhou, before dawn, on the Fuzhou Military Region''s report on a Fujian revolutionary committee and seizure of power, thinks conditions unripe and telephones Han Xianchu: Fujian to prepare the three-in-one through military control; if all agree it is ripe, send delegates to the Center; if the Mar. 18 mass meeting cannot be cancelled, make it a preparatory meeting for seizing power; Mao agrees)'
  - add:
      entry:
        id: cal.1967-03-17.china-leadership-2
        when: Mar. 17
        date: '1967-03-17'
        thread: china-leadership
        c: 'Zhou Enlai writes Li Fuchun, Li Xiannian, Yu Qiuli, Gu Mu and Ye Jianying: Mao instructs that after the defence industry, military control may be applied to the State Council''s industry-transport and finance-trade branches where paralyzed and in anarchy; to meet together the morning of the 18th.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 134 (Mar. 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Yu Qiuli, Gu Mu, Ye Jianying, Mao Zedong.'
        tags: [name:zhou-enlai, name:li-fuchun, name:li-xiannian, name:ye-jianying, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-17.china-leadership-3
        when: Mar. 17
        date: '1967-03-17'
        thread: china-leadership
        c: 'Zhou Enlai receives the Party-group members and rebels of the National Defense Science Commission and the Defense Industry Office''s ministries: seizing power and criticism are to be separate, some only criticism and no seizure. Defence output has suffered since the Cultural Revolution; rank the leading cadres and give them a chance to make self-criticism, but not everyone through the pass, and no dragging; that is to doubt all, the bourgeois reactionary line. He kept Wang Zheng (the Fourth Ministry''s head) in Zhongnanhai for protection some days ago; now he is let out, and there is to be no more seizing.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 134 (Mar. 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wang Zheng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-03-20.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 134–135 (Mar. 18, 1967; Zhou, after talking with Li Fuchun, Nie Rongzhen and Ye Jianying on military control, writes Mao and Lin Biao that military control is announced for the defence industry: three military delegates to each department using the existing bodies, the masses to rectify with open doors and help the leaders to show themselves, to a three-in-one; he also gives views on military control of the State Council''s industry-transport, finance-trade, farm-forestry and health branches; Mao: "return to the Premier, do as said"; the report of Nie Rongzhen to the Center on military takeover of defence research bodies, Zhou agreeing and proposing six defence-industry ministries, Mao: "Premier, do it")'
  - add:
      entry:
        id: cal.1967-03-18.china-leadership-2
        when: Mar. 18
        date: '1967-03-18'
        thread: china-leadership
        c: Zhou Enlai, on the stoppage of work in the Third Bureau of the Party's Investigation Department through its factions' fight, has Yang Dezhong send three leaders of the Central Guards Regiment to declare military control there, and asks the Military Commission and General Political Department for a delegation to control the whole Department. He reviews the notice on the Third Bureau's military control. Mao agrees to control of the whole Department.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 135 (Mar. 18, 1967, the item after). Made public: 2020. See [[cal.1967-03.china-leadership]]. Names: Zhou Enlai, Yang Dezhong, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-03-19.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 135 (Mar. 19, 1967; Zhou reviews the Center''s notice on stopping the great linking up nationwide, cancelling the plan for one after the spring thaw; Mao approves; issued that day)'
  - add:
      entry:
        id: cal.1967-03-21.china-leadership-2
        when: Mar. 21
        date: '1967-03-21'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on Mao''s instruction that "all railway bureaus in disorder should be put under military control", has Yu Qiuli and Gu Mu at once draft a decision on military control of the railways, communications and posts-and-telecommunications ministries and their key enterprises. In revising it he adds: under the military control committee two teams, a Cultural Revolution committee and a business leading group; treat cadres by inquiry and class analysis, not rejecting or overthrowing all, nor all restoring and combining. The Cultural Revolution Group finds fault with it at the liaison meeting.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 135 (Mar. 21, 1967). Made public: 2020. See [[cal.1967-03-21.china-leadership]]. Names: Zhou Enlai, Yu Qiuli, Gu Mu, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-21.china-leadership-3
        when: Mar. 21
        date: '1967-03-21'
        thread: china-leadership
        c: 'Zhou Enlai receives the finance-and-trade rebels and the ministries'' Party-group members: the ministries to take up business at once. To rebels who want Chen Yun criticized and posters against Li Xiannian in the streets: matters within the Standing Committee are for the Center; he does not favor street posters; the Center trusts Li. House-searching, beating, smashing, looting and seizing are not allowed.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 135–136 (Mar. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yun, Li Xiannian.'
        tags: [name:zhou-enlai, name:chen-yun, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-21.china-leadership-4
        when: Mar. 21
        date: '1967-03-21'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, on the wall poster of David Kupp, a foreign teacher at the Xian Foreign Languages Institute, criticizing the rebels' extreme-Left ways (expulsion by mass meeting, "revolutionary hitting, smashing, looting"), proposes it be published in the Group's Cultural Revolution bulletin with Mao's comment.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 136 (Mar. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Kupp, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-20.china-leadership-3
        when: Mar. 20
        date: '1967-03-20'
        thread: china-leadership
        also: [china]
        c: 'Mao writes on David Kupp''s wall poster at the Xian Foreign Languages Institute: the foreigner sees the questions well and analyzes them rather well.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 136 (under Mar. 21, 1967). Made public: 2020. Names: Kupp, Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-21.china-leadership-6
        when: Mar. 21
        date: '1967-03-21'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives, in the evening, the rebel delegates and Party-group members of the Railways, Communications and Posts ministries: full military control of all three; the second quarter''s output to be done well, railways and ports first; restoring business is not restoration. Of the talk that Li Xiannian, Yu Qiuli and Gu Mu belong to "the bourgeois headquarters": "be factual; do not believe rumor."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 136 (Mar. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Yu Qiuli, Gu Mu.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-22.china-leadership
        when: Mar. 22
        date: '1967-03-22'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai reviews the State Council's and Military Commission's notice on military control of Peking Hospital, stressing that its mass bodies must "rectify" and must treat cadres rightly.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 22, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-03-22.china-leadership-2
        when: Mar. 22
        date: '1967-03-22'
        thread: china-leadership
        c: 'Zhou Enlai, after the Peking workers'' congress, talks with Kuai Dafu: do not make absolutes of cadres; neither "no criticism" nor "one criticism, down they go" is right; he sees no new material for downing Yu Qiuli; do not be "Left" in form and Right in fact.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Kuai Dafu, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-23.china-leadership-3
        when: Mar. 23
        date: '1967-03-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reviews the draft decision of the Center, State Council and Military Commission on military control of the Daqing oilfield: speedily restore and re-elect the leading bodies at each level, reinstate the production command, and ensure output, construction, research and design. He sends it to Mao: for so large a national enterprise, with a division of troops stationed at Daqing, the decision should come from the Center, State Council and Commission. Mao: "do as proposed."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 23, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-23.china-leadership-4
        when: Mar. 23
        date: '1967-03-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the delegates of Daqing''s workers and affirms its past work. On treating cadres rightly: criticism severe, handling lenient. Some slogans are made absolute and he cannot interfere, for this is great democracy, but he does not agree; for example, "long live revolutionary hitting, smashing and looting" is "Left" in form and Right in fact, an infantile "Left" disorder.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 23, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-24.china-leadership
        when: Mar. 24
        date: '1967-03-24'
        thread: china-leadership
        c: 'Zhou Enlai calls the members of the Health Ministry''s Party group and delegates of four rebel bodies and asks about epidemic prevention. He has named Qian Xinzhong and Cui Yitian to the meningitis office, and all four bodies are to back it: the most urgent work, not a day''s delay. The "Hundred Ugly Pictures" make the Party ugly and hurt it; that they said Li Xiannian was wrongly criticized: he thinks the criticism was too little, but it cannot be said that his words were poisonous weeds.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 24, 1967). Made public: 2020. Names: Zhou Enlai, Qian Xinzhong, Cui Yitian, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-24.china-leadership-2
        when: Mar. 24
        date: '1967-03-24'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Xu Xiangqian, Nie Rongzhen, Ye Jianying, Xiao Hua and Yang Chengwu on Qinghai.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Xiao Hua, Yang Chengwu.'
        tags: [name:zhou-enlai, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-24.china-leadership-3
        when: Mar. 24
        date: '1967-03-24'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Wang Enmao and Saifudin on Xinjiang.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wang Enmao, Saifudin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-25.china-leadership-2
        when: Mar. 25
        date: '1967-03-25'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates of Xinjiang''s rebel bodies in Peking: the nature of Wang Enmao''s case is not to be fixed beforehand.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (under Mar. 24, 1967). Made public: 2020. See [[cal.1967-03-24.china-leadership-3]]. Names: Zhou Enlai, Wang Enmao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-27.china-leadership-2
        when: Mar. 27
        date: '1967-03-27'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, learning of the earthquake at Hejian and Dacheng in Hebei, sends the State Science Commission, the Academy of Sciences and the Geology and Petroleum ministries to the site, and his liaison man Liu Xiyao to command there.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 27, 1967). Made public: 2020. Names: Zhou Enlai, Liu Xiyao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-29.china-leadership-3
        when: Mar. 29
        date: '1967-03-29'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai orders the departments concerned to watch closely the earthquake signs of the Peking–Tianjin area.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (under Mar. 27, 1967). Made public: 2020. See [[cal.1967-03-27.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-28.china-leadership
        when: Mar. 28
        date: '1967-03-28'
        thread: china-leadership
        c: 'Zhou Enlai calls the liaison meeting at Huairen Hall on three things: (1) the decision on military control of the railway, communications and posts ministries; (2) a draft trial rule for military control of defence plants and defence research institutes; (3) who is to carry out, in the army, supporting the Left, farming and industry, military control and military training.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 28, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-03-28.china-leadership-2
        when: Mar. 28
        date: '1967-03-28'
        thread: china-leadership
        c: 'Zhou Enlai receives the Party-group members and rebels of 21 ministries and commissions. The revolution is in its second stage: cadres are not to be hauled about; criticize them at agreed times and let them go back to work. The State Council needs Yu Qiuli and Gu Mu. In the farm season and industry''s second quarter, no general review of cadres; free a batch to business posts.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yu Qiuli, Gu Mu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-28.china-leadership-3
        when: Mar. 28
        date: '1967-03-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reviews the Center''s draft decision on Anhui: the Jan. 26 seizure there made no great alliance nor true three-in-one; a military control committee under Qian Jun, deputy commander of the Nanjing Military Region, to take the province''s leadership at once, with one team for revolution and one for production. He sends it to Lin Biao for Mao.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138–139 (Mar. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Qian Jun, Lin Biao, Mao Zedong.'
        tags: [name:zhou-enlai, name:lin-biao, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-29.china-leadership-2
        when: Mar. 29
        date: '1967-03-29'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Zhou Enlai tells Phạm Văn Đồng in talks: the Soviet Union says China will attack it; China will not; it is so large and has more at home than it can manage.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Mar. 29, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-03-30.china-leadership-3
        when: Mar. 30
        date: '1967-03-30'
        thread: china-leadership
        also: [china]
        c: The *Hongqi*, no. 5, prints Qi Benyu's "Patriotism or National Betrayal? On the Reactionary Film *Secret History of the Qing Court*", the editorial office investigators article of Wang Li and Guan Feng, "Hit a Big Number, Protect a Small Handful" Is a Part of the Bourgeois Reactionary Line, and a commentators "The Bourgeois Reactionary Line on the Cadre Question Must Be Criticized". They attack Liu Shaoqi and for the first time, unnamed, put on him in public "the biggest power-holder on the capitalist road in the Party".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Mar. 30, 1967). See [[cal.1967-03-23.china-leadership]]. Names: Zhou Enlai, Qi Benyu, Wang Li, Guan Feng, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc]
  - add:
      entry:
        id: cal.1967-03-30.china-leadership-4
        when: Mar. 30
        date: '1967-03-30'
        thread: china-leadership
        c: Zhou Enlai watches the film *Secret History of the Qing Court* in the evening at Huairen Hall.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Mar. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03.china-leadership-2
        when: Mar.
        date: 1967-03
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, in instructions to the Fuzhou Military Region: revolutionary mass bodies are not to fight with arms, nor to hit, smash, loot, search, raid and seize.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Mar. 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03.china-leadership-3
        when: Mar.
        date: 1967-03
        thread: china-leadership
        c: By Zhou Enlai's desk calendar, in March he talked with leaders of all places on all kinds of questions 49 times, and received delegates of mass bodies 31 times.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Mar. 1967, the last item). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-01.china-leadership-2
        when: Apr. 1–4
        date: '1967-04-01'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai holds talks each day with the Party, government and army heads and mass delegates of Sichuan on the Sichuan and Yibin problems. April 3: mass bodies may not pull leaders out for kneeling, black boards, tall hats or parading; argument, not arms; no talk of "black commander" or "black military subdistrict"; all bodies to rectify with open doors, with self-criticism first, facts and reasons.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Apr. 1–4, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-03.china-leadership
        when: Apr. 3
        date: '1967-04-03'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, with Chen Boda, Kang Sheng and Jiang Qing, receives student delegates of the colleges and middle schools. Jiang Qing and Kang Sheng charge Fu Chongbi and Li Zhongqi of the Peking garrison with backing the Right and hitting the Left in military training.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Apr. 3, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Fu Chongbi.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-04.china-leadership-2
        when: Apr. 4
        date: '1967-04-04'
        thread: china-leadership
        c: Zhou Enlai talks before dawn with the responsible men of the Peking garrison and the 65th Army on military training.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Apr. 3, 1967, the item after; "次日凌晨"). Made public: 2020. Names: Zhou Enlai, Fu Chongbi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-04.china-leadership-3
        when: Apr. 4
        date: '1967-04-04'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, with Xu Xiangqian, Nie Rongzhen, Ye Jianying, Xie Fuzhi, Xiao Hua, Yang Chengwu, Su Yu and Cultural Revolution Group members, talks with the Fuzhou Military Region leaders on Fujian.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 4, 1967). Made public: 2020. Names: Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Xie Fuzhi, Xiao Hua, Yang Chengwu, Su Yu.'
        tags: [name:zhou-enlai, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-05.china-leadership
        when: Apr. 5
        date: '1967-04-05'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, answering the Foreign Ministry on students returned from abroad who want to move into the ministry building to "make revolution": the building is not open.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 5, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-06.china-leadership
        when: Apr. 6
        date: '1967-04-06'
        thread: china-leadership
        c: 'Zhou Enlai receives the rebel delegates of the State Planning, Economic and Construction commissions and rebukes their argument that to topple Bo Yibo they must first topple Gu Mu and Yu Qiuli. Told Yu has not yet made his self-criticism: he is unwell, and an ill man cannot write it; Gu Mu''s and Li Xiannian''s are with Zhou; give them time to prepare, for they must work. On the economic front, with himself, only five men now carry business: could you be raised up in their place?'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 6, 1967). Made public: 2020. Names: Zhou Enlai, Bo Yibo, Gu Mu, Yu Qiuli, Li Xiannian.'
        tags: [name:zhou-enlai, name:bo-yibo, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-07.china-leadership
        when: Apr. 7
        date: '1967-04-07'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Zhou Enlai holds talks with Premier Phạm Văn Đồng.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 7, 10, 11, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
        tags: [name:zhou-enlai, name:pham-van-dong, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-04-09.china-leadership
        when: Apr. 9
        date: '1967-04-09'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Zhou Enlai goes with Phạm Văn Đồng and his party by air to Dazhai and back to Peking the same day.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 9, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
        tags: [name:zhou-enlai, name:pham-van-dong, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-04-10.china-leadership
        when: Apr. 10
        date: '1967-04-10'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou Enlai, in talks with Phạm Văn Đồng: a war always ends; political struggle goes on at all times, and war is its highest form, so there is no war without political struggle. Strengthen international propaganda to win sympathy, weaken and split the enemy and use the contradictions among enemies; this was done and is to be done more.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 7, 10, 11, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
        tags: [name:zhou-enlai, name:pham-van-dong, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-04-11.china-leadership-2
        when: Apr. 11
        date: '1967-04-11'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Zhou Enlai, in talks with Phạm Văn Đồng: to win, the Vietnam war must not be given up halfway. Asked whether Stalin advised the PLA not to cross the Yangtze: Stalin doubted China could cross in 1949 and thought the U.S. would send troops; the U.S. did not. When Nanjing fell, the U.S. ambassador stayed and offered recognition and perhaps aid; China paid no heed and he left.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 7, 10, 11, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng, Stalin.'
        tags: [name:zhou-enlai, name:stalin, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-04-07.china-leadership-2
        when: Apr. 7–10
        date: '1967-04-07'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives representatives of Tianjin''s mass bodies three times, the 7th, 9th and 10th. On the roots of the "anti-Party clique": do not hit a wide circle, be factual; the line toward comrades who erred is to punish the past to warn the future and cure the sickness to save the man. An absolute "criticized, then must fall" is wrong: criticize one, not necessarily fell; if one criticism fells a man, how many must fall?'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140–141 (Apr. 7, 9, 10, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-12.china-leadership
        when: Apr. 12
        date: '1967-04-12'
        thread: china-leadership
        c: Zhou Enlai learns that a son of Guo Moruo has killed himself.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 12, 1967). Made public: 2020. Names: Zhou Enlai, Guo Moruo.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-20.china-leadership-2
        when: Apr. 20
        date: '1967-04-20'
        thread: china-leadership
        c: Zhou Enlai visits Guo Moruo after the suicide of Guo's son.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (under Apr. 12, 1967). Made public: 2020. See [[cal.1967-04-12.china-leadership]]. Names: Zhou Enlai, Guo Moruo.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-12.china-leadership-2
        when: Apr. 12–13
        date: '1967-04-12'
        thread: china-leadership
        c: Zhou Enlai attends the enlarged meeting of the Military Commission, at which Kang Sheng, Chen Boda and Jiang Qing make many speeches inciting the overthrow of Liu Shaoqi and Deng Xiaoping.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 12, 13, 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Chen Boda, Jiang Qing, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:kang-sheng, name:chen-boda, name:jiang-qing, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-13.china-leadership
        when: Apr. 13
        date: '1967-04-13'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai reviews the Center's notice, in the names of the Center, State Council, Military Commission and Cultural Revolution Group, to the Guangdong military control committee, the Central-South financial and economic commission and all regions and provinces, on running the Canton spring export fair well; he adds that no power is to be seized in the fair or its bodies. The notice gives five points to ensure its success; Mao approves it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 13, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-13.china-leadership-2
        when: Apr. 13
        date: '1967-04-13'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Huang Yongsheng and Fu Chongbi and others on the Canton fair.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Fu Chongbi.'
        tags: [name:zhou-enlai, name:huang-yongsheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-13.china-leadership-3
        when: Apr. 13
        date: '1967-04-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, in the evening, receives Inner Mongolia''s rebel delegates: do not seize Ulanhu; organizations across trades are to dissolve; individual interest yields to the whole and a mans grievance for a time is no matter; fight self-interest and set up the public; do not hold on to the PLA, but mend army–people relations. At the meeting the Center''s Decision on the Inner Mongolia question is read and explained.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 13, 1967, the item after). Made public: 2020. To check: the Center''s decision on Inner Mongolia, as issued. Names: Zhou Enlai, Ulanhu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-14.china-leadership
        when: Apr. 14
        date: '1967-04-14'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai writes Mao and Lin Biao on the Canton fair: Huang Yongsheng reports tension, and the military control committee can hardly keep order; college and office rebels hamper the fair''s companies and form factions with local rebels; if they are not dissuaded, the opening on the 15th will be much harmed. He will fly to Canton that morning with Huang to settle it himself.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141–142 (Apr. 14, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao, Huang Yongsheng.'
        tags: [name:zhou-enlai, name:mao-zedong, name:lin-biao, name:huang-yongsheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-14.china-leadership-2
        when: Apr. 14
        date: '1967-04-14'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai flies to Canton. During his stay, for the fair and for Guangdong, he talks many times with Huang Yongsheng, Liu Xingyuan, Lin Liming, Lu Xuzhang, Chen De and Wen Yucheng, meets Canton's mass bodies four times and inspects the fairs display.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 142 (Apr. 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Chen De.'
        tags: [name:zhou-enlai, name:huang-yongsheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-14.china-leadership-3
        when: Apr. 14
        date: '1967-04-14'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai speaks at the Canton representatives meeting of all circles and explains the Center''s five-point notice on the spring fair: tomorrow''s opening is to be seen as a new campaign and the meeting made a success. Respect and trust the PLA; no posters criticizing it outside. Cadres are the wealth of Party and state and their experience is needed; they must stand forth or the work cannot go on.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 142 (Apr. 14, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-04-15.china-leadership-2
        when: Apr. 15
        date: '1967-04-15'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai holds a symposium with the Canton mass bodies. To those who would seize "Canton''s Tan Zhenlin" and the "handful" in the Military Region and oppose military control: military control was Mao''s decision, and to oppose it points the spearhead at the Party Center. A right direction does not mean no mistakes. To the Peking students in Canton: no new great linking up.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 142–143 (Apr. 15, 1967). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin.'
        tags: [name:zhou-enlai, name:tan-zhenlin, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-16.china-leadership
        when: Apr. 16
        date: '1967-04-16'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Zhou Enlai calls at Conghua on Hồ Chí Minh, who is recuperating there.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 16, 1967). Made public: 2020. Names: Zhou Enlai, Hồ Chí Minh.'
        tags: [name:zhou-enlai, name:ho-chi-minh, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-04-17.china-leadership
        when: Apr. 17
        date: '1967-04-17'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai again meets Canton's mass bodies. He rebukes those who, because *Secret History of the Qing Court* has the four words "all under heaven is public", covered the four characters written by Sun Yat-sen in the Zhongshan Hall, and orders them restored before dawn. Make the past serve the present; Sun is still to be affirmed in the Cultural Revolution; last year's removal of Sun's bronze statue at Nanjing was wrong.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 17, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-18.china-leadership
        when: Apr. 18
        date: '1967-04-18'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, at the fourth meeting with Canton''s mass bodies: Guangdong is on the front; if rail, telephone and telegraph fail it is very bad. Slower may be better in the Cultural Revolution. Revolutionaries must join production. Talk of capitalist restoration by the army is not so. The cry "long live revolutionary hitting, smashing, looting" is wrong.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 18, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-19.china-leadership
        when: Apr. 19
        date: '1967-04-19'
        thread: china-leadership
        c: Zhou Enlai flies back to Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 19, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-20.china-leadership
        when: Apr. 20
        date: '1967-04-20'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai speaks at the founding meeting of the Peking Municipal Revolutionary Committee: while grasping revolution hard, promote production hard, and have the Cultural Revolution shine in economic construction and scientific research; here Peking has great influence on the country.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 20, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-04-21.china-leadership
        when: Apr. 21
        date: '1967-04-21'
        thread: china-leadership
        c: 'Zhou Enlai receives the correspondents of the *Hongqi*, the *Renmin ribao*, the *Jiefangjun bao* and Xinhua stationed in other places: report more widely; the army''s support of the Left is the centre, but report its successes in supporting industry and farming too, and hear the views of the conservatives, a large mass; look at the whole.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143–144 (Apr. 21, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-04-21.china-leadership-2
        when: Apr. 21–24
        date: '1967-04-21'
        thread: china-leadership
        c: 'Zhou Enlai attends the enlarged Military Commission meeting. In the outline of his speech he writes "the February disorder" for the "February adverse current": the error was in relations with the masses, in intent for Mao, wishing to do well but sometimes standing wrong and thinking in the old way; the comrades self-criticisms are a summing of experience; keep calm, correct at once, and stand ready to bear responsibility.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 144 (Apr. 21, 24, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-22.china-leadership
        when: Apr. 22
        date: '1967-04-22'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Han Xianchu on Fujian.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 144 (Apr. 22, 1967). Made public: 2020. Names: Zhou Enlai, Han Xianchu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-23.china-leadership-4
        when: Apr. 23
        date: '1967-04-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Fujian delegates and requires the mass body occupying the *Fujian ribao* to leave at once: Fujian is at the front.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 144 (under Apr. 22, 1967). Made public: 2020. See [[cal.1967-04-22.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-23.china-leadership-3
        when: Apr. 23
        date: '1967-04-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the report of the Chengdu Railway Bureau''s military control committee that five or six hundred Red Guards moved into the bureau and disturb its work: ask the Cultural Revolution Group''s office to telephone and see if they can be persuaded to leave; if not, think of a formal telegram.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 144 (Apr. 23, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-25.china-leadership
        when: Apr. 25
        date: '1967-04-25'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks with Tan Qilong. The situation is complicated and needs long spiritual preparation; the socialist revolution''s cost may be no less than the democratic one''s. The cadres cannot come out to work. On Tan''s return to Shandong for his self-criticism: hear views, criticize himself more; Zhou has told the rebels Tan is only to be criticized, without violence or encirclement.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 144–145 (Apr. 25, 1967). Made public: 2020. Names: Zhou Enlai, Tan Qilong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-26.china-leadership
        when: Apr. 26
        date: '1967-04-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the military-control cadres of the defence branches. Military control is a transitional means, unlike that of the early years of liberation. "Grasp revolution, promote production" is not dualism but revolution to push production; not that the masses have nothing to be criticized: today''s editorial calls for overthrowing anarchism. Have the greatest patience: patience is not tolerance, and tolerating error will not do. Final say on revolution and business in a controlled unit is the control committees; the masses can criticize and propose, not supervise business.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 26, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-04-26.china-leadership-2
        when: Apr. 26
        date: '1967-04-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks with Gu Zhuoxin and other heads of the Northeast Bureau and the Shenyang Military Region: they must unite and not split, or the masses are divided and set against each other and armed fights follow; the Region to back the Northeast Bureau in leading the Cultural Revolution and in grasping farming and industry.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Gu Zhuoxin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-27.china-leadership
        when: Apr. 27
        date: '1967-04-27'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives the Inner Mongolian petitioners sitting at the gate of Zhongnanhai and tells them to dissolve their "Workers, Peasants and Soldiers Revolutionary Committee" and other bodies across trades and go back to their own units and trades.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 27, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-28.china-leadership
        when: Apr. 28
        date: '1967-04-28'
        thread: china-leadership
        c: 'Zhou Enlai, with Kang Sheng and Li Fuchun, receives delegates of the Institute of International Relations. On the "February mutiny": so far as he knows, there was no such thing; "prepare for war, prepare for famine, for the people" is the policy Mao put forward at the Hangzhou conference, and carrying out his order.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 28, 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Li Fuchun.'
        tags: [name:zhou-enlai, name:kang-sheng, name:li-fuchun, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-28.china-leadership-2
        when: Apr. 28
        date: '1967-04-28'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of the two factions of the Zhanyou Song and Dance Troupe: unite, and he will go to see the *Long March Suite* sung by both; otherwise not.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-02.china-leadership
        when: May 2
        date: '1967-05-02'
        thread: china-leadership
        c: Zhou Enlai attends the joint performance of the *Long March Suite* by the two factions of the Zhanyou Song and Dance Troupe.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (under Apr. 28, 1967). Made public: 2020. See [[cal.1967-04-28.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-30.china-leadership
        when: Apr. 30
        date: '1967-04-30'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai consults Chen Boda on the clause in the Center''s Opinions on the Fujian Question that those arrested for storming the Military Region be freed at once, and adds: "except the odd active counter-revolutionary yet to be made clear."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 30, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-30.china-leadership-2
        when: Apr. 30
        date: '1967-04-30'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives Fujian's rebel delegates and reads and explains the Center's Opinions on the Fujian Question. After return they are not to name Ye Fei in so large a paper as the *Fujian ribao*; official papers should leave room; no more storming the Military Region nor meetings like the "Feb. 7" to shell someone; Fujian is on the front, not like Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 146 (Apr. 30, 1967, the item after). Made public: 2020. To check: the Center''s Opinions on the Fujian Question, as issued. Names: Zhou Enlai, Ye Fei.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-30.china-leadership-3
        when: Apr. 30
        date: '1967-04-30'
        thread: china-leadership
        c: 'Zhou Enlai talks with the delegates of mass bodies of the Center''s and State Council''s departments on seats on the May Day viewing stand: tickets are to be shared out fairly and not wrangled over on the stand, or none will go. On the situation: most departments ask for military control, or output will not rise. The ordering conference is to meet after May Day; the Third Five-Year Plan must go up; Yuan Baohua, though kept in post under supervision, must attend this one and not "rebel" there.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 146 (Apr. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yuan Baohua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-01.china-leadership
        when: May 1
        date: '1967-05-01'
        thread: china-leadership
        c: Zhou Enlai talks with Gu Mu on Yuan Baohua.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 146 (May 1, 1967). Made public: 2020. Names: Zhou Enlai, Gu Mu, Yuan Baohua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-03.china-leadership
        when: May 3
        date: '1967-05-03'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates of the summer grain-and-oil purchase conference of 14 provinces and municipalities. Farmers under-report land and grain because high targets and high purchases harmed them: "store wealth in the people"; be factual and rely on the poor and lower-middle peasants. More purchase means resale and waste. Correct grain policy is not the bourgeois reactionary line; needed rewards are not "material incentive".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 146–147 (May 3, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-05-04.china-leadership-2
        when: May 4
        date: '1967-05-04'
        thread: china-leadership
        c: 'Zhou Enlai receives the finance-and-trade mass bodies and does not agree to their forming a "liaison station to criticize Li Xiannian". To the rebels who seized cadres and left them untraced: "what style is that? a kidnappers style"; the finance and trade ministries must not do so. Of the "February adverse current": it was a difference of understanding and view, no question of principle; a mistaken leaning is among the people; Li Xiannian''s is among the people; judge a man by his whole history, not a moment; the Center knows its cadres.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 4, 1967). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-05.china-leadership
        when: May 5
        date: '1967-05-05'
        thread: china-leadership
        c: Zhou Enlai writes Chen Yi, Tan Zhenlin, Li Xiannian, Yu Qiuli and Gu Mu, copy to Li Fuchun, warning them not to take the "May Day unity" for an illusion, or "there will be another new swing".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 5, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi, Tan Zhenlin, Li Xiannian, Yu Qiuli, Gu Mu, Li Fuchun.'
        tags: [name:zhou-enlai, name:chen-yi, name:tan-zhenlin, name:li-xiannian, name:li-fuchun, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-05.china-leadership-2
        when: May 5
        date: '1967-05-05'
        thread: china-leadership
        c: Zhou Enlai talks with the vice-premiers Chen Yi, Tan Zhenlin, Li Xiannian and Li Fuchun, with Yu Qiuli and Gu Mu.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 5, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi, Tan Zhenlin, Li Xiannian, Li Fuchun, Yu Qiuli, Gu Mu.'
        tags: [name:zhou-enlai, name:chen-yi, name:tan-zhenlin, name:li-xiannian, name:li-fuchun, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-06.china-leadership
        when: May 6
        date: '1967-05-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Gan Weihan on the armed fight at Plant 132.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 6, 1967). Made public: 2020. Names: Zhou Enlai, Gan Weihan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-07.china-leadership-3
        when: May 7
        date: '1967-05-07'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, after talking with Li Dazhang, Zeng Xisheng and Liao Jingdan, receives delegates of some Sichuan cities and counties. To those dissatisfied with the self-criticisms of Gan Weihan and Wei Jie: sincere in attitude, and understanding takes a process; trust and rely on most cadres. Chen Boda reads the Center''s Decision on handling the Sichuan question.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 7, 1967). Made public: 2020. To check: the Center''s Decision on handling the Sichuan question, as issued. Names: Zhou Enlai, Li Dazhang, Zeng Xisheng, Liao Jingdan, Gan Weihan, Wei Jie, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-08.china-leadership
        when: May 8
        date: '1967-05-08'
        thread: china-leadership
        c: Zhou Enlai, before dawn, talks in turn with those concerned on Tibet, Tianjin, Peking and Inner Mongolia.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 8, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-08.china-leadership-2
        when: May 8
        date: '1967-05-08'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on setting up a military control committee in Tibet: agreed, at once; no hurry to call the rebel bodies to Peking to consult, for he settled it last night with Zhang Guohua at the Sichuan meeting.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Zhang Guohua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-08.china-leadership-3
        when: May 8
        date: '1967-05-08'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the Ministry of Communications rebels'' wish to send men to supervise the coming talks between the ministry and the Albanian shipping company: in foreign negotiations keep to the Center''s line, no supervision; in the foreign affairs system there is no such precedent.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1967-05-08.china-leadership-4
        when: May 8
        date: '1967-05-08'
        thread: china-leadership
        c: Zhou Enlai, with Chen Boda, Kang Sheng, Jiang Qing and Yang Chengwu, attends the forum of military-training cadres, who report that Kuai Dafu attacks the PLA's training as "more of a work group than a work group".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yang Chengwu, Kuai Dafu.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-09.china-leadership-2
        when: May 9
        date: '1967-05-09'
        thread: china-leadership
        also: [testing, china]
        c: Zhou Enlai chairs the Central Special Commission to check the preparation of the hydrogen bomb air-burst test. Every link of the test is to be examined again and again for safety and success; health protection along the track of the cloud to be done thoroughly and emergency measures made ready against accident.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 9, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-10.china-leadership-2
        when: May 10
        date: '1967-05-10'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls the enlarged Standing Committee liaison meeting, which adopts the Peking Military Region's request for military control of Hebei and of five prefectures (Shijiazhuang, Tangshan, Zhangjiakou, Chengde, Hengshui), and the Center's and Military Commission's Several Opinions on the Gansu Question.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 10, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-11.china-leadership-5
        when: May 11
        date: '1967-05-11'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai sends Mao the Hebei military-control request and the Gansu opinions: military control of Hebei as a transition, its committee best headed by Zheng Weishan; Hebei''s leaders Liu Zihou, Yan Dakai, Li Yanbo and Lin Tie need no conclusion now; for Gansu, military control for now.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (under May 10, 1967). Made public: 2020. See [[cal.1967-05-10.china-leadership-2]]. Names: Zhou Enlai, Zheng Weishan, Liu Zihou, Yan Dakai, Li Yanbo, Lin Tie, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-05-14.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 14, 1967; Mao''s May 14 note on military control in Gansu: could it be skipped, following the Region''s view, with a provincial revolutionary committee formed after a period of work)'
  - add:
      entry:
        id: cal.1967-05-11.china-leadership-2
        when: May 11
        date: '1967-05-11'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reviews the Peking Revolutionary Committee''s important notice: the Center''s order to grasp revolution and promote production to be carried out; no hitting, smashing, looting, house-searching or seizing; inciters of armed fights to be dealt with by law; the Center''s Apr. 20 notice stopping linking up to be obeyed. He sends it to Mao, proposing it be issued.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148–149 (May 11, 1967). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1967-05-14.china-leadership-3
        when: May 14
        date: '1967-05-14'
        thread: china-leadership
        also: [china]
        c: The Peking Revolutionary Committee's important notice against armed fights, beating, smashing and looting is issued, Mao having approved it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148–149 (under May 11, 1967). Made public: 2020. See [[cal.1967-05-11.china-leadership-2]]. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1967-05-11.china-leadership-3
        when: May 11
        date: '1967-05-11'
        thread: china-leadership
        c: 'Zhou Enlai, in the evening, receives the foreign affairs system''s rebel delegates and dissuades them from a mass meeting to struggle against Chen Yi: the Center does not agree; Chen is not dismissed and must work. When they press him to call Chen a "three-anti element", he protests in anger: he did not say it; there are several vice-premiers, and he will protect them one by one.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149 (May 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-11.china-leadership-4
        when: May 11–12
        date: '1967-05-11'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, over thousands of masses at Hohhot storming the Inner Mongolia committees building and armed fights, calls in succession Yang Chengwu, Xiao Hua, Zheng Weishan, Wu Faxian and the Inner Mongolia Military Region's head Teng Haiqing to settle it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149 (May 11, 12, 1967). Made public: 2020. Names: Zhou Enlai, Yang Chengwu, Xiao Hua, Zheng Weishan, Wu Faxian, Teng Haiqing.'
        tags: [name:zhou-enlai, name:wu-faxian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-12.china-leadership
        when: May 12
        date: '1967-05-12'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai wires the Jiangxi Red Guards command of colleges and middle schools and the Jiangxi Military District''s Party committee on Red Guards occupying the *Jiangxi ribao*: they are to leave at once so the paper may be unsealed and printed.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149 (May 12, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-13.china-leadership-2
        when: May 13
        date: '1967-05-13'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, after talks with Zhang Guohua and others on Chongqing in Sichuan, meets the delegates of the two factions of Chongqing.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149 (May 13, 1967). Made public: 2020. Names: Zhou Enlai, Zhang Guohua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-13.china-leadership-3
        when: May 13
        date: '1967-05-13'
        thread: china-leadership
        c: Zhou Enlai, for the 25th anniversary of Mao's Yan'an Talks on literature and art, directs the arts troupes of the army, navy and air force in Peking to perform jointly. Li Zuopeng and others, backing one side, work against it, and the armed fight with bloodshed of May 13 follows. Zhou criticizes both sides.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149–150 (May 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Zuopeng.'
        tags: [name:zhou-enlai, name:li-zuopeng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-15.china-leadership
        when: May 15
        date: '1967-05-15'
        thread: china-leadership
        c: 'Zhou Enlai, before dawn, receives the Red Guard delegates of the Peking Foreign Languages Institute and sharply criticizes their storming the Foreign Ministry to seize Chen Yi: first admit the error; he gave the policy and they would not listen, and are turning to the opposite. Even if they would bring Chen down, it is not so simple; he orders troops to guard the Ministry, and whoever storms in will be held. A full dossier or a protest or a poster is allowed: "I do not fear being brought down; I have worked for decades."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (May 15, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-16.china-leadership-2
        when: May 16
        date: '1967-05-16'
        thread: china-leadership
        c: Zhou Enlai, told that the Economic Relations Commission's rebels would seize Fang Yi, has him brought from hospital back to the State Council, and tells his secretary to say, if they ask, "the Premier called him for talks".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (May 16, 1967). Made public: 2020. Names: Zhou Enlai, Fang Yi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-18.china-leadership-5
        when: May 18
        date: '1967-05-18'
        thread: china-leadership
        c: Zhou Enlai, receiving the Economic Relations Commission's rebels, says Fang Yi's going abroad was approved by the Center.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (under May 16, 1967). Made public: 2020. See [[cal.1967-05-16.china-leadership-2]]. Names: Zhou Enlai, Fang Yi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-16.china-leadership-3
        when: May 16
        date: '1967-05-16'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the Chongqing factions'' delegates and reads and explains the Center''s Opinions on the Chongqing Question: look ahead and stop debate; mass bodies not to seize each other''s men; respect and trust the PLA.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (May 16, 1967, the item after). Made public: 2020. To check: the Center''s Opinions on the Chongqing Question, as issued. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-17.china-leadership-2
        when: May 17
        date: '1967-05-17'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai tells the liaison men's office to take Yang Chao, Sichuan's vice-governor, to the Central Direct Organs hostel to live.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (May 17, 1967). Made public: 2020. Names: Zhou Enlai, Yang Chao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-05-17.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (May 17, 1967; the *Renmin ribao* prints the May 16 Circular; next day the *Hongqi* and *Renmin ribao* editorial "A Great Historical Document", drafted by the Cultural Revolution Group and revised by Mao)'
  - add:
      entry:
        id: cal.1967-05-18.china-leadership-3
        when: May 18
        date: '1967-05-18'
        thread: china-leadership
        c: Zhou Enlai convenes the State Council's business group.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 18, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-18.china-leadership-4
        when: May 18
        date: '1967-05-18'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives people from Inner Mongolia in Peking and the delegates of the Inner Mongolia Military Region''s guard battalion. To the battalion: the army is the pillar of the dictatorship of the proletariat and must stay steady, not leave at once like students; no red armbands, no linking up with mass bodies; organizations across trades to dissolve.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-05-18.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 18, 1967; Jiang Qing sends Lin Biao, Zhou and Kang Sheng the "Wu Hao and others leave the Communist Party" notice that Nankai University rebels found in a pre-1949 Kuomintang paper, saying the notice was headed by Wu Hao (Zhou), and asks to see him)'
  - add:
      entry:
        id: cal.1967-05-19.china-leadership
        when: May 19
        date: '1967-05-19'
        thread: china-leadership
        c: 'Zhou Enlai writes on Jiang Qing''s letter that the "Wu Hao and others leave the Communist Party" notice is an enemy forgery: he was then in the Central Soviet area, and Kang Sheng and Chen Yun in Shanghai knew it and took steps. The same day he writes Mao, with a chronicle of the events of 1931–32: the notice is the forgery of Feb. 1932, made after he reached Jiangxi. Mao: "to the Group''s comrades to read; keep."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 19, 1967). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Kang Sheng, Chen Yun, Mao Zedong.'
        tags: [name:zhou-enlai, name:jiang-qing, name:kang-sheng, name:chen-yun, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-19.china-leadership-2
        when: May 19
        date: '1967-05-19'
        thread: china-leadership
        c: 'Zhou Enlai, on the special-case groups work: be careful, have evidence, witnesses and material proof.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-19.china-leadership-3
        when: May 19
        date: '1967-05-19'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the Railways Ministry rebels. To a proposal to smash the Ministry''s business supervision group: "you go too fast to principle"; "I announce military control of the Railways Ministry; if you storm again you will be dealt with as under military control."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-20.china-leadership
        when: May 20
        date: '1967-05-20'
        thread: china-leadership
        c: Zhou Enlai talks with those concerned on the Anshan Iron and Steel problem.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 20, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-21.china-leadership
        when: May 21
        date: '1967-05-21'
        thread: china-leadership
        c: 'Zhou Enlai receives some arts workers of the army, navy and air force troupes: the PLA must set an example in factory and school, make no cliques, unite and perform jointly.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 21, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-21.china-leadership-2
        when: May 21
        date: '1967-05-21'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, after talking with the heads of the Inner Mongolia committee and Military Region, attends the enlarged meeting of the Military Commission''s Standing Committee, which makes its five-point decision on Inner Mongolia: all Inner Mongolians in Peking back by May 24; the Region''s organs and troops to have positive education only, no "four bigs" or fighting groups; defiers punished; no part in armed fights; support the Left, educate the conservatives.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-24.china-leadership-2
        when: May 24
        date: '1967-05-24'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls the heads of the Foreign Affairs Office, the Foreign Ministry and the Hong Kong–Macao Work Committee on Hong Kong. The struggle with the Hong Kong British authorities must follow strictly the Center's line and policy, with reason, advantage and restraint; he criticizes the over-"Left" slogans and extreme acts proposed by the departments.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 24, 27, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-27.china-leadership-2
        when: May 27
        date: '1967-05-27'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls the heads of the Foreign Affairs Office, the Foreign Ministry and the Hong Kong–Macao Work Committee on Hong Kong a second time, repeating that the struggle must follow the Center's line with reason, advantage and restraint.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 24, 27, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-25.china-leadership
        when: May 25
        date: '1967-05-25'
        thread: china-leadership
        also: [japan]
        c: Zhou Enlai receives the delegation of the Japan Journalists League. China would like through Tōhō Tsūshinsha to learn more of the common interests of the Chinese and Japanese peoples; the Japanese ruling class knows China better than China knows Japan, a weakness to be made up; Chinese reporters hear what they wish to hear, a single side and narrow; Xinhua and the journalists association might commission the League for long, full and systematic reports on certain matters.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 25, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1967-05-25.china-leadership-2
        when: May 25
        date: '1967-05-25'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai orders the arrest of those who beat the Inner Mongolia Military Region's heads at the meeting on Inner Mongolia in the CPPCC auditorium on the 24th, and goes to Mao's to report on Inner Mongolia.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-26.china-leadership-5
        when: May 26
        date: '1967-05-26'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Xu Xiangqian, Nie Rongzhen, Ye Jianying, Yang Chengwu and Su Yu on settling Inner Mongolia.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (under May 25, 1967). Made public: 2020. See [[cal.1967-05-25.china-leadership-2]]. Names: Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Yang Chengwu, Su Yu.'
        tags: [name:zhou-enlai, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-26.china-leadership-2
        when: May 26
        date: '1967-05-26'
        thread: china-leadership
        c: 'Zhou Enlai receives members of the Academy of Sciences'' "Power-Seizing Committee" and some cadres: Guo Moruo is to be brought into the three-in-one. Told that the liaison men headed by Liu Xiyao are a work group in disguise and should be downed: "it does not fit the facts; I cannot agree in any case; that is no fear, many shout down with."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 26, 1967). Made public: 2020. Names: Zhou Enlai, Guo Moruo, Liu Xiyao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-26.china-leadership-3
        when: May 26
        date: '1967-05-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the Hohhot mass bodies'' delegates and announces the Military Commission''s five-point decision on Inner Mongolia. Not to quarrel and not work over a difference of view: grasp revolution, production, work and war preparation. As to criticizing Ulanhu, no hurry to seize him back; the time has not come; there is a nationality question too.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ulanhu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-26.china-leadership-4
        when: May 26
        date: '1967-05-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on Wang Enmao''s report that the masses at Urumqi''s Liudaogou coal mine and Yuhuliang power plant have fought two days and cannot be dissuaded: the plant is under military control and no armed fight is allowed between the two sides; send unarmed troops to separate them and work among the masses, but no hurry to arrest. He wires the Yuhuliang plant to cooperate with the Xinjiang Military Region, stop the fight, and bring the workers back to their posts so the plant keeps generating.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wang Enmao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-27.china-leadership-3
        when: May 27
        date: '1967-05-27'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai chairs the Center's liaison meeting, which adopts the Decision of the Center, State Council, Military Commission and Cultural Revolution Group on Military Control of the State Council's Departments (a trial draft).
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 27, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-28.china-leadership-2
        when: May 28
        date: '1967-05-28'
        thread: china-leadership
        c: 'Zhou Enlai receives the rebel delegates of the Health Ministry''s system and criticizes their having first acted, then reported: seizing away several of the ministry''s leaders without Center approval. All sides to unite and agree on picking some bureau heads to run business; the Health Ministry is unlike the Culture and Education ministries, it cannot stop work, with so many hospitals.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 28, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-28.china-leadership-3
        when: May 28
        date: '1967-05-28'
        thread: china-leadership
        c: 'Zhou Enlai instructs Xinhua on *Cankao xiaoxi*: it should report not only the good news; some of what the enemy says of China must be printed too, or the masses and rebels cannot know the many sides; do not let "fear" come first.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-29.china-leadership
        when: May 29
        date: '1967-05-29'
        thread: china-leadership
        c: 'Mao writes on a letter from Wang Hairong and Tang Wensheng reporting a current of attacks on Zhou Enlai in society, to Lin Biao, Zhou and the Cultural Revolution Group: "Please read. The ultra-Left view is wrong; the comrades of the Group should persuade them."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 29, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Wang Hairong, Tang Wensheng, Lin Biao.'
        tags: [name:zhou-enlai, name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-29.china-leadership-2
        when: May 29
        date: '1967-05-29'
        thread: china-leadership
        c: Zhou Enlai, after consulting Song Renqiong and Chen Xilian, talks with the rebels on the Anshan Iron and Steel problem.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Song Renqiong, Chen Xilian.'
        tags: [name:zhou-enlai, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-29.china-leadership-3
        when: May 29
        date: '1967-05-29'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai attends the Cultural Revolution Group's meeting on Henan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-30.china-leadership-2
        when: May 30
        date: '1967-05-30'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, told of heavy armed fights in Zhengzhou and of wounded left uncared for, has the Health Ministry send medical teams at once.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (under May 29, 1967). Made public: 2020. See [[cal.1967-05-29.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-30.china-leadership
        when: May 30
        date: '1967-05-30'
        thread: china-leadership
        c: 'Zhou Enlai has his secretary tell the liaison man in the health system that he has settled with the "Red Flag" faction of the Peking Traditional Medicine College: the Health Ministry''s ministers held at the Medical University are to be released today, to the State Council first.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 30, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-01.china-leadership-2
        when: June 1
        date: '1967-06-01'
        thread: china-leadership
        c: 'Zhou Enlai, after talking with Li Fuchun and Li Xiannian, receives the Health Ministry''s delegates: no random seizing; a man in danger of being seized reports at once; Qian Xinzhong and four other ministry heads to write their material at the State Council; health business cannot stop.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (under May 30, 1967). Made public: 2020. See [[cal.1967-05-30.china-leadership]]. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Qian Xinzhong.'
        tags: [name:zhou-enlai, name:li-fuchun, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-31.china-leadership-2
        when: May 31
        date: '1967-05-31'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, on the State Council liaison offices report that at Zhengzhou, Xuzhou, Bengbu, Jinhua, Xuanhua and other rail hubs armed fights have blown up locomotives and stopped work, leaving four main trunk lines (Peking–Canton, Tianjin–Pukou, Shanghai–Longhai, Zhejiang–Fujian) paralyzed, with 69 freight trains halted at Xuzhou alone, approves the urgent telegram of the 68th Army Party committee of the Jinan Military Region asking for military control of the Xuzhou railway sub-bureau and station.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154–155 (May 31, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-31.china-leadership-4
        when: May 31
        date: '1967-05-31'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai calls Li Fuchun, Li Xiannian, Ye Jianying, Xiao Hua, Yang Chengwu, Gu Mu and Yu Qiuli, and they fix measures: an order against stopping rail and ship traffic, issued quickly in public; the 18 railway administrations to nearby garrisons under military control, and coastal and river shipping to the navy; the General Staff to plan the troop movements by the next day. He sends the report to Mao.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (May 31, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Ye Jianying, Xiao Hua, Yang Chengwu, Gu Mu, Yu Qiuli.'
        tags: [name:zhou-enlai, name:li-fuchun, name:li-xiannian, name:ye-jianying, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05.china-leadership-3
        when: May
        date: 1967-05
        thread: china-leadership
        c: By Zhou Enlai's desk calendar, in May, besides meetings, he talked with central, local and army leaders over thirty times and received delegates of mass bodies 28 times.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (May 1967, the last item). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-01.china-leadership
        when: June 1
        date: '1967-06-01'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Cultural Revolution Group members on Guangxi.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (June 1, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-02.china-leadership
        when: June 2
        date: '1967-06-02'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks before dawn with the Guangxi Military Region's heads.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (under June 1, 1967). Made public: 2020. See [[cal.1967-06-01.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-03.china-leadership
        when: June 3
        date: '1967-06-03'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, with Military Commission and Cultural Revolution Group heads, talks with the Henan Military District's He Yunhong and others on Henan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (June 3, 1967). Made public: 2020. Names: Zhou Enlai, He Yunhong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-13.china-leadership
        when: June 13–15
        date: '1967-06-13'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives the delegates of Henan's two factions.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (under June 3, 1967). Made public: 2020. See [[cal.1967-06-03.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-04.china-leadership
        when: June 4
        date: '1967-06-04'
        thread: china-leadership
        c: Zhou Enlai tells his secretary to tell the Seventh Ministry of Machine Building's "Sept. 16" rebel body, which holds the Defense Ministry's building, to leave at once or he will not receive them.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (June 4, 1967). Made public: 2020. Names: Zhou Enlai. Check: the day; the chronology gives it under June 3–5.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-04.china-leadership-2
        when: June 4
        date: '1967-06-04'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, from 10 p.m. to 4 a.m., receives delegates of the defence-industry mass bodies and military control committees. The Seventh Ministry's "Sept. 16" body's loudspeakers calling to fire on Nie Rongzhen are an extreme-Left error. Criticism to leave working hours; the wind of beating is not to grow, the control committees authorized to arrest gang-fighters; the six machine-building ministries to be put under military control; "renegade" material goes to the Center.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (June 4, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen. Check: the day; the chronology gives it after the June 3 item, "that evening 10 p.m. to 4 a.m."'
        tags: [name:zhou-enlai, name:nie-rongzhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-05.china-leadership
        when: June 5
        date: '1967-06-05'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls an enlarged liaison meeting of the Standing Committee on the draft general order of the Center, State Council, Military Commission and Cultural Revolution Group; the Center's Notice on the question of "catching renegades" (second draft); the notice on carrying revolution further, promoting production, raising income and saving outlay; the plan for full military control of the Railways Ministry (draft); and the supplementary decision on military control of the defence-industry ministries, the National Defence Science and Technology Research Academy and their units (draft).
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (June 5, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-06-06.china-leadership-3
        when: June 6
        date: '1967-06-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, on the Zhejiang "United General Headquarters" rebels storming the Hangzhou Silk Printing and Dyeing Mill, smashing machines and seizing men, with large-scale armed fighting and bloodshed, orders the Zhejiang military control committee to send troops in to separate the two sides.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (June 6, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-11.china-leadership-3
        when: June 11
        date: '1967-06-11'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, told of another large armed fight of Zhejiang's "United Headquarters" and "Red Violence" factions, orders the Zhejiang garrison and the two bodies to send delegates to Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (under June 6, 1967). Made public: 2020. See [[cal.1967-06-06.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-13.china-leadership-2
        when: June 13
        date: '1967-06-13'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives Zhejiang's delegates.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (under June 6, 1967). Made public: 2020. See [[cal.1967-06-06.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-06.china-leadership-4
        when: June 6
        date: '1967-06-06'
        thread: china-leadership
        c: 'Zhou Enlai talks with the staff attending the Afro-Asian Writers meeting: a serious international meeting cannot have views forced on it; some foreigners are progressive, some patriotic; allow differing views, no uniformity; Marxism-Leninism and Mao Zedong Thought must be open to discussion.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156–157 (June 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-06-09.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 9, 1967; Zhou with Mao at the reception of the delegates to the Afro-Asian writers meeting)'
  - add:
      entry:
        id: cal.1967-06-09.china-leadership-2
        when: June 9
        date: '1967-06-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, with Center leaders and Cultural Revolution Group members, hears Wen Yucheng on the Cultural Revolution in Canton: conservative bodies are to be united and educated, not overthrown; help the mass bodies to a great alliance. To name Tao Zhu in the press must be put to Mao. On the factional fighting in the railway offices: "military control is unavoidable." He continues with Wen that evening.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 9, 1967). Made public: 2020. Names: Zhou Enlai, Wen Yucheng, Tao Zhu.'
        tags: [name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-11.china-leadership
        when: June 11
        date: '1967-06-11'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, with Li Xiannian and Lu Xuzhang, meets the Foreign Trade Ministry''s Canton fair assistance group and its two factions, and sharply criticizes their fights and their seizing and holding of leading cadres: "you overthrow Politburo members at will." The verdict of enemy contradiction on the dying Ye Jizhuang is wrong. Both sides to agree: no seizing, beating or storming; criticism meetings of three hours at most.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 11, 1967). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Lu Xuzhang, Ye Jizhuang.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-11.china-leadership-2
        when: June 11–13
        date: '1967-06-11'
        thread: china-leadership
        c: 'Zhou Enlai receives the farm branch''s rebels twice, the 11th and 13th. To the demand to drag out Tan Zhenlin: he has read their material on Tan, which must be verified; no such early conclusion. "I am in poor health and work so many hours a day; how can I stand it? I have not yet fallen; I hope you will not either."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 11, 13, 1967). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin.'
        tags: [name:zhou-enlai, name:tan-zhenlin, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-12.china-leadership
        when: June 12
        date: '1967-06-12'
        thread: china-leadership
        c: Zhou Enlai attends the memorial meeting for Jiang Guangnai.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 12, 1967). Names: Zhou Enlai, Jiang Guangnai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-06-12.china-leadership-2
        when: June 12
        date: '1967-06-12'
        thread: china-leadership
        also: [testing, china]
        c: 'Zhou Enlai chairs the Central Special Commission with Li Fuchun, Ye Jianying and Nie Rongzhen and hears Luo Shunchu report the preparations for the hydrogen bomb test: no empiricism; the test has new features; after the general rehearsal on the 13th the bomb''s assembly to be fully checked again; Nie Rongzhen to direct on the site. Safety outside the test area is put under Zhou, Li Fuchun and Luo Shunchu.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157–158 (June 12, 1967). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Ye Jianying, Nie Rongzhen, Luo Shunchu.'
        tags: [name:zhou-enlai, name:li-fuchun, name:ye-jianying, name:nie-rongzhen, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-06-17.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 17, 1967; China''s first hydrogen bomb explodes)'
  - add:
      entry:
        id: cal.1967-06-14.china-leadership
        when: June 14
        date: '1967-06-14'
        thread: china-leadership
        c: Zhou Enlai, after talking with Song Renqiong, talks with Li Fuchun and Chen Xilian on Anshan Iron and Steel; Li, on Zhou's instruction, had earlier held four meetings with the mills delegates.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 14, 1967). Made public: 2020. Names: Zhou Enlai, Song Renqiong, Li Fuchun, Chen Xilian.'
        tags: [name:zhou-enlai, name:li-fuchun, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-14.china-leadership-2
        when: June 14
        date: '1967-06-14'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, on an international train stopped at Liuzhou in Guangxi, sends for the delegates of the two Guangxi factions in Peking and orders them to telephone home at once to keep the train running.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-14.china-leadership-3
        when: June 14
        date: '1967-06-14'
        thread: china-leadership
        c: Zhou Enlai writes Mao asking him to call a meeting to hear a report on the national economy and the arrangement of the 1967 plan, and proposes the attendance go to the twenty-two or three of the liaison meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-15.china-leadership-2
        when: June 15
        date: '1967-06-15'
        thread: china-leadership
        c: Zhou Enlai goes to Mao's for the meeting on the national economy and the 1967 plan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (under June 14, 1967). Made public: 2020. See [[cal.1967-06-14.china-leadership-3]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-15.china-leadership
        when: June 15
        date: '1967-06-15'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai sends a plane to bring Zhang Boseng, Wang Caifang and others from Hunan to Peking and puts them up at the Jingxi Hotel.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 15, 1967). Made public: 2020. Names: Zhou Enlai, Zhang Boseng, Wang Caifang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-16.china-leadership-2
        when: June 16
        date: '1967-06-16'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai tells Zhang Boseng and the Hunan cadres brought to Peking to tell Hunan''s two factions: no street marches, no storming of others, no armed fighting, no calling peasants into town; study and produce well. "Whoever does these best holds Mao Zedong Thought''s red flag highest."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (under June 15, 1967). Made public: 2020. See [[cal.1967-06-15.china-leadership]]. Names: Zhou Enlai, Zhang Boseng, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-16.china-leadership
        when: June 16
        date: '1967-06-16'
        thread: china-leadership
        c: 'Zhou Enlai, before dawn, receives the rebels of the Foreign Trade, Finance, Commerce and Grain ministries and sharply criticizes their meeting of the 13th to down Li Xiannian, held against his dissuasion: "I do not agree to downing Li Xiannian"; to call a Politburo member "chief renegade" without verification pleases only the enemy. Chen Guodong is needed on the grain front. They are to send back by a set time the leading cadres they hold.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158–159 (June 16, 1967). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Chen Guodong.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-17.china-leadership-2
        when: June 17
        date: '1967-06-17'
        thread: china-leadership
        also: [china, south-asia]
        c: Zhou Enlai meets the core group of the Foreign Ministry's "Liaison Station" and its business supervision group on the wrecking of the Chinese embassy in India.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159 (June 17, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-17.china-leadership-3
        when: June 17
        date: '1967-06-17'
        thread: china-leadership
        c: 'Zhou Enlai receives the delegates of the two factions of the Health Ministry and asks about the rural medical teams sent down: go quickly into the villages, investigate, and take up the patriotic health campaign, prevention first.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159 (June 17, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-06-20.china-leadership-2
        when: June 20
        date: '1967-06-20'
        thread: china-leadership
        c: 'Zhou Enlai, in the evening, receives the first medical teams about to go to the Northwest: work and propaganda teams, not to link up; to investigate, treat and prevent disease, spread the patriotic health campaign and train village health workers.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159 (under June 17, 1967). Made public: 2020. See [[cal.1967-06-17.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-06-20.china-leadership
        when: June 20
        date: '1967-06-20'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai sends a plane to bring Liu Ruisen and others to Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159 (June 20, 21, 1967). Made public: 2020. Names: Zhou Enlai, Liu Ruisen.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-21.china-leadership-3
        when: June 21
        date: '1967-06-21'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, receiving Liu Peishan and Liu Ruisen, gives six rules on Jiangxi: no street marches; no armed fighting or storming; no disturbing traffic; no random arrests; no calling peasants into town; no shooting and no seizing power.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159 (under June 20, 1967). Made public: 2020. See [[cal.1967-06-20.china-leadership]]. Names: Zhou Enlai, Liu Peishan, Liu Ruisen.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-21.china-leadership-2
        when: June 21–25
        date: '1967-06-21'
        thread: china-leadership
        also: [africa]
        c: Zambia's President Kaunda visits China; Zhou Enlai receives him and holds talks with him from the 21st to the 25th.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159–160 (June 21–25, 1967). Made public: 2020. Names: Zhou Enlai, Kaunda.'
        tags: [name:zhou-enlai, name:kaunda-kenneth-d, polity:prc, vis:only:prc+zambia]
  - add:
      entry:
        id: cal.1967-06-22.china-leadership
        when: June 22
        date: '1967-06-22'
        thread: china-leadership
        also: [africa, testing]
        c: 'Zhou Enlai, in talks with Kaunda: imperialism frightens people with atom, missile and hydrogen bombs and wants a monopoly of them; the imperialists'' "non-proliferation" is a lie, meaning nuclear monopoly.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 22, 1967). Made public: 2020. Names: Zhou Enlai, Kaunda.'
        tags: [name:zhou-enlai, name:kaunda-kenneth-d, polity:prc, vis:only:prc+zambia]
  - add:
      entry:
        id: cal.1967-06-23.china-leadership
        when: June 23
        date: '1967-06-23'
        thread: china-leadership
        also: [africa, testing]
        c: 'Zhou Enlai, in talks with Kaunda: to hold national independence one must win economic independence.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (under June 22, 1967). Made public: 2020. See [[cal.1967-06-22.china-leadership]]. Names: Zhou Enlai, Kaunda.'
        tags: [name:zhou-enlai, name:kaunda-kenneth-d, polity:prc, vis:only:prc+zambia]
  - cite:
      id: cal.1967-06-24.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 24, 1967; Zhou with Mao at the reception of Kaunda; Zhou takes Kaunda and his wife to Shanghai on the 25th)'
  - add:
      entry:
        id: cal.1967-06-25.china-leadership
        when: June 25
        date: '1967-06-25'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai, in talks with Kaunda, gives China''s three principles for Chinese aid experts abroad: no interference in the host country''s internal affairs, serve the people wholeheartedly; teach the host country''s people, then return quickly; pay and treatment exactly equal to the host country''s technicians, no privilege and no great-power chauvinism.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 25, 1967). Made public: 2020. Names: Zhou Enlai, Kaunda.'
        tags: [name:zhou-enlai, name:kaunda-kenneth-d, polity:prc, vis:only:prc+zambia]
  - add:
      entry:
        id: cal.1967-06-24.china-leadership-2
        when: June 24
        date: '1967-06-24'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of the Center''s ministries and the delegates attending the coming national ordering conference: no side is to storm it, and each is to sign a pledge on the spot. The ordering is two quarters late and may not be put off again; let this test whether they are true rebels. Cadres: free a big batch.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 24, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-24.china-leadership-3
        when: June 24
        date: '1967-06-24'
        thread: china-leadership
        c: 'Zhou Enlai receives the heads of the military control delegations of the provinces and municipalities attending the national production, supply and marketing conference: military control must be made to work, whichever the faction; none may keep rules above the military control committees. The June 6 general order was drawn by the Center, State Council, Military Commission and Cultural Revolution Group and approved by Mao and Lin Biao and must be obeyed.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-25.china-leadership-2
        when: June 25
        date: '1967-06-25'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, at Shanghai after seeing Kaunda off, talks with Shanghai''s cadres and mass delegates. He cannot sleep in Shanghai: the problems of six provinces (Jiangxi, Guangxi, Henan, Hunan, Zhejiang and one more) must be settled back in Peking; he leaves at once. On the three-in-one: Mao says provinces and cities need cadres in command; young Red Guards go up one day and are downed the next, politically immature, not yet fit to head a provincial or municipal revolutionary committee.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160–161 (June 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-26.china-leadership
        when: June 26
        date: '1967-06-26'
        thread: china-leadership
        c: Zhou Enlai returns to Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 26, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-26.china-leadership-2
        when: June 26
        date: '1967-06-26'
        thread: china-leadership
        also: [japan]
        c: 'Zhou Enlai receives the head of a Japanese scientific instruments exhibition group, (Jinyuan Dingsi, 靳原定司), and the trade unionist Takano Minoru. Will the Cultural Revolution knock down all China''s traditional culture and all with a popular character? No: much that is excellent in the literary and artistic heritage and in what is of the people is to be inherited critically.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Takano Minoru.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1967-06-28.china-leadership
        when: June 28
        date: '1967-06-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks with Chen Yi, the Foreign Ministry''s Party group, the heads of the ministry''s business supervision groups, the core group of its "Rebel Liaison Station" and the heads of its mass bodies on the ministry''s movement and business. On the rebels'' wish to criticize Chen Yi: the best way is what he proposed, with a smaller scope; "I said long ago you may state your views on Marshal Chen, but the Center has made no conclusion and you cannot impose one on me."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 28, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-28.china-leadership-2
        when: June 28
        date: '1967-06-28'
        thread: china-leadership
        c: Zhou Enlai, told that armed fights between two factions at Plant 404 have stopped 80 percent of its shops, tells Nie Rongzhen to call a meeting and have the parties concerned send delegates to Peking to settle it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen.'
        tags: [name:zhou-enlai, name:nie-rongzhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-29.china-leadership
        when: June 29
        date: '1967-06-29'
        thread: china-leadership
        c: 'Zhou Enlai, on students of the Peking Institute of Civil Engineering taking turns at Zhongnanhai''s west gate to demand Liu Shaoqi be seized: Wang Dongxing is to persuade them to go back, and Zhou will guarantee Liu hands in a written self-criticism; if they will not go after the persuasion, Qi Benyu is to deal with it.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 29, 1967). Made public: 2020. Names: Zhou Enlai, Wang Dongxing, Liu Shaoqi, Qi Benyu.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-29.china-leadership-2
        when: June 29
        date: '1967-06-29'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, told that over ten thousand students and workers have left Chengdu to petition in Peking, wires the Mianyang county committee for the "Red Guard Chengdu Corps Going to Peking to Petition": keep the Center''s notice of Apr. 20; such numbers hinder traffic and production; stop at Mianyang, send ten delegates by train and the rest back to Chengdu.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161–162 (June 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-01.china-leadership
        when: July 1
        date: '1967-07-01'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai wires Zhang Guohua at Mianyang for the Chengdu petitioners, dissuading them from bringing over 50,000 to Peking, which harms production, Third Front construction and transport.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161–162 (under June 29, 1967). Made public: 2020. See [[cal.1967-06-29.china-leadership-2]]. Names: Zhou Enlai, Zhang Guohua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-10.china-leadership-3
        when: July 10
        date: '1967-07-10'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai and Chen Boda wire the "Red Cheng Headquarters" to turn back the eight or nine thousand of its petitioners still on the way to Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161–162 (under June 29, 1967). Made public: 2020. See [[cal.1967-06-29.china-leadership-2]]. Names: Zhou Enlai, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-29.china-leadership-3
        when: June 29
        date: '1967-06-29'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks three times with the Jiangxi Military District and the delegates of both Jiangxi factions in Peking, criticizing the claim that the rebels'' most pressing task is "the gun". Both sides are to telephone home at once, leave the military organs and return arms, and agree: no marches, fights or storming, no seizing men, no hindering transport, no calling peasants into town, no seizing power, no shooting.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 162 (June 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-29.china-leadership-4
        when: June 29
        date: '1967-06-29'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, receiving the Guangxi factions' delegates for the fourth time, tells them first to "cool off" and study Mao's "On the Correct Handling of Contradictions among the People", then agree to carry out the Center's notice of June 24.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 162–163 (June 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-04.china-leadership-3
        when: July 4
        date: '1967-07-04'
        thread: china-leadership
        also: [china]
        c: The Guangxi factions' delegates in Peking reach a ten-point agreement to carry out the Center's notice of June 24.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 162–163 (under June 29, 1967). Made public: 2020. See [[cal.1967-06-29.china-leadership-4]]. Names: Zhou Enlai.'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-05.china-leadership-2
        when: July 5
        date: '1967-07-05'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai orders the Guangxi ten-point agreement printed for all the Guangxi delegates, and the two factions and the Military Region to telegraph and telephone it home for the whole region.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 162–163 (under June 29, 1967). Made public: 2020. See [[cal.1967-06-29.china-leadership-4]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-06-30.china-leadership
        when: June 30
        date: '1967-06-30'
        thread: china-leadership
        c: Zhou Enlai attends the memorial meeting for Ye Jizhuang.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 163 (June 30, 1967). Names: Zhou Enlai, Ye Jizhuang.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-06.china-leadership
        when: June
        date: 1967-06
        thread: china-leadership
        c: 'Zhou Enlai, when Kang Sheng pins the label "three surrenders and one extermination" on the foreign-affairs line, asks him to his face: the Foreign Ministry''s general policy, whether under him as concurrent minister or under Chen Yi, passed through his hands and was sent to Mao; the foreign policy is basically Mao''s, and they handle the details. Kang pleads he meant Wang Jiaxiang of the Liaison Department.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 163 (June 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Chen Yi, Wang Jiaxiang, Mao Zedong.'
        tags: [name:zhou-enlai, name:kang-sheng, name:chen-yi, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967.china-leadership-5
        when: 1967, first half
        date: '1967'
        thread: china-leadership
        c: In the first half of the year, as State Council ministers were seized for struggle, Zhou Enlai, Li Fuchun and Li Xiannian in turn took them to live in Zhongnanhai for protection, for days, weeks, or a year or more. Over forty were sheltered, among them Yu Qiuli, Gu Mu, Wang Zhen, Liao Chengzhi, Fang Yi, Yao Yilin, Zhou Rongxin, Lü Dong, Liu Lanbo, Qian Xinzhong and Zhang Jingwu.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 163–164 (first half of 1967). Made public: 2020. Names: Zhou Enlai, Yu Qiuli, Gu Mu, Liao Chengzhi, Fang Yi, Yao Yilin, Zhou Rongxin, Lü Dong, Liu Lanbo.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967.china-leadership-6
        when: 1967, first half
        date: '1967'
        thread: china-leadership
        c: 'In the first half of the year, while leaders of the regions and provinces were under attack, Zhou Enlai ignores Jiang Qing''s and Kang Sheng''s inquiries after them and, with Fu Chongbi''s help, lodges the hardest-pressed under guard at the Jingxi Hotel and the Central Organs hostel: Li Jingquan, Song Renqiong, Zhang Pinghua, Ye Fei, Jiang Hua, Tan Qilong, Jiang Weiqing, Huo Shilian, Wang Heshou and others. Mao approves.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 164 (first half of 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Jingquan, Song Renqiong, Zhang Pinghua, Ye Fei, Jiang Hua, Tan Qilong, Jiang Weiqing, Mao Zedong, Fu Chongbi.'
        tags: [name:zhou-enlai, name:li-jingquan, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-02.china-leadership
        when: July 2
        date: '1967-07-02'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives, in the evening, delegates of Henan''s "Feb. 7 Commune" and "Revolutionary Rebel General Command" on the stoppage of rail traffic at Anyang: they are to send men back at once to find the cause with the Center''s delegate. To mark the Party''s birthday by stopping production goes against Mao Zedong Thought. The Henan Military District is to stop the subdistricts calling peasants to town for armed fights and seal the guns. He then talks with the Railways Ministry''s control group on Anyang.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 164 (July 2, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-07-04.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 164 (July 3, 1967; Zhou''s letter to Mao and Lin Biao on Jiangxi, asking to move a division of the 26th Army into Jiangxi to back the Left and strengthen the military control committee and the coming revolutionary committee; Mao, July 4: wait until the Jiangxi conference shows some result)'
  - add:
      entry:
        id: cal.1967-07-03.china-leadership
        when: July 3–8
        date: '1967-07-03'
        thread: china-leadership
        also: [soviet-union]
        c: Romania's Premier Maurer visits China; Zhou Enlai receives him and holds many talks with him.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 164–165 (July 3–8, 1967). Made public: 2020. Names: Zhou Enlai, Maurer.'
        tags: [name:zhou-enlai, name:maurer-ion-gheorghe, polity:prc, vis:only:prc+romania]
  - add:
      entry:
        id: cal.1967-07-04.china-leadership-2
        when: July 4
        date: '1967-07-04'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates of Henan''s factions: on flood prevention, whichever sides view, all prevent floods together; no robbing of flood-prevention gear and what was taken is to be recovered; the leaders of any who rob it or beat flood-prevention staff are to be arrested and punished, for it is a matter of the lives of thousands; flood prevention is finally under the military control side. Both sides to telephone home and issue a joint notice.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July 4, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-06.china-leadership-3
        when: July 6–9
        date: '1967-07-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai goes to Mao's for meetings on July 6, 7 and 9. Mao proposes a journey south, to Wuhan, to swim the Yangtze.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July 6, 7, 9, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-10.china-leadership-4
        when: July 10
        date: '1967-07-10'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai telephones the Wuhan Military Region that the Wuhan mass bodies' delegates need not come to Peking and are to settle matters in Wuhan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (under July 6, 1967). Made public: 2020. See [[cal.1967-07-06.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07.china-leadership
        when: July, mid
        date: 1967-07
        thread: china-leadership
        also: [china]
        c: In the first ten days and the middle of July armed fighting in Changsha, Hunan, kills a dozen or more. To settle Hunan Zhou Enlai talks in turn with the Hunan Military District, the Party committees heads and the mass bodies.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July, early and mid 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
        at: before 1967-07-11
  - add:
      entry:
        id: cal.1967-07-09.china-leadership
        when: July 9
        date: '1967-07-09'
        thread: china-leadership
        c: Zhou Enlai has the Railways Ministry's production command group find out how the Peking–Canton and Baoji–Chengdu trunk lines are blocked.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July 9, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-10.china-leadership
        when: July 10
        date: '1967-07-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai hears Huang Yongsheng on Guangdong: a great alliance with the Left as its core is no monopoly; "conservatives" cannot be excluded, or the Red Congress will not be approved. On Hong Kong: force there does not fit present policy; China leaves Macao as an opening to the market; the struggle in Hong Kong is long and not to be hurried.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July 10, 1967). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
        tags: [name:zhou-enlai, name:huang-yongsheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-10.china-leadership-2
        when: July 10
        date: '1967-07-10'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives the delegates of both Jiangxi factions in Peking on an agreement to carry out the Center's "June 24" notice and his instructions. The masses may have radicals and gradualists; "conservative" is not to be lumped with reactionary and counter-revolutionary, it is still among the people. If all were rebels they would go to the extreme Left.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165–166 (July 10, 1967, the item after). Made public: 2020. To check: the Center''s Several Decisions on the Jiangxi Question, as issued. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-11.china-leadership
        when: July 11
        date: '1967-07-11'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls the Jiangxi Military District's cadres in Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165–166 (under July 10, 1967). Made public: 2020. See [[cal.1967-07-10.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-13.china-leadership-4
        when: July 13
        date: '1967-07-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the Jiangxi delegates and reads and explains the Center''s Several Decisions on the Jiangxi Question: no small moves on return, no mass meeting to seize and struggle against anyone; armed fights and beating are against Mao Zedong Thought.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165–166 (under July 10, 1967). Made public: 2020. See [[cal.1967-07-10.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-12.china-leadership-2
        when: July 12
        date: '1967-07-12'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls the Center's liaison meeting at Diaoyutai on the Center's Instruction on Building Statues of Mao and its Notice Forbidding Stirring Peasants to Armed Fights in Towns.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 12, 1967). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - cite:
      id: cal.1967-07-13.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 13, 1967; Zhou''s draft Center notice forbidding the stirring of peasants into towns for armed fights; the instruction on statues of Mao)'
  - add:
      entry:
        id: cal.1967-07-12.china-leadership-3
        when: July 12
        date: '1967-07-12'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives delegates of the foreign-affairs systems mass bodies and criticizes the extreme "Left" practice of Chinese embassy staff abroad forcing foreign friends to wear Mao badges in their propaganda.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 12, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-13.china-leadership-3
        when: July 13
        date: '1967-07-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reviews and signs the State Council''s and Military Commission''s telegram to the military control committee of Plant 221 and the "Prairie Red Rebel Headquarters" and other bodies: stop the armed fight at once, and quickly restore production and normal order.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-14.china-leadership-2
        when: July 14
        date: '1967-07-14'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai leaves Peking at 2:30 a.m. for Wuhan. On arrival he talks in turn with the heads of the Wuhan Military Region and the Wuhan air force, and in the evening goes to Mao's.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 14, 1967). Made public: 2020. See [[cal.1967-07-14.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-15.china-leadership
        when: July 15–17
        date: '1967-07-15'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls the meeting of the heads of the Wuhan Military Region, the Hubei Military District and the Wuhan air force and hears their reports. Before it he tells Zhong Hanhua that Mao, setting out, told him to go to Wuhan to protect Chen Zaidao.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 15–18, 1967). Made public: 2020. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-18.china-leadership-4
        when: July 18
        date: '1967-07-18'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai sums up the meeting of the Wuhan Military Region''s heads: he affirms the Region''s work and proposes that Chen Zaidao and Zhong Hanhua admit of their own accord an error of direction and line in supporting the Left, the self-criticism meant to protect them, not to down them.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (under July 15, 1967). Made public: 2020. See [[cal.1967-07-15.china-leadership]]. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-16.china-leadership
        when: July 16
        date: '1967-07-16'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with the two factions at the East Lake hostel, Wuchang.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 16, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-07-17.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 17, 1967; Zhou at Mao''s with Xie Fuzhi and Wang Li, Yang Chengwu, Wang Dongxing, Yu Lijin and Zheng Weishan, hearing the Yunnan, Guizhou, Sichuan and Wuhan questions; Mao has Zhou go back to Peking on the 18th to settle Hunan; Mao says that the May 16 notice was fixed by him and Zhou on the spot and issued so fast that it raised much talk and the blame fell on Zhou)'
  - add:
      entry:
        id: cal.1967-07-17.china-leadership-2
        when: July 17
        date: '1967-07-17'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Chen Zaidao and Zhong Hanhua.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-18.china-leadership-2
        when: July 18
        date: '1967-07-18'
        thread: china-leadership
        c: While Zhou Enlai is away from Peking, Jiang Qing, Kang Sheng and Chen Boda stir rebels to seize and struggle against Liu Shaoqi, Deng Xiaoping and Tao Zhu and their wives, and raid their homes.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 18, 1967). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Kang Sheng, Chen Boda, Liu Shaoqi, Deng Xiaoping, Tao Zhu.'
        tags: [name:zhou-enlai, name:jiang-qing, name:kang-sheng, name:chen-boda, name:liu-shaoqi, name:deng-xiaoping, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-18.china-leadership-3
        when: July 18
        date: '1967-07-18'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, after the evening meeting at Mao's, flies back to Peking at 11:30 p.m.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 18, 1967, the item after). Made public: 2020. See [[cal.1967-07-18.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-19.china-leadership
        when: July 19
        date: '1967-07-19'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, in the evening, talks with the Hunan leaders and then receives the delegates of Hunan's two factions to settle the Changsha railway problem.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 19, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-07-20.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 20, 1967; the Wuhan Incident: Xie Fuzhi and Wang Li, the Center''s delegation, suppress the "Million Heroes" backed by the Wuhan Military Region and call it a "conservative organization"; on the 20th the Heroes haul Wang Li from his lodging to the Region''s compound and question him; Wang is later falsely made out to have been a "mutiny" by Chen Zaidao, a "counter-revolutionary incident")'
  - add:
      entry:
        id: cal.1967-07-20.china-leadership-2
        when: July 20
        date: '1967-07-20'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai goes to Lin Biao's for a meeting and in the afternoon flies to Wuhan. Wu Faxian falsely says Chen Zaidao has sent troops to ring the Wangjiadun airfield to seize Zhou, and has Zhou's plane diverted to a hillside field over sixty kilometers from Wuhan. Zhou leaves his secretary and two companies of guards at the hillside field and, with two bodyguards, drives to the city to talk with Wuhan Region cadres and steady the situation.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 20, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Lin Biao, Wu Faxian, Chen Zaidao.'
        tags: [name:zhou-enlai, name:lin-biao, name:wu-faxian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-22.china-leadership-4
        when: July 22
        date: '1967-07-22'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls Ye Ming, Kong Qingde, Li Zuopeng and Liu Feng at the Wangjiadun airfield, Wuhan, and has Kong Qingde run the Wuhan Military Region for the time. The Wuhan air force is under double leadership and is to follow the Region's command, not take stands at will. Chen Zaidao and Zhong Hanhua are to take a stand quickly and win the initiative. In the afternoon he flies back to Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967). Made public: 2020. Names: Zhou Enlai, Ye Ming, Kong Qingde, Li Zuopeng, Liu Feng, Chen Zaidao, Zhong Hanhua.'
        tags: [name:zhou-enlai, name:li-zuopeng, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-07-22.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967; Zhou at the full meeting of the Cultural Revolution Group under Lin Biao, who calls the July 20 incident a "counter-revolutionary riot")'
  - add:
      entry:
        id: cal.1967-07-22.china-leadership-5
        when: July 22
        date: '1967-07-22'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai drafts the Center''s telegram to the Wuhan Military Region: the Center considers that the Million Heroes coming to Peking with delegates will not soon be settled and that Wuhan needs quick calming, so asks Chen Zaidao, Zhong Hanhua, Fu Chuanzuo, Liu Feng, Niu Huailong and seven others to come to Peking first for a talk.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua, Fu Chuanzuo, Liu Feng, Niu Huailong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-07-22.china-leadership-3
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967; Jiang Qing, receiving Henan''s mass delegates, affirms "attack by argument, defend by force" and urges that they keep their arms; the slogan is printed in Shanghai''s *Wenhui bao* the next day and armed fights across the country sharply rise)'
  - add:
      entry:
        id: cal.1967-07-23.china-leadership
        when: July 23
        date: '1967-07-23'
        thread: china-leadership
        c: Zhou Enlai goes to Lin Biao's for meetings on the 23rd and 24th.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 23, 24, 1967). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
        tags: [name:zhou-enlai, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-24.china-leadership-2
        when: July 24
        date: '1967-07-24'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai lodges Chen Zaidao and eleven others, come to Peking, at the Jingxi Hotel and tells them to keep it secret. Told that rebels backed by the Cultural Revolution Group are surrounding and storming the hotel to drag them out for struggle, he sends Fu Chongbi and others to the spot: in no case may they be taken; Chen Zaidao and Zhong Hanhua are to be protected. He then orders Qi Benyu to deal with it: "if they are taken away you must answer to the Chairman." Qi is made to go and tell the rebels to leave.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua, Fu Chongbi, Qi Benyu, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-24.china-leadership-3
        when: July 24
        date: '1967-07-24'
        thread: china-leadership
        c: Zhou Enlai hears Yang Chengwu, who returned to Peking from Mao's southern tour.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 24, 1967, the item after). Made public: 2020. See [[cal.1967-07-24.china-leadership]]. Names: Zhou Enlai, Yang Chengwu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-07-25.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 25, 1967; Zhou at the Tiananmen rally of a million welcoming Wang Li back "in victory")'
  - add:
      entry:
        id: cal.1967-07-25.china-leadership-3
        when: July 25
        date: '1967-07-25'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the delegates of both Anshan factions and sharply criticizes the two for harming output by faction: unite and go back at once to restore production. He cannot believe the Anshan question cannot be solved; if he could find time he would go; output has fallen to a thousand-odd tons a day and many coke ovens have stopped; he does not believe Anshan''s working class can watch it collapse without pain.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168–169 (July 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai. Check: the chronology''s note says that Jiang Qing, Chen Boda, Kang Sheng and Zhang Chunqiao first opposed Zhou''s proposal that Li Fuchun go to Anshan, then proposed Guan Feng, and that Zhou did not agree.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-26.china-leadership-2
        when: July 26
        date: '1967-07-26'
        thread: china-leadership
        c: Zhou Enlai talks before dawn with Wu Faxian, Zhang Xiuchuan, Zheng Weishan, Tan Furen, Huang Yongsheng and Chen Xilian.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 26, 1967). Made public: 2020. Names: Zhou Enlai, Wu Faxian, Zheng Weishan, Huang Yongsheng, Chen Xilian.'
        tags: [name:zhou-enlai, name:wu-faxian, name:huang-yongsheng, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-26.china-leadership-3
        when: July 26
        date: '1967-07-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai chairs, at the Jingxi Hotel, the enlarged liaison meeting of the Standing Committee: Politburo members, Cultural Revolution Group members, heads of the General Department''s and services and the regional and military-district heads in Peking. Xie Fuzhi and Wu Faxian call Chen Zaidao and others the "ringleaders" of the "July 20 counter-revolutionary riot" and attack Xu Xiangqian. Wu Faxian also fights Chen Zaidao and the others, for which Zhou rebukes him sharply; Jiang Qing praises Wu for "the rebel spirit".'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 26, 1967, the item after). Made public: 2020. See [[cal.1967-07-26.china-leadership]]. Names: Zhou Enlai, Xie Fuzhi, Wu Faxian, Chen Zaidao, Xu Xiangqian, Jiang Qing.'
        tags: [name:zhou-enlai, name:xie-fuzhi, name:wu-faxian, name:xu-xiangqian, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-26.china-leadership-4
        when: July 26
        date: '1967-07-26'
        thread: china-leadership
        c: Zhou Enlai goes in the evening to Lin Biao's for a meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
        tags: [name:zhou-enlai, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-27.china-leadership-2
        when: July 27
        date: '1967-07-27'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the Hunan Military District''s heads and the delegates of Hunan''s two factions and criticizes the rebels looting of arsenals: both sides to seal the arms they hold and agree under the 47th Army''s leadership. On the Wuhan "July 20 incident": a good thing about them is they do not change names, "Million Heroes" and the independent division both wear armbands; the Million Heroes erred but are a mass body and can be educated. Qi Benyu cuts in: the Million Heroes cannot be praised.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 27, 1967). Made public: 2020. Names: Zhou Enlai, Qi Benyu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-07-27.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 26–27, 1967; Lin Biao presides over the meeting that settles the Wuhan matter; Zhou''s attendance and his meetings before and after)'
  - add:
      entry:
        id: cal.1967-07-28.china-leadership
        when: July 28
        date: '1967-07-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives, before dawn, delegates of the two Jiangxi factions and asks the provincial preparatory committee for a great alliance to unite the more conservative bodies: keep a high posture, for it is a contradiction among the people, only a matter of understanding. Of "Baiji", the term some use for Wuhan''s "Million Heroes": abuse is the Kuomintang''s method, not ours.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 28, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-28.china-leadership-2
        when: July 28
        date: '1967-07-28'
        thread: china-leadership
        c: Zhou Enlai goes to the Cultural Revolution Group's meeting on stopping the seizing of arms.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-29.china-leadership
        when: July 29
        date: '1967-07-29'
        thread: china-leadership
        c: Zhou Enlai tells the Peking garrison through his secretary to get Zhang Tixue, Ye Fei and Zhang Pinghua back from Han Aijing, whose Peking Aeronautics Institute "Red Flag" men seized them.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 29, 1967). Made public: 2020. Names: Zhou Enlai, Zhang Pinghua, Ye Fei.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-29.china-leadership-2
        when: July 29
        date: '1967-07-29'
        thread: china-leadership
        c: 'Tsinghua rebels raid Xu Xiangqian''s home and carry off many secret papers. Zhou Enlai, told of it, orders: (1) everyone who entered Xu''s home to withdraw; (2) the safety of Xu, his family and staff guaranteed; (3) nothing in Xu''s home to be taken away, and the cabinet of files and papers already taken to be recovered in full from Tsinghua by the Peking garrison.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Xu Xiangqian.'
        tags: [name:zhou-enlai, name:xu-xiangqian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-29.china-leadership-3
        when: July 29–30
        date: '1967-07-29'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai meets three times with Xie Fuzhi, Yang Chengwu, Wang Li, Liu Feng and others on the Wuhan problem.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 29, 30, 1967). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi, Yang Chengwu, Wang Li, Liu Feng.'
        tags: [name:zhou-enlai, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-30.china-leadership
        when: July 30
        date: '1967-07-30'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, with Kang Sheng, receives the Henan Military District''s heads and the delegates of Henan''s two factions. Kang abuses Wuhan''s "Million Heroes" and calls Chen Zaidao a "counter-revolutionary". Zhou: do not call the Million Heroes "Hundred Bandits"; it is a mass body with a few bad heads, and its erring masses are to be welcomed back to their posts. Views on the army go in posters sent to it, not posted outside.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 30, 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Chen Zaidao.'
        tags: [name:zhou-enlai, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-30.china-leadership-2
        when: July 30
        date: '1967-07-30'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the Hunan Military District''s heads and delegates of Hunan''s two factions: if Hunan is not brought under control it is dangerous; the Region''s and subdistricts'' comrades must stop at once the reckless issue and seizing of guns; guns issued must be taken back.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170–171 (July 30, Aug. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-01.china-leadership-3
        when: Aug. 1
        date: '1967-08-01'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives the Hunan Military District's heads and the delegates of Hunan's two factions again.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170–171 (under July 30, 1967). Made public: 2020. See [[cal.1967-07-30.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-31.china-leadership-2
        when: July 31
        date: '1967-07-31'
        thread: china-leadership
        c: Zhou Enlai, after Mao's answer, fixes the guest list of the Aug. 1 reception with Liu Ningyi, Yang Chengwu and Wang Xinting, tells Xu Xiangqian himself and has Xu's route to the Great Hall chosen; in the evening he attends the reception.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171 (July 31, 1967). Made public: 2020. See [[cal.1967-07-31.china-leadership]]. Names: Zhou Enlai, Xu Xiangqian, Mao Zedong, Liu Ningyi, Yang Chengwu, Wang Xinting.'
        tags: [name:zhou-enlai, name:xu-xiangqian, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-01.china-leadership-2
        when: Aug. 1
        date: '1967-08-01'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, told that the Guangxi "Lianzhi" delegation in Peking has taken He Ximing and Huo Fan, called "historical counter-revolutionaries" and "renegades" by Kang Sheng, back to Nanning for struggle, wires that they be sent safely to Peking by a set date. In November the Lianzhi sends He and Huo back to Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171 (Aug. 1, 1967). Made public: 2020. Names: Zhou Enlai, He Ximing, Huo Fan, Kang Sheng.'
        tags: [name:zhou-enlai, name:kang-sheng, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-08-01.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171 (Aug. 1, 1967; the *Hongqi* editorial "The Proletariat Must Firmly Grasp the Gun", drafted under Guan Feng and passed by Chen Boda: to expose, defeat and discredit the small handful of power-holders on the capitalist road in the army, "the main direction of struggle")'
  - add:
      entry:
        id: cal.1967-08-02.china-leadership
        when: Aug. 2
        date: '1967-08-02'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Yang Dezhi, Cheng Shiqing, Liu Peishan and others on Jiangxi.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171 (Aug. 2, 3, 5, 1967). Made public: 2020. Names: Zhou Enlai, Yang Dezhi, Cheng Shiqing, Liu Peishan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-03.china-leadership-4
        when: Aug. 3, 5
        date: '1967-08-03'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives all the Jiangxi delegates in Peking: the military subdistricts and armed departments are not again to issue guns, and those issued are to be taken back; the mass bodies to stop armed fights and seizing guns, call no peasants into the towns, and trust the PLA.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171 (under Aug. 2, 1967). Made public: 2020. See [[cal.1967-08-02.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-03.china-leadership-3
        when: Aug. 3
        date: '1967-08-03'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai drafts the reply of the Center, State Council, Military Commission and Cultural Revolution Group to the Canton Military Region: agreed to take the "counter-revolutionary organization" hat off the "Aug. 1 Fighting Corps", but its form across trades was not right and is not to be restored after; Mao, reading it, adds: "but if other Canton mass bodies still cross trades, this one may for the time be allowed to, and be attached to a trade later."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171–172 (Aug. 3, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-08-05.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172 (Aug. 5, 1967; the *Renmin ribao* prints Mao''s "Bombard the Headquarters" with the editorial "Bombard the Bourgeois Headquarters", calling for criticism of "the biggest handful of power-holders in the Party on the capitalist road")'
  - add:
      entry:
        id: cal.1967-08-05.china-leadership-3
        when: Aug. 5
        date: '1967-08-05'
        thread: china-leadership
        c: 'Zhou Enlai goes to Tiananmen for the meeting marking the first anniversary of "Bombard the Headquarters". To Kuai Dafu and others who say it is now the "third great linking up" with Peking''s students to go all over the country: the estimate is wrong, the Center has no such estimate; the situation is one of great criticism and great alliance.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172 (Aug. 5, 1967, the item after). Names: Zhou Enlai, Kuai Dafu.'
        tags: [name:zhou-enlai, polity:prc]
  - cite:
      id: cal.1967-08-05.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172 (Aug. 5, 1967; since mid-July, under the prompting of Kang Sheng, Xie Fuzhi and Qi Benyu, over a hundred Peking mass bodies set up outside Zhongnanhai''s west gate the "Pull Out Liu Front Line", besiege Zhongnanhai and storm the State Council; Zhou criticizes the rebels many times and insists on not leaving Zhongnanhai, so that they never dare enter and the many leaders inside are protected; at Mao''s intervention the Front Line is removed)'
  - add:
      entry:
        id: cal.1967-08-06.china-leadership
        when: Aug. 6
        date: '1967-08-06'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the Foreign Ministry''s liaison station and delegates of the Peking Foreign Languages Institute and makes three rules with the rebels for the meeting of the foreign affairs branch to criticize Chen Yi: small meetings in the main; no shouts of "Down with" and no "Down with" banners; no insult to a mans dignity, no disguised armed fighting, no seizing of men.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172 (Aug. 6, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-06.china-leadership-2
        when: Aug. 6
        date: '1967-08-06'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, in the evening, receives Hunan''s delegates to Peking: seizing guns at random is unlawful; an error by the PLA in supporting the Left does not make it a black command; such disrespect for the field armies amounts to wanting no leadership and is anarchist. On transport: all bodies must unite on grasping revolution and promoting production; if transport stops the arteries are cut and the people''s livelihood suffers.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172–173 (Aug. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-07.china-leadership-3
        when: Aug. 7
        date: '1967-08-07'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai goes to the Foreign Ministry''s small hall for the foreign affairs branch''s meeting to criticize Chen Yi and, seeing a slogan "Down with the three-anti element Chen Yi", insists that the rebels take it down before he enters: "it was agreed yesterday."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173 (Aug. 7, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-08-07.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173 (Aug. 7, 1967; Xie Fuzhi to the whole Ministry of Public Security: smash the public security, procuratorial and judicial organs; the evil of the old machine smashed; from this the storming of those organs spreads and persecution of their staff grows; Aug. 24 Zhou tells the two Guangxi factions that the organs are to be seen as two sides and not all bad)'
  - cite:
      id: cal.1967-08-07.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173 (Aug. 7, 1967; Wang Li receives the Foreign Ministry rebels and stirs them to seize its power; he reports to Jiang Qing and Chen Boda, who back him; mid-month the rebels storm and smash the ministry''s political department, declare they hold the Party committees power and seal all vice-ministers offices)'
  - add:
      entry:
        id: cal.1967-08-08.china-leadership
        when: Aug. 8
        date: '1967-08-08'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, seeing the leaflet of Wang Li's speech of Aug. 7, sends it to Kang Sheng and Wang Li and proposes that the three of them talk. Kang and Wang do not come.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173 (Aug. 8, 1967). Made public: 2020. Names: Zhou Enlai, Wang Li, Kang Sheng.'
        tags: [name:zhou-enlai, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-08.china-leadership-2
        when: Aug. 8
        date: '1967-08-08'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai has the all-army Cultural Revolution Group's office for supporting the Left send at once the full account of the attacks on the Nanjing, Canton and Shenyang military regions, and calls the heads of the Canton and Shenyang Regions and of the three services in Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173–174 (Aug. 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-08.china-leadership-3
        when: Aug. 8
        date: '1967-08-08'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai approves the Zhejiang Military Region's headquarters, political and rear services departments to close their doors and take up the "four bigs".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-16.china-leadership-3
        when: Aug. 16
        date: '1967-08-16'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai telephones Chen Liyun and Nan Ping: the Zhejiang Military Region''s units are not to be in disorder; the rebels not to live in the Region; no linking up between army and people; troops form no fighting groups.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (under Aug. 8, 1967). Made public: 2020. See [[cal.1967-08-08.china-leadership-3]]. Names: Zhou Enlai, Chen Liyun, Nan Ping.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-09.china-leadership
        when: Aug. 9
        date: '1967-08-09'
        thread: china-leadership
        c: Zhou Enlai goes to Lin Biao's meeting, where Lin says this Cultural Revolution is "truly of the smallest cost and the greatest victory"; many Party and government organs are now paralyzed, outwardly in great disorder, but the disorder is "needed and normal"; "if it is to collapse, let it collapse".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 9, 1967). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
        tags: [name:zhou-enlai, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-10.china-leadership-3
        when: Aug. 10
        date: '1967-08-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai has his secretary wire Huang Yongsheng and Li Yuan, commander of the 47th Army in Hunan: Plant 272 in Hunan must be guarded by troops; weapons seized to be returned to the army; a "dead order" that none may seize the defence plants'' arms; if not persuaded, the rebels may send delegates to Su Yu of the defence-industry military control group.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 10, 21, 1967). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Su Yu.'
        tags: [name:zhou-enlai, name:huang-yongsheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-21.china-leadership-3
        when: Aug. 21
        date: '1967-08-21'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai wires Li Yuan again, on the rebels'' "takeover" of Plant 282: they are to withdraw, and the defence depots'' arms are not to be touched. He talks with army heads the same day on stopping the seizure of arms from defence depots.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (under Aug. 10, 1967). Made public: 2020. See [[cal.1967-08-10.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-08-10.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 10, 1967; the Order on Sending Defense Forces to Keep the Railways Open, drafted by Zhou and approved by Mao)'
  - add:
      entry:
        id: cal.1967-08-12.china-leadership
        when: Aug. 12
        date: '1967-08-12'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, before dawn, receives the delegates of Jiangxi''s two factions and the Jiangxi Military District''s heads: the pro-army liaison station may not be set up inside the Region and must move out at once; the Center has not called a third great linking up.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 12, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-12.china-leadership-4
        when: Aug. 12
        date: '1967-08-12'
        thread: china-leadership
        also: [china]
        c: The Jiangxi delegations in Peking reach an eight-point agreement to carry out the "June 24" notice and Zhou Enlai's instructions on Jiangxi.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (under Aug. 12, 1967). Made public: 2020. See [[cal.1967-08-12.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-12.china-leadership-2
        when: Aug. 12
        date: '1967-08-12'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai writes Lin Biao, Chen Boda, Kang Sheng, Li Fuchun and Jiang Qing on China''s credit to Mali: the aid is in no case to fill the gap in Mali''s trade with France and push Mali back into a colonial economy.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174–175 (Aug. 12, 14, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+mali]
  - add:
      entry:
        id: cal.1967-08-14.china-leadership-5
        when: Aug. 14
        date: '1967-08-14'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai, talking with Kouyate, a Malian ministerial delegate: if China''s aid is used to cover France''s deficit and Mali''s trade gap with France, China helps Mali back to colonialism, and cannot do that.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174–175 (under Aug. 12, 1967). Made public: 2020. See [[cal.1967-08-12.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+mali]
  - add:
      entry:
        id: cal.1967-08-12.china-leadership-3
        when: Aug. 12–16
        date: '1967-08-12'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks without break with the Hunan "Workers Federation", the "Xiangjiang Storm" and the other factions and with Hunan''s Party, government and army heads, to settle Hunan. On the 15th: call on the workers to go back to factory and mine to carry out struggle, criticism and reform, grasp revolution and promote production, business and work, and ensure this year''s output; be a doer of revolution, not a talker.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 12–16, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-14.china-leadership-2
        when: Aug. 14
        date: '1967-08-14'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, before dawn, receives delegates of Canton''s mass bodies on public order and criticizes the Guangzhou Railway "General Command" for storming the airport on the 12th, seizing a navigation station and taking the militia''s guns: no side may take arms; with public security paralyzed, what if Hong Kong agents come in?'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 14, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-16.china-leadership-4
        when: Aug. 16
        date: '1967-08-16'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, before dawn, receives the Canton delegates again and hears their proposals for a settlement.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (under Aug. 14, 1967). Made public: 2020. See [[cal.1967-08-14.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-14.china-leadership-3
        when: Aug. 14
        date: '1967-08-14'
        thread: china-leadership
        c: 'Zhou Enlai, on the demand of over a thousand in the defence research system to seize Xiao Hua and struggle against him: struggle may be, but he is to be returned after, not carried off.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Xiao Hua.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-14.china-leadership-4
        when: Aug. 14
        date: '1967-08-14'
        thread: china-leadership
        c: Zhou Enlai calls a small liaison meeting, which adopts the letter of the Center, State Council, Military Commission and Cultural Revolution Group to the workers and staff of the coal industry. He adds that those who held to going down the pits and to output, in whichever body or none, are to be praised and rewarded.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 14, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-08-15.china-leadership
        when: Aug. 15
        date: '1967-08-15'
        thread: china-leadership
        c: Zhou Enlai receives delegates of the finance and trade branches.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 15, 17, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-17.china-leadership-2
        when: Aug. 17
        date: '1967-08-17'
        thread: china-leadership
        c: Zhou Enlai attends the meeting for Li Xiannian's self-criticism.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (under Aug. 15, 1967). Made public: 2020. See [[cal.1967-08-15.china-leadership]]. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-17.china-leadership
        when: Aug. 17
        date: '1967-08-17'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives Cambodia's Foreign Minister Phurissara (普里萨拉), twice, on Aug. 17 and 19.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176 (Aug. 17, 19, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1967-08-18.china-leadership-2
        when: Aug. 18
        date: '1967-08-18'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the heads of the Anhui delegation in Peking and rebukes them for printing and posting material and pictures of beating, bumping and looting against advice: put up in Peking it is the best material for foreign reporters; to have the Cultural Revolution come to this does the country no good.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176 (Aug. 18, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-19.china-leadership
        when: Aug. 19
        date: '1967-08-19'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on six Xian rebel bodies (the Workers, Mining and Enterprises Federation and others) demand to seize Peng Dehuai and bring him to Xian for struggle: the Cultural Revolution Group has discussed it; for now Peng is not to be taken elsewhere to be struggled.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176 (Aug. 19, 1967). Made public: 2020. Names: Zhou Enlai, Peng Dehuai.'
        tags: [name:zhou-enlai, name:peng-dehuai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-21.china-leadership
        when: Aug. 21
        date: '1967-08-21'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives the representatives of the mass bodies of the economic branches, the ministries' military delegates and students of related colleges. To storm the military control committees is not allowed. Rail transport and coal are most urgent; power for industry and homes is nearly cut. The Railways and Communications ministries to send men down the lines to stop armed fights and train-stopping; the Red Guard Congress's liaison stations elsewhere withdrawn.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176 (Aug. 21, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-08-21.china-leadership-2
        when: Aug. 21
        date: '1967-08-21'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, told that Xiamen mass bodies mean to seize the weapons of a garrison units gunboat, so that it dare not come ashore, tells the Cultural Revolution Group''s office: Chen Boda should announce in the Cultural Revolution Group''s or in Zhou''s and Chen''s name that seizing the gunboats arms is not allowed; to seize field-army arms before the enemy is wrong; if the warning is not heeded and they seize again, they are to be declared counter-revolutionary.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176–177 (Aug. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-08-22.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 177 (Aug. 22, 1967; Zhou before dawn receives Canton''s two delegations in Peking: seizing the army''s arms and its aid-to-Vietnam supplies shows no sense of the enemy, "simply ignorant"; do not do what pains friends and pleases foes; do not go on with "the handful in the army", wrongly put out by the propaganda organs after the July 20 incident, which Mao criticized; to demand army power is wrong; the two sides agree on the spot to stop seizures, return the army''s arms, stop all armed fighting and the hitting, smashing, looting, searching and seizing)'
  - add:
      entry:
        id: cal.1967-08-22.china-leadership-3
        when: Aug. 22
        date: '1967-08-22'
        thread: china-leadership
        also: [china, vietnam-hanoi]
        c: Zhou Enlai reviews the draft telegram of the Center to the Canton Military Region and the mass bodies on stopping the seizing of military supplies for Vietnam; and the draft telegram to the Chongqing garrison command and the bodies on stopping armed fights there, which he asks be sent in the Cultural Revolution Group offices name.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 177 (Aug. 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-08-22.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 177 (Aug. 23, 1967; Zhou, before dawn after the burning of the British chargés office on the night of the 22nd by Peking Red Guards and rebels, receives the foreign-affairs rebels and sharply criticizes the burning and the seizure of the Foreign Ministry: "you have no regard for the Center, anarchism"; the telegrams to foreign countries in the name of the supervision group are wholly unlawful and void; foreign affairs power is Mao''s and the Party Center''s, given to the State Council; "between the Cultural Revolution Group and me you have no gap to drive into"; after the July 20 incident the tide is abnormal and the whole estimate wrong, "the country on the eve of counter-revolutionary restoration" and "taking power by arms" are not so; he talks the same day in turn with the Ministry''s station, the Foreign Languages Institute and the Foreign Affairs Office and Foreign Ministry heads)'
  - add:
      entry:
        id: cal.1967-08-24.china-leadership
        when: Aug. 24
        date: '1967-08-24'
        thread: china-leadership
        also: [china, vietnam-hanoi]
        c: 'Zhou Enlai, before dawn, receives the two factions of Guangxi come to Peking and severely criticizes the seizing of military supplies for Vietnam and factional armed fights: stop the "civil war" at once, seal and hand in arms, keep the railways open. Look how the civil war has gone: the railways fought over section by section are worse than the old warlord wars, and cannot be borne; attacking railways and taking field-army guns is nothing of the Cultural Revolution; the slogan "drag out the handful in the army" turns the spearhead.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178 (Aug. 24, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-25.china-leadership-3
        when: Aug. 25
        date: '1967-08-25'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai talks at 1 a.m. with Yang Chengwu, back from Shanghai: on the provinces, Wang Li''s Aug. 7 speech inciting the rebels to seize the Foreign Ministry, the burning of the British office and the siege of Zhongnanhai to seize Liu Shaoqi. "How can this go on? I fear a chain reaction. Two things must not be shaken: the Center''s leadership and the PLA''s prestige." He sends Yang to Shanghai to report to Mao with Wang Li''s Aug. 7 speech.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178 (Aug. 25, 1967). Made public: 2020. See [[cal.1967-08-25.china-leadership-2]]. Names: Zhou Enlai, Yang Chengwu, Wang Li, Liu Shaoqi, Mao Zedong.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-25.china-leadership-4
        when: Aug. 25
        date: '1967-08-25'
        thread: china-leadership
        also: [china]
        c: Jiang Qing, against Zhou Enlai's wish that Song Renqiong go back to work in Liaoning, has rebels burst at night into the Jingxi Hotel to seize Song Renqiong and Chen Xilian, threatening to "beat them to death". Zhou, told of it, has Fu Chongbi take men to rescue them, and has them moved.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178 (Aug. 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Song Renqiong, Chen Xilian, Fu Chongbi.'
        tags: [name:zhou-enlai, name:jiang-qing, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-26.china-leadership-2
        when: Aug. 26
        date: '1967-08-26'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, at dawn, receiving Liaoning's delegates, criticizes the seizure of Song Renqiong and Chen Xilian as "the style of Kuomintang agents", and asks each side to stop armed fighting, support the PLA, seal all arms and keep the railways in and out of the Pass open.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178 (under Aug. 25, 1967). Made public: 2020. See [[cal.1967-08-25.china-leadership-4]]. Names: Zhou Enlai, Song Renqiong, Chen Xilian.'
        tags: [name:zhou-enlai, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-26.china-leadership
        when: Aug. 26
        date: '1967-08-26'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, told at noon by Yang Chengwu, back from Shanghai, of Mao's decision that Wang Li, Guan Feng and Qi Benyu are wreckers of the Cultural Revolution and that the Premier is to handle them, chairs the small liaison meeting, Chen Boda, Kang Sheng and Jiang Qing attending, and conveys Mao's instruction. Wang Li and Guan Feng are put under isolation and examination.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178–179 (Aug. 26, 1967). Made public: 2020. See [[cal.1967-08-25.china-leadership-2]]. To check: the Chronology''s date for Mao''s marking of Wang Li''s speech. Names: Zhou Enlai, Mao Zedong, Yang Chengwu, Wang Li, Guan Feng, Qi Benyu, Chen Boda, Kang Sheng, Jiang Qing.'
        tags: [name:zhou-enlai, name:mao-zedong, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-27.china-leadership
        when: Aug. 27
        date: '1967-08-27'
        thread: china-leadership
        c: 'Zhou Enlai, at dawn, receives the foreign-affairs rebels, who press him again on "criticizing" Chen Yi: since noon the day before, eighteen hours, he has not rested. His heart disease acts and the doctor helps him out. At the door he turns: "whoever blocks Comrade Chen Yi''s car, I will step forward at once; whoever storms the meeting will tread over me." He cannot work for a day and a half.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179 (Aug. 27, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-29.china-leadership-2
        when: Aug. 29
        date: '1967-08-29'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on rebels seizing arms at an arsenal in Yunnan, tells Chen Kang, deputy commander of the Kunming Military Region: the Center and the Cultural Revolution Group agree the Region may send troops to guard it and to persuade; if persuasion fails, arrest the ringleaders.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179 (Aug. 29, 1967). Made public: 2020. Names: Zhou Enlai, Chen Kang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-30.china-leadership
        when: Aug. 30
        date: '1967-08-30'
        thread: china-leadership
        c: 'Zhou Enlai tells the Peking garrison on the armed fight of the two Seventh Ministry factions: shout over in the Cultural Revolution Group''s name; if they do not heed, add troops at once to separate them and ask both sides for delegates.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179 (Aug. 30, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08-31.china-leadership
        when: Aug. 31
        date: '1967-08-31'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, after talking with Chen Yi, receives the foreign affairs rebels and the Foreign Ministry''s Party group and repeats that foreign affairs power belongs to the Center. He sharply criticizes the "revolutionary leading cadre" who acts as "foreign minister" after the Ministry''s "power seizure": "you lately speak and report everywhere and spread the slogan "down with Liu, Deng and Chen"; you put yourself against the Center. The extreme-Left thought and acts at home now hurt our foreign work and our credit abroad."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179 (Aug. 31, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08.china-leadership
        when: Aug.
        date: 1967-08
        thread: china-leadership
        c: 'Zhou Enlai says in a talk: because Wuhan produced a Chen Zaidao, "Chen Zaidao''s" are being sought everywhere; that is wrong. An error of line and direction is among the people; the army''s differs from the Party''s and governments. Trust the PLA; to seize its guns, uniforms and supplies, even to seize the commander, commissar and chief of staff, is wrong, and the question should be put more seriously; the method of seizing a handful of power-holders everywhere, used in early last year, would make a great error.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179–180 (Aug. 1967). Made public: 2020. Names: Zhou Enlai, Chen Zaidao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08.china-leadership-2
        when: Aug.
        date: 1967-08
        thread: china-leadership
        c: Zhou Enlai, told that Li Jingquan and other regional, provincial and municipal heads at the Central Organs Hostel have been seized and paraded by rebels, has Fu Chongbi send troops to protect them and moves Wang Renzhong, Jiang Weiqing and over twenty others secretly to a safe house of the Peking garrison. For two days Jiang Qing and others ask Fu, before Zhou, where they are.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (Aug. 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Jingquan, Fu Chongbi, Wang Renzhong, Jiang Weiqing, Jiang Qing.'
        tags: [name:zhou-enlai, name:li-jingquan, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08.china-leadership-3
        when: Aug.
        date: 1967-08
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai instructs Anhui''s Baihu farm: (1) staff of reform-through-labor farms, cadres included, are not to hold the "four bigs"; (2) prisoners are not to use the Cultural Revolution to riot; (3) warn the prisoners not to riot, or they will be suppressed.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (Aug. 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-08.china-leadership-4
        when: Aug.
        date: 1967-08
        thread: china-leadership
        c: By Zhou Enlai's desk calendar, in August, besides meetings, he talked with central, local and army leaders 45 times and received delegates of mass bodies from all parts over fifty times.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (Aug. 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-01.china-leadership-2
        when: Sept. 1
        date: '1967-09-01'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, before dawn, receives the Canton delegates in Peking: factionalism has reached its peak and must go no further. Whampoa harbor cannot unload, and each ship loses 500 pounds a day; if this goes on, Whampoa will be put under military control, which may use arms and arrest. That afternoon the two sides, on his instructions, agree to stop the armed fight, hand in arms and back the PLA.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (Sept. 1, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-01.china-leadership-5
        when: Sept. 1
        date: '1967-09-01'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, at 3 p.m., receives the Center's investigation team to Canton and tells it to see that the two sides keep their agreement and to take no part in their struggle.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (under Sept. 1, 1967). Made public: 2020. See [[cal.1967-09-01.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-01.china-leadership-3
        when: Sept. 1
        date: '1967-09-01'
        thread: china-leadership
        c: 'Zhou Enlai tells the enlarged meeting of the Peking Revolutionary Committee that stopping armed fights, and the seizure of the PLA''s arms, is now the main task. Factional struggle has hampered production, transport is at its lowest, foreign ships cannot load. Some dig up things from his past years: help in good faith is welcome, but to use them as a threat for a plot he opposes.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180–181 (Sept. 1, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-09-01.china-leadership-4
        when: Sept. 1
        date: '1967-09-01'
        thread: china-leadership
        also: [china]
        c: Because Chinese staff abroad, under extreme-Left influence, meddled in Cambodia's internal affairs, Sihanouk dissolves the Cambodia–China Friendship Association. Zhou Enlai criticizes the Chinese staff in Cambodia.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181 (Sept. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Sihanouk. Check: the day of the dissolution; the chronology gives it after Sept. 1.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1967-09-11.china-leadership-2
        when: Sept. 11
        date: '1967-09-11'
        thread: china-leadership
        also: [china]
        c: Sihanouk closes five overseas Chinese papers in Cambodia.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181 (under Sept. 1, 1967). See [[cal.1967-09-01.china-leadership-4]]. Names: Sihanouk.'
        tags: [name:norodom-sihanouk, polity:cambodia, polity:prc]
  - add:
      entry:
        id: cal.1967-09-13.china-leadership-6
        when: Sept. 13
        date: '1967-09-13'
        thread: china-leadership
        also: [china]
        c: Sihanouk announces the withdrawal of Cambodia's embassy staff from China, without a break of relations.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181 (under Sept. 1, 1967). See [[cal.1967-09-01.china-leadership-4]]. Names: Sihanouk.'
        tags: [name:norodom-sihanouk, polity:cambodia, polity:prc]
  - add:
      entry:
        id: cal.1967-09-14.china-leadership
        when: Sept. 14
        date: '1967-09-14'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives Cambodia's ambassador, expresses regret and tries to persuade Cambodia to keep its embassy staff in Peking.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181 (under Sept. 1, 1967). Made public: 2020. See [[cal.1967-09-01.china-leadership-4]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1967-09-18.china-leadership-3
        when: Sept. 18
        date: '1967-09-18'
        thread: china-leadership
        also: [china]
        c: Sihanouk cancels the withdrawal of Cambodia's embassy staff from China.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181 (under Sept. 1, 1967). See [[cal.1967-09-01.china-leadership-4]]. Names: Sihanouk.'
        tags: [name:norodom-sihanouk, polity:cambodia, polity:prc]
  - add:
      entry:
        id: cal.1967-09-02.china-leadership
        when: Sept. 2
        date: '1967-09-02'
        thread: china-leadership
        c: Zhou Enlai, before dawn, receives the finance-and-trade rebels, who want Li Xiannian downed, and urges all branches to stop armed fights and unite. The Foreign Ministry's "power seizure" was wrong and is not to be copied. Seizing the PLA's guns is unlawful, the seizers to be arrested on the spot; if rebels seize a vault the PLA may fire, the "four nots" being for the people.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181 (Sept. 2, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-02.china-leadership-2
        when: Sept. 2
        date: '1967-09-02'
        thread: china-leadership
        c: 'Zhou Enlai, on Mu Xin being secretly seized by rebels of the Central Drama Institute, writes Chen Boda, Kang Sheng, Jiang Qing, Xie Fuzhi and others: Xie to investigate; after the facts are known it must be declared that such abductions after the June 6 general order are in no way allowed, and a public admission of error written, and if they refuse it will be announced across the country.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181–182 (Sept. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mu Xin, Chen Boda, Kang Sheng, Jiang Qing, Xie Fuzhi.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-02.china-leadership-3
        when: Sept. 2
        date: '1967-09-02'
        thread: china-leadership
        also: [china, vietnam-hanoi]
        c: Zhou Enlai receives the air force men who shot down a U.S. aircraft over Guangxi.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 2, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-09-03.china-leadership
        when: Sept. 3
        date: '1967-09-03'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls the Cultural Revolution Group's liaison meeting, which adopts the Order Forbidding the Seizure of the PLA's Arms, Equipment and Military Supplies. That night he calls the heads in Peking of the military regions, provincial districts, the services and general departments, and the order is amended.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 3, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - cite:
      id: cal.1967-09-05.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 3–5, 1967; the order forbidding the seizure of the PLA''s arms, equipment and military supplies, drawn at Zhou''s liaison meeting and sent to Mao)'
  - add:
      entry:
        id: cal.1967-09-03.china-leadership-2
        when: Sept. 3
        date: '1967-09-03'
        thread: china-leadership
        also: [testing, china]
        c: 'Zhou Enlai reviews and signs the State Council''s and Military Commission''s telegram to the Lanzhou Military Region, the local garrison and the Center''s investigation group on the seizure, in armed fights, of large stores of top-secret technical papers of the Second Ministry''s Company 103: the act is extremely wrong; the Region and the group are to deal with it severely, all files and materials seized to be handed over at once in full, and refusal to be judged under the law of the state.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 3, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-05.china-leadership-2
        when: Sept. 5
        date: '1967-09-05'
        thread: china-leadership
        also: [africa]
        c: Zhou Enlai receives Tanzania's Finance Minister Jamal and Zambia's Minister of State Soko, heading the joint Tanzania–Zambia economic delegation, and attends the signing of the agreement of the Chinese, Tanzanian and Zambian governments on building the Tanzania–Zambia railway.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 5, 1967). To check: the agreement as published. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-09-06.china-leadership
        when: Sept. 6
        date: '1967-09-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai receives Heilongjiang's mass delegates and tells both sides to carry out at once the agreement already reached to stop armed fights; then he receives the Center's investigation group to Heilongjiang.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 6, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-06.china-leadership-2
        when: Sept. 6
        date: '1967-09-06'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai agrees, with the two factions of the Public Security Ministry's preliminary hearing bureau in fierce struggle and the office paralyzed, with the Ministry's Party groups request that the Peking garrison take it over.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-06.china-leadership-3
        when: Sept. 6
        date: '1967-09-06'
        thread: china-leadership
        c: Zhou Enlai receives the Cultural Revolution Group's liaison men and correspondents in the provinces. Claims of a capitalist restoration current on the eve of a rebound, and that power "must be taken by arms", are wholly wrong, extreme Left; so is "seizing the handful in the army". Every province to stop armed fights and the seizing of guns first; then great criticism, great alliance, three-in-one, transport above all.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182–183 (Sept. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-07.china-leadership-2
        when: Sept. 7
        date: '1967-09-07'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the demand of eight colleges rebel bodies, Peking Aeronautics "Red Flag" and Tsinghua "Jinggangshan" among them, that the *Guangming ribao* be stopped, writes Chen Boda, Kang Sheng, Jiang Qing and Yao Wenyuan: how the *Guangming ribao* is to be handled he is not clear, but having it closed by college rebels is not needed.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183 (Sept. 7, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, name:yao-wenyuan, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-08.china-leadership
        when: Sept. 8
        date: '1967-09-08'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates to the national defence research meeting and rebukes the factional fighting that has thrown production into disorder. A model producer wanting to keep the old production order is well-meaning; the rebels may break the old order but not upset production order. How much production the fights have harmed, and what damage to state property: wholly petty-bourgeois factionalism.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183 (Sept. 8, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-08.china-leadership-2
        when: Sept. 8
        date: '1967-09-08'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, in the evening, receives Fujian''s delegates in Peking: all sides to go back at once, make an agreement and carry out the Center''s order of Sept. 5; when local and whole interests clash the local yields; the main side of contradictions among the people is that small reasons yield to great; aiming the spearhead at the Military Region, "seizing the handful in the army" above all, is wholly wrong.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183 (Sept. 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-09.china-leadership-2
        when: Sept. 9
        date: '1967-09-09'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, before dawn, receives Liaoning's delegates, asking each side to drop factionalism and unite, make an agreement to stop armed fights, seal arms, restore production and keep the railways open, and swear to carry it out. In the afternoon he receives the Center's investigation group to Liaoning.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183 (Sept. 9, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-10.china-leadership
        when: Sept. 10
        date: '1967-09-10'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, before dawn, receives the military control delegates and mass body delegates of the defence-industry ministries and criticizes the ministries for going on with armed fights after the Center's order of Sept. 5; the control committees are to call the sides to agree to stop fights and linking up and to grasp revolution and promote production. The new task of defence industry is to reach the great alliance and the three-in-one by great criticism; this is to be seen as a centre; the present factional struggle cannot go on.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183–184 (Sept. 10, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-09-10.china-leadership-2
        when: Sept. 10
        date: '1967-09-10'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai drafts the Center's telegram to the Nanjing Military Region and Nanjing's three mass factions, agreeing to and backing the agreement the three reached to stop armed fights firmly; they are to print the agreement and the Center's reply across the province and call all bodies to carry it out and unite in great criticism.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-11.china-leadership
        when: Sept. 11
        date: '1967-09-11'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou Enlai, on the Indian army''s provocations against Chinese border troops, puts forward a plan of deployment: if the enemy does not fire again, our side need not return fire.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 11, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+india]
  - add:
      entry:
        id: cal.1967-09-12.china-leadership
        when: Sept. 12
        date: '1967-09-12'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, told that Zhang Jingwu's home was searched and Nationalities Institute rebels are seizing him everywhere, has him brought to the State Council to live, and tells his liaison man to criticize such acts.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 12, 1967). Made public: 2020. Names: Zhou Enlai, Zhang Jingwu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-12.china-leadership-2
        when: Sept. 12
        date: '1967-09-12'
        thread: china-leadership
        c: 'Zhou Enlai receives the Cultural Revolution Group''s correspondents posted in the provinces and the petitions staff: sum up experience and give the Center reports both objective and aimed at solving things, so that the Center sees where the knot of some problems lies.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 12, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-13.china-leadership-3
        when: Sept. 13
        date: '1967-09-13'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, on peasants entering the Canton Military Region compound for armed fighting and planning a meeting, talks with the delegates of the Canton suburban "Poor Peasants' Federation" and orders them to telephone home at once to have those in the compound withdraw and stop the meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 13, 15, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-15.china-leadership
        when: Sept. 15
        date: '1967-09-15'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Canton''s delegates and criticizes the "Dizong" for holding its meeting and sitting in at the Military Region against advice: out of the compound by noon; more Party spirit, less factionalism; Canton''s order to be restored and the Canton fair not to stop.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (under Sept. 13, 1967). Made public: 2020. See [[cal.1967-09-13.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-13.china-leadership-4
        when: Sept. 13
        date: '1967-09-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai telephones Yang Chengwu, for Mao away from Peking: Tianjin''s Tanggu port is wholly at a standstill from armed fights of the two sides, with over forty foreign ships in port; he has called the two sides'' delegates to Peking to talk and they have agreed to stop the fighting and keep an eight-hour day; he proposes military control of the port to help loading and unloading. Mao agrees.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 13, 1967, the item after). Made public: 2020. See [[cal.1967-09-13.china-leadership]]. Names: Zhou Enlai, Yang Chengwu, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-13.china-leadership-5
        when: Sept. 13
        date: '1967-09-13'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, for the sixth time, receives Guangxi''s delegates in Peking: the railways to be taken over along the whole line by the PLA; Guilin''s "Laoduo" to join in protecting the line; the "April 22" to pull down its works; both sides to seal arms.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184–185 (Sept. 13, 16, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-16.china-leadership-3
        when: Sept. 16
        date: '1967-09-16'
        thread: china-leadership
        also: [china]
        c: The two Guangxi factions reach in Peking a seven-point agreement on handing in all guns and ammunition.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184–185 (under Sept. 13, 1967). Made public: 2020. See [[cal.1967-09-13.china-leadership-5]]. Names: Zhou Enlai.'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-16.china-leadership-2
        when: Sept. 16–17
        date: '1967-09-16'
        thread: china-leadership
        c: Zhou Enlai, with Chen Boda, Jiang Qing and others of the Cultural Revolution Group, receives the "Heaven" and "Earth" factions of the Peking colleges' Red Guard Congress and warns Kuai Dafu and others that "seize the handful in the army" is an extreme-Left trend. Corporal punishment of cadres and tapping telephones are fascist acts; the factions are not to carry their views to other places; those still out linking up to return in a month; military training in all schools.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 185 (Sept. 16, 17, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda, Jiang Qing, Kuai Dafu.'
        tags: [name:zhou-enlai, name:chen-boda, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-17.china-leadership-2
        when: Sept. 17
        date: '1967-09-17'
        thread: china-leadership
        also: [south-asia]
        c: 'The Foreign Ministry, without the Center''s approval, agrees that the Chinese embassy in Pakistan protest to Pakistan''s government over a non-official Pakistani paper printing Taiwan''s anti-Communist news and Brezhnev''s anti-China remarks. After receiving Pakistan''s ambassador that day Zhou Enlai severely rebukes the Ministry''s men: "you have made another mess for me; was the reply to the embassy approved by me? why was it not sent to me?"'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 185 (Sept. 17, 1967). Made public: 2020. Names: Zhou Enlai, Brezhnev.'
        tags: [name:zhou-enlai, name:brezhnev-leonid, polity:prc, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1967-09-18.china-leadership-2
        when: Sept. 18
        date: '1967-09-18'
        thread: china-leadership
        c: 'Zhou Enlai talks with the Foreign Ministry''s Party-group members and business-supervision group members, the day after his rebuke over the protest to Pakistan: "a matter that talk would settle: is it worth a protest? you have spoiled all the relations; this is extreme-Left conduct."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 185–186 (Sept. 17, 1967; "次日"). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-19.china-leadership-3
        when: Sept. 19
        date: '1967-09-19'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, after talks with Chen Xilian and others, receives Liaoning's delegates and orders the mass bodies of Lüda, Fushun, Dandong, Xinmin, Jinzhou, Benxi and other places each to make an agreement by Sept. 25 to hand in and seal all arms, stop armed fights and unite to grasp revolution, production and business, to meet National Day.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 19, 1967). Made public: 2020. Names: Zhou Enlai, Chen Xilian.'
        tags: [name:zhou-enlai, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-20.china-leadership-2
        when: Sept. 20
        date: '1967-09-20'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai speaks at the mobilization meeting for the National Day preparations. Peking students linking up elsewhere are to return soon and correct the wrong estimates of "seizing power by arms" and the "third great linking up"; they are to drop beating, kidnapping, house-searching, seizing men, private courts, seizing archives, tapping telephones and private radio stations, make a good great alliance and meet National Day. The army made errors in supporting the Left because it long had no mass work and no experience, with too little understanding and so not effective or earnest: a question of understanding.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 20, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-09-22.china-leadership-2
        when: Sept. 22
        date: '1967-09-22'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Guangxi''s mass delegates and asks them to unite and restore the railways: whichever factions head stands up and runs the railway transport well is good, doing as Mao directs; whoever opposes is factional and not proletarian. This must be made plain.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 22, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-22.china-leadership-3
        when: Sept. 22
        date: '1967-09-22'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai reviews the draft Emergency Notice on the Immediate Return of Students Linking up Elsewhere and of Petitioners in Peking to Their Own Units, and sends it to Mao.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 22, 1967, the item after). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - cite:
      id: cal.1967-09-24.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 24, 1967; Zhou at Mao''s: on convening the Ninth Congress Mao says the successor is of course Lin Biao, and that Liu Shaoqi and Deng Xiaoping are to be told apart)'
  - add:
      entry:
        id: cal.1967-09-24.china-leadership-2
        when: Sept. 24
        date: '1967-09-24'
        thread: china-leadership
        c: Zhou Enlai, his health worse by the day, still works through the night. He tells Deng Yingchao that by about eight each morning his spirit is gone and his hands shake.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Deng Yingchao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-27.china-leadership-2
        when: Sept. 27
        date: '1967-09-27'
        thread: china-leadership
        c: Zhou Enlai, asked twice to write the National Day slogan "Warmly Celebrate the 18th Anniversary of the Great People's Republic of China", cannot for his trembling hand, and has it set in type.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (under Sept. 24, 1967). Made public: 2020. See [[cal.1967-09-24.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-26.china-leadership
        when: Sept. 26
        date: '1967-09-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai attends the celebration meeting of the finance-and-trade system on its great revolutionary alliance and conveys Mao''s instruction, given on his return from inspecting North China, Central-South and East China: the bodies are to handle contradictions among the people rightly by Mao''s newest instruction, make more self-criticism, drop the "self" and unite further in politics and thought.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 26, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - cite:
      id: cal.1967-09-23.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 25, 1967; the *Renmin ribao* reports that Mao has inspected the Cultural Revolution in North, Central-South and East China in July, August and September and is back in Peking; Oct. 7 the Center sends his remarks on the tour to the whole country)'
  - add:
      entry:
        id: cal.1967-09-26.china-leadership-2
        when: Sept. 26
        date: '1967-09-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the army heads of Hubei, Henan and other provinces, drilled in Peking: the great alliance now rising is good and is to be pushed, led and furthered with skill; do not unite without principle, do not hurry, do not cover up contradictions that should be pointed out.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-26.china-leadership-3
        when: Sept. 26–Oct. 14
        date: '1967-09-26'
        thread: china-leadership
        also: [china]
        c: Albania's Premier Mehmet Shehu, member of the Party of Labor's Politburo, leads a party and government delegation to China and attends National Day. During the visit Zhou Enlai holds three talks with Shehu.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 26–Oct. 14, 1967). Made public: 2020. Names: Zhou Enlai, Shehu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1967-09-27.china-leadership
        when: Sept. 27
        date: '1967-09-27'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, before dawn, receives for the fourth time the delegates of Canton''s mass bodies: drop "self", set up "public"; Party spirit, not factionalism. The spearhead is not to be pointed at the Military Region; an error of carrying out the reactionary line is among the people. Guard against both extreme-Left and Right moods. Public security, paralyzed, is under military control, with the airfields, railways, vaults and ports.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187–188 (Sept. 27, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-25.china-leadership
        when: Sept. 25–26
        date: '1967-09-25'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with the Canton Military Region's Standing Committee and Huang Yongsheng on Guangdong.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187–188 (under Sept. 27, 1967). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
        tags: [name:zhou-enlai, name:huang-yongsheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-28.china-leadership-2
        when: Sept. 28
        date: '1967-09-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the mass delegates of the three Northeast provinces: shouting "drag out the handful in the army" is wrong; the Cultural Revolution has run fifteen months and cannot run another fifteen; "take leave for revolution" and a "third great linking up" are great errors. Traffic must be kept open, a dead order; the heads of any faction that obstructs it will be arrested. Seal and hand in guns.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 28, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-29.china-leadership-2
        when: Sept. 29
        date: '1967-09-29'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai, in the first talks with Congo (Brazzaville) Premier Noumazalaye: China is pushing health workers down to the villages; the rural population is 85 percent of the whole and most doctors are in the cities; agriculture is the base, and imported grain is bad.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 29, Oct. 5, 1967). Made public: 2020. Names: Zhou Enlai, Noumazalaye.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+congo-brazzaville]
  - add:
      entry:
        id: cal.1967-10-05.china-leadership-2
        when: Oct. 5
        date: '1967-10-05'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai, in the second talks with Noumazalaye: a collective economy rests chiefly on self-reliance; if tools, livestock and funds all come from the state, it collapses when circumstances change.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (under Sept. 29, 1967). Made public: 2020. See [[cal.1967-09-29.china-leadership-2]]. Names: Zhou Enlai, Noumazalaye.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+congo-brazzaville]
  - cite:
      id: cal.1967-09-30.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 30, 1967; Zhou with Mao at the reception of the Albanian party and government delegation under Shehu)'
  - add:
      entry:
        id: cal.1967-09-30.china-leadership-2
        when: Sept. 30
        date: '1967-09-30'
        thread: china-leadership
        c: Zhou Enlai, after talking with Chen Yi and the Foreign Ministry's Party group, studies the list of those to be on the Tiananmen tower for National Day.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-30.china-leadership-3
        when: Sept. 30
        date: '1967-09-30'
        thread: china-leadership
        c: 'Zhou Enlai drafts the Center''s several decisions on reporting the National Day meetings in the provinces, municipalities and regions: besides the names of the revolutionary committee, military control committee or preparatory group heads at the celebration, the names of the main heads of the large military region and provincial military district who are not on the military control committee are also to be reported. (The chronology notes this was Zhou''s way of protecting cadres: a cadre named in the National Day report was understood to have no political problem.)'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188–189 (Sept. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09.china-leadership
        when: Sept.
        date: 1967-09
        thread: china-leadership
        c: On Zhou Enlai's proposal the Center decides that Yang Chengwu be head of the Military Commission's office group, set up in August 1967 to run the Commission's daily work, its first members Wu Faxian, Ye Qun, Qiu Huizuo and Zhang Xiuchuan.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Sept. 1967). Made public: 2020. Names: Zhou Enlai, Yang Chengwu, Wu Faxian, Ye Qun, Qiu Huizuo.'
        tags: [name:zhou-enlai, name:wu-faxian, name:ye-qun, name:qiu-huizuo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10-02.china-leadership
        when: Oct. 2
        date: '1967-10-02'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, before dawn, told that the two factions of the customs and port office at Xiamen have left no one to see to British merchant ships, which cannot berth, drafts a telephone message to the Xiamen military control committee: this breaks state law and hurts the country''s credit; the committee is to have both bodies act jointly toward foreigners and to protect berthing and loading; a faction that breaks it will be punished under the June 6 order.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Oct. 2, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10-03.china-leadership-2
        when: Oct. 3
        date: '1967-10-03'
        thread: china-leadership
        c: 'Zhou Enlai writes Mao proposing talks on: (1) the Cultural Revolution''s course and some concrete matters of students and Red Guards; (2) industrial and farm output and next year''s plan; (3) international questions. One question at each meeting, the circle limited to the Politburo, the Secretariat, the Military Commission''s Standing Committee, the Cultural Revolution Group and, from Peking''s committee, Wu De and Liu Jiandong.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Oct. 3, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Wu De, Liu Jiandong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-10-03.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Oct. 3, 1967; Zhou with Mao at the reception of Premier Noumazalaye of Congo (Brazzaville); Mao on Red Guards beating blindly and wanting to bring down Chen Yi, Zhou and Li Xiannian)'
  - add:
      entry:
        id: cal.1967-10-03.china-leadership-3
        when: Oct. 3
        date: '1967-10-03'
        thread: china-leadership
        also: [south-asia]
        c: Zhou Enlai, with Mao, receives the Pakistani governments friendship delegation under Minister of Information and Broadcasting Shahabuddin.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Oct. 3, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1967-10-04.china-leadership
        when: Oct. 4
        date: '1967-10-04'
        thread: china-leadership
        c: Zhou Enlai twice visits Xu Shiyou, on Oct. 4 and 6. Xu had been brought by Mao and Zhou to live at Zhongnanhai, where he stayed about a month.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 4, 6, 1967). Made public: 2020. Names: Zhou Enlai, Xu Shiyou.'
        tags: [name:zhou-enlai, name:xu-shiyou, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-10-05.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 5, 1967; Zhou with Mao at the reception of Vietnam''s Deputy Premier Lê Thanh Nghị and the National Assembly''s vice-chairman Hoàng Văn Hoan with their party and government delegation)'
  - add:
      entry:
        id: cal.1967-10-06.china-leadership
        when: Oct. 6
        date: '1967-10-06'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai says to Premier Noumazalaye on the way to the airport: the stages of revolution cannot be jumped; the idea of continuing revolution must join with the idea that its stages cannot be skipped.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 6, 1967). Made public: 2020. Names: Zhou Enlai, Noumazalaye.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+congo-brazzaville]
  - add:
      entry:
        id: cal.1967-10-07.china-leadership-2
        when: Oct. 7
        date: '1967-10-07'
        thread: china-leadership
        c: Zhou Enlai goes to Mao's for a meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 7, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10-08.china-leadership
        when: Oct. 8–10
        date: '1967-10-08'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai flies to Wuhan with the Albanian delegation under Shehu for the forum on "order after disorder" there; he talks with the Wuhan Region's heads and the mass bodies' delegates, and flies back to Peking on the 10th.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 8, 9, 10, 1967). Made public: 2020. Names: Zhou Enlai, Shehu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1967-10-09.china-leadership-2
        when: Oct. 9
        date: '1967-10-09'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, at the Wuhan masses' meeting welcoming the Albanian delegation, asks the mass bodies to study Mao's works, rectify with open doors, make more self-criticism, overcome factionalism and push the great alliance.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (under Oct. 8, 1967). Made public: 2020. See [[cal.1967-10-08.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1967-10-11.china-leadership
        when: Oct. 11
        date: '1967-10-11'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai writes on the General Political Department''s report on appointing and removing army officers, to Ye Jianying and Yang Chengwu and for Lin Biao: reports and approvals of the Military Commission on daily administration, troop movement, appointments, unit organization, weapons and equipment, not part of supporting Left, farm, industry, military control and training, defence or foreign affairs, should go from the Commission and the General Staff direct to Vice-Chairman Lin for approval, not through his hands; otherwise too many papers pile up with him, he has no time, and exceeds his authority to the harm of great matters.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 11, 1967). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Yang Chengwu, Lin Biao.'
        tags: [name:zhou-enlai, name:ye-jianying, name:lin-biao, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-10-12.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 12, 1967; Zhou with Mao at the reception of Shehu and the Albanian delegation)'
  - add:
      entry:
        id: cal.1967-10-12.china-leadership-2
        when: Oct. 12
        date: '1967-10-12'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai calls the heads of the foreign affairs branch and the rebel leaders: it is over half a year since the January seizure of power, and not everything can be downed; analyze; revolution and business cannot be parted, and are proved in business.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190–191 (Oct. 12, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10-13.china-leadership-2
        when: Oct. 13
        date: '1967-10-13'
        thread: china-leadership
        also: [china]
        c: 'With the road from Nanjiang to Duku in Kashgar, Xinjiang, cut for over fifty days by the armed fight of two factions, and a Center investigation group sent four days before, Zhou Enlai telephones at dawn the group and the factions'' heads: both sides to level every roadblock and work on the road and seal their arms, the 9th Air Force to see it done.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 13, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-04.china-leadership
        when: Nov. 4
        date: '1967-11-04'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai has his secretary tell the Center's investigation group at Kashgar to stay on and finish the sealing of arms and the union of the two factions.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (under Oct. 13, 1967). Made public: 2020. See [[cal.1967-10-13.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-10-13.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 13–14, 1967; Zhou at Mao''s meeting on the political report to the Ninth Congress and the election of delegates)'
  - add:
      entry:
        id: cal.1967-10-17.china-leadership-2
        when: Oct. 17
        date: '1967-10-17'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, on the death of Pu Yi, rules that the family may choose among the Revolutionary Cemetery, the Wanan and the People's cemeteries for his ashes, and has the *Renmin ribao* print the news.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 17, 1967). Made public: 2020. Names: Zhou Enlai, Pu Yi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-17.china-leadership-5
        when: Dec. 17
        date: '1967-12-17'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai gives three further rulings on Pu Yi: a pension of 520 yuan by the rules; all his royalties to go to his wife; his ashes in the People''s Cemetery as the family wishes.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (under Oct. 17, 1967). Made public: 2020. See [[cal.1967-10-17.china-leadership-2]]. Names: Zhou Enlai, Pu Yi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10-20.china-leadership-2
        when: Oct. 20–22
        date: '1967-10-20'
        thread: china-leadership
        also: [africa, korea]
        c: Zhou Enlai holds talks with Mauritania's President Daddah, in China on a visit, giving his view of the international situation and China's stand on settling international questions by the Five Principles of peaceful coexistence.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 20–22, 1967). Made public: 2020. Names: Zhou Enlai, Daddah.'
        tags: [name:zhou-enlai, name:daddah-moktar-ould, polity:prc, vis:only:prc+mauritania]
  - add:
      entry:
        id: cal.1967-10-24.china-leadership-2
        when: Oct. 24
        date: '1967-10-24'
        thread: china-leadership
        also: [africa, korea]
        c: 'Zhou Enlai, on the road to the airport, asks Daddah to carry messages to Kim Il Sung, Sihanouk and Nasser: China teaches overseas Chinese to obey host countries'' laws but cannot control them; its embassies'' deviations are corrected; its policy toward Korea and Cambodia is unchanged.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (under Oct. 20, 1967). Made public: 2020. See [[cal.1967-10-20.china-leadership-2]]. Names: Zhou Enlai, Daddah, Kim Il Sung, Sihanouk, Nasser.'
        tags: [name:zhou-enlai, name:daddah-moktar-ould, name:kim-il-sung, name:norodom-sihanouk, name:nasser, vis:only:prc+mauritania, polity:cambodia, polity:prc]
  - cite:
      id: cal.1967-10-23.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 23, 1967; Zhou with Mao at the reception of the Mauritanian president)'
  - add:
      entry:
        id: cal.1967-10-27.china-leadership
        when: Oct. 27
        date: '1967-10-27'
        thread: china-leadership
        also: [korea, africa]
        c: 'Zhou Enlai greets Mauritania''s President Daddah at the capital airport, passing through Peking from Korea to Cambodia. Daddah conveys Premier Kim Il Sung''s four-point message: (1) Korea''s policy toward China has not changed and will not; (2) Kim has deep friendship with Mao and Zhou, which he cherishes, made in common struggle; (3) some differences exist, not serious, and may be settled by meeting and discussion; (4) he believes that if Korea is attacked China will help it as it has many times.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 27, 1967). Made public: 2020. See [[cal.1967-10-23.china-leadership]]. Names: Zhou Enlai, Daddah, Kim Il Sung.'
        tags: [name:zhou-enlai, name:daddah-moktar-ould, name:kim-il-sung, polity:prc, vis:only:prc+mauritania]
  - add:
      entry:
        id: cal.1967-10-21.china-leadership-2
        when: Oct. 21
        date: '1967-10-21'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, told that in Suzhou, because of two-faction strife in finance and trade, export goods and daily goods are badly held up and nearly half the city's grain shops have stopped supply, has Du Ping of the Nanjing Military Region and Jiangsu's military control committee men in Peking call the two Suzhou factions' delegates and the garrison heads to settle it.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 192 (Oct. 21, 1967). Made public: 2020. Names: Zhou Enlai, Du Ping.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10-26.china-leadership
        when: Oct. 26
        date: '1967-10-26'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Cambodia''s ambassador Zhang Gang and explains China''s side of the Cambodian misunderstanding of some of its policies and work: China does nothing to please the enemy; even where there are misunderstandings and unexpected criticisms, thinking of the common enemy puts them second. He asks Zhang to tell Sihanouk to keep his views, not argue them in public and give the enemy no use of them.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 192 (Oct. 26, 1967). Made public: 2020. Names: Zhou Enlai, Sihanouk.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1967-10-27.china-leadership-2
        when: Oct. 27
        date: '1967-10-27'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai reports to Mao on the Qinghai committee core groups request of the 19th on whether units that have formed revolutionary committees may resume Party organizational life. Mao: "all places should do so; but the Party organization shall not allow those found with proof to be renegades or spies, nor those who behaved very badly in the Cultural Revolution and will not repent, to take part in organizational life."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 192 (Oct. 27, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10-28.china-leadership
        when: Oct. 28
        date: '1967-10-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the delegates to the national grain conference and the railway conference, asks each of 21 provinces of grain output and purchase, and gives three points: produce well at home and eat no imported grain; by degrees stop hauling southern grain north; buy no more than needed and store grain in the people. Cotton is not turned to cloth because the railways cannot move it.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 192–193 (Oct. 28, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-10-29.china-leadership
        when: Oct. 29
        date: '1967-10-29'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, before dawn, again receives the delegates of the national railway conference: rail transport is the key to grain and industrial output; traffic has not regained its level, and if this year''s target is missed next year suffers. Revolution without business is empty; whoever does this well, once "conservative" or not, is a revolutionary. Freezing a locomotive depot is not allowed; freight first.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193 (Oct. 29, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-10-29.china-leadership-2
        when: Oct. 29
        date: '1967-10-29'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the Tongchuan coal mine in Shaanxi, shut over two months by armed fighting, proposes two steps: the State Council''s business group sends men to help the 21st Army persuade the "Feb. 19" faction to stop fighting and return to the mine; failing that, the masses'' delegates and some bad ringleaders are called to Peking with the army.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193 (Oct. 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-04.china-leadership-2
        when: Nov. 4
        date: '1967-11-04'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai forwards the agreement of the two Tongchuan factions.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193 (under Oct. 29, 1967). Made public: 2020. See [[cal.1967-10-29.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-09.china-leadership-3
        when: Nov. 9
        date: '1967-11-09'
        thread: china-leadership
        also: [china]
        c: The Center, State Council, Military Commission and Cultural Revolution Group issue the instruction on settling the Tongchuan coal mine.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193 (under Oct. 29, 1967). Made public: 2020. See [[cal.1967-10-29.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10-29.china-leadership-3
        when: Oct. 29
        date: '1967-10-29'
        thread: china-leadership
        c: Zhou Enlai goes to Mao's for a meeting on opening the schools and how to run the universities.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193 (Oct. 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10-31.china-leadership
        when: Oct. 31
        date: '1967-10-31'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the delegates of Canton''s mass bodies: students are not to meddle in the workers movement; the workers must first steady the situation, and the working class stand forth as a model.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193–194 (Oct. 31, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10.china-leadership
        when: Oct.
        date: 1967-10
        thread: china-leadership
        c: After National Day Zhou Enlai, told that He Long has a high fever and vomits, orders him sent to Hospital 301; Jiang Qing objects, and he then orders him to Hospital 267 and sends Yang Dezhong to bring his greetings.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Oct. 1967). Made public: 2020. Names: Zhou Enlai, He Long, Jiang Qing, Yang Dezhong.'
        tags: [name:zhou-enlai, name:he-long, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-10.china-leadership-2
        when: Oct.
        date: 1967-10
        thread: china-leadership
        c: At Jiang Qing's prompting, Peking "Heaven" faction students go to the Western Hills to search the marshals' residences. Zhou Enlai orders Fu Chongbi to send two regiments to guard them and dissuade the students, and himself deep at night takes the heads of the Peking garrison to inspect the marshals' quarters and gives instructions on the guard.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Oct. 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Fu Chongbi.'
        tags: [name:zhou-enlai, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-02.china-leadership
        when: Nov. 2–5
        date: '1967-11-02'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, over four days, holds talks on the problems of Shaanxi, Guangdong, Guangxi, Heilongjiang and other provinces, meaning to settle seven provinces soon.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 2–5, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-08.china-leadership-3
        when: Nov. 8
        date: '1967-11-08'
        thread: china-leadership
        also: [china]
        c: The two Guangxi factions in Peking reach the ten-point agreement on promoting the great revolutionary alliance.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (under Nov. 2, 1967). Made public: 2020. See [[cal.1967-11-02.china-leadership]]. Names: Zhou Enlai.'
        tags: [polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-11-03.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 6, 1967; the *Renmin ribao*, *Hongqi* and *Jiefangjun bao* editorial for the 50th anniversary of the October Revolution, drafted under Chen Boda and Yao Wenyuan and approved by Mao, first summing up Mao''s views on class struggle in socialist society as the "theory of continuing revolution under the dictatorship of the proletariat")'
  - add:
      entry:
        id: cal.1967-11-08.china-leadership
        when: Nov. 8
        date: '1967-11-08'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai sends to Mao for approval, and then issues, the Center's Instruction on the Cultural Revolution at the Grass Roots of the Villages this Winter and Next Spring.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 8, 1967). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1967-11-08.china-leadership-2
        when: Nov. 8
        date: '1967-11-08'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, in the evening, receives the Canton delegates in Peking and criticizes bodies that go to the military control committees Mao Zedong Thought classes to seize cadres: telephone home at once and release them; cadres in the classes are protected by the committee. Cadres are not to be met with factionalism but with Party spirit; being rebels is no license. Asked whether democratic persons are to take part in the "four bigs": no.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194–195 (Nov. 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-09.china-leadership-2
        when: Nov. 9
        date: '1967-11-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on Henan''s request to seize power and form a revolutionary committee: first the great revolutionary alliance and the three-in-one, then talk of power and a committee; one faction may not seize power or set up a committee.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 9, 1967). Made public: 2020. See [[cal.1967-11-09.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-11.china-leadership
        when: Nov. 11
        date: '1967-11-11'
        thread: china-leadership
        c: Zhou Enlai calls the State Council business group on foreign trade and foreign aid, with Li Fuchun, Li Xiannian, Chen Yi, Nie Rongzhen, Su Yu and Yu Qiuli.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 11, 1967). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Chen Yi, Nie Rongzhen, Su Yu, Yu Qiuli.'
        tags: [name:zhou-enlai, name:li-fuchun, name:li-xiannian, name:chen-yi, name:nie-rongzhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-11.china-leadership-2
        when: Nov. 11
        date: '1967-11-11'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai chairs the enlarged liaison meeting of the Cultural Revolution Group, which adopts papers on the Guangdong and Guangxi questions.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-12.china-leadership-2
        when: Nov. 12
        date: '1967-11-12'
        thread: china-leadership
        c: Zhou Enlai receives the ambassadors abroad and the rebels of the embassies in turn.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 12, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-13.china-leadership
        when: Nov. 13
        date: '1967-11-13'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, to make sure of a good Canton autumn fair, talks that evening with delegates of Canton's and Zhanjiang's mass bodies and asks them to unite and write a Letter to the People of Canton calling all bodies, workers, peasants, soldiers, students and traders, Party and government offices and service trades to pull together for the fair, and not fight "civil war" now. No one may sabotage or disturb; the military control committee may detain trouble-makers.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 13, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-11-14.china-leadership
        when: Nov. 14
        date: '1967-11-14'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, for the sixth time, receives Guangdong's mass delegates in Peking, reads and explains the Decision of the Center, State Council, Military Commission and Cultural Revolution Group on the Guangdong Question, and asks them to go home to study, rectify, break provincialism, liberate cadres and reach the great alliance; to reach it a batch of cadres must be freed.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 14, 1967). Made public: 2020. To check: the Decision on the Guangdong Question, as issued. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-14.china-leadership-2
        when: Nov. 14
        date: '1967-11-14'
        thread: china-leadership
        also: [china]
        c: The Center, State Council, Military Commission and Cultural Revolution Group issue the Notice that army-level and higher offices of all military regions are not for now to hold the "four bigs" and that units below army keep to positive education, drawn up under Zhou Enlai.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 14, 1967, the item after). See [[cal.1967-11-12.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-11-16.china-leadership-2
        when: Nov. 16
        date: '1967-11-16'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou Enlai receives the delegation of the South Vietnam National Liberation Front under Deng Chenshi (邓尘施) and part of the Vietnamese party and government delegation under Nguyễn Duy Trinh (阮维桢). Told that Vietnam sends the children of cadres to school at Guilin in China: not fit for a cadres'' children school; the children of workers and peasants lose by it, and sending only cadres'' children makes them special; China made its cadres'' children special in the past and the Cultural Revolution has shown many problems.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195–196 (Nov. 16, 1967). Made public: 2020. Names: Zhou Enlai, Nguyễn Duy Trinh. Check: the name of the NLF delegation''s head, given in Chinese as 邓尘施 (perhaps Đặng Trần Thi).'
        tags: [name:zhou-enlai, name:nguyen-duy-trinh, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-11-16.china-leadership-3
        when: Nov. 16
        date: '1967-11-16'
        thread: china-leadership
        c: Zhou Enlai tells the Party's United Front Work Department "great alliance" headquarters to agree whether they can answer for Zhang Jingwu's protection; if so, they may take him back to the Department; if not, the Peking garrison will keep him in custody.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 16, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Zhang Jingwu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-16.china-leadership-4
        when: Nov. 16–17
        date: '1967-11-16'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the delegates of Guangxi''s "Lianzhi" and "April 22" on Nov. 16 and 17: in the great alliance treat cadres rightly and put away factional views of them; he persuades the two to let Wei Guoqing, An Pingsheng and Wu Jinnan into the autonomous regions revolutionary committee preparatory group.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 16, 17, 1967). Made public: 2020. Names: Zhou Enlai, Wei Guoqing.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-17.china-leadership
        when: Nov. 17
        date: '1967-11-17'
        thread: china-leadership
        c: Zhou Enlai reviews the letter of the Peking Knitting General Mill's revolutionary committee reporting its joy to Mao, and the report of the army unit stationed there, soon to be forwarded by the Center, and strikes out the words naming Liu Shaoqi and Peng Zhen, leaving only "the biggest handful of power-holders in the Party on the capitalist road".
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 17, 1967). See [[cal.1967-11-15.china-leadership-2]]. Names: Zhou Enlai, Liu Shaoqi, Peng Zhen.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:peng-zhen, polity:prc]
  - add:
      entry:
        id: cal.1967-11-18.china-leadership-2
        when: Nov. 18
        date: '1967-11-18'
        thread: china-leadership
        c: Zhou Enlai calls the State Council business group meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 18, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-18.china-leadership-3
        when: Nov. 18
        date: '1967-11-18'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives delegates of the Jiangsu "Old Workers'' General", "New Workers'' General" and other bodies and gets the two to agree in Peking to unite and settle the Changzhou railway matter: trains on the Shanghai–Nanjing line often stop there, and Henan''s coal cannot pass. To the rebels from the army: the army is not to meddle in the localities or join local armed fights.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 18, 1967, the item after). Made public: 2020. See [[cal.1967-11-18.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-19.china-leadership
        when: Nov. 19
        date: '1967-11-19'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Guangxi''s delegates in Peking for the eighth time, reads and explains the Decision of the Center, State Council, Military Commission and Cultural Revolution Group on the Guangxi Question, and stresses that the agreement must be carried out: above all the railways and transport must be done well and not interrupted. To the demand that Guangxi cadres studying in Peking be seized and taken back for criticism: "I take it you are putting on a rival show; if one is worth criticizing, keep them all in Peking to be criticized: study first, criticism after."'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196–197 (Nov. 19, 1967). Made public: 2020. To check: the Decision on the Guangxi Question, as issued. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-20.china-leadership-2
        when: Nov. 20
        date: '1967-11-20'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, told that Xiamen''s "Cuhe Lian" is seizing many arms from the military subdistrict and the field army and has wounded soldiers, wires with Chen Boda the "Cuhe Lian", copy to the Xiamen military control committee and the Fuzhou Military Region: this violates the Sept. 5 order; Xiamen is the front of national defence and seizing front-line troops arms is absolutely not to be allowed; stop at once and return all arms taken to their units.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197 (Nov. 20, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda.'
        tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-20.china-leadership-3
        when: Nov. 20
        date: '1967-11-20'
        thread: china-leadership
        c: Zhou Enlai chairs the enlarged liaison meeting of the Cultural Revolution Group to discuss and revise the Center's Circular on Seeking Views on Convening the Ninth Congress.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197 (Nov. 20, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-21.china-leadership
        when: Nov. 21
        date: '1967-11-21'
        thread: china-leadership
        c: Zhou Enlai sends Mao the Center's Circular on Seeking Views on Convening the Ninth Congress.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197 (under Nov. 20, 1967). Made public: 2020. See [[cal.1967-11-20.china-leadership-3]]. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-23.china-leadership
        when: Nov. 23
        date: '1967-11-23'
        thread: china-leadership
        c: Zhou Enlai, with Chen Boda, Kang Sheng and Jiang Qing, holds a forum with delegates of Peking's factory mass bodies and hears of steel and coal output. As many workers plead illness and will not go down the pits, he stresses good political and ideological work.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197 (Nov. 23, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-24.china-leadership
        when: Nov. 24–25
        date: '1967-11-24'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the delegates of Heilongjiang''s "Paohong" and "Shanshang" factions on Nov. 24 and 25 and criticizes the failure of several bodies to reach agreement and unite. To the heads: do not lead the masses wrong, nor eagerly make civil war and seek the limelight; the masses will not follow. The three Northeast provinces are the country''s base for grain, coal and oil; coal is down and grain and oil cannot be shipped. Both sides are to agree on union within a week and go home to grasp revolution and production.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197 (Nov. 24, 25, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-25.china-leadership
        when: Nov. 25
        date: '1967-11-25'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, told that at Zhengzhou station, from factional armed fights, traffic is stopped and over 3,000 wagons are stranded, has the two Zhengzhou factions flown to Peking: "3,000 wagons stopped at Zhengzhou, and I am very grieved. If I had time I would go myself." The railway has a military control committee and still no production command; the railways have had a year and a half of revolution and come to this; what are paper and pens, when trains must run? Delegates of the country''s railway bureaus in Peking also attend.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197–198 (Nov. 25, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-25.china-leadership-2
        when: Nov. 25
        date: '1967-11-25'
        thread: china-leadership
        c: Zhou Enlai calls the State Council business group meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 198 (Nov. 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-26.china-leadership
        when: Nov. 26–27
        date: '1967-11-26'
        thread: china-leadership
        also: [africa]
        c: Zhou Enlai is with Mao at the receptions of Burmese guests and of E. F. Hill, chairman of the Communist Party of Australia (Marxist-Leninist); he receives Tanzania's Minister of Health and attends the Mauritanian National Day reception.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 198 (Nov. 26, 27, 1967). Names: Zhou Enlai, Mao Zedong, Hill. Check: the day of each.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1967-11-28.china-leadership
        when: Nov. 28–Dec. 1
        date: '1967-11-28'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai, each day from Nov. 28 to Dec. 1, calls Liu Jiandong, Wang Xin and other heads of the Henan Military District and the two factions of the Zhengzhou railway bureau, and gets them to agree seven accords, among them a great alliance in the bureau; the Xian bureau reaches one of its own. He drafts the Center's note forwarding the Zhengzhou and Xian agreements to the whole country.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 198–199 (Nov. 28–Dec. 1, 1967). Made public: 2020. Names: Zhou Enlai, Liu Jiandong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-28.china-leadership-2
        when: Nov. 28
        date: '1967-11-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on Li Desheng''s report from Hefei, where the 12th Army is hampered for over half a month by a crowd that makes uproar at the military control committee, storms the army headquarters and injures its officers, with repeated persuasion in vain, writes: telephone Li: first political work; if not heeded, announce the Sept. 5 order and divide them, demanding the ringleaders; if still not, and they commit violence, arrest the ringleaders on the spot; tell the followers that they will not be pursued, but if they repeat, the ringleaders will be arrested on the spot.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Nov. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Desheng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11-29.china-leadership
        when: Nov. 29
        date: '1967-11-29'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou Enlai receives the Pakistan Air Force delegation under Air Marshal Nur Khan. On the causes of the Cultural Revolution: a large country with so many people, with leading organs and masses separated by many layers, easily loses touch with the masses; without revolutionizing thought it breeds bureaucracy and revisionism. China does not recommend this experience to other countries nor tell others to do likewise.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Nov. 29, 1967). Made public: 2020. Names: Zhou Enlai, Nur Khan.'
        tags: [name:zhou-enlai, name:khan-malik-nur, polity:prc, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1967-11-30.china-leadership-2
        when: Nov. 30
        date: '1967-11-30'
        thread: china-leadership
        also: [middle-east]
        c: Zhou Enlai cables President Qahtan al-Shaabi of the People's Republic of South Yemen, congratulating it on its independence.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Nov. 30, 1967). Names: Zhou Enlai, Qahtan al-Shaabi.'
        tags: [name:zhou-enlai, name:shaabi-qahtan-mohammed-al, polity:prc]
  - add:
      entry:
        id: cal.1967-12-01.china-leadership-2
        when: Dec. 1
        date: '1967-12-01'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai chairs the Cultural Revolution Group's liaison meeting on the Opinions and Questions on Restoring Party Organizational Life, the Order to Ensure the Safety of Rail Freight, and the Notice on Treating Right the Old Rebels Who Erred.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Dec. 1, 1967). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-12-02.china-leadership-2
        when: Dec. 2
        date: '1967-12-02'
        thread: china-leadership
        c: Zhou Enlai calls the State Council business group meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Dec. 2, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-02.china-leadership-3
        when: Dec. 2
        date: '1967-12-02'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, with Chen Boda, Kang Sheng and Jiang Qing, receives Tianjin''s delegates; Kang reads the Center''s approval of Tianjin''s revolutionary committee. To the rumor in Tianjin that Zhou took part in the eighth reception of Tianjin delegates and upset the "leaders" plan: proletarian political acts are open and factual; no slandering or inventing; if anyone doubts, put it out and settle it face to face, and not scheme behind one''s back.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199–200 (Dec. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-03.china-leadership
        when: Dec. 3
        date: '1967-12-03'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with Chen Xilian, Pan Fusheng, Wang Jiadao and others.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200 (Dec. 3, 1967). Made public: 2020. Names: Zhou Enlai, Chen Xilian, Pan Fusheng, Wang Jiadao.'
        tags: [name:zhou-enlai, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-04.china-leadership-2
        when: Dec. 4
        date: '1967-12-04'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls the Cultural Revolution Group's liaison meeting on Heilongjiang and other papers.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200 (under Dec. 3, 1967). Made public: 2020. See [[cal.1967-12-03.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-04.china-leadership
        when: Dec. 4
        date: '1967-12-04'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on robbery of the state vault, writes Chen Xilian: robbing a state vault is a crime; cash taken is to be returned in full by a set date and the chief culprit handed over; any further robbery will be dealt with as in the act, with detention and examination, the ringleaders handed over and arrested and tried by law.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200 (Dec. 4, 1967). Made public: 2020. Names: Zhou Enlai, Chen Xilian.'
        tags: [name:zhou-enlai, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-09.china-leadership
        when: Dec. 9
        date: '1967-12-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, in the Cultural Revolution Group''s liaison meeting, takes up the Decision on Military Control of Public Security Organs. In revising it he adds: where rebels inside or outside have seized power, military control still goes on; after it the outside rebels leave and link up there no more, and the inside rebels come under the control committee and join no local alliances.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200 (Dec. 9, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-09.china-leadership-3
        when: Dec. 9
        date: '1967-12-09'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai calls the State Council's business group meeting.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200 (under Dec. 9, 1967). Made public: 2020. See [[cal.1967-12-09.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-09.china-leadership-2
        when: Dec. 9
        date: '1967-12-09'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai tells Huang Yongsheng, on the offices of the Guangdong revolutionary committees preparatory group: following other provinces experience, do not divide it into so many groups, which hurts leadership; leave some specific work to the departments and bureaus.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200–201 (Dec. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
        tags: [name:zhou-enlai, name:huang-yongsheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-10.china-leadership-2
        when: Dec. 10
        date: '1967-12-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on Li Desheng''s report that four mass bodies under Wuhu''s "Three Preparatory Offices" refuse to hand in arms, have stormed the troops three times since December and taken the control committee''s building, replies: the Anhui military control committee is to warn them in writing to stop at once under the Sept. 5 order and hand in their arms, or be dealt with by law.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 201 (Dec. 10, 1967). Made public: 2020. Names: Zhou Enlai, Li Desheng.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-10.china-leadership-3
        when: Dec. 10
        date: '1967-12-10'
        thread: china-leadership
        also: [testing, china]
        c: 'Zhou Enlai chairs the 19th meeting of the Central Special Commission on the coming nuclear test: only the needed tests in the air, economy in production; ready before the 24th. The commission to name the commander, deputies, commissar and chief of staff, each absolutely responsible; no outsiders in the test area; the factions'' disputes to stop; "test now, settle accounts after" is wrong.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 201 (Dec. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-10.china-leadership-4
        when: Dec. 10
        date: '1967-12-10'
        thread: china-leadership
        c: 'Zhou Enlai receives delegates of the health system and hears the report of its work conference: medicines are not to be a source of profit; a handling charge and the cost of renewed production are enough.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 201 (Dec. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-14.china-leadership
        when: Dec. 14
        date: '1967-12-14'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Jiangsu''s rebel delegates and rebukes the storming of the harbor bureau: the military control system is not to be washed away; the harbor bureau must be under it, and both factions obey the committee; its prestige must be set up in any case, for if military control has no authority how is the passage to great alliance and three-in-one made? "Could you do it as chairmen of revolutionary committees?" Private radio transmitters, radio-telephones and broadcasts and tapping of long-distance lines are illegal; if warned and not stopped they become a counter-revolutionary matter and subject to the law.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 201 (Dec. 14, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-15.china-leadership
        when: Dec. 15
        date: '1967-12-15'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai talks with cadres of the Nanjing Military Region on how to set up the prestige of military control and run it well.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 15, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-15.china-leadership-2
        when: Dec. 15
        date: '1967-12-15'
        thread: china-leadership
        c: Zhou Enlai calls the Cultural Revolution Group's liaison meeting, which adopts the Decision of the Center, State Council, Military Commission and Group on Military Control of Xinhua.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 15, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-16.china-leadership-2
        when: Dec. 16
        date: '1967-12-16'
        thread: china-leadership
        c: Zhou Enlai sends the decision on military control of Xinhua, with the list of the control group, to Lin Biao for Mao.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (under Dec. 15, 1967). Made public: 2020. See [[cal.1967-12-15.china-leadership-2]]. Names: Zhou Enlai, Lin Biao, Mao Zedong.'
        tags: [name:zhou-enlai, name:lin-biao, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-19.china-leadership-3
        when: Dec. 19
        date: '1967-12-19'
        thread: china-leadership
        c: Zhou Enlai talks with Xinhua's military control delegates.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (under Dec. 15, 1967). Made public: 2020. See [[cal.1967-12-15.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-16.china-leadership
        when: Dec. 16
        date: '1967-12-16'
        thread: china-leadership
        c: Zhou Enlai calls the State Council business group meeting, and has his secretary put the latest brief on coal output in the meeting folder beforehand.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 16, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-17.china-leadership-3
        when: Dec. 17
        date: '1967-12-17'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Zhou Enlai and Kang Sheng write Mao and Lin Biao that Hồ Chí Minh is soon to go home, with his illness and treatment, and propose that Mao and Lin see or visit him before he leaves.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 17, 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Mao Zedong, Lin Biao, Hồ Chí Minh.'
        tags: [name:zhou-enlai, name:kang-sheng, name:mao-zedong, name:lin-biao, name:ho-chi-minh, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-12-17.china-leadership-6
        when: Dec. 17
        date: '1967-12-17'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Zhou Enlai and Kang Sheng, in the evening, go to Yuquanshan to see Hồ Chí Minh.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (under Dec. 17, 1967). Made public: 2020. See [[cal.1967-12-17.china-leadership-3]]. Names: Zhou Enlai, Kang Sheng, Hồ Chí Minh.'
        tags: [name:zhou-enlai, name:kang-sheng, name:ho-chi-minh, polity:prc, vis:only:prc+drv]
  - cite:
      id: cal.1967-12-17.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 17–18, 1967; Mao''s note to Lin Biao, Zhou and the Group on the Hunan preparatory groups request to hold a birthday celebration for Mao and ceremonies for his statue and the Xiangshan railway: no "absolute authority", no "plant and plant great", birthday celebrations long banned and the ban to be restated, the Hunan meeting set for another day; Zhou''s note of the 18th stops its circulation by 5 p.m. and asks recipients to bring it to the meeting)'
  - add:
      entry:
        id: cal.1967-12-17.china-leadership-4
        when: Dec. 17
        date: '1967-12-17'
        thread: china-leadership
        c: Zhou Enlai receives students abroad about to return to study, and tells them Mao's quotations are not to be used at random; propaganda to the Soviet and East European peoples is not to be forced on them; every nation has its self-respect and forcing things on it breeds ill feeling.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-12-18.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 18, 1967; Zhou with Mao at the reception of the delegation of the Albania–China Friendship Association)'
  - add:
      entry:
        id: cal.1967-12-19.china-leadership-2
        when: Dec. 19
        date: '1967-12-19'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai, on the two Guangxi factions study class members who would go back to Guangxi to preach the great alliance, has his secretary telephone Tan Furen, in charge of the classes, to look into it: if the atmosphere of alliance is good and both are willing to go and speak, he may agree.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 19, 1967). Made public: 2020. Names: Zhou Enlai, Tan Furen.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-20.china-leadership
        when: Dec. 20
        date: '1967-12-20'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives Heilongjiang''s "Hanlianzong" and "Paohong" delegates and urges them to think of the whole and strengthen Party spirit. "Absolute" and "infinite" are not scientific, nor was the earlier "summit": if all become absolute authority, we must fall.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202–203 (Dec. 20, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-21.china-leadership
        when: Dec. 21
        date: '1967-12-21'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou Enlai receives Pakistan''s Deputy Chairman of the Planning Commission, Ahmad, and his government economic delegation. In building, rely on self-reliance: first farming, grain, then clothing and housing, so the people are lively, then light and heavy industry. China has no experience either and feels its way; Chinese experts do not know your conditions and their views may not suit you.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 203 (Dec. 21, 1967). Made public: 2020. Names: Zhou Enlai, Ahmad.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1967-12-21.china-leadership-2
        when: Dec. 21
        date: '1967-12-21'
        thread: china-leadership
        also: [testing, china]
        c: 'Zhou Enlai hears Luo Shunchu on preparation for the nuclear test. On the safety of the radar commander and tracking and photographing stations: if safe, do it; if not, not; in research and tests "safety first"; under socialism we care for men''s safety; in war there are sacrifices, in war on nature the test is whether a sacrifice is unavoidable; where not unavoidable, safety must be assured, and what is not worth it is not done.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 203 (Dec. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Luo Shunchu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-22.china-leadership-3
        when: Dec. 22
        date: '1967-12-22'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai reviews the Notice of the Center, State Council, Military Commission and Group on the Cultural Revolution in the Civil Aviation System and sends it to Lin Biao for Mao. He notes that the discontented have stirred masses to storm airfields and, lately, to beat pilots, five crews hurt; the Military Commission's office group has had the ringleaders arrested; a further military control notice has passed the Group.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 203 (Dec. 22, 1967). Made public: 2020. See [[cal.1967-12-22.china-leadership-2]]. Names: Zhou Enlai, Lin Biao, Mao Zedong.'
        tags: [name:zhou-enlai, name:lin-biao, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-22.china-leadership-4
        when: Dec. 22
        date: '1967-12-22'
        thread: china-leadership
        also: [africa]
        c: 'Zhou Enlai receives delegates of nineteen countries at the consultative meeting of the Afro-Asian Writers Association. On a united front of Afro-Asian writers: the leading members take Marxism-Leninism and Mao Zedong Thought as the Association''s guide, but the programme need not state it in so many words, to suit the Party-minded level of the Afro-Asian and Latin American masses and the times.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 203–204 (Dec. 22, 1967, the item after). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1967-12-23.china-leadership
        when: Dec. 23
        date: '1967-12-23'
        thread: china-leadership
        also: [testing, china]
        c: 'Zhou Enlai and Nie Rongzhen reply by wire to the heads of the nuclear test base, Zhang Shaoyu and Zhang Zhenhuan: agreed to the time fixed for the test. Wipe out factional hostility; all preparation and safety before zero hour is to be done in earnest and responsibly, the organization strengthened, jobs fixed and checked strictly, work made finer and more thorough; beware of fear, carelessness and haste. After zero hour arrange the work well, no hurry to leave the site or go home, no settling of accounts after, and the glorious political task is to be fully done.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 204 (Dec. 23, 1967). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen, Zhang Zhenhuan.'
        tags: [name:zhou-enlai, name:nie-rongzhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-23.china-leadership-2
        when: Dec. 23
        date: '1967-12-23'
        thread: china-leadership
        c: Zhou Enlai calls the State Council business group meeting, having his secretary ask beforehand for the defence industry's 1967 output and 1968 plan, the coal brief and the daily railway report, and for the Second to Seventh Ministries of Machine Building each to send a control-committee head and a minister or vice-minister running business.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 204 (Dec. 23, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-23.china-leadership-3
        when: Dec. 23
        date: '1967-12-23'
        thread: china-leadership
        also: [china]
        c: 'Zhou Enlai receives the delegates of the three Northeast provinces and tells those who go to factories to stir armed fights and stop production to stop: let the working class settle its own questions; no new factions, no more linking up. To judge Mao Zedong Thought by "plant and plant great" and "absolute authority" is unserious. Chen Boda, Kang Sheng, Yao Wenyuan and others are at the reception.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 204 (Dec. 23, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Yao Wenyuan.'
        tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:yao-wenyuan, name:chen-xilian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-25.china-leadership
        when: Dec. 25
        date: '1967-12-25'
        thread: china-leadership
        also: [testing, china]
        c: Zhou Enlai calls Luo Shunchu, Qian Xuesen, Li Jue, Zhu Guangya, Wang Zhichang, Deng Jiaxian and others to hear the report on the test, which did not succeed. The Ninth Academy to gather its experts to think it through; "failure is the mother of success"; some theory and design men were not on the spot; collect and analyze all the data; "settle accounts after the test" is factionalism, not allowed.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 204–205 (Dec. 25, 1967). Made public: 2020. Names: Zhou Enlai, Luo Shunchu, Qian Xuesen, Li Jue, Zhu Guangya, Wang Zhichang, Deng Jiaxian. Check: the chronology does not give the date or kind of the test.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-26.china-leadership
        when: Dec. 26
        date: '1967-12-26'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai attends the Cultural Revolution Group's liaison meeting, hearing the Jiangxi preparatory group and Shanxi's revolutionary committee, and discusses forming a Jiangxi revolutionary committee. After it he talks with the Peking Military Region's heads and Liu Geping.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205 (Dec. 26, 1967). Made public: 2020. Names: Zhou Enlai, Liu Geping.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - cite:
      id: cal.1967-12-27.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205 (Dec. 27, 1967; Zhou''s letter to Mao that the conditions for a Jiangxi revolutionary committee are ripe and should be approved; Mao: "agreed")'
  - add:
      entry:
        id: cal.1967-12-28.china-leadership
        when: Dec. 28
        date: '1967-12-28'
        thread: china-leadership
        c: Zhou Enlai twice calls Li Fuchun, Li Xiannian, Yu Qiuli and Su Jing on railway traffic.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205 (Dec. 28, 1967). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Yu Qiuli, Su Jing.'
        tags: [name:zhou-enlai, name:li-fuchun, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-29.china-leadership-3
        when: Dec. 29
        date: '1967-12-29'
        thread: china-leadership
        also: [china]
        c: Zhou Enlai has his secretary ask the Railways Ministry's control committee about rail transport at Shenyang and whether the "Shentie Red Flag" is stopping work, marching or sitting in.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205 (Dec. 29, 1967). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967-12-31.china-leadership
        when: Dec. 31
        date: '1967-12-31'
        thread: china-leadership
        c: Zhou Enlai calls the State Council business group meeting, and goes with Mao to receive, in two batches, the people of the National Defence Science Commission and the classes of the provinces, municipalities and regions in Peking, and those at the railway and health and epidemic-prevention conferences.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205 (Dec. 31, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967.china-leadership
        when: '1967'
        date: '1967'
        thread: china-leadership
        c: By Zhou Enlai's record, to keep rail transport open and push the railways to a quick great alliance and three-in-one, in the year he received cadres and masses of the railway system nearly a hundred times; the alliance and three-in-one of the country's eighteen railway bureaus, fifty-two sub-bureaus and some main stations and sections were all won through his attention.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205 (1967, the last items). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967.china-leadership-2
        when: '1967'
        date: '1967'
        thread: china-leadership
        c: In stopping armed fights, great alliance, freeing cadres and the three-in-one, Zhou Enlai by day and night receives mass delegates of every region and branch, often from the evening to the dawn, sometimes without time to eat, patiently teaching them to think of the whole, drop factionalism, treat cadres rightly and reach alliance and three-in-one.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205–206 (1967, the last items, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967.china-leadership-3
        when: '1967'
        date: '1967'
        thread: china-leadership
        c: Zhou Enlai takes an interest in ocean science, repeatedly asks about the work of the Oceanography Bureau and gives instructions on some major research projects and works.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 206 (1967, the last items, the item after). Made public: 2020. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1967.china-leadership-4
        when: '1967'
        date: '1967'
        thread: china-leadership
        c: 'Zhou Enlai tells Fu Chongbi to protect Luo Ruiqing, keep it secret, and not let him be seized. Told that Luo''s wound after operation has not healed and rebels still want him at struggle meetings, he orders: no struggle during the operation period.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 206 (1967, the last items, the item after). Made public: 2020. Names: Zhou Enlai, Fu Chongbi, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-11.china-leadership-2
        when: Apr. 11–12
        date: '1966-04-11'
        thread: china-leadership
        c: Zhou Enlai attends the Secretariat's meetings again.
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (under Apr. 9, 1966). Made public: 2020. See [[cal.1966-04-09.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
