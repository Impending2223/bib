      c: Idaho. Samuelson (R) governor over Andrus (D), 104,586 to 93,744, 41.4 percent, a 10,842-vote margin; Swisher (Ind.)
        30,913, 12.2 percent; Jungert (Ind.) 23,139, 9.2 percent. Swisher, a Republican, ran in protest that neither party
        had nominated a backer of the new sales tax; the other independent for legalized gambling.
      n: 'Votes: [Wikipedia, "1966 Idaho gubernatorial election"](https://en.wikipedia.org/wiki/1966_Idaho_gubernatorial_election),
        as the series'' returns of the governors give it (its source *America Votes 30*); Check: Idaho''s abstract of votes.
        [[w.peirce-mountain-states-of-america]], 135, 139 (Swisher; the two independents; the margin, 10,842 votes). See [[cal.1966-08-02.governors-id]];
        [[cal.1966-09.governors-id]]. Names: Samuelson, Andrus.'
