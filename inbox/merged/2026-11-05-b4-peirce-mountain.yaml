      c: '*Arizona v. California*, [373 U.S. 546](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373546/usrep373546.pdf):
        the Boulder Canyon Project Act apportions the Lower Basin''s mainstream water of the Colorado: of the first 7,500,000
        acre-feet, California 4,400,000, Arizona 2,800,000, Nevada 300,000, each State keeping its own tributaries; the Secretary
        of the Interior to divide it by contract. Black for the Court; Harlan, with Douglas and Stewart, dissents in part;
        Douglas dissents; Warren not sitting.'
      n: '*Arizona v. California*, [373 U.S. 546](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373546/usrep373546.pdf),
        546 (the syllabus: the division) (1963). [[w.peirce-mountain-states-of-america]], 235 (Arizona''s 2,800,000 acre-feet;
        the decision the signal to revive the Central Arizona Project in Congress). See [[cal.1961-01.conservation]].'
      src:
