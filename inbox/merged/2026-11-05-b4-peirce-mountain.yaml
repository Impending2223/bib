      c: '*Udall v. Federal Power Commission*, [387 U.S. 428](https://tile.loc.gov/storage-services/service/ll/usrep/usrep387/usrep387428/usrep387428.pdf):
        the Commission''s license to Pacific Northwest Power for a dam at High Mountain Sheep, on the Snake, set aside; whether
        the United States should build it, the public interest in wild rivers, fish and wildlife, and other sources of power
        unexplored. "The test is whether the project will be in the public interest." Douglas for the Court; Harlan, with
        Stewart, dissents; Fortas not sitting.'
      n: '*Udall v. Federal Power Commission*, [387 U.S. 428](https://tile.loc.gov/storage-services/service/ll/usrep/usrep387/usrep387428/usrep387428.pdf),
