        id: cal.1968-04-19.china-leadership
        when: Apr. 19
        date: '1968-04-19'
        time: 1968-04-19T02:30Z
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou Enlai''s fourth talk with Phạm Văn Đồng''s delegation, 15 Jia, Wanshou Road, 10:30 a.m., Kang Sheng present. Zhou: accepting Johnson''s partial halt of the bombing, and a meeting place other than Phnom Penh, were two compromises that weakened Nguyễn Duy Trinh''s statement of Jan. 28, 1967 and helped Johnson out. A dispute over Đồng''s supposed offer to stop sending men South, and over "indirect assistance" and "de-escalation", put down to bad interpretation. Đồng: the strategy is to defend the North and liberate the South; Vietnam will escalate, not de-escalate.'
        n: '[[w.zhou-enlai-waijiao-huodong]], 523–24 (Apr. 19, 1968; 10:30 a.m., 15 Jia, Wanshou Road, the fourth talk); [[w.77-conversations-between-chinese]], [123–127](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=122) (doc. 33; Apr. 19, 1968, no place or hour in the heading: Zhou on the limited bombing halt, Phnom Penh and Warsaw, Nguyễn Duy Trinh''s statement of Jan. 28, 1967; the dispute put down to misinterpretation, in the editors'' brackets, 125; Đồng''s "grand strategy" and rejection of de-escalation; Kang Sheng on the statements of Jan. 1 and Dec. 8 and 12; 123 n.193, Hà Văn Lâu). Made public: 1993. See [[cal.1968-04-13.china-leadership-3]]. Names: Zhou Enlai, Phạm Văn Đồng, Kang Sheng, Johnson, Nguyễn Duy Trinh.'
