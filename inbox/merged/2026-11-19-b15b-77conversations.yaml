        time: 1969-04-20T03:30Z
        time_zone: Asia/Shanghai
        c: 'Zhou Enlai talks with the Vietnamese guests Phạm Hùng and Hoàng Văn Thái: in any work at any time there are shortcomings, and what matters is to sum up experience and find the rules. Zhou: Nixon is cleverer than Johnson, recognizing Cambodia and its borders; Sihanouk plays a double game and tilts to the right; the Soviets and the U.S. are both imperialist chieftains, and Vietnam may be the one deceived; spend less money and fewer officials on the Paris talks.'
