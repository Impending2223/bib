patch: 2026-11-19-b15b-77conversations
by: Claude (batch 15b, 77 Conversations Between Chinese and Foreign Leaders, docs. 1-42 and notes, 1964-Jan. 19, 1970), Nov. 19, 2026; audited, Nov. 19, 2026
ops:
  - add:
      entry:
        id: cal.1964-09-04.china-leadership-3
        when: Sept. 4
        date: '1964-09-04'
        thread: china-leadership
        also: [laos]
        c: 'Beijing. Mao to Sangsiv, head of the Neo Lao Hak Sat''s cultural group, Lian Guan of the National People''s Congress Standing Committee present. The mass line: the cultural group and the army to dress, eat and labor as the masses do, with the Three Disciplines and Eight Attentions; the Chinese Party''s mistakes, two right and three left; bourgeois intellectuals under a new rectification campaign; capitalism restored in the Soviet Union under Khrushchev.'
        n: 'Mao Zedong with Sangsiv, Beijing, Sept. 4, 1964, doc. 1, [[w.77-conversations-between-chinese]], [66–69](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=64) (excerpts, the editors'' ellipses kept; 66 nn.108–109 gloss the Front and Lian Guan, 68 n.110 Aidit). Made public: 1998. To check: [[w.zedong-mao-zedong-nianpu]], V, Sept. 4, 1964 (if it records the talk); [[w.zhou-enlai-waijiao-huodong]] (the Laotian delegation''s visit). Names: Mao Zedong, Sangsiv, Lian Guan, Khrushchev.'
        tags: [name:mao-zedong, name:khrushchev-nikita-s, polity:prc, polity:pathet-lao, vis:only:prc+pathet-lao]
  - add:
      entry:
        id: cal.1964-09-28.china-leadership-4
        when: Sept. 28
        date: '1964-09-28'
        thread: china-leadership
        also: [china]
        c: Beijing. Mao to Sihanouk, Wang Guangmei present, on the second day of the Prince's nine-day visit. The U.S. bombing of the DRV's bases on Aug. 5 and Cambodia's support; Chiang's seat at the U.N. to go in nine or ten years; the Warsaw talks, nine years, with the U.S. to pull the Seventh Fleet out of Taiwan. China's wars of 25 years; the Korean War under Peng Dehuai; Mao's own study of Marxism from the age of 28.
        n: 'Mao Zedong with Prince Sihanouk, Beijing, Sept. 28, 1964, doc. 2, [[w.77-conversations-between-chinese]], [69–71](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=67) (excerpts; the editors'' note on the visit and the Chinese and Soviet aid, 69 n.111). Made public: 1998. To check: [[w.zedong-mao-zedong-nianpu]], V, Sept. 28, 1964. See [[cal.1964-09-28.china-leadership-2]]. Names: Mao Zedong, Sihanouk, Wang Guangmei, Peng Dehuai, Chiang Kai-shek.'
        tags: [name:mao-zedong, name:norodom-sihanouk, name:peng-dehuai, name:chiang-kai-shek, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1965-04-08.china-leadership-2
        when: Apr. 8
        date: '1965-04-08'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Beijing. Liu Shaoqi to Lê Duẩn, who asks for Chinese volunteer pilots, soldiers and road and bridge engineering units: China will do its best and give what it can; it will not come unasked, and will send a unit if one is invited, the initiative the Vietnamese''s. Lê Duẩn wants the pilots to keep the bombing south of the 19th or 20th parallel, defend Hanoi and the main transport lines, and raise morale.'
        n: 'Liu Shaoqi with Lê Duẩn, Beijing, Apr. 8, 1965, doc. 7, [[w.77-conversations-between-chinese]], [83](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=81) (an excerpt; the editors, 83 n.125: the same day the DRV issued its four-point formula). Made public: 1998. Check: [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 618, has Liu with Deng Xiaoping receive Lê Duẩn on Apr. 19 (see [[cal.1965-04-19.china-leadership-4]]); the book''s Apr. 8 is the first day of Zhou''s talks with Nguyễn Duy Trinh ([[cal.1965-04-08.china-leadership]]). Names: Liu Shaoqi, Lê Duẩn.'
        tags: [name:liu-shaoqi, name:le-duan, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-04-13.china-leadership-5
        when: Apr. 13
        date: '1965-04-13'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Hanoi. Tao Zhu to Hồ Chí Minh: the Chinese Central Committee and Mao hold China''s four border provinces responsible for being the immediate rear of Vietnam; all China is the rear.'
        n: 'Tao Zhu with Hồ Chí Minh, Hanoi, Apr. 13, 1965, [[w.77-conversations-between-chinese]], [85 n.128](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=83) (the editors'' note to doc. 9, the talk of May 16, [[cal.1965-05-16.china-leadership]], quoting the talk; no hour, no record named). Made public: 1998. To check: Tao Zhu to Hồ Chí Minh, Hanoi, Apr. 13, 1965, the record not named (quoted by [[w.77-conversations-between-chinese]], 85 n.128). Names: Tao Zhu, Hồ Chí Minh, Mao Zedong.'
        tags: [name:tao-zhu, name:ho-chi-minh, name:mao-zedong, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-04-20.china-leadership-2
        when: Apr. 20
        date: '1965-04-20'
        thread: china-leadership
        also: [indonesia, vietnam]
        c: 'Bogor. Zhou to Subandrio, the four-sentence statement on war with the U.S. Zhou repeats on May 28: China will not start a war against the U.S.; it keeps its word, as in Korea; it is prepared, the whole country mobilized; if the U.S. bombs China the war has no boundary, no air war without a land war, and China may fight abroad.'
        n: '[[w.77-conversations-between-chinese]], [86 n.131](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=84) (the editors'' note to doc. 11: Zhou at Bogor with Subandrio, Apr. 20, 1965, where he ''made the four-point statement''; the points as Zhou gave them to Subandrio at Guangzhou on May 28, [[cal.1965-05-28.china-leadership]], doc. 11, [85–86](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=83)). Made public: 1998. Check: the editors'' day and place for the Bogor talk; the calendar has Zhou at Bogor with Bhutto on Apr. 20 ([[cal.1965-04-20.china-leadership]]) and talks with Sukarno, Subandrio and Phạm Văn Đồng at Jakarta on the evening of Apr. 19 ([[cal.1965-04-19.china-leadership-3]]). To check: the record of the Bogor talk, not named (cited by [[w.77-conversations-between-chinese]], 86 n.131). Names: Zhou Enlai, Subandrio.'
        tags: [name:zhou-enlai, name:subandrio, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1965-05-17.china-leadership-3
        when: May 17
        date: '1965-05-17'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Beijing. Zhou and Deng Xiaoping to Hồ Chí Minh, on Soviet–Vietnamese relations. Zhou: the Soviet revisionists want North Vietnam to talk with the U.S., put the NLF aside and sell out its brothers. Deng: Soviet aid serves Soviet purposes and strategy; if Vietnam finds it awkward to say so, China will.'
        n: 'Zhou Enlai and Deng Xiaoping with Hồ Chí Minh, Beijing, May 17, 1965, doc. 10, [[w.77-conversations-between-chinese]], [85](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=83) (an excerpt; no hour; 85 n.129, Deng). Made public: 1998. To check: [[w.zhou-enlai-waijiao-huodong]] (May 17, 1965). See [[cal.1965-05-16.china-leadership]]. Names: Zhou Enlai, Deng Xiaoping, Hồ Chí Minh.'
        tags: [name:zhou-enlai, name:deng-xiaoping, name:ho-chi-minh, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-11-08.china-leadership
        when: Nov. 8
        date: '1965-11-08'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Guangdong. Zhou to Hồ Chí Minh on the purpose of Soviet aid to Vietnam: to isolate China; to improve Soviet–U.S. relations; to subvert and sabotage, making trouble in China and perhaps in Vietnam.'
        n: 'Zhou Enlai with Hồ Chí Minh, Guangdong, Nov. 8, 1965, [[w.77-conversations-between-chinese]], [88 n.135](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=86) (the editors'' note to doc. 14, quoting the talk; no city, hour or record named). Made public: 1998. To check: Zhou Enlai with Hồ Chí Minh, Nov. 8, 1965, the record not named (quoted by [[w.77-conversations-between-chinese]], 88 n.135); [[w.zhou-enlai-waijiao-huodong]] (Nov. 8, 1965). See [[cal.1965-10-06.china-leadership]], [[cal.1965-11-07.china-leadership]] (Zhou at Guangzhou, Nov. 7–8). Names: Zhou Enlai, Hồ Chí Minh.'
        tags: [name:zhou-enlai, name:ho-chi-minh, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-12-17.china-leadership-3
        when: Dec. 17
        date: '1965-12-17'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Beijing. Chen Yi to Nguyễn Duy Trinh: the Vietnamese policy is right and he agrees; fighting while negotiating has marked both revolutions, the Chinese and the Vietnamese. The U.S. shows no sign of wanting peace and opens talks to deceive opinion; if it wants to talk, so does Vietnam, to unmask it. His personal opinion.'
        n: 'Chen Yi with Nguyễn Duy Trinh, Beijing, Dec. 17, 1965, doc. 15, [[w.77-conversations-between-chinese]], [89](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=87) (an excerpt; no hour; 89 n.137, Trinh). Made public: 1998. Names: Chen Yi, Nguyễn Duy Trinh.'
        tags: [name:chen-yi, name:nguyen-duy-trinh, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1966-03-23.china-leadership-4
        when: Mar. 23
        date: '1966-03-23'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Beijing. Zhou to Lê Duẩn, in the Vietnam Workers'' Party delegation''s visit of Mar. 22–25: the Vietnamese people are the standard-bearer of world revolution. Changes since the new Soviet leaders took power, above all after Kosygin''s visit to Vietnam: the Soviets use their aid to win Vietnam''s trust, split it from China and control it. Joint action with Soviet volunteer pilots is impossible, the Soviets may leak secrets; for the front supporting Vietnam China prefers bilateral and multilateral contacts, and opposing the U.S. goes with opposing revisionism.'
        n: 'Zhou Enlai with Lê Duẩn, Beijing, Mar. 23, 1966, doc. 18, [[w.77-conversations-between-chinese]], [91](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=89) (excerpts; 91 nn.140–141: the delegation''s visit, Mar. 22–25, and Kosygin at Hanoi, Feb. 6–10, 1965). Made public: 1998. Check: Nguyen Vu Tung''s essay (49 n.61) dates the talk Mar. 24, 1966, the record Mar. 23. See [[cal.1966-03-22.china-leadership-3]]. Names: Zhou Enlai, Lê Duẩn, Kosygin.'
        tags: [name:zhou-enlai, name:le-duan, name:kosygin-aleksei, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1966-04-13.china-leadership-2
        when: Apr. 13
        date: '1966-04-13'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Beijing. Zhou, in a talk apart from the one with Lê Duẩn and Nguyễn Duy Trinh: new disagreements with the Soviets over their demand for two Chinese airports and an airlift of weapons to Vietnam. The Vietnamese may praise Soviet aid; to name it together with Chinese aid is an insult to China. Deng: from now on Chinese aid is not to be mentioned with Soviet aid.'
        n: '[[w.77-conversations-between-chinese]], [94 n.145](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=92) (the editors'' note to doc. 19: Zhou ''in a separate conversation on the same day''; the persons, hour and record not given). Made public: 1998. Check: the Vietnamese present and the place, which the note does not give; Nguyen Vu Tung''s essay, 57, has the same words said on Apr. 13 in its text and cites them in its note 86 as the talk of Apr. 14. To check: Zhou Enlai''s separate talk of Apr. 13, 1966, the record not named (quoted by [[w.77-conversations-between-chinese]], 94 n.145). See [[cal.1966-04-13.china-leadership]]. Names: Zhou Enlai, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:deng-xiaoping, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1966-08-23.china-leadership-6
        when: Aug. 23
        date: '1966-08-23'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Beijing. Zhou to Phạm Văn Đồng and Hoàng Tùng: why do Vietnamese papers print documents on the aggressions of Chinese feudal dynasties? Tùng: none; institutes are studying the theme. Zhou: use the Ho Chi Minh trail through Laos, the Cambodian road and the sea route; the Chinese forces for air defense, railways and roads are logistical, not volunteer combat troops, and to call them volunteers would bring requests from Cuba, Algeria and the Soviet Union to send theirs; fight a protracted war in the South and be patient; he proposes 100 Chinese command, logistics, chemical, engineering and political staff, in four or five groups, for South Vietnam as far as Tri Thien, the Central Highlands, Saigon''s suburbs and the Mekong delta.'
        n: 'Zhou Enlai with Phạm Văn Đồng and Hoàng Tùng, Beijing, Aug. 23, 1966, doc. 20, [[w.77-conversations-between-chinese]], [96–97](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=94) (excerpts; 96 n.146, Tùng). Made public: 1998. Check: the hour, which the record does not give; [[w.zhou-enlai-waijiao-huodong]], 503–04, by the note of [[cal.1966-08-18.china-leadership-2]], has Aug. 23 as the fifth of seven talks with Phạm Văn Đồng, at 8 p.m. See [[cal.1966-08-18.china-leadership-2]]. Names: Zhou Enlai, Phạm Văn Đồng, Hoàng Tùng.'
        tags: [name:zhou-enlai, name:pham-van-dong, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-04-12.china-leadership-3
        when: Apr. 12
        date: '1967-04-12'
        thread: china-leadership
        also: [vietnam-hanoi, india-and-china-cultural-revolution]
        c: 'Beijing. Zhou, Chen Yi, Wei Guoqing and Li Fuxian present, to Phạm Văn Đồng and Võ Nguyên Giáp on the Cultural Revolution: its aim to overthrow the Party leaders on the capitalist road, from below, by the masses, Dazhai the model; Liu Shaoqi''s and Deng Xiaoping''s work teams in the summer of 1966, the 11th Plenum and its 16 points, the Red Guards, the seizure of power; Mao''s forecast that the results will show between February and April of 1968. Zhou charges Liu with big-party chauvinism toward fraternal parties, in Vietnam in 1963 too, and with defeatism toward Sukarno, and recalls the Party''s corrupted early leaders from Chen Duxiu to Wang Ming.'
        n: 'Zhou Enlai with Phạm Văn Đồng and Võ Nguyên Giáp, Beijing, Apr. 12, 1967, doc. 28, [[w.77-conversations-between-chinese]], [112–119](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=110) (an excerpt, no hour; 113 n.179, Chen Yonggui; 115 n.180, Chen Boda; 115 n.181, Wei Guoqing; 118 nn.182–188, the Party''s former leaders). Made public: 1998. Check: Zhou''s words, ''our talk with President Ho in Hangzhou in May and June last year'' (117), against the calendar''s Hồ at Hangzhou on June 9–11, 1966, and in Peking on May 18. To check: [[w.zhou-enlai-waijiao-huodong]], 510–11 (Apr. 12, 1967). See [[cal.1967-04-11.china-leadership-2]]. Names: Zhou Enlai, Chen Yi, Phạm Văn Đồng, Võ Nguyên Giáp, Liu Shaoqi, Deng Xiaoping, Sukarno, Mao Zedong.'
        tags: [name:zhou-enlai, name:chen-yi, name:pham-van-dong, name:vo-nguyen-giap, name:liu-shaoqi, name:deng-xiaoping, name:sukarno, name:mao-zedong, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1967-05-13.china-leadership-4
        when: May 13
        date: '1967-05-13'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Beijing. Deputy Foreign Minister Qiao Guanhua to the Vietnamese ambassador Ngô Minh Loan: China agrees to Vietnam''s plan to move 24 Soviet MiG-17s and MiG-21s, due in May and June, by rail in two shipments of 12, and refuses the Soviet plan to fly them over China in AN-12s from May 16 to 24. The Soviets mean to boast of their aid to the U.S., reveal secrets and control Vietnam; the proposal is a conspiracy and a chauvinist act; China does not impose its view.'
        n: 'Qiao Guanhua with Ngô Minh Loan, Beijing, May 13, 1967, doc. 29, [[w.77-conversations-between-chinese]], [119–120](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=117) (an excerpt; 119 nn.189–190: Nghiêm Bá Đức and Phạm Thanh Hà, who told Beijing and Hanoi on May 6 and 9; no hour). Made public: 1998. Names: Qiao Guanhua, Ngô Minh Loan.'
        tags: [name:qiao-guanhua, name:ngo-minh-loan, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1968-06-19.china-leadership-4
        when: June 19
        date: '1968-06-19'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: Beijing. Zhou to Phạm Hùng, Ba Long, Ngô Minh Loan and Trần Văn Quang, on the Khmer Communists, who fight in the border area and complain that Vietnam gave them no arms when the time was ripe. China has no direct relations with them; Zhou asks Vietnam to talk with them, to teach its troops passing through Cambodia to treat the Khmer as equals, and to invite them to Tay Ninh or the Central Highlands to join the fight against the Americans first. If Sihanouk moves against them China can no longer arm Cambodia.
        n: 'Zhou Enlai with Phạm Hùng, Beijing, June 19, 1968, doc. 36, [[w.77-conversations-between-chinese]], [133–135](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=131) (excerpts; 133 n.200, the delegation, Phạm Hùng, Ba Long, Ngô Minh Loan, Trần Văn Quang; 134 n.201, Son Ngoc Minh; no hour). Made public: 1998. To check: [[w.zhou-enlai-waijiao-huodong]] (June 19, 1968). Names: Zhou Enlai, Phạm Hùng, Ba Long (Lê Trọng Tấn), Ngô Minh Loan, Trần Văn Quang, Sihanouk.'
        tags: [name:zhou-enlai, name:ngo-minh-loan, name:norodom-sihanouk, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1969-04-29.china-leadership-2
        when: Apr. 29
        date: '1969-04-29'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Beijing. Li Xiannian to Lê Đức Thọ: the war in South Vietnam is not about a big or small victory but the final one; Lin Biao stressed patience; victory is won by fighting, not at the table, and negotiation is secondary, to expose the enemy''s schemes.'
        n: 'Li Xiannian with Lê Đức Thọ, Beijing, Apr. 29, 1969, doc. 42, [[w.77-conversations-between-chinese]], [157](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=155) (an excerpt, no hour). Made public: 1998. Names: Li Xiannian, Lê Đức Thọ, Lin Biao.'
        tags: [name:li-xiannian, name:le-duc-tho, name:lin-biao, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-04-08.vietnam-hanoi-3
        when: Apr. 8
        date: '1965-04-08'
        thread: vietnam-hanoi
        also: [vietnam-diplomacy]
        c: The DRV issues its four-point formula for peace, answering Johnson's offer of unconditional discussions of Apr. 7.
        n: '[[w.77-conversations-between-chinese]], [83 n.125](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=81) (the editors'' note to doc. 7: Apr. 8, 1965, the same day as Liu Shaoqi''s talk with Lê Duẩn; the text not given); [[w.77-conversations-between-chinese]], [50](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=48) (Nguyen Vu Tung''s essay: the DRV''s four-point proposal of Apr. 8, 1965, demanding an end to U.S. acts of war against the DRV and the withdrawal of U.S. forces from South Vietnam; Phạm Văn Đồng to Harrison Salisbury: a basis for settlement, not conditions for talks). Check: the issuing body; the editors say the DRV, and the resolution of the National People''s Congress Standing Committee of Apr. 20 ([[cal.1965-04-20.china]]) calls the four points the Vietnamese National Assembly''s. To check: the text of the four points. See [[cal.1965-04-07.vietnam]], [[cal.1965-04-08.china-leadership-2]]. Names: Johnson.'
        tags: [name:johnson-lyndon-b, polity:drv]
  - add:
      entry:
        id: cal.1965-04-06.china-leadership-2
        when: Apr. 6
        date: '1965-04-06'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: Hanoi and Beijing reach a secret agreement under which Chinese pilots are to be sent to fight in Vietnam.
        n: '[[w.77-conversations-between-chinese]], [49 n.64](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=47) (Nguyen Vu Tung''s essay, ''Interpreting Beijing and Hanoi'', 49: ''On 6 April 1965''; the essay''s note 64 cites [[w.ke-wenhua-dageming-zhongde-renmin]], 415, with the talk of Liu Shaoqi and Lê Duẩn of Apr. 8, [[cal.1965-04-08.china-leadership-2]], the day the pilots'' four roles were stated). Made public: 1998. Check: the place, the parties and the form of the agreement, which the essay does not give. To check: [[w.ke-wenhua-dageming-zhongde-renmin]], 415 (cited by [[w.77-conversations-between-chinese]], 49 n.64).'
        tags: [polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-07-16.china-leadership-6
        when: July 16
        date: '1965-07-16'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: Beijing tells Hanoi it cannot keep the agreement on Chinese volunteer pilots, for lack of the means.
        n: '[[w.77-conversations-between-chinese]], [49 n.64](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=47) (Nguyen Vu Tung''s essay: ''on 16 July 1965, Beijing informed Hanoi that it was unable to abide by the agreement due to the lack of its own capabilities'', citing [[w.white-book-on-the]], 24). Made public: [[w.white-book-on-the]], 24 (as the essay''s note 64 cites it). Check: the channel and the persons, which the essay does not give; the White Book''s page for the day and the words. To check: [[w.white-book-on-the]], 24 (cited by [[w.77-conversations-between-chinese]], 49 n.64). See [[cal.1965-04-06.china-leadership-2]], [[cal.1965-07-16.china-leadership]].'
        tags: [polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-12-19.china-leadership-3
        when: Dec. 19
        date: '1965-12-19'
        time: 1965-12-19T02:30Z
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou, with Chen Yi, talks again with Nguyễn Duy Trinh, Building 5, Diaoyutai guesthouse, 10:30 a.m. Zhou, in four points: talks will be needed at some point, but the time is not ripe; the military struggle is the main one, and Vietnam''s conditions should be positive and from a high position, not an unconditional halt to the bombing of the North; such a condition makes Hanoi seem to settle North and South apart; and if the U.S. accepts it Vietnam is left passive. Chen Yi: drop the bombing halt, the Four Points are enough.'
        n: '[[w.zhou-enlai-waijiao-huodong]], 487 (Dec. 19, 1965; 10:30 a.m., Building 5, with Chen Yi, talks again); [[w.77-conversations-between-chinese]], [90](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=88) (doc. 17; Beijing, 10:30 a.m., Dec. 19, 1965: Zhou''s four points on the timing of talks and Vietnam''s conditions, the trap set by the U.S. and the revisionists, and Chen Yi''s counsel to drop the bombing halt; 90 n.139, Zhou to Trần Văn Thanh the next day). Made public: 1993. See [[cal.1965-12-18.china-leadership]]. Names: Zhou Enlai, Chen Yi, Nguyễn Duy Trinh.'
