        c: 'Zhou Enlai''s fifth talk with Phạm Văn Đồng''s delegation, back from the Soviet Union, 15 Jia, Wanshou Road, 11 a.m., Kang Sheng present. Zhou: the U.S. has long half-encircled China, and the Soviet Union now encircles it, Vietnam excepted. Đồng on the Soviet talks. Kang Sheng on the Cultural Revolution: Mao''s three-year plan from June 1966; Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun exposed in its first phase, Liu Shaoqi and Deng Xiaoping from June 1966 to January 1967.'
