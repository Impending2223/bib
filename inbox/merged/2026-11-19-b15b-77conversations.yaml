        when: Apr. 13
        time: 1968-04-13T02:00Z
        time_zone: Asia/Shanghai
        c: 'Zhou Enlai talks with the Vietnamese party and government delegation under Phạm Văn Đồng, 15 Jia, Wanshou Road, 10 a.m., the first of five talks. Zhou: the DRV''s statement of Apr. 3 surprised the world and Johnson''s opponents; offering "contact" after a partial halt of the bombing, and dropping Phnom Penh for Warsaw, were two compromises that helped Johnson in his election year; talks should begin from strength. Kang Sheng: Johnson''s expected vote up from 38 to 57 percent.'
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 224 (Apr. 13, 1968); [[w.zhou-enlai-waijiao-huodong]], 523–24 (Apr. 13–29, 1968; the talks with Phạm Văn Đồng''s delegation at 15 Jia, Wanshou Road: the first Apr. 13, 10 a.m.; the second Apr. 14, 10 a.m.; the third Apr. 17, 12:15 p.m.; the fourth Apr. 19, 10:30 a.m.; the fifth Apr. 29, 11 a.m., Đồng briefing on his visit to the Soviet Union); [[w.zhonghua-renmin-gongheguo-waijiao]], 193 (Apr. 13–14, 1968; Phạm Văn Đồng''s delegation; several talks on keeping up the protracted war); [[w.77-conversations-between-chinese]], [121–123](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=119) (doc. 31; Beijing, Apr. 13, 1968, no hour in the record: Zhou on the DRV''s statement of Apr. 3 and Johnson''s of Mar. 31, 121 n.192; Wheeler and Westmoreland, the primaries, King''s murder, the ANZUS meeting, Phnom Penh and Warsaw; Kang Sheng on Johnson''s expected vote). Made public: 1993. Check: no content given. The chronologies give none; the record (doc. 31) does. Names: Zhou Enlai, Phạm Văn Đồng, Johnson, Kang Sheng.'
