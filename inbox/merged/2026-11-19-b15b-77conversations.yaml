        c: 'Zhou, with Chen Yi, talks with Vietnam''s deputy premier Nguyễn Duy Trinh, Building 5, Diaoyutai guesthouse, 2 p.m. Zhou: on Vietnam or China the U.S. would come to Hanoi or Beijing to talk at a hint, as it would on Taiwan. Chen Yi: a hint of talks on South Vietnam, the U.S. presence there agreed to; Zhou: not so; put the South aside, or merely agree to contacts, and they will come at once, the sooner the weaker the terms.'
