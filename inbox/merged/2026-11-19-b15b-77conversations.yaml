  - edit:
      id: cal.1968-06-29.china-leadership-2
      base: 5699ae32
      set:
        c: 'Zhou receives Vietnam''s Phạm Hùng and Lê Trọng Tấn (范雄, 黎仲迅) in the Fujian Hall of the Great Hall of the People. The talks run from 11 a.m. to 6 p.m., Kang Sheng, Li Xiannian, Ye Jianying, Li Qiang and Han Nianlong with Zhou, Lý Ban and Ngô Minh Loan with the Vietnamese. Zhou: the attacks on the cities restrain the enemy but are not decisive, and the Soviet claim that attacks on Saigon are the real offensive is wrong; by taking talks Hanoi has been trapped by the Soviets and left Johnson the initiative; the Soviet nonproliferation treaty is aimed at China.'
