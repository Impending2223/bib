        c: 'Peoples'' Council Against Ratification of the Security Treaty holds its rally in Hibiya Park: 100,000 Government employees, union members and students called, slightly more than 1,000 show.'
        n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) (Richard J. H. Johnston, "Demonstration Draws 22,000 of 225,000 Expected in Japan," Tokyo, July 2: the rally scheduled for "this afternoon"; the Council''s "announced sole aim" the abandonment of the security pact; page not shown). Check: the count, by whose. See [[cal.1960-07-02.japan-2]].'
  - add:
      entry:
        id: cal.1960-07-02.cuba-10
        when: By July 2
        date: '1960-07-02'
        place: havana
        thread: cuba
        also: [soviet-union]
        c: 'Soviet ship *Jean Jaurès* appears off Morro Castle earlier in the week, goes on to Matanzas to discharge cargo; due back in Havana Monday, July 4. Shipping circles speculate she carries arms for the Castro Government.'
        n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Soviet Tankers on Way to Cuba," London, July 2, AP: "earlier this week"; "Monday"; the speculation the London dispatch''s; page not shown). Check: the day of the call off Morro Castle; the cargo. See [[cal.1960-07-02.cuba-7]].'
  - add:
      entry:
        id: cal.1960-07-04.civil-disorders
        when: By July 4
        date: '1960-07-04'
        thread: civil-disorders
        c: A festival is closed because of rioting.
        n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), 1 ("Festival Closed Because of Rioting," a headline over a photograph; the photograph, its caption and any story not in the clippings). To check: the caption and the story, p. 1. Check: the festival, the place, who closed it, the day.'
  - add:
      entry:
        id: cal.1960-07-04.cyprus-3
        when: By July 4
        date: '1960-07-04'
        thread: cyprus
        c: 'Turkish Cypriot demands, made or met "today" by the dispatch; the act, and whose, not in the clippings. Denktash, deputy leader of the Turkish community, held the champion of a tougher line in negotiations than Küçük.'
        n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), 2 (the end of a story, its head, dateline and opening not in the clippings: "demands today"; Denktash "generally regarded as the deputy leader"). To check: the story''s head and opening. Names: Kutchuk. Check: the act; whose it is (the fragment''s "He" read as Denktash); the day, by the dispatch''s dateline.'
        tags: [name:kutchuk-fazil]
