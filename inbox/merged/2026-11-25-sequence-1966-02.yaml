- check: {id: cal.1966-02-18.vietnam-humphrey-2, text: 'Check: the flight may be Feb. 18. Humphrey sees Indira Gandhi at New Delhi Feb. 17 ([FRUS 1964–68, XXV, doc. 296](https://history.state.gov/historicaldocuments/frus1964-68v25/d296)); he has a fourteen-hour flight from India and a staff meeting the first night in Australia ([[w.humphrey-education-of-a-public-1976]], 335); Solberg''s note dates the Canberra staff meeting Feb. 18 ([[w.solberg-hubert-humphrey]], 508).'}
- check: {id: cal.1966-02-23.china-leadership-5, text: 'Check: Liu''s letter of Feb. 23 has the Center call the meeting "in a few days" ([[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 632); the meeting may fall after Feb. 23.'}
