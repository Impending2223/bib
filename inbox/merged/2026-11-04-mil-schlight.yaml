patch: mil-schlight
by: 'Claude (the military re-read, group af: Schlight, The Years of the Offensive, 1988), Nov. 5, 2026'
ops:
- cite:
    id: cal.1965-01-27.vietnam-4
    item: '[[w.schlight-united-states-air-force]], 17 (in emergencies only, mission by mission, with the Chiefs'', Taylor''s
      and the Vietnamese high command''s approval)'
- add:
    entry:
      id: cal.1965-03-09.vietnam
      when: Mar. 9
      date: '1965-03-09'
      thread: vietnam
      c: Westmoreland free to launch American jets at his own discretion for missions in the South the Vietnamese cannot handle;
        Washington drops the rule that a Vietnamese be aboard every strike aircraft and armed helicopter. Jet missions had
        been canceled since Feb. 19 for want of the Joint General Staff's timely approval.
      n: '[[w.schlight-united-states-air-force]], 18, 20. See [[cal.1965-01-27.vietnam-4]]. Names: Westmoreland.'
      src:
        c: 55be0121
        rows:
        - 'w.schlight-united-states-air-force 18, 20: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-04-12.vietnam-2
      when: Apr. 12
      date: '1965-04-12'
      thread: vietnam
      c: A Marine squadron of F-4Bs arrives at Da Nang.
      n: '[[w.schlight-united-states-air-force]], 25.'
      src:
        c: '36570589'
        rows:
        - 'w.schlight-united-states-air-force 25: all'
- cite:
    id: cal.1965-05-05.vietnam
    item: '[[w.schlight-united-states-air-force]], 36 (the brigade flown in: by the evening of May 7, 1,800 troops and 1,100
      tons at Bien Hoa and Vung Tau)'
- add:
    entry:
      id: cal.1965-08-02.vietnam-air-war
      when: Aug. 2
      date: '1965-08-02'
      thread: vietnam-air-war
      c: The B-52s over the South find their targets by radar for the first time, not the beacon; five Arc Light missions
        in July, twice that in August.
      n: '[[w.schlight-united-states-air-force]], 82. See [[cal.1965-06-18.vietnam]].'
      src:
        c: e3c8b212
        rows:
        - 'w.schlight-united-states-air-force 82: all'
- add:
    entry:
      id: cal.1965-08-26.vietnam-air-war
      when: Aug. 26
      date: '1965-08-26'
      thread: vietnam-air-war
      c: The first of the smaller B-52 missions, north of Bien Hoa, follow-ups on short notice; from then five planes upward,
        now and then thirty; in October two and three at once.
      n: '[[w.schlight-united-states-air-force]], 83. See [[cal.1965-06-18.vietnam]].'
      src:
        c: 9f965dfc
        rows:
        - 'w.schlight-united-states-air-force 83: all'
- add:
    entry:
      id: cal.1965-11-14.vietnam-2
      when: Nov. 14
      date: '1965-11-14'
      thread: vietnam
      c: Twenty C-47s land at Tan Son Nhut to form the 4th Air Commando Squadron, gunships; one or more had flown test missions
        with side-firing guns for almost a year.
      n: '[[w.schlight-united-states-air-force]], 90–91.'
      src:
        c: c2282964
        rows:
        - 'w.schlight-united-states-air-force 90–91: all'
- add:
    entry:
      id: cal.1966-03-08.vietnam
      when: Mar. 8
      date: '1966-03-08'
      thread: vietnam
      c: Skoshi Tiger's test of the F-5 in combat ends; the squadron, its first missions above the DMZ Feb. 28, back to Bien
        Hoa, judged fit, kept in Vietnam with six more planes; a month later the 10th Fighter Squadron.
      n: '[[w.schlight-united-states-air-force]], 125.'
      src:
        c: a2bd5e33
        rows:
        - 'w.schlight-united-states-air-force 125: all'
- add:
    entry:
      id: cal.1966-05-27.vietnam-5
      when: May 27
      date: '1966-05-27'
      thread: vietnam
      c: The Air Force signs a contract with Walter Kidde Constructors to build its base at Tuy Hoa, outside MACV's construction
        system.
      n: '[[w.schlight-united-states-air-force]], 122.'
      src:
        c: 6e011870
        rows:
        - 'w.schlight-united-states-air-force 122: all'
- add:
    entry:
      id: cal.1966-07-02.vietnam-operations
      when: July 2
      date: '1966-07-02'
      thread: vietnam-operations
      c: Skyspot radar bombing used for the first time in support of troops in battle, against the Viet Cong's 9th Division
        northwest of Saigon; two flights of F-100s and one of F-4s bomb from 10,000 feet through an 800-foot overcast, within
        500 feet of friendly forces.
      n: '[[w.schlight-united-states-air-force]], 212.'
      src:
        c: 7f6045ec
        rows:
        - 'w.schlight-united-states-air-force 212: all'
- add:
    entry:
      id: cal.1966-07-24.vietnam-air-war
      when: July 24
      date: '1966-07-24'
      thread: vietnam-air-war
      c: The ban on striking the enemy in the Demilitarized Zone lifted, State dropping its objection; the strikes only on
        clearly defined military targets, controlled by forward air controllers. July 25, a FAC finds a major ammunition depot
        just north of the zone.
      n: '[[w.schlight-united-states-air-force]], 208. See [[cal.1966-07-15.vietnam-operations]].'
      src:
        c: 897cbbfb
        rows:
        - 'w.schlight-united-states-air-force 208: all'
- add:
    entry:
      id: cal.1966-09-15.vietnam-air-war
      when: Sept. 15–26
      date: '1966-09-15'
      thread: vietnam-air-war
      c: Eight B-52 missions in the Demilitarized Zone and around Tchepone, Westmoreland having pried reluctant leave from
        Washington and Vientiane; ten more days in October, then suspended when SA-2 sites are found north of the zone.
      n: '[[w.schlight-united-states-air-force]], 209. See [[cal.1966-07-24.vietnam-air-war]]. Names: Westmoreland.'
      src:
        c: b3cdacca
        rows:
        - 'w.schlight-united-states-air-force 209: all'
      tags:
      - name:westmoreland-william
- cite:
    id: cal.1967-03-02.vietnam-operations
    item: '[[w.schlight-united-states-air-force]], 260'
- cite:
    id: cal.1967-04-10.vietnam-air-war
    item: '[[w.schlight-united-states-air-force]], 256 (three B-52s from Guam land at U Tapao after the Junction City mission)'
- add:
    entry:
      id: cal.1967-04-09.vietnam
      when: Apr. 9–14
      date: '1967-04-09'
      thread: vietnam
      c: Air Force C-130s fly the 196th Light Infantry Brigade's 3,500 men and 4,000 tons of equipment three hundred miles
        from Tay Ninh to Chu Lai, the core of the Americal Division; heavier equipment by Navy LSTs.
      n: '[[w.schlight-united-states-air-force]], 261.'
      src:
        c: f58165b9
        rows:
        - 'w.schlight-united-states-air-force 261: all'
- add:
    entry:
      id: cal.1967-06-28.vietnam-air-war
      when: June 28
      date: '1967-06-28'
      thread: vietnam-air-war
      c: The Misty FACs, F-100Fs controlling strikes north of the DMZ, fly their first missions; unopposed a week, fired on
        July 5 and from then on half their missions.
      n: '[[w.schlight-united-states-air-force]], 268.'
      src:
        c: 2fe43e14
        rows:
        - 'w.schlight-united-states-air-force 268: all'
- cite:
    id: cal.1968-01-21.vietnam
    item: '[[w.schlight-united-states-air-force]], 280 (Niagara''s bombing from Jan. 22, as many as three hundred targets
      a day within a week)'
- add:
    entry:
      id: cal.1968-02-10.vietnam-khe-sanh
      when: Feb. 10
      date: '1968-02-10'
      thread: vietnam-khe-sanh
      c: A Marine C-130 destroyed and another damaged landing at Khe Sanh; Momyer stops the C-130s going in. The C-123s go
        on, O-2s on their wingtips directing fighters on the guns.
      n: '[[w.schlight-united-states-air-force]], 284. Names: Momyer.'
      src:
        c: f7dd1d03
        rows:
        - 'w.schlight-united-states-air-force 284: all'
      tags:
      - name:momyer-william-w
- add:
    entry:
      id: cal.1968-03-22.vietnam-2
      when: Mar. 22
      date: '1968-03-22'
      thread: vietnam
      also:
      - vietnam-khe-sanh
      c: The first mission under the single manager system; Niagara ends Mar. 31, the Marines' control agency barely joined
        to the Air Force's center in Saigon.
      n: '[[w.schlight-united-states-air-force]], 286. See [[cal.1968-03-08.vietnam]].'
      src:
        c: bf8adf35
        rows:
        - 'w.schlight-united-states-air-force 286: all'
- cite:
    id: cal.1965-05-16.vietnam-operations
    item: '[[w.schlight-united-states-air-force]], 45 (a B-57 explodes at the head of four loaded for Laos, the fire spreading
      along the line: twenty-eight Americans killed, a hundred injured; ten of eighteen B-57s, a Navy F-8 and two Air Force
      A-1s destroyed; Moore closes the base)'
- check:
    id: cal.1965-05-16.vietnam-operations
    text: 'Check: Schlight dates it "the following Sunday morning (May 15)" (45); May 16, 1965, was the Sunday'
