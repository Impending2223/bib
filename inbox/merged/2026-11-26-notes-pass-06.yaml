    set:
      n: '[[w.branch-pillar-of-fire]], 492; [[w.mann-walls-of-jericho]], 443 (Russell declines Lady Bird Johnson''s requests, three times, to join her in Georgia); [[w.johnson-white-house-diary]], 195–98 (Friday, Sept. 11: her telephone calls to the Governors and Senators of the States on the train''s route; Byrd, "an invisible silken curtain fell across his voice," no public affairs since Mrs. Byrd''s death; Thurmond, "a really basic decision within the next two weeks"; Russell, no, but glad to lend one or two advance men from his staff; the acceptances and refusals of Harrison, Sanford, Ervin, Jordan, Olin Johnston, Donald Russell, Talmadge, Sanders, Holland, Smathers, Bryant, Hill, Sparkman, Ellender, Robertson, Stennis, McKeithen; the Moores, Burns and Eastland not reached). The diary dates the calls "Today," Friday, Sept. 11 ([[w.johnson-white-house-diary]], 195). Names: Lady Bird Johnson, Byrd, Russell, Thurmond.'
