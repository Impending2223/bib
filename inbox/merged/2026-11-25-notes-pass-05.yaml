    after: end
    words: 'Kennedy is against removing Diệm and Nhu for "media pressure." Aug. 27: Colby and Krulak report; Kennedy: no coup unless likely to succeed. Aug. 28, noon: McNamara, not to go on "as if propelled by momentum"; Ball and Harriman for a coup; Nolting against.'
    item: '[[w.mcnamara-in-retrospect]], ch. 3 at nn.8–11'
- add-words:
    id: cal.1963-08-26.vietnam
    after: end
    words: Nolting is brought in Aug. 27 to give the case for Diệm; Harriman, Ball, Hilsman and Forrestal say the United States must decide now to see an overthrow through; Taylor, McNamara, McCone and Johnson strongly oppose a coup.
