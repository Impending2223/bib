    words: 'Aug. 26, noon: Kennedy meets McNamara, Gilpatric, Taylor, Rusk, Ball, Harriman and Hilsman; Hilsman explains the cable and "direct support"; Taylor has no experience of turning the choice of a head of state over to local generals.'
