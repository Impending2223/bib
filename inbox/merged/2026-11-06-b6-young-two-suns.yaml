- add:
    entry:
      id: cal.1962-11-17.goldwater
      when: Nov. 17
      date: '1962-11-17'
      thread: goldwater
      c: 'J. D. Stetson Coleman, a Goldwater supporter and Republican pollster, to Goldwater: "You will definitely carry the
        South if you campaign down there properly." Rockefeller "couldn''t carry the South. I have polled this question in
        all of the southern states."'
      n: '[[w.young-two-suns-of-the]], 60–61. To check: Coleman to Goldwater, Nov. 17, 1962, "Draft Goldwater (Chicago Meeting),"
        box 119, Barry M. Goldwater Papers, Arizona State University (cited by [[w.young-two-suns-of-the]], 61 n.25a). Names:
        Goldwater, Rockefeller.'
      tags:
      - name:goldwater-barry-m
      - name:rockefeller-nelson
      src:
        c: 6a230b23
        rows:
        - 'w.young-two-suns-of-the 60–61: all'
        - 'via x.1962-11-17.coleman-to-goldwater: all'
- add:
    entry:
      id: cal.1964-02.goldwater-6
      when: Feb.
      date: 1964-02
      thread: goldwater
      also:
      - right-and-the-military
      c: 'University of Nevada. Goldwater on the John Birch Society: "if you could read the purposes of the John Birch Society,
        it would be very difficult for any American to disagree with them. It''s sort of like free beer and mother love. You
        got to go along with them."'
      n: '[[w.young-two-suns-of-the]], 71 (the words as a Rockefeller supporter''s paper quotes them). To check: "John Birch
        Society," Mar. 3, 1964, Morrow Files, Rockefeller Family Collection, Rockefeller Archive Center (cited by [[w.young-two-suns-of-the]],
        71 n.51b). See [[cal.1964-01-18.goldwater]]. Check: the day. Names: Goldwater.'
      tags:
      - name:goldwater-barry-m
      src:
        c: be5b0564
        rows:
        - 'w.young-two-suns-of-the 71: all'
        - 'via x.1964-03-03.john-birch-society-rockefeller-staff-paper: all'
- add:
    entry:
      id: cal.1964-03-03.elections-1964-primaries
      when: Mar. 3
      date: '1964-03-03'
      thread: elections-1964-primaries
      c: 'A paper for Rockefeller''s campaign, "John Birch Society": Goldwater''s words at the University of Nevada; such
        words to be used to "bait" him into saying which issues of the right he endorses.'
      n: '[[w.young-two-suns-of-the]], 71. To check: "John Birch Society," Mar. 3, 1964, Morrow Files, Rockefeller Family
        Collection, Rockefeller Archive Center (cited by [[w.young-two-suns-of-the]], 71 n.51b). See [[cal.1964-02.goldwater-6]].
        Names: Rockefeller, Goldwater.'
      tags:
      - name:rockefeller-nelson
      - name:goldwater-barry-m
      src:
        c: 29a19bbb
        rows:
        - 'w.young-two-suns-of-the 71: all'
        - 'via x.1964-03-03.john-birch-society-rockefeller-staff-paper: all'
- add:
    entry:
      id: cal.1964-06-10.elections-1964-vice-presidency
      when: June, early, by the 10th
      date: 1964-06
      thread: elections-1964-vice-presidency
      c: 'A potluck dinner with the Johnsons, by Katie Louchheim''s journal letter of June 10. Helen Mahon, wife of George
        Mahon: against Goldwater in Texas "It will be murder," but "LBJ will win." Asked by a woman close to the Kennedys
        whether Johnson would choose Robert Kennedy: "If it''s Bob K. we''ll lose."'
      n: '[[w.young-two-suns-of-the]], 124. To check: Katie Louchheim, "Dear Gerry," 75–76, June 10, 1964, Louchheim Papers,
        Library of Congress (cited by [[w.young-two-suns-of-the]], 124 n.35b). Check: the day of the dinner. Names: Johnson,
        Lady Bird Johnson, George Mahon, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mahon-george-h
      - name:kennedy-robert-f
      src:
        c: 3f04154d
        rows:
        - 'w.young-two-suns-of-the 124: all'
        - 'via x.1964-06-10.louchheim-dear-gerry-75-76: all'
- add:
