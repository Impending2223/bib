      id: cal.1964-06.elections-1964-johnson
      when: June, late
      date: 1964-06
      thread: elections-1964-johnson
      also:
      - press-and-broadcasting
      c: 'Liz Carpenter, Mrs. Johnson''s press secretary, to Johnson: the *Detroit News*, a Republican paper, likely to endorse
        him; a luncheon with its leaders advised.'
      n: '[[w.young-two-suns-of-the]], 146. Check: the day; the record (the note does not name it). Names: Carpenter, Johnson.'
      tags:
