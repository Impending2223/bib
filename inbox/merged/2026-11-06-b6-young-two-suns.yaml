- add:
    entry:
      id: cal.1964-11-13.republican-party
      when: Nov. 13, mailed
      date: '1964-11-13'
      thread: republican-party
      also:
      - goldwater
      c: 'Rockefeller to Goldwater, in his hand, on the Hotel Ritz''s paper, Madrid: "A line to tell you that I am sorry that
        after your tremendous personal effort the campaign result was disappointing. ... I know that you are glad and relieved
        that it is over."'
      n: '[[w.young-two-suns-of-the]], 198. To check: Nelson to Barry, n.d., mailed Nov. 13, 1964, Hinman Politics files,
        RG 4, Nelson A. Rockefeller Personal Papers, Rockefeller Archive Center (cited by [[w.young-two-suns-of-the]], 198
        n.60b). Names: Rockefeller, Goldwater.'
      tags:
      - name:rockefeller-nelson
      - name:goldwater-barry-m
      src:
        c: d2e50c80
        rows:
        - 'w.young-two-suns-of-the 198: all'
        - 'via x.1964-11-13.rockefeller-to-goldwater-from-madrid: all'
