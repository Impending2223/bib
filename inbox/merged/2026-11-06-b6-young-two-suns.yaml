      when: Oct. 12
      date: '1964-10-12'
      thread: elections-1964-johnson
      c: 'SHR to Walter Jenkins, on New Mexico: "not safe for the President." Johnson pressed to go there.'
      n: '[[w.young-two-suns-of-the]], 182. To check: SHR to Jenkins, Oct. 12, 1964, WHCF, PL/ST 31, box 56, LBJ Library (cited
        by [[w.young-two-suns-of-the]], 182 n.25c). The visit: [[cal.1964-10-28.elections-1964]]. Names: Jenkins, Johnson.'
      tags:
