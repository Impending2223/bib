- check:
    id: cal.1960-04-25.china-leadership-9
    text: 'Check: whether the 6:30 banquet is Zhu De''s, [[cal.1960-04-25.china-leadership-13]], which [[w.zhu-de-nianpu-xinbian]], III, 1773 and [[w.peng-zhen-nianpu-1902]], IV, 21–22 put in the evening of the 25th.'
- check:
    id: cal.1961-04-05.laos
    text: 'Check: whether Phoumi''s offensive of this day, [[cal.1961-04-05.laos-2]], is the same operation.'
- check:
    id: cal.1961-05-19.freedom-rides-2
    text: 'Check: the day; the Public Papers date the Peace Corps council meeting May 22, [[cal.1961-05-22.peace-corps]].'
- check:
    id: cal.1961-05-30.laos-2
    text: 'Check: whether the crash is the Air America H-34 crash of [[cal.1961-05-30.laos]].'
- check:
    id: cal.1967-07-20.china-leadership-2
    text: 'Check: the venue of the meeting; [[w.zhou-enlai-nianpu-1949-2020]], III, 167 has Lin Biao''s, [[cal.1967-07-20.china-leadership-15]] the Great Hall.'
- check:
    id: cal.1967-07-20.china-leadership-15
    text: 'Check: the venue of the meeting; [[w.zhou-enlai-nianpu-1949-2020]], III, 167 (in [[cal.1967-07-20.china-leadership-2]]) has Lin Biao''s.'
- check:
    id: cal.1962-07-11.china-leadership-2
    text: 'Check: the report to Mao is the midnight report of [[cal.1962-07-12.china-leadership]], which [[w.zedong-mao-zedong-nianpu]], V, puts on July 12; [[w.zhou-enlai-nianpu-1949]], II, 489 puts it on July 11.'
- check:
    id: cal.1962-07-19.china-leadership-10
    text: 'Check: the day; [[w.mao-zedong-zhuan]], V, ch. 70 has the Center''s urgent notice sent July 18.'
- check:
    id: cal.1966-09-24.china-leadership-6
    text: 'Check: the day; [[w.zhou-enlai-nianpu-1949-2020]], III, 63–64 has the Center send the report out Sept. 23.'
- check:
    id: cal.1960-03-08.china-leadership-2
    text: 'Check: the day; [[w.zhou-enlai-waijiao-huodong]], 271 and [[w.peng-zhen-nianpu-1902]], IV, 8 put this meeting and the reception of the delegations on the afternoon of Mar. 7, and the evening gathering of the capital''s women, [[cal.1960-03-08.china-leadership-3]], on Mar. 8; [[w.zhou-enlai-nianpu-1949]], II, 292 has Mar. 8.'
- check:
    id: cal.1960-03-20.china-leadership-8
    text: 'Check: whether the notice of "last night" (昨晚) is of the night of Mar. 19 or is Gao Zhi''s call of 12:30 a.m., [[cal.1960-03-20.china-leadership-7]]; which day''s entry of [[w.yang-shangkun-riji]], I, 490 holds the words settles it.'
- check:
    id: cal.1960-11-29.china-leadership-7
    text: 'Check: whether Deng''s telling Kapo is one of the briefings of [[cal.1960-11-29.soviet-union-4]].'
- check:
    id: cal.1963-12-05.robert-kennedy
    text: 'Check: whether the talk of the vice presidency was on the flight to Boston or on the flight back, where [[w.schlesinger-journals]], 212 puts the talk of the FBI, [[cal.1963-12-05.robert-kennedy-2]]: one talk or two.'
- check:
    id: cal.1965-02-08.vietnam-force-levels
    text: 'Check: the Hawk order; [[cal.1965-02-07.vietnam]] has it on Feb. 7.'
- check:
    id: cal.1965-02-08.vietnam-force-levels-2
    text: 'Check: the day; [[w.macv-command-history-1965]], 478 has the first elements of the battalion operational Feb. 9.'
- check:
    id: cal.1968-03-31.elections-1968-9
    text: 'Check: whether the call to the President is the call to Mrs. Johnson of [[cal.1968-03-31.elections-1968-mccarthy-2]].'
- check:
    id: cal.1964-10-14.china-leadership-2
    text: 'Check: the day; [[w.jian-zhou-enlai]], 510 has the call "late that night" on Oct. 15.'
- check:
    id: cal.1964-12-12.laos
    text: 'Check: the line; [[w.cosmas-joint-chiefs-of-staff-2012]], 189–90 and [[w.anthony-war-in-northern-laos]], 144 have the principals approve Barrel Roll and the order go to CINCPAC this day, and the first mission fly Dec. 14, [[cal.1964-12-14.laos]]: the line to say the approval, the missions to go to that entry.'
- check:
    id: cal.1966-02-26.vietnam-air-war
    text: 'Check: the day; [[w.staaveren-gradual-failure]], 237 has Rolling Thunder 49 approved Feb. 25.'
- check:
    id: cal.1966-04-25.vietnam-congress-foreign-relations
    text: 'Check: the day; [[w.gibbons-u-s-government-and]], IV, 312–13 and [[w.dallek-flawed-giant]], 370 tell the same invitation in entries of Apr. 26 and 27, neither with a day of its own; Johnson''s Daily Diary for the Houston trip would settle it.'
- check:
    id: cal.1968-06-14.elections-1968-3
    text: 'Check: whether the remark to reporters by telephone (the *New York Times*) is the remark of [[cal.1968-06-16.elections-1968-2]], June 16; the radio interview is of June 14.'
- check:
    id: cal.1966-07-15.open-housing
    text: 'Check: the hours; [[w.cohen-american-pharaoh]], 391–92 has five hours with the gang leaders, [[w.branch-at-canaans-edge]], 504–5 four.'
- follows:
    id: cal.1966-10-24.china-leadership-6
    add:
    - cal.1966-10-24.china-leadership-4
    basis: -4 is the reception (a morning range), -6 the luncheon at noon ([[w.zhou-enlai-waijiao-huodong]], Oct. 24, 1966)
