patch: 2026-11-14-nyt-1968-01-06
by: 'Claude (the lead), Nov. 14, 2026, from the owner''s clippings of the *New York Times*, Jan. 6, 1968, pp. 1, 3, 4, 5, 6, 7 (screenshots sent in the session); audited the same day against the clippings (Claude, auditor)'
ops:
  - add:
      entry:
        id: cal.1968-01-04.vietnam-diplomacy
        when: Jan. 4
        date: '1968-01-04'
        thread: vietnam-diplomacy
        c: 'Rusk, on Trinh''s statement: the United States is trying to learn whether Hanoi seriously wants to enter negotiations or is engaged only in a propaganda move.'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1 (Rusk "yesterday"). See [[cal.1967-12-29.vietnam]]. Names: Rusk, Nguyễn Duy Trinh. Check: where and to whom Rusk said it.'
        tags: [name:rusk-dean, name:nguyen-duy-trinh]
  - add:
      entry:
        id: cal.1968-01-04.robert-kennedy
        when: Jan. 4
        date: '1968-01-04'
        thread: robert-kennedy
        also: [vietnam-diplomacy]
        c: 'San Francisco, the Commonwealth Club of California. Robert Kennedy, answering questions: "It would make some sense to go to the negotiating table and see if we can resolve the conflict"; "We have to at least take the first step."'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3 (Kennedy "yesterday"). Names: Robert Kennedy.'
        tags: [name:kennedy-robert-f, state:ca, city:san-francisco]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-pacification
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-pacification
        c: 'Saigon. The Mission: the Viet Cong killed 3,820 civilians in 1967, against 1,618 in 1966, and kidnapped 5,368, against 3,507. Komer: the rise "suggests increasing enemy desperation." The biggest attack, by AP''s account, at the Montagnard village of Đắk Sơn: about 200 civilians killed with flame throwers and grenades.'
        n: '"Vietcong Slaying of Civilians in ''67 Put at 3,820" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. See [[cal.1967-12-05.vietnam-operations]]. Names: Komer. Check: AP dates Đắk Sơn mid-December; the calendar Dec. 5, 108 killed, by mortar fire (MACV).'
        tags: [name:komer-robert-w]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-air-war
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-air-war
        c: 'Air Force planes strike railroad bridges and sidings northeast of Hanoi: the Lạng Sơn railroad bridge, within ten miles of the Chinese border, for the third day in a row, reported destroyed, with four antiaircraft sites; the Kép airfield. 135 missions over the North. Two F-105s lost; with two Navy planes, announced that night, and an F-100 lost near Ban Mê Thuột Jan. 4, the announced American losses pass 1,000: 781 over the North since Feb. 7, 1965, 220 in the South.'
        n: 'Tom Buckley, "U.S. Plane Losses in Vietnam Pass 1,000 as 5 Are Downed," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3 (Saigon, Jan. 6: "yesterday"). Check: the day of the 135 missions; the days of the Navy''s two losses (one, Lt. (jg) Crag Taylor''s F-8, hit off Thanh Hóa "Thursday," Jan. 4, the pilot rescued).'
  - add:
      entry:
        id: cal.1968-01-05.europe-and-the-alliance-federal-republic
        when: Jan. 5
        date: '1968-01-05'
        thread: europe-and-the-alliance-federal-republic
        also: [vietnam-diplomacy]
        c: 'Bonn. The Social Democrats'' executive board, after a closed meeting and a political survey by Brandt, calls on the United States to end the bombing of North Vietnam, as U Thant urged, a truce by all to follow; asks North Vietnam, the Viet Cong, the United States and Saigon for proof of their willingness to negotiate.'
        n: 'Philip Shabecoff, "Bonn Socialists Call Upon U.S. To End North Vietnam Bombing," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. Names: Brandt, U Thant.'
        tags: [name:brandt-willy, name:u-thant, polity:frg]
  - add:
      entry:
        id: cal.1968-01-05.europe-and-the-alliance-federal-republic-2
        when: Jan. 5
        date: '1968-01-05'
        thread: europe-and-the-alliance-federal-republic
        c: Bonn. Arthur Rathke, the Christian Democrats' chief spokesman, attacks the Social Democrats' declaration almost as soon as it is issued.
        n: 'Philip Shabecoff, "Bonn Socialists Call Upon U.S. To End North Vietnam Bombing," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. See [[cal.1968-01-05.europe-and-the-alliance-federal-republic]].'
        tags: [polity:frg]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-diplomacy
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-diplomacy
        c: 'Washington. McCloskey meets questions on the Social Democrats'' appeal with "No comment"; Administration spokesmen decline comment on the appeals for a halt and will not elaborate on Rusk''s remark of Jan. 4. Administration sources: no message, through diplomatic channels or otherwise, has amplified Trinh''s statement.'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 3. See [[cal.1968-01-04.vietnam-diplomacy]]. Names: McCloskey, Rusk, Nguyễn Duy Trinh.'
        tags: [name:mccloskey-robert-j, name:rusk-dean, name:nguyen-duy-trinh]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-congress-republicans
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-congress-republicans
        c: 'Cooper (R-Ky.), a statement: praises Johnson for meeting the Viet Cong''s use of Cambodia as a sanctuary by diplomacy rather than by pursuit across the border; hopes he "will now take the step—with its risk—to stop the bombing of North Vietnam"; the United States "could quickly determine whether the offer is sincere."'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. Names: Cooper, Johnson.'
        tags: [name:cooper-john-sherman, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-congress-armed-services
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-congress-armed-services
        c: 'Rivers (D-S.C.), chairman of the House Armed Services Committee: his hope that "we are not going to be suckers for North Vietnamese tricks." By telegram, he urges Johnson to "consider no cessation of bombing" unless Hanoi immediately agrees to exchange American prisoners or at least to their inspection by the International Red Cross.'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1. Names: Rivers, Johnson. Check: the day; the story dates neither the remark nor the telegram.'
        tags: [name:rivers-l-mendel, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-01-05.war-opposition-2
        when: Jan. 5
        date: '1968-01-05'
        thread: war-opposition
        also: [vietnam-diplomacy]
        c: 'Rabbi Arthur J. Lelyveld of Cleveland, national president of the American Jewish Congress, by telegram to Johnson: "there is now a reasonable indication that cessation of the bombing is likely to have productive results"; not to let the opportunity slip by delay or conditions.'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 3. Names: Johnson. Check: the day; the story puts the telegram only within the 48 hours before it.'
        tags: [name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-01-04.soviet-union
        when: Jan. 4
        date: '1968-01-04'
        thread: soviet-union
        also: [vietnam-air-war]
        c: 'Washington, afternoon. Dobrynin hands Rusk a formal protest: American planes bombing Haiphong have seriously damaged the Soviet freighter *Pereyaslavl-Zalessky*; "appropriate Soviet agencies will be compelled to take measures to insure the safety of Soviet vessels"; punishment of those responsible demanded. Earlier protests went to the American Embassy in Moscow.'
        n: 'Raymond H. Anderson, "U.S. Raid Damaged Ship, Moscow Says," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 3 (continued as "Moscow Says U.S. Bomb Damaged Soviet Ship"; the delivery, "yesterday afternoon," in its Washington story, "U.S. Expresses Regret"); Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3 (the protest). See [[cal.1968-01-04.vietnam-air-war]]. Names: Dobrynin, Rusk.'
        tags: [name:dobrynin-anatoly, name:rusk-dean, polity:ussr, polity:us]
  - add:
      entry:
        id: cal.1968-01-05.soviet-union-2
        when: Jan. 5
        date: '1968-01-05'
        thread: soviet-union
        also: [vietnam-air-war]
        c: 'Washington. The State Department and the Pentagon, statements: American planes may have "inadvertently" damaged the *Pereyaslavl-Zalessky*; regret, and if American planes were responsible, an accident. The State Department: an official investigation has "neither substantiated nor ruled out the possibility" of American fault; "careful precautions" taken, the risk impossible to eliminate.'
        n: 'Raymond H. Anderson, "U.S. Raid Damaged Ship, Moscow Says," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 3 ("U.S. Expresses Regret," Washington). See [[cal.1968-01-04.soviet-union]]. Check: the *Times* reports Rusk conveying the position to Dobrynin that night (see [[cal.1968-01-05.soviet-union]]).'
        tags: [polity:us, polity:ussr]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-order-of-battle
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-order-of-battle
        also: [vietnam-diplomacy]
        c: Washington. Some American officials cite intelligence reports of North Vietnamese infiltration into the South in the past month, figures as high as three or four divisions, 30,000 to 40,000 men, as raising doubt of Hanoi's wish for talks; others call all the estimates tentative, a rise in the dry season common.
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3.'
  - add:
      entry:
        id: cal.1968-01-05.defense
        when: Jan. 5
        date: '1968-01-05'
        thread: defense
        c: 'Proxmire (D-Wis.), at a news conference, names 23 defense contractors, Boeing, Sikorsky, Raytheon, Sperry Gyroscope, TRW and FMC and the Universities of Chicago and Maryland among them, from a fifteen-month General Accounting Office inquiry made for his subcommittee of the Joint Economic Committee: Defense Department property used for commercial work without permission and without adequate rent; the waste "hundreds of millions of dollars a year," "the military industrial complex at work." The GAO''s samples do not prove his figure; he calls them "representative." The property the 5,500 contractors hold cost, by his figure, $15 billion.'
        n: 'Neil Sheehan, "Proxmire Links 23 Contractors to Defense Waste," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 7 (the list of the 23 at 7). Names: Proxmire.'
        tags: [name:proxmire-william]
  - add:
      entry:
        id: cal.1968-01-05.defense-2
        when: Jan. 5
        date: '1968-01-05'
        thread: defense
        c: 'Thomas D. Morris, Assistant Secretary of Defense for Installations and Logistics: no evidence the 23 failed their contracts; in only five cases did contractors owe small sums for commercial use, about $60,000 in all, "portrayed as charges of waste amounting to hundreds of millions or billions"; managing the property saves "well over $100-million" a year in new equipment.'
        n: 'Neil Sheehan, "Proxmire Links 23 Contractors to Defense Waste," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 7. See [[cal.1968-01-05.defense]]. Names: Morris.'
        tags: [name:morris-thomas-d]
  - add:
      entry:
        id: cal.1968-01-05.defense-3
        when: Jan. 5
        date: '1968-01-05'
        thread: defense
        c: 'Most of the 23 deny Proxmire''s charges: Boeing (few of the findings relate to it, "readily explainable"); FMC (the charges "either misleading or factually incorrect"); Rohr; Sperry Gyroscope; Aerojet-General; TRW ("totally unjustifiable").'
        n: 'Neil Sheehan, "Proxmire Links 23 Contractors to Defense Waste," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 7. See [[cal.1968-01-05.defense]]. Check: the paper prints "FMA Corporation" for the concern answering the GAO''s rental finding; FMC by the list.'
  - add:
      entry:
        id: cal.1968-01-05.soviet-union-czechoslovakia
        when: Jan. 5
        date: '1968-01-05'
        thread: soviet-union-czechoslovakia
        c: 'Prague. The Central Committee approves "the request of Comrade Antonin Novotny, the Czechoslovak President, to be relieved of his functions as First Secretary of the party"; Dubček, First Secretary of the Slovak party, succeeds him, the first Slovak to lead it. Novotný stays President. Tanjug reports it first; ČTK confirms it in the evening.'
        n: '"Novotny Deposed as Party Leader; Slovak Gets Post" (UPI), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 6 (continued as "Novotny Ousted as Party''s Chief"). Names: Novotný, Dubček. Check: the plenum''s days (Jan. 3–5).'
        tags: [name:novotny-antonin, name:dubcek-alexander, polity:czechoslovakia]
  - add:
      entry:
        id: cal.1967-12-04.vietnam-2
        when: Dec. 4
        date: '1967-12-04'
        thread: vietnam
        also: [vietnam-diplomacy]
        c: 'A United States note to Phnom Penh, "the recent Rusk message" in the *Times*''s question, urges a diplomatic settlement of the Viet Cong''s use of Cambodian territory: the United States "continues to respect the neutrality, sovereignty, independence and territorial integrity of Cambodia."'
        n: 'Tillman Durdin, "Sihanouk Hopeful on U.S. Relations," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 5 (the note, Dec. 4); "Transcript of Replies by Sihanouk to Questions on Vietnam Border Issue," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4 ("the recent Rusk message"). Names: Rusk. Check: the channel (no relations since May 1965), and whether the note was made public at the time.'
        tags: [name:rusk-dean, polity:us, polity:cambodia]
  - add:
      entry:
        id: cal.1968-01-05.vietnam
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam
        also: [vietnam-diplomacy]
        c: 'Sihanouk, answering questions the *New York Times* cabled from Hong Kong: Bowles''s mission may at least reduce tension "if Mr. Johnson is still willing to prevent aggression against our country"; if Bowles brings recognition of Cambodia''s present borders, "we shall immediately re-establish diplomatic relations with the United States." For an ICC with full logistic and financial means from the United States, if the co-chairmen and the members agree, the Soviet Union and Poland opposed; no agreement with the United States, no American reconnaissance flights or patrols; Cambodian forces fired on will "retaliate." From China, material aid first, then, under too strong American pressure, volunteer combatants under Khmer command; no North or South Vietnamese volunteers.'
        n: '"Transcript of Replies by Sihanouk to Questions on Vietnam Border Issue," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4 (an unofficial translation from the French); Tillman Durdin, "Sihanouk Hopeful on U.S. Relations," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 5 (the day). See [[cal.1967-12-04.vietnam-2]]. Names: Sihanouk, Bowles, Johnson.'
        tags: [name:norodom-sihanouk, name:bowles-chester, name:johnson-lyndon-b, polity:cambodia]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-2
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam
        c: 'New Delhi. Bowles to leave for Cambodia Monday morning, Jan. 8, with a party of six, among them two State Department officials flown from Washington, Habib, Deputy Assistant Secretary of State for East Asian Affairs, and Douglas Perry, a specialist on Cambodia; the embassy: to stay several days.'
        n: '"Leaves Monday Morning," in Tillman Durdin, "Sihanouk Hopeful on U.S. Relations," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 5. See [[cal.1968-01-05.vietnam]]. Names: Bowles, Habib.'
        tags: [name:bowles-chester, name:habib-philip-c, polity:india]
  - add:
      entry:
        id: cal.1967-12-29.middle-east
        when: Dec. 29
        date: '1967-12-29'
        thread: middle-east
        c: 'Tel Aviv. The United States submits to Israel a bill for $3.3 million in compensation for the families of the 34 Navy men killed in the attack on the *Liberty*, June 8.'
        n: '"U.S. Asks Israel to Pay $3.3-Million for Attack" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4. See [[cal.1967-06-08.middle-east]]. Made public: McCloskey, Jan. 5, 1968. Check: the bill''s form and who presented it.'
        tags: [polity:us, polity:israel]
  - add:
      entry:
        id: cal.1968-01-05.middle-east-2
        when: Jan. 5
        date: '1968-01-05'
        thread: middle-east
        c: 'McCloskey announces the bill for the *Liberty*''s dead, submitted in Tel Aviv Dec. 29: the families'' loss of support and their "emotional anguish" weighed.'
        n: '"U.S. Asks Israel to Pay $3.3-Million for Attack" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4. See [[cal.1967-12-29.middle-east]]. Names: McCloskey.'
        tags: [name:mccloskey-robert-j]
  - add:
      entry:
        id: cal.1968-01-05.war-opposition-3
        when: Jan. 5
        date: '1968-01-05'
        thread: war-opposition
        c: 'Stockholm. The Swedish Government: two more American servicemen, a sailor and a soldier, have asked political asylum in Sweden to escape duty in the Vietnam war.'
        n: '"Two More U.S. Servicemen Seek Asylum, Sweden Says" (UPI), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4 (its first paragraph and the start of the second only read: "The two, a sailor and a sol-"). Check: the rest of the story; the two men''s names.'
        tags: [polity:sweden]
  - add:
      entry:
        id: cal.1968-01-06.vietnam-saigon
        when: Jan. 6
        date: '1968-01-06'
        thread: vietnam-saigon
        also: [vietnam-diplomacy]
        c: 'Saigon. Thiệu, asked whether he objects to the United States talking alone with Hanoi if it stops the bombing and Hanoi answers in kind: South Vietnam would welcome "any movement or any informal talks from any government to bring peace," but "negotiations should be the main task between the Saigon Government and the Hanoi Government"; of a softening in Hanoi, "Everyone is waiting for a more clarifying position."'
        n: '"Thieu Calls Task Saigon''s" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3 (dated "Saturday, Jna. 6," the paper''s slip). Names: Thiệu.'
        tags: [name:nguyen-van-thieu, polity:rvn]
  - edit:
      id: cal.1968-01-05.vietnam-tet
      base: 9dc0dc93
      set:
        c: 'Saigon. The Mission, through Zorthian''s Joint U.S. Public Affairs Office, makes public a document the 101st Airborne captured Nov. 13 in Quảng Tín: the time may be near for "a general offensive and general uprising"; "very strong military attacks in co-ordination with the uprisings of the local population to take over towns and cities." Its writer, the Mission says, a cadre and party member of low or middle rank; it implies the document less significant than it sounds.'
        n: '[[w.westmoreland-soldier-reports]], 316 (the release, Zorthian''s office, the quotations); "Vietcong Slaying of Civilians in ''67 Put at 3,820" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3 (the day; the capture, Nov. 13, in Quảng Tín; the quotations, "coordination"; the writer; the Mission''s reading). Names: Zorthian.'
        src:
          c: e8169cab
          rows:
            - 'w.westmoreland-soldier-reports 316: A-C'
            - 'https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html: B-E'
  - check:
      id: cal.1967-12-08.soviet-union-leadership
      text: 'Check: UPI (*New York Times*, Jan. 6, 1968, 6): an unofficial vote of the ten-member Politburo "last month," 8 to 2, for Novotný''s removal from both posts; Brezhnev flew to Prague to save his place as party leader and forced a 5-to-5 deadlock "at a later meeting of the Central Committee."'
  - check:
      id: cal.1967-12-05.vietnam-operations
      text: 'Check: AP, with the Mission''s figures (*New York Times*, Jan. 6, 1968, 3): about 200 civilians killed at "Dakson," by guerrillas with flame throwers and grenades, "in mid-December."'
  - check:
      id: cal.1968-01-04.vietnam-air-war
      text: 'Check: Moscow''s account (Tass, the captain''s report; *New York Times*, Jan. 6, 1968, 1, 3): the *Pereyaslavl-Zalessky* damaged, not missed: seven bombs within 10 to 20 meters, an eighth, delayed-action, on a loaded barge two meters off her port side, exploding 25 minutes later; the State Department and the Pentagon, Jan. 5: American planes may have "inadvertently" damaged her, in raids about 3 p.m. Haiphong time.'
  - check:
      id: cal.1968-01-05.soviet-union
      text: 'Check: the *Times* (Jan. 6, 1968, 3) has Rusk meet Dobrynin "again tonight," Jan. 5, and convey regret for the damage to the *Pereyaslavl-Zalessky*: the same meeting?'
