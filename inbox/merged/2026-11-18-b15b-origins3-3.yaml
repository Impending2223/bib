      id: cal.1961-09.china-leadership-5
      when: Sept., mid
      date: 1961-09
      thread: china-leadership
      at: before 1961-09-11
      c: Deng Tuo and other editors of *Qianxian*, the Peking Party committee's theoretical journal, give Liao Mosha lunch at a Sichuan restaurant, with Wu Han. Deng proposes a column by the three for the journal, *Sanjia cun zhaji* (Notes from a Three-Family Village), under one pen name, Wu Nanxing, made from Wu Han, Ma Nancun and Fan Xing, one column an issue of no more than 1,000 characters. The details are settled at the end of the meal. Liao later says nothing but technicalities was agreed.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 250, 253–54. Made public: 1986. To check: [[w.mosha-liao-mosha-wenji]], 2, 202 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 250 n.4); Informant L, interview with the author (MacFarquhar) (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 254 n.43); [[w.mosha-liao-mosha-wenji]], 2, 198–204 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 254 n.44); [[w.mosha-liao-mosha-wenji]], 2, 203 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 254 n.47a); [[w.mosha-liao-mosha-wenji]], 2, 203–04 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 254 n.47b). Check: the day; the book has the lunch "in the middle of the month".'
      tags:
