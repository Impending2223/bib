- add:
    entry:
      id: cal.1962-03-06.china-leadership
      when: Mar. 6
      date: '1962-03-06'
      thread: china-leadership
      c: 'Chen Yi to the national playwrights'' conference at Canton, a speech of over 30,000 characters, interrupted over sixty times by laughter or applause. The Party''s relations with intellectuals are "very abnormal": they are working people and not to be capped as bourgeois, remolding is slow and voluntary, writers have democratic rights and no party secretary or vice-premier may force a revision, internal contradictions and tragedy may be shown, and a wronged writer is to stand firm and accept discipline. Mao has never held a special discussion of modern drama and does not oppose plays; Zhou is keen on them. He says he plucked up the courage to speak after the Seven Thousand Cadres Conference.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 244–47. Made public: 1980. To check: Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 47–93 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 244 n.64a); [[w.chen-yi-zhuan]], 534 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 244 n.64b); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 58 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 244 n.65a); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 50 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 245 n.67); [[w.chen-yi-zhuan]], 525, 534 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 245 n.68); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 48 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 245 n.69); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 48–55 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 245 n.70a); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 59 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 246 n.72); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 60–61 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 246 n.73); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 61–63 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 246 n.74); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 66–68, 75, 86, 90–93 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 247 n.77a); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 74–75 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 247 n.78); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 78–85 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 247 n.80). Names: Chen Yi, Mao Zedong, Zhou Enlai.'
