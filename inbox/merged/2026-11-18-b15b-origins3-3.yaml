- add:
    entry:
      id: cal.1960-11-13.china-leadership-3
      when: Nov. 13
      date: '1960-11-13'
      thread: china-leadership
      c: Wu Han completes his play on Hai Rui, written at a Peking opera company's request, after repeated criticism and rewriting. He had titled it *Hai Rui*; for five drafts it was *Hai Rui Returns the Land*; the last two drafts bore *Hai Rui Dismissed from Office*, at a friend's suggestion.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 253. To check: [[w.han-wu-han-wenji]], 4, 376–427 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 253 n.35a); [[w.nai-wu-hande-xueshu-shengya]], 112–14 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 253 n.35d); [[w.han-wu-han-he-hai]], 2–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 253 n.35e); [[w.shuangbi-wu-han-zhuan]], 310–12, 356–57 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 253 n.35f); [[w.kan-kang-sheng-pingzhuan]], 175 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 253 n.35g). Check: Zhong Kan has the play called *Hai Rui Dismissed from Office* from the fourth draft, at the suggestion of the director of the Yunnan Plant Research Institute ([[w.kan-kang-sheng-pingzhuan]], 175).'
      tags:
      - polity:prc
