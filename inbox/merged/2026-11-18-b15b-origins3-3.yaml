- add:
    entry:
      id: cal.1961.china-leadership-15
      when: 1961, summer
      date: '1961'
      thread: china-leadership
      at: after 1961-06-12
      c: 'Deng Xiaoping tells Li Weihan, director of the Central Committee''s United Front Work Department, that the Center has decided: anyone criticized in the campaign against right opportunism at the xian level or below has his case simply dismissed; above the xian, cases are re-examined one by one.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 235. Made public: 1991. To check: [[w.bangzuo-zhongguo-gongchan-dang-tongyi]], 530–31 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 235 n.10). Names: Deng Xiaoping. Check: the day; the book has it "that summer," after Mao''s view that the campaign had spread too widely ([[cal.1961-06-12.china-leadership]]); whether Li''s memoir, which the book cites for the task force that followed ([[w.weihan-huiyi-yu-yanjiu-vol]], xia, 865–68, n. 12; 1986), also prints Deng''s word.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
      src:
        c: f1ebcfb9
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 235: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 235 n.10: all'
- add:
    entry:
      id: cal.1961.china-leadership-16
      when: '1961'
      date: '1961'
      thread: china-leadership
      c: Mao invites Ma Lianliang, who plays Hai Rui, to dinner at his residence, has him recite lines of the part, and says the play is good, Hai Rui a good man, and *Hai Rui Dismissed from Office* well written.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 253. Made public: 1984. To check: [[w.zhongguo-ge-minzhu-dangpai]], 347 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 253 n.38a); [[w.shuangbi-wu-han-zhuan]], 312 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 253 n.38b); [[w.fisher-wu-han]], 165 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 253 n.38c); [[w.qingshan-kang-sheng-waizhuan]], 257 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 253 n.38d). Names: Mao Zedong. Check: the day, which the book places shortly after the play was staged and published; whether Mao had seen the play: Yan Qi''s wording allows either, Fisher assumes he had, Lin Qingshan has Mao call it well acted ([[w.qingshan-kang-sheng-waizhuan]], 257).'
      tags:
