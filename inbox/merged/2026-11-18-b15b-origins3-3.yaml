      when: '1960'
      date: '1960'
      thread: china-leadership
      c: Deng Tuo, secretary of the Peking Party committee for culture and education and editor of *Qianxian* (Front Line), becomes also an alternate secretary of the CCP's new North China Bureau.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 250. Made public: 1986. To check: [[w.zhonggong-dang-shi-renming]], 50–51 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 250 n.12). Check: the day; the source dates the post 1960, though the bureaus were announced only after the Ninth Plenum, January 1961.'
