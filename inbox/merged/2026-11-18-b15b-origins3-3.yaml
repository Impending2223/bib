      id: cal.1960.china-leadership-5
      when: 1960, early
      date: '1960'
      thread: china-leadership
      c: Liu Shaoqi courts the capitalists, but on how long the buying-out interest should run he is very cautious and promises nothing.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 240. To check: [[w.macfarquhar-origins-of-the-cultural]], II, 310–15 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 240 n.38). Names: Liu Shaoqi. Check: the day; whether this is the Politburo meeting of Feb. 11 on the congresses of the Democratic National Construction Association and the Federation of Industry and Commerce.'
