      when: Mar., before the 9th
      date: 1961-03
      thread: china-leadership
      at: before 1961-03-09
      c: Deng Tuo agrees to write a regular column for *Beijing Wanbao*. At his house he gives the editors the title, *Yanshan yehua* (Evening Chats at Yanshan), and the pen name Ma Nancun; he will write twice a week, the column at the top right of the page. He is to be paid 15 yuan an article, above the going rate.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 250–51. Made public: 1980. To check: [[w.yi-deng-tuo]], 111–15 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 251 n.14a); [[w.cheek-propaganda-and-culture-in]], ch. 5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 251 n.15). Check: the day; the book dates the agreement only to March, before the first column of Mar. 9.'
