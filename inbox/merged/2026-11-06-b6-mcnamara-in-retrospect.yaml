    entry:
      id: cal.1963-11-22.assassination-11
      when: Nov. 22–23
      date: '1963-11-22'
      thread: assassination
      c: 'Evening. Robert Kennedy, from Bethesda Naval Hospital, calls McNamara at home: Mrs. Kennedy wants him with her while
        the autopsy is completed. McNamara sits with her and the family; in the early morning they bring the body to the White
        House, the casket on a bier in the East Room.'
      n: '[[w.mcnamara-in-retrospect]], ch. 4. McNamara''s account. See [[cal.1963-11-22.assassination]]. Names: Robert Kennedy,
        McNamara, Jacqueline Kennedy.'
      src:
        c: 4572b470
        rows:
        - 'w.mcnamara-in-retrospect ch. 4: all'
      tags:
