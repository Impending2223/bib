- add:
    entry:
      id: cal.1965-03-25.voting-rights-selma-2
      when: Mar. 25
      date: '1965-03-25'
      thread: voting-rights-selma
      c: 'About 9 p.m., McNamara home from the Pentagon. His daughter Margy, back from college by bus, tells him she marched
        with King from Selma to Montgomery. McNamara telephones Johnson: "I know how you agonized over the decision to federalize
        the Alabama Guard. But knowing how much you love Margy, I am sure you will realize now you were right. She was one
        of the marchers!"'
      n: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.13–14. McNamara''s account. Check: the day; McNamara gives "the night
        after the march," which he dates Mar. 21–24. See [[cal.1965-03.voting-rights-selma]]. Names: McNamara, Johnson.'
      src:
        c: 7830f7e3
        rows:
        - 'w.mcnamara-in-retrospect ch. 7 at nn.13–14: all'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-11.robert-kennedy-2
      when: Nov.
      date: 1966-11
      thread: robert-kennedy
      also:
      - soviet-union
      c: 'Hickory Hill, a large dinner party Robert Kennedy gives for Yevgeny Yevtushenko, the Soviet poet, on his visit to
        the United States. McNamara and Yevtushenko talk for hours, of poetry, the Cold War, Vietnam; about 2:30 a.m. McNamara
        takes him to the Statler. Yevtushenko: "They say you are a beast. But I think you are a man."'
      n: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.20–21. McNamara''s account. Check: the day; McNamara gives "November 1966."
        Names: Robert Kennedy, McNamara.'
      src:
        c: 2e36c93e
        rows:
        - 'w.mcnamara-in-retrospect ch. 9 at nn.20–21: all'
