      when: Dec. 22
      date: '1965-12-22'
      thread: vietnam-hanoi
      also:
      - laos
      c: 'The Secretariat''s instruction no. 117-CT/TW on propaganda for the Lao revolution: the Lao and Vietnamese revolutions closely bound, both under American attack; propaganda to draw the two peoples
        together and win wider support abroad for Laos.'
      n: '*Chỉ thị của Ban Bí thư số 117-CT/TW về việc đẩy mạnh công tác tuyên truyền ủng hộ cách mạng Lào*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 477–79. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
