      when: July 30
      date: '1965-07-30'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 164-TT/TW on the duties and powers of the Southern provinces' Party-history research boards sitting in the North, with no local committees or people at hand to help
        gather and check the records.
      n: '*Thông tri của Ban Bí thư số 164-TT/TW về nhiệm vụ và quyền hạn của các Ban Nghiên cứu Lịch sử đảng địa phương miền Nam*, signed for the chief of the office by Vũ Tuân. [[w.van-kien-dang-toan]],
        XXVI, 329–31. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
