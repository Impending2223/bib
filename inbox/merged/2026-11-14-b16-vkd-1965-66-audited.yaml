      when: Dec. 6
      date: '1965-12-06'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 114-CT/TW on culture and the arts in the highlands, long of special weight in the economy, politics and defense, during the war.
      n: '*Chỉ thị của Ban Bí thư số 114-CT/TW về việc tăng cường lãnh đạo công tác văn hoá, văn nghệ ở miền núi trong giai đoạn chống Mỹ, cứu nước hiện nay*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]],
        XXVI, 448–57. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
