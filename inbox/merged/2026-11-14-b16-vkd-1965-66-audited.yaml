      when: May 20
      date: '1966-05-20'
      thread: vietnam-hanoi
      c: The Secretariat's resolution no. 136-NQ/TW on mending the district committees' leadership, chiefly of farm production and of the Party's policies in the countryside, after their report.
      n: '*Nghị quyết của Ban Bí thư số 136-NQ/TW về việc kiện toàn sự lãnh đạo và chỉ đạo thực hiện của các Huyện uỷ*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVII, 175–96.
        Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
