    entry:
      id: cal.1965-07-20.vietnam-hanoi
      when: July 20
      date: '1965-07-20'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh''s appeal for July 20, the Geneva anniversary, to the people and the troops: the 1954 Geneva Agreement recognized Vietnam''s sovereignty, independence, unity and integrity; the Americans
        have broken it for over ten years; the South has fought with great heroism; "the enemy is sure to lose, we are sure to win."'
      n: '*Lời kêu gọi của Chủ tịch Hồ Chí Minh nhân ngày 20 tháng 7* (the title the editors''). [[w.van-kien-dang-toan]], XXVI, 306–11 (his *Toàn tập*, vol. 11 (2002), 469–74). Names: Hồ Chí Minh. Check:
        the day of the text; the volume gives only "for July 20".'
      tags:
      - name:ho-chi-minh
      - polity:drv
- add:
    entry:
      id: cal.1965-07-28.vietnam-hanoi
      when: July 28
      date: '1965-07-28'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 104-CT/TW on culture and the arts in the new situation: the country at war, art to teach hatred of the American aggressors and their followers and to feed love
        of country and socialism.'
      n: '*Chỉ thị của Ban Bí thư số 104-CT/TW về công tác văn hoá, văn nghệ trong tình hình mới*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 312–17. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-07-29.vietnam-hanoi
      when: July 29
      date: '1965-07-29'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 105-CT/TW on leading the work among the young: since the American escalation the young have trained in arms and joined the main, local and militia forces; the
        volunteer "three readinesses" movement among them.'
      n: '*Chỉ thị của Ban Bí thư số 105-CT/TW về việc tăng cường lãnh đạo công tác vận động thanh niên trong tình hình mới*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 318–28.
        See [[cal.1965-04.vietnam-hanoi]]. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
