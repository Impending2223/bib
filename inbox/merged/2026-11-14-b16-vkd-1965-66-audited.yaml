      when: Dec. 14
      date: '1965-12-14'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 116-CT/TW on raising the quality of *Học Tập*, the Party's theoretical journal, three years after the Politburo's instruction no. 41-CT/TW of Apr. 7, 1962.
      n: '*Chỉ thị của Ban Bí thư số 116-CT/TW về nâng cao chất lượng của tạp chí Học tập để phục vụ sự nghiệp chống Mỹ, cứu nước và tiếp tục xây dựng cơ sở vật chất và kỹ thuật của chủ nghĩa xã hội*, signed
        for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 458–66. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-12-17.vietnam-hanoi
      when: Dec. 17
      date: '1965-12-17'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s secret cable no. 312 to the committees of Haiphong, Quảng Ninh, Việt Trì, Phú Thọ, Hải Dương, Hà Bắc, Lạng Sơn, Nam Hà, Ninh Bình and Thái Bình: the enemy plans a big raid,
        the carrier Enterprise coming beside the Kitty Hawk; in good weather routes 1 and 5, Uông Bí, the Hồng Gai–Quảng Yên zone and Haiphong, its oil depot, cement works, bridges and channel, may be hit;
        air defense and evacuation to be tightened.'
      n: '*Điện mật của Ban Bí thư số 312 về việc tăng cường phòng không, sơ tán* (the title the editors''), signed for the Secretariat by Vũ Tuân. [[w.van-kien-dang-toan]], XXVI, 467–68. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-12-18.vietnam-hanoi
      when: Dec. 18
      date: '1965-12-18'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 171-TT/TW on the Party''s budget for 1966: the 1965 estimate met, dues above it, money put into restructuring the organs, cadre training, Party education and external
        work, and moved to evacuation and air defense.'
      n: '*Thông tri của Ban Bí thư số 171-TT/TW về phương hướng thu, chi ngân sách đảng năm 1966*, signed for the office by Minh Châu, deputy chief. [[w.van-kien-dang-toan]], XXVI, 469–76. Made public:
        2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
