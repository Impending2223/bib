      when: Apr. 7
      date: '1966-04-07'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 122-CT/TW on leading the patriotic emulation drive: in the North the first defeat of the American air war, with heavy American losses, and the drive to continue.'
      n: '*Chỉ thị của Ban Bí thư số 122-CT/TW về việc tăng cường lãnh đạo phong trào thi đua yêu nước trước tình hình và nhiệm vụ mới*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII,
        86–94. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
