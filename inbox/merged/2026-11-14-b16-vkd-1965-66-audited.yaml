    entry:
      id: cal.1966-06-06.vietnam-hanoi
      when: June 6
      date: '1966-06-06'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 128-CT/TW on propaganda abroad: the Americans pressing the war in the South and the bombing of the North while pushing "peaceful negotiation" abroad; the Party''s
        foreign propaganda to be widened.'
      n: '*Chỉ thị của Ban Bí thư số 128-CT/TW về việc tăng cường công tác tuyên truyền đối ngoại*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 197–203. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-06-06.vietnam-hanoi-2
      when: June 6
      date: '1966-06-06'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 129-CT/TW on radio secrecy: the rules of 1958 on cipher work kept, but a year of war has seen Party and state offices and army units break them in radio traffic.'
      n: '*Chỉ thị của Ban Bí thư số 129-CT/TW về việc tăng cường giữ gìn bí mật công tác thông tin liên lạc vô tuyến điện của các cơ quan đảng và nhà nước*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]],
        XXVII, 204–07. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-06-17.vietnam-hanoi
      when: June 17
      date: '1966-06-17'
      thread: vietnam-hanoi
      c: 'The Central Committee''s greeting to the 18th Convention of the Communist Party of the United States: the Americans have brought nearly 300,000 troops to the South and use chemical agents and
        B-52s; Johnson''s "peaceful negotiation" a lie; peace on the terms of the DRV''s four points and the Liberation Front''s five; thanks to the American workers and people who oppose the war.'
      n: '*Điện mừng của Ban Chấp hành Trung ương Đảng Lao động Việt Nam ngày 17 tháng 6 năm 1966 gửi Đại hội lần thứ XVIII Đảng Cộng sản Mỹ*. [[w.van-kien-dang-toan]], XXVII, 345–47 (appendix; the war,
        346–47). Made public: 2003. Names: Johnson. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume prints it from the Party
        archive, and the Secretariat''s circular no. 182-TT/TW has the press print the Central Committee''s greeting to the Chinese party, July 1, 1966 (XXVII, 220).'
      tags:
      - name:johnson-lyndon-b
      - polity:drv
      - vis:only:drv+us
- add:
    entry:
      id: cal.1966-06-28.vietnam-hanoi
      when: June 28
      date: '1966-06-28'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 142-NQ/TW on training scientific, technical and economic-management cadres: over 30 universities and colleges with nearly 3,000 teachers and over 30,000 students,
        over 140 vocational schools with nearly 4,000 teachers and some 60,000 students, schools evacuated but teaching.'
      n: '*Nghị quyết của Bộ Chính trị số 142-NQ/TW về việc đào tạo và bồi dưỡng cán bộ khoa học, kỹ thuật và cán bộ quản lý kinh tế*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]],
        XXVII, 222–36 (the balance, 222–23). Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:truong-chinh
- add:
    entry:
      id: cal.1966-06-28.vietnam-hanoi-2
      when: June 28
      date: '1966-06-28'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 131-CT/TW on strengthening the credit cooperatives for credit and currency control in the countryside, the movement since the land reform under the State Bank.
      n: '*Chỉ thị của Ban Bí thư số 131-CT/TW về việc củng cố hợp tác xã tín dụng để tăng cường công tác tín dụng và quản lý tiền tệ ở nông thôn*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]],
        XXVII, 237–51. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-06-28.vietnam-hanoi-3
      when: June 28
      date: '1966-06-28'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 183-TT/TW on investigating American war crimes in Vietnam in both halves, to be brought out clearly and continually to deepen hatred at home and rouse opinion abroad.
      n: '*Thông tri của Ban Bí thư số 183-TT/TW về tổ chức điều tra tội ác chiến tranh của đế quốc Mỹ ở Việt Nam*, signed for the chief of the office by Vũ Tuân. [[w.van-kien-dang-toan]], XXVII, 252–55.
        Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-06-30.vietnam-hanoi
      when: June 30
      date: '1966-06-30'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Secretariat sets up a Central Transport Party Committee for the Transport Ministry, whose firms are scattered and move over many localities.
      n: '*Nghị quyết của Ban Bí thư số 143-NQ/TW về việc thành lập Đảng uỷ Giao thông vận tải trung ương*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVII, 256–62. Made public:
        2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1966-06-30.vietnam-hanoi-2
      when: June 30
      date: '1966-06-30'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Secretariat''s instruction no. 132-CT/TW on organization and Party leadership of transport at every level: with the need to haul for production, fighting and living growing, the committees
        to take more direct charge.'
      n: '*Chỉ thị của Ban Bí thư số 132-CT/TW về một số vấn đề về kiện toàn tổ chức và tăng cường sự lãnh đạo và chỉ đạo thực hiện của Đảng đối với công tác giao thông vận tải ở các cấp*, signed for the
        Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVII, 263–68. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1966-07-20.vietnam-hanoi
      when: July 20
      date: '1966-07-20'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 133-CT/TW on a political campaign inside and outside the Party answering Hồ Chí Minh's appeal of July 17, joined to the observance of July 20.
      n: '*Chỉ thị của Ban Bí thư số 133-CT/TW về việc mở một đợt vận động chính trị hưởng ứng Lời kêu gọi của Chủ tịch Hồ Chí Minh*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII,
        273–75. See [[cal.1966-07-16.vietnam]]. Made public: 2003. Names: Hồ Chí Minh.'
      tags:
      - name:ho-chi-minh
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-08-12.vietnam-hanoi
      when: Aug. 12
      date: '1966-08-12'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 134-CT/TW on training the young and the militia to supply the army: over the past year a very large force has been called up, nearly all up to standard.'
      n: '*Chỉ thị của Ban Bí thư số 134-CT/TW về tăng cường lãnh đạo giáo dục rèn luyện thanh niên và dân quân, tự vệ, chuẩn bị tốt lực lượng bổ sung cho quân đội*, signed for the Secretariat by Lê Văn
        Lương. [[w.van-kien-dang-toan]], XXVII, 276–83. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-08-14.vietnam-hanoi
      when: Aug. 14
      date: '1966-08-14'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s secret cable on air defense: the Americans, beaten in the South, bombing more, with night strikes by small flights low along the rivers and hills against bridges, roads and
        houses.'
      n: '*Điện mật của Ban Bí thư ngày 14 tháng 8 năm 1966 gửi các Khu uỷ, Thành uỷ, Tỉnh uỷ về việc thực hiện triệt để biện pháp phòng không nhân dân đối phó âm mưu ném bom, bắn phá miền Bắc của đế quốc
        Mỹ* (the title the editors''), signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVII, 284–86. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-08-15.vietnam-hanoi
      when: Aug. 15
      date: '1966-08-15'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 184-TT/TW on basic political teaching for new members, after two trial classes in May, in a village and a firm, taught by Party leaders at Hồ Chí Minh's instruction.
      n: '*Thông tri của Ban Bí thư số 184-TT/TW về việc giáo dục chính trị cơ bản cho đảng viên mới*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVII, 295–97. Made public: 2003.
        Names: Hồ Chí Minh.'
      tags:
      - name:ho-chi-minh
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-08-27.vietnam-hanoi
      when: Aug. 27
      date: '1966-08-27'
      thread: vietnam-hanoi
      c: The Secretariat sets up the Nguyễn Ái Quốc School, branch IV, directly under the Center, for the basic-level cadres of Hà Bắc, Vĩnh Phúc, Phú Thọ, Hà Tây and outer Hanoi.
      n: '*Nghị quyết của Ban Bí thư Trung ương Đảng số 148-NQ/TW về việc thành lập Trường Nguyễn Ái Quốc phân hiệu IV*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVII, 298–99.
        Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-08-29.vietnam-hanoi
      when: Aug. 29
      date: '1966-08-29'
      thread: vietnam-hanoi
      c: 'The Secretariat''s secret cable no. 109 on carrying out its instruction no. 134-CT/TW: the Government Council, by its decision no. 158 of Aug. 26, 1966, calls up part of the reserves at the end
        of 1966; the exemptions and deferments of the Council''s instruction no. 48 of May 11, 1965 and decision no. 63 of Apr. 2, 1966 to be kept.'
      n: '*Điện mật của Ban Bí thư số 109 gửi các Khu uỷ, Thành uỷ, Tỉnh uỷ chỉ đạo thực hiện Chỉ thị 134-CT/TW* (the title the editors''), signed by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVII, 300–01.
        See [[cal.1966-07-16.vietnam]]. Made public: 2003. Check: whether decision no. 158 carries out the call-up of [[cal.1966-07-16.vietnam]] or is a second.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-09-06.vietnam-hanoi
      when: Sept. 6
      date: '1966-09-06'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 185-TT/TW on research into the course of small industry and handicrafts, over a quarter of industrial output by value.
      n: '*Thông tri của Ban Bí thư số 185-TT/TW về việc tổ chức nghiên cứu phương hướng phát triển tiểu công nghiệp và thủ công nghiệp trong tình hình mới*, signed for the chief of the office by Vũ Tuân.
        [[w.van-kien-dang-toan]], XXVII, 302–04. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-09-12.vietnam-hanoi
      when: Sept. 12
      date: '1966-09-12'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s instruction no. 136-CT/TW on order in transport and the protection of state goods in transit: since April American bombing of transport has jammed vehicles and cargo; theft
        of state goods at ports, stations and transfer points common.'
      n: '*Chỉ thị của Ban Bí thư số 136-CT/TW về việc bảo đảm trật tự giao thông và bảo vệ tài sản nhà nước trong quá trình vận chuyển*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]],
        XXVII, 305–07. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-10-05.vietnam-hanoi
      when: Oct. 5
      date: '1966-10-05'
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      c: 'The Secretariat''s circular no. 188-TT/TW on stopping reactionaries from using a false "prayer for peace": Pope Paul VI''s letter to the bishops calls the faithful to a month of prayer for peace
        in Vietnam from Oct. 4, the anniversary of his visit to the United Nations; the circular reads it as setting Vietnam''s cause level with the American aggression.'
      n: '*Thông tri của Ban Bí thư số 188-TT/TW về việc ngăn chặn bọn phản động lợi dụng đạo Thiên chúa tổ chức cầu nguyện hoà bình giả hiệu*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]],
        XXVII, 308–10. Made public: 2003. Names: Paul VI.'
      tags:
      - name:paul-vi
      - polity:drv
      - polity:vatican
      - vis:only:drv
- add:
    entry:
      id: cal.1966-10-22.vietnam-hanoi
      when: Oct. 22
      date: '1966-10-22'
      thread: vietnam-hanoi
      also:
      - japan
      c: 'The Central Committee''s cable to the Japanese Communist Party''s Tenth Congress: Japan being made an American base for the war in Vietnam, the Japanese government in the aggression; thanks to
        the party and the Japanese people for their backing.'
      n: '*Điện của Ban Chấp hành Trung ương Đảng ngày 22 tháng 10 năm 1966 gửi Đại hội đại biểu toàn quốc lần thứ X của Đảng Cộng sản Nhật Bản*. [[w.van-kien-dang-toan]], XXVII, 348–51 (appendix; the Japanese
        government, 350). Made public: 2003. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume prints it from the Party archive,
        and the Secretariat''s circular no. 182-TT/TW has the press print the Central Committee''s greeting to the Chinese party, July 1, 1966 (XXVII, 220).'
      tags:
      - polity:drv
      - vis:only:drv+japan
- add:
    entry:
      id: cal.1966-10-31.vietnam-hanoi
      when: Oct. 31
      date: '1966-10-31'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 137-CT/TW on the campaign for better cooperative management and farm techniques, a year after its instruction of Aug. 1965 for the delta, midlands and highlands.
      n: '*Chỉ thị của Ban Bí thư số 137-CT/TW về việc tăng cường lãnh đạo cuộc vận động cải tiến quản lý hợp tác xã nông nghiệp, cải tiến kỹ thuật*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]],
        XXVII, 311–22. See [[cal.1965-08-21.vietnam-hanoi]]. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-12-13.vietnam-hanoi
      when: Dec. 13
      date: '1966-12-13'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Politburo''s secret cable no. 43 to COSVN: American planes bombed Hanoi and its outskirts that day, the third time since June; the Government to issue a statement of condemnation, the Front
        to issue one too, and COSVN to plan stronger military action, kill many enemy troops and strike the enemy''s rear bases in reprisal.'
      n: '*Điện mật của Bộ Chính trị số 43 gửi Trung ương Cục miền Nam (ngày 13 tháng 12 năm 1966)*, signed "Bác Hương" (the Politburo). [[w.van-kien-dang-toan]], XXVII, 326. See [[cal.1966-12-13.vietnam-air-war]].
        Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-12-19.vietnam-hanoi
      when: Dec. 19
      date: '1966-12-19'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s instruction no. 138-CT/TW on tighter, more centralized direction of transport: for over two years the Americans have bombed the transport system, above all in the old Fourth
        Zone, to cut the supply to "B" and the North''s economy and defense.'
      n: '*Chỉ thị của Ban Bí thư số 138-CT/TW về việc tăng cường và tập trung hơn nữa sự lãnh đạo và chỉ đạo công tác giao thông vận tải trong tình hình hiện nay*, signed for the Secretariat by Lê Văn
        Lương. [[w.van-kien-dang-toan]], XXVII, 327–35. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
