      when: Sept. 6
      date: '1965-09-06'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 109-CT/TW on the savings drive: deposits, state bank and credit cooperatives together, at 105 million (đồng) at the end of 1964.'
      n: '*Chỉ thị của Ban Bí thư số 109-CT/TW về việc tăng cường lãnh đạo công tác vận động gửi tiền tiết kiệm trong tình hình mới*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVI,
        396–401. Made public: 2003.'
