      date: '1965-12-02'
      thread: vietnam-hanoi
      c: The Politburo keeps the food and agricultural-tax obligations of the cooperatives fixed through 1966–67, with tighter control of distribution and of the food market.
      n: '*Nghị quyết của Bộ Chính trị số 129-NQ/TW về việc tiếp tục thi hành chính sách ổn định nghĩa vụ lương thực, ổn định nghĩa vụ thuế nông nghiệp trong hai năm 1966–1967, tăng cường quản lý phân phối,
        quản lý thị trường lương thực*, signed for the Politburo by Phạm Hùng. [[w.van-kien-dang-toan]], XXVI, 436–47. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
