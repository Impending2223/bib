    entry:
      id: cal.1966-01-05.vietnam-hanoi
      when: Jan. 5
      date: '1966-01-05'
      thread: vietnam-hanoi
      also:
      - vietnam-pause
      c: 'The Secretariat''s secret cable no. 2 to the zone, city and provincial committees on the American pause in the bombing: the pause and the talk of "peace negotiations" a trick to win opinion and
        cover a wider war; the Americans still flying reconnaissance, a new brigade at Pleiku and more units coming. Evacuation to go on, no daytime crowds, the air battles reviewed, repair of the roads
        and bridges pressed.'
      n: '*Điện mật của Ban Bí thư số 2 yêu cầu thực hiện một số điểm trong thời kỳ Mỹ tạm ngừng ném bom miền Bắc* (the title the editors''), signed for the Secretariat by Vũ Tuân, chief of the office.
        [[w.van-kien-dang-toan]], XXVII, 1–3. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-01-16.vietnam-hanoi
      when: Jan. 16
      date: '1966-01-16'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Hồ Chí Minh to the senior cadres studying the Twelfth Plenum''s resolution: the Americans have 200,000 troops in the South and may send 300, 400 or 500,000; "we shall still win." The American
        soldier costs fifteen times the Saigon one but is heavy and slow beside the Liberation Army; the world and Americans themselves oppose the war, Senator Morse saying more troops mean more coffins.'
      n: '*Bài nói của Chủ tịch Hồ Chí Minh tại hội nghị cán bộ cao cấp nghiên cứu nghị quyết hội nghị lần thứ 12 Ban Chấp hành Trung ương Đảng*. [[w.van-kien-dang-toan]], XXVII, 4–17. Made public: *Hồ
        Chí Minh: Toàn tập*, vol. 12 (Chính trị quốc gia, 2000), 14–25 (Check: an earlier printing). Names: Hồ Chí Minh, Morse.'
      tags:
      - name:ho-chi-minh
      - name:morse-wayne
      - polity:drv
      - vis:only:drv
