      when: Apr. 14
      date: '1966-04-14'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s secret cable no. 36 to the committees of Hanoi, Haiphong, Thái Nguyên and a dozen provinces: two planes struck Nam Định at 6:27 a.m. Apr. 14 by surprise, with heavy loss of
        life and houses; the city still too full, the alert late; the committees reminded to stand ready.'
      n: '*Điện mật của Ban Bí thư số 36 gửi Thành uỷ Hà Nội, Hải Phòng, Thái Nguyên và các Tỉnh uỷ* (the title the editors''). [[w.van-kien-dang-toan]], XXVII, 118–19. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-04-22.vietnam-hanoi
      when: Apr. 22
      date: '1966-04-22'
      thread: vietnam-hanoi
      also:
      - vietnam-struggle
      c: 'The Politburo''s secret cable no. 110 to COSVN, Zone V and Interzone 1 on the mass movement in the South''s cities, now over a month old, its first gains the weakening of the enemy ranks: the
        aim to break up the Saigon army and, with that, free the cities from the enemy''s grip and rally forces in the wards; slogans peace, sovereignty, democracy and livelihood, aimed at the Americans
        and Thiệu and Kỳ; the movement''s core kept hidden. The Thiệu–Kỳ regime to be demanded overthrown.'
      n: '*Điện mật của Bộ Chính trị số 110 gửi Trung ương Cục, Khu V, Liên tỉnh 1, về phong trào đấu tranh của quần chúng ở đô thị miền Nam* (the title the editors''; "Bác Hương," the editors'' note: the
        Politburo). [[w.van-kien-dang-toan]], XXVII, 120–29 (the aims, 123–24; the slogans, 125–26). Made public: 2003. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
      tags:
      - name:nguyen-van-thieu
      - name:nguyen-cao-ky
      - polity:drv
      - vis:only:drv
