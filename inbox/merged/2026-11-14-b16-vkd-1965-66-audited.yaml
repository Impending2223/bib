      date: '1966-05-04'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: The Secretariat's instruction no. 126-CT/TW on the offices, firms, hospitals and schools evacuated to the countryside, many since July 1965, and on the duties of each level toward them.
      n: '*Chỉ thị của Ban Bí thư số 126-CT/TW về nhiệm vụ của các cơ quan, xí nghiệp, bệnh viện, trường học sơ tán về nông thôn và trách nhiệm của các cấp*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]],
        XXVII, 151–56. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
