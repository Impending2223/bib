      date: '1965-08-23'
      thread: vietnam-hanoi
      c: The Secretariat sets up the Nguyễn Ái Quốc School, branch III, directly under the Center, for the basic-level cadres, chiefly district leaders, of the old Fourth Zone provinces.
      n: '*Nghị quyết của Ban Bí thư số 127-NQ/TW về việc thành lập trường Đảng bồi dưỡng cán bộ sơ cấp của các tỉnh thuộc Khu IV cũ*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI,
        378–79. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
