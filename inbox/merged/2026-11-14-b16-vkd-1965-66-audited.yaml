    entry:
      id: cal.1965-08-05.vietnam-hanoi
      when: Aug. 5
      date: '1965-08-05'
      thread: vietnam-hanoi
      c: 'COSVN''s standing committee on rural work, its resolution no. 6/NQ: the countryside in three zones, held by the enemy for now, contested and liberated; the liberated zone with over 6 million people,
        over 9 million with the contested; peasants have won nearly 1,500,000 mẫu of land; landlords divide in three, from the chief American puppets to those who wait.'
      n: '*Nghị quyết hội nghị Thường vụ Trung ương Cục số 6/NQ về một số vấn đề trong công tác nông thôn sắp tới*. [[w.van-kien-dang-toan]], XXVI, 693–710 (appendix; the volume''s text, as the PDF holds
        it, ends at 710). Made public: 2003. Check: the PDF ends at p. 710, mid-document; the rest of the resolution not read.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-08-17.vietnam-hanoi
      when: Aug. 17
      date: '1965-08-17'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 126-NQ/TW on mending the organs of the Party Center and the Government, chiefly the Politburo''s and the Secretariat''s direction of the economy: the Government
        Council''s standing committee and the Prime Minister''s Office to be filled out and the work of the Prime Minister and his deputies divided; the State Planning, Science and Price Commissions and
        several ministries strengthened; the State Inspection Commission abolished and its work tied to economic and cultural work.'
      n: '*Nghị quyết của Bộ Chính trị số 126-NQ/TW về việc kiện toàn một bước tổ chức lãnh đạo và chỉ đạo thực hiện của Trung ương Đảng và Chính phủ*, signed (T/M Ban Bí thư) by Lê Đức Thọ. [[w.van-kien-dang-toan]],
        XXVI, 340–62 (the Government, 359–62). Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1965-08-21.vietnam-hanoi
      when: Aug. 21
      date: '1965-08-21'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 107-CT/TW on a new step in the campaign to improve cooperative management and farm techniques in the delta and midland provinces, where the campaign is in the
        main done, if unevenly.
      n: '*Chỉ thị của Ban Bí thư số 107-CT/TW về việc tiếp tục một bước mới cuộc vận động cải tiến quản lý hợp tác xã, cải tiến kỹ thuật, phát triển sản xuất nông nghiệp ở các tỉnh vùng đồng bằng và trung
        du*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 363–77. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
