      when: Dec. 23
      date: '1965-12-23'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 118-CT/TW on information and agitation: the everyday work among the masses weak, so that policies, news and good examples of production and fighting reach too
        few.'
      n: '*Chỉ thị của Ban Bí thư số 118-CT/TW về việc tăng cường công tác thông tin và cổ động*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 480–84. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
