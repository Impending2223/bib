      thread: vietnam-hanoi
      also:
      - laos
      - china
      c: 'The Secretariat''s instruction no. 110-CT/TW on politics, production and defense in the Northwest Autonomous Zone: over half a million people of 20 nationalities, a strategic base joined to the
        Việt Bắc and bordering China and Laos.'
      n: '*Chỉ thị của Ban Bí thư số 110-CT/TW về việc tăng cường lãnh đạo công tác chính trị, sản xuất và trị an quốc phòng trong Khu tự trị Tây Bắc*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]],
        XXVI, 404–13. Made public: 2003.'
