    entry:
      id: cal.1966-05-07.vietnam-hanoi
      when: May 7
      date: '1966-05-07'
      thread: vietnam-hanoi
      c: 'The Central Committee''s greeting to the Canadian Communist Party''s 19th Congress: its fight against American and Canadian monopoly; thanks for its support.'
      n: '*Điện mừng của Ban Chấp hành Trung ương Đảng Lao động Việt Nam ngày 7 tháng 5 năm 1966 gửi Đại hội lần thứ XIX Đảng Cộng sản Canađa*. [[w.van-kien-dang-toan]], XXVII, 341–42 (appendix). Made public:
        2003. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume prints it from the Party archive, and the Secretariat''s circular
        no. 182-TT/TW has the press print the Central Committee''s greeting to the Chinese party, July 1, 1966 (XXVII, 220).'
      tags:
      - polity:drv
      - vis:only:drv+canada
- add:
