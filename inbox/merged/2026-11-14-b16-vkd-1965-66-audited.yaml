      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Secretariat''s secret cable no. 283 to the Việt Bắc and Northwest zone committees, four military-region committees and their provinces: the Politburo gives the Central Military Party Committee,
        with the Transport Ministry''s party group, charge of certain main roads, some chiefly the army''s, some the ministry''s, under the Committee''s resolution no. 153/QU of Oct. 21.'
      n: '*Điện mật của Ban Bí thư số 283 về yêu cầu tập trung chỉ đạo, đảm bảo giao thông vận tải* (the title the editors''), signed for the Secretariat by Vũ Tuân, chief of the office. [[w.van-kien-dang-toan]],
        XXVI, 422–23. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
