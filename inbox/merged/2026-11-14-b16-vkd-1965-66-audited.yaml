      when: May 16
      date: '1966-05-16'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 181-TT/TW on work among Catholics: over the year of the war they have changed for the better, the priests dividing and the reactionaries who use the church weakening.'
      n: '*Thông tri của Ban Bí thư số 181-TT/TW về việc tăng cường công tác vận động đồng bào theo đạo Thiên chúa trước tình hình mới*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII,
        161–66. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
