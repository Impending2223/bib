      when: Sept. 6
      date: '1965-09-06'
      thread: vietnam-hanoi
      also:
      - vietnam-tonkin
      c: 'The Secretariat''s secret cable no. 224 to the Hà Tĩnh committee on the coast: enemy warships and commando boats more active off the Fourth Zone; since June 8 commandos have landed twice from
        the sea, at Cửa Sót and Kỳ Xuân in Kỳ Anh district, questioned and seized people and left unharmed; Hà Tĩnh''s coast defense full of gaps.'
      n: '*Điện mật của Ban Bí thư số 224 về việc tăng cường lãnh đạo, chỉ đạo để đảm bảo tình hình trị an bờ biển* (the title the editors''), signed for the Secretariat by Vũ Tuân, chief of the office.
        [[w.van-kien-dang-toan]], XXVI, 402–03. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
