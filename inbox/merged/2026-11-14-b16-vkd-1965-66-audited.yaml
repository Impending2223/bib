      when: Apr. 12
      date: '1966-04-12'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 137-NQ/TW on finance-and-trade boards at every Party level: food, domestic and foreign trade, prices, finance and banking, all in circulation and distribution,
        to be led as one.'
      n: '*Nghị quyết của Ban Bí thư số 137-NQ/TW về kiện toàn tổ chức Ban Tài chính thương nghiệp các cấp*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVII, 101–10. Made public:
        2003.'
      tags:
      - polity:drv
      - vis:only:drv
