      when: Apr. 29
      date: '1966-04-29'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 140-NQ/TW on research toward a long-term plan: while the immediate tasks of production and fighting come first, the key branches of the economy to be planned as
        a basis for the plan for the economy after the war.'
      n: '*Nghị quyết của Bộ Chính trị số 140-NQ/TW về việc nghiên cứu kế hoạch dài hạn*, signed for the Politburo by Phạm Hùng. [[w.van-kien-dang-toan]], XXVII, 148–50. Made public: 2003.'
