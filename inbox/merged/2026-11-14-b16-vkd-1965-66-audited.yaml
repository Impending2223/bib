      when: July 16
      date: '1965-07-16'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: The Politburo abolishes the Central People's Air Defense Committee and sets up a Central Evacuation Board, to help the Center and the Government direct the evacuation of the offices, schools and
        hospitals under the Center and to guide the localities in evacuating their people.
      n: '*Nghị quyết của Bộ Chính trị số 125-NQ/TW về việc thành lập Ban sơ tán Trung ương*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVI, 304–05. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
