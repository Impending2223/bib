      date: '1965-11-26'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 169-TT/TW on the Red Cross, formed in 1946 and rebuilt from 1958: first aid and health teaching, relief in sickness, disaster and war, and the four Geneva Conventions
        of Aug. 12, 1949.'
      n: '*Thông tri của Ban Bí thư số 169-TT/TW về việc tăng cường lãnh đạo công tác hồng thập tự*, signed for the chief of the office by Vũ Tuân. [[w.van-kien-dang-toan]], XXVI, 433–35. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
