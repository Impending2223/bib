      when: Dec. 28
      date: '1965-12-28'
      thread: vietnam-hanoi
      c: 'The Politburo sets up a Central Theory Research Board: the Party leading the whole people against the United States, with the Northern revolution and the South''s raising theoretical and practical
        questions that must be settled to unify the Party''s thought and action.'
      n: '*Nghị quyết của Bộ Chính trị số 131-NQ/TW về việc thành lập Ban Nghiên cứu Lý luận của Trung ương*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXVI, 634–39. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
