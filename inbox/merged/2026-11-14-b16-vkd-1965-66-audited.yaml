    entry:
      id: cal.1966-04.vietnam-hanoi
      when: Apr.
      date: 1966-04
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh to the conference summing up three years of the "four goods" campaign for branches and basic Party committees: building the branch the Party''s most weighty task; the campaign has
        done fairly well; a "four goods" branch has members who set the example in all they do.'
      n: '*Bài nói của Chủ tịch Hồ Chí Minh tại hội nghị tổng kết ba năm xây dựng chi bộ và đảng bộ cơ sở "bốn tốt"*. [[w.van-kien-dang-toan]], XXVII, 95–100. Made public: *Hồ Chí Minh: Toàn tập*, vol.
        12 (Chính trị quốc gia, 2000), 77–81 (Check: an earlier printing). Names: Hồ Chí Minh. Check: the day; the volume gives the month.'
      tags:
      - name:ho-chi-minh
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-04-07.vietnam-hanoi
      when: Apr. 7
      date: '1966-04-07'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 121-CT/TW on raising quality and pressing Party recruitment together with consolidation: since the Third Congress growth has gone well, the new members mostly
        good workers and fighters.'
      n: '*Chỉ thị của Ban Bí thư số 121-CT/TW về việc ra sức nâng cao chất lượng và tăng cường công tác phát triển đảng song song với việc củng cố đảng*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]],
        XXVII, 69–85. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
