patch: 2026-11-14-b16-vkd-1965-66
by: 'Claude (batch 16, reader 1: the Party''s documents, 1965–66, from *Văn kiện Đảng toàn tập*, vols. 26 and 27, the owner''s Drive PDFs), Nov. 14, 2026; audited by Claude (batch 16 audit), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1965-01.vietnam-hanoi
      when: Jan.
      date: 1965-01
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china
      c: 'COSVN''s third conference, its resolution no. 2/NQ on the Southern revolution in 1964 and the tasks ahead; its first part on the world: Khrushchev''s fall a blow to revisionism and a start toward
        restoring unity in the camp, China''s atomic test, the movements of Asia, Africa and Latin America closing round the United States.'
      n: '*Nghị quyết Hội nghị Trung ương Cục lần thứ ba, số 2/NQ, tháng 1 năm 1965, về tình hình cách mạng miền Nam năm 1964 và nhiệm vụ trước mắt của ta* (the title the editors''). [[w.van-kien-dang-toan]],
        XXVI, 643–66 (appendix; the world in 1964, 643–45). Made public: 2003. Check: the day; the volume gives the month.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-01-20.vietnam-hanoi
      when: Jan. 20
      date: '1965-01-20'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 155-TT/TW on the elections of the people''s councils and administrative committees at every level in the North, to be held in the second quarter of 1965: councils
        to be filled with the able and the trusted, administrative committees made strong enough to run local government, the people''s sense of mastery of the state raised; the provincial committees to
        vet the lists for districts and communes.'
      n: '*Thông tri của Ban Bí thư số 155-TT/TW về việc lãnh đạo bầu cử hội đồng nhân dân và uỷ ban hành chính các cấp*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 14–19. Made
        public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-01-22.vietnam-hanoi
      when: Jan. 22–26
      date: '1965-01-22'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh to the conference the Central Committee called on the spring re-education, Jan. 22–26, on the Party''s 35th year: individualism the enemy within, each member to put the nation and
        class above himself; criticism and self-criticism voluntary, leaders first. He ties the campaign to the emulation drive "each person works as two", the end of the first five-year plan and the Fourth
        Congress.'
      n: '*Bài nói của Chủ tịch Hồ Chí Minh tại Hội nghị bồi dưỡng chỉnh huấn do Trung ương triệu tập*. [[w.van-kien-dang-toan]], XXVI, 20–25. See [[cal.1965-01-02.vietnam-hanoi]]. Made public: *Hồ Chí
        Minh: Toàn tập*, 2nd ed., vol. 11 (Chính trị quốc gia, 2002), 371–75 (Check: an earlier printing). Names: Hồ Chí Minh. Check: the day of the speech; the volume gives the conference''s dates, Jan.
        22–26.'
      tags:
      - name:ho-chi-minh
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-02-13.vietnam-hanoi
      when: Feb. 13
      date: '1965-02-13'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat moves work from the Unification Department to the Central Organization Department and the Interior Ministry''s party group: cadres for the South and the reception of Southern cadres
        sent north for treatment to the first; the schooling of the children and families of "B" cadres of the army, security and the Unification Department, with the Southern children''s camp at Haiphong,
        and of "C" cadres to the second. A bureau in each.'
      n: '*Nghị quyết của Ban Bí thư số 109-NQ/TW về việc chuyển một số công việc của Ban Thống nhất sang Ban Tổ chức Trung ương và Đảng đoàn Bộ Nội vụ*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]],
        XXVI, 26–27. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1965-02-27.vietnam-hanoi
      when: Feb. 27
      date: '1965-02-27'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 92-CT/TW on carrying out the Tenth Plenum''s resolution of Dec. 1964 on trade and prices: socialist distribution the hard part; every ministry and level to act
        on its share, the trade ministries and price bodies first, with the cadres and the people taught the Party''s line on it.'
      n: '*Chỉ thị của Ban Bí thư số 92-CT/TW về việc thi hành Nghị quyết Hội nghị lần thứ 10 của Trung ương về thương nghiệp và giá cả*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]],
        XXVI, 28–40. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-03-03.vietnam-hanoi
      when: Mar. 3
      date: '1965-03-03'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s cable no. 09/ĐK on air defense, evacuation and news: after some muddle in the alerts, only the Central Military Party Committee, with the head of the Central People''s Air Defense,
        may order an alert; evacuation only where ordered; news given out only as the Party allows.'
      n: '*Điện của Ban Bí thư số 09/ĐK về công tác phòng không, sơ tán và phổ biến tin tức* (the title the editors''), signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 54–55. See [[cal.1965-03-02.vietnam]].
        Made public: 2003. Check: the cable, dated Mar. 3, says "the past few days" (mấy hôm nay); the first strike of Rolling Thunder was Mar. 2.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-03-06.vietnam-hanoi
      when: Mar. 6
      date: '1965-03-06'
      thread: vietnam-hanoi
      c: 'COSVN''s standing committee on work among women, its resolution no. 4/NQ: the women of the South after ten years of repression, the strategic hamlets and the terror; tens of thousands of families
        scattered, killed, jailed or ruined.'
      n: '*Nghị quyết của Thường vụ Trung ương Cục miền Nam ("Thường vụ Năm Trường," the editors'' note) số 4/NQ về công tác phụ vận*. [[w.van-kien-dang-toan]], XXVI, 667–92 (appendix). Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-04-01.vietnam-hanoi
      when: Apr. 1
      date: '1965-04-01'
      thread: vietnam-hanoi
      c: 'The Secretariat''s notice no. 56-TB/TW of the Politburo''s rules on leading the remaining socialist transformation of private capitalist industry and trade, handicrafts and small trade, after
        a report by the Central Board for the Transformation of Private Industry and Trade: the task still heavy, complex and long; the joint public-private firms already socialist in substance, the capitalists
        still to be re-educated.'
      n: '*Thông báo của Ban Bí thư số 56-TB/TW về những quy định của Bộ Chính trị về việc tổ chức lãnh đạo công tác tiếp tục cải tạo xã hội chủ nghĩa đối với công thương nghiệp tư bản tư doanh, thủ công
        nghiệp và thương nghiệp nhỏ*, signed for the chief of the office by Phạm Chung, deputy chief. [[w.van-kien-dang-toan]], XXVI, 111–17. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-04-02.vietnam-hanoi
      when: Apr. 2
      date: '1965-04-02'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 94-CT/TW on ideological work: the whole country now in a state of war, the North to build and defend itself and back the South; the Americans pressing "special
        war" in the South to its highest level and bombing the North.'
      n: '*Chỉ thị của Ban Bí thư số 94-CT/TW về công tác tư tưởng trong tình hình trước mắt*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 118–28. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-04-08.vietnam-hanoi
      when: Apr. 8
      date: '1965-04-08'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 95-CT/TW: at the army''s request political cadres, reserve officers and technical specialists to be transferred to it, every level and ministry to release them
        quickly; American troops arriving in the South, the North under air and naval attack.'
      n: '*Chỉ thị của Ban Bí thư số 95-CT/TW về việc điều động cán bộ phục vụ cho yêu cầu xây dựng quân đội trong tình hình và nhiệm vụ mới*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]],
        XXVI, 129–31. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1965-04-08.vietnam-hanoi-2
      when: Apr. 8
      date: '1965-04-08'
      thread: vietnam-hanoi
      c: 'The Politburo merges three pairs of provinces, for economic and cultural growth, defense and readiness for combat: Nam Định with Hà Nam; Thái Nguyên with Bắc Cạn; Hà Đông with Sơn Tây. Each pair''s
        Party committees to join into one.'
      n: '*Nghị quyết của Bộ Chính trị số 111-NQ/TW, 112-NQ/TW và 113-NQ/TW về việc hợp nhất hai tỉnh Nam Định và Hà Nam, Thái Nguyên và Bắc Cạn, Hà Đông và Sơn Tây*, each signed for the Politburo by Lê
        Đức Thọ. [[w.van-kien-dang-toan]], XXVI, 132–37. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1965-04-17.vietnam-hanoi
      when: Apr. 17
      date: '1965-04-17'
      thread: vietnam-hanoi
      c: The Secretariat sets up a Special Post Office Bureau for wire, radio and courier links between the Party Center and the Government and the ministries and localities, fast, exact and secret in any
        case, under the Politburo's instruction no. 81-CT/TW of Aug. 7, 1964 on readiness; the Central Office's special courier section and radio station join it.
      n: '*Nghị quyết của Ban Bí thư số 115-NQ/TW về việc thành lập Cục Bưu điện đặc biệt*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVI, 138–39. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1965-04-28.vietnam-hanoi
      when: Apr. 28
      date: '1965-04-28'
      thread: vietnam-hanoi
      c: 'The Politburo divides the duty of keeping order in the North between the army and the People''s Armed Public Security force, formed by its decision of Nov. 19, 1958: the army to build up and prepare
        for combat; the armed security force, under the police, to guard the borders, the coast and the demarcation line; its organization adjusted.'
      n: '*Nghị quyết của Bộ Chính trị số 116-NQ/TW về việc phân công nhiệm vụ giữa Quân đội nhân dân và lực lượng Công an nhân dân vũ trang trong việc bảo vệ trị an ở miền Bắc và điều chỉnh tổ chức lực
        lượng Công an nhân dân vũ trang*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVI, 142–50. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1965-04-29.vietnam-hanoi
      when: Apr. 29
      date: '1965-04-29'
      thread: vietnam-hanoi
      c: The Secretariat forms a Party organization for the Capital Command, directly under the Central Military Party Committee, and for local military work under the Hanoi city committee too.
      n: '*Nghị quyết của Ban Bí thư số 117-NQ/TW về thành lập Đảng bộ Bộ Tư lệnh Thủ đô*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVI, 151–52. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1965-05-05.vietnam-hanoi
      when: May 5
      date: '1965-05-05'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s secret cable to the Nghệ An provincial committee on transport under air attack: Vinh port''s stevedores to work in relays and to be armed, to unload night arrivals at once;
        the Transport Ministry''s party group and the Haiphong committee told to add sea haulage to road and rail.'
      n: '*Điện mật của Ban Bí thư (ngày 5 tháng 5 năm 1965) về bảo đảm giao thông vận tải* (the title the editors''), signed for the Secretariat by Vũ Tuân, chief of the office. [[w.van-kien-dang-toan]],
        XXVI, 153–54. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-05-07.vietnam-hanoi
      when: May 7
      date: '1965-05-07'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 96-CT/TW on secrecy and counterespionage: Americans sending in spies and commandos, working psychological war, and tying in the former parties, reactionary Catholics,
        hill reactionaries and old puppet bandits for sabotage and riots at the rear.'
      n: '*Chỉ thị của Ban Bí thư số 96-CT/TW về việc tăng cường công tác bảo mật phòng gian*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 155–61. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-05-07.vietnam-hanoi-2
      when: May 7
      date: '1965-05-07'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Secretariat and the Government Council''s standing committee on transport in the Fourth Zone provinces: the needs of "B" and "C", arms, fuel and part of the food, first; Nghệ An''s food reserve
        to go to Hà Tĩnh, Quảng Bình and Vĩnh Linh, Thanh Hoá''s to Nghệ An, the Center to make up Thanh Hoá; the Transport Ministry to requisition boats, launches and trucks.'
      n: '*Quyết định của Ban Bí thư và Thường vụ Hội đồng Chính phủ số 119-NQ/TW về một số vấn đề trong công tác giao thông vận tải ở các tỉnh Khu IV*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]],
        XXVI, 162–65. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-05-07.vietnam-hanoi-3
      when: May 7
      date: '1965-05-07'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 160-TT/TW on the second conference of the international trade-union committee in solidarity with Vietnam, to meet in Hanoi June 2: some 60 union delegations from
        the continents, for unions of over 100 countries.'
      n: '*Thông tri của Ban Bí thư số 160-TT/TW về việc tổ chức Hội nghị uỷ ban công đoàn quốc tế đoàn kết với lao động và nhân dân Việt Nam chống đế quốc Mỹ xâm lược*, signed for the Secretariat by Vũ
        Tuân, chief of the office. [[w.van-kien-dang-toan]], XXVI, 166–68. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-05-18.vietnam-hanoi
      when: May 18
      date: '1965-05-18'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 97-CT/TW on pushing supplementary education: the North to raise labor productivity, build its material base and strengthen defense, and its cadres and workers
        to be schooled further to do it.'
      n: '*Chỉ thị của Ban Bí thư số 97-CT/TW về việc đẩy mạnh công tác bổ túc văn hoá*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 169–83. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-05-18.vietnam-hanoi-2
      when: May 18
      date: '1965-05-18'
      thread: vietnam-hanoi
      also:
      - china
      c: 'The Secretariat''s circular no. 161-TT/TW on evacuating the ethnic Chinese from the cities, towns and key zones: few have gone to the countryside, where they lack kin, speak otherwise and have
        no Chinese schools; rumors of American–Chiang agents, some old people and children going to China on their own.'
      n: '*Thông tri của Ban Bí thư số 161-TT/TW về việc sơ tán Hoa kiều ở các thành phố, thị trấn và các vùng trọng điểm*, signed for the chief of the office by Vũ Tuân. [[w.van-kien-dang-toan]], XXVI,
        184–86. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-05-29.vietnam-hanoi
      when: May 29
      date: '1965-05-29'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 162-TT/TW on picking students for science and technology abroad: the Politburo decides that however the war goes the Party is to train tens of thousands of university-level
        cadres and hundreds of thousands of secondary-level.'
      n: '*Thông tri của Ban Bí thư số 162-TT/TW về việc chọn người đi học khoa học, kỹ thuật ở nước ngoài*, signed for the chief of the office by Vũ Tuân. [[w.van-kien-dang-toan]], XXVI, 187–89. Made public:
        2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-06-14.vietnam-hanoi
      when: June 14
      date: '1965-06-14'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 100-CT/TW on turning finance and trade to the new situation, the country now at war in both halves with the South the great front and the North the great rear:
        the finance and trade bodies reorganized and their cadres posted to match.'
      n: '*Chỉ thị của Ban Bí thư số 100-CT/TW về việc chuyển hướng công tác tài chính thương nghiệp trong tình hình mới*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVI, 196–217.
        Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-06-29.vietnam-hanoi
      when: June 29
      date: '1965-06-29'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 101-CT/TW on food: the winter-spring rice crop good, quotas met and passed in many provinces; some localities, in their food balances, deduct sums at will, against
        the Prime Minister''s instruction.'
      n: '*Chỉ thị của Ban Bí thư số 101-CT/TW về việc tăng cường lãnh đạo công tác lương thực hiện nay*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVI, 218–21. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-06-29.vietnam-hanoi-2
      when: June 29
      date: '1965-06-29'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Secretariat''s secret cable no. 146/HT to the committees of Thanh Hoá, Nghệ An, Hà Tĩnh and Quảng Bình and the Vĩnh Linh zone: transport into the Fourth Zone so hard that the Center can meet
        only the barest food needs; the provinces to rely on themselves and live off their own grain.'
      n: '*Điện mật của Ban Bí thư số 146/HT về việc giải quyết lương thực, đẩy mạnh sản xuất* (the title the editors''), signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVI, 222–25.
        Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-07-03.vietnam-hanoi
      when: July 3
      date: '1965-07-03'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 102-CT/TW on ideological and political teaching in the schools: nearly 90,000 students in higher and vocational training, nearly 200,000 graduates a year from
        the lower and upper general schools, nearly 90,000 teachers, 6,000 of them in universities and vocational schools.'
      n: '*Chỉ thị của Ban Bí thư số 102-CT/TW về việc tăng cường công tác giáo dục tư tưởng và chính trị đối với cán bộ giảng dạy và sinh viên, học sinh*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]],
        XXVI, 233–46. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-07-06.vietnam-hanoi
      when: July 6
      date: '1965-07-06'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 122-NQ/TW on the "four goods" campaign for branches and basic Party committees: its course since the Third Congress, after the Central Organization Department''s
        report, and the measures to speed it.'
      n: '*Nghị quyết của Ban Bí thư số 122-NQ/TW về tăng cường lãnh đạo, đẩy mạnh cuộc vận động xây dựng chi bộ và đảng bộ cơ sở bốn tốt*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]],
        XXVI, 247–66. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
- add:
    entry:
      id: cal.1965-07-07.vietnam-hanoi
      when: July 7
      date: '1965-07-07'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 123-NQ/TW on turning organization work to the new situation: the struggle for the South in a decisive stage, American troops entering it, the North bombed and blockaded,
        the whole country at war against the United States; the Party''s and the state''s organs to be reset, at every level, for both the economy and defense, and the young and the militia called up.'
      n: '*Nghị quyết của Bộ Chính trị số 123-NQ/TW về việc chuyển hướng công tác tổ chức trong tình hình và nhiệm vụ mới*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVI, 267–303
        (the requirements, 268–73; each level''s tasks, 274–89; the state organs, 286–89; the young and the militia, 289–300). Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duc-tho
