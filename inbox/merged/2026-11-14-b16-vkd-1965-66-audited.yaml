      id: cal.1966-05-16.vietnam-hanoi
      when: May 16
      date: '1966-05-16'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 180-TT/TW on policy toward Buddhism: over 4,000 monks and nuns in the North, many patriotic and active in the war; the policy of its instruction no. 217-CT/TW of
        July 9, 1960 to be kept.'
      n: '*Thông tri của Ban Bí thư số 180-TT/TW về việc chấp hành chính sách tôn giáo đối với đạo Phật*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 157–60. See [[cal.1966-04-20.vietnam-struggle]].
        Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
