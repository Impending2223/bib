      when: June 1
      date: '1966-06-01'
      thread: vietnam-hanoi
      c: 'The Central Committee''s letter to the 15th Congress of the Mongolian People''s Revolutionary Party, forty-five years at the head of Mongolia: greeting, and the war against the United States.'
      n: '*Thư của Ban Chấp hành Trung ương Đảng Lao động Việt Nam ngày 1 tháng 6 năm 1966 gửi Đại hội lần thứ XV Đảng Nhân dân cách mạng Mông Cổ*, signed for the Central Committee by Hồ Chí Minh, Chairman.
        [[w.van-kien-dang-toan]], XXVII, 343–44 (appendix). Made public: 2003. Names: Hồ Chí Minh. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at
        the time; the volume prints it from the Party archive, and the Secretariat''s circular no. 182-TT/TW has the press print the Central Committee''s greeting to the Chinese party, July 1, 1966 (XXVII,
        220).'
      tags:
