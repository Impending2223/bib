      date: '1966-04-14'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 123-CT/TW on the commune purchase-and-sale cooperatives: nearly all communes of the delta and midlands and about half in the highlands have one, with over 5
        million members.'
      n: '*Chỉ thị của Ban Bí thư số 123-CT/TW về việc tăng cường lãnh đạo và củng cố phong trào hợp tác xã mua bán xã*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVII, 111–17.
        Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
