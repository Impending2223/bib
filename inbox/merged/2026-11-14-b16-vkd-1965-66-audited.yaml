      n: '*Chỉ thị của Ban Bí thư số 124-CT/TW về tăng cường lãnh đạo công tác tài chính thương nghiệp và giá cả năm 1966–1967*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVII,
