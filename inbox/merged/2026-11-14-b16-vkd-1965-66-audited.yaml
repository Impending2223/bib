      date: '1965-09-14'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 166-TT/TW on research into the direction of industry's building and growth and the management of industry and firms, a decade of industrial building behind it.
      n: '*Thông tri của Ban Bí thư số 166-TT/TW về việc tổ chức nghiên cứu các vấn đề về phương hướng xây dựng, phát triển và quản lý công nghiệp, quản lý xí nghiệp*, signed for the chief of the office
