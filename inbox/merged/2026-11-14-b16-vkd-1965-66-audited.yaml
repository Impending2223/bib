      when: Jan. 18
      date: '1966-01-18'
      thread: vietnam-hanoi
      c: 'The Central Committee''s cable to the Italian Communist Party''s Central Committee for its Eleventh Congress: the American pause and the talk of "peaceful negotiation" a lie covering a wider war;
        the Italian party thanked for its support.'
      n: '*Điện của Ban Chấp hành Trung ương Đảng Lao động Việt Nam ngày 18 tháng 1 năm 1966 gửi Ban Chấp hành Trung ương Đảng Cộng sản Ý*, signed for the Central Committee by Lê Duẩn, First Secretary.
        [[w.van-kien-dang-toan]], XXVII, 339–40 (appendix). Made public: 2003. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume
        prints it from the Party archive, and the Secretariat''s circular no. 182-TT/TW has the press print the Central Committee''s greeting to the Chinese party, July 1, 1966 (XXVII, 220).'
      tags:
      - polity:drv
      - vis:only:drv+italy
      - name:le-duan
- add:
    entry:
      id: cal.1966-01-20.vietnam-hanoi
      when: Jan. 20
      date: '1966-01-20'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 174-TT/TW on studying the Twelfth Plenum''s resolution and the State''s two-year plan: every Party committee to hold a thorough course for cadres and members, so
        that both become the will and the deed of the Party, the army and the people.'
      n: '*Thông tri của Ban Bí thư số 174-TT/TW về việc học tập Nghị quyết Hội nghị lần thứ 12 của Trung ương và kế hoạch hai năm của Nhà nước*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]],
        XXVII, 21–25. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-01-24.vietnam-hanoi
      when: Jan. 24
      date: '1966-01-24'
      thread: vietnam-hanoi
      also:
      - vietnam-pause
      - laos
      c: 'The Secretariat''s secret cable no. 18: a month into the pause the Americans have put over 10,000 more men into the South, raised the war budget, stepped up sweeps and bombing in the South and
        in central and lower Laos, and flown reconnaissance over the North; bombing of the North''s roads and key points expected again.'
      n: '*Điện mật của Ban Bí thư số 18 gửi các Khu uỷ, Thành uỷ và Tỉnh uỷ yêu cầu thực hiện một số việc để đánh bại âm mưu của Mỹ ném bom bắn phá trở lại miền Bắc* (the title the editors''), signed for
        the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 26–28. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-01-28.vietnam-hanoi
      when: Jan. 28
      date: '1966-01-28'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 119-CT/TW on handing down the management of the Party''s finances, two years after its instruction no. 70-CT/TW of Dec. 14, 1963: the Center''s control kept,
        the committees given more responsibility.'
      n: '*Chỉ thị của Ban Bí thư số 119-CT/TW về việc phân cấp quản lý tài chính của Đảng*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 29–32. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-01-28.vietnam-hanoi-2
      when: Jan. 28
      date: '1966-01-28'
      thread: vietnam-hanoi
      also:
      - vietnam-pause
      c: 'The Secretariat''s secret cable no. 33: the Americans preparing to bomb the North again, perhaps harder and on a larger scale; every committee to plan at once: the old, children and non-workers
        evacuated, schools and markets dispersed, depots protected.'
      n: '*Điện mật của Ban Bí thư số 33 gửi các Khu uỷ, Thành uỷ, Tỉnh uỷ về việc lập kế hoạch đề phòng đế quốc Mỹ oanh tạc trở lại miền Bắc* (the title the editors''). [[w.van-kien-dang-toan]], XXVII,
        33–34. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-01-31.vietnam-hanoi
      when: Jan. 31
      date: '1966-01-31'
      thread: vietnam-hanoi
      c: 'The Twelfth Plenum''s resolution no. 135-NQ/TW, issued Jan. 31, 1966: until a Fourth Congress can meet, points of the Party statute applied and added to for wartime; units of the main and local
        forces, armed security, youth shock troops and transport may admit members on introducers who have not worked with the candidate for a year.'
      n: '*Nghị quyết Hội nghị lần thứ 12 Ban Chấp hành Trung ương số 135-NQ/TW về việc vận dụng và bổ sung một số điểm cụ thể về Điều lệ Đảng*. [[w.van-kien-dang-toan]], XXVII, 35–40 (the editors'' note,
        35: the resolution issued Jan. 31, 1966). See [[cal.1965-12-27.vietnam-2]]. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-02-17.vietnam-hanoi
      when: Feb. 17
      date: '1966-02-17'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 120-CT/TW on ideological work in 1966: the work of 1965, turned by the Eleventh Plenum''s resolution, reviewed, and the year''s tasks set.'
      n: '*Chỉ thị của Ban Bí thư số 120-CT/TW về công tác tư tưởng trong năm 1966*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 41–60. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-03.vietnam-hanoi
      when: Mar.
      date: 1966-03
      thread: vietnam-hanoi
      c: 'COSVN''s fourth conference, its resolution no. 1: in full accord with the Twelfth Plenum; in 1965 the enemy brought in 200,000 American and allied troops and the Seventh Fleet, turning "special
        war" into "local war" with a special character, and bombed the North; the enemy''s dry-season plan failed in its aims, the Liberation main force neither destroyed nor driven back to small guerrilla
        actions, all three kinds of forces striking Americans and Saigon troops together.'
      n: '*Nghị quyết hội nghị Trung ương Cục lần thứ tư, số 1, tháng 3 năm 1966: Đánh giá tình hình cách mạng miền Nam năm 1965, phương hướng, nhiệm vụ sắp tới và một số nhiệm vụ của cách mạng miền Nam*.
        [[w.van-kien-dang-toan]], XXVII, 352–426 (appendix; the year''s balance, 353–54). Made public: 2003. Check: the day; the volume gives the month.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-03-08.vietnam-hanoi
      when: Mar. 8
      date: '1966-03-08'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 175-TT/TW: the Politburo has decided to hold in Hanoi an international gathering, "Meeting of the World''s Scientists and Cultural Figures in Support of the Vietnamese
        People against the American War of Aggression", of known progressive scientists and cultural figures of the world or its regions.'
      n: '*Thông tri của Ban Bí thư số 175-TT/TW về việc tổ chức "Cuộc họp mặt những nhà khoa học và văn hoá thế giới ủng hộ nhân dân Việt Nam chống cuộc chiến tranh xâm lược của Mỹ"*, signed for the Secretariat
        by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 61–63. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-03-15.vietnam-hanoi
      when: Mar. 15
      date: '1966-03-15'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 176-TT/TW on the cooperative-management campaign: the committees see its weight and have pressed it, with good results, but it moves slowly.'
      n: '*Thông tri của Ban Bí thư số 176-TT/TW về một số vấn đề cần chú ý trong cuộc vận động "Cải tiến quản lý hợp tác xã, cải tiến kỹ thuật, phát triển sản xuất nông nghiệp"*, signed for the Secretariat
        by Hoàng Anh. [[w.van-kien-dang-toan]], XXVII, 64–68. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-03-20.vietnam-hanoi
      when: Mar. 20
      date: '1966-03-20'
      thread: vietnam-hanoi
      also:
      - vietnam-struggle
      c: 'The Zone V committee''s resolution on work in the cities: 12 cities and towns in the zone, two cities, Huế and Đà Nẵng, and two large towns, Quy Nhơn and Nha Trang, with over 900,000 people; Huế
        still the political and cultural center of many central provinces.'
      n: '*Nghị quyết của Khu uỷ V ngày 20 tháng 3 năm 1966 về công tác thành phố*. [[w.van-kien-dang-toan]], XXVII, 427–51 (appendix; the cities, 427). Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
