      when: Aug. 25
      date: '1965-08-25'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 108-CT/TW on the same campaign in the highlands, its pilot stage done and the drive to be widened, under the Politburo's resolution no. 70 of Feb. 19, 1963.
      n: '*Chỉ thị của Ban Bí thư số 108-CT/TW về cuộc vận động cải tiến quản lý hợp tác xã, cải tiến kỹ thuật, nhằm phát triển sản xuất nông nghiệp toàn diện, mạnh mẽ và vững chắc ở miền núi*, signed for
        the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 380–95. See [[cal.1965-08-21.vietnam-hanoi]]. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
