      date: '1965-11-15'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 113-CT/TW on the tasks of *Nhân Dân*, the Party''s daily: its record of propaganda for the war in both halves, for production and for the Party''s line in world
        affairs, and what it is now to do.'
      n: '*Chỉ thị của Ban Bí thư số 113-CT/TW về nhiệm vụ của báo Nhân dân trước tình hình và nhiệm vụ mới của cách mạng*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 424–32.
        Made public: 2003.'
