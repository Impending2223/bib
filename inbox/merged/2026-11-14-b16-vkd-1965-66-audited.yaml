      id: cal.1966-05-17.vietnam-hanoi
      when: May 17
      date: '1966-05-17'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 127-CT/TW on the militia, self-defense forces and reserves: a year under American air attack has tested and strengthened them, but the communes beside main roads
        and the work sites remain weak, in training, in tactics and in lessons against air, spy and psychological war.'
      n: '*Chỉ thị của Ban Bí thư số 127-CT/TW về việc tăng cường lãnh đạo công tác dân quân, tự vệ và hậu bị trong tình hình mới*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII,
        167–74. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
