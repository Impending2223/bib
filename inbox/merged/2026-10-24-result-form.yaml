      n: 'Shares: [Wikipedia, "1968 United States House of Representatives elections"](https://en.wikipedia.org/wiki/1968_United_States_House_of_Representatives_elections). Check: the State''s canvass, the *Legislative Manual*, 1968. Votes: CQ Guide 6th (2010) 1284. See [[cal.1967-12-12.specials]]. Names: Podell, Multer.'
- edit:
