- edit:
    id: cal.1964-09-08.governors-wi
    base: 3a9ba2c3
    set:
      c: 'Wisconsin, governor. Democratic primary: Governor Reynolds over Frinzi, 70.3 percent. Republican: Knowles, a former lieutenant governor, over Knutson, 246,760 to 96,421, 71.9 percent.'
      n: 'Votes: [Wikipedia, "1964 Wisconsin gubernatorial election"](https://en.wikipedia.org/wiki/1964_Wisconsin_gubernatorial_election), from the *Wisconsin Blue Book 1966* (Check). Check: the Democratic count. To check: [[w.thompson-history-of-wisconsin-volume]]; [[w.peirce-great-lakes-states-of]]. See [[cal.1964-04-07.elections-1964]]. Names: John Reynolds, Knowles, Frinzi, Knutson.'
- edit:
    id: cal.1964-09-08.governors-nh
    base: 0ad761c1
    set:
      c: New Hampshire's Republican primary for governor. Pillsbury over Powell, 32,200 to 21,764, 51.4 percent; King, the governor, as a write-in, 3,608, 5.8 percent. King re-elected in November over Pillsbury, 190,863 to 94,824, 66.8 percent.
- edit:
    id: cal.1964-09-08.governors-vt
    base: 761df9bc
    set:
      c: Vermont's Republican primary for governor. Foote, the lieutenant governor, over Babcock, 19,121 to 16,225, 42.8 percent; MacBride 9,265, 20.7 percent. Hoff re-elected in November over Foote, 106,611 to 57,576, 64.9 percent.
- edit:
    id: cal.1964-09-15.governors-wa
    base: b320cbf8
    set:
      c: 'Washington''s blanket primary, for governor: Evans (R), a State representative, over Governor Rosellini (D), seeking a third term, 323,152 to 243,220, 39.1 percent; Christensen (R) 213,217, 25.8 percent. Evans and Rosellini nominated.'
- edit:
    id: cal.1964-09-15.governors-ma
    base: 3f9c9c96
    set:
      c: Massachusetts primary. Bellotti, the lieutenant governor, takes the Democratic nomination for governor from Peabody, 363,675 to 336,780, 49.6 percent; two others. For treasurer, Crane over Hicks, 238,629 to 163,201, 35.9 percent. Volpe unopposed for the Republican nomination.
- edit:
    id: cal.1964-11-03.elections-1964
    base: 3a52c97c
    set:
      c: 'Election day. Johnson and Humphrey over Goldwater and Miller, 43,126,959 to 27,175,770, 61.1 percent; 486 electoral votes to 52. Goldwater carries Arizona and five States of the Deep South: Alabama, Georgia, Louisiana, Mississippi, South Carolina. The 89th Congress: House 295 D–140 R; Senate 68 D–32 R.'
      n: 'Radio and Television Remarks to the American People at the Close of Election Day, [1963–64 Pub. Papers 1585](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=825) (Nov. 4, 1964). [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). [[w.perlstein-before-the-storm]], 510–13 (Goldwater''s six States). The national figures: the Clerk''s State figures, added (Elections, 1964). To check: [[w.white-making-of-the-president-1965]]; [[w.cosman-five-states-for-goldwater]]; [[w.lamb-campaign-decision-making]]; [[w.national-election-of-1964]]; [[w.mann-daisy-petals-and-mushroom]]; [[w.kessel-goldwater-coalition]]; [[w.middendorf-glorious-disaster]]; [[w.novak-agony-of-the-g]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-07-15.elections-1964]]; [[cal.1964-08-26.elections-1964]]. Names: Johnson, Humphrey, Goldwater, Miller.'
- edit:
    id: cal.1964-11-03.elections-1964-2
    base: 7a3fa1c4
    set:
      c: 'The Senate. Democrats take Republican seats in New York, Robert Kennedy over Keating; Maryland, Tydings over Beall; New Mexico, Montoya over Mechem. Murphy takes Salinger''s seat in California. Cannon holds Nevada over Laxalt, 67,336 to 67,288, 50.0 percent, a 48-vote margin; Yarborough Texas over Bush. Governors: Republicans gain Massachusetts (Volpe), Washington (Evans), Wisconsin, and lose Arizona and Utah; Romney re-elected; Kerner over Percy; Faubus over Winthrop Rockefeller.'
- edit:
    id: cal.1964-11-03.robert-kennedy
    base: 1b93fef6
    set:
      c: 'Robert Kennedy elected Senator from New York over Keating, 3,823,749 to 3,104,056, 53.5 percent. Johnson and Kennedy by telephone, 11:55 p.m.: Kennedy thanks him for his help; Johnson: nothing will divide them.'
- edit:
    id: cal.1964-11-03.elections-1964-3
    base: f021af53
    set:
      c: 'The House in Georgia and Mississippi. Georgia 3d: Callaway (R) over Garland Byrd, 45,145 to 33,733, 57.2 percent, for Forrester''s open seat, the State''s first Republican U.S. Representative since Reconstruction. Mississippi 4th: Prentiss Walker (R) over Winstead, 35,277 to 28,057, 55.7 percent, the State''s first of the century. In Louisiana, Boggs holds New Orleans over Treen (R), 77,009 to 62,881, 55.0 percent.'
- edit:
    id: cal.1964-11-03.state-constitutions-mi
    base: 27638c5d
    set:
      c: Michigan. Proposal C, a referendum on the legislature's law against straight-ticket voting, the law rejected, 795,546 to 1,515,875, 34.4 percent.
- edit:
    id: cal.1964-11-03.state-constitutions-tx
    base: d235b75b
    set:
      c: Texas adopts three amendments. Vendor payments for medical care of the needy aged not on old-age assistance, with federal funds, State funds not to exceed what the federal match covers, 1,049,995 to 426,866, 71.1 percent. The transfer of up to 1 percent a year from the permanent to the available school fund ended; terms for laws on conservation districts.
- edit:
    id: cal.1964-11-03.state-constitutions-ok
    base: 7cb19b12
    set:
      c: 'Oklahoma votes on seven State questions; all fail. A Court on the Judiciary to remove judges, 397,823 to 370,694, 51.8 percent, and a school levy of up to 15 mills, 417,638 to 405,612, 50.7 percent: majorities of those voting on them, short of a majority of all votes cast. By referendum petition, the act ending the governor''s power to fill vacancies for U.S. Senator and judges by appointment rejected, 310,358 to 458,037, 40.4 percent. Legislators'' per diem; school aid and school district bills.'
- edit:
    id: cal.1964-11-03.state-constitutions-or
    base: 85af5183
    set:
      c: Oregon. Measure 1, the legislature's amendment of the constitution abolishing the death penalty, carries, 455,654 to 302,105, 60.1 percent. The last execution, by gas, Aug. 20, 1962.
- edit:
    id: cal.1964-11-03.state-constitutions-md
    base: 0e9eb84c
    set:
      c: 'Maryland. The public accommodations act of 1964 approved at referendum, 342,715 to 301,505, 53.2 percent. Amendments ratified: annual 70-day sessions of the General Assembly, 333,094 to 191,148, 63.5 percent; more time for a county charter board; the Orphans'' Court of Montgomery County to the Circuit Court; notaries public.'
- edit:
    id: cal.1964-11-03.elections-1964-dc
    base: 080beb23
    set:
      c: 'The District of Columbia votes for President for the first time, under the Twenty-third Amendment: Johnson over Goldwater, 169,796 to 28,801, 85.5 percent. Three electoral votes.'
- edit:
    id: cal.1964-11-03.state-constitutions-ca
    base: ae1e5512
    set:
      c: 'California. Proposition 15, the "Free Television Act," an initiative against pay television, carries, 4,515,013 to 2,286,775, 66.4 percent: a charge for programs carried into the home contrary to public policy. The same day, Proposition 14, against the Rumford Act, carries.'
- edit:
    id: cal.1964-11-03.state-constitutions-mn
    base: '38885745'
    set:
      c: Minnesota's taconite amendment, "Taxation of Taconite and Other Metals," adopted, 1,272,590 to 204,133, 86.2 percent; a majority of all who voted at the election needed. A second, removing obsolete provisions, adopted, 1,089,798 to 254,216, 81.1 percent.
- edit:
    id: cal.1964-11-03.state-constitutions-ma
    base: 71774efa
    set:
      c: 'Massachusetts, Question 1: four-year terms for the governor, lieutenant governor, secretary, treasurer, attorney general and auditor, from the election of 1966; councillors and legislators still two. Carries, 1,391,922 to 450,367, 75.6 percent; 546,141 ballots blank on it.'
- edit:
    id: cal.1965-04-06.mayors-los-angeles
    base: 26974edd
    set:
      c: Los Angeles. Yorty re-elected mayor in the primary over James Roosevelt, who left the House for the race, 392,775 to 247,313, 57.9 percent; McGee 32,605, 4.8 percent; five others.
- edit:
    id: cal.1965-04-06.mayors-st-louis
    base: ed8d01d0
    set:
      c: St. Louis elects Cervantes (D) mayor over Zumwalt (R), 102,961 to 47,510, 68.4 percent of the two.
- edit:
    id: cal.1965-04-27.state-and-city-finance-ok
    base: ae92f918
