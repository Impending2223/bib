    set:
      c: Georgia House elections under the 1965 reapportionment (Check which seats). Bond, SNCC's communications director, elected from the 136th district, Atlanta, over another Negro candidate, 2,320 to 487, 82.7 percent; some 6,000 of its 6,500 voters Negroes. Eleven Negroes elected to the House (Check).
- edit:
    id: cal.1965-08-17.mississippi-ms
    base: 88c380ee
    set:
      c: 'Mississippi''s voters approve the amendments of the June special session, 130,832 to 49,330, 72.6 percent: the interpretation test of 1954, the "good moral character" requirement, and the publication of applicants'' names repealed. Paul Johnson proposed them; the House refused twice before passing them. The poll tax for State elections stands. Check the date.'
- edit:
    id: cal.1965-08-17.state-constitutions-mo
    base: 8ab3d79a
    set:
      c: 'Missouri, special election. Adopted: No. 1, a governor may be elected twice, 204,987 to 75,968, 73.0 percent; No. 2, cities may sell industrial plants built with revenue bonds, 176,942 to 94,882, 65.1 percent. Refused: No. 3, a House of 168 apportioned by law after each census, a Senate of 34 districted by a commission, 112,211 to 160,568, 41.1 percent.'
- edit:
    id: cal.1965-09-07.state-constitutions-tx
    base: 3c17400c
    set:
      c: Texas refuses an amendment to enlarge the Senate from 31 to 39, apportion it by population and drop the limit of one Senator a county, 85,951 to 136,461, 38.6 percent.
- edit:
    id: cal.1965-09-14.mayors-nyc
    base: b97913ae
    set:
      c: New York's Democratic primary for mayor. Beame, the city comptroller, over Screvane, president of the City Council, Wagner's choice, 336,345 to 271,381, 44.8 percent; U.S. Representative Ryan 113,738, 15.2 percent; O'Dwyer 28,675, 3.8 percent. Check the date.
- edit:
    id: cal.1965-09-14.state-constitutions-ok
    base: d03cea30
    set:
      c: 'Oklahoma, special election: a local school levy of up to 10 mills, voted by each district, adopted, 125,779 to 59,535, 67.9 percent.'
- edit:
    id: cal.1965-11-02.states-and-cities
    base: e4da978e
    set:
      c: New York City. Lindsay, Republican and Liberal, elected mayor over Beame, Democrat, 1,149,106 to 1,046,699, 45.0 percent; Buckley, Conservative, 341,226, 13.4 percent. The first Republican elected mayor since 1941.
- edit:
    id: cal.1965-11-02.states-and-cities-2
    base: 63503eaf
    set:
      c: 'Governors. Virginia: Godwin (D), the lieutenant governor, over Holton (R), 269,526 to 212,207, 47.9 percent; Story, of a new Conservative party, 75,307, 13.4 percent. New Jersey: Hughes (D) re-elected over Dumont (R), 1,279,568 to 915,996, 57.4 percent.'
- edit:
    id: cal.1965-11-02.mayors-cleveland
    base: fd424b38
    set:
      c: Cleveland. Locher (D) re-elected over Carl Stokes, a Negro State representative running as an independent, 87,858 to 87,716, 36.7 percent, a 142-vote margin; Ralph Perk (R) 41,045, 17.2 percent; a fourth 22,650, 9.5 percent.
- edit:
    id: cal.1965-11-02.state-constitutions-tx
    base: 0a9e8432
    set:
      c: 'Texas votes on ten amendments. Adopted: assistance and medical care for the needy aged, disabled, blind and children, the State to join the federal programs and accept their funds, 347,218 to 148,097, 70.1 percent; student loans, the Texas Opportunity Plan; retirement of district and appellate judges and a Judicial Qualifications Commission; teacher retirement; building at State colleges. Refused: four-year terms for the governor and other State officers, 225,987 to 277,892, 44.8 percent, and for State representatives, 141,184 to 343,236, 29.1 percent; legislators'' pay; the Veterans'' Land Fund; a tax exemption for charity hospitals.'
- edit:
    id: cal.1965-11-06.mayors-new-orleans
    base: ab74a35e
    set:
      c: 'New Orleans, Democratic primary for mayor: Schiro over Fitzmorris, a councilman, 81,973 to 78,654, 50.1 percent. No runoff.'
- edit:
    id: cal.1965-11-30.alabama-al
    base: 8638133c
    set:
      c: 'Constitutional amendment election, thirty-seven amendments. Section 181, the qualifications of 1951 (good character, embracing the duties of citizenship), repealed, 93,647 to 37,137, 71.6 percent: an applicant to read and write any article of the federal Constitution, except for physical disability, the legislature to provide permanent registration. $1,900,000 in bonds for an exhibit of Army and NASA rockets at Huntsville, 92,506 to 29,761, 75.7 percent.'
- edit:
    id: cal.1965-12-14.state-constitutions-ok
    base: dcd0853c
    set:
      c: 'Oklahoma, special election: $54.75 million in debt for State institutions'' buildings, retired from the cigarette tax, general revenue and bonds on the State''s credit, adopted, 101,340 to 31,116, 76.5 percent.'
- edit:
    id: cal.1965-12-14.state-constitutions-ct
    base: 7d4791dc
    set:
      c: Connecticut ratifies its new constitution, the first since 1818, 178,432 to 84,129, 68.0 percent; 20.2 percent of the registered voting. The second proposal, no taking of property for public use unless necessary, fails, 117,494 to 139,701, 45.7 percent. Dempsey proclaims it Dec. 30.
- edit:
    id: cal.1965-12-15.specials
    base: f4f0c5fa
    set:
      c: 'California 26th, special. Rees (D), a State senator, takes the seat James Roosevelt left Sept. 30 for the UN Economic and Social Council. First round, Nov. 23: Rees over Horwin (D), 21,481 to 19,612, 35.3 percent; Marshall (R) 16,088, 26.4 percent. Runoff: Rees over Marshall, 40,430 to 27,579, 59.4 percent. Swing 10.9 to R. Sworn Jan. 10, 1966.'
- edit:
    id: cal.1966-01-14.state-constitutions-mo
    base: 9b877ac7
    set:
      c: Missouri, special election. Three amendments adopted. No. 3, from the extra session, a House of 163, House and Senate districts drawn by bipartisan commissions, failing which by commissioners of the Supreme Court, 178,924 to 165,395, 52.0 percent. Also pensions for county and local employees, 217,116 to 127,461, 63.0 percent, and the St. Louis school tax, 195,798 to 148,519, 56.9 percent.
- edit:
    id: cal.1966-02-05.specials
    base: '95908233'
    set:
      c: North Carolina 1st, special. Walter B. Jones (D), a State senator, holds Bonner's seat over East (R), 21,773 to 14,308, 60.3 percent. Bonner died Nov. 7, 1965. Swing 22.2 to R.
- edit:
    id: cal.1966-02-08.specials
    base: face0d9f
    set:
      c: New York 17th, special. Kupferman (R), of the City Council, holds Lindsay's seat over Orin Lehman (D), 44,125 to 43,206, 46.4 percent, a 919-vote margin; Jeffrey St. John (Conservative) 7,796, 8.2 percent. Lindsay resigned Dec. 31, 1965, to be mayor. Swing 24.8 to D.
- edit:
    id: cal.1966-03-26.specials
    base: a54ea814
    set:
      c: Texas 8th, special. Lera Thomas (D) holds her husband's seat over Leman (R), 6,120 to 2,147, 74.0 percent; Albert Thomas died Feb. 15. Swing 2.7 to R.
- edit:
    id: cal.1966-05-03.elections-1966
    base: 1883cec9
    set:
      c: Alabama's Democratic primary, the first since the Voting Rights Act. Lurleen Wallace, standing for her husband, barred from a second term, wins outright over Attorney General Richmond Flowers, 480,841 to 172,386, 54.1 percent; Carl Elliott, Patterson and Folsom behind. In Dallas County, Ala., Sheriff Clark loses the nomination to Wilson Baker, public safety director of Selma, Ala. (Check). In Lowndes County, Ala., the Lowndes County Freedom Organization, its emblem a black panther, holds its own nominating meeting (Check).
- edit:
    id: cal.1966-05-03.governors-fl
    base: 0a74b9cc
    set:
      c: 'Florida''s Democratic primary for governor. Governor Burns, elected in 1964 to a two-year term, over High, mayor of Miami, 372,451 to 338,281, 35.4 percent; Kelly 331,580, 31.5 percent. Runoff between Burns and High. Republican: Kirk, the 1964 nominee for the Senate, over one other, 100,838 to 23,953, 80.8 percent.'
- edit:
    id: cal.1966-05-03.governors-oh
    base: 53ac6558
    set:
      c: 'Ohio, primaries for governor. Democratic: Frazier Reams Jr., a State senator, over a Cleveland attorney, 326,419 to 231,406, 58.5 percent. Republican: Rhodes renominated over one other, 577,827 to 73,428, 88.7 percent.'
- edit:
    id: cal.1966-05-03.governors-ok
    base: d1d78a6e
    set:
      c: 'Oklahoma primaries for governor. Democratic: Raymond Gary over Preston Moore, 160,825 to 104,081, 31.5 percent; David Hall, the Tulsa County district attorney, 94,309, 18.5 percent; runoff between Gary and Moore. Republican: State Senator Dewey Bartlett over Happy Camp, 46,053 to 45,185, 48.9 percent, an 868-vote margin; runoff, the party''s first for governor.'
      n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 55](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=55); [p. 59](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=59). [Wikipedia, "1966 Oklahoma gubernatorial election"](https://en.wikipedia.org/wiki/1966_Oklahoma_gubernatorial_election) for the first runoff. Shares as the Board prints them, cut, not rounded. To check: [[w.morgan-oklahoma-politics-and-policies]]; [[w.peirce-great-plains-states-of]]. See [[cal.1962-05-01.governors-ok]]. Names: Gary, Moore, Hall, Bartlett, Camp.'
- edit:
    id: cal.1966-05-03.state-constitutions-ok
    base: b3a3552b
    set:
      c: Oklahoma, with the primary, adopts five amendments. The constitution's command of separate schools for white and colored children repealed, 327,927 to 166,941, 66.3 percent. Elected officials convicted of a felony suspended, and justices made impeachable, 395,295 to 90,253, 81.4 percent. A Court on the Judiciary to remove judges, 328,012 to 128,207, 71.9 percent. New residents to vote for President, 347,440 to 120,455, 74.3 percent. Governors limited to two terms in succession, 300,954 to 183,850, 62.1 percent.
- edit:
    id: cal.1966-05-03.governors-nm
    base: 0a67fba5
    set:
      c: 'New Mexico''s primary, for governor. Democratic: Lusk, once a State senator, over Burroughs, governor 1959–61, 85,211 to 57,143, 59.9 percent. Republican: Cargo, a State representative, over Hawley, 17,836 to 16,588, 51.8 percent.'
- edit:
    id: cal.1966-05-07.governors-tx
    base: 2b2a6f75
    set:
      c: Texas Democratic primary. Governor Connally renominated for a third term over Stanley Woods, 932,641 to 291,651, 74.3 percent.
- edit:
    id: cal.1966-05-10.governors-ne
