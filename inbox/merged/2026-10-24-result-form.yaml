      c: Oklahoma, special election; three questions refused. A third cent of sales tax, 171,123 to 293,278, 36.8 percent. $56.75 million in debt for State buildings, 199,512 to 261,229, 43.3 percent. $60 million in highway notes on the motor fuel tax, 213,953 to 247,256, 46.4 percent.
- edit:
    id: cal.1965-06-01.governors-nj
    base: 3dff7cd2
    set:
      c: 'New Jersey primaries for governor. Democratic: Hughes renominated over one other, 236,518 to 23,722, 90.9 percent. Republican: Dumont, State senator, over Sandman, State senator, 167,402 to 154,491, 50.4 percent.'
- edit:
    id: cal.1965-06-15.georgia-atlanta
