      n: '[Wikipedia, "1966 New York state election"](https://en.wikipedia.org/wiki/1966_New_York_state_election). Check: the *Legislative Manual*, 1967. Check: Adams''s count; [Wikipedia, "1966 New York gubernatorial election"](https://en.wikipedia.org/wiki/1966_New_York_gubernatorial_election) gives 510,023. See [[cal.1966-09-07.governors-ny]]. Names: Rockefeller, O''Connor, Paul Adams, Roosevelt.'
- edit:
    id: cal.1966-11-08.south-carolina-sc
    base: 8c1847ec
    set:
      c: 'South Carolina. Governor: McNair (D) over Rogers (R), 255,854 to 184,088, 58.2 percent, the first Republican to oppose a Democrat for governor since 1938. Senate: Thurmond, a Republican since 1964, re-elected over Morrah (D), 271,297 to 164,955, 62.2 percent; Hollings (D) over Parker (R), 223,790 to 212,032, 51.3 percent, for Johnston''s unexpired term.'
- edit:
    id: cal.1966-11-08.state-constitutions-mi
    base: 5b5be9e7
    set:
      c: Michigan. Proposal 1, an amendment lowering the voting age from 21 to 18, rejected, 703,076 to 1,267,872, 35.7 percent.
- edit:
    id: cal.1966-11-08.state-constitutions-tx
    base: 5e346cea
    set:
      c: 'Texas adopts fifteen of sixteen amendments. The poll tax repealed as a condition of voting, 659,604 to 466,119, 58.6 percent. Voters short of a county''s residence to vote for electors and statewide offices, and new residents for President and Vice President, 701,349 to 347,337, 66.9 percent; members of the armed forces resident in Texas to vote, 893,798 to 197,901, 81.9 percent. A county of 1.2 million or more may consolidate its governments, 565,174 to 447,578, 55.8 percent. A five-member Court of Criminal Appeals; $200 million more in water bonds; airport authorities; Arlington State College out of the Permanent University Fund. Refused: six-year terms for directors of conservation districts.'
- edit:
    id: cal.1966-11-08.legislatures-ok
    base: 414e9be8
    set:
      c: Oklahoma. By referendum petition, the voters reject the Legislature's congressional districting act, H.B. 669, 162,446 to 386,269, 29.6 percent.
- edit:
    id: cal.1966-11-08.state-constitutions-nv
    base: a883f217
    set:
      c: Nevada. Question No. 1, an amendment of the constitution repealing its poll tax, carries, 90,241 to 13,614, 86.9 percent.
- edit:
    id: cal.1966-11-08.governors-ak
    base: 371df064
    set:
      c: Alaska. Hickel (R) governor over Egan (D), governor since statehood, 33,145 to 32,065, 50.0 percent, a 1,080-vote margin; Grasse 1,084, 1.6 percent.
- edit:
    id: cal.1966-11-08.state-constitutions-nj
    base: 261ea641
    set:
      c: 'New Jersey. The Constitutional Convention of 1966''s article on the representation of the people in the Legislature approved, 890,710 to 506,884, 63.7 percent: both houses by population; districts drawn by an Apportionment Commission of the two parties (Check the terms).'
- edit:
    id: cal.1966-11-08.governors-md
    base: 466e5759
    set:
      c: Maryland. Agnew (R), Baltimore County executive, governor over Mahoney (D), 455,318 to 373,543, 49.5 percent; Pressman, Baltimore's comptroller, an independent, 90,899, 9.9 percent. Agnew carries Baltimore City, 114,262 to 90,352, 55.8 percent of the two.
      n: '*Maryland Manual*, 1967–68, [p. 503](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--503.html). The total: [Wikipedia, "1966 Maryland gubernatorial election"](https://en.wikipedia.org/wiki/1966_Maryland_gubernatorial_election). To check: [[w.witcover-white-knight]]; [[w.coffey-spiro-agnew-and-the]]; [[w.durr-behind-the-backlash]]; [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-09-13.elections-1966]]. Names: Agnew, Mahoney, Pressman.'
- edit:
    id: cal.1966-11-08.state-constitutions-md
    base: 2be4b06b
    set:
      c: 'Maryland. Sixteen amendments, twelve ratified: intermediate courts of appeal, 296,940 to 123,227, 70.7 percent; a Commission on Judicial Disabilities; home rule for code counties; the Governor''s salary raised; the Land Office abolished. Rejected: the General Assembly to set its own pay, 137,201 to 277,917, 33.1 percent; a Workmen''s Compensation Commission; Baltimore City''s borrowing; Washington County''s deputy clerks. The act for a second Chesapeake Bay bridge rejected at referendum, 248,942 to 289,418, 46.2 percent.'
- edit:
