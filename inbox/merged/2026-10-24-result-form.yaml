ops:
- edit:
    id: cal.1960-01-09.governors-la
    base: 5f9d045d
    set:
      c: 'Louisiana''s Democratic runoff for governor: Davis, governor 1944–48, over Morrison, mayor of New Orleans, 487,681 to 414,110, 54.1 percent. First primary, Dec. 5: Morrison over Davis, 278,956 to 213,551, 33.1 percent; a segregationist State senator 143,095, 17.0 percent, who then endorses Davis. The runoff fought over Morrison''s Negro vote.'
- edit:
    id: cal.1960-02-16.alabama-al
    base: 218bdaf4
    set:
      c: Constitutional amendment election, nineteen amendments, most of them county taxes and fees. Amendment No. 1, $3,000,000 in State bonds for a mental hospital at the University of Alabama Medical Center, on the liquor and beer taxes, adopted, 131,916 to 18,021, 88.0 percent. Six county amendments refused.
- edit:
    id: cal.1960-03-08.elections-1960
    base: 400994e0
    set:
      c: 'New Hampshire primary. Republican: Nixon over Rockefeller (write-in), 65,204 to 2,745, 89.3 percent. Democratic: Kennedy over others, 43,372 to 7,527, 85.2 percent.'
      n: 'N.H. *Manual for the General Court*, no. 37 (1961), pp. [284](https://archive.org/details/manualforgeneral37newh/page/n313), [382](https://archive.org/details/manualforgeneral37newh/page/n413). CQ Guide 6th (2010) 404. To check: [[w.white-making-of-the-president]]. Names: Kennedy, Nixon, Nelson Rockefeller.'
- tag:
    id: cal.1960-03-08.elections-1960
    add:
    - name:rockefeller-nelson
- edit:
    id: cal.1960-03-08.specials
    base: 6a74be84
    set:
      c: New York 23d, special, in the Bronx. Jacob H. Gilbert (D) holds the seat over Koenig (R), 4,594 to 574, 82.3 percent.
      n: 'Shares: Wikipedia. Bibliography: [[cal.1961-04-04.states-and-cities]]. Votes: CQ Guide 6th (2010) 1264. Names: Gilbert.'
- edit:
    id: cal.1960-04-05.elections-1960
    base: 9116d76c
    set:
      c: 'Wisconsin primary. Republican: Nixon, unopposed. Democratic: Kennedy over Humphrey, 476,024 to 366,753, 56.5 percent.'
- edit:
    id: cal.1960-04-05.mayors-milwaukee
    base: b66711f5
    set:
      n: 'Share: Bethany Harding, ["Henry W. Maier"](https://emke.uwm.edu/entry/henry-w-maier/), *Encyclopedia of Milwaukee*; [Wikipedia, "Henry Maier"](https://en.wikipedia.org/wiki/Henry_Maier) (Check: the city''s official canvass). Check: the count. To check: [[w.maier-challenge-to-the-cities]]; [[w.thompson-history-of-wisconsin-volume]]; [[w.peirce-great-lakes-states-of]]. Names: Maier, Reuss.'
- edit:
    id: cal.1960-04-12.elections-1960
    base: '91761403'
    set:
      c: 'Illinois primary. Republican: Nixon over others (write-in), 782,849 to 442, 99.9 percent. Democratic: Kennedy (write-in) over Stevenson (write-in), 34,332 to 8,029, 64.6 percent.'
- edit:
    id: cal.1960-04-12.governors-il
    base: 6bdc53af
    set:
      c: 'Illinois, primaries for governor. Democratic: Kerner, a Cook County judge, slated by Daley''s organization, over Lohman, State treasurer, 649,253 to 232,345, 60.9 percent; Mitchell, once national chairman, 184,651, 17.3 percent. Republican: Stratton, seeking a third term, over Hayes Robertson, 499,365 to 345,340, 59.1 percent.'
      n: 'Votes: [Ill. *Official Vote*, 1960, p. 77](https://archive.org/details/officialvote1960illi/page/n78). Lohman''s, Mitchell''s and Robertson''s votes: [Wikipedia, "1960 Illinois gubernatorial election"](https://en.wikipedia.org/wiki/1960_Illinois_gubernatorial_election). To check: [[w.barnhart-kerner]]; [[w.kenney-political-passage]]; [[w.cohen-american-pharaoh]]. See [[cal.1960-04-12.elections-1960]]. Names: Kerner, Daley, Lohman, Mitchell, Stratton, Robertson.'
- edit:
    id: cal.1960-04-19.governors-la
    base: bad5603c
    set:
      c: 'Louisiana, general election for governor: Davis (D) over Grevemberg (R), a former superintendent of State police, 407,907 to 86,135, 80.5 percent; a States'' Rights candidate 12,515, 2.5 percent. The first Republican nominee for governor since 1952.'
      n: '[Wikipedia](https://en.wikipedia.org/wiki/1960_Louisiana_gubernatorial_election). Check: La. Secretary of State, *General Election Returns*, 1960. The shares computed from the article''s votes (it prints 81.52 for Davis). See [[cal.1960-01-09.governors-la]]. Names: Jimmie Davis, Grevemberg.'
- edit:
    id: cal.1960-05-03.governors-fl
    base: 8b226a5b
    set:
      c: Florida's Democratic primary for governor. Bryant, a former State representative, over Carlton, a State senator, 193,507 to 186,228, 20.7 percent; Burns, mayor of Jacksonville, 166,352, 17.8 percent; seven others. Runoff between Bryant and Carlton.
- edit:
    id: cal.1960-05-07.governors-tx
    base: d057fb39
    set:
      c: Texas Democratic primary. Governor Daniel renominated for a third term over Jack Cox, a former State representative, 908,992 to 619,834, 59.5 percent.
- edit:
    id: cal.1960-05-10.governors-nm
    base: ed9eb362
    set:
      c: 'New Mexico''s primary, for governor. Democratic: Governor Burroughs over Bursey, 66,541 to 48,841, 53.8 percent. Republican: Mechem, governor 1951–55 and 1957–59, over Robinson, 29,486 to 9,331, 76.0 percent.'
- edit:
    id: cal.1960-05-10.governors-wv
    base: defb81b3
    set:
      c: 'West Virginia primaries for governor. Democratic: Barron, the attorney general, over Hulett Smith, 187,501 to 140,079, 51.0 percent; a third 39,907, 10.9 percent. Republican: Harold E. Neely over Revercomb, a former U.S. Senator, 102,618 to 83,028, 55.3 percent. Kennedy carries the presidential primary the same day.'
- edit:
    id: cal.1960-05-10.governors-ne
    base: cf992a99
    set:
      c: 'Nebraska, governor; the governor running for the Senate. Democratic primary: Morrison over Conrad, 51,335 to 44,486, 48.0 percent; three others 11,167, 10.4 percent. Republican: Cooper over Abel, 61,286 to 39,109, 37.7 percent; Carpenter 25,659, 15.8 percent; four others 36,342, 22.4 percent.'
      n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1960*](https://govdocs.nebraska.gov/epubs/S1200/S001-1960prim_gen.pdf); Democratic figures from [Wikipedia, "1960 Nebraska gubernatorial election"](https://en.wikipedia.org/wiki/1960_Nebraska_gubernatorial_election). Republican votes: the same article''s table, from the Board''s report. To check: [[w.peirce-great-plains-states-of]]. Names: Frank Morrison, Robert Conrad, John R. Cooper, Hazel Abel, Carpenter.'
- edit:
    id: cal.1960-05-17.elections-1960
    base: e619ebb7
    set:
      c: 'Maryland primary. Republican: no primary. Democratic: Kennedy over Morse, 201,769 to 49,420, 70.3 percent.'
- edit:
    id: cal.1960-05-20.elections-1960
    base: 050d2a77
    set:
      c: 'Oregon primary. Republican: Nixon over Rockefeller (write-in), 211,276 to 9,307, 93.1 percent. Democratic: Kennedy over Morse, 146,332 to 91,715, 51.0 percent.'
- edit:
    id: cal.1960-05-24.governors-fl
    base: 152886b3
    set:
      c: 'Florida''s Democratic runoff for governor: Bryant over Carlton, 512,757 to 416,052, 55.2 percent.'
      n: '[Fla. *Tabulation of Official Vote, Florida Primary Elections*, 1960, 13](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1960/page/n12). Votes: [Wikipedia, "1960 Florida gubernatorial election"](https://en.wikipedia.org/wiki/1960_Florida_gubernatorial_election). See [[cal.1960-05-03.governors-fl]]. Names: Bryant, Carlton.'
- edit:
    id: cal.1960-05-28.governors-nc
    base: 5c7d337e
    set:
      c: 'North Carolina, Democratic primary for governor: Sanford, a former State senator, over Lake, a law professor, for keeping the schools segregated, 269,463 to 181,692, 41.3 percent; Seawell 101,148, 15.5 percent; Larkins 100,757, 15.4 percent. A runoff.'
- edit:
    id: cal.1960-06-06.governors-ia
    base: d15c86f9
    set:
      c: 'Iowa, governor; Loveless running for the Senate. Republican primary: Erbe, the attorney general, over Schroeder, 81,869 to 75,599, 36.3 percent; Nicholas 68,037, 30.2 percent. Democratic: Lieutenant Governor McManus over Hughes, of the Commerce Commission, 74,990 to 46,542, 61.7 percent.'
      n: '[*Summary of Official Canvass of Votes Cast in Iowa Primary Election, June 6, 1960*](https://sos.iowa.gov/elections/pdf/results/60s/1960primcanv.pdf); figures for Schroeder, Nicholas and Hughes from [Wikipedia, "1960 Iowa gubernatorial election"](https://en.wikipedia.org/wiki/1960_Iowa_gubernatorial_election) (the canvass''s scan illegible there). Erbe''s and McManus''s votes: the same article. To check: [[w.larew-party-reborn]]; [[w.hughes-man-from-ida-grove]]. Names: Erbe, Loveless, Harold Hughes, Jack Schroeder, Nicholas, McManus.'
- edit:
    id: cal.1960-06-07.governors-mt
    base: e71d12be
    set:
      c: 'Montana''s primary, for governor. Republican: Nutter, once the Republican State chairman, over D''Ewart, once U.S. Representative, 33,099 to 32,538, 50.4 percent, a 561-vote margin. Democratic: Cannon over Toole, 44,690 to 40,537, 34.9 percent; Kuchera 33,216, 25.9 percent.'
- edit:
    id: cal.1960-06-25.specials
    base: aaf1a857
    set:
      c: North Carolina 12th, special. Roy A. Taylor (D) to Hall's seat over Rollman (R), on write-ins, 28,744 to 416, 98.6 percent.
      n: '[N.C. *Manual*, 1961, p. 246](https://archive.org/details/northcarolinaman1961nort/page/n259). Shares: Wikipedia. Votes: the Manual, 246. See [[cal.1960-03-08.specials]]. Names: Taylor.'
- edit:
    id: cal.1960-06-25.governors-nc
    base: 2f4dbf6b
    set:
      c: 'North Carolina, Democratic runoff for governor: Sanford over Lake, 352,133 to 275,905, 56.1 percent.'
- edit:
    id: cal.1960-06-28.specials
    base: cf978381
    set:
      c: North Dakota, Senate, special, for Langer's seat. Burdick (D) over Governor John E. Davis (R), 104,593 to 103,475, 49.7 percent, a 1,118-vote margin.
- edit:
    id: cal.1960-06-28.governors-nd
    base: e10d1ae9
    set:
      c: 'North Dakota, governor. Republican primary: Lieutenant Governor Dahl over one other, 86,900 to 25,132, 77.6 percent. Guy the Democratic nominee unopposed.'
      n: '[*Official Abstract of Votes Cast at the Primary Election Held June 28, 1960*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1960-06028-primary.pdf). Votes: [Wikipedia, "1960 North Dakota gubernatorial election"](https://en.wikipedia.org/wiki/1960_North_Dakota_gubernatorial_election). To check: [[w.peirce-great-plains-states-of]]. Names: Guy, Dahl.'
- edit:
    id: cal.1960-06-28.state-constitutions-nd
    base: c7fe253c
    set:
      c: North Dakota, with the primary, approves an amendment reapportioning the House, 84,002 to 66,529, 55.8 percent; also a Department of Labor, 82,114 to 79,112, 50.9 percent, and the State's mineral rights reserved in school lands sold, 84,348 to 72,088, 53.9 percent.
- edit:
    id: cal.1960-07-05.state-constitutions-ok
    base: faca94c3
    set:
      c: Oklahoma, with the primary, votes on three amendments. Presidential electors may be nominated at party conventions, adopted, 220,575 to 172,219, 56.2 percent. Legislators' pay of $200 a month refused, 156,723 to 236,438, 39.9 percent. A county levy for health departments adopted, 201,218 to 193,497, 51.0 percent.
- edit:
    id: cal.1960-07-26.state-constitutions-ok
    base: 578b740d
    set:
      c: Oklahoma, with the runoff primary, adopts two amendments. A State Industrial Finance Authority, with up to $10 million in bonds for loans to local development agencies, 128,850 to 101,875, 55.8 percent. A county library levy, 114,294 to 113,671, 50.1 percent.
- edit:
    id: cal.1960-07-26.governors-ar
    base: e3c495b1
    set:
      c: 'Arkansas, Democratic primary for governor: Faubus, for a fourth term, over Joe Hardin, 238,997 to 66,499, 58.7 percent; Bruce Bennett 58,400, 14.4 percent; two others. No runoff.'
- edit:
    id: cal.1960-08-02.governors-mi
    base: 425d28f6
    set:
      c: 'Michigan, Democratic primary for governor, Williams retiring after six terms: Swainson, lieutenant governor, over Hare, secretary of state, 274,743 to 205,086, 50.8 percent; a Detroit councilman 60,895, 11.3 percent. The Republican nominee of 1958 again, unopposed.'
- edit:
    id: cal.1960-08-02.governors-mo
    base: 54adb475
    set:
      c: 'Missouri, governor. Democratic primary: Dalton, the attorney general, over four others, 466,984 to 73,533, 86.4 percent. Republican: Farmer over two others, 107,637 to 91,341, 54.1 percent.'
- edit:
    id: cal.1960-08-02.governors-ks
    base: e57269ca
    set:
      c: 'Kansas, governor. Republican primary: Anderson, the attorney general, over Boyd, 128,081 to 116,725, 48.7 percent; one other 18,169, 6.9 percent. Governor Docking renominated, unopposed.'
- edit:
    id: cal.1960-09-13.governors-wa
    base: 9028fe36
    set:
      c: 'Washington''s blanket primary, for governor: Andrews (R), the lieutenant governor, over Governor Rosellini (D), 263,897 to 244,579, 37.4 percent; Newman Clark (R) 144,440, 20.5 percent. Andrews and Rosellini nominated.'
- edit:
    id: cal.1960-09-13.governors-ut
    base: d7985388
    set:
      c: 'Utah''s primary, for governor. Republican: Governor Clyde over Gunderson, 50,592 to 37,002, 57.8 percent. Democratic: Barlocker over Huggins, 74,424 to 31,045, 70.6 percent.'
- edit:
    id: cal.1960-09-13.governors-mn
    base: d5befd22
    set:
      c: 'Minnesota, governor. DFL primary: Governor Freeman over one other, 264,571 to 33,452, 88.8 percent. Republican: Andersen, a former State Senator, unopposed.'
      n: '[*Report of the State Canvassing Board, Primary Election, September 13, 1960*](https://www.lrl.mn.gov/docs/2023/Other/232069/1960.pdf). Votes: [Wikipedia, "1960 Minnesota gubernatorial election"](https://en.wikipedia.org/wiki/1960_Minnesota_gubernatorial_election). To check: [[w.andersen-mans-reach]]; [[w.peirce-great-plains-states-of]]. Names: Freeman, Andersen.'
- edit:
    id: cal.1960-09-13.governors-ma
    base: 27c9d512
    set:
      c: 'Massachusetts primary. Democratic, for governor: Ward, Secretary of the Commonwealth, over Peabody, 180,848 to 152,762, 30.2 percent; Attorney General Kelly 98,107, 16.4 percent; four others. Furcolo, the governor, runs for the Senate. Volpe unopposed for the Republican nomination after the party''s convention.'
- edit:
    id: cal.1960-09-13.governors-nh
    base: 48a93eee
    set:
      c: New Hampshire's Republican primary for governor. Powell, the governor, over Gregg, governor 1953–55, 49,119 to 48,108, 49.9 percent, a 1,011-vote margin. Boutin the Democrat.
- edit:
    id: cal.1960-09-13.governors-vt
    base: 65d8c278
    set:
      c: Vermont's Republican primary for governor, Stafford not running. Keyser, Speaker of the Vermont House, over Babcock, 17,491 to 16,762, 29.6 percent; Crispe 14,874, 25.2 percent; Simpson 9,916, 16.8 percent. Keyser elected in November over Niquette (D), 92,861 to 71,755, 56.4 percent.
- edit:
    id: cal.1960-09-20.state-constitutions-ok
    base: fb414514
    set:
      c: Oklahoma, special election; three initiatives refused. Apportionment of the Legislature by a commission of the Attorney General, Treasurer and Secretary of State, with forty-eight Senate districts of near-equal population, 189,348 to 347,180, 35.3 percent. A constitutional State Highway Commission, 186,176 to 351,774, 34.6 percent; county roads to the State at each county's choice, 183,173 to 353,446, 34.1 percent.
- edit:
    id: cal.1960-09-28.governors-ri
    base: d5f11934
    set:
      c: Rhode Island's Democratic primary for governor. Notte, the lieutenant governor, over Cote, 73,607 to 57,200, 56.3 percent.
- edit:
    id: cal.1960-11-08.elections-1960
    base: c207b37d
    set:
      c: Kennedy and Johnson over Nixon and Lodge, 34,227,096 to 34,108,546, 49.7 percent of the popular vote, a 118,550-vote margin, Alabama's Democratic slate counted with Kennedy. Closest States Hawaii, Illinois, Missouri, California, New Mexico, New Jersey; Mississippi to its unpledged electors. Republicans gain 21 House seats and 2 in the Senate; Johnson re-elected to the Senate from Texas the same day. Nixon concedes Nov. 9.
      n: 'Returns: [Clerk of the House, *Statistics of the Presidential and Congressional Election of 1960*](https://clerk.house.gov/member_info/electionInfo/1960election.pdf). Telegrams of Congratulations to the President- and Vice President-Elect, [1960–61 Pub. Papers 857](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=909); [Remarks in Hyannis, Massachusetts Accepting Election as the 35th President of the United States](https://www.presidency.ucsb.edu/documents/remarks-hyannis-massachusetts-accepting-election-the-35th-president-the-united-states) (Nov. 9), Nixon''s telegram quoted. The national figures: the Clerk''s State figures, added (Elections, 1960). To check: [[w.white-making-of-the-president]]; [[w.kallina-kennedy-v-nixon]]; [[w.rorabaugh-real-making-of-the]]; [[w.donaldson-first-modern-campaign]]; [[w.pietrusza-1960]]; [[w.matthews-kennedy-and-nixon]]; [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.converse-stability-and-change-in]]; [[w.pool-candidates-issues-and-strategies]]; [[w.nixon-six-crises]]; [[w.gellman-president-and-the-apprentice]]. Names: Kennedy, Johnson, Lodge, Nixon.'
- edit:
    id: cal.1960-11-08.mississippi-ms
    base: 64ce2b8f
    set:
      c: 'Mississippi. The unpledged Democratic electors over the Democratic electors pledged to Kennedy, 116,248 to 108,362, 39.0 percent; Nixon 73,561, 24.7 percent. The eight unpledged electors to vote for Byrd. The same day, Section 241-A ratified: an applicant for registration to be of "good moral character."'
- edit:
    id: cal.1960-11-08.governors-il
    base: e3b0ccaf
    set:
      c: Illinois. Kerner (D) over Stratton (R), 2,594,731 to 2,070,479, 55.5 percent; Kennedy carries the State, 2,377,846 to 2,368,988, 50.0 percent, an 8,858-vote margin. Cook County. Ward (D) over State's Attorney Adamowski (R).
      n: 'Votes: [Ill. *Official Vote*, 1960, p. 16](https://archive.org/details/officialvote1960illi/page/n17); the State''s Attorney''s race is the county''s, not in the volume. The presidential vote: the Clerk''s *Statistics*, 1960 (Elections, 1960). To check: [[w.barnhart-kerner]]; [[w.kenney-political-passage]]; [[w.kallina-courthouse-over-white-house]]; [[w.peirce-megastates-of-america]]. See [[cal.1960-04-12.governors-il]]; [[cal.1960-11-08.elections-1960]]. Names: Kerner, Stratton, Adamowski, Kennedy, Ward.'
- edit:
    id: cal.1960-11-08.state-constitutions-mi
    base: f1cdb054
    set:
      c: 'Michigan. Proposal 3, an amendment changing the way a constitutional convention is called, adopted, 1,312,215 to 959,527, 57.8 percent: the question to go to the voters in April 1961, a majority of those voting on it to carry it. Also adopted, Proposal 2, raising the sales tax limit, 1,250,264 to 1,230,001, 50.4 percent.'
- edit:
    id: cal.1960-11-08.state-constitutions-tx
    base: 695fbc06
    set:
      c: Texas adopts four amendments. Legislators' pay up to $4,800 a year and $12 a day for the first 120 days of a session, regular sessions limited to 140 days, 763,531 to 604,087, 55.8 percent. The Legislature to regulate lenders and interest, 10 percent the ceiling where it sets none, 1,088,993 to 369,132, 74.7 percent. A hospital district; Veterans' Land Board bonds at up to 3.5 percent.
- edit:
    id: cal.1960-11-08.state-constitutions-ok
    base: 0fa20188
    set:
      c: Oklahoma. By referendum petition, the voters reject the act for withholding of State income tax from wages, 246,157 to 450,015, 35.4 percent. An amendment letting the Legislature call itself into special session refused, 320,915 to 382,952, 45.6 percent.
- edit:
    id: cal.1960-11-08.governors-nm
    base: 16ea3e5f
    set:
      c: New Mexico. Mechem (R) governor over Burroughs (D), 153,765 to 151,777, 50.3 percent, a 1,988-vote margin; Bolack (R) lieutenant governor, a 279-vote margin, as Kennedy carries the State.
      n: 'Votes: [Wikipedia, "1960 New Mexico gubernatorial election"](https://en.wikipedia.org/wiki/1960_New_Mexico_gubernatorial_election); [Wikipedia, "Tom Bolack"](https://en.wikipedia.org/wiki/Tom_Bolack); Check: N.M., *Canvass of Returns of General Election Held November 8, 1960*. Check: Bolack''s count and percentage. To check: [[w.peirce-mountain-states-of-america]]. See [[cal.1960-05-10.governors-nm]]; [[cal.1960-11-08.elections-1960]]. Names: Mechem, Burroughs, Bolack, Kennedy.'
- edit:
    id: cal.1960-11-08.state-constitutions-md
    base: 3e8efe9d
    set:
      c: 'Maryland. Fifteen amendments, all ratified: counties and towns other than Baltimore may be empowered to clear slum areas by urban renewal, 327,178 to 100,527, 76.5 percent; a Municipal Court for Baltimore City; succession to the governorship; bills vetoed after the session no longer returned to the next; land in farming assessed as farmland. The Potomac River Compact approved at referendum, 244,510 to 204,837, 54.4 percent.'
- edit:
    id: cal.1960-11-08.state-constitutions-ca
    base: 370d4b81
    set:
      c: 'California. Proposition 1, the Water Resources Development Bond Act of 1959 (Burns–Porter), carries, 3,008,328 to 2,834,384, 51.5 percent: $1.75 billion in bonds for the State Water Project, Feather River water to the San Joaquin Valley and Southern California.'
- edit:
    id: cal.1960-11-08.legislatures-ca
    base: 040a3d67
    set:
      c: California. Proposition 15, an initiative to redraw the State Senate's forty districts, no county more than seven, twenty given to named counties, every senator elected in 1962, fails, 1,876,185 to 3,408,090, 35.5 percent. The Senate stays on the "federal plan" of 1926, Los Angeles County's six million with one senator.
- edit:
    id: cal.1960-12-28.elections-1960
    base: '73723640'
    set:
      c: 'Hawaii''s recount, ordered by Judge Jamieson, ends: Kennedy over Nixon, 92,410 to 92,295, 50.0 percent, a 115-vote margin, where the first count gave Nixon 141. Jamieson declares the Kennedy electors appointed, Dec. 30.'
      n: 'Haw. *Result of Votes Cast, General Election*, Nov. 8, 1960, ["Result of Recount"](https://archive.org/download/HI-hist/1960_General.pdf#page=23), [totals](https://archive.org/download/HI-hist/1960_General.pdf#page=28). Votes: the Clerk''s *Statistics*, 1960 (Elections, 1960). See [[cal.1960-11-08.elections-1960]]. Names: Kennedy, Nixon, Jamieson.'
- edit:
    id: cal.1961-04-04.mayors-los-angeles
    base: 7b96700a
    set:
      c: 'Los Angeles, nonpartisan primary for mayor: Poulson, mayor since 1953, over Yorty, once a U.S. Representative, 179,273 to 122,478, 39.7 percent; Councilman McGee 115,635, 25.6 percent; six others. Poulson and Yorty to a runoff, May 31.'
- edit:
    id: cal.1961-04-18.specials
    base: 37f1cc70
    set:
      c: 'Arkansas 6th, special. Catherine Dorris Norrell to her husband''s seat over the runner-up, 10,209 to 5,955, 43.1 percent, five Democrats running. No swing: Norrell unopposed in 1960.'
      n: 'Shares: Wikipedia. Check the date: April 18 or 19. Votes: CQ Guide 6th (2010) 1266. See [[cal.1961-04-04.states-and-cities]]. Names: Norrell.'
- edit:
    id: cal.1961-04-18.governors-nj
    base: 456f2444
    set:
      c: 'New Jersey primaries for governor. Democratic: Hughes, the county leaders'' choice since Feb. 13, over two others, 222,789 to 41,772, 84.2 percent. Republican: Mitchell, Eisenhower''s Secretary of Labor, in since Jan. 14 with Case''s backing, over Walter H. Jones, State senator, the county organizations'' candidate, 202,188 to 160,553, 43.7 percent; Dumont, State senator, 95,761, 20.7 percent.'
- edit:
    id: cal.1961-05-16.specials
    base: 38580fcf
    set:
      c: Pennsylvania 16th, special. Kunkel (R) holds Mumma's seat over the Democrat, 43,220 to 22,698, 65.6 percent. Swing 3.1 to R.
      n: '[*Pa. Manual*, 1961–62, p. 714](https://babel.hathitrust.org/cgi/pt?id=uiug.30112053623135&seq=722). Shares: Wikipedia. Votes: the *Manual*, 714. See [[cal.1961-04-04.states-and-cities]]. Names: Kunkel.'
- edit:
    id: cal.1961-05-16.specials-2
