    base: f1d91be5
    set:
      c: Massachusetts. The sales tax of 1966, 3 percent on retail sales, food, clothing and prescription medicines exempt, with a use tax and a Local Aid Fund for the cities and towns, in force since Apr. 1 and to run through 1967, put to the voters. Question 5, the law on referendum, 1,391,100 to 358,879, 79.5 percent. Question 6, the act by its title, 1,070,599 to 446,460, 70.6 percent.
- edit:
    id: cal.1966-11-08.legislatures-wa
    base: 71b43303
    set:
      c: Washington. Referendum Bill 16, the legislature's act redrawing the first, second, third, fourth, sixth and seventh congressional districts, approved, 416,630 to 384,466, 52.0 percent.
