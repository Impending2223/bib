      n: '[*Official Montana General Election Returns, November 5, 1968*](https://archive.org/details/officialmontanag1968montrich/page/n1). The third candidate''s count: [Wikipedia, "1968 Montana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Montana_gubernatorial_election). To check: [[w.malone-montana]]. See [[cal.1968-06-04.governors-mt]]. Names: Anderson, Babcock.'
