- edit:
    id: cal.1967-11-04.governors-la
    base: 00c21a8b
    set:
      c: 'Louisiana''s Democratic primary. McKeithen, the first governor the constitution lets succeed himself (the amendment of 1966), renominated over U.S. Representative Rarick, 836,304 to 179,846, 80.6 percent; three others. No Republican files; the general election, Feb. 6, 1968, uncontested. Morial, a New Orleans lawyer, wins a House seat from Uptown in the primaries of 1967, the first Negro in the legislature since Reconstruction (Check: the round).'
- edit:
    id: cal.1967-11-07.mayors-philadelphia
    base: f0d7c06c
