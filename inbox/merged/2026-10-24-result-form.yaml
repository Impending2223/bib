      n: '[Ky. *Statement of the Official Vote*, Democratic primary, May 23, 1967](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf#page=1); [Republican](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf#page=2). [[w.harrison-new-history-of-kentucky]], 413. The totals: [Wikipedia, "1967 Kentucky gubernatorial election"](https://en.wikipedia.org/wiki/1967_Kentucky_gubernatorial_election). To check: [[w.peirce-border-south-states]]. Names: Ward, Chandler, Waterfield, Nunn, Cook.'
- edit:
    id: cal.1967-07-11.state-constitutions-ok
    base: 21bfeeef
    set:
      c: 'Oklahoma, special election, after the bribery of the Supreme Court: a new judicial article, the justices of the peace abolished, judges elected without party, 90,167 to 73,919, 55.0 percent; the justices of the Supreme Court and the Court of Criminal Appeals chosen from a Judicial Nominating Commission''s names and kept by retention votes, 86,183 to 79,280, 52.1 percent.'
- edit:
