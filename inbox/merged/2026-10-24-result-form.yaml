    base: 6cd1d46b
    set:
      c: 'California. Proposition 16, the CLEAN initiative on obscenity, fails, 2,533,921 to 3,271,308, 43.6 percent: "obscene" and "knowingly" redefined, the seizure of obscene matter allowed, a prosecutor who will not enforce the law compellable.'
- edit:
    id: cal.1966-11-08.voting-rights-ca
    base: 1f522ad6
    set:
      c: California. Proposition 15, to exempt from the State's English literacy requirement for voting anyone fifty or older on June 27, 1952, and resident in the United States twenty years, fails, 2,334,084 to 2,986,829, 43.9 percent.
- edit:
    id: cal.1966-11-08.state-constitutions-ky
    base: 58a87819
    set:
      c: Kentucky's voters reject the new constitution drafted by the Constitution Revision Assembly and submitted by the General Assembly (S.B. 161), 143,133 to 517,034, 21.7 percent; Breathitt had backed it. The constitution of 1891 stands.
- edit:
    id: cal.1966-11-08.state-constitutions-mo
    base: 5ba2bf58
    set:
      c: Missouri adopts an amendment letting St. Louis city and county adopt a plan for the government of all or part of both, by a board of freeholders, 360,877 to 357,128, 50.3 percent, a 3,749-vote margin. The city 57,354 to 34,050, 62.7 percent; the county 96,493 to 97,355, 49.8 percent.
- edit:
    id: cal.1966-11-08.state-constitutions-ne
    base: 19439e43
    set:
      c: 'Nebraska, referendum and initiative. L.B. 797, the 1965 legislature''s income tax, rejected, 133,594 to 310,681, 30.1 percent. An initiative forbidding a State property tax adopted, 223,969 to 216,093, 50.9 percent. Amendments: transportation for children attending any school, public or private, refused, 191,986 to 253,945, 43.1 percent; a governor limited to two four-year terms, adopted, 258,332 to 150,405, 63.2 percent.'
- edit:
