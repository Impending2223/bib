- edit:
    id: cal.1964-09-04.latin-america
    base: 64b333e2
    set:
      n: '[FRUS 1964–68, XXXI, docs. 269](https://history.state.gov/historicaldocuments/frus1964-68v31/d269), [270](https://history.state.gov/historicaldocuments/frus1964-68v31/d270). The President''s News Conference, [1963–64 Pub. Papers 1040](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=280) (Sept. 5, 1964). S. Select Comm. to Study Governmental Operations with Respect to Intelligence Activities, *Covert Action in Chile, 1963–1973*, 94th Cong. (Comm. Print 1975). Check: the counts, and the shares to one decimal. To check: [[w.rabe-killing-zone]]. Names: Frei Montalva, Allende Gossens, Johnson.'
- edit:
