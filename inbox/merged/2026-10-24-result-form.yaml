    set:
      c: 'Texas Democratic runoff for governor: Smith over Yarborough, 767,490 to 621,226, 55.3 percent. Smith second in the first primary. Nov. 5, Smith over Eggers (R), 1,662,019 to 1,254,333, 57.0 percent.'
