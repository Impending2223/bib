      n: '[*Official Vote of the State of Illinois Cast at the General Election, November 5, 1968 ... General Primary, June 11, 1968*](https://www.elections.il.gov/DocDisplay.aspx?doc=Downloads/ElectionOperations/VoteTotals/Archived/1968/1968%20GE%20and%20PE.PDF#page=90), PDF p. 90. Stratton''s count and the other''s: [Wikipedia, "1968 Illinois gubernatorial election"](https://en.wikipedia.org/wiki/1968_Illinois_gubernatorial_election). To check: [[w.peirce-great-lakes-states-of]]; [[w.kenney-political-passage]]. See [[cal.1968-05-21.governors-il]]. Names: Ogilvie, Altorfer, Stratton, Shapiro.'
- edit:
