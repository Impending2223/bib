      n: 'Votes: CQ Guide 6th (2010) 1286. Check: the Texas Secretary of State''s returns. To check: [[w.davidson-race-and-class-in]]. See [[cal.1968-03-12.specials]]. Names: Collins, Joe Pool, Elizabeth Pool.'
- edit:
    id: cal.1968-08-27.elections-1968-ak
    base: 3519a3f2
    set:
      c: 'Alaska''s primary, every party on one ballot. Democratic, for the Senate: Gravel, once Speaker of the State House, over Gruening, Senator since statehood, 17,971 to 16,015, 52.9 percent. Republican: Rasmuson, an Anchorage banker, over Stevens, 10,320 to 9,111, 53.1 percent.'
- edit:
    id: cal.1968-08-27.state-constitutions-ok
    base: e82dfcf6
    set:
      c: 'Oklahoma, with the primary, Aug. 27, adopts six amendments: intangible personal property no longer taxed, 329,848 to 92,710, 78.1 percent; appropriations held to the Board of Equalization''s estimate of revenues; a Board of Legislative Compensation to fix the legislators'' pay, 201,107 to 177,672, 53.1 percent. Two refused, a new Pardon and Parole Board among them, 182,742 to 197,219, 48.1 percent. With the runoff, Sept. 17: the initiative''s new judicial article rejected, 115,771 to 172,711, 40.1 percent; six-member juries for misdemeanors, 170,854 to 97,736, 63.6 percent, and four others adopted.'
- edit:
    id: cal.1968-09-03.governors-ia
    base: f7f9049c
    set:
      c: 'Iowa, governor; Hughes running for the Senate. Republican primary: Ray, once State chairman, over Donald E. Johnson, once national commander of the American Legion, 108,744 to 77,716, 43.2 percent; Beck 65,439, 26.0 percent. Democratic: Franzenburg, the State treasurer, unopposed.'
- edit:
    id: cal.1968-09-03.governors-nd
    base: c57c8706
    set:
      c: 'North Dakota, Republican primary for governor: McCarney, a candidate in 1964, over Doherty, 47,324 to 42,845, 52.5 percent. Governor Guy unopposed for a fourth term; re-elected in November over McCarney, 135,955 to 108,382, 54.8 percent.'
      n: '[*Official Abstract of Votes Cast at the Primary Election Held September 3, 1968*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1968-09-03-primary.pdf) (State Board of Canvassers, Sept. 17, 1968). Doherty''s name and the November figures: [Wikipedia, "1968 North Dakota gubernatorial election"](https://en.wikipedia.org/wiki/1968_North_Dakota_gubernatorial_election). To check: [[w.peirce-great-plains-states-of]]. See [[cal.1964-06-30.governors-nd]]. Names: McCarney, Guy.'
- edit:
    id: cal.1968-09-10.governors-wi
    base: 49d80cc4
    set:
      c: 'Wisconsin, Democratic primary for governor: La Follette, the attorney general, grandson of the Progressive, over Wille, 173,458 to 31,778, 84.5 percent. Governor Knowles unopposed for a third term; re-elected in November over La Follette, 893,463 to 791,100, 52.9 percent.'
- edit:
    id: cal.1968-09-10.governors-nh
    base: 3d630396
    set:
      c: 'New Hampshire''s primaries for governor; King running for the Senate. Republican: Peterson, Speaker of the House, over Wesley Powell, governor 1959–63, 29,262 to 26,498, 34.1 percent; Thomson 25,275, 29.5 percent; four others. Democratic: Bussiere, of Manchester, over Sullivan, 12,021 to 10,895, 32.7 percent; three others. Peterson elected in November over Bussiere, 149,902 to 135,378, 52.5 percent.'
- edit:
