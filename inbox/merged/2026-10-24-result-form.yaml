    set:
      c: Michigan 9th, special. Vander Jagt (R) holds Griffin's seat over Dongvillo (D), 91,056 to 45,699, 66.6 percent; the same day, the full term. Griffin resigned May 10, appointed to the Senate on Patrick McNamara's death; elected to it the same day. Swing 9.2 to R.
- edit:
    id: cal.1966-11-08.alabama-al
    base: 08648cb6
    set:
      c: 'Alabama. Lurleen Wallace (D) elected governor over U.S. Representative James D. Martin (R), 537,505 to 262,943, 63.4 percent; an independent 47,655, 5.6 percent. Sparkman (D) re-elected to the Senate over John Grenier (R), 482,138 to 313,018, 60.1 percent. Dallas County: Baker elected sheriff.'
- edit:
    id: cal.1966-11-08.governors-ny
    base: 2cd94d5a
