- edit:
    id: cal.1967-11-07.state-constitutions-ny
    base: ae8da714
    set:
      c: New York's voters reject the convention's constitution, 1,327,999 to 3,487,513, 27.6 percent. They approve Rockefeller's transportation bond issue, $2.5 billion (Check the vote).
- edit:
    id: cal.1967-11-07.governors
    base: 4eeda590
    set:
      c: 'Two governors elected. Kentucky: Nunn (R) over Ward (D), 454,123 to 425,674, 51.2 percent, the State''s first Republican governor since 1943; a Republican gain. Mississippi: John Bell Williams (D) over Phillips (R), 315,318 to 133,379, 70.3 percent. Governorships after the election: Republicans 26, Democrats 24.'
- edit:
    id: cal.1967-11-07.governors-ky
    base: fad60c81
    set:
      c: Kentucky. Nunn (R) elected governor over Ward (D), 454,123 to 425,674, 51.2 percent; a third candidate 7,149, 0.8 percent. The first Republican governor elected since 1943. Chandler had endorsed Nunn. The Democrats keep the lieutenant governorship and the General Assembly.
- edit:
    id: cal.1967-11-07.mayors-san-francisco
    base: f523b77e
    set:
      c: San Francisco. Alioto elected mayor over Dobbs, 110,405 to 94,504, 44.2 percent; Jack Morrison of the Board of Supervisors 40,438, 16.2 percent; fifteen others. Alioto entered after McAteer, the leading candidate, died in May; Shelley withdrew.
- edit:
    id: cal.1967-11-11.state-constitutions-tx
    base: 653a6699
    set:
      c: 'Texas adopts six amendments: the Veterans'' Land Fund''s bonds raised to $400 million, 58.7 percent; a Texas Park Development Fund and its bonds, 54.7 percent; counties to pay medical expenses of officers hurt on duty, 65.4 percent; counties to put their taxes in one general fund, 50.3 percent; and two others.'
      n: 'Texas Legislative Council, [*Amendments to the Texas Constitution Since 1876*](https://tlc.texas.gov/docs/amendments/Constamend1876.pdf) (2026), art. 3, §§ 49-b, 49-e, 52e; art. 8, § 9; art. 9, § 13; art. 16, § 33. Check: the Secretary of State''s canvass. Check: the counts. To check: [[w.reston-lone-star]]. See [[cal.1966-11-08.state-constitutions-tx]].'
- edit:
    id: cal.1967-11.mayors-baltimore
    base: 68ac9855
    set:
      c: 'Baltimore. Thomas D''Alesandro III, president of the City Council, son of the mayor of 1947–59, elected mayor over Arthur W. Sherwood (R), 138,938 to 28,528, 83.0 percent, carrying every precinct. McKeldin (R) not running. Democratic primary: D''Alesandro over Angelos, once a councilman, 91,965 to 30,641, 75.0 percent. Sworn Dec. 5.'
- edit:
    id: cal.1967-12-12.specials
    base: 5b8189e6
    set:
      c: 'California 11th, special run-off. McCloskey (R), a lawyer of Portola Valley who ran against the war, takes the seat of Younger (R), who died June 20, over Archibald (D), 66,385 to 44,319, 57.7 percent; Shirley Temple Black, write-in, 4,064, 3.5 percent. The special primary, Nov. 14: McCloskey over Black, 52,882 to 34,521, 34.4 percent; Draper (R) 19,566, 12.7 percent; Archibald 15,069, 9.8 percent; no majority.'
- edit:
    id: cal.1968-02-20.specials
    base: 4a1df390
    set:
