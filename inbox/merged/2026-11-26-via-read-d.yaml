patch: 2026-11-26-via-read-d
by: agent
ops:
# The Opus audit of Nov. 26, 2026 (notes/via-read/audit-d.md): its edits first, so that each applies to its base; then the readers' ops, corrected, and the audit's additive ops.
- edit:
    id: cal.1962-02-20.cuba
    base: 7d665884
    set:
      n: '[FRUS 1961–63, X, doc. 304](https://history.state.gov/historicaldocuments/frus1961-63v10/d304); [S. Rep. No. 94-465, 143 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=154) (the six phases; the revolt in October). [[w.schlesinger-robert-kennedy-and-his]], 477; [[w.paterson-contesting-castro]], 259–60 n.35 (Lansdale''s revolt, timed for October; "complete and efficient support of the military"). See [[cal.1961-11-30.cuba]]. Names: Lansdale.'
- edit:
    id: cal.1962-03-16.voting-rights
    base: c39d3389
    kind: correct
    set:
      n: '[108 Cong. Rec. 4409](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt4/pdf/GPO-CRECB-1962-pt4-1-1.pdf#page=69), [4410](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt4/pdf/GPO-CRECB-1962-pt4-1-1.pdf#page=70) (1962) (Mar. 16, 1962). [[w.mann-walls-of-jericho]], 320–21. The Record has Stennis on the tax "misunderstood" at 4409 and "Voting is a privilege" at 4410. See [[cal.1962-03-14.voting-rights]]. Names: Stennis.'
- edit:
    id: cal.1961-11-22.vietnam
    base: a59eade2
    set:
      n: '[NSAM No. 111](https://history.state.gov/historicaldocuments/frus1961-63v01/d272) (Viet. II.I.2). [[w.miller-misalliance]], 229–31 (no combat troops, the rest of the partnership endorsed; the reforms pressed on Diệm); FRUS 1961–63, I, doc. [257](https://history.state.gov/historicaldocuments/frus1961-63v01/d257) n. 2 (telegram 619 to Saigon, Nov. 15, summarized: the joint effort; telegram 618, no combat troops now). [[w.gibbons-u-s-government-and]], II, 99–100; [[w.marolda-united-states-navy-and]], 127 (NSAM 111, Nov. 22); [[w.moyar-triumph-forsaken]], 142–43; [[w.sorensen-kennedy]], 653–55 (no combat troops; the departments to be prepared for them; the mission expanded); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 273–74; [[w.taylor-swords-and-plowshares]], 248 (the NSAM, without the formal commitment); [[w.schlesinger-robert-kennedy-and-his]], 705 (Kennedy rejects combat units while accepting "another increase in military and economic assistance to Diem," insisting, by William Bundy, on "a stiffer and more quid pro quo political program"; "he absolutely declined in the National Security Action Memorandum of November 15 to make the total commitment"; not the helicopters, the airlift or the advisers with the units); [[w.mann-grand-delusion]], 251–52 (a week after the NSC meeting, NSAM 111: more helicopters and aircraft manned by U.S. uniformed personnel, air reconnaissance, air-ground support, the civil guard and self-defense corps, intelligence, economic aid; Diệm to "put the nation on a wartime footing"; the large infusion of troops Taylor, Rostow and McNamara urged not authorized; not airlift or "advisers with the units"); [[w.lich-su-khang-chien-chong-my]], III, 22 (NSAM 111, Nov. 22, 1961; the history gives Nov. 16 for the President''s approval of Taylor''s plan at III, 167). [[w.selverstone-kennedy-withdrawal]], 44, 47 (NSAM 111; no combat troops). Check: Taylor dates the NSAM''s approval Nov. 15 ([[w.taylor-swords-and-plowshares]], 248). Check: Schlesinger, 705, dates the National Security Action Memorandum Nov. 15; the entry has Nov. 22. To check: State to Saigon, Nov. 15, 1961, JFKL, NSF, box 195 (cited by [[w.moyar-triumph-forsaken]], 143 n.77). See [[cal.1961-01-28.vietnam]]; Lemnitzer''s notes of the meeting of Nov. 11 (FRUS I, doc. 236, cited by [[w.moyar-triumph-forsaken]], 142 n.76): [[cal.1961-11-11.vietnam]]. Names: Ngô Đình Diệm, Nolting.'
- edit:
    id: cal.1963-05-21.alabama-birmingham
    base: 0f118cdf
    kind: correct
    set:
      c: 'Stennis in the Senate: "None of us should be content to sit idly by in the face of this direct assault upon and threat to historic constitutional principles"; Alabama''s authorities functioned "fully and effectively."{1} Morse, later that day: Stennis "need only turn the pages of Life magazine of last week for pictorial proof"; "no place in America for inhumanity to man."{2}'
      n: 'The Senate sat from noon to 6:28 p.m.: [Daily Digest, D219](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=217). [109 Cong. Rec. 9115](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt7/pdf/GPO-CRECB-1963-pt7-6-1.pdf#page=51) (1963) (Stennis); [109 Cong. Rec. 9139–40](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt7/pdf/GPO-CRECB-1963-pt7-6-1.pdf#page=75) (1963) (Morse) (May 21, 1963). [[w.mann-walls-of-jericho]], 350–51. The Record (9115) reads "this direct assault upon and threat to"; Mann, 351, drops "assault upon and." See [[cal.1963-04-03.alabama]]. Names: Stennis, Morse.'
- edit:
    id: cal.1962-06-08.vietnam-congress
    base: 494ac7e7
    kind: correct
    set:
      c: 'Morse in the Senate: no evidence "that it would be militarily wise for us to let an American army get bogged down anywhere in Asia in a conventional war."{1} Heavy casualties, then "a demand made that we resort to nuclear weapons."{2}'
      n: '[108 Cong. Rec. 10,034](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt7/pdf/GPO-CRECB-1962-pt7-15-1.pdf) (1962). [[w.mann-grand-delusion]], 267. The Record (10,034) reads "a demand made that we resort." The Senate sat from noon to 3:05 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=1), [D285](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=283). Names: Morse.'
- edit:
    id: cal.1961-05-23.freedom-rides
    base: 4b80974d
    kind: correct
    settles: ['Check: Mann, 313, makes the Senator from New York Herbert Lehman, out of the Senate since 1957; in the Record he is Javits or Keating, Javits speaking just before (8648).']
    set:
      c: 'Thurmond in the Senate: the Freedom Riders "set out deliberately to create trouble at all costs";{1} he reads David Lawrence''s column. Javits: "I have yet to hear any excuse for the anarchy."{2} Thurmond: he did not expect him to agree "with the distinguished columnist, Mr. David Lawrence, or with the Constitution of the United States."{3}'
      n: '[107 Cong. Rec. 8616–17, 8648](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt7/pdf/GPO-CRECB-1961-pt7-4-2.pdf#page=27) (1961) (May 23, 1961). [[w.mann-walls-of-jericho]], 313–14. The Record (8648) has Javits, yielded the floor by Morse, speak the words, and Thurmond answer "the Senator from New York." Check: Mann, 313, makes the Senator from New York Herbert Lehman, out of the Senate since 1957. See [[cal.1961-05-20.freedom-rides]]. Names: Thurmond, Lawrence, Javits.'
