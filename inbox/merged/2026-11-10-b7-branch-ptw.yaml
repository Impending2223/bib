        id: cal.1962-05-18.king
        when: May 18
        date: '1962-05-18'
        thread: king
        c: Clarence Jones and Levison, on the FBI's microphone the day after the Gandhi Society's founding luncheon, on labor's contributions to the Society. Most of its contributors to be labor unions, their leaders knowing it a vehicle for fighting the *Sullivan* case with tax-exempt funds, by Branch's account.
        n: '[[w.branch-parting-the-waters]], 590. To check: the FBI''s handwritten microphone notes of May 18, 1962, FL-NY-5-NR (cited by [[w.branch-parting-the-waters]], 590 n.3). Check: where and when the notes were made public. See [[cal.1962-05-17.civil-rights-the-executive]]. Names: Levison.'
        tags: [name:levison-stanley-d]
        src:
          c: b05ab2fb
          rows:
            - 'w.branch-parting-the-waters 590: all'
            - 'via x.1962-05-18.handwritten-microphone-notes-jones-levison-discussion: A'
