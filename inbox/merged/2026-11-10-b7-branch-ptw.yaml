        id: cal.1962-12-03.civil-rights-the-executive
        when: Dec. 3
        date: '1962-12-03'
        thread: civil-rights-the-executive
        c: 'Ishmael Flory, of the African-American Heritage Association, to Kennedy: a Second Emancipation Proclamation. King lobbies privately all month for one, with such organizations, by Branch''s account.'
        n: '[[w.branch-parting-the-waters]], 685. To check: Flory to Kennedy, Dec. 3, 1962, SCLC Papers, box 33, folder 15, King Library and Archives (cited by [[w.branch-parting-the-waters]], 685 n.3). See [[cal.1962-05-17.civil-rights-the-executive]]. Names: Kennedy, Martin Luther King.'
        tags: [name:kennedy-john-f, name:king-martin-luther-jr]
        src:
