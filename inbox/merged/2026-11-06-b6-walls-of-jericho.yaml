      thread: congress
      c: 'Johnson to Russell, at Walter Reed with pulmonary edema, by letter: "I lean on you so much, Dick, and not having
        you where I can talk to you is an unfillable void." Johnson calls the hospital almost every day. Russell not back
        at work in Washington until May 24.'
      n: '[[w.mann-walls-of-jericho]], 464. To check: Johnson to Russell, Feb. 11, 1965, WHCF, Name Files, Box 344, "Richard
        Russell," LBJ Library; [[w.fite-richard-b-russell-jr]], 426 (cited by [[w.mann-walls-of-jericho]], 464). Names: Johnson,
        Russell.'
