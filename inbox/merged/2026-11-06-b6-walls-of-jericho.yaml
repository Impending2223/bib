      c: 'Humphrey''s bipartisan civil rights newsletter, to each of the bill''s Senators each morning: Title II, public accommodations,
        today, Magnuson and Hruska responsible. Floor captains, Clark, Bayh, Muskie and Moss for the Democrats in turn, Javits
        and Allott for the Republicans all day.'
      n: '[[w.mann-walls-of-jericho]], 397. To check: the newsletter of Apr. 9, as printed at 110 Cong. Rec. 8369 (Apr. 18,
        1964); [[w.humphrey-education-of-a-public-1976]], 206–07; [[w.loevy-to-end-all-segregation]], 144 (cited by [[w.mann-walls-of-jericho]],
        397). See [[cal.1964-03-30.civil-rights-bill]]. Names: Humphrey, Magnuson, Hruska, Clark, Bayh, Muskie, Moss, Javits,
        Allott.'
