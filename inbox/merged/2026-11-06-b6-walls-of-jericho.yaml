      when: Jan.
      date: 1963-01
      thread: civil-rights-bill
      c: 'The Oval Office, a long meeting. Kennedy to McGill of the *Atlanta Constitution*, on Russell: "I don''t know any
        person that puzzles me more than Senator Russell ... this gifted man remains adamant and defiant in the matters of
        any measures which tend to enter the field of race."'
      n: '[[w.mann-walls-of-jericho]], 367–68. Check: the day. To check: Ralph McGill, oral history, John F. Kennedy Library
        (cited by [[w.mann-walls-of-jericho]], 367). See [[cal.1963-01.civil-rights-bill]]. Names: Kennedy, McGill, Russell.'
      tags:
