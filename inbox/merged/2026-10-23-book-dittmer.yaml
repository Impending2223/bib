      n: 'SNCC, [Staff Retreat, minutes](https://www.crmvet.org/docs/6411_sncc_staff_min.pdf), Nov. 7, 1964; [SNCC Position Paper (Women in the Movement)](https://www.crmvet.org/docs/snccfem.htm) (Civil Rights Movement Archive). SNCC Digital Gateway, [SNCC''s Waveland Conference](https://snccdigital.org/events/snccs-waveland-conference/) (K–J Cong. II.L). [[w.carson-in-struggle]]; [[w.forman-making-of-black-revolutionaries]]; [[w.ransby-ella-baker-and-the]]; [[w.king-freedom-song]]; [[w.hogan-many-minds-one-heart]]; [[w.dittmer-local-people]], 331–32. See [[cal.1964-08-25.mississippi]]. Names: Forman.'
- edit:
    id: cal.1966-06-21.mississippi
    base: '93683367'
    set:
      n: '[*New York Times*, June 22, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/22/issue.html). [[w.dittmer-local-people]], 398. See [[cal.1966-06-06.mississippi]]; [[cal.1964-08-04.mississippi]]. Names: King, Chaney, Goodman, Schwerner, Price.'
- edit:
    id: cal.1967-10-20.mississippi
    base: 5de7854c
    set:
      n: '*Posey v. United States*, [416 F.2d 545](https://static.case.law/f2d/416/case-pdfs/0545-01.pdf) (5th Cir. 1969), the appeal. [*New York Times*, Oct. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/21/issue.html). [[w.ball-murder-in-mississippi]]; [[w.cagin-we-are-not-afraid]]; [[w.mars-witness-in-philadelphia]]; [[w.dittmer-local-people]], 418. See [[cal.1964-12-04.mississippi]]. Names: Chaney, Goodman, Schwerner, Price, Bowers, Roberts, Rainey, Killen, Cox.'
- edit:
    id: cal.1967-08-08.mississippi-ms
    base: 861463b9
    set:
      n: 'Votes: [Wikipedia, "1967 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1967_Mississippi_gubernatorial_election), from Our Campaigns; Check: Miss. Secretary of State, Election Returns (MDAH Series 0107). [[w.crespino-in-search-of-another]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.peirce-deep-south-states-of]]; [[w.black-rise-of-southern-republicans]]; [[w.dittmer-local-people]], 417. See [[cal.1963-11-05.mississippi-ms]]. Names: Winter, Williams, Swan, Barnett, Waller, Goldwater.'
- add:
    entry:
      id: cal.1961-03-27.mississippi
      when: Mar. 27
      date: '1961-03-27'
      thread: mississippi
      also:
      - sit-ins
      c: Jackson. Nine students of Tougaloo College's NAACP youth council sit in at the white public library on State Street; arrested for breach of the peace and held thirty-two hours.
      n: '[[w.dittmer-local-people]], 87–89.'
      tags:
      - state:ms
      - city:jackson
- add:
    entry:
      id: cal.1961-09-07.mississippi
      when: Sept. 7
      date: '1961-09-07'
      thread: mississippi
      also:
      - voting-rights
      c: Tylertown, Walthall County. The registrar, John Q. Wood, strikes John Hardy of SNCC on the head with a pistol when Hardy brings two Negroes to register; the sheriff arrests Hardy. No Negro tries to register in the county after.
      n: '*United States v. Wood*, [295 F.2d 772](https://static.case.law/f2d/295/case-pdfs/0772-01.pdf), 775 (5th Cir. 1961), from the Government''s affidavits. [[w.dittmer-local-people]], 108. See [[cal.1961-08.mississippi]].'
      tags:
      - state:ms
- add:
    entry:
      id: cal.1961-10-04.mississippi
      when: Oct. 4
      date: '1961-10-04'
      thread: mississippi
      also:
      - students
      c: McComb. More than 100 students of Burgland High School walk out when two of the bus station's sit-in protesters, Brenda Travis and Ike Lewis, are refused readmission; they march to city hall to pray on its steps. A crowd beats Bob Zellner of SNCC, the one white marcher. Police arrest 116 students, Moses and McDew with them; the 97 under eighteen released.
      n: '[[w.dittmer-local-people]], 107, 110–11. See [[cal.1961-08.mississippi]]. Names: Moses, McDew.'
      tags:
      - state:ms
      - name:moses-robert-p
      - name:mcdew-charles
- add:
    entry:
      id: cal.1961-10-27.mississippi
      when: Oct. 27
      date: '1961-10-27'
      thread: mississippi
      also:
      - voting-rights
      c: '*United States v. Wood*. The Fifth Circuit, Rives writing, Cameron dissenting, on the Government''s suit of Sept. 20 under the Civil Rights Act of 1957: the denial of a temporary restraining order appealable; 28 U.S.C. § 2283 no bar to the United States; unless the State agrees to put off Hardy''s trial, the district court to restrain it until the hearing on a preliminary injunction.'
      n: '*United States v. Wood*, [295 F.2d 772](https://static.case.law/f2d/295/case-pdfs/0772-01.pdf) (5th Cir. 1961). [[w.dittmer-local-people]], 108. See [[cal.1961-09-07.mississippi]]. Names: Cameron.'
      tags:
      - state:ms
      - name:cameron-ben-f
- add:
    entry:
      id: cal.1962-08.mississippi
      when: Aug.
      date: 1962-08
      thread: mississippi
      also:
      - voting-rights
      c: Ruleville, Sunflower County. Late in the month Fannie Lou Hamer, one of eighteen who go to the Indianola courthouse to register, is one of two let take the test; that night the planter she has worked for eighteen years, B. D. Marlowe, puts her off his plantation.
      n: '[[w.dittmer-local-people]], 136–38; [[w.mills-this-little-light-of]]. Check: the day; Dittmer, 137: the week after McLaurin''s first trip to the courthouse, late in August. Names: Hamer.'
      tags:
      - state:ms
      - name:hamer-fannie-lou
- add:
    entry:
      id: cal.1962-12-12.mississippi
      when: Dec. 12
      date: '1962-12-12'
      thread: mississippi
      also:
      - desegregation-public-places
      c: Jackson. John and Eldri Salter and four students of the North Jackson NAACP youth council picket Woolworth's on Capitol Street to open the youth council's boycott of the downtown stores; arrested. Mayor Thompson on television against the boycott.
      n: '[[w.dittmer-local-people]], 157–59; [[w.salter-jackson-mississippi]].'
      tags:
      - state:ms
      - city:jackson
- add:
    entry:
      id: cal.1963-05-09.mississippi
      when: May 9
      date: '1963-05-09'
      thread: mississippi
      also:
      - voting-rights
      c: Holmes County. Night riders firebomb the house of Hartman Turnbow, one of fourteen Negroes who tried to register at Lexington, Apr. 9; he drives them off with his rifle. Moses, photographing the damage the next morning, arrested; he, Turnbow and three SNCC workers charged with arson.
      n: '[[w.dittmer-local-people]], 191–93. Check: the night; Dittmer, 192: "one month to the day" after Turnbow tried to register. Doar''s federal suit for the defendants, and the charges dropped six months later: Dittmer, 193. Names: Moses.'
      tags:
      - state:ms
      - name:moses-robert-p
- add:
    entry:
      id: cal.1963-05-31.mississippi
      when: May 31
      date: '1963-05-31'
      thread: mississippi
      also:
      - desegregation-public-places
      c: 'Jackson. The Jackson movement''s first mass march: hundreds of Negro children and youths from the Farish Street Baptist Church; city police and state troopers arrest 450 and carry them in garbage trucks to a stockade at the State fairgrounds.'
      n: '[[w.dittmer-local-people]], 163; [[w.salter-jackson-mississippi]]. See [[cal.1963-05-28.mississippi]].'
      tags:
      - state:ms
      - city:jackson
- add:
    entry:
      id: cal.1963-06-09.mississippi
      when: June 9
      date: '1963-06-09'
      thread: mississippi
      c: Winona. Fannie Lou Hamer, Annelle Ponder of SCLC, June Johnson and three others, coming home from a citizenship school at Charleston, S.C., arrested after trying the bus station's lunch counter; in the Montgomery County jail beaten by the sheriff, the police chief and a highway patrolman, and by Negro prisoners made to do it. Lawrence Guyot of SNCC, come to bail them, arrested and beaten.
      n: '[[w.dittmer-local-people]], 170–73; [[w.mills-this-little-light-of]]. Check: the day; Dittmer, 170, 173: a Sunday, nine days before June 18. Names: Hamer.'
      tags:
      - state:ms
      - name:hamer-fannie-lou
- add:
    entry:
      id: cal.1963-06-18.mississippi
      when: June 18
      date: '1963-06-18'
      thread: mississippi
      also:
      - civil-rights-the-executive
      c: 'Kennedy and Mayor Allen Thompson of Jackson, two calls. That night the Jackson movement''s committee puts the mayor''s offer to a mass meeting at the Pearl Street A.M.E. Church: six Negro policemen for Negro districts, Negro crossing guards for Negro schools, some promotions. Accepted; the marches end, a registration drive in their place.'
      n: '[John F. Kennedy and Allen C. Thompson](https://prde.upress.virginia.edu/conversations/4001532), JFK Dictabelt 22A.4 and 22B.1; [John F. Kennedy and Allen C. Thompson](https://prde.upress.virginia.edu/conversations/4001534), JFK Dictabelt 22B.3 (PRDE only). [[w.dittmer-local-people]], 167–68; [[w.salter-jackson-mississippi]]. See [[cal.1963-06-12.mississippi]]. Check: Dittmer, 167, puts the calls two days after Evers''s funeral, June 17. Made public: the recordings, opened by the Kennedy Library. Names: Kennedy.'
      tags:
      - state:ms
      - city:jackson
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-07-15.mississippi
      when: July 15
      date: '1963-07-15'
      thread: mississippi
      also:
      - voting-rights
      c: '*United States v. Lynd*. The Fifth Circuit, Brown, Wisdom and Bell: the district court erred in denying the Government a preliminary injunction against Theron Lynd, Forrest County''s registrar; reversed and remanded for trial, the circuit''s own injunction of Apr. 10, 1962, to stand until the district court disposes of the case. The contempt proceedings against Lynd under submission.'
      n: '*United States v. Lynd*, [321 F.2d 26](https://static.case.law/f2d/321/case-pdfs/0026-01.pdf) (5th Cir. 1963); the injunction: [301 F.2d 818](https://static.case.law/f2d/301/case-pdfs/0818-01.pdf) (5th Cir. 1962). [[w.dittmer-local-people]], 179–80, 184. See [[cal.1962-05.mississippi-ms]]. Check: Dittmer, 184, has the court find Lynd in civil contempt the same day and give him ten days to register forty-three Negroes he had refused.'
      tags:
      - state:ms
      - city:hattiesburg
- add:
    entry:
      id: cal.1963-10-06.mississippi
      when: Oct. 6
      date: '1963-10-06'
      thread: mississippi
      also:
      - civil-rights-organizations
      c: 'Jackson, the Masonic Temple. COFO''s convention opens the Freedom Ballot campaign: a platform against the literacy test, for a State farm loan program and a federal minimum wage of $1.25; Aaron Henry nominated for governor.'
      n: '[[w.dittmer-local-people]], 200–202. See [[cal.1963-08-06.mississippi-ms]]. Names: Henry.'
      tags:
      - state:ms
      - city:jackson
      - name:henry-aaron
- add:
    entry:
      id: cal.1963-12.mississippi
      when: Dec.
      date: 1963-12
      thread: mississippi
      c: Oxford. A federal jury of white men acquits the Montgomery County sheriff, Earl Patridge, the Winona police chief, Thomas J. Herod, Jr., highway patrolman John L. Basinger and two others, charged by the Justice Department with conspiring to deprive the Winona prisoners of their rights.
      n: '[[w.dittmer-local-people]], 173. Check: the day. See [[cal.1963-06-09.mississippi]].'
      tags:
      - state:ms
- add:
    entry:
      id: cal.1964-02-15.mississippi
      when: Feb. 15
      date: '1964-02-15'
      thread: mississippi
      c: 'Brookhaven. Some 200 Klansmen make the White Knights of the Ku Klux Klan of Mississippi a statewide body, Sam Bowers of Laurel its Imperial Wizard: a forty-page constitution, and a plan of four stages, the fourth "extermination."'
      n: '[[w.dittmer-local-people]], 216–17 (the quotation, 217). Names: Bowers.'
      tags:
      - state:ms
      - name:bowers-sam
- add:
    entry:
      id: cal.1964-02-28.mississippi
      when: Feb. 28
      date: '1964-02-28'
      thread: mississippi
      also:
      - voting-rights
      c: 'Canton. Freedom Day: some 350 Negroes line up at the Madison County courthouse to register, police, sheriffs and highway patrolmen with shotguns along the route; five admitted to the circuit clerk, Foote Campbell. No arrests.'
      n: '[[w.dittmer-local-people]], 221–23. The Justice Department''s suit against Campbell within the week: Dittmer, 223. See [[cal.1964-01-22.mississippi-hattiesburg]].'
      tags:
      - state:ms
- add:
    entry:
      id: cal.1964-07-06.mississippi
      when: July 6
      date: '1964-07-06'
      thread: mississippi
      c: McComb. Representative Don Edwards, whose son is a summer volunteer, spends the night at the Freedom House opened the day before; to the Justice Department official who urges him to leave, that if the Department fears violence it should protect the workers.
      n: '[[w.dittmer-local-people]], 267. The bombing of the house two nights later: Dittmer, 267. See [[cal.1964-06-14.mississippi]]. Names: Edwards.'
      tags:
      - state:ms
      - name:edwards-william-d
- add:
    entry:
      id: cal.1964-07-12.mississippi
      when: July 12
      date: '1964-07-12'
      thread: mississippi
      c: 'Near Tallulah, La., a fisherman finds the lower half of a man''s body in a backwater of the Mississippi; another the next day: Henry Dee and Charles Moore, a student at Alcorn, neither in the movement, abducted by Klansmen May 2, beaten to death in the Homochitto National Forest and sunk in the river.'
      n: '[[w.dittmer-local-people]], 251. The arrest of two white men by the FBI, four months later, and the State''s refusal to prosecute: Dittmer, 251. See [[cal.1964-06-21.mississippi]].'
      tags:
      - state:ms
      - state:la
- add:
    entry:
      id: cal.1964-08-22.king
      when: Aug. 22
      date: '1964-08-22'
      thread: king
      also:
      - elections-1964
      - mississippi
      c: 'Atlantic City. At the White House''s request the FBI sends a squad of some thirty agents under Cartha DeLoach to the convention: informants, agents posing as reporters, a wiretap on King''s hotel room, a microphone in the storefront the SNCC and CORE workers use. Walter Jenkins, at the convention for the President, receives its reports on the Freedom Democrats'' plans.'
      n: '[S. Rep. No. 94-755, Book II, 117–19 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-ii.pdf#page=133). [[w.dittmer-local-people]], 291–93; [[w.oreilly-racial-matters-the-fbis]]. See [[cal.1964-08-22.mississippi]]. Made public: the Church Committee''s report, Apr. 1976. Names: DeLoach, King, Jenkins.'
      tags:
      - name:deloach-cartha
      - name:king-martin-luther-jr
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1964-09-29.mississippi
      when: Sept. 29
      date: '1964-09-29'
      thread: mississippi
      c: McComb. Paul Johnson, with T. B. Birdsong of the Highway Patrol, tells Pike County's officials he will send in a battalion of the National Guard; at their plea he gives them forty-eight hours.
      n: '[[w.dittmer-local-people]], 309–11. The first of the bombers arrested the next day, eleven within the week: Dittmer, 310–11. Check: the call from the Justice Department, before Johnson''s, that troops were being alerted (Dittmer, 310, and its note). See [[cal.1964-09-24.mississippi]]. Names: Paul Johnson.'
      tags:
      - state:ms
      - name:johnson-paul-b-jr
- add:
    entry:
      id: cal.1964-12-03.farm
      when: Dec. 3
      date: '1964-12-03'
      thread: farm
      also:
      - mississippi
      c: The community elections of the Agricultural Stabilization and Conservation Service, which choose the county committees that add to farmers' cotton allotments. COFO runs Negro farmers in twelve Mississippi counties; its poll watchers put out, Negro voters harassed, CORE workers beaten and arrested in Madison County. Five Negroes lead in their communities; none reaches a county committee.
      n: '[[w.dittmer-local-people]], 333–35. Freeman''s order of new elections in several communities, and the Negro farmers'' boycott of them: Dittmer, 334–35.'
      tags:
      - state:ms
- add:
    entry:
      id: cal.1965-06-14.mississippi
      when: June 14
      date: '1965-06-14'
      thread: mississippi
      also:
      - voting-rights
      c: Jackson. Against the legislature's special session on the voting laws, Lawrence Guyot of the Freedom Democrats leads some 500, nearly half of them teenagers, from the Morning Star Baptist Church toward the Capitol; police arrest 482 for parading without a permit and hold them in the State fairgrounds' cattle barns.
      n: '[[w.dittmer-local-people]], 344–46. The arrests, more than 1,000 by the end of June, and the Fifth Circuit''s injunction of June 30: Dittmer, 345–46.'
      tags:
      - state:ms
      - city:jackson
- add:
    entry:
      id: cal.1965-06-29.poverty
      when: June 29
      date: '1965-06-29'
      thread: poverty
      also:
      - mississippi
      c: 'Paul Johnson to Shriver: the Child Development Group of Mississippi, Head Start''s largest grant that summer, some $1.5 million for 6,000 children in eighty-four centers, "an effort on the part of extremists and agitators to subvert lawful authority." The same day the Senate Appropriations Committee, at Stennis''s urging, sends staff to inspect it.'
      n: '[[w.dittmer-local-people]], 368–72 (the quotation, 371). Names: Paul Johnson, Shriver, Stennis.'
      tags:
      - state:ms
      - name:johnson-paul-b-jr
      - name:shriver-r-sargent
      - name:stennis-john-c
- add:
    entry:
      id: cal.1965-07-18.mississippi
      when: July 18
      date: '1965-07-18'
      thread: mississippi
      c: Jackson, the Heidelberg Hotel. At the call of Claude Ramsey, president of the State AFL-CIO, some 125 moderates, three-fourths of them white, found the Mississippi Democratic Conference, to bring a loyal party back to the national Democrats; Robert Oswald of Pascagoula chairman, Charles Young vice chairman. The Freedom Democrats not invited.
      n: '[[w.dittmer-local-people]], 346–48.'
      tags:
      - state:ms
      - city:jackson
- add:
    entry:
      id: cal.1965-07.war-opposition
      when: July
      date: 1965-07
      thread: war-opposition
      also:
      - mississippi
      c: 'McComb, Miss. After John Shaw of the town is killed in Vietnam, a leaflet by Joe Martin and Clint Hopson, "five reasons why Negroes should not be in any war fighting for America," printed in the Freedom Democrats'' newsletter: "Mothers should encourage their sons not to go." Guyot and Ed King: not the party''s policy.'
      n: '[[w.dittmer-local-people]], 349–51 (the quotations, 350). Names: Ed King.'
      tags:
      - state:ms
      - name:king-edwin
- add:
    entry:
      id: cal.1965-08-27.mississippi
      when: Aug. 27
      date: '1965-08-27'
      thread: mississippi
      c: 'Natchez. A bomb in his car outside the Armstrong Tire and Rubber plant gravely injures George Metcalf, president of the Natchez NAACP. That night Charles Evers to a mass meeting: "We''re armed, every last one of us."'
      n: '[[w.dittmer-local-people]], 353–55 (the quotation, 354). Check: the spelling, Metcalf or Metcalfe. Names: Charles Evers.'
      tags:
      - state:ms
      - name:evers-charles
- add:
    entry:
      id: cal.1965-10-02.mississippi
      when: Oct. 2–3
      date: '1965-10-02'
      thread: mississippi
      c: Natchez. More than 300 march against a State court's injunction, 150 more the next day; all arrested for parading without a permit, those over twelve sent to Parchman, some 200 miles away, the men held naked through two cold nights.
      n: '[[w.dittmer-local-people]], 358. See [[cal.1965-08-27.mississippi]].'
      tags:
      - state:ms
- add:
    entry:
      id: cal.1965-12-03.mississippi
      when: Dec. 3
      date: '1965-12-03'
      thread: mississippi
      c: 'Natchez. Mayor John Nosser announces the agreement made Nov. 29 by Charles Evers and the NAACP''s committee with the city and twenty-three merchants: six Negro policemen, the city''s facilities and its schools desegregated, a Negro on the school board, Negro clerks in the twenty-three stores. The boycott ended.'
      n: '[[w.dittmer-local-people]], 360–61. See [[cal.1965-08-27.mississippi]]. Names: Charles Evers.'
      tags:
      - state:ms
      - name:evers-charles
- add:
    entry:
      id: cal.1966-06-07.mississippi
      when: June 7
      date: '1966-06-07'
      thread: mississippi
      also:
      - elections-1966
      c: 'Mississippi''s Democratic primary, the day after Meredith is shot. The Freedom Democrats run for all five House seats and against Eastland: Ed King 22 percent against John Bell Williams in the 3d; Guyot under 5 in the 5th; Clifton Whitley ahead of Eastland only in Claiborne and Jefferson Counties, which Charles Evers had organized.'
      n: '[[w.dittmer-local-people]], 394. Check: the returns; Dittmer: some 140,000 Negroes registered, about a fourth of them voting. See [[cal.1966-06-06.mississippi]]. Names: Ed King, John Bell Williams, Eastland, Charles Evers.'
      tags:
      - state:ms
      - name:king-edwin
      - name:williams-john-b
      - name:eastland-james-o
      - name:evers-charles
- add:
    entry:
      id: cal.1966-10-03.poverty
      when: Oct. 3
      date: '1966-10-03'
      thread: poverty
      also:
      - mississippi
      c: 'OEO refuses the Child Development Group of Mississippi a new grant: its Head Start centers to the counties'' Community Action boards and to Mississippi Action for Progress, chartered Sept. 13 at Shriver''s request by Owen Cooper, LeRoy Percy and Hodding Carter III.'
      n: '[[w.dittmer-local-people]], 376–79. Check: Dittmer, 377, on the Senate investigator''s report to Stennis, Aug. 5, and Shriver''s compliance. See [[cal.1965-06-29.poverty]]. Names: Shriver.'
      tags:
      - state:ms
      - name:shriver-r-sargent
- add:
    entry:
      id: cal.1967-02.mississippi
      when: Feb.
      date: 1967-02
      thread: mississippi
      c: Natchez. Wharlest Jackson, just promoted to a job at his plant held before only by whites, killed by a bomb in his car.
      n: '[[w.dittmer-local-people]], 417. Check: the day. See [[cal.1965-08-27.mississippi]].'
      tags:
      - state:ms
- add:
    entry:
      id: cal.1967-05-02.mississippi
      when: May 2
      date: '1967-05-02'
      thread: mississippi
      also:
      - voting-rights
      c: 'Sunflower, Sunflower County. The town election held again under the Fifth Circuit''s order: an all-Negro slate for mayor and five aldermen, Negroes 185 of the 339 registered. Every Negro candidate loses, by some seventy votes on the average, federal observers present; whites photograph the Negro voters in line.'
      n: '*Hamer v. Campbell*, [358 F.2d 215](https://static.case.law/f2d/358/case-pdfs/0215-01.pdf) (5th Cir. 1966). [[w.dittmer-local-people]], 411–13; [[w.parker-black-votes-count]].'
      tags:
      - state:ms
- add:
    entry:
      id: cal.1967-05-11.mississippi
      when: May 11
      date: '1967-05-11'
      thread: mississippi
      also:
      - students
      c: 'Jackson. On the second night of protest at Jackson State College, police fire on the crowd: Ben Brown, a movement worker since the Freedom Rides, killed, shot in the back and the back of the head; several wounded. The police: a bystander caught in a crossfire.'
      n: '[[w.dittmer-local-people]], 413–14.'
      tags:
      - state:ms
      - city:jackson
- add:
    entry:
      id: cal.1968-08-11.mississippi
      when: Aug. 11
      date: '1968-08-11'
      thread: mississippi
      also:
      - elections-1968
      c: 'Jackson, the Masonic Temple. The Loyal Democrats'' State convention, Aaron Henry in the chair: the Young Democrats, the State NAACP, the Freedom Democrats, the Negro teachers'' association, the Prince Hall Masons, the AFL-CIO. An at-large slate agreed beforehand; Charles Evers, nominated from the floor, elected national committeeman over Robert Clark.'
      n: '[[w.dittmer-local-people]], 420–22. See [[cal.1968-07-02.elections-1968-state-conventions]]. Names: Henry, Charles Evers, Clark.'
      tags:
      - state:ms
      - city:jackson
      - name:henry-aaron
      - name:evers-charles
      - name:clark-robert-g-jr
