- edit:
    id: cal.1963-05-07.alabama-birmingham-2
    base: aa63816b
    set:
      n: '[[w.branch-parting-the-waters]], 779–80. After [[cal.1963-05-07.alabama-birmingham-3|the hosing of Shuttlesworth]]: the hoses "by three o''clock," Shuttlesworth pinned to the church wall, and the mass meeting that night ([[w.branch-parting-the-waters]], 779). To check: Birmingham police notes of mass meeting, May 7, 1963, Bull Connor Papers (cited by [[w.branch-parting-the-waters]], 779 n.5). See [[cal.1963-05-07.alabama-birmingham]]. Names: Martin Luther King, Wallace, Kennedy.'
- follows:
