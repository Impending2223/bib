- edit:
    id: cal.1963-05-11.alabama
    base: f357b8b3
    set:
      n: '[Kennedy, Robert Kennedy, Katzenbach, Marshall, McNamara and others, May 12](https://prde.upress.virginia.edu/conversations/4006291), JFK Meeting Tape 86.2 (PRDE only). Radio and Television Remarks Following Renewal of Racial Strife in Birmingham, [1963 Pub. Papers 397](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=455) (May 12, 1963). Telegram to Governor Wallace of Alabama, [1963 Pub. Papers 398](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=456) (May 13, 1963). *Alabama v. United States*, [373 U.S. 545](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373545/usrep373545.pdf) (1963) (Wallace''s suit against the troops refused, May 27). [[w.garrow-bearing-the-cross]], 259–61 (not the telegram); [[w.sorensen-kennedy]], 491 (May 12: the troops; the statement at 9 p.m.); [[w.mann-walls-of-jericho]], 350–51 (the bombings; the rioting); [[w.branch-parting-the-waters]], 793–800; [[w.thomas-robert-kennedy]], 243 (the next night, dynamite at the house of King''s brother and the motel; fires); [[w.white-making-of-the-president-1965]], 170 (the bombing of the home of King''s brother and of a Negro motel; the rioting; battle units moved into position, never used); [[w.young-easy-burden]], 249–50; [[w.caro-passage-of-power]], 257 (Sunday, May 12, after the bombs at the house of King''s brother and at the motel, Kennedy back from Camp David for crisis meetings; the Second Infantry Division and the 82nd Airborne on alert; the papers drawn to federalize the Alabama Guard at a moment''s notice; not the day of the bombs, nor the television); [[w.purdum-idea-whose-time-has-2014]], 32–33 (the bombs of the night of May 11 at A. D. King''s house and the Gaston Motel; the riots; Wallace''s deputies; the President''s television statement, just before nine on May 12, Army units near Birmingham alerted and the Alabama Guard to be federalized if necessary; not the night through, nor the telegram of May 13). After [[cal.1963-05-11.alabama-birmingham-2|the commanders at the park]] and [[cal.1963-05-11.alabama-birmingham|the Klan rally]]: the park "nearly empty" by the time the Riverside reporters came back from the rally, and the first bomb "at about 10:45 p.m." ([[w.branch-parting-the-waters]], 793). Check: Branch, 793–800: the first bomb at A. D. King''s parsonage about 10:45 p.m., the second blowing out the front; the Gaston Motel just before midnight, four hurt; the riots near both; Lingo''s 250 troopers and irregulars charge at the motel, Chief Moore protesting; by dawn six businesses, several houses and an apartment building burned, nearly seventy to the hospital; at the White House Sunday, Robert Kennedy: "sticking bayonets in people"; Marshall to King from the Oval Office: "if there are no other incidents he thinks he can control his people"; three thousand troops moved in Operation Oak Tree; the statement at 8:48 p.m., "The Birmingham agreement was and is a fair and just accord.". To check: [[w.rosenberg-kennedy-johnson-and-the]] ("Protest in Birmingham"); Watkins to Moore, May 15, 1963 (on May 10); Whitehouse to Moore, May 13, 1963 (on May 11), Eugene "Bull" Connor Papers, Birmingham Public Library Archives; *Birmingham News*, May 12, 1963, at 1; [*New York Times*, May 12, 1963](https://timesmachine.nytimes.com/timesmachine/1963/05/12/issue.html), at 1; SAC Birmingham to Director, "Unsubs, Bombing of Gaston Motel . . .," May 24, 1963, FBI file 157-881-NR (cited by [[w.garrow-bearing-the-cross]], 260 n.33); [Jack Rosenthal], "Some Sketchy Notes on Birmingham," May 12, 1963, Victor Navasky Papers, Kennedy Library; *New York Times*, [May 13 at 1, 24, 25](https://timesmachine.nytimes.com/timesmachine/1963/05/13/issue.html) and [May 14, 1963, at 1, 26, 27](https://timesmachine.nytimes.com/timesmachine/1963/05/14/issue.html); Donald R. Coppock, "Birmingham Detail," May 29, 1963, Civil Rights Division FOIA (DOJ microfilm, reel 120) (cited by [[w.garrow-bearing-the-cross]], 261 n.34). See [[cal.1963-04-03.alabama]]. Names: Wallace, Robert F. Kennedy, McNamara, Katzenbach, Marshall, Martin Luther King.'
- follows:
    id: cal.1963-05-11.alabama
    add:
    - cal.1963-05-11.alabama-birmingham-2
    - cal.1963-05-11.alabama-birmingham
