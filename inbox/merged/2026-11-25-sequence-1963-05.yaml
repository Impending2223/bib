- edit:
    id: cal.1963-05-28.mississippi
    base: a56e8387
    set:
      n: '[[w.dittmer-local-people]], 160–63 (161–63: the sit-in at 11:15, the mob, the police outside; the marches from May 29); [[w.branch-pillar-of-fire]], 101; [[w.branch-parting-the-waters]], 814 (the sit-in); [[w.reeves-president-kennedy]], 501. After [[cal.1963-05-28.mississippi-2|the Mayor''s word and its disowning]]: "Under the sting of this disappointment, pressure for direct action broke loose that same day" ([[w.branch-parting-the-waters]], 814). Check: Branch, 814: four Tougaloo students and a white professor; three hours; ketchup, mustard, sugar, spray paint; Benny Oliver, an ex-policeman, kicks Memphis Norman''s face bloody, the photograph on the *New York Times*''s front page next morning; that night at the Pearl Street A.M.E. Church, Evers announces the NAACP''s "massive offensive.". To check: [[w.payne-ive-got-the-light]]; [[w.moody-coming-of-age-in]]; [[w.salter-jackson-mississippi]]; [[w.obrien-we-shall-not-be]]; *Newsweek*, June 10, 1963, at 28–29; *Memphis Commercial Appeal*, May 29, 1963 (cited by [[w.dittmer-local-people]], 162 n.47). See [[cal.1962-10-01.mississippi]]. Check: Dittmer, 162, gives two hours. Names: Evers.'
