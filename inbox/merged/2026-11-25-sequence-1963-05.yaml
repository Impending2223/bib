- edit:
    id: cal.1963-05-13.alabama-birmingham-2
    base: 16a79b27
    set:
      n: '[[w.branch-parting-the-waters]], 801–2. After [[cal.1963-05-13.alabama-birmingham|the tour of the taverns]]: "On Monday" the Riverside reporters followed King on the tour, and "That Monday night" they "followed King again to the mass meeting" ([[w.branch-parting-the-waters]], 801). To check: selections from the mass meeting of May 13, 1963, Donald H. Smith tapes, State Historical Society of Wisconsin (cited by [[w.branch-parting-the-waters]], 801 n.2). See [[cal.1963-05-10.alabama]]. Names: Robinson, Martin Luther King.'
- follows:
    id: cal.1963-05-13.alabama-birmingham-2
    add:
    - cal.1963-05-13.alabama-birmingham
- edit:
    id: cal.1963-05-16.china-leadership-8
    base: 95b1314d
    set:
      n: '[[w.yang-shangkun-riji]], II, 279 (May 16, 1963). The words: 今天我各报已公布苏方代表团的名单 (II, 279). After [[cal.1963-05-16.china-leadership-5|Chervonenko''s call at 1 a.m.]]: he told Yang the Soviet side would publish the news and name its delegation; the diary then has the Chinese papers print the names that day (II, 279). See [[cal.1963-05-16.china-leadership-5]].'
- follows:
