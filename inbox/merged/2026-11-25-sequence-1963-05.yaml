patch: 2026-11-25-sequence-1963-05
by: 'Claude (Sonnet, sequence pass: R25c on May 1963), Nov. 25, 2026; audited and corrected by Claude (Opus, R25c, R33b), Nov. 25, 2026; notes/sequence/1963-05.md, notes/sequence/audit-1963-05.md'
