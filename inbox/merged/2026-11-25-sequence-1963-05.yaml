    add:
    - cal.1963-05-16.china-leadership-5
- edit:
    id: cal.1963-05-24.civil-rights-the-executive
    base: 877c0d43
    set:
      n: '[[w.schlesinger-robert-kennedy-and-his]], 330–35; [[w.garrow-bearing-the-cross]], 268 (the meeting); [[w.branch-pillar-of-fire]], 89; [[w.navasky-kennedy-justice]], 113–14 (the meeting, May 24; who came; Smith, Clark and Marshall''s accounts; the FBI''s dossiers after); [[w.branch-parting-the-waters]], 809–12; [[w.thomas-robert-kennedy]], 244 (May 24, the Kennedy apartment on Central Park South; Jerome Smith, Hansberry, Kenneth Clark); [[w.wofford-of-kennedys-and-kings]], 171–72 (May 24, New York, Robert Kennedy and the group Baldwin assembled, nearly three hours; Kennedy angry and shaken; not the apartment or the number); [[w.schlesinger-journals]], 191–93 (Robert Kennedy''s account to Schlesinger on the Monday after, in the journal of June 2, of the meeting with Baldwin on Friday (the day not named): about a dozen Negroes, mostly writers and performers, at the Kennedy apartment, "nearly three hours," not three; Jerome Smith''s opening; Lena Horne; Belafonte and the lawyer for King afterward); [[w.risen-bill-of-the-century]], 50–52 (Baldwin''s group at his father''s apartment, 24 Central Park West, ten guests named, not "a dozen"; three hours; the Virginia talk of May 23 before it); [[w.purdum-idea-whose-time-has-2014]], 75–78 (the meeting, Friday evening, May 24, in a Kennedy family apartment on Central Park South, after the talk at Hickory Hill on Thursday; the guests named; "two hours, perhaps three"; not "a dozen"). After [[cal.1963-05-24.desegregation-public-places|the chain-store owners]]: "He had just been at an office in midtown" with them when he came to the apartment ([[w.thomas-robert-kennedy]], 244). Check: Branch, 809–12: Gregory had suggested Baldwin; Joseph Kennedy''s apartment near the Plaza; Robert Kennedy with Marshall and Guthman, come from Harry Wachtel''s chain-store owners; among the guests Kenneth Clark, Belafonte, Lena Horne, Lorraine Hansberry, Clarence Jones, and Jerome Smith of CORE: "I''m close to the moment where I''m ready to take up a gun"; Hansberry leads the walkout. Check: Thomas has the guests walk out after two hours (244). To check: [[w.guthman-we-band-of-brothers]]; [[w.baldwin-fire-next-time]]; the list of those present at the Baldwin meeting, Burke Marshall Papers, box 8, JFK Library (cited by [[w.branch-parting-the-waters]], 809 n.2). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Robert F. Kennedy, James Baldwin.'
