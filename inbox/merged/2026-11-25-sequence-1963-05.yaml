    base: 3489ab83
    set:
      n: '[[w.branch-parting-the-waters]], 761–62. After [[cal.1963-05-03.alabama-birmingham|the hoses and dogs]]: Branch gives the statements as the white leaders'' answer to the day, made "to head off a swell of public sympathy for King" ([[w.branch-parting-the-waters]], 761). Check: the day; Branch gives no source. See [[cal.1963-05-03.alabama-birmingham]]. Names: Boutwell.'
