- edit:
    id: cal.1963-05-04.china-leadership-9
    base: f7d479d3
    set:
      n: '[[w.zhu-de-nianpu-xinbian]], III, 1875. After [[cal.1963-05-04.china-leadership-8|the day at Luoyang]]: the nianpu has him at Luoyang on May 4 and at Zhengzhou that evening (III, 1875). The words: 晚上，抵达郑州市 (1875). Names: Zhu De.'
