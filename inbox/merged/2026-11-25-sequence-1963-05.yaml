- edit:
    id: cal.1963-05-07.civil-rights-the-executive-2
    base: 9b05e1a7
    set:
      n: '[[w.branch-parting-the-waters]], 778. After [[cal.1963-05-07.press-and-broadcasting|Hanson''s telegram]]: Hanson wrote it in the lunch recess of the Senior Citizens'' session; Marshall''s names and the President''s calls came after the session reassembled, "as the emergency session consumed the afternoon" ([[w.branch-parting-the-waters]], 777–78). To check: Burke Marshall, oral history, 99–101; Robert Kennedy, oral history, 760–62, JFK Library (cited by [[w.branch-parting-the-waters]], 778 n.1); *Birmingham News*, May 8, 1963, at 1 (cited by [[w.branch-parting-the-waters]], 778 n.2). Check: whom the President called. See [[cal.1963-05-07.civil-rights-the-executive]]. Names: Burke Marshall, Robert Kennedy, Kennedy, Sorensen, Katzenbach, White, Doar, Bernhard, Hatcher.'
- follows:
    id: cal.1963-05-07.civil-rights-the-executive-2
    add:
    - cal.1963-05-07.press-and-broadcasting
- edit:
    id: cal.1963-05-08.alabama-birmingham-3
    base: bb9d1d57
    set:
      n: '[[w.branch-parting-the-waters]], 784; [[w.schlesinger-robert-kennedy-and-his]], 329 (King arrested again, Shuttlesworth ready to lead the marchers back; Dolan telephones the Attorney General; Kennedy''s talk with Shuttlesworth, by Andrew Young''s account; the march canceled; Kennedy secures King''s release; the day not given); [[w.schlesinger-robert-kennedy-and-his]], 329 (after the agreement Connor arrests King again; Shuttlesworth readies the marchers; Dolan telephones the Attorney General, who talks with Shuttlesworth, by Andrew Young''s account; the march canceled and King released; not the bonds, the hearing, A. D. King, Bevel''s reserves or the day). After [[cal.1963-05-08.middle-east|the President''s press conference]]: taken to jail "shortly after President Kennedy''s optimistic press conference" ([[w.branch-parting-the-waters]], 784). To check: Vincent Harding, "A Beginning in Birmingham," *The Reporter*, June 6, 1963, at 17 (cited by [[w.branch-parting-the-waters]], 784 n.1); Andrew Young, recorded interview by Jean Stein, Sept. 9, 1968, 4, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 329 n.63). Check: the judge; the hour. See [[cal.1963-04-12.alabama]]. Names: Martin Luther King, Abernathy, Robert Kennedy, Shuttlesworth.'
- follows:
    id: cal.1963-05-08.alabama-birmingham-3
    add:
    - cal.1963-05-08.middle-east
- edit:
    id: cal.1963-05-08.alabama-birmingham-4
    base: 021e8a2a
    set:
      n: '[[w.branch-parting-the-waters]], 785. After [[cal.1963-05-08.alabama-birmingham-3|the jailing of King and Abernathy]]: the meeting held "in King''s absence," Bevel the only speaker ([[w.branch-parting-the-waters]], 785). To check: Birmingham police notes on mass meeting, May 8, 1963, Bull Connor Papers (cited by [[w.branch-parting-the-waters]], 785 nn.2-3). See [[cal.1963-05-08.alabama-birmingham]]. Names: Connor.'
- follows:
    id: cal.1963-05-08.alabama-birmingham-4
    add:
    - cal.1963-05-08.alabama-birmingham-3
- edit:
    id: cal.1963-05-09.alabama-birmingham
    base: 54f34a5f
    set:
      n: '[[w.garrow-bearing-the-cross]], 258; [[w.navasky-kennedy-justice]], 208 (the four unions'' $40,000 each, $160,000, from Goldfarb''s *Ransom*; 840 out on bail); [[w.branch-parting-the-waters]], 788–89; [[w.thomas-robert-kennedy]], 243 (Robert Kennedy raises the bail through Reuther and other union allies); [[w.reeves-president-kennedy]], 492 (the bail, more than $160,000, raised after calls from the White House; Meany, Reuther, Quill and Rockefeller named; Marshall and Rauh not). After [[cal.1963-05-09.civil-rights-the-executive|the stalled talks on the jailed]]: Robert Kennedy, "accepting that King would march again rather than leave people in jail, resolved to find the bail money" ([[w.branch-parting-the-waters]], 788). Check: Branch, 788–89: King asks Belafonte for some $90,000 in cash; Reuther to Rauh, "we need to get a hundred and sixty thousand dollars to Birmingham by morning"; Robert Kennedy, at the White House, gets half from Meany out of two AFL-CIO departmental accounts, $40,000 from McDonald of the Steelworkers, Reuther''s share from the Auto Workers, and talks the delivery over with Goldberg; Michael Quill''s deliveryman brings Belafonte $50,000 in a satchel while Kennedy is on the line. To check: *New York Times*, [May 9 at 1](https://timesmachine.nytimes.com/timesmachine/1963/05/09/issue.html) and [May 10, 1963, at 1](https://timesmachine.nytimes.com/timesmachine/1963/05/10/issue.html); *Birmingham News*, May 9, 1963, at 2; *New York Post*, May 10, 1963, at 1; *Chicago Daily News*, May 10, 1963, at 1; FBI New York file 100-111180-9-163, 4–5, and 9-172A, May 10 and 19, 1963, FBI file 100-111180-9-163, 172A; Andrew Young, notes, undated [May 9, 1963], SCLC Papers, box 49, folder 29, King Center (cited by [[w.garrow-bearing-the-cross]], 258 n.31). See [[cal.1963-04-03.alabama]]. Names: Marshall, Robert F. Kennedy, Reuther, Rauh.'
- follows:
