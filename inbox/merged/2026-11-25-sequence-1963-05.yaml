- edit:
    id: cal.1963-05-02.china-leadership-13
    base: e1169974
    set:
      n: '[[w.zhu-de-nianpu-xinbian]], III, 1874–1875. After [[cal.1963-05-02.china-leadership-12|Lintong]]: the nianpu prints the arrival at Lintong, then, the same day, the passage of the Huashan on leaving Xi''an eastward (离西安东行，途经华山, III, 1874); Lintong lies east of Xi''an, short of the Huashan. The order is the nianpu''s printing, the words and the road agreeing with it. Names: Zhu De.'
