- edit:
    id: cal.1963-05-02.republican-party
    base: a5a31999
    set:
      n: '[[w.white-suite-3505]], 146–47; [[w.novak-agony-of-the-g]], 160 (the Marriotts'' party, some three hundred Republican businessmen, Hall and Folger helping plan it; the press conference: "I am not a candidate for President, and I am not going to become one"). After [[cal.1963-05-02.press-and-broadcasting|the *Times* story]]: its implication that the Marriotts'' party launched a candidacy "gave Romney the opportunity to hold a Washington press conference to deny it" ([[w.novak-agony-of-the-g]], 160). Names: Romney. Check: Hall''s and Folger''s part in the party, White''s informants''.'
