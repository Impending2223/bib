- edit:
    id: cal.1963-05-10.china-leadership
    base: 009ef9da
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 10, 1963 (and May 9, n. 33); [[w.zhou-enlai-nianpu-1949]], II, 552 (May 10–12, 1963: Zhou Enlai goes to Hangzhou to report to Mao in person on the Yuejin; there twice calls the regional secretaries on grain, streamlining and farm production). After [[cal.1963-05-10.china-leadership-5|Zhou''s flight from Peking]]: Yang''s diary has him fly out of Peking that day (总理今天飞南京转上海, [[w.yang-shangkun-riji]], II, 277). Made public: 1997. Check: Zhou''s nianpu (II, 551–52) has the crew report three torpedo hits on May 2 and the central meeting of May 8 accept "most probably" a reef, with a dive to settle it; the entry says the ship struck a reef. Names: Mao Zedong, Zhou Enlai.'
- follows:
    id: cal.1963-05-10.china-leadership
    add:
    - cal.1963-05-10.china-leadership-5
- edit:
    id: cal.1963-05-10.china-leadership-11
    base: a9f39610
    set:
      n: '[[w.chen-yi-nianpu]], 966. After [[cal.1963-05-10.china-leadership-3|the flight from Kunming]]: the nianpu has the party land at Hanoi at 8:05 a.m. (上午8时5分, 966). Names: Chen Yi, Liu Shaoqi.'
- follows:
