- add:
    entry:
      id: cal.1964-09-30.laos
      when: Sept. 30
      date: '1964-09-30'
      thread: laos
      also:
      - vietnam-air-war
      c: 'The Joint Chiefs to McNamara, JCSM-835-64, on operations in the Laos corridor under NSAM 314. An air strike plan
        at once, without the South Vietnamese: of 22 targets, 17 for the Royal Laotian Air Force''s T-28s, 5 bridges for American
        Yankee Team aircraft, which are also to suppress flak and fly high cover. Ground incursions by South Vietnamese troops
        no deeper than 20 kilometers, two company equivalents at most in each of three areas; possible only with American
        advisers along.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 134–35. To check: JCSM-835-64 to the Secretary of Defense, Sept. 30, 1964,
        JMF 9155.3 (25 Sep 64) (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 135 n.27). See [[cal.1964-09-10.vietnam]].
        Names: McNamara.'
      src:
        c: 4af54996
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 134–35: all'
        - 'via x.1964-09-30.jcsm-835-64-to-secretary-of-defense: all'
      tags:
      - name:mcnamara-robert-s
