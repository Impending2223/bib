    set:
      n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-2-2.pdf) (1964). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). [[w.perlstein-before-the-storm]], 438 (75 to 3, on new evidence). The Senate sat from noon to 9:12 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=1), [D472](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=470). Order: after [[cal.1964-09-10.court|the cloture vote]], by the Record''s pages as the Digest gives them: the cloture vote and the motion to table, 21885–901; S. Res. 367 and its amendments, 21904–15, 21920–39 ([Daily Digest, D471–72](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=469)). See [[cal.1964-07-24.baker]]; [[cal.1963-10-07.baker]]. Names: Williams. Check: the page.'
