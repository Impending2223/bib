    base: a2f529f4
    set:
      n: 'Remarks in El Paso at a Ceremony Marking the Settlement of the Chamizal Dispute, [1963–64 Pub. Papers 1117](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=357) (Sept. 25, 1964). [[w.white-making-of-the-president-1965]], 355 (the President at El Paso with the Mexican President on the bridge). The time: Johnson at Oklahoma City the same day, "This morning I stood with the President of Mexico," and of Eufaula, "A few hours ago": Remarks in Oklahoma City at the Opening of the State Fair, [1963–64 Pub. Papers 1128](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=368) (Sept. 25, 1964). To check: [[w.liss-century-of-disagreement]]. See [[cal.1963-12-17.latin-america]]. Names: Johnson, López Mateos.'
      time_range:
      - 1964-09-25T13:00Z
