- follows:
    id: cal.1964-09-13.china-leadership
    add:
    - cal.1964-09-13.china-leadership-3
- edit:
    id: cal.1964-09-13.china-leadership
    base: 285b62a1
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 13, 1964. [[w.peng-zhen-nianpu-1902]], IV, 356 (Sept. 13, 1964; Peng Zhen in the morning accompanies Miyamoto Kenji and his party to Hangzhou to meet Mao; that evening Miyamoto leaves by Guangzhou for home). Made public: 2013. Order: after [[cal.1964-09-13.china-leadership-3|Chen Yi''s farewell at the airport]]: Miyamoto flew to Hangzhou in the morning and left Hangzhou for Guangzhou that evening (Peng Zhen nianpu, IV, 356), while Chen Yi, who saw him off, was that evening at the reception of Guinea''s chargé d''affaires ([[w.chen-yi-nianpu]], 1049); the farewell is the morning''s departure. Names: Mao Zedong, Peng Zhen, Miyamoto Kenji, Jiang Hua.'
