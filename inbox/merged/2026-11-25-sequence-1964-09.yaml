      time_zone: America/Denver
- check:
    id: cal.1964-09-28.china-leadership-4
    text: 'Check: the day. The Mao nianpu has no meeting with Sihanouk on Sept. 28; it gives one on the evening of Sept. 27 at the Great Hall of the People, Liu Shaoqi, Wang Guangmei, Dong Biwu and Zhou Enlai present ([[w.zedong-mao-zedong-nianpu]], V, Sept. 27, 1964): perhaps [[cal.1964-09-27.china-leadership]].'
