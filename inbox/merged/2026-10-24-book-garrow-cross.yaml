- add:
    entry:
      id: cal.1961-04-21.king
      when: Apr. 21
      date: '1961-04-21'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'King at the White House to see Wofford; Kennedy stops by, five minutes. No word of civil rights, King recalls: the Bay of Pigs two days past. His letter of Mar. 16 asking a conference unanswered but for O''Donnell''s "try again in late April." A brief talk with Robert Kennedy at Justice the week before, on the bus terminals.'
      n: '[[w.garrow-bearing-the-cross]], 153–54. To check: King to Kennedy, Mar. 16, and O''Donnell to King, Mar. 25, WHCF 358 (Kennedy Library), as Garrow cites them (657 n.25). Names: King, Wofford, Kennedy, O''Donnell, Robert F. Kennedy.'
      tags:
      - name:king-martin-luther-jr
      - name:wofford-harris
      - name:kennedy-john-f
      - name:odonnell-kenneth-p
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1961-08-23.voting-rights
      when: Aug. 23
      date: '1961-08-23'
      thread: voting-rights
      also:
      - civil-rights-organizations
      c: 'New York, the Taconic Foundation''s office. Wilkins, Farmer, Whitney Young, McDew of SNCC, and Wyatt Walker for King ratify the Voter Education Project that Harold Fleming, Currier and the Justice Department''s men worked out: under the Southern Regional Council, money and counties parceled out to the organizations.'
      n: '[[w.garrow-bearing-the-cross]], 161–63. The project begun: [[cal.1962-04-01.voting-rights]]. Names: Wilkins, Farmer, Young, McDew, Currier.'
      tags:
      - name:wilkins-roy
      - name:farmer-james
      - name:young-whitney-m-jr
      - name:mcdew-charles
      - name:currier-stephen-r
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1961-10-16.king
      when: Oct. 16
      date: '1961-10-16'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'King with Robert Kennedy, then an hour with the President. He asks a "Second Emancipation Proclamation," an order declaring segregation illegal under the Fourteenth Amendment, and the housing order promised in the campaign. Kennedy: a written case for the proclamation welcome; Congress not ready for a bill or the housing order; the ICC''s order in force in two weeks. A tour of the family''s rooms with Mrs. Kennedy after.'
      n: '[[w.garrow-bearing-the-cross]], 169–70. To check: Wofford to O''Donnell, June 12 and Oct. 4, 1961, WHCF 358 (Kennedy Library), as Garrow cites them (659 n.40). Names: King, Robert F. Kennedy, Kennedy, Jacqueline Kennedy.'
      tags:
      - name:king-martin-luther-jr
      - name:kennedy-robert-f
      - name:kennedy-john-f
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1962-04-09.king
      when: Apr. 9
      date: '1962-04-09'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'King, with Wyatt Walker, Shuttlesworth and others, sees Robert Kennedy and Burke Marshall: SCLC asks protection for Negro voting; they promise to act on specific complaints. In private Marshall warns King against Levison, whose telephone the FBI now taps. An appointment with Johnson the same day (Check).'
      n: '[[w.garrow-bearing-the-cross]], 195, 197. Check: the meeting with Johnson; Garrow cites the *Washington Post*, Apr. 9 and 10, 1962 (663 n.24). Names: King, Shuttlesworth, Robert F. Kennedy, Marshall, Levison, Johnson.'
      tags:
      - name:king-martin-luther-jr
      - name:shuttlesworth-fred
      - name:kennedy-robert-f
      - name:marshall-burke
      - name:levison-stanley-d
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1962-05-17.civil-rights-the-executive
      when: May 17
      date: '1962-05-17'
      thread: civil-rights-the-executive
      also:
      - king
      c: 'The Gandhi Society for Human Rights'' first dinner. King: a 115-page brief for a "Second Emancipation Proclamation" delivered to the White House that day by Fauntroy; "I do not feel that President Kennedy has given the leadership that the enormity of the problem demands."'
      n: '[[w.garrow-bearing-the-cross]], 198–99. See [[cal.1961-10-16.king]]. Names: King, Kennedy.'
      tags:
      - name:king-martin-luther-jr
      - name:kennedy-john-f
