      date: '1962-07-31'
      thread: georgia-albany
      c: Washington. Ten Senators see Burke Marshall to ask the Justice Department to act in Albany.
      n: '[[w.garrow-bearing-the-cross]], 212. See [[cal.1961-11-17.albany]]. Names: Marshall.'
      tags:
      - name:marshall-burke
- add:
    entry:
      id: cal.1962-08-02.georgia-albany
      when: Aug. 2
      date: '1962-08-02'
      thread: georgia-albany
      c: 'Washington, at night. Wulf of the ACLU, Haley of CORE, Wilkins and two others of the NAACP, Kunstler and Fauntroy for SCLC with Robert Kennedy and Burke Marshall on Albany: they ask the Department to join the movement''s two suits against the city. Kennedy and Marshall: the aim, face-to-face talks in Albany; King''s leaving part of any agreement.'
      n: '[[w.garrow-bearing-the-cross]], 213. See [[cal.1961-11-17.albany]]. Names: Wilkins, Robert F. Kennedy, Marshall, King.'
      tags:
      - name:wilkins-roy
      - name:kennedy-robert-f
      - name:marshall-burke
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1962-08-08.georgia-albany
      when: Aug. 8
      date: '1962-08-08'
      thread: georgia-albany
      c: 'The Justice Department files a brief as friend of the court before Elliott, against the city''s injunction and for the movement''s two suits: Albany''s ordinances require segregation, and the city has closed "all avenues of demonstrative protest." King the last witness that afternoon.'
      n: '[[w.garrow-bearing-the-cross]], 214. Check: the brief. See [[cal.1961-11-17.albany]]. Names: Elliott, King.'
      tags:
      - name:elliott-j-robert
      - name:king-martin-luther-jr
      - state:ga
      - city:albany
- add:
    entry:
      id: cal.1962-10-26.king
      when: Oct. 26
      date: '1962-10-26'
      thread: king
      c: 'Several conservative papers run nearly the same front-page story, planted by the FBI: O''Dell, of SCLC''s New York office, a "concealed member" of the Communist Party''s national committee. Days later King: O''Dell has resigned, "pending further inquiry"; he stays, off the payroll a while.'
      n: '[[w.garrow-bearing-the-cross]], 222–23. Check: the day; Garrow cites papers of Oct. 25 and 26 (667 n.51). Names: O''Dell, King.'
      tags:
      - name:odell-jack-h
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1962-12-17.civil-rights-the-executive
      when: Dec. 17
      date: '1962-12-17'
      thread: civil-rights-the-executive
      also:
      - king
      - africa
      c: 'The American Negro Leadership Conference on Africa at the White House: King, Randolph, Wilkins, Farmer, Whitney Young, Dorothy Height and Theodore Brown give Kennedy its resolutions. After, King alone with Kennedy on the bombing of Bethel Baptist Church in Birmingham and the administration''s stand. No promises: Congress would doom a civil rights bill.'
      n: '[[w.garrow-bearing-the-cross]], 224–25. Check: the day; Garrow cites the *Washington Post*, Dec. 18, 1962 (668 n.55). Names: King, Randolph, Wilkins, Farmer, Young, Kennedy.'
      tags:
      - name:king-martin-luther-jr
      - name:randolph-a-philip
      - name:wilkins-roy
      - name:farmer-james
      - name:young-whitney-m-jr
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-03-23.march-on-washington
      when: Mar. 23
      date: '1963-03-23'
      thread: march-on-washington
      c: 'New York. The executive board of Randolph''s Negro American Labor Council approves his plan of a march on Washington: a day of lobbying on Capitol Hill, then a procession to a rally at the Lincoln Memorial, the President to be asked to speak. Rustin, Norman Hill and Tom Kahn had proposed it in January, for May; set now for October.'
      n: '[[w.garrow-bearing-the-cross]], 266–67. Names: Randolph, Rustin.'
      tags:
      - name:randolph-a-philip
      - name:rustin-bayard
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1963-05-04.alabama-birmingham
      when: May 4
      date: '1963-05-04'
      thread: alabama-birmingham
      c: 'Kennedy, to a delegation at the White House: the pictures from Birmingham make him "sick"; he has no power to intervene, but Burke Marshall and Joseph Dolan are on their way to mediate. In Birmingham Marshall meets Smyer, David Vann, Erskine Smith and the merchants: a larger group to see him Sunday.'
      n: '[[w.garrow-bearing-the-cross]], 250. See [[cal.1963-04-03.alabama]]. Names: Kennedy, Marshall, Dolan.'
      tags:
      - name:kennedy-john-f
      - name:marshall-burke
      - name:dolan-joseph-f
      - state:al
      - city:birmingham
- add:
    entry:
      id: cal.1963-05-07.civil-rights-the-executive
      when: May 7
      date: '1963-05-07'
      thread: civil-rights-the-executive
      also:
      - alabama-birmingham
      c: 'Birmingham. The Senior Citizens Committee, some eighty, called by Smyer: Sheriff Bailey, the police at the breaking point; Marshall, for a negotiated peace. They authorize the merchants'' negotiators, two or three dissenting. That night Smyer, Vann and two merchants with Pitts, Shores and Andrew Young, Marshall present: the stores desegregated, jobs upgraded, a biracial committee; the release of the jailed unsettled.'
      n: '[[w.garrow-bearing-the-cross]], 253–55. See [[cal.1963-04-03.alabama]]. Names: Marshall, Shores, Young.'
      tags:
      - name:marshall-burke
      - name:shores-arthur-d
      - name:young-andrew-j-jr
      - state:al
      - city:birmingham
- add:
    entry:
      id: cal.1963-05-09.alabama-birmingham
      when: May 9
      date: '1963-05-09'
      thread: alabama-birmingham
      c: 'Bail for the jailed, Birmingham''s whites refusing it: Marshall and Robert Kennedy turn to Reuther and Rauh. Four unions promise $40,000 each; Rauh wires a guarantee of $160,000 to Erskine Smith. The truce agreement written that night.'
      n: '[[w.garrow-bearing-the-cross]], 258. See [[cal.1963-04-03.alabama]]. Names: Marshall, Robert F. Kennedy, Reuther, Rauh.'
      tags:
      - name:marshall-burke
      - name:kennedy-robert-f
      - name:reuther-walter
      - name:rauh-joseph-l-jr
      - state:al
      - city:birmingham
- add:
    entry:
      id: cal.1963-05-14.alabama-birmingham
      when: May 14
      date: '1963-05-14'
      thread: alabama-birmingham
      c: 'Twenty Alabama editors at the Justice Department. Robert Kennedy: King''s moderation and nonviolence his greatest virtues; "If King loses, worse leaders are going to take his place"; the South''s officials to allow protests. To newsmen after, on background: the troops held ready for fear of Lingo''s troopers, not of the Negroes.'
      n: '[[w.garrow-bearing-the-cross]], 262. See [[cal.1963-04-03.alabama]]. Names: Robert F. Kennedy, King, Lingo.'
      tags:
      - name:kennedy-robert-f
      - name:king-martin-luther-jr
      - name:lingo-albert-j
- add:
    entry:
      id: cal.1963-05-31.king
      when: May 31
      date: '1963-05-31'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'The FBI reports to Robert Kennedy King''s talk with Levison, overheard on the Bureau''s tap on Levison: ask to see the President; if refused, Birmingham''s tactics in other cities. At Kennedy''s request the account goes to the President within hours. King had wired May 30 for a conference with both. June 1, Lee White: no meeting for at least a week.'
      n: '[[w.garrow-bearing-the-cross]], 264–65. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: Robert F. Kennedy, King, Levison, Kennedy, White.'
      tags:
      - name:kennedy-robert-f
      - name:king-martin-luther-jr
      - name:levison-stanley-d
      - name:kennedy-john-f
      - name:white-lee-c
- add:
    entry:
      id: cal.1963-06-18.march-on-washington
      when: June 18
      date: '1963-06-18'
      thread: march-on-washington
      c: 'New York, Randolph''s office. The first joint meeting on the march: King, Abernathy, Shuttlesworth and Levison with Rustin, Cleveland Robinson, Overton of the Negro American Labor Council, Mahoney of SNCC, Norman Hill of CORE. Rustin: a date between Aug. 10 and 24; Robinson and George Lawrence coordinators; a policy committee, one from each organization, June 24.'
      n: '[[w.garrow-bearing-the-cross]], 270. See [[cal.1963-03-23.march-on-washington]]. Names: Randolph, King, Abernathy, Shuttlesworth, Levison, Rustin.'
      tags:
      - name:king-martin-luther-jr
      - name:abernathy-ralph-david
      - name:shuttlesworth-fred
      - name:levison-stanley-d
      - name:rustin-bayard
      - name:randolph-a-philip
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1963-07-02.march-on-washington
      when: July 2
      date: '1963-07-02'
      thread: march-on-washington
      also:
      - civil-rights-organizations
      c: 'New York. The leaders on the march; the Council for United Civil Rights Leadership has $800,000 to divide. Rustin''s plan: jobs, a higher minimum wage and fair employment first, the bill second; 100,000 expected; $65,000. Wilkins blocks Rustin as director; Randolph named, and he names Rustin his deputy. The co-chairmen Randolph, King, Wilkins, Whitney Young, Farmer, Lewis. No sit-ins, no civil disobedience.'
      n: '[[w.garrow-bearing-the-cross]], 276–77. See [[cal.1963-03-23.march-on-washington]]. Names: Rustin, Wilkins, Randolph, King, Young, Farmer, Lewis.'
      tags:
      - name:rustin-bayard
      - name:wilkins-roy
      - name:randolph-a-philip
      - name:king-martin-luther-jr
      - name:young-whitney-m-jr
      - name:farmer-james
      - name:lewis-john
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1963-07-03.king
      when: July 3
      date: '1963-07-03'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'King to O''Dell, at Burke Marshall''s pressing after the *Birmingham News*''s story of June 30: his "temporary resignation" of November made permanent. Dora McDonald sends Robert Kennedy a copy the same day. Levison breaks off direct contact with King; Clarence Jones their go-between.'
      n: 'King to O''Dell, and McDonald to Robert Kennedy, July 3, 1963, as [[w.garrow-bearing-the-cross]], 275, 675 n.49, cites them. Names: King, O''Dell, Marshall, Robert F. Kennedy, Levison.'
      tags:
      - name:king-martin-luther-jr
      - name:odell-jack-h
      - name:marshall-burke
      - name:kennedy-robert-f
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1963-07-25.civil-rights-bill
      when: July 25
      date: '1963-07-25'
      thread: civil-rights-bill
      also:
      - king
      c: 'Robert Kennedy, on Barnett''s charges at the Senate''s hearings: no civil rights leader "Communists or Communist-controlled."'
      n: '[[w.garrow-bearing-the-cross]], 278. Check: the statement''s text. Names: Robert F. Kennedy, Barnett.'
      tags:
      - name:kennedy-robert-f
      - name:barnett-ross-r
- add:
    entry:
      id: cal.1963-10-05.king
      when: Oct. 5
      date: '1963-10-05'
      thread: king
      c: New York, the Park Sheraton. King sees Levison, against his promise to the Kennedys, on his book on Birmingham; Levison to oversee a new ghostwriter. The FBI, from its taps on Levison and Clarence Jones, tells Robert Kennedy they are in touch.
      n: '[[w.garrow-bearing-the-cross]], 299–300. The taps on King: [[cal.1963-10-10.king]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King, Levison, Robert F. Kennedy.'
      tags:
      - name:king-martin-luther-jr
      - name:levison-stanley-d
      - name:kennedy-robert-f
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1963-11-20.king
      when: Nov. 20
      date: '1963-11-20'
      thread: king
      c: New York, an airport hotel. King, Levison and Clarence Jones on the book's editing. FBI agents, told of the meeting by the taps, photograph them coming out, to show the Kennedys.
      n: '[[w.garrow-bearing-the-cross]], 306–07. See [[cal.1963-10-10.king]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King, Levison.'
      tags:
      - name:king-martin-luther-jr
      - name:levison-stanley-d
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1963-12-03.king
      when: Dec. 3
      date: '1963-12-03'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'King with Johnson and Lee White, forty-five minutes: Johnson for the civil rights bill and for Negro registration; no word of the Communist charges. King: "very fruitful."'
      n: '[Johnson and David McDonald, King joining, 12:10 p.m.](https://prde.upress.virginia.edu/conversations/9020036), Tape K6312.02, PNO 18 (PRDE only). [[w.garrow-bearing-the-cross]], 308. Names: King, Johnson, White.'
      tags:
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      - name:white-lee-c
- add:
    entry:
      id: cal.1963-12.king
      when: Dec.
      date: 1963-12
      thread: king
      c: 'A conference of FBI officials on King: how to gather evidence of his private life, to expose him as "an immoral opportunist" and a "clerical fraud." Sullivan proposes microphones in his hotel rooms. The taps on his home and office in place since November.'
      n: '[[w.garrow-bearing-the-cross]], 310. Check: the day; Garrow cites Sullivan to Belmont, Dec. 24, 1963 (680 n.19). See [[cal.1963-10-10.king]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: Sullivan, King.'
      tags:
      - name:sullivan-william-c
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1964-01-05.king
      when: Jan. 5–6
      date: '1964-01-05'
      thread: king
      c: 'Washington, the Willard Hotel, King there for the argument of *New York Times v. Sullivan*. FBI agents plant microphones in his room: fifteen reels in two days, a party with SCLC colleagues and two women from Philadelphia. The transcripts made for the White House.'
      n: '[[w.garrow-bearing-the-cross]], 310. Check: the days. See [[cal.1963-10-10.king]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King.'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1964-01-18.poverty
      when: Jan. 18
      date: '1964-01-18'
      thread: poverty
      also:
      - civil-rights-organizations
      c: Johnson, at a Saturday meeting called the night before, asks King, Wilkins, Whitney Young and Farmer to support the war on poverty. King for it, and for "some kind of compensatory crash program."
      n: '[[w.garrow-bearing-the-cross]], 310. Check: Garrow cites the *New York Times*, Jan. 19, 1964 (680 n.20). Names: Johnson, King, Wilkins, Young, Farmer.'
      tags:
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:wilkins-roy
      - name:young-whitney-m-jr
      - name:farmer-james
- add:
    entry:
      id: cal.1964-04-23.king
      when: Apr. 23
      date: '1964-04-23'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'King answers Hoover''s testimony of January to a House subcommittee, reported the day before, that Communist influence is in the civil rights movement: Hoover aids the right-wing extremists; it is "difficult to accept the word of the FBI on communistic infiltration in the civil rights movement when it has been so completely ineffectual in protecting the Negro from brutality in the Deep South." The statement drafted by Clarence Jones.'
      n: '[[w.garrow-bearing-the-cross]], 321–22. Names: King, Hoover.'
      tags:
      - name:king-martin-luther-jr
      - name:hoover-j-edgar
- add:
    entry:
      id: cal.1964-05-30.desegregation-public-places
      when: May 30
      date: '1964-05-30'
      thread: desegregation-public-places
      c: 'St. Augustine. A Klan rally of 300 outside the town; word of a plot against King. King, in California, on the telephone with Burke Marshall and Lee White: the local lawmen not acting in good faith; federal protection needed. Marshall asks the FBI to watch; White calls Governor Bryant.'
      n: '[[w.garrow-bearing-the-cross]], 327–28. See [[cal.1964-03-31.desegregation-public-places-fl]]. Names: King, Marshall, White, Bryant.'
      tags:
      - name:king-martin-luther-jr
      - name:marshall-burke
      - name:white-lee-c
      - name:bryant-farris
      - state:fl
      - city:st-augustine
- add:
    entry:
      id: cal.1964-06-30.desegregation-public-places
      when: June 30
      date: '1964-06-30'
      thread: desegregation-public-places
      c: St. Augustine. Bryant announces a biracial committee of four unnamed men, to serve thirty days; King suspends demonstrations two weeks. By Mayor Shelley's account, Bryant tells him in confidence there is no committee.
      n: '[[w.garrow-bearing-the-cross]], 336–37. See [[cal.1964-03-31.desegregation-public-places-fl]]. Names: Bryant, King.'
      tags:
      - name:bryant-farris
      - name:king-martin-luther-jr
      - state:fl
      - city:st-augustine
- add:
    entry:
      id: cal.1964-07-02.civil-rights-organizations
      when: July 2
      date: '1964-07-02'
      thread: civil-rights-organizations
      also:
      - civil-rights-bill
      c: 'After the signing, Johnson in private with King, Wilkins, Whitney Young and others: the rights now secured by law, demonstrations unnecessary and perhaps self-defeating.'
      n: '[[w.garrow-bearing-the-cross]], 338. See [[cal.1964-07-02.civil-rights-bill]]. Names: Johnson, King, Wilkins, Young.'
      tags:
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:wilkins-roy
      - name:young-whitney-m-jr
- add:
    entry:
      id: cal.1964-07-27.states-and-cities
      when: July 27–30
      date: '1964-07-27'
      thread: states-and-cities
      c: 'New York, at Wagner''s request after the Harlem riots: King with Wagner four times. He asks a civilian board to review complaints against the police and the suspension of the officer who shot James Powell; Wagner and his police commanders refuse. King: Commissioner Murphy "utterly unresponsive."'
      n: '[[w.garrow-bearing-the-cross]], 342–44. See [[cal.1964-07-18.states-and-cities]]. Names: Wagner, King.'
      tags:
      - name:wagner-robert-f-jr
      - name:king-martin-luther-jr
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1964-08-19.elections-1964
      when: Aug. 19
      date: '1964-08-19'
      thread: elections-1964
      also:
      - civil-rights-organizations
      c: 'Johnson with the civil rights leaders at the White House: he will not discuss the convention, and speaks of his administration''s record; no one raises the Freedom Democrats. King, in Washington for the platform committee, stays away; his telegram asks support for the Freedom Democrats. The FBI, from its taps on King and Rustin, has reported the planning to the White House.'
      n: '[[w.garrow-bearing-the-cross]], 344–46. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: Johnson, King, Rustin.'
      tags:
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:rustin-bayard
- add:
    entry:
      id: cal.1965-01-05.king
      when: Jan. 5
      date: '1965-01-05'
      thread: king
      c: 'Atlanta. Coretta King opens a box received at SCLC a month before: a tape from the FBI''s microphones, the Willard''s and others, with an anonymous letter: "King, there is only one thing left for you to do. You know what it is." Made up at Sullivan''s direction two days after Hoover''s attack; mailed from Miami Nov. 21.'
      n: '[[w.garrow-bearing-the-cross]], 372–74. Check: the day. See [[cal.1964-11-18.civil-rights-the-executive]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: Coretta Scott King, Sullivan, Hoover, Martin Luther King.'
      tags:
      - name:king-coretta-scott
      - name:sullivan-william-c
      - name:hoover-j-edgar
      - name:king-martin-luther-jr
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1965-01-11.king
      when: Jan. 11
      date: '1965-01-11'
      thread: king
      c: 'Washington. Andrew Young and Abernathy, for King, see DeLoach to ask that the FBI''s leaks stop. DeLoach: no interest in SCLC''s money or King''s private life. To his superiors, DeLoach reports the meeting made as unpleasant as he could.'
      n: '[[w.garrow-bearing-the-cross]], 377. See [[cal.1964-11-18.civil-rights-the-executive]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: Young, Abernathy, DeLoach.'
      tags:
      - name:young-andrew-j-jr
      - name:abernathy-ralph-david
      - name:deloach-cartha
- add:
    entry:
      id: cal.1965-01-15.king
      when: Jan. 15
      date: '1965-01-15'
      thread: king
      also:
      - civil-rights-the-executive
      c: Johnson, at the Ranch, and King by telephone. King urges Whitney Young for a Cabinet post. The FBI overhears.
      n: '[Johnson and King, 12:06 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-martin-luther-king-january-15-1965), Conversations WH6501-04-6736, 6737 (Miller Center). [[w.garrow-bearing-the-cross]], 382 (the Cabinet post; the FBI). Names: Johnson, King, Young.'
      tags:
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:young-whitney-m-jr
- add:
    entry:
      id: cal.1965-02-03.voting-rights-selma
      when: Feb. 3
      date: '1965-02-03'
      thread: voting-rights-selma
      c: 'Andrew Young to Lee White, for King in the Selma jail: a presidential emissary to Selma; a statement for the right to vote in Dallas County; legislation. White to Johnson: tell Young the Justice Department is following it; Katzenbach, in secret touch with Judge Thomas, thinks Thomas can settle it.'
      n: '[[w.garrow-bearing-the-cross]], 382–84. See [[cal.1965-01-02.voting-rights]]. Names: Young, White, Johnson, Katzenbach, Thomas.'
      tags:
      - name:young-andrew-j-jr
      - name:white-lee-c
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
      - name:thomas-daniel-h
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1965-02-22.voting-rights-selma
      when: Feb. 22
      date: '1965-02-22'
      thread: voting-rights-selma
      c: 'Selma. Katzenbach telephones King: the Justice Department has learned of a plot to shoot him from ambush at Marion a week before; he should take the greatest care. That night at Brown Chapel King speaks of night marches, with or without Wallace''s leave.'
      n: '[[w.garrow-bearing-the-cross]], 392. See [[cal.1965-01-02.voting-rights]]. Names: Katzenbach, King, Wallace.'
      tags:
      - name:katzenbach-nicholas
      - name:king-martin-luther-jr
      - name:wallace-george-c
      - state:al
      - city:selma
- add:
    entry:
      id: cal.1965-03-02.war-opposition
      when: Mar. 2
      date: '1965-03-02'
      thread: war-opposition
      also:
      - king
      c: 'Washington, Howard University. King on racism, poverty and violence, and for a negotiated settlement in Vietnam: "The war in Vietnam is accomplishing nothing." His first word against the war in public.'
      n: '[[w.garrow-bearing-the-cross]], 394. Names: King.'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1965-03-05.voting-rights
      when: Mar. 5
      date: '1965-03-05'
      thread: voting-rights
      also:
      - king
      c: 'King with Johnson, seventy-five minutes. Johnson: a statute, not a constitutional amendment, to ease registration; Dirksen''s support promised. King to see Katzenbach on the bill''s terms.'
      n: '[[w.garrow-bearing-the-cross]], 395. See [[cal.1965-02-09.voting-rights]]. Names: King, Johnson, Dirksen, Katzenbach.'
      tags:
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      - name:dirksen-everett
      - name:katzenbach-nicholas
- add:
    entry:
      id: cal.1965-03-14.voting-rights
      when: Mar. 14
      date: '1965-03-14'
      thread: voting-rights
      c: 'Johnson telephones King to ask him to the address to Congress the next night. King declines: Reeb''s memorial service in Selma.'
      n: '[[w.garrow-bearing-the-cross]], 408. Check: a recording. See [[cal.1965-03-07.voting-rights]]. Names: Johnson, King, Reeb.'
      tags:
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:reeb-james-j
- add:
    entry:
      id: cal.1965-07-28.voting-rights
      when: July 28
      date: '1965-07-28'
      thread: voting-rights
      c: 'Cleveland. Katzenbach telephones King at his hotel: the House conferees Rodino and Donohue hold the voting bill on the poll tax ban. King lets him say the Senate''s milder language is acceptable. July 29, Katzenbach passes the word; the House conferees yield that afternoon.'
      n: '[[w.garrow-bearing-the-cross]], 435. Check: the conference committee''s record. See [[cal.1965-07-09.voting-rights]]. Names: Katzenbach, King, Rodino, Donohue.'
      tags:
      - name:katzenbach-nicholas
      - name:king-martin-luther-jr
      - name:rodino-peter-w-jr
      - name:donohue-harold-d
      - state:oh
      - city:cleveland
- add:
    entry:
      id: cal.1965-08-05.civil-rights-the-executive
      when: Aug. 5
      date: '1965-08-05'
      thread: civil-rights-the-executive
      also:
      - king
      c: 'King, Abernathy and Fauntroy with Johnson and Lee White: Johnson on a White House Conference on Civil Rights in 1966. King: segregation growing in the North; school aid cut off from systems segregated in fact; housing and job training; slum ownership made unprofitable. Johnson asks a report.'
      n: '[[w.garrow-bearing-the-cross]], 436. To check: White to Johnson, Aug. 5, 1965, Diary Backup (LBJ Library), as Garrow cites it (696 n.7). Names: King, Abernathy, Johnson, White.'
      tags:
      - name:king-martin-luther-jr
      - name:abernathy-ralph-david
      - name:johnson-lyndon-b
      - name:white-lee-c
- add:
    entry:
      id: cal.1965-08-19.states-and-cities
      when: Aug. 19
      date: '1965-08-19'
      thread: states-and-cities
      also:
      - king
      c: 'Los Angeles. King and Rustin with Yorty and Chief Parker, nearly three hours: King asks a civilian review board for complaints against the police; Parker, no racial prejudice in Los Angeles, and no visit to the jailed rioters. King: Parker should go.'
      n: '[[w.garrow-bearing-the-cross]], 439–40. See [[cal.1965-08-11.states-and-cities]]. Names: King, Rustin, Yorty, Parker.'
      tags:
      - name:king-martin-luther-jr
      - name:rustin-bayard
      - name:yorty-sam
      - name:parker-william-h
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1965-08-20.king
      when: Aug. 20
      date: '1965-08-20'
      thread: king
      also:
      - states-and-cities
      c: 'King, back from Watts, and Johnson on the telephone: the riots'' cause economic, jobs the need. By King''s account Johnson explains his position on Vietnam, and pledges to speed Los Angeles''s antipoverty program.'
      n: '[Johnson and King, 5:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-martin-luther-king-lee-white-and-office), Conversation WH6508-07-8578 (Miller Center). [[w.garrow-bearing-the-cross]], 440. See [[cal.1965-08-11.states-and-cities]]. Names: King, Johnson.'
      tags:
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-09-10.war-opposition
      when: Sept. 10
      date: '1965-09-10'
      thread: war-opposition
      also:
      - king
      c: 'New York. King with Goldberg at the UN, over an hour, at the President''s instance: King for a halt to the bombing of the North and talks with the Viet Cong, and for China''s admission to the UN.'
      n: '[[w.garrow-bearing-the-cross]], 443–45. Names: King, Goldberg.'
      tags:
      - name:king-martin-luther-jr
      - name:goldberg-arthur-j
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1965-09-12.war-opposition
      when: Sept. 12
      date: '1965-09-12'
      thread: war-opposition
      also:
      - king
      c: 'King on a conference call with Levison, Wachtel, Clarence Jones, Cleveland Robinson and Andrew Young, after Dodd''s attack of Sept. 11: Johnson put Dodd up to it; he lacks the strength to fight this and civil rights both. He drops the letters to the war''s leaders and steps back from the peace issue, for now; his advisors agree. The FBI''s taps overhear.'
      n: '[[w.garrow-bearing-the-cross]], 445–46. Check: the day; Garrow cites the FBI''s reports of Sept. 12 and 13 (697 n.16). See [[cal.1965-09-10.war-opposition]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King, Levison, Young, Johnson, Dodd.'
      tags:
      - name:king-martin-luther-jr
      - name:levison-stanley-d
      - name:young-andrew-j-jr
      - name:johnson-lyndon-b
      - name:dodd-thomas-j
- add:
    entry:
      id: cal.1965-09.civil-rights-the-executive
      when: Sept.
      date: 1965-09
      thread: civil-rights-the-executive
      also:
      - voting-rights
      c: 'The presidential yacht, unpublicized: Humphrey with King, Andrew Young, Fauntroy, Greenberg, Clarence Mitchell, Morsell, McKissick, Whitney Young, Currier and Branton. King and the others protest the few federal examiners sent under the Voting Rights Act, to barely a dozen places; Mitchell calls Branton a "traitor."'
      n: '[[w.garrow-bearing-the-cross]], 447. Check: the day; Garrow cites the *Washington Evening Star*, Sept. 23, 1965 (697 n.18). Names: Humphrey, King, Andrew Young, Greenberg, Mitchell, McKissick, Whitney Young, Currier.'
      tags:
      - name:humphrey-hubert-h
      - name:king-martin-luther-jr
      - name:young-andrew-j-jr
      - name:greenberg-jack
      - name:mitchell-clarence-jr
      - name:mckissick-floyd-b
      - name:young-whitney-m-jr
      - name:currier-stephen-r
- add:
    entry:
      id: cal.1966-03-18.open-housing
      when: Mar. 18
      date: '1966-03-18'
      thread: open-housing
      also:
      - civil-rights-the-executive
      c: 'Johnson with the civil rights leaders, King among them: a new civil rights bill, on juries, violence against civil rights workers, and discrimination in selling and renting housing. Katzenbach: the housing title "particularly difficult," though "not impossible," Dirksen likely against it.'
      n: '[[w.garrow-bearing-the-cross]], 467. The message: [[cal.1966-04-28.open-housing]]. Names: Johnson, King, Katzenbach, Dirksen.'
      tags:
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:katzenbach-nicholas
      - name:dirksen-everett
- add:
    entry:
      id: cal.1966-12-15.king
      when: Dec. 15
      date: '1966-12-15'
      thread: king
      also:
      - cities-and-housing
      c: 'King before Senators Ribicoff and Robert Kennedy, at Ribicoff''s hearings on the cities: forty-four pages, drafted with Levison. The war the main obstacle to the programs the cities need; open housing in Chicago not a reality "in the next year or two."'
      n: '[[w.garrow-bearing-the-cross]], 538–40. Check: the hearing''s record. Names: King, Ribicoff, Robert F. Kennedy, Levison.'
      tags:
      - name:king-martin-luther-jr
      - name:ribicoff-abraham
      - name:kennedy-robert-f
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1967-07-25.civil-disorders
      when: July 25
      date: '1967-07-25'
      thread: civil-disorders
      also:
      - king
      c: 'Atlanta. King''s telegram to Johnson, after Detroit: "Only drastic changes in the life of the poor will provide the kind of order and stability you desire"; Congress''s "debate and delay" has sown the riots; a national agency to give a job to every person who needs one.'
      n: '[[w.garrow-bearing-the-cross]], 569–70. Names: King, Johnson.'
      tags:
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1967-07-25.king
      when: July 25
      date: '1967-07-25'
      thread: king
      also:
      - civil-disorders
      c: 'Hoover telephones Johnson: King, overheard on the FBI''s tap an hour before, told Levison and Wachtel of a plan he had heard "to get the Loop in Chicago."'
      n: '[Johnson and Hoover, 10:33 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-july-25-1967), Conversation WH6707-01-12005 (Miller Center). [[w.garrow-bearing-the-cross]], 570. Names: Hoover, Johnson, King, Levison.'
      tags:
      - name:hoover-j-edgar
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1967-08-15.king
      when: Aug. 15
      date: '1967-08-15'
      thread: king
      c: 'Atlanta, Ebenezer, SCLC''s convention. King: "Congress, more than the American people, is now running wild with racism"; civil disobedience "to dislocate the functioning of a city, without destroying it": school boycotts, sit-ins at factory gates, a camp-in in Washington. Target cities to be chosen within weeks.'
      n: '[[w.garrow-bearing-the-cross]], 573–74. Names: King.'
      tags:
      - name:king-martin-luther-jr
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1967-04-05.king
      when: Apr. 5
      date: '1967-04-05'
      thread: king
      also:
      - civil-rights-the-executive
      - war-opposition
      c: 'Roche to Johnson on King''s Riverside address: King, "inordinately ambitious and quite stupid," has "thrown in with the commies," "in desperate search of a constituency."'
      n: '[[w.garrow-bearing-the-cross]], 554. To check: Roche to Johnson, Apr. 5 and 18, 1967, Rustin Name File and Watson 29 (LBJ Library), as Garrow cites them (711 n.32). See [[cal.1967-04-04.king]]. Made public: Check; Garrow read it at the LBJ Library (711 n.32). Names: Roche, Johnson, King.'
      tags:
      - name:roche-john-p
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1967-04-08.king
      when: Apr. 8
      date: '1967-04-08'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'Christian to Johnson: Carl Rowan "exploring the Martin Luther King matter"; all in the movement have known King takes advice "from a Communist"; Rowan wants "to take out after King."'
      n: '[[w.garrow-bearing-the-cross]], 554–55. To check: Christian to Johnson, Apr. 8, 1967, King Name File (LBJ Library), as Garrow cites it (711 n.32). See [[cal.1967-04-04.king]]. Made public: Check; Garrow read it at the LBJ Library (711 n.32). Names: Christian, Johnson, Rowan, King.'
      tags:
      - name:christian-george
      - name:johnson-lyndon-b
      - name:rowan-carl-t
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1967-04-19.king
      when: Apr. 19
      date: '1967-04-19'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'Hoover to Johnson, through Mildred Stegall: "Based on King''s recent activities and public utterances, it is clear that he is an instrument in the hands of subversive forces seeking to undermine our nation."'
      n: '[[w.garrow-bearing-the-cross]], 555. To check: Hoover to Mildred Stegall, Apr. 19, 1967, FBI 100-106670-2895, as Garrow cites it (711 n.32). See [[cal.1967-04-04.king]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: Hoover, Johnson, King.'
      tags:
      - name:hoover-j-edgar
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1967-04-25.elections-1968
      when: Apr. 25
      date: '1967-04-25'
      thread: elections-1968
      also:
      - king
      - war-opposition
      c: 'Atlanta, Ebenezer, after the talk of a King–Spock ticket. King: "I have no interest in any political candidacy and I am issuing this statement to remove doubts of my position on this subject."'
      n: '[[w.garrow-bearing-the-cross]], 557–59. To check: King, "Statement," Apr. 25, 1967 (King Papers), as Garrow cites it (712 n.37). Names: King, Spock.'
      tags:
      - name:king-martin-luther-jr
      - name:spock-benjamin
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1967-07-10.king
      when: July 10
      date: '1967-07-10'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'DeLoach to Tolson: Johnson has asked whether King''s tie to Levison could be made public, and how. DeLoach: through the newspapers; Ramsey Clark against any leak about King.'
      n: '[[w.garrow-bearing-the-cross]], 570. To check: DeLoach to Tolson, July 10, 1967, FBI 100-106670-NR (sec. 84), as Garrow cites it (713 n.50). Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: DeLoach, Johnson, King, Levison, Clark.'
      tags:
      - name:deloach-cartha
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:levison-stanley-d
      - name:clark-ramsey
- add:
    entry:
      id: cal.1967-09-13.king-poor-peoples
      when: Sept. 13–17
      date: '1967-09-13'
      thread: king-poor-peoples
      also:
      - poverty
      c: 'SCLC''s staff retreat, Airlie House, Warrenton, Va. Marian Wright''s plan: the poor, with clergy and labor leaders, to sit in at Wirtz''s office until jobs are given. King: waves of the poor to Washington for "jobs or income," to stay, in civil disobedience, until the government acts; the whole staff on it. Money sought too against Rivers and Stennis.'
      n: '[[w.garrow-bearing-the-cross]], 576–78. To check: Tom Offenburger''s notes of the retreat, Sept. 13–17, 1967, as Garrow cites them (714 n.6). The announcement: [[cal.1967-12-04.king]]. Names: Wright, Wirtz, King, Rivers, Stennis.'
      tags:
      - name:wright-marian
      - name:wirtz-w-willard
      - name:king-martin-luther-jr
      - name:rivers-l-mendel
      - name:stennis-john-c
      - state:va
- add:
    entry:
      id: cal.1967-10-23.civil-disorders-kerner
      when: Oct. 23
      date: '1967-10-23'
      thread: civil-disorders-kerner
      also:
      - king-poor-peoples
      c: 'King before the Kerner Commission: the riots'' cause "the greater crimes of white society": the backlash, unemployment, discrimination, the war. To reporters after: the poor to Washington, to "just camp here and stay"; "The city will not function" until Congress makes "jobs or income a reality for every American citizen."'
      n: '[[w.garrow-bearing-the-cross]], 579. To check: King, "Statement," Oct. 23, 1967, and his press conference that day (King Papers), as Garrow cites them (715 n.8). See [[cal.1967-07-27.civil-disorders]]. Names: King.'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1968-01-16.king-poor-peoples
      when: Jan. 16
      date: '1968-01-16'
      thread: king-poor-peoples
      c: 'Atlanta, Ebenezer, SCLC''s staff retreat. King to the press: the campaign to open in early April; "jobs or income"; the demands in March, a negative income tax or a guaranteed annual income still to be chosen; blocking traffic "a last resort."'
      n: '[[w.garrow-bearing-the-cross]], 592–93. To check: King, "Press Conference," Jan. 16, 1968 (King Papers), as Garrow cites it (717 n.20). See [[cal.1967-12-04.king]]. Names: King.'
      tags:
      - name:king-martin-luther-jr
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1968-02-07.king-poor-peoples
      when: Feb. 7
      date: '1968-02-07'
      thread: king-poor-peoples
      also:
      - poverty
      c: 'Washington. King gives the campaign''s demands: $30 billion a year against poverty; at the least, a commitment to full employment, a guaranteed annual income, and 500,000 low-cost houses a year. "Our protests will center on the government, Congress, and not the city at large."'
      n: '[[w.garrow-bearing-the-cross]], 595–96. Check: the day; Garrow has it the morning after the march through Arlington Cemetery, and cites the papers of Feb. 7 and 8 (717 n.23). See [[cal.1967-12-04.king]]. Names: King.'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1968-02-14.king-poor-peoples
      when: Feb. 14
      date: '1968-02-14'
      thread: king-poor-peoples
      also:
      - civil-rights-the-executive
      c: 'Temple to Johnson: "We have permitted the Stokely Carmichaels, the Rap Browns, and the Martin Luther Kings to cloak themselves in an aura of respectability to which they are not entitled"; King''s plan "criminal disobedience"; the President to "publicly unmask" it.'
      n: '[[w.garrow-bearing-the-cross]], 597. To check: Temple to Johnson, Feb. 14, 1968, Ex HU2 Box 7 (LBJ Library), as Garrow cites it (717 n.25). See [[cal.1967-12-04.king]]. Made public: Check; Garrow read it at the LBJ Library (717 n.25). Names: Temple, Johnson, Carmichael, Brown, King.'
      tags:
      - name:temple-larry
      - name:johnson-lyndon-b
      - name:carmichael-stokely
      - name:brown-h-rap
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1968-03-04.king-poor-peoples
      when: Mar. 4
      date: '1968-03-04'
      thread: king-poor-peoples
      also:
      - civil-disorders-kerner
      c: 'King on the Kerner report: its finding that white racism is the root of the riots "an important confession of a harsh truth." The campaign''s first phase "a lobby-in against Congress" from its return, Apr. 22; three caravans, from Milwaukee, Boston and Mississippi, by car, foot and mule cart, in Washington early in May.'
      n: '[[w.garrow-bearing-the-cross]], 600. To check: King, "Statement," Mar. 4, 1968 (King Papers; SCLC), as Garrow cites it (718 n.29). See [[cal.1967-12-04.king]]. Names: King.'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1968-03-12.king-poor-peoples
      when: Mar. 12
      date: '1968-03-12'
      thread: king-poor-peoples
      c: 'Atlanta. King to SCLC''s executive staff, at lunch: the campaign "a continuing, massive lobby-in" at Congress. "I think we''ve got to pit the President against the Congress. I don''t think we ought to make this an anti-Lyndon Johnson battle"; Johnson to be "almost ... forced to support us."'
      n: '[[w.garrow-bearing-the-cross]], 601. Check: the day; Garrow has the lunch after the research committee''s meeting in New York, Mar. 11, and two days before the minority groups'' conference, Mar. 14 (718 n.31). See [[cal.1967-12-04.king]]. Names: King, Johnson.'
      tags:
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1968-03-28.king
      when: Mar. 28
      date: '1968-03-28'
      thread: king
      also:
      - king-memphis
      - king-poor-peoples
      c: King, from Memphis, on the march with Hosea Williams in Atlanta. Williams tells Jim Harrison, SCLC's comptroller and a paid FBI informant; Harrison tells his control agent. FBI headquarters orders full information on King's part in the march, for leaks to cooperative reporters against the Poor People's Campaign.
      n: '[[w.garrow-bearing-the-cross]], 611. To check: FBI 157-9146-38, 1390, and ME 157-1092-167, 168, Mar. 28, 1968, as Garrow cites them (721 n.41). See [[cal.1968-03-28.king-memphis]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King, Williams.'
      tags:
      - name:king-martin-luther-jr
      - name:williams-hosea
      - state:tn
      - city:memphis
- add:
    entry:
      id: cal.1968-03-31.king
      when: Mar. 31
      date: '1968-03-31'
      thread: king
      also:
      - king-poor-peoples
      - elections-1968
      c: 'Washington, National Cathedral, King''s sermon. To reporters: the campaign goes on, to be called off only for "a commitment with a positive timetable for this summer"; "I would be glad to talk to President Johnson"; "I cannot support President Johnson for re-election." Then with Andrew Young, Conyers and Hatcher on a "commission of inquiry" into the candidates.'
      n: '[[w.garrow-bearing-the-cross]], 618. To check: King, "Remaining Awake ...," Mar. 31, 1968 (King Papers), as Garrow cites it (721 n.47). See [[cal.1967-12-04.king]]. Names: King, Johnson, Young, Conyers, Hatcher.'
      tags:
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      - name:young-andrew-j-jr
      - name:conyers-john-jr
      - name:hatcher-richard-g
