    base: 3aa19a60
    set:
      n: '[*New York Times*, Mar. 29, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/29/issue.html). [[w.garrow-bearing-the-cross]], 609–11 (the march, the windows and the looting on Beale, the police, a young man shot dead, King led away). Check: Garrow, 611, 613, has the second march resolved that night at the Holiday Inn Rivermont and announced at King''s press conference, Mar. 29. See [[cal.1968-03-18.king]]. Names: King, Ellington, Loeb.'
- edit:
    id: cal.1968-04-03.king
    base: 011a0dd1
    set:
      c: 'Memphis. The federal district court bars a second march, on the city''s petition. King at Mason Temple, at night: "I may not get there with you. But I want you to know tonight, that we, as a people, will get to the promised land."'
      n: '[*New York Times*, Apr. 4, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/04/issue.html). [[w.garrow-bearing-the-cross]], 619–21 (Judge Bailey Brown''s restraining order, ten days, served at the Lorraine; the speech). To check: *City of Memphis v. King*, No. C-68-80 (W.D. Tenn. Apr. 3, 1968), as Garrow cites it (722 n.49). See [[cal.1968-03-18.king]]. Names: King.'
