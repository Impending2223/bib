ops:
  - edit:
      id: cal.thread.vietnam
      base: 0b0b333d
      set:
        c: "The war in Vietnam and the American commitment: the decisions in Washington, Saigon and Hanoi, the fighting, the bombing, and the talks. Tây Ninh; the Caravelle petition; the Party's Third Congress; the paratroop coup; the National Liberation Front; the Counterinsurgency Plan; NSAM 52; Taylor–Rostow; NSAM 111; MACV; strategic hamlets; Mansfield's report."
        c2: "The war in Vietnam and the American commitment: the decisions in Washington, Saigon and Hanoi, the fighting, the bombing, and the talks. Ấp Bắc; the Buddhist crisis; cable 243; the coup; NSAM 273; Khánh's coup; the Gulf of Tonkin and the resolution; Pleiku; Rolling Thunder; Đà Nẵng; Johns Hopkins; July 28; Ia Drang; the pause and the peace offensive."
        c3: "The war in Vietnam and the American commitment: the decisions in Washington, Saigon and Hanoi, the fighting, the bombing, and the talks. The Fulbright hearings; Honolulu; the Buddhist Uprising; the oil strikes; Thiệu and Kỳ elected; San Antonio; McNamara's November memorandum; Tet; Mỹ Lai; the 205,000 request; the Mar. 31 address; the Paris talks; the bombing halt and Saigon's refusal."
