        date: '1960'
        thread: china-leadership
        c: 'Wang Congwu 王從吾, for the Central Control Commission 中央監委, sends Liu Shaoqi 劉少奇 a report on Xinyang 信陽. Liu comments: rouse the masses and turn the situation around. Sent to Henan 河南, the comment sets the provincial committee to changing Xinyang''s leadership.'
        n: '[[w.yang-jisheng-mubei]], I, 74 (Li Jian''s account). Made public: 2008. To check: Central Control Commission (Wang Congwu), report on Xinyang to Liu Shaoqi, 1960, with Liu''s comment (cited by [[w.yang-jisheng-mubei]], I, 74; no note). Check: the day, which the book does not give. Names: Liu Shaoqi.'
