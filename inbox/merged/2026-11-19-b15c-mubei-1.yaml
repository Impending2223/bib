  - cite:
      id: cal.1960-03-24.china-leadership
      item: '[[w.yang-jisheng-mubei]], II, 1170 (Mao presides over an enlarged Standing Committee meeting at Tianjin, Mar. 24–25, on seventeen questions, among them urban communes of every size everywhere; the meeting holds to the three red flags but opposes the communist wind)'
