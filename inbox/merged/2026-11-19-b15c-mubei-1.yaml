        thread: china-leadership
        c: 'The work group of the Central Committee''s General Office 中央辦公廳 and the Henan 河南 committee, Yu Sang 于桑 and Wu Renwen 武人文, reports on deaths and grain in Xinyang 信陽 prefecture: the 1959 crop 3.258 billion jin, 46.1 percent under 1958''s, against the prefectural committee''s estimate of 6.427 billion; procurement set at 960 million, 43 million above 1958, and raised 5 percent to 1.049 billion, leaving 164.5 jin of grain a head for the year. The group thinks the true death toll higher than the tally.'
