      item: '[[w.yang-jisheng-mubei]], II, 1170 (the enlarged Politburo at the Jinjiang Hotel, Shanghai, June 10–18; Mao, in his speech of June 14, proposes lowering the plan''s targets, steel''s quality, kinds and scale first and its quantity second)'
