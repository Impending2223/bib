  - add:
      entry:
        id: cal.1960-02.china-leadership-2
        when: Feb.
        date: '1960-02'
        thread: china-leadership
        c: 'Xinyang 信陽 prefecture. Guo 郭, a section chief of the Ministry of the Interior 內務部, investigates: 200,000 to 300,000 are said to have starved. He returns to Peking 北京 at once to report. His ministry''s leaders report to Xi Zhongxun 習仲勛, secretary-general of the State Council 國務院; Xi reports to Dong Biwu 董必武, secretary of the Central Control Commission 中央監委; Dong sends Li Jian 李堅 and Li Zhenhai 李振海 to Xinyang. Zhang Shufan''s 張樹藩 recollection.'
        n: '[[w.yang-jisheng-mubei]], I, 72. Made public: 1998. To check: [[w.zhang-shufan-xinyang-shijian]] (cited by [[w.yang-jisheng-mubei]], I, 72 n.57). Check: the day; Li Jian''s own account has the Commission''s group sent in April, on a report from the Henan supervisory committee (I, 72–73). Names: Dong Biwu.'
        src:
          c: 1a72de56
          rows:
          - 'w.yang-jisheng-mubei I, 72: all'
        tags:
        - polity:prc
        - name:dong-biwu
        - vis:only:prc
