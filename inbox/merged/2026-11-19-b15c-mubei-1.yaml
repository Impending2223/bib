  - cite:
      id: cal.1960-07-05.china-leadership
      item: '[[w.yang-jisheng-mubei]], II, 1171 (the Beidaihe work conference, July 5–Aug. 10, studies the home economy with the Sino-Soviet question, adopts three directives, on saving grain and steel through output and thrift, on all the Party farming and growing grain, and on an urgent country-wide drive to buy for export, and proposes an adjustment of the economy)'
      units: B
  - cite:
      id: cal.1960-01-07.china-leadership
      item: '[[w.yang-jisheng-mubei]], II, 1169 (the Shanghai meeting, Jan. 7–17, calls 1960 a leap year; sets eight years to move the communes from basic ownership by the team to basic ownership by the commune, three to complete the forty-article agricultural program, five to catch Britain; urban communes to be begun at once)'
      units: A-B, J
