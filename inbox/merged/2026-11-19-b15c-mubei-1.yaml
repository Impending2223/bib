      item: '[[w.yang-jisheng-mubei]], II, 1170 (the second session of the Second National People''s Congress, Mar. 30 to Apr. 10, adopts the national agricultural development program for 1956–67 and the resolution on striving to carry it out ahead of time; the *Renmin ribao* editorial)'
