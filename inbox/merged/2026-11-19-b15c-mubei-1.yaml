  - add:
      entry:
        id: cal.1960-04.china-leadership-12
        when: Apr., after the 12th
        date: '1960-04'
        at: after 1960-04-12
        thread: china-leadership
        c: 'Li Jian 李堅 of the Central Control Commission 中央監委, with two aides, two men from the province and two from Xinyang 信陽, goes through Luoshan 羅山, Huangchuan 潢川, Gushi 固始, Shangcheng 商城, Xin county 新縣 and Guangshan 光山: unburied dead in the ditches, Gushi''s put at over 30,000, Shangcheng''s at tens of thousands. Lu Xianwen 路憲文 puts the deaths to exaggeration and the mess halls; Zhang Shufan 張樹藩 gives 400,000, the public security bureau''s figure. Li has the county supervisory secretaries check each county''s count (1,050,000, he is told later), returns by Zhengzhou 鄭州 and attends Mao''s 毛澤東 meeting with the provincial cadres.'
        n: '[[w.yang-jisheng-mubei]], I, 73–74 (Li Jian''s account). Made public: 2008. To check: Li Jian, interview with Yang Jisheng, Beijing, Mar. 2001 (cited by [[w.yang-jisheng-mubei]], I, 72–74; no note). Check: the days; Mao receives more than ten thousand Henan cadres at Zhengzhou May 11 ([[cal.1960-05-11.china-leadership-6]]), which the book may mean; Li''s note that Wu Zhipu had the Henan committee''s agricultural secretary talk to him; Li asked for more relief and a slower pace on the waterworks. Names: Mao Zedong.'
        src:
          c: 7b9c634b
          rows:
          - 'w.yang-jisheng-mubei I, 73-74: all'
          - 'via w.yang-jisheng-mubei I, 73 n.t1: all'
          - 'via w.yang-jisheng-mubei I, 74 n.t1: all'
        tags:
