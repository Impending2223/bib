      item: '[[w.yang-jisheng-mubei]], II, 1171 (Mao calls the leaders of the four great regions, North, Central-South, Northeast and Southwest, Oct. 23–26, to hear on farming and on righting the communist wind; Henan and Shandong, where trouble showed early, are discussed, and Wu Zhipu reports on Xinyang)'
      units: B
  - cite:
