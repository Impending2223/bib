        id: cal.1960-05.china-leadership-9
        when: May
        date: '1960-05'
        thread: china-leadership
        c: Huangchuan 潢川 county, Sanpi si 傘陂寺 commune. On notice that a provincial work group is coming, the commune's Party committee orders its brigades by telephone and by men sent that night to report no more than 500-odd dead; Tuanjie 團結 brigade divides its 34 among its eight teams and counts no child under 12. The commune reports 523 dead, then 3,889, later 2,907; the work group finds 6,668.
        n: '[[w.yang-jisheng-mubei]], I, 68. The words: 連夜 (I, 68), of the men sent to the brigades. Made public: 2008. To check: Provincial, prefectural and county joint inspection group, Sanpi si commune team, "Report on the inquiry into deaths in Sanpi si people''s commune" (cited by [[w.yang-jisheng-mubei]], I, 68 n.50). Check: the day in May; the notice and the brigade''s order are unsourced in the book.'
        src:
          c: fd764e04
          rows:
          - 'w.yang-jisheng-mubei I, 68: all'
        tags:
        - polity:prc
        - vis:only:prc
  - add:
      entry:
        id: cal.1960-05.china-leadership-10
        when: May
        date: '1960-05'
        thread: china-leadership
        c: Yang Weiping 楊蔚屏, secretary of the Henan committee's secretariat 河南省委書記處書記, inspects Xinyang 信陽 for ten days, Wang Binglin 王秉林 of the prefectural committee attending him. He does not raise the deaths. Ma Longshan 馬龍山 tells him Guangshan 光山 has lost 38,800; Yang says to get the number clear in their own minds, that the cause was mainly the disaster, and that there is no need to inquire again.
        n: '[[w.yang-jisheng-mubei]], I, 68–69 (Wang Binglin''s account). Made public: 2008. To check: Wang Binglin 王秉林, deputy secretary-general of the Xinyang prefectural committee, "Materials exposing Yang Weiping," Dec. 1960 (cited by [[w.yang-jisheng-mubei]], I, 69 n.53–54, 71 n.55). Check: the day in May; the account is Wang''s, written in the winter when Yang was under attack.'
