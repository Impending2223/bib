        thread: china-leadership
        c: 'The Huangchuan 潢川 county committee''s second inspection of its deaths, after the Xinyang 信陽 incident: it meant to keep the county''s red flag for grain procurement a third year; at 60 percent done, ranked third from the bottom on the prefectural telephone conference and named there by Song Zhihe 宋致和, a provincial secretary, it could not tell plain dealing from rightism and feared to report low yields.'
        n: '[[w.yang-jisheng-mubei]], I, 46 n.19. Made public: 2008. To check: Huangchuan County Party Committee, "Second inspection of the problem of deaths," June 3, 1960 (cited by [[w.yang-jisheng-mubei]], I, 46 n.19).'
