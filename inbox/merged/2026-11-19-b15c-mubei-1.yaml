      entry:
        id: cal.1960-07-20.china-leadership-5
        when: July 20
        date: '1960-07-20'
        thread: china-leadership
        place: jigongshan
        c: 'Jigongshan 雞公山. The Xinyang 信陽 prefectural committee''s enlarged standing committee meeting opens (to Aug. 15): Yang Weiping 楊蔚屏 and Li Li 李立, secretaries of the Henan 河南 committee''s secretariat, and Liu Mingbang 劉名榜, secretary of its supervisory committee, preside for the province. In its course, undated: it goes on affirming the "fine situation"; Yang says 480,000 dead or 450,000 makes no difference, and that Mao''s 毛澤東 "one finger" gives the chance to sit down and settle; Zhang Shufan 張樹藩 speaks three times, to over 14,000 characters; Lu Xianwen 路憲文 and others meet against him in secret; Wang Guohua 王國華, a vice-governor, names Lu from the floor; the meeting decides to arrest Ma Longshan 馬龍山.'
        n: '[[w.yang-jisheng-mubei]], I, 69–71 (Wang Binglin''s, Li Ruiying''s and Yu Dehong''s accounts). Made public: 2008. To check: Wang Binglin, "Materials exposing Yang Weiping," Dec. 1960 (cited by [[w.yang-jisheng-mubei]], I, 69 n.54, for Yang Weiping''s words); Li Ruiying 李瑞英, head of the Xinyang women''s federation, account to Yang Jisheng, Beijing, 2000–01 (cited by [[w.yang-jisheng-mubei]], I, 69; no note); Yu Dehong 余德鴻, secretary to Zhang Shufan, "Guanyu Xinyang shijian de yishu" 《關於信陽事件的憶述》, typescript of Sept. 17, 2001, sent to Yang Jisheng Nov. 9, 2001 (cited by [[w.yang-jisheng-mubei]], I, 70; no note). Check: the book dates the opening (Yu Dehong''s account, July 20) and the close (Aug. 15) only; Li Ruiying''s account places the decision to arrest Ma at the meeting. Names: Mao Zedong.'
        src:
          c: 60a222f2
          rows:
