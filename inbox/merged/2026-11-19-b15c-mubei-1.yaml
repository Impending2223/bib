        n: '[[w.yang-jisheng-mubei]], I, 74 (Li Jian''s account). Made public: 2008. To check: Li Jian, interview with Yang Jisheng, Beijing, Mar. 2001 (cited by [[w.yang-jisheng-mubei]], I, 72–74; no note). Check: the day, which the book does not give; after Li''s return from the trip of April and May (I, 74). Names: Tan Zhenlin.'
