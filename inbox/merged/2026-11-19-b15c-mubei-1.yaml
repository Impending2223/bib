        c: 'Liu Lantao 劉瀾濤, standing secretary 常務書記 of the Central Control Commission 中央監委, sends Yu Sang 于桑 and others of the Ministry of Public Security 公安部 to Henan 河南; Yu''s count of the Xinyang 信陽 dead is 600,000.'
        n: '[[w.yang-jisheng-mubei]], I, 74 (Li Jian''s account). Made public: 2008. To check: Li Jian, interview with Yang Jisheng, Beijing, Mar. 2001 (cited by [[w.yang-jisheng-mubei]], I, 72–74; no note). Check: the day, which the book does not give; after Tan Zhenlin''s objection to the Commission''s report ([[cal.1960.china-leadership-13]]); Yu Sang is named with Wu Renwen in the work group''s report of June 18 (I, 38 n.8; [[cal.1960-06-18.china-leadership-6]]).'
