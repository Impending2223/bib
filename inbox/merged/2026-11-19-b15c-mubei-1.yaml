        n: '[[w.yang-jisheng-mubei]], I, 67, 72. Made public: 2008. To check: Henan Provincial Supervisory Committee, report of April 1960 to the Central Control Commission on deaths from hunger in Gushi county (cited by [[w.yang-jisheng-mubei]], I, 67, 72; no note). Check: the book gives no day in April.'
