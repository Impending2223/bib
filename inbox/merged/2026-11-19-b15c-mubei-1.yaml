        place: lanzhou
        c: 'Lanzhou 蘭州. The Northwest Bureau''s meeting takes up Gansu''s 甘肅 problems and exposes the errors of Zhang Zhongliang 張仲良, He Chenghua 何承華, Ruan Dimin 阮迪民 and Wang Bingxiang 王秉祥, calling them "private and leftist." The Gansu committee is reorganized, Wang Feng 汪鋒 replacing Zhang as first secretary; prefectural secretaries including Dou Minghai 竇明海, Liu Fenghao 劉逢皓 and Hu Xueyi 胡學義 are criticized, and some prefectural committees remade.'
