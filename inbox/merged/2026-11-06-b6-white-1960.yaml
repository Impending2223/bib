      id: cal.1960-10-29.elections-1960-nixon
      when: Oct. 29
      date: '1960-10-29'
      thread: elections-1960-nixon
      c: 'Chicago, Saturday. A White House aide, there for a Republican Congressman, hears by chance from a Nixon aide that
        Nixon means to call heavily on the President in the last week. The White House aide: Eisenhower eager to help, but
        he must be informed and asked, not commandeered.'
      n: '[[w.white-making-of-the-president]], 309. Reply: [[cal.1960-10-31.elections-1960]]. Names: Nixon, Eisenhower.'
