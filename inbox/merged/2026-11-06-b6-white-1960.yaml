      when: Oct. 17
      date: '1960-10-17'
      thread: elections-1960-kennedy
      c: Middletown, Ohio, the Manchester Hotel. Goodwin, with the campaign's portable library, drafts the Latin American
        speech for Tampa; Sorensen, at Columbus, has begun the national-defense speech from the Cox office's material. On
        the night flight to Miami Kennedy reads and revises Goodwin's draft.
      n: '[[w.white-making-of-the-president]], 325. See [[cal.1960-10-16.elections-1960-kennedy]]. Names: Goodwin, Sorensen,
