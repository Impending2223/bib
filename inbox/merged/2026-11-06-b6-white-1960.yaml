      id: cal.1960-09-09.elections-1960-religion
      when: Sept. 9
      date: '1960-09-09'
      thread: elections-1960-religion
      also:
      - elections-1960-kennedy
      c: 'Los Angeles, the afternoon. Kennedy''s press conference, a tense exchange of questions on religion, ended by one
        on the expected child: "How do you know it''s going to be a boy?" Kennedy: "My wife told me." On the stump since Eugene,
        Ore., two days before, his wife''s absence explained by her pregnancy.'
      n: 'Press Conference of Senator John F. Kennedy, Lockheed Air Terminal, Burbank, CA, [APP](https://www.presidency.ucsb.edu/documents/press-conference-senator-john-f-kennedy-lockheed-air-terminal-burbank-ca)
        (Sept. 9, 1960). [[w.white-making-of-the-president]], 255–56. Check: whether White''s press conference "that afternoon
        in Los Angeles" is APP''s at the Burbank air terminal (not read). See [[cal.1960-09-08.elections-1960]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
