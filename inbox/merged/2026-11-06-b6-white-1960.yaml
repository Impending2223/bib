    entry:
      id: cal.1960-07-13.elections-1960-los-angeles
      when: July 13
      date: '1960-07-13'
      thread: elections-1960-los-angeles
      c: 'The afternoon and evening of the balloting. Kennedy slips out the back of his hideaway on North Rossmore Boulevard
        with Powers to the Beverly Hills villa his father has rented: the pool, Irish stew with his father and mother, Powers
        and Anne Gargan. Back at eight, he marks the vote he expects from each State on his headquarters'' sample ballot,
        from memory, and by his special telephone finds it matches Robert Kennedy''s tally to the half-vote. At Wyoming, to
        Powers: "This could do it."'
      n: '[[w.white-making-of-the-president]], 168–69. See [[cal.1960-07-13.elections-1960]]. Names: Kennedy, Powers, Joseph
        Kennedy, Robert Kennedy.'
      tags:
