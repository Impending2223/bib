- add:
    entry:
      id: cal.1960-08.elections-1960-nixon
      when: Aug.–Sept.
      date: 1960-08
      thread: elections-1960-nixon
      c: 'One of Nixon''s inner group to White, of Eisenhower: "All we want out of Ike is for him to handle Khrushchev at
        the UN and not let things blow up there. That''s all."'
      n: '[[w.white-making-of-the-president]], 309. Check: the day; White: "in the early euphoric stages of Round One." Names:
        Nixon, Eisenhower, Khrushchev, White.'
