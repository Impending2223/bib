      when: Aug.
      date: 1960-08
      thread: elections-1960-kennedy
      c: 'Salinger to White, an evening at home: "You know what''s happened to ''our smooth well-oiled machine''? It''s diffusing.
        This country is just too big, there''s too much of it."'
      n: '[[w.white-making-of-the-president]], 251. Check: the day. See [[cal.1960-08.elections-1960-12]]. Names: Salinger,
