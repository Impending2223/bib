      - china
      c: Ceaușescu and the Romanian leaders talk with Mikoyan and tell him again that holding the March meeting of the parties was a mistake, as Ceaușescu tells Zhou the next day.
      n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Ceaușescu: ''In discussions that we had with comrade Mikoyan yesterday''. The day is the Archive''s Mar. 25 less one; the Chinese chronologies date the talks with Zhou Mar. 26, which would make it Mar. 25. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 252, 690–714). Names: Ceaușescu, Mikoyan. Check: the day and the place.'
