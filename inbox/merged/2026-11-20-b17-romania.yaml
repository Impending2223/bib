- add:
    entry:
      id: cal.1966-02-17.vietnam-diplomacy
      when: 'Feb. 17'
      date: '1966-02-17'
      place: bucharest
      thread: vietnam-diplomacy
      also: [china, soviet-union]
      c: 'Ceaușescu receives Císař, the Czechoslovak ambassador, and says Romania backs the DRV in all it asks; a conference without Vietnam and China would serve nothing, and the Polish letter to the Chinese only added to mistrust. Císař: patient negotiation, not epithets, is the way; the Polish intent was good.'
      n: '"[Transcript of Discussions on the Occasion of the Reception by Comrade Nicolae Ceausescu of the S. R. Czechoslovak Ambassador in Bucharest, Cestmir Cisar](https://digitalarchive.umd.edu/document/122563)" (Feb. 17, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 15/1966, f. 1–8, trans. Larry L. Watts, Wilson Center Digital Archive. See [[cal.1966-01-26.vietnam-diplomacy]]. Names: Ceaușescu. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:czechoslovakia
      - name:ceausescu-nicolae
      - vis:only:romania+czechoslovakia
- add:
    entry:
      id: cal.1966-02-24.vietnam-diplomacy
      when: 'Feb. 24'
      date: '1966-02-24'
      place: bucharest
      thread: vietnam-diplomacy
      also: [china, soviet-union]
      c: 'Ceaușescu tells Basov, the Soviet ambassador, why Romania answered the Polish letter briefly: the Poles should have consulted the Vietnamese and gone to the Chinese direct, and Romania will not interfere. Basov asks the way out; Ceaușescu: direct contacts, and meanwhile aid to the Vietnamese.'
      n: '"[Transcript of Discussions on the Occasion of the Reception by Comrade Nicolae Ceausescu of the Soviet Ambassador in Bucharest, A. V. Basov](https://digitalarchive.umd.edu/document/122564)" (Feb. 24, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 16/1966, f. 3, 19–20, trans. Larry L. Watts, Wilson Center Digital Archive. See [[cal.1966-01-26.vietnam-diplomacy]]. Names: Ceaușescu. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:ussr
      - name:ceausescu-nicolae
      - vis:only:romania+ussr
- add:
    entry:
      id: cal.1966-03-31.soviet-union-leadership
      when: 'Mar. 31'
      date: '1966-03-31'
      place: moscow
      thread: soviet-union-leadership
      also: [china, vietnam-diplomacy]
      c: 'Ceaușescu and Shelepin talk at the CPSU Central Committee''s dinner for the foreign delegations to the 23rd Congress. Shelepin, by the Romanian note: the Chinese teach hatred of the Soviet people and will not meet; the Presidium decided a week before the Congress on three more missile regiments, free, for Vietnam; no prospect of unity soon. Ceaușescu: unity will come; Zhou Enlai visits Romania in May.'
      n: '"[Discussion of Comrade Nicolae Ceausescu with A. N. Shelepin, at a Dinner Offered by the CPSU CC, in Honor of the Foreign Delegations at the 23rd Congress of the CPSU](https://digitalarchive.umd.edu/document/122565)" (Mar. 31, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 28/1966, f. 1–6, trans. Larry L. Watts, Wilson Center Digital Archive. Held at the Congress in Moscow; the transcript names no place. See [[cal.1966-01-26.vietnam-diplomacy]]. To check: the CPSU Presidium''s decision on the three missile regiments, as Shelepin gives it. Names: Ceaușescu, Shelepin, Zhou Enlai. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:ussr
      - name:ceausescu-nicolae
      - name:shelepin-aleksandr-n
      - name:zhou-enlai
      - vis:only:romania+ussr
- add:
    entry:
      id: cal.1966-04-28.vietnam-diplomacy
      when: 'Apr. 28'
      date: '1966-04-28'
      place: bucharest
      thread: vietnam-diplomacy
      also: [europe-and-the-alliance-france]
      c: 'Ceaușescu, Maurer and Mănescu talk with Couve de Murville, the French foreign minister. Ceaușescu: the Americans must be helped to see Vietnam can be settled only by their leaving, and as many countries as can should press them. Couve: France has talked with the U.S. about it, the Americans are not ready, and a war once begun may spread, as in Cambodia.'
      n: '"[Transcript of Conversations in Bucharest Between the Romanian Side and Maurice Couve de Murville, Foreign Minister of France](https://digitalarchive.umd.edu/document/122567)" (Apr. 28, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 64/1966, f. 2, 4–7, trans. Larry L. Watts, Wilson Center Digital Archive. Names: Ceaușescu, Maurer, Mănescu, Couve de Murville. Check: the year the document was first printed or posted; the Archive page gives none.'
