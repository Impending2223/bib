- add:
    entry:
      id: cal.1965-04-23.soviet-union
      when: 'Apr. 23'
      date: '1965-04-23'
      thread: soviet-union
      also: [china, vietnam-diplomacy]
      c: 'Zhegalin, the Soviet ambassador, gives Ceaușescu three letters for the CPSU Presidium: the CPSU''s to the Chinese and Vietnamese parties, the Chinese reply, and one telling what passed. He says Soviet arms aid to Vietnam runs to hundreds of millions of rubles, and invites 3–5 Romanians, and 5–6 officers, to the 20th anniversary of the victory over Germany. Ceaușescu: the Political Bureau will study them.'
      n: '"[Transcript of the Discussions on the Occasion of the Reception of Soviet Ambassador I. K. Zhegalin by Comrade Nicolae Ceausescu](https://digitalarchive.umd.edu/document/122553)" (Apr. 23, 1965), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 50/1965, f. 2–3, trans. Larry L. Watts, Wilson Center Digital Archive. To check: the CPSU''s letter to the Chinese Communist Party and the Workers'' Party of Vietnam, and the Chinese reply, named in the transcript. Names: Ceaușescu. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:ussr
      - name:ceausescu-nicolae
      - vis:only:romania+ussr
- add:
    entry:
      id: cal.1965-05-28.vietnam-hanoi-3
      when: 'May 28'
      date: '1965-05-28'
      place: bucharest
      thread: vietnam-hanoi
      also: [vietnam-diplomacy]
      c: 'Hoang Tu, the DRV''s ambassador, briefs Ceaușescu: by his account the American plans have failed and the National Liberation Front holds most of the South; the DRV cannot accept peace proposals now. He adds what the Workers'' Party delegation discussed with the CPSU at Moscow. Ceaușescu replies.'
      n: '"[Note of Conversation on Occasion of the Reception of the Ambassador of the Democratic Republic of Vietnam in Bucharest, Hoang Tu](https://digitalarchive.umd.edu/document/122554)" (May 28, 1965), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 23/1965, f. 4–7, trans. Larry L. Watts, Wilson Center Digital Archive. Names: Ceaușescu. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:ceausescu-nicolae
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1965-07-24.vietnam-hanoi
      when: 'July 24'
      date: '1965-07-24'
      place: bucharest
      thread: vietnam-hanoi
      also: [vietnam-diplomacy]
      c: 'Ceaușescu and Maurer receive the Workers'' Party of Vietnam''s delegation to the RCP congress, Lê Đức Thọ, Tran Quang Huy and Ambassador Hoang Tu. Thọ: the Americans want talks from a position of force; the Vietnamese oppose negotiations and sign only when sure of winning, as at Geneva in 1954 after Dien Bien Phu.'
      n: '"[Transcript of the Reception of a Workers Party of Vietnam Delegation at the Central Committee of the Romanian Communist Party](https://digitalarchive.umd.edu/document/122556)" (July 24, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 279, 762, an excerpt). Names: Ceaușescu, Maurer, Lê Đức Thọ. The place: the Central Committee, by the Archive''s title.'
      tags:
      - polity:romania
      - polity:drv
      - name:ceausescu-nicolae
      - name:maurer-ion-gheorghe
      - name:le-duc-tho
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1965-10-03.vietnam-diplomacy
      when: 'Oct. 3'
      date: '1965-10-03'
      thread: vietnam-diplomacy
      c: 'Maurer, receiving Crawford, the U.S. ambassador, on his farewell call, speaks ''as a man'' and not as Premier, as Bodnăraş later tells the Chinese: what the Americans do in Vietnam is a wild adventure, peaceful coexistence cannot hold with it, and opposition to it will stiffen. Crawford says he will report it home.'
      n: '"[Note of the Audience of Liu Fang, Ambassador of the Chinese People''s Republic in Bucharest, with Emil Bodnaras, First Vice-President of the Council of Ministers of the S. R. of Romania](https://digitalarchive.umd.edu/document/122557)" (Oct. 28, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. The Romanian account only, in Bodnăraş''s briefing of Liu Fang, Oct. 28, 1965; the day is the translator''s, in brackets. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 279, 762, an excerpt). Names: Maurer, Bodnăraş. Check: the place. Check: whether the excerpt printed in 2005 holds this part.'
      tags:
      - polity:romania
      - polity:us
      - name:maurer-ion-gheorghe
      - name:bodnaras-emil
      - vis:only:romania+us
      - vis:from:prc:1965-10-28
- add:
    entry:
      id: cal.1965-10-13.india-and-china-kashmir
      when: 'Oct. 13'
      date: '1965-10-13'
      thread: india-and-china-kashmir
      also: [soviet-union, europe-and-the-alliance]
      c: 'Bhutto, Pakistan''s foreign minister, at his own insistence meets Mănescu and asks Romania for its good offices in the Kashmir dispute with India, giving Pakistan''s reservations on the Soviet offer of mediation, as Bodnăraş later tells the Chinese. The Romanian Permanent Presidium later decides not to accept.'
      n: '"[Note of the Audience of Liu Fang, Ambassador of the Chinese People''s Republic in Bucharest, with Emil Bodnaras, First Vice-President of the Council of Ministers of the S. R. of Romania](https://digitalarchive.umd.edu/document/122557)" (Oct. 28, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. The Romanian account only, in Bodnăraş''s briefing of Liu Fang, Oct. 28, 1965. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 279, 762, an excerpt). Names: Mănescu, Bhutto, Bodnăraş. Check: the place. Check: whether the excerpt printed in 2005 holds this part.'
      tags:
      - polity:romania
      - polity:pakistan
      - name:manescu-corneliu
      - name:bhutto-zulfikar-ali
      - name:bodnaras-emil
      - vis:only:romania+pakistan
      - vis:from:prc:1965-10-28
- add:
    entry:
      id: cal.1965-10-14.vietnam-diplomacy
      when: 'Oct. 14'
      date: '1965-10-14'
      place: washington
      thread: vietnam-diplomacy
      also: [soviet-union, china]
      c: 'Rusk meets part of the Romanian delegation under Mănescu at the State Department, three and a half hours, as Bodnăraş later tells the Chinese. Rusk, by that account: the U.S. sees Hanoi perhaps moving toward talks, will not leave South Vietnam to force, and asks Romania not to block any signal from the Vietnamese; he calls the Soviet line reasonable and the Chinese the hardliners'' only inspiration. Mănescu: the Vietnamese alone must decide.'
      n: '"[Note of the Audience of Liu Fang, Ambassador of the Chinese People''s Republic in Bucharest, with Emil Bodnaras, First Vice-President of the Council of Ministers of the S. R. of Romania](https://digitalarchive.umd.edu/document/122557)" (Oct. 28, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. The Romanian account only, in Bodnăraş''s briefing of Liu Fang, Oct. 28, 1965. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 279, 762, an excerpt). Names: Rusk, Mănescu, Balaceanu, Bodnăraş. Check: the U.S. record of the meeting. Check: whether the excerpt printed in 2005 holds this part.'
      tags:
