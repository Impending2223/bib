      id: cal.1966-03.soviet-union-leadership
      when: Mar., before the 29th
      date: 1966-03
      at: before 1966-03-29
      thread: soviet-union-leadership
      also:
      - china
      c: 'Before the 23rd Congress opens, the Soviets brief the Romanian delegation on the main points of Brezhnev''s report: the Congress will not be turned against the Chinese party, nor be polemical. ''Many times we have presented you with unpleasant surprises,'' by Niculescu-Mizil''s account to the Vietnamese, May 7.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7. Names: Brezhnev. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
