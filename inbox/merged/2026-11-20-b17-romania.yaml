      c: 'Bucharest. The Romanian leaders meet the Soviet leadership, Khrushchev, Brezhnev, Kosygin and Andropov, on the CMEA''s integration projects; the talks, by Bodnăraş''s account to the Vietnamese, May 7, 1966, settle the Romanians in a categorical no.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7, 1966. Bodnăraş: ''the meeting that we had with the Soviet leadership in 1963''. Names: Khrushchev, Brezhnev, Kosygin, Andropov, Bodnăraş. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none.'
