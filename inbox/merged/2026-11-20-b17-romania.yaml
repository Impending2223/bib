      when: 1966, before October
      date: '1966'
      at: before 1966-10
      thread: vietnam-diplomacy
      c: 'Komócsin, for the Hungarian party, writes the RCP proposing that the Romanian, Bulgarian, Czechoslovak, East German, Polish and Soviet parties meet at Budapest to coordinate aid to Vietnam. Niculescu-Mizil''s account to Phạm Văn Đồng, Oct. 3.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Niculescu-Mizil: ''The Hungarians wrote us a letter, signed by Zoltan Komocsin''. See [[cal.1966-05-10.vietnam-diplomacy-3]]. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none.'
