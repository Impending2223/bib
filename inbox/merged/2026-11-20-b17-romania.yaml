      - polity:us
      - name:rusk-dean
      - name:manescu-corneliu
      - name:balaceanu-petre
      - name:bodnaras-emil
      - vis:only:romania+us
      - vis:from:prc:1965-10-28
- add:
    entry:
      id: cal.1965-10-28.china-2
      when: 'Oct. 28'
      date: '1965-10-28'
      place: bucharest
      thread: china
      also: [vietnam-diplomacy]
      c: 'Bodnăraş, for the Permanent Presidium, briefs Liu Fang, the Chinese ambassador, on Maurer''s talk with Crawford, Mănescu''s meeting with Rusk and Bhutto''s request for good offices on Kashmir, which the Presidium declined. Liu thanks him and says Rusk''s words show the real American intent.'
      n: '"[Note of the Audience of Liu Fang, Ambassador of the Chinese People''s Republic in Bucharest, with Emil Bodnaras, First Vice-President of the Council of Ministers of the S. R. of Romania](https://digitalarchive.umd.edu/document/122557)" (Oct. 28, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 279, 762, an excerpt). See [[cal.1965-10-03.vietnam-diplomacy]], [[cal.1965-10-13.india-and-china-kashmir]], [[cal.1965-10-14.vietnam-diplomacy]]. Names: Bodnăraş, Maurer, Mănescu, Rusk, Bhutto. The note''s close: ''over both of the audiences''. Check: the day of the second audience; Liu''s reply and Bodnăraş''s addition speak of the first as ''yesterday''.'
