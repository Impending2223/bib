- add:
    entry:
      id: cal.1962.soviet-union
      when: '1962'
      date: '1962'
      thread: soviet-union
      also:
      - europe-and-the-alliance
      c: 'Kosygin, pressing economic integration in the CMEA on the Romanians, offers the Common Market as his example: why should Communists not do what the capitalists have done? The Romanians: that is a capitalist business arrangement. Bodnăraş''s account to the Vietnamese, May 7, 1966.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7, 1966. Bodnăraş: ''The same argument was used also by cde. Kosygin in 1962''. Names: Kosygin, Bodnăraş. Check: the day and the occasion. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:ussr
      - polity:romania
      - name:kosygin-aleksei
      - name:bodnaras-emil
      - vis:only:romania+ussr
      - vis:from:drv:1966-05-07
