      - name:nguyen-cao-ky
- add:
    entry:
      id: cal.1966.vietnam-hanoi-4
      when: 1966, before October
      date: '1966'
      at: before 1966-10
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      c: 'Phạm Văn Đồng, in a speech at a meeting with a Czechoslovak delegation, sets out three points: the four points reaffirmed, the unconditional end of the bombing and all acts of war against the DRV, and a third, by his account to Maurer, Oct. 3.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Đồng: ''Very recently''; ''a speech at a meeting with a Czech delegation''; the third point ''understandable in and of itself'' Names: Phạm Văn Đồng. Check: the day, and the third point.'
      tags:
      - polity:drv
      - name:pham-van-dong
- add:
    entry:
      id: cal.1966.vietnam-diplomacy-5
      when: 1966, before June
      date: '1966'
      at: before 1966-06
      thread: vietnam-diplomacy
      c: 'Ceaușescu, visiting the Argeș region, declares in a speech for the DRV''s four points and the Front''s five, the end of the American aggression and of the bombing of the North, and the withdrawal of American and allied troops, as Zhou has it at the official talks of June 1966.'
      n: '"[Transcript of Official Conversations Between the Romanian Delegation led by Nicolae Ceausescu, and the Party and Government Delegation of the Chinese P.R. led by Zhou Enlai on the Occasion of their Visit to Romania](https://digitalarchive.umd.edu/document/122577)" (June 15, 1966), Document 294 in Budura, Relaţiile Româno-Chineze, 1880–1974: Documente (2005), pp. 788–872; ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 87/1966, f. 12–42; 51–144, trans. Larry L. Watts, Wilson Center Digital Archive. Zhou: ''the recent speech of comrade Ceausescu''; the same position, he says, ''jointly expressed and signed'' with a delegation of the Japanese Communist Party. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 294, 788–872). Names: Ceaușescu, Zhou Enlai. Check: the day and the place of the speech.'
      tags:
      - polity:romania
      - name:ceausescu-nicolae
      - name:zhou-enlai
- add:
    entry:
      id: cal.1966.vietnam-diplomacy-6
      when: 1966, before June
      date: '1966'
      at: before 1966-06
      thread: vietnam-diplomacy
      also:
      - soviet-union
      - china
      c: 'The Soviets tell the Vietnamese that the war may end in their victory, but that when the victory is celebrated they will no longer exist, by Zhou''s account to the Romanian leaders at the official talks of June 1966.'
      n: '"[Transcript of Official Conversations Between the Romanian Delegation led by Nicolae Ceausescu, and the Party and Government Delegation of the Chinese P.R. led by Zhou Enlai on the Occasion of their Visit to Romania](https://digitalarchive.umd.edu/document/122577)" (June 15, 1966), Document 294 in Budura, Relaţiile Româno-Chineze, 1880–1974: Documente (2005), pp. 788–872; ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 87/1966, f. 12–42; 51–144, trans. Larry L. Watts, Wilson Center Digital Archive. Zhou: ''Such words cannot only come from the mouths of enemies''. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 294, 788–872). Names: Zhou Enlai. Check: the day, and a Soviet or Vietnamese record.'
      tags:
      - polity:ussr
      - polity:drv
      - name:zhou-enlai
      - vis:only:ussr+drv
      - vis:from:prc:1966-06-17
      - vis:from:romania:1966-06-17
- add:
    entry:
      id: cal.1966-06-02.middle-east
      when: June 2
      date: '1966-06-02'
      thread: middle-east
      also:
      - vietnam-diplomacy
      c: 'Ceaușescu talks with the Shah, who agrees that the Vietnamese should settle their own affairs without outside interference and that all foreign troops should leave; if the communists win in the South, the Shah says, that is the Vietnamese''s affair. Ceaușescu''s account to Hoang Tu the next day.'
      n: '"[Transcript of the Discussions Held on the Occasion of the Reception by Comrade Nicolae Ceausescu of the Ambassador of the Democratic Republic of Vietnam in Bucharest, Hoang Tu](https://digitalarchive.umd.edu/document/122576)" (June 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 80/1966, f. 1–5, trans. Larry L. Watts, Wilson Center Digital Archive. Ceaușescu: ''Yesterday, for example, we spoke with the Shah''. "[Transcript of Official Conversations Between the Romanian Delegation led by Nicolae Ceausescu, and the Party and Government Delegation of the Chinese P.R. led by Zhou Enlai on the Occasion of their Visit to Romania](https://digitalarchive.umd.edu/document/122577)" (June 15, 1966), Document 294 in Budura, Relaţiile Româno-Chineze, 1880–1974: Documente (2005), pp. 788–872; ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 87/1966, f. 12–42; 51–144, trans. Larry L. Watts, Wilson Center Digital Archive. Ceaușescu to Zhou: the Shah ''called for the departure of the Americans''. See [[cal.1966-05-28.middle-east]]. Names: Ceaușescu, Pahlavi. Check: whether this talk is one of the official conversations the Archive dates May 28. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:iran
      - name:ceausescu-nicolae
      - name:pahlavi-mohammed-reza
      - vis:only:romania+iran
      - vis:from:drv:1966-06-03
- add:
    entry:
      id: cal.1966-06-02.vietnam-diplomacy
      when: June 2
      date: '1966-06-02'
      thread: vietnam-diplomacy
      also:
      - vietnam-hanoi
      c: 'Bodnăraş receives Hoang Tu, the DRV''s ambassador, and tells him, among other things, that the CMEA and Warsaw Pact states meet at Bucharest early in July; Tu transmits it to Hanoi, by the transcript of Ceaușescu''s reception the next day.'
      n: '"[Transcript of the Discussions Held on the Occasion of the Reception by Comrade Nicolae Ceausescu of the Ambassador of the Democratic Republic of Vietnam in Bucharest, Hoang Tu](https://digitalarchive.umd.edu/document/122576)" (June 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 80/1966, f. 1–5, trans. Larry L. Watts, Wilson Center Digital Archive. Ceaușescu: ''As comrade Bodnaras told you yesterday''; Hoang Tu: ''I have already transmitted home''. Names: Bodnăraş. Check: what else Bodnăraş told him. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - ok:fields-place
      - polity:romania
      - polity:drv
      - name:bodnaras-emil
      - vis:only:romania+drv
- primary:
    id: cal.1965-02-11.soviet-union
    text: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou''s account to the Romanian leaders: Mao told Kosygin that China too wants 10–15 years of peace, and that the more the Soviet Union helps North Vietnam the better; Kosygin offered two regiments of ground-to-air missiles, antiaircraft guns, amphibious tanks, MiG-17s and trainers; the two sides agreed to exchange information on international problems, which Zhou dates ''13 February''.'
    units: A
- primary:
    id: cal.1965-02-06.soviet-union
    text: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou''s account to the Romanian leaders: the Vietnamese told Kosygin that it was not the moment for negotiations; Kosygin said that Soviet arms would henceforth be free, gave the South medical aid only, and pressed for a common declaration of the socialist countries.'
    units: A
- primary:
    id: cal.1965-03-17.china-leadership-4
    text: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou''s account to the Romanian leaders of a talk ''before coming here'' with the French ambassador: de Gaulle''s two questions, unconditional talks and the five great powers; Zhou proposed a Geneva conference on Cambodia to test the Americans.'
    units: A
- primary:
    id: cal.1965-03-20.china-leadership-2
    text: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou''s account to the Romanian leaders: the Syrian foreign and culture ministers said the U.S. pressed the Arab states through Israel, and wished China to draw American forces east.'
    units: A
- primary:
    id: cal.1965-03-01.soviet-union
    text: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Ceaușescu to Zhou: Romania had given its position on the meeting in a letter to the parties, that it did not serve the movement''s unity.'
    units: C
- primary:
    id: cal.1965-09-09.soviet-union-leadership
    text: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer''s account to Phạm Văn Đồng, Oct. 3, 1966: the visit made to repair relations after Gheorghiu-Dej''s death; the communiqué''s statement of principles; divergences left, chief among them the gold sent to Russia in 1917, whose return Romania asked, and a promise of silence the Soviets were first to break.'
    units: A
- primary:
    id: cal.1966-07-02.soviet-union-leadership
    text: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer''s and Niculescu-Mizil''s account to Phạm Văn Đồng, Oct. 3–4, 1966: the Poles presented a resolution pressing Vietnam toward negotiations, which Romania opposed; at the first secretaries'' meeting Ceaușescu told Gomułka that view pushed the Vietnamese to capitulation; Malinovsky briefed on the war, with maps, the balance favoring the Americans; the Declaration found an acceptable formula.'
    units: A
- primary:
    id: cal.1966-06-16.china-leadership-2
    text: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer''s account to Phạm Văn Đồng, Oct. 3, 1966: the Romanians asked Zhou not to give, in his speech in Bucharest, his views on the Soviet Union and its policy; he did not, and seemed very dissatisfied; he rejected their urging to find a way to talk with the Soviet leaders, whom he called traitors.'
    units: A
