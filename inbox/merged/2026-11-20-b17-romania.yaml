- add:
    entry:
      id: cal.1966-10-11.vietnam-diplomacy
      when: 'Oct. 11'
      date: '1966-10-11'
      place: bucharest
      time: 1966-10-11T16:00Z
      time_zone: 'Europe/Bucharest'
      thread: vietnam-diplomacy
      also: [vietnam-hanoi, soviet-union, china]
      c: 'The RCP Executive Committee, Ceaușescu presiding, hears Niculescu-Mizil on the Maurer–Niculescu-Mizil visit to Hanoi, Peking and Moscow. By his report the Vietnamese agreed with Romania''s position but held conditions for talks not ripe, and Zhou Enlai and Kosygin differed in what they said. Ceaușescu: put the halting of the bombing at the center; the Committee approves the delegation''s work unanimously.'
      n: '"[Protocol No. 34 of the Romanian Executive Political Committee Meeting](https://digitalarchive.umd.edu/document/122589)" (Oct. 11, 1966), Document 10 in Niculescu-Mizil, România şi războiul americano-vietnamez (2008), pp. 191–201; Arhiva Comitetului Executiv al CC al PCR, dosar nr. 2689, 5.XI.1966, trans. Larry L. Watts, Wilson Center Digital Archive. Protocol no. 34; the meeting began at 1800 hrs. Made public: 2008 ([[w.niculescu-mizil-romania-si-razboiul-americano]], Document 10, 191–201). See [[cal.1966-10-05.soviet-union-leadership]]. The place: the Executive Committee''s seat. Names: Ceaușescu, Maurer, Zhou Enlai, Kosygin.'
      tags:
      - polity:romania
      - name:ceausescu-nicolae
      - name:maurer-ion-gheorghe
      - name:zhou-enlai
      - name:kosygin-aleksei
      - vis:only:romania
- add:
    entry:
      id: cal.1966-11-21.vietnam-diplomacy
      when: 'Nov. 21'
      date: '1966-11-21'
      place: bucharest
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'Ceaușescu, Maurer, Bodnăraş and Niculescu-Mizil meet Nguyễn Duy Trinh, DRV Vice-Premier and foreign minister, and Ambassador Hoang Tu, on Trinh''s short stop at Bucharest after the Albanian and Bulgarian party congresses. Ceaușescu: Romania backs the DRV''s position and more aid, and wants a view on talks and on the congresses'' lessons. Trinh and Ceaușescu agree that the military and the political struggle go together.'
      n: '"[Transcript of Interviews at the Central Committee of Romanian Communist Party With the Delegation of the Vietnamese Worker''s Party](https://digitalarchive.umd.edu/document/122590)" (Nov. 23, 1966), Stenograma intrevederii la CC al PCR cu delegatia Partidelor celor ce muncesc din Vietnam [Transcript of Meetings at the RCP CC with the Workers Party of Vietnam Delegation], November 21, 1966, Fond CC al PCR, Secţia Relaţii Externe, 150/1966, nr. 2925, 14/XII/1966, trans. Larry L. Watts, Wilson Center Digital Archive. The Archive dates the transcript Nov. 23, 1966; the text gives Nov. 21, and ends with a dinner proposed for 1530 hrs. See [[cal.1966-10-11.vietnam-diplomacy]]. Names: Ceaușescu, Maurer, Bodnăraş, Nguyễn Duy Trinh. Check: the day, Nov. 21 in the text and Nov. 23 in the Archive''s heading and the transcript''s close. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:ceausescu-nicolae
      - name:maurer-ion-gheorghe
      - name:bodnaras-emil
      - name:nguyen-duy-trinh
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1967-01-13.vietnam-diplomacy
      when: 'Jan. 13'
      date: '1967-01-13'
      thread: vietnam-diplomacy
      also: [europe-and-the-alliance]
      c: 'Maurer receives Joseph Luns, the Dutch foreign minister. Luns: the German question and Vietnam are the great problems; he expects Kiesinger''s government to seek better ties with the East; Dutch relations with Russia cannot grow while the war lasts. Maurer, as the transcript has him: the Americans'' one sensible course is to leave South Vietnam and let its people decide.'
      n: '"[Transcript of Reception by Comrade Ion Gheorghe Maurer of the Foreign Minister of Holland, Joseph Luns](https://digitalarchive.umd.edu/document/122591)" (Jan. 13, 1967), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 2/1967, f. 1–13, trans. Larry L. Watts, Wilson Center Digital Archive. Names: Maurer, Luns. Check: the place and the hour; the transcript gives neither. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:netherlands
      - name:maurer-ion-gheorghe
      - name:luns-joseph-m-a-h
      - vis:only:romania+netherlands
- add:
    entry:
      id: cal.1967-01-13.vietnam-diplomacy-2
      when: 'Jan. 13'
      date: '1967-01-13'
      time: 1967-01-13T16:30Z
      time_zone: 'Europe/Bucharest'
      place: predeal
      thread: vietnam-diplomacy
      also: [europe-and-the-alliance]
      c: 'At Predeal, Ceaușescu receives Luns, with Mănescu, Elian and the Dutch ambassador present, for an hour and a half. Ceaușescu: the Dutch could do more, advising the Americans to end the war, and the bombing must stop before talks. Luns: the Americans would leave if they could do it without dishonor; both Hanoi and Washington are deluding themselves.'
      n: '"[Transcript of Reception by Comrade Nicolae Ceausescu of the Foreign Minister of Holland, Joseph Luns](https://digitalarchive.umd.edu/document/122592)" (Jan. 13, 1967), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 1/1967, January 27, 1966, f. 1–19, trans. Larry L. Watts, Wilson Center Digital Archive. The discussions began at 1830 hrs and lasted one and a half hours. See [[cal.1967-01-13.vietnam-diplomacy]]. Names: Ceaușescu, Mănescu, Luns. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:netherlands
      - name:ceausescu-nicolae
      - name:manescu-corneliu
      - name:luns-joseph-m-a-h
      - vis:only:romania+netherlands
- add:
    entry:
      id: cal.1967-01-22.vietnam-diplomacy
      when: 'Jan. 22'
      date: '1967-01-22'
      thread: vietnam-diplomacy
      c: 'On the train home from the hunting trip for the heads of the diplomatic missions at Bucharest, Davis, the U.S. ambassador, talks with Stoica and Mănescu on Vietnam and other matters, as Davis tells Ceaușescu on Jan. 31. Mănescu asks whether Washington rightly understands Romanian policy; Davis reports the talk there, as Mănescu asked.'
      n: '"[Transcript of the Discussions on the Occasion of the Reception by Comrade Nicolae Ceausescu of United States Ambassador in Bucharest, Richard H. Davis](https://digitalarchive.umd.edu/document/122593)" (Feb. 1, 1967), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 2/1967, f. 1–20, trans. Larry L. Watts, Wilson Center Digital Archive. The Romanian record of Davis''s account, in the transcript of Jan. 31, 1967. Names: Mănescu, Ceaușescu. Check: the day of Davis''s report to Washington. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:us
      - name:manescu-corneliu
      - name:ceausescu-nicolae
      - vis:only:romania+us
      - ok:fields-place
- add:
    entry:
      id: cal.1967-01-31.vietnam-diplomacy
      when: 'Jan. 31'
      date: '1967-01-31'
      time: 1967-01-31T10:00Z
      time_zone: 'Europe/Bucharest'
      thread: vietnam-diplomacy
      c: 'Ceaușescu receives Davis, the U.S. ambassador, who asked to see him after the talk on the train. Davis: the U.S. is in Vietnam under a treaty obligation, seeks talks without conditions and does not wish to stay. Ceaușescu: the bombing of the DRV is the bar to talks, the Front must be recognized, and Romania wants better relations with the U.S. but ''platonic love'' does not last.'
      n: '"[Transcript of the Discussions on the Occasion of the Reception by Comrade Nicolae Ceausescu of United States Ambassador in Bucharest, Richard H. Davis](https://digitalarchive.umd.edu/document/122593)" (Feb. 1, 1967), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 2/1967, f. 1–20, trans. Larry L. Watts, Wilson Center Digital Archive. The discussions began at 1200 hours, January 31; the Archive''s heading is Feb. 1, 1967. See [[cal.1967-01-22.vietnam-diplomacy]]. Names: Ceaușescu. Check: the place; the transcript names none. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:us
      - name:ceausescu-nicolae
      - vis:only:romania+us
