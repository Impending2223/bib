- add:
    entry:
      id: cal.1966-10-03.vietnam-hanoi
      when: 'Oct. 3'
      date: '1966-10-03'
      time: 1966-10-03T03:00Z
      time_zone: 'Asia/Bangkok'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, soviet-union, china]
      c: 'Hanoi. Maurer and Niculescu-Mizil talk with Phạm Văn Đồng, Nguyễn Duy Trinh and Xuân Thủy, 1000 to 1300 hrs. Maurer reports the divergences with the Soviet Union (the gold sent to Russia in 1917, the Warsaw Pact''s command), the coolness with China since Zhou''s visit, and the NATO states'' leaders who ask why Hanoi will not talk; the armed struggle going on, he proposes that the DRV open talks to unmask the Americans. Đồng: the conditions are not ripe; he asks for concrete suggestions, and Maurer has none.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. ''The discussions began at 1000 hrs''; ''The discussions ended at 1300 hrs.'' The Archive dates the transcript Oct. 3; the file note at its end reads Oct. 2–3, 1966. Names: Maurer, Phạm Văn Đồng, Nguyễn Duy Trinh, Xuân Thủy. Check: the days; the file note reads Oct. 2–3, against the transcript''s Oct. 3 and 4 and Maurer''s own ''October 3 and in the afternoon of October 4'' at Peking. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:maurer-ion-gheorghe
      - name:pham-van-dong
      - name:nguyen-duy-trinh
      - name:xuan-thuy
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-10-04.vietnam-hanoi
      when: 'Oct. 4'
      date: '1966-10-04'
      time: 1966-10-04T08:00Z
      time_zone: 'Asia/Bangkok'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, soviet-union, china]
      c: 'Hanoi. The closing sitting, from 1500 hrs to 1700. Maurer: nothing to add; the two sides'' views are as one and the contacts should go on; he will tell the Chinese and the Soviets in brief. Talk of the Polish and Hungarian proposals, U Thant''s and the French precedent in the military case; Đồng: agreement, and other delegations come in November.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Sitting of 1500–1700 hrs, dated Oct. 4 in the transcript; Đồng: ''Tomorrow you leave''. See [[cal.1966-10-03.vietnam-hanoi]]. Names: Maurer, Phạm Văn Đồng. Check: the days; the file note reads Oct. 2–3, against the transcript''s Oct. 3 and 4 and Maurer''s own ''October 3 and in the afternoon of October 4'' at Peking. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:maurer-ion-gheorghe
      - name:pham-van-dong
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-10-05.soviet-union-leadership
      when: 'Oct. 5'
      date: '1966-10-05'
      time: 1966-10-05T16:30Z
      time_zone: 'Europe/Moscow'
      place: moscow
      thread: soviet-union-leadership
      also: [vietnam-diplomacy, vietnam-hanoi]
      c: 'Moscow. Maurer and Niculescu-Mizil, back from Vietnam, brief Kosygin, Andropov and Kuznetsov from 1930 hrs: the Hanoi talks, and the Vietnamese view that conditions for negotiating are not ripe. Kosygin answers with irony and asks whether Maurer contradicted Zhou Enlai; the two go over Vietnam''s supply, which passes through China.'
      n: '"[Transcript of Discussions with Representatives of the Chinese People''s Republic and The Communist Party of the Soviet Union on the Return of the Romanian Delegation from Vietnam (Moscow)](https://digitalarchive.umd.edu/document/122584)" (Oct. 5, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, Dosar 129/1966, file 22–32, trans. Larry L. Watts, Wilson Center Digital Archive. Moscow, October 5, 1966; the Archive''s heading reads October 4–5. See [[cal.1966-10-04.vietnam-hanoi]]. Names: Maurer, Kosygin, Andropov, Kuznetsov, Zhou Enlai. Check: the day; the Hanoi sittings end Oct. 4, and the Peking talks (Oct. 4 in the Romanian record, Oct. 5 in the Chinese) come before. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
