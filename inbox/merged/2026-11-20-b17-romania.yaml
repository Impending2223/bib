      when: Feb. 16
      date: '1965-02-16'
      thread: vietnam-diplomacy
      also:
      - soviet-union
      - china
      c: 'By Zhou''s account to the Romanian leaders, Mar. 25, the Soviet government asks the DRV''s whether peace talks can be held, and Phạm Văn Đồng answers on the spot that the DRV does not agree. The Soviets then ask the Chinese, who say they must first know Hanoi''s view.'
      n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou: ''on 16 February of this year''; Đồng ''responded on the spot''. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 252, 690–714). Names: Phạm Văn Đồng, Zhou Enlai. Check: a Soviet or Vietnamese record of the request.'
