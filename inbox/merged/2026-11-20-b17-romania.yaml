      c: Kỳ, as the Romanians hear it at Hanoi, declares that the Geneva Accords have lost their value.
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Niculescu-Mizil, Oct. 4: ''Even today we were informed''. Names: Nguyễn Cao Kỳ. Check: the day and Kỳ''s words; the report may be of a declaration of the day before.'
