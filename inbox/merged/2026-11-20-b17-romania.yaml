- add:
    entry:
      id: cal.1966-05-07.vietnam-hanoi-3
      when: May 7
      date: '1966-05-07'
      time_range:
      - 1966-05-07T05:00Z
      - 1966-05-07T11:00Z
      time_band: afternoon
      range_basis: record
      time_zone: Asia/Bangkok
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      - china
      - soviet-union
      c: 'Hanoi. In a pause of the afternoon sitting Bodnăraş and Niculescu-Mizil put to Phạm Văn Đồng, on the RCP leadership''s instructions, a joint political manifestation of all the socialist countries'' solidarity with Vietnam, before the Warsaw Pact and CMEA meeting at Bucharest in July; Romania would put it to the Chinese and the Soviets. Đồng: the idea is just, the Vietnamese will reflect; Bodnăraş proposes a restricted meeting on it.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. Note of Conversation, May 7, 1966: ''During a pause in the discussions in the afternoon of May 7''. See [[cal.1966-05-07.vietnam-hanoi-2]]. Names: Bodnăraş, Phạm Văn Đồng. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:bodnaras-emil
      - name:pham-van-dong
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-09.vietnam-hanoi-2
      when: May 9
      date: '1966-05-09'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      - china
      - soviet-union
      c: 'Hanoi. The first restricted meeting: Bodnăraş and Niculescu-Mizil with Phạm Văn Đồng, Nguyễn Duy Trinh and Lê Thanh Nghị. Đồng, having consulted several Political Bureau members, agrees to the Romanian proposal on condition that both the Soviet and the Chinese parties join, and asks for close exchange of information; Bodnăraş: the RCP stayed away from the March meeting and faults the Polish letter to Peking. Romania offers to equip a battalion, Ionita to settle it with Võ Nguyên Giáp after lunch.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. Note of First Restricted Meeting on 9 May 1966. Đồng: the adherence of both ''is necessary''. Bodnăraş on Zhou Enlai''s visit to Romania: agreed for mid-May, then proposed for May 24. See [[cal.1966-05-09.vietnam-hanoi]]. Names: Bodnăraş, Phạm Văn Đồng, Nguyễn Duy Trinh, Võ Nguyên Giáp. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - ok:fields-time
      - polity:romania
      - polity:drv
      - name:bodnaras-emil
      - name:pham-van-dong
      - name:nguyen-duy-trinh
      - name:vo-nguyen-giap
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-04.soviet-union-leadership
      when: Apr., early
      date: 1966-04
      at: before 1966-04-01
      place: moscow
      thread: soviet-union-leadership
      also:
      - europe-and-the-alliance
      c: 'During the 23rd Congress Brezhnev and Kosygin call on the Romanian delegation under Ceaușescu and propose an early meeting of the Warsaw Pact states'' general secretaries and premiers; the Romanians: come to Bucharest. Brezhnev: the stress must be on what unites the socialist countries. Bodnăraş''s and Niculescu-Mizil''s account to the Vietnamese, May 7 and 9.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7 (Bodnăraş: ''At Moscow, during the CPSU Congress''); Note of First Restricted Meeting, May 9 (Niculescu-Mizil). See [[cal.1966-03-29.soviet-union-leadership-2]]. Names: Brezhnev, Kosygin, Ceaușescu. Check: the day; the record says only ''during the work of the 23rd Congress'' (Mar. 29–Apr. 8). Check: the year the document was first printed or posted; the Archive page gives none.'
