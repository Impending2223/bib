- add:
    entry:
      id: cal.1966.europe-and-the-alliance
      when: 1966, before May
      date: '1966'
      at: before 1966-05
      thread: europe-and-the-alliance
      also:
      - vietnam-diplomacy
      c: 'Tito visits Romania, returning Gheorghiu-Dej''s visit of 1963. By Bodnăraş''s account to the Vietnamese, May 7 and 10: Ceaușescu tells him of the delegation going to Vietnam; Tito condemns the American aggression in a speech, the American ambassador upset as he shakes his hand; the communiqué affirms both sides'' solidarity with the Vietnamese people.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7: ''We recently received Tito''; Note on the Second Restricted Meeting, May 10. See [[cal.1963.europe-and-the-alliance]]. Names: Tito, Gheorghiu-Dej, Ceaușescu. Check: the days of the visit. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:yugoslavia
      - polity:romania
      - name:tito-josip-broz
      - name:gheorghiu-dej-gheorghe
      - name:ceausescu-nicolae
- add:
    entry:
      id: cal.1966.soviet-union
      when: 1966, before May
      date: '1966'
      at: before 1966-05
      thread: soviet-union
      also:
      - europe-and-the-alliance
      c: 'Preparing the July meeting at Bucharest, the Warsaw Pact states'' deputy foreign and defense ministers meet; proposals come for supranational bodies to coordinate the socialist states'' foreign policy and to direct military affairs, and the Romanians refuse them. Niculescu-Mizil''s and Bodnăraş''s account to the Vietnamese, May 7 and 9.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7 (Bodnăraş: a Foreign Ministers'' Council, a single command); Note of First Restricted Meeting, May 9 (Niculescu-Mizil: ''Meetings at the level of deputy ministers''). Check: the days and the places. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - ok:fields-place
      - polity:romania
      - polity:ussr
      - vis:from:drv:1966-05-07
- add:
    entry:
      id: cal.1966-10-03.vietnam-hanoi-2
      when: Oct. 3
      date: '1966-10-03'
      time: 1966-10-03T08:00Z
      time_zone: Asia/Bangkok
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      - china
      - soviet-union
      c: 'Hanoi. The afternoon sitting, 1500 to 1800 hrs. Phạm Văn Đồng: arms and diplomacy go together, but conditions for talks are not ripe while the Americans escalate; he recounts the DRV''s contacts with the U.S. and its intermediaries (at Paris, Rangoon, Algiers, Cairo and Moscow; Ronning twice; Sainteny), the three points of his recent speech, and János Péter''s visit on the UN. Niculescu-Mizil: Romania refused the Hungarian proposal, in Komócsin''s letter, of a meeting at Budapest on coordinating aid.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. ''Afternoon Discussions began at 1500 hrs''; ''The discussions ended at 1800 hours.'' Đồng: ''the conditions are not yet ripe''; ''we have never closed our door''. See [[cal.1966-10-03.vietnam-hanoi]]. Names: Phạm Văn Đồng, Ronning, Sainteny, Péter. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:pham-van-dong
      - name:ronning-chester
      - name:sainteny-jean
      - name:peter-janos
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-10-01.china
      when: Oct. 1
      date: '1966-10-01'
      time_range:
      - 1966-10-01T11:00Z
      - 1966-10-01T14:00Z
      time_band: evening
      range_basis: record
      time_zone: Asia/Shanghai
      place: peking
      thread: china
      also:
      - vietnam-diplomacy
      c: Peking. Maurer and Niculescu-Mizil, on their way to Hanoi, are met by Chen Yi, Zhou being at the National Day reception; that evening they dine with Zhou and Chen Yi, and Zhou agrees to talk with them on their return.
      n: '"[Transcript of Discussions with Representatives of the Chinese People''s Republic and The Communist Party of the Soviet Union on the Return of the Romanian Delegation from Vietnam (Moscow)](https://digitalarchive.umd.edu/document/122584)" (Oct. 5, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, Dosar 129/1966, file 22–32, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer to Kosygin: Zhou was at ''the October 1 national day reception''; ''That evening Zhou Enlai also came''. "[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer to Đồng, Oct. 3: ''That evening, we dined with comrades Zhou Enlai and Chen Yi''. The time is the dinner''s. Names: Maurer, Chen Yi, Zhou Enlai. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:prc
      - name:maurer-ion-gheorghe
      - name:chen-yi
      - name:zhou-enlai
      - vis:only:romania+prc
- add:
    entry:
      id: cal.1966.china
      when: 1966, before October
      date: '1966'
      at: before 1966-10
      thread: china
      also:
      - vietnam-diplomacy
      c: 'The Romanians ask the Chinese for an exchange of views on what they mean to raise with the Vietnamese; the Chinese answer coolly that a talk would be neither useful nor opportune, and the Romanians ask only to fly over China. Maurer''s account to Phạm Văn Đồng, Oct. 3, and to Kosygin.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''The response of the Chinese was a little cool''. "[Transcript of Discussions with Representatives of the Chinese People''s Republic and The Communist Party of the Soviet Union on the Return of the Romanian Delegation from Vietnam (Moscow)](https://digitalarchive.umd.edu/document/122584)" (Oct. 5, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, Dosar 129/1966, file 22–32, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''the Chinese comrades said that we have talked enough''. See [[cal.1966-10-01.china]]. Names: Maurer. Check: the days. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:prc
      - vis:only:romania+prc
      - vis:from:drv:1966-10-03
- add:
    entry:
      id: cal.1966-10-04.vietnam-hanoi-2
      when: Oct. 4
      date: '1966-10-04'
      thread: vietnam-hanoi
      c: 'The DRV''s Political Bureau hears Phạm Văn Đồng''s detailed report of the talks with Maurer and Niculescu-Mizil; its members, Hồ Chí Minh above all, congratulate the Romanians on the visit, by Đồng''s account at the closing sitting.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. The sitting of Oct. 4, 1500 hrs: ''a detailed report of our discussions to our Political Bureau''. See [[cal.1966-10-03.vietnam-hanoi-2]]. Names: Phạm Văn Đồng, Hồ Chí Minh. Check: the day; between the sitting that ended Oct. 3, 1800 hrs, and that of Oct. 4, 1500 hrs. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:drv
      - name:pham-van-dong
      - name:ho-chi-minh
      - vis:only:drv
      - vis:from:romania:1966-10-04
- add:
    entry:
      id: cal.1966.europe-and-the-alliance-2
      when: 1966, before October
      date: '1966'
      at: before 1966-10
      thread: europe-and-the-alliance
      also:
      - vietnam-diplomacy
      c: 'Maurer, on a visit to Yugoslavia, talks with Tito and Koča Popović: to aid Vietnam and at the same time foretell negotiations in public is to support Johnson''s policy; Tito asks who does so. Maurer''s account to Phạm Văn Đồng, Oct. 3 and 4.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''several months ago, on the occasion of a visit there''; and Oct. 4: ''He asked me: "But who is doing this?"''. Names: Maurer, Tito, Popović, Johnson. Check: the days. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
