      time_zone: 'Europe/Bucharest'
      thread: vietnam-diplomacy
      also: [china, soviet-union]
      c: 'Ceaușescu receives Czesak of the Polish Central Committee, who brings Gomułka''s letter and the Polish plan for a conference on aid to Vietnam, and tells of Harriman''s visit to Warsaw before the New Year and the Polish emissary sent on to Hanoi with the American view. Ceaușescu asks whether the Chinese and the Vietnamese have answered.'
      n: '"[Transcript of the Discussions on the Occasion of the Reception by Comrade N. Ceausescu of I. Czesak, Member of the Central Committee of the Polish United Workers Party (P.U.W.P.)](https://digitalarchive.umd.edu/document/122559)" (Jan. 7, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 2/1966, file 1–8, trans. Larry L. Watts, Wilson Center Digital Archive. The discussions began at 1800 hrs. See [[cal.1966-01-05.vietnam-diplomacy]]. Names: Ceaușescu, Gomułka, Harriman. Check: the place; the transcript names none. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
