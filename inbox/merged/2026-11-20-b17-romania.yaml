- add:
    entry:
      id: cal.1965-02.soviet-union
      when: Feb., late
      date: 1965-02
      at: before 1965-02-19
      place: bucharest
      thread: soviet-union
      c: 'A representative of the CPSU Central Committee''s International Department, at Bucharest, asks the Romanians to take part in the meeting of Mar. 1. They refuse and advise renouncing it: Kosygin''s visits to Vietnam, China and Korea, they say, have made it needless. Ceaușescu''s account to Zhou, Mar. 25.'
      n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Ceaușescu: ''Just a few days before the beginning of that gathering''; the representative ''was here''. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 252, 690–714). See [[cal.1965-02-06.soviet-union]]. Names: Ceaușescu, Kosygin. Check: the day and the representative''s name.'
