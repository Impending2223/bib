      c: 'By Zhou''s account to the Romanian leaders, Mar. 25, Castro says that China has so large a population and asks why it does not send a million men to fight in Vietnam.'
      n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou: ''On 13 March of this year, Fidel Castro said''; the occasion not given. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 252, 690–714). Names: Castro, Zhou Enlai. Check: the occasion and Castro''s own words.'
