      id: cal.1966-01-05.vietnam-diplomacy
      when: 'Jan. 5'
      date: '1966-01-05'
      thread: vietnam-diplomacy
      also: [china, soviet-union]
      c: 'Gomułka, for the Polish party''s Central Committee, writes Ceaușescu: the Poles have proposed to the Chinese party a conference of the Warsaw Pact parties and the Asian socialist parties on coordinating aid to the DRV and the National Liberation Front, with a copy of their letter, and ask the RCP to examine and support it.'
      n: '"[Letter from the Central Committee of the Polish United Workers Party to Comrade Nicolae Ceausescu, General Secretary of the Central Committee of the Romanian Communist Party](https://digitalarchive.umd.edu/document/122560)" (Jan. 5, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 5/P Ceausescu, January 5, 1966, f. 6–7, trans. Larry L. Watts, Wilson Center Digital Archive. The enclosed copy is of the Polish letter to the Chinese Communist Party of Dec. 28, 1965 (as Ceaușescu''s reply dates it). Names: Gomułka, Ceaușescu. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:poland
      - polity:romania
      - name:gomulka-wladyslaw
      - name:ceausescu-nicolae
      - vis:only:poland+romania
      - ok:fields-place
