- add:
    entry:
      id: cal.1966-01-26.vietnam-diplomacy
      when: 'Jan. 26'
      date: '1966-01-26'
      thread: vietnam-diplomacy
      also: [china, soviet-union]
      c: 'Ceaușescu answers Gomułka''s letter of Jan. 5: any action in aid of Vietnam can be examined only after the DRV''s view is known; the Polish proposal to the Chinese is a matter for those two parties alone. He says Romania gives material, arms and full political support.'
      n: '"[Letter from Nicolae Ceausescu to Comrade Wladislaw Gomulka, First Secretary of the Central Committee of the Polish United Workers Party, Warsaw](https://digitalarchive.umd.edu/document/122561)" (Jan. 26, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 5/P – Ceausescu, January 26, 1966, f. 8–9, trans. Larry L. Watts, Wilson Center Digital Archive. See [[cal.1966-01-05.vietnam-diplomacy]]. Names: Ceaușescu, Gomułka. Check: the year the document was first printed or posted; the Archive page gives none.'
