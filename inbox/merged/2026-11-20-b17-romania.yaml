- add:
    entry:
      id: cal.1966-03.vietnam-hanoi-2
      when: Mar., before the 29th
      date: 1966-03
      at: before 1966-03-29
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china
      c: 'Before the 23rd Congress opens, the Workers'' Party of Vietnam''s delegation asks the Soviet leaders that the Congress not become a tribune of polemics, against the Chinese least of all, and that they stop criticizing the Chinese over the transit of Soviet supplies; Brezhnev promises, by Phạm Văn Đồng''s account to the Romanians, May 7.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7. Đồng: ''Cde. Brezhnev promised us''. Names: Brezhnev, Phạm Văn Đồng. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none.'
