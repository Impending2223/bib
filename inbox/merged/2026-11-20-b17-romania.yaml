      date: 1966-04
      at: before 1966-04-01
      place: moscow
      thread: soviet-union-leadership
      also:
      - europe-and-the-alliance
      c: 'Moscow, during the Congress. The first secretaries and premiers of the CMEA and Warsaw Pact states, Albania absent, meet and set their own meeting at Bucharest for July 1–10, on economic and security questions; Brezhnev repeats that it will dwell on common views. Bodnăraş''s and Niculescu-Mizil''s account to the Vietnamese, May 7 and 9.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7 (Bodnăraş: ''Also in Moscow took place a meeting of all first secretaries''); Note of First Restricted Meeting, May 9 (Niculescu-Mizil). See [[cal.1966-04.soviet-union-leadership]]. Names: Brezhnev. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none.'
