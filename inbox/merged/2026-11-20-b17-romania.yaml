      c: 'Hanoi. On the evening of its arrival Hồ Chí Minh and all the Political Bureau members meet the Romanian delegation under Bodnăraş at its residence, by Bodnăraş''s account to Zhou at Peking.'
      n: '"[Transcript of Conversation Between Emil Bodnaras, Leader of Government and Party Delegation Visiting the Democratic Republic of Vietnam, and Zhou Enlai, Prime Minister of the State Council of the People''s Republic of China](https://digitalarchive.umd.edu/document/122571)" (May 11, 1966), Document 12 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, Arhivele Naţionale, 2008, pp. 270–294; ANR, Fond C.C. al P.C.R., Secţia Relaţii Externe – China, dosar 71/1966, f. 2–46, trans. Larry L. Watts, Wilson Center Digital Archive. Bodnăraş: ''the first time even on the evening of our arrival''; the visit ''lasting five days''. Made public: 2008 ([[w.politica-independenta-a-romaniei]], Document 12, 270–294). Names: Hồ Chí Minh, Bodnăraş. Check: the day; the first working meeting was May 6.'
      tags:
      - polity:romania
      - polity:drv
      - name:ho-chi-minh
      - name:bodnaras-emil
