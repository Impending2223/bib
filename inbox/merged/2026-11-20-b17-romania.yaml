      when: Mar. 24
      date: '1965-03-24'
      thread: china
      also:
      - soviet-union
      c: 'Mikoyan asks to talk with the Chinese delegation; the Chinese, judging him even less credible than Kosygin, decide to tell him nothing, by Zhou''s account to the Romanian leaders the next day.'
      n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou: ''Yesterday, Mikoyan expressed the desire to talk with us''; ''this time I said nothing to Mikoyan''. The day as for [[cal.1965-03-24.soviet-union]]. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 252, 690–714). Names: Mikoyan, Kosygin, Zhou Enlai. Check: the day.'
