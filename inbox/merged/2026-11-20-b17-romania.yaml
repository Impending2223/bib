- add:
    entry:
      id: cal.1966-05.vietnam-diplomacy
      when: 'May, before the 10th'
      date: '1966-05'
      at: 'before 1966-05-10'
      place: washington
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'Rusk and Balaceanu, Romania''s ambassador, talk on Vietnam at a Washington reception for the diplomatic corps, as Romanian cables of May 10 report. Rusk: the U.S. neither wants to stay nor to widen the war and will not let Hanoi take the South by arms; if Hanoi slows its troops'' flow, matching steps toward talks. Balaceanu: the U.S. should address Hanoi and the Front; Romania will not mediate.'
      n: '"[Telegram of the Ministry of Foreign Affairs to the Ambassador of Romania in Hanoi, Regarding the Conversation of Petre Balaceanu, Ambassador of Romania in Washington, with Dean Rusk](https://digitalarchive.umd.edu/document/122569)" (May 10, 1966), Document 2 in Paul Niculescu-Mizil, România şi războiul americano-vietnamez, Bucharest, Editura Roza Vânturilor, 2008, pp. 181–183; AMAE, Telegram no. 123156 (to Hanoi from Dr VI) 1966 May 10, trans. Larry L. Watts, Wilson Center Digital Archive. The same account is in the cable to the embassy at Peking, [May 10, 1966](https://digitalarchive.umd.edu/document/122570) (''recently'', no day given). Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 292, 786–87, the cable to Peking); the cable to Hanoi printed 2008 ([[w.niculescu-mizil-romania-si-razboiul-americano]], Document 2, 181–83). Names: Rusk, Balaceanu, Mănescu. Check: the day; the cable to Peking says ''recently'', the cable to Hanoi gives no time.'
      tags:
      - polity:us
      - polity:romania
      - name:rusk-dean
      - name:balaceanu-petre
      - name:manescu-corneliu
      - vis:only:us+romania
- add:
    entry:
      id: cal.1966-05-06.vietnam-hanoi
      when: 'May 6'
      date: '1966-05-06'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy]
      c: 'Hanoi. The Romanian party-government delegation under Bodnăraş, with Niculescu-Mizil, holds its first meeting with Phạm Văn Đồng, Nguyễn Duy Trinh, Lê Thanh Nghị, Hoàng Văn Hoan and others. Đồng thanks Romania for its aid and its decision to support an office of the National Liberation Front at Bucharest, and presents the war and the DRV''s four points. Bodnăraş thanks him.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 1st Meeting, Friday, May 6, 1966; the transcript, with its two restricted meetings, is dated May 20, 1966. Names: Bodnăraş, Phạm Văn Đồng, Nguyễn Duy Trinh. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:bodnaras-emil
      - name:pham-van-dong
      - name:nguyen-duy-trinh
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-07.vietnam-hanoi-2
      when: 'May 7'
      date: '1966-05-07'
      time: 1966-05-07T02:00Z
      time_zone: 'Asia/Bangkok'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, china, soviet-union]
      c: 'Hanoi. The second and third meetings. Bodnăraş sets out the RCP''s course: no supranational bodies in the CMEA or the Warsaw Pact, no part in polemics against China or campaigns against Albania, good relations with all, and diplomatic status for the National Liberation Front''s representative at Bucharest. Đồng agrees on the principles; before the CPSU''s Congress, he says, his delegation asked the Soviets to stop criticizing China over the transit of aid, and Brezhnev promised, but Malinovsky has since spoken at Budapest and Peking answered.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, Saturday, May 7, 1966, 0900 hours; 3rd Meeting the same day. The time is the first sitting''s. Bodnăraş: ''we said a categoric "no!" to the projects''; Đồng: Malinovsky''s declaration ''provoked a counter-declaration from Beijing''. See [[cal.1966-05-06.vietnam-hanoi]], [[cal.1966-05-03.china-2]]. Names: Bodnăraş, Phạm Văn Đồng, Brezhnev, Malinovsky. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:bodnaras-emil
      - name:pham-van-dong
      - name:brezhnev-leonid
      - name:malinovsky-rodion-y
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-09.vietnam-hanoi
      when: 'May 9'
      date: '1966-05-09'
      time: 1966-05-09T02:30Z
      time_zone: 'Asia/Bangkok'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, china, soviet-union]
      c: 'Hanoi. The fourth meeting. Phạm Văn Đồng recounts the party''s road: power won in August 1945, independence proclaimed by Hồ Chí Minh Sept. 2, 1945, the war with the French to Dien Bien Phu and Geneva, the Americans in the South after 1954 and the elections of 1956 blocked; at the end of 1964, he says, the Americans saw they could win nothing in the South without attacking the North.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 4th Meeting, Monday, May 9, 1966, 0930 hours. See [[cal.1966-05-07.vietnam-hanoi-2]]. Names: Phạm Văn Đồng, Hồ Chí Minh. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:pham-van-dong
      - name:ho-chi-minh
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-10.vietnam-diplomacy
      when: 'May 10'
      date: '1966-05-10'
      place: bucharest
      thread: vietnam-diplomacy
      also: [china, vietnam-hanoi]
      c: 'Mezincescu, Deputy Foreign Minister, receives Zeng Yongquan, the Chinese ambassador, and gives him Rusk''s talk with Romania''s ambassador at Washington, in the two sides'' exchange of information on matters of common interest. The ambassador thanks him. The Foreign Ministry cables the embassy at Peking.'
      n: '"[Telegram from the Ministry of Foreign Affairs Regarding the Conversation of Petre Balaceanu with Dean Rusk Referring to the War in Vietnam](https://digitalarchive.umd.edu/document/122570)" (May 10, 1966), Document 292 in Budura, Relaţiile Româno-Chineze, 1880–1974: Documente (2005) pp. 786–7; AMAE, fond Telegrame, Pekin, vol. I, 1966, f. 141–3, trans. Larry L. Watts, Wilson Center Digital Archive. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 292, 786–87). See [[cal.1966-05.vietnam-diplomacy]].'
      tags:
      - polity:romania
      - polity:prc
      - vis:only:romania+prc
- add:
    entry:
      id: cal.1966-05-10.vietnam-diplomacy-2
      when: 'May 10'
      date: '1966-05-10'
      time: 1966-05-10T07:30Z
      time_zone: 'Europe/Bucharest'
      place: bucharest
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'Mezincescu gives Hoa Tu Truc, the DRV''s chargé, Rusk''s talk with Romania''s ambassador at Washington, at the Vietnamese side''s earlier request for news of American thinking; the chargé calls such news useful to the DRV''s line. The Foreign Ministry cables Moanga at Hanoi: if the Vietnamese raise it before the delegation leaves, show no knowledge.'
      n: '"[Telegram of the Ministry of Foreign Affairs to the Ambassador of Romania in Hanoi, Regarding the Conversation of Petre Balaceanu, Ambassador of Romania in Washington, with Dean Rusk](https://digitalarchive.umd.edu/document/122569)" (May 10, 1966), Document 2 in Paul Niculescu-Mizil, România şi războiul americano-vietnamez, Bucharest, Editura Roza Vânturilor, 2008, pp. 181–183; AMAE, Telegram no. 123156 (to Hanoi from Dr VI) 1966 May 10, trans. Larry L. Watts, Wilson Center Digital Archive. At 0930 Bucharest time, Foreign Ministry telegram no. 123156. Made public: 2008 ([[w.niculescu-mizil-romania-si-razboiul-americano]], Document 2, 181–83). See [[cal.1966-05.vietnam-diplomacy]].'
      tags:
      - polity:romania
      - polity:drv
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-10.vietnam-hanoi
      when: 'May 10'
      date: '1966-05-10'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, china, soviet-union]
      c: 'Hanoi. The second restricted meeting. Đồng, having studied the Romanian proposal with Hồ Chí Minh, Lê Duẩn and others: the DRV agrees to it and will take part, on the same condition. He sets out its position toward the Soviet Union, with which it can now argue its differences, and toward China, whose aid it values and which calls Soviet aid too small and ''interested and dishonest''; he faults the non-aligned conference of 1964 and La Pira, and asks that the talks stay confidential and that Romania train Vietnamese students and specialists.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. Note on the Second Restricted Meeting of May 10, 1966. Bodnăraş invites Hồ Chí Minh and Đồng to Romania. See [[cal.1966-05-09.vietnam-hanoi]]. To check: the DRV''s side of the Hanoi talks of May 6–10, in a Vietnamese record. Names: Bodnăraş, Phạm Văn Đồng, Hồ Chí Minh, Lê Duẩn. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:bodnaras-emil
      - name:pham-van-dong
      - name:ho-chi-minh
      - name:le-duan
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-25.vietnam-diplomacy
      when: 'May 25'
      date: '1966-05-25'
      thread: vietnam-diplomacy
      also: [vietnam-hanoi, china, soviet-union]
      c: 'Niculescu-Mizil, on the party leadership''s instructions, has Hoa Tu Truc, the DRV''s chargé, tell the Workers'' Party of Vietnam: Zhou Enlai heard at Peking the two parties'' call for a common show of socialist solidarity on Vietnam and agreed to discuss it at his Romanian visit; the Soviets, told at the Ceaușescu–Brezhnev meetings, agreed with the idea. The Foreign Ministry cables Moanga at Hanoi.'
      n: '"[Telegram from Romanian Ministry of Foreign Affairs to the Romanian Ambassador to The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122572)" (May 25, 1966), Document 3 in Niculescu-Mizil, România şi războiul americano-vietnamez (2008), pp. 183–184; AMAE, Cabinetul Corneliu Manescu, M 25 5 1966, trans. Larry L. Watts, Wilson Center Digital Archive. Made public: 2008 ([[w.niculescu-mizil-romania-si-razboiul-americano]], Document 3, 183–84). See [[cal.1966-05-10.vietnam-hanoi]]. Names: Zhou Enlai, Ceaușescu, Brezhnev. Check: the place; the cable names none.'
      tags:
      - polity:romania
      - polity:drv
      - name:zhou-enlai
      - name:ceausescu-nicolae
      - name:brezhnev-leonid
      - vis:only:romania+drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-05-26.vietnam-diplomacy
      when: 'May 26'
      date: '1966-05-26'
      thread: vietnam-diplomacy
      also: [europe-and-the-alliance]
      c: 'Ceaușescu receives Mario Zagari, Italian Undersecretary of State for Foreign Affairs, and presses him: Italy could do more to end the bombing of the DRV, as France and Denmark do; the two Latin countries and France might act together. He says the Romanian delegation back from Vietnam found the Vietnamese set on fighting. Zagari: he will put it to his foreign minister before Mănescu comes to Rome; Italy keeps a double prudence, at home and toward the U.S.'
      n: '"[Transcript of Discussions on the Occasion of the Reception by Comrade Nicolae Ceausescu of Mr. Mario Zagari, Undersecretary of State in the Italian Foreign Ministry](https://digitalarchive.umd.edu/document/122573)" (May 26, 1966), ANR, fond C.C. al P.C.R. – Secţia Relaţii Externe, dosar 75/1966, f. 1–14, trans. Larry L. Watts, Wilson Center Digital Archive. Zagari on Fanfani''s speech to the Senate: Italy''s action ''in certain limits''. Names: Ceaușescu, Mănescu. Check: the place; the transcript names none. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - ok:fields-place
      - polity:romania
      - polity:italy
      - name:ceausescu-nicolae
      - name:manescu-corneliu
      - name:fanfani-amintore
      - vis:only:romania+italy
- add:
    entry:
      id: cal.1966-05-27.vietnam-diplomacy
      when: 'May 27'
      date: '1966-05-27'
      place: bucharest
      thread: vietnam-diplomacy
      c: 'Bodnăraş receives Davis, the new U.S. ambassador, in presentation audience for two hours and fifty minutes, by the Romanian note. Davis asks what the Romanian delegation took from its visit to Hanoi, Peking and Moscow; Bodnăraş: the Vietnamese are united and set on fighting, and the way to talks is an end to the bombing and acceptance of the Front. Davis says the problems are clear and thanks him for his frankness.'
      n: '"[Emil Bodnaras, First Vice-President of the Council of Ministers of the Socialist Republic of Romania, Received Richard H. Davis, Ambassador of the United States of America in Bucharest](https://digitalarchive.umd.edu/document/122574)" (June 7, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, Dosar 181/1966, f. 83–95, trans. Larry L. Watts, Wilson Center Digital Archive. The Archive dates the note June 7, 1966; its first lines give the audience as May 27. To check: Bucharest''s telegram 1095, May 27, 1966, Department of State (named in the Archive''s note). Names: Bodnăraş. Check: the day of the note, June 7, against the audience, May 27. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:us
      - name:bodnaras-emil
      - vis:only:romania+us
- add:
    entry:
      id: cal.1966-05-28.middle-east
      when: 'May 28'
      date: '1966-05-28'
      thread: middle-east
      also: [vietnam-diplomacy]
      c: 'Stoica and Maurer hold official talks with the Shah of Iran, Mohammad Reza Pahlavi. The Shah: an international body with authority to keep the peace is needed, and the UN cannot act on Vietnam. Stoica: the Americans broke Geneva, and the blocs should go, the Warsaw Pact when NATO does; both sides want permanent embassies and a communiqué.'
      n: '"[Transcript of the Official Conversations Between Romanian President of the Council of State Chivu Stoica and Prime Minister Ion Gheorghe Maurer, and Shah Mohammad Reza Pahlavi](https://digitalarchive.umd.edu/document/122575)" (May 28, 1966), ANR, fond C.C. al P.C.R. – Secţia Relaţii Externe, dosar 76/1966, f. 1–13 (and 79/1966, f. 1–14), trans. Larry L. Watts, Wilson Center Digital Archive. Names: Maurer, Pahlavi. Check: the day and the place; the transcript gives neither, and Ceaușescu''s talk of June 3 speaks of seeing the Shah ''yesterday''. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:iran
      - name:maurer-ion-gheorghe
      - name:pahlavi-mohammed-reza
      - vis:only:romania+iran
      - ok:fields-place
- add:
    entry:
      id: cal.1966-06-03.vietnam-diplomacy
      when: 'June 3'
      date: '1966-06-03'
      time: 1966-06-03T07:00Z
      time_zone: 'Europe/Bucharest'
      place: bucharest
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'Ceaușescu receives Hoang Tu, the DRV''s ambassador, for 25 minutes. Tu brings Hồ Chí Minh''s greetings and what Tu says is a piece of the 1,000th American aircraft shot down over the DRV. Ceaușescu: the Romanian delegation came back from Vietnam enthusiastic; he wants a meeting of the socialist countries on aid, and says the Shah of Iran, seen the day before, agreed the Vietnamese should settle their own affairs.'
      n: '"[Transcript of the Discussions Held on the Occasion of the Reception by Comrade Nicolae Ceausescu of the Ambassador of the Democratic Republic of Vietnam in Bucharest, Hoang Tu](https://digitalarchive.umd.edu/document/122576)" (June 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 80/1966, f. 1–5, trans. Larry L. Watts, Wilson Center Digital Archive. The discussions began at 9 o''clock and lasted 25 minutes. See [[cal.1966-05-28.middle-east]]. Names: Ceaușescu, Hồ Chí Minh, Pahlavi. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:ceausescu-nicolae
      - name:ho-chi-minh
      - name:pahlavi-mohammed-reza
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-09-10.vietnam-diplomacy
      when: 'Sept. 10'
      date: '1966-09-10'
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'Maurer receives Hoang Tu, the DRV''s ambassador, with Hoa Tu Truc, Macovescu and others present. Tu gives Hanoi''s answer to Maurer''s suggestion of Aug. 12 for a meeting: thanks, no essential change since the last Romanian visit, a Romanian delegation welcome if it travels incognito, its level for the Romanians to set. Maurer: welcome; Romania wants an exchange of views after his visits abroad, and the strategy should not change.'
      n: '"[Memorandum of Conversation Between Ion Gheorghe Maurer, President of the Council of Ministers of the S. R. Romania, and Hoang Tu, Ambassador of the D.R. Vietnam](https://digitalarchive.umd.edu/document/122578)" (Sept. 10, 1966), Document 8 in Niculescu-Mizil, România şi războiul americano-vietnamez (2008), p. 188; ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 118/1966, f. 26–28, trans. Larry L. Watts, Wilson Center Digital Archive. Made public: 2008 ([[w.niculescu-mizil-romania-si-razboiul-americano]], Document 8, 188). Names: Maurer, Macovescu. Check: the place; the memorandum names none.'
      tags:
      - polity:romania
      - polity:drv
      - name:maurer-ion-gheorghe
      - name:macovescu-gheorghe
      - vis:only:romania+drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-09-21.vietnam-diplomacy
      when: 'Sept. 21'
      date: '1966-09-21'
      place: bucharest
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'The RCP Central Committee receives Lê Thanh Nghị''s DRV government economic delegation. Ceaușescu: the Romanian delegation was well received in Vietnam; unity of the socialist countries matters, and Maurer and Niculescu-Mizil''s coming visit will take up the political and diplomatic struggle. Nghị, for the Political Bureau: conditions for negotiating are not ripe, and the U.S. must stop the bombing unconditionally.'
      n: '"[Transcript of Reception by the C.C. of the R.C.P. of the Governmental Economic Delegation from the D.R. Vietnam, Led by Cde. Thanh Nghi, Member of the Political Bureau of the C.C. of the Workers Party of Vietnam](https://digitalarchive.umd.edu/document/122579)" (Sept. 21, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 119/1966, f. 1–18, trans. Larry L. Watts, Wilson Center Digital Archive. See [[cal.1966-09-10.vietnam-diplomacy]]. Names: Ceaușescu, Maurer. The place: the Central Committee, by the Archive''s title. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:ceausescu-nicolae
      - name:maurer-ion-gheorghe
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-09-28.vietnam-diplomacy
      when: 'Sept. 28'
      date: '1966-09-28'
      place: bucharest
      time: 1966-09-28T10:00Z
      time_zone: 'Europe/Bucharest'
      thread: vietnam-diplomacy
      also: [vietnam-hanoi, soviet-union]
      c: 'The RCP Central Committee''s Permanent Presidium, Ceaușescu presiding, with Stoica, Maurer, Apostol, Bârlădeanu, Bodnăraş and Niculescu-Mizil: approves the position the delegation under Maurer will take in its talks in the DRV. The excerpt also records Niculescu-Mizil''s audience for the DRV''s ambassador at Bucharest, on the Moscow talks on military objectives and Mănescu''s talk with Goldberg, urging that the moment be used to halt the bombing.'
      n: '"[Excerpt from Protocol No. 41 of the RCP CC Permanent Presidium Meeting](https://digitalarchive.umd.edu/document/122580)" (Sept. 28, 1966), Document 9 in Niculescu-Mizil, România şi războiul americano-vietnamez (2008), pp. 190–191; Arhiva Comitetului Executiv al CC al PCR, Nr. 2433, 19.10.1966, trans. Larry L. Watts, Wilson Center Digital Archive. Protocol no. 41; the meeting began at 1200 hrs. Made public: 2008 ([[w.niculescu-mizil-romania-si-razboiul-americano]], Document 9, 190–91). See [[cal.1966-09-21.vietnam-diplomacy]]. Names: Ceaușescu, Maurer, Bodnăraş, Mănescu, Goldberg. The place: the Permanent Presidium''s seat. Check: the day of Niculescu-Mizil''s audience for the DRV ambassador; the excerpt gives none.'
