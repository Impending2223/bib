      date: '1966-05-10'
      thread: vietnam-diplomacy
      also:
      - europe-and-the-alliance
      c: 'Kádár on an official visit to Romania; the Hungarians propose a meeting on coordinating aid to Vietnam, by the Archive''s note to the Romanian transcript of the Hanoi talks of Oct. 3, 1966.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Note 2: the proposal ''was presented during'' Kádár''s visit, May 10–11, 1966, citing ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 19/1966, f. 1–83. To check: the Romanian record of Kádár''s visit, ANR, dosar 19/1966, f. 1–83 (cited by the Archive''s note). Names: Kádár. Check: the year the document was first printed or posted; the Archive page gives none.'
