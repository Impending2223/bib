        n: 'Statement by the President on the Senate''s Action in Passing the Civil Rights Bill, [1968–69 Pub. Papers 374](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=452) (Mar. 11, 1968). [[w.kotz-judgment-days]], 391 (71–20; Johnson calls on the House); [[w.branch-at-canaans-edge]], 711 (the eighth cloture); [[w.bernstein-guns-or-butter]], 499 (Dirksen''s substitute adopted 83 to 5; the bill passed 71 to 20). The Senate sat from noon to 6:35 p.m.: [Daily Digest, D90](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=88). To check: New York Times, March 12, 1968, p. 1 (cited by [[w.branch-at-canaans-edge]], 711); [[w.graham-civil-rights-era]], 270–71 (cited by [[w.branch-at-canaans-edge]], 711); New York Times, March 5, 1968, pp. 1, 28 (cited by [[w.branch-at-canaans-edge]], 711); New York Times, Feb. 28, 1968, pp. 1, 30 (cited by [[w.branch-at-canaans-edge]], 711). See [[cal.1968-02-06.open-housing]]. Names: Johnson.'
