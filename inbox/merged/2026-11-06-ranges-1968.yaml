        n: '[114 Cong. Rec. 3696](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt3/pdf/GPO-CRECB-1968-pt3-8-1.pdf#page=30) (1968) (Fino''s motion to recommit, roll no. 30: yeas 188, nays 206, "present" 1; passage, roll no. 31: yeas 199, nays 190). FRUS 1964–68, VIII, doc. [180](https://history.state.gov/historicaldocuments/frus1964-68v08/d180). [[w.cq-weekly-report]], Mar. 1, 1968, 382. On the floor, by its account (382–83): Blackburn''s amendment, a 12.5 percent cover, refused 39–73 standing; Albert W. Johnson''s, 18.75 percent, by voice; Mills: defeat "could create the greatest run on our gold stocks that has ever occurred"; Ford: "to cure cancer with a band aid." The House Republican Policy Committee against "sanctioning in advance the dissipation of our remaining gold supply"; Fowler and Martin, by letter to Patman, against a partial cover. The recommittal 188–206, the Record''s tally, as CQ gives it (canvass, Nov. 5, 2026). The House sat from noon to 5 p.m.: [Daily Digest, D56](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=54). Check: Voteview counts 189–205. To check: [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]. See [[cal.1968-01-01.economy]]. Names: Fowler, Johnson.'
