      c: Soviet Foreign Ministry, Southeast Asia department (acting chief Molyakov), "Information on the Situation in South Vietnam," from the Ministry's, the General Staff's and the KGB's materials. It reports that, by the Vietnamese, 920 of 1,290 southern communes are outside Diệm's administration, traces the Party's turn to armed struggle and counts some 2,000 American advisers. It judges that the Vietnamese, "apparently not without the influence of the Chinese," are forcing armed struggle without political preparation, which may bring negative consequences.
      n: '"[Soviet Foreign Ministry, Information on the Situation in South Vietnam](https://digitalarchive.umd.edu/document/121089)" (Dec. 26, 1961), AVPRF, fond 079, opis 16, papka 32, delo 20, listy 102–108, trans. Daniel Rozas for CWIHP, Wilson Center Digital Archive. Secret, copy no. 1, no. 930/yuva; an attachment. Names: Ngô Đình Diệm. Check: the year the Archive posted the document; its page gives none.'
