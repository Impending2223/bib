      c: 'Kiev. Khrushchev speaks with Korneychuk of the plan to resume nuclear tests; Korneychuk, in Moscow, is to tell Bernal of it in confidence. Khrushchev''s account to Hồ Chí Minh the next day.'
      place: kiev
      n: '"[Record of Conversations between Cde. N. S. Khrushchev, First Secretary of the CPSU CC, and Ho Chi Minh, Chairman of the CC of the VWP](https://digitalarchive.umd.edu/document/300879)" (Aug. 17 and 19, 1961), RGANI, f. 52, op. 1, d. 555, ll. 125–150, contributed by Sergey Radchenko, trans. Gary Goldberg, Wilson Center Digital Archive (the talk of Aug. 17). The words: "Yesterday I spoke about this question with Cde. Korneychuk in Kiev." Names: Khrushchev, Hồ Chí Minh. Check: the year the Archive posted the document; its page gives none.'
