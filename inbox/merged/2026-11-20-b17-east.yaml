      c: Near Bucharest, the CPSU delegation's residence during the RCP's Ninth Congress. Brezhnev, with Andropov, meets Ceaușescu and Maurer. By the Soviet record he reports the DRV's requests for missiles, MiG-21s and perhaps volunteers and complains of China's refusals and abuse; he says the Vietnamese do not mean to negotiate; he invites a Romanian party-government delegation to the USSR and proposes a Warsaw Pact meeting.
      place: bucharest
      n: '"[Record of a Conversation between L. I. Brezhnev and N. Ceausescu and I. G. Maurer on 25 July 1965](https://digitalarchive.umd.edu/document/300558)" (July 25, 1965), RGANI, f. 80, op. 1, d. 758, ll. 72–76, contributed by Sergey Radchenko, trans. Gary Goldberg, Wilson Center Digital Archive (the first of the document''s two records, headed July 20; the Archive dates the document by the second, of July 25). Secret; the record says Brezhnev did not review it, and the translator notes that the available text ends without the name of its recorder. To check: [[w.brezhnev-rabochie-i-dnevnikovye]]. See [[cal.1965-07-17.soviet-union-leadership]]. Names: Brezhnev, Andropov, Ceaușescu, Maurer. Check: the year the Archive posted the document; its page gives none.'
