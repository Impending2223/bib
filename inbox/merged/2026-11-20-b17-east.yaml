      c: 'Cairo. Kosygin arrives in the UAR on Nasser''s invitation for an official visit, to May 18 (Cairo, Aswan, Alexandria), with Gromyko, the energy minister, the chairman of the foreign economic relations council and a deputy defense minister. Three sessions of official talks, and private talks with Nasser, Amer present; a joint communiqué on Vietnam, Palestine and disarmament. By the Soviet ambassador''s account to the Hungarians, Kosygin asks the UAR for a firmer line on Vietnam; the Soviets tell Nasser Israel cannot make a bomb, and agree to cut the military debt by about half.'
      place: cairo
      n: '"[Report from the Hungarian Embassy in Cario on Kosygin''s visit in the UAR](https://digitalarchive.umd.edu/document/122514)" (May 26, 1966), MOL XIX-J-1j SZU/IV-10/003348/1966 104.d., trans. András Bocz, Wilson Center Digital Archive. The report gives the visit''s dates and places and not the day of any session: the entry stands on the visit''s first day, its talks those of May 10–18; the place is the arrival''s, in Cairo. To check: the Soviet and Egyptian press and communiqué. Names: Kosygin, Nasser, Gromyko, Amer. Check: the day of each talk.'
