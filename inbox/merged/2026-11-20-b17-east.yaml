      c: 'Panmunjom. The Hungarian ambassador to the DPRK, József Kovács, on a trip May 12–14, sees new antitank obstacles going up in the northern part of the demilitarized zone, by his report the first built along the highway since 1953; Colonel Borski doubts they would stop tanks.'
      place: panmunjom
      n: '"[Hungarian Embassy in the DPRK, Report, 30 May 1965. Subject: On China''s war plans.](https://digitalarchive.umd.edu/document/121766)" (May 30, 1965), Hungarian National Archives (MOL), XIX-J-1-j China, 1965, 71. doboz, IV-40, 003661/RT/1965, trans. Balázs Szalontai, Wilson Center Digital Archive. The words: "On the occasion of my trip to Panmunjeom on May 12-14th." Check: the year the Archive posted the document; its page gives none.'
