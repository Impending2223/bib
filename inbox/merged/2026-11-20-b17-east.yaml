- add:
    entry:
      id: cal.1968-07-06.soviet-union-leadership-2
      when: July 6
      date: '1968-07-06'
      place: moscow
      thread: soviet-union-leadership
      also:
      - middle-east
      c: 'Brezhnev, Kosygin and Podgorny with Nasser, from 11 a.m.; Gromyko and Vinogradov, Sadat and Riad there too. By the Soviet minutes Nasser asks for ties built on a shared socialist path and recalls his offer of a defense agreement, which he says he did not mean at once; Brezhnev answers that a treaty would aggravate the Middle East and add nothing, and says the USSR sent 575 heavy aircraft with arms. The Soviets offer MiG-21s in place of part of the Il-28s promised, Strela and Malyutka missiles, Grad rockets and crossing equipment, and speak of Arafat, now in Moscow, and the Egyptian army''s want of political workers.'
      n: '"[Minutes of the Discussions between Cdes. L.I. Brezhnev, A.N. Kosygin, N.V. Podgorny and UAR President Nasser, 6 July 1968](https://digitalarchive.umd.edu/document/300530)" (July 6, 1968), RGANI, f. 80, op. 1, d. 602, ll. 113–143, contributed by Sergey Radchenko, trans. Angela Greenfield, Wilson Center Digital Archive (the July 6 session; secret, copy no. 2; the translation marks two pages illegible; it gives no hour; recorded by A. I. Kuz''min, interpreted by V. V. Posuvalyuk). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 269–71 (July 6, from 11 a.m.). See [[cal.1968-07-04.soviet-union-leadership-2]]. Names: Brezhnev, Kosygin, Podgorny, Nasser, Gromyko, Vinogradov, Sadat, Riad, Arafat. Check: the year the Archive posted the minutes; the workbooks'' 2016 may be later.'
