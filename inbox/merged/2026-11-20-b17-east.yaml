      c: Sofia, 4:50 p.m., before the evening session of the Warsaw Pact's Political Consultative Committee. Ceaușescu asks Brezhnev whether to propose that the Vietnam declaration say the Non-Proliferation Treaty will not be signed until the American aggression in Vietnam ceases. Brezhnev doubts it is advisable, since it has no chance of acceptance; Ceaușescu agrees the communiqué should mention efforts on disarmament.
