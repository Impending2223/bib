      c: The Soviet ambassador in the DPRK, Sudarikov, at Moscow's instruction, tells Foreign Minister Pak Seong-cheol of Phạm Văn Đồng's talks in Moscow. By Sudarikov's record Pak says Hanoi decides its own forms of struggle and doubts the Americans will leave Vietnam, and on the Pueblo that the Americans have promised to sign a document, the Soviet ambassador to be told first.
      n: '"[From the Journal of N.G. Sudarikov, ''Record of a Conversation with KWP Politburo member, Deputy Chairman of the Cabinet of Ministers, and DPRK Minister of Foreign Affairs, Pak Seong-cheol''](https://digitalarchive.umd.edu/document/134210)" (Dec. 21, 1968), RGANI, fond 5, opis 61, delo 466, listy 46–50, contributed by Sergey Radcheno [sic], trans. Gary Goldberg, Wilson Center Digital Archive. Secret, copy no. 2, Soviet Embassy in the DPRK, no. 37, dated Jan. 27, 1969; the meeting was at the Soviet side''s request. Pak says the Americans have promised to sign, and that the foreign ministry may inform the ambassadors that afternoon; the record gives no place. Names: Phạm Văn Đồng. Check: the year the Archive posted the document; its page gives none.'
