      c: Pitsunda. Khrushchev receives Hồ Chí Minh, who has come on the Albanian question. By the Soviet record Khrushchev tells him the danger of war is three to five percent, that the Soviet Union will resume nuclear tests in any case, and that the Albanian leadership has seized four submarines at Vlore; he criticizes China over Albania and the communes. After lunch he has the Soviet ambassador in Rome's cable on a talk with Fanfani read to Hồ, Thorez and Vermeersch.
      place: pitsunda
      n: '"[Record of Conversations between Cde. N. S. Khrushchev, First Secretary of the CPSU CC, and Ho Chi Minh, Chairman of the CC of the VWP](https://digitalarchive.umd.edu/document/300879)" (Aug. 17 and 19, 1961), RGANI, f. 52, op. 1, d. 555, ll. 125–150, contributed by Sergey Radchenko, trans. Gary Goldberg, Wilson Center Digital Archive. The first of the two talks in the document, headed Pitsunda, Aug. 17; the record says Khrushchev did not review the text; recorded by M. Podolsky and Yu. Pankov, five copies. The words: the talk is interrupted by the arrival of Thorez and Vermeersch; after lunch Khrushchev has the Rome cable read to the three. See [[cal.1961-08-16.testing]]. Names: Khrushchev, Hồ Chí Minh, Thorez, Fanfani. Check: the year the Archive posted the document; its page gives none.'
