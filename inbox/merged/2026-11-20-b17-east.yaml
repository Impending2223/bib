      c: 'Bucharest, the Soviet delegation''s residence. Ceaușescu and Maurer call on the CPSU delegation before it leaves; Andropov and three others of the delegation with Brezhnev. By the Soviet record Ceaușescu: a crisis of trust with China to be overcome, with patience and without constant critical articles; Brezhnev: the Chinese hard to understand, their *Nouvelle Humanité* in France. Ceaușescu proposes to come to the USSR Sept. 1–3, and wants the Albanians invited to the coming meeting of the Political Consultative Committee.'
      place: bucharest
      n: '"[Record of a Conversation between L. I. Brezhnev and N. Ceausescu and I. G. Maurer on 25 July 1965](https://digitalarchive.umd.edu/document/300558)" (July 25, 1965), RGANI, f. 80, op. 1, d. 758, ll. 72–76, contributed by Sergey Radchenko, trans. Gary Goldberg, Wilson Center Digital Archive (the second record, headed Bucharest, July 25; recorded by Ye. Karpeschenko; not reviewed by Brezhnev). See [[cal.1965-07-20.soviet-union-leadership]]. Names: Brezhnev, Andropov, Ceaușescu, Maurer. Check: the year the Archive posted the document; its page gives none.'
