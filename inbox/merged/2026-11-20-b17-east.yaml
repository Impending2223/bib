      when: Dec. 16
      date: '1966-12-16'
      place: moscow
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Moscow. Brezhnev again with the North Vietnamese delegation, 5 to 9 p.m., Kosygin and Andropov with him. By the Soviet record Lê Đức Thọ says the Politburo means to fight and negotiate together once the U.S. ends the bombing unconditionally and finally, with the four or five points as the DRV''s terms; the Chinese and Koreans have been told, and he asks the Soviets to let the Americans know through some channel. Brezhnev: decide yourselves, but a Warsaw Pact capital or the USSR would serve better for talks than Cambodia.'
      n: '"[Second Meeting: Record of a Conversation between CPSU CC General Secretary Cde. L. I. Brezhnev and Cde. Le Duc Tho, memeber of the Politburo and Secretary of the VWP CC](https://digitalarchive.umd.edu/document/177816)" (Dec. 16, 1966), RGANI, f. 80, op. 1, d. 521, ll. 29–80, contributed by Sergey Radchenko, trans. Gary Goldberg, Wilson Center Digital Archive (the second meeting; not examined by the participants; recorded by V. Zelentsov and I. Karpeshchenko, two copies). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 162 (Dec. 16). See [[cal.1966-12-15.soviet-union-leadership]]. Names: Brezhnev, Kosygin, Andropov, Lê Đức Thọ. Check: the year the Archive posted the record; the workbooks'' 2016 may be later.'
