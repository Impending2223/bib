- edit:
    id: cal.1966-06-27.china-leadership-2
    base: 76a9bdb9
    set:
      c: Zhou holds the fourth talks with Hoxha, Shehu and the other Albanian leaders at the Partisan Palace. By the Albanian record Zhou tells Hoxha and Shehu that class struggle goes on in socialist countries, Cuba, Romania, Korea and Vietnam among them, and names three anti-party groups in China, the last of Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun; the way is to "peel the bamboo." He says the Koreans avoid China and meet the Soviets in secret, that Soviet revisionism is penetrating Vietnam, where Lê Duẩn has changed, and that China will help if Hanoi insists on resistance, though the Vietnamese fear Chinese troops. He adds that the Romanians printed only summaries of his speeches, and that a two-hour dispute with their leaders held up a rally in Romania.
      src:
        c: 3b366d3f
        rows:
        - 'w.zhou-enlai-waijiao-huodong 499: A'
        - 'https://digitalarchive.umd.edu/document/300029: B-E'
