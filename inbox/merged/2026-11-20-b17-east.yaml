      c: 'The Kremlin. Khrushchev receives Phạm Văn Đồng, premier of the DRV; Gromyko and Andropov sit in, and Lê Thanh Nghị with Phạm. By the Soviet record Khrushchev tells him of the Albanian party ("a gangster Party"), of China''s communes, small furnaces and "paper tiger", the Tibet revolt and the Indian border, and that Mao "is in a hurry"; he offers the draft CPSU program for comment. The talk breaks off near lunch.'
      place: moscow
      n: '"[Record of Conversation between N.S. Khrushchev and Prime Minister Pham Van Dong of the Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/300877)" (June 27, 1961), RGANI, f. 52, op. 1, d. 555, ll. 94–110, contributed by Sergey Radchenko, trans. Gary Goldberg, Wilson Center Digital Archive. Secret copy no. 1; recorded by A. I. Glukhov of the Foreign Ministry''s translation bureau; a handwritten line says Khrushchev did not review the record. The record''s last lines, added by hand: Khrushchev, looking at the clock, says lunch is near and the time set for Phạm''s visit to Brezhnev is used up; the talk is interrupted. Names: Khrushchev, Phạm Văn Đồng, Gromyko, Andropov, Mao Zedong. Check: the year the Archive posted the document; its page gives none.'
