      c: The Soviet ambassador Shcherbakov, at the Soviet side's request and on Moscow's behalf, tells Phạm Văn Đồng of Gromyko's talks with Johnson and Rusk during the U.N. session. By Shcherbakov's record Phạm welcomes the Soviet contacts with the U.S. but warns against illusions about American peace moves, rejects the reciprocity in Goldberg's statement, and denies Rusk's claim of contact with the DRV; he says Hanoi has no internal report of the Bình Định battle that the party paper described.
      n: '"[From the Diary of Shcherbakov I.S., ''Record of Conversation with DRV Prime Minister Pham Van Dong, 2 November 1966''](https://digitalarchive.umd.edu/document/208393)" (Nov. 12, 1966), AVP RF, f. 79, op. 21, p. 51, d. 8, ll. 174–180, and RGANI, f. 5, op. 58, d. 260, ll. 320–326, trans. James Person, Sergey Radchenko and Gary Goldberg, obtained by James G. Hershberg and Sergey Radchenko, Wilson Center Digital Archive. Secret, no. 1190, signed "II.XI.66" as the translation prints it; the Archive dates the document Nov. 12, the record''s heading the talk Nov. 2. The AVP RF copy has a passage censored (pp. 5–6 of the document) that the RGANI copy gives. Phạm and the ambassador also speak of the Batitsky mission and the Nov. 7 reception. Names: Phạm Văn Đồng, Gromyko, Johnson, Rusk, Goldberg. Check: the place; the record gives none. Check: the year the Archive posted the document; its page gives none.'
