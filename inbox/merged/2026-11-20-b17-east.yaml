      c: In Poland, Ochab, for Gomułka, who is ill, tells Lê Thanh Nghị's delegation that Poland stands with Vietnam, asks what Poland can do to start talks, and asks what the Vietnamese make of a Chinese article saying the 17th Parallel no longer exists. By the Vietnamese report he is careful not to criticize China as Kirilenko did.
