      n: '[[w.macfarquhar-maos-last-revolution]], 210 ("at eleven o''clock on the night of July 19"). Made public: 1989. To check: [[w.zaidao-haojie-zhongde-yi-mu]], 79–85 (cited by [[w.macfarquhar-maos-last-revolution]], 210 n.45a); [[w.shaoguang-failure-of-charisma]], 154–155 (cited by [[w.macfarquhar-maos-last-revolution]], 210 n.45b).'
