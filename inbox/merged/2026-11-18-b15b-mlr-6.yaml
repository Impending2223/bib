      date: 1967-06
      at: before 1967-06-21
      thread: china-leadership
      also:
      - china
      c: 'Wuhan, the fighting, by the sides'' tallies: the Military Region, 342 soldiers attacked by rebels and 264 wounded; the rebels, 174 clashes from late April to late June, 70,000 people involved, 158 killed and 1,060 badly hurt; another rebel account, over 7,000 killed or hurt in May and 744 killed and 8,900 wounded after June 4.'
      n: '[[w.macfarquhar-maos-last-revolution]], 205 (a later PLA historian: 108 dead and 2,774 wounded, June 4–30). To check: [[w.shaoguang-failure-of-charisma]], 133–149 (cited by [[w.macfarquhar-maos-last-revolution]], 205 n.30); Wenge fengyun, no. 11 (1967), 4, 10 (cited by [[w.macfarquhar-maos-last-revolution]], 205 n.31); [[w.nianyi-da-dongluande-niandai]], 260 (cited by [[w.macfarquhar-maos-last-revolution]], 205 n.32).'
