- edit:
    id: cal.1967-02-16.china-leadership
    base: 17cfe27e
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 16, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 16, 1967; Zhou chairs at Huairen Hall; the meeting was to take up grasping revolution and promoting production in the State Council''s branches; Tan Zhenlin, Chen Yi, Ye Jianying, Li Xiannian and Yu Qiuli lose their temper at the Cultural Revolution Group''s Jiang Qing, Chen Boda and Kang Sheng for confusing Party and army and persecuting old cadres; Tan to Zhang Chunqiao: "you want to knock the old cadres down one by one; I will fight to the end, though they cut off my head, jail me and expel me from the Party"; Tan starts to leave and Zhou calls him back; Zhou asks Chen Boda why the *Hongqi* editorial of issue 13 was not shown to the Standing Committee). Made public: 1969. Names: Zhou Enlai, Tan Zhenlin, Chen Yi, Ye Jianying, Xu Xiangqian, Li Xiannian, Yu Qiuli, Chen Pixian, Zhang Chunqiao. Check: Made public: 1969 is the year of [[w.zai-zhonggong-ba-jie]], which prints Zhou Enlai''s Twelfth Plenum speech citing Tan Zhenlin''s words at the meeting (193 n.60); if it circulated internally, 1981 ([[w.wenge-shinian-ziliao-xuanbian]], the minutes, 193 nn.57–63), and if that too, 1994 ([[w.li-insiders-account-of-the]]).'
