by: 'Claude (batch 15, second wave: MacFarquhar and Schoenhals, Mao''s Last Revolution, run 6: pp. 184-220, ch. 11, The Last Stand of the Old Guard, and ch. 12, The Wuhan Incident, with their notes), Nov. 18, 2026'
