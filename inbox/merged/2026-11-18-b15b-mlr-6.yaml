- edit:
    id: cal.1966-12-26.china-leadership
    base: b02d5365
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 26, 1966. [[w.macfarquhar-maos-last-revolution]], 155 (the toast at the dinner: "To the unfolding of nationwide all-round civil war!"; Zhou Enlai, Tao Zhu, Lin Biao and Kang Sheng not invited); [[w.macfarquhar-maos-last-revolution]], 164 (at the dinner Mao speaks well of "revolutionary rebels rising up in party and state organs as well"). Made public: 1988. Check: the book (155) puts the guests at six of the Group (Chen Boda, Zhang Chunqiao, Yao Wenyuan, Wang Li, Guan Feng, Qi Benyu) with Mao and Jiang Qing; Wang Li has a different toast ("nationwide, all-round class struggle", 155 n.1). To check: [[w.nianyi-da-dongluande-niandai]], 164 (cited by [[w.macfarquhar-maos-last-revolution]], 155 n.1a); [[w.jingxian-shinian-yimeng]], 6–8 (cited by [[w.macfarquhar-maos-last-revolution]], 155 n.1b); [[w.li-xianchang-lishi]], 100–110 (cited by [[w.macfarquhar-maos-last-revolution]], 155 n.1c); [[w.li-insiders-account-of-the]], 32 (cited by [[w.macfarquhar-maos-last-revolution]], 155 n.1d). Names: Mao Zedong, Jiang Qing, Chen Boda, Zhang Chunqiao, Wang Li, Guan Feng, Qi Benyu, Yao Wenyuan.'
