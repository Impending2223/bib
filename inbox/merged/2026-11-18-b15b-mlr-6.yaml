    base: e83af13a
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 20, 1967; [[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 20, 1967; the Wuhan Incident: Xie Fuzhi and Wang Li, the Center''s delegation, suppress the "Million Heroes" backed by the Wuhan Military Region and call it a "conservative organization"; on the 20th the Heroes haul Wang Li from his lodging to the Region''s compound and question him; Wang is later falsely made out to have been a "mutiny" by Chen Zaidao, a "counter-revolutionary incident"). Made public: 1988. Names: Wang Li, Xie Fuzhi, Lin Biao, Jiang Qing, Mao Zedong.'
