- edit:
    id: cal.1967-02-18.china-leadership
    base: d47383bf
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 18, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967; Zhou reads the draft *Hongqi* editorial "Cadres Must Be Treated Rightly", which holds the great majority of cadres good and calls refusal of class analysis of power-holders, and doubt and overthrow of all, an anarchist trend; he notes that it is very important and timely and proposes it be discussed at the Party-government-army-Group liaison meeting before it appears; Mao agrees and asks the three-in-one be written in; printed Mar. 1); [[w.jianguo-yilai-mao-zedong]], XVIII, 480–482 (Feb. 18, 1967; Mao''s note, 8 p.m. Feb. 18, on the draft Chen Boda sent Feb. 17 and Zhou forwarded, and "Issue as is" on the revision of Feb. 22 by Chen, Guan Feng and Wang Li; he also made "some cadres" "many cadres" who may join the provisional organs; the revision added two paragraphs on the three-in-one; printed in *Renmin ribao* Feb. 23 and *Hongqi* no. 4, Mar. 1). Made public: 2006. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 12 (1998). To check: Zhou Enlai, note to Mao Zedong of Feb. 18, 1967 forwarding the Hongqi editorial draft "Cadres must be treated rightly" (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 481 n.3). Names: Mao Zedong, Zhou Enlai.'
- edit:
    id: cal.1967-02-19.china-leadership
    base: b69ec8dc
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 127 (Feb. 19, 1967; Zhou at the Politburo meeting; Zhou also makes self-criticism at the "life meetings" of Feb. 25 to Mar. 18; the Politburo stops meeting and the Cultural Revolution Group in effect takes its place; the liaison meeting Zhou led, with the vice-premiers and others, is replaced by the Cultural Revolution Group''s, which Wu Faxian and others join). Made public: 1988. Names: Mao Zedong, Zhou Enlai, Li Fuchun, Ye Jianying, Li Xiannian, Kang Sheng, Xie Fuzhi, Ye Qun, Lin Biao, Tan Zhenlin, Chen Yi, Xu Xiangqian, Nie Rongzhen, Jiang Qing.'
