      also:
      - china
      c: 'Wuhan Military Region headquarters, afternoon. Over 300 officers of division level and above hear Xie Fuzhi call for a "180-degree turnabout" and Wang Li, until 11 p.m., on the Cultural Revolution: they are "elementary school students"; the main contradiction is a handful of capitalist roaders in the Party and the army.'
      n: '[[w.macfarquhar-maos-last-revolution]], 209–210 (the afternoon; Wang Li done at eleven, 210). The time is Wang Li''s lecture''s start (210 n.44d). Made public: 1989. To check: [[w.zaidao-haojie-zhongde-yi-mu]], 74–79 (cited by [[w.macfarquhar-maos-last-revolution]], 210 n.44a); [[w.li-insiders-account-of-the]], 71 (cited by [[w.macfarquhar-maos-last-revolution]], 210 n.44b); [[w.ke-wenhua-dageming-zhongde-renmin]], 49 (cited by [[w.macfarquhar-maos-last-revolution]], 210 n.44c); [[w.shaoguang-failure-of-charisma]], 152–153 (cited by [[w.macfarquhar-maos-last-revolution]], 210 n.44d; Wang Li''s lecture from 4:00 to 11:00 p.m.). Names: Xie Fuzhi.'
