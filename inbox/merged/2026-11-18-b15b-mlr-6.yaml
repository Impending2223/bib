      date: '1967-06-26'
      thread: china-leadership
      also:
      - china
      c: 'The Central Cultural Revolution Group and the PLA Cultural Revolution Group cable Chen Zaidao: stop the violence; both sides will be called to Peking for the Group''s judgment.'
      n: '[[w.macfarquhar-maos-last-revolution]], 205. Made public: 1995. To check: [[w.shaoguang-failure-of-charisma]], 133–149 (cited by [[w.macfarquhar-maos-last-revolution]], 205 n.30).'
