      id: cal.1967-01.vietnam-4
      when: Jan.
      date: 1967-01
      thread: vietnam
      c: 'Taylor, his offer to resign turned down through Rostow, ten days in Vietnam: the big war going well, the enemy''s base areas entered; pacification and the local war much less so; some 385,000 Americans. On his return, to Johnson: goals for 1967, a maximum effort on every front at once.'
      n: '[[w.taylor-swords-and-plowshares]], 374–75. Check: the days. Names: Taylor, Rostow, Johnson.'
      src:
        c: 147671db
        rows:
