- add:
    entry:
      id: cal.1961-04-26.vietnam
      when: Apr. 26
      date: '1961-04-26'
      thread: vietnam
      c: 'McGarr before the Cuba Study Group, at Taylor''s invitation: Hanoi''s war of national liberation, declared in 1959; Diệm controls little more than 40 percent of the country, almost 85 percent of his forces tied down; the frontier with Laos and Cambodia open. McGarr confident in Diệm.'
      n: '[[w.taylor-swords-and-plowshares]], 221. Names: McGarr, Taylor, Ngô Đình Diệm.'
      src:
        c: 40b9d690
        rows:
