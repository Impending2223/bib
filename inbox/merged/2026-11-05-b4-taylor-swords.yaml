    entry:
      id: cal.1962-09.defense-4
      when: Sept., late
      date: 1962-09
      thread: defense
      c: 'Taylor''s farewell call on Kennedy before going to the Pentagon: Castro unresolved; NATO, and the contingent use of tactical nuclear weapons; the military voice too often absent in the high councils. Kennedy: telephone him directly whenever necessary.'
      n: '[[w.taylor-swords-and-plowshares]], 259–60. Check: the day. See [[cal.1962-09-25.vietnam]]. Names: Taylor, Kennedy.'
