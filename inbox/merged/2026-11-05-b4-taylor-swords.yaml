      date: '1964-12-21'
      thread: vietnam-saigon
      c: 'Taylor and U. Alexis Johnson call on Khánh: Khánh belligerent, the generals'' act meant to limit the deterioration, the armed forces again out of politics. Taylor: he has lost confidence in Khánh as an ally; Khánh''s withdrawal would serve the common cause.'
