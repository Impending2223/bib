      date: '1962-11-26'
      thread: missile-crisis
      c: 'Kennedy among the forces gathered for Cuba: Fort Stewart, Ga., the 1st Armored Division; Homestead Air Force Base, Fla., unit awards to the photographic units; Boca Chica Naval Air Station, Key West, Dennison there. A U-2 shown him; thanks to its pilots and the Tactical Air Command''s.'
