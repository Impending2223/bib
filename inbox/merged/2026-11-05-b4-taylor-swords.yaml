- add:
    entry:
      id: cal.1961-08.berlin-and-vienna
      when: Aug., late
      date: 1961-08
      thread: berlin-and-vienna
      c: 'Taylor to Kennedy, after the Allies are confined to Friedrichstrasse: two courses, to announce that the Allies will cross where they please, or to have the commandants cross elsewhere unless turned back by superior force. The President''s advisers cool, the mission in Berlin too.'
      n: '[[w.taylor-swords-and-plowshares]], 212. Check: the day. See [[cal.1961-08-22.berlin-and-vienna]]. Names: Taylor, Kennedy.'
