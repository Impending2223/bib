      - name:taylor-maxwell
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1961-06.intelligence
      when: June, early
      date: 1961-06
      thread: intelligence
      c: Robert Kennedy, for the President, proposes Taylor succeed Dulles at the CIA. Taylor declines to the President, offering his military experience instead. A Chief of Staff to the President, as Leahy had been, considered.
      n: '[[w.taylor-swords-and-plowshares]], 195–96 (as the Cuba report neared completion). Check: the day. See [[cal.1961-05-11.intelligence]]. Names: Robert Kennedy, Kennedy, Taylor, Dulles.'
