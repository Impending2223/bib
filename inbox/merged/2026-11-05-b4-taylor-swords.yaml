      when: Jan., early
      date: 1962-01
      thread: defense
      c: 'Taylor to Kennedy against cutting the forces built up for Berlin too soon: the strength in Europe to be held, the strategic reserve kept ready to deploy. Kennedy, loath to overrule McNamara, asks him how he will man a sixteen-division Army.'
      n: '[[w.taylor-swords-and-plowshares]], 207–08 (the cut kept after a spring''s discussion, its date put back from July to September). Check: the day. See [[cal.1961-11.defense]]. Names: Taylor, Kennedy, McNamara.'
