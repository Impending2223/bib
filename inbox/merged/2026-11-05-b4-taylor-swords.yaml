      when: Jan., mid-month
      date: 1966-01
      thread: transition-and-staff
      c: 'Taylor''s report to Johnson on counterinsurgency, from four interdepartmental committees: subversive insurgency part of the larger matter of the underdeveloped world; the Secretary of State to direct, coordinate and supervise interdepartmental activities overseas; a Senior Interdepartmental Group, the Under Secretary its executive chairman, and regional groups under the Assistant Secretaries.'
      n: '[[w.taylor-swords-and-plowshares]], 360–61. Check: the day. See [[cal.1965-09-01.vietnam-4]]. Names: Taylor, Johnson.'
