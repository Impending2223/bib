      id: cal.1961-11-06.vietnam-2
      when: Nov. 6
      date: '1961-11-06'
      thread: vietnam
      c: 'Taylor in private with Rusk and McNamara on his report: both in general accord with it, by Taylor''s account.'
      n: '[[w.taylor-swords-and-plowshares]], 245–46. See [[cal.1961-11-03.vietnam]]. Names: Taylor, Rusk, McNamara.'
