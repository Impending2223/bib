      when: Dec., late
      date: 1965-12
      thread: vietnam
      c: 'Taylor to Johnson: goals for every program in 1966, bench marks of progress. The secure population from 53 percent to 75 or 80; half the South''s battalions in mobile combat; air attacks on all targets of value outside the cities, the rails and roads interdicted, Haiphong mined after warning; elections for a constituent assembly; a candid information campaign at home.'
      n: '[[w.taylor-swords-and-plowshares]], 363–65 (raised again before the Honolulu meeting of February). Check: the day. Names: Taylor, Johnson.'
