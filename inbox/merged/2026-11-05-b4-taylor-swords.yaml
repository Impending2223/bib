      date: '1964-08-24'
      thread: vietnam-saigon
      c: 'Saigon, the middle of the night. Khánh has Taylor and U. Alexis Johnson brought secretly to the General Staff headquarters: he will repeal the Vũng Tàu charter. They urge him not to.'
