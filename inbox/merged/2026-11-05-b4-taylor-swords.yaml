      - name:taylor-maxwell
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1961-10-19.vietnam
      when: Oct. 19
      date: '1961-10-19'
      thread: vietnam
      c: 'Field Command headquarters, in French. Taylor with Dương Văn Minh, McGarr there. Minh: the situation grave, the army losing the people''s support; one religion favored; province chiefs, captains made majors, commanding the troops in their provinces, two chains of command.'
      n: '[FRUS 1961–63, I, doc. 177](https://history.state.gov/historicaldocuments/frus1961-63v01/d177). [[w.taylor-swords-and-plowshares]], 234 (Minh''s grievances against Diệm, by Taylor''s account). See [[cal.1961-10-18.vietnam]]. Names: Taylor, Dương Văn Minh, McGarr.'
      src:
        c: e17374a8
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d177: all'
        - 'w.taylor-swords-and-plowshares 234: B-E'
      tags:
      - name:taylor-maxwell
      - name:duong-van-minh
      - name:mcgarr-lionel-c
- add:
    entry:
      id: cal.1961-10-24.vietnam
      when: Oct. 24
      date: '1961-10-24'
      thread: vietnam
      c: 'Taylor, Nolting and Rostow with Diệm, by Taylor''s account: a paper of the mission''s tentative views. Diệm agrees to joint surveys of the provinces; welcomes American helicopters and a flood relief task force, Vice President Thơ and Minister Quang to work it out with the embassy; an exchange of letters with Kennedy, an appeal to the UN, changes in his government.'
      n: '[[w.taylor-swords-and-plowshares]], 239–40. Check: Nolting''s cable dates the mission''s last talk with Diệm Oct. 25 ([[cal.1961-10-25.vietnam]]); whether one meeting or two. See [[cal.1961-10-18.vietnam]]. Names: Taylor, Nolting, Rostow, Ngô Đình Diệm, Nguyễn Ngọc Thơ, Kennedy.'
      src:
        c: 985e3f7f
        rows:
        - 'w.taylor-swords-and-plowshares 239–40: all'
      tags:
      - name:taylor-maxwell
      - name:nolting-frederick-e-jr
      - name:rostow-walt-w
      - name:ngo-dinh-diem
      - name:nguyen-ngoc-tho
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-10-26.vietnam
      when: Oct. 26
      date: '1961-10-26'
      thread: vietnam
      c: 'Bangkok. Taylor with Ambassador Young and his staff, then Sarit, Thanat and Air Chief Marshal Dawee. Sarit: American troops needed in South Vietnam, the trails in Laos to be blocked. Taylor speaks only of logistic troops for the flood.'
      n: '[[w.taylor-swords-and-plowshares]], 240 (to Bangkok Oct. 25; the meetings the day after). See [[cal.1961-10-18.vietnam]]. Names: Taylor, Young, Sarit Thanarat, Thanat Khoman.'
