      tags:
      - name:taylor-maxwell
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-10-16.vietnam-2
      when: Oct. 16
      date: '1961-10-16'
      thread: vietnam
      c: 'Honolulu. Felt briefs the Taylor mission: the situation critical; Diệm to keep his province chiefs out of military matters; logistic, engineer and helicopter units, combat forces withheld for now; in the long run sizable forces, SEATO''s for choice, across the trails in Laos.'
      n: '[[w.taylor-swords-and-plowshares]], 227–28. See [[cal.1961-10-13.vietnam]]. Names: Felt, Taylor, Ngô Đình Diệm.'
