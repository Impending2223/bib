      date: 1964-08
      thread: vietnam-saigon
      c: 'Khánh shows Taylor the draft Vũng Tàu charter: Minh''s office as Chief of State abolished, a President elected by the Military Revolutionary Council. Taylor: the instability; explain it first to the groups whose support he needs, then to the public.'
      n: '[[w.taylor-swords-and-plowshares]], 319. Check: the day. See [[cal.1964-07-07.vietnam-saigon]]. Names: Nguyễn Khánh, Taylor, Dương Văn Minh.'
