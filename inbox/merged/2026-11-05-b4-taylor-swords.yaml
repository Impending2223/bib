      date: 1963-09
      thread: europe-and-the-alliance-france
      c: 'Ailleret, the French Chief of Staff, a full day with Taylor and the Joint Chiefs: any crossing of the frontier means general war; a trip wire, and a reserve to block the heads of the columns while nuclear weapons destroy the rest. Asked of an East German seizure of Hamburg: the risk to Paris must be taken.'
