      date: '1965-05-26'
      thread: vietnam-diplomacy
      c: 'Saigon. Taylor and the embassy with Quát, Foreign Minister Trần Văn Đỗ and Bùi Diễm on negotiations: unification not a goal for now; fair dealing with returning Viet Cong; not the Geneva Accords as the basis, no role for the National Liberation Front; the bombing the most valuable counter, its halt verifiable, Hanoi''s return not.'
