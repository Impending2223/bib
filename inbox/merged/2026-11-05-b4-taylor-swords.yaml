- add:
    entry:
      id: cal.1961-11-27.vietnam-3
      when: Nov. 27
      date: '1961-11-27'
      thread: vietnam
      c: 'The White House, 5:30 p.m., by Lemnitzer''s notes, on Diệm''s answer to the conditions: no sweeping reorganization of his government, security first. McNamara: Nolting to come home and report if the next talks fail. The Jorden report held until the next talk with Diệm. Kennedy: once policy is decided, the men on the spot to support it or get out.'
      n: '[FRUS 1961–63, I, doc. 285](https://history.state.gov/historicaldocuments/frus1961-63v01/d285). [[w.taylor-swords-and-plowshares]], 248 (the recall of Nolting considered). See [[cal.1961-11-22.vietnam]]. Names: Lemnitzer, Ngô Đình Diệm, McNamara, Nolting, Kennedy.'
