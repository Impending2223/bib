      when: Mar.
      date: 1967-03
      thread: transition-and-staff
      c: 'Taylor to Johnson: the Senior Interdepartmental Group has met five times in nine months, with no part in Vietnam and little interest in counterinsurgency; revive it or concede its failure.'
