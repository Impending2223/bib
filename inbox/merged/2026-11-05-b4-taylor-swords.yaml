      when: Apr. 21
      date: '1961-04-21'
      thread: cuba-bay-of-pigs
      c: 'New York, a business luncheon. Kennedy telephones Taylor: in deep trouble over the Bay of Pigs; come to Washington. Taylor to be at the White House at 10 a.m. the next day.'
      n: '[[w.taylor-swords-and-plowshares]], 179–80. Names: Kennedy, Taylor.'
