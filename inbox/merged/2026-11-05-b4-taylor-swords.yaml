      - name:taylor-maxwell
      - name:ngo-dinh-diem
      - name:felt-harry-d
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1961-06.defense
      when: June
      date: 1961-06
      thread: defense
      c: 'Taylor to Kennedy against the special message''s reorganization of the Army''s divisions and its ten reserve divisions ready on eight weeks'' notice: hold them until he has looked into them. Kennedy''s memorandum to McNamara, Taylor''s questions in it.'
      n: '[[w.taylor-swords-and-plowshares]], 208–09 (while the Cuba study ran; the reorganization approved only in January 1963, the eight weeks given up as not feasible). Check: the day. See [[cal.1961-05-25.space]]. Names: Taylor, Kennedy, McNamara.'
