- add:
    entry:
      id: cal.1962-07.defense-4
      when: July
      date: 1962-07
      thread: defense
      c: 'Taylor with McNamara before accepting the chairmanship: the Chairman to have the last word on demands on the Joint Staff, but the Secretary''s and his Deputy''s own; split papers welcome; Goodpaster as his assistant; the Chiefs to be heard.'
      n: '[[w.taylor-swords-and-plowshares]], 253–54. Check: the day; before the announcement ([[cal.1962-07-20.defense-2]]). Names: Taylor, McNamara, Goodpaster.'
