- add:
    entry:
      id: cal.1961-06.vietnam-3
      when: June, mid-month
      date: 1961-06
      thread: vietnam
      c: 'Kennedy hands Taylor Diệm''s letter of June 9 and asks how to answer it. Taylor: an interim reply, citing the ceiling lately raised from 150,000 to 170,000; the Joint Chiefs'' 200,000 to wait for the Staley report; the views of Saigon, Felt and McNamara to be asked.'
      n: '[[w.taylor-swords-and-plowshares]], 221–22. Check: the day. See [[cal.1961-06-14.vietnam]]. Names: Kennedy, Taylor, Ngô Đình Diệm, Felt, McNamara.'
