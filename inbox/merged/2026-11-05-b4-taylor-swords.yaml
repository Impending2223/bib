      date: '1962-10-16'
      thread: missile-crisis
      c: 'The Pentagon, first thing: McNamara, Gilpatric and Taylor with Carroll over the photographs, the 1,100-mile missile known from the Soviet sites in Europe; then the Joint Chiefs; then the White House.'
