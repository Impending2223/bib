      id: cal.1963-11-22.assassination-8
      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      c: 'The Pentagon. Taylor and the Joint Chiefs with Foertsch, the German Chief of Staff, and Trettner, his successor. After lunch the National Military Command Center: the President shot in Dallas. The Chiefs, McNamara with them, about 2 p.m.: commanders everywhere to raise their alertness. The session with the Germans resumed; a note: the President dead.'
      n: '[[w.taylor-swords-and-plowshares]], 302–03. Names: Taylor, McNamara, Kennedy.'
