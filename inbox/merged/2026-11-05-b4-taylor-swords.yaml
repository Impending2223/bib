      - name:kennedy-john-f
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1961-07-01.transition-and-staff
      when: July 1
      date: '1961-07-01'
      thread: transition-and-staff
      c: 'Taylor back on active duty, the President''s Military Representative: an office on the third floor of the Executive Office Building, a staff of seven from the services and the CIA.'
      n: '[[w.taylor-swords-and-plowshares]], 197 (before July 1, at Taylor''s suggestion, Kennedy with Rusk, McNamara and Taylor on the post; Taylor''s understanding with Lemnitzer). See [[cal.1961-06-26.transition-and-staff]]. Names: Taylor.'
      src:
        c: 8251c7b3
        rows:
        - 'w.taylor-swords-and-plowshares 197: all'
      tags:
