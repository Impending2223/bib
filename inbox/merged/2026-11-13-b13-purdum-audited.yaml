      id: cal.1963-06-17.civil-rights-the-executive
      when: June 17
      date: '1963-06-17'
      thread: civil-rights-the-executive
      c: Robert Kennedy to religious leaders at the White House, with a map of five hundred communities in the former Confederacy, Oklahoma, Kentucky, Maryland and West Virginia marked with the steps taken for voluntary desegregation. Asked whether the Administration will now discourage demonstrations, he would rather have matters settled by negotiation, but understands why one who has been refused service picks up a sign.
      n: '[[w.purdum-idea-whose-time-has-2014]], 66. To check: Meeting, June 17, 1963, Lee White office files, Box 23, JFK Library (cited by [[w.purdum-idea-whose-time-has-2014]], 346). See [[cal.1963-06-13.civil-rights-bill]]. Names: Kennedy.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 66: all'
        c: e9da6cc1
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1963-06-21.civil-rights-bill
      when: June 21
      date: '1963-06-21'
      thread: civil-rights-bill
      c: 'The White House, two hours: the President and Robert Kennedy with 244 lawyers, sixty-six of them from Southern States, and three former Attorneys General, to explain and promote the civil rights bill. Off the record, one of a series of such meetings.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 59–60. To check: the President''s Daily Diary, June 21, 1963. See [[cal.1963-06-13.civil-rights-bill]]. Names: Kennedy.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 59–60: all'
        c: a23be95c
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1963-06-21.civil-rights-the-executive
      when: June 21
      date: '1963-06-21'
      thread: civil-rights-the-executive
      c: 'Philadelphia, Independence Hall, the 175th anniversary of the Constitution''s ratification. Robert Kennedy: the Constitution a "vehicle of life"; the time long past when any sensible American could tolerate denial of the vote or "White Only" signs; must we wait for the Court to spell out each new particularity of civil rights?'
      n: '[[w.purdum-idea-whose-time-has-2014]], 63. To check: the address, Justice Department speeches, JFK Library (cited by [[w.purdum-idea-whose-time-has-2014]], 346). See [[cal.1963-06-21.civil-rights-bill]]. Names: Kennedy.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 63: all'
        c: 563c6cef
      tags:
      - name:kennedy-robert-f
      - city:philadelphia
      - state:pa
- add:
    entry:
      id: cal.1963-06-21.republican-party-congress
      when: June 21
      date: '1963-06-21'
      thread: republican-party-congress
      c: 'Atlanta, a speech. Halleck, asked his position on the Administration''s bill: "I just don''t know"; as a leader he gains nothing going one way if the troops go another.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 61–62. To check: Scrapbook, 1963–1964, Box 129, Charles A. Halleck Papers, Lilly Library, Indiana University (cited by [[w.purdum-idea-whose-time-has-2014]], 346). Names: Halleck. Check: the occasion.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 61–62: all'
        c: defa5b67
      tags:
      - name:halleck-charles-a
      - city:atlanta
      - state:ga
- add:
    entry:
      id: cal.1963-07-16.civil-rights-bill-2
      when: July 16
      date: '1963-07-16'
      thread: civil-rights-bill
      c: 'Senate Judiciary Committee, 10:45 a.m., Robert Kennedy''s first appearance on the administration''s bill. Ervin, in place of letting him testify, speaks at length against it, Dirksen looking on: the public accommodations title would reach "any shoeshine boy" with a can of polish and a rag; he will oppose any bill that takes from private persons the right to choose their customers.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 81. To check: [[w.civil-rights-presidents-program-1963]], July 16 (cited by [[w.purdum-idea-whose-time-has-2014]], 348). Names: Kennedy, Ervin, Dirksen.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 81: all'
        c: 9e4319ce
      tags:
      - name:kennedy-robert-f
      - name:ervin-sam-j-jr
      - name:dirksen-everett
- add:
    entry:
      id: cal.1963-07-17.civil-rights-bill-3
      when: July 17
      date: '1963-07-17'
      thread: civil-rights-bill
      c: 'Senate Judiciary Committee. Ervin against the bill''s grant of discretion to the Attorney General to bring suits. Eastland: "Isn''t it true, if we pass this bill, we confer the power of a dictatorship?" Ervin: it would confer the power of a dictator on the President. Keating and Dodd: Southern laws already control private business; Ervin: the Court nullified them in Brown, the Constitution changing its meaning "at noon" on May 17, 1954.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 81. To check: [[w.civil-rights-presidents-program-1963]], July 17 (cited by [[w.purdum-idea-whose-time-has-2014]], 348). Names: Ervin, Eastland, Keating, Dodd. Check: the day of the exchange with Keating and Dodd (Purdum, 81, tells it after the 17th''s, without a day).'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 81: A-D'
        c: 633d332f
      tags:
      - name:ervin-sam-j-jr
      - name:eastland-james-o
      - name:keating-kenneth-b
      - name:dodd-thomas-j
