    item: '[[w.purdum-idea-whose-time-has-2014]], 198 (about four o''clock, before the vote, Mitchell and Rauh in the gallery; Rauh at a pay telephone: what has been done to get the bill on the Senate floor, see Mansfield; Wilkins called minutes later; not Mitchell''s account)'
