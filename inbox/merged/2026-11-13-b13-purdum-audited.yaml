      id: cal.1964-02-20.civil-rights-bill
      when: Feb. 20
      date: '1964-02-20'
      thread: civil-rights-bill
      c: 'Johnson to Mansfield by telephone, Moyers on another line: Mary McGrory of the *Washington Star* has found no coordinated strategy for the bill. Mansfield: she has not been to see him or Humphrey. Johnson: the strategy is the Senate leaders'' to arrange; Mansfield to tell her the plans discussed at the breakfast are satisfactory to the White House. Justice, he imagines, is behind it: "She''s just a troublemaker."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 218. To check: the recording, *The Presidential Recordings: Lyndon B. Johnson*, IV, 659 (cited by [[w.purdum-idea-whose-time-has-2014]], 359). Names: Johnson, Mansfield, Moyers, McGrory, Humphrey.'
