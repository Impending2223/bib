        - 'w.purdum-idea-whose-time-has-2014 218: all'
        c: 8398a0d2
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:humphrey-hubert-h
      - name:moyers-bill
      - name:mcgrory-mary
