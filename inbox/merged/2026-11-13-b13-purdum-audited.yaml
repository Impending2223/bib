    item: '[[w.purdum-idea-whose-time-has-2014]], 191–92 (Smith on the podiatrist, struck from the Record; Poff''s amendment, 70 to 123; Colmer''s, 69 to 114; Meader''s, 68 to 153; Hebert on the absent Southerners; Smith''s amendment, Purdum has Feb. 4)'
    units: A, D, E
- cite:
    id: cal.1964-02-06.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 192–93 (Titles III to V: Willis''s amendment on fraternal and religious organizations, voice vote; Rogers''s limit of four years on the Commission, voice vote; not the attorney''s fee nor Title IV)'
    units: C, D
- cite:
    id: cal.1964-02-07.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 193–95 (Harris''s amendment, with Boggs for it; McCulloch: his support "will come to an end"; beaten 80 to 206, all Republicans against)'
    units: C, D
- cite:
    id: cal.1964-02-08.women
    item: '[[w.purdum-idea-whose-time-has-2014]], 195–98 (Smith''s motion to insert "sex," Saturday, Feb. 8; Celler against it, an "entering wedge" (197); adopted 168 to 133 on tellers, Griffiths one of the tellers; not her demand for tellers)'
    units: A, B, D
- cite:
    id: cal.1964-02-10.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 198–201 (the ninth day; the vote, 290 to 130: 152 Democrats and 138 Republicans for, 96 and 34 against (86 Democrats from the Confederacy); the "sex" and atheist amendments; Celler and McCulloch; not the seven Southern Democrats)'
    units: A, C, D
- cite:
    id: cal.1964-02-11.civil-rights-organizations
    item: '[[w.purdum-idea-whose-time-has-2014]], 200 (O''Grady and Peggy Roach of the National Catholic Conference bake sugar cookies with chocolate equal signs that night for the offices the next day; not "every congressional staff" nor the words)'
    units: '?'
- cite:
    id: cal.1964-02-10.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 201–02 (the 9:07 p.m. call, less than an hour after the vote, O''Brien with Johnson; "Congratulations," its speaker not given; "I thought it was wonderful—290 to 130" Johnson''s; Kennedy on the pressure on the Senate; not the 6:30 call)'
    units: D
- variant:
    id: cal.1964-02-10.civil-rights-bill-3
    unit: C
    witness: w.purdum-idea-whose-time-has-2014
    reads: '"I thought it was wonderful—290 to 130," Johnson answered'
    at: '202'
- check:
    id: cal.1964-02-10.civil-rights-bill-3
    text: 'Check: Purdum, 202, gives Johnson the words "I thought it was wonderful—290 to 130," and "Congratulations" no speaker (*The Presidential Recordings: Lyndon B. Johnson*, IV, 451–52, cited 357).'
- cite:
    id: cal.1964-02-10.civil-rights-bill-5
    item: '[[w.purdum-idea-whose-time-has-2014]], 198–99 (Colmer''s amendment accepted; Ashmore''s Community Relations Service, as Title X, by voice vote; not the counts)'
    units: '?'
- cite:
    id: cal.1964-02-11.robert-kennedy
    item: '[[w.purdum-idea-whose-time-has-2014]], 202–03 (the private meeting on the afternoon of Feb. 11 after the strategy session; the order to fire Corbin; Kennedy balks; "I know you''re president"; not the words in D)'
    units: B, C
- cite:
    id: cal.1964-02-11.robert-kennedy-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 203 (the evening call: Corbin fired, "harmless" and "quite a problem," "keep things equal," "Don''t ever do a favor for me again!"; Guthman watching)'
    units: A, C, D, E, F
- cite:
    id: cal.1964-02-11.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 202, 209–10 (the strategy session with O''Brien, Katzenbach and Marshall; Johnson corners Katzenbach at the reception: cloture, round-the-clock sessions, Hayden; Katzenbach''s estimate, fifty-seven to sixty "with reasonable ease")'
    units: '?'
- cite:
    id: cal.1964-02-26.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 207, 216–17, 219–20 (the bill read Feb. 17, Humphrey named; Rule XIV on Feb. 26; Russell''s objection; Metcalf overrules on the 1957 precedent; Mansfield carries it 54 to 37, twenty Republicans; not the appeal tabled)'
    units: B, C, D
- cite:
    id: cal.1964-02-28.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 225–27 (Humphrey and Kuchel with Mitchell and Rauh on Friday, Feb. 28; Kuchel: no committee meetings; Humphrey: Russell''s "war of nerves"; all to accept no less than the House bill and keep in touch with McCulloch and Celler)'
    units: A, C, F
- cite:
    id: cal.1964-03-01.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 228–29 (Russell on Face the Nation, Mar. 1: Johnson could not accept a loss; not the words quoted here)'
    units: '?'
- cite:
    id: cal.1964-03-06.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 232 (the National Council of Churches'' bulletin of Mar. 6: "the efforts of the religious forces of our nation will again be the deciding factor"; a bulletin, not a letter to members)'
    units: '?'
- cite:
    id: cal.1964-03-06.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 227–28 (Johnson to O''Brien on Friday, Mar. 6: the Attorney General to agree to the procedures; "all night, every night"; not the hour nor "Just as it passed the House"; Purdum''s words end "on any nine-to-four basis")'
    units: '?'
- variant:
    id: cal.1964-03-06.civil-rights-bill-2
    unit: A
    witness: w.purdum-idea-whose-time-has-2014
    reads: '"never passed them on any nine-to-four basis"'
    at: '228'
- check:
    id: cal.1964-03-06.civil-rights-bill-2
    text: 'Check: Purdum, 228, ends Johnson''s words "on any nine-to-four basis," without "Just as it passed the House" (*The Presidential Recordings: Lyndon B. Johnson*, IV, 945, cited 359).'
- cite:
    id: cal.1964-03-08.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 230–31 (Humphrey on Meet the Press: Dirksen will see it as "moral, not partisan"; "no wheels and no deals"; the "sex" provision acceptable; not the words quoted here)'
    units: '?'
- cite:
    id: cal.1964-03-09.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 232–33 (Russell has the journal read slowly to pass 2 p.m.; Mansfield''s motion after two hours and five minutes; the southerners'' talk; not the words quoted here)'
    units: B
- cite:
    id: cal.1964-03-09.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 231, 234 (the pep rally in Humphrey''s office before the motion: "The House bill is a good bill"; the church groups the secret; Mitchell and Rauh at least twice a week thereafter (234); not Biemiller nor Dolan)'
    units: '?'
- cite:
    id: cal.1964-03-08.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 207–10 (in person, at the White House after the leaders'' breakfast of Tuesday, Feb. 18, Humphrey staying behind, named floor manager the day before: the liberals "bomb throwers"; Russell knows the rules; the bill cannot pass without Dirksen; "You listen to Dirksen!"; Johnson to back him to the hilt; the note, 358, sets the talk "on or about February 18")'
    units: '?'
- variant:
    id: cal.1964-03-08.civil-rights-bill-2
    unit: A
    witness: w.purdum-idea-whose-time-has-2014
    reads: after the weekly breakfast with the Democratic leaders, Tuesday, Feb. 18, Humphrey staying behind
    at: '207'
- check:
    id: cal.1964-03-08.civil-rights-bill-2
    text: 'Check: Purdum, 207–10, puts the talk at the White House after the leaders'' breakfast of Feb. 18, in person; his note (358) weighs the Mar. 8 accounts (the call after *Meet the Press* not recorded) and settles on "on or about February 18."'
- cite:
    id: cal.1964-03-26.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 238 (the motion to consider carried 67 to 17; Morse''s recommittal tabled 50 to 34; Russell''s words differ ("A skirmish has been lost. We shall now begin to fight the war"))'
    units: A, B
- cite:
    id: cal.1964-03-30.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 216, 238–40 (Humphrey''s opening, fifty-five pages, and Kuchel''s, fifty-six; the title captains; not Russell)'
    units: A, B, C
- cite:
    id: cal.1964-03-30.robert-kennedy
    item: '[[w.purdum-idea-whose-time-has-2014]], 239 (Johnson to Ted Kennedy on Mar. 30, praising his television appearance; his commitment to the bill as a trustee; not the hour)'
    units: '?'
- cite:
    id: cal.1964-04-04.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 248–49 (Saturday, Apr. 4: Mansfield, "a travesty on the legislative process"; the recess forty-one minutes after the Senate met at eleven; the absentees, by Humphrey''s and Keating''s count, more than forty Democrats and a dozen Republicans; not the vote on the recess)'
    units: A, C
- cite:
    id: cal.1964-04-07.republican-party-congress
    item: '[[w.purdum-idea-whose-time-has-2014]], 254 (Dirksen''s ideas on Title VII to the Republican Policy Committee on Apr. 7: ninety days for the State agencies first, the Commission to seek voluntary compliance only, the courts to enforce; not the number of amendments nor Hickenlooper)'
    units: B
- cite:
    id: cal.1964-04-09.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 257 (the call with Byrd: the judgeship, Byrd''s nominee; "make them vote on it"; a tour; "I wouldn''t leave Dick Russell for all the tours in the world"; Purdum has Apr. 10, Byrd asking)'
    units: C, D
- cite:
    id: cal.1964-04-08.republican-party-congress
    item: '[[w.purdum-idea-whose-time-has-2014]], 254, 256 (to reporters after the Policy Committee luncheon of Apr. 7, he might strike Title VII altogether (254); the Republicans caucusing with Dirksen on his amendments during Edward Kennedy''s speech of Apr. 9, Margaret Chase Smith for keeping "sex" (256); not the words quoted here)'
    units: '?'
- cite:
    id: cal.1964-04-09.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 255–56 (Edward Kennedy''s maiden speech, in a session of thirteen and a half hours)'
    units: A
