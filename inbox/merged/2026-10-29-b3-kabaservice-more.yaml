      also:
      - elections-1964
      c: 'Eisenhower to Saloma, of the Ripon Society, a few days after its Declaration of Conscience: "I have felt the remarkable
        stillness of which you speak, and I have been disappointed at its persistence"; "delighted that the Ripon Society
        is doing its best to concentrate some attention on those concepts that are truly the foundation of our Party."'
      n: '[[w.kabaservice-rule-and-ruin]], 108–9. Check the day. To check: John S. Saloma III to "Dear fellow Riponer," July
        29, 1964, Ripon Society Papers, Cornell University, 1:33 (cited by [[w.kabaservice-rule-and-ruin]], 109 n.48). Names:
