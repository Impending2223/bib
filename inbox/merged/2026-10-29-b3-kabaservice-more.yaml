      c: 'Tennessee. Goldwater, invited by Howard Baker, the Republicans'' candidate for the Senate, to speak for him, calls
        for selling the Tennessee Valley Authority. Baker, on the platform: "I could see my prospects going right down the
        drain."'
      n: '[[w.kabaservice-rule-and-ruin]], 119. Check the day and the place. To check: [[w.baker-no-margin-for-error]], 7
