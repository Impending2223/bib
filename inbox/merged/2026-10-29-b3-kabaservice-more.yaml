      id: cal.1964-01.elections-1964-5
      when: Jan.–Mar.
      date: 1964-01
      thread: elections-1964
      also:
      - republican-party
      c: 'New Hampshire. A Ripon group of Harvard law students, "the Truth Squad" to the press, follows Goldwater about the
        State asking him questions: "We want to make him express his sillier views."'
      n: '[[w.kabaservice-rule-and-ruin]], 78–79. Check the days: between the campaign''s resumption in January and the primary,
        Mar. 10. To check: Stewart D. Davis, "Ripon''s History," *Harvard Law School Bulletin*, January 1965, 7 (cited by
        [[w.kabaservice-rule-and-ruin]], 79 n.25). Names: Goldwater.'
