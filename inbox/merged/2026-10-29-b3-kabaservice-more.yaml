      - state:nh
- add:
    entry:
      id: cal.1964-05.conservative-movement
      when: May
      date: 1964-05
      thread: conservative-movement
      also:
      - elections-1964
      c: 'Rusher to *National Review*''s editors, by memorandum: if Goldwater loses California, he should stay in the race
        for the best bargain on the candidate, the platform and the party''s machinery; a "genuinely conservative campaign
        is the only method by which the conservative cause can be reintroduced into what is now called ''the mainstream of
        American life''—and this would occur whether our defeat was disastrous or not."'
      n: '[[w.kabaservice-rule-and-ruin]], 87. Check the day: the note dates it "May? 1964." To check: William A. Rusher to
        the editors of *National Review*, May? 1964, William F. Buckley Jr. Papers, Yale University, I-30 (cited by [[w.kabaservice-rule-and-ruin]],
        87 n.61). Names: Rusher, Goldwater.'
      src:
        c: 3b9102d1
        rows:
        - 'w.kabaservice-rule-and-ruin 87: all'
        - 'via w.kabaservice-rule-and-ruin 87 n.61: all'
      tags:
      - name:rusher-william-a
      - name:goldwater-barry-m
