      thread: conservative-movement
      also:
      - republican-party
      c: 'White to Barr, by letter, on the talks with Rockefeller''s people over the Young Republicans'' chairmanship: Rockefeller''s
        compromise candidate McDevitt, an Idaho conservative, once Nadasdy''s campaign manager, a "liberal" to White. The
        Syndicate for Lukens.'
      n: '[[w.kabaservice-rule-and-ruin]], 63. To check: F. Clifton White to Charles R. Barr, Sept. 25, 1962, F. Clifton White
        Papers, Cornell University, 18 (cited by [[w.kabaservice-rule-and-ruin]], 63 n.124). See [[cal.1963-06-25.republican-party]].
        Names: White, Rockefeller, Lukens.'
