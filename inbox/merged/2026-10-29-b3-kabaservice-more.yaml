    entry:
      id: cal.1961-03.conservative-movement
      when: Spring
      date: 1961-03
      thread: conservative-movement
      also:
      - peace-corps
      c: A national conference on the Peace Corps. Young Americans for Freedom's members arrive unannounced and spread through
        its discussion groups; a front of theirs, the Committee for an Effective Peace Corps, no mention of YAF. By Hayden's
        account.
      n: '[[w.kabaservice-rule-and-ruin]], 50–51. Check the day and place: Kabaservice, "a spring 1961 meeting." To check:
        [[w.hayden-reunion]], 334 (cited by [[w.kabaservice-rule-and-ruin]], 51 n.63). Names: Hayden.'
      src:
        c: 876c496d
        rows:
        - 'w.kabaservice-rule-and-ruin 50–51: all'
      tags:
      - name:hayden-tom
- add:
    entry:
      id: cal.1961-07-08.republican-party
      when: July 8
      date: '1961-07-08'
      thread: republican-party
      also:
      - conservative-movement
      c: 'Chapman, of *Advance*, to Morhouse, New York''s Republican chairman, after the Young Republicans'' convention at
        Minneapolis: the right''s campaign there "financed by YAF and actively abetted by Goldwater aides"; "we''re being
        out-maneuvered."'
      n: '[[w.kabaservice-rule-and-ruin]], 51. To check: Bruce K. Chapman to L. Judson Morhouse, July 8, 1961, George L. Hinman
        Papers, Rockefeller Archive Center, IV-J2-1–9:46 (cited by [[w.kabaservice-rule-and-ruin]], 51 n.70). Names: Morhouse,
        Goldwater.'
      src:
        c: 6ad93944
        rows:
        - 'w.kabaservice-rule-and-ruin 51: all'
        - 'via w.kabaservice-rule-and-ruin 51 n.70: B'
      tags:
      - name:morhouse-l-judson
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1961-08-25.republican-party
      when: Aug. 25
      date: '1961-08-25'
      thread: republican-party
      also:
      - conservative-movement
      c: 'Hinman, Rockefeller''s adviser, by letter, on Rockefeller''s informants among the conservatives, paid and unpaid,
        known in his office as Number 1, Number 2 and so on: Caddy, a founder of YAF, Humphreys, of the National Committee,
        and several members of Congress among them, "our conservative ''agents''" to one aide.'
      n: '[[w.kabaservice-rule-and-ruin]], 54. Check: the records run from Aug. 25, 1961, to Dec. 17, 1962; which names each
        gives, not said. To check: George L. Hinman to Irene Slater, Aug. 25, 1961, Hinman Papers, Rockefeller Archive Center,
        IV-J2-1–26:153 (cited by [[w.kabaservice-rule-and-ruin]], 54 n.79); John D. Deardourff to Robert R. Douglass, Dec.
        17, 1962, Hinman Papers, IV-J2-1–13:71 (cited by [[w.kabaservice-rule-and-ruin]], 54 n.80); Robert R. Douglass to
        Hinman, July 17, 1962, Hinman Papers, IV-J2-1–9:46 (cited by [[w.kabaservice-rule-and-ruin]], 54 n.81). Names: Hinman,
        Rockefeller.'
      src:
        c: 003ab07f
        rows:
        - 'w.kabaservice-rule-and-ruin 54: all'
        - 'via w.kabaservice-rule-and-ruin 54 n.79: all'
        - 'via w.kabaservice-rule-and-ruin 54 n.80: all'
        - 'via w.kabaservice-rule-and-ruin 54 n.81: all'
      tags:
      - name:hinman-george-l
      - name:rockefeller-nelson
