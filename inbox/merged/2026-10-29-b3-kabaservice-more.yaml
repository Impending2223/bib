      when: Mar. 5
      date: '1962-03-05'
      thread: republican-party
      c: 'Thayer, *Advance*''s benefactor, to Chapman: Eisenhower has read its issue "Revise and Dissent" and wants to be
        on its mailing list.'
      n: '[[w.kabaservice-rule-and-ruin]], 57. To check: Walter N. Thayer to Bruce K. Chapman, Mar. 5, 1962, Walter N. Thayer
        Papers, Hoover Presidential Library, III-2:12 (cited by [[w.kabaservice-rule-and-ruin]], 57 n.97). Names: Eisenhower.'
