- add:
    entry:
      id: cal.1962-07-03.republican-party
      when: July 3
      date: '1962-07-03'
      thread: republican-party
      also:
      - goldwater
      c: 'Eisenhower to Charles S. Jones, by letter, after Goldwater''s attack on the Gettysburg conference: "I am getting
        awfully sick of him." Goldwater after the nomination, "he has no illusions he could be elected"; "what is really annoying
        is that he wants to set himself up as the single authority and guiding voice for the Republican Party."'
      n: '[[w.kabaservice-rule-and-ruin]], 59. To check: Dwight D. Eisenhower to Charles S. Jones, July 3, 1962, Eisenhower
        Post-Presidential Papers, Eisenhower Library, SNF-10 (cited by [[w.kabaservice-rule-and-ruin]], 59 n.110). Names:
        Eisenhower, Goldwater.'
      src:
        c: 90ce52ed
        rows:
        - 'w.kabaservice-rule-and-ruin 59: all'
        - 'via w.kabaservice-rule-and-ruin 59 n.110: all'
      tags:
      - name:eisenhower-dwight-d
      - name:goldwater-barry-m
