      c: 'California, before the June 2 primary. Rockefeller refuses to let *The Extremists*, Spencer-Roberts''s documentary
        on the radical right in California, be aired: "McCarthyism-in-reverse."'
      n: '[[w.kabaservice-rule-and-ruin]], 95. Check the day. To check: [[w.gilder-party-that-lost-its]], 142–43; [[w.white-making-of-the-president-1965]],
