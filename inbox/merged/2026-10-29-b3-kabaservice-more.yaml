      when: Dec.
      date: 1963-12
      thread: elections-1964
      also:
      - republican-party
      c: 'New York, the Recess Club on Wall Street, shortly after Kennedy''s death. Nixon with members of the Ripon Society:
        a tour of foreign policy; he asks their help on memoranda on the moderates'' position in 1964. By Huebner''s account.'
      n: '[[w.kabaservice-rule-and-ruin]], 78. Check the day. To check: interview with Lee W. Huebner, Apr. 11, 2007 (cited
        by [[w.kabaservice-rule-and-ruin]], 78 n.24). Names: Nixon, Huebner.'
