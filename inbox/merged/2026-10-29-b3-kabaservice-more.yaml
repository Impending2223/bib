      id: cal.1968-08-12.elections-1968-miami
      when: Aug. 12
      date: '1968-08-12'
      thread: elections-1968-miami
      also:
      - republican-party
      c: 'Melich, of Rockefeller''s delegate operation, letters after the convention: "If Reagan had broken open the South,
        we would have stopped Nixon on the first ballot"; "We had a large number of second and third ballot votes"; "We were
        out-psyched by our syndicate psychosis. I''ll never again believe in the omnipotence of your friend and mine, F. Clifton
        White." To Gingrich, of the New Orleans Rockefeller group: "the only really viable Rockefeller southern support that
        we had."'
      n: '[[w.kabaservice-rule-and-ruin]], 242–43. To check: Tanya Melich to Mike O''Neill, Aug. 12, 1968, Tanya M. Melich
        Papers, SUNY Albany, II-3:17 (cited by [[w.kabaservice-rule-and-ruin]], 243 n.85); Melich to Frank Newman, Aug. 12,
        1968, the same (cited by [[w.kabaservice-rule-and-ruin]], 243 n.86); Melich to Hope Kading, Aug. 12, 1968, the same
        (cited by [[w.kabaservice-rule-and-ruin]], 243 n.88); Melich to Newt Gingrich, Aug. 12, 1968, the same (cited by [[w.kabaservice-rule-and-ruin]],
        242 n.82). See [[cal.1968-08-07.elections-1968]]. Names: Reagan, Nixon, White, Rockefeller.'
      src:
        c: 49049e80
        rows:
        - 'w.kabaservice-rule-and-ruin 242–43: all'
        - 'via w.kabaservice-rule-and-ruin 243 n.85: A'
        - 'via w.kabaservice-rule-and-ruin 243 n.86: B'
        - 'via w.kabaservice-rule-and-ruin 243 n.88: C'
        - 'via w.kabaservice-rule-and-ruin 242 n.82: D'
      tags:
      - name:reagan-ronald
      - name:nixon-richard-m
      - name:white-f-clifton
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-08-12.republican-party
      when: Aug. 12
      date: '1968-08-12'
      thread: republican-party
      also:
      - elections-1968
      c: 'Zimmer, of the Ripon Society, to Huebner, its president, after the convention: the moderates "merely cosmetized
        an essentially reactionary group of politicians"; wait for Nixon''s defeat, then build "a national organization of
        politicians" to "nominate John Lindsay in 1972 by taking over the party from the precinct-level up."'
      n: '[[w.kabaservice-rule-and-ruin]], 245. To check: Richard A. Zimmer to Lee W. Huebner, Aug. 12, 1968, Ripon Society
        Papers, Cornell University, 13 (cited by [[w.kabaservice-rule-and-ruin]], 245 n.98). Names: Huebner, Nixon, Lindsay.'
      src:
        c: '17751260'
        rows:
        - 'w.kabaservice-rule-and-ruin 245: all'
        - 'via w.kabaservice-rule-and-ruin 245 n.98: all'
      tags:
      - name:huebner-lee-w
      - name:nixon-richard-m
      - name:lindsay-john-v
