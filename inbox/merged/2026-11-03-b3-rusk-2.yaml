patch: b3-rusk-2
by: 'Claude (b3 reading agent, group state: Rusk, As I Saw It; batch 3 resumed)'
ops:
- add:
    entry:
      id: cal.1961-09-20.testing
      when: Sept. 20
      date: '1961-09-20'
      thread: testing
      c: 'New York. McCloy to Zorin: the United States will drop from paragraph 6 of the joint statement of agreed principles
        the sentence on verifying that retained forces and armaments do not exceed agreed levels, to which the Soviet Union
        has not agreed. The statement McCloy and Zorin worked out over the summer and fall, by Rusk''s account.'
      n: 'McCloy to Zorin, Sept. 20, 1961, [[w.department-of-state-bulletin]], [Oct. 9, 1961, 595](https://archive.org/details/departmentofstat4561unit/page/595/mode/1up)
        (the documents from 589). [[w.rusk-as-i-saw-it-1990]], 253 (B). Check: the joint statement''s own date and its presentation
        to the General Assembly; Zorin''s reply of Sept. 21 not read. Names: McCloy, Zorin, Rusk.'
      src:
        c: aad5ab19
        rows:
        - 'https://archive.org/details/departmentofstat4561unit/page/595/mode/1up: A'
        - 'w.rusk-as-i-saw-it-1990 253: B'
        - 'via x.1984.rusk-interviews-with-richard-rusk: B'
      tags:
      - name:mccloy-john-j
      - name:zorin-valerian
      - name:rusk-dean
- add:
    entry:
      id: cal.1962-06.testing
      when: Summer
      date: 1962-06
      thread: testing
      c: 'Rusk to the Committee of Principals, at its meetings, by his account: why go on insisting on on-site inspections
        and seven boxes; propose an atmospheric test ban instead. Kennedy agrees: a limited ban better than none.'
      n: '[[w.rusk-as-i-saw-it-1990]], 255. Check: the month and the meetings; Rusk has "the summer of 1962." Names: Rusk,
        Kennedy.'
      src:
        c: b2eb4f29
        rows:
        - 'w.rusk-as-i-saw-it-1990 255: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags:
      - name:rusk-dean
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-06.transition-and-staff
      when: Summer
      date: 1963-06
      thread: transition-and-staff
      c: 'Rusk to Kennedy, by Rusk''s account: if he wants a new Secretary of State for the 1964 elections, it is all right
        with him. Kennedy: "Hell, no. And don''t bring that up again. I like your guts." Rusk had told him he could serve
        only one term, for financial reasons.'
      n: '[[w.rusk-as-i-saw-it-1990]], 212–13, 296. Check: the month; Rusk has "the summer of 1963." Names: Rusk, Kennedy.'
      src:
        c: d5bca4bf
        rows:
        - 'w.rusk-as-i-saw-it-1990 212–13, 296: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags:
      - name:rusk-dean
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-06.testing
      when: June
      date: 1963-06
      thread: testing
      c: 'An evening down the Potomac on the presidential yacht: Rusk and Dobrynin, several hours on arms control, by Rusk''s
        account. Both want a treaty.'
      n: '[[w.rusk-as-i-saw-it-1990]], 256. Check: the day. Names: Rusk, Dobrynin.'
      src:
        c: 4f0c13d2
        rows:
        - 'w.rusk-as-i-saw-it-1990 256: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
- add:
    entry:
      id: cal.1963-10.space
      when: Oct.
      date: 1963-10
      thread: space
      c: 'The General Assembly, unanimously: a resolution calling on nations not to station weapons of mass destruction in
        orbit or on celestial bodies.'
      n: '[[w.rusk-as-i-saw-it-1990]], 345. Check: the day and the resolution''s number.'
      src:
        c: 2cc34aa9
        rows:
        - 'w.rusk-as-i-saw-it-1990 345: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags: []
- add:
    entry:
      id: cal.1965-05-14.europe-and-the-alliance
      when: May 14
      date: '1965-05-14'
      thread: europe-and-the-alliance
      c: Runnymede, the field of the Great Charter. Britain's memorial to Kennedy dedicated, an acre given the American people,
        before the Queen, Wilson, Macmillan and Jacqueline Kennedy. Rusk accepts the acre for Johnson and the nation.
      n: 'Rusk''s remarks, [[w.department-of-state-bulletin]], [June 7, 1965, 897](https://archive.org/details/departmentofstat5265unit/page/897/mode/1up).
        [[w.rusk-as-i-saw-it-1990]], 323, 635 (the Queen''s presentation; the remarks, reprinted). Names: Kennedy, Wilson,
        Macmillan, Jacqueline Kennedy, Rusk, Johnson.'
      src:
        c: 9b2fc100
        rows:
        - 'https://archive.org/details/departmentofstat5265unit/page/897/mode/1up: all'
        - 'w.rusk-as-i-saw-it-1990 323, 635: A-B, C'
        - 'via x.1984.rusk-interviews-with-richard-rusk: A-B, C'
        - 'via x.1965-05-14.rusk-remarks-at-runnymede: C'
      tags:
      - name:kennedy-john-f
      - name:wilson-harold
      - name:macmillan-harold
      - name:kennedy-jacqueline
      - name:rusk-dean
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-08.testing-npt
      when: Aug.
      date: 1965-08
      thread: testing-npt
      c: 'The United States tables a draft nonproliferation treaty: no transfer of nuclear weapons to any country not having
        them; the nonnuclear nations asked to let the IAEA inspect their peaceful programs.'
      n: '[[w.rusk-as-i-saw-it-1990]], 341. Check: the day and the forum. Check: Rusk (343) also writes that the first proposal
        of August 1965 required no safeguards of the nonnuclear countries.'
      src:
        c: 29a48902
        rows:
        - 'w.rusk-as-i-saw-it-1990 341: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags: []
- add:
    entry:
      id: cal.1966-05-10.china
      when: May 10
      date: '1966-05-10'
      thread: china
      c: 'Zhou Enlai: China will not provoke a war with the United States, but will defend itself if attacked, and carry the
        war to the aggressor without regard to boundaries.'
      n: '[[w.rusk-as-i-saw-it-1990]], 289. Check: the statement''s text and occasion. See [[cal.1966-03-16.china]]. Names:
        Zhou Enlai.'
      src:
        c: 27672efe
        rows:
        - 'w.rusk-as-i-saw-it-1990 289: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags:
      - name:zhou-enlai
- add:
    entry:
      id: cal.1967-05.middle-east-six-day-war
      when: May
      date: 1967-05
      thread: middle-east-six-day-war
      c: 'Rusk and McNamara with eighty or ninety Senators and Representatives, by Rusk''s account: all against reopening
        the Strait of Tiran by force alone; leave it to the United Nations. Robert Kennedy: his Jewish friends in New York
        "don''t want any part of this."'
      n: '[[w.rusk-as-i-saw-it-1990]], 385. Check: the day; Rusk has it in the midst of the talk of a naval force for the
        Strait. See [[cal.1967-05-22.middle-east]]. Names: Rusk, McNamara, Robert Kennedy.'
      src:
        c: fd4e1201
        rows:
        - 'w.rusk-as-i-saw-it-1990 385: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-02.press-and-broadcasting
      when: Feb.
      date: 1968-02
      thread: press-and-broadcasting
      also:
      - vietnam-tet
      c: 'After Tet, Rusk''s Friday backgrounder for newsmen. To a question of Scali''s of ABC: "Whose side are you on?" Reported,
        against the backgrounder''s rules, and given national coverage, by Rusk''s account.'
      n: '[[w.rusk-as-i-saw-it-1990]], 477. Check: the day and the papers. Names: Rusk, Scali.'
      src:
        c: a4c152f7
        rows:
        - 'w.rusk-as-i-saw-it-1990 477: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags:
      - name:rusk-dean
      - name:scali-john-a
- add:
    entry:
      id: cal.1965-11.latin-america
      when: Nov.
      date: 1965-11
      thread: latin-america
      also:
      - press-and-broadcasting
      c: Montevideo. Rusk lays a wreath at a national hero's statue; a small man runs from the crowd to spit at him, a plainclothesman
        after him, and Rusk's guard tackles the plainclothesman. A photographer dubs spit into his negative, by Rusk's account.
      n: '[[w.rusk-as-i-saw-it-1990]], 571–72. Check: the day; the photograph and where it ran. Names: Rusk.'
      src:
        c: 61c00886
        rows:
        - 'w.rusk-as-i-saw-it-1990 571–72: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags:
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-09.transition-and-staff
      when: Sept.
      date: 1967-09
      thread: transition-and-staff
      also:
      - press-and-broadcasting
      c: 'Stanford''s chapel. Peggy Rusk, eighteen, marries Guy Smith, a Black American, the wedding not announced ahead;
        *Time*''s cover. Beforehand Rusk asks Johnson whether it will hurt him with members of Congress; Johnson asks Russell:
        "Forget it." Rusk did not offer to resign, as was reported, by his account.'
      n: '[[w.rusk-as-i-saw-it-1990]], 581. Check: the day; the *Time* issue. Names: Rusk, Johnson, Russell.'
      src:
        c: 28e23e61
        rows:
        - 'w.rusk-as-i-saw-it-1990 581: all'
        - 'via x.1984.rusk-interviews-with-richard-rusk: all'
      tags:
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:russell-richard-b
