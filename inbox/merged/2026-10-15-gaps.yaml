ops:
  - add:
      entry:
        id: cal.1961-02-22.berlin-and-vienna
        when: Feb. 22
        date: '1961-02-22'
        thread: berlin-and-vienna
        also: [soviet-union]
        c: 'Kennedy to Khrushchev, by letter, drafted at the White House the day before with Rusk, Thompson, Harriman, Bohlen, Kohler and Bundy: more use of diplomatic channels, "not in the sense of negotiations"; a meeting "before too long" for "an informal exchange of views." Thompson to discuss it. Mar. 9, outside Novosibirsk, Thompson gives Khrushchev the letter: early May, Vienna or Stockholm. Khrushchev inclined to agree; Vienna preferred.'
        n: 'FRUS 1961–63, VI, doc. [7](https://history.state.gov/historicaldocuments/frus1961-63v06/d7); V, docs. [41](https://history.state.gov/historicaldocuments/frus1961-63v05/d41), [42](https://history.state.gov/historicaldocuments/frus1961-63v05/d42) (Thompson, Mar. 10). [[w.beschloss-crisis-years]]; [[w.fursenko-khrushchevs-cold-war]]; [[w.thompson-kremlinologist]]. Made public: in part, Claflin''s collection of Kennedy''s memoranda, pp. 50–51 (FRUS''s note); in full, FRUS 1961–63, VI. Check: the years of both. Names: Khrushchev, Rusk, Thompson, Harriman, Bohlen, Kohler, Bundy.'
        tags: [name:kennedy-john-f, name:khrushchev-nikita-s, name:rusk-dean, name:thompson-llewellyn-e, name:harriman-w-averell, name:bohlen-charles-e, name:kohler-foy-d, name:bundy-mcgeorge]
  - add:
      entry:
        id: cal.1962-04-05.transportation
        when: Apr. 5
        date: '1962-04-05'
        thread: transportation
        also: [cities-and-housing]
        c: 'Special message on transportation. Minimum-rate regulation lifted from all carriage of bulk and farm commodities, as now for water carriers; inter-city passenger fares in time under maximum rates only. User charges: 2 cents a gallon on jet fuel and on fuel used on the inland waterways; 5 percent on airline tickets and waybills. Mass transit grants through the HHFA: $500 million over three years, $100 million in fiscal 1963.'
        n: '[Special Message to the Congress on Transportation](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transportation) (Apr. 5, 1962). [[w.friedlaender-dilemma-of-freight-transport]]; [[w.smerk-urban-transportation]].'
        tags: [name:kennedy-john-f]
