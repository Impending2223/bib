    entry:
      id: cal.1966-08-05.poverty
      when: Aug. 5
      date: '1966-08-05'
      thread: poverty
      c: 'Paul Cotter, the Senate Appropriations Committee''s investigator, to Hayden, Stennis and Pastore: a report sharply critical of the Child Development Group of Mississippi''s leadership and administration. "A few ... both white and colored, who clearly fall into the category of extremists"; the schoolteachers attest to Head Start''s children''s improvement, but he wonders "whether these children are not being used as pawns to serve other purposes."'
      n: '[[w.dittmer-local-people]], 377. To check: Paul J. Cotter to Senators Hayden, Stennis, Pastore, Aug. 5, 1966, OEO Archives, box 108 (cited by [[w.dittmer-local-people]], 377 n.35). See [[cal.1965-06-29.poverty]]. Names: Hayden, Stennis, Pastore.'
      src:
        c: '5d647caf'
        rows:
        - 'w.dittmer-local-people 377: all'
        - 'via w.dittmer-local-people 377 n.35: all'
      tags:
