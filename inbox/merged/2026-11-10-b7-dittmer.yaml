      - name:stennis-john-c
      - name:pastore-john-o
- add:
    entry:
      id: cal.1966-08.poverty-2
      when: Aug.
      date: '1966-08'
      thread: poverty
      c: Stennis, after Cotter's report, again demands that OEO cut off the Child Development Group of Mississippi's funds; this time Shriver complies.
      n: '[[w.dittmer-local-people]], 377. Check: the day of each; Dittmer names no source for them. See [[cal.1966-08-05.poverty]]. Names: Stennis, Shriver.'
