      when: Dec. 1–4
      date: '1964-12-01'
      thread: laos
      c: Phou Kout. T-28s on the mountain Dec. 1 and 2; five neutralist battalions take the objective at its base; Dec. 3
        they climb the east slope and take a peak near the summit, then stop. Dec. 4 the North Vietnamese and Pathet Lao counterattack
        and drive them off the peak.
      n: '[[w.anthony-war-in-northern-laos]], 143–44. To check: AmEmb Vientiane to SECSTATE, 828, Dec. 2, 1964 (cited by [[w.anthony-war-in-northern-laos]],
