      - name:kong-le
- add:
    entry:
      id: cal.1961-03-13.laos
      when: Mar. 13
      date: '1961-03-13'
      thread: laos
      c: 'Kennedy, Felt and Boyle present, approves the Chiefs'' five steps, code word Millpond: sixteen "sterile" B-26s in
        Thailand, maintained by Air America; sixteen H-34s and four C-130s, three DC-4s and a C-47 to Air America; four 105-mm
        batteries from Sarit; the Meo irregulars from three thousand to four thousand by Apr. 1; a hundred more men for the
        PEO and JUSMAGTHAI.'
      n: '[[w.anthony-war-in-northern-laos]], 42, 44. Check: FRUS 1961–63, XXIV, prints no meeting of Mar. 13; the conference
        of Mar. 9 (doc. 25) took up the Chiefs'' plan for the Plain of Jars. To check: Staff study for CJCS, "Concept for
        Recapture of the Plaine des Jarres," Mar. 10, 1961 (cited by [[w.anthony-war-in-northern-laos]], 42 n.40); JCS to
        CINCPAC, 991705, Mar. 11, 1961 (cited by [[w.anthony-war-in-northern-laos]], 42 n.41a); JCS to CINCPAC, 991727, Mar.
        13, 1961 (cited by [[w.anthony-war-in-northern-laos]], 42 n.41b). See [[cal.1961-03-09.laos]]. Names: Kennedy, Felt,
        Sarit Thanarat.'
      src:
        c: ca4e5128
        rows:
        - 'w.anthony-war-in-northern-laos 42, 44: all'
        - 'via w.anthony-war-in-northern-laos 42 n.40: all'
