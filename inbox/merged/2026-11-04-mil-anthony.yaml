- add:
    entry:
      id: cal.1965-01-13.laos
      when: Jan. 13
      date: '1965-01-13'
      thread: laos
      c: 'Barrel Roll 9 on the Ban Ken bridge, Route 7, approved by the NSC Jan. 10: sixteen F-105s, ten with eight 750-pound
        bombs each, six with Bullpups; eight F-100s on the flak, four for MiG cover; an RF-101 pathfinder. Fifty-two bombs
        on the first pass destroy the bridge; one Bullpup fired at it, a hit. An F-100 and an F-105 shot down, Captains Vollmer
        and Ferguson recovered by Air America.'
      n: '[[w.anthony-war-in-northern-laos]], 148–49. To check: CINCPAC to COMUSMACV and CINCPACFLT, 100616Z Jan. 65 (cited
        by [[w.anthony-war-in-northern-laos]], 148 n.52); AmEmb Vientiane to SECSTATE, 1044, Jan. 13, 1965 (cited by [[w.anthony-war-in-northern-laos]],
        149 n.54a); AmEmb Vientiane to SECSTATE, 1047, Jan. 13, 1965 (cited by [[w.anthony-war-in-northern-laos]], 149 n.54b);
        PACAF to CINCPAC, 131012Z Jan. 65 (cited by [[w.anthony-war-in-northern-laos]], 149 n.54c); 2d AD to JCS, 131055Z
        Jan. 65 (cited by [[w.anthony-war-in-northern-laos]], 149 n.54d); 2d AD to JCS, 131127Z Jan. 65 (cited by [[w.anthony-war-in-northern-laos]],
        149 n.54e); 2d AD to JCS, 141946Z Jan. 65 (cited by [[w.anthony-war-in-northern-laos]], 149 n.54f). See [[cal.1964-12-21.laos]].'
