- cite:
    id: cal.1960-11-30.laos
    item: '[[w.anthony-war-in-northern-laos]], 31 (Phoumi across the Kading River, Nov. 28; the neutralists driven back toward
      Paksane)'
- check:
    id: cal.1960-11-30.laos
    text: 'Check: Anthony dates the attack across the Kading Nov. 28 (31)'
- add:
    entry:
      id: cal.1960-09-16.laos
      when: Sept. 16
      date: '1960-09-16'
      thread: laos
      c: 'The Pathet Lao order their forces to avoid Souvanna Phouma''s and Kong Le''s troops and attack Phoumi''s; their
        2d Battalion strikes the Samneua garrison. Defense and State release military supplies from stocks in Thailand to
        the FAL in the field; Air America given the resupply. Brown: the airlift solely for Samneua''s defense.'
      n: '[[w.anthony-war-in-northern-laos]], 30. To check: [[w.dommen-conflict-in-laos]], 153–54 (cited by [[w.anthony-war-in-northern-laos]],
        30 n.65a); SECSTATE/SECDEF to AmEmb Vientiane, 315, Sept. 16, 1960 (cited by [[w.anthony-war-in-northern-laos]], 30
        n.65b); AmEmb Vientiane to SECSTATE, 579, Sept. 21, 1960 (cited by [[w.anthony-war-in-northern-laos]], 30 n.65c);
        AmEmb Bangkok to SECSTATE, 531, Sept. 23, 1960 (cited by [[w.anthony-war-in-northern-laos]], 30 n.65d). Names: Souvanna
        Phouma, Kong Le, Phoumi Nosavan, Brown.'
      src:
        c: 1e48061c
        rows:
        - 'w.anthony-war-in-northern-laos 30: all'
        - 'via w.anthony-war-in-northern-laos 30 n.65b: all'
        - 'via w.anthony-war-in-northern-laos 30 n.65c: all'
        - 'via w.anthony-war-in-northern-laos 30 n.65d: all'
      tags:
      - name:souvanna-phouma
      - name:kong-le
      - name:phoumi-nosavan
      - name:brown-winthrop-g
- add:
    entry:
      id: cal.1960-09-17.laos
      when: Sept. 17
      date: '1960-09-17'
      thread: laos
      c: 'Air America''s airlift begins, two C-46s and two C-47s: rice, ammunition and some troops to points throughout Laos
        for ten days, to Sept. 27, the casualties out on the return.'
      n: '[[w.anthony-war-in-northern-laos]], 30. See [[cal.1960-09-16.laos]].'
      src:
        c: 9e5fa70f
        rows:
        - 'w.anthony-war-in-northern-laos 30: all'
- add:
    entry:
      id: cal.1960-09-28.laos
      when: Sept. 28
      date: '1960-09-28'
      thread: laos
      c: 'The Pathet Lao overrun the Samneua airstrip. Brown halts Air America''s flights into combat areas: Savannakhet,
        Phoumi''s secure outposts and the Plain of Jars only. Cut off, Samneua''s garrison of fifteen hundred evacuates the
        town southward.'
      n: '[[w.anthony-war-in-northern-laos]], 30. To check: [[w.dommen-conflict-in-laos]], 154 (cited by [[w.anthony-war-in-northern-laos]],
        30 n.66a); AmEmb Vientiane to SECSTATE, 623, Sept. 27, 1960 (cited by [[w.anthony-war-in-northern-laos]], 30 n.66b);
        AmEmb Vientiane to SECSTATE, 636, Sept. 28, 1960 (cited by [[w.anthony-war-in-northern-laos]], 30 n.66c); AmEmb Vientiane
        to SECSTATE, 640, Sept. 29, 1960 (cited by [[w.anthony-war-in-northern-laos]], 30 n.66d); MAAG Laos Briefing, Laos:
        Pawn of Destiny, Aug. 1961 (cited by [[w.anthony-war-in-northern-laos]], 30 n.66e). See [[cal.1960-09-16.laos]]. Names:
        Brown, Phoumi Nosavan.'
      src:
        c: 7cac6c5e
        rows:
        - 'w.anthony-war-in-northern-laos 30: all'
        - 'via w.anthony-war-in-northern-laos 30 n.66b: all'
        - 'via w.anthony-war-in-northern-laos 30 n.66c: all'
        - 'via w.anthony-war-in-northern-laos 30 n.66d: all'
        - 'via w.anthony-war-in-northern-laos 30 n.66e: all'
      tags:
      - name:brown-winthrop-g
      - name:phoumi-nosavan
- add:
    entry:
      id: cal.1960-09-29.laos
      when: Sept. 29
      date: '1960-09-29'
      thread: laos
      c: A Kong Le and Pathet Lao force crosses the Kading River toward Thakhek; Phoumi's troops force it back. Air America
        delivers five tons to the Plain of Jars.
      n: '[[w.anthony-war-in-northern-laos]], 30. Check: the day the King brought both sides to Luang Prabang and the Kading
        was agreed the line (30 gives no date). See [[cal.1960-09-16.laos]]. Names: Kong Le, Phoumi Nosavan.'
      src:
        c: b064527d
        rows:
        - 'w.anthony-war-in-northern-laos 30: all'
      tags:
      - name:kong-le
      - name:phoumi-nosavan
