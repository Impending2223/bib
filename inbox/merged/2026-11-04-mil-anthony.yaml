- add:
    entry:
      id: cal.1960-12-21.laos
      when: Dec. 21
      date: '1960-12-21'
      thread: laos
      c: 'Over Vang Vieng. Lieutenant Colonel Butler Toland, the air attaché in Saigon, in his VC-47 within a hundred feet
        of a Soviet Il-14 dropping supplies, photographs it with a hand-held camera, fifteen minutes in its pattern. His Dec.
        20 pictures: eighteen parachutes on the ground, heavy road traffic some twenty-two miles north of Vientiane.'
      n: '[[w.anthony-war-in-northern-laos]], 34. To check: CINCPAC to Actg CHPEO Savannakhet, 172359Z Dec. 60 (cited by [[w.anthony-war-in-northern-laos]],
        34 n.6a); Butler B. Toland, Jr., interview by Robert G. Zimmerman, Nov. 18, 1974 (cited by [[w.anthony-war-in-northern-laos]],
        34 n.6b).'
      src:
        c: 88d38231
        rows:
        - 'w.anthony-war-in-northern-laos 34: all'
        - 'via w.anthony-war-in-northern-laos 34 n.6a: all'
        - 'via w.anthony-war-in-northern-laos 34 n.6b: all'
- add:
    entry:
      id: cal.1960-12-27.laos
      when: Dec. 27
      date: '1960-12-27'
      thread: laos
      c: Defense and State tell CINCPAC to begin T-6 training for the Laotian air arm; ten Thai T-6s to be transferred, none
        to Phoumi unless he protests the Soviet airlift at the UN and says he will act unless it stops. Brown agrees.
      n: '[[w.anthony-war-in-northern-laos]], 35. To check: SECSTATE/SECDEF to AmEmb Vientiane, 688, Dec. 27, 1960 (cited
        by [[w.anthony-war-in-northern-laos]], 35 n.11a); AmEmb Vientiane to SECSTATE, 1191, Dec. 28, 1960 (cited by [[w.anthony-war-in-northern-laos]],
        35 n.11b). Names: Phoumi Nosavan, Brown.'
      src:
        c: 4452a104
        rows:
        - 'w.anthony-war-in-northern-laos 35: all'
        - 'via w.anthony-war-in-northern-laos 35 n.11a: all'
        - 'via w.anthony-war-in-northern-laos 35 n.11b: all'
      tags:
      - name:phoumi-nosavan
      - name:brown-winthrop-g
- add:
    entry:
      id: cal.1960-12-31.laos-2
      when: Dec. 31–Jan. 3
      date: '1960-12-31'
      thread: laos
      c: The Plain of Jars lost. The North Vietnamese from the east, Kong Le's paratroopers flown in by the Soviets from the
        west; the FAL at Xieng Khouangville, surprised, flees to Tha Thom and Paksane. Jan. 3, Phoumi's paratroopers dropped
        to restore it scatter. Vang Pao's Meo withdraw to the mountains in order.
      n: '[[w.anthony-war-in-northern-laos]], 39. Names: Kong Le, Phoumi Nosavan, Vang Pao.'
      src:
        c: e15ae2b0
        rows:
        - 'w.anthony-war-in-northern-laos 39: all'
      tags:
      - name:kong-le
      - name:phoumi-nosavan
      - name:vang-pao
- add:
    entry:
      id: cal.1961-01-01.laos
      when: By Jan. 1
      date: '1961-01-01'
      thread: laos
      c: Four B-26s with American crews at Takhli, Thailand.
      n: '[[w.anthony-war-in-northern-laos]], 36.'
      src:
        c: 4dff95e8
        rows:
        - 'w.anthony-war-in-northern-laos 36: all'
- add:
    entry:
      id: cal.1961-01-04.laos
      when: Jan. 4
      date: '1961-01-04'
      thread: laos
      c: Six Laotian T-6 pilots back at Savannakhet from gunnery at Kokotiem, with four Thai "volunteers" in Laotian insignia.
        Boun Oum's government protests the Soviet airlift to the Soviet embassy, which refuses the note. Phoumi orders the
        air arm's first combat mission, an armed reconnaissance of Route 13 from the Lik River to Vang Vieng.
      n: '[[w.anthony-war-in-northern-laos]], 36. To check: JCS to CINCPAC, 988336, 071344Z Jan. 61 (cited by [[w.anthony-war-in-northern-laos]],
        36 n.17a); History, CINCPAC, 1961, pt. 2, pp. 67–69 (cited by [[w.anthony-war-in-northern-laos]], 36 n.17b); William
        H. Pietsch Jr., interview by the author, July 25, 1974 (cited by [[w.anthony-war-in-northern-laos]], 36 n.17c). Names:
        Boun Oum, Phoumi Nosavan.'
      src:
        c: c76f6da8
        rows:
        - 'w.anthony-war-in-northern-laos 36: all'
        - 'via w.anthony-war-in-northern-laos 36 n.17a: all'
        - 'via w.anthony-war-in-northern-laos 36 n.17b: all'
        - 'via w.anthony-war-in-northern-laos 36 n.17c: all'
      tags:
      - name:boun-oum-na-champassak
      - name:phoumi-nosavan
- add:
    entry:
      id: cal.1961-01-16.laos
      when: Jan. 16
      date: '1961-01-16'
      thread: laos
      c: Phoumi's two-pronged drive on Sala Phou Khoun takes Vang Vieng, the airhead of the forces against the government,
        and its stockpiles.
      n: '[[w.anthony-war-in-northern-laos]], 39. Names: Phoumi Nosavan.'
      src:
        c: '69885889'
        rows:
        - 'w.anthony-war-in-northern-laos 39: all'
      tags:
      - name:phoumi-nosavan
- add:
    entry:
      id: cal.1961-01-17.laos
      when: Jan. 17
      date: '1961-01-17'
      thread: laos
      c: 'A Laotian T-6 shot down. The pilots'' first kills, Jan. 14: two trucks near Vang Vieng. Felt had pressed for sorties
        on the Plain of Jars, Kong Le receiving some fifty tons of supplies a day.'
      n: '[[w.anthony-war-in-northern-laos]], 37. To check: CINCPAC to CHPEO, 131040Z Jan. 61 (cited by [[w.anthony-war-in-northern-laos]],
        37 n.21a); History, CINCPAC, 1961, pt. 2, pp. 67–69 (cited by [[w.anthony-war-in-northern-laos]], 37 n.21b); Ronald
        G. Shaw, interview by the author, Jan. 22, 1975 (cited by [[w.anthony-war-in-northern-laos]], 37 n.21c). Names: Felt,
        Kong Le.'
      src:
        c: 518d80bf
        rows:
        - 'w.anthony-war-in-northern-laos 37: all'
        - 'via w.anthony-war-in-northern-laos 37 n.21a: all'
        - 'via w.anthony-war-in-northern-laos 37 n.21b: all'
