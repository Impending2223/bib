      when: Nov. 8
      date: '1961-11-08'
      thread: laos
      c: 'Able Mable''s first mission: four RF-101s of the 45th Tactical Reconnaissance Squadron, Misawa, at Don Muang for
        thirty days, with a photo processing cell. By the year''s end, 130 sorties, nearly 54,000 feet of film, over 12,000
        prints; at Tchepone, two Soviet Il-14s in the pattern and three unloading.'
      n: '[[w.anthony-war-in-northern-laos]], 63. To check: Smith, USAF Reconnaissance in Southeast Asia, 1961–1966, p. 3
