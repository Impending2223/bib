      when: July 21–26
      date: '1964-07-21'
      thread: laos
      c: The 315th Air Division airlifts the 2d Air Division's air support operations center and control and reporting post
        to Udorn, forty-eight hours, twenty-one C-130 and eight C-124 flights, 145 passengers; ready July 26. Colonel McCreery
        the Deputy Commander for Laos Affairs.
