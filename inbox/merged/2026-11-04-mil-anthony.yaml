      date: '1964-06-19'
      thread: laos
      c: 'Moore puts a detachment of the 1st Air Rescue Squadron at Nakhon Phanom, Thailand, the Thai consent given June 18:
        Rescue 2, two HH-43B helicopters and thirty-six men. June 20, the Thai government lets PACAF use its bases for search
        and rescue.'
