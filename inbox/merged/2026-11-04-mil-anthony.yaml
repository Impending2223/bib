      when: July 30
      date: '1967-07-30'
      thread: laos
      c: 'The "Opium War" at Ban Khwan on the Mekong: Burmese opium caravaners, crossed into Laos July 26, and the Chinese
        irregulars besieging them, both refusing Ouane''s terms. About noon six T-28s bomb and strafe them; three FAR battalions
        close in, Ouane commanding. Two days'' fighting: over two hundred intruders killed, a hundred drowned; sixteen tons
        of opium taken.'
      n: '[[w.anthony-war-in-northern-laos]], 224.'
