        188 n.68a); AIRA Vientiane to JCS, 485, 120919Z Mar. 66 (cited by [[w.anthony-war-in-northern-laos]], 188 n.68b);
        Melvin F. Porter, The Defense of Lima Site 36 (Project CHECO, 1966), pp. 2–3 (cited by [[w.anthony-war-in-northern-laos]],
