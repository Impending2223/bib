      - name:souvanna-phouma
- add:
    entry:
      id: cal.1965-07-22.laos
      when: July 22
      date: '1965-07-22'
      thread: laos
      c: 'Keo Fa Mut, the hill between Na Khang and Hua Muong: the FAR and the Meo take its south slope, after over forty
        T-28 sorties from July 21, mostly white phosphorus, and Bango/Whiplash bombs; the two North Vietnamese companies on
        the summit ordered to hold.'
      n: '[[w.anthony-war-in-northern-laos]], 169. See [[cal.1965-02-14.laos]].'
      src:
        c: bd892022
        rows:
        - 'w.anthony-war-in-northern-laos 169: all'
- add:
    entry:
      id: cal.1965-07-28.laos
      when: July 28
      date: '1965-07-28'
      thread: laos
      c: 'The FAR and the Meo take Keo Fa Mut unopposed: four killed, thirty-three wounded; eighty-three enemy dead found.'
      n: '[[w.anthony-war-in-northern-laos]], 169. See [[cal.1965-07-22.laos]].'
      src:
        c: 42a7d788
        rows:
        - 'w.anthony-war-in-northern-laos 169: all'
- add:
    entry:
      id: cal.1965-08-05.laos
      when: Aug. 5
      date: '1965-08-05'
      thread: laos
      c: 'Washington: for "political factors," Air America keeps all rescue work in Barrel Roll; Air Force helicopters from
