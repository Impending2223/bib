      when: Feb. 14
      date: '1965-02-14'
      thread: laos
      c: Hua Muong, Lima Site 58, falls; the Meo back to Na Khang, Lima Site 36, with their families. Air America Caribous
        lift several thousand to Sam Thong and Long Tieng. Muong Khao, Pha Thom and Ban Na Lieu had fallen Feb. 8–10, despite
        seventeen T-28 sorties Feb. 10.
      n: '[[w.anthony-war-in-northern-laos]], 153. To check: ARMA Vientiane to DA, CX-88, 120600Z Feb. 65 (cited by [[w.anthony-war-in-northern-laos]],
