        rows:
        - 'w.anthony-war-in-northern-laos 46: all'
        - 'via w.anthony-war-in-northern-laos 46 n.60a: all'
- add:
    entry:
      id: cal.1961-04-03.laos
      when: Apr. 3–4
      date: '1961-04-03'
      thread: laos
      c: 'Soviet aircraft drop Kong Le''s paratroopers west of Vang Vieng. A PEO operation against Muong Kassy: seven C-47s
        and fourteen H-34s, T-6s flying cover, lift 640 government troops east of the town; they will not close with the enemy.
        By Apr. 3 all sixteen Millpond B-26s and their sanitized American crews in Thailand.'
      n: '[[w.anthony-war-in-northern-laos]], 47. Names: Kong Le.'
      src:
        c: 92a69601
        rows:
        - 'w.anthony-war-in-northern-laos 47: all'
      tags:
      - name:kong-le
- add:
    entry:
      id: cal.1961-04-13.laos
      when: Apr. 13
      date: '1961-04-13'
      thread: laos
      c: 'A White House meeting affirms McNamara: the B-26s not used now. Kennedy would let them fly if the Pathet Lao made
        a serious ground attack on the FAL. LeMay had asked them put into action at once.'
      n: '[[w.anthony-war-in-northern-laos]], 47. To check: JCSM-206-61, Laos, Mar. 31, 1961 (cited by [[w.anthony-war-in-northern-laos]],
        47 n.67a); Luther C. Heinz, memorandum for record, "State-JCS Meeting, 14 Apr 1961," Apr. 15, 1961 (cited by [[w.anthony-war-in-northern-laos]],
        47 n.67b). Names: McNamara, Kennedy, LeMay.'
      src:
        c: 3d7eb332
        rows:
        - 'w.anthony-war-in-northern-laos 47: all'
        - 'via w.anthony-war-in-northern-laos 47 n.67a: all'
        - 'via w.anthony-war-in-northern-laos 47 n.67b: all'
      tags:
