      c: 'Sylvester, at the Pentagon, announces the loss of the two fighters over Laos; the mission not described; four other
        American planes shot down over Laos before. Sullivan had meant to "stonewall." Next day''s *Times* (Finney) and *Sun*
        (Watson): bombing, not reconnaissance.'
