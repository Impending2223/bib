      date: '1967-07-16'
      thread: laos
      c: 'A twelve-man sapper team inside the Luang Prabang airfield before dawn: nine of the eleven Laotian T-28s destroyed,
        another damaged, a helicopter and part of the bomb dump; three FAR soldiers killed, eight hurt; the raiders unseen.'
      n: '[[w.anthony-war-in-northern-laos]], 223.'
