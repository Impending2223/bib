      date: '1966-10-21'
      thread: laos
      c: 'Thao Ma and Colonel Bounleut seize Savannakhet airfield about 5 a.m.; by 8:30 the T-28s bomb and strafe FAR headquarters,
        Chinaimo and Wattay in Vientiane: twenty-three killed, sixty-five wounded. Thao Ma asks Sullivan''s help against Kouprasith,
        Bounpone and Oudone; agrees to mediation. Momyer suspends all Air Force missions over Laos. That afternoon Sullivan,
        the British Ambassador and Boun Oum at Savannakhet.'
