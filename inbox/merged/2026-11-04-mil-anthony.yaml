      when: Dec. 21
      date: '1964-12-21'
      thread: laos
      c: 'Barrel Roll 3, the first Air Force armed reconnaissance in northern Laos: four F-100s from Da Nang, two Korat F-105s
        for MiG cover, on Route 7. Heavy flak at the Ban Ken bridge; the F-100s strafe and drop cluster bombs on the guns;
        several hit by small arms, all back.'
