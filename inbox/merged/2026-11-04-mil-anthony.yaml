      when: Jan. 20
      date: '1965-01-20'
      thread: laos
      c: 'Wattay. A T-28''s gun fires into the plane ahead, its bombs go off: nine Laotian T-28s and a Cessna destroyed, no
        one hurt. The same day the Meo lose Ban Hong Non, Lima Site 86, to six to eight battalions.'
      n: '[[w.anthony-war-in-northern-laos]], 150. To check: PACOM Weekly Intelligence Digest 7-65, Feb. 12, 1965 (cited by
        [[w.anthony-war-in-northern-laos]], 150 n.60a); AmEmb Vientiane to SECSTATE, 1211, Feb. 4, 1965 (cited by [[w.anthony-war-in-northern-laos]],
