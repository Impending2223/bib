- add:
    entry:
      id: cal.1965-06-02.laos
      when: June 2
      date: '1965-06-02'
      thread: laos
      c: 'Souvanna Phouma approves Duck Soup, daylight intercepts of North Vietnamese transports supplying by air in Laos:
        four Whiplash F-105s on alert at Korat from late afternoon to dark, scrambled by the Udorn center, at low level clear
        of Samneua and the flak.'
      n: '[[w.anthony-war-in-northern-laos]], 172. Names: Souvanna Phouma.'
      src:
        c: 18e1b3ac
        rows:
        - 'w.anthony-war-in-northern-laos 172: all'
