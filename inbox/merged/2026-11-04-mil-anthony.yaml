- add:
    entry:
      id: cal.1965-04-14.laos
      when: Apr. 14
      date: '1965-04-14'
      thread: laos
      c: 'The first American close support of Laotian ground forces: jets on two Pathet Lao troop concentrations some fifteen
        miles north of Muong Phalane, at Thao Ma''s request of Apr. 13, T-28s marking with smoke rockets as forward air controllers,
        a Laotian officer aboard the Victor control ship. Sullivan and Souvanna Phouma approve; Martin gets the Thai government''s
        leave for Thai-based planes.'
      n: '[[w.anthony-war-in-northern-laos]], 165–66. To check: AmEmb Vientiane to CINCPAC, SECSTATE, 1666, Apr. 13, 1965
        (cited by [[w.anthony-war-in-northern-laos]], 165 n.122); CINCPACAF to CINCPAC, 140150Z Apr. 65 (cited by [[w.anthony-war-in-northern-laos]],
        165 n.123a); CINCPAC to AmEmb Vientiane, 172210Z Apr. 65 (cited by [[w.anthony-war-in-northern-laos]], 165 n.123b).
        Names: Sullivan, Souvanna Phouma, Martin.'
