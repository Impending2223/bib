      when: May 18
      date: '1964-05-18'
      thread: laos
      c: 'Thao Ma and his pilots take over the four T-28s at Udorn, the American Air Commandos left out of the fighting. That
        afternoon four missions of three T-28s on the Plain of Jars: twenty-four 100-pound and twelve 500-pound bombs, mostly
        on what Kong Le''s troops left behind.'
