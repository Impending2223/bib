      date: '1961-10-04'
      thread: laos
      c: 'Field Goal''s reconnaissance resumes, on the Pathet Lao''s holdings along Route 13 and Vang Vieng''s airfield: twenty-six
        flights in October, above forty thousand feet at Brown''s insistence. Fired on, the flights are barred from the Plain
        of Jars and Xieng Khouangville without his leave; all surveillance of the Plain suspended Nov. 6–10.'
