      when: Aug. 19
      date: '1963-08-19'
      thread: laos
      c: 'Rusk''s guidelines for the T-28s: a quick counterpunch if the Communists step up their attacks; troop concentrations
        in critical areas, trucks and fuel stores; no "deep penetrations." Rockets, machine guns, bombs and, for the first
        time, napalm.'
      n: '[[w.anthony-war-in-northern-laos]], 90. To check: SECSTATE to AmEmb Vientiane, 158, Aug. 19, 1963 (cited by [[w.anthony-war-in-northern-laos]],
