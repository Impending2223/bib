      when: Apr. 15–17
      date: '1961-04-15'
      thread: laos
      c: MATS C-124s airlift a control and reporting center from Clark to Don Muang, Bangkok; six F-100s of the 510th Tactical
        Fighter Squadron to Bangkok for its air defense.
      n: '[[w.anthony-war-in-northern-laos]], 48. To check: History, 5th Communications and Control Group, Jan.–June 1961,
