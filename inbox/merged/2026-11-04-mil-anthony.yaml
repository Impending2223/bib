      thread: laos
      c: The Meo take Chik Mok Lok, a four-thousand-foot hill over Muong Peun and Route 6, by noon, after hand-to-hand fighting,
        twelve A-1Es and ten F-105s dropping napalm and antipersonnel bomblets. Earlier tries Mar. 15, 28 and 29 had failed;
