      when: Apr. 26
      date: '1961-04-26'
      thread: laos
      c: Muong Sai fallen; Phoumi appeals for air strikes. Brown asks authority to fly the B-26s if the enemy moves south
        of the Lik River or takes the high ground over Luang Prabang, Paksane or Savannakhet.
      n: '[[w.anthony-war-in-northern-laos]], 49. To check: AmEmb Vientiane to SECSTATE, 1943, Apr. 26, 1961 (cited by [[w.anthony-war-in-northern-laos]],
