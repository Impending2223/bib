      when: Dec. 10
      date: '1964-12-10'
      thread: laos
      c: A North Vietnamese battalion falls on the neutralists below Phou Kout; they retreat to Muong Soui. Kong Le sacks
        Colonel Somboun, suspected of taking 1.5 million kip of the troops' funds.
      n: '[[w.anthony-war-in-northern-laos]], 144. See [[cal.1964-12-01.laos]]. Names: Kong Le.'
