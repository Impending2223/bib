      date: '1965-03-18'
      thread: laos
      c: 'Sullivan agrees to Westmoreland''s request: Barrel Roll 32 to 40 at one mission every twenty-four hours. Washington
        cuts the sterile period to twenty-four hours, and Mar. 23 applies it to reseeding.'
