      when: May 22
      date: '1965-05-22'
      thread: laos
      c: Three F-4s from Ubon in close support of FAR troops holding Muong Nga, northern Luang Prabang Province; a liaison
        plane shot down. May 23, four F-105s from Takhli flying cover for the rescue hit a cluster of shacks at the Victor
        controller's call.
