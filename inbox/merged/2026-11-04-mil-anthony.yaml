      thread: laos
      c: Six to eight hundred North Vietnamese attack Na Khang, Lima Site 36, after infiltrating its perimeter the night of
        Jan. 5–6, aiming at the command post. The F-105s held off by a two-hundred-foot ceiling; two A-1s of the 602d Fighter
        Squadron Commando from Udorn break through over the site. Repulsed.
