- add:
    entry:
      id: cal.1965-04-17.laos
      when: Apr. 17
      date: '1965-04-17'
      thread: laos
      c: 'The Chiefs ease Washington''s hold on strikes in Laos: CINCPAC and the embassy may set Barrel Roll and Steel Tiger
        missions without limits on number, day and night, sterile periods or planes; secondary targets from the embassy''s
        and Laotian lists; cratering allowed; all conventional ordnance but napalm; targets of opportunity with the embassy.'
      n: '[[w.anthony-war-in-northern-laos]], 168. To check: JCS to CINCPAC, 171853Z Apr. 65 (cited by [[w.anthony-war-in-northern-laos]],
        168 n.136). See [[cal.1965-03-08.laos]].'
      src:
        c: 35531ef2
        rows:
        - 'w.anthony-war-in-northern-laos 168: all'
        - 'via w.anthony-war-in-northern-laos 168 n.136: all'
