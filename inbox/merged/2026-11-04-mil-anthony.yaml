      date: '1964-07-25'
      thread: laos
      c: 'A break in the monsoon: the Laotian air force flies fifty-nine sorties on targets along Route 13 to Sala Phou Khoun;
        claims sixty-six buildings, with seventy-two 500-pound and fifty-eight 250-pound bombs and 318 rockets.'
      n: '[[w.anthony-war-in-northern-laos]], 125–26. To check: AmEmb Vientiane to SECSTATE, 160, July 25, 1964 (cited by
