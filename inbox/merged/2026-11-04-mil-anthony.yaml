      date: '1965-02-19'
      thread: laos
      c: 'Barrel Roll 30, ordered by the Chiefs Feb. 17 on four 105-mm howitzers at Ban Houa Xieng: eight F-105s of the 12th
        Tactical Fighter Squadron from Da Nang, eight F-100s on the flak. They go first to Samneua: some thirty trucks, three
        destroyed, three burning; an F-100 shot down.'
      n: '[[w.anthony-war-in-northern-laos]], 154–55. To check: JCS to CINCPAC, 5385, 170213Z Feb. 65 (cited by [[w.anthony-war-in-northern-laos]],
