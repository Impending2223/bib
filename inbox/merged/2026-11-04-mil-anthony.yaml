        time. Feb. 18 Sullivan allows napalm: four F-105s of the 355th Wing drop sixteen cans two hundred yards from the strip.
        The last Meo lifted out Feb. 19. In three days 165 close support sorties by F-105s and F-4s.'
      n: '[[w.anthony-war-in-northern-laos]], 188–89, 197. Check: the first napalm in Laos, by Anthony''s note, a Navy A-4E''s
