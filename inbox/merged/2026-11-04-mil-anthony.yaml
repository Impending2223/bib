      id: cal.1965-05-09.laos
      when: May 9
      date: '1965-05-09'
      thread: laos
      c: Ten to twelve tanks seen on the Plain of Jars near Muong Kheung; eleven T-28s at once, then a flight of Bango F-4Cs,
        an hour and fifteen minutes after the call.
      n: '[[w.anthony-war-in-northern-laos]], 168.'
