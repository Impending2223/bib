      - name:sarit-thanarat
- add:
    entry:
      id: cal.1961-03-21.laos-2
      when: Mar. 21–23
      date: '1961-03-21'
      thread: laos
      c: The 315th Air Division airlifts Marine Air Group 16's men and equipment from Okinawa to Udorn, three days. The Marines
        set up a helicopter base and turn sixteen H-34s over to Air America, ten Army, ten Navy and seventeen Marine pilots.
        Lexington and Midway into the South China Sea; Bennington a hundred miles south of Bangkok.
      n: '[[w.anthony-war-in-northern-laos]], 46. To check: History, CINCPAC, 1961, pt. 2, p. 84 (cited by [[w.anthony-war-in-northern-laos]],
        46 n.60a); [[w.dommen-conflict-in-laos]], 189 (cited by [[w.anthony-war-in-northern-laos]], 46 n.60b). See [[cal.1961-03-21.laos]].'
      src:
