      when: June 10
      date: '1964-06-10'
      thread: laos
      c: 'Hanoi and Peking radios denounce the strafing that day of Khang Khay by American jets; a Chinese colonel of the
        economic and cultural mission killed, they say. State''s noon briefing acknowledges Air Force reconnaissance over
        the Plain of Jars the day before, the escorts returning fire. Unger: "a liar a second time in three days."'
      n: '[[w.anthony-war-in-northern-laos]], 114–15. Check: Souphanouvong told the control commission, June 16, the attack
        was June 11, by six T-28s "piloted by Americans" (114); who struck Khang Khay not settled. To check: AmEmb Vientiane
        to SECSTATE, 1587, June 11, 1964 (cited by [[w.anthony-war-in-northern-laos]], 114 n.34a); AmEmb Vientiane to SECSTATE,
        1614, June 13, 1964 (cited by [[w.anthony-war-in-northern-laos]], 114 n.34b); SECSTATE to AmEmb Vientiane, 1170, June
        10, 1964 (cited by [[w.anthony-war-in-northern-laos]], 115 n.40); AmEmb Vientiane to SECSTATE, 1586, June 10, 1964
        (cited by [[w.anthony-war-in-northern-laos]], 115 n.41). See [[cal.1964-06-09.laos]]. Names: Unger.'
      src:
