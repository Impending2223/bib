    entry:
      id: cal.1964-06-23.laos
      when: June 23
      date: '1964-06-23'
      thread: laos
      c: 'The FAR General Staff firms up Operation Triangle: three prongs to secure Route 13 from Vientiane to Luang Prabang
        and Route 7 east from Sala Phou Khoun to Muong Soui; ten battalions, GM 16''s three, eighteen hundred men, flown up
        from the south. Deployment to begin July 1, the assault six days later.'
      n: '[[w.anthony-war-in-northern-laos]], 119. To check: ARMA Vientiane to DA, DIA, CSAF, 231350Z Jun. 64 (cited by [[w.anthony-war-in-northern-laos]],
        119 n.58a); SECSTATE to AmEmb London, Paris, et al., 7035, June 27, 1964 (cited by [[w.anthony-war-in-northern-laos]],
        119 n.58b).'
      src:
        c: ef933ab1
        rows:
        - 'w.anthony-war-in-northern-laos 119: all'
        - 'via w.anthony-war-in-northern-laos 119 n.58a: all'
        - 'via w.anthony-war-in-northern-laos 119 n.58b: all'
- add:
    entry:
      id: cal.1964-06-29.laos
      when: June 29
      date: '1964-06-29'
      thread: laos
      c: 'Washington endorses Operation Triangle. Yankee Team over the Plain of Jars resumes, night reconnaissance east of
        Muong Soui, the escorts free to hit enemy activity seen. American advisers allowed with the Laotian troops: five artillery
        officers to Muong Soui and Vang Vieng, three Air Force men as air liaison officers with the columns.'
      n: '[[w.anthony-war-in-northern-laos]], 122. See [[cal.1964-06-23.laos]].'
      src:
        c: 273c7310
        rows:
        - 'w.anthony-war-in-northern-laos 122: all'
