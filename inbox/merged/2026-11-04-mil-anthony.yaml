      when: Jan. 29
      date: '1964-01-29'
      thread: laos
      c: The FAR loses the Na Kay plateau; Route 8 from Lak Sao to Nhommarath, the Na Kay airfield with it, in Pathet Lao
        and North Vietnamese hands, Lak Sao and Kham Keut fallen in late December. The T-28s' forty-five sorties around Thakhek,
        Jan. 13 to Feb. 4, results unknown.
