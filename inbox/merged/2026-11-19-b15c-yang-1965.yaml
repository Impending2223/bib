        c: 'Yang Shangkun 杨尚昆, photographed with the prefectural committee, leaves Hanzhong 汉中 at 8:30 a.m. in rain: the Jitou pass 鸡头关, the Shimen 石门 (its inscriptions across the river, seen from the road), Madao 马道 town, Liuba 留坝 county, the Zhang Liang temple 张良庙 (an hour and a half; a stick and a jin of luxiancao bought), where Shu Tong 舒同, with him since Xixiang 西乡, turns back to Hanzhong; over two mountains; pheasants shot by his party on the way; across the Jialing 嘉陵江 to the Feng county 凤县 committee at 5:30 p.m.'
