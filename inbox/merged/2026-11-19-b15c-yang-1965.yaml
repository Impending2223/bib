        thread: china-leadership
        c: 'Yang Shangkun 杨尚昆 leaves Xixiang 西乡 at 8 a.m.: Chenggu 城固 at 10:30, a detour to an orange orchard, an hour lost; Hanzhong 汉中 at 1 p.m., 32 km from Chenggu; lodging at the prefectural committee. His note: a plain like Chengdu''s 成都; the city 70,000 people; ten counties, 2.5 million, a grain surplus, 160 million jin sent out last year; dozens of factories to move here in the third five-year plan; transport poor, no coal.'
