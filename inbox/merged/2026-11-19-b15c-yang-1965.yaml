      entry:
        id: cal.1965-11-09.china-leadership-4
        when: Nov. 9
        date: '1965-11-09'
        thread: china-leadership
        c: 'Peking 北京. Yang Shangkun 杨尚昆 writes to Mao 毛泽东 (the full text, the editors'' note): the General Office''s work handed over to Wang Dongxing 汪东兴 and others, the Center''s decision announced; nearly twenty years in the central organs, the work not done well, errors made, Mao''s hopes let down; thanks for the chance to temper and remold himself; he means to visit Niujiao 牛角 and to go to Guangdong 广东 at the month''s end, his rheumatic back under treatment; he hopes to see Mao before he goes.'
        place: peking
        n: '[[w.yang-shangkun-riji]], II, 686 (Nov. 9, 1965). The words: 写了一封信给主席 (II, 686). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: Yang Shangkun to Mao Zedong, Nov. 9, 1965 (printed by [[w.yang-shangkun-riji]], II, 686 n.1). Names: Yang Shangkun, Mao Zedong, Wang Dongxing.'
        src:
          c: 7cdc7c34
          rows: ['w.yang-shangkun-riji II, 686: all', 'via w.yang-shangkun-riji II, 686 n.1: all']
        tags: ['polity:prc', 'name:mao-zedong', 'vis:only:prc']
