        thread: china-leadership
        c: 'Xi''an 西安. Wang Lin 王林 with Yang Shangkun 杨尚昆, who gives his views on the next step at the points: shorten it, finish before the wheat harvest; the great questions of right and wrong, the small let pass; the four cleanups 四清, the grassroots bodies'' reform, and production as one; the struggle with the enemy not a stage of its own; classes drawn, in the villages, at the two ends only, by Peng Zhen''s 彭真 recent speech; after the Spring Festival the teams to train, the Twenty-three Articles 23条 the guide, few documents.'
        place: xian
        n: '[[w.yang-shangkun-riji]], II, 504 (Jan. 26, 1965). The words: 上午王林同志来 (II, 504). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Wang Lin, Yang Shangkun, Peng Zhen.'
