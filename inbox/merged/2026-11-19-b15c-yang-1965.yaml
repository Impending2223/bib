        when: Nov. 10
        date: '1965-11-10'
        thread: china-leadership
        c: 'Peking 北京, 11 a.m. to 12:30. Mao 毛泽东 has Yang Shangkun 杨尚昆 to talk. By Yang''s later recollection (the editors'' note): Mao gives him two tasks in Guangdong 广东, to report on central and State Council policies unsuited to the place, and to sort out the ministries'' directives that conflict with the Center''s; two or three years in the Pearl River basin, then the Yellow River''s.'
        place: peking
        n: '[[w.yang-shangkun-riji]], II, 686–687 (Nov. 10, 1965). The words: 11时到主席处谈话，到12时半才回医院吃中饭 (II, 686). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: Yang Shangkun''s recollection of the talk (cited by [[w.yang-shangkun-riji]], II, 687 n.1). See [[cal.1965-10-29.china-leadership-2]]. Names: Mao Zedong, Yang Shangkun.'
        src:
