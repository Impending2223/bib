        when: Mar. 19
        date: '1965-03-19'
        thread: china-leadership
        c: 'Yang Shangkun 杨尚昆 and Gong Zirong 龚子荣 by telephone. By Gong''s written report to Peng Zhen 彭真 that day (the editors'' note): the Northwest Bureau to meet on the 27th with the heads of the work corps of sixteen counties; Yang asks the Center for early instructions on drawing classes (the middle peasants; landlords and rich peasants of good record; new bourgeois and new rich peasants, Yang for not drawing them; class files), on the landlords'' and rich peasants'' property, on cadres'' restitution (strict in the checking, lenient in the restitution), and on the reach of blows and punishments; all the country, he says, may need them.'
        place: xian
        n: '[[w.yang-shangkun-riji]], II, 526 (Mar. 19, 1965). The words: 下午与龚子荣、姚溱同志通了话，告诉了他们一些情况，也知道了一些消息 (II, 526). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: Gong Zirong to Peng Zhen, Mar. 19, 1965, on his call with Yang Shangkun (cited by [[w.yang-shangkun-riji]], II, 526 n.3). Names: Yang Shangkun, Gong Zirong, Peng Zhen.'
