  - add:
      entry:
        id: cal.1965-08-17.china-leadership-7
        when: Aug. 17
        date: '1965-08-17'
        thread: china-leadership
        c: 'Peking 北京, 3:30 to 6:30 p.m. Yang Shangkun 杨尚昆 speaks three hours without a break to the General Office cadres going down for the second round of the four cleanups. By the record (the editors'' note): his one "squat" in Niujiao 牛角, "boring into the ox''s horn"; squatting good for body and mind; it showed the countryside''s want of doctors and culture (a film''s hire 30 yuan, a peasant''s year''s income) and the question of farm tools; the movement one of education, the masses to be roused, a class organization built; the poor peasants'' association, the branch rebuilt, Party members admitted one by one, the young won from their families, landlords'' and rich peasants'' children judged by conduct; labor as one can, the "four togethers" not overdone; take it only as reference.'
        place: peking
        n: '[[w.yang-shangkun-riji]], II, 653–661 (Aug. 17, 1965). The words: 3时半到6时半，与办公厅下去搞第二批四清的同志讲话，一气讲了3小时，中间未休息 (II, 653). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun.'
        src:
          c: 4ede644f
          rows: ['w.yang-shangkun-riji II, 653–661: all', 'via w.yang-shangkun-riji II, 653 n.1: all']
        tags: ['polity:prc', 'vis:only:prc']
        time: 1965-08-17T07:30Z
        time_zone: Asia/Shanghai
