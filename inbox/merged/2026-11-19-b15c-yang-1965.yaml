        n: '[[w.yang-shangkun-riji]], II, 501 (Jan. 23, 1965). The words: 晚饭之后，7时半到9时1刻开贫协会员会议，老范主持 (II, 501). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Fan Yanduo, Yang Shangkun.'
