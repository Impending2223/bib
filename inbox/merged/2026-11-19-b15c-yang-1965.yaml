        thread: china-leadership
        c: 'Yan''an 延安, from 3 p.m. to 8. Yang Shangkun 杨尚昆 visits the Zaoyuan 枣园, the Yanyuan 延园, the lodgings of Mao 毛泽东, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Zhu De 朱德 and Ren Bishi 任弼时, the small auditorium, Yangjialing 杨家岭 and Wangjiaping 王家坪, telling of the history as he goes. By the provincial committee''s record of his talks of the 25th and 26th (the editors'' note): the Center''s thirteen years in north Shaanxi in three stages (to the Eastern Expedition''s return, May 1936; the westward expansion to the Xi''an Incident; Yan''an); Wayaobu 瓦窑堡, Bao''an 保安 and Yan''an its centers; who lived where at each site, the Central Auditorium, the Seventh Congress; corrections to the exhibits'' labels.'
        place: yanan
        n: '[[w.yang-shangkun-riji]], II, 609–621 (May 25, 1965). The words: 下午3时乘车经清凉山大桥……直到枣园。参观了枣园、延园……回到招待所已经8时了 (II, 609). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: the Shaanxi provincial Party committee''s record of Yang Shangkun''s talks at Yan''an, May 25–26, 1965 (cited by [[w.yang-shangkun-riji]], II, 609 n.2). Names: Yang Shangkun, Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Ren Bishi.'
