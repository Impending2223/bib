        c: 'Niujiao 牛角, 6 to 10:30 p.m. The leaders'' small meeting on the whole plan of work; Yang Shangkun 杨尚昆 there. His work notes (514 n.2): An Yumi 安于密 on the tasks (the Twenty-three Articles carried out; the four cleanups; the democratic revolution''s lessons made up and classes cleared; the Party, brigades, poor peasants'' association, youth, women, militia and accountants organized; a production upsurge) in three stages: the four cleanups to the end of March; the lessons made up and the struggle with the enemy, half a month to 20 days; organization and management, about a month; production throughout; Youth League members to be taken in now, Party members one by one.'
