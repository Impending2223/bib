        date: '1965-05-13'
        thread: china-leadership
        c: 'Niujiao 牛角. Wang Kuancai''s 王宽才 wedding, in the new style, the village''s first; Yang Shangkun 杨尚昆 looks in after breakfast and, invited, sits an hour at his home in the afternoon, drinking, An Yumi 安于密 there, with a toast: respect the elders, teach the young, work well, stay united.'
        place: niujiao
        n: '[[w.yang-shangkun-riji]], II, 603 (May 13, 1965). The words: 今天王宽才结婚，早饭后看了一下，完全采取新形式，是牛角村的第一次 (II, 603). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Wang Kuancai, Yang Shangkun, An Yumi.'
        src:
          c: 4d8a09d1
          rows: ['w.yang-shangkun-riji II, 603: all']
        tags: ['polity:prc', 'vis:only:prc']
