        place: niujiao
        n: '[[w.yang-shangkun-riji]], II, 604–605 (May 16, 1965). The words: 8时早饭后，乘车去牛角村开会，庆祝社教胜利大会……10时开会，张学义主持，老安总结，我讲了20分钟 (II, 604). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Zhang Xueyi, An Yumi, Yang Shangkun, Li Dengying, Hang Shangzeng.'
