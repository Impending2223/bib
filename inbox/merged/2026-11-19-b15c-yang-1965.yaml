  - add:
      entry:
        id: cal.1965-01-24.china-leadership-4
        when: Jan. 24
        date: '1965-01-24'
        thread: china-leadership
        c: 'Niujiao 牛角, around supper. An Yumi 安于密, Wang Yuming 王愈明 and He Tongqing 贺同庆 report the teams'' close of the stage and the teams'' views of the branch committee; Yang Shangkun 杨尚昆 gives his views on the next stage, after the Spring Festival. His work notes (the editors'' note, 502 n.1): An, study neglected, work laid out too tight, the teams with too little initiative; He, the group leaders should visit the groups, the Party and Youth League work set aside; Wang, eighteen points, among them the brigade cadres to be settled early (Zhang Xueyi 张学义), the branch committee to rise above daily chores, the production targets set high, the debts owed by poor households, the dykes, the machine wells, the grain for martyrs'' and soldiers'' families, the Youth League''s work.'
        place: niujiao
        n: '[[w.yang-shangkun-riji]], II, 501–503 (Jan. 24, 1965). The words: 晚饭前后，安、王、贺来谈各队结束这一段工作的情况、各队向支委提出的意见 (II, 501). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: An Yumi, Wang Yuming, He Tongqing, Yang Shangkun, Zhang Xueyi.'
        src:
          c: 01f1db05
          rows: ['w.yang-shangkun-riji II, 501–503: all']
        tags: ['polity:prc', 'vis:only:prc']
