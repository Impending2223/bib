      entry:
        id: cal.1965-04-14.china-leadership-2
        when: Apr. 14
        date: '1965-04-14'
        thread: china-leadership
        c: 'Xi''an 西安, 9 a.m. to noon and 3 to 6 p.m. Wang Lin 王林 reports to Zhu De 朱德 on the socialist education, industry, agriculture and the third front, Liu Lantao 刘澜涛 there in the morning; Yang Shangkun 杨尚昆 there. Wang: the five northwestern provinces'' grain 24 billion jin at most (1957), 16.7 billion in 1961, 22.9 billion in 1964, not self-sufficient (Shaanxi to bring in 300 million jin this year); industrial output 4 billion yuan in 1962, 5.1 billion in 1964 (up 18.3 percent), 1.4 billion in this year''s first quarter (up 35 percent); the Baiyin 白银 works 30,000 tons of copper this year; capital construction 460 million yuan in 1962, 1.54 billion in 1964, 2.3 billion in 1965; 1,000 km of railway in the first five-year plan, over 2,000 in the second, 2,000 more to come, seven lines; Liujiaxia 刘家峡 under way.'
        place: xian
        n: '[[w.yang-shangkun-riji]], II, 583–584 (Apr. 14, 1965). The words: 上午9时到12时(澜涛同志上午参加，下午进村去了)，下午3时到6时，由王林同志汇报社教、工业、农业、三线的情况 (II, 583). The time is the first session''s. Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Wang Lin, Zhu De, Liu Lantao, Yang Shangkun.'
        src:
          c: eb502ea3
          rows: ['w.yang-shangkun-riji II, 583–584: all']
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
        time: 1965-04-14T01:00Z
        time_zone: Asia/Shanghai
