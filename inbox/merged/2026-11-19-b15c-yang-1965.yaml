        n: '[[w.yang-shangkun-riji]], II, 518 (Mar. 4, 1965). The words: 我有这样的想法: 拟在三干会完毕后……于3月中旬去汉中地区，4月中旬或5月初去延安走走 (II, 518). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun.'
