        place: xian
        n: '[[w.yang-shangkun-riji]], II, 583–584 (Apr. 14, 1965). The words: 严克伦同志谈了供销合作社的情况。朱总很注意供销合作社问题 (II, 583). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yan Kelun, Zhu De, Yang Shangkun.'
