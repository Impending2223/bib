        c: 'Peking 北京, the Diaoyutai 钓鱼台, Building 10, 11 a.m. Liu Shaoqi 刘少奇 chairs a meeting on Algeria, the Foreign Ministry and others there, Yang Shangkun 杨尚昆 among them: no meddling in Algeria''s affairs; support for whatever serves the struggle against imperialism and America; the Asian-African conference to meet on time, it is hoped. A cable is drafted to Mao 毛泽东 for his approval, then to go to Zhou Enlai 周恩来, Chen Yi 陈毅 and Ambassador Zeng Tao 曾涛, who is to talk with Boumedienne 布迈丁; Mao, on his way from Shanghai 上海 to Nanjing 南京, the cable sent to Nanjing.'
