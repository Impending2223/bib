        c: 'Niujiao 牛角. Yang Shangkun 杨尚昆 plans, once the three-level meeting is over and the next stage laid out, to go to the Hanzhong 汉中 area in mid-March and to Yan''an 延安 in mid-April or early May, to learn of the points at Xixiang 西乡 and Yan''an and of the prefectures; to be settled with those concerned at Xi''an 西安: "squatting" more loosely, Niujiao seen to its end.'
