        thread: china-leadership
        c: 'Xi''an 西安, Zhangbagou 丈八沟, from 5:30 p.m. Yang Shangkun 杨尚昆 calls on Chen Yi 陈毅, with Liu Lantao 刘澜涛 and others of the Northwest Bureau and the provincial committee; after dinner Chen tells them of the Center''s thinking since the Mar. 1 meeting in Moscow (the editors'' note): the article (the editors'' note: "On the Moscow March Meeting") written and widely consulted on. Back at 10.'
        place: xian
        n: '[[w.yang-shangkun-riji]], II, 526 (Mar. 19, 1965). The words: 5时半去丈八沟看他……饭后，陈向我们谈了3月1日会议之后中央的各种考虑，文章已写好并广泛征求了意见。10时才回 (II, 526). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Chen Yi, Liu Lantao.'
        src:
          c: 1a8bf831
