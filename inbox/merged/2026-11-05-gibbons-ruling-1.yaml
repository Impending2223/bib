- add:
    entry:
      id: cal.1963-10-06.vietnam-congress
      when: Oct. 6
      date: '1963-10-06'
      thread: vietnam-congress
      c: 'Zablocki and seven other members of House Foreign Affairs leave for Vietnam. Their report: American aid essential,
        the war being won, caution in backing any change of government. Back, Zablocki with Kennedy, by Zablocki''s account:
        "I hope you''ll write an objective report and not put President Diem in a favorable light."'
      n: '[[w.gibbons-u-s-government-and]], II, 194 (Kennedy''s words by the CRS interview with Zablocki, Jan. 29, 1979).
        Check: the days of the meeting and the report. Names: Zablocki, Kennedy, Ngô Đình Diệm.'
      src:
        c: f0480afd
        rows:
        - 'w.gibbons-u-s-government-and II, 194: all'
      tags:
      - name:zablocki-clement-j
      - name:kennedy-john-f
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1963-12.vietnam-2
      when: Dec.
      date: 1963-12
      thread: vietnam
      c: 'Russell, by a later account, to Johnson, asked what he would do about Vietnam: "I''d spend whatever it takes to
        bring to power a government that would ask us to go home."'
      n: '[[w.gibbons-u-s-government-and]], II, 215. Check: the day and the source; Gibbons: "late in 1963," "is said to have
        told." Names: Russell, Johnson.'
      src:
        c: e411aea3
        rows:
        - 'w.gibbons-u-s-government-and II, 215: all'
      tags:
      - name:russell-richard-b
      - name:johnson-lyndon-b
