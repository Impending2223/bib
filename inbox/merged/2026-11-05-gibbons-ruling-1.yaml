      id: cal.1962-04.vietnam-congress
      when: Apr.
      date: 1962-04
      thread: vietnam-congress
      c: 'Forrestal, by his later account, meets key members on Vietnam, Fulbright, Mansfield, Russell, Stennis, Thomas Morgan
        among them: "they didn''t want to hear much about it"; "a messy subject"; the chairmen did not want their committees
        involved.'
      n: '[[w.gibbons-u-s-government-and]], II, 119. Check: the days; Gibbons: the spring of 1962. Names: Forrestal, Fulbright,
        Mansfield, Russell, Stennis, Morgan.'
      src:
