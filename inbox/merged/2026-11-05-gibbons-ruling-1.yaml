      id: cal.1961-06-13.vietnam-congress-foreign-relations
      when: June 13–14
      date: '1961-06-13'
      thread: vietnam-congress-foreign-relations
      c: The Foreign Relations Committee in executive session on the foreign aid bill. Fulbright asks the Administration's
        witnesses whether the program has been reviewed to "affirmatively decide" which commitments are in the national interest,
        and whether it is "within our capacity to continue to try to support every area in the world that is not now within
        the Communist orbit." No such review made, the witnesses say.
      n: '[[w.gibbons-u-s-government-and]], II, 48 n.122. Check: which of the public and executive hearings each question
        comes from. Names: Fulbright.'
      src:
        c: 71603b4e
        rows:
        - 'w.gibbons-u-s-government-and II, 48 n.122: all'
      tags:
      - name:fulbright-j-william
- add:
