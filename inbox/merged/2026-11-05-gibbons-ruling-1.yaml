      when: Mar.
      date: 1964-03
      thread: vietnam-congress
      c: 'Ellender, of Senate Appropriations, who has visited Vietnam several times, agrees with Morse: the United States
        should not be involved there; its forces should be withdrawn.'
      n: '[[w.gibbons-u-s-government-and]], II, 224. Check: the day; the Record, Mar. 4–10, 1964. Names: Ellender, Morse.'
      src:
        c: da852c78
        rows:
        - 'w.gibbons-u-s-government-and II, 224: all'
      tags:
      - name:ellender-allen-j
      - name:morse-wayne
