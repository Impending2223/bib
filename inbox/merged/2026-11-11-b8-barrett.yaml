      when: Mar. 31
      date: '1967-03-31'
      thread: vietnam-support
      c: 'Johnson, flying with a number of diplomatic figures, shows a Latin American ambassador the weekly summary of the
        President''s mail on Vietnam: letters pro 260, con 467, comments 152; cards pro 0, con 10; telegrams pro 16, con 30,
        comments 14.'
      n: '[[w.barrett-uncertain-warriors]], 79. To check: Diary backup, Mar. 31, 1967, box 57, LBJ Library (cited by [[w.barrett-uncertain-warriors]],
        79 n.55a). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: a193bb2c
        rows:
        - 'w.barrett-uncertain-warriors 79: all'
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-2
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      c: 'The Tuesday lunch. Rostow, back from a call from an NSC staffer: "We have just been informed we are being heavily
        mortared in Saigon. The Presidential Palace, our BOQ''s, the Embassy, and the city itself have been hit." Johnson:
        "This could be very bad."'
      n: '[[w.barrett-uncertain-warriors]], 109. To check: Tom Johnson''s notes of meetings, Jan. 30, 1968, box 3, LBJ Library
        (cited by [[w.barrett-uncertain-warriors]], 109 n.1a). Names: Rostow, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      src:
        c: e528d275
        rows:
        - 'w.barrett-uncertain-warriors 109: all'
- add:
    entry:
      id: cal.1968-01-30.vietnam-congress-2
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-congress
      c: 'Thurmond in the Senate: "Mr. President, I have just received information that our embassy in Saigon has been overrun.
        Our airstrips are under attack." The embassy''s grounds had been broken into, and a battle followed.'
      n: '[[w.barrett-uncertain-warriors]], 109. To check: 114 Cong. Rec. 1397 (1968) (Jan. 30, 1968) (cited by [[w.barrett-uncertain-warriors]], 109 n.4a). Names: Thurmond.'
      tags:
      - name:thurmond-strom
      src:
        c: 0b4e8aad
        rows:
        - 'w.barrett-uncertain-warriors 109: all'
- add:
    entry:
      id: cal.1968-03-05.vietnam-205000-2
      when: Mar. 5
      date: '1968-03-05'
      thread: vietnam-205000
      c: 'The Tuesday group. Johnson to Rusk: "What about that suggestion of last night?" Rusk reads a statement Johnson might
        use in his speech: "The President has directed that U.S. bombing attacks on North Vietnam be limited to those areas
        which are integrally related with the battlefield. ... Whether this stage can be a step toward peace is for Hanoi
        to determine." If Hanoi does not respond, "we could resume it."'
      n: '[FRUS 1964–68, VI, doc. 105](https://history.state.gov/historicaldocuments/frus1964-68v06/d105). [[w.barrett-uncertain-warriors]], 133–34. To check: Tom Johnson''s notes, Mar. 6, 1968, box 2; statement with Rusk''s
        name at the bottom, Mar. 5, 1968, in file: Vietnam, March 19, 1970, "Decision to Halt Bombing, 1967, 1968," tab V,
        box 127, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 134 n.79a). See [[cal.1968-03-04.vietnam]]. Names:
        Johnson, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      src:
        c: 600a58ad
        rows:
        - 'w.barrett-uncertain-warriors 133–34: all'
- add:
    entry:
      id: cal.1968-03-07.vietnam-205000-2
      when: Mar. 7
      date: '1968-03-07'
      thread: vietnam-205000
      c: 'State''s compilation for Johnson, at his request: "Alternative Policies of Key U.S. Public Figures and Organizations."
        Legislators, editorialists of *Time*, *Life* and *Newsweek*, and a Republican proposal, among others; many favor some
        gradual disengagement.'
      n: '[[w.barrett-uncertain-warriors]], 140. To check: Document prepared by the Department of State, Mar. 7, 1968, file:
        March 31 speech, vol. 4, NSC file: NSC history, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 140 n.98a).
        Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: 6d7990b2
        rows:
        - 'w.barrett-uncertain-warriors 140: all'
- add:
    entry:
      id: cal.1968-03-15.vietnam-diplomacy
      when: Mar. 15
      date: '1968-03-15'
      thread: vietnam-diplomacy
      c: Norman Cousins with Johnson, an hour and 45 minutes, on ways to reach out diplomatically to North Vietnam. By Cousins's
        account to Edgar Berman, he urged Johnson to use Humphrey as his emissary to meet North Vietnamese representatives
        anywhere suitable.
      n: '[[w.barrett-uncertain-warriors]], 140. To check: Christian notes, 1968, box 1, Papers of George Christian, LBJ Library,
        a partial account; Berman to Humphrey, Mar. 19, 1968, Berman memos to VP, 1968 (cited by [[w.barrett-uncertain-warriors]],
        140 n.99a). Names: Cousins, Johnson, Humphrey.'
      tags:
      - name:cousins-norman
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      src:
        c: da95dcf4
        rows:
        - 'w.barrett-uncertain-warriors 140: all'
- add:
    entry:
      id: cal.1968-03-16.vietnam-205000-3
      when: Mar. 16
      date: '1968-03-16'
      thread: vietnam-205000
      c: 'Rostow to Johnson: "I have translated the Acheson idea into [a] draft directive for the team leader." Vance, Taylor
        or Acheson to head the review, to report by May.'
      n: '[[w.barrett-uncertain-warriors]], 141. To check: Rostow to Johnson, Mar. 16, 1968, file: March 31 speech, vol. 4,
        NS file, NSC history, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 141 n.101a). Names: Rostow, Johnson,
        Acheson, Vance, Taylor.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:acheson-dean-g
      - name:vance-cyrus
      - name:taylor-maxwell
      src:
        c: 3ea424f8
        rows:
        - 'w.barrett-uncertain-warriors 141: all'
- add:
    entry:
      id: cal.1968-03-20.vietnam-205000-5
      when: Mar. 20
      date: '1968-03-20'
      thread: vietnam-205000
      c: 'Goldberg alone with Johnson, to press the complete bombing halt as a path to negotiations. Goldberg, later: the
        meeting "very pleasant"; Johnson "had read my memoranda thoughtfully, and ... many aspects of it made sense." Johnson
        asks him to a Tuesday group session that day and to the Wise Men''s meetings of Mar. 25 and 26.'
      n: '[[w.barrett-uncertain-warriors]], 142. Names: Goldberg, Johnson. Check: the day; Barrett: "that same day" as Bunker''s reply, and a Tuesday Group session, but Mar. 20 was a Wednesday.'
      tags:
      - name:goldberg-arthur-j
      - name:johnson-lyndon-b
      src:
        c: 657799f4
        rows:
        - 'w.barrett-uncertain-warriors 142: all'
- add:
    entry:
      id: cal.1968-03-28.vietnam-205000
      when: Mar. 28
      date: '1968-03-28'
      thread: vietnam-205000
      c: 'After the night meeting on the speech, Rusk shows Johnson, alone, a cable he has drafted for Bunker; Johnson approves
        it. "We are now thinking in terms of an early policy announcement that would have the following major elements": the
        bombing limitation; 13,500 support forces besides the emergency troops of February; the South Vietnamese government
        and military made more effective; the U.S. budget deficit reduced. Bunker to secure, if possible, the South Vietnamese
        government''s agreement. Rusk: a good chance Hanoi will denounce the offer; if no positive reaction in the following
        weeks, the bombing might be resumed.'
      n: '[[w.barrett-uncertain-warriors]], 154. To check: Rusk to Bunker, Mar. 28, 1968, file: March 31 speech, vol. 4, NS
        file, NSC history, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 154 n.142a). See [[cal.1968-03-28.vietnam]].
        Names: Rusk, Johnson, Bunker.'
      tags:
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:bunker-ellsworth
      src:
        c: 7f233681
        rows:
        - 'w.barrett-uncertain-warriors 154: all'
