      date: '1967-03-29'
      thread: vietnam-diplomacy
      c: 'Rostow''s agenda for the Tuesday lunch: "the need for us to work systematically" to be prepared for cease-fire negotiations
        "should, by any small chance, the other side respond."'
      n: '[[w.barrett-uncertain-warriors]], 76. To check: Rostow''s agenda for the Tuesday lunch, Mar. 29, 1967, NS files,
        Files of Rostow, box 15, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 76 n.45a). Names: Rostow.'
      tags:
      - name:rostow-walt-w
      src:
        c: f69c8dab
