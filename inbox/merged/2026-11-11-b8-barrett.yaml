    unit: F
    witness: w.barrett-uncertain-warriors
    reads: We seem to be in a sinkhole. We put in more — they match it.
    at: '132'
- cite:
    id: cal.1968-03-06.vietnam
    item: '[[w.barrett-uncertain-warriors]], 134 (the evening of Mar. 6, two and a half hours; no notes known)'
    units: '?'
- check:
    id: cal.1968-03-06.vietnam
    text: 'Check: Barrett, 134, has Fulbright and three other senators.'
- cite:
    id: cal.1968-03-10.vietnam
    item: '[[w.barrett-uncertain-warriors]], 135 (the *Times* of Mar. 10: 206,000 troops considered, the administration "deeply
      divided"; the leak)'
    units: A
- cite:
    id: cal.1968-03-14.vietnam-205000
    item: '[[w.barrett-uncertain-warriors]], 136 (Acheson: "Mr. President, you are being led down the garden path"; his memorandum
      of the day; Barrett''s n.88 gives Mar. 14)'
    units: B
- cite:
    id: cal.1968-03-14.robert-kennedy
    item: '[[w.barrett-uncertain-warriors]], 138 (Kennedy through Clifford: he would stay out of the race if Johnson named
      a commission, its members of Kennedy''s suggestion, to reevaluate the war; Johnson told Clifford to reject it; Sorensen
      reached by an aide; no day)'
    units: A, B
- check:
    id: cal.1968-03-18.vietnam
    text: 'Check: Barrett, 139, quotes Johnson, "We must meet our commitments in the world and in Vietnam. We shall and we
      are going to win!" (the speech not named); Rowe''s memorandum of Mar. 19 protests "your Minnesota speech" ([[cal.1968-03-19.elections-1968-2]]).'
- cite:
    id: cal.1968-03-15.vietnam-205000-2
    item: '[[w.barrett-uncertain-warriors]], 140–41 (Goldberg''s proposal of Mar. 16: stop the bombing "for the limited time
      necessary to determine whether Hanoi will negotiate in good faith"; Rostow forwarded it that day)'
    units: C
- cite:
    id: cal.1968-03-20.vietnam-205000
    item: '[[w.barrett-uncertain-warriors]], 143 (the night of Mar. 20: Johnson with his regular advisers, Humphrey, McGeorge
      Bundy and Fortas; Goldberg for the unilateral halt; Fortas: "I don''t see it")'
    units: D, E
- check:
    id: cal.1968-03-20.vietnam-205000
    text: 'Check: Barrett, 143, puts the meeting "on the night of March 20."'
- cite:
    id: cal.1968-03-22.vietnam-205000
    item: '[[w.barrett-uncertain-warriors]], 145 (Mar. 22: Johnson with essentially the advisory group of Mar. 20; "a dramatic
      shift in public opinion")'
    units: A
- cite:
    id: cal.1968-03-23.vietnam-205000
    item: '[[w.barrett-uncertain-warriors]], 145 (McPherson''s memorandum of Saturday, Mar. 23, a sequence beginning with
      the halt north of the 20th parallel; Johnson to Rostow: "For Rostow, Rusk, Clifford comments at once")'
    units: A, D, E
- cite:
    id: cal.1968-03-25.vietnam
    item: '[[w.barrett-uncertain-warriors]], 147–48 (Wheeler and Abrams alone with Johnson on Mar. 26, almost two hours, before
      the Wise Men; Johnson: "We must have something")'
    units: C
- cite:
    id: cal.1968-03-27.vietnam-205000
    item: '[[w.barrett-uncertain-warriors]], 152 (Mansfield at the White House the evening of Mar. 27, three hours; the tentative
      decision to stop the bombing above the 20th parallel)'
    units: A, B
- cite:
    id: cal.1968-03-29.vietnam-205000
    item: '[[w.barrett-uncertain-warriors]], 152–53 (Russell at the White House the morning of Fri., Mar. 29, shown a version
      of the speech; he advised against any halt without reciprocity)'
    units: A
- cite:
    id: cal.1968-03-28.vietnam
    item: '[[w.barrett-uncertain-warriors]], 153–54 (the advisers meeting without the President on Mar. 28: Clifford, the
      draft "offers nothing"; Rusk produced the bombing-limitation language of the Mar. 5 meeting)'
    units: A, C
- check:
    id: cal.1968-03-28.vietnam
    text: 'Check: Barrett, 153–54, has Rusk produce the bombing-limitation language of the Mar. 5 meeting, after Clifford
      called the draft "a disaster"; the entry has Clifford propose it.'
- cite:
    id: cal.1967-03-16.vietnam-supplemental
    item: '[[w.barrett-uncertain-warriors]], 64–65 (H.R. 7123, "over $12 billion," through the House Mar. 16, 385 to 11; Brown''s amendment against an invasion of the North with ground forces without a declaration of war lost 123 to 2; the eleven against named, 65 n.10)'
    units: '?'
- cite:
    id: cal.1968-03-19.elections-1968-2
    item: '[[w.barrett-uncertain-warriors]], 139 (Rowe: "shocked by the number of calls I have received today in protest against your Minnesota speech"; the middle group "dwindled alarmingly"; for a bombing pause; any troop escalation, "even 30,000," politically harmful)'
    units: '?'
- to-check:
    id: cal.1968-03-19.elections-1968-2
    add:
    - 'Rowe to Johnson, Mar. 19, 1968, Reference file: Vietnam, box 2, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 139 n.95)'
- check:
    id: cal.1968-03-19.elections-1968-2
    text: 'Check: the speech''s day; this entry has Minneapolis on Mar. 17, [[cal.1968-03-18.vietnam]] (Public Papers) Mar. 18.'
