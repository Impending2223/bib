- add:
    entry:
      id: cal.1965-07-21.vietnam-july-decision-2
      when: July 21
      date: '1965-07-21'
      thread: vietnam-july-decision
      c: Busby to Johnson, that night, after the day's meetings. Rusk assessed "the stakes in Vietnam more precisely and convincingly
        than anyone I have heard." Ball "impressively clear-headed ... conscientious, not a critic"; his argument "much more
        sane and sound, and merits respect as such." "What we are considering is not whether we continue a war — but whether
        we start (or have started) a new war. ... The war is ours. We are the participants."
      n: '[[w.barrett-uncertain-warriors]], 53–54. To check: "Impressions, Vietnam Discussions," July 21, 1965, Office of
        files of H. Busby, box 3, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 54 n.138a). See [[cal.1965-07-21.vietnam]].
        Names: Busby, Johnson, Rusk, Ball. Check: whether the same paper as [[cal.1965-07-21.vietnam-support]] (Busby to Johnson, July 21, Vietnam Reference File).'
      tags:
      - name:busby-horace
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:ball-george-w
      src:
        c: 4924d781
        rows:
        - 'w.barrett-uncertain-warriors 53–54: all'
- add:
    entry:
