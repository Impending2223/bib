      when: July 22
      date: '1965-07-22'
      thread: vietnam-july-decision
      c: 'Valenti to Johnson, in a long memorandum after the first days of meetings: "the options are so narrow, and the choices
        are so barren." Johnson not shown it for six months.'
      n: '[[w.barrett-uncertain-warriors]], 57. To check: Valenti to Johnson, July 22, 1965, Office Files of W. House Aides:
        Valenti, 1965–66, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 57 n.144a). Names: Valenti, Johnson.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      src:
        c: 5f406f7d
        rows:
        - 'w.barrett-uncertain-warriors 57: all'
- add:
    entry:
      id: cal.1967-03-22.vietnam
      when: Mar. 22
      date: '1967-03-22'
      thread: vietnam
      c: 'McNamara''s background briefing for the press after Guam: "the three individuals — Prime Minister Ky, General Vien,
        and General Westmoreland — agreed that the war could go on indefinitely unless the military pressure being imposed
        against the enemy forces breaks the will of the North and there is as yet no sign of that." Asked whether he or Westmoreland
        had said the present level of pressure was enough to convince Hanoi it could not win, "I don''t think either of us did."'
      n: '[[w.barrett-uncertain-warriors]], 78–79 (79: Rostow sends Johnson a copy). To check: Sec. McNamara backgrounder briefing, March 22, 1967, Presidential
        Trip to Guam file, NS file: Inter. Meetings and Travel, box 12/13, LBJ Library (cited by [[w.barrett-uncertain-warriors]],
        78 n.52a). See [[cal.1967-03-20.vietnam]]. Names: McNamara, Westmoreland, Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:westmoreland-william
      - name:johnson-lyndon-b
      src:
        c: 89392df7
        rows:
        - 'w.barrett-uncertain-warriors 78–79: all'
