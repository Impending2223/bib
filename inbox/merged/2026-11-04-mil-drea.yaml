    entry:
      id: cal.1965-05-01.latin-america-dominican-republic-3
      when: May 1
      date: '1965-05-01'
      thread: latin-america-dominican-republic
      c: 'The foreign ministers of the American republics set up a five-nation Special Committee and send Mora, the OAS Secretary
        General, to Santo Domingo. Johnson: the OAS "a phantom—they are taking a siesta while this is on fire."'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 298. To check: the sources of 298 n.28 (Drea''s note not read for this
        run). See [[cal.1965-04-30.latin-america]]. Names: Johnson.'
      src:
        c: 5eb71518
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 298: all'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-05-02.latin-america-dominican-republic
      when: May 2
      date: '1965-05-02'
      thread: latin-america-dominican-republic
      c: 'Martin, early morning, to the "highest levels": extremists, "hard core Castro-Communists," dominate the rebels.
        With the President''s approval by telephone, he tells reporters, in his own opinion, that American troops will stay
        to block a Castro-like takeover.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 299. To check: Martin, *Overtaken by Events*, 662; Santo Domingo''s 1224,
        May 1, 1965, State''s 736 and Santo Domingo''s 1258, May 2, 1965, OSD Hist (cited by [[w.drea-mcnamara-clifford-and-the-2011]],
        299 n.33). See [[cal.1965-04-30.latin-america-dominican-republic]]. Names: Martin.'
      src:
        c: 885993b7
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 299: all'
        - 'via x.1965-05-02.santo-domingo-1258-to-state: all'
      tags:
      - name:martin-john-bartlow
- add:
    entry:
      id: cal.1965-05-02.latin-america-dominican-republic-2
      when: May 2
      date: '1965-05-02'
      thread: latin-america-dominican-republic
      c: 'Vance puts the field commanders'' courses of action to the President''s advisers; Wheeler for the second, a corridor
        linking the Marines and the paratroops. Johnson approves late in the day, the advance not before midnight, McNamara
        against a Sunday operation. The Chiefs'' order: "any time after midnight 2/3 May."'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 303–04. To check: the talking paper for the Chairman, "Alternative Courses
        of Action in the Dominican Republic," May 2, 1965, SecDef Subject Decimal files, Acc 70A-1265 (cited by [[w.drea-mcnamara-clifford-and-the-2011]],
        303 n.49); JCS 1251 to CINCLANT, May 2, 1965 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 304 n.51). See [[cal.1965-05-02.latin-america]].
        Names: Vance, Wheeler, Johnson, McNamara.'
      src:
        c: b22efa94
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 303–04: all'
        - 'via x.1965-05-02.talking-paper-cjcs-alternative-courses: A-B'
        - 'via x.1965-05-02.jcs-1251-to-cinclant: D'
      tags:
      - name:vance-cyrus
      - name:wheeler-earle
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
