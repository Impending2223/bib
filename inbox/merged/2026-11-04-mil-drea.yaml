      tags:
      - name:imbert-barrera-antonio
- add:
    entry:
      id: cal.1965-05-23.latin-america-dominican-republic
      when: May 23
      date: '1965-05-23'
      thread: latin-america-dominican-republic
      c: 'The Inter-American Force set up in Santo Domingo, Brazil to name its commander (asked May 22). Vance and Palmer
        agree: one Marine battalion afloat may leave, another withdraw to the ships when the Brazilians arrive. American strength
        had peaked May 17: 23,889.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 310–11 (the peak, 311, from "an official study"). Renamed the Inter-American
        Peace Force June 2 (Drea, 310). See [[cal.1965-05-06.latin-america]]. Names: Vance, Palmer.'
      src:
        c: e71ceb2d
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 310–11: all'
      tags:
      - name:vance-cyrus
      - name:palmer-bruce-jr
- add:
    entry:
      id: cal.1965-05-26.latin-america-dominican-republic
      when: May 26
      date: '1965-05-26'
      thread: latin-america-dominican-republic
      c: 'The withdrawals begin: Vance relays McNamaras order to take out 1,600 American troops.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 311. To check: McNamara to Califano, May 24, 1965; Vance before Foreign
        Relations, July 14, 1965, 6–8 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 311 n.73). The Chiefs plan of May
        27 in [[cal.1965-05-27.latin-america-dominican-republic]]. See [[cal.1965-05-23.latin-america-dominican-republic]].
        Names: Vance, McNamara, Palmer.'
      src:
