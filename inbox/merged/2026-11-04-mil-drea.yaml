- add:
    entry:
      id: cal.1968-01-29.japan-and-korea-pueblo
      when: Jan. 29
      date: '1968-01-29'
      thread: japan-and-korea-pueblo
      c: 'The advisory group on the *Pueblo* at noon: Ball, McGeorge Bundy, Lodge, Vance and Taylor, with Rusk, Katzenbach,
        Helms and Rostow. No further diplomatic or military moves beyond those under way. Their report convinces the President
        against the military alternatives, but for the buildup of aircraft.'
      n: '[FRUS 1964–68, XXIX, pt. 1: Korea, doc. 242](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d242)
        (A-B). [[w.drea-mcnamara-clifford-and-the-2011]], 490 (C). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). To check:
        Tom Johnson''s notes of the President''s luncheon with the senior advisers, Jan. 29, 1968, FRUS 1964–68, XXIX, pt.
        1, 565–68 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 490 n.20). See [[cal.1968-01-24.japan-and-korea-pueblo-2]].
        Names: Ball, McGeorge Bundy, Lodge, Vance, Taylor, Rusk, Katzenbach, Helms, Rostow.'
      src:
        c: 2d7c909b
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v29p1/d242: A-B'
        - 'w.drea-mcnamara-clifford-and-the-2011 490: C'
        - 'via x.1968-01-29.rostow-report-advisory-group: A-B'
      tags:
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:lodge-henry-cabot
      - name:vance-cyrus
      - name:taylor-maxwell
      - name:rusk-dean
