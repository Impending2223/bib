      id: cal.1965-04-27.latin-america-dominican-republic
      when: Apr. 27
      date: '1965-04-27'
      thread: latin-america-dominican-republic
      c: 'Santo Domingo. Before dawn, armed rebels at the Embajador Hotel, the embassy''s point for evacuees, line Americans
        against a wall and fire into the air; no one hurt. Johnson orders the evacuation: 1,176 Americans and other foreigners
        leave that day through Haina, 10 miles west. Bennett back by helicopter, in charge at 1 p.m.'
      n: '[FRUS 1964–68, XXXII: Dominican Republic; Cuba; Haiti; Guyana, doc. 99](https://history.state.gov/historicaldocuments/frus1964-68v32/d99)
        (the evacuation: 1,176 by Haina). [[w.drea-mcnamara-clifford-and-the-2011]], 293. To check: State''s 645 to Santo
        Domingo, Apr. 27, 1965, NSC History Dominican Crisis 1965, NSF, LBJ Library; JCS 9840 to CINCLANT, Apr. 27 (cited
        by [[w.drea-mcnamara-clifford-and-the-2011]], 293 n.9). See [[cal.1965-04-25.latin-america-dominican-republic]]. Names:
        Johnson, Bennett.'
      src:
        c: 011c7d9c
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d99: D'
        - 'w.drea-mcnamara-clifford-and-the-2011 293: all'
        - 'via x.1965-05-26.mcnamara-to-president-dominican-withdrawal: D'
        - 'via x.1965-04-27.state-645-to-santo-domingo: D'
        - 'via x.1965-04-27.jcs-9840-to-cinclant: D'
      tags:
      - name:johnson-lyndon-b
      - name:bennett-w-tapley-jr
- add:
    entry:
      id: cal.1965-04-29.latin-america-dominican-republic-3
      when: Apr. 29
      date: '1965-04-29'
      thread: latin-america-dominican-republic
      c: 'The White House, 7:30 p.m., after the conference call with Bennett ("mad dogs"): a pro-communist government a threat
        to the hemisphere, Americans still in danger; a cease-fire, an interim government and free elections sought. 2,500
        paratroops to land at San Isidro.'
      n: '[FRUS 1964–68, XXXII: Dominican Republic; Cuba; Haiti; Guyana, doc. 41](https://history.state.gov/historicaldocuments/frus1964-68v32/d41)
        (the teleconference, 2240Z: "we are dealing with mad dogs now as regards leftist forces"). [[w.drea-mcnamara-clifford-and-the-2011]],
        295–96. Wheeler then tells CINCLANT, who diverts the aircraft to San Isidro about 9:30 p.m.; two more battalions loading
        (Drea, 296). To check: Valenti''s notes, meeting in the Cabinet Room, Apr. 29, 1965, 7:15 p.m., Office of the President
        File, LBJ Library; CINCLANT to CJTF 122, 300230Z Apr. 1965, NSF, LBJ Library, the diversion (cited by [[w.drea-mcnamara-clifford-and-the-2011]],
        296 n.20). See [[cal.1965-04-29.latin-america-dominican-republic-2]]. Names: Bennett.'
      src:
        c: 2e2b35ce
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d41: A'
        - 'w.drea-mcnamara-clifford-and-the-2011 295–96: all'
        - 'via x.1965-04-29.teleconference-state-santo-domingo: A'
        - 'via x.1965-04-29.valenti-notes-cabinet-room-715: all'
      tags:
      - name:bennett-w-tapley-jr
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-04-30.latin-america-dominican-republic-2
      when: Apr. 30
      date: '1965-04-30'
      thread: latin-america-dominican-republic
      c: 'McNamara tells the Joint Chiefs at their 2 p.m. meeting of the President''s decision: the 4th Marine Expeditionary
        Brigade and the whole 82d Airborne Division alerted for the Dominican Republic, the 101st in reserve. Wheeler: the
        President would do whatever was needed to prevent another Cuba.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 297. To check: JCS 1095 and 1113 to CINCLANT, Apr. 30, 1965; Poole, *JCS
        and National Policy, 1965–68*, pt. 2, 460 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 297 n.25). See [[cal.1965-04-30.latin-america-dominican-republic]].
        Names: McNamara, Wheeler.'
      src:
        c: 2a7e0e6e
        rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 297: all'
        - 'via x.1965-04-30.jcs-1095-1113-to-cinclant: A'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
- add:
    entry:
      id: cal.1965-04-30.latin-america-dominican-republic-3
      when: Apr. 30
      date: '1965-04-30'
      thread: latin-america-dominican-republic
      c: Santo Domingo. Late afternoon, the factions agree to a cease-fire worked out by the papal nuncio and the OAS. Palmer,
        newly in command, cannot accept its terms.
      n: '[FRUS 1964–68, XXXII: Dominican Republic; Cuba; Haiti; Guyana, doc. 99](https://history.state.gov/historicaldocuments/frus1964-68v32/d99)
        (the cease-fire signed at 5:30 p.m.; sniping after it). [[w.drea-mcnamara-clifford-and-the-2011]], 301. To check:
        WSEG, "Dominican Crisis," 292–93; Yates, "Power Pack," 52 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 301
        n.38). Check: Drea names "the OAS Special Committee"; the committee was set up May 1 (Drea, 298). See [[cal.1965-04-30.latin-america]].
        Names: Palmer.'
      src:
        c: 6dde0d1a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d99: B'
        - 'w.drea-mcnamara-clifford-and-the-2011 301: all'
        - 'via x.1965-05-26.mcnamara-to-president-dominican-withdrawal: B'
        - 'via x.1966-08-16.wseg-dominican-crisis-1965: all'
      tags:
      - name:palmer-bruce-jr
- add:
    entry:
      id: cal.1965-05-01.latin-america-dominican-republic-2
      when: May 1
      date: '1965-05-01'
      thread: latin-america-dominican-republic
      c: Santo Domingo. The Marines set up the international security zone, some three square miles in the southwest of the
        city, the embassy and the Embajador within it. The paratroopers, from San Isidro, move west about 10 a.m., take the
        Duarte Bridge over the Ozama, and hold a bridgehead on the west bank. Firefights; Caamaño protests. Moorer becomes
        CINCLANT.
      n: '[FRUS 1964–68, XXXII: Dominican Republic; Cuba; Haiti; Guyana, doc. 99](https://history.state.gov/historicaldocuments/frus1964-68v32/d99)
        (the zone set up May 1). [[w.drea-mcnamara-clifford-and-the-2011]], 298, 301–03. Check: McNamara''s memorandum has
        400 Army troops landing late May 1 and 1,600 early May 2 securing San Isidro, the Duarte Bridge and part of the east
        bank. Palmer to the NMCC, 4:45 a.m.: no "offensive action" that might void the cease-fire (Drea, 301). To check: "Military
        Operations in the Dominican Republic—An Overview," about July 12, 1965, 5, SecDef Subject Decimal files, Acc 70A-1266
        (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 298 n.29); Santo Domingo''s 1217, May 1, 1965; the Palmer interview
        by Gittinger, May 28, 1982, LBJ Library (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 301 n.40). See [[cal.1965-04-30.latin-america-dominican-republic-2]].
        Names: Caamaño, Moorer.'
      src:
        c: ac9af658
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d99: B'
        - 'w.drea-mcnamara-clifford-and-the-2011 298, 301–03: all'
        - 'via x.1965-05-26.mcnamara-to-president-dominican-withdrawal: B'
        - 'via x.1965-07-12.military-operations-dominican-overview: B-C'
        - 'via x.1982-05-28.palmer-interview-gittinger: C-E'
      tags:
      - name:caamano-deno-francisco
      - name:moorer-thomas
      - name:palmer-bruce-jr
