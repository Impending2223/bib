    entry:
      id: cal.1965-04-26.latin-america-dominican-republic
      when: Apr. 26
      date: '1965-04-26'
      thread: latin-america-dominican-republic
      c: The naval squadron off Santo Domingo by midafternoon. The Joint Chiefs put two battalions of the 82d Airborne Division
        and their aircraft on a higher alert. Johnson, briefed about midday, McNamara among those present, sends Bennett back
        to Santo Domingo.
      n: '[FRUS 1964–68, XXXII: Dominican Republic; Cuba; Haiti; Guyana, doc. 99](https://history.state.gov/historicaldocuments/frus1964-68v32/d99)
        (two battalions of the 82d alerted). [[w.drea-mcnamara-clifford-and-the-2011]], 292–93. To check: JCS 9802 to CINCLANT
        et al., Apr. 26, 1965, OSD Hist; WSEG, "Dominican Crisis," 36, citing the NMCC''s emergency action tapes of Apr. 26
        (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 293 n.12); Santo Domingo''s 1071, Apr. 26, 1965, OSD Hist (cited
        by [[w.drea-mcnamara-clifford-and-the-2011]], 292 n.6). See [[cal.1965-04-25.latin-america-dominican-republic]]. Names:
        Johnson, McNamara, Bennett.'
      src:
        c: 18fa2403
        rows:
