      when: May 15
      date: '1965-05-15'
      thread: latin-america-dominican-republic
      c: Imbert's loyalists open an offensive that slowly pushes back the rebels' outposts in the north of the capital.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 308. See [[cal.1965-05-03.latin-america-dominican-republic]]. Names:
        Imbert.'
