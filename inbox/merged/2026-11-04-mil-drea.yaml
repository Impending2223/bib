        - 'w.drea-mcnamara-clifford-and-the-2011 292–93: all'
        - 'via x.1965-05-26.mcnamara-to-president-dominican-withdrawal: B'
        - 'via x.1965-04-26.jcs-9802-to-cinclant: B'
        - 'via x.1966-08-16.wseg-dominican-crisis-1965: all'
        - 'via x.1965-04-26.santo-domingo-1071-to-state: C'
      tags:
