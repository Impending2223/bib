      when: June 9
      date: '1967-06-09'
      thread: middle-east-six-day-war
      c: 'The Special Committee: shipments already in the pipeline to Saudi Arabia and Israel to go on. The White House extends
        the embargo to Jordan and Lebanon.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 446. To check: [Notes of the Special Committee, June 9, 1967, FRUS 1964–68,
        XIX: Arab-Israeli Crisis and War, 1967, doc. 236](https://history.state.gov/historicaldocuments/frus1964-68v19/d236),
