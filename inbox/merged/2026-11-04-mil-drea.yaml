- add:
    entry:
      id: cal.1967-06-10.middle-east-six-day-war
      when: June 10
      date: '1967-06-10'
      thread: middle-east-six-day-war
      also:
      - soviet-union
      c: 'Kosygin to Johnson on the hot line, 8:48 a.m.: unless military actions stop "in the next few hours," an "independent
        decision," including military, though it might "bring us into a clash." Johnson, in the Situation Room, answers that
        Washington is pressing Israel to honor the cease-fire; Kosygin within five minutes: the Israelis advancing on Damascus.
        McNamara asks whether the Sixth Fleet should move east; all agree.'
      n: '[FRUS 1964–68, XIX: Arab-Israeli Crisis and War, 1967, doc. 243](https://history.state.gov/historicaldocuments/frus1964-68v19/d243)
        (A). [[w.drea-mcnamara-clifford-and-the-2011]], 447–48 (the exchange; the Sixth Fleet). Nineteen messages over the
        hot line June 5–10 (Drea, 441). Made public: FRUS 1964–68, XIX (2004). See [[cal.1967-06-09.middle-east]]. Names:
        Kosygin, Johnson, McNamara.'
      src:
        c: 42b28c31
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v19/d243: A'
        - 'w.drea-mcnamara-clifford-and-the-2011 447–48: all'
        - 'via x.1967-06-10.kosygin-to-johnson-hot-line: A'
      tags:
      - name:kosygin-aleksei-n
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-06-10.middle-east-six-day-war-2
      when: June 10
      date: '1967-06-10'
      thread: middle-east-six-day-war
      c: 'The Joint Chiefs to Lemnitzer, 1522Z, JCS 7628, "Sixth Fleet Movement": the Soviets having declared the possible
        use of force against Israel, Task Groups 60.1 and 60.2 to steam at moderate speed toward 33° N, 33° E, no farther
        east or south unless directed. Precautionary.'
      n: '[FRUS 1964–68, XIX: Arab-Israeli Crisis and War, 1967, doc. 253](https://history.state.gov/historicaldocuments/frus1964-68v19/d253).
        [[w.drea-mcnamara-clifford-and-the-2011]], 447–48 (the fleet eastward; the Soviet submarines shadowing it). Made public:
        FRUS 1964–68, XIX (2004). See [[cal.1967-06-10.middle-east-six-day-war]]. Names: Lemnitzer.'
      src:
        c: '76335850'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v19/d253: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 447–48: all'
        - 'via x.1967-06-10.jcs-7628-sixth-fleet-movement: all'
      tags:
      - name:lemnitzer-lyman-l
