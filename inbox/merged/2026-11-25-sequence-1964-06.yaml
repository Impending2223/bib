- edit:
    id: cal.1964-06-05.civil-rights-organizations
    base: 411792c3
    set:
      n: '[[w.whalen-longest-debate]], 192. After [[cal.1964-06-05.republican-party-congress|Hickenlooper''s terms]], "later that evening," in Whalen''s sequence (192). To check: Mitchell to Wilkins, June 5, 1964, NAACP Papers, Library of Congress (cited by [[w.whalen-longest-debate]], 267). Names: Clarence Mitchell, Wilkins.'
- edit:
    id: cal.1964-06-06.civil-rights-bill
    base: b96f01dc
    set:
      n: '[[w.whalen-longest-debate]], 193; [[w.purdum-idea-whose-time-has-2014]], 297 (Saturday, June 6: Russell remonstrates with Humphrey for agreeing to Hickenlooper''s demands while refusing his own; Humphrey: "Well, Dick, you haven''t any votes to give us on cloture and these fellows do" (the note: Humphrey''s memorandum, in Loevy, 91)). After [[cal.1964-06-06.civil-rights-bill-2|the agreement to vote on Hickenlooper''s amendments]], that morning on the floor, in Purdum''s sequence (297). To check: Humphrey, memorandum on H.R. 7152, undated, 21 pp., Legislative Files, 1961–1964, Senatorial Files, Humphrey Papers, Minnesota Historical Society (cited by [[w.whalen-longest-debate]], 267). See [[cal.1964-06-05.republican-party-congress]]. Names: Russell, Humphrey, Hickenlooper.'
- edit:
    id: cal.1964-06-07.china-leadership-6
    base: 949c401e
    set:
      n: '[[w.peng-zhen-nianpu-1902]], IV, 336. The words: 当晚 (IV, 336). After [[cal.1964-06-07.china-leadership-5|the welcoming meeting]]: the dinner "that evening" (当晚), in the nianpu''s sequence (IV, 336). Names: Peng Zhen.'
- edit:
    id: cal.1964-06-08.china-leadership-5
    base: c9489dc4
    set:
      n: '[[w.yang-shangkun-riji]], II, 382 (June 8, 1964). The words: 晚8时到9时，去富春同志处了解常委开会情况 (II, 382). After [[cal.1964-06-08.china-leadership|the Standing Committee''s meeting]] of the day, which Yang went to learn of (II, 382). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Li Fuchun.'
- edit:
    id: cal.1964-06-09.china-leadership-2
    base: 61ca4846
    set:
      n: '[[w.zhou-enlai-nianpu-1949]], II, 646 (June 9, 1964); [[w.zhou-enlai-waijiao-huodong]], 409 (June 9, 1964; 参加中国和也门友好条约签字仪式; 晚上, 人民大会堂, 萨拉勒元帅举行的盛大宴会); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 341 (June 9, 1964, the book''s day for the joint communique of Liu and Sallal; and the day of Zhou''s speech at the reception given by Sallal: the one effective way to settle the Laos question is an international conference of the states attending the Geneva conference; any attempt to exclude some of the participants or any of the three Lao sides is against the spirit of the Geneva agreement and cannot solve the question); [[w.zhu-de-nianpu-xinbian]], III, 1910 (June 9, 1964; Zhu De 朱德 at the signing of the treaty of friendship and of the joint communique of Liu Shaoqi 刘少奇 and President Abdullah al-Sallal 阿卜杜拉·萨拉勒). After [[cal.1964-06-09.china-leadership-6|the Standing Committee''s decision]] that Liu Shaoqi sign the treaty, in the Zhu De nianpu''s sequence (III, 1910). Names: Zhou Enlai, Sallal.'
- edit:
    id: cal.1964-06-09.program-2
    base: 96aa744a
    set:
      n: '[[w.johnson-white-house-diary]], 160 (Lady Bird Johnson''s account). After [[cal.1964-06-09.program|the baccalaureate]]: she left about 3:30, in Mrs. Johnson''s sequence (160). Names: Lady Bird Johnson.'
- edit:
    id: cal.1964-06-09.europe-and-the-alliance
    base: 5fbbcbd4
    set:
      n: '[[w.johnson-white-house-diary]], 160–62 (Lady Bird Johnson''s account). After [[cal.1964-06-09.program-2|Mrs. Johnson''s walk at the Library site]] and her flight back, "the next event of the day," in her sequence (160). Names: Johnson, Lady Bird Johnson, Krag.'
- edit:
    id: cal.1964-06-10.civil-rights-bill-10
    base: f4b24554
    set:
      n: '[[w.risen-bill-of-the-century]], 227 (the speech, thirty minutes; the words in part). After [[cal.1964-06-10.civil-rights-bill-9|Mansfield]], who ceded him the floor; Dirksen after him, then the roll, in Risen''s sequence (227). To check: 110 Cong. Rec. 12855–68 (1964) (cited by [[w.risen-bill-of-the-century]], 227 n.14). See [[cal.1964-06-10.civil-rights-bill-9]]. Names: Russell.'
- edit:
    id: cal.1964-06-10.civil-rights-bill
    base: 14f6ae37
    set:
      n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt10/pdf/GPO-CRECB-1964-pt10-6-2.pdf) (1964). [Cloture and Final Passage of the Civil Rights Act of 1964](https://www.senate.gov/legislative/landmark-legislation/civil-rights-act-of-1964/cloture-and-final-passage-of-the-civil-rights-act-of-1964-essay.htm) (Senate Historical Office). [[w.dallek-flawed-giant]], 119 (Dirksen''s words); [[w.branch-pillar-of-fire]], 334–37; [[w.humphrey-education-of-a-public-1976]], 282–83 (the seventy-fifth day; Dirksen''s words; 71 to 29); [[w.solberg-hubert-humphrey]], 226 (cloture, 71–29; Engle; Hayden in the cloakroom); [[w.kabaservice-rule-and-ruin]], 98, 101 (Goldwater one of the six Republicans against; Dirksen''s words; 27 of the 33 Republicans for); [[w.sundquist-politics-and-policy]], 269–70 (the vote, 71–29; Dirksen''s words); [[w.mann-walls-of-jericho]], 423–27 (the vote; Byrd''s 14 hours 13 minutes; Dirksen''s words; Morton''s amendment, 51–48); [[w.califano-triumph-and-tragedy-of]], 54 (Engle, dying of a brain tumor, wheeled in, to signal his vote by pointing to his eye); [[w.kotz-judgment-days]], 151–52 (Engle wheeled in; Williams the sixty-seventh; Hayden no; 71–29); [[w.goldberg-barry-goldwater]], 196 (Goldwater against cloture, on Kitchel''s advice, with Bork''s seventy-five-page critique; his amendments to strike public accommodations and fair employment); [[w.zelizer-fierce-urgency-of-now]], 125–27 (Byrd''s 14 hours 13 minutes, from 7:38 p.m.; Dirksen; 71–29, Republicans 27–6); [[w.bernstein-guns-or-butter]], 75–76 (71 to 29, 44 Democrats and 27 Republicans for; Byrd''s "mini-filibuster" of June 9); [[w.whalen-longest-debate]], 195, 197–200 (Engle''s gesture; Williams the sixty-seventh; Hayden no, the votes in); [[w.young-two-suns-of-the]], 95 (Goldwater against cloture, June 10); [[w.caro-passage-of-power]], 568 (cloture 71–29, June 10, after a filibuster of fifty-seven days, the longest in Senate history; Democrats 44 for, 23 against; Republicans 27 for, 6 against, Goldwater among them; not Byrd''s speech); [[w.johnson-white-house-diary]], 165–66 (June 11: "Yesterday the Senate had cleared the way for a vote on the Civil Rights Bill, by invoking cloture, with about four votes to spare"; not the count, Byrd or Dirksen); [[w.albert-little-giant-1990]], 286 (the Senate votes cloture, 71 to 29, four above two-thirds, after a three-month southern filibuster; not the day or the party divisions); [[w.risen-bill-of-the-century]], 224–25, 227–29 (Morton''s amendment, jury trials for all criminal contempt but under Title I, adopted Tuesday 51 to 48, 224–25; cloture, 71 to 29, 44 Democrats and 27 Republicans for, 23 and 6 against, the first on a civil rights measure; Byrd''s fourteen hours thirteen minutes; Dirksen, up at 5 a.m. at Broad Run, his speech, cut off by Metcalf; Engle wheeled in, his finger to his eye, Kuchel''s request; all 100 senators present; 534 hours 1 minute 51 seconds of debate in seventy-five days; O''Brien: "like the home team winning the Super Bowl"); [[w.purdum-idea-whose-time-has-2014]], 297–303 (Morton''s amendment adopted the day before, 51–48, jury trials in criminal contempt but for Title I (297–98); Byrd''s speech, fourteen hours and thirteen minutes; Dirksen: "Stronger than all the armies is an idea whose time has come"; Engle''s vote; Williams''s the sixty-seventh; 71–29; not the party counts nor 1917 (the notes: 110 Cong. Rec. 13308–19)). The Senate sat from 10 a.m. (its order of June 8) to 5:15 p.m.: [Daily Digest, D263](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=261), [D267](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=265). Check: Solberg dates it June 9 (226). Humphrey''s count that morning: [[cal.1964-06-10.civil-rights-bill-6]]. After [[cal.1964-06-10.civil-rights-bill-10|Russell''s last speech]]: Mansfield, Russell, Dirksen, then the roll, in Risen''s sequence (227). To check: [[w.finley-delaying-the-dream]]; [[w.macneil-dirksen]]. See [[cal.1964-02-10.civil-rights-bill]]. Names: Byrd, Dirksen, Morton. Check: the page.'
- edit:
