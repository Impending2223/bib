    set:
      n: '[[w.johnson-white-house-diary]], 164–65 (Lady Bird Johnson''s account; guests as she recognized them). After [[cal.1964-06-10.program|the medals]]: "Congratulations over," in Mrs. Johnson''s sequence (164). Names: Lippmann, Oppenheimer, Seaborg, Shepard, Lady Bird Johnson.'
- edit:
