- edit:
    id: cal.1964-06-15.elections-1964-johnson
    base: 09a4ba24
    set:
      n: '[[w.johnson-white-house-diary]], 167–68 (Lady Bird Johnson''s account); [[w.valenti-very-human-president]], 299 (the dinner of June 15 for the Clark Cliffords and the Joe Alsops, Valenti and his wife also; not the wagers or Alsop on the Turks and Greeks). After [[cal.1964-06-15.succession|the Manchester interview]] of the afternoon, in Mrs. Johnson''s sequence (167). Names: Johnson, Alsop, Clifford, Goldwater, Scranton, Inonu, George Papandreou.'
- edit:
    id: cal.1964-06-16.civil-rights-the-executive
    base: 8f341f2f
    set:
      n: '[[w.johnson-white-house-diary]], 171–72 (Lady Bird Johnson''s account). After [[cal.1964-06-16.robert-kennedy|the dinner]]: "After dinner we piled into a car," in Mrs. Johnson''s sequence (171). Names: Johnson, Lady Bird Johnson, Warren, Robert Kennedy.'
