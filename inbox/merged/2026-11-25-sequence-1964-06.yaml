- edit:
    id: cal.1964-06-12.elections-1964-state-conventions-2
    base: 16239a06
    set:
      n: '[[w.white-suite-3505]], 354, 368. After [[cal.1964-06-12.elections-1964|the announcement at Baltimore]]: from Baltimore to Hartford, in White''s sequence (368). Names: Goldwater, Scranton. Check: the days.'
- edit:
    id: cal.1964-06-14.elections-1964-johnson
    base: dc8c65dc
    set:
