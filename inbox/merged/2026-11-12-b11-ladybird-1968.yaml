      id: cal.1968-01-18.crime-and-hijacking
      when: Jan. 18
      date: '1968-01-18'
      thread: crime-and-hijacking
      c: 'The White House, State Dining Room, about 6 p.m. Reception for the Commission on Federal Crime Law: Chief Justice
        Warren, Tom Clark, Governor Pat Brown, the Commission''s Chairman, Ramsey Clark and Senator Ervin among those present.
        Johnson late; he comes "practically in a gallop," apologizes, makes "a brief, terse speech," thanks them for their
        work, and shakes hands with all in the Red Room.'
      n: '[[w.johnson-white-house-diary]], 624 (Lady Bird Johnson''s account). Mrs. Johnson calls Brown "the Chairman of the
        Commission." To check: the Public Papers for the remarks, if any. Names: Johnson, Warren, Tom Clark, Brown, Ramsey
        Clark, Ervin.'
      tags:
      - name:johnson-lyndon-b
