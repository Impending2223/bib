      id: cal.1968-01-17.conservation
      when: Jan. 17
      date: '1968-01-17'
      thread: conservation
      c: 'The White House, the Red Room. First meeting of 1968 of the Beautification Committee, two hours, Mrs. Johnson presiding,
        Walter Washington present. Mrs. Merriweather Post has sent a check for street trees; Stewart Udall reports on Lawrence
        Halprin''s suggestions for Washington, "all costing money." Discussed: Arbor Day, to widen contributions to those
        who can give five dollars; one more trash pickup a week, "if the budget could bear it," and more trash containers;
        the schools, Buchanan above all.'
      n: '[[w.johnson-white-house-diary]], 616–17 (Lady Bird Johnson''s account). The members present are not listed. The
        call at Buchanan School before it: [[cal.1968-01-17.conservation-2]]. Names: Lady Bird Johnson, Walter Washington,
        Udall.'
      tags:
      - name:johnson-lady-bird
      - name:washington-walter-e
      - name:udall-stewart-l
      - city:washington
