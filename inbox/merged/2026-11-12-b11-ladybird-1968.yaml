- add:
    entry:
      id: cal.1968-01-04.elections-1968-johnson
      when: Jan. 4
      date: '1968-01-04'
      thread: elections-1968-johnson
      c: 'LBJ Ranch, after dinner. Johnson, Mrs. Johnson and John and Nellie Connally talk nearly three hours in his bedroom
        on whether he should run. Connally: "You ought to run only if you look forward to being President again"; "You also
        ought not to run just to keep somebody else from being President." Nellie Connally: after a decision not to run, "an
        ephemeral period" of sadness, then "a great wave of relief." Johnson says he feels older and more tired than ten years
        ago. Announcing at the end of the State of the Union Message is raised: it "would negate the whole message." Connally:
        "The only way to answer all of those arguments is to die in office." Mrs. Johnson sees "no hint" that Connally will
        reconsider and run again for Governor.'
      n: '[[w.johnson-white-house-diary]], 611–12 (Lady Bird Johnson''s account). Made public: 1970. Names: Johnson, Connally,
        Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:connally-john
      - name:johnson-lady-bird
      - state:tx
- add:
    entry:
      id: cal.1968-01-17.elections-1968-johnson
      when: Jan. 17
      date: '1968-01-17'
      thread: elections-1968-johnson
      c: 'The White House, about noon. George Christian brings Johnson the draft he had asked of him, from what Johnson had
        told him, announcing that he will not run: "a good statement, very well said." Mrs. Johnson''s own draft, which Johnson
        had asked her for, "seemed feeble"; she brings out the statement she wrote in August 1964 before Atlantic City, and
        Christian reads it. The announcement is not to be in the text of the State of the Union Message; if made, it would
        come at the end: "And now I want to speak to you about a personal matter . . ."'
      n: '[[w.johnson-white-house-diary]], 616 (Lady Bird Johnson''s account). See [[cal.1968-01-17.elections-1968]]. Made
        public: 1970. Names: Johnson, Christian, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:christian-george
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-01-17.elections-1968-johnson-2
      when: Jan. 17
      date: '1968-01-17'
      thread: elections-1968-johnson
      c: 'The White House, about 6:30 p.m. Mrs. Johnson brings Johnson Christian''s draft statement that he will not run,
        to "get it back into Lyndon''s pocket." Johnson, in the door between the Oval Office and his small one, the Congressional
        leaders waiting in the Fish Room: "Well, what do you think? What shall I do?" She: Luci hopes he will not run; Lynda
        hopes he will, her husband going to war; "Me—I don''t know. ... I can''t tell you what to do." Johnson hands her a
        letter from John Connally recommending that he go with the statement that night, because he "would never have a bigger
        audience," before a live audience rather than on television or in the papers, to take the decision out of "a political
        context."'
      n: '[[w.johnson-white-house-diary]], 617–18 (Lady Bird Johnson''s account). The letter is in Mrs. Johnson''s paraphrase;
        that Connally meant the State of the Union was "a noble time" is her reading. Her advice of before, to run "in the
        same state of mind of a man who is becoming a monk" or to announce, she did not repeat: "it was not the place to say
        it again." See [[cal.1968-01-17.elections-1968-johnson]]. Made public: 1970. Names: Johnson, Lady Bird Johnson, Christian,
        Connally.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:christian-george
      - name:connally-john
- add:
