      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: The White House, after the address. Mrs. Johnson talks by telephone with Senator John Sparkman and Ivo Sparkman.
      n: '[[w.johnson-white-house-diary]], 646 (Lady Bird Johnson''s account; nothing of what was said, unless her "they seemed
        stunned but satisfied with his decision," which follows the Browns in the same sentence, takes them in). Made public:
        1970. Names: Lady Bird Johnson, Sparkman.'
