- add:
    entry:
      id: cal.1968-03-10.elections-1968-johnson-2
      when: Mar. 10
      date: '1968-03-10'
      thread: elections-1968-johnson
      c: 'The White House. Mrs. Johnson had asked Johnson: "Suppose someone else were elected President, what could ''Mr.
        X'' do that you could not do?" He: "He could unite the country and start getting some things done. That would last
        about a year, maybe two years." She takes it to be what weighs heaviest on him: whether he can unite the country.'
      n: '[[w.johnson-white-house-diary]], 638 (Lady Bird Johnson''s account; the reading is hers). See [[cal.1968-03-10.elections-1968-johnson]].
        Made public: 1970. Names: Johnson, Lady Bird Johnson. Check: the day; the diary says only that she had asked him "earlier."'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-03-10.elections-1968-humphrey
      when: Mar. 10
      date: '1968-03-10'
      thread: elections-1968-humphrey
      c: 'The White House, evening. Johnson telephones Humphrey. Muriel Humphrey says Humphrey has been "weary and shaken"
        the last few days; Mrs. Johnson hears hurt in his voice at "some of the actions of certain Senators on the Hill."
        Humphrey: "It''s bad, and it''s going to keep on being bad, through the Primaries. I think we might as well brace
        ourselves for more of the same until the middle of June."'
      n: '[[w.johnson-white-house-diary]], 638 (Lady Bird Johnson''s account). Mrs. Johnson reports the call; her "I thought
        there was hurt in his voice" is her reading. See [[cal.1968-03-10.elections-1968-johnson]]. Made public: 1970. Names:
        Johnson, Humphrey, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-03-14.africa
      when: Mar. 14
      date: '1968-03-14'
      thread: africa
      c: The White House, the South Lawn, the morning. The Johnsons welcome Prime Minister Mohamed Haji Ibrahim Egal of Somalia
        and Mrs. Egal; Rusk among those present. Mrs. Johnson notes "the simplicity and straightforwardness" of Egal's speech.
      n: '[[w.johnson-white-house-diary]], 638–39 (Lady Bird Johnson''s account). To check: the Public Papers, the arrival
        remarks. Names: Johnson, Lady Bird Johnson, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
      - city:washington
- add:
    entry:
      id: cal.1968-03-14.africa-2
      when: Mar. 14
      date: '1968-03-14'
      thread: africa
      c: 'The White House, the State Dinner for Egal, 140 guests in the East Room. Before it, in the Yellow Room, talk of
        Humphrey''s trip to Africa; gifts exchanged, Egal: "Mr. President, I can assure your Congress that this didn''t cost
        more than fifty dollars." At dinner Egal tells Mrs. Johnson of the search for oil in Somalia, some fifteen years without
        success. Johnson''s toast praises Egal for lessening the tensions that have "threatened East Africa with the waste
        of war." Egal''s: he rests well knowing the great power of this country is "in the hands of the man now at the helm."'
      n: '[[w.johnson-white-house-diary]], 639–41 (Lady Bird Johnson''s account; the toasts in her words, not the texts).
        To check: the Public Papers, the toasts. Names: Humphrey, Johnson, Lady Bird Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-03-14.women
      when: Mar. 14
      date: '1968-03-14'
      thread: women
      c: The White House, Cabinet Room, 1 p.m. Johnson presents awards to seven Federal Career Women, among them a wildlife
        biologist in Interior, a statistician with the Council of Economic Advisers, a woman in the Office of Civil Rights
        and an air traffic control specialist of the FAA. He speaks, "half-humor and half-earnestness," shakes hands and goes
        within moments; Mrs. Johnson stays to talk with them about their work.
      n: '[[w.johnson-white-house-diary]], 639 (Lady Bird Johnson''s account). The diary does not name the award. To check:
        the Public Papers, remarks on the Federal Women''s Award, Mar. 14, 1968. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-03-14.transition-and-staff
      when: Mar. 14
      date: '1968-03-14'
      thread: transition-and-staff
      c: 'The State Department, about 8 p.m. Good-by reception for Alexander Trowbridge, formerly Secretary of Commerce. Johnson
        stays seven minutes, kisses Nancy Trowbridge, thanks Trowbridge and speaks: Trowbridge "had promised him one thing—he
        wasn''t going to run for President," and "I ought to point out that that was a week ago." Back at the White House
        for the State Dinner a few minutes past 8.'
      n: '[[w.johnson-white-house-diary]], 639 (Lady Bird Johnson''s account). Mrs. Johnson was not present; she "heard" it.
        Johnson''s words in her paraphrase and quotation. See [[cal.1968-03-06.transition-and-staff]]. To check: the Public
        Papers, Mar. 14, 1968. Names: Johnson, Trowbridge.'
      tags:
      - name:johnson-lyndon-b
      - name:trowbridge-alexander-b
      - city:washington
- add:
    entry:
      id: cal.1968-03-17.vietnam-2
      when: Mar. 17
      date: '1968-03-17'
      thread: vietnam
      c: 'LBJ Ranch, driving to St. Barnabas. Mrs. Johnson, on the "rising tide of isolationism," Sweden''s "trial" of the
        United States as "a war criminal" and France''s manipulation of the gold market: when the Vietnam war is settled she
        wants nothing more to do with any foreign country. Johnson: "That''s like saying James Davis'' children have the smallpox,
        and I''m not going to do anything about it."'
      n: '[[w.johnson-white-house-diary]], 641 (Lady Bird Johnson''s account). The Swedish "trial" and the French gold market
        are her description. Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - state:tx
      - polity:fr
- add:
