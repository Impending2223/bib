      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: The White House, after the address. Bill Moyers telephones Johnson; once more Johnson puts Mrs. Johnson on the phone.
      n: '[[w.johnson-white-house-diary]], 646 (Lady Bird Johnson''s account; what was said and the hour are not given). Made
