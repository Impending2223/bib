    item: '[[w.johnson-white-house-diary]], 718–19 (Oct. 8: dinner at Quarters One, Fort Myer: the Westmorelands with Mrs.
      Johnson and Luci, "the four of us," then General and Mrs. Wheeler; "Both the Generals were in civilian clothes"; "Lyndon
      was extremely late. He came in at 9, looking as tired as I have ever seen him"; Johnson on "the great disservice that
      has, somehow, been done to the military ... The glitter is off the stars"; "The three men discussed the Paris peace
