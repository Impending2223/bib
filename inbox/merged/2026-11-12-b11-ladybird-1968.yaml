      when: Mar. 29–30
      date: '1968-03-29'
      thread: elections-1968-johnson
      also:
      - vietnam-205000
      c: Mrs. Johnson spends "a good part of Saturday and part of Friday" making suggestions on Johnson's address of Mar.
        31.
      n: '[[w.johnson-white-house-diary]], 643 (Lady Bird Johnson''s account, written Mar. 31; what she suggested is not given).
        Made public: 1970. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-7
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: 'The White House, the morning, before lunch. Johnson to Arthur and Mathilde Krim and Mrs. Johnson: "What do you think
        about this? This is what I''m going to put at the end of the speech." He reads a statement ending, "Accordingly, I
        shall not seek and I will not accept the nomination of my party for another term as your President." Arthur Krim:
        "You can''t mean this!" Mathilde Krim: "Oh no, no!" All discuss the reasons why and why not, "over and over again."'
      n: '[[w.johnson-white-house-diary]], 643 (Lady Bird Johnson''s account; "sometime during the morning," "I believe it
        was in his bedroom"). Busby was then at work on the speech in the Treaty Room. See [[cal.1968-03-31.elections-1968-3]].
        Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-03-31.elections-1968-mccarthy-2
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-mccarthy
      c: 'The White House, after the address. Abigail McCarthy telephones Mrs. Johnson: "Bird, Bird, you know what I''ve always
        thought of you." And: "When he made the announcement, I could only think of you standing in front of the Wilson portrait
        . . ."'
      n: '[[w.johnson-white-house-diary]], 646 (Lady Bird Johnson''s account). The hour is not given. White has her telephone
        the President that evening, perhaps the same call: [[cal.1968-03-31.elections-1968-9]]. See [[cal.1968-03-31.elections-1968]].
        Made public: 1970. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
