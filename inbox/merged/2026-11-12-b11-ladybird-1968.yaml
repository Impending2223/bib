      date: '1968-03-06'
      thread: democratic-party
      c: The White House, afternoon. Reception for the Democratic State Chairmen; Mrs. Johnson greets them.
      n: '[[w.johnson-white-house-diary]], 635–36 (Lady Bird Johnson''s account). The only mention of it; no host, hour or
        number given. Names: Lady Bird Johnson.'
