- add:
    entry:
      id: cal.1968-01-25.white-house
      when: Jan. 25
      date: '1968-01-25'
      thread: white-house
      c: 'The White House. The first big dinner of 1968, honoring the Vice President, the Speaker and the Chief Justice, 190
        guests, the day of the call-up of the Reservists and the attack at Khe Sanh. As the Johnsons enter the State Dining
        Room "the room burst into spontaneous applause"; in the line a guest murmurs, "We are praying for you." Johnson''s
        toast: there have been times when "check and balance really meant ''stop and freeze''," then people want progress.
        Humphrey, without notes, to "a man who is firm and resolute, strong and kind, and governs with compassion." McCormack
        and Warren (his theme "unity in perilous times") also toast. As Fortas and Alexander Schneider play Mozart on borrowed
        violins, Johnson to Meany: "Do you reckon Abe has a Union card?"'
      n: '[[w.johnson-white-house-diary]], 625–27 (Lady Bird Johnson''s account). Johnson''s toast as Mrs. Johnson paraphrases
        it; the Speaker''s toast and Warren''s theme as she reports them. To check: the toasts, if in the Public Papers. Names:
        Johnson, Humphrey, McCormack, Warren, Fortas, Meany.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:mccormack-john-w
      - name:warren-earl
      - name:fortas-abe
      - name:meany-george
      - city:washington
- add:
    entry:
      id: cal.1968-02-07.middle-east
      when: Feb. 7
      date: '1968-02-07'
      thread: middle-east
      c: 'The White House, Yellow Room, 3 p.m. Mrs. Avraham Harman, leaving with her husband after nine years as Israel''s
        Ambassador, makes her farewell call on Mrs. Johnson: between 60 and 65 percent of the people of Israel are "Oriental"
        Jews; the press in Israel is free and "gives poor Prime Minister Eshkol a great deal of trouble"; on return her husband
        will head the Hebrew University.'
      n: '[[w.johnson-white-house-diary]], 628–29 (Lady Bird Johnson''s account). Mrs. Harman''s words as Mrs. Johnson recalls
        them. Names: Lady Bird Johnson, Harman, Eshkol.'
      tags:
      - name:johnson-lady-bird
      - name:harman-avraham
      - name:eshkol-levi
- add:
    entry:
      id: cal.1968-02-08.europe-and-the-alliance-2
      when: Feb. 8
      date: '1968-02-08'
      thread: europe-and-the-alliance
      c: 'The White House, the State Dinner for Wilson, 150 guests. Wilson had warned Mrs. Johnson that his toast would be
        "quite long and quite serious," and that "Bill Fulbright wouldn''t like it." Johnson''s toast: "The American and British
        peoples are not short-distance crusaders. We are veteran campaigners, not amateurs, and we have never been quitters."
        On the songs: "Mr. Prime Minister, we could compromise and sing a duet. You sing ''God Save the Queen'' and I''ll
        sing ''God Bless America.''" Wilson''s toast backs the San Antonio formula for starting peace talks on Vietnam, tells
        of his explaining Britain''s stand to the Russian leaders in Moscow the month before, promises Britain''s part "both
        in negotiations and reconstruction in Vietnam," and says Johnson''s restraint over the Pueblo "will earn tribute from
        reasoning men everywhere." Robert Merrill sings. After, Johnson goes upstairs for the reports from Vietnam: "I''ve
        got to get back to Khe Sanh."'
      n: '[[w.johnson-white-house-diary]], 630–32 (Lady Bird Johnson''s account; the toasts in her quotation and paraphrase,
        not the texts). Merrill''s songs, "On the Road to Mandalay" and the Gershwin, had been called by the press an insult
        to the British Empire; Wilson sent word they were his favorites (629). To check: the Public Papers, the toasts, Feb.
        8, 1968. See [[cal.1968-02-08.europe-and-the-alliance]]. Names: Wilson, Lady Bird Johnson, Fulbright, Johnson.'
      tags:
      - name:wilson-harold
      - name:johnson-lady-bird
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - polity:uk
      - city:washington
