- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-11
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: 'The White House, after the address. Mrs. Johnson talks by telephone with George and Alice Brown, Oveta Culp Hobby
        with them: "stunned but satisfied with his decision."'
      n: '[[w.johnson-white-house-diary]], 646 (Lady Bird Johnson''s account; "they seemed stunned but satisfied" is her reading).
        The hour is not given. Made public: 1970. Names: Lady Bird Johnson, Hobby.'
      tags:
      - name:johnson-lady-bird
      - name:hobby-oveta-culp
- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-12
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: 'The White House, after the address. Mary Lasker telephones Mrs. Johnson, sounding "as if she were crying": "I know
        it must be the right thing to do, since the President did it."'
      n: '[[w.johnson-white-house-diary]], 646 (Lady Bird Johnson''s account). The hour is not given. Made public: 1970. Names:
        Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-13
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: The White House, the Yellow Room, about 11 p.m. Tom Johnson brings thirty-five reporters; Johnson, "looking as if
        a great load had been taken off his shoulders," makes it clear that his decision is final and that any talk of a draft
        is foolishness.
      n: '[[w.johnson-white-house-diary]], 646 (Lady Bird Johnson''s account; "I believe he made it quite clear"). To check:
        The President''s News Conference, [1968–69 Pub. Papers 476](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=554)
        (Mar. 31, 1968). See [[cal.1968-03-31.elections-1968]]. Names: Tom Johnson, Johnson.'
      tags:
      - name:johnson-tom
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-14
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: 'The White House, the night of the address. Asked through Liz Carpenter by the reporters how she would sum it up,
        Mrs. Johnson: "We have done a lot; there''s a lot left to do in the remaining months; maybe this is the only way to
        get it done."'
      n: '[[w.johnson-white-house-diary]], 646 (Lady Bird Johnson''s account). The hour is not given. Names: Lady Bird Johnson,
        Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
- add:
    entry:
      id: cal.1968-04-05.king-5
      when: Apr. 5
      date: '1968-04-05'
      thread: king
      c: 'Dulles Airport and the plane to Texas. Mrs. Johnson leaves with Stewart Udall on the "Trails of Texas" tour, with
        thirty-eight foreign writers from thirteen European countries, brought by TWA for the "Discover America" program,
        and a contingent of Washington press. Aloft, on the public-address system: "We travel with heavy hearts today, because
        of the tragedy of Dr. King''s death. Every man must look into his own heart, and ask himself if his every word, every
        act, leads toward peace and healing in our country. . . . The greatest tribute we could pay to Dr. King is to bring
        forth from this cruel tragedy some good action on our problems."'
      n: '[[w.johnson-white-house-diary]], 647, 649 (Lady Bird Johnson''s account; the words as she gives them). Clifford,
        the night before, "Let''s wait until morning and see" (648); Johnson, that morning, "still firm" that she should go
        (649). Names: Lady Bird Johnson, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - state:va
- add:
    entry:
      id: cal.1968-04-05.press-and-broadcasting-2
      when: Apr. 5
      date: '1968-04-05'
      thread: press-and-broadcasting
      c: 'Fredericksburg, Tex. First stop of the "Trails of Texas" tour: the town receives Mrs. Johnson, the thirty-eight
        foreign writers and the Washington press, ladies along the street in the costumes of the 1840s and 1850s; orchard
        wagons through the town, its history told in German; the Pioneer Museum.'
      n: '[[w.johnson-white-house-diary]], 649–51 (Lady Bird Johnson''s account). The hour is not given. See [[cal.1968-04-05.king-5]].
        Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:tx
- add:
    entry:
      id: cal.1968-04-05.press-and-broadcasting
      when: Apr. 5
      date: '1968-04-05'
      thread: press-and-broadcasting
      c: 'The LBJ Ranch. Mrs. Johnson, three hours tour guide for the thirty-eight foreign writers and the Washington press
        of the "Trails of Texas" tour: the house, then the pastures by schoolbus, the deer, the family cemetery, the house
        where Johnson was born; "Questions from the foreign press were frequent." Supper in the yard at 6.'
      n: '[[w.johnson-white-house-diary]], 651 (Lady Bird Johnson''s account). On the way from Fredericksburg she heard of
        the rioting in Washington. See [[cal.1968-04-05.press-and-broadcasting-2]]. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1968-04-05.civil-disorders-king-2
      when: Apr. 5
      date: '1968-04-05'
      thread: civil-disorders-king
      c: 'Texas, the evening. A conference call, John Connally with Mrs. Johnson and Liz Carpenter, on her visit to HemisFair
        the next day: he expects disturbances, "probably three demonstrations," one peace-loving and two militant, "a Mexican-American
        group and about fifteen hundred SDS members." He and Nellie Connally will go on with their plans and hope she comes.'
      n: '[[w.johnson-white-house-diary]], 652 (Lady Bird Johnson''s account; Connally''s words in her paraphrase). Her agents
        then ask that she arrive late and ride a minibus; Johnson, by telephone, "thought I should go on to Hemisfair." Names:
        Connally, Lady Bird Johnson, Carpenter.'
      tags:
      - name:connally-john
      - name:johnson-lady-bird
      - name:carpenter-liz
      - state:tx
- add:
    entry:
      id: cal.1968-04-08.conservation
      when: Apr. 8
      date: '1968-04-08'
      thread: conservation
      c: 'Padre Island National Seashore, Texas, about 11 a.m. Dedication into the National Park System before at least ten
        thousand and eighty U.S. and foreign journalists: Bishop Thomas Drury''s invocation; Udall introduces George Hartzog,
        Director of the National Park Service, and Kika de la Garza, in whose district the island now lies; Senator Yarborough
        on its history. Mrs. Johnson: "It takes a dream . . . help from newspapers like the Corpus Christi Caller-Times, surveys
        and legislation" and "a President who recognizes the value of this kind of project. In his years in the White House,
        the President has secured thirty-five new additions to the National Park System, one million acres." She urges those
        in charge of the facilities "to make man''s structures in harmony with nature''s." She unveils the plaque with Hartzog.'
      n: '[[w.johnson-white-house-diary]], 653–55 (Lady Bird Johnson''s account). Her words are the diary''s quotation of
        her speech; the thirty-five additions and the million acres are hers. To check: the Public Papers or the Park Service
        record for the remarks. Names: Lady Bird Johnson, Udall, de la Garza, Yarborough, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - name:de-la-garza-eligio-i
      - name:yarborough-ralph
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1968-04-09.elections-1968-johnson
      when: Apr. 9
      date: '1968-04-09'
      thread: elections-1968-johnson
      c: 'South Texas, on the bus to Goliad with the foreign writers. Zac Lentz, a cattleman, for twenty years one of Johnson''s
        "lieutenants," asked about those years: he is sorry politically, glad personally, that Johnson is not running again.'
      n: '[[w.johnson-white-house-diary]], 656 (Lady Bird Johnson''s account; who asked is not said). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1968-04-09.conservation
      when: Apr. 9
      date: '1968-04-09'
      thread: conservation
      c: 'Goliad, Tex. Dedication of La Bahía, the Presidio and the Chapel of Our Lady of Loretto, as a National Historic
        Landmark: Bishop Drury''s prayer, Congressman Abraham Kazen speaking "with rousing warmth of Lyndon," Udall, Mrs.
        Johnson''s short speech; the landmark plaque unveiled, a cannon fired. The restoration, four years, paid for by Mrs.
        Kathryn Stoner O''Connor; the architect Raiford Stripling shows the artifacts.'
      n: '[[w.johnson-white-house-diary]], 656–58 (Lady Bird Johnson''s account). Hours not given. To check: the National
        Park Service''s landmark record, the day. Names: Lady Bird Johnson, Udall, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - name:johnson-lyndon-b
      - state:tx
      - city:goliad
- add:
    entry:
      id: cal.1968-04-09.vietnam-support
      when: Apr. 9
      date: '1968-04-09'
      thread: vietnam-support
      c: 'Gonzales, Tex., the courthouse square, about 2 p.m. Official farewell of the five-day tour for thirty-eight foreign
        editors. Mrs. Johnson: the visitors "have come at a time of anguish and turmoil in our country ... Behind the smoke
        of our troubled cities there is a great wide land of strength and confidence and warmth." Hector Legge of Dublin,
        for the foreign journalists: "all countries owe a great duty to the American nation ... They made a stand to stop
        the onslaught of communism"; Australia and New Zealand "are supporting the U.S. effort in Vietnam," in danger "but
        for the power of the United States of America." Mrs. Johnson plants a Spanish oak with three garden clubs.'
      n: '[[w.johnson-white-house-diary]], 658–59 (Lady Bird Johnson''s account). Legge''s words as Mrs. Johnson gives them;
        he had said the same to her privately. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:tx
      - city:gonzales
- add:
    entry:
      id: cal.1968-04-09.elections-1968-2
      when: Apr. 9
      date: '1968-04-09'
      thread: elections-1968
      c: 'The plane back to Washington. Stewart Udall to Mrs. Johnson: he and Postmaster General O''Brien had talked about
        the election; he hoped to stay out of it and keep working for conservation. He added that another Cabinet member had
        "reservations about supporting Senator Kennedy, which he did not share." He asks whether the reception for McNamara,
        Gardner and Trowbridge is still on. She senses "a withdrawal of his enthusiasm for the Johnsons" and thinks he may
        leave the Cabinet.'
      n: '[[w.johnson-white-house-diary]], 660 (Lady Bird Johnson''s account). Her paraphrase of Udall; "reservations about
        supporting Senator Kennedy" reads as the page does; the diary does not name the Cabinet member or give a day for the
        reception. Made public: 1970. Names: Udall, Lady Bird Johnson, Robert Kennedy, McNamara, Gardner, Trowbridge, O''Brien.'
      tags:
      - name:udall-stewart-l
      - name:johnson-lady-bird
      - name:kennedy-robert-f
      - name:mcnamara-robert-s
      - name:gardner-john-w
      - name:trowbridge-alexander-b
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-04-11.vietnam-paris-2
      when: Apr. 11
      date: '1968-04-11'
      thread: vietnam-paris
      c: 'The White House, Johnson''s room, at breakfast. Ambassador Bunker with Johnson on the peace talks and the site,
        overheard in part by Mrs. Johnson. Johnson: "This is the most important thing in the world to me." "I am not going
        into any Communist capital. I am not going to run or bend or stretch." "They have got to learn that they are negotiating
        with the United States, Fulbright notwithstanding, and I do not appreciate their conducting negotiations in the press."
        A site should be "neutral, telephones untapped, good communications. I am not going to let them use me." Bunker, wryly:
        the Tet offensive had had more effect here than in Vietnam; the South Vietnamese stood up to it.'
      n: '[[w.johnson-white-house-diary]], 661 (Lady Bird Johnson''s account). Mrs. Johnson "caught phrases"; Johnson''s words
        are as she heard them. Bunker''s remark is her paraphrase, "in his understated way." Made public: 1970. Names: Johnson,
        Bunker, Fulbright, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:bunker-ellsworth
      - name:fulbright-j-william
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-04-11.transition-and-staff
      when: Apr. 11
      date: '1968-04-11'
      thread: transition-and-staff
      c: 'The White House, Yellow Room, about 6 p.m. Farewell party for the McNamaras, the Gardners and the Trowbridges, with
        Lawrence O''Brien, who resigned the day before, added. O''Brien to Mrs. Johnson: "nobody has ever been nicer to me
        than your husband." Johnson, late, speaks and hands Mrs. Johnson the silver trays to present; his speech "a eulogy
        to the quality of the men who leave more comfortable and more remunerative posts to work for their government"; he
        calls Rusk, absent, "the noblest Roman of them all." McNamara: "Once before I tried to express myself about this Administration,
        with disastrous results." Gardner speaks of his gratitude; Trowbridge, "forthright, fresh, and charming"; O''Brien
        on "leaving us to work for Bobby." Most guests leave about 8.'
      n: '[[w.johnson-white-house-diary]], 662–63 (Lady Bird Johnson''s account). The speeches are in Mrs. Johnson''s quotation
        or paraphrase, not texts. Arthur Goldberg and others present. See [[cal.1968-04-10.transition-and-staff]]. To check:
        the Public Papers for the remarks, if printed. Names: Johnson, McNamara, Gardner, Trowbridge, O''Brien, Rusk, Lady
        Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:gardner-john-w
      - name:trowbridge-alexander-b
      - name:obrien-lawrence-f
      - name:rusk-dean
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-04-17.conservation
      when: Apr. 17
      date: '1968-04-17'
      thread: conservation
      c: 'Washington. Mrs. Johnson''s last annual Beautification tour and luncheon: almost two hundred donors and members
        of the Beautification Committee, the Society for a More Beautiful Capital, the Speakers'' Committee and press, coffee
        in the Rose Garden, five buses, more than an hour through the city (Mary Lasker''s ten thousand azaleas on Pennsylvania
        Avenue; the first planting at Independence and Third; playground equipment sent by Mrs. Díaz Ordaz; Buchanan School;
        Columbia Island''s 800,000 daffodil bulbs and 2,400 dogwoods). At the luncheon, over by 3: "the people in this room
        have produced nearly two and a half million dollars" in three years; Walter Washington speaks, "make open spaces and
        recreation facilities a part of the daily living and the daily environment of people."'
      n: '[[w.johnson-white-house-diary]], 665–67 (Lady Bird Johnson''s account). The day is Wednesday, April 17 as the page
        prints it ("April ly"). Mrs. Johnson''s speech and the Mayor''s in her quotation. Names: Lady Bird Johnson, Walter
        Washington.'
      tags:
      - name:johnson-lady-bird
      - name:washington-walter-e
      - city:washington
- add:
    entry:
      id: cal.1968-04-30.white-house
      when: Apr. 30
      date: '1968-04-30'
      thread: white-house
      c: 'The White House, Johnson''s room, 8:30 a.m. Eric Hoffer at breakfast with Johnson. Hoffer: "Why doesn''t the middle
        stand up? We are so scared of the young." On Negroes: "More doors are open than ever were before. There are more opportunities."
        Asked about his job: "I call myself a conversationalist in residence."'
      n: '[[w.johnson-white-house-diary]], 667 (Lady Bird Johnson''s account; she "mostly ... drank my coffee and listened").
        Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-04-30.congress
      when: Apr. 30
      date: '1968-04-30'
      thread: congress
      c: 'The Capitol, Senate Caucus Room, 1 p.m. The Senate Ladies luncheon honoring Mrs. Johnson: nearly a hundred Senate
        wives, many of former Senators. Muriel Humphrey, "terribly weary," tells her she flew, she thinks to Chicago, to a
        charity event for retarded children at the Kennedys'' urging, home at 4:30 a.m., and goes into the hospital for an
        operation after the luncheon. Neither Mrs. Kennedy present, "both out campaigning." The wives have planted a white
        Chinese dogwood for Mrs. Johnson on the Senate side of the Capitol grounds.'
      n: '[[w.johnson-white-house-diary]], 667–68 (Lady Bird Johnson''s account). "Neither of the Mrs. Kennedys" is the page''s
        phrase, the wives of Robert and Edward Kennedy by inference. Mrs. Humphrey''s account is as Mrs. Johnson relays it.
        Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-04-30.white-house-2
      when: Apr. 30
      date: '1968-04-30'
      thread: white-house
      c: The White House, evening. Joseph Alsop and Mrs. Alsop to dinner with the Johnsons, Johnson an hour late. "Wide-ranging
        talk of international affairs and of this unbelievable spring"; Johnson "exhausted." Joe Alsop makes a move to go
        at 10:30.
      n: '[[w.johnson-white-house-diary]], 668–69 (Lady Bird Johnson''s account). The page gives no substance beyond the quoted
        words. "The Joe Alsops" is the diary''s phrase for the couple. Made public: 1970. Names: Johnson, Alsop, Lady Bird
        Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:alsop-joseph
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-05-15.africa
      when: May 15
      date: '1968-05-15'
      thread: africa
      c: The White House, the South Lawn. Arrival ceremony for President Habib Bourguiba of Tunisia, with his son Habib Bourguiba,
        Jr., his Secretary of Foreign Affairs, and his daughter-in-law; Johnson and Bourguiba review the troops; Rusk present.
      n: '[[w.johnson-white-house-diary]], 670 (Lady Bird Johnson''s account; Bourguiba "an outspoken, volatile man" who "has
        managed to remain the strongest friend of the United States in the Arab world" is her view). To check: the Public
        Papers, the arrival remarks. Names: Bourguiba, Habib Bourguiba, Jr., Johnson, Rusk.'
      tags:
      - name:bourguiba-habib-ben-ali
      - name:bourguiba-habib-jr
      - name:johnson-lyndon-b
      - name:rusk-dean
      - city:washington
- add:
    entry:
      id: cal.1968-05-15.africa-2
      when: May 15
      date: '1968-05-15'
      thread: africa
      c: 'The White House, the State Dinner for Bourguiba in the East Room. Among the guests Dr. Thomas Mattingly, the Bethesda
        heart surgeon Johnson had flown over to treat Bourguiba after his heart attack the year before, Dean Acheson, Mrs.
        Paul Nitze and Rawleigh Warner of Socony-Mobil. Bourguiba on Mrs. Johnson''s right, his son on her left; asked about
        archaeology, the son: "We have to work on the living before we can work on the dead," there being "so many places
        to put the dollars." Gifts, upstairs before: a gold-tooled saddle, a desert horseman''s hat, a cloak.'
      n: '[[w.johnson-white-house-diary]], 671–72 (Lady Bird Johnson''s account). The toasts are not given. To check: the
        Public Papers, the toasts. Names: Johnson, Bourguiba, Lady Bird Johnson, Habib Bourguiba, Jr., Acheson.'
      tags:
      - name:johnson-lyndon-b
      - name:bourguiba-habib-ben-ali
      - name:johnson-lady-bird
      - name:bourguiba-habib-jr
      - name:acheson-dean-g
      - city:washington
- add:
    entry:
      id: cal.1968-05-18.conservation
      when: May 18
      date: '1968-05-18'
      thread: conservation
      c: 'Tarrytown, N.Y., Lyndhurst, the Jay Gould mansion, owned by the National Trust for Historic Preservation: a tour,
        its paintings of the Hudson River School; Mrs. Johnson meets the Trust''s officials and is presented with a scroll.'
      n: '[[w.johnson-white-house-diary]], 675 (Lady Bird Johnson''s account). The day''s tour of Van Cortlandt Manor and
        Sunnyside with Laurance Rockefeller and Liz Carpenter (672–74) and the dinner at Brooke Astor''s (675–76) are passed
        over, sights and a social evening. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:ny
- add:
    entry:
      id: cal.1968-05-18.elections-1968-republican-nomination
      when: May 18
      date: '1968-05-18'
      thread: elections-1968-republican-nomination
      c: Tarrytown, N.Y., the Rockefeller estate, a little before 5 p.m. Mrs. Johnson, with Laurance and Mary Rockefeller
        and Liz Carpenter, has tea with Governor Nelson Rockefeller, a candidate for the Republican nomination, and Happy
        Rockefeller; he shows them the house and his modern art.
      n: '[[w.johnson-white-house-diary]], 674–75 (Lady Bird Johnson''s account; no politics on the page). Entered as a call
        by the First Lady on a candidate for the Republican nomination, the card''s lean. Names: Lady Bird Johnson, Nelson
        Rockefeller, Laurance Rockefeller, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:rockefeller-nelson
      - name:rockefeller-laurance-s
      - name:carpenter-liz
      - state:ny
- add:
    entry:
      id: cal.1968-05-23.congress-2
      when: May 23
      date: '1968-05-23'
      thread: congress
      c: 'The White House. Mrs. Johnson''s last annual luncheon for the Senate Ladies, 101 guests: Mrs. Eisenhower again,
        though the General is in the hospital; Cabinet wives; Marvella Bayh, Mrs. Jackson, Mrs. Percy, Mrs. Hugh Scott, La
        Donna Harris, Mrs. Aiken, Muriel Humphrey, and wives of former Senators. Mrs. Eisenhower: "I never knew in this group
        who was Democrat and who was Republican." Gladys Johnston asks after Mrs. Nixon. Johnson drops in and says "a few
        warm, affectionate words."'
      n: '[[w.johnson-white-house-diary]], 676–78 (Lady Bird Johnson''s account). Words as Mrs. Johnson gives them. The Senate
        Ladies Red Cross is the group. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - city:washington
- add:
    entry:
      id: cal.1968-06-05.crime-and-hijacking-guns
      when: June 5
      date: '1968-06-05'
      thread: crime-and-hijacking-guns
      c: 'The White House, Johnson''s bedroom, "around 7 o''clock." Mansfield, "a staring look in his eyes": "What is happening
        to our country?" Johnson with him on how to get legislation moving on a gun law, how to protect the candidates and
        how to carry the safeguards "through the maze of legislative action," and on further action on a crime bill.'
      n: '[[w.johnson-white-house-diary]], 680 (Lady Bird Johnson''s account). The hour is "I think it was around 7 o''clock."
        The words are as Mrs. Johnson gives them. See [[cal.1968-06-05.assassination-3]]. Made public: 1970. Names: Mansfield,
        Johnson.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-06-05.robert-kennedy-3
      when: June 5
      date: '1968-06-05'
      thread: robert-kennedy
      c: The White House. Johnson makes planes available to carry members of the Kennedy family to California, several of
        the children and, "I believe, later the Kennedy family doctor."
      n: '[[w.johnson-white-house-diary]], 681 (Lady Bird Johnson''s account). The hours are not given. Mrs. Johnson''s and
        Liz Carpenter''s wires to Rose and Ethel Kennedy are passed over. See [[cal.1968-06-05.assassination-3]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-06-08.robert-kennedy-3
      when: June 8
      date: '1968-06-08'
      thread: robert-kennedy
      c: Union Station, evening. Johnson is told Cardinal Cushing "had an attack on the train" and that they need to get him
        to a doctor and a plane to fly him straight back. Johnson says yes, orders the plane standing by with a doctor to
        fly with him, and instructs his own doctor to give the Cardinal "every help possible."
      n: '[[w.johnson-white-house-diary]], 685–86 (Lady Bird Johnson''s account). The page does not name who brought the request
        or give the hour. See [[cal.1968-06-08.robert-kennedy-2]]. Names: Johnson, Cushing.'
      tags:
      - name:johnson-lyndon-b
      - name:cushing-richard-g
- add:
    entry:
      id: cal.1968-06-08.white-house
      when: June 8
      date: '1968-06-08'
      thread: white-house
      c: The White House, a little past 7 p.m. Johnson brings Billy Graham, "who had been in his office," to see Mrs. Johnson;
        dinner follows.
      n: '[[w.johnson-white-house-diary]], 685 (Lady Bird Johnson''s account). Nothing of what was said is given. Names: Johnson,
        Graham, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:graham-billy
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-06-21.white-house
      when: June 21
      date: '1968-06-21'
      thread: white-house
      c: 'The Rose Garden. Luci Nugent''s "press conference" for Patrick Lyndon Nugent''s first birthday, before "an amazing
        number of cameras and press": a cake, flags, and around his neck his White House pass. Luci answers questions: twelve
        teeth, six words, size toddler three. Johnson, out of the Cabinet Room: "You''ve got the platform. Anything you want
        to tell them?" And: "Lyn says, ''No comment.''"'
      n: '[[w.johnson-white-house-diary]], 687 (Lady Bird Johnson''s account). The pass came with a letter from J. Edgar Hoover,
        "nothing derogatory was found in the files of the FBI against Patrick Lyndon Nugent," not told to the press. Names:
        Luci Nugent, Johnson.'
      tags:
      - name:nugent-luci-baines-johnson
      - name:johnson-lyndon-b
      - city:washington
- add:
    entry:
      id: cal.1968-06-26.conservation
      when: June 26
      date: '1968-06-26'
      thread: conservation
      c: 'Portland, Ore., the Civic Center, the American Institute of Architects'' convention. Mrs. Johnson, introduced by
        Orville Freeman, delivers the B. Y. Morrison lecture on nature and architecture, her longest speech: "the new conservation,"
        a concern for the total environment, the human scale, areas of natural beauty; housing developments with "no there
        there"; shopping centers "a sort of ''urban strip mine''"; a call to city planners and architects. Freeman announces
        an azalea named for her, the "Mrs. LBJ." Her last planned trip and speech.'
      n: '[[w.johnson-white-house-diary]], 689–90 (Lady Bird Johnson''s account). Her words as the diary reports them; the
        Gertrude Stein line she quotes as "There''s no there there." To check: the Public Papers or the text of the lecture.
        Names: Lady Bird Johnson, Freeman.'
      tags:
      - name:johnson-lady-bird
      - name:freeman-orville-l
      - state:or
      - city:portland
- cite:
    id: cal.1968-01-07.middle-east
    item: '[[w.johnson-white-house-diary]], 613–15 (Jan. 7: the Johnsons and Rusk fly to San Antonio in the Jetstar a little
      past 3; the Prime Minister and Mrs. Eshkol arrive in the "great plane"; Johnson''s welcoming speech, Eshkol''s response;
      to the Ranch about 4:30; Johnson shows Eshkol the deer; the State Dinner at the Ranch, Luke Battle on Eshkol''s other
      side; "the problems in the Middle East ... planes, refugees, boundaries" named, nothing of the talks; gifts: artifacts
      and jewelry for her, a hand-carved Noah''s Ark for Patrick Lyndon; Jimmy Symington''s songs after dinner; the diary
      gives no Phantoms, no McNamara or Wheeler)'
    units: '?'
- cite:
    id: cal.1968-01-17.program
    item: '[[w.johnson-white-house-diary]], 618–20 (Jan. 17: her guests, the Medal of Honor man Specialist Lawrence Joel,
      a VISTA worker, a Teacher Corps teacher and a Job Corps youth; Johnson received "a thundering applause which lasted
      three minutes"; the speech "forty-nine minutes," "about fifty applauses," the loudest for "The American people have
      had enough of rising crime and lawlessness"; a late insertion on highway beautification; the teleprompter failed and
      he interpolated; in the Speaker''s office "no rush forward" from the Cabinet or the leaders; Jan. 18, the Eastern metropolitan
      papers "largely negative or unenthusiastic"; not the hour of 9:05)'
    units: '?'
- cite:
    id: cal.1968-01-17.elections-1968
    item: '[[w.johnson-white-house-diary]], 619 (Mrs. Johnson, "Would he end with his statement? ... He ended on a strong
      high note"; he ended without it)'
    units: '?'
- cite:
    id: cal.1968-01-15.elections-1968-johnson
    item: '[[w.johnson-white-house-diary]], 615 (Jan. 15, lunch at 3:30 with George Christian: "I have been in a hurry all
      of my life. I have never had time to stay in one place as long as I like. I''ve always been fighting an uphill fight";
      her reading: his mind on "How and when do I face up to running again or getting out?"; the diary does not say Busby)'
    units: A, C-D
- cite:
    id: cal.1968-01-18.war-opposition
    item: '[[w.johnson-white-house-diary]], 620–24 (Jan. 18: the luncheon from "a quarter of one" to "about five minutes of
      four"; speakers Margaret Moore of Indianapolis, Martha Coe, a VISTA worker in Atlanta, and Katherine Peden of the Advisory
      Commission on Civil Disorders; Johnson comes in, calls for support of the police, says the place to start is the home;
      leaving, Kitt asks "what do you do about delinquent parents" and Johnson answers that the Social Security bill allots
      millions for day-care centers; Kitt on welfare "four dollars," taxes, and "Boys I know across the nation feel it doesn''t
      pay to be a good guy. They figure with a record they don''t have to go off to Vietnam"; "You are a mother, too ... No
      wonder the kids rebel and take pot," her finger pointed at Mrs. Johnson, as "the papers later reported"; Mrs. Hughes
      of New Jersey in defense of the war; Bennetta Washington; Mrs. Johnson''s reply, "Because there is a war on ... that
      still doesn''t give us a free ticket not to try to work for better things"; she finds she was pale, voice trembling
      slightly, no tears)'
    units: A-B
- cite:
    id: cal.1968-01-25.japan-and-korea
    item: '[[w.johnson-white-house-diary]], 625 (Jan. 25: "Sometime in the morning the news came to me that Lyndon had called
      up the Reservists, Air Force and Navy—about fourteen thousand of them—for active duty, a partial answer to the North
      Koreans seizing our ship"; she dates the Pueblo''s seizure "Monday"; not the order or its terms)'
    units: '?'
- cite:
    id: cal.1968-01-25.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 625 (Jan. 25: "Secretary John Gardner''s resignation had been announced"; "I had
      already had five days to absorb my sadness"; not the terms or the letter)'
    units: '?'
- cite:
    id: cal.1968-02-08.europe-and-the-alliance
    item: '[[w.johnson-white-house-diary]], 629–30 (Feb. 8: the conference with Wilson "supposed to last from 11:30 to one";
      Johnson brings Wilson and his party of about fourteen to lunch on the second floor instead of the British Embassy, "talking
      and working until past 3:30"; nothing of sterling, the briefing paper or Suez)'
    units: A
- cite:
    id: cal.1968-03-04.open-housing
    item: '[[w.johnson-white-house-diary]], 634 (Mar. 5, evening: Johnson "had had one victory. The Senate had voted cloture
      on the Civil Rights debate, and it looks now as if we might get a bill, including Open Housing"; the diary has no vote,
      no day of the vote and no Dirksen substitute)'
    units: '?'
- cite:
    id: cal.1968-03-06.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 634–35 (Mar. 6, the East Room at one: the swearing in of C. R. Smith, "casual,
      good-humored," Congress "fully represented," business "in full force"; "young Sandy Trowbridge had to leave because
      of the heart attack"; Andre Meyer, who came down for it, stays to lunch with Johnson)'
    units: '?'
- cite:
    id: cal.1968-03-10.elections-1968-johnson
    item: '[[w.johnson-white-house-diary]], 637 (Mar. 10: "This was a day of deep gloom—that is to say, gloom was purveyed
      in the newspapers and on TV ... though it was not apparent in Lyndon. His voice was hearty"; his work on the phone and
      reading reports; the diary''s page is 637, not a range of 633–47)'
    units: '?'
- check:
    id: cal.1968-03-10.elections-1968-johnson
    text: 'Check: the diary''s "day of deep gloom" is the newspapers'' and television''s, "not apparent in Lyndon. His voice
      was hearty" ([[w.johnson-white-house-diary]], 637).'
- cite:
    id: cal.1968-03-10.vietnam-205000
    item: '[[w.johnson-white-house-diary]], 637 (Mar. 10: "Secretary Rusk came by right after church. Tomorrow he goes up
      on the Hill to testify before TV"; afterward Johnson told her what Rusk had said: "Your courage keeps me going. These
      days are an exercise of sheer spirit"; not the subject of the talk)'
    units: '?'
- cite:
    id: cal.1968-03-14.elections-1968-johnson
    item: '[[w.johnson-white-house-diary]], 638 (Mar. 14: "This was one of those terrific, pummeling White House days that
      can stretch and grind and use you"; the headlines she lists include "Kennedy Is Considering Race Against Johnson" and
      "Gold Buying Skyrockets")'
    units: A-B
- cite:
    id: cal.1968-03-17.elections-1968-johnson
    item: '[[w.johnson-white-house-diary]], 641 (Mar. 17, after church: "we watched the last part of a TV show—Hubert Humphrey
      was absolutely magnificent. He and Rusk are about the only two who are out speaking for the Administration now")'
    units: A-C
- cite:
    id: cal.1968-03-17.elections-1968-johnson-2
    item: '[[w.johnson-white-house-diary]], 641 (Mar. 17: "I have a growing feeling of Prometheus Bound, just as though we
      were lying there on the rock, exposed to the vultures, and restrained from fighting back")'
    units: A-B
- check:
    id: cal.1968-03-17.elections-1968-johnson-2
    text: 'Check: the diary puts the sleepless night on Mar. 5 (633), "bone weary" and "dead tired" on Mar. 6 (636, 637) and
      the sties on Mar. 10 (638), not on Mar. 17 ([[w.johnson-white-house-diary]]).'
- cite:
    id: cal.1968-03-31.elections-1968-4
    item: '[[w.johnson-white-house-diary]], 643 (Mar. 31: "On the way home from church, Lyndon stopped to see the Vice President
      at his apartment. Hubert and Muriel are leaving for Mexico, for a ceremony, sometime during the day"; the diary says
      nothing of what was said)'
    units: '?'
- cite:
    id: cal.1968-03-31.elections-1968-3
    item: '[[w.johnson-white-house-diary]], 643–44 (Mar. 31: a little after 2 o''clock lunch for Johnson, Mrs. Johnson, Luci,
      Pat, Mathilde and Arthur Krim, with Busby called in from the Treaty Room; "Mathilde''s eyes were full of tears, and
      Luci had obviously been crying"; Johnson "congealing into a calm, quiet state of mind"; "I do not believe I can unite
      this country," which she has heard "increasingly these last months"; the Krims'' protests, "You can''t mean this!" and
      "Oh no, no!", come at Johnson''s reading earlier, not at lunch; Busby "cloaked it in its final words," Johnson "the
      architect and the planner"; the diary has no "eighty-twenty," no "cage," no Connally and no change of "will not accept")'
    units: '?'
- cite:
    id: cal.1968-03-31.elections-1968-10
    item: '[[w.johnson-white-house-diary]], 642, 644 (Mar. 31: Lynda in "about 7 a.m.," having said good-by to Chuck at Camp
      Pendleton the night before (642); "around 3 o''clock," "the time is very hazy on this day," Mrs. Johnson talks to Lynda
      and Luci, "emotional, crying and distraught": what does this do to the servicemen?; Lynda: "Chuck will hear this on
      his way to Vietnam." Later Johnson to her: "I called in General Westmoreland last year about that ... He thinks it will
      not matter appreciably" (644). The diary does not say she told them of the withdrawal; Luci had been told in the car
      after Mass)'
    units: A, C
- cite:
    id: cal.1968-03-31.soviet-union
    item: '[[w.johnson-white-house-diary]], 644 (Mar. 31, near 6 o''clock: Rostow and Harriman arrive on the second floor
      with Dobrynin, "called in because we wanted to make absolutely sure that Hanoi and its friends knew that we were halting
      the bombing and why we were doing it"; Mrs. Johnson takes them into the Yellow Room, all take Coca-Cola, Dobrynin talks
      of the Bolshoi Ballet at HemisFair; Johnson comes in after; the diary gives neither the hour 6:05 nor what was said
      with Johnson, nor the hallway)'
    units: '?'
- cite:
    id: cal.1968-03-31.elections-1968
    item: '[[w.johnson-white-house-diary]], 642, 645–46 (Mar. 31: "At 9 in the evening, Lyndon was to make his talk to the
      nation about the war" (642); Mrs. Johnson in the Oval Office with Clifford and Busby, Lynda joining; "Remember—pacing
      and drama"; the end quoted, "I have concluded that I should not permit the Presidency to become involved in the partisan
      divisions that are developing in this political year" and "Accordingly, I shall not seek, and I will not accept, the
      nomination of my party for another term as your President"; Luci and Lynda embrace him, Pat shakes hands; Clifford outside
      the door "with the oddest, most faraway expression"; nothing of the bombing, the troops or the surtax)'
    units: A, H
- cite:
    id: cal.1968-04-04.king
    item: '[[w.johnson-white-house-diary]], 647–48 (Apr. 4: Lynda: "Dr. King''s been shot!" and then "Mama, he''s dead!";
      Johnson''s statement on television from the White House, as Mrs. Johnson gives it: "America is shocked and saddened
      by the brutal slaying tonight of Dr. Martin Luther King. I ask every citizen to reject the blind violence that has struck
      down Dr. King, who lived by nonviolence. I pray that his family can find comfort ... I have just conveyed the sympathy
      of Mrs. Johnson and myself to his widow, Mrs. King"; "I hope that all Americans tonight will search their hearts"; "I
      have canceled my plans for the evening. I am postponing my trip to Hawaii"; the diary has no hour of 9:07; the words
      of D read "struck down")'
    units: E
- variant:
    id: cal.1968-04-04.king
    unit: D
    witness: w.johnson-white-house-diary
    reads: '"struck down Dr. King" (for "struck Dr. King")'
    at: '648'
- cite:
    id: cal.1968-04-04.democratic-party
    item: '[[w.johnson-white-house-diary]], 647–48 (Apr. 4: "a Democratic Fund Raising Dinner this evening"; the Johnsons
      were to go, she in evening dress; "the Democratic Dinner, which was already in progress" when word came; Johnson "canceled
      my plans for the evening"; the diary says nothing of Humphrey or his eulogy, and does not date the dinner other than
      "this evening")'
    units: '?'
- cite:
    id: cal.1968-04-05.civil-disorders
    item: '[[w.johnson-white-house-diary]], 651–52 (Apr. 5: at Fredericksburg, then the car to the Ranch, Mrs. Johnson to
      "Jerry": "How is everything in Washington?" "Not good . . . Fires and rioting, trouble on Fourteenth Street, supposed
      to have been three persons killed"; that evening Lynda by telephone: looting and fires on Fourteenth Street "and down
      toward the Capitol," hoses slashed, "a report that seven people had been killed and three hundred people were in the
      District of Columbia hospitals"; the White House "like a fortress," security tightened; reports of the day, not a count
      or the proclamation)'
    units: '?'
- cite:
    id: cal.1968-04-09.king
    item: '[[w.johnson-white-house-diary]], 656 (Apr. 9: on the bus to Goliad, her sense of "Dr. King''s funeral" in Atlanta,
      "bits and pieces" heard: "a quorum of the Senate had gone there"; every Presidential candidate "except Wallace, including
      Nixon, with Hubert to represent the Administration"; "a vast throng, numbering about fifty thousand people"; hearsay,
      not an eyewitness account)'
    units: C
- cite:
    id: cal.1968-04-09.vietnam-paris
    item: '[[w.johnson-white-house-diary]], 656 (Apr. 9: Mrs. Johnson talked to Johnson, "who is at Camp David and about to
      go into a series of meetings. His voice was calm, the least flurried of any I''ve heard from Washington"; the diary
      does not say who attended or what was decided)'
    units: '?'
- cite:
    id: cal.1968-04-11.open-housing
    item: '[[w.johnson-white-house-diary]], 661–62 (Apr. 11: word "sometime during the course of the day" of the signing "in
      the East Room at 5" of the Civil Rights Bill "passed yesterday by the House"; the Johnsons enter "to prolonged clapping,"
      an unusually large group from Congress, the Cabinet, Civil Rights leaders and the press; Johnson''s speech: all America
      outraged by the assassination of Martin Luther King and by "the looting and burning that defiles our democracy"; "Violence
      cannot redress a solitary wrong or remedy a single unfairness"; he appeals to Congress to enact the twenty programs
      he recommended this year; the diary does not mention open housing or the Act''s titles)'
    units: A
- cite:
    id: cal.1968-06-05.assassination-3
    item: '[[w.johnson-white-house-diary]], 679–80 (June 5: the phone at 4:20 a.m., Johnson "propped up against the pillows,"
      all the television sets on; "giving instructions about putting Secret Service guards on all the candidates, listing
      them: Kennedy and McCarthy and Humphrey and Nixon and Rockefeller and Stassen. If there weren''t enough Secret Service
      men they could borrow from the FBI or from the Marines. But get them, he said—assign them now"; "At 5:30, Lyndon was
      calling Attorney General Ramsey Clark"; the diary gives neither Rostow''s 3:31 nor the statement of 6:45)'
    units: '?'
- cite:
    id: cal.1968-06-05.civil-disorders-2
    item: '[[w.johnson-white-house-diary]], 681–82 (June 5: "At 10:07, Lyndon went on TV," after "a condemnation of this assassination
      attempt on Senator Kennedy and of the spirit of violence that made such things possible": "two hundred million people
      did not strike down Robert Kennedy . . ."; the rest, the fabric of American life "still strong," in her paraphrase;
      nothing of the commission or the traffic in guns; the words of A read otherwise, a variant)'
    units: '?'
- variant:
    id: cal.1968-06-05.civil-disorders-2
    unit: A
    witness: w.johnson-white-house-diary
    reads: '"two hundred million people did not strike down Robert Kennedy" (for "Americans")'
    at: '682'
- cite:
    id: cal.1968-06-06.robert-kennedy-campaign
    item: '[[w.johnson-white-house-diary]], 682 (the night of June 5–6: "a little past one a.m." Johnson comes in "with Joe
      Califano and Harry McPherson, Larry Temple, Jim Jones, and George Christian"; dinner "interrupted by constant telephone
      calls"; the conversation "about how to get through the Gun Bill, the chances for crime legislation, and then a report
      from the Secret Service that Senator Kennedy was sinking and it would be a matter of hours"; the diary has no "Is he
      dead yet?", no 5:01 a.m. and no taping)'
    units: '?'
- cite:
    id: cal.1968-06-08.robert-kennedy
    item: '[[w.johnson-white-house-diary]], 682–86 (June 8: the Johnsons, Marie Fehmer, Califano and Jim Jones leave the White
      House lawn "about 8:20" by helicopter, then jet from Andrews to New York; St. Patrick''s, "twenty-three hundred" in
      the cathedral; Salinger leads them down the aisle; Johnson rises as Mrs. Jacqueline Kennedy enters; Edward Kennedy''s
      eulogy: "a good and decent man, who saw wrong and tried to right it, saw suffering and tried to heal it, saw war and
      tried to stop it," and "Some men see things as they are and say, why? I dream things that never were and say, why not?";
      Cardinal Cooke quotes Johnson''s remark that two hundred million did not kill him; Ethel Kennedy to Johnson: "You have
      been so kind"; the train two hours late; the cortege from Union Station past the Capitol, the Justice Department and
      the Lincoln Memorial, "many from Resurrection City"; Arlington, after 9, the Johnsons stand behind the family; the diary
      has no hour for the Mass)'
    units: A-B, D-E
- cite:
    id: cal.1968-06-08.robert-kennedy-2
    item: '[[w.johnson-white-house-diary]], 685 (June 8, Union Station: Humphrey and Muriel asked to sit in the car with the
      Johnsons; Humphrey: "Eric Sevareid sure had it right for once when he said, ''Whoever gets the Democratic nomination,
      it will be a tarnished shield''"; Mrs. Johnson: "this whole tragedy turns the nation toward the Republican Party"; the
      diary does not name McCormack and says "a little past 7" and "at about 8:45" for the move to the station)'
    units: B-E
- cite:
    id: cal.1968-06-08.king
    item: '[[w.johnson-white-house-diary]], 685 (June 8: "the accused slayer of Martin Luther King, James Earl Ray, was seized
      at London Airport. And somehow this event seemed to say: ''This government will not be mocked''"; she gives no hour
      and no passport)'
    units: A
- cite:
    id: cal.1968-06-26.court
    item: '[[w.johnson-white-house-diary]], 689, 692 (June 26: "Lyndon nominated Abe Fortas for Chief Justice and Homer Thornberry
      for Associate Justice"; at dinner at Timberline Lodge "a former state official who was very interested in Lyndon''s
      appointments of the day," and "everyone came up to me with questions or expressions of interest," she unable to assess
      "the color of their thinking, approval or disapproval"; the diary has no hour and no Warren letter)'
    units: '?'
- add:
    entry:
      id: cal.1968-10-09.vietnam-support
      when: Oct. 9
      date: '1968-10-09'
      thread: vietnam-support
      c: 'The White House, South grounds, morning. Arrival ceremony for Prime Minister Keith Holyoake of New Zealand and Mrs.
        Holyoake. Holyoake: "You have truly known the ordeal of power, Mr. President."'
      n: '[[w.johnson-white-house-diary]], 719 (Lady Bird Johnson''s account). To check: the Public Papers, the arrival remarks.
        Names: Holyoake, Johnson.'
      tags:
      - name:holyoake-keith
      - name:johnson-lyndon-b
      - city:washington
- add:
    entry:
      id: cal.1968-10-09.vietnam-support-2
      when: Oct. 9
      date: '1968-10-09'
      thread: vietnam-support
      c: 'The White House, evening. State Dinner for Prime Minister Holyoake of New Zealand. In his toast he speaks "in a
        straightforward manner about Vietnam": "[We] fought, because we felt deeply that if we did not fight and if we did
        not win, then the world we know would not be worth living in."'
      n: '[[w.johnson-white-house-diary]], 720–21 (Lady Bird Johnson''s account; the toast as she quotes it, with her bracket).
        To check: the Public Papers, the toasts. See [[cal.1968-10-09.vietnam-support]]. Names: Holyoake.'
      tags:
      - name:holyoake-keith
      - city:washington
- add:
    entry:
      id: cal.1968-10-15.vietnam-paris-3
      when: Oct. 15
      date: '1968-10-15'
      thread: vietnam-paris
      c: 'The White House, about 10 p.m. Johnson, in from the office with Mary Rather, to Mrs. Johnson: "I almost hit a home
        run, but I struck out." At 3:30 he had looked "rested, confident" and gone back to the office "to begin the next chapter
        in whatever was unfolding in the bombing halt."'
      n: '[[w.johnson-white-house-diary]], 721, 723 (Lady Bird Johnson''s account; she asked no questions, and does not say
        what the home run was). See [[cal.1968-10-15.vietnam-paris-2]]. Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-10-15.conservation
      when: Oct. 15
      date: '1968-10-15'
      thread: conservation
      c: 'The White House, family dining room. Mrs. Johnson''s luncheon for people in historic preservation: Gordon Gray,
        Chairman of the National Trust; Walter Beinecke of the Nantucket Historic Trust; Leopold Adler on saving eleven hundred
        historic buildings in Savannah; Mrs. Robinson, fighting a freeway through the Vieux Carré; John Ben Shepperd on Texas;
        Carlisle Humelsine, whom Johnson "recently appointed Chairman of the American Revolution Bicentennial Commission,"
        on goals for 1976; James Biddle, Laurance Rockefeller, Henry du Pont and Alice Roosevelt Longworth hosts at tables.'
      n: '[[w.johnson-white-house-diary]], 721–23 (Lady Bird Johnson''s account). The tables were set with the china of past
        administrations; the talk at the lunch is given only in outline. Names: Lady Bird Johnson, Johnson, Gray, Laurance
        Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:gray-gordon
      - name:rockefeller-laurance-s
      - city:washington
- add:
    entry:
      id: cal.1968-10-25.white-house
      when: Oct. 25
      date: '1968-10-25'
      thread: white-house
      c: 'The hospital, after midnight. Johnson announces to the press, with Mrs. Johnson and Luci beside him, that Lynda
        had a girl at 12:03: the baby "seems to know that she''s here and has her work cut out for her—she is already expressing
        herself." He passes out cigars to the wire service women. Mrs. Johnson calls it "the only press conference I remember
        in recent months where everybody was content with the news."'
      n: '[[w.johnson-white-house-diary]], 727–28 (Lady Bird Johnson''s account). The diary does not name the hospital. The
        birth is Oct. 25, a few minutes past midnight of the entry for Oct. 24. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-10-29.transition-and-staff
      when: Oct. 29
      date: '1968-10-29'
      thread: transition-and-staff
      c: The White House, Cabinet Room, about 6 p.m. The White House Fellows, Walter Humann, President of their Association,
        reading, report to Johnson their suggestions of things that ought to be done; Johnson responds. They give Mrs. Johnson
        a vermeil bamboo bowl inscribed from the Fellows.
      n: '[[w.johnson-white-house-diary]], 729 (Lady Bird Johnson''s account). The suggestions are not given. Names: Johnson,
        Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-11-06.press-and-broadcasting
      when: Nov. 6
      date: '1968-11-06'
      thread: press-and-broadcasting
      c: LBJ Ranch. On a television program in which Walter Cronkite and Theodore White analyze the vote in Illinois and Texas,
        White paints "a picture of bossism, chicanery, and dishonest political control" that he ascribes to the two States.
        John Connally telephones the program "at once" and, "in a courteous, masterful, dignified manner," calls White's hand,
        "answering his charges in a way that soon had the commentators backing off."
      n: '[[w.johnson-white-house-diary]], 732 (Lady Bird Johnson''s account). The network is not named. Mrs. Johnson''s summary
        of White''s charge and of Connally''s answer. Names: Cronkite, White, Connally.'
      tags:
      - name:cronkite-walter
      - name:white-theodore-h
      - name:connally-john
      - state:tx
      - state:il
      also:
      - elections-1968
- add:
    entry:
      id: cal.1968-11-11.transition-and-staff-2
      when: Nov. 11
      date: '1968-11-11'
      thread: transition-and-staff
      c: 'The White House, the family sitting room and lunch, before the Cabinet Room briefing. Johnson introduces Marvin
        Watson to the Nixons: "Mr. Nixon turned to Marvin and asked him if he was as good a man as Billy Graham said he was";
        Johnson tells Nixon "he could look to Marvin for any interim help." At lunch Nixon asks Johnson''s opinion of the
        heads of nonpartisan bureaus, "including Helms of the CIA and J. Edgar Hoover"; says Johnson will be remembered for
        Vietnam and for his achievements for Negroes; Johnson on Bebe Rebozo: "Don''t take him to church too often with you
        or single him out or the press will attack him"; they discuss the press, "Georgetown dinner parties"; Johnson on his
        School of Public Affairs, "two hundred ''trained troops'' a year," and Nixon: "send all two hundred of them to him."
        Nixon asks why Johnson kept so many of Kennedy''s appointees; Johnson: respect for Kennedy; not knowing whether he
        had "an excellent man or an incompetent"; "I didn''t always have all the troops I needed"; "Maybe I made a mistake
        . . . maybe after January 1965 I ought to have made some changes." Nixon: "That would have been the time for you to
        clean house."'
      n: '[[w.johnson-white-house-diary]], 733–34 (Lady Bird Johnson''s account). Mrs. Johnson and Mrs. Nixon were present,
        "politely attentive." Nixon''s reply is as she quotes it; "I think Lyndon agreed but he didn''t say so." See [[cal.1968-11-11.transition-and-staff]].
        Made public: 1970. Names: Johnson, Nixon, Watson, Graham, Helms, Hoover, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      - name:watson-w-marvin
      - name:graham-billy
      - name:helms-richard
