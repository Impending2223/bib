- add:
    entry:
      id: cal.1968-11-12.conservation
      when: Nov. 12
      date: '1968-11-12'
      thread: conservation
      c: The Department of the Interior Auditorium, about 3:30 p.m. Mrs. Johnson's beautification meeting, moved indoors from
        Columbia Island. Stewart Udall welcomes; Dale Miller, Chairman of the 1965 Inaugural Committee, presents 220 dogwoods,
        $40,000 worth, planted on Columbia Island; Carol Fortas, Treasurer of the Society for a More Beautiful National Capital,
        presents the Society's gift, Mary Lasker's one million daffodils and 2,500 dogwoods with the National Park Service
        and 1.2 miles of "hike and bike" trails; Nash Castro accepts for the Park Service. Udall announces that Columbia Island
        is named "Lady Bird Johnson Park" and that Mrs. Johnson is appointed to the Advisory Board of the National Park Service.
        The plaque is unveiled to the Marine Band.
      n: '[[w.johnson-white-house-diary]], 735–36 (Lady Bird Johnson''s account). Mrs. Johnson was "stunned" at the naming;
        Udall''s words as she gives them. To check: the Public Papers or the Interior record for the naming and the appointment.
        Names: Udall, Lady Bird Johnson.'
      tags:
      - name:udall-stewart-l
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-11-12.conservation-2
      when: Nov. 12
      date: '1968-11-12'
      thread: conservation
      c: 'The Laurance Rockefellers'' home, evening. The Beautification Committee, thirty at the meeting and dinner, for its
        last: Laurance Rockefeller shows a watercolor rendering for "The Look Out," a landscaped high place under live oaks
        on the grounds of the LBJ Library in Austin, with benches, the Committee''s gift to Mrs. Johnson, who is to be its
        architect. Mrs. Johnson thanks the Committee.'
      n: '[[w.johnson-white-house-diary]], 736–37 (Lady Bird Johnson''s account). Names: Laurance Rockefeller, Lady Bird Johnson.'
      tags:
      - name:rockefeller-laurance-s
      - name:johnson-lady-bird
      - state:tx
      - city:austin
- add:
    entry:
      id: cal.1968-11-23.space
      when: Nov. 23
      date: '1968-11-23'
      thread: space
      c: 'Cape Kennedy, Florida. Mrs. Johnson, with Lynda, tours the Space Center with Thomas Paine, Kurt Debus, George Miller,
        Ed Welch and James Webb: the Visitors'' Information Center (1,750,000 visitors in three years), the Apollo command
        module, a Lunar module simulator with Walter Cunningham, a briefing for Apollo 8, with Lee Scherer: "We stand now
        at a point in history comparable to 1492 when Columbus discovered America", Pad A and the Vehicle Assembly Building.
        At the award ceremony Paine presents group achievement awards and exceptional service medals; Mrs. Johnson speaks
        of the night of Oct. 4, 1957 and of Johnson''s Preparedness Subcommittee, "the legislation which established the National
        Aeronautics and Space Administration," passed July 29, 1958. She is given models of the rocket and the lunar module
        for the Library, inscribed "Lyndon B. Johnson''s vision and leadership at each crucial step forward from 1957 to 1969."'
      n: '[[w.johnson-white-house-diary]], 740–44 (Lady Bird Johnson''s account). The Surfside Cottage rest and the visit
        at the Cape are described as a day of vignettes. Dates of the NASA bill and of Sputnik are as she gives them. Names:
        Lady Bird Johnson, Johnson, Paine, Webb.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:paine-thomas-o
      - name:webb-james-e
      - state:fl
- add:
    entry:
      id: cal.1968-12-03.democratic-party
      when: Dec. 3
      date: '1968-12-03'
      thread: democratic-party
      c: 'Washington, the Women''s National Democratic Club reception in honor of the Johnsons: eight hundred guests; Mrs.
        Johnson in the line with the Club''s president, Paula Locker. The Vice President, Humphrey, arrives first and is mistaken
        for the President; Johnson comes in a little later and "pandemonium" follows as the crowd closes around him.'
      n: '[[w.johnson-white-house-diary]], 746–47 (Lady Bird Johnson''s account). The hour is not given. Names: Lady Bird
        Johnson, Johnson, Humphrey.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - city:washington
- add:
    entry:
      id: cal.1968-12-03.transition-and-staff-2
      when: Dec. 3
      date: '1968-12-03'
      thread: transition-and-staff
      c: 'The White House, the Yellow Room and the family dining room, evening. Johnson and Mrs. Johnson dine with the Vice
        President and Muriel Humphrey. Humphrey says he was offered the appointment to the United Nations and refused. Johnson
        on Fulbright, who came in that morning: "I will have to admit, he was decent, considerate, and compassionate. He said
        we ought to get with the Soviets and table our papers"; Mrs. Johnson takes it to mean moving on the SALT talks postponed
        by Czechoslovakia. Johnson: "One of the first letters I wrote as President was to Khrushchev." On the next Administration,
        someone says John Mitchell appears to be "one of the most influential men in the Nixon entourage, and he is able."'
      n: '[[w.johnson-white-house-diary]], 747–48 (Lady Bird Johnson''s account). "I believe it was Lyndon who said" of Mitchell;
        the SALT reading is hers. Fulbright''s visit that morning is not otherwise described. Made public: 1970. Names: Johnson,
        Humphrey, Fulbright, Mitchell, Nixon.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:fulbright-j-william
      - name:mitchell-john-n
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-12-09.transportation
      when: Dec. 9
      date: '1968-12-09'
      thread: transportation
      c: 'The White House, Yellow Oval Room, 5 p.m. Mrs. Johnson with Secretary Alan Boyd and thirty-five young highway engineers
        who have completed an eighteen-month training program in federal construction project offices, about to go out to
        States to see federal money is used according to the Transportation Department''s philosophy: roads built "with some
        regard to aesthetics—to the social problems of the people it affects, and to landmarks and park lands." Her last seed
        on beautification.'
      n: '[[w.johnson-white-house-diary]], 748–49 (Lady Bird Johnson''s account). Mrs. Johnson''s description of the training
        and of the Department''s philosophy. Names: Boyd, Lady Bird Johnson.'
      tags:
      - name:boyd-alan-s
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-12-09.space
      when: Dec. 9
      date: '1968-12-09'
      thread: space
      c: 'The White House, evening. Dinner honoring James Webb and the space program: with Webb and Mrs. Webb, the Apollo
        7 astronauts (Schirra, Eisele, Cunningham) and the Apollo 8 crew to fly that month (Anders, Borman, Lovell), the Charles
        Lindberghs, Humphrey; 140 guests, twenty-three astronauts and their wives, the widows of Grissom, Chaffee and White,
        NASA officials, James Van Allen, James McDonnell. In the Treaty Room the astronauts sign a document of the occasion
        beside the Space Treaties. In the toasts Johnson gives the Medal of Freedom to Webb, who is "absolutely floored with
        surprise." Entertainment: Offenbach''s Voyage to the Moon, the Boston Opera Company; dancing until after one.'
      n: '[[w.johnson-white-house-diary]], 749–51 (Lady Bird Johnson''s account). Webb''s medal as Mrs. Johnson reports it;
        the date of the dinner is Dec. 9 by her entry. To check: the Public Papers, the toasts and the Medal of Freedom citation.
        Names: Johnson, Webb, Humphrey, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:webb-james-e
      - name:humphrey-hubert-h
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-12-16.press-and-broadcasting
      when: Dec. 16
      date: '1968-12-16'
      thread: press-and-broadcasting
      c: 'The White House, Yellow Room. Mrs. Johnson''s farewell party for the women of the press, eighty-five or more: Marine
        Band, Christmas decorations, a bar in the hall. She thanks them again for the Eleanor Roosevelt Candlestick Award
        the Women''s National Press Club gave her "at a dinner the other night." Forty-seven trips, two hundred thousand miles
        in five years. Liz Carpenter absent at the hospital where her husband Les is seriously ill.'
      n: '[[w.johnson-white-house-diary]], 756 (Lady Bird Johnson''s account). Mrs. Johnson counts "forty-seven trips" and
        "two hundred thousand miles." Names: Lady Bird Johnson, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
      - city:washington
- add:
    entry:
      id: cal.1968-12-18.white-house
      when: Dec. 18
      date: '1968-12-18'
      thread: white-house
      c: The White House and Bethesda Naval Hospital. Johnson wakes in the night with chills and fever; the doctor at 4 a.m.
        is "quite insistent" he go to the hospital. Johnson says he will wait until 8 or 9 because of "the furor it would
        cause to go in the night—the possible effect on the stock market, the next day's decisions and appointments, the rumor
        machine." He leaves about 9:30 and is installed in the Presidential suite, lying still "for a couple of days."
      n: '[[w.johnson-white-house-diary]], 757 (Lady Bird Johnson''s account). The date is the entry''s: Wednesday, Dec. 18.
        The illness is not named. Made public: 1970 (his reasons for waiting till morning). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-12-18.transition-and-staff
      when: Dec. 18
      date: '1968-12-18'
      thread: transition-and-staff
      c: 'Washington, Tracy Place. Dinner at the McNamaras'' in honor of Johnson, who is in the hospital; Mrs. Johnson goes
        for him. Most of the Cabinet attend; Humphrey is "grounded in Arizona with the flu." John Connor on the whole election:
        "Damn!" Asked to speak, Rusk: "Years from now our children and their grandchildren will be proud to say of us: ''They
        served in the Cabinet of Lyndon Johnson.''" Rusk hands Mrs. Johnson a signed silver tray for Johnson. She reports
        to him at the hospital.'
      n: '[[w.johnson-white-house-diary]], 757–59 (Lady Bird Johnson''s account). Rusk''s words as Mrs. Johnson gives them;
        Mrs. Johnson had gone to a wrong house first. Made public: 1970. Names: Johnson, Lady Bird Johnson, McNamara, Humphrey,
        Connor, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mcnamara-robert-s
      - name:humphrey-hubert-h
      - name:connor-john-t
      - name:rusk-dean
      - city:washington
- add:
    entry:
      id: cal.1968-12.civil-rights-the-executive-2
      when: Dec.
      date: 1968-12
      thread: civil-rights-the-executive
      c: 'A reception for Johnson given by the high-ranking Negroes in his Administration, which Robert Weaver helped plan,
        held before Dec. 18. Justice Thurgood Marshall makes the group''s presentation, a desk set: "The people in this room
        have just one purpose—to say ''Thank you, Mr. President.'' You didn''t wait. You took the bull by the horns. You didn''t
        wait for the times. You made them!" Johnson returned "elated."'
      n: '[[w.johnson-white-house-diary]], 758 (Lady Bird Johnson''s account). Weaver''s account to Mrs. Johnson at the McNamaras''
        dinner of Dec. 18 and Johnson''s own; she was not at the reception. Names: Johnson, Weaver, Marshall. Check: the day
        of the reception.'
      tags:
      - name:johnson-lyndon-b
      - name:weaver-robert-c
      - name:marshall-thurgood
- add:
    entry:
      id: cal.1969-01-10.transition-and-staff
      when: Jan. 10
      date: '1969-01-10'
      thread: transition-and-staff
      c: 'The White House, evening. The Johnsons'' farewell dinner for the Cabinet, honoring Hubert and Muriel Humphrey; every
        Cabinet member there. Johnson''s toasts to Humphrey, to Rusk, to all the Cabinet; Rusk responds. Humphrey speaks,
        "cheerful, looking ahead." Mrs. Johnson, from Dickens: "It was the best of times, it was the worst of times," and
        "a once-in-a-lifetime thing, and we are fortunate to have known it." Luci Nugent toasts the Cabinet "for our generation
        and for those that are coming on."'
      n: '[[w.johnson-white-house-diary]], 762 (Lady Bird Johnson''s account). The toasts as Mrs. Johnson gives them. Names:
        Johnson, Humphrey, Rusk, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:rusk-dean
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1969-01-13.democratic-party
      when: Jan. 13
      date: '1969-01-13'
      thread: democratic-party
      c: 'The White House, Blue Room, about 4 p.m. Reception for the Democratic National Committee, Mrs. Johnson in the line:
        "just a receiving line followed by refreshments in the State Dining Room."'
      n: '[[w.johnson-white-house-diary]], 764 (Lady Bird Johnson''s account). The diary gives only the receiving line and
        the hour. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1969-01-17.program
      when: Jan. 17
      date: '1969-01-17'
      thread: program
      c: The White House, noon. A Medal of Science awards ceremony, shortly before the Johnsons go to the National Press Club.
      n: '[[w.johnson-white-house-diary]], 768 (Lady Bird Johnson''s account). The only mention; no recipients, remarks or
        hour beyond "At 12." Johnson is not named as present. To check: the Public Papers for Jan. 17, 1969. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - city:washington
- add:
    entry:
      id: cal.1969-01-19.transition-and-staff-5
      when: Jan. 19
      date: '1969-01-19'
      thread: transition-and-staff
      c: 'The White House and the National City Christian Church, Sunday. Returning from church with the Johnsons, Billy Graham
        tells them of Nixon''s plan to hold religious services in the East Room, a different minister each Sunday, himself
        to conduct the first next Sunday; Graham: it would let the Nixons "invite many people to the White House who would,
        otherwise, perhaps never come."'
      n: '[[w.johnson-white-house-diary]], 771 (Lady Bird Johnson''s account). Graham''s account to Mrs. Johnson; the East
        Room services are Nixon''s plan, not recorded here as begun. See [[cal.1969-01-19.transition-and-staff]]. Names: Graham,
        Nixon, Johnson, Lady Bird Johnson.'
      tags:
      - name:graham-billy
      - name:nixon-richard-m
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1969-01-20.transition-and-staff-5
      when: Jan. 20
      date: '1969-01-20'
      thread: transition-and-staff
      c: Austin, Bergstrom Air Force Base, about 5:30 p.m. Johnson arrives to five thousand at the fence, met by Lieutenant
        Governor Barnes in dinner jacket, Chancellor Ransom and Mayor Akin; the Longhorn Band. His brief speech ends "with
        the hope that the country would be understanding with Nixon. And at the very last, 'Whether we are Democrats or Republicans,
        Texans or New Yorkers, we love our country, or we ought to love it.'" He works the fence, carrying Patrick Lyn.
      n: '[[w.johnson-white-house-diary]], 782 (Lady Bird Johnson''s account). Mrs. Johnson gives the words quoted; the speech
        is not otherwise reported. Names: Johnson, Nixon.'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      - state:tx
      - city:austin
- add:
    entry:
      id: cal.1969-01-20.transition-and-staff-6
      when: Jan. 20
      date: '1969-01-20'
      thread: transition-and-staff
      c: LBJ Ranch, at dusk. Johnson invites about five hundred local people into the hangar and makes them "a rather long
        and glowing talk about how glad he was to be home."
      n: '[[w.johnson-white-house-diary]], 782 (Lady Bird Johnson''s account). Mrs. Johnson gives no words. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1968-07-20.conservation-3
      when: July 20
      date: '1968-07-20'
      thread: conservation
      c: LBJ Ranch. Mrs. Johnson spends most of the day with National Park Service men "making plans for the park across the
        river"; about 6 she drives round the place with them.
      n: '[[w.johnson-white-house-diary]], 696 (Lady Bird Johnson''s account). The diary does not say which park or which
        men. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:tx
- add:
    entry:
      id: cal.1968-07-01.consumers
      when: July 1
      date: '1968-07-01'
      thread: consumers
      c: The White House, Blue Room. Mrs. Johnson receives the International Consumers Committee, representatives from many
        countries meeting in Washington on consumer problems, Betty Furness their Washington hostess.
      n: '[[w.johnson-white-house-diary]], 693 (Lady Bird Johnson''s account). After the signing of the Nonproliferation Treaty
        the same day; the hour is not given. Names: Lady Bird Johnson, Furness.'
      tags:
      - name:johnson-lady-bird
      - name:furness-betty
      - city:washington
- add:
    entry:
      id: cal.1968-07-16.conservation
      when: July 16
      date: '1968-07-16'
      thread: conservation
      c: 'The White House, Yellow Oval Room, about 1:30 p.m. Mary Lasker, Postmaster General Marvin Watson, Nash Castro and
        Mrs. Johnson on a new series of stamps for beautification: Mrs. Lasker asks that some be larger, some photographic
        rather than engraved, and one or two more on beautification, environment and conservation before the Administration
        ends. Watson "met us more than half-way," with a series on conservation already planned, one on urban conservation
        and one on highway beautification. Mrs. Lasker accepts a seat on the Stamp Advisory Committee.'
      n: '[[w.johnson-white-house-diary]], 694 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Watson.'
      tags:
      - name:johnson-lady-bird
      - name:watson-w-marvin
      - city:washington
- add:
    entry:
      id: cal.1968-07-16.middle-east
      when: July 16
      date: '1968-07-16'
      thread: middle-east
      c: 'The White House, Truman Balcony, evening. Robert McNamara, back in town from a trip to Egypt with Mrs. McNamara,
        dines with the Johnsons and Cyrus Vance. Mrs. Johnson "gathered" the McNamaras found Nasser "interesting and personally
        attractive." McNamara on the Aswan Dam: "the whole course of current history might have been changed if we had gone
        on with the loan," the Russians having invested a small sum in it. The Suez Canal is closed after the Israeli-Arab
        war.'
      n: '[[w.johnson-white-house-diary]], 695 (Lady Bird Johnson''s account). Mrs. Johnson reports McNamara before Johnson
        arrived, half an hour earlier; Nasser''s ministers and the dinner at a pyramid''s view are his account as she gives
        it; "the whole course of current history" is her paraphrase. Made public: 1970. Names: McNamara, Vance, Johnson, Lady
        Bird Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:vance-cyrus
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-08-01.elections-1968-chicago
      when: Aug. 1
      date: '1968-08-01'
      thread: elections-1968-chicago
      c: 'The White House, noon. Mayor Daley lunches with Johnson, with Mrs. Johnson and Lynda sitting in. Daley "was giving
        Lyndon a sales talk about coming to Chicago": the Democrats want to give him a rousing welcome. Johnson gives "little
        encouragement," stopping "just short of a positive ''No''." Mrs. Johnson says she will do whatever he wants and has
        "no enthusiasm for going." On the war, Mrs. Johnson sees, Daley "simply wants out"; Johnson cites Korea and tells
        of the candidates making "unofficial offers" while he bargains for peace, with his story of selling Daley a house
        for $20,000 and Mrs. Johnson and Lynda Bird following him to the door at $18,000 and $16,000: "What would you do?"'
      n: '[[w.johnson-white-house-diary]], 697–98 (Lady Bird Johnson''s account). Daley''s attitude is Mrs. Johnson''s reading
        ("the Mayor''s attitude spoke eloquently of the growing concern"). They had been listening to a tape from Charles
        Robb in Vietnam. Names: Daley, Johnson, Lady Bird Johnson.'
      tags:
      - name:daley-richard-j
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - city:chicago
- add:
    entry:
      id: cal.1968-08-02.white-house
      when: Aug. 2
      date: '1968-08-02'
      thread: white-house
      c: 'Walter Reed Hospital, about noon. Johnson, on his way to Texas, visits Eisenhower in the hospital; groups cheer
        as the Johnsons arrive. Mrs. Johnson talks about an hour with Mrs. Eisenhower in the suite: Mrs. Eisenhower wants
        to dispose of "things," the Eisenhowers have given their Gettysburg home to the National Park Service, and crowds
        still come to look at the farm.'
      n: '[[w.johnson-white-house-diary]], 699–700 (Lady Bird Johnson''s account). The diary gives nothing of the talk between
        Johnson and Eisenhower. Names: Johnson, Eisenhower, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:eisenhower-dwight-d
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-08-09.elections-1968-8
      when: Aug. 9
      date: '1968-08-09'
      thread: elections-1968
      c: 'LBJ Ranch. Muriel Humphrey, to Mrs. Johnson, on her plans for the campaign: she will travel mostly with the Vice
        President; when she goes alone, in each town a lunch or reception with Democratic women and talks on child health,
        retarded children especially, and a press meeting, not a "press conference." The Vice President and Mrs. Johnson discuss
        "with happy frankness" their opinions of Senators McGovern and McCarthy. The Humphreys leave about 3.'
      n: '[[w.johnson-white-house-diary]], 700–01 (Lady Bird Johnson''s account). What was said of the two Senators is not
        given. The Humphreys came on "the first plane" of the day. See [[cal.1968-08-09.elections-1968]]. Made public: 1970.
        Names: Humphrey, Lady Bird Johnson, McGovern, McCarthy.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lady-bird
      - name:mcgovern-george
      - name:mccarthy-eugene-j
      - state:tx
- add:
    entry:
      id: cal.1968-08-09.elections-1968-johnson
      when: Aug. 9
      date: '1968-08-09'
      thread: elections-1968-johnson
      c: 'LBJ Ranch. Senator Eastland, driven about by Mrs. Johnson with two Mississippi friends, D. A. Biglane and W. O.
        Schurden: "You know your husband is going to be nominated, don''t you?" She: "No, sir, not at all. There is not going
        to be any movement of that sort ... And if he were, he wouldn''t accept." Eastland "somehow, taken aback—a little
        disbelieving." Mrs. Johnson thinks he would rather see Johnson nominated than anyone now considered. His two friends,
        "ardent LBJ supporters," say Johnson is "the only man for the Democratic Party."'
      n: '[[w.johnson-white-house-diary]], 701–02 (Lady Bird Johnson''s account). Her judgments of Eastland''s preference
        and of his friends are her own. See [[cal.1968-08-09.court-fortas]]. Made public: 1970. Names: Eastland, Lady Bird
        Johnson, Johnson.'
      tags:
      - name:eastland-james-o
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:tx
      - state:ms
- add:
    entry:
      id: cal.1968-08-09.cities-and-housing-2
      when: Aug. 9
      date: '1968-08-09'
      thread: cities-and-housing
      c: 'LBJ Ranch. Secretary Weaver, Joseph Califano and Edgar Kaiser, with his son and an assistant, fly in on the "Washington
        shuttle" for a meeting with Johnson. Mrs. Johnson learns later of "an effort to get started some inexpensive housing":
        Johnson has challenged Kaiser and about ten builders to produce a prototype of small houses to sell for five thousand
        dollars or less, to be built in Austin before he leaves office.'
      n: '[[w.johnson-white-house-diary]], 701–02 (Lady Bird Johnson''s account). She was not at the meeting; she learned
        of it later. The $5,000 figure and the builders are her account. Names: Weaver, Califano, Kaiser, Johnson, Lady Bird
        Johnson.'
      tags:
      - name:weaver-robert-c
      - name:califano-joseph-a-jr
      - name:kaiser-edgar-f
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - state:tx
      - city:austin
- add:
    entry:
      id: cal.1968-08-20.soviet-union-3
      when: Aug. 20
      date: '1968-08-20'
      thread: soviet-union
      c: 'The White House. Walt Rostow to Mrs. Johnson, asked whether anything good is to happen in the next day or two: "It
        looks as if the Russians have emptied their out-basket to us. They have answered all of the President''s correspondence."
        Staff talk of a press conference for Wednesday morning; all roadblocks to the nuclear talks seem overcome.'
      n: '[[w.johnson-white-house-diary]], 703–04 (Lady Bird Johnson''s account). The press conference of Wednesday is not
        described. Names: Rostow, Lady Bird Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lady-bird
      - city:washington
      also:
      - testing-missile-talks
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-22
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      c: 'The convention, the night of Aug. 27, by Mrs. Johnsons account from television at the Ranch: "favorite son delegations
        began releasing their delegates for Humphrey . . . first Texas, then South Carolina, and then Tennessee."'
      n: '[[w.johnson-white-house-diary]], 706 (Lady Bird Johnson''s account, as she watched; then the convention moves "toward
        the bitterest fight of all, the crucial Vietnam plank"). See [[cal.1968-08-27.elections-1968-chicago-20]]. Names:
        Humphrey, Lady Bird Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lady-bird
      - state:tx
      - state:sc
      - state:tn
- add:
    entry:
      id: cal.1968-09-09.press-and-broadcasting
      when: Sept. 9
      date: '1968-09-09'
      thread: press-and-broadcasting
      c: 'The White House, Lincoln Sitting Room. Mrs. Johnson interviewed by James Egan for Good Housekeeping on her plans
        after January: an hour "trying to maintain a course between guarded and candid." What she names: "Always, always,
        I will be working on parks and conservation," the homes of all the Presidents, the local theater, travel, and the
        "prosaic and necessary things," unpacking thirty years of possessions and settling a daughter and her baby at home.'
      n: '[[w.johnson-white-house-diary]], 708–09 (Lady Bird Johnson''s account). Her account of what she said; the published
        words are not given. To check: the Good Housekeeping piece. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-09-24.court-fortas
      when: Sept. 24
      date: '1968-09-24'
      thread: court-fortas
      c: The Capitol, Senator Ellender's hideaway, the annual "Louisiana Gumbo" luncheon for seventeen women, Ellender cooking.
        He "talked about the Fortas nomination—foreboding, painful estimate that he did not think a cloture vote could be
        obtained to stop a filibuster . . . and that would mean dooming the appointment of Abe." Mrs. Johnson gives him a
        birthday cake; Lynda Johnson Robb among the guests.
      n: '[[w.johnson-white-house-diary]], 709–10 (Lady Bird Johnson''s account). The words are Mrs. Johnson''s paraphrase
        of Ellender, not a quotation of him. See [[cal.1968-06-26.court]]. Names: Ellender, Fortas, Lady Bird Johnson.'
      tags:
      - name:ellender-allen-j
      - name:fortas-abe
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-09-24.conservation
      when: Sept. 24
      date: '1968-09-24'
      thread: conservation
      c: The White House front lawn, 4 p.m. Representatives of the American Association of Nurserymen present Mrs. Johnson
        with a booklet, "Landscape Beauty Depends on People," on landscaping a front door or backyard and on beauty as a community
        effort.
      n: '[[w.johnson-white-house-diary]], 710 (Lady Bird Johnson''s account). The only account; no remarks are given. Names:
        Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-09-28.court-fortas
      when: Sept. 28
      date: '1968-09-28'
      thread: court-fortas
      c: The White House, evening. Johnson asks Carol and Abe Fortas to dinner. Carol Fortas "is quite sure it is all over—Abe
        has lost. Senator Dirksen's complete turnaround was the end." Fortas is "very quiet, contained, and dignified." They
        talk of "the future of the country, the temper of the time, the campaigns of Nixon and of Humphrey—the likelihood
        that there might be a swing to strong conservatism," and of "the heritage of McCarthy the first and McCarthy the second."
        Mrs. Johnson expects "the end" in the next week.
      n: '[[w.johnson-white-house-diary]], 712–13 (Lady Bird Johnson''s account). Carol Fortas''s view as Mrs. Johnson gives
        it; Dirksen''s "turnaround" is not further described. See [[cal.1968-09-24.court-fortas]]. Made public: 1970. Names:
        Fortas, Johnson, Dirksen, Nixon, Humphrey, Lady Bird Johnson.'
      tags:
      - name:fortas-abe
      - name:johnson-lyndon-b
      - name:dirksen-everett
      - name:nixon-richard-m
      - name:humphrey-hubert-h
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-07-06.elections-1968-2
      when: July 6–8
      date: '1968-07-06'
      thread: elections-1968
      c: 'San Salvador, an evening of the Central American meeting. Johnson, to a small group of staff including Mrs. Johnson,
        on the politics of the day: a "great tide running—a great pendulum swinging" toward authoritarianism and conservatism
        in response to "the permissiveness, the lawlessness of the day"; a part of him "would welcome it . . . think it necessary,"
        another part says it would set back "the attacks on ignorance, poverty, and disease" many decades. Asked whether student
        draft-card and flag burning and rioting blunted his faith in education, he says no: "just an episode, a phenomenon
        that will pass"; the professors, long poorly paid and of low prestige, "were now feeling power for the first time."'
      n: '[[w.johnson-white-house-diary]], 713–14 (Lady Bird Johnson''s account). The diary recalls the evening on Sept. 28
        and gives only "that evening in July in San Salvador"; the meeting was July 6–8. The words are Mrs. Johnson''s recollection
        ("something like this"), not a record. See [[cal.1968-07-06.latin-america]]. Made public: 1970. Names: Johnson, Lady
        Bird Johnson. Check: the day of the evening in San Salvador.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-10-02.conservation-2
      when: Oct. 2
      date: '1968-10-02'
      thread: conservation
      c: Washington, Hobart Street. Mrs. Johnson and the Beautification Committee, by bus, dedicate the Hobart Community Parks,
        two parklets in a low-income area, a gift to the city of David Lloyd Kreeger.
      n: '[[w.johnson-white-house-diary]], 715 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-10-02.conservation-3
      when: Oct. 2
      date: '1968-10-02'
      thread: conservation
      c: 'The White House library, after the Hobart parks. The Beautification Committee meets: Nash Castro and Walter Washington
        describe the "Summer in the Parks" program, community concerts, plays, bus trips and cookouts.'
      n: '[[w.johnson-white-house-diary]], 715 (Lady Bird Johnson''s account). See [[cal.1968-10-02.conservation-2]]. Names:
        Washington.'
      tags:
      - name:washington-walter-e
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-10-02.africa
      when: Oct. 2
      date: '1968-10-02'
      thread: africa
      c: The White House, South grounds, 11:30 a.m. Johnson and Mrs. Johnson at the arrival ceremony for President François
        Tombalbaye of Chad, the first State visit handled by Chief of Protocol Abell; Tombalbaye speaks only French.
      n: '[[w.johnson-white-house-diary]], 714 (Lady Bird Johnson''s account). To check: the Public Papers, the arrival remarks.
        Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - city:washington
- add:
    entry:
      id: cal.1968-10-02.africa-2
      when: Oct. 2
      date: '1968-10-02'
      thread: africa
      c: The White House, from a little past 8 p.m. State Dinner for President Tombalbaye of Chad, in the Yellow Room first
        with his Ministers. He tells Mrs. Johnson that parts of his country have never had rain; they discuss his coming trip
        to Lubbock, Texas, and Texas Tech, where the problems of arid countries are studied.
      n: '[[w.johnson-white-house-diary]], 715 (Lady Bird Johnson''s account; the toasts are not given). To check: the Public
        Papers, the toasts. See [[cal.1968-10-02.africa]]. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-10-05.elections-1968-humphrey
      when: Oct. 5
      date: '1968-10-05'
      thread: elections-1968-humphrey
      c: 'Louisville, Kentucky. Mrs. Johnson campaigns for Humphrey and the Democratic ticket. At the airport, Republican
        Mayor Schmied, Lieutenant Governor Wendell Ford, running for Governor, and Katherine Peden, running for the Senate;
        Job Corps men; at the Sheraton, Ford makes her "an Admiral of all the Waterways of Kentucky." To nine hundred at the
        Kentucky Democratic Women''s Club luncheon, Governor Breathitt beside her, about twelve minutes on the last eight
        years and why they should continue under Humphrey, "without vindictiveness and bitter hatred ... a builder, a unifier,
        who does not try to set American against American"; nothing against the other candidates. She leaves "uneasy about
        Democratic chances in November." One sign: "I am in favor OF A SLIGHTLY DISHONORABLE PEACE!"'
      n: '[[w.johnson-white-house-diary]], 716–17 (Lady Bird Johnson''s account). The speech as she quotes it, not a text.
        Names: Lady Bird Johnson, Humphrey, Peden, Breathitt.'
      tags:
      - name:johnson-lady-bird
      - name:humphrey-hubert-h
      - name:peden-katherine-graham
      - name:breathitt-edward-t
      - name:schmied-kenneth-a
      - state:ky
      - city:louisville
- add:
    entry:
      id: cal.1968-10-08.elections-1968-humphrey
      when: Oct. 8
      date: '1968-10-08'
      thread: elections-1968-humphrey
      c: The White House bowling alley. Mrs. Johnson bowls with Muriel Humphrey and Jane Muskie "preceded by enough press
        and photographers to record a 'Summit Meeting'"; she scores a poor third. The next day's coverage was "widespread
        ... in columns, pictures, and news stories."
      n: '[[w.johnson-white-house-diary]], 718 (Lady Bird Johnson''s account). The day is Tuesday, Oct. 8. Names: Lady Bird
        Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-23
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      c: 'Chicago. The convention''s women''s luncheon and style show: Abigail McCarthy, Muriel Humphrey and Mrs. McGovern
        at the head table; Bess Abell as Dolley Madison. By Liz Carpenter''s report by telephone to Mrs. Johnson, "a wonderful
        women''s luncheon."'
      n: '[[w.johnson-white-house-diary]], 705 (Lady Bird Johnson''s account; the hour not given). Names: Carpenter, Lady
        Bird Johnson.'
      tags:
      - name:carpenter-liz
      - name:johnson-lady-bird
      - city:chicago
- add:
    entry:
      id: cal.1968-11-06.white-house
      when: Nov. 6
      date: '1968-11-06'
      thread: white-house
      c: LBJ Ranch, the hangar, evening. A Mexican dinner for the military personnel assigned to the Texas White House over
        five years; Johnson presents several citations and makes a speech.
      n: '[[w.johnson-white-house-diary]], 732–33 (Lady Bird Johnson''s account; the speech is not given). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1968-12-11.middle-east-kuwait
      when: Dec. 11
      date: '1968-12-11'
      thread: middle-east-kuwait
      c: The White House. State Dinner for the Amir of Kuwait.
      n: '[[w.johnson-white-house-diary]], 751 (Lady Bird Johnson''s account, in the entry for Dec. 12: "last night the Amir
        of Kuwait had been our guest"; no more). To check: the Public Papers, the toasts.'
      tags:
      - city:washington
- add:
    entry:
      id: cal.1968-12-12.middle-east-kuwait
      when: Dec. 12
      date: '1968-12-12'
      thread: middle-east-kuwait
      c: Washington, the Kuwait Embassy, after 7 p.m. The Amir's reception, twelve hundred invited; the Amir at the door with
        Ambassador Talat Al-Ghoussein. In an inner room, over a roast lamb, Johnson talks with the Amir, the Ambassador and
        other men on a low sofa; the Johnsons leave after 9.
      n: '[[w.johnson-white-house-diary]], 754–55 (Lady Bird Johnson''s account; what was said is not given). See [[cal.1968-12-11.middle-east-kuwait]].
        Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1968-12-12.states-and-cities
      when: Dec. 12
      date: '1968-12-12'
      thread: states-and-cities
      c: Nixon has said he will reappoint Walter Washington Mayor of the District; Washington will accept. In the day's news,
        with the names of Nixon's Cabinet.
      n: '[[w.johnson-white-house-diary]], 755 (Lady Bird Johnson''s account). Names: Nixon, Washington. Check: the day.'
      tags:
      - name:nixon-richard-m
      - name:washington-walter-e
      - city:washington
- cite:
    id: cal.1968-10-29.vietnam
    item: '[[w.johnson-white-house-diary]], 728–29 (Oct. 29: the night before Johnson "left a call for 2 a.m." — "General
      Abrams is coming in"; at 2 he jumped up and was downstairs to meet Abrams; "a full-fledged meeting in the Cabinet Room
      which went on for several hours"; Abrams "had been called secretly for final consultation on the bombing halt"; Abrams
      slept, if at all, in the Pineapple Bedroom, "a tightly held secret"; Johnson back about 8 a.m. to bed; the diary names
      no one else at the meeting and no hour of 2:30)'
    units: '?'
- cite:
    id: cal.1968-10-31.vietnam
    item: '[[w.johnson-white-house-diary]], 730–31 (Oct. 31: in the Rose Garden, a little before 3, Johnson to Mrs. Johnson:
      "It looks as if Ellsworth Bunker has done the impossible, in light of all that has gone before. He''s gotten Thieu aboard
      for the bombing halt"; George Christian and Tom Johnson decide on a time "between 7 and 8 tonight"; "a little past 7"
      she and Johnson watch him on all three channels; most of the commentators good; she quotes "I do not know who will be
      inaugurated as the thirty-seventh President of the United States next January. But I do know that I shall do all that
      I can in the next few months to try to lighten his burdens"; the diary has no conference call, no 8 a.m. and no Paris
      terms)'
    units: '?'
- variant:
    id: cal.1968-10-31.vietnam
    unit: A
    witness: w.johnson-white-house-diary
    reads: '"a little past 7" (for 8 p.m.)'
    at: '731'
- cite:
    id: cal.1968-11-06.elections-1968
    item: '[[w.johnson-white-house-diary]], 732 (Nov. 6, LBJ Ranch: "Hubert''s speech of concession was gallant and warm and
      looked to the future. ... I thought Nixon''s speech was also wise and hopeful"; before 8 a.m. the results "fairly firm—victory
      for Nixon," the popular vote "43 point something" each, "Texas had gone for Hubert"; the diary has no telegram, no hour
      and no Nixon sign)'
    units: '?'
- cite:
    id: cal.1968-11-11.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 733–35 (Nov. 11: Mrs. Johnson up early; on the South Lawn the Johnsons greet "the
      President-elect and Pat"; they pose for pictures; to the family sitting room where Marvin Watson waits; "a long visit,
      lasting nearly four hours, proper, circumspect and cordial throughout"; after lunch "the men went over to the Cabinet
      Room"; the diary gives nothing of the Cabinet Room briefing or of Rusk or the press remarks)'
    units: A
- cite:
    id: cal.1968-11-21.program
    item: '[[w.johnson-white-house-diary]], 737–39 (Nov. 21: the party for the National Council on the Arts, "a little past
      6," in the East Room: "Roger Stevens went to the podium and praised Lyndon as having done more for the arts than any
      other President"; the Alvin Ailey Dance Theater, "a beneficiary of a National Council of the Arts grant"; "I could hear
      Lyndon leading" the applause; then the Blue Room receiving line and a buffet, the Council members and many guests; Johnson
      went upstairs to watch Luci and Patrick Nugent on television from Hawaii; the diary calls it "the party," a performance
      and a receiving line, not a dinner)'
    units: A
- cite:
    id: cal.1968-12-12.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 753–55 (Dec. 12: Mrs. Johnson and Luci meet Pat and Tricia Nixon in the West Hall
      and show the family floor; "Lyndon and Mr. Nixon appeared" a little past 7 and "we left the Nixons with Luci" for the
      Amir of Kuwait''s reception at the Embassy; Nixon''s Cabinet names are in the evening news; the diary has no State Department
      reception, no mess and no Oval Office talk)'
    units: '?'
- cite:
    id: cal.1969-01-14.program
    item: '[[w.johnson-white-house-diary]], 764–68 (Jan. 14: Mrs. Johnson in the House gallery with Lynda and Luci; "they
      began to rise and applaud and broke out into cheering on both sides, Republican and Democrat"; Johnson, at the Speaker''s
      stand, "paused a full several moments to receive and absorb the ovation"; the Cabinet, "a special wave of applause as
      Dean Rusk came in"; "President-elect Nixon in the days ahead will need your understanding, just as I did"; thirty-eight
      years since he first stood in the Chamber "as a doorkeeper in the Gallery"; the tribute to the men in Vietnam, "I have
      been honored to be their Commander in Chief"; the ending "But I believe that at least it will be said that we tried";
      Patrick Lyn''s disruption of the gallery omitted here; the diary has no figures)'
    units: N
- cite:
    id: cal.1969-01-17.voting-rights
    item: '[[w.johnson-white-house-diary]], 768–69 (Jan. 17: at the National Press Club, Johnson "went directly to the podium";
      "The speech was about three-fourths laughter but toward the end turned sober" and he said his greatest unhappiness on
      leaving office Monday noon would be "that peace has eluded me"; "I have never doubted your energy or your courage or
      your patriotism—that is why I asked General Hershey to get in touch immediately with each of you"; asked if he had brought
      Lyn: "No, Lyn was confined to quarters for recent rambunctious behavior"; the diary calls it a farewell to the press
      corps with "remarks," and does not give the Voting Rights Act)'
    units: '?'
- cite:
    id: cal.1969-01-20.conservation
    item: '[[w.johnson-white-house-diary]], 771–72 (Jan. 19: "One of these was what to do about setting aside seven million
      acres of land for National Parks that Stew Udall had recommended. The conservationist in Lyndon was excited by the idea,
      but the old Congressman of twenty-four years'' tenure withdrew from it. He really doesn''t believe in government by
      executive order, but in a mutual working together of the Congress and the President"; the diary gives no proclamations
      and no Marble Canyon)'
    units: '?'
- cite:
    id: cal.1969-01-20.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 775–79 (Jan. 20: the Nixons arrive at the North Portico for coffee in the Red
      Room; the Red Room gathers the Agnews, Dirksen, Speaker McCormack, Mansfield, Gerald Ford, Senator Jordan and Carl Albert;
      the motorcade down Pennsylvania Avenue with "very few people"; the Capitol, Mrs. Eisenhower in Senator Margaret Chase
      Smith''s office; the ceremony "only about forty-five minutes"; the inaugural address, which the papers said was "seventeen
      minutes long," Nixon "rather quickly, in an even voice"; "no high trumpet calls to action"; Warren and the oath are
      not described; "Hail to the Chief" played for Johnson "the last time")'
    units: A, G
- cite:
    id: cal.1969-01-20.transition-and-staff-2
    item: '[[w.johnson-white-house-diary]], 776, 779–81 (Jan. 20: the Cliffords'' lunch for about sixty, the crowd on the
      lawn with signs; "Lyndon told us that early this morning he had conferred the Medal of Freedom on Clark and Averell
      and Bill White and seventeen others. He read Clark''s citation and Harriman''s and gave them to them"; Bill White''s
      would be sent to him; on the porch Johnson said into Ray Scherer''s microphone that he had been part of Washington for
      more than thirty years and would come back to visit; then Andrews and Air Force One; that morning Johnson showed her
      citations for Mary Lasker and Laurance Rockefeller, of "a list of about twenty names": twenty medals that day in all,
      three of them named at the lunch; not Rusk or Rostow, not Bethesda for the house)'
    units: '?'
- cite:
    id: cal.1968-07-01.testing
    item: '[[w.johnson-white-house-diary]], 692–93 (July 1, the East Room at 11:30: the table brought from the Treaty Room,
      Dobrynin, Sir Patrick Dean, William Foster, Rusk, Johnson; Rusk speaks, then Dean and Dobrynin; "fifty-eight non-nuclear
      nations" with the three powers signed, by her count, and the same ceremony in Moscow and London; Johnson announced that
      the United States and the Soviet Union would begin talks "in the nearest future" on limiting and reducing offensive
      nuclear missiles and antimissile systems; his words "We have no illusions that it will be"; Arthur Goldberg''s wife
      Dorothy: "Today was worth leaving the Court for"; not the IAEA, the count at Washington or Rusk''s word to Dobrynin)'
    units: '?'
- cite:
    id: cal.1968-07-19.vietnam
    item: '[[w.johnson-white-house-diary]], 696–97 (July 20, LBJ Ranch: Jim Jones on Air Force One tells her they are en route
      home from "the meeting in Honolulu," arriving "a little before 10"; Johnson, "about 11 o''clock Saturday night," says
      "it had been a good trip" and "Thieu was as cooperative as he could be, caught in all the tides of demands of his own
      country, his allies, the enemy"; he had left for Honolulu "at 11 Thursday morning"; the diary has no joint statement,
      no force figures)'
    units: '?'
- cite:
    id: cal.1968-08-01.civil-rights-the-executive
    item: '[[w.johnson-white-house-diary]], 699 (Aug. 1: Johnson reached the Monroneys'' dinner at a quarter of 10, having
      "just been addressing the National Bar Association" and said "this organization of Negro lawyers had given him a wonderful
      ovation"; her report of his words, not the plaque or the appointments)'
    units: '?'
- cite:
    id: cal.1968-08-09.court-fortas
    item: '[[w.johnson-white-house-diary]], 702 (Aug. 9: Eastland''s visit; "Lyndon was back greeting the Senator and his
      friends warmly"; "I think Lyndon was trying to blunt Eastland''s hostility to Abe Fortas, if not to win him over ...
      to explain Fortas as we know him," her inference; "the raillery, reminiscences, play of their two personalities"; the
      plane landed at the Ranch; nothing of what Eastland said, no "inch," no vote count)'
    units: '?'
- cite:
    id: cal.1968-08-10.elections-1968
    item: '[[w.johnson-white-house-diary]], 702–03 (Aug. 10, LBJ Ranch: "Secretary Rusk, Dick Helms, and Cy Vance came down
      by plane early this morning for the briefing with the new Republican candidates and sat on the lawn with Lyndon"; Nixon
      "about noon," cordial and confident, Agnew behind him; "the men worked for about an hour and a half" and then lunch,
      steak and fresh corn, with Rusk and Agnew beside Mrs. Johnson and Nixon on Johnson''s right; Pat Nixon and Mrs. Agnew
      invited, Mrs. Nixon declined for a daughter''s sore throat; the diary gives no hour 12:25, no Helms or Czechoslovakia
      remarks, no Paris)'
    units: E
- cite:
    id: cal.1968-08-20.elections-1968-chicago-3
    item: '[[w.johnson-white-house-diary]], 704 (Aug. 20, late that evening: "Dean was testifying before the Platform Committee
      of the Democratic Convention," "making a statement on Vietnam, a strong, clear, effective statement, when someone came
      up to him and handed him a note. He asked the Committee''s pardon and turned to go—it was about the invasion of Czechoslovakia
      by the Russians"; she watched on television)'
    units: '?'
- check:
    id: cal.1968-08-20.elections-1968-chicago-3
    text: 'Check: the diary has Rusk "making a statement on Vietnam" when someone handed him a note, not finished, and no
      Boggs reading a dispatch ([[w.johnson-white-house-diary]], 704).'
- cite:
    id: cal.1968-08-20.soviet-union
    item: '[[w.johnson-white-house-diary]], 704 (Aug. 20, evening: Mrs. Johnson, listening to Rusk on television, learns of
      the invasion of Czechoslovakia from the note handed him; "I gathered that Lyndon had learned about this only a short
      while before, although he and his advisers had concluded at lunch that it might well happen"; a National Security Council
      meeting "which Lyndon had already called"; Johnson "ate hurriedly and went back to his office"; the diary gives no hour)'
    units: '?'
- cite:
    id: cal.1968-08-27.elections-1968-chicago-11
    item: '[[w.johnson-white-house-diary]], 705 (the Monday night, Aug. 26–27: "some contingents had had the presumption to
      contest the seating of the Texas delegation, I couldn''t possibly go to bed until John Connally had won that fight!";
      she stayed up until 3; not the vote or the hour)'
    units: '?'
- cite:
    id: cal.1968-09-24.elections-1968
    item: '[[w.johnson-white-house-diary]], 711–12 (Sept. 24: about 8 p.m. Mrs. Johnson found "Lyndon and Clark swimming"
      in the pool, "the men''s conversation was purposeful, probing, and tense"; dinner about 9:30 with houseguests; Johnson
      and Clifford then talked "earnestly on the green sofa in the West Hall" till 12:30; what she overheard was "all the
      portents of the Czechoslovakian tensions—of the situation in West Germany, of Russia''s intentions, Moscow''s possible
      moves into Yugoslavia or Romania"; the diary says nothing of Humphrey, and puts the talk at the pool and the sofa, not
      at dinner)'
    units: '?'
- cite:
    id: cal.1968-10-01.court
    item: '[[w.johnson-white-house-diary]], 714 (Oct. 2: "Senate Rejects Fortas Cloture—the vote, 45 to 43—almost the last
      page in this long agony in the nomination of Abe to be Chief Justice," the front-page headline of Oct. 2)'
    units: '?'
- cite:
    id: cal.1968-10-02.conservation
    item: '[[w.johnson-white-house-diary]], 714–15 (Oct. 2, the East Room, a little past 1: the signing of "the four landmark
      bills" Redwood National Park, the North Cascades National Park, "a system of urban and rural trails, including the Pacific
      Coast Trail from Mexico to Canada," and the National Wild and Scenic Rivers System, "reserving sections of eight rivers,
      with twenty-seven more under study"; Johnson gave the first pen to Senator Hayden and one to her; the redwoods "a thousand
      years old and ... up to 367 feet"; the Redwood park 58,000 acres; not the statutes or Johnson''s words)'
    units: A-D
