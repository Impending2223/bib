- add:
    entry:
      id: cal.1968-01-17.press-and-broadcasting
      when: Jan. 17
      date: '1968-01-17'
      thread: press-and-broadcasting
      c: 'National Educational Television''s program on the State of the Union, after the Message: the panelists Edwin Reischauer
        and Daniel Patrick Moynihan, to Mrs. Johnson "support from an unexpected quarter"; "the most amusing remarks" by William
        Buckley; Bill Moyers; Arthur Schlesinger, "so bitter I found him funny"; the new Mayor of Cleveland, Carl Stokes,
        "reasonable and articulate and mostly fair." She and about fifteen guests watch it in her bedroom at the White House:
        "we won more than we lost."'
      n: '[[w.johnson-white-house-diary]], 619–20 (Lady Bird Johnson''s account). That there is never enough money for the
        Mayors is her gloss on Stokes, not his words. The hour is not given. See [[cal.1968-01-17.program]]. Names: Lady Bird
        Johnson, Reischauer, Moynihan, Buckley, Moyers, Schlesinger, Stokes.'
