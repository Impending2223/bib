    entry:
      id: cal.1968-01-04.economy
      when: Jan. 4
      date: '1968-01-04'
      thread: economy
      c: 'Austin office. Johnson on staff talks with Shriver, Schultze and Charles Zwick, at the season of the budget. Mrs.
        Johnson: "The budget must be slashed, and saying ''No'' is an exhausting, draining business." She expects Zwick to
        take Schultze''s place at the Budget Bureau.'
      n: '[[w.johnson-white-house-diary]], 611 (Lady Bird Johnson''s account). Made public: 1970. Names: Johnson, Shriver,
        Schultze, Zwick, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:shriver-r-sargent
      - name:schultze-charles-l
      - name:zwick-charles-j
      - name:johnson-lady-bird
