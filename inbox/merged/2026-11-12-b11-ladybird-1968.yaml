      c: Washington, the afternoon. Mrs. Johnson, Laurance Rockefeller and Brooke Astor make a quick call at Buchanan School,
        which the Astor Foundation is converting into a combination school playground and community center.
      n: '[[w.johnson-white-house-diary]], 616 (Lady Bird Johnson''s account). The hour is not given. Names: Lady Bird Johnson,
