      id: cal.1968-03-31.elections-1968-johnson-8
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: The White House, after the address. Rusk telephones Johnson; Mrs. Johnson gets "to say a word."
      n: '[[w.johnson-white-house-diary]], 646 (Lady Bird Johnson''s account; what was said and the hour are not given). See
