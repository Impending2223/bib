      id: cal.1968-05-29.robert-kennedy-campaign-california-2
      when: May 29, evening
      date: '1968-05-29'
      thread: robert-kennedy-campaign-california
      c: 'Los Angeles, the Beverly Hilton, a reception for workers, after a motorcade through downtown. Kennedy: "If I died in Oregon, I hope Los Angeles is Resurrection City." In the motorcade he had told the photographers'' car, "From now on, Los Angeles is my Resurrection City!" By Witcover''s account.'
      n: '[[w.witcover-85-days]], 235. See [[cal.1968-05-29.robert-kennedy-campaign]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-05-29.robert-kennedy-campaign-california-3
      when: May 29, McCarthy
      date: '1968-05-29'
      thread: elections-1968-mccarthy
      c: 'Stockton, Cal., the day after Oregon. McCarthy: "There''s a line of poetry about summer patriots. There should be something about spring and summer candidates ... They should have been with me in New Hampshire." Gerald Hill, of the California Democratic Council, one of his managers in the State, pronounces Kennedy "eliminated." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 235. Names: McCarthy, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - state:ca
      - city:stockton
      also:
      - robert-kennedy-campaign-california
- add:
    entry:
      id: cal.1968-05-30.robert-kennedy-campaign-california-2
      when: May 30
      date: '1968-05-30'
      thread: robert-kennedy-campaign-california
      c: 'Central Valley, Memorial Day, a whistle-stop through Fresno, Madera, Merced, Turlock, Modesto, Stockton, Lodi and Sacramento. Kennedy on Humphrey''s "politics of joy," and now on McCarthy: "I was the first one of any of the present candidates who ever spoke out against the course we have been following in Vietnam." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 235–36; [[w.schlesinger-journals]], 295 (the Central Valley train, Memorial Day). Names: Robert Kennedy, Humphrey, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
      - state:ca
      - city:fresno
      - city:sacramento
- add:
    entry:
      id: cal.1968-05-30.robert-kennedy-campaign-california-4
      when: May 30, midnight
      date: '1968-05-30'
      thread: robert-kennedy-campaign-california
      c: 'West Oakland, the Taylor Memorial Methodist Church, an unannounced meeting with about 100 of the area''s Black Caucus, Black Panthers among them, arranged by Willie Brown; John Glenn, Barry, Dutton, Rafer Johnson and Stan Tretick of *Look* ride with him. Kennedy to Glenn: "These meetings aren''t very attractive. They need to tell people off. They need to tell me off." They call him "a white big shot" and worse; to Johnson, who would intercede: "No. This is between them and me." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 237–38. Names: Robert Kennedy, Glenn, Dutton.'
      tags:
      - name:kennedy-robert-f
      - name:glenn-john-h-jr
      - name:dutton-frederick-g
      - state:ca
      - city:oakland
- add:
    entry:
      id: cal.1968-06-03.robert-kennedy-campaign-california
      when: June 3, DiMaggio's
      date: '1968-06-03'
      thread: robert-kennedy-campaign-california
      c: 'San Francisco, Fisherman''s Wharf, DiMaggio''s Restaurant, a small group of Italian-Americans. Kennedy, irritated at McCarthy''s charges of foul play in the debate: "The time to say something about someone is when he is there, face to face, rather than when he is five hundred miles away. He wanted to get me in a room with him. He got me in a room with him ... and I thought he was very nice to me." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 249. Names: Robert Kennedy, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:ca
      - city:san-francisco
- add:
    entry:
      id: cal.1968-06-04.robert-kennedy-campaign-california-5
      when: June 4, Mudd
      date: '1968-06-04'
      thread: robert-kennedy-campaign-california
      c: 'Los Angeles, the Ambassador, the CBS room, to Roger Mudd. Of McCarthy: "I think, really, it''s up to him." Mudd asks if the Democratic Party nominating Humphrey would be cutting its own throat in November; Kennedy, wincing: "you use those expressions. I think that the Democratic Party would be making a very bad mistake to ignore the wishes of the people and ignore these primaries." Of delegates "squeezable": "Roger, your language! I don''t like either of those expressions." He hopes McCarthy and he could "come together" now that the primaries are finished. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 258–60. Names: Robert Kennedy, McCarthy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-04.robert-kennedy-campaign-california-6
      when: June 4, McCarthy
      date: '1968-06-04'
      thread: elections-1968-mccarthy
      c: 'Los Angeles, the Beverly Hilton, to David Schoumacher of CBS. McCarthy does not challenge the projections: "We made our real test in Oregon," where there were no minority blocs to distort the results; "We''re demonstrating what we said we would—that I can get votes no other Democrat can get"; "We neglected California to go into Oregon." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 256–57. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:ca
      - city:los-angeles
      also:
      - robert-kennedy-campaign-california
