- cite:
    id: cal.1968-04-03.robert-kennedy
    item: '[[w.witcover-85-days]], 136–37 (10 a.m., the Cabinet Room; Rostow and Charles S. Murphy with Johnson, Sorensen with Kennedy; a Hanoi message read; about an hour; Johnson will not run and will not take sides; Christian: neither asked "for any specific thing"; not B–D)'
