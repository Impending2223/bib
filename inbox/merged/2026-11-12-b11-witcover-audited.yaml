- cite:
    id: cal.1968-03-13.robert-kennedy
    item: '[[w.witcover-85-days]], 68, 72 (Wednesday noon, National Airport, to Donaldson of ABC: "I am actively reconsidering the possibilities that are available to me, and I imagine that other people around the country are doing the same"; to another reporter, "reassessing the possibility of whether I will run against President Johnson"; the five reasons; later, after the taping, the meeting with McCarthy in Edward Kennedy''s office, curt and cool, McCarthy to pursue his own course; not Kennedy''s offer to support him in Wisconsin or the one term)'
    units: '?'
- cite:
    id: cal.1968-03-13.elections-1968
    item: '[[w.witcover-85-days]], 70–75 (Steve Smith''s apartment, 1030 Fifth Avenue, from about 4 p.m.; some twenty advisers; Sorensen the one still arguing against, on keeping the party''s latent support; the Cronkite show watched; a call from Sorensen about the White House asking for names for the Vietnam commission; not B, C or D)'
    units: E, F
- cite:
    id: cal.1968-03-14.robert-kennedy
    item: '[[w.witcover-85-days]], 76–80 (Thursday, 11 a.m., the Pentagon, Kennedy, Sorensen and Clifford; the Administration''s list of seven, Kennedy among them, with Mansfield, Aiken and Cooper added; Kennedy says his declaration "would no longer be necessary" if the commission signaled a wider path; Clifford relays Johnson''s rejection about 5 p.m.)'
    units: '?'
- cite:
    id: cal.1968-03-15.robert-kennedy-campaign
    item: '[[w.witcover-85-days]], 83 (Kings Point, the home of Mrs. Anita Richmond, more than a hundred housewives; to a woman, "Well, you can help me in this great effort I''m going to undertake"; not the 175, the nine o''clock or "Yes, I have")'
    units: '?'
