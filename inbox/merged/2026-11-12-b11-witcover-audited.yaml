    item: '[[w.witcover-85-days]], 51–52 (Hickory Hill, the telethon weekend, Sunday afternoon, Feb. 18, in the pool cabana with Edward Kennedy, Burke Marshall, vanden Heuvel and Goodwin: "the decision again was that he couldn''t make the race"; Goodwin, driving to Dulles with Kennedy: he will go to New Hampshire and work for McCarthy; the decision the group''s, not B''s words)'
