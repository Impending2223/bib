    entry:
      id: cal.1968-03-10.robert-kennedy-campaign-decision-2
      when: Mar. 10
      date: '1968-03-10'
      thread: robert-kennedy-campaign-decision
      c: 'Los Angeles, back from Delano. Robert Kennedy telephones Unruh: he probably will run. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 62. See [[cal.1968-03-10.robert-kennedy]]. Names: Robert Kennedy, Unruh.'
