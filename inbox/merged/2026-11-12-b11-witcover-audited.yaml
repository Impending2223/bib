    unit: D
    witness: w.witcover-85-days
    reads: 'Witcover: as the plane left Muncie in early evening, "a reporter who had just called his office rushed up the aisle and told him" that King had been shot; Dutton learned of his death at Weir Cook Airport.'
    at: '139'
- cite:
    id: cal.1968-04-04.robert-kennedy-campaign-2
    item: '[[w.witcover-85-days]], 142 (back at the Marott Hotel Kennedy telephones Coretta King; she asks that King''s body be brought back from Memphis to Atlanta; he will take care of it; Burke Marshall asked to fly to her; not the words)'
    units: A
- cite:
    id: cal.1968-04-05.robert-kennedy
    item: '[[w.witcover-85-days]], 142–44 (the City Club of Cleveland; the quotations)'
    units: '?'
- cite:
    id: cal.1968-04-05.king-4
    item: '[[w.witcover-85-days]], 142 (the call to Mrs. King and the chartered plane for the body)'
    units: B
- variant:
    id: cal.1968-04-05.king-4
    unit: A
    witness: w.witcover-85-days
    reads: 'Witcover: Kennedy "phoned Dr. King''s wife, Coretta" from the Marott Hotel in Indianapolis straight after the rally of the night of Apr. 4, before going on to Cleveland.'
    at: '142'
- cite:
    id: cal.1968-04-09.elections-1968
    item: '[[w.witcover-85-days]], 146 (the night before the funeral, a hotel suite in Atlanta, about 10:30 p.m.: Cosby, Sammy Davis Jr., Nancy Wilson, Belafonte, Poitier, Alan King, Gazzara; Kennedy "sat in a corner and listened"; not the words or Bond)'
    units: '?'
- variant:
    id: cal.1968-04-09.elections-1968
    unit: A
    witness: w.witcover-85-days
    reads: 'Witcover: the entertainers met Kennedy about 10:30 p.m. the night before the funeral (Apr. 8), in his hotel suite, after the Lear jet flight from Washington.'
    at: '146'
- cite:
    id: cal.1968-04-09.robert-kennedy
    item: '[[w.witcover-85-days]], 146 (the third group, Abernathy, Young and other SCLC leaders, talked on until nearly 3 a.m., the night before the funeral; not Bevel or Williams or the words)'
    units: '?'
- variant:
    id: cal.1968-04-09.robert-kennedy
    unit: A
    witness: w.witcover-85-days
    reads: 'Witcover: the SCLC leaders came in the night before the funeral (Apr. 8) and "talked on until nearly 3 o''clock."'
    at: '146'
- cite:
    id: cal.1968-04-10.transition-and-staff
    item: '[[w.witcover-85-days]], 146 (O''Brien on Apr. 10 announces his resignation from the Cabinet to join Kennedy in Indiana)'
    units: '?'
- cite:
    id: cal.1968-04-10.robert-kennedy-campaign
    item: '[[w.witcover-85-days]], 146 (Fort Wayne, Columbus and Terre Haute, Apr. 10 on, on "lawlessness and violence," jobs in place of "welfare handouts"; not the quotation)'
    units: '?'
- cite:
    id: cal.1968-04-11.robert-kennedy-2
    item: '[[w.witcover-85-days]], 147–48 (the Jack Tar Hotel; the rifle on a nearby roof reported by police through Barry to Dutton; Dutton draws the curtains, Kennedy: "Don''t close them. If they''re going to shoot, they''ll shoot."; down to the basement garage, then out of the car to work the crowd three or four minutes)'
    units: A, B, C, D
- cite:
    id: cal.1968-04.robert-kennedy-campaign-primaries-2
    item: '[[w.witcover-85-days]], 155–56 (Vincennes, the Civitan Club luncheon, the first day after the return to Indiana, Apr. 22; the question on the anti-rat legislation: "Do you know there are more rats in New York than people, and there are nine million people there?"; "You can smile. It''s true"; not the other lines)'
    units: A
- variant:
    id: cal.1968-04.robert-kennedy-campaign-primaries-2
    unit: D
    witness: w.witcover-85-days
    reads: 'Witcover: "You can smile. It''s true."'
    at: '156'
- check:
    id: cal.1968-04.robert-kennedy-campaign-primaries-2
    text: 'Check: the day: [[w.witcover-85-days]], 155–56, puts the Vincennes Civitan Club luncheon on Apr. 22, the first day after Kennedy''s return to Indiana.'
- cite:
    id: cal.1968-04-26.robert-kennedy-campaign
    item: '[[w.witcover-85-days]], 165–66 (Apr. 26, Indiana University Medical Center, about 800 students: "From you"; "You sit here as white medical students, while black people carry the burden of the fighting in Vietnam"; not the flu or the doctors)'
    units: B, C
- cite:
    id: cal.1968-04-30.elections-1968-2
    item: '[[w.witcover-85-days]], 170 (Rockefeller at Albany: he will actively seek the Republican nomination, staying out of the primary States; not the Massachusetts primary)'
    units: A
- cite:
    id: cal.1967-10-08.robert-kennedy
    item: '[[w.witcover-85-days]], 33–34 (the first meeting of any sort, a Sunday in late October in New York, in Salinger''s suite at the Regency; Ted Kennedy, Smith, Dutton, O''Donnell, Goodwin, Sorensen, Schlesinger, Chuck Daley and others; Kennedy stays away, at O''Donnell''s insistence; the consensus against his running; not D or E)'
    units: A, B, C
- check:
    id: cal.1967-10-08.robert-kennedy
    text: 'Check: the day: [[w.witcover-85-days]], 33, puts the meeting on "a Sunday in late October."'
- cite:
    id: cal.1967-11-30.elections-1968
    item: '[[w.witcover-85-days]], 35 (McCarthy announces his candidacy on Nov. 30, having waited "a decent period of time for others to indicate" they would make the test; not the primaries or the quotations)'
    units: '?'
- cite:
    id: cal.1967-12-10.robert-kennedy
    item: '[[w.witcover-85-days]], 37–38 (about two weeks after McCarthy announced, a late Sunday morning brunch in New York at vanden Heuvel''s on Central Park West with Edward Kennedy, Salinger, Sorensen, Schlesinger, Dolan, Dutton and Goodwin, Robert Kennedy present, and a second session at a shipping firm near Madison Avenue; Schlesinger and Goodwin for running, Sorensen against; Kennedy: "My future is not the issue")'
    units: A, B
- cite:
    id: cal.1968-01.robert-kennedy-campaign-decision
    item: '[[w.witcover-85-days]], 38–39 (a meeting of insiders at Hickory Hill, Robert and Ethel Kennedy, Unruh, O''Donnell, Dutton, Burke Marshall; Ethel asks each what her husband should do; O''Donnell: "if he announces at twelve noon, I''m with him at twelve one"; not the banner)'
    units: '?'
- check:
    id: cal.1968-01.robert-kennedy-campaign-decision
    text: 'Check: the month: Witcover, 38–39, puts the Hickory Hill meeting "around the same time" as the meetings of the Sunday about two weeks after McCarthy''s announcement, December 1967; the entry has January.'
- add:
    entry:
      id: cal.1967-10-15.elections-1968
      when: Oct. 15
      date: '1967-10-15'
      thread: elections-1968
      c: 'Chicago, a Conference of Concerned Democrats, Lowenstein a co-chairman: Senators Church, Hartke, McGovern and McCarthy recommended as possible candidates against Johnson. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 28–29. Names: Lowenstein, Church, Hartke, McGovern, McCarthy, Johnson.'
