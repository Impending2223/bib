- cite:
    id: cal.1968-03-11.robert-kennedy-campaign
    item: '[[w.witcover-85-days]], 62–64 (Monday, Mar. 11, Sorensen at the White House at Johnson''s request through an aide and friend, about two hours; by the Kennedy camp''s version Johnson asks for suggestions and Sorensen proposes a blue-ribbon commission, as after the riots; not Pierson, the Gridiron dinner, "alone" or the White House''s version)'
    units: '?'
