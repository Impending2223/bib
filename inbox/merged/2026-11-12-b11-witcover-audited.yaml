- cite:
    id: cal.1968-03-10.robert-kennedy
    item: '[[w.witcover-85-days]], 61–62 (Sunday, Delano, the Mass in a park at which Chavez broke his fast; Kennedy, Edelman, Seigenthaler and Guthman; not the words; back in Los Angeles Kennedy telephones Unruh that he will probably run, which is not D)'
