by: 'Claude (batch 11 reader, Witcover, 85 Days; Sonnet; PDF pp. 1-329 of 344 read: printed pp. 15-327)'
ops:
- add:
    entry:
      id: cal.1968-01-31.robert-kennedy-campaign-decision
      when: Jan. 31
      date: '1968-01-31'
      thread: robert-kennedy-campaign-decision
      c: 'Dutton, reading the *Washington Post*''s account of the Press Club breakfast, telephones Robert Kennedy: in print "under any foreseeable circumstances" reads flat and final. Kennedy, surprised too, is stuck with it; he had agreed to put the phrase on the record. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 45–46. See [[cal.1968-01-30.robert-kennedy]]. Names: Dutton, Robert Kennedy.'
      tags:
      - name:dutton-frederick-g
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-02-02.robert-kennedy-campaign-decision
      when: Feb. 2
      date: '1968-02-02'
      thread: robert-kennedy-campaign-decision
      c: 'New York, Robert Kennedy''s apartment, three days after the breakfast. A columnist who had been at it, unnamed, finds him second-guessing: is "any foreseeable circumstances" better than "any conceivable circumstances"? Polls show him running well against the prospective Republicans in Nebraska, Iowa, Idaho and parts of Wisconsin; he thinks he could win all or most of the open primaries, but entry would tear the party apart and might bring down Vietnam critics seeking reelection, McGovern among them. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 47–48. Check: the day (the work has "three days later," from Jan. 30). Names: Robert Kennedy, McGovern.'
      tags:
      - name:kennedy-robert-f
      - name:mcgovern-george
- cite:
    id: cal.1968-02.robert-kennedy-campaign-4
    item: '[[w.witcover-85-days]], 51–52 (Hickory Hill, the weekend of the Junior Village telethon, Feb. 17–18: Salinger produces a poll that McCarthy could get 40 percent of New Hampshire''s Democratic vote, "If it''s true, you have to announce before the primary"; Kennedy calls Bill Dunphy, a former Democratic chairman in the State; then shows Salinger Pete Hamill''s letter urging him to run, which, Salinger later, "helped Kennedy over the brink"; not Kennedy''s words)'
    units: A
- variant:
    id: cal.1968-02.robert-kennedy-campaign-4
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: Kennedy calls Bill Dunphy, "a knowledgeable former Democratic chairman in the state": McCarthy "was gaining," Dunphy said, "but he doubted he''d do that well."'
    at: '51'
- check:
    id: cal.1968-02.robert-kennedy-campaign-4
    text: 'Check: the day: [[w.witcover-85-days]], 51, puts Salinger''s poll and Kennedy''s call at Hickory Hill on the weekend of the Junior Village telethon, Feb. 17–18.'
- add:
    entry:
      id: cal.1968-03-03.robert-kennedy-campaign-decision
      when: Mar. 3
      date: '1968-03-03'
      thread: robert-kennedy-campaign-decision
      c: 'Hickory Hill, Sunday. Mankiewicz, arriving at National Airport, telephones Kennedy to remind him of a television documentary on Bedford-Stuyvesant; Kennedy tells him talks go on about his candidacy, his first hard knowledge it has reached the decision stage. "Want to take my vote?" "Yes." Mankiewicz: "Go in everything after Wisconsin." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 54. See [[cal.1968-03-02.robert-kennedy-campaign]]. Names: Mankiewicz, Robert Kennedy.'
      tags:
      - name:mankiewicz-frank
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-03-04.robert-kennedy-campaign-decision
      when: Mar. 4
      date: '1968-03-04'
      thread: robert-kennedy-campaign-decision
      c: 'Dolan tells Kennedy of a quirk in California''s law: thirty days before the Apr. 5 deadline for a delegate slate, a committee of registered Democrats must file a statement of intent, naming no candidate. Kennedy, undecided, says it ought to be met, quietly, and that Unruh be asked. Dolan calls off the group he and Mankiewicz had found and telephones Unruh, who will get seven lawyers. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 56–57. Check: the day (the work has "Tuesday, March 4"; Mar. 4, 1968, was a Monday, and the filing is "the next day, March 5"). See [[cal.1968-03-02.robert-kennedy-campaign]]. Names: Dolan, Robert Kennedy, Mankiewicz, Unruh.'
      tags:
      - name:dolan-joseph-f
      - name:kennedy-robert-f
      - name:mankiewicz-frank
      - name:unruh-jesse-m
      - state:ca
- add:
    entry:
      id: cal.1968-03-05.robert-kennedy-campaign-decision
      when: Mar. 5
      date: '1968-03-05'
      thread: robert-kennedy-campaign-decision
      c: 'Sacramento, the deadline for a statement of intent to run a Kennedy slate. Fifteen minutes before it, a UPI reporter there telephones Mankiewicz: five women have taken out Kennedy papers on their own, saying they would have been told not to had they asked. Five minutes later Unruh''s seven lawyers file, just under the deadline. Mankiewicz later: "The vaunted Kennedy machine ... almost blew it." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 57. See [[cal.1968-03-02.robert-kennedy-campaign]]. Names: Mankiewicz, Unruh.'
      tags:
      - name:mankiewicz-frank
      - name:unruh-jesse-m
      - state:ca
      - city:sacramento
- add:
    entry:
      id: cal.1968-03-07.robert-kennedy-campaign-decision
      when: Mar. 7
      date: '1968-03-07'
      thread: robert-kennedy-campaign-decision
      c: 'Kennedy''s Senate office, an off-the-record lunch with Walter Cronkite, back from Vietnam. Cronkite, hearing his views on the war: "If you feel that way you ought to run." Kennedy: "Give me five reasons." Kennedy asks whether he is a Democrat, to run for the Senate in New York; Cronkite, an independent, says it is out of the question. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 58. Names: Robert Kennedy, Cronkite.'
      tags:
      - name:kennedy-robert-f
      - name:cronkite-walter
- add:
    entry:
      id: cal.1968-03-07.robert-kennedy-campaign-decision-2
      when: Mar. 7, evening
      date: '1968-03-07'
      thread: robert-kennedy-campaign-decision
      c: 'CBS Evening News carries John Hart''s report that Kennedy is reexamining his position and about ready to announce. Cronkite, afraid he has betrayed the lunch, telephones; Kennedy answers through Mankiewicz from the Senate floor: "The Senator says that you can say he''s considering running for President just as Walter Cronkite is considering running for the Senate in New York." The report causes little stir. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 58–59. Names: Robert Kennedy, Cronkite, Mankiewicz.'
      tags:
      - name:kennedy-robert-f
      - name:cronkite-walter
      - name:mankiewicz-frank
- add:
    entry:
      id: cal.1968-03-08.robert-kennedy-campaign-decision
      when: Mar. 8
      date: '1968-03-08'
      thread: robert-kennedy-campaign-decision
      c: 'Capitol Hill office. Kennedy, for about ninety minutes, to Haynes Johnson of the *Washington Star*: he cannot live with the war, yet if he ran against Johnson everybody would say vendetta and ruthlessness; he has no doubt the President is on the ropes; McCarthy will do well in New Hampshire and beat Johnson in Wisconsin. The reporter''s note: "Certain he will run." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 60. Names: Robert Kennedy, McCarthy, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-10.robert-kennedy-campaign-decision
      when: Mar. 10
      date: '1968-03-10'
      thread: robert-kennedy-campaign-decision
      c: 'The day of Delano. Robert Kennedy telephones Sorensen in New York, one of the last holdouts: "I really think I have got to go." Sorensen: "I don''t see how you are going to get a majority of the delegates." Sorensen says he will see Johnson the next afternoon, at the President''s request. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 62. See [[cal.1968-03-10.robert-kennedy]]. Names: Robert Kennedy, Sorensen, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:sorensen-theodore-c
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-11.robert-kennedy-campaign-decision-2
      when: Mar. 11
      date: '1968-03-11'
      thread: robert-kennedy-campaign-decision
      c: 'Senate, Kennedy walking to a vote with Walinsky and James Doyle of the *Boston Globe*, back from Vietnam. Doyle on the destruction and the children; "What are you going to do?" "I don''t know." Back at the office: Doyle, "Get out and salvage some dignity. It''s a military problem. We''re losing the war militarily." Kennedy: "No. It''s a political problem." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 64–66. Names: Robert Kennedy, Walinsky.'
      tags:
      - name:kennedy-robert-f
      - name:walinsky-adam
- add:
    entry:
      id: cal.1968-03-13.robert-kennedy-campaign-decision-4
      when: Mar. 13
      date: '1968-03-13'
      thread: robert-kennedy-campaign-decision
      c: 'Senate office, Bruce Biossat of Newspaper Enterprise Association. Kennedy: New Hampshire showed "the divisions in the Democratic Party are already there and I can''t be blamed for creating them." On charges that he waited and then tried to take McCarthy''s movement: "This is nobody''s movement. I have to do it my way and McCarthy has to do it his way." He dwells on the Kerner Report and Johnson''s reply, cites the Des Moines meeting, and says Daley predicted Johnson would lose to Nixon. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 69–70. Names: Robert Kennedy, McCarthy, Daley, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:daley-richard-j
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-13.robert-kennedy-campaign-decision-5
      when: Mar. 13, evening
      date: '1968-03-13'
      thread: robert-kennedy-campaign-decision
      c: 'Washington, CBS studio, taped late in the afternoon for 6:30 p.m.; Cronkite questions from New York. Kennedy: "I was reluctant to become involved in this struggle because I thought it might turn into a personal conflict between President Johnson and myself." He gives Rusk''s testimony, the Kerner Report and Nixon as reasons; has not talked to McCarthy but wants to. Whether he will support McCarthy: "I want to decide that and what I will do after I have a chance to assess it all." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 70–72. See [[cal.1968-03-13.elections-1968]]. Names: Robert Kennedy, Cronkite, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:cronkite-walter
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-03-13.robert-kennedy-campaign-decision-6
      when: Mar. 13, night
      date: '1968-03-13'
      thread: robert-kennedy-campaign-decision
      c: 'Robert Kennedy, at Stephen Smith''s apartment, has Edward Kennedy telephone Clifford at home, about 11 or 11:30. Edward Kennedy later: the Vietnam commission was mentioned; the Administration''s account: only that his brother wanted to talk about Vietnam. Clifford agrees to a meeting; at the Pentagon, not Kennedy''s office, 11 the next morning. Daley, having called Johnson, had suggested Clifford. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 74. See [[cal.1968-03-13.elections-1968]]. Names: Robert Kennedy, Edward Kennedy, Clifford, Daley, Smith.'
      tags:
      - name:kennedy-robert-f
      - name:kennedy-edward-m
      - name:clifford-clark
      - name:daley-richard-j
      - name:smith-stephen-e
- add:
    entry:
      id: cal.1968-03-15.robert-kennedy-campaign-decision-2
      when: Mar. 15
      date: '1968-03-15'
      thread: robert-kennedy-campaign-decision
      c: 'The Eastern shuttle, Washington to New York, with Haynes Johnson of the *Washington Star* and Jack Newfield of the *Village Voice*. Kennedy: "I''m going to announce tomorrow morning." Some friends, McNamara among them, will be distressed; "I think I''m in by myself." On Johnson: "My brother suggested Lyndon Johnson to be President of the United States. All that is involved inside me." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 81–82. Names: Robert Kennedy, Newfield, McNamara, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:newfield-jack
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1968-03-15.robert-kennedy-campaign-3
      when: Mar. 15
      date: '1968-03-15'
      thread: robert-kennedy-campaign
      c: 'Long Island, one of the day''s meetings: at the head table next to Leonard Hall, a former Republican national chairman; a New York radio station''s open microphone broadcasts them. Kennedy: "Do you think I''m crazy?" Hall asks what McCarthy will do: "He''s going to stay in. So it''s going to make it tough ... It will make it much tougher." Hall: "Are you going the primary route?" Kennedy: "Yeah." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 83–84. Check: the place (the work has "At one stop," after the Kings Point coffee and the Garden City luncheon). Names: Robert Kennedy, Hall, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:hall-leonard-w
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-03-16.robert-kennedy-campaign-3
      when: Mar. 16, afternoon
      date: '1968-03-16'
      thread: robert-kennedy-campaign
      c: 'Edward Kennedy''s Senate office. A Newsweek correspondent asks Mankiewicz about a proposal that Kennedy would stay out of the race in exchange for a public commission on Vietnam; Mankiewicz later: the first he knew of it. Life, Time and, the next day, CBS have it. Kennedy''s camp holds the White House leaked it that Saturday. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 92. See [[cal.1968-03-16.elections-1968-4]]. Names: Mankiewicz, Edward Kennedy.'
      tags:
      - name:mankiewicz-frank
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1968-03-17.robert-kennedy-campaign
      when: Mar. 17, evening
      date: '1968-03-17'
      thread: robert-kennedy-campaign
      c: 'Kansas City, Mo., the airport, on the way to Kansas. A crowd of signs, "We want Bobby" and "Robert Kennedy for President," at the foot of the plane''s ramp; the stop is unscheduled as a rally. Kennedy speaks briefly from a lower step, raises his fist: "We''re going to win!" Docking''s plane takes him and Ethel to Topeka. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 96–97. Names: Robert Kennedy, Docking.'
      tags:
      - name:kennedy-robert-f
      - name:docking-robert
      - state:ks
      - city:kansas-city
- add:
    entry:
      id: cal.1968-03-17.robert-kennedy-campaign-2
      when: Mar. 17, night
      date: '1968-03-17'
      thread: robert-kennedy-campaign
      c: 'Topeka, Kan., an airport fence, some 2,000 along it; then a ramp, with a bullhorn: "I come to ask for your help ... We have a hard five months ahead and the odds are heavily against us." Mankiewicz: "It sure beats those Army bases." At the Ramada Inn''s St. Patrick''s dance the Kennedys shake hands an hour or more; they sleep at Docking''s house. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 97–100. Names: Robert Kennedy, Mankiewicz, Docking.'
      tags:
      - name:kennedy-robert-f
      - name:mankiewicz-frank
      - name:docking-robert
      - state:ks
      - city:topeka
- add:
    entry:
      id: cal.1968-03-18.robert-kennedy-campaign-2
      when: Mar. 18
      date: '1968-03-18'
      thread: robert-kennedy-campaign
      c: 'Lawrence, Kan., Phog Allen Fieldhouse, 17,000 at the University of Kansas, the largest political gathering in its history. Kennedy: "I was sick last year and I received a message from the Senate. It said, ''We hope you recover.'' The vote for sending it was forty-two to forty." He repeats the Vietnam speech, off the cuff, with the line on Khe Sanh, and adds, "We have seen tanks patrolling American streets, machine guns fired at American children." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 105–06. See [[cal.1968-03-18.robert-kennedy]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ks
      - city:lawrence
- add:
    entry:
      id: cal.1968-03-18.robert-kennedy-campaign-3
      when: Mar. 18, evening
      date: '1968-03-18'
      thread: robert-kennedy-campaign
      c: 'Lawrence, Kan., Haskell Institute, an unscheduled stop in the rain on the way to the airport. Kennedy to the Indian students: "This is not an Indian problem. This is a white man''s problem." And: "I hope if no Indian is running for President of the United States, you will vote for me as the next best thing." The applause moderate. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 106–07. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ks
      - city:lawrence
- add:
    entry:
      id: cal.1968-03-23.robert-kennedy-campaign-2
      when: Mar. 23
      date: '1968-03-23'
      thread: robert-kennedy-campaign
      c: 'Sacramento, a shopping plaza, midafternoon, from a ladder. Kennedy: "Which of these brave young men dying in the rice paddies of Vietnam might have written a symphony?" ... "It is our responsibility to let those men live." The crowd surges toward him; Bill Barry, his security man, kneels on the convertible''s trunk holding him. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 112–13. See [[cal.1968-03-23.robert-kennedy-campaign]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ca
      - city:sacramento
- add:
    entry:
      id: cal.1968-03-25.robert-kennedy-campaign
      when: Mar. 25
      date: '1968-03-25'
      thread: robert-kennedy-campaign
      c: 'Portland, Ore., the University of Portland. Robert Kennedy quotes Camus: "Perhaps we cannot prevent this world from being a world in which children are tortured. But we can reduce the number of tortured children. And if you don''t help us, who else in the world can help us?" By Witcover''s account.'
      n: '[[w.witcover-85-days]], 120. Check: the day (the work puts Portland on Monday, Mar. 25, and the University of Portland speech in the Oregon trip without a day). Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:or
      - city:portland
- add:
    entry:
      id: cal.1968-03-27.robert-kennedy-campaign-primaries
      when: Mar. 27
      date: '1968-03-27'
      thread: robert-kennedy-campaign-primaries
      c: 'Salt Lake City. Robert Kennedy announces he will enter Indiana''s primary of May 7, a day before the filing deadline. John Kraft''s poll for the campaign, in that day: Kennedy close behind Branigin, ahead of McCarthy. Sorensen later: he went in "on sheer guts"; warned it would be a gamble: "The whole campaign is a gamble." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 124. Check: the day (the work has the poll in on Wednesday, Mar. 27, and the announcement "one day before the deadline" of Mar. 28, but the Salt Lake City meeting on Mar. 28, 122). See [[cal.1968-03-16.robert-kennedy-campaign-2]]. Names: Robert Kennedy, Branigin, McCarthy, Sorensen.'
      tags:
      - name:kennedy-robert-f
      - name:branigin-roger-d
      - name:mccarthy-eugene-j
      - name:sorensen-theodore-c
      - state:in
      - state:ut
      - city:salt-lake-city
- add:
    entry:
      id: cal.1968-03-28.robert-kennedy-campaign-primaries
      when: Mar. 28
      date: '1968-03-28'
      thread: robert-kennedy-campaign-primaries
      c: 'Salt Lake City. A crowd of 5,000 waits for Kennedy when police get an anonymous call that a bomb is in the hall; none is found, the crowd told, most stay. Kennedy: "If the people are in there, I''m going in." To the audience: "This is known as opening your campaign with a bang." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 122. Check: the day (the work has March 28; its account of the Indiana filing, 124, puts the announcement from Salt Lake City a day before the deadline of March 28, and the filing in Indianapolis that night). Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ut
      - city:salt-lake-city
- add:
    entry:
      id: cal.1968-03-28.robert-kennedy-campaign-primaries-2
      when: Mar. 28, night
      date: '1968-03-28'
      thread: robert-kennedy-campaign-primaries
      c: 'Indianapolis, the statehouse, the night of the filing deadline. Robert Kennedy files in person for the May 7 primary; some 4,000 at the airport and the grounds. "Give me your help"; the crowd: "You got it, you got it, man!" "I am not here to oppose Governor Branigin. He is in no way responsible for the policies and actions I challenge this year." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 124. Names: Robert Kennedy, Branigin.'
      tags:
      - name:kennedy-robert-f
      - name:branigin-roger-d
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1968-03-28.robert-kennedy-campaign-primaries-3
      when: Mar. 28
      date: '1968-03-28'
      thread: robert-kennedy-campaign-primaries
      c: 'Oshkosh, Wis., an airport press conference. McCarthy on Indiana: "I committed myself to go in there before he made any announcement"; he will make "three or four stops in the larger cities" and some television; Kennedy''s entry puts no pressure on him: "We will go down all the way and the showdown, of course, will come in California." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 125. Check: the day (the work has "the same day" as the Indiana filing). Names: McCarthy, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - state:wi
      - state:in
- add:
    entry:
      id: cal.1968-03-31.robert-kennedy-campaign-decision
      when: Mar. 31, night
      date: '1968-03-31'
      thread: robert-kennedy-campaign-decision
      c: 'The drive into Manhattan from the airport. Kennedy, silent in the back with Ethel, Dutton and Dick Dougherty of the *Los Angeles Times* in front: "I wonder if he''d have done this if I hadn''t come in." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 126–27. See [[cal.1968-03-31.robert-kennedy]]. Names: Robert Kennedy, Dutton.'
      tags:
      - name:kennedy-robert-f
      - name:dutton-frederick-g
- add:
    entry:
      id: cal.1968-04-02.robert-kennedy-campaign-primaries
      when: Apr. 2
      date: '1968-04-02'
      thread: robert-kennedy-campaign-primaries
      c: Philadelphia, before the dinner of the Democratic City Committee. Kennedy sends O'Donnell to talk with Mayor Tate, a Humphrey man who two weeks before called Kennedy "a wise guy" for entering the race. By Witcover's account.
      n: '[[w.witcover-85-days]], 134. See [[cal.1968-04-02.robert-kennedy-campaign-2]]. Names: Robert Kennedy, O''Donnell, Tate.'
      tags:
      - name:odonnell-kenneth-p
      - name:kennedy-robert-f
      - name:tate-james-h-j
      - state:pa
      - city:philadelphia
- add:
    entry:
      id: cal.1968-04-02.robert-kennedy-campaign-primaries-2
      when: Apr. 2, night
      date: '1968-04-02'
      thread: robert-kennedy-campaign-primaries
      c: 'The flight back to Washington from Philadelphia, as Wisconsin''s returns come in. Kennedy to reporters on the hard time ahead, hopeful that the Administration''s ineptness as shown in New Hampshire and Wisconsin will help: "They don''t do anything well anymore." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 135. See [[cal.1968-04-02.elections-1968]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:wi
      - state:pa
- add:
    entry:
      id: cal.1968-04-08.robert-kennedy-campaign-decision
      when: Apr. 8, night
      date: '1968-04-08'
      thread: robert-kennedy-campaign-decision
      c: Atlanta, a hotel suite, the night before King's funeral; Kennedy flies in by Lear jet from Washington. About 9 p.m. he meets some twenty-five men and women, little known to white Americans but influential in the major cities, gathered by Burke Marshall and John Doar. By Witcover's account.
      n: '[[w.witcover-85-days]], 145–46. Names: Robert Kennedy, Marshall, Doar.'
      tags:
      - name:kennedy-robert-f
      - name:marshall-burke
      - name:doar-john
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1968-04-11.robert-kennedy-campaign-primaries
      when: Apr. 11
      date: '1968-04-11'
      thread: robert-kennedy-campaign-primaries
      c: 'Kalamazoo, Mich., Central Square. Kennedy mobbed at a downtown rally; on the convertible a mother of five, Mrs. Phyllis Dean, takes his shoe: "I couldn''t get a hanky or anything, so I just took his shoe." The next day''s papers report the size, 8½ with an English arch support. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 148. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:mi
      - city:kalamazoo
- add:
    entry:
      id: cal.1968-04-11.robert-kennedy-campaign-primaries-2
      when: Apr. 11
      date: '1968-04-11'
      thread: robert-kennedy-campaign-primaries
      c: Augusta, Me. Governor Kenneth E. Curtis comes out for Robert Kennedy, joining Governor Philip H. Hoff of Vermont. By Witcover's account.
      n: '[[w.witcover-85-days]], 148. Check: the day (the work has the word reported the same day as Kalamazoo). Names: Curtis, Robert Kennedy, Hoff.'
      tags:
      - name:curtis-kenneth-m
      - name:kennedy-robert-f
      - name:hoff-philip-h
      - state:me
      - city:augusta
- add:
    entry:
      id: cal.1968-04-15.robert-kennedy-campaign-primaries
      when: Apr. 15
      date: '1968-04-15'
      thread: robert-kennedy-campaign-primaries
      c: 'South Bend, Ind., the West Side Democratic and Civic Club, Dyngus Day with Polish-American voters; kielbasa and beer, a Polish song learned on his 1963 visit. On the Indianapolis papers: "The Polish government refused to advise the people that we were there. It''s sort of like the Indianapolis papers when I''m here." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 149. Check: the day (the work has Dyngus Day after Easter, which fell on Apr. 14, 1968). Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:in
      - city:south-bend
- add:
    entry:
      id: cal.1968-04-17.robert-kennedy-campaign-primaries
      when: Apr. 17
      date: '1968-04-17'
      thread: robert-kennedy-campaign-primaries
      c: 'Pittsburgh, a radio interview. McCarthy challenges Kennedy to debate the issues on television: "I think this would be a very good test between Senator Kennedy and me." Joint appearances help in primaries, "where contrast of persons is more important than in national elections." Kennedy ignores the challenge. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 151–52. Check: the day (the work has "five days earlier" than Kennedy''s return to Indiana on Apr. 22). Names: McCarthy, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - state:pa
      - city:pittsburgh
- add:
    entry:
      id: cal.1968-04-22.robert-kennedy-campaign-primaries
      when: Apr. 22
      date: '1968-04-22'
      thread: robert-kennedy-campaign-primaries
      c: 'The flight from Washington to Indiana. Kennedy to two newsmen on the next three days in the conservative strongholds: "These people don''t like Negroes; they ''like'' the war; they don''t like the kids." "Because of my Negro support, I have a problem McCarthy doesn''t have." On Branigin: "I can''t attack him; he''s a Hoosier, and he''s theirs." On why Indiana: "I had to have a fight somewhere, and soon. ... Nebraska didn''t look too good and that was only a week later." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 151, 154. Names: Robert Kennedy, McCarthy, Branigin.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:branigin-roger-d
      - state:in
- add:
    entry:
      id: cal.1968-04-23.robert-kennedy-campaign-primaries
      when: Apr. 23
      date: '1968-04-23'
      thread: robert-kennedy-campaign-primaries
      c: 'Indiana, a whistle-stop by five-car diesel along the Wabash Cannonball route, Logansport to Fort Wayne, with depot speeches at Peru, Wabash, Huntington and Fort Wayne. Ethel and three of the children aboard. At each stop Kennedy urges the voters not to waste their ballots on Branigin and closes with Shaw: "Some men see things as they are and say, ''Why?'' I dream things that never were and say, ''Why not?''" At Logansport a police officer with a rifle stands on a bank roof. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 160–62. Names: Robert Kennedy, Branigin.'
      tags:
      - name:kennedy-robert-f
      - name:branigin-roger-d
      - state:in
      - city:logansport
      - city:peru-in
      - city:wabash
      - city:huntington
      - city:fort-wayne
- add:
    entry:
      id: cal.1968-04-24.robert-kennedy-campaign-primaries-2
      when: Apr. 24–29
      date: '1968-04-24'
      thread: robert-kennedy-campaign-primaries
      c: 'The *Indianapolis Star*, Pulliam''s, opens six days of page-one stories favorable to Branigin: labor support, his attacks on Kennedy and McCarthy for criticizing Johnson, their campaign spending, a boom for him as Humphrey''s running mate; Kennedy and McCarthy inside or not at all. Three days of cartoons, one showing Kennedy with his hand on "Mrs. Indiana." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 164. Names: Branigin, Robert Kennedy, McCarthy, Humphrey.'
      tags:
      - name:branigin-roger-d
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1968-04-30.robert-kennedy-campaign-primaries
      when: Apr. 30, noon
      date: '1968-04-30'
      thread: robert-kennedy-campaign-primaries
      c: 'Indianapolis, Monument Circle. Kennedy tells a large crowd he has been denied a permit to speak there: "I don''t want to spend my last five days in jail reading the Indianapolis Star." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 170. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1968-04-30.robert-kennedy-campaign-primaries-2
      when: Apr. 30, afternoon
      date: '1968-04-30'
      thread: robert-kennedy-campaign-primaries
      c: 'Indianapolis, the Christian Seminary, a group of clergymen. Robert Kennedy: "I always thought the Manchester [N.H.] Union Leader was the worst paper in the country ... I think, really, the Indianapolis Star must run it neck and neck." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 170–71. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1968-01-07.elections-1968-mccarthy
      when: Jan. 7
      date: '1968-01-07'
      thread: elections-1968-mccarthy
      c: 'ABC, *Issues and Answers*. McCarthy: Senators who share his position and are not running for reelection have "a little bit more burden upon them to take a stand," and "the excuses made by some that I am not going to win, I don''t think that is the kind of excuse that really stands up very well." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 36. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-01.robert-kennedy-campaign-decision-10
      when: Jan., mid
      date: 1968-01
      thread: robert-kennedy-campaign-decision
      c: Hickory Hill, a Sunday in mid-January. Edward Kennedy, back from Vietnam as head of the Senate subcommittee on refugees, speaks at length and with feeling of the corruption and inefficiency among refugee officials and the police. It adds to Robert Kennedy's conviction that he is right on Vietnam and Johnson wrong; but a challenge still seems folly. By Witcover's account.
      n: '[[w.witcover-85-days]], 39. Check: the day ("a Sunday in mid-January"). Names: Edward Kennedy, Robert Kennedy.'
      tags:
      - name:kennedy-edward-m
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-01.robert-kennedy-campaign-decision-8
      when: Jan., late
      date: 1968-01
      thread: robert-kennedy-campaign-decision
      c: 'Capitol Hill office. Kennedy to O''Donnell: "Do you think I can win?" "No." Kennedy asks him to explain to Edelman and Walinsky, "out in left field," "the facts of life"; they say, "So what?" O''Donnell later: it was worth running and losing for, but he had no right to say "Run and lose." By Witcover''s account, O''Donnell''s.'
      n: '[[w.witcover-85-days]], 41. Check: the day ("late January"). Names: Robert Kennedy, O''Donnell, Walinsky.'
      tags:
      - name:kennedy-robert-f
      - name:odonnell-kenneth-p
      - name:walinsky-adam
- add:
    entry:
      id: cal.1968-01.robert-kennedy-campaign-decision-9
      when: Jan., early
      date: 1968-01
      thread: robert-kennedy-campaign-decision
      c: California, Senate committee hearings on Indian problems, Edelman with him. Unruh, considering a challenge to Kuchel, is commissioning a poll that will include questions on Kennedy's standing in the State; he urges Kennedy to delay any firm decision about four weeks, until the results. The California primary, 174 delegate votes, with New York's 190, would give a base. By Witcover's account.
      n: '[[w.witcover-85-days]], 39–40. Check: the day ("early January"). Names: Unruh, Robert Kennedy, Kuchel.'
      tags:
      - name:unruh-jesse-m
      - name:kennedy-robert-f
      - name:kuchel-thomas-h
      - state:ca
