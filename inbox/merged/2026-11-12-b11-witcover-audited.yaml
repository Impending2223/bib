    item: '[[w.witcover-85-days]], 59–60 (Fulbright''s concern at the reported request for 206,000 troops and the demand that the Senate be consulted, which Kennedy seconds; the Beaumont, Texas, sentence; "Are we like the God of the Old Testament that we can decide, in Washington, D.C., what cities ...")'
    units: B, C
- cite:
    id: cal.1968-03-09.robert-kennedy
    item: '[[w.witcover-85-days]], 61 (Saturday, the Des Moines dinner for Governor Hughes, Edelman with him; afterward a room of some thirty, Hughes and the Governors of Kansas, North Dakota and Missouri among them, grumbling at Johnson and fearing he would go down in the Midwest; nobody urged him to run; not the dinner remarks)'
