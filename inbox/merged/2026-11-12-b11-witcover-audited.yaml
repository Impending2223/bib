- cite:
    id: cal.1968-03-05.robert-kennedy
    item: '[[w.witcover-85-days]], 54–55 (Tuesday, Mar. 5, Dutton with Edward Kennedy in his Senate office: "Bob''s just about made up his mind to run. The thing now is to make sense of it"; then to Robert Kennedy''s office for a three-hour lunch on the when and how; announcement discussed for Thursday, Mar. 7; not O''Donnell)'
