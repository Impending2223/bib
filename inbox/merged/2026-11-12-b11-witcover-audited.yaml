      id: cal.1968-06-05.assassination-10
      when: June 5, 2:22 a.m.
      date: '1968-06-05'
      thread: assassination
      c: Los Angeles, the Hospital of the Good Samaritan. Mankiewicz tells newsmen Kennedy's condition is "very critical" and that surgery will begin in five or ten minutes, for an operation of "forty-five minutes or an hour." By Witcover's account.
      n: '[[w.witcover-85-days]], 282. Names: Mankiewicz, Robert Kennedy.'
      tags:
      - name:mankiewicz-frank
      - name:kennedy-robert-f
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-05.assassination-11
      when: June 5, surgery
      date: '1968-06-05'
      thread: assassination
      c: Los Angeles, Good Samaritan. The operation begins at 3:12 a.m. and lasts three hours and forty minutes, three neurosurgeons and three chest surgeons from the medical faculties of the University of California and UCLA under Dr. Maxwell M. Andler. One bullet passed the mastoid bone and lodged in the midline of the brain, the critical one; another lodged in the back of the neck; a third grazed the forehead. Dr. James Poppen, flown in on a plane Humphrey made available, arrives after the surgery. By Witcover's account.
      n: '[[w.witcover-85-days]], 282. Names: Robert Kennedy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-05.assassination-12
      when: June 5, arraignment
      date: '1968-06-05'
      thread: assassination
      c: 'Los Angeles. Mayor Yorty, at a press conference several hours after the arrest, names the suspect: Sirhan Bishara Sirhan, 24, a Jordanian born in Jerusalem, in the Los Angeles area since 1957. Arraigned at 7:40 a.m. on six counts of assault with intent to murder; bail $250,000. Chief Reddin: traced through the revolver and fingerprints from a job application at Hollywood Park; a newspaper article critical of Kennedy and four $100 bills in his pockets. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 286. See [[cal.1968-06-05.robert-kennedy]]. Names: Yorty, Sirhan.'
      tags:
      - name:yorty-sam
      - name:sirhan-sirhan-bishara
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-05.assassination-13
      when: June 5, notebooks
      date: '1968-06-05'
      thread: assassination
      c: 'Los Angeles, a television interview. Mayor Yorty: two notebooks found in the suspect''s Pasadena home have "a direct reference to the necessity to assassinate Senator Kennedy before June 5, 1968," the first anniversary of the Six-Day War, and "generally pro-Communist writings" and pro-Arab, anti-Israel, anti-Kennedy references. Chief Reddin: he should not have discussed them. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 287, 294 (Lynch on Yorty''s "revelations of the previous day," June 6, 294). Names: Yorty, Sirhan.'
      tags:
      - name:yorty-sam
      - name:sirhan-sirhan-bishara
      - state:ca
      - city:pasadena
- add:
    entry:
      id: cal.1968-06-05.assassination-14
      when: June 5, 7:20 a.m.
      date: '1968-06-05'
      thread: assassination
      c: 'Good Samaritan, Mankiewicz: all but one fragment of the critical bullet removed from the brain; the neck bullet left; life signs about the same, breathing on his own; "there may have been an impairment of the blood supply to the midbrain." The next twelve to thirty-six hours "a very critical period." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 285–86. Names: Mankiewicz.'
      tags:
      - name:mankiewicz-frank
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-05.assassination-15
      when: June 5, 5:30 p.m.
      date: '1968-06-05'
      thread: assassination
      c: 'Good Samaritan, the makeshift press room. Mankiewicz: the physicians "are concerned over his continuing failure to show improvement during the postoperative period"; as of 5 p.m. Kennedy''s condition "extremely critical as to life"; no further regular bulletins until the morning. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 289. Names: Mankiewicz, Robert Kennedy.'
      tags:
      - name:mankiewicz-frank
      - name:kennedy-robert-f
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-06.assassination-3
      when: June 6, 2 a.m.
      date: '1968-06-06'
      thread: assassination
      c: 'Los Angeles, Good Samaritan, the press room, twenty-five hours and forty-seven minutes after the shooting. Mankiewicz: "Senator Robert Francis Kennedy died at 1:44 A.M. today, June 6, 1968. With Senator Kennedy at the time of his death were his wife, Ethel; his sisters, Mrs. Stephen Smith and Patricia Lawford; brother-in-law Stephen Smith; and Mrs. John F. Kennedy. He was forty-two years old." Asked the cause: "the gunfire attack ... the bullet that went into the head near the right ear." Edward Kennedy''s name later added. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 290. See [[cal.1968-06-05.robert-kennedy]]. Names: Mankiewicz, Robert Kennedy, Edward Kennedy.'
      tags:
      - name:mankiewicz-frank
      - name:kennedy-robert-f
      - name:kennedy-edward-m
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-06.robert-kennedy-3
      when: June 6, planning
      date: '1968-06-06'
      thread: robert-kennedy
      c: 'Los Angeles, Good Samaritan, the fifth-floor corridor, hours after the death. Decisions go to Ethel Kennedy for approval, some from her: St. Patrick''s Cathedral for the Solemn Requiem Mass, Andy Williams to sing, burial at Arlington. Salinger telephones Humphrey''s office for a Presidential plane; Steve Smith telephones McNamara in West Germany about Arlington; Fitt of the Defense Department, checking with Nitze and Clifford, goes to look for a gravesite. Less than two hours after the announcement Salinger gives the press a detailed outline of the plans. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 293–94. See [[cal.1968-06-06.robert-kennedy-campaign-2]]. Names: Salinger, Smith, McNamara, Humphrey, Clifford.'
      tags:
      - name:kennedy-robert-f
      - name:salinger-pierre
      - name:smith-stephen-e
      - name:mcnamara-robert-s
      - name:humphrey-hubert-h
      - name:clifford-clark
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-06.robert-kennedy-4
      when: June 6, flight
      date: '1968-06-06'
      thread: robert-kennedy
      c: The Presidential jet, Los Angeles to New York, off at 1:28 p.m. Pacific time with the casket in the front compartment, Ted Kennedy beside it. He calls each of the newsmen aboard to talk of the past and the future, stressing his increased family responsibility; to Witcover it seemed clear he had dismissed any active role in 1968. By Witcover's account.
      n: '[[w.witcover-85-days]], 295–96. Names: Edward Kennedy.'
      tags:
      - name:kennedy-edward-m
      - name:kennedy-robert-f
      - state:ca
- add:
    entry:
      id: cal.1968-06-07.robert-kennedy-2
      when: June 7
      date: '1968-06-07'
      thread: robert-kennedy
      c: New York, St. Patrick's Cathedral, open to the public from 5:30 a.m. through the night, lines of two to five hours down Fifth and Park Avenues; the casket in the transept, an honor guard of six changed every ten minutes, seventy-five to one hundred a minute filing by; eight Masses. Ethel Kennedy comes about noon; Jacqueline Kennedy at noon and about 4:30 with Caroline and John. McNamara, Goldberg, Glenn, Poitier and Evers take turns at the guard. By Witcover's account.
      n: '[[w.witcover-85-days]], 300–04. Names: Jacqueline Kennedy, McNamara, Goldberg, Glenn, Evers.'
      tags:
      - name:kennedy-robert-f
      - name:kennedy-jacqueline
      - name:mcnamara-robert-s
      - name:goldberg-arthur-j
      - name:glenn-john-h-jr
      - name:evers-charles
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1968-06-07.assassination
      when: June 7, Sirhan
      date: '1968-06-07'
      thread: assassination
      c: 'Los Angeles, the chapel of the Central County jail, chosen for security. Superior Judge Arthur L. Alarcon calls "Case Number A-233421—The People versus Sirhan Bishara Sirhan"; one count of the murder of Robert Francis Kennedy. The accused, in a wheelchair, speaks only when the judge mispronounces his name: "It is Sear-han, not Sir-han." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 303 ("shortly after" Jacqueline Kennedy''s visit of about 4:30 p.m., June 7). See [[cal.1968-06-05.robert-kennedy]]. Names: Sirhan.'
      tags:
      - name:sirhan-sirhan-bishara
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-08.robert-kennedy-5
      when: June 8, Elizabeth
      date: '1968-06-08'
      thread: robert-kennedy
      c: 'Elizabeth, N.J., 1:24 p.m., the funeral train, twenty-one cars, New York to Washington. Mourners on the tracks; the *Admiral*, Chicago to New York, passes on another track and kills John Curia and Antoinette Severini, both fifty-six; six others hurt, a granddaughter of three and a half among them. Bruno, the advance man, to the railroad: a guarantee that no more trains will pass, or "we''ll stop this train right now." The railroad agrees. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 308–09 (the Mass and the train the morning after June 7, 304). See [[cal.1968-06-08.robert-kennedy]].'
      tags:
      - name:kennedy-robert-f
      - state:nj
      - city:elizabeth-nj
- cite:
    id: cal.1968-05-07.elections-1968
    item: '[[w.witcover-85-days]], 178–79 (Kennedy''s slate won in the District and he won in Indiana)'
    units: E
- cite:
    id: cal.1968-05-07.elections-1968-2
    item: '[[w.witcover-85-days]], 178–79 (Indiana: about 42 percent for Kennedy, nearly 31 for Branigin, 27 for McCarthy; the District: Kennedy''s slate over two slates for Humphrey, 62.5 to 37.5 percent)'
    units: A, C, D
- cite:
    id: cal.1968-05-07.press-and-broadcasting
    item: '[[w.witcover-85-days]], 178 (election day at the Airport motel: touch football with staff and reporters, then the first returns; not Harwood or the words)'
    units: '?'
- cite:
    id: cal.1968-05-09.robert-kennedy-campaign-primaries
    item: '[[w.witcover-85-days]], 184 (Atlantic City, May 9, the United Auto Workers convention, strong criticism of the Vietnam War, a mild response; not Hyannis Port, Hickory Hill or Lincoln)'
    units: A, B
- cite:
    id: cal.1968-05-08.robert-kennedy-campaign-primaries
    item: '[[w.witcover-85-days]], 183–84 (the day after Indiana the party flew east; a lunch at the Inn of the Clock on United Nations Plaza with more than 200 supporters of his New York slate for the June 18 delegate primary; the same night the Synagogue Council; not the rabbis or the words)'
    units: '?'
- cite:
    id: cal.1968-05-13.elections-1968
    item: '[[w.witcover-85-days]], 193–94 (Creighton University, noon; the student''s question, whether the Army is not a way out of the ghettos, and the answer, "how can you say that we can deal with the problems of the poor by sending them to Vietnam?"; the last speech in the Negro section of Omaha, in the rain, "Run for the buses!")'
    units: A, B, C, D
- cite:
    id: cal.1968-05-14.elections-1968
    item: '[[w.witcover-85-days]], 197 (Nebraska: Kennedy 51.5 percent, McCarthy 31, Johnson 5.6, Humphrey 8.4 on write-ins, others 3.5; Kennedy won 88 of 93 counties)'
    units: D
- cite:
    id: cal.1968-05-14.robert-kennedy-campaign-2
    item: '[[w.witcover-85-days]], 197–98 (the press room at the Sheraton-Fontenelle; the combined vote against the Administration "about 84 percent"; "I think the people want to move in a different direction. We can''t have the politics of happiness and joy when we have so many problems in our own country.")'
    units: '?'
- cite:
    id: cal.1968-05-21.robert-kennedy-campaign
    item: '[[w.witcover-85-days]], 207–08 (Tuesday, May 21, San Francisco, the local press club, in the question period)'
    units: A
- cite:
    id: cal.1968-05-21.elections-1968
    item: '[[w.witcover-85-days]], 209 (McCarthy, to Jack Cole of Metromedia Television News on a plane from Klamath Falls to Coos Bay the same day as Kennedy''s "viable" remark: he conceivably could back Humphrey if he changed his position on Vietnam; later "clarified" as "absolute neutrality," he "could" support Kennedy if he conducted himself properly; not the spoiler''s words)'
    units: '?'
- cite:
    id: cal.1968-05-24.king
    item: '[[w.witcover-85-days]], 212 (Pearson''s column, for the next day after May 23, on a wiretap on King ordered by Kennedy as Attorney General in 1963; Witcover does not say it was the first in print or that Pearson was shown FBI documents)'
    units: '?'
- cite:
    id: cal.1968-05-24.robert-kennedy-campaign-primaries
    item: '[[w.witcover-85-days]], 213 (Friday, Astoria, barefoot on the beach with Ethel and Freckles; Kennedy strips to his shorts and plunges into the 54-degree water; a no-pictures pledge from the photographers; not Schlesinger or Kraft)'
    units: A, B
- cite:
    id: cal.1968-05-24.elections-1968
    item: '[[w.witcover-85-days]], 213 (McCarthy releases a telegram that he has bought thirty minutes of television time in Portland for a debate; not "the next evening")'
    units: '?'
- cite:
    id: cal.1968-05-25.robert-kennedy-campaign-2
    item: '[[w.witcover-85-days]], 213–15 (Saturday, May 25, the eighth-floor suite at the Benson; Walinsky, Salinger, Lucey and vanden Heuvel for a debate, Mrs. Green against; O''Brien called in by Kennedy and saying it would not hurt; after six o''clock, Kennedy in his shorts orders the room cleared and tells Walinsky and Greenfield in the corridor to "go out and ring doorbells"; not Pearson''s column)'
    units: '?'
- variant:
    id: cal.1968-05-25.robert-kennedy-campaign-2
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: O''Brien, called in by Kennedy, "indicated he didn''t think it would hurt to debate, but would go along with Kennedy''s decision"; later the proponents, Walinsky among them, went to O''Brien, whose feeling "still was that it wouldn''t have much impact either way."'
    at: '214'
- cite:
    id: cal.1968-05-26.robert-kennedy-campaign
    item: '[[w.witcover-85-days]], 217 (the Portland zoo; Barry tells Kennedy McCarthy is approaching, "within 50 yards or so"; "Let''s get out of here"; "Coward! Chicken!" from McCarthyites; McCarthy boards the press bus and invites the reporters to his campaign)'
    units: A, B, C, D
- cite:
    id: cal.1968-05-28.elections-1968-2
    item: '[[w.witcover-85-days]], 221 (Oregon: McCarthy 44.7 percent, Kennedy 38.8, Johnson 12.4, Humphrey 4, others 0.1; the first Kennedy defeat)'
    units: A
- cite:
    id: cal.1968-05-28.robert-kennedy-campaign-primaries-2
    item: '[[w.witcover-85-days]], 220–21 (Oregon''s primary day in the Santa Barbara–Ventura area; a CBS sampling of 400 key precincts late in the day; shortly before 8:30, at the plane''s stairway, Dougherty of the *Los Angeles Times*: "Bad news, Bob"; Kennedy: "Oh. That''s too bad." On the flight back to Oregon, to a reporter: "I''ve lost. I''m not one of those who think that coming in second or third is winning"; Humphrey, not McCarthy, the big gainer; "I think what he [McCarthy] wanted most was to knock me off. I guess he may hate me that much"; "They will use Oregon as an excuse for not supporting me"; Dutton writes the telegram of congratulation to McCarthy, at Kennedy''s insistence; not Goodwin, the silence or "We frightened them")'
    units: '?'
- variant:
    id: cal.1968-05-28.robert-kennedy-campaign-primaries-2
    unit: C
    witness: w.witcover-85-days
    reads: 'Witcover: the CBS sampling of 400 key precincts flashed to Kennedy late in the day; Dougherty brought the word at the stairway just before takeoff, shortly before 8:30, rather than a radio report aboard.'
    at: '220'
- cite:
    id: cal.1968-05-28.robert-kennedy-campaign-primaries-3
    item: '[[w.witcover-85-days]], 223–24 (the seventh-floor suite at the Benson, after the concession; a postmortem in one of the bedrooms, Sorensen, Goodwin, Salinger, Dutton and the newer team, on California and the debate, the decision to be announced the next morning in Los Angeles; Kennedy blames the defeat on himself, on his own deficiencies as a campaigner and an organizer; not O''Brien, vanden Heuvel, the concession or the words)'
    units: '?'
- cite:
    id: cal.1968-05-29.robert-kennedy
    item: '[[w.witcover-85-days]], 232–33 (a press conference in a small auxiliary terminal at Los Angeles International Airport, the statement mimeographed on the plane: Oregon "a setback ... which I could ill afford"; more than eighty percent for candidates "anxious for a change"; with Humphrey nominated, "no candidate who has opposed the course of escalation of the war in Vietnam ... [and] no candidate committed to the kinds of programs which can remedy the conditions which are transforming our cities into armed camps"; "glad to discuss these matters, separately or in joint appearances" with McCarthy; California "a fair test ... and I will abide by the results of that test"; "I''m not the same candidate I was before Oregon"; not B, "the politics of joy" or "with or without the Vice President")'
    units: A
- cite:
    id: cal.1968-05-29.robert-kennedy-campaign
    item: '[[w.witcover-85-days]], 233 (the motorcade to a Mexican-American, Negro and business district in downtown Los Angeles; Bruno and Jim Tolan''s advance work; not Smith''s words)'
    units: '?'
- cite:
    id: cal.1968-05-31.elections-1968-2
    item: '[[w.witcover-85-days]], 238 (Friday, May 31, the Commonwealth Club, San Francisco; the McCarthy advertisement on the Dominican Republic, the Bay of Pigs and Vietnam; "This great crusade that began for the future of the United States is now involved in a campaign to distort me and stop me"; not C or D)'
    units: A, B
- cite:
    id: cal.1968-06-01.elections-1968
    item: '[[w.witcover-85-days]], 240–46 (one hour, KGO-TV, an ABC affiliate, six-thirty Pacific time, Reynolds moderating, Lawrence and Clark asking; the coalition government at Saigon; McCarthy on housing out of the ghettos, Kennedy: "I don''t want to have them moved"; not "the one debate")'
    units: B, C
- cite:
    id: cal.1968-06-01.robert-kennedy-campaign-california
    item: '[[w.witcover-85-days]], 239 (Saturday, the Fairmont, a two-hour skull session with Sorensen, Schlesinger, Mankiewicz and others, Smith and Dutton screening the many who wanted in; not the wiretap or the words)'
    units: '?'
- cite:
    id: cal.1968-06-01.robert-kennedy
    item: '[[w.witcover-85-days]], 240 (Saturday, the Lock, Stock and Barrel Shop, 8972 East Huntington Drive, San Gabriel: a short, olive-skinned young man with two friends, after armor-piercing .357 magnum ammunition, is sold four boxes of .22 caliber bullets for $3.99; the work does not name him on this page)'
    units: '?'
- variant:
    id: cal.1968-06-01.robert-kennedy
    unit: A
    witness: w.witcover-85-days
    reads: 'Witcover: the young man sought armor-piercing .357 magnum ammunition and was sold "four boxes of .22 caliber bullets" for $3.99, with two friends.'
    at: '240'
- cite:
    id: cal.1968-06-02.elections-1968
    item: '[[w.witcover-85-days]], 246 (Sunday, a taped television interview: the hope that after the primary he and McCarthy could "somehow join and try to bring together" all the anti-Administration forces; the program is not named)'
    units: '?'
- cite:
    id: cal.1968-06-02.elections-1968-3
    item: '[[w.witcover-85-days]], 247 (McCarthy''s Sunday statement: Kennedy''s debate remark on moving Negroes into Orange County "scare tactics" that "could increase suspicion and mistrust among the races," "a crude distortion")'
    units: '?'
- cite:
    id: cal.1968-06-02.robert-kennedy-campaign
    item: '[[w.witcover-85-days]], 248–49 (at the San Gabriel Valley Gun Club, Duarte, a short, olive-skinned young man rapid-firing 300 or 400 rounds of .22 caliber from a revolver, "An Iver Johnson," to Carreon and Montellano; the work places it at the hour of the Chinatown firecrackers on Monday, June 3; the work does not name him)'
    units: '?'
- variant:
    id: cal.1968-06-02.robert-kennedy-campaign
    unit: A
    witness: w.witcover-85-days
    reads: 'Witcover: the young man was seen at the San Gabriel Valley Gun Club "at the same hour" as the Chinatown firecrackers of the late morning of Monday, June 3.'
    at: '248'
- cite:
    id: cal.1968-06-03.elections-1968
    item: '[[w.witcover-85-days]], 247–51 (Monday, June 3, the last day: San Francisco, Chinatown, firecrackers taken for "half a dozen sharp and loud shots"; Long Beach; San Diego, the El Cortez Hotel: Kennedy races through his remarks, sits on the top step, face in his hands, is taken to a dressing room, returns and finishes, to the reporters: "Some men see things as they are and say, ''Why?'' I dream things that never were and say, ''Why not?''"; not the Japanese Cultural Center)'
    units: A, C
- cite:
    id: cal.1968-06-04.elections-1968
    item: '[[w.witcover-85-days]], 255, 263 (South Dakota: Kennedy 49.7 percent, "native-son Humphrey" 29.9, McCarthy 20.4, 255; California and South Dakota, "We were able to win them both," 263)'
    units: E
- cite:
    id: cal.1968-06-04.robert-kennedy-campaign-2
    item: '[[w.witcover-85-days]], 253–54 (the Frankenheimer beach house at Malibu; lunch with Ethel, six children and Theodore White; Kennedy dives in and brings up David, twelve, pulled down by an undertow; the CBS first sample phoned about 3 p.m. to Mankiewicz, "about 49 percent"; not McCarthy''s or the Lynch figures or D or E)'
    units: A, B
- cite:
    id: cal.1968-06-04.robert-kennedy-campaign-california
    item: '[[w.witcover-85-days]], 255 (Kennedy takes the telephone and thanks his South Dakota manager, Bill Dougherty, early in the evening after the arrival at the Ambassador shortly after 7 p.m.)'
    units: '?'
- variant:
    id: cal.1968-06-04.robert-kennedy-campaign-california
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: "Early on," soon after Kennedy reached the Ambassador shortly after 7 p.m., Dutton called South Dakota and Kennedy "took the phone and thanked his South Dakota manager, Bill Dougherty."'
    at: '255'
- cite:
    id: cal.1968-06-04.robert-kennedy-campaign-california-2
    item: '[[w.witcover-85-days]], 257 (Kennedy telephones O''Donnell in Washington on a strategy meeting for which O''Donnell was flying out the next morning; O''Donnell: it looked as though he would be nominated; Kennedy: "I think I may"; O''Donnell later: "He had arrived ... as Robert Kennedy")'
    units: '?'
- variant:
    id: cal.1968-06-04.robert-kennedy-campaign-california-2
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: to O''Donnell''s remark that it looked as though he would be nominated, Kennedy replied, "I think I may."'
    at: '257'
- cite:
    id: cal.1968-06-05.robert-kennedy-2
    item: '[[w.witcover-85-days]], 261–64 (about a quarter before midnight, the Embassy Room; Kennedy asks for "a dialogue—or a debate, I hope—between the Vice President and perhaps myself"; "My thanks to all of you, and on to Chicago")'
    units: A, E
- cite:
    id: cal.1968-06-05.robert-kennedy
    item: '[[w.witcover-85-days]], 261–68, 278–79, 286, 290 (the victory speech fifteen minutes before midnight; shot about 12:13 a.m. in the pantry corridor behind the ballroom; five others wounded: Schrade, Weisel, Goldstein, Evans, Stroll; Sirhan Bishara Sirhan, 24, a Jordanian born in Jerusalem; died 1:44 a.m., June 6; not F–I)'
    units: A, B, C, D, E
- cite:
    id: cal.1968-06-05.assassination-3
    item: '[[w.witcover-85-days]], 283 (Rostow telephones Johnson at 12:31 a.m. Pacific, 3:31 Washington; Johnson confers by telephone with Clifford, Clark, Rowley and Hoover; his statement at 3:45 a.m. Pacific, "There are no words equal to the horror of this tragedy")'
    units: '?'
- cite:
    id: cal.1968-06-05.elections-1968
    item: '[[w.witcover-85-days]], 287 (McCarthy comes to the hospital in the morning, talks to Salinger and Goodwin, leaves for Washington, halting his campaign)'
    units: '?'
- cite:
    id: cal.1968-06-06.robert-kennedy-2
    item: '[[w.witcover-85-days]], 295–99 (the Presidential jet, not the Air Force One of 1963, at LaGuardia, the Butler Marine Terminal, 9:03 p.m.; Rockefeller, Lindsay, Javits, Goldberg, Udall, Katzenbach and Kennedy aides at the gate; McNamara, flown in by Fitt; the motorcade to St. Patrick''s, about 7,000 outside; Edward Kennedy stays for the night''s vigil; not Canzeri or the advance men)'
    units: '?'
- cite:
    id: cal.1968-06-08.robert-kennedy
    item: '[[w.witcover-85-days]], 305–16 (the Solemn Requiem Mass at 10 a.m. the morning after Friday, June 7 (304, "Friday morning," a slip) at St. Patrick''s; Edward Kennedy''s eulogy, unannounced, written by Walinsky with Gwirtzman and Burke: "a good and decent man, who saw wrong and tried to right it, saw suffering and tried to heal it, saw war and tried to stop it," 305–06; the twenty-one-car train from Penn Station at 1:04 p.m.; Johnson at the Mass, in a front pew on the side opposite the family; the train reaches Union Station at 9:25 p.m.; the burial at Arlington about ninety minutes before midnight, twenty feet from his brother''s grave, 315–16)'
    units: A, B, C, D
- cite:
    id: cal.1968-08-29.elections-1968-chicago-8
    item: '[[w.witcover-85-days]], 326–27 (the final night; a thirty-two-minute film on Robert Kennedy with Edward Kennedy''s taped introduction; applause for nearly five minutes, Albert gaveling for order, vanden Heuvel starting "The Battle Hymn of the Republic"; not the times or the tribute to King)'
    units: B
- cite:
    id: cal.1968-08-27.elections-1968-4
    item: '[[w.witcover-85-days]], 324–25 (Smith and Dutton for about fifteen minutes with McCarthy and Goodwin on the twenty-third floor of the Conrad Hilton; McCarthy asks Smith into the bedroom alone, would withdraw if Edward Kennedy would enter, wanting his own name put in nomination first, "could not have done it for Robert Kennedy but would do it for Ted"; Edward Kennedy telephones DiSalle to desist; not the hour)'
    units: '?'
- add:
    entry:
      id: cal.1968-05-14.elections-1968-mccarthy
      when: May 14, night
      date: '1968-05-14'
      thread: elections-1968-mccarthy
      also:
      - robert-kennedy-campaign-primaries
      c: 'The Nebraska primary night, on television. McCarthy: about what he expected; head to head he could have run about even with Kennedy, but for the Johnson and Humphrey votes; so on to Oregon and California. "I don''t think I have to win all [of the primaries]. Losing one or two doesn''t make all that difference." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 197. See [[cal.1968-05-14.elections-1968]]. Names: McCarthy, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - state:ne
- add:
    entry:
      id: cal.1968-05.elections-1968-mccarthy
      when: May
      date: 1968-05
      thread: elections-1968-mccarthy
      also:
      - robert-kennedy-campaign-primaries
      c: 'Omaha, the Blackstone Hotel, a dinner with reporters, the night before McCarthy leaves Nebraska. McCarthy: Nebraska "wasn''t very important"; "Kennedy talks about winning three primaries. I''ve won five," the fifth "the college primary"; "I''d rather win the college primary than the Indiana primary." Indiana had knocked Kennedy out of any chance; "All the cards are on the table now." He predicts 30 percent in Nebraska, Kennedy under 50. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 185–86. Check: the day (the work has "the night before McCarthy left the state," after Indiana, May 7, and before the Omaha dinner of May 10, which he passed up). Names: McCarthy, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - state:ne
      - city:omaha
- add:
    entry:
      id: cal.1968-05-30.elections-1968-mccarthy
      when: May 30
      date: '1968-05-30'
      thread: elections-1968-mccarthy
      c: 'Los Angeles, Watts, a barbecue of McCarthy''s workers in a park, about 100 listening. McCarthy: he had called the unseating of Powell "unconstitutional"; "black power" a legitimate force, like "Irish power" and "Italian power"; "There''s never been any group in America who had any more reason to organize themselves to get their rights [than the blacks]." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 237 (the day Kennedy is in the Central Valley). Names: McCarthy, Powell.'
      tags:
      - name:mccarthy-eugene-j
      - name:powell-adam-clayton-jr
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-06.assassination-4
      when: June 6
      date: '1968-06-06'
      thread: assassination
      c: Los Angeles, the Police Administration Building. Mayor Yorty, at another televised press conference, on the "Communist sympathies" of the man in custody, despite Attorney General Lynch's criticism that his statements of the day before might impair a fair trial. By Witcover's account.
      n: '[[w.witcover-85-days]], 294. See [[cal.1968-06-05.assassination-13]]. Names: Yorty, Sirhan.'
      tags:
      - name:yorty-sam
      - name:sirhan-sirhan-bishara
      - state:ca
      - city:los-angeles
- cite:
    id: cal.1968-05-31.elections-1968-3
    item: '[[w.witcover-85-days]], 236 (McCarthy, on Kennedy''s hint that he might quit if beaten in California: "Really, I don''t have the right to withdraw"; he likens Kennedy to a small boy who threatens to hold his breath; no day given; not B''s words)'
    units: '?'
- variant:
    at: '236'
    id: cal.1968-05-31.elections-1968-3
    reads: 'Witcover: to his cheering backers at his southern California headquarters in Los Angeles, not San Diego.'
    unit: A
    witness: w.witcover-85-days
