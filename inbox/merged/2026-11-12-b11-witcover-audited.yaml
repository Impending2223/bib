- add:
    entry:
      id: cal.1968-03-17.robert-kennedy-campaign-3
      when: Mar. 17
      date: '1968-03-17'
      thread: robert-kennedy-campaign
      c: South Boston, the St. Patrick's Day parade, after *Meet the Press*. Robert and Edward Kennedy march the route together. By Witcover's account.
      n: '[[w.witcover-85-days]], 94. See [[cal.1968-03-17.robert-kennedy]]. Names: Robert Kennedy, Edward Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:kennedy-edward-m
      - state:ma
      - city:boston
- add:
    entry:
      id: cal.1968-03-17.robert-kennedy-campaign-4
      when: Mar. 17
      date: '1968-03-17'
      thread: robert-kennedy-campaign
      c: 'New York, Robert Kennedy''s apartment, the commission story out through CBS. Kennedy telephones Daley: "I''m shocked. You know all about this. What should I do?" Daley: "Deny it." By the Kennedy account, as Witcover gives it.'
      n: '[[w.witcover-85-days]], 94–95. See [[cal.1968-03-16.elections-1968-4]]. Names: Robert Kennedy, Daley.'
      tags:
      - name:kennedy-robert-f
      - name:daley-richard-j
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-03-17.robert-kennedy-campaign-5
      when: Mar. 17, evening
      date: '1968-03-17'
      thread: robert-kennedy-campaign
      c: 'The flight from New York to Kansas City. Robert Kennedy, on background, to the traveling reporters on the Vietnam commission: "a Democratic political leader who was a friend of mine and supporting President Johnson," Daley, first suggested it, with Kennedy as chairman; Sorensen proposed it at Johnson''s invitation, without Kennedy''s authority. "I didn''t want to run for President. ... But when he [Johnson] made it clear the war would go on, that nothing was going to change, I had no choice." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 96. See [[cal.1968-03-17.robert-kennedy-2]]. Names: Robert Kennedy, Daley, Sorensen, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:daley-richard-j
      - name:sorensen-theodore-c
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-04-01.elections-1968-johnson-5
      when: Apr. 1
      date: '1968-04-01'
      thread: elections-1968-johnson
      c: 'The Presidential plane, back from Johnson''s speech in Chicago. Johnson to reporters: he will "surely" grant Robert Kennedy''s request for a meeting. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 133. See [[cal.1968-03-31.robert-kennedy]]. Names: Johnson, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-05-01.robert-kennedy-campaign-primaries
      when: May 1
      date: '1968-05-01'
      thread: robert-kennedy-campaign-primaries
      c: 'The *Indianapolis Star*, the morning after Kennedy called it the "worst" paper, runs on page one a reprint of a *New York Times* editorial, "Is Indiana for Sale?", on the candidates'' spending: the references to Branigin''s campaign and to Indiana''s weak law on reporting campaign expenses deleted, and the sentence on the "favorite son" as leader of a State organization cut before its words on patronage and the "two per cent tax" on State employees'' salaries. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 170–71. See [[cal.1968-05-01.robert-kennedy]]. Names: Robert Kennedy, Branigin.'
      tags:
      - name:kennedy-robert-f
      - name:branigin-roger-d
      - state:in
      - city:indianapolis
      also:
      - press-and-broadcasting
- add:
    entry:
      id: cal.1968-05-06.robert-kennedy-campaign-primaries
      when: May 6
      date: '1968-05-06'
      thread: robert-kennedy-campaign-primaries
      c: 'Lake County, Ind., the last day of the primary campaign: a motorcade of some nine hours from La Porte through Porter and Lake Counties, Negro and blue-collar ethnic neighborhoods alternating, Kennedy standing on the back of a convertible, Barry kneeling holding him. It reaches Whiting, for a speech scheduled at 5 p.m., after 10; he stops for children on a mattress on a car roof. He asks the Hammond mayor, "Where''s the city line?" and later calls it "Hammond, Hammond, Hammond." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 175–76. See [[cal.1968-05-06.elections-1968]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:in
      - city:hammond
      - city:whiting
      - city:gary
      - city:la-porte
- add:
    entry:
      id: cal.1968-05-06.robert-kennedy-campaign-primaries-2
      when: May 6, night
      date: '1968-05-06'
      thread: robert-kennedy-campaign-primaries
      c: 'Indianapolis, the bar of the Airport Holiday Inn, to two reporters, after the motorcade: "Well, I''ve done all I could do. Maybe it''s just not my time. But I''ve learned something from Indiana." The old coalition of labor and the South is not the answer; whites and blacks in the northern cities must be pulled together. A man at the motorcade held a sign, "YOU PUNK," and squeezed his hand as if to break it. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 177. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1968-05-06.robert-kennedy-campaign-primaries-3
      when: May 6, dinner
      date: '1968-05-06'
      thread: robert-kennedy-campaign-primaries
      c: 'Indianapolis, Sam''s Subway, a restaurant behind the Marott Hotel, with aides, friends and newsmen. On the Pulliam papers and the spending stories: "I''d rather deal with the Indianapolis Star than with the New York Times, because you know where the Indianapolis Star stands." Indiana''s people had given him a fair hearing; tough, like West Virginians. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 178. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1968-05-07.robert-kennedy-campaign-primaries-2
      when: May 7, night
      date: '1968-05-07'
      thread: robert-kennedy-campaign-primaries
      c: 'Indianapolis, the Sheraton-Lincoln, the returns clear. Kennedy on CBS with Roger Mudd, then, on a split screen with McCarthy he had not wanted to give exposure, with Cronkite, who asks about campaign spending: no candidate would need so much if the networks gave air time at cost; they could afford it, the public owning the airwaves. To Mudd: "There are two ways you can play this—above the table and below the table, and your people played below. I had no indication this was coming. I want you to make it clear I feel this way." He leaves. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 179. See [[cal.1968-05-07.elections-1968-2]]. Names: Robert Kennedy, Cronkite, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:cronkite-walter
      - name:mccarthy-eugene-j
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1968-05-08.robert-kennedy-campaign-primaries-2
      when: May 8, night
      date: '1968-05-08'
      thread: robert-kennedy-campaign-primaries
      c: 'New York, the Synagogue Council of America. Kennedy: "Israel is not Vietnam. Indeed it is the very opposite of Vietnam. Israel''s government is democratic, effective, free of corruption; its people are united in its support." Israelis "will not ask us to do their job for them"; helping Israel is "in our most basic interest." The endorsement gets passing notice. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 184. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1968-05-09.robert-kennedy-campaign-primaries-2
      when: May 9
      date: '1968-05-09'
      thread: elections-1968-mccarthy
      c: Omaha. McCarthy charges "the Kennedys" with "poisoning the well in Indiana." By Witcover's account.
      n: '[[w.witcover-85-days]], 184–85. See [[cal.1968-05-09.robert-kennedy-campaign-primaries]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:ne
      - city:omaha
      also:
      - robert-kennedy-campaign-primaries
- add:
    entry:
      id: cal.1968-05-10.robert-kennedy-campaign-primaries
      when: May 10, Beatrice
      date: '1968-05-10'
      thread: robert-kennedy-campaign-primaries
      c: 'Beatrice, Neb., the first rally of a motorcade through six southeastern towns. The mayor gives Kennedy a deed to an inch of land. Kennedy: if he loses in Nebraska he might settle there, "And I''ll bring Ethel and all eleven children." The remark confirms for reporters that the Kennedys are expecting again. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 188. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ne
      - city:beatrice
- add:
    entry:
      id: cal.1968-05-10.robert-kennedy-campaign-primaries-2
      when: May 10, Nebraska City
      date: '1968-05-10'
      thread: robert-kennedy-campaign-primaries
      c: 'Nebraska City, Neb., the Otoe County courthouse. Kennedy proposes a "Rural America Community Services Act," a kind of rural renewal: federal aid for social services in remote areas. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 188. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ne
      - city:nebraska-city
- add:
    entry:
      id: cal.1968-05-10.robert-kennedy-campaign-primaries-3
      when: May 10, night
      date: '1968-05-10'
      thread: robert-kennedy-campaign-primaries
      c: 'Omaha, the Jefferson-Jackson Day dinner, billed as the first confrontation of Kennedy and Humphrey; McCarthy, invited, has left the State. Kennedy speaks and leaves before Humphrey arrives. Humphrey: "I do not think the American people want more frenzy. I do not think the American people will respond to leadership that exaggerates our difficulties to paralyze us with fear." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 185, 189 (the next day''s stories mostly give Humphrey a modest edge, 189). Names: Robert Kennedy, Humphrey, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
      - state:ne
      - city:omaha
- add:
    entry:
      id: cal.1968-05-11.robert-kennedy-campaign-primaries
      when: May 11, Aberdeen
      date: '1968-05-11'
      thread: robert-kennedy-campaign-primaries
      c: 'Aberdeen, S.D. Kennedy on Humphrey''s "politics of happiness and joy": with American deaths in Vietnam at a record, the wrong moment for rosy pictures. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 190. Names: Robert Kennedy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - state:sd
      - city:aberdeen
- add:
    entry:
      id: cal.1968-05-11.robert-kennedy-campaign-primaries-2
      when: May 11, Huron
      date: '1968-05-11'
      thread: robert-kennedy-campaign-primaries
      c: Huron, S.D., Humphrey's boyhood home, shortly after the Vice President's visit. Kennedy calls on Mrs. Harriet Humphrey in the Humphrey family drugstore and buys a Mother's Day box of candy; she wraps it with a Humphrey sticker and takes no money, "a gift from Hubert." By Witcover's account.
      n: '[[w.witcover-85-days]], 190. Names: Robert Kennedy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - state:sd
      - city:huron
- add:
    entry:
      id: cal.1968-05-12.robert-kennedy-campaign-primaries
      when: May 12
      date: '1968-05-12'
      thread: robert-kennedy-campaign-primaries
      c: 'Crete, Neb., some thousand people. Kennedy: when deciding whether to run, his wife said he should, "because then I would be able to get to Nebraska ... Because then you might have the chance to visit Crete!" "All those who believe that, raise your hands." At a Rockefeller sign: "When was the last time Nelson Rockefeller was in Crete? If he wants to be President, why doesn''t he come to Crete?" By Witcover''s account.'
      n: '[[w.witcover-85-days]], 190–91 (Mother''s Day). Names: Robert Kennedy, Rockefeller.'
      tags:
      - name:kennedy-robert-f
      - name:rockefeller-nelson
      - state:ne
      - city:crete
- add:
    entry:
      id: cal.1968-05-13.robert-kennedy-campaign-primaries
      when: May 13, Wahoo
      date: '1968-05-13'
      thread: robert-kennedy-campaign-primaries
      c: 'Wahoo, Neb., the last day of the campaign. Kennedy passes John F. Kennedy College with a bare mention. Asked why: "My brother Teddy''s been there." Dutton: "We wouldn''t have considered passing it up a couple of months ago. But it would have been too much now. He''s a candidate and he wants to be a candidate on his own." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 192. Names: Robert Kennedy, Dutton, Edward Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:dutton-frederick-g
      - name:kennedy-edward-m
      - state:ne
      - city:wahoo
- add:
    entry:
      id: cal.1968-05-13.robert-kennedy-campaign-primaries-2
      when: May 13, night
      date: '1968-05-13'
      thread: robert-kennedy-campaign-primaries
      c: 'Columbus, Ohio, the Neil House Hotel, nearly two hours late. Kennedy meets Ohio''s Democratic delegates, 115 votes, under pressure to go to Humphrey; a subdued plea to stay uncommitted until the primaries show his strength. The State party''s executive director, Eugene P. O''Grady: as many as eighty indicated they would stay neutral a while. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 194–95. Names: Robert Kennedy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - state:oh
      - city:columbus
- add:
    entry:
      id: cal.1968-05-14.robert-kennedy-campaign-primaries
      when: May 14, Iowa
      date: '1968-05-14'
      thread: robert-kennedy-campaign-primaries
      c: 'Davenport and Des Moines, Iowa, two rallies and a meeting with the State''s Democratic delegates, 30 votes, the State convention ten days off. Kennedy: "Harold Hughes will win in November, because he is the right man for the job. ... He has been a great Governor." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 195. Names: Robert Kennedy, Hughes.'
      tags:
      - name:kennedy-robert-f
      - name:hughes-harold-e
      - state:ia
      - city:des-moines
      - city:davenport
- add:
    entry:
      id: cal.1968-05-14.robert-kennedy-campaign-primaries-2
      when: May 14, night, television
      date: '1968-05-14'
      thread: robert-kennedy-campaign-primaries
      c: 'The Nebraska primary night, Omaha, on television. Kennedy stresses his rural support in a conservative State and invites "those associated with Senator McCarthy" to switch to him; of McCarthy: "I would hope perhaps we could work together ... in Oregon and California." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 197. See [[cal.1968-05-14.robert-kennedy-campaign-2]]. Names: Robert Kennedy, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:ne
      - city:omaha
- add:
    entry:
      id: cal.1968-05-15.robert-kennedy-campaign-primaries
      when: May 15
      date: '1968-05-15'
      thread: robert-kennedy-campaign-primaries
      c: 'Detroit, Kennedy Square (formerly Cadillac), a crowd of 10,000, and a meeting with Michigan''s delegates before the June 1 State convention, asked as in Ohio to stay neutral until California. Kennedy on Humphrey: "If you want to be filled with pablum and tranquilizers, then you should vote for some other candidate." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 198. See [[cal.1968-05-15.robert-kennedy-campaign]]. Names: Robert Kennedy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - state:mi
      - city:detroit
- add:
    entry:
      id: cal.1968-05-16.robert-kennedy-campaign-primaries
      when: May 16
      date: '1968-05-16'
      thread: elections-1968-mccarthy
      c: 'Rapid City, S.D., the School of Mines, a small crowd. McCarthy: "People say our campaign is failing. I''m not sure it is ... but if we accomplish nothing more, it will be still regarded as the most successful and important political campaign, at least of this century." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 198–99. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:sd
      - city:rapid-city
- add:
    entry:
      id: cal.1968-05-17.robert-kennedy-campaign-primaries
      when: May 17
      date: '1968-05-17'
      thread: robert-kennedy-campaign-primaries
      c: 'Portland, Ore., the City Club, Kennedy''s first speech in Oregon after Nebraska. A business magazine''s poll of 500 businessmen turned up one Kennedy backer: "I''m the only candidate who can take all his business supporters to lunch." On the government''s role in birth control: "I don''t want the federal government in my house." A bland reception; at Omark Industries, after, the workers cool. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 200. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:or
      - city:portland
- add:
    entry:
      id: cal.1968-05-17.robert-kennedy-campaign-primaries-2
      when: May 17, night
      date: '1968-05-17'
      thread: robert-kennedy-campaign-primaries
      c: 'Portland, the Benson Hotel, after a poor day. Kennedy telephones for reinforcements: O''Brien, Steve Smith, Dolan, Nolan, Douglas, others; O''Brien, to have worked on New York, is shipped out at once, Smith and others drop California for Portland. Eleven days to the primary. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 201. Names: Robert Kennedy, O''Brien, Smith, Dolan.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:smith-stephen-e
      - name:dolan-joseph-f
      - state:or
      - city:portland
- add:
    entry:
      id: cal.1968-05-18.robert-kennedy-campaign-primaries
      when: May 18
      date: '1968-05-18'
      thread: robert-kennedy-campaign-primaries
      c: Oregon, the Beaver State Special, six cars, Portland to Eugene, 115 miles, stops at Oregon City, Salem, Albany, Harrisburg and Junction City. Kennedy on Humphrey's statement on the NLF at the Paris talks, "if such confusion can be created among members of the American government, agreement with other parties will be difficult indeed"; calls for a woman on the American negotiating team. At Hayward Field, Eugene, about 6,000. By Witcover's account.
      n: '[[w.witcover-85-days]], 203–05. Names: Robert Kennedy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - state:or
      - city:eugene
      - city:salem
- add:
    entry:
      id: cal.1968-05-18.robert-kennedy-campaign-primaries-2
      when: May 18, night
      date: '1968-05-18'
      thread: robert-kennedy-campaign-primaries
      c: 'The chartered jet, San Francisco to Los Angeles, after the Sheraton-Palace speech. Kennedy, roaming the aisle, on Oregon''s contrast with California; to James Dickenson of the *National Observer*: "Let''s face it, I appeal best to people who have problems." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 205–06. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ca
      - state:or
- add:
    entry:
      id: cal.1968-05-20.robert-kennedy-campaign-primaries
      when: May 20
      date: '1968-05-20'
      thread: robert-kennedy-campaign-primaries
      c: Los Angeles, Temple Isaiah, after dark, at the end of a three-hour motorcade through East Los Angeles. Kennedy proposes a U.S.–Soviet agreement to stop arms shipments to the Middle East; until then the United States "must fully assist Israel—with arms if necessary," so long as Russia arms the United Arab Republic (the *Los Angeles Times*, as Witcover quotes it). Late, he says, because Mayor Yorty "gave me a police escort." By Witcover's account.
      n: '[[w.witcover-85-days]], 206–07. See [[cal.1968-05-08.robert-kennedy-campaign-primaries]]. Names: Robert Kennedy, Yorty.'
      tags:
      - name:kennedy-robert-f
      - name:yorty-sam
      - state:ca
      - city:los-angeles
      - polity:ussr
- add:
    entry:
      id: cal.1968-05-22.robert-kennedy-campaign-primaries
      when: May 22
      date: '1968-05-22'
      thread: robert-kennedy-campaign-primaries
      c: 'Eastern Oregon College, La Grande. Kennedy: "If I do badly in Oregon, the Vice President is going to be the major gainer. That''s why his people ... are having a telephone campaign in Oregon ... He is the major opponent. I am running against the period of the last three years." He urges Humphrey to come and answer questions. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 210–11. Names: Robert Kennedy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - state:or
      - city:la-grande
- add:
    entry:
      id: cal.1968-05-23.robert-kennedy-campaign-primaries
      when: May 23
      date: '1968-05-23'
      thread: robert-kennedy-campaign-primaries
      c: 'Portland, the Willamette River on a sightseeing boat, hearing of harbor problems. Kennedy, to Witcover on how Oregon is going: "I''ve got a problem here. ... You''re a political writer. You can look around and see what it is." "I don''t want to play games. I have my own analysis, but I don''t think it would be useful to me to go into it." By Witcover''s account, his own.'
      n: '[[w.witcover-85-days]], 211–12. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:or
      - city:portland
- add:
    entry:
      id: cal.1968-05-23.robert-kennedy-campaign-primaries-2
      when: May 23, Salinger
      date: '1968-05-23'
      thread: robert-kennedy-campaign-primaries
      c: 'Portland. Salinger, with an advance copy of Pearson''s column on a wiretap on King ordered by Kennedy as Attorney General: Kennedy "never authorized eavesdropping of any kind"; he "did authorize wiretapping in cases where national security was involved, and where there was a written request from the FBI"; pressed on this wiretap: "Senator Kennedy has never discussed individual cases and isn''t going to now." Kennedy aides: Pearson "is a declared supporter of another Presidential candidate." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 212. See [[cal.1968-05-23.robert-kennedy-campaign-2]]. Names: Salinger, Pearson, Robert Kennedy, King.'
      tags:
      - name:kennedy-robert-f
      - name:salinger-pierre
      - name:pearson-drew
      - name:king-martin-luther-jr
      - state:or
- add:
    entry:
      id: cal.1968-05-25.robert-kennedy-campaign-primaries
      when: May 25, night
      date: '1968-05-25'
      thread: elections-1968-mccarthy
      c: 'Portland, Memorial Coliseum, a tremendous crowd. McCarthy on Kennedy: "He''s not brought any New Politics to the scene in 1968"; no new politicians, "We''ve brought back Pierre Salinger from retirement"; "we''ve had a return to the old politics with his entrance into this campaign." And: "while he does take the cold plunge in the Pacific and brings the dog ... up to now he has refused to meet me in debate or in joint appearance." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 215–17. Names: McCarthy, Robert Kennedy, Salinger.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - name:salinger-pierre
      - state:or
      - city:portland
      also:
      - robert-kennedy-campaign-primaries
- add:
    entry:
      id: cal.1968-05-26.robert-kennedy-campaign-primaries
      when: May 26
      date: '1968-05-26'
      thread: robert-kennedy-campaign-primaries
      c: 'Portland, the Neveh Shalom Synagogue. Kennedy: "in Israel—unlike so many other places in the world—our commitment is clear and compelling. We are committed to Israel''s survival. We are committed to defying any attempt to destroy Israel, whatever the source. And we cannot and must not let that commitment waver." Little attention; McCarthy had said the same at another synagogue''s picnic. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 217–18. Names: Robert Kennedy, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:or
      - city:portland
- add:
    entry:
      id: cal.1968-05-27.robert-kennedy-campaign-primaries
      when: May 27, Roseburg
      date: '1968-05-27'
      thread: robert-kennedy-campaign-primaries
      c: 'Roseburg, Ore., signs, "Protect your right to keep and bear arms." Kennedy: "I see signs about the guns. I''m wondering if any of you would like to come and explain." S. J. "Bud" Schoon, a director of the Association to Preserve Our Right to Keep and Bear Arms, calls the pending federal bill a "backdoor bill for the registration of guns." Kennedy: "All this legislation does is keep guns from criminals, and the demented and those too young." Called out: "Nazi Germany started with the registration of guns." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 218–19. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:or
      - city:roseburg
- add:
    entry:
      id: cal.1968-05-27.robert-kennedy-campaign-primaries-2
      when: May 27, night
      date: '1968-05-27'
      thread: robert-kennedy-campaign-primaries
      c: 'Portland, the Sheraton Motor Hotel, the closing reception, with Mrs. Green. The final Quayle poll: Kennedy 34 percent, McCarthy 32, Humphrey 10, Johnson 9, others 4, undecided 11. Kennedy, like a man who has lost: "I don''t know how it''s all going to turn out tomorrow. The polls say it''s like that," two fingers held tight together. Mrs. Green: "In the next twenty-four hours, we can really make a difference." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 219–20. Names: Robert Kennedy, Green, McCarthy, Humphrey, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:green-edith
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      - state:or
      - city:portland
- add:
    entry:
      id: cal.1968-05-28.robert-kennedy-campaign-primaries-6
      when: May 28, Mayfair
      date: '1968-05-28'
      thread: robert-kennedy-campaign-primaries
      c: 'Portland, the Benson Hotel, the Mayfair ballroom. Kennedy reads his telegram to McCarthy: "My sincerest congratulations on your victory here in Oregon. We can both take some satisfaction in the overwhelming expression of the Oregon voters for a change." On his organization: "I have decided to send Freckles home." He thanks the voters for "a fair judgment" and leaves through the kitchen; no press conference. By Witcover''s account.'
      n: '[[w.witcover-85-days]], 221–22 (the telegram written on the flight by Dutton, at Kennedy''s insistence, 221). See [[cal.1968-05-28.robert-kennedy-campaign-primaries-2]]. Names: Robert Kennedy, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:or
      - city:portland
- add:
    entry:
      id: cal.1968-05-28.robert-kennedy-campaign-primaries-7
      when: May 28, McCarthy
      date: '1968-05-28'
      thread: elections-1968-mccarthy
      c: 'Portland, an old Elks Club building, a rejoicing crowd. McCarthy: "Every wagon train gets as far as the Missouri River, but the real test starts up the Oregon trail." "The next test is the California trail ... California here we come!" To the press: "I haven''t had any reporter ask me who I''m going to yield to in Chicago ... I think we''ve answered it in Oregon." By Witcover''s account.'
      n: '[[w.witcover-85-days]], 222–23. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:or
      - city:portland
      also:
