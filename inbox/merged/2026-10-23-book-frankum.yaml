  - add:
      entry:
        id: cal.1964-12-10.laos
        when: Dec. 10
        date: '1964-12-10'
        thread: laos
        also: [vietnam]
        c: 'Vientiane. Sullivan with Souvanna Phouma: American armed reconnaissance over Routes 7, 8 and 12 agreed, "if we see anything moving on the road, either day or night, attack it"; nothing said in public, any plane lost to be one on reconnaissance at the government''s request. Barrel Roll, the program of Dec. 1; Dec. 19, a two-week program submitted, signaling "by design" no intensification.'
        n: '[FRUS 1964–68, XXVIII, doc. 150](https://history.state.gov/historicaldocuments/frus1964-68v28/d150); [doc. 153](https://history.state.gov/historicaldocuments/frus1964-68v28/d153) (Dec. 19); [FRUS 1964–68, I, doc. 456](https://history.state.gov/historicaldocuments/frus1964-68v01/d456) (Dec. 21). [[w.frankum-like-rolling-thunder]], 116–117, 121–122. See [[cal.1964-12-01.vietnam]]. Names: Sullivan, Souvanna Phouma.'
        tags: [name:sullivan-william-h, name:souvanna-phouma, place:vientiane]
      section: '196412'
      after: cal.1964-12-09.vietnam
  - add:
      entry:
        id: cal.1965-04-03.laos
        when: Apr. 3
        date: '1965-04-03'
        thread: laos
        also: [vietnam]
        c: 'Steel Tiger begins: American air operations against the infiltration routes of the Laotian panhandle, apart from Barrel Roll in the north and heavier. The division not told the Lao; Souvanna consulted on the intensification.'
        n: 'FRUS 1964–68, XXVIII, docs. [174](https://history.state.gov/historicaldocuments/frus1964-68v28/d174) (Mar. 20), [175](https://history.state.gov/historicaldocuments/frus1964-68v28/d175), [176](https://history.state.gov/historicaldocuments/frus1964-68v28/d176) (Mar. 25). [[w.frankum-like-rolling-thunder]], 117–118. See [[cal.1964-12-10.laos]]. Names: Souvanna Phouma.'
        tags: [name:souvanna-phouma]
      section: '196504'
  - add:
      entry:
        id: cal.1965-04-03.vietnam
        when: Apr. 3–4
        date: '1965-04-03'
        thread: vietnam
        c: 'The Thanh Hóa bridge, rail and road, struck by Air Force F-105s, Apr. 3 and 4: the spans damaged, the bridge standing. Six aircraft lost over the two days, two F-105s to MiGs, the first engagement with them. Wheeler to McNamara, Apr. 6: the bridges at Thanh Hóa and Đồng Phương destroyed, "the most damaging military blow delivered to date."'
        n: 'FRUS 1964–68, II, docs. [220](https://history.state.gov/historicaldocuments/frus1964-68v02/d220) (Mar. 30, the decision), [241](https://history.state.gov/historicaldocuments/frus1964-68v02/d241) (Apr. 6), [250](https://history.state.gov/historicaldocuments/frus1964-68v02/d250) (Apr. 13). [[w.frankum-like-rolling-thunder]], 22–23. See [[cal.1965-03-02.vietnam]]. Names: Wheeler, McNamara.'
        tags: [name:wheeler-earle, name:mcnamara-robert-s, place:thanh-hoa]
      section: '196504'
  - add:
      entry:
        id: cal.1965-12-06.laos
        when: Dec. 6
        date: '1965-12-06'
        thread: laos
        also: [vietnam]
        c: 'Tiger Hound: the eastern Laotian panhandle, from the 17th parallel to Cambodia, taken from Steel Tiger at Westmoreland''s request for MACV''s 2d Air Division. Armed reconnaissance on the roads without prior approval; American forward air controllers in O-1s; a C-130 command post with Lao officers aboard. Villages struck only with the embassy''s approval. Check the day.'
        n: '[FRUS 1964–68, XXVIII, doc. 216](https://history.state.gov/historicaldocuments/frus1964-68v28/d216) (Sullivan, Jan. 3, 1966: "established at my suggestion"); [doc. 203](https://history.state.gov/historicaldocuments/frus1964-68v28/d203) (Nov. 8). [[w.frankum-like-rolling-thunder]], 118–120: Dec. 6, and Sullivan against the division (Check). See [[cal.1965-04-03.laos]]. Names: Westmoreland, Sullivan.'
        tags: [name:sullivan-william-h, name:westmoreland-william]
      section: '196512'
  - add:
      entry:
        id: cal.1965-12-15.vietnam
        when: Dec. 15
        date: '1965-12-15'
        thread: vietnam
        c: The Uông Bí thermal power plant, north of Haiphong, struck, some 15 percent of the North's generating capacity; Lodge told Dec. 8 of State's approval of a strike on "an isolated electric power plant." Restruck over five days; the boiler house destroyed.
        n: 'FRUS 1964–68, III, docs. [221](https://history.state.gov/historicaldocuments/frus1964-68v03/d221), n. 4 (the approval), [239](https://history.state.gov/historicaldocuments/frus1964-68v03/d239), n. 2 (Dec. 21). [[w.frankum-like-rolling-thunder]], 33. See [[cal.1965-03-02.vietnam]]. Names: Lodge.'
        tags: [name:lodge-henry-cabot]
      section: '196512'
  - add:
      entry:
        id: cal.1967-01-13.laos
        when: Jan. 13
        date: '1967-01-13'
        thread: laos
        also: [vietnam]
        c: 'Popeye. Kohler to Rusk: Defense asks approval to seed clouds over the infiltration routes of North Vietnam and southern Laos and prolong the rains, unannounced. The test, October 1966 in the Se Kong valley, without the Lao government''s knowledge, Sullivan concurring: 82 percent of the clouds seeded gave rain. Rusk approves "on a strictly experimental basis," in five areas (Check the day).'
        n: '[FRUS 1964–68, XXVIII, doc. 274](https://history.state.gov/historicaldocuments/frus1964-68v28/d274), and n. 3 (Kohler to Unger, Feb. 7). [[w.frankum-like-rolling-thunder]], 120: the test Sept. 29–Oct. 28, 1966, 56 cases, 85 percent. Names: Kohler, Rusk, Sullivan.'
        tags: [name:kohler-foy-d, name:rusk-dean, name:sullivan-william-h]
      section: '196701'
  - add:
      entry:
        id: cal.1968-04-03.vietnam-2
        when: Apr. 3
        date: '1968-04-03'
        thread: vietnam
        c: 'The bombing of the North held south of the 19th parallel, short of the 20th of Clifford''s order of Mar. 31 (Check the day). Clifford, Apr. 9: "We feel comfortable with the 19th to avoid mistakes."'
        n: 'FRUS 1964–68, VI, docs. [172](https://history.state.gov/historicaldocuments/frus1964-68v06/d172) (Apr. 2), [189](https://history.state.gov/historicaldocuments/frus1964-68v06/d189) (Apr. 9). [[w.frankum-like-rolling-thunder]], 61: Apr. 3. See [[cal.1968-03-31.elections-1968]]. Names: Clifford.'
