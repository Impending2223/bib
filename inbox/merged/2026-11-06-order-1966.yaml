- edit:
    id: cal.1966-11-03.succession
    base: 85a771ed
    set:
      time: 1966-11-03T20:30Z
      n: 'The President''s News Conference of November 3, 1966, [1966 Pub. Papers 1310](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=684) (Nov. 3, 1966). To check: [[w.gilbert-mortal-presidency]]. See [[cal.1965-10-08.succession]]. Names: Johnson, Burkley.'
- edit:
    id: cal.1966-11-04.elections-1966
    base: a0a420b7
    set:
      time: 1966-11-04T15:00Z
      n: 'The President''s News Conference of November 4, 1966, [1966 Pub. Papers 1316](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=690) (Nov. 4, 1966). [[w.johns-vietnams-second-front]], 126 (Nixon''s charge; the answer, "chronic campaigner," "October every two years"); [[w.nixon-rn]], 274–75 (the question on Nixon''s statement; the answer); [[w.white-making-of-the-president-1969]], 51 ("a chronic campaigner"); [[w.califano-triumph-and-tragedy-of]], 152 (asked of the canceled trip: "First, we don''t have any plans, so when you don''t have plans, you don''t cancel plans"; Wicker, "the credibility gap"); [[w.califano-triumph-and-tragedy-of]], 291 (beforehand to Califano: "Ol'' Nixon a little attention today"; "a chronic campaigner"; after: "That ought to put him out front!"); [[w.branch-at-canaans-edge]], 544. [[w.hess-republican-establishment]], 195–97 ("a chronic campaigner"; Nixon''s answer on time the party bought). [[w.mcpherson-political-education]],
        448 (Johnson to McPherson that afternoon: "a stupid mistake"; "I probably nominated him"). To check: [[w.perlstein-nixonland-2008]]; [[w.witcover-resurrection-of-richard-nixon]]; Nixon to Eisenhower, Oct. 4, 1966, and Nixon''s newspaper column, Oct. 16, 1966, Special Names Series, box 14, Eisenhower Post-Presidential Papers, Eisenhower Library; press release, Nov. 4, 1966, Press Secretary File, box D55, Ford Congressional Papers, Ford Library (cited by [[w.johns-vietnams-second-front]], 126 n.24); [*New York Times*, Nov. 5, 1966](https://timesmachine.nytimes.com/timesmachine/1966/11/05/issue.html) (cited by [[w.johns-vietnams-second-front]], 126 n.26); "Nixon Criticizes Manila Results," NYT, Nov. 4, 1966, pele Powers, Way, p. 131 (cited by [[w.branch-at-canaans-edge]], 544); "Johnson Derides Nixon''s Criticism of Manila Stand," NYT, Nov. 5, 1966, pp. 1, 10 (cited by [[w.branch-at-canaans-edge]], 544). See [[cal.1966-10-17.vietnam]]. Names: Nixon, Johnson.'
