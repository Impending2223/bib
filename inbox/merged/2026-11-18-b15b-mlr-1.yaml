      id: cal.1965-04-09.china-leadership-3
      when: Apr. 9
      date: '1965-04-09'
      thread: china-leadership
      also:
      - china
      c: Ke Qingshi, first secretary of the Shanghai Party committee, dies at Chengdu, convalescing after lung cancer surgery.
      n: '[[w.macfarquhar-maos-last-revolution]], 16. To check: [[w.pixian-chen-pixian-huiyilu]], 28, 187–191 (cited by [[w.macfarquhar-maos-last-revolution]], 16 n.6); Email from Jake Rosen, a founding member of the U.S. Progressive Labor Party, to MacFarquhar, June 2005 (cited by [[w.macfarquhar-maos-last-revolution]], 16 n.7). Names: Ke Qingshi. Check: MacFarquhar''s note (16 n.6) has him die after overindulging at a banquet.'
