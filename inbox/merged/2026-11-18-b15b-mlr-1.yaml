- add:
    entry:
      id: cal.1965-11-15.china-leadership-5
      when: Nov. 15
      date: '1965-11-15'
      thread: china-leadership
      also:
      - china
      c: 'Peking. Xiao Xiangrong, deputy secretary general of the Military Commission, is brought before an enlarged meeting of the PLA General Staff Party Committee: anti-Mao, against putting politics first, a member-in-hiding of the Peng–Huang clique. Luo Ruiqing is away inspecting defenses on the Sino-Vietnamese frontier.'
      n: '[[w.macfarquhar-maos-last-revolution]], 22. Made public: 2006. To check: [[w.nianyi-da-dongluande-niandai-revised]], 86–87 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.31); [[w.yao-san-ci-da-nan]], 266–273 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.32a); [[w.yao-luo-ruiqing-zhuanlue-xia]], 179 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.32b); [[w.jiefangjun-jiangling-zhuan-14]], VII, 260–261 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.33a); [[w.yao-san-ci-da-nan]], 275 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.33b); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 262 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.34); [[w.jiefangjun-jiangling-zhuan-14]], VII, 261 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.35); [[w.yao-san-ci-da-nan]], 280 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.36). Names: Xiao Xiangrong, Luo Ruiqing.'
      tags:
