      id: cal.1965-02-24.china-leadership-2
      when: Feb. 24
      date: '1965-02-24'
      thread: china-leadership
      also:
      - china
      c: Mao sends Jiang Qing to Shanghai, undercover, to prepare a press attack on Wu Han. Peng Zhen's Peking Party and the Five-Man Group are kept out; Ke Qingshi gives her Zhang Chunqiao and Yao Wenyuan.
      n: '[[w.macfarquhar-maos-last-revolution]], 14–15. Made public: 2006. To check: [[w.shanghai]], 1–34 (Bergère) (cited by [[w.macfarquhar-maos-last-revolution]], 14 n.1a); [[w.shanghai]], 35–65 (Gaulton) (cited by [[w.macfarquhar-maos-last-revolution]], 14 n.1b); [[w.terrill-madame-mao]], 56–59, 130–137, 195–198, 219–226 (cited by [[w.macfarquhar-maos-last-revolution]], 14 n.2); [[w.zhisui-private-life-of-chairman]], 93–94, 103–105, 311, 356–364, 407–408 (cited by [[w.macfarquhar-maos-last-revolution]], 14 n.3a); [[w.terrill-madame-mao]], 227 (cited by [[w.macfarquhar-maos-last-revolution]], 14 n.3b); [[w.macfarquhar-origins-of-the-cultural]], III, 252–256, 443–447 (cited by [[w.macfarquhar-maos-last-revolution]], 15 n.5). Names: Mao Zedong, Jiang Qing, Peng Zhen, Ke Qingshi, Zhang Chunqiao, Yao Wenyuan. Check: MacFarquhar gives the start only; her stay is four months (15).'
