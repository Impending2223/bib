      when: Dec. 11
      date: '1965-12-11'
      thread: china-leadership
      also:
      - china
      c: Luo Ruiqing, telephoned by Zhou Enlai without being told he is the subject of the meeting, flies from Kunming to Shanghai. There Zhou and Deng Xiaoping state the charges; Luo tries to deny them, Zhou cuts him short, and he is warned not to contact Mao or Lin Biao.
