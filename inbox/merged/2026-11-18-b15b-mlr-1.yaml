      when: Nov., after the 15th
      date: 1965-11
      thread: china-leadership
      also:
      - china
      at: after 1965-11-15
      c: 'Luo Ruiqing, back in Peking a few days into the struggle meeting against Xiao Xiangrong, defends him: whatever his mistakes, he is not of the Peng–Huang clique. The meeting breaks up in confusion.'
