      when: Nov. 18
      date: '1965-11-18'
      thread: china-leadership
      also:
      - china
      c: 'Suzhou. Lin Biao issues five principles for giving prominence to politics in PLA work in 1966. The first: Mao''s works are the supreme instructions for every item of work in the whole army.'
