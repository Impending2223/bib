# ---------------------------------------------------------------- governors
  - add:
      entry:
        id: cal.1968-05-21.governors-il
        when: May 20–21
        date: '1968-05-20'
        thread: governors
        c: 'Illinois. Kerner, named by Johnson to the Seventh Circuit (nominated Mar. 11, confirmed Apr. 11), resigns as governor, May 20. Shapiro, the lieutenant governor since 1961, sworn governor, May 21, for the rest of the term.'
        n: '[Wikipedia, "Otto Kerner Jr."](https://en.wikipedia.org/wiki/Otto_Kerner_Jr.); [Wikipedia, "Samuel Shapiro (Illinois politician)"](https://en.wikipedia.org/wiki/Samuel_Shapiro_(Illinois_politician)). Check: the *Illinois Blue Book*, 1969–70. [[w.barnhart-kerner]]; [[w.peirce-great-lakes-states-of]]. See [[cal.1964-11-03.governors-il]]. Names: Kerner, Shapiro, Johnson.'
        tags: [state:il, name:kerner-otto, name:shapiro-samuel-h, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-06-11.governors-il
        when: June 11
        date: '1968-06-11'
        thread: governors
        also: [elections-1968]
        c: 'Illinois, primaries for governor. Republican: Ogilvie, president of the Cook County Board, once its sheriff, 335,727, 47.5 percent; Altorfer, the nominee for lieutenant governor in 1964, 288,904, 40.9; Stratton, governor 1953–61, 7.1; one other 4.5. Governor Shapiro unopposed.'
        n: '[*Official Vote of the State of Illinois Cast at the General Election, November 5, 1968 ... General Primary, June 11, 1968*](https://www.elections.il.gov/DocDisplay.aspx?doc=Downloads/ElectionOperations/VoteTotals/Archived/1968/1968%20GE%20and%20PE.PDF#page=90), PDF p. 90. [[w.peirce-great-lakes-states-of]]; [[w.kenney-political-passage]]. See [[cal.1968-05-21.governors-il]]. Names: Ogilvie, Altorfer, Stratton, Shapiro.'
        tags: [state:il, name:ogilvie-richard-b, name:altorfer-john-henry, name:stratton-william-g, name:shapiro-samuel-h]
  - add:
      entry:
        id: cal.1968-06-18.governors-in
        when: June 18–21
        date: '1968-06-18'
        thread: governors
        also: [elections-1968]
        c: 'Indiana''s conventions name the nominees for governor. Republicans, June 18: Whitcomb, the secretary of state, 1,260 votes, 56.9 percent; Bowen, Speaker of the House, 527; Butz, once Assistant Secretary of Agriculture, 429. Democrats, June 21: Rock, the lieutenant governor, 953; Bodine, once Speaker, 951. Branigin may not succeed himself.'
        n: 'Votes: [Wikipedia, "1968 Indiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Indiana_gubernatorial_election), from *America Votes 8* (Check: the conventions'' proceedings; Indiana''s *Election Report* prints the general only). [[w.peirce-great-lakes-states-of]]. See [[cal.1964-06-09.governors-in]]. Names: Whitcomb, Bowen, Butz, Rock, Bodine, Branigin.'
        tags: [state:in, name:whitcomb-edgar-d, name:bowen-otis-r, name:butz-earl-l, name:rock-robert-l, name:bodine-richard-c, name:branigin-roger-d]
  - add:
      entry:
        id: cal.1968-08-06.governors-ks
        when: Aug. 6
        date: '1968-08-06'
        thread: governors
        also: [elections-1968]
        c: 'Kansas, Republican primary for governor: Harman, a businessman, 133,454, 48.9 percent; Crutcher, the lieutenant governor, 128,635, 47.1; one other 4.0. Governor Docking, seeking a second two-year term, unopposed. Docking re-elected in November over Harman, 51.9 percent.'
        n: 'Votes: [Wikipedia, "1968 Kansas gubernatorial election"](https://en.wikipedia.org/wiki/1968_Kansas_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: *State of Kansas Election Statistics, 1968* (not online). [[w.socolofsky-kansas-governors]]; [[w.peirce-great-plains-states-of]]. See [[cal.1966-11-08.governors-ks]]. Names: Harman, Crutcher, Docking.'
        tags: [state:ks, name:harman-rick, name:crutcher-john-w, name:docking-robert]
  - add:
      entry:
        id: cal.1968-09-03.governors-ia
        when: Sept. 3
        date: '1968-09-03'
        thread: governors
        also: [elections-1968]
        c: 'Iowa, governor; Hughes running for the Senate. Republican primary: Ray, once State chairman, 108,744, 43.2 percent; Donald E. Johnson, once national commander of the American Legion, 77,716, 30.9; Beck 65,439, 26.0. Democratic: Franzenburg, the State treasurer, unopposed.'
        n: 'Votes: [Wikipedia, "1968 Iowa gubernatorial election"](https://en.wikipedia.org/wiki/1968_Iowa_gubernatorial_election), from the [*Summary of Official Canvass of the Votes Cast in Iowa Primary Election, September 3, 1968*](https://sos.iowa.gov/elections/pdf/results/60s/1968primcanv.pdf) (Check: the scan''s totals). [[w.larew-party-reborn]]; [[w.peirce-great-plains-states-of]]. See [[cal.1966-09-06.governors-ia]]. Names: Ray, Johnson, Beck, Franzenburg, Hughes.'
        tags: [state:ia, name:ray-robert-d, name:johnson-donald-e, name:beck-robert-k, name:franzenburg-paul, name:hughes-harold-e]
  - add:
      entry:
        id: cal.1968-09-03.governors-nd
        when: Sept. 3
        date: '1968-09-03'
        thread: governors
        also: [elections-1968]
        c: 'North Dakota, Republican primary for governor: McCarney, a candidate in 1964, 47,324, 52.5 percent, over one other, 42,845. Governor Guy unopposed for a fourth term; re-elected in November over McCarney, 54.8 percent.'
        n: '[*Official Abstract of Votes Cast at the Primary Election Held September 3, 1968*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1968-09-03-primary.pdf) (State Board of Canvassers, Sept. 17, 1968). [[w.peirce-great-plains-states-of]]. See [[cal.1964-06-30.governors-nd]]. Names: McCarney, Guy.'
        tags: [state:nd, name:mccarney-robert-p, name:guy-william-l]
  - add:
      entry:
        id: cal.1968-09-10.governors-wi
        when: Sept. 10
        date: '1968-09-10'
        thread: governors
        also: [elections-1968]
        c: 'Wisconsin, Democratic primary for governor: La Follette, the attorney general, grandson of the Progressive, 173,458, 84.5 percent; one other 15.5. Governor Knowles unopposed for a third term; re-elected in November over La Follette, 52.9 percent.'
        n: 'Votes: [Wikipedia, "1968 Wisconsin gubernatorial election"](https://en.wikipedia.org/wiki/1968_Wisconsin_gubernatorial_election), from the [*Wisconsin Blue Book*, 1970](https://search.library.wisc.edu/digital/AGMDNMSNXDGTAN8A/full/APPTZUTEORTMJZ8V) (Check: not read here). [[w.peirce-great-lakes-states-of]]. See [[cal.1966-09-13.governors-wi]]. Names: La Follette, Knowles.'
        tags: [state:wi, name:la-follette-bronson-c, name:knowles-warren-p]
  - add:
      entry:
        id: cal.1968-09-10.governors-nh
        when: Sept. 10
        date: '1968-09-10'
        thread: governors
        also: [elections-1968]
        c: 'New Hampshire''s primaries for governor; King running for the Senate. Republican: Peterson, Speaker of the House, 29,262, 34.1 percent; Wesley Powell, governor 1959–63, 26,498, 30.9; Thomson 25,275, 29.5; four others. Democratic: Bussiere, of Manchester, 12,021, 32.7 percent, over four others. Peterson elected in November over Bussiere, 52.5 percent.'
        n: '[N.H. *Manual for the General Court*, no. 41 (1969), p. 526](https://archive.org/details/manualforgeneral41newh/page/526). [Wikipedia, "1968 New Hampshire gubernatorial election"](https://en.wikipedia.org/wiki/1968_New_Hampshire_gubernatorial_election). [[w.peirce-new-england-states]]. See [[cal.1966-09-13.governors-nh]]. Names: Peterson, Powell, Thomson, Bussiere, King.'
        tags: [state:nh, name:peterson-walter-r-jr, name:powell-wesley, name:thomson-meldrim-jr, name:bussiere-emile-r, name:king-john-w]
  - add:
      entry:
        id: cal.1968-09-10.governors-vt
        when: Sept. 10
        date: '1968-09-10'
        thread: governors
        also: [elections-1968]
        c: 'Vermont, governor; Hoff not running for a fourth term. Republican primary: Davis, chairman of National Life, 36,719, 62.7 percent; Oakes, the attorney general, 21,791, 37.2. Democratic: Daley, the lieutenant governor, 97.7. Davis elected in November over Daley, 55.5 percent.'
        n: '[Vt. Secretary of State, "Primary Election Results, 1968"](https://web.archive.org/web/20160303233732/https://www.sec.state.vt.us/media/62953/p1968.pdf); [Wikipedia, "1968 Vermont gubernatorial election"](https://en.wikipedia.org/wiki/1968_Vermont_gubernatorial_election). [[w.hand-star-that-set]]; [[w.peirce-new-england-states]]. See [[cal.1966-09-13.governors-vt]]. Names: Davis, Oakes, Daley, Hoff.'
        tags: [state:vt, name:davis-deane-c, name:oakes-james-l, name:daley-john-j, name:hoff-philip-h]
  - add:
      entry:
        id: cal.1968-11-05.governors-il
        when: Nov. 5
        date: '1968-11-05'
        thread: governors
        also: [elections-1968]
        c: 'Illinois. Ogilvie (R) elected governor over Shapiro (D), 2,307,295 to 2,179,501, 51.2 percent; Shapiro carries Cook County and eighteen others.'
        n: '[*Official Vote of the State of Illinois*, 1968](https://www.elections.il.gov/DocDisplay.aspx?doc=Downloads/ElectionOperations/VoteTotals/Archived/1968/1968%20GE%20and%20PE.PDF#page=6), PDF p. 6. See [[cal.1968-06-11.governors-il]]. Names: Ogilvie, Shapiro.'
        tags: [state:il, name:ogilvie-richard-b, name:shapiro-samuel-h]
  - add:
      entry:
        id: cal.1968-11-05.governors-ri
        when: Nov. 5
        date: '1968-11-05'
        thread: governors
        also: [elections-1968, state-and-city-finance]
        c: 'Rhode Island. Licht (D), a Superior Court judge, elected governor over Chafee (R), seeking a fourth two-year term, 195,766 to 187,958, 51.0 percent. Chafee, against an income tax in three campaigns, now for one; Licht against it.'
        n: '[*Official Count of the Ballots Cast*, 1968](https://elections.ri.gov/sites/g/files/xkgbur756/files/publications/Election_Publications/Countbooks/1968-Count-Book.pdf#page=23) (R.I. Secretary of State), PDF p. 23; both unopposed in the primaries of Sept. 10 (pp. 5, 8). [Wikipedia, "John Chafee"](https://en.wikipedia.org/wiki/John_Chafee). [[w.moakley-rhode-island-politics-and]]; [[w.peirce-new-england-states]]. See [[cal.1964-09-17.governors-ri]]. Names: Licht, Chafee.'
        tags: [state:ri, name:licht-frank, name:chafee-john-h]
  - add:
      entry:
        id: cal.1969-01-01.governors-ia
        when: Jan. 1–16
        date: '1969-01-01'
        thread: governors
        c: 'Iowa. Hughes, elected to the Senate, resigns as governor, Jan. 1; Fulton, the lieutenant governor, governor for sixteen days. Ray (R), elected Nov. 5 over Franzenburg (D), 54.1 percent, sworn Jan. 16.'
        n: '[Wikipedia, "Harold Hughes"](https://en.wikipedia.org/wiki/Harold_Hughes); [Wikipedia, "Robert D. Fulton"](https://en.wikipedia.org/wiki/Robert_D._Fulton); general: [*Canvass of the Vote, General Election, November 5, 1968*](https://sos.iowa.gov/elections/pdf/results/60s/1968gencanv.pdf). Check: the *Iowa Official Register*, 1969–70. See [[cal.1968-09-03.governors-ia]]. Names: Hughes, Fulton, Ray, Franzenburg.'
        tags: [state:ia, name:hughes-harold-e, name:fulton-robert-d, name:ray-robert-d, name:franzenburg-paul]
# ---------------------------------------------------------------- New York
  - add:
      entry:
        id: cal.1968-02-02.jobs-and-wages-nyc
        when: Feb. 2–10
        date: '1968-02-02'
        thread: jobs-and-wages
        also: [states-and-cities]
        c: 'New York City. The Uniformed Sanitationmen''s Association, its members rejecting a tentative contract, strikes, Feb. 2, against the Taylor Law. Garbage piles in the streets. Lindsay asks Rockefeller for the National Guard; refused. Rockefeller proposes that the State take over the Department of Sanitation; the men return, Feb. 10. The legislature does not pass the takeover; the dispute to arbitration (Check).'
        n: '[Harvard Kennedy School case 774.0, "Labor Relations, Politics and Public Opinion: The New York City Sanitation Strike of 1968"](https://case.hks.harvard.edu/labor-relations-politics-and-public-opinion-the-new-york-city-sanitation-strike-of-1968). Check: *Public Papers of Nelson A. Rockefeller*, 1968. [[w.cannato-ungovernable-city]]; [[w.connery-rockefeller-of-new-york]]; [[w.freeman-working-class-new-york]]; [[w.smith-on-his-own-terms]]. See [[cal.1967-09-11.states-and-cities-nyc]]. Names: Lindsay, Rockefeller.'
        tags: [state:ny, city:nyc, name:lindsay-john-v, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1968-04-09.cities-and-housing-ny
        when: Apr. 9–10
        date: '1968-04-09'
        thread: cities-and-housing
        also: [states-and-cities]
        c: 'New York. The legislature, the week of King''s funeral, passes Rockefeller''s Urban Development Corporation Act (ch. 174, Laws of 1968), the Assembly after first refusing it (Check the votes): a public corporation to build housing and redevelop the cities, with its own bonds, the power to condemn, and power to override local zoning and building codes. Signed Apr. 10 (Check). Logue, of Boston''s Redevelopment Authority, its head.'
        n: '[Wikipedia, "Empire State Development Corporation"](https://en.wikipedia.org/wiki/Empire_State_Development_Corporation); [Wikipedia, "Edward J. Logue"](https://en.wikipedia.org/wiki/Edward_J._Logue). Check: *Laws of New York*, 1968, ch. 174. [[w.cohen-saving-americas-cities]]; [[w.connery-rockefeller-of-new-york]]; [[w.smith-on-his-own-terms]]. See [[cal.1968-04-04.king]]. Names: Rockefeller, Logue, King.'
        tags: [state:ny, name:rockefeller-nelson, name:logue-edward-j, name:king-martin-luther-jr]
  - add:
      entry:
        id: cal.1968-05-09.states-and-cities-nyc
        when: May 9–15
        date: '1968-05-09'
        thread: states-and-cities
        also: [jobs-and-wages]
        c: 'New York City. Ocean Hill–Brownsville''s governing board, on its personnel committee''s recommendation, ends the employment in the district of thirteen teachers and six administrators, most of Junior High School 271, May 9. The Board of Education tells them to ignore the notices; parents block the doors; 350 of the union''s teachers walk out of the district''s schools. May 15, some 300 police open the school (Check the numbers).'
        n: '[Wikipedia, "1968 New York City teachers'' strike"](https://en.wikipedia.org/wiki/1968_New_York_City_teachers%27_strike); [Chalkbeat, May 10, 2018](https://www.chalkbeat.org/newyork/2018/5/10/21105025/fifty-years-ago-teacher-oustings-that-led-to-new-york-city-s-massive-teacher-strikes/). [[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]; [[w.kahlenberg-tough-liberal]]; [[w.cannato-ungovernable-city]]. See [[cal.1967-07.states-and-cities-nyc]]; [[cal.1967-11-09.states-and-cities-nyc]]. Names: McCoy, Shanker.'
        tags: [state:ny, city:nyc, name:mccoy-rhody-a, name:shanker-albert]
  - add:
      entry:
        id: cal.1968-09-09.states-and-cities-nyc
        when: Sept. 9–30
        date: '1968-09-09'
        thread: states-and-cities
        also: [jobs-and-wages]
        c: 'New York City. The United Federation of Teachers strikes the schools on the first day, Sept. 9, for the return of the Ocean Hill teachers: 93 percent of the 58,000 out. Back Sept. 11, the Board of Education having ordered them reinstated; out again Sept. 13, the governing board refusing them, to Sept. 30 (Check the day).'
        n: '[Wikipedia, "1968 New York City teachers'' strike"](https://en.wikipedia.org/wiki/1968_New_York_City_teachers%27_strike). Check: [Tamiment Library, United Federation of Teachers records](https://findingaids.library.nyu.edu/tamwag/wag_022). See [[cal.1968-05-09.states-and-cities-nyc]]. Names: Shanker.'
        tags: [state:ny, city:nyc, name:shanker-albert]
  - add:
      entry:
        id: cal.1968-09-10.governors-ny
        when: Sept. 10
        date: '1968-09-10'
        thread: governors
        also: [congress]
        c: 'New York. Rockefeller appoints Goodell, Representative from the 38th District since 1959, to Robert Kennedy''s Senate seat until the election of 1970. Goodell resigns from the House, Sept. 9.'
        n: '[Wikipedia, "Charles Goodell"](https://en.wikipedia.org/wiki/Charles_Goodell). Check: *Cong. Rec.*, Sept. 10, 1968, the credentials. [[w.connery-rockefeller-of-new-york]]; [[w.smith-on-his-own-terms]]. See [[cal.1968-06-05.robert-kennedy]]. Names: Rockefeller, Goodell, Robert Kennedy.'
        tags: [state:ny, name:rockefeller-nelson, name:goodell-charles-e, name:kennedy-robert-f]
  - add:
      entry:
        id: cal.1968-10-14.states-and-cities-nyc
        when: Oct. 14–Nov. 17
        date: '1968-10-14'
        thread: states-and-cities
        also: [jobs-and-wages]
        c: 'New York City. The teachers'' third strike, Oct. 14, the union''s teachers kept from Ocean Hill''s classrooms. Ended Nov. 17: Allen, the State Commissioner of Education, puts the district under a State trustee; the dismissed teachers reinstated; three of its principals transferred. The schools shut 36 days in all.'
        n: '[Wikipedia, "1968 New York City teachers'' strike"](https://en.wikipedia.org/wiki/1968_New_York_City_teachers%27_strike). Check: the State Education Department''s order, Nov. 17. See [[cal.1968-05-09.states-and-cities-nyc]]. Names: Allen, Shanker, McCoy.'
        tags: [state:ny, city:nyc, name:allen-james-e-jr, name:shanker-albert, name:mccoy-rhody-a]
  - add:
      entry:
        id: cal.1968-11-05.legislatures-ny
        when: Nov. 5
        date: '1968-11-05'
        thread: legislatures
        also: [elections-1968]
        c: 'New York. Republicans take the Assembly, 78 seats to the Democrats'' 72, and keep the Senate, 33 to 24. Duryea, the Republican leader, elected Speaker, Jan. 8, 1969.'
        n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. [Wikipedia, "Perry B. Duryea Jr."](https://en.wikipedia.org/wiki/Perry_B._Duryea_Jr.). Check: the *Legislative Manual*, 1969. [[w.connery-rockefeller-of-new-york]]. See [[cal.1966-11-08.state-constitutions-ny]]. Names: Duryea.'
        tags: [state:ny, name:duryea-perry-b-jr]
# ---------------------------------------------------------------- New Jersey
  - add:
      entry:
        id: cal.1968-02.states-and-cities-nj
        when: Feb.
        date: 1968-02
        thread: states-and-cities
        also: [civil-disorders]
        c: 'New Jersey. The Governor''s Select Commission on Civil Disorder, Lilley its chairman, named by Hughes Aug. 8, 1967, reports, *Report for Action*: no evidence of a conspiracy to organize the disorders of July in Newark and Plainfield; "excessive and unjustified force" by police and Guard against Negro citizens; ninety-nine recommendations. For Newark, a five-man Board of Police Commissioners named by the mayor to hear complaints against the police. Check the day.'
        n: '[*Report for Action*](https://www.ojp.gov/pdffiles1/Digitization/69748NCJRS.pdf) (Governor''s Select Commission on Civil Disorder, State of New Jersey, Feb. 1968), iii, 142–143, 164. [Rutgers, "Governor Richard Hughes and the Newark Report"](https://governors.rutgers.edu/governor-richard-hughes-and-the-newark-report/). [[w.mumford-newark]]; [[w.tuttle-how-newark-became-newark]]. See [[cal.1967-07-12.civil-disorders]]. Names: Lilley, Hughes.'
        tags: [state:nj, city:newark, name:lilley-robert-d, name:hughes-richard-j]
# ---------------------------------------------------------------- Pennsylvania
  - add:
      entry:
        id: cal.1968-02-29.state-constitutions-pa
        when: Feb. 29
        date: '1968-02-29'
        thread: state-constitutions
        also: [legislatures]
        c: 'Harrisburg. Pennsylvania''s constitutional convention adjourns, its proposals adopted for the ballot of Apr. 23: the legislature''s apportionment; the judiciary; local government; taxation and State finance.'
        n: '[Jenkins Law Library, "1967–68 Convention"](https://guides.jenkinslaw.org/pennsylvania-constitution/1967-68-convention) (the *Journal* and *Debates* run to Feb. 29). Check: *Constitutional Proposals Adopted by the Convention, 1967–68*. See [[cal.1967-12-01.state-constitutions-pa]].'
        tags: [state:pa]
  - add:
      entry:
        id: cal.1968-04-23.state-constitutions-pa
        when: Apr. 23
        date: '1968-04-23'
        thread: state-constitutions
        also: [legislatures]
        c: 'Pennsylvania''s voters, at the primary, approve the convention''s proposals (Check the votes on each): the Senate of fifty districts and the House of 203, drawn after each census by a commission of the four floor leaders and a chairman; a unified judicial system under the Supreme Court, the justices of the peace replaced by district justices; home rule for local governments; limits on the State''s debt.'
        n: '[Jenkins Law Library, "1967–68 Convention"](https://guides.jenkinslaw.org/pennsylvania-constitution/1967-68-convention) (the *Tabulation of Votes Cast on Constitutional Proposals, Presidential Primary Election of April 23, 1968*, with the *Debates*); [the Constitution of 1968, as amended](https://www.paconstitution.org/texts-of-the-constitution/1968-2/). Check: the *Pennsylvania Manual*, vol. 99. [[w.beers-pennsylvania-politics-today-and]]. See [[cal.1968-02-29.state-constitutions-pa]].'
        tags: [state:pa]
  - add:
      entry:
        id: cal.1968-11-05.legislatures-pa
        when: Nov. 5
        date: '1968-11-05'
        thread: legislatures
        also: [elections-1968]
        c: 'Pennsylvania. Democrats take the House, 106 seats to the Republicans'' 96; Republicans keep the Senate, 27 to 23.'
        n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. Check: the *Pennsylvania Manual*, vol. 99. [[w.beers-pennsylvania-politics-today-and]]. See [[cal.1968-04-23.state-constitutions-pa]].'
        tags: [state:pa]
# ---------------------------------------------------------------- Michigan, Indiana, Iowa
  - add:
      entry:
        id: cal.1968-06-11.open-housing-mi
        when: June 11
        date: '1968-06-11'
        thread: open-housing
        also: [states-and-cities]
        c: 'Michigan. Romney signs the State''s open housing act, passed by the legislature at his request: discrimination by race, color, creed or national origin barred in all housing publicly offered for sale or rent, owner-occupied duplexes and boarding houses and short rentals excepted; the Civil Rights Commission to enforce it; in force ninety days after the session ends.'
        n: '*Pontiac Press*, [June 11, 1968](https://our.oakland.edu/bitstreams/3a5514ee-97b3-4d37-810d-27076786add9/download), 1 (UPI). Check: 1968 PA 112, its votes. [[w.fine-expanding-the-frontiers-of]]. See [[cal.1967-10.open-housing-mi]]. Names: Romney.'
        tags: [state:mi, name:romney-george-w]
  - add:
      entry:
        id: cal.1968-11-05.state-constitutions-mi
        when: Nov. 5
        date: '1968-11-05'
        thread: state-constitutions
        also: [state-and-city-finance]
        c: 'Michigan. Proposal 1, an amendment to permit a graduated income tax, rejected, 614,826 to 2,025,052, 23.3 percent yes. The law for daylight saving time refused at referendum, 1,402,562 to 1,403,052. Bonds for water pollution control and for parks approved.'
        n: 'Votes: [Wikipedia, "List of Michigan ballot proposals"](https://en.wikipedia.org/wiki/List_of_Michigan_ballot_proposals), from the *Michigan Manual*, 1969–70 (Check: not read here). [[w.peirce-great-lakes-states-of]]. See [[cal.1967-07-01.state-and-city-finance-mi]]; [[cal.1966-11-08.state-constitutions-mi]].'
        tags: [state:mi]
  - add:
      entry:
        id: cal.1968-11-05.legislatures-mi
        when: Nov. 5
        date: '1968-11-05'
        thread: legislatures
        also: [elections-1968]
        c: 'Michigan. Democrats take the House, 57 seats to the Republicans'' 53. The Senate, elected for four years in 1966, stays Republican, 20 to 18.'
        n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. Check: the *Michigan Manual*, 1969–70. See [[cal.1964-11-03.legislatures-mi]].'
        tags: [state:mi]
  - add:
      entry:
        id: cal.1968-11-05.legislatures-in
        when: Nov. 5
        date: '1968-11-05'
        thread: legislatures
        also: [elections-1968]
        c: 'Indiana. Republicans take the Senate, 35 seats to the Democrats'' 15, and keep the House, 73 to 27; Whitcomb (R) governor over Rock (D), 52.7 percent.'
        n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. Governor: [Indiana *Election Report*, 1968](https://digital.library.in.gov/Record/ISL_p16066coll37-1222) (Check: not read here); [Wikipedia, "1968 Indiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Indiana_gubernatorial_election). See [[cal.1968-06-18.governors-in]]. Names: Whitcomb, Rock.'
        tags: [state:in, name:whitcomb-edgar-d, name:rock-robert-l]
  - add:
      entry:
        id: cal.1968-11-05.legislatures-ia
        when: Nov. 5
        date: '1968-11-05'
        thread: legislatures
        also: [elections-1968]
        c: 'Iowa. Republicans take the Senate, 45 seats to the Democrats'' 16, and keep the House, 86 to 38.'
        n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. Check: the *Iowa Official Register*, 1969–70. [[w.larew-party-reborn]]. See [[cal.1965-01-11.legislatures-ia]].'
        tags: [state:ia]
# ---------------------------------------------------------------- Illinois and Chicago
  - add:
      entry:
        id: cal.1968-11-05.state-constitutions-il
        when: Nov. 5
        date: '1968-11-05'
        thread: state-constitutions
        c: 'Illinois''s voters call a constitutional convention, 2,979,972 to 1,135,440: 63.3 percent of all the ballots cast, where a majority of them was required. The first call put to them since 1934, refused then. The delegates to be elected in 1969.'
        n: '[*Official Vote of the State of Illinois*, 1968](https://www.elections.il.gov/DocDisplay.aspx?doc=Downloads/ElectionOperations/VoteTotals/Archived/1968/1968%20GE%20and%20PE.PDF#page=50), PDF pp. 50–53 (the OCR of the totals unclear here); the figures, [Wikipedia, "1968 Illinois elections"](https://en.wikipedia.org/wiki/1968_Illinois_elections). [[w.peirce-great-lakes-states-of]]. See [[cal.1962-11-06.state-constitutions-il]].'
        tags: [state:il]
# ---------------------------------------------------------------- Wisconsin, Ohio
  - add:
      entry:
        id: cal.1968-04-02.mayors-milwaukee
        when: Apr. 2
        date: '1968-04-02'
        thread: mayors
        also: [elections-1968]
        c: 'Milwaukee. Maier re-elected mayor for a third term, 86 percent, carrying every ward.'
        n: '[Wikipedia, "Henry Maier"](https://en.wikipedia.org/wiki/Henry_Maier); [Encyclopedia of Milwaukee, "Henry W. Maier"](https://emke.uwm.edu/entry/henry-w-maier/). Check: the day, and the Board of Election Commissioners'' canvass. [[w.jones-selma-of-the-north]]; [[w.maier-challenge-to-the-cities]]. See [[cal.1967-12-12.open-housing-milwaukee]]. Names: Maier.'
        tags: [state:wi, city:milwaukee, name:maier-henry-w]
  - add:
      entry:
        id: cal.1968-04-30.open-housing-milwaukee
        when: Apr. 30
        date: '1968-04-30'
        thread: open-housing
        also: [states-and-cities]
        c: 'Milwaukee. The Common Council refuses Phillips''s ordinance covering all housing, 12–7, then passes one drafted in Maier''s office on the model of the federal act, amended by Phillips to except only owner-occupied buildings of two units or fewer: 15–4. Maier signs May 8; in force May 10.'
        n: '[Milwaukee Public Library, "200 Nights That Shook Milwaukee"](https://mpl.org/blog/now/200-nights-that-shook-milwaukee-the-1967-1968-open-housing-marches). Check: the Common Council''s *Proceedings*, Apr. 30, 1968. See [[cal.1967-12-12.open-housing-milwaukee]]. Names: Phillips, Maier.'
        tags: [state:wi, city:milwaukee, name:phillips-vel, name:maier-henry-w]
  - add:
      entry:
        id: cal.1968-05-01.states-and-cities-cleveland
        when: May 1
        date: '1968-05-01'
        thread: states-and-cities
        also: [poverty]
        c: 'Cleveland. Stokes, on television, announces Cleveland: Now!, public and private money for jobs, housing, health, youth and the downtown: $1.5 billion in ten years, $177 million in the first two (Check). After Glenville, word that money from it had reached Ahmed Evans''s group stops the gifts.'
        n: '[*Encyclopedia of Cleveland History*, "Cleveland: Now!"](https://case.edu/ech/articles/c/cleveland-now). [[w.moore-carl-b-stokes-and]]; [[w.stradling-where-the-river-burned]]; [[w.stokes-promises-of-power]]; [[w.masotti-shoot-out-in-cleveland]]. See [[cal.1967-11-07.mayors-cleveland]]. Glenville: [[cal.1968-07-23.civil-disorders]]. Names: Stokes.'
        tags: [state:oh, city:cleveland, name:stokes-carl-b]
  - add:
      entry:
        id: cal.1968-07.states-and-cities-nyc
        when: July
        date: 1968-07
        thread: states-and-cities
        c: 'New York City. Lindsay names Galamison, of the school boycott of 1964, to the Board of Education, enlarged by the legislature''s act of the session (the Marchi law), which put off a plan of decentralization for a year (Check the act and its terms).'
        n: '[Wikipedia, "Milton Galamison"](https://en.wikipedia.org/wiki/Milton_Galamison). Check: *Laws of New York*, 1968, the act. See [[cal.1968-05-09.states-and-cities-nyc]]. Names: Lindsay, Galamison.'
        tags: [state:ny, city:nyc, name:lindsay-john-v, name:galamison-milton-a]
  - add:
      entry:
        id: cal.1968-11-05.state-constitutions-ia
        when: Nov. 5
        date: '1968-11-05'
        thread: state-constitutions
        also: [legislatures]
        c: 'Iowa''s voters adopt five amendments: the legislature''s apportionment, 469,449 to 263,886; its members'' pay, 389,435 to 350,277; annual sessions, 394,258 to 366,591; the governor''s item veto, 411,472 to 328,273; home rule for cities, 486,749 to 256,236.'
        n: '[*Iowa Official Register*, 1969–70](https://publications.iowa.gov/41454/1/Iowa%20Official%20Register%201969-1970.pdf#page=362), PDF pp. 362–364 (S.J.R. 8, 10, 4, 2, 1). [[w.peirce-great-plains-states-of]]. See [[cal.1965-01-11.legislatures-ia]].'
        tags: [state:ia]
