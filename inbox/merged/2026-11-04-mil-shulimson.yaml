patch: 2026-11-04-mil-shulimson
by: Claude (the military re-read, group jcs, Nov. 5, 2026), from Shulimson, JCS and the War in Vietnam, pt. 1
ops:
  - add:
      entry:
        id: cal.1960-03-30.vietnam
        when: Mar. 30
        date: '1960-03-30'
        thread: vietnam
        c: The Joint Chiefs approve Lemnitzer's proposal of Mar. 24 to send Army Special Forces training teams to South Vietnam and ask Felt his needs. Felt gets three Special Forces detachments of ten and three intelligence officers, 33 men, to train South Vietnamese Ranger cadres.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 22. A later Army study: the decision "reversed past policy" (25). Names: Lemnitzer, Felt.'
        src:
          c: db3a82fb
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 22: all'
        tags: [name:lemnitzer-lyman-l, name:felt-harry-d]
      section: '196003'
  - cite:
      id: cal.1960-11-11.vietnam
      item: '[[w.schulimson-joint-chiefs-of-staff]], 26 (Thi''s three battalions of paratroopers and two companies of marines, the early hours of Nov. 11)'
      units: A-B
  - add:
      entry:
        id: cal.1961-03-23.laos-2
        when: Mar. 23
        date: '1961-03-23'
        thread: laos
        c: Pathet Lao gunners shoot down an American C-47 on reconnaissance over the Plain of Jars, from Vientiane for Saigon, with the Royal government's leave. Maj. L. B. Bailey, the assistant Army attaché, parachutes and is taken; a prisoner over a year.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 64.'
        src:
          c: 95d61416
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 64: all'
      section: '196103'
  - add:
      entry:
        id: cal.1961-04-05.laos
        when: Apr. 5
        date: '1961-04-05'
        thread: laos
        c: The Royal Laotian Army, American "technicians" with it, drops paratroops from C-47s and lands infantry by helicopter north of Muong Kasi, on the crossroads between Vientiane and Luang Prabang; the second phase of the offensive fails. The same day Felt reports Task Force 116, on heightened alert since Mar. 22, able to land in Laos within 48 hours of "the order to execute."
        n: '[[w.schulimson-joint-chiefs-of-staff]], 67. Names: Felt.'
        src:
          c: c1b72c17
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 67: all'
        tags: [name:felt-harry-d]
      section: '196104'
  - add:
      entry:
        id: cal.1961-04-29.laos-3
        when: Apr. 29–May 1
        date: '1961-04-29'
        thread: laos
        also: [vietnam]
        c: The Joint Chiefs direct Felt to plan moving two brigades of 5,000 into Thailand and South Vietnam, "US forces only," under the President's authority of Apr. 26; May 1 Felt reports the plans done, two attack carrier task forces off South Vietnam with them.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 80. See [[cal.1961-04-29.laos]]. Names: Felt.'
        src:
          c: 115b90ec
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 80: all'
        tags: [name:felt-harry-d]
      section: '196104'
  - add:
      entry:
        id: cal.1961-05-14.laos
        when: May 14
        date: '1961-05-14'
        thread: laos
        c: Felt ends the alert of the naval forces in the South China Sea and the Gulf of Siam.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 87. The Seventh Fleet''s commander, May 18: "we can pick up the pieces... [and be] ready to jump again" (87). Names: Felt.'
        src:
          c: 2ca8c91d
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 87: all'
        tags: [name:felt-harry-d]
      section: '196105'
  - add:
      entry:
        id: cal.1961-05-30.laos-2
        when: May 30
        date: '1961-05-30'
        thread: laos
        c: Two American "volunteer" pilots killed when their helicopter crashes trying to land supplies for the Hmong besieged by the Pathet Lao at Padong.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 87.'
        src:
          c: eee9cecf
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 87: all'
      section: '196105'
  - add:
      entry:
        id: cal.1961-06-07.laos
        when: June 7
        date: '1961-06-07'
        thread: laos
        c: Padong falls. A Pathet Lao ground and artillery assault drives the Hmong from their base camp; Vang Pao sets up some ten miles southwest.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 88. See [[cal.1961-05-30.laos-2]].'
        src:
          c: 89b30374
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 88: all'
      section: '196106'
  - cite:
      id: cal.1961-09-17.vietnam
      item: '[[w.schulimson-joint-chiefs-of-staff]], 109'
      units: A-B
  - add:
      entry:
        id: cal.1961-11-11.vietnam-3
        when: Nov. 11
        date: '1961-11-11'
        thread: vietnam
        c: Air Force headquarters tells CINCPAC it is sending six C-123s to South Vietnam, under the Pacific Command, fitted with MC-1 spray tanks, to be based at Biên Hòa with the Jungle Jim unit, code name Farm Gate.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 149.'
        src:
          c: f8cc8733
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 149: all'
        tags: [place:bien-hoa-air-base]
      section: '196111'
  - add:
      entry:
        id: cal.1961-11-14.vietnam-3
        when: Nov. 14
        date: '1961-11-14'
        thread: vietnam
        c: 'Jungle Jim at Biên Hòa: elements of the 4400th Detachment, about 230 men, eight T-28s refitted for counterinsurgency among a few World War II aircraft; 67 more at Tân Sơn Nhứt. From mid-November American aircraft fly reconnaissance and photographic missions.'
        n: '[[w.schulimson-joint-chiefs-of-staff]], 147.'
        src:
          c: 02ab385d
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 147: all'
        tags: [place:bien-hoa-air-base]
      section: '196111'
  - add:
      entry:
        id: cal.1961-11-17.vietnam-2
        when: Nov. 17
        date: '1961-11-17'
        thread: vietnam
        c: McNamara directs the Joint Chiefs to send the two Army helicopter companies MAAG asked Oct. 25 to the Western Pacific, under cover of an exercise, Great Shelf. Nov. 27 he has their orders, the units aboard the *Core* and two freighters, changed to "Destination Saigon."
        n: '[[w.schulimson-joint-chiefs-of-staff]], 147. See [[cal.1961-12-11.vietnam]]. Names: McNamara.'
        src:
          c: 1dcaa263
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 147: all'
        tags: [name:mcnamara-robert-s]
      section: '196111'
  - add:
      entry:
        id: cal.1961-11-25.vietnam
        when: Nov. 25
        date: '1961-11-25'
        thread: vietnam
        c: Nolting protests the arrival of an advance echelon of the 2nd Air Division, under McGarr but reporting also to the Thirteenth Air Force for operations outside Vietnam; air operations from Vietnam to be cleared through him.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 161. Names: Nolting, McGarr.'
        src:
          c: 42c85ddd
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 161: all'
        tags: [name:nolting-frederick-e-jr, name:mcgarr-lionel-c]
      section: '196111'
  - add:
      entry:
        id: cal.1961-12-04.vietnam
        when: Dec. 4
        date: '1961-12-04'
        thread: vietnam
        c: A joint Air Force and Navy detachment arrives at Nha Trang "to instruct Vietnamese pilots and maintenance personnel."
        n: '[[w.schulimson-joint-chiefs-of-staff]], 148.'
        src:
          c: ca5af71b
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 148: all'
        tags: [place:nha-trang]
      section: '196112'
  - add:
      entry:
        id: cal.1962-03-15.vietnam
        when: Mar. 15
        date: '1962-03-15'
        thread: vietnam
        c: Saigon authorizes its AD-6s to use "rockets, napalm and anti-personnel bombs" as well as 20mm cannon. Diệm had lifted the grounding after the palace bombing Mar. 1, with nothing heavier than 20mm.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 188–89. See [[cal.1962-02-27.vietnam]]. Names: Ngô Đình Diệm.'
        src:
          c: eae2e3ed
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 188–89: all'
        tags: [name:ngo-dinh-diem]
      section: '196203'
  - add:
      entry:
        id: cal.1962-03-19.vietnam
        when: Mar. 19
        date: '1962-03-19'
        thread: vietnam
        c: The Joint Chiefs approve Felt's recommendation of Mar. 14 to send a Marine helicopter squadron in place of the fourth Army company, over the senior Army commander in the Pacific; Shoup concurs reluctantly.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 194–95. Names: Felt, Shoup.'
        src:
          c: f8265ac0
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 194–95: all'
        tags: [name:felt-harry-d, name:shoup-david-m]
      section: '196203'
  - add:
      entry:
        id: cal.1962-03-26.vietnam
        when: Mar. 26
        date: '1962-03-26'
        thread: vietnam
        c: Kennedy, at State's and Defense's request, authorizes American forces "to intercept Communist aircraft over South Vietnam," in secret.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 194. Names: Kennedy.'
        src:
          c: 10cb46eb
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 194: all'
        tags: [name:kennedy-john-f]
      section: '196203'
  - add:
      entry:
        id: cal.1962-04-15.vietnam
        when: Apr. 15
        date: '1962-04-15'
        thread: vietnam
        c: The Marine medium helicopter squadron HMM-362, 24 aircraft, flies from the *Princeton* to the old Japanese airstrip at Sóc Trăng in the Delta, the fourth American helicopter unit in Vietnam (Shufly).
        n: '[[w.schulimson-joint-chiefs-of-staff]], 194–95. Farm Gate''s men to reach 2,429, more than double the end of 1961 (194). See [[cal.1962-03-19.vietnam]].'
        src:
          c: 6965c076
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 194–95: all'
        tags: [place:soc-trang]
      section: '196204'
  - add:
      entry:
        id: cal.1962-05-11.laos
        when: May 11
        date: '1962-05-11'
        thread: laos
        c: Felt orders the helicopter carrier *Valley Forge*, a Marine battalion landing team aboard, to the Gulf of Siam, and asks the Joint Chiefs' approval to land the Marines at Bangkok for Udorn, some 35 miles from the Laotian border. Houei Sai falls to the Pathet Lao the same day.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 225. See [[cal.1962-05-06.laos]]. Names: Felt.'
        src:
          c: d6b22dd7
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 225: all'
        tags: [name:felt-harry-d]
      section: '196205'
  - add:
      entry:
        id: cal.1962-05-17.laos
        when: May 17–18
        date: '1962-05-17'
        thread: laos
        c: About 6:50 a.m., two ships of the amphibious ready group with BLT 3/9 and HMM-261 enter Bangkok harbor, the *Valley Forge* anchored outside. By May 18 most of the Marines at Udorn.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 231–32. See [[cal.1962-05-15.laos]].'
        src:
          c: dc8df81d
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 231–32: all'
      section: '196205'
  - add:
      entry:
        id: cal.1962-07-31.laos
        when: July 31
        date: '1962-07-31'
        thread: laos
        c: The last Marine combat unit leaves Udorn; the Army units soon after.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 238. See [[cal.1962-05-17.laos]].'
        src:
          c: 7712c2f1
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 238: all'
      section: '196207'
  - add:
      entry:
        id: cal.1962-11-26.vietnam
        when: Nov. 26
        date: '1962-11-26'
        thread: vietnam
        c: Diệm, at Harkins's urging, signs a directive abolishing the Field Command, making the Mekong Delta a new IV Corps, setting up an Unconventional Warfare Directorate for the special forces and irregulars, three service commands, and tactical and logistic support units for each corps.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 273. Names: Ngô Đình Diệm, Harkins.'
        src:
          c: 13ca550a
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 273: all'
        tags: [name:ngo-dinh-diem, name:harkins-paul-d]
      section: '196211'
  - add:
      entry:
        id: cal.1962-12-20.vietnam
        when: Dec. 20
        date: '1962-12-20'
        thread: vietnam
        c: Gilpatric, for McNamara at NATO, asks Kennedy for 18 more aircraft and 117 more Air Force men in Vietnam, 95 of them in combat roles. Forrestal sends it on Dec. 21; Kennedy approves Dec. 31.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 273–74. Names: Gilpatric, Kennedy, Forrestal.'
        src:
          c: 03a05ecd
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 273–74: all'
        tags: [name:gilpatric-roswell-l, name:kennedy-john-f, name:forrestal-michael-v]
      section: '196212'
  - cite:
      id: cal.1963-01-02.vietnam
      item: '[[w.schulimson-joint-chiefs-of-staff]], 277 (the 7th Division''s operation against a suspected transmitter near Ấp Bắc)'
      units: A-B
  - add:
      entry:
        id: cal.1963-01-07.vietnam
        when: Jan. 7
        date: '1963-01-07'
        thread: vietnam
        c: After Ấp Bắc, the Joint Chiefs form a team under Wheeler, the Army Chief of Staff, for an "up to date assessment of the situation in Vietnam," six general officers among its members. It reaches Saigon Jan. 18.
        n: '[[w.schulimson-joint-chiefs-of-staff]], 280. See [[cal.1963-01-02.vietnam]]. Names: Wheeler.'
        src:
          c: 4b222d60
          rows:
            - 'w.schulimson-joint-chiefs-of-staff 280: all'
        tags: [name:wheeler-earle]
      section: '196301'
