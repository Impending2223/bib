        n: '[[w.zhou-enlai-nianpu-1949]], II, 769 (Dec. 24, 1965). Names: Zhou Enlai, Huang Yanpei.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-12-24.china-leadership
        when: 'Dec. 24'
        date: '1965-12-24'
        thread: china-leadership
        c: 'Zhou writes Deng Xiaoping and Li Fuchun: at the State Council''s ministries'' briefing he said heads of each unit (some only party-group or committee members) may on return tell their party group or committee about "Luo"''s matter, but not pass it down or take notes; hears that Party ministries, the trade-union, youth and women''s bodies and party groups keep it to the person; asks whether to tell them also to relay at their level, for uniformity. Deng the same day: Li Zhizhong, deputy director of the Central Committee''s General Office, to tell the units, as the premier says.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 769–70 (Dec. 24, 1965). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping, Li Fuchun, Li Zhizhong, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:deng-xiaoping, name:li-fuchun, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
