        n: '[[w.zhou-enlai-nianpu-1949]], II, 760 (Oct. 25, 1965). Names: Zhou Enlai, Pak Se-chang.'
        tags: [name:zhou-enlai, polity:prc, polity:dprk]
  - add:
      entry:
