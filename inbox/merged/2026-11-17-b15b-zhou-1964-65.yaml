  - add:
      entry:
        id: cal.1965-10-20.china-leadership-2
        when: 'Oct. 20'
        date: '1965-10-20'
        thread: china-leadership
        also: [africa, middle-east]
        c: 'Zhou receives UAR ambassador Imam. For the second Asian-African conference China firmly holds for postponement to avoid a split; the situation threatens split, and China will certainly not attend; if no agreement is reached and a vote is taken it breaks the spirit of Bandung.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 759 (Oct. 20, 1965). Made public: 1997. Names: Zhou Enlai, Imam.'
        tags: [name:zhou-enlai, polity:prc, polity:uar, vis:only:prc+uar]
  - add:
      entry:
        id: cal.1965-10-22.china-leadership
        when: 'Oct. 22'
        date: '1965-10-22'
        thread: china-leadership
        also: [africa, soviet-union]
        c: 'Zhou writes the heads of Asian and African states and governments: China has steadily and actively supported the second Asian-African conference and worked for it; finding that if held it would face a split, it agreed to postponement. In the complex present, for Asian-African unity, the gains and losses of meeting now must be weighed with care; China, after repeated consideration, holds that rather than force a meeting against consensus and split Asia and Africa, it is better not to meet for the time, which helps Asian and African peoples keep the Bandung spirit. If a meeting is forced on time China will be obliged not to attend a meeting that leads to a split.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 759–60 (Oct. 22, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-10-22.china-leadership-2
        when: 'Oct. 22'
        date: '1965-10-22'
        thread: china-leadership
        c: 'Zhou writes Bertrand Russell praising his courage in condemning American aggression at public meetings and his support of internationalism and peace.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 760 (Oct. 22, 1965). Names: Zhou Enlai, Bertrand Russell.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-10-23.china-leadership
        when: 'Oct. 23'
        date: '1965-10-23'
        thread: china-leadership
        also: [indonesia, africa]
        c: 'Zhou tells Ambassador Yao Zhongming in Indonesia by wire to see Subandrio, state China''s position on calling the conference and ask Indonesia''s.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 760 (Oct. 23, 1965). Made public: 1997. Names: Zhou Enlai, Yao Zhongming, Subandrio.'
        tags: [name:zhou-enlai, name:subandrio, polity:prc, vis:only:prc]
  - add:
