        date: '1965-10-08'
        thread: china-leadership
        c: 'Zhou calls responsible officials on planning, grain, relief and water work, Oct. 8, 11 and 21.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 758 (Oct. 8, 11 and 21, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-10-08.china-leadership-3
