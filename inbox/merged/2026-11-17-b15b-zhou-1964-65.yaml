        thread: china-leadership
        also: [laos]
        c: 'The Chinese–Lao joint communiqué issued: China hopes sincerely that Laos''s three political forces will unite, keep out outside interference and settle their problems peacefully.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 632 (Apr. 8, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:laos]
  - add:
      entry:
        id: cal.1964-04-08.china-leadership-2
        when: 'Apr. 8'
        date: '1964-04-08'
        thread: china-leadership
        c: 'Zhou calls the authors and directors of prize-winning plays *Surging Forward*, *One Family* and *After the Harvest*, Hu Wanchun, Huang Zuolin, Lan Cheng, with Xia Yan, to talk on drama. Promote a thing with care; the Leap, the communes, the Three Red Banners were right in direction, with mistakes in execution, as Mao says: divide one into two. Revise a piece a dozen or twenty times and listen to criticism; writers need tolerance. The main current is workers, peasants, soldiers; go down and stay long; help immature works, do not blame.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 632 (Apr. 8, 1964). Names: Zhou Enlai, Hu Wanchun, Huang Zuolin, Xia Yan.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-04-08.china-leadership-3
        when: 'Apr. 8'
        date: '1964-04-08'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou wires King Jigme Dorji Wangchuck of Bhutan, condoling the death of Prime Minister Jigme Dorji by assassination.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 632 (Apr. 8, 1964). Names: Zhou Enlai, Jigme Dorji Wangchuck.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-04-09.china-leadership-2
        when: 'Apr. 9'
        date: '1964-04-09'
        thread: china-leadership
        also: [japan]
        c: 'Zhou receives the Japanese Communist Party delegation under Hakamada Satomi.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 632 (Apr. 9, 1964). Made public: 1997. Names: Zhou Enlai, Hakamada Satomi.'
        tags: [name:zhou-enlai, polity:prc, polity:japan, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1964-04-10.china-leadership
        when: 'Apr. 10'
        date: '1964-04-10'
        thread: china-leadership
        also: [china]
        c: 'Zhou, with Zhu De, Li Fuchun, Li Xiannian and others, hears the leading group of the national agricultural planning conference. On its summary outline: "leaders, masses, experts in three-way union", who are "the masses"? State it plainly. Experience is good to present, but conditions differ and one place''s cannot go everywhere untested. On Dazhai: give some matter, not only spirit; how it was done, how the "eight-word charter" was applied, what the state gave; both legs. Each place is to find its own model. Planners want long plans large, capital construction large and annual plans small, against Mao''s "long-term plans with margin, annual plans pushed to exceed". Sums up the outline''s 500 million mu of farmland: low base, small potential, high demands, large investment. Planning work not yet complete or mature; to study further.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 632–33 (Apr. 10, 1964). Made public: 1997. Names: Zhou Enlai, Zhu De, Li Fuchun, Li Xiannian.'
        tags: [name:zhou-enlai, name:zhu-de, name:li-fuchun, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-11.china-leadership
        when: 'Apr. 11'
        date: '1964-04-11'
        thread: china-leadership
        also: [testing]
        c: 'Zhou chairs the eighth meeting of the Special Commission of the Central Committee. Since the uranium enrichment plant produced highly enriched uranium fit for a bomb on Jan. 14, the key test is solved. Proposes: all preparations for the atomic test by Sept. 10, then wait for the Standing Committee to send its cadres to the site and fix the date; the weather service to forecast exactly; guard against accidents, join revolutionary drive to scientific spirit.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 633 (Apr. 11, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-12.china-leadership
        when: 'Apr. 12'
        date: '1964-04-12'
        thread: china-leadership
        also: [africa]
        c: 'Zhou drafts for the Central Committee a telegram to Chen Yi for the preparatory meeting of the second Asian-African conference: if held next year in Africa, a contest among Cairo, Addis Ababa, Algiers and a black African capital; settle time, place and members as a package; meet the UAR, Algeria, Guinea, Ghana, Tanganyika and West Asian delegates often.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 633–34 (Apr. 12, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
