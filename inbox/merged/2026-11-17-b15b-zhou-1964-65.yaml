        date: '1964-03-24'
        thread: china-leadership
        also: [africa]
        c: 'Zhou attends the dinner given by Chen Yi and Mrs. Zhang Qian for the Albanian and Afro-Asian ambassadors in Beijing whose countries the delegation visited; tells of his impressions of the fourteen countries.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 628 (Mar. 24, 1964). Names: Zhou Enlai, Chen Yi, Zhang Qian.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1964-03-24.china-leadership-2
        when: 'Mar. 24'
        date: '1964-03-24'
        thread: china-leadership
        also: [africa, middle-east]
        c: 'Zhou receives the ambassadors of Kenya, Ghana, the UAR, Morocco, Iraq and Syria. Iraq''s ambassador Amin: Iraq, Syria and other Arab states want him to visit. Zhou: warmly received in every Arab country visited; on some questions no agreement but frank talk brought agreement on many. The second Asian-African and second non-aligned conferences differ in nature, scope and tasks, cannot replace each other; both should succeed and need not exclude one another; which comes first matters little.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 628 (Mar. 24, 1964). Made public: 1997. Names: Zhou Enlai, Amin.'
        tags: [name:zhou-enlai, polity:prc, polity:iraq, vis:only:prc+iraq]
  - add:
      entry:
        id: cal.1964-03-25.china-leadership
        when: 'Mar. 25'
        date: '1964-03-25'
        thread: china-leadership
        c: 'Zhou receives the Tirana University delegation under Karaman Ili. Again praises Albania''s efficiency in helping plant olives in China; the forestry bodies are to protect the seedlings. To Guo Moruo, Du Runsheng and others: no complacency, there is grass everywhere, send people to Albania to learn; the Academy of Sciences is to change "investigate" to "learn", investigation is conceit. Same day attends the signing of the Academy–Tirana University agreement and its 1964–65 plan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 628–29 (Mar. 25, 1964). Names: Zhou Enlai, Guo Moruo, Du Runsheng.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
