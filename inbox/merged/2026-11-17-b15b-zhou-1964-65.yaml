        when: 'Apr. 1'
        date: '1964-04-01'
        thread: china-leadership
        also: [africa, middle-east]
        c: 'Zhou, on the Foreign Ministry and Foreign Economic Liaison Bureau''s request to send an expert group to Syria for talks on aid projects: from this year, experts'' round-trip fares abroad are to be paid by themselves, not only the going but the return.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 629 (Apr. 1, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
