        thread: china-leadership
        also: [soviet-union, china]
        c: 'Zhou, the Sino-Soviet border talks at Beijing since Feb. 25 having made no progress, calls the responsible officials to discuss them: Apr. 2, 10 and 28.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 631 (Apr. 2, 10 and 28, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-02.china-leadership-2
        when: 'Apr. 2–16'
        date: '1964-04-02'
        thread: china-leadership
        also: [china, africa]
        c: 'Zhou, Apr. 2–16, calls those concerned to discuss and revise the report on the fourteen-country trip given to the NPC Standing Committee and the State Council. The final ending: in the end socialist construction at home must go well and strength grow, to do better one''s international duty. Each draft goes to Mao for opinion.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 631 (Apr. 2–16, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-04.china-leadership
        when: 'Apr. 4'
        date: '1964-04-04'
        thread: china-leadership
        also: [laos]
        c: 'Zhou, Beijing: talks with Souvanna Phouma, premier of Laos, who has come at China''s invitation with the Lao government delegation. The states to the Geneva Agreements must keep them, but first Laos''s government must carry out its own political program; China is an important factor in guaranteeing them, a more important one is the side that does not observe them.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 631–32 (Apr. 4, 1964). Made public: 1997. Names: Zhou Enlai, Souvanna Phouma.'
        tags: [name:zhou-enlai, name:souvanna-phouma, polity:prc, polity:laos, vis:only:prc+laos]
  - add:
      entry:
        id: cal.1964-04-04.china-leadership-2
        when: 'Apr. 4'
        date: '1964-04-04'
        thread: china-leadership
        also: [laos]
        c: 'Zhou, evening, at the banquet for Souvanna Phouma and the Lao delegation: China has always respected Laos''s independence and neutrality, keeps its obligations, and opposes imperialist aggression and interference in Laos.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 632 (Apr. 4, 1964). Names: Zhou Enlai, Souvanna Phouma.'
        tags: [name:zhou-enlai, name:souvanna-phouma, polity:prc, polity:laos]
  - add:
