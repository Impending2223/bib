        when: 'Nov. 26'
        date: '1965-11-26'
        thread: china-leadership
        c: 'Zhou, with Luo Ruiqing, receives delegates of the PLA naval units decorated in the "Chongwu sea battle"; discusses tactics at sea with the men; sum up this fight''s experience; do not be proud in victory or lose heart in defeat.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 767 (Nov. 26, 1965). Names: Zhou Enlai, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:luo-ruiqing, polity:prc]
  - add:
      entry:
        id: cal.1965-11-26.china-leadership-2
        when: 'Nov. 26'
        date: '1965-11-26'
        thread: china-leadership
        c: 'Zhou, at Shanghai, gives a banquet for Anna Louise Strong''s eightieth birthday: Strong is forty "public years", not old but middle-aged; she has done much work for the Chinese and world''s people; her spirit is young.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 767 (Nov. 26, 1965). Names: Zhou Enlai, Anna Louise Strong.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
