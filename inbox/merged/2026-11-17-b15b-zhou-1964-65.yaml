  - add:
      entry:
        id: cal.1965-12-20.china-leadership
        when: 'Dec. 20'
        date: '1965-12-20'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou, at the reception given by Trần Văn Thanh, head of the Front''s permanent mission in China, for its fifth anniversary: the American "unconditional negotiation" is conditional, that the people of the South lay down arms, stop resisting, and the North give up its countrymen; the U.S., deep in the Vietnam swamp, plots new widening, perhaps to all Indochina and China. The Chinese people are long prepared; if it insists on widening, on another contest with them, they will answer and see it through.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 769 (Dec. 20, 1965). Check: the form of the Front name. Names: Zhou Enlai, Trần Văn Thanh.'
        tags: [name:zhou-enlai, polity:prc, polity:nlf]
  - add:
      entry:
        id: cal.1965-12-21.china-leadership-2
        when: 'Dec. 21'
        date: '1965-12-21'
        thread: china-leadership
        c: 'Huang Yanpei dies; Zhou goes to take leave of the body.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 769 (Dec. 21, 1965). Names: Huang Yanpei, Zhou Enlai.'
