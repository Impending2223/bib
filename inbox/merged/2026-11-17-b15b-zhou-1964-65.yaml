        n: '[[w.zhou-enlai-nianpu-1949]], II, 629 (Mar. 25, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, polity:prc, polity:japan, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1964-03-25.china-leadership-3
        when: 'Mar. 25'
        date: '1964-03-25'
        thread: china-leadership
        c: 'Zhou receives and dines performers of the Oriental Song and Dance Ensemble; talks about its development. Urges Wang Kun and others to join singing with local speech, opera and folk song; seats Wang Kun and Zhang Jun in the middle: why always the premier in the middle and the performers at the side, today let us change.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 629 (Mar. 25, 1964). Names: Zhou Enlai, Wang Kun.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
