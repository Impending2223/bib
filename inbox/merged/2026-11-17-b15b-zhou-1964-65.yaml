        id: cal.1964-04-14.china-leadership
        when: 'Apr. 14'
        date: '1964-04-14'
        thread: china-leadership
        also: [china]
        c: 'Zhou calls Tong Xiaopeng and Luo Qingchang to talk on the Taiwan question.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 634 (Apr. 14, 1964). Made public: 1997. Names: Zhou Enlai, Tong Xiaopeng, Luo Qingchang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-15.china-leadership
        when: 'Apr. 15'
        date: '1964-04-15'
        thread: china-leadership
        c: 'Zhou, on the note recording Tian Jiaying''s telephone call asking views on the selected-readings edition of Mao''s works, writes: "Your letter of Apr. 10 and its attachment I have read; no different opinion."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 634 (Apr. 15, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Tian Jiaying.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-15.china-leadership-2
        when: 'Apr. 15'
        date: '1964-04-15'
        thread: china-leadership
        c: 'Zhou, on the All-China Federation of Trade Unions party group''s request on who directs the railway and coal-mine song-and-dance troupes: they may go under the Ministry of Culture, but with a fixed establishment, a system of tours, of life and labor among the workers, of study and training, strict time allotment, no reliance on bursts that hinder steady growth.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 635 (Apr. 15, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-18.china-leadership
        when: 'Apr. 18'
        date: '1964-04-18'
        thread: china-leadership
        c: 'Zhou attends the Beijing rally of all circles marking the ninth anniversary of the Bandung Conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 635 (Apr. 18, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-04-18.china-leadership-2
        when: 'Apr. 18'
        date: '1964-04-18'
        thread: china-leadership
        c: 'Zhou, receiving a Korean cultural delegation, on the lessons of rubber planting in south China: a new thing grows by groping, many trials; both large errors came of good intent, the first when Stalin lived and hoped China would grow its own rubber, the second by the Ministry of State Farms, subjectivism and commandism. Lesson: welcome the new, do not fear mistakes; two wrong attitudes, losing heart at the first difficulty (right error) and pressing on without admitting error (left error).'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 635–36 (Apr. 18, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:dprk]
  - add:
      entry:
        id: cal.1964-04-18.china-leadership-3
        when: 'Apr. 18'
        date: '1964-04-18'
        thread: china-leadership
        also: [japan]
        c: 'Zhou receives Matsumura Kenzō and other Japanese guests. Independence without alliance with the bloc makes a satellite; independence does not shut out cooperation with truly friendly states; China treats friends more warmly and an enemy in kind, but never hostile first. Matsumura need not fear China''s spirit of independence will start a world war with the U.S. Complains Ikeda''s government has said Taiwan''s status is undetermined; told this is not its meaning and a remedy is coming: "we shall see". China favors improving relations by accumulation, working toward diplomatic ties.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 636 (Apr. 18, 1964). Names: Zhou Enlai, Matsumura Kenzō.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-04-20.china-leadership
        when: 'Apr. 20'
        date: '1964-04-20'
        thread: china-leadership
        c: 'Zhou, in Shanghai, speaks to the meeting of "five-good" collectives and workers of the industrial and transport departments for 1963: study Mao''s works in a living way; study the army, and Daqing, in a living way, joining revolutionary drive to scientific experiment; every city, county and plant should raise its own "Daqing"; study of the advanced must last; the drive for emulation among groups around "five goods" is communist style.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 636–37 (Apr. 20, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-04-21.china-leadership
        when: 'Apr. 21'
        date: '1964-04-21'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou, back in Beijing, calls the responsible officials to discuss trade with the Soviet Union.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 637 (Apr. 21, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-22.china-leadership-3
        when: 'Apr. 22'
        date: '1964-04-22'
        thread: china-leadership
        also: [trade]
        c: 'Zhou again calls people on foreign trade.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 637 (Apr. 22, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-22.china-leadership
        when: 'Apr. 22'
        date: '1964-04-22'
        thread: china-leadership
        c: 'Zhou, with Liu Shaoqi, Zhu De and others, goes to the Bulgarian embassy to condole the death of Ganev, Politburo member of the Bulgarian Communist Party and chairman of the National Assembly''s presidium; sends a wreath.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 637 (Apr. 22, 1964). Names: Zhou Enlai, Liu Shaoqi, Zhu De.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:zhu-de, polity:prc, polity:bulgaria]
  - add:
      entry:
        id: cal.1964-04-22.china-leadership-2
        when: 'Apr. 22 and 24'
        date: '1964-04-22'
        thread: china-leadership
        c: 'Zhou calls the officials concerned to discuss finance on Apr. 22 and 24.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 637 (Apr. 22 and 24, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-23.china-leadership
        when: 'Apr. 23'
        date: '1964-04-23'
        thread: china-leadership
        also: [japan]
        c: 'Zhou receives the Kansai economic friendship delegation under Sugano Watarō, Diet member and adviser to the Kansai office of the Japan Association for the Promotion of International Trade. Japan''s growth rests on the world market as well as home; China''s on self-reliance, but to modernize it needs international cooperation. Four principles: equality and mutual benefit; Sino-Japanese peaceful coexistence has an unlimited future; economic relations can be made sure and reliable; China''s ability to pay is strong. "We should look further."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 637 (Apr. 23, 1964). Names: Zhou Enlai, Sugano Watarō.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-04-25.china-leadership-2
        when: 'Apr. 25'
        date: '1964-04-25'
        thread: china-leadership
        also: [soviet-union, china]
        c: 'Zhou, at the joint session of the 117th meeting of the NPC Standing Committee and the 144th plenary meeting of the State Council, adds to his report on the fourteen-country trip, answering questions from the earlier discussion, and speaks on events of the past month. On the Sino-Soviet border: China''s principles in the talks are that the treaties after the Opium War are unequal, imposed by tsarist Russia; that China still accepts them as the base for talks with needed adjustments; that a new boundary treaty replace the old. The Soviet side does not agree; little progress.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 637–38 (Apr. 25, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-26.china-leadership
        when: 'Apr. 26'
        date: '1964-04-26'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou goes to Liu Shaoqi''s to settle the *People''s Daily* editor''s note to Suslov''s Feb. 14 report, printed Apr. 27: it counts 140 or 150 places of distortion, calls the report false; all anti-China Soviet documents, past and later, to be answered in turn once the reply to the Soviet Central Committee''s open letter is done.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 638 (Apr. 26, 1964). Made public: 1997. Check: the chronology gives the visit to Liu Apr. 26 and the editor''s note, a footnote to Apr. 27. Names: Zhou Enlai, Liu Shaoqi, Suslov.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:suslov-mikhail-a, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-27.china-leadership
        when: 'Apr. 27'
        date: '1964-04-27'
        thread: china-leadership
        c: 'Zhou writes Prince Sihanouk thanking Cambodia for its support against the Brazilian coup regime''s illegal arrest and persecution of nine Chinese; admires Cambodia''s justice and friendly concern. (The chronology''s note: nine Chinese trade staff and correspondents arrested Apr. 3, tortured and sentenced to ten years; home Apr. 21, 1965, and received by Liu Shaoqi and Zhou.)'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 638 (Apr. 27, 1964). Names: Zhou Enlai, Sihanouk.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1964-04-27.china-leadership-2
        when: 'Apr. 27'
        date: '1964-04-27'
        thread: china-leadership
        c: 'Zhou revises the Central Committee and State Council''s note forwarding Yang Chengwu''s Apr. 10 report on protecting the fisheries. After "a long, hard, complex task" adds: this struggle gives the navy the best chance of real combat training; the navy must show marked results.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 638–39 (Apr. 27, 1964). Made public: 1997. Names: Zhou Enlai, Yang Chengwu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-28.china-leadership
        when: 'Apr. 28'
        date: '1964-04-28'
        thread: china-leadership
        c: 'Zhou calls Fang Yi and others on aid to Albania''s building of textile mills and other plants.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 639 (Apr. 28, 1964). Made public: 1997. Names: Zhou Enlai, Fang Yi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-28.china-leadership-2
        when: 'Apr. 28'
        date: '1964-04-28'
        thread: china-leadership
        c: 'Zhou receives Albania''s plenipotentiary design-approval experts: wanting industry quickly is well meant but too hasty; Albania has 1.7 million people and that must count; population is the start of every task. A small country should concentrate on the necessary and the most needed: its own raw materials processed, for use and export; the most advanced technique first. Tie industry to farming, herding, forestry and fishing, to sidelines in the villages; use oil and gas fully.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 639 (Apr. 28, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1964-04-28.china-leadership-3
        when: 'Apr. 28'
        date: '1964-04-28'
        thread: china-leadership
        also: [korea]
        c: 'Zhou receives the new North Korean ambassador, Pak Se-chang, and Chon Du-hwan, who heads the Academy of Sciences delegation: on a Sino-Korean scientific agreement and preparations for the second Asian-African conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 639 (Apr. 28, 1964). Made public: 1997. Names: Zhou Enlai, Pak Se-chang, Chon Du-hwan.'
        tags: [name:zhou-enlai, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-04-29.china-leadership
        when: 'Apr. 29'
        date: '1964-04-29'
        thread: china-leadership
        c: 'Zhou attends the Secretariat meeting. Hears Li Fuchun, Tan Zhenlin and others on preliminary ideas for the Third Five-Year Plan and the Third Plan''s agricultural development.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 639 (Apr. 29, 1964). Made public: 1997. Names: Zhou Enlai, Li Fuchun, Tan Zhenlin.'
        tags: [name:zhou-enlai, name:li-fuchun, name:tan-zhenlin, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-30.china-leadership-3
        when: 'Apr. 30'
        date: '1964-04-30'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou receives the new ambassadors of the German Democratic Republic, Kolt, and Czechoslovakia, Krzystek. Despite grave disputes among the fraternal parties on principles of Marxism-Leninism, the camp and the movement should support one another; unite as against the enemy; state relations should be friendly.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 639–40 (Apr. 30, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:gdr, polity:czechoslovakia, vis:only:prc+gdr+czechoslovakia]
  - add:
      entry:
        id: cal.1964-04.china-leadership
        when: 'Apr.–May'
        date: '1964-04'
        thread: china-leadership
        c: 'In April and May Liao Luyan, on Zhou''s instruction, takes three aides to Dazhai brigade, Xiyang county, Shanxi, to live, eat and work with the villagers, investigating the means, measures and material and technical conditions of its self-reliant stable-yield fields. May 25: Liao sends the Central Committee his report on Dazhai: a model of drought- and flood-proof high-yield farmland by self-reliance, a banner on the nation''s agricultural front.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 640 (Apr.–May 1964). Made public: 1997. Check: days. Names: Zhou Enlai, Liao Luyan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-02.china-leadership
        when: 'May 2'
        date: '1964-05-02'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou and Chen Yi receive Air Commodore Nur Khan, managing director of Pakistan International Airlines, and party. Praises Ayub Khan and Pakistan''s government for the Sino-Pakistani air link. Peking airport must be enlarged; without the air link the Shanghai and Canton airports would not have been enlarged within five years; he took the air force commander and deputy to Shanghai to see; two divisions worked. On Ambassador Raza''s proposal that Zhou name the first plane: let Ayub do it. Proposes with Chen Yi''s idea renaming the border''s highest peak K2 "Friendship Peak" and calling the plane "Friendship".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 640 (May 2, 1964). Names: Zhou Enlai, Chen Yi, Nur Khan, Ayub Khan, Raza.'
        tags: [name:zhou-enlai, name:chen-yi, name:ayub-khan-mohammad, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1964-05-03.china-leadership
        when: 'May 3'
        date: '1964-05-03'
        thread: china-leadership
        c: 'Zhou calls Qian Zhengying on silting at the Sanmenxia dam on the Yellow River. She is to go down, investigate, hear all sides, and call a conference on the Yellow River''s control.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 640 (May 3, 1964). Made public: 1997. Names: Zhou Enlai, Qian Zhengying.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-05.china-leadership
        when: 'May 5'
        date: '1964-05-05'
        thread: china-leadership
        also: [africa]
        c: 'Zhou and Chen Yi receive the Kenyan government delegation, Beijing; talks, May 3–11. On May 5: when in Africa he spoke of a fine revolutionary situation, the British Prime Minister attacked it as immoral; the situation meant is anti-imperialist, and any state independent or not that advances national independence is in revolution; it shakes British colonialism, hence the annoyance. Deal with the old colonialists with a complex mind and tactics. East Africa''s first task is to clear colonial power entirely, the goal of the Organization of African Unity charter.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 640–41 (May 5, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-10.china-leadership-2
        when: 'May 10'
        date: '1964-05-10'
        thread: china-leadership
        also: [africa]
        c: 'Zhou attends the signing of the China–Kenya economic and technical cooperation agreement.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 641 (May 10, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-05-04.china-leadership
        when: 'May 4'
        date: '1964-05-04'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives Ghana''s government economic delegation. Light industry builds quickly, needs little capital, pays back fast and funds further industry, and bears on farming. Sugar mills should be small, for transport and cane-cutting; small ones can be more mechanized and automated. Let the delegation look around, study in Beijing what projects suit, then China sends men to Ghana. China has faults; friends should say so.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 641 (May 4, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-05-05.china-leadership-2
        when: 'May 5–9'
        date: '1964-05-05'
        thread: china-leadership
        c: 'Zhou calls people each day on agricultural planning, May 5 to 9.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 641 (May 5–9, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-07.china-leadership
        when: 'May 7'
        date: '1964-05-07'
        thread: china-leadership
        c: 'Zhou hears Vice Minister of Forestry Hui Zhongquan on afforestation: chart and tabulate the distribution of the 120 million mu to plant and the treeless land; restore forest stations in the Northeast and Inner Mongolia and guidance stations elsewhere; settle labor by drafting recruits to plant and cut trees; every leader from the Center down, save the old and sick, to plant trees each year, make it a custom and fix rules.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 641 (May 7, 1964). Made public: 1997. Names: Zhou Enlai, Hui Zhongquan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-10.china-leadership-3
        when: 'May 10'
        date: '1964-05-10'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives and dines the Burundi National Assembly delegation under its president.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 641 (May 10, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-05-12.china-leadership
        when: 'May 12'
        date: '1964-05-12'
        thread: china-leadership
        also: [africa]
        c: 'Zhou calls the responsible officials on aid to Zanzibar.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 642 (May 12, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-13.china-leadership
        when: 'May 13'
        date: '1964-05-13'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou, after the Soviet government''s statement of Apr. 25 that the Soviet Union, "a great Asian power", should be invited to the Afro-Asian conference, calls those concerned on Soviet participation in the second Asian-African conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 642 (May 13, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-14.china-leadership
        when: 'May 14'
        date: '1964-05-14'
        thread: china-leadership
        c: 'Zhou attends the Secretariat meeting, which discusses the main subjects of the Central Work Conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 642 (May 14, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-14.china-leadership-2
        when: 'May 14'
        date: '1964-05-14'
        thread: china-leadership
        also: [japan, china]
        c: 'Zhou receives the Liberal Democratic Party members Kitamura Tokutarō, Kawasaki Hideji, Matsumoto Shun''ichi and Tokuda Yokichirō. First: bring far-sighted, strong entrepreneurs to China to talk apart from trade, about Japanese enterprise''s future, through them and Matsumura and Okazaki. Second: agreement is reached on trading Liao Chengzhi and Takasaki offices, to be done soon; the Japanese government should act, not be passive. Third: contact between the two governments'' diplomats, from unofficial to official, from private to open, is agreeable. On American policy in three stages since 1949: now ready to accept Peking''s representation but keeping Taiwan out, "two Chinas", which Chiang opposes too; Britain''s Butler in Tokyo said Taiwan''s status undetermined, an international question, and Britain would join a conference on it; the *People''s Daily* answered in an editorial.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 642–43 (May 14, 1964). Names: Zhou Enlai, Liao Chengzhi, Okazaki, Matsumura Kenzō, Butler.'
        tags: [name:zhou-enlai, name:butler-richard-a, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-05-16.china-leadership
        when: 'May 16–20'
        date: '1964-05-16'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives Gen. Abboud, president of Sudan''s Supreme Council of the Armed Forces and prime minister, on his visit and talks, May 16–20. May 18, with Mao receiving Abboud, on aid: experts first to look, then talk aid; Mao: realistic. May 19 with Chen Yi goes with Abboud to Shanghai; sees him off at Shanghai airport May 20.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 643 (May 16–20, 1964). Names: Zhou Enlai, Chen Yi, Abboud, Mao Zedong.'
        tags: [name:zhou-enlai, name:chen-yi, name:abboud-ibrahim, name:mao-zedong, polity:prc, polity:sudan]
  - add:
      entry:
        id: cal.1964-05-20.china-leadership
        when: 'May 20'
        date: '1964-05-20'
        thread: china-leadership
        c: 'Zhou flies from Shanghai to Tianjin. With Chen Yi, He Long and Peng Zhen visits a garrison unit at Yangcun and watches a military exercise. On the drill ground raises a fist with the soldiers: heighten vigilance, defend the fatherland. Praises the traditional method of officers and men teaching each other; checks each soldier''s explosive charges against combat standard. Evening, in the rain, watches the "Night Tiger Company" report. Tells the troops to master Mao''s military thought, train in close and night fighting, prepare fully for a war of resistance; in three to five years all troops so trained and the militia too, and none could beat China. Back in Beijing at midnight.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 643–44 (May 20, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, He Long, Peng Zhen.'
        tags: [name:zhou-enlai, name:chen-yi, name:he-long, name:peng-zhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-23.china-leadership
        when: 'May 23'
        date: '1964-05-23'
        thread: china-leadership
        c: 'Zhou receives Prince Sisowath Pola and the Cambodian National Assembly members at the opening of the China–Cambodia air service. U.S. meddling in Asia: Prince Sihanouk came forward bravely, criticized it and refused American aid, to the admiration of the Chinese and of all. Air links open; sea links should follow.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 644 (May 23, 1964). Names: Zhou Enlai, Sihanouk, Sisowath Pola.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1964-05-24.china-leadership
        when: 'May 24'
        date: '1964-05-24'
        thread: china-leadership
        c: 'Zhou, on the request of Liao Chengzhi, Li Yimeng and Zhang Yan to strengthen work on photographs for foreign exhibitions and gifts: by the home and foreign picture, photo and newsreel showings, gifts and filming, there is too much and too heavy, poor quality, duplicated staff, not too little. Zhang Yan of the Foreign Affairs Office to call a meeting with the working photographers, film makers and editors: one division of work, shared labor, no duplication, saving materials, better quality; a plan to buy equipment, assign cadres, train technicians; the Ministry of Culture to give a plan for domestic equipment in the five-year plan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 644 (May 24, 1964). Made public: 1997. Names: Zhou Enlai, Liao Chengzhi, Li Yimeng, Zhang Yan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-27.china-leadership-2
        when: 'May 27'
        date: '1964-05-27'
        thread: china-leadership
        c: 'Zhou tours the industrial exhibition at the Beijing Exhibition Hall. Told that four heavy-machinery plants fought together and made a difficult cold-rolling roll, breaking the Soviet technical blockade: praises the workers for raising the Chinese people''s spirit and serving socialism.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 644 (May 27, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-05-27.china-leadership-3
        when: 'May 27'
        date: '1964-05-27'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou wires President Radhakrishnan of India condoling the death of Prime Minister Nehru that day. Despite present differences the unfortunate state is temporary; he is sure Sino-Indian friendship will be restored and grow on the five principles. Same day wires Indira Gandhi in mourning.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 644–45 (May 27, 1964). Names: Zhou Enlai, Radhakrishnan, Nehru, Indira Gandhi.'
        tags: [name:zhou-enlai, name:radhakrishnan-sarvepalli, name:nehru-jawaharlal, name:gandhi-indira, polity:prc, polity:india]
  - add:
      entry:
        id: cal.1964-05-28.china-leadership
        when: 'May 28'
        date: '1964-05-28'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou and Chen Yi go to the Indian embassy to condole Nehru''s death and lay a wreath before his portrait.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 645 (May 28, 1964). Names: Zhou Enlai, Chen Yi, Nehru.'
        tags: [name:zhou-enlai, name:chen-yi, name:nehru-jawaharlal, polity:prc, polity:india]
  - add:
      entry:
        id: cal.1964-05-28.china-leadership-2
        when: 'May 28'
        date: '1964-05-28'
        thread: china-leadership
        c: 'Zhou attends the Secretariat meeting, which further discusses the guiding principle of the Third Five-Year Plan. Speaks: China''s economic growth is uneven and will grow more so without attention to location; this year''s capital construction is to be re-ranked; plan methods should draw on experience, not the Soviet way.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 645 (May 28, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-28.china-leadership-3
        when: 'May 28'
        date: '1964-05-28'
        thread: china-leadership
        c: 'Zhou, on an item in the *People''s Daily*: is there a sense of rank? are feelings put in place of policy? While he lives he will speak on rank, that the next generation may have no sense of rank.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 645 (May 28, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-29.china-leadership
        when: 'May 29 and 30'
        date: '1964-05-29'
        thread: china-leadership
        also: [laos, soviet-union]
        c: 'Zhou calls the responsible officials on Laos (May 29) and on the Sino-Soviet border (May 30).'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 645 (May 29 and 30, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-30.china-leadership
        when: 'May 30'
        date: '1964-05-30'
        thread: china-leadership
        also: [soviet-union]
        c: 'The Chinese government issues its statement on Soviet participation in the Asian-African conference: the conference is a summit of Asian and African states, and the Soviet Union, a European state, should not attend. Zhou had called those concerned on the question May 13, after the Soviet government''s statement of Apr. 25.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 642 (May 30, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-05-30.china-leadership-2
        when: 'May 30–31'
        date: '1964-05-30'
        thread: china-leadership
        also: [africa]
        c: 'Zhou calls people on grain, Li Xiannian''s speech draft for the Central Work Conference, and the Afro-Asian economic conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 645 (May 30–31, 1964). Made public: 1997. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-01.china-leadership
        when: 'June 1'
        date: '1964-06-01'
        thread: china-leadership
        c: 'Zhou instructs the State Planning Commission that the projects in the war-preparation plans must be entered by stages in the ministries'' annual plans, not left empty.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 645 (June 1, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-01.china-leadership-2
        when: 'June 1'
        date: '1964-06-01'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, on the Foreign Economic Liaison Bureau and Light Industry Ministry''s request on trial production at the aid cigarette and match factories in Guinea: agrees with Li Fuchun that China first trial-produces for six months to a year; when Guinea has gained confidence in running, supply, sale and management, hand over to Guinea even before a year.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 645 (June 1, 1964). Made public: 1997. Names: Zhou Enlai, Li Fuchun.'
        tags: [name:zhou-enlai, name:li-fuchun, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-02.china-leadership-2
        when: 'June 2'
        date: '1964-06-02'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou, on Fang Yi and Chai Shufan''s request, sent on by Li Fuchun, on supplying the main vinylon plant to Vietnam: stress domestic trial manufacture; import talks with Japan will not be easy or on time.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 646 (June 2, 1964). Made public: 1997. Names: Zhou Enlai, Li Fuchun, Fang Yi, Chai Shufan.'
        tags: [name:zhou-enlai, name:li-fuchun, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-05.china-leadership
        when: 'June 5'
        date: '1964-06-05'
        thread: china-leadership
        also: [africa]
        c: 'Zhou sends Mao, Liu, Deng and Peng to read the Chinese chargé in Britain''s report to the Foreign Ministry that Sudan''s Abboud was deeply impressed by his China visit. Says he will go with Chen Yi and the Yemeni president to Hangzhou; Chen Yi to go on with him to Shanghai, he to stay in Shanghai to treat a foot ailment.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 646 (June 5, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Chen Yi.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-06.china-leadership
        when: 'June 6–7'
        date: '1964-06-06'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou and Chen Yi fly with Sallal to Hangzhou. June 7 Zhou talks with the Zhejiang provincial Party committee''s leaders and reaches Shanghai.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 645–46 (June 6–7, 1964). Names: Zhou Enlai, Chen Yi, Sallal.'
        tags: [name:zhou-enlai, name:chen-yi, name:sallal-abdullah-al, polity:prc, polity:yemen]
  - add:
      entry:
        id: cal.1964-06-01.china-leadership-3
        when: 'June 1'
        date: '1964-06-01'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou and Liu Shaoqi receive Sallal, President of the Yemen Arab Republic, on a visit to June 11, and hold talks with him.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 645–46 (June 1, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Sallal.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:sallal-abdullah-al, polity:prc, polity:yemen, vis:only:prc+yemen]
  - add:
      entry:
        id: cal.1964-06-09.china-leadership-2
        when: 'June 9'
        date: '1964-06-09'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou attends the signing of the Sino-Yemeni treaty of friendship and the cultural and economic and technical cooperation agreements. That evening at Sallal''s farewell banquet: the one effective way to solve the Laotian question is an international conference of the Geneva states; any attempt to exclude some of them or any of the three Lao parties runs against Geneva and settles nothing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 646 (June 9, 1964). Names: Zhou Enlai, Sallal.'
        tags: [name:zhou-enlai, name:sallal-abdullah-al, polity:prc, polity:yemen]
  - add:
      entry:
        id: cal.1964-06-08.china-leadership-2
        when: 'June 8'
        date: '1964-06-08'
        thread: china-leadership
        c: 'Zhou returns to Beijing. Evening calls the heads of the Zhejiang Kunqu troupe, in Beijing for the national modern Peking-opera festival, on reform of Kunqu.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 646 (June 8, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-06-09.china-leadership-3
        when: 'June 9'
        date: '1964-06-09'
        thread: china-leadership
        also: [europe-and-the-alliance-france, china]
        c: 'Zhou receives Lucien Paye, French ambassador. Explains the history of the Taiwan question and that Taiwan''s status was long settled; rebuts point by point the three American fallacies: "two Chinas", "one China, one Taiwan", "status undetermined". One day the U.S. will have to leave the Taiwan Strait; China can wait.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 646 (June 9, 1964). Names: Zhou Enlai, Paye.'
        tags: [name:zhou-enlai, polity:prc, polity:fr]
  - add:
      entry:
        id: cal.1964-06-10.china-leadership
        when: 'June 10'
        date: '1964-06-10'
        thread: china-leadership
        c: 'Zhou attends the forum on foreign trade work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 646 (June 10, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-10.china-leadership-2
        when: 'June 10'
        date: '1964-06-10'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou wires India''s new Prime Minister Shastri, hoping Sino-Indian friendship will be restored and grow on the five principles.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 646 (June 10, 1964). Names: Zhou Enlai, Shastri.'
        tags: [name:zhou-enlai, name:shastri-lal-bahadur, polity:prc, polity:india]
  - add:
      entry:
        id: cal.1964-06-10.china-leadership-3
        when: 'June 10'
        date: '1964-06-10'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou receives the Vietnamese water-conservancy delegation under Hà Kế Tấn, minister of irrigation, and tells four lessons from China: Dujiangyan, a historic success, not well studied since; Sanmenxia launched in haste, revolutionary spirit but not scientific rigor, and history''s lessons on the Yellow River not yet summed up; localism and dispersion in the Huai works, water control needs the whole river and a communist spirit; the Miyun reservoir built too fast, three years too short. New contradictions keep coming; solve and unify them.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 646–47 (June 10, 1964). Names: Zhou Enlai, Hà Kế Tấn.'
        tags: [name:zhou-enlai, polity:prc, polity:drv]
  - add:
      entry:
        id: cal.1964-06-11.china-leadership-2
        when: 'June 11'
        date: '1964-06-11'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, at the first talk with Rashidi Kawawa, second vice-president of Tanganyika and Zanzibar, who leads a friendship and economic delegation (June 10–19; talks June 11–17): China, once ravaged by every imperialism, is Africa in miniature; the same past makes understanding and support easy. That evening at the banquet for Kawawa: condemns the U.S. attempt to make Indochina a second Congo; the conference of the Geneva states cannot wait.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 647 (June 11, 1964). Made public: 1997. Names: Zhou Enlai, Kawawa.'
        tags: [name:zhou-enlai, polity:prc, polity:tanzania, vis:only:prc+tanzania]
  - add:
      entry:
        id: cal.1964-06-11.china-leadership-3
        when: 'June 11'
        date: '1964-06-11'
        thread: china-leadership
        c: 'Zhou, with Mao, Liu Shaoqi, Zhu De and others, attends the opening of the Communist Youth League''s ninth national congress.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 648 (June 11, 1964). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:zhu-de, polity:prc]
  - add:
      entry:
        id: cal.1964-06-12.china-leadership
        when: 'June 12'
        date: '1964-06-12'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou calls the responsible officials to a forum on Asian economic questions.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 648 (June 12, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-14.china-leadership-2
        when: 'June 14'
        date: '1964-06-14'
        thread: china-leadership
        c: 'Zhou wires greetings to the opening of the Asian economic seminar.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 648 (June 14, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-06-13.china-leadership
        when: 'June 13 and 16'
        date: '1964-06-13'
        thread: china-leadership
        also: [africa]
        c: 'Zhou calls people on aid to Tanganyika and Zanzibar and on finance and trade, June 13 and 16.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 648 (June 13 and 16, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-14.china-leadership
        when: 'June 14'
        date: '1964-06-14'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, in talks with Kawawa: an army needs material and moral strength, but the political is most important. That afternoon agrees with Peng Zhen that Peng''s talks with Kawawa should take first five topics: Party, state power, army, united front, mass work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 647 (June 14, 1964). Made public: 1997. Names: Zhou Enlai, Kawawa, Peng Zhen.'
        tags: [name:zhou-enlai, name:peng-zhen, polity:prc, polity:tanzania, vis:only:prc+tanzania]
  - add:
      entry:
        id: cal.1964-06-16.china-leadership-2
        when: 'June 16'
        date: '1964-06-16'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, talks with Kawawa on building experience: more than ten years'' two kinds of experience, mainly good; for a time more bad than good, since corrected; a large country draws plans too big, from backwardness wanting more, bigger, faster. Same day signs the China–Tanzania economic and technical cooperation agreement. At Kawawa''s farewell banquet: the situation in Laos and all Indochina is worsening; American planes bomb the Lao liberated area and the Chinese mission at Khang Khay, a grave provocation; delay in calling the fourteen-nation conference can only help U.S. aggression and widen the war.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 647–48 (June 16, 1964). Made public: 1997. Names: Zhou Enlai, Kawawa.'
        tags: [name:zhou-enlai, polity:prc, polity:tanzania, vis:only:prc+tanzania]
  - add:
      entry:
        id: cal.1964-06-16.china-leadership-3
        when: 'June 16'
        date: '1964-06-16'
        thread: china-leadership
        c: 'Zhou, with Nie Rongzhen and Luo Ruiqing, receives the naval air force men who shot down a U.S.-made Nationalist pilotless U-2 type aircraft.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 648 (June 16, 1964). Names: Zhou Enlai, Nie Rongzhen, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:nie-rongzhen, name:luo-ruiqing, polity:prc]
  - add:
      entry:
        id: cal.1964-06-17.china-leadership
        when: 'June 17'
        date: '1964-06-17'
        thread: china-leadership
        c: 'Zhou attends the Secretariat meeting, chaired by Deng Xiaoping, on the main matters settled by the Central Work Conference. Speaks on grain and agricultural tax and on procurement: this year''s crop likely better than last, so all agree on 72 billion jin purchases and 9 billion shipped up; actual execution not clear till autumn, so no big change these two years; the paper should not say again "unchanged for three years", which only breaks faith with the people. The agricultural tax unchanged for two years, though the Third Plan may adjust it, with a reasonable increase.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 648–49 (June 17, 1964). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-18.china-leadership
        when: 'June 18'
        date: '1964-06-18'
        thread: china-leadership
        c: 'Zhou calls his personal staff to arrange work. Urges them to join the socialist education movement: go down to the base, labor, visit the poor, learn conditions, hold principle, temper Party spirit, build strength, not hasty or slack, to the end.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 649 (June 18, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-18.china-leadership-2
        when: 'June 18'
        date: '1964-06-18'
        thread: china-leadership
        also: [laos]
        c: 'Zhou receives Cambodia''s ambassador, Zhang Gang in the Chinese. China goes on supporting Prince Sihanouk''s call for a fourteen-nation conference on Laos; favors efforts at talks among the three Lao sides, to agree on a joint delegation to it.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 649 (June 18, 1964). Made public: 1997. Names: Zhou Enlai, Sihanouk.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1964-06-19.china-leadership-2
        when: 'June 19, 20 and 25'
        date: '1964-06-19'
        thread: china-leadership
        also: [vietnam-hanoi, laos]
        c: 'Zhou calls responsible officials on the Southeast Asian situation, June 19, 20 and 25.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 649 (June 19, 20 and 25, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-21.china-leadership
        when: 'June 21'
        date: '1964-06-21'
        thread: china-leadership
        also: [soviet-union, africa]
        c: 'Zhou, with Deng Yingchao, receives Hewlett Johnson, former Dean of Canterbury, and Mrs. Johnson. Africa is waking; Asians and Africans share fate and tasks; China is Africa in miniature. China''s scarcest resource is forest; old cultures use much, plant little. On Johnson''s "money corrupts the church": money is dead; the system corrupts; under capitalism money is a few men''s; under socialism people own it and are secure, equal and free. On Sino-Soviet relations: a sore on a body is no cause for gloom, remove it and be healthier; the Soviet Union is forty-odd years old and has a passing illness; China does not oppose the Soviet Union, only the sickness of the Soviet Party''s leaders.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 649–50 (June 21, 1964). Names: Zhou Enlai, Deng Yingchao, Hewlett Johnson.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-06-21.china-leadership-2
        when: 'June 21'
        date: '1964-06-21'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives the Mali government delegation; hopes Mali will attend the second Asian-African conference and that it advance economic cooperation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 650 (June 21, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:mali]
  - add:
      entry:
        id: cal.1964-06-21.china-leadership-3
        when: 'June 21–22'
        date: '1964-06-21'
        thread: china-leadership
        also: [vietnam-hanoi, laos]
        c: 'Zhou: three talks with Văn Tiến Dũng, Workers'' Party Politburo member, on military aid and related matters.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 650 (June 21–22, 1964). Made public: 1997. Names: Zhou Enlai, Văn Tiến Dũng.'
        tags: [name:zhou-enlai, name:van-tien-dung, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1964-06-23.china-leadership
        when: 'June 23'
        date: '1964-06-23'
        thread: china-leadership
        c: 'Zhou receives the heads, leading performers and creators of the troupes at the 1964 festival of modern Peking opera. On the revolution in theater, unity of opposites, the revolution in people, strengthening Party leadership: start with work on people; popularize first and raise standards through it; stress ideas, then art; live among workers, peasants and soldiers; remaking people is the key, and the "five passes". Remaking does not exclude Communists, he puts himself in; every person is to be remade to old age and death.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 650 (June 23, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-06-25.china-leadership
        when: 'June 25'
        date: '1964-06-25'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou calls responsible officials on the Sino-Soviet border.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 650 (June 25, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-25.china-leadership-2
        when: 'June 25'
        date: '1964-06-25'
        thread: china-leadership
        c: 'Zhou, on problems with some foreign experts in China (pay, work for experts'' wives, ignorance of China), instructs Zhang Yan of the Foreign Affairs Office: first send people to learn the experts'' political and living conditions, then agree measures among the offices and report to the Center.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 650 (June 25, 1964). Made public: 1997. Names: Zhou Enlai, Zhang Yan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-26.china-leadership
        when: 'June 26'
        date: '1964-06-26'
        thread: china-leadership
        c: 'Zhou, with Mao, Liu, Zhu De and Dong Biwu, receives delegates to the meeting of "four-good" companies and "five-good" soldiers of the public security forces and students of the PLA Political Institute and the Central Political Cadre School.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 650 (June 26, 1964). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Dong Biwu.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:dong-biwu, polity:prc]
  - add:
      entry:
        id: cal.1964-06-26.china-leadership-2
        when: 'June 26'
        date: '1964-06-26'
        thread: china-leadership
        c: 'Zhou reads the leading group''s request on several matters of the August Beijing Science Symposium. On quickly forming the team of Chinese scientists: not too many, high quality; on a secretariat: small, lean. (The symposium: some three hundred foreign scientists from some forty Asian, African, Latin American and Australasian states, and a hundred Chinese.)'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 651 (June 26, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-26.china-leadership-3
        when: 'June 26'
        date: '1964-06-26'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives Mali''s minister of development, Kouyaté. If every independent nation relies on its own hands, imperialist economic blackmail and dumping fail. Meet home needs first, import little, as precision equipment; food, clothing and goods first, with water and thermal power; then heavy industry. Old habits survive a new system; building a new society takes decades; each solved contradiction brings another.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 651 (June 26, 1964). Names: Zhou Enlai, Kouyaté.'
        tags: [name:zhou-enlai, polity:prc, polity:mali]
  - add:
      entry:
        id: cal.1964-06-27.china-leadership
        when: 'June 27'
        date: '1964-06-27'
        thread: china-leadership
        c: 'Zhou, with Mao, Liu, Zhu De, Dong Biwu, Peng Zhen and others, receives the whole staff and students of the Central Party School.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 651 (June 27, 1964). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Dong Biwu, Peng Zhen.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:dong-biwu, name:peng-zhen, polity:prc]
  - add:
      entry:
        id: cal.1964-06-27.china-leadership-2
        when: 'June 27'
        date: '1964-06-27'
        thread: china-leadership
        c: 'Zhou receives Prince Sultan Mahmud Ghazi, Afghan head of the joint boundary commission and director of civil aviation. The Silk Road must be modernized, but air conditions are poor; the air-service question is a pressure on China, a good one, forcing it to build the road.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 651–52 (June 27, 1964). Names: Zhou Enlai, Sultan Mahmud Ghazi.'
        tags: [name:zhou-enlai, polity:prc, polity:afghanistan]
  - add:
      entry:
        id: cal.1964-06-27.china-leadership-3
        when: 'June 27'
        date: '1964-06-27'
        thread: china-leadership
        c: 'Zhou calls people on farm questions.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 652 (June 27, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-29.china-leadership
        when: 'June 29'
        date: '1964-06-29'
        thread: china-leadership
        c: 'Zhou calls a forum on experimental trusts. Six points: the draft must have a paragraph on the nationwide trusts and their branches'' relations with regions and localities, which owe duties and hold rights; trusts must keep outside cooperation in materials, products and parts; the paper must say where trusts lead, as their function grows the ministry shrinks, a special ministry such as petroleum may become a great enterprise or the general trust; run trusts by economic means and law, administrative functions turning to economic; the ministries sponsoring salt, cigarette, Yangtze shipping, East China coal, aluminum and other trusts to write trial plans as annexes to the paper for the Center; the industrial resolution drafted at the Central Work Conference last September still needs trial.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 652 (June 29, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-30.china-leadership
        when: 'June 30'
        date: '1964-06-30'
        thread: china-leadership
        c: 'Zhou calls responsible officials on sending city youth to the countryside to work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 652 (June 30, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-30.china-leadership-2
        when: 'June 30'
        date: '1964-06-30'
        thread: china-leadership
        also: [latin-america, china]
        c: 'Zhou receives the Argentine parliamentary delegation under Ferreyra. On Western capital, technology and experts: China took the Soviet lesson, stresses self-reliance for an independent socialist economy; welcomes foreign experts who truly want to help, and where they are withdrawn does the work itself; industry, adjusted, has grown, many products and projects date from after 1960. On the United States: China opposes its aggression, its holding of Taiwan and the Seventh Fleet, yet negotiates; eight years of Warsaw talks without result; the U.S. wants China to legalize its seizure of Taiwan and make it a separate unit, for which it would recognize Peking and restore its U.N. seat; absolutely impossible, unjust.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 652–53 (June 30, 1964). Names: Zhou Enlai, Ferreyra.'
        tags: [name:zhou-enlai, polity:prc, polity:argentina]
  - add:
      entry:
        id: cal.1964-06.china-leadership-2
        when: 'June'
        date: '1964-06'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, in June, answers Prime Minister Jomo Kenyatta of Kenya: China and Kenya share a colonial past and the task of building against imperialism; Asian and African states need to change the poverty imperialism left; besides their peoples'' zeal and their own resources they need mutual support and economic cooperation on equal terms, a new kind of economic relation of exchange, help, learning and common prosperity.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 653 (June 1964). Names: Zhou Enlai, Kenyatta.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-06.china-leadership-3
        when: 'June'
        date: '1964-06'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, in June, writes Ayub Khan: eight or nine months remain before the second Asian-African summit and much is to be done; China will work closely with Pakistan, Indonesia and other states to ensure its success.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 653 (June 1964). Made public: 1997. Names: Zhou Enlai, Ayub Khan.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1964-06-30.china-leadership-3
        when: 'June 30–July 6'
        date: '1964-06-30'
        thread: china-leadership
        c: 'The Ministry of Higher Education, at Shenyang, June 30 to July 6, holds a forum on pilot work in labor practice for graduates of higher schools. It conveys Zhou''s instruction to establish the labor-practice system fully in three years, all graduates in 1965; discusses a draft trial regulation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 653–54 (June 30–July 6, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-01.china-leadership
        when: 'July 1'
        date: '1964-07-01'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou receives the Workers'' Party cadre delegation under Nguyễn Côn, deputy chairman of the State Planning Commission. On the siting of industry: for war, think of a first, second and third line, not only in plains but hills, mountains and the rear; concentrated industry is bad in war, dispersal better. Order: farming first, food, clothing and use; first the means of production that help farming; weigh all, an independent economy but by steps, with priorities.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 654 (July 1, 1964). Made public: 1997. Names: Zhou Enlai, Nguyễn Côn.'
        tags: [name:zhou-enlai, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1964-07-02.china-leadership-2
        when: 'July 2'
        date: '1964-07-02'
        thread: china-leadership
        c: 'Zhou, on Fang Yi''s summary of the U.N. Conference on Trade and Development (Geneva, Mar. 23–June 15; 120 states; a standing committee set up; the seventy-seven developing states'' joint declaration, whence the Group of 77): "This document is worth reading."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 654 (July 2, 1964). Made public: 1997. Names: Zhou Enlai, Fang Yi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-05.china-leadership-2
        when: 'July 5–8'
        date: '1964-07-05'
        thread: china-leadership
        also: [vietnam-hanoi, laos, soviet-union]
        c: 'Zhou attends the three-party conference of China, Vietnam and Laos at Hanoi, July 5–8, on the struggle in Laos, the struggle in South Vietnam, the Southeast Asian situation and economics.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 654 (July 5–8, 1964). Made public: 1997. To check: the conference''s records (not named by [[w.zhou-enlai-nianpu-1949]], II, 654). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:drv, polity:laos, vis:only:prc+drv+laos]
  - add:
      entry:
        id: cal.1964-07-09.china-leadership
        when: 'July 9'
        date: '1964-07-09'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou returns to Kunming. Talks with leaders of the Southwest Bureau: the weight of the Central Work Conference, in Mao''s words, is the third-front buildup, military work, holding the army, training successors, all strategic dispositions. Gives several points for the Southwest on present international tasks, and for the Central Committee assigns it the main tasks of military build-up on the Southwest third front.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 654–55 (July 9, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-10.china-leadership
        when: 'July 10'
        date: '1964-07-10'
        thread: china-leadership
        also: [vietnam-hanoi, laos]
        c: 'Zhou and Chen Yi fly to Rangoon for a visit. First talk with Ne Win on Asia, Africa and Latin America and China''s line on Indochina: as a Geneva signatory China is bound to see the agreements carried out and wants U.S. forces withdrawn; it seeks by talks to keep South Vietnam and Laos peaceful and neutral. But if the U.S. resolves to widen the war, attack the DRV or send troops to the Chinese border, China cannot stand by; if it wants a Korea-style war, China will be ready.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 655 (July 10, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, Ne Win.'
        tags: [name:zhou-enlai, name:chen-yi, name:ne-win, polity:prc, polity:burma, vis:only:prc+burma]
  - add:
      entry:
        id: cal.1964-07-11.china-leadership
        when: 'July 11'
        date: '1964-07-11'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, Rangoon: private talk, then second talk, with Ne Win. Burmese economy: clear out imperialist and feudal forces by plan and stages, not too broad a blow, or production suffers. Aims: industry, farming, trade, finance. Farming first: free the peasants, more water works, supply means of production, raise exports. Industry: light first, for food, clothing and use, and farm means and processing, for capital; heavy later. Commerce: state to control foreign trade and wholesale; keep private small business; no haste. Finance: save, a surplus yearly, and above all fight graft. At the second talk, sums up; adds that overseas Chinese must obey Burmese law, and instructs the Chinese embassy to tell the community leaders so.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 655–56 (July 11, 1964). Made public: 1997. Names: Zhou Enlai, Ne Win.'
        tags: [name:zhou-enlai, name:ne-win, polity:prc, polity:burma, vis:only:prc+burma]
  - add:
      entry:
        id: cal.1964-07-11.china-leadership-2
        when: 'July 11'
        date: '1964-07-11'
        thread: china-leadership
        c: 'Zhou signs the Chinese–Burmese joint communiqué.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 656 (July 11, 1964). Names: Zhou Enlai, Ne Win.'
        tags: [name:zhou-enlai, name:ne-win, polity:prc, polity:burma]
  - add:
      entry:
        id: cal.1964-07-12.china-leadership
        when: 'July 12'
        date: '1964-07-12'
        thread: china-leadership
        c: 'Zhou and Chen Yi end the Burma visit, leave Rangoon at dawn, reach Shanghai the same day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 656 (July 12, 1964). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:burma]
  - add:
      entry:
        id: cal.1964-07-13.china-leadership
        when: 'July 13'
        date: '1964-07-13'
        thread: china-leadership
        c: 'Zhou talks with leaders of the East China Bureau and Shanghai committee. On Nationalist raids and subversion on the coast: train coastal troops more, coastal Party committees to attend to military matters. On Southeast Asia: it is front everywhere, which tempers us, makes cadres and armies.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 656 (July 13, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-14.china-leadership
        when: 'July 14'
        date: '1964-07-14'
        thread: china-leadership
        c: 'Zhou returns to Beijing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 656 (July 14, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-07-15.china-leadership-2
        when: 'July 15'
        date: '1964-07-15'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou receives Waheeduzzaman, Pakistan''s minister of commerce. More work remains to rouse all the people to self-reliance and sacrifice; new states need that spirit and also friendly cooperation on equal benefit and Bandung''s ten principles. China will lend, on terms unlike America''s, no privilege or preference: no interest, long term, repayment may be deferred, or not repaid at all; it lends to build a national economy, not to burden.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 656 (July 15, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1964-07-15.china-leadership-3
        when: 'July 15'
        date: '1964-07-15'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, alone with Ambassador Raza: the Soviet proposal for a U.N. armed force is bad on the whole, it gives the U.S. what it wants; China opposes it. Such a force does not suit civil wars or anti-colonial wars of members, or non-members, and cannot go in if one party objects: it can go nowhere.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 657 (July 15, 1964). Made public: 1997. Names: Zhou Enlai, Raza.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1964-07-18.china-leadership
        when: 'July 18'
        date: '1964-07-18'
        thread: china-leadership
        also: [africa, soviet-union]
        c: 'Zhou chairs a meeting of the party groups of the State Council''s ministries and commissions and reports on the world situation: four basic contradictions and two intermediate zones. Africa holds most promise; aid to it to grow; staff the new Foreign Economic Liaison Commission. Seize the good moment and the central problem; domestic building also to be ranked and fought as battles of annihilation; some things may wait. In third-front building every line should have mobilization and some industry.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 657 (July 18, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-19.china-leadership
        when: 'July 19'
        date: '1964-07-19'
        thread: china-leadership
        c: 'Zhou approves Ulanhu''s letter proposing four projects for Inner Mongolia: a Mongolian and Chinese printing house, the Inner Mongolia hospital, water supply, drainage and roads for Hohhot, a constant-temperature measurement building.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 657 (July 19, 1964). Made public: 1997. Names: Zhou Enlai, Ulanhu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-19.china-leadership-2
        when: 'July 19'
        date: '1964-07-19'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'The Chinese government''s statement supporting the Vietnamese people against American aggression: China''s attitude toward American plans for new military adventures has been most restrained, but there is a limit; the Chinese people will not stand by while the U.S. widens its aggression in Vietnam and Indochina.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 657 (July 19, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:drv]
  - add:
      entry:
        id: cal.1964-07-20.china-leadership
        when: 'July 20'
        date: '1964-07-20'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou receives four Vietnamese delegations, among them the Vietnam Committee for the Defense of World Peace, the Afro-Asian People''s Solidarity Committee and the National Liberation Front; attends the Beijing rally of all circles on the tenth anniversary of the Geneva Agreements; again sets out China''s stand.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 657 (July 20, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:drv]
  - add:
      entry:
        id: cal.1964-07-20.china-leadership-2
        when: 'July 20'
        date: '1964-07-20'
        thread: china-leadership
        c: 'Zhou, on papers about the 1964 Beijing music festival and Afro-Asian cultural events, writes that they show many comrades only used to going round and round in the office, signing papers, and not liking to meet the new and go to the masses to solve problems. That afternoon calls people on the matter.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 657–58 (July 20, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-20.china-leadership-3
        when: 'July 20'
        date: '1964-07-20'
        thread: china-leadership
        also: [africa]
        c: 'Zhou wires Kenyan Prime Minister Kenyatta: sincere sympathy for the attack on him in London by thugs, great indignation at their brutality.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 658 (July 20, 1964). Names: Zhou Enlai, Kenyatta.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-07-20.china-leadership-4
        when: 'July 20'
        date: '1964-07-20'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives the delegation of South Africa''s Pan Africanist Congress under Raboroko.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 658 (July 20, 1964). Names: Zhou Enlai, Raboroko.'
        tags: [name:zhou-enlai, polity:prc, polity:south-africa]
  - add:
      entry:
        id: cal.1964-07-21.china-leadership
        when: 'July 21–22'
        date: '1964-07-21'
        thread: china-leadership
        also: [korea, soviet-union]
        c: 'Zhou leads the Chinese Communist Party delegation to Korea; three talks with the delegation of the Korean Workers'' Party headed by Kim Il Sung, July 21 and 22.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 658 (July 21–22, 1964). Made public: 1997. Names: Zhou Enlai, Kim Il Sung.'
        tags: [name:zhou-enlai, name:kim-il-sung, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-07-23.china-leadership
        when: 'July 23'
        date: '1964-07-23'
        thread: china-leadership
        c: 'Zhou returns to Beijing. That afternoon with Mao, Zhu De, Peng Zhen and others receives all officers and men of an air force unit that shot down another U.S.-made Nationalist U-2, the delegates of three conferences and trainees of the trade union federation''s school.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 658 (July 23, 1964). Names: Zhou Enlai, Mao Zedong, Zhu De, Peng Zhen.'
        tags: [name:zhou-enlai, name:mao-zedong, name:zhu-de, name:peng-zhen, polity:prc]
  - add:
      entry:
        id: cal.1964-07-24.china-leadership
        when: 'July 24'
        date: '1964-07-24'
        thread: china-leadership
        c: 'The State Council issues supplementary rules strictly forbidding construction of office buildings, halls and guesthouses: no new office buildings for Party and government organs, army and groups; non-productive building no better than local worker housing; no enlarging or raising standards under cover of repair.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 658 (July 24, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-07-25.china-leadership-2
        when: 'July 25'
        date: '1964-07-25'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou speaks at the Central Committee''s forum with democratic personages, urging all to be thorough revolutionaries: learn contradictions by practice, remake the world view, "renew daily"; against war cries, not afraid of them, with first, second and third lines in military, economic and ideological terms alike.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 658 (July 25, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-07-28.china-leadership-2
        when: 'July 28'
        date: '1964-07-28'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou receives the Indonesian archery and gymnastics teams. The aims of the Games of the New Emerging Forces: first, to unite the new forces and make friends; second, mutual aid and learning; third, to advance together and not a few. Wants some above Olympic records, but most to rise, the advanced helping the backward. Urges all young workers, peasants, students, soldiers and public servants to learn swimming.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 658–59 (July 28, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1964-07-28.china-leadership-3
        when: 'July 28'
        date: '1964-07-28'
        thread: china-leadership
        also: [japan, testing]
        c: 'Zhou wires greetings to the Tenth World Conference against Atomic and Hydrogen Bombs, Tokyo; on Aug. 2 it adopts its appeal for common action against nuclear war and for total prohibition.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 659 (July 28, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-07-29.china-leadership
        when: 'July 29'
        date: '1964-07-29'
        thread: china-leadership
        c: 'Zhou calls a meeting to discuss and revise the paper on trial trusts. Six points. At this planning meeting there must be revolutionary thinking; reject the old "big and complete" direction, Soviet help having given only that experience; poor Chinese steel owes much to neglect of quality and of new technique. The present industrial management system hinders new technique; offices grow, bureaucracy with them; trusts are to remedy that, taking capitalism''s good points but by socialist economic revolution, to raise productivity. Plan adjustment needs revolutionary measures; Mao proposed three years'' transition, "we should have made the revolution this year, we are a year late"; next year''s plan must be revolutionary. Carry out Mao''s joining of war and peace: split big and complete plants in two or more, cooperate within and outside the plant, specialize, move plants as in the Korean War. Two ways to form trusts: nationwide first with branches, central and decentralized, local bodies managing by economic means; or by region first. Ready ones first, whether easy or hard. After the meeting oversees further revision. (Footnote: the national planning conference Sept. 21–Oct. 19; Mao''s Aug. 27 note on Chen Boda''s letter: planning methods must change within two years or the State Planning Commission be abolished and another set up; the conference named dogmatism, dispersion and bureaucracy the chief faults, proposed fourteen measures, passed the 1965 draft plan outline.)'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 659–60 (July 29, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-30.china-leadership
        when: 'July 30'
        date: '1964-07-30'
        thread: china-leadership
        c: 'Zhou hears the heads of literature and art on preparations for a large song-and-dance work for the fifteenth National Day, proposed since late July. Strive to finish on schedule; if not ready by Oct. 1 no matter, it will serve as a lesson in revolutionary tradition and Party history. Dare to create. Decides on a leading group of the Propaganda Department, the PLA General Political Department, the Ministry of Culture and others as its "command post".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 660 (July 30, 1964). Made public: 1997. Names: Zhou Enlai, Zhou Yang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-31.china-leadership
        when: 'July 31'
        date: '1964-07-31'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, with Li Xiannian and others, on aid abroad: every department must change its view and give weight to aid; chief support for the Foreign Economic Liaison Commission; aid might be about three percent of state spending, its share of foreign exchange to be studied; raise technique, bring in some new equipment as models. Orders trials joining the two labor systems and the two education systems, tied to reorganizing enterprises and raising technique, so workers can find time to study; later leading cadres to be drawn from the half-work half-study workers.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 660–61 (July 31, 1964). Made public: 1997. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-31.china-leadership-2
        when: 'July 31'
        date: '1964-07-31'
        thread: china-leadership
        c: 'Zhou reports on revolution and labor to Beijing''s graduates of higher schools, with secondary, senior middle school graduates and students going abroad. Join a deeper socialist revolution; only a deep class struggle will fix class stand, a view of labor and the masses. From next year all graduates to have a year of labor and a year of practice before work, and after, some manual labor each year: that system is to stay. The Central Committee is considering half-work half-study for the working people. Praises graduates'' readiness to go anywhere.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 661 (July 31, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-08-01.china-leadership
        when: 'Aug. 1'
        date: '1964-08-01'
        thread: china-leadership
        c: 'Zhou attends the meeting of central organs and Beijing Party cadres at which Liu Shaoqi reports on socialist education and the two labor and two education systems.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 661 (Aug. 1, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-01.china-leadership-2
        when: 'Aug. 1'
        date: '1964-08-01'
        thread: china-leadership
        c: 'Zhou approves Zhou Yang''s report on a large song-and-dance work, *The East Is Red*, for National Day, and sets terms for settling it in person: full effort and to be staged Oct. 1, else postponed and modern Peking opera put in; the PLA troupes as the main body, government troupes aid, with some Shanghai writers, directors and actors; a leading group of thirteen and six organizers; run separately so as not to disturb the Culture Ministry and associations'' rectification; texts and lyrics to be settled finally by Peng Zhen, Chen Yi, Dingyi and Kang Sheng. Aug. 5 goes to the General Political Department troupe''s rehearsal hall to review the army''s items.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 661–62 (Aug. 1, 1964). Made public: 1997. Names: Zhou Enlai, Zhou Yang, Peng Zhen, Chen Yi, Kang Sheng.'
        tags: [name:zhou-enlai, name:peng-zhen, name:chen-yi, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-04.china-leadership-2
        when: 'Aug. 4–5'
        date: '1964-08-04'
        thread: china-leadership
        c: 'Zhou hears the National Defense Industry Office on the 1965 production and construction plan. Points: the lines: apart from Panzhihua, all provinces around the borders are first line; true third line is Qinghai, south Shaanxi, south Gansu, Panzhihua. Revolution in design of defense plants: from next year readjust layout and specialize; criticize "big, comprehensive"; designers to go to sites. Use depreciation to improve and raise reproduction, joined with technical reform and renewal. Different construction procedures by case; economic work cannot run by administrative order. Plants smaller, split in two or three. For fifty thousand more laborers, use more temporary and volunteer labor and raise productivity; try two labor systems on Liu Shaoqi''s order. Li Fuchun and Bo Yibo, reporting to the Center, say the points will be studied at the planning forum.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 662 (Aug. 4–5, 1964). Made public: 1997. Names: Zhou Enlai, Li Fuchun, Bo Yibo.'
        tags: [name:zhou-enlai, name:li-fuchun, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-05.china-leadership-2
        when: 'Aug. 5'
        date: '1964-08-05'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou receives Cambodia''s ambassador Zhang Gang. The U.S. Defense Department, on groundless "facts", announces reprisal bombing of targets in the DRV to widen the fire; such repeated provocation of a sovereign state cannot be allowed and must be answered. Keeping the peace in Southeast Asia and Indochina is now the most urgent task of the Geneva states and every peace-loving state.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 662–63 (Aug. 5, 1964). Made public: 1997. Names: Zhou Enlai, Zhang Gang.'
        tags: [name:zhou-enlai, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1964-08-06.china-leadership-3
        when: 'Aug. 6'
        date: '1964-08-06'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou issues the Central Committee''s instruction on demonstrations supporting the Vietnamese people against U.S. armed aggression.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 663 (Aug. 6, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08.china-leadership
        when: 'Aug., after the 6th'
        date: '1964-08'
        thread: china-leadership
        at: 'after 1964-08-06'
        also: [vietnam-hanoi]
        c: 'Zhou instructs the offices concerned: aid to Vietnam is the first task. Treat every Vietnamese request seriously, carefully, actively. Equipment for South Vietnam to be easy to use, carry, hide and ship.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 663 (Aug., after the 6th 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-07.china-leadership
        when: 'Aug. 7'
        date: '1964-08-07'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, on Fang Yi''s outline on foreign economic and technical aid, revised after discussion with the planning, economic and science commissions and others, sends it to Mao, Liu, Zhu and Deng and asks the Planning Commission to discuss it and send it to the Secretariat. Proposes aid grants of about three percent of the yearly budget, all four uses in the report included, and of foreign exchange about three percent of export earnings, "right first, left after".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 663 (Aug. 7, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Deng Xiaoping, Fang Yi.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-08.china-leadership
        when: 'Aug. 8'
        date: '1964-08-08'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou calls those concerned on the Vietnam question.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 663 (Aug. 8, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-09.china-leadership
        when: 'Aug. 9'
        date: '1964-08-09'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou attends the rally of 100,000 in the capital supporting the Vietnamese people against U.S. armed aggression.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 663 (Aug. 9, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:drv]
  - add:
      entry:
        id: cal.1964-08-09.china-leadership-2
        when: 'Aug. 9'
        date: '1964-08-09'
        thread: china-leadership
        c: 'Zhou, with Dong Biwu and Chen Yi, goes to the Polish embassy to condole the death of Zawadzki, Politburo member of the Polish United Workers'' Party and chairman of the Council of State.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 663 (Aug. 9, 1964). Names: Zhou Enlai, Dong Biwu, Chen Yi.'
        tags: [name:zhou-enlai, name:dong-biwu, name:chen-yi, polity:prc, polity:poland]
  - add:
      entry:
        id: cal.1964-08-10.china-leadership
        when: 'Aug. 10–20'
        date: '1964-08-10'
        thread: china-leadership
        c: 'Zhou is in Beijing Hospital for treatment, Aug. 10–20. Except for the first day, that of surgery, he works every day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 664 (Aug. 10–20, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-12.china-leadership
        when: 'Aug. 12'
        date: '1964-08-12'
        thread: china-leadership
        c: 'Zhou revises the Central Committee and State Council notice issuing the trial regulations on labor practice for graduates of higher schools. Those about to start work need this lesson and should keep up regular labor and thought remolding. The regulations issue Aug. 19; they cover graduate students and returned students too.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 664 (Aug. 12, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-17.china-leadership-2
        when: 'Aug. 17'
        date: '1964-08-17'
        thread: china-leadership
        c: 'The Central Committee and State Council forward the State Economic Commission party group''s report on trial industrial and transport trusts: a major reform of industrial management; the ministries and Party committees to give it full weight and make the first trials succeed with able cadres.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 664 (Aug. 17, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-19.china-leadership-2
        when: 'Aug. 19'
        date: '1964-08-19'
        thread: china-leadership
        c: 'Zhou approves the State Council''s forwarding of the report of the Ministry of Education, the Physical Culture Commission and the Ministry of Health on pupils'' health: it has not regained the level before 1959.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 664 (Aug. 19, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-28.china-leadership
        when: 'Aug. 28'
        date: '1964-08-28'
        thread: china-leadership
        c: 'Zhou, on the State Science Commission''s report on earthquake study at Xichang and its four points, writes: send a survey party at once, not one team but sub-parties by area and trade; set up seismograph stations, three or four hundred people, in one year; special groups in the Planning Commission, capital construction bureau and design offices; an expert mission to Japan this year.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 664–65 (Aug. 28, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08.china-leadership-2
        when: 'Aug.'
        date: '1964-08'
        thread: china-leadership
        c: 'Zhou, on the Culture Ministry party group''s bulletin of Aug. 15 on checking its work, orders it sent to Peng, Lu, Kang, Zhou Yang and Leng Xi to read and to Mao, Liu and Deng. Four points: once the masses are roused, bad men and acts come to light; those with grave errors must labor among workers, peasants and soldiers three or four years, or never return to cultural work; the Ministry''s leadership to be rebuilt from new fighters from Party and army, not the old upper-level cultural men; the arts troupes to go down by stages for the "four cleanups" and "five antis". Footnote: the Ministry''s check rested on Mao''s notes of Dec. 12, 1963 and June 27, 1964 on the arts.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 665–66 (Aug. 1964). Made public: 1997. Check: the day. Names: Zhou Enlai, Peng Zhen, Lu Dingyi, Kang Sheng, Zhou Yang.'
        tags: [name:zhou-enlai, name:peng-zhen, name:lu-dingyi, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-03.china-leadership
        when: 'Sept. 3'
        date: '1964-09-03'
        thread: china-leadership
        c: 'Zhou hears Xie Fuzhi, Minister of Public Security. Too many central guesthouses; the armed forces must be led by one center, only the Military Commission and public security may control arms; public security organs, large and powerful, need more supervision, above all by the masses, with watch groups in each; lower organs making special arrangements for central leaders cut off from the masses, though some were ordered; four supervisions, Party, mass, up-down, legal; in investigation, firmly oppose the "beauty trap".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 666 (Sept. 3, 1964). Made public: 1997. Names: Zhou Enlai, Xie Fuzhi.'
        tags: [name:zhou-enlai, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-04.china-leadership
        when: 'Sept. 4'
        date: '1964-09-04'
        thread: china-leadership
        c: 'Zhou, on Lü Zhengcao''s report on the first plan for railway building in the Southwest, writes: Li Fuchun, Bo Yibo and Lü to go to the Southwest with Jing Quan and the Southwest Bureau and work out whether the Sichuan–Guizhou line can open in the second quarter of 1965, Yunnan–Guizhou in 1966, the Chengdu–Kunming southern section to Panzhihua in 1968, its northern section in 1969, the Hunan–Guizhou in 1970. The command post, awkward at Xichang at first, to be settled with chief commander Jing Quan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 666 (Sept. 4, 1964). Made public: 1997. Names: Zhou Enlai, Li Fuchun, Bo Yibo, Lü Zhengcao.'
        tags: [name:zhou-enlai, name:li-fuchun, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-04.china-leadership-2
        when: 'Sept. 4'
        date: '1964-09-04'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou and Liu Shaoqi wire the second Arab summit at Alexandria: the first summit''s positive results to grow, Arab unity to strengthen, the common struggle against imperialism and for Arab interests to advance.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 666–67 (Sept. 4, 1964). Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc]
  - add:
      entry:
        id: cal.1964-09-07.china-leadership
        when: 'Sept. 7–9'
        date: '1964-09-07'
        thread: china-leadership
        c: 'Zhou calls Chen Huangmei, Zhang Ruifang and others on filming *Li Shanzi* in Korea, Sept. 7–9; Sept. 8 goes to the Beijing Film Studio to see the sample reel of *The Red Propagandist*.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 667 (Sept. 7–9, 1964). Made public: 1997. Names: Zhou Enlai, Chen Huangmei, Zhang Ruifang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-10.china-leadership
        when: 'Sept. 10'
        date: '1964-09-10'
        thread: china-leadership
        also: [vietnam, vietnam-hanoi]
        c: 'Zhou tells Han Suyin: if the U.S. invades North Vietnam China will be forced to see a threat to itself. China will supply all Vietnam needs for a just war of liberation and trusts the Vietnamese people can free their land themselves. But U.S. troops entering North Vietnam China will take as hostile to China, and is fully prepared. Washington may always lose its "clear head"; the Americans cannot win the war; logistics against them, the people against them, and the American people will soon see it.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 667 (Sept. 10, 1964). Names: Zhou Enlai, Han Suyin.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-09-11.china-leadership
        when: 'Sept. 11'
        date: '1964-09-11'
        thread: china-leadership
        c: 'Zhou meets Zhang Zhizhong.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 667 (Sept. 11, 1964). Made public: 1997. Names: Zhou Enlai, Zhang Zhizhong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-15.china-leadership-2
        when: 'Sept. 15'
        date: '1964-09-15'
        thread: china-leadership
        c: 'Zhou calls responsible officials on the Sanmenxia question.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 667 (Sept. 15, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-15.china-leadership-3
        when: 'Sept. 15'
        date: '1964-09-15'
        thread: china-leadership
        also: [china]
        c: 'Zhou, on a bulletin that the U.S. consulate general in Hong Kong will set up a "Voice of America" station at Macao, sends it to Chen Yi and Liao Chengzhi: this needs serious attention; press the Portuguese authorities at Macao; submit a plan to the Center.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 667 (Sept. 15, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, Liao Chengzhi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-16.china-leadership
        when: 'Sept. 16–17'
        date: '1964-09-16'
        thread: china-leadership
        also: [testing]
        c: 'Zhou chairs the ninth meeting of the Special Commission of the Central Committee on preparing for the first nuclear test, the rehearsal summary, the date of the real test.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 667–68 (Sept. 16–17, 1964). Made public: 1997. Names: Zhou Enlai, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09.china-leadership
        when: 'Sept., mid- to 27th'
        date: '1964-09'
        thread: china-leadership
        c: 'Zhou, from mid-September to the 27th, repeatedly reviews and calls people on the big music-and-dance epic *The East Is Red*; sets its theme and chief episodes himself and revises the narration. To Zhou Yang, Zhou Weizhi, Chen Yading and others: Mao Zedong Thought is to stand out, guided by Mao''s Yan''an Talks, unity of politics and art, content and form; a Chinese style the people like; an epic''s way, broad and deep; dare break molds. Rejects adding the Nanchang Uprising: stress the Autumn Harvest Uprising Mao led; permits only one line in the narration, "the shots of Nanchang rang the first spring thunder". Asks Peng Zhen, Lu Dingyi, Zhou Yang, Guo Moruo, Yao Zhen and others about the narration.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 668 (Sept., mid- to 27th 1964). Made public: 1997. Names: Zhou Enlai, Peng Zhen, Lu Dingyi, Zhou Yang, Guo Moruo, Yao Zhen, Zhou Weizhi, Chen Yading.'
        tags: [name:zhou-enlai, name:peng-zhen, name:lu-dingyi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-19.china-leadership
        when: 'Sept. 19'
        date: '1964-09-19'
        thread: china-leadership
        c: 'Zhou, on the summary of Chen Guanrong''s speech to the chemical construction conference on importing new technology: import is for self-reliance, not dependence; before buying technology consult our own experts; buy key equipment and patents; sometimes only the technical papers.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 668 (Sept. 19, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-19.china-leadership-2
        when: 'Sept. 19'
        date: '1964-09-19'
        thread: china-leadership
        also: [korea, soviet-union]
        c: 'Zhou leaves Beijing for Harbin to meet Kim Il Sung; back the next day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 668 (Sept. 19, 1964). Made public: 1997. Names: Zhou Enlai, Kim Il Sung.'
        tags: [name:zhou-enlai, name:kim-il-sung, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-09-21.china-leadership-2
        when: 'Sept. 21'
        date: '1964-09-21'
        thread: china-leadership
        c: 'Zhou, on Bo Yibo''s report that the chief faults of the labor and wage system are the Soviet pattern copied, and that "reform cannot wait": proposes the planning conference discuss reform of labor and wages, in essence an important part of the economic revolution. On Sept. 27 Li Fuchun has the report and Zhou''s note printed for the national planning conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 668–69 (Sept. 21, 1964). Made public: 1997. Names: Zhou Enlai, Bo Yibo.'
        tags: [name:zhou-enlai, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-21.china-leadership-3
        when: 'Sept. 21'
        date: '1964-09-21'
        thread: china-leadership
        also: [congo, africa]
        c: 'Zhou receives Alphonse Bayonne, first Congo (Brazzaville) ambassador in China: after independence change the colonial state and carry the revolution on; oppressed states of Asia, Africa and Latin America should break protocol, use on imperialists and colonialists the protocol they made to bind others, a revolution in international relations too.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 669 (Sept. 21, 1964). Names: Zhou Enlai, Alphonse Bayonne.'
        tags: [name:zhou-enlai, polity:prc, polity:congo-brazzaville]
  - add:
      entry:
        id: cal.1964-09-22.china-leadership
        when: 'Sept. 22'
        date: '1964-09-22'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou, with Mao, Liu and Zhu De, wires condolences on the death of Otto Grotewohl, chairman of the Council of Ministers of the German Democratic Republic and deputy chairman of its Council of State. The same day, with Dong Biwu, Chen Yi, Tan Zhenlin, Guo Moruo and others, goes to the GDR embassy to condole.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 669 (Sept. 22, 1964). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Dong Biwu, Chen Yi, Tan Zhenlin, Guo Moruo, Grotewohl.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:dong-biwu, name:chen-yi, name:tan-zhenlin, name:grotewohl-otto, polity:prc, polity:gdr]
  - add:
      entry:
        id: cal.1964-09-22.china-leadership-2
        when: 'Sept. 22'
        date: '1964-09-22'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou receives Ceylon''s ambassador S. F. de Silva. Since China''s self-defensive counterattack of 1962 and unilateral ceasefire and withdrawal, the Sino-Indian border has eased and will ease more; the "tension" is in the Indian press and diplomatic papers, not there. India makes tension, a cold war, to get arms, not a hot war. China wants negotiation and opposes changing the status quo by force.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 669 (Sept. 22, 1964). Names: Zhou Enlai, de Silva.'
        tags: [name:zhou-enlai, polity:prc, polity:ceylon]
  - add:
      entry:
        id: cal.1964-09-22.china-leadership-3
        when: 'Sept. 22'
        date: '1964-09-22'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou receives Syria''s new ambassador Hilal Raslan. The Arab summit just ended (Alexandria, Sept. 5–11: welcomed the PLO, backed its army, set up a joint Arab command) settled some questions and left others. China in principle supports the Palestine Arabs'' right to return to their homes.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 669–70 (Sept. 22, 1964). Names: Zhou Enlai, Hilal Raslan.'
        tags: [name:zhou-enlai, polity:prc, polity:syria]
  - add:
      entry:
        id: cal.1964-09-23.china-leadership
        when: 'Sept. 23'
        date: '1964-09-23'
        thread: china-leadership
        also: [testing]
        c: 'Zhou calls Special Commission members He Long, Zhang Aiping, Liu Jie and Liu Xiyao to talk.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 670 (Sept. 23, 1964). Made public: 1997. Names: Zhou Enlai, He Long, Zhang Aiping, Liu Jie, Liu Xiyao.'
        tags: [name:zhou-enlai, name:he-long, name:zhang-aiping, name:liu-jie, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-23.china-leadership-2
        when: 'Sept. 23'
        date: '1964-09-23'
        thread: china-leadership
        also: [south-asia, testing]
        c: 'Zhou receives the Ceylonese parliamentary delegation. Tells the 1962 border clash and the Colombo proposals. On the Ceylonese Prime Minister''s plan for an Indian Ocean nuclear-free zone: a good idea; China has long proposed a zone on the Asian and Pacific coasts, the Soviet Union, U.S., Japan and China included. It favors total prohibition and destruction of nuclear weapons, opposes great-power monopoly and blackmail; only by breaking the monopoly can total prohibition come.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 670 (Sept. 23, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:ceylon]
  - add:
      entry:
        id: cal.1964-09-26.china-leadership
        when: 'Sept. 26'
        date: '1964-09-26'
        thread: china-leadership
        c: 'Zhou calls on Song Qingling.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 670 (Sept. 26, 1964). Made public: 1997. Names: Zhou Enlai, Song Qingling.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-27.china-leadership-2
        when: 'Sept. 27'
        date: '1964-09-27'
        thread: china-leadership
        also: [laos, vietnam-hanoi]
        c: 'Zhou receives Prince Sihanouk, invited for the fifteenth National Day and in China to Oct. 7; with Liu Shaoqi holds talks with him.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 670 (Sept. 27, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Sihanouk.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:norodom-sihanouk, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1964-09-28.china-leadership
        when: 'Sept. 28–Oct. 3'
        date: '1964-09-28'
        thread: china-leadership
        also: [africa, congo]
        c: 'Zhou receives President Massamba-Débat of the Congo (Brazzaville), invited for National Day, Sept. 28–Oct. 3; talks with him with Liu Shaoqi. Oct. 2 attends the signing of a treaty of friendship and agreements on economic and technical cooperation, cultural cooperation and shipping.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 670 (Sept. 28–Oct. 3, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Massamba-Débat.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, polity:congo-brazzaville, vis:only:prc+congo-brazzaville]
  - add:
      entry:
        id: cal.1964-09-29.china-leadership-2
        when: 'Sept. 29'
        date: '1964-09-29'
        thread: china-leadership
        also: [africa, congo]
        c: 'Zhou, talks with Massamba-Débat on aid: China will help build the economy because the Congo trusts it; the question is which projects first. Do not argue heavy or light industry; look first at resources, then labor, which a small population must save. A backward economy must build with advanced technique.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 670–71 (Sept. 29, 1964). Made public: 1997. Names: Zhou Enlai, Massamba-Débat.'
        tags: [name:zhou-enlai, polity:prc, polity:congo-brazzaville, vis:only:prc+congo-brazzaville]
  - add:
      entry:
        id: cal.1964-09-29.china-leadership-3
        when: 'Sept. 29'
        date: '1964-09-29'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou receives the Romanian party and government delegation under Maurer. Khrushchev is an adventurer, as when he negated Stalin wholesale; basically three things: treason to Marxism-Leninism, sale of revolution, subversion of fraternal parties.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 671 (Sept. 29, 1964). Made public: 1997. Names: Zhou Enlai, Maurer.'
        tags: [name:zhou-enlai, name:maurer-ion-gheorghe, polity:prc, polity:romania, vis:only:prc+romania]
  - add:
      entry:
        id: cal.1964-09-30.china-leadership
        when: 'Sept. 30'
        date: '1964-09-30'
        thread: china-leadership
        c: 'Zhou, with Mao, Liu, Song Qingling, Dong Biwu, Zhu De and Deng, receives the foreign guests come for the fifteenth National Day; in the evening attends the National Day reception.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 671 (Sept. 30, 1964). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Song Qingling, Dong Biwu, Zhu De, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:dong-biwu, name:zhu-de, name:deng-xiaoping, polity:prc]
  - add:
      entry:
        id: cal.1964-10-01.china-leadership
        when: 'Oct. 1'
        date: '1964-10-01'
        thread: china-leadership
        c: 'Zhou, with Mao, Liu, Song, Dong, Zhu and Deng, attends the capital''s rally for the fifteenth anniversary of the People''s Republic and reviews the parade of 700,000; inscribes for it: "Rely on yourselves, work hard for strength."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 671 (Oct. 1, 1964). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Song Qingling, Dong Biwu, Zhu De, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:dong-biwu, name:zhu-de, name:deng-xiaoping, polity:prc]
  - add:
      entry:
        id: cal.1964-10-02.china-leadership
        when: 'Oct. 2'
        date: '1964-10-02'
        thread: china-leadership
        also: [africa, congo]
        c: 'Zhou, in talks with Massamba-Débat: China''s people are friendly to Africa''s, it must help and the Congo may ask, but look far; aid will grow stage by stage with the facts, so the economy grows and the idea of an independent economy takes root; no nation should think of depending on others. At the lunch after: opposes nuclear monopoly, which only raises the danger of nuclear war and lets the nuclear powers threaten others; China favors total prohibition and destruction but until then keeps the right to nuclear arms; if China gets them it is for self-defense and peace, so that total prohibition of tests and destruction becomes more possible.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 671 (Oct. 2, 1964). Made public: 1997. Names: Zhou Enlai, Massamba-Débat.'
        tags: [name:zhou-enlai, polity:prc, polity:congo-brazzaville, vis:only:prc+congo-brazzaville]
  - add:
      entry:
        id: cal.1964-10-02.china-leadership-2
        when: 'Oct. 2'
        date: '1964-10-02'
        thread: china-leadership
        c: 'Zhou, with Liu, Dong Biwu, Zhu De, Deng and others, attends in the Great Hall the first public performance of the music-and-dance epic *The East Is Red* with the foreign guests.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 671 (Oct. 2, 1964). Names: Zhou Enlai, Liu Shaoqi, Dong Biwu, Zhu De, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:dong-biwu, name:zhu-de, name:deng-xiaoping, polity:prc]
  - add:
      entry:
        id: cal.1964-10-02.china-leadership-3
        when: 'Oct. 2'
        date: '1964-10-02'
        thread: china-leadership
        c: 'Zhou receives Joseph Needham and Mrs. Needham, president of the Britain–China Friendship Association. After hearing him on *Science and Civilisation in China* decides to have it translated into Chinese; assigns a person and the Academy of Sciences'' institute for the history of natural science to do it.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 672 (Oct. 2, 1964). Names: Zhou Enlai, Needham.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-10-03.china-leadership
        when: 'Oct. 3'
        date: '1964-10-03'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, in talks with Keita: knowledge comes from working people; all knowledge passes through the hands into the mind, coarse, partial and unsystematic at first, which intellectuals gather, systematize and raise to theory, but it must go back to labor, practice and the masses to be proved. Every nation has things common and different; principles settle the common, the particular needs each country''s own conditions.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 672 (Oct. 3, 1964). Made public: 1997. Names: Zhou Enlai, Keita.'
        tags: [name:zhou-enlai, name:keita-modibo, polity:prc, polity:mali, vis:only:prc+mali]
  - add:
      entry:
        id: cal.1964-10-04.china-leadership
        when: 'Oct. 4'
        date: '1964-10-04'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou receives the East German government delegation under Deputy Chairman of the Council of Ministers Bolz. U.S. nuclear blackmail still threatens many states; only total prohibition and destruction work, otherwise hands are tied and imperialism freely enlarges its nuclear arms. The imperialists dislike us: the U.S. never said a good word of Mao or of him.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 672 (Oct. 4, 1964). Names: Zhou Enlai, Bolz.'
        tags: [name:zhou-enlai, polity:prc, polity:gdr]
  - add:
      entry:
        id: cal.1964-10-05.china-leadership-2
        when: 'Oct. 5'
        date: '1964-10-05'
        thread: china-leadership
        c: 'Zhou receives the Burmese government delegation. Tells the history of China''s revolution: from the masses to the masses, practice to theory; Marxism-Leninism joined to Chinese practice is Mao Zedong Thought; lessons from right and "left" deviations in the Party, work and war; the same holds for socialist construction now, experience still being summed up, not enough.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 672–73 (Oct. 5, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:burma]
  - add:
      entry:
        id: cal.1964-10-05.china-leadership-3
        when: 'Oct. 5'
        date: '1964-10-05'
        thread: china-leadership
        also: [vietnam-hanoi, laos]
        c: 'Zhou, at a cocktail reception for the Cambodian (Sihanouk, Penn Nouth), Vietnamese (Phạm Văn Đồng, Hoàng Văn Hoan, Nguyễn Cơ Thạch), Lao (Souphanouvong, Phoumi Vongvichit) and National Liberation Front (Trần Văn Thanh, Nguyễn Minh Phương) delegations: more than a reception, a gathering of historic meaning; the contact of several states'' leaders shows Indochina has a bright future; hopes for mutual support in later meetings.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 673 (Oct. 5, 1964). Check: the forms of the Liberation Front names, given in Chinese by the chronology. Names: Zhou Enlai, Sihanouk, Penn Nouth, Phạm Văn Đồng, Hoàng Văn Hoan, Nguyễn Cơ Thạch, Souphanouvong, Phoumi Vongvichit, Trần Văn Thanh, Nguyễn Minh Phương.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, name:pham-van-dong, name:souphanouvong, polity:prc, polity:cambodia, polity:drv, polity:laos]
  - add:
      entry:
        id: cal.1964-10-05.china-leadership-4
        when: 'Oct. 5'
        date: '1964-10-05'
        thread: china-leadership
        also: [laos, vietnam-hanoi]
        c: 'Zhou, after going with Sihanouk to the Central Conservatory of Music, attends the signing of the Sino-Cambodian joint communiqué; receives from Sihanouk Cambodia''s highest order, the Order of Independence.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 670 (Oct. 5, 1964). Names: Zhou Enlai, Sihanouk.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1964-10-06.china-leadership
        when: 'Oct. 6'
        date: '1964-10-06'
        thread: china-leadership
        c: 'Zhou, with Mao and others, attends the National Day evening of the General Political Department and sees *The East Is Red* again.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 672 (Oct. 6, 1964). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1964-10-15.china-leadership
        when: 'Oct. 15'
        date: '1964-10-15'
        thread: china-leadership
        also: [japan]
        c: 'Zhou, after taking a Japanese ballet company to see *The East Is Red*, goes backstage to answer the foreign guests'' questions, technical ones on lighting included. The cast: the Premier is our chief director.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 672 (Oct. 15, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-10-06.china-leadership-2
        when: 'Oct. 6'
        date: '1964-10-06'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou tells Maurer of the Sino-Soviet border talks, half a year old. China put three principles: the Nerchinsk treaty, before the nineteenth century, was not unequal; the treaties after the mid-century imposed by the tsar were, but China does not ask to change the lines they set or claim territory; the old treaties are the basis, to see where Russia took more than they allow and must give back, with some trade and adjustment; after surveying the whole line a new treaty replaces the old. The Soviet side rejects the principles, rejects an interim agreement keeping the status quo, and rejects going over the line section by section in a working group.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 673 (Oct. 6, 1964). Made public: 1997. Names: Zhou Enlai, Maurer.'
        tags: [name:zhou-enlai, name:maurer-ion-gheorghe, polity:prc, polity:romania, vis:only:prc+romania]
  - add:
      entry:
        id: cal.1964-10-06.china-leadership-3
        when: 'Oct. 6'
        date: '1964-10-06'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou, on the road with Phạm Văn Đồng to the airport, on war readiness: general mobilization and city evacuation are to be done; China mobilized fully against Chiang''s coastal landing last year and in the recent Gulf of Tonkin affair; after tension for a time, relax a little.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 673–74 (Oct. 6, 1964). Made public: 1997. Names: Zhou Enlai, Phạm Văn Đồng.'
        tags: [name:zhou-enlai, name:pham-van-dong, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1964-10-07.china-leadership-2
        when: 'Oct. 7'
        date: '1964-10-07'
        thread: china-leadership
        also: [testing]
        c: 'Zhou calls Liu Jie and Liu Bailuo, deputy secretary-general of the Special Commission''s office, to talk.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 674 (Oct. 7, 1964). Made public: 1997. Names: Zhou Enlai, Liu Jie, Liu Bailuo.'
        tags: [name:zhou-enlai, name:liu-jie, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-08.china-leadership-2
        when: 'Oct. 8'
        date: '1964-10-08'
        thread: china-leadership
        also: [middle-east, africa]
        c: 'Zhou receives Mashnouk, owner and editor-in-chief of Beirut''s *Evening News*. On how the five principles for relations with Arab states and the eight principles of economic cooperation with Africa came: some match the five of peaceful coexistence; two learned in Africa: respect for Arab and African states settling disputes by peaceful talks, not force; and support for Arab peoples in realizing Arab unity in the way they choose, as for Africa.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 674 (Oct. 8, 1964). Names: Zhou Enlai, Mashnouk.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-10-10.china-leadership
        when: 'Oct. 10'
        date: '1964-10-10'
        thread: china-leadership
        c: 'Zhou, on Li Jingquan and Lü Zhengcao''s report on routing the Sichuan–Hubei railway, drawn up on Mao''s and the Central Committee''s order to stop the Hunan–Guizhou line and build the Sichuan–Hubei (Li, Yuan, Qing river plans): agrees with the report''s "planning revolution" and Bo Yibo''s note that both routes must have the same surveys and designs before choice, not one fixed beforehand. Asks for a map of the underground resources along the first route, from the geology and metallurgy ministries.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 674 (Oct. 10, 1964). Made public: 1997. Names: Zhou Enlai, Li Jingquan, Lü Zhengcao, Bo Yibo.'
        tags: [name:zhou-enlai, name:li-jingquan, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-10.china-leadership-2
        when: 'Oct. 10'
        date: '1964-10-10'
        thread: china-leadership
        also: [laos]
        c: 'Zhou, talking with Souphanouvong and Phoumi Vongvichit: imperialism and modern revisionism both bully the weak and fear the hard; hold firm, even to a break, and they weaken. Favors an early fourteen-nation Geneva conference on Laos.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 674–75 (Oct. 10, 1964). Made public: 1997. Names: Zhou Enlai, Souphanouvong, Phoumi Vongvichit.'
        tags: [name:zhou-enlai, name:souphanouvong, polity:prc, polity:laos, vis:only:prc+laos]
  - add:
      entry:
        id: cal.1964-10-11.china-leadership
        when: 'Oct. 11'
        date: '1964-10-11'
        thread: china-leadership
        also: [testing]
        c: 'Zhou, as good weather is likely Oct. 15, after the reports from Zhang Aiping and Liu Xiyao at the site and Liu Jie''s on air defense, writes to Mao, Liu, Lin, Deng, Peng, He Long, Nie and Luo: all is ready; by secure line and code word he will tell the site to go ahead as it proposed, to choose the day and hour of firing from Oct. 15 to 20 by the weather and tell the Center. Luo to have the General Staff check, link and direct air defense; Liu Jie to see to removing papers, equipment and instruments and to secrecy. Settles other points in the reports, "all to be carried out". That evening again calls Yang Chengwu, Liu Jie, Qiao Guanhua.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 675 (Oct. 11, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Lin Biao, Deng Xiaoping, Peng Zhen, He Long, Nie Rongzhen, Luo Ruiqing, Zhang Aiping, Liu Xiyao, Liu Jie.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:lin-biao, name:deng-xiaoping, name:peng-zhen, name:he-long, name:nie-rongzhen, name:luo-ruiqing, name:zhang-aiping, name:liu-jie, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-11.china-leadership-2
        when: 'Oct. 11'
        date: '1964-10-11'
        thread: china-leadership
        also: [japan]
        c: 'Zhou sees the Matsuyama Ballet of Japan, Oct. 11 and 17, and receives its head Shimizu Masao and deputy head and dancer Matsuyama Mikiko.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 675 (Oct. 11, 1964). Names: Zhou Enlai, Shimizu Masao, Matsuyama Mikiko.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-10-12.china-leadership
        when: 'Oct. 12'
        date: '1964-10-12'
        thread: china-leadership
        also: [south-asia, africa]
        c: 'Zhou receives Pakistani ambassador Raza. China will propose to the second Asian-African conference that members first do economic cooperation on equality and mutual help, end imperialist privilege, and steady raw-material export prices; whether to have a joint bank the conference will study, China preparing a plan to talk over first with Pakistan, Indonesia, Cambodia and other friends.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 675 (Oct. 12, 1964). Made public: 1997. Names: Zhou Enlai, Raza.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1964-10-13.china-leadership
        when: 'Oct. 13'
        date: '1964-10-13'
        thread: china-leadership
        also: [testing]
        c: 'Zhou reports to the Secretariat, then to Mao, on propaganda and political struggle after the explosion; approved.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 675–76 (Oct. 13, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-14.china-leadership
        when: 'Oct. 14'
        date: '1964-10-14'
        thread: china-leadership
        also: [testing]
        c: 'Zhou sends Mao, Liu, Lin, Deng, Peng and He Long his revised drafts of the government statement, the news communiqué and the Central Committee notice on the atomic explosion. This test to be publicized, to break all slander and provocation and help later struggle. The front is still weighing the hour; if fixed tonight, he will tell them. That day gives the order for the device to be put in place.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 676 (Oct. 14, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Lin Biao, Deng Xiaoping, Peng Zhen, He Long.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:lin-biao, name:deng-xiaoping, name:peng-zhen, name:he-long, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-15.china-leadership-2
        when: 'Oct. 15'
        date: '1964-10-15'
        thread: china-leadership
        also: [testing]
        c: 'Zhou telephones Liu Jie to ask the likely results of the test and tells him to prepare for any mishap.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 676 (Oct. 15, 1964). Made public: 1997. Names: Zhou Enlai, Liu Jie.'
        tags: [name:zhou-enlai, name:liu-jie, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-16.china-leadership-3
        when: 'Oct. 16'
        date: '1964-10-16'
        thread: china-leadership
        also: [testing]
        c: 'The Chinese government''s statement on the test: China will never be first to use nuclear weapons, at any time, in any case; it stands for total prohibition and destruction; the tests are forced, the weapons for defense against the American nuclear threat. Proposes a summit of all states on total prohibition and destruction, and as a first step an agreement of nuclear and soon-to-be nuclear states not to use them, not against states without them, not against nuclear-free zones, nor against each other.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 676 (Oct. 16, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-10-16.china-leadership-4
        when: 'Oct. 16'
        date: '1964-10-16'
        thread: china-leadership
        also: [testing]
        c: 'The Central Committee and State Council, in a telegram Zhou reviews, congratulate all who took part in the first test: a new stage of national defense modernization; a heavy blow to U.S. nuclear monopoly and blackmail; keep up, do not grow proud, climb new peaks.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 676–77 (Oct. 16, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-10-16.china-leadership-5
        when: 'Oct. 16'
        date: '1964-10-16'
        thread: china-leadership
        also: [testing]
        c: 'Zhou, with Mao, Liu and others, receives in the Great Hall the whole cast and crew of *The East Is Red* and tells them the first atomic bomb has exploded; the hall cheers.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 16, 1964). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, polity:prc]
  - add:
      entry:
        id: cal.1964-10-16.china-leadership-6
        when: 'Oct. 16'
        date: '1964-10-16'
        thread: china-leadership
        c: 'Zhou, at night, calls people from the arts and proposes filming *The East Is Red*; gives views on the filming.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 16, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-19.china-leadership
        when: 'Oct. 19'
        date: '1964-10-19'
        thread: china-leadership
        c: 'Zhou goes to Mao''s for a meeting or talk.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 19, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-17.china-leadership
        when: 'Oct. 17'
        date: '1964-10-17'
        thread: china-leadership
        also: [testing]
        c: 'Zhou attends the 127th enlarged meeting of the NPC Standing Committee; hears Yang Chengwu report on the first atomic test and speaks.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 17, 1964). Names: Zhou Enlai, Yang Chengwu.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-10-17.china-leadership-2
        when: 'Oct. 17'
        date: '1964-10-17'
        thread: china-leadership
        also: [testing]
        c: 'Zhou wires the heads of government of all countries with the proposals of the Oct. 16 statement, a world summit on the complete prohibition and thorough destruction of nuclear weapons first among them, and asks their consideration and positive response.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 676 (Oct. 17, 1964). See [[cal.1964-10-16.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-10-18.china-leadership
        when: 'Oct. 18'
        date: '1964-10-18'
        thread: china-leadership
        also: [japan]
        c: 'Zhou attends the opening of the Beijing international table tennis invitational and watches. To the head of the Japanese team, Hasegawa Kitarō: the International Olympic Committee should accept table tennis and badminton, popular sports, as events.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 18, 1964). Names: Zhou Enlai, Hasegawa Kitarō.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-10-18.china-leadership-2
        when: 'Oct. 18'
        date: '1964-10-18'
        thread: china-leadership
        also: [testing]
        c: 'Zhou receives Burma''s departing ambassador Kyaw Win. Direct contacts should grow to advance friendship and exchange in economy, culture and science; differing positions need not agree at once, but talking brings understanding. The explosion was confined to a very small area; China can fully assure that it endangers no neighbor.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 677–78 (Oct. 18, 1964). Names: Zhou Enlai, Kyaw Win.'
        tags: [name:zhou-enlai, polity:prc, polity:burma]
  - add:
      entry:
        id: cal.1964-10-21.china-leadership
        when: 'Oct. 21'
        date: '1964-10-21'
        thread: china-leadership
        also: [japan]
        c: 'Zhou again watches the table tennis and talks with Hasegawa: if the Japanese team has trouble training, student players could come to China in summer; China would give the facilities and nourishment, for common improvement. That evening receives the players, team heads and coaches.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 678 (Oct. 21, 1964). Names: Zhou Enlai, Hasegawa Kitarō.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-10-19.china-leadership-2
        when: 'Oct. 19'
        date: '1964-10-19'
        thread: china-leadership
        c: 'Zhou, at the national planning conference: to read world politics, learn to spot and keep to the wind, watch the turns in key events, learn Mao''s scientific foresight, take big matters early. Planners be modest. Two revolutions on the economic front: industrial, in productive forces, and planning, in the superstructure. Production relations still have problems; the atomic bomb will spur thinking and productive forces; catch up with new technique, not the old road.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 678 (Oct. 19, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-20.china-leadership
        when: 'Oct. 20'
        date: '1964-10-20'
        thread: china-leadership
        also: [testing]
        c: 'Zhou, before dawn, calls Liu Jie, Yang Chengwu and others to a meeting.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 678 (Oct. 20, 1964). Made public: 1997. Names: Zhou Enlai, Liu Jie, Yang Chengwu.'
        tags: [name:zhou-enlai, name:liu-jie, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-23.china-leadership
        when: 'Oct. 23'
        date: '1964-10-23'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou reports to the enlarged meeting of the cast of *The East Is Red*, some 7,000 from central, local and army troupes: the performance succeeded. Party history and the world situation; the show must bring out Mao''s three magic weapons, the united front, armed struggle and Party building, decisive before 1949 and for the fifteen years since. A party that does not keep to the masses has no life; without criticism and self-criticism it cannot lead to victory; its discipline is to keep to revolution and unite against the enemy, even if the leadership errs for a time one waits and changes it step by step, without splitting the Party. The Zunyi meeting, Mao turning the helm in the storm, must be put in and stand out. Khrushchev''s fall and China''s atom bomb are new in the world and still developing; stay cool and watch the changes. Artists must make themselves revolutionaries.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 678–79 (Oct. 23, 1964). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1964-10-23.china-leadership-2
        when: 'Oct. 23'
        date: '1964-10-23'
        thread: china-leadership
        c: 'Zhou calls Nie Rongzhen and Lü Dong, minister of metallurgy, to talk.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 679 (Oct. 23, 1964). Made public: 1997. Names: Zhou Enlai, Nie Rongzhen, Lü Dong.'
        tags: [name:zhou-enlai, name:nie-rongzhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-24.china-leadership
        when: 'Oct. 24'
        date: '1964-10-24'
        thread: china-leadership
        c: 'Zhou, on reports from the work teams sent to Hebei and from Grain Minister Chen Guodong on disaster in Hebei, Henan and elsewhere, and Li Xiannian''s proposal for a meeting in early November of those handling grain in the six regions and of the stricken places: before it, telephone Hebei that a secretary or vice-governor take up relief to the end, stress self-help through production; first allot relief funds, honestly, to families who cannot buy grain. Li passes his view on to Hebei, Henan and Shandong next day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 679–80 (Oct. 24, 1964). Made public: 1997. Names: Zhou Enlai, Li Xiannian, Chen Guodong.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-24.china-leadership-2
        when: 'Oct. 24'
        date: '1964-10-24'
        thread: china-leadership
        c: 'Zhou receives a Philippine journalists'' delegation. Both are in alliances, China with the Soviet Union, the Philippines in SEATO, once hostile and unfriendly; relations can and should improve, no basic conflict of interest; since Bandung China has looked to growth of exchanges between peoples. "Revolution cannot be exported"; what system a people chooses is not for another''s will; each people walks its own road.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 680 (Oct. 24, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:philippines]
  - add:
      entry:
        id: cal.1964-10-25.china-leadership
        when: 'Oct. 25'
        date: '1964-10-25'
        thread: china-leadership
        c: 'Zhou, on Mao''s suggestion over the Guangdong Party committee''s request on defense industry and third-front war preparation, calls the offices concerned with Luo Ruiqing; sets out how front- and second-line provinces, cities and regions should lay out their own third fronts.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 680 (Oct. 25, 1964). Made public: 1997. Names: Zhou Enlai, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-29.china-leadership-2
        when: 'Oct. 29'
        date: '1964-10-29'
        thread: china-leadership
        c: 'Zhou and Luo Ruiqing report jointly to Mao and the Central Committee: all agreed to forward Guangdong''s report and Mao''s note to Party committees of front- and second-line provinces, cities and regions, to draw up by December specific plans for strengthening the rear and war preparation for next year and three years on. Five points: front-line plans first next year, second-line fewer projects; careful ranking by funds, equipment, materials, one finished at a time; removed plants prepared to shorten stoppage; projects outside defense and third-front work go into central or local plans; frugality; main arms plants and depots small, dispersed, against hills, hidden. Same day drafts the Central Committee''s covering note.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 680–81 (Oct. 29, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:mao-zedong, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-29.china-leadership-3
        when: 'Oct. 29'
        date: '1964-10-29'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou tells Soviet ambassador Chervonenko the Central Committee has decided to send a party and government delegation under him to Moscow; proposes the Soviet side invite, for the October Revolution anniversary, delegations of the twelve other socialist states for contact. See [[cal.1964-10-29.china-leadership]].'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 681 (Oct. 29, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-29.china-leadership-4
        when: 'Oct. 29'
        date: '1964-10-29'
        thread: china-leadership
        c: 'Zhou reads the draft outline of the 1965 plan; on Li Xiannian''s cover letter notes that key matters, third-front building, splitting and moving plants, front- and second-line provinces'' third-front plans, trust trials and machine-industry adjustment, will go for approval separately when specifically arranged. Adds to the outline''s paragraph on preparations: provinces to push the rear build-up of front- and second-line regions and the strategic rear of third-line regions.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 681 (Oct. 29, 1964). Made public: 1997. Names: Zhou Enlai, Li Xiannian.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-29.china-leadership-5
        when: 'Oct. 29'
        date: '1964-10-29'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou summons the ambassadors and chargés of North Korea, Vietnam, Romania, Albania and Cuba and asks them to tell their parties and governments the Central Committee''s and government''s proposal that twelve socialist states send party and government delegations to celebrate the forty-seventh anniversary of the October Revolution in Moscow and make contact. See [[cal.1964-11-01.china-leadership]].'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 681–82 (Oct. 29, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-30.china-leadership-2
        when: 'Oct. 30'
        date: '1964-10-30'
        thread: china-leadership
        also: [europe-and-the-alliance-france, testing]
        c: 'Zhou receives French ambassador Paye, who hands over de Gaulle''s reply to China''s proposal on total prohibition and destruction of nuclear weapons. China and France share a stand: until the U.S. stops making, testing and using such weapons, make them to break its monopoly, the only way to lessen the threat. China differs: it wants a summit outside the United Nations, because nuclear arms touch every people''s safety, peoples oppose threat and monopoly, nuclear arms cannot destroy mankind, which will destroy them; appeal to the world''s peoples.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 682 (Oct. 30, 1964). Made public: 1997. Names: Zhou Enlai, de Gaulle, Paye.'
        tags: [name:zhou-enlai, name:de-gaulle-charles, polity:prc, polity:fr, vis:only:prc+fr]
  - add:
      entry:
        id: cal.1964-10-30.china-leadership-3
        when: 'Oct. 30'
        date: '1964-10-30'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou receives the ambassadors of Bulgaria, Hungary, Czechoslovakia, Poland, Mongolia and the German Democratic Republic. Khrushchev''s removal is a good thing and plays a positive role; the situation has changed for the Soviet Union, the socialist camp and the world. Tells them he will lead a Chinese party and government delegation to the Soviet Union, and for the Central Committee and the government asks them to bring to their parties and governments the proposal that they send delegations to Moscow too, so contacts can be had.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 682 (Oct. 30, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:bulgaria, polity:hungary, polity:czechoslovakia, polity:poland, polity:mongolia, polity:gdr, vis:only:prc+bulgaria+hungary+czechoslovakia+poland+mongolia+gdr]
  - add:
      entry:
        id: cal.1964-10-31.china-leadership
        when: 'Oct. 31'
        date: '1964-10-31'
        thread: china-leadership
        c: 'Zhou, on the draft Central Committee and State Council notice on pressing socialist education together with production and relief: send the short notice to catch the attention of the Party secretaries, not the long instruction, which would only go to the offices; the center need only give an outline, localities will think of better means. Deng agrees.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 682–83 (Oct. 31, 1964). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-31.china-leadership-2
        when: 'Oct. 31'
        date: '1964-10-31'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou receives Chervonenko, who conveys the Soviet Party and government''s welcome to the Chinese delegation. To his thanks that China honors the October holiday: an international holiday, first yours but not yours alone; the October Revolution opened our way; Mao wrote in his 1949 article for the Party''s twenty-eighth year, "Follow the Russians: that is the conclusion."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 683 (Oct. 31, 1964). Made public: 1997. Names: Zhou Enlai, Chervonenko.'
        tags: [name:zhou-enlai, name:chervonenko-stepan-v, polity:prc, polity:ussr, vis:only:prc+ussr]
  - add:
      entry:
        id: cal.1964-10-31.china-leadership-3
        when: 'Oct. 31'
        date: '1964-10-31'
        thread: china-leadership
        also: [testing]
        c: 'Zhou receives Edgar Snow. On his plan of visits: too broad a list; talk with those with firsthand material; on the atomic bomb Zhou is one. That night gives Snow twelve photographs of the Chinese bomb''s explosion, to publish at once in Switzerland.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 683 (Oct. 31, 1964). Names: Zhou Enlai, Snow.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-11-01.china-leadership-2
        when: 'Nov. 1'
        date: '1964-11-01'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou chairs the 149th plenary meeting of the State Council and speaks on the international situation. Attitude to Khrushchev''s fall: first, welcome, cable support; second, work to push change in the Soviet Union; third, watch a time; fourth, at international meetings if need be still argue with the Soviet Union, oppose or abstain where proper. The international situation is very good, so domestic work must be done better: those sent down to settle at points, sum up; those at home to see to production, distribution, purchase, relief.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 683 (Nov. 1, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-01.china-leadership-3
        when: 'Nov. 1–4'
        date: '1964-11-01'
        thread: china-leadership
        also: [africa, testing]
        c: 'Zhou receives President Keita of Mali, Nov. 1–4. In talks: states with nuclear weapons are few, those without many; a nuclear war concerns all; a few oppose destruction, the many favor it, the few must yield to the many for prohibition and destruction to come.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 683–84 (Nov. 1–4, 1964). Names: Zhou Enlai, Keita.'
        tags: [name:zhou-enlai, name:keita-modibo, polity:prc, polity:mali]
  - add:
      entry:
        id: cal.1964-11-02.china-leadership
        when: 'Nov. 2–3'
        date: '1964-11-02'
        thread: china-leadership
        also: [testing]
        c: 'Zhou calls a small meeting of the Special Commission on Nov. 2, and on Nov. 3 again Liu Jie, Zhang Aiping, Xu Zirong and Liu Xiyao to discuss developing atomic energy further. After the first bomb orders the Second Ministry of Machine Building to hasten work on a hydrogen bomb.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 684 (Nov. 2–3, 1964). Made public: 1997. Names: Zhou Enlai, Liu Jie, Zhang Aiping, Xu Zirong, Liu Xiyao.'
        tags: [name:zhou-enlai, name:liu-jie, name:zhang-aiping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-03.china-leadership
        when: 'Nov. 3'
        date: '1964-11-03'
        thread: china-leadership
        also: [testing, europe-and-the-alliance-britain]
        c: 'Zhou receives Douglas Jay, British President of the Board of Trade. Why China proposes a summit on total prohibition and destruction of nuclear weapons, this year and last: the world agrees they threaten peace, so all states, large or small, should take part; states without them should speak to break the monopoly; only with them present can the nuclear states be bound not to use them, then prohibition. Asks him to tell the Prime Minister that Sino-British trade must clear its obstacles; China will import equipment, materials, instruments, but quotas and embargo limit trade; it will supply goods wanted. Jay says he has already talked with Ye Jizhuang of removing barriers.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 684 (Nov. 3, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:uk]
  - add:
      entry:
        id: cal.1964-11-04.china-leadership
        when: 'Nov. 4'
        date: '1964-11-04'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou and Luo Ruiqing fly to Shanghai to welcome Sukarno, returning from Korea; talks with him. Back in Beijing the morning of Nov. 5.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 684 (Nov. 4, 1964). Made public: 1997. Names: Zhou Enlai, Luo Ruiqing, Sukarno.'
        tags: [name:zhou-enlai, name:luo-ruiqing, name:sukarno, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1964-11-04.china-leadership-2
        when: 'Nov. 4'
        date: '1964-11-04'
        thread: china-leadership
        c: 'Zhou goes to Mao''s for a meeting or talk.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Nov. 4, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-05.china-leadership-2
        when: 'Nov. 5'
        date: '1964-11-05'
        thread: china-leadership
        also: [soviet-union, vietnam-hanoi]
        c: 'Zhou and He Long lead the Chinese party and government delegation from Beijing to Moscow; the Vietnamese delegation under Phạm Văn Đồng on the same plane. Reach Moscow the same day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 684 (Nov. 5, 1964). Names: Zhou Enlai, He Long, Phạm Văn Đồng.'
        tags: [name:zhou-enlai, name:he-long, name:pham-van-dong, polity:prc, polity:ussr, polity:drv]
  - add:
      entry:
        id: cal.1964-11-06.china-leadership
        when: 'Nov. 6'
        date: '1964-11-06'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou leads the delegation in laying a wreath at Lenin''s Mausoleum: "To the great leader and teacher of the proletarian revolution, V. I. Lenin."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 684–85 (Nov. 6, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:ussr]
  - add:
      entry:
        id: cal.1964-11-06.china-leadership-2
        when: 'Nov. 6'
        date: '1964-11-06'
        thread: china-leadership
        also: [soviet-union, china]
        c: 'Zhou calls on Brezhnev, Kosygin and Mikoyan. To Brezhnev he asks that the delegation''s head speak at the anniversary meeting; the Soviet side declines on a pretext; the draft speech called on the two parties to unite on Marxism-Leninism and proletarian internationalism. To Kosygin on leadership: no one has three heads and six arms, pooled wisdom is best; correct leadership sums up experience and masters laws. To Mikoyan: besides the festivities, the delegation wants contact and an exchange of views, a good beginning for later.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 685 (Nov. 6, 1964). Made public: 1997. Names: Zhou Enlai, Brezhnev, Kosygin, Mikoyan.'
        tags: [name:zhou-enlai, name:brezhnev-leonid, name:kosygin-aleksei, name:mikoyan-anastas, polity:prc, polity:ussr, vis:only:prc+ussr]
  - add:
      entry:
        id: cal.1964-11-06.china-leadership-3
        when: 'Nov. 6'
        date: '1964-11-06'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou attends at the Kremlin the Moscow meeting for the forty-seventh anniversary of the October Revolution; Brezhnev reports.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 685 (Nov. 6, 1964). Names: Zhou Enlai, Brezhnev.'
        tags: [name:zhou-enlai, name:brezhnev-leonid, polity:prc, polity:ussr]
  - add:
      entry:
        id: cal.1964-11-07.china-leadership-2
        when: 'Nov. 7'
        date: '1964-11-07'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou reviews the traditional parade and the march of the masses in Red Square with the Soviet leaders on Lenin''s Mausoleum. Attends the Soviet government''s reception at the Kremlin.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 685 (Nov. 7, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:ussr]
  - add:
      entry:
        id: cal.1964-11-07.china-leadership-3
        when: 'Nov. 7–12'
        date: '1964-11-07'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou heads the Chinese delegation in talks with the Romanian delegation, Nov. 7, 8 and 12. Nov. 8, hearing Romania''s view of the change of Soviet leaders: Khrushchev''s fall is good; its effect on policy will change relations at home and abroad; China wants to push them toward the better. Nov. 12: unhappy with the Soviet explanation of the causes.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 685 (Nov. 7–12, 1964). Made public: 1997. Names: Zhou Enlai, Maurer.'
        tags: [name:zhou-enlai, name:maurer-ion-gheorghe, polity:prc, polity:romania, vis:only:prc+romania]
  - add:
      entry:
        id: cal.1964-11-07.china-leadership-4
        when: 'Nov. 7–9'
        date: '1964-11-07'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou heads the Chinese delegation in talks with the Polish delegation, Nov. 7 and 9. Nov. 7: Khrushchev''s dismissal is good, will change Soviet Party and government policy somewhat and bear on home, international, fraternal-party and anti-enemy relations; how much, to be watched. Nov. 9: Gomułka proposes the two parties stop public polemics; Zhou: Khrushchev started them and insulted our leader by name; no sign now that they can stop; China is here for background and an exchange of views.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 685–86 (Nov. 7–9, 1964). Made public: 1997. Names: Zhou Enlai, Gomułka.'
        tags: [name:zhou-enlai, name:gomulka-wladyslaw, polity:prc, polity:poland, vis:only:prc+poland]
  - add:
      entry:
        id: cal.1964-11-08.china-leadership-2
        when: 'Nov. 8'
        date: '1964-11-08'
        thread: china-leadership
        also: [middle-east, soviet-union]
        c: 'Zhou talks with Marshal Amer, Vice-President of the UAR, then visiting the Soviet Union. The Soviet interior is their own affair; China hopes them stronger, not weaker, and farm and industry growing, not as last year; not quickly done, nor is China impatient.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 686 (Nov. 8, 1964). Made public: 1997. Names: Zhou Enlai, Amer.'
        tags: [name:zhou-enlai, name:amer-abdel-hakim, polity:prc, polity:uar, vis:only:prc+uar]
  - add:
      entry:
        id: cal.1964-11-09.china-leadership
        when: 'Nov. 9'
        date: '1964-11-09'
        thread: china-leadership
        also: [soviet-union, china]
        c: 'Zhou leads the Chinese delegation in talks with Brezhnev, Kosygin, Mikoyan and Andropov. China''s contact aims to improve relations step by step; wants to know the political reasons of Khrushchev''s dismissal. The meeting of fraternal parties cannot be tied to the preparatory meeting of December, which Khrushchev forced as a splitting meeting; the Chinese Party cannot attend.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 686–87 (Nov. 9, 1964). Made public: 1997. Names: Zhou Enlai, Brezhnev, Kosygin, Mikoyan, Andropov.'
        tags: [name:zhou-enlai, name:brezhnev-leonid, name:kosygin-aleksei, name:mikoyan-anastas, name:andropov-yuriy-vladimirovich, polity:prc, polity:ussr, vis:only:prc+ussr]
  - add:
      entry:
        id: cal.1964-11-09.china-leadership-2
        when: 'Nov. 9'
        date: '1964-11-09'
        thread: china-leadership
        also: [cuba]
        c: 'Zhou leads the Chinese delegation in talks with the Cuban delegation under Guevara; China will increase its grain aid to Cuba. Nov. 12, second talk: tells the course of the Sino-Soviet talks and China''s stand.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 687 (Nov. 9, 1964). Made public: 1997. Names: Zhou Enlai, Guevara.'
        tags: [name:zhou-enlai, name:guevara-ernesto, polity:prc, polity:cuba, vis:only:prc+cuba]
  - add:
      entry:
        id: cal.1964-11-10.china-leadership-2
        when: 'Nov. 10'
        date: '1964-11-10'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou, with the delegation, talks with the East German party and government delegation: the new Soviet leaders will go on carrying out Khrushchev''s policy without Khrushchev.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 687 (Nov. 10, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:gdr, vis:only:prc+gdr]
  - add:
      entry:
        id: cal.1964-11-10.china-leadership-3
        when: 'Nov. 10'
        date: '1964-11-10'
        thread: china-leadership
        also: [africa]
        c: 'Zhou meets Ben Alla, president of Algeria''s National Assembly, then in the Soviet Union.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 687 (Nov. 10, 1964). Names: Zhou Enlai, Ben Alla.'
        tags: [name:zhou-enlai, polity:prc, polity:algeria]
  - add:
      entry:
        id: cal.1964-11-10.china-leadership-4
        when: 'Nov. 10–12'
        date: '1964-11-10'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Zhou, with the delegation, two talks with the Vietnamese delegation, Nov. 10 and 12. Tells the Sino-Soviet talks and says that after a few days of contact things are worse than expected: the Soviet leadership weak, in inner conflict, confused, shaky, under pressure from all sides, none of it foreseen.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 687 (Nov. 10–12, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1964-11-11.china-leadership
        when: 'Nov. 11'
        date: '1964-11-11'
        thread: china-leadership
        also: [soviet-union, china]
        c: 'Zhou, in talks with Soviet leaders, Nov. 11: with the Soviet side still on Khrushchev''s line and the basic differences of principle unsettled, one cannot speak of ending the public polemics. The new Soviet leaders still show Khrushchev''s tendency to act the "father party".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 687 (Nov. 11, 1964). Made public: 1997. Names: Zhou Enlai, Brezhnev, Kosygin, Mikoyan, Andropov.'
        tags: [name:zhou-enlai, name:brezhnev-leonid, name:kosygin-aleksei, name:mikoyan-anastas, name:andropov-yuriy-vladimirovich, polity:prc, polity:ussr, vis:only:prc+ussr]
  - add:
      entry:
        id: cal.1964-11-12.china-leadership
        when: 'Nov. 12'
        date: '1964-11-12'
        thread: china-leadership
        also: [soviet-union, china]
        c: 'Zhou, third talk with the Soviet leaders: not satisfied with Brezhnev''s account of Khrushchev''s removal. The two parties'' door to consultation is open; asks that no new obstacle be raised in creating a new atmosphere.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 687 (Nov. 12, 1964). Made public: 1997. Names: Zhou Enlai, Brezhnev.'
        tags: [name:zhou-enlai, name:brezhnev-leonid, polity:prc, polity:ussr, vis:only:prc+ussr]
  - add:
      entry:
        id: cal.1964-11-13.china-leadership
        when: 'Nov. 13'
        date: '1964-11-13'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou receives the staff of the Chinese embassy, students in Moscow and Chinese at the Dubna joint nuclear institute. With He Long leads the delegation home; on the way to the airport Kosygin proposes a top-level Sino-Soviet meeting of parties and states; Zhou will tell the Central Committee.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 687–88 (Nov. 13, 1964). Names: Zhou Enlai, Kosygin.'
        tags: [name:zhou-enlai, name:kosygin-aleksei, polity:prc, polity:ussr]
  - add:
      entry:
        id: cal.1964-11-15.china-leadership
        when: 'Nov. 15'
        date: '1964-11-15'
        thread: china-leadership
        also: [trade, europe-and-the-alliance-britain]
        c: 'Zhou receives Mather, chairman of Mather & Platt, which holds the British machinery and scientific instruments exhibition in Beijing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 688 (Nov. 15, 1964). Names: Zhou Enlai, Mather.'
        tags: [name:zhou-enlai, polity:prc, polity:uk]
  - add:
      entry:
        id: cal.1964-11-16.china-leadership-2
        when: 'Nov. 16'
        date: '1964-11-16'
        thread: china-leadership
        c: 'Zhou issues the Central Committee and State Council notice on memorial buildings: none for individuals, monuments, halls, pavilions, statues, to be built or enlarged without Central Committee approval, no land granted for martyrs'' cemeteries.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 688 (Nov. 16, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-16.china-leadership-3
        when: 'Nov. 16'
        date: '1964-11-16'
        thread: china-leadership
        also: [korea, soviet-union]
        c: 'Zhou, with Deng Xiaoping and Peng Zhen, talks with Kim Il Sung, arrived that day, and tells him of the new Soviet leaders.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 688 (Nov. 16, 1964). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping, Peng Zhen, Kim Il Sung.'
        tags: [name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:kim-il-sung, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-11-17.china-leadership
        when: 'Nov. 17'
        date: '1964-11-17'
        thread: china-leadership
        also: [trade]
        c: 'Zhou approves the Ministry of Foreign Trade''s medium-term agreement with France to import 600,000 to a million tons of French-grown wheat a year (not re-exported), in exchange for rice exports.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 688 (Nov. 17, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-19.china-leadership
        when: 'Nov. 19'
        date: '1964-11-19'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou goes to Liu Shaoqi''s to settle the *Red Flag* editorial due out, "How Khrushchev Fell" (Nov. 21): his basic fault was to violate the laws of social history Marxism-Leninism shows, and the revolutionary will of the Soviet and the world''s peoples.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 688 (Nov. 19, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-20.china-leadership
        when: 'Nov. 20'
        date: '1964-11-20'
        thread: china-leadership
        c: 'Zhou calls a forum of heads of the State Council''s agriculture and forestry office and the regional bureaus on the socialist education movement, rural work and investigation. Speaks: agrees to "class struggle as the key link, production as the center" for rural work generally; distribution is the central work now that the autumn harvest is in north of the Yangtze, first for production and the next year; do winter work well. Too many layers breed cadres and bureaucracy; bureaus to catch problems and ask below; divide in two: trust and doubt, doubt means investigating, not resting on reports from below. Old habits are deep, sweep them without stop.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 688–89 (Nov. 20, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-22.china-leadership
        when: 'Nov. 22'
        date: '1964-11-22'
        thread: china-leadership
        c: 'Zhou approves 80 million yuan added capital construction in the textile industry, as agreed by the Planning Commission and the Finance and Trade Office, and its first allocation; the Planning Commission to have the Textile Ministry fight a battle of annihilation, saving costs, materials, labor; the Economic Commission with the Science Commission to press renewal of equipment, technical reform, import of sample machines, not only vinylon but dyeing and printing; so that next year''s 395 million yuan does far better than expected.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 689 (Nov. 22, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-23.china-leadership
        when: 'Nov. 23'
        date: '1964-11-23'
        thread: china-leadership
        c: 'Zhou hears Li Fuchun and Bo Yibo on Southwest construction.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 689 (Nov. 23, 1964). Made public: 1997. Names: Zhou Enlai, Li Fuchun, Bo Yibo.'
        tags: [name:zhou-enlai, name:li-fuchun, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-24.china-leadership
        when: 'Nov. 24'
        date: '1964-11-24'
        thread: china-leadership
        c: 'Zhou calls Qian Zhengying on water conservancy. Same day calls Chen Yi and Ji Pengfei on foreign affairs.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 689 (Nov. 24, 1964). Made public: 1997. Names: Zhou Enlai, Qian Zhengying, Chen Yi, Ji Pengfei.'
        tags: [name:zhou-enlai, name:chen-yi, name:ji-pengfei, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-24.china-leadership-2
        when: 'Nov. 24'
        date: '1964-11-24'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou wires the international conference supporting the Vietnamese people against American aggression: a great people''s sacred struggle for peace, unity, independence, democracy and strength can be stopped by no force; the DRV and China are lips-and-teeth brother neighbors, China''s people will not sit by while a neighbor is invaded. "It is the people who decide the world''s fate."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 689 (Nov. 24, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:drv]
  - add:
      entry:
        id: cal.1964-11-25.china-leadership-2
        when: 'Nov. 25'
        date: '1964-11-25'
        thread: china-leadership
        also: [japan]
        c: 'Zhou watches the Japanese women''s volleyball team train at the Beijing gymnasium. To the Chinese women''s volleyball leaders: the Japanese coach leads by example, practicing with the players; train as for war, from real need, hard and strict, the spirit of Mao''s "On Practice"; less empty talk, more drill; learn Daimatsu''s strictness. To Daimatsu: China''s young need more education in hard struggle and overcoming difficulty; a nation that seeks pleasure does not rise; a new world is built by diligence; playing volleyball too is labor.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 689–90 (Nov. 25, 1964). Names: Zhou Enlai, Daimatsu Hirobumi.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-11-25.china-leadership-3
        when: 'Nov. 25'
        date: '1964-11-25'
        thread: china-leadership
        also: [japan]
        c: 'Zhou receives the Japanese delegation under Kuroda Hisao escorting the remains of Chinese martyrs, workers and peasants seized by Japanese militarism as forced laborers and captured anti-Japanese fighters.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 690 (Nov. 25, 1964). Names: Zhou Enlai, Kuroda Hisao.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1964-11-26.china-leadership-2
        when: 'Nov. 26'
        date: '1964-11-26'
        thread: china-leadership
        also: [japan]
        c: 'Zhou calls responsible officials on rural work and on Japan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 690 (Nov. 26, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-01.china-leadership
        when: 'Dec. 1'
        date: '1964-12-01'
        thread: china-leadership
        c: 'Zhou goes to Liu Shaoqi''s for a meeting; hears Li Fuchun on reorganizing the State Planning Commission, drawing up its working rules and making long-term plans. Also calls people on Japan work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 690 (Dec. 1, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Li Fuchun.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:li-fuchun, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-02.china-leadership
        when: 'Dec. 2'
        date: '1964-12-02'
        thread: china-leadership
        c: 'Zhou sends Chen Guodong of the Grain Ministry Sichuan''s inspection report on grain stocks: in the Ministry''s name tell the provinces'' grain bureaus to inspect key points and follow Sichuan''s five measures; even provinces doing well must not relax, with regular keeping, cleaning, pest control, airing and checking.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 690 (Dec. 2, 1964). Made public: 1997. Names: Zhou Enlai, Chen Guodong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-04.china-leadership
        when: 'Dec. 4'
        date: '1964-12-04'
        thread: china-leadership
        c: 'Zhou revises "On the procedure for drawing up the long-term plan": after "study" in the line on food, clothing and use as the balancing of commodity grain adds "the development of agriculture"; after state support "chemical fertilizer, pesticide, farm machinery" adds "and large water works".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 690–91 (Dec. 4, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-06.china-leadership
        when: 'Dec. 6–18'
        date: '1964-12-06'
        thread: china-leadership
        c: 'Zhou attends the State Council''s Yellow River control conference on Dec. 6, 7, 12–14 and 18. At the close Dec. 18: resolve to rebuild the Sanmenxia works and begin, or silt is harder; too soon to say whether the plans were wholly right or wrong; all views may be stated; old China could not tame the river, we shall find its laws step by step. Whatever the view, none to be self-satisfied; study more data, go to the site. Rebuild on no great scale; the aim is a river that serves production, water and soil together, up, middle and down stream. Divide the work; keep the whole in view. Experts to find contradictions and resolve them; heat of mind sees one side; the lessons of these years must be taken to heart.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 691 (Dec. 6–18, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-10.china-leadership
        when: 'Dec. 10'
        date: '1964-12-10'
        thread: china-leadership
        c: 'Zhou reviews the draft note on the Central Committee and State Council forwarding the summary of the forum on general rural work. Rural work at large decides the present situation; this winter and next spring socialist education, production, purchase and distribution must be taken in hand; some cadres at points and some running the general work is a long-term arrangement; those on general work must take responsibility and be thorough. The summary goes out that day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 691–92 (Dec. 10, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-11.china-leadership
        when: 'Dec. 11'
        date: '1964-12-11'
        thread: china-leadership
        c: 'Zhou writes Peng Zhen on the new list of vice-premiers of the State Council, order proposed: Lin Biao, Chen Yun, Deng Xiaoping, He Long, Chen Yi, Ke Qingshi, Ulanhu, Li Fuchun, Li Xiannian, Tan Zhenlin, Nie Rongzhen, Bo Yibo, Lu Dingyi, Luo Ruiqing, Song Renqiong, Xie Fuzhi.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 692 (Dec. 11, 1964). Made public: 1997. Names: Zhou Enlai, Peng Zhen, Lin Biao, Chen Yun, Deng Xiaoping, He Long, Chen Yi, Ke Qingshi, Ulanhu, Li Fuchun, Li Xiannian, Tan Zhenlin, Nie Rongzhen, Bo Yibo, Lu Dingyi, Luo Ruiqing, Song Renqiong, Xie Fuzhi.'
        tags: [name:zhou-enlai, name:peng-zhen, name:lin-biao, name:chen-yun, name:deng-xiaoping, name:he-long, name:chen-yi, name:ke-qingshi, name:li-fuchun, name:li-xiannian, name:tan-zhenlin, name:nie-rongzhen, name:bo-yibo, name:lu-dingyi, name:luo-ruiqing, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-12.china-leadership
        when: 'Dec. 12'
        date: '1964-12-12'
        thread: china-leadership
        also: [africa]
        c: 'Zhou calls responsible officials on aid to Africa.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 692 (Dec. 12, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-15.china-leadership-2
        when: 'Dec. 15'
        date: '1964-12-15'
        thread: china-leadership
        c: 'Zhou attends the Politburo meeting, which discusses his draft Government Work Report for the Third National People''s Congress, first session. Explains the report in detail and presents the paragraph Mao added to it. Announces the abolition of the State Council''s Premier''s Office and a cut in secretaries. (Mao''s paragraph stresses Marxist theory of knowledge and dialectics: history moves ever from necessity to freedom and never ends; mankind must keep summing up experience, discovering, inventing, creating, advancing; talk of halt, pessimism, inaction and complacency is wrong.)'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 692 (Dec. 15, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-26.china-leadership
        when: 'Dec. 26–28'
        date: '1964-12-26'
        thread: china-leadership
        c: 'Zhou, with Liu Shaoqi and others, calls members of the Central Work Conference''s Northeast and Southwest groups, Dec. 26 and 28. On rural socialist education: the source of wisdom is the masses, we only process it; hold to truth, keep practicing and correcting errors.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 692–93 (Dec. 26–28, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-01.china-leadership
        when: 'Jan. 1'
        date: '1965-01-01'
        thread: china-leadership
        c: 'Zhou, with Liu Shaoqi and others, calls the North China group of the Central Work Conference. When Liu speaks of digging out the hidden counter-revolutionaries missed in the "four cleanups": those who hid before land reform and were missed are to be dealt with by law, or controlled where they live, or put to labor reform, local control where possible; a backstage boss is different, treat the two apart. Support and help the Dazhai banner and Chen Yonggui''s selflessness. This year''s North China weather is bad for farming; prepare early.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 693 (Jan. 1, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-16.china-leadership
        when: 'Dec. 16'
        date: '1964-12-16'
        thread: china-leadership
        also: [china, vietnam]
        c: 'Zhou receives Edgar Snow. China''s adjustment of these years aimed not only at quantity but variety and quality, balancing output, variety and quality of industrial goods; the task is basically done, the economy turned and will grow anew; still backward by need, and a modern state will take long. China is very complex: "after fifteen years of economic construction I as premier have not learned it." The laws of growth are complex; some known, more not; some right, some wrong in fifteen years; one needs both kinds of experience. "Catch up with Britain" is no longer a central question; chasing output in a few products does not modernize industry, the level of industry and technique matters. China–U.S. relations: first, agreement on peaceful coexistence by the five principles; second, all U.S. armed forces out of Taiwan and the Strait; then the rest is easier. On Southeast Asia: it is tied to all Indochina; if the U.S. misbehaves there China cannot stand by.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 693–94 (Dec. 16, 1964). Made public: 1997. Names: Zhou Enlai, Snow.'
        tags: [name:zhou-enlai, polity:prc, polity:us, vis:only:prc+us]
  - add:
      entry:
        id: cal.1964-12-16.china-leadership-2
        when: 'Dec. 16'
        date: '1964-12-16'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives Amar Ouzegane, special envoy of Algeria''s president. Glad Ben Bella will visit China, Korea and Vietnam before the second Asian-African conference, to discuss anti-imperialist and anti-colonial matters beforehand; but Ben Bella is wrong to put the conference off on account of the visit.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 694 (Dec. 16, 1964). Made public: 1997. Names: Zhou Enlai, Amar Ouzegane.'
        tags: [name:zhou-enlai, polity:prc, polity:algeria, vis:only:prc+algeria]
  - add:
      entry:
        id: cal.1964-12-17.china-leadership
        when: 'Dec. 17'
        date: '1964-12-17'
        thread: china-leadership
        c: 'Zhou chairs the 151st plenary meeting of the State Council. Explains the draft Government Work Report for the National People''s Congress; the meeting in the main adopts it. It also decides to remove the Dalai Lama, Tenzin Gyatso, from the chairmanship and membership of the Tibet Autonomous Region Preparatory Committee.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 694 (Dec. 17, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-17.china-leadership-2
        when: 'Dec. 17'
        date: '1964-12-17'
        thread: china-leadership
        c: 'Zhou calls the heads of the State Council''s eight offices to settle the list of State Council members.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 694 (Dec. 17, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-18.china-leadership
        when: 'Dec. 18'
        date: '1964-12-18'
        thread: china-leadership
        c: 'Zhou attends the 20th Supreme State Conference and explains parts of the Government Work Report: on construction, the relation of farming, light and heavy industry, self-reliance and international cooperation, frugality as basic line; on revolution, class and class struggle, revolutionizing cadres, learning from the army. The conference approves the report in principle.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 694 (Dec. 18, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-18.china-leadership-2
        when: 'Dec. 18'
        date: '1964-12-18'
        thread: china-leadership
        c: 'Zhou attends the meeting for the fifteenth anniversary of the Chinese People''s Institute of Foreign Affairs and is elected honorary president.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 694 (Dec. 18, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-12-19.china-leadership
        when: 'Dec. 19'
        date: '1964-12-19'
        thread: china-leadership
        c: 'Zhou chairs the 46th meeting of the Standing Committee of the Third National Committee of the People''s Political Consultative Conference; explains the lists of the Fourth Committee''s presidium and secretary-general, the agenda and method. Proposes adding Deng Zihui for the Communist Party and Wei Guoqing for the minorities to the Fourth National Committee; hopes for "revolutionary organs and cadres".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 695 (Dec. 19, 1964). Made public: 1997. Names: Zhou Enlai, Deng Zihui, Wei Guoqing.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-19.china-leadership-2
        when: 'Dec. 19'
        date: '1964-12-19'
        thread: china-leadership
        also: [middle-east, africa]
        c: 'Zhou receives Aziz Sidqi, UAR deputy prime minister. China''s aid is to build the national economy; its experts abroad are paid by local rates for their rank, no privileges, bound by the host country''s law, no interference, employees of the host who teach local men fully, then leave. On China''s experience: the order of farm, light, heavy industry, not neglecting any but with farming the main thing, then light, heavy where there are materials. Socialist states have built well but share one weakness, farming not well done.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 695 (Dec. 19, 1964). Names: Zhou Enlai, Aziz Sidqi.'
        tags: [name:zhou-enlai, polity:prc, polity:uar]
  - add:
      entry:
        id: cal.1964-12-20.china-leadership-2
        when: 'Dec. 20'
        date: '1964-12-20'
        thread: china-leadership
        c: 'Zhou attends the opening of the first session of the Fourth National Committee of the CPPCC and presides over the opening session; Dec. 20–Jan. 5, 1965.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 695 (Dec. 20, 1964). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1964-12-21.china-leadership
        when: 'Dec. 21–22'
        date: '1964-12-21'
        thread: china-leadership
        c: 'Zhou, at the first session of the Third National People''s Congress (Dec. 21–Jan. 4), gives the Government Work Report on two successive days. Three parts. First, the economy''s gains and tasks: the readjustment basically done, farm and industry on the rise, the economy turned and about to enter a new period; in 1965 finish the unfinished readjustment and prepare the Third Five-Year Plan from 1966; the main task is to build in a not too long period a socialist power with modern agriculture, industry, defense, science and technology, catching up with and passing the world''s best; two steps from the Third Plan: first a whole independent industrial and economic system, then modernization of all four to put China in front. "We cannot take the old path of other countries'' technical growth, crawling after them; we must break rules and use advanced technique." Second, socialist revolution and the people''s democratic united front: classes and class struggle remain; the socialist education movement in town and country is the chief content of the revolution now; revolution on the ideological and cultural front is one of its great sides; offices and cadres to be revolutionized and learn from the army; against the "five too-manys": offices, staff, forms, papers, meetings. Third, the international situation and foreign work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 695–96 (Dec. 21–22, 1964). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, polity:prc]
  - add:
      entry:
        id: cal.1964-12-21.china-leadership-2
        when: 'Dec. 21–Jan. 4'
        date: '1964-12-21'
        thread: china-leadership
        c: 'Zhou, at the Third National People''s Congress, on a motion about silting and a rising riverbed in Xingguo, Jiangxi, tells Jiangxi''s provincial leaders: the provincial committee is to take it up and solve it. Xingguo''s people gave much in the Second Revolutionary Civil War. Dig sand and build dams, and fundamentally stop wild cutting of forests upstream, plant trees, hold soil and water. Afforestation is a hundred-year plan; the Yellow River basin and Jiangxi''s hills can be planted; not to cut without planting, "eating the ancestors'' rice", making sin for the grandchildren.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 696–97 (Dec. 21–Jan. 4, 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-23.china-leadership
        when: 'Dec. 23'
        date: '1964-12-23'
        thread: china-leadership
        c: 'Zhou drafts for the Central Committee and State Council a notice on thoroughly cutting rural forms, on Liu Shaoqi''s view, and writes Liu: forms are many and confused because offices and leaders do not go among the masses and investigate and rely on reports and tables; and statistical work breaks from practice, production and the masses and chases a "complete statistics" regardless of rural needs. To stop it: forms from communes, brigades and teams to be only the six issued by the State Statistical Bureau for the time; the Bureau to study cutting forms in city basic units and propose reform to the Center and State Council.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 697 (Dec. 23, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-24.china-leadership
        when: 'Dec. 24'
        date: '1964-12-24'
        thread: china-leadership
        c: 'Zhou agrees to Luo Ruiqing''s proposal to forward materials on Hebei''s way of building local arms plants; reviews the Central Committee note drafted by the offices: Hebei''s way is "revolutionary, faster, better, more economical, mainly self-reliant and not reaching to the Center", worth other places'' study and imitation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 697 (Dec. 24, 1964). Made public: 1997. Names: Zhou Enlai, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-29.china-leadership
        when: 'Dec. 29'
        date: '1964-12-29'
        thread: china-leadership
        c: 'Zhou receives air force men who shot down a U.S.-made Nationalist plane.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 697 (Dec. 29, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-12-30.china-leadership
        when: 'Dec. 30'
        date: '1964-12-30'
        thread: china-leadership
        c: 'Zhou consults on the list of leaders for the Third National People''s Congress and the Fourth CPPCC. With Peng Zhen sends the list to Mao, Liu, Zhu and Deng: agreed at the two recent meetings of parties and departments, and said on the spot that others may be added at the Supreme State Conference; thinks too many Communists among the CPPCC standing committee not good.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 697–98 (Dec. 30, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Deng Xiaoping, Peng Zhen.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:deng-xiaoping, name:peng-zhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-30.china-leadership-2
        when: 'Dec. 30'
        date: '1964-12-30'
        thread: china-leadership
        c: 'Zhou attends the Supreme State Conference Liu Shaoqi calls, on the Government Work Report and the list.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 698 (Dec. 30, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-31.china-leadership
        when: 'Dec. 31'
        date: '1964-12-31'
        thread: china-leadership
        c: 'Zhou, at the second (enlarged) meeting of the presidium of the CPPCC''s first session, explains changes in the list of leaders. Life is limited, remolding unlimited; this is dialectical; after joining the Party one keeps remolding; those like us all must; no standing still. Urges reform of work methods, and dialectical materialism to avoid one-sidedness, metaphysics and empiricism.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 698 (Dec. 31, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-01-01.china-leadership-2
        when: 'Jan. 1'
        date: '1965-01-01'
        thread: china-leadership
        also: [china]
        c: 'Zhou receives the National People''s Congress deputies and CPPCC members from Hong Kong and Macao. We must act on principle and not trade principle: had China traded it, it would have had relations with the U.S. fifteen years ago and billions in aid; if it gave up Taiwan and accepted "two Chinas" it would enter the United Nations at once. Taiwan is Chinese territory, U.S. forces must leave, no "two Chinas".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 699 (Jan. 1, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01.china-leadership-2
        when: 'Jan.'
        date: '1965-01'
        thread: china-leadership
        c: 'Zhou, early in the year, learns Li Siguang has an arterial tumor; sends Deng Yingchao to visit him; frees him of all duties meeting foreign guests and attending banquets; advises him to look after his health and give himself to his research in geomechanics.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 699 (Jan. 1965). Made public: 1997. Check: the day. Names: Zhou Enlai, Li Siguang, Deng Yingchao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-04.china-leadership
        when: 'Jan. 4'
        date: '1965-01-04'
        thread: china-leadership
        c: 'The Third National People''s Congress closes its first session: approves the Government Work Report, the main targets of the 1965 plan and the preliminary budget; elects Liu Shaoqi President of the Republic and Zhu De chairman of the Standing Committee; Zhou continues as Premier.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 696 (Jan. 4, 1965). Names: Zhou Enlai, Liu Shaoqi, Zhu De.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:zhu-de, polity:prc]
  - add:
      entry:
        id: cal.1965-01-05.china-leadership-2
        when: 'Jan. 5'
        date: '1965-01-05'
        thread: china-leadership
        c: 'Zhou is elected chairman of the Fourth National Committee of the CPPCC, with Mao honorary chairman. At the presidium''s fourth (enlarged) meeting the same day: the new standing committee to change the body''s face and revolutionize its offices, a place to learn from, study with, help and urge one another, not to pass time and flatter.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 699 (Jan. 5, 1965). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1965-01-05.china-leadership-3
        when: 'Jan. 5'
        date: '1965-01-05'
        thread: china-leadership
        c: 'Zhou, at the closing session of the CPPCC''s first session: political reports and government papers must move with events; what was right then must go on to new tasks and explanations; no words or documents stay fixed. Our democracy is a developing, people''s, led democracy; but under Mao''s six criteria all opinions are allowed; hear differing views patiently, even wrong ones, which set up the opposite. Hopes the same revolutionary, democratic, united spirit continues after the delegates return.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 699–700 (Jan. 5, 1965). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc]
  - add:
      entry:
        id: cal.1965-01-07.china-leadership
        when: 'Jan. 7'
        date: '1965-01-07'
        thread: china-leadership
        c: 'Zhou agrees with Luo Ruiqing, Yu Qiuli and Bo Yibo to put development of the Panzhihua iron mine first. On the Planning Commission''s note on western Hubei iron ore: the decision to open Panzhihua was long made, the error was delaying the campaign; the first campaign of the Southwest third front has begun and there is to be no wavering; the western Hubei ore, with western Henan, western Hunan and Wuhan industry, is to form another strategic unit, surveyed and laid out on its own and not set against Panzhihua. Proposes Wang Renzhong in command, with one deputy from the planning and economic commissions.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 700 (Jan. 7, 1965). Made public: 1997. Names: Zhou Enlai, Luo Ruiqing, Yu Qiuli, Bo Yibo, Wang Renzhong.'
        tags: [name:zhou-enlai, name:luo-ruiqing, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-08.china-leadership
        when: 'Jan. 8'
        date: '1965-01-08'
        thread: china-leadership
        c: 'Zhou calls the directors'' group of *The East Is Red* on remaking it and filming it. The guiding line is to study and spread Mao Zedong Thought; on screen a clearer thread through Mao''s thought, faults of the stage made good; an epic written as an epic, not a story script; revolutionary realism joined with revolutionary romanticism; "mark the new of socialism, set up the difference of the proletariat"; the mass line.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 700–01 (Jan. 8, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-09.china-leadership-2
        when: 'Jan. 9'
        date: '1965-01-09'
        thread: china-leadership
        c: 'Zhou, with He Long, Ye Jianying and Luo Ruiqing, receives the air force men who shot down two U.S. pilotless high-altitude reconnaissance planes in turn over Central-South China. Urges them on, against complacency and pride; each fight and its summing-up raise skill.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 701 (Jan. 9, 1965). Names: Zhou Enlai, Ye Jianying, He Long, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:ye-jianying, name:he-long, name:luo-ruiqing, polity:prc]
  - add:
      entry:
        id: cal.1965-01-11.china-leadership
        when: 'Jan. 11'
        date: '1965-01-11'
        thread: china-leadership
        c: 'Zhou calls people on the Afro-Asian economic seminar and on revolutionizing offices.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 701 (Jan. 11, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-12.china-leadership
        when: 'Jan. 12'
        date: '1965-01-12'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou, with Liu Shaoqi, receives an Indonesian friendship delegation; congratulates on the direct China–Indonesia air route and thanks Indonesia for retrieving, ten years ago, the bodies from the sabotaged *Kashmir Princess*.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 701 (Jan. 12, 1965). Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-01-13.china-leadership
        when: 'Jan. 13–16'
        date: '1965-01-13'
        thread: china-leadership
        c: 'Zhou calls He Long, Chen Yi, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Yu Qiuli and others to a forum on the revolution in planning, Jan. 13, 15 and 16.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 701 (Jan. 13–16, 1965). Made public: 1997. Names: Zhou Enlai, He Long, Chen Yi, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Yu Qiuli.'
        tags: [name:zhou-enlai, name:he-long, name:chen-yi, name:li-fuchun, name:li-xiannian, name:tan-zhenlin, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-14.china-leadership-2
        when: 'Jan. 14'
        date: '1965-01-14'
        thread: china-leadership
        c: 'Zhou calls on Song Qingling.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 701 (Jan. 14, 1965). Names: Zhou Enlai, Song Qingling.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-01-15.china-leadership
        when: 'Jan. 15'
        date: '1965-01-15'
        thread: china-leadership
        c: 'Zhou calls Zhou Rongxin, Tong Xiaopeng and Xu Ming to carry out the abolition of the Premier''s Office.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 702 (Jan. 15, 1965). Made public: 1997. Names: Zhou Enlai, Zhou Rongxin, Tong Xiaopeng, Xu Ming.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-15.china-leadership-2
        when: 'Jan. 15'
        date: '1965-01-15'
        thread: china-leadership
        c: 'Zhou tells the Foreign Ministry party committee to tell its regional departments to work more with the embassies in Beijing: it trains young cadres, in politics, business and languages, and brings much information.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 702 (Jan. 15, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-17.china-leadership
        when: 'Jan. 17'
        date: '1965-01-17'
        thread: china-leadership
        c: 'Zhou calls the heads of the North China Bureau on building Dazhai.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 702 (Jan. 17, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-17.china-leadership-2
        when: 'Jan. 17'
        date: '1965-01-17'
        thread: china-leadership
        c: 'Zhou, to people in the arts: in choosing actors, heed the heart as well as the looks.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 702 (Jan. 17, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-01-18.china-leadership
        when: 'Jan. 18'
        date: '1965-01-18'
        thread: china-leadership
        c: 'Zhou, on the Shaanxi Party committee''s request on grain: this spring about 200 million jin must be resold in Guanzhong to lift the farmers'' zeal for spring planting, summer wheat and a double autumn crop of cotton and grain. On Jan. 14, on Shaanxi''s heavy purchase quota: do grain work well and the masses will see the good situation better.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 702 (Jan. 18, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-19.china-leadership
        when: 'Jan. 19'
        date: '1965-01-19'
        thread: china-leadership
        c: 'Zhou sends Yu Qiuli''s draft "Some Preliminary Ideas on Discussing the Revolution in Planning" to Mao, the Standing Committee and the Secretariat, with a note: this week Mao to fix a time to call Li Fuchun, Yu, Bo, Chen Boda and Li Xiannian (Luo Ruiqing away) to the Standing Committee to hear Yu in person and instruct. The draft: Mao Zedong Thought has not shown in planning; the disease is metaphysics, planning without dialectics, lifeless, trivial, timid, with no strategic view; Yu to form a planning staff of some twenty, free of the Commission''s routine, in the State Council, for long-term planning.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 702–03 (Jan. 19, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Yu Qiuli, Chen Boda, Li Fuchun, Li Xiannian, Bo Yibo, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:mao-zedong, name:chen-boda, name:li-fuchun, name:li-xiannian, name:bo-yibo, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-19.china-leadership-2
        when: 'Jan. 19'
        date: '1965-01-19'
        thread: china-leadership
        c: 'Zhou, on the Panzhihua work report: sends points to the offices to settle; orders a special district government at Panzhihua on the Daqing pattern, government and enterprise one, a Party committee, double leadership by the Metallurgy Ministry''s committee mainly and Sichuan''s second.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 703 (Jan. 19, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-19.china-leadership-3
        when: 'Jan. 19'
        date: '1965-01-19'
        thread: china-leadership
        c: 'Zhou, after the play *Sisters of the Mountain Village*, asks actors to go to the villages, mines and factories, among workers, peasants and soldiers, by plan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 703 (Jan. 19, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-01-20.china-leadership
        when: 'Jan. 20'
        date: '1965-01-20'
        thread: china-leadership
        c: 'Zhou writes Mao again on the last draft of Yu Qiuli''s paper on the revolution in planning: many ideas are not in it, Yu''s own report will show his resolve; asked several times for new men for the planning staff, Yu named Li Renjun and a few others but still wants some from the Commission.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 703 (Jan. 20, 1965). Made public: 1997. See [[cal.1965-01-19.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Yu Qiuli, Li Renjun.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-22.china-leadership
        when: 'Jan. 22'
        date: '1965-01-22'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou receives the Vietnamese military delegation; reviews the experience of the Chinese war of liberation. In Vietnam, when the enemy sweeps, keep destroying his main forces, weaken him, raise one''s own fighting strength; try this year to smash most of the strategic hamlets; with the enemy''s political bankruptcy as well, victory may come sooner than expected.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 703 (Jan. 22, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-01-23.china-leadership-2
        when: 'Jan. 23'
        date: '1965-01-23'
        thread: china-leadership
        c: 'Zhou calls Zhou Yang, Liu Baiyu, Li Qi (vice-ministers of culture) and Lin Mohan (deputy head of the Propaganda Department) on the Ministry of Culture''s work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 704 (Jan. 23, 1965). Made public: 1997. Names: Zhou Enlai, Zhou Yang, Liu Baiyu, Li Qi, Lin Mohan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-23.china-leadership-3
        when: 'Jan. 23'
        date: '1965-01-23'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou receives Pakistani ambassador Raza in the airport VIP room to talk of President Ayub''s visit to China.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 704 (Jan. 23, 1965). Made public: 1997. Names: Zhou Enlai, Raza.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1965-01-24.china-leadership
        when: 'Jan. 24–27'
        date: '1965-01-24'
        thread: china-leadership
        also: [indonesia, china]
        c: 'Zhou has three talks with Subandrio, Jan. 24 to 27. Jan. 24, on the U.N.''s mistake and its state: China is not interested; it will not enter while Chiang''s gang stays; the U.N. must correct its mistake, cancel the resolution branding China an aggressor and pass one naming the U.S. the aggressor. Jan. 25: the U.S. looks strong but is a paper tiger, strategically, though each fight and each tactic needs weight; China''s calm rests on the militia organized by the millions, the people kept alert; self-reliance is no adventure but the surest way to a strong state, and does not exclude cooperation on equality and mutual benefit.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 704 (Jan. 24–27, 1965). Made public: 1997. Names: Zhou Enlai, Subandrio.'
        tags: [name:zhou-enlai, name:subandrio, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1965-01-26.china-leadership
        when: 'Jan. 26'
        date: '1965-01-26'
        thread: china-leadership
        c: 'Zhou calls Liu Baiyu and others on 1965 film production.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 704 (Jan. 26, 1965). Made public: 1997. Names: Zhou Enlai, Liu Baiyu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-27.china-leadership
        when: 'Jan. 27'
        date: '1965-01-27'
        thread: china-leadership
        c: 'Zhou calls the heads of the Oriental Song and Dance Ensemble and of the arts troupe going to Western Europe. Troupes abroad must understand politics; healthy programs of the socialist age, with its time, people and revolution; no following capitalist ways of life or pandering to Western vulgarity; they should learn foreign languages.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 704 (Jan. 27, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-29.china-leadership-2
        when: 'Jan. 29'
        date: '1965-01-29'
        thread: china-leadership
        c: 'Zhou receives the international lawyers who worked to free the nine Chinese persecuted by Brazil: Nagano Kunisuke, head of the Japan Association of International Lawyers and chief counsel, Suprapto of Indonesia, Fakhruddin Ibrahim of Pakistan and others.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 704–05 (Jan. 29, 1965). Names: Zhou Enlai, Nagano Kunisuke.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-01-30.china-leadership
        when: 'Jan. 30'
        date: '1965-01-30'
        thread: china-leadership
        c: 'Zhou calls people on the work of the State Planning Commission and the "small planning commission".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 703 (Jan. 30, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-31.china-leadership
        when: 'Jan. 31'
        date: '1965-01-31'
        thread: china-leadership
        c: 'Zhou agrees to the Planning and Economic Commissions'' plan to move in 1965 natural-science institutes, survey and design units, higher schools and culture-and-education plants by stages to the third line. Adds: some to the second line; adjustments may come in carrying it out and negotiating; Sichuan takes over half, with nine places in Chengdu and Chongqing, too concentrated.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 705 (Jan. 31, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-01.china-leadership
        when: 'Feb. 1'
        date: '1965-02-01'
        thread: china-leadership
        c: 'Zhou calls Zhao Erlu and others on third-front building.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 705 (Feb. 1, 1965). Made public: 1997. Names: Zhou Enlai, Zhao Erlu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-01.china-leadership-2
        when: 'Feb. 1'
        date: '1965-02-01'
        thread: china-leadership
        c: 'Zhou, on Yu Qiuli''s report on the preliminary decisions for drawing up the long-term plan: "propose to agree; send to Mao for his instruction, whether to answer Qiuli, and report to the Standing Committee and Secretariat." Yu''s report: pool wisdom, decide well; the plan to have ambition and scientific grounds.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 705 (Feb. 1, 1965). Made public: 1997. Names: Zhou Enlai, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-01.china-leadership-3
        when: 'Feb. 1'
        date: '1965-02-01'
        thread: china-leadership
        c: 'Zhou calls responsible officials on foreign affairs work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 705 (Feb. 1, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-02.china-leadership
        when: 'Feb. 2'
        date: '1965-02-02'
        thread: china-leadership
        c: 'Zhou sends Mao the defense industry office''s map of first, second and third lines, proposing Mao call He Long, Luo Ruiqing and Zhao Erlu to the enlarged Standing Committee for a report on the siting and layout of defense industry.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 705 (Feb. 2, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, He Long, Luo Ruiqing, Zhao Erlu.'
        tags: [name:zhou-enlai, name:mao-zedong, name:he-long, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-02.china-leadership-3
        when: 'Feb. 2'
        date: '1965-02-02'
        thread: china-leadership
        c: 'Zhou calls his office staff, announces the office dissolved, and arranges the work after.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 705 (Feb. 2, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-03.china-leadership-2
        when: 'Feb. 3–28'
        date: '1965-02-03'
        thread: china-leadership
        c: 'Zhou meets many times, Feb. 3–28, at Mao''s or Liu Shaoqi''s, on third-front building and the long-term plan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 705 (Feb. 3–28, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-03.china-leadership-3
        when: 'Feb. 3–4'
        date: '1965-02-03'
        thread: china-leadership
        also: [testing]
        c: 'Zhou chairs the tenth meeting of the Special Commission, on joining the two bombs, unified command, cooperation of all sides, and enlarging the commission. Guide by Mao Zedong Thought, unified leadership, great cooperation, "one pole to the end", the three-way union of leaders, masses and experts. The fifteen-man commission to enlarge, with those of the Seventh, Fourth and Fifth Ministries; adds Lü Dong (for Wang Heshou), Yu Qiuli, Yuan Baohua, Wang Zheng, Qiu Chuangcheng, Fang Qiang, Wang Bingzhang.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 705–06 (Feb. 3–4, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-04.china-leadership
        when: 'Feb. 4'
        date: '1965-02-04'
        thread: china-leadership
        c: 'Zhou twice calls responsible officials on the nine Chinese persecuted by Brazil.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 706 (Feb. 4, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-04.china-leadership-2
        when: 'Feb. 4'
        date: '1965-02-04'
        thread: china-leadership
        also: [cuba]
        c: 'Zhou, with Liu Shaoqi, Deng Xiaoping and others, meets the delegation of the Cuban United Party of the Socialist Revolution under Ernesto Guevara, Secretariat member.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 706 (Feb. 4, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Guevara.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:guevara-ernesto, polity:prc, polity:cuba, vis:only:prc+cuba]
  - add:
      entry:
        id: cal.1965-02-05.china-leadership
        when: 'Feb. 5–6'
        date: '1965-02-05'
        thread: china-leadership
        also: [soviet-union, vietnam-hanoi, china]
        c: 'Zhou has four talks, Feb. 5 and 6, with Kosygin, chairman of the Soviet Council of Ministers, passing through Beijing to Vietnam. Both sides hold that Sino-Soviet relations should develop. Zhou''s six proposals: for the fifteenth anniversary of the Sino-Soviet treaty, to print each other''s messages and speeches in the papers, showing one attitude; develop trade, long-term cooperation on some items; finish earlier projects left unfinished; carry out the yearly cultural plan better; China to send students and take Soviet ones in turn; carry out the travel agreement. Kosygin agrees to all six.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 706 (Feb. 5–6, 1965). Made public: 1997. Names: Zhou Enlai, Kosygin.'
        tags: [name:zhou-enlai, name:kosygin-aleksei, polity:prc, polity:ussr, vis:only:prc+ussr]
  - add:
      entry:
        id: cal.1965-02-08.china-leadership
        when: 'Feb. 8'
        date: '1965-02-08'
        thread: china-leadership
        c: 'Zhou agrees in principle to the Economic Commission''s list of trusts for 1965: besides the twelve approved by the Center, four more on trial; gold and electrical industry companies to begin forming now; petroleum, timber processing and instruments need talks with the offices concerned first; regional companies for steel (Beijing, Tianjin, Tangshan or all Hebei) to be considered. Asks the Commission to choose companies of different conditions to send summaries of first experience.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 706–07 (Feb. 8, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-08.china-leadership-2
        when: 'Feb. 8'
        date: '1965-02-08'
        thread: china-leadership
        also: [cuba]
        c: 'Zhou, in talks with the Cuban delegation under Guevara: Mao raised in 1956 a socialist-construction idea suited to China, though government plans turned only in 1958. In finance China did not copy the Soviet Union but its old base areas: first rely on farm output for the people''s needs, supply assured, and improve living as production grows. Running plants in the government''s name brings too much administrative order and too many layers; China will try the capitalist trust form in socialist fashion, companies led by trade from the top, run by economic methods and accounting, no administrative order. Do not build behind closed doors; learn from all, to take fewer bypaths.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 707 (Feb. 8, 1965). Made public: 1997. Names: Zhou Enlai, Guevara.'
        tags: [name:zhou-enlai, name:guevara-ernesto, polity:prc, polity:cuba, vis:only:prc+cuba]
  - add:
      entry:
        id: cal.1965-02-08.china-leadership-3
        when: 'Feb. 8'
        date: '1965-02-08'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou calls the State Council''s Foreign Affairs Office and others to arrange the capital''s rally and march supporting Vietnam against American aggression. Feb. 10 attends with Mao, Liu, Deng and others the rally and march of 1.5 million.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 707 (Feb. 8, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-09.china-leadership
        when: 'Feb. 9'
        date: '1965-02-09'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives Tanzania''s government trade delegation. China is breaking the limits of protocol, which came from monarchies, from capitalist states grown into imperialist unequal treatment, and from the U.S. since the war, casual at first and now arrogant and overbearing; none is good; China wants a form of truly equal, brotherly, respectful Asian states. Trade must rest on equality, mutual benefit, mutual aid.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 707–08 (Feb. 9, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:tanzania]
  - add:
      entry:
        id: cal.1965-02-09.china-leadership-2
        when: 'Feb. 9'
        date: '1965-02-09'
        thread: china-leadership
        also: [latin-america]
        c: 'Zhou receives Fuad Tom, Argentine lawyer, of the international lawyers'' group that worked to free the nine Chinese held in Brazil.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 705 (Feb. 9, 1965). See [[cal.1965-01-29.china-leadership-2]]. Names: Zhou Enlai, Fuad Tom.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-02-10.china-leadership-2
        when: 'Feb. 10–11'
        date: '1965-02-10'
        thread: china-leadership
        also: [soviet-union, vietnam-hanoi]
        c: 'Zhou studies with Mao the Soviet–Vietnamese joint statement signed by Kosygin and Phạm Văn Đồng. Writes Mao the morning of Feb. 11: China''s reception of the Soviet passage was not low nor cold; at his meeting from nine to half past ten that day he will still touch on the international situation and the revisionist errors of view, arguing not to settle but to set out the ground for later diplomacy, or improving state relations would be hard even if the March 1 meeting is cancelled. Things develop by their own laws, not by men''s wills. One meeting of Mao with the Soviet delegation has its use.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 708 (Feb. 10–11, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Kosygin, Phạm Văn Đồng.'
        tags: [name:zhou-enlai, name:mao-zedong, name:kosygin-aleksei, name:pham-van-dong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-12.china-leadership
        when: 'Feb. 12'
        date: '1965-02-12'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou receives Kuwait''s first friendship delegation to China. Since Bandung China has sought normal relations with Arab states; Kuwait may open talks and issue an establishment communiqué on the basis of recognizing only the People''s Republic as the one legal government of all China; if the time is not ripe, China can wait. (Chinese–Kuwaiti ambassadorial relations began Mar. 22, 1971.)'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 708 (Feb. 12, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:kuwait]
  - add:
      entry:
        id: cal.1965-02-14.china-leadership
        when: 'Feb. 14'
        date: '1965-02-14'
        thread: china-leadership
        also: [europe-and-the-alliance-france, china]
        c: 'Zhou, on de Gaulle''s Feb. 4 call for a five-power Geneva conference of France, China, the U.S., Britain and the Soviet Union to improve the United Nations, has Wu Lengxi and Qiao Guanhua draft "Where Is the U.N. Going?" Revising it, he adds: some Asian and African heads or governments too hold that the U.N. has erred too much and must be reorganized. Mao: "Well written, publish as is."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 709 (Feb. 14, 1965). Made public: 1997. Names: Zhou Enlai, de Gaulle, Wu Lengxi, Qiao Guanhua, Mao Zedong.'
        tags: [name:zhou-enlai, name:de-gaulle-charles, name:qiao-guanhua, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-15.china-leadership
        when: 'Feb. 15'
        date: '1965-02-15'
        thread: china-leadership
        c: 'Zhou, with Chen Yi, chairs the 153rd plenary meeting of the State Council. Every task needs unified leadership and cooperation of all sides; the three-way union and reliance on the masses are the main thing. Foreign affairs, foreign trade, cultural exchange to be done well, not left to a few old men, slower and less bold than the young; ministries to sum up experience, above all in foreign work, to put the foreign staff in order. The meeting adopts the setting up of a Second Ministry of Light Industry, for the NPC Standing Committee to decide.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 709 (Feb. 15, 1965). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-15.china-leadership-2
        when: 'Feb. 15'
        date: '1965-02-15'
        thread: china-leadership
        also: [europe-and-the-alliance-france, china]
        c: 'The *People''s Daily* prints "Where Is the U.N. Going?", answering de Gaulle''s speech of Feb. 4, as revised by Zhou, over "Observer".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 709 (Feb. 15, 1965). See [[cal.1965-02-14.china-leadership]]. Names: Zhou Enlai, de Gaulle.'
        tags: [name:zhou-enlai, name:de-gaulle-charles, polity:prc]
  - add:
      entry:
        id: cal.1965-02-18.china-leadership
        when: 'Feb. 18'
        date: '1965-02-18'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, with Mao and Liu Shaoqi, receives President Nyerere of Tanzania (Feb. 17–21). Feb. 18, talk: agrees to help build a railway from Tanzania to Zambia; once built it is Tanzania''s and Zambia''s, and China will teach the skills.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 709 (Feb. 18, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Mao Zedong, Nyerere.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:mao-zedong, name:nyerere-julius-k, polity:prc, polity:tanzania, vis:only:prc+tanzania]
  - add:
      entry:
        id: cal.1965-02-19.china-leadership
        when: 'Feb. 19'
        date: '1965-02-19'
        thread: china-leadership
        also: [africa, soviet-union]
        c: 'Zhou, in talk with Nyerere: if the U.S. goes on manipulating the U.N. it has no future; an organization steered by one state must break up, an objective law; China is outside and the members are held by the U.S.; the U.N. must be reorganized.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 709 (Feb. 19, 1965). Made public: 1997. Names: Zhou Enlai, Nyerere.'
        tags: [name:zhou-enlai, name:nyerere-julius-k, polity:prc, polity:tanzania, vis:only:prc+tanzania]
  - add:
      entry:
        id: cal.1965-02-20.china-leadership
        when: 'Feb. 20'
        date: '1965-02-20'
        thread: china-leadership
        also: [africa]
        c: 'Zhou attends the signing of the Sino-Tanzanian treaty of friendship.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 710 (Feb. 20, 1965). Names: Zhou Enlai, Nyerere.'
        tags: [name:zhou-enlai, name:nyerere-julius-k, polity:prc, polity:tanzania]
  - add:
      entry:
        id: cal.1965-02-18.china-leadership-2
        when: 'Feb. 18'
        date: '1965-02-18'
        thread: china-leadership
        c: 'Zhou writes Shehu welcoming an Albanian delegation to Beijing to discuss economic cooperation and goods exchange during Albania''s fourth five-year plan; proposes an expert group first, late in February, for preliminary talks with the Chinese offices.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 709–10 (Feb. 18, 1965). Made public: 1997. Names: Zhou Enlai, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1965-02-20.china-leadership-2
        when: 'Feb. 20'
        date: '1965-02-20'
        thread: china-leadership
        also: [africa]
        c: 'Zhou wires the Afro-Asian economic seminar meeting at Algiers on Feb. 22: Asians and Africans have spirit; they won independence by unity and struggle; they will build, relying on themselves and their riches, by self-reliance and equal mutual aid, new Asia and new Africa, wholly independent, advanced, strong.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 710 (Feb. 20, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:algeria]
  - add:
      entry:
        id: cal.1965-02-21.china-leadership
        when: 'Feb. 21'
        date: '1965-02-21'
        thread: china-leadership
        c: 'Zhou, at Mao''s, hears Bo Yibo on the national industry and transport political work conference. On the chief contradiction in setting up political organs, the relation of branches and regions: it has big problems and is unsettled; unsettled, it will bring disputes; local control is too broad, it can only raise problems in general, not by trade. Mao on forming political departments at every level: "The first to do political work was Premier Zhou. You were director of Chiang Kai-shek''s Whampoa political department; in political work you are the oldest."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 710 (Feb. 21, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Bo Yibo.'
        tags: [name:zhou-enlai, name:mao-zedong, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-21.china-leadership-2
        when: 'Feb. 21'
        date: '1965-02-21'
        thread: china-leadership
        c: 'Zhou calls Health Ministry heads Qian Xinzhong, Zhang Kai and He Biao with the Propaganda Department and State Council culture and education office to study the health plan. The Ministry is to make a long-range plan, fifteen years to wipe out disease. Five points: prevention and cure, sanitation of water and night soil tied to production, first in epidemic areas, early prevention; the patriotic health campaign, big twice a year, in school vacations, no formalism or forms, only results; health work for the countryside, urban medical teams a good start, serving workers, peasants and soldiers; train health workers faster by varied schooling; join Chinese and Western medicine, no uniformity, no forcing of either to learn the other, but unity.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 710–11 (Feb. 21, 1965). Made public: 1997. Names: Zhou Enlai, Qian Xinzhong, Zhang Kai, He Biao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-22.china-leadership
        when: 'Feb. 22'
        date: '1965-02-22'
        thread: china-leadership
        c: 'Zhou proposes how to improve the State Council''s Foreign Affairs Office. It takes six tasks: help the Central Committee''s foreign affairs group plan strategy; point out where the offices'' foreign work departs from policy or line and have it redone; rank, coordinate and balance their foreign work; organize cooperation with one office leading; screen important papers for Chen Yi and Zhou; check the carrying out of key tasks. It is to be reorganized on "liberate and raise": cut routine administration, drop what can be sent down, rotate in stronger cadres with foreign struggle experience. The Central foreign affairs group to meet often on strategy and the foreseeable; a central foreign affairs political department; a secretariat through which papers pass.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 711 (Feb. 22, 1965). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-23.china-leadership
        when: 'Feb. 23'
        date: '1965-02-23'
        thread: china-leadership
        c: 'Zhou tells Xinhua to check whether its Feb. 19 report on the U.N. recess, mentioning "U.N. forces", is exact: proletarian news differs from bourgeois in respect for facts. "I shall test you, to see how you work."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 712 (Feb. 23, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-23.china-leadership-2
        when: 'Feb. 23–24'
        date: '1965-02-23'
        thread: china-leadership
        c: 'Zhou calls delegates to the national cotton conference. Cotton''s place in the economy; sum up experience to solve the people''s clothing; learn from Dazhai, new devices each year; research steadily, report output honestly, grow cotton scientifically for stable high yield.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 712 (Feb. 23–24, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-24.china-leadership
        when: 'Feb. 24'
        date: '1965-02-24'
        thread: china-leadership
        also: [china]
        c: 'Zhou calls Ngapoi Ngawang Jigme and Phagpalha Geleg Namgyal to push on founding the Tibet Autonomous Region. We have always held to separating religion from politics; religion free, no forced unbelief; against reactionary rulers using religion. A proletarian party serves the great majority; serfowners, nobles and lamas must be remolded, a long and hard matter. Asks three things: do, learn and take help; do not fear mistakes; learn Mao''s works and Party papers; hear criticism.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 712 (Feb. 24, 1965). Made public: 1997. Names: Zhou Enlai, Ngapoi Ngawang Jigme, Phagpalha Geleg Namgyal.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-25.china-leadership
        when: 'Feb. 25'
        date: '1965-02-25'
        thread: china-leadership
        c: 'Zhou speaks at the national industry and transport work conference and its political work conference on the international and domestic situation. International struggle is more complex than before; those who bury themselves in economic work must still touch world affairs and read the papers; editorials and statements are never aimless.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 713 (Feb. 25, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-26.china-leadership
        when: 'Feb. 26'
        date: '1965-02-26'
        thread: china-leadership
        c: 'Zhou receives delegates of the regions and some provinces and cities to the national resettlement conference. Fit the place; the resettled rely mainly on themselves, with state guidance and help. Seven lessons on unified planning of labor: join labor, cuts and resettlement, East China trying first, regions discuss and widen after half a year; mobilize in winter, go down before spring planting or wheat harvest; fit the place; mainly to kin and friends; keep direction, consolidate, steady, no hurry; unified plan and cooperation; mainly self-reliance, mutual aid, help of commune and team, the state''s concern to the end.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 713 (Feb. 26, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-26.china-leadership-2
        when: 'Feb. 26'
        date: '1965-02-26'
        thread: china-leadership
        c: 'Zhou calls Liu Baiyu, Situ Huimin, Zheng Junli, Zhang Ruifang and others on documentaries: young people going to the countryside, cotton growing; mature, directional subjects this year, with emphasis, not as in 1958; creators after rectification and the storm must cool down first.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 713 (Feb. 26, 1965). Made public: 1997. Names: Zhou Enlai, Liu Baiyu, Situ Huimin, Zheng Junli, Zhang Ruifang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-26.china-leadership-3
        when: 'Feb. 26'
        date: '1965-02-26'
        thread: china-leadership
        c: 'The Central Committee and State Council decide on the setup for third-front construction in the Southwest: to strengthen leadership a Southwest Third Front Construction Commission is to be formed.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 713 (Feb. 26, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-27.china-leadership
        when: 'Feb. 27'
        date: '1965-02-27'
        thread: china-leadership
        c: 'Zhou calls Zhang Xiuzhu, Jiang Yizhen, Han Guang and Liang Buting on the agricultural science experiment conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 713–14 (Feb. 27, 1965). Made public: 1997. Names: Zhou Enlai, Zhang Xiuzhu, Jiang Yizhen, Han Guang, Liang Buting.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-27.china-leadership-2
        when: 'Feb. 27'
        date: '1965-02-27'
        thread: china-leadership
        c: 'Zhou, interviewed by Philippine journalists Fadul of the *Taliba* and De Guzman of the weekly *Central Luzon Mail*: Sino-American relations are international, the Chiang question domestic; when to liberate Taiwan is the Chinese people''s right; fifteen years waited, no hurry. Taiwan touches the U.S., so China talks with it. No fear it will bring a world war; China will never attack or start a war.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 714 (Feb. 27, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:philippines]
  - add:
      entry:
        id: cal.1965-02-28.china-leadership
        when: 'Feb. 28'
        date: '1965-02-28'
        thread: china-leadership
        c: 'Zhou reports on the domestic and international situation to delegates of the national cotton, nine-provinces-one-city farm, farm science experiment and resettlement conferences. These meetings lay the base for the fifteen-year plan and the Third Plan: stress farming, the people''s food, clothing, use. Bring Mao Zedong Thought through; theory with practice, research with the field, scientists with Party and government leaders, old farmers and the masses. Scientists to read Mao''s four essays, "On Contradiction", "On Practice", "On the Correct Handling of Contradictions Among the People" and "Where Do Correct Ideas Come From?", with questions in mind; no one method for all.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 714 (Feb. 28, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-28.china-leadership-2
        when: 'Feb. 28'
        date: '1965-02-28'
        thread: china-leadership
        also: [korea]
        c: 'Zhou calls Shi Ximin, Liu Baiyu, Situ Huimin, Zheng Junli and Zhang Ruifang on the film *Li Shanzi*: do not force class struggle in, which the audience is sensitive to; too much play, too little earnest, too much show, too little production; the red thread is lost; show it through production, labor, practice, work on people. The film must be largely redone.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 714–15 (Feb. 28, 1965). Made public: 1997. Names: Zhou Enlai, Shi Ximin, Liu Baiyu, Situ Huimin, Zheng Junli, Zhang Ruifang.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-01.china-leadership
        when: 'Mar. 1'
        date: '1965-03-01'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Zhou leads the Chinese Communist Party delegation (Peng Zhen, Yang Chengwu, Wu Lengxi among them) to Hanoi for talks with the Workers'' Party delegation under Hồ Chí Minh (Lê Duẩn, Phạm Văn Đồng, Phạm Hùng, Võ Nguyên Giáp among them). The new CPSU leadership should not be judged by one look but several; after these months it is clear it carries out Khrushchevism, which cannot change basically.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 715 (Mar. 1, 1965). Made public: 1997. Names: Zhou Enlai, Peng Zhen, Yang Chengwu, Wu Lengxi, Hồ Chí Minh, Lê Duẩn, Phạm Văn Đồng, Phạm Hùng, Võ Nguyên Giáp.'
        tags: [name:zhou-enlai, name:peng-zhen, name:ho-chi-minh, name:le-duan, name:pham-van-dong, name:vo-nguyen-giap, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-03-02.china-leadership
        when: 'Mar. 2'
        date: '1965-03-02'
        thread: china-leadership
        c: 'Zhou flies back to Beijing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 715 (Mar. 2, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-03-02.china-leadership-2
        when: 'Mar. 2–5'
        date: '1965-03-02'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, with Liu Shaoqi, has talks with President Ayub Khan, visiting Mar. 2–9. Mar. 5: in the two countries'' Third Plan periods China will keep giving aid beyond the $60 million given, interest-free, repayment indefinitely extendable, some surely free, a gift without conditions; an international duty, a new principle: no exploiting or robbing others.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 715 (Mar. 2–5, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Ayub Khan.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:ayub-khan-mohammad, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1965-03-05.china-leadership
        when: 'Mar. 5'
        date: '1965-03-05'
        thread: china-leadership
        c: 'Zhou receives provincial leaders at the nine-provinces-one-city farm forum. Take key points: East China can then supply Shanghai; Central-South chiefly Henan, grain self-sufficient with some for others; the Southwest has always shipped out, now with third-front building must store; Northwest in two steps, self-sufficiency then surplus; Northeast has surplus, better with machines and fertilizer; North China is biggest trouble, drought and flood, flood brings alkali, the key area. Strategically, in any war all provinces must have grain in reserve; seek ten to fifteen years of peace, but plan by five years; grain first. Three main matters: arrange general work around production; pests and diseases; spring plowing and sowing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 715–16 (Mar. 5, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-05.china-leadership-2
        when: 'Mar. 5'
        date: '1965-03-05'
        thread: china-leadership
        c: 'Zhou reviews in the Great Hall the revised rehearsal of *The East Is Red*; more changes: show that Mao''s thought has deep roots among the masses and his leadership was set by the masses'' will; the "Nanchang Uprising troops" banner may go, use the Chinese Workers'' and Peasants'' Red Army flag; making the Yi and Tibetan chiefs old men is wrong, chiefs then were oppressed by the Kuomintang too, without uniting them one cannot pass.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 716 (Mar. 5, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-07.china-leadership
        when: 'Mar. 7–9'
        date: '1965-03-07'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, Mar. 7–9, goes by special plane with Ayub Khan to Hangzhou and Shanghai. At Shanghai joins Song Qingling in receiving him; gives a recorded talk to Radio Pakistan''s news editor.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 715 (Mar. 7–9, 1965). Names: Zhou Enlai, Song Qingling, Ayub Khan.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1965-03-10.china-leadership
        when: 'Mar. 10'
        date: '1965-03-10'
        thread: china-leadership
        c: 'Zhou writes for the Shanghai garrison: "Four Firsts, Three-Eight work style; study and use Mao Zedong Thought in a living way; train troops from real need, strict, hard."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 716 (Mar. 10, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-03.china-leadership
        when: 'Mar., early to mid'
        date: '1965-03'
        thread: china-leadership
        at: 'before 1965-03-21'
        c: 'Zhou, learning that Li Zongren has resolved to return to China, asks Cheng Siyuan to tell Li his long wish may be fulfilled.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 716 (Mar., early to mid 1965). Made public: 1997. Check: the day. See [[cal.1965-02-03.china-leadership]]. Names: Zhou Enlai, Cheng Siyuan, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-11.china-leadership-2
        when: 'Mar. 11–13'
        date: '1965-03-11'
        thread: china-leadership
        c: 'Zhou, Mar. 11 to 13, attends meetings the Central Committee calls, the Secretariat''s and the enlarged Politburo''s, on long-term planning for twelve State Council ministries: geology, metallurgy, chemicals, coal, water and power, construction, First Machine Building, Second Light Industry, textiles, railways, communications, posts and telecommunications.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 716 (Mar. 11–13, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-13.china-leadership
        when: 'Mar. 13'
        date: '1965-03-13'
        thread: china-leadership
        c: 'Zhou calls Zhao Erlu, Yang Chengwu, Zheng Hantao and the economic and planning heads of the regions on the small third front. Hearing Zhao on the local arms conference, agrees that first- and second-line provinces build twenty-one rear bases; defense industry to join local people and militia; keep to convenience for the people. The Third Plan to take care of the small third front, fifteen years to build the national system and layout; but farming, unlike industry, must stabilize high yield and raise yield per area.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 716–17 (Mar. 13, 1965). Made public: 1997. Names: Zhou Enlai, Zhao Erlu, Yang Chengwu, Zheng Hantao.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-13.china-leadership-2
        when: 'Mar. 13'
        date: '1965-03-13'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou attends the enlarged Politburo meeting, which in the main adopts "On the Moscow March Meeting", published Mar. 23 under the *People''s Daily* and *Red Flag* editorial offices: the Moscow consultative meeting of Mar. 1–5 was a splitting meeting, a most grave step in openly splitting the international communist movement.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 717 (Mar. 13, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-13.china-leadership-3
        when: 'Mar. 13'
        date: '1965-03-13'
        thread: china-leadership
        also: [laos, vietnam-hanoi]
        c: 'Zhou wires Prince Sihanouk, convener, and the standing secretariat of the Indochinese Peoples'' Conference, congratulating it on its closing: in the struggle against American armed aggression in Indochina, China and the Indochinese states are close neighbors and China''s people will stand with theirs.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 717 (Mar. 13, 1965). Names: Zhou Enlai, Sihanouk.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1965-03-15.china-leadership
        when: 'Mar. 15'
        date: '1965-03-15'
        thread: china-leadership
        c: 'Zhou receives Denmark''s departing ambassador. China''s economy is undergoing a thorough reorganization, this year its last. While the world still discriminates against China politically, blocks its U.N. seat, makes "two Chinas", embargoes it, China keeps a hard policy, not by choice.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 717 (Mar. 15, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:denmark]
  - add:
      entry:
        id: cal.1965-03-15.china-leadership-2
        when: 'Mar. 15'
        date: '1965-03-15'
        thread: china-leadership
        c: 'Zhou leaves Beijing for Tianjin; attends the Hebei congress of poor and lower-middle peasants and advanced producers and units. Tells Hebei''s leaders to care for the educated youth going to the hills and countryside.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 717 (Mar. 15, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-03-16.china-leadership
        when: 'Mar. 16'
        date: '1965-03-16'
        thread: china-leadership
        also: [europe-and-the-alliance-france, china]
        c: 'Zhou receives Carol of the French weekly *Le Nouvel Observateur* and Ribud of the Paris photo agency Grand Images. China''s class struggle is marked by teaching the people to be alert, stronger and surer than legal means; the people are taught, and those of exploiter origin told they can be remolded if they serve the country; standards for Party members or progressives cannot be asked of them; left, middle and right always exist, and contradiction and struggle drive society on, even under communism. Asked whether he favors de Gaulle''s five-power conference on the U.N.: many things should be settled by all states sitting together, large and small equal; no five-power monopoly.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 717–18 (Mar. 16, 1965). Names: Zhou Enlai, Carol.'
        tags: [name:zhou-enlai, polity:prc, polity:fr]
  - add:
      entry:
        id: cal.1965-03-17.china-leadership-2
        when: 'Mar. 17'
        date: '1965-03-17'
        thread: china-leadership
        c: 'Zhou calls responsible officials on foreign work and on capital construction.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 718 (Mar. 17, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-17.china-leadership-3
        when: 'Mar. 17'
        date: '1965-03-17'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou receives the Syrian friendship delegation. Britain''s Field Marshal Montgomery, twice in China, saw the militia and urged America not to invade China, lest it "go in and not come out"; MacArthur and Ayub Khan agree on the militia''s value; well organized it is a net spread from heaven to earth.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 718 (Mar. 17, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:syria]
  - add:
      entry:
        id: cal.1965-03-17.china-leadership-4
        when: 'Mar. 17'
        date: '1965-03-17'
        thread: china-leadership
        also: [europe-and-the-alliance-france, vietnam]
        c: 'Zhou tells French ambassador Paye: China does not grant that the U.S. has the right to make trouble in the world, or to control the U.N.; that is the basic difference with the U.S.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 718 (Mar. 17, 1965). Made public: 1997. Names: Zhou Enlai, Paye.'
        tags: [name:zhou-enlai, polity:prc, polity:fr, vis:only:prc+fr]
  - add:
      entry:
        id: cal.1965-03-18.china-leadership
        when: 'Mar. 18'
        date: '1965-03-18'
        thread: china-leadership
        c: 'Zhou chairs the first meeting of the standing committee of the Fourth CPPCC National Committee. Gathering "cultural and historical materials", fifty-one issues so far, was his proposal: keep it true and practical; let one''s generation write what happened, favorable and unfavorable, in two parts, to teach the young. Truth is not easy: in government, two men tell the same event differently; go to first-hand material; to the masses'' views, first do not pour cold water, second be practical. Says he will not be chairman of the next CPPCC, so as not to hinder it with his work; for health, leaders should not hold too many posts.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 718 (Mar. 18, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-03-18.china-leadership-2
        when: 'Mar. 18'
        date: '1965-03-18'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou receives the Palestine Liberation Organization delegation under chairman Ahmad Shukairy. Shukairy praises his contribution at Bandung ten years ago; Zhou: Bandung''s success was all''s, above all Sukarno, Indonesia''s premier Ali Sastroamidjojo and Nasser; we cooperated well; "our achievement, strength and contribution are limited; I am not content with the past; I am, to the people and to friends abroad, a servant."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 719 (Mar. 18, 1965). Names: Zhou Enlai, Shukairy.'
        tags: [name:zhou-enlai, name:shukairy-ahmad, polity:prc]
  - add:
      entry:
        id: cal.1965-03-19.china-leadership
        when: 'Mar. 19'
        date: '1965-03-19'
        thread: china-leadership
        c: 'Zhou, after the play *Liu Hulan*, tells the cast it recalls the comrades who died heroically in the war years.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 719 (Mar. 19, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-03-20.china-leadership
        when: 'Mar. 20'
        date: '1965-03-20'
        thread: china-leadership
        also: [testing]
        c: 'Zhou chairs the 11th meeting of the Special Commission. Nuclear tests to start from military, scientific and technical need; get all the scientific knowledge a test can give, so each test has full effect.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 719 (Mar. 20, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-20.china-leadership-2
        when: 'Mar. 20'
        date: '1965-03-20'
        thread: china-leadership
        also: [middle-east, vietnam-hanoi]
        c: 'Zhou receives Syria''s foreign minister Hasan Murawid and culture minister Sulayman Hish. The Vietnam question is talked of daily by world opinion and the White House; the struggle in the South will grow; every act of China''s is to be agreed with the DRV, to follow its views and wishes.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 719 (Mar. 20, 1965). Names: Zhou Enlai, Hasan Murawid, Hish.'
        tags: [name:zhou-enlai, polity:prc, polity:syria]
  - add:
      entry:
        id: cal.1965-03-20.china-leadership-3
        when: 'Mar. 20'
        date: '1965-03-20'
        thread: china-leadership
        c: 'Zhou, in the evening, goes to the Romanian embassy to condole the death of Gheorghiu-Dej, first secretary of the Romanian Workers'' Party and chairman of the Council of State.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 719 (Mar. 20, 1965). Names: Zhou Enlai, Gheorghiu-Dej.'
        tags: [name:zhou-enlai, name:gheorghiu-dej-gheorghe, polity:prc, polity:romania]
  - add:
      entry:
        id: cal.1965-03-21.china-leadership
        when: 'Mar. 21'
        date: '1965-03-21'
        thread: china-leadership
        c: 'Zhou, on the defense industry office''s report on rear-base planning in first- and second-line provinces, asks Deng Xiaoping to call the Secretariat with those concerned "to fix some limits and keep places from raising the stake as they build".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 719 (Mar. 21, 1965). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-21.china-leadership-2
        when: 'Mar. 21'
        date: '1965-03-21'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou, in talk with Shukairy, proposes the "semi-official communiqué", the joint statement of the People''s Republic and the Palestine Liberation Organization, be signed in the name of "Zhou Enlai, honorary president of the Institute of Foreign Affairs, and Zhang Xiruo, president". He has several capacities, premier, CPPCC chairman, and has never signed as honorary president of the Institute; an exception, which in effect confirms the statement. Welcomes a PLO office in Beijing. Signed in Beijing next day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 719–20 (Mar. 21, 1965). Made public: 1997. Names: Zhou Enlai, Shukairy.'
        tags: [name:zhou-enlai, name:shukairy-ahmad, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-21.china-leadership-3
        when: 'Mar. 21'
        date: '1965-03-21'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou, evening, at Liu Shaoqi''s attends the Politburo Standing Committee. It decides that Zhou lead a Chinese party and government delegation to Romania, Albania, Algeria, the UAR, Burma and others, with Deng Xiaoping acting as Premier while he is away; discusses the aims and tasks of the trip. See [[cal.1965-03-22.china-leadership]].'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 720 (Mar. 21, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-22.china-leadership-2
        when: 'Mar. 22'
        date: '1965-03-22'
        thread: china-leadership
        c: 'Zhou leads the Chinese party and government delegation out of Beijing to Romania for Gheorghiu-Dej''s funeral. In the evening at Kunming talks with Hoàng Văn Hoan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 720 (Mar. 22, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:romania]
  - add:
      entry:
        id: cal.1965-03-22.china-leadership-3
        when: 'Mar. 22'
        date: '1965-03-22'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou signs in Beijing the joint statement of the People''s Republic of China and the Palestine Liberation Organization.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 720 (Mar. 22, 1965). Names: Zhou Enlai, Shukairy.'
        tags: [name:zhou-enlai, name:shukairy-ahmad, polity:prc]
  - add:
      entry:
        id: cal.1965-03-23.china-leadership
        when: 'Mar. 23'
        date: '1965-03-23'
        thread: china-leadership
        c: 'Zhou, a short stop at Karachi airport in the morning, reaches Bucharest in the afternoon. In the evening leads the delegation to the Republic Palace to lay a wreath by Gheorghiu-Dej''s body and, with Xie Fuzhi, Zhang Hanfu, Zhao Yimin, Liu Fang and Luo Qingchang, keeps vigil.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 720 (Mar. 23, 1965). Names: Zhou Enlai, Xie Fuzhi, Zhang Hanfu, Zhao Yimin, Liu Fang, Luo Qingchang, Gheorghiu-Dej.'
        tags: [name:zhou-enlai, name:xie-fuzhi, name:gheorghiu-dej-gheorghe, polity:prc, polity:romania]
  - add:
      entry:
        id: cal.1965-03-24.china-leadership-2
        when: 'Mar. 24'
        date: '1965-03-24'
        thread: china-leadership
        c: 'Zhou leads the delegation at Romania''s memorial meeting and state funeral for Gheorghiu-Dej; with other party and state leaders walks several miles behind the hearse to Liberty Park.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 720 (Mar. 24, 1965). Names: Zhou Enlai, Gheorghiu-Dej.'
        tags: [name:zhou-enlai, name:gheorghiu-dej-gheorghe, polity:prc, polity:romania]
  - add:
      entry:
        id: cal.1965-03-24.china-leadership-3
        when: 'Mar. 24'
        date: '1965-03-24'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Zhou, Bucharest, meets the heads of the North Korean (Pak Kum-chol), Vietnamese (Hoàng Văn Hoan) and Albanian (Rita Marko) delegations.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 720 (Mar. 24, 1965). Made public: 1997. Names: Zhou Enlai, Pak Kum-chol, Hoàng Văn Hoan, Rita Marko.'
        tags: [name:zhou-enlai, polity:prc, polity:dprk, polity:drv, polity:albania, vis:only:prc+dprk+drv+albania]
  - add:
      entry:
        id: cal.1965-03-25.china-leadership
        when: 'Mar. 25'
        date: '1965-03-25'
        thread: china-leadership
        c: 'Zhou, with Mao, Liu Shaoqi and Zhu De, wires Ceaușescu on his election as first secretary of the Romanian Workers'' Party; Chivu Stoica chairman of the Council of State and Maurer chairman of the Council of Ministers.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 720–21 (Mar. 25, 1965). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Ceaușescu, Maurer.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:ceausescu-nicolae, name:maurer-ion-gheorghe, polity:prc, polity:romania]
  - add:
      entry:
        id: cal.1965-03-25.china-leadership-2
        when: 'Mar. 25'
        date: '1965-03-25'
        thread: china-leadership
        c: 'Zhou visits the Brazi refinery and petrochemical works in Prahova county; at Doftana prison museum writes: prisons of the reactionary classes only torture revolutionaries'' bodies and harden their will; Communists call prison a school, a place to join legal and illegal struggle, a revolutionary command post in a sense; its use is to teach the young, not only to remember.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 721 (Mar. 25, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:romania]
  - add:
      entry:
        id: cal.1965-03-25.china-leadership-3
        when: 'Mar. 25'
        date: '1965-03-25'
        thread: china-leadership
        c: 'Zhou receives the staff of the Chinese embassy in Romania and the Chinese students. To the students: learn the language in practice, speak boldly; widen knowledge, geography and history and the sciences and social knowledge; "red and expert", neither red without expertise nor the reverse; learn to use it, not for a diploma.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 721 (Mar. 25, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:romania]
  - add:
      entry:
        id: cal.1965-03-26.china-leadership
        when: 'Mar. 26'
        date: '1965-03-26'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou calls on the Romanian leaders: only through consultation does any view become more correct; things in the world influence one another, Asia shapes Europe and Europe Asia.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 721 (Mar. 26, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:romania, vis:only:prc+romania]
  - add:
      entry:
        id: cal.1965-03-27.china-leadership
        when: 'Mar. 27'
        date: '1965-03-27'
        thread: china-leadership
        c: 'Zhou leads the delegation out of Bucharest; reaches Tirana in the morning.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 721 (Mar. 27, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1965-03-27.china-leadership-2
        when: 'Mar. 27–29'
        date: '1965-03-27'
        thread: china-leadership
        also: [soviet-union, vietnam-hanoi]
        c: 'Zhou has four talks with Albanian party and government leaders, Mar. 27 to 29.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 721 (Mar. 27–29, 1965). Made public: 1997. Names: Zhou Enlai, Hoxha, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1965-03-29.china-leadership
        when: 'Mar. 29'
        date: '1965-03-29'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou, at the mass rally of Tirana''s people in Skanderbeg Square welcoming the delegation: condemns the U.S. for widening the war in South Vietnam and bombing the North without pause; repeats China''s resolve to give the Vietnamese people all material support needed, weapons and all war supplies.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 721–22 (Mar. 29, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1965-03-30.china-leadership
        when: 'Mar. 30'
        date: '1965-03-30'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam, africa]
        c: 'Zhou flies from Tirana to Algiers; first talk with Ben Bella in the afternoon. The Vietnam question is wholly the U.S.''s mess: by the Geneva Agreements of 1954 France was to leave and North and South to unite peacefully two years later; the American invasion stopped it.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 722 (Mar. 30, 1965). Made public: 1997. Names: Zhou Enlai, Ben Bella.'
        tags: [name:zhou-enlai, name:ben-bella-ahmed, polity:prc, polity:algeria, vis:only:prc+algeria]
  - add:
      entry:
        id: cal.1965-03-31.china-leadership
        when: 'Mar. 31'
        date: '1965-03-31'
        thread: china-leadership
        also: [africa, soviet-union]
        c: 'Zhou, second talk with Ben Bella: outside the U.N. China may criticize it and give its views; its criticism is aimed at the U.S., not others. China is always grateful to Asia, Africa and others who back restoring its seat; that is one thing, its criticism of the U.N. and opposition to "two Chinas" another. China opposes control of the U.N. by the two great powers and de Gaulle''s five-power monopoly alike.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 722 (Mar. 31, 1965). Made public: 1997. Names: Zhou Enlai, Ben Bella.'
        tags: [name:zhou-enlai, name:ben-bella-ahmed, polity:prc, polity:algeria, vis:only:prc+algeria]
  - add:
      entry:
        id: cal.1965-04-01.china-leadership
        when: 'Apr. 1'
        date: '1965-04-01'
        thread: china-leadership
        also: [middle-east, vietnam]
        c: 'Zhou leaves Algiers for the UAR; talks with Premier Sabri and with Nasser. To Nasser: used a European trip to come to Africa and exchange views on the world. Two forms of development: peoples want independence and sweep reaction away, shaking imperialist colonial rule; the U.S. makes trouble everywhere, angers peoples, and is driven off. Since Bandung ten years of both, one in essence: break imperialist control and end colonial rule, old or new.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 722 (Apr. 1, 1965). Made public: 1997. Names: Zhou Enlai, Sabri, Nasser.'
        tags: [name:zhou-enlai, name:sabri-ali, name:nasser-gamal-abdel, polity:prc, polity:uar, vis:only:prc+uar]
  - add:
      entry:
        id: cal.1965-04-01.china-leadership-2
        when: 'Apr. 1'
        date: '1965-04-01'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou receives Shukairy, back in Cairo from China some days, and accepts two works of art he gives, symbols of the Palestinians'' will to freedom.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 722–23 (Apr. 1, 1965). Names: Zhou Enlai, Shukairy.'
        tags: [name:zhou-enlai, name:shukairy-ahmad, polity:prc, polity:uar]
  - add:
      entry:
        id: cal.1965-04-02.china-leadership
        when: 'Apr. 2'
        date: '1965-04-02'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou, on leaving Cairo, is interviewed by the Middle East News Agency''s news editor: fighting imperialist aggression and oppression is the common historic task of the two peoples; the Chinese people will always be reliable friends of the Arab peoples. Flies to Karachi; met at the airport by President Ayub Khan and Bhutto.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 723 (Apr. 2, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:uar]
  - add:
      entry:
        id: cal.1965-04-02.china-leadership-2
        when: 'Apr. 2'
        date: '1965-04-02'
        thread: china-leadership
        also: [vietnam, vietnam-hanoi, south-asia]
        c: 'Zhou, Karachi, talks with Ayub Khan. With U.S. aggression and pressure rising there is no chance of Vietnam yielding. Whether the war widens is not a matter of men''s will; once it widens no line can be drawn, as with spreading fire; the U.S. plays with fire and China will put it out. China does not oppose negotiation in principle, every matter ends in talk; but for South Vietnam the conditions and the time are not ripe. Asks Ayub, on his U.S. visit, to tell the U.S. three things: China will not itself start a war on the U.S.; Chinese words count; China is prepared. If war is forced on China it will resist to the end, no other way; if the U.S. bombs in the air, the Chinese on the ground can act by other means; a full bombing of China is war, and war has no limits.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 723 (Apr. 2, 1965). Made public: 1997. Names: Zhou Enlai, Ayub Khan, Bhutto.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, name:bhutto-zulfikar-ali, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1965-04-03.china-leadership
        when: 'Apr. 3'
        date: '1965-04-03'
        thread: china-leadership
        c: 'Zhou flies from Karachi to Rangoon; arrives in the afternoon. Apr. 3 and 4 four talks with Ne Win on the international situation, above all Southeast Asia, and a second Asian-African conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 723 (Apr. 3, 1965). Names: Zhou Enlai, Ne Win.'
        tags: [name:zhou-enlai, name:ne-win, polity:prc, polity:burma]
  - add:
      entry:
        id: cal.1965-04-04.china-leadership
        when: 'Apr. 4'
        date: '1965-04-04'
        thread: china-leadership
        c: 'Zhou leaves Rangoon at noon for home; reaches Kunming the same day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 723 (Apr. 4, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-04-05.china-leadership
        when: 'Apr. 5'
        date: '1965-04-05'
        thread: china-leadership
        c: 'Zhou inscribes the film *The East Is Red*: "Seek perfection, the latecomer to rise above."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 723 (Apr. 5, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-04-06.china-leadership
        when: 'Apr. 6'
        date: '1965-04-06'
        thread: china-leadership
        c: 'Zhou reaches Beijing with Chen Yi by the same plane.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 723 (Apr. 6, 1965). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc]
  - add:
      entry:
        id: cal.1965-04-08.china-leadership
        when: 'Apr. 8–9'
        date: '1965-04-08'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou holds talks, Apr. 8 and 9, with Nguyễn Duy Trinh, deputy premier of the Democratic Republic of Vietnam.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 724 (Apr. 8–9, 1965). Made public: 1997. Names: Zhou Enlai, Nguyễn Duy Trinh.'
        tags: [name:zhou-enlai, name:nguyen-duy-trinh, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-04-09.china-leadership-2
        when: 'Apr. 9–10'
        date: '1965-04-09'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou meets Zulfikar Sabri, adviser on foreign affairs to the UAR president, Apr. 9 and 10. Cadres are not to be chosen from one side only: leadership and the masses together, neither alone; from above one sees the whole but not his relations with the masses and daily conduct; the masses see those, but dwell on faults; both together are fuller and surer.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 724 (Apr. 9–10, 1965). Made public: 1997. Names: Zhou Enlai, Zulfikar Sabri.'
        tags: [name:zhou-enlai, name:sabri-zulficar, polity:prc, polity:uar, vis:only:prc+uar]
  - add:
      entry:
        id: cal.1965-04-10.china-leadership
        when: 'Apr. 10'
        date: '1965-04-10'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou calls responsible officials on the draft Central Committee directive on strengthening war preparation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 724 (Apr. 10, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-04-12.china-leadership
        when: 'Apr. 12'
        date: '1965-04-12'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou attends the enlarged Politburo meeting, which discusses and in the main adopts the directive (the Central Committee issues it that day). He proposes to strike second and leave room; join war preparation to the long-term plan and where they clash war preparation governs; every ministry, above all government and military ones, to keep duty officers daily. On raising the slogan "Aid Vietnam, resist America": later; now China supports the Vietnamese struggle against America with Vietnam the main party.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 724 (Apr. 12, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-04-10.china-leadership-2
        when: 'Apr. 10'
        date: '1965-04-10'
        thread: china-leadership
        c: 'Zhou wires the Second Afro-Asian Journalists'' Day: coming with the tenth anniversary of Bandung, it links journalists'' solemn work to the peoples'' just struggle for unity against imperialism.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 724 (Apr. 10, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-04-11.china-leadership
        when: 'Apr. 11'
        date: '1965-04-11'
        thread: china-leadership
        c: 'Zhou calls Li Xiannian, Yu Qiuli and Gu Mu on capital construction. Before leaving the capital asks Li to tell the Secretariat: investment not over 17 billion yuan; what must be added to be added, some faster, as third-front and arms output; some other investment postponed.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 725 (Apr. 11, 1965). Made public: 1997. Names: Zhou Enlai, Li Xiannian, Yu Qiuli, Gu Mu.'
        tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-04-13.china-leadership-2
        when: 'Apr. 13'
        date: '1965-04-13'
        thread: china-leadership
        c: 'Zhou reads the air force party committee''s report on land at the Dingxing (Gaobeidian) and Gucheng airfields and the garrisons'' help to communes, the inquiry he had ordered on Feb. 23 into the Gaobeidian field''s taking much farmland and doing little for farming; tells Luo Ruiqing the General Staff and defense industry office should praise and spread the Air Defense Command''s step of cutting land and aiding the communes.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 725 (Apr. 13, 1965). Made public: 1997. Names: Zhou Enlai, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-04-13.china-leadership-3
        when: 'Apr. 13'
        date: '1965-04-13'
        thread: china-leadership
        c: 'Zhou receives Turkish journalists Sipahioglu, Agar, Akan and Tansug.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 725 (Apr. 13, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:turkey]
  - add:
      entry:
        id: cal.1965-04-14.china-leadership
        when: 'Apr. 14'
        date: '1965-04-14'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou flies to Kunming. Apr. 15 talks there with Phạm Văn Đồng.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 725 (Apr. 14, 1965). Names: Zhou Enlai, Phạm Văn Đồng.'
        tags: [name:zhou-enlai, name:pham-van-dong, polity:prc]
  - add:
      entry:
        id: cal.1965-04-16.china-leadership
        when: 'Apr. 16'
        date: '1965-04-16'
        thread: china-leadership
        also: [indonesia, africa]
        c: 'Zhou and Chen Yi leave Kunming before dawn for Jakarta for the tenth anniversary of the first Asian-African Conference. At Jakarta airport issues a written statement: Asian and African states must hold the Bandung banner higher, unite further, and smash all imperialist aggression and war plots.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 725 (Apr. 16, 1965). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-04-17.china-leadership
        when: 'Apr. 17'
        date: '1965-04-17'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou and Chen Yi call on Sukarno at Bogor.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 725 (Apr. 17, 1965). Made public: 1997. Names: Zhou Enlai, Chen Yi, Sukarno.'
        tags: [name:zhou-enlai, name:chen-yi, name:sukarno, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1965-04-18.china-leadership
        when: 'Apr. 18'
        date: '1965-04-18'
        thread: china-leadership
        also: [indonesia, africa]
        c: 'Zhou, with Kim Il Sung, Phạm Văn Đồng, Sihanouk and chief delegates of thirty-six states, attends the ceremony at Senayan stadium, Jakarta, for the tenth anniversary of Bandung.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 725 (Apr. 18, 1965). Names: Zhou Enlai, Kim Il Sung, Phạm Văn Đồng, Sihanouk.'
        tags: [name:zhou-enlai, name:kim-il-sung, name:pham-van-dong, name:norodom-sihanouk, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-04-19.china-leadership
        when: 'Apr. 19'
        date: '1965-04-19'
        thread: china-leadership
        also: [japan, indonesia]
        c: 'Zhou, by Sukarno''s arrangement, talks with Japan''s Kawashima Shōjirō. On Sino-Japanese relations: first, China will watch; second, Japan''s government is friendly to Taiwan and hostile to new China and China can criticize it any time; third, China still hopes, does not despair. Hopes Japan will set up normal relations with Asian states by the five principles; with China too on equality. China has always taken the initiative; rejects the Japanese proposal that the two governments make contact through their consuls general in Switzerland, wants higher diplomats, the foreign minister or premier.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 725–26 (Apr. 19, 1965). Made public: 1997. Names: Zhou Enlai, Kawashima Shōjirō, Sukarno.'
        tags: [name:zhou-enlai, name:kawashima-shyojiro, name:sukarno, polity:prc, polity:japan, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1965-04-21.china-leadership
        when: 'Apr. 21'
        date: '1965-04-21'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou, with Sukarno, goes to Bandung and tours the buildings where the conference met ten years before.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 726 (Apr. 21, 1965). Names: Zhou Enlai, Sukarno.'
        tags: [name:zhou-enlai, name:sukarno, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-04-22.china-leadership-3
        when: 'Apr. 22–24'
        date: '1965-04-22'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou visits Bali, Apr. 22 and 23, and returns to Jakarta on the 24th.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 726 (Apr. 22–24, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-04-25.china-leadership
        when: 'Apr. 25'
        date: '1965-04-25'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou visits Subandrio in hospital after his operation; brings flowers, wishes him well.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 726 (Apr. 25, 1965). Names: Zhou Enlai, Subandrio.'
        tags: [name:zhou-enlai, name:subandrio, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-04-25.china-leadership-2
        when: 'Apr. 25'
        date: '1965-04-25'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou receives Sinki, chairman of the Indonesia–China Friendship Association, and other groups'' delegates: the two peoples to hold high the Bandung banner and the banner of the new forces against the old, advancing side by side.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 726 (Apr. 25, 1965). Names: Zhou Enlai, Sinki.'
        tags: [name:zhou-enlai, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-04-25.china-leadership-3
        when: 'Apr. 25'
        date: '1965-04-25'
        thread: china-leadership
        also: [vietnam, vietnam-hanoi]
        c: 'Zhou, in a television talk with the Australian reporter Burchett and the French reporter Roger Pic: South Vietnam''s question can be settled only by South Vietnam''s people, and Vietnam''s unification only by Vietnam''s people.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 726 (Apr. 25, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-04-25.china-leadership-4
        when: 'Apr. 25'
        date: '1965-04-25'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou, in his farewell address on Indonesian radio: Bandung was an epoch-making act of Asia and Africa; ten years have changed Asia and Africa utterly; over two billion people are a strong force for peace and progress. In Indonesia he met Kim Il Sung, Phạm Văn Đồng, Sihanouk, Cambodia''s prime minister Norodom Kantol, Souphanouvong, Algeria''s deputy premier Said, Nepal''s crown prince Birendra and North Borneo''s Azahari, prime minister of the revolutionary government. To Azahari on China''s revolution: its victory was the work of the whole people under Mao and the Central Committee; "I am only a screw."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 726 (Apr. 25, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-04-26.china-leadership
        when: 'Apr. 26'
        date: '1965-04-26'
        thread: china-leadership
        also: [indonesia, africa]
        c: 'Zhou, in talk with Sukarno, praises his speech at the Bandung anniversary as shaking the world and showing the way. Sukarno: it owes mostly to Zhou''s guidance. Zhou then flies from Jakarta for a friendly visit to Burma.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 727 (Apr. 26, 1965). Made public: 1997. Names: Zhou Enlai, Sukarno.'
        tags: [name:zhou-enlai, name:sukarno, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1965-04-27.china-leadership
        when: 'Apr. 27'
        date: '1965-04-27'
        thread: china-leadership
        also: [vietnam, vietnam-hanoi]
        c: 'Zhou lays a wreath at the tomb of Burma''s national hero Aung San. In talks with Ne Win on support for Vietnam: China strikes second and does not start a war; if the U.S. makes war, China hits back; Chinese volunteers go only when Vietnam asks, never on China''s own initiative.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 727 (Apr. 27, 1965). Made public: 1997. Names: Zhou Enlai, Ne Win.'
        tags: [name:zhou-enlai, name:ne-win, polity:prc, polity:burma, vis:only:prc+burma]
  - add:
      entry:
        id: cal.1965-04-28.china-leadership-2
        when: 'Apr. 28'
        date: '1965-04-28'
        thread: china-leadership
        also: [vietnam]
        c: 'Zhou ends the Burma visit; flies to Nanning and calls on air force officers and men on war-readiness duty at a field airfield; reaches Guangzhou in the afternoon. Receives there the wife of President Touré of Guinea, on her way to Korea, and takes her to the Guangzhou export fair.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 727 (Apr. 28, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-04-29.china-leadership
        when: 'Apr. 29'
        date: '1965-04-29'
        thread: china-leadership
        c: 'Zhou reaches Beijing with Mrs. Touré by the same plane; visits Chen Yi in hospital, treated for hypertension.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 727 (Apr. 29, 1965). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc]
  - add:
      entry:
        id: cal.1965-04-29.china-leadership-2
        when: 'Apr. 29–May 2'
        date: '1965-04-29'
        thread: china-leadership
        also: [africa]
        c: 'Zhou has five talks with Ghana''s government delegation under Foreign Minister Kojo Botsio, Apr. 29 to May 2. U.S. forces are now spread over the world, bases and fleets everywhere; the more it does so the more it angers peoples. China can offer Asian and African states its experience of anti-imperialist, anticolonial revolution; on building it feels short of experience and ability; it will give more.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 727 (Apr. 29–May 2, 1965). Made public: 1997. Names: Zhou Enlai, Kojo Botsio.'
        tags: [name:zhou-enlai, polity:prc, polity:ghana, vis:only:prc+ghana]
  - add:
      entry:
        id: cal.1965-05-02.china-leadership
        when: 'May 2'
        date: '1965-05-02'
        thread: china-leadership
        c: 'Zhou attends the Politburo Standing Committee, which hears Luo Ruiqing on his work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 727 (May 2, 1965). Made public: 1997. Names: Zhou Enlai, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-02.china-leadership-2
        when: 'May 2'
        date: '1965-05-02'
        thread: china-leadership
        also: [latin-america-dominican-republic]
        c: 'Zhou, at Botsio''s farewell banquet, for the Chinese government and people condemns the U.S. for sending marines and paratroopers into the Dominican Republic under the name of "protecting American nationals": a grave provocation to Latin America''s and the world''s peoples; China firmly backs the Dominican people''s struggle.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 728 (May 2, 1965). Names: Zhou Enlai, Botsio.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-05-04.china-leadership
        when: 'May 4–5'
        date: '1965-05-04'
        thread: china-leadership
        also: [testing]
        c: 'Zhou chairs the 12th meeting of the Special Commission. For the second nuclear test: be sure, never force it; a larger safety factor, check all and patch every gap; strengthen political work, be careful, no slackness. Fewer tests would do. On the evening of the 5th telephones again about data and safety.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 728 (May 4–5, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-05.china-leadership
        when: 'May 5–6'
        date: '1965-05-05'
        thread: china-leadership
        c: 'Zhou calls heads of the State Capital Construction Commission, Planning Commission and Finance Ministry on adjusting the capital construction plan and the budget.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 728 (May 5–6, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-06.china-leadership
        when: 'May 6'
        date: '1965-05-06'
        thread: china-leadership
        also: [japan]
        c: 'Zhou sees the Japanese historical play *The Gujo Peasant Uprising* and receives the troupe''s head, deputy head, director and author.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 728 (May 6, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1965-05-07.china-leadership
        when: 'May 7'
        date: '1965-05-07'
        thread: china-leadership
        also: [latin-america]
        c: 'Zhou receives the nine Chinese traders and journalists illegally jailed by Brazil more than a year, home since Apr. 21, and their families: use the affair to teach spirit, resolve, confidence and fighting will; struggle brings victory. Abroad one finds the homeland dear.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 728 (May 7, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-05-08.china-leadership
        when: 'May 8'
        date: '1965-05-08'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives the Tanzanian guests at May Day. Urges all in foreign work to learn a foreign language; Chinese habits are conservative; Mao would break them; Mao, a normal-school graduate with weak English, studies it when he can; he asks Zhou about words Zhou has forgotten, which shows his diligence.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 728–29 (May 8, 1965). Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, polity:tanzania]
  - add:
      entry:
        id: cal.1965-05-08.china-leadership-2
        when: 'May 8'
        date: '1965-05-08'
        thread: china-leadership
        c: 'Zhou, on the Finance Ministry''s budget plan: production and construction in the order set; do what money allows; rank by urgency; in this adjustment guarantee war preparation, aid abroad, the third front and key projects, cut the not urgent, the unready, the non-productive, what can be saved. Six relations: war with peace; need and possibility; quantity and quality; zeal and science; this year''s and long-term building; labor and skilled workers.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 729 (May 8, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-08.china-leadership-3
        when: 'May 8–10'
        date: '1965-05-08'
        thread: china-leadership
        c: 'Zhou has three talks with Hysni Kapo, Albanian Workers'' Party Politburo member and first deputy chairman of the Council of Ministers, May 8–10.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 729 (May 8–10, 1965). Made public: 1997. Names: Zhou Enlai, Hysni Kapo.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1965-05-09.china-leadership
        when: 'May 9'
        date: '1965-05-09'
        thread: china-leadership
        c: 'Zhou, on the State Capital Construction Commission party group''s summary report on adjusting the 1965 plan, writes Liu Shaoqi and Deng Xiaoping: proposes a Politburo meeting the afternoon of the 11th to hear Gu Mu and the Finance Ministry and approve it.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 729 (May 9, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Gu Mu.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-10.china-leadership
        when: 'May 10'
        date: '1965-05-10'
        thread: china-leadership
        also: [testing]
        c: 'Zhou, with Luo Ruiqing, Yang Chengwu, Liu Jie and others, studies the second nuclear test; on the weather orders the front to prepare.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 729 (May 10, 1965). Made public: 1997. Names: Zhou Enlai, Luo Ruiqing, Yang Chengwu, Liu Jie.'
        tags: [name:zhou-enlai, name:luo-ruiqing, name:liu-jie, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-11.china-leadership
        when: 'May 11'
        date: '1965-05-11'
        thread: china-leadership
        c: 'Zhou, at the Politburo on adjusting the 1965 capital construction plan and budget, again proposes the "four guarantees": war preparation, aid abroad, the third front, key projects; rank by urgency: first cut what is not urgent, second what is not ready, third what is non-productive, fourth break old molds in design, a revolution with large savings. Holding capital investment to 17 billion is to rank by output and imported goods and equipment, leaving margin. While he is away Deng may approve its control directly.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 729–30 (May 11, 1965). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-11.china-leadership-2
        when: 'May 11'
        date: '1965-05-11'
        thread: china-leadership
        also: [latin-america-dominican-republic]
        c: 'Zhou writes Mao proposing a statement in Mao''s name supporting the Dominican people''s armed anti-American patriotic struggle.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 730 (May 11, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-11.china-leadership-3
        when: 'May 11'
        date: '1965-05-11'
        thread: china-leadership
        c: 'Zhou goes to Zhongshan Hall to condole the death of Liu Yalou in Shanghai on May 7, and attends the capital''s public memorial meeting.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 730 (May 11, 1965). Names: Zhou Enlai, Liu Yalou.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-05-11.china-leadership-4
        when: 'May 11'
        date: '1965-05-11'
        thread: china-leadership
        also: [testing]
        c: 'Zhou gives the order to explode another atomic bomb, the second test.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 729 (May 11, 1965). Made public: 1997. See [[cal.1965-05-10.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-12.china-leadership-2
        when: 'May 12'
        date: '1965-05-12'
        thread: china-leadership
        also: [africa]
        c: 'Zhou calls responsible officials on preparations for the second Asian-African conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 730 (May 12, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-14.china-leadership
        when: 'May 14'
        date: '1965-05-14'
        thread: china-leadership
        also: [africa]
        c: 'Zhou writes Ben Bella: the Asian-African Conference is of Asian and African states and so observers should be limited to them; invitation of observers should follow only the Jakarta conference''s final communiqué, as for full members; if, as reported, states outside Asia and Africa are invited as observers the question will be complicated.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 730 (May 14, 1965). Made public: 1997. Names: Zhou Enlai, Ben Bella.'
        tags: [name:zhou-enlai, name:ben-bella-ahmed, polity:prc, polity:algeria, vis:only:prc+algeria]
  - add:
      entry:
        id: cal.1965-05-14.china-leadership-2
        when: 'May 14'
        date: '1965-05-14'
        thread: china-leadership
        also: [soviet-union, europe-and-the-alliance]
        c: 'Zhou attends the Politburo meeting; hears Yao Yilin on the finance and trade work conference, Lin Feng on going to the Soviet Union for the twentieth anniversary of victory over fascism, Lu Dingyi on going to the German Democratic Republic for the twentieth anniversary of its liberation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 730 (May 14, 1965). Made public: 1997. Names: Zhou Enlai, Yao Yilin, Lin Feng, Lu Dingyi.'
        tags: [name:zhou-enlai, name:lu-dingyi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-15.china-leadership
        when: 'May 15'
        date: '1965-05-15'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, on cases of overvalued Chinese aid projects, tells Fang Yi, chairman of the Foreign Economic Liaison Commission: check the valuation of all aid projects and sum up the experience, as a step toward better aid work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 730 (May 15, 1965). Made public: 1997. Names: Zhou Enlai, Fang Yi.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-15.china-leadership-2
        when: 'May 15'
        date: '1965-05-15'
        thread: china-leadership
        c: 'Zhou attends the Politburo meeting; hears Ye Lin on industrial production. This year''s output over 20 percent above last; note quality and safety now.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 730–31 (May 15, 1965). Made public: 1997. Names: Zhou Enlai, Ye Lin.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-15.china-leadership-3
        when: 'May 15'
        date: '1965-05-15'
        thread: china-leadership
        also: [soviet-union, china]
        c: 'Zhou receives the new Soviet ambassador Rabin and tells him of the six proposals he made Kosygin in Beijing on Feb. 5: the Chinese government does not withdraw what it said because of the grave new disputes since February; "the Chinese keep their word." He will see the ambassador when he asks, on his state''s big questions; talk must touch both how to improve relations and, with it, the political disagreements; talk of abstract friendship alone solves nothing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 731 (May 15, 1965). Made public: 1997. Names: Zhou Enlai, Rabin.'
        tags: [name:zhou-enlai, polity:prc, polity:ussr, vis:only:prc+ussr]
  - add:
      entry:
        id: cal.1965-05-18.china-leadership
        when: 'May 18–27'
        date: '1965-05-18'
        thread: china-leadership
        c: 'Zhou calls Yu Qiuli and the other members of the "small planning commission" on the long-term plan and the Third Five-Year Plan, May 18, 19 and 27.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 731 (May 18–27, 1965). Made public: 1997. Names: Zhou Enlai, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-19.china-leadership
        when: 'May 19'
        date: '1965-05-19'
        thread: china-leadership
        also: [vietnam]
        c: 'Zhou, to those at the Military Commission''s operations conference: why prepare for a big war? War has its laws, which no one''s will alters; if not ready, bad; if ready, the enemy dares not come, or comes and is destroyed. Preparing for a big fight does not mean being at the edge of ruin now; there is time to prepare.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 731 (May 19, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-05-20.china-leadership
        when: 'May 20'
        date: '1965-05-20'
        thread: china-leadership
        also: [vietnam-hanoi, laos]
        c: 'Zhou wires Sihanouk: firm support for Cambodia''s just act in breaking relations with the U.S. in answer to its provocations. If the U.S. carries the fire to Cambodia, China will not stand by.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 731 (May 20, 1965). Names: Zhou Enlai, Sihanouk.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1965-05-21.china-leadership
        when: 'May 21'
        date: '1965-05-21'
        thread: china-leadership
        c: 'Zhou, with Li Xiannian and Luo Ruiqing, takes the Albanian government economic delegation under Hysni Kapo to Dazhai brigade, Xiyang county, Shanxi. Warns Chen Yonggui to find ample water for irrigation and prepare for three years of drought.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 731–32 (May 21, 1965). Names: Zhou Enlai, Li Xiannian, Luo Ruiqing, Hysni Kapo, Chen Yonggui.'
        tags: [name:zhou-enlai, name:li-xiannian, name:luo-ruiqing, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1965-05-22.china-leadership
        when: 'May 22'
        date: '1965-05-22'
        thread: china-leadership
        c: 'Zhou calls Kuang Renong, head of civil aviation, on air work; he had said Chinese civil aviation could not open without flying out: "we must fly out".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 732 (May 22, 1965). Made public: 1997. Names: Zhou Enlai, Kuang Renong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-22.china-leadership-2
        when: 'May 22'
        date: '1965-05-22'
        thread: china-leadership
        c: 'The Standing Committee of the Third NPC abolishes the system of military ranks in the PLA; Liu Shaoqi proclaims the decision by presidential order.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 732 (May 22, 1965). Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc]
  - add:
      entry:
        id: cal.1965-05-22.china-leadership-3
        when: 'May 22–24'
        date: '1965-05-22'
        thread: china-leadership
        c: 'Zhou hears the State Council''s agriculture and forestry officials, May 22–24. May 23 hears Vice Minister of Forestry Hui Zhongquan on forestry in the Third Plan: China should make a Forest Law, promulgated by the State Council. Severely criticizes the forest fires of the year, fire fought twelve days: the vice minister in charge must command at the front; fires out within three days save unusual ones; study chemical fire-fighting with the Chemical Ministry; leadership must be strong, diligent work is not enough; fire protection is not poor but too poor.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 732 (May 22–24, 1965). Made public: 1997. Names: Zhou Enlai, Hui Zhongquan.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-25.china-leadership
        when: 'May 25'
        date: '1965-05-25'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou calls responsible officials on aid to Vietnam, road building and other matters.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 732 (May 25, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-25.china-leadership-2
        when: 'May 25'
        date: '1965-05-25'
        thread: china-leadership
        c: 'Zhou, viewing the trial footage of *The East Is Red*: shoot it chiefly as the stage performance, a stage documentary; film stock to be bought through the Foreign Trade Ministry in London.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 732 (May 25, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-05-28.china-leadership
        when: 'May 28–29'
        date: '1965-05-28'
        thread: china-leadership
        also: [indonesia, vietnam, vietnam-hanoi, africa]
        c: 'Zhou and Chen Yi fly to Guangzhou to welcome Subandrio, first deputy premier and foreign minister of Indonesia; three talks through the morning of May 29. On Vietnam: the U.S. rushes in unprepared for war; all its estimates wrong; its "gradual escalation" means one step at a time, the thing most forbidden in war; Taylor and Johnson are extreme pragmatists with no long strategy. On the second Asian-African conference: ten years ago all despised the conference, now all want in; difficult but of high market value; a great struggle ahead, in Asia and Africa and outside the U.N.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 732–33 (May 28–29, 1965). Made public: 1997. Names: Zhou Enlai, Chen Yi, Subandrio.'
        tags: [name:zhou-enlai, name:chen-yi, name:subandrio, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1965-05-29.china-leadership
        when: 'May 29'
        date: '1965-05-29'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, back in Beijing after seeing Subandrio off, receives Pakistani ambassador Raza: much work and busy, but never sparing of time for friendly states.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 733 (May 29, 1965). Names: Zhou Enlai, Raza.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1965-05-29.china-leadership-2
        when: 'May 29'
        date: '1965-05-29'
        thread: china-leadership
        c: 'Zhou, with Deng Xiaoping, He Long and Chen Yi, receives the Chinese table tennis team for the 28th World Championships and other leading athletes in Beijing, and urges them to keep on: study Mao Zedong Thought and the army, raise thought and skill.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 733 (May 29, 1965). Names: Zhou Enlai, Deng Xiaoping, He Long, Chen Yi.'
        tags: [name:zhou-enlai, name:deng-xiaoping, name:he-long, name:chen-yi, polity:prc]
  - add:
      entry:
        id: cal.1965-05-30.china-leadership
        when: 'May 30'
        date: '1965-05-30'
        thread: china-leadership
        c: 'Zhou reports on the international and domestic situation to the joint session, enlarged, of the NPC Standing Committee''s tenth meeting and the State Council''s 156th plenary meeting, CPPCC standing committee members present. This year''s tasks are more strained than last: production, construction, war preparation, socialist education together. The enemy''s pressure raises our spirit. Control: production, building, war preparation and aid abroad not to expand without limit, or it will be 1958 and above all 1959 again.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 733 (May 30, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-30.china-leadership-2
        when: 'May 30'
        date: '1965-05-30'
        thread: china-leadership
        also: [testing]
        c: 'Zhou receives and dines those who took part in the second nuclear test and urges them to study Mao Zedong Thought, pool wisdom, avoid pride and go forward.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 733–34 (May 30, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-05-31.china-leadership
        when: 'May 31'
        date: '1965-05-31'
        thread: china-leadership
        c: 'Zhou attends the Politburo Standing Committee, which hears Yu Qiuli''s preliminary ideas for the long-term plan and the Third Five-Year Plan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 734 (May 31, 1965). Made public: 1997. Names: Zhou Enlai, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-31.china-leadership-2
        when: 'May 31'
        date: '1965-05-31'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou receives the UAR film delegation: love of peace needs readiness to fight, or imperialism bullies; a just war must win.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 734 (May 31, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:uar]
  - add:
      entry:
        id: cal.1965-06-01.china-leadership
        when: 'June 1'
        date: '1965-06-01'
        thread: china-leadership
        c: 'Zhou, on the Ministry of Water and Power party group''s report on the Yellow River and Sanmenxia drawn up after the December conference: it is fairly full and analyzes the profit and loss of past work and the differing views. Orders it printed for the Standing Committee, Secretariat, Vice-Premiers, ministries and provinces.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 734 (June 1, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-01.china-leadership-2
        when: 'June 1'
        date: '1965-06-01'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou leaves Beijing by a Chinese civil aviation special plane for Pakistan and Tanzania. To the crew on China''s first international long-range flight: "We must fly out; I shall go with you to practice it."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 734 (June 1, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1965-06-01.china-leadership-3
        when: 'June 1'
        date: '1965-06-01'
        thread: china-leadership
        c: 'Zhou, stopping at Hotan, Xinjiang, speaks to the prefecture''s cadres: Xinjiang has done much in these years; it must still consolidate to be the sure rear of the northwest, guard the frontier, and bear production, construction and war mobilization like the rest of the country.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 734 (June 1, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-06-02.china-leadership-2
        when: 'June 2'
        date: '1965-06-02'
        thread: china-leadership
        c: 'Zhou, flying over the Pamirs, wires the air force high-mountain navigation station in Xinjiang: "You work hard in the mountains, fear no danger, and overcome many difficulties; keep on."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 734 (June 2, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-06-02.china-leadership-3
        when: 'June 2'
        date: '1965-06-02'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou lands at Rawalpindi, met by Ayub Khan; written statement at the airport: friendship has grown markedly in recent years, cooperation is fruitful, a positive factor in the international situation. The same day talks with Ayub Khan; talks go on next day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 734–35 (June 2, 1965). Made public: 1997. Names: Zhou Enlai, Ayub Khan.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1965-06-03.china-leadership
        when: 'June 3'
        date: '1965-06-03'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, with Bhutto, tours Islamabad again; flies with him to Karachi and, after a short stop, to Tanzania.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 735 (June 3, 1965). Names: Zhou Enlai, Bhutto.'
        tags: [name:zhou-enlai, name:bhutto-zulfikar-ali, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1965-06-03.china-leadership-2
        when: 'June 3'
        date: '1965-06-03'
        thread: china-leadership
        also: [middle-east, africa]
        c: 'Zhou, on the way, meets Iraq''s President Arif and Prime Minister Yahya at Baghdad, and is seen off and met at Cairo and Khartoum by UAR premier Sabri and Sudan''s premier Khalifa.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 735 (June 3, 1965). Names: Zhou Enlai, Arif.'
        tags: [name:zhou-enlai, name:aref-abdul-rahman-muhammad, polity:prc, polity:iraq, polity:uar, polity:sudan]
  - add:
      entry:
        id: cal.1965-06-04.china-leadership
        when: 'June 4'
        date: '1965-06-04'
        thread: china-leadership
        also: [africa]
        c: 'Zhou reaches Dar es Salaam; met by President Nyerere, vice-presidents Karume and Kawawa. In his written statement hopes to learn more of Tanzania and to learn from it.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 735 (June 4, 1965). Names: Zhou Enlai, Nyerere.'
        tags: [name:zhou-enlai, name:nyerere-julius-k, polity:prc, polity:tanzania]
  - add:
      entry:
        id: cal.1965-06-04.china-leadership-2
        when: 'June 4–7'
        date: '1965-06-04'
        thread: china-leadership
        also: [africa]
        c: 'Zhou has five talks with Nyerere, June 4 to 7. June 4: wants the Sino-Tanzanian shipping company running soon; sailing needs a trial; both independent, with the right to sail the open sea, and their flags to be recognized and respected; at the coming Asian-African conference economics is a main question; begging imperialism and reform will not do. June 5: hopes most Tanzanian ministers who have not gone will visit China: "better to see once than hear a hundred times". June 6: on the Tanzania–Zambia railway: a comprehensive survey party in August or September, to survey the line, coal, iron ore, hydrology. June 7: new states should mind two key things: stress farming, build on it by their own conditions; live simply, not match developed states; and plan cities spread out, not too concentrated, industry spread out.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 735 (June 4–7, 1965). Made public: 1997. Names: Zhou Enlai, Nyerere.'
        tags: [name:zhou-enlai, name:nyerere-julius-k, polity:prc, polity:tanzania, vis:only:prc+tanzania]
  - add:
      entry:
        id: cal.1965-06-05.china-leadership
        when: 'June 5'
        date: '1965-06-05'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, at the Dar es Salaam mass meeting: Africans enslaved, oppressed and plundered for centuries have risen and will be masters of their fate; Africa will be the Africans'', independent and free.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 736 (June 5, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:tanzania]
  - add:
      entry:
        id: cal.1965-06-05.china-leadership-2
        when: 'June 5'
        date: '1965-06-05'
        thread: china-leadership
        also: [congo, africa]
        c: 'Zhou receives Soumialot, chairman of the executive bureau of the Supreme Revolutionary Council of the Congo (Leopoldville).'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 736 (June 5, 1965). Names: Zhou Enlai, Soumialot.'
        tags: [name:zhou-enlai, polity:prc, polity:congo]
  - add:
      entry:
        id: cal.1965-06-06.china-leadership
        when: 'June 6'
        date: '1965-06-06'
        thread: china-leadership
        also: [africa]
        c: 'Zhou flies to Zanzibar and returns to Dar es Salaam the same day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 736 (June 6, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:tanzania]
  - add:
      entry:
        id: cal.1965-06-07.china-leadership
        when: 'June 7'
        date: '1965-06-07'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, with Nyerere, visits the headquarters of the Tanganyika African National Union, University College and the national museum. At the farewell dinner restates the five principles for relations with Arab and African states.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 736 (June 7, 1965). Names: Zhou Enlai, Nyerere.'
        tags: [name:zhou-enlai, name:nyerere-julius-k, polity:prc, polity:tanzania]
  - add:
      entry:
        id: cal.1965-06.china-leadership
        when: 'June, before the 8th'
        date: '1965-06'
        at: before 1965-06-08
        thread: china-leadership
        also: [vietnam, china]
        c: 'Zhou asks Nyerere to carry to the United States the four sentences he had asked Ayub Khan to carry, which Ayub''s postponed U.S. trip left undelivered: China will not itself start a war with the U.S., but is prepared for war.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 736 (before June 8, 1965). Made public: 1997. Check: the day; the chronology dates it "before June 8". Names: Zhou Enlai, Nyerere, Ayub Khan.'
        tags: [name:zhou-enlai, name:nyerere-julius-k, name:ayub-khan-mohammad, polity:prc, polity:tanzania, vis:only:prc+tanzania]
  - add:
      entry:
        id: cal.1965-06-08.china-leadership-2
        when: 'June 8'
        date: '1965-06-08'
        thread: china-leadership
        also: [africa, middle-east]
        c: 'Zhou signs the Sino-Tanzanian joint communiqué with Nyerere and flies out. Passes Addis Ababa airport; in the evening a short stop at Cairo airport, talks with UAR Deputy Premier Rifat.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 736 (June 8, 1965). Names: Zhou Enlai, Nyerere.'
        tags: [name:zhou-enlai, name:nyerere-julius-k, polity:prc, polity:tanzania, polity:uar]
  - add:
      entry:
        id: cal.1965-06-09.china-leadership
        when: 'June 9'
        date: '1965-06-09'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou, a three-hour stop at Damascus before dawn, talks at the presidency with Hafiz, chairman of the Presidential Council. Returns by Karachi, reaching an airfield in northwest China that night.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 736 (June 9, 1965). Made public: 1997. Names: Zhou Enlai, Amin al-Hafiz.'
        tags: [name:zhou-enlai, polity:prc, polity:syria, vis:only:prc+syria]
  - add:
      entry:
        id: cal.1965-06-10.china-leadership
        when: 'June 10'
        date: '1965-06-10'
        thread: china-leadership
        c: 'Zhou reaches Beijing. To the civil aviation crew who made the first long international flight: "The road is made by walking; you did well."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 736 (June 10, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-06-12.china-leadership
        when: 'June 12'
        date: '1965-06-12'
        thread: china-leadership
        c: 'Zhou, on the "Outline of the Agricultural Situation": "not well enough written". Suggests Liu and Deng call a Politburo meeting soon to hear the State Council''s agriculture and forestry office orally.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 736 (June 12, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-14.china-leadership
        when: 'June 14'
        date: '1965-06-14'
        thread: china-leadership
        also: [south-asia, africa]
        c: 'Zhou gives a cocktail party for the ambassadors of Pakistan, Tanzania and other states, thanking those he has just visited and those he stopped in for their warm welcome.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 737 (June 14, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan, polity:tanzania]
  - add:
      entry:
        id: cal.1965-06-14.china-leadership-2
        when: 'June 14'
        date: '1965-06-14'
        thread: china-leadership
        c: 'Zhou, told Li Zongren has flown from the United States to Zurich, tells Cheng Siyuan in Hong Kong to come to Beijing to settle Li''s return. See [[cal.1965-07-12.china-leadership]].'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 737 (June 14, 1965). Made public: 1997. Names: Zhou Enlai, Cheng Siyuan, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-15.china-leadership
        when: 'June 15'
        date: '1965-06-15'
        thread: china-leadership
        also: [africa]
        c: 'Zhou goes to Hangzhou and studies with Mao the questions of calling the second Asian-African conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 737 (June 15, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-15.china-leadership-2
        when: 'June 15'
        date: '1965-06-15'
        thread: china-leadership
        also: [vietnam-hanoi, africa]
        c: 'Zhou, Hangzhou, talks with Hồ Chí Minh and tells him how the second Asian-African conference stands.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 737 (June 15, 1965). Made public: 1997. Names: Zhou Enlai, Hồ Chí Minh.'
        tags: [name:zhou-enlai, name:ho-chi-minh, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-06-16.china-leadership-2
        when: 'June 16'
        date: '1965-06-16'
        thread: china-leadership
        also: [africa]
        c: 'Liu Shaoqi names Zhou head of the Chinese government delegation to the second Asian-African conference, Chen Yi deputy head. The delegation is to go to Algiers after visiting the UAR.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 738 (June 16, 1965). Names: Zhou Enlai, Liu Shaoqi, Chen Yi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:chen-yi, polity:prc]
  - add:
      entry:
        id: cal.1965-06-17.china-leadership
        when: 'June 17'
        date: '1965-06-17'
        thread: china-leadership
        also: [congo]
        c: 'Zhou returns to Beijing. With Deng Yingchao receives Lumumba''s widow: the Chinese people have always remembered him; his heroic death against imperialism and colonialism is a call to the anti-imperialist peoples of Africa and of China and the world.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 737 (June 17, 1965). Names: Zhou Enlai, Deng Yingchao.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-06-18.china-leadership
        when: 'June 18'
        date: '1965-06-18'
        thread: china-leadership
        also: [middle-east, africa]
        c: 'Zhou and Chen Yi leave Beijing at the UAR''s invitation. Before leaving tells Zhou Rongxin, Xu Bing, Ping Jiesan and Tong Xiaopeng to tell Cheng Siyuan: the government gives Li Zongren travel money, which Cheng carries to Switzerland; Cheng gets travel money to go and bring Li back; a responsible man will contact Cheng at Zurich and help.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 737–38 (June 18, 1965). Names: Zhou Enlai, Chen Yi, Cheng Siyuan.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:uar]
  - add:
      entry:
        id: cal.1965-06-19.china-leadership
        when: 'June 19'
        date: '1965-06-19'
        thread: china-leadership
        c: 'Zhou, flying over the Mingteke pass in Xinjiang, wires greetings to the navigation and weather station staff.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 738 (June 19, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-06-19.china-leadership-2
        when: 'June 19'
        date: '1965-06-19'
        thread: china-leadership
        also: [africa, middle-east]
        c: 'Zhou, at Cairo, learns of the coup in Algeria, Houari Boumedienne''s overthrow of Ben Bella. Since the "June 19 affair" bears on the date of the conference at Algiers, tells Premier Sabri he may have to stay several days.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 738 (June 19, 1965). Made public: 1997. Names: Zhou Enlai, Sabri.'
        tags: [name:zhou-enlai, name:sabri-ali, polity:prc, polity:uar, vis:only:prc+uar]
  - add:
      entry:
        id: cal.1965-06-20.china-leadership
        when: 'June 20'
        date: '1965-06-20'
        thread: china-leadership
        also: [africa, middle-east]
        c: 'Zhou, first talk with Nasser: both agree to take no stand on whether the second Asian-African conference can meet on time until they have consulted each other and others. At the state banquet: China has always supported the conference; its attitude is positive, as before.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 738 (June 20, 1965). Made public: 1997. Names: Zhou Enlai, Nasser.'
        tags: [name:zhou-enlai, name:nasser-gamal-abdel, polity:prc, polity:uar, vis:only:prc+uar]
  - add:
      entry:
        id: cal.1965-06-20.china-leadership-2
        when: 'June 20'
        date: '1965-06-20'
        thread: china-leadership
        also: [africa]
        c: 'Zhou and Chen Yi wire the Foreign Ministry for the Center, and for Ambassador Zeng Tao at Algiers: after the talk with Nasser, best to send an advance party under Zhang Hanfu to Algiers, so as to show indirectly support for the new leadership. June 21 the Central Committee wires Zhou: in outside activity it still holds for the conference on time.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 738 (June 20, 1965). Made public: 1997. Names: Zhou Enlai, Chen Yi, Zhang Hanfu.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-21.china-leadership
        when: 'June 21'
        date: '1965-06-21'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, second and third talks with Nasser; both agree to work to hold the conference on time.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 738 (June 21, 1965). Made public: 1997. Names: Zhou Enlai, Nasser.'
        tags: [name:zhou-enlai, name:nasser-gamal-abdel, polity:prc, polity:uar, vis:only:prc+uar]
  - add:
      entry:
        id: cal.1965-06-22.china-leadership
        when: 'June 22'
        date: '1965-06-22'
        thread: china-leadership
        also: [africa]
        c: 'Zhou and Chen Yi wire the heads of state and foreign ministers of the Asian and African states that have relations with China: the Standing Committee of the second conference''s preparatory meeting decided on June 20 at Algiers to meet on time; the Chinese government fully supports it.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 738 (June 22, 1965). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-22.china-leadership-2
        when: 'June 22'
        date: '1965-06-22'
        thread: china-leadership
        also: [africa, soviet-union]
        c: 'Zhou, fourth talk with Nasser: the second conference''s anti-imperialist, anti-colonialist tone must not be below the second non-aligned conference''s, or it is a weak meeting; what matters is to state the nature of aggression; second, name old friends, a clear line; whether to name is secondary; how to propose it to be talked over with friends. Whether or not it meets on time, Bandung''s ten principles stand and he will work for them.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 738–39 (June 22, 1965). Made public: 1997. Names: Zhou Enlai, Nasser.'
        tags: [name:zhou-enlai, name:nasser-gamal-abdel, polity:prc, polity:uar, vis:only:prc+uar]
  - add:
      entry:
        id: cal.1965-06-22.china-leadership-3
        when: 'June 22'
        date: '1965-06-22'
        thread: china-leadership
        also: [africa]
        c: 'Zhou agrees with Chen Yi, on the Central Committee''s reading of Algeria, that Chen Yi lead a party to Algiers that day. Zhou wires the Asian-African heads: China holds to non-interference and treats the Algerian coup so; after close talks with Nasser it is agreed that in the circumstances the new Algerian leadership should be supported, and Asian and African states should prevent a situation in which the conference cannot meet and imperialism applauds.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 739 (June 22, 1965). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc]
  - add:
      entry:
        id: cal.1965-06-22.china-leadership-4
        when: 'June 22'
        date: '1965-06-22'
        thread: china-leadership
        c: 'Zhou, to a foreign guest: China has no marshals now, but former marshals will still receive visiting foreign marshals.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 732 (June 22, 1965). See [[cal.1965-05-22.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-06-23.china-leadership
        when: 'June 23'
        date: '1965-06-23'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, 3 a.m., meets Algeria''s foreign minister Bouteflika, come specially, who tells how the "June 19 affair" came about.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 739 (June 23, 1965). Made public: 1997. Names: Zhou Enlai, Bouteflika.'
        tags: [name:zhou-enlai, polity:prc, polity:algeria, vis:only:prc+algeria]
  - add:
      entry:
        id: cal.1965-06-23.china-leadership-2
        when: 'June 23'
        date: '1965-06-23'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, on the Algerian foreign minister''s account of the difficulty of meeting on time and the UAR''s view, wires the Center and Chen Yi that the conference cannot be forced and sets out the matters and plans for putting it off.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 739 (June 23, 1965). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-24.china-leadership
        when: 'June 24'
        date: '1965-06-24'
        thread: china-leadership
        also: [middle-east, africa]
        c: 'Zhou, talking with Sabri on economic cooperation and Chinese grain for the UAR: bilateral agreements between states are needed to break the international monopoly; small at first but right in direction: equality, mutual benefit, a national economy.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 739 (June 24, 1965). Made public: 1997. Names: Zhou Enlai, Sabri.'
        tags: [name:zhou-enlai, name:sabri-ali, polity:prc, polity:uar, vis:only:prc+uar]
  - add:
      entry:
        id: cal.1965-06-24.china-leadership-2
        when: 'June 24'
        date: '1965-06-24'
        thread: china-leadership
        also: [africa]
        c: 'The Central Committee answers Zhou by wire: putting the conference off is the more active course; he may rest a few days in the UAR and watch.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 739 (June 24, 1965). Made public: 1997. See [[cal.1965-06-23.china-leadership-2]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-26.china-leadership-2
        when: 'June 26'
        date: '1965-06-26'
        thread: china-leadership
        also: [africa, indonesia]
        c: 'Zhou, with Nasser, meets Sukarno at Cairo airport.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 739 (June 26, 1965). Names: Zhou Enlai, Nasser, Sukarno.'
        tags: [name:zhou-enlai, name:nasser-gamal-abdel, name:sukarno, polity:prc, polity:uar, polity:indonesia]
  - add:
      entry:
        id: cal.1965-06-26.china-leadership-3
        when: 'June 26'
        date: '1965-06-26'
        thread: china-leadership
        also: [africa]
        c: 'Zhou meets Somalia''s Prime Minister Hussein at the Chinese embassy. China is for meeting on time; he came to attend; but if no agreement and all states agree to postpone, China will seek common ground, prepare well, never be hasty. In ten years many states have won independence; though problems remain between them, the common wish is chiefly unity, cooperation, against imperialism and colonialism.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 739–40 (June 26, 1965). Made public: 1997. Names: Zhou Enlai, Hussein.'
        tags: [name:zhou-enlai, polity:prc, polity:somalia, vis:only:prc+somalia]
  - add:
      entry:
        id: cal.1965-06-26.china-leadership-4
        when: 'June 26'
        date: '1965-06-26'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives the staff of the Chinese embassy in the UAR, the Chinese representatives and staff of the Afro-Asian People''s Solidarity secretariat, and the students learning Arabic. The Standing Committee of the preparatory meeting, meeting at Algiers, puts the second Asian-African conference off to Nov. 5, 1965, with the foreign ministers'' meeting Oct. 28.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 740 (June 26, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:uar]
  - add:
      entry:
        id: cal.1965-06-27.china-leadership
        when: 'June 27'
        date: '1965-06-27'
        thread: china-leadership
        also: [africa, indonesia]
        c: 'Zhou, at Qubba Palace, Cairo: first talk with Nasser and Sukarno. With the conference postponed, proposes the three states issue a communiqué on the future and Afro-Asian unity.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 740 (June 27, 1965). Made public: 1997. Names: Zhou Enlai, Nasser, Sukarno.'
        tags: [name:zhou-enlai, name:nasser-gamal-abdel, name:sukarno, polity:prc, polity:uar, polity:indonesia, vis:only:prc+uar+indonesia]
  - add:
      entry:
        id: cal.1965-06-27.china-leadership-2
        when: 'June 27'
        date: '1965-06-27'
        thread: china-leadership
        also: [africa]
        c: 'Zhou wires the Foreign Ministry for Chen Yi and the Center: Chen Yi and the delegation to talk separately with the foreign ministers and delegates now at Algiers; Chen Yi to come to Cairo next day with Qiao Guanhua and part of the delegation. In the UAR visits Alexandria with Nasser and sees the farm exhibition, the Helwan steel works, tire and paper plants and naval installations.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 740 (June 27, 1965). Made public: 1997. Names: Zhou Enlai, Chen Yi, Qiao Guanhua.'
        tags: [name:zhou-enlai, name:chen-yi, name:qiao-guanhua, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-28.china-leadership
        when: 'June 28'
        date: '1965-06-28'
        thread: china-leadership
        also: [africa, indonesia, south-asia]
        c: 'Zhou, talks with Sukarno, Ayub Khan and Nasser. Why the conference was put off: chiefly that the delegates at Algiers were not representative enough, black Africa''s share too small; the explosion of the 25th a cause.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 740 (June 28, 1965). Made public: 1997. Names: Zhou Enlai, Sukarno, Ayub Khan, Nasser.'
        tags: [name:zhou-enlai, name:sukarno, name:ayub-khan-mohammad, name:nasser-gamal-abdel, polity:prc, polity:uar, polity:indonesia, polity:pakistan, vis:only:prc+uar+indonesia+pakistan]
  - add:
      entry:
        id: cal.1965-06-28.china-leadership-2
        when: 'June 28'
        date: '1965-06-28'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou and Sukarno cruise the Nile''s scenic stretch by boat.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 740 (June 28, 1965). Names: Zhou Enlai, Sukarno.'
        tags: [name:zhou-enlai, name:sukarno, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-06-29.china-leadership
        when: 'June 29'
        date: '1965-06-29'
        thread: china-leadership
        also: [middle-east, africa]
        c: 'Zhou meets Shukairy, chairman of the Palestine Liberation Organization, Indonesia''s first deputy premier Subandrio, and Pakistan''s foreign minister Bhutto.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 740–41 (June 29, 1965). Made public: 1997. Names: Zhou Enlai, Shukairy, Subandrio, Bhutto.'
        tags: [name:zhou-enlai, name:shukairy-ahmad, name:subandrio, name:bhutto-zulfikar-ali, polity:prc, polity:indonesia, polity:pakistan, vis:only:prc+indonesia+pakistan]
  - add:
      entry:
        id: cal.1965-06-30.china-leadership
        when: 'June 30'
        date: '1965-06-30'
        thread: china-leadership
        also: [africa, indonesia, south-asia]
        c: 'Zhou talks with Sukarno, Nasser and Bhutto (for Ayub Khan). China backs the Conference of New Emerging Forces, but that does not mean a second United Nations: the U.N. remains; China supports many Asian and African friends fighting inside it to have it right its errors and reorganize, above all to fit the new trend among Asian and African states. Keep the two questions apart lest many states misunderstand.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 741 (June 30, 1965). Made public: 1997. Names: Zhou Enlai, Sukarno, Nasser, Bhutto.'
        tags: [name:zhou-enlai, name:sukarno, name:nasser-gamal-abdel, name:bhutto-zulfikar-ali, polity:prc, polity:uar, polity:indonesia, polity:pakistan, vis:only:prc+uar+indonesia+pakistan]
  - add:
      entry:
        id: cal.1965-06-30.china-leadership-2
        when: 'June 30'
        date: '1965-06-30'
        thread: china-leadership
        also: [middle-east]
        c: 'Zhou and Chen Yi end the UAR visit and leave Cairo by special plane for home. At the airport: China will keep doing all it can for the success of the second conference. At Damascus airport talks with Syria''s deputy premier Atasi; next morning a short stop at Karachi.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 741 (June 30, 1965). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:uar, polity:syria]
  - add:
      entry:
        id: cal.1965-07-03.china-leadership
        when: 'July 3'
        date: '1965-07-03'
        thread: china-leadership
        c: 'Zhou flies to Urumqi.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 741 (July 3, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-07-05.china-leadership
        when: 'July 5'
        date: '1965-07-05'
        thread: china-leadership
        c: 'Zhou inspects the Shihezi reclamation area of the Xinjiang Production and Construction Corps. Six sentences for the Corps: war preparation and border defense, at once mobilize; production and building, with more farmland; unity of nationalities, take in more of them by production teams; hard struggle, learn from Daqing; strive for revolution; go forward bravely. Inscribes: "Raise high the victorious red banner of Mao Zedong Thought; war preparation, border defense, production, building, unity of nationalities, hard struggle, strive for revolution, advance bravely!"'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 741–42 (July 5, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-07-05.china-leadership-2
        when: 'July 5'
        date: '1965-07-05'
        thread: china-leadership
        c: 'Zhou receives Shanghai educated youth in Xinjiang. On those from exploiter families or with complex ties: judge by present conduct and stand; birth cannot be chosen, the future can; draw a line from the old class and serve the proletarian cause wholly and there is a bright future. Urges them to put down roots on the border and do farm work well.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 742 (July 5, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-07-06.china-leadership
        when: 'July 6'
        date: '1965-07-06'
        thread: china-leadership
        c: 'Zhou, at the meeting of the Xinjiang region''s Party, government and army cadres, makes eight points: raise Mao Zedong Thought''s banner; strengthen defense; do the "four cleanups" well, not long, basically done in 1966–67; develop production, Xinjiang above and below ground has great potential, to serve as the rear; build key projects, not everything at once, first farming, then defense industry and small third-front building; unity of nationalities, a long task: Han cadres learn Uighur first, respect customs, resolve to work and make revolution in Xinjiang; hard struggle, no free spending or this generation founds and the same destroys; go forward to protect the country and build a revolutionary new Xinjiang. In Xinjiang inspected Kashgar, Urumqi, villages, plants, offices, schools.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 742 (July 6, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-07.china-leadership
        when: 'July 7'
        date: '1965-07-07'
        thread: china-leadership
        c: 'Zhou flies from Urumqi to Beijing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 742 (July 7, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-07-09.china-leadership
        when: 'July 9'
        date: '1965-07-09'
        thread: china-leadership
        c: 'Zhou, on the Central Investigation Department''s opinion on Li Zongren''s return, writes "propose to agree" and sends it to Mao, Liu, Zhu, Deng, Peng and Chen. Mao: the second plan is better. (Footnote: Cheng Siyuan proposed that Li on entering the country issue a written statement at the airport and meet the press, giving his reasons for returning and his anti-imperialist, patriotic stand.) See [[cal.1965-07-12.china-leadership]].'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 742 (July 9, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi, Cheng Siyuan.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:deng-xiaoping, name:peng-zhen, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-10.china-leadership
        when: 'July 10'
        date: '1965-07-10'
        thread: china-leadership
        c: 'Zhou, on the research work of the Foreign Ministry''s information department: researchers must be thoroughly materialist, respect facts, obey truth, put themselves in an objective place, bound by no frame; think in terms of one dividing into two, and having a view, consider the opposite too.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 743 (July 10, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-07-11.china-leadership
        when: 'July 11'
        date: '1965-07-11'
        thread: china-leadership
        c: 'Zhou, with Deng Yingchao and Chen Yi, receives and dines Naradipo, Prince Sihanouk''s son studying in Beijing, and Cambodia''s ambassador in China.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 743 (July 11, 1965). Names: Zhou Enlai, Deng Yingchao, Chen Yi, Sihanouk, Naradipo.'
        tags: [name:zhou-enlai, name:chen-yi, name:norodom-sihanouk, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1965-07-12.china-leadership-2
        when: 'July 12–16'
        date: '1965-07-12'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives Uganda''s Prime Minister Milton Obote, July 12–16: two formal and two private talks. July 15 with Chen Yi goes with him to Shanghai, takes him to the Shanghai industrial exhibition; July 16 to Guangzhou, where they sign the Sino-Ugandan joint communiqué.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 743–44 (July 12–16, 1965). Names: Zhou Enlai, Chen Yi, Obote.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:uganda]
  - add:
      entry:
        id: cal.1965-07-13.china-leadership
        when: 'July 13'
        date: '1965-07-13'
        thread: china-leadership
        c: 'Zhou meets eighteen, former Kuomintang peace-talks delegates and Guangxi-clique figures among them (Zhang Zhizhong, Shao Lizi, Zhang Shizhao, Huang Shaohong, Fu Zuoyi, Huang Qixiang), on Li Zongren''s coming return. Judge a man by his conduct and change; Li returns of his own accord; to Li he has said "four permissibles": settle in China; go on to America later; come again when convenient; stay a while in Europe before deciding; "we keep our word." Urges them to meet Li and talk; he will find time himself.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 743 (July 13, 1965). Made public: 1997. Names: Zhou Enlai, Zhang Zhizhong, Shao Lizi, Zhang Shizhao, Fu Zuoyi, Huang Qixiang, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-13.china-leadership-2
        when: 'July 13'
        date: '1965-07-13'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou receives Lê Thanh Nghị, Vietnam''s deputy premier. Sympathy for Vietnam''s sacrifices in the war against American aggression; recites two lines of Mao''s poem "Returning to Shaoshan": "Where there is sacrifice there is high resolve; we dare make sun and moon shine in a new sky."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 743 (July 13, 1965). Names: Zhou Enlai, Lê Thanh Nghị.'
        tags: [name:zhou-enlai, polity:prc, polity:drv]
  - add:
      entry:
        id: cal.1965-07-14.china-leadership
        when: 'July 14'
        date: '1965-07-14'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou meets Hoàng Văn Hoan, deputy chairman of Vietnam''s National Assembly Standing Committee, and the Vietnamese National Assembly friendship delegation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 743 (July 14, 1965). Names: Zhou Enlai, Hoàng Văn Hoan.'
        tags: [name:zhou-enlai, polity:prc, polity:drv]
  - add:
      entry:
        id: cal.1965-07-15.china-leadership
        when: 'July 15'
        date: '1965-07-15'
        thread: china-leadership
        c: 'Zhou agrees with Mao''s idea that, going to Shanghai with Obote, he stay on some days to meet Li Zongren and return with him to Beijing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 744 (July 15, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Li Zongren.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-16.china-leadership-2
        when: 'July 16'
        date: '1965-07-16'
        thread: china-leadership
        c: 'Zhou, at Guangzhou, sees *The East Is Red* and the Cantonese opera *Storm in the Mountain Village*; receives Hong Kong and Macao representatives, the third group at the Central-South theater festival. *The East Is Red* is to keep being played, written with the people''s blood and sweat; keep improving; to be written on, part by part.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 744 (July 16, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-07-17.china-leadership
        when: 'July 17'
        date: '1965-07-17'
        thread: china-leadership
        c: 'Zhou instructs the Central Investigation Department to tell Ambassador Ding Guoyu in Pakistan: the plan stands; he is to fly home with Li Zongren on a Pakistani airliner, and a responsible man will await Li at Shanghai. At Shanghai stays up the night for news of Li''s plane, rests only on learning it is safe inside China.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 744 (July 17, 1965). Made public: 1997. Names: Zhou Enlai, Ding Guoyu, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-18.china-leadership
        when: 'July 18'
        date: '1965-07-18'
        thread: china-leadership
        c: 'Zhou, at Shanghai Hongqiao airport, tells those come to meet Li Zongren: welcome; honor late in life, historical-materialist; class origin does not decide awareness; one from a reactionary class who awakens can serve a new class; do not hold the saying "an old revolutionary is not as good as a late one, a late one not as good as a nonrevolutionary, a nonrevolutionary not as good as a counterrevolutionary"; his return will have effect on the other side; go back and explain. With Chen Yi, Ye Jianying and others meets Li Zongren and party at the airport; that evening gives a banquet for Li and Mrs. Li at the Shanghai Cultural Club.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 744 (July 18, 1965). Names: Zhou Enlai, Chen Yi, Ye Jianying, Li Zongren.'
        tags: [name:zhou-enlai, name:chen-yi, name:ye-jianying, polity:prc]
  - add:
      entry:
        id: cal.1965-07-19.china-leadership
        when: 'July 19'
        date: '1965-07-19'
        thread: china-leadership
        also: [china]
        c: 'Zhou, at the Shanghai Cultural Club, with Li Zongren: we feared for your safety on so long a journey; Taiwan asks everywhere for news of you and gets false news, their intelligence is behind. On Sino-American relations, Taiwan, the "third force" and Li''s future: the third force has no future, though some will go on, and must lean on an outside power, whether America or Japan, and fail. Repeats the "four permissibles" and free coming and going.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 744–45 (July 19, 1965). Made public: 1997. Names: Zhou Enlai, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-19.china-leadership-2
        when: 'July 19'
        date: '1965-07-19'
        thread: china-leadership
        c: 'Zhou, seeing the Shanghai Dance School''s ballet *The White-Haired Girl*: a success, creative, a good base, to be refined; urges daring creation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 745 (July 19, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-07-20.china-leadership
        when: 'July 20'
        date: '1965-07-20'
        thread: china-leadership
        c: 'Zhou, back in Beijing first, meets Li Zongren''s party at the airport and introduces Li to Puyi and others who came to welcome him.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 745 (July 20, 1965). Names: Zhou Enlai, Li Zongren, Puyi.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-07-21.china-leadership
        when: 'July 21'
        date: '1965-07-21'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, with Liu Shaoqi, receives Somalia''s President Osman.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 745 (July 21, 1965). Names: Zhou Enlai, Liu Shaoqi, Osman.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:aden-abdullah-osman, polity:prc, polity:somalia]
  - add:
      entry:
        id: cal.1965-07-21.china-leadership-2
        when: 'July 21'
        date: '1965-07-21'
        thread: china-leadership
        also: [testing]
        c: 'Zhou talks with heads of the State Science and Technology Commission, then receives the UAR atomic energy delegation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 745 (July 21, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-22.china-leadership
        when: 'July 22–26'
        date: '1965-07-22'
        thread: china-leadership
        c: 'Zhou hears Yu Qiuli and the "small commission" on five mornings, July 22–26, on preliminary plans for the Third Five-Year Plan and the 1966 plan. Next year''s capital construction better held to about 15 billion; for each project ask: whether to list it, whether it belongs in this area, whether its scale and speed are right, whether cooperation is settled. For the Third Plan, 90 billion in all, with 5 billion held in reserve: list projects for 85 billion. (The draft: the Third Plan in substance a war-preparation plan centered on defense, to meet an early, big war, defense first, build the third front into a strategic rear, first the basic conventional arms, together the most urgent and long-lead advanced projects.)'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 745–46 (July 22–26, 1965). Made public: 1997. Names: Zhou Enlai, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-23.china-leadership
        when: 'July 23'
        date: '1965-07-23'
        thread: china-leadership
        also: [japan, testing]
        c: 'Zhou wires the Eleventh World Conference against Atomic and Hydrogen Bombs, Tokyo: China has always stood for total prohibition and destruction of all nuclear weapons; it develops them to break the nuclear monopoly and destroy them.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 746 (July 23, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
  - add:
      entry:
        id: cal.1965-07-23.china-leadership-2
        when: 'July 23'
        date: '1965-07-23'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, at President Osman''s banquet: Asian and African states'' first task is to strengthen unity, defeat imperialist aggression and war plots and its attempts to wreck and split Asian-African unity.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 746 (July 23, 1965). Names: Zhou Enlai, Osman.'
        tags: [name:zhou-enlai, name:aden-abdullah-osman, polity:prc, polity:somalia]
  - add:
      entry:
        id: cal.1965-07-24.china-leadership
        when: 'July 24'
        date: '1965-07-24'
        thread: china-leadership
        c: 'Zhou calls Qian Xinzhong of the Health Ministry on sending urban medical workers to the countryside: too few teams went; more should; the aim is to teach and train rural health workers and improve the peasants'' care; call them to serve the people, today the 85 percent of the population in the villages. (Note: the Ministry''s party committee had, on Mao''s view of June 26, reported on shifting health work''s weight to the countryside, one third of urban medical and administrative staff to be always there.)'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 746 (July 24, 1965). Made public: 1997. Names: Zhou Enlai, Qian Xinzhong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-25.china-leadership-2
        when: 'July 25'
        date: '1965-07-25'
        thread: china-leadership
        also: [south-asia, africa]
        c: 'Zhou, with Liu Shaoqi, talks with Ne Win, chairman of Burma''s Revolutionary Council, arrived July 24.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 746–47 (July 25, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Ne Win.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:ne-win, polity:prc, polity:burma, vis:only:prc+burma]
  - add:
      entry:
        id: cal.1965-07-26.china-leadership
        when: 'July 26'
        date: '1965-07-26'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, talking with Ne Win, explains in detail the change of government in Algeria and the postponement of the second Asian-African conference, and that China does not interfere in Algeria''s affairs; then goes with Mao to receive Ne Win.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 746–47 (July 26, 1965). Made public: 1997. Names: Zhou Enlai, Ne Win, Mao Zedong.'
        tags: [name:zhou-enlai, name:ne-win, name:mao-zedong, polity:prc, polity:burma, vis:only:prc+burma]
  - add:
      entry:
        id: cal.1965-07-27.china-leadership-2
        when: 'July 27'
        date: '1965-07-27'
        thread: china-leadership
        also: [africa]
        c: 'Zhou flies to Shanghai and goes on talking with Osman.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 747 (July 27, 1965). Names: Zhou Enlai, Osman.'
        tags: [name:zhou-enlai, name:aden-abdullah-osman, polity:prc, polity:somalia]
  - add:
      entry:
        id: cal.1965-07-29.china-leadership
        when: 'July 29–31'
        date: '1965-07-29'
        thread: china-leadership
        c: 'Zhou goes with Ne Win to the Jiangnan paper mill and the industrial exhibition at Shanghai (July 29); to the PLA''s Shanghai garrison and militia display (July 30); July 31 flies with Ne Win and wife to Kunming and tours Lake Dian; back to Beijing Aug. 1. July 29 also hears presentations of the Shanghai Opera House design.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 747 (July 29–31, 1965). Names: Zhou Enlai, Ne Win.'
        tags: [name:zhou-enlai, name:ne-win, polity:prc, polity:burma]
  - add:
      entry:
        id: cal.1965-08-02.china-leadership
        when: 'Aug. 2'
        date: '1965-08-02'
        thread: china-leadership
        also: [europe-and-the-alliance-france, china]
        c: 'Zhou receives André Malraux, minister of state for cultural affairs and de Gaulle''s special envoy.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 747 (Aug. 2, 1965). Names: Zhou Enlai, Malraux, de Gaulle.'
        tags: [name:zhou-enlai, name:de-gaulle-charles, polity:prc, polity:fr]
  - add:
      entry:
        id: cal.1965-08-03.china-leadership-2
        when: 'Aug. 3'
        date: '1965-08-03'
        thread: china-leadership
        also: [indonesia, africa]
        c: 'Zhou, with Cambodia''s ambassador, on the second Asian-African conference''s failure to meet on time, where the two states differ: the wording differs but the demand and aim are one; differences in interpreting some questions do not hurt the common struggle.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 747 (Aug. 3, 1965). Made public: 1997. Names: Zhou Enlai, Zhang Gang.'
        tags: [name:zhou-enlai, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1965-08-04.china-leadership
        when: 'Aug. 4, 6 and 18'
        date: '1965-08-04'
        thread: china-leadership
        c: 'Zhou calls responsible officials on the farm-machinery trust, Aug. 4, 6 and 18.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 747 (Aug. 4, 6 and 18, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-06.china-leadership
        when: 'Aug. 6'
        date: '1965-08-06'
        thread: china-leadership
        c: 'Zhou presides over the CPPCC National Committee''s tea party welcoming Li Zongren and Mrs. Li Guo Dejie home.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 747 (Aug. 6, 1965). Names: Zhou Enlai, Li Zongren, Guo Dejie.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-08-08.china-leadership
        when: 'Aug. 8'
        date: '1965-08-08'
        thread: china-leadership
        also: [indonesia, vietnam-hanoi]
        c: 'Zhou receives Cambodia''s deputy premier and the head of state''s private adviser Song Siang and his delegation; they settle Prince Sihanouk''s holiday in China in September. Tells them: the Third Five-Year Plan, the third stage, is about to begin; industry and farming have grown and some heads are hot again, wanting more, with over 1,200 large projects this year; it must be cut back; the experience of the first two stages must be summed up so as to make fewer mistakes in the third.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 747–48 (Aug. 8, 1965). Made public: 1997. Names: Zhou Enlai, Sihanouk, Song Siang.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1965-08-09.china-leadership
        when: 'Aug. 9–10'
        date: '1965-08-09'
        thread: china-leadership
        also: [testing]
        c: 'Zhou chairs the 13th meeting of the Special Commission. The preparations for the joined-bombs test go well; next, tactical missiles. Tests to be as economical as possible; the commission''s use is to push on and pool wisdom.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 748 (Aug. 9–10, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-11.china-leadership-2
        when: 'Aug. 11'
        date: '1965-08-11'
        thread: china-leadership
        c: 'Zhou, at the Culture Ministry''s film conference, after an Aug. 5 hearing on film work, reports on literary and art policy: creation must start from present reality, not from definitions; to carry out Mao''s thought on art and the Party''s line one must first know the life and feelings of workers, peasants and soldiers; best have life practice first, then better artistic practice; arts troupes to go down three years and join the "four cleanups" at points.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 748 (Aug. 11, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-08-11.china-leadership-3
        when: 'Aug. 11'
        date: '1965-08-11'
        thread: china-leadership
        c: 'Zhou, in recent days, calls officials repeatedly on the farm-machinery company, allocation and management of goods, and adjusting this year''s capital construction; this day with other central leaders hears on specialization in farm management.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 748 (Aug. 11, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-12.china-leadership
        when: 'Aug. 12'
        date: '1965-08-12'
        thread: china-leadership
        c: 'Zhou twice hears Bo Yibo and others on materials work. On the supply stations and service teams: good, sum up the experience; set up joint, general or special stations by place and case. On stock-taking: warehouses to be cleared every few years; "people go through rectification, goods through stock-taking"; every five years. Tighten cadres, ideological and political work, or graft and bribery will grow; tie it to one''s work; materials offices see goods and not people.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 748 (Aug. 12, 1965). Made public: 1997. Names: Zhou Enlai, Bo Yibo.'
        tags: [name:zhou-enlai, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-12.china-leadership-2
        when: 'Aug. 12'
        date: '1965-08-12'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou receives Trần Văn Thanh, head of the National Liberation Front''s permanent mission in China, who hands him a letter from Front chairman Nguyễn Hữu Thọ to Mao, Liu, Zhu and Zhou, thanking them and the Chinese people for support of the South Vietnamese struggle against American aggression.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 748–49 (Aug. 12, 1965). Made public: 1997. Names: Zhou Enlai, Trần Văn Thanh, Nguyễn Hữu Thọ, Mao Zedong, Liu Shaoqi, Zhu De.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:zhu-de, polity:prc, polity:nlf, vis:only:prc+nlf]
  - add:
      entry:
        id: cal.1965-08-13.china-leadership
        when: 'Aug. 13–15'
        date: '1965-08-13'
        thread: china-leadership
        c: 'Zhou goes to Shanghai, Aug. 13–15, at the request of the "small commission", to help Li Renjun and the East China provincial and city secretaries study the adjustment of this year''s capital construction. Remarks: planners should manage the production of people as well as goods, the army too should practice family planning; hold population under 800 million in the fifteen-year plan; Shanghai to bring net growth to 1 percent in five years; keep sending city people to the countryside. Labor, wage, education, family planning and going down to be joined; city people to the country year after year: "so long as we do not retire." Water: order the works, Hai, Yellow, Huai, sea first then Huai. Flies back the 15th; later reports on East China to the Standing Committee.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 749 (Aug. 13–15, 1965). Made public: 1997. Names: Zhou Enlai, Li Renjun.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-16.china-leadership
        when: 'Aug. 16'
        date: '1965-08-16'
        thread: china-leadership
        c: 'Zhou attends the family dinner Fu Zuoyi and his wife give for Li Zongren, Mrs. Li and Cheng Siyuan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 749 (Aug. 16, 1965). Names: Zhou Enlai, Fu Zuoyi, Li Zongren, Cheng Siyuan.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-08-16.china-leadership-2
        when: 'Aug. 16–17'
        date: '1965-08-16'
        thread: china-leadership
        c: 'Zhou calls Li Xiannian, Tan Zhenlin and Bo Yibo on foreign trade work, Aug. 16 and 17.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 749 (Aug. 16–17, 1965). Made public: 1997. Names: Zhou Enlai, Li Xiannian, Tan Zhenlin, Bo Yibo.'
        tags: [name:zhou-enlai, name:li-xiannian, name:tan-zhenlin, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-17.china-leadership
        when: 'Aug. 17'
        date: '1965-08-17'
        thread: china-leadership
        also: [vietnam]
        c: 'Zhou, with Mao, Liu, Deng and others, receives the naval officers and men decorated for guarding fisheries. This sea fight was well fought: small boats sank a big ship by close, night and group fighting; at sea too fight close, night, in groups, split the enemy, take the weak and small first, then the big, isolated and strong.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 749–50 (Aug. 17, 1965). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, polity:prc]
  - add:
      entry:
        id: cal.1965-08-17.china-leadership-2
        when: 'Aug. 17'
        date: '1965-08-17'
        thread: china-leadership
        c: 'Zhou attends the dinner He Long and Luo Ruiqing give Li Zongren.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 750 (Aug. 17, 1965). Names: Zhou Enlai, He Long, Luo Ruiqing, Li Zongren.'
        tags: [name:zhou-enlai, name:he-long, name:luo-ruiqing, polity:prc]
  - add:
      entry:
        id: cal.1965-08-19.china-leadership
        when: 'Aug. 19'
        date: '1965-08-19'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives the Zambian government delegation. Ten years after Bandung the first task of Asian and African states is to hold independence, sovereignty and integrity, win equal standing, support those not yet free and those suffering neocolonial interference, subversion and armed aggression; the second, the common struggle in the economy, equality, mutual benefit and aid.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 750 (Aug. 19, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:zambia]
  - add:
      entry:
        id: cal.1965-08-19.china-leadership-2
        when: 'Aug. 19'
        date: '1965-08-19'
        thread: china-leadership
        also: [soviet-union, africa]
        c: 'Zhou receives the Guinean government delegation under Diop, minister of posts and telecommunications. The Sino-Soviet ideological split must bear on politics; ideas show in actions and policy; no purely theoretical dispute leaves relations untouched, none is "pure"; that is empty talk.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 750 (Aug. 19, 1965). Names: Zhou Enlai, Diop.'
        tags: [name:zhou-enlai, polity:prc, polity:guinea]
  - add:
      entry:
        id: cal.1965-08-20.china-leadership
        when: 'Aug. 20'
        date: '1965-08-20'
        thread: china-leadership
        also: [vietnam, china]
        c: 'Zhou, in talks with the Zambian delegation, sets out the Vietnam background: the American "unconditional negotiation" is a plot. The war will not widen into a world war, though no one''s wish alone decides; if the U.S. fights China it cannot pass China; China will not ask others to fight. China''s four sentences: China will not start a war; Chinese keep their word; China is prepared; once war starts it has no limits.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 750 (Aug. 20, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:zambia, vis:only:prc+zambia]
  - add:
      entry:
        id: cal.1965-08-21.china-leadership
        when: 'Aug. 21'
        date: '1965-08-21'
        thread: china-leadership
        also: [soviet-union, africa]
        c: 'Zhou, talks with the Guinean delegation: the Sino-Soviet differences do not bar independent states and organizations from seeking Soviet aid, which if sincere, useful and effective is better the more; any international conference now to settle the Sino-Soviet differences, of friendly African states or others, is premature.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 750 (Aug. 21, 1965). Made public: 1997. Names: Zhou Enlai, Diop.'
        tags: [name:zhou-enlai, polity:prc, polity:guinea, vis:only:prc+guinea]
  - add:
      entry:
        id: cal.1965-08-22.china-leadership
        when: 'Aug. 22'
        date: '1965-08-22'
        thread: china-leadership
        c: 'Zhou calls responsible officials on exchange of new technique and secrecy.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 751 (Aug. 22, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-23.china-leadership
        when: 'Aug. 23'
        date: '1965-08-23'
        thread: china-leadership
        c: 'Zhou chairs the 158th plenary meeting of the State Council. On the long-term plan he condenses Mao''s "watch war, famine, everything for the people" into "prepare for war, prepare for famine, for the people": rely on the people, first serve them; war preparation is class struggle, at home and abroad; famine preparation is the struggle with nature, to bring industry and farming through; all three one whole. The meeting agrees to call the first People''s Congress of the Tibet Autonomous Region, to constitute the region, for the NPC Standing Committee; it approves on the 25th at its 15th meeting.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 751 (Aug. 23, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-24.china-leadership
        when: 'Aug. 24'
        date: '1965-08-24'
        thread: china-leadership
        also: [congo]
        c: 'Zhou receives Soumialot, chairman of the Supreme Revolutionary Council of the Congo (Leopoldville). Revolutionaries should care for their families, but where interests clash the revolution comes first.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 751 (Aug. 24, 1965). Names: Zhou Enlai, Soumialot.'
        tags: [name:zhou-enlai, polity:prc, polity:congo]
  - add:
      entry:
        id: cal.1965-08-25.china-leadership
        when: 'Aug. 25'
        date: '1965-08-25'
        thread: china-leadership
        c: 'Zhou and Chen Yi wire Afghanistan''s Prime Minister and Foreign Minister Dr. Mohammad Yusuf on the fifth anniversary of the Sino-Afghan friendship and mutual non-aggression treaty: cooperation has grown in every field; a good neighborly example for states of different systems. Yusuf''s greeting arrives the same day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 751 (Aug. 25, 1965). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:afghanistan]
  - add:
      entry:
        id: cal.1965-08-25.china-leadership-2
        when: 'Aug. 25–27'
        date: '1965-08-25'
        thread: china-leadership
        also: [africa, vietnam]
        c: 'Zhou has four talks with the Algerian government delegation under Rabah Bitat, minister of state, Aug. 25–27. The U.S. is working peace-talk plots everywhere to win a seat and stay in Vietnam; beware the U.S. using Algeria''s influence and its friendship with Asian states; do not be taken in.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 751 (Aug. 25–27, 1965). Made public: 1997. Names: Zhou Enlai, Rabah Bitat.'
        tags: [name:zhou-enlai, polity:prc, polity:algeria, vis:only:prc+algeria]
  - add:
      entry:
        id: cal.1965-08-27.china-leadership
        when: 'Aug. 27'
        date: '1965-08-27'
        thread: china-leadership
        c: 'Zhou calls the Central Broadcasting Bureau on local stations, county stations, commune amplifiers and loudspeakers. Central programs for the countryside, news, science, arts, must truly suit it; local stations serve it best; records and television too. Tibet''s new region and townships to have transistor radios fit for the plateau.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 752 (Aug. 27, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-27.china-leadership-2
        when: 'Aug. 27'
        date: '1965-08-27'
        thread: china-leadership
        c: 'Zhou visits Zhang Zhizhong, ill.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 752 (Aug. 27, 1965). Names: Zhou Enlai, Zhang Zhizhong.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-08-27.china-leadership-3
        when: 'Aug. 27'
        date: '1965-08-27'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou receives Kirti Nidhi Bista, vice-chairman of Nepal''s Council of Ministers and minister for foreign affairs, land reform, food and agriculture. China agrees to aid two roads, aid for Nepal''s second five-year plan including small hydro and other projects, and foreign-exchange aid for housing like last year''s grant to the King. Agrees with doing farm and industry together, small first, fast and good.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 752 (Aug. 27, 1965). Made public: 1997. Names: Zhou Enlai, Kirti Nidhi Bista.'
        tags: [name:zhou-enlai, polity:prc, polity:nepal, vis:only:prc+nepal]
  - add:
      entry:
        id: cal.1965-08-28.china-leadership
        when: 'Aug. 28'
        date: '1965-08-28'
        thread: china-leadership
        c: 'Zhou hears the Water and Power Ministry party group on the national water conservancy conference. Keep revolution and fight conservatism to the end; China''s people have ambition to remake nature, to be passed down generation to generation, with the errors of water work too; Chinese history is five thousand years old and flood-control experience still not summed up. The conference summary must tell the difficulty: farming''s base is backward and uneven by region, season, weather and water. No wild farm targets; from below, truthful; learn the laws. Farm modernization is Mao''s strategic line; water serves production, not water for its own sake, with a long view. Do not fear saying "poor": China is poor and will be rich; no free spending; "keep to poor-style hard work, though there is money."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 752–53 (Aug. 28, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-29.china-leadership
        when: 'Aug. 29'
        date: '1965-08-29'
        thread: china-leadership
        c: 'Zhou attends the signing of the Sino-Nepalese protocol on building roads.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 752 (Aug. 29, 1965). See [[cal.1965-08-27.china-leadership-3]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:nepal]
  - add:
      entry:
        id: cal.1965-08-30.china-leadership
        when: 'Aug. 30–Sept. 8'
        date: '1965-08-30'
        thread: china-leadership
        c: 'Zhou hears Gu Mu and the "small commission" seven times, Aug. 30 to Sept. 8, on their investigations in the regions for the Third Plan and the 1966 plan, and discusses revisions.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 753 (Aug. 30–Sept. 8, 1965). Made public: 1997. Names: Zhou Enlai, Gu Mu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-31.china-leadership
        when: 'Aug. 31'
        date: '1965-08-31'
        thread: china-leadership
        also: [china]
        c: 'Zhou, on Taiwan: haste is useless; it may drag on; if we do not see Taiwan liberated in our lifetime the next generation or the next will; we need only sow the seed and open the road right.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 753 (Aug. 31, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08.china-leadership
        when: 'Aug.'
        date: '1965-08'
        thread: china-leadership
        c: 'Zhou, in August, on Li Fuchun''s letter from Beidaihe raising questions on Yu Qiuli''s outline for the Third Plan (how to show Mao''s three elements, the people, war, disaster; margin and the initiative; second and third line building): "good views here; the copy I received already went to Qiuli; study and use them in drafting."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 753 (Aug. 1965). Made public: 1997. Check: the day. Names: Zhou Enlai, Li Fuchun, Yu Qiuli.'
        tags: [name:zhou-enlai, name:li-fuchun, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-01.china-leadership
        when: 'Sept. 1'
        date: '1965-09-01'
        thread: china-leadership
        c: 'Zhou meets Song Qingling at the airport on her arrival in Beijing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 753 (Sept. 1, 1965). Names: Zhou Enlai, Song Qingling.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-09-01.china-leadership-2
        when: 'Sept. 1'
        date: '1965-09-01'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhou, with Zhu De, Dong Biwu, Deng Xiaoping and others, receives the Vietnam–China Friendship Association delegation under Trần Huy Liệu; attends the capital''s meeting for the twentieth anniversary of the Democratic Republic of Vietnam.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 754 (Sept. 1, 1965). Names: Zhou Enlai, Zhu De, Dong Biwu, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:zhu-de, name:dong-biwu, name:deng-xiaoping, polity:prc, polity:drv]
  - add:
      entry:
        id: cal.1965-09-01.china-leadership-3
        when: 'Sept. 1'
        date: '1965-09-01'
        thread: china-leadership
        also: [china]
        c: 'The first session of the Tibet Autonomous Region''s People''s Congress opens at Lhasa (to Sept. 9) and the region is formally founded. Zhou meant to go for the Center, but plateau climate and health stopped him; Xie Fuzhi leads the delegation instead.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 753 (Sept. 1, 1965). Made public: 1997. Names: Zhou Enlai, Xie Fuzhi.'
        tags: [name:zhou-enlai, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-02.china-leadership-2
        when: 'Sept. 2'
        date: '1965-09-02'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou, at Ambassador Trần Tử Bình''s national-day reception: sharply condemns the U.S. for playing a peace-talk fraud on Vietnam; China''s people firmly support the Vietnamese to fight the U.S. to the end.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 754 (Sept. 2, 1965). Names: Zhou Enlai, Trần Tử Bình.'
        tags: [name:zhou-enlai, polity:prc, polity:drv]
  - add:
      entry:
        id: cal.1965-09-02.china-leadership
        when: 'Sept. 2'
        date: '1965-09-02'
        thread: china-leadership
        c: 'The State Planning Commission, on Zhou''s view, sets the total scale of capital construction in the Third Plan at 85 billion yuan in its outline of the plan''s arrangement.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 754 (Sept. 2, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-03.china-leadership
        when: 'Sept. 3'
        date: '1965-09-03'
        thread: china-leadership
        also: [soviet-union, vietnam, africa]
        c: 'Zhou, in talks with Diop: the American war on Vietnam is the first question for Asia and Africa and the world watches; so he said publicly at the Vietnam anniversary reception that unless Vietnam is supported there is no point in a second Asian-African conference. New China''s construction has had three periods: learning from the Soviet Union, much copying and little creation, with faults; from the Second Plan the general line, Mao''s creation, but too much "fast and more", not enough dialectics, with bad weather and the Soviet withdrawal of experts and tearing up of hundreds of contracts, which led to readjustment in the last two years of the Second Plan; now the economy is restored and growing; from next year the third, the Third Plan. With imperialism there are war and aggression; China builds in peace and prepares for the war the U.S. may force on it.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 754 (Sept. 3, 1965). Made public: 1997. Names: Zhou Enlai, Diop.'
        tags: [name:zhou-enlai, polity:prc, polity:guinea, vis:only:prc+guinea]
  - add:
      entry:
        id: cal.1965-09-04.china-leadership
        when: 'Sept. 4'
        date: '1965-09-04'
        thread: china-leadership
        c: 'Zhou attends the Politburo meeting, which hears Health Minister Qian Xinzhong and in the main agrees to the Ministry party committee''s report shifting health work''s weight to the countryside.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 755 (Sept. 4, 1965). Made public: 1997. Names: Zhou Enlai, Qian Xinzhong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-06.china-leadership
        when: 'Sept. 6'
        date: '1965-09-06'
        thread: china-leadership
        c: 'Zhou attends the Politburo meeting; hears Vice-Minister of Culture Xiao Wangdong on the Ministry''s work.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 755 (Sept. 6, 1965). Made public: 1997. Names: Zhou Enlai, Xiao Wangdong.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-07.china-leadership
        when: 'Sept. 7'
        date: '1965-09-07'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou receives Pakistani ambassador Raza on the spread of the local Kashmir clash between India and Pakistan to a general one. The Chinese government issues a statement the same day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 755 (Sept. 7, 1965). Made public: 1997. Names: Zhou Enlai, Raza.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1965-09-08.china-leadership
        when: 'Sept. 8'
        date: '1965-09-08'
        thread: china-leadership
        also: [middle-east, china]
        c: 'Zhou answers in writing questions of Kamal Amer, editor of the Middle East News Agency, then in China: the chief threat to peace is U.S. imperialism''s policies of aggression and war. The Asian-African Conference is of Asian and African states; the Soviet Union is neither, and has no standing to attend; the first conference for this reason did not invite it; China will struggle to the end to hold the principle.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 755 (Sept. 8, 1965). Names: Zhou Enlai, Kamal Amer.'
        tags: [name:zhou-enlai, polity:prc, polity:uar]
  - add:
      entry:
        id: cal.1965-09-09.china-leadership
        when: 'Sept. 9'
        date: '1965-09-09'
        thread: china-leadership
        c: 'Zhou inscribes for sports: "Raise high the red banner of Mao Zedong Thought; build the people''s sport, build the people''s health, serve socialism, bring glory to the motherland."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 755 (Sept. 9, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-09-10.china-leadership
        when: 'Sept. 10'
        date: '1965-09-10'
        thread: china-leadership
        also: [vietnam, china]
        c: 'Zhou receives Han Suyin on Sino-American relations and the Vietnam war.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 755 (Sept. 10, 1965). Names: Zhou Enlai, Han Suyin.'
        tags: [name:zhou-enlai, polity:prc, polity:us]
  - add:
      entry:
        id: cal.1965-09-14.china-leadership
        when: 'Sept. 14'
        date: '1965-09-14'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives Mali''s minister of development Kouyaté. A state with great potential in farming and the economy first solves its people''s food, clothing and use; so it withstands imperialist blockade; the most basic road. Anti-imperialist and anti-colonial struggle in independent Africa is not over; under common imperialist pressure, step by step toward self-reliance; always guard against and resist interference, sabotage and aggression.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 755 (Sept. 14, 1965). Names: Zhou Enlai, Kouyaté.'
        tags: [name:zhou-enlai, polity:prc, polity:mali]
  - add:
      entry:
        id: cal.1965-09-17.china-leadership
        when: 'Sept. 17'
        date: '1965-09-17'
        thread: china-leadership
        also: [indonesia, africa]
        c: 'Zhou receives Omar Dani, commander of Indonesia''s air force. Whether the second Asian-African conference can be held and well is a question to study; he would like to exchange views with Sukarno and Subandrio.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 756 (Sept. 17, 1965). Made public: 1997. Names: Zhou Enlai, Omar Dani.'
        tags: [name:zhou-enlai, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1965-09-17.china-leadership-2
        when: 'Sept. 17'
        date: '1965-09-17'
        thread: china-leadership
        also: [japan]
        c: 'Zhou goes with Mao to receive Hakamada Satomi and others of the Japanese Communist Party''s Politburo and Secretariat.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 756 (Sept. 17, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Hakamada Satomi.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, polity:japan, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1965-09-18.china-leadership-2
        when: 'Sept. 18'
        date: '1965-09-18'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou and Bo Yibo, on Chinese sailors'' contacts with Soviet seamen at sea, tell the transport offices: keep principle and be flexible; where met, not to greet is not good; contacts and work with the Soviet seamen at large to be planned and prepared.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 756 (Sept. 18, 1965). Made public: 1997. Names: Zhou Enlai, Bo Yibo.'
        tags: [name:zhou-enlai, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-18.china-leadership-3
        when: 'Sept. 18'
        date: '1965-09-18'
        thread: china-leadership
        c: 'Zhou views all the rushes of the just-filmed *The East Is Red*: one more push to make it perfect, finish early, show it on National Day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 756 (Sept. 18, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-09-19.china-leadership-2
        when: 'Sept. 19–21'
        date: '1965-09-19'
        thread: china-leadership
        also: [vietnam, soviet-union]
        c: 'Zhou, on Mao''s instruction, with Liu Shaoqi, Deng Xiaoping, Luo Ruiqing and others calls a forum of the Military Commission on the development of the situation at home and abroad and its prospects as bearing on war, Sept. 19–21.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 756 (Sept. 19–21, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Luo Ruiqing.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-21.china-leadership
        when: 'Sept. 21'
        date: '1965-09-21'
        thread: china-leadership
        c: 'Zhou calls Luo Qingchang, Wu Lengxi and others on helping Li Zongren prepare his press conference; at Li''s request names Wu Lengxi, Gong Peng, Zhang Yan and Yao Zhen as its advisers.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 756 (Sept. 21, 1965). Made public: 1997. Names: Zhou Enlai, Luo Qingchang, Wu Lengxi, Gong Peng, Zhang Yan, Yao Zhen, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-22.china-leadership
        when: 'Sept. 22'
        date: '1965-09-22'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou receives the Indonesian economic delegation. The Museum of the Chinese Revolution shows only part of the revolution, incomplete, with more of the good and successful than of errors and setbacks; to be added to. Experience of success alone is partial; we face errors and find how to correct them, and so go forward.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 756–57 (Sept. 22, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:indonesia]
  - add:
      entry:
        id: cal.1965-09-23.china-leadership-2
        when: 'Sept. 23'
        date: '1965-09-23'
        thread: china-leadership
        c: 'Zhou calls Li Zongren on his press conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 757 (Sept. 23, 1965). Made public: 1997. Names: Zhou Enlai, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-24.china-leadership
        when: 'Sept. 24'
        date: '1965-09-24'
        thread: china-leadership
        c: 'Zhou, on Xinhua''s reports on farm output: stress farming''s unevenness; no stress on targets; weigh the good and the bad; criticize "water for water''s sake", water is for production; stress hard struggle, no dropping it once a little better off; put "good" before "big"; not everything to be "big".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 757 (Sept. 24, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-24.china-leadership-2
        when: 'Sept. 24'
        date: '1965-09-24'
        thread: china-leadership
        c: 'Zhou flies to Chongqing to meet Sihanouk, calls on him the same day. Orders the offices to enlarge and rebuild Chongqing airport, unfit for use, and shorten the road from it to town.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 757 (Sept. 24, 1965). Made public: 1997. Names: Zhou Enlai, Sihanouk.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1965-09-25.china-leadership
        when: 'Sept. 25–27'
        date: '1965-09-25'
        thread: china-leadership
        also: [indonesia, laos]
        c: 'Zhou, with Chen Yi and Mrs. Chen, goes with Sihanouk and Princess Monique from the Red Rock memorial in Chongqing by boat to Wuhan; two private talks with Sihanouk on the way, the Gorges seen on the 26th. The boat reaches Wuhan the 27th; Zhou flies back to Beijing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 757 (Sept. 25–27, 1965). Made public: 1997. Names: Zhou Enlai, Chen Yi, Sihanouk.'
        tags: [name:zhou-enlai, name:chen-yi, name:norodom-sihanouk, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1965-09-26.china-leadership
        when: 'Sept. 26'
        date: '1965-09-26'
        thread: china-leadership
        c: 'Li Zongren holds a press conference for Chinese and foreign journalists at the CPPCC auditorium.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 757 (Sept. 26, 1965). See [[cal.1965-09-23.china-leadership-2]]. Names: Li Zongren.'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1965-09-28.china-leadership
        when: 'Sept. 28'
        date: '1965-09-28'
        thread: china-leadership
        c: 'Zhou, with Liu Shaoqi, Dong Biwu, Zhu De and others, meets Sihanouk and party at the airport, come for the sixteenth anniversary of the People''s Republic and a state visit.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 757 (Sept. 28, 1965). Names: Zhou Enlai, Liu Shaoqi, Dong Biwu, Zhu De, Sihanouk.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:dong-biwu, name:zhu-de, name:norodom-sihanouk, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1965-09-29.china-leadership
        when: 'Sept. 29'
        date: '1965-09-29'
        thread: china-leadership
        c: 'Zhou, with Liu Shaoqi and others, opens the exhibition "Cambodia Today" on ten years'' building.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 757 (Sept. 29, 1965). Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1965-09-29.china-leadership-2
        when: 'Sept. 29'
        date: '1965-09-29'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, learning that an African state''s leader means to invite non-African states as observers to an African summit, tells an official of an African state then in China: such a bad precedent must not be set, regional meetings would be wrecked.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 757 (Sept. 29, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-30.china-leadership
        when: 'Sept. 30'
        date: '1965-09-30'
        thread: china-leadership
        c: 'Zhou goes with Sihanouk through the Beijing Electron Tube Factory; urges workers to rely on themselves, work hard for strength, use advanced technique.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 758 (Sept. 30, 1965). Names: Zhou Enlai, Sihanouk.'
        tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1965-09-30.china-leadership-2
        when: 'Sept. 30'
        date: '1965-09-30'
        thread: china-leadership
        also: [indonesia, laos, vietnam-hanoi]
        c: 'Zhou, with Liu Shaoqi, talks with Sihanouk.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 758 (Sept. 30, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Sihanouk.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:norodom-sihanouk, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1965-09-30.china-leadership-3
        when: 'Sept. 30'
        date: '1965-09-30'
        thread: china-leadership
        c: 'Zhou speaks at the National Day reception in the Great Hall: in international affairs distinguish right from wrong; support the just, oppose the unjust; deadly enemies of aggressors and oppressors, good friends of peoples who resist aggression and oppression.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 758 (Sept. 30, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-09-30.china-leadership-4
        when: 'Sept. 30–Oct. 1'
        date: '1965-09-30'
        thread: china-leadership
        also: [indonesia, africa, soviet-union]
        c: 'Zhou receives Haji Saleh, head of Indonesia''s provisional People''s Consultative Congress, Sept. 30 and Oct. 1. China still wants the Asian-African conference to meet and succeed; but obstacles stand: U.S.–Soviet cooperation, and use of the U.N., from outside and inside, to wreck it and lower its anti-imperialist, anti-colonial key. The Bandung spirit cannot fail; if no second conference, it will be raised higher.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 758 (Sept. 30–Oct. 1, 1965). Made public: 1997. Names: Zhou Enlai, Haji Saleh.'
        tags: [name:zhou-enlai, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
