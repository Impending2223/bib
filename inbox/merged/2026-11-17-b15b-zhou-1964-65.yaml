        date: '1964-04-13'
        thread: china-leadership
        also: [congo, africa]
        c: 'Zhou twice receives envoys: Antoine from the Congo (Brazzaville), and Mitudidi, Politburo member of the African Solidarity Party of the Congo (Leopoldville).'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 634 (Apr. 13–14, 1964). Made public: 1997. Names: Zhou Enlai, Antoine, Mitudidi.'
        tags: [name:zhou-enlai, polity:prc, polity:congo-brazzaville, polity:congo, vis:only:prc+congo-brazzaville+congo]
  - add:
      entry:
        id: cal.1964-04-13.china-leadership-3
        when: 'Apr. 13'
        date: '1964-04-13'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives the Algerian cultural delegation under Ben Nabi, adviser to the National Guidance Department. After talks he asks himself what he said right and wrong: one may err in anything said or done, only looking back lets one go forward. Mao Zedong Thought is the guide in work and thought, but thinking shifts with surroundings and the world; what is ripe is fuller and truer, the new or little thought through may err; do not take all the Chinese leaders say as right.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 634 (Apr. 13, 1964). Names: Zhou Enlai, Ben Nabi.'
        tags: [name:zhou-enlai, polity:prc, polity:algeria]
  - add:
      entry:
        id: cal.1964-04-13.china-leadership-4
        when: 'Apr. 13'
        date: '1964-04-13'
        thread: china-leadership
        also: [japan]
        c: 'Zhou receives Matsumura Kenzō, Liberal Democratic Party adviser and Diet member, and his party.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 634 (Apr. 13, 1964). Names: Zhou Enlai, Matsumura Kenzō.'
        tags: [name:zhou-enlai, polity:prc, polity:japan]
