        n: '[[w.zhou-enlai-nianpu-1949]], II, 628 (Mar. 22, 1964). Names: Zhou Enlai, Liu Shaoqi, Ayub Khan.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:ayub-khan-mohammad, polity:prc, polity:pakistan]
