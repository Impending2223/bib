  - add:
      entry:
        id: cal.1965-12-27.china-leadership
        when: 'Dec. 27'
        date: '1965-12-27'
        thread: china-leadership
        c: 'Zhou, with Deng, Li Fuchun, Xu Xiangqian, Ye Jianying and others, goes to the airport to meet the ashes of Lai Chuanzhu, political commissar of the Shenyang Military Region, flown from Shenyang, and escorts them to the Babaoshan Revolutionary Cemetery.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 770 (Dec. 27, 1965). Names: Zhou Enlai, Deng Xiaoping, Li Fuchun, Xu Xiangqian, Ye Jianying, Lai Chuanzhu.'
        tags: [name:zhou-enlai, name:deng-xiaoping, name:li-fuchun, name:xu-xiangqian, name:ye-jianying, polity:prc]
  - add:
      entry:
        id: cal.1965-12-29.china-leadership
        when: 'Dec. 29–31'
        date: '1965-12-29'
        thread: china-leadership
        also: [testing]
        c: 'Zhou chairs the 14th meeting of the Special Commission on the defense industry''s finishing three years'' work in two. The atom bomb''s success was the work of pooled wisdom; this year the year of joining the two bombs, next year the missile year, a step on in missiles, the year after greater results. Everything divides in two; sum up, discover, invent, create, advance, or fall behind; always modest and prudent. Calls all to learn from Wang Jie''s "carry the motherland in the breast, look to the world", lines he much admires. The meeting approves the plans for 1966 and 1967, among them tactical missiles, nuclear submarines and satellites.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 770 (Dec. 29–31, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
