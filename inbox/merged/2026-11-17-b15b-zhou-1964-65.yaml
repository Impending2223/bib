        date: '1964-04-05'
        thread: china-leadership
        also: [laos]
        c: 'Zhou: talks with Souvanna Phouma. On Laos''s internal question the central point is whether the government of national union can carry out its declaration and the three-party agreements.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 632 (Apr. 5, 1964). Made public: 1997. Names: Zhou Enlai, Souvanna Phouma.'
        tags: [name:zhou-enlai, name:souvanna-phouma, polity:prc, polity:laos, vis:only:prc+laos]
