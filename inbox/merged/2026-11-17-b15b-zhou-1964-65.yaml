      entry:
        id: cal.1964-04-07.china-leadership
        when: 'Apr. 7'
        date: '1964-04-07'
        thread: china-leadership
        also: [laos]
        c: 'Zhou, at Beijing airport, sees off Souvanna Phouma and the Lao delegation going on to Guangzhou: China will go on supporting the Lao people''s just struggle for national independence and sovereignty.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 632 (Apr. 7, 1964). Names: Zhou Enlai, Souvanna Phouma.'
        tags: [name:zhou-enlai, name:souvanna-phouma, polity:prc, polity:laos]
