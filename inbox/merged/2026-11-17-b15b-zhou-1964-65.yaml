        c: 'Zhou goes to Mao''s for a meeting; talks about the African trip.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 629 (Mar. 26, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
