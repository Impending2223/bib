        thread: china-leadership
        c: 'Zhou and Liu Shaoqi talk with E. F. Hill, chairman of the Central Committee of the Communist Party of Australia (Marxist-Leninist).'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 634 (Apr. 12, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Hill.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, polity:australia, vis:only:prc+australia]
