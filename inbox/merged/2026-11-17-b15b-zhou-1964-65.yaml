patch: 2026-11-17-b15b-zhou-1964-65
by: 'Claude (batch 15, second wave, reader 3: *Zhou Enlai nianpu, 1949–1976*, the 1997 three-volume edition, vol. II (中卷), the owner''s Drive scan), Nov. 17, 2026'
ops:
  - add:
      entry:
        id: cal.1964-01-01.china-leadership
        when: 'Jan. 1'
        date: '1964-01-01'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Tirana, with Shehu: wreath at the Martyrs'' Cemetery; visits the museum of the national liberation struggle. Same day, receives the staff of the Chinese embassy, students and experts.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 606 (Jan. 1, 1964). Names: Zhou Enlai, Hoxha, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1964-01-02.china-leadership
        when: 'Jan. 2'
        date: '1964-01-02'
        thread: china-leadership
        also: [soviet-union, africa]
        c: 'Zhou, Tirana: first and second talks with Hoxha, Albanian Workers'' Party first secretary, and Premier Shehu. Hears Hoxha on Albania''s construction and the international situation. Zhou: the Chinese Central Committee thinks the meeting of the eleven parties can be put off until conditions ripen; bilateral talks can be held meanwhile.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 606 (Jan. 2, 1964). Made public: 1997. Names: Zhou Enlai, Hoxha, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1964-01-02.china-leadership-2
        when: 'Jan. 2'
        date: '1964-01-02'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Tirana: attends the Cuban embassy''s reception for Cuba''s Liberation Day. Tells Shehu he likes folk songs and sings them himself; regrets young people no longer sing them, no longer like their own national culture.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 606 (Jan. 2, 1964). Names: Zhou Enlai, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, polity:cuba]
  - add:
      entry:
        id: cal.1964-01-03.china-leadership
        when: 'Jan. 3'
        date: '1964-01-03'
        thread: china-leadership
        also: [soviet-union, africa]
        c: 'Zhou, Tirana: third and fourth talks with Hoxha, Shehu and others on the international situation and Sino-Soviet relations.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 606 (Jan. 3, 1964). Made public: 1997. Names: Zhou Enlai, Hoxha, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1964-01-03.china-leadership-2
        when: 'Jan. 3'
        date: '1964-01-03'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Tirana, afternoon: with Hoxha, Shehu and Balluku, visits the Stalin textile combine. Evening, watches the ballet *Halili and Hajrija*.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 606 (Jan. 3, 1964). Names: Zhou Enlai, Hoxha, Shehu, Balluku.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1964-01-04.china-leadership
        when: 'Jan. 4'
        date: '1964-01-04'
        thread: china-leadership
        also: [africa]
        c: 'Zhou goes to Shkodër, northern Albania. Speaks at the mass meeting in Stalin Square. Same day, visits the city''s livestock research institute.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 606–07 (Jan. 4, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1964-01-05.china-leadership-2
        when: 'Jan. 5'
        date: '1964-01-05'
        thread: china-leadership
        also: [soviet-union, africa]
        c: 'Zhou returns to Tirana. Fifth talks with Hoxha, Shehu and others. Says the two parties agree on matters of principle; the later conduct of the anti-revisionist struggle and the assessment of the situation can be discussed further.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 607 (Jan. 5, 1964). Made public: 1997. Names: Zhou Enlai, Hoxha, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1964-01-06.china-leadership
        when: 'Jan. 6'
        date: '1964-01-06'
        thread: china-leadership
        also: [africa]
        c: 'Zhou wires condolences to Nkrumah, wounded in an assassination attempt. With the delegation decides not to cancel the Ghana visit despite the unsettled situation: sends the delegation''s secretary-general Huang Zhen ahead, to see Nkrumah with Ambassador Huang Hua. Proposal: drop the airport welcome; talks and banquets inside the castle where Nkrumah lives.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 607 (Jan. 6, 1964). Made public: 1997. Names: Zhou Enlai, Nkrumah, Huang Zhen, Huang Hua.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, name:huang-zhen, name:huang-hua, polity:prc, polity:ghana, vis:only:prc+ghana]
  - add:
      entry:
        id: cal.1964-01-06.china-leadership-2
        when: 'Jan. 6–7'
        date: '1964-01-06'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, with Hoxha and Shehu, visits Vlorë: speaks at the mass meeting, tours the independence monument. Next day tours the Lenin cement works, an asbestos-pipe plant site, a cooperative and a peasant home, and returns to Tirana.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 607 (Jan. 6–7, 1964). Names: Zhou Enlai, Hoxha, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1964-01-07.china-leadership
        when: 'Jan. 7'
        date: '1964-01-07'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou, Tirana: sixth talks with Hoxha, Shehu and others, on the struggle against revisionism and the two countries'' construction.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 607 (Jan. 7, 1964). Made public: 1997. Names: Zhou Enlai, Hoxha, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1964-01-08.china-leadership
        when: 'Jan. 8'
        date: '1964-01-08'
        thread: china-leadership
        c: 'Zhou, Tirana: seventh and eighth talks on both countries'' construction. Lenin said to do more and say less; in 1958 China''s propaganda had faults, corrected later. Approves Albania''s line of agriculture as base, industry as leading factor; three points: farm output for grain, raw materials and labor; keep enough labor in the countryside until it is mechanized; raise living standards only as production grows, measured against the country''s own past. Comparing the Soviet Union with the United States, East Germany with West, ends in promises unmet and the people discontented.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 607–08 (Jan. 8, 1964). Made public: 1997. Names: Zhou Enlai, Hoxha, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1964-01-08.china-leadership-2
        when: 'Jan. 8'
        date: '1964-01-08'
        thread: china-leadership
        c: 'Zhou, Tirana, afternoon: speaks at the mass meeting of Tirana''s people.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 608 (Jan. 8, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1964-01-08.china-leadership-3
        when: 'Jan. 8'
        date: '1964-01-08'
        thread: china-leadership
        also: [soviet-union]
        c: 'Zhou and Shehu sign the Chinese–Albanian joint statement: China condemns imperialism, reactionaries and modern revisionism for isolating and striking at Albania; supports Albania''s defense of the fatherland and of peace in the Balkans. During the visit receives the crew of a Chinese ocean freighter in Durrës: the ports of Huangpu and Durrës are two piers of friendship.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 608 (Jan. 8, 1964). Names: Zhou Enlai, Shehu.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1964-01-09.china-leadership
        when: 'Jan. 9'
        date: '1964-01-09'
        thread: china-leadership
        also: [africa]
        c: 'Zhou leaves Tirana for Tunis.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 608 (Jan. 9, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:tunisia]
  - add:
      entry:
        id: cal.1964-01-09.china-leadership-2
        when: 'Jan. 9'
        date: '1964-01-09'
        thread: china-leadership
        also: [africa, middle-east]
        c: 'Zhou and Chen Yi call on President Bourguiba; first private talk. Supports Tunisia''s struggle for full independence, economic too; thanks Tunisia for its support of China''s seat in the United Nations. Asian-African states share the aim of ending colonial backwardness; differences of system or method can be respected; contacts matter.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 608 (Jan. 9, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, Bourguiba.'
        tags: [name:zhou-enlai, name:chen-yi, name:bourguiba-habib-ben-ali, polity:prc, polity:tunisia, vis:only:prc+tunisia]
  - add:
      entry:
        id: cal.1964-01-09.china-leadership-3
        when: 'Jan. 9'
        date: '1964-01-09'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Tunis, evening: at Bourguiba''s state dinner answers his objections to China''s foreign policy in a spirit of seeking common ground. Bourguiba later: agrees with Zhou''s line; Tunisia will establish relations with China.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 608–09 (Jan. 9, 1964). Made public: 1997. Names: Zhou Enlai, Bourguiba.'
        tags: [name:zhou-enlai, name:bourguiba-habib-ben-ali, polity:prc, polity:tunisia, vis:only:prc+tunisia]
  - add:
      entry:
        id: cal.1964-01-10.china-leadership
        when: 'Jan. 10'
        date: '1964-01-10'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Tunis: second private talk with Bourguiba.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 609 (Jan. 10, 1964). Made public: 1997. Names: Zhou Enlai, Bourguiba.'
        tags: [name:zhou-enlai, name:bourguiba-habib-ben-ali, polity:prc, polity:tunisia, vis:only:prc+tunisia]
  - add:
      entry:
        id: cal.1964-01-10.china-leadership-2
        when: 'Jan. 10'
        date: '1964-01-10'
        thread: china-leadership
        also: [africa, middle-east]
        c: 'The Chinese–Tunisian joint communiqué issued: support for decolonization in Africa, for the Palestinian people, for general disarmament and a complete ban on nuclear weapons; the two decide to establish diplomatic relations.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 609 (Jan. 10, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:tunisia]
  - add:
      entry:
        id: cal.1964-01-10.china-leadership-3
        when: 'Jan. 10'
        date: '1964-01-10'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Tunis: visits the Tunisian dairy company STIL, a handicraft center in the suburbs, a rural district some fifty kilometers from Tunis, and the Neo-Destour Political Bureau headquarters.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 609 (Jan. 10, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:tunisia]
  - add:
      entry:
        id: cal.1964-01-10.china-leadership-4
        when: 'Jan. 10'
        date: '1964-01-10'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, evening, interview with Tunisia''s *Action*: Asian and African countries made brilliant cultures; backwardness is the work of foreign aggression; they will rise again. Leaves Tunis for Ghana.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 609 (Jan. 10, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:tunisia]
  - add:
      entry:
        id: cal.1964-01-11.china-leadership
        when: 'Jan. 11'
        date: '1964-01-11'
        thread: china-leadership
        also: [africa]
        c: 'Zhou arrives in Accra; welcomed at the airport by a three-man committee for Nkrumah and crowds. Drives through the city.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 609 (Jan. 11, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-01-11.china-leadership-2
        when: 'Jan. 11'
        date: '1964-01-11'
        thread: china-leadership
        also: [africa]
        c: 'Zhou calls on Nkrumah at Osu Castle; hands him Mao''s letter of sympathy. At Nkrumah''s informal dinner denounces imperialist sabotage and subversion of the new African states and the attempt on Nkrumah''s life.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 609 (Jan. 11, 1964). Made public: 1997. Names: Zhou Enlai, Nkrumah.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, polity:prc, polity:ghana, vis:only:prc+ghana]
  - add:
      entry:
        id: cal.1964-01-12.china-leadership-2
        when: 'Jan. 12'
        date: '1964-01-12'
        thread: china-leadership
        also: [africa, china]
        c: 'Zhou, Accra: first talk with Nkrumah. Expresses concern again for the attack on him. On the American block on China''s seat: what is wanted is restoration of China''s legal seat, not admission, tied to expelling Chiang.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 609–10 (Jan. 12, 1964). Made public: 1997. Names: Zhou Enlai, Nkrumah.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, polity:prc, polity:ghana, vis:only:prc+ghana]
  - add:
      entry:
        id: cal.1964-01-12.china-leadership-3
        when: 'Jan. 12'
        date: '1964-01-12'
        thread: china-leadership
        also: [africa]
        c: 'Zhou and Chen Yi receive the whole staff of the Chinese embassy in Ghana and the Chinese experts.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 610 (Jan. 12, 1964). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-01-12.china-leadership-4
        when: 'Jan. 12'
        date: '1964-01-12'
        thread: china-leadership
        also: [latin-america-panama]
        c: 'Zhou and Liu Shaoqi wire Panama''s President Chiari: condemn the American killing of Panamanians; support Panama''s demands for full revision of the canal treaty and withdrawal of American troops.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 610 (Jan. 12, 1964). Names: Zhou Enlai, Liu Shaoqi, Chiari.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:chiari-roberto-f, polity:prc, polity:panama]
  - add:
      entry:
        id: cal.1964-01-13.china-leadership
        when: 'Jan. 13'
        date: '1964-01-13'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, with Ghana''s Minister of Transport and Works Bensah, visits the new harbor and industrial base at Tema.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 610 (Jan. 13, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-01-13.china-leadership-2
        when: 'Jan. 13'
        date: '1964-01-13'
        thread: china-leadership
        also: [africa]
        c: 'Zhou: second talk with Nkrumah. Peace and an end to aggressive war, general disarmament and a ban on nuclear weapons come only through struggle; peace cannot be begged. Armed struggle ends with imperialism forced to negotiate; talks rest on struggle. Supports an African nuclear-free zone on conditions: foreign bases out, the Sahara''s included; the end aim total ban and destruction of nuclear weapons. A summit some day, all countries equal. Nkrumah: his position is China''s.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 610 (Jan. 13, 1964). Made public: 1997. Names: Zhou Enlai, Nkrumah.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, polity:prc, polity:ghana, vis:only:prc+ghana]
  - add:
      entry:
        id: cal.1964-01-13.china-leadership-3
        when: 'Jan. 13'
        date: '1964-01-13'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, at Nkrumah''s state dinner: the African national liberation movement is advancing irresistibly; African and Asian countries must strengthen unity.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 610–11 (Jan. 13, 1964). Names: Zhou Enlai, Nkrumah.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-01-14.china-leadership
        when: 'Jan. 14'
        date: '1964-01-14'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Accra: first and second private talks with Nkrumah. Revolution needs a leading core with a body of disciplined cadres and a broad united front abroad; a reliable army; a fit economic policy of self-reliance. Restates China''s five principles for relations with African states.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 611 (Jan. 14, 1964). Made public: 1997. Names: Zhou Enlai, Nkrumah.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, polity:prc, polity:ghana, vis:only:prc+ghana]
  - add:
      entry:
        id: cal.1964-01-14.china-leadership-2
        when: 'Jan. 14'
        date: '1964-01-14'
        thread: china-leadership
        also: [africa]
        c: 'Zhou and Chen Yi receive Shirley Graham Du Bois, widow of W. E. B. Du Bois, and give condolences.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 611 (Jan. 14, 1964). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-01-15.china-leadership
        when: 'Jan. 15'
        date: '1964-01-15'
        thread: china-leadership
        also: [africa, china]
        c: 'Zhou: third talk with Nkrumah; answering the Ghana News Agency states China''s eight principles of economic and technical aid. The China–Mali joint communiqué of Jan. 21 wrote them in.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 611–12 (Jan. 15, 1964). Names: Zhou Enlai, Nkrumah.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-01-15.china-leadership-2
        when: 'Jan. 15'
        date: '1964-01-15'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Osu Castle, farewell banquet: peoples must proceed from their own conditions, rely on themselves.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 612 (Jan. 15, 1964). Names: Zhou Enlai, Nkrumah.'
        tags: [name:zhou-enlai, name:nkrumah-kwame, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-01-15.china-leadership-3
        when: 'Jan. 15'
        date: '1964-01-15'
        thread: china-leadership
        also: [africa]
        c: 'Zhou and Chen Yi, in the Ghana State House, give a dinner for the Ghanaian service staff and toast them.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 612 (Jan. 15, 1964). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-01-16.china-leadership
        when: 'Jan. 16'
        date: '1964-01-16'
        thread: china-leadership
        also: [africa]
        c: 'The Chinese–Ghanaian joint communiqué issued: full support for the struggle against imperialism and colonialism in Africa, Asia and Latin America; a conference of their peoples useful, an Asian-African conference needed; both back peaceful efforts toward direct Sino-Indian talks.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 612 (Jan. 16, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:ghana]
  - add:
      entry:
        id: cal.1964-01-16.china-leadership-2
        when: 'Jan. 16'
        date: '1964-01-16'
        thread: china-leadership
        also: [africa]
        c: 'Zhou flies to Bamako, starts the visit to Mali. Met at the airport by President Keita and crowds. Afternoon, calls on Keita.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 612 (Jan. 16, 1964). Names: Zhou Enlai, Keita.'
        tags: [name:zhou-enlai, name:keita-modibo, polity:prc, polity:mali]
  - add:
      entry:
        id: cal.1964-01-17.china-leadership-3
        when: 'Jan. 17'
        date: '1964-01-17'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, with Keita, visits Koulikoro; at the mass meeting accepts the title of honorary citizen. Aid is mutual: friendly new states building their economies is great aid to China. Tours the shipping company, repair shop, oil mill, and the Chinese economic exhibition in Bamako.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 612 (Jan. 17, 1964). Names: Zhou Enlai, Keita.'
        tags: [name:zhou-enlai, name:keita-modibo, polity:prc, polity:mali]
  - add:
      entry:
        id: cal.1964-01-18.china-leadership
        when: 'Jan. 18'
        date: '1964-01-18'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Bamako: first talk with Keita, on Africa and Mali''s internal and foreign policy.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 612 (Jan. 18, 1964). Made public: 1997. Names: Zhou Enlai, Keita.'
        tags: [name:zhou-enlai, name:keita-modibo, polity:prc, polity:mali, vis:only:prc+mali]
  - add:
      entry:
        id: cal.1964-01-18.china-leadership-2
        when: 'Jan. 18'
        date: '1964-01-18'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Chen Yi and others visit the Sotuba zoological institute near Bamako: its history and management since nationalization; cattle, poultry, laboratories.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 613 (Jan. 18, 1964). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:mali]
  - add:
      entry:
        id: cal.1964-01-19.china-leadership
        when: 'Jan. 19'
        date: '1964-01-19'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Bamako: second and third talks with Keita. Tells him of China''s revolution and construction.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 613 (Jan. 19, 1964). Made public: 1997. Names: Zhou Enlai, Keita.'
        tags: [name:zhou-enlai, name:keita-modibo, polity:prc, polity:mali, vis:only:prc+mali]
  - add:
      entry:
        id: cal.1964-01-19.china-leadership-2
        when: 'Jan. 19'
        date: '1964-01-19'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, with Keita, visits the Sudanese Union party headquarters; trusts Mali will overcome its difficulties; peoples choose their own path, none may interfere.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 613 (Jan. 19, 1964). Names: Zhou Enlai, Keita.'
        tags: [name:zhou-enlai, name:keita-modibo, polity:prc, polity:mali]
  - add:
      entry:
        id: cal.1964-01-20.china-leadership
        when: 'Jan. 20'
        date: '1964-01-20'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Bamako: fourth talk with Keita. Revolution, socialism and Marxism-Leninism cannot be monopolized. Mali''s passage from colonial to socialist economy must have a transition; the more complete the democratic revolution, the better the socialist; in Africa the transition may be long.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 613 (Jan. 20, 1964). Made public: 1997. Names: Zhou Enlai, Keita.'
        tags: [name:zhou-enlai, name:keita-modibo, polity:prc, polity:mali, vis:only:prc+mali]
  - add:
      entry:
        id: cal.1964-01-20.china-leadership-2
        when: 'Jan. 20'
        date: '1964-01-20'
        thread: china-leadership
        also: [africa]
        c: 'Zhou: fifth talk with Keita. On young people: some take socialist construction too lightly, ask much of life and do not know hard work; they also take readily to the new and have drive; they are to be taught, the future is theirs.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 613–14 (Jan. 20, 1964). Made public: 1997. Names: Zhou Enlai, Keita.'
        tags: [name:zhou-enlai, name:keita-modibo, polity:prc, polity:mali, vis:only:prc+mali]
  - add:
      entry:
        id: cal.1964-01-21.china-leadership
        when: 'Jan. 21'
        date: '1964-01-21'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, at Bamako airport, to Mali radio: independent, free Asia and Africa will grow prosperous and strong day by day.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 614 (Jan. 21, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:mali]
  - add:
      entry:
        id: cal.1964-01-21.china-leadership-2
        when: 'Jan. 21'
        date: '1964-01-21'
        thread: china-leadership
        also: [africa]
        c: 'Zhou flies to Conakry, Guinea. With President Touré drives in an open car; greeted with flowers and kola nuts; at the presidency meets Guinea''s notables and watches folk dances.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 614 (Jan. 21, 1964). Names: Zhou Enlai, Touré.'
        tags: [name:zhou-enlai, name:toure-ahmed-sekou, polity:prc, polity:guinea]
  - add:
      entry:
        id: cal.1964-01-21.china-leadership-3
        when: 'Jan. 21'
        date: '1964-01-21'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, at Touré''s evening of arts: Asian and African states have a growing role in world affairs, and their voice cannot be erased. Distribution of seats in the main U.N. organs is unfair; China fully supports every effort to enlarge Asian-African representation. Self-reliance is the road to full independence; but friendly cooperation on equal terms is needed too, with mutual exchange and aid; aid is never to be used for control, plunder, interference or subversion.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 614 (Jan. 21, 1964). Names: Zhou Enlai, Touré.'
        tags: [name:zhou-enlai, name:toure-ahmed-sekou, polity:prc, polity:guinea]
  - add:
      entry:
        id: cal.1964-01-22.china-leadership
        when: 'Jan. 22'
        date: '1964-01-22'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Conakry: first talk with Touré, on Guinea''s internal situation and Africa policy.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 614 (Jan. 22, 1964). Made public: 1997. Names: Zhou Enlai, Touré.'
        tags: [name:zhou-enlai, name:toure-ahmed-sekou, polity:prc, polity:guinea, vis:only:prc+guinea]
  - add:
      entry:
        id: cal.1964-01-24.china-leadership
        when: 'Jan. 24–25'
        date: '1964-01-24'
        thread: china-leadership
        also: [africa]
        c: 'Zhou visits Labé, in the Fouta Djallon highlands five hundred kilometers from Conakry; four more talks with Touré on the 24th and 25th. The first three hear Touré on Guinea and African policy. In the fourth and fifth, on the 25th, Zhou tells China''s experience: revolution must join Marxism-Leninism to China''s realities. Advises Guinea, out of colonial rule, to take a non-capitalist road; farming and light industry first; self-reliance.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 614–15 (Jan. 24–25, 1964). Made public: 1997. Names: Zhou Enlai, Touré.'
        tags: [name:zhou-enlai, name:toure-ahmed-sekou, polity:prc, polity:guinea, vis:only:prc+guinea]
  - add:
      entry:
        id: cal.1964-01-26.china-leadership
        when: 'Jan. 26'
        date: '1964-01-26'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Conakry: private talk with Touré. African unity needs the most awakened states'' leaders to set the example and unite first as its core; their differences are secondary beside the wish for unity.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 615 (Jan. 26, 1964). Made public: 1997. Names: Zhou Enlai, Touré.'
        tags: [name:zhou-enlai, name:toure-ahmed-sekou, polity:prc, polity:guinea, vis:only:prc+guinea]
  - add:
      entry:
        id: cal.1964-01-26.china-leadership-2
        when: 'Jan. 26'
        date: '1964-01-26'
        thread: china-leadership
        also: [africa]
        c: 'Zhou visits the Chinese-built cigarette and match factory sites; hears the site heads; watches Guinean workers demonstrate the cigarette machines.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 615 (Jan. 26, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:guinea]
  - add:
      entry:
        id: cal.1964-01-26.china-leadership-3
        when: 'Jan. 26'
        date: '1964-01-26'
        thread: china-leadership
        also: [china]
        c: 'Huang Zhen, on Zhou''s and Chen Yi''s added views, wires the Foreign Ministry on the American prisoners in China (the Warsaw talks): if the U.S. raises them at the next meeting, stress that it has not carried out the 1955 agreement and ask action showing good faith; never accept handling prisoners and nationals separately, prisoners first and nationals after. The U.S. must carry out the agreement on both the prisoners and the Chinese students.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 615 (Jan. 26, 1964). Made public: 1997. Names: Zhou Enlai, Huang Zhen.'
        tags: [name:zhou-enlai, name:huang-zhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-01-26.china-leadership-4
        when: 'Jan. 26'
        date: '1964-01-26'
        thread: china-leadership
        also: [africa, south-asia]
        c: 'Zhou and Chen Yi wire the Central Committee: agree to the plan for the trip; after Sudan, Ethiopia and Somalia they will go straight back to Kunming to rest; after the Spring Festival, to Pakistan, Ceylon and Burma.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 615–16 (Jan. 26, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-01-26.china-leadership-5
        when: 'Jan. 26'
        date: '1964-01-26'
        thread: china-leadership
        also: [africa]
        c: 'The Chinese–Guinean joint communiqué issued: the time is ripe for a second Asian-African conference and active preparation for it; the two to work against the arbitrary practices of the highly developed countries in trade and aid.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 616 (Jan. 26, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:guinea]
  - add:
      entry:
        id: cal.1964-01-26.china-leadership-6
        when: 'Jan. 26'
        date: '1964-01-26'
        thread: china-leadership
        also: [africa]
        c: 'Zhou has Qiao Guanhua add to the farewell address: Guinea''s people under the Democratic Party and the President push and support the anti-imperialist, anti-colonial struggle of African peoples; Guinean song and dance carry it. At midnight, at Conakry airport, speaks the farewell to Guinea''s *Voice of the Revolution* and flies to Sudan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 616 (Jan. 26, 1964). Names: Zhou Enlai, Qiao Guanhua.'
        tags: [name:zhou-enlai, name:qiao-guanhua, polity:prc, polity:guinea]
  - add:
      entry:
        id: cal.1964-01-27.china-leadership-2
        when: 'Jan. 27'
        date: '1964-01-27'
        thread: china-leadership
        also: [africa]
        c: 'Zhou arrives in Khartoum.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 616 (Jan. 27, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:sudan]
  - add:
      entry:
        id: cal.1964-01-28.china-leadership-2
        when: 'Jan. 28'
        date: '1964-01-28'
        thread: china-leadership
        also: [europe-and-the-alliance-france, china]
        c: 'The Foreign Ministry spokesman, on Zhou''s draft, issues a statement on Sino-French recognition: Peking negotiated as the sole legal government of China; recognizing a new government implies ceasing to recognize the old one the people overthrew. Taiwan is Chinese territory; any attempt to sever it or make "two Chinas" is unacceptable to the Chinese government and people.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 616 (Jan. 28, 1964). See [[cal.1964-01-27.europe-and-the-alliance]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:fr]
  - add:
      entry:
        id: cal.1964-01-28.china-leadership-3
        when: 'Jan. 28–29'
        date: '1964-01-28'
        thread: china-leadership
        also: [africa]
        c: 'Zhou in Sudan: talks with President Abboud. Visits North Khartoum, Omdurman, the cotton region at Gezira in Blue Nile province, the national museum, the Khalifa''s museum.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 616–17 (Jan. 28–29, 1964). Made public: 1997. Names: Zhou Enlai, Abboud.'
        tags: [name:zhou-enlai, name:abboud-ibrahim, polity:prc, polity:sudan, vis:only:prc+sudan]
  - add:
      entry:
        id: cal.1964-01-30.china-leadership-2
        when: 'Jan. 30'
        date: '1964-01-30'
        thread: china-leadership
        also: [africa]
        c: 'The Chinese–Sudanese joint communiqué issued: both willing to work for general disarmament and a total ban on nuclear weapons.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 617 (Jan. 30, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:sudan]
  - add:
      entry:
        id: cal.1964-01-30.china-leadership-3
        when: 'Jan. 30'
        date: '1964-01-30'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, with Abboud, drives in an open car from the Republican Palace to the airport and leaves Khartoum; flies on the invitation of Ethiopia, which has no relations with China, to Asmara.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 617 (Jan. 30, 1964). Names: Zhou Enlai, Abboud.'
        tags: [name:zhou-enlai, name:abboud-ibrahim, polity:prc, polity:sudan, polity:ethiopia]
  - add:
      entry:
        id: cal.1964-01-30.china-leadership-4
        when: 'Jan. 30–31'
        date: '1964-01-30'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, talks with Emperor Haile Selassie. China wants friendship with all African states, takes no side in disputes, will not arm anyone for territorial aggression; its non-involvement is firm. The joint communiqué signed Jan. 31: measures to strengthen relations, among them normalizing the two governments'' relations in the near future. That evening, at the farewell banquet, Zhou toasts it: the communiqué will further relations and defeat outside attempts to spread baseless rumors against them.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 617 (Jan. 30–31, 1964). Made public: 1997. Names: Zhou Enlai, Haile Selassie.'
        tags: [name:zhou-enlai, name:haile-selassie-i, polity:prc, polity:ethiopia, vis:only:prc+ethiopia]
  - add:
      entry:
        id: cal.1964-02-01.china-leadership
        when: 'Feb. 1'
        date: '1964-02-01'
        thread: china-leadership
        also: [africa]
        c: 'Zhou arrives in Mogadishu. Evening, receives from the city''s commissioner Yusuf the freedom key of Mogadishu. At Premier Shermarke''s dinner: the two peoples'' long friendship; Chinese records of the early ninth century mention Somalia; Zheng He in the fifteenth century called at Mogadishu more than once; Somali envoys visited China.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 617 (Feb. 1, 1964). Names: Zhou Enlai, Shermarke.'
        tags: [name:zhou-enlai, name:abdirascid-ali-shermarke, polity:prc, polity:somalia]
  - add:
      entry:
        id: cal.1964-02-02.china-leadership
        when: 'Feb. 2'
        date: '1964-02-02'
        thread: china-leadership
        also: [africa]
        c: 'Zhou calls on President Osman. China first proposed peaceful coexistence, Bandung accepted it; China has signed friendship treaties with many; it stands for peaceful coexistence and for anti-imperialism, and with imperialist aggression there is none.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 617–18 (Feb. 2, 1964). Made public: 1997. Names: Zhou Enlai, Osman.'
        tags: [name:zhou-enlai, name:aden-abdullah-osman, polity:prc, polity:somalia, vis:only:prc+somalia]
  - add:
      entry:
        id: cal.1964-02-02.china-leadership-2
        when: 'Feb. 2'
        date: '1964-02-02'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, Mogadishu: first talk with Shermarke. In Africa he has felt it awake and stand up; the whole continent will be independent, sooner or later. Supports the Addis Ababa resolution on an African nuclear-free zone, adding two points: the nuclear powers must give guarantees, and foreign bases must go, since bases can store nuclear weapons.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 618 (Feb. 2, 1964). Made public: 1997. Names: Zhou Enlai, Shermarke.'
        tags: [name:zhou-enlai, name:abdirascid-ali-shermarke, polity:prc, polity:somalia, vis:only:prc+somalia]
  - add:
      entry:
        id: cal.1964-02-03.china-leadership
        when: 'Feb. 3'
        date: '1964-02-03'
        thread: china-leadership
        also: [africa, china]
        c: 'Zhou, Mogadishu: second talk with Shermarke. French recognition shows a trend, but a majority in the U.N. to restore China''s rights and expel Chiang''s delegate is not certain, the U.S. controls it; if the U.S. sees a majority it will try new tricks, such as leaving Taiwan out; China will never accept that, it would be selling territory; rather than "two Chinas" China stays out of the U.N. Then a private talk with Shermarke: on disputes among African states China does not intervene; economic aid can be given.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 618 (Feb. 3, 1964). Made public: 1997. Names: Zhou Enlai, Shermarke.'
        tags: [name:zhou-enlai, name:abdirascid-ali-shermarke, polity:prc, polity:somalia, vis:only:prc+somalia]
  - add:
      entry:
        id: cal.1964-02-03.china-leadership-2
        when: 'Feb. 3'
        date: '1964-02-03'
        thread: china-leadership
        also: [africa]
        c: 'Zhou, at the Mogadishu mass meeting: independent Africans dare to run their own affairs, scorn every enemy and fight old and new oppressors; this fearlessness is a new state''s greatest wealth.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 618 (Feb. 3, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:somalia]
  - add:
      entry:
        id: cal.1964-02-03.china-leadership-3
        when: 'Feb. 3'
        date: '1964-02-03'
        thread: china-leadership
        also: [europe-and-the-alliance-france]
        c: 'Zhou, evening, to Tesseyre, editor-in-chief of Agence France-Presse: Sino-French recognition is a major event in the present international situation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 618 (Feb. 3, 1964). Names: Zhou Enlai, Tesseyre.'
        tags: [name:zhou-enlai, polity:prc, polity:fr]
  - add:
      entry:
        id: cal.1964-02-04.china-leadership
        when: 'Feb. 4'
        date: '1964-02-04'
        thread: china-leadership
        also: [africa]
        c: 'The Chinese–Somali joint communiqué issued: foreign military bases in Africa and Asia threaten peace and understanding; both will work to abolish them; both unambiguously support more Afro-Asian seats in the main U.N. organs.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 619 (Feb. 4, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:somalia]
  - add:
      entry:
        id: cal.1964-02-04.china-leadership-2
        when: 'Feb. 4–5'
        date: '1964-02-04'
        thread: china-leadership
        also: [africa]
        c: 'Zhou ends the visit to Somalia and ten African countries and leaves Mogadishu for home. Flies to Kunming on the 5th.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 619 (Feb. 4–5, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-02-06.china-leadership-2
        when: 'Feb. 6'
        date: '1964-02-06'
        thread: china-leadership
        c: 'Zhou, Kunming, watches amateur shows by Yunnan garrison units. Told that the actor playing a martyr''s son in the play *The Soldier from the Wasteland* is himself a martyr''s son: he played with feeling, but should not be cast so; years of such pain would wear on him. To the cast: speak clearly, practice standard speech, learn from veteran actors.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 619 (Feb. 6, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-02-07.china-leadership
        when: 'Feb. 7–13'
        date: '1964-02-07'
        thread: china-leadership
        c: 'Zhou rests at Kunming and Chengdu. At Chengdu with Chen Yi visits Du Fu''s thatched cottage; counts the party himself and has the guards buy the tickets.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 619 (Feb. 7–13, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-02-09.china-leadership
        when: 'Feb. 9'
        date: '1964-02-09'
        thread: china-leadership
        also: [africa]
        c: 'Zhou wires the Central Committee and Mao: back four days; poor sleep and no spare time, so he has not telephoned Shangkun, and has not started the report on the trip, "feeling very uneasy". Five days before going abroad again: an outline first, settled with Chen Yi and others and wired to the Center; the full report after the next return.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 619 (Feb. 9, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Yang Shangkun.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-02-13.china-leadership-2
        when: 'Feb. 13'
        date: '1964-02-13'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou wires the Central Committee and Mao: leaves tomorrow for three Asian countries; back Mar. 1; will rest again at Chengdu and write the outline of the report on the fourteen-country trip in Asia, Africa and Europe.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 619 (Feb. 13, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-02-14.china-leadership
        when: 'Feb. 14'
        date: '1964-02-14'
        thread: china-leadership
        c: 'Zhou, with Chen Yi, flies from Kunming at the invitation of General Ne Win, chairman of Burma''s Revolutionary Council, and arrives the same day at Rangoon.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 619–20 (Feb. 14, 1964). Names: Zhou Enlai, Chen Yi, Ne Win.'
        tags: [name:zhou-enlai, name:chen-yi, name:ne-win, polity:prc, polity:burma]
  - add:
      entry:
        id: cal.1964-02-14.china-leadership-2
        when: 'Feb. 14'
        date: '1964-02-14'
        thread: china-leadership
        c: 'Zhou calls on Ne Win, Burma''s Revolutionary Council chairman, and attends his state dinner with Mrs. Ne Win. At the dinner: new Asian and African states that rely on their own peoples and resources, strengthen mutual aid and unity and keep struggling will defeat imperialist schemes and build their countries step by step.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 620 (Feb. 14, 1964). Names: Zhou Enlai, Ne Win.'
        tags: [name:zhou-enlai, name:ne-win, polity:prc, polity:burma]
  - add:
      entry:
        id: cal.1964-02-16.china-leadership
        when: 'Feb. 16'
        date: '1964-02-16'
        thread: china-leadership
        also: [africa, soviet-union]
        c: 'Zhou, Rangoon: long talk with Ne Win on Africa, the international situation, disarmament, a ban on nuclear weapons, a second non-aligned conference, a second Asian-African conference. On Africa: the great situation against imperialism and colonialism; Africans are eager to build their countries; Africa awoke a step after Asia, but since the war, above all since Bandung, national consciousness has risen as never before. Those oppressed four or five centuries by so-called Western civilization suffered more and deeper than Asians. The common tasks: overthrow colonial rule, build a national state, economy and culture, a national armed force, speed African unity; political independence is not enough, economic independence too. Africa is rich and largely unopened; if developed it can feed itself and found industry. Three things to finish the national democratic revolution: a national armed force, smashing the old state machine and building a national one, inheriting and developing national culture.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 620 (Feb. 16, 1964). Made public: 1997. Names: Zhou Enlai, Ne Win.'
        tags: [name:zhou-enlai, name:ne-win, polity:prc, polity:burma, vis:only:prc+burma]
  - add:
      entry:
        id: cal.1964-02-17.china-leadership
        when: 'Feb. 17'
        date: '1964-02-17'
        thread: china-leadership
        also: [europe-and-the-alliance-france, china]
        c: 'Zhou receives the French ambassador in Burma and asks him to tell President de Gaulle: glad of the formal recognition, congratulations; Chiang''s gang has since broken with France, which suits China''s plans. Analyses France''s history and culture: a people of strong national spirit forged by two centuries; the culture double-edged, it spread colonialism and also, by the Revolution and aid to American independence, inspired the colonized. China has always opposed colonialism.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 620–21 (Feb. 17, 1964). Made public: 1997. Names: Zhou Enlai, de Gaulle.'
        tags: [name:zhou-enlai, name:de-gaulle-charles, polity:prc, polity:fr, vis:only:prc+fr]
  - add:
      entry:
        id: cal.1964-02-17.china-leadership-2
        when: 'Feb. 17'
        date: '1964-02-17'
        thread: china-leadership
        c: 'Zhou, Rangoon: talks with Ne Win. At home, anyone with a little patriotism is to be won over and united with; toward Chiang Kai-shek China has always left room and never shut the door to talks. A leader needs boldness at times and patient waiting at times, and both together, so as not to be isolated among many.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 621 (Feb. 17, 1964). Made public: 1997. Names: Zhou Enlai, Ne Win.'
        tags: [name:zhou-enlai, name:ne-win, polity:prc, polity:burma, vis:only:prc+burma]
  - add:
      entry:
        id: cal.1964-02-18.china-leadership
        when: 'Feb. 18'
        date: '1964-02-18'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou signs the Chinese–Burmese joint communiqué, leaves Rangoon and flies to Karachi to begin the visit to Pakistan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 621 (Feb. 18, 1964). Names: Zhou Enlai, Ne Win.'
        tags: [name:zhou-enlai, name:ne-win, polity:prc, polity:burma, polity:pakistan]
  - add:
      entry:
        id: cal.1964-02-19.china-leadership
        when: 'Feb. 19'
        date: '1964-02-19'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, with Foreign Minister Bhutto, visits the Dawood textile mill, one of Pakistan''s largest, east of Karachi. At the welcome: trusts the visit and the coming talks will advance Sino-Pakistani friendship, peace in Asia and the world, Afro-Asian unity. Writes in the visitors'' book praise of Pakistan''s national industry.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 621 (Feb. 19, 1964). Names: Zhou Enlai, Bhutto.'
        tags: [name:zhou-enlai, name:bhutto-zulfikar-ali, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1964-02-19.china-leadership-2
        when: 'Feb. 19'
        date: '1964-02-19'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou and Chen Yi receive the whole staff of the Chinese embassy in Pakistan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 621 (Feb. 19, 1964). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1964-02-20.china-leadership
        when: 'Feb. 20'
        date: '1964-02-20'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou flies to Rawalpindi. First talk with President Ayub Khan. On the Sino-Indian border clash: China holds to peaceful negotiation but cannot give up principle. Reliance on foreign aid alone is a swamp, deeper the more one sinks, an opium habit.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 621 (Feb. 20, 1964). Made public: 1997. Names: Zhou Enlai, Ayub Khan.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1964-02-21.china-leadership
        when: 'Feb. 21'
        date: '1964-02-21'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou, Rawalpindi: second talk with Ayub Khan. China will never follow a provocative policy and is unwilling to use force. The world is changing, forces regrouping; China will watch coolly and exchange views more in diplomacy.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 621–22 (Feb. 21, 1964). Made public: 1997. Names: Zhou Enlai, Ayub Khan.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1964-02-21.china-leadership-2
        when: 'Feb. 21'
        date: '1964-02-21'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, with Bhutto, tours Islamabad, the new capital under construction, and plants a Chinese tallow tree.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 622 (Feb. 21, 1964). Names: Zhou Enlai, Bhutto.'
        tags: [name:zhou-enlai, name:bhutto-zulfikar-ali, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1964-02-21.china-leadership-3
        when: 'Feb. 21'
        date: '1964-02-21'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, evening, with Bhutto: Sino-Pakistani friendship is no expedient; praises President Ayub''s efforts.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 622 (Feb. 21, 1964). Made public: 1997. Names: Zhou Enlai, Bhutto, Ayub Khan.'
        tags: [name:zhou-enlai, name:bhutto-zulfikar-ali, name:ayub-khan-mohammad, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1964-02-22.china-leadership
        when: 'Feb. 22'
        date: '1964-02-22'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou, morning, private talk with Ayub Khan at the presidency, Rawalpindi. To secure a country''s independence: take firm hold of the army; have a leading core in government and party; rely on and unite the people, and foreign intervention need not be feared. Invites Ayub to China; Ayub says it can be announced that he accepts, and that he sets great store by it.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 622 (Feb. 22, 1964). Made public: 1997. Names: Zhou Enlai, Ayub Khan.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1964-02-22.china-leadership-2
        when: 'Feb. 22'
        date: '1964-02-22'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou: third talk with Ayub Khan, afternoon. China''s principle in trade and economic cooperation: common development, no dependent economy, each building its own through mutual help. Once strong, China will still settle China–U.S. relations and the like by negotiation and not provoke; its system and its history forbid expansion, and it has room enough at home. Ayub: thanks; Zhou a wise leader with a statesman''s bearing.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 622 (Feb. 22, 1964). Made public: 1997. Names: Zhou Enlai, Ayub Khan.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1964-02-23.china-leadership-2
        when: 'Feb. 23'
        date: '1964-02-23'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou signs the Chinese–Pakistani joint communiqué: the Sino-Indian border dispute should and can be settled peacefully by negotiation; the Kashmir dispute can be settled in accordance with the wishes of the Kashmiri people.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 622 (Feb. 23, 1964). Names: Zhou Enlai, Ayub Khan.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1964-02-23.china-leadership-3
        when: 'Feb. 23'
        date: '1964-02-23'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, with Bhutto, flies to Lahore, capital of West Pakistan. Same day lays a wreath at the tomb of the poet and philosopher Allama Muhammad Iqbal.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 622 (Feb. 23, 1964). Names: Zhou Enlai, Bhutto.'
        tags: [name:zhou-enlai, name:bhutto-zulfikar-ali, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1964-02-24.china-leadership
        when: 'Feb. 24'
        date: '1964-02-24'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, at the West Pakistan Assembly''s special sitting on its invitation: new Asian and African states have a growing role; to ignore their will, to belittle their standing, to treat them as great powers do small, will run into walls. Flies to Dacca, East Pakistan''s capital.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 623 (Feb. 24, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1964-02-25.china-leadership
        when: 'Feb. 25'
        date: '1964-02-25'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou, Dacca: press conference; receives Qureshi of the Associated Press of Pakistan. Welcomes Ayub''s readiness to mediate between China and the United States. The one way to better relations is for the U.S. to show by deeds it will change its hostile policy. China has done all it could for a peaceful Sino-Indian settlement and will keep trying.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 623 (Feb. 25, 1964). Names: Zhou Enlai, Ayub Khan, Qureshi.'
        tags: [name:zhou-enlai, name:ayub-khan-mohammad, polity:prc, polity:pakistan]
  - add:
      entry:
        id: cal.1964-02-26.china-leadership-2
        when: 'Feb. 26'
        date: '1964-02-26'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, Chen Yi and Song Qingling, newly flown from Kunming to Dacca, leave for Ceylon on Prime Minister Bandaranaike''s invitation. Afternoon, arrive at Colombo; call on the governor-general and his wife.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 623 (Feb. 26, 1964). Names: Zhou Enlai, Chen Yi, Song Qingling, Bandaranaike.'
        tags: [name:zhou-enlai, name:chen-yi, name:bandaranaike-srimavo, polity:prc, polity:ceylon]
  - add:
      entry:
        id: cal.1964-02-26.china-leadership-3
        when: 'Feb. 26'
        date: '1964-02-26'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou and Chen Yi wire the Central Committee and Mao on Pakistan: eight days'' visit, a warm and sincere welcome; the talks with Ayub and Bhutto frank and practical. The communiqué issued; Kashmir: China wants it settled by the wishes of the Kashmiris as both India and Pakistan have pledged.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 623 (Feb. 26, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, Mao Zedong, Ayub Khan, Bhutto.'
        tags: [name:zhou-enlai, name:chen-yi, name:mao-zedong, name:ayub-khan-mohammad, name:bhutto-zulfikar-ali, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-02-27.china-leadership-2
        when: 'Feb. 27'
        date: '1964-02-27'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, with Song Qingling and Chen Yi: first talk with Mrs. Bandaranaike, on the international situation. Same day, wreath with Song Qingling at the tomb of her husband, the late Prime Minister.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 623 (Feb. 27, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, Song Qingling, Bandaranaike.'
        tags: [name:zhou-enlai, name:chen-yi, name:bandaranaike-srimavo, polity:prc, polity:ceylon, vis:only:prc+ceylon]
  - add:
      entry:
        id: cal.1964-02-28.china-leadership-2
        when: 'Feb. 28'
        date: '1964-02-28'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, with Song Qingling and Chen Yi: second talk with Mrs. Bandaranaike. Afro-Asian states that rely first on themselves and also cooperate may catch up with the advanced faster than the two centuries and more industrial states took. China''s loans: low interest or none, repayment extended if need be; aid is mutual, no thanks owed.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 623–24 (Feb. 28, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, Song Qingling, Bandaranaike.'
        tags: [name:zhou-enlai, name:chen-yi, name:bandaranaike-srimavo, polity:prc, polity:ceylon, vis:only:prc+ceylon]
  - add:
      entry:
        id: cal.1964-02-28.china-leadership-3
        when: 'Feb. 28'
        date: '1964-02-28'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, at the mass meeting in Independence Square, Colombo: states large and small can play a part in world affairs if they hold to independence and justice. Imperialist blockade and disruption did not frighten the Chinese people but strengthened their self-reliance; in the end a country is built on its own people''s strength.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 624 (Feb. 28, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:ceylon]
  - add:
      entry:
        id: cal.1964-02-28.china-leadership-4
        when: 'Feb. 28–29'
        date: '1964-02-28'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou: two private talks with Mrs. Bandaranaike on the Sino-Indian boundary. China''s position is negotiation without preconditions, to settle the boundary and serve Sino-Indian friendship, Afro-Asian unity and world peace.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 624 (Feb. 28–29, 1964). Made public: 1997. Names: Zhou Enlai, Bandaranaike.'
        tags: [name:zhou-enlai, name:bandaranaike-srimavo, polity:prc, polity:ceylon, vis:only:prc+ceylon]
  - add:
      entry:
        id: cal.1964-02-29.china-leadership-3
        when: 'Feb. 29'
        date: '1964-02-29'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou, with Song Qingling and Chen Yi: third talk with Mrs. Bandaranaike. The boundary can only be settled peacefully. If Indian troops advance China will act to have the Colombo conference states mediate, not clash with India directly: the three ways it put to the six states: warn and notify them quarterly if a few Indian troops cross; if India takes more territory, ask the six to mediate and press the Indian troops back, China taking no action while they do; if mediation fails, China will take defensive measures. On aid to Asian and African states: look to spirit as well as material; China''s aid is small beside its population; in five or ten years cooperation can be better; cooperation is for common development and never for what colonialism did.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 624–25 (Feb. 29, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, Song Qingling, Bandaranaike.'
        tags: [name:zhou-enlai, name:chen-yi, name:bandaranaike-srimavo, polity:prc, polity:ceylon, vis:only:prc+ceylon]
  - add:
      entry:
        id: cal.1964-02-29.china-leadership-4
        when: 'Feb. 29'
        date: '1964-02-29'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou signs the Chinese–Ceylonese joint communiqué: the Chinese Premier commends the Ceylonese Prime Minister''s step of refusing entry to ships and aircraft carrying nuclear weapons or war gear into Ceylon''s waters, ports and airfields; China will keep seeking direct talks with India on the Colombo proposals to settle the boundary peacefully.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 625 (Feb. 29, 1964). Names: Zhou Enlai, Bandaranaike.'
        tags: [name:zhou-enlai, name:bandaranaike-srimavo, polity:prc, polity:ceylon]
  - add:
      entry:
        id: cal.1964-02-29.china-leadership-5
        when: 'Feb. 29'
        date: '1964-02-29'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, Song Qingling, Chen Yi and the delegation end the Ceylon visit and leave Colombo for home. Fly to Kunming on Mar. 1.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 625 (Feb. 29, 1964). Names: Zhou Enlai, Chen Yi, Song Qingling.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:ceylon]
  - add:
      entry:
        id: cal.1964-03-01.china-leadership
        when: 'Mar. 1'
        date: '1964-03-01'
        thread: china-leadership
        c: 'Zhou, Kunming, after watching shows by the Kunming Military Region''s troupe and others: speech first, then voice; words are content, sound is form; train hard and keep at it, modern plays in local opera are popular but may not last if not improved; do not split song from dance, keep both.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 625 (Mar. 1, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-03-03.china-leadership
        when: 'Mar. 3'
        date: '1964-03-03'
        thread: china-leadership
        c: 'Zhou receives the Albanian forestry engineer Iljaz Nako and the olive expert Betri Romani, who brought Albania''s gift of olive seedlings to Kunming. With them visits the Haikou state forest farm outside Kunming, asks the Albanian experts on olive growing, plants an olive tree himself. Tells the staff to get the trees through five stages: taking root, growth, flowering and fruit, high and stable yield, seed for later generations.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 625 (Mar. 3, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:albania]
  - add:
      entry:
        id: cal.1964-03-01.china-leadership-2
        when: 'Mar. 1–3'
        date: '1964-03-01'
        thread: china-leadership
        c: 'Zhou, in Kunming, gives a banquet for the crew of the Dutch charter plane that flew the tour. Grants their wish to visit Beijing and sends them there in a Chinese plane. The crew: they have flown heads of state and none treated them as the premier did, as equals and with respect. On leaving they offer to serve again.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 626 (Mar. 1–3, 1964). Check: the day, "while in Kunming". Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:netherlands]
  - add:
      entry:
        id: cal.1964-03-01.china-leadership-3
        when: 'Mar. 1–3'
        date: '1964-03-01'
        thread: china-leadership
        c: 'Zhou inspects the Stone Forest scenic area at Kunming: protect it, plant trees and bring water; proposes a small hydroelectric station for nearby minority peoples. Reaches Chengdu in early March.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 626 (Mar. 1–3, 1964). Check: the day. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-03-05.china-leadership-2
        when: 'Mar. 5'
        date: '1964-03-05'
        thread: china-leadership
        also: [south-asia, china]
        c: 'Zhou and Chen Yi report jointly to the Central Committee and Mao on what the Ceylon leaders said in their talks: a second Asian-African conference, a second non-aligned conference, the Sino-Indian boundary.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 626 (Mar. 5, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, Mao Zedong.'
        tags: [name:zhou-enlai, name:chen-yi, name:mao-zedong, polity:prc, polity:ceylon, vis:only:prc+ceylon]
  - add:
      entry:
        id: cal.1964-03-06.china-leadership-2
        when: 'Mar. 6'
        date: '1964-03-06'
        thread: china-leadership
        c: 'Zhou and Chen Yi, Chengdu, visit the light and chemical industry exhibition hall; inscribe: "Seek perfection; strive for the top."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 626 (Mar. 6, 1964). Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc]
  - add:
      entry:
        id: cal.1964-03-14.china-leadership
        when: 'Mar. 14'
        date: '1964-03-14'
        thread: china-leadership
        also: [europe-and-the-alliance]
        c: 'Zhou and Chen Yi, Chengdu, call a forum of ambassadors in Europe home on leave. Ambassadors home are to study, rest and not forget work; an outgoing ambassador stays responsible until the new one takes over. With Western Europe, China''s business is mainly economic: trade should first benefit states that have recognized China; balance trade with Western Europe; ambassadors to work with the foreign-trade bodies; in Northern Europe spread opposition to "two Chinas".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 626 (Mar. 14, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-03-15.china-leadership
        when: 'Mar. 15'
        date: '1964-03-15'
        thread: china-leadership
        c: 'Zhou returns to Beijing in the afternoon. Mao, Liu Shaoqi, Deng Xiaoping and others meet him at the airport.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 626 (Mar. 15, 1964). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
        tags: [name:zhou-enlai, name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, polity:prc]
  - add:
      entry:
        id: cal.1964-03-16.china-leadership-2
        when: 'Mar. 16'
        date: '1964-03-16'
        thread: china-leadership
        c: 'Zhou wires Tsedenbal, Mongolia''s Council of Ministers chairman, concern, sympathy and condolence for the losses of a month of snow and wind. China will give 10,000 tons of feed maize and 200,000 yuan.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 627 (Mar. 16, 1964). Names: Zhou Enlai, Tsedenbal.'
        tags: [name:zhou-enlai, polity:prc, polity:mongolia]
  - add:
      entry:
        id: cal.1964-03-17.china-leadership
        when: 'Mar. 17'
        date: '1964-03-17'
        thread: china-leadership
        c: 'Zhou and Chen Yi receive the Cambodian military delegation under Lt. Gen. Lon Nol, deputy prime minister, defense minister and chief of staff. Zhou: the U.S. blocks China''s entry to the U.N. despite more recognitions, a policy of seeing only the present. Praises Cambodia''s independent, neutral, non-aligned policy: a state, large or small, that upholds justice is supported.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 627 (Mar. 17, 1964). Made public: 1997. Names: Zhou Enlai, Chen Yi, Lon Nol.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1964-03-19.china-leadership
        when: 'Mar. 19'
        date: '1964-03-19'
        thread: china-leadership
        also: [indonesia]
        c: 'Zhou receives Sukarni, Indonesia''s ambassador, and gives four views on a second Asian-African conference: it is not to oppose the non-aligned conference, and more states are to be brought in to lessen resistance; the imperialists would link opposition to Malaysia with the conference, which China must not do; no fear if the non-aligned conference comes first, later preparation is better, and the second conference is to give Bandung''s ten principles concrete form; of the twenty-four invited not all may come, the Democratic Republic of Vietnam could be added.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 627 (Mar. 19, 1964). Made public: 1997. Names: Zhou Enlai, Sukarni.'
        tags: [name:zhou-enlai, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1964-03-20.china-leadership
        when: 'Mar. 20'
        date: '1964-03-20'
        thread: china-leadership
        also: [africa]
        c: 'Zhou wires greetings to the Afro-Asian People''s Solidarity Council meeting at Algiers on Mar. 22: the risen peoples of Asia and Africa will win full political and economic independence and carry the anti-imperialist struggle through.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 627 (Mar. 20, 1964). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:algeria]
  - add:
      entry:
        id: cal.1964-03-21.china-leadership
        when: 'Mar. 21'
        date: '1964-03-21'
        thread: china-leadership
        also: [japan, soviet-union]
        c: 'Zhou, with Liu Shaoqi and Deng Xiaoping, meets the Japanese Communist Party Central Committee delegation under Hakamada Satomi, Politburo and Secretariat member.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 627–28 (Mar. 21, 1964). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Hakamada Satomi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, polity:japan, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1964-03-21.china-leadership-2
        when: 'Mar. 21'
        date: '1964-03-21'
        thread: china-leadership
        c: 'Zhou receives Mario Montfort Toledo, of the Mexican weekly *Siempre!*, then in Beijing: revolution and construction rest on self-reliance without excluding outside help; with self-confidence foreign aid and support will come. "He who has the Way has many helpers."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 628 (Mar. 21, 1964). Names: Zhou Enlai, Montfort Toledo.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1964-03-22.china-leadership-3
        when: 'Mar. 22'
        date: '1964-03-22'
        thread: china-leadership
