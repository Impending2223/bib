  - cite:
      id: cal.1964-07-28.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 658 (July 28, 1964: Zhou attends the Politburo meeting, which discusses and adopts the Central Committee''s reply to the Soviet Central Committee''s letter of June 15)'
      units: 'A'
  - cite:
      id: cal.1964-08-05.china
      item: '[[w.zhou-enlai-nianpu-1949]], II, 663 (Aug. 6, 1964: the Chinese government''s statement: the DRV is a neighbor as close as lips and teeth; U.S. aggression against it is aggression against China; the Chinese people will not stand by)'
      units: 'D'
  - check:
      id: cal.1964-08-05.china
      text: 'Check: [[w.zhou-enlai-nianpu-1949]], II, 663, gives the Chinese government''s statement under Aug. 6, not Aug. 5.'
  - cite:
      id: cal.1964-09-21.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 667–68 (Sept. 21, 1964: Zhou forwards Luo Ruiqing''s report, written on the Special Commission''s Sept. 16–17 view that the real test can be made in October, to Mao, away from Beijing, with a letter: it needs Mao''s decision in person, not later than the 24th; if this year, mid-October to early November is best, with at least twenty days'' preparation; if April or May of next year with an air-dropped bomb, winter preparation in October; or a strategic delay, to join the second set of bases and missile and warhead production)'
      units: 'A, B, C'
  - cite:
      id: cal.1964-10-07.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 674 (Oct. 7, 1964: Zhou, with Mao, Liu Shaoqi, Dong Biwu, Zhu De and Deng Xiaoping, meets the Korean party and government delegation under Choe Yong-gon)'
      units: 'A, B'
  - cite:
      id: cal.1964-10-16.testing
      item: '[[w.zhou-enlai-nianpu-1949]], II, 676 (Oct. 16, 1964: China''s first atomic bomb exploded successfully in the west at 3 p.m.)'
      units: 'A'
  - cite:
      id: cal.1964-10-15.soviet-union
      item: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 16, 1964: the CPSU plenum''s and Supreme Soviet Presidium''s communiqués relieve Khrushchev "for age and health" as first secretary, Presidium member and chairman of the Council of Ministers; elect Brezhnev and name Kosygin)'
      units: 'A, D'
  - cite:
      id: cal.1964-10-16.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 16, 1964: Zhou goes to Mao''s for a meeting or talk (also Oct. 19, 27, 29, Nov. 1 and 4))'
      units: 'A'
  - cite:
      id: cal.1964-10-27.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 27, 1964: Zhou goes to Mao''s for a meeting or talk)'
      units: 'A'
  - cite:
      id: cal.1964-10-29.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 29, 1964: Zhou goes to Mao''s for a meeting or talk)'
      units: 'A'
  - cite:
      id: cal.1964-11-01.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 677 (Nov. 1, 1964: Zhou goes to Mao''s for a meeting or talk)'
      units: 'A'
  - cite:
      id: cal.1964-10-22.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949]], II, 680 (Oct. 22, 1964: Mao''s note on Guangdong''s report: Zhou to have Luo Ruiqing talk it over, or Zhou, Luo, Deng and Peng together; send it to front- and second-line provinces; about 1.5 billion yuan nationally over two or three years: "not to do it now is to regret it")'
      units: 'A, B, C'
  - cite:
      id: cal.1964-10-28.china
      item: '[[w.zhou-enlai-nianpu-1949]], II, 681 (Oct. 28, 1964: Zhou receives Chervonenko, proposes that China send a party and government delegation to Moscow for the October Revolution anniversary, to meet Soviet leaders; Chervonenko will pass the idea on)'
      units: 'B, D, E'
  - cite:
      id: cal.1964-11-08.china
      item: '[[w.zhou-enlai-nianpu-1949]], II, 686 (Nov. 8, 1964: Brezhnev, Kosygin, Mikoyan, Andropov and Gromyko return the call on the Chinese delegation; on Malinovsky''s insult at the Nov. 7 reception ("we Russians got rid of Khrushchev, you should get rid of Mao") Zhou asks whether the Soviet Party welcomed the delegation in order to provoke it in public and whether it expects the Chinese party to replace Mao; Brezhnev: learned afterward, uneasy and angry, Malinovsky not a Presidium member, drunk, translator erred, will apologize; Zhou: "what a man says drunk is the truth", the root is in the mind, he will report at home; later Kosygin apologizes for the Central Committee)'
      units: 'B, D, F, G, I'
  - cite:
      id: cal.1964-11.china
      item: '[[w.zhou-enlai-nianpu-1949]], II, 686–87 (Nov. 9–12, 1964: Zhou, Nov. 9, 11 and 12, leads the Chinese delegation in talks with Brezhnev, Kosygin, Mikoyan and Andropov: no result on ending the polemics)'
      units: 'B'
  - cite:
      id: cal.1964-11-14.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 688 (Nov. 14, 1964: Zhou, back in Beijing in the afternoon, is met by Mao, Liu Shaoqi, Zhu De, Dong Biwu, Deng Xiaoping and others at the airport and goes from there to Mao''s for a meeting)'
      units: 'A, B'
  - cite:
      id: cal.1964-12-15.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 692–93 (Dec. 15, 1964: Zhou, at the Central Work Conference, reports on the Moscow visit and the Sino-Soviet party talks; says China must first do its own work well, lay the base at home and finish the socialist education movement, to have more strength in the world (Dec. 15–28; the conference met on rural socialist education))'
      units: 'B'
  - cite:
      id: cal.1964-12-20.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 695 (Dec. 20, 1964: Zhou attends the enlarged Politburo Standing Committee, which discusses rural socialist education, the chief contradiction in the countryside, the content of the "four cleanups", the nature of the "four uncleans", the proportion to strike; until early January 1965 he attends the enlarged Standing Committee''s meetings more than once, on drafts on the movement)'
      units: 'A'
  - cite:
      id: cal.1965-01-14.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 701 (Jan. 14, 1965: the Central Committee issues the meeting''s summary, "Some Problems Now Raised in the Rural Socialist Education Movement" (the Twenty-three Articles), drawn up on Mao''s views: sharp class struggle in town and country; the movement''s basic nature the contradiction between socialism and capitalism; its point, to purge those in the Party in power taking the capitalist road; hereafter called the "four cleanups", of politics, economy, organization, ideology)'
      units: 'H'
  - cite:
      id: cal.1965-01-23.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 703 (Jan. 23, 1965: the enlarged Standing Committee called on Zhou''s advice to hear Yu Qiuli''s oral report and discuss the revolution in planning)'
      units: 'A'
  - cite:
      id: cal.1965-02-11.soviet-union
      item: '[[w.zhou-enlai-nianpu-1949]], II, 708 (Feb. 10–11, 1965: Zhou''s fifth talk with Kosygin, returning from Hanoi, and his reception with Mao and Liu Shaoqi; on the way to the airport on the 11th, Zhou: the two sides should exchange views often, informally and not in public)'
      units: 'A, B'
  - check:
      id: cal.1965-03-22.china-leadership
      text: 'Check: [[w.zhou-enlai-nianpu-1949]], II, 720 (Mar. 22), has Zhou leave Beijing that day for Romania, talk with Hoàng Văn Hoan at Kunming in the evening, and does not mention Wuchang.'
  - cite:
      id: cal.1965-04-09.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 724 (Apr. 9, 1965: Zhou, after American aircraft repeatedly enter the air over Hainan from the 8th, agrees to Yang Chengwu''s proposal to drop the earlier rule that "our planes only take off to watch" and to adopt "a firm line of striking enemy aircraft that enter the air over the mainland and Hainan")'
      units: 'A'
  - cite:
      id: cal.1965-04-13.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 724 (Apr. 10–12, 1965: Zhou calls the officials on the draft directive; at the enlarged Politburo meeting of the 12th it is adopted in the main and issued that day)'
      units: 'A'
  - cite:
      id: cal.1965-05-12.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 730 (May 11–12, 1965: Zhou''s letter to Mao of May 11 proposing the statement; the rally in Beijing the next day)'
      units: 'C'
  - cite:
      id: cal.1965-06-16.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 737 (June 16, 1965: Zhou, with Mao, hears Yu Qiuli on drawing up the Third Five-Year Plan and the long-term plan and studies third-front building, first- and second-line output, city building and farming; Mao: three things to weigh in a plan, the common people (do not lose their hearts), war, and famine)'
      units: 'A, B'
  - check:
      id: cal.1965-07-12.china-leadership
      text: 'Check: [[w.zhou-enlai-nianpu-1949]], II, 742 (July 9), has Zhou "propose to agree" with the Central Investigation Department''s opinion and Mao prefer "the second plan", which a note identifies as Cheng Siyuan''s: a written statement at the airport on entering and a press meeting; the entry says Zhou agreed with the first plan, no statement.'
  - cite:
      id: cal.1965-09-15.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 755 (Sept. 15, 1965: Zhou goes to Mao''s to meet on the coming Central Work Conference)'
      units: 'A'
  - cite:
      id: cal.1965-09-18.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 756 (Sept. 18–Oct. 12, 1965: Zhou attends the Central Work Conference, which takes up the 1966 plan and the long-term plan, approves the Planning Commission''s 1966 outline, stresses that provincial, prefectural, county and commune committees put farming first, and agrees the Third Plan''s line: national defense first, speed third-front building, change industrial layout by degrees)'
      units: 'A, C, D'
  - cite:
      id: cal.1965-11-10.china-leadership-2
      item: '[[w.zhou-enlai-nianpu-1949]], II, 765 (Nov. 10, 1965 (noted at Nov. 19): the Central Committee''s notice relieves Yang Shangkun as director of its General Office and appoints Wang Dongxing)'
      units: 'A'
  - cite:
      id: cal.1965-12-08.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 768 (Dec. 8–15, 1965: Zhou attends in Shanghai the enlarged Standing Committee under Mao, at which Lin Biao, Ye Qun, Wu Faxian and Li Zuopeng spring a surprise attack on Luo Ruiqing, charging him with opposing "putting politics first" and "usurping the army and opposing the Party"; Luo is moved from military leadership and Yang Chengwu acts as chief of the General Staff)'
      units: 'A, B, J'
  - cite:
      id: cal.1964-11-29.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 690 (Nov. 29, 1964: Zhou, with Mao, Liu Shaoqi, Zhu De, Deng Xiaoping, Dong Biwu, Peng Zhen and others, at the rally of over 700,000 in Tiananmen Square supporting the Congolese (Leopoldville) people)'
      units: 'A'
  - cite:
      id: cal.1964-11-16.china-leadership
      item: '[[w.zhou-enlai-nianpu-1949]], II, 688 (Nov. 16, 1964: in the evening Zhou accompanies Mao in receiving Kim Il Sung)'
      units: 'A'
  - check:
      id: cal.1965-05-12.china-leadership
      text: 'Check: [[w.zhou-enlai-nianpu-1949]], II, 730, has Zhou propose the statement to Mao by letter on May 11 and the capital''s rally, at the Workers'' Stadium, the next day.'
  - check:
      id: cal.1965-04-13.china-leadership
      text: 'Check: [[w.zhou-enlai-nianpu-1949]], II, 724, has the directive adopted in the main at the enlarged Politburo meeting of Apr. 12 and issued by the Central Committee that day.'
