        when: 'Oct. 26'
        date: '1965-10-26'
        thread: china-leadership
        c: 'Zhou attends the Secretariat; hears Zhao Erlu on the defense industry conference and its political work conference.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 760 (Oct. 26, 1965). Made public: 1997. Names: Zhou Enlai, Zhao Erlu.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-10-26.china-leadership-2
        when: 'Oct. 26'
        date: '1965-10-26'
        thread: china-leadership
        also: [africa, vietnam-hanoi]
        c: 'Zhou tells Xinhua and Central People''s Radio to broadcast in twelve or thirteen languages the Chinese government''s statement sharply condemning U.S. and South Vietnamese bombing of Cambodian villages and the statement against forcing the second Asian-African conference, and to collect reactions. (Oct. 25 Algeria, chairing the preparatory standing committee, ruled over the objections of China, Cambodia, Vietnam, Korea, Pakistan, Tanzania and Guinea that the conference open Oct. 28; Oct. 26 China declared it would not attend.)'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 760 (Oct. 26, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
