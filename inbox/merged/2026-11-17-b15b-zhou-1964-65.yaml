        when: 'Oct. 24'
        date: '1965-10-24'
        thread: china-leadership
        c: 'Zhou attends the third meeting of the CPPCC Fourth Committee''s standing committee; he, Song Qingling, Dong Biwu, Guo Moruo and others are named deputy heads of the committee to prepare for the centenary of Sun Yat-sen''s birth, Liu Shaoqi head.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 760 (Oct. 24, 1965). Names: Zhou Enlai, Song Qingling, Dong Biwu, Guo Moruo, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:dong-biwu, name:liu-shaoqi, polity:prc]
