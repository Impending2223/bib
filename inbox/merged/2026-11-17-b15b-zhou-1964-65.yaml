  - add:
      entry:
        id: cal.1965-12-22.china-leadership-2
        when: 'Dec. 22'
        date: '1965-12-22'
        thread: china-leadership
        c: 'Zhou invites artists of the Hotan song-and-dance troupe of Xinjiang and the Inner Mongolia Ulan Muqir touring troupe to his home in Zhongnanhai; eats steamed cornbread and big-pot vegetables with them. To the Ulan Muqir: you have gone all over the country and led all troupes; keep the name, bring revolutionary music and dance to the people; in tall buildings remember the yurt, riding the train remember the horse; go back to horseback and poor herders.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 769 (Dec. 22, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
