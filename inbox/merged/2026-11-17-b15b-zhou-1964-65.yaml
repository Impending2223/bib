        date: '1965-10-08'
        thread: china-leadership
        also: [vietnam]
        c: 'Zhou receives the naval air force men who shot down a U.S. F-104 over the Haikou area and captured its pilot, a captain.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 758 (Oct. 8, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-10-09.china-leadership
        when: 'Oct. 9'
        date: '1965-10-09'
        thread: china-leadership
        also: [south-asia, indonesia, soviet-union]
        c: 'Zhou receives Faruque, Pakistan''s commerce minister. The Asian-African conference may well not meet; the India–Pakistan question stands unsettled; Indonesia has had domestic trouble, not yet clear; the Soviet Union wants in to open a Sino-Soviet polemical front there; Africans and Arabs have problems of their own; the time is not ripe, postponement likely.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 758–59 (Oct. 9, 1965). Made public: 1997. Names: Zhou Enlai, Faruque.'
        tags: [name:zhou-enlai, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1965-10-10.china-leadership-2
        when: 'Oct. 10'
        date: '1965-10-10'
        thread: china-leadership
        c: 'Zhou, on the report of Yu Qiuli and the "small commission" to the Center on the problems and views from the Central Work Conference''s discussion of the Third Plan and 1966 plan, proposes to Mao to call the regional bureau secretaries to talk it over and settle it on the spot.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 759 (Oct. 10, 1965). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Yu Qiuli.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-10-15.china-leadership
        when: 'Oct. 15'
        date: '1965-10-15'
        thread: china-leadership
        c: 'Zhou chairs a forum of the secretaries of six regional bureaus, heads of the large military regions and heads of Central departments, and speaks on the situation: in the world there is a main current and a countercurrent, bright and dark; in this time of deepening struggle and division and upheaval, hold both; do not see only the main current and miss the countercurrent.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 759 (Oct. 15, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
