        when: 'Mar. 29'
        date: '1964-03-29'
        thread: china-leadership
        also: [laos]
        c: 'Zhou receives Laos''s health minister Khamsouk Keola; exchange of views on Prince Souvanna Phouma''s coming visit.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 629 (Mar. 29, 1964). Made public: 1997. Names: Zhou Enlai, Khamsouk Keola.'
        tags: [name:zhou-enlai, polity:prc, polity:laos, vis:only:prc+laos]
  - add:
      entry:
        id: cal.1964-03-30.china-leadership
        when: 'Mar. 30–31'
        date: '1964-03-30'
        thread: china-leadership
        also: [africa, south-asia, soviet-union]
        c: 'Zhou reports on the visit to fourteen countries to a joint session of the 115th and 116th meetings of the NPC Standing Committee and the 142nd and 143rd plenary meetings of the State Council. Five parts: the course and gains; the trip to Albania; Africa''s revolutionary situation and tasks; South Asia; China''s policy toward Afro-Asian states. The trip took 72 days and 108,000 li; set out the five principles for relations with African and Arab states, accepted by both; broke the U.S. block to set up relations with Tunisia and agree with Ethiopia to normalize them soon; announced the eight principles of aid; explained the Sino-Indian border; stated China''s stand on Taiwan and the U.N. against "two Chinas". The first mission to Africa was a major event in China''s foreign relations. Domestic work is the surest capital; without it going abroad does nothing. Commends the interpreters Qi Zonghua, Ji Chaozhu and Fan Chengzuo: interpreting has the best political future; seven hundred million people and so few interpreters.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 629–30 (Mar. 30–31, 1964). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
        tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-03-31.china-leadership
        when: 'Mar. 31'
        date: '1964-03-31'
        thread: china-leadership
        c: 'Zhou receives Alvin Hamilton, Canadian M.P. and former agriculture minister: North America''s two peoples need friendship, but not one state''s violation of the other''s sovereignty or great-power chauvinism; a government in either party that does not defend its sovereignty and people loses their trust.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 630–31 (Mar. 31, 1964). Names: Zhou Enlai, Hamilton.'
        tags: [name:zhou-enlai, polity:prc, polity:canada]
  - add:
      entry:
        id: cal.1964-03.china-leadership
        when: 'Mar.'
        date: '1964-03'
        thread: china-leadership
        c: 'Zhou, in March, talks with over 200 trainees from many places newly come to serve at the Great Hall of the People: hold high communist ideals, serve the people; keep guard on Mao, the Central Committee and the people''s hall; run the night political school; stay plain; treat foreign guests with respect and warmth, small countries as large.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 631 (Mar. 1964). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
