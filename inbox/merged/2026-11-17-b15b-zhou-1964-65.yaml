  - add:
      entry:
        id: cal.1965-11-28.china-leadership
        when: 'Nov. 28'
        date: '1965-11-28'
        thread: china-leadership
        also: [china]
        c: 'Zhou, with heads of the Party''s Hong Kong and Macao work committee, on work there: inside our bodies, education of staff is patriotism, love for the socialist motherland; to suit Hong Kong and Macao, "unity, education, improvement" will do; the demand is patriotism, not socialist remolding; no copying the mainland; strict in thought and style for our own cadres but in method and living respect local custom, or one breaks from reality and the masses. Organization men should not separate Party members from "the masses" on forms: Party members are masses too; say "Party-member masses and non-Party masses" or "Party cadres and non-Party cadres".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 767 (Nov. 28, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-11-28.china-leadership-2
        when: 'Nov. 28'
        date: '1965-11-28'
        thread: china-leadership
        c: 'Zhou tells the PLA General Staff and General Political Department to send men to the air force and frontier forces to check on the spot the faults in class education, army democracy and rules, and correct them in time.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 767–68 (Nov. 28, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-11-29.china-leadership
