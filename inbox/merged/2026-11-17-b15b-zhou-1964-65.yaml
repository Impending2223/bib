        when: 'Nov. 19'
        date: '1965-11-19'
        thread: china-leadership
        c: 'Zhou and Liu Shaoqi wire Prince Sihanouk thanking Cambodia''s government for again fighting firmly and with marked effect at the Twentieth U.N. General Assembly to expel the Chiang clique and restore China''s rights.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 765 (Nov. 19, 1965). Names: Zhou Enlai, Liu Shaoqi, Sihanouk.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:norodom-sihanouk, polity:prc, polity:cambodia]
  - add:
      entry:
        id: cal.1965-11-22.china-leadership
        when: 'Nov. 22–23'
        date: '1965-11-22'
        thread: china-leadership
        also: [africa, china]
        c: 'Zhou talks with Tanzania''s second vice-president Kawawa, Nov. 22 and 23. Nov. 22 thanks Tanzania for standing up at the U.N. for China''s rights: the vote was also a review; 47 for the twelve-state motion, 47 against, 20 abstaining, 3 not voting, so in fact the opposition is a minority. Nov. 23 afternoon with Song Qingling sees Kawawa.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 766 (Nov. 22–23, 1965). Made public: 1997. Names: Zhou Enlai, Kawawa, Song Qingling.'
        tags: [name:zhou-enlai, polity:prc, polity:tanzania, vis:only:prc+tanzania]
  - add:
      entry:
        id: cal.1965-11-24.china-leadership-2
        when: 'Nov. 24'
        date: '1965-11-24'
        thread: china-leadership
        c: 'Zhou receives delegates to the national conference on machinery design. Designers are production workers, not "non-productive"; have the Labor Ministry and Statistical Bureau change it. Leaders must be revolutionary and lead by example, ask the masses first; to be a chief takes Mao Zedong Thought, practice and the three great revolutionary movements, self-criticism first. Trivial rules and regulations come from idealism and metaphysics, from Soviet dogmatism, but we have our own too: it takes five or six ministers'' circles to send a paper out, feudal ceremony and habit; we dare not change, lacking revolutionary spirit. Study foreign good experience for our use; rules fit the place, not complete. Study philosophy, Mao''s four essays.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 766 (Nov. 24, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-11-25.china-leadership
        when: 'Nov. 25'
        date: '1965-11-25'
        thread: china-leadership
        c: 'Zhou speaks at the national conference of young amateur literary activists held by the Communist Youth League and the Writers'' Association (to Dec. 14), a report titled "Raise high the banner of Mao Zedong Thought; be artists who can labor and create".'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 767 (Nov. 25, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-11-25.china-leadership-2
