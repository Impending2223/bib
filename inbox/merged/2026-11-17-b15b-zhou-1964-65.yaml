  - add:
      entry:
        id: cal.1965-10-31.china-leadership
        when: 'Oct. 31'
        date: '1965-10-31'
        thread: china-leadership
        c: 'Zhou sees the Sichuan–Hubei railway route-survey model show in the Great Hall; attends the concert of the Culture Ministry, the writers'' federation and the Musicians'' Association for the 30th anniversary of Nie Er''s death and the 20th of Xian Xinghai''s. Wires Jiangxi''s Party committee: the Jiangxi Communist Labor University may take "commune-in, commune-out" pilot classes to train part-time health workers; from 1966 all classes to be so.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 761 (Oct. 31, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-10-31.china-leadership-2
        when: 'Oct. 31'
        date: '1965-10-31'
        thread: china-leadership
        c: 'Zhou attends the first meeting of the committee to prepare the centenary of Sun Yat-sen''s birth.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 760 (Oct. 31, 1965). See [[cal.1965-10-24.china-leadership]]. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-11-01.china-leadership
        when: 'Nov. 1'
        date: '1965-11-01'
        thread: china-leadership
        c: 'Zhou receives the delegates to the first national obstetrics and gynecology conference of the Chinese Medical Association on family planning and health work for the countryside. Weight to the villages; within five years three kinds of rural health workers: a part-time medic in every production team; half-time workers in brigades and some communes; full-time doctors for communes or districts. Urban, factory, office, school and army medical staff in teams by turns to the countryside to treat and train. Keep some old experienced men in research and teaching to write down their experience; "like the silkworm, spin the last thread". Communism will take not decades but centuries, one country cannot enter alone with imperialism and capitalism around: utopian. On family planning: hold net population growth to one percent a year within the twentieth century.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 761–62 (Nov. 1, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-11-02.china-leadership
        when: 'Nov. 2'
        date: '1965-11-02'
        thread: china-leadership
        c: 'Zhou receives the Chilean parliamentary delegation. China has six or seven hundred million but much to do on its own land; with more and better work it can meet growing needs; that a big population means expansion is baseless, said by imperialists and reactionaries.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 762 (Nov. 2, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:chile]
  - add:
      entry:
        id: cal.1965-11-02.china-leadership-2
        when: 'Nov. 2'
        date: '1965-11-02'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou receives Nepal''s new ambassador Rundir Subba. In thousands of years of records China and Nepal had no conflict of interest and will have none; small disputes settled fast, the border question settled amicably; the same with Burma, Pakistan, Afghanistan, Mongolia and Korea; leftover historical problems can be settled by mutual understanding and accommodation.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 762 (Nov. 2, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, polity:nepal]
  - add:
      entry:
        id: cal.1965-11-02.china-leadership-3
        when: 'Nov. 2'
        date: '1965-11-02'
        thread: china-leadership
        also: [middle-east, africa]
        c: 'Zhou receives Syria''s departing ambassador Raslan. After many states'' efforts in and out of the meeting, a common view now: the situation is not good for the Asian-African conference; postponement now preserves the Bandung spirit. That day the 45-state foreign ministers'' preparatory meeting forced at Algiers puts off the summit of Nov. 5 indefinitely.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 762 (Nov. 2, 1965). Names: Zhou Enlai, Raslan.'
        tags: [name:zhou-enlai, polity:prc, polity:syria]
  - add:
      entry:
        id: cal.1965-11-04.china-leadership
        when: 'Nov. 4'
        date: '1965-11-04'
        thread: china-leadership
        also: [africa]
        c: 'Zhou receives Romania''s ambassador Dumitru Gheorghiu: indefinite postponement of the Asian-African conference may be a good thing; a formal split avoided, the Bandung spirit and consensus kept.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 762 (Nov. 4, 1965). Names: Zhou Enlai, Dumitru Gheorghiu.'
        tags: [name:zhou-enlai, polity:prc, polity:romania]
  - add:
      entry:
        id: cal.1965-11-05.china-leadership
        when: 'Nov. 5'
        date: '1965-11-05'
        thread: china-leadership
        c: 'Zhou attends the lunch Cheng Qian gives for Li Zongren.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 762 (Nov. 5, 1965). Names: Zhou Enlai, Cheng Qian, Li Zongren.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-11-06.china-leadership
        when: 'Nov. 6'
        date: '1965-11-06'
        thread: china-leadership
        c: 'Zhou attends the enlarged Politburo meeting on half-work, half-study.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 762–63 (Nov. 6, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-11-07.china-leadership
        when: 'Nov. 7–8'
        date: '1965-11-07'
        thread: china-leadership
        c: 'Zhou flies to Guangzhou the morning of Nov. 7 and returns to Beijing the evening of the 8th.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 763 (Nov. 7–8, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-11-09.china-leadership
        when: 'Nov. 9'
        date: '1965-11-09'
        thread: china-leadership
        also: [south-asia]
        c: 'Zhou, with Liu Shaoqi, talks with President Ayub Khan on the India–Pakistan conflict.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 763 (Nov. 9, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Ayub Khan.'
        tags: [name:zhou-enlai, name:liu-shaoqi, name:ayub-khan-mohammad, polity:prc, polity:pakistan, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1965-11-10.china-leadership-3
        when: 'Nov. 10–11'
        date: '1965-11-10'
        thread: china-leadership
        also: [korea, vietnam]
        c: 'Zhou has four talks, Nov. 10 and 11, with North Korea''s vice-premier Lee Ju-yeon, sent by Premier Kim Il Sung, on some international questions.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 763 (Nov. 10–11, 1965). Made public: 1997. Names: Zhou Enlai, Lee Ju-yeon.'
        tags: [name:zhou-enlai, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1965-11-13.china-leadership
        when: 'Nov. 13'
        date: '1965-11-13'
        thread: china-leadership
        c: 'Zhou reports on planning to the State Council''s conference on planning, capital construction, finance and other trades. At the Central Work Conference the line for the Third Plan and the 1966 plan was set, drafted from the Center''s and Mao''s repeated instructions of last year and this; more grounded, more real, and a first summing up of the past decade; a good plan; now carry it out, relying on two things: Mao Zedong Thought in command and the masses; wisdom comes from the masses, in working people are teachers everywhere. The plan is not rigid; small changes, frequent change not allowed, but plans must be adjusted. Five priorities: farming, defense, aid abroad, the large and small third fronts, basic industry. Control population; improve living on more output and family planning. Imports must be urgent, good, not duplicated, timely and politically allowed.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 763 (Nov. 13, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-11-13.china-leadership-2
        when: 'Nov. 13'
        date: '1965-11-13'
        thread: china-leadership
        c: 'Zhou, evening, hearing Yu Qiuli on the planning conference, on whether defense or farming comes first: his outline said defense first, but seeing provincial comrades he turned it round, not to let farming be slighted. Defense, war preparation and large and small third-front projects are settled, he fears farming neglected; for 700 million people defense and third front are the work of a few; farming is war preparation, war, famine and farming cannot be parted. Farm: great potential; Dazhai spirit, self-reliance; mainly local, Center aiding; mainly small; mainly collective; mainly self-run with help; fit the place; act early, fast, hard; county and commune both on farming; no season lost.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 764 (Nov. 13, 1965). Made public: 1997. Names: Zhou Enlai, Yu Qiuli.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-11-13.china-leadership-3
        when: 'Nov. 13'
        date: '1965-11-13'
        thread: china-leadership
        c: 'Zhou, at night, approves the navy''s punishing two U.S.-made Nationalist ships, *Yongchang* and *Yongtai*, harassing the fishing grounds east of Chongwu, Fujian: concentrate on one first and do it well, using close, night fighting; commands with He Long.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 764 (Nov. 13, 1965). Made public: 1997. Names: Zhou Enlai, He Long.'
        tags: [name:zhou-enlai, name:he-long, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-11-14.china-leadership
        when: 'Nov. 14'
        date: '1965-11-14'
        thread: china-leadership
        c: 'Off Chongwu, Fujian, at dawn: the navy sinks the Nationalist *Yongchang* and badly damages *Yongtai*. After the fight Zhou sends Chen Yi to the front to see the units.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 764 (Nov. 14, 1965). See [[cal.1965-11-13.china-leadership-3]]. Names: Zhou Enlai, Chen Yi.'
        tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:roc]
  - add:
      entry:
        id: cal.1965-11-15.china-leadership-2
        when: 'Nov. 15'
        date: '1965-11-15'
        thread: china-leadership
        c: 'Zhou inscribes for the twentieth anniversary of the people''s broadcasting: "Raise high the great red banner of Mao Zedong Thought; spread the revolutionary spirit of hard struggle and self-reliance; work for people''s broadcasting."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 764 (Nov. 15, 1965). Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-11-15.china-leadership-3
        when: 'Nov. 15'
        date: '1965-11-15'
        thread: china-leadership
        c: 'Zhou inscribes in honor of Wang Jie, the soldier of Communist character after the model of Lei Feng: "We must learn Wang Jie''s revolutionary spirit, not fearing hardship, not fearing death"; copies Wang''s lines: "Peaks stand to the clouds, we build for the people; we fear no toil or weariness, and give our youth to the people."'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 764 (Nov. 15, 1965). Names: Zhou Enlai, Wang Jie.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-11-15.china-leadership-4
        when: 'Nov. 15–18'
        date: '1965-11-15'
        thread: china-leadership
        c: 'Zhou attends the enlarged Politburo meeting, Nov. 15–18, on the 1966 plan, construction priorities and half-work, half-study. Nov. 16: not to let anyone take half-work half-study as meaning now to abolish the three great differences; the direction is firm but abolition takes a long time; it is a matter of policy and direction; the aim of education: serve the proletariat''s politics, join production and labor, and half-work half-study will train young people with socialist awareness and learning. Nov. 17–18, on the national economic plan: the Third Plan took nine months to feel out, has a first summing up, nearer reality, now firm it up; "prepare for war, prepare for famine, for the people" is both strategic line and present work; farming central to it: rely on peasants, the collective, science; war preparation and third-front building do not mean neglecting farming; spend less, do more. Proposes the Center approve. The meeting decides to push trials and spread half-work half-study and half-farm half-study schooling, and agrees with Liu''s "five years'' trial, ten years'' spread, a little more trial if needed", and approves the 1966 capital construction plan in principle.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 764–65 (Nov. 15–18, 1965). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi.'
        tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc]
