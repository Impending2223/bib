        date: '1965-10-02'
        thread: china-leadership
        c: 'Zhou tells Xinhua the headings of its *Reference Materials* be purely objective, with no leaning.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 758 (Oct. 2, 1965). Made public: 1997. Names: Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc, vis:only:prc]
