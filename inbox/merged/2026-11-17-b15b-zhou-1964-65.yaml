        date: '1965-11-29'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Zhou receives the Vietnamese economic delegation under Deputy Premier Lê Thanh Nghị, Nov. 29 to Dec. 1; chairs the Sino-Vietnamese economic talks.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 768 (Nov. 29–Dec. 1, 1965). Made public: 1997. Names: Zhou Enlai, Lê Thanh Nghị.'
        tags: [name:zhou-enlai, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-11-30.china-leadership
        when: 'Nov. 30'
        date: '1965-11-30'
        thread: china-leadership
        also: [europe-and-the-alliance-france, vietnam]
        c: 'Zhou receives Jean Chauvel, representing the French foreign minister at the French industrial exhibition in Beijing. China backs Vietnam against the American peace-talk fraud: "China''s experience and all ours is that the U.S. does not agree to talk till beaten to admit defeat." The Vietnam war is American escalation, its responsibility and no one else''s; China, a socialist state and a neighbor, owes the DRV not only moral but material aid.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 768 (Nov. 30, 1965). Names: Zhou Enlai, Chauvel.'
        tags: [name:zhou-enlai, polity:prc, polity:fr]
  - add:
      entry:
        id: cal.1965-11-30.china-leadership-3
        when: 'Nov. 30'
        date: '1965-11-30'
        thread: china-leadership
        c: 'Bertrand Russell answers Zhou''s letter: he will support wholeheartedly the anti-American struggles of the peoples of Asia, Africa and Latin America.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 760 (Nov. 30, 1965). See [[cal.1965-10-22.china-leadership-2]]. Names: Bertrand Russell, Zhou Enlai.'
        tags: [name:zhou-enlai, polity:prc]
  - add:
      entry:
        id: cal.1965-11-30.china-leadership-2
        when: 'Nov. 30'
        date: '1965-11-30'
        thread: china-leadership
        c: 'The *People''s Daily*, on Zhou''s notice, reprints Yao Wenyuan''s Nov. 10 *Wenhui bao* article on *Hai Rui Dismissed from Office*, with an editor''s note revised and settled by Zhou and Peng Zhen: freedom to criticize and to counter-criticize; wrong views met by reasoning; the play discussed as an academic question, under the Hundred Flowers line.'
        n: '[[w.zhou-enlai-nianpu-1949]], II, 768 (Nov. 30, 1965). See [[cal.1965-11-10.china-leadership]]. Names: Zhou Enlai, Peng Zhen, Yao Wenyuan.'
        tags: [name:zhou-enlai, name:peng-zhen, name:yao-wenyuan, polity:prc]
