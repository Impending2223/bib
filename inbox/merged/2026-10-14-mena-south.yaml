  # ---------------------------------------------------------------- Kuwait and the Gulf
  - add:
      entry:
        id: cal.1961-06-25.middle-east
        when: June 25–July 7
        date: '1961-06-25'
        thread: middle-east
        c: 'Kuwait. Britain and the Ruler end the agreement of 1899 by an exchange of letters, June 19; Kuwait independent. June 25, Qassim claims it as part of Iraq. British forces land July 1, at the Ruler''s request. Security Council, July 2–7: the British draft, for Kuwait''s independence, 7–1–3, vetoed by the Soviet Union; the UAR''s, for British withdrawal, 3–0–8. The United States for the first, abstaining on the second.'
        n: 'FRUS 1961–63, XVII, docs. [66](https://history.state.gov/historicaldocuments/frus1961-63v17/d66), [75](https://history.state.gov/historicaldocuments/frus1961-63v17/d75), [80](https://history.state.gov/historicaldocuments/frus1961-63v17/d80) (editorial note: the votes). [[w.alani-operation-vantage]]; [[w.joyce-kuwait-1945-1996]]; [[w.ashton-kennedy-macmillan-and-the]]; [[w.petersen-decline-of-the-anglo]]. Names: Qassim, Abdullah al-Salim al-Sabah (K–J Adm. III.J).'
        tags: [name:qassim-abdul-karim, name:abdullah-al-salim-al-sabah]
  - add:
      entry:
        id: cal.1961-09-22.middle-east
        when: Sept. 22
        date: '1961-09-22'
        thread: middle-east
        c: 'Diplomatic relations with Kuwait, at its request of Sept. 5. The consulate made an embassy, under a chargé d''affaires; no ambassador named.'
        n: 'FRUS 1961–63, XVII, doc. [106](https://history.state.gov/historicaldocuments/frus1961-63v17/d106) (editorial note). See [[cal.1961-06-25.middle-east]].'
  - add:
      entry:
        id: cal.1961-11-30.middle-east
        when: Nov. 30–Dec. 29
        date: '1961-11-30'
        thread: middle-east
        c: 'The Soviet Union vetoes Kuwait''s admission to the UN, Nov. 30. Late December, on reports of Iraqi moves, Britain sends an aircraft carrier and smaller ships toward the Gulf; Iraq protests to the Security Council, Dec. 28. Jernegan from Baghdad: Kuwait''s safety to be made the concern of the Arab states, Nasser''s above all.'
        n: 'FRUS 1961–63, XVII, docs. [154](https://history.state.gov/historicaldocuments/frus1961-63v17/d154), [155](https://history.state.gov/historicaldocuments/frus1961-63v17/d155), [156](https://history.state.gov/historicaldocuments/frus1961-63v17/d156). Made public: FRUS 1961–63, XVII (1995). See [[cal.1961-06-25.middle-east]]. Names: Nasser (K–J Adm. III.J).'
        tags: [name:nasser-gamal-abdel]
  - add:
      entry:
        id: cal.1965-11-24.middle-east
        when: Nov. 24
        date: '1965-11-24'
        thread: middle-east
        c: 'Abdullah al-Salim al-Sabah, Amir of Kuwait, dies; his brother succeeds. Johnson''s telegram to the new Amir, Nov. 26.'
        n: '[Telegram to the New Amir of Kuwait on the Death of His Brother, Shaikh Abdullah al-Salim al-Sabah](https://www.presidency.ucsb.edu/documents/telegram-the-new-amir-kuwait-the-death-his-brother-shaikh-abdullah-al-salim-al-sabah) (Nov. 26, 1965). [[w.joyce-kuwait-1945-1996]]. See [[cal.1961-06-25.middle-east]]. Names: Abdullah al-Salim al-Sabah (K–J Adm. III.J).'
        tags: [name:abdullah-al-salim-al-sabah, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1966-02-22.middle-east
        when: Feb. 22
        date: '1966-02-22'
        thread: middle-east
        also: [europe-and-the-alliance]
        c: 'London. Healey''s Defence Review, the White Paper: Britain to keep no base in Aden after South Arabia''s independence, set for 1968; forces abroad cut. The Rulers of Bahrain and Sharjah have agreed to larger British facilities. Washington told at talks in the State Department, Feb. 4.'
        n: '*Statement on the Defence Estimates 1966*, Cmnd. 2901 (Check). FRUS 1964–68, XXI, docs. [68](https://history.state.gov/historicaldocuments/frus1964-68v21/d68) (the talks of Feb. 4), [71](https://history.state.gov/historicaldocuments/frus1964-68v21/d71). [[w.dockrill-britains-retreat-from-east]]; [[w.mawby-british-policy-in-aden]]; [[w.petersen-decline-of-the-anglo]]; [[w.fain-american-ascendance-and-british]]. Names: Healey (K–J Adm. III.J).'
        tags: [name:healey-denis-w]

  # ---------------------------------------------------------------- Saudi Arabia
  - add:
      entry:
        id: cal.1961-03-16.middle-east
        when: Mar. 16
        date: '1961-03-16'
        thread: middle-east
        c: 'Radio Mecca: Saud has ordered the American ambassador told that the Dhahran airfield agreement will not be renewed when it expires in April 1962. Announced while State and Defense drafted a joint statement with the Saudis. The State Department''s background release the same evening.'
        n: 'FRUS 1961–63, XVII, doc. [24](https://history.state.gov/historicaldocuments/frus1961-63v17/d24). [[w.hart-saudi-arabia-and-the]]; [[w.bronson-thicker-than-oil]]; [[w.vitalis-americas-kingdom]]. Names: Saud ibn Abd al-Aziz Al Saud (K–J Adm. III.J).'
        tags: [name:saud-ibn-abd-al-aziz-al-saud]
  - add:
      entry:
        id: cal.1962-02-13.middle-east
        when: Feb. 13
        date: '1962-02-13'
        thread: middle-east
        c: 'Saud at the White House, after treatment in Boston; Kennedy had called on him at Palm Beach, Jan. 27. Iraq and Kuwait, Syria, Algeria, the training mission. After it, an economic mission to Saudi Arabia; his request for some $16 million of arms on credit studied.'
        n: '[Remarks of Welcome to King Saud of Saudi Arabia at Andrews Air Force Base](https://www.presidency.ucsb.edu/documents/remarks-welcome-king-saud-saudi-arabia-andrews-air-force-base); [Joint Statement Following Discussions With King Saud](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-king-saud) (Feb. 13, 1962). FRUS 1961–63, XVII, docs. [191](https://history.state.gov/historicaldocuments/frus1961-63v17/d191), [241](https://history.state.gov/historicaldocuments/frus1961-63v17/d241). [[w.hart-saudi-arabia-and-the]]; [[w.bronson-thicker-than-oil]]. See [[cal.1961-03-16.middle-east]]. Names: Saud ibn Abd al-Aziz Al Saud (K–J Adm. III.J).'
        tags: [name:saud-ibn-abd-al-aziz-al-saud, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1962-10-05.middle-east
        when: Oct. 5
        date: '1962-10-05'
        thread: middle-east
        c: 'Faisal, Crown Prince of Saudi Arabia, at lunch with Kennedy. Yemen: the rebels would fall without help from the UAR and the Soviet Union. Faisal: American food for the UAR frees Nasser''s money for subversion. Oct. 17, Saud makes Faisal Prime Minister.'
        n: '[Joint Statement Following Discussions With Crown Prince Faysal of Saudi Arabia](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-crown-prince-faysal-saudi-arabia) (Oct. 5, 1962). FRUS 1961–63, XVIII, docs. [71](https://history.state.gov/historicaldocuments/frus1961-63v18/d71), [83](https://history.state.gov/historicaldocuments/frus1961-63v18/d83). [[w.hart-saudi-arabia-and-the]]; [[w.bronson-thicker-than-oil]]. See [[cal.1962-09-26.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Nasser, Saud ibn Abd al-Aziz Al Saud (K–J Adm. III.J).'
        tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:saud-ibn-abd-al-aziz-al-saud, name:nasser-gamal-abdel, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1962-11-02.middle-east
        when: Nov. 2–10
        date: '1962-11-02'
        thread: middle-east
        c: 'Aircraft from Yemen bomb Saudi villages near the border, Nov. 2; Faisal holds the UAR responsible. Kennedy''s letter to Faisal, dated Oct. 25, sent for delivery Nov. 2: American support for Saudi Arabia''s integrity, and for its reforms. Nov. 6, Saudi Arabia breaks relations with the UAR; Faisal''s ten-point program of reform, slavery abolished (Check). Nov. 7, a destroyer patrol off the Red Sea coast and a visit of American aircraft to Dhahran. Nov. 10, Jordanian Hunters at Taif.'
        n: 'FRUS 1961–63, XVIII, docs. [88](https://history.state.gov/historicaldocuments/frus1961-63v18/d88), [89](https://history.state.gov/historicaldocuments/frus1961-63v18/d89) (editorial note), [91](https://history.state.gov/historicaldocuments/frus1961-63v18/d91), [93](https://history.state.gov/historicaldocuments/frus1961-63v18/d93). See [[cal.1962-09-26.middle-east]], [[cal.1962-10-05.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud (K–J Adm. III.J).'
        tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1964-11-02.middle-east
        when: Nov. 2
        date: '1964-11-02'
        thread: middle-east
        c: 'Saud deposed; Faisal, Prime Minister, proclaimed King.'
        n: 'FRUS 1964–68, XXI, doc. [234](https://history.state.gov/historicaldocuments/frus1964-68v21/d234), n. Check: Washington''s message to Faisal. [[w.hart-saudi-arabia-and-the]]; [[w.bronson-thicker-than-oil]]. See [[cal.1962-10-05.middle-east]]. Names: Saud ibn Abd al-Aziz Al Saud, Faisal ibn Abd al-Aziz Al Saud (K–J Adm. III.J).'
        tags: [name:saud-ibn-abd-al-aziz-al-saud, name:faisal-ibn-abd-al-aziz-al-saud]
  - add:
      entry:
        id: cal.1965-10-25.middle-east
        when: Oct. 25–Nov. 8
        date: '1965-10-25'
        thread: middle-east
        c: 'Saudi air defense. Oct. 25, the British Minister of Aviation to McNamara: a joint offer of British Lightning fighters and American Hawk missiles, British radar, American communications. McNamara, Oct. 28: Sultan has already chosen an F-104G package, if finance and missiles can be arranged. Nov. 3, Sultan inclined to the joint package on three conditions, among them American credit on British terms. Nov. 8, Washington: the Hawk system can be joined to the British parts. The sale concluded in December (Check).'
        n: 'FRUS 1964–68, XXI, docs. [255](https://history.state.gov/historicaldocuments/frus1964-68v21/d255), [257](https://history.state.gov/historicaldocuments/frus1964-68v21/d257). [[w.hart-saudi-arabia-and-the]]; [[w.petersen-decline-of-the-anglo]]. Made public: FRUS 1964–68, XXI (2000). Names: McNamara (K–J Adm. III.F); Sultan ibn Abd al-Aziz Al Saud (K–J Adm. III.J).'
        tags: [name:mcnamara-robert-s, name:sultan-ibn-abd-al-aziz-al-saud]
  - add:
      entry:
        id: cal.1966-06-21.middle-east
        when: June 21–23
        date: '1966-06-21'
        thread: middle-east
        also: [states-and-cities]
        c: 'King Faisal at the White House, June 21–22; over an hour alone with Johnson. Development, Saudi integrity, Southeast Asia, Yemen; no new security assurances. June 22, at a press luncheon: "Jews of the world aid Israel … In our situation we consider those who aid our enemy as our enemy." June 23, Lindsay cancels New York''s dinner for him; Rockefeller his call.'
        n: '[Remarks of Welcome to King Faisal of Saudi Arabia on the South Lawn at the White House](https://www.presidency.ucsb.edu/documents/remarks-welcome-king-faisal-saudi-arabia-the-south-lawn-the-white-house) (June 21, 1966); [Joint Statement Following Discussions With King Faisal of Saudi Arabia](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-king-faisal-saudi-arabia) (June 22, 1966). FRUS 1964–68, XXI, docs. [276](https://history.state.gov/historicaldocuments/frus1964-68v21/d276), [279](https://history.state.gov/historicaldocuments/frus1964-68v21/d279) (the luncheon; the dinner). [[w.bronson-thicker-than-oil]]. See [[cal.1964-11-02.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud (K–J Adm. III.J); Lindsay (Opp. III.D); Rockefeller (Opp. III.H).'
        tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:johnson-lyndon-b, name:lindsay-john-v, name:rockefeller-nelson, 'state:ny', 'city:nyc']

  # ---------------------------------------------------------------- Yemen
  - add:
      entry:
        id: cal.1962-09-26.middle-east
        when: Sept. 26–27
        date: '1962-09-26'
        thread: middle-east
        c: 'Sanaa. Army officers under Sallal shell the palace and proclaim the Yemen Arab Republic. Badr, Imam since his father''s death a week before, escapes to the north. Egyptian troops from early October; Saudi Arabia and Jordan back the royalists. Washington withholds recognition.'
        n: 'FRUS 1961–63, XVIII, docs. [58](https://history.state.gov/historicaldocuments/frus1961-63v18/d58), [59](https://history.state.gov/historicaldocuments/frus1961-63v18/d59), [60](https://history.state.gov/historicaldocuments/frus1961-63v18/d60). [[w.schmidt-yemen]]; [[w.kerr-arab-cold-war]]; [[w.badeau-middle-east-remembered]]; [[w.gerges-superpowers-and-the-middle]]; [[w.bass-support-any-friend]]; [[w.jones-britain-and-the-yemen]]; [[w.ferris-nassers-gamble]]; [[w.orkaby-beyond-the-arab-cold]]. Names: Sallal, al-Badr (K–J Adm. III.J).'
        tags: [name:sallal-abdullah-al, name:al-badr-mohammed]
  - add:
      entry:
        id: cal.1962-12-19.middle-east
        when: Dec. 19
        date: '1962-12-19'
        thread: middle-east
        c: 'Washington recognizes the Yemen Arab Republic. The YAR''s statement of Dec. 18, written to an American text: it will honor the treaties of previous governments. The UAR''s of Dec. 19: a phased withdrawal of its troops as Saudi and Jordanian support of the royalists ends.'
        n: 'FRUS 1961–63, XVIII, docs. [96](https://history.state.gov/historicaldocuments/frus1961-63v18/d96), [114](https://history.state.gov/historicaldocuments/frus1961-63v18/d114), [116](https://history.state.gov/historicaldocuments/frus1961-63v18/d116) (editorial note: the statements and the recognition). See [[cal.1962-09-26.middle-east]].'
  - add:
      entry:
        id: cal.1963-03-01.middle-east
        when: Mar. 1–11
        date: '1963-03-01'
        thread: middle-east
        c: 'Bunker, the President''s emissary, to Faisal with Kennedy''s letter of Mar. 1: an eight-point plan for disengagement, Saudi aid to the royalists suspended and the UAR''s troops withdrawn; an American air unit for Saudi Arabia once observers certify the suspension. Faisal agrees in principle, with six conditions. Mar. 4, Badeau gives Nasser Kennedy''s warning on the air attacks on Saudi Arabia. Mar. 11, Bunker reports to Kennedy.'
        n: 'FRUS 1961–63, XVIII, docs. [172](https://history.state.gov/historicaldocuments/frus1961-63v18/d172), [176](https://history.state.gov/historicaldocuments/frus1961-63v18/d176) (editorial note), [187](https://history.state.gov/historicaldocuments/frus1961-63v18/d187), [189](https://history.state.gov/historicaldocuments/frus1961-63v18/d189), [202](https://history.state.gov/historicaldocuments/frus1961-63v18/d202). [[w.badeau-middle-east-remembered]]; [[w.schaffer-ellsworth-bunker]]. Made public: FRUS 1961–63, XVIII (1995). See [[cal.1962-09-26.middle-east]]. Names: Bunker (1968 list III.F); Faisal ibn Abd al-Aziz Al Saud, Nasser (K–J Adm. III.J); Badeau (K–J Adm. III.E).'
        tags: [name:bunker-ellsworth, name:faisal-ibn-abd-al-aziz-al-saud, name:nasser-gamal-abdel, name:badeau-john-s, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1963-04-01.middle-east
        when: Apr. 1–29
        date: '1963-04-01'
        thread: middle-east
        c: 'Bunker with Nasser in Cairo, Apr. 1–3, and Faisal, Apr. 5–9: the disengagement agreement. Saudi aid to the royalists suspended; a demilitarized zone 20 kilometers each side of the border, with impartial observers; the UAR to begin withdrawing within 15 days of the suspension. Apr. 12, Bunker to U Thant. Apr. 29, U Thant to the Security Council: Saudi Arabia, the UAR and Yemen accept.'
        n: 'FRUS 1961–63, XVIII, docs. [203](https://history.state.gov/historicaldocuments/frus1961-63v18/d203), [205](https://history.state.gov/historicaldocuments/frus1961-63v18/d205), [209](https://history.state.gov/historicaldocuments/frus1961-63v18/d209), [211](https://history.state.gov/historicaldocuments/frus1961-63v18/d211) (editorial note). U Thant''s report, [UN doc. S/5298](https://undocs.org/S/5298). See [[cal.1963-03-01.middle-east]]. Names: Bunker (1968 list III.F); Nasser, Faisal ibn Abd al-Aziz Al Saud, U Thant (K–J Adm. III.J).'
        tags: [name:bunker-ellsworth, name:nasser-gamal-abdel, name:faisal-ibn-abd-al-aziz-al-saud, name:u-thant]
  - add:
      entry:
        id: cal.1963-06-11.middle-east
        when: June 11
        date: '1963-06-11'
        thread: middle-east
        c: 'Security Council, Resolution 179, 10–0, the Soviet Union abstaining: an observation mission in Yemen to certify the disengagement. Observers in place by mid-July.'
        n: '[Resolution 179 (1963)](https://undocs.org/S/RES/179(1963)). FRUS 1961–63, XVIII, docs. [286](https://history.state.gov/historicaldocuments/frus1961-63v18/d286), [295](https://history.state.gov/historicaldocuments/frus1961-63v18/d295). See [[cal.1963-04-01.middle-east]].'
  - add:
      entry:
        id: cal.1963-06-13.middle-east
        when: June 13–July 1
        date: '1963-06-13'
        thread: middle-east
        c: 'Kennedy approves Hard Surface, June 13: eight F-100D fighters and a transport to Saudi Arabia, on condition that Saudi aid to the royalists end. June 14, Faisal, after Celler''s statement on the sending of Jewish servicemen, asks Washington to denounce it and bars American servicemen until it does; the movement halted June 15. June 29, the State Department: Saudi visa policy on persons of the Jewish faith unchanged, American policy one of nondiscrimination; the unit announced as a training mission. July 1, Kennedy to Faisal: the unit dispatched.'
        n: 'FRUS 1961–63, XVIII, docs. [268](https://history.state.gov/historicaldocuments/frus1961-63v18/d268), [270](https://history.state.gov/historicaldocuments/frus1961-63v18/d270) (editorial note), [272](https://history.state.gov/historicaldocuments/frus1961-63v18/d272), [286](https://history.state.gov/historicaldocuments/frus1961-63v18/d286). [[w.hart-saudi-arabia-and-the]]; [[w.bass-support-any-friend]]. See [[cal.1963-03-01.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud (K–J Adm. III.J); Celler (K–J Cong. III.D).'
        tags: [name:kennedy-john-f, name:faisal-ibn-abd-al-aziz-al-saud, name:celler-emanuel]
  - add:
      entry:
        id: cal.1964-03-28.middle-east
        when: Mar. 28–Apr. 12
        date: '1964-03-28'
        thread: middle-east
        c: 'British aircraft strike the Yemeni fort at Harib, Mar. 28, after attacks across the South Arabian frontier. Stevenson to the Security Council, Apr. 6, against the strike. Resolution 188, Apr. 9, 9–0: reprisals condemned, the attack deplored; the United States and Britain abstaining, on Johnson''s decision against Stevenson''s advice. Apr. 12, Johnson to Douglas-Home: the abstention approved reluctantly; "it would be hard for me to make the same decision again."'
        n: '[Resolution 188 (1964)](https://undocs.org/S/RES/188(1964)). FRUS 1964–68, XXI, docs. [326](https://history.state.gov/historicaldocuments/frus1964-68v21/d326), [327](https://history.state.gov/historicaldocuments/frus1964-68v21/d327) (Johnson and Rusk by telephone, Apr. 9), [330](https://history.state.gov/historicaldocuments/frus1964-68v21/d330). [[w.jones-britain-and-the-yemen]]; [[w.mawby-british-policy-in-aden]]; [[w.petersen-decline-of-the-anglo]]. Made public: FRUS 1964–68, XXI (2000). Names: Stevenson (K–J Adm. III.E); Douglas-Home (K–J Adm. III.J).'
        tags: [name:stevenson-adlai-e, name:douglas-home-alec, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1965-08-11.middle-east
        when: Aug. 11–24
        date: '1965-08-11'
        thread: middle-east
        c: 'Aug. 11, Faisal, through Sultan, asks for an American fighter squadron, a destroyer visit hastened and more near the Yemen border. Aug. 13, Komer to Johnson: the destroyer visit, no air unit. Aug. 24, at Jidda, Faisal and Nasser agree on Yemen: a cease-fire; Saudi aid to the royalists stopped; a conference of republicans and royalists at Haradh from Nov. 23; the UAR''s forces out within ten months of that date; a plebiscite by Nov. 23, 1966.'
        n: 'FRUS 1964–68, XXI, docs. [376](https://history.state.gov/historicaldocuments/frus1964-68v21/d376), [377](https://history.state.gov/historicaldocuments/frus1964-68v21/d377), [379](https://history.state.gov/historicaldocuments/frus1964-68v21/d379). [[w.ferris-nassers-gamble]]; [[w.orkaby-beyond-the-arab-cold]]. See [[cal.1962-09-26.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Sultan ibn Abd al-Aziz Al Saud, Nasser (K–J Adm. III.J); Komer (K–J Adm. III.E).'
        tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:sultan-ibn-abd-al-aziz-al-saud, name:nasser-gamal-abdel, name:komer-robert-w]

  # ---------------------------------------------------------------- Morocco
  - add:
      entry:
        id: cal.1961-02-21.africa
        when: Feb. 21–26
        date: '1961-02-21'
        thread: africa
        c: 'Yost gives Mohamed V Kennedy''s letter on Morocco''s acceptance of Soviet jet fighters, Feb. 21; the King: nothing to touch the American bases. The ambassador to offer F-86s if Soviet technicians are kept out. Feb. 26, Mohamed V dies; Hassan II King.'
        n: 'FRUS 1961–63, XXI, docs. [108](https://history.state.gov/historicaldocuments/frus1961-63v21/d108), [110](https://history.state.gov/historicaldocuments/frus1961-63v21/d110). [[w.muehlenbeck-betting-on-the-africans]]; [[w.miller-history-of-modern-morocco]]. Made public: FRUS 1961–63, XXI (1995). Names: Mohamed V, Hassan II (K–J Adm. III.J); Yost (K–J Adm. III.E).'
        tags: [name:yost-charles-w, name:mohamed-v, name:hassan-ii, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1961-10-06.africa
        when: Oct. 6
        date: '1961-10-06'
        thread: africa
        c: 'NSAM 102, the bases in Morocco: Kennedy approves the State–Defense recommendations. Be ready to withdraw the forces by the end of 1963, as committed, while seeking every chance to keep the use of the facilities after; no important military plans to rest on keeping them. NSAM 34, Apr. 5, had asked the questions.'
        n: 'FRUS 1961–63, XXI, docs. [113](https://history.state.gov/historicaldocuments/frus1961-63v21/d113) (NSAM 34), [123](https://history.state.gov/historicaldocuments/frus1961-63v21/d123) (NSAM 102), [124](https://history.state.gov/historicaldocuments/frus1961-63v21/d124). [[w.muehlenbeck-betting-on-the-africans]].'
        tags: [name:kennedy-john-f]
  - add:
      entry:
        id: cal.1963-12-02.africa
        when: Dec. 2–16
        date: '1963-12-02'
        thread: africa
        c: 'The last Air Force contingents leave Sidi Slimane and Ben Guerir, Dec. 2; Nouasseur handed over Dec. 16, with no American ceremony. Hassan to the American ambassador: dismay at the state in which Ben Guerir was left.'
        n: 'FRUS 1961–63, XXI, doc. [157](https://history.state.gov/historicaldocuments/frus1961-63v21/d157) (editorial note). See [[cal.1961-10-06.africa]], [[cal.1963-03-27.africa]]. Names: Hassan II (K–J Adm. III.J).'
        tags: [name:hassan-ii]
  - add:
      entry:
        id: cal.1965-10-29.africa
        when: Oct. 29
        date: '1965-10-29'
        thread: africa
        c: 'Paris. Ben Barka, leader of the Moroccan left, in exile, taken outside the Brasserie Lipp by two French police officers; not seen again.'
        n: 'FRUS 1964–68, XXIV, doc. [121](https://history.state.gov/historicaldocuments/frus1964-68v24/d121) (editorial note). [[w.miller-history-of-modern-morocco]]. Names: Ben Barka (K–J Adm. III.J).'
        tags: [name:ben-barka-mehdi]
  - add:
      entry:
        id: cal.1966-01-25.africa
        when: Jan. 25–28
        date: '1966-01-25'
        thread: africa
        c: 'Press stories of a CIA part in the Ben Barka kidnapping. McCloskey, after checking with the CIA, denies any American involvement, Jan. 25. Jan. 28, Pompidou to Bohlen, off the record: no sign of any American intelligence service in the affair.'
        n: 'FRUS 1964–68, XXIV, doc. [121](https://history.state.gov/historicaldocuments/frus1964-68v24/d121) (editorial note). See [[cal.1965-10-29.africa]]. Names: McCloskey, Bohlen (K–J Adm. III.E); Ben Barka, Pompidou (K–J Adm. III.J).'
        tags: [name:mccloskey-robert-j, name:bohlen-charles-e, name:ben-barka-mehdi, name:pompidou-georges-j-r]

  # ---------------------------------------------------------------- Algeria
  - add:
      entry:
        id: cal.1962-10-16.africa
        when: Oct. 16–17
        date: '1962-10-16'
        thread: africa
        also: [cuba]
        c: 'Ben Bella in Havana, from New York, with Castro. Their joint communiqué calls for the evacuation of the base at Guantánamo (Check).'
        n: 'FRUS 1961–63, XXI, doc. [72](https://history.state.gov/historicaldocuments/frus1961-63v21/d72) (its note dates the visit Oct. 18; Check). See [[cal.1962-10-15.africa]]. Names: Ben Bella, Castro (K–J Adm. III.J).'
        tags: [name:ben-bella-ahmed, name:castro-fidel]
  - add:
      entry:
        id: cal.1962-12-14.africa
        when: Dec. 14
        date: '1962-12-14'
        thread: africa
        c: 'NSAM 211: Kennedy asks for a strategy for Algeria, from emergency relief toward development, American aid supplementing France''s; a report by the end of January.'
        n: 'FRUS 1961–63, XXI, doc. [77](https://history.state.gov/historicaldocuments/frus1961-63v21/d77). See [[cal.1962-10-15.africa]].'
        tags: [name:kennedy-john-f]
  - add:
      entry:
        id: cal.1963-02-20.africa
        when: Feb. 20
        date: '1963-02-20'
        thread: africa
        c: 'NSAM 221: Kennedy approves Rusk''s plan of action for Algeria. France to carry the main burden; he would hear of any need to exceed the $15 million AID level for fiscal 1964; the Peace Corps to answer Ben Bella''s request if it can.'
        n: 'FRUS 1961–63, XXI, docs. [81](https://history.state.gov/historicaldocuments/frus1961-63v21/d81), [83](https://history.state.gov/historicaldocuments/frus1961-63v21/d83). See [[cal.1962-12-14.africa]]. Names: Rusk (K–J Adm. III.E); Ben Bella (K–J Adm. III.J).'
        tags: [name:kennedy-john-f, name:rusk-dean, name:ben-bella-ahmed]

  # ---------------------------------------------------------------- Libya
  - add:
      entry:
        id: cal.1962-10-16.africa-2
        when: Oct. 16–17
        date: '1962-10-16'
        thread: africa
        c: 'Hasan al-Rida, Crown Prince of Libya and heir to King Idris, at the White House; in the United States to Oct. 24.'
        n: '[Toasts of the President and Crown Prince Hasan of Libya](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-crown-prince-hasan-libya) (Oct. 16, 1962); [Joint Statement Following Discussions With the Crown Prince of Libya](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-crown-prince-libya) (Oct. 17, 1962). FRUS 1961–63, XXI, docs. [94](https://history.state.gov/historicaldocuments/frus1961-63v21/d94), [97](https://history.state.gov/historicaldocuments/frus1961-63v21/d97). [[w.st-john-libya-and-the-united]]; [[w.vandewalle-history-of-modern-libya]]. Names: Hasan al-Rida al-Sanusi, Idris I (K–J Adm. III.J).'
        tags: [name:hasan-al-rida-al-sanusi, name:idris-i, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1963-09-30.africa
        when: Sept. 30
        date: '1963-09-30'
        thread: africa
        c: 'Fekini, Prime Minister of Libya, at the White House: help for a new five-year plan. Kennedy: Congress cutting aid heavily. Libya''s oil royalties some $64 million in 1963 (Komer); the Wheelus rent to fall from $10 million a year to $1 million in 1965.'
        n: 'FRUS 1961–63, XXI, docs. [106](https://history.state.gov/historicaldocuments/frus1961-63v21/d106), [107](https://history.state.gov/historicaldocuments/frus1961-63v21/d107). [[w.yergin-prize]]; [[w.st-john-libya-and-the-united]]; [[w.vandewalle-history-of-modern-libya]]. Made public: FRUS 1961–63, XXI (1995). Names: Fekini (K–J Adm. III.J); Komer (K–J Adm. III.E).'
        tags: [name:fekini-mohieddine, name:komer-robert-w, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1964-02-22.africa
        when: Feb. 22–Apr. 3
        date: '1964-02-22'
        thread: africa
        also: [middle-east]
        c: 'Nasser, Feb. 22: no country independent with foreign bases on its soil. The Libyan government will not renew the American and British base treaties; its Parliament presses for abrogation. Mar. 8, Johnson''s oral message to Idris on Wheelus. Mar. 20, NSAM 291: every reasonable effort to prolong the stay; an action program by Apr. 10. Apr. 3, Harriman to Johnson, after Libya: the tenancy can be protracted several years.'
        n: 'FRUS 1964–68, XXIV, docs. [41](https://history.state.gov/historicaldocuments/frus1964-68v24/d41), [43](https://history.state.gov/historicaldocuments/frus1964-68v24/d43), [45](https://history.state.gov/historicaldocuments/frus1964-68v24/d45) (NSAM 291), [50](https://history.state.gov/historicaldocuments/frus1964-68v24/d50). See [[cal.1963-09-30.africa]]. Names: Nasser, Idris I (K–J Adm. III.J); Harriman (K–J Adm. III.E).'
        tags: [name:nasser-gamal-abdel, name:idris-i, name:harriman-w-averell, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1964-08-07.africa
        when: Aug. 7
        date: '1964-08-07'
        thread: africa
        c: 'Lightner to Muntasser: the United States accepts the principle of withdrawal from Wheelus. Dates to be discussed in 1965, after an American study; Libya not to press the matter before then.'
        n: 'FRUS 1964–68, XXIV, docs. [63](https://history.state.gov/historicaldocuments/frus1964-68v24/d63), [64](https://history.state.gov/historicaldocuments/frus1964-68v24/d64). Made public: FRUS 1964–68, XXIV (1999). See [[cal.1964-02-22.africa]]. Names: Lightner (K–J Adm. III.E); Muntasser (K–J Adm. III.J).'
        tags: [name:lightner-e-allan-jr, name:muntasser-mahmoud]

  # ---------------------------------------------------------------- Tunisia
  - add:
      entry:
        id: cal.1965-04-29.africa
        when: Apr. 29
        date: '1965-04-29'
        thread: africa
        c: 'Habib Bourguiba Jr., Foreign Minister of Tunisia, with Johnson, bringing his father''s letter: Tunisia''s next development plan; help with equipment for its army. Johnson: Congress has nearly cut out military aid; he will see what can be done.'
        n: 'FRUS 1964–68, XXIV, docs. [150](https://history.state.gov/historicaldocuments/frus1964-68v24/d150), [151](https://history.state.gov/historicaldocuments/frus1964-68v24/d151). [[w.perkins-history-of-modern-tunisia]]. See [[cal.1961-05-03.africa]]. Names: Habib Bourguiba Jr. (K–J Adm. III.J).'
        tags: [name:bourguiba-habib-jr, name:johnson-lyndon-b]
