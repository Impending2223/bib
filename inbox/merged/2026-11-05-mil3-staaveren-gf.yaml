- add:
    entry:
      id: cal.1965-09-16.vietnam-air-war
      when: Sept. 16
      date: '1965-09-16'
      thread: vietnam-air-war
      c: 'An Air Force attack on a suspected SAM site near Thanh Hoa: two F-105s and their pilots downed; Risner captured.
        The same day Navy A-4Es with ALQ-51s break a Fan Song lock-on, the first. McNamara asks whether the mission was worth
        the risk; Moore defends it: 87 aircraft lost over the North since Jan. 1, most to groundfire below 5,000 feet.'
      n: '[[w.staaveren-gradual-failure]], 171–73. To check: Msg, 2d AD to PACAF, 191276Z Sep 65; PACAF rpt, Stat Sum of Air
        Ops, SEA, Vol VI, 3–16 Sep 65, p 3-2 (cited by [[w.staaveren-gradual-failure]], 173 n.31). See [[cal.1965-09-09.vietnam-air-war]].
        Names: McNamara, Moore.'
      src:
        c: d1b70f30
        rows:
        - 'w.staaveren-gradual-failure 171–73: all'
        - 'via x.1965-09-16.pacaf-rpt-stat-sum-of-air-ops: ?'
        - 'via x.1965-09-19.msg-2d-ad-to-pacaf-191276z-sep: ?'
      tags:
      - name:mcnamara-robert-s
      - name:moore-joseph-h
- add:
    entry:
      id: cal.1965-09-16.vietnam-air-war-2
      when: Sept. 16
      date: '1965-09-16'
      thread: vietnam-air-war
      c: 'An F-100 from Korat hits the northern end of the Ben Hai River bridge in the DMZ: the bridge destroyed, three Vietnamese
        civilians killed. Sept. 17, four F-105s strike a hamlet in the DMZ''s southern sector: twenty-one killed, eight of
        them policemen. The ICC investigates; both put down to pilot error. PACAF: radar fixes within 20 miles of the DMZ,
        no strikes within five miles of its northern part.'
      n: '[[w.staaveren-gradual-failure]], 182. To check: Washington Post, Sep 18, 65, p 1 and Sep 20, 65, p 8; Baltimore
        Sun, Sep 20, 65; Chicago Tribune, Sep 20, 65; hist, MACV, 1965, p 204; PACAF DI rpt, Effects of Air Ops, SEA, 30 Sep
        65, p 4 (cited by [[w.staaveren-gradual-failure]], 182 n.53).'
      src:
        c: a0f216a6
        rows:
        - 'w.staaveren-gradual-failure 182: all'
        - 'via x.1965-09-18.washington-post-sep-18-65-p-1: ?'
        - 'via x.1965-09-20.baltimore-sun-sep-20-65: ?'
        - 'via x.1965-09-20.chicago-tribune-sep-20-65: ?'
        - 'via x.1965-09-30.pacaf-di-rpt-effects-of-air-ops: ?'
        - 'via x.1965.hist-macv-1965-p-204: ?'
- add:
    entry:
      id: cal.1965-09-20.vietnam-air-war-2
      when: Sept. 20
      date: '1965-09-20'
      thread: vietnam-air-war
      also:
      - china
      c: The Chinese shoot down an Air Force F-104 over Hainan and capture its pilot, Philip E. Smith, escorting four Silver
        Dawn C-130Bs of the 6091st Reconnaissance Squadron on intercept missions; he had reported navigational trouble.
      n: '[[w.staaveren-gradual-failure]], 182. To check: Washington Post, Sep 21, 65, p 1 and Sep 22, 65, p A16 (cited by
        [[w.staaveren-gradual-failure]], 182 n.54).'
      src:
        c: cf917142
        rows:
        - 'w.staaveren-gradual-failure 182: all'
        - 'via x.1965-09-21.washington-post-sep-21-65-p-1: ?'
- cite:
    id: cal.1965-09-20.vietnam-air-war
    item: '[[w.staaveren-gradual-failure]], 173 (the Navy''s A-4Es with ALQ-51s believe they turned six SAMs; a mission on
      the Hanoi–Lang San rail line draws ten SAMs and heavy fire, no aircraft hit)'
- check:
    id: cal.1965-09-20.vietnam-air-war
    text: 'Check: Van Staaveren counts ten SAMs on the rail line mission (173).'
- add:
    entry:
      id: cal.1965-09-15.vietnam-air-war
      when: Sept. 15
      date: '1965-09-15'
      thread: vietnam-air-war
      c: 'Triantafellu, the 2d Air Division''s Deputy for Intelligence, sets up a target intelligence center under Enney:
        photo support, target recording, target development; the North split at the 19th parallel, Laos into Barrel Roll and
        Steel Tiger. It begins sending targets to the units Sept. 20.'
      n: '[[w.staaveren-gradual-failure]], 185. To check: Intvw, Col Franklin D. Lown, Jr., Dir/Intel, Hqs 2d AD, Apr 65–May
        66, by Capt Robert M. Snakenberg and Lt Col James C. Enney (Proj Corona Harvest Oral Hist Intvw No 319), 4 Nov 69
        (cited by [[w.staaveren-gradual-failure]], 185 n.60).'
      src:
        c: d1ea31a9
        rows:
        - 'w.staaveren-gradual-failure 185: all'
        - 'via x.1969-11-04.intvw-col-franklin-d-lown-jr-dir: ?'
- add:
    entry:
      id: cal.1965-09-23.vietnam-air-war
      when: Sept. 23
      date: '1965-09-23'
      thread: vietnam-air-war
      c: F-105s striking the Tai Xouan ammunition depot northwest of Hanoi see two SAMs; a pilot evades one by a "SAM Break."
      n: '[[w.staaveren-gradual-failure]], 173. To check: PACAF DI rpt, Effects of Air Ops, SEA, 11th ed, 30 Sep 65, pp 11–12
        (cited by [[w.staaveren-gradual-failure]], 173 n.30). See [[cal.1965-09-16.vietnam-air-war]].'
      src:
        c: a90708b6
        rows:
        - 'w.staaveren-gradual-failure 173: all'
        - 'via x.1965-09-30.pacaf-di-rpt-effects-of-air-ops-2: ?'
- add:
    entry:
      id: cal.1965-09-30.vietnam-air-war
      when: Sept. 30
      date: '1965-09-30'
      thread: vietnam-air-war
      c: 'The Air Force''s second F-105 lost to a SAM, the flight''s lead at 18,000 feet, on a strike near a bridge at Ninh
        Binh; an F-4C on the mission downed by antiaircraft fire. Night Wind, Sept. 3–30: twelve Air Force night missions,
        nineteen Navy.'
      n: '[[w.staaveren-gradual-failure]], 173, 182. To check: PACAF DI rpt, Effects of Air Ops, SEA, 11th ed, 30 Sep 65,
        p 12 (cited by [[w.staaveren-gradual-failure]], 173 n.32). See [[cal.1965-09-16.vietnam-air-war]].'
      src:
        c: 5b60815d
        rows:
        - 'w.staaveren-gradual-failure 173, 182: all'
        - 'via x.1965-09-30.pacaf-di-rpt-effects-of-air-ops-3: ?'
- add:
    entry:
      id: cal.1965-09-08.vietnam-air-war
      when: Sept. 8
      date: '1965-09-08'
      thread: vietnam-air-war
      c: Three more EB-66s from Shaw, S.C., TDY, reach Takhli, Thailand, joining six of the 9th Tactical Reconnaissance Squadron.
      n: '[[w.staaveren-gradual-failure]], 196. To check: McConnell Notebook, Item 302, 5 Oct 66; Greenhalgh, USAF Reconnaissance
        in SEA, 1960–1975, pp 195–96 (cited by [[w.staaveren-gradual-failure]], 196 n.83). See [[cal.1965-05-07.vietnam-air-war-2]].'
      src:
        c: 1c11ee9a
        rows:
        - 'w.staaveren-gradual-failure 196: all'
        - 'via x.1960.greenhalgh-usaf-reconnaissance-in-sea-1960-1975: ?'
        - 'via x.1966-10-05.mcconnell-notebook-item-302-5-oct-66: ?'
- add:
    entry:
      id: cal.1965-09-10.vietnam-air-war-2
      when: Sept. 10
      date: '1965-09-10'
      thread: vietnam-air-war
      c: Night of Sept. 10, for the Vietnamese children's day, an Air Force C-130 drops some 9,000 packets of toys over the
        North. By mid-October some forty-four million leaflets over ninety areas, most since mid-July.
      n: '[[w.staaveren-gradual-failure]], 210. See [[cal.1965-07-22.vietnam-air-war-2]].'
      src:
        c: 30ce3f37
        rows:
        - 'w.staaveren-gradual-failure 210: all'
- add:
    entry:
      id: cal.1965-10-01.vietnam-air-war
      when: Oct. 1
      date: '1965-10-01'
      thread: vietnam-air-war
      c: 'Rolling Thunder 34 and 35 (Oct. 1–14) open the North''s northeast quadrant, much of the rail line from Hanoi to
        Ping Hsiang, China: the Long Het, Xom Phuong and Vu Chua bridges and the Long Het ammunition depot; one coordinated
        attack a bridge in seven days; 1,200 armed reconnaissance sorties a fortnight, half to the Navy. Programs 37 and 38
        (Oct. 15–28): the Bac Can, Choi Moi, Thai Nguyen and Lang Luang bridges. From 38 and 39 (Oct. 29–Nov. 11), locks and
        dams exempt.'
      n: '[[w.staaveren-gradual-failure]], 183, 199. See [[cal.1965-08-20.vietnam-air-war]].'
      src:
        c: aa003d8a
        rows:
        - 'w.staaveren-gradual-failure 183, 199: all'
- add:
    entry:
      id: cal.1965-10-05.vietnam-air-war-2
      when: Oct. 5
      date: '1965-10-05'
      thread: vietnam-air-war
      also:
      - china
      c: Eighteen F-105s leave the Long Het highway bridge unserviceable; an F-105 downed, three damaged; an RF-101 destroyed
        landing at Đà Nẵng. Eight F-4Cs on the Long Het depot with seventy-five 750-pound bombs, one lost. The Kep highway
        bridge missed; a Navy F-8E disabled by a SAM, its pilot rescued. Five MiGs make passes at an EB-66C east of the bridge;
        Peking charges an intrusion over Kwangsi and claims a plane shot down; Washington denies it. The Air Force finds the
        EB-66C came within 15 miles of the border.
      n: '[[w.staaveren-gradual-failure]], 199–200. See [[cal.1965-10-01.vietnam-air-war]]. Names: Sharp.'
      src:
        c: 24fbe802
        rows:
        - 'w.staaveren-gradual-failure 199–200: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1965-10-07.vietnam-air-war
      when: Oct. 7
      date: '1965-10-07'
      thread: vietnam-air-war
      c: Air Force planes destroy the Vu Chua railroad bridge. The Joint Chiefs order five EB-66s of the 25th Tactical Reconnaissance
        Squadron, Chambley, France, to Takhli.
      n: '[[w.staaveren-gradual-failure]], 196, 200. To check: McConnell Notebook, Item 302, 5 Oct 66; Greenhalgh, USAF Reconnaissance
        in SEA, 1960–1975, pp 195–96 (cited by [[w.staaveren-gradual-failure]], 196 n.83). See [[cal.1965-10-05.vietnam-air-war-2]].'
      src:
        c: 7106bdcb
        rows:
        - 'w.staaveren-gradual-failure 196, 200: all'
        - 'via x.1960.greenhalgh-usaf-reconnaissance-in-sea-1960-1975: ?'
        - 'via x.1966-10-05.mcconnell-notebook-item-302-5-oct-66: ?'
- add:
    entry:
      id: cal.1965-10-21.vietnam-air-war
      when: Oct. 21
      date: '1965-10-21'
      thread: vietnam-air-war
      c: 'The five EB-66s from France reach Takhli, Moore''s fourteenth: crews of three, twenty-three jammers each, for passive
        ECM. In late November the 41st Tactical Reconnaissance Squadron, from Shaw, takes over the 9th''s aircraft and men;
        the 9th discontinued.'
      n: '[[w.staaveren-gradual-failure]], 196. To check: McConnell Notebook, Item 302, 5 Oct 66; Greenhalgh, USAF Reconnaissance
        in SEA, 1960–1975, pp 195–96 (cited by [[w.staaveren-gradual-failure]], 196 n.83). See [[cal.1965-10-07.vietnam-air-war]].
        Names: Moore.'
      src:
        c: 6169f313
        rows:
        - 'w.staaveren-gradual-failure 196: all'
        - 'via x.1960.greenhalgh-usaf-reconnaissance-in-sea-1960-1975: ?'
        - 'via x.1966-10-05.mcconnell-notebook-item-302-5-oct-66: ?'
      tags:
      - name:moore-joseph-h
- cite:
    id: cal.1965-10-17.vietnam-air-war
    item: '[[w.staaveren-gradual-failure]], 192, 200–01 (site 32 near Kep, found by a drone two days before: one A-6A and
      four A-4Es from the *Independence*; one missile destroyed, another burned out, ten transporters destroyed; sixteen F-105s
      with 3,000-pound bombs on the Bac Can bridge, and the Navy''s thirty-two aircraft on the Thai Nguyen bridge, three downed)'
- add:
    entry:
      id: cal.1965-10-31.vietnam-air-war
      when: Oct. 31
      date: '1965-10-31'
      thread: vietnam-air-war
      c: 'The hunter-killer experiment: Powers, in a specially equipped A-4E from the *Oriskany*, leads two flights of F-105s
        from Takhli to SAM sites near the Kep highway bridge, which Navy jets destroy. Three sites struck; some thirteen SAMs
        fired; radar and control vans believed destroyed in two or three. Powers downed and missing. Not repeated, for want
        of the A-4Es.'
      n: '[[w.staaveren-gradual-failure]], 192–93. See [[cal.1965-10-17.vietnam-air-war]].'
      src:
        c: e4188765
        rows:
        - 'w.staaveren-gradual-failure 192–93: all'
- cite:
    id: cal.1965-11-05.laos
    item: '[[w.staaveren-gradual-failure]], 193 (Nov. 5, fifty-six Air Force aircraft for Guoi Bo and the Phu Ly bridge diverted
      by weather; an F-105 downed by a SAM near Thanh Hoa; the A-1E and the CH-3 with four lost searching for its pilot; one
      of the four saved; another A-1E lost Nov. 6)'
- check:
    id: cal.1965-11-05.laos
    text: 'Check: Van Staaveren has the A-1E and the CH-3 lost "the next day" after the F-105 of Nov. 5 (193).'
