    item: '[[w.staaveren-gradual-failure]], 294, 297 (McNamara and his aides confer with Sharp and the commanders at Honolulu,
      July 8; no change in the bombing near China; "extreme sensitivity" to violations of its air space)'
- add:
    entry:
      id: cal.1966-07-09.vietnam-air-war
      when: July 9
      date: '1966-07-09'
      thread: vietnam-air-war
      c: 'Rolling Thunder 51, from the Chiefs the day after Honolulu: dispersed oil sites in the Hanoi-Haiphong sanctuary,
        with notice; armed reconnaissance of seven rail segments between Hanoi and China and Hanoi and Vinh; five bridges.
        Monthly armed reconnaissance sorties for the North and Laos from 8,100 to 10,100.'
      n: '[[w.staaveren-gradual-failure]], 297. To check: Hist, CINCPAC, 1966, pp 500–01; Sum of Air Ops, SEA, 1966, Vol XXIV,
        pp 1-4 and 1-8 (cited by [[w.staaveren-gradual-failure]], 297 n.47). See [[cal.1966-07-08.vietnam]]. Names: McNamara.'
