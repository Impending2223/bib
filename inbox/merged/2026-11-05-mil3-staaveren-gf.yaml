- cite:
    id: cal.1965-06-17.vietnam-air-war
    item: '[[w.staaveren-gradual-failure]], 144 (two Navy F-4Bs on high barrier patrol fire Sparrow IIIs at four MiG-17s,
      two downed, the first North Vietnamese aircraft killed in aerial combat)'
- cite:
    id: cal.1965-06-20.vietnam-air-war
    item: '[[w.staaveren-gradual-failure]], 144–45 (four A-1Hs under Greathouse, searching for an Air Force pilot downed over
      the Son La barracks; two MiGs; one downed, credited to Hartman and Johnson, the only propeller kill of a jet in the
      war)'
- add:
