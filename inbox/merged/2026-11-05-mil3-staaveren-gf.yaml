- add:
    entry:
      id: cal.1966-05-12.vietnam-air-war
      when: May 12
      date: '1966-05-12'
      thread: vietnam-air-war
      also:
      - china
      c: 'Four MiG-17s jump an EB-66 and three F-4Cs in the North''s northern sector; Dudley and Kringelis down one with their
        second Sidewinder. Peking: five American fighters over Yunnan, northeast of Makwan, a Chinese training plane shot
        down; "a deliberate systematic act of provocation." Owens''s JCS team, late May: "in all probability" a navigation
        error took the EB-66 and the Phantoms into China.'
      n: '[[w.staaveren-gradual-failure]], 274–76. To check: msg, ADMINO CINCPAC to COMUSMACV, CINCPACAF, CINCPACFLT, 180412Z
        May 66; msg, SSO MACV to AFSSO 7th AF, 18013OZ May 66 (cited by [[w.staaveren-gradual-failure]], 276 n.82). See [[cal.1966-04-23.vietnam-air-war]].
