- check:
    id: cal.1964-07-19.vietnam-saigon
    text: 'Check: Van Staaveren dates Khánh''s speech to some 100,000 July 18, National Shame Day, the government''s threat
      the next day (47).'
- add:
    entry:
      id: cal.1964-07-14.vietnam-air-war
      when: July 14
      date: '1964-07-14'
      thread: vietnam-air-war
      c: A detachment of specially equipped C-130Bs of the 6091st Reconnaissance Squadron deploys from Japan to Don Muang,
        Thailand, to gather North Vietnamese and Chinese communications in the Gulf of Tonkin; as Queen Bee it begins intercept
        missions.
      n: '[[w.staaveren-gradual-failure]], 48.'
      src:
        c: bead943a
        rows:
        - 'w.staaveren-gradual-failure 48: all'
- add:
    entry:
      id: cal.1964-08-05.vietnam-air-war
      when: Aug. 5–9
      date: '1964-08-05'
      thread: vietnam-air-war
      c: 'After Pierce Arrow, more than eighty Air Force fighter, reconnaissance and refueling aircraft redeployed from the
        Philippines, Okinawa and Japan to South Vietnam and Thailand: F-102s to Đà Nẵng and Tân Sơn Nhứt, F-100s to Đà Nẵng
        and Takhli, thirty-six B-57s to Biên Hòa (one destroyed, two damaged on Clark''s wet runway), F-105s to Korat, KB-50s.
        From Aug. 8 to 21, Strike Command''s composite force: F-100s and RF-101s, forty-eight C-130s, fifty-six SAC KC-135s
        to Guam and Clark.'
      n: '[[w.staaveren-gradual-failure]], 50–51. See [[cal.1964-08-05.vietnam]].'
      src:
        c: 9ef80e74
        rows:
        - 'w.staaveren-gradual-failure 50–51: all'
- add:
    entry:
      id: cal.1964-08-06.vietnam-air-war
      when: Aug. 6
      date: '1964-08-06'
      thread: vietnam-air-war
      c: Moore sets up a 2d Air Division command post at Tân Sơn Nhứt, apart from the Vietnamese-USAF operations center, for
        a tighter link to all Air Force units in South Vietnam and Thailand. Tours extended; the American manpower authorization
        in South Vietnam raised to 23,308.
      n: '[[w.staaveren-gradual-failure]], 51. See [[cal.1964-08-05.vietnam-air-war]]. Names: Moore.'
      src:
        c: 0d02b66e
        rows:
        - 'w.staaveren-gradual-failure 51: all'
      tags:
      - name:moore-joseph-h
- add:
    entry:
      id: cal.1964-08-07.vietnam-air-war-2
      when: Aug. 7
      date: '1964-08-07'
      thread: vietnam-air-war
      c: 'Martin, after meeting Thailand''s Deputy Defense Minister, has Bangkok allow the Air Force''s Thai-based aircraft
        to be used against North Vietnam if need be: "a major departure from previous Thai policy ... granted with considerable
        reluctance"; no more contingency deployments without his obtaining consent.'
      n: '[[w.staaveren-gradual-failure]], 53. See [[cal.1964-08-05.vietnam-air-war]]. Names: Martin.'
      src:
        c: 40f77d67
        rows:
        - 'w.staaveren-gradual-failure 53: all'
      tags:
      - name:martin-graham-a
- add:
    entry:
      id: cal.1964-08-09.laos
      when: Aug. 9
      date: '1964-08-09'
      thread: vietnam-air-war
      c: State and Defense approve "in principle" limited air and ground operations against the North Vietnamese in the Laos
        corridor as soon as feasible.
      n: '[[w.staaveren-gradual-failure]], 53. See [[cal.1964-08-07.vietnam-air-war-2]].'
      src:
        c: f22ee418
        rows:
        - 'w.staaveren-gradual-failure 53: all'
- add:
    entry:
      id: cal.1964-08-17.vietnam
      when: Aug. 17
      date: '1964-08-17'
      thread: vietnam-air-war
      c: The Joint Chiefs tell McNamara CINCPAC is readying Oplan 37-64 for the defense of South Vietnam and Oplan 99-64 for
        Laos.
      n: '[[w.staaveren-gradual-failure]], 53. See [[cal.1964-08-07.vietnam-air-war-2]]. Names: McNamara.'
      src:
        c: 5c8aed24
        rows:
        - 'w.staaveren-gradual-failure 53: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-08-24.vietnam-air-war
      when: Aug. 24
      date: '1964-08-24'
      thread: vietnam-air-war
      c: 'The Joint Chiefs send McNamara a contingency planning facilities list of some 650 targets in the North, the ninety-four
        among them, in five categories: airfields, lines of communication, military installations, industry, armed reconnaissance;
        a sudden "sharp blow" the most effective use of force. McNamara asks the likely effect, and what if the ninety-four
        fail.'
      n: '[[w.staaveren-gradual-failure]], 53. See [[cal.1964-08-17.vietnam]]. Names: McNamara.'
      src:
        c: 2e558f2a
        rows:
        - 'w.staaveren-gradual-failure 53: all'
      tags:
      - name:mcnamara-robert-s
- cite:
    id: cal.1964-09-18.vietnam
    item: '[[w.staaveren-gradual-failure]], 56–57 (the night of Sept. 17, Saigon time, the two destroyers, on patrol again
      since Sept. 15, report contact; Sharp alerts his commanders for a strike; Washington asks "positive evidence"; on Taylor''s
      advice the patrols and the covert operations suspended)'
- add:
    entry:
      id: cal.1964-09-25.vietnam
      when: Sept. 25
      date: '1964-09-25'
      thread: vietnam-air-war
      c: Sharp asks Harris and Moorer for plans from American disengagement to a "stronger hold" on the Saigon government
        and joint strikes on the North. His Oplan 39-64, against an attack by China, alone or with North Vietnam and North
        Korea, approved by the Chiefs.
      n: '[[w.staaveren-gradual-failure]], 57. See [[cal.1964-08-17.vietnam]]. Names: Sharp, Moorer.'
      src:
        c: 3a657a85
        rows:
        - 'w.staaveren-gradual-failure 57: all'
      tags:
      - name:sharp-u-s-grant
      - name:moorer-thomas
- add:
    entry:
      id: cal.1964-10-04.vietnam
      when: Oct. 4
      date: '1964-10-04'
      thread: vietnam-air-war
      c: The 34A covert operations against the North resumed under tighter control; RB-47s go on with weekly electronic intelligence
        missions off the coast. In October two coastal probes near Vinh, a failed attempt on a junk, the bombardment of a
        radar site at Vinh and a post at Mui Dai.
      n: '[[w.staaveren-gradual-failure]], 56–57. See [[cal.1964-09-18.vietnam]].'
      src:
        c: 3f1447d3
        rows:
        - 'w.staaveren-gradual-failure 56–57: all'
- cite:
    id: cal.1964-10-13.laos
    item: '[[w.staaveren-gradual-failure]], 58 (the Laotian air force''s T-28s on thirteen targets on the Laotian side of
      Mụ Giạ and the trail, under NSAM 310; F-100s escort, kept from firing; Oct. 14–Nov. 2, all thirteen and three more struck)'
- check:
    id: cal.1964-10-13.laos
    text: 'Check: Van Staaveren dates the first strikes Oct. 14 (58, 61).'
- add:
    entry:
      id: cal.1964-11-19.laos
      when: Nov. 19
      date: '1964-11-19'
      thread: vietnam-air-war
      c: An Air Force F-100 escorting Laotian T-28s against the roads to Mụ Giạ shot down, its pilot killed; Nov. 21, a Yankee
        Team RF-101 downed by groundfire, the pilot rescued. LeMay urges strikes on five targets in the panhandle; the Chiefs
        ask flak suppression along Routes 12 and 23; McNamara, no formal reply, orders medium-altitude missions in Laos above
        10,000 feet.
      n: '[[w.staaveren-gradual-failure]], 61. See [[cal.1964-10-13.laos]]. Names: LeMay, McNamara.'
      src:
        c: d686f072
        rows:
        - 'w.staaveren-gradual-failure 61: all'
      tags:
      - name:lemay-curtis-e
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-02-08.vietnam-air-war
      when: Feb. 8
      date: '1965-02-08'
      thread: vietnam-air-war
      c: 'After Flaming Dart I, McNamara asks the Joint Chiefs for a tentative eight-week bombing program. Feb. 11, their
        program, deliberately mild: American and South Vietnamese strikes rising in intensity, first on targets along Route
        7 and south of the 19th parallel, two to four a week, with Barrel Roll.'
      n: '[[w.staaveren-gradual-failure]], 78. To check: James C. Thompson, “How Could Vietnam Happen?” Atlantic Monthly Apr
        68, p 51 (cited by [[w.staaveren-gradual-failure]], 78 n.25). See [[cal.1965-02-07.vietnam]]. Names: McNamara.'
      src:
        c: 258c8a7d
        rows:
        - 'w.staaveren-gradual-failure 78: all'
        - 'via x.1968-04.james-c-thompson-how-could-vietnam-happen: ?'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-08-06.vietnam-air-war
      when: Aug. 6
      date: '1965-08-06'
      thread: vietnam-air-war
      c: 'Rolling Thunder 26 and 27 (Aug. 6–19): the SAM installations first; the Chiefs'' new and more significant targets
        overruled for the barracks and SAM installations around Dien Bien Phu, warehouses at Long Giem Da and Dang Thanh,
        two bridges and the Long Chi explosives plant. Aug. 6–19, eighty-eight Air Force sorties canceled for weather before
        takeoff, ten aborted after.'
      n: '[[w.staaveren-gradual-failure]], 167, 177, 179. Check: Van Staaveren also gives the program''s dates as Aug. 6–9
        (177). To check: Hist, CINCPAC, 1965, Vol II, p 379; PACAF DI rpt, Effects of Air Ops, SEA, 8th ed, 19 Aug 65, p 5
        and 9th ed, 2 Sep 65, p 8; Hq PACAF rpt, Sum of Air Ops, SEA, Vol IV, 6–19 Aug 65, pp 3-A-2 to 3-A-3 (cited by [[w.staaveren-gradual-failure]],
        167 n.13). See [[cal.1965-07-24.vietnam]].'
      src:
        c: e2c182aa
        rows:
        - 'w.staaveren-gradual-failure 167, 177, 179: all'
        - 'via x.1965-08-19.hq-pacaf-rpt-sum-of-air-ops-2: ?'
        - 'via x.1965-08-19.pacaf-di-rpt-effects-of-air-ops: ?'
        - 'via x.1965.hist-cincpac-1965-vol-ii-p-379: ?'
