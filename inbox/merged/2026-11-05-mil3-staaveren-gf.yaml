      id: cal.1965-07-11.vietnam-air-war
      when: July 11
      date: '1965-07-11'
      thread: vietnam-air-war
      c: In restrikes on Dien Bien Phu and the Yen Bai and Yen Son depots, the 12th Tactical Fighter Squadron's F-105s drop
        MLU-10 time-delay mines along the Hanoi-Lao Cai rail line, the first. Hanoi and Peking charge strikes on Lao Cai and
        nearby villages and an intrusion over Hakow, Yunnan; Hanoi protests to the ICC; American officials deny it.
      n: '[[w.staaveren-gradual-failure]], 158. To check: New York Times, Jul 13, 65, and Jul 14, 65, p 5; hist, 12th TFS,
        1 Jul–31 Dec 65, pp 4–5 (cited by [[w.staaveren-gradual-failure]], 158 n.60). See [[cal.1965-07-09.vietnam-air-war]].'
      src:
