      when: Nov. 27
      date: '1965-11-27'
      thread: vietnam-air-war
      c: 'At Dong Em, some 22 miles from Hanoi, Air Force aircraft hit a suspected SAM assembly and maintenance facility for
        three sites: eight buildings destroyed, eight damaged; 3,000-pound bombs on two cave entrances.'
      n: '[[w.staaveren-gradual-failure]], 195. To check: PACAF rpt, Sum of Air Ops, SEA, Vol XII, 26 Nov–9 Dec 65, pp 2-2
