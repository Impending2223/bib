- add:
    entry:
      id: cal.1965-05-30.vietnam-air-war
      when: May 30–June 1
      date: '1965-05-30'
      thread: vietnam-air-war
      c: The Hoai An ammunition depot struck May 30, 31 and June 1, the 45th Tactical Fighter Squadron's F-4Cs in a strike
        role over the North for the first time with F-105s; in separate strikes the same days, F-105s again on the Thanh Hoa
        bridge, its spans left standing, traffic halted for a time.
      n: '[[w.staaveren-gradual-failure]], 117, 138. To check: Hist, CINCPAC, 1965, Vol II, p 285; Analysis of Air Ops, 6–12
        Apr 65, Vol II, p 3-6, 14 May–3 Jun 65, Vol VI, p 3-55; hist, 8th TFW, Jul–Dec 65, pp 5 and 11 (cited by [[w.staaveren-gradual-failure]],
        117 n.43); Hq USAF rpt, Stat Sum Or Air Ops, SEA, Vol VI, 14 May–3 Jun 65, pp 310 to 3-13, 3-49 to 3-74 (cited by
        [[w.staaveren-gradual-failure]], 138 n.18). See [[cal.1965-05-07.vietnam-air-war]].'
