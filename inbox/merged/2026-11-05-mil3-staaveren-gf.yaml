- add:
    entry:
      id: cal.1965-03-19.vietnam-air-war
      when: Mar. 19
      date: '1965-03-19'
      thread: vietnam-air-war
      c: 'Rolling Thunder 7''s first mission, flown by Navy carrier aircraft: the Phu Van ammunition depot, 82 buildings,
        some 20 nautical miles northwest of Vinh, by 86 aircraft, 57 striking, damage put at 50 percent; six Air Force aircraft
        on twelve buildings at Vinh Son, some 70 percent damaged. The rules less confining: no longer only with the VNAF;
        seven days to complete the strikes.'
      n: '[[w.staaveren-gradual-failure]], 93–94. To check: Msg, JCS to CINCPAC, 162142Z Mar 65; msg, CINCPAC to JCS, 172219Z
        Mar 65; msg, CSAF to CINCPACAF, 181322Z Mar 65; hist, CINCPAC, 1965, Vol II, p 332 (cited by [[w.staaveren-gradual-failure]],
        93 n.73); Analysis of Air Ops, SEA, Vol I, 26 Mar 65, pp 4-8 to 4-11; memo, Col H. L. Price, Ofc Dir/Ops 2d AD to
        AFB GP (ODC), subj: Rolling Thunder VII, 18 Mar 65 (cited by [[w.staaveren-gradual-failure]], 94 n.75). See [[cal.1965-03-02.vietnam]].'
      src:
        c: 98cec4ec
        rows:
        - 'w.staaveren-gradual-failure 93–94: all'
        - 'via x.1965-03-16.msg-jcs-to-cincpac-162142z-mar-65: ?'
