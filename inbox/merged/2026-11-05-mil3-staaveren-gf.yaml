- add:
    entry:
      id: cal.1966-05-22.vietnam-air-war
      when: May 22
      date: '1966-05-22'
      thread: vietnam-air-war
      c: 'Harold Brown on NBC''s *Meet the Press*: more air power on more targets in the North might cut infiltration but
        not "cut it off," and might widen the war; "no responsible government can lightly step into such a situation."'
      n: '[[w.staaveren-gradual-failure]], 252. See [[cal.1966-04-01.vietnam-air-war]]. Names: Brown.'
      src:
        c: 9c1c0169
        rows:
