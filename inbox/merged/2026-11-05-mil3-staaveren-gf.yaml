      when: Mar. 21
      date: '1965-03-21'
      thread: vietnam-air-war
      c: Twenty-four VNAF A-1Es on the Vu Con barracks, a mile north of the DMZ, led by Farm Gate pathfinders, with Air Force
        reconnaissance, flak suppression and combat air patrol.
      n: '[[w.staaveren-gradual-failure]], 94. To check: Analysis of Air Ops, SEA, Vol I, 26 Mar 65, pp 4-8 to 4-11; memo,
