- add:
    entry:
      id: cal.1965-09-05.vietnam-air-war
      when: Sept. 5
      date: '1965-09-05'
      thread: vietnam-air-war
      c: The Navy's own EC-121, Big Look, begins flying over the Gulf of Tonkin to coordinate strikes, with an APS-20 radar
        for the Fan Song.
      n: '[[w.staaveren-gradual-failure]], 173. To check: PACAF DI rpt, Effects of Air Ops, SEA, 10th ed, 16 Sep 65, p 7,
        11th ed, 30 Sep 65, pp 11–12 (cited by [[w.staaveren-gradual-failure]], 173 n.29). See [[cal.1965-04-04.vietnam-air-war-2]].'
      src:
        c: 6b9654fa
        rows:
        - 'w.staaveren-gradual-failure 173: all'
        - 'via x.1965-09-16.pacaf-di-rpt-effects-of-air-ops: ?'
- add:
    entry:
      id: cal.1965-09-09.vietnam-air-war
      when: Sept. 9–12
      date: '1965-09-09'
      thread: vietnam-air-war
      c: 'Three strikes, Sept. 9, 11 and 12, on the Yen Khaoi army base and ammunition area, some 40 miles west of Hanoi,
        each led by Risner of the 67th Tactical Fighter Squadron, Korat, at low altitude: some 100 barracks and buildings
        destroyed or damaged; Risner''s canopy shattered on the 12th. The week ending Sept. 17, 524 Air Force combat sorties
        and 1,105 tons.'
      n: '[[w.staaveren-gradual-failure]], 181. To check: PACAF rpt, Sum of Air Ops, SEA, Vol VI, 3–16 Sep 65, pp 3-A-1 and
        3-A-2; hist, 313th AD, Jul–Dec 65, Vol I, pp 182–87 (cited by [[w.staaveren-gradual-failure]], 181 n.50). See [[cal.1965-08-20.vietnam-air-war]].'
      src:
        c: 15ed3a1e
        rows:
        - 'w.staaveren-gradual-failure 181: all'
        - 'via x.1965-07.hist-313th-ad-jul-dec-65-vol: ?'
        - 'via x.1965-09-16.pacaf-rpt-sum-of-air-ops-sea-2: ?'
- add:
    entry:
      id: cal.1965-09-09.vietnam-air-war-2
      when: Sept. 9
      date: '1965-09-09'
      thread: vietnam-air-war
      c: An SA-2 fired at four F-105s sixty-two miles west of Hanoi passes between the leader and his wingman; a pilot's report
        of square fins raises talk of an SA-3, later discounted. At least a dozen firings in the first half of September.
      n: '[[w.staaveren-gradual-failure]], 171. To check: Msg, NMCC-216-65, 16 Sep 65; and NMCC 217-65, 17 Sep 65; PACAF DI
        rpt, Effects of Air Ops, SEA, 10th ed, 16 Sep 65, p 7, 11th ed, 30 Sep 65, pp 11–12; PACAF rpt, Sum of Air Ops, SEA,
        3–16 Sep 65, Vol VI, pp 3-A-12 to 3-A-19, 17 30 Sep 65, Vol XI, pp 3-A-1 to 3-A-12 (cited by [[w.staaveren-gradual-failure]],
        171 n.27). See [[cal.1965-08-24.vietnam-air-war-2]].'
      src:
        c: 7f986d96
        rows:
        - 'w.staaveren-gradual-failure 171: all'
