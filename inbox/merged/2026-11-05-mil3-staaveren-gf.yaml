        Jul– 31 Dec 65, p 6; msg, NMCC OPSUM 176-65, 30 Jul 65; msg, NMCC OPSUM-177-65, 31 Jul 65 (cited by [[w.staaveren-gradual-failure]],
        177 n.42). See [[cal.1965-07-14.vietnam-air-war-2]].'
