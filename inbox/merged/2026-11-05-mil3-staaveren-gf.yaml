      when: Apr. 26
      date: '1966-04-26'
      thread: vietnam-air-war
      c: 'Three F-4Cs covering an EB-66 attacked by three MiG-21s, the first engagement with them: Gilmore and Smith down
        one with a Sidewinder.'
      n: '[[w.staaveren-gradual-failure]], 273–74. See [[cal.1966-04-23.vietnam-air-war]].'
