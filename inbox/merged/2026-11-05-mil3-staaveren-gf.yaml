      when: Aug. 9
      date: '1965-08-09'
      thread: vietnam-air-war
      c: 'Twelve F-105s under Hosmer of the 12th Tactical Fighter Squadron on SAM site 8, northwest of Hanoi, outside the
        sanctuary: the lead flight''s 173 CBUs on the guns, then 750-pound bombs in pop-up strikes; no aircraft lost. The
        revetments empty.'
