      id: cal.1965-12-01.vietnam-air-war-2
      when: Dec. 1
      date: '1965-12-01'
      thread: vietnam-air-war
      c: 'A record leaflet mission: Air Force pilots release a million leaflets over the Red River Delta, wind drift carrying
        them over the Hanoi-Haiphong sanctuary. By Dec. 24, seventy-seven million leaflets and fifteen thousand gift kits.'
      n: '[[w.staaveren-gradual-failure]], 211. To check: New York Times, Dec 2, 65 (cited by [[w.staaveren-gradual-failure]],
