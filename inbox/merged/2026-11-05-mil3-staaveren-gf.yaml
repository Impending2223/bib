        - 'via x.1966-06-01.new-york-times-jun-1-66: ?'
        - 'via x.1966-06-05.msg-comusmacv-to-cincpac-051201z-jun-66: ?'
      tags:
      - name:johnson-lyndon-b
      - name:wilson-harold
- add:
    entry:
      id: cal.1966-06-09.vietnam-air-war
      when: June 9
      date: '1966-06-09'
      thread: vietnam-air-war
      c: 'McConnell sends a team under Col. Charles E. Williams Jr. to study the Air Force''s command and control over the
        North. Back July 6: a radio relay and reporting center at Monkey Mountain by July 15, a Tactical Air Control Center
        there by Sept. 15, data processing at Monkey Mountain and Udorn by September 1967; two more EC-121Ds; KC-135 radio
        relay at 35,000 feet (Combat Lighting).'
      n: '[[w.staaveren-gradual-failure]], 276–77. See [[cal.1966-05-12.vietnam-air-war]]. Names: McConnell.'
      src:
        c: 0445cbe0
        rows:
        - 'w.staaveren-gradual-failure 276–77: all'
      tags:
      - name:mcconnell-john-p
- add:
    entry:
      id: cal.1966-06-12.vietnam-air-war
      when: June 12
      date: '1966-06-12'
      thread: vietnam-air-war
      c: 'Four MiG-17s jump a Navy strike force: one downed by a Sidewinder, another damaged by 20-mm fire. June 21, MiG-17s
        attack two F-8s covering a downed pilot; one presumed downed.'
      n: '[[w.staaveren-gradual-failure]], 275. To check: PACAF rpt, Sum of Air Ops, SEA, Vol XXIII, Jun 66, pp 1–16 (cited
        by [[w.staaveren-gradual-failure]], 275 n.79). See [[cal.1966-05-12.vietnam-air-war]].'
      src:
        c: 75f0edb5
        rows:
        - 'w.staaveren-gradual-failure 275: all'
        - 'via x.1966-06.pacaf-rpt-sum-of-air-ops-sea: ?'
- add:
    entry:
      id: cal.1966-06-13.vietnam-air-war-2
      when: June 13
      date: '1966-06-13'
      thread: vietnam-air-war
      c: 'McNamara to Sharp: the first strikes limited to four new targets, the oil sites at Hanoi and Haiphong and Haiphong''s
        power and cement plants, approval contingent on low civilian casualties. The Joint Staff projects 48, the CIA up to
        300; Sharp, under fifty. The strikes held for Ronning''s visit to Hanoi, June 14–18.'
      n: '[[w.staaveren-gradual-failure]], 286. To check: Msg, JCS to CINCPAC (Adm Mustin to Gens Hutchins, Hutchinson, and
        Brown), 130384Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 286 n.21). See [[cal.1966-05-31.vietnam-air-war]].
        Names: McNamara, Sharp, Ronning.'
      src:
        c: f9639dad
        rows:
        - 'w.staaveren-gradual-failure 286: all'
        - 'via x.1966-06-13.msg-jcs-to-cincpac-adm-mustin-to: ?'
      tags:
      - name:mcnamara-robert-s
      - name:sharp-u-s-grant
      - name:ronning-chester
- cite:
    id: cal.1966-06-18.vietnam
    item: '[[w.staaveren-gradual-failure]], 288 (Johnson: "We must continue to raise the cost of aggression at its source,
      and this is the sole purpose for striking selected targets")'
- add:
    entry:
      id: cal.1966-06-24.vietnam-air-war
      when: June 24
      date: '1966-06-24'
      thread: vietnam-air-war
      c: 'The day set for the oil strikes: a leak aborts them. Geyelin of the *Wall Street Journal* confirms the plan to bomb
        Haiphong''s oil; that evening the details on the Dow Jones wire; the Chiefs call the plan "thoroughly blown." Weather
        would have stopped it. Officials deny a decision, and a CBS report of B-52s.'
      n: '[[w.staaveren-gradual-failure]], 289. To check: Msg, JCS to CINCPAC, 251859Z Jun 66; Washington Post, Jun 26, 66
        (cited by [[w.staaveren-gradual-failure]], 289 n.28). See [[cal.1966-06-22.vietnam-air-war]].'
      src:
        c: 597d9546
        rows:
        - 'w.staaveren-gradual-failure 289: all'
        - 'via x.1966-06-25.msg-jcs-to-cincpac-251859z-jun: ?'
        - 'via x.1966-06-26.washington-post-jun-26-66: ?'
- cite:
    id: cal.1966-06-29.vietnam
    item: '[[w.staaveren-gradual-failure]], 289, 292 (Sharp''s execute order: the Navy on Haiphong, Bac Giang, Don Son and
      Duong Nham and the Kep radar, the Air Force on Hanoi, Nguyen Khe, Viet Tri; the Navy first, at 1350, sixteen A-6s on
      Haiphong; Hanoi''s site some 80 percent destroyed; by July 11, twenty-five sites struck)'
- add:
    entry:
      id: cal.1966-06-29.vietnam-air-war-2
      when: June 29
      date: '1966-06-29'
      thread: vietnam-air-war
      also:
      - china
      c: 'Four MiG-17s attack four F-105s after an Iron Hand mission northwest of Hanoi; Tracy, hit, downs one with his cannon,
        the first MiG for an F-105 pilot. The same day an EB-66 and three F-4Cs cross China''s border, verified by the EB-66''s
        own photographs; Mustin: "extraordinary sensitivity" in Washington.'
      n: '[[w.staaveren-gradual-failure]], 275–77. To check: Hist, 7th AF TACC-NS, Oct 67, pp 4 and 7; msg, AFSSO MACV to
        AFSSO 7th AF, 180130Z May 66; msg, NMCC to CINCPAC (Adm Mustin to Gen Everick), 070040Z Jul 66 (cited by [[w.staaveren-gradual-failure]],
        277 n.84); Msgs, CINCPAC to JCS, 040206Z Sep 66; JCS to CSAF, 102244Z Sep 66 (cited by [[w.staaveren-gradual-failure]],
