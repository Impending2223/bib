      when: Nov. 15
      date: '1965-11-15'
      thread: vietnam-air-war
      c: Two MiGs jump two RF-101s near Yen Bai, the North's air force back in action, quiet since July 10; the Voodoos escape.
        Nov. 16, two more RF-101s elude two MiGs northeast of Hanoi.
      n: '[[w.staaveren-gradual-failure]], 201. To check: Msgs, NMCC OPSUM 267-65, 16 Nov 65 and 276-65, 27 Nov 65; PACAF
