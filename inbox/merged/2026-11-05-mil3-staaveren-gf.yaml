      when: May 5
      date: '1966-05-05'
      thread: vietnam-air-war
      c: 'A fifth strike on the Bac Giang rail and highway bridge on the Hanoi–Dong Dang line, two flights of F-105s with
        3,000-pound bombs: Nix''s load on the center span; the two northern spans down, the bridge closed. Four earlier missions,
        twenty-three F-105s, 107 250-pound bombs, had damaged one span.'
