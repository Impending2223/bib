    entry:
      id: cal.1966-01-17.vietnam-force-levels
      when: Jan. 17
      date: '1966-01-17'
      thread: vietnam-air-war
      c: 'Sharp opens a three-week interservice deployment conference at Honolulu on the 1966 deployments; McNamara at its
        closing sessions in early February. Sharp''s phases: I, 220,000; II, 112,400; IIA, 57,500; IIA revised, 68,900. In
        South Vietnam 536 Air Force aircraft on eight bases, in Thailand 205 on six.'
      n: '[[w.staaveren-gradual-failure]], 230. Names: Sharp, McNamara.'
