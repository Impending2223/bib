- cite:
    id: cal.1965-03-22.vietnam-air-war
    item: '[[w.staaveren-gradual-failure]], 94 (the radar site seven miles north of Vinh Son, the first Air Force mission
      flown without the VNAF; eighteen aircraft, eight F-105s striking; the flight commander''s F-105 lost, the pilot rescued
      in fifteen minutes)'
- add:
    entry:
      id: cal.1965-03-26.vietnam-air-war
      when: Mar. 26
      date: '1965-03-26'
      thread: vietnam-air-war
      c: 'Rolling Thunder 8 (Mar. 26–Apr. 1): eight radar sites and the Vit Thu Lu barracks, four sites each to the Air Force
        and the Navy; pilots may hit installations, vehicles and patrol craft near the sites. Flown for weather only Mar.
        26, 30 and 31: six of the eight sites struck, at or near Cap Mui Ron, Ha Tinh, Cua Lo and the islands of Bach Long.'
      n: '[[w.staaveren-gradual-failure]], 94–95. To check: Msg, JCS to CINCPAC, CINCSAC, 240057Z Mar 65; msg, CINPAC to CINCPACFLT,
        CINCPACAF, COMUSMACV, 24084Z Mar 65; msg, CINCPACAF to Thirteenth AF, 2d AD, 241054Z Mar 65 (cited by [[w.staaveren-gradual-failure]],
        94 n.78); Analysis of Air Ops, Vol I, 26 Mar 65, pp 4-14A to 4-14M; hist, CINCPAC, 1965, Vol II, p 332 (cited by [[w.staaveren-gradual-failure]],
        95 n.79). See [[cal.1965-03-22.vietnam-air-war]]. Names: McNamara.'
      src:
        c: 89d7fd67
        rows:
        - 'w.staaveren-gradual-failure 94–95: all'
        - 'via x.1965-03-24.msg-cincpacaf-to-thirteenth-af-2d-ad: ?'
