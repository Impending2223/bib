      when: June 24
      date: '1965-06-24'
      thread: vietnam-air-war
      c: Two MiG-15s challenge four F-105s on the Air Force's fourth strike on the Ban Nuoc Chieu ammunition depot; both break
        off, no damage. To date the North's air defenses have downed 57 American and VNAF aircraft (Navy 26, Air Force 24,
        VNAF 7), three by MiGs, the rest by groundfire, and damaged 161.
      n: '[[w.staaveren-gradual-failure]], 140–41, 145. To check: Hq USAF rpt, Stat Sum of Air Ops, SEA, Vol VIII, 11–24 Jun
        65, pp 3-123 to 3-128, tab 3B (cited by [[w.staaveren-gradual-failure]], 140 n.22); DIA Bull, 24 May 65; PACOM WID
        No 9-65, 26 Feb 65 and No 20-65, 14 May 65 (cited by [[w.staaveren-gradual-failure]], 141 n.25); Hq USAF rpt, Stat
        Sum of Air Ops, SEA, Vol VII, 11–24 Jun 65, p 3-6 (cited by [[w.staaveren-gradual-failure]], 145 n.32). See [[cal.1965-06-17.vietnam-air-war]].'
