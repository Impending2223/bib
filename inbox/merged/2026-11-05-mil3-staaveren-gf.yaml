      - name:brown-harold
- add:
    entry:
      id: cal.1966-05-24.vietnam-air-war-2
      when: May 24
      date: '1966-05-24'
      thread: vietnam-air-war
      c: 'McNamara approves adjusted monthly sortie allocations for the rest of 1966, by the ordnance and aircraft expected:
        the services unlikely to use "effectively" more than 60,000 tons of air munitions a month.'
      n: '[[w.staaveren-gradual-failure]], 264. To check: Memo, SECDEF to JCS Chmn, subj: Air Munitions and Sortie Plan, 24
        May 66 (cited by [[w.staaveren-gradual-failure]], 264 n.50). See [[cal.1966-04-11.defense]]. Names: McNamara.'
      src:
        c: 39cc58a1
        rows:
        - 'w.staaveren-gradual-failure 264: all'
        - 'via x.1966-05-24.memo-secdef-to-jcs-chmn-subj-air: ?'
