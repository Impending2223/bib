- add:
    entry:
      id: cal.1966-05-26.vietnam-air-war
      when: May 26
      date: '1966-05-26'
      thread: vietnam-air-war
      c: Shrike allocations to the Air Force cut; Moore to fire them at SAM radars only. In May the Wild Weasels fire 55 Shrikes,
        in June 32; Apr. 18–July 15, 107 launched, one hit confirmed, 38 probable.
      n: '[[w.staaveren-gradual-failure]], 270–71. To check: Fact sheet, subj: Wild Weasel, 22 Apr 66, in Notebook on CINCPACAF
        and Vice COFS USAF Conference, 25–26 Apr 66 at Hickam AFB, Hawaii; msg, 7th AF to PACAF, 280856Z May 66 (cited by
        [[w.staaveren-gradual-failure]], 271 n.68). See [[cal.1966-04-18.vietnam-air-war]]. Names: Moore.'
      src:
        c: dbe003e0
        rows:
        - 'w.staaveren-gradual-failure 270–71: all'
