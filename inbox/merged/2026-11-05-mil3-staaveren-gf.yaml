- cite:
    id: cal.1965-12-15.vietnam
    item: '[[w.staaveren-gradual-failure]], 203–04 (Dec. 15, ninety Air Force aircraft, twenty-three F-105s striking; all
      but seven jettison their bombs for the weather; fourteen 3,000-pound bombs on a corner of the plant; an F-105 downed,
      five damaged; McNamara: "not ... retaliatory" but "appropriate to the increased terror activity")'
- add:
