      when: Jan. 20
      date: '1966-01-20'
      thread: vietnam-air-war
      c: 'McConnell to a joint session of the House Armed Services and Appropriations Committees, by Van Staaveren: the enemy
        rebuilding routes and moving supplies and troops south by day in the pause; later, ten more SA-2 sites found during
        it, at least sixty in all.'
      n: '[[w.staaveren-gradual-failure]], 217. Check: the day and the committees: the Daily Digest names McConnell a witness
        before Senate Armed Services and the Appropriations defense subcommittee, jointly in executive session, Jan. 25 ([Daily
        Digest D18](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=16)), their
        hearings opened Jan. 20 ([[cal.1966-01-20.vietnam-supplemental]]). To check: hearings of Jt Session of Senate Armed
        Services and Appropriations Cmtes in FY 1966 Supplemental, Background Paper on Pertinent Testimony by SECDEF and JCS,
        20 Jan 66; intvw, McConnell with Hearst Panel, 21 Mar 66; Test of Gen Wheeler before House Cmte on Armed Services,
        3 Feb 66, pp 135–66; hist, CINCPAC, 1966, Vol II, pp 490–91 (cited by [[w.staaveren-gradual-failure]], 217 n.5). See
        [[cal.1965-12-24.vietnam]]. Names: McConnell.'
