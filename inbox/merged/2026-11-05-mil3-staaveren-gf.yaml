      when: Feb. 3
      date: '1966-02-03'
      thread: vietnam-air-war
      c: 'Wheeler to a House committee, four days after the bombing resumed: the North Vietnamese "worked around the clock
        rebuilding bridges, building fords"; the infiltration''s effect to show in sixty or ninety days; the halt''s military
        cost to be weighed against the President''s search for peace.'
      n: '[[w.staaveren-gradual-failure]], 217. To check: hearings of Jt Session of Senate Armed Services and Appropriations
        Cmtes in FY 1966 Supplemental, Background Paper on Pertinent Testimony by SECDEF and JCS, 20 Jan 66; intvw, McConnell
        with Hearst Panel, 21 Mar 66; Test of Gen Wheeler before House Cmte on Armed Services, 3 Feb 66, pp 135–66; hist,
        CINCPAC, 1966, Vol II, pp 490–91 (cited by [[w.staaveren-gradual-failure]], 217 n.5). See [[cal.1966-01-31.vietnam-air-war]].
        Names: Wheeler.'
