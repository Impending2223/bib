      when: May, early
      date: 1966-05
      thread: vietnam-air-war
      c: 'A Blue Spring drone finds 132 SA-2 canisters and a SAM maintenance installation at the Hanoi barracks northeast
        of Gia Thong Boe, enough for eleven battalions. Sharp: a strike "a severe blow"; Wheeler: not expedient "at this time,"
        for the oil talks.'
