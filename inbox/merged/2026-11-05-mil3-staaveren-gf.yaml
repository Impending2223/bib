- add:
    entry:
      id: cal.1966-04-23.vietnam-air-war
      when: Apr. 23
      date: '1966-04-23'
      thread: vietnam-air-war
      c: 'Four F-4Cs of the 555th Tactical Fighter Squadron, covering F-105s bound for the Bac Giang bridge, meet four MiG-17s:
        two downed, by Cameron and Evans and by Blake and George. From Apr. 23 to the month''s end, thirty-nine or forty MiGs
        try to break up the missions; six downed without loss.'
      n: '[[w.staaveren-gradual-failure]], 273. See [[cal.1965-07-10.vietnam-air-war]].'
      src:
        c: 3b5f635b
        rows:
        - 'w.staaveren-gradual-failure 273: all'
- add:
    entry:
      id: cal.1966-04-24.vietnam-air-war
      when: Apr. 24
      date: '1966-04-24'
      thread: vietnam-air-war
      c: The last confirmed SAM kill of an Air Force plane through Rolling Thunder 50. By mid-1966 no more than 15 to 18 of
        376 aircraft lost over the North downed by SAMs; at least 24 firings in May and 31 in June, none scoring.
      n: '[[w.staaveren-gradual-failure]], 268. See [[cal.1966-03-31.vietnam-air-war]].'
      src:
        c: 41f17447
        rows:
        - 'w.staaveren-gradual-failure 268: all'
- add:
    entry:
      id: cal.1966-04-25.vietnam-air-war
      when: Apr. 25–26
      date: '1966-04-25'
      thread: vietnam-air-war
      c: The night of Apr. 25–26, B-52s "bombed through" a Navy mission working over the SAM target on the Laos–South Vietnam
        border assigned to the Arc Light strike. Sullivan and Sharp against more B-52 strikes on the Mụ Giạ area; Washington
        sides with them; none there again until December.
      n: '[[w.staaveren-gradual-failure]], 262. To check: Msg, Amembassy Vientiane 1121 to SECSTATE 26 Apr 66; msg, CINCPAC
        to JCS, COMUSMACV, 300405Z Apr 66 (cited by [[w.staaveren-gradual-failure]], 262 n.43). See [[cal.1966-04-12.vietnam]].
        Names: Sullivan, Sharp.'
