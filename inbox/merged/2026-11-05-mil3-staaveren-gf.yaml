      date: '1965-06-25'
      thread: vietnam-air-war
      c: 'Rolling Thunder 20 and 21: targets west and northwest of Hanoi, struck by F-105s and F-4Cs: the Ban Nuoc Chieu depot,
        the Son La barracks on Route 6, blasted several times in the last week of June, and the Dien Bien Phu airfield and
        barracks, 70, 110 and 170 miles from Hanoi.'
      n: '[[w.staaveren-gradual-failure]], 138. See [[cal.1965-05-30.vietnam-air-war]].'
