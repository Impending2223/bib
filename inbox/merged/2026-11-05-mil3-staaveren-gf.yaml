      when: Apr. 17
      date: '1966-04-17'
      thread: vietnam-air-war
      c: An F-105 strike collapses the Phu Ly railroad bridge, thirty-three miles southeast of Hanoi, knocked out for the
        second time. Navy single-mission strikes make the Hai Duong bridge unusable, and the Haiphong bridge Apr. 19.
      n: '[[w.staaveren-gradual-failure]], 247, 257. To check: Msg, CINCPAC to JCS, 04044722 May 66; PACAF rpt, Sum of Air
