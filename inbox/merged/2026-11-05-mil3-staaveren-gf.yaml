- add:
    entry:
      id: cal.1965-12-08.vietnam-air-war
      when: Dec. 8
      date: '1965-12-08'
      thread: vietnam-air-war
      c: 'The 333d Tactical Fighter Squadron, F-105s, arrives at Takhli, to the 355th Tactical Fighter Wing, on a year''s
        PCS tour, as the 390th, F-4Cs, came to Đà Nẵng in November. McConnell''s rule: a pilot''s tour a hundred missions
        over the North or Laos, or a year.'
      n: '[[w.staaveren-gradual-failure]], 210. To check: hist, 355th TFW, 1 Jul–31 Dec 65, p 36; Personnel Support, Phase
        I (DCS/P, Hqs USAF, Proj Corona Harvest), 1 Feb 68, p 59 (cited by [[w.staaveren-gradual-failure]], 210 n.17). Names:
        McConnell.'
