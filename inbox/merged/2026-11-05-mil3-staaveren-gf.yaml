        Jun 66, and CINCPAC to CINCPACAF and CINCPACFLT, 15041Z Apr 66; PACAF rpts, Sum of Air Ops, SEA, Vol XXI, Apr 66,
        p 1-15; and Data Addendum, Vol XXI Apr 66, pp 1-A-78 and 1-A-79 (cited by [[w.staaveren-gradual-failure]], 256 n.28);
        Msg, CINCPAC to JCS, 04044722 May 66; PACAF rpt, Sum of Air Ops, SEA, Vol XXI, Apr 66, pp 1-5 to 1-17, Vol XXIII,
        Jun 66, p 1-31 (cited by [[w.staaveren-gradual-failure]], 257 n.31). See [[cal.1966-04-29.vietnam-air-war]].'
