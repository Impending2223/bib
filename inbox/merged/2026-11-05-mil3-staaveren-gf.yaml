    item: '[[w.staaveren-gradual-failure]], 85 (held five days, the VNAF not on alert, and weather; Taylor: "We are failing
      to give the mounting crescendo to Rolling Thunder"; Kỳ leads twenty A-1Hs on the barracks on Hon Gio (Tiger) Island)'
- add:
    entry:
      id: cal.1965-05-13.vietnam
      when: May 13
      date: '1965-05-13'
      thread: vietnam
      c: 'Johnson to the Association of American Editorial Cartoonists, "The Challenge of Human Need in Viet-Nam": "there
        is no purely military solution in sight for either side"; ready for unconditional discussions; China''s "target is
        not merely South Viet-Nam; it is Asia." Nothing of the bombing pause.'
      n: '"Address to Members of the Association of American Editorial Cartoonists: The Challenge of Human Need in Viet-Nam,"
        [1965 Pub. Papers 522](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=598) (May 13,
        1965); [[w.staaveren-gradual-failure]], 134 (the address''s silence on the pause). See [[cal.1965-05-12.vietnam]].
        Names: Johnson.'
      src:
        c: 438f3aa1
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=598: A-C'
        - 'w.staaveren-gradual-failure 134: A, D'
      tags:
      - name:johnson-lyndon-b
- cite:
    id: cal.1964-01-24.vietnam
    item: '[[w.staaveren-gradual-failure]], 38 (MACSOG set up Jan. 24, 1964, the CIA supporting, a special staff section under
      MACV''s J-5, in five categories: air and airborne, maritime, psychological, intelligence, logistic)'
- add:
    entry:
      id: cal.1964-02-13.vietnam-air-war
      when: Feb. 13
      date: '1964-02-13'
      thread: vietnam-air-war
      c: Two SAC U-2s of the 4080th Strategic Wing, from Clark, the Philippines, nicknamed Lucky Dragon, begin two sorties
        a day over parts of Laos, Cambodia and South Vietnam, to map the borders and gather intelligence. Mar. 5, the unit
        moves to Biên Hòa; its photographs show North Vietnamese activity near the Plain of Jars, and fewer strategic hamlets
        than the 8,000 claimed.
      n: '[[w.staaveren-gradual-failure]], 38. See [[cal.1964-01-24.vietnam]].'
      src:
        c: 1549f436
        rows:
        - 'w.staaveren-gradual-failure 38: all'
- cite:
    id: cal.1964-02.vietnam-3
    item: '[[w.staaveren-gradual-failure]], 38, 48 (the *Craig*, from Feb. 28 into March, a show of force and a collection
      of data on infiltration by sea; the patrol Feb. 28–Mar. 10)'
- check:
    id: cal.1964-02.vietnam-3
    text: 'Check: Van Staaveren has the *Craig* allowed within four nautical miles of the mainland, fifteen of China''s, twelve
      of its islands (38).'
- add:
    entry:
      id: cal.1964-05-09.vietnam-air-war
      when: May 9
      date: '1964-05-09'
      thread: vietnam-air-war
      c: The Joint Chiefs approve B-57 training for six VNAF pilots; the first two finish June 27.
      n: '[[w.staaveren-gradual-failure]], 47. See [[cal.1964-02-13.vietnam-air-war]].'
