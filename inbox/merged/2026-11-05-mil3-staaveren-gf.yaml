      when: July 5
      date: '1966-07-05'
      thread: vietnam-air-war
      c: 'The last day of Rolling Thunder 50: at least twenty-six SAMs fired at aircraft northwest of Hanoi, none hits. About
        115 sites known, twenty to twenty-five firing battalions, against 99 sites and twelve to fifteen at the end of 1965.'
      n: '[[w.staaveren-gradual-failure]], 268, 272. See [[cal.1966-04-24.vietnam-air-war]].'
