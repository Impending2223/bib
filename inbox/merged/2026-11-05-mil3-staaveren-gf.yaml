      when: July 14
      date: '1965-07-14'
      thread: vietnam-air-war
      c: Four F-105s damage two trucks thirty-seven miles north of Dien Bien Phu, the furthest penetration yet. The Navy drops
        a span of the Tri Dong highway bridge, hits the Hamp Rong port facility for the first time and restrikes the Ban Xom
        Lam barracks; four Navy missions on the Thanh Hoa bridge, its spans intact.
