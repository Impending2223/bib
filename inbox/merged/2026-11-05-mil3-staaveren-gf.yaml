      when: July 28
      date: '1965-07-28'
      thread: vietnam-air-war
      c: 'F-105s of the 12th Tactical Fighter Squadron drop 3,000-pound bombs for the first time, on the Thanh Hoa bridge:
        the spans stand; foot traffic halted for a time. The Navy''s strikes in the Nam Dinh area; the Nam Dinh and Thanh
        Hoa power plants judged destroyed, 7 percent of the North''s electric capacity; the first searchlights tracking aircraft,
        in a night attack on Thanh Hoa.'
