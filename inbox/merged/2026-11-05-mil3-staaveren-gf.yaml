      id: cal.1965-12-22.vietnam-air-war
      when: Dec. 22
      date: '1965-12-22'
      thread: vietnam-air-war
      c: 'The third strike on the Uong Bi plant: thirty-five Navy aircraft hit the Haiphong bridge, closing it for a time,
        then the plant, some twenty-five tons and three Bullpups; most of it destroyed, the North''s generating loss some
        47,000 kilowatts, 27 percent. Antiaircraft fire downs two A-4s and an RA-5; at the bridge, SAMs an A-6A and an RA-5.
        Five aircraft lost in all on the plant.'
      n: '[[w.staaveren-gradual-failure]], 204. Check: Van Staaveren also says SAMs downed an A-5A and an RA-5A in the strike
        on the plant (195). See [[cal.1965-12-15.vietnam]].'
      src:
        c: b5c3e7f4
        rows:
        - 'w.staaveren-gradual-failure 204: all'
