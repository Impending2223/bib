- add:
    entry:
      id: cal.1966-08-04.vietnam-air-war
      when: Aug. 4
      date: '1966-08-04'
      thread: vietnam-air-war
      c: 'On Sharp''s order a carrier moves from Dixie Station to Yankee Station: all three carriers on Rolling Thunder; the
        Navy takes the Nape and Barthelemy Passes from the Seventh Air Force, and 900 of the 1,000 added sorties.'
      n: '[[w.staaveren-gradual-failure]], 299. To check: CM-1638, 23 Jul 66; msg, COMUSMACV to 7th AF, 300222Z Jul 66; PACAF
        rpt, Sum of Air Ops, SEA, Aug 66, Vol XXV, p 1-B-4 (cited by [[w.staaveren-gradual-failure]], 299 n.51). See [[cal.1966-07-24.vietnam-air-war-2]].
        Names: Sharp.'
      src:
        c: 9de17546
