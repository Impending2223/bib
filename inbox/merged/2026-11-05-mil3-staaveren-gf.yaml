      when: July 8
      date: '1965-07-08'
      thread: vietnam-air-war
      c: McConnell takes the 2d Air Division out of the Thirteenth Air Force and puts it directly under PACAF; the Thirteenth
        keeps the Thai bases' units for administration and logistics only; Murphy also its deputy commander. Wilson succeeds
        Maddux at the Thirteenth, July 15.
