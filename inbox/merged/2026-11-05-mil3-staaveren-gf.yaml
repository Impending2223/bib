      when: Dec. 10
      date: '1965-12-10'
      thread: vietnam-air-war
      c: 'Sharp divides North Vietnam into six route packages for armed reconnaissance: 2, 4 and 5 to the Air Force, 1 and
        3 to the Navy, exchanged every two weeks; 6, the northeast, mission by mission. Rolling Thunder 44 and 45 (Dec. 10–23)
        approve the Uong Bi power plant and a bridge near Haiphong.'
      n: '[[w.staaveren-gradual-failure]], 203, 209–10. To check: Msg, JCS to CINCPAC, 090002 Dec 65; memo, Lt Gen F. Carroll,
        Dir DIA to SECDEF, 21 Jan 66, subj: An Appraisal of Bombing in NVN; New York Times, Dec 16, 65 (cited by [[w.staaveren-gradual-failure]],
        203 n.9); PACAF rpt, Sum of Air Ops, SEA, Vol XIII, 10–23 Dec 65, pp 2-A-1 thru 2A-27 (cited by [[w.staaveren-gradual-failure]],
        203 n.10). See [[cal.1965-10-01.vietnam-air-war]]. Names: Sharp.'
