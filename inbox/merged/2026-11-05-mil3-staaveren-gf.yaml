      tags:
      - name:moore-joseph-h
- add:
    entry:
      id: cal.1966-05-31.vietnam-air-war
      when: May 31
      date: '1966-05-31'
      thread: vietnam-air-war
      c: 'Air Force and Navy strikes on six dispersed oil sites south of Hanoi, at Vinh, Phuc Loi, Da Loc, Yen Duong and Phu
        Qui: with other targets, 313 sorties, the most in a day since March 1965. Before it, Johnson tells Wilson he means
        to bomb the major sites; Wilson asks him not to.'
      n: '[[w.staaveren-gradual-failure]], 285. To check: Msg, COMUSMACV to CINCPAC, 051201Z Jun 66; PACAF rpt, Sum of Air
        Ops, SEA, Vol XXII, May 66, pp 1-7 to 1-10, Data Addendum, pp 1-A-78 to 1A-83, 1-A-175 to 1-A-181; New York Times,
        Jun 1, 66 (cited by [[w.staaveren-gradual-failure]], 285 n.16). See [[cal.1966-05-24.vietnam-air-war]]. Names: Wilson.'
      src:
        c: c66f53f8
        rows:
        - 'w.staaveren-gradual-failure 285: all'
