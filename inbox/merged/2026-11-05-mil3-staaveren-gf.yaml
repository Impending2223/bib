- add:
    entry:
      id: cal.1966-08-11.vietnam-air-war
      when: Aug. 11
      date: '1966-08-11'
      thread: vietnam-air-war
      c: 'McNamara asks the Chiefs for a briefing each Monday on the oil campaign: facilities destroyed, capacity left, the
        effect on transport, plans. Momyer, Aug. 12, to Harris and McConnell: nearly all known caches in route package 1 bombed;
        more attacks on small targets questionable. Late August, Sharp: some 66,000 metric tons left, 17,000 at sites not
        authorized.'
      n: '[[w.staaveren-gradual-failure]], 300–01. To check: Msg, JCS to CINCPAC 111813Z Aug 66; msg, CINCPAC to DIA, 110015Z
        Aug 66; msgs, 7th AF to CINCPAC, 130845Z Aug 66 and to PACAF, 300940Z Aug 66 (cited by [[w.staaveren-gradual-failure]],
        301 n.58). See [[cal.1966-07-24.vietnam-air-war-2]]. Names: McNamara, Momyer, McConnell, Sharp.'
      src:
        c: 11adceb4
        rows:
        - 'w.staaveren-gradual-failure 300–01: all'
