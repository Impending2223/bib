      when: July 2
      date: '1965-07-02'
      thread: vietnam-air-war
      c: 'Twenty-eight F-105s and F-4Cs strike the Dien Bien Phu airfield and the barracks of the 316th Brigade twice: 23
        buildings destroyed, 7 damaged, the airfield cratered. A second strike, July 8, thirteen aircraft, only craters for
        the weather. Leaflets on Mac Chou, eighty miles southwest of Hanoi: the strikes to go on "violently" and "unceasingly."'
      n: '[[w.staaveren-gradual-failure]], 139, 141. To check: Msg, JCS to CINCPAC, 111659Z and 152030Z Jun 65; msg, CINCPAC
        TO CINCPACFLT, CINCPACAF, COMUSMACV, 161814Z Jun 65; msg, CINCPACAF to 13th AF, 2d AD, 240755Z and 240331Z Jun 65;
        msg, CINCPACAF to CINCPAC, 120235Z Jun 65; msg, JCS to CINCPAC, 292236Z Jun 65; msg, CINCPACAF to 13th AF, 2d AD,
        301700Z Jun 65; hist, CINCPAC, 1965, Vol II, p 333; Hq USAF rpts, Stat Sum of Air Ops, SEA, Vol VIII, 11–24 Jun 65,
        pp 3-5 to 3-8, Vol IX, 25 Jun–8 Jul 65, pp 3-1 to 3-11; Baltimore Sun, Jun 24, 65 (cited by [[w.staaveren-gradual-failure]],
        139 n.19); New York Times, Jun 29, 65 (cited by [[w.staaveren-gradual-failure]], 141 n.23). See [[cal.1965-06-25.vietnam-air-war]].'
