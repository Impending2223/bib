- add:
    entry:
      id: cal.1966-02-06.vietnam-air-war
      when: Feb. 6
      date: '1966-02-06'
      thread: vietnam-air-war
      c: 'At Sullivan''s request, approved in Washington, Wheeler having told Sharp to "neutralize the military activity there":
        Moore sends four morning missions and one afternoon on the Dien Bien Phu airfield complex, seventeen F-105s and four
        F-4Cs. Reconnaissance: marginal damage, the runway not cratered. Wheeler has McNamara put Dien Bien Phu in the armed
        reconnaissance area.'
      n: '[[w.staaveren-gradual-failure]], 227–28. See [[cal.1966-01-31.vietnam-air-war]]. Names: Sullivan, Wheeler, Sharp,
        Moore, McNamara.'
      src:
        c: 1f054f0b
        rows:
        - 'w.staaveren-gradual-failure 227–28: all'
      tags:
      - name:sullivan-william-h
      - name:wheeler-earle
      - name:sharp-u-s-grant
      - name:moore-joseph-h
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-02-15.vietnam-air-war
      when: Feb. 15–16
      date: '1966-02-15'
      thread: vietnam-air-war
      c: 'Eight more F-105s on the Dien Bien Phu area; two missions Feb. 16, one of four F-105s and two Navy A-1s; more structures
        destroyed. Pilots'' claims, Feb. 4–17: vehicles 21 destroyed and 11 damaged, rivercraft 29 and 37, bridges 16 and
        60, structures 47 and 56; 215 road cuts.'
      n: '[[w.staaveren-gradual-failure]], 228. To check: Msgs, CJCS to ACJCS (Personal, Wheeler to Adm McDonald), 090021Z
        Feb 66; PACAF rpt, Sum of Air Ops, SEA, Vol XVII, 4–17 Feb 66, pp 2-B-8, 2-B-9, 2-B-22, and 2-B-23 (cited by [[w.staaveren-gradual-failure]],
        228 n.25). See [[cal.1966-02-06.vietnam-air-war]]. Names: Moore.'
      src:
        c: 6762f138
        rows:
        - 'w.staaveren-gradual-failure 228: all'
        - 'via x.1966-02-09.msgs-cjcs-to-acjcs-personal-wheeler-to: ?'
        - 'via x.1966-02-17.pacaf-rpt-sum-of-air-ops-sea: ?'
      tags:
      - name:moore-joseph-h
- add:
    entry:
      id: cal.1966-02-12.vietnam-air-war
      when: Feb. 12
      date: '1966-02-12'
      thread: vietnam-air-war
      c: 'McNamara with Wheeler: more attack sorties and latitude for the commanders, aircraft and weather permitting; he
        asks Sharp''s view. Sharp, in the Chiefs'' paper of Feb. 19: 10,000 to 11,000 strike sorties a month for the North
        and Laos, up to 7,500 for Rolling Thunder.'
      n: '[[w.staaveren-gradual-failure]], 236. To check: JCSM-113-55, 19 Feb 66 (cited by [[w.staaveren-gradual-failure]],
        236 n.44). See [[cal.1966-02-19.vietnam-air-war]]. Names: McNamara, Wheeler, Sharp.'
      src:
        c: 29f54f71
        rows:
        - 'w.staaveren-gradual-failure 236: all'
        - 'via x.1966-02-19.jcsm-113-55-19-feb-66: ?'
