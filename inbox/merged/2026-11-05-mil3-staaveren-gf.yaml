- cite:
    id: cal.1965-08-11.vietnam-air-war
    item: '[[w.staaveren-gradual-failure]], 167–68 (the armed reconnaissance boundary moved to 20°30''N; SAM sites 6, 7 and
      8 and bridges northwest of Hanoi allowed; not within ten miles of Haiphong or the buffer zone to China; Iron Hand sorties
      outside the program''s limits)'
- add:
    entry:
      id: cal.1965-08-20.vietnam-air-war
      when: Aug. 20
      date: '1965-08-20'
      thread: vietnam-air-war
      c: 'Rolling Thunder 28 and 29 (Aug. 20–Sept. 2), the first with Iron Hand missions: planned armed reconnaissance raised
        from 500 to 1,000 sorties, split evenly between the Navy and the Air Force and VNAF; other aircraft to stay out of
        range of the SA-2 sites.'
      n: '[[w.staaveren-gradual-failure]], 170. To check: Msg, JCS to CINCPAC, 172220Z Aug 65; msg, CINCPACAF to 2d AD, 181637Z
        Aug 65 (cited by [[w.staaveren-gradual-failure]], 170 n.20). See [[cal.1965-08-16.vietnam-air-war]].'
      src:
        c: 411d271b
        rows:
        - 'w.staaveren-gradual-failure 170: all'
        - 'via x.1965-08-17.msg-jcs-to-cincpac-172220z-aug-65: ?'
        - 'via x.1965-08-18.msg-cincpacaf-to-2d-ad-181637z-aug: ?'
- add:
    entry:
      id: cal.1965-08-22.vietnam-air-war
      when: Aug. 22
      date: '1965-08-22'
      thread: vietnam-air-war
      c: 'The largest one-day Air Force effort of the war: eighty-seven strike sorties, 228 tons, on the Ban Thach power plant,
        the fifth struck, and other targets. Its dam and generator building hit five times Aug. 21–23; Aug. 23, eight 3,000-pound
        bombs. Headlines on bombing the dikes; State has OSD stop targeting dams and locks.'
      n: '[[w.staaveren-gradual-failure]], 179. See [[cal.1965-07-28.vietnam-air-war]].'
      src:
        c: fcf311e6
        rows:
        - 'w.staaveren-gradual-failure 179: all'
- add:
    entry:
      id: cal.1965-08-23.vietnam-air-war
      when: Aug. 23
      date: '1965-08-23'
      thread: vietnam-air-war
      c: 'Sixteen Navy A-4Es with six F-8s, at low level with Snake Eyes, on a suspected SAM site some 35 miles northeast
        of Hanoi: the site empty, six aircraft damaged. Air Force Iron Hand searches, Aug. 23 and 24, find no sites and hit
        the Xom Ban and Ban Na Pew barracks.'
      n: '[[w.staaveren-gradual-failure]], 170. To check: Hq PACAF rpt, Sum of Air Ops, SEA, Vol V, 20 Aug–2 Sep 65, pp 3-1,
        3-A-5 (cited by [[w.staaveren-gradual-failure]], 170 n.21). See [[cal.1965-08-20.vietnam-air-war]].'
      src:
        c: 35e50aa6
        rows:
        - 'w.staaveren-gradual-failure 170: all'
        - 'via x.1965-09-02.hq-pacaf-rpt-sum-of-air-ops: ?'
- add:
    entry:
      id: cal.1965-08-24.vietnam-air-war-2
      when: Aug. 24
      date: '1965-08-24'
      thread: vietnam-air-war
      c: 'A Navy F-4B on barrier patrol at 12,000 feet lost to a salvo of some seven SAMs from a site ten miles north of the
        Thanh Hoa bridge, one of the crew believed killed, the other captured: the fourth American loss to SAMs. Sharp asks
        a more vital target, Haiphong''s main POL installation. Known sites: seven at the end of July; eighteen confirmed
        and eighteen suspected by Sept. 2.'
      n: '[[w.staaveren-gradual-failure]], 170. See [[cal.1965-08-20.vietnam-air-war]]. Names: Sharp.'
      src:
        c: b0a877a6
        rows:
        - 'w.staaveren-gradual-failure 170: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1965-08-27.vietnam-air-war
      when: Aug. 27
      date: '1965-08-27'
      thread: vietnam-air-war
      c: 'The 68th Tactical Fighter Squadron''s F-4Cs, crews trained for night flying, deploy from George, Cal., to Korat,
        Thailand: Night Owl, two Phantoms in tandem, flares and 750-pound bombs, from Rolling Thunder 33 in late September;
        six missions, then eight, a night. Oct. 29–Nov. 11, only 90 of 260 sorties flown, for the monsoon.'
      n: '[[w.staaveren-gradual-failure]], 182. See [[cal.1965-05-04.vietnam-air-war-2]].'
      src:
        c: 140dc858
        rows:
        - 'w.staaveren-gradual-failure 182: all'
- add:
    entry:
      id: cal.1965-09-04.vietnam-air-war
      when: Sept. 4
      date: '1965-09-04'
      thread: vietnam-air-war
      c: A Navy aircraft detects a Fan Song emission and strikes a suspected SAM site in buildings near a canal; not verified.
        Sept. 12–14, 338 Navy Iron Hand sorties find nothing.
      n: '[[w.staaveren-gradual-failure]], 171. To check: Msg, NMCC-216-65, 16 Sep 65; and NMCC 217-65, 17 Sep 65; PACAF DI
        rpt, Effects of Air Ops, SEA, 10th ed, 16 Sep 65, p 7, 11th ed, 30 Sep 65, pp 11–12; PACAF rpt, Sum of Air Ops, SEA,
        3–16 Sep 65, Vol VI, pp 3-A-12 to 3-A-19, 17 30 Sep 65, Vol XI, pp 3-A-1 to 3-A-12 (cited by [[w.staaveren-gradual-failure]],
        171 n.27). See [[cal.1965-08-20.vietnam-air-war]].'
      src:
