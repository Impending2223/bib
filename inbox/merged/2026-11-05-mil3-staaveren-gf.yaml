- add:
    entry:
      id: cal.1965-03-30.vietnam-air-war-2
      when: Mar. 30
      date: '1965-03-30'
      thread: vietnam-air-war
      c: Photo reconnaissance over the North allowed at lower altitude, the area extended from the 20th to the 21st parallel;
        Sharp may schedule photo missions himself, no more than ten two-aircraft missions a week.
      n: '[[w.staaveren-gradual-failure]], 95. To check: Msg, CINCPAC to JCS, 210515Z Mar 65; msg, JCS to CINCPAC, 300059Z
        Mar 65 (cited by [[w.staaveren-gradual-failure]], 95 n.83). See [[cal.1965-03-22.vietnam-air-war]]. Names: Sharp.'
      src:
