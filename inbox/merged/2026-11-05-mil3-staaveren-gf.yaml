      date: '1965-12-19'
      thread: vietnam-air-war
      c: 'Two SAMs fired at an Air Force raid on the Bac Can highway bridge: an F-4C disabled, its crew ejects and is rescued.
        That night the Navy''s second strike on the Uong Bi plant, six A-6As with 2,000-pound bombs, and on the Haiphong highway
        bridge: the plant missed, an A-6A downed by a SAM.'
