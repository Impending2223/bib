- add:
    entry:
      id: cal.1966-04-29.vietnam-air-war
      when: Apr. 29
      date: '1966-04-29'
      thread: vietnam-air-war
      c: 'Thirteen F-105s on the Thai Nguyen railyard, at Harris''s urging, approved in Washington: tracks torn up, some twelve
        cars destroyed; one plane and pilot lost. The 555th''s F-4Cs, covering a strike on the Bac Giang bridge, down two
        MiG-17s, Dowell and Cossard by Sidewinder, Keith and Bleakley by maneuver.'
      n: '[[w.staaveren-gradual-failure]], 255–56, 274. See [[cal.1966-04-23.vietnam-air-war]].'
      src:
        c: 9ae9b907
        rows:
        - 'w.staaveren-gradual-failure 255–56, 274: all'
- add:
    entry:
      id: cal.1966-04-30.vietnam-air-war
      when: Apr. 30
      date: '1966-04-30'
      thread: vietnam-air-war
      c: Four MiG-17s dive on four F-4Cs covering a rescue some 100 miles west of Hanoi; Goldberg and Hargrove down one with
        a Sidewinder and land at Udorn with 400 pounds of fuel.
      n: '[[w.staaveren-gradual-failure]], 274. See [[cal.1966-04-23.vietnam-air-war]].'
      src:
