      when: Nov. 25
      date: '1965-11-25'
      thread: vietnam-air-war
      c: Four Wild Weasel F-100Fs, with radar homing and warning gear, deploy from Eglin, Fla., to Korat, Thailand, under
        Willard. The same day four to six MiGs fire on reconnaissance aircraft sixty-seven miles northwest of Hanoi, and MiGs
        twice engage the Navy's second wave on the Me Xa bridge, an A-4E damaged.
