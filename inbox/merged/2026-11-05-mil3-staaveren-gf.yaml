- cite:
    id: cal.1965-04-01.laos
    item: '[[w.staaveren-gradual-failure]], 96 (personnel of the 15th TRS at Udorn Mar. 6 to arrange the move; the first four
      RF-101s there Mar. 31; the first Yankee Team mission the next day; Blue Tree over the North from April)'
- cite:
    id: cal.1965-04-03.laos
    item: '[[w.staaveren-gradual-failure]], 97 (the night of Apr. 3, Moore''s two missions on truck traffic over three routes
      in southern Laos, each a C-130 Blindbat and two B-57s)'
- cite:
    id: cal.1965-04-04.vietnam-air-war
    item: '[[w.staaveren-gradual-failure]], 107–08, 117 (four MiG-17s, in two waves, on four F-105s circling ten miles south
      of the Thanh Hoa bridge; the two lead F-105s and their pilots lost; a MiG attack on a Navy F-8E the day before; Johnson
      tells the Chiefs he wants no more MiGs shot down)'
- add:
    entry:
      id: cal.1965-04-04.vietnam-air-war-2
      when: Apr. 4
      date: '1965-04-04'
      thread: vietnam-air-war
      c: 'After the MiG attacks of Apr. 3 and 4, Washington authorizes Big Eye: five EC-121Ds of the 552d Airborne Early Warning
        and Control Wing, with 153 aircrew and support, begin to deploy from McClellan, Cal. The first two reach Tainan, Taiwan,
        Apr. 16 and fly from Tan Son Nhut the week of Apr. 16–22; some fourteen F-104s of the 476th Tactical Fighter Squadron
        to cover them, at Kung Kuan, Taiwan, from Apr. 7.'
      n: '[[w.staaveren-gradual-failure]], 117–18. See [[cal.1965-04-04.vietnam-air-war]].'
      src:
        c: 7572a04b
        rows:
        - 'w.staaveren-gradual-failure 117–18: all'
- add:
    entry:
      id: cal.1965-04-05.vietnam-air-war-2
      when: Apr. 5
      date: '1965-04-05'
      thread: vietnam-air-war
      c: The Air Force activates the 6234th Tactical Fighter Wing (Provisional) at Korat, Thailand, over all its units in
        Thailand; the 35th Tactical Group a support organization only. The 6234th and 6235th Combat Support Groups organized
        at Korat and Takhli May 8.
      n: '[[w.staaveren-gradual-failure]], 145. To check: Hist, CINCPAC, 1965, An B, USMACTHAI, pp 22–24; EOT rpt by Brig
        Gen John R. Murphy, 15 Jun 66; EOT rpt, by Brig Gen Murphy, 15 Jun 66; Helmka and Hale, USAF Ops from Thailand, 1964–1965,
        pp 7–9 (cited by [[w.staaveren-gradual-failure]], 145 n.33).'
      src:
        c: a7165981
        rows:
        - 'w.staaveren-gradual-failure 145: all'
        - 'via x.1964.helmka-and-hale-usaf-ops-from-thailand: ?'
        - 'via x.1965.hist-cincpac-1965-an-b-usmacthai-pp: ?'
        - 'via x.1966-06-15.eot-rpt-by-brig-gen-john-r: ?'
        - 'via x.1966-06-15.eot-rpt-by-brig-gen-murphy-15: ?'
- add:
    entry:
      id: cal.1965-04-05.vietnam-air-war-3
      when: Apr. 5
      date: '1965-04-05'
      thread: vietnam-air-war
      c: 'The 400-foot bridge at Dong Hoi, the third on the target list: twenty VNAF A-1Hs strike, PACAF aircraft in support;
        the center span collapsed. The Defense Department: all three bridges impassable.'
      n: '[[w.staaveren-gradual-failure]], 108. See [[cal.1965-04-03.vietnam]].'
      src:
        c: 5aaf7996
        rows:
        - 'w.staaveren-gradual-failure 108: all'
- add:
    entry:
      id: cal.1965-04-07.vietnam-air-war
      when: Apr. 7
      date: '1965-04-07'
      thread: vietnam-air-war
      c: The F-4Cs of the 45th Tactical Fighter Squadron, 8th Tactical Fighter Wing, from George, Cal., arrive at Udorn, Thailand,
        for 120 days; their first MiG combat air patrol for the F-105s Apr. 9, their first strike mission May 30. The 563d
        Tactical Fighter Squadron arrives at Takhli the same day.
      n: '[[w.staaveren-gradual-failure]], 117, 147. To check: Hist, CINCPAC, 1965, Vol II, p 285; Analysis of Air Ops, 6–12
        Apr 65, Vol II, p 3-6, 14 May–3 Jun 65, Vol VI, p 3-55; hist, 8th TFW, Jul–Dec 65, pp 5 and 11 (cited by [[w.staaveren-gradual-failure]],
        117 n.43).'
      src:
        c: 6e3d53b8
        rows:
        - 'w.staaveren-gradual-failure 117, 147: all'
        - 'via x.1965-04-12.analysis-of-air-ops-6-12-apr: ?'
        - 'via x.1965-07.hist-8th-tfw-jul-dec-65-pp: ?'
        - 'via x.1965.hist-cincpac-1965-vol-ii-p-285: ?'
- cite:
    id: cal.1965-04-09.vietnam
    item: '[[w.staaveren-gradual-failure]], 110–11 (four Hainan-based MiG-17s on four Navy F-4Bs on barrier patrol, during
      the Navy''s strike on the Tamada bridge; a MiG downed by a Sidewinder, the first aerial kill of the war; the Phantom
      and its crew lost on the way back, the Navy later conceding another Sidewinder; Peking''s claim of intrusion; Ball asks
      Vance and Wheeler that the rules be "precisely followed")'
- add:
    entry:
      id: cal.1965-04-09.vietnam-air-war
      when: Apr. 9–15
      date: '1965-04-09'
      thread: vietnam-air-war
      c: 'Rolling Thunder 10: five bridges and two radar sites. The Air Force''s F-105s destroy the Khe Kiem highway bridge
        and drop a span each of the Phuong Can and Qui Vinh bridges; the Navy''s A-1Hs and A-4s drop two spans of the Tamada
        rail bridge and one of the Kim Cuong; an A-4C lost to groundfire. Ten armed reconnaissance missions; the Hon Matt
        and Cuo Lao radar sites struck.'
      n: '[[w.staaveren-gradual-failure]], 110–11. To check: CINCPACFLT rpt, The United States Navy in the Pacific, 1965,
        pp 49–50; Aviation Week and Space Technology, Apr 26 65, p 30; New York Times, Apr 10, 65 (cited by [[w.staaveren-gradual-failure]],
        111 n.24). See [[cal.1965-04-03.vietnam]].'
      src:
        c: 883df971
        rows:
        - 'w.staaveren-gradual-failure 110–11: all'
        - 'via x.1926-04.aviation-week-and-space-technology-apr-26: ?'
        - 'via x.1965-04-10.new-york-times-apr-10-65: ?'
        - 'via x.1965.cincpacflt-rpt-the-united-states-navy-in: ?'
- add:
    entry:
      id: cal.1965-04-10.vietnam-air-war
      when: Apr. 10
      date: '1965-04-10'
      thread: vietnam-air-war
      c: The Joint Chiefs raise the armed reconnaissance sorties allowed over the North to twenty-four in twenty-four hours,
        all below the 20th parallel.
      n: '[[w.staaveren-gradual-failure]], 110. See [[cal.1965-04-09.vietnam-air-war]].'
      src:
        c: 30d8ea38
        rows:
        - 'w.staaveren-gradual-failure 110: all'
- add:
    entry:
      id: cal.1965-04-14.vietnam-air-war-3
      when: Apr. 14
      date: '1965-04-14'
      thread: vietnam-air-war
      c: 'The first major leaflet mission over the North, under NSAM 328''s overt program (Fact Sheet): four F-100s over Dong
        Hoi, Ha Tinh, Vinh and Thanh Hoa; China''s part in the war; stay away from military installations; translations of
        the Johns Hopkins address. Second and third missions Apr. 17 and 19, with Bai Thuong, Ha Trung, Phu Qui and Phu Diem
        Chau; the fourth Apr. 28, some million leaflets on Cua Rao, Khe Bo, Muong Seng and Cong Cuong.'
      n: '[[w.staaveren-gradual-failure]], 129–30. See [[cal.1965-04-06.vietnam]].'
      src:
        c: c02ef94c
        rows:
        - 'w.staaveren-gradual-failure 129–30: all'
- add:
    entry:
      id: cal.1965-04-15.vietnam-air-war
      when: Apr. 15
      date: '1965-04-15'
      thread: vietnam-air-war
      c: 'Forty-four Navy aircraft, twenty-six striking, on the coastal early warning radar station near Vinh Linh, the southernmost
        in the North: a few buildings damaged.'
      n: '[[w.staaveren-gradual-failure]], 109. See [[cal.1965-04-03.vietnam]].'
      src:
        c: 186a9072
        rows:
        - 'w.staaveren-gradual-failure 109: all'
- add:
    entry:
      id: cal.1965-04-16.vietnam-air-war-2
      when: Apr. 16
      date: '1965-04-16'
      thread: vietnam-air-war
      c: 'Rolling Thunder 11 (Apr. 16–22), five bridges, and the largest one-day effort yet against the North: F-105s drop
        the Dien Chau railroad bridge''s center span and the Thai Hai highway bridge with 296 750-pound bombs; the Navy on
        the Bai Duc bridge and, with a Bullpup, the Xom Ca Trang bridge; a first special strike on the Mu Gia Pass staging
        area. The Navy''s EA-1Fs fly their first ECM mission over the North. The week''s losses: an F-105 Apr. 17, an A-1H
        Apr. 19.'
      n: '[[w.staaveren-gradual-failure]], 111–12, 115. To check: Msg, CINCPACAF to 13th AF, 2d AD, 161012Z Apr 65 (cited
        by [[w.staaveren-gradual-failure]], 112 n.27). See [[cal.1965-04-09.vietnam-air-war]].'
      src:
        c: 5a99ec6d
        rows:
        - 'w.staaveren-gradual-failure 111–12, 115: all'
        - 'via x.1965-04-16.msg-cincpacaf-to-13th-af-2d-ad: ?'
- add:
    entry:
      id: cal.1965-04-20.vietnam-air-war
      when: Apr. 20
      date: '1965-04-20'
      thread: vietnam-air-war
      c: 'Eight VNAF A-1Hs joined for the first time by eight Air Force F-100s on the My Duc highway bridge: the bridge destroyed,
        a Skyraider lost to groundfire.'
      n: '[[w.staaveren-gradual-failure]], 112. See [[cal.1965-04-16.vietnam-air-war-2]].'
      src:
        c: b2615aba
        rows:
        - 'w.staaveren-gradual-failure 112: all'
- add:
    entry:
      id: cal.1965-04-29.vietnam-air-war-2
      when: Apr. 29
      date: '1965-04-29'
      thread: vietnam-air-war
      c: 'The Air Force''s first ECM mission over the North: three RF-101s refitted with QRC-160-1 pods to jam the SA-2''s
        Fan Song radar. The pods soon removed, loosened by vibration.'
      n: '[[w.staaveren-gradual-failure]], 115–16. See [[cal.1965-04-16.vietnam-air-war-2]].'
      src:
        c: a3bfa766
        rows:
        - 'w.staaveren-gradual-failure 115–16: all'
- add:
    entry:
      id: cal.1965-05-07.vietnam-air-war-2
      when: May 7
      date: '1965-05-07'
      thread: vietnam-air-war
      c: The EB-66Cs of the 9th Tactical Reconnaissance Squadron, from Shaw, S.C., at Tan Son Nhut since April with four RB-66Bs,
        fly their first missions against the North's air defense radars; two more arrive before the end of May, and all move
        to Takhli, Thailand.
      n: '[[w.staaveren-gradual-failure]], 116. See [[cal.1965-04-29.vietnam-air-war-2]].'
      src:
        c: 707b3e1f
        rows:
        - 'w.staaveren-gradual-failure 116: all'
- cite:
    id: cal.1965-05-18.vietnam
    item: '[[w.staaveren-gradual-failure]], 136–37 (program 15, May 18–24; the Navy''s three missions of May 18: the Hoan
      Lao barracks, 32 strike aircraft, some 79 percent of 78 buildings; the Chanh Hoi radio station; Phu Qui; the Phuc Lao
      naval base by 86 aircraft)'
- add:
    entry:
      id: cal.1965-05-20.vietnam-air-war
      when: May 20
      date: '1965-05-20'
      thread: vietnam-air-war
      c: The Air Force's first strike above the 20th parallel, on the Quang Soui barracks, called off for weather; twenty-four
        aircraft on Hon Matt Island instead. Four F-105s drop half a million leaflets on Ninh Binh, fifty miles south of Hanoi,
        the deepest penetration since Feb. 7.
      n: '[[w.staaveren-gradual-failure]], 137. To check: Hq USAF rpt, Stat Sum of Air Ops, SEA, Vol VI, 14 May–3 Jun 65,
        pp 3-1 to 3-11, 3-14 to 3-47; New York Times, May 21, 22, and 23, 65 (cited by [[w.staaveren-gradual-failure]], 137
        n.16). See [[cal.1965-05-18.vietnam]].'
      src:
        c: a3b4ba88
        rows:
        - 'w.staaveren-gradual-failure 137: all'
        - 'via x.1922-05-21.new-york-times-may-21-22-and: ?'
        - 'via x.1965-06-03.hq-usaf-rpt-stat-sum-of-air: ?'
- add:
    entry:
      id: cal.1965-05-22.vietnam-air-war
      when: May 22
      date: '1965-05-22'
      thread: vietnam-air-war
      c: 'Forty F-105s on the Quang Soui barracks, 55 to 60 miles from Hanoi: some twenty of 71 buildings hit; the rest of
        the area struck the same day, 27 buildings demolished, 48 damaged; the Phu Qui ammunition depot again. VNAF A-1Es
        scatter some 400,000 leaflets over Ron and Ba Den. VNAF A-1Es and F-105s on the barracks at Phu Le and Vu San, May
        21 and 22.'
      n: '[[w.staaveren-gradual-failure]], 137. To check: Hq USAF rpt, Stat Sum of Air Ops, SEA, Vol VI, 14 May–3 Jun 65,
        pp 3-1 to 3-11, 3-14 to 3-47; New York Times, May 21, 22, and 23, 65 (cited by [[w.staaveren-gradual-failure]], 137
        n.16). See [[cal.1965-05-20.vietnam-air-war]].'
      src:
        c: 52ae07e8
        rows:
        - 'w.staaveren-gradual-failure 137: all'
        - 'via x.1922-05-21.new-york-times-may-21-22-and: ?'
        - 'via x.1965-06-03.hq-usaf-rpt-stat-sum-of-air: ?'
- add:
    entry:
      id: cal.1965-05-25.vietnam-air-war
      when: May 25
      date: '1965-05-25'
      thread: vietnam-air-war
      c: 'Air defense conference at the 2d Air Division, Saigon, after Il-28 bombers reach Phuc Yen in May; PACOM''s at Honolulu
        May 28. The consensus: stronger air defense for the 2d Air Division and the 1st Marine Air Wing, and other defensive
        measures.'
      n: '[[w.staaveren-gradual-failure]], 143. To check: Msg, CINCPAC to COMUSMACV, CINCPACFLT, CINCPACAF, et al, 292320Z
        May 65; msgs, 2d AD to 13th AF, 011259Z, 011300Z, 011000Z, 011006Z Jun 65; msg, CINCPACAF to CINCPAC, 030235Z Jun
        65; msg, CINCPACFLT to CINCPAC 040027Z Jun 65 (cited by [[w.staaveren-gradual-failure]], 143 n.26). See [[cal.1965-05-18.vietnam]].'
      src:
        c: cdc38298
        rows:
        - 'w.staaveren-gradual-failure 143: all'
        - 'via x.1965-05-29.msg-cincpac-to-comusmacv-cincpacflt-cincpacaf-et: ?'
        - 'via x.1965-06-01.msgs-2d-ad-to-13th-af-011259z: ?'
