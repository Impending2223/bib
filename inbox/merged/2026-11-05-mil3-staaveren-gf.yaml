- add:
    entry:
      id: cal.1965-11-16.vietnam-air-war-2
      when: Nov. 16
      date: '1965-11-16'
      thread: vietnam-air-war
      c: F-105s strike SAM sites, Nov. 16 and 22, four in all, seventeen since July 27; one F-105 downed by a SAM Nov. 16,
        the eighth American loss to SAMs and the 160th aircraft lost over the North since August 1964. Nov. 22, four F-105s
        pop up ten miles out and fire rockets from 5,500 feet; no flak. The RF-4Cs' first mission over Laos the same day,
        over the North Nov. 17.
      n: '[[w.staaveren-gradual-failure]], 194, 205. To check: Hist, 363d Tac Reconnaissance Wing, Jul–Dec 65, pp 31–41; PACAF
        rpt, Sum of Air Ops, SEA, Vol XI, 12–25 Nov 65, pp 6-4 to 6-6; Statement by Gen McConnell in Hearings before House
        Cmte on Armed Services: Military Posture, Executive Session, Mar 31, 66, p 1079; hist, TAC, Jan–Dec 65, pp 562–64;
        memo, Brown to CSAF 30 Nov 65, subj: Improved Intelligence Handling in SEA; USAF Mgt Digest, SEA, 7 Jan 66, pp 23,
        24, and 36 (cited by [[w.staaveren-gradual-failure]], 205 n.13). See [[cal.1965-10-31.vietnam-air-war]].'
