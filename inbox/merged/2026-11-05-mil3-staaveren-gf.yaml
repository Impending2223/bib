      when: Mar. 9
      date: '1965-03-09'
      thread: vietnam-air-war
      c: Daily photo and weather reconnaissance allowed over the North south of the 19th parallel (Blue Tree), on Yankee Team's
        targeting and reporting rules; after program 6, a "single pass" at low level for damage assessment.
      n: '[[w.staaveren-gradual-failure]], 85. To check: Msgs, JCS to CINCPAC, 092251Z Mar 65, and 111624Z Mar 65 (cited by
