      when: July 24
      date: '1966-07-24'
      thread: vietnam-air-war
      c: Sharp's directive launching the oil strangulation campaign. By the end of July the Air Force has hit sixteen dispersed
        sites holding some 55,000 metric tons, destroying some 42,600 near Hanoi, and a tank plant at Thai Nguyen; the Navy,
        sites of 114,800 tons.
      n: '[[w.staaveren-gradual-failure]], 299–300. See [[cal.1966-06-29.vietnam]]. Names: Sharp.'
      src:
        c: 7f8ad39a
        rows:
