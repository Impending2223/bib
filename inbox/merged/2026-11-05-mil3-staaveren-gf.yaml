- add:
    entry:
      id: cal.1965-07-09.vietnam-air-war
      when: July 9–14
      date: '1965-07-09'
      thread: vietnam-air-war
      c: 'Rolling Thunder 22 and 23 (July 9–22): seven targets above the 20th parallel; up to 550 armed reconnaissance sorties
        in fourteen days; leftover ordnance on road segments in Laos. F-105s and F-4Cs strike four of the northernmost, the
        Yen Son and Yen Bai ordnance depots first, 65 and 70 miles northwest of Hanoi: five missions and seven, some 54 and
        60 percent destroyed. The fourteen days'' sorties: Air Force 233, VNAF 28, Navy 471; two Navy planes downed.'
      n: '[[w.staaveren-gradual-failure]], 158, 160. To check: Hq USAF rpt, Stat Sum of Air Ops, SEA, Vol X, 9–22 Jul 65,
        pp 3-1 to 3-8 and p 3-38; Washington Post, Jul 13, 65, p 1 (cited by [[w.staaveren-gradual-failure]], 158 n.59). See
        [[cal.1965-06-25.vietnam-air-war]].'
      src:
        c: db878267
        rows:
        - 'w.staaveren-gradual-failure 158, 160: all'
        - 'via x.1965-07-13.washington-post-jul-13-65-p-1: ?'
        - 'via x.1965-07-22.hq-usaf-rpt-stat-sum-of-air: ?'
- add:
    entry:
      id: cal.1965-07-10.vietnam-air-war
      when: July 10
      date: '1965-07-10'
      thread: vietnam-air-war
      c: 'The Air Force''s first MiG kills: four F-4Cs of the 45th Tactical Fighter Squadron under Hall, covering F-105s near
        Yen Bai, warned by a Big Eye EC-121, fire eight Sidewinders at two MiG-17s; both downed. Credited to Roberts and Anderson,
        and Holcombe and Clark; Silver Stars from Moore. Hanoi claims 370 American aircraft down since Aug. 5, 1964.'
      n: '[[w.staaveren-gradual-failure]], 159–60. See [[cal.1965-06-17.vietnam-air-war]]. Names: Moore.'
      src:
        c: 3a5f3093
        rows:
