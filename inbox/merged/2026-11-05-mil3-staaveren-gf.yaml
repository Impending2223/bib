    entry:
      id: cal.1966-01-26.vietnam-air-war
      when: Jan. 26
      date: '1966-01-26'
      thread: vietnam-air-war
      c: 'An RF-101 shot down over the North in the pause, its pilot presumed captured. By Feb. 3, the reconnaissance flown
        since Dec. 24: the Air Force''s RF-101s and RF-4Cs 498 sorties, the Navy 283, chiefly over route packages 1 and 2.'
      n: '[[w.staaveren-gradual-failure]], 216–17. To check: PACAF reports, Sum of Air Ops, SEA, Vols XIV, XV, XVI, (24 Dec
        65 through 3 Feb 66), section 6 of each report and p 7–C-1 in Vol XVI (cited by [[w.staaveren-gradual-failure]], 217
        n.4). See [[cal.1965-12-24.vietnam]].'
