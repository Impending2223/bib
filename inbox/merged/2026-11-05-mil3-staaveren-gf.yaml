      when: July 22
      date: '1965-07-22'
      thread: vietnam-air-war
      c: 'The largest leaflet distribution of the war, on the eleventh anniversary of the partition: fourteen Air Force aircraft
        for Hanoi, Haiphong, Nam Dinh, Ninh Binh, Thanh, Phat Diem, Vinh and Phu Dien Chau, the two cities reached by wind
        drift; VNAF A-1Hs over the southern towns. Some 9,888,000 leaflets in the first fourteen days of July, 6,450,000 in
        the second half.'
      n: '[[w.staaveren-gradual-failure]], 161. To check: Msg, COMUSMACV to CINCPAC, 271315Z Oct 65; msg, CINCPAC to DIA 312209Z
