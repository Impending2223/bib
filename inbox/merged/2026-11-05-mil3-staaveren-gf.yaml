- cite:
    id: cal.1966-04-11.defense
    item: '[[w.staaveren-gradual-failure]], 264 (Ignatius at Honolulu with Sharp; Johnson gives "the highest national priority"
      to 250-, 500- and 750-pound bombs, 2.75-inch rockets and 20-, 81- and 105-mm rounds; tentative loads, the Air Force
      2.40 tons a sortie over the North, 1.65 in the South and Laos, the Navy 1.80 and 1.30)'
- add:
    entry:
      id: cal.1966-05-01.vietnam-air-war
      when: May 1
      date: '1966-05-01'
      thread: vietnam-air-war
      c: 'Gate Guard begins in route package 1, an "integrated interdiction" on Tiger Hound''s pattern: O-1 forward air controllers,
        ABCCCs and flare ships; "gates" by day, trucks by night. Ended for losses and bypassed gates; Tally Ho succeeds it
        July 20.'
      n: '[[w.staaveren-gradual-failure]], 253–54. See [[cal.1966-04-01.vietnam-air-war]].'
      src:
        c: c8031287
        rows:
        - 'w.staaveren-gradual-failure 253–54: all'
