      date: '1966-09-10'
      thread: vietnam-air-war
      c: The Joint Chiefs order the two Combat Lighting KC-135 radio-relay aircraft to U-Tapao, Thailand, when Bangkok agrees;
        meanwhile at Kadena, Okinawa, flying over the North from September.
      n: '[[w.staaveren-gradual-failure]], 277. To check: Msgs, CINCPAC to JCS, 040206Z Sep 66; JCS to CSAF, 102244Z Sep 66
