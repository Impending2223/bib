      - name:sharp-u-s-grant
- cite:
    id: cal.1966-03-10.vietnam-force-levels
    item: '[[w.staaveren-gradual-failure]], 236 (McNamara to the Chiefs and the service secretaries: their recommendations
      need more study; deploy by Case I meanwhile, no reservists called, no tours extended)'
- add:
    entry:
      id: cal.1966-03-04.vietnam-air-war
      when: Mar. 4
      date: '1966-03-04'
      thread: vietnam-air-war
      c: 'A MiG makes several firing passes at four F-4Cs on combat air patrol at 13,000 feet for a strike on the Hanoi–Lao
        Cai rail line. Mar. 4–31: the Marines'' EF-10Bs fly 85 Iron Hand support sorties; claims of 103 vehicles destroyed
        and 103 damaged, 145 road cuts; the Air Force loses thirteen aircraft in March, the Navy at least five; over a hundred
        SA-2 sites known.'
