patch: puyallup
by: Claude (reader, Puyallup brief); corrected and added to by the Opus audit, Nov. 28, 2026
ops:
  - add:
      entry:
        id: cal.1967-01-12.states-and-cities
        when: Jan. 12
        date: '1967-01-12'
        place: washington-state
        thread: states-and-cities
        c: 'The Washington Supreme Court, *Department of Game v. Puyallup Tribe*, [70 Wash. 2d 245](https://static.case.law/wash-2d/70/case-pdfs/0245-01.pdf), and *Department of Game v. Kautz*, [70 Wash. 2d 275](https://static.case.law/wash-2d/70/case-pdfs/0275-01.pdf): the Puyallup and Nisqually Indians keep their treaty right to fish at their usual and accustomed grounds, subject to conservation regulations "reasonable and necessary" to preserve the fishery; the judgment against the Puyallup set aside, the Nisqually injunction to be limited. Hill for the court, with Finley, Weaver, Hamilton and Langenbach; Donworth concurring in part; Hunter, with Rosellini and Hale, dissenting.'
        n: 'Opinions, Nos. 38611 and 38560 (the Caselaw Access Project''s text). *Puyallup Tribe v. Department of Game*, [391 U.S. 392](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391392/usrep391392.pdf), 394, 401, 402 n.15 (1968) (the holdings, the remands).'
        tags: [state:wa]
