        id: cal.1968-05-27.court
        when: May 27
        date: '1968-05-27'
        place: washington
        thread: court
        c: '*Puyallup Tribe v. Department of Game of Washington*, [391 U.S. 392](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391392/usrep391392.pdf): the Indians'' treaty right to fish at "all usual and accustomed" places, "in common with" others, may not be qualified by the State, but the manner of fishing, the size of the take and commercial fishing may be regulated for conservation, if the regulation does not discriminate against the Indians. The Puyallup and Nisqually rivers, set nets for salmon and steelhead; whether Washington''s ban on set nets is reasonable and necessary left to the State courts, their judgments affirmed. Douglas for a unanimous Court, with *Kautz v. Department of Game*.'
        n: 'Opinion, Nos. 247 and 319, 391 U.S. at 395–96, 398, 401–03. "Supreme Court Curbs Free-Choice Schools," *Washington Evening Star*, May 27, 1968, as printed in [114 Cong. Rec. 16,021](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt12/pdf/GPO-CRECB-1968-pt12-5-3.pdf#page=53) (1968) (the vote, 9–0). See [[cal.1968-03-25.court]]. Check: the *Star* prints the Indians'' right as "subject to Wisconsin conservation laws."'
        tags: [name:douglas-william-o, state:wa]
        time_range:
