  - add:
      entry:
        id: cal.1968-06-04.court
        when: June 4
        date: '1968-06-04'
        place: washington
        thread: court
        c: 'Rarick, in the Record: the rulings of the federal courts in recent weeks, "freedom of choice" struck, retaliatory evictions, jury trials in misdemeanor cases, objectors to the death penalty on the jury, show judges who "do not even know what they are doing." He inserts the *Evening Star*''s and the *Times-Picayune*''s reports.'
        n: '"Courts of Change and Revolution," [114 Cong. Rec. 16,021](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt12/pdf/GPO-CRECB-1968-pt12-5-3.pdf#page=53) (1968) (Extensions of Remarks). Names: Rarick.'
        tags: [name:rarick-john-r]
