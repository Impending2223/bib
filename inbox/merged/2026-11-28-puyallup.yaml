        c: 'Atlanta, the Capitol lawn. Maddox drapes the Constitution in black and lowers the flags to half-staff against the Court''s school ruling of May 27: "another attack by the U.S. Supreme Court."'
        n: '"Maddox Lowers Flag in Protest," *Washington Evening Star*, May 29, 1968, as printed in [114 Cong. Rec. 16,021](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt12/pdf/GPO-CRECB-1968-pt12-5-3.pdf#page=53) (1968). See [[cal.1968-05-27.desegregation-schools]]. Names: Maddox.'
        tags: [name:maddox-lester, state:ga, city:atlanta]
