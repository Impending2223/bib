  - edit:
      id: cal.1968-05-29.king-poor-peoples
      base: afdcba95
      kind: correct
      settles: ['Check: the case (CQ does not name it).']
      set:
        also: [court]
        tags: [state:wa]
        c: 'Eight arrested outside the Supreme Court after five of its windows are broken. The Campaign''s members protest, for its Indian contingent, the ruling of May 27 on the Indians'' net fishing for salmon in Washington, *Puyallup Tribe v. Department of Game*, [391 U.S. 392](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391392/usrep391392.pdf).'
        n: '[[w.cq-weekly-report]], June 7, 1968, 1384; [[w.mcknight-last-crusade]], 131 (the demonstration, the five windows, the ruling on net fishing). Neither names the case. The opinion of May 27 settles which ruling it was: Washington, salmon, nets, the Indians'' treaty right (391 U.S. at 395–96, 398, 401–03); it holds that the State may regulate the Indians'' fishing in the interest of conservation, and leaves the ban on set nets to the State courts. CQ has a ruling "that Washington state could prohibit salmon fishing with nets"; McKnight, one upholding a State decision "prohibiting Indians from net fishing." To check: [[w.kotz-let-them-eat-promises]], 171–73; *Washington Evening Star*, May 31, 1968, A-1; *Washington Post*, May 31, 1968 (cited by [[w.mcknight-last-crusade]], 173 n.67). See [[cal.1968-05-27.court]]. Check: the day (CQ gives May 29, twice; McKnight puts the news stories of the demonstration on May 31, citing the papers of that day; the *Evening Star* of June 3, as printed in [114 Cong. Rec. 15,785](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt12/pdf/GPO-CRECB-1968-pt12-4-1.pdf#page=33) (1968), has it "last week"). Check: the hour. Check: who broke the windows (McKnight: "brick-throwing teenagers who may or may not have been from Resurrection City"). Check: Abernathy writes of going with some 25 Indians to the Court to be heard, undated, and tells of no windows broken and no arrests ([[w.abernathy-and-the-walls-came]], 518–20).'
