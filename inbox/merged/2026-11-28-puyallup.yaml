        date: '1968-05-31'
        place: washington
        thread: king-poor-peoples
        also: [poverty]
        c: 'Fifteen "lobbyists" from Resurrection City, brought by Marian Wright, before a Senate committee in the hearing room of the New Senate Office Building: Negroes, Mexican Americans, whites and Indians, unrehearsed, on hunger and the federal food program.'
        n: '[[w.mcknight-last-crusade]], 131. To check: [[w.kotz-let-them-eat-promises]], 171–73; *Washington Evening Star*, May 31, 1968, A-1; *Washington Post*, May 31, 1968 (cited by [[w.mcknight-last-crusade]], 173 n.67). Names: Wright. Check: the committee.'
        tags: [name:wright-marian]
