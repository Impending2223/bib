        c: 'The National Press Club, Fourteenth and F Streets NW: some 40 Indians of the Campaign protest against the press. Hank Adams, their spokesman: "Last week at the Supreme Court we sought justice ... and today we seek truth"; the broken windows "almost insignificant" beside "broken treaties."'
        n: '"Press Building Here Is Target of Indian Poor," *Washington Evening Star*, June 3, 1968, as printed in [114 Cong. Rec. 15,785](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt12/pdf/GPO-CRECB-1968-pt12-4-1.pdf#page=33) (1968). The time: "the morning rush-hour protest" (the *Star*). See [[cal.1968-05-29.king-poor-peoples]].'
        time_range:
