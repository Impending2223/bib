  - add:
      entry:
        id: cal.1963-10.latin-america-panama
        when: Oct.
        date: 1963-10
        thread: latin-america-panama
        c: 'The Canal Zone. McPherson, Deputy Under Secretary of the Army for International Affairs, on an orientation tour: Fleming, the Zone''s governor, distrusted by the Zonians for his work to give Panamanians better jobs; an argument over where the two countries'' flags should fly side by side in the Zone, as Kennedy had agreed they should. By McPherson''s account.'
        n: '[[w.mcpherson-political-education]], 207–10. Check: the month; the book gives "soon after I settled in the Pentagon," before his trip to Okinawa in mid-November. Check: the day of Kennedy''s agreement on the flags. See [[cal.1963-08.transition-and-staff]]. Names: McPherson, Kennedy.'
        tags: [name:mcpherson-harry, name:kennedy-john-f]
        src:
          c: '23781629'
          rows:
            - 'w.mcpherson-political-education 207–10: all'
      section: '196310'
  - add:
      entry:
        id: cal.1963-11.japan
        when: Nov., mid-month
        date: 1963-11
        thread: japan
        c: 'Okinawa. McPherson, for the Army, with Caraway, the high commissioner: Caraway against the return of Japanese tourists and businessmen to the island and the demands for reversion, against Shannon McCune, the ranking civilian. By McPherson''s account.'
        n: '[[w.mcpherson-political-education]], 210–12. Check: the days. See [[cal.1963-10.latin-america-panama]]. Names: McPherson, Caraway.'
        tags: [name:mcpherson-harry, name:caraway-paul-w]
        src:
          c: 2040ba4a
          rows:
            - 'w.mcpherson-political-education 210–12: all'
      section: '196311'
  - add:
      entry:
        id: cal.1966-09.civil-rights-the-executive
        when: Sept.
        date: 1966-09
        thread: civil-rights-the-executive
        c: 'Roger Wilkins, for the McPherson-Alexander committee at its first meetings: a growing view among young militant Negroes that white people have "imbedded their own personal flaws so deeply in the institutions that those institutions are beyond redemption"; a widespread belief that the Administration will not follow up the conference''s recommendations.'
        n: '[[w.mcpherson-political-education]], 352. To check: Roger Wilkins''s paper (quoted by [[w.mcpherson-political-education]], 352). Check: the month; the book gives "at the beginning of our meetings." See [[cal.1966-08-25.civil-rights-the-executive]]. Names: Roger Wilkins.'
        tags: [name:wilkins-roger-w]
        src:
          c: 48e0e46b
          rows:
            - 'w.mcpherson-political-education 352: all'
            - 'via x.1972.mcpherson-political-education-p352: all'
      section: '196609'
