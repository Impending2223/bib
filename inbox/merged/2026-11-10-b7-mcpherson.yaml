      units: B
  - cite:
      id: cal.1965-08-20.jobs-and-wages
      item: '[[w.mcpherson-political-education]], 344 (Johnson to the conference "shortly after Watts," quoted: "the night riders of the klan, or the snipers and the looters in the Watts district")'
