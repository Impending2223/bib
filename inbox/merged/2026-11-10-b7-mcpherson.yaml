      item: '[[w.mcpherson-political-education]], 179 (the postconvention session "designed by Johnson and Rayburn in early summer, partly as pressure on the delegates, partly to give Johnson, if he could win in Los Angeles, a springboard"; both nominees required to return to the Senate)'
      units: A-B
  - cite:
      id: cal.1960-08-23.medicare
      item: '[[w.mcpherson-political-education]], 179 (medical care for the aged, a major initiative of the Democratic platform, "put to an early test" in the session and failed)'
      units: A
  - cite:
      id: cal.1960-09-01.congress
      item: '[[w.mcpherson-political-education]], 179 (aid to schools and medical care for the aged, "the major initiatives in the Democratic platform, ... put to an early test and failed ignominiously")'
      units: C-D
  - cite:
      id: cal.1961-01-03.congress
      item: '[[w.mcpherson-political-education]], 184 (the suggestion that Johnson chair the Democratic caucus; "immediate opposition ... from other members," so that he understood his guidance was not welcome)'
      units: B-C
  - cite:
      id: cal.1961-01-11.rules
      item: '[[w.mcpherson-political-education]], 185 (the liberals, failing to cut off debate at once, seek a majority cloture rule; the argument "deferred until later in the session")'
