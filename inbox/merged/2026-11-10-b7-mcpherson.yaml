        when: May 24
        date: '1961-05-24'
        thread: school-aid
        c: 'Senate, S. 1021: Goldwater''s amendment for loans to build private schools tabled on Morse''s motion, [66–25](https://voteview.com/rollcall/RS0870049). Liberal Senators from heavily Catholic areas with Goldwater, by McPherson''s account.'
