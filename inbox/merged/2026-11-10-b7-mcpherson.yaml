  - cite:
      id: cal.1965-04-07.vietnam
      item: '[[w.mcpherson-political-education]], 391–92 (Goodwin the speech''s author; massive aid to all the countries of Indochina, North Vietnam included, after the war; the first systematic defense of the American role by a President: "We are there because we have a promise to keep")'
