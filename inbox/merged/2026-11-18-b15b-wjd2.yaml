        also: [south-asia]
        c: 'Chen Yi, at the reception the Pakistani ambassador gives for Pakistan''s national day: disarmament is a great question for the defense of world peace today. China has always followed a policy of peaceful diplomacy and taken a positive attitude on it, backs the Soviet Union''s repeated proposals and measures, and has repeatedly urged that the Asian and Pacific coastal states, the United States included, sign a mutual non-aggression pact to make the whole region a nuclear-free zone.'
