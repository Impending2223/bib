        thread: china
        also: [south-asia]
        c: The Chinese government issues a statement supporting the Indian government's recovery of Goa. India's act reflects its people's just demand to oppose colonialism and defend national independence and unity of the state. That the imperialist states headed by the United States obstruct India's recovery of Goa shows that old and new colonialists will not give up colonial rule of their own accord.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 212 (Dec. 19, 1961).'
