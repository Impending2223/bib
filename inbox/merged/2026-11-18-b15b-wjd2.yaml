        when: Apr. 16
        date: '1962-04-16'
        thread: china-leadership
        also: [japan]
        c: 'Chen Yi receives the Fukuoka prefecture delegation of the Joint Struggle Council to Abolish the U.S.–Japan Security Treaty, led by Komiya Taro and Matsuda Mitsuo. On Sino-American relations: unless the United States changes its policy of aggression against China, economic talk is out of the question. The U.S. State Department, having lost so great a market as China, cannot sleep for it. The world is not the Americans'' world but the world of the peoples, and all countries large and small are equal.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 223 (Apr. 16, 1962). Made public: 2001. Names: Chen Yi. Check: the delegation''s heads are 小宫市太郎 and 松田光男 in the book; the Latin forms are back-converted.'
        tags: [polity:prc, polity:japan, polity:us, name:chen-yi, vis:only:prc+japan]
        src:
