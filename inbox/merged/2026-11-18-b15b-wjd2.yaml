      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 132 (Feb. 3–8, 1960; Liu Xiao and Wu Xiuquan attend as observers; the Chinese statement for general disarmament and that China is bound by no agreement made without its signature)'
