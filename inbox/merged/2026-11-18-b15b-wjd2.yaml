        c: Addis Ababa. Wang Yutian, China's ambassador to Sudan, and Qu Wu, deputy head of the Commission for Cultural Relations with Foreign Countries and head of the Chinese acrobatic troupe, are received by Emperor Haile Selassie I. Wang hands over Liu Shaoqi's letter and gifts; Liu writes of the wish to develop friendly relations further.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 134 (Feb. 23, 1960). Names: Liu Shaoqi, Haile Selassie.'
        tags: [polity:prc, polity:ethiopia, name:liu-shaoqi, name:haile-selassie-i]
