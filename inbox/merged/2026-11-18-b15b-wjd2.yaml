  - cite:
      id: cal.1960-01-18.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 129 (Jan. 9–19, 1960; the visit; the treaty of trade and navigation and the 1960–62 goods agreement signed; Mao and Liu Shaoqi receive the delegation; the press communique on the visit: West German and Japanese atomic armament, backed by the United States, is against the easing of tension, and the two will oppose it; the days not given)'
      units: B
  - add:
      entry:
        id: cal.1960-01-14.china
        when: Jan. 14
        date: '1960-01-14'
        thread: china
        also: [japan]
        c: 'The Foreign Ministry issues a statement against the U.S.–Japanese military alliance treaty. Kishi signed it, in the name of revising the security treaty, against the will of the Japanese people and repeated warnings: a step toward new aggression and war, a revival of Japanese militarism, and Japan''s open entry into a U.S. aggressive military bloc.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 130 (Jan. 14, 1960). Names: Kishi.'
        tags: [polity:prc, polity:japan, polity:us, name:kishi-nobusuke]
        src:
          c: 264e651e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 130: all'
  - cite:
      id: cal.1960-01-20.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 130 (Jan. 20, 1960; the instruments of ratification of the 1955 dual-nationality treaty exchanged at Peking; the treaty and its implementing exchange of notes in force)'
      units: B
  - add:
      entry:
        id: cal.1960-01-25.china
        when: Jan. 25
        date: '1960-01-25'
        thread: china
        also: [indonesia]
        c: At Jakarta the China–Indonesia joint committee for carrying out the dual-nationality treaty is set up. Huang Zhen, Chinese ambassador, is the Chinese chief delegate; the Indonesian chief delegate is the head of the Foreign Ministry's legal department.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 130 (Jan. 25, 1960). Names: Huang Zhen. Check: the Indonesian delegate is named 苏山多·蒂托普罗佐 in the book (Soesanto Tirtoprodjo?); the Latin form is back-converted.'
        tags: [polity:prc, polity:indonesia, name:huang-chen]
        src:
          c: c2108b66
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 130: all'
  - add:
      entry:
        id: cal.1960-01-21.china
        when: Jan. 21
        date: '1960-01-21'
        thread: china
        also: [soviet-union]
        c: 'The enlarged session of the National People''s Congress Standing Committee adopts a resolution supporting the Soviet Supreme Soviet''s disarmament proposal. Chen Yi, Vice-Premier and Foreign Minister, speaks: Soviet disarmament measures help ease tension; the U.S. "peace" pose covers aggression and war; an international disarmament agreement without China''s formal participation and its representative''s signature cannot bind China.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 130 (Jan. 21, 1960). Names: Chen Yi.'
        tags: [polity:prc, polity:ussr, polity:us, name:chen-yi]
        src:
          c: 606994cf
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 130: all'
