        when: Jan. 8–Dec. 24
        date: '1960-01-08'
        thread: china
        c: The Foreign Ministry spokesman, on instruction, issues the 78th to the 130th serious warnings at U.S. military aircraft and warships entering Chinese airspace and waters off Fujian, Guangdong and the Xisha Islands.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 129 (Jan. 8–Dec. 24, 1960).'
