        also: [laos]
        c: 'Geneva. Chen Yi, at the enlarged conference, proposes five principles for settling the Laotian question: the 1954 Geneva agreement as the basis; respect for Laos''s independence and sovereignty; a guarantee of its neutrality; a strict distinction between its internal side and its international side, the internal affairs to be settled by the Laotians alone and no international agreement to allow interference in them; and the joining and strict observance of the common agreement by all states at the conference.'
