        c: A Foreign Ministry spokesman's statement on exchanging journalists between China and the United States, rejecting the U.S. State Department's statement of Sept. 8 as a complete distortion of the facts. China has worked unceasingly for exchange; the U.S. government has obstructed it without reason. China proposed a draft agreement under which each country's reporters must apply to the other government for permission, with equal numbers approved by both; the United States refused without regard to the facts.
