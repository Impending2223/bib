        c: 'Chen Yi to Subandrio, the Indonesian foreign minister, in reply to his letter of Jan. 23 on sending home the overseas Chinese: he proposes an early agreement. China hopes those Chinese with dual nationality can freely choose Indonesian nationality; those who keep Chinese nationality can go on living in Indonesia with their proper rights and interests respected, and contribute to its economy.'
