        date: '1962-04-13'
        thread: china
        also: [south-asia]
        c: 'The Foreign Ministry publishes the 22 notes the Chinese and Indian governments exchanged from Dec. 1961 to Mar. 1962 and the report of the officials'' meetings on the boundary of Dec. 1960. A spokesman''s statement: China has always sought to settle the boundary by friendly talks on the five principles and holds that, until it is settled, both sides should keep the status quo to keep the border quiet. But India holds to unreasonable demands, takes steps to change the status quo dangerously, refuses China''s friendly suggestions, and ties the question of trade and communications agreements to the boundary. China has kept the greatest restraint.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 222 (Apr. 13, 1962). See [[cal.1961-12-06.china]].'
