        c: 'The Foreign Ministry answers the Dutch chargé d''affaires'' office: the treaty on arbitration signed by the then Chinese and Dutch governments on June 1, 1915 no longer applies, since international relations have changed greatly since the founding of the People''s Republic. The Chinese government holds that the treaty has long ceased to be in force. The editors'' note: the Dutch chargé''s office had earlier asked the Foreign Ministry by note whether the treaty was in force.'
