        also: [south-asia]
        c: China and Burma issue a joint communique at the end of Zhou's and Chen Yi's visit. Five years of Sino-Burmese friendship and the Asian peoples' successes under the banner of independence, peace and friendship show the force of the Bandung spirit and the five principles. Both hope the great-power summit of May 1960 will help peace and ease tension, and hold that the states concerned should quickly agree on banning nuclear weapons and general disarmament.
