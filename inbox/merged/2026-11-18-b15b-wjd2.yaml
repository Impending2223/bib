        c: 'Stockholm. Liao Chengzhi, head of the Chinese delegation, speaking at the World Peace Council''s meeting: the national liberation movements of Asia, Africa and Latin America are a vast force in opposing imperialism and defending world peace. Defending peace depends on the broad popular masses, on the head-on struggle against imperialism, and on the unity of every peaceful force.'
