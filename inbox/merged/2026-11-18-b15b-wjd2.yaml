        when: Dec. 28
        date: '1960-12-28'
        thread: china
        also: [laos]
        c: 'Chen Yi writes to the Geneva conference''s co-chairmen, Gromyko, the Soviet Foreign Minister, and Lord Home, the British Foreign Secretary, on the grave situation in Laos: they are asked to take active and effective measures to stop the U.S. government''s wrecking of the Geneva agreement and its interference and aggression in Laos. China bears a responsibility for the security of its own country; the International Commission for Laos should resume work at once and cooperate with Souvanna Phouma''s government to restore peace.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 179 (Dec. 28, 1960). Names: Chen Yi, Gromyko, Douglas-Home, Souvanna Phouma.'
        tags: [polity:prc, polity:laos, polity:ussr, polity:uk, polity:us, name:chen-yi, name:gromyko-andrei, name:souvanna-phouma, name:douglas-home-alec]
