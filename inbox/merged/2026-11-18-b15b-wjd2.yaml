        when: Dec. 21
        date: '1961-12-21'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry issues a statement strongly protesting the U.S. manipulation of the United Nations General Assembly into adopting illegal resolutions on the so-called "question of Chinese representation" and "question of Tibet," in breach of sovereignty. There is one China only, the People's Republic of China, whose every legal right in the United Nations must be restored. Tibet is Chinese territory and all its affairs are wholly China's internal affairs, on which no foreign state or international organization has any right to meddle.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 212 (Dec. 21, 1961).'
        tags: [polity:prc, polity:us, polity:un]
