  - check:
      id: cal.1960-03-18.china-leadership
      text: 'Check: the book gives Mao''s words to Koirala, with no day: China is in no hurry to enter the U.N. (it can wait ten years, then ten more); that China invaded India is untrue, a year''s quarrel with India being among friends, and the one real quarrel in the world is with the United States, which holds Taiwan and calls China an "aggressor"; the entry''s talk at Hangzhou may be where.'
