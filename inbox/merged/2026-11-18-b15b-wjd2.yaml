  - add:
      entry:
        id: cal.1960-10-03.china
        when: Oct. 3
        date: '1960-10-03'
        thread: china
        also: [japan]
        c: 'Eight Chinese people''s organizations, including the Chinese People''s Committee for Defending World Peace, and 12 visiting Japanese delegations issue a joint statement. They pledge to defend peace in Asia and the world: disputes between states of different systems to be settled by negotiation, not force; full disarmament, a nuclear ban, and the removal of foreign bases; the Chinese people back Japan''s struggle against the new U.S.–Japan military alliance treaty, and the Japanese people back the liberation of Taiwan; a nuclear-free zone in Asia and the Pacific with U.S. forces out of Asian countries; and support for the independence and democratic struggles of the Asian, African and Latin American peoples.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 168–169 (Oct. 3, 1960).'
        tags: [polity:prc, polity:japan, polity:us]
