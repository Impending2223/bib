        when: Dec. 24
        date: '1960-12-24'
        thread: china-leadership
        also: [cuba]
        c: 'Mao receives a Cuban women''s delegation and an Ecuadorian cultural delegation. Mao: war and peace are to be told apart, and so are local wars. A war of people''s revolution we back; a war launched by imperialism we oppose. Cuba''s war is the people''s, not imperialism''s. The Cubans overthrew Batista''s dictatorship and won the whole people''s support, and China stands with them. Whether the other Latin American countries take the Cuban way, and when, is for each people to decide. Cuba smashed the old state machine and set Latin America and the world an example.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 178 (Dec. 24, 1960). Made public: 2001. Names: Mao Zedong. Check: the women''s delegation is led by a Cuban named 埃伦娜·希尔 and the Ecuadorian by 奥赫内斯·巴莱德斯 in the book; whether Mao''s words were reported then.'
        tags: [polity:prc, polity:cuba, polity:ecuador, name:mao-zedong, vis:only:prc+cuba+ecuador]
        src:
          c: 7c178278
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 178: all'
