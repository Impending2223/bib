        when: Apr. 3
        date: '1960-04-03'
        thread: china
        also: [south-asia]
        c: The Foreign Ministry, answering the Indian embassy's note, says again that the whole Sino-Indian boundary has never been formally delimited and that the two sides, with goodwill, can settle it by consultation and mutual accommodation. The differences on the boundary are local and temporary; the thousand-year friendship of the two peoples is fundamental. The premiers' talks are about to begin.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 136 (Apr. 3, 1960).'
