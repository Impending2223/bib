        c: Chen Yi receives the delegation of the Democratic Republic of Vietnam's state farms, led by Ambassador Trần Tử Bình with a deputy head. Under an agreement between the two governments, China is to help Vietnam build eight farms and one secondary agricultural technical school in 1960–62, with economic and technical aid.
