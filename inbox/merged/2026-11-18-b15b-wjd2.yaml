        date: '1960-11-26'
        thread: china-leadership
        also: [africa]
        c: 'Chen Yi, receiving Malam Tanko Yakassai, national organizer of Nigeria''s Northern Elements Progressive Union: a world war is unlikely to break out at once. The world''s peoples long for peace but it will not come at once either. Limited wars will go on, such as revolutionary wars for national independence and wars against dictatorship, and armed conflicts from imperialist interference in other countries'' internal affairs; limited peaceful coexistence can be won.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 173–174 (Nov. 26, 1960). Made public: 2001. Names: Chen Yi. Check: the leader is 马兰·坦科·亚卡赛 in the book.'
