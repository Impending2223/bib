  - add:
      entry:
        id: cal.1960-02-04.china-leadership
        when: Feb. 4
        date: '1960-02-04'
        thread: china-leadership
        also: [south-asia]
        c: 'Chen Yi, Vice-Premier and Foreign Minister, at the Ceylonese ambassador''s reception for Ceylon''s twelfth independence anniversary: the five principles and the Bandung spirit will break the dark cloud and bring Asian–African unity closer. The Chinese people will back the Cuban people against foreign interference.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 132 (Feb. 4, 1960). Names: Chen Yi. Check: the Ceylonese ambassador is 伯拉瓦特 in the book.'
        tags: [polity:prc, polity:ceylon, polity:cuba, name:chen-yi]
        src:
          c: baf6b635
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 132: all'
  - add:
      entry:
        id: cal.1960-02-05.china
        when: Feb. 5
        date: '1960-02-05'
        thread: china
        c: 'Zhang Yuzhe, head of the Chinese Astronomical Society''s council, to Oort, president of the International Astronomical Union: strong protest at the Union''s taking in the Chiang Kai-shek clique''s "Chinese Astronomical Society" as a member, which follows the U.S. plot of "two Chinas". The Chinese Society withdraws at once from the Union and all its committees and refuses all dealings with them.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 132 (Feb. 5, 1960). Names: Chiang Kai-shek.'
        tags: [polity:prc, polity:roc, polity:us, name:chiang-kai-shek]
        src:
          c: 7f9838d1
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 132: all'
  - add:
      entry:
        id: cal.1960-02-06.china-leadership-2
        when: Feb. 6
        date: '1960-02-06'
        thread: china-leadership
        also: [south-asia]
        c: 'Chen Yi, talking with Danish journalists on the Sino-Indian boundary: all China''s views are in the government''s note of Dec. 26, 1959; China sought a meeting of the two premiers. India has taken a passive attitude, and China expects India to delay for a time, as Nehru again said he was unwilling to meet. China will wait patiently, cannot force it, did not start the dispute, and wishes to keep friendship with Nehru, the Indian government and the Indian people.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 133 (Feb. 6, 1960). Names: Chen Yi, Nehru. Check: the two journalists are 安升达 and 纽斯太德 in the book; whether the talk was published at the time.'
        tags: [polity:prc, polity:india, name:chen-yi, name:nehru-jawaharlal]
        src:
          c: c9cfd9d7
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 133: all'
  - add:
      entry:
        id: cal.1960-02-13.china-leadership-3
        when: Feb. 13
        date: '1960-02-13'
        thread: china-leadership
        also: [soviet-union]
        c: Zhu De and Chen Yi receive the whole Soviet–Chinese Friendship Society delegation, led by the Society's council vice-chairman, Yelyutin, the Soviet Minister of Higher and Specialized Secondary Education. It is in China for the celebrations of the tenth anniversary of the Sino-Soviet treaty of alliance.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 133 (Feb. 13, 1960). Names: Zhu De, Chen Yi. Check: the minister is 叶留金 in the book (Yelyutin).'
        tags: [polity:prc, polity:ussr, name:zhu-de, name:chen-yi]
        src:
          c: 21dc8af9
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 133: all'
  - add:
      entry:
        id: cal.1960-02-14.china-leadership-3
        when: Feb. 14
        date: '1960-02-14'
        thread: china-leadership
        also: [soviet-union]
        c: 'Liu Shaoqi and Zhu De attend the Soviet ambassador''s reception for the tenth anniversary of the Sino-Soviet treaty of friendship, alliance and mutual assistance. Liu gives warm good wishes to the Soviet Party, government and people. Zhu De, speaking: for the common cause China must keep strengthening the great unity of the two countries and of the socialist camp headed by the Soviet Union.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 133 (Feb. 14, 1960). Names: Liu Shaoqi, Zhu De, Chervonenko.'
        tags: [polity:prc, polity:ussr, name:liu-shaoqi, name:zhu-de, name:chervonenko-stepan-v]
        src:
          c: c87682b5
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 133: all'
  - add:
      entry:
        id: cal.1960-02-21.china
        when: Feb. 21
        date: '1960-02-21'
        thread: china
        c: 'The Ministry of Culture issues a statement: serious warning to the U.S. government on its plot to seize China''s large store of precious cultural relics in Taiwan. All the "contracts" the U.S. government has made with the Chiang Kai-shek clique to take China''s historical relics are void.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 133–134 (Feb. 21, 1960). Names: Chiang Kai-shek.'
        tags: [polity:prc, polity:us, polity:roc, name:chiang-kai-shek]
        src:
          c: 67d33795
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao-2001 133–134: all'
