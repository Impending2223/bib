        id: cal.1960-12-19.china
        when: Dec. 19
        date: '1960-12-19'
        thread: china
        also: [laos]
        c: 'The Chinese government again issues a statement on Laos: the U.S.-backed rebel clique''s large-scale civil war gravely threatens peace in Asia and the world and China''s security. All peace-loving states and peoples should oppose and stop this fanning of the flames. China backs the Vietnamese government''s proposal to convene the Geneva conference of the states concerned to stop U.S. aggression.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 177–178 (Dec. 19, 1960). See [[cal.1960-12-14.china]].'
        tags: [polity:prc, polity:laos, polity:drv, polity:us]
