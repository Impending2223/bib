      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 4, 1960; [[w.yang-shangkun-riji]], I, 515 (June 4–6, 1960; June 4, at the swimming pool, 3:30 to 7 p.m., the "main points of the plan" read together; June 5, 3 to 7:30 p.m., Li Fuchun''s report again; June 6, 3 to 7 p.m., in the hall of the Hangzhou Hotel, the report finished). Made public: 2013. The time is the first day''s. Check: Made public: the diary printed its record of the day in 2001 ([[w.shangkun-yang-shangkun-riji-2]]; reprinted [[w.yang-shangkun-riji]], I, 515), before the year the note gives. Names: Mao Zedong, Li Fuchun, Kang Sheng, Yang Shangkun, Tian Jiaying.'
