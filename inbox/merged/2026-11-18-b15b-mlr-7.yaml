      n: '[[w.macfarquhar-maos-last-revolution]], 221 (the students read the printing of the May 16 Notification on May 17 as a sign of Zhou''s coming fall). To check: [[w.nianyi-da-dongluande-niandai]], 272 (cited by [[w.macfarquhar-maos-last-revolution]], 221 n.5). Names: Zhou Enlai. Check: the day; the book (221) gives the early summer of 1967.'
