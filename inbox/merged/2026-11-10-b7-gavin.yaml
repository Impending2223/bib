      date: '1964-06-12'
      thread: europe-and-the-alliance
      c: 'Bundy to Johnson, "Check List for Your Talk with Chancellor Erhard": Erhard does not want "a formal bargain that offset payments are a condition of our six-division presence," though he knows "the connection exists." Bundy would have Johnson underline it "firmly but always privately"; "Dean Rusk wishes you wouldn''t."'
      n: '[[w.gavin-gold-dollars-and-power]], 140. To check: Bundy to Johnson, "Check List for Your Talk with Chancellor Erhard," June 12, 1964, NSF, Country File, Germany, box 191, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 140 n.12). See [[cal.1964-06-12.europe-and-the-alliance]]. Names: Bundy, Johnson, Erhard, Rusk.'
