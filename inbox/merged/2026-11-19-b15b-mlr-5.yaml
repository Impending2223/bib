      c: 'The Military Commission issues Lin Biao''s ten-point order, endorsed by Mao: the PLA is not to fire on members of mass organizations, nor make arbitrary arrests, particularly large-scale ones; the labeling of mass organizations as reactionary becomes the center''s prerogative, and opposing the PLA is not a criterion; no revenge on rebels who attacked the PLA; actions contrary to the ten points to be rectified at once.'
