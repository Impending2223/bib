      n: '[[w.macfarquhar-maos-last-revolution]], 164. Time: "at about five in the morning" (164). Made public: 2005. Printed for internal circulation: [[w.shanghai-wenhua-dageming-shihua]] (1992, a typeset manuscript). To check: [[w.pixian-chen-pixian-huiyilu]], 119–120 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.45); [[w.shanghai-wenhua-dageming-shihua]], I, 226–227 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.47). See [[cal.1967-01-01.china-leadership-2]]. Check: the book''s "about five in the morning" against Zhou''s call a little past three (163).'
