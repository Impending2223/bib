      date: 1967-03
      at: before 1967-03-26
      thread: china-leadership
      also:
      - china
      c: 'Li Fuchun, to the meeting of military officers convened by Zhou Enlai and Ye Jianying from Feb. 26 to Mar. 25, says that agricultural output rose 7 percent and industrial output 22 percent in 1966; output of steel, coal and oil in the first two months of 1967 is below that of 1966, but daily output rose in March; the annual plan for 1967 has been distributed; provincial leaders are to stress its implementation. On the Third Front: "serious instances of work stoppages that warrant extreme concern".'
      n: '[[w.macfarquhar-maos-last-revolution]], 174. Made public: 1967. To check: [[w.zhongyang-junwei-kuoda-huiyi]], 3 (cited by [[w.macfarquhar-maos-last-revolution]], 174 n.23); [[w.xuexi-wenjian]], 31–35 (cited by [[w.macfarquhar-maos-last-revolution]], 174 n.24a); [[w.xuexi-wenjian]], 31 (cited by [[w.macfarquhar-maos-last-revolution]], 174 n.26). Names: Li Fuchun, Zhou Enlai, Ye Jianying. Check: the day of the talk; the book places it within the meeting of Feb. 26 to Mar. 25 and after the March figures.'
