      n: '[[w.macfarquhar-maos-last-revolution]], 175. Made public: 1987. To check: [[w.shijin-jiangjun-juanjin-xuanwo]], 1–4, 12–14 (cited by [[w.macfarquhar-maos-last-revolution]], 175 n.29). Names: Zhang Chunqiao. Check: the day; the book dates neither the remark nor the garrison order.'
