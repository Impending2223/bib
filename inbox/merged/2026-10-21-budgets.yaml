      c: 'Budget for fiscal 1963: receipts $93.0 billion, expenditures $92.5 billion, a surplus of $463 million; fiscal 1962''s deficit put at $7.0 billion. National defense $52.7 billion.'
      n: '[Annual Budget Message to the Congress, Fiscal Year 1963](https://www.presidency.ucsb.edu/documents/annual-budget-message-the-congress-fiscal-year-1963) (Jan. 18, 1962). [*The Budget of the United States Government for the Fiscal Year Ending June 30, 1963*, Table 1, p. 33](https://fraser.stlouisfed.org/files/docs/publications/usbudget/bus_1963.pdf#page=33). [[w.morgan-deficit-government]]; [[w.stein-fiscal-revolution-in-america]]. See [[cal.1961-03-24.economy]].'
      tags:
