patch: 2026-11-12-b11-odonnell-2
by: Claude (batch 11 reader, Sonnet; audited by Claude, batch 11 auditor, Opus; O'Donnell and Powers, Johnny, We Hardly Knew Ye, pp. 391-95, 407-29 and the days the first reader did not search; pages by printed folio, PDF = folio + 20)
ops:
- cite:
    id: cal.1960-05.elections-1960-8
    item: '[[w.odonnell-johnny-we-hardly-knew]], 188–89 (the television broadcast on "the Sunday evening before the voting day" (May 8, the primary being May 10), Franklin Roosevelt asking the questions, Kennedy speaking extemporaneously for more than ten minutes, no script, recording or transcript; the passage on the oath, as Theodore White remembered it; not Sorensen''s "would not take orders from any Pope, Cardinal, Bishop or priest")'
    units: A
- variant:
    id: cal.1960-05.elections-1960-8
    unit: C
    witness: w.odonnell-johnny-we-hardly-knew
    reads: 'as White remembered it: "if he breaks his oath, he is not only committing a crime against the Constitution, for which the Congress can impeach him, and should impeach him, but he is committing a sin against God."'
    at: '189'
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-9
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis
      c: 'Kennedy, on the word that the Soviet ships are stopping, sends strict orders to the Essex and to Admiral Anderson, chief of naval operations: no Soviet ship or submarine outside the interception zone is to be stopped, boarded or harassed. By the authors, he assumed Khrushchev was "probably already taking enough criticism from his rivals in the Kremlin" and wanted "no incident that might cause a new flare-up."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 377 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1962-10-24.missile-crisis]]. Names: Kennedy, Anderson, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:anderson-george-w-jr
      - name:khrushchev-nikita-s
- cite:
    id: cal.1962-10-25.missile-crisis-8
    item: '[[w.odonnell-johnny-we-hardly-knew]], 378 (on Thursday Kennedy lets the Soviet oil tanker Bucharest through the blockade unboarded and unsearched, after the captain assures the Navy that he carries only petroleum; some members of the Ex Comm think it should have been searched anyway; not the dawn, the hailing, the Völkerfreundschaft or Havana)'
    units: '?'
- cite:
    id: cal.1962-10-26.missile-crisis-3
    item: '[[w.odonnell-johnny-we-hardly-knew]], 378 (on Friday the Marucla, a Soviet-chartered Liberty-ship freighter, is stopped at the blockade line by a destroyer, the Joseph P. Kennedy, Jr.; Kennedy: "I suppose everybody will say that I sent the Kennedy in there deliberately, to give our family some publicity"; the Bucharest let through unboarded the day before, the captain having assured the Navy of his cargo; not the boarding, the owner''s flag, the contraband or the East German ship)'
    units: '?'
- cite:
    id: cal.1962-10-25.missile-crisis
    item: '[[w.odonnell-johnny-we-hardly-knew]], 378–79 (Stevenson''s cross-examination of Zorin before the Security Council, the photographs of the missile sites displayed; Zorin: "I am not in an American courtroom"; Stevenson: "You are in the courtroom of world opinion right now and you can answer yes or no"; not "Until hell freezes over"; no day given)'
    units: A, C
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-11
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      c: 'Kennedy, watching Stevenson cross-examine Zorin at the Security Council on television: "I never knew Adlai had it in him. Too bad he didn''t show some of this steam in the 1956 campaign."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 379 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1962-10-25.missile-crisis]]. Names: Kennedy, Stevenson, Zorin. Check: the day: the page sets the debate, "meanwhile," after its paragraph on Friday and gives no day; Oct. 25 by the Security Council record cited at [[cal.1962-10-25.missile-crisis]].'
      tags:
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      - name:zorin-valerian
- cite:
    id: cal.1962-10-26.missile-crisis
    item: '[[w.odonnell-johnny-we-hardly-knew]], 380 (Friday evening, a long private letter from Khrushchev, teletyped in four installments, with the same proposal Fomin gave Scali: the missiles removed and no more offensive weapons in Cuba for a guarantee against invasion; his plea that the two not pull on the ends of the rope "in which you have tied the knot of war")'
    units: A
- cite:
    id: cal.1962-10-27.missile-crisis-2
    item: '[[w.odonnell-johnny-we-hardly-knew]], 381 (while the Ex Comm met Saturday morning to draft a reply to the first letter, Radio Moscow announced the text of a second, stern letter: the Soviet missiles out of Cuba only if the Jupiters left Turkey; Thompson: Khrushchev''s advisers had talked him into trying for the trade; not "the means the United States calls offensive" or the Security Council inspection)'
    units: '?'
- cite:
    id: cal.1962-10-27.missile-crisis
    item: '[[w.odonnell-johnny-we-hardly-knew]], 382 (the report that Major Rudolf Anderson''s U-2 had been shot down over Cuba, hit by a Soviet surface-to-air missile; not the Siberian flight or Robert Kennedy and Dobrynin)'
    units: B
- cite:
    id: cal.1962-11-06.elections-1962
    item: '[[w.odonnell-johnny-we-hardly-knew]], 391–92 (the November midterms "much better than any of the Democrats had expected": "We gained four seats in the Senate and the Republicans only gained two in the House"; Capehart beaten by Bayh in Indiana; Nixon losing the governorship to Brown; not the other governors, McGovern or Edward Kennedy)'
    units: A, B, C
- cite:
    id: cal.1962-11-07.elections-1962
    item: '[[w.odonnell-johnny-we-hardly-knew]], 392 (Nixon, after losing to Brown, telling the press that it "wouldn''t have Dick Nixon to kick around anymore"; not the place, the day or the words as quoted)'
    units: '?'
- cite:
    id: cal.1962-12-11.europe-and-the-alliance
    item: '[[w.odonnell-johnny-we-hardly-knew]], 394 (McNamara sent to London to break the news of Skybolt''s cancellation; at the airport he tells reporters the project is being wiped out after five straight unsuccessful tests and offers no replacement; the next day''s British papers charge Macmillan was double-crossed; his meeting with Thorneycroft "a disaster," Thorneycroft demanding "the Skybolt or nothing"; not what McNamara told Thorneycroft or the day)'
    units: '?'
- cite:
    id: cal.1962-12-17.press-and-broadcasting
    item: '[[w.odonnell-johnny-we-hardly-knew]], 391 (Kennedy in his office interviewed by the White House correspondents of the three networks, Vanocur, Lawrence and Herman, "two months after the Cuban missile crisis": "I think we ought to be rather pleased with ourselves this Christmas"; not the day, the title or the length)'
    units: '?'
- add:
    entry:
      id: cal.1962-12.europe-and-the-alliance-4
      when: Dec., after McNamara's visit to London
      date: '1962-12'
      thread: europe-and-the-alliance
      c: 'After McNamara''s trip to London, Kennedy on Macmillan and the cancelled Skybolt: "Why didn''t he know about it in advance? Why didn''t he get ready for it? And why didn''t *we* know that he didn''t know about it?" He asks for a comprehensive study of the misunderstanding. No time for it now: "We''ve got to help him out of this mess that we''ve put him in. He''s been given the shaft, and we''ve got to remove it."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 394–95 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1962-12-11.europe-and-the-alliance]]. Names: Kennedy, Macmillan, McNamara. Check: the day: the page puts it after McNamara''s trip to London (Dec. 11) and before the meeting already scheduled at Nassau (Dec. 18), with no day.'
      tags:
      - name:kennedy-john-f
      - name:macmillan-harold
      - name:mcnamara-robert-s
- cite:
    id: cal.1962-12-24.cuba-2
    item: '[[w.odonnell-johnny-we-hardly-knew]], 311–12 (Cushing''s account: Robert Kennedy telephones him, at the President''s suggestion, to ask for a million dollars before the day is over, to get the prisoners out before Christmas; he calls back in three hours with the money, to be delivered to the White House before six that night; Robert Kennedy had raised $1,900,000 with the help of General Clay; Castro''s demand for $2,900,000 "only a few days before the Christmas Eve deadline"; not Nolan and Williams''s calls, the flights, the hour or Katzenbach)'
    units: '?'
- variant:
    id: cal.1962-12-24.cuba-2
    unit: A
    witness: w.odonnell-johnny-we-hardly-knew
    reads: Castro demands "another $2,900,000 in cash" "at the last minute, only a few days before the Christmas Eve deadline," the prisoners released only after Clay's note is signed
    at: 311–12
- variant:
    id: cal.1962-12-24.cuba-2
    unit: C
    witness: w.odonnell-johnny-we-hardly-knew
    reads: Cushing promises the million at the White House "before six o'clock that night"; General Clay, in the Attorney General's office "the next morning," signs a note for $2,900,000; the prisoners are released "that afternoon" and flown to Miami
    at: 311–12
- cite:
    id: cal.1963-06-10.testing
    item: '[[w.odonnell-johnny-we-hardly-knew]], 407 (the speech''s close quoted; its reception: Khrushchev told Harriman later it was the best speech by an American President since Roosevelt; the Voice of America carried it to Russia and Eastern Europe in full, not jammed; Russian newspapers published the text; not the day, the "Pax Americana" words or the Moscow talks)'
    units: A
- add:
    entry:
      id: cal.1963-06.europe-and-the-alliance-kennedy-in
      when: June, before the trip
      date: '1963-06'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'After Pope John XXIII''s death, the visit to Italy kept at the Italian government''s insistence, Kennedy telephones Cardinal Cushing for advice. Cushing: "Stay away from Rome until after the coronation. It''s the biggest day of the man''s life, and you don''t want to take the play away from him."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 423–24 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-23.europe-and-the-alliance]]. Names: Kennedy. Check: the day: the page has the Pope''s death (June 3) "shortly before we left Washington," and the call after the White House''s offer to cancel, with no day.'
      tags:
      - name:kennedy-john-f
      - name:cushing-richard-g
- cite:
    id: cal.1963-06-23.europe-and-the-alliance
    item: '[[w.odonnell-johnny-we-hardly-knew]], 407–09 (the trip to Europe that June, planned first as a visit to West Germany; Cologne: Kennedy at mass with Adenauer in the cathedral, a crowd of nearly four hundred thousand outside, children with small American flags; Kennedy: "An advance man must have done some work here"; Adenauer: "we arrange things like you do in your election campaigns"; bigger crowds at Bonn, Frankfurt and Hanau the next two days; Bonn not with Adenauer; no day for Cologne; not the joint statement)'
    units: A
- cite:
    id: cal.1963-06-26.berlin-and-vienna
    item: '[[w.odonnell-johnny-we-hardly-knew]], 409–11 (West Berlin, June 26: a forty-mile tour, more than half the city''s population in the streets; the wall seen that morning; at the Brandenburg Gate a guard hands Kennedy a bouquet thrown over the wall with a note asking that it be given to him; at Checkpoint Charlie a small group of East Berliners beyond the gate wave and cheer; the square outside the Schöneberg City Hall: "Ich bin ein Berliner," "Let—them—come—to—Berlin!"; the Free University speech after it, with the ad-libbed "As I said this morning"; not Brandt, Adenauer, the platform, the square''s name or the German words of D)'
    units: '?'
- add:
    entry:
      id: cal.1963-06-26.berlin-and-vienna-2
      when: June 26
      date: '1963-06-26'
      thread: berlin-and-vienna
      c: 'Arriving in Berlin, Kennedy to O''Donnell: "What was the proud boast of the Romans—Civis Romanus sum? Send Bundy up here. He''ll know how to say it in German." Bundy translates: "Ich bin ein Berliner." Kennedy, writing it down: "Now tell me how to say in German, ''Let them come to Berlin.''"'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 410 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-26.berlin-and-vienna]]. Names: Kennedy, O''Donnell, Bundy.'
      tags:
      - name:kennedy-john-f
      - name:odonnell-kenneth-p
      - name:bundy-mcgeorge
- cite:
    id: cal.1963-06-26.europe-and-the-alliance-kennedy-in
    item: '[[w.odonnell-johnny-we-hardly-knew]], 410 (that afternoon, boarding Air Force One to leave Germany, Kennedy "said to us," the authors: "We''ll never have another day like this one"; not Sorensen, the cabin, East Germany, the sealed note or "as long as we live")'
    units: '?'
- variant:
    id: cal.1963-06-26.europe-and-the-alliance-kennedy-in
    unit: D
    witness: w.odonnell-johnny-we-hardly-knew
    reads: 'to the authors, on boarding Air Force One that afternoon: "We''ll never have another day like this one."'
    at: '410'
- cite:
    id: cal.1963-07-02.testing
    item: '[[w.odonnell-johnny-we-hardly-knew]], 407, 411 (the speech Khrushchev made a few weeks after the American University address in East Berlin, endorsing the atmospheric test ban; he decided to ignore the City Hall speech and "to accept the Free University speech"; not the three environments, inspection or Ball)'
    units: '?'
- cite:
    id: cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe
    item: '[[w.odonnell-johnny-we-hardly-knew]], 411–22 (the visit to Ireland: Dublin on the 26th, three nights at the Embassy in Phoenix Park; New Ross and Dunganstown; Cork; Galway; Limerick; Shannon; Wexford named only as the next stop. The speech to the combined houses of the Irish parliament "later that Friday afternoon," the first ceremony in the Dail''s chamber seen on national television: Lord Mountjoy, "We have lost America through the Irish"; Joyce''s "a bowl of bitter tears"; Shaw: "Other people see things, and say why. But I dream things that never were, and I say, why not?" (416–17))'
    units: B
- add:
    entry:
      id: cal.1963-06-26.europe-and-the-alliance-kennedy-in-2
      when: June 26
      date: '1963-06-26'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Dublin, the arrival. Men hold small children above their heads along O''Connell Street, women scream "Bless you!" At the Embassy in Phoenix Park Kennedy asks Powers, "What did you think of it?" Powers: "If you ran over here, you''d beat De Valera in his own precinct."'
      n: 'Remarks Upon Arrival at Dublin Airport, [1963 Pub. Papers 531](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=589) (June 26, 1963). [[w.odonnell-johnny-we-hardly-knew]], 412 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, Powers.'
      tags:
      - name:kennedy-john-f
      - name:powers-david-f
      - name:de-valera-eamon
- add:
    entry:
      id: cal.1963-06-27.europe-and-the-alliance-kennedy-in
      when: June 27
      date: '1963-06-27'
      thread: europe-and-the-alliance-kennedy-in-europe
      also:
      - democratic-party
      c: 'The American Embassy, Phoenix Park, the morning after the arrival. Kennedy to Ambassador McCloskey, who had been "rewarded with the Ambassadorship for his champion fund-raising efforts": "Matt, this is a much better place than the White House. The party is running into debt, and we need you back there." McCloskey: "If you need money, send Dick Maguire over here and I''ll tell him who to see." Kennedy announces that in 1968 he will support the Democratic candidate who promises to appoint him Ambassador to Ireland.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 412–13 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, McCloskey.'
      tags:
      - name:kennedy-john-f
      - name:mccloskey-matthew-h-jr
- add:
    entry:
      id: cal.1963-06-27.europe-and-the-alliance-kennedy-in-2
      when: June 27
      date: '1963-06-27'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: The American Embassy, Phoenix Park, the morning. Kennedy talks with Prime Minister Lemass.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 413 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:lemass-sean
- add:
    entry:
      id: cal.1963-06-27.europe-and-the-alliance-kennedy-in-3
      when: June 27
      date: '1963-06-27'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'New Ross, the riverside docks where his great-grandfather took ship. Schoolchildren spell out FAILTE on the park grass; others sing "The Boys of Wexford," and Kennedy asks for another verse, sings with them and pockets the card of the words. Of his great-grandfather: "he carried nothing with him except two things, a strong religious faith and a strong desire for liberty."'
      n: 'Remarks on the Quay at New Ross, [1963 Pub. Papers 531](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=589) (June 27, 1963). [[w.odonnell-johnny-we-hardly-knew]], 413 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-06-27.europe-and-the-alliance-kennedy-in-4
      when: June 27
      date: '1963-06-27'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Dunganstown, the old Kennedy farm. Kennedy greets Mary Ryan and other cousins in the cottage, a turf fire, cold salmon, tea. A cousin pours him a large Irish whisky; he hands it behind his back to Powers, who drinks it. Toast: "to all the Kennedys who went and those who stayed." At Mary Ryan''s demand, before Frank Aiken can take him on to Wexford, he plants a juniper tree in the garden; he kisses her cheek, his sisters Eunice and Jean looking on.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 414–15 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, Powers, Eunice Shriver.'
      tags:
      - name:kennedy-john-f
      - name:powers-david-f
      - name:aiken-frank
      - name:shriver-eunice-kennedy
- add:
    entry:
      id: cal.1963-06-28.europe-and-the-alliance-kennedy-in
      when: June 28
      date: '1963-06-28'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Cork, City Hall. The Lord Mayor, Sean Casey, confers the freedom of the city on Kennedy before a crowd of more than one hundred thousand. Kennedy presents Powers, who sits with seven local first cousins, and Monsignor Michael O''Mahoney, "the pastor of a poor, humble flock in Palm Beach, Florida." A sign in the crowd: "Don''t worry, Jack. The Iron Curtain will rust in peace."'
      n: 'Remarks at the City Hall in Cork, [1963 Pub. Papers 533](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=591) (June 28, 1963). [[w.odonnell-johnny-we-hardly-knew]], 415 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, Powers.'
      tags:
      - name:kennedy-john-f
      - name:powers-david-f
- add:
    entry:
      id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-2
      when: June 28
      date: '1963-06-28'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: Dublin, the American Embassy. Kennedy gives a luncheon for President de Valera and Prime Minister Lemass, with songs by the Bunratty Castle singers. At his request they sing "Danny Boy," and he joins them in an encore.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 415 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:de-valera-eamon
      - name:lemass-sean
- add:
    entry:
      id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-3
      when: June 28
      date: '1963-06-28'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: Arbour Hill, Dublin, where the executed leaders of the 1916 Easter Week Rebellion are buried. Kennedy and Lemass at the memorial services; cadets of the Military College at The Curragh perform a drill, which Kennedy watches "with fascination."
      n: '[[w.odonnell-johnny-we-hardly-knew]], 415–16 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:lemass-sean
- add:
    entry:
      id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-5
      when: June 28
      date: '1963-06-28'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Leaving the Dail, Kennedy to O''Donnell: "Kenny, of those you''ve met, who do you think are the best politicians in America?" O''Donnell: "Daley and Mansfield." Kennedy: "I agree with you. The Irish do seem to have an art for government." Then: "Perhaps we are both prejudiced."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 417 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, O''Donnell, Daley, Mansfield.'
      tags:
      - name:kennedy-john-f
      - name:odonnell-kenneth-p
      - name:daley-richard-j
      - name:mansfield-mike
- add:
    entry:
      id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-6
      when: June 28
      date: '1963-06-28'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Dublin Castle, St. Patrick''s Hall. Kennedy invested a freeman of the city; de Valera robes him for the National University''s doctor of laws, then the Earl of Rosse, Vice-Chancellor, gives him Trinity''s degree. In thanks: "if they ever have a game of Gaelic football or hurling, I shall cheer for Trinity and pray for National."'
      n: 'Remarks at a Civic and Academic Reception in St. Patrick''s Hall, Dublin Castle, [1963 Pub. Papers 539](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=597) (June 28, 1963). [[w.odonnell-johnny-we-hardly-knew]], 417–18 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:de-valera-eamon
- add:
    entry:
      id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-7
      when: June 28
      date: '1963-06-28'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Dinner at President de Valera''s, Kennedy''s last night in Ireland. Kennedy asks why de Valera alone of the 1916 leaders was not shot; de Valera: his American birth. On the British: "Only if you are reasonable, will they reason with you, and being reasonable with the British means letting them know that you are willing to throw an occasional bomb into one of their lorries." Mrs. de Valera recites a poem on the Shannon; Kennedy copies it on his place card.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 418–19 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:de-valera-eamon
- add:
    entry:
      id: cal.1963-06-29.europe-and-the-alliance-kennedy-in
      when: June 29
      date: '1963-06-29'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Galway, Eyre Square. A crowd of more than eighty thousand; the bells of Saint Nicholas Church ring "The Star-Spangled Banner." Kennedy: "How many of you have relatives in America whom you''d admit to? Nearly everybody in Boston comes from Galway and they''re not shy about it, at all."'
      n: 'Remarks at Eyre Square in Galway, [1963 Pub. Papers 540](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=598) (June 29, 1963). [[w.odonnell-johnny-we-hardly-knew]], 420 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-06-29.europe-and-the-alliance-kennedy-in-2
      when: June 29
      date: '1963-06-29'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Galway, the landing. An honor guard of twenty-four members of the local American Legion post; one hands Kennedy a letter: "It''s about my pension. Would you use your influence and see if you can get me an increase?" Kennedy assures him the request will get "every consideration" and gives the letter to Powers.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 419–20 (O''Donnell''s and Powers''s account; the increase put through a few weeks later, after Powers''s call to the Veterans Administration, 420). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, Powers.'
      tags:
      - name:kennedy-john-f
      - name:powers-david-f
- add:
    entry:
      id: cal.1963-06-29.europe-and-the-alliance-kennedy-in-3
      when: June 29
      date: '1963-06-29'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Limerick, the racecourse park. The lady mayor, Frances Clondell (the authors'' spelling), a Protestant, introduces Kennedy at length; he whispers to O''Donnell, "This is the best speech I''ve heard since I''ve been in Europe." Starting to say Limerick is his last stop before England and Italy, he catches himself: "From here I go to—another country—and then to Italy and back home to the United States." Of Ireland: "I will certainly come back in the springtime."'
      n: 'Remarks at a Reception in Limerick, [1963 Pub. Papers 541](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=599) (June 29, 1963). [[w.odonnell-johnny-we-hardly-knew]], 420–21 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, O''Donnell.'
      tags:
      - name:kennedy-john-f
      - name:odonnell-kenneth-p
- add:
    entry:
      id: cal.1963-06-29.europe-and-the-alliance-kennedy-in-4
      when: June 29
      date: '1963-06-29'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Shannon Airport, leaving for England. Kennedy recites the poem Mrs. de Valera gave him, "''Tis the Shannon''s brightly glancing stream": "Well, I am going to come back and see Old Shannon''s face again, and I am taking, as I go back to America, all of you with me." The Bunratty Castle girls sing "Danny Boy" once more. In the crowd, a sign: "Johnny, I Hardly Knew Ye."'
      n: 'Remarks at Shannon Airport Upon Leaving for England, [1963 Pub. Papers 542](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=600) (June 29, 1963). [[w.odonnell-johnny-we-hardly-knew]], 421–22 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- cite:
    id: cal.1963-06-29.europe-and-the-alliance-kennedy-in-europe
    item: '[[w.odonnell-johnny-we-hardly-knew]], 422–23 (after the unscheduled stop at Waddington and the visit to Kathleen''s grave, the night at Birch Grove with Macmillan and Rusk, who had gone to England from Germany to discuss the atmospheric test ban treaty and NATO; the authors leave for Brighton; not the multilateral force or the joint statement)'
    units: '?'
- add:
    entry:
      id: cal.1963-06-30.europe-and-the-alliance-kennedy-in
      when: June 30
      date: '1963-06-30'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: Lake Como, the Villa Serbelloni, Sunday evening; the party landed at Milan to keep clear of the coronation of Paul VI that day. Kennedy, in shirt-sleeves, drives through the village; townspeople run beside the car "trying to touch his hand."
      n: '[[w.odonnell-johnny-we-hardly-knew]], 424 (O''Donnell''s and Powers''s account). See [[cal.1963-06-23.europe-and-the-alliance]]. Names: Kennedy, Paul VI.'
      tags:
      - name:kennedy-john-f
      - name:paul-vi
- cite:
    id: cal.1963-07-01.europe-and-the-alliance-kennedy-in-europe
    item: '[[w.odonnell-johnny-we-hardly-knew]], 424–26 (Rome, Monday: Kennedy out from a two-hour talk with President Segni to a cheering square; the drive to the Tomb of the Unknown Soldier; Tuesday, the visit to NATO headquarters at Naples "before his departure"; from Naples directly to Washington, at his desk next morning at nine; not the joint statement or the day of the return)'
    units: A
- add:
    entry:
      id: cal.1963-07-02.europe-and-the-alliance-kennedy-in
      when: July 2
      date: '1963-07-02'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'Rome, Tuesday, before the audience with Paul VI; reporters wonder whether he will kneel and kiss the ring. Kennedy: "Norman Vincent Peale would love that. And it would get me a lot of votes in South Carolina." By the authors, he was visiting "as a head of state, not as a Catholic."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 424–25 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-07-01.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, Peale, Paul VI.'
      tags:
      - name:kennedy-john-f
      - name:peale-norman-vincent
      - name:paul-vi
- add:
    entry:
      id: cal.1963-07-02.europe-and-the-alliance-kennedy-in-2
      when: July 2
      date: '1963-07-02'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: The Vatican, Tuesday. Kennedy and Paul VI talk alone, with no interpreter, in the second-floor library at Clementine Hall; Rusk joins for fifteen minutes; the Pope then receives the party, Angier Biddle Duke, Jean Smith, Bundy, Sorensen, Salinger, Powers and O'Donnell. The Pope recalls meeting the President and other Kennedys "almost twenty-five years earlier," at the coronation of Pius XII.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 425 (O''Donnell''s and Powers''s account). See [[cal.1963-07-01.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, Paul VI, Rusk, Bundy, Sorensen, Salinger, Powers, O''Donnell.'
      tags:
      - name:kennedy-john-f
      - name:paul-vi
      - name:rusk-dean
      - name:duke-angier-b
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:salinger-pierre
      - name:powers-david-f
      - name:odonnell-kenneth-p
- add:
    entry:
      id: cal.1963-07-02.europe-and-the-alliance-kennedy-in-3
      when: July 2
      date: '1963-07-02'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: 'The North American College, Rome, after the audience. Cardinal Cushing greets Kennedy on the steps with a bear hug and a mock left jab and right hook, and hands him the "Pacem in Terris" encyclical Pope John had planned to give him, autographed, "one of the only three signed copies in existence." Kennedy, of the replica of Michelangelo''s Pieta Paul VI has just given him; Cushing: "I know he did. I was the one who told him to give it to you."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 425 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-07-01.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, Paul VI.'
      tags:
      - name:kennedy-john-f
      - name:cushing-richard-g
      - name:paul-vi
- add:
    entry:
      id: cal.1963-07-02.europe-and-the-alliance-kennedy-in-4
      when: July 2
      date: '1963-07-02'
      thread: europe-and-the-alliance-kennedy-in-europe
      c: Naples, the drive to the airport. The car is engulfed by a flag-waving crowd and cut off from the motorcycle escort and the Secret Service car behind, "a bad fright" for all but Kennedy, who says later the crowd was too friendly to cause him harm. A Secret Service man on the running board brushes off a man climbing on the limousine with an American flag in his teeth.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 425–26 (O''Donnell''s and Powers''s account). See [[cal.1963-07-01.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- cite:
    id: cal.1963-07-04.vietnam
    item: '[[w.odonnell-johnny-we-hardly-knew]], 426 (Thursday, the Fourth of July: Kennedy "had to spend the morning of the holiday in an urgent meeting on the Vietnam situation"; not the hour, the participants or the business)'
    units: '?'
- add:
    entry:
      id: cal.1963-07-04.railroads
      when: July 4
      date: '1963-07-04'
      thread: railroads
      c: The White House, the Fourth of July, after the morning meeting on Vietnam. Kennedy in a long session with Secretary of Labor Wirtz on a threatened nationwide railroad strike. He cannot leave for Cape Cod until late in the afternoon.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 426 (O''Donnell''s and Powers''s account). See [[cal.1963-07-04.vietnam]]. Names: Kennedy, Wirtz.'
      tags:
      - name:kennedy-john-f
      - name:wirtz-w-willard
- cite:
    id: cal.1963-08-07.testing
    item: '[[w.odonnell-johnny-we-hardly-knew]], 427 (on Aug. 7 Kennedy in a meeting with members of the Citizens Committee for a Nuclear Test Ban when O''Donnell has word from Hyannis Port that Jackie is in emergency surgery at Otis Air Base; not the Cabinet Room, the participants, Kennedy''s words or the meeting broken off)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-14.transportation
      when: Nov. 14
      date: '1963-11-14'
      thread: transportation
      c: The Mason-Dixon line, between Delaware and Maryland. Kennedy lands by helicopter and cuts a blue and gray ribbon opening a new stretch of Interstate Route 95.
      n: 'Remarks at the Dedication of the Delaware-Maryland Turnpike, [1963 Pub. Papers 854](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=912) (Nov. 14, 1963). [[w.odonnell-johnny-we-hardly-knew]], 440–41 (O''Donnell''s and Powers''s account). Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-11-14.white-house-2
      when: Nov. 14
      date: '1963-11-14'
      thread: white-house
      c: New York, Thursday evening. Kennedy leaves the Carlyle by a side door to Madison Avenue while the police escort waits at the front, and walks with Powers and a few nervous Secret Service agents along Seventy-sixth Street to Jean and Steve Smith's apartment on Fifth Avenue. The police, learning of it, are "somewhat put out."
      n: '[[w.odonnell-johnny-we-hardly-knew]], 441 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-11-14.white-house]]. Names: Kennedy, Powers, Stephen Smith.'
      tags:
      - name:kennedy-john-f
      - name:powers-david-f
      - name:smith-stephen-e
      - city:nyc
- add:
    entry:
      id: cal.1963-11-16.defense
      when: Nov. 16
      date: '1963-11-16'
      thread: defense
      c: Cape Canaveral, Saturday morning. Kennedy watches the firing of a Polaris missile.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 441 (O''Donnell''s and Powers''s account). Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:fl
- add:
    entry:
      id: cal.1963-11-22.assassination-17
      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      c: Air Force One, from Dallas. Jacqueline Kennedy, whom the President had told of the memorial services at Arbour Hill, arranges to have the same group of Irish cadets at his grave during the burial.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 416 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-28.europe-and-the-alliance-kennedy-in-3]]. Names: Jacqueline Kennedy, Kennedy.'
      tags:
