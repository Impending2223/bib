- add:
    entry:
      id: cal.1965-02-07.soviet-union
      when: Feb. 7
      date: '1965-02-07'
      time: 1965-02-07T16:30Z
      time_zone: America/New_York
      place: washington
      thread: soviet-union
      also:
      - vietnam
      c: 'Washington. Thompson, at his house, tells Dobrynin that the destroyer patrol in the Gulf of Tonkin was cancelled for Kosygin''s visit to Hanoi and the South Vietnamese asked to suspend some actions; the weekend''s attack on American personnel, which killed seven, was by the U.S. view a deliberate attempt to "mouse trap" Kosygin. The U.S. will withdraw if North Vietnam ends its aggression and respects its neighbors. Dobrynin: striking another state is different from a guerrilla action; his government will take it as "a deliberate provocation."'
      n: 'FRUS 1964–68, II, doc. [82](https://history.state.gov/historicaldocuments/frus1964-68v02/d82) (Thompson''s memorandum, 11:30 a.m.; Thompson says he acts on the President''s instructions). [[w.preston-war-council]], 175 (Dobrynin warns Thompson that more strikes would be "a deliberate provocation"; the day not given). Made public: 1996. See [[cal.1965-02-06.soviet-union]]. Names: Thompson, Dobrynin, Kosygin.'
      tags:
      - polity:us
      - polity:ussr
      - name:thompson-llewellyn-e
      - name:dobrynin-anatoly
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1964-11-19.soviet-union
      when: Nov. 19
      date: '1964-11-19'
      time: 1964-11-19T10:00Z
      time_zone: Europe/Moscow
      place: moscow
      thread: soviet-union
      c: 'Kohler to the State Department, Moscow, telegram 1559, 1 p.m.: Zhou''s visit and statements reinforce indications that "basic differences between USSR and CPR will continue." Soviet tone toward the West, in Brezhnev''s speech of Nov. 6 and *Pravda*''s leader of Nov. 13: the main lines kept, more stress on peaceful coexistence and better relations; a period of relative quiet in East–West relations expected, with firm restatements on Article 19, Berlin and Southeast Asia.'
      n: 'FRUS 1964–68, XIV, doc. [74](https://history.state.gov/historicaldocuments/frus1964-68v14/d74) (RG 59, Central Files 1964–66, POL 15 USSR; repeated to London, Paris and Bonn). Made public: 2001. See [[cal.1964-11.china]]. Names: Kohler, Zhou Enlai, Brezhnev.'
      tags:
      - polity:us
      - polity:ussr
      - name:kohler-foy-d
      - name:zhou-enlai
      - name:brezhnev-leonid
