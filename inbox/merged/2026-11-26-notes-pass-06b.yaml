patch: notes-pass-06b
by: 'Claude (reader; the notes pass, batch 06b: R33a, building on the entry from its cites); audited and corrected by Claude (Opus audit, notes/notes-pass/audit-06.md)'
ops:
- edit:
    id: cal.1964-10-11.china-leadership
    base: 9b4b198f
    kind: reword
    set:
      c: 'Zhou, as good weather is likely Oct. 15, after the reports from Zhang Aiping and Liu Xiyao at the site and Liu Jie''s on air defense, writes to Mao, Liu, Lin, Deng, Peng, He Long, Nie and Luo: "Now everything is ready"; by secure line and code word he will tell the site to go ahead as it proposed, to choose the day and hour of firing from Oct. 15 to 20 by the weather and tell the Center. Luo to have the General Staff check, link and direct air defense; Liu Jie to see to removing papers, equipment and instruments and to secrecy. Settles other points in the reports, "all to be carried out". That evening again calls Yang Chengwu, Liu Jie, Qiao Guanhua.'
- edit:
    id: cal.1964-11-05.china-leadership-5
    base: cdcae0c4
    kind: correct
    settles:
    - 'Check: the waijiao huodong''s 6:45 p.m. may be Peking''s clock (1:45 p.m. in Moscow); Wu has the afternoon.'
    set:
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 853, 855 (with Kang Sheng and Liaison Department staff; "the afternoon of Nov. 5"); [[w.zhou-enlai-waijiao-huodong]], 427 (Nov. 5, 1964; 下午6时15分, the arrival, the Vietnamese delegation under Phạm Văn Đồng on the same plane, Kosygin at the airport); [[w.macfarquhar-origins-of-the-cultural]], III, 365 (Kosygin meets the delegation at Moscow airport); [[w.mao-zedong-zhuan]], V, ch. 71 (Nov. 5 Zhou leads the delegation to Moscow). [[w.jian-zhou-enlai]], 511 (Nov. 5, with Phạm Văn Đồng; Kosygin himself at the airport); [[w.friedman-shadow-cold-war]], 124 (the delegation for the forty-seventh anniversary; the Soviets, keeping Khrushchev''s fundamentals, hope a change of tone will do; an abject failure); [[w.khoo-collateral-damage]], 19 (the visit Nov. 5–13; Zhou with Marshal He Long, Kang Sheng and Wu Xiuquan, a delegation of fifty to sixty; Chen Yi not on the trip). To check: Chinese Embassy in Moscow to Chinese Foreign Ministry, November 6, 1964 (cited by [[w.jian-zhou-enlai]], 511 n.74); [[w.luthi-sino-soviet-split]], 287 (cited by [[w.friedman-shadow-cold-war]], 124 n.96a); [[w.radchenko-two-suns-in-the]], 127–29 (cited by [[w.friedman-shadow-cold-war]], 124 n.96b); [[w.xiuquan-huiyi-yu-huainian]], 374–381 (cited by [[w.khoo-collateral-damage]], 19 n.50); [[w.zhou-enlai-waijiao-huodong]], 427 (cited by [[w.khoo-collateral-damage]], 19 n.51a); [[w.macfarquhar-origins-of-the-cultural]], III, 364–366 (cited by [[w.khoo-collateral-damage]], 19 n.51b). See [[cal.1964-11-05.china-leadership-2]]. Names: Zhou Enlai, He Long, Kosygin. Check: the waijiao huodong''s 6:15 p.m. (下午6时15分, read on the page) may be Peking''s clock (1:15 p.m. in Moscow); Wu has the afternoon.'
