      - name:taylor-maxwell
      - name:johnson-lyndon-b
    section: '196411'
- add:
    entry:
      id: cal.1964-12-07.vietnam
      when: Dec. 7
      date: '1964-12-07'
      thread: vietnam
      c: 'Johnson sends McNamara, Rusk and McCone the new policy statement and his instructions to Taylor: "a matter of the highest importance," not to "become public except as I specifically direct."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 528. See [[cal.1964-12-01.vietnam]]. Names: Johnson, McNamara, Rusk, McCone, Taylor.'
