      c: 'Rostow to Kennedy: "As we have feared, the Communists launched a probing offensive against Phoumi''s men. Without much fight our boys fell back, apparently beyond the crucial crossroads." A week before: "Phoumi is stuck," four to seven kilometers in the twenty-one days his advisers gave him to take the Plain of Jars.'
