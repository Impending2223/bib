    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 149 (the report of May 5)'
    units: A
- add:
    entry:
      id: cal.1961-05-19.berlin-and-vienna-2
      when: May 19
      date: '1961-05-19'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'McNamara asks Nitze to draft a revision of NSC 5803, "U.S. Policy Toward Germany": "substantial conventional military force" to reopen the way to Berlin. The Chiefs asked the same; Nitze to bring Bonn into the contingency planning.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 149. To check: McNamara for the CJCS, May 19, 1961, fldr 092 Germany (Berlin) Jan-May 61, box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 149 n.24); McNamara for the ASD(ISA), May 19, 1961, fldr 092 Germany (Berlin) Jan-May 61, box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 149 n.24). See [[cal.1961-05-05.berlin-and-vienna]]. Names: McNamara, Nitze.'
      src:
        c: 5630cb12
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 149: all'
        - 'via x.1961-05-19.mcnamara-for-the-cjcs-may-19-1961: all'
        - 'via x.1961-05-19.mcnamara-for-the-asd-isa-may-19: all'
      tags:
      - name:mcnamara-robert-s
      - name:nitze-paul
    section: '196105'
- add:
    entry:
      id: cal.1961-05-25.berlin-and-vienna
      when: May 25
      date: '1961-05-25'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'The Joint Chiefs to McNamara, LeMay signing: "substantial conventional military force" too vague; estimates of the forces needed to reopen access under way; concern at limiting nuclear weapons to general war.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 149. To check: JCSM-353-61, LeMay for SecDef, May 25, 1961, fldr 092 Germany (Berlin), Jan-May 61, box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 149 n.25). See [[cal.1961-05-19.berlin-and-vienna-2]]. Check: the day, from the note. Names: McNamara, LeMay.'
      src:
        c: 862c99f4
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 149: all'
        - 'via x.1961-05-25.jcsm-353-61-lemay-for-secdef-may: all'
      tags:
      - name:mcnamara-robert-s
      - name:lemay-curtis-e
    section: '196105'
- add:
    entry:
      id: cal.1961-05-29.berlin-and-vienna-2
      when: May 29
      date: '1961-05-29'
      thread: berlin-and-vienna
      also:
      - defense
      c: Gilpatric asks the Joint Chiefs what temporary reinforcement of the forces in Europe could show the seriousness with which the United States takes the Soviet threats.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 150. Names: Gilpatric.'
      src:
        c: 7cb6f2f3
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 150: all'
      tags:
      - name:gilpatric-roswell-l
    section: '196105'
- add:
    entry:
      id: cal.1961-06-06.berlin-and-vienna-2
      when: June 6
      date: '1961-06-06'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'The Joint Chiefs answer Gilpatric: two airborne battle groups and 224 aircraft to the training areas in Germany in two to three weeks; an airborne division, 11,555 men, in nine days on a crash basis. Their preference: one of the 27 National Guard divisions in summer training, its service extended 30 to 60 days, with a declaration of national emergency and more reserves called.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 151. To check: P. H. Johnstone, "Military Policy Making during the Berlin Crisis of 1958-62," IDA Report R-138, Mar. 1968, IDA (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 151 n.35). See [[cal.1961-05-29.berlin-and-vienna-2]]. Names: Gilpatric.'
      src:
        c: 20be1476
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 151: all'
        - 'via x.1968-03.p-h-johnstone-military-policy-making-during: all'
      tags:
      - name:gilpatric-roswell-l
    section: '196106'
- cite:
    id: cal.1961-06-29.berlin-and-vienna
    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 152 (the meeting; Acheson''s case)'
    units: A
- add:
    entry:
      id: cal.1961-06-30.berlin-and-vienna
      when: June 30
      date: '1961-06-30'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'NSAM 58, to Rusk, McNamara and Dillon. McNamara by July 6: preparatory measures needed at once; for the NSC of July 13: a garrison and civilian airlift by Oct. 15, naval harassment and blockade of bloc shipping by Nov. 15, large-scale non-nuclear ground action, two to twelve divisions, nuclear weapons in Europe not to be used without the President''s authority, SAC at maximum readiness.'
      n: '[FRUS 1961–63, XIV: Berlin Crisis, 1961–1962, doc. 53](https://history.state.gov/historicaldocuments/frus1961-63v14/d53). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 152 (the request after the NSC of June 29). See [[cal.1961-06-29.berlin-and-vienna]]. Names: Rusk, McNamara, Dillon.'
      src:
        c: 9f1fa623
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d53: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 152: A'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:dillon-c-douglas
    section: '196106'
- add:
    entry:
      id: cal.1961-07-06.berlin-and-vienna-2
      when: July 6
      date: '1961-07-06'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'The Joint Chiefs to McNamara, answering NSAM 58: mobilize 559,000 military, with 40,000 civilians, at $13.9 billion for fiscal 1962 and $17 billion for 1963; men and equipment by service.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 152. See [[cal.1961-06-30.berlin-and-vienna]]. Names: McNamara.'
      src:
        c: c8a455e3
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 152: all'
      tags:
      - name:mcnamara-robert-s
    section: '196107'
- cite:
    id: cal.1961-07-08.berlin-and-vienna
    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 152'
    units: A-D
- add:
    entry:
      id: cal.1961-07-12.berlin-and-vienna
      when: July 12
      date: '1961-07-12'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'Lemnitzer to McNamara: 559,000 more men, half of them Army, would not change the strategy of the United States or NATO, still anchored to a nuclear response; partial mobilization might show the West''s determination and set back a Soviet timetable.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 155. To check: JCSM-476-61, Lemnitzer for SecDef, July 12, 1961, fldr 092 Germany (Berlin) Jul 61, box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 155 n.54). See [[cal.1961-07-06.berlin-and-vienna-2]]. Names: Lemnitzer, McNamara.'
      src:
        c: c9e2be00
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 155: all'
        - 'via x.1961-07-12.jcsm-476-61-lemnitzer-for-secdef-july: all'
      tags:
      - name:lemnitzer-lyman-l
      - name:mcnamara-robert-s
    section: '196107'
- cite:
