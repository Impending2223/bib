        c: '93039875'
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=727: A'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 39: all'
      tags:
      - name:kennedy-john-f
    section: '196110'
