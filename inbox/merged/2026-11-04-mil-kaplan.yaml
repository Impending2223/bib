    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 250 (the Johnson plan; the President''s decisions: contingency planning, 500 American advisers and as many Thai, 2,000 more Hmong to 11,000, photo reconnaissance twice a week)'
    units: A
