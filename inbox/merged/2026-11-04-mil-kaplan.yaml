- add:
    entry:
      id: cal.1961-10-20.berlin-and-vienna-2
      when: Oct. 20
      date: '1961-10-20'
      thread: berlin-and-vienna
      also:
      - defense
      - europe-and-the-alliance
      c: 'Kennedy to Norstad: the measures he recommended authorized and in motion but the replacement of the 3rd battle group in Berlin; the enclosed four courses of action, in sequence, his guidance for talks with the allies and for planning; Norstad to spell out his command and control for "selective nuclear attacks" and "limited tactical employment of nuclear weapons."'
      n: '[FRUS 1961–63, XIV: Berlin Crisis, 1961–1962, doc. 185](https://history.state.gov/historicaldocuments/frus1961-63v14/d185). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 163 ("a sequence of graduated responses to Soviet/GDR actions in denial of our rights of access"; as much weight on non-nuclear forces as on the deterrent). See [[cal.1961-10-20.berlin-and-vienna]]. Names: Kennedy, Norstad.'
      src:
        c: 24d8d8c0
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d185: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 163: B'
      tags:
