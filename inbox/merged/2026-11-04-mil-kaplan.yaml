    section: '196209'
- add:
    entry:
      id: cal.1962-09-13.cuba
      when: Sept. 13
      date: '1962-09-13'
      thread: cuba
      also:
      - defense
      c: 'McNamara to Kennedy: only 142 Cubans joined the forces between July 29, 1961, and July 31, 1962, 30 since discharged; of some 4,000 interested, 1,000 registered, two-thirds of them disqualified, half on "moral and security" grounds. A new program of all-Cuban units, trained in Spanish; the Chiefs think a brigade premature.'
      n: '[FRUS 1961–63, X: Cuba, 1961–1962, doc. 426](https://history.state.gov/historicaldocuments/frus1961-63v10/d426). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 197 (the Chiefs against a brigade: no qualified leaders, the Cubans unwilling to serve but in their own units). See [[cal.1962-09-07.cuba-2]]. Names: McNamara, Kennedy.'
      src:
        c: 58f1bda3
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d426: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 197: C'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
    section: '196209'
- add:
    entry:
      id: cal.1962-09-21.missile-crisis
      when: Sept. 21
      date: '1962-09-21'
      thread: missile-crisis
      also:
      - defense
      c: 'Kennedy to McNamara: at the meeting of Sept. 14 LeMay and Anderson disagreed on the losses in attacking an SA-2 site; a model site for exercises before a disinterested observer, and its cost? The contingency plans for Cuba to be kept up to date with the Soviet equipment and technicians arriving.'
      n: '[FRUS 1961–63, X: Cuba, 1961–1962, doc. 434](https://history.state.gov/historicaldocuments/frus1961-63v10/d434). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 203. See [[cal.1962-09-14.cuba]]. Names: Kennedy, McNamara, LeMay, Anderson.'
      src:
        c: d31c805f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d434: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 203: all'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-robert-s
      - name:lemay-curtis-e
      - name:anderson-george-w-jr
    section: '196209'
- add:
    entry:
      id: cal.1962-09-21.missile-crisis-2
      when: Sept. 21
      date: '1962-09-21'
      thread: missile-crisis
      also:
      - intelligence
      c: The agent's report of the convoy of Sept. 12 reaches Washington; the CIA distributes it, commenting that he probably saw surface-to-air missiles.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 202. See [[cal.1962-09-12.missile-crisis]].'
      src:
        c: caddcca5
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 202: all'
    section: '196209'
- add:
    entry:
      id: cal.1962-10-05.missile-crisis
      when: Oct. 5
      date: '1962-10-05'
      thread: missile-crisis
      also:
      - defense
      c: 'The Defense Intelligence Agency: the reports of Soviet surface-to-air missiles in Cuba still allegations; very short range; "no evidence to suggest that the missiles can be used offensively."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 202. To check: Brig. Gen. L. A. Hall for the DASD(ISA), Oct. 5, 1962, fldr Cuba Oct 1-7, 1962, box 440, Subject files, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 202 n.31).'
      src:
        c: 09d2e1f9
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 202: all'
        - 'via x.1962-10-05.brig-gen-l-a-hall-for-the: all'
    section: '196210'
- cite:
    id: cal.1962-10-14.missile-crisis
    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 202–4 (Bundy on television the same day; the two U-2s)'
    units: all
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-7
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-jupiters
      c: 'William Bundy of ISA, "Generalized Negotiation of Bases as a Possible Face-Saver to the Soviets for Withdrawal of Missiles from Cuba": the Soviets out of Cuba, the United States out of Turkey and Italy or elsewhere; "hitherto we have considered the subject of ''foreign military bases'' an untouchable subject for negotiation"; the political cost perhaps too high.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 220. To check: William Bundy, "Generalized Negotiation of Bases as a Possible Face-Saver to the Soviets for Withdrawal of Missiles from Cuba," Oct. 21, 1962, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 220 n.117). Names: William Bundy.'
      src:
        c: aaeedbe1
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 220: all'
        - 'via x.1962-10-21.william-bundy-generalized-negotiation-of-bases-as: all'
      tags:
      - name:bundy-william
    section: '196210'
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-8
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-jupiters
      - defense
      c: 'An ISA memorandum to Nitze, "The Implications of Withdrawal of Our Ballistic Missiles From Turkey": Turks man the Jupiters; "Removal of the weapons, in the most real sense, is an act of disarming our friend"; capitulation to blackmail. The Joint Chiefs the same day against a presidential order that no Jupiter be fired from Italy or Turkey without further authority, even under Soviet attack.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 221. To check: ISA memorandum to Nitze, "The Implications of Withdrawal of Our Ballistic Missiles From Turkey," Oct. 21, 1962, fldr R&R Unit, Cuban Missile Crisis, Nitze Black Book II, box 2, Cuba Sensitive files, Acc 71A-2896 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 221 n.120); JCSM-800-62, Vice Adm. Herbert D. Riley for SecDef, Oct. 21, 1962, fldr R&R Unit, Cuban Missile Crisis, box 3, Cuba Sensitive files, Acc 71A-2896 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 221 n.121). Names: Nitze.'
      src:
        c: ccc1c315
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 221: all'
        - 'via x.1962-10-21.isa-memorandum-to-nitze-the-implications-of: A'
        - 'via x.1962-10-21.jcsm-800-62-vice-adm-herbert-d: B'
      tags:
      - name:nitze-paul
    section: '196210'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-27
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - defense
      c: The armed forces to DEFCON 3. The President gives McNamara latitude in carrying out the quarantine, ships refusing to identify their cargo or accept search to be taken into custody; preparations for an air strike and a landing go on.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 210. See [[cal.1962-10-22.missile-crisis]]. Names: McNamara.'
      src:
        c: 1fb2f512
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 210: all'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-robert-s
    section: '196210'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-28
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - defense
      c: 'The Joint Chiefs to SACLANT, JCS 6848, on the "blockade": "forceful boarding and control of the ship''s operation may be necessary. If boarding meets with organized resistance, the ship will be destroyed." That afternoon, McNamara approving, they tell Power, CINCSAC, to be ready to go to DEFCON 2 at 10 a.m., Oct. 23, the quarantine''s hour.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 211. To check: JCS 6848 to CINCLANT, Oct. 22, 1962, fldr Cuba Oct 22, 1962, box 440, Subject files, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 211 n.68); McNaughton for SecDef, Oct. 22, 1962, fldr Cuba Oct 22, 1962, box 440, Subject files, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 211 n.68). See [[cal.1962-10-22.missile-crisis]]. Check: Kaplan''s note names CINCLANT; the quarantine began Oct. 24. Names: McNamara.'
      src:
        c: 9a7b189d
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 211: all'
        - 'via x.1962-10-22.jcs-6848-to-cinclant-oct-22-1962: A'
        - 'via x.1962-10-22.mcnaughton-for-secdef-oct-22-1962: all'
      tags:
      - name:mcnamara-robert-s
    section: '196210'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-29
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-jupiters
      - defense
      c: 'Taylor to Norstad: no missile to be fired from Italy or Turkey without the President''s authority. Kennedy at the White House that morning, 11:30: "What we''ve got to do is make sure these fellows ... don''t fire them off and think the United States is under attack. I don''t think we ought to accept the Chiefs'' word on that one."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 221. To check: White House meeting, Oct. 22, 1962, 11:30 a.m., recorded, May et al., Presidential Recordings, III, 34–35 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 221 n.122). See [[cal.1962-10-21.missile-crisis-8]]. Names: Taylor, Norstad, Kennedy.'
      src:
        c: '08611898'
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 221: all'
        - 'via x.1962-10-22.white-house-meeting-oct-22-1962-11: B'
      tags:
      - name:taylor-maxwell
      - name:norstad-lauris
      - name:kennedy-john-f
    section: '196210'
- cite:
    id: cal.1962-10-24.missile-crisis
    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 210 (the OAS, 19 to 0, Oct. 24)'
    units: A
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-7
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis
      also:
      - berlin-and-vienna
      c: 'The ExComm''s Berlin-NATO subcommittee, Nitze in the chair, 11 a.m., its first meeting: the allies to be told that the Soviet acts in Cuba heightened the Berlin crisis; no dramatic initiatives, nuclear weapons into Berlin among them, to force the Soviets out of Cuba.'
      n: '[FRUS 1961–63, XV: Berlin Crisis, 1962–1963, doc. 140](https://history.state.gov/historicaldocuments/frus1961-63v15/d140). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 219 (no dramatic initiatives). Names: Nitze.'
      src:
        c: 4aa30e93
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d140: A-B'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 219: A'
      tags:
      - name:nitze-paul
    section: '196210'
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-13
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis
      also:
      - berlin-and-vienna
      - defense
      c: 'The Berlin-NATO subcommittee to the President, "Buildup and Deployment in Phase II of a Berlin Contingency," NSAM 109''s second phase: Defense''s outline plan, forces on call by increments. The first a corps of three Army divisions, a Marine division and ten Air Force fighter squadrons with naval units; then a second large increment.'
      n: '[FRUS 1961–63, XV: Berlin Crisis, 1962–1963, doc. 143](https://history.state.gov/historicaldocuments/frus1961-63v15/d143). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 219 (the increments). See [[cal.1962-10-24.missile-crisis-7]]. Names: Nitze.'
      src:
        c: 45f8b586
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d143: A'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 219: all'
      tags:
      - name:nitze-paul
    section: '196210'
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-14
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis
      also:
      - defense
      c: American ships force the Soviet submarine B-59 to the surface. It carries a nuclear-tipped torpedo; its commander, thinking himself attacked, is tempted to arm it and does not. Washington learns of the submarines' nuclear weapons only in 2002.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 212–13. Check: Kaplan gives the submarine''s mission as a naval base at Mariel.'
      src:
        c: 6b9c1a21
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 212–13: all'
    section: '196210'
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-15
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis
      also:
      - defense
      c: 'The forces poised for the invasion of Cuba: two carriers with nine escorts and a task force of 12 destroyers and cruisers; three Marine battalions reinforcing Guantánamo, a Marine expeditionary brigade on its way from California; some 850 Tactical Air Command aircraft in the Southeast; four Army divisions assigned to CINCLANT. SAC: 52 B-52s airborne with 196 nuclear weapons, 611 bombers on 15-minute alert.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 213. To check: Anatoli I. Gribkov and William Y. Smith, Operation ANADYR (1994), 141-42, Gribkov and Smith, *Operation ANADYR*, 141–42 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 213 n.78).'
      src:
        c: e5aa775f
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 213: all'
        - 'via x.1994.anatoli-i-gribkov-and-william-y-smith: all'
    section: '196210'
- add:
    entry:
      id: cal.1962-11-06.missile-crisis-2
      when: Nov. 6
      date: '1962-11-06'
      thread: missile-crisis
      also:
      - defense
      c: 'By Nov. 6 Washington and Moscow agree how the missiles'' removal is to be watched: a Swedish ship under UN contract to inspect incoming Soviet ships; nine outgoing Soviet freighters with the weapons to accept visual and photographic inspection by American warships.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 215. Check: the day.'
      src:
        c: fe84cf9e
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 215: all'
    section: '196211'
- add:
    entry:
      id: cal.1962-11-07.missile-crisis
      when: Nov. 7
      date: '1962-11-07'
      thread: missile-crisis
      also:
      - defense
      c: 'Nitze to the ExComm on the Il-28s: a private warning to Kuznetsov, then if need be a public statement that "an important weapon system capable of offensive use" cannot stay; if that and an assurance against invasion fail, an air attack on the bombers. SAC kept at DEFCON 2.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 216. Names: Nitze, Kuznetsov.'
      src:
        c: 299ef172
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 216: all'
        - 'via x.1962-11-12.summary-record-of-the-24th-excomm-meeting: B'
      tags:
      - name:nitze-paul
      - name:kuznetsov-vasily-v
    section: '196211'
- add:
    entry:
      id: cal.1962-11-10.missile-crisis
      when: Nov. 10
      date: '1962-11-10'
      thread: missile-crisis
      c: 'Ball to Kennedy, "Suggested Policy Line for Cuban Crisis": four assumptions, pending Moscow''s answer on the Il-28s and Mikoyan''s talks with Castro. If Moscow cannot control Castro, accept "the fact or fiction" that Khrushchev has complied as far as he can and put the pressure on Cuba; no assurance against invasion. Nitze, for Defense, concurs.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 169](https://history.state.gov/historicaldocuments/frus1961-63v11/d169). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 216. To check: Nitze for SecDef, Nov. 12, 1962, fldr Cuba Quarantine, box 443, Subject files, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 216 n.95). Names: Ball, Kennedy, Mikoyan, Castro, Khrushchev, Nitze.'
      src:
        c: 521eb9a7
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d169: A-B'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 216: all'
        - 'via x.1962-11-12.nitze-for-secdef-nov-12-1962: C'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:mikoyan-anastas
      - name:castro-fidel
      - name:khrushchev-nikita-s
      - name:nitze-paul
    section: '196211'
- add:
    entry:
      id: cal.1962-11-15.missile-crisis-4
      when: Nov. 15
      date: '1962-11-15'
      thread: missile-crisis
      c: 'Nitze to the ExComm: the dispute over the Il-28s an opening. "Had the Soviet Union removed both bombers and missiles in the initial withdrawal, such complete acquiescence might have made it politically infeasible to do more than accept the return to status quo ante"; force, or its threat, against the bombers toward the "removal of the Soviet presence from Cuba and reorientation of the Cuban regime."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 217. To check: Nitze for the ExComm, Nov. 15, 1962, fldr Cuba untitled, box 445, Subject files, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 217 n.97). Names: Nitze.'
      src:
        c: b2c9cb36
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 217: all'
        - 'via x.1962-11-15.nitze-for-the-excomm-nov-15-1962: all'
      tags:
      - name:nitze-paul
    section: '196211'
- add:
