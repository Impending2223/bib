      - defense
      c: 'McNamara''s press conference: the crisis in Berlin the "most serious that we have faced since the end of the Korean War"; the United States to use "whatever weapons are required to defend our vital interests."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 168. To check: McNamara Public Statements, 1962, IV, 1807, 1812, OSD Historical Office (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 168 n.108). Names: McNamara.'
