      date: '1964-08-15'
      thread: vietnam
      also:
      - defense
      c: 'McNaughton asks the Chiefs'' office for counterinsurgency and special activities, SACSA, which runs the 34A program, for a plan to acknowledge the covert operations against the North in public, Hanoi expected to protest. SACSA: "once the door is opened, US political and military officials at all levels must be prepared to field a multitude of" questions.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 523. Names: McNaughton.'
