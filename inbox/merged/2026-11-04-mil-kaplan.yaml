      when: Early Sept.
      date: '1961-09'
      thread: laos
      also:
      - soviet-union
      - berlin-and-vienna
      c: Kennan opens a channel between Kennedy and Khrushchev on Berlin and Laos through the Soviet ambassador in Belgrade, "a strictly bilateral communication." Rusk presses for the removal of all foreign forces from Laos; word back that Moscow counts "Chinese and Viet Minh armed personnel as foreign troops to be removed."
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 249–50. To check: State to Belgrade, 274, Sept. 5, 1961, FRUS 1961–63, XXIV, 402–03 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 250 n.82). Check: the days (State to Belgrade, 227 of Aug. 30 and 274 of Sept. 5). Names: Kennan, Kennedy, Khrushchev, Rusk.'
      src:
        c: 8fbefdee
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 249–50: all'
        - 'via x.1961-09-05.state-to-belgrade-274-sept-5-1961: all'
      tags:
      - name:kennan-george-f
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:rusk-dean
    section: '196109'
- add:
    entry:
      id: cal.1961-09-07.laos
      when: Sept. 7
      date: '1961-09-07'
      thread: laos
      also:
      - defense
      - berlin-and-vienna
      c: 'The Joint Chiefs to McNamara: Berlin diverting attention from Southeast Asia, as the blockade of 1948–49 did when China was lost; "immediate and positive action to prevent a complete communist takeover of Laos and the ultimate loss of all Southeast Asia to include Indonesia"; SEATO forces before the rainy season ends. No answer from McNamara.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 250–51. Names: McNamara.'
      src:
        c: 4c61c419
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 250–51: all'
      tags:
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1961-09-29.laos
      when: Sept. 29
      date: '1961-09-29'
      thread: laos
      also:
      - defense
      c: 'The Joint Chiefs to McNamara: a plan to restore nearly all Laos to royal rule, SEATO troops in large numbers. A Chinese and North Vietnamese invasion would need 15 divisions and some 278,000 men, four of them American divisions, two from the continental reserve.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 251. Names: McNamara.'
      src:
        c: f07a8dc4
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 251: all'
      tags:
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1961-10-03.laos
      when: Oct. 3
      date: '1961-10-03'
      thread: laos
      also:
      - defense
      - berlin-and-vienna
      c: 'Gilpatric, for McNamara, on the Chiefs'' plan: a crisis in Laos and Berlin at once; the air force for Southeast Asia and the nuclear strike capability; the Seventh Fleet''s absence from the rest of the Pacific; the continental reserve. "The President''s decision on the proposed plan may well hinge on the risks of getting into a serious two-front situation." The Chiefs: only intervention can stop the loss of Southeast Asia.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 251. See [[cal.1961-09-29.laos]]. Names: Gilpatric, McNamara.'
      src:
        c: a5a0fccc
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 251: all'
      tags:
      - name:gilpatric-roswell-l
      - name:mcnamara-robert-s
    section: '196110'
- add:
    entry:
      id: cal.1961-10-08.laos
      when: Oct. 8
      date: '1961-10-08'
      thread: laos
      c: The three princes agree on Souvanna as sole candidate for premier; he will try to form a government of national unity. The United States, Britain, France and Australia agree on a plan to regroup, integrate and demobilize the Laotian forces into a new national army.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 251. To check: Battle, Executive Secretary (State), for McGeorge Bundy, Oct. 11, 1961, FRUS 1961–63, XXIV, 463–64 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 251 n.90). Names: Souvanna Phouma.'
      src:
        c: 415d4b1c
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 251: all'
        - 'via x.1961-10-11.battle-executive-secretary-state-for-mcgeorge-bundy: all'
      tags:
      - name:souvanna-phouma
    section: '196110'
- add:
    entry:
      id: cal.1961-10-19.laos
      when: Oct. 19
      date: '1961-10-19'
      thread: laos
      also:
      - defense
      - foreign-aid
      c: 'OSD, at the Chiefs'' request, asks State and AID for $4.5 million more in fiscal 1962: Phoumi''s regular forces from 38,487 to 46,921, the irregulars from 13,800 to 15,400, more officer and NCO training. An ISA official: from 15,000 in 1954 to the 62,000 proposed, "It is obvious that we are not getting results." State and AID refuse, Phoumi misusing what he has.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 252. Craig, of the Joint Staff, after his visit of August and September: Phoumi "the only driving force in Laos," but "we must begin to get tough with him" ([[w.kaplan-mcnamara-ascendancy-1961-1965]], 251–52). To check: William Bundy to U. Alexis Johnson, Oct. 19, 1961, fldr 320.2 Laos 1961, box 36, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 252 n.92). Names: Phoumi Nosavan.'
      src:
        c: 2eeba6d9
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 252: all'
        - 'via x.1961-10-19.william-bundy-to-u-alexis-johnson-oct: all'
      tags:
      - name:phoumi-nosavan
    section: '196110'
- add:
    entry:
      id: cal.1961-12.laos
      when: Dec.
      date: '1961-12'
      thread: laos
      also:
      - foreign-aid
      c: Harriman, Phoumi asking two key seats in Souvanna's government and mounting a new offensive, has the $4 million monthly cash payments to the Laotian government stopped.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 252–53. Names: Harriman, Phoumi Nosavan, Souvanna Phouma.'
      src:
        c: 33b8e85d
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 252–53: all'
      tags:
      - name:harriman-w-averell
      - name:phoumi-nosavan
      - name:souvanna-phouma
    section: '196112'
- add:
    entry:
      id: cal.1962-01-10.laos
      when: Jan. 10
      date: '1962-01-10'
      thread: laos
      c: Boun Oum agrees to meet the other princes; the cash payments resumed.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 253. To check: Memorandum of conversation, Harriman and Winthrop G. Brown, Jan. 18, 1962, fldr 320.2 Laos 1961, box 36, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 253 n.95). See [[cal.1961-12.laos]]. Names: Boun Oum na Champassak.'
      src:
        c: c4dcfed9
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 253: all'
        - 'via x.1962-01-18.memorandum-of-conversation-harriman-and-winthrop-g: all'
      tags:
      - name:boun-oum-na-champassak
    section: '196201'
- add:
    entry:
      id: cal.1962-01.laos-2
      when: Jan.
      date: '1962-01'
      thread: laos
      c: 'Phoumi, against American advice, reinforces Nam Tha, fifteen miles from the Chinese border: 5,000 troops in by the end of January.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 253. Names: Phoumi Nosavan.'
      src:
        c: faddbd2b
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 253: all'
      tags:
      - name:phoumi-nosavan
    section: '196201'
- add:
    entry:
      id: cal.1962-02.laos
      when: Feb.
      date: '1962-02'
      thread: laos
      also:
      - foreign-aid
      c: 'Boun Oum refusing more meetings with the princes, Harriman holds back the money for Phoumi''s troop payroll. The Chiefs ask the MAAG to judge the sanctions; the CIA: operations could go on only 45 days, "the more opportunistic" commanders might go over to the Pathet Lao.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 253. To check: JCSM-110-62, Lemnitzer for SecDef, Feb. 14, 1962, fldr 350.5-680 Laos 1962, box 45, ISA files, Acc 65A-3501 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 253 n.97). Names: Boun Oum na Champassak, Harriman, Phoumi Nosavan.'
      src:
        c: 677e2b79
