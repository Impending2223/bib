      when: Mid-June
      date: '1961-06'
      thread: laos
      also:
      - defense
      c: 'Honolulu. CINCPAC and his British counterpart on SEATO forces to hold key points on the Mekong, freeing Phoumi''s army to retake ground lost since May: rules of engagement for some 13,200 troops, counterguerrilla action to guard the lines of communication.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 247. To check: Rear Adm. Joseph Wellings, Vice Director, Joint Staff, to CINCPAC, 997728, June 17, 1961, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 247 n.71). Check: the day; "just days before" June 19. Names: Phoumi Nosavan.'
