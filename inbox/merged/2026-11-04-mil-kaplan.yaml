      when: June 26
      date: '1961-06-26'
      thread: laos
      also:
      - soviet-union
      c: 'Rostow to Kennedy, Khrushchev''s pattern: "He exerts pressure at some point on our side of the line; by such pressure he creates a situation in which we can only reply at the risk of starting a nuclear war ... we look for compromise; he backs down a little; and a compromise is struck which, on balance, moves his line forward, and shifts us back."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 248–49. To check: WWR (Rostow) for the President, June 26, 1961, fldr Laos, Vol. II, box 130, NSF, JFKL (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 248 n.79). Names: Rostow, Kennedy, Khrushchev.'
