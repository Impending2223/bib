      when: Oct. 23
      date: '1961-10-23'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'NSAM 109, "U.S. Policy on Military Actions in a Berlin Conflict": the four phases of the Poodle Blanket. Probes of platoon strength and fighter escort; then embargo, maritime harassment, the UN, NATO''s mobilization and reinforcement; then a naval blockade or non-nuclear air action and a ground advance of a division or more into East Germany; last, nuclear weapons, selective attacks for demonstration, then tactical use, to general war.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 163. To check: ISA, "Preferred Sequence of Military Actions in a Berlin Conflict," draft, Oct. 12, 1961, fldr 092 Germany (Berlin), 1961 Oct 1-14, box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 163 n.85). See [[cal.1961-10-20.berlin-and-vienna-2]]. Check: the NSAM''s title. Names: Kennedy.'
      src:
        c: 87a4b05a
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 163: all'
        - 'via x.1961-10-12.isa-preferred-sequence-of-military-actions-in: B'
      tags:
      - name:kennedy-john-f
    section: '196110'
