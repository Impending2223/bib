      c: 'The President with Rusk, McNamara, Gilpatric, Nitze, Kohler, Robert Kennedy, Lemnitzer, Acheson and Bundy, 10 a.m., on the State-Defense drafts of policy on military actions in a Berlin conflict and a letter to Norstad; approved as revised. Lemnitzer: LeMay and Anderson with Norstad against a large buildup now, he and Decker with McNamara for one. Acheson, on the allies: "We need to tell them."'
      n: '[FRUS 1961–63, XIV: Berlin Crisis, 1961–1962, doc. 184](https://history.state.gov/historicaldocuments/frus1961-63v14/d184). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 164 (Acheson''s words). Names: Kennedy, Rusk, McNamara, Gilpatric, Nitze, Kohler, Robert Kennedy, Lemnitzer, Acheson, McGeorge Bundy, LeMay, Anderson, Norstad, Decker.'
      src:
        c: 161c37b0
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d184: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 164: C'
      tags:
