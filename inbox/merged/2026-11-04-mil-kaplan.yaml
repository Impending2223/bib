        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 248–49: all'
        - 'via x.1961-06-26.wwr-rostow-for-the-president-june-26: all'
      tags:
      - name:rostow-walt-w
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
    section: '196106'
- add:
    entry:
      id: cal.1961-06-28.laos
      when: June 28
      date: '1961-06-28'
      thread: laos
      c: 'Brown, from Vientiane, against Phoumi''s demand for a guarantee of American military involvement: the risks of backing a failed Phoumi higher than those of Souvanna; intervention would mean preparing "to fight at least a Korean type and perhaps a larger war."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 247–48. To check: Vientiane to State, 2332, June 28, 1961, OSD Hist (summarized in FRUS 1961-63, XXIV, 265 n.2) (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 248 n.73). Names: Brown, Phoumi Nosavan, Souvanna Phouma.'
      src:
        c: d196ae96
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 247–48: all'
