      n: '[FRUS 1961–63, X: Cuba, 1961–1962, doc. 235](https://history.state.gov/historicaldocuments/frus1961-63v10/d235). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 193 (the 18 days; the airborne assault in five to six days). See [[cal.1961-04-29.cuba]]. Names: McNamara.'
