      - name:mcnamara-robert-s
    section: '196402'
- add:
    entry:
      id: cal.1964-02.vietnam-3
      when: Late Feb.
      date: '1964-02'
      thread: vietnam
      also:
      - defense
      c: 'The first DeSoto patrol of 1964, two weeks into early March: the destroyer *Craig* allowed within eight nautical miles of North Vietnam''s mainland.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 519. Check: the days.'
      src:
        c: 99a277d3
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 519: all'
    section: '196402'
- add:
    entry:
      id: cal.1964-02-25.laos
      when: Feb. 25
      date: '1964-02-25'
      thread: laos
      also:
      - vietnam
      c: 'Hilsman sends Rusk a draft memorandum for the President: "the recent Communist advances in central Laos highlight the continuing erosion of the situation in Laos"; an American response needed, to curb the North''s aid to the Viet Cong and to show de Gaulle and Sihanouk the Communists will not take Southeast Asia.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 515. Names: Hilsman, Rusk, de Gaulle, Norodom Sihanouk.'
      src:
        c: 0b1f84e5
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 515: all'
      tags:
      - name:hilsman-roger
      - name:rusk-dean
      - name:de-gaulle-charles
      - name:norodom-sihanouk
    section: '196402'
- add:
    entry:
      id: cal.1964-04-21.vietnam-2
      when: Apr. 21
      date: '1964-04-21'
      thread: vietnam
      also:
      - defense
      c: Lodge directs every agency head on the country team, Harkins among them, to clear any meeting with Khánh with Nes, the deputy chief of mission. Harkins protests, citing the directive of February 1962; Apr. 23, Lodge asks Rusk to settle it.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 511. Names: Lodge, Harkins, Nguyễn Khánh, Rusk.'
      src:
        c: b997d04c
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 511: all'
      tags:
      - name:lodge-henry-cabot
      - name:harkins-paul-d
      - name:nguyen-khanh
      - name:rusk-dean
    section: '196404'
- add:
    entry:
      id: cal.1964-04-25.laos
      when: Apr. 25
      date: '1964-04-25'
      thread: laos
      also:
      - vietnam
      c: 'McNamara to Johnson: "I see only two ways to prevent an expansion of the influence of the Pathet Lao in Laos: either we must support the Geneva Accords or we must be prepared to introduce U.S. forces into that country. Of the two I much prefer the first." Low-level reconnaissance by American aircraft.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 515. Names: McNamara, Johnson.'
      src:
        c: a69c0e20
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 515: all'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
    section: '196404'
- add:
    entry:
      id: cal.1964-04-29.laos
      when: Apr. 29
      date: '1964-04-29'
      thread: laos
      also:
      - intelligence
      c: 'The NSC. The CIA: the Pathet Lao alone a 50-50 chance against the non-Communist forces, able to overrun the country quickly if North Vietnam joined; a partition of Laos possible if Souvanna fell.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 515–16. Names: Souvanna Phouma.'
      src:
        c: c0cc0384
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 515–16: all'
      tags:
      - name:souvanna-phouma
    section: '196404'
- add:
    entry:
      id: cal.1964-05-18.laos-2
      when: May 18
      date: '1964-05-18'
      thread: laos
      also:
      - intelligence
      - defense
      c: McNamara with the Joint Chiefs learns the CIA has run a "trail-watching operation" in Laos for two years, Operation Hardnose, 1,200 people; the DIA did not know of it, by Greene. State wants no publicity, for Souvanna's sake.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 516. Names: McNamara, Greene, Souvanna Phouma.'
      src:
        c: aad7682a
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 516: all'
      tags:
      - name:mcnamara-robert-s
      - name:greene-wallace-m-jr
      - name:souvanna-phouma
    section: '196405'
- add:
    entry:
      id: cal.1964-07-28.vietnam
      when: July 28
      date: '1964-07-28'
      thread: vietnam
      also:
      - defense
      c: The *Maddox* dispatched on the second DeSoto patrol of the year, allowed within eight miles of the shore. The 34A operations, authorized Feb. 1–May 30, extended to September.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 519. See [[cal.1964-08-02.vietnam]].'
      src:
        c: 36d87766
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 519: all'
