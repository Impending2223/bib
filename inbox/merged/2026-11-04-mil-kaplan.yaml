- add:
    entry:
      id: cal.1961-08-10.laos
      when: Aug. 10
      date: '1961-08-10'
      thread: laos
      also:
      - defense
      c: Lemnitzer briefs Kennedy, McNamara, Taylor and others on three plans, two with SEATO forces in Laos; the third, still being drawn, to drive the enemy from southern Laos with the armies of Thailand, South Vietnam and Laos, American forces behind them, South Vietnam thought impossible to save without southern Laos.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 250. To check: Editorial note, FRUS 1961-63, XXIV, 358-59, FRUS 1961–63, XXIV, 358–59 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 250 n.83). Names: Lemnitzer, Kennedy, McNamara, Taylor.'
