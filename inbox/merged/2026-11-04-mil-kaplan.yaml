      when: Jan. 7
      date: '1964-01-07'
      thread: vietnam
      also:
      - intelligence
      c: McCone proposes "developing a new covert method of checking on information on the progress of the war." McNamara, Forrestal notes, finds it hard to accept "that CIA should take on a separate reporting function"; he tells McCone he does not oppose better covert intelligence.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 502. Names: McCone, McNamara, Forrestal.'
