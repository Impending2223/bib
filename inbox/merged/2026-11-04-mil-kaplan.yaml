      date: '1962-03-05'
      thread: defense
      also:
      - vietnam
      c: 'Kennedy with the new special warfare generals, Rosson of the Army''s staff and Krulak of the Joint Staff: counterinsurgency "the most pressing war either at hand or in prospect."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 41. Names: Kennedy, Krulak.'
