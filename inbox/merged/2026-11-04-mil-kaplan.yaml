      when: May 3
      date: '1961-05-03'
      thread: laos
      c: 'Harriman from Saigon, told of a cease-fire in one sector: beware partial cease-fires that let the Pathet Lao consolidate. He had backed Lemnitzer''s doubt of any cease-fire without SEATO forces to hold Phoumi''s ground.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 243. To check: Harriman to State, 1651, May 3, 1961, summarized, FRUS 1961–63, XXIV, 172 n.2 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 243 n.55). See [[cal.1961-05-03.laos]]. Names: Harriman, Lemnitzer, Phoumi Nosavan.'
