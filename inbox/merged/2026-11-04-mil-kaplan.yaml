      when: Oct. 18
      date: '1961-10-18'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'State to Berlin, 553: the White House approves new instructions, Clay''s recommendations considered. If the Friedrichstrasse crossing is closed, by demands for documents or a barrier, two or three tanks to force the barrier and demolish the obstacle, then withdraw at once into the West Sector; a protest to the Soviet commandant; a press statement. British and French concurrence sought.'
      n: '[FRUS 1961–63, XIV: Berlin Crisis, 1961–1962, doc. 180](https://history.state.gov/historicaldocuments/frus1961-63v14/d180). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 163 (the tanks). To check: McNamara for McGeorge Bundy, Oct. 18, 1961, fldr 092 Germany (Berlin), box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 163 n.87). Names: Clay, Rusk.'
      src:
