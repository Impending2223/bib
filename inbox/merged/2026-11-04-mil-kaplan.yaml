      also:
      - congress
      c: 'Clay, home from Berlin, in executive session before Senate Foreign Relations and Armed Services: the British and French at odds with American policy; "at the present moment ... our situation vis-a-vis the East German and Soviet Governments is one of returning to the status which existed prior to the construction of the wall"; no harassment on the autobahn.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 167–68. To check: Senate Foreign Relations Committee, Executive Sessions (Historical Series), XIV, 87th Cong., 2d sess., May 15, 1962, 482-83, published 1986 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 168 n.107). Names: Clay.'
