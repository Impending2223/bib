        c: 94946af6
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 244: all'
        - 'via x.1961-05-09.asd-isa-for-harriman-may-9-1961: all'
      tags:
      - name:nitze-paul
      - name:harriman-w-averell
      - name:souvanna-phouma
    section: '196105'
