      when: Feb. 5
      date: '1964-02-05'
      thread: vietnam
      also:
      - defense
      c: 'Rusk to McNamara on the Chiefs'' JCSM-46-64: agreement with their premises, none with their remedies. The war "must be fought and won primarily in the minds of the Vietnamese people," "essentially political," a fact for the command arrangements.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 505. See [[cal.1964-01-22.vietnam]]. Names: Rusk, McNamara.'
      src:
        c: e37b0105
        rows:
