      date: '1961-06-12'
      thread: laos
      also:
      - europe-and-the-alliance
      c: Geneva. The American and British delegates return to the conference, which they had boycotted after it resumed June 6 in the shadow of Padong's fall. Defense had called Padong "a minor engagement."
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 246–47. See [[cal.1961-06-07.laos]].'
