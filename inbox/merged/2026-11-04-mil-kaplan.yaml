      date: '1961-09-28'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'McNamara in an interview: "we will use nuclear weapons whenever we feel it necessary to protect our vital interests"; "Our nuclear stockpile is several times that of the Soviet Union and we will use either tactical weapons or strategic weapons in whatever quantities wherever, whenever it''s necessary."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 161–62. To check: McNamara Public Statements, 1961, III, 1443, OSD Historical Office (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 162 n.80). Names: McNamara.'
