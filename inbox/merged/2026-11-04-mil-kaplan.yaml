    section: '196503'
- add:
    entry:
      id: cal.1961-02-04.defense
      when: Feb. 4–5
      date: '1961-02-04'
      thread: defense
      c: 'McNamara at SAC''s headquarters, Omaha: alarmed by the rigidity of the Single Integrated Operational Plan and the civilians'' slight control of the strategic forces; the danger of missiles fired by accident or without the White House''s sanction.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 20. Names: McNamara.'
      src:
        c: e85e7370
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 20: all'
      tags:
      - name:mcnamara-robert-s
    section: '196102'
- add:
    entry:
      id: cal.1961-02-23.defense
      when: Feb. 23
      date: '1961-02-23'
      thread: defense
      also:
      - congress
      c: 'McNamara before House Armed Services: his recommendations on missiles, aircraft and ships by the end of the month. Vinson can hardly believe it; three crisp "yes, sir" answers, by Stewart Alsop.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 12. Names: McNamara, Vinson.'
      src:
        c: 69ce9919
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 12: all'
      tags:
      - name:mcnamara-robert-s
      - name:vinson-carl
    section: '196102'
- add:
    entry:
      id: cal.1961-03-17.space
      when: Mar. 17
      date: '1961-03-17'
      thread: space
      also:
      - defense
      - congress
      c: 'Gilpatric before House Science and Astronautics on the space directive of Mar. 6: not referred to the Joint Chiefs; the chiefs'' views presumably in the service secretaries'' comments. White and Schriever, questioned in mid-March, back off any Air Force claim to the whole space program.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 44–45. See [[cal.1961-03-06.space]]. Names: Gilpatric, White, Schriever.'
      src:
        c: 7487666d
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 44–45: all'
      tags:
      - name:gilpatric-roswell-l
      - name:white-thomas-d
      - name:schriever-bernard-a
    section: '196103'
- add:
    entry:
      id: cal.1961-03-18.space
      when: Mar. 18
      date: '1961-03-18'
      thread: space
      also:
      - defense
      - congress
      c: 'White, Air Force Chief of Staff, before a congressional committee: no intention of taking over projects under way; "the Air Force would bend over backward to meet the requirements of the Army and the Navy as prescribed by the directive."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 44. See [[cal.1961-03-06.space]]. Names: White.'
      src:
        c: 41eacfbc
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 44: all'
      tags:
      - name:white-thomas-d
    section: '196103'
- add:
    entry:
      id: cal.1961-04-01.defense
      when: Apr. 1
      date: '1961-04-01'
      thread: defense
      also:
      - space
      c: The Air Force Systems Command begins under Schriever, research, development and procurement together; an Air Force Logistics Command apart; an Office of Aerospace Research.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 44. Names: Schriever.'
      src:
        c: 52e6bb3d
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 44: all'
      tags:
      - name:schriever-bernard-a
    section: '196104'
- add:
    entry:
      id: cal.1961-08-01.defense
      when: Aug. 1
      date: '1961-08-01'
      thread: defense
      also:
      - congress
      c: 'McNamara before a House subcommittee on civil defense in the third amended fiscal 1962 budget: the money chiefly for identifying and marking public shelters, $93 million, and for stocking them; the effort under civilian control, "integrated with all aspects of military defense against thermonuclear" attack. Congress approves $207.6 million Aug. 10; with $49.2 million transferred, $256.8 million in all.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 31. See [[cal.1961-07-20.defense]]. Names: McNamara.'
      src:
        c: 57a955ce
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 31: all'
      tags:
      - name:mcnamara-robert-s
    section: '196108'
- add:
    entry:
      id: cal.1961-09-05.vietnam
      when: Sept. 5
      date: '1961-09-05'
      thread: vietnam
      also:
      - defense
      c: 'McNamara directs that the MAAG in South Vietnam also serve as an experimental command for organizational and operational procedures in the "conduct of sub-limited war." In October, to the President: $100 million a year in Army research funds for five years for "remote area" warfare.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 38–39. Names: McNamara.'
      src:
        c: 60804d1a
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 38–39: all'
      tags:
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1961-10-11.vietnam-2
      when: Oct. 11
      date: '1961-10-11'
      thread: vietnam
      also:
      - defense
      c: 'Kennedy approves sending a detachment of the 4400th Combat Crew Training Squadron to Vietnam "for the initial purpose of training Vietnamese forces": Farm Gate, 155 men and 16 aircraft, arriving November–December.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 39. See [[cal.1961-10-11.vietnam]]. Names: Kennedy.'
      src:
        c: 70d64687
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 39: all'
      tags:
      - name:kennedy-john-f
    section: '196110'
- add:
    entry:
      id: cal.1961-10-12.defense
      when: Oct. 12
      date: '1961-10-12'
      thread: defense
      also:
      - vietnam
      c: 'Kennedy at Fort Bragg, N.C.: the 82d and 101st Airborne Divisions'' demonstrations; the Special Forces Center''s judo, guerrilla and counterinsurgency drills to orders in foreign tongues, Russian and Czech among them; a trooper with a rocket on his back flies some 200 feet.'
      n: Remarks to the 82d Airborne Division at Fort Bragg, North Carolina, [1961 Pub. Papers 669](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=727) (Oct. 12, 1961) (the visit). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 39.
