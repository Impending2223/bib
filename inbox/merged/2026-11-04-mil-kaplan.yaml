- edit:
    id: cal.1963-02-28.europe-and-the-alliance
    base: d1ad19a9
    set:
      also:
      - defense
      - economy
      - cuba
      c: 'Kennedy with the Joint Chiefs on force strengths in Europe: "how much we can reduce our forces in Europe in the next twelve months," a plan by the NATO meeting at Ottawa in May. Wheeler: the Russians might seize Hamburg or Munich. Kennedy: de Gaulle "has money and not much else on his side"; the monetary position to be protected; Europe "probably about eighth on our list of dangers." On the Cuba invasion plan, OPLANs 312 and 316: about 18 days from decision to D-Day from present dispositions, some 7 only with much prepositioning; the Chiefs against moving units now, a period of tension likely to come first. Kennedy: the rules of engagement of November 1960 to be amended; in an incident, pursuit to Cuban airspace, not into it, until Washington decides.'
      n: '[FRUS 1961–63, XIII, doc. 178](https://history.state.gov/historicaldocuments/frus1961-63v13/d178) (Europe); [FRUS 1961–63, XI, doc. 289](https://history.state.gov/historicaldocuments/frus1961-63v11/d289) (the invasion plan); [FRUS 1961–63, XI, doc. 290](https://history.state.gov/historicaldocuments/frus1961-63v11/d290) (the rules of engagement). [[w.gavin-gold-dollars-and-power]], 105–6. [[w.kaplan-mcnamara-ascendancy-1961-1965]], 225 (no need to preposition troops in the Southeast). See [[cal.1963-01-25.europe-and-the-alliance]]. Names: Kennedy, Wheeler, de Gaulle.'
      src:
        c: 6f347c5f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d178: A-E'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d289: F-G'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d290: H-I'
        - 'w.gavin-gold-dollars-and-power 105–6: A-B'
        - 'via w.gavin-gold-dollars-and-power 105 n.54: A'
        - 'via w.gavin-gold-dollars-and-power 106 n.61: B'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 225: G'
