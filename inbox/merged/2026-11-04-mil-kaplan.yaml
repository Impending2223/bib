      - defense
      c: 'McNamara to Kennedy, answering his inquiry of Apr. 29: the invasion plans kept up to date, CINCLANT''s revision approved by the Chiefs Feb. 26; the forces'' order restudied for Castro''s added T-34 tanks and self-propelled antitank guns; 11 LSTs reactivated to land troops and heavy equipment early. Three days from decision to a full air assault, nine more until the combat forces are ashore, 27 in all.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 336](https://history.state.gov/historicaldocuments/frus1961-63v11/d336). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 225 (the times). Names: McNamara, Kennedy, Castro.'
      src:
