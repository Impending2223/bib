      date: '1961-05-09'
      thread: laos
      also:
      - defense
      c: 'Nitze, heading Defense''s part of the delegation to Geneva, to Harriman: no "tripartite" Laotian representation separating Souvanna from the Pathet Lao, which would give the Communists two to one; no complete neutralization or demilitarization of Laos.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 244. To check: ASD(ISA) for Harriman, May 9, 1961, fldr 092 Laos 1961, box 36, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 244 n.60). Names: Nitze, Harriman, Souvanna Phouma.'
