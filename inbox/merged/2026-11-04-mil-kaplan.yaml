      - immigration
      c: Within three weeks of the President's directive of May 5, Defense presents a plan to induct up to 2,000 Cubans aged 18 to 26, "with the clear understanding that they are not being prepared as a combat force"; at first only English speakers, aliens enlisted under the Selective Service law's exception. McNamara wants it carried out "as quickly as possible."
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 197. July 29, 1961–Mar. 31, 1962: 898 Cubans processed at the Miami examining station, 124 qualified ([[w.kaplan-mcnamara-ascendancy-1961-1965]], 197). To check: Yarmolinsky for the service secretaries et al., May 26, 1961, with proposed plan, fldr Cuba 092 Jan 62, box 44, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 197 n.5). See [[cal.1961-05-05.cuba]]. Check: the day. Names: McNamara.'
      src:
        c: 67c57de8
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 197: all'
        - 'via x.1961-05-26.yarmolinsky-for-the-service-secretaries-et-al: all'
        - 'via x.1962-04-13.roy-k-davenport-army-special-assistant-for: A'
      tags:
      - name:mcnamara-robert-s
    section: '196105'
- add:
    entry:
      id: cal.1962-01.cuba-3
      when: Jan.
      date: '1962-01'
      thread: cuba
      also:
      - defense
      c: 'McNamara, dissatisfied, wants OPLAN 314-61''s reaction time cut from 18 days to 4 and OPLAN 316-61''s 5 to 2. The Chiefs produce OPLAN 312-62, an air strike on two days'' notice, apart from both and perhaps their first step: an attack carrier, a destroyer squadron, two Marine air groups and 17 Air Force fighter squadrons.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 200. See [[cal.1961-05-01.cuba-4]]; [[cal.1962-02-07.cuba]]. Names: McNamara.'
      src:
        c: 1ba42808
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 200: all'
      tags:
      - name:mcnamara-robert-s
    section: '196201'
- add:
    entry:
      id: cal.1962-08-30.missile-crisis-3
      when: Aug. 30
      date: '1962-08-30'
      thread: missile-crisis
      also:
      - europe-and-the-alliance
      c: 'State to the embassies in Europe, 1205 to London: since late July at least 26 Soviet ship arrivals in Cuba and some 5,500 passengers, at least 1,500 of them economic technicians; transportation, electronic and construction equipment, cranes, trailers and fuel tanks; probably a sophisticated communications and radar net, possibly surface-to-air missile sites; no bloc combat units.'
      n: '[FRUS 1961–63, X: Cuba, 1961–1962, doc. 396](https://history.state.gov/historicaldocuments/frus1961-63v10/d396). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 201 (the equipment; the surface-to-air missiles). See [[cal.1962-08-29.missile-crisis]].'
      src:
        c: 916bd54d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d396: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 201: B-C'
    section: '196208'
- add:
    entry:
      id: cal.1962-09-01.missile-crisis
      when: Sept. 1
      date: '1962-09-01'
      thread: missile-crisis
      also:
      - defense
      c: 'Gilpatric to Kennedy, with the Joint Staff''s answers to his questions on Cuba: Cuba''s offensive and defensive capability up; the present contingency plans and forces can meet the new threat, with risks not there six weeks before; MiGs could strike as far north as Tampa, farther one way.'
      n: '[FRUS 1961–63, X: Cuba, 1961–1962, doc. 403](https://history.state.gov/historicaldocuments/frus1961-63v10/d403). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 201–2 (the MiGs). Names: Gilpatric, Kennedy.'
      src:
        c: 4c927342
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d403: A-B'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 201–2: all'
      tags:
      - name:gilpatric-roswell-l
      - name:kennedy-john-f
    section: '196209'
- add:
    entry:
      id: cal.1962-09-07.cuba-2
      when: Sept. 7
      date: '1962-09-07'
      thread: cuba
      also:
      - defense
      c: 'Kennedy to McNamara: how many Cubans joined the forces under last year''s program, how many applied and were refused; his and the Chiefs'' view of a Cuban brigade, Cubans enlisted six to nine months, with a promise that the brigade would be used if the need arose, the physical standards to be eased.'
      n: '[FRUS 1961–63, X: Cuba, 1961–1962, doc. 418](https://history.state.gov/historicaldocuments/frus1961-63v10/d418). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 197, 203. Reply: [[cal.1962-09-13.cuba]]. Names: Kennedy, McNamara.'
      src:
        c: 0d3140d5
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d418: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 197: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 203: all'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-robert-s
    section: '196209'
- add:
    entry:
      id: cal.1962-09-12.missile-crisis
      when: Sept. 12
      date: '1962-09-12'
      thread: missile-crisis
      also:
      - defense
      c: 'CINCLANT to the Joint Chiefs: "an estimated 3,500 bloc military advisors and technicians engaged in military construction, training and operating newly acquired military equipment" in Cuba. The same day an agent sees a large convoy with long trailers heading west from Havana.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 202. To check: CINCLANT to JCS, R122322Z Sept. 1962, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 202 n.30).'
