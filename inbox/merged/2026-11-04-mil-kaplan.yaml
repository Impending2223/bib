      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 381. See [[cal.1962-11-08.europe-and-the-alliance]]. Check: the Nov. 23 meeting is cal.1962-11-24.defense''s week; not checked. Names: Taylor, McNamara.'
