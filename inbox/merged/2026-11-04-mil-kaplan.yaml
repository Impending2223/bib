      thread: europe-and-the-alliance
      also:
      - berlin-and-vienna
      c: 'Paris. The North Atlantic Council''s communiqué: contacts with the Soviet Union to be resumed toward a negotiated settlement on Berlin. Stikker: the Council "came as near in my memory it has ever come to a public breakdown over a major issue."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 167. See [[cal.1961-12-12.berlin-and-vienna]].'
