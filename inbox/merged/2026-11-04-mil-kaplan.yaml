      when: June 19
      date: '1961-06-19'
      thread: laos
      c: Zurich. The three princes, Boun Oum, Souvanna and Souphanouvong, meet; within four days an agreement on a coalition government and a neutral Laos outside any alliance, SEATO included.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 247. Check: the day of the agreement. Names: Boun Oum na Champassak, Souvanna Phouma, Souphanouvong.'
