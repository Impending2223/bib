      also:
      - defense
      c: 'McNamara with Kennedy, Rusk, Bundy and Nitze on Skybolt, Thorneycroft having cited British press reports that production was about to begin. Cancellation "would create a very grave problem for the British Government—might even bring it down"; advance warning and "a chance to come up with something by way of an adequate substitute"; McNamara and Bundy: probably Polaris in the end.'
