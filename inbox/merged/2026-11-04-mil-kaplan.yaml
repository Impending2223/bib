    entry:
      id: cal.1961-01-26.berlin-and-vienna
      when: Jan. 26
      date: '1961-01-26'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'The Joint Chiefs to McNamara on Berlin, at OSD''s request after State''s checklist of Oct. 7, 1960: public relations and economic measures, for unilateral or tripartite use; a tripartite military exercise to "demonstrate determination to maintain U.S. legal rights in Berlin."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 146. To check: JCSM-33-61, Lemnitzer for SecDef, Jan. 26, 1961, fldr 381 Germany 1960, box 20, SecDef Subject Decimal files, Acc 64A-2093 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 146 n.15). Names: McNamara.'
      src:
        c: 7cf39dde
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 146: all'
        - 'via x.1961-01-26.jcsm-33-61-lemnitzer-for-secdef-jan: all'
      tags:
      - name:mcnamara-robert-s
    section: '196101'
- add:
    entry:
      id: cal.1961-02-10.berlin-and-vienna
      when: Feb. 10
      date: '1961-02-10'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'Nitze forwards the Chiefs'' Berlin recommendations to Rusk: the military exercise not "at this time"; a tripartite operations staff under Norstad, beside the planning staff of LIVE OAK.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 146. To check: Nitze to the Secretary of State, Feb. 10, 1961, fldr 381 Germany 1960, box 20, SecDef Subject Decimal files, Acc 64A-2093 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 146 n.15). See [[cal.1961-01-26.berlin-and-vienna]]. Names: Nitze, Rusk, Norstad.'
      src:
        c: 6f458ae2
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 146: all'
        - 'via x.1961-02-10.nitze-to-the-secretary-of-state-feb: all'
      tags:
      - name:nitze-paul
      - name:rusk-dean
      - name:norstad-lauris
    section: '196102'
- cite:
