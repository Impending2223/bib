- add:
    entry:
      id: cal.1961-08-14.berlin-and-vienna-2
      when: Aug. 14
      date: '1961-08-14'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'McNamara to an interviewer, the day after the wall: "Western determination to defend the freedom of Berlin and to defend the Allied rights in Berlin," to build up military power; the move to "blockade East Berliners" unrelated to any American action, a violation of the treaties, a strong protest to come.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 158. To check: McNamara Public Statements, 1961, III, 1103-04, OSD Historical Office (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 158 n.64). Names: McNamara.'
      src:
        c: d4a92a80
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 158: all'
        - 'via x.1961-08-14.mcnamara-public-statements-1961-iii-1103-04: all'
      tags:
      - name:mcnamara-robert-s
    section: '196108'
- add:
    entry:
      id: cal.1961-08-17.defense
      when: Aug. 17
      date: '1961-08-17'
      thread: defense
      also:
      - berlin-and-vienna
      c: Department of Defense Appropriation Act, 1962, signed, [75 Stat. 365](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg365.pdf).
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 154 (signed a week after its passage, Aug. 10). See [[cal.1961-08-10.defense]].'
      src:
        c: 2ef8816f
        rows:
        - 'https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg365.pdf: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 154: all'
      tags:
