      date: '1963-01-19'
      thread: vietnam
      also:
      - vietnam-force-levels
      c: 'MACV sends CINCPAC the Comprehensive Plan for South Vietnam; CINCPAC endorses it to the Joint Chiefs. Within three years the Vietnamese to defend themselves, American military assistance withdrawn: out by the end of 1965.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 281.'
