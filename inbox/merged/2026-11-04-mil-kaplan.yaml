      c: 'McNamara to Kennedy on Murphy''s *Fortune* article: "shocked by the general impression left by the story." "At no time during the planning was I aware of any such assumption" of American military help; the Cubans told it would not come. "The operation failed because you acted on faulty advice from your advisors, particularly the representatives of CIA and DOD, including myself."'
