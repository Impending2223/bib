    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 282 (the team; its appraisal later in January: "victory is now a hopeful prospect")'
    units: A
- add:
    entry:
      id: cal.1963-02.vietnam-2
      when: Early Feb.
      date: '1963-02'
      thread: vietnam
      also:
      - defense
      c: 'CINCPAC and the Joint Chiefs recommend more Vietnamese paramilitary forces for fiscal 1963: the Civil Guard from 81,000 to 86,000, the Self Defense Corps from 80,000 to 104,000; William Bundy for McNamara''s approval. A helicopter company and a maintenance unit approved.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 283. Check: the day. Names: William Bundy, McNamara.'
      src:
        c: e729cc40
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 283: all'
      tags:
      - name:bundy-william
      - name:mcnamara-robert-s
    section: '196302'
- add:
    entry:
      id: cal.1963-02.vietnam-3
      when: Feb.
      date: '1963-02'
      thread: vietnam
      also:
      - defense
      c: 'William Bundy''s staff to the Joint Chiefs: the Geneva agreement allows weapon replacements in Vietnam not allowed in Cambodia; so jet aircraft for the Vietnamese air force, six funded in fiscal 1962 and deferred.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 283. By the end of April not worth challenging the control commission; Hilsman: "We don''t want to rock the tippy ICC boat more than we have to"; Bundy and McNamara agree in May ([[w.kaplan-mcnamara-ascendancy-1961-1965]], 284). Check: the day. Names: William Bundy.'
      src:
        c: 75e3e71e
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 283: all'
      tags:
      - name:bundy-william
    section: '196302'
