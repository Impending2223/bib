    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 153 (Rusk citing the report''s "need for keeping early steps in a low key"; McNamara against a declaration of national emergency now)'
    units: A
- add:
    entry:
      id: cal.1961-07-14.berlin-and-vienna-3
      when: July 14
      date: '1961-07-14'
      thread: berlin-and-vienna
      also:
      - defense
      c: McNamara asks the Joint Chiefs for a timetable for deploying reinforcements without a national emergency. Their answer costed at $4.3 billion.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 153. To check: McNamara for the CJCS, July 14, 1961, fldr Reading File, box 113, McNamara Records, RG 200 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 153 n.44). Names: McNamara.'
      src:
        c: 2ad94e31
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 153: all'
        - 'via x.1961-07-14.mcnamara-for-the-cjcs-july-14-1961: all'
      tags:
      - name:mcnamara-robert-s
    section: '196107'
- add:
    entry:
      id: cal.1961-07-17.berlin-and-vienna-2
      when: July 17
      date: '1961-07-17'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'The President with Rusk, McNamara, Dillon, Robert Kennedy, Taylor, Sorensen and Bundy on Berlin. Rusk: begin on a low key; State would concur in $4.3 billion more and a call of Guard and Reserve units if needed. McNamara: no declaration of national emergency before Sept. 1 or Oct. 1. The dominant judgment for $3 billion now, the reserves'' money after they are called; McNamara the other way.'
      n: '[FRUS 1961–63, XIV: Berlin Crisis, 1961–1962, doc. 72](https://history.state.gov/historicaldocuments/frus1961-63v14/d72). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 153 (the Chiefs'' $4.3 billion yielding to a decision of $3.2 billion). See [[cal.1961-07-13.berlin-and-vienna]]. Names: Kennedy, Rusk, McNamara, Dillon, Robert Kennedy, Taylor, Sorensen, McGeorge Bundy.'
      src:
        c: a0484ed3
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d72: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 153: D'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:dillon-c-douglas
      - name:kennedy-robert-f
      - name:taylor-maxwell
      - name:sorensen-theodore-c
      - name:bundy-mcgeorge
    section: '196107'
- cite:
    id: cal.1961-07-19.berlin-and-vienna
    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 153 (the declaration of national emergency "allowed to die a quiet death"; Acheson agreeing to McNamara''s flexible timetable)'
    units: A, E
- add:
    entry:
      id: cal.1961-07-23.berlin-and-vienna
      when: July 23
      date: '1961-07-23'
      thread: berlin-and-vienna
      also:
      - defense
      - europe-and-the-alliance
      c: McNamara with Norstad. Norstad cannot envisage NATO waging "non-nuclear war and, at the same time protect the nuclear storage sites and NATO's nuclear capabilities"; against turning NATO's nuclear-capable aircraft to non-nuclear use.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 155. To check: McNamara for the CJCS, Aug. 9, 1961, fldr 092 Germany (Berlin) Jul 61, box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 155 n.55); Nitze to John Ausland, Apr. 24, 1984, Nitze Papers, LC (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 155 n.55). Names: McNamara, Norstad.'
      src:
        c: 0282722f
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 155: all'
        - 'via x.1961-08-09.mcnamara-for-the-cjcs-aug-9-1961: all'
        - 'via x.1984-04-24.nitze-to-john-ausland-apr-24-1984: all'
      tags:
      - name:mcnamara-robert-s
      - name:norstad-lauris
    section: '196107'
- add:
    entry:
      id: cal.1961-07-24.berlin-and-vienna-2
      when: July 24
      date: '1961-07-24'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'NSAM 62, after the NSC of July 19. A prompt strengthening of the forces: every step, without a present call of major reserve or Guard ground units, to make it possible to deploy as many as six more divisions and supporting air units to Europe any time after Jan. 1, 1962; Congress to be asked for $3.2 billion more, without a declaration of national emergency.'
      n: '[FRUS 1961–63, XIV: Berlin Crisis, 1961–1962, doc. 80](https://history.state.gov/historicaldocuments/frus1961-63v14/d80). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 153 (the six divisions after Jan. 1, 1962). See [[cal.1961-07-19.berlin-and-vienna]].'
      src:
        c: f1df059d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d80: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 153: B'
      tags:
      - name:kennedy-john-f
    section: '196107'
- add:
    entry:
      id: cal.1961-07-26.berlin-and-vienna-3
      when: July 26
      date: '1961-07-26'
      thread: berlin-and-vienna
      also:
      - defense
      - congress
      c: The administration asks Congress for authority to order Ready Reserve units and individual reservists to active duty for a year, and to extend tours of duty.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 154. Reply: [[cal.1961-08-01.berlin-and-vienna]].'
      src:
        c: af11e8d9
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 154: all'
    section: '196107'
- cite:
    id: cal.1961-07-26.berlin-and-vienna
    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 154 (the visit of July 26–27; "preliminary war")'
