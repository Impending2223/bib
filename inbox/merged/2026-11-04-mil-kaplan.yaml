      when: Dec. 8
      date: '1961-12-08'
      thread: defense
      also:
      - vietnam
      c: The NSC's Counter-Guerrilla Warfare Task Force reports on the "magnitude and urgency" of indirect Communist aggression.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 36. Check: the report''s terms, from the note.'
      src:
        c: 4ccc232d
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 36: all'
