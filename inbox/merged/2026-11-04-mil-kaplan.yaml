      when: June 29
      date: '1961-06-29'
      thread: laos
      also:
      - defense
      c: 'Phoumi in Washington: separately with the Joint Chiefs, McNamara, Rusk and the President. Encouraged that the United States stands behind the royal government, without military intervention; Nitze, after him, advises McNamara to pursue a coalition under a reformed Souvanna.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 248. Names: Phoumi Nosavan, McNamara, Rusk, Kennedy, Nitze, Souvanna Phouma.'
