      c: 'Kennedy to Luce, after Luce''s meeting with Taylor in New York, Murphy there and regretful: no public correction of the *Fortune* article. "I have felt from the beginning that it would not be in the public interest for the United States to take formal responsibility for the Cuban matter other than the personal responsibility which I have earlier assumed. ... I would prefer that we let the matter lie as it is."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 191. To check: The President to Luce, Sept. 12, 1961, Taylor Papers, NDUL (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 191 n.73); Memorandum for the record, Col. Julian J. Ewell, Executive Assistant to Taylor, Sept. 14, 1961, Taylor Papers, NDUL (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 191 n.72). See [[cal.1961-08-30.cuba-bay-of-pigs]]. Names: Kennedy, Taylor.'
