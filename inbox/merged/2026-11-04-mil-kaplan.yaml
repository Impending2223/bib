- add:
    entry:
      id: cal.1961-05-04.berlin-and-vienna
      when: May 4
      date: '1961-05-04'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'The Joint Chiefs'' third report on Berlin, on Acheson''s recommendations: "a realistic analysis of a complex politico-military problem"; his division-size probe to a later stage, a battalion first; ground access to be restored before an airlift; Berlin indefensible against Soviet ground forces, general war perhaps preferable to a conventional conflict. Their two reports of April: no fault in the unilateral plans, "important deficiencies" in the tripartite.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 148–49. To check: JCSM-237-61, Lemnitzer for SecDef, Apr. 13, 1961, fldr 310.1 (Proj 87), box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 149 n.22); JCSM-287-61, Burke for the JCS for SecDef, Apr. 28, 1961, fldr 092 Germany (Berlin) Jan-May 61, box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 149 n.22). See [[cal.1961-04-04.berlin-and-vienna]]. Check: the day; the note cites JCSM-237-61 of Apr. 13 and JCSM-287-61 of Apr. 28, none of May 4. Names: Acheson.'
      src:
        c: 66fc64d1
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 148–49: all'
        - 'via x.1961-04-13.lemnitzer-to-dennison-apr-13-1961: B'
        - 'via x.1961-04-28.jcsm-287-61-burke-for-the-jcs: B'
      tags:
      - name:acheson-dean-g
    section: '196105'
- cite:
