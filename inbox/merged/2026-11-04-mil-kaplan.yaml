      - europe-and-the-alliance
      c: 'McNamara''s home, 7 p.m., after dinner, Gilpatric and Nitze there. McNamara reads Strauss OSD''s paper "NATO Military Policy in the Berlin Crisis": American nuclear preponderance enough to deter. Nitze: given their "general war inferiority," the Russians could rationally only restore access. Strauss favorable; then the uses of nuclear weapons.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 162. To check: [Nitze] memorandum of conversation, McNamara, Gilpatric, Nitze, Strauss, at McNamara''s home, 7 p.m., Nov. 26, 1961, fldr 092 Germany (Berlin), Jul-Dec 61, box 52, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 162 n.82); Gilpatric to Rusk, Nov. 21, 1961, with JCSM-799-61 of Nov. 15 and the ISA paper "NATO Military Policy in the Berlin Crisis", fldr 092 Germany (Berlin), Jul-Dec 61, box 52, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 162 n.81). Names: McNamara, Gilpatric, Nitze, Strauss.'
