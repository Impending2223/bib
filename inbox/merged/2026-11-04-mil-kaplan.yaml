      when: Mar. 11
      date: '1965-03-11'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'McNamara to House Foreign Affairs: "two paramount reasons why we must succeed." A Communist victory "would immediately open the way for further adventures by the Hanoi regime, and by China"; "it is vital that the United States prove to the world that the form of aggression being tested in South Vietnam is not the ''wave of the future.''"'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 533. Names: McNamara.'
      src:
        c: a5cf73ce
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 533: all'
      tags:
