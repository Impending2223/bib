      id: cal.1961-08-18.berlin-and-vienna
      when: Aug. 18
      date: '1961-08-18'
      thread: berlin-and-vienna
      also:
      - defense
      c: McNamara asks the services what they can do to advance the deployment of up to six divisions and their air units from Jan. 1, 1962, to Nov. 15, 1961. He had opposed the convoy decision of Aug. 17.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 160. To check: McNamara for the service secretaries, Aug. 18, 1961, fldr Reading File, box 113, McNamara Records, RG 200 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 160 n.74). See [[cal.1961-07-24.berlin-and-vienna-2]]. Names: McNamara.'
      src:
        c: 2c0aaa1f
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 160: all'
        - 'via x.1961-08-18.mcnamara-for-the-service-secretaries-aug-18: all'
      tags:
      - name:mcnamara-robert-s
    section: '196108'
- add:
    entry:
      id: cal.1961-08-24.berlin-and-vienna-3
      when: Aug. 24
      date: '1961-08-24'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'McNamara lists for Kennedy the Army, Navy and Air Force reserve units to be called to active duty: over 76,500 men. Preparation for reinforcing Europe, not yet a commitment.'
