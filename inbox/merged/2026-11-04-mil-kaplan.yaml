    entry:
      id: cal.1961-06.laos-2
      when: June
      date: '1961-06'
      thread: laos
      also:
      - vietnam
      - congress
      c: 'McNamara to Senate Foreign Relations in executive session: 2,860 armed North Vietnamese agents infiltrated into South Vietnam through Laos in the last four months; some 12,000 active there.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 249. To check: Senate Foreign Relations Committee, Executive Sessions (Historical Series), XIII, pt. 2, 87th Cong., 1st sess., 1961, 115, Executive Sessions (Historical Series), XIII, pt. 2, 115 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 249 n.81). Check: the day. Names: McNamara.'
