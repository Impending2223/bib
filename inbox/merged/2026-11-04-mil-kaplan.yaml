      when: Oct. 10
      date: '1961-10-10'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'The President with Rusk, McNamara, Gilpatric, Lemnitzer, Taylor and Bundy, 11 p.m., on the Berlin buildup. Approved, on McNamara''s recommendation: eleven Air National Guard squadrons and a tactical control group to Europe from Nov. 1; seven Tactical Air Command squadrons home; the equipment of an armored and an infantry division prepositioned in Europe; battle groups of the 4th Infantry Division rotated through Europe, two always there; the 3rd Armored Cavalry Regiment to Europe.'
      n: '[FRUS 1961–63, XIV: Berlin Crisis, 1961–1962, doc. 173](https://history.state.gov/historicaldocuments/frus1961-63v14/d173). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 164 (the measures). Norstad, Oct. 23: about 24 combat divisions in the center by the year''s end, against the rough equivalent of 16 ([[w.kaplan-mcnamara-ascendancy-1961-1965]], 164). To check: McNamara for the President, Oct. 10, 1961, fldr Reading File, box 113, McNamara Records, RG 200 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 164 n.91); Polto 28, Finletter (Paris) to State, Oct. 23, 1961, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 164 n.91). See [[cal.1961-09.berlin-and-vienna-3]]. Names: Kennedy, Rusk, McNamara, Gilpatric, Lemnitzer, Taylor, McGeorge Bundy.'
      src:
        c: 68f1db3d
        rows:
