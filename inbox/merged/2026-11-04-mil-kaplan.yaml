      id: cal.1961-08-02.berlin-and-vienna-2
      when: Aug. 2
      date: '1961-08-02'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'McNamara to Stahr, Secretary of the Army: the plans for two more divisions to Europe tentative; their supplies and equipment to be shipped ahead; the divisions part of the normal rotation unless the Berlin situation worsens.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 155. Army personnel in Europe up negligibly in August; 3,000 earmarked for three divisions there; reinforcements on a contingency basis ([[w.kaplan-mcnamara-ascendancy-1961-1965]], 154–55). To check: McNamara for the Secretary of the Army (Stahr), Aug. 2, 1961, fldr Reading File, box 113, McNamara Records, RG 200 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 155 n.52). See [[cal.1961-07-24.berlin-and-vienna-2]]. Names: McNamara, Stahr.'
      src:
        c: 81bb24ba
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 155: all'
        - 'via x.1961-08-02.mcnamara-for-the-secretary-of-the-army: all'
      tags:
      - name:mcnamara-robert-s
      - name:stahr-elvis-j-jr
    section: '196108'
