      when: Apr. 20
      date: '1963-04-20'
      thread: vietnam
      also:
      - defense
      - vietnam-force-levels
      c: 'William Bundy to McNamara: no approval of the Comprehensive Plan''s military assistance until its review at Honolulu, May 6; ISA against the large rise for fiscal 1964. McNamara waits for charts of the American and Vietnamese forces to judge the withdrawal.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 284. See [[cal.1963-01-19.vietnam]]. Names: William Bundy, McNamara.'
      src:
        c: ac88c8f0
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 284: all'
      tags:
      - name:bundy-william
      - name:mcnamara-robert-s
