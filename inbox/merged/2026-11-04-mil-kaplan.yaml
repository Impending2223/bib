      thread: europe-and-the-alliance
      also:
      - defense
      c: 'McNamara to Ormsby Gore: Skybolt''s procurement estimates up from $1.4 billion to over $1.75 billion; "the worth of the weapon" being reconsidered, the Chiefs asked. Nov. 9, by telephone to Thorneycroft: alternatives, to be discussed in London after Nov. 23; Thorneycroft to study the V-bombers without Skybolt.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 380–81. See [[cal.1962-11-07.europe-and-the-alliance]]. Names: McNamara, Ormsby-Gore, Thorneycroft.'
