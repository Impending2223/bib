      when: May 6
      date: '1963-05-06'
      thread: defense
      c: Kennedy extends LeMay's term by one year, not the customary two, and announces that Anderson will be replaced as Chief of Naval Operations. Gilpatric and Korth see key members of Congress hours before.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 48. Names: Kennedy, LeMay, Anderson, Gilpatric, Korth.'
