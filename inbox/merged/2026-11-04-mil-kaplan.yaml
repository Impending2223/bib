      when: Aug. 10
      date: '1961-08-10'
      thread: defense
      also:
      - berlin-and-vienna
      - congress
      c: Congress completes the fiscal 1962 Defense appropriation, the budget three times amended.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 154.'
      src:
        c: f2394d21
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 154: all'
