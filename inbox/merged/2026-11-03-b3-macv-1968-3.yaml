      when: Mar. 15
      date: '1968-03-15'
      thread: vietnam
      c: 'Westmoreland to Sharp: Thiệu has ordered 100,000 to 125,000 men made available to the South Vietnamese forces in
        the next six months, a net increase of some 60,000, a faster build-up than planned.'
      n: '[[w.macv-command-history-1968]], 252. To check: COMUSMACV to CINCPAC, 150106Z Mar 68, "RVNAF Force Levels" (cited
        by [[w.macv-command-history-1968]], 252 n.53). Names: Westmoreland, Sharp, Nguyễn Văn Thiệu.'
