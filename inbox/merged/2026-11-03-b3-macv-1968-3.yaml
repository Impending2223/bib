      date: '1968-12-16'
      thread: vietnam-prisoners
      c: The *Duluth* carries seven North Vietnamese civilian seamen and a provisioned junk from Đà Nẵng to thirteen miles
        off Cửa Sót, where they are released; the ICRC had found all seven wanting to go home, Dec. 9.
      n: '[[w.macv-command-history-1968]], 857.'
