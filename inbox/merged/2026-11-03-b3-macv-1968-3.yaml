- add:
    entry:
      id: cal.1968-07-23.china
      when: July 23
      date: '1968-07-23'
      thread: china
      also:
      - vietnam
      c: Peking. Lê Thanh Nghị signs for Hanoi and the NLF an agreement on China's economic, technical and military aid for
        1969, as grants, in the presence of Zhou Enlai and Chen Yi. No word of clearing arrangements or long-term loans.
      n: '[[w.macv-command-history-1968]], 54; An eastern European ambassador in Hanoi: the aid no higher than before, perhaps
        less. The French: hard negotiations, the delegation back to Hanoi more than once in a fortnight in China ("Aug 9-24,"
        as printed) (54). Check: the History''s "Aug 9-24" against the signing of July 23. To check: AMEMB PARIS to SECSTATE,
        021054Z Aug 68, "CHICOM-DRV Agreement" (cited by [[w.macv-command-history-1968]], 54 n.38). Names: Zhou Enlai, Chen
        Yi.'
      src:
        c: 2f41ea57
        rows:
        - 'w.macv-command-history-1968 54: all'
        - 'via w.macv-command-history-1968 54 n.38: all'
      tags:
