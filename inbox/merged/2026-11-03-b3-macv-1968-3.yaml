      date: '1968-01-30'
      thread: vietnam-air-war
      also:
      - laos
      c: 'Forty-five B-52s, the largest strike of the war to date, on a command and control complex in eastern Laos near the
        DMZ: 85 secondary explosions; the next morning, cave-ins on the valley floor.'
      n: '[[w.macv-command-history-1968]], 420; Perhaps the strike on the cave headquarters Westmoreland tells of (see [[cal.1968-01.vietnam-khe-sanh]]);
