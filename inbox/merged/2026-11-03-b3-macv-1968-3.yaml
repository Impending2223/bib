      when: June 24
      date: '1968-06-24'
      thread: vietnam
      also:
      - soviet-union
      c: A North Vietnamese delegation under Lê Thanh Nghị arrives in Moscow to open talks on Soviet military and economic
        aid for 1969, from East Germany, after a tour of eastern Europe collecting pledges for 1969.
      n: '[[w.macv-command-history-1968]], 51; Soviet aid for 1968 estimated at $1 billion, the Soviet investment in North
        Vietnam at more than $4 billion by the year''s end (51). To check: New York Times, 25 Jun 68 (cited by [[w.macv-command-history-1968]],
        51 n.27).'
