    entry:
      id: cal.1968-04-24.vietnam
      when: Apr. 24
      date: '1968-04-24'
      thread: vietnam
      c: MACV's report to CINCPAC on the critical modernization equipment for the South Vietnamese forces of fiscal 1968,
        the first increment of the Joint Chiefs' plan; CINCPAC concurs Apr. 26. The plan carried to 1973, the navy and air
        force growing last.
      n: '[[w.macv-command-history-1968]], 255; The second and third increments to CINCPAC May 3; CINCPAC recommends the fiscal
        1969 portion of the optimum force structure May 8 (255). To check: COMUSMACV to CINCPAC, 240205Z Apr 68, "RVNAF Improvement
        and Modernization" (cited by [[w.macv-command-history-1968]], 255 n.57). See [[cal.1968-04-16.vietnam]].'
      src:
