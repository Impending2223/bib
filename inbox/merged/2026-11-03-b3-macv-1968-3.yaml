patch: b3-macv-1968-3
by: Claude (b3-macv reading agent, third run, Nov. 4, 2026), from MACV's Command History, 1968
ops:
- add:
    entry:
      id: cal.1968-07-20.vietnam
      when: July 20
      date: '1968-07-20'
      thread: vietnam
      c: 'Hồ Chí Minh''s appeal on the 14th anniversary of the Geneva Accords: the war "into a new period," American troops
        "at the end of their tether"; an end to the bombing and the withdrawal of American and allied troops demanded. No
        call for "total victory"; neither the Four nor the Five Points cited.'
      n: '[[w.macv-command-history-1968]], 40–41; MACV''s reading: less exhortative than Hồ''s appeal of 1966, fitted to "fighting
        while negotiating." To check: SECSTATE to AMEMB PARIS, 230158Z Jul 68, "Another Ho Chi Minh Appeal" (cited by [[w.macv-command-history-1968]],
        41 n.7); AMEMB SAIGON to SECSTATE, 11 Nov 68, "Mission Weekly (the copy reads "Million Weekly")" (cited by [[w.macv-command-history-1968]],
        41 n.7). Names: Hồ Chí Minh.'
      src:
        c: 0ccd5519
        rows:
        - 'w.macv-command-history-1968 40–41: all'
        - 'via w.macv-command-history-1968 41 n.7: all'
      tags:
      - name:ho-chi-minh
    section: '196807'
- add:
    entry:
      id: cal.1968-09.vietnam
      when: Sept.
      date: 1968-09
      thread: vietnam
      also:
      - vietnam-paris
      c: 'Phạm Văn Đồng''s National Day speech: Hanoi fighting on three fronts, military, political and diplomatic; a halt
        to the bombing would have "a positive effect" toward a settlement; beyond it the United States must withdraw its own
        and the "satellite" troops, recognize the NLF and talk with it. The Four Points not called "the basis for a correct
        political settlement," as in 1967; the Soviet Union and China not named.'
      n: '[[w.macv-command-history-1968]], 41–44. Check: the day (the History: "Annual National Day speech"; the State cable
        on it, Sept. 7). To check: SECSTATE to AMEMB PARIS, 070006Z Sep 68, "INTL Note: North Vietnam Premier Speaks on National
        Day" (cited by [[w.macv-command-history-1968]], 44 n.8). Names: Phạm Văn Đồng.'
      src:
        c: 7398321a
        rows:
        - 'w.macv-command-history-1968 41–44: all'
        - 'via w.macv-command-history-1968 44 n.8: all'
      tags:
      - name:pham-van-dong
    section: '196809'
- add:
    entry:
      id: cal.1968-07-17.vietnam-paris
      when: July 17
      date: '1968-07-17'
      thread: vietnam-paris
      c: 'Xuân Thủy in Paris: "world opinion" demands recognition of the NLF.'
      n: '[[w.macv-command-history-1968]], 43–44. To check: SECSTATE to AMEMB PARIS, 070006Z Sep 68, "INTL Note: North Vietnam
        Premier Speaks on National Day" (cited by [[w.macv-command-history-1968]], 44 n.8). Names: Xuân Thủy.'
      src:
        c: 3ed36b66
        rows:
        - 'w.macv-command-history-1968 43–44: all'
        - 'via w.macv-command-history-1968 44 n.8: all'
      tags:
      - name:xuan-thuy
    section: '196807'
- add:
    entry:
      id: cal.1968-08-28.vietnam-paris
      when: Aug. 28
      date: '1968-08-28'
      thread: vietnam-paris
      c: Xuân Thủy in Paris. The United States must recognize the NLF, and let the South Vietnamese settle their own affairs.
      n: '[[w.macv-command-history-1968]], 43–44; Hanoi''s spokesman, Nguyễn Thành Lê, in several briefings: the United States
        must recognize the NLF and negotiate with it, no topic named (43, undated). To check: SECSTATE to AMEMB PARIS, 070006Z
        Sep 68, "INTL Note: North Vietnam Premier Speaks on National Day" (cited by [[w.macv-command-history-1968]], 44 n.8).
        See [[cal.1968-07-17.vietnam-paris]]. Names: Xuân Thủy, Nguyễn Thành Lê.'
      src:
        c: 01572c46
        rows:
        - 'w.macv-command-history-1968 43–44: all'
        - 'via w.macv-command-history-1968 44 n.8: all'
      tags:
      - name:xuan-thuy
      - name:nguyen-thanh-le
    section: '196808'
- add:
    entry:
      id: cal.1968-11-03.vietnam
      when: Nov. 3
      date: '1968-11-03'
      thread: vietnam
      also:
      - vietnam-paris
      c: 'Hồ Chí Minh''s appeal: the bombing halt a great victory, owed to the people, the socialist countries and "progressive"
        Americans. The United States must stop its "war of aggression" in the South and withdraw; compatriots to carry on
        their "offensive and uprising" and "win complete victory."'
      n: '[[w.macv-command-history-1968]], 44; *Nhân Dân*, Nov. 4, repeats the appeal and calls on the armed forces to meet
        "all requirements of the new situation and tasks" (44). To check: AMEMB SAIGON to SECSTATE, [4?] Nov 68 (the day garbled
        in the copy), "Ho Chi Minh''s November 3 Appeal" (cited by [[w.macv-command-history-1968]], 44 n.9). Names: Hồ Chí
        Minh.'
      src:
        c: d112de64
        rows:
        - 'w.macv-command-history-1968 44: all'
        - 'via w.macv-command-history-1968 44 n.9: all'
      tags:
      - name:ho-chi-minh
    section: '196811'
- add:
    entry:
      id: cal.1968-11-09.vietnam
      when: Nov. 9–10
      date: '1968-11-09'
      thread: vietnam
      c: '*Nhân Dân* and Hanoi radio call for more attention to public security and high morale; loyal supporters to criticize
        or "handle" anyone who breaks the State''s laws or the "revolutionary" way of life.'
      n: '[[w.macv-command-history-1968]], 44. To check: DIAAP-2 to Dist, 160324Z Nov 68, "DIA INTBUL 320-68 Far East Summary"
        (cited by [[w.macv-command-history-1968]], 44 n.10).'
      src:
        c: 44e91812
        rows:
        - 'w.macv-command-history-1968 44: all'
        - 'via w.macv-command-history-1968 44 n.10: all'
    section: '196811'
- add:
    entry:
      id: cal.1968-11.vietnam-paris
      when: Nov.
      date: 1968-11
      thread: vietnam-paris
      c: 'Hanoi after the halt: the halt "unconditional"; the United States forced to accept the NLF as an "equal" at Paris
        without consulting the Saigon "stooges." Xuân Thủy to the press: North Vietnam never agreed to anything but "quadripartite"
        talks, nor to a two-party conference. Hà Văn Lâu: no cease-fire until all American and allied forces withdraw and
        their bases are dismantled, and the NLF''s Five Points the only acceptable plan.'
      n: '[[w.macv-command-history-1968]], 44. Check: the days (the History: "throughout November"). To check: 7AF, 23 Nov
        68, "Weekly Air Intelligence Summary" (cited by [[w.macv-command-history-1968]], 44 n.11); DIAAP to Dist, 22 Nov 68
        (the time garbled in the copy), "DIA INTBUL 326-68 Far East Summary" (cited by [[w.macv-command-history-1968]], 44
        n.12). Names: Xuân Thủy, Hà Văn Lâu.'
      src:
        c: e858d4d8
        rows:
        - 'w.macv-command-history-1968 44: all'
        - 'via w.macv-command-history-1968 44 n.11: all'
        - 'via w.macv-command-history-1968 44 n.12: all'
      tags:
      - name:xuan-thuy
      - name:ha-van-lau
    section: '196811'
- add:
    entry:
      id: cal.1968-03-21.vietnam
      when: Mar. 21
      date: '1968-03-21'
      thread: vietnam
      c: 'The Hanoi press discusses a presidential decree on punishing "counterrevolutionary crimes": 15 crimes, from "opposing
        the fatherland" to "undermining national defense and the struggle against US aggression"; prison from two years to
        life, or death; leniency for those forced or misled, and for the repentant.'
      n: '[[w.macv-command-history-1968]], 48. Check: the decree''s own date (the History gives the day the press discussed
        it). To check: AMEMB SAIGON to SECSTATE, 10 Jul 68, "Difficulties in North Vietnam" (cited by [[w.macv-command-history-1968]],
        48 n.20); DIAAP SW to AIG 7010, 260133Z Mar 68, "DIA INTBUL [number garbled in the copy]-68" (cited by [[w.macv-command-history-1968]],
        48 n.20).'
      src:
        c: 9453fa83
        rows:
        - 'w.macv-command-history-1968 48: all'
        - 'via w.macv-command-history-1968 48 n.20: all'
    section: '196803'
- add:
    entry:
      id: cal.1968-11-08.vietnam-air-war
      when: Nov. 8
      date: '1968-11-08'
      thread: vietnam-air-war
      c: 'After the halt, Hanoi restores the lines of communication through the panhandle: by Nov. 8 Vinh again a major logistical
        base, Route 8 from Vinh reopening toward Laos, the barge and rail traffic up sharply.'
      n: '[[w.macv-command-history-1968]], 50; The rail bridges at Diễn Châu and Tam Đa rebuilt, through trains from Vinh
        to Hanoi (50, undated).'
      src:
        c: 8cff1857
        rows:
        - 'w.macv-command-history-1968 50: all'
      tags:
      - place:vinh
    section: '196811'
- add:
    entry:
      id: cal.1968-12-03.vietnam-air-war
      when: Dec. 3
      date: '1968-12-03'
      thread: vietnam-air-war
      c: 'Reconnaissance photographs of the Vinh railroad yard: 50 four-axle and 69 two-axle cars, the first full-sized rolling
        stock seen there in over a year.'
      n: '[[w.macv-command-history-1968]], 50; A photograph of Dec. 31: 42 POL tanks of 2,000 gallons at Vinh (50). See [[cal.1968-11-08.vietnam-air-war]].'
      src:
        c: 3351e2e0
        rows:
        - 'w.macv-command-history-1968 50: all'
      tags:
      - place:vinh
    section: '196812'
