      when: Mar. 8
      date: '1968-03-08'
      thread: press-and-broadcasting
      also:
      - vietnam-khe-sanh
      c: 'Westmoreland to the commander of the Fleet Marine Force, Pacific, on Bill Tuohy''s *Los Angeles Times* article on
        the Marine leadership: "distressed to see such distorted reporting"; he rejects that "many top staffers" in his headquarters
        spoke to the press, and admires the Marines "from its commander down to the lowest private."'
      n: '[[w.macv-command-history-1968]], 961–63; Tuohy: the top Marine leadership in Vietnam "singularly unimpressive, say
        the critics" (962). To check: COMUSMACV to CG FMFPAC, 080340Z Mar 68, "Classified" (cited by [[w.macv-command-history-1968]],
        962 n.22); COMUSMACV to SECDEF, 061240Z Mar 68 (cited by [[w.macv-command-history-1968]], 963 n.23). Names: Westmoreland.'
      src:
