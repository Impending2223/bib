      when: Nov. 30
      date: '1968-11-30'
      thread: vietnam-prisoners
      c: Saigon releases 140 Viet Cong prisoners of war in ceremonies at Saigon, Đà Nẵng and Pleiku, as announced Nov. 26,
        a humanitarian gesture.
      n: '[[w.macv-command-history-1968]], 856.'
