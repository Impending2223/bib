      when: Dec. 31
      date: '1968-12-31'
      thread: vietnam-prisoners
      c: An Xuyên. Helicopters of the 7th Squadron, 1st Cavalry, rescue Maj. James N. Rowe, a Special Forces officer held
        by the Viet Cong since Oct. 29, 1963. To Fort Sam Houston, Tex., Jan. 2.
      n: '[[w.macv-command-history-1968]], 849–50; The year''s other escape: Sgt. Buddy Wright of the 4th Division, Sept.
        22, ten days back to friendly lines (849).'
      src:
        c: abb276e0
        rows:
