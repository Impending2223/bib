      c: The General Political Department of the People's Army announces the release of three American pilots, Maj. James
        Frederick Low, Maj. Fred Neale Thompson and Capt. Joe Victor Carpenter, to American pacifists as escorts; the escorts
        leave Paris July 12.
      n: '[[w.macv-command-history-1968]], 843–44.'
