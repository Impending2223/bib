      id: cal.1968-11-25.vietnam
      when: Nov. 25
      date: '1968-11-25'
      thread: vietnam
      also:
      - soviet-union
      c: 'Moscow. A Soviet–North Vietnamese accord: foodstuffs, POL, vehicles, metals, fertilizers, arms and ammunition, and
        other material "necessary for consolidation of national defense and economic development"; free economic and military
        aid, long-term credits and trade. By the French Foreign Ministry''s account, Soviet economic aid greater than military
        for the first time in years.'
      n: '[[w.macv-command-history-1968]], 52. To check: 7AF, 14 Dec 68, "Weekly Intelligence Summary" (cited by [[w.macv-command-history-1968]],
        52 n.31); DIAAP-2 to AIG 7010, 010315Z Jan 69, "DIA INTBUL 366-68" (cited by [[w.macv-command-history-1968]], 52 n.31);
        DIAAP-2 to AIG 7010, 030208Z Jan 69, "DIA INTBUL 2-69" (cited by [[w.macv-command-history-1968]], 52 n.32).'
      src:
        c: 440f48fd
        rows:
