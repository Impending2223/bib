      when: Oct. 7
      date: '1968-10-07'
      thread: china
      also:
      - vietnam
      c: 'Moalic, a French correspondent in Hanoi: the Chinese are withdrawing troops from North Vietnam, their repair and
        antiaircraft crews no longer needed, Hanoi believing the bombing will not resume; not, in his view, a sign of strain.'
      n: '[[w.macv-command-history-1968]], 55; China had sent 40,000 to 50,000 troops to serve in transportation and rear-service
        units (52). To check: AMCONSUL HONG KONG to SECSTATE, 9 Oct 68, "French Reporter in Hanoi" (cited by [[w.macv-command-history-1968]],
        55 n.41).'
      src:
        c: 80f17d30
        rows:
        - 'w.macv-command-history-1968 55: all'
        - 'via w.macv-command-history-1968 55 n.41: all'
