      thread: vietnam
      also:
      - soviet-union
      c: Moscow. Lê Thanh Nghị's mission ends with a new Military and Economic Aid Agreement, its military items not announced;
        earlier in the year than before.
      n: '[[w.macv-command-history-1968]], 51. See [[cal.1968-06-24.vietnam]].'
