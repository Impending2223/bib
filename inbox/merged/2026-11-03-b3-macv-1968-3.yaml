      thread: vietnam
      c: Budapest. Lê Thanh Nghị signs supplementary economic and military aid agreements with Hungary for 1968 and 1969,
        and a trade and payments agreement for 1969; Hungary to train Vietnamese "specialists."
      n: '[[w.macv-command-history-1968]], 51. To check: DIAAP-1 to AIG 7010, 310020Z May 68, "DIA INTBUL 151-68" (cited by
