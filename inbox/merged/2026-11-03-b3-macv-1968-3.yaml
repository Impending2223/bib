      when: June 11
      date: '1968-06-11'
      thread: vietnam-may-offensive
      c: Twenty-five rockets on Saigon, the most in a day. In June 102 rockets on the city, 58 civilians and four soldiers
        killed; the last attack June 21. The Viet Cong had boasted "100 rockets a day for 100 days."
      n: '[[w.macv-command-history-1968]], 133; The morning of June 11 the most destructive series of mortar and rocket attacks
        on Saigon to date (140). To check: Unpublished Rpt, MACJ031, 30 Jun 68 (cited by [[w.macv-command-history-1968]],
        133 n.197).'
      src:
        c: 6e3c8978
