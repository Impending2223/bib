      when: Mar. 4
      date: '1968-03-04'
      thread: press-and-broadcasting
      c: 'Westmoreland to Clifford: the accredited correspondents in the country at a record, many in northern I Corps, at
        Huế, Khe Sanh and the DMZ. On Mar. 7, an all-time high of 649.'
      n: '[[w.macv-command-history-1968]], 943, 949. Names: Westmoreland, Clifford.'
