      when: Oct.
      date: 1968-10
      thread: vietnam
      c: 'MACV''s Alternative D for the withdrawal to CINCPAC: a MAAG residual and an American "shortfall package" to make
        up the South Vietnamese forces'' lacks in combat and support, shrinking as they grow.'
      n: '[[w.macv-command-history-1968]], 780. Check: the day (the History: "During October-November"). See [[cal.1968-08.vietnam]].'
