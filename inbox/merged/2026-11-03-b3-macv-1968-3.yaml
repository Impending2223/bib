      when: June 15–17
      date: '1968-06-16'
      thread: vietnam-operations
      c: 'Off Cap Lay and the Bến Hải, from the evening of June 15 to the early hours of June 17: reports of enemy helicopters,
        later proved false; American aircraft engage ships and small craft. PCF-19 lost, two Navy men killed, five missing;
        two killed on HMAS *Hobart*; the *Boston* lightly damaged.'
      n: '[[w.macv-command-history-1968]], 492–93. To check: CTG 77.0 to CINCPACFLT, 170135Z Jun 68, "Unident Helo Incident"
        (cited by [[w.macv-command-history-1968]], 493 n.226); CINCPAC to SECDEF, 200223Z Jul 68, "Attacks on US Navy and
        Australian Navy Units" (cited by [[w.macv-command-history-1968]], 493 n.226).'
      src:
