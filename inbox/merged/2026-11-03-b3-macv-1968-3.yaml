        airline home. A Hanoi press story of July 18 had told of their release at the prison camp.
      n: '[[w.macv-command-history-1968]], 844; The ICC flight of July 19 landed without them; Sullivan "eyeballed" the cabin
        (844). Clifford to Paris and CINCPAC, July 31, on releasing North Vietnamese in return (854). See [[cal.1968-07-03.vietnam-prisoners]].
        Names: Sullivan.'
