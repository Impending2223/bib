      c: MACV's final report comparing Điện Biên Phủ and Khe Sanh promulgated, widely distributed; its second part forecasts
        Giáp's course after Khe Sanh. Presented at MACV Forward, Feb. 27, and to the III Marine Amphibious Force, Mar. 7.
