- add:
    entry:
      id: cal.1968-06-18.vietnam-may-offensive
      when: June 18
      date: '1968-06-18'
      thread: vietnam-may-offensive
      c: 'Gia Định and Gò Vấp, suburban Saigon. From about noon, men of the Quyết Thắng Regiment and the 273d Regiment rally,
        answering the broadcast appeals of their former executive officer, Capt. Phan Văn Kương, who rallied the day before:
        119 confirmed, 148 reported, 96 weapons; the largest mass defection to date. The 1st and 6th Vietnamese Marine Battalions
        take 113 of the Quyết Thắng Regiment.'
      n: '[[w.macv-command-history-1968]], 83; About half North Vietnamese of Infiltration Group 273, aged 14 to 33, without
        food, ammunition or medicine (83). Check: the History''s pacification chapter dates the largest single-unit defection,
        some 140 of the Quyết Thắng Regiment to Vietnamese Marines near Saigon, June 4 (550). To check: AMEMB SAIGON to SECSTATE,
        18 Jun 68, "Not Stated" (cited by [[w.macv-command-history-1968]], 83 n.88).'
      src:
        c: 5962a974
        rows:
        - 'w.macv-command-history-1968 83: all'
        - 'via w.macv-command-history-1968 83 n.88: all'
      tags:
      - place:saigon
    section: '196806'
- add:
    entry:
      id: cal.1968-09-05.vietnam
      when: Sept. 5
      date: '1968-09-05'
      thread: vietnam
      c: 'A Viet Cong letter, captured Sept. 18: civilians and the underground cadre convinced the "enemy" is "too strong
        to be defeated," the first such admission on record, by MACV''s account.'
      n: '[[w.macv-command-history-1968]], 84. To check: MACJ2, Oct 68, "[not legible in the copy]" (cited by [[w.macv-command-history-1968]],
        84 n.90).'
      src:
        c: f517fa7f
        rows:
        - 'w.macv-command-history-1968 84: all'
        - 'via w.macv-command-history-1968 84 n.90: all'
    section: '196809'
- add:
    entry:
      id: cal.1968-06-10.vietnam-may-offensive
      when: June 10
      date: '1968-06-10'
      thread: vietnam-may-offensive
      c: 'A directive of the Forward Command Post, Headquarters, South Vietnam Liberation Army, on the Second General Offensive:
        a month after the "Second Climaxing Phase" began, COSVN''s Current Affairs Committee and the Army''s headquarters
        met to assess it; "great successes," Saigon''s defenders 50 to 70 percent casualties; attack on in the capital and
        its outskirts.'
      n: '[[w.macv-command-history-1968]], 84–85. To check: COMUSMACV to AIG 7054, 300453Z Jun 68, "Captured Documents Screened
        at CDEC" (cited by [[w.macv-command-history-1968]], 85 n.93).'
      src:
        c: d757e2ea
        rows:
        - 'w.macv-command-history-1968 84–85: all'
        - 'via w.macv-command-history-1968 85 n.93: all'
