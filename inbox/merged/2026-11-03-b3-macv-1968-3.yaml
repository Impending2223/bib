- add:
    entry:
      id: cal.1968-04-16.vietnam
      when: Apr. 16
      date: '1968-04-16'
      thread: vietnam
      c: 'Nitze''s directive to the Joint Chiefs on improving and modernizing the South Vietnamese forces: "We have embarked
        on a course of gradually shifting the burden of the war to GVN forces"; in negotiations mutual restrictions on North
        Vietnam''s and American efforts may be agreed; the forces to be made self-sufficient in logistics, air and artillery
        support. A plan by May 15.'
      n: '[[w.macv-command-history-1968]], 252–53; The Joint Chiefs'' guidelines: CINCPAC to report the critical equipment
        beyond the approved program, the optimum force structure, and the expedients by which the South Vietnamese might take
        over the equipment of American units in a mutual withdrawal (253–54). To check: JCS to CINCPAC, 172116Z Apr 68, "RVNAF
        Improvement and Modernization" (cited by [[w.macv-command-history-1968]], 253 n.55). Names: Nitze.'
      src:
        c: 7b13a716
        rows:
        - 'w.macv-command-history-1968 252–53: all'
        - 'via w.macv-command-history-1968 253 n.55: all'
      tags:
      - name:nitze-paul
    section: '196804'
