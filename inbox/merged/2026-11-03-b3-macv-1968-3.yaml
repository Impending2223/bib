      id: cal.1968-08.vietnam
      when: Aug.
      date: 1968-08
      thread: vietnam
      c: 'T-Day planning, for the day hostilities end. On the Joint Chiefs'' guidance MACV draws time-phased concepts for
        withdrawing the American and allied forces: T-Day Dec. 31, 1968, redeployment from July 1, 1969, complete in six or
        twelve months; left behind a MAAG, or a MAAG and a two-division combat force.'
      n: '[[w.macv-command-history-1968]], 780. Check: the day (the History: "In August").'
      src:
        c: 2c0c1012
        rows:
        - 'w.macv-command-history-1968 780: all'
