      when: June 3
      date: '1968-06-03'
      thread: vietnam
      c: A Communist regional document lays out how to form district Liberation Committees "while waiting for the official
        decisions from Nam Truong (COSVN)." By mid-June MACV judges the committees short of their mark, few in II and III
        Corps.
      n: '[[w.macv-command-history-1968]], 77.'
