      when: Nov. 1
      date: '1968-11-01'
      thread: vietnam-air-war
      c: Rolling Thunder ends; 346 attack sorties flown before the stand-down takes effect at 2100 hours.
      n: '[[w.macv-command-history-1968]], 416–17.'
