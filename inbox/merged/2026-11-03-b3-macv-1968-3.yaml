      date: '1968-11-03'
      thread: vietnam
      c: Abrams concurs in the III Marine Amphibious Force's request of Oct. 30 to close out the Duel Blade strongpoints,
        the 1st Cavalry's sudden departure having changed the forces in the north; sensors beyond Duel Blade's needs to base
        defense.
      n: '[[w.macv-command-history-1968]], 919. To check: CG III MAF to COMUSMACV, 301442Z Oct 68, "DUEL BLADE" (cited by
