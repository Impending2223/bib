      thread: china
      also:
      - vietnam
      c: 'Chen Yi: "Peking leaves the decision in full confidence to Hanoi. Experience tells us that Hanoi knows what it is
        doing." Neither China nor the Russians could influence Hanoi.'
      n: '[[w.macv-command-history-1968]], 53. To check: DIAAP-1 to AIG 7010, 130439Z Apr 68, "DIA INTBUL 103-68" (cited by
