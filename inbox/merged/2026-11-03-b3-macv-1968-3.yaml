      thread: vietnam
      c: The Minister of the Interior issues Phụng Hoàng's Standard Operating Procedure No. 1. A central permanent Phụng Hoàng
        office opens July 27.
      n: '[[w.macv-command-history-1968]], 545; Province committees by the end of July: 5 in I Corps, 12 in II, 8 in III,
