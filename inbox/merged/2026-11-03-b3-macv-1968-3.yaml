- add:
    entry:
      id: cal.1968-05-20.vietnam-prisoners
      when: May 20
      date: '1968-05-20'
      thread: vietnam-prisoners
      c: The *Bream*, a tug chartered by the Military Sea Transport Service, Filipino crew and two American MPs aboard, strays
        into Cambodia and is seized.
      n: '[[w.macv-command-history-1968]], 847–48; Australia''s embassy delivers the American note asking the MPs'' release,
        May 25; the Philippine ambassador takes responsibility, May 29; Sihanouk to Bowles, June 2; Son Sann to the Australians,
        June 4: Sihanouk will release the two "on a personal basis" (848). Names: Sihanouk, Bowles, Son Sann.'
      src:
        c: 611bbe26
        rows:
        - 'w.macv-command-history-1968 847–48: all'
      tags:
