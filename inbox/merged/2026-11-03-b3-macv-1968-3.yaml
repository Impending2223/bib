      id: cal.1968-06.vietnam-2
      when: June
      date: 1968-06
      thread: vietnam
      also:
      - soviet-union
      c: 'Radio Moscow: the bombing has done heavy damage in North Vietnam; Moscow sends material to rebuild railroads, bridges
        and irrigation works, and interest-free loans to rebuild industry and buy food and fertilizer.'
      n: '[[w.macv-command-history-1968]], 51. Check: the day (the History: "In early June"). To check: DIAAP-1 to AIG 7010,
        050118Z Jul 68, "Classified" (cited by [[w.macv-command-history-1968]], 51 n.28).'
      src:
        c: 2fc1c67b
        rows:
        - 'w.macv-command-history-1968 51: all'
        - 'via w.macv-command-history-1968 51 n.28: all'
