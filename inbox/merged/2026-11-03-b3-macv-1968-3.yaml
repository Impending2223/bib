      when: Nov. 9
      date: '1968-11-09'
      thread: vietnam
      c: 'Abrams asks authority to go beyond Phase I and move rapidly to Phase II: with all offensive action against North
        Vietnam stopped and more expected of the Paris talks, the Phase I plan no longer fits.'
      n: '[[w.macv-command-history-1968]], 257. To check: COMUSMACV to CINCPAC, 090515Z Nov 68, "Implementation of the Phase
