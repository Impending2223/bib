      c: The Alliance of National, Democratic and Peace Forces formed at Ban Mê Thuột, by MACV's account, its membership to
        stay secret until a military victory.
      n: '[[w.macv-command-history-1968]], 75. Check: the day (the History: "as early as mid-February"). To check: DIAAP-2
