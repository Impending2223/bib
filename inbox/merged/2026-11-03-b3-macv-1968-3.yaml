- add:
    entry:
      id: cal.1968-06-21.vietnam-air-war
      when: June 21
      date: '1968-06-21'
      thread: vietnam-air-war
      c: 'Abrams, in acting command of MACV, approves Thor, the III Marine Amphibious Force''s plan to destroy the North Vietnamese
        antiaircraft, field and coastal artillery in the Cap Mũi Lay sector, north of the DMZ''s eastern end, and open it
        to observation: a day of massive bombing, then air, artillery and naval gunfire, July 1–7.'
      n: '[[w.macv-command-history-1968]], 408. To check: CG III MAF to COMUSMACV, 110112Z Jun 68, "Classified" (cited by
        [[w.macv-command-history-1968]], 408 n.144); CG PROVCORPSV to CG III MAF, 141538Z Jul 68, "Preliminary Report--Operation
        THOR" (cited by [[w.macv-command-history-1968]], 408 n.144). Names: Abrams.'
      src:
        c: b83ef198
        rows:
        - 'w.macv-command-history-1968 408: all'
        - 'via w.macv-command-history-1968 408 n.144: all'
      tags:
      - name:abrams-creighton
      - place:dmz
    section: '196806'
- add:
    entry:
      id: cal.1968-07-01.vietnam-air-war
      when: July 1–7
      date: '1968-07-01'
      thread: vietnam-air-war
      c: 'Thor, in the Cap Mũi Lay sector: 1,787 tactical air sorties, 210 by B-52s, 41,693 rounds from seven ships and the
        artillery; nearly 2,000 enemy gun positions and structures destroyed, by the best estimates; three aircraft lost.
        Artillery forward, ships within five kilometers of the shore unfired upon.'
      n: '[[w.macv-command-history-1968]], 408–09. To check: CG PROVCORPSV to CG III MAF, 141358Z Jul 68, "Preliminary Report--Operation
        THOR" (cited by [[w.macv-command-history-1968]], 408 n.145). See [[cal.1968-06-21.vietnam-air-war]].'
      src:
        c: 9ce74c95
        rows:
        - 'w.macv-command-history-1968 408–09: all'
        - 'via w.macv-command-history-1968 408 n.145: all'
      tags:
      - place:dmz
    section: '196807'
