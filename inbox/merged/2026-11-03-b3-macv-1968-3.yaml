      when: June 8
      date: '1968-06-08'
      thread: vietnam-prisoners
      c: Cambodia releases the *Bream*'s Filipino crew and the two Americans; the tug returned to the Philippine ambassador
        July 9.
      n: '[[w.macv-command-history-1968]], 849. See [[cal.1968-05-20.vietnam-prisoners]].'
