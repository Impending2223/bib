      thread: vietnam
      c: 'MACV sends CINCPAC its Duck Blind plan, drawn Apr. 22–23 with the Defense Communications Planning Group: the barrier''s
        sensors and munitions for uses other than impeding infiltration from the North, in two phases.'
      n: '[[w.macv-command-history-1968]], 926; Phase I begun by June 23 on MACV''s order of June 16; ended Aug. 25, short
