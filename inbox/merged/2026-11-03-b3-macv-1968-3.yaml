      id: cal.1968-10-22.vietnam
      when: Oct. 22
      date: '1968-10-22'
      thread: vietnam
      c: Abrams halts all construction and planning for Duel Blade, the strongpoint-and-obstacle barrier south of the DMZ
        (Dye Marker), pending guidance. On Oct. 29 MACV's Planning Directive 10-67 rescinded; a revised program, still Duel
        Blade, no longer anchored to the strongpoints.
      n: '[[w.macv-command-history-1968]], 917–18. To check: COMUSMACV to CG III MAF, 220884Z Oct 68, "DUEL BLADE Construction/Planning"
        (cited by [[w.macv-command-history-1968]], 917 n.14). Names: Abrams.'
