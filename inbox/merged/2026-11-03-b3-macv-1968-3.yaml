- add:
    entry:
      id: cal.1968-04-20.vietnam-2
      when: Apr. 20
      date: '1968-04-20'
      thread: vietnam
      also:
      - vietnam-paris
      c: 'Cholon. The Alliance of National, Democratic and Peace Forces announced, Trịnh Đình Thảo its head, Thích Đôn Hậu
        vice-chairman. Its program: end the war, a South Vietnam independent, neutral and prosperous, reunification by discussion
        between North and South. Its central committee overtly non-Communist; a flag, an anthem; a "salvation" appeal close
        to the NLF''s.'
      n: '[[w.macv-command-history-1968]], 75–76; Liberation Radio takes it up the next day, Hanoi after; within a week Trường
        Chinh praises it; students, intellectuals and "militant" Buddhists of central Vietnam drawn, Saigon''s student leaders
        Trần Triệu Luật and Hồ Hữu Nhựt among them (75). To check: AMEMB SAIGON to SECSTATE, 3 Jun 68, "Communist Political
        Activity in I Corps During May" (cited by [[w.macv-command-history-1968]], 75 n.56); AMEMB SAIGON to STATE DEPT, 23
        May 68, "Alliance of National, Democratic and Peace Forces" (cited by [[w.macv-command-history-1968]], 75 n.57); Nltr,
        MACJ285, 27 Jul 68, "CICV Newsletter, VC Political Infrastructure" (cited by [[w.macv-command-history-1968]], 75 n.58).
        See [[cal.1968-02.vietnam]]. Names: Trường Chinh.'
      src:
        c: 5ac4b9f1
        rows:
        - 'w.macv-command-history-1968 75–76: all'
        - 'via w.macv-command-history-1968 75 n.56: all'
