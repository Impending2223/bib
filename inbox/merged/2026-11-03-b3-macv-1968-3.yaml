        moved from Dec. 31, 1968, to Mar. 31, 1969, and the redeployment day from June 30 to Sept. 30, 1969.'
      n: '[[w.macv-command-history-1968]], 781; MACV''s revised draft plan for the withdrawal phase, Oplan 69-69, to the staff
        Dec. 28 (781). Check: the day (the History: "In mid-December," "DEPSECDEF"). See [[cal.1968-08.vietnam]]. Names: Nitze.'
