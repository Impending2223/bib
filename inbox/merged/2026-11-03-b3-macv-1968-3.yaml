      thread: vietnam-operations
      c: 'Quảng Tín. A battalion of the 3d Regiment, 2d North Vietnamese Division, shells and attacks the Hậu Đức district
        town: 14 of the defenders killed, 20 wounded; 91 of the enemy killed, 11 detained.'
      n: '[[w.macv-command-history-1968]], 163; Elsewhere the History gives the 3d Regiment''s unsuccessful attack on the
        district headquarters, "over 200 killed" (163). Check: the enemy''s dead (91, or over 200). To check: MACJ2, Sep 68,
