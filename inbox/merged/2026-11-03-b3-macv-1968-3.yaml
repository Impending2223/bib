      id: cal.1968-07-16.vietnam-prisoners
      when: July 16
      date: '1968-07-16'
      thread: vietnam-prisoners
      c: An Army landing craft, LCU-1577, on resupply in the Delta, strays across the border into Cambodia and is seized,
        eleven American soldiers and a Vietnamese aboard; Phnom Penh calls it "deliberate provocation." Washington's regrets;
        Phnom Penh refuses the return July 22, the crew to be dealt with "by the Cambodian laws."
      n: '[[w.macv-command-history-1968]], 849. Check: the day (the calendar''s entry of Dec. 19 gives July 17).'
      src:
        c: 413fd269
        rows:
        - 'w.macv-command-history-1968 849: all'
