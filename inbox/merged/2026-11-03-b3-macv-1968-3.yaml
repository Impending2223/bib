      id: cal.1968-11-07.vietnam-prisoners
      when: Nov. 7
      date: '1968-11-07'
      thread: vietnam-prisoners
      c: 'Sihanouk to the press: he will release the eleven Americans of the landing craft if Johnson promises no more incidents
        on the border; two border incidents of Nov. 6 change his tone.'
      n: '[[w.macv-command-history-1968]], 849. See [[cal.1968-07-16.vietnam-prisoners]]. Names: Sihanouk, Johnson.'
