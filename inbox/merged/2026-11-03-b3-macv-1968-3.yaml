      when: June 18
      date: '1968-06-18'
      thread: vietnam-operations
      c: 'The Seventh Fleet''s commander: the damage to his ships off Cap Lay was done by friendly aircraft. A review of the
        incidents follows; MACV''s conference on the proposals, July 6.'
