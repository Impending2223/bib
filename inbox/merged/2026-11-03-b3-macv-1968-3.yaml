      when: Dec. 19
      date: '1968-12-19'
      thread: vietnam-prisoners
      c: 'Two Liberation Radio broadcasts: American prisoners to be released; the Eastern Nam Bộ Military Zone proposes five
        unarmed representatives a side meet at 1500 Saigon time, Dec. 25, nine kilometers south of Tây Ninh City. The Armed
        Forces Network answers Dec. 21 that II Field Force will meet them.'
      n: '[[w.macv-command-history-1968]], 845.'
