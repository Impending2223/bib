      when: Oct. 15
      date: '1968-10-15'
      thread: vietnam
      c: MACV confirms 1,186 People's Liberation Committees, of some 1,700 estimated, at every echelon in the areas the enemy
        controls; a quarter to 30 percent of those areas under them.
