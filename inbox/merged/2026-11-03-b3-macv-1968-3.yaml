      when: Apr. 9
      date: '1968-04-09'
      thread: vietnam
      c: 'Liberation Radio: in 45 days 1.6 million people and 600 villages liberated, many administrations set up. Village
        Liberation Committees begin to appear in late April and early May, most of the rest "shadow" bodies, by MACV''s account.'
      n: '[[w.macv-command-history-1968]], 77.'
