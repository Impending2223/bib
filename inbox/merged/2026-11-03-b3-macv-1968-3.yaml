      when: Nov. 17
      date: '1968-11-17'
      thread: vietnam-operations
      c: 'Before dawn, after a night of attacks by fire across central and southern I Corps, two ground attacks fail: the
        3d Battalion, 31st Regiment, on the Túy Loan bridge southwest of Đà Nẵng; the 36th Regiment on Điện Bàn. The 38th
        Regiment''s main assault on Đà Nẵng, set for Nov. 19, preempted, by MACV''s account.'
      n: '[[w.macv-command-history-1968]], 164. See [[cal.1968-11-15.vietnam-operations]].'
