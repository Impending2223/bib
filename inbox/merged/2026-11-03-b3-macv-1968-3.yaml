      when: Dec. 18
      date: '1968-12-18'
      thread: vietnam
      c: Clifford approves the Accelerated Phase II plan for the South Vietnamese army and air force, not the navy; units
        moved up from fiscal 1970–71 to 1969. Authorized strength 866,434. He asks for a plan to transfer American units'
        equipment and to withdraw the units no longer needed.
      n: '[[w.macv-command-history-1968]], 259; The same day the Joint Chiefs approve an accelerated Phase II program (339,
        329). Abrams sends CINCPAC the activation schedule, the equipment transfers and the withdrawals, Dec. 26 (259). Check:
        the Secretary (the History: "SECDEF"). To check: MACMA, 10 Jan 69, "Historical Summary, 4th Quarter 1968" (cited by
        [[w.macv-command-history-1968]], 259 n.67); COMUSMACV to CINCPAC, 231430Z Dec 68, "T-Day Plan [for] the RVNAF Improvement
        and Modernization Program" (cited by [[w.macv-command-history-1968]], 259 n.67). See [[cal.1968-10-08.vietnam]]. Names:
        Clifford.'
