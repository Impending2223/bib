      when: July 26
      date: '1968-07-26'
      thread: china
      also:
      - vietnam
      c: '*Nhân Dân* on the aid agreement with China, warmer than the year before: "a new, militant expression" of solidarity;
        praise for Mao and for Chinese sailors lost carrying goods. The Alliance of National, Democratic and Peace Forces
        not mentioned; nor Hồ Chí Minh.'
      n: '[[w.macv-command-history-1968]], 54–55. To check: SECSTATE to AMEMB PARIS, 312247Z Jul 68, "Hanoi Publicly More
        Grateful for Chinese Aid than 1967" (cited by [[w.macv-command-history-1968]], 55 n.40). See [[cal.1968-07-23.china]].
        Names: Mao.'
      src:
        c: d24488d2
        rows:
        - 'w.macv-command-history-1968 54–55: all'
        - 'via w.macv-command-history-1968 55 n.40: all'
      tags:
      - name:mao-zedong
