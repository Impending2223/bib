- add:
    entry:
      id: cal.1968-09-20.vietnam-operations
      when: Sept. 20–24
      date: '1968-09-20'
      thread: vietnam-operations
      c: COSVN calls off the third offensive, by MACV's intelligence; enemy operations everywhere but Thượng Đức fall back
        to a reduced level. Its plan had been to strike Đà Nẵng and Saigon, then lesser targets; its diversions had failed,
        its losses heavy.
      n: '[[w.macv-command-history-1968]], 136. Check: the day (the History: "Sometime between 20 and 24 September"). To check:
        Briefing, COMUSMACV, 7 Sep 68, "Assessment of the Enemy''s Third Offensive" (cited by [[w.macv-command-history-1968]],
        136 n.206); Briefing, COMUSMACV, 26 Oct 68, "What Happened to the Enemy''s Third Offensive" (cited by [[w.macv-command-history-1968]],
        136 n.206). See [[cal.1968-08-18.vietnam-operations]].'
      src:
        c: 5ad9c096
        rows:
        - 'w.macv-command-history-1968 136: all'
        - 'via w.macv-command-history-1968 136 n.206: all'
