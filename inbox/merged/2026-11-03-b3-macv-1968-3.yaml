- add:
    entry:
      id: cal.1968-12-25.vietnam-prisoners
      when: Dec. 25
      date: '1968-12-25'
      thread: vietnam-prisoners
      c: South of Tây Ninh City, II Field Force's team meets the People's Liberation Armed Forces' representatives, until
        about 1730; some 30 of the enemy seen. II Field Force refuses the demand for a 72-hour New Year's truce, offering
        safe conduct (Armed Forces Network, Dec. 30).
      n: '[[w.macv-command-history-1968]], 845–47. See [[cal.1968-12-19.vietnam-prisoners]].'
      src:
        c: 86ce2bf5
        rows:
