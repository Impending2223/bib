      c: Turnpike, the tactical air and B-52 campaign against the enemy's movement through Route Package I and the Steel Tiger
        and Tiger Hound areas of Laos, ends; MACV judges its objectives largely met.
      n: '[[w.macv-command-history-1968]], 407–08. Check: the day Turnpike began (the History''s page, its columns garbled
