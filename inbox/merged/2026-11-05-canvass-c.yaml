- add:
    entry:
      id: cal.1963-07-04.vietnam-saigon
      when: July 4
      date: '1963-07-04'
      thread: vietnam-saigon
      c: 'Saigon, the embassy''s Fourth of July reception. Trần Văn Đôn takes Conein to the Caravelle Hotel bar: a generals'' plot to remove the whole Ngô family, all but "one or two" generals in it, a coup perhaps within ten days; the American reaction? No answer given.'
      n: '[[w.miller-misalliance]], 284–85. Check: the day: Miller has the talk after the reception (284–85), and Nhu''s meeting with the generals of July 11 "just three days after" it (286). To check: "Testimony of Lucien Conein," Senate Select Committee on Intelligence, June 20, 1975, 20, box 47, Church Committee Records, JFK Assassination Collection, NARA (cited by [[w.miller-misalliance]], 396 n.22). Names: Trần Văn Đôn, Conein.'
      tags:
      - name:tran-van-don
      - name:conein-lucien
      - place:saigon
      variants:
      - unit: A
        witness: w.miller-misalliance
        reads: Nhu's meeting of July 11 "just three days after" Don revealed the plot to Conein
        at: '286'
    section: '196307'
