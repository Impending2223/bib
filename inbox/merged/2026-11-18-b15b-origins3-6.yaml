      when: 1963, after Chinese New Year
      date: '1963'
      thread: china-leadership
      c: Beijing. Some 120 ideologists from across China housed at the Eighteen Buildings, a guesthouse compound in the western suburbs, to prepare a renewed anti-Soviet campaign. Eight groups, each under a unit (the People's Daily, Red Flag and others); the eight group leaders a committee answering to Kang Sheng.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 360. Made public: 1991. To check: Informant I, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 360 n.78); [[w.xiuquan-huiyi-yu-huainian]], 374 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 360 n.81). Names: Kang Sheng. Check: the day; the book says the preparation began "just after Chinese New Year, 1963", and its detail is Informant I''s (III, 360). Whether this is the drafting group Wu Lengxi has named at the Standing Committee in February 1963 ([[cal.1963-02.china-leadership-2]]).'
      tags:
