      thread: china-leadership
      also:
      - soviet-union
      c: 'Diaoyutai. The Central Committee''s five-man team for the year''s anti-Soviet polemics: Kang Sheng, leader; Wu Lengxi, Wang Li, Yao Qin, Fan Ruoyu. Qiao Guanhua and Zhao Yimei nominal members; a support team of seven.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 360 (the *fanxiu banzi*, anti-revisionism team, not the *xuanji banzi*, the selected works team, by Michael Schoenhals''s word, n.77). Made public: 1993. To check: [[w.li-zuopai-lilunjia-fuchen-lu]], 210–11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 360 n.77a); Michael Schoenhals, communication to the author on the two teams of xiucai (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 360 n.77b). Names: Kang Sheng, Qiao Guanhua. Check: the month; the book says only "as early as 1960" (III, 360).'
      tags:
