- add:
    entry:
      id: cal.1961-02-11.china-leadership-4
      when: Feb. 11
      date: '1961-02-11'
      thread: china-leadership
      c: 'Changsha 长沙, on a branch-line train. Mao 毛泽东 hears Zhang Pinghua 张平化, Hu Jizong 胡继宗 and Zhou Li 周礼 of the Hunan 湖南 committee and Hu Qiaomu 胡乔木 of the Hunan survey group. Commune and team are too big: one commune in about three, by townships. Hunan has 15,000 production teams, formerly 50,000 advanced co-ops; Mao: go back to about the advanced co-ops, 50,000. Equalizing in meals and work points would follow. Mess halls are not to be forced; Hu: in Changsha county they cannot now be broken up.'
      place: changsha
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.18. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Record of Mao Zedong''s 毛泽东 talk with the heads of the Hunan Provincial Committee and the Hunan survey group 湖南调查组, Feb. 11, 1961 (谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.18); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-02-06.china-leadership-7]]. Names: Mao Zedong.'
