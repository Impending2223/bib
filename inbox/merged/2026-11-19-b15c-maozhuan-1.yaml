      c: 'Mao 毛泽东 leaves Wuhan 武汉 for Peking 北京. On the way he asks the provinces'' heads of the summer harvest: at Zhengzhou 郑州, Liu Jianxun 刘建勋: the wheat not so bad, the autumn harvest likely better; at Jinan 济南, the Shandong 山东 committee: "a great change" 情况大变, the villages not in bad shape but for the disasters at Dezhou 德州 and Huimin 惠民, the wheat 4.2 billion jin, 1.3 billion above the 2.9 billion estimated.'
