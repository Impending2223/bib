    entry:
      id: cal.1961-01.china-leadership-6
      when: Jan., after the 26th
      date: '1961-01'
      thread: china-leadership
      at: after 1961-01-26
      c: Jinan 济南, on the train. Mao 毛泽东 hears the heads of the Shandong 山东 committee on carrying out the Central Work Conference and the Ninth Plenum.
      place: jinan
      n: '[[w.mao-zedong-zhuan]], V, ch. 67. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. Of the three talks on the train, at Tianjin, Jinan and Nanjing, the book gives without saying at which: all three committees report some county, commune and brigade leaderships rotten 烂掉了; Mao: a restoration by counterrevolutionaries 反革命分子复辟, the dead bureaucrats their direct allies, the muddled their indirect; "the water is muddy" 水是浑的; good and bad both to be heard. Check: the day, between Jan. 26 at Tianjin and Jan. 29 at Nanjing. See [[cal.1961-01-26.china-leadership-4]]. Names: Mao Zedong.'
      src:
