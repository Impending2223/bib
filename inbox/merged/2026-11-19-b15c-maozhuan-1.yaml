    entry:
      id: cal.1961-03-07.china-leadership-6
      when: Mar. 7
      date: '1961-03-07'
      thread: china-leadership
      c: 'Canton 广州, Jijingkeng 鸡颈坑. Mao 毛泽东 with Wang Renzhong 王任重 of Hubei 湖北: private plots, repayment and command are three weighty questions; whether the private plots have been handed down; attending the mess hall must be by choice, and the system itself is settled. A commune regulation is wanted, since the twelve articles do not say what each level handles. How to stop blind commanding? Wang: it comes chiefly from commune and county, from province and prefecture above.'
      place: canton
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.24. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Brief record of Mao Zedong''s 毛泽东 talk with Wang Renzhong 王任重, Mar. 7, 1961 (谈话简要记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.24); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-03-05.china-leadership]]. Names: Mao Zedong.'
