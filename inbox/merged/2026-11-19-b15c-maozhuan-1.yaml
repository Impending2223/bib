      id: cal.1961-01-26.china-leadership-4
      when: Jan. 26
      date: '1961-01-26'
      thread: china-leadership
      c: 'Tianjin 天津, on the train. Mao 毛泽东 hears Liu Zihou 刘子厚 and others of the Hebei 河北 committee on carrying out the Central Work Conference and the Ninth Plenum. He says that this year there must be a wind of investigation and research 调查研究: without it, work is dangerous.'
      place: tianjin
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.11. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Mao Zedong 毛泽东, interjections while hearing Liu Zihou 刘子厚 (record 插话记录), Jan. 26, 1961 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.11); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-01-18.china-leadership]]. Names: Mao Zedong.'
