- add:
    entry:
      id: cal.1961-02-06.china-leadership-7
      when: Feb. 6
      date: '1961-02-06'
      thread: china-leadership
      c: Hangzhou 杭州, Wangzhuang 汪庄. Mao 毛泽东, after hearing Tian Jiaying 田家英's report, hears Jiang Hua 江华, Huo Shilian 霍士廉, Lin Hujia 林乎加 and Li Fengping 李丰平 of the Zhejiang 浙江 committee on rectifying the communes and the committee's enlarged meeting. Counties and communes are too big, merged for the convenience of those above; Zhejiang's 600 communes might be 1,200. The production team too is too big. Mess halls to be small and of several kinds, the test being more output and the people content.
      place: hangzhou
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.13. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Brief record of Mao Zedong''s 毛泽东 talk with the heads of the Zhejiang Provincial Committee 中共浙江省委, Feb. 6, 1961 (谈话简要记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.13); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-02-05.china-leadership]]. Names: Mao Zedong.'
