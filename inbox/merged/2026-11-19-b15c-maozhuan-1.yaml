      n: '[[w.zedong-mao-zedong-nianpu]], IV, Oct. 26, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 372 (Oct. 26, 1960; Mao''s comment of the morning of Oct. 26 (''26th, morning''), written on the report Li Fuchun sent him Oct. 24: Liu and Zhou to read it today and talk over what to do in the afternoon; printed from the manuscript; the volume does not give the number of officials); [[w.yang-jisheng-mubei]], I, 75 (the report of four cadres of the Organization Department and the Control Commission to Li Fuchun, Oct. 21; Li''s sending it to Mao, Oct. 24; the book wonders whether the four were Li Jian''s party; Mao''s comment itself, 75 n.58); [[w.yang-jisheng-mubei]], II, 838 (Oct. 26: Mao reads the report, which says several hundred thousand starved in Xinyang, and writes that Liu and Zhou read it that day and talk over the handling in the afternoon). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66). Check: Mubei says the report put the Xinyang dead at several hundred thousand (II, 838); Wang Congwu''s account, as Qiao Peihua took it down, has the Control Commission and the Organization Department''s evidence at 700,000-odd (I, 75), and Li Jian''s count was 1,050,000 (I, 74). To check: Cadres of the Organization Department and the Control Commission of the Central Committee, report of Oct. 21, 1960 on the inquiry into mass deaths from hunger and grave breaches of law and discipline by cadres in Xinyang 信阳 prefecture, Henan (sent to Mao by Li Fuchun, Oct. 24) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 372 n.1). Names: Mao Zedong, Li Fuchun, Liu Shaoqi, Zhou Enlai.'
