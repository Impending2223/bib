    entry:
      id: cal.1962-12-02.china-leadership-3
      when: Dec. 2
      date: '1962-12-02'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao 毛泽东 holds a Politburo Standing Committee meeting in the afternoon on the Italian party''s 意大利共产党 congress, then sitting. Togliatti 陶里亚蒂''s report names the CCP. Decided: if they criticize China in public, China may criticize them; the Chinese delegation''s greeting at the congress not to call it opportunism, which is for the toast at the reception; articles to answer the points one by one, as on the paper tiger, war and peace, adventurism, and Togliatti''s own words to be printed. Deng Xiaoping 邓小平 relays this to the Secretariat on Dec. 4.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 n.6. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Record of the Secretariat''s meeting 中共中央书记处会议记录, Dec. 4, 1962, Deng Xiaoping relaying the decisions of the Standing Committee meeting of Dec. 2 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.6); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. Check: the place: the book has Mao away from Peking at this time; Deng''s relay is the book''s only source. Check: the congress''s number: the book has the Fourth (第四次代表大会). See [[cal.1962-11-19.china]]. Names: Mao Zedong, Deng Xiaoping.'
