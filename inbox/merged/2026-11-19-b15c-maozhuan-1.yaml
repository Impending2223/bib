      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 4, 1960, and notes 23–24. [[w.jianguo-yilai-mao-zedong]], XV, 55–57 (the Center''s comment on the Guizhou report, written Mar. 4 in the draft, issued Mar. 6); [[w.jianguo-yilai-mao-zedong]], XV, 62–63 (Mao to Liu and Deng, 4 a.m., Mar. 4, with the three drafts); [[w.yang-jisheng-mubei]], II, 1169 (Mao''s comment of Mar. 4 on the Guizhou committee''s mess-hall report, sent out as a Central document Mar. 6 with "all the country to copy it, no exception"). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66). Check: note 2 (XV, 57) says the Center forwarded the Guizhou report on Feb. 26; Mao''s draft comment is dated Mar. 4 and the note at 56 says it issued Mar. 6. To check: Guizhou Provincial Committee, report of Feb. 24, 1960 on the present state of the rural public mess halls (cited by [[w.jianguo-yilai-mao-zedong]], XV, 56 n.2a); Central Committee, circular of Feb. 26, 1960 forwarding the Guizhou report to provincial, municipal and regional committees (as the note states) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 57 n.2b). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
- edit:
