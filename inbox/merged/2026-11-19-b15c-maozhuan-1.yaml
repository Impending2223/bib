      id: cal.1961-03-19.china-leadership-8
      when: Mar. 19
      date: '1961-03-19'
      thread: china-leadership
      c: 'Canton 广州, noon. Mao 毛泽东 with Chen Boda 陈伯达, Hu Qiaomu 胡乔木, Liao Luyan 廖鲁言 and Tian Jiaying 田家英 on the draft commune regulations: is it dangerous? Farming was taken up late; the second Zhengzhou meeting did not settle things, only three days, in batches; Lushan should have settled what Zhengzhou left, but came the interlude of fighting the right, when it should have fought the left; the Shanghai meeting of 1960 touched the villages but dealt mostly with foreign affairs; the December conference settled things only in bits. This time he is resolved to settle it.'
      place: canton
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.30. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Relayed record of Mao Zedong''s 毛泽东 talk with Chen Boda 陈伯达 and others, Mar. 19, 1961 (传达记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.30); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-03-14.china-leadership]]. Names: Mao Zedong, Chen Boda.'
