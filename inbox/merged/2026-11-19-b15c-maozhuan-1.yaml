      n: '[[w.mao-zedong-zhuan]], V, ch. 70 n.39. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Mao Zedong 毛泽东, talk with the heads of North China 华北地区负责人 (谈话要点), Aug. 2, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.39); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1962-07-28.china-leadership]]. Names: Mao Zedong.'
