      when: June 29–July 2
      date: '1960-06-29'
      thread: china-leadership
      c: Mao 毛泽东 leaves Shanghai 上海 by special train on June 29, by way of Bengbu 蚌埠 and Jinan 济南, and reaches Tianjin 天津 on July 2, on his way to Beidaihe 北戴河 for the Central Work Conference 中央工作会议.
