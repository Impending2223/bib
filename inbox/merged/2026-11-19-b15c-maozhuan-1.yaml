    entry:
      id: cal.1960-12-30.china-leadership-6
      when: Dec. 30
      date: '1960-12-30'
      thread: china-leadership
      c: 'Mao 毛泽东 hears the third report of the Central Work Conference''s 中央工作会议 groups on the villages. Grain is to rise in price, which he had refused in Oct. 1959. Levelling and transfers 一平二调 are to be repaid to the last, counties and communes going bankrupt if need be. Building can only go step by step, perhaps half a century. The Center bears blame for the communist wind 共产风, not the provinces alone; some faults are two or three fingers, not one 一个指头; the year''s disaster is in part man-made 人祸. Chen Yun 陈云: 1961 will be no better than 1960; rest the people and the animals, and import grain.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.5. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Mao Zedong 毛泽东, interjections at the report meeting of the Central Work Conference 中央工作会议汇报会, Dec. 30, 1960 (record 插话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.5); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1960-12-27.china-leadership]]. Names: Mao Zedong, Chen Yun.'
      src:
