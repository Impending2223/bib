    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 22, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 105–108 (the Center''s comment of Mar. 22, from Mao''s draft, printed from the Central Committee document: Anshan, the largest enterprise in the country with over 100,000 staff, held before 1958 that it was modern and needed no technical revolution, opposed mass movements and the "two participations, one reform, three-in-one", favored one-man management and held the "Magnitogorsk constitution" sacred; in 1959 it began to doubt; its report of July 1959, which Mao had printed for the Lushan meeting, backed the Leap and the fight on Rightism; its report of Mar. 1960 is the third stage, an "Anshan constitution" for the Far East; to be passed to big and medium enterprises and city committees and studied through 1960). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66). Check: the wengao gives no place for the comment; the Center issued it as a document dated Mar. 22. To check: Anshan Municipal Committee, report of Mar. 11, 1960, via the Liaoning Provincial Committee, on the movement for technical innovation and technical revolution on the industrial front (cited by [[w.jianguo-yilai-mao-zedong]], XV, 106 n.1); Anshan Municipal Committee, report of July 25, 1959 on Anshan steel''s current production, the mass movement and the August work plan (cited by [[w.jianguo-yilai-mao-zedong]], XV, 108 n.5). Names: Mao Zedong.'
