    entry:
      id: cal.1961-02-12.china-leadership-4
      when: Feb. 12
      date: '1961-02-12'
      thread: china-leadership
      c: 'Changsha 长沙, on the train. Mao 毛泽东 hears Zhang Pinghua 张平化 and Hu Qiaomu 胡乔木 alone. Zhang: the committee thinks its resolve on the structure too weak; it will cut the basic accounting unit to the old advanced co-op before spring ploughing, the 1,100 communes to about 3,000, the teams to some 50,000. Mao: it is what the people ask. That night he leaves for Canton, to keep the New Year there.'
      place: changsha
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.19. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Record of Mao Zedong''s 毛泽东 talk with the heads of the Hunan Provincial Committee and the Hunan survey group 湖南调查组, Feb. 12, 1961 (谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.19); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-02-11.china-leadership-4]]. Names: Mao Zedong.'
