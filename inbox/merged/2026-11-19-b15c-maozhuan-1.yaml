      when: Sept. 9
      date: '1960-09-09'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Deng Xiaoping 邓小平 telephones Mao''s 毛泽东 duty secretary: the Reply to the CPSU''s notice 《答复书》 is finished and Liu Shaoqi 刘少奇 has read it, with some changes; the Politburo and Secretariat will meet on it next day without the Standing Committee; has Mao read it? Mao has the secretary say he has read it, it is very well written, few small changes, and if others cannot come Deng and Peng Zhen 彭真 alone will do.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 66. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1960-09-07.china-leadership]]. Names: Deng Xiaoping, Mao Zedong, Liu Shaoqi, Peng Zhen.'
