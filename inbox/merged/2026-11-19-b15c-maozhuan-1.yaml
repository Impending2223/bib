- add:
    entry:
      id: cal.1961-02-08.china-leadership-4
      when: Feb. 8
      date: '1961-02-08'
      thread: china-leadership
      c: 'Hangzhou 杭州, Wangzhuang 汪庄. Mao 毛泽东 again hears Jiang Hua 江华 and Lin Hujia 林乎加 of the Zhejiang 浙江 committee, with Xue Ju 薛驹 and Tian Jiaying 田家英 of the survey group. Is there hope of the targets with the five winds gone? Repayment: who decides, pays; he doubts the Center, province, prefecture and county all have the resolve. The Center''s own papers, the spring-ploughing directives, are a form. Private plots: changed too often. The aim: no hunger, sickness, flight, wasteland or death. Teams of the third class are not all enemies: some under bad men, some under the five winds, some weak. He speaks at length of the want of mental preparation for socialism. Tian proposes a set of working regulations for the communes, and Mao agrees.'
      place: hangzhou
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.15. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Record of Mao Zedong''s 毛泽东 talk with the heads of the Zhejiang Provincial Committee and the Zhejiang survey group 浙江调查组, Feb. 8, 1961 (谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.15); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-02-06.china-leadership-7]]. Names: Mao Zedong.'
