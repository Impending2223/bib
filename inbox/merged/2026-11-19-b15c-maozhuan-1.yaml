    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 290–292 (May 24, 1962; Mao''s note of May 24; printed from the manuscript; note 1: the draft (the Standing Committee''s Central Work Conference of May 7–11 agreed with the report; its spirit to be passed on by word of mouth to county first secretaries and up; the main work to cut the industrial front, staff and urban population, and to strengthen the production teams; the plan''s gross output of industry and farming lowered from 140 to 130 billion yuan); issued by the Center May 26 as Zhongfa [62] 254 to the ministries'' Party groups and the provincial committees; note 2: Zhou''s letter of May 19 by way of Li Fuchun: if Mao has no time, the directive first, Tian Jiaying or Lin Ke to tell him the report; Mao had agreed to the course at the Standing Committee on May 1). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 69); the text in full, 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, draft directive forwarding the Central Finance and Economic Group''s report on discussing the adjusted plan for 1962 (May 1962) (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 290 n.1a); Central Finance and Economic Group, report "On discussing the adjusted plan for 1962," Apr. 30, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 290 n.1b); Zhou Enlai, letter of May 19, 1962 sending the Finance Group''s report and the draft directive to Li Fuchun and then to Mao Zedong (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 292 n.2). See [[cal.1962-05-19.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Li Fuchun. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
