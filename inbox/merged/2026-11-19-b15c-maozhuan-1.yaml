    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Oct. 10, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 352–355 (Oct. 10, 1960; Mao''s 毛泽东 note to Li Fuchun 李富春, 1 a.m. Oct. 10: Hubei''s 湖北 report on Mianyang 沔阳 county (the ''levelling and transfers'' unsolved to now, grain down) and Fujian''s 福建 on Minhou 闽侯 county (Chengmen 城门 commune, over 2,000 withdrawn from farming, 45 percent of the labor, sent back) both ''excellent''; a Secretariat member to draft a strong directive of several hundred words within days; on Oct. 12 he marks the draft read and sends it to Li Fuchun; printed from the manuscript). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66). Check: the Wengao dates Mao''s note Oct. 10, 1 a.m., and his marking of the draft ''read'' Oct. 12. To check: Wang Yanchun 王延春, secretary of the Hubei 湖北 Party committee secretariat, report of Sept. 18, 1960 to Wang Renzhong 王任重, Zhang Tixue 张体学 and the secretariat on a trial of policy in Mianyang county (Tonghaikou 通海口 commune) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 353 n.2); Fujian 福建 Provincial Party Committee, forwarding Sept. 30, 1960 the report of Minhou county''s first secretary on concentrating labor and strengthening the first line of farm production in Chengmen 城门 commune (2,079 withdrawn, 45 percent of the labor) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 354 n.3); Secretariat, draft directive forwarding the Hubei 湖北 and Fujian 福建 Party committees'' two documents (read by Mao 毛泽东, Oct. 12, 1960) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 355 n.4). Names: Mao Zedong, Li Fuchun.'
