- add:
    entry:
      id: cal.1961-12-17.china-leadership
      when: Dec. 17
      date: '1961-12-17'
      thread: china-leadership
      c: 'Jinan 济南. Mao 毛泽东, left Wuxi 无锡 on Dec. 16 at dusk, hears Tan Qilong 谭启龙, Pei Mengfei 裴孟飞, Bai Rubing 白如冰 and Su Yiran 苏毅然 of the Shandong 山东 committee. A team of thirty families may be too big; teams of a dozen, three or five households in the hills: twenty families is already large. The beasts have stopped dying and the tools no longer break; six years of great egalitarianism are over, and to pay by work is socialism; to care for the needy has communism in it.'
      place: jinan
      n: '[[w.mao-zedong-zhuan]], V, ch. 69 n.5. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Summary record of Mao Zedong''s 毛泽东 interjections on hearing Tan Qilong 谭启龙 and others of the Shandong committee, Dec. 17, 1961 (插话记录摘要) (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.5); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-12-15.china-leadership-6]]. Names: Mao Zedong.'
