    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 12, 1962 ("同日"). [[w.jianguo-yilai-mao-zedong]], XVI, 343–346 (Aug. 12, 1962; Mao''s note, dated Aug. 12; printed from the manuscript; the department was then right (the ten measures of part two, with the right handling of go-it-alone; the ten points on the situation of part one); after ten months, August 1961 to the end of May 1962, Deng wavered; tied to his reluctance on cooperatives before the summer 1955 meeting and his "four great freedoms"; Deng''s statement at the core group Aug. 11 welcome but not enough; notes 4–5 list the twenty points; note 6: the Center General Office''s notice of Mar. 9, 1981 rehabilitating Deng Zihui). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 70). See [[cal.1962-08-11.china-leadership]]. Names: Mao Zedong, Deng Zihui. Check: the nianpu itself calls the note''s criticism of Deng Zihui mistaken ("错误地批评").'
