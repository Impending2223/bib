      when: Aug. 2
      date: '1962-08-02'
      thread: china-leadership
      c: 'Beidaihe 北戴河, evening. Mao 毛泽东 with the Hebei 河北, Shanxi 山西 and Inner Mongolia 内蒙古 committees'' heads, Li Xuefeng 李雪峰 of the North China Bureau also there. He asks of output and go-it-alone farming: little in Shanxi, Inner Mongolia and Peking, a few teams in Hebei. Where the brigade is the accounting unit and does well, it need not go down to the team; teams of about twenty households; field management by group, household or person on a plot is progress.'
