      id: cal.1961-01-29.china-leadership-4
      when: Jan. 29
      date: '1961-01-29'
      thread: china-leadership
      c: Nanjing 南京, on the train. Mao 毛泽东 hears Jiang Weiqing 江渭清 and others of the Jiangsu 江苏 committee. He tells of Zhejiang, where only one county secretary in the province could explain three-level ownership, pay by work, the law of value and equal exchange; cadres are to be trained in classes, for the want of mental and public preparation for socialism and its economy.
      place: nanjing
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.12. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Mao Zedong 毛泽东, interjections while hearing the heads of the Jiangsu Provincial Committee 中共江苏省委 (record 插话记录), Jan. 29, 1961 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.12); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-01-26.china-leadership-4]]. Names: Mao Zedong.'
