      when: Apr. 9
      date: '1961-04-09'
      thread: china-leadership
      c: 'Changsha 长沙, on the train, 7:30 to 11:20 p.m. Mao 毛泽东 hears Zhang Pinghua 张平化 and then Hu Qiaomu 胡乔木, back from the villages, on the sixty articles. Zhang: three questions are most argued, the supply system, the mess halls and the grain contract; the supply part over 30 percent surely wrong, 10 percent enough; the teams want the contract fixed. Mao: the supply system and the mess halls are both egalitarianism; the willing are few, the commune need save nothing for two or three years. Hu: from Shaoshan, the masses'' three concerns are the reward for extra output, distribution and the mess halls; the mess halls the most pressing.'
