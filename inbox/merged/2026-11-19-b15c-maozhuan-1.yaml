      c: 'While the three articles for Lenin''s ninetieth anniversary 列宁诞辰九十周年 are drafted, Mao 毛泽东 reads "Long Live Leninism" 《列宁主义万岁》 and gives his changes; in Wu Lengxi''s 吴冷西 account he says: argue fully, with the other side distinguished and room left; take friends as friends; aim at the Yugoslav revisionists; quote no Soviet views, not Khrushchev''s own speeches; the CPSU is still to be united with and not named; the criticism may make them think again.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 66 (Wu Lengxi''s recollection, n.18). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. Check: the day or days: the book gives no date, between Mar. 25 and the articles of Apr. 20–23. See [[cal.1960-04-11.china-leadership-5]]. Names: Mao Zedong.'
