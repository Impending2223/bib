    base: d29c836d
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 15, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 76–77 (Mao to Liu and Deng, Mar. 15: the drafts enclosed are the Hunan, Shandong and Jiangsu comments, for the Central meeting to pass and to issue within seven to ten days to the first secretaries; the mess-hall comment came with his letter of Mar. 16, 97–98); [[w.jianguo-yilai-mao-zedong]], XV, 78–79 (the Hunan comment: the report on thirteen aspects of farm work is worth reading, with something new in it, showing the whole of agriculture; the report: by the end of February 880,000 water works new or repaired, 30,000 of them new reservoirs; seven million laborers out on manure; a plan of 40 million pigs); [[w.jianguo-yilai-mao-zedong]], XV, 80–81 (the Shandong comment; the report: 45,000 cadres sent out, 24 backward counties and cities, 260-odd cadres to sit in them); [[w.jianguo-yilai-mao-zedong]], XV, 82–89 (the mess-hall comment, dated Mar. 15 and issued Mar. 18: the three papers (eight provinces; Henan; the nation at the end of 1959) are pleasing; each province to "grasp hard" the question twice in the year, in each half, with a scientific summary on the Guizhou and Henan pattern; welfare committees at the four levels from province to commune, each under a secretary, and a management committee in every hall; the same in factories, mines, streets, offices, schools and the army. Mao''s inserts: the nation to aim at 80 percent of rural people eating in halls, seven provinces and cities (Henan, Hunan, Sichuan, Yunnan, Guizhou, Shanghai, Anhui) already over 90 percent, the rest not to be forced, two or three years; starch from plant stalks "a great invention"; third-class halls to be made first-class. The papers: Henan, 336,000 halls and 99 percent of rural people; the nation, 3,919,000 halls and 72.6 percent of commune members at the end of 1959). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66). To check: Hunan Provincial Committee, comprehensive report on thirteen aspects of agricultural production, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 78 n.1); Shandong Provincial Committee, report of Feb. 27, 1960 to the Center and the Shanghai Bureau on living arrangements (cited by [[w.jianguo-yilai-mao-zedong]], XV, 80 n.1); Central Committee, circulars of Mar. 18, 1960 forwarding the Hunan, Shandong and Jiangsu reports with Mao''s three comments, issued unchanged after the Politburo passed them (cited by [[w.jianguo-yilai-mao-zedong]], XV, 77 n.4); Qingkuang jianbao no. 117, "The state of the rural public mess halls in eight provinces" (from telephone reports of Hebei, Henan, Shanxi, Shandong, Gansu, Liaoning, Jilin and Heilongjiang) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 86 n.2); Henan Provincial Committee Secretariat office, telephone report of Mar. 5, 1960, "The state of the rural public mess halls in Henan" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 87 n.3); State Statistical Bureau, January 1960, "The development of the rural public mess halls at the end of 1959" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 88 n.4); Central Committee, circular of Mar. 18, 1960 forwarding the three mess-hall papers with Mao''s comments (cited by [[w.jianguo-yilai-mao-zedong]], XV, 86 n.1b). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
- edit:
    id: cal.1960-03-16.china-leadership
    base: bae1d193
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 16, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 90–92 (the technical-revolution comment, dated Mar. 16 and issued Mar. 18: the ACFTU Party group''s report on seven cities (Shanghai, Tianjin, Shenyang, Lüda, Harbin, Taiyuan, Chongqing) and the *Jingji xiaoxi* piece are important summaries, to go to all city, mine and commune committees; Wuhan, Canton, Xi''an, Lanzhou, the provincial capitals and hundreds of medium cities such as Tangshan, Shijiazhuang, Qingdao, Luoyang, Huangshi, Zhuzhou, Wuxi, Zhanjiang and Pingxiang to sum up and spread the work quickly, county and commune industry too, the investigating and summing up to be done in March, April and May with large field conferences; the First Ministry of Machine Building''s January field conference at Harbin, to which most cities were not invited, Wuhan and Canton among them, is faulted); [[w.jianguo-yilai-mao-zedong]], XV, 93–96 (the health instruction, dated Mar. 16 and issued Mar. 18: health work slack for two years in the rush of the Leap; the Center''s approval of Feb. 2 of the Health Ministry''s report on the Jishan conference was not heeded by most first secretaries; the patriotic health campaign to be revived and show results in 1960, 1961 and 1962; each Party committee, health department and mass organization to meet four times a year, once a quarter, the patriotic health campaign committees too; the four pests to be rats, bedbugs, flies and mosquitoes, sparrows no longer to be hit; sport and exercise urged); [[w.jianguo-yilai-mao-zedong]], XV, 97–98 (Mao to Liu and Deng, Mar. 16: the technical-revolution and mess-hall comments and a draft telegram on health work are sent, with a request that they gather the comrades concerned, and that the three of Mar. 15 were sent the day before). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66). To check: All-China Federation of Trade Unions Party group, report of Mar. 5, 1960 to the Center on the present state of technical innovation and technical revolution (cited by [[w.jianguo-yilai-mao-zedong]], XV, 91 n.2); Jingji xiaoxi, no. 10, 1960, "The technical revolution movement reaps a harvest over a large area" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 92 n.3); Central Committee, circular of Mar. 18, 1960 forwarding the ACFTU report and the Jingji xiaoxi piece with Mao''s comment (cited by [[w.jianguo-yilai-mao-zedong]], XV, 91 n.1); Health Ministry Party group, report of Dec. 16, 1959 to the Central Committee Cultural and Educational Group and the Center on the national rural health field conference at Jishan county, Shanxi, Nov. 12–21, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 95 n.2); Central Committee, approval of Feb. 2, 1960 of the Health Ministry report and annex, sent to the provinces (as Mao''s text states) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 95 n.2b); Central Committee, instruction of Mar. 18, 1960 on health work, as drafted by Mao Mar. 16 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 95 n.1). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
