- add:
    entry:
      id: cal.1961-02-10.china-leadership-8
      when: Feb. 10
      date: '1961-02-10'
      thread: china-leadership
      c: 'Xiangtang 向塘, Jiangxi 江西, on the train on the branch line. Mao 毛泽东 hears Yang Shangkui 杨尚奎, Shao Shiping 邵式平, Fang Zhichun 方志纯 and Liu Junxiu 刘俊秀 of the Jiangxi committee. Communes and teams are too big: a commune may be split in two or three, by townships, one township a commune. Only Sichuan keeps to the Center''s policy, its communes the township; Henan wants big. Mess halls to suit three kinds of people: a hall the year round, a farming-season hall, and cooking at home for those who will not attend.'
      place: xiangtang
      n: '[[w.mao-zedong-zhuan]], V, ch. 67 n.16. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Brief record of Mao Zedong''s 毛泽东 talk with the heads of the Jiangxi Provincial Committee 中共江西省委, Feb. 10, 1961 (谈话简要记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.16); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1961-02-06.china-leadership-7]]. Names: Mao Zedong.'
