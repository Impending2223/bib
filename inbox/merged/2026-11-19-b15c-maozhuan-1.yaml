    item: '[[w.mao-zedong-zhuan]], V, ch. 65 (Jan. 7–17, the enlarged Politburo meeting at Shanghai, Mao presiding: Li Fuchun on the 1960 plan on the first day, with the three-year and eight-year projections; Lin Biao on defense, Nie Rongzhen on science, Lu Dingyi on education; the plan and international questions chiefly discussed, the Soviet textbook also taken up; 1960 a leap year again, steel 18.4 million tons, grain 600 billion jin; the eight-year aim of the four modernizations; mess halls and urban communes to be set up and spread in the year; Mao reached Shanghai at dawn on Jan. 5)'
    units: B-J
