      when: Aug. 4
      date: '1962-08-04'
      thread: china-leadership
      c: 'Beidaihe 北戴河. Mao 毛泽东 with the heads of the Sichuan 四川, Yunnan 云南 and Guizhou 贵州 committees. As Mao reports it next day, they say that within half a year of household contracting or going it alone the farm classes divide sharply: some very poor with no way to live, land sold and bought, usury, concubines; the poor, the middle and the better-off a third each.'
