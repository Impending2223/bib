      id: cal.1960-10.china-leadership-11
      when: Oct.
      date: '1960-10'
      thread: china-leadership
      c: Mao 毛泽东 stops eating meat, to share the country's want and save the meat for sale abroad. His head nurse 护士长 Wu Xujun 吴旭君 counts his calories each day. His weight falls to 75 kilograms.
