    entry:
      id: cal.1962-07-22.china-leadership-10
      when: July 22
      date: '1962-07-22'
      thread: china-leadership
      c: 'Mao 毛泽东 reads the record of the symposium on consolidating the production teams'' collective economy held by Tao Zhu 陶铸 and Wang Renzhong 王任重 at Longsheng 龙胜 county, Guilin 桂林 prefecture, Guangxi, and has it printed for the coming Central Work Conference. The paper draws the line between the collective economy and going it alone, and sets out how to consolidate the collective economy. Mao''s comment: its analysis is Marxist, and so are the proposals after it; the comrades may study whether there is anything to discuss, and it may go to the provincial and prefectural levels for discussion.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 70 n.35. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Mao Zedong 毛泽东, comment on the record of the symposium on consolidating the production teams'' collective economy 《关于巩固生产队集体经济问题座谈会记录》 (manuscript 手稿), July 22, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.35); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. Names: Mao Zedong, Tao Zhu.'
