- edit:
    id: cal.1962-11-19.south-asia
    base: 5e585b44
    set:
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("同一天下午"); [[w.jian-zhou-enlai]], 482 (Nov. 18; the President, Radhakrishnan, alone; Chen''s translation: "Why suddenly talk so loudly about a peaceful settlement? Please read this. The Foreign Ministry should study whether other Indian leaders have made similar comments in the past several days"). [[w.jianguo-yilai-mao-zedong]], XVI, 435–436 (Nov. 19, 1962; part one, Mao''s note "To the Premier to read," the Foreign Ministry to study whether India''s leaders had talked so in the past few days, dated 4 p.m. the 19th, signed "Mao"; part two, beside Nehru''s National Defense Volunteers'' Day speech and Radhakrishnan''s: "suddenly talking big of a peaceful settlement"; beside the Cairo *al-Gumhuriya*''s call for an unconditional cease-fire: "the Soviet line, but the last paragraph means to warn Nehru"; printed from the manuscript; notes 1–3). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 71). Check: the Wengao dates the note 4 p.m. Nov. 19 (XVI, 435), against Chen''s Nov. 18. To check: Mao''s note on *Cankao ziliao*, no. 5406, manuscript, Nov. 19, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.3); [[w.zedong-mao-zedong-nianpu]], V, 169 (cited by [[w.jian-zhou-enlai]], 764 n.84); Xinhua, Cankao ziliao no. 5406, Nov. 19, 1962, with Nehru''s speech on National Defense Volunteers'' Day, Radhakrishnan''s speech, and al-Gumhuriya''s call for an unconditional Sino-Indian cease-fire (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 436 n.1). See [[cal.1962-11-19.china]]. Names: Mao Zedong. Check: the day: Chen has Nov. 18.'
