      when: May 28
      date: '1968-05-28'
      thread: robert-kennedy-campaign-primaries
      c: 'Portland, a rear room of the hotel suite, after the defeat. Kennedy, O''Brien, vanden Heuvel and a few others prepare
        the concession to McCarthy. Kennedy: "He beat us, and he beat us fairly. It''s my own fault. I could have done a better
        job. You might point out that our combined vote is an overwhelming rejection of the war."'
      n: '[[w.goodwin-remembering-america]], 533 (Goodwin''s account; McCarthy 44.7 percent, Kennedy 38.8). See [[cal.1968-05-28.robert-kennedy-campaign-primaries-2]].
        Names: Robert Kennedy, O''Brien, vanden Heuvel, McCarthy.'
