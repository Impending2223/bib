- add:
    entry:
      id: cal.1968-04-05.robert-kennedy-campaign-decision
      when: Apr. 5
      date: '1968-04-05'
      thread: robert-kennedy-campaign-decision
      also:
      - robert-kennedy-campaign
      c: 'Hickory Hill, after Goodwin''s leave-taking of McCarthy. Robert Kennedy, to Goodwin: "Well, it''s about time." Goodwin:
        "Listen, Bobby, it''s not my fault you didn''t run. You''re the one who put me in this position." In the sitting room
        Walinsky, Greenfield, Sorensen, Salinger, O''Donnell. Goodwin: "Listen you bastards, I''m the only one of you who
        did the right thing, and I''m the only one who''s going to suffer for it."'
      n: '[[w.goodwin-remembering-america]], 527–28 (Goodwin''s account; the next weeks he assembles a media crew, John Frankenheimer
        among them). See [[cal.1968-04.robert-kennedy-2]]. Names: Robert Kennedy, Goodwin, McCarthy, Walinsky, Greenfield,
        Sorensen, Salinger, O''Donnell.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - name:walinsky-adam
      - name:greenfield-jeff
      - name:sorensen-theodore-c
      - name:salinger-pierre
      - name:odonnell-kenneth-p
      - state:va
      - city:mclean
- add:
    entry:
      id: cal.1968-04.robert-kennedy-campaign-6
      when: Apr.
      date: 1968-04
      thread: robert-kennedy-campaign
      also:
      - elections-1968-mccarthy
      c: 'Indianapolis, late at night, outside McCarthy''s headquarters. Robert Kennedy sits on the stairs with young McCarthy
        volunteers: "I know why I''m here. I''m running for office. Why are you here?" A young woman: "I joined his campaign
        in New Hampshire to fight against the war because he was there. And you weren''t there." Kennedy: "I want you to know
        that you make me proud to be an American. You''ve done a wonderful thing. I''m only sorry we couldn''t have done it
        together." Walking on, to Goodwin: "Damn it, damn it all, those are my people."'
      n: '[[w.goodwin-remembering-america]], 530–31 (Goodwin''s account). Check: the day, and the month; the book gives only
        the Indiana campaign (528–31). Names: Robert Kennedy, Goodwin, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1968-05-28.robert-kennedy-campaign-primaries-2
      when: May 28
      date: '1968-05-28'
      thread: robert-kennedy-campaign-primaries
      also:
      - elections-1968
      c: 'Aboard the plane from Los Angeles to Portland, late on the day of Oregon''s primary, as the polls close; Kennedy,
        Goodwin, staff and family. Reports radioed to the plane: defeat almost certain. The cabin falls silent. Kennedy, near
        Goodwin: "We frightened them."'
      n: '[[w.goodwin-remembering-america]], 533 (Goodwin''s account). See [[cal.1968-05-28.elections-1968-2]]. Names: Robert
        Kennedy, Goodwin.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - state:or
- add:
    entry:
