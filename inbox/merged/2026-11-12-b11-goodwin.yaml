patch: 2026-11-12-b11-goodwin
by: Claude (batch 11 reader, Goodwin, Remembering America; audited in two halves)
ops:
- add:
    entry:
      id: cal.1960-01.elections-1960-nomination
      when: Jan.
      date: 1960-01
      thread: elections-1960-nomination
      c: 'Washington National Airport, the Butler Aviation terminal, a cold January night. Sorensen and Goodwin meet Kennedy,
        back from a trip, with the draft of his speech on the Presidency for the National Press Club. He reads every page
        closely: "I don''t mind sticking it to old Ike." Warned that it will be read as an attack on Eisenhower, he does not
        look up from the draft.'
      n: '[[w.goodwin-remembering-america]], 72–74 (Goodwin''s account; the speech does not name Eisenhower). Names: Sorensen,
        Goodwin, Kennedy, Eisenhower. Check: the day; "twelve days" after the announcement of Jan. 2 (72), which is Jan. 14,
        the day of the speech ([[cal.1960-01-14.elections-1960]]).'
      tags:
      - name:sorensen-theodore-c
      - name:goodwin-richard-n
      - name:kennedy-john-f
      - name:eisenhower-dwight-d
      - city:washington
- cite:
    id: cal.1960-01-14.elections-1960
    item: '[[w.goodwin-remembering-america]], 72–74 (the speech''s making: a dozen pages on the role of the President "to
      lead, morally and in action," for the National Press Club, an implicit rebuke to Eisenhower; not the day or the words)'
    units: '?'
- add:
    entry:
      id: cal.1960-03.elections-1960-primaries
      when: Mar., late
      date: 1960-03
      thread: elections-1960-primaries
      c: 'Wisconsin, early morning, a diner by a factory gate. Kennedy to his companion: "You think I''m out here to get votes
        ... Well, I am. But not just their votes. I''m trying to get the votes of a lot of people who are sitting right now
        in warm, comfortable homes all over the country ... hoping that young Jack will fall right on his face in the snow.
        Bastards." Then: "What the hell. They''ll take me if they have to. Let''s get started."'
      n: '[[w.goodwin-remembering-america]], 76 (Goodwin''s account; the companion not named). Names: Kennedy. Check: the
        day; "In late March" (76).'
      tags:
      - name:kennedy-john-f
      - state:wi
- cite:
    id: cal.1960-04-05.elections-1960-kennedy
    item: '[[w.goodwin-remembering-america]], 83 (the third-floor suite at the Pfister Hotel, Milwaukee; Kennedy, sipping
      chicken noodle soup, sees from the split of the districts that the result will be read in religious terms; one of his
      sisters: "What does it mean?" Kennedy: "that we have to do it all over again. We have to go through every primary and
      win every one of them — West Virginia and Maryland and Indiana and Oregon, all the way to the convention")'
    units: all
- cite:
    id: cal.1960-04-06.elections-1960-primaries-2
    item: '[[w.goodwin-remembering-america]], 84 (O''Donnell, sent as soon as the Wisconsin votes were in, with the West Virginia
      county and political leaders: "That''s right, but we didn''t know he was Catholic"; O''Donnell telephones Kennedy, "is
      there any way we can win down there?" "Yes ... you can convert"; not Robert Kennedy, the booth, the poll or the words)'
    units: '?'
- check:
    id: cal.1960-04-06.elections-1960-primaries-2
    text: 'Check: who called. [[w.goodwin-remembering-america]], 84, has O''Donnell meet the county leaders after Wisconsin
      and telephone Kennedy: "Yes ... you can convert."'
- add:
    entry:
      id: cal.1960-04-19.elections-1960-religion
      when: Apr. 19
      date: '1960-04-19'
      thread: elections-1960-religion
      c: 'Wheeling, W. Va. Kennedy, answering a question from the audience, "without warning, spontaneously," speaks to the
        Catholic issue: "I am a Catholic ... but the fact that I was born a Catholic — does that mean that I can''t be president
        of the United States? I''m able to serve in Congress and my brother was able to give his life, but we can''t be president?"
        Feeling the crowd with him, he decides to raise the issue himself wherever he goes.'
      n: '[[w.goodwin-remembering-america]], 87 (Goodwin''s account; "much to the surprise of his advisers"). Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:wv
      - city:wheeling
- cite:
    id: cal.1960-04.elections-1960-3
    item: '[[w.goodwin-remembering-america]], 88 (Humphrey "in the closing days," in the coalfields of southern West Virginia:
      "I don''t think elections should be bought ... I can''t afford to run through with a checkbook and a little black bag";
      not "late in April," nor the second sentence''s words)'
    units: A
- add:
    entry:
      id: cal.1960-05.elections-1960-primaries-4
      when: May, before the primary
      date: 1960-05
      thread: elections-1960-primaries
      c: West Virginia, the closing days of the primary. The Kennedy camp, sent copies of Humphrey's correspondence with his
        draft board by an anonymous source in Minnesota, decides that Franklin D. Roosevelt Jr., campaigning for Kennedy in
        the State, should make it public.
      n: '[[w.goodwin-remembering-america]], 88 (Goodwin''s account: "Kennedy decided it was time to hit back"; "It was decided").
        Names: Humphrey, Roosevelt, Kennedy. Check: the day.'
      tags:
      - name:humphrey-hubert-h
      - name:roosevelt-franklin-d-jr
      - name:kennedy-john-f
      - state:wv
- cite:
    id: cal.1960-05.elections-1960-11
    item: '[[w.goodwin-remembering-america]], 88 (Roosevelt''s charge that Humphrey sought a deferment, "a ''draft dodger,''"
      with documents to prove it, at the Kennedy camp''s decision; Kennedy at once disavows it: "Any discussion of the war
      record of Senator Hubert Humphrey was done without my knowledge and consent, and I strongly disapprove the injection
      of this issue into the campaign"; not the interview, the headlines or an apology)'
    units: A
- cite:
    id: cal.1960-05-10.elections-1960-2
    item: '[[w.goodwin-remembering-america]], 88–89 (Humphrey''s telegram of concession at 1 a.m. at the Kennedy headquarters
      in Charleston; Robert Kennedy walks to him through the rain; Humphrey: "I am no longer a candidate for the presidential
      nomination"; Kennedy at Charleston: "The religious issue has been buried here in the soil of West Virginia")'
    units: A
- add:
    entry:
      id: cal.1960-07-13.elections-1960-nomination
      when: July 13
      date: '1960-07-13'
      thread: elections-1960-nomination
      c: 'Washington. When Wyoming''s votes give Kennedy the nomination, Goodwin and the staff of the Senate office leave
        for the Democratic National Committee''s headquarters on K Street, where the committee staff are watching a television
        broadcast of the convention. They put briefcases and cartons of papers on the desks: by "inviolable tradition" the
        National Committee, its records and staff belong to the nominee.'
      n: '[[w.goodwin-remembering-america]], 90 (Goodwin''s account; the broadcast "from Constitution Hall"). See [[cal.1960-07-13.elections-1960]].
        Names: Kennedy, Goodwin. Check: the day; Wyoming''s votes came late on July 13 in Los Angeles, after midnight in Washington.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - city:washington
- add:
    entry:
      id: cal.1960-09-12.latin-america
      when: Sept. 12
      date: '1960-09-12'
      thread: latin-america
      also:
      - elections-1960-kennedy
      c: 'Goodwin, on a bus in west Texas, finishes a draft on Kennedy''s Latin American policy for the Alamo, San Antonio,
        that afternoon. "Alianza" from the title of a New Mexico society''s magazine left on the seat; by telephone Karl Meyer
        of the *Washington Post* reports: "Ernesto [Betancourt] says there''s no problem. But he thinks it should be an alliance
        for something." Goodwin takes "progreso" and writes "Alianza para progreso." Kennedy, told by his throat specialist
        to save his voice, reads the draft and writes on his pad: "Let''s not waste this one. The ministers is the big one
        for today."'
      n: '[[w.goodwin-remembering-america]], 108–9 (Goodwin''s account; the day by the Houston ministers "that night"; the
        phrase first proclaimed at Tampa, Oct. 18, 109). See [[cal.1960-09-12.elections-1960-kennedy-4]]. Names: Goodwin,
        Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
      - state:tx
      - city:san-antonio
- cite:
    id: cal.1960-09-12.elections-1960
    item: '[[w.goodwin-remembering-america]], 109–10 (the Houston ministers "that night," the day of the Alamo speech; Kennedy''s
      words quoted in part, "I believe in an America where the separation of church and state is absolute"; not the Rice Hotel
      or the questions)'
    units: A
- add:
    entry:
      id: cal.1960-09-20.farm
      when: Sept. 20
      date: '1960-09-20'
      thread: farm
      also:
      - elections-1960-kennedy
      c: 'A hotel suite, the windows on Nebraska, late evening. Kennedy to Goodwin, on the farm speech for the South Dakota
        Plowing Contest, less than forty-eight hours off: "Get some of Nixon''s quotes on agriculture and compare them to
        what Benson said, show the similarities." Then: "Give them the whole thing from our position on parity to Food for
        Peace. They may get a little bored listening, but not as much as I will saying it."'
      n: '[[w.goodwin-remembering-america]], 118–19 (Goodwin''s account). Names: Kennedy, Goodwin, Nixon, Benson. Check: the
        day; "less than forty-eight hours" before the contest (118), which the calendar has Sept. 22; the calendar has Kennedy
        at Washington on Sept. 20 ([[cal.1960-09-20.elections-1960-kennedy]]).'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:nixon-richard-m
      - name:benson-ezra-taft
- add:
    entry:
      id: cal.1960-09-21.farm-2
      when: Sept. 21
      date: '1960-09-21'
      thread: farm
      also:
      - elections-1960-kennedy
      c: 'The night before the Plowing Contest. Goodwin brings Kennedy the draft of the farm speech; he reads it in silence:
        "Just think, Dick, here we are, a couple of Brookline farmers, preparing policy for the entire country. Isn''t politics
        wonderful? ... Let''s go with it." As Goodwin leaves: "Remember, Dick, I don''t want to make policy, I want to make
        votes."'
      n: '[[w.goodwin-remembering-america]], 119 (Goodwin''s account). See [[cal.1960-09-20.farm]]. Names: Goodwin, Kennedy.
        Check: the day; "The next night" (119).'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-09-22.farm-4
      when: Sept. 22
      date: '1960-09-22'
      thread: farm
      also:
      - elections-1960-kennedy
      c: '3 a.m. Kennedy telephones Goodwin about the farm speech for the Plowing Contest: "Look ... about that speech. I
        want to be sure I don''t fall on my face. Call Hubert [Humphrey] in the morning and read it to him. Make sure it''s
        right."'
      n: '[[w.goodwin-remembering-america]], 119 (Goodwin''s account). See [[cal.1960-09-21.farm-2]]. Names: Kennedy, Goodwin,
        Humphrey.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1960-09-22.farm-5
      when: Sept. 22
      date: '1960-09-22'
      thread: farm
      also:
      - elections-1960-kennedy
      c: 'Shortly after dawn, the Plowing Contest hours away. Goodwin reads Kennedy''s farm speech to Humphrey by telephone:
        "Wonderful, Dick ... it''s just what I would have said myself." The program memos had been prepared by Humphrey''s
        staff. At breakfast, to Kennedy: "It''s okay with Hubert."'
      n: '[[w.goodwin-remembering-america]], 119 (Goodwin''s account). See [[cal.1960-09-22.farm-4]]. Names: Goodwin, Humphrey,
        Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:humphrey-hubert-h
      - name:kennedy-john-f
- cite:
    id: cal.1960-09-22.farm-2
    item: '[[w.goodwin-remembering-america]], 118–20 (Kennedy before "a huge crowd of dour, unresponsive farmers" at "a South
      Dakota fairground," with Goodwin''s draft; boarding the Caroline after: "Well, that''s over ... Fuck the farmers after
      November"; not Sioux Falls or the words of the speech)'
    units: '?'
- cite:
    id: cal.1960-09-25.elections-1960-kennedy
    item: '[[w.goodwin-remembering-america]], 113 (Kennedy in Ohio while the issue team works in Chicago, to "a partisan crowd
      at the Hotel Hollenback," as the page spells it: "It is possible for us to win Ohio and it is possible for us to lose
      Ohio"; not Cleveland, the party workers or Truman''s margin)'
    units: '?'
- cite:
    id: cal.1960-09-25.elections-1960-4
    item: '[[w.goodwin-remembering-america]], 112–16 (Sorensen, Feldman and Goodwin prepare index cards through the night;
      Kennedy reads them in bed the next morning; calls Sorensen''s opening statement "too rhetorical" and dictates his own
      to Evelyn Lincoln; naps; not the hotels, the pages, the hours or the lunch)'
    units: A
- add:
    entry:
      id: cal.1960-09-26.elections-1960-debates-4
      when: Sept. 26
      date: '1960-09-26'
      thread: elections-1960-debates
      also:
      - elections-1960-kennedy
      c: 'After the first debate, the Caroline to Painesville, Ohio. Kennedy, with a beer and a bowl of tomato soup, goes
        over his answers and Nixon''s: "We''ll need something better on education." Goodwin: "We''ve got it won now." Kennedy:
        "It was all right."'
      n: '[[w.goodwin-remembering-america]], 115–16 (Goodwin''s account; for Hellriegel''s Inn and a breakfast speech). See
        [[cal.1960-09-26.elections-1960]]. Names: Kennedy, Nixon, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      - name:goodwin-richard-n
      - state:oh
- cite:
    id: cal.1960-10-14.peace-corps
    item: '[[w.goodwin-remembering-america]], 120 (Goodwin, eating in a campus cafeteria, is told by a press staff member:
      "You know what he just did? He proposed a Peace Corps"; Kennedy on "a stone staircase"; seven hundred Michigan students
      signed up within two days; the arrival "late on the evening of October 13"; not 2 a.m., the Union or the question to
      the students)'
    units: '?'
- cite:
    id: cal.1960-10-18.latin-america
    item: '[[w.goodwin-remembering-america]], 109 (the Alianza para Progreso "first proclaimed" at Tampa on Oct. 18, the phrase
      coined for San Antonio, Sept. 12, 108–9; not the courthouse or the draft from Middletown)'
    units: '?'
- cite:
    id: cal.1960-10-19.king
    item: '[[w.goodwin-remembering-america]], 121 (Oct. 19, King arrested "for refusing to leave the all-white restaurant
      of a department store"; not the students, Rich''s, the trespass law or bail)'
    units: '?'
- cite:
    id: cal.1960-10-19.elections-1960-kennedy
    item: '[[w.goodwin-remembering-america]], 124–26 (Kennedy, "en route to New York," asks for "a real blast for Nixon";
      that evening Goodwin types the statement in the staff room of the Biltmore; telephones Kennedy at the Carlyle, asleep;
      none has "the heart to wake" him; "the only public statement by the candidate in the entire campaign that he had not
      personally reviewed"; Kennedy later: "It was the words ''freedom fighters'' ... that''s what caused the problem"; not
      Sorensen or Salinger by name, "softness," or the change of words)'
    units: A, C, D
- cite:
    id: cal.1960-10-20.cuba
    item: '[[w.goodwin-remembering-america]], 125–26 (the statement Goodwin drafted, its third point: "We must attempt to
      strengthen the non-Batista, democratic, anti-Castro forces in exile, and in Cuba itself, who offer eventual hope of
      overthrowing Castro"; released for the morning papers unread by Kennedy; Nixon''s answer the next day; Reston''s column
      "the following Sunday"; not the embargo)'
    units: A, C
- add:
    entry:
      id: cal.1960-10.elections-1960-kennedy
      when: Oct.
      date: 1960-10
      thread: elections-1960-kennedy
      also:
      - cuba
      c: 'The Caroline, the night after Nixon''s answer to the Cuba statement. Kennedy, pointing to Goodwin and Sorensen:
        "If I win this thing, I won it; but if I lose it, you guys lost it."'
      n: '[[w.goodwin-remembering-america]], 126 (Goodwin''s account: "There was no other reproach"). See [[cal.1960-10-20.cuba]].
        Names: Kennedy, Goodwin, Sorensen. Check: the day; "The next night" (126).'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:sorensen-theodore-c
- cite:
    id: cal.1960-10-25.king
    item: '[[w.goodwin-remembering-america]], 121–22 (Kennedy, told by his brother by telephone that he "might want to intervene,"
      asks his staff; O''Donnell and the political advisers against; Shriver, waiting outside, has Goodwin tell him when they
      have gone, and speaks to Kennedy alone; Kennedy telephones Coretta King, promising to "do all I can," then Robert Kennedy;
      "Someone called the judge"; King released "that day"; his father to vote for a Catholic; not the judge, the charge,
      Reidsville or Wofford)'
    units: F
- check:
    id: cal.1960-10-25.king
    text: 'Check: the days. [[w.goodwin-remembering-america]], 121–22, has King arrested Oct. 19, "taken immediately to court"
      and sentenced to four months at hard labor; Kennedy''s call to Coretta King "the morning after King''s imprisonment,"
      at his brother''s suggestion, as he began to prepare for the fourth debate (Oct. 21); and King released "that day."'
- add:
    entry:
      id: cal.1960-11-02.elections-1960-kennedy-5
      when: Nov. 2
      date: '1960-11-02'
      thread: elections-1960-kennedy
      c: 'California, the night of Eisenhower''s ride through New York with Rockefeller, Lodge and Nixon. Kennedy: "While
        we meet tonight ... the rescue squad has been completing its operation in the city of New York. ... We have all seen
        these circus elephants complete with tusks, ivory on their head and thick skins, who move around the circus ring and
        grab the tail of the elephant ahead of them. ... Dick Nixon grabbed that tail in 1952 and 1956, but this year he faces
        the American people alone. ... President Eisenhower is not running. Mr. Nixon is."'
      n: '[[w.goodwin-remembering-america]], 123 (Goodwin''s account; the place in California not given; the rejoinder repeated
        "at nearly every campaign stop"). See [[cal.1960-11-02.elections-1960-2]]. Names: Kennedy, Eisenhower, Rockefeller,
        Lodge, Nixon. Check: the day; "tonight," the day of the ride in New York.'
      tags:
      - name:kennedy-john-f
      - name:eisenhower-dwight-d
      - name:rockefeller-nelson
      - name:lodge-henry-cabot
      - name:nixon-richard-m
      - state:ca
- cite:
    id: cal.1960-11-05.elections-1960-kennedy
    item: '[[w.goodwin-remembering-america]], 127–29 (on landing in New York, Kennedy to O''Donnell: "I''ve already got New
      York. I should be out in California right now"; the motorcade lost, "riding around the Bronx trying to find some crowds";
      at the Biltmore: "It''s that fucking De Sapio ... he screwed the whole thing up"; "I''ll take care of those guys after
      Tuesday"; to the driver: "Well next time get a road map"; not Saturday, or Prendergast as a target)'
    units: B
- cite:
    id: cal.1960-11-05.elections-1960-kennedy-12
    item: '[[w.goodwin-remembering-america]], 127–29 (Goodwin and Dave Powers wait at the Carlyle with the draft of the evening''s
      speech, then take a taxi to the Biltmore; Kennedy in his undershorts eating from a food warmer, Goodwin cutting his
      steak; he walks through the guests, among them Lehman, Mrs. Roosevelt, De Sapio and Prendergast, to the driver; not
      the rain, Johnson or the parade)'
    units: '?'
- cite:
    id: cal.1960-11-05.elections-1960-kennedy-11
    item: '[[w.goodwin-remembering-america]], 129–30 (Goodwin''s draft, which Kennedy revises at the Biltmore and makes "his
      own"; quoted in part: "I am not promising action in the first 100 days alone — I am promising you 1000 days of exacting
      presidential leadership"; not the place, the sixty hours or the oath)'
    units: '?'
- check:
    id: cal.1960-11-05.elections-1960-kennedy-11
    text: 'Check: the place. [[w.goodwin-remembering-america]], 127–29, puts the speech at "Madison Square Garden."'
- add:
    entry:
      id: cal.1960-11-07.elections-1960-kennedy-6
      when: Nov. 7
      date: '1960-11-07'
      thread: elections-1960-kennedy
      c: 'The Caroline, the day before the election, Nixon''s telethon on a set at the front of the plane. Goodwin, at Kennedy''s
        compartment: "Nixon''s on television, Senator ... if you want to watch." Kennedy: "I don''t think so," his hand rapping
        the arm of his chair.'
      n: '[[w.goodwin-remembering-america]], 130 (Goodwin''s account; "The Monday before election Tuesday"). Names: Kennedy,
        Goodwin, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:nixon-richard-m
- cite:
    id: cal.1961-01-20.civil-rights-the-executive
    item: '[[w.goodwin-remembering-america]], 3–5 (after the parade, in the West Wing corridor: "Did you see the Coast Guard
      detachment? ... There wasn''t a black face in the entire group. That''s not acceptable. Something ought to be done about
      it"; Goodwin telephones Dillon, "Tell him I''ll get right on it"; the first black professor at the Academy that summer,
      four black cadets the next year; not an order to find out why)'
    units: A, C, D
- add:
    entry:
      id: cal.1961-01.latin-america
      when: Jan.
      date: 1961-01
      thread: latin-america
      c: 'The Oval Office, late in the month. Kennedy, holding a message from Betancourt, to Goodwin: "I''d like to get a
        major statement on our Latin policy soon. Next to Berlin it''s the most critical area, and will be for a long time."
        He will "make a big commitment"; asks if something can be ready in a month: "I don''t care if everyone agrees. You
        know what our thinking is." Of Cuba: "I don''t want this to be an anti-Cuban speech. Just throw Castro in with the
        other dictators." Goodwin to draft an answer to a telegram from Somoza saying democracy for Nicaragua is Kennedy''s
        hope too.'
      n: '[[w.goodwin-remembering-america]], 146–48 (Goodwin''s account). Names: Kennedy, Goodwin, Betancourt, Castro. Check:
        the day; "Sometime toward the end of January" (146).'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:betancourt-romulo
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-02.intelligence-2
      when: Feb.
      date: 1961-02
      thread: intelligence
      c: 'Goodwin''s White House office. Cord Meyer of the CIA: "We ... thought you should know about some of the things we
        have been doing": the National Student Association, intellectual and literary publications in Western Europe, contributions
        to noncommunist parties from Italy to Peru. Meyer refers to Guatemala and Iran; not to the U-2 or the plans against
        Cuba.'
      n: '[[w.goodwin-remembering-america]], 169–70 (Goodwin''s account). Names: Goodwin. Check: the day; "A week or two after
        the inauguration" (169), late January or early February.'
      tags:
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-04.latin-america
      when: Mar. 4–5
      date: '1961-03-04'
      thread: latin-america
      c: 'Kennedy telephones Goodwin at home on both nights of the weekend, concerned at the threat of chaos in Bolivia: they
        must "get going on this matter"; he comments on the qualifications of those suggested for the mission.'
      n: '[[w.goodwin-remembering-america]], 152–53 (Goodwin''s account; "both nights of the preceding weekend," before Tuesday,
        Mar. 7). Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-07.latin-america-dominican-republic
      when: Mar. 7
      date: '1961-03-07'
      thread: latin-america-dominican-republic
      also:
      - latin-america
      c: '10 a.m. Goodwin with Berle on the Dominican Republic: cables tell of increased brutality by Trujillo''s regime since
        all the OAS states, the United States among them, broke relations after his attempt on Betancourt''s life. Kennedy,
        believing Trujillo''s overthrow inevitable, has asked for a contingency plan to guide the transition to a friendly
        democratic regime.'
      n: '[[w.goodwin-remembering-america]], 152 (Goodwin''s account; "Tuesday, March 7"). Names: Goodwin, Berle, Trujillo,
        Betancourt, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:berle-adolf-a
      - name:trujillo-rafael
      - name:betancourt-romulo
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-03-07.latin-america
      when: Mar. 7
      date: '1961-03-07'
      thread: latin-america
      c: 10:30 a.m. Schlesinger and Rostow with Goodwin in his office, on a special economic mission to Bolivia. With Kennedy's
        direction behind them, they decide the emissaries are to ignore the International Monetary Fund's and the State Department's
        proposals for anti-inflationary austerity and offer immediate economic assistance.
      n: '[[w.goodwin-remembering-america]], 152–53 (Goodwin''s account). See [[cal.1961-03-04.latin-america]]. Names: Schlesinger,
        Rostow, Goodwin, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:rostow-walt-w
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-03-07.cuba-2
      when: Mar. 7
      date: '1961-03-07'
      thread: cuba-bay-of-pigs
      also:
      - latin-america
      c: 11 a.m. Goodwin with men from the Defense Department and the CIA, on the desirability of setting up a revolutionary
        government should the invasion of Cuba, "still-conjectural," succeed.
      n: '[[w.goodwin-remembering-america]], 153 (Goodwin''s account). See [[cal.1961-02-07.cuba]]. Names: Goodwin.'
      tags:
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-07.civil-rights-the-executive
      when: Mar. 7
      date: '1961-03-07'
      thread: civil-rights-the-executive
      c: '2:30 p.m. Robert Kennedy telephones Goodwin, angry: "Too many people are getting involved in this thing" (civil
        rights). "We have to decide whether we are going to have an administration position and what it''s going to be." Goodwin
        takes it that the Attorney General will soon take full command.'
      n: '[[w.goodwin-remembering-america]], 153 (Goodwin''s account). Names: Robert Kennedy, Goodwin. Check: the day; Goodwin
        ties the call to the freedom riders'' "bloody trip to the heart of the South," which began in May 1961.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-07.latin-america-2
      when: Mar. 7
      date: '1961-03-07'
      thread: latin-america
      c: '5 p.m., the "fish room": a final conference of more than twenty on the address to the Latin American diplomats.
        Twice Kennedy calls Goodwin to the Oval Office: "I don''t want it on television. I can''t go to the well too often.
        This is not for the American people, it''s a message to Latin America. Let''s save our television for something like
        health or education. Make sure the speech is beamed to Latin America. Keep repeating it the next day."'
      n: '[[w.goodwin-remembering-america]], 154 (Goodwin''s account). Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-11.latin-america
      when: Mar. 11
      date: '1961-03-11'
      thread: latin-america
      c: 'The Oval Office. Goodwin brings Kennedy the draft of the Alliance for Progress address, which he must give "in two
        days." Kennedy reads it for a couple of hours, making editorial revisions: "Good job, Dick." Of the Spanish phrases:
        "But do I really have to say these words?" Goodwin: the whole idea is a partnership, and some Spanish words will be
        taken as a sign of respect. Kennedy: "Do you know any Spanish?" "Not much." "Well I don''t know any." "It would be
        nice if they could understand what I was saying. ... Maybe I''ll get Jackie to help me."'
      n: '[[w.goodwin-remembering-america]], 155–56 (Goodwin''s account; Goodwin had worked on the draft at home "a few days").
        Names: Kennedy, Goodwin. Check: the day; "I''ve got to give it in two days" (155), the address Mar. 13.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- cite:
    id: cal.1961-03-13.latin-america
    item: '[[w.goodwin-remembering-america]], 156–59 (that afternoon Kennedy in the Oval Office practices "techo ... techo;
      trabajo ... trabajo ... obero," Goodwin correcting him to "obrero"; the diplomatic corps and congressional leaders in
      the East Room at 5 p.m., the address at 6, quoted at length; to Goodwin after: "How was my Spanish?"; the ambassadors''
      reaction, "El Plan Kennedy")'
    units: all
- add:
    entry:
      id: cal.1961-03-14.latin-america
      when: Mar. 14
      date: '1961-03-14'
      thread: latin-america
      c: 'Kennedy to Goodwin, the morning after the address to the Latin American diplomats: "All right ... that''s the easy
        part. I made a speech. Now let''s show we mean it. Starting today."'
      n: '[[w.goodwin-remembering-america]], 167 (Goodwin''s account; he adds it was almost three weeks before he left for
        Rio, 167–68). See [[cal.1961-03-13.latin-america]]. Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-04-07.cuba-bay-of-pigs
      when: Apr. 7
      date: '1961-04-07'
      thread: cuba-bay-of-pigs
      also:
      - latin-america
      c: 'The White House mess, breakfast, the morning Goodwin leaves for Rio. Goodwin, with Schlesinger, Rostow and Bundy,
        on whether the momentum toward approving the landing can be stopped: "Even if the landings are successful ... and
        a revolutionary government is set up, they''ll have to ask for our help. And if we agree it''ll be a massacre. ...
        It''ll be an American Hungary." Bundy: "Why don''t you go over to see Rusk before you leave."'
      n: '[[w.goodwin-remembering-america]], 176–77 (Goodwin''s account; "Just prior to the week of final decision"). Names:
        Goodwin, Schlesinger, Rostow, Bundy, Rusk. Check: the day; by the call on Rusk that followed, [[cal.1961-04-07.cuba-2]].'
      tags:
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:rostow-walt-w
      - name:bundy-mcgeorge
      - name:rusk-dean
- cite:
    id: cal.1961-04-07.cuba-2
    item: '[[w.goodwin-remembering-america]], 176–77 (after the breakfast in the mess, Goodwin goes "almost immediately" to
      Rusk''s office, the morning of his departure for Rio; Rusk: "You know, Dick, maybe we''ve been oversold on the fact
      that we can''t say no to this thing"; not Kennedy''s decision or the 800 men)'
    units: A, B
- add:
    entry:
      id: cal.1961-04.cuba-bay-of-pigs-11
      when: Apr., before the 12th
      date: 1961-04
      thread: cuba-bay-of-pigs
      c: 'A council of war before the press conference of Apr. 12. A staff member who had sent Kennedy a memorandum against
        the plan suggests that if the exiles proclaim a government, are recognized, and ask for help, supporting forces might
        have to go in. Kennedy: "Under no circumstances. The minute I land one marine, we''re in this thing up to our necks.
        I can''t get the United States into a war, and then lose it, no matter what it takes. I''m not going to risk an American
        Hungary. And that''s what it could be, a fucking slaughter. ... Is that understood, gentlemen?" The deputy director
        of the CIA and the Joint Chiefs'' representative: "Yes, Mr. President."'
      n: '[[w.goodwin-remembering-america]], 174 (Goodwin''s account; the staff member not named). Names: Kennedy. Check:
        the day.'
      tags:
      - name:kennedy-john-f
- cite:
    id: cal.1961-04-12.cuba
    item: '[[w.goodwin-remembering-america]], 174 (the press conference of Apr. 12: "There will not be, under any conditions,
      an intervention in Cuba by United States forces. ... The basic issue ... is between the Cubans themselves"; not the
      second pledge)'
    units: A
- add:
    entry:
      id: cal.1961-04.cuba-bay-of-pigs-12
      when: Apr.
      date: 1961-04
      thread: cuba-bay-of-pigs
      c: 'The State Department. Bissell goes over the final plans: the exiles "to establish a beachhead, establish a revolutionary
        government, and rally the oppressed army and people of Cuba to the banner of liberation." If they cannot hold: "they''ll
        move into the mountains here ... and form guerrilla units which we can resupply by air. That''s the worst that can
        happen." Goodwin asks how we know the Cuban people will support the rebels; Bissell, to his uniformed aide: "We have
        an NIE [National Intelligence Estimate] on that, don''t we?" The officer nods.'
      n: '[[w.goodwin-remembering-america]], 174–76 (Goodwin''s account; the map not topographical, the swamps not shown;
        the contingency never told the brigade). Names: Bissell, Goodwin. Check: the day; "that same week" as the press conference
        of Apr. 12 (174).'
      tags:
      - name:bissell-richard-m-jr
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-04.cuba-4
      when: Apr.
      date: 1961-04
      thread: cuba-bay-of-pigs
      c: 'The Oval Office, on Goodwin''s return from Rio, the invasion approved. Kennedy leads him to a window over the Rose
        Garden: "Well, Dick, it looks like we''re finally going to put your Cuban policy into action": Goodwin''s campaign
        statement on the "freedom fighters."'
      n: '[[w.goodwin-remembering-america]], 179–80 (Goodwin''s account). See [[cal.1960-10-19.elections-1960-kennedy]]. Names:
        Kennedy, Goodwin. Check: the day; on Goodwin''s return from Rio, before the landing of Apr. 17.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-04-20.cuba-6
      when: Apr. 20
      date: '1961-04-20'
      thread: cuba
      c: 'The Oval Office, a few hours after the address to the newspaper editors. Goodwin tells Kennedy his words on unilateral
        intervention were unwise: "a kind of vague threat in the face of defeat," when "we have no intention at all of intervening
        in Cuba." Kennedy: "I didn''t want us to look like a paper tiger. We should scare people a little, and I did it to
        make us appear still tough and powerful. ... Anyways, it''s done. You may be right, but it''s done."'
      n: '[[w.goodwin-remembering-america]], 180–81 (Goodwin''s account, from his notes: "the first time I had made an ex
        post facto criticism of the president"). See [[cal.1961-04-20.cuba]]. Names: Goodwin, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
- cite:
    id: cal.1961-04-20.cuba
    item: '[[w.goodwin-remembering-america]], 180 ("the day after the invasion collapsed," "the most truculent statement of
      his administration": "our restraint is not inexhaustible"; "we do not intend to be lectured on intervention by those
      whose character was stamped for all time on the bloody streets of Budapest"; not the editors or the space question)'
    units: '?'
- cite:
    id: cal.1961-04-21.cuba-bay-of-pigs-3
    item: '[[w.goodwin-remembering-america]], 181 (Goodwin''s account, from his notes: the breakfast before the press conference;
      Kennedy: "The happiest people in government today are the ones who can say they didn''t know anything about it"; "I''ll
      make a short opening statement designed to cut off questions about Cuba, and not take any more questions on the subject";
      concern that the blame not fall wholly on the CIA, after Reston''s story that the operation was not properly staffed
      and had no NSC meeting; "It was decided to leak the story that this operation had been carefully studied by the Joint
      Chiefs of Staff, and approved"; he "could fire Allen Dulles," but Dulles "helped keep the Republicans off his back";
      "if we just sit tight for about three weeks, things will cool off"; not those present by name, Fulbright or Schlesinger''s
      memorandum)'
    units: '?'
- cite:
    id: cal.1961-05.cuba-2
    item: '[[w.goodwin-remembering-america]], 189 (at the State Department, some twenty at the table; McNamara, his hand on
      Goodwin''s shoulder: "The only thing to do is eliminate Castro"; the CIA man: "You mean Executive Action"; McNamara:
      "I mean it, Dick, it''s the only way"; the CIA''s memorandum "for the files")'
    units: B, C
- check:
    id: cal.1961-05.cuba-2
    text: 'Check: the day. [[w.goodwin-remembering-america]], 189, puts the meeting "sometime around the middle of May."'
- add:
    entry:
      id: cal.1961-05.latin-america-5
      when: May
      date: 1961-05
      thread: latin-america
      c: 'Kennedy to Goodwin by telephone: "Let''s get moving on the Alliance for Progress ... before they think I didn''t
        mean it, that all we care about is Castro." Goodwin: the conference is set for the beginning of August, and he cannot
        get the State Department to agree on a position. Kennedy: "It ought to be tomorrow. ... We already have a position.
        Tell them to read my speech. ... Never mind. I''ll talk to Dillon."'
      n: '[[w.goodwin-remembering-america]], 190 (Goodwin''s account). Names: Kennedy, Goodwin, Castro, Dillon. Check: the
        day; "A few weeks after the disaster in Cuba" (190).'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:castro-fidel
      - name:dillon-c-douglas
- add:
    entry:
      id: cal.1961-08-04.latin-america
      when: Aug. 4
      date: '1961-08-04'
      thread: latin-america
      c: 'Punta del Este, the night before the conference opens. In Dillon''s hotel room Goodwin objects that the delegation
        has only words to give. Dillon: "I''ll pledge a billion dollars a year." Ed Martin of the State Department: "We can''t
        do that. Nobody has approved it. It hasn''t been cleared." Dillon: "Of course I have the authority ... I''m the personal
        representative of the president of the United States ... Plenipotentiary. It says so on my credentials. And I''m going
        to give them a billion dollars."'
      n: '[[w.goodwin-remembering-america]], 191–92 (Goodwin''s account). Names: Goodwin, Dillon, Martin.'
      tags:
      - name:goodwin-richard-n
      - name:dillon-c-douglas
      - name:martin-edwin-m
      - city:punta-del-este
- cite:
    id: cal.1961-08-05.latin-america
    item: '[[w.goodwin-remembering-america]], 192–93 (Aug. 5, the opening session: Dillon reads Kennedy''s statement, "at
      least one billion dollars in development assistance to Latin America in the first year of the Alliance"; Guevara, headset
      on, after the session: "We will see. Messages are words. The facts are stubborn"; Dillon''s promise of twenty billion
      over the decade on land and tax reform; not the Council by name)'
    units: A, C, D
- add:
    entry:
      id: cal.1961-08.latin-america
      when: Aug.
      date: 1961-08
      thread: latin-america
      also:
      - cuba
      c: 'Punta del Este, during the conference. Guevara, to a young member of the Argentine delegation, of Goodwin''s cigars:
        "I see Goodwin likes cigars ... I bet he wouldn''t dare smoke Cuban cigars." The next day a polished-mahogany box
        of Havanas arrives at Goodwin''s room, with Guevara''s typed, signed note, in Spanish: "Since I have no greeting card,
        I have to write. Since to write to an enemy is difficult, I limit myself to extending my hand."'
      n: '[[w.goodwin-remembering-america]], 195–96 (Goodwin''s account; the note in his English). Names: Guevara, Goodwin.
        Check: the day, between Aug. 5 and the last day of the conference.'
      tags:
      - name:guevara-ernesto
      - name:goodwin-richard-n
      - city:punta-del-este
- add:
    entry:
      id: cal.1961-08.latin-america-2
      when: Aug.
      date: 1961-08
      thread: latin-america
      also:
      - cuba
      c: 'Punta del Este, the day after the cigars. The same Argentine tells Goodwin that Guevara would like to talk with
        him informally, at a small private party after the conference. Goodwin tells Dillon, who answers: "I don''t see what
        harm it can do."'
      n: '[[w.goodwin-remembering-america]], 196 (Goodwin''s account; Dillon "soon retracted his agreement" after Guevara''s
        speech on the last day). See [[cal.1961-08.latin-america]]. Names: Guevara, Goodwin, Dillon. Check: the day.'
      tags:
      - name:guevara-ernesto
      - name:goodwin-richard-n
      - name:dillon-c-douglas
- cite:
    id: cal.1961-08-17.latin-america
    item: '[[w.goodwin-remembering-america]], 196–202 (on the last day the ministers but Guevara sign the Charter of Punta
      del Este; Guevara''s speech, the Alliance "an instrument of economic imperialism"; Dillon''s reply; the talk the next
      night at a Montevideo party, from about 2 a.m. to almost 6, in a sitting room, an Argentine and a Brazilian interpreting,
      Juan de Onis sent out; Guevara thanks the United States for the Bay of Pigs and proposes a modus vivendi; Goodwin''s
      notes for a memorandum to Kennedy)'
    units: A
- check:
    id: cal.1961-08-17.latin-america
    text: 'Check: the day. [[w.goodwin-remembering-america]], 196–99, has the Charter signed on the last day, the delegation
      driving to Montevideo "the next day," and the talk beginning about 2 a.m. at a party that night: the night of Aug. 18–19.'
- add:
    entry:
      id: cal.1961-08-19.latin-america
      when: Aug. 19
      date: '1961-08-19'
      thread: latin-america
      also:
      - cuba
      c: 'The White House, on the delegation''s return from Punta del Este. After Kennedy''s greeting on the lawn, Goodwin
        walks in with him and tells him of the talk with Guevara. No sign of annoyance: "Write up a complete account ... and
        circulate it to Rusk, Bundy, and the others." He opens Guevara''s box of Cuban cigars, lights one: "You should have
        smoked the first one."'
      n: '[[w.goodwin-remembering-america]], 202 (Goodwin''s account). See [[cal.1961-08-17.latin-america]]. Names: Kennedy,
        Goodwin, Guevara, Rusk, Bundy. Check: the day; by the book, the talk with Guevara ran to almost 6 a.m., the night
        after the drive to Montevideo, and the delegation then flew eleven hours to Andrews.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:guevara-ernesto
      - name:rusk-dean
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1961-08.cuba
      when: Aug.
      date: 1961-08
      thread: cuba
      c: 'Goodwin to Kennedy, in a memorandum on Cuba policy after the Punta del Este conference and the talk with Guevara:
        "Pay as little attention as possible to Cuba. Do not allow them to appear as the victims of U.S. aggression. Do not
        create the impression we are obsessed with Castro — an impression which only strengthens Castro''s hand in Cuba and
        encourages anti-American and leftist forces in other countries to rally round the Cuban flag."'
      n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account, quoting the memorandum). Names: Goodwin, Kennedy, Castro.
        Check: the day; after the conference and the talk with Guevara (203).'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-08.latin-america-3
      when: Aug.
      date: 1961-08
      thread: latin-america
      also:
      - cuba
      c: Guevara, from Punta del Este, visits his native Argentina and meets President Frondizi, supposedly in secret. The
        military learn of it at once; in Buenos Aires, charges that Frondizi seeks an accommodation with the communists.
      n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account). Names: Guevara, Frondizi. Check: the day.'
      tags:
      - name:guevara-ernesto
      - name:frondizi-arturo
- add:
    entry:
      id: cal.1961-08.latin-america-4
      when: Aug.
      date: 1961-08
      thread: latin-america
      also:
      - cuba
      c: 'Adolfo Mugica, Argentina''s foreign minister, in Frondizi''s defense: it was perfectly all right for Frondizi to
        talk with Guevara, because Goodwin had been negotiating with Guevara in Montevideo. The American press picks it up.'
      n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account). See [[cal.1961-08.latin-america-3]]. Names: Frondizi,
        Guevara, Goodwin. Check: the day.'
      tags:
      - name:frondizi-arturo
      - name:guevara-ernesto
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-08.latin-america-5
      when: Aug.
      date: 1961-08
      thread: latin-america
      c: 'Goodwin telephones the Argentine ambassador: Mugica''s statement is inaccurate and disturbing.'
      n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account). See [[cal.1961-08.latin-america-4]]. Names: Goodwin.
        Check: the day.'
      tags:
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-08.latin-america-6
      when: Aug.
      date: 1961-08
      thread: latin-america
      also:
      - cuba
      c: The White House denies that the United States has made any deals with Castro.
      n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account; the words not given). See [[cal.1961-08.latin-america-4]].
        Names: Castro. Check: the day.'
      tags:
      - name:castro-fidel
      - polity:us
- add:
    entry:
      id: cal.1961-08.latin-america-7
      when: Aug.
      date: 1961-08
      thread: latin-america
      also:
      - cuba
      c: 'Mugica, sacrificed by Frondizi to the military, announcing his resignation: what he had said about "Goodwin" was
        true just the same, and the Goodwin–Guevara conference showed that Castro''s regime sought better relations with the
        United States.'
      n: '[[w.goodwin-remembering-america]], 203–4 (Goodwin''s account; the story then on the front page of the *Washington
        Post*, 204). See [[cal.1961-08.latin-america-4]]. Names: Frondizi, Goodwin, Guevara, Castro. Check: the day; "a few
        days" after the White House''s denial (203).'
      tags:
      - name:frondizi-arturo
      - name:goodwin-richard-n
      - name:guevara-ernesto
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-10.latin-america-2
      when: Oct., late
      date: 1961-10
      thread: latin-america
      c: 'Press conference. Kennedy, asked of the "criticism of our handling of inter-American affairs" caused by "advisers
        in the White House duplicating and sometimes overriding people in the State Department": "when things are noncontroversial,
        beautifully coordinated, and all the rest, it may be that there is not much going on. ... So we are attempting to
        do something about Latin America, and there is bound to be a ferment."'
      n: '[[w.goodwin-remembering-america]], 210 (the reply "long and semiapologetic," quoted in part). To check: the press
        conference, in the Public Papers, 1961. Names: Kennedy. Check: the day; "In late October" (210).'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-10.transition-and-staff
      when: Oct., late
      date: 1961-10
      thread: transition-and-staff
      also:
      - latin-america
      c: 'The Oval Office, the afternoon after the press conference, Bundy there. Kennedy to Goodwin: "You know, Dick, maybe
        we''d be better off if you were in the State Department, closer to the action." Then, brushing it aside: "Hell ...
        if Dick goes over there, we''ll never hear anything about Latin America."'
      n: '[[w.goodwin-remembering-america]], 210 (Goodwin''s account). See [[cal.1961-10.latin-america-2]]. Names: Kennedy,
        Goodwin, Bundy. Check: the day; "The following afternoon," after the press conference of "late October" (210).'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:bundy-mcgeorge
- cite:
    id: cal.1961-05.latin-america-4
    item: '[[w.goodwin-remembering-america]], 210 (Goodwin tells Kennedy, Bundy gone, of his discovery that the CIA "had actually
      transferred some small weapons to a group that wished to overthrow Trujillo by assassination"; Kennedy, angry: "Tell
      them no more weapons. The United States is not to get involved in any assassinations. I''d like to get rid of Trujillo,
      but not that way"; not the document, "neutralize," the words of B or Dearborn)'
    units: '?'
- check:
    id: cal.1961-05.latin-america-4
    text: 'Check: the day and the words. [[w.goodwin-remembering-america]], 210, puts Goodwin''s report to Kennedy on the
      afternoon after a press conference of "late October" 1961, months after Trujillo''s death (May 30), with Kennedy''s
      words: "Tell them no more weapons. The United States is not to get involved in any assassinations. I''d like to get
      rid of Trujillo, but not that way."'
- add:
    entry:
      id: cal.1961-11.transition-and-staff-2
      when: Nov.
      date: 1961-11
      thread: transition-and-staff
      also:
      - latin-america
      c: 'The South Lawn, a November afternoon, Kennedy leaving by helicopter for a weekend at his Virginia estate. He beckons
        Goodwin to the steps and says over the rotors: "You know, Dick, I think you''ll be more effective in the State Department.
        ... I''m going to announce it next week." Mounting the steps: "We''ll talk about it when I get back." The talk never
        took place.'
      n: '[[w.goodwin-remembering-america]], 210–11 (Goodwin''s account). Names: Kennedy, Goodwin. Check: the day; before
        the announcement of the State Department changes, Nov. 17 (212).'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- cite:
    id: cal.1961-12-16.latin-america
    item: '[[w.goodwin-remembering-america]], 214 (Kennedy asks Goodwin by telephone whether to go despite the Secret Service:
      "I think the trip will be a triumph"; Goodwin drafts all his speeches for Venezuela and Colombia; at the Caracas airport:
      "Listen, Dick, if this doesn''t work out, you''d better keep on going south"; at Bogotá at least 500,000)'
    units: all
- add:
    entry:
      id: cal.1961-12-17.latin-america
      when: Dec. 17
      date: '1961-12-17'
      thread: latin-america
      c: 'Bogotá, the presidential palace, after the motorcade through the crowds, before the state dinner. Lleras Camargo
        to Kennedy: "Do you know why those people were out there cheering for you today? ... Because they think you''re on
        their side against the oligarchs. You had better keep it that way."'
      n: '[[w.goodwin-remembering-america]], 149 (Goodwin''s account; "Later, in 1961"; the day by the visit to Bogotá). See
        [[cal.1961-12-16.latin-america]]. Names: Lleras Camargo, Kennedy.'
      tags:
      - name:lleras-camargo-alberto
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-03.latin-america-3
      when: Mar.
      date: 1962-03
      thread: latin-america
      c: 'Chile. Moscoso, of the Alliance for Progress, and Goodwin, on a special mission to the Alessandri government in
        its economic crisis: 140 million dollars, only on a promise to begin the reforms pledged at Punta del Este, land redistribution
        among them. Goodwin: "if you don''t do something about these changes soon, Allende ... will win the next election."
        The young minister of finance: "The problem is that you just don''t understand Chile."'
      n: '[[w.goodwin-remembering-america]], 215 (Goodwin''s account). Names: Goodwin, Alessandri, Allende. Check: the day;
        "In March of 1962" (215).'
      tags:
      - name:goodwin-richard-n
      - name:alessandri-rodriguez-jorge
      - name:allende-gossens-salvador
- add:
    entry:
      id: cal.1962-03.latin-america-4
      when: Mar.
      date: 1962-03
      thread: latin-america
      c: 'With Goodwin out of the country, Ball moves Woodward, Assistant Secretary of State for Latin America, to be ambassador
        to Spain, and puts Edwin Martin in his place. Ball to Woodward: "because you haven''t been able to control that boy."
        Woodward: "How can I control him? He''s a White House man."'
      n: '[[w.goodwin-remembering-america]], 215 (Goodwin''s account, after newspaper accounts "whose accuracy I later confirmed").
        See [[cal.1962-03.latin-america-3]]. Names: Ball, Woodward, Martin, Goodwin. Check: the day.'
      tags:
      - name:ball-george-w
      - name:woodward-robert-f
      - name:martin-edwin-m
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1962-07-03.transition-and-staff
      when: July 3
      date: '1962-07-03'
      thread: transition-and-staff
      also:
      - peace-corps
      - latin-america
      c: 'Kennedy telephones Goodwin, who has gone to work with Shriver at the Peace Corps without leave from State: "Bobby
        told me yesterday about your work in the Peace Corps. Whatever you feel like doing is okay with me ... but I want
        you to wait until after the Brazil trip ... I want you to go down in the advance party, and also there is the problem
        of speeches. ... Anyway ... if we ever do put out any announcement on your Peace Corps assignment I think we ought
        to emphasize the Latin American part of the work."'
      n: '[[w.goodwin-remembering-america]], 216 (Goodwin''s account; the Brazil trip "later postponed"). Names: Kennedy,
        Goodwin, Shriver, Robert Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:shriver-r-sargent
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-10.missile-crisis-diplomacy-2
      when: Oct.
      date: 1962-10
      thread: missile-crisis-diplomacy
      also:
      - latin-america
      c: 'At the White House''s request Goodwin works with Schlesinger on the draft of Stevenson''s speech for the United
        Nations: its subject, the Soviet missiles in Cuba. Goodwin is then to go with Dillon to Mexico City, to the meeting
        of the Latin American foreign ministers, to explain Kennedy''s naval quarantine before he announces it.'
      n: '[[w.goodwin-remembering-america]], 217 (Goodwin''s account; he did not take part in the secret deliberations). Names:
        Goodwin, Schlesinger, Stevenson, Dillon, Kennedy. Check: the day; "In mid-October of 1962" (217).'
      tags:
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:stevenson-adlai-e
      - name:dillon-c-douglas
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-03-18.latin-america-2
      when: Mar. 18
      date: '1963-03-18'
      thread: latin-america
      c: 'San José, Kennedy''s hotel room, the night of arrival; Goodwin there with O''Donnell and Powers. Kennedy, jacket
        off, goes to the window to wave to the crowd in the street: "If we could only move them all to Ohio, just for the
        election. I might carry the damn state." Of cables from Southeast Asia: "Think of all the energy and time we''re putting
        in over there. This is where we should be putting our attention. It''s all going to be decided down here. ... It''s
        going to be the biggest foreign-policy issue in the election, Latin America."'
      n: '[[w.goodwin-remembering-america]], 221 (Goodwin''s account). See [[cal.1963-03-18.latin-america]]. Names: Kennedy,
        Goodwin, O''Donnell, Powers.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:odonnell-kenneth-p
      - name:powers-david-f
      - city:san-jose
- cite:
    id: cal.1963-03-18.latin-america
    item: '[[w.goodwin-remembering-america]], 221 (Goodwin goes with Kennedy to Costa Rica for a "summit" with the leaders
      of all the Central American countries, and drafts his speeches, 214; not San José, Panama or the Declaration)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-16.latin-america
      when: Nov. 16–17
      date: '1963-11-16'
      thread: latin-america
      c: Palm Beach, the weekend. Goodwin, flown down, works on Kennedy's speech on the Alliance for Progress for a convention
        of publishers at Miami.
      n: '[[w.goodwin-remembering-america]], 224 (Goodwin''s account). Names: Goodwin, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
      - state:fl
- cite:
    id: cal.1963-11-18.cuba
    item: '[[w.goodwin-remembering-america]], 224 (Kennedy''s speech on the Alliance for Progress "to a convention of publishers
      in Miami," drafted with Goodwin at Palm Beach; the publishers "not very enthusiastic," Kennedy "not in his best form";
      not the Inter-American Press Association or the words)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-19.press-and-broadcasting
      when: Nov. 19
      date: '1963-11-19'
      thread: press-and-broadcasting
      also:
      - latin-america
      c: 'Evelyn Lincoln''s office. Kennedy tells Goodwin he thought the Miami speech went well, then picks up the Washington
        Daily News, "Kennedy Gets Mild Response from Publishers," and is infuriated: "It serves me right to talk to publishers.
        I don''t want to talk to publishers again. It doesn''t do any good. What about that dinner in New York? Do I have
        to do that?" To Goodwin: "Come and see me tomorrow."'
      n: '[[w.goodwin-remembering-america]], 224 (Goodwin''s account). See [[cal.1963-11-18.cuba]]. Names: Kennedy, Goodwin,
        Lincoln.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:lincoln-evelyn
- add:
    entry:
      id: cal.1963-11-20.latin-america
      when: Nov. 20
      date: '1963-11-20'
      thread: latin-america
      c: 'The White House. Goodwin brings a group of Latin American artists and intellectuals, who urge Kennedy to make his
        brother head of all Latin American affairs, "a kind of hemispheric superchief." Kennedy: "It''s a good idea ... I
        understand you''re going to see the attorney general later in the day. Why don''t you ask Bobby if he''ll take the
        job."'
      n: '[[w.goodwin-remembering-america]], 224 (Goodwin''s account). Names: Kennedy, Robert Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1963-11-20.robert-kennedy-3
      when: Nov. 20
      date: '1963-11-20'
      thread: robert-kennedy
      also:
      - latin-america
      c: Later the same day the Latin American artists and intellectuals put it to Robert Kennedy that he head all Latin American
        affairs. He is receptive, but noncommittal.
      n: '[[w.goodwin-remembering-america]], 224 (Goodwin''s account, in a parenthesis). See [[cal.1963-11-20.latin-america]].
        Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1963-11-20.latin-america-2
      when: Nov. 20
      date: '1963-11-20'
      thread: latin-america
      also:
      - transition-and-staff
      c: 'The Oval Office, the afternoon. Goodwin and Schlesinger again urge an undersecretary of state for Latin America,
        a relative of the President if need be. Kennedy: "I''ve told Rusk three times that I thought we should have an undersecretary
        for Latin affairs. All I get back is that it''s being studied. Arthur, you and Dick write a memo for me to sign. Say
        that I already know the reasons why I can''t do it. Now I want the reasons why I can do it." He approves Goodwin''s
        names for the Council of the Arts and asks for James Fleming of Indiana; of the Council as a concern with the aesthetics
        of the society: "It''s a good idea ... let''s work on it." Goodwin never saw him again.'
      n: '[[w.goodwin-remembering-america]], 224–25 (Goodwin''s account). Names: Kennedy, Goodwin, Schlesinger, Rusk.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:rusk-dean
- add:
    entry:
      id: cal.1963-11-21.transition-and-staff
      when: Nov. 21
      date: '1963-11-21'
      thread: transition-and-staff
      c: 'Thursday morning. Milton Esterow of the *New York Times* telephones Goodwin: he is writing for the next day''s paper
        that Kennedy intends to appoint him presidential adviser on the arts, with a "Man in the News" profile. Goodwin says
        nothing is definite, and answers his personal questions.'
      n: '[[w.goodwin-remembering-america]], 225 (Goodwin''s account). Names: Goodwin, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
      also:
      - press-and-broadcasting
- add:
    entry:
      id: cal.1963-11-21.transition-and-staff-2
      when: Nov. 21
      date: '1963-11-21'
      thread: transition-and-staff
      c: 'Goodwin telephones Kennedy''s party in Texas and tells the assistant press secretary of Esterow''s story. Within
        the hour he calls back: Kennedy wants Goodwin to prepare a statement on his appointment and send it down for release
        on Friday afternoon, Nov. 22.'
      n: '[[w.goodwin-remembering-america]], 225 (Goodwin''s account). See [[cal.1963-11-21.transition-and-staff]]. Names:
        Goodwin, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-11-22.press-and-broadcasting-3
      when: Nov. 22
      date: '1963-11-22'
      thread: press-and-broadcasting
      also:
      - transition-and-staff
      c: 'The *New York Times*, the morning edition: Esterow''s story of Kennedy''s intention to appoint Goodwin presidential
        adviser on the arts, with Goodwin as "Man in the News."'
      n: '[[w.goodwin-remembering-america]], 225–26 (Goodwin''s account: "very favorable"). To check: the *New York Times*,
        Nov. 22, 1963. See [[cal.1963-11-21.transition-and-staff]]. Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1963-11-22.assassination-16
      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      c: 'The White House, from the afternoon. Goodwin, told the President is dead, goes to Ralph Dungan''s office, where
        Shriver, Bundy, Sorensen and others are at work on the arrangements. With Shriver, Walton and Schlesinger he prepares
        the East Room as it was when Lincoln lay there, at Mrs. Kennedy''s wish: a catafalque from Fort Myer, black crepe,
        candlesticks, Shriver''s crucifix, an honor guard. Shriver rules that the public will view the body at the Capitol
        Rotunda. Schlesinger: "What kind of a country is this?"'
      n: '[[w.goodwin-remembering-america]], 226–29 (Goodwin''s diary, repeated "slightly edited"). Names: Goodwin, Dungan,
        Shriver, Bundy, Sorensen, Walton, Schlesinger, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:dungan-ralph-a
      - name:shriver-r-sargent
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:walton-william
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
- cite:
    id: cal.1963-11-23.assassination-6
    item: '[[w.goodwin-remembering-america]], 230–31 (Goodwin in the East Room corner with Salinger, Schlesinger, Walton and
      Dungan; the casket placed; the altar boy and the candles; a short prayer; Mrs. Kennedy kneels, her cheek on the flag;
      Robert Kennedy opens the casket and asks Walton and Schlesinger to look, the face "white and waxy"; open 5–10 minutes,
      then closed; not Nancy Tuckerman or the vote)'
    units: A
- add:
    entry:
      id: cal.1963-11.latin-america
      when: Nov., late
      date: 1963-11
      thread: latin-america
      c: 'Goodwin to Johnson, at his request, a memorandum on the Alliance for Progress: "We have only eleven months [before
        the election] to demonstrate that the Alliance is going ahead full steam. ... You need someone in over-all charge
        who will be a symbol of your personal concern and determination." He suggests Shriver or Robert Kennedy.'
      n: '[[w.goodwin-remembering-america]], 244–45 (Goodwin''s account, quoting the memorandum). Names: Goodwin, Johnson,
        Shriver, Robert Kennedy. Check: the day; "In late November 1963" (244).'
      tags:
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - name:shriver-r-sargent
      - name:kennedy-robert-f
- cite:
    id: cal.1963-12-14.latin-america
    item: '[[w.goodwin-remembering-america]], 244–45 (Salinger announces the return of Mann as assistant secretary of state
      for inter-American affairs, Saturday, Dec. 14, "In about two weeks" after Goodwin''s memorandum; Schlesinger sends Goodwin
      the briefing transcript marked "R.I.P."; not the embassy in Mexico or the Kennedys unconsulted)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-15.latin-america
      when: Dec. 15
      date: '1963-12-15'
      thread: latin-america
      c: 'Sunday morning. Pedro San Juan, who had been Kennedy''s interpreter and adviser on Latin American trips, telephones
        Goodwin: "I am going to write an obituary ... the Alliance for Progress, born October 1960, died, December 14, 1963."
        Goodwin''s diary: "There is real gloom among the advocates of the Alliance for Progress. Mann is a colonialist by
        mentality ..."'
      n: '[[w.goodwin-remembering-america]], 245 (Goodwin''s account, quoting his diary). See [[cal.1963-12-14.latin-america]].
        Names: Goodwin, Mann.'
      tags:
      - name:goodwin-richard-n
      - name:mann-thomas-c
- cite:
    id: cal.1963-12-13.robert-kennedy-2
    item: '[[w.goodwin-remembering-america]], 246–47 (Goodwin''s account: Schlesinger and Goodwin in the Attorney General''s
      office over Mann''s appointment; Robert Kennedy, pouring bourbon, takes a call: "He''s dead. Let him be dead"; Harriman''s
      words to him "last night": "I didn''t come down here to work for George Ball or Dean Rusk; I came to work for John Kennedy";
      "We''re important to Johnson. I''m the most important because my name happens to be Kennedy. But we''re all important,
      if we act together"; "I''ve lost a brother, but that''s not what''s important"; of a Lubell column, Johnson: "Well,
      he''s already got the Negroes"; not the hour, the hundred men or the journal''s words)'
    units: '?'
- check:
    id: cal.1963-12-13.robert-kennedy-2
    text: 'Check: the day and the words. [[w.goodwin-remembering-america]], 246–47, has Schlesinger and Goodwin call on Robert
      Kennedy on Monday, Dec. 16, 1963, after Mann''s appointment was announced (Dec. 14), and Robert Kennedy: "Remember after
      November fifth [the presidential election] we''re all done."'
- add:
    entry:
      id: cal.1964-03-17.latin-america-panama
      when: Mar. 17
      date: '1964-03-17'
      thread: latin-america-panama
      c: 'The Oval Office. Johnson, coming out as Goodwin stands in the West Wing corridor during Shriver''s Peace Corps meeting
        in the fish room: "Tell me, Dick, what do you think we should do about this Panama thing?" Goodwin: "Tell them they''re
        a great country, our allies in the fight for freedom, that they''ve fought beside us in war and been our friends in
        peace, that we''re grateful, glad to have them as friends, anxious to keep a small misunderstanding from damaging
        such a valuable relationship." Johnson: "Can you write me a statement?" "Send it over to Jack Valenti. He''ll make
        sure it gets right to me." Goodwin finishes it by early evening; Valenti sends a messenger for it.'
      n: '[[w.goodwin-remembering-america]], 250–52 (Goodwin''s account). Check: the day; "Around March 17" (250). Names:
        Johnson, Goodwin, Shriver, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:valenti-jack
      - name:shriver-r-sargent
- add:
    entry:
      id: cal.1964-03-21.latin-america-panama
      when: Mar. 21
      date: '1964-03-21'
      thread: latin-america-panama
      c: 'The White House. Johnson walks into George Reedy''s morning briefing: "Is it all right with you folks, if I monitor
        your press conference?" He reads a statement, to go to the president of the OAS that afternoon: the inability to resolve
        differences with Panama "a source of deep regret"; "We are prepared to review every issue ... at any time and at any
        place." Goodwin''s draft, marginally amended, after four days without acknowledgment.'
      n: '[[w.goodwin-remembering-america]], 252 (Goodwin''s account; the statement quoted in part). See [[cal.1964-03-17.latin-america-panama]].
        Names: Johnson, Reedy, Goodwin.'
      tags:
      - name:johnson-lyndon-b
      - name:reedy-george-e
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1964-03-24.latin-america-panama
      when: Mar. 24
      date: '1964-03-24'
      thread: latin-america-panama
      c: 'President Chiari of Panama welcomes Johnson''s "constructive evaluation": "Rightly does President Johnson recognize
        ... that there is no malice or hate in the demands of Panama because they are just and sincere. ... I am willing to
        act in this way."'
      n: '[[w.goodwin-remembering-america]], 252–53 (quoted in part). See [[cal.1964-03-21.latin-america-panama]]. Names:
        Chiari, Johnson.'
      tags:
      - name:chiari-roberto-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-03.transition-and-staff
      when: Mar.
      date: 1964-03
      thread: transition-and-staff
      c: 'Valenti, having asked Goodwin for a speech for a Democratic party gathering, hears the draft the next day: it is
        "just the sort of thing he wanted for LBJ." "LBJ''s way of speaking is a lot closer to Roosevelt than to Kennedy.
        Kennedy''s stuff might have been fine for him, but not for Johnson." He will recommend that the president bring Goodwin
        to the White House, and take the speech up "in its pristine form."'
      n: '[[w.goodwin-remembering-america]], 253 (Goodwin''s account). Check: the day; the day after Valenti asked for the
        speech, "Within a day or two" of the statement of Mar. 21 (253). Names: Valenti, Goodwin, Johnson, Kennedy.'
      tags:
      - name:valenti-jack
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1964-03.transition-and-staff-2
      when: Mar.
      date: 1964-03
      thread: transition-and-staff
      c: 'Pennsylvania Avenue, midmorning. Bundy, whom Goodwin has not talked with in almost a year, hails him: "We really
        miss you at the White House, Dick. We could really use someone of your abilities." That afternoon the offer is made
        and accepted; Goodwin''s responsibilities are to be almost exclusively domestic.'
      n: '[[w.goodwin-remembering-america]], 254 (Goodwin''s account). Check: the day; the morning after the talk with Robert
        Kennedy. Names: Bundy, Goodwin.'
      tags:
      - name:bundy-mcgeorge
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1964-03.transition-and-staff-3
      when: Mar.
      date: 1964-03
      thread: transition-and-staff
      also:
      - program
      c: 'The mansion, a morning. Johnson, in the bathroom off his bedroom, to Goodwin: "I wanted you to work for me. Some
        folks around here, some of your Kennedy friends, were against it. ... Look, Dick, I need you. I need you more than
        Kennedy ever did. And you need me." "I''m going to pass all those bills you cared about." "You''re going to be my
        voice, my alter ego, like Harry Hopkins." "I''m going to get my War on Poverty. ... But no compromises on civil rights.
        I''m not going to bend an inch, this year or next. Those civil rightsers are going to have to wear sneakers to keep
        up with me."'
      n: '[[w.goodwin-remembering-america]], 256–58 (Goodwin''s account). Check: the day; "one morning in late March 1964"
        (256). Names: Johnson, Goodwin, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1964-05-22.program-2
      when: May 22
      date: '1964-05-22'
      thread: program
      c: 'The Oval Office, the morning. Goodwin, with Moyers, brings Johnson the draft of the Michigan commencement address,
        finished the night before. Johnson, penciling changes, reads it, then reads it again, more slowly. Goodwin: "It''s
        very different from Kennedy, Mr. President ... It''s a whole new direction for the Democratic party." Johnson: "It
        ought to do just fine, boys. Just what I told you." Then, to Valenti: "What time''s that damn plane leave? And why
        are we always running out of Fresca?"'
      n: '[[w.goodwin-remembering-america]], 277–78 (Goodwin''s account; Goodwin, having decided not to go to Ann Arbor, to
        see the Signal Corps'' videotape). See [[cal.1964-05-22.program]]. Names: Goodwin, Moyers, Johnson, Valenti.'
      tags:
      - name:goodwin-richard-n
      - name:moyers-bill
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-05.press-and-broadcasting
      when: May
      date: 1964-05
      thread: press-and-broadcasting
      also:
      - program
      - elections-1964
      c: 'The small room beside the Oval Office, a few days after Ann Arbor. Johnson to Goodwin, over scotch: "Henry Luce
        called me this morning. Old man Henry himself. He said he''d support me on the basis of the Great Society speech alone."
        With Moyers and Valenti he reads reviews by Reston, Krock and U.S. News. "The only two newspapermen practically all
        of them admire are Lippmann and Reston. As long as these two are for LBJ, he will, on the whole, get a good press
        from the rest of them." If Goldwater is nominated, "we''ll sweep every part of the country, even New York."'
      n: '[[w.goodwin-remembering-america]], 282–83 (Goodwin''s account). Check: the day; "a few days after returning from
        Ann Arbor" (282). Names: Johnson, Goodwin, Luce, Moyers, Valenti, Reston, Krock, Lippmann, Goldwater.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:moyers-bill
      - name:valenti-jack
      - name:reston-james
      - name:lippmann-walter
      - name:goldwater-barry-m
      - name:luce-henry-r
      - name:krock-arthur
- add:
    entry:
      id: cal.1964-07-29.robert-kennedy-6
      when: July 29
      date: '1964-07-29'
      thread: robert-kennedy
      also:
      - elections-1964-vice-presidency
      c: 'The White House drive. Moyers telephones Goodwin: "Lyndon''s telling Bobby that he can''t have the nomination."
        Goodwin, pacing between the West Wing and the Executive Office Building, sees Robert Kennedy''s limousine stop and
        the window roll down. Goodwin: "It''s too bad." Kennedy: "That''s okay." Goodwin: "I suppose there''s nothing to be
        done about it." Kennedy shakes his head and drives off.'
      n: '[[w.goodwin-remembering-america]], 298 (Goodwin''s account). See [[cal.1964-07-29.robert-kennedy]]. Names: Moyers,
        Goodwin, Robert Kennedy, Johnson.'
      tags:
      - name:moyers-bill
      - name:goodwin-richard-n
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-08-26.elections-1964-atlantic-city-4
      when: Aug. 26
      date: '1964-08-26'
      thread: elections-1964-atlantic-city
      c: 'Aboard the President''s plane to Atlantic City, where he is to name Humphrey; Goodwin aboard. Johnson, his glass
        held to the light: "every family has a certain thread that runs through it. In the Kennedys it was women. ... For
        other families it''s money, or skiing, or meat. In ours it was alcohol." He finishes the drink and holds out the glass
        for a refill.'
      n: '[[w.goodwin-remembering-america]], 300–301 (Goodwin''s account; "The day before his own nomination," 300). See [[cal.1964-08-26.elections-1964]].
        Names: Humphrey, Goodwin, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:humphrey-hubert-h
      - state:nj
      - city:atlantic-city
- add:
    entry:
      id: cal.1964-08-27.elections-1964-atlantic-city
      when: Aug. 27
      date: '1964-08-27'
      thread: elections-1964-atlantic-city
      c: 'Aboard the plane to Atlantic City, the night of the acceptance speech. Busby and Goodwin revise the draft on the
        president''s last-minute directions. Goodwin: with Goldwater as the opponent Johnson can run the campaign from the
        White House. Johnson: "You fellows ought to stop talking about being happy about Goldwater. Suppose there is a heart
        attack or something. Goldwater is a mean, vindictive little man." He recalls Goldwater''s letter after he took the
        vice-presidency: demeaning to accept office under someone who was his inferior.'
      n: '[[w.goodwin-remembering-america]], 301–2 (Goodwin''s account). See [[cal.1964-08-26.elections-1964-atlantic-city-4]].
        Names: Busby, Goodwin, Johnson, Goldwater.'
      tags:
      - name:busby-horace
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - name:goldwater-barry-m
      - state:nj
      - city:atlantic-city
- add:
    entry:
      id: cal.1964-08.elections-1964-johnson
      when: Aug.
      date: 1964-08
      thread: elections-1964-johnson
      also:
      - elections-1964
      c: 'The West Wing, the first floor, an early campaign meeting: Moyers, Valenti, Goodwin, Clifford, O''Brien. Johnson,
        unannounced: "Now, boys, let''s hear what you have in mind for me." After twenty minutes: "I''m the president. That''s
        our greatest asset. And I don''t want to piss it away by getting down in the mud with Barry." The Hutchinson story:
        "Now Barry''s already got a rope around him, and he''s knotted it pretty firm. All you have to do is give a little
        tug. And while he''s fighting to keep standing, I''ll just sit right here and run the country."'
      n: '[[w.goodwin-remembering-america]], 303–4 (Goodwin''s account). Check: the day; "toward the end of August" (303).
        Names: Johnson, Moyers, Valenti, Goodwin, Clifford, O''Brien, Goldwater.'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:valenti-jack
      - name:goodwin-richard-n
      - name:clifford-clark
      - name:obrien-lawrence-f
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-08.elections-1964-5
      when: Aug.
      date: 1964-08
      thread: elections-1964
      also:
      - elections-1964-goldwater
      c: 'The White House, the end of the month. Moyers, Goodwin and others view the television spot made for the campaign:
        a girl plucks a daisy as a countdown becomes a nuclear explosion; "Vote for President Johnson on November third. The
        stakes are too high for you to stay home." A voice, Goodwin thinks Moyers''s: "It''s wonderful. But it''s going to
        get us in a lot of trouble." The plan: saturate prime time for a few days, then withdraw it when the protests come.'
      n: '[[w.goodwin-remembering-america]], 304–6 (Goodwin''s account; the voice-over as he gives it). Check: the day; "at
        the end of August" (305). Names: Moyers, Goodwin.'
      tags:
      - name:moyers-bill
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1965-03-15.voting-rights-11
      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: 'The mansion, Johnson''s bedroom, at his waking. Asked how Goodwin is coming with the address to Congress, Valenti
        says he assigned it, at Sunday''s meeting, to Busby. Johnson: "The hell you did. Don''t you know a liberal Jew has
        his hand on the pulse of America? And you assign the most important speech of my life to a Texas public relations
        man? Get Dick to do it. And now!" By Moyers''s account to Goodwin that evening.'
      n: '[[w.goodwin-remembering-america]], 326–27 (Goodwin''s account). See [[cal.1965-03-14.voting-rights-2]]. Names: Johnson,
        Valenti, Goodwin, Busby, Moyers.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:goodwin-richard-n
      - name:busby-horace
      - name:moyers-bill
- add:
    entry:
      id: cal.1965-03-15.voting-rights-12
      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: 'The White House, 9:30 a.m. Valenti, waiting at Goodwin''s office door: "Good morning, Dick, the president''s speaking
        to Congress tonight. ... He needs a speech from you right away." "We''ll need it by the middle of the afternoon to
        put it on the TelePrompTers." Goodwin writes undisturbed, each page carried to the President as it is typed; the last
        page done at 6 p.m., "almost eight hours." Too late for the TelePrompTers: the address is read from a typed text.'
      n: '[[w.goodwin-remembering-america]], 325–30 (Goodwin''s account). See [[cal.1965-03-15.voting-rights-11]]. Names:
        Valenti, Goodwin, Johnson.'
      tags:
      - name:valenti-jack
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-03-15.voting-rights-13
      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: 'About 3 p.m. Johnson to Goodwin by telephone, his one call of the day: "You remember, Dick, that one of my first
        jobs after college was teaching young Mexican-Americans down in Cotulla. I told you about it down at the ranch. I
        thought you might want to put in a reference to that." Goodwin: "Yes, Mr. President." Johnson: "I just wanted to remind
        you."'
      n: '[[w.goodwin-remembering-america]], 329 (Goodwin''s account). See [[cal.1965-03-15.voting-rights-12]]. Names: Johnson,
        Goodwin.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1965-03-15.voting-rights-14
      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: 'The limousine back from the Capitol after the address. Johnson: "Well, Jack, how did I do?" Valenti, from a notebook:
        "The total delivery time was forty-five minutes, twenty seconds. You spoke for thirty-six minutes and forty seconds,
        and applause took eight minutes and forty seconds. Your rate of delivery was 96.35 words per minute, and there were
        thirty-six interruptions for applause." Goodwin: "Thirty-seven, Jack, I counted thirty-seven interruptions"; at the
        President''s glare at Valenti, "Just kidding."'
      n: '[[w.goodwin-remembering-america]], 336–37 (Goodwin''s account). See [[cal.1965-03-15.voting-rights]]. Names: Johnson,
        Valenti, Goodwin.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1965-04-28.latin-america-dominican-republic-4
      when: Apr. 28
      date: '1965-04-28'
      thread: latin-america-dominican-republic
      c: 'The West Wing. Goodwin, summoned to an emergency meeting in the Cabinet Room, meets Bundy, who says the President
        has ordered Marines flown to the Dominican Republic: "They''re already in the air." Goodwin: why the Marines, why
        not the Army? In the Cabinet Room Bundy tells others, laughing: "You know what Goodwin says? He wants to know if we
        can send someone else beside the marines."'
      n: '[[w.goodwin-remembering-america]], 406 (Goodwin''s account). See [[cal.1965-04-28.latin-america-dominican-republic-2]].
        Names: Goodwin, Bundy, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-05.civil-rights-the-executive-2
      when: May, late
      date: 1965-05
      thread: civil-rights-the-executive
      c: 'The Oval Office, the wire-service teletype clicking. Johnson to Goodwin: "You did a good job on that voting rights,"
        his first acknowledgment of Goodwin''s authorship. "Now, voting rights are important. But it''s only the tail on the
        pig, when we ought to be going for the whole hog. ... Now, the whole country''s like one big Prairie View. ... We''ve
        got the biggest pulpit in the world up here, and we ought to use it to do a little preaching. Why don''t you see what
        you can do. You''re my regular alter ego."'
      n: '[[w.goodwin-remembering-america]], 342–43 (Goodwin''s account; the start of the Howard address). Check: the day;
        "In late May" (342). Names: Johnson, Goodwin.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1965-06.transition-and-staff
      when: June, mid
      date: 1965-06
      thread: transition-and-staff
      c: 'The Oval Office, by Moyers''s account to Goodwin. Johnson, a wire-service report in his hand: "Bundy is going on
        television — on national television — with five professors. I never gave him permission. That''s an act of disloyalty.
        ... Bill, I want you to go to Bundy and tell him the president would be pleased, mighty pleased, to accept his resignation."
        Then: "That''s the trouble with all you fellows. You''re in bed with the Kennedys." Moyers goes home without seeing
        Bundy.'
      n: '[[w.goodwin-remembering-america]], 400 (Goodwin''s account; Moyers''s call to him at midnight, from Goodwin''s diary;
        the next morning Johnson: "Did you speak to Bundy?" "No, I didn''t, Mr. President"). Check: the day; "In mid-June"
        (400). Names: Johnson, Moyers, Bundy, Goodwin.'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:bundy-mcgeorge
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1965-06-04.civil-rights-the-executive-2
      when: June 4
      date: '1965-06-04'
      thread: civil-rights-the-executive
      c: 'The mansion, the second floor, at breakfast. Goodwin brings Johnson the draft of the Howard address, finished at
        dawn, with a covering memorandum: drafts shown to Valenti, Moyers and "Pat Moynihan of Labor"; "a speech like this
        might well help toward making you ''The Great Emancipator'' of the twentieth century." Johnson reads it, penciling
        amendments: "That''ll do just fine, Dick." Goodwin: "Don''t you think I ought to check it out with black leaders?"
        Johnson: "If you''d like to."'
      n: '[[w.goodwin-remembering-america]], 343–44 (Goodwin''s account). Check: the day; the book puts the commencement on
        June 5 (343). See [[cal.1965-05.civil-rights-the-executive-2]]. Names: Goodwin, Johnson, Valenti, Moyers, Moynihan.'
      tags:
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:moyers-bill
      - name:moynihan-daniel-patrick
- add:
    entry:
      id: cal.1965-06-04.civil-rights-the-executive-3
      when: June 4
      date: '1965-06-04'
      thread: civil-rights-the-executive
      c: Goodwin, for an hour or two, reads the draft of the Howard address to King, Roy Wilkins of the NAACP, Whitney Young
        of the Urban League and Randolph. "They were all enthusiastic."
      n: '[[w.goodwin-remembering-america]], 344 (Goodwin''s account; "A. William Randolph of the Railroad Workers," as the
        book has it). Check: the day; the book puts the commencement on June 5 (343). See [[cal.1965-06-04.civil-rights-the-executive-2]].
        Names: Goodwin, King, Wilkins, Young, Randolph.'
      tags:
      - name:goodwin-richard-n
      - name:king-martin-luther-jr
      - name:wilkins-roy
      - name:young-whitney-m
      - name:randolph-a-philip
- add:
    entry:
      id: cal.1965-06-22.transition-and-staff
      when: June 22
      date: '1965-06-22'
      thread: transition-and-staff
      c: 'The Oval Office; Moyers and Goodwin with Johnson. Goodwin remarks that the aid-to-education bill has the support
        of the liberal organizations; Johnson: "I am not going to have anything more to do with the liberals. They won''t
        have anything to do with me. They all just follow the communist line — liberals, intellectuals, communists. ... I
        detest the United Nations. They''ve tried to make a fool out of me. ... I can''t trust anybody anymore. ... I''m going
        to get rid of everybody who doesn''t agree with my policies. I''ll take a tough line — put Abe Fortas or Clark Clifford
        in the Bundy job." Of Gagarin and the astronauts in Paris: "a personal insult to me."'
      n: '[[w.goodwin-remembering-america]], 401 (Goodwin''s account, with his diary''s note of the talk afterward with Moyers;
        the first part also the epigraph, 392). Names: Johnson, Moyers, Goodwin, Fortas, Clifford, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:goodwin-richard-n
      - name:fortas-abe
      - name:clifford-clark
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-06-28.transition-and-staff
      when: June 28
      date: '1965-06-28'
      thread: transition-and-staff
      c: 'The Oval Office, by Goodwin''s diary. Johnson asks Goodwin and Moyers whether Tom Wicker is out to destroy him,
        in some conspiracy; they say no. He switches: Robert Kennedy was behind the public assassination of Ed Clark, whom
        he had made ambassador to Australia; and he had agreed to appoint Harlan Cleveland to the fourth place at State but
        now "wouldn''t appoint him dog catcher": he thinks Cleveland leaked the story of the United Nations speech to Reston.'
      n: '[[w.goodwin-remembering-america]], 401 (Goodwin''s account, from his diary of June 28). Names: Johnson, Goodwin,
        Moyers, Wicker, Robert Kennedy, Cleveland, Reston.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:moyers-bill
      - name:wicker-tom
      - name:kennedy-robert-f
      - name:cleveland-j-harlan
      - name:reston-james
- add:
    entry:
      id: cal.1965-07.transition-and-staff-2
      when: July, early
      date: 1965-07
      thread: transition-and-staff
      c: 'Moyers''s office. Moyers, back from the President, "his face pale," to Goodwin: Johnson "told me he was going to
        fire everybody that didn''t agree with him, that Hubert could not be trusted and we weren''t to tell him anything";
        the communist way of thinking had infected everyone around him, and if his enemies succeeded "there was no way he
        could stop World War Three." For more than an hour the two discuss the President''s instability.'
      n: '[[w.goodwin-remembering-america]], 402–3 (Goodwin''s account). Check: the day; "Early that same month," July (402).
        Names: Moyers, Goodwin, Johnson, Humphrey.'
      tags:
      - name:moyers-bill
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1965-07-14.vietnam-july-decision-4
      when: July 14
      date: '1965-07-14'
      thread: vietnam-july-decision
      c: 'A staff meeting. Johnson walks in, listens a while: "Don''t let me interrupt. But there''s one thing you ought to
        know. Vietnam is like being in a plane without a parachute, when all the engines go out. If you jump, you''ll probably
        be killed, and if you stay in, you''ll crash and probably burn. That''s what it is." He leaves without waiting for
        a reply.'
      n: '[[w.goodwin-remembering-america]], 403–4 (Goodwin''s account). Names: Johnson, Goodwin.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1965-08.voting-rights
      when: Aug.
      date: 1965-08
      thread: voting-rights
      c: Goodwin, on vacation at Martha's Vineyard, Mass., summoned by Johnson to draft his statement for the signing of the
        Voting Rights Act; a Coast Guard cutter sent to intercept Goodwin's Sailfish on Tashmoo Pond.
      n: '[[w.goodwin-remembering-america]], 422 (Goodwin''s account). Check: the day; "In August" (422), before the signing
        of Aug. 6 (339). Names: Goodwin, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - state:ma
- add:
    entry:
      id: cal.1965-09-16.transition-and-staff
      when: Sept. 16
      date: '1965-09-16'
      thread: transition-and-staff
      c: 'The Baltimore Sun prints excerpts, obtained from the White House press office, of Goodwin''s letter on leaving the
        White House and Johnson''s reply: "with intense regret for the decision it described, with gratitude for the affection
        it bears, and with a new appreciation for the extraordinary man who wrote it."'
      n: '[[w.goodwin-remembering-america]], 422–23 (Goodwin''s account; the letters exchanged "in September," 422; Johnson,
        "outraged," holding up the paper: "I''ve learned my lesson. I''m never going to write another letter to anyone").
        Names: Goodwin, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-02.vietnam-3
      when: Feb.
      date: 1966-02
      thread: vietnam
      also:
      - robert-kennedy
      c: 'Robert Kennedy telephones Goodwin in Middletown at 7 a.m. about the Fulbright hearings: "Do you think there''s anything
        constructive I can add?" Goodwin, an hour later: everyone says the solution is a negotiated settlement but no one
        has said what it would look like. Kennedy: "Would you try your hand at a statement?" Goodwin: "I''ll give it a shot."
        That afternoon he reads him the draft, which gives the National Liberation Front "a share of power and responsibility."'
      n: '[[w.goodwin-remembering-america]], 453–54 (Goodwin''s account). Check: the day; "Two weeks later" than the resumption
        of the bombing on Jan. 31 (453), before Goodwin''s note to Kennedy of Feb. 17 (454). Names: Robert Kennedy, Goodwin,
        Fulbright.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-07-23.assassination
      when: July 23
      date: '1966-07-23'
      thread: assassination
      also:
      - robert-kennedy
      c: 'Book Week. Goodwin, reviewing Edward J. Epstein''s *Inquest*, on the Warren Commission: the book "not only raises
        questions but demands explorations and answers"; an "independent group should look at [Epstein''s] charges and determine
        whether the commission investigation was so flawed that another inquiry is necessary."'
      n: '[[w.goodwin-remembering-america]], 462–63 (Goodwin''s account, quoting his review). To check: The New York Times,
        July 24, 1966: "Mr. Goodwin is the first member of the President''s inner circle to suggest publicly that an official
        re-examination be made of the Warren report" (quoted by [[w.goodwin-remembering-america]], 463). Names: Goodwin.'
      tags:
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1966-07.robert-kennedy-6
      when: July
      date: 1966-07
      thread: robert-kennedy
      also:
      - vietnam
      c: Robert Kennedy, dining with McNamara, bets him five dollars that there will be at least one dramatic expansion of
        the war before the midterm elections, to improve the Democrats' prospects.
      n: '[[w.goodwin-remembering-america]], 465 (Goodwin''s account). Check: the month; "Earlier that same month" as the
        first bombing of Hanoi and Haiphong, which Goodwin puts on July 29 (465); the strikes were June 29 ([[cal.1966-06-29.vietnam]]).
        Names: Robert Kennedy, McNamara.'
      tags:
      - name:kennedy-robert-f
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1968-03.elections-1968-mccarthy-3
      when: Mar., early
      date: 1968-03
      thread: elections-1968-mccarthy
      c: 'Manchester, N.H., an empty suite of the Sheraton-Wayfarer. Bill Dunfey, New Hampshire''s leading Democrat, to Goodwin:
        a White House plot to discredit McCarthy''s volunteers by planting marijuana in some of their rooms. And McCarthy
        "might go as high as thirty percent." Goodwin: "We''re going to do a hell of a lot better than that."'
      n: '[[w.goodwin-remembering-america]], 506 (Goodwin''s account; the plan "evaporated after I leaked my knowledge of
        the intended trap to members of the press"). Check: the day; "About ten days before the election" (506). Names: Goodwin,
        McCarthy.'
      tags:
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - state:nh
      - city:manchester
- add:
    entry:
      id: cal.1968-03-06.robert-kennedy-campaign-decision
      when: Mar. 6
      date: '1968-03-06'
      thread: robert-kennedy-campaign-decision
      also:
      - elections-1968-mccarthy
      c: 'Wednesday. Robert Kennedy telephones Goodwin in New Hampshire from his New York apartment: "I''m still considering
        getting into this thing, and I''d like McCarthy to know this now, so he doesn''t think my decision has any relationship
        to whatever happens in New Hampshire." Goodwin: "I can''t act as your messenger. I''m working for McCarthy now." He
        will tell McCarthy that Kennedy called and what the message is. Kennedy: "How do you think you''re going to do?" "We''re
        going to get at least forty percent." "How would I have done?" "You would have won sixty-forty."'
      n: '[[w.goodwin-remembering-america]], 506–8 (Goodwin''s account; "On Wednesday — six days before the election," 506;
        Kennedy had asked his brother Edward to pass the message, and he had not). Names: Robert Kennedy, Goodwin, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - state:nh
- add:
    entry:
      id: cal.1968-03-09.elections-1968-mccarthy
      when: Mar. 9
      date: '1968-03-09'
      thread: elections-1968-mccarthy
      c: 'New Hampshire, the Saturday evening before the primary. Arnold Hiatt of McCarthy''s finance committee to Goodwin:
        the radio stations will cancel all the spots unless paid in advance, "and we''ve run out of money"; $20,000 wanted.
        Goodwin takes out his checkbook; Hiatt takes his pen: "Don''t worry about it, Dick. We''ll take care of it." Within
        a few hours the money is "found" and the radio campaign goes on.'
      n: '[[w.goodwin-remembering-america]], 509–10 (Goodwin''s account; he had six hundred dollars in the bank, and supposes
        Hiatt paid for the spots himself). Names: Goodwin, McCarthy.'
      tags:
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - state:nh
- add:
    entry:
      id: cal.1968-03.robert-kennedy-campaign-decision
      when: Mar.
      date: 1968-03
      thread: robert-kennedy-campaign-decision
      also:
      - elections-1968-mccarthy
      c: 'Goodwin, in bed with influenza at the Georgetown Inn, telephones Robert Kennedy that he is going to Wisconsin: "Look,
        Bobby, you''re not on the ballot in Wisconsin, and a defeat for Johnson is as important to you as to McCarthy." Kennedy:
        "If that''s your decision." Goodwin: "That''s it, good luck." The next day he flies to Milwaukee.'
      n: '[[w.goodwin-remembering-america]], 518–20 (Goodwin''s account; over the next weeks Kennedy tells friends and staff
        that Goodwin was responsible for at least 10 percent of McCarthy''s New Hampshire vote, and calls him "His Nibs").
        Check: the day; after Kennedy''s announcement of Mar. 16 (518–19), with the Wisconsin primary "little more than two
        weeks away" (519). Names: Goodwin, Robert Kennedy, Johnson, McCarthy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:wi
- add:
    entry:
      id: cal.1968-03-31.elections-1968-mccarthy-3
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-mccarthy
      also:
      - elections-1968-johnson
      c: 'Milwaukee, a hotel suite, Sunday night. Goodwin, Blair Clark and Theodore White watch Johnson''s address. Goodwin:
        "Look at him, he looks terrible. You won''t believe this, but I feel sorry for him." At the announcement he leaps
        up, pointing at the set; by White''s account: "I thought it would take another six weeks." The corridors fill with
        volunteers chanting.'
      n: '[[w.goodwin-remembering-america]], 522–23 (Goodwin''s account; the words at the set as White gives them, Goodwin
        not recalling). See [[cal.1968-03-31.elections-1968]]. Names: Goodwin, White, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:white-theodore-h
      - name:johnson-lyndon-b
      - state:wi
      - city:milwaukee
- add:
    entry:
      id: cal.1968-03-31.elections-1968-mccarthy-4
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-mccarthy
      also:
      - elections-1968-johnson
      c: 'Milwaukee, after the address. Goodwin advises McCarthy to call Johnson, which he does (McCarthy''s wife speaks with
        Lady Bird Johnson), and to call Daley in Chicago, "Governor Lawrence in Pennsylvania" and Governor Hughes in New Jersey
        for their support, to ease the party leaders'' hostility. McCarthy, returning from a private room: "Indiana will be
        decisive."'
      n: '[[w.goodwin-remembering-america]], 524 (Goodwin''s account). Check: "Governor Lawrence"; David L. Lawrence, Governor
        of Pennsylvania until 1963, died in 1966. See [[cal.1968-03-31.elections-1968-mccarthy-2]], [[cal.1968-03-31.elections-1968-9]].
        Names: Goodwin, McCarthy, Johnson, Lady Bird Johnson, Daley, Hughes.'
      tags:
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
