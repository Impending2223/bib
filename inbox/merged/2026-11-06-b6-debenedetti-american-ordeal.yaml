ops:
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-12
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis
      also:
      - testing
      c: Washington. A few demonstrators hear a rumor that Cuba is to be bombed. Shaken by the "possibility of an immediate
        nuclear holocaust," some think of taking their families out of the city; most decide "that it would be better to die
        on the job, urging negotiation."
      n: '[[w.debenedetti-american-ordeal]], 61. To check: Women Strike for Peace, National Information Memo no. 15, Nov.
        4, 1962, WSP Records, SHSW (cited by [[w.debenedetti-american-ordeal]], 61 n.25). See [[cal.1962-10-23.missile-crisis-18]].'
      src:
        c: e2319905
        rows:
        - 'w.debenedetti-american-ordeal 61: all'
        - 'via w.debenedetti-american-ordeal 61 n.25: all'
    section: '196210'
- add:
    entry:
      id: cal.1963-09-02.testing
      when: Sept. 2
      date: '1963-09-02'
      thread: testing
      also:
      - press-and-broadcasting
      c: 'I. F. Stone, back from a month''s vacation, on the test ban: he feels like "a Rip Van Winkle ... pleasantly awakened
        to a world he never expected to see"; even the White House "speaking the language one heard earlier only from fringe
        groups like SANE which seemed to be crying in a nuclear wilderness."'
      n: '[[w.debenedetti-american-ordeal]], 63. To check: I. F. Stone, "Why and How Did Peace Suddenly Break Out?" *I. F.
        Stone''s Bi-Weekly*, Sept. 2, 1963, 1 (cited by [[w.debenedetti-american-ordeal]], 63 n.34). Names: Stone.'
      tags:
      - name:stone-i-f
      src:
        c: a0cdc5c9
        rows:
        - 'w.debenedetti-american-ordeal 63: all'
        - 'via w.debenedetti-american-ordeal 63 n.34: all'
    section: '196309'
- add:
    entry:
      id: cal.1967-02-24.war-opposition
      when: Feb. 24
      date: '1967-02-24'
      thread: war-opposition
      also:
      - women
      c: 'New York. Women Strike for Peace''s steering committee to Bevel: it will not endorse the Spring Mobilization; antiwar
        activists "should be anti-Administration, but not anti-American." The national FOR and SANE refuse to be official
        sponsors.'
      n: '[[w.debenedetti-american-ordeal]], 174–75. To check: New York WSP Steering Committee to James Bevel, Feb. 24, 1967,
        box 6, Fifth Avenue Peace Parade Committee Records, SCPC (cited by [[w.debenedetti-american-ordeal]], 175 n.23). Check:
        the day of the FOR''s and SANE''s refusals. See [[cal.1967-02-11.war-opposition]].'
      src:
        c: d645db5d
        rows:
        - 'w.debenedetti-american-ordeal 174–75: all'
        - 'via w.debenedetti-american-ordeal 175 n.23: A-B'
    section: '196702'
- add:
    entry:
      id: cal.1967-04-14.war-opposition
      when: Apr. 14–16
      date: '1967-04-14'
      thread: war-opposition
      also:
      - press-and-broadcasting
      c: 'Bevel, the Spring Mobilization''s director, on the NBC evening news: the war "a profound expression of the policy
        of genocide."'
      n: '[[w.debenedetti-american-ordeal]], 174. To check: Radio-TV Defense Dialogue, broadcasts of Apr. 14, 15, 16, 1967,
        p. 1, Department of Defense (cited by [[w.debenedetti-american-ordeal]], 174 n.22). Check: the day. See [[cal.1967-02-24.war-opposition]].'
      src:
        c: 6209c57f
        rows:
        - 'w.debenedetti-american-ordeal 174: all'
        - 'via w.debenedetti-american-ordeal 174 n.22: all'
