      when: Nov. 6
      date: '1967-11-06'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: 'Jerry Rubin in the *Village Voice*, "We Are Going to Light the Fuse to the Bomb": radicals to help "screw up this
        society" by disrupting the Democratic National Convention at Chicago in 1968.'
      n: '[[w.debenedetti-american-ordeal]], 199. To check: Jerry Rubin, "We Are Going to Light the Fuse to the Bomb," *Village
        Voice*, Nov. 6, 1967, 7 (cited by [[w.debenedetti-american-ordeal]], 199 n.128). Check: the issue''s day, as the note
        gives it. Names: Rubin.'
      tags:
