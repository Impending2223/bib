      date: '1967-12-05'
      thread: war-opposition
      c: 'Jim Forest of the Fellowship of Reconciliation to Daniel Berrigan, by letter: the radicals are ready "to martyr
        *others*" for the cause, and alienate the body of citizens from the antiwar leadership.'
