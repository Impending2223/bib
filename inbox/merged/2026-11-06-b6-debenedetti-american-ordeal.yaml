      when: Dec. 1
      date: '1967-12-01'
      thread: war-opposition
      c: 'Michael Harrington in the *Village Voice*, "A Question of Philosophy, a Question of Tactics": the movement to work
        for peace in Vietnam, "not for victory for one side or the other"; every action to be weighed for its political effect.'
      n: '[[w.debenedetti-american-ordeal]], 199. To check: Michael Harrington, "A Question of Philosophy a Question of Tactics,"
        *Village Voice*, Dec. 1, 1967, 6 (cited by [[w.debenedetti-american-ordeal]], 199 n.127). Check: the issue''s day,
        as the note gives it.'
      src:
