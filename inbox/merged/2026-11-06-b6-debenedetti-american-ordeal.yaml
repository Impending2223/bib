- add:
    entry:
      id: cal.1968-05-31.war-opposition
      when: May 31
      date: '1968-05-31'
      thread: war-opposition
      c: 'Dorothy Day to Daniel Berrigan, after Philip Berrigan''s sentence for the blood poured on the Baltimore draft files:
        "I am convinced that sooner or later we are all going to end in a concentration camp."'
      n: '[[w.debenedetti-american-ordeal]], 219. To check: Dorothy Day to Daniel Berrigan, May 31, 1968, Berrigan Papers,
        Cornell (cited by [[w.debenedetti-american-ordeal]], 219 n.55). Check: DeBenedetti gives the sentence as eighteen
        years, a week after Catonsville. See [[cal.1968-05-17.war-opposition]]. Names: Daniel Berrigan, Philip Berrigan.'
      tags:
      - name:berrigan-daniel
      - name:berrigan-philip
      src:
        c: 495a9b24
        rows:
        - 'w.debenedetti-american-ordeal 219: all'
