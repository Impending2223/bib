ops:
- add:
    entry:
      id: cal.1963-11-20.robert-kennedy
      when: Nov. 20
      date: '1963-11-20'
      thread: robert-kennedy
      also:
      - civil-rights-bill
      c: 'Justice, Robert Kennedy''s thirty-eighth birthday, an office party. Standing on his desk, he jokes that his work
        on civil rights has made the President more popular in the South: "the administration would have floundered without
        him — he''d captured the South, labor would be committed to Democrats forever"; the Democrats the "law-and-order party."
        Ramsey Clark, leaving, judges the civil rights bill dead until after the 1964 election, the Attorney General about
        to resign to run his brother''s campaign.'
      n: '[[w.kotz-judgment-days]], 8. To check: Ramsey Clark and John Douglas, interviews by Kotz (cited by [[w.kotz-judgment-days]],
        8 n.27). Names: Robert Kennedy, Ramsey Clark.'
      src:
        c: e863e0e1
        rows:
        - 'w.kotz-judgment-days 8: all'
        - 'via w.kotz-judgment-days 8 n.27a: all'
        - 'via w.kotz-judgment-days 8 n.27b: all'
      tags:
      - name:kennedy-robert-f
      - name:clark-ramsey
- add:
    entry:
      id: cal.1963-11-22.assassination-12
      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      c: 'Boggs, the House''s deputy majority leader, hurrying from the Cannon Building to the Capitol at the news, nearly
        runs into Colmer (D-Miss.) and shouts at him: "Your people killed that man! Your Ross Barnetts!"'
      n: '[[w.kotz-judgment-days]], 6. To check: William Colmer, oral history, LBJ Library (cited by [[w.kotz-judgment-days]],
        6 n.21). Names: Boggs, Colmer.'
      src:
