      c: Thanksgiving. King's sermon mentions the assassination only in passing; he preaches on the black experience of slavery
        in America.
      n: '[[w.kotz-judgment-days]], 20. To check: [[w.branch-pillar-of-fire]], 182 (cited by [[w.kotz-judgment-days]], 20
