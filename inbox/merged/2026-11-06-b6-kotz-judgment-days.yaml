- add:
    entry:
      id: cal.1965-03-15.voting-rights-8
      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: 'The family quarters, after King''s call. Johnson to Goodwin: "You know Dick, I understand why he''s surprised, why
        a lot of folks are surprised, but I''m going to do it. Hell, we''re just halfway up the mountain. Not even half."'
      n: '[[w.kotz-judgment-days]], 314. To check: [[w.goodwin-remembering-america]], 310 (cited by [[w.kotz-judgment-days]],
        314 n.71). See [[cal.1965-03-15.voting-rights-5]]. Names: Johnson, Goodwin.'
      src:
        c: 6f6215b0
        rows:
        - 'w.kotz-judgment-days 314: all'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      follows:
