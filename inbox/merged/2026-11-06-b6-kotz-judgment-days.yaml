- add:
    entry:
      id: cal.1968-03-29.king-memphis-5
      when: Mar. 29
      date: '1968-03-29'
      thread: king-memphis
      also:
      - king
      c: 'Atlanta, Friday evening, home from Memphis. King and Coretta King to supper with Ralph and Juanita Abernathy. King:
        "They''re saying I led a violent march." Juanita Abernathy: "Anyone with any intelligence knows it was a plant." King:
        "Who''s going to know those weren''t our people?"'
      n: '[[w.kotz-judgment-days]], 405. To check: Juanita Abernathy, interview by Kotz; [[w.abernathy-and-the-walls-came]],
        423–424 (cited by [[w.kotz-judgment-days]], 405 n.54). See [[cal.1968-03-29.king-memphis-3]]. Names: Martin Luther
        King, Coretta King, Abernathy.'
      src:
        c: a750c5bf
        rows:
        - 'w.kotz-judgment-days 405: all'
        - 'via w.kotz-judgment-days 405 n.54a: all'
      tags:
      - name:king-martin-luther-jr
      - name:king-coretta-scott
      - name:abernathy-ralph-david
