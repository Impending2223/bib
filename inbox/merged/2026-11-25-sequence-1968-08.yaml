- edit:
    id: cal.1968-08-26.elections-1968-chicago
    base: 6ea3e553
    set:
      n: '[[w.longley-lbjs-1968]], 212–13; [[w.solberg-hubert-humphrey]], 353–54, 359–60 (Watson: the President absolutely refuses Humphrey''s draft plank; Humphrey to Johnson by telephone: there will be trouble at the convention if it is not put forward; Johnson: "That plank undercuts our whole policy and, by God, the Democratic party ought not to be doing this to me"; not the day, Rusk and Rostow, or Watson''s words); [[w.bernstein-guns-or-butter]], 511 (Watson to Humphrey at the Conrad Hilton; Johnson: "It hasn''t been cleared with me"; the committee for the administration''s plank, 65 to 35); [[w.mann-grand-delusion]], 612 (Johnson to Humphrey on the plank: "this plank just undercuts our whole policy and, by God, the Democratic party ought not to be doing that to me"; Rusk and Rostow had assented; Boggs threatened to oppose; undated; not Watson or the telephone); [[w.obrien-no-final-victories]], 251–52 (O''Brien''s account, undated: Charles Murphy, the President''s spokesman, pronounces the Ginsburg–Sorensen draft unacceptable; Ginsburg and O''Brien urge Humphrey to call the President; Humphrey: "These are just words ... I don''t see that we''ve upset any applecarts"; O''Brien to Ginsburg: "This could blow the whole campaign"; Humphrey accepts the Johnson plank; not Watson, Rusk and Rostow, or the day). [[w.humphrey-education-of-a-public-1976]], 387–90 (the plank cleared with Rusk and Rostow; Watson; the call to Johnson; Humphrey''s account). After [[cal.1968-08-26.elections-1968-chicago-24|Ginsburg''s three hours more with Murphy]], in Solberg''s sequence (353: "Then"). To check: [[w.watson-chief-of-staff]], 296–99; [[w.witcover-year-the-dream-died]], 315; [Johnson and Watson, 10:39 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-marvin-watson-machine-noise-and-office), Conversation WH6808-02-13320 (Miller Center). See [[cal.1968-07-09.elections-1968]]. Names: Watson, Humphrey, Rusk, Rostow, Johnson. Check: Humphrey puts Watson''s message on the morning after the Southern governors cleared the plank on Monday, so Tuesday, Aug. 27 (389); "You must stay the course" is not in his account.'
