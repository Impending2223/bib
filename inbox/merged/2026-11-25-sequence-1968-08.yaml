      n: '[[w.dobrynin-in-confidence]], 186; [[w.dallek-flawed-giant]], 555 (Johnson instructs Rusk to tell Dobrynin of his decision not to announce anything about a visit or talks; not the hour, the place or the words). Order: late that night, after Dobrynin''s call on Johnson. After [[cal.1968-08-20.soviet-union-czechoslovakia-3|the National Security Council]], at which Johnson instructs Rusk to ask Dobrynin in and Rusk reads the draft reply: [FRUS 1964–68, XVII, doc. 81](https://history.state.gov/historicaldocuments/frus1964-68v17/d81). See [[cal.1968-08-20.soviet-union]]. Names: Rusk, Dobrynin, Johnson.'
