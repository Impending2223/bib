- edit:
    id: cal.1965-08-25.space
    base: 9e137a75
    set:
      c: 'News conference. The Defense Department to build a Manned Orbiting Laboratory, $1.5 billion:
        Douglas Aircraft to build the laboratory, a Titan III-C to launch it, a Gemini capsule to bring
        its two-man crews back; the first manned flight in 1968. 27,385 listed by the voting examiners
        in thirteen counties. On steel: "I expect full and complete responsibility in the current wage
        negotiations and I expect continued stability in steel prices." Blough to Connor: the remark on
        price stability "very troublesome."'
      n: 'The President''s News Conference, [1965 Pub. Papers 917](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=391)
        (Aug. 25, 1965), at 921 (steel). [[w.califano-triumph-and-tragedy-of]], 88–89 (Blough to Connor).
        See [[cal.1965-08-21.space]]; [[cal.1965-08-07.voting-rights]]. Names: Blough, Connor.'
      also: &id009
