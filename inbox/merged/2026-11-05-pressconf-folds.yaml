- edit:
    id: cal.1966-03-31.transition-and-staff
    base: 336080c6
    set:
      c: 'News conference. Rostow, chairman of State''s Policy Planning Council, named Special Assistant,
        "principally, but not necessarily exclusively, in the field of foreign policy"; Bundy had left
        Feb. 28, Komer acting since. Kintner, of NBC, Special Assistant and Secretary to the Cabinet.
        Asked whether Mexican Americans feel they should have more attention: they "are entitled to more
        consideration"; discriminated against in housing, education, jobs. Califano sent to find Mexican
        Americans for federal posts and to organize a conference in Texas.'
      n: 'The President''s News Conference, [1966 Pub. Papers 384](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=460)
