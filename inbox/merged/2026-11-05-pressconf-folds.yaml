- edit:
    id: cal.1964-05-06.press-and-broadcasting
    base: 40a3e1d8
    set:
      c: 'The south lawn, 4:30 p.m. Johnson''s news conference for the reporters and their families, more
        than a thousand: punch, the Marine Band, a twelve-minute statement on spending, profits and wages;
        the children; the beagles. A slowdown in the Senate on the food stamp, poverty, Appalachia and
        medical aid bills: he "would seriously consider coming back here" after the conventions; "The
        people''s business must come first." Russell Baker in the *Times*: "In his search for the ideal
        news conference, President Johnson is like a woman buying a hat."'
      n: 'The President''s News Conference Held on the South Lawn at the White House, [1963–64 Pub. Papers
        615](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=699) (May
        6, 1964) (the conference), at 618 (Congress). [[w.kotz-judgment-days]], 140 (Congress). Check:
        the words against the Papers'' text. [[w.white-making-of-the-president-1965]], 248–49 (Baker''s
        story quoted). Names: Johnson.'
      also: &id007
      - congress
      - civil-rights-bill
