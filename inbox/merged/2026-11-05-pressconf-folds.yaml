- edit:
    id: cal.1963-10-31.elections-1964
    base: f2ea964c
    set:
      c: 'News conference. Would he want Johnson on the ticket in 1964, and does he expect him to be?
        "Yes, to both of those questions. That is correct." Goldwater''s charge of news managed to keep
        the administration in office: no reply this week, Goldwater having had "a busy week selling TVA,"
        suggesting nuclear weapons for commanders overseas, attacking the President of Bolivia and involving
        himself in the Greek election. The six divisions in Germany kept "as long as they are required,"
        and the units sent in 1961 "as long as there is a need for them"; no reduction in combat units,
        some in noncombat personnel: "we intend to keep our combat forces in Germany as they are today—that
        is, more than 6 combat divisions"; German purchases of arms "an offset to our gold losses." A
        reversal of the Cabinet''s ruling of Oct. 24 on the roundout units. On Vietnam: a thousand men
        expected out by the end of the year, the first contingent some 250 not in front-line operations.'
      n: 'The President''s News Conference, [1963 Pub. Papers 826](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=884)
        (Oct. 31, 1963), at 827 (the forces in Germany). [[w.johnson-vantage-point]], 2 (the ticket);
        [[w.schlesinger-thousand-days-1965]], 981 (Goldwater); [[w.perlstein-before-the-storm]], 237 (Goldwater);
        [[w.goldberg-barry-goldwater]], 178 (Kennedy on Goldwater''s "busy week, selling TVA and giving
        permission or suggesting that military commanders overseas be permitted to use nuclear weapons");
        [[w.novak-agony-of-the-g]], 243 & n.4 (the answer quoted; the Greek election, the *Athens Post*''s
        interview). [[w.gavin-gold-dollars-and-power]], 113 (the forces in Germany); [[w.poole-joint-chiefs-of-staff]],
        210 (the forces in Germany; the reversal). [[w.selverstone-kennedy-withdrawal]], 197 (Vietnam).
        See [[cal.1963-07-14.elections-1964]]; [[cal.1963-10-24.europe-and-the-alliance]]. Names: Johnson,
        Goldwater.'
      also: &id003
      - goldwater
      - europe-and-the-alliance
      - vietnam-force-levels
      src: &id004
        c: 73e4489a
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=884: A-I'
        - 'w.johnson-vantage-point 2: A-C'
        - 'w.schlesinger-thousand-days-1965 981: A, D'
