- edit:
    id: cal.1966-12-31.vietnam
    base: 9e5d2f19
    set:
      c: 'New Year truce, 48 hours (Check the hours). News conference at the ranch: a representative ready
        to be named today, if Hanoi will name one; the British proposal of talks welcome; U Thant urged
        to take the lead. On Salisbury''s reports: "only military targets have been authorized." On the
        programs: "We must continue the war against our ancient enemies"; the nation, with a gross national
        product of $700 to $800 billion, "can afford what it needs to spend. And I shall so recommend."
        Mansfield had asked the chairmen two days before for a top-to-bottom review of the programs. A
        tax increase for 1967: no decision. Not a mistake to have asked none in 1966: the act of Mar.
        15 and the investment credit''s suspension took "several billions." The year''s deficit $2.3 billion,
        against $6.4 billion estimated, by his figures; the next not as low.'
      n: 'The President''s News Conference at the LBJ Ranch, [1966 Pub. Papers 1458](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=832)
        (Dec. 31, 1966), at 1462 (the programs). [[w.califano-triumph-and-tragedy-of]], 180–81 (Mansfield).
        [[w.zelizer-taxing-america]], 257 (no general increase asked in 1966). See [[cal.1966-12-24.vietnam]];
        [[cal.1966-12-25.vietnam]]; [[cal.1966-11-29.economy]]. Names: U Thant, Salisbury, Mansfield.'
