- edit:
    id: cal.1968-07-31.court-fortas
    base: 6bcf3b40
    set:
      c: 'News conference. Opening: Bethlehem''s increase in steel prices "unreasonable," and it "should
        not be permitted to stand"; some $600 million a year to consumers. The $91 million for impacted
        school aid that Congress added over the budget reserved; the House and Senate have added $110
        million more to the Labor-HEW bill. On infiltration: "30,000 or more North Vietnamese soldiers
        entered South Vietnam in July," and more expected in August; from an unclassified report, truck
        sightings in the week of July 15–21 947, against a weekly average of 717 in April; a cable from
        the commanders that the enemy is preparing "a massive attack." Asked whether the Senate''s treatment
        of Fortas discourages him: "I don''t know that I can improve the situation by any comments that
        I would make. I certainly don''t want to inflame it any." How he chose Fortas and Thornberry;
        while the clearances were being sought, Republican Senators had said no appointment should be
        made in an election year.'
      n: 'The President''s News Conference of July 31, 1968, [1968–69 Pub. Papers 856](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=166)
        (July 31, 1968), 856 (steel), 857 (school aid), 858–60 (infiltration). [[w.longley-lbjs-1968]],
        177 (the Fortas question and answer); [[w.cq-weekly-report]], Aug. 2, 1968, 2018 (school aid);
        Aug. 9, 1968, 2124 (Fortas). Check: CQ gives $90,965,000. Check: Longley gives as Johnson''s own
        the words on Thornberry he quotes from Christopher (177). See [[cal.1968-06-26.court]]; [[cal.1968-07-31.steel]].
        Names: Fortas, Thornberry, Johnson.'
      also: &id017
      - steel
      - vietnam
      - school-aid
      - economy-surcharge
