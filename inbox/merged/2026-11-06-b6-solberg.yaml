      when: Jan.
      date: 1967-01
      thread: transition-and-staff
      c: 'A January morning, after the decision to send more troops: Humphrey with Hughes, of State''s intelligence, on a
        fast walk in Rock Creek Park. "This is the only place I feel free to talk." Johnson after him about "the wild people"
        on his staff, and knows of Rielly''s lunch with a KGB man from the Soviet embassy; Humphrey thinks it eavesdropping,
        his residence perhaps bugged. By Hughes''s account.'
      n: '[[w.solberg-hubert-humphrey]], 301–02. Check: the day. To check: Thomas L. Hughes, interview with Solberg (cited
        by [[w.solberg-hubert-humphrey]], 301, its note). Names: Humphrey, Hughes, Johnson, Rielly.'
