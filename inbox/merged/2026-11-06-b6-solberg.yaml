      date: '1966-01-16'
      thread: vietnam-humphrey
      c: 'Sunday evening: the Humphreys dine privately with the Johnsons in the family quarters, and again on Jan. 23. Johnson
        to Humphrey, a job for him in the next phase of the Vietnam plans: "Keep your schedule loose, keep your bags packed."
        Tell no one, not even his wife.'
      n: '[[w.solberg-hubert-humphrey]], 286. Check: on which Sunday Johnson spoke. To check: [[w.humphrey-education-of-a-public-1976]],
