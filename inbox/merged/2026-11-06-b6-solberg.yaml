      date: '1965-02-11'
      thread: vietnam
      c: 'Humphrey to his aide Rielly, the day after he spoke at the NSC for delaying the reprisal for Qui Nhơn: "keep a good
        file on Vietnam. Shortly I shall be sitting down with the president, the secretary of state and others to discuss
        U. S. policy on Southeast Asia in all its implications."'
