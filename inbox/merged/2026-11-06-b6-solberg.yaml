      date: '1966-10-17'
      thread: republican-party
      also:
      - elections-1966
      c: 'Nixon to Humphrey, after the stories of his heckling: "I have nothing but sympathy and respect for you when I read
        stories like this. The first duty of a Vice President is to be loyal to a President and you have met that responsibility
        in admirable fashion. ... Needless to say, this letter requires no answer."'
      n: '[[w.solberg-hubert-humphrey]], 299. To check: Nixon to Humphrey, Oct. 17, 1966, VIP correspondence, Humphrey Papers,
        Minnesota Historical Society (cited by [[w.solberg-hubert-humphrey]], 299, its note). Names: Nixon, Humphrey.'
