- add:
    entry:
      id: cal.1965-08-28.vietnam-support
      when: Aug. 28
      date: '1965-08-28'
      thread: vietnam-support
      c: 'Humphrey to Johnson, for his birthday: "how privileged I feel to be your Vice President and partner. You make me
        prouder of our country and our government every day." Enclosed, a Columbia law professor''s letter: "The great majority
        of the academic community is in support of the national policy" in Southeast Asia.'
      n: '[[w.solberg-hubert-humphrey]], 282. Check: the day: the text puts it on Johnson''s birthday; the note dates the
        letter Aug. 28. To check: Humphrey to Johnson, Aug. 28, 1965; Monrad Paulsen to Humphrey, Aug. 23, 1965, Humphrey
        Papers, Minnesota Historical Society (cited by [[w.solberg-hubert-humphrey]], 282, its note). Names: Humphrey, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      src:
        c: f2fa3499
        rows:
        - 'w.solberg-hubert-humphrey 282: all'
        - 'via w.solberg-hubert-humphrey 282 n.privileged: A'
        - 'via w.solberg-hubert-humphrey 282 n.great-majority: B'
- add:
    entry:
      id: cal.1965-12.transition-and-staff-3
      when: Dec.
      date: 1965-12
      thread: transition-and-staff
      c: 'After Gallup''s poll on the Vice President, 56 percent preferring he never be President: Johnson, an arm round Humphrey''s
        shoulder, has never had a press secretary as Vice President, and Humphrey needs none; be a good, loyal Vice President,
        never mind the image. Humphrey goes home and fires his press secretary.'
      n: '[[w.solberg-hubert-humphrey]], 284. Check: the day. To check: Gallup, "Humphrey, His Public Image," *Washington
        Post*, Dec. 12, 1965; Humphrey press release, Dec. 23, 1965, Humphrey Papers, Minnesota Historical Society (cited
        by [[w.solberg-hubert-humphrey]], 284, its note). Names: Johnson, Humphrey.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      src:
        c: 3f9709b7
        rows:
        - 'w.solberg-hubert-humphrey 284: all'
        - 'via w.solberg-hubert-humphrey 284 n.gallup: all'
        - 'via w.solberg-hubert-humphrey 284 n.press-release: all'
