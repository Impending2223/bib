      id: cal.1967-06-09.transition-and-staff
      when: June 9
      date: '1967-06-09'
      thread: transition-and-staff
      c: 'Bethesda. Humphrey, anaesthetized, a probe of his bladder: multiple small polyps removed, one malignant. Of eleven
        consultants Dr. Berman asks, one recommends removing the bladder; Humphrey chooses examinations twice a year. Out
        that afternoon, as he tells Johnson, and back at the office in three days.'
      n: '[[w.solberg-hubert-humphrey]], 308. To check: Edgar Berman, interview with Solberg; *New York Times*, June 10–14,
        1967 (cited by [[w.solberg-hubert-humphrey]], 308, its note). Names: Humphrey, Johnson.'
