      id: cal.1965-07-28.vietnam-july-decision
      when: July 28
      date: '1965-07-28'
      thread: vietnam-july-decision
      c: 'Humphrey to Johnson, after the rebuke for his speech: "I have a roomful of senators over here at the Capitol, and
        we thought that the [announcement] was tremendous. I was personally inspired, moved, and I just couldn''t be happier
        if they had Christmas every day and every dream I ever wanted came true."'
      n: '[[w.solberg-hubert-humphrey]], 282. To check: Humphrey to Johnson, July 28, 1965, WHCF, LBJ Library (cited by [[w.solberg-hubert-humphrey]],
        282, its note). See [[cal.1965-07-27.vietnam-humphrey]]. Names: Humphrey, Johnson.'
