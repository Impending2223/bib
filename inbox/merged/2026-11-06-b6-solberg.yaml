      date: 1967-01
      thread: transition-and-staff
      also:
      - vietnam-support
      c: 'The Johnsons to dinner at the Humphreys'' new apartment. Johnson, on the sofa: Humphrey the "greatest national resource"
        for explaining Vietnam; "Now, Hubert, I''d like to hear one of your speeches." Humphrey, on his feet, begins; Johnson
        goes to the bathroom: "Keep talkin'', Hubert. I''m listenin''." By Humphrey''s account to Hughes next morning.'
      n: '[[w.solberg-hubert-humphrey]], 302. Check: the day. To check: Thomas L. Hughes, interview with Solberg (cited by
        [[w.solberg-hubert-humphrey]], 302, its note). See [[cal.1967-01.transition-and-staff-2]]. Names: Johnson, Humphrey,
        Hughes.'
