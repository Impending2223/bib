      id: cal.1965-12-15.farm
      when: Dec. 15
      date: '1965-12-15'
      thread: farm
      c: 'Humphrey to Freeman, "worried" to see two good friends "hurling brickbats at each other": "Andreas, right or wrong,
        has been too helpful to too many of us to deserve a dressing-down in a memo to the President." He has helped McGovern,
        Gaylord Nelson, Proxmire, McGee, Metcalf and Moss, "all good Administration votes."'
      n: '[[w.solberg-hubert-humphrey]], 232–33. To check: Humphrey to Freeman, Dec. 15, 1965, Humphrey Papers, Minnesota
        Historical Society (cited by [[w.solberg-hubert-humphrey]], 232, its note). See [[cal.1965-12-09.farm]]. Names: Humphrey,
        Freeman, McGovern, Nelson, Proxmire, McGee, Metcalf, Moss.'
