      thread: transition-and-staff
      c: 'The State of the Union. By Johnson''s order, carried out by Califano, Humphrey has no advance word of its contents
        and no copy until after the press''s briefing. Humphrey to a White House aide: "If I could only find a way to convince
        this man of my loyalty." To Johnson: "This message was the most impressive of any of the State of the Union messages."'
      n: '[[w.solberg-hubert-humphrey]], 302–03. Check: the days of the confidence and the letter. To check: Douglas Kiker,
        *Atlantic Monthly*, June 1967; Humphrey to Johnson, WHCF, Exec FG 440, Box 348, LBJ Library (cited by [[w.solberg-hubert-humphrey]],
        303, its note). Names: Johnson, Califano, Humphrey.'
