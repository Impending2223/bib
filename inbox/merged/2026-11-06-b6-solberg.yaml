      id: cal.1968-08-21.elections-1968-humphrey
      when: Aug. 21
      date: '1968-08-21'
      thread: elections-1968-humphrey
      c: 'McClosky to Humphrey, the plan worked out with the Kirkpatricks, Kampelman, Robert Nathan and Welsh: resign the
        vice presidency in the acceptance speech. His draft: "I therefore offer my resignation, and today have handed it to
        the President. Under the new 21st amendment we can now have a new Vice President in a few days."'
      n: '[[w.solberg-hubert-humphrey]], 361–62 (the amendment so numbered in the draft as the work quotes it). To check:
        McClosky to Humphrey, Aug. 21, 1968, Box 1075, Humphrey Papers, Minnesota Historical Society; Carl Kaysen to Nathan,
        Aug. 21, 1968, Nathan files (cited by [[w.solberg-hubert-humphrey]], 361, its note). See [[cal.1968-08-28.elections-1968-chicago-13]].
        Names: Humphrey, Kampelman.'
      tags:
      - name:humphrey-hubert-h
      - name:kampelman-max-m
      src:
        c: b93bed61
        rows:
        - 'w.solberg-hubert-humphrey 361–62: all'
        - 'via w.solberg-hubert-humphrey 361 n.handyman-a: all'
- add:
    entry:
      id: cal.1968-09-04.elections-1968-humphrey
      when: Sept. 4
      date: '1968-09-04'
      thread: elections-1968-humphrey
      follows:
      - cal.1968-09-04.soviet-union-czechoslovakia
      c: 'After the evening NSC meeting, Humphrey, missing his chance to talk with Johnson, stays on to tell White House aides:
        "I''ll take an auto across the country and raise funds myself. I''m not going to let this chance go just because the
        Administration doesn''t want it."'
      n: '[FRUS 1964–68, VII, doc. 4](https://history.state.gov/historicaldocuments/frus1964-68v07/d4) (the NSC, 5:07–7:29
        p.m.). [[w.solberg-hubert-humphrey]], 374–75. To check: Edgar Berman, diary, Sept. 4, 1968, Berman files (cited by
        [[w.solberg-hubert-humphrey]], 375, its note). See [[cal.1968-09-03.elections-1968]]. Names: Humphrey, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      src:
        c: a44c5943
        rows:
        - 'w.solberg-hubert-humphrey 374–75: all'
