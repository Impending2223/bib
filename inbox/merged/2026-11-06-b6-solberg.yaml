- add:
    entry:
      id: cal.1968-09.elections-1968-humphrey-3
      when: Sept.–Oct.
      date: 1968-09
      thread: elections-1968-humphrey
      c: 'The fall campaign. Humphrey''s sons Bob and Skip, with their wives, crisscross the country in a Dodge camper, speaking
        for their father in small towns and at small colleges. Bob: his own schedule and advance man, 100,000 miles, in California
        "twice the publicity he did."'
      n: '[[w.solberg-hubert-humphrey]], 235. Check: the days. To check: Robert Humphrey, interview with Solberg (cited by
        [[w.solberg-hubert-humphrey]], 235, its note). Names: Humphrey.'
      tags:
