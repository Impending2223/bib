- add:
    entry:
      id: cal.1966-09.elections-1968-johnson
      when: Sept.
      date: 1966-09
      thread: elections-1968-johnson
      c: 'Johnson to Valenti over lunch: "I won''t be around then [1968]. ... They would say I was playing politics if I resigned
        and gave the job to Humphrey. My own party has turned against me, and the Republicans are chiming in. We probably
        need a fresh face." By Valenti''s account.'
      n: '[[w.solberg-hubert-humphrey]], 318. Check: the day. To check: [[w.valenti-very-human-president]], 154–55 (cited
        by [[w.solberg-hubert-humphrey]], 318, its note). Names: Johnson, Valenti, Humphrey.'
