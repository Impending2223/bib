      id: cal.1963-11-24.china-leadership
      when: Nov. 24
      date: '1963-11-24'
      thread: china-leadership
      also:
      - south-asia
      c: The Great Hall, afternoon. Mao receives the Afghan government delegation that signed the Sino-Afghan border treaty, under Interior Minister Kayum; Chen Yi, Zeng Shan and Huang Zhen present. The treaty good; there was no dispute, and now there is a treaty still better.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 24, 1963. Made public: 2013. Names: Mao Zedong, Chen Yi, Kayum, Zeng Shan, Huang Zhen.'
