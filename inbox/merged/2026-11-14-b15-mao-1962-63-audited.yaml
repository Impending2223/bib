      when: Oct. 2
      date: '1963-10-02'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Great Hall. Mao receives the Albanian military delegation under Balluku; Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, He Long, Luo Ruiqing, Xiao Hua present. The revisionists oppose Albania, China and every Marxist-Leninist party; unforeseen, but not bad: the Twentieth and Twenty-second Congresses make us think, work and unite, and fight them; we did not prepare to fight them, and they forced it.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 2, 1963. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, He Long, Luo Ruiqing, Balluku, Xiao Hua.'
      tags:
      - polity:prc
