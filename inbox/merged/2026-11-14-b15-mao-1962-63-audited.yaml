      when: Jan. 4
      date: '1963-01-04'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Hangzhou. Mao has read the *Hongqi* editorial "Leninism and modern revisionism": no changes; it is well written, to be published. Lin Ke telephones the Central Committee''s General Office.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 4, 1963. Made public: 2013. Names: Mao Zedong, Lin Ke. To check: the editorial in *Hongqi*, 1963.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-01-05.china-leadership
      when: Jan. 5
      date: '1963-01-05'
      thread: china-leadership
      also:
      - south-asia
      c: 'Hangzhou, afternoon. Mao hears Zhou Enlai, just arrived, on his talks in Peking with Ceylon''s Prime Minister Bandaranaike, convener of the Colombo six-power conference on mediating the Sino-Indian border, and Indonesia''s Subandrio. Zhou had told them China would take the six powers'' proposal as a first basis for officials'' meetings on two understandings: one, China''s frontier troops pull back 20 kilometers along the whole border, as the statement of Nov. 21, 1962 planned, and the proposal''s rule that India''s troops keep their present posts applies along the whole border, not in the west alone; two, with the Chinese troops withdrawn, no Chinese posts in Chedong and Longju in the east, Wure in the middle and the 43 posts'' area in the west, and, if India sends neither troops nor civil staff in, no Chinese civil checkposts there either. Mao agrees.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1963 (and n. 4). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Bandaranaike, Subandrio.'
      tags:
      - polity:prc
      - polity:india
      - name:mao-zedong
      - name:zhou-enlai
      - name:bandaranaike-srimavo
      - name:subandrio
