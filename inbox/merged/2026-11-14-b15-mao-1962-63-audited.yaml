- add:
    entry:
      id: cal.1962-07-23.china-leadership
      when: July 23
      date: '1962-07-23'
      thread: china-leadership
      also:
      - south-asia
      - laos
      c: 'Zhou Enlai, agreed with Mao, drafts a telegram from the Central Committee to Chen Yi and the Chinese delegation at Geneva: seize the moment of Nehru''s wish to resume talks; ask to see India''s Defense Minister, Krishna Menon; settle with him the procedure, time, place and level of the officials'' talks. Mao reads and approves it that evening.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 22, 1962 (the entry continues on July 23). Made public: 2013. See [[cal.1962-07-22.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Chen Yi, Nehru, Krishna Menon.'
