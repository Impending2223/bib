- add:
    entry:
      id: cal.1962-08-08.china-leadership
      when: Aug. 8
      date: '1962-08-08'
      thread: china-leadership
      also:
      - china
      c: 'Mao receives Araujo, Ecuadorian former Speaker, former Interior Minister and a leader of the People''s Action Movement; Peng Zhen present. Asks about Ecuador''s politics, army, land and races. China''s experience: Marxism joined with each country''s facts. Araujo: Mao''s works, *On Contradiction*, *On Practice*, "A Single Spark," are guides in the struggle there.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 8, 1962. Made public: 2013. Names: Mao Zedong, Peng Zhen, Araujo.'
      tags:
      - polity:prc
      - polity:ecuador
