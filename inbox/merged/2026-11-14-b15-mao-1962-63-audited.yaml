- add:
    entry:
      id: cal.1962-07-28.china-leadership
      when: July 28
      date: '1962-07-28'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Beidaihe, Building 95. Mao with the Standing Committee, the regional bureaus'' first secretaries, Peng Zhen, Chen Boda, Luo Ruiqing and Wang Renzhong. The problem in the world and at home the same: whether the revolution is led by the proletariat or the bourgeoisie, dictatorship of the one or the other; the national bourgeoisie two-sided, two hands needed; Khrushchev takes them for socialists and wants "peaceful transition"; "unique line" is right, and not unique we cannot be; right-leaning signs also in foreign affairs. When Zhou Enlai raises city work, production, prices, workers'' living: do it now, a committee, Zhou to command.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 28, 1962. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Peng Zhen, Chen Boda, Luo Ruiqing, Khrushchev.'
