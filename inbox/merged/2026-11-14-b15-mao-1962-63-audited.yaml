      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-29.china-leadership
      when: July 29
      date: '1963-07-29'
      thread: china-leadership
      also:
      - testing
      c: Peking. Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others, July 29–30, on the draft statement of the Chinese government on the complete and thorough prohibition and destruction of nuclear weapons; the departure for Beidaihe put off. Zhou goes each afternoon to Diaoyutai to have it revised; at 1 a.m. July 31 he takes it to Mao and it is final.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 29, 1963 (the entries for July 29 and 30). Made public: 2013. See [[cal.1963-07-28.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:us
      - polity:uk
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-03.china-leadership
      when: Aug. 3
      date: '1963-08-03'
      thread: china-leadership
      also:
      - china
      c: Yinian Tang, afternoon. Mao receives J. B. Marks, Chairman of the South African Communist Party; Liu Ningyi and Wu Xueqian present. Asks the numbers of white and African; whether white workers or intellectuals sympathize with Africans, to be allies; if so, the struggle is not only racial but a class struggle.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 3, 1963. Made public: 2013. Names: Mao Zedong, J. B. Marks, Liu Ningyi, Wu Xueqian.'
      tags:
      - polity:prc
      - polity:south-africa
      - name:mao-zedong
      - vis:only:prc+south-africa
- add:
    entry:
      id: cal.1963-08-04.china-leadership
      when: Aug. 4
      date: '1963-08-04'
      thread: china-leadership
      also:
      - soviet-union
      - japan
      c: Yinian Tang, afternoon. Mao receives Kurahara Korehito, a member of the Japanese Communist Party's Politburo; Deng Xiaoping, Peng Zhen, Yang Shangkun, Liao Chengzhi present. The Soviet side printed our June 14 reply in 50,000 copies, "to put us off," while *Pravda* has over three million; the *People's Daily* prints all they say, and local papers shall; and the Chinese press speaks to the world in a dozen languages.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 4, 1963. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Kurahara Korehito, Yang Shangkun, Liao Chengzhi.'
      tags:
      - polity:prc
      - polity:japan
      - polity:ussr
      - name:mao-zedong
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1963-08-04.china-leadership-2
      when: Aug. 4
      date: '1963-08-04'
      thread: china-leadership
      also:
      - china
      c: 'Mao, reading Zhou Enlai''s Aug. 3 submission of the State Council Foreign Affairs Office''s paper of Aug. 2 on backing the American Black struggle against racial discrimination, tells Zhou''s secretary Pu Shouchang to turn its appendix, "The American race question in brief and the Black struggle now," into a statement: China has promised the Black leader Robert F. Williams a public statement of support.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 4 or 5, 1963 (and n. 53). Made public: 2013. To check: the Foreign Affairs Office report of Aug. 2, 1963. Names: Mao Zedong, Zhou Enlai, Pu Shouchang, Robert F. Williams.'
      tags:
      - polity:prc
      - polity:us
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-09.china-leadership
      when: Aug. 9
      date: '1963-08-09'
      thread: china-leadership
      also:
      - china
      c: The *People's Daily* prints, over Mao's name, his statement "Calling on the people of the world to unite against American imperialist racial discrimination and to support the American Blacks' struggle against it." Robert F. Williams, in Cuba, former president of the NAACP's Monroe, North Carolina, branch, asked twice this year for such a statement; Mao speaks "for the Chinese people." Mao had read the draft of Qiao Guanhua and Pu Shouchang on Aug. 7, asked Chinese, English and French texts, and on Aug. 8 sent the Chinese to Liu Shaoqi and Deng Xiaoping for Xinhua.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 9, 1963 (and the entries for Aug. 7 and 8). To check: the statement as printed, *Renmin ribao*, Aug. 9, 1963. See [[cal.1963-08-04.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Robert F. Williams, Qiao Guanhua, Pu Shouchang.'
      tags:
      - polity:prc
      - polity:us
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:qiao-guanhua
- add:
    entry:
      id: cal.1963-08-09.china-leadership-2
      when: Aug. 9
      date: '1963-08-09'
      thread: china-leadership
      also:
      - china
      c: Yinian Tang, afternoon. Mao receives Somalia's Prime Minister Shermarke and party; Zhou Enlai, Chen Yi and Li Xiannian present. China's economy is not yet strong and cannot satisfy your requests; in some years it will do better. The oppressed peoples' common task is liberation from imperialism and colonialism.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 9, 1963 ("同日"). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Yi, Li Xiannian, Shermarke.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-yi
      - name:li-xiannian
      - polity:somalia
      - name:abdirascid-ali-shermarke
      - vis:only:prc+somalia
- add:
    entry:
      id: cal.1963-08-26.china-leadership
      when: Aug. 26
      date: '1963-08-26'
      thread: china-leadership
      c: 'Yinian Tang. Mao presides at the Standing Committee on the draft "On the development of industry" and the work conference called for September. Deng Xiaoping reports the drafting committee''s discussions. Mao agrees to two steps; the time he would stretch: first stage fifteen years, then fifteen more; leave out "in the front rank" and say "a socialist power of the four modernizations." (In late August he had already changed "ten years" to "fifteen" in both steps, and "to the front rank" to "near the world''s advanced level.")'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 26, 1963. Made public: 2013. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-27.china-leadership
      when: Aug. 27
      date: '1963-08-27'
      thread: china-leadership
      also:
      - china
      c: Mao receives Thakin Ba Thein Tin, Vice-Chairman of the Communist Party of Burma; Deng Xiaoping and Li Qixin present. Unite the many, the more patriotic included, against the few; unite all anti-imperialist forces; oppose only the imperialists' lackeys and the comprador bourgeoisie; persuade General Ne Win to the same; and sends regards to Ne Win from himself, Liu Shaoqi and Zhou Enlai.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 27, 1963. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Ne Win, Liu Shaoqi, Zhou Enlai, Thakin Ba Thein Tin, Li Qixin.'
      tags:
      - polity:prc
      - polity:burma
      - name:mao-zedong
      - name:deng-xiaoping
      - name:ne-win
      - name:liu-shaoqi
      - name:zhou-enlai
      - vis:only:prc+burma
- add:
    entry:
      id: cal.1963-08-29.china-leadership
      when: Aug. 29
      date: '1963-08-29'
      thread: china-leadership
      also:
      - vietnam-diplomacy
      c: Yinian Tang, afternoon. Mao receives the National Liberation Front's delegation under Nguyễn Thị Bình, with the poet Thanh Hải. Ngô Đình Diệm presses monks, students, teachers and professors; the struggle in the south widens; Hồ Chí Minh has made a statement, a good one; he will echo it with his own, and likes to study the Front's tactics, in which it has invented much, as in the war with Japan.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 29, 1963. Made public: 2013. To check: Hồ Chí Minh''s statement of Aug. 28, 1963 (n. 63). Names: Mao Zedong, Nguyễn Thị Bình, Hồ Chí Minh, Ngô Đình Diệm, Thanh Hải.'
      tags:
      - polity:prc
      - polity:nlf
      - polity:rvn
      - name:mao-zedong
      - name:nguyen-thi-binh
      - name:ho-chi-minh
      - vis:only:prc+nlf
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1963-08-29.china-leadership-2
      when: Aug. 29
      date: '1963-08-29'
      thread: china-leadership
      also:
      - vietnam-diplomacy
      c: 'Mao revises the Foreign Ministry''s draft of a talk against the Diệm group''s bloody suppression of South Vietnam''s Buddhists, intended for the news report of his meeting; decides to make it a formal statement, "Against the aggression of the United States–Diệm group in South Vietnam and the slaughter of South Vietnam''s people," and sends it to Liu Shaoqi and Zhou Enlai. Radio Peking broadcasts it that evening: no weapon of the United States, no cruelty of the Diệm group, will save Diệm''s regime.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 29, 1963 ("同日"). To check: the statement as broadcast, Aug. 29, 1963. See [[cal.1963-08-29.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Ngô Đình Diệm.'
      tags:
      - polity:prc
      - polity:rvn
      - polity:us
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1963-08-29.china-leadership-3
      when: Aug. 29
      date: '1963-08-29'
      thread: china-leadership
      also:
      - china
      c: 'Mao cables Mrs. Du Bois on the death of W. E. B. Du Bois in Ghana (Aug. 27): "a great man of our time"; his heroic struggle for the liberation of the Black people and of mankind, his scholarship, and his sincere friendship for China will live in the Chinese people''s memory.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 29, 1963 ("同日"). Names: Mao Zedong, W. E. B. Du Bois.'
      tags:
      - polity:prc
      - polity:us
      - polity:ghana
      - name:mao-zedong
- add:
