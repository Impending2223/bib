    entry:
      id: cal.1963-11-14.china-leadership
      when: Nov. 14
      date: '1963-11-14'
      thread: china-leadership
      also:
      - soviet-union
      - testing
      c: Evening, Yinian Tang. Mao presides at the Standing Committee on the draft fifth commentary on the Soviet open letter, "The two lines on war and peace" (draft of Nov. 13). On Nov. 18 he reads the final text, adding the sentence "social practice is the sole criterion of truth," and tells Kang Sheng. Printed Nov. 19.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 14, 1963. Made public: 2013. To check: the commentary, *Renmin ribao*, Nov. 19, 1963, and *Hongqi* 1963 no. 22. Names: Mao Zedong, Kang Sheng.'
