    entry:
      id: cal.1962-07-20.china-leadership
      when: July 20
      date: '1962-07-20'
      thread: china-leadership
      c: 'Mao convenes and addresses the regional bureaus'' first secretaries. On household contracting: "Do you stand for socialism or for capitalism?"; not everywhere, not whole-country; the peasant to be willing, no rough hand; and: is the economic situation "all dark" or has it some light?'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 20, 1962. Made public: 2013. See [[cal.1962-07-19.china-leadership]]. Names: Mao Zedong.'
