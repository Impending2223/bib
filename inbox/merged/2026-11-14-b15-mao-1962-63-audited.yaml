- add:
    entry:
      id: cal.1963-10-14.china-leadership
      when: Oct. 14
      date: '1963-10-14'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Wuchang, afternoon. Mao with Wang Renzhong. On Sino-Soviet relations, three things: a break, isolation, war; the first two possible, the third "probably not." At home: the counties first to carry out the "five-antis," so that the "four clean-ups" can be opened out in the field; sweep the surface first, then go over it with care by stages.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 14, 1963. Made public: 2013. Names: Mao Zedong, Wang Renzhong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - vis:only:prc
