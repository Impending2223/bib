- add:
    entry:
      id: cal.1963-11-01.china-leadership
      when: Nov. 1
      date: '1963-11-01'
      thread: china-leadership
      also:
      - china
      c: 'Shanghai. Edgar Faure arrives with Zhou Enlai and Chen Yi. Afternoon, a meeting, Mao with Liu Shaoqi, Zhou, Deng Xiaoping and Chen Yi, on Faure''s three plans for establishing relations and on the Standing Committee''s views in Peking. Zhou: the first plan we cannot consider; the second is good but France has difficulty; if no choice, the third. The meeting thinks both sides want formal relations, and that a new proposal of direct establishment is better than the third plan; Zhou and Chen Yi to take it to the French.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 1, 1963. Made public: 2013. To check: the French record of Faure''s mission. See [[cal.1963-10-31.china-leadership]]. Names: Mao Zedong, Edgar Faure, Zhou Enlai, Chen Yi, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:fr
      - name:mao-zedong
      - name:faure-edgar-jean
      - name:zhou-enlai
      - name:chen-yi
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-11-02.china-leadership
      when: Nov. 2
      date: '1963-11-02'
      thread: china-leadership
      also:
      - china
      c: 'Shanghai. At 1 a.m. Mao reads Zhou Enlai''s report of 11 p.m. Nov. 1: he and Chen Yi saw Faure that evening, put the oral plan of direct establishment, and Faure agreed; Zhou will give him the text next day. Mao: "Very good; do it so." In the afternoon he calls Liu Shaoqi, Zhou, Deng and Chen Yi again.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 2, 1963. Made public: 2013. See [[cal.1963-11-01.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Chen Yi, Edgar Faure, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:fr
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-yi
      - name:faure-edgar-jean
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-11-02.china-leadership-2
      when: Nov. 2
      date: '1963-11-02'
      thread: china-leadership
      also:
      - china
      c: 'Shanghai, afternoon. Mao receives Faure and his wife; Zhou Enlai and Chen Yi present. Right that you came: normal relations to be set up between the two states. There will be opposition to the agreement from America. Faure: France follows an independent policy and need not consult America, but can decide itself. Mao: good; you are not Japan, not Britain; Field Marshal Montgomery told me he too disliked Britain''s being so much under American influence.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 2, 1963 ("同日"). Made public: 2013. To check: the French record. See [[cal.1963-11-02.china-leadership]]. Names: Mao Zedong, Edgar Faure, Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - polity:fr
      - name:mao-zedong
      - name:faure-edgar-jean
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc+fr
- add:
    entry:
      id: cal.1963-11-03.china-leadership
      when: Nov. 3
      date: '1963-11-03'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Hangzhou. Mao, with Liu Shaoqi, Deng Xiaoping, Ke Qingshi, Luo Ruiqing, Xie Fuzhi, Tian Jiaying and the East China first secretaries, on revising the "specific policies in the rural socialist education movement." With Liu and Deng on the anti-revisionist struggle two things are fixed: widen the circulation of the argument (the ban on local papers writing against revisionism lifted; center, bureau and province papers may; what appears in a national paper to be passed by the Propaganda Department and the Center, in a provincial one by the regional bureau; not county papers yet; no slogans, ballads, plays or cartoons); and widen the briefing, the report once given to cadres of rank 17 and up now to those below and Party members down to branch secretaries, and a second outline for workers, peasants and students.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 3, 1963. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Ke Qingshi, Luo Ruiqing, Xie Fuzhi, Tian Jiaying.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:ke-qingshi
      - name:luo-ruiqing
      - name:xie-fuzhi
      - vis:only:prc
- add:
    entry:
      id: cal.1963-11-14.china-leadership-2
      when: Nov. 14
      date: '1963-11-14'
      thread: china-leadership
      c: 'Huairen Hall. The enlarged Politburo, Liu Shaoqi presiding, adopts the Central Committee''s "Some concrete policies in the rural socialist education movement (draft)" (the "Later Ten Points") and its notice on printing and publicizing the two rural documents, a revision of Mao''s draft of Oct. 25: the May 20 and September drafts to go to every rural branch, two copies each, and to be read to all Party members and peasants, in factories, offices, schools and streets, to the democratic parties, the army and police, and to the landlords, rich peasants, counter-revolutionaries, bad elements and rightists. Sent out Nov. 18.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 14, 1963. Made public: 2013. To check: the notice and the two drafts, Nov. 18, 1963. See [[cal.1963-10-25.china-leadership]]. Names: Liu Shaoqi, Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
