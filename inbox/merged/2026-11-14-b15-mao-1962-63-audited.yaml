- add:
    entry:
      id: cal.1963-12-09.china-leadership
      when: Dec. 9
      date: '1963-12-09'
      thread: china-leadership
      also:
      - china
      c: 'Mao on Zhang Aiping and Li Tianyou''s Dec. 2 report on possible Nationalist raids on the mainland, which answers Zhou Enlai''s instruction of Nov. 27 to study the raiders'' new tricks: raids small, middling or large train the army and people, "the more the better"; the eighth measure, political, diplomatic and propaganda steps to go with the military, not to be taken for now.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 9, 1963 (and n. 84). Made public: 2013. Names: Mao Zedong, Zhang Aiping, Li Tianyou, Zhou Enlai.'
      tags:
      - polity:prc
      - polity:roc
      - name:mao-zedong
      - name:zhou-enlai
      - name:zhang-aiping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-12-12.china-leadership
      when: Dec. 12
      date: '1963-12-12'
      thread: china-leadership
      also:
      - soviet-union
      c: Great Hall. Mao receives José Sotomayor of the Peruvian Communist Party (Left); Zhao Yimin present. Today a sixth commentary appears; Khrushchev proposes a cease-fire, we shall answer in time, the articles not finished. The focus of the world's contradictions is Asia, Africa and Latin America, not Europe and North America; help the peoples of the three continents form an anti-imperialist front.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 12, 1963. Made public: 2013. Names: Mao Zedong, Khrushchev, José Sotomayor, Zhao Yimin.'
      tags:
      - polity:prc
      - polity:peru
      - polity:ussr
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc+peru
- add:
    entry:
      id: cal.1963-12-12.china-leadership-2
      when: Dec. 12
      date: '1963-12-12'
      thread: china-leadership
      c: 'Mao on the Propaganda Department''s *Wenyi qingkuang huibao* of Dec. 9, to Peng Zhen and Liu Ren: every art form, drama, ballads, music, painting, dance, film, poetry and literature, has many problems; in many, socialist reform has had little effect, and "dead men" still rule; the gains in film, new verse, folk song, painting and fiction not to be underrated, but drama and the like in worse trouble.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 12, 1963 ("同日"). Made public: 2013. Names: Mao Zedong, Peng Zhen, Liu Ren.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1963-12-16.china-leadership
      when: Dec. 16
      date: '1963-12-16'
      thread: china-leadership
      c: 'Mao to Lin Biao, He Long, Nie Rongzhen, Luo Ruiqing and Xiao Hua on industrial ministries learning from the army: proposals to set up political departments and instructors from the ministry down to the mine and works, with the "Four Firsts" and the "Three-Eight" style; he proposes to send several batches of good army cadres to do political work in industry, a batch a year, as in the Ministry of Petroleum: "it cannot be done otherwise."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 16, 1963. Made public: 2013. Names: Mao Zedong, Lin Biao, He Long, Nie Rongzhen, Luo Ruiqing, Xiao Hua.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:he-long
      - name:nie-rongzhen
      - name:luo-ruiqing
      - vis:only:prc
- add:
    entry:
      id: cal.1963-12-16.china-leadership-2
      when: Dec. 16
      date: '1963-12-16'
      thread: china-leadership
      c: 'Evening, Yinian Tang. Mao, Liu Shaoqi, Deng Xiaoping and others hear Nie Rongzhen on the ten-year plan for science and technology. First Mao asks all to rise in silence for Luo Ronghuan, dead this day; he praises his principle, his faithfulness, his work for Party unity. Party unity: the Party not pure; allow a minority to err in the open, not to scheme in secret.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 16, 1963. Made public: 2013. See [[cal.1963-12-16.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Nie Rongzhen, Luo Ronghuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:nie-rongzhen
      - name:luo-ronghuan
      - vis:only:prc
- add:
    entry:
      id: cal.1963-12-22.china-leadership
      when: Dec. 22
      date: '1963-12-22'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on Kang Sheng''s forwarding of Xu Liqun''s report on the Russian edition of vol. IV of the *Selected Works*: the translation long done, held back on Mao''s word; as the fight with revisionism is now unlike three years ago, the Foreign Languages Press to publish. "Liu, Deng, Peng: read; return to Kang Sheng to do."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 22, 1963. Made public: 2013. Names: Mao Zedong, Kang Sheng, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Xu Liqun.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:kang-sheng
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1963-12-22.china-leadership-2
      when: Dec. 22
      date: '1963-12-22'
      thread: china-leadership
      also:
      - vietnam-diplomacy
      c: Great Hall. Mao receives the delegation of the South Vietnam National Liberation Front and the South Vietnam Workers' Liberation Association. Asks where the base areas lie, the enemy's strength, the Front's fighting power. Ambush; strike the enemy while it moves; cut communications; strike by surprise; educate the people; rely on them, there is no other way; work among enemy troops, and win the officers on the left of center.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 22, 1963 ("同日"). Made public: 2013. See [[cal.1963-08-30.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:nlf
      - name:mao-zedong
      - vis:only:prc+nlf
- add:
    entry:
      id: cal.1963-12-24.china-leadership
      when: Dec. 24
      date: '1963-12-24'
      thread: china-leadership
      also:
      - china
      c: 'Mao to Lin Ke: bring him Assistant Secretary of State for Far Eastern Affairs Hilsman''s China speech in San Francisco of Dec. 13, and Stevenson''s two speeches in the United Nations on China, of Dec. 18 and 22.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 24, 1963. Made public: 2013. Names: Mao Zedong, Hilsman, Stevenson, Lin Ke.'
      tags:
      - polity:prc
      - polity:us
      - name:mao-zedong
      - name:hilsman-roger
      - name:stevenson-adlai-e
      - vis:only:prc
- add:
    entry:
      id: cal.1963-12-27.china-leadership
      when: Dec. 27
      date: '1963-12-27'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'Mao to Hồ Chí Minh, by letter, in reply to several: a second Sino-Soviet meeting may be held in some months, not for the next few, for there is "nothing new to say." Once the eleven parties (the Chinese, Soviet, Albanian and the others) have agreed on policy, the Chinese and Soviet parties may meet; not three or four meetings but a dozen, tens of them, over years to ten years, "for a result good for revolution and true unity: we have patience." The international situation very good. Warm congratulations on the plenum of the Vietnamese Central Committee (he has heard it went well).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 27, 1963. Made public: 2013. To check: Hồ Chí Minh''s letters to Mao to which this answers; the Vietnam Workers'' Party Ninth Plenum (Dec. 1963). Names: Mao Zedong, Hồ Chí Minh.'
      tags:
      - polity:prc
      - polity:drv
      - name:mao-zedong
      - name:ho-chi-minh
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1963-12-28.china-leadership
      when: Dec. 28
      date: '1963-12-28'
      thread: china-leadership
      also:
      - china
      c: 'Mao on the Foreign Ministry''s *Xin qingkuang* of Dec. 26, "A new reading of American China policy: on Hilsman''s speech of Dec. 13," to Liu Shaoqi, Deng Xiaoping, the Foreign Ministry and the Foreign Affairs Office: the analysis "very good"; an article to be published, on a study of Asia, criticizing on reason, on the offensive, revised many times, in half a month if possible, a month or two if not; Hilsman''s speech to be printed too.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 28, 1963. Made public: 2013. To check: the *Xin qingkuang* of Dec. 26, 1963. See [[cal.1963-12-24.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Hilsman.'
      tags:
      - polity:prc
      - polity:us
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:hilsman-roger
      - vis:only:prc
- add:
    entry:
      id: cal.1963-12-30.china-leadership
      when: Dec. 30
      date: '1963-12-30'
      thread: china-leadership
      c: 'Mao on the report of the Central Committee''s Foreign Affairs Group and Propaganda Department (Dec. 25) on strengthening the study of foreign countries: "very good," but it leaves out religion; Christianity, Islam and Buddhism still move many people, and China knows nothing of them, with no research body led by Marxists and no journal worth reading.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 30, 1963. Made public: 2013. To check: the report of Dec. 25, 1963. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
