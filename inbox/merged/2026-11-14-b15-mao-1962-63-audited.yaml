    entry:
      id: cal.1963-10-31.china-leadership
      when: Oct. 31
      date: '1963-10-31'
      thread: china-leadership
      also:
      - china
      c: Hangzhou, morning. Mao reads Zhou Enlai's telephoned record of the points he will make in the talks to establish relations with France, and decides to call Liu Shaoqi, Zhou, Deng Xiaoping and Chen Yi to Shanghai on Nov. 1; Peng Zhen to stay in Peking.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 31, 1963. Made public: 2013. To check: Zhou''s record of Oct. 30–31. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Chen Yi, Peng Zhen.'
      tags:
