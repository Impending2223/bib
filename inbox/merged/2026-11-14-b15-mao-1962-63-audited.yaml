      c: Yinian Tang, evening. Mao presides at an enlarged Standing Committee meeting on the Sino-Indian border conflict; present, Liu Shaoqi, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi, He Long, Nie Rongzhen, Xu Xiangqian, Ye Jianying, Luo Ruiqing and the regional bureaus' first secretaries. Mao calls the Standing Committee again Sept. 18 and 20; on Sept. 21 afternoon a meeting again on the border conflict.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 17, 1962. Made public: 2013. See [[cal.1962-09.south-asia-3]]. Names: Mao Zedong, Liu Shaoqi, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi, He Long, Nie Rongzhen, Xu Xiangqian, Ye Jianying, Luo Ruiqing. Check: Whether Sept. 18 and 20 dealt with the same matter: the nianpu gives no subject.'
