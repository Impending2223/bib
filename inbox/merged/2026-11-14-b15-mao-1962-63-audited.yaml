      when: Dec. 25
      date: '1962-12-25'
      thread: china-leadership
      also:
      - soviet-union
      c: To learn how the Chinese delegations fared at the congresses of the Bulgarian, Hungarian, Czechoslovak and Italian parties, Mao asks Liu Shaoqi, Zhou Enlai and Deng Xiaoping to send Liu Xiao, Wu Xiuquan, Zhao Yimin and Liao Chengzhi to Hangzhou by Jan. 6, to look into things on the way at Tianjin, Jinan, Hefei, Nanjing and Shanghai.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 25, 1962. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Liu Xiao, Wu Xiuquan, Zhao Yimin, Liao Chengzhi.'
