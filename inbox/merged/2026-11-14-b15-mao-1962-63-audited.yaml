- add:
    entry:
      id: cal.1962-08-09.china-leadership
      when: Aug. 9
      date: '1962-08-09'
      thread: china-leadership
      c: 'Beidaihe. Mao at the core group: the groups'' discussion of concrete things only, heavy and dull; "the need now is to take the question to principle." Two kinds of men, those who see only darkness and those who see mostly dark with a little light; if all is dark, socialism has failed and all must go it alone; in a year or so go-it-alone makes class division, with branch secretaries taking more, keeping concubines, lending at interest, buying land, and the poor ruined, among them the households of soldiers'' kin and the "five guaranteed."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 9, 1962. Made public: 2013. See [[cal.1962-08-06.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-10.china-leadership
      when: Aug. 10
      date: '1962-08-10'
      thread: china-leadership
      also:
      - china
      c: 'Mao on a report on Algeria from the Party committee of China''s embassy in Morocco to the Foreign Ministry: "worth reading." The center knows little of home affairs, many leading organs blocking news, asking nothing beforehand and reporting nothing after, each "an independent kingdom," while the embassies report carefully and promptly; a fault of ten years, to be mended, or else discipline.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 10, 1962. Made public: 2013. To check: the embassy''s report on Algeria. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:algeria
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-11.china-leadership
      when: Aug. 11
      date: '1962-08-11'
      thread: china-leadership
      c: 'Beidaihe. Mao at the core group. Hearing that the groups have taken up questions of principle: good. A letter from a Shaanxi commune holds that household contracting shows autumn in a leaf: "I say it can show winter; and winter ends in spring." Not all darkness: the novels of exposure, such as *Guanchang xianxing ji*, Lu Xun called "reproach novels" and no one likes them. Liu Shaoqi, Deng Xiaoping, Chen Yi and Deng Zihui speak; Deng Zihui''s self-criticism. Mao: the January conference''s estimate of the situation was right; those who say eight years to recover should not say so many.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 11, 1962. Made public: 2013. See [[cal.1962-08-09.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Chen Yi, Deng Zihui.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:chen-yi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-12.china-leadership
      when: Aug. 12
      date: '1962-08-12'
      thread: china-leadership
      c: 'Mao on the Organization Department''s July report to him and the Standing Committee: to be circulated; the department had never reported to the center, "an independent kingdom"; its head, An Ziwen, criticized, has awakened; may the fault not return.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 12, 1962. Made public: 2013. Names: Mao Zedong, An Ziwen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-12.china-leadership-2
      when: Aug. 12
      date: '1962-08-12'
      thread: china-leadership
      c: 'Mao has the Rural Work Department''s paper of Aug. 24, 1961, "How the Sixty Articles are being carried out," first circulated at the 1961 Lushan conference, circulated to this one, with a note: the department was then right, but Deng Zihui wavered a year later, seeing the situation as nearly all dark and pressing household contracting. He welcomes Deng''s self-criticism of Aug. 11, finding it still short.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 12, 1962 ("同日"). Made public: 2013. See [[cal.1962-08-11.china-leadership]]. Names: Mao Zedong, Deng Zihui. Check: the nianpu itself calls the note''s criticism of Deng Zihui mistaken ("错误地批评").'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-15.china-leadership
      when: Aug. 15
      date: '1962-08-15'
      thread: china-leadership
      c: 'Beidaihe. Mao at the core group, Li Fuchun, Tan Zhenlin and Kang Sheng speaking. The estimate of the situation, by March, May and August, has come back to the January conference''s; recovery perhaps two years more, this year and next, with the tail in 1964; "low standard, vegetables-and-substitutes" no more; blind command ended, high procurement mended. The year: work conference in August, plenum in September, another work conference in November for next year''s plan.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 15, 1962. Made public: 2013. See [[cal.1962-08-11.china-leadership]]. Names: Mao Zedong, Li Fuchun, Tan Zhenlin, Kang Sheng.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:li-fuchun
      - name:tan-zhenlin
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-15.china-leadership-2
      when: Aug. 15
      date: '1962-08-15'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao, with Liu Shaoqi and Zhou Enlai, telegraphs Moscow congratulations on the manned flights of *Vostok 3* and *Vostok 4*.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 15, 1962 ("同日"). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
- add:
    entry:
      id: cal.1962-08-18.china-leadership
      when: Aug. 18
      date: '1962-08-18'
      thread: china-leadership
      also:
      - china
      - south-asia
      c: 'Mao on the Central Military Commission''s Aug. 10 report for May–July: the emergency preparations against an American–Nationalist attack on the southeast coast (late May to mid-June), the struggle against India''s "nibbling" in the western sector, and the early summer call-up. To be circulated: army, people, Party and government "very good and invincible"; whoever misses it is an opportunist.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 18, 1962. Made public: 2013. See [[cal.1962-06-08.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:roc
      - polity:india
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-24.china-leadership
      when: Aug. 24
      date: '1962-08-24'
      thread: china-leadership
      also:
      - laos
      c: Beidaihe. Mao presides at the closing plenary of the Central Work Conference, which hears Chen Yi's report on the Geneva conference and related matters. Mao returns to Peking. Same day he has the Aug. 17 revised draft of the decision on the communes' collective economy circulated; it, and the revised "Work Regulations" of Aug. 6, are later adopted at the Tenth Plenum.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 24, 1962. Made public: 2013. See [[cal.1962-08-06.china-leadership]]. Names: Mao Zedong, Chen Yi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:chen-yi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-26.china-leadership
      when: Aug. 26
      date: '1962-08-26'
      thread: china-leadership
      c: Peking. The preparatory meeting for the Tenth Plenum opens (Aug. 26–Sept. 23). First it takes two farm papers and criticizes Deng Zihui's "go-it-alone wind," the international situation and the exchange of cadres; from Sept. 6–7 the six groups turn to criticizing Peng Dehuai and Xi Zhongxun's "reversal wind."
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 26, 1962. Made public: 2013. Names: Mao Zedong, Peng Dehuai, Xi Zhongxun, Xiao Hua.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-dehuai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-26.china-leadership-2
      when: Aug. 26
      date: '1962-08-26'
      thread: china-leadership
      c: 'Mao has circulated to the preparatory meeting Xiao Hua''s Aug. 20 paper on the army''s reaction to Deng Zihui''s talk of May 31–June 1 to over 3,000 officers (many thought it wrong to say go-it-alone has merits; some found it bold and freeing). On Aug. 29 he adds: go-it-alone has a little market among military cadres, but not a majority; the great majority are for socialism.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 26, 1962 (and Aug. 29, 1962). Made public: 2013. See [[cal.1962-08-26.china-leadership]]. Names: Mao Zedong, Deng Zihui, Xiao Hua.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-31.china-leadership
      when: Aug. 31
      date: '1962-08-31'
      thread: china-leadership
      also:
      - china
      c: Yinian Tang. Mao receives Janet Jagan, wife of Cheddi Jagan, Premier of British Guiana, and voices his support for Guiana's struggle for independence. China has done some work, much remains, there are things it has not learned, advanced technology above all; economic hardship for two or three years will be overcome; the people and Party united; China relies on itself.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 31, 1962. Made public: 2013. Names: Mao Zedong, Janet Jagan, Cheddi Jagan.'
      tags:
      - polity:prc
      - polity:guyana
      - name:mao-zedong
      - name:jagan-janet
      - name:jagan-cheddi-b
      - vis:only:prc+guyana
- add:
    entry:
      id: cal.1962-09-03.china-leadership
      when: Sept. 3
      date: '1962-09-03'
      thread: china-leadership
      c: Mao calls a small meeting and proposes that Peng Dehuai's two letters be circulated to the Tenth Plenum's preparatory groups.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 3, 1962. Made public: 2013. See [[cal.1962-08-26.china-leadership]]. Names: Mao Zedong, Peng Dehuai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-dehuai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-09-07.china-leadership
      when: Sept. 7
      date: '1962-09-07'
      thread: china-leadership
      also:
      - china
      c: 'Qinzheng Hall, afternoon. Mao receives youth and student delegations from Colombia, Peru, Ecuador, Guatemala and Puerto Rico and an Argentine folk-art troupe; Chen Yi and Hu Yaobang present. All on one front against imperialism for national liberation; the Chinese had a "fear-America disease, worship-America disease, pro-America disease," and one of Japan before, cured by the eight years'' war; the land revolution: rouse the masses by every means at the right time.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 7, 1962. Made public: 2013. Names: Mao Zedong, Chen Yi, Hu Yaobang.'
      tags:
      - polity:prc
