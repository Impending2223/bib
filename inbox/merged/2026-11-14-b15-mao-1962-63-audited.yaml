patch: 2026-11-14-b15-mao-1962-63
by: 'Claude (batch 15, reader 2: *Mao Zedong nianpu 1949–1976*, V, 1962–63 except October 1962, from the owner''s Drive epub of the 2013 set), Nov. 14, 2026; audited by Claude (Opus), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1962-01-03.china-leadership
      when: Jan. 3
      date: '1962-01-03'
      thread: china-leadership
      also:
      - china
      - japan
      c: 'Zhongnanhai, the Yinian Tang, evening. Mao receives Yasui Kaoru, head of the Japan Council against Atomic and Hydrogen Bombs; Liao Chengzhi and Liu Ningyi present. Mao: the socialist camp one side, the United States the other, the rest an "intermediate zone" of three kinds: states with colonies (Britain, France, Belgium, the Netherlands); states truly independent (Guinea, the UAR, Mali, Ghana); states independent in name. Britain and France imperialist, but at odds with the United States and so indirect allies of the peoples.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 3, 1962. Made public: 2013. Names: Mao Zedong, Yasui Kaoru, Liao Chengzhi.'
      tags:
      - polity:prc
      - polity:japan
      - name:mao-zedong
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1962-01-04.china-leadership
      when: Jan. 4
      date: '1962-01-04'
      thread: china-leadership
      c: Zhongnanhai, the Yinian Tang. Mao presides at an enlarged meeting of the Politburo Standing Committee on streamlining (精简) of staff.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 4, 1962. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-07.china-leadership
      when: Jan. 7
      date: '1962-01-07'
      thread: china-leadership
      also:
      - china
      c: 'Mao to João Goulart, President of Brazil, by letter: his August 1961 visit to China left a deep impression; China watched with concern and now congratulates the Brazilian people on their victory in defense of independence against American interference; approves Brazil''s foreign policy of respect for sovereignty and ties with all states.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 7, 1962. Made public: 2013. To check: the letter''s text. Names: Mao Zedong, Goulart.'
      tags:
      - polity:prc
      - polity:brazil
      - name:mao-zedong
      - name:goulart-joao
      - vis:only:prc+brazil
- add:
    entry:
      id: cal.1962-01-09.china-leadership
      when: Jan. 9
      date: '1962-01-09'
      thread: china-leadership
      also:
      - china
      c: 'The Central Committee''s statement condemning the American government''s anti-communist "atrocities" and supporting the American Communist Party''s struggle. Mao, on the Secretariat''s draft sent by Yang Shangkun on Jan. 8: "seen, agreed." Published in the People''s Daily, Jan. 15.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 9, 1962. Made public: 2013. To check: the statement as printed in the *Renmin ribao* of Jan. 15, 1962. Names: Mao Zedong, Yang Shangkun.'
      tags:
      - polity:prc
      - polity:us
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-10.china-leadership
      when: Jan. 10
      date: '1962-01-10'
      thread: china-leadership
      c: 'Mao on the draft report to the enlarged Central Work Conference, which Liu Shaoqi and Deng Xiaoping drafted: reads parts one and two (Jan. 9–10); at 10 a.m. tells Tian Jiaying, with word to Liu, Deng and Chen Boda, to put the report back three days, the delegates to discuss in groups meanwhile; then to Deng, Chen and Tian: the report''s center (against "dispersionism") stands, but it goes to the delegates now, for comment, before the Politburo takes it up. "You make me a sage in this report." The General Office sends out the draft the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 9, 1962 (the entry for Jan. 9–10). Made public: 2013. To check: the draft report (first draft), Jan. 10, 1962. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Chen Boda, Tian Jiaying.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:chen-boda
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-11.china-leadership
      when: Jan. 11
      date: '1962-01-11'
      thread: china-leadership
      c: 'The enlarged Central Work Conference (the "Seven Thousand Cadres" conference) opens in Peking, Mao presiding; over 7,000 leading cadres of the center, the regional bureaus, the provinces, prefectures, counties, major factories and the army. Its stated aim: sum up twelve years, especially four, strengthen unity, discipline and democratic centralism, and carry out the policy of adjusting the economy. It runs to Feb. 7.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 11, 1962. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-12.china-leadership
      when: Jan. 12
      date: '1962-01-12'
      thread: china-leadership
      also:
      - japan
      c: 'Mao receives the Japan Socialist Party delegation under Suzuki Mosaburo, adviser; Zhang Xiruo and Liao Chengzhi present. To Ishibashi Masashi, a student of military theory: Engels and Clausewitz; Sunzi earlier than Clausewitz and the best of the Chinese classics. On the Lu Xun poem he wrote out for them last year: it was written for the Chinese people; if it helps them, so much the better.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 12, 1962. Made public: 2013. Names: Mao Zedong, Suzuki Mosaburo, Liao Chengzhi, Ishibashi Masashi.'
      tags:
      - polity:prc
      - polity:japan
      - name:mao-zedong
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1962-01-14.china-leadership
      when: Jan. 14
      date: '1962-01-14'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Qinzheng Hall, evening. Mao receives Albania''s government economic delegation under Kellezi, Vice-Chairman of the Council of Ministers; Liu Shaoqi, Li Xiannian and Luo Ruiqing present. On the trouble in the international communist movement: the sky will not fall (the man of Qi who feared it); "hold on, and that is victory."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 14, 1962. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Li Xiannian, Luo Ruiqing, Kellezi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:li-xiannian
      - name:luo-ruiqing
      - polity:albania
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1962-01-16.china-leadership
      when: Jan. 16
      date: '1962-01-16'
      thread: china-leadership
      c: 'Diaoyutai, Building 12, evening. Mao, with Liu Shaoqi, Deng Xiaoping, Chen Boda and Tian Jiaying, on the report: many objections to the first draft; proposes a drafting committee of the regional bureaus'' first secretaries and others, who are to settle the main contradiction first and may overturn the draft whole. The committee is formed that night, 21 men: Liu, Zhou Enlai, Deng, Chen Yun, Lin Biao, Peng Zhen, Li Fuchun, Li Xiannian, Ke Qingshi, Li Jingquan, Chen Boda, Bo Yibo, Tao Zhu, Ulanhu, Liu Lantao, Song Renqiong, Yang Shangkun, Wang Renzhong, Hu Sheng, Tian Jiaying, Wu Lengxi. It meets daily from Jan. 17 under Liu; second draft Jan. 24.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 16, 1962. Made public: 2013. See [[cal.1962-01-11.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Yun, Lin Biao, Peng Zhen, Li Fuchun, Li Xiannian, Ke Qingshi, Li Jingquan, Chen Boda, Bo Yibo, Tao Zhu, Ulanhu, Liu Lantao, Song Renqiong, Yang Shangkun, Wang Renzhong, Hu Sheng, Tian Jiaying, Wu Lengxi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:chen-yun
      - name:lin-biao
      - name:peng-zhen
