      when: Dec. 3
      date: '1963-12-03'
      thread: china-leadership
      also:
      - soviet-union
      c: Chervonenko gives Yang Shangkun and Wu Xiuquan the Soviet Central Committee's letter of Nov. 29, asking an end to the public polemics and a conference of fraternal parties. Mao decides on the spot that Deng Xiaoping shall read it at the NPC's closing session.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 3, 1963. Made public: 2013. To check: the Soviet letter of Nov. 29, 1963. Names: Mao Zedong, Chervonenko, Deng Xiaoping, Yang Shangkun, Wu Xiuquan.'
