    entry:
      id: cal.1963-11-26.china-leadership
      when: Nov. 26
      date: '1963-11-26'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, on Nov. 24 evening and Nov. 26 at 2 a.m., on the reply to Sukarno''s letter of Oct. 23 that Kang Sheng drafted, hears Kang''s changes and reads his amended draft of Nov. 25: "Yang Shangkun: do it at once." The reply: Sukarno''s concern at the Sino-Soviet differences and wish to settle them by consultation is thanked; China has stood on principle, and seeks unity.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 24, 1963 (Nov. 26). Made public: 2013. Names: Mao Zedong, Kang Sheng, Sukarno, Yang Shangkun. To check: the reply as sent.'
      tags:
      - polity:prc
      - polity:indonesia
      - name:mao-zedong
      - name:kang-sheng
      - name:sukarno
      - vis:only:prc
