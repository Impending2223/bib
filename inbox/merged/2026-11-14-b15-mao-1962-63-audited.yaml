      when: Dec. 30
      date: '1962-12-30'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao at 2 a.m. to Deng Xiaoping: the article on Togliatti read, well written, the title right; to be broadcast that afternoon and appear in the papers Dec. 31.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 30, 1962. Made public: 2013. To check: the article as printed, *Renmin ribao*, Dec. 31, 1962. See [[cal.1962-12-24.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Togliatti.'
