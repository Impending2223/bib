    entry:
      id: cal.1962-09-13.china-leadership
      when: Sept. 13
      date: '1962-09-13'
      thread: china-leadership
      also:
      - china
      c: 'Mao has Luo Ruiqing read two items in that day''s *Cankao xiaoxi*: that Chiang''s air force will go over entirely to supersonic F-104s; that the United States ships many Nike ("Victory Goddess," 胜利女神) missiles to Japan, able to destroy Shenyang''s arms industry and keep the Chinese army from crossing the Yalu again, and so "welcomed" by Taiwan. On the second: "This passage is worth noting."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 13, 1962. Made public: 2013. Names: Mao Zedong, Luo Ruiqing. Check: the dispatch''s source.'
