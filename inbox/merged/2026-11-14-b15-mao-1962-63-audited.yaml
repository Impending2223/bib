      id: cal.1963-08-30.china-leadership
      when: Aug. 30
      date: '1963-08-30'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam-diplomacy
      c: 'Mao receives the Vietnam Workers'' Party''s Southern Bureau secretary Nguyễn Văn Linh ("Mười Cúc," 阮梅菊 in the nianpu); Zhou Enlai and Luo Ruiqing present. Asks: has the south a radio, do its commands keep radio contact, has the army fought Americans directly, do the people fear them. Told that the men who have fought the Americans think them worse fighters than the French, he says: those at the front are the steadier.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 30, 1963. Made public: 2013. See [[cal.1963-08-29.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Luo Ruiqing, Nguyễn Văn Linh.'
