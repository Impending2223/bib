    entry:
      id: cal.1962-07-22.china-leadership
      when: July 22
      date: '1962-07-22'
      thread: china-leadership
      also:
      - south-asia
      c: 1:30 a.m., Juxiang Shuwu. Mao hears Zhou Enlai on the Indian attack of July 21 on a Chinese border post in the Chip Chap valley, Xinjiang. Today the Chinese government protests sharply.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 22, 1962. Made public: 2013. See [[cal.1962-07-12.china-leadership]]. Names: Mao Zedong, Zhou Enlai.'
