- add:
    entry:
      id: cal.1962-07-31.china-leadership
      when: July 31
      date: '1962-07-31'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Beidaihe. Mao sends to the Central Work Conference two items on Yugoslavia, with notes: a *Cankao ziliao* summary of Yugoslav leaders'' speeches at the League''s plenum of July 22–23 (output, productivity and consumption slow, farm output stagnant three years, debts falling due, no foreign exchange), and the *People''s Daily* report of July 29. "Please discuss: is it better to take the Yugoslav road or the Marxist–Leninist road?"'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 31, 1962. Made public: 2013. To check: the *Cankao ziliao* no. 5184 and the *Renmin ribao* of July 29, 1962. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:yugoslavia
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-01.china-leadership
      when: Aug. 1
      date: '1962-08-01'
      thread: china-leadership
      c: Early August. Mao revises the Central Committee's Aug. 1 draft "provisions on the correct treatment of go-it-alone." He adds that members holding other views may state and keep them; that the breakup of some production teams cannot be avoided, now or for decades and centuries to come; that the struggle of the two roads in the villages may last "decades or hundreds of years."
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 1, 1962 (the entry for "8月初"). Made public: 2013. See [[cal.1962-07-31.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-03.china-leadership
      when: Aug. 3
      date: '1962-08-03'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Beidaihe. Mao with the northwest''s secretaries (Shaanxi, Gansu, Qinghai, Ningxia, Xinjiang): the question of the conference, the socialist or the individual road; the struggle of the classes long. On Xinjiang he asks: did Khrushchev, by urging the people of Ili and Tacheng to flee and by the Yining riot, mean to overthrow the Ili prefectural committee or something else? How many troops in Xinjiang; could they hold it if war came; do more need to go in; do the farm divisions have arms and time to train?'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 3, 1962. Made public: 2013. See [[cal.1962-06-27.china-leadership]]. Names: Mao Zedong, Khrushchev.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-05.china-leadership
      when: Aug. 5
      date: '1962-08-05'
      thread: china-leadership
      c: 'Beidaihe. Mao on the conference''s "core group": approves Deng Xiaoping''s list of 22: Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Deng, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Chen Yi, Chen Boda, Luo Ruiqing, Xie Fuzhi, Gu Mu, Lu Dingyi, Yang Shangkun, Ke Qingshi, Li Jingquan, Tao Zhu, Song Renqiong, Li Xuefeng, Liu Lantao. "Do as proposed." At noon he had told Deng Zihui, Chen Boda, Ke Qingshi, Tao Zhu and others: he had been round the country and every province said last year better than the year before; it is not all dark nor all light as in 1958; "I am a centrist"; a few percent to a dozen percent of go-it-alone may be allowed, the already-divided not to be forced back.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 5, 1962. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Chen Yi, Chen Boda, Luo Ruiqing, Xie Fuzhi, Lu Dingyi, Ke Qingshi, Li Jingquan, Tao Zhu, Gu Mu, Yang Shangkun, Song Renqiong, Li Xuefeng, Liu Lantao, Deng Zihui.'
      tags:
