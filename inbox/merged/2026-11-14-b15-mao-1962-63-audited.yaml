- add:
    entry:
      id: cal.1962-09-27.china-leadership-2
      when: Sept. 27
      date: '1962-09-27'
      thread: china-leadership
      c: Mao revises the Tenth Plenum's communique, several times (Sept. 26–27). To its sentence on class struggle and the two roads he adds "through the whole historical period from capitalism to communism (decades, then "more time" for "hundreds of years")," and a passage that the overthrown reactionary classes do not accept their end and will try to come back, that bourgeois influence, old habits and the spontaneous capitalist tendency of small producers remain.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 26, 1962 (the entry for Sept. 26–27). Made public: 2013. To check: the communique as published, *Renmin ribao*, Sept. 29, 1962. See [[cal.1962-09-27.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-09-28.china-leadership
      when: Sept. 28
      date: '1962-09-28'
      thread: china-leadership
      also:
      - vietnam-diplomacy
      c: 'The Great Hall, afternoon. Mao receives the South Vietnam National Liberation Front''s delegation under Nguyễn Văn Hiếu, secretary-general; Liao Chengzhi, Geng Biao and Liu Ningyi present. Asks the south''s people, area, ground and forces. Then teaches China''s armed revolution: the war there like China''s against Japan, many bases cut off from one another, the enemy strong in men and arms; destroy the enemy piecemeal; "the enemy advances, we retreat," and the rest of the sixteen-character rule.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 28, 1962. Made public: 2013. See [[cal.1962-09.vietnam-diplomacy]]. Names: Mao Zedong, Nguyễn Văn Hiếu, Geng Biao, Liao Chengzhi, Liu Ningyi.'
      tags:
      - polity:prc
      - polity:nlf
      - name:mao-zedong
      - name:nguyen-van-hieu
      - vis:only:prc+nlf
- add:
    entry:
      id: cal.1962-09-29.china-leadership
      when: Sept. 29
      date: '1962-09-29'
      thread: china-leadership
      also:
      - china
      c: The Great Hall, afternoon. Mao receives Hartini Sukarno, wife of Sukarno; Jiang Qing, Wang Guangmei, Deng Yingchao, Chen Yi and wife, Huang Zhen present. Indonesia a good friend of China; West Irian regained, an anti-imperialist victory; China favors Sukarno's plan for a second Afro-Asian conference; and "hidden enemies" may plot against Sukarno, the security organs are to be strengthened and kept sharp.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 29, 1962. Made public: 2013. Names: Mao Zedong, Chen Yi, Sukarno, Hartini Sukarno, Jiang Qing, Wang Guangmei, Deng Yingchao, Huang Zhen.'
      tags:
      - polity:prc
      - polity:indonesia
      - name:mao-zedong
      - name:chen-yi
      - name:sukarno
      - name:jiang-qing
      - name:huang-zhen
      - vis:only:prc+indonesia
- add:
    entry:
      id: cal.1962-09-29.china-leadership-2
      when: Sept. 29
      date: '1962-09-29'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on *Waishi jianbao* no. 137: "worth reading"; revisionists at home and abroad collude with foreigners, and the men in international work must see it or be fooled. He asks Wang Jiaxiang, Wu Xiuquan and Liu Ningyi to hold a symposium of a dozen or so from the Foreign Ministry, the Foreign Affairs Office, the Foreign Affairs Association and the Cultural Federation, taking "the Japan incident" and others as cases.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 29, 1962 ("同日"). Made public: 2013. To check: *Waishi jianbao* no. 137. Names: Mao Zedong, Wang Jiaxiang, Wu Xiuquan, Liu Ningyi. Check: "the Japan incident," which the nianpu does not explain.'
      tags:
      - polity:prc
      - polity:japan
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-09-30.china-leadership
      when: Sept. 30
      date: '1962-09-30'
      thread: china-leadership
      also:
      - china
      c: The Great Hall, afternoon. Mao receives a delegation of South African Communist Party students; Liu Ningyi and Wu Xueqian present. Asks South Africa's economy, population, workers and peasants. The universal truth of Marxism–Leninism joined to the country's concrete facts applies to all; China made the error of dogmatism, took stock in 1935 and again in the war against Japan; Marxism–Leninism develops and is not complete.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 30, 1962. Made public: 2013. Names: Mao Zedong, Wu Xueqian.'
      tags:
      - polity:prc
      - polity:south-africa
      - name:mao-zedong
      - vis:only:prc+south-africa
- add:
    entry:
      id: cal.1962-11-05.china-leadership
      when: Nov. 5
      date: '1962-11-05'
      thread: china-leadership
      also:
      - china
      c: Evening. Mao receives a Venezuelan Communist Party delegation on military study; Liu Ningyi present. Tells of China's armed struggle; advises them to study Cuba's experience, nearer and newer, and Algeria's; Chinese experience is a reference, not to be copied. "The future is bright, the road winding."
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 5, 1962. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:venezuela
      - name:mao-zedong
      - vis:only:prc+venezuela
- add:
    entry:
      id: cal.1962-11-21.china-leadership
      when: Nov. 21
      date: '1962-11-21'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: 'Midnight. The Chinese government''s statement: India still refuses the three proposals of Oct. 24 and widens the clashes; China will act first. From midnight Nov. 22 its frontier forces cease fire along the whole border; from Dec. 1 they withdraw 20 kilometers behind the line of actual control of Nov. 7, 1959; checkposts with some civil police on China''s side of the line.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 21, 1962 (and Nov. 22: the cease-fire at midnight). To check: the statement as printed in the *Renmin ribao*, Nov. 21, 1962. See [[cal.1962-11-20.south-asia]].'
      tags:
      - polity:prc
      - polity:india
      - name:mao-zedong
- add:
    entry:
      id: cal.1962-11-21.china-leadership-2
      when: Nov. 21
      date: '1962-11-21'
      thread: china-leadership
      also:
      - south-asia
      c: '9:30 p.m. Mao and Zhou Enlai on how to extend the impact of the victory on the Indian border: Zhou to call the people from the Foreign Affairs Office, the Foreign Ministry, the Propaganda Department and the *People''s Daily*; on Nov. 22 Zhou and Chen Yi meet them and lay out several measures.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 21, 1962 ("同日"). Made public: 2013. See [[cal.1962-11-21.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - polity:india
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-27.china-leadership
      when: Nov. 27
      date: '1962-11-27'
      thread: china-leadership
      also:
      - south-asia
      c: Mao revises Zhou Enlai's draft letters on the Sino-Indian boundary to Sukarno (China is sending Vice-Foreign Minister Huang Zhen to Jakarta to exchange views, as Sukarno wished, and hopes he will move India to match the statement of Nov. 21 and bring talks) and to Ne Win, Chairman of Burma's Revolutionary Council (the draft by another hand). In Ne Win's he changes "precious" to "useful" and the sharp "the dangerous situation" to "the former situation," "a turn" to "a relaxation"; unilateral action by China alone will not wholly prevent renewed fighting or make a good air for talks.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 27, 1962. Made public: 2013. See [[cal.1962-11-26.china]]. Names: Mao Zedong, Zhou Enlai, Sukarno, Ne Win.'
      tags:
