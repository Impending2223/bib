      when: Oct. 1
      date: '1963-10-01'
      thread: china-leadership
      also:
      - china
      c: Peking. Mao receives the American Black leader Robert F. Williams and his wife; Guo Moruo present.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 1, 1963 ("同日"). Made public: 2013. See [[cal.1963-08-09.china-leadership]]. Names: Mao Zedong, Robert F. Williams, Guo Moruo. Check: the nianpu gives no words.'
