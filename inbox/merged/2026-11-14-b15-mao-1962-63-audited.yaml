    entry:
      id: cal.1963-01-05.china-leadership-2
      when: Jan. 5
      date: '1963-01-05'
      thread: china-leadership
      also:
      - south-asia
      c: 'Hangzhou, 6 p.m. Mao receives Bandaranaike on the Sino-Indian boundary and the Colombo conference; Zhou Enlai, Chen Yi and Huo Shilian present. First step: both sides compromise and disengage; second, talks; without disengaging, clashes are hard to avoid. Boundaries with Burma are settled, with Nepal settled and being marked, with Pakistan agreed in principle; if India agrees to talks, the sooner the better.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1963 ("同日"). Made public: 2013. See [[cal.1963-01-05.china-leadership]]. Names: Mao Zedong, Bandaranaike, Zhou Enlai, Chen Yi, Huo Shilian.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:bandaranaike-srimavo
      - name:zhou-enlai
      - name:chen-yi
      - polity:ceylon
