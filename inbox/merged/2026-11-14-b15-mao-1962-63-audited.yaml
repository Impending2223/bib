- add:
    entry:
      id: cal.1962-09-23.china-leadership-2
      when: Sept. 23
      date: '1962-09-23'
      thread: china-leadership
      c: 'Mao on Deng Xiaoping''s report of that day: the Secretariat now stands as Deng, Peng Zhen, Wang Jiaxiang, Li Xuefeng, Li Fuchun, Li Xiannian, Tan Zhenlin, Huang Kecheng, Tan Zheng, with Liu Lantao, Yang Shangkun and Hu Qiaomu alternates; Huang Kecheng removed, Tan Zheng suspended. Deng proposes that the plenum strike the two and elect Lu Dingyi, Kang Sheng and Luo Ruiqing. Mao: "Back to Xiaoping; do it."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 23, 1962 ("同日"). Made public: 2013. See [[cal.1962-09-23.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Lu Dingyi, Kang Sheng, Luo Ruiqing, Wang Jiaxiang, Li Xuefeng, Huang Kecheng, Tan Zheng, Liu Lantao, Yang Shangkun, Hu Qiaomu.'
