- add:
    entry:
      id: cal.1962-08-06.china-leadership
      when: Aug. 6
      date: '1962-08-06'
      thread: china-leadership
      c: 'Beidaihe. The Central Work Conference (Aug. 6–24), Mao presiding. Plenary, afternoon: Mao says a work conference first, a plenum after to adopt the papers; six groups, and a core group of the Standing Committee, the Secretariat and the regional first secretaries. He speaks on class, the situation and contradictions; the conference turns to the class struggle and to criticizing the "dark wind" and "go-it-alone wind." Deng Xiaoping lays out four topics: rural work, finance and trade, city work, and an exchange of cadres between center and provinces.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 6, 1962 (the entry for Aug. 6–24). Made public: 2013. See [[cal.1962-08-05.china-leadership]]. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1962-08-07.china-leadership
      when: Aug. 7
      date: '1962-08-07'
      thread: china-leadership
      also:
      - china
      c: Mao receives visitors from Mexico, Venezuela, Cuba, Paraguay and Brazil; Zhou Enlai, Chen Yi and Guo Moruo present. All on one front against imperialism and colonialism, for national liberation; China's defense, science and economy still far behind (the United States has the atomic and hydrogen bomb, China conventional arms); the Western talk that China will collapse not so.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 7, 1962. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Yi, Guo Moruo.'
