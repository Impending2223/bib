    entry:
      id: cal.1963-10-19.china-leadership
      when: Oct. 19
      date: '1963-10-19'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The fourth commentary, "Apologists of neo-colonialism," draft sent from the Central Committee''s General Office Oct. 17: Mao''s secretary telephones that the chairman has read it and has no changes. Printed Oct. 22.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 17, 1963 (Oct. 19). Made public: 2013. To check: the commentary, *Renmin ribao*, Oct. 22, 1963, and *Hongqi* 1963 no. 20. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-10-25.china-leadership
      when: Oct. 25
      date: '1963-10-25'
      thread: china-leadership
      c: 'Changsha. Mao drafts the Central Committee''s notice on printing and publicizing the rural socialist-education policies, and sends it to Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Xie Fuzhi, Luo Ruiqing, Chen Boda, Yang Shangkun and Tian Jiaying to discuss; and, with Wang Renzhong, takes up the revision of the document: educate the cadres. He talks also of his not being Party chairman and leader, of no life tenure.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 25, 1963 (the entries for Oct. 23 and 25). Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Xie Fuzhi, Luo Ruiqing, Chen Boda, Yang Shangkun, Tian Jiaying, Wang Renzhong.'
