      when: Dec. 5
      date: '1963-12-05'
      thread: china-leadership
      also:
      - china
      c: Juxiang Shuwu, evening. Mao calls Zhou Enlai and others to study the visit of Zhou and Chen Yi to African countries.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 5, 1963. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-yi
