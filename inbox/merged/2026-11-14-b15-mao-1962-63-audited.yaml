      when: July 30
      date: '1962-07-30'
      thread: china-leadership
      also:
      - laos
      - south-asia
      c: Beidaihe, Building 1, evening. Mao presides at the Standing Committee, which hears Chen Yi on the Geneva conference (on Laos) and his meeting with Krishna Menon.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 30, 1962. Made public: 2013. See [[cal.1962-07-22.china-leadership]]. Names: Mao Zedong, Chen Yi, Krishna Menon.'
