    entry:
      id: cal.1962-09-23.china-leadership
      when: Sept. 23
      date: '1962-09-23'
      thread: china-leadership
      also:
      - laos
      c: 'Yinian Tang. Mao receives Souphanouvong, chairman of the Neo Lao Hak Xat (Lao Patriotic Front); Chen Yi present. Praises the fight at Nam Tha and Muong Sing, which got the coalition formed. Laos must be ready both ways: keep the coalition going as long as possible, and be ready to fight, "spiritually and organizationally"; not to be ready is to lose.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 23, 1962. Made public: 2013. Names: Mao Zedong, Souphanouvong, Chen Yi.'
