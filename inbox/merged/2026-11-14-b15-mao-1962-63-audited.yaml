    entry:
      id: cal.1962-07-20.china-leadership-2
      when: July 20
      date: '1962-07-20'
      thread: china-leadership
      c: 'Mao sends to Liu Shaoqi, Zhou Enlai, Lin Biao, Deng Xiaoping and Peng Zhen the Central Committee''s instruction approving the Military Commission''s proposal on strategic policy (the revision begun May 18): operational plans for the whole army and the long-range plan for national defense are to be drawn up accordingly.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 18, 1962 (July 20). Made public: 2013. See [[cal.1962-05-18.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Lin Biao, Deng Xiaoping, Peng Zhen.'
