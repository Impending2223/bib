- add:
    entry:
      id: cal.1962-09-25.china-leadership
      when: Sept. 25
      date: '1962-09-25'
      thread: china-leadership
      c: 'Huairen Hall. Mao presides at the Tenth Plenum, second day. Li Xiannian reports on commerce; Dong Biwu, then Bo Yibo and Zhu De speak. Mao to Li on grain: last year better than the year before, besides the "Twelve Articles" and the "Sixty," because peasants gave up 17.7 billion jin less; "two ends many, the middle few": the peasant keeps more, and the center more yearly, hence imports.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 25, 1962. Made public: 2013. See [[cal.1962-09-24.china]]. Names: Mao Zedong, Li Xiannian, Dong Biwu, Bo Yibo, Zhu De.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:li-xiannian
      - name:dong-biwu
      - name:bo-yibo
      - name:zhu-de
      - vis:only:prc
- add:
    entry:
      id: cal.1962-09-27.china-leadership
      when: Sept. 27
      date: '1962-09-27'
      thread: china-leadership
      c: 'Huairen Hall. Mao presides at the Tenth Plenum''s last full session; Ke Qingshi, Liu Lantao, Peng Zhen and Li Fuchun speak. On Ke''s speech Mao: on centralization and decentralization the chief aspect should be centralization; democratic centralism within the Party, the people''s congresses and government; "we are a party where everyone may speak, even those against us." The plenum adopts the decision on the communes'' collective economy, the decision on commerce, the exchange of cadres, the control organs and the revised work regulations; Lu Dingyi, Kang Sheng and Luo Ruiqing added to the Secretariat, Huang Kecheng and Tan Zheng struck.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 27, 1962 (and the entry for Sept. 24–27). Made public: 2013. To check: the plenum''s communique, *Renmin ribao*, Sept. 29, 1962, and the decisions. See [[cal.1962-09-26.china]]. Names: Mao Zedong, Ke Qingshi, Peng Zhen, Li Fuchun, Lu Dingyi, Kang Sheng, Luo Ruiqing, Liu Lantao.'
      tags:
