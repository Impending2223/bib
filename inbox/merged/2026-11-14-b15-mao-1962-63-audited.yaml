- add:
    entry:
      id: cal.1963-01-06.china-leadership
      when: Jan. 6
      date: '1963-01-06'
      thread: china-leadership
      also:
      - japan
      c: Hangzhou. Mao receives a Japanese Communist Party delegation under Hakamada Satomi, member of its Politburo and Secretariat; Liao Chengzhi, Wu Xiuquan, Zhao Yimin and Jiang Hua present. Some parties "live on pressure," bribery and subversion, impose lines and bar other parties' own thinking; no revolution succeeds by a foreign-made line, small party or large. The core of Marxism is the theory of class struggle. On "structural reform" he speaks sharply.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 6, 1963. Made public: 2013. Names: Mao Zedong, Hakamada Satomi, Wu Xiuquan, Zhao Yimin, Liao Chengzhi, Jiang Hua.'
      tags:
      - polity:prc
      - polity:japan
      - name:mao-zedong
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1963-01-08.china-leadership
      when: Jan. 8
      date: '1963-01-08'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Evening, Hangzhou. Mao asks Zhou Enlai to draft for the Central Committee a notice on the 1963 plan (farms, markets, finance, staff cuts), for the regional first secretaries on Feb. 5. On Jan. 9 Zhou telephones Yang Shangkun for Liu Shaoqi, Deng Xiaoping and Peng Zhen Mao''s three points: the anti-revisionist articles not to appear until Khrushchev has spoken at the East German party''s congress, then to be answered together with his Supreme Soviet speech; more writers to join the Chinese delegation to that congress; a small meeting of the regional secretaries from Feb. 5, one with provincial secretaries from Feb. 10.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 8, 1963 (and Jan. 9). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Khrushchev, Yang Shangkun.'
      tags:
      - polity:prc
      - polity:gdr
      - polity:ussr
      - name:mao-zedong
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:peng-zhen
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1963-01-12.china-leadership
      when: Jan. 12
      date: '1963-01-12'
      thread: china-leadership
      also:
      - china
      c: 'Nanchang, afternoon. Mao receives the Venezuelan National Liberation Front''s delegation and a Brazilian expert, Carvalho, and his wife, soon to go home; Yang Shangkui present. Asks the Venezuelan politics and economy. Of building socialism: "no experience"; failures as well as successes, as in the revolution; imperialism will not train technicians for the colonies (France in Vietnam, Japan in Korea and Manchuria).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 12, 1963. Made public: 2013. Names: Mao Zedong, Yang Shangkui, Carvalho.'
      tags:
      - polity:prc
      - polity:venezuela
      - polity:brazil
      - name:mao-zedong
      - vis:only:prc+venezuela+brazil
- add:
    entry:
      id: cal.1963-01-21.china-leadership
      when: Jan. 21
      date: '1963-01-21'
      thread: china-leadership
      also:
      - china
      c: 'Wuchang. Mao receives the Indonesian Communist Party''s delegation under its second deputy chairman, Njoto (约多); Wang Renzhong present. Recounts China''s experience: work on the army''s top, the officers, not only the ranks; in farming countries the allies are in the villages; peasants first of all; the countries whose experience to study: Vietnam, Laos, Cuba, Algeria.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 21, 1963. Made public: 2013. Names: Mao Zedong, Njoto, Wang Renzhong.'
      tags:
      - polity:prc
      - polity:indonesia
      - name:mao-zedong
      - vis:only:prc+indonesia
