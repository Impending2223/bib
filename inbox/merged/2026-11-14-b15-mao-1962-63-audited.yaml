- add:
    entry:
      id: cal.1963-01-05.china-leadership-3
      when: Jan. 5
      date: '1963-01-05'
      thread: china-leadership
      also:
      - indonesia
      c: 'Hangzhou, evening. Mao receives Subandrio, Indonesia''s First Deputy Premier; Zhou Enlai and Chen Yi present. Asks about the regaining of West Irian; a nation must have its own politics, economy and culture. On a second Afro-Asian conference: best if India took part; if it does not now, it will later.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1963 ("同日"). Made public: 2013. See [[cal.1963-01-05.china-leadership-2]]. Names: Mao Zedong, Zhou Enlai, Chen Yi, Subandrio.'
      tags:
      - polity:prc
      - polity:indonesia
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-yi
      - name:subandrio
