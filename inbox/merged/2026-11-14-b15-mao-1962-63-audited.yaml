    entry:
      id: cal.1963-09-30.china-leadership
      when: Sept. 30
      date: '1963-09-30'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao revises Zhou Enlai''s speech for that evening''s National Day reception. To the passage on the differences in the socialist camp he adds: "we firmly believe that the present differences will one day be properly resolved on the basis of Marxism–Leninism"; and to all states, governments, parties, bodies and persons who want friendly ties "we pay our respects."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 30, 1963. To check: Zhou''s speech as printed, *Renmin ribao*, Oct. 1, 1963. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
