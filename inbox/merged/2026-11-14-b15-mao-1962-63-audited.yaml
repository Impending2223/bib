    entry:
      id: cal.1963-01-25.china-leadership
      when: Jan. 25
      date: '1963-01-25'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on the *People''s Daily* editorial draft "Unite on the basis of the Moscow Declaration and Moscow Statement": to Deng Xiaoping, read, well written, to be published. Printed Jan. 27.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 25, 1963. Made public: 2013. To check: the editorial, *Renmin ribao*, Jan. 27, 1963. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-05.china-leadership
      when: Feb. 5
      date: '1963-02-05'
      thread: china-leadership
      c: 'Yinian Tang, evening. Mao with the Standing Committee and the regional bureaus'' first secretaries: the work conference is to begin tomorrow with small meetings.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 5, 1963. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-06.china-leadership
      when: Feb. 6
      date: '1963-02-06'
      thread: china-leadership
      also:
      - soviet-union
      - cuba
      c: 'Mao revises Chen Boda''s Feb. 3 article on Togliatti, retitling it "More on the differences between Comrade Togliatti and us: some great questions of Leninism today," and asking that the introduction recall the Dec. 31 article and say why another. He also recommends to Chen a piece from *Neibu cankao* on Cuba''s view of the Soviet–Cuban differences: "Cuba''s view is right; worth reading." Cuba holds the main contradiction to be between imperialism and the colonial revolutions, not between socialism and capitalism; that conflict is chiefly in the lands now seeking liberation; against imperialism no yielding.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 6, 1963. Made public: 2013. To check: the Polish periodical''s article, as reported in *Neibu cankao*. Names: Mao Zedong, Chen Boda, Togliatti.'
      tags:
      - polity:prc
      - polity:cuba
      - name:mao-zedong
      - name:chen-boda
      - name:togliatti-palmiro
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-11.china-leadership
      when: Feb. 11
      date: '1963-02-11'
      thread: china-leadership
      c: The Central Work Conference opens in Peking (Feb. 11–28). It adopts directives on thrift and the "five-antis" campaign, on controlling fairs and speculation in the large and middle towns, a decision on cutting staff, rules on grain and procurement, a draft regulation for full-time schools and a directive on the schools, and the 1963 plan; it also takes up the struggle against modern revisionism. (Liu Shaoqi's small meeting of Feb. 6–9 had prepared it.)
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 11, 1963. Made public: 2013. See [[cal.1963-02-05.china-leadership]]. Names: Liu Shaoqi. Check: Mao''s presence is shown from Feb. 15 and 19.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-15.china-leadership
      when: Feb. 15
      date: '1963-02-15'
      thread: china-leadership
      also:
      - china
      c: 'Qinzheng Hall, afternoon. Mao gives a banquet for Prince Norodom Sihanouk, Cambodia''s chief of state; Liu Shaoqi, Peng Zhen and He Long present. Glad that Cambodia has found its footing in Southeast Asia and grows in economy, politics and culture; kingdoms (Nepal, Afghanistan) are friendly with China and some presidencies are not: the matter is substance, not form. He warns Sihanouk to guard against subversion and assassination.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 15, 1963. Made public: 2013. Names: Mao Zedong, Norodom Sihanouk, Liu Shaoqi, Peng Zhen, He Long.'
      tags:
      - polity:prc
      - polity:cambodia
      - name:mao-zedong
      - name:norodom-sihanouk
      - name:liu-shaoqi
      - name:peng-zhen
      - name:he-long
      - vis:only:prc+cambodia
- add:
    entry:
      id: cal.1963-02-15.china-leadership-2
      when: Feb. 15
      date: '1963-02-15'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao revises the introduction of the article on Togliatti (Feb. 15), and on Feb. 16 the introduction and part two, retitling part two "What is the nature of this great debate among the Communists of all countries?"; on Feb. 18 part eight. Added: differences among communists to be settled "by facts and reason," never as a slaveholder treats slaves; unity only on the Moscow Declaration and Statement, on equal consultation and give and take. And of the Soviet party''s refusal to print the Chinese replies: "you are afraid of ghosts"; "a specter, dogmatism, which is truly Marxism–Leninism, haunts the world and threatens you."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 15, 1963 (the entries for Feb. 15, 16 and 18). Made public: 2013. To check: the article as published (the nianpu''s note puts its drafting meetings at Feb. 18–25). See [[cal.1963-02-06.china-leadership]]. Names: Mao Zedong, Togliatti.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:togliatti-palmiro
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-17.china-leadership
      when: Feb. 17
      date: '1963-02-17'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Central Committee''s notice on publishing Khrushchev''s speeches and anti-revisionist articles: the *People''s Daily* to print in full his Dec. 12, 1962 report to the Supreme Soviet and his Jan. 16, 1963 greeting to the East German party''s congress, *Pravda*''s editorials of Jan. 7 and Feb. 10, and some French and Italian communists'' attacks on China, with the sharpest errors set in bold type. Mao: "Yang Shangkun, do it at once."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 17, 1963. Made public: 2013. Names: Mao Zedong, Khrushchev, Yang Shangkun.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-19.china-leadership
      when: Feb. 19
      date: '1963-02-19'
      thread: china-leadership
      also:
      - south-asia
      c: 'The Great Hall, afternoon. Mao presides at the Work Conference''s plenary, which hears Zhang Guohua on the counterattack in self-defense on the eastern sector of the Sino-Indian border: troops sent in ten days, some fought on arrival; the Indian battalion and higher commanders played little part. Mao: "Be ready to fight; do not think the world is at peace."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 19, 1963. Made public: 2013. Names: Mao Zedong, Zhang Guohua.'
      tags:
      - polity:prc
      - polity:india
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-21.china-leadership
      when: Feb. 21
      date: '1963-02-21'
      thread: china-leadership
      also:
      - cuba
      c: 'Yinian Tang, afternoon. Mao receives Cuba''s government economic delegation; Liu Shaoqi and Ye Jizhuang present. The Cuban people good friends, the Party good, good leaders. Of trade: more in a few years; both poor, with little industry and unworked minerals. China''s anti-imperialist experience is for reference; Cuba is small and near America and yet won, so the world watches.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 21, 1963. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Ye Jizhuang.'
      tags:
      - polity:prc
      - polity:cuba
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc+cuba
- add:
    entry:
      id: cal.1963-02-23.china-leadership
      when: Feb. 23
      date: '1963-02-23'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Juxiang Shuwu, evening. Mao presides at the Standing Committee, on the letter of Feb. 21 from the Soviet Central Committee, brought by Ambassador Chervonenko on Feb. 22: end the public polemics, call an international conference, and first hold bilateral talks to prepare it. Mao: "no time to lose; I will see Chervonenko at once."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 23, 1963. Made public: 2013. To check: the CPSU letter of Feb. 21, 1963. Names: Mao Zedong, Chervonenko.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:chervonenko-stepan-v
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-23.china-leadership-2
      when: Feb. 23
      date: '1963-02-23'
      thread: china-leadership
      also:
      - soviet-union
      c: After the meeting Mao receives Chervonenko, with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng and Wu Xiuquan. Welcomes the letter, a consulting, equal tone; what he dislikes is Khrushchev's call at the East German congress to stop the polemics while himself polemicizing; 43 parties attack China in public; China will reply to the French, then the Italian and American communists, and then stop. Proposes talks, Khrushchev to stop in Peking on his way to or from Cambodia, or a Chinese delegation to Moscow; the 1957 manner (the two parties first agree, then submit to the conference) better than 1960's. "The sky will not fall." He does not now plan to go to Moscow.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 23, 1963 ("同日"). Made public: 2013. To check: the CPSU letter of Feb. 21, 1963; the Soviet record of the talk. See [[cal.1963-02-23.china-leadership]]. Names: Mao Zedong, Chervonenko, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng, Khrushchev, Wu Xiuquan.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:chervonenko-stepan-v
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:kang-sheng
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1963-02-25.china-leadership
      when: Feb. 25
      date: '1963-02-25'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Great Hall, afternoon. Mao at the Work Conference''s plenary, to which Liu Shaoqi reports on the struggle against modern revisionism: its course, the nature of the dispute, the outlook, and China''s line. To Liu''s "the fight touches the fate of revolutions and of mankind," Mao: "and of our country." To "unite and struggle; struggle to unite": Khrushchev does the same, and after a round writes asking for a meeting. And: "some concessions will still be made, as at the Moscow Declaration and Statement."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 25, 1963. Made public: 2013. To check: Liu''s report, "On the struggle against modern revisionism," and Mao''s mid-March notes on Stalin in it. See [[cal.1963-02-23.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Khrushchev.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-28.china-leadership
      when: Feb. 28
      date: '1963-02-28'
      thread: china-leadership
      c: 'The Great Hall, afternoon. Mao presides at the Work Conference''s closing, speaks after Deng Xiaoping lists the papers to be adopted. The meeting ran in parallel: Deng, Chen Boda, Kang Sheng and others on the international questions, Mao drawn in; Liu Shaoqi on both. On home affairs: take hold of socialist education, of cadres and of the masses; protect 90 percent of the cadres, "a warm-water bath, not cold, not boiling," and then bind them to the activists among poor and lower-middle peasants.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 28, 1963. Made public: 2013. See [[cal.1963-02-25.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Chen Boda, Kang Sheng, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:chen-boda
      - name:kang-sheng
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1963-03-01.china-leadership
      when: Mar. 1
      date: '1963-03-01'
      thread: china-leadership
      c: 'The Central Committee''s directive on thrift and production, and against graft and theft, speculation, waste, "dispersionism" and bureaucracy (the "five-antis"): a large-scale socialist revolutionary struggle against the capitalist forces'' offensive; for now only in Party, government, army and mass bodies, state and co-operative enterprises, supply and culture and education organs at county (regiment) level and above; the schools under the county excepted; production and thrift at the center.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 1, 1963. Made public: 2013. See [[cal.1963-02-28.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1963-03-03.china-leadership
      when: Mar. 3
      date: '1963-03-03'
      thread: china-leadership
      also:
      - south-asia
      c: 'Juxiang Shuwu, afternoon. Mao receives the Pakistani government delegation under Foreign Minister Zulfikar Ali Bhutto; Zhou Enlai and Geng Biao present. Relations to grow in politics, economy and culture. When Bhutto says Britain was displeased at Pakistan''s border agreement with China and America opposes it from many sides: nations, large or small, are to be independent and equal; act on the people''s will. China to hold a 20- to 25-year plan of water works, reservoirs above all; two-thirds of the land still rain-fed.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 3, 1963. Made public: 2013. Names: Mao Zedong, Zulfikar Ali Bhutto, Zhou Enlai, Geng Biao.'
      tags:
      - polity:prc
      - polity:pakistan
      - name:mao-zedong
      - name:bhutto-zulfikar-ali
      - name:zhou-enlai
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1963-03-05.china-leadership
      when: Mar. 5
      date: '1963-03-05'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on Kang Sheng''s draft *People''s Daily* editorial "Comment on the statement of the American Communist Party": "consider whether to add a note against dogmatism." Printed Mar. 8.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 5, 1963. Made public: 2013. To check: the editorial, *Renmin ribao*, Mar. 8, 1963, and the American Party''s statement it answers. Names: Mao Zedong, Kang Sheng.'
      tags:
      - polity:prc
      - polity:us
      - name:mao-zedong
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1963-03-05.china-leadership-2
      when: Mar. 5
      date: '1963-03-05'
      thread: china-leadership
      c: The People's Daily prints Mao's inscription "Learn from Comrade Lei Feng," written Feb. 20 for *Zhongguo qingnian*'s Lei Feng number (out Mar. 2) and sent out by Xinhua Mar. 4.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 5, 1963. To check: *Renmin ribao*, Mar. 5, 1963; *Zhongguo qingnian*, 1963, nos. 5–6. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1963-03-06.china-leadership
      when: Mar. 6
      date: '1963-03-06'
      thread: china-leadership
      also:
      - china
      c: Yinian Tang, afternoon. Mao receives the Communist Party of Brazil (the new party) delegation under its general secretary Amazonas; Deng Xiaoping and Wu Xiuquan present. A Marxist-Leninist party, resolved on revolution, as many "communist" parties are not. Revolution goes back and forth, not straight; Cuba's came after many reverses; create your own experience and never copy abroad; "we paid dearly for copying."
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 6, 1963. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, João Amazonas, Wu Xiuquan.'
      tags:
      - polity:prc
      - polity:brazil
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc+brazil
- add:
    entry:
      id: cal.1963-03-07.china-leadership
      when: Mar. 7
      date: '1963-03-07'
      thread: china-leadership
      also:
      - soviet-union
      c: Juxiang Shuwu, afternoon. Mao presides at the Standing Committee on the draft reply to the Soviet Central Committee's letter of Feb. 21; he approves it.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 7, 1963. Made public: 2013. See [[cal.1963-02-23.china-leadership-2]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-03-07.china-leadership-2
      when: Mar. 7
      date: '1963-03-07'
      thread: china-leadership
      also:
      - laos
      - china
      c: 'Qinzheng Hall, evening. Mao gives a banquet for King Savang Vatthana of Laos; Liu Shaoqi, Zhu De, Zhou Enlai, Dong Biwu, Peng Zhen, Chen Yi present. The three Indochina states are near neighbors; China respects them; their business their own; foreign interference in them very bad. On China''s seat in the United Nations: Chiang Kai-shek holds it, and Peking cannot enter, "a great matter"; Britain recognizes Peking yet backs Chiang there, and so has a chargé in Peking, no ambassador.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 7, 1963. Made public: 2013. See [[cal.1963-03-07.china-leadership]]. Names: Mao Zedong, Savang Vatthana, Liu Shaoqi, Zhu De, Zhou Enlai, Dong Biwu, Peng Zhen, Chen Yi.'
      tags:
      - polity:prc
      - polity:laos
      - name:mao-zedong
      - name:savang-vatthana
      - name:liu-shaoqi
      - name:zhu-de
      - name:zhou-enlai
      - name:dong-biwu
      - name:peng-zhen
      - name:chen-yi
      - vis:only:prc+laos
- add:
    entry:
      id: cal.1963-03-10.china-leadership
      when: Mar. 10
      date: '1963-03-10'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao with Liu Shaoqi, Zhou Enlai and Deng Xiaoping at Juxiang Shuwu, afternoon: a short item to appear in the papers that Deng received the Soviet ambassador, letters were exchanged, and Sino-Soviet talks are held necessary. Printed Mar. 11 in the *People''s Daily*.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 10, 1963. Made public: 2013. To check: the *Renmin ribao* item of Mar. 11, 1963. See [[cal.1963-03-09.china]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-03-13.china-leadership
      when: Mar. 13
      date: '1963-03-13'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Evening. Mao hears Yang Shangkun on his talk with Yelizavetin, the Soviet chargé: Moscow is willing to publish the letters but calls ours an "ultimatum" and says it "causes disquiet." Mao at once calls the Standing Committee: the exchange of letters to be published tomorrow. Printed Mar. 14 as "The letters exchanged between the Chinese and Soviet parties for bilateral talks."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 13, 1963. Made public: 2013. To check: the *Renmin ribao* of Mar. 14, 1963. See [[cal.1963-03-13.soviet-union-leadership]]. Names: Mao Zedong, Yang Shangkun. Check: Yelizavetin''s initials (叶利沙维金 in the nianpu).'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-03-15.china-leadership
      when: Mar. 15
      date: '1963-03-15'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mid-March. Mao annotates Liu Shaoqi''s speech to the February conference as edited. On Stalin''s "enlarged" purges: "relying on the Public Security Ministry alone, not the Party and the masses." On his breach of democratic centralism in Party, state and mass bodies: "within the Party they were not equal; leaders at every level had privileges." After "improperly interfering in some fraternal parties and states," he adds: "drew up their programs, their concrete policies, even their personnel."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 15, 1963 ("3月中旬"). Made public: 2013. See [[cal.1963-02-25.china-leadership]]. Names: Mao Zedong, Liu Shaoqi. Check: The date: "mid-March" in the nianpu.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1963-03-18.china-leadership
      when: Mar. 18
      date: '1963-03-18'
      thread: china-leadership
      also:
      - china
      c: Yinian Tang, afternoon. Mao receives Jacques Vergès, director of the weekly *Révolution africaine*, and Djamila Bouhired, Algerian heroine; Liu Changsheng and Wu Lengxi present. Praises Algeria as a model of victory over imperialism; Africans should see Algeria, Latin Americans Cuba; China's experience has the fault of having taken so long; whoever loses the masses fails.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 18, 1963. Made public: 2013. Names: Mao Zedong, Jacques Vergès, Djamila Bouhired, Liu Changsheng, Wu Lengxi.'
      tags:
      - polity:prc
      - polity:algeria
      - name:mao-zedong
      - vis:only:prc+algeria
- add:
    entry:
      id: cal.1963-03-20.china-leadership
      when: Mar. 20
      date: '1963-03-20'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao reads and settles, on Yang Shangkun's submission, the letter the Secretariat approved in answer to the Soviet Central Committee's oral notice. That evening Yang gives it to the Soviet embassy's chargé.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 20, 1963 ("同日"). Made public: 2013. See [[cal.1963-03-13.china-leadership]]. Names: Mao Zedong, Yang Shangkun. Check: The oral notice''s subject (the nianpu gives none).'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1963-04-02.china-leadership
      when: Apr. 2
      date: '1963-04-02'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai and Deng Xiaoping, for Mao, receive from Chervonenko the Soviet Central Committee's letter of Mar. 30. (On Apr. 1 the ambassador, just back, had asked to give it and explain it to Mao in person; Mao named Zhou and Deng.) The Soviet side prints it Apr. 3.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 1, 1963 (Apr. 2 and 3). Made public: 2013. To check: the CPSU letter of Mar. 30, 1963. See [[cal.1963-03-20.china-leadership]]. Names: Zhou Enlai, Deng Xiaoping, Chervonenko.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1963-04-03.china-leadership
      when: Apr. 3
      date: '1963-04-03'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Juxiang Shuwu. Mao presides at the Standing Committee on the Soviet letter of Mar. 30: too long, not finished; after Zhou Enlai and Deng Xiaoping speak, concludes that Khrushchev''s group means its line to be the basis of the party talks; the letter to be printed in the *People''s Daily*; a counter-proposal to be made, answering the letter and stating the Chinese views directly, not arguing against it. Deng to prepare it. Printed Apr. 4.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 3, 1963. Made public: 2013. See [[cal.1963-04-02.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Khrushchev.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1963-04-17.china-leadership
      when: Apr. 17
      date: '1963-04-17'
      thread: china-leadership
      also:
      - soviet-union
      c: Hangzhou. Mao asks Lin Ke to bring Deng Xiaoping, Kang Sheng, Lu Dingyi and Chen Boda to Hangzhou Apr. 21–22 to discuss the reply to the Soviet letter. On Apr. 19 he receives its second draft; Deng and the three arrive Apr. 21.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 17, 1963. Made public: 2013. See [[cal.1963-04-03.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Kang Sheng, Lu Dingyi, Chen Boda, Lin Ke.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:deng-xiaoping
      - name:kang-sheng
      - name:lu-dingyi
      - name:chen-boda
      - vis:only:prc
- add:
    entry:
      id: cal.1963-04-24.china-leadership
      when: Apr. 24
      date: '1963-04-24'
      thread: china-leadership
      also:
      - china
      c: Shanghai Cultural Club, afternoon. Mao receives Ali Sabri, Chairman of the Executive Council of the United Arab Republic; Zhou Enlai, Ke Qingshi and Zhang Hanfu present. Praises Egypt's regaining of the Suez Canal in 1956, when two imperialist states dared not press further; asks about the Aswan High Dam; both lands have thrown out imperialism and many Asian and African states are independent.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 24, 1963. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Ke Qingshi, Ali Sabri, Zhang Hanfu.'
      tags:
      - polity:prc
      - polity:uar
      - name:mao-zedong
      - name:zhou-enlai
      - name:ke-qingshi
      - name:sabri-ali
      - vis:only:prc+uar
- add:
    entry:
      id: cal.1963-04-25.china-leadership
      when: Apr. 25
      date: '1963-04-25'
      thread: china-leadership
      also:
      - soviet-union
      c: Shanghai, morning. Mao with Zhou Enlai, Deng Xiaoping and others on the reply to the Soviet letter; also points to reports from Song Renqiong in the Northeast, Henan, the Baoding and Xingtai prefectures on the "four clean-ups" and organizing poor and lower-middle peasants as worth attention.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 25, 1963. Made public: 2013. See [[cal.1963-04-17.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Song Renqiong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-04-25.china-leadership-2
      when: Apr. 25
      date: '1963-04-25'
      thread: china-leadership
      also:
      - cuba
      c: 'Shanghai Cultural Club, evening. Mao receives José Matar (何塞·马塔), chairman of the national committee of Cuba''s Committees for the Defense of the Revolution; Chen Pixian and Cao Diqiu present. Cuba has its own experience, which he urges foreign friends to study; China''s is for reference only; South Vietnam''s worth study, its people behind it. Matar: Castro calls the people Cuba''s strongest weapon. Mao: one that cannot be pulled down or beaten.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 25, 1963 ("同日"). Made public: 2013. See [[cal.1963-04-25.china-leadership]]. Names: Mao Zedong, José Matar, Chen Pixian, Cao Diqiu, Castro.'
      tags:
      - polity:prc
      - polity:cuba
      - name:mao-zedong
      - name:castro-fidel
      - vis:only:prc+cuba
- add:
    entry:
      id: cal.1963-05-03.china-leadership
      when: May 3
      date: '1963-05-03'
      thread: china-leadership
      also:
      - china
      c: Shanghai Cultural Club, afternoon. Mao receives the Guinean government's economic delegation and women's delegation; Ke Qingshi and Ye Jizhuang present. All Africans welcome; if any of ours act badly, look down, or show great-power chauvinism, tell us and we shall punish them; both lands alike, so we talk easily; some think China fated to be oppressed for ten thousand years.
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 3, 1963. Made public: 2013. Names: Mao Zedong, Ke Qingshi, Ye Jizhuang.'
      tags:
      - polity:prc
      - polity:guinea
      - name:mao-zedong
      - name:ke-qingshi
      - vis:only:prc+guinea
- add:
    entry:
      id: cal.1963-05-07.china-leadership
      when: May 7
      date: '1963-05-07'
      thread: china-leadership
      c: Hangzhou. Mao convenes the regional bureaus' first secretaries and Peng Zhen, Chen Boda, Jiang Hua and Hu Yaobang (Zhou Enlai and Deng Xiaoping for part), May 7–11, on the draft decision "some current problems in rural work." Shorter and graver; socialist education means class, class struggle, the "four clean-ups," reliance on poor and lower-middle peasants, cadres in labor; the method "a warm-water bath"; to treat 90 percent of the people as friends; not "five-antis" in the villages, only "four." He toasts "the victory of the four clean-ups and five-antis, to dig out the root of revisionism." Where cadres do not labor, the branch secretary is a "bao-jia headman."
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 7, 1963 (the entry for May 7–11). Made public: 2013. To check: the draft of May 1963 and the 1963 Central Committee decision issued May 20 (the "First Ten Points"). Names: Mao Zedong, Peng Zhen, Chen Boda, Zhou Enlai, Deng Xiaoping, Jiang Hua, Hu Yaobang.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-zhen
      - name:chen-boda
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-05-10.china-leadership
      when: May 10
      date: '1963-05-10'
      thread: china-leadership
      c: 'Hangzhou, evening. Mao hears Zhou Enlai on the loss of the *Yuejin* (跃进号; May 1: China''s first home-built ocean freighter, of over 15,000 tons, on her maiden voyage from Qingdao to Japan, struck a reef and sank) and on Zhou''s talk with the regional first secretaries, and talks with him on changes to the rural decision. (On May 9 Zhou had offered to fly to Hangzhou for any further report on the *Yuejin*.)'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 10, 1963 (and May 9, n. 33). Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-05-18.china-leadership
      when: May 18
      date: '1963-05-18'
      thread: china-leadership
      c: Huairen Hall. The Politburo, 36 attending, Zhou Enlai presenting how the draft decision on rural work came about and what Mao said at Hangzhou, adopts the draft decision; issued May 20 with six annexes.
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 18, 1963. Made public: 2013. See [[cal.1963-05-07.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-05-22.china-leadership
      when: May 22
      date: '1963-05-22'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Hangzhou. Mao receives V. G. Wilcox (威尔科克斯), general secretary of the New Zealand Communist Party, come from the capitalist world, to ask his view of the Chinese Central Committee''s draft reply to the Soviet letter of Mar. 30; Deng Xiaoping and Kang Sheng present. Wilcox: an excellent paper, hard to answer. Mao: not to ask other parties'' friends would leave us unsure; more from the capitalist world should read it: it should please the Left, reach most of the Center and win them.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 22, 1963 (and n. 37). Made public: 2013. See [[cal.1963-04-25.china-leadership]]. Names: Mao Zedong, V. G. Wilcox, Deng Xiaoping, Kang Sheng.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:kang-sheng
      - polity:nz
      - vis:only:prc+nz
- add:
    entry:
      id: cal.1963-05-29.china-leadership
      when: May 29
      date: '1963-05-29'
      thread: china-leadership
      also:
      - soviet-union
      c: Wuchang, East Lake. Mao receives Kim Il Sung to ask his view of the reply to the Soviet Central Committee; Liu Shaoqi, Deng Xiaoping, Kang Sheng and Wang Renzhong present. The Politburo has not yet taken the draft, but it has been talked over in Peking and at Hangzhou, where Mao was; he asks whether to change it little or much, or write it again; "mainly we fear to err." It touches all parties and the working class of the world.
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 29, 1963. Made public: 2013. See [[cal.1963-05-22.china-leadership]]. Names: Mao Zedong, Kim Il Sung, Liu Shaoqi, Deng Xiaoping, Kang Sheng, Wang Renzhong.'
      tags:
      - polity:prc
      - polity:dprk
      - name:mao-zedong
      - name:kim-il-sung
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:kang-sheng
      - vis:only:prc+dprk
- add:
    entry:
      id: cal.1963-06-03.china-leadership
      when: June 3
      date: '1963-06-03'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Wuchang. Mao, with Wang Renzhong and others, again on revising the draft reply. Khrushchev has three fears: of imperialism, of the masses, of "dogmatism." The Eighth Congress named the main contradiction wrongly: the clothes the mother made the son at thirty are too big at twenty-five. Where the "three red flags" came from: one flag was not enough.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 3, 1963. Made public: 2013. See [[cal.1963-05-29.china-leadership]]. Names: Mao Zedong, Khrushchev, Wang Renzhong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1963-06-04.china-leadership
      when: June 4
      date: '1963-06-04'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'Wuchang. Mao receives the Vietnam Workers'' Party delegation under Lê Duẩn, to ask its view of the reply to the Soviet letter; Deng Xiaoping, Kang Sheng and Wang Renzhong present. On the rural socialist education movement: no experience of socialism, the cadres none; it will take two or three years; cadres should work and labor both, to keep revisionism out.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 4, 1963. Made public: 2013. See [[cal.1963-05-29.china-leadership]]. Names: Mao Zedong, Lê Duẩn, Deng Xiaoping, Kang Sheng, Wang Renzhong.'
      tags:
      - polity:prc
      - polity:drv
      - name:mao-zedong
      - name:le-duan
      - name:deng-xiaoping
      - name:kang-sheng
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1963-06-12.china-leadership
      when: June 12
      date: '1963-06-12'
      thread: china-leadership
      also:
      - soviet-union
      c: Huairen Hall, afternoon. The Politburo, Liu Shaoqi presiding, adopts the Central Committee's reply to the Soviet letter of Mar. 30 (the "proposal on the general line of the international communist movement"), and the list of the Chinese delegation to the July talks. Mao revised it many times; in the draft of May 19 he added a long passage that a proletarian party must think for itself, investigate, know the true course of its country's classes, and apply Marxism–Leninism to its own conditions.
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 12, 1963. Made public: 2013. To check: the letter (dated June 14, as the nianpu later calls it) and its publication in the *Renmin ribao*. See [[cal.1963-06-04.china-leadership]]. Names: Liu Shaoqi, Mao Zedong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:liu-shaoqi
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-06-16.china-leadership
      when: June 16
      date: '1963-06-16'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Qinzheng Hall. Mao receives Choe Yong Gon, vice-chairman of Korea''s Workers'' Party and Chairman of the Standing Committee of its Supreme People''s Assembly; Liu Shaoqi, Zhou Enlai, Zhu De, Dong Biwu and Peng Zhen present. Kim Il Sung''s suggestions on the document were good; the two parties are now without distance and support each other. Of the war to resist America: Korea supported China first, being the front, with the greatest losses and China the rear; China second.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 16, 1963 (and n. 40). Made public: 2013. See [[cal.1963-05-29.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Dong Biwu, Peng Zhen, Kim Il Sung, Choe Yong Gon.'
      tags:
      - polity:prc
      - polity:dprk
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:zhu-de
      - name:dong-biwu
      - name:peng-zhen
      - name:kim-il-sung
      - vis:only:prc+dprk
- add:
    entry:
      id: cal.1963-06-19.china-leadership
      when: June 19
      date: '1963-06-19'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Evening. Mao with Yang Shangkun, deciding to publish at once the Soviet Central Committee''s statement of June 18: it holds the printing of the Chinese reply in the Soviet press "not fitting," its authors reading the Moscow Declaration and Statement as they wish and attacking the CPSU and others "without ground."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 19, 1963. Made public: 2013. To check: the Soviet statement of June 18, 1963, as printed in *Renmin ribao*. See [[cal.1963-06-12.china-leadership]]. Names: Mao Zedong, Yang Shangkun.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-06-28.china-leadership
      when: June 28
      date: '1963-06-28'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping and Peng Zhen meet each afternoon, June 28–30, on the line for the delegation''s talks in Moscow. It is judged that there are two ways out: drag on, each speaking, or a break. Mao: "first, break; second, drag; carry it to the brink": China not to break first but to be ready for a break, and not to fear it.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 28, 1963 (the entry for June 28–30). Made public: 2013. See [[cal.1963-06-12.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-03.china-leadership
      when: July 3
      date: '1963-07-03'
      thread: china-leadership
      c: 'Yinian Tang, evening. Mao hears Liu Shaoqi, Zhou Enlai and Deng Xiaoping on the Politburo''s session of July 1 on the report on the last two years of the Second Five-Year Plan and the 1961–62 final accounts. Mao: no Third Five-Year Plan yet; three more years of adjustment from 1963 to 1965, as a transition; then a five or ten year plan.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 3, 1963. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-04.china-leadership
      when: July 4
      date: '1963-07-04'
      thread: china-leadership
      also:
      - soviet-union
      c: Yinian Tang, afternoon. A meeting, Mao with Liu Shaoqi, Zhou Enlai, Deng Xiaoping and Peng Zhen, on the draft Chinese statement answering the Soviet Central Committee's statement of that day, which named a delegation under Suslov of seven to the talks opening in Moscow July 5, to "firmly carry out the line of the Twentieth, Twenty-first and Twenty-second Congresses." Mao approves the statement at 9 p.m.; printed July 5.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 4, 1963. Made public: 2013. To check: the two statements of July 4, 1963 and *Renmin ribao*, July 5, 1963. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Suslov.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:peng-zhen
      - name:suslov-mikhail-a
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-07.china-leadership
      when: July 7
      date: '1963-07-07'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Yinian Tang, noon. Mao with Liu Shaoqi, Zhou Enlai and others on the delegation''s line for its speeches at the Moscow talks; at 2 p.m. the Central Committee telegraphs its approval. On July 8 Deng Xiaoping makes the first speech: where the differences come from and what they are.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 7, 1963. Made public: 2013. To check: the delegation''s speeches and the Soviet record of the talks. See [[cal.1963-07-04.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-10.china-leadership
      when: July 10
      date: '1963-07-10'
      thread: china-leadership
      also:
      - soviet-union
      c: The Central Committee's statement answering the Soviet Central Committee's of July 9 in *Pravda*, which attacked Peking for its mass welcome home of the five Chinese, embassy staff and students, whose recall Moscow had demanded for handing out the Chinese letter of June 14.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 9, 1963 (July 10; and n. 45). To check: the two statements, July 9 and 10, 1963. See [[cal.1963-07-07.china-leadership]].'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
- add:
    entry:
      id: cal.1963-07-11.china-leadership
      when: July 11
      date: '1963-07-11'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Yinian Tang, 11 a.m. A meeting, Liu Shaoqi, Zhou Enlai and others, on Suslov''s second speech (July 10) at the Moscow talks. At 3 p.m. the Central Committee telegraphs the delegation: answer Suslov in good time. On July 12 Deng Xiaoping makes the second speech, on Soviet splitting.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 11, 1963. Made public: 2013. See [[cal.1963-07-07.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Suslov, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:suslov-mikhail-a
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-12.china-leadership
      when: July 12
      date: '1963-07-12'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao revises the *People's Daily* editorial "We want unity, not split," retitled by him from "Hold to principle, remove differences, strengthen unity, face the enemy together." It appeals to the Soviet comrades to take the large view of Sino-Soviet unity, not to act rashly. Printed July 13.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 12, 1963. Made public: 2013. To check: the editorial, *Renmin ribao*, July 13, 1963. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-12.china-leadership-2
      when: July 12
      date: '1963-07-12'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Juxiang Shuwu, evening. A meeting, Liu Shaoqi, Zhou Enlai and others, on the delegation''s request for guidance on how to end the Moscow talks. The Central Committee answers the same day: if in the third round the other side does not propose an interruption, we should not propose a recess; speak in turn some more times, to learn the other side''s direction and resolve.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 12, 1963 ("同日"). Made public: 2013. See [[cal.1963-07-11.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-14.china-leadership
      when: July 14
      date: '1963-07-14'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The day the Soviet Central Committee publishes, in the midst of the talks, its "Open letter" to the Soviet party''s organizations and members, a general attack on the Chinese party: Juxiang Shuwu, noon, Mao, Liu Shaoqi, Zhou Enlai and others on the delegation''s points for its speech of Monday, July 15. 1 p.m.: Mao drafts the reply to Deng Xiaoping, Peng Zhen and Kang Sheng, the line for Monday''s speech "wholly" agreed.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 14, 1963. Made public: 2013. To check: the open letter, *Pravda*, July 14, 1963. See [[cal.1963-07-12.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Kang Sheng.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:peng-zhen
      - vis:only:prc
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:kang-sheng
- add:
    entry:
      id: cal.1963-07-15.china-leadership
      when: July 15
      date: '1963-07-15'
      thread: china-leadership
      also:
      - soviet-union
      c: Yinian Tang, afternoon. A meeting, Liu Shaoqi, Zhou Enlai and others, on the delegation's request on how the talks go on after the Soviet open letter. The Central Committee's instruction, read by Mao, goes out at dawn July 16. Peng Zhen, July 15, had reserved the right to comment on the open letter, the Soviets having issued it during the talks.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 15, 1963. Made public: 2013. See [[cal.1963-07-14.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Peng Zhen.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-18.china-leadership
      when: July 18
      date: '1963-07-18'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Juxiang Shuwu, afternoon. A meeting, Liu Shaoqi, Zhou Enlai and others, on the delegation''s telegrams on how to close the talks and on the content of its speech of July 19. Zhou drafts the reply, Mao reads it, and it goes out that evening: agrees the delegation should return soon; whether we propose the recess after the fourth or the fifth speech, let it judge.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 18, 1963. Made public: 2013. See [[cal.1963-07-15.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-19.china-leadership
      when: July 19
      date: '1963-07-19'
      thread: china-leadership
      also:
      - soviet-union
      c: Moscow. The Chinese delegation's fourth speech, by Kang Sheng, charges the Soviet party with breaking the agreement by publishing the open letter during the talks, and takes up the dictatorship of the proletariat and Stalin. Deng Xiaoping, the delegation's head, proposes a recess; on July 20 Suslov, the Soviet head, agrees.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 19, 1963. Made public: 2013. To check: the delegation''s speeches and the Soviet record of the talks. See [[cal.1963-07-18.china-leadership]]. Names: Mao Zedong, Kang Sheng, Deng Xiaoping, Suslov.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:kang-sheng
      - name:deng-xiaoping
      - name:suslov-mikhail-a
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1963-07-19.china-leadership-2
      when: July 19
      date: '1963-07-19'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. Mao reads the *People''s Daily*''s editor''s note on the Soviet open letter and adds at its end: "we shall later supply materials to clear this up." In the afternoon a meeting at the Yinian Tang; the telegram to the delegation that evening: if the Soviets go on speaking after Kang Sheng, go on; the delegation may fly home in two planes.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 19, 1963 ("同日"). Made public: 2013. See [[cal.1963-07-19.china-leadership]]. Names: Mao Zedong, Kang Sheng.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-20.china-leadership
      when: July 20
      date: '1963-07-20'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The spokesman of the Chinese Central Committee''s statement, revised by Mao July 18–19 on the draft of July 18: the Soviet open letter is an evaluation of the Chinese letter of June 14, is not in accord with fact, and not agreed to; the Central Committee will clear it up in due course, and decides to print the Soviet letter once more in the *People''s Daily*. Published July 20.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 18 or 19, 1963. To check: the statement, *Renmin ribao*, July 20, 1963. See [[cal.1963-07-19.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
- add:
    entry:
      id: cal.1963-07-21.china-leadership
      when: July 21
      date: '1963-07-21'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking, afternoon. Deng Xiaoping and Peng Zhen, with the delegation, return from Moscow; Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Dong Biwu and others meet them at the airport, with ministers, the NPC and CPPCC standing committees, the army and the satellite parties' ambassadors. Mao then calls a meeting at the Yinian Tang and hears the delegation report on the talks.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 21, 1963. Made public: 2013. To check: the delegation''s report. See [[cal.1963-07-20.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Liu Shaoqi, Zhou Enlai, Zhu De, Dong Biwu.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:deng-xiaoping
      - name:peng-zhen
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:zhu-de
      - name:dong-biwu
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-22.china-leadership
      when: July 22
      date: '1963-07-22'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Yinian Tang, evening. Mao receives E. F. Hill (希尔), lately of the Australian Communist Party''s Politburo and Secretariat, removed over his differences with its majority, and his wife; Deng Xiaoping and Peng Zhen present. Of the Moscow talks: the Soviet side had no reasons, worse than Bernstein, Kautsky or Plekhanov, who at least had logic and a gentleman''s air; since 1956 the situation has changed; in spirit we are readier than in 1957.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 22, 1963 (and n. 47). Made public: 2013. See [[cal.1963-07-21.china-leadership]]. Names: Mao Zedong, E. F. Hill, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:deng-xiaoping
      - name:peng-zhen
      - polity:australia
      - vis:only:prc+australia
- add:
    entry:
      id: cal.1963-07-23.china-leadership
      when: July 23
      date: '1963-07-23'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Noon, Juxiang Shuwu. Mao presides at the Standing Committee: Kang Sheng to write the articles answering Moscow; the Secretariat to turn to industry.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 23, 1963. Made public: 2013. See [[cal.1963-07-22.china-leadership]]. Names: Mao Zedong, Kang Sheng.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-26.china-leadership
      when: July 26
      date: '1963-07-26'
      thread: china-leadership
      also:
      - china
      - cuba
      c: 'Yinian Tang. Mao receives Cuban cultural, trade union and student delegations; Chu Tunan present. American imperialism threatens the world with war and prepares for it: one kind a nuclear war, which it may or may not fight, the other conventional, which is its policy. He names General Maxwell Taylor''s *The Uncertain Trumpet*, which criticizes Truman and Eisenhower for neglecting conventional war, as worth reading.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 26, 1963. Made public: 2013. Names: Mao Zedong, Chu Tunan, Taylor.'
      tags:
      - polity:prc
      - polity:cuba
      - polity:us
      - name:mao-zedong
      - vis:only:prc+cuba
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1963-07-28.china-leadership
      when: July 28
      date: '1963-07-28'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on Deng Xiaoping''s request, to tell the Party what the Sino-Soviet talks were: to read the records of the nine sessions to cadres of rank 17 and up. Mao: reading is not enough; print them, a copy to every three to five, for discussion, to be called back after three months.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 28, 1963. Made public: 2013. See [[cal.1963-07-23.china-leadership]]. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-28.china-leadership-2
      when: July 28
      date: '1963-07-28'
      thread: china-leadership
      also:
      - testing
      c: Juxiang Shuwu, afternoon. A meeting, Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others, on the treaty banning nuclear tests in the atmosphere, in outer space and under water, initialed in Moscow July 25 by the United States, Britain and the Soviet Union.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 28, 1963 ("同日"). Made public: 2013. To check: the treaty initialed July 25 (the calendar''s [[cal.1963-07-25.testing]]). See [[cal.1963-07-25.testing]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:us
      - polity:uk
      - polity:ussr
