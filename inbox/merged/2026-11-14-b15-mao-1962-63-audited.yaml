- add:
    entry:
      id: cal.1963-09-06.china-leadership
      when: Sept. 6
      date: '1963-09-06'
      thread: china-leadership
      c: 'Huairen Hall. The Central Work Conference opens (Sept. 6–27), Mao presiding. Deng Xiaoping gives the agenda: 1964''s plan; the added rural policies; the line for industry (the main question); the international question, the struggle against revisionism. Schedule: Sept. 6–16 plan and rural; 17–22 industry resolution; 23–26 international. Zhou Enlai reports on the 1964 plan.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 6, 1963. Made public: 2013. To check: the conference papers (the nianpu names: the 1964 plan, the rural measures, "On the development of industry"). Names: Mao Zedong, Deng Xiaoping, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-09.china-leadership
      when: Sept. 9
      date: '1963-09-09'
      thread: china-leadership
      also:
      - china
      c: The Great Hall, afternoon. Mao receives Williams (威廉斯), chairman of the New Zealand Communist Party; Zhao Yimin present. China has serious class struggle; ten years without a rectification; new bourgeois elements, good comrades who changed; only the masses can clean them out. China's history long, with victories and defeats.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 9, 1963 (and n. 67). Made public: 2013. Names: Mao Zedong, Williams, Zhao Yimin. Check: Williams''s given name (the nianpu gives none).'
      tags:
      - polity:prc
      - name:mao-zedong
      - polity:nz
      - vis:only:prc+nz
- add:
    entry:
      id: cal.1963-09-13.china-leadership
      when: Sept. 13
      date: '1963-09-13'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao revises the second commentary on the Soviet open letter three times (early to mid-September), retitled "On the question of Stalin": the Stalin question a great question the world over, which stirred every class and is still argued; no verdict is likely this century. Published in the *Renmin ribao* and *Hongqi*.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 13, 1963 (the entry for early and mid-Sept.). To check: the commentary, *Renmin ribao*, Sept. 13, 1963 (the date not in the nianpu). Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
- add:
    entry:
      id: cal.1963-09-22.china-leadership
      when: Sept. 22
      date: '1963-09-22'
      thread: china-leadership
      also:
      - japan
      c: 'Yinian Tang. Mao receives Takenaka Tsunesaburo of the Japanese Communist Party''s Central Committee; Liu Ningyi present. The world situation changes fast; two groupings: revolutionary workers and peoples, and the United States-led counter-revolutionary league; China backward, the town population under a fifth; will mechanize and use fertilizer.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 22, 1963. Made public: 2013. Names: Mao Zedong, Takenaka Tsunesaburo, Liu Ningyi.'
      tags:
      - polity:prc
      - polity:japan
      - name:mao-zedong
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1963-09-23.china-leadership
      when: Sept. 23
      date: '1963-09-23'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Huairen Hall. Mao presides at the Work Conference''s plenary: Deng Xiaoping reports on the struggle against revisionism since the Sino-Soviet talks: the Soviet plenum''s resolution of June 21, naming the Chinese party, and the open letter of July 14 begin a new stage; ten articles to be published, two already (the origin of the differences; on Stalin).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 23, 1963. Made public: 2013. See [[cal.1963-09-06.china-leadership]]. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-26.china-leadership
      when: Sept. 26
      date: '1963-09-26'
      thread: china-leadership
      also:
      - china
      c: 'Mao marks for Jiang Qing items in the *Cankao xiaoxi* of Sept. 25. Page 1: AFP''s Marcus on China''s material conditions and food much improved; AFP, the Soviet statement brings the dispute to a new stage. Page 4: Kyodo, American "containment" of China stuck everywhere; the *Christian Science Monitor* on Galbraith, former ambassador to India, urging trade with China; AP on Fulbright, chairman of the Senate Foreign Relations Committee, for relations with both China and the Soviet Union; the American reporter Barrett on imperialism''s fear of a strong China. To Jiang Qing: to be studied, not only read, several times over.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 26, 1963. Made public: 2013. To check: *Cankao xiaoxi*, Sept. 25, 1963. Names: Mao Zedong, Jiang Qing, Galbraith, Fulbright.'
      tags:
      - polity:prc
      - polity:us
      - name:mao-zedong
      - vis:only:prc
      - name:jiang-qing
      - name:galbraith-john-kenneth
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1963-09-27.china-leadership
      when: Sept. 27
      date: '1963-09-27'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Huairen Hall, afternoon. Mao presides at the Work Conference''s last plenary, and speaks. All feared the situation, the international above all; some feared Soviet–American collaboration; he trusts Wang Xifeng''s line, "the great have great troubles"; both the United States and the Soviet Union are in difficulty. Rostow ("chairman of the American policy council," 罗斯特 in the nianpu) has written an article whose tone is that both met troubles that have no solution. Deng Xiaoping sums up: the four items done; the documents on socialist education in the villages, on the plan, grain and the like in the main settled.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 27, 1963. Made public: 2013. To check: Rostow''s article as Mao read it (the nianpu: "罗斯特", chairman of the policy planning body). See [[cal.1963-09-23.china-leadership]]. Names: Mao Zedong, Rostow, Deng Xiaoping. Check: the article.'
      tags:
      - polity:prc
      - polity:us
      - polity:ussr
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1963-09-28.china-leadership
      when: Sept. 28
      date: '1963-09-28'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Yinian Tang, afternoon. Mao, with Wang Enmao of Xinjiang, Luo Ruiqing, He Long, Xiao Hua, Xie Fuzhi, Zhou Enlai, Zhu De, Chen Yi and Yang Chengwu, on Xinjiang in the struggle against revisionism and on military preparation. First the economy: farms, herds and industry better every year, and the people''s life better than under the Guomindang and than in the Soviet Union now; then politics in command, education against revisionism, the nationalities policy; the Han settlers to respect local custom and learn the languages; the border watched. He proposes, Lin Biao being long ill, that He Long run the Military Commission''s daily work.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 28, 1963. Made public: 2013. Names: Mao Zedong, Wang Enmao, Luo Ruiqing, He Long, Xiao Hua, Xie Fuzhi, Zhou Enlai, Zhu De, Chen Yi, Yang Chengwu, Lin Biao.'
