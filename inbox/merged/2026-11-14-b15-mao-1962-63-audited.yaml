      id: cal.1963-09-03.china-leadership
      when: Sept. 3
      date: '1963-09-03'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Yinian Tang. Mao, with Liu Shaoqi, Zhou Enlai, Zhu De and Deng Xiaoping, receives the Indonesian Communist Party''s delegation under Aidit; Peng Zhen, Kang Sheng and Liu Ningyi present. Khrushchev builds policy and theory on nuclear blackmail; the Chinese party''s history shows imperialism''s and the reactionary bourgeoisie''s agreements and declarations are not to be trusted. His advice: give the Sino-Soviet documents not only to the Politburo but to the Central Committee, provincial and county committee leaders.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 3, 1963. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Aidit, Peng Zhen, Kang Sheng, Khrushchev, Liu Ningyi.'
