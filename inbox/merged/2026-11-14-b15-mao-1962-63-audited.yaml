    entry:
      id: cal.1963-09-05.china-leadership
      when: Sept. 5
      date: '1963-09-05'
      thread: china-leadership
      also:
      - china
      c: Evening. Mao receives the African National Congress delegation under Tambo; Liao Chengzhi and Liu Ningyi present. Revolution not easy, a twenty-two-year armed struggle in China; but it can win however strong the enemy, by winning, teaching and organizing the masses, some in the Party, workers in unions, peasants in peasant bodies.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 5, 1963. Made public: 2013. Names: Mao Zedong, Oliver Tambo, Liao Chengzhi, Liu Ningyi.'
