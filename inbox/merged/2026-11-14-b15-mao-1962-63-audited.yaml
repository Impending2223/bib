- edit:
    id: cal.1962-06-27.court
    base: 6a7464b3
    set:
      n: 'The President''s News Conference of June 27, 1962, [1962 Pub. Papers 509](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=569). [[w.reeves-president-kennedy]], 325–26; [[w.sorensen-counselor]], 166 (Kennedy''s reply on the school prayer decision, "superb," not scripted or suggested in advance by Sorensen: "We have in this case a very easy remedy ... We can pray a good deal more at home"; Sorensen had visited Justice Douglas that spring at the President''s request, a visit he later cut from his book at Robert Kennedy''s request). [[w.sorensen-kennedy]], 364 (the school prayer answer). [[w.sorensen-kennedy]], 661–62 (Chiang''s talk of an invasion; the statement drawn from the campaign speeches; the same message at Warsaw). See [[cal.1962-06-25.court]], [[cal.1962-06-24.china-leadership]]. Names: Edward Kennedy, Kennedy.'
