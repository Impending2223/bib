    entry:
      id: cal.1962-03-30.china-leadership
      when: Mar. 30
      date: '1962-03-30'
      thread: china-leadership
      also:
      - china
      - cuba
      c: 'Mao receives a Cuban military delegation and the Black Cuban singer Ignacio Villa; Chu Tunan present. He asks of the Latin American countries'' revolutions, their geography and population. Of foreign experience: know it, but do not copy it. The Second Havana Declaration a revolutionary declaration; the socialist states should unite, and the peoples against imperialism.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 30, 1962. Made public: 2013. Names: Mao Zedong, Chu Tunan, Ignacio Villa.'
      tags:
      - polity:prc
      - polity:cuba
      - name:mao-zedong
      - vis:only:prc+cuba
- add:
    entry:
      id: cal.1962-04-03.china-leadership
      when: Apr. 3
      date: '1962-04-03'
      thread: china-leadership
      also:
      - soviet-union
      c: Yinian Tang, afternoon. The Standing Committee meets again, Mao presiding, on the draft reply to the Soviet letter of Feb. 22.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 29, 1962 (Apr. 3). Made public: 2013. See [[cal.1962-03-29.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-07.china-leadership
      when: Apr. 7
      date: '1962-04-07'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The enlarged Politburo adopts the Central Committee''s reply to the Soviet Central Committee''s letter of Feb. 22. To the Soviet charges (a "special position," a line apart from the other parties'', support for Albania) it answers with a proposal: a conference of fraternal parties to settle the common line and the Soviet–Albanian question.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 29, 1962 (Apr. 7). Made public: 2013. To check: the reply as sent (the nianpu, Mar. 20, dates a revision to Apr. 2) and its delivery. See [[cal.1962-04-03.china-leadership]]. Check: The nianpu does not date the delivery.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-09.china-leadership
      when: Apr. 9
      date: '1962-04-09'
      thread: china-leadership
      c: 'Qinzheng Hall. Mao at the Supreme State Conference (18th session, second meeting), which discusses Liu Shaoqi''s report of Mar. 21 on the January conference. After the democratic parties'' men speak, Mao: January''s was a first summing-up; whether it is right the practice will test; whether the "three red flags" are still right or needed will take a time of doing; the general line is there but not yet a whole set of specific policies.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 9, 1962. Made public: 2013. Names: Mao Zedong, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-12.china-leadership
      when: Apr. 12
      date: '1962-04-12'
      thread: china-leadership
      c: 'Mao on the Central Committee''s directive adopting the Finance and Trade Office''s report on 1961 finance and credit and the way to the policy "balance this year, some currency withdrawn": "Seen; return to the Premier; very good; issue." The directive: the difficulty is greater than the January conference reckoned; before measures the year''s budget stands at a 5 billion yuan deficit; to be wiped out by more output, thrift, cuts in administrative and defense expenditure, and higher prices on some goods.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 12, 1962. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-24.china-leadership
      when: Apr. 24
      date: '1962-04-24'
      thread: china-leadership
      c: Evening. Mao presides at the Standing Committee, which hears Zhou Enlai on the main points of the Central Finance Group's report (drafted by Zhou and Li Xiannian) on discussing the 1962 plan for adjusting the economy.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 24, 1962 ("同日"). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Xiannian.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-27.china-leadership
      when: Apr. 27
      date: '1962-04-27'
      thread: china-leadership
      c: The Central Committee's notice on speeding up the review (甄别) of Party members and cadres wrongly dealt with, marked as approved by Deng Xiaoping and read by Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao and Yang Shangkun. The weight to fall on rural cadres below the county criticized or punished in the campaigns against "white flags" and the rightist tendency and in the communes' rectification, to be rehabilitated at once.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 27, 1962 ("同日"). Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Yang Shangkun.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:zhu-de
      - name:lin-biao
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-27.china-leadership-2
      when: Apr. 27
      date: '1962-04-27'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on Saifudin''s proposal that, as many Xinjiang people are going over the border, he be sent back to work in Xinjiang: "Premier: is it right for Saifudin to go back? Please decide."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 27, 1962 ("同日"). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Saifudin.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-05-01.china-leadership
      when: May 1
      date: '1962-05-01'
      thread: china-leadership
      c: 'Peking. Mao reads the revised first part of the Central Finance Group''s draft report, with Zhou Enlai''s changes: closer to the facts, a base for the Center''s small meeting with the regional secretaries in early May. Afternoon, Yinian Tang: the Standing Committee takes up the first part, Mao agreeing to the report''s line.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 1, 1962. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-05-07.china-leadership
      when: May 7
      date: '1962-05-07'
      thread: china-leadership
      c: 'Peking. The Central Work Conference, Liu Shaoqi presiding, May 7–11, on the Central Finance Group''s draft report: the hardest period not past in some regions and branches; a great, broad adjustment of the economy; agriculture, light industry, heavy industry in that order; cut the industrial front, cut workers and town population, raise farm inputs and consumer goods, stop inflation. Zhou Enlai then drafts the Central Committee''s covering directive.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 7, 1962 (the entry for May 7–11). Made public: 2013. Names: Liu Shaoqi, Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-05-15.china-leadership
      when: May 15
      date: '1962-05-15'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on Zhou Enlai''s report of May 12 on the Foreign Ministry''s proposal not to send an observer to the meeting of seven Soviet-bloc leaders (the Soviet Union, Bulgaria, Czechoslovakia, East Germany, Poland, Romania, Hungary) that Poland proposed. Zhou: refuse, in amended words, a meeting that is a "trap." Mao: agreed, no one to go; whether to tell Korea, Vietnam and Mongolia, the Premier to decide.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 15, 1962. Made public: 2013. To check: the Foreign Ministry''s report. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - polity:ussr
      - polity:poland
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-05-18.china-leadership
      when: May 18
      date: '1962-05-18'
      thread: china-leadership
      c: 'Shanghai, the Cultural Club. Mao with Luo Ruiqing, Wang Dongxing, Tian Jiaying and Lei Yingfu: a group is set up to revise the Central Military Commission''s draft "proposal on strategic policy."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 18, 1962. Made public: 2013. Names: Mao Zedong, Luo Ruiqing, Wang Dongxing, Tian Jiaying, Lei Yingfu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:luo-ruiqing
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-08.china-leadership
      when: June 8
      date: '1962-06-08'
      thread: china-leadership
      also:
      - china
      c: 'Hangzhou, afternoon. Mao hears Yang Chengwu and Xu Shiyou on the possibility that Chiang Kai-shek''s forces venture against the southeast coast, on the preparations, and on the Politburo''s enlarged meeting of June 6. He agrees wholly with the dispositions of the army, navy and air force: the enemy at most 150,000; eight divisions into Fujian, one more for eastern Zhejiang; the general reserve not yet to move; the arms industry to be built up on this occasion, and the research on advanced weapons to go on.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 8, 1962. Made public: 2013. Names: Mao Zedong, Xu Shiyou, Yang Chengwu.'
      tags:
      - polity:prc
      - polity:roc
      - name:mao-zedong
      - name:xu-shiyou
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-10.china-leadership
      when: June 10
      date: '1962-06-10'
      thread: china-leadership
      also:
      - china
      c: 'The Central Committee''s directive to prepare to crush a Nationalist invasion of the southeast coast. Chiang''s remnant band, backed by American imperialism, prepares an adventure: judged likely to land 200,000 to 300,000 troops on Fujian and the Fujian–Guangdong and Fujian–Zhejiang borders around the typhoon season.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 10, 1962. Made public: 2013. See [[cal.1962-06-08.china-leadership]].'
      tags:
      - polity:prc
      - polity:roc
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-11.china-leadership
      when: June 11
      date: '1962-06-11'
      thread: china-leadership
      also:
      - china
      c: 'Changsha, evening. Mao revises Xinhua''s dispatch "On Chiang''s gang preparing to raid our coast," adding that most of the Nationalist soldiers are forced to come, a part diehards or out for loot, and that Taiwan, short of men, would press young men of the mainland coast into its ranks. 3 a.m. June 12, to Lin Ke: Liu Shaoqi to have the Standing Committee, Peng Zhen, Luo Ruiqing, Xiao Hua, Lu Dingyi and Wu Lengxi read it through before it is fixed.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 11, 1962. Made public: 2013. See [[cal.1962-06-10.china-leadership]]. Names: Mao Zedong, Lin Ke, Liu Shaoqi, Peng Zhen, Luo Ruiqing, Xiao Hua, Lu Dingyi, Wu Lengxi.'
      tags:
      - polity:prc
      - polity:roc
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
      - name:peng-zhen
      - name:luo-ruiqing
      - name:lu-dingyi
- add:
    entry:
      id: cal.1962-06-24.china-leadership
      when: June 24
      date: '1962-06-24'
      thread: china-leadership
      also:
      - china
      c: The People's Daily prints Xinhua's dispatch on the Nationalists' plans, "The army and people of the whole country to raise their guard, ready to smash the Chiang gang's military adventure." It had gone out first inside the Party, by Mao's telegram for the Center of June 18, to the county and regiment committees, to be explained by word of mouth, the day of publication left to the Center.
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 11, 1962 (June 18 and 24). Made public: 2013 (the telegram of June 18). To check: the dispatch, *Renmin ribao*, June 24, 1962. See [[cal.1962-06-11.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:roc
      - name:mao-zedong
      - vis:only:prc@B
- add:
    entry:
      id: cal.1962-06-21.china-leadership
      when: June 21
      date: '1962-06-21'
      thread: china-leadership
      also:
      - soviet-union
      c: Wuchang, 6 p.m. Mao receives the Korean Supreme People's Assembly delegation under Pak Kum Chol, vice-chairman of the Workers' Party; Peng Zhen, Ke Qingshi, Tao Zhu, Wang Renzhong and Wu Xiuquan present. A country must rely on itself first and on foreign aid second; Khrushchev does not like China's self-reliance; of the 81 parties, a majority for now follow Khrushchev, China a minority; the Soviet people are good.
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 21, 1962. Made public: 2013. Names: Mao Zedong, Pak Kum Chol, Peng Zhen, Ke Qingshi, Tao Zhu, Wang Renzhong, Wu Xiuquan, Khrushchev.'
      tags:
      - polity:prc
      - polity:dprk
      - name:mao-zedong
      - name:peng-zhen
      - name:ke-qingshi
      - name:tao-zhu
      - vis:only:prc+dprk
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-06-22.china-leadership
      when: June 22
      date: '1962-06-22'
      thread: china-leadership
      c: Wuchang. Mao with Ke Qingshi, Tao Zhu, Wang Renzhong, Tian Jiaying and Wang Dongxing on rural questions; puts forward revisions of the "Sixty Articles" (the communes' work regulations).
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 22, 1962. Made public: 2013. Names: Mao Zedong, Ke Qingshi, Tao Zhu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:ke-qingshi
      - name:tao-zhu
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-27.china-leadership
      when: June 27
      date: '1962-06-27'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on the Central Committee''s instruction on telling the masses of the handling of the flight of border people and the Yining riot in Xinjiang: "Seen; agreed." The instruction: the flight from Tacheng and Ili and the Yining riot a great exposure of "some foreign force''s" long subversion in Xinjiang; the region''s people''s committee to issue an order stating the policy toward foreign nationals, those who claim to be, foreign official agencies and exit of Chinese citizens; then education on the homeland and the line between Chinese and foreign, and on Sino-Soviet unity.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 27, 1962 ("同日"). Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-29.china-leadership
      when: June 29
      date: '1962-06-29'
      thread: china-leadership
      also:
      - soviet-union
      c: Wuchang, East Lake. Mao receives the Albanian Party of Labor delegation under Hysni Kapo (卡博), member of its Politburo and Secretary of its Central Committee; Wu Xiuquan and Wang Renzhong present. Khrushchev's revisionism has its root in the Twentieth Congress, which was against Stalin; since Stalin's death they took power; Molotov and others pushed out; half of the center and seventy percent of local cadres changed; the Twenty-second Congress; Stalin's body burned. China and Albania a minority at the meeting of 81 parties but have the truth.
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 29, 1962 (and n. 61). Made public: 2013. Names: Mao Zedong, Hysni Kapo, Wu Xiuquan, Wang Renzhong, Khrushchev.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - polity:albania
      - name:khrushchev-nikita-s
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1962-07-06.china-leadership
      when: July 6
      date: '1962-07-06'
      thread: china-leadership
      c: 'Peking, Mao''s pool residence. At Tian Jiaying''s request. Tian: about 30 percent of the peasants over the country already work by household contracting or divided land, and the share is growing; better to lead it than leave it to spontaneity; at the end perhaps 40 percent so, 60 percent collective or semi-collective; a stopgap, to be led back to the collective after recovery. Mao says nothing while he hears him; then asks: "Do you stand for the collective economy or the individual as the chief?" and "is it your own view or others''?" Tian: his own.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 6, 1962. Made public: 2013. Names: Mao Zedong, Tian Jiaying.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-07-06.china-leadership-2
      when: July 6
      date: '1962-07-06'
      thread: china-leadership
      c: 4 p.m., Mao's pool residence. Chen Yun, who had written at 1 p.m. asking for an hour, lays before Mao his view for dividing land among households. Mao, after hearing him, gives no sign; Chen later recalls that he "was very angry" afterward.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 6, 1962 ("同日"). Made public: 2013. See [[cal.1962-07-06.china-leadership]]. Names: Mao Zedong, Chen Yun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:chen-yun
      - vis:only:prc
- add:
    entry:
      id: cal.1962-07-08.china-leadership
      when: July 8
      date: '1962-07-08'
      thread: china-leadership
      c: 'Noon, Juxiang Shuwu. Mao with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Boda and Tian Jiaying: summer harvests in Henan and Shandong are not so bad; asks Liu and others to see the Henan, Shandong and Jiangxi comrades; declares against household contracting, and reproaches Tian for working it up in Peking instead of revising the "Sixty Articles." Proposes a draft decision on consolidating the collective economy and developing farm output for a Central Work Conference; Chen Boda to draft it.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 8, 1962. Made public: 2013. See [[cal.1962-07-06.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Boda.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:chen-boda
      - vis:only:prc
- add:
    entry:
      id: cal.1962-07-11.china-leadership
      when: July 11
      date: '1962-07-11'
      thread: china-leadership
      c: 'The Central Committee''s notice calling a Central Work Conference for late July, with the regional bureaus, provincial and some prefectural secretaries: farm work, grain, commerce, state support for agriculture. A list of questions goes out with it for discussion beforehand.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 11, 1962. Made public: 2013. See [[cal.1962-07-08.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1962-07-12.china-leadership
      when: July 12
      date: '1962-07-12'
      thread: china-leadership
      also:
      - south-asia
      c: 'Midnight. Mao hears Zhou Enlai on the Sino-Indian border: on July 10 Indian troops in the western sector pressed on the Chinese patrol to within fifty yards; on July 11 two Indian helicopters landed reinforcements and hovered low; another detachment moved down the Galwan to set up a new post.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 12, 1962. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - polity:india
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-07-15.china-leadership
      when: July 15
      date: '1962-07-15'
      thread: china-leadership
      also:
      - south-asia
      c: 'Diaoyutai, Building 17. Mao receives Pakistan''s ambassador, Rashidi; Huang Zhen present. China big, much people, backward in economy and culture; it needs decades to escape that; Europe and North America developed in a hundred years from the later nineteenth century; Asians and Africans can do it in a few decades. To Rashidi''s praise of him as the great physician of Chinese society: only an ordinary doctor; some ills cured, some found and not cured, some still unfound.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 15, 1962. Made public: 2013. Names: Mao Zedong, Rashidi, Huang Zhen.'
      tags:
      - polity:prc
      - polity:pakistan
      - name:mao-zedong
      - name:huang-zhen
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1962-07-17.china-leadership
      when: July 17
      date: '1962-07-17'
      thread: china-leadership
      c: 'Mao receives Deng Zihui at his request. Deng urges "responsibility fields" (责任田), citing the Anhui districts of Dangtu and Suxian and a Fuliji district committee report: unified in means of production, plans, labor, distribution and delivery to the collective, not individual farming; the form is a pay-by-output responsibility system with great life, and the peasants will not give it up. Mao says nothing, then as Deng gets up asks for the report to be sent.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 17, 1962. Made public: 2013. Names: Mao Zedong, Deng Zihui.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-07-17.china-leadership-2
      when: July 17
      date: '1962-07-17'
      thread: china-leadership
      c: The Central Committee circulates to the regional bureaus, the provinces, and the central and State Council departments the draft "decision on consolidating the communes' collective economy and developing farm production," ten points (state aid to farms; agriculture, light industry, heavy industry in order; the village as main market; investment, tax and procurement; and others), for discussion, objections invited, replies by July 25.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 17, 1962 ("同日"). Made public: 2013. To check: the draft decision of July 17, 1962 (the nianpu lists its ten points). See [[cal.1962-07-11.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1962-07-18.china-leadership
      when: July 18
      date: '1962-07-18'
      thread: china-leadership
      c: 'Afternoon. Mao to Yang Shangkun: whether to take the collective road or the individual one; and his dissatisfaction with the State Planning Commission and the Ministry of Commerce; "against dispersionism" again. Yang''s diary that day: "I think the situation grave!! deeply uneasy"; that evening he reports it to Zhou Enlai.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 18, 1962. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Yang Shangkun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-07-19.china-leadership
      when: July 19
      date: '1962-07-19'
      thread: china-leadership
      c: 'Mao''s pool residence, afternoon. The Standing Committee, Mao presiding. Against dispersionism: the center''s own departments the worst; foreign affairs, the Liaison Department and the Military Commission good; the State Planning Commission, Economic Commission, Organization Department and others report little. Rehabilitation to be done on the facts, not "one wind sweeps all." The delegates to the work conference to be at Beidaihe July 25.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 19, 1962. Made public: 2013. See [[cal.1962-07-18.china-leadership]]. Names: Mao Zedong.'
      tags:
