      - polity:indonesia
      - polity:burma
      - name:mao-zedong
      - name:zhou-enlai
      - name:sukarno
      - name:ne-win
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-30.china-leadership
      when: Nov. 30
      date: '1962-11-30'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Juxiang Shuwu, 1:30 p.m. Mao presides at the Standing Committee on four matters. One: the Central Work Conference put off to about Jan. 15, 1963. Two: an NPC session in the first half of 1963 for plan and budget, another in the second half to elect; with it a third session of the Eighth Congress, its delegates from 1,200 to about 2,000, one a county. Three: the struggle against revisionism: at international meetings to which Yugoslavia is invited China will attend and not walk out, lest it lose its voice, as at the Italian party''s congress, which invited Yugoslavia and attacked China by name; *Peking Review* to become a theoretical journal for the world, in English, Spanish and French, on the International Liaison Department''s report; a digest to be edited in Peking and printed in Hong Kong. Four: the organization work conference (by Deng Xiaoping''s account to the Secretariat, Dec. 4: the Standing Committee agreed to register the Party''s members anew, on trial in 1963, in full in 1964).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 30, 1962 (and nn. 119, 121; the Congress''s third session was never held). Made public: 2013. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:yugoslavia
      - name:mao-zedong
      - vis:only:prc
      - polity:italy
      - name:deng-xiaoping
- add:
    entry:
      id: cal.1962-11-30.china-leadership-2
      when: Nov. 30
      date: '1962-11-30'
      thread: china-leadership
      also:
      - indonesia
      c: 'Yinian Tang, 6 p.m. Mao receives Jusuf Adjitorop (阿吉托罗普), alternate member of the Indonesian Communist Party''s Politburo and deputy general secretary, and his party; Liu Ningyi present. Two united fronts: the working people''s, of workers, peasants and revolutionary intellectuals; and the working class''s with the national bourgeoisie, itself oppressed, an exploiting class in the middle, to be united with and struggled with, not overthrown. The peasants the revolution''s main force: who solves the peasant question wins.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 30, 1962 ("同日"). Made public: 2013. See [[cal.1962-11-30.china-leadership]]. Names: Mao Zedong, Jusuf Adjitorop, Liu Ningyi.'
      tags:
      - polity:prc
      - polity:indonesia
      - name:mao-zedong
      - vis:only:prc+indonesia
- add:
    entry:
      id: cal.1962-12-14.china-leadership
      when: Dec. 14
      date: '1962-12-14'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on the *People''s Daily* editorial Deng Xiaoping had drafted: "read; very good; such articles are needed." He changes the title from "Hold to truth, tell right from wrong, unite against the enemy" to "Workers of the world, unite against our common enemy." Printed Dec. 15.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 14, 1962. Made public: 2013. To check: the editorial, *Renmin ribao*, Dec. 15, 1962. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1962-12-24.china-leadership
      when: Dec. 24
      date: '1962-12-24'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Hangzhou. Mao to Hu Qiaomu on the article "The differences between Comrade Togliatti and us": a meeting each night for three nights, Mao, Liu Shaoqi, Chen Boda, Kang Sheng, Wang Jiaxiang, Hu Qiaomu, Tian Jiaying and Yang Shangkun, so that the three-man drafting group can revise next day; the evening''s text and the Politburo''s comments to be printed by 7 p.m., ten copies. The middle and last parts to be compressed by 1,000–2,000 words.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 24, 1962. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Chen Boda, Kang Sheng, Togliatti, Wang Jiaxiang, Hu Qiaomu, Tian Jiaying, Yang Shangkun.'
