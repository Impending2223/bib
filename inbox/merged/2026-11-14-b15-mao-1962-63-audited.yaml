- add:
    entry:
      id: cal.1962-01-25.china-leadership
      when: Jan. 25
      date: '1962-01-25'
      thread: china-leadership
      c: 'Huairen Hall. The enlarged Politburo, Liu Shaoqi presiding, in the main adopts the report''s second draft: three parts, the present situation and tasks, centralization and unity, the Party''s problems.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 25, 1962. Made public: 2013. See [[cal.1962-01-16.china-leadership]]. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-26.china-leadership
      when: Jan. 26
      date: '1962-01-26'
      thread: china-leadership
      c: 'Diaoyutai, Building 12, afternoon. Mao presides at the Standing Committee: the conference''s arrangements and the outline of Liu Shaoqi''s oral report; the plenary on Jan. 27 for Liu''s oral report; the conference to end Jan. 30.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 26, 1962. Made public: 2013. See [[cal.1962-01-25.china-leadership]]. Names: Mao Zedong, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-27.china-leadership
      when: Jan. 27
      date: '1962-01-27'
      thread: china-leadership
      c: 'The Great Hall, 2 p.m. Mao presides over the Work Conference''s plenary session. Liu Shaoqi''s oral report: nationally the errors and the successes stand not as one finger to nine but as three to seven; in some regions the errors the greater; the peasants'' phrase, "three parts natural calamity, seven parts man-made"; the center first to answer for the errors, the State Council included; the ten-year goals of 1963–72 may be thought too low. Mao interjects: the center''s own improper things included; the slogans yet to be cleared up; the goals may not be reached; local interests to be looked after.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 27, 1962. Made public: 2013. To check: Liu''s oral report and the written report as adopted (the nianpu gives the oral report''s words and Mao''s interjections). See [[cal.1962-01-26.china-leadership]]. Names: Mao Zedong, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-29.china-leadership
      when: Jan. 29
      date: '1962-01-29'
      thread: china-leadership
      c: 'The Great Hall, 4 p.m. Plenary session, Mao presiding. Lin Biao: the general line, the Great Leap and the communes are right; the difficulties arose because Mao''s instructions were not followed; China can overtake the United States in decades; on war: do not provoke, do not strike first, delay it, but fight an offensive defense, not a passive one. Mao: Lin''s speech very good, to be written up; then, after talk with the Standing Committee, proposes extending the conference for a "venting meeting" (出气会), to let men speak who have held back: no recording, no blows, no reprisals; democratic centralism not yet built in the Party.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 29, 1962. Made public: 2013. See [[cal.1962-01-27.china-leadership]]. Names: Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-30.china-leadership
      when: Jan. 30
      date: '1962-01-30'
      thread: china-leadership
      c: 'The Great Hall, 4 p.m. Mao''s long speech to the plenary, six parts: how the conference is run; democratic centralism; which classes to unite and which to oppress; knowledge of the objective world; the international communist movement; unity. Center: democracy in and out of the Party; no secret factions, but open dissent allowed and none to be punished; the mistakes of these years: the first account the center''s, and the center''s his first; then the provincial, prefectural and county committees in turn. On socialist construction: "we lack experience"; he told Montgomery it would take over a hundred years.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 30, 1962. Made public: 2013. To check: Mao''s speech of Jan. 30, 1962, as printed in his *Selected Works*, if included, and the nianpu''s note on the revised record (Feb. 24, Mar. 10). See [[cal.1962-01-29.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-30.china-leadership-2
      when: Jan. 30
      date: '1962-01-30'
      thread: china-leadership
      c: 'Yinian Tang, evening. Mao with the Standing Committee and the first secretaries of the regional bureaus: how to hold the venting meetings. Standing Committee members to join the provinces'' groups; Jan. 31–Feb. 2 for group meetings; the higher organs not to hurry to self-criticize; a provincial secretary who blocks speech to step aside; "no tracing" of what is said in the meetings; cadres who have erred and can mend are to be used; the accounting unit to be moved down, if possible by March.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 30, 1962 ("同日"). Made public: 2013. See [[cal.1962-01-30.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-02-01.china-leadership
      when: Feb. 1
      date: '1962-02-01'
      thread: china-leadership
      c: 'Yinian Tang, evening. Mao presides at the enlarged Standing Committee: reports on the venting meetings of North China, the Northeast and East China; the conference to run on past the Spring Festival.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 1, 1962. Made public: 2013. See [[cal.1962-01-30.china-leadership-2]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-02-02.china-leadership
      when: Feb. 2
      date: '1962-02-02'
      thread: china-leadership
      c: 'Yinian Tang, evening. Mao presides over the enlarged Standing Committee again: reports from the Northwest, Central-South and Southwest. Deng Xiaoping and Peng Zhen propose to relax the strain in Party life: no venting meetings below the county; a return to the Party''s usual order. Decided: a report from each province''s head on Feb. 3 to close this stage; holiday Feb. 4–5; small meetings in the mornings and plenaries in the afternoons of Feb. 6–7.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 2, 1962. Made public: 2013. See [[cal.1962-02-01.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1962-02-06.china-leadership
      when: Feb. 6
      date: '1962-02-06'
      thread: china-leadership
      c: 'The Great Hall, 4:30 p.m. Plenary, Mao presiding. Deng Xiaoping: for the faults and errors the center first answers, and in the center the Secretariat chiefly, being the one that does the work; five virtues of the Party (Mao Zedong Thought, a good center, good cadres, good tradition, a people''s trust). Mao interjects: no secret factions; "inspect work, sum up experience, exchange opinions."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 6, 1962. Made public: 2013. See [[cal.1962-02-02.china-leadership]]. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1962-02-07.china-leadership
      when: Feb. 7
      date: '1962-02-07'
      thread: china-leadership
      c: 'The Great Hall, 4:30 p.m. Plenary, Mao presiding. Zhou Enlai: for the past years'' faults the State Council and its commissions bear much; leap targets set against fact; if proportions are not kept, laws of objective reality punish; the economy still in serious difficulty; farm recovery needs three to five years; 1962 the key year of adjustment. Mao closes the conference: nearly a month, the lines of communication opened, policy settled; a small conference of the first secretaries on Feb. 8.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 7, 1962. Made public: 2013. To check: the conference''s resolution on Liu Shaoqi''s report (the nianpu, Jan.–Feb. entry: Mao added "and the speeches of several Standing Committee comrades" and "restore democratic centralism"). See [[cal.1962-02-06.china-leadership]]. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-02-08.china-leadership
      when: Feb. 8
      date: '1962-02-08'
      thread: china-leadership
      c: 'Yinian Tang, evening. Mao presides at the enlarged Standing Committee: "one tight, one loose; now loosen it." Beidaihe in July; no meetings for several months. After it he leaves Peking south by train.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 8, 1962. Made public: 2013. See [[cal.1962-02-07.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-02-11.china-leadership
      when: Feb. 11
      date: '1962-02-11'
      thread: china-leadership
      c: 'Shanghai. Mao on Tian Jiaying''s report of Feb. 8: how long the production team, now the communes'' basic accounting unit, is to stay so. Deng Xiaoping would write twenty years; Tian asks: forty, or "at least twenty"? Mao, to Tian, for Deng, Liu Shaoqi and Zhou Enlai: "at least thirty"; the Soviet Union, forty-three years on, has not got agriculture through. He writes it into the Central Committee''s draft directive on the communes'' basic accounting unit, issued Feb. 13.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 11, 1962. Made public: 2013. To check: the directive of Feb. 13, 1962. Names: Mao Zedong, Tian Jiaying, Deng Xiaoping, Liu Shaoqi, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
      - name:liu-shaoqi
      - name:zhou-enlai
- add:
    entry:
      id: cal.1962-02-21.china-leadership
      when: Feb. 21
      date: '1962-02-21'
      thread: china-leadership
      c: 'Peking, the Xilou meeting room. The enlarged Standing Committee, Liu Shaoqi presiding, Feb. 21–23, on the 1962 state budget and the economy ("the Xilou meeting"): bad harvests, short markets, rising prices, a budget deficit of 3 billion yuan. Held to be like an emergency; a period of recovery to be fixed, the whole economy adjusted. Measures proposed. Mao is in the south.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 21, 1962 (the entry for Feb. 21–23). Made public: 2013. Names: Liu Shaoqi.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-02-23.china-leadership
      when: Feb. 23
      date: '1962-02-23'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao reads Deng Xiaoping''s report of Feb. 20 forwarding the International Liaison Department''s proposal that China urge a conference of communist parties; Deng asks whether it is proper for China to propose it. Mao: "Seen"; they are to discuss it first and send him their views; he has none yet, and will go over it with them in Peking in mid-March.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 23, 1962 ("同日"). Made public: 2013. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1962-03-13.china-leadership
      when: Mar. 13
      date: '1962-03-13'
      thread: china-leadership
      c: 'The enlarged Standing Committee (Mar. 12–13), Liu Shaoqi presiding, adopts the Central Committee''s endorsement of speeches by Chen Yun, Li Fuchun and Li Xiannian to the Party groups of the State Council''s commissions and ministries, and Liu''s proposal that Chen Yun head the Central Finance and Economic Group. Liu: Mao is away; report to him at once; if he agrees, issue; if not, discuss again.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 12, 1962 (the entry for Mar. 12 and 13). Made public: 2013. Names: Liu Shaoqi, Chen Yun, Li Fuchun, Li Xiannian.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:chen-yun
      - name:li-fuchun
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1962-03-17.china-leadership
      when: Mar. 17
      date: '1962-03-17'
      thread: china-leadership
      c: 'Wuchang, the East Lake guesthouse, afternoon. Mao with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Luo Ruiqing, Xie Fuzhi, Wang Renzhong and Tian Jiaying: agrees to the Central Committee''s endorsement of the three speeches, to go out to provincial and army level, and to Chen Yun as head of the Central Finance Group. (On Mar. 13 he had asked them to come, with Zhou''s draft report for the National People''s Congress, and to take up the Soviet letter of Feb. 22.)'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 17, 1962. Made public: 2013. See [[cal.1962-03-13.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Luo Ruiqing, Xie Fuzhi, Chen Yun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:luo-ruiqing
      - name:xie-fuzhi
      - name:chen-yun
      - vis:only:prc
- add:
    entry:
      id: cal.1962-03-20.china-leadership
      when: Mar. 20
      date: '1962-03-20'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Wuchang. Mao on the Central Committee''s draft reply (Mar. 15) to the Soviet Central Committee''s letter of Feb. 22: "Not usable; redo it." On the revision of Apr. 2 he writes beside one passage: friendly mutual support and aid are one thing, pointing the way and doing it for others quite another.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 20, 1962. Made public: 2013. To check: the CPSU Central Committee''s letter of Feb. 22, 1962. See [[cal.1962-03-05.soviet-union-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-03-22.china-leadership
      when: Mar. 22
      date: '1962-03-22'
      thread: china-leadership
      c: Wuchang. Mao hears Xie Fuzhi and Wang Dongxing on public security. The dictatorship of the people is no work for police and army alone; kill few, for each death touches kin; keep the Guomindang agents alive for labor, or send them back to Hong Kong; "seven catches, seven releases"; a criminal law and a civil law to be made, and case books; now "no law, no heaven."
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 22, 1962. Made public: 2013. Names: Mao Zedong, Xie Fuzhi, Wang Dongxing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:xie-fuzhi
      - vis:only:prc
- add:
    entry:
      id: cal.1962-03-27.china-leadership
      when: Mar. 27
      date: '1962-03-27'
      thread: china-leadership
      c: The Second National People's Congress, third session, opens in the Great Hall. Mao attends. Zhou Enlai gives the report on the work of the government.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 27, 1962. To check: Zhou''s report as printed in the *Renmin ribao*, Mar. 28, 1962. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
- add:
    entry:
      id: cal.1962-03-29.china-leadership
      when: Mar. 29
      date: '1962-03-29'
      thread: china-leadership
      also:
      - soviet-union
      c: Yinian Tang, afternoon. Mao presides at the Standing Committee on the draft reply to the Soviet Central Committee's letter of Feb. 22.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 29, 1962. Made public: 2013. See [[cal.1962-03-20.china-leadership]]. Names: Mao Zedong.'
