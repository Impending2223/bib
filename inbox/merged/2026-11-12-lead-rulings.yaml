- add:
    entry:
      id: cal.1965-01-19.transition-and-staff
      when: Jan. 19
      date: '1965-01-19'
      thread: transition-and-staff
      c: A dance given by Mary Lasker and Abe Fortas after the Inaugural Concert, by Schlesinger's journal. Johnson there, "lowering and somber." Humphrey, the Vice President-elect, dances; "everyone else stopped, formed a circle around him and applauded."
      n: '[[w.schlesinger-journals]], 235–36 (the entry of Jan. 20: "last night"). Made public: [[w.schlesinger-journals]] (2007). Names: Fortas, Johnson, Humphrey, Schlesinger.'
      tags:
      - name:fortas-abe
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1966-11-14.democratic-party
      when: Nov. 14
      date: '1966-11-14'
      thread: democratic-party
      c: 'Hickory Hill, a large party for Averell Harriman''s 75th birthday. Schlesinger gives a toast. Humphrey gives the best speech, by Schlesinger''s journal: "witty, charming, relaxed and brief."'
      n: '[[w.schlesinger-journals]], 254 (the entry of Nov. 16: "on November 14th"). Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Humphrey, Schlesinger.'
      tags:
      - name:harriman-w-averell
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
