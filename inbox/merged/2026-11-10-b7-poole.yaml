      thread: japan-and-korea-pueblo
      c: The *Pueblo* leaves Japan, under radio silence until it is taken under surveillance.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 237–38. Check: the day; Bernstein has the *Pueblo* off Wonsan Jan. 2 ([[cal.1968-01-02.japan-and-korea-pueblo]]). To check: Henry Millington, the *Pueblo* monograph for the National Security Agency; Statement by the Secretary of Defense, "The Pueblo Incident," Tab 3 to "Ball Committee Briefing Book," Joint History Office (cited by [[w.poole-joint-chiefs-of-staff-2012]], 238 n.54). See [[cal.1967-12-29.japan-and-korea-pueblo]].'
