        - 'via w.poole-joint-chiefs-of-staff-2012 238 n.54b: all'
- cite:
    id: cal.1968-01-21.japan-and-korea
    item: '[[w.poole-joint-chiefs-of-staff-2012]], 237 (a team of 31, under orders "to chop off President Park Chung Hee''s head," within 800 meters of the Blue House; nearly all killed or captured)'
    units: A-B
- variant:
    id: cal.1968-01-02.japan-and-korea-pueblo
    unit: A
    witness: w.poole-joint-chiefs-of-staff-2012
    reads: The USS Pueblo left Japan on 8 January ... a North Korean subchaser appeared on 22 January
    at: '237'
- check:
    id: cal.1968-01-02.japan-and-korea-pueblo
    text: 'Check: Poole (237) has the *Pueblo* leave Japan Jan. 8, its first message sent when a North Korean subchaser appears Jan. 22.'
