      c: 'Andrews, Md., Air Force One landing with the President''s body. Robert Kennedy comes aboard by the forward door
        and goes down the cabin past Johnson "without so much as a glance," by Valenti''s account. The forklift takes Mrs.
        Kennedy and the coffin; Johnson leaves the plane by himself.'
      n: '[[w.young-two-suns-of-the]], 48. To check: Jack Valenti, recorded interview by Sheldon M. Stern, May 25, 1982, pp.
        12–14, Oral History Program, JFK Library (cited by [[w.young-two-suns-of-the]], 48 n.44). See [[cal.1963-11-22.succession]].
        Names: Robert Kennedy, Johnson, Valenti, Jacqueline Kennedy.'
