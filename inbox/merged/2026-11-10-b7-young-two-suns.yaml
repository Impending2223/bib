    item: '[[w.young-two-suns-of-the]], 28, 36–37 (a narrow victory; Nixon and Lodge 26 States, Kennedy and Johnson 23, Mississippi''s
      electors to Byrd; Democrats down 21 House seats and 2 in the Senate)'
    units: A, C-D
- variant:
    id: cal.1960-11-08.elections-1960
    unit: A
    witness: w.young-two-suns-of-the
    reads: Kennedy bested Nixon by a mere 112,803 votes
    at: '36'
- variant:
    id: cal.1960-11-08.elections-1960
    unit: D
    witness: w.young-two-suns-of-the
    reads: explaining how the GOP was able to gain twenty House seats
    at: '28'
- check:
    id: cal.1960-11-08.elections-1960
    text: 'Check: Young gives Kennedy''s margin as 112,803 (36) and the Republicans'' gain in the House as twenty (28) and
      twenty-one (37).'
