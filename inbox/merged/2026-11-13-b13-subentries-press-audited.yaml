- edit:
    id: cal.1966-10-06.vietnam-asian-trip
    base: 5f0d130e
    set:
      part_of: cal.1966-10-06.press-and-broadcasting
      c: 'Johnson names Sol Linowitz Ambassador to the Organization of American States, Llewellyn Thompson Ambassador to the Soviet Union and Ellsworth Bunker, in Thompson''s place, Ambassador at Large. The trip: from Oct. 17, seventeen days, twenty-five thousand miles, New Zealand, Australia, the Philippines, Thailand, Malaysia, South Korea, a refueling stop in Alaska; the Manila Conference of all the nations in the war "the important business"; Mrs. Johnson to go. On the Great Society: "When you pass 85 bills out of 90 recommended, I think that is a pretty good box score."'
      n: '[1966 Pub. Papers 1117](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=491), at 1117 (the posts; Manila), 1120 (the box score), 1123 (the itinerary; Mrs. Johnson; not the miles, the refueling stop in Alaska or "the important business"). [[w.johnson-white-house-diary]], 428–29 (Lady Bird Johnson''s account; Bunker "Ambassador to the government of Vietnam," against the transcript). Names: Johnson, Thompson, Bunker, Lady Bird Johnson. Check: Bunker''s post.'
