- edit:
    id: cal.1961-08-30.berlin-and-vienna
    base: e72dfb10
    set:
      part_of: cal.1961-08-30.press-and-broadcasting
      n: '[1961 Pub. Papers 572](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=630), at 573. White House Statement on Soviet Resumption of Nuclear Weapons Tests, [1961 Pub. Papers 580](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=638). [FRUS 1961–63, VII, doc. 58](https://history.state.gov/historicaldocuments/frus1961-63v07/d58). The first test: [[cal.1961-09-01.testing]]. [[w.reeves-president-kennedy]], 223; [[w.shesol-mutual-contempt]], 74 (Clay''s condition: never to work with Robert Kennedy); [[w.fursenko-khrushchevs-cold-war]], 385 (the end of the moratorium announced; the tests at Semipalatinsk two days later); [[w.sorensen-kennedy]], 594–95 (Clay''s return as the President''s emissary); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 159 (Clay effective Sept. 15; Lemnitzer and McNamara had recommended him as chief of mission); [[w.sorensen-kennedy]], 293 (Aug. 30, the Soviet Union announces it will end the moratorium on testing). See [[cal.1961-08-19.berlin-and-vienna]]. Names: Clay.'
- edit:
    id: cal.1961-08-30.cuba-bay-of-pigs
    base: c3511f76
    set:
      part_of: cal.1961-08-30.press-and-broadcasting
      follows:
      - cal.1961-08-30.berlin-and-vienna
      c: 'Asked of *Time*''s version of the invasion, out that day, that Rusk canceled the air support for the landing and the President backed him: no comment; "the most inaccurate of all the articles that have appeared on Cuba." Of school aid, after the House''s vote that day: "everyone is for education but they''re all for a different education bill." "So we will be back next year."'
      n: '[1961 Pub. Papers 572](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=630), at 574, 580. [[w.sorensen-kennedy]], 316 (the answer; the article *Time*''s, or *Fortune*''s, from which it was condensed); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 191 (the news conference of Aug. 30 on *Time*''s version); [[w.graham-uncertain-triumph]], 24–25 (the school aid answer). See [[cal.1961-04-17.cuba]]. Names: Rusk, Kennedy.'
      src:
        c: 22e558a6
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=630: all'
        - 'w.sorensen-kennedy 316: A'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 191: A'
        - 'w.graham-uncertain-triumph 24–25: C-D'
