- edit:
    id: cal.1965-07-13.court
    base: 91bb275f
    set:
      part_of: cal.1965-07-13.press-and-broadcasting
      c: 'Thurgood Marshall, of the Second Circuit, named Solicitor General, the 33d; he leaves the bench. Cox goes back to Massachusetts. Confirmed Aug. 11, without a roll call; sworn Aug. 24. Of his own record on civil rights: "I am going to try to provide all the leadership that I can, notwithstanding the fact that someone may point to a mistake or 100 mistakes that I made in my past."'
      n: '[1965 Pub. Papers 735](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=209), at 736–37, 742; Remarks at the Swearing In of Judge Thurgood Marshall as Solicitor General, [1965 Pub. Papers 910](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=384) (Aug. 24, 1965). [111 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf) (1965). [[w.branch-at-canaans-edge]], 261; [[w.johnson-white-house-diary]], 295–96 (the news conference, watched on television at the Ranch; Thurgood Marshall "the first Negro to hold such a post," Solicitor General; not the circuit or the number). [[w.kotz-judgment-days]], 330 (the answer, after Ford''s charge of inconsistency). To check: [[w.williams-thurgood-marshall]]. Names: Marshall, Cox. Check: the page.'
      src:
        c: efaba2c2
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=209: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=384: all'
