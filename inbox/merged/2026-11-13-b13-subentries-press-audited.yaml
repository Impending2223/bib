- edit:
    id: cal.1965-07-13.transition-and-staff
    base: 8c65ee2b
    set:
      part_of: cal.1965-07-13.press-and-broadcasting
      follows:
      - cal.1965-07-13.court
      c: 'Leonard Marks named to head the USIA, replacing Carl Rowan; Penelope Thunberg a Tariff Commissioner. Asked whether Rusk may resign: "None whatever. ... He sits to my right in the Cabinet room. He ranks first in the Cabinet and he ranks first with me."'
      n: '[1965 Pub. Papers 735](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=209), at 737, 743. [[w.johnson-white-house-diary]], 295–96 (Mrs. Johnson''s account, from the television). See [[cal.1965-07-13.court]]. Check: the answer on Rusk as the diary words it, against the transcript''s. Names: Marks, Rowan, Rusk, Johnson, Lady Bird Johnson.'
