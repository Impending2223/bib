      c: 'The Hebei 河北 committee reports to Mao, the Center and the North China Bureau on carrying the Tenth Plenum''s resolutions into the villages and rectifying the communes: about three million Party and Youth League members, cadres and poor- and lower-middle-peasant activists trained; some 80 percent of commune members taught the plenum''s three documents and Mao''s three questions; the second stage, the Sixty Articles, under way; the movement to close by the end of March or early April.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 490–91 n.1 (the report of Feb. 17, 1963). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Hebei provincial Party committee, report to Mao Zedong, the Center and the North China Bureau on carrying out the Tenth Plenum''s resolutions in the villages and the rectification of the communes, Feb. 17, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 490 n.1). Names: Mao Zedong.'
