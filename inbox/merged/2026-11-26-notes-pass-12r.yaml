    entry:
      id: cal.1963-08-24.vietnam-6
      when: Aug. 24
      date: '1963-08-24'
      place: fort-myer
      thread: vietnam
      follows:
      - cal.1963-08-24.vietnam-5
      - cal.1963-08-24.vietnam
      time_range:
      - 1963-08-24T23:00Z
      - 1963-08-25T02:00Z
      time_band: evening
      time_zone: America/New_York
      range_basis: record
      c: Later that evening. General Krulak of the Joint Staff brings Taylor a copy of the dispatched cable at his house, Fort Myer; Taylor had called the Pentagon for it.
      n: '[[w.taylor-swords-and-plowshares]], 292 ("later in the evening"; Taylor''s account). See [[cal.1963-08-24.vietnam]]. Names: Krulak, Taylor.'
      tags:
      - name:krulak-victor-h
      - name:taylor-maxwell
      gloss:
        title: Commentary
        text:
        - 'Taylor (1972): on reading the cable his first thought was that the anti-Diệm group centered in State had used the absence of the principal officials to get out instructions never to be approved as written in normal times ([[w.taylor-swords-and-plowshares]], 292).'
