      c: 'Early evening. Gilpatric telephones Taylor at his quarters, Fort Myer, from his Maryland farm: Forrestal has told him the substance of the cable, for information, not Defense concurrence, the President having approved it. Gilpatric outlines it; both are concerned at its substance and at the handling.'
      n: '[[w.taylor-swords-and-plowshares]], 292 ("the early evening of August 24"; Taylor''s account). See [[cal.1963-08-24.vietnam]]. Names: Gilpatric, Taylor, Forrestal.'
      tags:
      - name:gilpatric-roswell-l
      - name:taylor-maxwell
      - name:forrestal-michael-v
