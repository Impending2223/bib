      - name:mcdermott-edward-a
      - state:ky
      src:
        c: f211d6e9
        rows:
        - 'w.sundquist-politics-and-policy 101–02: all'
- add:
    entry:
      id: cal.1963-04-09.jobs-and-wages
      when: Apr. 9
      date: '1963-04-09'
      thread: jobs-and-wages
      c: 4 p.m., the Cabinet Room. Kennedy with the Conference of Appalachian Governors and the Area Redevelopment Administration's
        advisory board. The region 5 percent of the labor force, 11 percent of the unemployed. A Joint Federal-State Committee
        under the Under Secretary of Commerce to prepare a development program this year.
      n: 'Remarks at a Meeting To Consider the Economic Problems of the Appalachian Region, [1963 Pub. Papers 317](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=375)
        (Apr. 9, 1963). [[w.sundquist-politics-and-policy]], 102 (the President''s Appalachian Regional Commission, Roosevelt
        its chairman). See [[cal.1961-05.jobs-and-wages]]. Names: Kennedy, Roosevelt.'
      tags:
      - name:kennedy-john-f
      - name:roosevelt-franklin-d-jr
      src:
        c: 4cdd22ac
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=375: all'
        - 'w.sundquist-politics-and-policy 102: A, C'
- add:
    entry:
      id: cal.1963-12.jobs-and-wages
      when: Dec.
      date: 1963-12
      thread: jobs-and-wages
      c: 'Soon after Johnson''s accession, the Budget Bureau objects to the Appalachian commission''s draft: too much on
        highways, too costly, construction before a plan. Roosevelt: a federal-state commission, its report its members''
        views, the work of 1,200 people; stripped, the governors would repudiate it. Johnson withholds approval for a time.'
      n: '[[w.sundquist-politics-and-policy]], 103. Check: the month ("shortly after the accession"). See [[cal.1963-04-09.jobs-and-wages]].
        Names: Roosevelt, Johnson.'
      tags:
      - name:roosevelt-franklin-d-jr
      - name:johnson-lyndon-b
      src:
        c: 136a474a
        rows:
        - 'w.sundquist-politics-and-policy 103: all'
- add:
    entry:
      id: cal.1963-06.poverty
      when: June
      date: 1963-06
      thread: poverty
      c: After a *Herald Tribune* report that the Republicans plan an antipoverty program, Heller asks Lampman and others
        for "a practical Kennedy anti-poverty program," and sends their first ideas to Kennedy; through Sorensen, word to
        go on.
      n: '[[w.sundquist-politics-and-policy]], 136. Check: the day ("a month later" than Lampman''s analysis of May 1).
        See [[cal.1963-05-01.poverty]]. Names: Heller, Kennedy, Sorensen.'
      tags:
      - name:heller-walter-w
      - name:kennedy-john-f
      - name:sorensen-theodore-c
