      when: May
      date: 1961-05
      thread: jobs-and-wages
      c: 'Washington. The Appalachian governors, nine, meet Feldman for the President before seeing him: a small staff group
        in the Area Redevelopment Administration for Appalachia, with one of the governors''. They organize as the Conference
        of Appalachian Governors.'
      n: '[[w.sundquist-politics-and-policy]], 100. Check: the day. See [[cal.1961-01-01.jobs-and-wages]]. Names: Feldman.'
      tags:
      - name:feldman-myer
      src:
        c: 2d2373ac
        rows:
        - 'w.sundquist-politics-and-policy 100: all'
- add:
    entry:
      id: cal.1963-01.jobs-and-wages
      when: Jan.
      date: 1963-01
      thread: jobs-and-wages
      c: Feldman and Lee White, pressed by the Appalachian governors, summon Batt and his deputy Harold Williams on a regional
        program for Appalachia. Williams drafts proposals, a regional commission among them.
      n: '[[w.sundquist-politics-and-policy]], 101. Check: the day ("the early weeks of 1963"). See [[cal.1961-05.jobs-and-wages]].
        Names: Feldman, Lee White, Batt.'
