- add:
    entry:
      id: cal.1964-01-21.poverty
      when: Jan. 21
      date: '1964-01-21'
      thread: poverty
      c: 'The staff''s outline of the community action program: in each community a single body to coordinate public and
        private efforts; a comprehensive plan, some action meanwhile. Of $500 million, $50 million for planning, $275 million
        for new programs, $173 million to add to federal programs. Wirtz answers it by memorandum: poverty is lack of income;
        begin with jobs.'
      n: '[[w.sundquist-politics-and-policy]], 141. See [[cal.1963-12.poverty]]. Names: Wirtz.'
      tags:
      - name:wirtz-w-willard
      src:
        c: d3cc274b
        rows:
        - 'w.sundquist-politics-and-policy 141: all'
- add:
    entry:
      id: cal.1964-02-02.poverty
      when: Feb. 2
      date: '1964-02-02'
      thread: poverty
      c: Sunday. Shriver, told of his appointment the day before, briefed by Heller and Gordon and their staffs.
      n: '[[w.sundquist-politics-and-policy]], 142. See [[cal.1964-02-01.transition-and-staff]]. Names: Shriver, Heller,
        Gordon.'
      tags:
      - name:shriver-r-sargent
      - name:heller-walter-w
      - name:gordon-kermit
      src:
        c: a371800e
        rows:
        - 'w.sundquist-politics-and-policy 142: all'
- add:
    entry:
      id: cal.1964-02.poverty
      when: Feb.
      date: 1964-02
      thread: poverty
      c: 'A Cabinet meeting. Shriver''s jobs program on the model of the WPA, a tobacco tax to pay for it, refused by Johnson:
        no addition to the budget while taxes are cut.'
      n: '[[w.sundquist-politics-and-policy]], 143–44. Check: the day. See [[cal.1964-02-04.poverty]]. Names: Shriver, Johnson.'
      tags:
      - name:shriver-r-sargent
      - name:johnson-lyndon-b
      src:
        c: 8fbabb2f
        rows:
        - 'w.sundquist-politics-and-policy 143–44: all'
- add:
    entry:
      id: cal.1961-01-17.school-aid
      when: Jan. 17
      date: '1961-01-17'
      thread: school-aid
      c: 'Cardinal Spellman against the President-elect''s task force on education, its aid for public schools only: "unfair,"
        "blatantly discriminating," "unthinkable"; Catholic children "second-class citizens"; "thought control" in compelling
        a child "to attend a state school as a condition for sharing in education funds."'
      n: '[[w.sundquist-politics-and-policy]], 189. To check: Hugh Douglas Price, "Race, Religion, and the Rules Committee:
        The Kennedy Aid-to-Education Bills," in Alan F. Westin, ed., *The Uses of Power* (1962), 22–23 (cited by [[w.sundquist-politics-and-policy]],
        189 n.114). See [[cal.1961-02-20.school-aid]]. Names: Spellman.'
      tags:
      - name:spellman-francis
      - city:nyc
      src:
        c: 5c5753fe
        rows:
        - 'w.sundquist-politics-and-policy 189: all'
        - 'via w.sundquist-politics-and-policy 189 n.114: all'
- add:
    entry:
      id: cal.1961-01.school-aid
      when: Jan.
      date: 1961-01
      thread: school-aid
      also:
      - transition-and-staff
      c: The President-elect's task force on education, Hovde's, endorses the colleges' plan of grants and loans for construction,
        but, pressed by Kennedy's staff, holds the first year to $500 million.
      n: '[[w.sundquist-politics-and-policy]], 202. To check: the recommendations, *Saturday Review*, Jan. 21, 1961, 94–95
        (cited by [[w.sundquist-politics-and-policy]], 202 n.143). Check: the day of the report.'
      src:
        c: aacc7178
        rows:
        - 'w.sundquist-politics-and-policy 202: all'
        - 'via w.sundquist-politics-and-policy 202 n.143: all'
- add:
    entry:
      id: cal.1961-02-22.school-aid
      when: Feb. 22
      date: '1961-02-22'
      thread: school-aid
      c: 'The general board of the National Council of Churches, 38 million members claimed: "We do not . . . consider it
        just or lawful that public funds should be assigned to support the elementary or secondary schools of any church."'
      n: '[[w.sundquist-politics-and-policy]], 189. See [[cal.1961-02-20.school-aid]].'
      src:
        c: 72a834bf
        rows:
        - 'w.sundquist-politics-and-policy 189: all'
- add:
    entry:
      id: cal.1961-02-24.school-aid
      when: Feb. 24
      date: '1961-02-24'
      thread: school-aid
      c: 'The Association of Land-Grant Colleges and State Universities, by circular letter: Kennedy''s college program,
        loans of $300 million and scholarships, shows "little relationship to the basic needs of higher education at this
        juncture in history."'
      n: '[[w.sundquist-politics-and-policy]], 202 & n.144. See [[cal.1961-01.school-aid]].'
      src:
        c: b73994f1
        rows:
        - 'w.sundquist-politics-and-policy 202 & n.144: all'
        - 'via w.sundquist-politics-and-policy 202 n.144: all'
- add:
    entry:
      id: cal.1961-03-01.school-aid
      when: Mar. 1
      date: '1961-03-01'
      thread: school-aid
      c: 'The bishops, the National Catholic Welfare Conference, against any federal aid "which excludes children in private
        schools." Archbishop Alter for them: long-term, low-interest loans to private schools "strictly within the framework
        of the Constitution"; an amendment to that effect proposed.'
      n: '[[w.sundquist-politics-and-policy]], 189. See [[cal.1961-02-20.school-aid]].'
      src:
        c: 1c3f6ebc
        rows:
        - 'w.sundquist-politics-and-policy 189: all'
- add:
    entry:
      id: cal.1961-03-08.school-aid
      when: Mar. 8
      date: '1961-03-08'
      thread: school-aid
      c: 'News conference. Across-the-board loans to nonpublic schools: "by my reading of the constitutional judgments in
        the Everson case, my judgment has been that across the board loans are also unconstitutional." Loans a separate
        matter, not to be tied to the public school bill.'
      n: 'The President''s News Conference, [1961 Pub. Papers 152](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=210)
        (Mar. 8, 1961), 155–56. [[w.sundquist-politics-and-policy]], 190. See [[cal.1961-02-20.school-aid]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: fda1830b
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=210: all'
        - 'w.sundquist-politics-and-policy 190: all'
        - 'via w.sundquist-politics-and-policy 190 n.117: all'
- add:
    entry:
      id: cal.1961-03-16.school-aid
      when: Mar. 16
      date: '1961-03-16'
      thread: school-aid
      c: 'Knoff presents the National Council of Churches'' statement to the House subcommittee: a great majority against
        loans too, "an outright departure from long-cherished principles of separation of church and state"; "what may be
        constitutional may not be wise."'
      n: '[[w.sundquist-politics-and-policy]], 189–90. To check: *Federal Aid to Schools: Hearings before the General Subcommittee
        on Education of the House Education and Labor Committee*, 87th Cong., 1st sess. (Mar. 16, 1961), 392–95 (cited by
        [[w.sundquist-politics-and-policy]], 190 n.116). See [[cal.1961-02-22.school-aid]].'
      src:
        c: 983cbe60
        rows:
        - 'w.sundquist-politics-and-policy 189–90: all'
        - 'via w.sundquist-politics-and-policy 190 n.116: all'
- add:
    entry:
      id: cal.1961-04.school-aid
      when: Mar.–Apr.
      date: 1961-04
      thread: school-aid
      c: 'Ribicoff and Sorensen, through an intermediary, talk with the bishops. The strategy: the public school bill to
        proceed; Congress, not the President, to start loans for private schools as an amendment to the extension of the
        National Defense Education Act.'
      n: '[[w.sundquist-politics-and-policy]], 190. To check: [[w.sorensen-kennedy]], 360 (cited by [[w.sundquist-politics-and-policy]],
        190 n.118). Check: the days. See [[cal.1961-03-08.school-aid]]. Names: Ribicoff, Sorensen.'
      tags:
      - name:ribicoff-abraham
      - name:sorensen-theodore-c
      src:
        c: 844ed62a
        rows:
        - 'w.sundquist-politics-and-policy 190: all'
- add:
    entry:
      id: cal.1961-04-25.school-aid
      when: Apr. 25
      date: '1961-04-25'
      thread: school-aid
      c: 'Kennedy to Congress: draft legislation to extend and expand the National Defense Education Act, most of whose
        programs end June 30, 1962. "It is also appropriate that the Congress consider other proposals contained in these
        and other reports."'
      n: 'Letter to the President of the Senate and to the Speaker of the House on the National Defense Education Act, [1961
        Pub. Papers 318](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=376) (Apr. 25, 1961).
        [[w.sundquist-politics-and-policy]], 191. See [[cal.1961-04.school-aid]]. Names: Kennedy.'
