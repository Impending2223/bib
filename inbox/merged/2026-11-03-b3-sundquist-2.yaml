- add:
    entry:
      id: cal.1962-03.jobs-and-wages
      when: Mar.
      date: 1962-03
      thread: jobs-and-wages
      c: 'Kennedy''s office: Batt, Goldberg and the Budget Bureau on public works for areas of unemployment. Kennedy''s
        mind made up; letters from Meany and from Clark and Blatnik before him. The Bureau low on the amount, Goldberg and
        Batt high; Kennedy with Goldberg on the amount and on all areas of substantial labor surplus. "It was all over in
        about half an hour." By Batt''s account.'
      n: '[[w.sundquist-politics-and-policy]], 95 n.83 (Batt, interview, Dec. 1965). To check: Batt''s testimony, *Public
        Works Acceleration: Hearings before the Senate Public Works Committee*, 87th Cong., 2d sess. (Apr. 13, 1962) (cited
        by [[w.sundquist-politics-and-policy]], 95 n.83). Check: the day. The letter that followed: [[cal.1962-03-26.jobs-and-wages]].
        Names: Batt, Goldberg, Meany, Clark, Blatnik, Kennedy.'
      tags:
      - name:batt-william-l-jr
      - name:goldberg-arthur-j
      - name:meany-george
      - name:clark-joseph-s
      - name:blatnik-john-a
      - name:kennedy-john-f
      src:
        c: b76d3fea
        rows:
        - 'w.sundquist-politics-and-policy 95 n.83: ?'
        - 'via w.sundquist-politics-and-policy 95 n.83a: all'
        - 'via w.sundquist-politics-and-policy 95 n.83b: all'
