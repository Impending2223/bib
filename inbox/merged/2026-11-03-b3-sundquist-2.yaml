# The entries of b3-sundquist-more (Oct. 29), whose file was never written, re-read from the owner's copy (printed page = PDF
# page - 16) and written again, with the rows the earlier run passed over that R11 (the organized interests) and R13 (the
# press) now make entries; Record pages found by govinfo's page tables, the 1966 cites (the daily edition's pages) by day.
