      src:
        c: 89f621e0
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=376: all'
        - 'w.sundquist-politics-and-policy 191: all'
- add:
    entry:
      id: cal.1962-06-16.school-aid
      when: June 16
      date: '1962-06-16'
      thread: school-aid
      c: The National Congress of Parents and Teachers, the National School Boards Association, the American Association
        of School Administrators, the American Vocational Association and the Council of Chief State School Officers tell
        members of Congress they oppose the House college bill, its grants to Catholic colleges among them.
      n: '[[w.sundquist-politics-and-policy]], 204. To check: *Congressional Quarterly Almanac*, 1962, 235 (cited by [[w.sundquist-politics-and-policy]],
        204 n.149).'
      src:
        c: 9e024e6e
        rows:
        - 'w.sundquist-politics-and-policy 204: all'
        - 'via w.sundquist-politics-and-policy 204 n.149: all'
- edit:
    id: cal.1963-08-14.school-aid
    base: e8be724d
    set:
      c: 'House passes the college facilities bill, grants and loans of $1.195 billion over three years, [287–113](https://voteview.com/rollcall/RH0880060).
        Frelinghuysen on Kennedy''s loans: "his advisers failed to read the testimony of experts before our committee."
