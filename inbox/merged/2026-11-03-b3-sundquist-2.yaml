by: 'Claude (batch 3 reading run, greatsociety group: Sundquist, Politics and Policy), Nov. 4, 2026'
ops:
- add:
    entry:
      id: cal.1961-06-08.economy
      when: June 8
      date: '1961-06-08'
      thread: economy
      also:
      - congress
      c: 'Mills opens the House debate on the tax rate extension bill, H.R. 7446. A tax cut must wait for a surplus, as
        George Humphrey told Ways and Means: "the time to reduce taxes as such is when you can foresee a surplus out of
        which those tax reductions can be made; and that you do not as a general principle reduce taxes in order to increase
        deficit spending."'
      n: 'Mills, [107 Cong. Rec. 9778](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-1-1.pdf#page=10)
        (June 8, 1961). [[w.sundquist-politics-and-policy]], 42. Names: Mills, Humphrey.'
      tags:
      - name:mills-wilbur-d
      - name:humphrey-george-m
      src:
        c: d1e77b0e
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-1-1.pdf#page=10: all'
        - 'w.sundquist-politics-and-policy 42: all'
        - 'via w.sundquist-politics-and-policy 42 n.92: all'
- add:
    entry:
      id: cal.1962-06-06.economy-2
      when: June 6
      date: '1962-06-06'
      thread: economy
      also:
      - republican-party-congress
      c: 'Morton in the Senate: with a tax cut promised for 1963, the administration should lay aside the tax bill before
        the Finance Committee. Carlson agrees: "We need a reduction in Federal spending and at the same time a reduction
        in taxes."'
      n: 'Morton, Carlson, [108 Cong. Rec. 9847](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt7/pdf/GPO-CRECB-1962-pt7-13-2.pdf#page=18)
        (June 6, 1962). [[w.sundquist-politics-and-policy]], 43 n.94 (Carlson). Names: Morton, Carlson.'
      tags:
      - name:morton-thruston-b
      - name:carlson-frank
      src:
        c: 8f2dc9ef
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt7/pdf/GPO-CRECB-1962-pt7-13-2.pdf#page=18: all'
        - 'w.sundquist-politics-and-policy 43 n.94: B'
        - 'via x.1962-06-06.carlson-cong-record-vol-108-june: B'
- add:
    entry:
      id: cal.1962-06-14.economy
      when: June 14
      date: '1962-06-14'
      thread: economy
      also:
      - republican-party-congress
      c: 'Capehart in the Senate: cut taxes $10 billion and spending $15 billion before the session ends. "The administration
        has proposed a tax cut only. But any reduction in income without a corresponding reduction in expenditures is unrealistic."'
      n: 'Capehart, [108 Cong. Rec. 10539](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt8/pdf/GPO-CRECB-1962-pt8-4-2.pdf#page=11)
        (June 14, 1962). [[w.sundquist-politics-and-policy]], 43 n.94. Names: Capehart.'
      tags:
      - name:capehart-homer-e
      src:
        c: ef0e6868
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt8/pdf/GPO-CRECB-1962-pt8-4-2.pdf#page=11: all'
        - 'w.sundquist-politics-and-policy 43 n.94: all'
        - 'via x.1962-06-14.capehart-ibid-june-14-1962-p: all'
