      thread: king
      c: 'Atlanta, Ebenezer. King preaches "Unfulfilled Dreams," on David and the temple: "I want you to know this morning
        that I am a sinner like all of God''s children."'
      n: '[[w.branch-at-canaans-edge]], 707. To check: MLK sermon at Ebenezer Baptist Church, March 3, 1968, A/KS (cited by
        [[w.branch-at-canaans-edge]], 707); Carson and Holloran, eds., Knock, p. 191 ff. "You did well that it was in your
        heart": I Kings 8:18 (cited by [[w.branch-at-canaans-edge]], 707). Names: King.'
