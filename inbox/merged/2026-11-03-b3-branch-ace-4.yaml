      thread: king-memphis
      c: 'Memphis, the federal district court, *City of Memphis v. King*, Judge Bailey Brown. Holloman, director of fire and
        police: King cannot control a march. Lawson: "There will be no sticks in any march." Young on nonviolence. About 5
        p.m., Eskridge to King: the judge will let SCLC lead the march on Monday, its route, no weapons, narrow ranks.'
      n: '[[w.branch-at-canaans-edge]], 759–64. To check: the transcript of the hearing, *City of Memphis v. King*, No. C-68-80
        (W.D. Tenn. Apr. 4, 1968), Holloman''s testimony, 81–84, 94–95, Young''s, 192, 205 (cited by [[w.branch-at-canaans-edge]],
        759–62); [[w.beifuss-at-the-river-i]], 272, 284–85 (cited by [[w.branch-at-canaans-edge]], 759); Testimony of Frank
        C. Holloman in City of Memphis v. Martin Luther King, Jr. et al., U.S. District Court for the Western District of
        Tennessee, Case No. C-68-80, April 4, 1968, p. 58, transcript courtesy of Charles F. Newman (cited by [[w.branch-at-canaans-edge]],
        759); Remarks of the court and testimony of ChiefJ.C. MacDonald, in ibid., pp. 81-84, 94-95 (cited by [[w.branch-at-canaans-edge]],
        759); Frank, *An American Death* (1972), 72 (cited by [[w.branch-at-canaans-edge]], 759); Testimony of James Lawson
        in City ofMemphis v. Martin Luther King, Jr. et al., U.S. District Court for the Western District of Tennessee, Case
        No. C-68-80, April 4, 1968, pp. 146, 166, transcript courtesy of Charles F Newman (cited by [[w.branch-at-canaans-edge]],
        760); Testimony of Andrew Young in City ofMemphis v. Martin Luther King, Jr. et al., U.S. District Court for the Western
        District of Tennessee, Case No. C-68-80, April 4, 1968, pp. 168-207, transcript courtesy of Charles F. Newman (cited
        by [[w.branch-at-canaans-edge]], 762); [[w.young-easy-burden]], 463–64 (cited by [[w.branch-at-canaans-edge]], 764);
        Blackside, Inc., Eyes on the Prize I]—America at the Racial Crossroads, 1965 to 1985, Vol. IV, "The Promised Land
        (1967-68)" (cited by [[w.branch-at-canaans-edge]], 764); Citizen King, a Roja Production for The American Experience,
        PBS, 2004 (cited by [[w.branch-at-canaans-edge]], 764); [[w.garrow-bearing-the-cross]], 622–23 (cited by [[w.branch-at-canaans-edge]],
        764); [[w.posner-killing-the-dream]], 23–24 (cited by [[w.branch-at-canaans-edge]], 764); Kotz, Judgment, pests (cited
