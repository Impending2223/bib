      when: Mar. 5
      date: '1968-03-05'
      thread: king-memphis
      c: 'Memphis, City Hall, the first planned sit-in: Maxine Smith of the NAACP, several preachers and more than a hundred
        sanitation workers arrested. Lawson to reporters: he has invited King.'
      n: '[[w.branch-at-canaans-edge]], 707. To check: [[w.beifuss-at-the-river-i]], 156–59 (cited by [[w.branch-at-canaans-edge]],
        707); [[w.beifuss-at-the-river-i]], 15659 (cited by [[w.branch-at-canaans-edge]], 707); Maxine Smith oral history,
        June 13, 1968, pp. 1-16, MVC. he had invited King to Memphis: News script, Memphis WMC-TV Channel Five, March 5, 1968,
        MVC. The newscast reported that King''s Atlanta office said he was leaving the country until Saturday (cited by [[w.branch-at-canaans-edge]],
        707). Names: Lawson.'
      tags:
