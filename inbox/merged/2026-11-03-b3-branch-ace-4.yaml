- add:
    entry:
      id: cal.1968-03-14.king
      when: Mar. 14
      date: '1968-03-14'
      thread: king
      c: 'Grosse Pointe, Mich., nearly three thousand. Pickets inside: "Commie!" "Traitor!" That day Johnson, on Watson''s
        summary of the FBI''s new monograph on King, with SCLC''s contributors, the Labor Department''s $61,000 among them:
        "Show this to Bill Wirtz."'
      n: '[[w.branch-at-canaans-edge]], 709, 717. To check: Johnson''s note on Watson''s summary, Mar. 14, 1968, with Hoover
        to Stegall and "Martin Luther King, Jr.—A Current Analysis," Mar. 12, 1968, Office Files of Mildred Stegall, LBJ Library
        (cited by [[w.branch-at-canaans-edge]], 709); LBJ handwritten note on March 14, 1968 summary [by Marvin Watson], with
        Hoover note to Mildred Stegall and attached "Martin Luther King, Jr—A Current Analysis," March 12, 1968, Box 32, OFMS,
        LBJ (cited by [[w.branch-at-canaans-edge]], 709); [[w.garrow-bearing-the-cross]], 601 (cited by [[w.branch-at-canaans-edge]],
        717); Detroit LHM dated March 15, 1968, FK-3239: WP, March 16, 1968, p. 6 (cited by [[w.branch-at-canaans-edge]],
        717). Names: King, Johnson, Wirtz.'
      tags:
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      - name:wirtz-w-willard
      src:
        c: 9dc54e39
        rows:
        - 'w.branch-at-canaans-edge 709, 717: all'
        - 'via x.1968-03-14.lbj-handwritten-note-on-march-14: all'
        - 'via x.1968-03-15.detroit-lhm-dated-march-15-1968: all'
- add:
    entry:
      id: cal.1968-03-16.king
      when: Mar. 16
      date: '1968-03-16'
      thread: king
      also:
      - elections-1968
      c: 'Anaheim, Cal., the Disneyland Hotel. King to the California Democratic Council, which has endorsed McCarthy: no
        candidate named. "The government is emotionally committed to the war. It is emotionally hostile to the needs of the
        poor." The night before, Burke Marshall for Robert Kennedy: no commitments until they talk.'
      n: '[[w.branch-at-canaans-edge]], 717. To check: [[w.schlesinger-thousand-days-1965]], 930 (cited by [[w.branch-at-canaans-edge]],
        717); wiretap transcript of telephone call between Stanley Levison and Harry Wachtel, 11:58 a.m., March 19, 1968,
        FLNY-9-11614a (cited by [[w.branch-at-canaans-edge]], 717); Burke Marshall oral history by T. H. Baker, Aug. 14, 1983
        (cited by [[w.branch-at-canaans-edge]], 717); Int. Burke Marshall, Sept. 26, 1984 (Branch) (cited by [[w.branch-at-canaans-edge]],
        717); SAC, Los Angeles, to Director, March 16, 1968, FK-3235 (cited by [[w.branch-at-canaans-edge]], 717); MLK speech
        to California Democratic Council, March 16, 1968, A/KS (cited by [[w.branch-at-canaans-edge]], 717). Names: King,
        McCarthy, Marshall, Robert Kennedy.'
      tags:
      - name:king-martin-luther-jr
      - name:mccarthy-eugene-j
      - name:marshall-burke
      - name:kennedy-robert-f
      src:
