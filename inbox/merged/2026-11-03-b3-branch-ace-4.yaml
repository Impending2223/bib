      when: Mar. 14
      date: '1968-03-14'
      thread: king-poor-peoples
      c: 'Atlanta, Paschal''s Motor Lodge, closed to the press. King with seventy-eight leaders of "non-black" minorities
        and the white poor: Iroquois, plains and Anishinabe delegates, Hank Adams, an aide of Chavez, Tijerina, Corky Gonzalez,
        Peggy Terry, Appalachian miners. Tijerina: the Indians first in Washington, the Negroes second, the Spanish-speaking
        last.'
      n: '[[w.branch-at-canaans-edge]], 715–17. To check: [[w.fairclough-to-redeem-the-soul]], 369 (cited by [[w.branch-at-canaans-edge]],
        717); New York Times, March 15, 1968, p. 36 (cited by [[w.branch-at-canaans-edge]], 715); [[w.garrow-bearing-the-cross]],
        601 (cited by [[w.branch-at-canaans-edge]], 715); [[w.greenberg-crusaders-in-the-courts]], 431–32 (cited by [[w.branch-at-canaans-edge]],
        715); George A. Wiley to Andrew Young, March 25, 1968, A/SC40f3 (cited by [[w.branch-at-canaans-edge]], 715); Int.
        Bernard Lafayette, May 28, 1990 (Branch) (cited by [[w.branch-at-canaans-edge]], 715); Int. William Rutherford, Dec.
        7, 2004 (Branch) (cited by [[w.branch-at-canaans-edge]], 715); Int. Tom Houck, June 23, 2005 (Branch) (cited by [[w.branch-at-canaans-edge]],
        715); Int. Bernard Lafayette, March 22, 2005 (Branch) (cited by [[w.branch-at-canaans-edge]], 716); Peggy Terry oral
        history by Studs Terkel, 1990, "Conversations with America," http://www.studsterkel.org/race.php (cited by [[w.branch-at-canaans-edge]],
        716); Int. Tom Houck, July 12, 2005 (Branch) (cited by [[w.branch-at-canaans-edge]], 716); Int. Vincent Harding, Dec.
        30, 2004 (Branch) (cited by [[w.branch-at-canaans-edge]], 716); Tiyerina, They Called Me, pp. L01-4 (cited by [[w.branch-at-canaans-edge]],
        717); [[w.fairclough-to-redeem-the-soul]], 369 (cited by [[w.branch-at-canaans-edge]], 717). Names: King, Chavez,
        Tijerina.'
