        range_basis: record
        n: 'Kennedy''s speech, [113 Cong. Rec. 5279–84](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-6-2.pdf#page=58) (1967) (Senate, Mar. 2, 1967). Letter to Senator Jackson Concerning the Bombing of North Vietnam, [1967 Pub. Papers 267](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=335) (released Mar. 2, 1967); The President''s News Conference, [1967 Pub. Papers 259](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=327) (Mar. 2, 1967). FRUS 1964–68, V, docs. [95](https://history.state.gov/historicaldocuments/frus1964-68v05/d95), [96](https://history.state.gov/historicaldocuments/frus1964-68v05/d96) (Johnson with Jackson and Russell, Mar. 2), [105](https://history.state.gov/historicaldocuments/frus1964-68v05/d105) (Rostow on McNamara''s view of the proposal, Mar. 10). [[w.palermo-in-his-own-right]], 45–51 (the drafts; the speech at 3:40 p.m., some twenty Senators listening; the proposals; Jackson handing out Johnson''s letter during it; Johnson''s news conference and speeches that day; Rusk''s words, not their day); [[w.shesol-mutual-contempt]], 371–74 (the speech; Johnson''s day of Mar. 2, the press conference among it); [[w.thomas-robert-kennedy]], 334–35 (the speech; Johnson''s day: two speeches, a news conference on arms talks); [[w.califano-triumph-and-tragedy-of]], 296 (Johnson "furious"); [[w.branch-at-canaans-edge]], 583–84 ("It is our chemicals that scorch the children"; Johnson at Howard, a news conference, a grandchild; Russell: "I have some misgivings about getting into a debate with the little piss-ant"; Nixon: "prolonging the war"). Made public: the telephone conversations, FRUS 1964–68, V (2002). [[w.schlesinger-robert-kennedy-and-his]], 772–73 (the bombing halt and talks within the week; Jackson and the letter; the news conference); [[w.gibbons-u-s-government-and]], IV, 593–94 (the speech, not the talks'' length; Rusk; not the letter or the news conference). [[w.mann-grand-delusion]], 533–35. [Daily Digest, D76](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=74) (the Senate met at noon, its standing order''s hour, D3; adjourned at 6:32 p.m.). To check: [*New York Times*, Mar. 4, 1967](https://timesmachine.nytimes.com/timesmachine/1967/03/04/issue.html) (cited by [[w.gibbons-u-s-government-and]], IV, 594 n.103, for Rusk); *Newsweek*, Mar. 13, 1967, 34 (cited by [[w.palermo-in-his-own-right]], 50 n.94); "Kennedy Asks Suspension of U.S. Air Raids on North (cited by [[w.branch-at-canaans-edge]], 583); Administration Unmoved," NYT, March 3, 1967, p. 1 (cited by [[w.branch-at-canaans-edge]], 583); [[w.schlesinger-thousand-days-1965]], 828–33 (cited by [[w.branch-at-canaans-edge]], 583); Roy Reed, "Johnson Affirms His Commitment to Helping Negro," NYT, March 3, 1967, pale Richard Russell promised: LB] phone call with Richard Russell, 3:15 p.am., March 2, 1967, PNO 5, Audiotape WHF67.08, LBJ, in FRUS, Vol. 5, pp. 221–25 (cited by [[w.branch-at-canaans-edge]], 583); Russo, *Live by the Sword* (1998), 400–402 (cited by [[w.branch-at-canaans-edge]], 583); Russo, *Live by the Sword* (1998), 403 (cited by [[w.branch-at-canaans-edge]], 583). See [[cal.1966-02-19.vietnam]]. Names: Robert Kennedy, Rusk, Johnson, Jackson.'
