- edit:
    id: cal.1961-04-08.cuba
    base: 2206d1e8
    set:
      n: '[[w.schlesinger-thousand-days-1965]], 271; [[w.bissell-reflections-of-a-cold]], 183 (the CIA''s briefing, Apr. 8: the invasion, not the American part in it); [[w.schlesinger-journals]], 110 (Saturday, Apr. 8: Schlesinger at the U.S. Delegation to the UN in New York; Stevenson "wholly disapproves of the project, objects to the fact that he was given no opportunity to comment on it, and believes it will cause infinite trouble," but is "substantially the good soldier about it and is prepared to try and make the best possible U.S. case"; the page does not mention Barnes, a briefing or Stevenson''s leaving it thinking nothing would happen); [[w.salinger-with-kennedy]], 147 (on the Saturday a week before the invasion Schlesinger and a top CIA operative go to New York and give Stevenson a partial briefing; Stevenson: "I was never told the full extent of the plan"; not Barnes by name or the debate). Made public: [[w.schlesinger-thousand-days-1965]] (1965). After [[cal.1961-04-08.cuba-2|the call on Rusk]]: "I then took a plane to New York," in Schlesinger''s journal (110). See [[cal.1961-04-05.cuba]]. Names: Barnes, Schlesinger, Stevenson.'
- edit:
    id: cal.1961-04-20.cuba-bay-of-pigs
    base: e48caf1a
    set:
      n: '[[w.schlesinger-thousand-days-1965]], 336–37 (Nixon''s account, as Schlesinger quotes it); [[w.nixon-rn]], 233–35; [[w.nixon-six-crises]], xi (the visit, in April, Nixon''s first to Kennedy since the inauguration; Kennedy on a public man''s writing a book); [[w.sorensen-kennedy]], 308 (Thursday morning, Kennedy planning talks with every Republican leader, to guard national unity); [[w.wofford-of-kennedys-and-kings]], 352 (Thursday, Apr. 20, Kennedy asks Nixon to the White House: "What would you do now in Cuba?" Nixon: "I would find proper legal cover, and I would go in"; Kennedy fears Khrushchev will move on Berlin; not Laos). [[w.reeves-president-kennedy]], 99–100 (Nixon for going in). [[w.nixon-six-crises]], 406 n.12 (Kennedy asks Nixon to the White House after the Cuban defeat). Made public: Nixon, *Reader''s Digest*, Nov. 1964. Check: *Six Crises*''s introduction (xi) puts the visit in April, the first since the inauguration. To check: Richard M. Nixon, "Cuba, Castro and John F. Kennedy," *Reader''s Digest*, Nov. 1964 (cited by [[w.schlesinger-thousand-days-1965]], 337 n.). After [[cal.1961-04-20.cuba|the address]]: the news conference of Apr. 21 has the statement on Cuba "yesterday afternoon" and the talk with Nixon "last night" ([1961 Pub. Papers 307](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=365), items 1, 5). See [[cal.1961-03-29.cuba]]. Names: Nixon, Kennedy. Check: *Six Crises*, 406 n.12, puts it in May. Check: Reeves puts the talk the afternoon of the meeting with the Revolutionary Council, Apr. 19 (99).'
- edit:
    id: cal.1961-04-21.cuba-bay-of-pigs-4
    base: e6a1ca91
    set:
      n: '[[w.schlesinger-journals]], 118. After [[cal.1961-04-21.cuba-bay-of-pigs-3|the breakfast]]: "Later in the day," in Schlesinger''s journal (118). Made public: [[w.schlesinger-journals]] (2007). Names: Johnson, Schlesinger, Dulles, Bissell.'
