- cite:
    id: cal.1960-10-02.china-leadership-5
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1581–1582 (Oct. 2, 1960; 4 to 7:25 p.m., Deng with Sharkey and Dixon: the trouble is the draft''s second part, on socialism, the Twentieth and Twenty-first Congresses made binding, the father-and-son relation legalized; great-power chauvinism the main danger, open to two countries only, the Soviet Union and China; 7:30 to 9:35, Deng''s second talk with Kapo: to "lift the lid", break superstition, attack the baton; reasoned, not personal)'
- cite:
    id: cal.1960-10-03.china-leadership-8
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1582–1583 (Oct. 3, 1960; afternoon; Deng at the Soviet dinner: the draft has much that is good, some wording unclear (two possibilities of war and peace, the two hands in transition), some not understood (national communism, going it alone, factions); principles in the plenary, details to the secretariat)'
- cite:
    id: cal.1960-10-04.china-leadership-7
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1583 (Oct. 4, 1960; morning; Deng with Ghosh of the Indian party on the Sino-Soviet differences)'
- cite:
    id: cal.1960-10-04.china-leadership-9
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1583 (Oct. 4, 1960; evening; on the Center''s instruction to refute the draft''s errors and then offer counter-texts, Deng chairs the delegation at the embassy: his speech for the next day already in the Center''s spirit, left as it is but for words; counter-texts to the secretariat)'
- cite:
    id: cal.1960-10-05.china-leadership-5
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1583–1584 (Oct. 5, 1960; afternoon; Deng speaks at the third session on war and peace, peaceful transition, revisionism and dogmatism, the forms of socialist construction and unity: both roads, the stress on gathering revolutionary strength; revisionism "smashed in thought" wholly wrong; every party''s contribution; the "collective experience" aimed at China''s line; national communism, going it alone and factions aimed at the Chinese party)'
- cite:
    id: cal.1960-10-05.china-leadership-6
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1584 (Oct. 5, 1960; evening; Deng with Escalante, executive secretary of the Cuban Popular Socialist Party: relations can get no worse; the two parties will not split; the Soviet Union always at the head, criticism not barred; a common paper there will be)'
- cite:
    id: cal.1960-10-06.china-leadership-7
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1584–1585 (Oct. 6, 1960; 7:15 to 8:15 p.m.; Deng''s third talk with Kapo: a second speech planned on the epoch, war and peace, unity)'
- cite:
    id: cal.1960-10-06.china-leadership-8
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1585 (Oct. 6, 1960; 9:30 p.m. (晚九时三十分); the Chinese Embassy; Deng receives Miyamoto Kenji, general secretary of the Japanese Communist Party: relations very bad since Bucharest, none of it China''s doing; without criticism the CPSU''s errors will have grave results; if the Chinese party does not criticize, few others can)'
    units: B
