    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1580–1581 (Oct. 1, 1960; 1 p.m.; Deng at the first session: the paper must give the enemy no handle; views exchanged fully and calmly)'
- cite:
    id: cal.1960-10-01.china-leadership-7
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1581 (Oct. 1, 1960; 3:40 to 7:40 p.m., the Chinese Embassy; Deng''s first talk with Hysni Kapo, head of the Albanian delegation, on the September talks: China cannot be crushed, nor by a majority; no trading of principle; a big argument ahead; the statement likely bad but passable)'
- cite:
    id: cal.1960-10-02.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1581 (Oct. 2, 1960; 10 a.m.; Deng with Lê Duẩn: the Soviet draft analysed; the father-and-son relation, national communism, revisionism and dogmatism, equality among parties; the paper''s views very vague; discussion within its bounds)'
