- cite:
    id: cal.1962-07-11.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1715–1716 (July 11–13, 1962; Deng, with Zhou, Lin Biao and Peng Zhen, hears Sun Zhiyuan, Zhang Liankui and Wang Bingzhang (footnote 2: Sun, deputy director of the Defense Industry Office and Minister of the Third Machine-Building Ministry; Zhang, Vice-Minister; Wang, head of the Fifth Academy) on defense industry. July 11, Deng: plants'' nature and tasks fixed and kept; the Seventy Articles, the director in charge, a secretary and a deputy only, the chief engineer on the committee, his signature not to be replaced; accountants and inspectors backed; central plants under their ministries. July 13: scientists left to their work, even alone with a few apprentices; generalists in technical organization a specialty too)'
