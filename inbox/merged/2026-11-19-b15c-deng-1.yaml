    id: cal.1960-10-07.china-leadership-6
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1585 (Oct. 7, 1960; morning; Deng with the Cuban delegation, which proposes that the two parties go on talking)'
- cite:
    id: cal.1960-10-07.china-leadership-8
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1585 (Oct. 7, 1960; 7:30 p.m. to midnight; Deng with Guyot of the French Politburo and Feuer 斐盖尔 of its secretariat: Khrushchev leads the attack and China may not answer, not to be borne; the Soviet Union at the head, no diplomatic phrase, but it must act the part; if China is proved wrong it will say so)'
