    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1657 (Aug. 31, 1961; afternoon; Deng: the former plans mostly no plans; industrial output and building half paralysed; the eight characters centered on readjustment, two or three years, a new balance; only a retreat far enough allows readjustment)'
