    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1612–1613 (Jan. 14–18, 1961; Deng attends; his report on the Moscow meeting and Li Fuchun''s on the 1960 plan and the 1961 targets adopted; "readjustment, consolidation, filling out and raising standards"; agriculture the base; capital construction cut; the twelve articles carried through; the six regional bureaus approved. Deng''s report, the 14th: the meeting unprecedented in size, length and sharpness; the paper on the whole good and revolutionary; the lid lifted; "unanimity through consultation" established; the struggle paused, not ended)'
