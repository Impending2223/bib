    id: cal.1961-10-25.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1666–1667 (Oct. 25, 1961; morning; Deng presides; Zhang Ziyi on training cadres in rotation and Zhang Qilong on the organization work forum; the draft directive on socialist education in the villages. Deng: imported grain makes no country rich; foreign exchange almost all on grain; the disaster areas to save themselves, good areas to sell more; socialist education is communist education; collectivism always preached; order and education not to wait for fuller markets)'
