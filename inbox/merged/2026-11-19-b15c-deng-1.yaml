      when: Mar. 19
      date: '1961-03-19'
      thread: china-leadership
      c: 'Canton 广州. Deng Xiaoping 邓小平 at the Central-South and North China groups of the Central Work Conference: careful work after the victory; in 1956, the high tide, heads not cool; since 1958 careless; capitalist trade and handicrafts reformed too fast; the communes ill gauged in size; faults from the Center down, the Center chiefly to blame; a self-criticism of the Secretariat''s work.'
      place: canton
