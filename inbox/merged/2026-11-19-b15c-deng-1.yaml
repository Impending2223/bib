    id: cal.1960-10-27.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1591 (Oct. 27, 1960; afternoon; Deng''s report approved, the delegation''s work commended; Liu Shaoqi to lead, Deng his deputy, the Party and government delegation to the Moscow meeting in November; members Peng Zhen, Li Jingquan, Lu Dingyi, Kang Sheng, Yang Shangkun, Hu Qiaomu, Liu Xiao, Liao Chengzhi, Liu Ningyi)'
