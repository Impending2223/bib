    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1663 (Oct. 15, 1961; morning; Deng, with Liu Shaoqi, Zhu De, Lin Biao and others, sees off at the airport the delegation Zhou leads to the Twenty-second Congress)'
- cite:
    id: cal.1961-10-17.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1663 (Oct. 17, 1961; morning; Deng presides. On the seven-year plan: farming, light, heavy industry in that order; steel held to 30 million tons, full in kinds; fertilizer and irrigation; non-staple food with its own cadres and accounts; housing. On the Youth League: tasks the mass of youth can do; invention for the few; discipline, study, good character; communist style, working without counting pay, always to be praised, not the "communist wind")'
    units: B
- cite:
    id: cal.1961-10-18.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1664 (Oct. 18, 1961; evening; Deng and Liu call those concerned on the delegation''s revised speech, Deng adding: disputes between brother parties and countries to be settled patiently, in the spirit of internationalism, by equality and consultation; one-sided public censure of a brother party no help to unity; disputes bared before the enemy "pain our friends and please our foes"; settled, taken to Mao, cabled to the delegation, which had proposed answering Khrushchev''s open charges against Albania)'
- cite:
    id: cal.1961-10-19.china-leadership-5
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1664 (Oct. 19, 1961; morning; Deng presides; Li Jiebo (footnote 1: then vice-chairman of the All-China Federation of Trade Unions) on the unions. Deng: the unions to see to livelihood, a grave matter for seven or eight years, ten; vegetables by collective ownership and own accounts; no campaigns in stopped plants, study instead; working-class leadership talked up)'
- cite:
    id: cal.1961-10-19.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1664–1665 (Oct. 19, 1961; Deng at Mao''s Standing Committee: an enlarged Politburo to hear the Center''s line on the Twenty-second Congress and support for the Albanian party; Khrushchev''s report printed in summary only)'
- cite:
    id: cal.1961-10-20.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1665 (Oct. 20, 1961; afternoon; Deng tells the enlarged Politburo of the delegation and the Standing Committee''s line: to isolate the People''s Republic and the Chinese party Khrushchev''s settled course; his abuse of Albania aimed at China; "we will not attack unless attacked; if attacked, we will surely counterattack")'
- cite:
    id: cal.1961-10-23.china-leadership-5
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1665–1666 (Oct. 23, 1961; afternoon; Deng receives all those at the Youth League''s central work conference and speaks: things better than expected; the three red banners right, but readjustment a year late and no set of concrete policies; self-reliance; the League''s two kinds of work; fine, careful, steady work, not only the lively forms; the social climate to be adjusted too; communist ideals; "poor in means, not in will"; its main part printed in *Deng Xiaoping wenxuan*, vol. 1, as "Promote deep and careful work")'
- to-check: {id: cal.1961-10-23.china-leadership-5, add: 'Deng Xiaoping, "Promote deep and careful work" 《提倡深入细致的工作》, the main part of this speech, in [[w.xiaoping-deng-xiaoping-wenxuan-1938]] (the nianpu''s vol. 1; cited by [[w.deng-xiaoping-nianpu-1904]], III, 1666)'}
- cite:
    id: cal.1961-10-24.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1666 (Oct. 24, 1961; morning; Deng presides; the drafting of the seven-year plan set going; Luo Yuchuan (footnote 1: then Vice-Minister of Forestry) on forestry. Deng: the Standing Committee wants farming, light, heavy industry in order, but in the end heavy industry is needed; food, clothing and use at the center)'
- cite:
    id: cal.1961-10-24.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1666 (Oct. 24, 1961; noon; Deng, with Mao, Liu and Zhu De, meets Zhou at the airport, back early from the Twenty-second Congress; then at the Politburo and Secretariat hearing Zhou on the congress and his talks with Khrushchev; Peng Zhen acting head of the delegation)'
