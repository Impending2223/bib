      also: [farm]
      c: 'Miyun 密云, near Peking 北京. Deng Xiaoping 邓小平 and Peng Zhen 彭真 on an inquiry; Deng to the local cadres: the county lives by its hills, trees and fruit to be grown fast; four levels of ownership, the state, brigade, team and the member, who may hold a hill of his own, untaxed, forever; plans for walnuts and chestnuts; fish in the Miyun reservoir; soil kept; no burning of hills to clear land.'
      place: miyun
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1635 (May 10, 1961). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Peng Zhen.'
