- cite:
    id: cal.1961-12-21.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1678–1679 (Dec. 21, 1961; Deng chairs the plenary and speaks on the agenda, the world, home affairs, the long plan, the 1962 plan and the Party: good done the base, errors too, the Center first, the provinces second; the Secretariat''s errors, no timely concrete policies, high and shifting targets, the "great drives", too much decentralization; the seven-to-ten-year plan centered on food, clothing and use, one national economic system; resolve, discipline, unified leadership, the whole, truth from facts, the mass line, strict Party life)'
