- add:
    entry:
      id: cal.1960-03-25.china-leadership-10
      when: Mar. 25
      date: '1960-03-25'
      thread: china-leadership
      c: 'Tianjin 天津. Deng Xiaoping 邓小平 chairs the plenary of the Tianjin meeting on Mao''s seventeen questions. Urban communes: the city''s wage system, a policy needed; reports in the press to be true to fact. Mao Zedong Thought 毛泽东思想 vulgarized; Marxism–Leninism little spoken of; the two not to be split; Mao the representative of the collective leadership, a member of it. Trusts: faster growth and full use.'
      place: tianjin
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1535–1536 (Mar. 25, 1960). The words: 上午 (III, 1535). Deng: 不要庸俗化 (III, 1535); 应该把毛泽东同志看作是党的集体领导中的一个成员 (III, 1535). Made public: in part, [[w.xiaoping-deng-xiaoping-wenxuan-1938]] (1989); the rest, 2009 (the nianpu). To check: Deng Xiaoping, "Correctly propagate Mao Zedong Thought" 《正确地宣传毛泽东思想》, part of this speech, in [[w.xiaoping-deng-xiaoping-wenxuan-1938]] (the nianpu''s vol. 1; cited by [[w.deng-xiaoping-nianpu-1904]], III, 1536). Names: Deng Xiaoping, Mao Zedong.'
      src:
