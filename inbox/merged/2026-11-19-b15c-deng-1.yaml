    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1669–1670 (Nov. 6, 7, 8 and 10, 1961; Deng at the bureaus'' first secretaries'' meeting, Liu presiding. Nov. 7: all regions favor accounting at the small team and full contracts for deliveries; the forms varied; the brigade''s role to be studied, the state cannot deal with 4.6 million teams without it; 86 billion jin a year to the state the minimum. Nov. 10: no bargaining over this year''s purchase; the fear of being an honest man; 82 billion jin for next year, no lower; agrees to Tao Zhu''s proposal to bring all prefectural secretaries to Peking)'
