    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1712–1713 (July 2, 1962; afternoon; Deng presides; rehabilitation, the Youth League, farming. Deng: no details in files, the whole history and the key points; files simplified. Farming: many ask to divide the land; Chen Yun''s inquiry; farming alone does best now; "yellow cat or black cat", whichever restores fastest in the transition; output by household studied in earnest; the masses have reasons; many forms; retreat enough to advance. To Peng Zhen''s call to end the talk of difficulties: "I lean to that")'
