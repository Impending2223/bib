    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1586 (Oct. 10, 1960; morning; Deng''s written statement at the seventh session, twelve questions: the epoch; war, peace and peaceful coexistence; imperialism a paper tiger; people''s and national liberation wars; "a world without arms and war"; unity; the two parties'' differences; "going it alone" and "national communism"; great-power chauvinism; responsibility; the Soviet Union at the head and the CPSU the center; revisionism and dogmatism)'
