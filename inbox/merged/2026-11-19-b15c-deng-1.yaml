    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1563–1564 (July 4, 1960; morning; Deng presides at the enlarged Secretariat, the Party group secretaries of the central ministries present, on the latest in the differences. Deng: since the summit further apart, above all at Bucharest; Khrushchev calls Lenin outdated; not "one finger"; the Center will not "set its watch"; Soviet aid squeezed, experts withdrawn early; in the worst case subversion, no advanced techniques, a front with imperialism; China not afraid: a system unafraid of atomic war, strategic systems in each region, industry spread, 240 million militia, grain self-sufficient everywhere)'
