- cite:
    id: cal.1961-09-05.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1657–1658 (Sept. 5, 1961; morning; Deng chairs the plenary and speaks: the three red banners right, but heads too hot, the laws of socialist construction broken, retreat forced; the aims by 1963, no grain imports in a middling year, 20 million dan of cotton, 8–10 chi of cloth a head, 290–300 million tons of coal, 10 million tons of good steel, two thirds of industry working, steady prices; key points, battles of annihilation, coal first; retreat enough, to the line of survival; power centralized in the Center and the bureaus for two or three years, with room below; true speech, responsibility in hard times; first results in three years, great in seven. The speech the conference''s summing-up)'
