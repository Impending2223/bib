- cite:
    id: cal.1961-03-07.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1620–1621 (Mar. 7, 1961; afternoon; Deng presides, Zhou and Chen Yun attend, and relays Mao at Canton: regulations fixing the powers of commune, brigade and team, against transfers and blind command; communes made smaller after spring sowing where possible (Mao had talked with Zhang Pinghua, footnote 1: then a secretary of the Central-South Bureau and first secretary in Hunan); industry to rise steadily, a two-year plan and a seven-year plan from 1963; rectification in industry too slow; too many papers; Mao has views of the Secretariat''s and the departments'' work. Civil aviation under the air force; the two-year plan by the end of March. The northern conference called for the 11th)'
