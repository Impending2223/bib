      also: [vietnam-hanoi, soviet-union]
      c: 'Deng Xiaoping 邓小平 holds his second talk with Lê Duẩn. Stalin''s sharpening class struggle one-sided, though class struggle is long and at times fierce; class struggle by the methods for contradictions among the people; one-man management under the Party committee and the mass line in industry; each party its own general line, faster if it can; on Khrushchev''s "setting watches" 对表 at the Hungarian congress: by Marxism–Leninism and the Moscow Declaration, not one man''s baton; the differences matters of principle; agreement with the Soviet comrades not to be had in these months; the work hard.'
