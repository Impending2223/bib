- cite:
    id: cal.1961-03-15.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1623 (Mar. 15–23, 1961; Deng attends; the draft Working Regulations (the Sixty Articles on agriculture), the Center''s letter to all comrades on discussing them, and its letter to the bureaus and provinces on investigation adopted; in his speeches of the 19th and the 23rd Deng makes a self-criticism for the Secretariat: investigation a basic, permanent method, "less sitting and talking, more rising and doing"; the draft then tried and discussed across the countryside)'
