      thread: china-leadership
      also: [soviet-union, defense]
      c: 'Deng Xiaoping 邓小平 speaks to the army''s political work conference on the Twenty-second Congress and affairs at home: Sino-Soviet relations can get neither much better nor much worse, to be handled patiently, for the world proletariat''s interest; the three red banners right, the leap too fierce and experience short; readjustment chiefly, quality, farming and daily goods, not steel''s quantity; a seven-year plan, food, clothing and use, defense too, to give heart; "ambition, but true to fact, with room to spare".'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1667–1668 (Nov. 1, 1961). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
