    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1590 (Oct. 24, 1960; 8 p.m. to 12:40 a.m.; Deng, with Peng Zhen and others, reports the drafting committee to Mao''s enlarged Standing Committee)'
