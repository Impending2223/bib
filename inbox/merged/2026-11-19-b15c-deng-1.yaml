- cite:
    id: cal.1962-07-07.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1713–1714 (July 7, 1962; morning; Deng receives all those at the Youth League''s Third Central Committee''s Seventh Plenum and speaks: politically a fine situation; the economy not good, its recovery resting on farming; the peasants'' zeal through the relations of production; whatever form restores output most easily and fast, and the masses want, to be used, the illegal made legal, "yellow cat or black cat, a cat that catches mice is a good cat"; a step back to go forward; industry to serve farming and meet food, clothing and use; the League''s own system, staff not to be touched by others, its right to criticize the Party. The part on the situation printed in *Deng Xiaoping wenxuan*, vol. 1, as "How to restore agricultural production")'
