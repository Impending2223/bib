- cite:
    id: cal.1961-01-05.china-leadership-6
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1609–1610 (Jan. 5, 1961; morning; Deng presides. Deng: in Tibet few new rules, rest and recovery; customs respected; less grain bought; free trade between farming and herding areas; no draining the pond to catch the fish; the peasants to grow rich, household by household, for ten years or eight; no cooperatives for five years; guard against the "left" and haste; no socialist transformation now; cadres chosen for plainness and a democratic style; representative meetings, the base first; careful work with the Panchen; the Dalai a matter of international struggle; religion not hurried; the rebellion put down, politics at the center)'
