    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1588 (Oct. 21, 1960; evening; Deng with Alves 阿尔维斯 of the Brazilian party: the meeting''s method good, agreement on most questions, but deeds will tell, the campaign against the Chinese party going on)'
- cite:
    id: cal.1960-10-22.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1588 (Oct. 22, 1960; noon; Deng''s brief statement: the method of repeated discussion has made a paper broadly acceptable, unlike Bucharest; the draft much improved; regrets that some major questions of principle remain unagreed; the committee ends at 1:30 p.m.)'
- cite:
    id: cal.1960-10-22.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1589 (Oct. 22, 1960; 3 p.m.; Deng toasts unasked. Khrushchev: he does not want to lead, to be a public lavatory; he would leave a party that sought revolution by war between states. Deng: no party seeks it; the Soviet Union at the head and the CPSU the center a matter of history, apart from equal consultation. In talk: Albania, Khrushchev''s "as with Yugoslavia" wholly wrong; "dogmatism" an attack on the Chinese party; the defense works facing Vladivostok not aimed at the USSR; the experts'' recall carries an ideological quarrel into state relations; the east wind and the paper tiger a class analysis)'
- cite:
    id: cal.1960-10-22.china-leadership-5
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1589 (Oct. 22, 1960; 9 to 9:30 p.m., the Chinese Embassy; Deng with Miyamoto Kenji: each party''s affairs its own, mistakes and all; Marxism–Leninism developed in each country, thought set free)'
- cite:
    id: cal.1960-10-23.china-leadership-7
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1590 (Oct. 23, 1960; morning, Deng''s eighth talk with Kapo: in November a campaign against China; facts and reasons, sharp in matter, mild in language; a long struggle, the middle mass to be won. Then Deng with Adjitorop of the Indonesian party: two gains, the lid lifted, the first time any party could criticize the CPSU; and majority and minority settled, no voting machine)'
- cite:
    id: cal.1960-10-23.china-leadership-8
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1590 (Oct. 23, 1960; 10 p.m. Moscow time Deng leads the delegation out by air; in Peking a little after 1 p.m. Peking time the next day)'
