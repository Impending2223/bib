- cite:
    id: cal.1961-03-27.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1624–1625 (Mar. 27, 1961; morning; Deng presides and relays the Canton conference: egalitarianism and investigation; the general line, the leap and the communes right, some things spread too fast; seeking truth from facts harmed; little investigation, much falsity, the basic lesson; investigation restored above the county as a permanent method; fixed teams to go down; trial before spreading; industrial articles too, for large and middle plants; plans not fussy, key projects, out of the Soviet way of proportion, "battles of annihilation")'
- cite:
    id: cal.1961-03-28.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1625–1626 (Mar. 28, 1961; morning; Deng receives members of the Railway Ministry''s Party committee and the railway political work conference: rectification, output and life all; a team for transport alone; the "communist wind" not opposed in general; the "special wind" defined; rectify style, rules and ranks, by the railways'' own facts; one-man management under the Party committee; political departments on policy, not administration; unions and the Youth League; the families; investigation a permanent system)'
