    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1693 (Feb. 28, 1962; afternoon; Deng presides; control work, industry''s help to agriculture, propaganda. Deng: control commissions mostly full-time, going about to protect the good and fight the bad; thirty to fifty from the Center against suppression of democracy and decentralism; members one day elected by Party congresses, treated as Central Committee members; still chosen by and under the committee at their level, guided from above; removal approved above; a code for them. To Li Fuchun: less iron and steel, more timber to the villages, small tools; the Seventy Articles, responsibility, accounting, cooperation, staff cut on the five fixings)'
