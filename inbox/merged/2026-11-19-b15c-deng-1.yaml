    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1624 (Mar. 23, 1961; afternoon; Deng at the plenary. Deng: the Chairman''s criticism apt and needed; the Secretariat''s routine not bad, its counsel on great decisions poor, for want of investigation, its material chiefly reports; problems sensed in some places and not investigated or solved; investigation a basic method)'
