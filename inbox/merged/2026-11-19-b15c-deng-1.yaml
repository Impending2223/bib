      c: 'Deng Xiaoping 邓小平 issues the Center''s 中央 comment forwarding two reports of the Central Control Commission 中央监察委员会, "Bad men and bad deeds must be thoroughly examined and seriously handled" 《对坏人坏事要彻底检查认真处理》. To the draft''s "though the bad men and bad deeds the reports point to are few" he adds: unchecked, they will do the cause great harm, ruin more cadres and give the enemy more openings.'
