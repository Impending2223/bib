      id: cal.1962-12.china-leadership-8
      when: Dec.
      date: 1962-12
      thread: china-leadership
      c: 'Deng Xiaoping 邓小平, an inscription for the 30th anniversary of the death of Wei Baqun 韦拔群: a life given to the Party and the people''s liberation; brave and unbending against the enemy; a hero of the proletariat and the working people; a true leader of the masses; a model Communist.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1740. III, 1740 n.1: Wei Baqun stayed in the Youjiang 右江 base after the Seventh Red Army''s main force went north in Nov. 1930; killed by a traitor, Oct. 1932. Names: Deng Xiaoping. Check: whether the inscription was printed or displayed at the time (the nianpu does not say; if not, made public 2009, the nianpu).'
      src:
        c: f2961853
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1740: all'
