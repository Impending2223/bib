    id: cal.1961-03-02.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1618–1619 (Mar. 2, 1961; evening, Zhengzhou, on the train; Deng with Wu Zhipu and others, told of Henan''s rectification: zeal of cadres and masses the key; repayment made good; cadres dealt with lightly rather than too hard, no labels; spirits raised after criticism; vegetables and pigs; in industry the old good rules restored, more built than broken, step by step, "permanent revolution" and "revolution by stages" both; rational wages and bonuses, more for miners below ground; quality the mark of a good plant. That night he leaves Zhengzhou)'
