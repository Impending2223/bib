    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1551 (May 22, 1960; afternoon into the evening; Deng at Mao''s meeting at Hangzhou: the world after the summit''s failure, the proposed talks of the two parties, Khrushchev. Mao: imperialism''s nature unchanged; the struggle with the CPSU in articles, no break yet; Khrushchev "has two hands." Decided: an enlarged Politburo at Shanghai in early June; the Eighth Congress''s third session in late June (footnote 1: it was never held); the fourth volume of the *Selected Works*)'
