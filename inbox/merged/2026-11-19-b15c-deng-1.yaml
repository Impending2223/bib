      date: '1960-04-07'
      thread: china-leadership
      c: 'Deng Xiaoping 邓小平 drafts the Center''s 中央 notice forwarding the Jilin 吉林 committee''s request on arranging the three antis 三反: spring sowing first; the communes'' three antis put off until after it or into the slack; every province to weigh the timing so as not to hinder farming, with trials only in the coming months. Sent the same day to Mao Zedong 毛泽东, then to Liu Shaoqi 刘少奇, Peng Zhen 彭真 and Tan Zhenlin 谭震林 to issue.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1538–1539 (Apr. 7, 1960). Mao, reading it, makes "the province''s six-level cadre conference" "the province''s and the counties'' cadre conferences" and adds that where the three antis already go on without hindering production they may continue (III, 1539). Made public: 2009 (the nianpu). See [[cal.1960-04-07.china-leadership-4]]. Names: Deng Xiaoping, Mao Zedong, Liu Shaoqi, Peng Zhen, Tan Zhenlin.'
