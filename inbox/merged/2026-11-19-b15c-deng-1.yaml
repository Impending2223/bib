- add:
    entry:
      id: cal.1962-12-25.china-leadership-10
      when: Dec. 25
      date: '1962-12-25'
      thread: china-leadership
      also: [korea, soviet-union]
      c: 'Deng Xiaoping 邓小平 receives Han Ik-su 韩益洙, the Korean Ambassador, and hears of the Korean Workers'' Party''s Fourth Central Committee''s Fifth Plenum. Deng: the *Renmin ribao* 人民日报 printed their article on self-reliance that day, very good; China says self-reliance, Korea an independent economy, and the revisionists call it national communism; without self-reliance no standing to oppose revisionism, to hold to Marxism-Leninism, or to keep independence and sovereignty; only an independent economy keeps one from moving under the baton.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1738–1739 (Dec. 25, 1962). The words: 下午 (III, 1738). III, 1738 n.2: the article, "Socialist revolution and self-reliance," from *Kulloja* 勤劳者, no. 19, reprinted in the *Renmin ribao* Dec. 25, 1962. Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 8dffc875
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1738–1739: all'
      tags: ['polity:prc', 'name:deng-xiaoping', 'vis:only:prc+dprk']
      time_range: ['1962-12-25T04:00Z', '1962-12-25T10:00Z']
      time_band: afternoon
      time_zone: Asia/Shanghai
- add:
    entry:
      id: cal.1962-12-29.china-leadership-4
      when: Dec. 29
      date: '1962-12-29'
      thread: china-leadership
      also: [soviet-union]
      c: 'Deng Xiaoping 邓小平 to Mao Zedong 毛泽东, by letter, sending the *Renmin ribao* 人民日报 editorial draft "The differences between Comrade Togliatti and us" 《陶里亚蒂同志同我们的分歧》: much harder than the last; to be settled that afternoon at Liu Shaoqi''s 刘少奇, who would have it out by the 31st; asks Mao''s word by the afternoon of the 30th. The title "Refute Togliatti" 驳陶里亚蒂 not used, "refute" reading as "oppose" in foreign languages.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1739 (Dec. 29, 1962). Made public: 2009 (the nianpu). See [[cal.1962-12-24.china-leadership]]. Names: Deng Xiaoping, Mao Zedong, Togliatti, Liu Shaoqi.'
      src:
        c: 3390fd86
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1739: all'
      tags: ['polity:prc', 'name:deng-xiaoping', 'name:mao-zedong', 'name:togliatti-palmiro', 'name:liu-shaoqi', 'vis:only:prc']
