- cite:
    id: cal.1961-03-29.china-leadership-5
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1626–1627 (Mar. 29, 1961; Deng chairs the Secretariat''s report meeting and relays the Canton conference: the two Zhengzhou meetings and Wuchang against the "left" but not carried out; Lushan meant against the "left", Peng Dehuai''s case intervened, and after it the wind blew harder; since 1958 seeking truth weakened, "exaggeration" its opposite; the five winds from the communist and exaggeration winds; faults in places three or four fingers, not one; democracy harmed; now "three nots": no caps, no pigtails, no clubs)'
- cite:
