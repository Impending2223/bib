    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1675 (Dec. 11, 1961; morning; Deng presides; Liao Luyan on the national agricultural conference; farming in 1962. Deng: 82 billion jin of grain and 16 million dan of cotton purchased next year, or plans and socialism''s superiority are empty; winter water works solid, not a "big rush"; mass movement one form of the mass line; ideals; communist style; the Center against the localities, centralization, the whole; learn to be honest and to take a loss)'
    units: B
- cite:
    id: cal.1961-12-11.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1675–1676 (Dec. 11, 1961; afternoon; Deng presides, Zhou attends; Cheng Zihua (footnote 1: then executive deputy director of the Planning Commission) on the 1962 plan. Deng: no "back doors" in local capital construction; no tactics between Center and localities, tactics only for enemies; is there zeal under centralization? too many small worlds; finance and banking to the Center alone; the decentralization of banking wholly wrong)'
