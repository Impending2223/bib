      when: Dec. 14
      date: '1962-12-14'
      thread: china-leadership
      also: [china]
      c: 'Deng Xiaoping 邓小平 signs and issues the Center''s decision setting up a Fifteen-Man Special Committee 十五人专门委员会 under the Center''s direct leadership, to strengthen the leadership of the atomic energy industry and win greater results in a shorter time: Zhou Enlai 周恩来 its chairman; He Long 贺龙, Li Fuchun 李富春, Li Xiannian 李先念, Bo Yibo 薄一波, Lu Dingyi 陆定一, Nie Rongzhen 聂荣臻, Luo Ruiqing 罗瑞卿, Zhao Erlu 赵尔陆, Zhang Aiping 张爱萍, Wang Heshou 王鹤寿, Liu Jie 刘杰, Sun Zhiyuan 孙志远, Duan Junyi 段君毅 and Gao Yang 高扬.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1737–1738 (Dec. 14, 1962). The chronology gives it under the 14th, a second item of the day (III, 1738 n.1: Gao Yang, Minister of Chemical Industry). Made public: 2009 (the nianpu). See [[cal.1962-11-17.china]]. Names: Deng Xiaoping, Zhou Enlai, He Long, Li Fuchun, Li Xiannian, Bo Yibo, Lu Dingyi, Nie Rongzhen, Luo Ruiqing, Zhao Erlu, Zhang Aiping, Liu Jie, Sun Zhiyuan, Duan Junyi, Gao Yang.'
