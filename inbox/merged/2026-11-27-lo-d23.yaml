    set:
      c: 'Selma to Montgomery, the first day.{1} King leads some 3,200 out of Selma under the federalized Guard, Army troops, marshals, and the FBI;{2} 300 a day through Lowndes County.{3} Cager Lee, Jimmie Lee Jackson''s grandfather, in the first row beside King; 1,800 of the Alabama Guard along, Army helicopters overhead; Ramsey Clark, for the President, by radio with the FBI agents and the marshals. Judge Johnson''s order: 3,200 on the four-lane stretches, 300 a day through Lowndes County. The first day, seven miles, the three hundred sleeping on David Hall''s farm.{7} Rabbi Abraham Heschel marches beside King.{8}'
      n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 108–09 (M.D. Ala. 1965) (the plan). Check the counts. [[w.garrow-bearing-the-cross]], 410–13; [[w.branch-at-canaans-edge]], 141–44 (the hours; not the count at Selma); [[w.mann-walls-of-jericho]], 467–68 (the march out of Selma under the federal troops; the Capitol); [[w.branch-pillar-of-fire]], 611 (Heschel on the march beside King); [[w.zelizer-fierce-urgency-of-now]], 215; [[w.kotz-judgment-days]], 320–22 (3,200; Cager Lee, Jimmie Lee Jackson''s grandfather, in the first row; 1,800 Guardsmen, Army helicopters, Ramsey Clark by radio; 300 a day on the two-lane stretch through Lowndes County; seven miles the first day, the night at David Hall''s farm); [[w.bernstein-guns-or-butter]], 233–34 (the Army''s counts; 25,000 at the capitol); [[w.young-easy-burden]], 362–66; [[w.wofford-of-kennedys-and-kings]], 186–89 (the Guard federalized and regular troops under the President''s order; the march past the bridge; the 300 for Lowndes County; not the count); [[w.kotz-judgment-days]], 320–22; [[w.branch-pillar-of-fire]], 611. Check: Bernstein, 233, gives the Army''s count of 392 marchers leaving Selma, some 45 white. Check: Young, 363, counts thirty-five hundred at the start. To check: Int. Susannah Heschel, Nov. 15, 1990; Int. Sylvia Heschel, Feb. 4, 1991 (cited by [[w.branch-pillar-of-fire]], 611). Branch, 611, has the remark in the epilogue, from Branch''s interviews of 1990 and 1991 with Susannah and Sylvia Heschel (the note to 611): a later recollection, in the gloss. See [[cal.1965-03-07.voting-rights]]; [[cal.1965-03-20.alabama]]. Check: Branch gives some three thousand leaving Selma (142) and 308 through Lowndes County by the FBI''s count (146). The first day''s march is dated by [[w.kotz-judgment-days]], 320–22; the later days and Mar. 25 are in their own entries. The time: the march moves off at 12:46 p.m., Selma''s clock, and reaches David Hall''s field at 5:07 p.m. (Branch, 142, 144). Names: King, Ramsey Clark, Jimmie Lee Jackson.'
      gloss:
        title: Commentary
        text:
        - 'Branch (1998), from interviews with Susannah Heschel (Nov. 15, 1990) and Sylvia Heschel (Feb. 4, 1991): Heschel, of the march beside King, "I felt like I was praying with my feet" ([[w.branch-pillar-of-fire]], 611).'
    kind: correct
