      c: 'Montgomery. King speaks to the rally from a flatbed truck below the capitol, that afternoon, the networks carrying it whole. "They told us we wouldn''t get here ... But all the world today knows that we are here." Of Johnson: "A President born in the South had the sensitivity to feel the will of the country." "How long? Not long."'
