      c: 'Califano reports to Johnson, who calls him from the Ranch after midnight Sunday: Morse and Collins have made no progress in Pittsburgh, and he believes that, left to themselves, the parties will not reach a settlement. Johnson decides to return for a breakfast meeting that Monday and to invite Eisenhower to the White House that afternoon. By Califano''s account.'
