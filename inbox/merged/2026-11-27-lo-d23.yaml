      c: 'State to Taylor, 8:48 p.m., telegram 1548 under Rusk''s name: a meeting at the highest levels that day concurred that the evacuation of dependents proceed at once, "clearing decks for further decisions." State asks Taylor for his recommendations on timing and pace, inclined to a start within ten days and an end a week or ten days after, and on the rationale: linked to the new regime only if Khánh and the new Prime Minister make convincing statements of determination. Taylor to discuss it with Khánh, "as real power source."'
