- edit:
    id: cal.1960-10-26.elections-1960-king
    base: f6e6ac29
    set:
      n: '[Statement by Senator John F. Kennedy on Telephone Call To Mrs. Martin Luther King, at Impromptu Press Conference, New York, NY](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-telephone-call-mrs-martin-luther-king-impromptu-press) (Oct. 26, 1960) (Kennedy: he telephoned her; her account of his words). [[w.white-making-of-the-president]], 322 ("Early Wednesday morning," Wofford reaches Shriver; Shriver reaches Kennedy at O''Hare Inn as he prepares to leave for Michigan; the call from his room); [[w.wofford-of-kennedys-and-kings]], 18–19 (Shriver: "Jack doesn''t leave O''Hare for another forty minutes"; he waits until Sorensen, Salinger and O''Donnell are out of the room; Coretta King''s account of the words); [[w.mann-walls-of-jericho]], 284 (Shriver places the call; Kennedy speaks "for no more than three minutes"; the words); [[w.schlesinger-robert-kennedy-and-his]], 216–18 (Kennedy in "a motel in the Chicago airport"; to Salinger, arriving at Detroit, "I talked to Mrs. King this morning"); [[w.thomas-robert-kennedy]], 101 (Shriver pleads with Kennedy "In an airport lounge at Chicago''s O''Hare Airport"); [[w.sorensen-kennedy]], 188, 215–16 (the call, opposed at first by "almost all his advisers"; not the day); [[w.goodwin-remembering-america]], 121–22 (Shriver, waiting outside, speaks to Kennedy alone; Kennedy promises to "do all I can"); [[w.sorensen-counselor]], 272 (after "an intensive hotel room debate among his advisors"); [[w.gifford-center-cannot-hold]], 86 ("a much-publicized call"; not the day or the place); [[w.kallina-kennedy-v-nixon]], 153 (the idea Shriver''s and Louis Martin''s; Shriver alone with Kennedy; Shriver places the call, Mrs. King on the line, Kennedy speaking briefly; not the place, the day, Wofford or the words). The hour: "Early Wednesday morning" ([[w.white-making-of-the-president]], 322); "this morning" (Kennedy to Salinger, [[w.schlesinger-robert-kennedy-and-his]], 217). The order: after [[cal.1960-10-26.king]], [[w.wofford-of-kennedys-and-kings]], 18 (Shriver tells Kennedy of King''s "middle-of-the-night ride"). Check: Goodwin puts the call "The morning after King''s imprisonment," at his brother''s suggestion by telephone, as Kennedy began to prepare for the fourth debate (Oct. 21), O''Donnell and the political advisers against (121). Check: Kallina, 153, has the call Shriver''s and Louis Martin''s idea, Shriver placing it. See [[cal.1960-10-25.king]]. Names: Shriver, Wofford, Kennedy, Coretta Scott King.'
- edit:
    id: cal.1960-10-27.king
    base: d41bf96e
    set:
      n: '[[w.mann-walls-of-jericho]], 285; [[w.wofford-of-kennedys-and-kings]], 22 (the release on $2,000 bond; "I am deeply indebted to Senator Kennedy"; not the endorsement); [[w.white-making-of-the-president]], 323 (released on bail Thursday; not the bond or the words); [[w.schlesinger-robert-kennedy-and-his]], 218 ("The next day King was released"; he "declined to endorse Kennedy"; not the bond); [[w.thomas-robert-kennedy]], 102 (the judge releases King after Robert Kennedy''s call; not the bond or the words); [[w.gifford-center-cannot-hold]], 86 (release on bail; not the day); [[w.kallina-kennedy-v-nixon]], 153–54 (the release, Judge Mitchell ordering it Oct. 27, 153; King''s thanks to Kennedy and no endorsement, 154; not the bond or the words). The order: after [[cal.1960-10-27.robert-kennedy-2]], [[w.wofford-of-kennedys-and-kings]], 22 ("Not long after Bob''s call"). To check: [[w.garrow-bearing-the-cross]], 148; *Time*, Nov. 7, 1960; *Atlanta Constitution*, Oct. 28, 1960 (cited by [[w.mann-walls-of-jericho]], 285). See [[cal.1960-10-25.king]]. Names: Martin Luther King, Kennedy.'
- edit:
    id: cal.1960-10-27.robert-kennedy-2
    base: 336f8451
    set:
      n: '[[w.white-making-of-the-president]], 323 ("the next morning telephoned a plea for King''s release from New York to the Georgian judge"); [[w.wofford-of-kennedys-and-kings]], 21–22 (before Brinkley''s call "late in the afternoon of October 27"; "It just burned me all the way up here on the plane"; the release "Not long after Bob''s call"); [[w.schlesinger-robert-kennedy-and-his]], 216–18 (by telephone on reaching New York; "I made it clear to him that it was not a political call"); [[w.thomas-robert-kennedy]], 102–03 (from New York, "probably" from a telephone booth); [[w.mann-walls-of-jericho]], 285 ("By day''s end," the day of the call to Mrs. King); [[w.sorensen-kennedy]], 188, 216 (an "indignant protest to the judge"; not the day); [[w.nixon-six-crises]], 362 (Robert Kennedy "wasted no time in calling the judge"; not the day); [[w.kallina-kennedy-v-nixon]], 154 (Robert Kennedy telephones Judge Mitchell after Vandiver''s word that Mitchell will free King on that call; King is released; not the day or the place). The hour: "the next morning" ([[w.white-making-of-the-president]], 323). Check: the day; Schlesinger (217) and Thomas (101–03) have the call on the afternoon of Oct. 26, on his arrival in New York; Mann has it "By day''s end" of Oct. 26 (285). Check: Thomas, from Vandiver''s account, has Robert Kennedy call Mitchell at his brother''s instruction, through Vandiver (102–03); Robert Kennedy''s own account of 1964, at Vandiver''s suggestion (103 n.). Check: by Kallina''s account, after Vandiver''s (154), Kennedy first called Vandiver, who arranged through Robert Russell and George Stewart that Mitchell would free King on Robert Kennedy''s call. See [[cal.1960-10-25.king]]. Names: Robert Kennedy, Oscar Mitchell, Martin Luther King.'
- edit:
    id: cal.1960-10-28.king
    base: 7d0aa3f7
    set:
      n: '[[w.wofford-of-kennedys-and-kings]], 22–23 (the *Atlanta Journal*: King "did just about everything short of" an endorsement); [[w.mann-walls-of-jericho]], 285 (the gathering at Ebenezer; King Sr.''s words); [[w.gifford-center-cannot-hold]], 86–87 (at a thanksgiving service at Ebenezer, the elder King''s statement; not King''s words); [[w.white-making-of-the-president]], 323 (the elder King''s "suitcase of votes"; not the day or the place); [[w.schlesinger-robert-kennedy-and-his]], 218 (the father''s words, as "I''ll take a Catholic or the Devil himself"; not the day or the place); [[w.thomas-robert-kennedy]], 102 (the elder King "openly shifted his endorsement"; not the day or the words); [[w.goodwin-remembering-america]], 122 (the father announces he will vote for a Catholic; not the day or the place); [[w.kallina-kennedy-v-nixon]], 155 (King Sr. announces for Kennedy: "a suitcase of votes"; faults Eisenhower and Nixon for "not saying a mumbling word"; not the words quoted, the day, the place or Abernathy); [[w.gifford-center-cannot-hold]], 87. Check: Mann, 285, puts the gathering at Ebenezer the night of King''s release, and has King Sr.''s words "in a statement.". Check: Gifford has the elder King make the pledge to Wofford "earlier that day" (86). See [[cal.1960-10-25.king]]. Names: Martin Luther King, Martin Luther King Sr., Kennedy, Abernathy.'
- edit:
    id: cal.1960-09.cuba
    base: fba2a1c4
    set:
      n: '[S. Rep. No. 94-465, 74–76 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=85). Made public: the Church Committee''s interim report, *Alleged Assassination Plots Involving Foreign Leaders*, Nov. 20, 1975; in part, Drew Pearson and Jack Anderson''s column, Mar. 7, 1967 (the day: [FRUS 1964–68, XXXII, doc. 315](https://history.state.gov/historicaldocuments/frus1964-68v32/d315), editorial note; Check: Anderson''s part). Edwards, testimony, May 30, 1975, Church Committee, 2–5 (NARA JFK record 157-10002-10048) (Bissell''s instructions, put by Schwarz in the fall of 1960, to see whether Edwards had access to a source that might accomplish that end, 2–3; through O''Connell to Maheu, Maheu to Rosselli, 3; approached by Bissell, 5; for Bissell''s request and the chain from Maheu to Rosselli; not the month, the Plaza Hotel or the meeting''s day). Edwards, interview, Apr. 9, 1975, Belin to the file, Rockefeller Commission, 2–4 (NARA JFK record 178-10002-10352) (Bissell''s request that Edwards see what assets he had "into the syndicate"; Maheu first, then Rosselli, 3; O''Connell the case officer, 4; for the same; not the day, the Plaza Hotel or the meeting). [[w.jones-bay-of-pigs]], 21, 23–24 (21: Bissell to Edwards, August; 23–24: the meeting at the Plaza, while Castro was at the UN); [[w.schlesinger-robert-kennedy-and-his]], 482–83 (the CIA commissioned Maheu to "put out the contract" on Castro, assassination presented to him as "a necessary ingredient" of the invasion plan; Maheu brought in Rosselli, Rosselli Giancana, Giancana Trafficante; the case officers'' contacts made before Dulles was told; not the Plaza Hotel, Edwards or the day); [[w.fursenko-khrushchevs-cold-war]], 314 ("In August 1960 the CIA opened contacts with members of the Mafia"). To check: [[w.thomas-very-best-men]]; [[w.bohning-castro-obsession]]; [[w.hersh-dark-side-of-camelot]]; [[w.wyden-bay-of-pigs]]; Osborn to the Director of Central Intelligence, Nov. 9, 1970, in the CIA''s "Family Jewels," May 16, 1973, 44 (cited by [[w.jones-bay-of-pigs]], 21 n.29); Rosselli, testimony, June 24, 1975, 9, 59, Church Committee (cited by [[w.jones-bay-of-pigs]], 24 n.37). Names: Maheu, Rosselli, Bissell, Edwards, Castro.'
- check:
    id: cal.1960-09.cuba
    text: 'Check: Edwards, in the interview of Apr. 9, 1975, puts Bissell''s request "about the time of the Bay of Pigs," in the Kennedy administration (2); before the Church Committee, May 30, 1975, he is "mixed up between ''60 and ''61" on the dates (3), agrees that the contact was before the Bay of Pigs, and to Schwarz''s "the fall of 1960" answers "Oh." (4).'
- edit:
    id: cal.1960-09.cuba-3
    base: ff81b923
    set:
      n: '[S. Rep. No. 94-465, 94–95 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=105). Made public: the Church Committee''s interim report, Nov. 20, 1975. Edwards, testimony, May 30, 1975, Church Committee, 5–8, 11 (Edwards "personally briefed" Dulles and Cabell, who knew of the project; Bissell there, as he recalls; a brief, sensitive conversation, 7; Schwarz reads the Inspector General''s report of May 23, 1967, pp. 17–18: with Bissell present Edwards briefs Dulles and Cabell, circumspect, no "bad words," Dulles "merely nodded" 8; Edwards: an accurate description, 11; for the briefing of Dulles and Cabell and the Inspector General''s sentence; not the day); 8–9 (the report as Schwarz reads it: Bissell commits $150,000 for the support of the operation; for the last sentence) (NARA JFK record 157-10002-10048); Edwards, interview, Apr. 9, 1975, Belin to the file, Rockefeller Commission, 5 (the plan "approved by Alan W. Dulles and General Cabell"; for the briefing; not the day) (NARA JFK record 178-10002-10352). [[w.jones-bay-of-pigs]], 27–28. To check: Bissell, testimony, June 9, 1975, 20, 22, 24, Church Committee; Osborn to the Director of Central Intelligence, Nov. 9, 1970, in the CIA''s "Family Jewels," May 16, 1973, 44 (cited by [[w.jones-bay-of-pigs]], 28 n.47). See [[cal.1960-09.cuba]]. Names: Bissell, Edwards, Dulles, Cabell.'
      c: 'The latter part of September, by Bissell''s testimony: Bissell and Edwards brief Dulles and Cabell on the plan with the gambling syndicate, Edwards "in somewhat circumlocutious terms." By the Inspector General''s report, Dulles "merely nodded, presumably in understanding and approval."{1} By the same report, as Schwarz reads it to Edwards in 1975, Bissell commits $150,000 for the support of the operation.{2}'
      src:
        c: c850f805
        rows:
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=105: 1'
      gloss:
        title: Commentary
        text:
        - 'Edwards (May 30, 1975), on the $150,000: "as I recall it was the Mafia, the Syndicate, that wanted to get Castro out of the picture" (Edwards, testimony, Church Committee, 9 (NARA JFK record 157-10002-10048)).'
- check:
    id: cal.1960-09.cuba-3
    text: 'Check: Edwards, in the interview of Apr. 9, 1975, has the plan approved by Dulles and Cabell and Bissell''s request about the time of the Bay of Pigs, in the Kennedy administration (2, 5); in the testimony of May 30, 1975, he is "mixed up" on ''60 and ''61 (3).'
- edit:
    id: cal.1962-04.cuba-2
    base: 974d1dfa
    set:
      n: '[S. Rep. No. 94-465, 83 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=94) (Harvey and Rosselli, April 1962; the report''s account of Rosselli''s testimony, June 24, 1975). [[w.thomas-robert-kennedy]], 158; [[w.jones-bay-of-pigs]], 158–59 (Harvey to Roselli, April 1962: the poison scheme revived; not Maheu cut out); [[w.schlesinger-robert-kennedy-and-his]], 485 (in April 1962 Helms, now Bissell''s successor, ordered Harvey to reactivate the Castro project; Harvey told Rosselli to cut out Maheu and Giancana; the plot ended in February 1963); [[w.sen-church-alleged-assassination-plots]], 83 (Harvey, on "explicit orders" from Helms by his testimony, asked Edwards in early April 1962 to put him in touch with Rosselli; the Support Chief introduced them in Miami; Harvey told Rosselli to keep his Cuban contacts but not to deal with Maheu or Giancana, "untrustworthy" and "surplus"). Edwards, testimony, May 30, 1975, Church Committee, 20 (Edwards Exhibit 1, his memorandum of May 14, 1962: "In early April Mr. William Harvey asked me to arrange a contact with" Rosselli; Edwards told Harvey he would take no part in future operations proposed for Rosselli) (NARA JFK record 157-10002-10048). To check: Senate Select Committee, *Alleged Assassination Plots Involving Foreign Leaders: An Interim Report* (1975), 83–84 (cited by [[w.thomas-robert-kennedy]], 158); O''Connell testimony, May 30, 1975; Harvey testimony, June 25, 1975; Roselli testimony, June 24, 1975, Church Committee; the CIA Inspector General''s report, 1967, 7, 29–33, 45–47 (cited by [[w.jones-bay-of-pigs]], 159 n.14). Names: Harvey, Rosselli, Castro, Maheu. Check: the day.'
      when: Apr., early
      at: before 1962-04-11
- edit:
    id: cal.1962-04-08.cuba-2
