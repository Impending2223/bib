      n: '[Johnson and Cliff Carter, 8:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-cliff-carter-february-11-1964), Conversation WH6402-13-2006 (Miller Center). The words: 8:15 p.m. (the Miller Center''s catalogue, Eastern time). Names: Johnson, Corbin, Robert Kennedy, Connally, Don Yarborough.'
