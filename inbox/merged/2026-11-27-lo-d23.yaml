      c: 'Johnson with Rusk, McNamara and McGeorge Bundy, 11:30 a.m., on Bundy''s memorandum.{1} Johnson, by Bundy''s notes: "Stable government or no stable government, we''ll do what we have to do.... We will move strongly. Khanh is our boy."{2} The destroyer patrols in the Gulf of Tonkin to resume.{4}'
      n: 'FRUS 1964–68, II, doc. [42](https://history.state.gov/historicaldocuments/frus1964-68v02/d42) n.2 (McNamara: the views given Johnson "in a mtg with Dean Rusk"). [[w.logevall-choosing-war]], 318–19 (the meeting; Johnson''s words; the patrols, 319); [[w.mcnamara-in-retrospect]], ch. 6 at n.22 (the Treaty Room, that morning, with Rusk). [[w.preston-war-council]], 168 (Johnson''s cable to Taylor: "the U.S. will spare no effort and no sacrifice"); [[w.branch-pillar-of-fire]], 572; [[w.moyar-triumph-forsaken]], 352 (Johnson resolves on the 27th: "We will move strongly"). The order: after [[cal.1965-01-27.vietnam]], Taylor''s report of that morning from Saigon, FRUS 1964–68, II, doc. 41 (Embtel 2322), which the cable of 8:48 p.m. answers. The dependents'' evacuation and State''s cable of 8:48 p.m. (FRUS 1964–68, II, doc. 43) are acts of their own. To check: MB meeting notes, Jan. 27, 1965, NSF MPB, LBJ Library (cited by [[w.logevall-choosing-war]], 318 n.32); [[w.rusk-as-i-saw-it-1990]], 447 (cited by [[w.branch-pillar-of-fire]], 572). After Bundy''s memorandum for the meeting: [[cal.1965-01-27.vietnam-2]]. See [[cal.1965-01-27.vietnam-2]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Nguyễn Khánh.'
