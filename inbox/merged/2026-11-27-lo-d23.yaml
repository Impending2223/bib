- edit:
    id: cal.1960-10-02.soviet-union
    base: 4c0dc1ba
    set:
      when: Oct. 1–22
      c: 'Moscow. The drafting committee of twenty-six parties, Oct. 1–22.{1} In its eight plenaries and eleven secretariat sessions the committee disputes the epoch, peaceful coexistence and transition, war and peace, disarmament, "going it alone" and "national communism," revisionism and dogmatism, factions, the cult of personality and the Twentieth and Twenty-first Congresses. No agreement on banishing world war, on factions or on the two Congresses; they are left to the November meeting of eighty-one parties.{6} The committee sits three weeks without an agreed draft. By Wu Lengxi''s account the Soviet side holds to what the Chinese press to cut and revises in form only; the draft carries four points aimed at the Chinese: the Twentieth Congress line, the attack on "factional activity," the denunciation of the cult of personality and the claim that world war can be avoided. Many delegates ask to report to their central committees; the committee closes its stage and sends the revised draft and the open questions to the November meeting.{7}'
      n: '[[w.yang-shangkun-riji]], I, 558–59 (Oct. 1, the first sitting; the two days of study, the general debate from Oct. 4); [[w.deng-xiaoping-nianpu-1904]], III, 1580 (Oct. 1–22, 1960; Deng leads the delegation; eight plenary sessions and eleven of the secretariat; sharp dispute on the epoch, peaceful coexistence and transition, war and peace, disarmament, "going it alone" and "national communism", revisionism and dogmatism, factions, the cult of personality, the Twentieth and Twenty-first Congresses; many exchanges and many amendments; no agreement on banishing world war, factions and the two Congresses, left to the November meeting of eighty-one parties); [[w.lengxi-shinian-lunzhan-1956-1966]], 365–67 (the committee of twenty-six parties, from Oct. 2; the delegation large, most of the writers in it, 367; the Soviet draft patched; the dispute as in the Reply and the party talks; the four "nails"; three weeks, no agreed draft; delegates to report to their central committees; the revised draft and the open questions to the November meeting). Made public: 1999. The Chinese delegation''s reading of the draft and the sitting of Oct. 1 are in [[cal.1960-09-30.china-leadership-6]] and [[cal.1960-10-01.china-leadership-9]]. Names: Wu Lengxi. Check: the days of the sessions; the nianpu gives the span only. Check: the account is the Chinese delegation''s. The span Oct. 1–22 is the nianpu''s (III, 1580).'
      src:
        c: bbd69b45
        rows:
        - 'w.yang-shangkun-riji I, 558–59: 1'
        - 'w.deng-xiaoping-nianpu-1904 III, 1580: 1, 6'
        - 'w.lengxi-shinian-lunzhan-1956-1966 365–67: 1, 7'
