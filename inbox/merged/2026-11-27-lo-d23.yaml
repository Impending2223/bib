      c: Montgomery.{1} More than thirty thousand behind the three hundred, Randolph, Wilkins, Farmer, Lewis, King and Bunche at the head, past Dexter Avenue Baptist to the capitol.{2} The FBI counts some 12,000 passing the starting point at St. Jude, more joining along the last four miles.{4}
      n: '[[w.kotz-judgment-days]], 323–24 (the march and the leaders at its head); [[w.bernstein-guns-or-butter]], 234 (past Dexter Avenue Baptist); [[w.wofford-of-kennedys-and-kings]], 197–98 (from St. Jude''s through Confederate Square, past the Dexter Avenue church, to the capitol; not the count, the leaders or King''s words); [[w.branch-at-canaans-edge]], 161 (the march "nearly two hours late, almost noon in Washington"; the front row Wilkins, Randolph, Bunche, Hosea Williams, Lewis, Bevel and Shuttlesworth with the Abernathys; the FBI: "one hour and 40 minutes to pass a starting point," some 12,000). Check: Bernstein, 234, gives a crowd estimated at 25,000. Check: Wofford gives "forty or fifty thousand people, no one could count them all" (198). Check: Branch, 161, does not name Farmer in the front row. The words: "almost noon in Washington" (161), taken as about 11 a.m., Montgomery''s clock. The march is dated by the entries on it and by the line; King''s speech is its own act. See [[cal.1965-03-21.voting-rights]]. Names: Randolph, Wilkins, Farmer, Lewis, Martin Luther King, Bunche, Johnson.'
