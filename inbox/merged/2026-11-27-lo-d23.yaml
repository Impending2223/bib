    set:
      n: '[[w.perlstein-before-the-storm]], 93–95 (Fannin''s nomination; the demonstration; the withdrawal, the release of the delegates and the words); [[w.white-suite-3505]], 23–24 (Fannin''s nomination; the withdrawal, the release, the words); [[w.gifford-center-cannot-hold]], 135–36, 156 (Fannin; Shorey''s seconding speech; the withdrawal and the words, from the Proceedings); [[w.kabaservice-rule-and-ruin]], 29 (the withdrawal; the words); [[w.goldberg-barry-goldwater]], 145 (his name put in nomination; the demonstration; Goldwater withdraws); [[w.young-two-suns-of-the]], 27 (Goldwater declines; not the words); [[w.kallina-kennedy-v-nixon]], 93 (Goldwater, who had assured Nixon before the convention that he would not be a candidate, lets his name be put in nomination; the demonstration; he asks it withdrawn and speaks: "put our shoulders to the wheel for Dick Nixon"; the "grow up" and "get to work" lines in Kallina''s words, not the quotation; not Fannin, Shorey or the release of the delegates). The order: after [[cal.1960-07-27.conservative-movement]], "before withdrawing his name." See [[cal.1960-07-26.elections-1960]], which holds the convention''s bibliography. Names: Fannin, Goldwater, Nixon. Check: Goldberg, 145, quotes "Let''s if we want to take this party back—and I think we can some day—let''s get to work." Check: Young, 27, quotes "Let''s get to work if we want to take this party back—and I think we can."'
