patch: alms
by: agent
ops:
  # ---------------------------------------------------------------- Alabama
  - add:
      entry:
        id: cal.1960-02-16.alabama-al
        when: Feb. 16
        date: '1960-02-16'
        thread: alabama
        also: [state-constitutions, state-and-city-finance]
        c: 'Constitutional amendment election, nineteen amendments, most of them county taxes and fees. Amendment No. 1: $3,000,000 in State bonds for a mental hospital at the University of Alabama Medical Center, on the liquor and beer taxes; 131,916 to 18,021. Six county amendments refused.'
        n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [613](https://archive.org/details/alabama-official-statistical-register-1963/page/n612)–628. [[w.peirce-deep-south-states-of]].'
        tags: [state:al]
  - add:
      entry:
        id: cal.1960-05-03.alabama-al
        when: May 3
        date: '1960-05-03'
        thread: alabama
        also: [elections-1960]
        c: 'Alabama''s Democratic primary for presidential electors, eleven places, the electors to go on the November ballot as the party''s: a slate of unpledged electors against a slate loyal to the national ticket. One place filled outright, by an unpledged elector, 166,119 votes; the next, unpledged, 153,865; the first of the loyalists third, 150,550. Runoff for the other ten places May 31.'
        n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [637](https://archive.org/details/alabama-official-statistical-register-1963/page/n636). [[w.bartley-southern-politics-and-the]]; [[w.white-making-of-the-president]]. See [[cal.1960-11-08.elections-1960]].'
        tags: [state:al]
  - add:
      entry:
        id: cal.1960-05-31.alabama-al
        when: May 31
        date: '1960-05-31'
        thread: alabama
        also: [elections-1960]
        c: 'Alabama''s Democratic runoff for presidential electors. Six unpledged electors nominated in all, and five loyal to the national ticket. All eleven on the November ballot as the Democratic electors; the six vote for Byrd in December, the five for Kennedy.'
        n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [647](https://archive.org/details/alabama-official-statistical-register-1963/page/n646). See [[cal.1960-05-03.alabama-al]]; [[cal.1960-12-19.elections-1960]].'
        tags: [state:al, name:byrd-harry-f, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1961-12-05.alabama-al
        when: Dec. 5
        date: '1961-12-05'
        thread: alabama
        also: [state-constitutions, state-and-city-finance]
        c: 'Constitutional amendment election, forty-five amendments, most of them county taxes and powers to court industry. State bonds: $10,000,000 for prisons refused, 74,718 to 86,687; $3,000,000 for the University of Alabama Research Institute at Huntsville adopted, 115,280 to 37,418; $2,000,000 for hospitals and health centers adopted, 97,200 to 41,961. Emergency interim legislators in case of enemy attack, adopted, 94,887 to 40,101. Eminent domain, refused, 68,842 to 69,336.'
        n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [672](https://archive.org/details/alabama-official-statistical-register-1963/page/n671)–674.'
        tags: [state:al, city:huntsville]
  - add:
      entry:
        id: cal.1962-05-01.alabama-al
        when: May 1
        date: '1962-05-01'
        thread: alabama
        also: [governors, elections-1962]
        c: 'Alabama''s Democratic primary for governor: Wallace 32.5 percent, DeGraffenried 25.2, Folsom 25.1, Attorney General MacDonald Gallion 12.6, Connor 3.6; Lieutenant Governor Boutwell, 862 votes. Runoff between Wallace and DeGraffenried. Hill renominated for the Senate, 73.7 percent, over two.'
        n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [736](https://archive.org/details/alabama-official-statistical-register-1963/page/n735)–[737](https://archive.org/details/alabama-official-statistical-register-1963/page/n736); Boutwell''s total, not printed there, from [Wikipedia, "1962 Alabama gubernatorial election"](https://en.wikipedia.org/wiki/1962_Alabama_gubernatorial_election) (Check). [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.frady-wallace]]; [[w.black-southern-governors-and-civil]]; [[w.bartley-southern-politics-and-the]]; [[w.bartley-southern-elections]]; [[w.peirce-deep-south-states-of]]. Names: Wallace (K–J Cong. III.F); DeGraffenried, Folsom, Gallion, Connor, Boutwell (K–J Cong. III.K); Hill (K–J Cong. III.B).'
        tags: [state:al, name:wallace-george-c, name:degraffenried-ryan, name:folsom-james-e, name:gallion-macdonald, name:connor-eugene, name:boutwell-albert, name:hill-lister]
  - add:
      entry:
        id: cal.1962-05-29.alabama-al
        when: May 29
        date: '1962-05-29'
        thread: alabama
        also: [elections-1962, legislatures]
        c: 'Alabama''s runoff. Wallace 340,730, DeGraffenried 269,122. The State down from nine Representatives to eight, the legislature having drawn no new districts: the nine Democratic nominees, chosen May 1 by the old districts, on one statewide ballot, the lowest to drop out. Rains first, 548,349; Boykin of Mobile last, 380,679.'
        n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [763](https://archive.org/details/alabama-official-statistical-register-1963/page/n762)–[764](https://archive.org/details/alabama-official-statistical-register-1963/page/n763). [[w.bartley-southern-politics-and-the]]. See [[cal.1962-05-01.alabama-al]]; [[cal.1962-05-29.elections-1962]]. Names: Wallace (K–J Cong. III.F); DeGraffenried (K–J Cong. III.K).'
        tags: [state:al, city:mobile, name:wallace-george-c, name:degraffenried-ryan, name:rains-albert-m, name:boykin-frank-w]
  - add:
      entry:
        id: cal.1962-07-12.alabama-al
        when: July 12
        date: '1962-07-12'
        thread: alabama
        also: [legislatures, state-constitutions]
        c: 'The legislature, in extraordinary session, four days before the federal court''s hearing in *Sims v. Frink*: the "67-Senator Amendment," a senator for each county, proposed for the November ballot; and the Crawford-Webb Act, a second plan should the amendment fail. The legislature last apportioned on the 1900 census.'
        n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [360](https://archive.org/details/alabama-official-statistical-register-1963/page/n359). *Sims v. Frink*, [205 F. Supp. 245](https://static.case.law/f-supp/205/html/0245-01.html) (M.D. Ala. 1962) (the hearing set, Apr. 14). [[w.cortner-apportionment-cases]]; [[w.smith-on-democracys-doorstep-2014]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]].'
        tags: [state:al]
  - add:
      entry:
        id: cal.1962-07-21.alabama-al
        when: July 21
        date: '1962-07-21'
        thread: alabama
        also: [legislatures, court]
        c: '*Sims v. Frink*. A three-judge court, Judge Johnson sitting: neither the 67-Senator Amendment nor the Crawford-Webb Act meets the equal protection clause. For the November election, its own provisional plan, drawn from parts of both: Jefferson County 17 representatives, Mobile 8, Montgomery 4; 35 senatorial districts, Jefferson and Mobile one each. Decree filed July 25.'
        n: '*Sims v. Frink*, [208 F. Supp. 431](https://static.case.law/f-supp/208/html/0431-01.html) (M.D. Ala. 1962); the decree, *Alabama Official and Statistical Register, 1963*, [360](https://archive.org/details/alabama-official-statistical-register-1963/page/n359)–361. Affirmed: [[cal.1964-06-15.court]]. See [[cal.1962-07-12.alabama-al]]. Names: Johnson (K–J Cong. III.G).'
        tags: [state:al, city:birmingham, city:mobile, city:montgomery, name:johnson-frank-m-jr]
  - add:
      entry:
        id: cal.1962-11-06.alabama-al
        when: Nov. 6
        date: '1962-11-06'
        thread: alabama
        also: [elections-1962]
        c: 'Alabama. Hill (D) re-elected to the Senate over James D. Martin (R) of Gadsden, 201,937 to 195,134, 50.9 percent. Wallace elected governor without a Republican opponent. A constitutional amendment adopted, 138,211 to 32,212: a voter who moves within his county in the three months before an election may vote where he moved from.'
        n: '[*Statistics of the Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf) (Clerk of the House, 1963), 2. The amendment: *Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [783](https://archive.org/details/alabama-official-statistical-register-1963/page/n782) (Act No. 641, 1961). [[w.bartley-southern-politics-and-the]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.peirce-deep-south-states-of]]. See [[cal.1962-11-06.elections-1962]]. Names: Hill (K–J Cong. III.B); Martin (Opp. III.I); Wallace (K–J Cong. III.F).'
        tags: [state:al, name:hill-lister, name:martin-james-d, name:wallace-george-c]
  - add:
      entry:
        id: cal.1962-11-06.alabama-birmingham
        when: Nov. 6
        date: '1962-11-06'
        thread: mayors
        also: [alabama, elections-1962]
        c: 'Birmingham votes to replace its three-man City Commission, Connor its Commissioner of Public Safety, with a mayor and a council of nine, under the Mayor-Council Act of 1955; the commission retained and a council-manager plan the other choices. Election of the mayor and council set for Mar. 5, 1963.'
        n: '*Reid v. City of Birmingham*, 274 Ala. 629, [150 So. 2d 735](https://static.case.law/ala/274/html/0629-01.html) (1963); *Connor v. State ex rel. Boutwell*, 275 Ala. 230, [153 So. 2d 787](https://static.case.law/ala/275/html/0230-01.html) (1963). Check: the vote. [[w.eskew-but-for-birmingham]]; [[w.mcwhorter-carry-me-home]]; [[w.thornton-dividing-lines]]; [[w.nunnelley-bull-connor]]. Names: Connor (K–J Cong. III.K).'
        tags: [state:al, city:birmingham, name:connor-eugene]
  - add:
      entry:
        id: cal.1963-03-05.alabama-birmingham
        when: Mar. 5
        date: '1963-03-05'
        thread: alabama
        also: [mayors, elections-1963]
        c: 'Birmingham elects a mayor and nine councilmen. For mayor: Boutwell, former lieutenant governor, first; Connor second; Tom King third. Runoff Apr. 2 between Boutwell and Connor. Mar. 1, the State Supreme Court had upheld the November vote.'
        n: '*Reid v. City of Birmingham*, 274 Ala. 629, [150 So. 2d 735](https://static.case.law/ala/274/html/0629-01.html) (1963). Check: the returns. [[w.eskew-but-for-birmingham]]; [[w.thornton-dividing-lines]]; [[w.mcwhorter-carry-me-home]]. See [[cal.1962-11-06.alabama-birmingham]]. Names: Boutwell, Connor, King (K–J Cong. III.K).'
        tags: [state:al, city:birmingham, name:boutwell-albert, name:connor-eugene, name:king-tom]
  - add:
      entry:
        id: cal.1963-04-02.alabama-birmingham
        when: Apr. 2
        date: '1963-04-02'
        thread: alabama
        also: [mayors, elections-1963]
        c: 'Birmingham runoff. Boutwell elected mayor over Connor by 7,982 votes (Check). The mayor and council take their oaths Apr. 15; the three commissioners, Connor among them, hold to their offices, claiming terms to Oct. 1, 1965. Two governments.'
        n: '*Connor v. State ex rel. Boutwell*, 275 Ala. 230, [153 So. 2d 787](https://static.case.law/ala/275/html/0230-01.html) (1963). [Martin Luther King, Jr., Research and Education Institute, "Boutwell, Albert"](https://kinginstitute.stanford.edu/boutwell-albert). See [[cal.1963-03-05.alabama-birmingham]]; [[cal.1963-04-03.alabama]]. Names: Boutwell, Connor (K–J Cong. III.K).'
        tags: [state:al, city:birmingham, name:boutwell-albert, name:connor-eugene]
  - add:
      entry:
        id: cal.1963-05-23.alabama-birmingham
        when: May 23
        date: '1963-05-23'
        thread: alabama
        also: [mayors, court]
        c: 'The State Supreme Court, Goodwyn writing: Boutwell and the council took office lawfully Apr. 15; the act of 1959 deferring a change of government to Oct. 1 of the next municipal election year does not govern Birmingham. The commissioners ousted; Connor leaves City Hall.'
        n: '*Connor v. State ex rel. Boutwell*, 275 Ala. 230, [153 So. 2d 787](https://static.case.law/ala/275/html/0230-01.html) (1963). See [[cal.1963-04-02.alabama-birmingham]]; [[cal.1963-05-10.alabama]]. Names: Boutwell, Connor (K–J Cong. III.K).'
        tags: [state:al, city:birmingham, name:boutwell-albert, name:connor-eugene]
  - add:
      entry:
        id: cal.1963-07-23.alabama-birmingham
        when: July 23
        date: '1963-07-23'
        thread: alabama
        also: [desegregation-public-places, mayors]
        c: 'Birmingham''s council repeals the city''s segregation ordinances, unanimously (Check).'
        n: 'Encyclopedia of Alabama, ["Birmingham Campaign of 1963"](https://encyclopediaofalabama.org/article/birmingham-campaign-of-1963/). Check: the council''s minutes. [[w.eskew-but-for-birmingham]]; [[w.thornton-dividing-lines]]. See [[cal.1963-05-23.alabama-birmingham]].'
        tags: [state:al, city:birmingham]
  - add:
      entry:
        id: cal.1963-10.alabama-al
        when: Oct.
        date: '1963-10'
        thread: alabama
        also: [antisubversion]
        c: 'Alabama''s State Sovereignty Commission, seven members, $50,000, its records closed to the public; members named Dec. 21. The same year, the Legislative Commission to Preserve the Peace, to investigate groups acting against the State''s sovereignty. Check the acts'' dates.'
        n: 'Jeremy Gray, "Alabama Sovereignty Commission formed with sweeping powers, no public oversight (Oct. 5, 1963)," al.com, Oct. 5, 2013, from the *Birmingham News*. Check: the acts, *Acts of Alabama*, 1963. [[w.carter-politics-of-rage-1995]]. Names: Wallace (K–J Cong. III.F).'
        tags: [state:al, name:wallace-george-c]
  - add:
      entry:
        id: cal.1963-12-10.alabama-al
        when: Dec. 10
        date: '1963-12-10'
        thread: alabama
        also: [state-constitutions, voting-rights, state-and-city-finance]
        c: 'Constitutional amendment election. The voter qualification amendment refused, 30,819 to 81,693: an applicant of good character, to read and write any article of the federal Constitution, answer a written application and pass a sealed examination set and graded by a State board, its level no lower than the armed forces'' entrance test, and swear he never belonged to a group advocating overthrow of the government. A State corporate income tax to 5 percent, adopted, 73,083 to 43,050.'
        n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [663](https://archive.org/details/alabama-official-statistical-register-1967/page/n664)–[665](https://archive.org/details/alabama-official-statistical-register-1967/page/n666) (Act No. 417, Regular Session, 1963; Act No. 91, Second Special Session, 1963). [[w.lawson-black-ballots]]; [[w.carter-politics-of-rage-1995]].'
        tags: [state:al]
  - add:
      entry:
        id: cal.1964-10-04.alabama-selma
        when: Oct. 4
        date: '1964-10-04'
        thread: alabama
        also: [mayors, elections-1964]
        c: 'Selma. Joseph T. Smitherman takes office as mayor, having beaten the mayor by some 500 votes (Check). Wilson Baker his director of public safety, over the police.'
        n: '*Selma Times-Journal*, ["Remembering Mayor Smitherman"](https://selmatimesjournal.com/?p=10001). Check: the city''s returns and the election''s date. [[w.thornton-dividing-lines]]; [[w.garrow-protest-at-selma]]; [[w.fairclough-to-redeem-the-soul]]. See [[cal.1964-07-04.alabama]]. Names: Smitherman (K–J Cong. III.F); Baker (K–J Cong. III.K).'
        tags: [state:al, city:selma, name:smitherman-joseph-t, name:baker-wilson]
  - add:
      entry:
        id: cal.1965-09-30.alabama-al
        when: Sept. 30–Oct. 22
        date: '1965-09-30'
        thread: governors
        also: [alabama, state-constitutions, legislatures]
        c: 'Wallace''s special session on succession: an amendment to let the governor serve a second term in a row. House Bill 1 passes the House, 74 to 23. In the Senate a filibuster; Wallace short of the 21 votes for cloture. Oct. 22, the fourteenth day, he gives it up.'
        n: 'Steve Flowers, ["The 1965 special succession session"](https://www.alreporter.com/2020/05/13/opinion-the-1965-special-succession-session/), *Alabama Political Reporter*, May 13, 2020. Check: the House and Senate Journals, Third Special Session, 1965. [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.frady-wallace]]. Lurleen Wallace announces: [[cal.1966-02-24.elections-1966]]. Names: Wallace (K–J Cong. III.F).'
        tags: [state:al, name:wallace-george-c]
  - add:
      entry:
        id: cal.1965-10-02.alabama-al
        when: Oct. 2
        date: '1965-10-02'
        thread: alabama
        also: [legislatures, court, voting-rights]
        c: '*Sims v. Baggett*. The three-judge court on the legislature''s plans of Sept. 24: the Senate act upheld; the House act void under the Fourteenth and Fifteenth Amendments, its combinations of counties drawn against the Negro voter; *Gomillion* cited. The United States a party.'
        n: '*Sims v. Baggett*, [247 F. Supp. 96](https://static.case.law/f-supp/247/html/0096-01.html) (M.D. Ala. 1965) (Act No. 47, Act No. 48, Second Special Session, 1965). [[w.cortner-apportionment-cases]]; [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]; [[cal.1960-11-14.court]]. Names: Johnson (K–J Cong. III.G).'
        tags: [state:al, name:johnson-frank-m-jr]
  - add:
      entry:
        id: cal.1965-11-30.alabama-al
        when: Nov. 30
        date: '1965-11-30'
        thread: alabama
        also: [state-constitutions, voting-rights]
        c: 'Constitutional amendment election, thirty-seven amendments. Section 181, the qualifications of 1951 (good character, embracing the duties of citizenship), repealed: an applicant to read and write any article of the federal Constitution, except for physical disability, the legislature to provide permanent registration; 93,647 to 37,137. $1,900,000 in bonds for an exhibit of Army and NASA rockets at Huntsville, 92,506 to 29,761.'
        n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [687](https://archive.org/details/alabama-official-statistical-register-1967/page/n688)–[688](https://archive.org/details/alabama-official-statistical-register-1967/page/n689) (Act No. 239, First Special Session, 1965). [[w.lawson-black-ballots]]; [[w.davidson-quiet-revolution-in-the]]. See [[cal.1963-12-10.alabama-al]]; [[cal.1965-08-06.voting-rights]].'
        tags: [state:al, city:huntsville]
  - add:
      entry:
        id: cal.1966-09-02.alabama-al
        when: Sept. 2
        date: '1966-09-02'
        thread: alabama
        also: [desegregation-schools]
        c: 'At Wallace''s call, the legislature, in special session, declares void every agreement of a local school board with HEW under the desegregation guidelines and forbids new ones (Act No. 252). Check: passed Sept. 2, or the Senate Aug. 31 and signed Sept. 9.'
        n: 'Act No. 252, Special Session, 1966, as cited in [*Wallace v. Lee*, Motion to Affirm](https://ldfrecollection.org/archives/archives-search/archives-item/8f325deb-eb93-40a1-bf4f-3e634cbbfcdd/wallace-v-lee-motion-to-affirm) (NAACP Legal Defense Fund). Check: *Acts of Alabama*, Special Session, 1966. [[w.carter-politics-of-rage-1995]]. See [[cal.1964-07-13.alabama]]. Names: Wallace (K–J Cong. III.F).'
        tags: [state:al, name:wallace-george-c]
  - add:
      entry:
        id: cal.1966-11-08.alabama-al
        when: Nov. 8
        date: '1966-11-08'
        thread: alabama
        also: [governors, elections-1966]
        c: 'Alabama. Lurleen Wallace (D) elected governor over Representative James D. Martin (R), 537,505 to 262,943, 63.4 percent; an independent 47,655. Sparkman (D) re-elected to the Senate over John Grenier (R), 60.1 percent. Dallas County: Baker elected sheriff.'
        n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [625](https://archive.org/details/alabama-official-statistical-register-1967/page/n626)–[627](https://archive.org/details/alabama-official-statistical-register-1967/page/n628). [*Statistics of the Congressional Election of November 8, 1966*](https://clerk.house.gov/member_info/electionInfo/1966election.pdf) (Clerk of the House, 1967). [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.bartley-southern-politics-and-the]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.jeffries-bloody-lowndes]]. See [[cal.1966-05-03.elections-1966]]; [[cal.1966-11-08.elections-1966]]. Names: Wallace (K–J Cong. III.K); Martin (Opp. III.I); Sparkman (K–J Cong. III.B); Grenier, Baker (K–J Cong. III.K).'
        tags: [state:al, name:wallace-lurleen-b, name:martin-james-d, name:sparkman-john, name:grenier-john, name:baker-wilson]
  # ---------------------------------------------------------------- Mississippi
  - add:
      entry:
        id: cal.1960-04-24.mississippi-biloxi
        when: Apr. 24
        date: '1960-04-24'
        thread: mississippi
        also: [desegregation-public-places]
        c: 'Biloxi. Some 125 Negro men, women and children, led by Dr. Gilbert R. Mason, wade in at the city''s beach, built with federal funds; white crowds attack them, the police standing by; fighting in the town into the night. Mason arrested Apr. 17 for swimming there. The beaches held public by the Fifth Circuit in 1967.'
        n: '[Wikipedia, "Biloxi wade-ins"](https://en.wikipedia.org/wiki/Biloxi_wade-ins). [[w.dittmer-local-people]]; [[w.katagiri-mississippi-state-sovereignty-commission]]. Names: Mason (K–J Cong. III.K).'
        tags: [state:ms, city:biloxi, name:mason-gilbert-r]
  - add:
      entry:
        id: cal.1960-06-07.mississippi-ms
        when: June 7
        date: '1960-06-07'
        thread: mississippi
        also: [state-constitutions, jobs-and-wages]
        c: 'Special election: Mississippi ratifies a right-to-work amendment, Section 198-A: no one to be denied work for membership or nonmembership in a union. Proposed by the legislature Apr. 28 by two-thirds of each house.'
        n: '*Barnes v. Ladner*, 241 Miss. 606, [131 So. 2d 458](https://static.case.law/miss/241/html/0606-01.html) (1961). Check: the vote.'
        tags: [state:ms]
  - add:
      entry:
        id: cal.1960-06.mississippi-ms
        when: June
        date: '1960-06'
        thread: mississippi
        also: [antisubversion]
        c: 'The State Sovereignty Commission, Barnett its chairman, votes $20,000 to the Citizens'' Council Forum and monthly grants to the Council; by December 1964, $193,500 of State money.'
        n: 'Mississippi Department of Archives and History, [Sovereignty Commission Online, "Agency History"](https://da.mdah.ms.gov/sovcom/scagencycasehistory). Made public: the Commission''s files, unsealed by order of the federal district court, Mar. 17, 1998. [[w.katagiri-mississippi-state-sovereignty-commission]]; [[w.mcmillen-citizens-council]]; [[w.johnston-mississippis-defiant-years-1953]]. Names: Barnett (K–J Cong. III.F).'
        tags: [state:ms, name:barnett-ross-r]
  - add:
      entry:
        id: cal.1960-11-08.mississippi-ms
        when: Nov. 8
        date: '1960-11-08'
        thread: mississippi
        also: [elections-1960, voting-rights, state-constitutions]
        c: 'Mississippi. The unpledged Democratic electors 116,248, 39.0 percent; the Democratic electors pledged to Kennedy 108,362; Nixon 73,561. The eight unpledged electors to vote for Byrd. The same day, Section 241-A ratified: an applicant for registration to be of "good moral character."'
        n: '[*Statistics of the Presidential and Congressional Election of November 8, 1960*](https://clerk.house.gov/member_info/electionInfo/1960election.pdf) (Clerk of the House, 1961), 25. Section 241-A: *United States v. Mississippi*, [380 U.S. 128](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380128/usrep380128.pdf) (1965), n.7. Check: the amendment''s vote and date (the Secretary of State''s proclamation, Nov. 23). [[w.crespino-in-search-of-another]]; [[w.lawson-black-ballots]]; [[w.white-making-of-the-president]]. See [[cal.1960-11-08.elections-1960]]; [[cal.1960-12-19.elections-1960]]. Names: Kennedy (Viet. III.A); Nixon (Opp. III.E); Byrd (K–J Cong. III.B).'
        tags: [state:ms, name:kennedy-john-f, name:nixon-richard-m, name:byrd-harry-f]
  - add:
      entry:
        id: cal.1962-05.mississippi-ms
        when: May
        date: '1962-05'
        thread: mississippi
        also: [voting-rights]
        c: 'After the Fifth Circuit''s injunction of Apr. 10 against Forrest County''s registrar, the legislature''s registration laws: every blank of the application to be filled "properly and responsively" without help; the registrar not to tell a rejected applicant why; applicants'' names published in the newspapers, any voter to challenge an applicant''s moral character; race no longer marked in the poll books. Check the dates of passage.'
        n: 'Miss. Laws 1962, chs. 569–574, as listed in *United States v. Mississippi*, [380 U.S. 128](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380128/usrep380128.pdf) (1965), n.10. [[w.lawson-black-ballots]]; [[w.dittmer-local-people]]. The Government''s suit against them: [[cal.1964-03-06.voting-rights]].'
        tags: [state:ms, city:hattiesburg]
  - add:
      entry:
        id: cal.1962-06-05.mississippi-ms
        when: June 5
        date: '1962-06-05'
        thread: mississippi
        also: [elections-1962, legislatures]
        c: 'Mississippi, down from six Representatives to five, two incumbents put in one district: Whitten beats Frank E. Smith in the Democratic primary. Smith to the TVA board in November. Check the date and the figures.'
        n: '[Wikipedia, "Frank Ellis Smith"](https://en.wikipedia.org/wiki/Frank_Ellis_Smith). [[w.smith-congressman-from-mississippi]]; [[w.mitchell-mississippi-liberal]]; [[w.crespino-in-search-of-another]].'
        tags: [state:ms, name:whitten-jamie-l, name:smith-frank-e]
  - add:
      entry:
        id: cal.1963-02-05.mississippi-ms
        when: Feb. 5
        date: '1963-02-05'
        thread: mississippi
        also: [legislatures, state-constitutions]
        c: 'Mississippi ratifies the reapportionment amendment of the legislature''s second extraordinary session of 1962, Sections 254 and 255: a House of 122, a Senate of 52. Check: the vote.'
        n: '*Connor v. Johnson*, [256 F. Supp. 962](https://static.case.law/f-supp/256/html/0962-01.html), 965 (S.D. Miss. 1966) (General Laws of Mississippi, Second Extraordinary Session 1962, ch. 57; proclaimed Feb. 13, 1963). [[w.parker-black-votes-count]]. See [[cal.1962-03-26.court]].'
        tags: [state:ms]
  - add:
      entry:
        id: cal.1963-08-06.mississippi-ms
        when: Aug. 6
        date: '1963-08-06'
        thread: mississippi
        also: [governors, elections-1963]
        c: 'Mississippi''s Democratic primary for governor: Lieutenant Governor Paul Johnson 38.5 percent, former Governor Coleman 32.9, Charles L. Sullivan 27.9. Runoff between Johnson and Coleman.'
        n: '[Wikipedia, "1963 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1963_Mississippi_gubernatorial_election). Check: *Mississippi Official and Statistical Register, 1964–1968*. [[w.black-southern-governors-and-civil]]; [[w.crespino-in-search-of-another]]; [[w.dittmer-local-people]]; [[w.bartley-southern-elections]]. Names: Paul Johnson (K–J Cong. III.F); Coleman, Sullivan (K–J Cong. III.K).'
        tags: [state:ms, name:johnson-paul-b-jr, name:coleman-j-p, name:sullivan-charles-l]
  - add:
      entry:
        id: cal.1963-08-27.mississippi-ms
        when: Aug. 27
        date: '1963-08-27'
        thread: mississippi
        also: [governors, elections-1963]
        c: 'Mississippi''s Democratic runoff for governor: Paul Johnson 261,493, Coleman 194,958; 57.3 percent. Johnson ran against Coleman''s ties to Kennedy.'
        n: '[Wikipedia, "1963 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1963_Mississippi_gubernatorial_election). Check: *Mississippi Official and Statistical Register, 1964–1968*. See [[cal.1963-08-06.mississippi-ms]]. Names: Paul Johnson (K–J Cong. III.F); Coleman (K–J Cong. III.K).'
        tags: [state:ms, name:johnson-paul-b-jr, name:coleman-j-p, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1963-11-02.mississippi-ms
        when: Nov. 2–4
        date: '1963-11-02'
        thread: mississippi
        also: [voting-rights, civil-rights-organizations, elections-1963]
        c: 'The Freedom Vote. COFO''s mock election for governor, open to Negroes kept off the rolls: Aaron Henry for governor, Ed King for lieutenant governor; some 80,000 ballots (Check). White students from Yale and Stanford among the workers.'
        n: '[[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]; [[w.burner-and-gently-he-shall]]. See [[cal.1963-03-27.mississippi]]. Names: Henry, King (K–J Cong. III.K).'
        tags: [state:ms, name:henry-aaron, name:king-edwin]
  - add:
      entry:
        id: cal.1963-11-05.mississippi-ms
        when: Nov. 5
        date: '1963-11-05'
        thread: mississippi
        also: [governors, elections-1963]
        c: 'Mississippi. Paul Johnson (D) elected governor over Rubel Phillips (R), 225,456 to 138,515, 61.9 percent. The first Republican nominee for governor since 1947.'
        n: '[Wikipedia, "1963 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1963_Mississippi_gubernatorial_election). Check: *Mississippi Official and Statistical Register, 1964–1968*. [[w.crespino-in-search-of-another]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.peirce-deep-south-states-of]]. See [[cal.1963-08-27.mississippi-ms]]; [[cal.1963-11-05.states-and-cities]]. Names: Paul Johnson (K–J Cong. III.F); Phillips (Opp. III.I).'
        tags: [state:ms, name:johnson-paul-b-jr, name:phillips-rubel]
  - add:
      entry:
        id: cal.1964-01-21.mississippi-ms
        when: Jan. 21
        date: '1964-01-21'
        thread: mississippi
        also: [governors]
        c: 'Paul Johnson inaugurated at Jackson: "Hate, or prejudice, or ignorance, will not lead Mississippi while I sit in the governor''s chair" (Check the wording).'
        n: 'Mississippi Department of Archives and History, ["Paul Burney Johnson, Jr."](https://mshistory.mdah.ms.gov/issue/paul-burney-johnson-jr-fifty-fourth-governor-of-mississippi-1964-1968). [[w.dittmer-local-people]]; [[w.crespino-in-search-of-another]]. See [[cal.1963-11-05.mississippi-ms]]. Names: Paul Johnson (K–J Cong. III.F).'
        tags: [state:ms, city:jackson, name:johnson-paul-b-jr]
  - add:
      entry:
        id: cal.1964-01-22.mississippi-hattiesburg
        when: Jan. 22
        date: '1964-01-22'
        thread: mississippi
        also: [voting-rights, civil-rights-organizations]
        c: 'Hattiesburg. Freedom Day: Negro applicants line up at the Forrest County courthouse to register before the circuit clerk, some fifty pickets and some thirty Northern clergymen beside them; Moses, of SNCC, among the organizers. Check the numbers.'
        n: '[[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]; [[w.branch-pillar-of-fire]]. See [[cal.1962-05.mississippi-ms]]. Names: Moses (K–J Cong. III.H).'
        tags: [state:ms, city:hattiesburg, name:moses-robert-p]
  - add:
      entry:
        id: cal.1964-04.mississippi-ms
        when: Apr.
        date: '1964-04'
        thread: mississippi
        also: [crime-and-hijacking, civil-rights-organizations, desegregation-schools]
        c: 'Against Freedom Summer: by Apr. 30, Paul Johnson signs five bills: cities may restrict the movement of groups and set curfews (H.B. 64); picketing of public buildings and streets barred (H.B. 546); city courts'' penalties raised (S.B. 1517); cities to pool police (S.B. 1526); printing or circulating a call to boycott, up to $500 and six months (S.B. 1545). He asks more power for the Highway Patrol. The same session, State tuition grants for pupils at private schools, $185 a year (Check).'
        n: 'SNCC, ["Mississippi Readies Laws for Freedom Summer"](https://www.crmvet.org/docs/pr/640430_sncc_pr_fslaws.pdf), news release, Apr. 30, 1964. Check: Miss. Laws 1964. [[w.dittmer-local-people]]; [[w.watson-freedom-summer]]; [[w.bolton-hardest-deal-of-all]] (the tuition grants). Freedom Summer: [[cal.1964-06-14.mississippi]]. Names: Paul Johnson (K–J Cong. III.F).'
        tags: [state:ms, name:johnson-paul-b-jr]
  - add:
      entry:
        id: cal.1965-08-17.mississippi-ms
        when: Aug. 17
        date: '1965-08-17'
        thread: mississippi
        also: [state-constitutions, voting-rights]
        c: 'Mississippi''s voters approve the amendments of the June special session, 130,832 to 49,330: the interpretation test of 1954, the "good moral character" requirement, and the publication of applicants'' names repealed. Paul Johnson proposed them; the House refused twice before passing them. The poll tax for State elections stands. Check the date.'
        n: '"Mississippi: A Vote for Reason," [*Time*, Aug. 27, 1965](https://content.time.com/time/subscriber/article/0,33009,828317,00.html). [Freedom Democratic Party leaflet on the referendum](https://www.crmvet.org/docs/650817_mfdp_referendum.pdf). [[w.lawson-black-ballots]]; [[w.dittmer-local-people]]; [[w.davidson-quiet-revolution-in-the]]. See [[cal.1960-11-08.mississippi-ms]]; [[cal.1965-08-06.voting-rights]]. Names: Paul Johnson (K–J Cong. III.F).'
        tags: [state:ms, name:johnson-paul-b-jr]
  - add:
      entry:
        id: cal.1966-05-21.mississippi-ms
        when: May 21
        date: '1966-05-21'
        thread: mississippi
        also: [states-and-cities]
        c: 'Paul Johnson signs the Local Option Alcoholic Beverage Control Law: statewide prohibition ends; each county to vote wet or dry. Feb. 4, a raid on the Jackson Country Club. Check the date.'
        n: 'Mississippi Department of Archives and History, [newsfilm, the signing](https://da.mdah.ms.gov/series/newsfilm/detail/528833) (dated May 21, 1966). Check: Miss. Laws 1966. Names: Paul Johnson (K–J Cong. III.F).'
        tags: [state:ms, city:jackson, name:johnson-paul-b-jr]
  - add:
      entry:
        id: cal.1966-07-22.mississippi-ms
        when: July 22
        date: '1966-07-22'
        thread: mississippi
        also: [legislatures, court]
        c: '*Connor v. Johnson*. A three-judge court, Coleman and Cox among the three, on a suit of Negro voters and the Freedom Democrats: the apportionment of 1962–63 void under the equal protection clause. The legislature to reapportion itself by Dec. 1 for the elections of 1967, or the court will. The legislature has passed a congressional redistricting.'
        n: '*Connor v. Johnson*, [256 F. Supp. 962](https://static.case.law/f-supp/256/html/0962-01.html) (S.D. Miss. 1966). [[w.parker-black-votes-count]]; [[w.davidson-quiet-revolution-in-the]]. See [[cal.1963-02-05.mississippi-ms]]; [[cal.1964-06-15.court]]. Names: Coleman (K–J Cong. III.K); Cox (K–J Cong. III.G).'
        tags: [state:ms, name:coleman-j-p, name:cox-w-harold]
