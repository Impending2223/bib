- add:
    entry:
      id: cal.1969-11.china-leadership
      when: Nov., after the 9th
      date: '1969-11'
      thread: china-leadership
      at: after 1969-11-09
      c: 'Mao 毛泽东, on Li Liuru''s 李六如 letter of Nov. 10 (with the cadres'' dispersal from Peking the Center has sent him to Guangxi 广西; old and frail, he asks to go home to Pingjiang 平江, Hunan 湖南, where he can be looked after, and asks the Center for an early verdict on his history): "Wang to deal with as he sees fit."'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 476 (Nov. 1969). The editors gloss "Wang" as Wang Dongxing 汪东兴 (n.2). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Li Liuru, letter of Nov. 10, 1969 to Mao (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 476 n.1). Names: Mao Zedong, Li Liuru, Wang Dongxing. Check: the day; the book gives Nov. 1969, and the letter is of Nov. 10. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: f409d987
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 476: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 476 n.1: all'
- add:
    entry:
      id: cal.1969-11-28.china-leadership-2
      when: Nov. 28
      date: '1969-11-28'
      thread: china-leadership
      c: 'Mao 毛泽东, Lin Biao 林彪 and Zhou Enlai 周恩来 telegraph Enver Hoxha 恩维尔·霍查, Haxhi Lleshi 哈奇·列希 and Mehmet Shehu 穆罕默德·谢胡 at Tirana 地拉那 on the twenty-fifth anniversary of Albania''s liberation: twenty-five years ago the Albanian people, led by the Party of Labor under Hoxha, beat the Italian and German fascist occupiers by their own strength.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 477–479 (Nov. 28, 1969; printed from *Renmin ribao*, Nov. 29, 1969). Names: Mao Zedong, Lin Biao, Zhou Enlai, Enver Hoxha, Haxhi Lleshi, Mehmet Shehu.'
      tags:
      - polity:prc
      - polity:albania
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      src:
        c: 4f017c19
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 477–479: all'
- add:
    entry:
      id: cal.1969-12-25.china-leadership-4
      when: Dec. 25
      date: '1969-12-25'
      thread: china-leadership
      follows:
      - cal.1969-12-25.china-leadership
      c: 'The Center 中共中央 sends out its notice forwarding the self-criticism of Hunan''s 湖南 revolutionary committee for printing and passing on Mao''s instructions on Hunan''s work without asking: the private compiling, printing and spreading of the speeches and talks of Mao 毛泽东 and Lin Biao 林彪 and of other Center leaders, and of biographies, poems, pictures and photographs of them, again forbidden; such copies to be recalled and destroyed; printing works and paper strictly controlled.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 482–483 n.1 (Dec. 25, 1969; after Mao''s "Do as proposed" of the same day). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, notice of Dec. 25, 1969 forwarding the Hunan revolutionary committee''s self-criticism (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 482 n.1b). See [[cal.1969-12-25.china-leadership]]. Names: Mao Zedong, Lin Biao. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
      src:
        c: '0f76ec60'
        rows:
        - 'via w.jianguo-yilai-mao-zedong XIX, 482 n.1b: all'
- add:
    entry:
      id: cal.1969-12-11.china-leadership-3
      when: Dec. 11–23
      date: '1969-12-11'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Military Commission''s Office Group 军委办事组 holds the all-army war preparation conference (Quanjun zhanbei gongzuo huiyi 全军战备工作会议): the year''s war preparation summed up; since Zhenbao 珍宝岛 and Mao''s 毛泽东 call "be ready to fight", the army in the "three norths" has turned its thinking toward fighting; seven tasks for 1970, against surprise attack, strategic reconnaissance and third-line building among them.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 484–485 n.1 (Dec. 11–23, 1969; the Office Group''s summary of Dec. 31 gives the days, not the acts of any one day). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Military Commission Office Group, "Summary of the all-army war preparation conference", Dec. 31, 1969 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 484 n.1). Names: Mao Zedong. Check: the span, thirteen days, past the brief''s week; the note gives neither the opening''s nor the closing''s acts, and Zhou Enlai''s speech of Dec. 20 is the one day the calendar holds. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: '1bbf8fd7'
        rows:
        - 'via w.jianguo-yilai-mao-zedong XIX, 484 n.1: all'
- add:
    entry:
      id: cal.1970-01.china-leadership
      when: Jan., after the 14th
      date: '1970-01'
      thread: china-leadership
      at: after 1970-01-14
      c: 'Mao 毛泽东, on the Foreign Ministry''s 外交部 telegram of instructions to Lei Yang 雷阳, chargé d''affaires in Poland, and the Chinese representative''s draft statement for the 135th Sino-American ambassadorial talks at Warsaw 华沙, sent by Zhou Enlai 周恩来 Jan. 15: "Do as proposed." The aim is to sound out the Americans'' intent and hand; the stand held, the manner flexible, room left to talk on. The draft: the American ambassador''s statement of the 8th offered wider exchanges and dialogue but said nothing of Taiwan, the key to the long dispute.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 486 (Jan. 1970). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Foreign Ministry, telegram of instructions to Lei Yang and the Chinese representative''s draft statement for the 135th ambassadorial talks, sent to Mao by Zhou Enlai Jan. 15, 1970 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 486 n.1). Zhou''s papers: [[cal.1970-01-15.china-leadership]]. Names: Mao Zedong, Lei Yang, Zhou Enlai. Check: the day; the book gives Jan. 1970, Zhou sent the papers Jan. 15, and the talks they were for were held Jan. 20: within the calendar''s span only if Mao wrote by Jan. 19. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - polity:us
      - name:mao-zedong
      - name:lei-yang
      - name:zhou-enlai
      - vis:only:prc
      src:
        c: 'c5dcf80b'
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 486: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 486 n.1a: all'
