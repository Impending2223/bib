- add:
    entry:
      id: cal.1969-09.china-leadership-4
      when: Sept.
      date: '1969-09'
      thread: china-leadership
      c: 'At the all-army war preparation conference (Quanjun zhanbei gongzuo huiyi 全军战备工作会议), Mao''s 毛泽东 instruction "the army must not slacken" (jundui buyao songjin 军队不要松劲) and Lin Biao''s 林彪 "view everything, check everything, carry out everything from the standpoint of fighting" are relayed.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 484 n.1 (Sept. 1969; from the Office Group''s summary of Dec. 31, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Military Commission Office Group, "Summary of the all-army war preparation conference", Dec. 31, 1969 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 484 n.1). The conference: [[cal.1969-09-22.china-leadership-2]]. Names: Mao Zedong, Lin Biao. Check: the day; the note gives Sept. 1969. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
      tags:
      - polity:prc
