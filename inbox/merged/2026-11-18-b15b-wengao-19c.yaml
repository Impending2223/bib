- add:
    entry:
      id: cal.1969-08-22.china-leadership-4
      when: Aug. 22
      date: '1969-08-22'
      thread: china-leadership
      c: 'The Central Military Commission 中央军委 issues the "Instruction on strengthening our army''s organization and discipline" (Guanyu jiaqiang wo jun zuzhi jilüxing de zhishi 关于加强我军组织纪律性的指示), drafted by its Office Group, under its own name as Mao 毛泽东 directed: against the doctrine of "many centers, that is no center", against anarchism and bourgeois factionalism; discipline and law taught throughout the army; the incorrigible punished; cadres, the middle and senior above all, to set the example.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 459–460 n.1 (Aug. 22, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Military Commission, instruction of Aug. 22, 1969 on strengthening the army''s organization and discipline (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 459 n.1b). See [[cal.1969-08-21.china-leadership]]. Names: Mao Zedong. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: '98102a16'
        rows:
        - 'via w.jianguo-yilai-mao-zedong XIX, 459 n.1b: all'
- add:
    entry:
      id: cal.1969-08-28.china-leadership-4
      when: Aug. 28
      date: '1969-08-28'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Center 中共中央 issues its order (the "Aug. 28" order, Ba''erba mingling 八二八命令) to the revolutionary committees of the border provinces, cities and regions, their peoples and the troops on the border: be ready to destroy invaders and to smash armed provocations by the American imperialists and the Soviet revisionists; unity of army and people; border troops to hold their posts; cross-trade mass organizations dissolved; the July 23 notice carried out, armed fighting stopped; no attacks on the army; communications protected; those away from work to return; counterrevolutionaries suppressed.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 461–463 n.1 (Aug. 28, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, order of Aug. 28, 1969 on further stabilizing the border regions (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 461 n.1b). See [[cal.1969-08-22.china-leadership]]. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: 4591f338
        rows:
        - 'via w.jianguo-yilai-mao-zedong XIX, 461 n.1b: all'
- add:
