      when: May 7
      date: '1969-05-07'
      thread: china-leadership
      c: 'Zhou Enlai 周恩来 reports to Mao 毛泽东 on the paper of the Peking northern-suburb lumber mill (Beijing shi Beijiao mucaichang 北京市北郊木材厂): read and discussed the evening of the 5th; to be checked, revised and sent out by the Center 中共中央 for reference, with trials in the chief cities; the Center''s draft instruction and the paper sent for Mao''s approval.'
