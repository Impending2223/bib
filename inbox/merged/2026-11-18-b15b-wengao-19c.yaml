      when: Sept., after the 2nd
      date: '1969-09'
      at: after 1969-09-02
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: Mao's 毛泽东 inscription on the white ribbon of his wreath for Hồ Chí Minh names him an outstanding proletarian revolutionary and a close comrade-in-arms of the Chinese people.
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 467 (Sept. 1969; printed from *Renmin ribao*, Sept. 7, 1969; the note tells of the wreath after Hồ''s death in Hanoi Sept. 2 and the condolences of Zhou Enlai and the other leaders at the DRV''s embassy Sept. 6). See [[cal.1969-09-02.vietnam-hanoi]]. The condolences at the embassy: [[cal.1969-09-06.china-leadership]]. Names: Mao Zedong, Hồ Chí Minh. Check: the day; the book dates the inscription Sept. 1969 only, after the death of Sept. 2 and before the paper of Sept. 7.'
      tags:
