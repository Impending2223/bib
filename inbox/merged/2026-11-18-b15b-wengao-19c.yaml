- add:
    entry:
      id: cal.1969-07.china-leadership-3
      when: July, after the 22nd
      date: '1969-07'
      thread: china-leadership
      at: after 1969-07-22
      c: 'Mao 毛泽东, on the draft joint editorial of *Renmin ribao* 人民日报, *Hongqi* 红旗 and *Jiefangjun bao* 解放军报 for the PLA''s forty-second anniversary, sent by Chen Boda 陈伯达 and Yao Wenyuan 姚文元 July 23: "Issue as is." He strikes eleven characters from the title, which becomes "The people''s army is invincible" (Renmin jundui suoxiang wudi 人民军队所向无敌), and notes that the adjective is too long and can go.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 457–458 (July 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Chen Boda and Yao Wenyuan, draft joint editorial of July 23, 1969, "The people''s army armed with Mao Zedong Thought is invincible" (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 457 n.1a). Names: Mao Zedong, Chen Boda, Yao Wenyuan. Check: the day; the book gives July, and the draft is of July 23. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:chen-boda
      - name:yao-wenyuan
      - vis:only:prc
      src:
        c: e5243811
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 457: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 457 n.1a: all'
