      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 28, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 28, 1969; the plenum, the Standing Committee, the Military Commission, Mao''s speech); [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 28, 1969; the Politburo''s size only); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Apr. 28, 1969; at the First Plenum of the Ninth Central Committee, the book says, the main members of Lin Biao''s and Jiang Qing''s group enter the Politburo and Lin Biao is elected Vice-Chairman of the Central Committee); [[w.jianguo-yilai-mao-zedong]], XIX, 433–439 (Apr. 28, 1969; Mao''s speech at the First Plenum of the Ninth Central Committee, printed from the Center''s document of May 9, 1969; he speaks of the Soviet revisionists'' attacks (''military-bureaucratic dictatorship''), that the socialist revolution goes on and that struggle, criticism and reform remain; that in a fairly large majority of factories the leadership is not in the hands of true Marxists or the workers; that cases like the Erqi works'' Kuomintang members are to be handled with distinctions; that war must be prepared in spirit, not to strike out but to let a big attack in; that Yang Dezhi and Wang Xiaoyu, and Xu Shiyou, Xie Fuzhi and others are not at enmity but in contradiction among the people). Made public: 2013 (the Politburo meeting, Mao''s speech). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 28, 1969), has Zhou propose at the Politburo''s first meeting, on Mao''s suggestion, that Liu Bocheng, Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying stay vice-chairmen of the Military Commission, Wu Faxian deputy head of the Office Group, the lists announced by the Center May 27. Names: Mao Zedong, Lin Biao, Ye Qun, Ye Jianying, Liu Bocheng, Jiang Qing, Zhu De, Xu Shiyou, Chen Boda, Chen Xilian, Li Xiannian, Li Zuopeng, Wu Faxian, Zhang Chunqiao, Qiu Huizuo, Zhou Enlai, Yao Wenyuan, Kang Sheng, Huang Yongsheng, Dong Biwu, Xie Fuzhi, Chen Yi, Xu 