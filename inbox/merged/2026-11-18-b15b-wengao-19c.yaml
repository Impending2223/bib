- edit:
    id: cal.1969-05-05.china-leadership-3
    base: 1f56464e
    set:
      c: 'Zhou Enlai that evening presides over a meeting of the Politburo''s members in Peking on a paper Mao sent, on a Peking northern-suburb lumber yard''s firm carrying out of the Party''s policies toward the national bourgeoisie and the petty bourgeoisie: capitalists are to be told from small owners and independent workers; in the 1956 high tide of socialist transformation private industrialists and merchants were all called "private side" or capitalists, and some of them are now to be set apart and treated as small owners.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 289–290 (May 5, 1969). Made public: 2020. Zhou''s report of May 7: [[cal.1969-05-07.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong.'
- edit:
    id: cal.1969-09.china-leadership
    base: 234bc338
    set:
      c: 'Mao, Peking: the Politburo''s draft slogans for the twentieth anniversary of the PRC: "added a line" for approval: peoples of the world unite against aggressive war launched by any imperialism or social-imperialism, above all atomic war; if it comes, to end it by revolutionary war, and prepare from now.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Sept. 1969. Made public: 2013. Printed in *Renmin ribao*, Sept. 17, 1969 ([[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 17, 1969; the slogans as printed)): [[cal.1969-09-17.china-leadership-2]]. Names: Mao Zedong.'
      src:
        c: 'bb8ac0b7'
        rows:
        - 'w.zedong-mao-zedong-nianpu VI, mid-Sept. 1969: all'
- edit:
    id: cal.1969-10-18.china-leadership-2
    base: 84fd8fa1
    set:
      c: 'Mao, Peking: Zhou Enlai''s report: the day before, with Mao''s assent, he proposed a communique that Sino-Soviet boundary talks will be held; that night the Soviet chargé gave another text that widened the scope; China will tell him Oct. 18 afternoon that its draft follows the scope confirmed by Kosygin and it will publish its own. Mao: agreed.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 323 (Oct. 18, 1969; the communique approved). See [[cal.1969-10-18.china-leadership]]. The communique printed: [[cal.1969-10-19.china-leadership-4]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kosygin.'
      src:
        c: '41a59a0a'
        rows:
        - 'w.zedong-mao-zedong-nianpu VI, Oct. 18, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 323: D'
