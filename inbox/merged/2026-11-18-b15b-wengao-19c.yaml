patch: 2026-11-18-b15b-wengao-19c
by: 'Claude (batch 15b, cite pass of the *Jianguo yilai Mao Zedong wengao*, vol. 19, from p. 439: the notes of the Apr. 28, 1969 speech, then May 3, 1969 to Jan. 19, 1970, 2023 ed.), Nov. 18, 2026'
ops:
- add:
    entry:
      id: cal.1969-05-09.china-leadership
      when: May 9
      date: '1969-05-09'
      thread: china-leadership
      c: The Center 中共中央 sends out to the provinces Mao's 毛泽东 speeches of Apr. 1 at the Ninth Congress and of Apr. 28 at the First Plenum of the Ninth Central Committee, to be read to the members of revolutionary committees of factories, communes, schools and offices and above, and to army cadres of platoon level and above, studied and carried out.
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 439 n.1 (May 9, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, document of May 9, 1969 sending out the two speeches (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 439 n.1). See [[cal.1969-04-28.china-leadership]]. Names: Mao Zedong. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 4feb2bf9
        rows:
        - 'via w.jianguo-yilai-mao-zedong XIX, 439 n.1: all'
- add:
    entry:
      id: cal.1969-05-08.china-leadership
      when: May 8
      date: '1969-05-08'
      thread: china-leadership
      c: 'Mao 毛泽东, on Zhou Enlai''s 周恩来 report of May 7 sending the Center''s draft instruction forwarding the paper of the Peking northern-suburb lumber mill (Beijing shi Beijiao mucaichang 北京市北郊木材厂) on carrying out the Party''s policies toward the national bourgeoisie and the petty bourgeoisie: "Issue as is." He changes the draft''s "Shanghai 上海, Tianjin 天津, Wuhan 武汉, Guangzhou 广州 and other places" to "... and the other large and medium cities".'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 445 (May 8, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Zhou Enlai, report of May 7, 1969 to the Center sending the draft instruction forwarding the Peking northern-suburb lumber mill''s paper (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 445 n.1a). See [[cal.1969-05-05.china-leadership-3]]. Names: Mao Zedong, Zhou Enlai. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
      src:
        c: '3233d43e'
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 445: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 445 n.1a: all'
- add:
    entry:
      id: cal.1969-05-08.china-leadership-2
      when: May 8
      date: '1969-05-08'
      thread: china-leadership
      follows:
      - cal.1969-05-08.china-leadership
      c: The Center 中共中央 forwards to the provinces for reference the Peking northern-suburb lumber mill's paper (most capitalists united with, criticized and educated; the reactionary few struggled against and given a way out; those short of capitalists treated as small owners; small owners sent back among the masses), Shanghai 上海, Tianjin 天津, Wuhan 武汉, Guangzhou 广州 and the other large and medium cities to make trials and report.
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 445–446 n.1 (May 8, 1969; after Mao''s note of the same day). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, instruction of May 8, 1969 forwarding the Peking northern-suburb lumber mill''s paper on carrying out the Party''s policies toward the national bourgeoisie and the petty bourgeoisie (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 445 n.1b). See [[cal.1969-05-08.china-leadership]]. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: 'b632e587'
        rows:
        - 'via w.jianguo-yilai-mao-zedong XIX, 445 n.1b: all'
- add:
    entry:
      id: cal.1969-06-06.china-leadership
      when: June 6
      date: '1969-06-06'
      thread: china-leadership
      c: 'Mao 毛泽东, on the Air Force Party Committee''s report of May 4 on technical innovation in its units since the Cultural Revolution (230 larger innovations done, over 80 under study), sent by the Military Commission''s Office Group May 29: read with much interest; a single technical change is to be called "technical innovation" (jishu gexin 技术革新), not "technical revolution" (jishu geming 技术革命), which means history''s great changes: steam for hand labor, then electricity, now atomic energy.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 447 (June 6, 1969). The report twice put "technical revolution" beside "technical innovation" (447–448 n.1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Air Force Party Committee, report of May 4, 1969 on technical innovation in the Air Force''s units since the Cultural Revolution, sent to Mao by the Military Commission Office Group May 29 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 447 n.1). Names: Mao Zedong. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 7b9ca4e7
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 447: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 447 n.1: all'
- add:
    entry:
      id: cal.1969-07.china-leadership-2
      when: July, after the 3rd
      date: '1969-07'
      thread: china-leadership
      at: after 1969-07-03
      c: 'Mao 毛泽东, on the Center''s 中共中央 "Several provisions on the Mao Zedong Thought study classes run by the Center" (Guanyu Zhongyang ban de Mao Zedong sixiang xuexiban de jitiao guiding 关于中央办的毛泽东思想学习班的几条规定) of July 4: "Agreed in principle." The classes, held in Peking for nearly two years, have had about 32,000 attendances from 25 provinces, cities and regions; each province''s students henceforth to combine army, cadres and masses, soldiers and grass-roots people above all.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 453 (July 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, "Several provisions on the Mao Zedong Thought study classes run by the Center", July 4, 1969, sent out July 8 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 453 n.1). See [[cal.1969-07.china-leadership]]. Names: Mao Zedong. Check: the day; the book gives July, and the provisions are of July 4. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 29aff157
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 453: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 453 n.1: all'
