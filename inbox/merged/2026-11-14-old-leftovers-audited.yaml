- edit:
    id: cal.1961-01-24.rules
    base: b4250ec3
    set:
      c: 'The White House, the afternoon after the leaders'' breakfast. Kennedy has Rayburn back and asks him to put off the Rules Committee vote from Jan. 25 to Jan. 31. Rayburn, reluctant, agrees. Kennedy to O''Brien: "We can''t lose this one, Larry. The ball game is over if we do." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 105–06. See [[cal.1961-01.rules]]. Names: Kennedy, Rayburn, O''Brien.'
      src:
        c: fd7907be
        rows:
        - 'w.obrien-no-final-victories 105–06: all'
- check:
    id: cal.1968-03-24.elections-1968-2
    text: 'Check: the day. [[w.white-making-of-the-president-1969]], 113, has the meeting on Sunday, Mar. 24; [[w.obrien-no-final-victories]], 225–26, on Monday, Mar. 25, "later that afternoon," after Humphrey''s late lunch in his office. Both have O''Brien leave for Wisconsin on Wednesday, Mar. 27. Nothing read settles it; the Daily Diary and O''Brien''s papers not seen.'
