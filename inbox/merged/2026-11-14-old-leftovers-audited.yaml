    base: c661d5dc
    set:
      n: 'Press Conference of Senator John F. Kennedy, Lockheed Air Terminal, Burbank, CA, [APP](https://www.presidency.ucsb.edu/documents/press-conference-senator-john-f-kennedy-lockheed-air-terminal-burbank-ca) (Sept. 9, 1960). [[w.white-making-of-the-president]], 255–56; [[w.communications-freedom-of-communications-part]], 182–87 (Kennedy''s press conference at the Lockheed Air Terminal, Burbank, Sept. 9; the questions on Peale and religion, 183–84; the expected child, 185; not the hour). Check: whether White''s press conference "that afternoon in Los Angeles" is APP''s at the Burbank air terminal (not read). Check: the words and the order; [[w.communications-freedom-of-communications-part]], 185 prints Kennedy: "She told me. You would have to ask her.", and further questions after it, on the draft, Governor Brown''s forecast and Nixon (185–87). See [[cal.1960-09-08.elections-1960-kennedy-10]]. Names: Kennedy.'
