    text: 'Check: the paper. [[w.poole-joint-chiefs-of-staff]], 146 n.28, cites JCSM-461-61 to SecDef, July 12, 1961 (JCS 1907/321); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 155 n.54 (and n.16), JCSM-476-61, Lemnitzer for SecDef, July 12; FRUS 1961–63, XIV, doc. [67](https://history.state.gov/historicaldocuments/frus1961-63v14/d67) n.3, a JCSM-467-61, "Partial Mobilization," July 12. Whether one paper or several the pages do not settle; JCSM-471-61 is dated July 13 (FRUS 1961–63, XXI, doc. [118](https://history.state.gov/historicaldocuments/frus1961-63v21/d118)), so a 476 of July 12 is out of sequence.'
- check:
    id: cal.1968-08-24.elections-1968-chicago-3
    text: 'Check: the setting of the words. [[w.chester-american-melodrama]], 534–35, has Ginsburg say them to Gilligan in Geoghegan''s room at the Statler Hilton, after an hour''s study of the minority draft begun just before midnight. [[w.solberg-hubert-humphrey]], 352, has him alone on his hotel bed, the peace forces'' drafts beside his own and Edward Kennedy''s speech of "the night before" before him, the words before "the Saturday evening before the convention opened"; for the words Solberg cites Chester, 532 (in this copy they are at 535), so not an independent witness.'
