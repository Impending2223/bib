- edit:
    id: cal.1967-05-28.middle-east
    base: 0607f612
    set:
      time: 1967-05-28T13:00Z
      n: 'Barbour''s telegram 3834 from Tel Aviv, May 28, in FRUS 1964–68, XIX, doc. [89](https://history.state.gov/historicaldocuments/frus1964-68v19/d89), n. 3: the Cabinet''s decision "to postpone military action for few weeks." Made public: FRUS 1964–68, XIX (2004). [[w.drea-mcnamara-clifford-and-the-2011]], 434 (the afternoon of May 28; Johnson to Kosygin the same day, his "maximum effort" for moderation). The Cabinet''s meeting from 1500 local: Rostow to Johnson, CAP 67467, doc. 89. See [[cal.1967-05-16.middle-east]].'
