        n: 'Votes: [Wikipedia, "1962 Ohio gubernatorial election"](https://en.wikipedia.org/wiki/1962_Ohio_gubernatorial_election), from the Secretary of State''s official results (Check: [*Ohio Election Statistics*, 1961–1962](https://catalog.hathitrust.org/Record/000546832)). [[w.diemer-james-a-rhodes-ohio]]; [[w.peirce-megastates-of-america]]. Names: DiSalle, McElroy (K–J Cong. III.F); Rhodes (Opp. III.H).'
