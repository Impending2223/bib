        when: Sept. 1
        date: '1964-09-01'
        thread: governors
        also: [elections-1964]
        c: 'Michigan''s primary. Romney renominated, 583,356, 87.9 percent, over a former State senator. Representative Staebler, at large, the Democrat, unopposed.'
        n: 'Votes: [Wikipedia, "1964 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1964_Michigan_gubernatorial_election), from the [*Michigan Manual 1965–1966*, pp. 405–406](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179256&view=1up&seq=473) (Check: not read here). See [[cal.1962-11-06.governors-mi]]. Names: Romney (Opp. III.H).'
        tags: [state:mi, name:romney-george-w, name:staebler-neil-o]
  - add:
