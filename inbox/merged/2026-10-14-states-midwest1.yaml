patch: midwest1
by: agent
ops:
  # ------------------------------------------------------------------ Illinois
  - add:
      entry:
        id: cal.1960-04-12.governors-il
        when: Apr. 12
        date: '1960-04-12'
        thread: governors
        also: [elections-1960]
        c: 'Illinois, primaries for governor. Democratic: Kerner, a Cook County judge, slated by Daley''s organization, 649,253, 60.9 percent; Lohman, State treasurer, 21.8; Mitchell, once national chairman, 17.3. Republican: Stratton, seeking a third term, 499,365, 59.1; Hayes Robertson, 40.9.'
        n: 'Votes: [Ill. *Official Vote*, 1960, p. 77](https://archive.org/details/officialvote1960illi/page/n78). [[w.barnhart-kerner]]; [[w.kenney-political-passage]]; [[w.cohen-american-pharaoh]]. See [[cal.1960-04-12.elections-1960]]. Names: Kerner, Daley, Lohman, Mitchell, Stratton, Robertson (K–J Cong. III.F).'
        tags: [state:il, name:kerner-otto, name:daley-richard-j, name:lohman-joseph-d, name:mitchell-stephen-a, name:stratton-william-g, name:robertson-hayes]
  - add:
      entry:
        id: cal.1960-11-08.governors-il
        when: Nov. 8
        date: '1960-11-08'
        thread: governors
        also: [elections-1960]
        c: Illinois. Kerner (D) over Stratton (R), 2,594,731 to 2,070,479, 55.5 percent; Kennedy carries the State by fewer than 9,000 votes. Cook County. Ward (D) over State's Attorney Adamowski (R).
        n: 'Votes: [Ill. *Official Vote*, 1960, p. 16](https://archive.org/details/officialvote1960illi/page/n17); the State''s Attorney''s race is the county''s, not in the volume. [[w.barnhart-kerner]]; [[w.kenney-political-passage]]; [[w.kallina-courthouse-over-white-house]]; [[w.peirce-megastates-of-america]]. See [[cal.1960-04-12.governors-il]]; [[cal.1960-11-08.elections-1960]]. Names: Kerner, Stratton, Adamowski (K–J Cong. III.F); Ward (K–J Cong. III.K).'
        tags: [state:il, city:chicago, name:kerner-otto, name:stratton-william-g, name:kennedy-john-f, name:ward-daniel-p, name:adamowski-benjamin-s]
  - add:
      entry:
        id: cal.1960-12-09.elections-1960-chicago
        when: Dec. 9
        date: '1960-12-09'
        thread: elections-1960
        also: [states-and-cities]
        c: 'Chicago. The recount of the State''s Attorney''s race, which Adamowski asked and the Republicans meant as a test of the presidential count, ends. A county judge had ordered twenty-five teams of counters and every race on the ballots counted. Errors of ten votes or more in Kennedy''s favor in 3.1 percent of the precincts recounted, in Nixon''s 2.6. Ward''s election stands; Adamowski wins a second recount in 1961, his race alone.'
        n: '[[w.kallina-courthouse-over-white-house]], 114–117. See [[cal.1960-11-08.governors-il]]; [[cal.1960-12-19.elections-1960]]. Names: Adamowski (K–J Cong. III.F); Ward (K–J Cong. III.K); Nixon (Opp. III.E).'
        tags: [state:il, city:chicago, name:adamowski-benjamin-s, name:ward-daniel-p, name:kennedy-john-f, name:nixon-richard-m]
  - add:
      entry:
        id: cal.1962-11-06.state-constitutions-il
        when: Nov. 6
        date: '1962-11-06'
        thread: state-constitutions
        also: [court]
        c: 'Illinois. The Judicial Article, on the blue ballot, adopted: yes 2,166,917, no 1,121,237, a majority of the 3,812,120 voting at the election, as the constitution requires. One court system: the Supreme Court, appellate courts, and circuit courts; the justices of the peace and the lesser courts abolished. In force Jan. 1, 1964 (Check the terms and the date).'
        n: 'Votes: [Ill. *Official Vote*, 1962, p. 24](https://archive.org/details/officialvoteofst1962illi/page/n25). Check the article''s text and its effective date: Illinois Constitution of 1870, art. VI (1962). [[w.peirce-megastates-of-america]].'
        tags: [state:il]
  - add:
      entry:
        id: cal.1963-04-02.mayors-chicago
        when: Apr. 2
        date: '1963-04-02'
        thread: mayors
        also: [elections-1963]
        c: 'Chicago. Daley (D) re-elected to a third term over Adamowski (R), Cook County''s State''s Attorney 1957–60, 679,497 to 540,705, 55.7 percent. The primaries Feb. 26: Daley unopposed; Adamowski 90.5 percent. Adamowski''s charge: "we do not have one party-rule, we have one-man rule."'
        n: 'Votes: [Wikipedia, "1963 Chicago mayoral election"](https://en.wikipedia.org/wiki/1963_Chicago_mayoral_election), from the Board of Election Commissioners'' table of mayoral returns (Check: the Board''s canvass). [[w.cohen-american-pharaoh]]; [[w.royko-boss]]; [[w.biles-richard-j-daley]]; [[w.peirce-megastates-of-america]]. Names: Daley, Adamowski (K–J Cong. III.F).'
        tags: [state:il, city:chicago, name:daley-richard-j, name:adamowski-benjamin-s]
  - add:
      entry:
        id: cal.1963-07-01.legislatures-il
        when: July 1
        date: '1963-07-01'
        thread: legislatures
        c: 'Illinois. Kerner vetoes the Republican legislature''s map of the House''s districts, "unfair." Under the amendment of 1954, a commission of five from each party to draw the map, appointed Aug. 14; it deadlocks. Failing a map, the House to be elected at large.'
        n: '[Wikipedia, "1964 Illinois House of Representatives election"](https://en.wikipedia.org/wiki/1964_Illinois_House_of_Representatives_election), from the *Illinois Blue Book* and the press (Check: the veto message, *Journal of the House*, 1963). [[w.mcdowell-orange-ballot-election]]; [[w.barnhart-kerner]]; [[w.politics-of-reapportionment]]. Names: Kerner (K–J Cong. III.F).'
        tags: [state:il, name:kerner-otto]
  - add:
      entry:
        id: cal.1963-10-22.desegregation-schools-chicago
        when: Oct. 22
        date: '1963-10-22'
        thread: desegregation-schools
        also: [civil-rights-organizations]
        c: 'Chicago. "Freedom Day": the Coordinating Council of Community Organizations'' boycott of the public schools against Superintendent Willis, his mobile classrooms ("Willis Wagons") at Negro schools, and the schools'' segregation. Nearly half the city''s pupils stay out; some 10,000 march to the Board of Education. Willis had resigned in October over the board''s change to his transfer plan, and returned when the board gave way (Check the dates).'
        n: '[Wikipedia, "Chicago Public Schools boycott"](https://en.wikipedia.org/wiki/Chicago_Public_Schools_boycott) (Check: the Board of Education''s attendance figures). [[w.anderson-confronting-the-color-line]]; [[w.danns-something-better-for-our]]; [[w.ralph-northern-protest]]; [[w.cohen-american-pharaoh]]. Names: Willis (K–J Cong. III.K).'
        tags: [state:il, city:chicago, name:willis-benjamin-c]
  - add:
      entry:
        id: cal.1964-01-04.legislatures-il
        when: Jan. 4
        date: '1964-01-04'
        thread: legislatures
        c: 'Illinois Supreme Court, *People ex rel. Giannis v. Carpentier*, 30 Ill. 2d 24: Kerner''s veto of the House map valid, the commission having failed; the House of 177 to be elected at large in November. The legislature in special session provides for it; Kerner signs Jan. 29 (Check). Each party to nominate 118 by convention.'
        n: '*People ex rel. Giannis v. Carpentier*, [30 Ill. 2d 24](https://law.justia.com/cases/illinois/supreme-court/1964/38385-5.html) (1964) (Check the link). See [[cal.1963-07-01.legislatures-il]]. Names: Kerner (K–J Cong. III.F).'
        tags: [state:il, name:kerner-otto]
  - add:
      entry:
        id: cal.1964-02-25.desegregation-schools-chicago
        when: Feb. 25
        date: '1964-02-25'
        thread: desegregation-schools
        also: [civil-rights-organizations]
        c: 'Chicago. The Coordinating Council''s second boycott of the schools, against Willis. Fewer out than Oct. 22 (Check the figures and the date).'
        n: 'See [[cal.1963-10-22.desegregation-schools-chicago]]; [[cal.1964-02-03.desegregation-schools]]. Names: Willis (K–J Cong. III.K).'
        tags: [state:il, city:chicago, name:willis-benjamin-c]
  - add:
      entry:
        id: cal.1964-04-14.governors-il
        when: Apr. 14
        date: '1964-04-14'
        thread: governors
        also: [elections-1964]
        c: 'Illinois, Republican primary for governor. Percy, president of Bell & Howell, 626,111, 60.3 percent; William J. Scott, State treasurer, 388,903, 37.4. Kerner renominated unopposed.'
        n: 'Votes: [Ill. *Official Vote*, 1964, p. 171](https://archive.org/details/officialvoteof1964illi/page/n176). [[w.barnhart-kerner]]; [[w.peirce-megastates-of-america]]. See [[cal.1964-04-14.elections-1964]]. Names: Percy (Opp. III.B); Scott, Kerner (K–J Cong. III.F).'
        tags: [state:il, name:percy-charles-h, name:scott-william-j, name:kerner-otto]
  - add:
      entry:
        id: cal.1964-06-22.legislatures-il
        when: June 22
        date: '1964-06-22'
        thread: legislatures
        also: [court]
        c: '*Germano v. Kerner*, [378 U.S. 560](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378560/usrep378560.pdf), per curiam: the district court''s judgment for the Illinois Senate''s apportionment, which gave area weight, reversed and remanded under *Reynolds v. Sims*.'
        n: 'See [[cal.1964-06-15.court]]; [[cal.1964-01-04.legislatures-il]]. Names: Kerner (K–J Cong. III.F).'
        tags: [state:il, name:kerner-otto]
  - add:
      entry:
        id: cal.1964-11-03.governors-il
        when: Nov. 3
        date: '1964-11-03'
        thread: governors
        also: [elections-1964]
        c: 'Illinois. Kerner (D) re-elected over Percy (R), 2,418,394 to 2,239,095, 51.9 percent; Johnson carries the State. Percy carries 59 counties to Kerner''s 43.'
        n: 'Votes: [Ill. *Official Vote*, 1964, p. 14](https://archive.org/details/officialvoteof1964illi/page/n19). See [[cal.1964-04-14.governors-il]]; [[cal.1964-11-03.elections-1964-2]]. Names: Kerner (K–J Cong. III.F); Percy (Opp. III.B).'
        tags: [state:il, name:kerner-otto, name:percy-charles-h, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1964-11-03.legislatures-il
        when: Nov. 3
        date: '1964-11-03'
        thread: legislatures
        c: 'Illinois. The House elected at large on the orange "bedsheet" ballot, 33 inches long: 236 candidates for 177 seats, each voter choosing up to 177. All 118 Democrats elected, and 59 Republicans: the House from Republican to Democratic, two to one. Stevenson III, son of the governor of 1949–53, first among the Democrats.'
        n: 'Returns: *Illinois Blue Book, 1965–1966* (Check the page). [[w.mcdowell-orange-ballot-election]]. See [[cal.1963-07-01.legislatures-il]]. Names: Stevenson III (Cong. III.B).'
        tags: [state:il, name:stevenson-adlai-e-iii]
  - add:
      entry:
        id: cal.1965-10-01.desegregation-schools-chicago
        when: Oct. 1–6
        date: '1965-10-01'
        thread: desegregation-schools
        also: [school-aid, civil-rights-the-executive]
        c: 'Chicago. Keppel, after the Office of Education''s inquiry into the Coordinating Council''s complaint against the schools under Title VI, defers some $30 million of Chicago''s first grants under the Elementary and Secondary Education Act, Oct. 1. Released within the week, the Board of Education having agreed with HEW on corrective action. Civil rights leaders credit Daley''s call to Johnson. Dirksen asks an inquiry.'
        n: '*Harvard Crimson*, [Oct. 8, 1965](https://www.thecrimson.com/article/1965/10/8/keppels-release-of-chicago-funds-stirs/) (Check the day of the release). Dirksen''s papers: Keppel to Ray Page, Illinois Superintendent of Public Instruction, Sept. 20, 1965; Page to Keppel, Oct. 2 ([Dirksen Congressional Center](https://omekas-congress.lib.wvu.edu/catalog/EMD_Working_Papers-f358-1965_10_02)). [[w.anderson-confronting-the-color-line]]; [[w.cohen-american-pharaoh]]; [[w.danns-something-better-for-our]]. See [[cal.1963-10-22.desegregation-schools-chicago]]; [[cal.1965-04-11.school-aid]]. Names: Keppel (K–J Adm. III.G); Daley (K–J Cong. III.F); Johnson (K–J Adm. III.D); Dirksen (K–J Cong. III.A).'
        tags: [state:il, city:chicago, name:keppel-francis, name:daley-richard-j, name:johnson-lyndon-b, name:dirksen-everett]
  - add:
      entry:
        id: cal.1966-03-24.jobs-and-wages-il
        when: Mar. 24
        date: '1966-03-24'
        thread: jobs-and-wages
        also: [civil-rights-bill]
        c: 'Illinois Supreme Court, *Motorola, Inc. v. Illinois Fair Employment Practices Commission*: the Commission''s order reversed. Myart, a Negro applicant at Motorola''s plant in Franklin Park, Ill., July 1963; the Commission''s hearing examiner found his test score falsely recorded, and the five-minute ability test unfair to "the hitherto culturally deprived," and ordered it dropped. The examiner''s ruling, 1964, cited in the Senate''s debate on Title VII''s ability tests (Check).'
        n: '*Motorola, Inc. v. Illinois Fair Employment Practices Commission*, [34 Ill. 2d 266](https://static.case.law/ill-2d/34/cases/0266-01.json) (1966), under the Fair Employment Practices Act of 1961, Ill. Rev. Stat. 1963, ch. 48, pars. 851–66. [[w.chen-fifth-freedom]]. See [[cal.1964-07-02.civil-rights-bill]]. Names: Myart (K–J Cong. III.K).'
        tags: [state:il, name:myart-leon]
  # ------------------------------------------------------------------ Michigan
  - add:
      entry:
        id: cal.1960-08-02.governors-mi
        when: Aug. 2
        date: '1960-08-02'
        thread: governors
        also: [elections-1960]
        c: 'Michigan, Democratic primary for governor, Williams retiring after six terms: Swainson, lieutenant governor, 274,743, 50.8 percent; Hare, secretary of state, 205,086, 37.9; a Detroit councilman, 11.3. The Republican nominee of 1958 again, unopposed.'
        n: 'Votes: [Wikipedia, "1960 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1960_Michigan_gubernatorial_election), from the [*Michigan Manual 1961–1962*, pp. 399–400](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179231&view=1up&seq=471) (Check: not read here). [[w.glazer-wounded-warrior]]; [[w.noer-soapy]]. Names: Swainson, Hare (K–J Cong. III.F).'
        tags: [state:mi, name:swainson-john-b, name:hare-james-m, name:williams-g-mennen]
  - add:
      entry:
        id: cal.1960-11-08.state-constitutions-mi
        when: Nov. 8
        date: '1960-11-08'
        thread: state-constitutions
        c: 'Michigan. Proposal 3, an amendment changing the way a constitutional convention is called, adopted, 1,312,215 to 959,527, 57.8 percent: the question to go to the voters in April 1961, a majority of those voting on it to carry it. Also adopted, Proposal 2, raising the sales tax limit, 50.4 percent.'
        n: 'Votes: [Wikipedia, "List of Michigan ballot proposals"](https://en.wikipedia.org/wiki/List_of_Michigan_ballot_proposals), from the *Michigan Manual* (Check the terms and the figures). [[w.sturm-constitution-making-in-michigan]].'
        tags: [state:mi]
  - add:
      entry:
        id: cal.1961-11-07.mayors-detroit
        when: Nov. 7
        date: '1961-11-07'
        thread: mayors
        also: [elections-1961]
        c: 'Detroit. Cavanagh, a lawyer of 33 in his first race, over Mayor Miriani in the nonpartisan election, 200,413 to 158,778, 55.8 percent, by the unofficial count; second to Miriani in the primary of September. Negro voters largely for Cavanagh.'
        n: '*Pontiac Press*, [Nov. 8, 1961](https://our.oakland.edu/items/ffc24d06-2a3b-4d7c-b5dd-dc440fd8e6a4), p. 1 (Check: the city clerk''s canvass). [[w.fine-violence-in-the-model]]; [[w.sugrue-origins-of-the-urban]]; [[w.thompson-whose-detroit]]. Names: Cavanagh, Miriani (K–J Cong. III.F).'
        tags: [state:mi, city:detroit, name:cavanagh-jerome-p, name:miriani-louis-c]
  - add:
      entry:
        id: cal.1962-02-10.governors-mi
        when: Feb. 10
        date: '1962-02-10'
        thread: governors
        also: [elections-1962]
        c: 'Michigan. Romney declares for governor; two days later leaves the presidency of American Motors. To talk of his Mormon faith, Swainson, raised a Mormon: "I want to see the discussion of religion eliminated as a campaign matter."'
        n: '[Wikipedia, "1962 in Michigan"](https://en.wikipedia.org/wiki/1962_in_Michigan), from the *Detroit Free Press* (Check). [[w.harris-romneys-way]]; [[w.mollenhoff-george-romney]]; [[w.glazer-wounded-warrior]]. Names: Romney (Opp. III.H); Swainson (K–J Cong. III.F).'
        tags: [state:mi, name:romney-george-w, name:swainson-john-b]
  - add:
      entry:
        id: cal.1962-04-06.state-and-city-finance-detroit
        when: Apr. 6
        date: '1962-04-06'
        thread: state-and-city-finance
        c: 'Detroit. Cavanagh proposes a city income tax of 1 percent, on residents and on what nonresidents earn in the city; adopted by the Common Council. Swainson vetoes the legislature''s bill against taxing commuters. In force July 1.'
        n: '[Wikipedia, "1962 in Michigan"](https://en.wikipedia.org/wiki/1962_in_Michigan) (Check: the ordinance and the veto message). [[w.fine-violence-in-the-model]]. Names: Cavanagh, Swainson (K–J Cong. III.F).'
        tags: [state:mi, city:detroit, name:cavanagh-jerome-p, name:swainson-john-b]
  - add:
      entry:
        id: cal.1962-07-18.legislatures-mi
        when: July 18
        date: '1962-07-18'
        thread: legislatures
        also: [court]
        c: 'Michigan Supreme Court, *Scholle v. Secretary of State*, on remand after *Baker v. Carr*: the State Senate''s districts of 1952, from 55,806 people in the Upper Peninsula to 690,583 in Oakland County, void under the Equal Protection Clause; the Aug. 7 primary for the Senate called off, new districts ordered. July 27, Stewart stays the order until the Supreme Court can hear it.'
        n: '*Scholle v. Secretary of State*, 367 Mich. 176 (1962) (Check the cite). [Wikipedia, "1962 in Michigan"](https://en.wikipedia.org/wiki/1962_in_Michigan). [[w.politics-of-reapportionment]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]]. Names: Stewart (K–J Cong. III.G).'
        tags: [state:mi, name:stewart-potter]
  - add:
      entry:
        id: cal.1962-08-01.state-constitutions-mi
        when: Aug. 1
        date: '1962-08-01'
        thread: state-constitutions
        c: Michigan's constitutional convention adjourns at Lansing, its constitution and address to the people adopted, after ten months. A four-year term for governor; a civil rights commission; a flat-rate income tax permitted, a graduated one forbidden (Check); Senate seats by population and area. To the voters Apr. 1, 1963.
        n: '[[w.sturm-constitution-making-in-michigan]]; [[w.fine-expanding-the-frontiers-of]]. See [[cal.1961-10-03.states-and-cities]]. Names: Romney (Opp. III.H).'
        tags: [state:mi, name:romney-george-w]
  - add:
      entry:
        id: cal.1962-11-06.governors-mi
        when: Nov. 6
        date: '1962-11-06'
        thread: governors
        also: [elections-1962]
        c: Michigan. Romney (R) over Governor Swainson (D), 1,420,086 to 1,339,513, 51.4 percent, the first Republican elected governor since 1946.
        n: 'Votes: [Wikipedia, "1962 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1962_Michigan_gubernatorial_election), from the [*Michigan Manual 1963–1964*, pp. 416–417](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179249&view=1up&seq=457) (Check: not read here). Three debates, Oct. 10, 18 and 27 (texts, *Detroit News*). [[w.harris-romneys-way]]; [[w.mollenhoff-george-romney]]; [[w.glazer-wounded-warrior]]; [[w.peirce-megastates-of-america]]. See [[cal.1962-02-10.governors-mi]]; [[cal.1962-11-06.elections-1962]]. Names: Romney (Opp. III.H); Swainson (K–J Cong. III.F).'
        tags: [state:mi, name:romney-george-w, name:swainson-john-b]
  - add:
      entry:
        id: cal.1962-11-26.open-housing-detroit
        when: Nov. 26
        date: '1962-11-26'
        thread: open-housing
        c: Detroit. Cavanagh signs an ordinance forbidding real estate agents to solicit sales or rentals by saying that a neighborhood is changing in race, religion or nationality.
        n: '[Wikipedia, "1962 in Michigan"](https://en.wikipedia.org/wiki/1962_in_Michigan), from the *Detroit Free Press* (Check: the ordinance). [[w.sugrue-origins-of-the-urban]]; [[w.fine-expanding-the-frontiers-of]]. Names: Cavanagh (K–J Cong. III.F).'
        tags: [state:mi, city:detroit, name:cavanagh-jerome-p]
  - add:
      entry:
        id: cal.1963-04-01.state-constitutions-mi
        when: Apr. 1
        date: '1963-04-01'
        thread: state-constitutions
        c: 'Michigan''s new constitution ratified, 810,860 to 803,436, 50.2 percent. In force Jan. 1, 1964: the Civil Rights Commission among its creations.'
        n: 'Votes: [Wikipedia, "List of Michigan ballot proposals"](https://en.wikipedia.org/wiki/List_of_Michigan_ballot_proposals) (Check: the Board of State Canvassers'' certification, and the recount). [[w.sturm-constitution-making-in-michigan]]; [[w.fine-expanding-the-frontiers-of]]; [[w.harris-romneys-way]]. See [[cal.1962-08-01.state-constitutions-mi]]. Names: Romney (Opp. III.H).'
        tags: [state:mi, name:romney-george-w]
  - add:
      entry:
        id: cal.1963-06-23.king-detroit
        when: June 23
        date: '1963-06-23'
        thread: king
        also: [civil-rights-organizations]
        c: 'Detroit. The Walk to Freedom, called by the Detroit Council for Human Rights of the Reverends C. L. Franklin and Albert Cleage, on the twentieth anniversary of the riot of 1943: 125,000 or more down Woodward Avenue to Cobo Hall, King, Reuther, Cavanagh and Swainson at the head. Romney, keeping the Sabbath, sends a representative. King at Cobo Hall: "And so this afternoon, I have a dream."'
        n: '[Wikipedia, "Detroit Walk to Freedom"](https://en.wikipedia.org/wiki/Detroit_Walk_to_Freedom). Recording: *The Great March to Freedom* (Gordy, 1963) (Check). [[w.dillard-faith-in-the-city]]; [[w.sugrue-sweet-land-of-liberty]]; [[w.joseph-waiting-til-the-midnight]]; [[w.garrow-bearing-the-cross]]; [[w.branch-parting-the-waters]]. See [[cal.1963-08-28.march-on-washington]]. Names: King (K–J Cong. III.H); Reuther (K–J Cong. III.I); Cavanagh, Swainson (K–J Cong. III.F); Romney (Opp. III.H); Franklin, Cleage (K–J Cong. III.K).'
        tags: [state:mi, city:detroit, name:king-martin-luther-jr, name:reuther-walter, name:cavanagh-jerome-p, name:swainson-john-b, name:romney-george-w, name:franklin-c-l, name:cleage-albert-b-jr]
  - add:
      entry:
        id: cal.1963-09-11.state-and-city-finance-mi
        when: Sept. 11–Nov. 14
        date: '1963-09-11'
        thread: state-and-city-finance
        c: 'Michigan. The legislature in special session on Romney''s fiscal reform, a flat-rate income tax its center. Nov. 14, the program fails; the session adjourns. Romney: "the people of Michigan lost today." Check the votes and the date.'
        n: '*Michigan Daily*, Sept.–Nov. 1963 (Check). [[w.harris-romneys-way]]; [[w.mollenhoff-george-romney]]. See [[cal.1962-04-06.state-and-city-finance-detroit]]. Names: Romney (Opp. III.H).'
        tags: [state:mi, name:romney-george-w]
  - add:
      entry:
        id: cal.1963-11-10.black-nationalism-detroit
        when: Nov. 10
        date: '1963-11-10'
        thread: black-nationalism
        c: 'Detroit. Malcolm X, "Message to the Grass Roots," at the Northern Negro Grass Roots Leadership Conference, King Solomon Baptist Church, organized by Cleage and others: "Revolution is based on land"; the March on Washington taken over: "It became a picnic, a circus."'
        n: '[[w.malcolm-x-speaks]]; [[w.marable-malcolm-x]]; [[w.dillard-faith-in-the-city]]. See [[cal.1963-08-28.march-on-washington]]. Names: Malcolm X (K–J Cong. III.H); Cleage (K–J Cong. III.K).'
        tags: [state:mi, city:detroit, name:malcolm-x, name:cleage-albert-b-jr]
  - add:
      entry:
