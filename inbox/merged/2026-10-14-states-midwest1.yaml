        thread: governors
        also: [elections-1964]
        c: 'Indiana''s conventions name the candidates for governor. Republican, June 9: Lieutenant Governor Ristine, who broke the Senate''s tie for the sales tax, 55.3 percent of the delegates'' votes on the first ballot, over five others, Representative Bray among them. Democratic, June 12: Roger Branigin, a lawyer of Lafayette, Ind., 65.6 percent; Marshall Kizer, minority leader of the State Senate, 26.9.'
        n: '[Wikipedia, "1964 Indiana gubernatorial election"](https://en.wikipedia.org/wiki/1964_Indiana_gubernatorial_election), from *America Votes 6* and CQ (Check). Nov. 3, Branigin over Ristine, 1,164,620 to 901,342, 56.2 percent. [[w.peirce-great-lakes-states-of]]. See [[cal.1963-03-12.state-and-city-finance-in]]; [[cal.1964-05-05.elections-1964]]. Names: Ristine, Branigin, Kizer (K–J Cong. III.F).'
        tags: [state:in, name:ristine-richard-o, name:bray-william-g, name:branigin-roger-d, name:kizer-marshall-f]
