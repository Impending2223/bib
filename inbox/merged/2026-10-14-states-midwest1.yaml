        date: '1962-07-14'
        thread: transition-and-staff
        also: [mayors]
        c: Kennedy names Celebrezze, mayor of Cleveland since 1953, Secretary of HEW, July 14, Ribicoff leaving to run for the Senate in Connecticut. Nominated July 16; confirmed July 20; sworn July 31. Locher, the city's law director, mayor.
        n: '[Letter Accepting Resignation of Abraham Ribicoff as Secretary of Health, Education, and Welfare](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-abraham-ribicoff-secretary-health-education-and-welfare) (July 13, 1962); [Remarks at the Swearing In of Anthony J. Celebrezze as Secretary of Health, Education, and Welfare](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-anthony-j-celebrezze-secretary-health-education-and-welfare) (July 31, 1962). Names: Celebrezze, Ribicoff (K–J Adm. III.G); Locher (K–J Cong. III.K).'
