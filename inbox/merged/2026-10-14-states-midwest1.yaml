  - add:
      entry:
        id: cal.1966-09-01.states-and-cities-dayton
        when: Sept. 1
        date: '1966-09-01'
        thread: states-and-cities
        c: 'Dayton. Lester Mitchell, a Negro, shot dead from a passing car while sweeping the walk before his bar on West Fifth Street, early morning. Rioting in west Dayton through the day; Mayor Dave Hall asks Rhodes for the National Guard, in the city by 3 p.m. One dead, about 30 hurt, over 100 arrested.'
        n: '[Wikipedia, "1966 Dayton race riot"](https://en.wikipedia.org/wiki/1966_Dayton_race_riot), from the *Dayton Daily News* (Check). See [[cal.1966-07-18.states-and-cities]]. Names: Mitchell (K–J Cong. III.K); Hall (K–J Cong. III.F); Rhodes (Opp. III.H).'
        tags: [state:oh, city:dayton, name:mitchell-lester, name:hall-dave, name:rhodes-james-a]
