        when: Sept. 1
        date: '1964-09-01'
        thread: open-housing
        also: [state-constitutions]
        c: 'Detroit. The "Homeowners'' Rights Ordinance," an initiative securing an owner''s choice of buyer, tenant and agent, adopted with the primary, 137,671 to 114,743, 54.5 percent, over Cavanagh''s and Romney''s opposition. Held unconstitutional in the Wayne County Circuit Court (Check the case and date).'
        n: '*Pontiac Press*, [Sept. 2, 1964](https://our.oakland.edu/items/a8c68234-0a76-4b43-8408-656a4c862254) (AP; Check: the city clerk''s canvass). [[w.sugrue-origins-of-the-urban]]; [[w.fine-expanding-the-frontiers-of]]; [[w.fine-violence-in-the-model]]. See [[cal.1962-11-26.open-housing-detroit]]. Names: Cavanagh (K–J Cong. III.F); Romney (Opp. III.H).'
        tags: [state:mi, city:detroit, name:cavanagh-jerome-p, name:romney-george-w]
  - add:
      entry:
        id: cal.1964-11-03.governors-mi
        when: Nov. 3
        date: '1964-11-03'
        thread: governors
        also: [elections-1964, goldwater]
        c: 'Michigan. Romney (R) re-elected over Staebler (D), 1,764,355 to 1,381,442, 55.9 percent, Johnson carrying the State. Romney had refused to endorse Goldwater and kept off his platforms. The last two-year term.'
        n: 'Votes: [Wikipedia, "1964 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1964_Michigan_gubernatorial_election), from the [*Michigan Manual 1965–1966*, pp. 454–455](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179256&view=1up&seq=522) (Check: not read here). [[w.harris-romneys-way]]; [[w.mollenhoff-george-romney]]. See [[cal.1964-09-01.governors-mi]]; [[cal.1964-11-03.elections-1964-2]]. Names: Romney (Opp. III.H); Goldwater (Opp. III.B).'
        tags: [state:mi, name:romney-george-w, name:staebler-neil-o, name:johnson-lyndon-b, name:goldwater-barry-m]
