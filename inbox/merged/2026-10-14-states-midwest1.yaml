        when: Nov. 2
        date: '1965-11-02'
        thread: mayors
        also: [elections-1965]
        c: 'Cleveland. Locher (D) re-elected over Carl Stokes, a Negro State representative running as an independent: Locher 87,858, 36.7 percent; Stokes 87,716, 36.7; Ralph Perk (R), 41,045, 17.2; a fourth 9.5.'
        n: 'Votes: [Wikipedia, "1965 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1965_Cleveland_mayoral_election), from Our Campaigns (Check: the Cuyahoga County Board of Elections; the margin). [[w.moore-carl-b-stokes-and]]; [[w.weinberg-black-victory]]; [[w.stokes-promises-of-power]]; [[w.stradling-where-the-river-burned]]. See [[cal.1963-11-05.mayors-cleveland]]. Names: Locher (K–J Cong. III.K); Stokes, Perk (K–J Cong. III.F).'
        tags: [state:oh, city:cleveland, name:locher-ralph-s, name:stokes-carl-b, name:perk-ralph-j]
