        when: Jan. 30
        date: '1964-01-30'
        thread: desegregation-schools
        also: [civil-rights-organizations]
        c: 'Cleveland. The United Freedom Movement, some sixty Negro organizations formed in June 1963, against the schools'' practice of busing Negro pupils to schools where they are taught apart. At the Murray Hill School in Little Italy, white crowds stone Negroes in the streets through the day.'
        n: '[Wikipedia, "United Freedom Movement"](https://en.wikipedia.org/wiki/United_Freedom_Movement) (Check). [[w.moore-carl-b-stokes-and]]; [[w.frazier-harambee-city]]; [[w.davis-black-americans-in-cleveland]].'
        tags: [state:oh, city:cleveland]
  - add:
      entry:
        id: cal.1964-04-07.desegregation-schools-cleveland
        when: Apr. 7–20
        date: '1964-04-07'
        thread: desegregation-schools
        also: [civil-rights-organizations]
        c: 'Cleveland. The Reverend Bruce Klunder, of the United Freedom Movement and CORE, crushed by a backing bulldozer at the site of a new school on Lakeview Road, Glenville, protested as built to keep Negro pupils apart. A boycott of the schools, Apr. 20: some 60,000 Negro pupils out (Check the date and figure). Locher stands with the school board.'
        n: '[Wikipedia, "Bruce W. Klunder"](https://en.wikipedia.org/wiki/Bruce_W._Klunder); [Encyclopedia of Cleveland History, "Mayoral Administration of Ralph S. Locher"](https://case.edu/ech/articles/m/mayoral-administration-ralph-s-locher). [[w.frazier-harambee-city]]; [[w.moore-carl-b-stokes-and]]. See [[cal.1964-01-30.desegregation-schools-cleveland]]. Names: Klunder (K–J Cong. III.K); Locher (K–J Cong. III.K).'
        tags: [state:oh, city:cleveland, name:klunder-bruce-w, name:locher-ralph-s]
