        when: May 3
        date: '1966-05-03'
        thread: governors
        also: [elections-1966]
        c: 'Ohio, primaries for governor. Democratic: Frazier Reams Jr., a State senator, 326,419, 58.5 percent, over a Cleveland attorney. Republican: Rhodes renominated, 88.7.'
        n: 'Votes: [Wikipedia, "1966 Ohio gubernatorial election"](https://en.wikipedia.org/wiki/1966_Ohio_gubernatorial_election), from the Secretary of State''s official results (Check: [*Ohio Election Statistics*, 1965–1970](https://catalog.hathitrust.org/Record/000546832)). Nov. 8, Rhodes re-elected over Reams, 62.2 percent. [[w.diemer-james-a-rhodes-ohio]]. See [[cal.1962-11-06.governors-oh]]. Names: Reams (K–J Cong. III.F); Rhodes (Opp. III.H).'
