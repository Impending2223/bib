        when: June 22
        date: '1964-06-22'
        thread: legislatures
        c: 'Michigan Supreme Court, after *Reynolds v. Sims*: the Austin–Kleiner plan, the Democratic commissioners'' districts of equal population, ordered for the legislature in place of the Republican Hannah–Brucker plan it had ordered May 26. The new constitution''s weight to area set aside. The primary moved from August to Sept. 1.'
        n: 'Bernard Apol, [*Legislative Reapportionment in Michigan*](https://annarborchronicle.com/wp-content/uploads/2011/02/Apol-history-of-Michigan-reapportionment.pdf) (Public Sector Consultants, n.d.) (Check: the court''s order, *In re Apportionment of State Legislature—1964*, 372 Mich. 418). [[w.dixon-democratic-representation]]; [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1964-06-15.court]]; [[cal.1962-07-18.legislatures-mi]].'
        tags: [state:mi]
