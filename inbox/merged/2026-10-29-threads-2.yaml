patch: threads-2
by: Claude (thread statements, stage 6, agent 2)
ops:
- edit:
    id: cal.thread.berlin-and-vienna
    base: ca816c32
    set:
      c: The second Berlin crisis, from Khrushchev's demands to the wall and after, and the Vienna summit. Adenauer at the White House; the East German permits; Acheson's review; Bolshakov; Vienna and the aide-mémoire; the July 25 address and the call-up; Aug. 13; Johnson and Clay in Berlin; the negotiating program; Checkpoint Charlie; Powers for Abel; Fechter.
      c2: The second Berlin crisis, from Khrushchev's demands to the wall and after, and the Vienna summit. Kennedy in Berlin; Erhard and Schröder in Washington.
      c3: The second Berlin crisis, from Khrushchev's demands to the wall and after, and the Vienna summit. East Germany's passports and visas for West Germans; Rusk to Kuznetsov; Johnson to Kiesinger.
- edit:
    id: cal.thread.cities-and-housing
    base: de7c0314
    set:
      c: Housing, the cities, and urban transit. Logue to Boston; the Housing Act of 1961; the Urban Affairs department refused, by Rules and by the House, Weaver its secretary-to-be; the Lower Manhattan Expressway set aside.
      c2: Housing, the cities, and urban transit. The mass transit bill; Washington's rapid transit plan; Pennsylvania Station pulled down; the housing message; the Urban Mass Transportation Act; the Housing Act of 1964; Proposition 14; the message on the cities; New York's Landmarks Law; the Housing and Urban Development Act of 1965; the Department created; rent supplements struck.
      c3: Housing, the cities, and urban transit. Weaver to HUD; demonstration cities, the message and the act; rent supplements funded; the Douglas commission; the rat bill refused a rule; model cities and rent supplements cut in the appropriation; "The Crisis of the Cities"; New York's Urban Development Corporation; the Housing and Urban Development Act of 1968; the first report on the housing goals.
- edit:
    id: cal.thread.congo
    base: 180290bd
    set:
      c: 'The Congo from independence: its civil wars, and the UN''s war in Katanga. Independence; Katanga''s secession and the UN force; Lumumba in Washington; the plot against him; his dismissal, Mobutu, his capture; his death; Rumpunch; Hammarskjöld''s death; U Thant; Kitona; Elisabethville.'
      c2: 'The Congo from independence: its civil wars, and the UN''s war in Katanga. The end of secession; the pilots in Kivu; the UN''s departure; Tshombe prime minister; Stanleyville to the Simbas; the NSC for Tshombe''s mercenaries; Dragon Rouge; the Cairo embassy attacked; Mobutu''s coup.'
      c3: 'The Congo from independence: its civil wars, and the UN''s war in Katanga. The mercenaries'' mutiny; the C-130s and the Senators'' protests; the Republican Senators'' letter; the CIA-paid pilots.'
- edit:
    id: cal.thread.defense-soviet-forces
    base: fd204e47
    set:
      c: The intelligence community's estimates of the Soviet forces, an entry a document, dated by the record. NIE 11-8-59's 140–200 ICBMs for mid-1961; the three programs of 1960; 11-8-61's annex on the ICBM sites; 11-8/1-61's 10–25 launchers; 11-8-62's 50.
      c2: The intelligence community's estimates of the Soviet forces, an entry a document, dated by the record. NIE 11-4-63's 80–85 ICBM launchers; 11-8-63's 105–120; 11-8-64's 200; 11-8-65's 224; 11-14-65's 108 line divisions.
      c3: The intelligence community's estimates of the Soviet forces, an entry a document, dated by the record. NIE 11-8-66's 335 ICBM launchers and 670–765 for mid-1968; the missile submarines recounted; 11-8-68's 900.
- edit:
    id: cal.thread.elections-1965
    base: 98950c63
    set:
      c: 'The off-year elections of 1965: governors, mayors, legislatures. Cervantes in St. Louis; Yorty over Roosevelt; Bond to the Georgia House; Buckley in; Beame over Screvane; Nov. 2: Lindsay over Beame and Buckley, Godwin and Hughes governors, Locher over Stokes, Cavanagh and Barr re-elected, New York''s convention called; Schiro in New Orleans.'
- edit:
    id: cal.thread.elections-1966
    base: 93def8ee
    set:
      c: The primaries and midterms of 1966. Friends of Ronald Reagan organized; Buchanan to Nixon's staff.
      c3: 'The primaries and midterms of 1966. Lurleen Wallace; Reagan over Christopher; Spong over Robertson; Williams over Cavanagh; Clement over Bass; the Republicans'' all-Asian conference; Maddox; Valerie Percy''s murder; Nixon''s campaign and Johnson''s attack; Nov. 8: Republicans up 47 in the House, Percy, Brooke, Reagan; the Georgia governorship to the legislature, Maddox chosen; Reagan sworn.'
- edit:
    id: cal.thread.health
    base: 181bca71
    set:
      c: 'Health policy other than Medicare: drugs, tobacco, mental health, the health professions, Medicaid, birth control and abortion. Griswold''s clinic, the arrests and the convictions; thalidomide and Kelsey; the Drug Amendments.'
      c2: 'Health policy other than Medicare: drugs, tobacco, mental health, the health professions, Medicaid, birth control and abortion. The mental health and retardation message and acts; health professions; maternal and child health; *Smoking and Health*; the DeBakey commission; *Griswold v. Connecticut*; the cigarette labeling act; heart disease, cancer, and stroke.'
      c3: 'Health policy other than Medicare: drugs, tobacco, mental health, the health professions, Medicaid, birth control and abortion. Medi-Cal and Medicaid''s first States; Medicare in effect; the health planning and allied health acts; Colorado''s and California''s abortion laws; California''s mental health act; Medi-Cal''s cuts struck; the Social Security Amendments of 1967; "Health in America"; Cohen to HEW; the population committee; the Health Manpower Act; radiation control.'
- edit:
    id: cal.thread.immigration
    base: 470bca32
    set:
      c: Immigration and refugees, and the national-origins quotas' repeal. The 1960 message; the refugee resolution; Nixon on immigration; the Cuban refugee program; the 1961 amendments; the braceros extended; the Hong Kong parole; the refugee assistance act; the waiting lists cleared.
      c2: Immigration and refugees, and the national-origins quotas' repeal. The 1963 message; the 1965 message; the House, the Senate, and the act signed at Liberty Island; the Cuban refugees' notes and the airlift.
      c3: Immigration and refugees, and the national-origins quotas' repeal. The Cuban Adjustment Act; the quotas end; the refugee protocol to the Senate; Clark on expatriation after *Afroyim*.
- edit:
    id: cal.thread.march-on-washington
    base: d85cd015
    set:
      c: The March on Washington for Jobs and Freedom, Aug. 28, 1963, and its planning. Randolph's plan; the leaders' first joint meeting; Diggs's letter; Rustin's plan; Gallup; the March.
- edit:
    id: cal.thread.opinion
    base: ad4226c3
    set:
      c: The public's view, by the polls as released, Gallup's chiefly. Kennedy and Nixon, 1960; approval (each month's table gives every reading); the summit, space, missiles; school aid; Cuba; the Freedom Riders and integration; Berlin, testing, fallout shelters; a Catholic or a Jew for President; the race for 1964, Nixon, Rockefeller, Goldwater; the John Birch Society; Medicare; the steel prices; the most important problem; the missile crisis.
      c2: The public's view, by the polls as released, Gallup's chiefly. Approval (each month's table gives every reading); Cuba; the race for 1964, Rockefeller, Goldwater, Kennedy, then Johnson, Lodge, Scranton; integration, the March, the civil rights laws; the test ban; a Catholic, a Jew, a woman for President; the assassination; the most important problem; Vietnam; the party after Goldwater; Santo Domingo; the race for 1968 begun.
      c3: The public's view, by the polls as released, Gallup's chiefly. Approval (each month's table gives every reading); the most important problem; Gallup and Harris on the war, hawks and doves, the war a mistake, the bombing halt; the midterms; integration, the riots; the Six-Day War; the surcharge; a Mormon for President; the race for 1968, Romney, Nixon, Rockefeller, Reagan, Robert Kennedy against Johnson, McCarthy, Humphrey, Wallace; the Chicago police; the final poll; the Electoral College.
- edit:
    id: cal.thread.republican-party-congress
    base: 0bbbdf28
    set:
      c: 'The Republicans in the House and the Senate: their leaders, conferences, committees and papers, and their members'' word on policy and politics. The House leaders and the civil rights petition; Javits against Goldwater at the Senatorial Committee; the Joint Committee on Republican Principles'' declaration; Laird on Laos; Capehart for invading Cuba; the House caucus on Cuba; Keating''s missile bases; Van Zandt on the quarantine.'
      c2: 'The Republicans in the House and the Senate: their leaders, conferences, committees and papers, and their members'' word on policy and politics. Ford conference chairman over Hoeven; the joint leadership on Kennedy''s foreign policy; Dirksen and Halleck on the civil rights bill; Wilson against the "Kennedy Klan"; Halleck''s votes in Judiciary; the conference against the petition; Dirksen''s amendments; the conference''s statement on foreign policy; Ford over Halleck for minority leader; the leadership behind the strikes on the North; Laird''s warning on Republican support; the white paper on Vietnam; Morton on the Birch Society.'
      c3: 'The Republicans in the House and the Senate: their leaders, conferences, committees and papers, and their members'' word on policy and politics. The leaders'' line on the Democrats'' division over the war; the conference''s paper of 1966; Murphy over Scott at the Senatorial Committee; the freshman Senators on *Meet the Press*; Javits''s turn on the war; Percy''s home ownership plan; Percy, Javits and Scott for a settlement; the Policy Committee''s staff paper and Tower''s word on it; Ford at Bowling Green; Morse and Stafford''s staged de-escalation; the *Pueblo*; Griffin against Warren''s successor; Dirksen leader, Scott whip.'
- edit:
    id: cal.thread.rules
    base: ca45b2e8
    set:
      c: 'Majority rule in each chamber: the Rules Committee, cloture, the leaders. Johnson''s bid to keep the Democratic conference''s chair; the Rules Committee enlarged; Rule XXII kept; Rayburn''s absence; cloture refused on the literacy test, invoked on the satellite bill.'
      c2: 'Majority rule in each chamber: the Rules Committee, cloture, the leaders. The Rules Committee kept at fifteen; the three-fifths rule refused, 1963; Clark''s Senate establishment; Pastore''s germaneness rule; the 21-day rule restored, 1965.'
      c3: 'Majority rule in each chamber: the Rules Committee, cloture, the leaders. The 14(b) filibuster; the 21-day rule dropped; three-fifths refused again, 1967; McCormack over Udall; Humphrey''s ruling on cloture reversed, 1969.'
- edit:
    id: cal.thread.school-aid
    base: 762a53af
    set:
      c: 'Federal aid to education: the defeats of 1960 and 1961, the acts of 1963 and 1965, and their amendments. The 1960 bill passed by both Houses and held in Rules; the 1961 message; Bush''s integration amendment tabled; the Rules Committee''s 8–7; Calendar Wednesday refused; the 1962 message; the college bill recommitted.'
      c2: 'Federal aid to education: the defeats of 1960 and 1961, the acts of 1963 and 1965, and their amendments. The omnibus bill; the college facilities and vocational acts; the Library Services and Construction Act; the NDEA amendments; the 1965 message; Powell''s absence; the Elementary and Secondary Education Act; Gardner to HEW; Chicago''s funds deferred; the Higher Education Act.'
      c3: 'Federal aid to education: the defeats of 1960 and 1961, the acts of 1963 and 1965, and their amendments. The Cold War GI Bill; the 1966 amendments and the guidelines; the message on children and youth; the Teacher Corps extended; the Elementary and Secondary Education Amendments of 1967, bilingual education; "The Fifth Freedom"; the Florida teachers'' walkout; *Flast v. Cohen*; the Higher Education Amendments of 1968; the District''s elected board.'
- edit:
    id: cal.thread.soviet-union
    base: e27a4e8d
    set:
      c: The Soviet Union apart from Berlin, Cuba and testing. Khrushchev's troop cut; the U-2 and the Paris summit; the RB-47; Khrushchev at the UN; Menshikov's approaches; the RB-47 fliers freed; the private letters; the Twenty-Second Congress; Adzhubei; the space talks and the exchanges agreement; Dobrynin; Udall and Frost with Khrushchev; Bolshakov's October message.
      c2: The Soviet Union apart from Berlin, Cuba and testing. Khrushchev's paper to Robert Kennedy; Mikoyan with Johnson; Walton's message through Bolshakov; Khrushchev removed; Kosygin in Hanoi and Peking; the Moscow embassy attacked; Dobrynin on a pause.
      c3: The Soviet Union apart from Berlin, Cuba and testing. Luna 9; "peaceful engagement" and Brezhnev's answer; Gromyko at the White House; the outer space treaty; the consular convention; Alliluyeva; the hot line in the Six-Day War; the *Turkestan*; Glassboro; the nonproliferation treaty; the missile talks agreed; Czechoslovakia invaded; the summit sought again; Brezhnev at Warsaw.
- edit:
    id: cal.thread.succession
    base: 17a4c876
    set:
      c: Johnson's first weeks, and the succession amended. The oath; Eisenhower's counsel; the first meeting on Vietnam; NSAM 273; the joint session; the first news conference; the budget cut; Bayh's hearings; the disability amendment in the Senate; the disability message; the Twenty-fifth Amendment through Congress; Johnson's gall bladder removed.
      c3: Johnson's first weeks, and the succession amended. The Amendment before the States; Johnson's second operation; the Amendment ratified and certified.
- edit:
    id: cal.thread.transition-and-staff
    base: 3c68a621
    set:
      c: The administrations' people and organization, and the transitions of 1960–61 and 1968–69. The first appointments; Key Biscayne; Clifford's and Neustadt's reports; the cabinet named; the OCB abolished; Taylor at the White House; Bowles; McCone for Dulles; the Thanksgiving reshuffle; Joseph Kennedy's stroke; Hoover's lunch; Celebrezze for Ribicoff; Taylor to the Joint Chiefs.
      c2: The administrations' people and organization, and the transitions of 1960–61 and 1968–69. Gronouski for Day; Johnson's first Cabinet; Sorensen leaves, Rowan for Murrow; Shriver; Hoover kept past seventy; Taylor for Lodge; Robert Kennedy resigns; Heller and Hodges go; the inauguration; Katzenbach; Fowler for Dillon; Raborn for McCone; the ethics order; Lodge for Taylor; Stevenson's death, Goldberg to the UN; Gardner; O'Brien and Gronouski.
      c3: The administrations' people and organization, and the transitions of 1960–61 and 1968–69. NSAM 341; Rostow; Helms for Raborn; Katzenbach for Ball; Boyd at Transportation; Ramsey Clark; Clifford for McNamara; Cohen for Gardner; Ball for Goldberg; the transition plans; Nixon at the White House; Kissinger; Nixon's Cabinet; the new NSC system; Nixon's inauguration.
- edit:
    id: cal.thread.war-opposition
    base: b3447d93
    set:
      c: 'Opposition to the war outside the government: its campaigns, marches and draft resistance, and the laws, inquiries and surveillance they met. The ministers'' petition; King at Howard; Hoover to Dodd''s subcommittee; the McComb leaflet; the Assembly of Unrepresented People; the draft-card act; King with Goldberg at the UN; Dodd''s study of the teach-ins; the October demonstrations in the Senate and the House.'
      c3: 'Opposition to the war outside the government: its campaigns, marches and draft resistance, and the laws, inquiries and surveillance they met. Clergy and Laymen Concerned at the White House; King at Beverly Hills, Chicago and Riverside Church; the Spring Mobilization; Negotiations Now!; Century City; the New Politics conference; Stop the Draft Week; the March on the Pentagon; the CIA''s report on the peace movement; Hayden and the three prisoners; the Boston indictments; the Jeannette Rankin Brigade; Catonsville; the flag desecration act; Chicago''s streets.'
