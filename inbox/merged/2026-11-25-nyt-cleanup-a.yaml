      c: 'Murray Snyder, Assistant Secretary of Defense for Public Affairs, on the RB-47: "We know that there are no overflights"; were it so, "it would not be deliberate." Reconnaissance flights over the Soviet Union stopped after the U-2.'
      n: 'Arthur J. Olsen, "Arctic Search Is Pressed for U.S. Plane Carrying 6," [*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 2. See [[cal.1960-07-01.soviet-union]]. Names: Snyder.'
      tags:
      - name:snyder-murray
