      - oil
      c: 'Foreign Office, by a spokesman: Britain takes a serious view of Cuba''s seizure of the Shell refinery, "actively considering what steps should be taken." Consultation with the United States on the three seizures has gone on through the week.'
      n: '"Cuban Seizure Studied," [*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html). See [[cal.1960-07-01.cuba]].'
