- edit:
    id: cal.1960-07-02.elections-1960-2
    base: 0bc6c7af
    set:
      n: '[[w.sorensen-kennedy]], 151–52; [[w.clifford-counsel-to-the-president-2]], 321; [[w.wofford-of-kennedys-and-kings]], 49 (July 2, Truman on television against Kennedy; Symington, Johnson, Bowles, Meyner and "several others"; "be patient"; not the quotations or the number); [[w.odonnell-johnny-we-hardly-knew]], 201 (the televised press conference of July 2: Kennedy "too young" and "not quite ready," the convention "prearranged"; Symington, Johnson, Meyner and Bowles preferred, Stevenson "pointedly" excluded). Donald Janson, "Truman Charges Kennedy Backers Run Convention," [*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 19; "Transcript of Truman News Conference," [*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 18. Check: Clifford gives Kennedy''s answer ("If fourteen years in major elective office is insufficient experience ...") without its day. Reply: [[cal.1960-07-04.elections-1960]]. Names: Truman, Symington, Johnson, Bowles, Kennedy.'
