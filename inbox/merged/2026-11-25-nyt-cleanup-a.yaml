- add:
    entry:
      id: cal.1960-07-02.soviet-union-3
      when: July 2
      date: '1960-07-02'
      place: wiesbaden
      thread: soviet-union
      also:
      - defense
      c: 'Norwegian and American planes search the Barents and Norwegian Seas for the RB-47, the search directed from Bodø and Bardufoss. Air Force headquarters at Wiesbaden, late at night: no trace; the plane presumed down north of Norway; an approach to Soviet territory "unlikely."'
      n: 'Arthur J. Olsen, "Arctic Search Is Pressed for U.S. Plane Carrying 6," [*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1. The time: late at night. See [[cal.1960-07-01.soviet-union]].'
