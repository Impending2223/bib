      id: cal.1961-10.vietnam-force-levels
      when: Oct.
      date: 1961-10
      thread: vietnam-force-levels
      c: 'Kennedy to Krock: American troops have no business on the Asian mainland; nor should the United States interfere "in civil disturbances created by guerrillas." He is stalling the military by sending Taylor and Rostow to look at South Vietnam. By Krock''s account.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 704. To check: [[w.krock-in-the-nation]], 324–25, 447 (cited by [[w.schlesinger-robert-kennedy-and-his]], 704 n.16). Check: the day. Names: Kennedy, Krock, Taylor, Rostow.'
      tags:
      - name:kennedy-john-f
      - name:krock-arthur
      - name:taylor-maxwell
      - name:rostow-walt-w
      also:
      - vietnam
      src:
