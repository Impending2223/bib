- add:
    entry:
      id: cal.1961-10.cuba
      when: Oct.
      date: 1961-10
      thread: cuba
      c: 'The Special Group asks for a contingency plan should Castro die, from whatever cause. The CIA''s Board of Estimates: his death "by assassination or by natural causes ... would almost certainly not prove fatal to the regime," and would probably strengthen the Communists'' position in Cuba.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 489. To check: Church committee, *Alleged Assassination Plots Involving Foreign Leaders*, S. Rep. No. 94-465, 136–37 (1975) (cited by [[w.schlesinger-robert-kennedy-and-his]], 489 n.80). Check: the days of the request and of the reply. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: cb6f62f6
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 489: all'
        - 'via w.schlesinger-robert-kennedy-and-his 489 n.80: all'
