      when: May 4
      date: '1961-05-04'
      thread: intelligence
      c: Kennedy revives Eisenhower's Board of Consultants as the President's Foreign Intelligence Advisory Board, by executive order. Killian chairman, Clifford a member. To meet with him May 15.
      n: 'Letter to Members of the President''s Foreign Intelligence Advisory Board, [1961 Pub. Papers 352](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=410) (May 4, 1961). [[w.schlesinger-robert-kennedy-and-his]], 458. To check: Clark Clifford, interview, *Christian Science Monitor*, July 24, 1975; Clifford, oral history interview by L. J. Hackman, Dec. 17, 1974, 10, JFK Library (cited by [[w.schlesinger-robert-kennedy-and-his]], 458 n.52); Deborah Shapley, "Foreign Intelligence Advisory Board: A Lesson in Citizen Oversight?" *Science*, Mar. 12, 1976 (cited by [[w.schlesinger-robert-kennedy-and-his]], 458 n.53). Names: Kennedy, Eisenhower, Killian, Clifford.'
      tags:
