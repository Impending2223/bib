      when: Mar. 28
      date: '1961-03-28'
      thread: robert-kennedy
      c: 'Robert Kennedy to Peter Maas, *Look*, "Robert Kennedy Speaks Out": "I don''t think we would ever come to the point of sending troops. ... I cannot conceive of this administration''s letting such a situation deteriorate to that level."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 294. To check: Peter Maas, "Robert Kennedy Speaks Out," *Look*, Mar. 28, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 294 n.39). Check: the issue''s date. Names: Robert Kennedy.'
