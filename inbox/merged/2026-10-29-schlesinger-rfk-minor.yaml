      n: '[[w.schlesinger-robert-kennedy-and-his]], 310. To check: Robert Kennedy to Mrs. Franklin D. Roosevelt, May 22, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 310 n.123). Names: Robert Kennedy, Eleanor Roosevelt.'
