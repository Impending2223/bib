      when: Sept. 24
      date: '1961-09-24'
      thread: robert-kennedy
      c: 'Robert Kennedy on *Meet the Press*, asked by Reston about information sought by Congress: Justice has recommended the departments give it; executive privilege perhaps in some instance, but Congress the check on the executive. "We will lean over backwards to make sure that they get the information they request."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 380–81. To check: *Meet the Press*, Sept. 24, 1961, vol. 5, no. 37, 7 (cited by [[w.schlesinger-robert-kennedy-and-his]], 381 n.51). Names: Robert Kennedy, Reston.'
