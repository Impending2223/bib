      when: Oct. 24
      date: '1961-10-24'
      thread: cuba
      c: 'Miró Cardona to Schlesinger: he can fight Castro, the corruption of the past and Prío; if he has to fight the CIA too, "I declare myself vanquished." By Schlesinger''s journal.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 476. To check: Schlesinger, journal, Oct. 24, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 476, the footnote). Names: Miró Cardona, Schlesinger, Castro.'
      tags:
