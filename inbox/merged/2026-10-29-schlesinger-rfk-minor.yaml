- add:
    entry:
      id: cal.1961-01-05.soviet-union
      when: Jan. 5
      date: '1961-01-05'
      thread: soviet-union
      c: Bruce, named through Rusk to coordinate Menshikov's approaches to the President-elect's circle, lunches with him at the Soviet residence. Khrushchev wants an early meeting with Kennedy, before Adenauer and Macmillan; disarmament and Berlin, Khrushchev "flexible"; a Kennedy emissary to Moscow. Menshikov hands him an unofficial paper.
      n: 'Bruce''s diary, [FRUS 1961–63, V, doc. 2](https://history.state.gov/historicaldocuments/frus1961-63v05/d2) (Jan. 5, 1961). [[w.schlesinger-robert-kennedy-and-his]], 422 (the paper). See [[cal.1960-12-12.soviet-union]]. Names: Bruce, Rusk, Menshikov, Khrushchev, Kennedy, Adenauer, Macmillan.'
