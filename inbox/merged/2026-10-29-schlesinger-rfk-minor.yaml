      when: Feb.
      date: 1961-02
      thread: civil-rights-the-executive
      c: 'Hickory Hill, an evening. Katzenbach brings the order creating the Committee on Equal Employment Opportunity for Robert Kennedy to sign and give the President, there for dinner; Kennedy questions him on it. Robert Kennedy: "Why don''t you sign it and give it to me?" By Katzenbach''s account.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 290. To check: Nicholas Katzenbach, oral history interview by Anthony Lewis, Nov. 16, 1964, 34–35, JFK Library (cited by [[w.schlesinger-robert-kennedy-and-his]], 290 n.15). Check: the day. The order: [[cal.1961-03-06.civil-rights-the-executive]]. Names: Katzenbach, Robert Kennedy, Kennedy.'
      tags:
      - name:katzenbach-nicholas
      - name:kennedy-robert-f
      - name:kennedy-john-f
      also:
      - robert-kennedy
      src:
        c: 9c13634f
        rows:
