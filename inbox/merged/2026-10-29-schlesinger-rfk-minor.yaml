      when: Jan. 18
      date: '1962-01-18'
      thread: defense
      c: 'NSAM 124 establishes the Special Group (Counter-Insurgency): the President''s military representative, Taylor, chairman; the Attorney General, the Deputy Under Secretary of State, the Deputy Secretary of Defense, the Chairman of the Joint Chiefs, the Director of Central Intelligence, Bundy and the AID administrator. Subversive insurgency, "wars of liberation," to be recognized as "a major form of politico-military conflict equal in importance to conventional warfare."'
      n: '[NSAM No. 124](https://history.state.gov/historicaldocuments/frus1961-63v08/d68) (Jan. 18, 1962). [[w.schlesinger-robert-kennedy-and-his]], 461 (Taylor; Robert Kennedy a member). To check: Special Group (Counterinsurgency), "Memorandum for the Record," May 13, 1964, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 461 n.59). Names: Kennedy, Taylor, Robert Kennedy, Bundy.'
      tags:
