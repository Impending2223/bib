- add:
    entry:
      id: cal.1961-11-13.vietnam
      when: Nov. 13
      date: '1961-11-13'
      thread: vietnam
      c: 'Kennedy to Schlesinger on combat troops: "The troops will march in; the crowds will cheer; and in four days everyone will have forgotten. Then we will be told that we have to send in more troops. It is like taking a drink. The effect wears off, and you have to take another." By Schlesinger''s journal.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 705. To check: Schlesinger, journal, Nov. 13, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 705 n.21). Check: the day of the talk (the journal''s). Names: Kennedy, Schlesinger.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      src:
        c: 3449d678
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 705: all'
        - 'via w.schlesinger-robert-kennedy-and-his 705 n.21: all'
    section: '196111'
- add:
    entry:
      id: cal.1961-12.antisubversion
      when: Dec.
      date: 1961-12
      thread: antisubversion
      c: 'Robert Kennedy to Henry Brandon of the London *Sunday Times*: "It is such nonsense to have to waste time prosecuting the Communist Party. It couldn''t be more feeble and less of a threat, and besides its membership consists largely of FBI agents."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 262. To check: Schlesinger, journal, Dec. 4, 1961 (Brandon''s account); the FBI''s file of the clipping sent to Hoover and his reply, released Mar. 5, 8, 1962 (cited by [[w.schlesinger-robert-kennedy-and-his]], 262 n.4). Made public: Brandon in the *Sunday Times* (Check: the day). Check: the day of the talk (by Dec. 4). Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      also:
      - robert-kennedy
      src:
