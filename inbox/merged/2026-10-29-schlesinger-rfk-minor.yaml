      id: cal.1961-11-11.king
      when: Nov. 11
      date: '1961-11-11'
      thread: king
      c: 'King, a "Dear Friend" letter for funds: the movement labors on many fronts; "The central front, however, we feel is that of suffrage," the vote "the concrete tool with which we ourselves can correct injustice."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 302. To check: King, "Dear Friend" fund-raising letter, Nov. 11, 1961, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 302 n.85). Names: King.'
