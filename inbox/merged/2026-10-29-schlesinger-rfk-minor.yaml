    entry:
      id: cal.1960-08.civil-rights-the-executive
      when: Aug.
      date: 1960-08
      thread: civil-rights-the-executive
      c: 'A morning. Kennedy picks up Wofford, his campaign man on civil rights, in his convertible: "Now, in five minutes, tick off the ten things that a President ought to do to clean up this goddamn civil rights mess." By Wofford''s account.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 287–88. To check: Harris Wofford, oral history interview by Berl Bernhard, Nov. 29, 1965, 10–11, JFK Library (cited by [[w.schlesinger-robert-kennedy-and-his]], 288 n.3). Check: the day. Names: Kennedy, Wofford.'
      tags:
