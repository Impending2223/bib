      c: 'Omaha, the day before the Nebraska primary. Robert Kennedy at Creighton, asked whether military service is not a way out of the ghetto: "how can you say that we can deal with the problems of the poor by sending them to Vietnam?" Forty-five percent of a paratroop regiment in Vietnam black, he says. His last Nebraska speech in the Negro section of Omaha, in the rain.'
