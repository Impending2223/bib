      when: Sept. 22
      date: '1961-09-22'
      thread: berlin-and-vienna
      c: 'James Wechsler, *New York Post*, "JFK (Contd.)," after an interview: Kennedy "disturbed by the frustrated fury of many of his countrymen who believe our national manhood can be affirmed only by some act of bloody bluster"; "Caught in the crossfire of Russian intransigence and domestic Know-nothingism," he is "both keeping his head and sustaining his nerve."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 431. To check: James Wechsler, "JFK (Contd.)," *New York Post*, Sept. 22, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 431 n.64). Check: the day of the interview. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
