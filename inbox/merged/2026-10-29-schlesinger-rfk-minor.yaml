      when: Jan.
      date: 1961-01
      thread: crime-and-hijacking
      c: Courtney Evans, the FBI's liaison, briefs Robert Kennedy on the procedures for wiretaps, each needing the Attorney General's written authorization. Nothing said of microphones, which by Evans's understanding need none.
      n: '[[w.schlesinger-robert-kennedy-and-his]], 273. To check: Evans to Robert Kennedy, Feb. 17, 1966, printed in [[w.toledano-j-edgar-hoover]], 318–19 (cited by [[w.schlesinger-robert-kennedy-and-his]], 273 n.46); Evans, testimony, Church committee, *Hearings*, vol. 6, 166 (1975) (cited by [[w.schlesinger-robert-kennedy-and-his]], 273 n.45). Check: the day. Names: Evans, Robert Kennedy.'
