    remove:
    - cal.1966-10-06.vietnam-asian-trip
    why: Both entries are parts of the news conference of 3 p.m. (1966 Pub. Papers 1117–24). The trip entry holds the posts and Manila (1117), the box score (1120) and the itinerary and Mrs. Johnson (1123); the Demonstration Cities answer is at 1119–20. So part of the trip entry comes before the Cities answer and part after it, and the link puts the whole entry first. Until the trip entry is split into its acts, neither order holds for the whole.
- edit:
    id: cal.1966-10-06.vietnam-asian-trip
    base: 993ddf86
    set:
      time: 1966-10-06T19:00Z
      time_zone: America/New_York
      n: '[1966 Pub. Papers 1117](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=491), at 1117 (the posts; Manila), 1120 (the box score), 1123 (the itinerary; Mrs. Johnson; not the miles, the refueling stop in Alaska or "the important business"). [[w.johnson-white-house-diary]], 428–29 (Lady Bird Johnson''s account; Bunker "Ambassador to the government of Vietnam," against the transcript). The hour is the news conference''s, 3 p.m. (1124). Names: Johnson, Thompson, Bunker, Lady Bird Johnson. Check: Bunker''s post.'
- edit:
    id: cal.1966-10-15.vietnam
    base: bb88b4d1
    set:
      time: 1966-10-15T18:10Z
      time_zone: America/New_York
      n: '[FRUS 1964–68, IV, doc. 272](https://history.state.gov/historicaldocuments/frus1964-68v04/d272). The session with the President began at 2:10 p.m., the NSC at 2:40: doc. 272 and its n.2 (the President''s Daily Diary). [[w.gibbons-u-s-government-and]], IV, 462–63, 471; [[w.drea-mcnamara-clifford-and-the-2011]], 79 (Johnson, Humphrey, McNamara, Vance and Wheeler on the differences between the Chiefs and McNamara); [[w.dallek-flawed-giant]], 383, 387 (the NSC meeting of Oct. 15: the administrative compromise between military and civilian authorities given 90 to 120 days before the program is put fully under military control; McNamara: pacification to date a "basic disappointment" (383); Oct. 15, to McNamara and Wheeler: limits on bombing around Hanoi and Haiphong held, new targets agreed (387)). See [[cal.1966-10-10.vietnam]]. Names: McNamara, Wheeler, Johnson, Humphrey, Vance, Rusk, Lodge.'
