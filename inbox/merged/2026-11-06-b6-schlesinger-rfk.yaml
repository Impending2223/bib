      c: 'Nixon, on Robert Kennedy''s entry, to Richard Whalen: the Democratic split a "great, historic opportunity"; Kennedy will not beat the President, "Johnson could take the war away from him in a minute"; twice Johnson''s "poor health": "Bobby may kill him." If Kennedy is nominated, "We can beat that little S.O.B."'
