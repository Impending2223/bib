    item: '[[w.schlesinger-robert-kennedy-and-his]], 869 (later that day, with Pearson and David Karr: the "partnership" with John Kennedy; bitter about Robert Kennedy, blaming him for the Bay of Pigs, where the credibility gap began; Karr found it "terrifying")'
