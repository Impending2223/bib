      date: '1961-04-05'
      thread: berlin-and-vienna
      c: 'Acheson, during Macmillan''s visit, alarms him with his line on Berlin: the most conspicuous preparations for a military showdown, a national emergency proclaimed; merely to propose negotiations an admission of weakness. Harriman to Schlesinger: "How long is our policy to be dominated by that frustrated and rigid man? He is leading us down the road to war." By Schlesinger''s journal.'
