      when: June 20
      date: '1963-06-20'
      thread: civil-rights-the-executive
      c: 'After Medgar Evers''s murder, Kennedy to Schlesinger: "I don''t understand the South. I''m coming to believe that Thaddeus Stevens was right." He had been taught to regard Stevens as "a man of vicious bias." By Schlesinger''s journal.'
