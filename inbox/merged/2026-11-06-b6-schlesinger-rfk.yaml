      c: 'New York, lunch. Galbraith, Goodwin and Schlesinger resolve to stir opinion against the war''s widening: Goodwin, Johnson "a man possessed," who understands only political opposition. Their books follow: Goodwin''s *Triumph or Tragedy*, Galbraith''s *How to Control the Military*, Schlesinger''s *The Bitter Heritage*. They discuss a national committee against the war''s widening.'
