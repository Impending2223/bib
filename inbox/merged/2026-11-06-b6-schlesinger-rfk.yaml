      n: '[[w.schlesinger-robert-kennedy-and-his]], 626. Check: Schlesinger has it from Robert Kennedy, told by Jacqueline Kennedy "then or later". To check: Robert Kennedy, interview by John Bartlow Martin, Feb. 29, 1964, 30, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 626 n.32). Names: Kennedy, Johnson, Jacqueline Kennedy, Robert Kennedy.'
