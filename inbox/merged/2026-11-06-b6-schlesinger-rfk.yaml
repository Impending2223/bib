      c: 'McCloy summoned to sit at Stevenson''s right hand at the UN; the President sends Schlesinger to New York too. Robert Kennedy to Schlesinger, at the plane: "That fellow is ready to give everything away. We will have to make a deal in the end; but we must stand firm now." By Schlesinger''s journal.'
