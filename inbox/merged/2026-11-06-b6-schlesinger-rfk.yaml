      when: June, early
      date: 1960-06
      thread: elections-1960-nomination
      c: 'Hyannis Port. Kennedy to Schlesinger on Johnson, "with a mixture of admiration and despair": compares him to Peel and others "omnipotent in Parliament but had no popularity in the country"; Johnson a "riverboat gambler." By Schlesinger''s journal.'
