      also:
      - elections-1968-mccarthy
      c: 'The Fairmont, San Francisco, the morning of the debate. Robert Lowell, McCarthy''s friend, for each side backing the other if it loses, calls on Kennedy: a fairly unsatisfactory talk, Kennedy "making debater''s points." Afterward to McCarthy: "I felt like Rudolf Hess parachuting into Scotland."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 910–11. To check: [[w.stein-american-journey]], 309–10 (cited by [[w.schlesinger-robert-kennedy-and-his]], 911 n.47). See [[cal.1968-06-01.elections-1968]]. Names: Lowell, Robert Kennedy, Eugene McCarthy.'
