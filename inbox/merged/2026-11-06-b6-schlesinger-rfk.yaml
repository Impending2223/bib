      c: 'Robert Kennedy to Katzenbach, Under Secretary of State, who had questioned a Vietnam quotation in *To Seek a Newer World*: the quotation vindicated; has Katzenbach noticed how "very kind and helpful" Ramsey Clark has been "in the renewed dispute with Hoover regarding the Department of Justice wiretapping. Such courage and integrity were appreciated."'
