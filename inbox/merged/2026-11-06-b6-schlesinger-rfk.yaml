      c: 'After the crisis, Rusk to Robert Kennedy: his part in the Executive Committee was to keep it from moving too far or too fast; he had played "the ''dumb dodo''" for that reason. Robert Kennedy: "a strange way of putting it." By Robert Kennedy''s memorandum of Nov. 30.'
