      date: '1963-11-22'
      thread: succession
      also:
      - robert-kennedy
      c: 'Driving from Andrews to Bethesda, McHugh, the President''s Air Force aide, to Robert Kennedy on the delay before the plane left Dallas and the confusion aboard: Johnson "obscene," "the worst performance he''d ever witnessed." By Robert Kennedy''s account to Manchester.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 626. To check: Robert Kennedy, interview by William Manchester, May 16, 1964, 26, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 626 n.31). Names: McHugh, Robert Kennedy, Johnson.'
