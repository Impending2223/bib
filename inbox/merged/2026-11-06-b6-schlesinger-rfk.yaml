      when: Apr. 3
      date: '1968-04-03'
      thread: elections-1968-mccarthy
      c: 'The day after Wisconsin. McCarthy to Jeremy Larner and Jonathan Schell: "It''s narrowed down to Bobby and me. So far he''s run with the ghost of his brother. Now we''re going to make him run against it. ... We''ll make him run against Jack. ... And I''m Jack." Schell declines to join his staff.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 870. To check: [[w.larner-nobody-knows]], 63–64 (cited by [[w.schlesinger-robert-kennedy-and-his]], 870 n.60). Names: Eugene McCarthy, Larner, Robert Kennedy.'
