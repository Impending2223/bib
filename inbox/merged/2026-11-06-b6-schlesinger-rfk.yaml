      c: Hickory Hill. The first of the seminars Robert and Ethel Kennedy asked Schlesinger to organize, to remind the administration's leaders of a world of ideas beyond government; then about monthly but for the summers. Lecturers from Isaiah Berlin to Al Capp; in the audience McNamara, Dillon, Alice Roosevelt Longworth.
