      c: 'West Berlin, Brandt''s dinner, Edward Kennedy''s thirtieth birthday. Brandt toasts "the President, government and people of the United States." Robert Kennedy: "That''s the three of us — the President, that''s my brother; the government, that''s me; and [looking hard at Teddy] you''re the people." Brandt, in his memoirs: it made him "regard the family''s political expansion with disquiet."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 574. To check: Willy Brandt, *Begegnungen und Einsichten* (1976), as reported in the *New York Times*, Aug. 18, 1976 (cited by [[w.schlesinger-robert-kennedy-and-his]], 574 n.60). See [[cal.1962-02-22.robert-kennedy-trip]]. Names: Brandt, Robert Kennedy, Edward Kennedy.'
