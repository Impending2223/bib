      when: Apr. 4
      date: '1968-04-04'
      thread: robert-kennedy-campaign
      also:
      - civil-disorders-king
      c: 'Indianapolis, after the rally. Robert Kennedy with black militants John Lewis has brought together, hostile: "Our leader is dead tonight, and when we need you we can''t find you." Kennedy: "Yes, you lost a friend, I lost a brother. ... Big business is trying to defeat me because they think I am a friend of the Negro." Departing, they pledge their support. By Lewis''s account.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 876. To check: John Lewis, interview by Jean Stein, Sept. 9, 1968, 7, Stein Papers; [[w.vanden-heuvel-on-his-own]], 338 (cited by [[w.schlesinger-robert-kennedy-and-his]], 876 n.3). See [[cal.1968-04-04.robert-kennedy]]. Names: Robert Kennedy, John Lewis.'
      tags:
      - name:kennedy-robert-f
      - name:lewis-john
      src:
        c: 414d733f
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 876: all'
        - 'via w.schlesinger-robert-kennedy-and-his 876 n.3a: all'
