      date: '1968-05-07'
      thread: robert-kennedy-campaign-primaries
      c: 'The night of the Indiana primary, around midnight, a late dinner. In an airport coffee shop Robert Kennedy talks till early morning with two young McCarthy volunteers who will stay with McCarthy: "You''re dedicated to what you believe, and I think that''s terrific." Taylor Branch, one of them: "He kind of neutralized me."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 883. To check: [[w.newfield-robert-kennedy]], 265; [[w.stout-people]], 237 (cited by [[w.schlesinger-robert-kennedy-and-his]], 883 nn.36–37). See [[cal.1968-05-07.elections-1968-2]]. Names: Robert Kennedy, Eugene McCarthy.'
      tags:
