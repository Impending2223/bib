      date: '1968-03-29'
      thread: robert-kennedy-campaign-primaries
      also:
      - robert-kennedy-campaign
      c: 'John Bartlow Martin to Robert Kennedy, passing on Richard Wade''s report: student petitioners in Hammond, Ind., well received in the ghetto and the backlash areas alike, Kennedy pro-civil rights but "a strong executive capable of controlling disorders. Maybe as Schlesinger says ruthlessness has its uses after all."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 880. To check: Martin to Robert Kennedy, Mar. 29, 1968, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 880 n.19). Names: Martin, Robert Kennedy, Schlesinger.'
      tags:
      - name:martin-john-bartlow
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      src:
