      when: Apr. 9
      date: '1968-04-09'
      thread: robert-kennedy-campaign
      c: 'On the plane back to Washington from King''s funeral, Robert Kennedy sits with Katzenbach, touches his knee: "Forget about what happened and just erase the whole thing. Nothing more will be said." By Katzenbach''s account.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 879. Check: the day; the book puts the funeral on Apr. 7 (878), the calendar on Apr. 9. To check: Nicholas Katzenbach, interview by Jean Stein, Sept. 27, 1968, 20, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 879 n.17). See [[cal.1968-04-09.king]]. Names: Robert Kennedy, Katzenbach.'
