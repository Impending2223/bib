      when: Feb. 16
      date: '1968-02-16'
      thread: robert-kennedy-campaign-decision
      c: 'Katzenbach to Robert Kennedy: "our intelligence people were guilty of inexcusably bad research" on the quotation; he takes strong exception to Kennedy''s closing lines, "a crack you would resent as deeply as I do."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 879. To check: Katzenbach to Robert Kennedy, Feb. 16, 1968, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 879 n.16). See [[cal.1968-02-12.robert-kennedy-campaign-decision]]. Names: Katzenbach, Robert Kennedy.'
