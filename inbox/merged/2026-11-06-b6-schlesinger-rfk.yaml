      date: 1968-04
      thread: elections-1968-johnson
      also:
      - robert-kennedy-campaign
      c: 'Johnson, told of Robert Kennedy''s telegram asking a meeting: "I won''t bother answering that grand-standing little runt." By Sam Houston Johnson''s account.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 868. Check: the day; after Mar. 31, before the meeting of Apr. 3. To check: [[w.johnson-my-brother-lyndon]], 251–52 (cited by [[w.schlesinger-robert-kennedy-and-his]], 868 n.55). See [[cal.1968-04-03.robert-kennedy]]. Names: Johnson, Robert Kennedy.'
