      thread: robert-kennedy
      also:
      - press-and-broadcasting
      c: 'Robert Kennedy''s first day out in public since Dallas: a Christmas party Mary McGrory of the *Washington Star* has arranged for an orphanage. A small boy: "Your brother''s dead!" Kennedy picks him up: "That''s all right. I have another brother." By Maas''s account.'
