      n: '[[w.schlesinger-robert-kennedy-and-his]], 441. Check: the day of Kennedy''s talk with Graham ("late in 1962"). To check: Philip L. Graham to Kennedy, Dec. 15, 1962, JFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 441 n.102). Names: Kennedy, Rusk, McNamara, Bruce.'
