      when: Jan.
      date: 1963-01
      thread: robert-kennedy
      c: 'The White House, after a dance for Gavin, an upstairs kitchen. Johnson to Robert Kennedy, for hours: "Bobby, you do not like me. Your brother likes me. ... Why don''t you like me?" He never attacked their father at the 1960 convention; the reports false. By Spalding''s account. The next morning Robert Kennedy has Seigenthaler look up the attack; Seigenthaler finds the story in the *New York Times*.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 623–24. Check: the day; Seigenthaler''s report to Robert Kennedy is of Jan. 28, 1963 (623 n.16). To check: Charles Spalding, interview by Jean Stein, 13–14, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 623 n.15); Seigenthaler to Robert Kennedy, Jan. 28, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 623 n.16). Names: Gavin, Johnson, Robert Kennedy, Seigenthaler.'
      tags:
      - name:gavin-james-m
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:seigenthaler-john
      src:
        c: 478d9ec4
        rows:
