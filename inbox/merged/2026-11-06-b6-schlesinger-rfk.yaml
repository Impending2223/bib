      c: 'Kennedy with Robert Kennedy for half an hour before a meeting, shaking his head, rubbing his eyes. The Cuba operation has harmed his standing as President and the country''s; "The United States couldn''t be trusted." Mrs. Lincoln walks in: "Oh, no, everybody thinks you are doing wonderfully." By Robert Kennedy''s memorandum of June 1.'
