      when: Apr., early
      date: 1968-04
      thread: king
      also:
      - robert-kennedy-campaign
      c: 'After Johnson''s withdrawal, King to Walter Fauntroy: "He''s just doing like a Baptist preacher ... trying to get a vote of confidence"; "We''ve got to get behind Bobby now that he''s in." By Levison''s account, he had decided to support Kennedy, not yet publicly.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 873. Check: the day; between Mar. 31 and Apr. 4. To check: Walter Fauntroy, interview by Jean Stein, Nov. 11, 1969, 25; Stanley Levison, interview by Jean Stein, 2 (the note prints Nov. 21, 1962), Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 873 nn.74, 76). See [[cal.1968-03-31.elections-1968]]. Names: Martin Luther King, Johnson, Robert Kennedy, Levison.'
      tags:
