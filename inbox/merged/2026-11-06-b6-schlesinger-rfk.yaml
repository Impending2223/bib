      tags:
      - name:kennedy-robert-f
      - name:katzenbach-nicholas
      - name:clark-ramsey
      - name:hoover-j-edgar
      src:
        c: 4030ef41
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 879: all'
        - 'via w.schlesinger-robert-kennedy-and-his 879 n.16a: all'
    section: '196802'
