      when: Apr. 4
      date: '1968-04-04'
      thread: robert-kennedy-campaign
      also:
      - king-memphis
      c: 'Indianapolis, back at the hotel. Robert Kennedy telephones Coretta King: "I''ll help in any way I can." She will go to Memphis in the morning for her husband''s body; Kennedy: "Let me fly you there. I''ll get a plane down." SCLC officials tell her it is a mistake, Kennedy running for President; she is not bothered.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 876. To check: [[w.king-my-life-with-martin]], 333–34 (London ed., 1970); Coretta Scott King, interview by Jean Stein, Nov. 18, 1969, 1–2, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 876 nn.1–2). See [[cal.1968-04-04.robert-kennedy]]. Names: Robert Kennedy, Coretta King.'
      tags:
      - name:kennedy-robert-f
      - name:king-coretta-scott
      src:
        c: fc257385
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 876: all'
    section: '196804'
- add:
