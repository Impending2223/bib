      c: 'Los Angeles, the morning after the nomination. Schlesinger urges Robert Kennedy to bring in the Stevenson people. Robert Kennedy: "Arthur, human nature requires that you allow us forty-eight hours. Adlai has given us a rough time over the last three days." Soon after he sends Doyle, who ran the Stevenson campaign, Eugene McCarthy and Schlesinger to the Stevenson loyalists of southern California.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 211. Check: the day; the journal cited is of July 15. To check: Schlesinger, journal, July 15, 1960, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 211 n.86). Names: Schlesinger, Robert Kennedy, Stevenson, Eugene McCarthy.'
