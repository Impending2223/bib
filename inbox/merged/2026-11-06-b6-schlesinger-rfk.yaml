      date: '1962-02-21'
      thread: robert-kennedy
      c: 'On the plane from India to Europe, Robert Kennedy to Schlesinger: in Japan and Indonesia America can reach the young and the intellectuals only as a progressive nation. "I kept asking myself what a conservative could possibly say to these people. ... Can you imagine — Barry Goldwater in Indonesia?" By Schlesinger''s journal.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 573. To check: Schlesinger, journal, Feb. 21, 1962, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 573 n.59). See [[cal.1962-02-06.robert-kennedy]]. Names: Robert Kennedy, Schlesinger, Goldwater.'
