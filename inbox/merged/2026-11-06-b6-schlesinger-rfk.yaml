      date: 1968-03
      thread: robert-kennedy-campaign
      c: 'New York, a dinner party, a few days after the announcement. Jacqueline Kennedy to Schlesinger: "Do you know what I think will happen to Bobby? ... The same thing that happened to Jack. ... There is so much hatred in this country, and more people hate Bobby than hated Jack." She has told him so. By Schlesinger''s journal.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 857. Check: the day; the journal cited is of Apr. 2. To check: Schlesinger, journal, Apr. 2, 1968, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 857 n.54). See [[cal.1968-03-15.robert-kennedy-campaign-2]]. Names: Jacqueline Kennedy, Schlesinger, Robert Kennedy.'
