      id: cal.1962-10.missile-crisis-3
      when: Oct.
      date: 1962-10
      thread: missile-crisis
      also:
      - robert-kennedy
      c: 'Plans circulated for evacuating the top officials to shelters outside Washington. Robert Kennedy to Guthman: "I''m not going. If it comes to that, there''ll be sixty million Americans killed and as many Russians or more. I''ll be at Hickory Hill."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 514. Check: the day; the book sets it after the talk with Dobrynin of Oct. 23. To check: [[w.guthman-we-band-of-brothers]], 126 (cited by [[w.schlesinger-robert-kennedy-and-his]], 514 n.70). See [[cal.1962-10-16.missile-crisis]]. Names: Robert Kennedy, Guthman.'
      tags:
      - name:kennedy-robert-f
      - name:guthman-edwin-o
      src:
        c: 5146a697
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 514: all'
    section: '196210'
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-diplomacy
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis-diplomacy
      also:
      - robert-kennedy
      c: 'Stevenson argues at the NSC for offering to give up the missile bases in Turkey and Italy to get the Soviet missiles out of Cuba. Robert Kennedy, by his notes: "a rather strong argument with him"; he suggests privately to the President that someone else replace Stevenson at the UN, "such a weak man in these kinds of negotiations." The President to O''Donnell: "I admire [Stevenson] for saying what he did."'
      n: 'Minutes of the 505th Meeting of the National Security Council, [FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 34](https://history.state.gov/historicaldocuments/frus1961-63v11/d34) (Oct. 20, 1962) (Stevenson''s argument). [[w.schlesinger-robert-kennedy-and-his]], 516. Check: the day of the suggestion. To check: Robert Kennedy, memorandum, Nov. 15, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 516 n.81); [[w.odonnell-johnny-we-hardly-knew]], 323 (cited by [[w.schlesinger-robert-kennedy-and-his]], 516 n.80). See [[cal.1962-10-20.missile-crisis]]. Names: Stevenson, Robert Kennedy, Kennedy, O''Donnell.'
