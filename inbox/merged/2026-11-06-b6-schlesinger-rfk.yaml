      when: June 4
      date: '1968-06-04'
      thread: robert-kennedy-campaign-california
      c: 'The Ambassador, mid-evening. McGovern by telephone from South Dakota: Kennedy has more votes than Humphrey and McCarthy together, the farmers and the Indians. In the suite, the next steps: Stephen Smith schedules meetings on reorganizing the campaign; Hackett''s count, Humphrey 944 delegates, Kennedy 524½, McCarthy 204, undecided 872; the goal by the convention, Kennedy 1,432½.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 913. To check: George McGovern, interview by Jean Stein, Sept. 25, 1968, 12, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 913 n.58); [[w.vanden-heuvel-on-his-own]], 390–92 (Hackett''s estimate, misdated, cited by [[w.schlesinger-robert-kennedy-and-his]], 913 n.59). Names: McGovern, Robert Kennedy, Humphrey, Eugene McCarthy.'
      tags:
      - name:mcgovern-george
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
      src:
        c: f921d684
        rows:
