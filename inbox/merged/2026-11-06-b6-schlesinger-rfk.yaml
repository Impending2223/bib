      c: 'Robert Kennedy, in private, for getting out of Vietnam. Told by Walton that Harriman thinks him not for "cut-and-run": "Little does he know." To Rowland Evans: "We''ve got to get out of that war. It''s destroying this country." To Thomas Watson of IBM: "I''d get out of there in six months with all the troops the United States has."'
