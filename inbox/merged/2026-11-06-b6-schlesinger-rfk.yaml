      when: Oct. 30
      date: '1966-10-30'
      thread: robert-kennedy
      also:
      - assassination
      c: 'New York, P. J. Clarke''s, talk with Schlesinger till 2:30 a.m. Robert Kennedy wonders how long he can avoid comment on the Warren report: he thinks it a poor job and will not endorse it, but will not criticize it and reopen the whole business. On Johnson: the voters probably agree with him 80 percent on the issues between them, but no longer believe him. Rueful about his own vogue. By Schlesinger''s journal.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 616, 759. To check: Schlesinger, journal, Oct. 30, 1966, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 616 n.51). Names: Robert Kennedy, Schlesinger, Johnson.'
