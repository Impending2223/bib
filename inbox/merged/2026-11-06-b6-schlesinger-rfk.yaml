      c: 'New York, the day after Indiana. Rabbis wait on Robert Kennedy. "Why do I have so much trouble with the Jews? ... Is it because of my father when he was in England?" One: after the Six Day War, American Jews need "continual reassurance" about Israel; he will make his position clear again on the West Coast. He meets his delegate slate for the New York primary.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 884. To check: [[w.vanden-heuvel-on-his-own]], 359–61 (cited by [[w.schlesinger-robert-kennedy-and-his]], 884 n.40). Names: Robert Kennedy.'
