      when: Feb.
      date: 1962-02
      thread: robert-kennedy
      c: 'Honolulu, at the start of the trip round the world. Robert and Ethel Kennedy call on Galbraith, the ambassador to India, in hospital; their dinghy has tipped over outside Pearl Harbor. Galbraith: say an enemy destroyer cut them down and Bob saved the crew; "He could then be President." By Galbraith''s journal.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 563. Check: the day. To check: [[w.galbraith-ambassadors-journal]], 303 (cited by [[w.schlesinger-robert-kennedy-and-his]], 563 n.12). See [[cal.1962-02-06.robert-kennedy]]. Names: Robert Kennedy, Galbraith.'
