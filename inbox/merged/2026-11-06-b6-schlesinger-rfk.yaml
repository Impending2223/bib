      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the evening. Kennedy and Robert Kennedy dine with their father at Marion Davies''s house. Joseph Kennedy on the choice of Johnson: "Don''t worry, Jack. Within two weeks they''ll be saying it''s the smartest thing you ever did." By Bartlett''s account.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 211 (the dinner; Schlesinger: the father had no part in the Johnson decision). To check: Charles Bartlett, interview by Jean Stein, Jan. 9, 1970, 14, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 211 n.83). See [[cal.1960-07-14.elections-1960]]. Names: Kennedy, Robert Kennedy, Joseph Kennedy, Bartlett.'
