      when: Apr. 20
      date: '1968-04-20'
      thread: robert-kennedy-campaign
      c: 'Thomas Johnston to Robert Kennedy: "The classical political wisdom which is shaping this campaign is similar in all important essentials to the advice which said you should not run this year." "You are at your strongest when you are most yourself."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 871. To check: Johnston to Robert Kennedy, Apr. 20, 1968, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 871 n.65). Names: Robert Kennedy.'
