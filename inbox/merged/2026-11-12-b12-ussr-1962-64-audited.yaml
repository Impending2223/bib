- cite:
    id: cal.1962-12-03.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 407–09 (P 71/I: Mikoyan''s work approved; Khrushchev''s speech on his report, as A. K. Serov took it down by hand, 409 n.а: "мы помогли Кубе – сделали правильно. Мы заставили США признать наши интересы в Америке" (we helped Cuba, did right. We made the United States recognize our interests in America); "участником международного клуба" (a member of the international club); "Американцы сами испугались" (the Americans themselves took fright); no treaty with Cuba now)'
    units: '?'
- add:
    entry:
      id: cal.1962-12-28.missile-crisis-settlement
      when: Dec. 28
      date: '1962-12-28'
      thread: missile-crisis-settlement
      also:
      - soviet-union
      c: 'New York, at the Americans'' request. McCloy, Yost and Plimpton with Kuznetsov: Washington will not put the four messages of Oct. 27 and 28 before the UN without its reservations, the White House statement of Oct. 27 and Kennedy''s of Nov. 20; it proposes to send Kennedy''s two letters, naming the statements in a covering letter, the draft handed over, Moscow to send Khrushchev''s. Kuznetsov: not acceptable.'
      n: 'Kuznetsov to Moscow, Dec. 28, the cipher telegram, to the Presidium''s members and Gromyko. [[w.prezidium-tsk-kpss-1954]], III, 421–28 (doc. 276.4.2). Made public: 2008. Names: McCloy, Yost, Plimpton, Kuznetsov, Kennedy, Khrushchev.'
      tags:
      - name:mccloy-john-j
      - name:yost-charles-w
      - name:kuznetsov-vasily-v
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - polity:ussr
      - polity:us
      - polity:un
- add:
    entry:
      id: cal.1962-12-26.soviet-union-leadership
      when: Dec. 26
      date: '1962-12-26'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium, copies to Ustinov, Lomako and Dymshits, on artificial diamonds, after his visit with Podgorny to the Ukrainian institute of synthetic superhard materials: 135,000 carats made this year, at least three million carats in the Ukraine in 1963; their wide use in industry proposed.'
      n: '*Zapiska ... N. S. Khrushcheva o proizvodstve iskusstvennykh almazov*, Dec. 26, 1962. [[w.prezidium-tsk-kpss-1954]], III, 410–18 (docs. 276.2.1–276.2.2; approved by P 75/II, Dec. 30, 409–10). Made public: 2008. Names: Khrushchev, Ustinov, Lomako, Dymshits, Podgorny.'
      tags:
      - name:khrushchev-nikita-s
      - name:dymshits-veniamin-e
      - name:podgorny-nikolai-v
      - polity:ussr
- cite:
    id: cal.1962-12-30.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 409–31 (P 75/I–IV: the talks with Tito, Gomułka, Cyrankiewicz and Kliszko approved; Khrushchev''s note of Dec. 26 on artificial diamonds; Kozlov''s trip to Kazakhstan and Uzbekistan approved; the instructions to Kuznetsov, on his telegram of Dec. 28; of Ivanov, the heading only)'
    units: '?'
- cite:
    id: cal.1963-01-02.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 431–35 (Protocol 76, the signed protocol dated Jan. 7, the session Jan. 7 by the editors, 431 n.в: the delegation to the SED''s congress, P 76/18, by poll, Jan. 4, Khrushchev at its head; the Culture Department''s note of June 14, 1962 on Ehrenburg''s memoirs; the headings of the other items)'
    units: '?'
- check:
    id: cal.1963-01-02.soviet-union
    text: 'Check: the day; vol. III''s editors have the session of Protocol 76 on Jan. 7 ([[w.prezidium-tsk-kpss-1954]], III, 431 n.в), Malin''s notes Jan. 2 (I, 669).'
- add:
    entry:
      id: cal.1963-01-09.soviet-union-leadership
      when: Jan. 9
      date: '1963-01-09'
      thread: soviet-union-leadership
      c: 'The Presidium. Shepilov: a severe reprimand, to be restored to the party and received; nothing to be recorded now. On planning, stenographed, Khrushchev: his note an exchange of views, no decision to be taken; his speech for the SED''s congress "продолжением выступления на сессии Верховного Совета по кубинскому вопросу" (a continuation of the speech to the Supreme Soviet on Cuba), "оно удалось" (it came off); the state committees better inside Gosplan than under the Council of Ministers. The commission''s drafts on planning and on Gosplan''s structure adopted in the main.'
      n: 'Protocol 77, item I and item 19. [[w.prezidium-tsk-kpss-1954]], I, 670 (doc. 278, Malin''s notes), 670–94 (doc. 279, the stenogram); I, 1122 nn.1–2 (the editors: Shepilov expelled by the Moscow city committee, Feb. 21, 1962, restored only Feb. 18, 1978); III, 435–36 (P 77/I). Made public: 2003. Names: Shepilov, Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - polity:gdr
- cite:
    id: cal.1963-01-29.china
    item: '[[w.prezidium-tsk-kpss-1954]], III, 436–37 (Protocol 80, dated Jan. 31: the headings only, the article for *Pravda*, "the answer to the Chinese")'
    units: '?'
- add:
    entry:
      id: cal.1963-01-31.soviet-union-leadership
      when: Jan. 31
      date: '1963-01-31'
      thread: soviet-union-leadership
      c: 'The Presidium, Protocol 80 continued, on a sovnarkhoz for the Central Asian region. Mikoyan for keeping the republics'' sovnarkhozy; Kozlov: the plan meets the republics'' national interests, Rashidov thanked them; Mikoyan: "А ты думаешь, это искренно?" (And you think that was sincere?); Podgorny with Mikoyan. Khrushchev: national prejudices must not stand in the way; the commission to rework it with the republics.'
      n: 'Protocol 80, item V. [[w.prezidium-tsk-kpss-1954]], I, 696–98 (doc. 281, Malin''s notes, "вне протокола" (outside the protocol)); III, 437 (the heading). See [[cal.1963-01-29.china]]. Made public: 2003. Names: Mikoyan, Kozlov, Rashidov, Podgorny, Khrushchev.'
      tags:
      - name:mikoyan-anastas
      - name:kozlov-frol-r
      - name:podgorny-nikolai-v
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1963-02-15.soviet-union-leadership
      when: Feb. 15
      date: '1963-02-15'
      thread: soviet-union-leadership
      also:
      - china
      c: 'The Presidium on the letter to the Chinese party. Khrushchev: the text not a success; no polemic, only the concern that a split may come; "По каким же вопросам расхождение?" (on what questions, then, do we diverge?); ready to meet at any level. The Secretariat to rework it. The Balzan prize: instructions to Kuzmin, Mazzolini may come to Moscow, and to Alekseyev, to sound Castro, approved with amendments.'
      n: 'Protocol 82, items XXVI and XXIX. [[w.prezidium-tsk-kpss-1954]], I, 698–99 (doc. 283, Malin''s notes, item XXVI only); III, 446–52 (P 82/XXVI, the draft letter and the departments'' note of Feb. 14), 439–46 (P 82/XXIX and the instructions; no record of its discussion, 439 n.д). See [[cal.1963-02-07.soviet-union]]. Made public: 2003. Names: Khrushchev, Kuzmin, Mazzolini, Alekseyev, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:alekseyev-aleksandr-i
      - name:castro-fidel
      - polity:ussr
      - polity:prc
      - polity:cuba
- add:
    entry:
      id: cal.1963-02-28.soviet-union-leadership
      when: Feb. 28
      date: '1963-02-28'
      thread: soviet-union-leadership
      c: 'The Presidium. Baibakov put forward for chairman of the committee on chemistry. Khrushchev on creating a Supreme Council of the National Economy, criticizing Kosygin''s poor organization of the economy''s management; the Sovnarkhoz of the USSR to be a union-republican organ. Brezhnev and Kosygin for it; Voronov: he signs up to a hundred orders a day. Kosygin and Voronov to draft.'
      n: 'Protocol 83. [[w.prezidium-tsk-kpss-1954]], I, 699 (doc. 284, Malin''s notes); III, 452 (the headings). Made public: 2003. Names: Baibakov, Khrushchev, Kosygin, Brezhnev, Voronov.'
      tags:
      - name:khrushchev-nikita-s
      - name:kosygin-aleksei
      - name:brezhnev-leonid
      - name:voronov-gennady-i
      - polity:ussr
- cite:
    id: cal.1963-03-12.china
    item: '[[w.prezidium-tsk-kpss-1954]], III, 452 (Protocol 87, dated Mar. 13: the heading only)'
    units: '?'
- add:
    entry:
      id: cal.1963-03-12.soviet-union-leadership
      when: Mar. 12
      date: '1963-03-12'
      thread: soviet-union-leadership
      c: 'The Presidium, in its hall, the same session as the answer to Peking: Khrushchev''s notes on farming to be published; a committee for tractor and farm machinery. The Supreme Council of the National Economy, Kosygin reading the draft: Ustinov its chairman and a First Deputy Chairman of the Council of Ministers; Gosplan and the Sovnarkhoz of the USSR made union-republican; Baibakov a minister.'
      n: 'Protocol 87, items I and 1б. [[w.prezidium-tsk-kpss-1954]], I, 700 (doc. 285, Malin''s notes); III, 452–53 (P 87/I, dated Mar. 13, and the drafts named). See [[cal.1963-02-28.soviet-union-leadership]], [[cal.1963-03-12.china]]. Made public: 2003. Names: Khrushchev, Kosygin, Ustinov, Baibakov. Check: the day; vol. III''s editors have Protocol 87 of Mar. 13, P 87/I dated Mar. 13, and *Pravda* of Mar. 14 reporting a joint session of the Presidium and the Council of Ministers the day before (III, 1023–24 n.4); Malin''s notes, Mar. 12.'
      tags:
      - name:khrushchev-nikita-s
      - name:kosygin-aleksei
      - polity:ussr
- add:
    entry:
      id: cal.1963-03-13.soviet-union-leadership
      when: Mar. 13
      date: '1963-03-13'
      thread: soviet-union-leadership
      also:
      - china
      c: 'The Presidium, by poll, the day after the session on the answer to Peking, approves a telegram to Chervonenko for Yang Shangkun: Moscow does not object to publishing the Central Committee''s letter of Feb. 21 with the Chinese party''s of Mar. 9, since Peking will publish its own regardless; the proposal "звучит как ультиматум" (sounds like an ultimatum).'
      n: 'P 87/50. [[w.prezidium-tsk-kpss-1954]], III, 463–64 (doc. 285.2 and the telegram, Andropov''s); III, 1024 nn.12–13 (the editors: the item Malin heads "Об ответе ЦК КПК" (on the answer to the CPC), I, 700; the two letters in *Pravda*, Mar. 14). See [[cal.1963-03-12.china]]. Made public: 2008. Names: Chervonenko, Yang Shangkun.'
      tags:
      - name:chervonenko-stepan-v
      - polity:ussr
      - polity:prc
- cite:
    id: cal.1963-03-21.soviet-union-space
    item: '[[w.prezidium-tsk-kpss-1954]], III, 464–65 (P 89/IV: Smirnov''s commission and the Defense Ministry to follow the exchange of views on the Vostok flights; the Defense Ministry, Malinovsky and Vershinin, to study taking over their direction)'
    units: '?'
- add:
    entry:
      id: cal.1963-04-02.testing
      when: Apr. 2
      date: '1963-04-02'
      thread: testing
      also:
      - soviet-union
      c: 'New York. Cousins, to a Soviet official, of his coming trip to Moscow: he saw Kennedy last week on what to raise with Khrushchev. What he means to tell him: word of American consent to two or three inspections stirred Congress against a treaty, so the talks in Geneva to go on for a compromise; on Cuba, trade from third countries allowed if Soviet military aid stops and the troops leave; Kennedy needs time against the opposition in Congress, the Air Force and the monopolies. He will see Rusk first, and fly to Rome on Apr. 8 to see Pope John XXIII.'
      n: '*Soobshchenie iz N''yu-Iorka o besede s N. Kazinsom*, Apr. 2, 1963 (special file), Khrushchev''s attachment 1 to his note of Apr. 20. [[w.prezidium-tsk-kpss-1954]], III, 482–84 (doc. 288.0.3). Made public: 2008. Names: Cousins, Kennedy, Khrushchev, Rusk, John XXIII.'
      tags:
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:rusk-dean
      - name:cousins-norman
      - polity:ussr
      - polity:us
      - polity:vatican
- cite:
    id: cal.1963-04-03.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 484–96 (doc. 288.0.4, Dobrynin''s report of the meeting, Apr. 3: the statement read out on instructions; the raids on the *L''gov* and the *Baku*; the men withdrawn from Cuba many times the American press''s figure, 485–86; two or three inspections the most, 488; capitalism''s contradiction, 494; Robert Kennedy, redder and grimmer as he listened: "Это оскорбительно для меня, для моего брата-президента, для моей страны" (this is insulting to me, to my brother the President, to my country); the text handed back, not to be shown to the President, such statements to go through the State Department, 495; not the hour or the paper''s length)'
    units: '?'
- cite:
    id: cal.1963-04.testing-2
    item: '[[w.prezidium-tsk-kpss-1954]], III, 496–99 (doc. 288.0.5, Dobrynin''s record of Apr. 7, special file, Khrushchev''s attachment 3 to his note of Apr. 20: Dobrynin calls on Thompson at his request; Laos first; Robert Kennedy upset by their last meeting, Dobrynin''s list of grievances; Thompson, "в сугубо личном плане" (in a strictly personal way), proposes one close to the President, Rusk, Robert Kennedy or Harriman, to see Khrushchev in May; Cousins not of the President''s circle; Kennedy thinking of a personal message; not the campaign, the meeting in August or September, or Rusk''s draft declaration)'
    units: A
- cite:
    id: cal.1963-04-11.testing
    item: '[[w.prezidium-tsk-kpss-1954]], III, 499–502 (doc. 288.0.6, the message in Russian, as Khrushchev attached it to his note of Apr. 20)'
    units: '?'
- cite:
    id: cal.1963-04-12.testing
    item: '[[w.prezidium-tsk-kpss-1954]], III, 502–13 (doc. 288.0.7, the Soviet record: Gagra, Apr. 12; Cousins brings greetings from Kennedy, Rusk, U Thant and the Pope; not the words of c)'
    units: '?'
- check:
    id: cal.1963-04-12.testing
    text: 'Check: the place; the Soviet record of the talk has Gagra ([[w.prezidium-tsk-kpss-1954]], III, 502), Fursenko and Naftali Pitsunda.'
- add:
    entry:
      id: cal.1963-04-20.soviet-union-leadership
      when: Apr. 20
      date: '1963-04-20'
      thread: soviet-union-leadership
      also:
      - soviet-union
      - testing
      c: 'Khrushchev, a note to the Presidium on relations with the United States since the Caribbean crisis: the missiles were put in Cuba to defend it, "единственной целью" (the only aim); secrecy hoped for, the military''s report that it was possible wrong; the pledge of no invasion backed only by the Soviet threat. Kennedy''s circle sold the outcome as his victory. Cousins sent to blackmail; the message through Robert Kennedy parried it, Thompson''s talk and Kennedy''s message the Americans'' next move. The main questions Cuba''s safety from invasion and a German peace treaty; the test ban "подсобным" (subsidiary), an agreement useful all the same.'
      n: '*Zapiska ... N. S. Khrushcheva v Prezidium TsK KPSS o sovetsko-amerikanskikh otnosheniyakh*, Apr. 20, 1963 (special file), sent to the Presidium''s members and candidates and the secretaries, with five attachments. [[w.prezidium-tsk-kpss-1954]], III, 478–82 (doc. 288.0.2); the draft, dictated at Pitsunda Apr. 13, 474–77 (doc. 288.0), and his remarks on it, Apr. 19, 477–78 (doc. 288.0.1). See [[cal.1963-04-02.testing]], [[cal.1963-04-03.soviet-union]], [[cal.1963-04.testing-2]], [[cal.1963-04-12.testing]]. Made public: 2008. Names: Khrushchev, Kennedy, Cousins, Robert Kennedy, Thompson.'
      tags:
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:thompson-llewellyn-e
      - name:cousins-norman
      - polity:ussr
      - polity:us
      - polity:cuba
- cite:
    id: cal.1963-04-25.testing
    item: '[[w.prezidium-tsk-kpss-1954]], III, 473–513 (doc. 288, the stenogram''s materials: Khrushchev''s note of Apr. 20 and its attachments)'
    units: '?'
- add:
    entry:
      id: cal.1963-05-03.soviet-union-leadership
      when: May 3
      date: '1963-05-03'
      thread: soviet-union-leadership
      also:
      - cuba
      - china
      c: 'The Presidium on Castro''s stay. The Chinese Ambassador''s conduct at the May Day reception: Kuznetsov to summon him. The treaty with Cuba, Alekseyev reporting: the positions settled in the exchange of views. The sugar price, 120 rubles a ton, openly; a confidential letter to the people''s democracies. Pliyev recalled, for illness. Castro''s program: Irkutsk to Bratsk by train, Moscow to Kiev by car, a gun for him in Tashkent. The plenum moved to June 18; Demichev to Bulgaria, Podgorny to Romania.'
      n: 'Protocol 95. [[w.prezidium-tsk-kpss-1954]], I, 715–16 (doc. 289, Malin''s notes; Gromyko, Kuznetsov, Alekseyev and Malinovsky present); III, 513 (the headings; P 95/I, the plenum). Made public: 2003. Names: Castro, Kuznetsov, Alekseyev, Pliyev, Demichev, Podgorny.'
      tags:
      - name:castro-fidel
      - name:kuznetsov-vasily-v
      - name:alekseyev-aleksandr-i
      - name:pliyev-issa-a
      - name:demichev-pyotr-n
      - name:podgorny-nikolai-v
      - polity:ussr
      - polity:cuba
      - polity:prc
      - polity:romania
- add:
    entry:
      id: cal.1963-05-06.soviet-union-leadership
      when: May 6
      date: '1963-05-06'
      thread: soviet-union-leadership
      also:
      - cuba
      c: 'The Presidium at lunch, Protocol 95 continued. Khrushchev: plants to be bought abroad, for 50,000 tons of lavsan, for film, for transistors; substitutes for rubber and fats. Castro to be shown a launch position of an intercontinental missile. Adopted: Cuba''s raw sugar for 1963 at 120 rubles a ton, 6 cents a pound, against 79.37, the difference of some 50 million rubles off Cuba''s credit; Khrushchev''s letter on it to the leaders of six socialist countries.'
      n: 'Protocol 95, continued. [[w.prezidium-tsk-kpss-1954]], I, 716 (doc. 289, Malin''s notes); III, 513–17 (P 95/IX, Khrushchev''s letter, and Kosygin and Dymshits''s note). See [[cal.1963-05-03.soviet-union-leadership]]. Made public: 2003. Names: Khrushchev, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-fidel
      - polity:ussr
      - polity:cuba
      - polity:poland
      - polity:gdr
      - polity:czechoslovakia
      - polity:romania
- add:
    entry:
      id: cal.1963-05-08.soviet-union-leadership
      when: May 8
      date: '1963-05-08'
      thread: soviet-union-leadership
      c: 'The Presidium at lunch, Khrushchev presiding. Comecon: no advances on goods for hard currency; the GDR''s industry to be loaded, with the Czechs, Poles, Hungarians, Bulgarians and Romanians on mutual benefit; "выступаем как плохие торговцы" (we come forward as poor traders) with the capitalist and Afro-Asian countries. Investment for 1964: 18 billion rubles, up to 3 for chemistry, no more for defense than this year, 300 million more for farming.'
      n: 'Protocol 96. [[w.prezidium-tsk-kpss-1954]], I, 717–18 (doc. 290, Malin''s notes); III, 517–20 (the protocol dated May 9: P 96/16 of May 7, on the Comecon Executive Committee''s meeting in Warsaw, May 10–13, and Lesechko''s note). Check: the day; vol. III''s editors have the session on May 9 (III, 518 n.б), Malin''s notes May 8, at lunch. Made public: 2003. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - polity:gdr
- add:
    entry:
      id: cal.1963-05-16.soviet-union-leadership
      when: May 16
      date: '1963-05-16'
      thread: soviet-union-leadership
      c: 'The Presidium on mass overcharging in the state and cooperative shops, on the Party-State Control Committee''s note: the note to go to the party committees; the sales workers to be asked to help, the unions drawn in; perhaps a state committee for consumer goods and trade. The Belorussian party''s and government''s note on specializing their farming, Khrushchev, Mazurov and I. Novikov speaking: "Неразумное предложение, рваческие тенденции" (an unreasonable proposal, grasping tendencies); to go back for more work, a blue-pencil "Не возвращать" (not to be returned) over the words.'
      n: 'Protocol 97, items III and V. [[w.prezidium-tsk-kpss-1954]], I, 718 (doc. 291, Malin''s notes); III, 520–34 (P 97, the drafts and the notes). Made public: 2003. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1963-06-07.soviet-union-leadership
      when: June 7
      date: '1963-06-07'
      thread: soviet-union-leadership
      also:
      - cuba
      c: 'The Presidium. Khrushchev, stenographed, on his talks with Castro in the south: "говорят, что мы струсили. Но если мы струсили, так зачем же мы тогда на Кубу поставили ракеты?" (they say we lost our nerve; but if so, why did we put missiles in Cuba?); Castro had thought them put there for the whole camp; a military treaty not to his advantage. Approved, the talks "вполне хорошими" (quite good). Podgorny and Brezhnev to be Central Committee secretaries, Brezhnev leaving the Supreme Soviet''s chair. Lesechko faulted on the Comecon meeting, the Romanians. On a KGB note, Zhukov to be called in and warned: if he does not understand, expulsion and arrest.'
      n: 'Protocol 100. [[w.prezidium-tsk-kpss-1954]], I, 719–20 (doc. 292, Malin''s notes), 720–32 (doc. 293, the stenogram of items I and II; Castro, 720–23); III, 534–36 (P 100/I–II; the KGB''s note of May 27, Semichastny''s, not printed). See [[cal.1963-05-05.cuba]]. Made public: 2003. Names: Khrushchev, Castro, Podgorny, Brezhnev, Lesechko, Zhukov.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-fidel
      - name:podgorny-nikolai-v
      - name:brezhnev-leonid
      - polity:ussr
      - polity:cuba
      - polity:romania
- cite:
    id: cal.1963-06-10.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 536–43 (the protocol dated June 13: P 101/29, June 12, the trip to Bucharest of Khrushchev, Brezhnev, Kosygin, Podgorny and Andropov, and the instructions to Zhegalin; P 101/32, June 13, 30,000 tons of meat lent to Poland for July and August, to be returned in January–April 1964, and Khrushchev''s letter to Gomułka; the headings of the Algerian, Chinese and Italian items)'
    units: '?'
- cite:
    id: cal.1963-06-13.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 543–47 (P 101/XXIX, June 13, and Smirnov''s cipher telegram from Bonn of June 12 on relations with the Federal Republic: the Foreign Ministry to prepare proposals; not Khrushchev''s words)'
    units: '?'
- add:
    entry:
      id: cal.1963-07-18.soviet-union-leadership
      when: July 18
      date: '1963-07-18'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium, the secretaries, the Council of Ministers'' Presidium and the bureau of the Supreme Council of the National Economy, on planning capital construction: the chief fault, investment planned by branch, not by named projects, so that ministers hand out great sums by private arrangement with local organs; Moscow given 995 million rubles for housing in 1960–62. His remarks of the same day: account to be kept of capacity brought into use, not of money spent.'
      n: '*Zapiska ... N. S. Khrushcheva v Prezidium TsK KPSS o planirovanii kapital''nogo stroitel''stva*, July 18, 1963, dictated July 8. [[w.prezidium-tsk-kpss-1954]], III, 456–63 (docs. 285.1.2–285.1.3, printed with the resolution of Mar. 13; no note of it in vol. I). See [[cal.1963-03-12.soviet-union-leadership]]. Made public: 2008. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
- cite:
    id: cal.1963-07-23.china
    item: '[[w.prezidium-tsk-kpss-1954]], III, 547–55 (P 107/I, the draft treaty banning tests in the atmosphere, in space and under water approved; P 107/III, Khrushchev, Gromyko and Grechko the delegation to the Warsaw Pact meeting, with the draft protocol on Mongolia''s accession; P 107/XII, July 24, Ustinov to preside at the Council of Ministers'' Presidium; the Chinese item, its heading only)'
    units: '?'
- cite:
    id: cal.1963-08-01.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 555 (Protocol 108: the heading only)'
    units: '?'
- cite:
    id: cal.1963-09-04.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 555–64 (P 113/I–VI: the Yugoslav trip approved; Khrushchev''s note of Aug. 25 on fertilizers; Dobrynin''s cipher telegram of Aug. 31 on the Soviet fishing vessels off the American east coast, to Kosygin; Erroll''s reception, on Patolichev''s note of Aug. 31; Kosygin''s return visit to Austria; the Conakry airfield and gas for Afghanistan, the headings; coins of one ruble and fifty kopecks with a lettered edge; the headings of the Cairo telegram on the talk with Amer, the answer to Dejoie, the plenum)'
    units: '?'
- add:
    entry:
      id: cal.1963-09-05.soviet-union-leadership
      when: Sept. 5
      date: '1963-09-05'
      thread: soviet-union-leadership
      c: 'Khrushchev, two notes to the Presidium. Potatoes and vegetables for the cities: the specialized state farms right, the cities still short. Mineral fertilizers: their export to stop by 1964 or be cut to a minimum, sold only to those "кому по политическим соображениям нельзя отказать" (whom on political grounds we cannot refuse); "самое глупое – экспортировать минеральные удобрения, а самим покупать зерно" (the most foolish thing is to export fertilizer and buy grain ourselves).'
      n: '*Zapiski ... N. S. Khrushcheva*, Sept. 5, 1963, sent to the Presidium''s members and candidates and the secretaries. [[w.prezidium-tsk-kpss-1954]], III, 566–74 (doc. 298.0.1, potatoes and vegetables), 584–92 (doc. 299.0.1, fertilizers). See [[cal.1963-09-04.soviet-union]]. Made public: 2008. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1963-09-10.soviet-union-leadership
      when: Sept. 10
      date: '1963-09-10'
      thread: soviet-union-leadership
      also:
      - china
      c: 'The Presidium on Khrushchev''s notes of Sept. 5: the price of potatoes to be raised, the growers rewarded; on sugar beet: "Подняли цены на мясо, а мяса не прибавилось" (we raised meat prices, and there is no more meat); fertilizer plants to be brought in on time. The Chinese: Suslov, Ponomarev, Andropov and Ilyichev to prepare "не только обороняться, но и наступать" (not only to defend but to attack). On the Chinese at Naushki station: a letter to the Chinese party, a letter to the progressive forces of Asia, Africa and Latin America, a statement.'
      n: 'Protocol 114. [[w.prezidium-tsk-kpss-1954]], I, 738–39 (doc. 298, Malin''s notes: "Без записи. Т. Суслову возглавить" (not recorded; Suslov to lead)), 740–61 (doc. 299, Khrushchev''s speeches, the stenogram); III, 564–92 (P 114/II, V and the rest, Khrushchev''s notes of Sept. 5). Made public: 2003. Names: Khrushchev, Suslov, Ponomarev, Andropov, Ilyichev.'
      tags:
      - name:khrushchev-nikita-s
      - name:suslov-mikhail-a
      - name:ponomarev-boris-n
      - name:andropov-yuriy-vladimirovich
      - polity:ussr
      - polity:prc
- add:
    entry:
      id: cal.1963-10-21.soviet-union-leadership
      when: Oct. 21
      date: '1963-10-21'
      thread: soviet-union-leadership
      also:
      - china
      - cuba
      c: 'The Presidium at lunch. Trade with Spain: Ibárruri to be told "нам это не нужно" (we do not need it). Stil''s letter, "Как это т. Сурков допустил?" (how did Surkov allow it?); Ehrenburg to be told "вы сами будете цензором" (you will be your own censor). Wheat for the Hungarians; Zhivkov''s talk, a joint planning organ. A telegram from Peking on remarks about Cuba at Comecon: to be refuted, Castro told; a telegram from Cuba on aid. On the meeting of the parties, Khrushchev: forcing it means a split, Thorez''s view; Togliatti''s, not forcing it, more right. Zhou Enlai answered best by a Central Committee letter to the Chinese party, "без полемики" (without polemic).'
      n: 'Protocol 120. [[w.prezidium-tsk-kpss-1954]], I, 761–62 (doc. 300, Malin''s notes); III, 592–613 (the protocol dated Oct. 25; Ehrenburg''s letter and Lesyuchevsky''s; Zhivkov''s and the Bulgarian Politburo''s letters, P 120/V; the headings of the rest). Check: the day; vol. III''s editors have the session on Oct. 25, Brezhnev presiding, Khrushchev not among those present (III, 1038 n.1, 594 n.в), Malin''s notes Oct. 21, at lunch, Khrushchev speaking. Made public: 2003. Names: Ibárruri, Stil, Surkov, Ehrenburg, Zhivkov, Castro, Khrushchev, Thorez, Togliatti, Zhou Enlai.'
      tags:
      - name:castro-fidel
      - name:khrushchev-nikita-s
      - name:thorez-maurice
      - name:zhou-enlai
      - polity:ussr
      - polity:prc
      - polity:cuba
- add:
    entry:
      id: cal.1963-10-23.soviet-union-leadership
      when: Oct. 23
      date: '1963-10-23'
      thread: soviet-union-leadership
      also:
      - china
      - cuba
      c: 'The Presidium, by poll, approves instructions to Alekseyev in Havana and Chervonenko in Peking: *Cankao xiaoxi*''s reprints of the *Financial Times* and *Der Spiegel* on the Comecon meeting in Prague, that Cuba''s economic policy was sharply criticized there and a control commission demanded, "сплошной фальшивкой" (sheer fabrication), perhaps inspired from China; Castro to be given the TASS statement, "Провокационный вымысел" (a provocative invention).'
      n: 'P 120/33. [[w.prezidium-tsk-kpss-1954]], III, 594–97 (doc. 300.3 and the instructions; for: Brezhnev, Kirilenko, Kosygin, Podgorny, Polyansky, Khrushchev, Shvernik). See [[cal.1963-10-21.soviet-union-leadership]]. Made public: 2008. Names: Alekseyev, Chervonenko, Castro.'
      tags:
      - name:alekseyev-aleksandr-i
      - name:chervonenko-stepan-v
      - name:castro-fidel
      - polity:ussr
      - polity:prc
      - polity:cuba
- add:
    entry:
      id: cal.1963-10-24.soviet-union-leadership
      when: Oct. 24
      date: '1963-10-24'
      thread: soviet-union-leadership
      also:
      - cuba
      c: 'The Presidium, by poll: free aid to Cuba after the hurricane, equipment for a plant of prefabricated housing, 30,000 tons of cement, timber, glass, food and goods, and the unions'' aid; Khrushchev''s letter to Castro to be published, his answer too. Vinogradov in Paris told: no diplomatic or other relations with Spain now.'
      n: 'P 120/36, 37 and 43. [[w.prezidium-tsk-kpss-1954]], III, 598–607 (the resolutions, the draft decree, Khrushchev''s letter of Oct. 24, the notes of the Ustinov and Kosygin commissions and of Grishin, and the instructions to Vinogradov). See [[cal.1963-10-23.soviet-union-leadership]]. Made public: 2008. Names: Khrushchev, Castro, Vinogradov.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-fidel
      - polity:ussr
      - polity:cuba
- add:
    entry:
      id: cal.1963-11-10.soviet-union-leadership
      when: Nov. 10
      date: '1963-11-10'
      thread: soviet-union-leadership
      c: 'The Presidium on Lomako''s draft plan for 1964–65, stenographed. Khrushchev: no revolutionary leap in chemistry; "Давайте заморозим на три года металлургию и отдадим средства на химию" (let us freeze metallurgy for three years and give the money to chemistry), three billion rubles a year for seven years; 70–80 million tons of fertilizer by 1970; synthetics to double cloth and shoes; free meals in crèches, kindergartens and schools; five to ten plants to be bought. Approved in principle.'
      n: 'Protocol 122, item I. [[w.prezidium-tsk-kpss-1954]], I, 762–63 (doc. 301, Malin''s notes), 763–79 (doc. 302, the stenogram); III, 613–14 (P 122/I). Made public: 2003. Names: Lomako, Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
- cite:
    id: cal.1963-11-26.soviet-union-2
    item: '[[w.prezidium-tsk-kpss-1954]], III, 614–22 (the protocol dated Dec. 4: the headings of the Barghoorn, Bagramyan and other items; P 125/XVII, Dec. 4, moral and political support for Cambodia, the instructions to Krutikov and an oral statement to the British Embassy for an international conference on Cambodia; P 125/XXXI, the answer to Iran''s note of Nov. 23, the instructions to Zaitsev; the heading on the talk with Gomułka about a letter to Mao)'
    units: '?'
- cite:
    id: cal.1963-12-04.cuba
    item: '[[w.prezidium-tsk-kpss-1954]], III, 615–17, 622 (P 125/II, Dec. 4: the delegation to Czechoslovakia, Brezhnev at its head, and the telegram to Zimyanin; P 125/XXXV, Dec. 4: Podgorny to head the delegation to Cuba for the anniversary of Jan. 1; P 125/XLV, dated Nov. 26, the session Dec. 4 by the editors, 615 n.в: a plenum on farming in February 1964, which Malin''s notes have on Nov. 26, I, 780; the heading "organizational questions")'
    units: '?'
- cite:
    id: cal.1963-12-23.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 625 (P 126/VIII, the main lines of secondary schooling: the heading and those who prepared it, Khrushchev, Voronov, Mikoyan, Polyansky, Brezhnev, Lavrentyev)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-23.soviet-union-leadership
      when: Dec. 23
      date: '1963-12-23'
      thread: soviet-union-leadership
      also:
      - cuba
      c: 'The Presidium, the same session as the schools. The December plenum''s decisions on chemistry: tasks to be assigned, letters by branch to the party organizations, the VSNKh not to be supplanted. The delegation to Cuba for the revolution''s fifth anniversary, under Podgorny: its trip to be announced by radio Dec. 23 and in the press Dec. 24, "Почему раньше не опубликовали?" (why was it not published before?); the greeting to repeat Cuba''s position on the base at Guantánamo and its four or five conditions; gifts, Castro''s apart.'
      n: 'Protocol 126, items I and XI. [[w.prezidium-tsk-kpss-1954]], I, 781–82 (doc. 304, Malin''s notes); III, 622–29 (P 126/I and Malin''s own jottings for it, P 126/XI and the departments'' note, P 126/XII on the gifts). See [[cal.1963-12-23.soviet-union]], [[cal.1963-12-04.cuba]]. Made public: 2003. Names: Podgorny, Castro.'
      tags:
      - name:podgorny-nikolai-v
      - name:castro-fidel
      - polity:ussr
      - polity:cuba
      - polity:us
- add:
    entry:
      id: cal.1964-01-09.soviet-union-leadership
      when: Jan. 9
      date: '1964-01-09'
      thread: soviet-union-leadership
      c: 'The Presidium on qualified cadres for the lagging collective farms, some 8,000 of them, Polyansky reporting: the draft leaves the farmer with little while the chairman gets 22 to 40 times more; Suslov: "Развращающие оклады" (corrupting salaries). Back to the commission for ten days. Pensions and social insurance for collective farmers, at 65: perhaps through the Supreme Soviet, perhaps tied to the draft Constitution (Brezhnev); two weeks more.'
      n: 'Protocol 128, items II and III. [[w.prezidium-tsk-kpss-1954]], I, 819–20 (doc. 306, Malin''s notes); III, 633–43 (P 128/II and III, the draft and the Polyansky commission''s note). Made public: 2003. Names: Polyansky, Suslov, Brezhnev.'
      tags:
      - name:polyansky-dmitri-s
      - name:suslov-mikhail-a
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1964-03-05.soviet-union-leadership
      when: Mar. 5
      date: '1964-03-05'
      thread: soviet-union-leadership
      also:
      - cuba
      c: The Presidium, Brezhnev presiding, on a question from a Central Committee department, Ponomarev reporting. A telegram to the Soviet Ambassador in Cuba held back, on Khrushchev's order.
      n: 'Protocol 135, additional item 9 (P 337). [[w.prezidium-tsk-kpss-1954]], I, 820 (doc. 307, Malin''s notes and the marks on them: "Отправка телеграммы совпослу на Кубе задержана (по указанию т. Хрущева Н.С.)"); I, 1159 n.1 (present); III, 643 (the heading). Made public: 2003. Names: Brezhnev, Ponomarev, Khrushchev.'
      tags:
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - name:ponomarev-boris-n
      - polity:ussr
      - polity:cuba
- cite:
    id: cal.1964-03-20.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 643 (Protocol 137: the heading only)'
    units: '?'
- add:
    entry:
      id: cal.1964-04-23.soviet-union-leadership
      when: Apr. 23
      date: '1964-04-23'
      thread: soviet-union-leadership
      c: 'The Presidium on buying complete plants in Italy on long-term credit, on Kosygin''s report of his delegation''s visit, Mar. 17–27, for the Soviet exhibition at Genoa: the balance of payments to match; ships to be built at home rather than ordered abroad; "Невероятный бюрократизм в проектировании" (incredible bureaucracy in design) holds up the purchases; whoever alters a bought plant to be tried. Fertilizers and plant protection for 1965–70 adopted, with Kosygin''s addition.'
      n: 'Protocol 140, items IV and V. [[w.prezidium-tsk-kpss-1954]], I, 821–22 (doc. 309, Malin''s notes); III, 644–77 (P 140/IV and V, the drafts, the delegation''s report of Apr. 8, signed by Kosygin, Kostandov, Fedorov, Lebedev, Tarasov and Semichastnov, and Ustinov''s note). Made public: 2003. Names: Kosygin.'
      tags:
      - name:kosygin-aleksei
      - polity:ussr
      - polity:italy
- cite:
    id: cal.1964-05-26.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 677 (P 145/I: Khrushchev''s work in the UAR approved)'
    units: '?'
- cite:
    id: cal.1964-06-04.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 678–96 (P 147/II, the answer to the Chinese party''s letter of May 7, with the draft letter and the instructions to Chervonenko; the resolutions on Suslov''s, Mikoyan''s and Kosygin''s reports)'
    units: '?'
- add:
    entry:
      id: cal.1964-07-02.soviet-union-leadership
      when: July 2
      date: '1964-07-02'
      thread: soviet-union-leadership
      c: The Presidium on salaries at NII-9 and NII-130 of the State Committee on Defense Technology, Smirnov and Podgorny speaking. Kosygin against, for the second time. Volkov and Garbuzov to study it again.
      n: 'Protocol 149, item V. [[w.prezidium-tsk-kpss-1954]], I, 827 (doc. 312, Malin''s notes); III, 696 (P 149/V). Made public: 2003. Names: Smirnov, Podgorny, Kosygin, Volkov, Garbuzov.'
      tags:
      - name:podgorny-nikolai-v
      - name:kosygin-aleksei
      - polity:ussr
- cite:
    id: cal.1964-07-30.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 696–727 (P 152/II on secondary and higher schooling, the draft decree, the education commission''s report and Kairov''s note)'
    units: '?'
- add:
    entry:
      id: cal.1964-08-19.soviet-union-leadership
      when: Aug. 19
      date: '1964-08-19'
      thread: soviet-union-leadership
      c: 'The Presidium, stenographed, the same session as the border principles. Khrushchev on his trip of Aug. 4–18 through the Volga, the Don, the Kuban, Tatarstan, Bashkiria, the virgin lands and Kirghizia: Russia may give 2.4 billion poods of grain, Kazakhstan at least a billion; the production administrations kept, fewer, specialized by branch; farms free to sell vegetables at market below the set prices, talk abroad of a relaxation "Это глупость" (that is nonsense); Sel''khoztekhnika to be reorganized. On prices and the farms'' costs, a clash with Polyansky: "Не суйте в нос. Я человек" (do not shove it in my face; I am a person); Khrushchev: "Я тоже человек" (so am I); "Я не доверяю ... Садитесь на мое место, я на Ваше сяду" (I do not trust you ... take my place, I will take yours). Polyansky: settle it before the plenum? Khrushchev: before, if possible. "Сейчас не будем решать" (we will not decide now).'
      n: 'Protocol 155, item I. [[w.prezidium-tsk-kpss-1954]], I, 828–52 (doc. 314, the uncorrected stenogram; the clash, 838–39); I, 1165 n.1 (the trip, approved by P 155/1). See [[cal.1964-08-19.china]]. Made public: 2003. Names: Khrushchev, Polyansky.'
      tags:
      - name:khrushchev-nikita-s
      - name:polyansky-dmitri-s
      - polity:ussr
- add:
    entry:
      id: cal.1964-09-10.soviet-union-leadership
      when: Sept. 10
      date: '1964-09-10'
      thread: soviet-union-leadership
      c: 'The Presidium, stenographed, on Khrushchev''s trip to Czechoslovakia and his note: Husák''s applause at Banská Bystrica, the Czech–Slovak question; Czech, Polish, Bulgarian and Romanian capital for Soviet copper, nickel and chemicals, "Наш Госплан не понимает этих вопросов" (our Gosplan does not understand these questions); Tito, in Leningrad: "меня не слушают" (they do not listen to me). Approved; a confederation of Czechoslovakia and the USSR not to be raised for now.'
      n: 'Protocol 158, item I. [[w.prezidium-tsk-kpss-1954]], I, 852–53 (doc. 315, Malin''s notes), 853–57 (doc. 316, the stenogram); III, 729–35 (P 158/I and Khrushchev''s note on economic cooperation). Made public: 2003. Names: Khrushchev, Husák, Tito.'
      tags:
      - name:khrushchev-nikita-s
      - name:tito-josip-broz
      - polity:ussr
      - polity:czechoslovakia
      - polity:poland
      - polity:romania
      - polity:yugoslavia
- add:
    entry:
      id: cal.1964-09-17.soviet-union-leadership
      when: Sept. 17
      date: '1964-09-17'
      thread: soviet-union-leadership
      c: 'The Presidium. Khrushchev for breaking up the Timiryazev Academy, Volovchenko for keeping it: moved to the Voronovo state farm, nothing built. No chemical plant of backward technology to be built; vinol bought from Japan. Documents to go by one channel, none to the long sick, Kozlov. Nasriddinova''s talk on Furtseva: "Неровная" (uneven); younger women to be put forward. The congress at the end of 1965 or early 1966; the Presidium in three tiers, young, middle and old. Mikoyan perhaps to Finland, a decoration for Kekkonen.'
      n: 'Protocol 159, items IV, XXVII, XXIX and others. [[w.prezidium-tsk-kpss-1954]], I, 857–58 (doc. 317, Malin''s notes); III, 735–41 (P 159/42, by poll, on Finland''s twentieth anniversary out of the war, with the instructions to Zakharov and Gromyko''s note; P 159/IV, XXVII with Khrushchev''s remarks, XXIX). Made public: 2003. Names: Khrushchev, Volovchenko, Kozlov, Nasriddinova, Furtseva, Mikoyan, Kekkonen.'
      tags:
      - name:khrushchev-nikita-s
      - name:kozlov-frol-r
      - name:furtseva-yekaterina-a
      - name:mikoyan-anastas
      - polity:ussr
      - polity:japan
- cite:
    id: cal.1964-09-25.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 741–50 (the delegation to Peking for the fifteenth anniversary, its letter, the instructions to Chervonenko and its directives; P 160/III, Dobrynin''s telegram of Sept. 21 agreed in principle, the Foreign Ministry to draft the answer; Gromyko''s telegram to Chen Yi; the headings of the Romanian delegation in China, Malinovsky and Biryuzov''s note of Sept. 22 on Cuba, grain for the Czechs, Goreglyad''s report on the seven-year plan)'
    units: '?'
- cite:
    id: cal.1964-10-08.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 750–67 (P 162/I: the drafting committee of the communist and workers'' parties to meet, the letters to the parties, the telegram to the ambassadors in Italy, Britain, Romania, Brazil and Cuba, the theses for talks, and the departments'' notes)'
    units: '?'
- cite:
    id: cal.1964-10-13.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 865–68 (Malin''s notes of Oct. 13 continued, Grishin and the others: "Пышно расцвел культ личности одного лица" (the cult of one person''s personality has bloomed lushly))'
    units: '?'
- cite:
    id: cal.1964-10-14.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 868–71 (Oct. 14, the speeches before Brezhnev''s: Polyansky, "Заболели манией величия" (you have caught megalomania); Mikoyan; Rashidov; Kosygin, "Вас освободить от всех постов" (relieve you of all posts); Podgorny)'
    units: '?'
- cite:
    id: cal.1964-10-14.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 767–68 (P 164/I, Oct. 13–14: Khrushchev''s errors, his "преклонном возрасте" (advanced age) and failing health; his posts to be divided)'
    units: '?'
- add:
    entry:
      id: cal.1964-10-22.soviet-union-leadership
      when: Oct. 22
      date: '1964-10-22'
      thread: soviet-union-leadership
      c: 'The Presidium. Suslov on his talk with the Hungarians: harsh, nothing of his merits, unexpected; did Moscow mean to change its policy on the cult; they asked that Khrushchev''s working-over not become "вот был культ Сталина, вот культ Хрущева" (there was Stalin''s cult, here is Khrushchev''s) in the press. Brezhnev, Kosygin and Andropov to meet Gomułka and the Polish party on Oct. 24: of the cult, restrained words; of Adzhubei, "болтливый" (a chatterbox); the trip to the Federal Republic never decided; on China, no change, the press polemic halted. The obkoms to be reunited in principle, the plenum to take it up.'
      n: 'Protocol 166, items I, Iб and II. [[w.prezidium-tsk-kpss-1954]], I, 872–73 (doc. 321, Malin''s notes); III, 771–72 (P 166/I and II). See [[cal.1964-10-14.soviet-union]]. Made public: 2003. Names: Suslov, Khrushchev, Brezhnev, Kosygin, Andropov, Gomułka, Adzhubei.'
      tags:
      - name:suslov-mikhail-a
      - name:khrushchev-nikita-s
