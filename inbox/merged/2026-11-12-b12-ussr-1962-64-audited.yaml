      - name:kosygin-aleksei
      - name:adzhubei-aleksei
      - name:andropov-yuriy-vladimirovich
      - polity:ussr
      - polity:poland
      - polity:prc
      - polity:frg
- add:
    entry:
      id: cal.1964-10-27.soviet-union-leadership
      when: Oct. 27
      date: '1964-10-27'
      thread: soviet-union-leadership
      c: 'The Presidium on its report to the Central Committee on the discussion of Khrushchev. Kosygin: more on the cult, softer on his contribution; Podgorny would not use "культ личности" (the cult of personality); Grishin: "«Культ» – это репрессии" (the cult means the repressions); Polyansky: say something of his contribution. Suslov, Podgorny and Brezhnev to edit it and the plenum''s record of Oct. 14. Sorge''s Hero title to be studied further. The obkoms reunited, with amendments; the plenum for Nov. 15–20, Podgorny reporting; the Supreme Soviet in December.'
      n: 'Protocol 167, items I–IV and 2. [[w.prezidium-tsk-kpss-1954]], I, 874–75 (doc. 322, Malin''s notes); III, 772–75 (P 167/I; the headings of Shuisky''s work, Sorge, the embassy in the UAR; P 168/12, Oct. 28, the instructions to the ambassadors on informing the fraternal parties). See [[cal.1964-10-22.soviet-union-leadership]]. Made public: 2003. Names: Khrushchev, Kosygin, Podgorny, Grishin, Polyansky, Suslov, Brezhnev, Sorge.'
