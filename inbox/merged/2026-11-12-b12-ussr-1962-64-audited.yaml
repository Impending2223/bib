patch: 2026-11-12-b12-ussr-1962-64
by: 'Claude (audit of the reader''s patch 2026-11-12-b12-ussr-1962-64, batch 12, the USSR, 1962–64: *Prezidium TsK KPSS 1954–1964*, I and III), Nov. 12, 2026'
ops:
- cite:
    id: cal.1962-01-08.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 237–51 (P 11/I, Jan. 8, and its attachments: Khrushchev''s tactical positions for the talks agreed; Gromyko''s statement to Thompson and the drafts of a Statute of the Free Demilitarized City of West Berlin and of a protocol of guarantees approved with amendments, to be agreed with the socialist countries; the voters, Kozlov, Kosygin, Kuusinen, Suslov, Podgorny, Khrushchev, Shvernik, 237 n.б: none of the words of c)'
    units: '?'
- cite:
    id: cal.1962-01-02.berlin-and-vienna
    item: '[[w.prezidium-tsk-kpss-1954]], III, 237–38 (doc. 242.0.1, the Foreign Ministry''s note to the Central Committee, Jan. 5, Gromyko: Thompson called on Jan. 2 to resume the exchange on Germany; access the West''s chief concern; two variants, a corridor under Western control or an international organ over the autobahn and the air routes, both unacceptable; not the three months'' review)'
    units: '?'
- cite:
    id: cal.1962-01-11.berlin-and-vienna
    item: '[[w.prezidium-tsk-kpss-1954]], III, 240–50 (docs. 242.0.2–242.0.5: the text of Gromyko''s statement to Thompson as the Presidium approved it, Jan. 8: the borders, no nuclear arms for either German state, a NATO–Warsaw Pact nonaggression pact, the GDR''s sovereignty, Western troops in West Berlin as guarantors with Soviet; the draft statute and protocol; the draft resolution of Jan. 9 letting the Foreign Ministry hand them to Thompson at the next meeting; not the meeting itself, nor Thompson''s words)'
    units: '?'
- add:
    entry:
      id: cal.1962-03-09.soviet-union-leadership
      when: Mar. 9
      date: '1962-03-09'
      thread: soviet-union-leadership
      c: 'The Presidium, on the conduct of Furtseva, Mukhitdinov and Firyubin. Furtseva asks to be believed that she was ill; Mukhitdinov and Firyubin accept the findings, Firyubin: "но иначе я не смог сделать" (but I could not have done otherwise). Khrushchev: a bad act, which people take for a protest against the party; the report and the decision to say "owing to illness"; Firyubin to be told his conduct was wrong; Mukhitdinov, "ошиблись в нем" (we were wrong about him), backed an Uzbek clique. Agreed.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 549–50 (doc. 244, Protocol 22, Malin''s notes; present, among others, Brezhnev, Kozlov, Kosygin, Mikoyan, Suslov, Khrushchev, Shelepin); I, 1095–96 n.1 (the editors: Furtseva and Mukhitdinov not elected to the Presidium at the plenum of Oct. 31, 1961, nor Mukhitdinov to the Secretariat; they and Firyubin absent from the congress''s last session; the matter for the plenum of Mar. 5–9, 1962; no protocol of the session in RGANI); III, 251 (doc. 244.0, the heading, under Protocol 22 of Mar. 22). Made public: 2003. Names: Furtseva, Mukhitdinov, Firyubin, Khrushchev.'
      tags:
      - name:furtseva-yekaterina-a
      - name:mukhitdinov-nuritdin-a
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1962-03-22.soviet-union-leadership
      when: Mar. 22
      date: '1962-03-22'
      thread: soviet-union-leadership
      c: 'The Presidium, Protocol 22 continued, on the party''s guidance of industry, Khrushchev''s question, Khrushchev, Podgorny and thirteen others speaking: a year gone and the works not built; resistance in Gosplan and the State Economic Council; perhaps committees by branch. His posing of the question approved; a commission under him, with Kozlov, Kosygin, Zasyadko, Novikov, Ustinov and Rudnev, to draft proposals; Voronov, Podgorny and the republics'' and regions'' secretaries to give theirs. The decree on production administrations for farming adopted, to be published. Grossman''s letter to Khrushchev of Feb. 23 on his novel *Zhizn'' i sud''ba*: Suslov to receive him: "Ваше произведение за нас или против? Советуем быть осторожным" (Is your work for us or against? We advise you to be careful).'
      n: 'Protocol 22, items II, III and VIII. [[w.prezidium-tsk-kpss-1954]], I, 550–51 (doc. 244, Malin''s notes); III, 251–55 (P 22/II, P 22/III, P 22/VIII; Grossman''s letter, 252–55). See [[cal.1962-03-09.soviet-union-leadership]]. Made public: 2003; Grossman''s letter, 1997 (III, 255). Names: Khrushchev, Kozlov, Kosygin, Zasyadko, Novikov, Ustinov, Rudnev, Voronov, Podgorny, Grossman, Suslov.'
      tags:
      - name:khrushchev-nikita-s
      - name:kozlov-frol-r
      - name:kosygin-aleksei
      - name:voronov-gennady-i
      - name:podgorny-nikolai-v
      - name:suslov-mikhail-a
      - polity:ussr
- add:
    entry:
      id: cal.1962-03-05.soviet-union-leadership
      when: Mar. 5
      date: '1962-03-05'
      thread: soviet-union-leadership
      also:
      - china
      c: The Presidium approves an information note, "Об отношениях Компартии Китая с КПСС и другими братскими партиями" (On the relations of the Communist Party of China with the CPSU and the other fraternal parties); the members and candidates of the Central Committee and the Central Auditing Commission to read it, with the Central Committee's letter to the Chinese party of Feb. 22.
      n: 'P 22/43. [[w.prezidium-tsk-kpss-1954]], III, 256–57 (doc. 246.1; no note of it in vol. I). Made public: 2008.'
      tags:
      - polity:ussr
      - polity:prc
- cite:
    id: cal.1962-03-29.soviet-union-2
    item: '[[w.prezidium-tsk-kpss-1954]], III, 255–56 (P 23/XL: the proposals right in the main; the Secretariat to rework them on the opinions given and to look again at the editorial board; then back to the Presidium)'
    units: '?'
- add:
    entry:
      id: cal.1962-04-14.soviet-union-leadership
      when: Apr. 14
      date: '1962-04-14'
      thread: soviet-union-leadership
      also:
      - china
      c: 'The Presidium, on Ponomarev''s note of Apr. 9: the Central Committee''s letter of Feb. 22 to the Chinese party, already shown to the socialist countries'' parties and eleven others, to be made known orally, through the Soviet ambassadors, to thirty more parties of the capitalist countries, the American party''s through the KGB''s resident.'
      n: 'P 26/12. [[w.prezidium-tsk-kpss-1954]], III, 257–58 (doc. 246.2 and Ponomarev''s note, 246.2.1; no note of it in vol. I). See [[cal.1962-03-05.soviet-union-leadership]]. Made public: 2008. Names: Ponomarev.'
      tags:
      - name:ponomarev-boris-n
      - polity:ussr
      - polity:prc
      - polity:us
- cite:
    id: cal.1962-04-17.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 256 (P 26/I: Ilyichev and Ponomarev, with the institutes of the Academy of Sciences, the Foreign Trade Ministry and the State Economic Council, to prepare materials on the Common Market and the free trade area, and articles for the Soviet press; not the Chinese letter)'
    units: '?'
- cite:
    id: cal.1962-04-28.berlin-and-vienna
    item: '[[w.prezidium-tsk-kpss-1954]], III, 278–79 (P 28/I: the Foreign Ministry to draft the directives for the talks on the exchange of views; not their terms)'
    units: '?'
- add:
    entry:
      id: cal.1962-05-11.soviet-union-leadership
      when: May 11
      date: '1962-05-11'
      thread: soviet-union-leadership
      also:
      - berlin-and-vienna
      c: 'The Presidium, the same session as defense, approves the reply note to the United States, Britain and France, on Gromyko''s note of May 5: West Berlin never part of the Federal Republic, its customs law not to be extended there; the note of Feb. 26 confirmed; the responsibility for the consequences of Bonn''s "provocative" acts on the three governments.'
      n: '[[w.prezidium-tsk-kpss-1954]], III, 279–82 (P 30/XII, dated May 11; doc. 248.0, the draft note, Gromyko''s note of May 5, the American note of Mar. 10 and the Soviet note to France of Feb. 26; no note of the item in vol. I). The session''s defense item (P 30/XXXIX, the same day): See [[cal.1962-05-11.soviet-union-3]]; Protocol 30''s sitting of May 9, [[cal.1962-05-09.berlin-and-vienna-2]]. Made public: 2008. Names: Gromyko.'
      tags:
      - name:gromyko-andrei
      - polity:ussr
      - polity:us
      - polity:uk
      - polity:fr
      - polity:frg
- cite:
    id: cal.1962-05-31.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], III, 282–83 (P 33/II: the correctives of the plan''s control figures for 1963–65 approved in the main; not the prices or the defense cut)'
    units: '?'
- add:
    entry:
      id: cal.1962-05-31.soviet-union-leadership
      when: May 31
      date: '1962-05-31'
      thread: soviet-union-leadership
      also:
      - china
      c: 'The Presidium, the same session as the plan''s correctives, approves the Central Committee''s letter to the Chinese party, the answer to its letter of Apr. 7: no meeting of all the parties without great preparation, as Deng Xiaoping said in handing it over; the Albanian question not to be reopened while Hoxha and Shehu attack the fraternal parties; joint action against the imperialists'' propaganda on Soviet–Chinese relations. The letter to go to the other socialist countries'' parties, the Vietnamese among them, at the Comecon meeting in June.'
      n: 'P 33/I. [[w.prezidium-tsk-kpss-1954]], III, 258–78 (doc. 246.3 and the letter, 246.3.1; no note of the item in vol. I). See [[cal.1962-05-31.soviet-union]], [[cal.1962-04-14.soviet-union-leadership]]. Made public: 2008. Names: Deng Xiaoping, Hoxha, Shehu.'
      tags:
      - name:deng-xiaoping
      - polity:ussr
      - polity:prc
      - polity:drv
- add:
    entry:
      id: cal.1962-06-10.soviet-union-leadership
      when: June 10
      date: '1962-06-10'
      thread: soviet-union-leadership
      c: 'The Presidium, the same session as Rashidov''s report on Cuba, first on Kozlov''s report of the events in Novocherkassk: "Хорошо провели акцию. Другого выхода у нас не было" (the action well carried out; we had no other way out); the sectarian organizations to be broken up; Basov a weak worker; the KGB''s work to be strengthened. Shelepin, Semichastny, Ivashutin and others to bring proposals in a month.'
      n: 'Protocol 35, item II. [[w.prezidium-tsk-kpss-1954]], I, 568 (doc. 252, Malin''s notes; Kozlov, Mikoyan, Ilyichev, Khrushchev speaking); I, 1102 nn.1–2 (the editors: the prices of meat, milk and eggs raised June 1; the troops fired on the demonstrators, about 23 dead; Basov, first secretary in Rostov); III, 283 (P 35/II). See [[cal.1962-06-10.missile-crisis]], [[cal.1962-06-01.soviet-union]]. Made public: 2003. Names: Kozlov, Basov, Shelepin, Semichastny, Ivashutin.'
      tags:
      - name:kozlov-frol-r
      - name:shelepin-aleksandr-n
      - polity:ussr
- add:
    entry:
      id: cal.1962-06-21.soviet-union-leadership
      when: June 21
      date: '1962-06-21'
      thread: soviet-union-leadership
      c: 'The Presidium on the confiscation without compensation of houses, dachas and other buildings built or bought on unearned income. Brezhnev: the decree allows twenty years to be checked; Mikoyan: strike "unlawful acquisition of materials"; Suslov: the draft breeds fears. Kosygin''s proposals approved in the main; the decrees to be the republics'' Supreme Soviet Presidiums'', on a model text Brezhnev and seven others to edit.'
      n: 'Protocol 37, item III. [[w.prezidium-tsk-kpss-1954]], I, 568–69 (doc. 253, Malin''s notes); I, 1103 n.1 (Suslov presiding); III, 284 (P 37/III). Made public: 2003. Names: Brezhnev, Mikoyan, Suslov, Kosygin.'
      tags:
      - name:brezhnev-leonid
      - name:mikoyan-anastas
      - name:suslov-mikhail-a
      - name:kosygin-aleksei
      - polity:ussr
- cite:
    id: cal.1962-07-01.berlin-and-vienna
    item: '[[w.prezidium-tsk-kpss-1954]], III, 284–85 (P 39/II and III: Khrushchev''s view on further proposals on Berlin agreed; the proposals for the talks with the Cubans approved; not their terms)'
    units: '?'
- add:
    entry:
      id: cal.1962-07-01.soviet-union-leadership
      when: July 1
      date: '1962-07-01'
      thread: soviet-union-leadership
      c: 'The Presidium at Ogarevo, the same session as Berlin and Cuba, on the KGB''s note of June 26: Moskalenko to be called in and dressed down before the marshals; Colonel Yuferov to be tried in closed court. The Leningrad party''s and sovnarkhoz''s note on the leading works and design bureaus: Brezhnev and Kirilenko to look into it.'
      n: 'Protocol 39, items XIII and XVII. [[w.prezidium-tsk-kpss-1954]], I, 570 (doc. 254, Malin''s notes); III, 285–87 (doc. 254.2, the KGB''s note, not printed; P 39/XVII and the note of Tolstikov and Antonov). See [[cal.1962-07-01.berlin-and-vienna]], [[cal.1962-07-01.soviet-union]]. Made public: 2003. Names: Moskalenko, Yuferov, Brezhnev, Kirilenko.'
      tags:
      - name:brezhnev-leonid
      - name:kirilenko-andrei-p
      - polity:ussr
- cite:
    id: cal.1962-07-06.missile-crisis
    item: '[[w.prezidium-tsk-kpss-1954]], III, 310 (doc. 255.1, "Вопросы по Кубе" (questions on Cuba): the heading of Malin''s note only)'
    units: '?'
- add:
    entry:
      id: cal.1962-07-06.soviet-union-leadership
      when: July 6
      date: '1962-07-06'
      thread: soviet-union-leadership
      c: 'The Presidium, the same session as Cuba, on research in biology, Khrushchev, Keldysh and Olshansky speaking: the direction right; the draft to be thoroughly redone, "abroad" and "if only" thrown out; Zhebrak published an article in the United States against Lysenko; not to be drafted bureaucratically. A commission, Lysenko on it, to bring new proposals.'
      n: 'Protocol 40, item III. [[w.prezidium-tsk-kpss-1954]], I, 570 (doc. 255, Malin''s notes); III, 287–310 (P 40/III, the drafts and the Elyutin commission''s note). See [[cal.1962-07-06.missile-crisis]]. Made public: 2003. Names: Keldysh, Olshansky, Khrushchev, Zhebrak, Lysenko.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - polity:us
- add:
    entry:
      id: cal.1962-07-12.soviet-union-leadership
      when: July 12
      date: '1962-07-12'
      thread: soviet-union-leadership
      c: 'The Presidium, the same session as the advisers for Cuba, on the correctives of the plan for 1963–65, Zasyadko, Khrushchev, Dymshits, Korovushkin and Mikoyan speaking: the cuts in meat and milk procurement against the plenum''s decision to be explained; wages and pensions raised without thought; reserves; "Против необдуманных скачков" (against ill-considered leaps); perhaps a ten-year plan; a ministry of power. The draft adopted in the main, to go to the republics.'
      n: 'Protocol 41, item I. [[w.prezidium-tsk-kpss-1954]], I, 571–72 (doc. 256, Malin''s notes); III, 310 (P 41/I). See [[cal.1962-07-12.cuba]]. Made public: 2003. Names: Zasyadko, Khrushchev, Dymshits, Korovushkin, Mikoyan.'
      tags:
      - name:dymshits-veniamin-e
      - name:mikoyan-anastas
      - name:khrushchev-nikita-s
      - polity:ussr
- cite:
    id: cal.1962-07-12.cuba
    item: '[[w.prezidium-tsk-kpss-1954]], III, 311 (P 41/II, "О командировании на Кубу группы советников по экономическим вопросам" (on sending a group of economic advisers to Cuba): Mikoyan, Rashidov and Shelepin to prepare proposals on the exchange of views; not the advisers'' terms)'
    units: '?'
- add:
    entry:
      id: cal.1962-07-26.soviet-union-leadership
      when: July 26
      date: '1962-07-26'
      thread: soviet-union-leadership
      c: 'The Presidium. Khrushchev on the apparatus: the state committees work like the old ministries; specialization, trusts by branch, perhaps for the plenum; the Constitution, the state''s structure to be reorganized. The universities: fewer in the capitals, more in the provinces, too many lawyers and actors; Ilyichev, Demichev and Rudnev to bring proposals. Mikoyan''s trip to Indonesia, Burma and India approved, "useful."'
      n: 'Protocol 43, items I–III. [[w.prezidium-tsk-kpss-1954]], I, 573–74 (doc. 257, Malin''s notes); III, 311–12 (P 43/I–III). Made public: 2003. Names: Khrushchev, Ilyichev, Demichev, Rudnev, Mikoyan.'
      tags:
      - name:khrushchev-nikita-s
      - name:demichev-pyotr-n
      - name:mikoyan-anastas
      - polity:ussr
      - polity:indonesia
      - polity:india
      - polity:burma
- add:
    entry:
      id: cal.1962-08-02.soviet-union-leadership
      when: Aug. 2
      date: '1962-08-02'
      thread: soviet-union-leadership
      c: 'The Presidium on Ishkov''s note: the fisheries'' work centralized by sea basin, the State Committee reckoning, on Khrushchev''s instructions, to give the ocean fleet of Karelia and Arkhangelsk to the Baltic and the Azov–Black Sea basins. Mikoyan: "Не возражаю. Но отрываем от республик" (I do not object. But we take it from the republics). Adopted with amendments.'
      n: 'Protocol 44, item VI. [[w.prezidium-tsk-kpss-1954]], I, 574 (doc. 258, Malin''s notes); III, 312–17 (P 44/VI, the draft decree and Ishkov''s note of July 25). Made public: 2003. Names: Ishkov, Mikoyan.'
      tags:
      - name:mikoyan-anastas
      - polity:ussr
- add:
    entry:
      id: cal.1962-08-20.soviet-union-leadership
      when: Aug. 20
      date: '1962-08-20'
      thread: soviet-union-leadership
      c: 'The Presidium, Kozlov presiding, on natural rubber and the state reserves, and on tires, Khrushchev, Mikoyan, Novikov, Shelepin, Kozlov and others speaking: "Госплан держит за горло" (Gosplan has us by the throat); Gosplan unmanageable, the Council of Ministers not in control; trusts by branch. An enlarged plenum on industry for late November or early December, the decision not yet recorded; a report to Khrushchev. AN-12 transports for India approved. The meeting on the Patriotic War put off; Rákosi to be sent to Central Asia.'
      n: 'Protocol 49. [[w.prezidium-tsk-kpss-1954]], I, 575–76 (doc. 259, Malin''s notes); I, 1105 n.1 (the signed protocol dated Aug. 23; present Voronov, Kirilenko, Mikoyan, Shelepin, Kozlov presiding); III, 317 (the headings, the protocol dated Aug. 23). Made public: 2003. Names: Kozlov, Khrushchev, Mikoyan, Novikov, Shelepin, Rákosi. Check: Malin lists Khrushchev among the speakers; the editors'' list of those present lacks him (I, 1105 n.1), and the notes have "Доклад т. Хрущеву" (a report to Comrade Khrushchev, I, 576).'
      tags:
      - name:khrushchev-nikita-s
      - name:kozlov-frol-r
      - name:mikoyan-anastas
      - name:shelepin-aleksandr-n
      - polity:ussr
      - polity:india
- add:
    entry:
      id: cal.1962-09-20.soviet-union-leadership
      when: Sept. 20
      date: '1962-09-20'
      thread: soviet-union-leadership
      c: 'The Presidium, stenographed. Khrushchev on his note on the party''s guidance of industry and farming: the party''s organs to be split, two obkoms, industrial and agricultural; Novocherkassk, where the norms were revised with the price of meat, the example of a party organization that did not do its work. The plenum on Nov. 19, the conferences in December; the Supreme Soviet on Dec. 10; the next plan for 1964–70. "Мы обменивались мнениями, решения не выносили" (we exchanged views, we took no decision).'
      n: 'Protocol 52, item I. [[w.prezidium-tsk-kpss-1954]], I, 576–96 (doc. 260, the uncorrected stenogram; Novocherkassk, 581; the calendar, 595); I, 1106 n.1; III, 318 (the heading). See [[cal.1962-08-20.soviet-union-leadership]]. Made public: 2003. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1962-11-05.soviet-union-leadership
      when: Nov. 5
      date: '1962-11-05'
      thread: soviet-union-leadership
      c: 'The Presidium adopts the plan for 1963 and the draft budget, Dymshits and Garbuzov reporting. Khrushchev, stenographed: the five-year plan of the Twentieth Congress "филькина грамота" (a worthless scrap), Saburov illiterate in planning; Stalin pushed plans with no backing; the chemical industry to be driven radically; Gosplan conservative, the current commission to go; councils at the works to have a say in naming directors; 4.2–4.5 billion poods of marketable grain in 1963, 5 billion in 1964; a joint plan with the socialist countries, Gomułka saying it is all talk.'
      n: 'Protocol 64, item I. [[w.prezidium-tsk-kpss-1954]], I, 625–26 (doc. 269, Malin''s notes), 627–45 (doc. 270, Khrushchev''s speech, the uncorrected stenogram); III, 392 (P 64/I). Made public: 2003. Names: Dymshits, Garbuzov, Khrushchev, Saburov, Gomułka.'
      tags:
      - name:dymshits-veniamin-e
      - name:khrushchev-nikita-s
      - polity:ussr
      - polity:poland
- add:
    entry:
      id: cal.1962-11-21.soviet-union-leadership
      when: Nov. 21
      date: '1962-11-21'
      thread: soviet-union-leadership
      also:
      - missile-crisis-settlement
      c: 'The Presidium, the same session as Laos, by vote, approves Khrushchev''s message to Mikoyan in Havana: Kennedy kept his word, the quarantine lifted; the crisis to be taken as past, no invasion to be expected for years. Mikoyan free to leave, by New York, to see Kuznetsov, Zorin, U Thant, McCloy and Stevenson; a visit to Washington useful. "Кубинская операция ... принесла свои плоды" (the Cuban operation bore fruit): socialism in Cuba "легализовано" (legalized); "мы его только перевезли" (we only moved) the weapons.'
      n: 'P 68/II. [[w.prezidium-tsk-kpss-1954]], III, 399–403 (doc. 272.1 and the draft, Gromyko''s; for: Brezhnev, Voronov, Kirilenko, Kozlov, Kosygin, Podgorny, Polyansky, Suslov, Khrushchev, 399 n.г; the telegram sent Nov. 21, 399 n.е). Malin''s note of the session (I, 646), headed "пункт II" (item II), is on Laos: See [[cal.1962-11-21.laos]], [[cal.1962-11-16.soviet-union]]. Made public: 2008. Names: Khrushchev, Mikoyan, Kennedy, Kuznetsov, Zorin, U Thant, McCloy, Stevenson.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:kennedy-john-f
      - name:kuznetsov-vasily-v
      - name:zorin-valerian
      - name:u-thant
      - name:mccloy-john-j
      - name:stevenson-adlai-e
      - polity:ussr
      - polity:cuba
      - polity:us
- add:
    entry:
      id: cal.1962-11-29.soviet-union-leadership
      when: Nov. 29
      date: '1962-11-29'
      thread: soviet-union-leadership
      c: 'The Presidium on carrying out the November plenum, stenographed: design bureaus and institutes joined by branch under committees, a coordinating council; Gosstroy centralized; Kosygin for committees on trade and the light and food industries; the farm works answerable to the agricultural bureaus. The artists'' letter of Nov. 20: Khrushchev sharp against formalism in painting and the errors of *Nedelya* and *Izvestia*, sharp words for Adzhubei. Noted: "Кассировать выборы, отобрать помещение, вызвать, арестовать, если надо" (annul the elections, take the premises, summon, arrest if need be). Suslov and Ilyichev to report.'
      n: 'Protocol 70, items I and VII. [[w.prezidium-tsk-kpss-1954]], I, 647–48 (doc. 273, Malin''s notes), 649–63 (doc. 274, the stenogram of item I); I, 1115 nn.1–2; III, 404–07 (P 70/I, P 70/VII, the artists'' letter). Made public: 2003. Names: Kosygin, Khrushchev, Adzhubei, Suslov, Ilyichev.'
      tags:
      - name:kosygin-aleksei
      - name:khrushchev-nikita-s
      - name:adzhubei-aleksei
