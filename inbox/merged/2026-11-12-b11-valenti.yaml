- add:
    entry:
      id: cal.1964-06-06.labor-2
      when: June 6
      date: '1964-06-06'
      thread: labor
      c: 'New York. Johnson walks with Dubinsky two blocks through the crowd from the health center to the union''s meeting,
        3:25 p.m., every one of the auditorium''s 1,600 seats filled; his remarks. To Dubinsky: "I''m going to do much better
        in New York than a lot of people think."'
      n: 'Remarks in New York City to Members of the International Ladies Garment Workers Union, [1963–64 Pub. Papers 750](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=834)
        (June 6, 1964) (3:25 p.m., the auditorium of the High School of Fashion Industries). [[w.valenti-very-human-president]],
        137 (Valenti''s account; the walk, the seats, the words to Dubinsky). See [[cal.1964-06-06.labor]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1965-03-30.white-house
      when: Mar. 30
      date: '1965-03-30'
      thread: white-house
      c: 'Valenti to Johnson, a memorandum: Marvin Watson says Johnson has agreed to receive the members of a high school
        band from Texas. Johnson at the foot: "no, hell no. I never heard of this. Marvin must be smoking marijuana."'
      n: '[[w.valenti-very-human-president]], 175–76 (Valenti''s account). Names: Valenti, Johnson, Watson.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:watson-w-marvin
- add:
    entry:
      id: cal.1965-04.white-house
      when: Apr.
      date: 1965-04
      thread: white-house
      c: 'Late April. Valenti to Johnson, a long memorandum of the appointments he has scheduled for him. Johnson at the foot:
        "Why do you hate me? You must hate me else you wouldn''t be trying to kill me slowly, like being nibbled to death
        by ducks."'
      n: '[[w.valenti-very-human-president]], 176 (Valenti''s account; "In late April, 1965"). Check: the day. Names: Valenti,
        Johnson.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-04.transition-and-staff-2
      when: Apr.
      date: 1966-04
      thread: transition-and-staff
      c: 'An evening, Valenti pressing for his blessing to leave. Johnson, thinking him unhappy in the White House, offers
        to make him ambassador to Italy; he has already had Ambassador Fenoaltea find out whether Rome would object to an
        American of Italian extraction, and been told he would be received warmly. Valenti declines: his reason for leaving
        is money. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 255 (Valenti''s account). Check: the day; before Johnson''s letter of Apr. 25
        ([[cal.1966-04-25.transition-and-staff]]). See [[cal.1966-04.transition-and-staff]]. Names: Johnson, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - polity:italy
- add:
    entry:
      id: cal.1968-01.press-and-broadcasting
      when: Jan.
      date: 1968-01
      thread: press-and-broadcasting
      also:
      - vietnam-johnson-asia
      c: '*Newsweek*, "Rome Haul": the meeting with the Pope "less than completely harmonious"; "Everyone left unhappy." Johnson
        telephones Valenti the day it comes out, furious: "Get in touch with Kay Graham and find out how she tolerates such
        stupidity on her magazine." Valenti calls Katharine Graham, calls the story a lie; she suggests he call Osborn Elliott,
        the editor. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 291–95 (Valenti''s account; the story printed). Check: the day; "the very day
        *Newsweek* came out," the story written after the return of Dec. 24. See [[cal.1967-12-23.vietnam-2]]. Names: Johnson,
        Valenti, Paul VI, Graham.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:paul-vi
      - name:graham-katharine
- add:
    entry:
      id: cal.1968-01.press-and-broadcasting-3
      when: Jan.
      date: 1968-01
      thread: press-and-broadcasting
      c: 'Valenti and Osborn Elliott, editor in chief of *Newsweek*, by telephone, about forty-five minutes: Valenti calls
        the Rome story false "from stem to stern" and offers his handwritten notes of the meeting; Elliott will go with his
        sources and the story. Valenti then complains to Marcinkus, who means to call in the Rome correspondent, and to Mel
        Elfin, the Washington bureau chief. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 295–96 (Valenti''s account). Check: the day. See [[cal.1968-01.press-and-broadcasting]].
        Names: Valenti.'
      tags:
      - name:valenti-jack
- add:
    entry:
      id: cal.1968-01.press-and-broadcasting-4
      when: Jan.
      date: 1968-01
      thread: press-and-broadcasting
      c: 'Valenti and Elliott again: Elliott confirms the source, a Vatican stringer, Ms. Sullivan; four sources in the Vatican,
        two or more at State, "one or two triangulating reports," "a reading from State from more than one person about a
        sour atmosphere." Newsweek stands by the story. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 296–98 (Valenti''s account). Check: the day. See [[cal.1968-01.press-and-broadcasting-3]].
        Names: Valenti.'
      tags:
      - name:valenti-jack
- cite:
    id: cal.1963-11-22.succession-3
    item: '[[w.valenti-very-human-president]], 3–4 (by helicopter from Andrews to the South Grounds, landing 6:32 p.m.; Johnson
      with Ball and McNamara at the Diplomatic Reception Room, then through the Rose Garden and the West Wing to the vice-presidential
      suite in the Executive Office Building; not Bundy, Mrs. Johnson or the words)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession-8
    item: '[[w.valenti-very-human-president]], 48–49 (after the takeoff, Johnson to Mrs. Johnson: "I think we should call
      the president''s mother"; both talk with Rose Kennedy; Johnson: "I wish to God there was something I could do for you,
      Mrs. Kennedy"; not the minutes out of Dallas, the patch or Hyannis Port)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession-9
    item: '[[w.valenti-very-human-president]], 49 (Johnson then calls Nellie Connally and talks with her, as does Mrs. Johnson;
      not the patch or the words)'
    units: '?'
- cite:
    id: cal.1964-06-23.mississippi-6
    item: '[[w.valenti-very-human-president]], 144–45 (Hoover calls to report the car found, "burned to a crisp," the agents
      unable to get inside; Johnson: "Oh, my God"; Valenti dates it June 21, "four days later" than June 17; not the hour
      or the words on bones)'
    units: '?'
- cite:
    id: cal.1964-06-23.mississippi-7
    item: '[[w.valenti-very-human-president]], 144–45 (Ryan has called Valenti to bring in the parents of two of the three;
      they arrive with Lee White as Hoover is on the telephone again; Johnson: "You are sure that you found the right car,
      the same color, the same markings"; "Where did you find it, how far from Philadelphia, Mississippi?"; then "Show them
      in"; Valenti leaves; not the length or what was said to the parents)'
    units: '?'
- check:
    id: cal.1964-06-23.mississippi-7
    text: 'Check: Valenti puts Hoover''s report of the burned car and the parents'' visit on June 21, "four days later" than
      June 17 ([[w.valenti-very-human-president]], 144–45); the recorded calls have June 23.'
- cite:
    id: cal.1967-12-23.vietnam-2
    item: '[[w.valenti-very-human-president]], 286–91 (the Pope''s library, 8:55 to 10:17 p.m., Valenti taking notes, Rostow
      brought in midway; the Christmas truce asked extended; the prisoners; the Pope objects to "we will never surrender South
      Vietnam to aggression or attack" in the draft release and Johnson strikes it; read here only in part, 286–89 by search)'
    units: A
- add:
    entry:
      id: cal.1967-12-18.vietnam-prisoners
      when: Dec. 18
      date: '1967-12-18'
      thread: vietnam-prisoners
      also:
      - vietnam-johnson-asia
      c: 'The Oval Office, the day after Holt''s death. Johnson calls in Valenti, now at the Motion Picture Association: he
        is going to Holt''s funeral; Valenti to come and arrange, "quietly, very quietly," a visit to the Pope, through his
        Vatican contact: "He may be able to help us in the prisoner of war problem." Check with Jim Cross, the pilot, when
        they could reach Rome from Australia, with a stop in Vietnam, kept quiet. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 278–79 (Valenti''s account). See [[cal.1967-12-17.vietnam-2]]. Names: Holt,
        Johnson, Valenti, Paul VI.'
      tags:
      - name:holt-harold-e
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:paul-vi
      - polity:vatican
- add:
    entry:
      id: cal.1967-12-18.vietnam-prisoners-2
      when: Dec. 18
      date: '1967-12-18'
      thread: vietnam-prisoners
      also:
      - vietnam-johnson-asia
      c: 'Valenti, within the hour, from a pay telephone near his home, to Monsignor Paul Marcinkus at the Vatican: "My friend
        here is anxious to talk to your friend"; Marcinkus will ask and hear from him the next day. Valenti reports to Johnson,
        who adds that if all is well Jim Rowe will go to Rome to settle the details. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 279–80 (Valenti''s account). See [[cal.1967-12-18.vietnam-prisoners]]. Names:
        Valenti, Johnson, Rowe.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:rowe-james-h-jr
      - polity:vatican
- add:
    entry:
      id: cal.1967-12-19.vietnam-prisoners
      when: Dec. 19
      date: '1967-12-19'
      thread: vietnam-prisoners
      also:
      - vietnam-johnson-asia
      c: 'Marcinkus to Valenti, by telephone, at the same hour as the day before: "My friend says he will be delighted to
        see your friend." Valenti: the President''s emissary, Jim Rowe, will be in Rome within hours to complete the plans,
        dealing with Marcinkus directly, not through the embassy. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 280–81 (Valenti''s account; the same day the party leaves Andrews, 12:05 p.m.).
        See [[cal.1967-12-18.vietnam-prisoners-2]]. Names: Valenti, Rowe.'
      tags:
      - name:valenti-jack
      - name:rowe-james-h-jr
      - polity:vatican
- add:
    entry:
      id: cal.1967-12-23.press-and-broadcasting
      when: Dec. 23
      date: '1967-12-23'
      thread: press-and-broadcasting
      also:
      - vietnam-johnson-asia
      c: 'Karachi, the tarmac, Johnson with Ayub Khan. Hugh Sidey of *Time* to Valenti: "This is a flying circus"; "It is
        Rome, isn''t it?" Valenti will not say. Aboard, Johnson to Valenti: "As of now, I am running the president''s airplane,
        not Sidey"; he will give the press no notice, showing him a top secret message from Rome: the Secret Service advises
        another landing place, Communist crowds planning to meet him. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 281–83 (Valenti''s account). See [[cal.1967-12-19.vietnam]]. Names: Ayub Khan,
        Sidey, Valenti, Johnson.'
      tags:
      - name:ayub-khan-mohammad
      - name:sidey-hugh
      - name:valenti-jack
      - name:johnson-lyndon-b
      - polity:italy
- cite:
    id: cal.1967-12-19.vietnam
    item: '[[w.valenti-very-human-president]], 281, 284 (the flight from Andrews, 12:05 p.m. Dec. 19, by Travis, Honolulu,
      Pago Pago, Canberra, Melbourne, Darwin, Korat, Cam Ranh Bay, Karachi, Rome and the Azores, home 4:55 a.m. Dec. 24; Karachi,
      Ayub Khan; Ciampino about 7 p.m., by helicopter to Castelporziano, Saragat, Moro and Fanfani; then the Vatican; not
      the days at Canberra, Melbourne or Korat, or the talks)'
    units: A-B, H-I, K
