- cite:
    id: cal.1963-12-23.foreign-aid
    item: '[[w.valenti-very-human-president]], 191–93 (Congress called back in the Christmas holidays; the party for the Congress
      in the State Dining Room Dec. 23, Johnson on a gold damask chair, Halleck and Passman present; Halleck courted; the
