    item: '[[w.valenti-very-human-president]], 147–48 (Kennedy goes to Bundy''s office after; calm when he leaves Johnson,
      as Johnson is when Valenti sees him minutes later; "According to Mac Bundy, the initial reaction by Kennedy was seemingly
