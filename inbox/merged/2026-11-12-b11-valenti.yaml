    text: 'Check: Valenti dates the campaign meeting "August 6, a Sunday" ([[w.valenti-very-human-president]], 201); Aug.
      6, 1964, was a Thursday.'
- cite:
    id: cal.1964-09-28.elections-1964
    item: '[[w.valenti-very-human-president]], 204–05 (Sept. 28: Providence, Hartford, Burlington, Portland, Manchester, and
      in the early hours Boston, to see Edward Kennedy; "over a million people"; the throngs at every stop; not Brown''s bicentennial
      or the rope line)'
    units: B-F
- cite:
    id: cal.1964-10-14.elections-1964-2
    item: '[[w.valenti-very-human-president]], 208–10 and the plate following p. 178 (Johnson and Kennedy together all day
      through New York State, "top to bottom"; the last motorcade, at night through Brooklyn, both standing on the back seat
      of the open Secret Service car; Jimmy Mangano, the district leader, introduces Valenti, "the next United States senator
      from New York, Bobby Kennedy," and the President, who speaks; in a Jewish district farther on, Johnson to Valenti: "Okay,
      Jack, you can get out now"; the caption dates Brooklyn Oct. 14, the text "the waning days of October"; not Buffalo)'
    units: '?'
- cite:
    id: cal.1964-11-03.elections-1964-new-york
    item: '[[w.valenti-very-human-president]], 149–50 (Johnson and Valenti at the Driskill Hotel in Austin watch Kennedy''s
      victory speech on television; Kennedy thanks his wife, his staff and others and never mentions the President, who carried
      New York "by over two million votes"; not Dickerson)'
    units: '?'
- check:
    id: cal.1964-11-03.elections-1964-new-york
    text: 'Check: Valenti, who watched with Johnson at the Driskill Hotel in Austin, has him "made no outward sign that the
      omission struck him. His expression never changed" ([[w.valenti-very-human-president]], 150); Dickerson has him say
      it "again and again."'
- cite:
    id: cal.1965-07-21.vietnam
    item: '[[w.valenti-very-human-president]], 319–36 (July 21: the meeting at 10:40 a.m. of fifteen advisers in the Cabinet
      Room, Johnson joining at 11:30; the afternoon session from 2:30, Johnson in before 2:40, Ball presenting "We cannot
      win, Mr. President"; Ball does not propose a compromise in this account)'
    units: '?'
- cite:
    id: cal.1965-07-22.vietnam
    item: '[[w.valenti-very-human-president]], 340–52 (July 22 at noon in the Cabinet Room: Johnson, McNamara, Vance, Wheeler,
      the four Chiefs, Brown, Nitze, Resor, Bundy, Valenti, and Clifford at Johnson''s request; Johnson puts the three options;
      not McCloy or Dean)'
    units: '?'
- cite:
    id: cal.1965-07-27.vietnam-july-decision-3
    item: '[[w.valenti-very-human-president]], 354–55 (Tuesday, July 27, 6:35 p.m., the Cabinet Room: Mansfield, Dirksen,
      McCormack, Ford, Albert, Smathers, Long, Hickenlooper, Kuchel, Boggs, Arends; Mansfield alone opposes, speaking at the
      end, "Remember, escalation begets escalation"; not the words of Long or Dirksen)'
    units: A, C, G
- variant:
    id: cal.1965-07-27.vietnam-july-decision-3
    unit: H
    witness: w.valenti-very-human-president
    reads: This position has a certain inevitability. Whatever pledge we had was to assist SVN in its own defense. Since then
      there has been no government of legitimacy. We owe this government nothing, no pledge of any kind. We are going deeper
      into war. ... Best hope we have for salvation is a quick stalemate and negotiations. ... Remember, escalation begets
      escalation.
    at: '355'
- cite:
    id: cal.1965-07-28.vietnam
    item: '[[w.valenti-very-human-president]], 356–57 (July 28, 12:30 p.m., the East Room, televised; the Air Mobile Division
      ordered, 75,000 to 125,000 "almost immediately," more "as requested"; the draft call from 17,000 to 35,000; reserves
      "not essential" now; the excerpt printed)'
    units: B-E
- cite:
    id: cal.1965-09-10.states-and-cities
    item: '[[w.valenti-very-human-president]], 170 (Sept. 10: the teleprinters flash Betsy on the Louisiana shore; Johnson
      orders his pilot to ready Air Force One and calls the Louisiana delegation; not the hour or the later calls)'
    units: '?'
- cite:
    id: cal.1965-12-17.vietnam
    item: '[[w.valenti-very-human-president]], 223–28 (Dec. 17, the Cabinet Room, the meeting ordered at 9:15 a.m.: Johnson,
      Rusk, McNamara, Ball, Bundy and Valenti; McNamara, "we will increase bombing. It is inevitable"; Ball on bombing, Hanoi
      and China; the Chiefs; the pause; afterward Johnson to Valenti alone, then the meeting set for the next day at midday)'
    units: E
- variant:
    id: cal.1965-12-17.vietnam
    unit: B
    witness: w.valenti-very-human-president
    reads: I am willing to take any gamble on stopping the bombing if I think I have some hope of something happening that
      is good.
    at: '224'
- variant:
    id: cal.1965-12-17.vietnam
    unit: F
    witness: w.valenti-very-human-president
    reads: The big problem is the chiefs. They go through the roof when we mention the pause.
    at: '225'
- variant:
    id: cal.1965-12-17.vietnam
    unit: G
    witness: w.valenti-very-human-president
    reads: The weakest chink in our armor is American public opinion.
    at: '227'
- cite:
    id: cal.1965-12-18.vietnam-pause
    item: '[[w.valenti-very-human-president]], 228–40 (Dec. 18, 12:35 p.m., the Cabinet Room: Johnson, Rusk, McNamara, Bundy,
      Ball, Alexis Johnson, Fortas, Clifford and Valenti; Rusk, "one chance in ten or twenty ... One chance in twenty"; McNamara,
      "That''s baloney," "one out of three or one in two," "We have been too optimistic"; Clifford''s seven objections; Fortas''s
      doubts of the effect, not clearly against; Johnson to McNamara: "We''ll take the pause")'
    units: C-F, H
- variant:
    id: cal.1965-12-18.vietnam-pause
    unit: B
    witness: w.valenti-very-human-president
    reads: The military says a month's pause would undo all that we have done.
    at: '228'
