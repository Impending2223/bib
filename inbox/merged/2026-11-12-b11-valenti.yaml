- cite:
    id: cal.1964-07-24.elections-1964
    item: '[[w.valenti-very-human-president]], 145–46 (Valenti has Manatos bring Goldwater in by the Southwest Gate, away
      from reporters; he arrives about 5:15, fifteen minutes early, in the Cabinet Room; Johnson in the Oval Office at 5:22
