      id: cal.1964-08-05.elections-1964-johnson
      when: Aug. 5
      date: '1964-08-05'
      thread: elections-1964-johnson
      c: 'Valenti passes Johnson a staff memorandum: a senior Senator wants Johnson to see a county commissioner of his State,
        said to be a prime mover in the re-election campaign, so that he can go home having kept a promise. Johnson at the
        foot: "Why don''t you all try, please, to get this fellow to see Cliff Carter or Walter Jenkins or someone except
        poor old me all the time."'
      n: '[[w.valenti-very-human-president]], 174 (Valenti''s account; the memorandum''s author and the Senator unnamed).
        Names: Valenti, Johnson, Jenkins.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1964-08-06.elections-1964-johnson
      when: Aug. 6
      date: '1964-08-06'
      thread: elections-1964-johnson
      also:
      - democratic-party
      - mississippi
      c: 'Walter Jenkins''s office. The campaign leaders, Valenti by his notes among them (O''Donnell, Jenkins, Moyers, O''Brien,
        Cliff Carter, Rowe, Bailey), meet over an hour on the Freedom Democrats'' challenge at the convention; ten to thirteen
        Credentials Committee members are counted for seating them; no plan. Connally has told Valenti the South would take
        their seating as an affront. They set the roles: Bailey nominally in charge, O''Donnell his assistant, O''Brien organization,
        Valenti scheduling and liaison with Johnson, Moyers speeches, Moyers and Valenti advertising, Carter field coordinators,
        Rowe special groups.'
      n: '[[w.valenti-very-human-president]], 201–03 (Valenti''s account). Check: the day; Valenti has "August 6, a Sunday";
        Aug. 6, 1964, was a Thursday. See [[cal.1964-08-06.democratic-party]]. Names: Valenti, O''Donnell, Jenkins, Moyers,
        O''Brien, Rowe, Connally.'
      tags:
      - name:valenti-jack
      - name:odonnell-kenneth-p
      - name:jenkins-walter-w
      - name:moyers-bill
      - name:obrien-lawrence-f
      - name:rowe-james-h-jr
      - name:connally-john
