    units: '?'
- cite:
    id: cal.1964-08-06.democratic-party
    item: '[[w.valenti-very-human-president]], 201–03 (the Freedom Democrats'' challenge: ten to thirteen Credentials Committee
      members counted for seating; the issue "sure to surface like a ticking time bomb on the convention floor unless it was
      defused"; after the meeting in Jenkins''s office the group sees Johnson, who dismisses them within the hour; Carter
      at the earlier meeting; not the Oval Office)'
    units: '?'
