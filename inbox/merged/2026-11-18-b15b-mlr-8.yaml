      also:
      - china
      c: Zhou Enlai's speech to the Twelfth Plenum. Nie Rongzhen to blame for Zhao Erlu's death and the defense sector's troubles; complaints against Xu Xiangqian and his daughter; Ye Jianying's poem on Luo Ruiqing's attempted suicide as proof he has no class feeling for Mao; Chen Yi "always opposed Chairman Mao"; Zhu De knows nothing of war; Li Fuchun never faithful to Mao; Li Xiannian once on Zhang Guotao's side; Chen Yun's thinking fosters "a privileged stratum"; Deng Zihui of "Right inclination."
      n: '[[w.macfarquhar-maos-last-revolution]], 275–276 (a keynote Chinese histories do not mention). Made public: 1969. To check: Zhou Enlai''s speech, in [[w.zai-zhonggong-ba-jie]], 31–34 (cited by [[w.macfarquhar-maos-last-revolution]], 276 n.8). Names: Zhou Enlai, Nie Rongzhen, Zhao Erlu, Xu Xiangqian, Ye Jianying, Luo Ruiqing, Chen Yi, Zhu De, Li Fuchun, Li Xiannian, Chen Yun, Mao Zedong. Check: the day. Check: whether [[w.zai-zhonggong-ba-jie]] (1969) was printed for internal circulation; if so, the year is 2006. Check: perhaps his speech to the plenum''s sixth group, Oct. 16, 1968, in the Zhou chronology, which names Tan Zhenlin, Li Xiannian, Li Fuchun, Xu Xiangqian and Nie Rongzhen.'
