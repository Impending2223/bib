          c: 7a3ef440
          rows:
            - 'w.macfarquhar-maos-last-revolution 91: all'
        tags: [polity:prc, name:kang-sheng, name:jiang-qing, name:zhang-chunqiao, name:xie-fuzhi, name:liu-shaoqi, name:deng-xiaoping, vis:only:prc]
