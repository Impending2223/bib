        when: Aug. 4–6
        date: '1966-08-04'
        thread: china-leadership
        also: [china]
        c: In the small group sessions Kang Sheng, Jiang Qing, Zhang Chunqiao and their leftist colleagues elaborate on the significance of Mao's words and denounce Liu's "bourgeois headquarters." Xie Fuzhi attacks Deng Xiaoping, saying that Jiang Qing had told him Liu was no longer a threat but Deng was.
        n: '[[w.macfarquhar-maos-last-revolution]], 91. Made public: 1988. To check: [[w.nianyi-da-dongluande-niandai]], 55 (cited by [[w.macfarquhar-maos-last-revolution]], 91 n.20). Names: Kang Sheng, Jiang Qing, Zhang Chunqiao, Xie Fuzhi, Liu Shaoqi, Deng Xiaoping. Check: the day; MacFarquhar (91) says the small group sessions, which ran Aug. 4 to 6.'
