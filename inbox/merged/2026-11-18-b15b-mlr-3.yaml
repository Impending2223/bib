        n: '[[w.zedong-mao-zedong-nianpu]], V, July 24, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 41 (July 24–25, 1966; Zhou at Mao''s meeting of the Standing Committee and the Cultural Revolution Group, where Mao criticizes the work groups and decides to withdraw them; the next day Mao again to the regional bureau secretaries and the Group); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 646 (July 24 and 25, 1966; Mao, talking with the regional bureaus'' secretaries and the members of the Cultural Revolution Group, sharply criticizes the work groups: they block the mass movement, and to block the revolution is to help the counter-revolutionaries and the black gang; they have made much trouble, and what is wanted of them?). Made public: 1991. Names: Mao Zedong.'
