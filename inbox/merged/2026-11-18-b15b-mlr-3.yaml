  - add:
      entry:
        id: cal.1966-06-09.china-leadership-3
        when: June 9
        date: '1966-06-09'
        thread: china-leadership
        also: [china]
        c: Tsinghua University. A work team of more than 500 men and women enters, drawn from the Party committee of the State Council's Industry and Communications Office and headed by Ye Lin, a deputy chairman of the State Economic Commission. Wang Guangmei, Liu Shaoqi's wife, is a member. Ye Lin recalls thirty years later that he was wholly unprepared for the job. Kuai Dafu, a student in the Chemical Engineering Department, recalls that on hearing of the team's arrival that evening he and his classmates applauded endlessly and shouted "Long live the CCP!" and "Long live Chairman Mao!"
