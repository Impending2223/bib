        date: '1966-08-08'
        thread: china-leadership
        also: [china]
        c: At a meeting with members of the Central Cultural Revolution Group Lin Biao expresses total support for Mao's vision of the Cultural Revolution. He urges them to "turn the world upside down, be noisy and boisterous, blow tempests and make big waves."
        n: '[[w.macfarquhar-maos-last-revolution]], 91–92. Made public: 1988. To check: [[w.nianyi-da-dongluande-niandai]], 58 (cited by [[w.macfarquhar-maos-last-revolution]], 92 n.25). Names: Lin Biao, Mao Zedong. Check: the remarks were distributed to the plenum''s conferees with his May 18 speech.'
