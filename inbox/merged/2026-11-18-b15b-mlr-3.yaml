        date: '1966-08-12'
        thread: china-leadership
        also: [china]
        c: By the end of the Eleventh Plenum the Central Cultural Revolution Group occupies seven villas at Diaoyutai, Chen Boda taking up residence in No. 15, Kang Sheng in No. 8 and Jiang Qing in No. 11. The Group's offices are in villa No. 16, and No. 17 houses recreation facilities, including a projection room where Jiang Qing watches foreign films.
        n: '[[w.macfarquhar-maos-last-revolution]], 100. To check: [[w.yinlu-jiang-qing-de-nu]], 65–66 (cited by [[w.macfarquhar-maos-last-revolution]], 100 n.71a); [[w.yinlu-chu-jian-jiang-qing]], 56 (cited by [[w.macfarquhar-maos-last-revolution]], 100 n.71b). Names: Chen Boda, Kang Sheng, Jiang Qing. Check: the day; before Mao and Jiang Qing returned in July the Group had one villa and a single secretary on loan from the International Liaison Department.'
        src:
