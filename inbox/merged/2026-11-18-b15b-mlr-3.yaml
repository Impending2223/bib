        date: '1966-08-13'
        thread: china-leadership
        also: [china]
        c: At a work conference the day after the plenum closes, Lin Biao says he has been rather downhearted lately, his ability not commensurate with his task and position; he anticipates committing mistakes. We must firmly implement the Chairman's instructions, he says, whether we understand them or not, and never interfere in big matters or bother him with trifles.
        n: '[[w.macfarquhar-maos-last-revolution]], 98. Made public: 1967. To check: [[w.gaoju-mao-zedong-sixiang]], 34 (cited by [[w.macfarquhar-maos-last-revolution]], 98 n.62). See [[cal.1966-08-13.china-leadership]]. Names: Lin Biao, Mao Zedong.'
