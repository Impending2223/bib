        also: [china]
        c: Peking University, morning. While the work team is tied up in a meeting, students from about six departments "struggle" Lu Ping and about forty other "monsters and freaks." Nie Yuanzi's supporters' account tells of the "black gang" swamped like rats, to shouts of "Beat them!" A professor, whose husband is among those humiliated, writes that the students used wastebaskets for dunces' hats, glued posters on the victims' backs and sometimes threw ink in their faces. The work team breaks up the meeting around noon.
