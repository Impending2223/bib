        date: '1966-08-05'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, after another broadside from Mao, telephones Li Xuefeng that he will not be going to the Peking College of Construction Engineering anymore: "it seems that I am not qualified to lead the Cultural Revolution."'
        n: '[[w.macfarquhar-maos-last-revolution]], 89. Made public: 1996. To check: [[w.zheng-liu-shaoqide-zuihou-suiyue]], 69–70 (cited by [[w.macfarquhar-maos-last-revolution]], 89 n.12a); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 647–648 (cited by [[w.macfarquhar-maos-last-revolution]], 89 n.12b). See [[cal.1966-08-04.china-leadership-6]]. Names: Liu Shaoqi, Mao Zedong.'
