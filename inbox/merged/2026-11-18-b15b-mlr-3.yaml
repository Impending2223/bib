  - edit:
      id: cal.1966-08-01.china-leadership
      base: cae79127
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 1, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 43 (Aug. 1, 1966; Zhou at the opening; Deng gives the agenda; Liu Shaoqi''s report and his taking responsibility for the work groups; Chen Boda charges the groups with wrong); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 647 (Aug. 1–12, 1966; Liu attends the Eleventh Plenum of the Eighth Central Committee; Aug. 1 he reports to it the policies of the Politburo on international and domestic work since the Tenth Plenum and takes the responsibility for the work-group practice after the "Cultural Revolution" began: lately the Chairman was away and he presided over the Standing Committee''s work at home; when the Chairman returned he found the sending of work groups wrong, and the responsibility is chiefly his; Mao, interjecting, charges that the work groups made errors of direction and line, "actually standing on the bourgeois standpoint and opposing the proletarian revolution"). Made public: 1989. Names: Mao Zedong, Deng Xiaoping, Liu Shaoqi, Chen Boda.'
  - edit:
      id: cal.1966-08-04.china-leadership
      base: cd88561c
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 4, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 4, 1966; Zhou present, after the Cultural Revolution Group''s meeting; Mao on the work groups, a question of direction and line); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648 (Aug. 4, 1966; Liu attends the enlarged Standing Committee meeting Mao calls, where Mao makes a still sharper charge on the sending of work groups: the Center broke its own order, it ordered classes suspended for half a year to do only the cultural revolution, and when the students rose it suppressed them; lightly put it is a question of direction, in fact one of line, a line error that violates Marxism; ox-ghosts and snake-spirits are in this room; Liu again takes responsibility, saying it is no more than stepping down, he is not afraid of that and has "five nots" of fear). Made public: 1988. Names: Mao Zedong, Liu Shaoqi, Ye Jianying.'
