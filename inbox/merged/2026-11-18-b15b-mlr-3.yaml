        date: '1966-08-02'
        thread: china-leadership
        also: [china]
        c: At the Eleventh Plenum the speeches of Central Committee members on Aug. 2 and 3 give very lukewarm support for the withdrawal of the work teams. Many clearly, if not explicitly, take Liu Shaoqi's position, and Mao is increasingly angered.
        n: '[[w.macfarquhar-maos-last-revolution]], 89. Made public: 1988. To check: [[w.nianyi-da-dongluande-niandai]], 52 (cited by [[w.macfarquhar-maos-last-revolution]], 89 n.13). Names: Mao Zedong, Liu Shaoqi.'
