patch: 2026-11-12-b11-salinger
by: Claude (batch 11 reader, Salinger, With Kennedy; audited in two halves)
ops:
- add:
    entry:
      id: cal.1960-04-06.elections-1960-primaries-3
      when: Apr. 6
      date: '1960-04-06'
      thread: elections-1960-primaries
      c: Milwaukee, the day after the Wisconsin primary. Kennedy, angry that the press has made his six districts to four
        a poor showing, has Bailey and Salinger stay an extra day to call in the reporters and convince them he won against
        all odds. Some success; the impression of a poor showing lingers. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 33–34 (the day: "an extra day" after the primary). See [[cal.1960-04-05.elections-1960]].
        Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - state:wi
      - city:milwaukee
- add:
    entry:
      id: cal.1960-04.elections-1960-religion
      when: Apr.–May
      date: 1960-04
      thread: elections-1960-religion
      also:
      - elections-1960-primaries
      c: On a train from Bluefield, W.Va., to Indianapolis, during the West Virginia primary. Salinger, breakfasting with
        Billy Graham, asks him to sign a statement of Protestant ministers for tolerance in the election, then being drafted;
        he says he would. Sorensen tries for two days to reach him by telephone; Graham refuses, on the ground that he should
        not interfere in the election. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 34–35. Check: the day (the work gives none; West Virginia''s primary was May 10). Names:
        Salinger, Graham, Sorensen.'
      tags:
      - name:salinger-pierre
      - name:graham-billy
      - name:sorensen-theodore-c
      - state:wv
      - state:in
- add:
    entry:
      id: cal.1960-07-04.elections-1960-los-angeles
      when: July 4
      date: '1960-07-04'
      thread: elections-1960-los-angeles
      c: 'Los Angeles. Salinger with Kennedy and Robert Kennedy on the Connally–Edwards charge: they would ignore it as unworthy
        of a reply; Salinger urges a quick one, before the Republicans can repeat it. Kennedy''s physicians are reached and
        a medical statement agreed: an adrenal insufficiency under control for many years, which none of his doctors considers
        Addison''s disease. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 40–41. Check: the day (Salinger puts the Connally–Edwards press conference "on the
        first day of the convention," July 11; see [[cal.1960-07-04.elections-1960-2]], [[cal.1960-07-04.robert-kennedy]]).
        Names: Salinger, Kennedy, Robert Kennedy, Connally.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:connally-john
- add:
    entry:
      id: cal.1960-07-12.elections-1960-los-angeles-2
      when: July 12
      date: '1960-07-12'
      thread: elections-1960-los-angeles
      c: 'Los Angeles. Told by friends in the Texas delegation that Johnson will not attend the caucus Kennedy is to address,
        Salinger spends half an hour telling reporters that Johnson is backing out of a debate. Philip Graham of the *Washington
        Post* telephones: "Never tear something down in such a way that you can''t put it back together again." Salinger reads
        it as a sign Johnson may be Kennedy''s running mate. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 41–42. Check: the day (before the debate of July 12; the work gives no day). See [[cal.1960-07-12.elections-1960-2]].
        Names: Salinger, Kennedy, Johnson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-21
      when: July 14–15
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: Los Angeles, the Biltmore, the night after the vice-presidential nomination. John S. Knight's story says Johnson
        forced Kennedy to take him; Salinger denies it under his own name. Rayburn, through Moyers, wants a denial in Kennedy's
        name and a call from Kennedy to Knight; Salinger and Robert Kennedy draft the statement, and Robert Kennedy telephones
        Knight, whose confidence in the story is shaken. By Salinger's memorandum of the week after.
      n: '[[w.salinger-with-kennedy]], 44–45. Names: Salinger, Rayburn, Moyers, Robert Kennedy, Kennedy, Johnson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:rayburn-sam
      - name:moyers-bill
- add:
    entry:
      id: cal.1960-07-15.elections-1960-los-angeles-3
      when: July 15
      date: '1960-07-15'
      thread: elections-1960-los-angeles
      c: Los Angeles. Salinger spends most of the day backgrounding newspapermen on the vice-presidential nomination as Robert
        Kennedy had outlined it. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 45. See [[cal.1960-07-14.elections-1960-los-angeles-21]]. Names: Salinger, Robert Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1960-07-16.elections-1960-los-angeles
      when: July 16
      date: '1960-07-16'
      thread: elections-1960-los-angeles
      also:
      - press-and-broadcasting
      c: '*New York Herald Tribune*, Earl Mazo: the story of the vice-presidential nomination Salinger calls the most authoritative.
        Mazo knew Robert Kennedy had not seen Johnson before Kennedy did.'
      n: '[[w.salinger-with-kennedy]], 45. Names: Salinger, Robert Kennedy, Johnson, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-11-09.elections-1960-count-5
      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960-count
      c: 'Election night, shortly after midnight. Hagerty telephones Salinger: Nixon will concede, and a congratulatory telegram
        from Eisenhower is on its way. Half an hour later he calls back: Nixon has changed his mind; forget the telegram.
        Salinger will say nothing of a message from the President until he hears again. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 47. Names: Hagerty, Salinger, Nixon, Eisenhower.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
      - name:nixon-richard-m
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-11-09.elections-1960-count-6
      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960-count
      c: Hyannis, shortly before noon. Hagerty thanks Salinger again for holding back the Eisenhower wire; another will follow
        Nixon's concession. Klein has told him Nixon will concede at the Ambassador Hotel at 1 p.m. Eastern. By Salinger's
        account.
      n: '[[w.salinger-with-kennedy]], 50. See [[cal.1960-11-09.elections-1960-count-5]]. Names: Hagerty, Salinger, Klein,
        Nixon, Eisenhower.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
      - name:klein-herbert-g
      - name:nixon-richard-m
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-11.transition-and-staff-5
      when: Nov., late
      date: 1960-11
      thread: transition-and-staff
      also:
      - press-and-broadcasting
      c: The White House. Hagerty receives Salinger, the first of four visits; pictures taken together. "I won't tell you
        how to run things. I'll just show you what you have to work with here—and then you're on your own." By Salinger's
        account.
      n: '[[w.salinger-with-kennedy]], 62. Check: the day ("late November"). Names: Hagerty, Salinger.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
- add:
    entry:
      id: cal.1960-12-27.press-and-broadcasting
      when: Dec. 27
      date: '1960-12-27'
      thread: press-and-broadcasting
      c: 'Palm Beach. After weeks of discussion Kennedy agrees to live television at his press conferences. Bundy and Sorensen
        had thought it too hazardous; Rusk, once named, had argued against. Kennedy: "This is the right thing," and "We should
        be able to go around the newspapers if that becomes necessary." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 56. Names: Kennedy, Salinger, Bundy, Sorensen, Rusk.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:rusk-dean
- add:
    entry:
      id: cal.1960-12-27.press-and-broadcasting-2
      when: Dec. 27
      date: '1960-12-27'
      thread: press-and-broadcasting
      c: Palm Beach. Salinger meets five hours with the top news executives of the television networks on live coverage of
        the President-elect's press conferences. All are enthusiastic. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 56–57 (the network executives "in town"). See [[cal.1960-12-27.press-and-broadcasting]].
        Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1960-12.press-and-broadcasting-2
      when: Dec., after the 27th
      date: 1960-12
      thread: press-and-broadcasting
      c: 'Palm Beach Towers, just after lunch. Salinger announces live television at the President''s press conferences, the
        first on Jan. 25, and the ground rules; reporters must stay to the end. The correspondents protest. Lawrence of the
        *Times*: "as you plunge deeper and deeper into matters about which you know absolutely nothing . . ." Salinger shouts
        back that it is the President''s press conference and the decision final. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 57–58. Check: the day (after the decision of Dec. 27). See [[cal.1960-12-27.press-and-broadcasting]].
        Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1960-12-10.transition-and-staff-cabinet-3
      when: Dec. 10
      date: '1960-12-10'
      thread: transition-and-staff-cabinet
      c: 'The *Washington Post* has Rusk as Secretary of State under a page-one banner. Kennedy orders Salinger to find the
        leaker that day. After asking Bundy, Sorensen, Shriver, O''Brien and O''Donnell, Salinger telephones him: "You." Kennedy
        had spoken of it to Philip Graham the night before and not told him to hold it. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 60–61. Check: the day (the work gives none; see [[cal.1960-12-10.transition-and-staff-cabinet]]).
        Names: Salinger, Kennedy, Rusk, Bundy, Sorensen, Shriver, O''Brien, O''Donnell.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:shriver-r-sargent
      - name:obrien-lawrence-f
      - name:odonnell-kenneth-p
- add:
    entry:
      id: cal.1960-12-31.soviet-union
      when: Dec. 31
      date: '1960-12-31'
      thread: soviet-union
      c: Palm Beach, New Year's Eve. The Soviet Embassy telephones Salinger's suite to dictate Khrushchev's New Year greeting
        to the President-elect. Salinger's son Marc passes the call to Merriman Smith, who takes it down; Smith and Arrowsmith
        of the AP bring it to Salinger at the Palm Beach Country Club about 2 a.m., and he gives it to Kennedy in the morning.
        By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 61–62. Names: Khrushchev, Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1961-01.press-and-broadcasting-2
      when: Jan.
      date: 1961-01
      thread: press-and-broadcasting
      c: 'Washington, the Sheraton Park. Lunch of three hours with Merriman Smith, Folliard, Donovan and Brandt. Folliard:
        "You''re turning the presidential press conferences into a sideshow." Salinger refuses to tell them where the President
        goes or with whom, and to have reporters name their papers on television; agreement only on the Inaugural arrangements
        and the press pool. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 58–59. Check: the day (after the return to Washington the week after New Year''s).
        Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1961-01-21.press-and-broadcasting
      when: Jan. 21
      date: '1961-01-21'
      thread: press-and-broadcasting
      also:
      - farm
      c: Salinger's first briefing as Press Secretary, on the order doubling the surplus food ration. An Agriculture specialist
        gives the cost as $36 million a month, $9 for each of four million beneficiaries; two hours later he finds the $9
        is for a family of four, and Salinger gives the press $9 million. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 124. See [[cal.1961-01-21.farm]]. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1961-01-23.press-and-broadcasting-2
      when: Jan. 23
      date: '1961-01-23'
      thread: press-and-broadcasting
      also:
      - defense
      - soviet-union
      c: An aide of Admiral Burke brings Salinger the Chief of Naval Operations' speech for that week, hostile to the Soviet
        Union. Salinger takes the draft to Sorensen and Bundy, who agree Burke should tone it down, the RB-47 fliers' release
        pending; the President is not told. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 136 (the day: "just three days after the Inaugural"; Burke later softens it, and a
        leak from his staff says the White House is muzzling the military). Names: Burke, Salinger, Sorensen, Bundy.'
      tags:
      - name:salinger-pierre
      - name:burke-arleigh-a
      - name:sorensen-theodore-c
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1961-01-24.soviet-union
      when: Jan. 24
      date: '1961-01-24'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: 'David Wise of the *New York Herald Tribune* telephones Salinger: the Soviets will free Captains Olmstead and McKone.
        Salinger says the story is correct and its early publication could end the deal; Wise speaks to Jock Whitney, and
        the *Tribune* holds it. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 140–41 (the day: "the night before" the first press conference). See [[cal.1961-01-25.press-and-broadcasting]].
        Names: Salinger, Whitney.'
      tags:
      - name:salinger-pierre
      - name:whitney-john-h
- add:
    entry:
      id: cal.1961-01-25.press-and-broadcasting-2
      when: Jan. 25
      date: '1961-01-25'
      thread: press-and-broadcasting
      c: 'National Press Club. Salinger: "we intend to have an open information policy within the confines of national security."
        Many correspondents read a forewarning of censorship; at the President''s first press conference, five hours later,
        a question quotes it. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 153. See [[cal.1961-01-25.press-and-broadcasting]]. Names: Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-10.cuba-bay-of-pigs-2
      when: Apr. 10
      date: '1961-04-10'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Kennedy to Salinger in his office, a week before the invasion, on the press stories of the exile brigade: "I can''t
        believe what I''m reading! Castro doesn''t need agents over here. All he has to do is read our papers." By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 146. Check: the day ("a week before the invasion"). Names: Kennedy, Salinger, Castro.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-04-15.cuba-bay-of-pigs-3
      when: Apr. 15
      date: '1961-04-15'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Salinger at his briefing, on the morning''s air raids, not knowing their origin: "our only information comes from
        the wire service stories we have read. We have no direct relations with Cuba and therefore have no firsthand information."
        By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 146–47. See [[cal.1961-04-15.cuba]]. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1961-04-16.cuba-bay-of-pigs
      when: Apr. 16
      date: '1961-04-16'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Kennedy telephones Salinger: stay close to home that night; if the press asks about "a military affair in the Caribbean,"
        say he knows only what he has read in the newspapers. Salinger''s first official knowledge of the Bay of Pigs. By
        Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 145 (the day: the night before the landing). Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-17.cuba-bay-of-pigs-4
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      c: '3:30 a.m. The Army duty officer in the Situation Room telephones Salinger: the first units of the exile brigade
        are landing. To avoid the look of extraordinary activity, Salinger is to come in at his usual hour. By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 145. See [[cal.1961-04-16.cuba-bay-of-pigs]]. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1961-04-17.cuba-bay-of-pigs-5
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'The White House, Monday morning. Kennedy to Salinger, five minutes after his arrival: "We''ll have no comment on
        what''s happening down there. We''re watching developments. That''s all." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 147. See [[cal.1961-04-17.cuba-bay-of-pigs-4]]. Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-19.cuba-bay-of-pigs-4
      when: Apr. 19
      date: '1961-04-19'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Kennedy to Salinger, the afternoon of the third day: cancel the weekend on the carrier *Independence*, for which
        forty correspondents had been arranged. "We really blew this one. How could that crowd at CIA and the Pentagon be
        this wrong?" The press will "give us a hell of a pounding." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 148. Check: the day (the work: "the afternoon of the third day," Apr. 19; but it puts
        the congressional reception, Apr. 18, "that night"; see [[cal.1961-04-18.cuba-bay-of-pigs]]). Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-21.cuba-bay-of-pigs-5
      when: Apr. 21
      date: '1961-04-21'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'The President''s office, after the press conference. Kennedy to Salinger: "What the hell do they want me to do—give
        them the roll call vote? I can''t go into that without compromising everybody involved." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 154. See [[cal.1961-04-21.cuba]]. Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-22.press-and-broadcasting
      when: Apr. 22
      date: '1961-04-22'
      thread: press-and-broadcasting
      also:
      - cuba-bay-of-pigs
      c: 'Mid-morning. Kennedy, angry at the morning papers: "The publishers have to understand that we''re never more than
        a miscalculation away from war." Salinger suggests he say so to the publishers on Apr. 27; Kennedy agrees and has
        Salinger give his thinking to Sorensen, who will write the speech. By Salinger''s account; he later calls it bad advice.'
      n: '[[w.salinger-with-kennedy]], 154–55, 158. Check: the day (the morning after the press conference, the A.M. papers
        critical of it; but "six days" before Apr. 27). See [[cal.1961-04-21.cuba]]. Names: Kennedy, Salinger, Sorensen.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:sorensen-theodore-c
- add:
    entry:
      id: cal.1961-05-09.press-and-broadcasting-2
      when: May 9
      date: '1961-05-09'
      thread: press-and-broadcasting
      c: The President's office, at his invitation. Kennedy with seven newspaper executives, among them Ferree and McKnight
        of the publishers' and editors' societies, Catledge and McKelway. He shows dispatches that breached security and proposes
        a representative of their own in Washington to advise on security; they will accept no new restrictions, voluntary
        or official, without a declaration of national emergency. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 158–59. See [[cal.1961-04-27.press-and-broadcasting]]. Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-05.press-and-broadcasting
      when: May
      date: 1961-05
      thread: press-and-broadcasting
      c: After the Ottawa visit the Republican National Committee's *Battle Line* accuses Salinger of writing his own USIA
        biography ("a dynamo . . . a jaunty hunk of a man"), and the *New York Herald Tribune* editorializes against it; a
        day or two later the USIA writer is found to have taken the words from an article in the *Tribune*. By Salinger's
        account.
      n: '[[w.salinger-with-kennedy]], 169. Check: the day (the work gives the visit to Ottawa, May 16–18, and no day). Names:
        Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1961-05.press-and-broadcasting-2
      when: May, late
      date: 1961-05
      thread: press-and-broadcasting
      c: 'The White House. Bill Lawrence of the *Times*, told he will not go with the President to Europe: "If I had a good
        job offer today, I''d quit." Salinger telephones Hagerty at ABC: "If you want Lawrence, I think today''s the day."
        Lawrence signs that day as ABC''s White House correspondent and political editor. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 144. Check: the day ("late May 1961," the President to leave for Europe "in a day or
        two"). Names: Salinger, Hagerty.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
- add:
    entry:
      id: cal.1961-06-03.berlin-and-vienna-4
      when: June 3
      date: '1961-06-03'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: 'Vienna, the morning of Salinger''s arrival. Kharlamov, Khrushchev''s spokesman, and Salinger agree through interpreters
        on handling the joint communiqués. Kharlamov has met Mrs. Jarvis of NBC on her plan for a debate on American television;
        Salinger wants it shown in the Soviet Union too. Kharlamov will speak to Adzhubei in Moscow: "I think it can be arranged."
        By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 176–77. Names: Kharlamov, Khrushchev, Salinger, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
      - name:khrushchev-nikita-s
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1961-06-03.berlin-and-vienna-5
      when: June 3
      date: '1961-06-03'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: 'Vienna. After the first day''s talks, which break up at 6:45 p.m., Salinger and Kharlamov reduce the communiqué
        to two paragraphs: "frank, courteous, and wide-ranging." At the joint briefing at the Hofburg, to more than 1,200
        reporters, Salinger reads it; Kharlamov has "nothing to add," so the next day''s meeting may be as "fruitful." Chalmers
        Roberts asks if Salinger accepts that word: "I will stand with the statement I made at the outset." By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 179–80. Names: Salinger, Kharlamov.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1961-06-04.berlin-and-vienna-3
      when: June 4
      date: '1961-06-04'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: Vienna, the Soviet Embassy, while the leaders meet upstairs. Salinger, Kharlamov and Lucy Jarvis of NBC tentatively
        set June 24 in New York for a televised debate with Adzhubei. Salinger proposes that Kharlamov and Adzhubei then come
        to Washington, and a series of filmed television exchanges between Kennedy and Khrushchev; Kharlamov will put it to
        Khrushchev. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 180–81. Names: Salinger, Kharlamov, Adzhubei, Kennedy, Khrushchev.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
      - name:adzhubei-aleksei
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1961-06-04.berlin-and-vienna-4
      when: June 4–5
      date: '1961-06-04'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: Vienna, after the last session. Kennedy, finding the press reports too optimistic, tells Salinger to stay behind
        and counter the euphoria among American reporters; Salinger backgrounds the by-liners as they file, and leaves with
        them for London in the early hours of June 5. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 182. See [[cal.1961-06-04.press-and-broadcasting]]. Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-06-24.soviet-union
      when: June 24
      date: '1961-06-24'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: New York, the Hotel Carlyle. At Mrs. Jarvis's lunch before the debate Salinger meets Adzhubei and Bolshakov for the
        first time. The Russians promise a rebroadcast of the debate in the Soviet Union and look forward to their Washington
        visit. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 184. Check: the day (the work gives June 24 only as the day tentatively agreed at Vienna;
        the debate on a Saturday, the next day "a Sunday"). Names: Salinger, Adzhubei, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:adzhubei-aleksei
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1961-06-24.soviet-union-2
      when: June 24
      date: '1961-06-24'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: 'NBC''s *The Nation''s Future*, taped that afternoon, broadcast late in the evening, an hour: Salinger and Harrison
        Salisbury of the *Times* against Adzhubei and Kharlamov on a free press. Salinger on the Gagarin flight: no Soviet
        reporter saw it; Shepard''s was open to five hundred. Adzhubei: "We are modest people. First we fly, then we write
        about it." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 184–86 (the Russians did not show it in the Soviet Union, 188). Check: the day (see
        [[cal.1961-06-24.soviet-union]]). Names: Salinger, Salisbury, Adzhubei, Kharlamov.'
      tags:
      - name:salinger-pierre
      - name:salisbury-harrison-e
      - name:adzhubei-aleksei
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1961-06-24.soviet-union-3
      when: June 24
      date: '1961-06-24'
      thread: soviet-union
      c: 'Falls Church, Salinger''s home, night. Barbecue for Adzhubei, Kharlamov, Bolshakov and Sagatelyan of Tass, with
        Murrow, Merriman Smith and Tubby; they watch the debate together. Five minutes after it ends Kennedy telephones from
        the White House: "You and Salisbury were great," and "I thought you won hands down." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 186. Check: the day (see [[cal.1961-06-24.soviet-union]]). Names: Salinger, Kennedy,
        Adzhubei, Kharlamov, Bolshakov, Murrow, Tubby, Salisbury.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:adzhubei-aleksei
      - name:bolshakov-georgi
      - name:murrow-edward-r
      - name:kharlamov-mikhail-a
      - name:tubby-roger-w
      - name:salisbury-harrison-e
- add:
    entry:
      id: cal.1961-06-25.soviet-union
      when: June 25
      date: '1961-06-25'
      thread: soviet-union
      c: 'The presidential yacht *Patrick J.* on the Potomac, a Sunday. Kharlamov to Salinger: "grave concern" in the Soviet
        Union over the pace of disarmament talks; Kennedy harder to bring to the table than Eisenhower. Salinger: McCloy has
        instructions to explore the widest agreement. Bolshakov: the Americans have too many allies. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 186–87. Check: the day ("the next day, a Sunday"; see [[cal.1961-06-24.soviet-union]]).
        Names: Kharlamov, Salinger, Kennedy, Eisenhower, McCloy, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
      - name:kennedy-john-f
      - name:eisenhower-dwight-d
      - name:mccloy-john-j
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1961-06-26.soviet-union
      when: June 26
      date: '1961-06-26'
      thread: soviet-union
      c: 'The White House. Kennedy with Adzhubei and Kharlamov for more than an hour, Bolshakov and Salinger present. On Khrushchev''s
        forecast that the Soviet Union will pass the United States in 1978: the high jumper''s bar. Berlin: the 10,000 troops
        "token in nature," a commitment to be maintained; Adzhubei: let us have a token force of "seventeen pretty nurses."
        By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 187–88. Check: the day ("the next morning, the last day of their visit"; see [[cal.1961-06-24.soviet-union]]).
        Names: Kennedy, Adzhubei, Kharlamov, Bolshakov, Salinger, Khrushchev.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:adzhubei-aleksei
      - name:bolshakov-georgi
      - name:kharlamov-mikhail-a
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1961-09-24.berlin-and-vienna
      when: Sept. 24
      date: '1961-09-24'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - laos
      c: 'New York, the Carlyle, 1 a.m. Kennedy, back from a Broadway play, hears Khrushchev''s message from Salinger; Sulzberger
        has not delivered his. "If Khrushchev is ready to listen to our views on Germany, he''s not going to recognize the
        Ulbricht regime—not this year, at least." At 1:30 he telephones Rusk for more than half an hour, then dictates to
        Salinger an oral reply for Kharlamov: an early summit more likely to succeed after a show of Soviet good faith in
        Laos. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 193–94 (the day: after the meeting of "the night of September 23," 189). See [[cal.1961-09.berlin-and-vienna]].
        Names: Kennedy, Salinger, Khrushchev, Sulzberger, Rusk.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:sulzberger-c-l
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-09-25.soviet-union
      when: Sept. 25
      date: '1961-09-25'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: New York, the Carlyle, the morning of the UN address. Minutes before leaving for the UN Kennedy approves the typescript
        of his reply to Khrushchev; half an hour later Salinger reads it to Kharlamov and Bolshakov. Salinger then tells them
        Tubby finds no security reason for withholding the Soviet correspondents' visas, which will be issued; Kharlamov will
        follow through on an Adzhubei interview. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 195–96, 198 (read to them "four days" before Sept. 29). Check: the day (Kharlamov was
        to come back "at eleven-thirty the next morning," Sept. 24). See [[cal.1961-09-24.berlin-and-vienna]]. Names: Kennedy,
        Khrushchev, Salinger, Kharlamov, Bolshakov, Tubby, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:kharlamov-mikhail-a
      - name:bolshakov-georgi
      - name:tubby-roger-w
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1961-09-27.elections-1962-2
      when: Sept. 27
      date: '1961-09-27'
      thread: elections-1962
      c: 'Kennedy to Salinger, on first learning of Nixon''s decision to run for governor of California: "He''s only running
        to stay alive politically," and "He hasn''t a chance of winning, but even if he did the risks are too great for the
        advantages he might win." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 197. Check: the day (the work: "after first learning"). See [[cal.1961-09-27.elections-1962]].
        Names: Kennedy, Salinger, Nixon.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1961-09-29.elections-1962
      when: Sept. 29
      date: '1961-09-29'
      thread: elections-1962
      also:
      - press-and-broadcasting
      c: 'Newport Naval Station, Salinger''s morning briefing. Asked for the President''s reaction to Nixon''s decision to
        run for governor of California: "He does not." Asked for his own, as a Californian: "No." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 197. See [[cal.1961-09-27.elections-1962]]. Names: Salinger, Nixon.'
      tags:
      - name:salinger-pierre
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1961-09-29.soviet-union-2
      when: Sept. 29
      date: '1961-09-29'
      thread: soviet-union
      c: 'Newport, afternoon. Bolshakov telephones Salinger from New York: he must see him at once, and would charter a plane.
        Salinger asks him to wait and telephones Kennedy, and Rusk, who is with Gromyko in New York; they guess a Soviet answer
        on Laos and agree he should not be seen in Newport. Salinger sets the meeting for 3:30 the next afternoon at the Carlyle.
        By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 197–98. Names: Bolshakov, Salinger, Kennedy, Rusk, Gromyko.'
      tags:
      - name:salinger-pierre
      - name:bolshakov-georgi
      - name:kennedy-john-f
      - name:rusk-dean
      - name:gromyko-andrei
- add:
    entry:
      id: cal.1961-09-30.soviet-union
      when: Sept. 30
      date: '1961-09-30'
      thread: soviet-union
      c: New York, the Waldorf-Astoria, 7:30 p.m. Salinger gives Rusk Khrushchev's letter. Rusk reads it twice and, wanting
        no snap reaction for Kennedy, takes it to Washington that night, to be returned to Salinger at La Guardia at 7:30
        the next morning. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 198–99 (and Salinger with Rusk at the Waldorf before the Carlyle meeting, 198). See
        [[cal.1961-09-29.soviet-union]]. Names: Salinger, Rusk, Khrushchev, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:rusk-dean
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-10-01.soviet-union
      when: Oct. 1
      date: '1961-10-01'
      thread: soviet-union
      c: Newport. Salinger gives Kennedy Khrushchev's letter on his return from church. Kennedy telephones Rusk; they agree
        Salinger should tell Bolshakov the President will answer promptly, probably within the week. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 199–200 (the day: the morning after Sept. 30). See [[cal.1961-09-30.soviet-union]].
        Names: Salinger, Kennedy, Khrushchev, Rusk, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:rusk-dean
      - name:khrushchev-nikita-s
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1961-11-20.soviet-union
      when: Nov. 20
      date: '1961-11-20'
      thread: soviet-union
      c: Falls Church. Dinner at Salinger's for Adzhubei, arrived in Washington that day for the interview, with Barsukov
        of *Izvestia*, Bolshakov, and Guthrie of the State Department's Soviet desk. Adzhubei says the Soviet Union and the
        United States should settle things without heeding their allies; Guthrie asks if East Germany and China would then
        be dropped, and Adzhubei drops the subject. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 200–01. Names: Adzhubei, Salinger, Bolshakov, Guthrie.'
      tags:
      - name:salinger-pierre
      - name:adzhubei-aleksei
      - name:bolshakov-georgi
      - name:guthrie-john-c
- add:
    entry:
      id: cal.1961-11-25.berlin-and-vienna-2
      when: Nov. 25
      date: '1961-11-25'
      thread: berlin-and-vienna
      c: 'Hyannis Port, after the Adzhubei interview. Kennedy, convinced he has done badly, to Salinger: "That might have
        been a mistake," and "Your arrogant Russian friend got in as many shots as I did." After reading the transcript he
        agrees with Salinger that Adzhubei''s polemics strengthened his answers. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 204–05. See [[cal.1961-11-25.berlin-and-vienna]]. Names: Kennedy, Salinger, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-22
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: Los Angeles, about three in the afternoon. Kennedy tells Clifford, Symington's campaign manager, that Johnson will
        be the vice-presidential candidate, and that he is surprised Johnson was willing to make a fight for second place.
        By Salinger's memorandum of the week after.
      n: '[[w.salinger-with-kennedy]], 45 (Clifford confides it to Governor Blair of Missouri, the source of Knight''s story).
        See [[cal.1960-07-14.elections-1960]]. Names: Kennedy, Clifford, Symington, Johnson, Salinger.'
      tags:
      - name:kennedy-john-f
      - name:clifford-clark
      - name:symington-william-s
      - name:johnson-lyndon-b
      - name:salinger-pierre
- add:
    entry:
      id: cal.1960-07-16.elections-1960-los-angeles-2
      when: July 16–17
      date: '1960-07-16'
      thread: elections-1960-los-angeles
      c: 'Asked by Salinger whether he had expected Johnson to accept second place, Kennedy gives him many of the facts of
        his memorandum, then stops: "The whole story will never be known. And it''s just as well that it won''t be." By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 46. Check: the day ("a day or two after the convention"). See [[cal.1960-07-14.elections-1960-los-angeles-21]].
        Names: Salinger, Kennedy, Johnson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-11-09.elections-1960-count-7
      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960-count
      c: 'Hyannis Armory, after Klein''s reading of Nixon''s concession. Kennedy, his wife at his side before the television
        lights, commits all his energies to "the long-range interests of the United States and the cause of freedom around
        the world . . . So now my wife and I prepare for a new administration and a new baby." To Merriman Smith of UPI: "If
        you''re here, Smitty, I guess I''ve really been elected." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 51, 52–53. See [[cal.1960-11-09.elections-1960-count-2]]. Names: Kennedy, Jacqueline
        Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-jacqueline
      - state:ma
- add:
    entry:
      id: cal.1960-11-24.white-house
      when: Nov. 24
      date: '1960-11-24'
      thread: white-house
      also:
      - press-and-broadcasting
      c: Thanksgiving Day. Kennedy flies from Washington to Palm Beach on the *Caroline*; on landing, word that Mrs. Kennedy
        has been rushed to Georgetown University Hospital. He speaks to her doctor, John Walsh, and orders the press plane
        back to Washington; halfway there the radio operator tells him a son has been born, and it is announced to the press
        over the intercom. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 60. Names: Kennedy, Jacqueline Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-jacqueline
      - state:fl
- add:
    entry:
      id: cal.1961-01.press-and-broadcasting-3
      when: Jan.
      date: 1961-01
      thread: press-and-broadcasting
      c: Lunch with Reston of the *Times*, after the Sheraton Park lunch. Reston holds the President should stop seeing his
        old friends in the press socially, and the press must be with him whenever he leaves the White House; Salinger will
        neither police the President's friends nor announce his private movements. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 59–60. Check: the day. See [[cal.1961-01.press-and-broadcasting-2]]. Names: Reston,
        Salinger.'
      tags:
      - name:reston-james
      - name:salinger-pierre
- add:
    entry:
      id: cal.1961-04-08.cuba-bay-of-pigs-2
      when: Apr. 8
      date: '1961-04-08'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: Miami. Miró Cardona, president of the Cuban Revolutionary Council, tells the press an uprising against Castro is
        "imminent." By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 146 (the day: "only nine days before the landing"). Names: Miró Cardona, Castro.'
      tags:
      - name:miro-cardona-jose
      - name:castro-fidel
      - state:fl
      - city:miami
- add:
    entry:
      id: cal.1961-04-09.cuba-bay-of-pigs-2
      when: Apr. 9
      date: '1961-04-09'
      thread: cuba-bay-of-pigs
      c: Miró Cardona appeals to Cubans still in Cuba to take up arms against Castro. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 146 (the day: "the very next day" after his statement of Apr. 8). See [[cal.1961-04-08.cuba-bay-of-pigs-2]].
        Names: Miró Cardona, Castro.'
      tags:
      - name:miro-cardona-jose
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-11.soviet-union-3
      when: Nov., early
      date: 1961-11
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: Bolshakov tells Salinger that Adzhubei has been chosen to interview the President; they agree on the day, Nov. 25,
        and the place, Hyannis Port. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 200. Check: the day ("early in November"). See [[cal.1961-09-29.soviet-union]]. Names:
        Bolshakov, Salinger, Adzhubei.'
      tags:
      - name:bolshakov-georgi
      - name:salinger-pierre
      - name:adzhubei-aleksei
- cite:
    id: cal.1960-07-04.elections-1960-2
    item: '[[w.salinger-with-kennedy]], 40 (the press conference of Connally and India Edwards: Kennedy has Addison''s disease
      and might prove physically unfit; Johnson''s statement denying advance knowledge; not the words quoted, the *Times*
      or the day)'
    units: '?'
- check:
    id: cal.1960-07-04.elections-1960-2
    text: 'Check: the day: [[w.salinger-with-kennedy]], 40, puts the Connally–Edwards press conference "on the first day of
      the convention" (July 11).'
- cite:
    id: cal.1960-07-12.elections-1960-2
    item: '[[w.salinger-with-kennedy]], 41–42 (Kennedy accepts an invitation to address the Texas delegation; newsmen''s word
      that Johnson would challenge him to debate there; the debate before a joint caucus of the Massachusetts and Texas delegations,
      "a draw"; not the telegram, the press conference, the hour or the words)'
    units: '?'
- cite:
    id: cal.1960-07-13.elections-1960
    item: '[[w.salinger-with-kennedy]], 35, 43 (761 needed, 35; the model home outside the Sports Arena with Robert Kennedy,
      O''Brien, O''Donnell and Smith; Wyoming''s fifteen votes put him over, 43; not the totals)'
    units: B
- cite:
    id: cal.1960-07-14.elections-1960-los-angeles-16
    item: '[[w.salinger-with-kennedy]], 44 (Salinger''s memorandum: Robert Kennedy''s room at the Biltmore, O''Donnell there,
      Robert Kennedy asks Salinger to compute electoral votes, is "seriously thinking of Johnson," and says Kennedy will see
      Johnson at 10 a.m.; O''Donnell protests violently, Salinger with him; not the bathtub or the words)'
    units: '?'
- variant:
    id: cal.1960-07-14.elections-1960-los-angeles-16
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Robert Kennedy "asked me to compute the number of electoral votes in New England and in the ''solid
      South''"; Kennedy "was going over to see Johnson at 10 A.M."'
    at: '44'
- cite:
    id: cal.1960-11-09.elections-1960-9
    item: '[[w.salinger-with-kennedy]], 47–48 (at Ambassador Kennedy''s home Kennedy and his staff watch Nixon on television;
      Kennedy turns off the set, cuts off the talk against Nixon, and walks home to bed; not the Armory or the hour)'
    units: B
- variant:
    id: cal.1960-11-09.elections-1960-9
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Nixon appeared on the screen "shortly before 4 A.M."'
    at: '47'
- variant:
    id: cal.1960-11-09.elections-1960-9
    unit: D
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Kennedy, as they were angry with Nixon for not conceding: "If I were he, I would have done the same
      thing."'
    at: 47–48
- cite:
    id: cal.1960-11-09.elections-1960-count-2
    item: '[[w.salinger-with-kennedy]], 50–51 (Klein, not Nixon, reads the concession on the television set at Ambassador
      Kennedy''s house; not that Nixon called the press conference)'
    units: A, C, D
- cite:
    id: cal.1960-11-09.elections-1960-11
    item: '[[w.salinger-with-kennedy]], 49–50 (Sorensen first to reach Kennedy; Salinger finds them in an upstairs bathroom;
      no claim until Nixon concedes on television; Kennedy blames DeSapio and Prendergast for the loss of California)'
    units: C, D
- variant:
    id: cal.1960-11-09.elections-1960-11
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Sorensen "was the first to reach JFK with the news," perched on the edge of the tub in an upstairs bathroom,
      "reading him the late returns"; the AP''s call: "Your man has carried Minnesota and is elected"; Kennedy: "I still don''t
      know how we did it without California"'
    at: 49–50
- variant:
    id: cal.1960-11-09.elections-1960-11
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: the AP''s call woke him at 8:30, and five minutes later he was racing to Hyannis Port; at the tub "It
      was only six in the morning on the West Coast"'
    at: 49–50
- cite:
    id: cal.1960-11-09.transition-and-staff
    item: '[[w.salinger-with-kennedy]], 51 (Kennedy to Salinger, on the walk to the staff meeting at his father''s house the
      next morning: "I want you to stay on as my Press Secretary"; Hatcher his second; Clifford waiting at Ambassador Kennedy''s
      with copies of a thick handbook for the transition; not the other appointments)'
    units: D
- cite:
    id: cal.1960-11-18.cuba
    item: '[[w.salinger-with-kennedy]], 54 (Dulles and Bissell tell the President-elect, among his visitors at Palm Beach,
      of the Cuban exile force training on a coffee plantation on Guatemala''s Pacific coast; not Radio Swan, the FRD or the
      plan)'
    units: '?'
- check:
    id: cal.1960-11-18.cuba
    text: 'Check: the day: [[w.salinger-with-kennedy]], 54, has Dulles and Bissell tell the President-elect "for the first
      time on November 17."'
- cite:
    id: cal.1960-12-10.transition-and-staff-cabinet
    item: '[[w.salinger-with-kennedy]], 60–61 (the *Post*''s page-one banner on Rusk; Kennedy had talked of it with Graham
      the night before and not told him to hold it; not the place, Rusk''s arrival or Stevenson)'
    units: '?'
- cite:
    id: cal.1961-01-21.farm
    item: '[[w.salinger-with-kennedy]], 124 (Kennedy''s first act as President an order doubling the surplus food ration and
      extending it to areas of high unemployment; four million beneficiaries by the Agriculture specialist''s count; not the
      order''s number)'
    units: '?'
- cite:
    id: cal.1961-01-25.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 138, 140–41 (the first press conference, the first on live television, in the State
      Department auditorium; the top story the release of Olmstead and McKone, free five hours; Kennedy afterward: "How many
      people do you think saw it?"; the audience 60 million; not the other business)'
    units: A, B
- cite:
    id: cal.1961-04-08.cuba
    item: '[[w.salinger-with-kennedy]], 147 (on the Saturday a week before the invasion Schlesinger and a top CIA operative
      go to New York and give Stevenson a partial briefing; Stevenson: "I was never told the full extent of the plan"; not
      Barnes by name or the debate)'
    units: '?'
- cite:
    id: cal.1961-04-15.cuba-2
    item: '[[w.salinger-with-kennedy]], 147 (Stevenson to the UN: "these pilots and certain other crew members have apparently
      defected from Castro''s tyranny"; not the committee, Roa, Zorin or the press conference cited)'
    units: '?'
- cite:
    id: cal.1961-04-18.cuba-bay-of-pigs-2
    item: '[[w.salinger-with-kennedy]], 148–49 (after the night meeting Kennedy breaks off and walks the south grounds alone
      while O''Donnell and Salinger watch from a window; not the words)'
    units: '?'
- variant:
    id: cal.1961-04-18.cuba-bay-of-pigs-2
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: after the Cabinet Room conference, which "didn''t end until 4 A.M.," he and O''Donnell watched him for
      "the next forty-five minutes" walk "around the south grounds"'
    at: 148–49
- cite:
    id: cal.1961-04-19.cuba
    item: '[[w.salinger-with-kennedy]], 148 (Kennedy leaves the congressional reception at midnight for the Cabinet Room with
      Rusk, McNamara, Dulles, Bissell and Lemnitzer; the CIA and Pentagon say the cause is hopeless unless American forces
      are committed, and Kennedy will not; the meeting ends at 4 a.m.; not the aircraft or the B-26s)'
    units: '?'
- cite:
    id: cal.1961-04-21.cuba
    item: '[[w.salinger-with-kennedy]], 154 (the press conference two days after the surrender: no useful national purpose
      in going into Cuba; asked if Rusk and Bowles had opposed, "the facts will come out in due time"; the hundred fathers
      quoted, not tied to the press conference; not the approval or medical care)'
    units: '?'
- cite:
    id: cal.1961-04-27.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 155–57 (the address to the ANPA Bureau of Advertising at the Waldorf-Astoria; the
      editorials read it as a rebuke and a forewarning of censorship; Daniels''s letter)'
    units: A, B
- cite:
    id: cal.1961-05-31.latin-america
    item: '[[w.salinger-with-kennedy]], 172–73 (in the press room at the Crillon Salinger tells reporters that Rusk will not
      come "because of the situation in the Dominican Republic," then names the assassination of Trujillo; the news out within
      the hour; Kennedy angry; Rusk on the telephone during the dinner: "Are you out of your mind?"; not Rusk''s account)'
    units: '?'
- variant:
    id: cal.1961-05-31.latin-america
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: it was O''Donnell, with Kennedy at the Quai d''Orsay, who telephoned him as he dressed for de Gaulle''s
      dinner that Rusk would not arrive the next day "because of the situation in the Dominican Republic"; Rusk telephoned
      later, during the dinner, to rebuke him'
    at: 172–73
- cite:
    id: cal.1961-06-04.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 182 (Kennedy has Salinger invite Reston to the embassy and gives him "an extremely
      candid statement of his views"; not the words)'
    units: '?'
- cite:
    id: cal.1961-09.berlin-and-vienna
    item: '[[w.salinger-with-kennedy]], 189, 191–93 (Salinger''s room at the Carlyle, 7:15 p.m. "the next night—a Saturday"
      after the arrival of Sept. 22, "the night of September 23"; Bolshakov brings Kharlamov, Gromyko''s press spokesman;
      "The storm in Berlin is over"; Khrushchev''s message: the danger of a major incident in Berlin too great to delay a
      settlement long, a summit at Kennedy''s time; Salinger presses for a Soviet editor to interview the President, Kharlamov
      for the fifteen Soviet correspondents refused visas)'
    units: A, B, C
- check:
    id: cal.1961-09.berlin-and-vienna
    text: 'Check: the day: [[w.salinger-with-kennedy]], 189, 191, has the meeting on Saturday, "the night of September 23";
      [[w.fursenko-khrushchevs-cold-war]], 397, Sept. 24.'
- cite:
    id: cal.1961-09-29.soviet-union
    item: '[[w.salinger-with-kennedy]], 198–99 (Bolshakov at the Carlyle, 3:30 the afternoon after Friday, Sept. 29, with
      a twenty-six-page letter from Khrushchev to Kennedy on Laos and Berlin; only Bolshakov, Gromyko, Kennedy, Rusk and Salinger
      know; Adzhubei or Sutukov to interview the President; not the letter''s date or an emissary)'
    units: '?'
- cite:
    id: cal.1961-11-25.berlin-and-vienna
    item: '[[w.salinger-with-kennedy]], 202–06 (the interview at Hyannis Port, 10:20 a.m., two hours; Adzhubei''s cable of
      Nov. 28; printed that day in the Moscow edition of *Izvestia*, in full but for one remark of Adzhubei''s own, changed)'
    units: A
- variant:
    id: cal.1961-11-25.berlin-and-vienna
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: printed Nov. 28, in the Moscow edition of *Izvestia* only, verbatim "with one exception": Adzhubei''s
      own words in the transcript, Khrushchev''s 1959 visit not "completely satisfactory," became "The positive results of
      that trip were wrecked and brought to nothing by the well-known actions of the then American administration"'
    at: 202, 205–06
- cite:
    id: cal.1960-07-12.elections-1960-6
    item: '[[w.salinger-with-kennedy]], 42 (the tumultuous demonstration when Stevenson takes his seat with the Illinois delegation,
      the house packed by his Southern California supporters; told that very morning by Illinois leaders that he could not
      count on his own State; not the Minnesota caucus or the LaFayette Room)'
    units: '?'
- check:
    id: cal.1960-07-12.elections-1960-6
    text: 'Check: the day of Stevenson''s seat with Illinois: [[w.salinger-with-kennedy]], 42, has it "the first day of the
      convention" (July 11).'
- cite:
    id: cal.1960-07-12.elections-1960-8
    item: '[[w.salinger-with-kennedy]], 40 (the California caucus on the second day of the convention; Kennedy''s count had
      claimed none of California, O''Brien and Unruh expecting not much over thirty-five; not Brown or the other votes)'
    units: '?'
- variant:
    id: cal.1960-07-12.elections-1960-8
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: "the California caucus announced only thirty-seven votes for JFK"'
    at: '40'
- cite:
    id: cal.1961-12-16.latin-america
    item: '[[w.salinger-with-kennedy]], 167–68 (Caracas: Pérez, the Venezuelan security chief, jails more than four thousand
      political suspects for the visit and lines the route from the airport with twenty thousand troops; O''Donnell and Powers
      armed at the President''s side; a Navy communications ship offshore; not Bogotá)'
    units: '?'
- add:
    entry:
      id: cal.1962-02-10.berlin-and-vienna-2
      when: Feb. 10
      date: '1962-02-10'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: 3:16 a.m. Salinger's press conference, the White House regulars called in within forty minutes by his office's automatic
        dialing. He announces the exchange of Abel for Powers, made at 8:16 a.m. in Berlin on the Glienicker Bridge. By Salinger's
        account.
      n: '[[w.salinger-with-kennedy]], 122. See [[cal.1962-02-10.berlin-and-vienna]]. Names: Salinger, Abel, Powers.'
      tags:
      - name:salinger-pierre
      - name:abel-rudolf
      - name:powers-francis-gary
- add:
    entry:
      id: cal.1962-01-18.soviet-union-2
      when: Jan. 18
      date: '1962-01-18'
      thread: soviet-union
      c: 'Evening, the Hay-Adams bar. Bolshakov to Salinger: Khrushchev agrees to a series of television exchanges with Kennedy;
        the invitation to Salinger and his family to visit Adzhubei in Moscow in April is official; the Kremlin would welcome
        Robert Kennedy, who plans a European tour that summer. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 208–09. See [[cal.1962-01-18.soviet-union]]. Names: Bolshakov, Salinger, Khrushchev,
        Kennedy, Robert Kennedy, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:bolshakov-georgi
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1962-01-18.press-and-broadcasting
      when: Jan. 18
      date: '1962-01-18'
      thread: press-and-broadcasting
      c: 'Lunch at the Metropolitan Club. Reston to Salinger: Kennedy''s way of doing business is "much too informal"; Salinger
        should keep a White House diary of visitors, off-the-record talks and the disputes before major decisions. Salinger
        promises a general record of comings and goings. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 208. Names: Reston, Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:reston-james
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-01-18.soviet-union-3
      when: Jan. 18
      date: '1962-01-18'
      thread: soviet-union
      c: 'The President''s office, shortly before midnight. Kennedy to Salinger on Bolshakov''s messages: go ahead with the
        television exchanges; delay the answer on Moscow; decline Robert Kennedy''s invitation, "quietly and before the Russians
        announce it," since he should not be in the picture; he will have the Adzhubeis to lunch. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 209. Names: Kennedy, Salinger, Robert Kennedy, Bolshakov, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:bolshakov-georgi
      - name:kennedy-robert-f
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1962-01-19.robert-kennedy-2
      when: Jan. 19
      date: '1962-01-19'
      thread: robert-kennedy
      also:
      - soviet-union
      c: Morning. Kennedy speaks to Robert Kennedy, who agrees that he should not go to the Soviet Union. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 209. See [[cal.1962-01-18.soviet-union-3]]. Names: Kennedy, Robert Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-01-20.robert-kennedy
      when: Jan. 20
      date: '1962-01-20'
      thread: robert-kennedy
      also:
      - press-and-broadcasting
      - soviet-union
      c: Night. Reston tells Robert Kennedy that the story of the Soviet invitation is about to break; his informant, he says,
        a Russian. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 210 (Kennedy doubts it, suspecting a State Department source; beyond the family only
        Rusk, Bohlen and Kohler knew). Check: the day ("the night before" the *Times* story of Jan. 21). Names: Reston, Robert
        Kennedy.'
      tags:
      - name:reston-james
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-01-21.soviet-union
      when: Jan. 21
      date: '1962-01-21'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: '*New York Times*, page one, Max Frankel: the Soviet invitation to the Attorney General, the day before Salinger
        was to give Bolshakov the refusal. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 209. See [[cal.1962-01-20.robert-kennedy]]. Names: Frankel, Robert Kennedy, Salinger,
        Bolshakov.'
      tags:
      - name:frankel-max
      - name:kennedy-robert-f
      - name:salinger-pierre
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1962-01-21.robert-kennedy
      when: Jan. 21
      date: '1962-01-21'
      thread: robert-kennedy
      also:
      - soviet-union
      c: Robert Kennedy announces that long-standing commitments in other European capitals will not let him visit Moscow.
        By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 209. Check: the day ("Bob quickly announced," after the *Times* story). See [[cal.1962-01-21.soviet-union]].
        Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-01.soviet-union-2
      when: Jan.
      date: 1962-01
      thread: soviet-union
      also:
      - robert-kennedy
      c: 'The *New York Daily News* prints Bolshakov: Robert Kennedy''s refusal "a direct affront to the Soviet Union." By
        Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 209. Check: the day (after Robert Kennedy''s refusal of Jan. 21). Names: Bolshakov,
        Robert Kennedy.'
      tags:
      - name:bolshakov-georgi
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-01-23.soviet-union
      when: Jan. 23
      date: '1962-01-23'
      thread: soviet-union
      c: Night. Salinger with Bolshakov on the television exchange. Kharlamov is to negotiate for Khrushchev; Murrow and Salinger
        for Kennedy, in Paris on Jan. 28–29. Bolshakov, sore over the Robert Kennedy affair, denies a Russian source; Salinger
        tells him the Adzhubeis are asked to lunch on Jan. 30. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 210. Names: Salinger, Bolshakov, Kharlamov, Khrushchev, Murrow, Kennedy, Robert Kennedy,
        Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:bolshakov-georgi
      - name:kharlamov-mikhail-a
      - name:khrushchev-nikita-s
      - name:murrow-edward-r
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1962-01-28.soviet-union
      when: Jan. 28
      date: '1962-01-28'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: 'Paris, Orly. Salinger gives the waiting reporters his cover story: he is there to confer with Murrow; he knows Kharlamov
        is in Paris and will see him if they can work it out. Kharlamov, arriving an hour later, tells the same. By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 211. Check: the day (the book has the talks set for Jan. 28–29, the negotiations "the
        next morning," and Salinger flying home the day before the lunch of Jan. 30). Names: Salinger, Murrow, Kharlamov.'
      tags:
      - name:salinger-pierre
      - name:murrow-edward-r
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1962-01-28.soviet-union-2
      when: Jan. 28
      date: '1962-01-28'
      thread: soviet-union
      c: Paris, night, the cocktail party at Minister Cecil Lyon's. Salinger and Kharlamov, as agreed, say nothing of the
        television exchange; Kharlamov denies a Kremlin crisis and calls Molotov "a political cadaver." Baraduc of the French
        Foreign Office, who had tipped the press, eavesdrops, and quarrels with Kharlamov over the expulsions of correspondents.
        By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 211. Check: the day. See [[cal.1962-01-28.soviet-union]]. Names: Lyon, Salinger, Kharlamov,
        Molotov, Baraduc.'
      tags:
      - name:lyon-cecil
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
      - name:molotov-vyacheslav
      - name:baraduc-pierre
- add:
    entry:
      id: cal.1962-01-29.soviet-union
      when: Jan. 29
      date: '1962-01-29'
      thread: soviet-union
      c: Paris, the Soviet Embassy, four hours. Salinger and Murrow agree with Kharlamov on a series of thirty-minute joint
        television programs, the first on March 18, at noon in Washington and 7 p.m. in Moscow, the theme "What Kind of World
        I Would Like to Live In." Salinger asks whether the Soviet Union would negotiate a "hot line"; Kharlamov will find
        out in Moscow. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 211–13 (each side to film its principal on March 9 or 10; the luncheon at the embassy
        after). Check: the day ("the next morning" after the cocktail party). Names: Salinger, Murrow, Kharlamov.'
      tags:
      - name:salinger-pierre
      - name:murrow-edward-r
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1962-01-30.press-and-broadcasting
      when: Jan. 30
      date: '1962-01-30'
      thread: press-and-broadcasting
      also:
      - soviet-union
      c: 'Salinger at his briefing after the Adzhubeis leave: the talk was "informal and wide-ranging"; Kennedy, talking to
        Adzhubei, knows he can reach his father-in-law directly. He announces his own visit to the Soviet Union in two months
        for a freer exchange of information; he has State''s clearance and plans no call on Khrushchev. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 214. Names: Salinger, Kennedy, Adzhubei, Khrushchev.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1962-01-30.soviet-union-2
      when: Jan. 30
      date: '1962-01-30'
      thread: soviet-union
      c: Night. Salinger's reception for the Adzhubeis at his house in Falls Church, Va., Bolshakov leading the songs at the
        piano. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 214. See [[cal.1962-01-30.soviet-union]]. Names: Salinger, Adzhubei, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:adzhubei-aleksei
      - name:bolshakov-georgi
      - city:falls-church
      - state:va
- add:
    entry:
      id: cal.1962-01-31.robert-kennedy
      when: Jan. 31
      date: '1962-01-31'
      thread: robert-kennedy
      also:
      - soviet-union
      c: The Adzhubeis lunch with Robert Kennedy, then fly home. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 214. Check: the day ("the next day" after Jan. 30). See [[cal.1962-01-30.soviet-union]].
        Names: Adzhubei, Robert Kennedy.'
      tags:
      - name:adzhubei-aleksei
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-02-13.soviet-union
      when: Feb. 13
      date: '1962-02-13'
      thread: soviet-union
      c: 'Bolshakov tells Salinger that Khrushchev accepts all the arrangements for the television exchange but the date:
        May 25, not March 18. Salinger agrees. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 214. Names: Bolshakov, Salinger, Khrushchev.'
      tags:
      - name:salinger-pierre
      - name:bolshakov-georgi
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-02-28.soviet-union
      when: Feb. 28
      date: '1962-02-28'
      thread: soviet-union
      also:
      - press-and-broadcasting
      - testing
      c: 'New York, the Carlyle. Salinger, privately, with Kintner and Goodman of NBC, Stanton of CBS and Hagerty for ABC.
        They grumble at not being told sooner, and agree to run the first exchange on May 25. As they leave, Bundy telephones:
        Kennedy will announce the resumption of atmospheric tests on March 2 if the networks give the time; all agree. By
        Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 214–15. Names: Salinger, Kintner, Stanton, Hagerty, Bundy, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kintner-robert-e
      - name:goodman-julian
      - name:stanton-frank
      - name:hagerty-james-c
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-04-05.soviet-union
      when: Apr. 5
      date: '1962-04-05'
      thread: soviet-union
      c: 'The President''s office. Kennedy and Bundy with Salinger on the script of the first television exchange: it would
        have more appeal if Mrs. Kennedy and Mrs. Khrushchev appeared. Salinger telephones Bolshakov, sick at home, to pass
        it to Kharlamov. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 215–16. Names: Kennedy, Bundy, Salinger, Jacqueline Kennedy, Bolshakov, Kharlamov.'
      tags:
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:salinger-pierre
      - name:kennedy-jacqueline
      - name:bolshakov-georgi
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1962-04-05.soviet-union-2
      when: Apr. 5
      date: '1962-04-05'
      thread: soviet-union
      also:
      - testing
      c: '6:30 p.m., the Hay-Adams bar. Bolshakov to Salinger: "My government wants to call off the entire Kennedy-Khrushchev
        exchange," the fault Kennedy''s for resuming nuclear tests; Salinger''s visit still wanted. Salinger: "It sure as
        hell does affect my visit." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 216. See [[cal.1962-03.soviet-union]]. Names: Bolshakov, Salinger, Kennedy, Khrushchev.'
      tags:
      - name:bolshakov-georgi
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-04-05.soviet-union-3
      when: Apr. 5
      date: '1962-04-05'
      thread: soviet-union
      c: 'The President''s office. Kennedy, angry, sends for Sorensen, drafting the opening statement, and thinks first of
        cancelling Salinger''s visit in retaliation. Then he calls Bohlen, who advises a joint announcement without reasons;
        Kennedy agrees: "But tell him also that we are greatly displeased." Bolshakov agrees to the joint announcement. By
        Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 216–17. Check: the day of Bolshakov''s answer. Names: Kennedy, Sorensen, Salinger,
        Bohlen, Bolshakov.'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      - name:salinger-pierre
      - name:bohlen-charles-e
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1962-05-01.soviet-union
      when: May 1
      date: '1962-05-01'
      thread: soviet-union
      c: 'The Soviet Embassy. Salinger lunches with the new ambassador, Dobrynin, four days before leaving for Moscow. Dobrynin:
        Khrushchev''s letters to Kennedy will now go through him, not Bolshakov and Salinger; he wants the widest relationship
        with Americans in and out of government. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 220–21. Check: the day ("four days before my departure" on May 5). Names: Dobrynin,
        Salinger, Khrushchev, Kennedy, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1962-05.berlin-and-vienna
      when: May
      date: 1962-05
      thread: berlin-and-vienna
      c: 'Bonn. On Salinger''s visit to confer with American and West German information officers, Adenauer''s two press conferences
        read as against further American–Soviet talks on Berlin. Foreign Minister Schröder summons Salinger to the chancellery:
        Adenauer was misunderstood. Salinger thinks the press read him rightly and cables Schröder''s explanation to Kennedy.
        By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 221–22. Check: the day (between the departure of May 5 and the arrival in Moscow on
        May 11). Names: Salinger, Adenauer, Schröder, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:schroder-gerhard
      - name:adenauer-konrad
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-02.vietnam
      when: Feb., early
      date: 1962-02
      thread: vietnam
      also:
      - press-and-broadcasting
      c: Kennedy with Rusk. Rowan argues for loosening the press policies in Vietnam. Kennedy approves a new press policy
        for the field, "maximum" cooperation between the mission and the press, and a change of the information officers in
        Saigon. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 321. Check: the day ("early in February"). Names: Kennedy, Rusk, Rowan.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:rowan-carl-t
- add:
    entry:
      id: cal.1962-02-17.vietnam
      when: Feb. 17
      date: '1962-02-17'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: A cable to Tokyo orders Charles Davis, the USIS press officer there, to Saigon, to "work directly with the American
        press, particularly on military matters." By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 321. Names: Davis.'
      tags:
      - name:davis-charles
- add:
    entry:
      id: cal.1962-02-19.vietnam-2
      when: Feb. 19
      date: '1962-02-19'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: Honolulu. Davis with Nolting, Harkins, Sylvester and Rowan, who bring the draft of the new press policy for Vietnam,
        cabled also to Saigon. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 321–22. See [[cal.1962-02-17.vietnam]]. Names: Davis, Nolting, Harkins, Sylvester,
        Rowan.'
      tags:
      - name:davis-charles
      - name:nolting-frederick-e
      - name:harkins-paul-d
      - name:sylvester-arthur
      - name:rowan-carl-t
- add:
    entry:
      id: cal.1963-02.defense-5
      when: Feb.
      date: 1963-02
      thread: defense
      also:
      - press-and-broadcasting
      c: 'After a *Washington Post* item quoting General McHugh that a fifty-mile hike every day would be "loads of fun,"
        Kennedy lets Salinger off: McHugh is the man. Salinger''s communiqué: the President "would consider it fitting" if
        McHugh joined the Camp Lejeune march. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 241. Check: the day (after the first week of February, before Sunday, Feb. 10). See
        [[cal.1963-02.defense]]. Names: McHugh, Kennedy, Salinger.'
      tags:
      - name:mchugh-godfrey-t
      - name:kennedy-john-f
      - name:salinger-pierre
- add:
    entry:
      id: cal.1963-02.defense-7
      when: Feb.
      date: 1963-02
      thread: defense
      also:
      - press-and-broadcasting
      c: 'General McHugh: "I was misquoted by the Post"; he is no volunteer, suspects Salinger of "self-serving motives,"
        and will not go to Camp Lejeune. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 241. Check: the day (the day of Salinger''s communiqué). See [[cal.1963-02.defense-5]].
        Names: McHugh, Salinger.'
      tags:
      - name:mchugh-godfrey-t
      - name:salinger-pierre
- add:
    entry:
      id: cal.1963-02.defense-6
      when: Feb.
      date: 1963-02
      thread: defense
      also:
      - press-and-broadcasting
      c: 'After Salinger tells a UPI reporter, not for attribution, that General Clifton is outraged and can outwalk him,
        General McHugh accepts the challenge: a fifty-mile hike of White House personnel only, himself, Clifton, Captain Shepard
        and Salinger, who is to choose the route. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 241. Check: the day (the day of McHugh''s denial). Names: Salinger, Clifton, McHugh,
        Shepard.'
      tags:
      - name:salinger-pierre
      - name:clifton-chester-v-jr
      - name:mchugh-godfrey-t
      - name:shepard-tazewell-t
- add:
    entry:
      id: cal.1963-02.defense-8
      when: Feb.
      date: 1963-02
      thread: defense
      also:
      - press-and-broadcasting
      c: 'Kennedy refuses Salinger a stay: "You have been outflanked by McHugh." Salinger tells the correspondents the White
        House hike starts at 7 a.m. on Friday, Feb. 15, on the C&O Canal towpath, and at his afternoon briefing: "When I walk,
        everybody walks." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 241–43. Check: the day ("the next morning" after McHugh''s challenge; before Sunday,
        Feb. 10). See [[cal.1963-02.defense-6]]. Names: Kennedy, Salinger, McHugh.'
      tags:
      - name:kennedy-john-f
      - name:salinger-pierre
      - name:mchugh-godfrey-t
- add:
    entry:
      id: cal.1963-02-10.defense
      when: Feb. 10
      date: '1963-02-10'
      thread: defense
      also:
      - press-and-broadcasting
      c: Sunday. Salinger's practice hike around Lake Barcroft, Va., five to six miles in under two hours, with his family
        and a neighbor; Jack Perkins of NBC the one observer. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 243–44. Check: the day ("that Sunday—five days before the main event" of Feb. 15).
        Names: Salinger.'
      tags:
      - name:salinger-pierre
      - name:perkins-jack
      - state:va
- add:
    entry:
      id: cal.1963-02-11.defense
      when: Feb. 11
      date: '1963-02-11'
      thread: defense
      also:
      - press-and-broadcasting
      c: 'After a briefing of questions on the hike from Merriman Smith and others, Salinger to Kennedy: "I can''t walk fifty
        miles." Kennedy: "All right, if you can''t make it, you can''t," but he must find a convincing reason. By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 244–45. Check: the day ("the next morning" after the Sunday hike). Names: Salinger,
        Kennedy.'
      tags:
      - name:smith-merriman
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-02-12.defense
      when: Feb. 12
      date: '1963-02-12'
      thread: defense
      also:
      - press-and-broadcasting
      c: 'Salinger telephones Snider of the President''s Council on Physical Fitness: the hike craze is out of hand, and the
        Council should warn the unfit, "within the hour." Snider asks if he speaks for the President; Salinger: for himself,
        the President aware of his interest. Snider will write the statement himself. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 245. Check: the day ("the next morning" after Monday; Shoup''s calendar marks "the
        Black Tuesday of his capitulation"). Names: Salinger.'
      tags:
      - name:salinger-pierre
      - name:snider-richard
- add:
    entry:
      id: cal.1963-02-12.defense-2
      when: Feb. 12
      date: '1963-02-12'
      thread: defense
      also:
      - press-and-broadcasting
      c: '11 a.m. The President''s Council on Physical Fitness: fifty-mile hikes are for Marines; the physical activity of
        ordinary citizens should be "consistent with their physical condition." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 245–46 (the words as a reporter read them at the noon briefing). Check: the day. See
        [[cal.1963-02-12.defense]].'
      tags: []
- add:
    entry:
      id: cal.1962-10-16.missile-crisis-warnings
      when: Oct. 16
      date: '1962-10-16'
      thread: missile-crisis-warnings
      also:
      - press-and-broadcasting
      c: 'Morning. Kennedy to Salinger in his office: he will see Gromyko Thursday, who comes on his own initiative; there
        will be heavy traffic of Rusk, McNamara, Stevenson and the Chiefs this week, and if the press reads something into
        it Salinger is to deny that anything special is going on. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 249–50. Names: Kennedy, Salinger, Gromyko, Rusk, McNamara, Stevenson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:gromyko-andrei
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1962-10-19.missile-crisis-warnings-3
      when: Oct. 19
      date: '1962-10-19'
      thread: missile-crisis-warnings
      also:
      - press-and-broadcasting
      c: 'Chicago, evening. Salinger cues Sylvester at the Pentagon on the President''s denial of an invasion. Sylvester:
        "Maybe we''re not going to invade, but something big is coming up." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 251. See [[cal.1962-10-19.missile-crisis-warnings]]. Names: Salinger, Sylvester.'
      tags:
      - name:salinger-pierre
      - name:sylvester-arthur
      - city:chicago
      - state:il
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-9
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'Chicago, the Sheraton-Blackstone. At Salinger''s 9:15 briefing Western Union''s man calls him to the President''s
        suite: Kennedy, in pajamas, with O''Donnell, Powers and Dr. Burkley, says he has a temperature and a cold and writes
        the bulletin on hotel stationery: "99.2 degrees temperature. Upper respiratory infection. Doctor says he should return
        to Washington." Salinger reads it to the reporters; no one questions it. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 252. See [[cal.1962-10-20.missile-crisis]]. Names: Kennedy, Salinger, O''Donnell, Powers,
        Burkley.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:odonnell-kenneth-p
      - name:powers-david-f
      - name:burkley-george-g
      - city:chicago
      - state:il
- add:
    entry:
      id: cal.1962-10-20.soviet-union
      when: Oct. 20
      date: '1962-10-20'
      thread: soviet-union
      also:
      - missile-crisis-warnings
      c: Bolshakov tells the columnists Stewart Alsop and Charles Bartlett that there are no offensive Soviet missiles in
        Cuba; they quote him by name. By Salinger's account, the cause of his recall to Moscow.
      n: '[[w.salinger-with-kennedy]], 282. Check: the day (the book''s "Saturday, October 20"), and the column. Names: Bolshakov,
        Stewart Alsop, Bartlett.'
      tags:
      - name:bolshakov-georgi
      - name:alsop-stewart
      - name:bartlett-charles
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-10
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: '9:38 p.m. Kennedy telephones Salinger at home. Salinger reports the many questions on Cuba and that he is still
        in the dark. Kennedy: "You''re lucky." By Salinger''s account, from his date book.'
      n: '[[w.salinger-with-kennedy]], 253. Names: Kennedy, Salinger.'
      tags:
      - name:kennedy-john-f
      - name:salinger-pierre
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-warnings-2
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis-warnings
      also:
      - press-and-broadcasting
      c: '10:08 p.m. Folliard of the *Washington Post* tells Salinger that Lippmann has told Friendly, the *Post*''s editor,
        at a party that we are on the brink of war. Salinger calls Kennedy back. Kennedy: "This town is a sieve." How long
        can it hold? Salinger: through tonight and maybe tomorrow. Bundy will fill Salinger in in the morning. By Salinger''s
        account, from his date book.'
      n: '[[w.salinger-with-kennedy]], 253. Names: Folliard, Lippmann, Friendly, Salinger, Kennedy, Bundy.'
      tags:
      - name:folliard-edward-t
      - name:lippmann-walter
      - name:friendly-alfred
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-9
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: '9 a.m., the Situation Room. Bundy tells Salinger that the country is on the brink of nuclear war: offensive Soviet
        missiles in Cuba, not yet operational; a blockade the probable course; Kennedy to decide that day and announce it
        on television the next. He describes the aerial photographs and gives a chronology. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 253–54. Names: Bundy, Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-10
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'Shortly before noon, Salinger''s office. Salinger with Colonel Justice Chambers of the Office of Emergency Planning
        sets the emergency information plan going: a standby alert of the nationwide communications system, the instructions
        for the pool of correspondents who would go with the President, and plans to call part of the fifteen-member Censorship
        Advisory Board to Washington. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 257. Names: Salinger, Chambers.'
      tags:
      - name:salinger-pierre
      - name:chambers-justice-m
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-12
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'Salinger to Kennedy: the press asks why he has not gone to Mass. Kennedy: "I''m going." Salinger is to attend the
        ExComm that day and all strategy conferences for the duration: "I''ll expect you to know what''s going on every minute."
        By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 258. Names: Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-13
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'After the meeting, Kennedy to Salinger: ask the networks for half an hour at 7 p.m. the next night, "but hold off
        as long as you can"; arrange briefings at the White House, State and the Pentagon right after the speech; with O''Brien,
        bring the congressional leaders back for 5 p.m. the next day. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 259. Check: the hour. See [[cal.1962-10-21.missile-crisis-3]]. Names: Kennedy, Salinger,
        O''Brien.'
      tags:
      - name:kennedy-john-f
      - name:salinger-pierre
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-11
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: Afternoon, Salinger's house, Falls Church, Va. Salinger, Sylvester and Manning agree that Sylvester handles the military
        announcements and Manning the diplomatic ones, nothing from either without White House approval. A three-way telephone
        line bypassing the switchboards is put in that afternoon. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 260 (they then go over the cables in Manning''s office, where Don May of UPI finds
        them together). Names: Salinger, Sylvester, Manning.'
      tags:
      - name:salinger-pierre
      - name:sylvester-arthur
      - name:manning-robert-j
      - city:falls-church
      - state:va
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-quarantine
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-quarantine
      also:
      - press-and-broadcasting
      c: Morning. Salinger asks Minow of the FCC to clear the way for the use of ten radio stations; Minow flies back from
        New York and telephones the managers to stand by for a White House call at 6 p.m. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 261. Names: Salinger, Minow.'
      tags:
      - name:salinger-pierre
      - name:minow-newton-n
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-quarantine-2
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-quarantine
      also:
      - missile-crisis
      c: 'Afternoon. Kennedy gives Salinger a backgrounder for the questions after the address: a quarantine over an air strike
        because no strike is certain to hit every site; the missiles'' secrecy and the Russians'' denials; proof only since
        Tuesday; the Turkish bases not the same as Cuba''s missiles. "The next move is up to the Russians." By Salinger''s
        account, from his notes of the direct quotes.'
      n: '[[w.salinger-with-kennedy]], 262–63. Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-34
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: '4:10 p.m., Salinger''s briefing. Asked if the President''s cold was "a diplomatic illness," Salinger: "The President
        definitely had a degree of temperature in Chicago." Does he still have a cold? "No, he is fine." By Salinger''s account,
        met with incredulity.'
      n: '[[w.salinger-with-kennedy]], 263. Names: Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-quarantine-3
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-quarantine
      also:
      - cuba
      c: 6 p.m. Salinger telephones the managers of ten radio stations, Ralf Brent of WRUL first, with the President's request,
        worded with the FCC's lawyers, that they give their transmitters to the government from sunset to sunrise for Spanish
        broadcasts, voluntarily and with their costs paid. The cables are already at their doors. All agree. By Salinger's
        account.
      n: '[[w.salinger-with-kennedy]], 259, 264. See [[cal.1962-10-22.missile-crisis-25]]. Names: Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-35
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      - soviet-union
      c: 'Salinger puts Sagatelyan of Tass in the pool at the President''s office for the address: "I want to be sure that
        you read the President loud and clear." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 264. Names: Salinger.'
      tags:
      - name:salinger-pierre
      - name:sagatelyan-mikhail
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-36
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'After the address, Salinger''s office, the largest press crowd of his tenure but for the assassination: a hundred
        questions in fifteen minutes. The President stays in Washington "at least for the foreseeable future"; Kennedy did
        not call Gromyko a liar; he and Johnson cancel their political tours. Next move if the blockade fails: "I am not in
        charge of speculation." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 266–67. Names: Salinger, Kennedy, Gromyko, Johnson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:gromyko-andrei
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-37
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'Night, after the briefing. Salinger sends one by one for the White House correspondents who would go with the President
        if Washington were evacuated: never more than fifteen minutes away. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 267. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-38
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: Night. Salinger telephones Bill Steven, editor of the *Houston Chronicle*, chosen executive officer of the Censorship
        Advisory Board, to fly to Washington; he does. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 267. See [[cal.1962-10-21.missile-crisis-10]]. Names: Salinger.'
      tags:
      - name:salinger-pierre
      - name:steven-william-p
- add:
    entry:
      id: cal.1962-10-23.press-and-broadcasting
      when: Oct. 23
      date: '1962-10-23'
      thread: press-and-broadcasting
      also:
      - missile-crisis-quarantine
      c: '6 p.m. Salinger meets news-industry leaders: McKelway of the *Star* and AP, Gallagher, Thomason of UPI, Merriman
        Smith, Hagerty for ABC, Blair Clark, McAndrew, Sylvester and Manning. He asks them to withhold information that helps
        the enemy, and promises twelve points the next day and a twenty-four-hour Pentagon news desk. Gallagher and McAndrew
        resent any suggestion of censorship and the barring of reporters from blockade ships and Guantánamo. By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 287–89. Names: Salinger, Hagerty, Sylvester, Manning.'
      tags:
      - name:salinger-pierre
      - name:mckelway-benjamin-m
      - name:gallagher-wes
      - name:thomason-mims
      - name:smith-merriman
      - name:hagerty-james-c
      - name:clark-blair
      - name:mcandrew-william
      - name:sylvester-arthur
      - name:manning-robert-j
- add:
    entry:
      id: cal.1962-10-23.press-and-broadcasting-2
      when: Oct. 23
      date: '1962-10-23'
      thread: press-and-broadcasting
      also:
      - missile-crisis-quarantine
      c: After the news leaders leave, Salinger asks Hagerty to stay, lays out the censorship plans for full war and, with
        Kennedy's assent, asks him to head them. Hagerty, reluctant, agrees to head an advisory committee, and proposes Byron
        Price. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 289–90. See [[cal.1962-10-23.press-and-broadcasting]]. Names: Salinger, Hagerty, Kennedy,
        Price.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
      - name:kennedy-john-f
      - name:price-byron
- add:
    entry:
      id: cal.1962-10-23.press-and-broadcasting-3
      when: Oct. 23
      date: '1962-10-23'
      thread: press-and-broadcasting
      also:
      - missile-crisis-quarantine
      c: Salinger takes Hagerty to Kennedy, who thanks him for agreeing to head the advisory committee; Price is to be called
        at once, on standby, and agrees to serve if full censorship comes. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 290. See [[cal.1962-10-23.press-and-broadcasting-2]]. Names: Salinger, Hagerty, Kennedy,
        Price.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
      - name:kennedy-john-f
      - name:price-byron
- add:
    entry:
      id: cal.1962-10-24.press-and-broadcasting
      when: Oct. 24
      date: '1962-10-24'
      thread: press-and-broadcasting
      also:
      - missile-crisis-quarantine
      c: 'Salinger hands the press a memorandum of twelve categories of information "vital to our national security" that
        the Defense Department will not release: plans for forces, estimates of capability and targets, intelligence, movements,
        alert, dispersal, missile numbers, command posts, airlift. It asks "caution and discretion"; editors in doubt may
        call the Pentagon''s News Desk. Salinger: it binds no editor. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 290–92. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-quarantine
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis-quarantine
      also:
      - press-and-broadcasting
      c: Shortly before 1 a.m. Salinger gives out the photographs of the missiles in Cuba, after ExComm had held them back
        and Ambassador Bruce had released them to British television in London; Salinger had told Kennedy it was untenable
        to show them in Britain and keep them classified at home. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 293–94. Names: Salinger, Bruce, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:bruce-david-k-e
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-13
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'Kennedy to Salinger, on the destroyer *Joseph P. Kennedy, Jr.*, which stopped the *Marucla*: "The press will never
        believe we didn''t stick the Kennedy in the way of the Marucla just to give the family publicity." By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 271. Names: Kennedy, Salinger.'
      tags:
      - name:kennedy-john-f
      - name:salinger-pierre
- add:
    entry:
      id: cal.1962-10-27.press-and-broadcasting
      when: Oct. 27
      date: '1962-10-27'
      thread: press-and-broadcasting
      also:
      - defense
      c: At Kennedy's order, angry that people at Defense and State put out what the press is asked not to print, Sylvester
        has all Defense officials report in memoranda their press contacts, the questions and their answers. The press protests
        it as censorship. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 294. Names: Kennedy, Salinger, Sylvester.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:sylvester-arthur
- add:
    entry:
      id: cal.1962-10-31.press-and-broadcasting
      when: Oct. 31
      date: '1962-10-31'
      thread: press-and-broadcasting
      c: The State Department adopts the rule that its officials report their press contacts by memorandum, a mistake there,
        Salinger tells Kennedy, and Manning thinks so more strongly. Suspended within a month, by Manning's letter to the
        Department's officials. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 294–95. Check: the day ("four days later" than Oct. 27). See [[cal.1962-10-27.press-and-broadcasting]].
        Names: Salinger, Kennedy, Manning.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:manning-robert-j
- add:
    entry:
      id: cal.1962-10-29.press-and-broadcasting
      when: Oct. 29
      date: '1962-10-29'
      thread: press-and-broadcasting
      c: 'Sylvester to Richard Fryklund of the *Washington Star*: covering the blockade was harder than covering World War
        II. "In the kind of world we live in the generation of news by the government becomes one weapon in a strained situation.
        The results, in my opinion, justify the means." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 285, 295–96 (the newspaper societies'' resolutions after; "generation of news" becomes
        "management of the news"). Names: Sylvester.'
      tags:
      - name:sylvester-arthur
      - name:fryklund-richard
- add:
    entry:
      id: cal.1962-10-29.missile-crisis-3
      when: Oct. 29
      date: '1962-10-29'
      thread: missile-crisis
      also:
      - soviet-union
      c: 'The ExComm, after a report that an American plane was fired on over a Cuban air base. Kennedy asks Thompson whether
        Zhukov is important; Thompson will see him Friday; Rusk has not been asked. Kennedy: "Pierre must outrank both of
        you. Zhukov is seeing him for lunch on Wednesday." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 280. Names: Kennedy, Thompson, Zhukov, Rusk, Salinger.'
      tags:
      - name:kennedy-john-f
      - name:thompson-llewellyn-e
      - name:zhukov-yuri-a
      - name:rusk-dean
      - name:salinger-pierre
- add:
    entry:
      id: cal.1962-10-31.missile-crisis-settlement
      when: Oct. 31
      date: '1962-10-31'
      thread: missile-crisis-settlement
      also:
      - soviet-union
      c: 'Washington, the Rive Gauche. Salinger lunches with Yuri Zhukov of *Pravda* and Bolshakov. Salinger: the secret missiles
        and the lies to Kennedy a harsh blow; Khrushchev must remove missiles and launchers. Zhukov: neither side must show
        weakness; he sounds out a summit, which Reston thought premature the day before, and complains of State''s report
        that Castro told Latin American Communists to sabotage, and of the film *We''ll Bury You*. No separate treaty with
        East Germany after the elections. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 281–82. Names: Salinger, Zhukov, Bolshakov, Kennedy, Khrushchev, Reston, Castro.'
      tags:
      - name:salinger-pierre
      - name:zhukov-yuri-a
      - name:bolshakov-georgi
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:reston-james
      - name:castro-fidel
- add:
    entry:
      id: cal.1963-04-29.vietnam
      when: Apr. 29
      date: '1963-04-29'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Kennedy alone with John Mecklin, the embassy''s information officer, back from surgery, whom Salinger sends in after
        Don Wilson''s calls: Mecklin''s account of the mounting troubles with the press in Saigon. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 326. Names: Kennedy, Mecklin, Salinger, Wilson.'
      tags:
      - name:kennedy-john-f
      - name:mecklin-john
      - name:salinger-pierre
      - name:wilson-donald-m
- add:
    entry:
      id: cal.1963-04-29.vietnam-2
      when: Apr. 29
      date: '1963-04-29'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'After the Mecklin meeting, Kennedy to Salinger: deeply impressed, but no press policy in Vietnam is likely to succeed.
        After a talk with Bundy he has Salinger draft a new guideline to replace cable 1006, a secret memorandum to go by
        Sylvester to Nolting and Harkins in Honolulu: more leeway in the field, the President consulted, caution in describing
        the situation. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 326. Check: the day of the draft. See [[cal.1963-04-29.vietnam]]. Names: Kennedy, Salinger,
        Bundy, Sylvester, Nolting, Harkins.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:sylvester-arthur
      - name:nolting-frederick-e
      - name:harkins-paul-d
- add:
    entry:
      id: cal.1963-07-08.vietnam-2
      when: July 8
      date: '1963-07-08'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: On the correspondents' telegram Salinger recommends sending Manning to Saigon at once for a survey; Kennedy agrees.
        By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 327. Check: the day (the book dates only the attack, July 7). See [[cal.1963-07-07.press-and-broadcasting]].
        Names: Salinger, Manning, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:manning-robert-j
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-07-08.vietnam-3
      when: July 8
      date: '1963-07-08'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Salinger''s telegram to the correspondents in Saigon, several hours after theirs reached the President: the embassy
        has protested; Manning will be in Saigon the next week. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 327. Check: the day. See [[cal.1963-07-08.vietnam-2]]. Names: Salinger, Manning.'
      tags:
      - name:salinger-pierre
      - name:manning-robert-j
- add:
    entry:
      id: cal.1963-09.elections-1964-7
      when: Sept., late
      date: 1963-09
      thread: elections-1964
      c: 'Air Force One, to California for the dam at Whiskeytown. Kennedy tells Governor Brown he fears a Democratic fight
        for Engle''s seat may lose it. Salinger: "if you guys don''t stop fooling around, I might come out and run myself."
        By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 342. Check: the day ("late in September 1963"). Names: Kennedy, Brown, Engle, Salinger.'
      tags:
      - name:kennedy-john-f
      - name:brown-edmund-g
      - name:engle-clair
      - name:salinger-pierre
      - state:ca
- add:
    entry:
      id: cal.1963-11-23.succession-16
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      also:
      - transition-and-staff
      c: '8 a.m., the White House. Johnson telephones Salinger, asleep in the third-floor quarters: "I want you to stay on
        the job. I need you more than he ever did." Salinger agrees. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 331. Names: Johnson, Salinger.'
      tags:
      - name:salinger-pierre
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1963-11-23.succession-17
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      also:
      - press-and-broadcasting
      c: 8:30 a.m. Johnson and Salinger agree that Salinger takes personal charge of the press arrangements for the funeral
        and that Kilduff moves to the Executive Office Building to help Reedy. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 332 (the briefings twice a day after, split between the funeral and Johnson). Names:
        Johnson, Salinger, Kilduff, Reedy.'
      tags:
      - name:salinger-pierre
      - name:johnson-lyndon-b
      - name:kilduff-malcolm
      - name:reedy-george-e
- add:
    entry:
      id: cal.1963-11.transition-and-staff-2
      when: Nov.
      date: 1963-11
      thread: transition-and-staff
      c: 'Salinger tells Johnson he should replace him with his own man as soon as possible, and names Reedy and Carl Rowan.
        Johnson: "I want you to stay with me as long as you can." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 333. Check: the day ("the first week" of Johnson''s presidency, Nov. 22–29). Names:
        Salinger, Johnson, Reedy, Rowan.'
      tags:
      - name:salinger-pierre
      - name:johnson-lyndon-b
      - name:reedy-george-e
      - name:rowan-carl-t
- add:
    entry:
      id: cal.1963-12.soviet-union
      when: Dec.
      date: 1963-12
      thread: soviet-union
      c: 'Washington. A high official of the Soviet Embassy asks Salinger to lunch the same day: Khrushchev, who knows and
        trusts him, wants his estimate of the new President. Salinger: Johnson is as interested in peace as Kennedy was. The
        official says Khrushchev wept at Kennedy''s death. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 335. Check: the day and month ("shortly after the death of President Kennedy"). Names:
        Salinger, Khrushchev, Johnson, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:khrushchev-nikita-s
      - name:johnson-lyndon-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1964-02-21.elections-1964-primaries
      when: Feb. 21
      date: '1964-02-21'
      thread: elections-1964-primaries
      c: Palm Springs, Calif., night, after the Johnson–López Mateos convocation at UCLA. Friends of Mosk tell Salinger that
        Mosk will not run for the Senate nomination. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 343–44. Names: Mosk, Salinger, Johnson, López Mateos.'
      tags:
      - name:mosk-stanley
      - name:salinger-pierre
      - name:johnson-lyndon-b
      - name:lopez-mateos-adolfo
      - state:ca
      - city:palm-springs
- add:
    entry:
      id: cal.1964-02-22.elections-1964-primaries
      when: Feb. 22
      date: '1964-02-22'
      thread: elections-1964-primaries
      c: California. James Roosevelt withdraws from the Senate race after losing the California Democratic Council's endorsement
        to Cranston. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 344. Check: the day ("the very next day" after Feb. 21). Names: Roosevelt, Cranston.'
      tags:
      - name:roosevelt-james
      - name:cranston-alan
      - state:ca
- add:
    entry:
      id: cal.1964-03-17.elections-1964-primaries-2
      when: Mar. 17
      date: '1964-03-17'
      thread: elections-1964-primaries
      also:
      - robert-kennedy
      c: 'Salinger tells Robert Kennedy and O''Donnell he will resign once a California lawyer clears his eligibility for
        the Senate primary. Kennedy: "Run only if you can win." O''Donnell: "an interesting idea, but I don''t think you''ve
        got the guts." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 345. Names: Salinger, Robert Kennedy, O''Donnell.'
      tags:
      - name:salinger-pierre
      - name:kennedy-robert-f
      - name:odonnell-kenneth-p
- add:
    entry:
      id: cal.1964-03-18.elections-1964-primaries
      when: Mar. 18
      date: '1964-03-18'
      thread: elections-1964-primaries
      c: 'Washington, the Sans Souci, at lunch with Bob Six and Harding Lawrence of Continental Air Lines. The California
        lawyer telephones: Salinger is "entirely eligible" to run. Salinger: "All right, I''m running." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 345–46. Check: the day ("the next day" after Mar. 17; the calendar has the resignation
        Mar. 19). See [[cal.1964-03-17.elections-1964-primaries-2]]. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1964-03-18.elections-1964-primaries-4
      when: Mar. 18
      date: '1964-03-18'
      thread: elections-1964-primaries
      c: 'The Sans Souci, leaving. Salinger to O''Donnell, lunching with his wife: "You said I didn''t have the guts. I just
        want you to know that I''m on my way to the President''s office to resign." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 346. Check: the day. See [[cal.1964-03-18.elections-1964-primaries]]. Names: Salinger,
        O''Donnell.'
      tags:
      - name:salinger-pierre
      - name:odonnell-kenneth-p
- add:
    entry:
      id: cal.1964-03-18.elections-1964-primaries-2
      when: Mar. 18
      date: '1964-03-18'
      thread: elections-1964-primaries
      c: 'Justice Goldberg, telephoned by Salinger, is aghast: a Virginia voter can hardly run for the Senate from California.
        A half hour later, after a clerk looks into it, he calls back: Salinger is eligible, but if the case reaches the Supreme
        Court Goldberg must disqualify himself. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 346. Check: the day. Names: Salinger, Goldberg.'
      tags:
      - name:salinger-pierre
      - name:goldberg-arthur-j
- add:
    entry:
      id: cal.1964-03-18.elections-1964-primaries-3
      when: Mar. 18
      date: '1964-03-18'
      thread: elections-1964-primaries
      c: 'Salinger''s last call from the White House, to Governor Brown, who has come out for Cranston. Brown is dead set
        against him: too late, and a primary fight drains Democratic money. Salinger asks him only to say he favors Cranston;
        Brown: "If I''m for somebody, I''m not going to stand on the sidelines." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 348. Check: the day. Names: Salinger, Brown, Cranston.'
      tags:
      - name:salinger-pierre
      - name:brown-edmund-g
      - name:cranston-alan
- add:
    entry:
      id: cal.1964-03-19.transition-and-staff-3
      when: Mar. 19
      date: '1964-03-19'
      thread: transition-and-staff
      c: 'Hatcher, the associate press secretary, reached by telephone at Newark Airport: "Announce my resignation at the
        same time you announce yours. I''m going back to California with you." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 346. Check: the day (Salinger''s resignation, by his sequence the day after Mar. 17).
        See [[cal.1964-03-19.transition-and-staff]]. Names: Hatcher, Salinger.'
      tags:
      - name:hatcher-andrew-t
      - name:salinger-pierre
- add:
    entry:
      id: cal.1964-03-19.goldwater
      when: Mar. 19
      date: '1964-03-19'
      thread: goldwater
      also:
      - elections-1964-primaries
      c: 'Los Angeles, Goldwater''s press conference. Told by Tom Wicker of the *New York Times* that Salinger has resigned
        to run for the Senate: "I think Pierre would make a good senator." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 348. Check: the day (the day of Salinger''s resignation). See [[cal.1964-03-19.transition-and-staff]].
        Names: Goldwater, Wicker, Salinger.'
      tags:
      - name:goldwater-barry-m
      - name:wicker-tom
      - name:salinger-pierre
      - city:los-angeles
      - state:ca
- add:
    entry:
      id: cal.1964-03-19.press-and-broadcasting
      when: Mar. 19
      date: '1964-03-19'
      thread: press-and-broadcasting
      c: '4 p.m. Merriman Smith leads a delegation of correspondents into Salinger''s office to protest what they take for
        a violation of the White House press corps'' rights. Salinger: "Give me just two hours and I''ll take care of the
        problem for you." He resigns at 6. By Salinger''s account; the grievance is not given.'
      n: '[[w.salinger-with-kennedy]], 125. Check: the day (the book dates his last day Mar. 19 here, but its account at 345–47
        puts the resignation the day after Mar. 17). See [[cal.1964-03-19.transition-and-staff]]. Names: Salinger.'
      tags:
      - name:smith-merriman
      - name:salinger-pierre
- add:
    entry:
      id: cal.1964-03-19.elections-1964-primaries
      when: Mar. 19
      date: '1964-03-19'
      thread: elections-1964-primaries
      also:
      - elections-1964
      c: San Francisco, the Fairmont, after a 4 a.m. arrival. With Don Bradley and his brother Herbert, Salinger in ten hours
        gets the sixty-five signatures on his nominating petition and $25,000 in loans from five friends, not refundable if
        the court rules him out. Goldstein and Kopp are to argue his eligibility without fee; 7,000 posters are ordered. By
        Salinger's account.
      n: '[[w.salinger-with-kennedy]], 348–49. Check: the day (the filing deadline in the book is Mar. 19). Names: Salinger.'
      tags:
      - name:salinger-pierre
      - name:bradley-don
      - city:san-francisco
      - state:ca
- add:
    entry:
      id: cal.1964-03.elections-1964-primaries-3
      when: Mar., after the 19th
      date: 1964-03
      thread: elections-1964-primaries
      c: 'Secretary of State Frank Jordan refuses to put Salinger on the ballot: not ninety days a member of the California
        Democratic Party. Goldstein and Kopp ask the State Supreme Court for a writ of mandamus, arguing the Democratic Party
        is national, and produce his Virginia party records. On the eighth day the court rules he complied "substantially"
        and orders the name placed on the ballot. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 350–51. Check: the day (the book gives "the eighth day" after the filing), and whether
        the refusal and the ruling are two entries.'
      tags:
      - name:salinger-pierre
      - name:jordan-frank-m
- add:
    entry:
      id: cal.1964-04-29.elections-1964-primaries
      when: Apr. 29–30
      date: '1964-04-29'
      thread: elections-1964-primaries
      c: A day or two after Engle's withdrawal without an endorsement, George Dixon and his wife and Jerry Waldie speak to
        Mrs. Engle for Salinger; she says on television that he is her choice to succeed her husband. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 353. Check: the day (the book gives no day for the withdrawal, and tells it after the
        debate of mid-May; [[cal.1964-06-02.elections-1964-ca]] has the withdrawal Apr. 28). Names: Salinger, Engle, Waldie.'
      tags:
      - name:salinger-pierre
      - name:engle-clair
      - name:engle-lucretia
      - name:dixon-george
      - name:waldie-jerome-r
- add:
    entry:
      id: cal.1964-05.elections-1964-primaries-8
      when: May, mid
      date: 1964-05
      thread: elections-1964-primaries
      c: San Diego, NBC's affiliate KOGO, carried statewide. Salinger and Cranston debate before Howard K. Smith and a panel
        of reporters, who dwell on the carpetbagger charge and on Cranston's soliciting of the inheritance tax appraisers.
        By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 352–53. Check: the day ("mid-May"). Names: Salinger, Cranston, Howard K. Smith.'
      tags:
      - name:salinger-pierre
      - name:cranston-alan
      - name:smith-howard-k
      - city:san-diego
      - state:ca
- add:
    entry:
      id: cal.1964-05-31.elections-1964-primaries-2
      when: May 31
      date: '1964-05-31'
      thread: elections-1964-primaries
      c: 'Muchmore, his pollster, to Salinger: he will win by between 150,000 and 200,000 votes. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 353. Check: the day ("two days before the election" of June 2). See [[cal.1964-05.elections-1964-primaries-8]].
        Names: Salinger.'
      tags:
      - name:muchmore-don
      - name:salinger-pierre
- add:
    entry:
      id: cal.1964-08-03.vietnam-6
      when: Aug. 3
      date: '1964-08-03'
      thread: vietnam
      also:
      - congress
      c: Saigon. Salinger, the Democratic nominee for the Senate from California, on a world tour for *Look*, is in Premier
        Khánh's office when a call from Washington tells him that Engle is dead. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 356. Names: Salinger, Nguyễn Khánh, Engle.'
      tags:
      - name:salinger-pierre
      - name:nguyen-khanh
      - name:engle-clair
- add:
    entry:
      id: cal.1964-08-27.elections-1964-atlantic-city-2
      when: Aug. 27
      date: '1964-08-27'
      thread: elections-1964-atlantic-city
      also:
      - elections-1964-vice-presidency
      c: Atlantic City. At the request of Johnson and Humphrey, Salinger, not yet a qualified California voter and so no delegate,
        seconds Humphrey's nomination for Vice President. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 358. Check: the day ("the last week in August"). Names: Salinger, Johnson, Humphrey.'
      tags:
      - name:salinger-pierre
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1964-08.elections-1964-freedom-democrats-2
      when: Aug., last week
      date: 1964-08
      thread: elections-1964-freedom-democrats
      c: Atlantic City, the California caucus. Working under Humphrey on the Mississippi compromise, Salinger argues against
        seating the full Freedom delegation, which he thinks would provoke a walkout of the white southern delegations. By
        Salinger's account.
      n: '[[w.salinger-with-kennedy]], 358 (he holds the token seating and the rule against future discrimination the most
        that could be won). Check: the day. Names: Salinger, Humphrey.'
      tags:
      - name:salinger-pierre
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1964-10-24.elections-1964
      when: Oct. 24
      date: '1964-10-24'
      thread: elections-1964
      c: 'Muchmore to Salinger: Murphy is ahead, and Salinger a certain loser unless he takes almost all the undecided vote;
        the 5 percent undecided are 4 to 1 for Proposition 14. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 361. Check: the day ("ten days before the election"). Names: Salinger, Murphy.'
      tags:
      - name:muchmore-don
      - name:salinger-pierre
      - name:murphy-george
      - state:ca
- add:
    entry:
      id: cal.1964-11-03.elections-1964-6
      when: Nov. 3
      date: '1964-11-03'
      thread: elections-1964
      c: 'Election night, late. Robert Kennedy, elected in New York, telephones Salinger, beaten by Murphy: "My brother would
        have been proud of the way you lost." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 362. Names: Robert Kennedy, Salinger, Murphy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-robert-f
      - name:murphy-george
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-diplomacy-3
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis-diplomacy
      c: '7:35 p.m., the Statler Hotel coffee shop. Scali to Fomin (Feklisov): the United States government "sees real possibilities
        in this," the word from "the highest sources." Fomin asks whether UN inspectors could also check the American bases
        in Florida and nearby countries; Scali: a terrible complication. Fomin will report at once to the highest Soviet sources
        and to Zorin. Twenty minutes. By Scali''s memorandum, printed by Salinger.'
      n: '[[w.salinger-with-kennedy]], 275–76 (Scali''s second memorandum). See [[cal.1962-10-26.missile-crisis-diplomacy-2]].
        Names: Scali, Feklisov, Zorin.'
      tags:
      - name:scali-john-a
      - name:feklisov-aleksandr
      - name:zorin-valerian
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-diplomacy-2
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis-diplomacy
      c: 'After the second letter, Scali telephones Fomin (Feklisov) at 4 p.m. and meets him a quarter hour later at the Statler.
        Scali: "a stinking double-cross"; the Turkish formula "completely, totally, utterly and perpetually unacceptable."
        Fomin: the cable traffic delayed Moscow''s answer; he and Ambassador Dobrynin await a reply. By Scali''s memorandum
        to Rusk, printed by Salinger.'
      n: '[[w.salinger-with-kennedy]], 277–78. See [[cal.1962-10-27.missile-crisis-2]]. Names: Scali, Feklisov, Dobrynin,
        Rusk.'
      tags:
      - name:scali-john-a
      - name:feklisov-aleksandr
      - name:dobrynin-anatoly
      - name:rusk-dean
- add:
    entry:
      id: cal.1962-10-28.missile-crisis-diplomacy-4
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis-diplomacy
      c: '12:55 p.m. Fomin (Feklisov) to Scali: "I am instructed to say that the information you provided yesterday was very
        helpful to the Chairman in making up his mind quickly." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 278. See [[cal.1962-10-28.missile-crisis]]. Names: Feklisov, Scali.'
      tags:
      - name:feklisov-aleksandr
      - name:scali-john-a
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-10-29.missile-crisis-diplomacy
      when: Oct. 29
      date: '1962-10-29'
      thread: missile-crisis-diplomacy
      c: 'Scali with Fomin (Feklisov) again, at Kennedy''s suggestion. Fomin: Castro "a very hard person to control"; is the
        time right for a summit? Rusk should talk with Dobrynin three times a day. Scali: the President is determined to try
        again on disarmament; no wish to humiliate Khrushchev. By Scali''s report, printed by Salinger.'
      n: '[[w.salinger-with-kennedy]], 278–79. Names: Scali, Feklisov, Kennedy, Castro, Rusk, Dobrynin, Khrushchev.'
      tags:
      - name:scali-john-a
      - name:feklisov-aleksandr
      - name:kennedy-john-f
      - name:castro-fidel
      - name:rusk-dean
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-11-03.missile-crisis-settlement
      when: Nov. 3
      date: '1962-11-03'
      thread: missile-crisis-settlement
      also:
      - missile-crisis-diplomacy
      c: 'Scali with Fomin (Feklisov). Fomin: the United States must be "patient" with Soviet efforts on Castro and make "reciprocal
        concessions," relaxing the blockade by degrees; Castro refuses inspection on his territory, so inspect aboard the
        ships "thirteen miles out at sea"; the SAM sites stay. Robert Kennedy "the worst of the whole lot." By Scali''s memorandum,
        printed by Salinger.'
      n: '[[w.salinger-with-kennedy]], 279. Names: Scali, Feklisov, Castro, Robert Kennedy.'
      tags:
      - name:scali-john-a
      - name:feklisov-aleksandr
      - name:castro-fidel
      - name:kennedy-robert-f
- cite:
    id: cal.1962-02-10.berlin-and-vienna
    item: '[[w.salinger-with-kennedy]], 122 (the exchange of Abel for Powers on the Glienicker Bridge, 8:16 a.m. in Berlin;
      not Pryor or Donovan)'
    units: A
- cite:
    id: cal.1962-02-14.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 116 (the hour-long tour; CBS''s proposal, NBC and ABC demand tapes; Kennedy overrules
      Salinger, so CBS shares it; not the audience)'
    units: '?'
- variant:
    id: cal.1962-02-14.press-and-broadcasting
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Mrs. Kennedy''s hour-long tour was CBS''s, and at Kennedy''s ruling shared with NBC and ABC, who had
      demanded it for simultaneous telecast on all three networks'
    at: '116'
- cite:
    id: cal.1962-12-17.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 114–15 (the hour in his own office with Lawrence of ABC, Herman of CBS and Vanocur
      of NBC, on all networks, evening; Lawrence''s question and the answer; the title given as "A Conversation with the President")'
    units: B
- cite:
    id: cal.1963-09-02.vietnam
    item: '[[w.salinger-with-kennedy]], 114 (the exclusive for CBS''s change to a thirty-minute news; half an hour filmed,
      mostly on Vietnam, cut to twelve minutes; by Salinger the praise of Diem was cut; not the place or the words)'
    units: '?'
- cite:
    id: cal.1963-09-09.vietnam
    item: '[[w.salinger-with-kennedy]], 114 (the exclusive for NBC''s Huntley-Brinkley show when it went to thirty minutes,
      cut to fit, Kennedy insisting on the White House''s final approval of what was shown, and NBC agreeing; not the words)'
    units: A
- cite:
    id: cal.1962-05.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 118 (Kennedy tells Salinger several times to cancel the subscription, then orders
      McNally; the story hits the papers; for months copies bootlegged; after the Estes and stockpile stories; not the month)'
    units: A
- cite:
    id: cal.1962-01-18.program
    item: '[[w.salinger-with-kennedy]], 207, 209 (the formal dinner for Stravinsky''s eightieth birthday; after most guests
      leave, Kennedy has Salinger play for Stravinsky, who walks out halfway; Bernstein stays; not Field or Kennedy''s words)'
    units: A
- cite:
    id: cal.1962-01-30.soviet-union
    item: '[[w.salinger-with-kennedy]], 213–14 (the lunch at the White House for the Adzhubeis, Mrs. Kennedy and Rada; Bolshakov
      translating; Salinger present; Kennedy tells Adzhubei Salinger will visit in April; the talk after the lunch, in the
      Oval Room, on Berlin, Southeast Asia and nuclear tests; not Cuba)'
    units: A
- variant:
    id: cal.1962-01-30.soviet-union
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: after the lunch, Kennedy takes Adzhubei and Bolshakov to the Oval Room on the second floor: Berlin,
      Southeast Asia, nuclear testing'
    at: 213–14
- cite:
    id: cal.1962-03.soviet-union
    item: '[[w.salinger-with-kennedy]], 216 (Bolshakov to Salinger, Apr. 5: his government calls off the exchange, because
      of Kennedy''s decision to resume nuclear tests; not Khrushchev by name, Gromyko, the words or the inspections)'
    units: '?'
- cite:
    id: cal.1963-02.defense
    item: '[[w.salinger-with-kennedy]], 239–40 (Kennedy''s memo to Shoup: send Roosevelt''s letter back as his own discovery;
      he will ask Salinger for a report on the staff''s fitness; Shoup replies with a hike from Camp Lejeune; "the first week
      in February 1963"; not the twenty hours)'
    units: B
- cite:
    id: cal.1963-02.defense-3
    item: '[[w.salinger-with-kennedy]], 245–47 (the Council''s statement at 11 and Salinger''s noon briefing, written with
      Sorensen, cancelling the hike set for Friday on the C&O Canal: "I may be plucky but I am not stupid"; the day Tuesday,
      Feb. 12, by the book''s sequence and Shoup''s "Black Tuesday"; not the papers'' speculation)'
    units: '?'
- variant:
    id: cal.1963-02.defense-3
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: "I may be plucky but I am not stupid"; the President, told only that he would make a statement, "hasn''t
      seen this statement in this form"'
    at: 246–47
- cite:
    id: cal.1963-02.defense-4
    item: '[[w.salinger-with-kennedy]], 243 (on "that same Sunday," five days before Feb. 15, Robert Kennedy sets out on a
      fifty-mile hike to Camp David with Guthman and Hackett; only he goes the distance; not the time)'
    units: '?'
- cite:
    id: cal.1962-10-19.missile-crisis-warnings
    item: '[[w.salinger-with-kennedy]], 250–51 (Phillips of State warns of the Allen and Scott story; Kent of the *Sun-Times*
      asks about the 18th Parachute Corps standing by for a jump on Cuba; Salinger goes to the President in his suite, O''Donnell
      with him; Kennedy has O''Donnell call McNamara "to straighten out Allen and Scott"; not that O''Donnell does)'
    units: A, B
- variant:
    id: cal.1962-10-19.missile-crisis-warnings
    unit: C
    witness: w.salinger-with-kennedy
    reads: 'Salinger: "You call Kent right back," and "tell him he''s wrong. We are not planning to invade Cuba."'
    at: '251'
- cite:
    id: cal.1962-10-19.missile-crisis-warnings-2
    item: '[[w.salinger-with-kennedy]], 251 (Salinger finds O''Donnell alone in the suite after Kennedy has left for a $100-a-plate
      Democratic dinner at McCormick Place, Yates not named: "You''re going to have to cut me in pretty quick")'
    units: B
- variant:
    id: cal.1962-10-19.missile-crisis-warnings-2
    unit: C
    witness: w.salinger-with-kennedy
    reads: 'Salinger: O''Donnell: "The President may have to develop a cold somewhere along the line tomorrow. If he does,
      we''ll cancel out the rest of the trip and head back to Washington."'
    at: '251'
- cite:
    id: cal.1962-10-20.missile-crisis
    item: '[[w.salinger-with-kennedy]], 252 (the "medical bulletin" of a temperature and cold; the flight from Chicago at
      11 a.m., at the White House 1:30; not the choice of the quarantine)'
    units: A
- cite:
    id: cal.1962-10-21.missile-crisis-3
    item: '[[w.salinger-with-kennedy]], 258–59 (the meeting Salinger attends at Kennedy''s order: the summit proposal deleted
      from the address; "quarantine" chosen over "blockade," with no speaker named; Acheson to brief de Gaulle and NATO, Bruce
      Macmillan, Dowling Adenauer; Stevenson''s case to the UN; Don Wilson''s plan for ten Atlantic radio stations broadcasting
      to Cuba by night approved; not the draft, Anderson or the inspection)'
    units: E
- variant:
    id: cal.1962-10-21.missile-crisis-3
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: an ExComm session in the Cabinet Room "that morning," Salinger present, "within the hour" of his talk
      with Kennedy about Mass; he is home by four that afternoon'
    at: 258–60
- cite:
    id: cal.1962-10-22.missile-crisis-17
    item: '[[w.salinger-with-kennedy]], 262 (at exactly noon Salinger asks Fleming of ABC, for the networks, for time at 7
      p.m. on a subject of "the highest national urgency"; the announcement at the briefing just after; the answer "all networks,
      all live")'
    units: B
- cite:
    id: cal.1962-10-25.republican-party-congress
    item: '[[w.salinger-with-kennedy]], 292–93 (Van Zandt, after a briefing in New York, announces the Bucharest story at
      a press conference, on the wires at 11, forty-five minutes before Defense; Kennedy outraged that he was given it; not
      Hughes or Idlewild)'
    units: '?'
- variant:
    id: cal.1962-10-25.republican-party-congress
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: ExComm had ordered the Bucharest news released through Defense at the end of the morning, with the news
      that a dozen Soviet ships had turned back; Van Zandt announced it forty-five minutes early'
    at: 292–93
- cite:
    id: cal.1962-10-26.missile-crisis-diplomacy-2
    item: '[[w.salinger-with-kennedy]], 274–75 (Rusk brings Scali, with Fomin''s proposal, to the White House; Salinger, in
      agitation, in the back corridor near the Cabinet Room: "What the hell are you doing here?"; Kennedy instructs Scali
      to convey that it is an acceptable basis, without attributing it to him; not the words to Scali)'
    units: B, E
- variant:
    id: cal.1962-10-26.missile-crisis-diplomacy-2
    unit: D
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Rusk: "It''s OK, Pierre, I brought him."'
    at: '275'
- variant:
    id: cal.1962-10-26.missile-crisis-diplomacy-2
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: the back corridor near the Cabinet Room'
    at: '274'
- cite:
    id: cal.1962-02-21.vietnam
    item: '[[w.salinger-with-kennedy]], 322–23 (the press guidance of Feb. 21, 1962, "Cable 1006," drafted by Rowan with Cottrell
      for State, Defense and USIA: cooperation with the press, an appeal to the correspondents'' good faith, the war "a Vietnamese
      one" with Americans only training, advising and supporting; not the text, the Ambassador''s decision on missions or
      the bans)'
    units: '?'
- cite:
    id: cal.1963-07-07.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 327 (the telegram to Kennedy signed by Halberstam, Browne, Sheehan and Kalisher: nine
      newsmen attacked by plainclothes police at a pagoda, one knocked down and kicked, a camera smashed; they ask him to
      protest)'
    units: D
- cite:
    id: cal.1963-12-07.economy
    item: '[[w.salinger-with-kennedy]], 337 (the first press conference, impromptu: at the end of Salinger''s morning briefing
      he announces that the President would like the reporters in for coffee; twenty or thirty regulars; radio and television
      not told in time)'
    units: A
- cite:
    id: cal.1963-12-29.europe-and-the-alliance-3
    item: '[[w.salinger-with-kennedy]], 336 (the barbecue in the gym of Stonewall High School for Erhard; Van Cliburn plays
      Chopin to some six hundred; then Johnson over the loudspeaker calls Salinger to the piano, Erhard shakes his hand, and
      Johnson: "I don''t know what I would have done without him, night and day, over this past month")'
    units: B
- check:
    id: cal.1963-12-29.europe-and-the-alliance-3
    text: 'Check: the day: [[w.salinger-with-kennedy]], 335, puts Erhard''s visit to the Ranch "shortly before Christmas in
      1963."'
- cite:
    id: cal.1964-01-10.latin-america-panama
    item: '[[w.salinger-with-kennedy]], 334–35 (Velarde, Chiari''s press secretary, asks that the two presidents talk; Johnson
      will renegotiate the treaty, not at gunpoint, once order is restored; the call set up through Salinger; the page places
      it "late in 1964")'
    units: '?'
- variant:
    id: cal.1964-01-10.latin-america-panama
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: neither head of state is to initiate the call; Velarde telephones Salinger from Chiari''s office at
      an agreed time, with Salinger in Johnson''s office, and each hands the telephone to his president'
    at: 334–35
- check:
    id: cal.1964-01-10.latin-america-panama
    text: 'Check: the day: [[w.salinger-with-kennedy]], 334–35, puts the call "late in 1964," after Salinger left the White
      House on Mar. 19, 1964.'
- cite:
    id: cal.1964-02-29.defense
    item: '[[w.salinger-with-kennedy]], 337–38 (Johnson''s first live television press conference, in the International Conference
      Room at State, behind a desk; not the business)'
    units: A
- cite:
    id: cal.1964-03-15.vietnam
    item: '[[w.salinger-with-kennedy]], 338 (Salinger''s advice that Johnson go on television for an hour with leading network
      reporters, as Kennedy did in December 1962; it "went off on March 15, 1964"; not the words or the taping)'
    units: '?'
- cite:
    id: cal.1964-03.robert-kennedy
    item: '[[w.salinger-with-kennedy]], 345 (that evening Salinger calls on Jacqueline Kennedy: "I know you''ll win," and
      Robert Kennedy comes by later: "you can count on my help"; not the three weeks)'
    units: '?'
- check:
    id: cal.1964-03.robert-kennedy
    text: 'Check: the day: [[w.salinger-with-kennedy]], 345, has the talks with Mrs. Kennedy and Robert Kennedy on the evening
      of Mar. 17, a Tuesday.'
- cite:
    id: cal.1964-03-19.transition-and-staff
    item: '[[w.salinger-with-kennedy]], 345–47 (the lawyer''s call at lunch; Salinger tells Jenkins and Moyers; Johnson sees
      him at 3:30; the letter of resignation at 5 and Johnson''s letter accepting it; Reedy named at once; Johnson gives him
      a filing fee in cash, Salinger saying $450 and Johnson hearing $250)'
    units: '?'
- variant:
    id: cal.1964-03-19.transition-and-staff
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: the lawyer''s call at lunch "the next day" after Mar. 17; Johnson sees him at 3:30 p.m. and he hands
      in the letter at 5 (345–47); elsewhere his "last day" is "March 19, 1964," resigning at 6 p.m. (125)'
    at: 125, 345–47
- variant:
    id: cal.1964-03-19.transition-and-staff
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: "The deadline for filing nominating petitions for the primary was March 19"'
    at: '345'
- cite:
    id: cal.1964-03-19.transition-and-staff-2
    item: '[[w.salinger-with-kennedy]], 347 (Johnson asks Salinger, then Jenkins and O''Donnell: Reedy or Valenti; all say
      Reedy, in the hospital; "He''s the new Press Secretary as of now")'
    units: '?'
- variant:
    id: cal.1964-03-19.transition-and-staff-2
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Johnson tells Jenkins to call Reedy at the hospital: "Tell him to jump into his clothes and get over
      here. He''s the new Press Secretary as of now."'
    at: '347'
- cite:
    id: cal.1964-06-02.elections-1964-ca
    item: '[[w.salinger-with-kennedy]], 353 (the primary on June 2; Salinger''s margin; Murphy the Republican nominee over
      Kaiser "in a breeze"; not the votes)'
    units: A
- variant:
    id: cal.1964-06-02.elections-1964-ca
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: "My final margin on June 2, 1964, was 174,000."'
    at: '353'
- cite:
    id: cal.1964-08-04.congress
    item: '[[w.salinger-with-kennedy]], 356–57 (Salinger hears of Engle''s death in Saigon on Aug. 3; Brown''s intention to
      appoint him at once; the midnight charter flight from California with more than a hundred Democrats on Aug. 4; the oath
      from Hayden on Aug. 5 after more than two hours'' debate led by Dirksen; Kuchel for him; seated conditionally pending
      the Rules Committee, which voted the next week to seat him; not the vote or the day of Engle''s death)'
    units: B
- cite:
    id: cal.1964-11-03.elections-1964-2
    item: '[[w.salinger-with-kennedy]], 361 (Murphy beats Salinger by 216,643 votes; Johnson carries California by 1,292,769;
      not the other races)'
    units: E
- cite:
    id: cal.1964-11-03.cities-and-housing
    item: '[[w.salinger-with-kennedy]], 361 (Proposition 14 carried by 2,130,713; Salinger spoke against it in every appearance;
      Murphy took no position)'
    units: '?'
- cite:
    id: cal.1962-10-22.missile-crisis-4
    item: '[[w.salinger-with-kennedy]], 264 (at 5 p.m. the leaders shown the photographs and told of the quarantine; Russell
      argues for an invasion, Fulbright with him; Kennedy will not change; not "too slow and too risky")'
    units: A, C
- cite:
    id: cal.1962-10-22.missile-crisis-13
    item: '[[w.salinger-with-kennedy]], 263–64 (Kennedy''s long-standing appointment with Obote, forty-five minutes, from
      trade to American aid to African schools, the Cabinet kept waiting; he takes him to the door through the reporters:
      "It has been a very interesting day"; not Rusk or Rhodesia)'
    units: C
- cite:
    id: cal.1962-10-23.missile-crisis-13
    item: '[[w.salinger-with-kennedy]], 270 (Salinger''s notes, Tuesday morning: Kennedy approves the plans for the Proclamation
      of Interdiction; consents to retaliatory air strikes on Cuba if an American plane is shot down; not the hour, the tours,
      POL or the flights)'
    units: '?'
- variant:
    id: cal.1962-10-23.missile-crisis-13
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Tuesday afternoon the ExComm approves the proclamation''s language and decides to issue it that night,
      "to take effect at 10 A.M. the next morning"'
    at: '270'
- cite:
    id: cal.1962-10-23.missile-crisis-15
    item: '[[w.salinger-with-kennedy]], 270 (Salinger''s notes, Tuesday afternoon: the ExComm approves the proclamation''s
      language, to issue that night, the cargoes limited to missiles and bombers; McNamara: at least twenty-five Russian ships
      en route; not the hour or the rest)'
    units: C
- cite:
    id: cal.1962-10-25.missile-crisis-7
    item: '[[w.salinger-with-kennedy]], 271, 292 (Salinger''s notes, Thursday: Kennedy orders the Navy to pass the *Bucharest*
      without search, orders night reconnaissance flights over Cuba and approves missile fuel as contraband; the ExComm, hearing
      the report in the morning, orders the news released through Defense at the end of the morning; not USIA, the bloc ship
      or U Thant)'
    units: '?'
- cite:
    id: cal.1962-10-25.missile-crisis-8
    item: '[[w.salinger-with-kennedy]], 271, 292 (the *Bucharest* intercepted at eight in the morning and, by the President''s
      order, let through without search, no contraband aboard; not at dawn, nor the passenger ship or Havana)'
    units: '?'
- cite:
    id: cal.1962-10-26.missile-crisis-3
    item: '[[w.salinger-with-kennedy]], 271 (Defense announces the first boarding and search, of the *Marucla*, of Panamanian
      registry under Soviet charter; no resistance; by the destroyer *Joseph P. Kennedy, Jr.*; not the reason for choosing
      her)'
    units: '?'
- cite:
    id: cal.1962-10-26.missile-crisis-2
    item: '[[w.salinger-with-kennedy]], 271, 274 (Fomin, "known to be the chief Russian intelligence agent in Washington,"
      at a lunch he sought urgently; Scali''s first memorandum to Hilsman: the bases dismantled under UN supervision and Castro''s
      pledge for an American pledge not to invade)'
    units: A
- cite:
    id: cal.1962-10-27.missile-crisis
    item: '[[w.salinger-with-kennedy]], 272–73 (a U-2 missing over Cuba, shot down, the pilot Major Rudolf Anderson, Jr.,
      certain only Sunday morning; Rusk announces Saturday evening that a U-2 from Alaska strayed over the Chukotski Peninsula,
      Soviet fighters rising; not "Black Saturday" or Robert Kennedy and Dobrynin)'
    units: B, C
- cite:
    id: cal.1962-10-27.missile-crisis-3
    item: '[[w.salinger-with-kennedy]], 272 (the reply released directly to the press at 8 p.m. to hasten its receipt in Moscow,
      the words quoted; on Robert Kennedy''s suggestion, the second letter ignored; not the work on the bases)'
    units: A, B
- cite:
    id: cal.1962-10-28.missile-crisis
    item: '[[w.salinger-with-kennedy]], 273 (Salinger hears the radio flash driving to work: Khrushchev agrees to withdraw
      the missiles and tear down the sites for a guarantee against invasion; not Castro)'
    units: A
- cite:
    id: cal.1962-10-28.missile-crisis-6
    item: '[[w.salinger-with-kennedy]], 273 (the last meeting, drafting the reply hailing the "statesmanlike decision"; the
      President joins in no triumph; to an adviser who calls him "ten feet tall": "this will wear off in about a week"; not
      the hour, Bundy or the business)'
    units: '?'
