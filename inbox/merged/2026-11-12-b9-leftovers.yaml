      n: '[[w.zelizer-fierce-urgency-of-now]], 199–200 (the House, 307 to 116, July 27; the conference; it dates the Senate''s
        70 to 24 July 27 too); [[w.bernstein-guns-or-butter]], 176 (six meetings; at least 95 percent of the Senate amendments
        cut); [[w.dallek-flawed-giant]], 209 (the bill through "some hard bargaining in a conference committee," after over
        500 minor Senate amendments; not the House''s vote; Congress''s passage dated July 28, the Senate''s day). To check:
        Larry O''Brien, interview by Michael Gillette, July 24, 1986, XI, 28, LBJ Library (cited by [[w.zelizer-fierce-urgency-of-now]],
        199 n.72). See [[cal.1965-07-09.medicare]]. Names: Mills. Check: Dallek gives July 28 for Congress''s passage (209).
        Check: the Senate agreed to the conference report, 70–24, on July 28 ([Voteview RS0890174](https://voteview.com/rollcall/RS0890174)),
        the House, 307–116, on July 27 ([Voteview RH0890097](https://voteview.com/rollcall/RH0890097)); Dallek''s July 28
        (209) is the Senate''s day.'
