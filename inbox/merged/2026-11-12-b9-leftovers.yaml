        steal the election from me." He dictates a statement, "As President, I would sever all relations with the South Vietnamese
        and leave them on their own," and holds it back.'
      n: '[[w.solberg-hubert-humphrey]], 400; [[w.white-making-of-the-president-1969]], 381 (Humphrey will not make it public;
        Nixon, he holds, knew nothing of it). To check: Ted Van Dyk, interview; Edgar Berman, diary, Nov. 3, 1968 (cited by
        [[w.solberg-hubert-humphrey]], 400, its note). Names: Humphrey.'
      src:
        c: f45e8247
