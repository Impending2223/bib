# The leftovers of the batch-9 audits (Nov. 12, 2026). New ids claimed in inbox/new-entries.tsv under this patch.
patch: 2026-11-12-b9-leftovers
by: 'Claude (the leftovers of the batch-9 audits, Nov. 12, 2026: the King conference of Dec. 23, 1963 and the two memoranda;
  the Chennault flight and the Los Angeles statement; Medicare, July 27, 1965; India, Feb. 4, 1966; the bundles of May 6,
  1965, May 21, 1966 and Dec. 17, 1965)'
ops:
- edit:
    id: cal.1963-12.king
    base: d1d9f8fa
    set:
      when: Dec. 23
      date: '1963-12-23'
      c: Seven FBI officials on King, nine hours at headquarters, two of them agents from Atlanta; Sullivan in the chair;
        Nichols one of the two. How to gather evidence of his private life, to expose him as "an immoral opportunist" and
        a "clerical fraud." Sullivan proposes microphones in his hotel rooms. The taps on his home and office in place since
        November.
      n: '[S. Rep. No. 94-755, Book III, 133 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=147)
        (the conference of Dec. 23, 1963, nine hours, at headquarters: Sullivan, Baumgardner, three other headquarters officials,
        two agents of the Atlanta office; the twenty-one proposals). [[w.garrow-bearing-the-cross]], 310 (a "mid-December
        conference"; the evidence of his private life, "an immoral opportunist" and "clerical fraud"; Sullivan''s microphones;
        the taps since November); [[w.branch-pillar-of-fire]], 195–97 (Monday, Dec. 23, seven officials in Baumgardner''s
        office, all day; Nichols one of the two Atlanta agents; the agenda; the plans for microphones in his hotel rooms;
        Sullivan''s report, "an immoral opportunist"; not "clerical fraud"); [[w.kotz-judgment-days]], 83–84 (Dec. 23, 1963,
        seven officials, nine hours at headquarters, Sullivan in the chair; field agents from Atlanta, not their number; "clerical
        fraud" and "an immoral opportunist," by Sullivan''s report); [[w.schlesinger-robert-kennedy-and-his]], 363 (the nine-hour
        session of Dec. 23, 1963); [[w.branch-parting-the-waters]], 919 (Sullivan''s nine-hour "war council," Nichols among
        those summoned; no day). Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]],
        627). To check: "Questions to Be Explored at Conference 12/23/63 re Communist Influence in Racial Matters," House
        Select Committee on Assassinations, *Hearings*, vol. 6, 159–61 (cited by [[w.kotz-judgment-days]], 83 n.75); Sullivan
        to Belmont, Dec. 24, 1963, FBI file 100-3-116-684; Director to Attorney General, Jan. 17, 1964, FBI file 100-3-116
        (cited by [[w.garrow-bearing-the-cross]], 310 n.19); Baumgardner to Sullivan, Dec. 19, 1963, FK-NR, Sullivan to Belmont,
        December 24, 1963, FK-NR (cited by [[w.branch-pillar-of-fire]], 195). See [[cal.1963-10-10.king]], [[cal.1963-12-19.king]].
        Names: Sullivan, King. Check: Kotz dates the conference Dec. 23, 1963, seven FBI officials, nine hours, Sullivan in
        the chair (83). Check: Kotz''s note 75 (83) cites "Questions to Be Explored at Conference 12/23/63 re Communist Influence
        in Racial Matters," printed by the Stokes committee (hearings, vol. 6, 159–61): the paper''s title gives the day.
        Check: the day; Schlesinger (363) and the Church committee''s report (Book III, 133) date the nine-hour conference
        Dec. 23, 1963: the same meeting as [[cal.1963-12-24.king]]?. Check: the day. Check: Branch, 195–97, has seven FBI
        officials meet on Dec. 23, Sullivan reporting to Belmont Dec. 24.'
