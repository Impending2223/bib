patch: desegregation-threads
by: main session
ops:
- add:
    entry:
      id: cal.thread.desegregation-public-places
      s: 'Desegregation: public places'
      c: Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. Burton; the Freedom Rides and the ICC order; Albany; Garner; Birmingham; the sit-in cases; Watson; Jackson; the public
        accommodations title. Gallup on the Freedom Riders and on integration.
    section: th
    after: cal.thread.defense
- add:
    entry:
      id: cal.thread.desegregation-schools
      s: 'Desegregation: schools'
      c: Schools and universities opened under federal court orders, each event in its own thread. Georgia; Atlanta; Meredith at Oxford; Gantt at Clemson; Goss; the schoolhouse door; Alabama's schools in September; Prince Edward's Free Schools. Gallup
        on school integration.
    section: th
    after: cal.thread.desegregation-public-places
- add:
    entry:
      id: kjc.trillin-education-in-georgia
      c: 'Calvin Trillin, *An Education in Georgia: The Integration of Charlayne Hunter and Hamilton Holmes* (1964)'
      n: The New Yorker's reporting, and the two students at their graduation.
    section: II.H
- add:
    entry:
      id: kjc.smith-they-closed-their
      c: 'Bob Smith, *They Closed Their Schools: Prince Edward County, Virginia, 1951–1964* (1965)'
      n: A Virginia newspaperman's account.
    section: II.H
- add:
    entry:
      id: kjc.sullivan-bound-for-freedom
      c: 'Neil V. Sullivan, *Bound for Freedom: An Educator''s Adventures in Prince Edward County, Virginia* (1965)'
      n: The Free Schools' superintendent.
    section: II.H
- add:
    entry:
      id: kjc.hunter-gault-in-my-place
      c: Charlayne Hunter-Gault, *In My Place* (1992)
      n: Her memoir.
    section: II.H
- add:
    entry:
      id: kjc.pratt-we-shall-not
      c: 'Robert A. Pratt, *We Shall Not Be Moved: The Desegregation of the University of Georgia* (2002)'
    section: II.H
- add:
    entry:
      id: kjc.titus-browns-battleground
      c: 'Jill Ogline Titus, *Brown''s Battleground: Students, Segregationists, and the Struggle for Justice in Prince Edward County, Virginia* (2011)'
    section: II.H
- add:
    entry:
      id: kjc.who.bootle-william-a
      s: Bootle, William A.
      r: District judge, Middle District of Georgia; *Holmes v. Danner*
    section: III.G
- add:
    entry:
      id: kjc.who.holmes-hamilton-e
      s: Holmes, Hamilton E.
      r: With Hunter, the first Black students at the University of Georgia, Jan. 1961
    section: III.K
- add:
    entry:
      id: kjc.who.hunter-charlayne
      s: Hunter, Charlayne
      r: With Holmes, the first Black students at the University of Georgia, Jan. 1961; later Hunter-Gault
    section: III.K
- add:
    entry:
      id: kjc.who.sullivan-neil-v
      s: Sullivan, Neil V.
      r: Superintendent of the Prince Edward Free Schools, 1963–64
    section: III.K
- add:
    entry:
      id: kjc.who.vanden-heuvel-william-j
      s: vanden Heuvel, William J.
      r: Special assistant to the Attorney General; the Prince Edward Free Schools, 1963
    section: III.K
- add:
    entry:
      id: cal.1961-01-06.desegregation-schools
      when: Jan. 6–16
      date: '1961-01-06'
      thread: desegregation-schools
      c: Judge Bootle orders the University of Georgia to admit Charlayne Hunter and Hamilton Holmes. They register Jan. 9. A riot at Hunter's dormitory the night of the 11th; both suspended and driven to Atlanta. Bootle orders them readmitted, Jan. 13;
        in class again Jan. 16.
      n: '*Holmes v. Danner*, [191 F. Supp. 394](https://static.case.law/f-supp/191/html/0394-01.html) (M.D. Ga. 1961). Trillin, *An Education in Georgia*; Hunter-Gault, *In My Place*; Pratt, *We Shall Not Be Moved* (K–J Cong. II.H). Bass, *Unlikely Heroes*
        (K–J Cong. II.H), on Tuttle and the stay. Names: Bootle (K–J Cong. III.G); Hunter, Holmes (K–J Cong. III.K).'
- add:
    entry:
      id: cal.1963-09-16.desegregation-schools
      when: Sept. 16
      date: '1963-09-16'
      thread: desegregation-schools
      c: Prince Edward County, Virginia, its public schools closed since 1959 rather than desegregated. The Free Schools open for its Black children in four of the closed buildings, privately funded, organized at the administration's urging. Superintendent
        Neil V. Sullivan, recruited by William vanden Heuvel of Justice. Over 1,500 enrolled by the month's end.
      n: '*Southern School News* (Oct. 1963). Smith, *They Closed Their Schools*; Sullivan, *Bound for Freedom*; Titus, *Brown''s Battleground* (K–J Cong. II.H). Names: Sullivan, vanden Heuvel (K–J Cong. III.K).'
