      date: 1960-07
      thread: cuba-bay-of-pigs
      c: The first thirty Cubans recruited by the FRD at a jungle camp, by Jones in Mexico, to begin military training.
      n: '[[w.jones-bay-of-pigs]], 20. See [[cal.1960-06-22.cuba]]. Check: the day; and the place: the camps of 1960 were in Panama and Guatemala.'
