      when: Feb. 27
      date: '1962-02-27'
      thread: cuba
      c: 'Miró Cardona and Varona at State with Hurwitch, then Morales Carrión: after Punta del Este, military action the only way; American forces, or Cubans with American support. Without an encouraging answer they would have to resign from the Council.'
      n: '[FRUS 1961–63, X, doc. 308](https://history.state.gov/historicaldocuments/frus1961-63v10/d308). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 158 (Varona). See [[cal.1962-02-20.cuba]]. Names: Miró Cardona, Varona.'
