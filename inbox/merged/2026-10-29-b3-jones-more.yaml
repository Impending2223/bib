- add:
    entry:
      id: cal.1964-04-07.cuba
      when: Apr. 7
      date: '1964-04-07'
      thread: cuba
      c: 'The White House, on the covert program against Cuba: Johnson, Rusk, McNamara, Vance, Taylor, McCone, Helms, FitzGerald, Bundy and others. Bundy''s paper: intelligence, propaganda, economic denial, contacts with dissidents and indirect sabotage to go on; CIA-controlled raids and autonomous operations for discussion. The CIA''s briefing paper: some 7,000 Soviet troops still in Cuba, the SA-2 sites soon to be handed over.'
      n: 'FRUS 1964–68, XXXII, docs. [259](https://history.state.gov/historicaldocuments/frus1964-68v32/d259); [258](https://history.state.gov/historicaldocuments/frus1964-68v32/d258) (the briefing paper). [[w.jones-bay-of-pigs]], 166 (FitzGerald on a penetration of the army). See [[cal.1963-11-22.cuba]]. Names: Johnson, Rusk, McNamara, Vance, Taylor, McCone, Helms, FitzGerald, McGeorge Bundy.'
      tags:
