      when: Mar. 14
      date: '1960-03-14'
      thread: cuba-bay-of-pigs
      c: 'The Special Group at the White House, Dulles and King attending: what if Fidel and Raúl Castro and Guevara "should disappear simultaneously." Burke: the Communists the only organized group in Cuba, they might take control. Dulles: that might ease a multilateral action by the OAS.'
      n: '[S. Rep. No. 94-465, 93–94 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=104) (the minutes). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-03-09.cuba]]. Names: Dulles, King, Burke, Castro, Raúl Castro, Guevara.'
