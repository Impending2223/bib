      when: Mar. 2
      date: '1960-03-02'
      thread: cuba
      c: 'The Joint Chiefs to Gates, JCSM-72-60, Burke signing: a government in Cuba controlled by international Communism a direct threat; "a program of positive action to re-establish a stable, friendly, non-communist government in Cuba"; the study to go to the NSC.'
      n: '[FRUS 1958–60, VI, doc. 468](https://history.state.gov/historicaldocuments/frus1958-60v06/d468). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 17. See [[cal.1960-02-26.cuba]]. Names: Gates, Burke.'
