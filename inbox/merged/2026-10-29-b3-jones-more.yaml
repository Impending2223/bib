      when: Jan. 28
      date: '1960-01-28'
      thread: cuba
      c: 'Eastland telephones Rubottom: pressed by members of his committee, Dodd hardest, to resume hearings on Cuba. Rubottom: better to wait; Castro making many mistakes, the Cuban people will see through him. Eastland: the same was said of China and Czechoslovakia.'
      n: '[FRUS 1958–60, VI, doc. 441](https://history.state.gov/historicaldocuments/frus1958-60v06/d441) (Rubottom''s memorandum). Made public: FRUS 1958–60, VI (1991). See [[cal.1960-01-23.cuba]]. Names: Eastland, Rubottom, Dodd, Castro.'
