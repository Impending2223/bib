        rows:
        - 'w.jones-bay-of-pigs 35–36: all'
        - 'via w.jones-bay-of-pigs 35 n.13a: all'
    section: '196011'
- add:
    entry:
      id: cal.1960-11-07.cuba
      when: Nov. 7
      date: '1960-11-07'
      thread: cuba-bay-of-pigs
      c: 'Lansdale to Douglas, after the Special Group of Nov. 3: the present course will not succeed, the plan resting on Cubans rallying in numbers, blocked by the militia and Castro''s majority. Reassess; decide and commit enough American resources for success; isolate Cuba; bring a viable government to power. The NSC the same morning, 466th meeting: Gordon Gray on the readiness for an attack on Guantanamo, defense of the base alone or war.'
      n: 'FRUS 1958–60, VI, docs. [607](https://history.state.gov/historicaldocuments/frus1958-60v06/d607); [608](https://history.state.gov/historicaldocuments/frus1958-60v06/d608) (the NSC). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 32, 36. See [[cal.1960-11-03.cuba]]. Names: Lansdale, Castro, Gordon Gray.'
      tags:
      - name:lansdale-edward-g
      - name:castro-fidel
      - name:gray-gordon
      src:
        c: 01f33906
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v06/d607: A-E'
        - 'https://history.state.gov/historicaldocuments/frus1958-60v06/d608: F'
        - 'w.jones-bay-of-pigs 32, 36: all'
        - 'via w.jones-bay-of-pigs 36 n.14a: A-E'
        - 'via w.jones-bay-of-pigs 32 n.2b: F'
    section: '196011'
- add:
    entry:
      id: cal.1960-11.cuba-bay-of-pigs-2
      when: Nov.
      date: 1960-11
      thread: cuba-bay-of-pigs
      c: The airstrip at Retalhuleu, Guatemala, five thousand feet, on Robert Alejos's coffee plantations, and Camp Trax in the Sierra Madre, by Ydígoras's leave. Late in the month ten seven-man guerrilla teams ready for Cuba, waiting on infiltration plans.
      n: '[[w.jones-bay-of-pigs]], 33–34. To check: Trest and Dodd, *Wings of Denial* (2001), 26; Persons, *Bay of Pigs* (1968), 11, 30–31, 42–43; Kirkpatrick''s survey, 32, 91 (cited by [[w.jones-bay-of-pigs]], 33 n.6, 34 n.8). See [[cal.1960-11-04.cuba]]. Names: Ydígoras. Check: the days.'
      tags:
      - name:ydigoras-fuentes-miguel
      src:
        c: d44e484d
        rows:
        - 'w.jones-bay-of-pigs 33–34: all'
        - 'via w.jones-bay-of-pigs 33 n.6a: A'
        - 'via w.jones-bay-of-pigs 34 n.8a: B'
    section: '196011'
- add:
    entry:
      id: cal.1960-11-29.cuba-2
      when: Nov. 29
      date: '1960-11-29'
      thread: cuba-bay-of-pigs
      c: 'Varona of the FRD at State, two hours and twenty minutes, with Vallon, Stevenson, Hurwitch and Devine: Castro damaging American prestige; the groups in Cuba impatient with nonintervention. By Jones: Castro''s support 30 percent; a force of about 3,000 could seize ground and declare itself the government; American armed intervention "unavoidable."'
      n: '[FRUS 1958–60, VI, doc. 614](https://history.state.gov/historicaldocuments/frus1958-60v06/d614). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 37. See [[cal.1960-11-29.cuba]]. Names: Varona, Castro.'
      tags:
      - name:varona-manuel-antonio-de
      - name:castro-fidel
      src:
        c: 9956c87f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v06/d614: A-B'
        - 'w.jones-bay-of-pigs 37: all'
        - 'via w.jones-bay-of-pigs 37 n.15a: all'
    section: '196011'
- add:
    entry:
      id: cal.1960-12.cuba-bay-of-pigs
      when: Dec.
      date: 1960-12
      thread: cuba-bay-of-pigs
      c: Egan, the CIA's operations officer at the camp, reports the brigade of nearly 600 begun on seven weeks' training, leaders chosen by performance; "adequate leadership and training," though only 20 percent have served. San Román its commander.
      n: '[[w.jones-bay-of-pigs]], 38–39. To check: [[w.lynch-decision-for-disaster]], 24; the seventh meeting of the Green Study Group, May 1, 1961, *Operation Zapata*, 170–71, 174–75 (cited by [[w.jones-bay-of-pigs]], 38 n.18). See [[cal.1960-12-08.cuba]]. Names: San Román. Check: the day.'
      tags:
      - name:san-roman-jose-perez
      src:
        c: fad2a335
        rows:
        - 'w.jones-bay-of-pigs 38–39: all'
        - 'via w.jones-bay-of-pigs 38 n.18a: all'
    section: '196012'
- add:
    entry:
      id: cal.1961-01.cuba-bay-of-pigs
      when: Jan.
      date: 1961-01
      thread: cuba-bay-of-pigs
      c: The Special Group approves American contract pilots and seamen to train the Cubans, any American at the controls a separate decision; Alabama Air National Guardsmen among the eighteen airmen. At night, from the abandoned base at Opa-Locka, Fla., pilots train for low flights over Cuba.
      n: '[[w.jones-bay-of-pigs]], 40–41. To check: Kirkpatrick''s survey, 98; Persons, *Bay of Pigs* (1968) (cited by [[w.jones-bay-of-pigs]], 40 n.24). See [[cal.1961-01-04.cuba-bay-of-pigs]]. Check: the days: Jones gives "early January."'
      src:
        c: 4c7acab6
        rows:
        - 'w.jones-bay-of-pigs 40–41: all'
        - 'via w.jones-bay-of-pigs 40 n.24a: A'
    section: '196101'
- add:
    entry:
      id: cal.1961-04-16.cuba-4
      when: Apr. 16
      date: '1961-04-16'
      thread: cuba-bay-of-pigs
      c: Before midnight, two underwater demolition teams, each led by an American, Lynch for Blue Beach, Robertson for Red Beach, go in to mark the channels. At Playa Girón the beach lit, a party on it; a militia jeep fires on, its men warn of an invasion; the *Blagar*'s guns clear the beach.
      n: '[[w.jones-bay-of-pigs]], 99–101, 105–6. To check: [[w.lynch-decision-for-disaster]] (cited by [[w.jones-bay-of-pigs]], 99 n.10). See [[cal.1961-04-16.cuba]].'
      src:
        c: aa673adf
        rows:
        - 'w.jones-bay-of-pigs 99–101, 105–6: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-17.cuba-3
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      c: 'Before 1 a.m., through the station in Miami, word to Lynch of the D-Day strikes cancelled: "Castro still has operational aircraft. ... Unload all men and supplies and take the ships to sea." The landing at Green Beach dropped, the 3rd Battalion to Blue Beach. 3:15 a.m., Castro told of landings at Girón and Larga; his aircraft to take off at dawn.'
      n: '[[w.jones-bay-of-pigs]], 101–2. See [[cal.1961-04-17.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 271a4316
        rows:
        - 'w.jones-bay-of-pigs 101–2: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-17.cuba-4
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      c: 'Blue Beach after dawn. The *Blagar* downs a Sea Fury; a T-33 downs a brigade B-26 at the Girón strip. Lynch handed: "Castro''s air force 100% destroyed." 7:30 a.m., 172 paratroopers dropped from five C-46s and a C-54 by San Blas, their ammunition missing the drop zone. By 8:25 the vehicles and tanks ashore; Girón and its airfield taken, 130 militia captured.'
      n: '[[w.jones-bay-of-pigs]], 102–4. See [[cal.1961-04-17.cuba]]. Names: San Román.'
      tags:
      - name:san-roman-jose-perez
      src:
        c: 8c8fefb8
        rows:
        - 'w.jones-bay-of-pigs 102–4: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-17.cuba-5
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      c: Red Beach. Only 270 of the 2nd Battalion's 399 men get ashore, seven of nine landing craft failing; the 5th Battalion's 180 kept aboard the *Houston* by their commander, Montero Duque. A T-33's rockets hit the *Houston*, which runs aground, up to twenty killed in the water. Three hours later a Sea Fury's rocket sets the *Río Escondido* afire off Girón; she explodes, ten days' ammunition and the communications van lost.
      n: '[[w.jones-bay-of-pigs]], 106–7. See [[cal.1961-04-17.cuba]].'
      src:
        c: ac812668
        rows:
        - 'w.jones-bay-of-pigs 106–7: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-17.cuba-6
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      c: 'The ships ordered out to sea till dark, the Navy''s cover at the twelve-mile limit promised. Crutchfield, for five destroyers: "My heart is with you, but I cannot help you." Mutineers on the *Blagar* subdued; the *Atlántico* and *Caribe* run south, the *Caribe* turned by a destroyer''s shot across her bow. San Blas attacked about 3 p.m.; tanks at Playa Larga by midafternoon; the brigade falls back on Blue Beach.'
      n: '[[w.jones-bay-of-pigs]], 105, 107–9. See [[cal.1961-04-17.cuba]].'
      src:
        c: 98d40b0b
        rows:
        - 'w.jones-bay-of-pigs 105, 107–9: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-17.cuba-7
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      c: 'Night. Four C-54s and two C-46s drop supplies, five drops good at Blue Beach. Six B-26s sent against San Antonio de los Baños, two aborting, the rest lost in cloud; three more at dawn, Apr. 18, the same. The day''s air: four brigade B-26s down to T-33s; two Sea Furies and two B-26s of Castro''s down.'
      n: '[[w.jones-bay-of-pigs]], 109–10. See [[cal.1961-04-17.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: '66195394'
        rows:
        - 'w.jones-bay-of-pigs 109–10: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-18.cuba-10
      when: Apr. 18
      date: '1961-04-18'
      thread: cuba-bay-of-pigs
      c: 'Shelling from 3 and 4 a.m. at Red Beach and San Blas; the brigade back on Blue Beach. Told evacuation would begin after dark, San Román: "I will not be evacuated." Afternoon: six B-26s from Puerto Cabezas, two flown by American contract pilots, catch a column of tanks and trucks north of Playa Larga: seven tanks and twenty trucks destroyed, by Jones some 1,800 casualties. Castro comes down from Havana.'
      n: '[[w.jones-bay-of-pigs]], 114–15. See [[cal.1961-04-18.cuba-4]]. Names: San Román, Castro.'
      tags:
      - name:san-roman-jose-perez
      - name:castro-fidel
      src:
        c: 9db97f88
        rows:
        - 'w.jones-bay-of-pigs 114–15: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-19.cuba-10
      when: Apr. 19
      date: '1961-04-19'
      thread: cuba-bay-of-pigs
      c: By five, some twenty men left on Blue Beach. Five row a small boat out by hand; eight in another killed by an aircraft. Through the next days two Americans and Cuban frogmen pick up twenty-six survivors in the keys west of the bay; the five picked up by a destroyer four days later.
      n: '[[w.jones-bay-of-pigs]], 121–22. See [[cal.1961-04-19.cuba-2]].'
      src:
        c: cc788f7d
        rows:
        - 'w.jones-bay-of-pigs 121–22: all'
        - 'via w.jones-bay-of-pigs 122 n.36a: D'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-24.cuba
      when: Apr. 24
      date: '1961-04-24'
      thread: cuba-bay-of-pigs
      c: 'The Taylor board''s second meeting, the Green Study Group, 10:20 a.m. to 5 p.m. at the CIA. Bissell''s chronology: by early January the 300 men for infiltration become a strike force, no paper recording the shift; 38 Special Forces officers at the camp, Jan. 12; the President briefed Jan. 28, no opinion offered; a meeting about Feb. 17, D-Day of Mar. 5 let slip a month. The paramilitary staff''s paper the same day: no written directives after Mar. 17, slow decisions, control too centralized.'
      n: 'FRUS 1961–63, X, docs. [174](https://history.state.gov/historicaldocuments/frus1961-63v10/d174); [173](https://history.state.gov/historicaldocuments/frus1961-63v10/d173). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-22.cuba]]. Names: Bissell, Taylor, Robert Kennedy, Burke, Dulles.'
      tags:
      - name:bissell-richard-m-jr
      - name:taylor-maxwell
      - name:kennedy-robert-f
      - name:burke-arleigh-a
      - name:dulles-allen-w
      src:
        c: bfac695d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d174: A-E'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d173: F'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-25.cuba
      when: Apr. 25
      date: '1961-04-25'
      thread: cuba-bay-of-pigs
      c: 'The Taylor board. The CIA: no legal limit on the military personnel it might use, only disclosure; no one sent into the area to reconnoiter; never before a pitched battle between Cubans. Hawkins on the operation: strikes for two days without restriction first proposed, limited for political reasons.'
      n: '[FRUS 1961–63, X, doc. 175](https://history.state.gov/historicaldocuments/frus1961-63v10/d175). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-24.cuba]]. Names: Hawkins.'
      tags:
      - name:hawkins-jack
      src:
        c: 6c5030b8
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d175: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-26.cuba-3
      when: Apr. 26
      date: '1961-04-26'
      thread: cuba-bay-of-pigs
      c: 'The Taylor board, on intelligence. The President had the daily bulletin, no special briefings. "Time was running out" weighed heavily: the limits on the plan to spare the world a shock, not the Cubans. Castro''s aircraft all located; their pilots, perhaps fifty trained in Czechoslovakia, a surprise; the militia''s positions the weakest intelligence.'
      n: '[FRUS 1961–63, X, doc. 176](https://history.state.gov/historicaldocuments/frus1961-63v10/d176). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-24.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 4e997a94
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d176: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-28.cuba
      when: Apr. 28
      date: '1961-04-28'
      thread: cuba-bay-of-pigs
      c: 'The Taylor board hears Dennison: told on Feb. 9 by the President that no bail-out was in view, the force would fade into the hinterland; his own order of Apr. 1 on the rules of engagement; never shown the invasion plan, so the rescue began blind.'
      n: '[FRUS 1961–63, X, doc. 187](https://history.state.gov/historicaldocuments/frus1961-63v10/d187). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-24.cuba]]. Names: Dennison, Kennedy.'
      tags:
      - name:dennison-robert-l
      - name:kennedy-john-f
      src:
        c: df7dc60b
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d187: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-05-01.cuba-3
      when: May 1
      date: '1961-05-01'
      thread: cuba-bay-of-pigs
      c: 'The Taylor board hears Clark: every order clear and carried out; evacuation hard, unable to fire back. The Navy''s cover for the B-26s, 6:30 to 7:30 a.m., Apr. 19, on station early, but the B-26s an hour earlier still. McGriffin on the reconnaissance flights: tanks and trucks moving down the bay, D+1; the brigade bunched at the resort, D+2.'
      n: '[FRUS 1961–63, X, doc. 193](https://history.state.gov/historicaldocuments/frus1961-63v10/d193). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-24.cuba]].'
      src:
        c: c2dd1bdb
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d193: all'
    section: '196105'
- add:
    entry:
      id: cal.1961-05-03.cuba
      when: May 3
      date: '1961-05-03'
      thread: cuba-bay-of-pigs
      c: 'The Taylor board in McNamara''s office. McNamara: a marginal probability of success, the force grown from about 800 to 1,200, the air support, sea cover and landing site cutting the chances. Three reasons to go ahead: bringing the force home would say the United States would not help fight Communism; no other chance without Americans; the guerrilla fallback. The CIA''s chronology of D-2 to D+2 for the board the same day.'
      n: 'FRUS 1961–63, X, docs. [199](https://history.state.gov/historicaldocuments/frus1961-63v10/d199); [198](https://history.state.gov/historicaldocuments/frus1961-63v10/d198) (the chronology). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-24.cuba]]. Names: McNamara.'
      tags:
      - name:mcnamara-robert-s
      src:
        c: 82af2f65
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d199: A-E'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d198: F'
    section: '196105'
- add:
    entry:
      id: cal.1961-05-04.cuba-2
      when: May 4
      date: '1961-05-04'
      thread: cuba-bay-of-pigs
      c: 'The Taylor board recalls David Gray: the Chiefs'' appraisal of Zapata incomplete, made on a concept in a day; Trinidad still preferred; the detailed plan done about Apr. 8, never seen by the Chiefs until the operation began.'
      n: '[FRUS 1961–63, X, doc. 200](https://history.state.gov/historicaldocuments/frus1961-63v10/d200). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-24.cuba]]. Names: David Gray.'
      tags:
      - name:gray-david-w
      src:
        c: 7adaea9a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d200: all'
    section: '196105'
- add:
    entry:
      id: cal.1961-05-05.cuba-3
      when: May 5
      date: '1961-05-05'
      thread: cuba
      c: 'Burke''s debrief of the NSC. Asked whether anyone would intervene in Cuba now: perhaps not now, but the longer the delay the stronger Castro. Decided: sooner or later intervention probably needed, not now; a blockade not worthwhile. McNamara: the Air Force would air-land all the forces in 36 hours.'
      n: '[FRUS 1961–63, X, doc. 206](https://history.state.gov/historicaldocuments/frus1961-63v10/d206). Made public: FRUS 1961–63, X (1997). See [[cal.1961-05-05.cuba]]. Names: Burke, Castro, McNamara.'
      tags:
      - name:burke-arleigh-a
      - name:castro-fidel
      - name:mcnamara-robert-s
      src:
        c: 3144c1d1
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d206: all'
    section: '196105'
- add:
    entry:
      id: cal.1961-05-08.cuba-2
      when: May 8
      date: '1961-05-08'
      thread: cuba-bay-of-pigs
      c: 'The Taylor board hears Shoup and White. Shoup: the Chiefs'' January plan for Cuba never taken up again; the Trinidad plan workable; the President against it, "too much of Normandy." White: a fair chance, on the uprisings, the escape to the hills and surprise in the air; LeMay heard Zapata briefed, the Chiefs still for Trinidad.'
      n: 'FRUS 1961–63, X, docs. [209](https://history.state.gov/historicaldocuments/frus1961-63v10/d209); [210](https://history.state.gov/historicaldocuments/frus1961-63v10/d210). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-24.cuba]]. Names: Shoup, Thomas White, LeMay.'
      tags:
      - name:shoup-david-m
      - name:white-thomas-d
      - name:lemay-curtis-e
      src:
        c: 28ff1586
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d209: A-D'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d210: A, E-F'
    section: '196105'
- add:
    entry:
      id: cal.1961-05-09.cuba-2
      when: May 9
      date: '1961-05-09'
      thread: cuba
      c: 'Bissell with Barnes, King and the Cuba staff: the President wants the brigade''s family allotments kept up, through June; $250 bonuses for the 170 recruits who never left. What next: build up internal assets, intelligence first; sabotage with few men; communications training.'
      n: '[FRUS 1961–63, X, doc. 214](https://history.state.gov/historicaldocuments/frus1961-63v10/d214). Made public: FRUS 1961–63, X (1997). See [[cal.1961-05-05.cuba]]. Names: Bissell, Barnes, King, Kennedy.'
      tags:
      - name:bissell-richard-m-jr
      - name:barnes-c-tracy
      - name:king-j-c
      - name:kennedy-john-f
      src:
        c: ee503360
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d214: all'
    section: '196105'
- add:
    entry:
      id: cal.1961-05-24.cuba
      when: May 24
      date: '1961-05-24'
      thread: cuba
      c: 'Bissell and another CIA officer with Goodwin: no definitive decisions on Cuba before the President is back from Europe, about June 6 or 7; little stir meanwhile, the tractor talks pending. Allowed: intelligence nets, covert radio training, jobs for Cuban pilots, talks with Somoza on Puerto Cabezas.'
      n: '[FRUS 1961–63, X, doc. 225](https://history.state.gov/historicaldocuments/frus1961-63v10/d225). Made public: FRUS 1961–63, X (1997). See [[cal.1961-05-09.cuba-2]]. Names: Bissell, Goodwin.'
      tags:
      - name:bissell-richard-m-jr
      - name:goodwin-richard-n
      src:
        c: 5a2f53d6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d225: all'
    section: '196105'
- add:
    entry:
      id: cal.1961-06-13.cuba-2
      when: June 13
      date: '1961-06-13'
      thread: cuba-bay-of-pigs
      c: 'The Taylor group with the President, 5 p.m. Taylor on the recommendations; Kennedy taken with the Strategic Resources Board for the cold war. Burke: an assistant President, a staff that grows, passive resistance in State and Defense.'
      n: '[FRUS 1961–63, X, doc. 229](https://history.state.gov/historicaldocuments/frus1961-63v10/d229) (Burke''s memorandum). Made public: FRUS 1961–63, X (1997). See [[cal.1961-06-13.cuba]]. Names: Taylor, Kennedy, Burke.'
      tags:
      - name:taylor-maxwell
      - name:kennedy-john-f
      - name:burke-arleigh-a
      src:
        c: cf6b1fb5
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d229: all'
    section: '196106'
- add:
    entry:
      id: cal.1961-06-23.cuba
      when: June 23
      date: '1961-06-23'
      thread: cuba-bay-of-pigs
      c: 'Taylor and Dulles at Gettysburg, Pa., brief Eisenhower on the board''s findings against Stewart Alsop''s article in the *Saturday Evening Post* of June 24. Eisenhower: no operational plan ever put to him, no "Eisenhower plan"; no knowledge of an amphibious operation like Trinidad.'
      n: '[FRUS 1961–63, X, doc. 238](https://history.state.gov/historicaldocuments/frus1961-63v10/d238). Made public: FRUS 1961–63, X (1997). See [[cal.1961-06-13.cuba]]. Names: Taylor, Dulles, Eisenhower, Stewart Alsop.'
      tags:
      - name:taylor-maxwell
      - name:dulles-allen-w
      - name:eisenhower-dwight-d
      - name:alsop-stewart
      src:
