      when: Nov.
      date: 1964-11
      thread: cuba
      c: The CIA tells Cubela it will call off the operation; he will go on with Artime toward a coup. Sanchez meets him again in Paris in December, then in Madrid.
      n: '[[w.jones-bay-of-pigs]], 167. To check: the CIA Inspector General''s report, 1967 (cited by [[w.jones-bay-of-pigs]], 167 n.36). See [[cal.1964-04-07.cuba]]. Names: Artime. Check: the days.'
