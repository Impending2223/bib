- add:
    entry:
      id: cal.1960-10-20.cuba-2
      when: Oct. 20
      date: '1960-10-20'
      thread: cuba
      c: 'Goodpaster''s memorandum: about Oct. 8 he gave the President Defense''s proposal of U-2 flights over Cuba under SAC, for the clandestine operations and for missile sites; Eisenhower against military auspices; the Special Group free to authorize civilian flights. The NSC the same day, 464th meeting. Dulles: about 1,000 guerrillas in the Escambray, poorly armed, without unity; Soviet arms still coming.'
      n: 'FRUS 1958–60, VI, docs. [595](https://history.state.gov/historicaldocuments/frus1958-60v06/d595); [596](https://history.state.gov/historicaldocuments/frus1958-60v06/d596) (the NSC). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 32; [[w.bissell-reflections-of-a-cold]], 155 (Dulles to the NSC). See [[cal.1960-10-19.cuba]]. Names: Goodpaster, Eisenhower, Dulles.'
