      when: Feb. 26
      date: '1960-02-26'
      thread: cuba
      c: 'Burke to Merchant, with the Navy''s paper: Cuba falling under the domination of international Communism, a direct threat to the United States; "positive action" to reverse the trend, the threat eliminated and a stable, friendly government set up.'
      n: '[FRUS 1958–60, VI, doc. 466](https://history.state.gov/historicaldocuments/frus1958-60v06/d466). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 17. See [[cal.1960-02-18.cuba]]. Names: Burke, Merchant.'
