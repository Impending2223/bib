- add:
    entry:
      id: cal.1962-03-29.cuba
      when: Mar. 29
      date: '1962-03-29'
      thread: cuba
      c: 'Miró Cardona, Varona and two others of the Council with Bundy and Hurwitch: the President unable to see them. Miró and Varona want the means to invade. Bundy: any action must be decisive and complete; that would take open American forces, open war, not advisable now.'
      n: '[FRUS 1961–63, X, doc. 317](https://history.state.gov/historicaldocuments/frus1961-63v10/d317). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 158 (Varona; Bundy present). See [[cal.1962-02-27.cuba]]. Names: Miró Cardona, Varona, McGeorge Bundy.'
