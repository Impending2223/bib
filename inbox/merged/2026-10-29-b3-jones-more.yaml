      id: cal.1960-03-09.cuba
      when: Mar. 9
      date: '1960-03-09'
      thread: cuba-bay-of-pigs
      c: 'J. C. King to the CIA''s task force on Cuba: some of the regime''s heads pushing for an attack on Guantanamo, an attack possible. Unless Fidel and Raúl Castro and Guevara "could be eliminated in one package," highly unlikely, a long affair, the government overthrown only by force.'
      n: '[S. Rep. No. 94-465, 93 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=104) (a memorandum for the record, Mar. 9). Made public: the Church Committee''s interim report, Nov. 20, 1975. [[w.jones-bay-of-pigs]], 18. See [[cal.1960-01-13.cuba-bay-of-pigs]]. Names: King, Castro, Raúl Castro, Guevara.'
      tags:
