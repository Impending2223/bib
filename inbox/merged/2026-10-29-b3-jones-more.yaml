- add:
    entry:
      id: cal.1960-09-29.cuba
      when: Sept. 29
      date: '1960-09-29'
      thread: cuba
      c: 'The NSC, 461st meeting. Dulles: Cuba virtually a member of the Bloc; the first major Bloc arms shipment in, Sept. 10: ten tanks, 100 anti-aircraft guns; Cubans in training in Czechoslovakia, as jet pilots, he thinks. A campaign against Guantanamo, not an attack. The Chiefs to Gates, JCSM-441-60, the same day: hold the base though Castro denounce the treaty; plans to defend it against all forms of pressure.'
      n: 'FRUS 1958–60, VI, docs. [583](https://history.state.gov/historicaldocuments/frus1958-60v06/d583); [584](https://history.state.gov/historicaldocuments/frus1958-60v06/d584) (the Chiefs). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 31–32 (the Chiefs). See [[cal.1960-09-26.soviet-union-un]]. Names: Dulles, Gates, Castro.'
      tags:
