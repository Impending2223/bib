      when: Jan. 14
      date: '1960-01-14'
      thread: cuba
      c: 'The NSC, 432d meeting. Dulles: Castro and Guevara seizing lands and assets; envoys organizing a conference of hungry nations; contacts with Communist China growing, its recognition expected this year; sugar sold to the Bloc below the world price; the Soviet exhibition to Havana in February.'
      n: '[FRUS 1958–60, VI, doc. 423](https://history.state.gov/historicaldocuments/frus1958-60v06/d423). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 16 (the meeting). See [[cal.1960-01-08.cuba]]. Names: Dulles, Castro, Guevara.'
