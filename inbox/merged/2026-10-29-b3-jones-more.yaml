      when: Sept. 5
      date: '1963-09-05'
      thread: cuba
      c: 'Sanchez, the new case officer, and another CIA officer meet Cubela at Porto Alegre, Brazil: AMLASH revived, a military coup the aim. Sanchez: not "specifically in assassination terms."'
      n: '[[w.jones-bay-of-pigs]], 163. To check: the CIA Inspector General''s report, 1967 (cited by [[w.jones-bay-of-pigs]], 163 n.26). See [[cal.1963-07-09.cuba]].'
