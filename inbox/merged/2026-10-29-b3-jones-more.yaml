      when: Jan. 28
      date: '1960-01-28'
      thread: cuba
      c: 'Dreier to Rubottom, on the OAS: little prospect of better relations while Castro and his Communist-oriented backers rule; the opposition not yet strong or organized enough; "a race" between the regime''s growing power and the growth of an opposition.'
      n: '[FRUS 1958–60, VI, doc. 442](https://history.state.gov/historicaldocuments/frus1958-60v06/d442). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 17. See [[cal.1960-01-23.cuba]]. Names: Rubottom, Castro.'
