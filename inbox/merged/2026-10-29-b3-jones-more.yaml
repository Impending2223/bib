      when: June 29
      date: '1961-06-29'
      thread: cuba
      c: 'The Special Group, Bowles, Gilpatric, Bundy, Dulles: the Revolutionary Council not to be treated as an American instrument; the CIA to keep paying the dependents and the Council for a month; the paramilitary operations in the 1962 budget to be studied further.'
