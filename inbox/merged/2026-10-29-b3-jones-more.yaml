- add:
    entry:
      id: cal.1960-10.cuba-bay-of-pigs
      when: Oct.
      date: 1960-10
      thread: cuba-bay-of-pigs
      c: 'Tass: an American arms buildup in Guatemala for an invasion of Cuba; a student group under a hundred miles from the base the same day. Ydígoras: "Guatemala does not need nor is it offering sites for foreign bases"; the charge "a lot of lies."'
      n: '[[w.jones-bay-of-pigs]], 34. To check: [[w.bay-of-pigs-declassified]], 2; Persons, *Bay of Pigs* (1968), 11 (cited by [[w.jones-bay-of-pigs]], 34 n.10). See [[cal.1960-10-30.cuba]]. Names: Ydígoras. Check: the days: Jones gives "late October."'
      tags:
      - name:ydigoras-fuentes-miguel
      src:
        c: 881e08c0
        rows:
        - 'w.jones-bay-of-pigs 34: all'
        - 'via w.jones-bay-of-pigs 34 n.10a: all'
        - 'via w.jones-bay-of-pigs 34 n.10b: B'
    section: '196010'
- add:
    entry:
      id: cal.1960-11-03.cuba
      when: Nov. 3
      date: '1960-11-03'
      thread: cuba-bay-of-pigs
      c: 'The Special Group. Merchant asks whether planning has begun for "direct positive action" against Fidel and Raúl Castro and Guevara, to leave the government "leaderless and probably brainless." Cabell: finding Cubans to do it at once "beyond our capabilities." Lansdale, Douglas and Gordon Gray present.'
      n: '[[w.jones-bay-of-pigs]], 35–36. To check: the Special Group''s minutes, Nov. 3, 1960, in Belin, "Investigation of CIA Involvement," 35, Church Committee (cited by [[w.jones-bay-of-pigs]], 35 n.13). See [[cal.1960-09.cuba]]. Names: Merchant, Cabell, Lansdale, Gordon Gray, Castro, Raúl Castro, Guevara.'
      tags:
      - name:merchant-livingston-t
