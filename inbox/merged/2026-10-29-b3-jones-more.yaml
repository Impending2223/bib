      id: cal.1960-07-25.cuba
      when: July 25
      date: '1960-07-25'
      thread: cuba
      c: 'The NSC at Newport, R.I., 453d meeting. Dulles: Communist China and Cuba conclude a trade pact, July 23, recognition expected within days; Raúl Castro''s communiqué from Moscow; more arrests of counter-revolutionaries, more defections. By Jones, Eisenhower: Trujillo will have to be "eliminated" before the other states support policy on Cuba.'
      n: '[FRUS 1958–60, VI, doc. 565](https://history.state.gov/historicaldocuments/frus1958-60v06/d565). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 21 (Trujillo). See [[cal.1960-07-09.cuba]]. Names: Dulles, Raúl Castro, Eisenhower, Trujillo. Check: Eisenhower''s words on Trujillo in the memorandum (Jones, 21, cites FRUS 1958–60, VI, 1029).'
