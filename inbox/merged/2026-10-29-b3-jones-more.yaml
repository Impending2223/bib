      when: June
      date: 1960-06
      thread: cuba-bay-of-pigs
      c: Safe houses in Miami; paramilitary training in Coral Gables under the cover of a job placement company; training begun in Panama.
      n: '[[w.jones-bay-of-pigs]], 19–20. To check: the Narrative of the Anti-Castro Cuban Operation Zapata, June 13, 1961, [FRUS 1961–63, X, doc. 231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), and Kirkpatrick''s survey (cited by [[w.jones-bay-of-pigs]], 20 n.25). See [[cal.1960-03-17.cuba]]. Check: the day.'
