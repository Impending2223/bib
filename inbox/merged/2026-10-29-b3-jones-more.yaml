      when: May
      date: 1960-05
      thread: cuba-bay-of-pigs
      c: By the end of May Dulles has approved $900,000 for the Cuba project to the end of fiscal 1960; within two weeks nearly all spent, another million put in.
      n: '[[w.jones-bay-of-pigs]], 20 n.25 (from the Inspector General''s survey). To check: Kirkpatrick, "Inspector General''s Survey of the Cuban Operation," Oct. 1961, 27–28, in [[w.bay-of-pigs-declassified]] (cited by [[w.jones-bay-of-pigs]], 179 n.25). See [[cal.1960-03-17.cuba]]. Names: Dulles. Check: the day.'
