      when: June
      date: 1965-06
      thread: cuba
      c: The CIA ends the Cubela operation, the AMLASH group judged insecure; support for Artime cut off, McCone's decision, Bundy agreeing; the 303 Committee to notify Artime.
      n: '[[w.jones-bay-of-pigs]], 167–68. To check: the CIA Inspector General''s report, 1967; the 303 Committee''s minutes (cited by [[w.jones-bay-of-pigs]], 167 n.37–38). See [[cal.1964-11.cuba]]. Names: McCone, McGeorge Bundy, Artime. Check: the day: Jones gives "late June 1965."'
