      id: cal.1960-10-14.cuba
      when: Oct. 14
      date: '1960-10-14'
      thread: cuba
      c: 'Herter to Gates, on Guantanamo: agreed, contingency plans to include defensive action beyond the perimeter against armed attack; such a decision the President''s. An attack would call for Article 3 of the Rio Treaty.'
      n: '[FRUS 1958–60, VI, doc. 591](https://history.state.gov/historicaldocuments/frus1958-60v06/d591). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 32. See [[cal.1960-09-29.cuba]]. Names: Herter, Gates.'
