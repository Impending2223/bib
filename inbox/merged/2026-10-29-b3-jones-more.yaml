      id: cal.1963-09-25.cuba
      when: Sept. 25
      date: '1963-09-25'
      thread: cuba
      c: 'FitzGerald briefs the Joint Chiefs on the covert program: CIA officers closer to officers who might break with Castro; at least ten high-ranking ones talking with the CIA, not with each other; "a parallel in history," the plot against Hitler. Vance: a coup the most promising line.'
      n: '[[w.jones-bay-of-pigs]], 164. To check: the record of the briefing (cited by [[w.jones-bay-of-pigs]], 164 n.28). See [[cal.1963-09-05.cuba]]. Names: FitzGerald, Vance, Castro.'
      tags:
