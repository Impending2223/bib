      when: Oct. 10
      date: '1960-10-10'
      thread: cuba
      c: 'Dennison, Supreme Allied Commander Atlantic, at State. Dillon: force not excluded some day; for now, inter-American agreement to stop the Bloc''s arms; Castro likely to break relations, Bonsal probably recalled. By Jones, Dennison: sabotage the greatest threat to the base.'
      n: 'FRUS 1958–60, VI, [doc. 588](https://history.state.gov/historicaldocuments/frus1958-60v06/d588) (editorial note). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 32. See [[cal.1960-09-30.cuba-2]]. Names: Dennison, Dillon, Castro, Bonsal.'
