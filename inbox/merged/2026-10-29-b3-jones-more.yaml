      when: Sept. 30
      date: '1960-09-30'
      thread: cuba
      c: 'State and the Joint Chiefs at the Pentagon, on Guantanamo: Merchant for an OAS statement that the base matters to hemispheric defense, perhaps from the Inter-American Defense Board; Twining, Lemnitzer and Burke to look at it. By Jones, Merchant: if Castro''s forces hit the base, "that is it—we are at war."'
      n: '[FRUS 1958–60, VI, doc. 585](https://history.state.gov/historicaldocuments/frus1958-60v06/d585). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 32. See [[cal.1960-09-29.cuba]]. Names: Merchant, Lemnitzer, Burke, Castro.'
