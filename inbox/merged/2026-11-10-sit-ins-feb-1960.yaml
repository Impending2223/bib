patch: 2026-11-10-sit-ins-feb-1960
by: Claude (the sit-ins of Feb. 8-13, 1960, run to ground at the owner's request, Nov. 6, 2026; Nov. 10-11, 2026)
ops:
- edit:
    id: cal.1960-02-08.sit-ins
    base: 5a0bc231
    set:
      when: Feb. 8
      c: 'The sit-ins spread. Durham: seventeen students of North Carolina College and four of Duke at the Woolworth counter.
        Winston-Salem: Carl Matthews, a graduate working in the city, sits in; some twenty-five join him in the afternoon,
        many of them students of Winston-Salem Teachers College.'
      n: '[[w.carson-in-struggle]], 10–11; [[w.morris-origins-of-the-civil]], 197 (the cities of February); [[w.morris-origins-of-the-civil]],
        200 (Durham and Winston-Salem, Feb. 8); [[w.meier-core]], 101 (the spread by Feb. 14); [[w.meier-core]], 103 (Durham,
        Feb. 8); [[w.branch-parting-the-waters]], 273 (Durham and Winston-Salem, the Monday after Greensboro); [[w.council-student-protest-movement]],
        8 (North Carolina''s cities). Check: Branch, 273, has Raleigh''s sit-ins begin this Monday too; Carson, 11, has Raleigh''s
        students decide to act on the Wednesday (Raleigh: [[cal.1960-02-10.sit-ins]]). To check: [[w.council-student-protest-movement-winter]],
        xix–xxv; [[w.laue-direct-action-and-desegregation]], 113–14; [[w.oppenheimer-genesis-of-the-southern]], 63–65; [[w.wehr-sit-down-protests]];
        [[w.patrick-lunch-counter-desegregation-in]] (cited by [[w.carson-in-struggle]], 11 n.3); interviews (cited by [[w.meier-core]],
        103 n.6); Atlanta Daily World, Feb. 13, 1960, 1 (cited by [[w.branch-parting-the-waters]], 273 n.5); interviews: Douglas
        Moore, Oct. 25, 1984 (Branch); [[w.morris-origins-of-the-civil]], 205 (cited by [[w.branch-parting-the-waters]], 273
        n.2); Watters, *Down to Now*, 72–81 (cited by [[w.branch-parting-the-waters]], 273 n.5); [[w.chafe-civilities-and-civil-rights]];
        [[w.schmidt-sit-ins]]. See [[cal.1960-02-01.sit-ins]]. Check: the dates of the cities. Check: Branch, 273–74, gives
        Raleigh, Durham and Winston-Salem the Monday after Greensboro, Feb. 8; High Point three days later; Rock Hill, and
        forty-one arrested at Raleigh, on the Friday, Feb. 12; Nashville''s five hundred the next morning; not Charlotte or
        Hampton.'
