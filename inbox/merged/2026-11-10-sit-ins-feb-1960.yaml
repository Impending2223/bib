- add:
    entry:
      id: cal.1960-02-09.sit-ins
      when: Feb. 9
      date: '1960-02-09'
      thread: sit-ins
      c: 'Charlotte: some 150 students assemble outside an administration building, by the account of Joseph Charles Jones,
        divinity student at Johnson C. Smith University and their spokesman; Jones tells them they cannot retaliate "to insults
        or even overt attacks." Durham: Gordon Carey of CORE arrested sitting in at a dime store with students of North Carolina
        College.'
      n: '[[w.constable-negro-student-protests-challenge]], 4 (Jones to the press); [[w.meier-core]], 103–04 (Carey''s arrest).
        Check: the day of Charlotte''s first sit-in at the counters: Jones gives the students'' gathering; Carson, 11, has
        Charlotte''s sit-ins by the end of the week. To check: Carey to Jesse Boston, Apr. 5, 1961, CORE Archives; Greensboro
        Daily News, Feb. 9, 10, 1960; Durham Sun, Feb. 9, 10, 1960; Durham Morning Herald, Feb. 10, 1960; [[w.wehr-sit-down-protests]],
        28; Carey to "Rich and Company," ca. Feb. 12, 1960, CORE Archives (cited by [[w.meier-core]], 104 n.7). See [[cal.1960-02-08.sit-ins]].'
      src:
        c: 4f6c62a0
