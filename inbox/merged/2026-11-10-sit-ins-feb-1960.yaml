- add:
    entry:
      id: cal.1960-02-11.sit-ins
      when: Feb. 11
      date: '1960-02-11'
      thread: sit-ins
      c: 'High Point: high school students, B. Elton Cox''s group, march from his church to the lunch counters and sit in.
        Shuttlesworth, in from Birmingham to preach for Cox, sees them go; he calls Ella Baker at SCLC in Atlanta: "You must
        tell Martin that we must get with this." Hampton: some twenty-five Hampton Institute students sit in at Woolworth''s,
        the first in Virginia.'
      n: '[[w.morris-origins-of-the-civil]], 201 (High Point, Feb. 11; Shuttlesworth''s call); [[w.morris-origins-of-the-civil]],
        207 (high school students at High Point); [[w.branch-parting-the-waters]], 273 (High Point three days after the Monday;
        Shuttlesworth''s call); [[w.council-student-protest-movement]], 12 (Hampton). Check: the day of Shuttlesworth''s call:
        Branch, "promptly." Check: Carson, 11, gives Hampton''s first sit-in Feb. 10. To check: Floyd McKissick interview,
        Nov. 18, 1978; Fred Shuttlesworth interview, Sept. 12, 1975 (cited by [[w.morris-origins-of-the-civil]], 201 nn.13,
        18); [[w.everette-hampton-sit-ins-and]] (cited by [[w.carson-in-struggle]], 11 n.3). See [[cal.1960-02-08.sit-ins]].
        Names: Shuttlesworth, Baker, King.'
      tags:
