- add:
    entry:
      id: cal.1960-02-12.sit-ins
      when: Feb. 12
      date: '1960-02-12'
      thread: sit-ins
      c: 'Rock Hill, S.C.: about a hundred students of Friendship and Clinton Junior Colleges ask for service at Woolworth''s
        and McCrory''s, the first in South Carolina. Raleigh: police arrest forty-one students sitting in at the Cameron Village
        Woolworth''s, the first mass arrests. DeLand, Fla.: the first sit-in in Florida. Nashville: some five hundred new
        volunteers and the seventy-five of the nonviolence workshop at First Baptist Church; Lawson instructs them late into
        the night.'
      n: '[[w.council-student-protest-movement]], 5 (DeLand); [[w.council-student-protest-movement]], 10 (Rock Hill); [[w.meier-core]],
        104 (Rock Hill: over a hundred students, sit-ins and pickets); [[w.morris-origins-of-the-civil]], 201 (Rock Hill,
        C. A. Ivory''s group); [[w.carson-in-struggle]], 11 (Raleigh''s arrests); [[w.carson-in-struggle]], 31 (Rock Hill);
        [[w.branch-parting-the-waters]], 274 (Rock Hill, Raleigh, Nashville). To check: McCain, Report, Feb. 8–29, 1960, CORE
        Archives; McCain to Robinson, Feb. 9, 23, 1960, CORE Archives; Rock Hill Evening Herald, Feb. 12, 1960; [[w.council-student-protest-movement-winter]],
        xxi, 5 (cited by [[w.meier-core]], 104 n.8); Floyd McKissick interview, Nov. 18, 1978 (cited by [[w.morris-origins-of-the-civil]],
        201 n.13); Atlanta Daily World, Feb. 13, 1960, 1 (cited by [[w.branch-parting-the-waters]], 274 n.2); interviews:
        John Lewis, May 31, 1984 (Branch); Viorst, *Fire in the Streets*, 107 (cited by [[w.branch-parting-the-waters]], 274
        n.3). See [[cal.1960-02-08.sit-ins]]. Names: Lawson.'
