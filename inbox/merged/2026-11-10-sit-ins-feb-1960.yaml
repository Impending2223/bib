      when: Feb. 13
      date: '1960-02-13'
      thread: sit-ins
      c: 'Nashville: students of Fisk, Tennessee A&I and the American Baptist Theological Seminary, sent out from First Baptist
        Church, sit in at the downtown counters, Woolworth''s among them, the first in Tennessee. Tallahassee: nine Florida
        A&M students sit in at Woolworth''s.'
      n: '[[w.council-student-protest-movement]], 5 (Tallahassee); [[w.council-student-protest-movement]], 11 (Nashville:
        forty students at Woolworth''s); [[w.morris-origins-of-the-civil]], 206 (Nashville, Saturday, Feb. 13); [[w.branch-parting-the-waters]],
        274 (Nashville: five hundred, from First Baptist, the morning after the mass meeting); [[w.meier-core]], 104 (Tallahassee
        CORE''s first sit-in, the day after Rock Hill''s). Check: the count at Nashville: the Southern Regional Council gives
        forty; Branch, five hundred. To check: Kelly Miller Smith interview, Oct. 13, 1978 (cited by [[w.morris-origins-of-the-civil]],
        206 n.34); Florida State University Flambeau, Mar. 15, 1960 (cited by [[w.meier-core]], 104 n.8); [[w.halberstam-children]];
        [[w.lewis-walking-with-the-wind]]. See [[cal.1960-02-08.sit-ins]].'
