      c: Fiscal 1960 closes in forty-six States. The fifty State governments' taxes for the year $18.0 billion, $100.64 a
        head; federal aid $6.4 billion; long-term debt $18.1 billion (Census).
      n: Census, [*Compendium of State Government Finances in 1960*](https://www2.census.gov/programs-surveys/gov-finances/datasets/historical/1900-1992%20State%20Government%20Finance.zip)
        (G-SF60-No. 2, 1961), tables 3, 4, 5, 12, 25, 35, 37; [[w.bureau-data-base-on-historical]]; [[w.bureau-data-base-on-historical-2010]].
