    set:
      n: '[FRUS 1961–63, XVIII, doc. 154](https://history.state.gov/historicaldocuments/frus1961-63v18/d154) (Rusk to Kennedy, Feb. 9). [[w.fursenko-khrushchevs-cold-war]], 511 (Feb. 8, 1963: elements of the Ba''ath overthrow and kill Qasim; the CIA''s part, by later accounts: the gloss); [[w.poole-joint-chiefs-of-staff]], 237; [[w.brothers-in-arms]], 385–386 (Deng Xiaoping''s speech of July 12, 1963, in the Soviet record: misled by Moscow''s line of peaceful transition, the Iraqi Communist Party is caught unprepared by the coup of Feb. 8 and suffers heavy losses). To check: [[w.batatu-old-social-classes-and]]; [[w.tripp-history-of-iraq]]; [[w.matthews-kennedy-administration-counterinsurgency-and]]; [[w.gibson-sold-out]]. See [[cal.1961-12-11.middle-east]]. Names: Qassim, Arif.'
      gloss:
        title: Commentary
        text:
        - 'Sa''adi (by 1999, as Andrew and Patrick Cockburn quote him): "[W]e came to power on a CIA train" ([[w.fursenko-khrushchevs-cold-war]], 511 & n.66).'
