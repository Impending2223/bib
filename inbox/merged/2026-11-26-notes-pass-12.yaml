- edit:
    id: cal.1963-02-06.china-leadership-3
    base: 1017c923
    set:
      time: 1963-02-06T07:00Z
      time_zone: Asia/Shanghai
      n: '[[w.zhou-enlai-nianpu-1949]], II, 531 (Feb. 6–9, 1963); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 570–571 (Feb. 6–9, 1963; Liu presides at the meeting of Politburo members, Secretariat members and the first secretaries of the regional bureaus, which discusses city fairs and trade, grain, wages, thrift and the five-antis campaign to prepare the Central Work Conference; on Feb. 6 he says to break regional blockades and organize a national market, and that individual traders and cooperative-shop staff should earn somewhat more than state-trade staff, having no free medical care, labor insurance or welfare); [[w.yang-shangkun-riji]], II, 250–251 (Feb. 6–9, 1963; the small work conference 小型工作会议, 3 to 6 p.m. each day: Feb. 6, rural markets; Feb. 7, "increase production and practice economy" and the five-antis; Feb. 8, grain, to 6:30; Feb. 9, streamlining and labor and wages, to 6:30; Yang there); [[w.deng-xiaoping-nianpu-1904]], III, 1745–1746 (Feb. 6–9, 1963; Deng attends the meeting Liu Shaoqi presides over of Politburo and Secretariat members and the first secretaries of the Central Committee''s regional bureaus, on fairs in the large and medium cities, grain, labor and wages, thrift and the ''five-antis'' in the cities, to prepare the work conference); [[w.jian-zhou-enlai]], 486–487 (at the enlarged Politburo and Secretariat Liu chairs, Mao intervenes: will revisionism appear here? only socialist education will avoid it); [[w.peng-zhen-nianpu-1902]], IV, 244 (Feb. 6–9, 1963; Peng Zhen at the meeting Liu Shaoqi calls of the Politburo, the Secretariat and the regional bureaus'' first secretaries on city fairs, grain, labor and wages, more output and thrift and the "five antis" in the cities; Feb. 8, Peng Zhen on the "five antis": they must be done, the time ripe; many grafters and thieves, cadres taking more than their share, or revisionism and capitalism will come, departmentalism and bureaucracy their hotbed; small waste and privilege now, ordinary graft of 1961–62, great grafters all accounts old and new; fear of hurting output and too wide an attack; right hand on output, left on the movement; three stages, cadres first "washing hands and bathing"; more output and thrift the center; three fronts, revisionism abroad and at home and more output and thrift; men set to output; Liu Shaoqi: the paper revised for the work conference); [[w.zhu-de-nianpu-xinbian]], III, 1863–1864 (Feb. 7, 1963; Zhu De 朱德 at the meeting of the Politburo, the Secretariat and the regional bureaus'' first secretaries Liu Shaoqi 刘少奇 holds Feb. 6–9 in the Huairen Tang 怀仁堂, Zhongnanhai 中南海, on the fairs of the large and middle cities, grain, labor, wages, increasing production and practicing economy, and a "five-anti" 五反 campaign in the cities). The time is the first day''s: Yang Shangkun has each session from 3 p.m. ([[w.yang-shangkun-riji]], II, 250). Made public: 1996. To check: [[w.xianzhi-mao-zedong-zhuan-1949]], 1271 (cited by [[w.jian-zhou-enlai]], 487 n.102). See [[cal.1963-02-05.china-leadership]]. Names: Zhou Enlai, Liu Shaoqi.'
- add-words:
    id: cal.1963-02-06.china-leadership-3
    after: end
    words: 'Peng Zhen attends; Feb. 8 he speaks on the five-antis: they must be done, the time is ripe; grafters are numerous and cadres take more than their share, and unless that is met revisionism and the capitalist road follow, with departmentalism and bureaucracy their hotbed; three stages, cadres first washing their hands; more output and thrift the center.'
