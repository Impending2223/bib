      when: June 19
      date: '1967-06-19'
      thread: vietnam-elections
      c: 'Bunker to Rusk, eyes only, through the CIA, Saigon 8185: "If Ky were not virtually certain to win, whether by proper
        or improper means and if he were not on balance the best available candidate, though not exactly a prize package,"
        the problem could be seen otherwise. To restore faith in Kỳ, persuade him to remove Loan, and Thiệu to withdraw; Kỳ
        lacks the experience to run his campaign without sounder advice.'
      n: '[FRUS 1964–68, V, doc. 209](https://history.state.gov/historicaldocuments/frus1964-68v05/d209). [[w.gibbons-u-s-government-and]],
        IV, 768. Made public: FRUS 1964–68, V (2002). Check: Gibbons''s text dates the cable July 19; his note and FRUS, June
        19. See [[cal.1967-06-15.vietnam-elections]]. Names: Bunker, Rusk, Kỳ, Loan, Thiệu.'
