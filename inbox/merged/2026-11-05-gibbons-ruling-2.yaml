      when: Feb. 27
      date: '1967-02-27'
      thread: vietnam-guam
      c: 'Rostow to Johnson, a memorandum and a proposed agenda for the Guam conference: "One of the greatest virtues of the
        meeting is that it will force Ky and Thieu to stay together"; if they have not settled which will run, Johnson may
        have to take Thiệu "up on a mountain" and let him see that leading the military "is his destiny" for five years.'
      n: '[[w.gibbons-u-s-government-and]], IV, 610. To check: Rostow to Johnson, Feb. 27, 1967, with a proposed agenda for
        Guam, NSF Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 610 n.11).
        Names: Rostow, Johnson, Kỳ, Thiệu.'
