    entry:
      id: cal.1967-12-20.vietnam-support
      when: Dec. 20
      date: '1967-12-20'
      thread: vietnam-support
      c: 'Freedom House issues "The United States and Eastern Asia," the report of Asian scholars from a three-day conference
        begun by Roche with Scalapino, Reischauer, Pye and Lockwood among them: "To avoid a major war in the Asia-Pacific
        region, it is essential that the United States continue to deter, restrain, and counterbalance Chinese power." Against
        escalation to a regional or global war; "seize and hold," not "search and destroy."'
      n: '[[w.gibbons-u-s-government-and]], IV, 894 n.110. See [[cal.1967-12-14.vietnam-support]]. Names: Roche, Reischauer.'
      src:
