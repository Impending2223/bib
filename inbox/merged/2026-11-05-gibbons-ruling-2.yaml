      when: June 21
      date: '1967-06-21'
      thread: soviet-union
      also:
      - vietnam-diplomacy
      c: 'Rostow to Johnson, 6:15 p.m., "The case for seeing Kosygin": at home it will cover his flank "to the left and among
        the columnists"; a 20 percent chance of a net favorable effect on Soviet-American policy, "well under 10%" of making
        things worse. The serious case for talking is Vietnam: Kosygin has dropped "permanent" from his bombing formula.'
      n: '[FRUS 1964–68, XIV, doc. 223](https://history.state.gov/historicaldocuments/frus1964-68v14/d223). [[w.gibbons-u-s-government-and]],
        IV, 719–20. Made public: FRUS 1964–68, XIV (2001). Names: Rostow, Johnson, Kosygin.'
