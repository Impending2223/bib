    entry:
      id: cal.1967-08-19.opinion
      when: Aug. 19
      date: '1967-08-19'
      thread: opinion
      also:
      - vietnam-commitments
      c: 'The Associated Press''s survey of the Senate: of 84 willing to say, 40 disapprove of what Johnson is doing in Vietnam,
        hawks among them; 44 support him. McCarthy, Aiken and Cooper: Congress did not foresee a major war when it passed
        the Tonkin Gulf resolution, but no point in rescinding it. Aiken: the President "knows perfectly well it''s impossible
        to rescind. . . . We''re in a war now."'
      n: '[[w.gibbons-u-s-government-and]], IV, 815. To check: *Washington Post*, Aug. 20, 1967 (cited by [[w.gibbons-u-s-government-and]],
        IV, 815 n.59). Check: Gibbons gives 26 Democrats and 19 Republicans among the 40. Names: Johnson, McCarthy, Aiken,
        Cooper.'
      src:
