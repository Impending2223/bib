    entry:
      id: cal.1967-10-21.war-opposition-2
      when: Oct. 21–22
      date: '1967-10-21'
      thread: war-opposition
      also:
      - intelligence
      c: The march's weekend. Army Security Agency units, authorized against tradition and the regulations, monitor citizen,
        police, taxi and amateur bands from 36 listening posts in the Pentagon and around Washington; Army agents report on
        the line of march and photograph the crowds; Task Force Washington coordinates. The Army's intelligence chief asks
        the NSA for information on foreign efforts to influence "peace" or "Black Power" groups.
      n: '[[w.gibbons-u-s-government-and]], IV, 865. To check: Senate Select Committee to Study Governmental Operations with
        Respect to Intelligence Activities, *Final Report*, bk. II (1976), 108 (cited by [[w.gibbons-u-s-government-and]],
        IV, 865 n.55). Made public: the Senate Select Committee''s *Final Report*, 1976. See [[cal.1967-10-21.war-opposition]].'
      src:
        c: 9bd2dc98
        rows:
        - 'w.gibbons-u-s-government-and IV, 865: all'
- add:
    entry:
      id: cal.1967-10-21.war-opposition-3
      when: Oct. 21–22
      date: '1967-10-21'
      thread: war-opposition
      c: During the march, McNamara, but for the meeting with Souvanna Phouma, in his Pentagon office or a command center
        there, with Vance, Wheeler, Ramsey Clark and Warren Christopher. At the White House "a tense White House, the feeling
        of siege," by Christian's account; Johnson, by Tom Johnson's, watches the television news all weekend.
      n: '[[w.gibbons-u-s-government-and]], IV, 867 (McNamara, years later, to Paul Hendrickson of the *Washington Post*:
        the demonstrators "terrifying... I was scared"; "if 50,000 people had been disciplined and I had been the leader,
        I absolutely guarantee you I could have shut down the whole goddam place"). To check: [[w.small-johnson-nixon-and-the]],
        117 (cited by [[w.gibbons-u-s-government-and]], IV, 867 n.63). See [[cal.1967-10-21.war-opposition]]. Names: McNamara,
        Souvanna Phouma, Vance, Wheeler, Ramsey Clark, Christopher, Christian, Johnson.'
