      id: cal.1967-03-22.vietnam-congress-2
      when: Mar. 22
      date: '1967-03-22'
      thread: vietnam-congress
      c: 'McCormack, given leave to speak out of order, to the House on the letters Hanoi published the day before: they make
        public "what some of us in the leadership have known all along," that Johnson "has been making the most serious efforts
        to bring peace." Gallagher: "a rising and standing ovation" for the Speaker on both sides of the aisle. Albert, Kelly
        and Whitener with him.'
      n: '[113 Cong. Rec. 7647–48](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt6/pdf/GPO-CRECB-1967-pt6-4-2.pdf#page=35)
        (House, Mar. 22, 1967). [[w.gibbons-u-s-government-and]], IV, 520 n.114. Check: Gibbons gives vol. 112 for 113. See
        [[cal.1967-03-21.vietnam]]. Names: McCormack, Gallagher, Albert, Kelly, Whitener.'
      src:
        c: 99e4d0e1
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt6/pdf/GPO-CRECB-1967-pt6-4-2.pdf#page=35: all'
        - 'w.gibbons-u-s-government-and IV, 520 n.114: A-B'
      tags:
      - name:mccormack-john-w
      - name:gallagher-cornelius-e
      - name:albert-carl
      - name:kelly-edna-f
      - name:whitener-basil-l
