    entry:
      id: cal.1965-12-23.vietnam-pause
      when: Dec. 23
      date: '1965-12-23'
      thread: vietnam-pause
      c: 'After a talk with Moyers, Rusk asks State''s officials for new diplomatic initiatives on Vietnam. U. Alexis Johnson:
        "our best negotiating initiative at this time would be no further initiative"; any move would persuade Hanoi it is
        "primarily dictated by our concern over domestic and international pressures." William Bundy, Meeker and Rostow also
        reply.'
      n: '[[w.gibbons-u-s-government-and]], IV, 125 n.38. To check: the replies, State, Central File, Pol 27 Viet S; Rostow''s
        of Dec. 23, attached to Read to Rusk, Dec. 27, 1965, Lot File 70 D 48 (cited by [[w.gibbons-u-s-government-and]],
        IV, 125 n.38). Names: Moyers, Rusk, U. Alexis Johnson, William Bundy, Meeker, Rostow.'
      src:
        c: 0b514030
        rows:
        - 'w.gibbons-u-s-government-and IV, 125 n.38: all'
        - 'via x.1965-12-27.rostows-of-dec-23-attached-to: all'
