      when: Oct. 3
      date: '1967-10-03'
      thread: war-opposition
      c: 'Johnson to Ramsey Clark, by memorandum: a report the same day on the preparations for the march, "together with
        new FBI information." Clark answers later in the day.'
      n: '[[w.gibbons-u-s-government-and]], IV, 862. To check: Johnson to Ramsey Clark and Clark to Johnson, memoranda, Oct.
