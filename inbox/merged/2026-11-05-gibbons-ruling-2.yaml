      id: cal.1967-06-30.vietnam-diplomacy
      when: June 30
      date: '1967-06-30'
      thread: vietnam-diplomacy
      c: 'William Bundy to Rusk, "Possible Developments in Hanoi, and Their Implications for the Negotiating Situation": two
        signs "that Hanoi may be taking really serious stock," the recall of its key representatives abroad, Bộ among them,
        and a "nibble board" "lighting up" in the past month; "something is at work." A time "to push some buttons or to have
        a third nation push it": the Canadians'' proposal, a bombing halt for a ban on military activity in the DMZ under
        the ICC.'
      n: '[[w.gibbons-u-s-government-and]], IV, 691–92. To check: William Bundy to Rusk, "Possible Developments in Hanoi,
        and Their Implications for the Negotiating Situation," June 30, 1967, State, Lot File 85 D 240 (William Bundy Papers)
        (cited by [[w.gibbons-u-s-government-and]], IV, 691 n.53). See [[cal.1967-06-29.vietnam-congress]]. Names: William
        Bundy, Rusk, Mai Văn Bộ.'
