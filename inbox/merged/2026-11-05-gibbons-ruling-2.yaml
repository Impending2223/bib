      when: June 6
      date: '1967-06-06'
      thread: vietnam-program-5
      c: 'Wheeler to Sharp and Westmoreland, top-secret backchannel, JCS 4200: the "assertions" on which the Draft Presidential
        Memorandum on Westmoreland''s request is "generally based," among them that, short of bombing the population or closing
        an international port, neither politically acceptable, the bombing of the North "has not and cannot succeed" in coercing
        it into a settlement, and that pacification has failed to achieve "significant results."'
      n: '[[w.gibbons-u-s-government-and]], IV, 705, 711. To check: Wheeler to Sharp and Westmoreland, JCS 4200, June 6, 1967,
        Westmoreland Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 705 n.3). Names: Wheeler,
