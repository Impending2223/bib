      - name:westmoreland-william
      - place:saigon
- add:
    entry:
      id: cal.1967-07-09.vietnam-program-5
      when: July 9
      date: '1967-07-09'
      thread: vietnam-program-5
      also:
      - vietnam-pacification
      c: 'Komer to Johnson from Saigon, "eyes only" backchannel, Komer 164: "No matter how many call me a rosy optimist, I
        feel more confident than ever that at long last we are slowly but surely winning war of attrition in South." The bombing
        of the North limits infiltration; with the barrier and stronger raids into Laos it offers "real hope." Rostow sends
        it on to the Ranch, CAP 67721.'
      n: '[[w.gibbons-u-s-government-and]], IV, 729. To check: Komer to the President, Komer 164 from Saigon, July 9, 1967;
        Rostow to the Ranch, CAP 67721, July 9, 1967, C.F. ND 19/CO 312, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 729 n.61). Names: Komer, Johnson, Rostow.'
