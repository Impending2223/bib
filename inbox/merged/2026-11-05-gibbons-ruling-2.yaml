      when: Feb. 27
      date: '1967-02-27'
      thread: vietnam-elections
      c: 'Lodge to the Mission Council: not to "get in bed" with the Thiệu-Kỳ government; "Our aim is to be cool and correct—no
        more, no less"; "If we do anything, we must not get caught."'
      n: '[[w.gibbons-u-s-government-and]], IV, 766. To check: Lodge, statement to the Mission Council, Feb. 27, 1967, Lodge
        Papers, Vietnam Papers, Massachusetts Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 766 n.5).
        Names: Lodge, Thiệu, Kỳ.'
      src:
