      when: June 15
      date: '1967-06-15'
      thread: vietnam-elections
      c: 'Bunker to Johnson, Saigon 28218: "We do not see how dual military candidacies or Thieu''s ultimate joining with
        a civilian ticket can fail to have some divisive effect on the military, especially on regional grounds"; Kỳ "determined
        to run." Direct pressure on Thiệu to withdraw would risk making Kỳ "the ''American candidate.''" State''s reply, June
        16, Washington 212155.'
      n: '[[w.gibbons-u-s-government-and]], IV, 767–68. To check: Saigon to Washington 28218, June 15, 1967, NSF Country File,
        Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 767 n.10); Washington to Saigon 212155, June
        16, 1967, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 768 n.11). Names:
        Bunker, Johnson, Thiệu, Kỳ.'
