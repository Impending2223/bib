      when: Oct., late
      date: 1967-10
      thread: intelligence
      also:
      - war-opposition
      c: Right after the march on the Pentagon, McNamara asks the Under Secretary of the Army to review the Army's role in
        civil disturbances; Defense, Justice, the FBI and the White House meet; an Army task force drafts a Civil Disturbance
        Plan.
      n: '[[w.gibbons-u-s-government-and]], IV, 855. Check: the day. See [[cal.1967-10-21.war-opposition]]. Names: McNamara.'
