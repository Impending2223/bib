- add:
    entry:
      id: cal.1967-12.intelligence
      when: Dec.
      date: 1967-12
      thread: intelligence
      also:
      - war-opposition
      c: 'The Army''s Civil Disturbance Plan approved: "continuous counterintelligence investigations are required to obtain
        factual information on the participation of subversive personalities, groups or organizations" in civil rights or
        antiwar activity that could lead to disturbances. A "domestic war room" in the Pentagon, 150 people, watch teams around
        the clock, able to direct 25 task forces of 1,000 men at once.'
      n: '[[w.gibbons-u-s-government-and]], IV, 855. To check: Senate Select Committee to Study Governmental Operations with
        Respect to Intelligence Activities, *Final Report*, bk. III (1976) (cited by [[w.gibbons-u-s-government-and]], IV,
        855 n.9). Check: the day. Made public: the Senate Select Committee''s *Final Report*, 1976. See [[cal.1967-10.intelligence]].'
      src:
        c: 0a15c7d5
        rows:
        - 'w.gibbons-u-s-government-and IV, 855: all'
        - 'via x.1976.senate-select-committee-to-study-governmental-2: all'
