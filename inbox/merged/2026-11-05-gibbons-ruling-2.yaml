      c: 'Rostow to Johnson, his conclusions before the meeting of Feb. 22, which he will miss: "Keep pouring it on in the
        South"; show progress in pacification and the roads in three to six months; more weight on the North, "step-by-step,
        not convulsively": "the sheriff is coming steadily down the road for them"; tell the Russians that the ten-mile circle
        no longer binds.'
      n: '[FRUS 1964–68, V, doc. 88](https://history.state.gov/historicaldocuments/frus1964-68v05/d88). [[w.gibbons-u-s-government-and]],
