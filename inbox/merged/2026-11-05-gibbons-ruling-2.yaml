      when: May 6
      date: '1967-05-06'
      thread: war-opposition
      c: 'Washington, St. Mark''s Episcopal Church on Capitol Hill: some 70 of a draft-opposition group, chiefly students
        from the New York and Boston areas, meet on strategy before their demonstration at the House Armed Services hearing
        of May 8. Bevel, director of the Spring Mobilization, speaks; the pastor, James R. Adams, attends. Secret Service
        agents present "under suitable guise."'
      n: '[[w.gibbons-u-s-government-and]], IV, 697. To check: Thomas L. Johns, Secret Service, to Johnson, memorandum, May
        12, 1967 (cited by [[w.gibbons-u-s-government-and]], IV, 697 n.75).'
