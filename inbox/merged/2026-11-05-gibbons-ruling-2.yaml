      when: Mar. 1
      date: '1967-03-01'
      thread: vietnam-air-war
      also:
      - press-and-broadcasting
      c: 'Wheeler to Westmoreland, CJCS 1594-67: "a new flood of propaganda, domestic and foreign," that the air campaign
        against the North is ineffective; "substantial rumor" that a "leading Democratic politician" will soon say so in a
        major speech. "Highest authority" wants Westmoreland to give a press conference soon on the air operations'' results
        in "positive terms." Mar. 2, CJCS 1613-67: not to mention the bombing of Laos, or its effect on infiltration.'
      n: '[[w.gibbons-u-s-government-and]], IV, 594. To check: Wheeler to Westmoreland, CJCS 1594-67 and 1613-67, Mar. 1 and
        2, 1967, Westmoreland Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 594 n.105). Names:
        Wheeler, Westmoreland.'
