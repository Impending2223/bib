      when: June 15
      date: '1967-06-15'
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      c: 'Paris. Võ Văn Sung, Mai Văn Bộ''s deputy, at a press briefing: the recent Communist objectives achieved; five lessons,
        among them "know your enemy and break his strategic will" and "maintain a continuous offensive"; "we wish to force
        Americans to eat their soup with chop sticks."'
      n: '[[w.gibbons-u-s-government-and]], IV, 706. To check: Paris to Washington, Airgram A-2006, June 20, 1967, State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 706 n.7). Names: Võ Văn Sung, Mai Văn
        Bộ.'
