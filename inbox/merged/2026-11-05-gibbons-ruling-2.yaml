      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-02.vietnam-congress-armed-services
      when: Feb., early
      date: 1967-02
      thread: vietnam-congress-armed-services
      also:
      - vietnam-supplemental
      c: 'McNamara before House Armed Services on the supplemental authorization for Southeast Asia. Rivers: "many respectable
        people . . . good folks" are "getting weary of the fight." Halleck: "a growing lack of enthusiasm in respect to this
        effort in Vietnam." McNamara agrees: "we are just running out of patience." Laird: if the North withdrew, the southern
        Communists could fight on without its supplies; McNamara has "faith in the ability of the people of South Vietnam."'
      n: '[[w.gibbons-u-s-government-and]], IV, 595–97. To check: House Armed Services Committee, *Fiscal Year 1967 Supplemental
        Authorization for Southeast Asia*, Hearings (1967), 40–44, 142, 153, 157 (cited by [[w.gibbons-u-s-government-and]],
        IV, 596 n.110). Check: the day; Gibbons gives the first two weeks of February; the Daily Digest has McNamara before
        the committee on the supplemental Feb. 3 ([113 Cong. Rec. D39](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=37)).
