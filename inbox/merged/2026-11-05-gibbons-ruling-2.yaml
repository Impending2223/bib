      date: '1967-01-03'
      thread: vietnam-macv
      also:
      - laos
      c: 'Westmoreland to Sharp, MAC 0050: two cover and deception plans he briefed in December not "practical at this time,"
        given "the cost of the effort required to establish credibility" and "stated national policy": Fire Break, an airborne
        operation against the Communists in the Laotian panhandle, and Blue Page, a threatened amphibious landing on the North''s
        southern coast.'
      n: '[[w.gibbons-u-s-government-and]], IV, 534. To check: Westmoreland to Sharp, MAC 0050, Jan. 3, 1967, Westmoreland
        Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 534 n.20). Names: Westmoreland, Sharp.'
      src:
