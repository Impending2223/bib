    entry:
      id: cal.1967-02-17.vietnam-air-war
      when: Feb. 17
      date: '1967-02-17'
      thread: vietnam-air-war
      also:
      - vietnam-force-levels
      c: 'Wheeler to Sharp and Westmoreland, backchannel, JCS 1284-67, after a talk with McNamara: "highest authority" more
        receptive to more military pressure, swayed by the North''s logistic buildup during the Tet standdown, Hồ''s "hardnosed"
        reply and other events. He and McNamara to see the President on "a broadening of the target system in North Vietnam"
        and a faster pace in the South. McNamara asks whether Westmoreland engages the enemy "as speedily and with as much
        force as is prudent"; Wheeler asks Harold Johnson to look at more combat battalions beyond those approved.'
      n: '[[w.gibbons-u-s-government-and]], IV, 558–59. To check: Wheeler to Sharp and Westmoreland, JCS 1284-67, Feb. 17,
        1967, Westmoreland Papers, Message Files, CMH (cited by GIB, IV, 558 n.2). See [[cal.1967-02-17.vietnam]]. Names:
        Wheeler, Sharp, Westmoreland, McNamara, Harold Johnson.'
      src:
        c: ed7056e3
        rows:
        - 'w.gibbons-u-s-government-and IV, 558–59: all'
        - 'via x.1967-02-17.wheeler-jcs-1284-67-to-sharp: all'
      tags:
      - name:wheeler-earle
      - name:sharp-u-s-grant
      - name:westmoreland-william
      - name:mcnamara-robert-s
      - name:johnson-harold-k
- add:
    entry:
      id: cal.1967-02-17.vietnam-air-war-2
      when: Feb. 17
      date: '1967-02-17'
      thread: vietnam-air-war
      also:
      - vietnam-force-levels
      c: 'Sharp and Westmoreland answer Wheeler. Sharp, CINCPAC 170820Z: "most encouraging"; a "good hard offensive push might
        start the ball rolling down hill"; a "good time to try for more freedom to operate in Laos." Westmoreland, MAC 1658:
        the ground war cannot be "significantly" speeded, its pace set by "intelligence, troop availability, and helicopter
        support"; 550,000 for 1967 still valid against the 470,000 approved; "if Pandora''s Box is to be opened and the ceiling
        set by Program IV is to be voided," he will restudy and ask more.'
      n: '[[w.gibbons-u-s-government-and]], IV, 559. To check: Sharp to Wheeler, CINCPAC 170820Z, Feb. 17, 1967, Westmoreland
        Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 559 n.4); Westmoreland to Sharp and Wheeler,
        MAC 1658, Feb. 17, 1967, Westmoreland Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 559
        n.5). Names: Sharp, Westmoreland, Wheeler.'
      src:
        c: 358ad52f
        rows:
        - 'w.gibbons-u-s-government-and IV, 559: all'
        - 'w.gibbons-u-s-government-and IV, 559 n: all'
        - 'w.gibbons-u-s-government-and IV, 559 n: all'
        - 'via x.1967-02-17.sharp-to-wheeler-cincpac-170820z-feb: all'
        - 'via x.1967-02-17.westmoreland-to-sharp-and-wheeler-mac: all'
      tags:
      - name:sharp-u-s-grant
      - name:westmoreland-william
      - name:wheeler-earle
- add:
    entry:
      id: cal.1967-02-17.vietnam-air-war-3
      when: Feb. 17
      date: '1967-02-17'
      thread: vietnam-air-war
      c: 'Rostow to Johnson before the afternoon''s meeting, three strategies against the North: A, "Interdicting or Narrowing
        the Top of the Funnel," mining the harbors and bombing the rail line to China, "the most effective military course"
        at the risk of a Soviet or Chinese reaction; B, "Hammering the middle of the Funnel," eight power plants, 82 percent
        of the North''s remaining capacity, the cement and steel plants, the Hanoi-Haiphong area; C, "Narrowing the broad
        Bottom of the Funnel," mining two river mouths, naval gunfire, more Shining Brass. Not a "maximum campaign against
        the North, convulsively, right now": the power plants next, "thoroughly" but at a "deliberate pace."'
      n: '[[w.gibbons-u-s-government-and]], IV, 560–61. To check: Rostow to Johnson, Feb. 17, 1967, the three strategies,
        NSF, Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 560 n.8). See
        [[cal.1967-02-17.vietnam]]. Names: Rostow, Johnson.'
      src:
        c: 8ff302d1
        rows:
        - 'w.gibbons-u-s-government-and IV, 560–61: all'
        - 'w.gibbons-u-s-government-and IV, 560 n: all'
        - 'via x.1967-02-17.rostow-to-johnson-feb-17-1967: all'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
