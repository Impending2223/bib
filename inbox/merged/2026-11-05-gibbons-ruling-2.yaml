        rows:
        - 'w.gibbons-u-s-government-and IV, 539: all'
- add:
    entry:
      id: cal.1967-01-31.vietnam-congress-armed-services
      when: Jan. 31
      date: '1967-01-31'
      thread: vietnam-congress-armed-services
      c: 'Harold Johnson, Army Chief of Staff, with Resor, before Armed Services and the Defense Appropriations Subcommittee
        in joint executive session. Members who have backed the war: the Administration said the South Vietnamese could hold
        the Delta; why American forces there? Johnson: the area too large for them alone; holding it brings "the type of thing
        that occurred a couple of nights ago," civilians fleeing the Viet Cong fired on by American forces. Symington: "I
        don''t think you can pacify the villages with white people"; "The people of Missouri are getting restless about the
        costs."'
      n: 'Daily Digest, [113 Cong. Rec. D28](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=26)
        (Senate, Jan. 31, 1967: Resor and Harold Johnson). [[w.gibbons-u-s-government-and]], IV, 539–40. Check: Gibbons puts
        the hearing in the last week of January; the Digest has Harold Johnson before the committees Jan. 31. To check: Senate
        Armed Services Committee, Military Procurement Authorizations for Fiscal Year 1968, Hearings (1967), 579, 597, printed
        (cited by [[w.gibbons-u-s-government-and]], IV, 540 n.41). Names: Harold Johnson, Resor, Symington.'
      src:
        c: bf1a7525
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=26: A'
        - 'w.gibbons-u-s-government-and IV, 539–40: all'
        - 'via x.1967-01-31.senate-armed-services-committee-military-procurement: C-E'
      tags:
      - name:johnson-harold-k
      - name:resor-stanley-r
      - name:symington-william-s
- add:
    entry:
      id: cal.1967-01-24.vietnam-operations
      when: Jan. 24
      date: '1967-01-24'
      thread: vietnam-operations
      c: 'DePuy, commanding the 1st Infantry Division, to Joseph Alsop, a personal letter, "Dear Joe": Cedar Falls, just ended,
        "represents THE turning point in the war." His official report: "a blow from which the VC in this area may never recover."'
      n: '[[w.gibbons-u-s-government-and]], IV, 541. To check: DePuy to Joseph Alsop, letter, Jan. 24, 1967, DePuy Papers,
        Military History Institute, quoted in BDM Corporation, The Strategic Lessons Learned in Vietnam (cited by [[w.gibbons-u-s-government-and]],
        IV, 541 n.45); [[w.rogers-cedar-falls-junction-city]], 78 (cited by GIB, IV, 541 n.46). See [[cal.1967-01-08.vietnam]].
        Names: DePuy, Joseph Alsop.'
      src:
        c: 0b42fe4e
        rows:
