- add:
    entry:
      id: cal.1965-11.vietnam-air-war
      when: Nov.
      date: 1965-11
      thread: vietnam-air-war
      c: 'McNamara on JCSM-811-65 of Nov. 10: he will weigh the Chiefs'' recommendations with the other decisions on the war;
        he arranges for Wheeler to see Johnson. Wheeler with Johnson; Johnson asks a joint recommendation with McNamara. McNamara
        to Johnson: the bombing Wheeler proposes is set to be considered in February 1966; not ready to recommend it now,
        State strongly opposed.'
      n: '[[w.gibbons-u-s-government-and]], IV, 105. Check: the days. Names: McNamara, Wheeler, Johnson.'
      src:
        c: a58de345
        rows:
        - 'w.gibbons-u-s-government-and IV, 105: all'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-11-11.vietnam-2
      when: Nov. 11
      date: '1965-11-11'
      thread: vietnam
      c: 'The Mission''s Intelligence Committee, "Estimate of Viet Cong Situation": "The Communists may calculate that this
        alternative," a balance with American forces before a general counteroffensive, "combined with extensive terrorism—a
        course which proved successful against the French—offers the best prospects for wearing down the will and determination
        of the U.S. to continue the war."'
      n: '[[w.gibbons-u-s-government-and]], IV, 106. Check: the day, from the row of the earlier reading; Gibbons''s note
        not read.'
      src:
        c: 33df3d91
        rows:
        - 'w.gibbons-u-s-government-and IV, 106: all'
- add:
    entry:
      id: cal.1965-11.vietnam-force-levels-6
      when: Nov., late
      date: 1965-11
      thread: vietnam-force-levels
      c: 'A few days after Westmoreland''s message of Nov. 23, the estimate of the forces needed for Phase II raised to 200,000,
        from 110,000–115,000. William Bundy: "a drastic step-up, shattering at one blow the scale and force planning."'
      n: '[[w.gibbons-u-s-government-and]], IV, 106. Check: the day. See [[cal.1965-11-23.vietnam-force-levels]]. Names: Westmoreland,
        William Bundy.'
      src:
        c: ad25d607
        rows:
        - 'w.gibbons-u-s-government-and IV, 106: all'
      tags:
      - name:westmoreland-william
      - name:bundy-william
