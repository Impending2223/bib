      when: Aug. 23
      date: '1967-08-23'
      thread: vietnam-commitments
      c: 'Findley before the Foreign Relations Committee for the national commitments resolution. Clark: "the one thing that
        Congress has which we have been completely unwilling to exercise in connection with the Vietnamese situation in both
        Houses is the power of the purse"; "Yesterday, I tried to indicate it in a very mild way."'
