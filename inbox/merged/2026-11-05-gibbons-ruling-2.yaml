      when: Jan. 12
      date: '1967-01-12'
      thread: vietnam-elections
      also:
      - vietnam-saigon
      c: 'State to Lodge, telegram 117709: a government "strong and unified enough to continue to prosecute the war (or to
        negotiate a peaceful settlement)" and broad enough to draw strength from the Viet Cong; the constitutional regime
        likeliest to do both "a genuine alliance or partnership between progressive civilian political and military elements
        and including Southern representation."'
      n: '[[w.gibbons-u-s-government-and]], IV, 765. To check: Washington to Saigon 117709, Jan. 12, 1967, NSF Country File,
        Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 765 n.3). Names: Lodge.'
