      id: cal.1967-05-31.vietnam-hanoi
      when: May 31
      date: '1967-05-31'
      thread: vietnam-hanoi
      c: 'Nguyễn Chí Thanh, head of the Communist forces in the South: "All the strategic objectives set forth and all methods
        used by the U.S. aggressors have been frustrated"; "The U.S. expeditionary troops are on the decline. The puppet troops
        are even worse." The Americans "in a deadlocked and bloody situation."'
      n: '[[w.gibbons-u-s-government-and]], IV, 706. To check: Patrick J. McGarvey, ed., *Visions of Victory: Selected Vietnamese
        Communist Military Writings, 1964–1968* (1969), 116 (cited by [[w.gibbons-u-s-government-and]], IV, 706 n.6). Names:
        Nguyễn Chí Thanh.'
      src:
        c: c4869e7d
        rows:
