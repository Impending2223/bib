      date: 1967-01
      thread: vietnam-macv
      c: 'Westmoreland to Sharp, "Strategy and Concept of Operations for 1967": more American operations against the main
        forces and their bases in the South, the South Vietnamese army chiefly for counterguerrilla work and local security;
        nothing against the sanctuaries. From the Combined Campaign Plan of Nov. 7, 1966.'
      n: '[[w.gibbons-u-s-government-and]], IV, 534. To check: Westmoreland to Sharp, "Strategy and Concept of Operations
        for 1967," Jan. 1967, Westmoreland Papers, History File, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 534 n.19).
        Check: undated; a notation that it was sent in January. Names: Westmoreland, Sharp.'
