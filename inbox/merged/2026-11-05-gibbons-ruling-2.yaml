      when: Nov. 6
      date: '1967-11-06'
      thread: vietnam
      c: 'Rostow to Johnson, with Ginsburgh''s list of Sept. 12, on its most important proposals: "Once we work out such a
        short list, we then must hold our top-level people accountable for moving it and regularly reporting progress"; the
        result he would like from Bunker''s and Westmoreland''s visit.'
      n: '[[w.gibbons-u-s-government-and]], IV, 928. To check: Rostow to Johnson, Nov. 6, 1967, with Ginsburgh to Rostow,
        Sept. 12, 1967, attached, NSF Memos to the President—Walt Rostow, LBJ Library (cited by GIB, IV, 928 n.81). See [[cal.1967-09-12.vietnam-2]].
        Names: Rostow, Johnson, Ginsburgh, Bunker, Westmoreland.'
      src:
        c: 5166b0f4
        rows:
        - 'w.gibbons-u-s-government-and IV, 928: all'
