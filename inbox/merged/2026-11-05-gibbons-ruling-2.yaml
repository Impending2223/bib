      id: cal.1967-02-09.vietnam-diplomacy
      when: Feb. 9
      date: '1967-02-09'
      thread: vietnam-diplomacy
      c: 'Rusk''s news conference: the United States "remains prepared to take the first step and order a cessation of all
        bombing of North Viet-Nam the moment we are assured, privately or otherwise, that this step will be answered promptly
        by a tangible response toward peace." The same day State releases its elaboration of the Fourteen Points, approved
        by Rusk Jan. 27; Point 14: a cessation the moment the step "will be answered promptly by a corresponding and appropriate
        deescalation of the other side."'
      n: 'Secretary Rusk''s News Conference of February 9, [[w.department-of-state-bulletin]], [Feb. 27, 1967, 317](https://archive.org/details/departmentofstat561967unit/page/317/mode/1up);
        Fourteen Points for Peace in Southeast Asia, [[w.department-of-state-bulletin]], [Feb. 20, 1967, 284](https://archive.org/details/departmentofstat561967unit/page/284/mode/1up).
        [[w.gibbons-u-s-government-and]], IV, 507 n.79, 515. Check: Gibbons gives the *Bulletin* of Feb. 13. Names: Rusk.'
      src:
        c: 0acd742e
        rows:
        - 'https://archive.org/details/departmentofstat561967unit/page/317/mode/1up: all'
        - 'https://archive.org/details/departmentofstat561967unit/page/284/mode/1up: all'
        - 'w.gibbons-u-s-government-and IV, 507 n: all'
      tags:
      - name:rusk-dean
- add:
