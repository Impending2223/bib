      id: cal.1967-01-07.vietnam-operations
      when: Jan. 7
      date: '1967-01-07'
      thread: vietnam-operations
      c: 'Deckhouse V. Two battalions of South Vietnamese Marines and one American Marine battalion landing team, about 1,350
        men, land by helicopter and from the sea on the coast of a Delta province. A week''s search finds none of the Communists
        reported there: warned in advance, they avoid contact, and snipe.'
      n: '[[w.gibbons-u-s-government-and]], IV, 539. To check: [[w.telfer-u-s-marines-in]], 151 (cited by [[w.gibbons-u-s-government-and]],
        IV, 539 n.39).'
