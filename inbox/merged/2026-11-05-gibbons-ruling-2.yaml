      when: June 12
      date: '1967-06-12'
      thread: vietnam-pacification
      c: 'Holbrooke to Leonhart, "Binh Chanh and the Misuse of Force": the withdrawal of the Fairfax forces twice put off,
        to after the September election; while the Viet Cong''s infrastructure stays "virtually intact," the American troops
        will serve chiefly to guard the government''s strongpoints.'
      n: '[[w.gibbons-u-s-government-and]], IV, 714. To check: Holbrooke to Leonhart, "Binh Chanh and the Misuse of Force,"
        June 12, 1967, State, Lot File 70 D 48 (cited by [[w.gibbons-u-s-government-and]], IV, 714 n.18). See [[cal.1967-05-24.vietnam-pacification]].
        Names: Holbrooke, Leonhart.'
