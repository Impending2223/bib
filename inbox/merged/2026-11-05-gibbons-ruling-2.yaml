      when: Aug. 8
      date: '1967-08-08'
      thread: vietnam-air-war
      also:
      - vietnam-congress-armed-services
      c: 'Rostow to Johnson: a "roundup session" before Wheeler testifies to the Stennis subcommittee, to review the targets
        open to attack and why the others are not. Wheeler would be stronger if he could say "flatly that he has been fully
        and personally consulted in all of the major decision made"; Rostow convinced Wheeler "wishes to defend our bombing
        policy." No roundup held.'
      n: '[[w.gibbons-u-s-government-and]], IV, 745. See [[cal.1967-08-09.vietnam]]. Names: Rostow, Johnson, Wheeler.'
