      id: cal.1967-06-01.vietnam-air-war
      when: June 1
      date: '1967-06-01'
      thread: vietnam-air-war
      c: 'Helms to McNamara, the CIA''s reply to "Bombing Options," memorandum 196752/67, "Alternative Programs for Bombing
