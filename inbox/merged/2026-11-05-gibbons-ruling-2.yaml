      when: June 20
      date: '1967-06-20'
      thread: vietnam-elections
      c: 'Jorden to Rostow, "Ambassador Bunker''s Proposals": "I don''t think they will work"; against the Mission''s view,
        shared by State, "that Ky is the only choice"; four good men to work with Kỳ, Thiệu, Hương and Sửu; a "power play
        against Thieu would backfire badly"; money for Kỳ a "bad idea." Put "real heat on Ky" over the police, censorship
        and his use of the government.'
