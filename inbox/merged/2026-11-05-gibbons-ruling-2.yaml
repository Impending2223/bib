    entry:
      id: cal.1967-10.war-opposition-2
      when: Oct.
      date: 1967-10
      thread: war-opposition
      also:
      - intelligence
      c: 'Before the march, the Army Intelligence Command "went all out": agents of every Military Intelligence group ride
        the buses and trains to Washington; others with FBI agents question the managers of charter bus companies, some of
        which break their contracts with antiwar groups; others count demonstrators and buses at armories. Agents penetrate
        the groups planning the march.'
      n: '[[w.gibbons-u-s-government-and]], IV, 864–65. To check: Senate Select Committee to Study Governmental Operations
        with Respect to Intelligence Activities, *Final Report*, bk. III (1976), 796, 808 (cited by [[w.gibbons-u-s-government-and]],
        IV, 865 n.53). Check: the days. Made public: the Senate Select Committee''s *Final Report*, 1976. See [[cal.1967-10-21.war-opposition]].'
      src:
