      thread: vietnam-pacification
      c: 'Kissinger to Lodge, a long letter: "I am deeply persuaded that Vietnam is the hinge of our national effort where
        success and failure will determine our world role for decades to come"; the government "in a precarious position,"
        its authority in the countryside weak.'
      n: '[[w.gibbons-u-s-government-and]], IV, 83–84 n.19. See [[cal.1965-11-10.vietnam]]. Names: Kissinger, Lodge.'
