      when: Dec. 8
      date: '1967-12-08'
      thread: vietnam
      c: 'The CIA, Intelligence Memorandum SC08753/67, "A Review of the Situation in Vietnam": the long-term trends against
        the Communists, but Hanoi has adapted its tactics to American pressure and to deny the security pacification needs;
        Rolling Thunder an increasingly heavy burden, yet no significant deterioration; the North willing and able to accept
        the cost "at least at present levels."'
      n: '[[w.gibbons-u-s-government-and]], IV, 941–42. To check: CIA Intelligence Memorandum SC08753/67, "A Review of the
        Situation in Vietnam," Dec. 8, 1967, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
