      when: July 12
      date: '1967-07-12'
      thread: vietnam-air-war
      also:
      - vietnam-program-5
      c: 'Bunker to Johnson, his summary of the talks with McNamara in Saigon: "maintain our bombing of North Vietnam through
        the remaining months of good weather. We can then decide whether to cut back to the 20th parallel and whether we then
        think a pause to test out Hanoi''s intentions would be advisable."'
      n: '[[w.gibbons-u-s-government-and]], IV, 729. To check: [[w.bunker-papers]], cable of July 12, 1967 (cited by [[w.gibbons-u-s-government-and]],
        IV, 729 n.60). Names: Bunker, Johnson, McNamara.'
