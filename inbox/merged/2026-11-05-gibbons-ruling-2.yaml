      id: cal.1967-10.vietnam-congress-5
      when: Oct.
      date: 1967-10
      thread: vietnam-congress
      c: 'Morris Udall announces he has been wrong: "start bringing American boys home and start turning this war back to
        the Vietnamese." A halt to the bombing, enclaves for American forces, a negotiated settlement. "I refuse any longer
        to accept a tortured logic which allows little mistakes to be admitted, but requires big ones to be pursued to the
        bitter end."'
      n: '[[w.gibbons-u-s-government-and]], IV, 834. Check: the day and the occasion; Gibbons''s note (n.113) not legible
        in the copy. See [[cal.1967-10-18.vietnam-congress]]. Names: Udall.'
