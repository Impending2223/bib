      when: Mar. 15
      date: '1967-03-15'
      thread: vietnam-support
      c: 'Abbott Washburn, of Washburn, Stringer Associates, once of the USIA and an "Eisenhower Republican," to Rostow, a
        letter and memorandum: support for the war "transcends party." Three steps: Johnson to "go to the people" in weekly
        ten-minute televised "fireside chats"; meetings with "opinion leaders" around the country; a bipartisan national citizens''
        committee.'
      n: '[[w.gibbons-u-s-government-and]], IV, 603–04. To check: Washburn to Rostow, letter and memorandum, Mar. 15, 1967,
        attached to Rostow to Johnson, Mar. 17, 1967, Ex ND 19/CO 312, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 604 n.141). Names: Washburn, Rostow.'
