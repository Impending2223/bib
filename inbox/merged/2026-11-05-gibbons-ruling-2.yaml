      when: May 24
      date: '1967-05-24'
      thread: vietnam-pacification
      c: 'Burnham, a provincial representative, and Holbrooke to Komer, "Binh Chanh": Bình Chánh, the district south of Saigon,
        first priority of the Hợp Tác plan since 1964, "unusually bad"; "The pacification program is virtually non-existent";
        the Viet Cong, despite Fairfax, "as well entrenched in Binh Chanh as they were when it became our highest priority
        area."'
      n: '[[w.gibbons-u-s-government-and]], IV, 714. To check: Burnham and Holbrooke to Komer, "Binh Chanh," May 24, 1967,
        State, Lot File 70 D 48 (cited by [[w.gibbons-u-s-government-and]], IV, 714 n.16). Names: Holbrooke, Komer.'
      src:
        c: 05dfa676
        rows:
