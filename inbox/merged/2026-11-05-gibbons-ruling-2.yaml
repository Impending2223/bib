      c: 'Sharp to the Joint Chiefs, 252126Z: "The importance of Cambodia as sanctuary and as a source of supplies, particularly
        rice, cannot be overemphasized"; if pressure short of force fails, "we must be prepared in all respects to use the
        necessary degree of force." He urges again attacks on Haiphong and a heavier Rolling Thunder. The Chiefs agree.'
