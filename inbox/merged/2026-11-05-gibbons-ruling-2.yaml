- add:
    entry:
      id: cal.1967-10-07.opinion
      when: Oct. 7
      date: '1967-10-07'
      thread: opinion
      also:
      - elections-1968
      c: 'The *New York Times*''s survey of governors and members of Congress: "increased sentiment for less military action
        and more negotiations"; "a discernible polarization of Vietnam sentiment," the middle splitting to the doves and to
        an all-out offensive. More than two-thirds report rising criticism of the war; unless it changes, Johnson will run
        in 1968 against criticism "from two directions."'
