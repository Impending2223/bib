      tags:
      - name:holbrooke-richard-c
      - name:komer-robert-w
      - province:gia-dinh
- add:
    entry:
      id: cal.1967-06-05.vietnam-pacification
      when: June 5
      date: '1967-06-05'
      thread: vietnam-pacification
      c: 'Holbrooke, back from Vietnam, to Leonhart, "Some Observations about the Success and Importance of Pacification in
        Vietnam": "The 1967 pacification program is in deep trouble almost everywhere in Vietnam"; around Saigon, nothing
        significant done to eliminate the Viet Cong''s shadow government. The people, with "no feeling that either side in
        the war is on their side," and "scared," will not name the cadre or form militias. The aid program unable to build
        local government; the CIA''s "made in America" programs.'
      n: '[[w.gibbons-u-s-government-and]], IV, 712–14. To check: Holbrooke to Leonhart, "Some Observations about the Success
        and Importance of Pacification in Vietnam," June 5, 1967, State, Lot File 70 D 48 (cited by [[w.gibbons-u-s-government-and]],
        IV, 713 n.15). Names: Holbrooke, Leonhart.'
      src:
        c: 6f244c98
        rows:
