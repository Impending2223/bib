      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1967-06-24.soviet-union
      when: June 24
      date: '1967-06-24'
      thread: soviet-union
      also:
      - vietnam-diplomacy
      c: 'Rusk to Johnson for the second Glassboro meeting: an oral message for Kosygin to send Hanoi, the United States ready
        to stop bombing on the assumption that talks begin at once, neither side''s forces to advance across the DMZ; and
        words for Johnson himself: "we are prepared to stop the bombing as a step toward peace," not "merely to remove one-half
        of the war while the other half of the war proceeds without limit."'
      n: '[FRUS 1964–68, XIV, doc. 233](https://history.state.gov/historicaldocuments/frus1964-68v14/d233). [[w.gibbons-u-s-government-and]],
        IV, 723–24. Made public: FRUS 1964–68, XIV (2001). Names: Rusk, Johnson, Kosygin.'
      src:
        c: d0d2d574
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v14/d233: all'
        - 'w.gibbons-u-s-government-and IV, 723–24: all'
        - 'via x.1967-06-24.rusk-to-johnson-june-24-1967: all'
      tags:
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:kosygin-aleksei
