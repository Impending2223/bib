- add:
    entry:
      id: cal.1967-03-22.vietnam-support
      when: Mar. 22
      date: '1967-03-22'
      thread: vietnam-support
      c: 'Washburn, after meeting Kermit Roosevelt and others, to Rostow: a memorandum outlining the national citizens'' committee,
        to back "our fellow Americans in Vietnam" and deny the Communists the advantage of division at home going into an
        election year; "no interest of trying to check the amount of criticism," but to give a "banner and voice" to those
        who support the policy. A list of members follows, younger leaders, not the "same old names."'
      n: '[[w.gibbons-u-s-government-and]], IV, 604–05. To check: Washburn to Rostow, memorandum, Mar. 22, 1967, Ex ND 19/CO
        312, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 604 n.143). See [[cal.1967-03-15.vietnam-support]].
        Names: Washburn, Rostow, Kermit Roosevelt.'
