      when: July 8
      date: '1967-07-08'
      thread: vietnam-program-5
      c: 'Saigon, that night. McNamara and Westmoreland agree on a compromise on Westmoreland''s request for 100,000 to 200,000
        more: from Systems Analysis''s studies of what can come from existing forces, without more draft calls or the Reserves,
        45,000 more men.'
      n: '[[w.gibbons-u-s-government-and]], IV, 728. See [[cal.1967-07-07.vietnam]]. Names: McNamara, Westmoreland.'
      src:
        c: a1ab7f31
        rows:
