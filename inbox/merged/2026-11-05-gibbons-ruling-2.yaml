      when: Jan. 17
      date: '1967-01-17'
      thread: vietnam-sunflower
      c: 'Moscow. The North Vietnamese ask Guthrie two things of the message of Jan. 10: what the United States means by "completely
        secure arrangements," and what kind of settlement it has in mind.'
      n: '[[w.gibbons-u-s-government-and]], IV, 504. To check: Moscow to Washington 3066, Jan. 17, 1967, State, Central File,
        Pol 27-14 Viet; printed in [[w.herring-secret-diplomacy-of-the]], 415 (cited by [[w.gibbons-u-s-government-and]],
        IV, 504 n.73). See [[cal.1967-01-10.vietnam-sunflower]]. Names: Guthrie.'
      src:
        c: 8b5b5a6c
        rows:
        - 'w.gibbons-u-s-government-and IV, 504: all'
        - 'w.gibbons-u-s-government-and IV, 504 n: all'
        - 'via x.1967-01-17.moscow-to-washington-3066-jan-17: all'
      tags:
      - name:guthrie-john-c
- add:
    entry:
      id: cal.1967-01-17.vietnam-sunflower-2
      when: Jan. 17
      date: '1967-01-17'
      thread: vietnam-sunflower
      c: 'State to Moscow, 7:30 p.m., telegram 120335, drafted by William Bundy, held for an execute order: Guthrie to tell
        the North Vietnamese chargé that a "completely secure arrangement" means talks disclosed to no other government or
        party but by mutual agreement; and to give seven possible subjects of talks, among them the reduction or cessation
        of hostilities, the withdrawal of forces from outside South Vietnam, reunification, and free political participation
        in the South.'
      n: '[FRUS 1964–68, V, doc. 18](https://history.state.gov/historicaldocuments/frus1964-68v05/d18). [[w.gibbons-u-s-government-and]],
        IV, 504–05. Made public: FRUS 1964–68, V (2002). To check: [[w.herring-secret-diplomacy-of-the]], 417 (cited by [[w.gibbons-u-s-government-and]],
        IV, 505 n.74). See [[cal.1967-01-10.vietnam-sunflower]]. Names: William Bundy, Guthrie.'
      src:
        c: e5c41015
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d18: all'
        - 'w.gibbons-u-s-government-and IV, 504–05: all'
        - 'w.gibbons-u-s-government-and IV, 505 n: all'
        - 'via x.1967-01-17.washington-to-moscow-120335-jan-17: all'
      tags:
      - name:bundy-william
      - name:guthrie-john-c
      - name:rusk-dean
