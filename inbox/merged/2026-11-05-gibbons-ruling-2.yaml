      id: cal.1967-10-04.vietnam-4
      when: Oct. 4
      date: '1967-10-04'
      thread: vietnam
      c: 'The Joint Chiefs'' report, JCSM-505-67: progress slow, "largely because US military power has been restrained in
        a manner which has reduced significantly its impact and effectiveness": attacks so prolonged and graduated that the
        enemy has adjusted; sanctuaries with important military targets left to him. Johnson approves it.'
      n: '[[w.gibbons-u-s-government-and]], IV, 925. To check: Wheeler to Westmoreland, JCS 8356, Oct. 5, 1967, Westmoreland
        Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 925 n.71). Names: Johnson.'
