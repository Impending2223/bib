        c: 8b9caf0e
        rows:
        - 'w.gibbons-u-s-government-and IV, 729: all'
        - 'w.gibbons-u-s-government-and IV, 729 n: all'
        - 'via x.1967-07-09.komer-to-the-president-komer-164: all'
