      when: Mar. 1
      date: '1967-03-01'
      thread: vietnam-congress
      also:
      - vietnam-supplemental
      c: 'Aiken in the Senate''s debate, recalling his speech of October 1966: "What is it that we have not won which we still
        seek to win?" The problem "social re-engineering," which only the Vietnamese can do. No withdrawal: American forces
        will stay in Vietnam and Southeast Asia for many years; neither total victory nor withdrawal possible.'
      n: '[[w.gibbons-u-s-government-and]], IV, 592–93. To check: [113 Cong. Rec. 4870](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-5-1.pdf#page=9)
        (Senate, Mar. 1, 1967) (cited by [[w.gibbons-u-s-government-and]], IV, 592 n.101). See [[cal.1967-03-01.vietnam]].
        Names: Aiken.'
      src:
        c: 298b36ad
        rows:
        - 'w.gibbons-u-s-government-and IV, 592–93: all'
        - 'via x.1967-03-01.113-cong-rec-4870-https-www: all'
      tags:
      - name:aiken-george-d
