      when: Aug. 26
      date: '1967-08-26'
      thread: vietnam-macv
      c: 'Westmoreland to Wheeler, MAC 8095, on Rusk''s all-out offensive: Rusk thinks of conventional war, an offensive from
        a secure area against a recognizable front; "Such is not the case in SVN." Three tasks at once compete for the forces:
        the enemy''s sanctuaries in the DMZ area, Laos and Cambodia; offensives against his units, bases and lines of communication;
        security for pacification.'
      n: '[[w.gibbons-u-s-government-and]], IV, 748–49. To check: Westmoreland to Wheeler, MAC 8095, Aug. 26, 1967, Westmoreland
        Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 748 n.106). See [[cal.1967-08-23.vietnam-3]].
        Names: Westmoreland, Wheeler, Rusk.'
