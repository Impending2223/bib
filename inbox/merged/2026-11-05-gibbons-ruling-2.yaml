      when: Aug. 23
      date: '1967-08-23'
      thread: vietnam
      c: 'Wheeler to Westmoreland, JCS 687[?], on the lunch of Aug. 22: Rusk raised an all-out offensive by all forces in
        the South on the broadest front; Wheeler began to answer that Westmoreland seeks the most combat return at all times;
        Johnson told him to think it over and talk the next week.'
      n: '[[w.gibbons-u-s-government-and]], IV, 748. To check: Wheeler to Westmoreland, JCS 687[?], Aug. 23, 1967, Westmoreland
