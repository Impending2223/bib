      - name:nguyen-cao-ky
- add:
    entry:
      id: cal.1967-02-28.vietnam-elections
      when: Feb. 28
      date: '1967-02-28'
      thread: vietnam-elections
      c: 'Komer to Johnson, back from Vietnam: Lodge, Westmoreland, Porter and all the Mission''s senior officials "believe
        that Ky would be at least marginally better than Thieu," and that the winner will come from the military; only Porter
        and Lansdale strongly favor a civilian government. Porter: the generals "have it too good to want the war to end."
        Habib: a civilian regime would fear to negotiate lest it bring a coup.'
