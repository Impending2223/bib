- add:
    entry:
      id: cal.1967-01-03.vietnam-pacification
      when: Jan. 3
      date: '1967-01-03'
      thread: vietnam-pacification
      c: 'Porter, the Deputy Ambassador, to William Bundy, by letter, on Lansdale: "unable to move from the theoretical to
        the practical"; "there can only be one Ambassador at a post"; Lansdale would follow "his own desires" and not inform
        the rest of the Mission. The Senior Liaison Office to be ended.'
      n: '[[w.gibbons-u-s-government-and]], IV, 478. To check: Porter to William Bundy, letter, Jan. 3, 1967, State, Lot File
        85 D 240 (William Bundy Papers) (cited by [[w.gibbons-u-s-government-and]], IV, 478 n.121). Names: Porter, William
        Bundy, Lansdale.'
      src:
        c: cd33e71a
        rows:
        - 'w.gibbons-u-s-government-and IV, 478: all'
        - 'w.gibbons-u-s-government-and IV, 478 n: all'
        - 'via x.1967-01-03.porter-to-william-bundy-letter-jan: all'
      tags:
      - name:porter-william-j
      - name:bundy-william
      - name:lansdale-edward-g
- add:
    entry:
      id: cal.1967-02-09.vietnam-2
      when: Feb. 9
      date: '1967-02-09'
      thread: vietnam
      c: 'Unger, for William Bundy''s East Asia bureau, to Katzenbach on the revised draft of the NSAM on strategic guidelines
        for 1967: a "major improvement"; State to approve it, with some changes. Of its line that the United States cannot
        accept a "retrogression to military government": "no objection to saying ''cannot accept'' for rhetorical purposes,"
        but against ever "laying it on the line in just that form."'
      n: '[[w.gibbons-u-s-government-and]], IV, 494. To check: Unger to Katzenbach, "NSAM—Strategic Guidelines for 1967 in
        Vietnam," Feb. 9, 1967, with the revised draft attached, State, Lot File 70 D 207 (cited by [[w.gibbons-u-s-government-and]],
        IV, 494 n.33). Names: Unger, William Bundy, Katzenbach.'
      src:
        c: b45cf888
        rows:
        - 'w.gibbons-u-s-government-and IV, 494: all'
        - 'w.gibbons-u-s-government-and IV, 494 n: all'
        - 'via x.1967-02-09.unger-to-katzenbach-nsam-strategic-guidelines: all'
      tags:
      - name:unger-leonard
      - name:bundy-william
      - name:katzenbach-nicholas
- add:
    entry:
      id: cal.1967-01-03.vietnam-diplomacy
      when: Jan. 3
      date: '1967-01-03'
      thread: vietnam-diplomacy
      c: 'Rostow to Johnson, 7:10 p.m., with Salisbury''s preliminary report from Hanoi: by Salisbury''s reading, the North
        wants to negotiate and does not know how to arrange talks. Rostow: "conceivable, if not probable, that they are trying
        to get out of the war but don''t know how"; send back only "Your message to Salisbury has been delivered. You will
        be hearing from us soon," then a direct message through Ne Win.'
      n: '[FRUS 1964–68, V, doc. 5](https://history.state.gov/historicaldocuments/frus1964-68v05/d5). [[w.gibbons-u-s-government-and]],
        IV, 501–02. Made public: FRUS 1964–68, V (2002). Check: Gibbons quotes "has been received." Names: Rostow, Johnson,
        Salisbury, Ne Win.'
      src:
        c: e2967608
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d5: all'
        - 'w.gibbons-u-s-government-and IV, 501–02: all'
        - 'via x.1967-01-03.rostow-to-johnson-jan-3-1967: all'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:salisbury-harrison-e
- add:
