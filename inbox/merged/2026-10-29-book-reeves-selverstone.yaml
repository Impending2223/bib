- add:
    entry:
      id: cal.1962-10-08.vietnam-force-levels
      when: Oct. 8
      date: '1962-10-08'
      thread: vietnam-force-levels
      also:
      - vietnam
      c: 'Honolulu. McNamara''s conference on Vietnam with Harkins and Nolting. A B-26 unit flown by Vietnamese into action;
        the Vietnamese air force expanded as fast as possible. McNamara: more American pilots "will be received coolly"; the
        aim "to reduce, not increase, our own combat role." Harkins''s "explosive" operation. No time for his plan to phase
        the Americans out.'
      n: '[FRUS 1961–63, II, doc. 298](https://history.state.gov/historicaldocuments/frus1961-63v02/d298) (Wood''s résumé,
        Oct. 11). [[w.selverstone-kennedy-withdrawal]], 92–93 (the conference; the pilots; the phase-out plan not presented).
        To check: CINCPAC to OSD/ISA, undated, RG 59, NSAM Files, box 6, NARA (cited by [[w.selverstone-kennedy-withdrawal]],
        93 n.69a, for the phase-out). Made public: FRUS 1961–63, II (1990). See [[cal.1962-07-23.vietnam]]. Names: McNamara,
        Harkins, Nolting.'
      tags:
      - name:mcnamara-robert-s
