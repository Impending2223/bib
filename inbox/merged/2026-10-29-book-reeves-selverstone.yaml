- edit:
    id: cal.1963-07-29.economy
    base: 5137c089
    set:
      c: 'Kennedy off the record with Mills, O''Brien and Dillon, by the meeting''s transcript. Mills: his Arkansas constituents
        leave the tax bill to him, "not twisting my arm"; he can pass the bill within a few months, but only if the President
        stresses his commitment to expenditure control. Kennedy asks what offer on civil rights would win a wavering Southern
        Democrat; Mills: "Block it in the Rules Committee."'
      n: '[[w.zelizer-taxing-america]], 201 (by the transcript). [[w.reeves-president-kennedy]], 623 (the meeting; Mills on
        the Rules Committee). To check: "Off-The-Record Meeting With Wilbur Mills, Lawrence O''Brien, C. Douglas Dillon,"
        July 29, 1963, 32 (cited by [[w.zelizer-taxing-america]], 201 nn.89, 91); Transcript of Audiotape 101.4, July 29,
        1963, Presidential Recordings, Kennedy Library (cited by [[w.reeves-president-kennedy]], 623). Check: no recording
        catalogued for the day (PRDE, the Miller Center). See [[cal.1963-01-24.economy]]. Names: Kennedy, Mills, O''Brien,
        Dillon.'
      src:
