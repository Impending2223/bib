      when: July 4
      date: '1963-07-04'
      thread: vietnam
      c: 'The White House, 11 to 11:50 a.m., recorded: Kennedy with Ball, Harriman, Bundy, Hilsman and Forrestal on the Buddhist
        crisis. Getting rid of the Nhus judged not possible; coup attempts expected within four months whatever Diệm does.
        Hilsman: the chances of chaos after a coup much less than a year before. The timing of Nolting''s return and Lodge''s
        arrival discussed.'
