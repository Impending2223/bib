- edit:
    id: cal.1964-02-29.defense
    base: b3d95739
    set:
      c: 'News conference. The A-11, an experimental Lockheed jet flown at more than 2,000 miles an hour and above 70,000
        feet, disclosed; its performance classified; begun in 1959. William Bundy to be Assistant Secretary of State for the
        Far East, McNaughton to take his place at Defense. On Vietnam, the plans in the papers for action against the North:
        "not plans that have come to my attention, or that I have approved."'
      n: 'The President''s News Conference, [1963–64 Pub. Papers 322](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=406)
        (Feb. 29, 1964). [[w.selverstone-kennedy-withdrawal]], 222–23 (Vietnam). See [[cal.1963-10-14.defense]]. Names: Johnson,
        William Bundy, McNaughton.'
