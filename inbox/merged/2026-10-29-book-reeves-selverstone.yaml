- edit:
    id: cal.1963-10-09.trade
    base: 620bb758
    set:
      c: 'Press conference. Private dealers may sell surplus wheat to the Soviet Union and Eastern Europe, for cash or on
        normal credit, in American ships where available: 4 million tons, about $250 million. The NSC agreed. Report to Congress,
        Oct. 10: no action required. On Vietnam: no "significant changes" in the month since he asked for changes of policy
        and personnel.'
      n: 'The President''s News Conference, [1963 Pub. Papers 767](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=825)
        (Oct. 9, 1963); Letter to the President of the Senate and to the Speaker of the House on the Sale of Wheat to the
        Soviet Union, [1963 Pub. Papers 776](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=834)
        (Oct. 10, 1963). Opinion: [42 Op. Att''y Gen. 229](https://archive.org/details/op-atty-gen/042/page/n253/mode/1up)
