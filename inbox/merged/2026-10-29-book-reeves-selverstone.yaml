- add:
    entry:
      id: cal.1962-04-06.vietnam
      when: Apr. 6
      date: '1962-04-06'
      thread: vietnam
      c: 'Kennedy and Harriman, 4:55 p.m., on Galbraith''s memorandum. Harriman: American association with military operations
        to an absolute minimum; the ICC''s coming report a way to seek a common reduction with the Viet Minh; no neutral solution;
        Diệm a losing horse, but nobody to replace him. Kennedy: the memorandum to McNamara for comment; instructions to Galbraith
        on an Indian approach to Hanoi. "Prepared to seize upon any favorable moment to reduce our involvement."'
      n: '[FRUS 1961–63, II, doc. 148](https://history.state.gov/historicaldocuments/frus1961-63v02/d148) (Forrestal''s memorandum).
        [[w.selverstone-kennedy-withdrawal]], 65–66 (the meeting; the de-escalation; the probe of Hanoi; "any favorable moment").
        Made public: FRUS 1961–63, II (1990). See [[cal.1962-04-04.vietnam]]. Names: Kennedy, Harriman, Galbraith, McNamara,
        Ngô Đình Diệm.'
      tags:
      - name:kennedy-john-f
      - name:harriman-w-averell
      - name:galbraith-john-kenneth
      - name:mcnamara-robert-s
      - name:ngo-dinh-diem
