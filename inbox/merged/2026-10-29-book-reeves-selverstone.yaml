        - 'via w.selverstone-kennedy-withdrawal 115 n.83: A-B'
        - 'via w.selverstone-kennedy-withdrawal 115 n.84: C'
- add:
    entry:
      id: cal.1963-05-06.vietnam-force-levels
      when: May 6
      date: '1963-05-06'
      thread: vietnam-force-levels
      also:
      - vietnam
      c: 'Honolulu. McNamara''s eighth conference on Vietnam, with Harkins, Felt and the embassy. Harkins: "we are winning
        the war," though the struggle protracted. McNamara: military assistance for fiscal 1964 cut; the phase-out of Americans
        "too slow"; a plan for the Vietnamese to take over functions so that "1,000 or so" can come out late this year "if
        the situation allows." Harkins against a departure "with bands playing, flags flying."'
      n: '[FRUS 1961–63, III, doc. 107](https://history.state.gov/historicaldocuments/frus1961-63v03/d107) (the conference''s
        record of actions). [[w.selverstone-kennedy-withdrawal]], 120–24, 130 (the conference; the thousand; Harkins''s objection).
        To check: Wood, "The Secretary of Defense''s Honolulu Conference on Viet-Nam 6 May 1963," May 7, 1963, RG 330, OASD/ISA,
        box 4, NARA (cited by [[w.selverstone-kennedy-withdrawal]], 121 n.11); Proceedings of Eighth Secretary of Defense
        Conference, 42, 48 (cited by [[w.selverstone-kennedy-withdrawal]], 121 n.14, 124 n.25); "Plan to Withdraw 1,000 U.S.
        Military by 31 Dec 63," CINCPAC Booklet for SecDef, May 6, 1963, CMH (cited by [[w.selverstone-kennedy-withdrawal]],
        123 n.24). Made public: FRUS 1961–63, III (1991). See [[cal.1963-04-29.vietnam-force-levels]]. Names: McNamara, Harkins,
        Felt.'
      tags:
      - name:mcnamara-robert-s
      - name:harkins-paul-d
      - name:felt-harry-d
      src:
        c: 9bff9aa5
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d107: A-F'
        - 'w.selverstone-kennedy-withdrawal 120–24, 130: A-B, E-G'
        - 'via w.selverstone-kennedy-withdrawal 121 n.11: A, F'
        - 'via w.selverstone-kennedy-withdrawal 121 n.14: E'
        - 'via w.selverstone-kennedy-withdrawal 123 n.24: G'
