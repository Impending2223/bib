      when: Feb. 25
      date: '1964-02-25'
      thread: vietnam-force-levels
      c: 'Johnson to McNamara by telephone, 11:45 a.m., on the withdrawal: "I always thought it was foolish for you to make
        any statements about withdrawing. I thought it was bad psychologically. But you and the President thought otherwise,
        and I just sat silent." McNamara: "we''re right at that point."'
      n: '[Johnson and McNamara, 11:45 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-february-25-1964),
        Conversation WH6402-21-2191 (Miller Center). [[w.selverstone-kennedy-withdrawal]], 222 (the conversation). Check:
        the recording not heard; the words Selverstone''s, from PRDE. See [[cal.1963-12-03.vietnam-force-levels]]. Names:
        Johnson, McNamara.'
