      when: Mar. 5
      date: '1964-03-05'
      thread: vietnam-force-levels
      c: 'McNamara''s news conference before he leaves for Saigon: aid and training "for whatever period it is required."
        "During the next two years, that is by the end of 1965, additional training should be completed"; the men who gave
        it to come back; some to stay indefinitely.'
