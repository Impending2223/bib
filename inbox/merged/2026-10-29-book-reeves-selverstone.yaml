- add:
    entry:
      id: cal.1964-02-27.republican-party-congress
      when: Feb. 27
      date: '1964-02-27'
      thread: republican-party-congress
      also:
      - vietnam
      c: 'Dirksen and Halleck at a press conference for the joint Senate-House Republican leadership: "drifting on the high
        seas of uncertainty and confusion." Halleck: the administration said the war in South Vietnam could be concluded by
        the end of 1965; McNamara now says the United States is withdrawing by then "regardless of the outcome"; Lodge says
        neutralization would turn South Vietnam over to the Communists. Goldwater has their statements printed in the Record.'
      n: '[110 Cong. Rec., Senate, Feb. 27, 1964, 3805](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-10-1.pdf#page=25).
        [[w.selverstone-kennedy-withdrawal]], 225 (Dirksen on McNamara''s statements). Names: Dirksen, Halleck, McNamara,
        Lodge, Goldwater.'
