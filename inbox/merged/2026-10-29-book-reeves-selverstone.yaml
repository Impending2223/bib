    id: cal.1962-02-21.laos
    base: 5bed9955
    set:
      c: 'Laos: Kennedy and Johnson with the congressional leaders, Nam Tha under attack. Mansfield: American forces "worse
        than Korea"; "the worst possible move we could make." Russell: the Laotians will not fight; block any advance from
        Thailand. Arends: only an increase from 5,000 to 8,300 Americans in South Vietnam? Kennedy confirms; the figures not
        announced.'
