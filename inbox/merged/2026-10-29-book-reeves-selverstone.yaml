        9:30 a.m.). [[w.gibbons-u-s-government-and]], II, 113 (by Mansfield''s oral history and Russell''s notes). [[w.selverstone-kennedy-withdrawal]],
        58–59 (the figures for South Vietnam; not to be made public). To check: Mansfield oral history, June 23, 1964, 25,
        Kennedy Library; Russell''s notes, Russell Papers, University of Georgia (cited by [[w.gibbons-u-s-government-and]],
        II, 113 nn.97–98). Names: Kennedy, Johnson, Mansfield, Russell, Arends.'
