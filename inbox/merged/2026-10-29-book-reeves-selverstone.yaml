- add:
    entry:
      id: cal.1963-02-04.vietnam-force-levels
      when: Feb. 4
      date: '1963-02-04'
      thread: vietnam-force-levels
      c: 'Wheeler at a Pentagon press briefing: not to disagree with Felt, but no time limit in a war like this. A plan to
        lower the American presence: "What we are really shooting for is in about three years we would be in a position to
        start making some reductions."'
      n: '[[w.selverstone-kennedy-withdrawal]], 106. To check: "Press Briefing by General Earle G. Wheeler," Feb. 4, 1963,
        box 236, OSD Historical Office (cited by [[w.selverstone-kennedy-withdrawal]], 106 n.37). See [[cal.1963-01-30.vietnam-force-levels]].
        Names: Wheeler, Felt.'
      tags:
      - name:wheeler-earle
      - name:felt-harry-d
      src:
        c: 679bd016
        rows:
        - 'w.selverstone-kennedy-withdrawal 106: all'
        - 'via w.selverstone-kennedy-withdrawal 106 n.37: all'
- add:
    entry:
      id: cal.1963-04-04.vietnam-force-levels
      when: Apr. 4
      date: '1963-04-04'
      thread: vietnam-force-levels
      also:
      - vietnam
      c: 'The White House, 10 a.m. Robert Thompson, with Ormsby Gore, to Kennedy: Diệm the only leader of his caliber; the
        war moving "in our favor"; the strategic hamlets better than expected. If progress holds, one or two provinces white
        by summer and confidence growing through the year: an announcement "out of the blue" of 1,000 fewer American military,
        to show the war being won, take the steam out of the Communists'' line, and reaffirm American intentions. Kennedy
        asks defoliation reviewed.'
      n: '[FRUS 1961–63, III, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v03/d77) (Wood''s memorandum).
        [[w.selverstone-kennedy-withdrawal]], 112–14 (Thompson''s plan, at Honolulu, at State and to Kennedy). To check: Ledward
        to Home, Apr. 6, 1963, FO 371/170111, National Archives (UK) (cited by [[w.selverstone-kennedy-withdrawal]], 114 n.75a).
        Made public: FRUS 1961–63, III (1991). See [[cal.1963-02-04.vietnam-force-levels]]. Names: Thompson, Ormsby Gore,
        Kennedy, Ngô Đình Diệm.'
      tags:
      - name:thompson-robert
      - name:ormsby-gore-david
      - name:kennedy-john-f
      - name:ngo-dinh-diem
      - name:wood-chalmers-b
