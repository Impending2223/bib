        [259](https://history.state.gov/historicaldocuments/frus1961-63v04/d259), [273](https://history.state.gov/historicaldocuments/frus1961-63v04/d273).
        Kennedy, Oval Office recordings on Vietnam (Viet. II.J). [S. Rep. No. 94-465](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf)
        (1975). [[w.miller-misalliance]], 315–24 (319–24: the coup, the call at 4:30, the flight to Cholon, the church, the
        armored car; not Conein, nor the killing); [[w.gibbons-u-s-government-and]], II, 200–02; [[w.kaplan-mcnamara-ascendancy-1961-1965]],
        290 (the coup; the brothers dead Nov. 2); [[w.schulimson-joint-chiefs-of-staff]], 393 (the coup; the deaths); [[w.marolda-united-states-navy-and]],
        273 (the coup, Nov. 1); [[w.futrell-united-states-air-force]], 191 (the coup; Diệm and Nhu''s flight, surrender and
        killing); [[w.staaveren-u-s-air-force]], 20 (the junta under Minh; Diệm and Nhu killed); [[w.asselin-hanois-road-to-the]],
        160 (Diệm and Nhu killed; Minh at the head); [[w.moyar-triumph-forsaken]], 265–73 (267: the coup from 1:45 p.m., Conein
        at the Joint General Staff; 269: the call at 4:30 and Lodge''s record of it; 270–72: the tunnel, Cholon, the church;
        272–73: the killing in the carrier). [[w.reeves-president-kennedy]], 643–49 (the coup; the call; the deaths). To check:
        [[w.ahern-cia-and-the-house-2000]]; [[w.hammer-death-in-november]]; [[w.prados-jfk-and-the-diem]]; [[w.winters-year-of-the-hare]];
        [[w.jones-death-of-a-generation]]; [[w.kaiser-american-tragedy]]; [[w.kahin-intervention]]; [[w.jacobs-cold-war-mandarin]];
