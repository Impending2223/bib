      when: Sept. 25
      date: '1962-09-25'
      thread: vietnam
      c: 'Taylor, back from the Far East, reports to Kennedy, 5 p.m.: the war in Vietnam going better. Nothing of Thompson''s
        token reduction of Americans, put to him in Saigon Sept. 13.'
      n: '[Meeting with Maxwell Taylor on His Far Eastern Trip](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-maxwell-taylor-his-far-eastern-trip),
        Tape 23 (Miller Center). [[w.selverstone-kennedy-withdrawal]], 89–90. To check: Thompson, "Record of Meeting with
        General Taylor," Sept. 13, 1962 (cited by [[w.selverstone-kennedy-withdrawal]], 90 n.53). Check: the recording not
        heard; its time PRDE''s. See [[cal.1962-07-23.vietnam]]. Names: Taylor, Kennedy, Thompson.'
      tags:
