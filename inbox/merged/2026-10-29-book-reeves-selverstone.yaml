      when: Dec. 2
      date: '1963-12-02'
      thread: vietnam-force-levels
      c: 'Harkins announces: about 300 American military out of South Vietnam Dec. 3, 700 more in the next two or three weeks,
        1,000 by the end of 1963. "The training of Vietnamese personnel has progressed to the point where the withdrawal of
        some US forces is possible."'
      n: '[FRUS 1961–63, IV, doc. 339](https://history.state.gov/historicaldocuments/frus1961-63v04/d339) (editorial note,
        the statement''s text). [[w.selverstone-kennedy-withdrawal]], 209–10 (the first 300; the thousand largely ordinary
        rotation, the Americans in Vietnam no fewer). See [[cal.1963-11-26.vietnam]]. Names: Harkins.'
