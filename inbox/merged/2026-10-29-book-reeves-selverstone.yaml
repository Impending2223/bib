      when: Feb. 26
      date: '1964-02-26'
      thread: vietnam-force-levels
      c: 'McGeorge Bundy to the Overseas Press Writers, the Sheraton-Carlton: the 1965 date "the likely date at which the
        principal supporting functions ... could in fact be devolved" to the Vietnamese; "nothing to do with whether we would
        continue our basic commitment." The contest not forever confined to the rules set "by those who started the trouble."'
      n: '[[w.selverstone-kennedy-withdrawal]], 220–21. To check: "Talk by McGeorge Bundy to Overseas Press Writers at the
        Sheraton Carlton Hotel, February 26, 1964," NSF, Memos to the President, box 1, Bundy, vol. 2, LBJ Library (cited
        by [[w.selverstone-kennedy-withdrawal]], 221 n.83). See [[cal.1964-02-25.vietnam-force-levels]]. Names: Bundy.'
