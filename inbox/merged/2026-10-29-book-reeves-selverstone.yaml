- add:
    entry:
      id: cal.1963-09-11.vietnam-2
      when: Sept. 11
      date: '1963-09-11'
      thread: vietnam
      c: '6 p.m. Rusk with Robert Kennedy, McCone, Murrow, Taylor, Krulak, Gilpatric, Hilsman, Colby, Bundy, Forrestal, on
        Lodge''s cable. Rusk: if the American presence is not needed, leave, but leave an independent Vietnam; no American
        troops, a return to the French war; Nhu probably has to go, but not Diệm with him; Lodge to wrestle with Diệm, the
        urgency in weeks, not days. No cut in aid essential to the war.'
      n: '[FRUS 1961–63, IV, doc. 93](https://history.state.gov/historicaldocuments/frus1961-63v04/d93) (Bromley Smith''s
        memorandum). [[w.selverstone-kennedy-withdrawal]], 156 (Rusk; the weeks; Lodge''s call for action set aside). To check:
        Krulak''s memorandum, "Vietnam," Sept. 11, 1963, Taylor Papers, National Defense University (cited by [[w.selverstone-kennedy-withdrawal]],
        156 n.49). Made public: FRUS 1961–63, IV (1991). See [[cal.1963-09-10.vietnam]]. Names: Rusk, Robert Kennedy, McCone,
        Murrow, Taylor, Krulak, Gilpatric, Hilsman, Colby, Bundy, Forrestal, Lodge, Ngô Đình Nhu, Ngô Đình Diệm.'
      tags:
