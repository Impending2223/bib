    base: 69b6d7fa
    set:
      c: 'The White House, 10 a.m. Kennedy signs McNamara''s and Taylor''s instructions, Ball and McGeorge Bundy present:
        reform to be pressed "as a pragmatic necessity and not as a moral judgment"; threats to cut aid unlikely to work.
        "A great deal of truth" in Alsop''s column of the morning on the Saigon reporters; "The way to confound the press
        is to win the war." Recorded: McNamara, "We hope that before the end of the year, we can withdraw"; Taylor, "We have
        to win this war in this timeframe."'
      n: '[FRUS 1961–63, IV, doc. 143](https://history.state.gov/historicaldocuments/frus1961-63v04/d143) (Bundy''s memorandum
        for the record). [John F. Kennedy, George W. Ball, McGeorge Bundy, Robert S. McNamara, Dean Rusk and Maxwell D. Taylor,
        10 a.m.](https://prde.upress.virginia.edu/conversations/4003065), JFK Meeting Tape 112.2 (PRDE only). [[w.moyar-triumph-forsaken]],
        252 (Kennedy on Alsop''s column). [[w.selverstone-kennedy-withdrawal]], 161–62 (the exchange, from the Miller Center''s
        draft transcript). See [[cal.1963-09-21.vietnam]]. Names: Kennedy, McNamara, Taylor, Ball, Bundy, Alsop. Check: the
