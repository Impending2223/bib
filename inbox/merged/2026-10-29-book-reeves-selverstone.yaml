- add:
    entry:
      id: cal.1964-03-15.vietnam
      when: Mar. 15
      date: '1964-03-15'
      thread: vietnam
      c: 'Johnson''s interview with the three networks'' correspondents, live: Vietnam a problem of ten years; Eisenhower''s
        letter to Diệm one he could have written to Khánh. The falling domino: "I share President Kennedy''s view"; "we must
        stay there and help them, and that is what we are going to do." Asked of Rockefeller''s charge of "divided counsel."'
      n: 'Transcript of Television and Radio Interview Conducted by Representatives of Major Broadcast Services, [1963–64
        Pub. Papers 361](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=445) (Mar. 15, 1964).
        [[w.selverstone-kennedy-withdrawal]], 227 (the interview; "we must stay there"). To check: Bundy to Johnson, Mar.
        14, 1964, FRUS 1964–68, I, doc. 81 (cited by [[w.selverstone-kennedy-withdrawal]], 227 n.110). See [[cal.1964-03-08.vietnam]].
        Names: Johnson, Eisenhower, Ngô Đình Diệm, Nguyễn Khánh, Kennedy, Rockefeller.'
