        George W. Ball, McGeorge Bundy, Michael V. Forrestal, W. Averell Harriman and Roger Hilsman, 11 a.m.](https://prde.upress.virginia.edu/conversations/4003051),
        JFK Meeting Tape 96.2 (PRDE only). [[w.reeves-president-kennedy]], 540–41. Made public: FRUS 1961–63, III (1991).
        See [[cal.1963-06-27.vietnam]]. Names: Ball, Harriman, Bundy, Hilsman, Forrestal, Ngô Đình Nhu, Ngô Đình Diệm, Nolting,
        Lodge, Kennedy.'
