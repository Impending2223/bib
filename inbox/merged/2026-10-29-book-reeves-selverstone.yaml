- add:
    entry:
      id: cal.1963-04-29.vietnam-force-levels
      when: Apr. 29
      date: '1963-04-29'
      thread: vietnam-force-levels
      c: 'McNamara with the Joint Chiefs: at Honolulu he will explore with Nolting and State bringing back 1,000 troops at
        the end of the year; a plan to be drawn on the assumption it is feasible. Nitze''s notes: "Plan to take out, with
        plan for SV to take over. Pres. wld like."'
      n: '[[w.selverstone-kennedy-withdrawal]], 115 (by the conference''s proceedings and Nitze''s notes). To check: JCS-SecDef
        Discussions, Apr. 29, 1963, Proceedings of Eighth Secretary of Defense Conference on Vietnam, 218, Vietnam Center
        and Sam Johnson Archive (cited by [[w.selverstone-kennedy-withdrawal]], 115 n.83); Nitze notes, S/D, JCS meeting,
        Apr. 29, 1963, Nitze Papers, box 81, Library of Congress (cited by [[w.selverstone-kennedy-withdrawal]], 115 n.84).
        See [[cal.1963-04-04.vietnam-force-levels]]. Names: McNamara, Nolting, Nitze, Kennedy.'
      tags:
      - name:mcnamara-robert-s
      - name:nolting-frederick-e-jr
