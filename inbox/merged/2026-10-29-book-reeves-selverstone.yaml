      when: Jan. 30
      date: '1963-01-30'
      thread: vietnam-force-levels
      c: 'Felt at a Pentagon press briefing, asked of winning in a reasonable time: "three years is reasonable, and I think
        I can predict victory."'
      n: '[[w.selverstone-kennedy-withdrawal]], 106. To check: Department of Defense Press Briefing, Admiral H. D. Felt, Jan.
        30, 1963, box 236, OSD Historical Office; AP, "Victory Predicted in Viet Nam," *Lincoln Star*, Jan. 31, 1963, 16 (cited
        by [[w.selverstone-kennedy-withdrawal]], 106 n.36). See [[cal.1962-10-08.vietnam-force-levels]]. Names: Felt.'
      tags:
