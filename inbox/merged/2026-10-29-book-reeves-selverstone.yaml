- add:
    entry:
      id: cal.1964-03-09.republican-party-congress
      when: Mar. 9
      date: '1964-03-09'
      thread: republican-party-congress
      also:
      - vietnam-congress
      c: 'Keating, in the Record, "20 Questions for Better Public Understanding": again a full congressional review of the
        war asked, as in October. "When one hears in one breath that we are going to stay in South Vietnam to the finish,
        and in the next that we are going to withdraw in less than 2 years, one has difficulty understanding just what we
        do intend to do." His twenty questions sent to Defense and State.'
      n: '[110 Cong. Rec., Senate, Mar. 9, 1964, 4780–82](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-4-3.pdf#page=4)
        (extension of remarks). [[w.selverstone-kennedy-withdrawal]], 225 (the questions; the administration''s answer: training
        "substantially completed by the end of 1965"). To check: "Answers to Senator Keating''s Questions of March 9, 1964
        on Viet Nam," Thomson Papers, box 24, JFK Library (cited by [[w.selverstone-kennedy-withdrawal]], 225 n.104b). Names:
        Keating.'
      tags:
      - name:keating-kenneth-b
      src:
        c: f25e4f38
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-4-3.pdf#page=4: all'
