      id: cal.1964-03-07.vietnam-force-levels
      when: Mar. 7
      date: '1964-03-07'
      thread: vietnam-force-levels
      c: News conference. "I don't think that the American public has fully understood the reason for our withdrawing any
        advisers from South Viet-Nam." About 1,000 called back, several hundred of them trainers of guards and police. Others
        to come out as training is done; more sent as needed.
      n: 'The President''s News Conference of March 7, 1964, [1963–64 Pub. Papers 338](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=422).
        [[w.selverstone-kennedy-withdrawal]], 224–25. See [[cal.1964-03-05.vietnam-force-levels]]. Names: Johnson.'
