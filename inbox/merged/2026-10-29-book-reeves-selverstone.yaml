- add:
    entry:
      id: cal.1963-05-07.vietnam-force-levels
      when: May 7
      date: '1963-05-07'
      thread: vietnam-force-levels
      c: 'The Oval Office, 4:32 p.m., recorded. McNamara to Kennedy on Honolulu: "for domestic political purposes" and for
        the effect in South Vietnam, a thousand men home by the end of the year; the plan asked for, no decision yet. Kennedy:
        not if the war is not in good shape. McNamara: two or three victories would make it "just exactly the shot in the
        arm we ought to have." McNamara: $75 to $100 million out of the military assistance programs for 1965–67, "so we don''t
        build up another Korea."'
      n: '[John F. Kennedy and Robert S. McNamara, 4:32 p.m.](https://prde.upress.virginia.edu/conversations/4006537), JFK
        Meeting Tape 85.4 (PRDE only). [[w.selverstone-kennedy-withdrawal]], 124–25, 131 (the exchange, from the Miller Center''s
        draft transcript). Check: the recording not heard; the words Selverstone''s transcript''s. See [[cal.1963-05-06.vietnam-force-levels]].
        Names: McNamara, Kennedy.'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      src:
        c: c6de6561
        rows:
        - 'https://prde.upress.virginia.edu/conversations/4006537: A'
        - 'w.selverstone-kennedy-withdrawal 124–25: A-E'
        - 'w.selverstone-kennedy-withdrawal 131: F'
        - 'via w.selverstone-kennedy-withdrawal 125 n.27a: A-E'
        - 'via w.selverstone-kennedy-withdrawal 125 n.27b: A-E'
        - 'via w.selverstone-kennedy-withdrawal 131 n.56: F'
- add:
    entry:
      id: cal.1963-05-22.vietnam-force-levels
      when: May 22
      date: '1963-05-22'
      thread: vietnam-force-levels
      c: 'News conference, on Nhu''s "too many American troops": troops would go home the day after Saigon asked. "We are
        hopeful that the situation in South Viet-Nam would permit some withdrawal in any case by the end of the year, but
        we can''t possibly make that judgment at the present time." "A long, hard struggle to go."'
      n: 'The President''s News Conference of May 22, 1963, [1963 Pub. Papers 418](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=476).
        [[w.selverstone-kennedy-withdrawal]], 128. See [[cal.1963-05-12.vietnam]]. Names: Kennedy, Ngô Đình Nhu.'
      tags:
      - name:kennedy-john-f
      - name:ngo-dinh-nhu
      src:
        c: 0bdb7279
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=476: all'
        - 'w.selverstone-kennedy-withdrawal 128: B-C'
        - 'via w.selverstone-kennedy-withdrawal 128 n.41: B-C'
