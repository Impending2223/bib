- add:
    entry:
      id: cal.1964-01-31.republican-party-congress
      when: Jan. 31
      date: '1964-01-31'
      thread: republican-party-congress
      also:
      - vietnam
      c: 'Lindsay (R-N.Y.) in the House, a minute: McNamara told Armed Services Monday the country must be ready to take all
        necessary measures in Vietnam, and reporters Tuesday that he was encouraged. "Will the United States be able to complete
        the major part of its military task in Vietnam by the end of 1965, as the White House said last October?" He wants
        the policy from the President or State, "rather than the Pentagon." Reston''s column of Jan. 29 inserted.'
      n: '[110 Cong. Rec., House, Jan. 31, 1964, 1555](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-2-2.pdf#page=51).
        [[w.selverstone-kennedy-withdrawal]], 225 (Lindsay on McNamara''s statements). Check: Selverstone dates it Jan. 28;
        the Record''s page is the House''s of Jan. 31. See [[cal.1964-01-27.vietnam-congress]]. Names: Lindsay, McNamara,
        Reston.'
      tags:
