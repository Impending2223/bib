      id: cal.1963-02-01.vietnam
      when: Feb. 1
      date: '1963-02-01'
      thread: vietnam
      c: 'Meeting on Vietnam, 4:30 p.m., recorded: Kennedy with Rusk, McNamara, Taylor, McCone, Harriman, Gilpatric, the Bundys,
        Forrestal and Bell; Wheeler back from Saigon. Wheeler: reasonable prospects; neither pull out nor send large forces;
        the present support to go on.'
      n: '[Meeting on Vietnam, 4:30 p.m.](https://prde.upress.virginia.edu/conversations/8060022), Tape 71.1 (PRDE only).
        [[w.selverstone-kennedy-withdrawal]], 101–02 (Wheeler''s report and its review with Kennedy). Check: the recording
        not heard. See [[cal.1963-01-25.vietnam]]. Names: Kennedy, Rusk, McNamara, Taylor, McCone, Harriman, Gilpatric, McGeorge
        Bundy, William Bundy, Forrestal, Bell, Wheeler.'
