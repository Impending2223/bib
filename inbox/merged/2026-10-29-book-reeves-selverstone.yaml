      when: Nov. 21
      date: '1963-11-21'
      thread: vietnam
      c: 'Before leaving for Texas, Kennedy to Forrestal: go out to Sihanouk, who rejects American aid, and tell him the United
        States still thinks him the best solution for his country; after the new year, "an in-depth study of every possible
        option we''ve got in Vietnam, including how to get out of there." By Forrestal''s account.'
