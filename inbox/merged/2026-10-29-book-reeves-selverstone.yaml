      id: cal.1963-11-14.vietnam-force-levels
      when: Nov. 14
      date: '1963-11-14'
      thread: vietnam-force-levels
      also:
      - foreign-aid
      c: 'News conference. The Honolulu meeting to assess "how we can intensify the struggle, how we can bring Americans out
        of there"; "our object, to bring Americans home." The 1,000 before the end of the year? "We are going to bring back
        several hundred," the number after Nov. 20. On the cuts in foreign aid: "Are we going to give up in South Viet-Nam?
        Are we going to give up in Latin America?"'
      n: 'The President''s News Conference of November 14, 1963, [1963 Pub. Papers 845](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=903).
        [[w.selverstone-kennedy-withdrawal]], 197–98. See [[cal.1963-10-31.elections-1964]]. Names: Kennedy.'
