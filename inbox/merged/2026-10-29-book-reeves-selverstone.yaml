      id: cal.1963-11-06.vietnam
      when: Nov. 6
      date: '1963-11-06'
      thread: vietnam
      c: 'Lodge to Kennedy, eyes only, the last weekly report: the coup "a Vietnamese and a popular affair," but "the ground
        in which the coup seed grew into a robust plant was prepared by us." Prospects of victory "much improved, provided
        the Generals stay united." Kennedy''s reply: "we necessarily faced and accepted the possibility that our position
        might encourage a change of government."'
      n: '[FRUS 1961–63, IV, doc. 302](https://history.state.gov/historicaldocuments/frus1961-63v04/d302) (telegram 949);
        [doc. 304](https://history.state.gov/historicaldocuments/frus1961-63v04/d304) (the reply). [[w.reeves-president-kennedy]],
        651–52. Made public: FRUS 1961–63, IV (1991). See [[cal.1963-11-01.vietnam]]. Names: Lodge, Kennedy.'
      tags:
