- edit:
    id: cal.1963-10-31.elections-1964
    base: 7d1a6bdf
    set:
      c: 'News conference. Would he want Johnson on the ticket in 1964, and does he expect him to be? "Yes, to both of those
        questions. That is correct." Goldwater''s charge of news managed to keep the administration in office: no reply this
        week, Goldwater having had "a busy week selling TVA," suggesting nuclear weapons for commanders overseas, attacking
        the President of Bolivia and involving himself in the Greek election. The six divisions in Germany kept "as long as
        they are required," and the units sent in 1961; no reduction in combat units, some in logistic personnel; German purchases
        of arms "an offset to our gold losses." On Vietnam: a thousand men expected out by the end of the year, the first
        contingent some 250 not in front-line operations.'
      n: 'The President''s News Conference, [1963 Pub. Papers 826](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=884)
        (Oct. 31, 1963). [[w.johnson-vantage-point]], 2 (the ticket); [[w.schlesinger-thousand-days-1965]], 981 (Goldwater);
        [[w.perlstein-before-the-storm]], 237 (Goldwater). [[w.gavin-gold-dollars-and-power]], 113 (the forces in Germany).
        [[w.selverstone-kennedy-withdrawal]], 197 (Vietnam). See [[cal.1963-07-14.elections-1964]]. Names: Johnson, Goldwater.'
      src:
