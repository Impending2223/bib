- add:
    entry:
      id: cal.1963-09-19.vietnam
      when: Sept. 19
      date: '1963-09-19'
      thread: vietnam
      also:
      - vietnam-force-levels
      c: 'Kennedy with Rusk, McNamara, Taylor and Bundy, 4 p.m., recorded, on the McNamara–Taylor mission. Kennedy: the state
        of the war and its prospects; if "the rot really was setting in," Diệm told as tough as they can: "he''s going to
        lose the war!" Taylor would tell Diệm "we''re not here forever," with the plan to phase out; McNamara, to show Diệm
        at some point "that we do have a plan for getting out of there."'
      n: '[John F. Kennedy, McGeorge Bundy, Robert S. McNamara, Dean Rusk and Maxwell D. Taylor, 4 p.m.](https://prde.upress.virginia.edu/conversations/4003064),
        JFK Meeting Tape 111.5 (PRDE only). [[w.selverstone-kennedy-withdrawal]], 159–60 (the exchange, from the Miller Center''s
        draft transcript). To check: Memorandum for the Record, "SVN Trip," Sept. 19, 1963, RG 218, Taylor Records, box 12,
        NARA (cited by [[w.selverstone-kennedy-withdrawal]], 161 n.62). Check: the recording not heard; the words Selverstone''s
        transcript''s. See [[cal.1963-09-17.vietnam]]. Names: Kennedy, Rusk, McNamara, Taylor, Bundy, Ngô Đình Diệm.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
