    set:
      c: The decisions on American troop strength in Vietnam. Kennedy to Krock; McNamara's order at Honolulu, the advisers
        out by the end of 1965; the October conference.
      c2: The decisions on American troop strength in Vietnam. The May conference, the thousand; the White House statement
        of Oct. 2 and NSAM 263; Harkins's announcement of the first 300; the Model Plan superseded, March 1964. Taylor's 4,200
        more advisers; the Marines for Đà Nẵng; NSAM 328; Honolulu, 82,000; Westmoreland's forty-four battalions; thirteen
        battalions announced; the July decision, the 125,000 of July 28; McNamara's 74 battalions.
