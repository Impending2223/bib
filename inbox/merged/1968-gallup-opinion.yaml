      id: cal.1968-04-03.opinion
      when: Apr. 3
      date: '1968-04-03'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Mar. 15–20: Hanoi has said it will agree to peace negotiations if the bombing stops: should not stop 51 percent, should stop 40. Men 58 and 35; women 44 and 45; East 43 and 48. The Government to decide that the best thing is to stop the bombing and the fighting and gradually withdraw: approve 56, disapprove 34.'
      n: '[[w.gallup-poll]], III, 2115–16.'
    section: apr68
- add:
    entry:
      id: cal.1968-04-07.opinion
      when: Apr. 7
      date: '1968-04-07'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Feb. 22–27, by age: a great deal of interest in politics, 18 percent in each group. Have done work for a party or candidate: 21 to 29, 17; 50 and over, 21. Willing to work as a volunteer for one''s party this campaign: 21 to 29, 41; 30 to 49, 38; 50 and over, 26. To give $5 to its campaign fund: 42, 49 and 39.'
      n: '[[w.gallup-poll]], III, 2116–17.'
    section: apr68
