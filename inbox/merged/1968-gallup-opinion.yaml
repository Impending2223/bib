      when: Feb. 25
      date: '1968-02-25'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Feb. 1–6: Johnson 42 percent, Nixon 42, undecided 16. With Wallace as a third party''s candidate (the book prints Feb. 1–5): Johnson 39, Nixon 39, Wallace 11, undecided 11.'
      n: '[[w.gallup-poll]], III, 2106–07. Names: Johnson, Nixon, Wallace.'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      - name:wallace-george-c
    section: feb68
- add:
    entry:
      id: cal.1968-02-28.opinion
      when: Feb. 28
      date: '1968-02-28'
      thread: opinion
      also:
      - crime-and-hijacking
      - vietnam
      - civil-disorders
      c: 'Gallup, two releases. Jan. 4–9: the most important problem facing the country: the Vietnam war, 53 percent; of the domestic problems, in order, crime and lawlessness (riots, looting, juvenile delinquency included), civil rights, the high cost of living, poverty, general unrest. Feb. 1–6: the most important problem facing this community: crime and lawlessness, named nearly twice as often as any other. Have called upon the police in the last twelve months, 19 percent; theft and robbery the reason most often named. Aug. 3–8, 1967: an area within a mile where one would be afraid to walk alone at night: yes 31; men 16, women 44; cities of 500,000 and over 40.'
      n: '[[w.gallup-poll]], III, 2107–08.'
    section: feb68
- add:
    entry:
      id: cal.1968-03-03.opinion
      when: Mar. 3
      date: '1968-03-03'
      thread: opinion
      also:
      - crime-and-hijacking
      - court
      c: 'Gallup, Feb. 1–6: the courts in this area deal with criminals not harshly enough 63 percent, about right 19, too harshly 2. Steps to reduce crime, the five named most often: correct social and economic conditions 18; more parental control 18; changes in the courts, a freer hand for the police, 17; a larger police force 15; more severe penalties 13.'
      n: '[[w.gallup-poll]], III, 2108.'
    section: mar68
- add:
    entry:
      id: cal.1968-03-04.opinion
      when: Mar. 4
      date: '1968-03-04'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Feb. 22–27: the Republican convention''s choice narrowed to Nixon and Rockefeller: Nixon 48 percent, Rockefeller 44; Republicans 67 and 30; independents 45 and 47. Republicans'' choice from eight: Nixon 49, Rockefeller 22, Reagan 11, Romney 7, Percy 4, Lindsay 3, Hatfield 1, Stassen 1.'
      n: '[[w.gallup-poll]], III, 2108–09. Names: Nixon, Rockefeller, Reagan, Romney, Percy, Lindsay, Hatfield, Stassen.'
      tags:
      - name:nixon-richard-m
      - name:rockefeller-nelson
      - name:reagan-ronald
      - name:romney-george-w
      - name:percy-charles-h
      - name:lindsay-john-v
      - name:hatfield-mark-o
      - name:stassen-harold-e
    section: mar68
- add:
    entry:
      id: cal.1968-03-10.opinion
      when: Mar. 10
      date: '1968-03-10'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Feb. 22–27: the United States made a mistake in sending troops: yes 49 percent, no 41. The fighting to last under two years 35, over two years 30. The United States and its allies losing ground 23, standing still 38, making progress 33.'
      n: '[[w.gallup-poll]], III, 2109.'
    section: mar68
- add:
    entry:
      id: cal.1968-03-13.opinion
      when: Mar. 13
      date: '1968-03-13'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Feb. 22–27, a plan put to the public: the United States to train South Vietnam''s men to fight, as many American troops withdrawn as each 100,000 are trained, most if not all out within a year, supplies and economic aid kept up, the fighting left to the South Vietnamese: approve 69 percent, disapprove 21. Republicans 68, Democrats 70, independents 69. Most South Vietnamese want the United States out of their country: yes 40, no 45.'
      n: '[[w.gallup-poll]], III, 2109–10.'
    section: mar68
- add:
    entry:
      id: cal.1968-03-17.opinion
      when: Mar. 17
      date: '1968-03-17'
      thread: opinion
      also:
      - elections-1968
      - robert-kennedy
      c: 'Gallup, Feb. 22–27: the Democratic convention''s choice narrowed to Robert Kennedy and Johnson: Johnson 41 percent, Kennedy 41, undecided 18. Democrats: Johnson 45, Kennedy 44. Those 21 to 29: Kennedy 59, Johnson 29; 50 and over, Johnson 48, Kennedy 29.'
      n: '[[w.gallup-poll]], III, 2110–11. Names: Kennedy, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
    section: mar68
- add:
    entry:
      id: cal.1968-03-20.opinion
      when: Mar. 20
      date: '1968-03-20'
      thread: opinion
      also:
      - vietnam
      - jobs-and-wages
      - farm
      c: 'Gallup, two releases. Feb. 22–27: go all-out to win a military victory in Vietnam, using atom bombs and weapons: agree 27 percent, disagree 65. Public school teachers permitted to strike: should 36, should not 57. Nurses permitted to strike, 29 and 66; to join unions, 59 and 34. Farmers to establish a nationwide union: should 48, should not 35; farmers 53 and 39. Jan. 4–9, no strike to go on more than 21 days, then a committee appointed by the courts to decide, binding on both: favor 69, oppose 22.'
      n: '[[w.gallup-poll]], III, 2111–12.'
    section: mar68
