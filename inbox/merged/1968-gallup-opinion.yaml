      date: '1968-04-10'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Feb. 22–27: those 21 to 29 who consider themselves Republicans 22 percent, Democrats 38, independents 40; 50 and over, 30, 46 and 24. Non-whites 21 to 29: Democrats 67. Of those 21 to 29, registered to vote where they live: yes 48, no 52; 21 to 24, 34; 25 to 29, 58.'
      n: '[[w.gallup-poll]], III, 2117–19.'
    section: apr68
