      c: 'Gallup, May 2–7, college students, the Democratic convention''s choice among three: McCarthy 46 percent, Robert Kennedy 33, Humphrey 15. Consider themselves Republicans 19, Democrats 37, independents 44.'
      n: '[[w.gallup-poll]], III, 2127. Names: McCarthy, Kennedy, Humphrey.'
