      id: cal.1968-06-05.opinion
      when: June 5
      date: '1968-06-05'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, May 23–28: a law to limit the money spent for or by a candidate in his campaign for public office: favor 68 percent, oppose 24. Republicans 72 and 23; Democrats 65 and 25.'
      n: '[[w.gallup-poll]], III, 2129.'
    section: jun68
- add:
    entry:
      id: cal.1968-06-09.opinion
      when: June 9
      date: '1968-06-09'
      thread: opinion
      also:
      - crime-and-hijacking
      - robert-kennedy
      c: 'Gallup, special survey: the causes of violent behavior in this nation, those blamed chiefly: a complex society; waiting too long to tackle racial, ethnic and religious prejudice; poor discipline in the home; youth''s lack of respect for authority; a disregard for God and religion. The steps to prevent it, as listed: stricter gun laws; stricter law enforcement; greater security for candidates; violence off television; better parental control; ethics taught; better jobs and education. No figures printed.'
      n: '[[w.gallup-poll]], III, 2130. See [[cal.1968-06-05.robert-kennedy]].'
    section: jun68
