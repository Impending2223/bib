      c: 'Gallup, May 2–7, the Democratic convention''s choice among three. Democrats: Humphrey 40 percent, Robert Kennedy 31, McCarthy 19. Independents: McCarthy 36, Humphrey 27, Kennedy 23. Those 21 to 29: Kennedy 34, McCarthy 33, Humphrey 22; 50 and older, Humphrey 37, McCarthy 27, Kennedy 21.'
      n: '[[w.gallup-poll]], III, 2127. Names: Humphrey, Kennedy, McCarthy.'
