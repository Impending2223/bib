      c: 'Gallup, Apr. 4–9: the Johnson Administration pushing integration too fast 39 percent, about right 25, not fast enough 21. Whites 42, 24 and 20. Southern whites 66, 17 and 7. Outside the South 34, 27 and 24.'
      n: '[[w.gallup-poll]], III, 2122. Names: Johnson.'
      tags:
