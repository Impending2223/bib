patch: 1968-gallup-opinion
by: Claude (Gallup reader, The Gallup Poll III, 1968, read off the page images)
ops:
- add:
    entry:
      id: cal.1968-01-21.opinion
      when: Jan. 21
      date: '1968-01-21'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Jan. 4–9, two releases. Republicans'' choice for 1968: Nixon 42 percent, Rockefeller 27, Romney 12, Reagan 8, Percy 5, Hatfield 2, Lindsay 1, Gavin 1; no preference 2. Independents: Nixon 27, Rockefeller 27, Reagan 14, Romney 13, Percy 7. Johnson 51, Nixon 39, undecided 10. Johnson 46, Rockefeller 40, undecided 14. Johnson 55, Romney 31. Johnson 55, Reagan 33.'
      n: '[[w.gallup-poll]], III, 2102–03. Names: Nixon, Rockefeller, Romney, Reagan, Percy, Hatfield, Lindsay, Gavin, Johnson.'
      tags:
      - name:nixon-richard-m
      - name:rockefeller-nelson
      - name:romney-george-w
      - name:reagan-ronald
      - name:percy-charles-h
      - name:hatfield-mark-o
      - name:lindsay-john-v
      - name:gavin-james-m
      - name:johnson-lyndon-b
    section: jan68
- add:
    entry:
      id: cal.1968-01-24.opinion
      when: Jan. 24
      date: '1968-01-24'
      thread: opinion
      also:
      - economy
      - vietnam
      - poverty
      c: 'Gallup, two releases. Jan. 4–9: prices and wages frozen at their present level as long as the Vietnam war lasts: a good idea 46 percent, a poor idea 43, no opinion 11. Dec. 7–12, 1967: the smallest amount a family of four needs each week to get along in this community, the median: $102. The family''s food, including milk, each week, median: $29.'
      n: '[[w.gallup-poll]], III, 2103.'
    section: jan68
