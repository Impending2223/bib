      date: '1968-03-31'
      thread: opinion
      also:
      - vietnam
      c: 'Gallup, Mar. 15–20: Johnson''s handling of Vietnam: approve 26 percent, disapprove 63. Republicans 18 and 74; Democrats 37 and 51; independents 16 and 71. His handling of his job: approve 36, disapprove 52.'
      n: '[[w.gallup-poll]], III, 2113–15. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
    section: mar68
- add:
