      c: 'Gallup, May 23–28, with Wallace as a third party''s candidate: Humphrey 42 percent, Nixon 36, Wallace 14, undecided 8. South: Humphrey 36, Nixon 29, Wallace 29. Independents: Nixon 39, Humphrey 26, Wallace 26. Humphrey 39, Rockefeller 36, Wallace 17; Republicans, Rockefeller 60, Humphrey 14, Wallace 17.'
      n: '[[w.gallup-poll]], III, 2130–33. Names: Humphrey, Nixon, Wallace, Rockefeller.'
