      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Mar. 15–20, two releases. Nixon 41 percent, Johnson 39, Wallace 14, undecided 6. Outside the South: Nixon 44, Johnson 41, Wallace 8. South: Johnson 34, Nixon 31, Wallace 31. Republicans'' choice for 1968, after the New Hampshire primary: Nixon 60, Rockefeller 24, Reagan 6, Percy 5. Before it: Nixon 49, Rockefeller 22, Reagan 11, Percy 4; Romney 7.'
      n: '[[w.gallup-poll]], III, 2112–13. See [[cal.1968-03-12.elections-1968]]. Names: Nixon, Johnson, Wallace, Rockefeller, Reagan, Percy, Romney.'
      tags:
      - name:nixon-richard-m
