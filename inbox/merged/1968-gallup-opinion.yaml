      c: 'Gallup, Apr. 4–9, Democrats'' choice for the nomination: Robert Kennedy 35 percent, Humphrey 31, McCarthy 23, undecided 11. Of two: Kennedy 46, McCarthy 37; Kennedy 45, Humphrey 41; Humphrey 48, McCarthy 37.'
      n: '[[w.gallup-poll]], III, 2120–21. Names: Kennedy, Humphrey, McCarthy.'
      tags:
