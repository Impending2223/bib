      - crime-and-hijacking
      c: 'Gallup, May 2–7: the most important problem facing the country: Vietnam 42 percent, race relations 25, crime and lawlessness (riots, looting, juvenile delinquency included) 15, the high cost of living and taxes 8, poverty 4. The party better able to handle it: Republican 30, Democratic 28, no difference or no opinion 42.'
      n: '[[w.gallup-poll]], III, 2128.'
    section: may68
- add:
    entry:
      id: cal.1968-05-29.opinion
      when: May 29
      date: '1968-05-29'
      thread: opinion
      also:
      - civil-disorders
      c: 'Gallup, May 2–7, residents of large cities: a mayor''s order to the police to shoot on sight anyone looting stores during race riots: the best way 47 percent, there is a better way 49. Serious racial trouble in this community in the next six months: likely 30, not likely 59.'
      n: '[[w.gallup-poll]], III, 2128. See [[cal.1968-04-04.civil-disorders]].'
    section: may68
- add:
