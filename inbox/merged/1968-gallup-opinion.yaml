      when: Jan. 31
      date: '1968-01-31'
      thread: opinion
      also:
      - elections-1968
      c: 'Gallup, Jan. 4–9, Republicans, the convention''s choice narrowed to two: Nixon 68 percent, Romney 26, no opinion 6. Nixon 55, Rockefeller 41, no opinion 4.'
      n: '[[w.gallup-poll]], III, 2104. Names: Nixon, Romney, Rockefeller.'
      tags:
      - name:nixon-richard-m
      - name:romney-george-w
      - name:rockefeller-nelson
    section: jan68
