      c: 'Gallup, Mar. 15–20, Democrats, the convention''s choice narrowed to two: Robert Kennedy 44 percent, Johnson 41, undecided 15. Johnson 59, McCarthy 29, undecided 12.'
      n: '[[w.gallup-poll]], III, 2112. Names: Kennedy, Johnson, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
