      c: 'Hartford, the Hotel America, the night before Connecticut''s Democratic convention. John Bailey, State and national
        chairman, walks alone into a McCarthy party; Arthur Miller asks how he keeps all that strength. Bailey: "I just keep
        shaking hands."'
      n: '[[w.chester-american-melodrama]], 394–95. See [[cal.1968-06-22.elections-1968-state-conventions]]. Names: McCarthy.'
