      id: cal.1968-11-07.transition-and-staff
      when: Nov. 7
      date: '1968-11-07'
      thread: transition-and-staff
      also:
      - elections-1968
      c: 'Key Biscayne, the morning. Nixon telephones Humphrey in Washington: an invitation to meet, a reconciliation such
        as Kennedy offered him in 1960; Humphrey accepts. Nixon spends the day in the yard of Rebozo''s house, next to Smathers''s.'
      n: '[[w.chester-american-melodrama]], 767. See [[cal.1968-11-06.transition-and-staff]]. Names: Nixon, Humphrey, Rebozo,
        Smathers.'
