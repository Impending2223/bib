  - add:
      entry:
        id: cal.1960-03-30.china-leadership-8
        when: Mar. 30
        date: '1960-03-30'
        thread: china-leadership
        c: 'Peking 北京, the rear hall of the Huairen Tang 怀仁堂. Deng Xiaoping 邓小平 relays the Tianjin 天津 meeting to the heads of the central departments: seventeen items. Semi-mechanization and mechanization, semi-automation and automation; public mess halls everywhere, town and country; the communes'' transition (the five questions of the Guangdong 广东 committee''s report); urban communes; farming, grain at the center, and the twelve characters 12字; the xiaotuqun 小土群 and xiaoyangqun 小洋群 in industry, the small native and small modern railways; support for agriculture from every quarter; education, middle schools and universities run by localities; the forty-article program to be done early; the health campaign and the four pests 四害 (sparrows replaced by bedbugs, Mao''s proposal at Tianjin, by the editors'' note); the three antis 三反, the villages first; officials of backward units to stand aside; foreign visitors to see the bad as well as the good; more output and thrift, full use; the anti-China question 反华问题; the chief contradiction in socialist construction, two roads, two lines.'
        n: '[[w.yang-shangkun-riji]], I, 493–494 (Mar. 30, 1960). The words: 上午 (I, 493). See [[cal.1960-03-25.china-leadership]]. Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Deng Xiaoping, Mao Zedong.'
        src:
          c: 3e2f0d94
          rows: ['w.yang-shangkun-riji I, 493–494: all']
        tags: ['polity:prc', 'name:deng-xiaoping', 'name:mao-zedong', 'vis:only:prc']
        time_range: ['1960-03-29T22:00Z', '1960-03-30T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
