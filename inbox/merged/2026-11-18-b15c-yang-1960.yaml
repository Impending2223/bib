        n: '[[w.yang-shangkun-riji]], I, 557–558 (Sept. 30, 1960). The words: 6时半 (I, 557). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: CPSU Central Committee, draft statement of the meeting of the communist and workers'' parties, handed over Sept. 30, 1960 (cited by [[w.yang-shangkun-riji]], I, 558 n.1). Names: Suslov, Kozlov, Deng Xiaoping, Peng Zhen, Yang Shangkun.'
