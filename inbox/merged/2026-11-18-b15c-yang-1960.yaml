        when: Oct. 22
        date: '1960-10-22'
        thread: china-leadership
        also: [soviet-union]
        c: 'Moscow 莫斯科, the Kremlin 克里姆林宫. The drafting committee''s last session, Suslov 苏斯洛夫 in the chair, noon to 1:30 p.m. Ponomarev 波诺马廖夫 reports the secretariat''s work: chapters 1, 2 and 4 agreed; in 3 and 5 open the ending of war, the Twentieth and Twenty-first Congresses, the cult of personality, Yugoslavia''s wording, group and factional activity. Deng Xiaoping 邓小平 speaks from his text. The draft goes to the November meeting; the Soviet delegation to report there, on Koucký''s 考茨基 motion; Miyamoto 宫本 asks for full agreement in November. A peace appeal to be drafted by the American, British, Italian, French and Polish parties.'
        n: '[[w.yang-shangkun-riji]], I, 580–583 (Oct. 22, 1960). The words: 12时起草委员会继续开会……13时半起草委员会会议结束 (I, 580). See [[cal.1960-10-02.soviet-union]]. Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Suslov, Ponomarev, Deng Xiaoping, Koucký, Miyamoto Kenji.'
        src:
          c: 28417c88
          rows: ['w.yang-shangkun-riji I, 580–583: all']
        tags: ['polity:prc', 'name:deng-xiaoping', 'name:suslov-mikhail-a', 'name:ponomarev-boris-n', 'vis:only:prc+ussr']
        time: 1960-10-22T09:00Z
        time_zone: Europe/Moscow
  - add:
      entry:
        id: cal.1960-10-22.china-leadership-4
        when: Oct. 22
        date: '1960-10-22'
        thread: china-leadership
        also: [soviet-union]
        c: 'Moscow 莫斯科, the Kremlin''s St. George''s Hall 圣乔治大厅. The Soviet Presidium''s reception for the drafting committee, 3 to 5:30 p.m.; Khrushchev 赫鲁晓夫 there. Toasts by Suslov and Deng Xiaoping 邓小平; over coffee Khrushchev rises: whoever opposes him opposes the Soviet Central Committee; he does not want to lead; he would leave a party that made revolution by war. Deng answers at once: no communist party wants revolution by war; Soviet leadership a thing of history; the banquet no place for debate. Khrushchev speaks again, on leadership and Soviet grievances, and ends on unity.'
        n: '[[w.yang-shangkun-riji]], I, 583 (Oct. 22, 1960). The words: 3时在克里姆林宫圣乔治大厅……5时半宴会完 (I, 583). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Khrushchev, Suslov, Deng Xiaoping.'
        src:
          c: 5399e324
          rows: ['w.yang-shangkun-riji I, 583: all']
        tags: ['polity:prc', 'name:deng-xiaoping', 'name:khrushchev-nikita-s', 'name:suslov-mikhail-a', 'vis:only:prc+ussr']
        time: 1960-10-22T12:00Z
        time_zone: Europe/Moscow
