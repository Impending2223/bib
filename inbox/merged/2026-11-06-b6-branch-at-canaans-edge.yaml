      date: '1965-11-04'
      time: 1965-11-04T16:50Z
      thread: civil-rights-the-executive
      c: 'Johnson to Wilkins by telephone, 10:50 a.m., on Weaver''s travels, "the principal defect of Negroes in government": "The moment they take an oath, they get an airplane ticket." Wilkins: "They do get around."'
      n: '[[w.branch-at-canaans-edge]], 424. To check: [Johnson and Wilkins, 10:50 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-roy-wilkins-november-4-1965), Conversation WH6511-01-9105 (Miller Center) (cited by [[w.branch-at-canaans-edge]], 424; PRDE''s catalogue has the call from the LBJ Ranch, 9105-9107). Names: Johnson, Wilkins, Weaver.'
