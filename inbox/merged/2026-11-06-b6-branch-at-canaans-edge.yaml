    entry:
      id: cal.1966-02-19.alabama
      when: Feb. 19
      date: '1966-02-19'
      thread: alabama
      also:
      - civil-rights-organizations
      c: 'SNCC. Forman records an interview, for fund-raising, on how the Lowndes County project survived: Carmichael traces its start to the display of contempt outside the Negro high school after Viola Liuzzo''s murder ("Whenever we went canvassing, people would always say, ''Are you those civil rights fighters that cussed the cops out?''"); George Greene: four staff cars left for all of rural Alabama.'
      n: '[[w.branch-at-canaans-edge]], 440. To check: transcript, "Riding in the car from Atlanta," Feb. 19, 1966, SNCC Papers, King Center, A/SN94 (cited by [[w.branch-at-canaans-edge]], 440). Names: Forman, Carmichael.'
      src:
        c: fb11e61c
        rows:
        - 'w.branch-at-canaans-edge 440: all'
        - 'via x.1966-02-19.transcript-riding-in-the-car-from: all'
