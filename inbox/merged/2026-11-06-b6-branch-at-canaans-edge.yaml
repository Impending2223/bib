      - name:king-martin-luther-jr
      - place:saigon
- add:
    entry:
      id: cal.1968-02.king-memphis
      when: Feb.
      date: 1968-02
      thread: king-memphis
      c: Memphis, the annual banquet of the National Conference of Christians and Jews. Loeb escorts Wurf, AFSCME's president, in command of the sanitation strike since its second week. Ovations for Loeb; a barely polite reception for Wurf.
      n: '[[w.branch-at-canaans-edge]], 697 (and Wurf''s reading of it: the Mayor showing he had no weakness to exploit among the city''s prominent citizens). Check: the day; Branch: the strike''s second week. Names: Loeb.'
      src:
