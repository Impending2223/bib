    item: '[[w.branch-at-canaans-edge]], 725–26 (the Logans'' brownstone, until near dawn; her six-page memorandum against the mobilization, circulated to SCLC''s board; not her office or her words)'
    units: A
- check:
    id: cal.1968-03-26.king-poor-peoples
    text: 'Check: Branch puts the night at the Logans'' after the Rabbinical Assembly of Mar. 25, King cancelling his recruiting the next morning, Tuesday, Mar. 26 ([[w.branch-at-canaans-edge]], 725–27).'
