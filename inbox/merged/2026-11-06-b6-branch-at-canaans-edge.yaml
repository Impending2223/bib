      when: Mar. 14
      date: '1966-03-14'
      time: 1966-03-14T17:43Z
      thread: open-housing
      also:
      - king
      c: 'Levison, by telephone, 12:43 p.m., of his weekend in Chicago and the Freedom Festival: "terribly exciting"; "an audience with spirit, a fighting audience." "When they start mass action in the spring, that is when everyone will start paying attention."'
      n: '[[w.branch-at-canaans-edge]], 444. To check: FBI wiretap transcript, Levison and [name deleted], 12:43 p.m., Mar. 14, 1966, FLNY-9-NS (cited by [[w.branch-at-canaans-edge]], 444). See [[cal.1966-03-12.open-housing]]. Names: Levison.'
