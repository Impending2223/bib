      when: Jan. 7
      date: '1966-01-07'
      thread: vietnam
      c: 'John Steinbeck to Valenti, with suggestions for Johnson: massive, erratic bomb strikes, from the London blitz; "People can get used to anything except what they don''t expect." "I never knew anyone to hit anything with a .45 unless he shoves it in his opponent''s mouth."'
      n: '[[w.branch-at-canaans-edge]], 416. To check: Steinbeck to Valenti, Jan. 7, 1966, Valenti Papers, AC84-57, LBJ Library (cited by [[w.branch-at-canaans-edge]], 416). Names: Valenti, Johnson.'
