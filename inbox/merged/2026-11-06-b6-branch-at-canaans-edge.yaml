      id: cal.1968-01-18.king
      when: Jan. 18
      date: '1968-01-18'
      thread: king
      c: 'Saigon, the Hotel Caravelle. Abernathy, on a pilgrimage to India and South Vietnam for most of January, writes King: "I feel so empty away from you and our struggle for the freedom of our people." On the letter: "Please keep for the sake of history."'
      n: '[[w.branch-at-canaans-edge]], 678 (the text and its footnote). To check: Abernathy to King, Jan. 18, 1968, King Papers, King Center, KP1f1; [[w.garrow-bearing-the-cross]], 594 (cited by [[w.branch-at-canaans-edge]], 678). Names: Abernathy, Martin Luther King.'
      src:
        c: 3bb3e164
        rows:
        - 'w.branch-at-canaans-edge 678: all'
        - 'via x.1968-01-18.abernathy-to-mlk-jan-18-1968: all'
      tags:
