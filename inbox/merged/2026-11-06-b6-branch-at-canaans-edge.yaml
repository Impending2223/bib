      when: Mar. 26
      date: '1968-03-26'
      thread: king-poor-peoples
      c: Harlem. King, after cancelling the morning's recruiting, visits a tenement family; Mrs. Bennie Fowler, mother of eight, serves him a home-cooked lunch.
      n: '[[w.branch-at-canaans-edge]], 726–27. To check: [*New York Times*, Mar. 27, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/27/issue.html), 24 (cited by [[w.branch-at-canaans-edge]], 727). See [[cal.1968-03-26.king-poor-peoples]]. Names: Martin Luther King.'
