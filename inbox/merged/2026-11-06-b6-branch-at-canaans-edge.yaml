      id: cal.1966-01-12.program-2
      when: Jan. 12
      date: '1966-01-12'
      time: 1966-01-12T09:00Z
      thread: program
      c: The State of the Union in draft. Johnson rejects the final draft at 4 a.m. Goodwin, recalled for the work, starts over at dawn; through the day, in the Oval Office, sections reshuffled, Fortas and Clifford among the revisers.
      n: '[[w.branch-at-canaans-edge]], 416. To check: [[w.califano-triumph-and-tragedy-of]], 117–18; [[w.goodwin-remembering-america]], 423–24; President''s Daily Diary, Jan. 12, 1966, 1–4, LBJ Library: Goodwin in the Oval Office nine minutes in the afternoon, Clifford and Fortas three hours after (cited by [[w.branch-at-canaans-edge]], 416, 884). The call with Ball on the passage on direct contact: [[cal.1966-01-12.vietnam-congress]]. The address: [[cal.1966-01-12.program]]. Names: Johnson, Goodwin, Fortas, Clifford.'
      src:
        c: 2b731703
        rows:
