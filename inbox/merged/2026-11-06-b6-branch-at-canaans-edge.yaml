- cite:
    id: cal.1968-03.king
    item: '[[w.branch-at-canaans-edge]], 707–08 (Tuesday, Mar. 5, to Mexico for a rest, Abernathy with him; King sleeps little; not the doctor''s order)'
    units: A, B
- check:
    id: cal.1968-03.king
    text: 'Check: Branch dates the flight Tuesday, Mar. 5 ([[w.branch-at-canaans-edge]], 707, from [[w.garrow-bearing-the-cross]], 600).'
