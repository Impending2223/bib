      id: cal.1968-04-04.king-memphis-2
      when: Apr. 4
      date: '1968-04-04'
      thread: king-memphis
      c: 'Memphis, the Lorraine Motel, Room 201, the afternoon. King, after a series of business calls, with A. D. King and two visitors from Kentucky: anxious he may have to defy a federal injunction on Monday, which would tarnish the movement''s hope in the national compact; no word all day from Young on how he fares in court.'
      n: '[[w.branch-at-canaans-edge]], 761. See [[cal.1968-04-04.king-memphis]]. Names: Martin Luther King, Young.'
