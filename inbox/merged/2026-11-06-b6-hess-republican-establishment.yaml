      c: 'Chicago, the Republican convention. Ford, on Nixon''s list of young men eligible for the Vice Presidency, carries a lawyer''s opinion that he may take the nomination and keep his candidacy for the House. He has no cause to use it.'
      n: '[[w.hess-republican-establishment]], 29. Check: the day. Names: Ford, Nixon.'
