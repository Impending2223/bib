    base: 38260e04
    set:
      n: 'FRUS 1964–68, V, docs. [40](https://history.state.gov/historicaldocuments/frus1964-68v05/d40), [42](https://history.state.gov/historicaldocuments/frus1964-68v05/d42),
        [43](https://history.state.gov/historicaldocuments/frus1964-68v05/d43). The President''s Reply to a Message From Pope
        Paul VI on Vietnam, [1967 Pub. Papers 162](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=230)
        (Feb. 8, 1967). [[w.herring-lbj-and-vietnam]], 108–09 (the letter, delivered Feb. 8, the bombing to stop only once
        infiltration "had stopped"; the NSC of that day: Rusk, Hanoi might think the United States panicking; Johnson, "We
        will keep on until we get something from the North Vietnamese"). Made public: Hanoi''s release of the letters, Mar.
        21, 1967. [[w.mann-grand-delusion]], 529 (Johnson to the NSC). See [[cal.1967-01-04.vietnam]]. Names: Guthrie, Lê
        Trang, Hồ Chí Minh, Wheeler, McNamara, Paul VI, Johnson.'
      c: 'Moscow, 1 a.m.: Guthrie hands Lê Trang Johnson''s letter to Hồ Chí Minh: he will stop the bombing of the North and
        stop adding to American forces in the South "as soon as I am assured that infiltration into South Viet-Nam by land
        and by sea has stopped"; direct talks in Moscow, Burma or elsewhere. Lê Trang: it shows an "absence of goodwill."
        Washington, the NSC: Wheeler, a promise to talk not enough to stop the bombing; McNamara, it could stop for "a symmetrical
        de-escalation." Johnson''s reply to Paul VI''s appeal of Feb. 7: no cut in military action unless the other side does
        likewise. Johnson to the NSC: "Hanoi is trying to force us to give up the bombing of North Vietnam. We will keep on
        until we get something from the North Vietnamese."'
      src:
        c: 5555d84b
        rows:
