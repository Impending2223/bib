      when: July 20
      date: '1961-07-20'
      thread: vietnam
      also:
      - berlin-and-vienna
      c: 'Komer, "Are We Pushing Hard Enough in South Vietnam?": "strong political reasons for stepping up momentum"; "a major
        anti-Communist victory to its credit in the six months before the Berlin crisis is likely to get really hot."'
      n: '[FRUS 1961–63, I, doc. 100](https://history.state.gov/historicaldocuments/frus1961-63v01/d100) (to Rostow); [FRUS
        1961–63, V, doc. 107](https://history.state.gov/historicaldocuments/frus1961-63v05/d107) (editorial note: to Kennedy).
        [[w.mann-grand-delusion]], 243. Check: Mann has it to Kennedy. Names: Komer.'
