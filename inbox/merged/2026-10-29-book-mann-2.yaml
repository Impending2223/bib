        IV, 354–55. Made public: FRUS 1964–68, IV (1998). [[w.mann-grand-delusion]], 514 (Komer''s words). Names: Komer, Johnson,
        Westmoreland.'
      c: 'Komer to Johnson on his second trip, June 23–29, "both an optimist and a realist": Westmoreland''s spoiling attacks
        going well, the civil effort off the ground, the government with "a new wind." But "we have not really extended our
        control significantly outside the main towns"; until pacification rolls, "we cannot assure a victory." Komer: "The
        more I learn the more I''m sobered by the realization of how much further we may have to go."'
