      when: Jan. 17
      date: '1966-01-17'
      thread: vietnam-pause
      c: 'Johnson and McNamara by telephone, 9:15 a.m., on the pause. McNamara: "the great majority of the people in the country
        will believe that you gave them a reasonable time, over a month, and there was no movement at all on their part."
        Johnson: "You sure want to watch that and be prepared on it because I think that''s gonna be a campaign issue."'
      n: '[FRUS 1964–68, IV, doc. 26](https://history.state.gov/historicaldocuments/frus1964-68v04/d26). [[w.mann-grand-delusion]],
        481. See [[cal.1966-01-10.vietnam-pause]]. Names: Johnson, McNamara.'
