        - 'w.mann-grand-delusion 232: all'
        - 'via w.mann-grand-delusion 232 n.25: all'
- add:
    entry:
      id: cal.1961-04-21.vietnam
      when: Apr. 21
      date: '1961-04-21'
      thread: vietnam
      c: 'Rostow to Kennedy, "The Problem We Face": Vietnam "the place where—in the Attorney General''s phrase—we must prove
        that we are not a paper tiger."'
      n: '[FRUS 1961–63, VII–IX, Microfiche Supplement, doc. 234](https://history.state.gov/historicaldocuments/frus1961-63v07-09mSupp/d234).
        [[w.mann-grand-delusion]], 232. Names: Rostow, Kennedy, Robert Kennedy.'
