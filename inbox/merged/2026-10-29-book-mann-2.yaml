- add:
    entry:
      id: cal.1961-11-04.vietnam
      when: Nov. 4
      date: '1961-11-04'
      thread: vietnam
      also:
      - vietnam-force-levels
      c: 'Ball with Taylor, McNamara and Gilpatric on the Taylor report, by his account: American forces would bring "a protracted
        conflict far more serious than Korea"; the Viet Cong "mean and tough"; "a revolutionary situation with strong anti-colonialist
        overtones." No sympathy for it.'
      n: '[[w.mann-grand-delusion]], 247. To check: [[w.ball-past-has-another-pattern]], 366 (cited by [[w.mann-grand-delusion]],
        247 n.39). See [[cal.1961-11-03.vietnam]]. Names: Ball, Taylor, McNamara, Gilpatric.'
      tags:
      - name:ball-george-w
      - name:taylor-maxwell
      - name:mcnamara-robert-s
      - name:gilpatric-roswell-l
      src:
        c: 85f380d3
        rows:
        - 'w.mann-grand-delusion 247: all'
