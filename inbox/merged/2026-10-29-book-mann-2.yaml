- add:
    entry:
      id: cal.1961-02-01.vietnam
      when: Feb. 1
      date: '1961-02-01'
      thread: vietnam
      c: 'Komer to Kennedy: "While the first priority must be to meet the impending crisis—using Diem as our chosen instrument—we
        cannot neglect the longer term viability of South Vietnam"; prompt action on Diệm''s requests for his army, which
        "probably require circumvention of the Geneva Accords."'
      n: '[[w.mann-grand-delusion]], 228. To check: Komer to Kennedy, Feb. 1, 1961, NSF, Vietnam, Kennedy Papers (cited by
        [[w.mann-grand-delusion]], 228 n.11). See [[cal.1961-01-28.vietnam]]. Names: Komer, Kennedy, Ngô Đình Diệm.'
      tags:
      - name:komer-robert-w
      - name:kennedy-john-f
      - name:ngo-dinh-diem
      src:
        c: 16b0cada
        rows:
        - 'w.mann-grand-delusion 228: all'
        - 'via w.mann-grand-delusion 228 n.11: all'
- add:
    entry:
      id: cal.1961-04-20.vietnam
      when: Apr. 20
      date: '1961-04-20'
      thread: vietnam
      c: 'At the Cabinet meeting Kennedy puts Gilpatric at the head of a Presidential Task Force on Vietnam. McNamara to the
        President that afternoon: "A program of action to prevent Communist domination of South Viet-Nam," to be ready in
        a week.'
      n: '[FRUS 1961–63, I, doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v01/d31) (editorial note). [[w.mann-grand-delusion]],
        232. Names: Kennedy, Gilpatric, McNamara.'
      tags:
      - name:kennedy-john-f
      - name:gilpatric-roswell-l
      - name:mcnamara-robert-s
      src:
        c: 2dfc531f
        rows:
