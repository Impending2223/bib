        482 n.17). See [[cal.1966-01-20.vietnam-pause]]. Names: Johnson, Ball, Goldberg, Harriman, McGeorge Bundy, McNamara,
        Taylor.'
      c: 'Johnson with his advisers, noon to 2:12 p.m.: all but Ball, Goldberg and Harriman for resuming. Johnson: "I''m of
        the mind to continue it anyway, but we''ve had no indication of any success"; "If we go back in, the pressure will
        be on us to go further." McGeorge Bundy, that morning: tell the leaders the pause has failed, through the weekly meeting;
        no "formal consultation" with Congress. McNamara: "Unanimous view of military commanders we must resume bombing."
        Taylor: in Saigon "they are beginning to suspect things." Johnson: "I feel that we have given away a trading point
        without getting anything in return."'
