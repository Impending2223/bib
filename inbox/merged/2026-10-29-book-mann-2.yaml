      when: Nov.
      date: 1965-11
      thread: vietnam-congress
      c: Fulbright leads a Senate delegation to the Commonwealth Parliamentary Association in New Zealand, Johnson giving
        him a C-118, a propeller aircraft, not a jet. On the way he reads Fall's *Street Without Joy* and talks Asian history
        with Fong. Back, he tells his staff he is ready to hold public hearings on Vietnam.
