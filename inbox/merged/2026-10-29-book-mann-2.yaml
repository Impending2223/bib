        Record of Mar. 26, 30 and 31 does not show the word from them. To check: [[w.woods-fulbright]], 334, 337 (cited by
        [[w.mann-grand-delusion]], 321 n.63). See [[cal.1964-03-25.latin-america]]. Names: Fulbright, Tower, Thurmond, Miller,
