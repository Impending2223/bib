      id: cal.1962-09-18.vietnam
      when: Sept. 18
      date: '1962-09-18'
      thread: vietnam
      c: 'Forrestal to Kennedy on Saigon''s weekly report: "it does appear that we have finally developed a series of techniques
        which, if properly applied, do seem to produce results." The bad press from Saigon partly because the papers and news
        magazines "have not sent top drawer people to the area."'
      n: '[FRUS 1961–63, II, doc. 283](https://history.state.gov/historicaldocuments/frus1961-63v02/d283). [[w.mann-grand-delusion]],
        267–68. Check: Mann, 267, dates the first passage Sept. 11, the date of the Saigon cable the memorandum reports (FRUS,
        doc. 283, n. 2). To check: [[w.pentagon-papers]], II, 162 (cited by [[w.mann-grand-delusion]], 267 n.39). Names: Forrestal,
        Kennedy.'
      tags:
      - name:forrestal-michael-v
      - name:kennedy-john-f
      src:
        c: 03800285
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v02/d283: all'
        - 'w.mann-grand-delusion 267–68: all'
        - 'via w.mann-grand-delusion 268 n.40: all'
