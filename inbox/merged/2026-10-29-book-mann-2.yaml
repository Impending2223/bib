- add:
    entry:
      id: cal.1964-03-25.vietnam-congress
      when: Mar. 25
      date: '1964-03-25'
      thread: vietnam-congress
      also:
      - latin-america
      c: 'Johnson to Holland, by telephone, of Fulbright''s speech: "I feel mighty blue over Bill Fulbright''s speech today."
        Holland: "I suppose that was done at your suggestion." To McGeorge Bundy, minutes later: "They all assume that Fulbright
        speaks for the administration"; "As Truman said one time, he''s ''half bright''!"'
      n: '[[w.mann-grand-delusion]], 321. Check: Mann, 321, has "half bright" Joseph McCarthy''s word, not Truman''s. To check:
        [[w.taking-charge]], 297–98 (cited by [[w.mann-grand-delusion]], 321 n.64); [Johnson and Holland, 4:20 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-spessard-holland-march-25-1964),
