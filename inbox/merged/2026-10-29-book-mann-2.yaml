- edit:
    id: cal.1965-06-05.vietnam
    base: aaafd0af
    set:
      n: '[[w.dallek-flawed-giant]], 270 (from William Bundy''s manuscript history of the war). [[w.mann-grand-delusion]],
        440 (Rusk''s office; Johnson''s coming; the words). To check: William Bundy''s manuscript history, chap. 26, 3–6,
        LBJ Library (cited by [[w.dallek-flawed-giant]], 270); [[w.mcnamara-in-retrospect]], 186–87 (cited by [[w.mann-grand-delusion]],
        440 n.11). See [[cal.1965-06-03.vietnam]]. Names: Johnson, Rusk, McNamara, Ball, McGeorge Bundy, William Bundy. Check:
        Mann, 440, has them in Rusk''s office in the afternoon, Taylor''s telegram of the day before them.'
      c: 'Lunch at the State Department: Rusk, McNamara, Ball and the Bundys; Johnson joins them unasked. By William Bundy''s
        account "a reflective discussion of where we were headed," nothing decided. Johnson: would more Americans mean the
        Vietnamese would do less? McNamara: no sign of it. Rusk, by McNamara''s account: "We''re looking for no more than
        a stalemate in the South." Johnson: "The great danger is we''ll pick up a very big problem any day."'
      src:
        c: 049a8bdf
        rows:
        - 'w.dallek-flawed-giant 270: A-E'
        - 'via w.dallek-flawed-giant 270 n.90: A-E'
        - 'w.mann-grand-delusion 440: A-B, F-G'
- add:
    entry:
      id: cal.1965-06-11.vietnam-july-decision
      when: June 11
      date: '1965-06-11'
      thread: vietnam-july-decision
      c: 'The National Security Council, 12:15 p.m., on Taylor''s report. McNamara: Westmoreland asks 23 battalions, 123,000
        men, against the 13 and 70,000 authorized. Katzenbach: no need to go back to Congress for authority. Johnson: "We
        must delay and deter the North Vietnamese and Viet Cong as much as we can, and as simply as we can, without going
        all out"; granting Westmoreland''s request "means that we get in deeper and it is harder to get out."'
      n: '[FRUS 1964–68, II, doc. 347](https://history.state.gov/historicaldocuments/frus1964-68v02/d347) (Bromley Smith''s
        notes). [[w.mann-grand-delusion]], 442 (Johnson''s words). See [[cal.1965-06-10.vietnam-july-decision]]. Names: Taylor,
        McNamara, Westmoreland, Katzenbach, Johnson.'
      tags:
      - name:taylor-maxwell
