- edit:
    id: cal.1968-02-27.vietnam
    base: f34999a8
    set:
      n: 'FRUS 1964–68, VI, docs. [89](https://history.state.gov/historicaldocuments/frus1964-68v06/d89), [90](https://history.state.gov/historicaldocuments/frus1964-68v06/d90).
        [[w.cosmas-joint-chiefs-of-staff]], 159–60 (the report; the request); [[w.drea-mcnamara-clifford-and-the-2011]], 184,
        223 (Wheeler''s report and the 205,000; McNamara at State, the reserves and $10 billion); [[w.johnson-vantage-point]],
        389–90 (McNamara at the lunch at State). [[w.longley-lbjs-1968]], 67–68 (McNamara at the meeting at State). Made public:
        the request, *New York Times*, Mar. 10, 1968; the meetings, the Pentagon Papers (1971) and FRUS 1964–68, VI (2002).
        [[w.mann-grand-delusion]], 585 (William Bundy; McNamara at the meeting). To check: [[w.schandler-unmaking-of-a-president]];
        [[w.clifford-counsel-to-the-president-2]], 484–85 (cited by [[w.mann-grand-delusion]], 585 n.37); [[w.hoopes-limits-of-intervention]];
        [[w.isaacson-wise-men]]. See [[cal.1968-01-30.vietnam]]. Names: Wheeler, Westmoreland, McNamara, Johnson, William
        Bundy, Clifford.'
      c: 'Wheeler, back from Saigon, to Johnson: the enemy''s first attack "nearly succeeded in a dozen places"; Westmoreland
        asks for 205,000 more men, 105,000 by May 1. At State, McNamara: a reserve call-up of at least 150,000 needed, $10
        billion more in fiscal 1969; "I do not understand what the strategy is in putting in 205,000 men." William Bundy:
        "We must also prepare for the worst"; "Our position may be truly untenable." McNamara: the 205,000 "neither enough
        to do the job, nor an indication that our role must change." By Clifford''s account McNamara, in tears, of the bombing:
        "The goddamned Air Force, they''re dropping more on North Vietnam than we dropped on Germany in the last year of World
        War II, and it''s not doing anything!"'
      src:
