- add:
    entry:
      id: cal.1961-05-05.vietnam-johnson-asia
      when: May 5
      date: '1961-05-05'
      thread: vietnam-johnson-asia
      c: 'Kennedy to Johnson, the afternoon, by Reeves''s account: "I still want you to go to Vietnam." Johnson: "I don''t
        want to embarrass you by getting my head blown off in Saigon." Kennedy: "If anything happens to you, Sam Rayburn and
        I will give you the biggest funeral Austin, Texas, ever saw."'
      n: '[[w.mann-grand-delusion]], 234. To check: [[w.reeves-president-kennedy]], 118–19 (cited by [[w.mann-grand-delusion]],
        234 n.1). Check: the day. See [[cal.1961-04-28.vietnam]]. Names: Kennedy, Johnson, Rayburn.'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      src:
        c: 229dfc6d
        rows:
        - 'w.mann-grand-delusion 234: all'
- add:
    entry:
      id: cal.1961-05-12.vietnam-johnson-asia
      when: May 12
      date: '1961-05-12'
      thread: vietnam-johnson-asia
      c: 'Saigon, late at night, Johnson with some twenty of his party and the embassy and MAAG: "what can we do to end this
        situation?" McGarr lets him think more money and men could beat the Viet Cong within a year. By Valeo''s account.'
      n: '[[w.mann-grand-delusion]], 237. To check: Valeo, oral history, Senate Historical Office (cited by [[w.mann-grand-delusion]],
        237 n.11). Check: the night. See [[cal.1961-05-12.vietnam]]. Names: Johnson, McGarr, Valeo.'
      tags:
      - name:johnson-lyndon-b
      - name:mcgarr-lionel-c
      - name:valeo-francis-r
      src:
        c: 9c13b272
        rows:
        - 'w.mann-grand-delusion 237: all'
        - 'via w.mann-grand-delusion 237 n.11: all'
- add:
    entry:
      id: cal.1961-05-13.vietnam-johnson-asia
      when: May 13
      date: '1961-05-13'
      thread: vietnam-johnson-asia
      c: 'Johnson''s last call on Diệm, the morning: a joint communiqué; a letter to Kennedy with his needs, perhaps 100,000
        more men. The communiqué: to "extend and build upon existing programs of military and economic aid," with "a high
        sense of urgency and dedication."'
      n: '[FRUS 1961–63, I, doc. 55](https://history.state.gov/historicaldocuments/frus1961-63v01/d55) (Nolting''s telegram
        of May 15). [[w.mann-grand-delusion]], 238 (the communiqué). To check: Saigon telegram 1739, May 13, 1961, NSF, Kennedy
        Library (cited by [[w.mann-grand-delusion]], 238 n.12). See [[cal.1961-05-12.vietnam]]. Names: Johnson, Ngô Đình Diệm,
        Kennedy, Nolting.'
      tags:
      - name:johnson-lyndon-b
      - name:ngo-dinh-diem
      - name:kennedy-john-f
      src:
        c: a2a228bd
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d55: A'
        - 'w.mann-grand-delusion 238: all'
        - 'via w.mann-grand-delusion 238 n.12: B'
- add:
    entry:
      id: cal.1961-05-26.vietnam
      when: May 26
      date: '1961-05-26'
      thread: vietnam
      c: 'Rostow to Kennedy: "the Viet-Nam situation is extremely dangerous to the peace"; "we must push on all fronts to
        force a deflation of that crisis before it builds to a situation like that in Laos."'
      n: '[FRUS 1961–63, I, doc. 61](https://history.state.gov/historicaldocuments/frus1961-63v01/d61). [[w.mann-grand-delusion]],
        240. Names: Rostow, Kennedy.'
      tags:
