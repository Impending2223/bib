      c: 'McNamara to Johnson by telephone, 5:30 p.m.: "I myself am more and more convinced that we ought definitely to plan
        on termination of the bombing in the north but not until after the election." A ceiling on American forces, "somewhere
        between 500,000 and 600,000." Johnson does not answer.'
