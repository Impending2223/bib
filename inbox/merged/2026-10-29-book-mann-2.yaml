- add:
    entry:
      id: cal.1965-07-22.vietnam-july-decision
      when: July 22
      date: '1965-07-22'
      thread: vietnam-july-decision
      c: 'Galbraith to Johnson, under a note of July 22, "How to Take Ninety Percent of the Political Heat out of Vietnam":
        "much official crap to the contrary," Vietnam "of no great intrinsic importance." Officials to stop saying the future
        of mankind is being decided there; the bombing stopped or gradually suspended; areas that can be held held. "The whole
        place will go on the back burner"; the Republicans "will bleat."'
      n: '[FRUS 1964–68, III, doc. 79](https://history.state.gov/historicaldocuments/frus1964-68v03/d79) (the memorandum,
        undated; the covering note of July 22). [[w.mann-grand-delusion]], 452–53 (all but the areas held). Names: Galbraith,
        Johnson.'
      tags:
      - name:galbraith-john-kenneth
      - name:johnson-lyndon-b
      src:
        c: 9da8f823
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d79: all'
        - 'w.mann-grand-delusion 452–53: A-C, E-F'
        - 'via w.mann-grand-delusion 453 n.45: A-C, E-F'
- edit:
    id: cal.1965-08-05.vietnam-congress
    base: 1377a67f
    set:
      n: '[FRUS 1964–68, III, doc. 110](https://history.state.gov/historicaldocuments/frus1964-68v03/d110). [[w.gibbons-u-s-government-and]],
        IV, 34. Made public: FRUS 1964–68, III (1996). [[w.mann-grand-delusion]], 464 (Taylor). Names: McNamara, Rusk, Johnson,
        Taylor.'
      c: 'The NSC. McNamara on the Armed Services committees: "broad support, but this support is thin. There is a feeling
        of uneasiness and frustration"; Republicans "overstating" the war''s cost to the economy. Rusk: good support in House
        Foreign Affairs. Taylor: "By the end of 1965, the North Vietnamese offensive will be bloodied and defeated without
        having achieved major gains"; "1966 could be a decisive year."'
      src:
