- add:
    entry:
      id: cal.1961-04-28.vietnam
      when: Apr. 28
      date: '1961-04-28'
      thread: vietnam
      c: 'Sorensen to Kennedy, for Bundy, Bell and himself: approve only "the basic concept" of the task force''s report,
        a first draft. "There is no clearer example of a country that cannot be saved unless it saves itself."'
      n: '[FRUS 1961–63, I, doc. 37](https://history.state.gov/historicaldocuments/frus1961-63v01/d37). [[w.mann-grand-delusion]],
        233. See [[cal.1961-04-20.vietnam]]. Names: Sorensen, Kennedy, McGeorge Bundy, Bell.'
      tags:
      - name:sorensen-theodore-c
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:bell-david-e
      src:
