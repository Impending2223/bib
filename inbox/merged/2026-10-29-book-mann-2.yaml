- add:
    entry:
      id: cal.1961-10-31.vietnam-2
      when: Oct. 31
      date: '1961-10-31'
      thread: vietnam
      also:
      - vietnam-force-levels
      c: 'Robert H. Johnson of the NSC staff to McGeorge Bundy, "Planning for Viet Nam": the flood-relief force unlikely to
        stay so; "Many in Washington are convinced that the longer the forces remained in Viet Nam, the more they would come
        under attack and the more they would become involved in combat."'
      n: '[FRUS 1961–63, I, doc. 202](https://history.state.gov/historicaldocuments/frus1961-63v01/d202). [[w.mann-grand-delusion]],
        246–47. Names: Robert H. Johnson, McGeorge Bundy.'
