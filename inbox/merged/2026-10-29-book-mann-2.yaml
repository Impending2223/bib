      when: Mar. 23
      date: '1965-03-23'
      thread: vietnam
      c: 'Tuesday lunch, 2:43 to 3:46 p.m., Johnson with Rusk, McNamara and McGeorge Bundy. By Bundy''s notes, Johnson: "Where
        are we going?" McNamara: "our message may be getting thru." Johnson: "Do they know we''re willin to talk"; "You can
        revisit targets. I don''t wanna run out of targets & I don''t wanna go to Hanoi. I was a hell of a long time getting
        into this. But I like it."'
      n: '[FRUS 1964–68, II, doc. 212](https://history.state.gov/historicaldocuments/frus1964-68v02/d212) (editorial note:
        the Daily Diary; Bundy''s notes). [[w.mann-grand-delusion]], 418 (Johnson''s words). Names: Johnson, Rusk, McNamara,
        McGeorge Bundy.'
