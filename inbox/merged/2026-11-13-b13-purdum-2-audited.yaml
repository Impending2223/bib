- cite:
    id: cal.1964-04-13.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 258–59 (the quorum call at 2:20 p.m. that Holland raised, the announcer
      at D.C. Stadium alerting the crowd; fifteen pro-civil-rights Senators hurrying back; Russell, a baseball fan, staying
      in his seat; not Johnson''s first pitch, the limousines nor Humphrey''s words)'
    units: C, D
- cite:
    id: cal.1964-04-15.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 258 (the bipartisan floor leaders'' meeting on the morning of Monday,
      Apr. 13: Rauh asks Horn about Dirksen''s amendments, Horn: "Keep smiling"; Humphrey, arriving late, says he has talked
      Dirksen down from some seventy amendments to about fifteen; Mitchell: if they prevail "a disaster," a "Negro revolution";
      Humphrey: "We don''t plan on letting them pass"; not the cloture date; the note cites Horn''s log, 87)'
    units: '?'
- variant:
    id: cal.1964-04-15.civil-rights-bill-2
    unit: A
    witness: w.purdum-idea-whose-time-has-2014
    reads: Humphrey told the floor leaders' group on Monday, Apr. 13, that he had talked Dirksen down from some seventy
      amendments to about fifteen
    at: '258'
- check:
    id: cal.1964-04-15.civil-rights-bill-2
    text: 'Check: Purdum, 258, has the report on Monday, Apr. 13, as Whalen does, and gives seventy amendments, not forty.'
- cite:
    id: cal.1964-04-16.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 260 (the floor leaders'' meeting in Humphrey''s office on Thursday, Apr.
      16: Humphrey, "We want them to make fools of themselves," cloture to be planned, "We don''t have sixty-five votes";
      Johnson grabbed his shoulder and "damn near broke my arm" three weeks before on round-the-clock sessions; Mitchell:
      "You are shooting the friends if you trade with Dirksen"; the Senate wives; "we aren''t going to sell out. If we do,
      it will be for a hell of a price"; the quorum bells; the note cites Horn''s log, 94)'
    units: D-F
- cite:
    id: cal.1964-04-16.republican-party-congress
    item: '[[w.purdum-idea-whose-time-has-2014]], 261–62 (Dirksen''s ten amendments to Title VII, introduced Apr. 16 and
      not yet called up, as the Times listed them: the commission to take jurisdiction after six months if a State agency
      had done nothing, a suit six months after that; union hiring halls an employment agency; the commission''s studies
      public; the complaint to be filed by the employee himself, not a third party; no publicity of the conciliation; suits
      only where the offense occurred; the atheist clause struck; willfulness; no special master; records as State law requires;
      and an eleventh, the "mystery amendment," to come; thirty States with fair employment laws, seventeen of them with
      twenty-three Republican Senators)'
    units: '?'
- cite:
    id: cal.1964-04-16.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 262–63 (Kimball''s report to Horn that afternoon, Apr. 16: McCulloch had
      accepted some of Dirksen''s ideas but found others objectionable, State agencies preempting federal action among them;
      Halleck did not "give a damn" either way; the two Republican aides agree Dirksen is being "dramatic"; Purdum has it
      the day of the ten amendments, as Horn''s log does)'
    units: '?'
- cite:
    id: cal.1964-04-19.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 264 (the vigil begun Sunday, Apr. 19, of Protestant, Catholic and Jewish
      seminarians, in shifts, until the bill passed; students from seventy-five seminaries; the seventh week of the filibuster)'
    units: A
- cite:
    id: cal.1964-04-21.republican-party-congress
    item: '[[w.purdum-idea-whose-time-has-2014]], 264–65, 267 (Dirksen''s "eleventh amendment," Apr. 21: State agencies
      three months (six for new ones) before the federal commission acts, then a suit and the Department''s intervention
      at the court''s discretion, aimed at McCulloch; "It keeps the local spirit"; Humphrey: "a bit troublesome," "The more
      we see of the amendments, the better we like the House bill"; the talk on the floor that day (Stewart''s diary): Dirksen
      knows the bill will pass and that it is his duty to lend it his weight, agrees to help round up Republican votes for
      cloture; not "a good bill" nor the amendment to Title II)'
    units: A, C
- cite:
    id: cal.1964-04-21.civil-rights-organizations-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 265–66 (Russell, confiding to Mitchell that he had no hope of major compromises
      from Johnson, though he thought the Southerners could have had them from Kennedy: "The jig is just about up"; Purdum
      gives no day, in the run of Apr. 21 (note 266, Stewart''s manuscript in Loevy, 95–96); the thirty-seven-day record
      passed after Dirksen''s amendment)'
    units: A
- cite:
    id: cal.1964-04-21.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 266–67 (Talmadge''s amendment, a jury in all criminal contempt cases under
      the bill, called up as the pending business; asked whether he would press a vote that day, no; Robertson: "a considerable
      elucidation"; Russell on the floor, "the time of Chaucer" (the note: 110 Cong. Rec. 8650, 8666); the 1957 Act''s nonjury
      trials in voting cases, $300 or forty-five days; the House bill''s retention of that for Titles I and II)'
    units: A
- cite:
    id: cal.1964-04-24.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 267 (Friday, Apr. 24: the Mansfield-Dirksen substitute for Talmadge''s
      amendment, nonjury trials in criminal contempt, $300 or thirty days (the administration wanting the House bill''s
      forty-five, Dirksen ten); not Russell''s "mustard plaster")'
    units: '?'
- cite:
    id: cal.1964-04-28.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 268 (the interfaith convocation at Georgetown on Tuesday, Apr. 28, five
      thousand religious leaders by Purdum; the clergy on the Hill after; not the sixty-five hundred nor Humphrey''s suggestion)'
    units: '?'
