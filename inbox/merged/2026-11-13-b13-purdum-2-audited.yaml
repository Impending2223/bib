      when: Apr. 20
      date: '1964-04-20'
      thread: civil-rights-bill
      c: 'The bipartisan floor leaders'' group, morning. Horn: Dirksen''s amendments are meant to make the fair employment
        title palatable to northern business. Katzenbach: northern businesses that do not discriminate may be put off by
        Title VII "because of the records-keeping and the bureaucracy."'
