      when: July 3
      date: '1964-07-03'
      thread: civil-rights-bill
      c: 'Johnson to Governor Paul Johnson of Mississippi by telephone, on the advice he gave the civil rights leaders the
        night before: "Let''s take this thing slow and easy ... and kind of adjust to it instead of making mass invasions
        and mass violations." The Governor: the success of the thing depends on how fast some Negro leaders like to move,
        and they could make it "mighty, mighty rough." Johnson: "you keep a stiff upper lip, and if you need me, call me."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 326. Names: Johnson, Paul Johnson. Check: the hour.'
