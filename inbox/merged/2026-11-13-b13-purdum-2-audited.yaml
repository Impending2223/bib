      when: May 2
      date: '1964-05-02'
      thread: civil-rights-bill
      c: 'Senate, Saturday. Humphrey wonders whether votes on all pending amendments and the bill might come by Memorial
        Day: he has no holiday in mind but the Fourth of July. Ellender: "How about Christmas?"'
      n: '[[w.purdum-idea-whose-time-has-2014]], 273. To check: 110 Cong. Rec. 9854 (May 2, 1964) (cited by [[w.purdum-idea-whose-time-has-2014]],
