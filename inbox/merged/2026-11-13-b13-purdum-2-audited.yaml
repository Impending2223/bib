      id: cal.1964-07-02.civil-rights-bill-8
      when: July 2
      date: '1964-07-02'
      thread: civil-rights-bill
      c: 'The House, 402 of 435 present, the hour''s debate on H. Res. 789. Smith: "The bell has tolled"; a "monstrous instrument
        of oppression." McCulloch: the bill will not tell banks whom to lend to nor require quotas; "twenty million Americans
        can, for the first time, dream some dreams"; the House rises for him. Weltner, against the bill in February, for
        it now: "We can accept the verdict of the nation." Celler: "Further delay ... would be fatal"; Smith first on his
        feet to applaud him.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 318–19. To check: 110 Cong. Rec. 15870–96 (July 2, 1964) (cited by [[w.purdum-idea-whose-time-has-2014]],
        366). See [[cal.1964-07-02.civil-rights-bill]]. Names: Smith, McCulloch, Celler. Check: the hour of the debate.'
      src:
