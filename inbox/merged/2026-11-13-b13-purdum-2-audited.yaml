      when: May 8
      date: '1964-05-08'
      thread: civil-rights-bill
      also:
      - republican-party-congress
      c: 'Afternoon. Pro-civil-rights Republicans of both Houses with McCulloch, on strengthening amendments in the Senate.
        McCulloch: "I don''t believe a useful purpose is served to try to make the House-passed bill stronger"; to Javits,
        on State elections in Title I, he gave that up to "get the show on the road." Copenhaver, Republican counsel of
        the House Judiciary Committee: "If the House of Representatives had the bill before it today, it could not pass
        the present bill."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 283. Names: McCulloch, Javits.'
      src:
