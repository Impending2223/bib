      thread: civil-rights-bill
      c: 'C. C. "Charley" McDonald of Wichita Falls, Tex., an old political friend, to Johnson by telephone: "You became
        president yesterday. That was your most wonderful hour. It only comes to a president about every forty years."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 326. Names: Johnson. Check: the hour.'
