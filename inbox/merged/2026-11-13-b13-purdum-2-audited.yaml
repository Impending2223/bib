      when: July 3
      date: '1964-07-03'
      thread: civil-rights-bill
      c: 'The Ranch. Johnson, waking late, telephones Robert Kennedy first. The mail on the bill: "It runs about 70–50";
        "I don''t tell that figure to anybody." Kennedy: Governor Paul Johnson of Mississippi has called for noncompliance
        until the courts test the law; the President might call him. "It''s been relatively calm"; in Jackson, for the first
        time, some Negroes and whites sitting down together.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 325. To check: TPR, Johnson, vol. 8, 400–01 (cited by [[w.purdum-idea-whose-time-has-2014]],
        367). Names: Johnson, Kennedy, Paul Johnson. Check: the hour.'
