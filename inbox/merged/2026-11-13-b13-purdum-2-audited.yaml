- cite:
    id: cal.1964-04-29.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 268 (Johnson to representatives of the convocation at the White House,
      the day after: "It is your job, as men of God, to reawaken the conscience of your beloved land"; Purdum does not give
      the number nor the sentence the entry quotes)'
    units: '?'
- cite:
    id: cal.1964-04-29.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 270–71 (the call to Mansfield from the White House before Dirksen came:
      Dirksen "gave out a long interview of what he was going to tell me today before he comes, which is not like him";
      his words about Dirksen''s talk of his beagle; Mansfield, reluctantly weighing cloture on the jury trial question;
      Johnson: "These details can''t be decided down here in the White House"; Mansfield: "I''ll put it back on us and stroke
      his back" (the note: TPR, Johnson, vol. 6, 326); not the hour)'
    units: '?'
- cite:
    id: cal.1964-04-29.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 270–71 (Dirksen in the Oval Office with a "Baby Ben" alarm clock and the
      chief executive of the LaSalle, Ill., firm that made them; no deal; in and out in under twenty minutes; told the press
      the two had barely touched civil rights; what he had told reporters he would argue, "you are not going to get it.
      Now it''s your play" (270))'
    units: B
- cite:
    id: cal.1964-04-30.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 271 (Johnson to Humphrey the next day, Thursday, Apr. 30: "I''m against
      any amendments. Going to be against them right up until I sign them" (the note: TPR, Johnson, vol. 6, 360); the words
      differ from the entry''s slightly; not the hour)'
    units: '?'
- variant:
    id: cal.1964-04-30.civil-rights-bill
    unit: A
    witness: w.purdum-idea-whose-time-has-2014
    reads: '"I''m against any amendments. Going to be against them right up until I sign them"'
    at: '271'
- cite:
    id: cal.1964-05-01.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 272 (Friday, May 1: Morton calls up his jury trial perfecting amendment
      and Cooper''s, which take precedence over the Mansfield-Dirksen one; Russell drops his objection to amendments and
      agrees with Mansfield and Dirksen that voting begin Wednesday, May 6)'
    units: A, B
- cite:
    id: cal.1964-05-04.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 273 (Kenneth Washington, twenty-six, of Passaic, N.J., shouting from the
      gallery while Smathers spoke against Title VII to an almost empty chamber; held at D.C. General Hospital for mental
      observation; the words differ ("when there are only five of you here"))'
    units: '?'
- variant:
    id: cal.1964-05-04.civil-rights-bill
    unit: B
    witness: w.purdum-idea-whose-time-has-2014
    reads: '"How can you say you are protecting the black man when there are only five of you here?"'
    at: '273'
- cite:
    id: cal.1964-05-05.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 273–76 (Tuesday morning, May 5, in Dirksen''s office, thirty-three paces
      from the floor, under a chandelier that had been Jefferson''s: Humphrey, Kuchel, Robert Kennedy, Katzenbach, with
      the bipartisan group of aides; Dirksen announces scores of amendments, not one on Title II, from his lawyers Neal
      Kennedy, Flynn and Waters, in three tracks, A (technical), B (semitechnical), C (substantive); Neal Kennedy and Teasdale
      the aides'' two chiefs, a 60-40 ratio; Hickenlooper "softie," walks out and does not return; Kuchel to Horn, undated,
      "pretty disgusted with the Dirksen slowdown" (277; the note cites Horn''s log, 159))'
    units: '?'
- cite:
    id: cal.1964-05-05.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 277 (Johnson at the weekly meeting with the Democratic leaders, just before
      the working group, lobbying for cloture; Hayden, eighty-six, president pro tem, who had never voted for it, and the
      Central Arizona Water Project; Udall''s memo within days (see May 7))'
    units: '?'
- cite:
    id: cal.1964-05-06.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 278–79 (Wednesday, May 6, Morton''s amendment: four roll calls, 45–45
      (failed for want of a majority), 44–47 on the motion to table the motion to reconsider (Moss, in the cloakroom, missed
      the first vote and voted against tabling out of spite, by Purdum), reconsideration carried 46–45, then 45–46 against,
      and Cooper''s amendment defeated; the Times'' "hairbreadth victory"; O''Brien: it "shook hell out of them"; Stewart''s
      diary; Russell then holds the vote on the Mansfield-Dirksen amendment until the next week for the poverty tour of
      Appalachia and the South)'
    units: A, C, E, F
- variant:
    id: cal.1964-05-06.civil-rights-bill
    unit: B
    witness: w.purdum-idea-whose-time-has-2014
    reads: Morton's amendment, a jury in criminal contempt cases under every title but Title I
    at: '272'
- cite:
    id: cal.1964-05-06.press-and-broadcasting
    item: '[[w.purdum-idea-whose-time-has-2014]], 279 (Johnson''s news conference that day: if Congress has not finished
      the civil rights debate he will call it back after the summer conventions, "The people''s business must come first"
      (the note: 1963–64 Pub. Papers 618); not the setting)'
    units: F
- cite:
    id: cal.1964-05-06.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 277–78 (Wednesday, May 6: Mansfield tells the White House that Hickenlooper
      is irritated at the Administration for refusing his candidate for ambassador to the Philippines, and might be soothed
      by consultation on Latin America; he might bring Mundt, Pearson, Hruska and Curtis; Johnson dispatches Rusk)'
    units: C
- cite:
    id: cal.1964-05-07.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 277 (Hayden''s staff''s view, in Udall''s memo to Johnson, that his "gambit
      on cloture" had been "very persuasive"; Purdum has the memo "within days" of the offer of the water project, with
      no day; not the Nevada senators (the note: Whalen, 174, 178))'
    units: '?'
- cite:
    id: cal.1964-05-07.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 280–82 (Thursday, May 7, the morning session: Dirksen on how to define
      discrimination punishable under Title II, Neal Kennedy for an offense self-evident as a speed limit is, the Justice
      lawyers wanting authority to enjoin all the businesses of an area; that afternoon, staff only, Teasdale of Mansfield''s
      staff suggests "pattern or practice," Neal Kennedy and the Republicans like it, Ferris telephones Burke Marshall,
      who thinks it "sounded great"; the phrase put into Titles II and VII, employment discrimination to be "willful"; that
      evening Kuchel to Humphrey on a cloture vote in a couple of weeks, Humphrey "pretty discouraged," floating it "to
      keep the civil rights groups in line," no action "before the first week in June" (Kuchel to Horn; the note: Horn''s
      log, 168))'
    units: F
- variant:
    id: cal.1964-05-07.civil-rights-bill-3
    unit: C
    witness: w.purdum-idea-whose-time-has-2014
    reads: Teasdale of Mansfield's staff, in the afternoon meeting limited to staff, suggests "pattern or practice"; Neal
      Kennedy and the Republicans like the phrase
    at: '281'
- check:
    id: cal.1964-05-07.civil-rights-bill-3
    text: 'Check: Purdum, 281, has Ken Teasdale of Mansfield''s staff suggest "pattern or practice" at the afternoon meeting
      of staff, the Dirksen lawyers liking it; the entry has Flynn of Dirksen''s staff propose it.'
- cite:
    id: cal.1964-05-08.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 282 (the speech, elsewhere in Atlanta while Johnson was with the legislature;
      the note: [[w.whalen-longest-debate]], 178)'
    units: A, B
- cite:
    id: cal.1964-05-12.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 284, 290 (Tuesday, May 12, the leaders'' weekly meeting with Johnson:
      Mansfield, "progress on the bill to date is nil" (the note: TPR, Johnson, vol. 6, 954); Johnson again for round-the-clock
      sessions; Humphrey''s estimate the day before the agreement, fifty-five solid votes and eight possible (290); not
      the breakfast nor the refusal)'
    units: B, C
- cite:
    id: cal.1964-05-13.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 286–89 (Wednesday, May 13, the fifth day of Neal Kennedy''s group: Dirksen
      on mimeographing the amendments and caucuses and cloture title by title; the Attorney General''s enforcement powers,
      Dirksen''s separate Title XII dropped, suits only for a "pattern or practice"; the Civil Rights Commission''s voter-fraud
      authority kept at McCulloch''s insistence, Robert Kennedy declining to remove it; Mundt''s exemption of Indian jewelry
      makers; Clark''s walkout, "a goddamn sellout," prearranged by the civil rights side, and Humphrey, "See what I''m
      up against?"; Dirksen, Kennedy and Humphrey to the press, "We have a good agreement," "perfectly satisfactory," Humphrey
      "And to me, too"; McCulloch accepts)'
    units: A, E-G
- cite:
    id: cal.1964-05-13.republican-party-congress
    item: '[[w.purdum-idea-whose-time-has-2014]], 289–90 (Johnson''s call to Dirksen minutes after the Attorney General''s,
      which came shortly after 4:00 p.m.: Dirksen had talked to Russell that morning, who "gave me no comfort" and would
      not set votes; "fish or cut bait"; Johnson, the animatronic Lincoln seen at the Illinois pavilion of the World''s
      Fair, "worthy of the Land of Lincoln," "the man from Illinois is going to pass the bill" (the note: TPR, Johnson,
      vol. 6, 662))'
    units: B, D
- cite:
    id: cal.1964-05-13.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 289–90 (Robert Kennedy''s call to Johnson shortly after 4:00 p.m., "Wonderful,
      congratulations," the civil rights lobby "not going to be happy" (vol. 6, 652); later that evening Johnson to Humphrey,
      who has had dinner with Dirksen the night before: Dirksen can get twenty-five votes; "a much better bill than anybody
      even dreamed possible"; Johnson on the Volstead Act (697); Purdum has the two as separate calls)'
    units: C
- cite:
    id: cal.1964-05-13.baker-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 290–91 (Johnson to Mansfield the evening of the deal with Dirksen, on
      the Republicans'' effort to widen the Rules Committee''s inquiry into the Baker affair to Senators: "lowdown, dirty,
      cheap politics" (the note: TPR, Johnson, vol. 6, 690); Purdum does not mention the taping of Mrs. Johnson''s tenants)'
    units: '?'
- cite:
    id: cal.1964-05-13.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 290 (Gruening to Humphrey, who owed the earthquake aid to Johnson: "I
      am prepared, before long, to vote for cloture"; not the day)'
    units: '?'
- cite:
    id: cal.1964-05-14.baker
    item: '[[w.purdum-idea-whose-time-has-2014]], 291 (Thursday, May 14, the Senate: Mansfield challenges Williams to "name
      the senator or senators"; refusing to yield to Case, a fifteen-minute shouting match, "one of the angriest debates
      in recent congressional history" (the Times), Edward Kennedy presiding orders Case to his seat; the motion carried
      42–33; Stewart fears the loss of cloture votes)'
    units: '?'
- cite:
    id: cal.1964-05-14.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 288–89 (McCulloch''s acceptance, let known to Dirksen after the press
      conference of May 13, and his summing up that Dirksen had written "amendments into the bill which left the bill little
      changed"; Purdum gives no day for either)'
    units: '?'
- cite:
    id: cal.1964-05-15.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 291 (Friday, May 15, Patricia Connell, Keating''s counsel, asks Katzenbach;
      "Marshall and I will slit our throats" (Horn''s log, 197))'
    units: '?'
- variant:
    id: cal.1964-05-15.civil-rights-bill
    unit: A
    witness: w.purdum-idea-whose-time-has-2014
    reads: '"Marshall and I will slit our throats"'
    at: '291'
- cite:
    id: cal.1964-05-19.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 292 (Tuesday, May 19: the Democrats'' caucus in the Old Senate Chamber,
      the Southerners dour, Russell: Dirksen''s amendments make it "a punitive expedition into the South," Stennis, Clark
      and Hart saying they could live with it; the Republicans'' in a conference room off the floor, Hickenlooper "a gargantuan
      thing!" and Simpson "warmed it over like hash")'
    units: A, B, D
- cite:
    id: cal.1964-05-20.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 292–93 (Tuesday, May 19, after the Republican caucus, Dirksen in the press
      gallery: a "little sermon" on reforms once controversial; "No army can withstand the strength of an idea whose time
      has come" (Purdum''s note, 364: no such passage in Hugo''s diary has surfaced; Mann, 422); "Sarge, they''re shooting
      at us!"; "it can''t be stopped"; Purdum has the sermon on May 19, not May 20)'
    units: '?'
- check:
    id: cal.1964-05-20.civil-rights-bill
    text: 'Check: Purdum, 292–93, has the sermon in the press gallery on May 19, after the Republican caucus.'
- cite:
    id: cal.1964-05-20.republican-party-congress
    item: '[[w.purdum-idea-whose-time-has-2014]], 293 (the Republicans'' meetings of May 20 and 22 on the changes; not Hickenlooper''s
      words)'
    units: '?'
- cite:
    id: cal.1964-05-26.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 293–94 (Tuesday, May 26: Dirksen, with Mansfield, offers the package as
      a substitute for the whole of H.R. 7152, adding a clause in Title VII against preferential treatment and quotas for
      racial imbalance; "every word, every comma"; Mansfield hoping cloture will be attempted before long; Humphrey: a "practical,
      commonsense approach")'
    units: '?'
- cite:
    id: cal.1964-05-26.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 294 (Russell that day on the package: "As one who lives in the South ...
      I resent this political foray"; the "gagging"; "history"; Humphrey objecting to "those who have participated in this
      historic gathering" feeling it over (110 Cong. Rec. 11943))'
    units: '?'
- check:
    id: cal.1964-05-26.civil-rights-bill-3
    text: 'Check: Purdum, 292, puts "a punitive expedition into the South" in Russell''s remarks to the Democratic caucus
      of May 19; for May 26 he gives the words quoted above (294).'
- cite:
    id: cal.1964-05-26.civil-rights-bill-4
    item: '[[w.purdum-idea-whose-time-has-2014]], 294–95 (Johnson, Tuesday, May 26, lobbies Cannon of Nevada, his protege
      since 1959, gently on cloture: "It wasn''t a sell-type meeting" (Cannon, in Whalen, 187); not the committee places)'
    units: '?'
- cite:
    id: cal.1964-06-01.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 295 (Monday, June 1, Dirksen promises an annotated copy of the changes,
      "crystal clear, with brackets and underscoring" (the note: 110 Cong. Rec. 12275); Dirksen then ill at home; no petition)'
    units: '?'
- variant:
    id: cal.1964-06-01.civil-rights-bill
    unit: A
    witness: w.purdum-idea-whose-time-has-2014
    reads: On Monday, June 8, Mansfield alone moves under Rule XXII to bring debate to a close; on June 1 Dirksen promises
      to circulate an annotated copy of his changes
    at: 295, 297–98
- variant:
    id: cal.1964-06-01.civil-rights-bill
    unit: C
    witness: w.purdum-idea-whose-time-has-2014
    reads: The cloture motion to be voted at ten o'clock on Wednesday, June 10, after the two days; Mansfield had hoped
      for Tuesday, June 9, and agreed to Wednesday on Friday, June 5
    at: 296, 298
- check:
    id: cal.1964-06-01.civil-rights-bill
    text: 'Check: Purdum, 295–98, has no petition on June 1: Dirksen was ill at home; Mansfield, hoping for Tuesday, June
      9, set the vote for Wednesday, June 10 on Friday, June 5, and moved for cloture on Monday, June 8 (see [[cal.1964-06-08.civil-rights-bill]]).'
- cite:
    id: cal.1964-06-02.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 295 (Russell, Dirksen being ill, ready to vote at once on the remaining
      jury trial amendments; the civil rights side, short of the cloture votes, slowing the floor; not the twenty minutes''
      notice, the day nor the words)'
    units: '?'
- cite:
    id: cal.1964-06-04.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 297 (Miller of Iowa, a Catholic and former Notre Dame law professor, announced
      he would agree to cut off debate, heavily lobbied by the archbishop of Dubuque; Purdum gives no day)'
    units: '?'
- cite:
    id: cal.1964-06-05.republican-party-congress
    item: '[[w.purdum-idea-whose-time-has-2014]], 296–97 (Friday, June 5: Dirksen back at his office finds a revolt, Hickenlooper
      leading, Cotton and Hruska wanting amendments of their own; Hickenlooper asks unanimous consent to vote Tuesday on
      Morton''s jury trial amendment, Cotton''s (Title VII only for firms of a hundred or more, not twenty-five) and his
      own to delete the school desegregation aid provisions; Douglas: a "Pandora''s box"; Russell defers to Saturday; overnight
      Humphrey gets Mundt, Hruska and Cotton to promise cloture; Saturday morning, no objection, four hours for each amendment)'
    units: B
- variant:
    id: cal.1964-06-05.republican-party-congress
    unit: A
    witness: w.purdum-idea-whose-time-has-2014
    reads: Hickenlooper's own amendment to delete all provisions relating to aid for the desegregation of public schools
    at: '296'
- check:
    id: cal.1964-06-05.republican-party-congress
    text: 'Check: Purdum, 296, has Hickenlooper''s own amendment strike all provisions for aid to the desegregation of public
      schools, not the training of school personnel.'
- cite:
    id: cal.1964-06-06.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 297 (Saturday, June 6: Russell remonstrates with Humphrey for agreeing
      to Hickenlooper''s demands while refusing his own; Humphrey: "Well, Dick, you haven''t any votes to give us on cloture
      and these fellows do" (the note: Humphrey''s memorandum, in Loevy, 91))'
    units: A, B
- cite:
    id: cal.1964-06-08.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 297–98 (Monday, June 8: Mansfield, Metcalf presiding, "We, the undersigned
      Senators ... hereby move to bring to a close the debate" under Rule XXII; the vote at ten o''clock Wednesday after
      two days, debate limited to one hour; not the signers)'
    units: '?'
- cite:
    id: cal.1964-06-09.civil-rights-bill-4
    item: '[[w.purdum-idea-whose-time-has-2014]], 298–99 (Tuesday, June 9: Morton''s amendment passes 51–48 (jury trials
      in all criminal contempt except Title I, $1,000 or six months; the Justice lawyers find it harmless), Hickenlooper''s
      fails 40–56, Cotton''s 34–63; Mansfield warns of speeches past midnight; at 7:38 p.m. Byrd begins his eight-hundred-page
      speech, "the bill would not create any new civil rights" (110 Cong. Rec. 13133), to end no later than 9:59 a.m.; his
      verse and Humphrey''s reply on the roses in Chevy Chase)'
    units: A-E
- cite:
    id: cal.1964-06-09.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 298 (Johnson to Robert Kennedy after the vote on Morton''s amendment:
      "Does this jury amendment bother you any?" Kennedy: "No, I think it makes it much more difficult, but hell, we can
      live with it" (the note: TPR, Johnson, vol. 7, 149); Purdum gives no hour; not the call of 12:25 p.m., which may be
      another)'
    units: '?'
- cite:
    id: cal.1964-06-09.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 299 (That night, after Byrd began, Humphrey told Johnson he was sure of
      sixty-eight votes, forty-two of them Democrats (Edmondson, whom Johnson had lobbied, now agreed because of the Morton
      amendment); Johnson: "the Republicans are doing a little better than we are"; Dirksen confident of at least twenty-six
      of thirty-three)'
    units: '?'
- variant:
    id: cal.1964-06-09.civil-rights-bill
    unit: D
    witness: w.purdum-idea-whose-time-has-2014
    reads: Humphrey sure of sixty-eight votes, forty-two of them Democrats
    at: '299'
- check:
    id: cal.1964-06-09.civil-rights-bill
    text: 'Check: Purdum, 299, has Humphrey tell Johnson that night he is sure of sixty-eight votes, forty-two of them Democrats.'
- cite:
    id: cal.1964-06-10.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 297–303 (Morton''s amendment adopted the day before, 51–48, jury trials
      in criminal contempt but for Title I (297–98); Byrd''s speech, fourteen hours and thirteen minutes; Dirksen: "Stronger
      than all the armies is an idea whose time has come"; Engle''s vote; Williams''s the sixty-seventh; 71–29; not the
      party counts nor 1917 (the notes: 110 Cong. Rec. 13308–19))'
    units: B-D
- cite:
    id: cal.1964-06-10.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 305 (Mitchell walks Russell back to his office; Russell praises Humphrey''s
      fairness and the Southerners'' being heard, which will make the bill enforceable in the South (Humphrey, *Education
      of a Public Man*, 211))'
    units: A-C
- cite:
    id: cal.1964-06-10.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 304 (Russell''s motion on the Mansfield-Dirksen substitute and the words
      "the spirit of not only the mob but of a lynch mob")'
    units: B
- cite:
    id: cal.1964-06-10.civil-rights-bill-5
    item: '[[w.purdum-idea-whose-time-has-2014]], 304–05 (after cloture: Ervin''s double-jeopardy amendment to the pending
      Talmadge amendment, 47–48, Metcalf announcing it failed, Talmadge withdrawing, Metcalf then announcing 49–48 for Ervin,
      null; Russell''s delay of Title II to Nov. 15, 1965, 40–59; Gore''s amendment to strike Title VI after the three o''clock
      recess, easily defeated; Mansfield: recess to regroup (110 Cong. Rec. 13330); the revised Ervin language, Humphrey
      distraught (Stewart))'
    units: A-D
- cite:
    id: cal.1964-06-11.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 305 (Thursday, June 11, the floor leaders agree to oppose all amendments
      but minor ones accepted by both parties'' leaders; the revised Ervin amendment passes 80–16; the next eleven Southern
      amendments fail)'
    units: B, C
- cite:
    id: cal.1964-06-13.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 306 (Saturday, June 13: Tower''s amendment to Title VII after the Motorola
      case, strongly backed by Dirksen, an ability test not "designed, intended or used" to discriminate, voice vote)'
    units: A, C
- cite:
    id: cal.1964-06-15.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 306 (Monday, June 15: Humphrey and Kuchel announce publicly that liberals
      should refrain from strengthening amendments; Russell has lost his stomach for the fight)'
    units: '?'
- cite:
    id: cal.1964-06-16.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 306–07 (Tuesday, June 16: Mansfield keeps the Senate in thirteen hours,
      11 a.m. to 12:01 a.m., thirty-four roll calls, the most in a day; Dirksen, "well-oiled," at Russell Long on an amendment
      after he thought they had agreed: "You''ve broken our agreement! ... you''ve welshed on our deal!" (Stewart; Purdum
      gives "one evening"))'
    units: A
- cite:
    id: cal.1964-06-17.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 307 (Wednesday, June 17: Ervin and Thurmond promise to limit the amendments
      they will call up, so that the final vote can come by Friday, June 19; of 117 amendments after cloture, eleven minor
      ones adopted)'
    units: '?'
- cite:
    id: cal.1964-06-17.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 307 (the substitute, "as it was now known" the Dirksen-Mansfield-Humphrey-Kuchel
      amendment, passes that evening, 76–18, forty-six Democrats and thirty Republicans; Mansfield: return at eleven Thursday)'
    units: A
- cite:
    id: cal.1964-06-17.civil-rights-bill-4
    item: '[[w.purdum-idea-whose-time-has-2014]], 307 (Humphrey summoned off the floor in midafternoon to a call from his
      wife, their son Bob''s malignant growth, major surgery; Mitchell and Rauh, dropping by happy, joining him in tears;
      "I had a terrible time pulling myself together to go back to the Senate floor"; Purdum has the call before the vote
      on the substitute (the evening))'
    units: '?'
- check:
    id: cal.1964-06-17.civil-rights-bill-4
    text: 'Check: Purdum, 307, has the call in midafternoon, hours before the vote on the substitute that evening, not after
      it.'
- cite:
    id: cal.1964-06-18.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 307–08 (Thursday, June 18: Russell, nineteen of his sixty minutes left,
      "the moving finger is writing the final act of the longest debate and the greatest tragedy"; Edward Kennedy, presiding:
      "The time of the Senator from Georgia has expired"; Russell, tears in his eyes: "I express the hope that those who
      are keeping the time will apply the same rules to others"; Kuchel for the Republican leadership, "an American achievement")'
    units: A, B
- cite:
    id: cal.1964-06-19.civil-rights-bill-6
    item: '[[w.purdum-idea-whose-time-has-2014]], 309 (the seventy-sixth and final edition of the newsletter, on the day
      one year after Kennedy submitted the bill; "we have miles to go before we sleep")'
    units: A
- cite:
    id: cal.1964-06-19.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 307–10 (the substitute adopted June 17, 76–18 (307); Goldwater, June 18,
      against the bill though he opposes "discrimination of any sort": it would "require the creation of a federal police
      force of mammoth proportions" (308–09); Gore''s motion to recommit, 25–74; at 7:40 p.m., 73–27, all but six of the
      thirty-three Republicans, forty-six of the sixty-seven Democrats; not Yarborough, nor Goldwater''s "no constitutional
      basis" nor his vote)'
    units: A, C, D
- cite:
    id: cal.1964-06-19.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 315 (Celler and McCulloch''s joint press release after the Senate vote:
      "Not all the amendments are to our liking," none does serious violence, a conference could fatally delay it)'
    units: A
- cite:
    id: cal.1964-06-19.civil-rights-bill-5
    item: '[[w.purdum-idea-whose-time-has-2014]], 311 (hours after the vote, Humphrey and Stewart leaving by the East Front,
      hundreds still waiting and cheering; "Never in my fifteen years in the Senate ..." (Humphrey, in Whalen, 216))'
    units: D
- cite:
    id: cal.1964-06-19.congress
    item: '[[w.purdum-idea-whose-time-has-2014]], 313 (hours after the vote, Edward Kennedy and Bayh en route to the Massachusetts
      Democratic convention, delayed by the vote, bad weather, a night landing; the pilot and a friend of Kennedy''s killed,
      Bayh dragging him out; three fractured vertebrae, two broken ribs, a bruised kidney; Johnson sent four doctors from
      Walter Reed to Cooley Dickinson Hospital in Northampton)'
    units: C, D
- cite:
    id: cal.1964-06-22.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 316 (Johnson''s call to Halleck on June 22: "We get your civil rights
      bill passed, and you can''t do it without us"; "You sign that up July 4. Give us the next two weeks off in the House";
      Johnson''s thirty-one measures pending, the poverty program among them; Halleck: "Now, goddamn it, Mr. President ..."
      the twenty or thirty members wanting to go to the convention (the note: TPR, Johnson, vol. 8, 539))'
    units: A, C, D
- cite:
    id: cal.1964-06-22.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 315–16 (Monday, June 22, a Senate clerk bringing the bill down the center
      aisle, "A message from the Senate"; Celler and McCulloch prepare H. Res. 789 on concurrence in the Senate amendment,
      which McCormack refers to Rules; to avoid a conference; suspension of the rules considered and dropped, since it could
      not come before July 6)'
    units: A, D
- cite:
    id: cal.1964-06-24.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 317 (Wednesday, June 24: Bolling, after the three days, files the formal
      request for a hearing on H. Res. 789; Smith sets Tuesday, June 30, the last possible day)'
    units: B
- cite:
    id: cal.1964-06-30.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 317 (Tuesday, June 30: Celler first witness, "These changes are not lethal";
      McCulloch to Smith, "I understand you were one of the architects of the Senate bill": "I had some consultation with
      some senators"; the committee, with Brown of Ohio, overrules Smith on prolonging testimony, a closed rule with one
      hour of debate; Bolling''s proposal that Madden, not Smith, present the resolution, Colmer: "If Martin Luther King
      were chairman of this committee ..."; Smith''s proposals of four, three and two hours defeated; Purdum gives no counts)'
    units: '?'
- cite:
    id: cal.1964-07-02.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 318–20, 322–24 (the House, 289 to 126, by the slip passed to Johnson in
      the Cabinet Room; the signing in the East Room, the speech at 6:45 p.m. before the television camera, "Let us close
      the springs of racial poison"; more than seventy pens; not the Heart of Atlanta suit nor Collins)'
    units: A, B
- cite:
    id: cal.1964-07-02.civil-rights-bill-4
    item: '[[w.purdum-idea-whose-time-has-2014]], 312–13 (just before 10:30 a.m., Clare Boothe Luce, outraged by the reports
      of a signing on the Fourth of July: "No, I never had any thought of doing that," "I know it, honey"; he would sign
      it the first moment, Thursday (the note: TPR, Johnson, vol. 8, 350–51))'
    units: B, C
- cite:
    id: cal.1964-07-02.civil-rights-bill-5
    item: '[[w.purdum-idea-whose-time-has-2014]], 314 (Wilkins, one of five Johnson calls after Robert Kennedy''s: "signing
      it as soon as it''s available is the correct idea" (TPR, vol. 8, 359); not the hour nor the firecrackers)'
    units: '?'
- cite:
    id: cal.1964-07-02.civil-rights-bill-7
    item: '[[w.purdum-idea-whose-time-has-2014]], 320 (after the Cabinet meeting, Johnson to Albert, "you''ll get more congratulations
      up here than you''ll get at home"; Purdum does not name Robert Kennedy nor the hour)'
    units: '?'
- cite:
    id: cal.1964-07-02.civil-rights-organizations
    item: '[[w.purdum-idea-whose-time-has-2014]], 324 (the meeting in the Cabinet Room after the signing with King, Wilkins,
      Young, Farmer and others: the rights guaranteed by law, demonstrations unnecessary or self-defeating; Purdum adds
      that the leaders took it as his fear of defeat in November)'
    units: A
- cite:
    id: cal.1964-07-02.civil-rights-bill-3
    item: '[[w.purdum-idea-whose-time-has-2014]], 325 (Moyers: "When he signed the act he was euphoric, but late that very
      night I found him in a melancholy mood as he lay in bed reading the bulldog edition of the Washington Post"; Johnson:
      "I think we just delivered the South to the Republican Party for a long time to come" (Moyers on America, 197))'
    units: '?'
- variant:
    id: cal.1964-07-02.civil-rights-bill-3
    unit: A
    witness: w.purdum-idea-whose-time-has-2014
    reads: late that night, in bed, reading the bulldog edition of the *Washington Post*
    at: '325'
- check:
    id: cal.1964-07-02.civil-rights-bill-3
    text: 'Check: Purdum, 325, has Moyers find Johnson late that night, lying in bed with the bulldog edition of the *Post*,
      not in the Oval Office after the signing.'
- cite:
    id: cal.1964-07-02.mississippi-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 314–15 (Johnson, "this same Thursday," to Hoover: "put fifty, a hundred
      people" on the trail of the Klan and other white supremacist groups in Mississippi; "I don''t want these Klansmen
      to open their mouth without your knowing what they''re saying"; Hoover had told him the missing workers were assumed
      dead; not the hour nor the State office)'
    units: '?'
- variant:
    id: cal.1964-07-02.mississippi-2
