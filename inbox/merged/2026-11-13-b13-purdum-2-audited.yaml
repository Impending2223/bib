      when: Apr. 18
      date: '1964-04-18'
      thread: civil-rights-bill
      c: 'The Justice Department, Saturday. Humphrey and Kuchel with Robert Kennedy and his aides on Dirksen''s amendments:
        no detailed response, no horse trading, until they have seen all of them, the threatened amendment on public accommodations
        among them.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 263. Names: Humphrey, Kuchel, Kennedy.'
