- cite:
    id: cal.1964-07-03.elections-1964-vice-presidency
    item: '[[w.purdum-idea-whose-time-has-2014]], 325–26 (Friday, July 3: Johnson to Connally on how to handle Texas''s
      obligations under the new law, "Everybody wants to observe the law ... When you go to enforcing something, a man gets
      his back up"; Johnson pleased by Southern reaction to the speech: "I didn''t cuddle up to them" (TPR, vol. 8, 417);
      not the running mate)'
    units: '?'
- cite:
    id: cal.1964-07-04.civil-rights-bill
    item: '[[w.purdum-idea-whose-time-has-2014]], 326–27 (Saturday, July 4: Johnson checks in with Robert Kennedy, Jackson''s
      Chamber of Commerce voting to abide, Savannah, Atlanta, Birmingham and Montgomery following; the press interviewing
      the motel proprietors of Johnson City: "They got the right answers, too" (TPR, vol. 8, 446))'
    units: C
- cite:
    id: cal.1964-07-04.mississippi-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 326–28 (the evening call, Johnson testy, not returning to Washington until
      Monday, July 6; Reedy''s quote of the day, that the President had "been in touch with Martin Luther King continuously":
      "I haven''t been in touch with him at all, and don''t want to be. You know his record"; "I''m sorry he was there";
      "you don''t know a damn thing about who I''ve seen" (TPR, vol. 8, 454); Purdum calls these his last recorded thoughts)'
    units: '?'
- cite:
    id: cal.1964-07-05.mississippi
    item: '[[w.purdum-idea-whose-time-has-2014]], 329 (the Robert E. Lee Hotel in Jackson closing its doors "in despair"
      on July 6, 1964 rather than accept integration; reopened later as a private club, then sold to the State)'
    units: '?'
- variant:
    id: cal.1964-07-05.mississippi
    unit: C
    witness: w.purdum-idea-whose-time-has-2014
    reads: The Robert E. Lee Hotel in Jackson closes its doors "in despair" on July 6, 1964
    at: '329'
- check:
    id: cal.1964-07-05.mississippi
    text: 'Check: Purdum, 329, dates the closing of the Robert E. Lee Hotel July 6, not July 5.'
- cite:
    id: cal.1964-12-14.court
    item: '[[w.purdum-idea-whose-time-has-2014]], 329–30 (the Supreme Court''s upholding of Title II in December 1964, the
      essence of the Act''s validity swiftly settled; not the day nor the cases)'
    units: '?'
- cite:
    id: cal.1964-12-10.voting-rights
    item: '[[w.purdum-idea-whose-time-has-2014]], 333 (King''s acceptance at Oslo, two months after the award, "on behalf
      of a civil rights movement which is moving with determination and a majestic scorn for risk and danger"; Hoover''s
      reaction, "the most notorious liar in the country")'
    units: '?'
- cite:
    id: cal.1965-01-04.congress-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 334 (Halleck deposed as House minority leader by Ford in January 1965,
      his first electoral loss; Purdum gives no vote nor day)'
    units: '?'
- cite:
    id: cal.1965-08-11.states-and-cities
    item: '[[w.purdum-idea-whose-time-has-2014]], 332 (Watts erupting in a bloody six-day riot, five days after Johnson
      signed the Voting Rights Act)'
    units: A
- cite:
    id: cal.1968-04-04.robert-kennedy
    item: '[[w.purdum-idea-whose-time-has-2014]], 333–34 (Indianapolis: Kennedy learning of King''s death as he is about
      to speak at the rally in a black neighborhood, against the police''s warnings; "What we need in the United States
      is not division ... but love and wisdom and compassion toward one another"; "to tame the savageness of man and make
      gentle the life of this world"; Purdum has the crowd breaking up quietly)'
    units: A
- cite:
    id: cal.1964-07-02.program
    item: '[[w.purdum-idea-whose-time-has-2014]], 320 (the Cabinet Room, Johnson interrupting the meeting to read the slip
      from Albert that the House had passed the bill, 289 to 126; not the task forces)'
    units: '?'
- cite:
    id: cal.1964-07-02.succession
    item: '[[w.purdum-idea-whose-time-has-2014]], 324–25 (after the Cabinet Room meeting with the leaders, the bags packed,
      a bite of dinner, Marine One to Andrews and the Jetstar to the Ranch, Johnson reading the papers and napping on the
      flight; Whittington and others to follow; they reach the Ranch in the wee hours; not the hour of leaving)'
    units: '?'
- cite:
    id: cal.1964-06-16.desegregation-public-places
    item: '[[w.purdum-idea-whose-time-has-2014]], 320 (White''s advice that day on the signing: "Mr. President, it''s so
      monumental. It''s equivalent to a ... signing an emancipation proclamation"; not St. Augustine; the note gives TPR,
      Johnson, vol. 8, 374, a volume of July)'
    units: '?'
- cite:
    id: cal.1963-12-20.congress
    item: '[[w.purdum-idea-whose-time-has-2014]], 270 (Dirksen''s call "just before Christmas" for William Macomber, an
      Eisenhower-era State Department official; Johnson: "if we''re going to appoint Republican ambassadors, they better
      be your Republican ambassadors"; "You''re my kind"; Dirksen: "he''s a damn good guy"; not the hour (the note: TPR,
      Johnson, vol. 2, 523–24))'
    units: '?'
