      id: cal.1964-07-02.king
      when: July 2
      date: '1964-07-02'
      thread: king
      also:
      - civil-rights-organizations
      c: 'King, flying to Washington for the signing, to reporters: the Act "will bring a great deal of practical relief
        to Negroes in many southern communities"; it will raise expectations; "it will probably take five years to see the
        civil rights bill fully implemented in the South"; "The scope of direct action this summer will depend on the scope
        of compliance."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 315. Names: King. Check: the hour; the source of the quotation.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 315: all'
        c: af3d5ad0
      tags:
      - name:king-martin-luther-jr
