      when: June 24
      date: '1964-06-24'
      thread: civil-rights-the-executive
      c: 'Dick Nelson, a penciled note on an early draft of the signing statement (Goldman''s, with "ballots, not bullets"
        and strong words on the violence in Mississippi), passing on Johnson''s view: "Get Doug Cater and Dick Goodwin to
        start working on this, hard. I like it but I don''t want to go this strong on Mississippi at this time."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 315, 320–21. To check: Bill Moyers Files, Box 125, LBJL (cited by [[w.purdum-idea-whose-time-has-2014]],
