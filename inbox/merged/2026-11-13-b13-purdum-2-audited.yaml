      when: July 2
      date: '1964-07-02'
      thread: civil-rights-the-executive
      c: 'Busby to Moyers, by memorandum, on the draft of the signing address: he questions the President''s saying he signs
        because "the moral law of a just God" forbids segregation. "The thought must be in the speech," but southern clergy
        may challenge the President "to cite chapter and verse"; he suggests "Morality forbids it." The address as given
        has those words.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 321–22. To check: Bill Moyers Files, Box 125, LBJL (cited by [[w.purdum-idea-whose-time-has-2014]],
        367). Names: Busby, Moyers, Johnson.'
      src:
