      id: cal.1964-04-29.civil-rights-bill-8
      when: Apr. 29
      date: '1964-04-29'
      thread: civil-rights-bill
      c: 'A reception room outside the Senate chamber. Dirksen, with clergy lobbying the Senators: to Rabbi Irving Rosenbaum
        of Chicago, "I fairly scream and hope that I can get some work done." To Bishop B. Julian Smith, who says that if
        he would paint his face black and go with him into the world for two days he would not have to say a word: "Must
        I do that? After thirty years in Congress, can''t I evaluate the importance of legislation?" "The best thing you
        can do is say a prayer for me."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 268–69 (the day by Dirksen''s visit to Johnson "on this same Wednesday,"
        269). To check: Mackaman, *Long Hard Furrow*, 96 (cited by [[w.purdum-idea-whose-time-has-2014]], 362). See [[cal.1964-04-28.civil-rights-bill]].
        Names: Dirksen.'
      src:
        rows:
