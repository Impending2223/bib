      id: cal.1964-04-13.civil-rights-bill-4
      when: Apr. 13
      date: '1964-04-13'
      thread: civil-rights-bill
      c: 'Senate, shortly before midnight. Humphrey, interrupting Smathers on the passions of black Americans: does either
        of them know what it is to be told he cannot come into a restaurant? The harm is "humiliation, the lack of a sense
        of dignity." Smathers: in the Marine Corps some ate Spam, kept from the officer areas where the aviators ate steak;
        Humphrey: "a dictatorship called the military establishment."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 259–60. To check: 110 Cong. Rec. 7799 (Apr. 13, 1964) (cited by [[w.purdum-idea-whose-time-has-2014]],
        362). Names: Humphrey, Smathers.'
