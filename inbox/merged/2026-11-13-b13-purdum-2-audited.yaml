      id: cal.1964-05-07.civil-rights-bill-5
      when: May 7
      date: '1964-05-07'
      thread: civil-rights-bill
      c: 'The bipartisan floor leaders'' group, morning. Humphrey: the Mansfield-Dirksen jury trial amendment must get a
        bigger vote than Morton''s; "If we can produce sixty-four votes, we are okay. But if we only secure forty-nine votes,
        then we have had it." Rauh: the Leadership Conference still against dealing directly with Dirksen. Humphrey: "It
        is not pleasant for Tommy Kuchel and myself to have it appear that Dirksen is writing the ticket. I want the bill
        passed"; the Conference should be out getting votes.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 279. To check: Horn, log, 161, EMDP (cited by [[w.purdum-idea-whose-time-has-2014]],
        363). Names: Humphrey, Rauh, Kuchel, Dirksen.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 279: all'
        c: 2954d0ad
      tags:
      - name:humphrey-hubert-h
      - name:rauh-joseph-l-jr
