      when: Apr. 20
      date: '1964-04-20'
      thread: civil-rights-bill
      c: 'Senate. Humphrey defends Title VII: the Dodgers'' hiring of Jackie Robinson was an economic boon to baseball.
        Smathers: "How about the player whom he displaced?" Humphrey: he was better, "So he earned more money," and the
        bleachers filled.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 264. To check: 110 Cong. Rec. 8451 (Apr. 20, 1964) (cited by [[w.purdum-idea-whose-time-has-2014]],
