- cite:
    id: cal.1964-04-29.civil-rights-bill-6
    item: '[[w.purdum-idea-whose-time-has-2014]], 268 (Case on the jury trial amendment''s appeal to liberals and conservatives
      alike; Clark: "Let''s not kid ourselves ... This has become the Dirksen bill! I deplore it, but that''s it" (the note:
      Horn''s log, 129); Purdum gives no day)'
    units: D
- cite:
    id: cal.1964-05-07.poverty
    item: '[[w.purdum-idea-whose-time-has-2014]], 282 (the breakfast of the Georgia Legislature, May 8: "My office is not
      a single trust for a single section or a single state"; Haygood of Emory, 1880; "no one of us is fully free until
      all of us are fully free"; half a million along the motorcade in Atlanta, forty thousand at Gainesville; Lynda Bird
      Johnson''s tribute to Russell; the note''s "p. 330" is the item''s number)'
    units: F
- cite:
    id: cal.1964-06-04.civil-rights-bill-2
    item: '[[w.purdum-idea-whose-time-has-2014]], 295 (Humphrey on the floor, Thursday, June 4, outlining the package in
      Dirksen''s absence, the Mansfield-Dirksen jury trial amendment in it; not Title VII''s changes)'
    units: '?'
- cite:
    id: cal.1964-07-02.robert-kennedy
    item: '[[w.purdum-idea-whose-time-has-2014]], 313–14 (the call barely an hour after Luce''s, Kennedy just back from
      Warsaw and West Berlin: sign on Monday, a holiday weekend, "Negroes running all over the South"; Johnson: "I think
      it will be late today," his promise to Halleck to sign before the weekend; not the *Newsweek* matter; the notes give
      no page for the call)'
    units: '?'
- cite:
    id: cal.1964-07-02.civil-rights-bill-6
    item: '[[w.purdum-idea-whose-time-has-2014]], 314 (Reedy, one of the five Johnson called on Kennedy''s proposal to wait:
      "I think it''d be very bad if you waited" (the note: TPR, Johnson, vol. 8, 362, the next call after Wilkins''s, 359);
      not the hour nor the arrangements)'
    units: '?'
