      id: cal.1964-05-01.civil-rights-bill-4
      when: May 1
      date: '1964-05-01'
      thread: civil-rights-bill
      c: 'Senate. Russell and Javits, twenty minutes, on Javits''s suggestion that white southern juries would not do even
        justice in civil rights cases. Russell: Javits always suggests "something fundamentally evil and sinful about people
        living in the South," with "a little sneer on his face"; of Kitty Genovese and her neighbors, "I say that couldn''t
        happen in the South." They shake hands.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 272–73. To check: New York Times, May 2, 1964 (cited by [[w.purdum-idea-whose-time-has-2014]],
        363). Names: Russell, Javits.'
