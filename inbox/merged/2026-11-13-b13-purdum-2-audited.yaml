      when: June 12
      date: '1964-06-12'
      thread: civil-rights-bill
      c: 'Senate. Russell''s amendment: the bill to go to a national referendum before it takes effect. Dirksen: "I am ready
        to accept my responsibility under the bill and for the bill. I am not going to pass the buck to people back home";
        "What a shameful concession to make." Refused, 22–67.'
