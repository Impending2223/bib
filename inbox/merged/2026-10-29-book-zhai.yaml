        409–10, 414–19, 421 (the raids; the engagement; no reprisal, the warning to Hanoi, the patrol resumed); [[w.asselin-hanois-road-to-the]],
        196 (the clash; the raids on the islands, which Hanoi called American); [[w.jian-maos-china-and-the]], 213 (by Lê
