      id: cal.1967-12-13.vietnam
      when: Dec. 13–14
      date: '1967-12-13'
      thread: vietnam
      also:
      - europe-and-the-alliance
      c: 'Washington. Stoessel with the Polish ambassador, Michalowski, at dinner Dec. 13 and the White House luncheon Dec.
        14: the Harmel Report, renunciation-of-force declarations; Vietnam at the UN would bring only a call to stop the bombing.
        A renewed Geneva conference, Michalowski says, only with agreement in advance, or "a shambles in which the intransigent
        views of the Chinese would predominate."'
      n: '[FRUS 1964–68, XVII, doc. 130](https://history.state.gov/historicaldocuments/frus1964-68v17/d130). [[w.zhai-china-and-the-vietnam]],
        166 (the Geneva conference). Names: Stoessel, Michalowski.'
      src:
        c: 4552286e
