- add:
    entry:
      id: cal.1961-01-23.laos
      when: Jan. 23
      date: '1961-01-23'
      thread: laos
      c: 'White House meeting on Laos: Kennedy, Rusk, McNamara, Lemnitzer and others on the interagency task force''s report.
        The military measures, (a) to (i), authorized, not directed; Rusk would talk with Moscow before those against the
        Soviet airlift, and consult London and Paris first. By the summary record, Rusk on why Moscow holds back: it would
        control Communist intervention in Laos rather than let the Chinese take charge.'
      n: '[FRUS 1961–63, XXIV, doc. 10](https://history.state.gov/historicaldocuments/frus1961-63v24/d10) (Nitze to McNamara,
        the same day, a preliminary memorandum). [[w.zhai-china-and-the-vietnam]], 106 (Rusk''s answer to Kennedy''s question).
        To check: Summary Record of White House Meeting on Laos, Jan. 23, 1961, Vietnam/Laos Collection (Porter-Perry-Prados
        Donation), box 1, National Security Archive (cited by [[w.zhai-china-and-the-vietnam]], 106 n.64, for Rusk''s answer).
        Names: Kennedy, Rusk, McNamara, Lemnitzer.'
      src:
        c: d62c9758
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d10: A-C'
        - 'w.zhai-china-and-the-vietnam 106: D'
        - 'via w.zhai-china-and-the-vietnam 106 n.64: D'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
- add:
    entry:
