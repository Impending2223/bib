      c: 'Warsaw, the 127th meeting. Wang Kuo-ch''uan on Lin Biao''s article: revolutionary war against counterrevolutionary
        wars. Cabot: a blueprint for Communist aggression, like Hitler''s *Mein Kampf*; the United States will fulfill its
        commitment to South Vietnam. Next meeting Dec. 15.'
      n: '[FRUS 1964–68, XXX, doc. 101](https://history.state.gov/historicaldocuments/frus1964-68v30/d101) (Cabot''s report).
        [[w.zhai-china-and-the-vietnam]], 146 (the article read in Washington as a Chinese *Mein Kampf*). See [[cal.1965-09-03.china]].
        Names: Wang Kuo-ch''uan, Lin Biao, Cabot.'
