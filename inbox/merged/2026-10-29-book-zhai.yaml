      when: July 22
      date: '1962-07-22'
      thread: laos
      c: 'Harriman to Ưng Văn Khiêm, North Vietnam''s Foreign Minister and delegate to the Geneva conference: are North Vietnamese
        forces in Laos? Khiêm: Hanoi has given Souvanna Phouma''s government military trainers and specialists at its request;
        no units admitted. Harriman: "an improvement in candor" on Pushkin, who had refused to confirm any North Vietnamese
        military personnel in Laos.'
      n: '[[w.zhai-china-and-the-vietnam]], 242–43 n.78 (from Harriman''s memorandum of the conversation). To check: memorandum
        of conversation, July 22, 1962, Harriman Papers, Special Files: Public Service, box 519, Library of Congress (cited
        by [[w.zhai-china-and-the-vietnam]], 242–43 n.78). Names: Harriman, Souvanna Phouma, Pushkin.'
      src:
        c: 5d334221
        rows:
        - 'w.zhai-china-and-the-vietnam 242–43 n.78: all'
        - 'via w.zhai-china-and-the-vietnam 242 n.78: all'
      tags:
      - name:harriman-w-averell
      - name:souvanna-phouma
      - name:pushkin-georgiyi-maksimovich
