      tags:
      - name:hughes-thomas-l
      - name:rusk-dean
- add:
    entry:
      id: cal.1965-02-24.china
      when: Feb. 24
      date: '1965-02-24'
      thread: china
      also:
      - vietnam
      c: 'Warsaw, the 124th meeting of the ambassadorial talks. Wang Kuo-ch''uan to Cabot: action against North Vietnam is
        action against China; the American defeat in the South foregone; if the United States spreads the war to the North,
        China will not sit idly by. Cabot: the United States will leave South Vietnam if the North stops interfering there.'
      n: '[FRUS 1964–68, XXX, doc. 78](https://history.state.gov/historicaldocuments/frus1964-68v30/d78) (Cabot''s report).
        [[w.zhai-china-and-the-vietnam]], 138 (Wang''s warning, from Schulzinger''s essay, the meeting not dated: "Chinese
        people will not sit idly by"). Made public: FRUS 1964–68, XXX. Names: Wang Kuo-ch''uan, Cabot. Check: whether Zhai''s
        words are this meeting''s.'
      src:
        c: e4eef063
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v30/d78: all'
        - 'w.zhai-china-and-the-vietnam 138: C-D'
      tags:
      - name:wang-kuo-chuan
      - name:cabot-john-m
