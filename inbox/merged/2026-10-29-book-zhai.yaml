      when: Oct. 22
      date: '1963-10-22'
      thread: vietnam
      c: 'Hughes to Rusk, INR''s research memorandum RFE-90, "Statistics on the War Effort in South Vietnam Show Unfavorable
        Trends": since July, Viet Cong casualties, weapons losses and defections down, armed attacks up; the government''s
        military position set back six months to a year, as the political crisis deepens.'
      n: '[FRUS 1961–63, IV, doc. 205](https://history.state.gov/historicaldocuments/frus1961-63v04/d205) (editorial note,
        the abstract). [[w.zhai-china-and-the-vietnam]], 120 (the trend). Names: Hughes, Rusk.'
