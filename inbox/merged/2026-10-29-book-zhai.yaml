      id: cal.1965-09-03.china
      when: Sept. 3
      date: '1965-09-03'
      thread: china
      also:
      - vietnam
      c: '*Peking Review* prints Lin Biao''s "Long Live the Victory of People''s War": the world''s cities, the industrial
        nations, to be surrounded by its countryside, the developing countries, through local revolutions. By the Chinese
        accounts, written by Luo Ruiqing''s group in the General Staff, Kang Sheng''s team adding to it, and approved by the
        leadership; Lin had no hand in it.'
      n: '[[w.zhai-china-and-the-vietnam]], 145–46 (the article and its writers; Washington''s reading). Washington''s knowledge:
        [FRUS 1964–68, XXXIII, doc. 367](https://history.state.gov/historicaldocuments/frus1964-68v33/d367) (Chase to McGeorge
        Bundy, Sept. 13: at State''s strategy session for the General Assembly, Goldberg would "hit it hard"). To check: the
        article, *Peking Review*, Sept. 3, 1965, 9–30 (cited by [[w.zhai-china-and-the-vietnam]], 145 n.74); [[w.mcnamara-in-retrospect]],
        215 (cited by [[w.zhai-china-and-the-vietnam]], 146 n.81, for Washington''s reading). Names: Lin Biao. Check: the
        day the article first appeared; Zhai''s bibliography (285) gives the *Peking Review* of Sept. 3.'
      src:
        c: 50fbd436
        rows:
        - 'w.zhai-china-and-the-vietnam 145–46: all'
        - 'via w.zhai-china-and-the-vietnam 145 n.74: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v33/d367: A'
      tags:
      - name:lin-biao
