- add:
    entry:
      id: cal.1969-01-13.laos
      when: Jan. 13
      date: '1969-01-13'
      thread: laos
      also:
      - china
      c: 'William L. Lemnitzer of the NSC staff to Rostow, an intelligence memorandum on the Chinese road from Yunnan to Muong
        Sai in northern Laos: for now "to improve Chinese support of Pathet Lao and communist-leaning neutralist forces in
        northern Laos"; the long-term aim to be read from China''s next move, whether the road goes on southwest toward the
        Mekong and Thailand. By the Chinese accounts, the road built under an agreement with the Pathet Lao of Feb. 28, 1968;
        some 20,000 Chinese troops and workers in Laos from mid-September.'
      n: '[[w.zhai-china-and-the-vietnam]], 180 (the memorandum; the agreement and the road teams by the Chinese histories).
        To check: Lemnitzer memorandum, Jan. 13, 1969, NSF, Country File: Laos, box 272, LBJ Library (cited by [[w.zhai-china-and-the-vietnam]],
        180 n.14). Names: Rostow. Check: the memorandum''s author, William L. Lemnitzer by Zhai''s text, not the general.'
      src:
        c: 48d6c734
        rows:
        - 'w.zhai-china-and-the-vietnam 180: all'
