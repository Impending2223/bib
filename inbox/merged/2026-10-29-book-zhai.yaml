      date: '1965-06-17'
      thread: vietnam
      c: 'London. The Commonwealth Prime Ministers announce a mission of four, the Prime Ministers of Britain, Ghana, Nigeria
        and Trinidad and Tobago, to the governments concerned, toward a conference on Vietnam. Wilson had told Bruce the day
        before: no arrangement unsatisfactory to the United States.'
      n: '[FRUS 1964–68, III, doc. 6](https://history.state.gov/historicaldocuments/frus1964-68v03/d6) (editorial note). [[w.zhai-china-and-the-vietnam]],
        160 (the mission proposed, its members, its aims). To check: *Recent Exchanges Concerning Attempts To Promote a Negotiated
        Settlement of the Conflict in Viet Nam*, Cmd. 2756 (1965), 90 (cited by FRUS). Names: Wilson, Bruce.'
      src:
