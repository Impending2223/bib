      date: '1965-05-07'
      thread: vietnam
      also:
      - south-asia
      c: 'James Thomson to McGeorge Bundy, on the Radhakrishnan plan: a cease-fire, an Afro-Asian force on the 17th parallel
        and the Lao and Cambodian borders, the present boundaries kept. Now the Indian government''s; Peking has denounced
        it, Moscow finds it "interesting." Washington has privately told the Indians of its interest.'
