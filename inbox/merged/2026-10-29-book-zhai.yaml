      date: '1965-06-05'
      thread: vietnam
      also:
      - china
      c: 'William Bundy to Rusk, on Chen Yi''s talk with the British chargé, May 31: "obviously meant to be conveyed to us";
        the British told yesterday they may tell Chen Yi the message was received. Chen Yi tough on Hanoi''s resolve, mild
        in that China would not come in unless itself attacked, tough on going all the way if it did. Peking "wants a channel."'
      n: '[FRUS 1964–68, II, doc. 335](https://history.state.gov/historicaldocuments/frus1964-68v02/d335), par. 2. [[w.zhai-china-and-the-vietnam]],
        138–39 (the line Chen Yi drew; the message received). See [[cal.1965-05-31.vietnam]]. Names: William Bundy, Rusk,
        Chen Yi.'
