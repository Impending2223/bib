      c: 'Kempton, a column: Robert Kennedy a coward for entering the race after McCarthy''s showing in New Hampshire. "I
        blame myself, not him, for all the years he fooled me."'
      n: '[[w.wofford-of-kennedys-and-kings]], 442. Check: the day and the paper. Names: Robert Kennedy, McCarthy.'
