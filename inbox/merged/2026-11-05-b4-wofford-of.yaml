    entry:
      id: cal.1960-12.desegregation-schools
      when: Dec.
      date: 1960-12
      thread: desegregation-schools
      also:
      - civil-rights-the-executive
      c: 'Wofford to Robert Kennedy and the President-elect, of New Orleans: "supporters of the school system there say that
        Presidential support of the school board is desperately needed. They want both eloquent and symbolic public support
        and strong behind-the-scenes efforts to persuade the Governor and Senators to let that token desegregation take place."'
      n: '[[w.wofford-of-kennedys-and-kings]], 134. Check: the day. Names: Wofford, Robert Kennedy, Kennedy.'
      src:
        c: '80022709'
        rows:
        - 'w.wofford-of-kennedys-and-kings 134: all'
      tags:
