      when: Dec.
      date: 1960-12
      thread: civil-rights-the-executive
      c: Kennedy sends word to Wofford to hold back still the recommendations of the October Conference on Constitutional
        Rights.
      n: '[[w.wofford-of-kennedys-and-kings]], 130. Check: the day. See [[cal.1960-10-30.elections-1960-4]]. Names: Kennedy,
