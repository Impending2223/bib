- add:
    entry:
      id: cal.1960-05.elections-1960-nomination-3
      when: May
      date: 1960-05
      thread: elections-1960-nomination
      c: Georgetown, Kennedy's house, a breakfast in the courtyard and the morning after. Governor Williams flies in Michigan's
        civil rights and Negro leaders; Bowles at Kennedy's side. Kennedy, by the Michigan group's notes, "stated categorically"
        that civil rights was "of overwhelming moral significance to him," and as President he would "use the full prestige
        and weight of his office to completely eliminate second-class citizenship in America." By Wofford's account.
      n: '[[w.wofford-of-kennedys-and-kings]], 47–48. Check: the day; soon after Robert Kennedy''s charge to Wofford of early
        May (47). To check: the Michigan group''s notes of the meeting (quoted by [[w.wofford-of-kennedys-and-kings]], 47–48).
        Names: Kennedy, Williams, Bowles.'
      src:
        c: 9d4a5dd8
        rows:
        - 'w.wofford-of-kennedys-and-kings 47–48: all'
      tags:
      - name:kennedy-john-f
      - name:williams-g-mennen
      - name:bowles-chester
- add:
    entry:
      id: cal.1960-07.elections-1960-los-angeles
      when: July, before the nomination
      date: 1960-07
      thread: elections-1960-los-angeles
      c: 'Los Angeles, Suite 8315 of the Biltmore, the morning the platform committee is to decide. Robert Kennedy, on a chair
        at his daily briefing of the Kennedy workers: support the full Bowles draft; "Remember, all the way with the Bowles
        platform." By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 52 (the civil rights plank the fullest of the drafts Wofford, Hughes and Chayes
        wrote for Bowles; adopted by the committee "with only minor modifications"). Check: the day. See [[cal.1960-07-12.elections-1960]].
        Names: Robert Kennedy, Bowles.'
      src:
        c: 1078f390
        rows:
        - 'w.wofford-of-kennedys-and-kings 52: all'
      tags:
      - name:kennedy-robert-f
      - name:bowles-chester
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-2
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: 'The Biltmore, about 2:30 a.m. A caller to Shriver: Johnson will take the vice presidency if Kennedy offers it. Shriver
        and Wofford to Kennedy''s suite about 7:30; Kennedy there about eight; Shriver talks with him; a meeting with Johnson
        set for ten. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 53–54. See [[cal.1960-07-14.elections-1960]]. Names: Shriver, Wofford, Johnson,
        Kennedy.'
      src:
        c: 79d74764
        rows:
        - 'w.wofford-of-kennedys-and-kings 53–54: all'
      tags:
      - name:shriver-r-sargent
      - name:wofford-harris
      - name:johnson-lyndon-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-08.elections-1960-kennedy
      when: Aug.
      date: 1960-08
      thread: elections-1960-kennedy
      also:
      - civil-rights-the-executive
      c: 'Georgetown. Kennedy, driving to the Senate, picks up Wofford: "Now in five minutes tick off the ten things a President
        ought to do to clean up this goddamn civil rights mess." Wofford first: an executive order against discrimination
        in federally assisted housing, by one stroke of the pen, as the Civil Rights Commission had recommended; the rest
        from the Commission and the platform. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 58. Check: the day. Names: Kennedy, Wofford.'
      src:
        c: 2405fad4
        rows:
        - 'w.wofford-of-kennedys-and-kings 58: all'
      tags:
      - name:kennedy-john-f
      - name:wofford-harris
- add:
    entry:
      id: cal.1960-10-22.elections-1960-king
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960-king
      c: 'Atlanta. Griffin Bell, Kennedy''s Georgia campaign chief, for Vandiver, Congressman George Smith III and himself:
        "We know that Senator Kennedy would never interfere in the affairs of a sovereign state." King "has violated a state
        law. He is charged with trespassing on private premises, has been offered bail, and refused it because he wants to
        be a martyr."'
      n: '[[w.wofford-of-kennedys-and-kings]], 15. Check: the day; Wofford has it after Salinger''s statement of Oct. 22.
        See [[cal.1960-10-22.elections-1960]]. Names: Bell, Vandiver, Kennedy, Martin Luther King.'
      src:
        c: ad2839ce
        rows:
        - 'w.wofford-of-kennedys-and-kings 15: all'
      tags:
      - name:bell-griffin-b
      - name:vandiver-s-ernest-jr
      - name:kennedy-john-f
      - name:king-martin-luther-jr
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1960-10-27.press-and-broadcasting
      when: Oct. 27
      date: '1960-10-27'
      thread: press-and-broadcasting
      also:
      - elections-1960-king
      c: 'Late afternoon. Brinkley of NBC to Wofford: a bulletin that a brother of Kennedy''s has called the De Kalb judge
        for King''s release. Wofford: no brother could have. Brinkley will not use it on the evening news. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 21. See [[cal.1960-10-25.king]]. Names: Brinkley, Wofford.'
      src:
        c: a010ff43
        rows:
        - 'w.wofford-of-kennedys-and-kings 21: all'
      tags:
      - name:brinkley-david
      - name:wofford-harris
- add:
    entry:
      id: cal.1960-10-27.robert-kennedy
      when: Oct. 27
      date: '1960-10-27'
      thread: robert-kennedy
      also:
      - elections-1960-king
      c: 'Robert Kennedy from New York by telephone to Seigenthaler and Wofford: draft a statement on why he called the judge.
        "Can''t you just say I was inquiring about Dr. King''s constitutional right to bail?" He had told the judge, by Wofford''s
        memory, that "if he was a decent American, he would let King out of jail by sundown." He had not told his brother.'
      n: '[[w.wofford-of-kennedys-and-kings]], 21 (Seigenthaler''s memory of the words: "I made it clear to him that it was
        not a political call; that I am a lawyer, one who believes in the right of all defendants to make bond"). Check: Robert
        Kennedy, in his oral history of 1964, has the suggestion of the call from Vandiver, probably through Bell (21 n.).
        See [[cal.1960-10-25.king]]. Names: Robert Kennedy, Seigenthaler, Wofford, Martin Luther King.'
      src:
        c: efffb815
        rows:
        - 'w.wofford-of-kennedys-and-kings 21: all'
      tags:
      - name:kennedy-robert-f
      - name:seigenthaler-john
      - name:wofford-harris
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1960-10-28.robert-kennedy
      when: Oct. 28
      date: '1960-10-28'
      thread: robert-kennedy
      also:
      - elections-1960-king
      c: 'About 3 a.m. Robert Kennedy by telephone to Louis Martin: "I wanted you especially to know that I called that judge
        in Georgia today, to try to get Dr. King out." Martin: "You are now an honorary Brother!" By Martin''s account to
        Wofford.'
      n: '[[w.wofford-of-kennedys-and-kings]], 22. Check: the hour; Martin''s, "he thinks around 3 a.m." See [[cal.1960-10-25.king]].
        Names: Robert Kennedy, Martin Luther King.'
      src:
        c: 5bf35bcb
        rows:
        - 'w.wofford-of-kennedys-and-kings 22: all'
      tags:
      - name:kennedy-robert-f
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1960-10-28.king
      when: Oct. 28
      date: '1960-10-28'
      thread: king
      also:
      - elections-1960-king
      c: 'Atlanta, Ebenezer Baptist, Friday evening, some eight hundred to welcome King home. King: "We must master the art
        of creative suffering"; "I never intend to reject a man running for President of the United States just because he
        is a Catholic." His father: "I had expected to vote against Senator Kennedy because of his religion. But now he can
        be my President, Catholic or whatever he is."'
      n: '[[w.wofford-of-kennedys-and-kings]], 22–23 (the *Atlanta Journal*: King "did just about everything short of" an
        endorsement). See [[cal.1960-10-25.king]]. Names: Martin Luther King, Martin Luther King Sr., Kennedy.'
      src:
        c: 21fd83fc
        rows:
        - 'w.wofford-of-kennedys-and-kings 22–23: all'
      tags:
      - name:king-martin-luther-jr
      - name:king-martin-luther-sr
      - name:kennedy-john-f
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1960-11-14.transition-and-staff-3
      when: Nov. 14
      date: '1960-11-14'
      thread: transition-and-staff
      c: 'Washington, the Mayflower, Monday. The talent search begins: Shriver with Louis Martin, Yarmolinsky and Wofford,
        at Kennedy''s charge at Hyannis Port to find "the brightest and best" for the Cabinet, the agencies and the embassies.
        Shriver''s leads already: Lovett, and McGeorge Bundy, seen on his way. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 68, 70 (Shriver''s call to Wofford two days after the election, 68). Names:
        Shriver, Yarmolinsky, Wofford, Kennedy, Lovett, Bundy.'
      src:
        c: e001d922
        rows:
        - 'w.wofford-of-kennedys-and-kings 68: all'
        - 'w.wofford-of-kennedys-and-kings 70: all'
      tags:
