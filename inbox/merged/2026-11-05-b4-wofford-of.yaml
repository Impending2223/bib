- add:
    entry:
      id: cal.1961-05.peace-corps
      when: May, early
      date: 1961-05
      thread: peace-corps
      c: 'Shriver and Moyers with Johnson, chairman of the Peace Corps'' advisory council, on the Dungan task force''s plan
        to put the Peace Corps in the new aid agency. Johnson: "You put the Peace Corps into the Foreign Service and they''ll
        put striped pants on your people when all you''ll want them to have is a knapsack and a tool kit and a lot of imagination."
        By Moyers''s account, as he wrote it down.'
      n: '[[w.wofford-of-kennedys-and-kings]], 265. Check: the day; before Shriver left on his trip. Names: Shriver, Moyers,
        Johnson.'
      src:
        c: a044253c
        rows:
        - 'w.wofford-of-kennedys-and-kings 265: all'
      tags:
      - name:shriver-r-sargent
      - name:moyers-bill
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1961-05.peace-corps-2
      when: May
      date: 1961-05
      thread: peace-corps
      also:
      - africa
      c: 'Accra. Shriver, with Wofford and Franklin Williams, to Nkrumah, three weeks after the Bay of Pigs. Nkrumah: the
        CIA "a dangerous beam that should be resisted"; the Peace Corps "sounds good." Ghana will take a few teachers, science,
        mathematics and English, not the social sciences; "Can you get them here by August?" By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 269–70. Check: the day. Names: Shriver, Wofford, Nkrumah.'
      src:
        c: 25c2e016
        rows:
        - 'w.wofford-of-kennedys-and-kings 269–70: all'
      tags:
      - name:shriver-r-sargent
      - name:wofford-harris
      - name:nkrumah-kwame
- add:
    entry:
      id: cal.1961-05.peace-corps-3
      when: May
      date: 1961-05
      thread: peace-corps
      also:
      - south-asia
      c: 'New Delhi. Shriver with Nehru, Wofford there. Nehru: India will take some of the volunteers for the Punjab, "perhaps
        twenty to twenty-five," but "I hope you and they will not be too disappointed if the Punjab, when they leave, is more
        or less the same as it was before they came." By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 272. Check: the day. Names: Shriver, Wofford, Nehru.'
      src:
        c: ae83d7e0
        rows:
        - 'w.wofford-of-kennedys-and-kings 272: all'
      tags:
      - name:shriver-r-sargent
      - name:wofford-harris
      - name:nehru-jawaharlal
- add:
    entry:
      id: cal.1961-05.peace-corps-4
      when: May
      date: 1961-05
      thread: peace-corps
      also:
      - foreign-aid
      c: Dungan's task force on the aid programs overrules Shriver, and the President agrees that the Peace Corps go into
        the new aid agency; Dungan tells Wiggins and Josephson the decision is final. They cable Shriver at New Delhi. By
        Wofford's account.
      n: '[[w.wofford-of-kennedys-and-kings]], 263–64. Check: the day. Names: Dungan, Kennedy, Shriver.'
      src:
        c: 918e346c
        rows:
        - 'w.wofford-of-kennedys-and-kings 263–64: all'
      tags:
      - name:dungan-ralph-a
      - name:kennedy-john-f
      - name:shriver-r-sargent
- add:
    entry:
      id: cal.1961-05.peace-corps-5
      when: May
      date: 1961-05
      thread: peace-corps
      also:
      - foreign-aid
      c: 'From New Delhi Shriver telephones Moyers: ask Johnson to make a last plea to the President. Johnson makes it, the
        aid program''s unpopularity in Congress his case; Kennedy agrees to a separate Peace Corps. Shriver: Johnson "a founding
        father of the Peace Corps." By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 266. Check: the day. Names: Shriver, Moyers, Johnson, Kennedy.'
      src:
        c: 49d9f9e7
        rows:
        - 'w.wofford-of-kennedys-and-kings 266: all'
      tags:
      - name:shriver-r-sargent
      - name:moyers-bill
      - name:johnson-lyndon-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-05-22.peace-corps
      when: May 22
      date: '1961-05-22'
      thread: peace-corps
      also:
      - freedom-rides
      c: 'The Cabinet Room. The President to the Peace Corps'' National Advisory Council: the third project, 300 teaching
        assistants for the Philippines. As he leaves, at Wofford''s prompting, Belafonte: "perhaps you could say something
        a little more about the Freedom Riders"; Eugene Rostow for moral leadership on equal access. Kennedy: had they seen
        his statement in the morning papers? Then, to Wofford: "Who the hell was that man with Harry Belafonte? ... Doesn''t
        he know I''ve done more for civil rights than any President in American history?" By Wofford''s account.'
      n: 'Remarks to the National Advisory Council for the Peace Corps, [1961 Pub. Papers 391](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=449)
        (May 22, 1961). [[w.wofford-of-kennedys-and-kings]], 125–26. Check: Wofford has himself in New Delhi with Shriver
        in May, home at the month''s end (264, 266). See [[cal.1961-05-14.freedom-rides]]. Names: Kennedy, Wofford, Eugene
        Rostow.'
      src:
        c: e64cec90
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=449: A'
        - 'w.wofford-of-kennedys-and-kings 125–26: B-E'
      tags:
      - name:kennedy-john-f
      - name:wofford-harris
      - name:rostow-eugene
- add:
    entry:
      id: cal.1961-05-24.freedom-rides-3
      when: May 24
      date: '1961-05-24'
      thread: freedom-rides
      c: 'Montgomery, toward midnight. Coffin, from a telephone booth, collect to Bundy at the White House: the President
        should follow de Gaulle, go to the people and ask for understanding; "A little moral suasion would clear up the confusion
        in the country." A frosty reception; then collect to Wofford at home, who doubts the President will do more. By Coffin''s
        account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 156 (Coffin''s words on the calls). See [[cal.1961-05-14.freedom-rides]]. Names:
        Coffin, Bundy, Wofford, Kennedy.'
      src:
        c: f49fe7eb
        rows:
        - 'w.wofford-of-kennedys-and-kings 156: all'
      tags:
      - name:coffin-william-sloane-jr
      - name:bundy-mcgeorge
      - name:wofford-harris
      - city:montgomery
      - state:al
- add:
    entry:
      id: cal.1961-06.civil-rights-the-executive-2
      when: June
      date: 1961-06
      thread: civil-rights-the-executive
      c: 'The Subcabinet Group on Civil Rights. Conway of the housing agency: nonviolent direct action has caught fire among
        the young, and the pace must quicken. Murphy, Assistant Postmaster General: counsels to "cool off" futile. Marshall:
        Justice cannot keep Mississippi''s police from arresting the riders; "The legal limitations of the federal system
        are not understood by the civil rights leaders"; some of the energy into registration would be "valuable." By Wofford''s
        account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 158, 160. Check: the day. Names: Marshall.'
      src:
        c: d9285ed7
        rows:
        - 'w.wofford-of-kennedys-and-kings 158: all'
        - 'w.wofford-of-kennedys-and-kings 160: all'
      tags:
      - name:marshall-burke
- add:
    entry:
      id: cal.1961-03.civil-rights-the-executive
      when: Mar., spring
      date: 1961-03
      thread: civil-rights-the-executive
      also:
      - voting-rights
      c: 'New Orleans, the eve of the Civil Rights Commission''s Louisiana hearing, about 1 a.m. Robert Kennedy by telephone
        to Bernhard, its staff director: the hearing will cost deLesseps Morrison the primary; "I want it called off—now!"
        About 2 a.m. Storey, the hearing''s chairman, agrees to postpone it; the press told of Hannah''s trip to Nigeria.
        By Bernhard''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 162–63 (Earl Long, privately, to Bernhard, had opened the State registrar''s
        records; the hearing held a few months later). Check: the day; Wofford: by the spring of 1961. Names: Robert Kennedy,
        Bernhard, Morrison, Storey, Hannah.'
      src:
        c: 8bb3abca
        rows:
        - 'w.wofford-of-kennedys-and-kings 162–63: all'
      tags:
      - name:kennedy-robert-f
      - name:bernhard-berl-i
      - name:morrison-delesseps-s
      - name:storey-robert-g
      - name:hannah-john-a
      - state:la
      - city:new-orleans
- add:
    entry:
      id: cal.1961-07.transition-and-staff
      when: July, early
      date: 1961-07
      thread: transition-and-staff
      c: 'Rusk to Bowles, instead of an answer to Bowles''s memorandum of late June on new directions: "Why don''t you free
        yourself from the department and take on the job of roving ambassador?" The idea, Rusk says, the President''s. By
        Bowles''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 367–68. Check: the day. To check: Bowles to Rusk, June 1961 (cited by [[w.wofford-of-kennedys-and-kings]],
        367, from [[w.bowles-promises-to-keep]]). Names: Rusk, Bowles, Kennedy.'
      src:
        c: 238b5956
        rows:
        - 'w.wofford-of-kennedys-and-kings 367–68: all'
      tags:
      - name:rusk-dean
      - name:bowles-chester
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-07.transition-and-staff-2
      when: July
      date: 1961-07
      thread: transition-and-staff
      c: 'The President with Bowles, lunch, the White House pool and the family quarters: he may have been wrong not to make
        Bowles Secretary of State; the department has not given the new policies wanted; would Bowles go to Chile? Bowles
        wants no embassy; they will meet again the next week. By Bowles''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 368–69 (Bowles to Stevenson: "I have never heard the President talk as thoughtfully
        and passionately on foreign affairs"). Check: the day. See [[cal.1961-07-17.transition-and-staff]]. Names: Kennedy,
        Bowles.'
      src:
        c: 4a16b978
        rows:
        - 'w.wofford-of-kennedys-and-kings 368–69: all'
      tags:
      - name:kennedy-john-f
      - name:bowles-chester
- add:
    entry:
      id: cal.1961-07-15.transition-and-staff
      when: July 15
      date: '1961-07-15'
      thread: transition-and-staff
      c: 'Wofford to the President, a memorandum by hand: firing Bowles "would be a serious mistake," a setback abroad, at
        home, in the department, and to his own search for a new foreign policy; Bowles "the one high Department official
        who opposed the Cuban invasion." "The wrong firing, at the wrong time, of the wrong views, in the wrong Department."
        Kennedy skims it and says he will read it.'
      n: '[[w.wofford-of-kennedys-and-kings]], 369–70. To check: Wofford to Kennedy, July 15, 1961 (quoted by [[w.wofford-of-kennedys-and-kings]],
        369–70). See [[cal.1961-07-17.transition-and-staff]]. Names: Wofford, Kennedy, Bowles.'
      src:
        c: f6c2265b
        rows:
        - 'w.wofford-of-kennedys-and-kings 369–70: all'
        - 'via x.1980.wofford-of-kennedys-and-king-p369-70: all'
      tags:
      - name:wofford-harris
      - name:kennedy-john-f
      - name:bowles-chester
- add:
    entry:
      id: cal.1961-07.civil-rights-the-executive
      when: July
      date: 1961-07
      thread: civil-rights-the-executive
      c: Louis Martin of the Democratic National Committee releases the names of 47 Negroes chosen for high posts.
      n: '[[w.wofford-of-kennedys-and-kings]], 142. Check: the day.'
      src:
        c: 2c2e6282
        rows:
        - 'w.wofford-of-kennedys-and-kings 142: all'
- add:
    entry:
      id: cal.1962-01.civil-rights-the-executive
      when: Jan.
      date: 1962-01
      thread: civil-rights-the-executive
      c: 'Wofford, back from six weeks arranging Peace Corps projects in Africa, to the President: ending discrimination at
        home will do more for relations with Africa than anything else, but "the greater problem of integration is our integration
        into this largely colored world." He asks leave to shift to "the big integration," and that Louis Martin come to the
        White House in his place, "for we are heading into stormier weather with Negro leadership in view of the rising disappointment
        over our current slower strategy."'
      n: '[[w.wofford-of-kennedys-and-kings]], 166. To check: Wofford to Kennedy, January 1962 (quoted by [[w.wofford-of-kennedys-and-kings]],
        166). Check: the day. Names: Wofford, Kennedy.'
      src:
        c: 00650cc0
        rows:
        - 'w.wofford-of-kennedys-and-kings 166: all'
        - 'via x.1980.wofford-of-kennedys-and-king-p166-67: all'
      tags:
      - name:wofford-harris
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-04.civil-rights-the-executive
      when: Apr.
      date: 1962-04
      thread: civil-rights-the-executive
      also:
      - peace-corps
      c: 'The President to Wofford, in his office: would he rather be ambassador to an African country, if he must leave?
        Addis Ababa after a year or two, if he likes. Lee White of Sorensen''s staff to take civil rights. Kennedy circles
        in Wofford''s memorandum the steps it lists, the housing order, the National Guard''s integration, an order on aid
        to higher education, and assures him he will take them all in time. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 167. Check: the day. Check: Wofford also gives the assurance as of his leaving
        in August 1962: "You will see, with time I''m going to do them all" (125). Names: Kennedy, Wofford, Lee White.'
      src:
        c: c58ec5ef
        rows:
        - 'w.wofford-of-kennedys-and-kings 167: all'
      tags:
      - name:kennedy-john-f
      - name:wofford-harris
      - name:white-lee-c
- add:
    entry:
      id: cal.1962-08.peace-corps
      when: Aug., summer
      date: 1962-08
      thread: peace-corps
      also:
      - civil-rights-the-executive
      c: 'The Rose Garden, the President''s farewell to several hundred volunteers going overseas, all trained at Washington''s
        universities. To Wiggins, before it: "And do you send all your Negroes to Howard for training?" Then down the line
        of nearly three hundred for Ethiopia, the largest group yet to one country, Wofford their representative: "Keep in
        touch, but not by postcard!" By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 283–84. Check: the day; Wofford: the summer of 1962, before he left for Addis
        Ababa in August (167). Names: Kennedy, Wofford.'
      src:
        c: dd028b59
        rows:
        - 'w.wofford-of-kennedys-and-kings 283–84: all'
      tags:
      - name:kennedy-john-f
      - name:wofford-harris
- add:
    entry:
      id: cal.1965-03-05.peace-corps
      when: Mar. 5–7
      date: '1965-03-05'
      thread: peace-corps
      c: 'Washington, the State Department. The Conference of Returned Peace Corps Volunteers, "Citizens in a Time of Change":
        some 1,000, 200 of them helped with their fares, with 250 of the country''s leaders. Belafonte, arm in arm with Warren,
        Shriver, McNamara and Humphrey, leads "We Shall Overcome." Moyers, closing: "while the lightning is flashing and the
        thunder is rolling and the rain is falling, the grass is growing."'
      n: '[[w.wofford-of-kennedys-and-kings]], 178, 301–02, 331. Check: the days; the calendar''s Jan. 26 entry gives Mar.
        5–7. See [[cal.1965-01-26.peace-corps]]. Names: Warren, Shriver, McNamara, Humphrey, Moyers.'
      src:
        c: ab76a836
        rows:
        - 'w.wofford-of-kennedys-and-kings 178: all'
        - 'w.wofford-of-kennedys-and-kings 301–02: all'
        - 'w.wofford-of-kennedys-and-kings 331: all'
      tags:
      - name:shriver-r-sargent
      - name:mcnamara-robert-s
      - name:humphrey-hubert-h
      - name:moyers-bill
      - name:warren-earl
- add:
    entry:
      id: cal.1967-11.robert-kennedy-campaign-decision
      when: Nov., late
      date: 1967-11
      thread: robert-kennedy-campaign-decision
      c: 'Long Island, dinner at the home of Bill and Judith Moyers, the Woffords there. Robert Kennedy, to Clare Wofford:
        "Do you think I should run?" She: "I don''t know—I want you to, but I don''t know." Kennedy, by Wofford''s memory:
        "I would like to run, and the country cannot afford four more years of Johnson and the war, but if I do it, it will
        become so personal ... that the big issues might be lost."'
      n: '[[w.wofford-of-kennedys-and-kings]], 423. Check: the day; Wofford: late in the fall of 1967. Names: Robert Kennedy,
        Moyers, Wofford, Johnson.'
      src:
        c: a0c5c51f
        rows:
        - 'w.wofford-of-kennedys-and-kings 423: all'
      tags:
      - name:kennedy-robert-f
      - name:moyers-bill
      - name:wofford-harris
- add:
    entry:
      id: cal.1967-12.king-2
      when: Dec., winter
      date: 1967-12
      thread: king
      also:
      - king-poor-peoples
      c: 'King to Wofford: the idea of a deliberate, peaceful exodus from a slum past repair, then its burning, after public
        notice and care for every life. For the road ahead "a ''Long March'' mentality." By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 231. Check: the day; Wofford: the winter of 1967–68. Names: Martin Luther King,
        Wofford.'
      src:
        c: 586ecdb0
        rows:
        - 'w.wofford-of-kennedys-and-kings 231: all'
      tags:
      - name:king-martin-luther-jr
      - name:wofford-harris
- add:
    entry:
      id: cal.1968-02.robert-kennedy-campaign-decision
      when: Feb.
      date: 1968-02
      thread: robert-kennedy-campaign-decision
      c: 'Aspen, Colo., McNamara''s ski lodge, the Woffords there. Robert Kennedy by telephone to McNamara, at length: agonizing
        about entering the race, sounding as if he will, against McNamara''s advice. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 423–24. Check: the day; Wofford: during the New Hampshire campaign, before
        the vote. Names: Robert Kennedy, McNamara, Wofford.'
      src:
        c: aa4ccc5b
        rows:
        - 'w.wofford-of-kennedys-and-kings 423–24: all'
      tags:
      - name:kennedy-robert-f
      - name:mcnamara-robert-s
      - name:wofford-harris
- add:
    entry:
      id: cal.1968-08.elections-1968-humphrey
      when: Aug., early
      date: 1968-08
      thread: elections-1968-humphrey
      c: 'At the Vice President''s request, Moyers and Wofford draft an address accepting the nomination, a weekend''s work:
        respect for Johnson''s domestic record, "above all a declaration of independence." By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 428. Check: the day. Names: Humphrey, Moyers, Wofford, Johnson.'
      src:
        c: 3aa953ce
        rows:
        - 'w.wofford-of-kennedys-and-kings 428: all'
      tags:
      - name:humphrey-hubert-h
      - name:moyers-bill
      - name:wofford-harris
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-18
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: 'Chicago, about midnight. Mondale, from Humphrey''s suite, to Wofford: the Kennedy family''s opposition weighs heavily
        against Shriver for Vice President. Wofford: the old Palace Guard "have no monopoly on the Kennedy legacy." By Wofford''s
        account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 431 (Shriver past the cuts to seven and five; people close to Humphrey: Edward
        Kennedy vetoed him; Mondale, later: Kennedy "cool" to it). Check: the hour. Names: Mondale, Humphrey, Wofford, Shriver.'
      src:
        c: df0800c2
        rows:
        - 'w.wofford-of-kennedys-and-kings 431: all'
      tags:
      - name:mondale-walter-f
      - name:humphrey-hubert-h
      - name:wofford-harris
      - name:shriver-r-sargent
      - city:chicago
      - state:il
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-streets
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago-streets
      c: 'Chicago, Michigan Avenue across from the Hilton, noon to about 3:30. A silent vigil of delegates and party officials,
        between the young people in Grant Park and the Guard, called the night before after Ribicoff''s speech: Ribicoff,
        Yarmolinsky, Salinger, Michael Novak, Samuel Beer, Lester Hyman, Wofford, Charles Evers some two hours; twenty-five
        or thirty most of the time; Mailer, briefly, then to the crowd in the park. It ends at the Wisconsin delegation''s
        call to march to the Amphitheatre. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 433–35. Names: Ribicoff, Yarmolinsky, Salinger, Wofford, Evers, Mailer.'
      src:
        c: 398adef3
        rows:
        - 'w.wofford-of-kennedys-and-kings 433–35: all'
      tags:
      - name:ribicoff-abraham
      - name:yarmolinsky-adam
      - name:salinger-pierre
      - name:wofford-harris
      - name:evers-charles
      - name:mailer-norman
      - city:chicago
      - state:il
