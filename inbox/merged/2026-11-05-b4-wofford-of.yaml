      c: 'Kennedy with Wilkins, alone, at Wofford''s arranging: a candid exchange, by Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 46. Check: the day. Names: Kennedy, Wilkins, Wofford.'
