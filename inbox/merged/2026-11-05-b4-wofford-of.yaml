      when: Apr. 11
      date: '1961-04-11'
      thread: civil-rights-the-executive
      c: 'The equal employment committee''s first meeting, the President to it: its powers to remove "every trace of discrimination"
        from government employment and government work. "All of us agree that Federal money should not be spent in any way
        which encourages discrimination, but rather should be spent in such a way that it encourages the national goal of
        equal opportunity."'
      n: 'Remarks at the First Meeting of the President''s Committee on Equal Employment Opportunity, [1961 Pub. Papers 256](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=314)
        (Apr. 11, 1961). [[w.wofford-of-kennedys-and-kings]], 141 (the words of the Civil Rights Commission''s recommendation,
        in Wofford''s draft). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Kennedy.'
