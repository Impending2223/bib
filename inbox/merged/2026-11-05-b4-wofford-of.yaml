      - city:new-orleans
- add:
    entry:
      id: cal.1961-01.civil-rights-the-executive
      when: Jan.
      date: 1961-01
      thread: civil-rights-the-executive
      c: 'Wofford to Robert Kennedy, before the inauguration: the FBI a "bottleneck"; it "has, or uses, few if any Negro investigators.
        White FBI investigators, who often have a Southern accent, run into great resistance from skeptical, fearful Negroes."
        Hoover will not cooperate until convinced "our new Attorney General is just as serious about conspiracies against
        civil rights as about the Communist conspiracy."'
      n: '[[w.wofford-of-kennedys-and-kings]], 213. To check: Wofford to Robert Kennedy, January 1961 (quoted by [[w.wofford-of-kennedys-and-kings]],
        213). Check: the day. Names: Wofford, Robert Kennedy, Hoover.'
      src:
        c: 925b09fa
        rows:
        - 'w.wofford-of-kennedys-and-kings 213: all'
        - 'via x.1980.wofford-of-kennedys-and-king-p213: all'
      tags:
      - name:wofford-harris
      - name:kennedy-robert-f
      - name:hoover-j-edgar
- add:
    entry:
      id: cal.1961-01-09.peace-corps
      when: Jan. 9
      date: '1961-01-09'
      thread: peace-corps
      c: 'The President-elect''s press release on Millikan''s report: an "International Youth Service Agency," to start "on
        a small scale"; "several hundred young people in the first year or two," and "no pressure to achieve greater volume
        until there is sufficient experience."'
      n: '[[w.wofford-of-kennedys-and-kings]], 250–51 (Millikan''s report, early January: a pilot operation within the aid
        program). Names: Kennedy.'
      src:
        c: 4469a956
        rows:
        - 'w.wofford-of-kennedys-and-kings 250–51: all'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-01-21.peace-corps
      when: Jan. 21
      date: '1961-01-21'
      thread: peace-corps
      c: 'Kennedy asks Shriver to report how a Peace Corps could be organized, and then to organize it. Shriver, against appointing
        another relative: Kennedy, "Go ahead. You can do it." Within hours a President''s task force of about a dozen, Wofford
        its coordinator. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 251–52. Check: the day; Wofford: "a day or two after the inauguration." Names:
        Kennedy, Shriver, Wofford.'
      src:
        c: fc4ac6f4
        rows:
        - 'w.wofford-of-kennedys-and-kings 251–52: all'
      tags:
      - name:kennedy-john-f
      - name:shriver-r-sargent
      - name:wofford-harris
- add:
    entry:
      id: cal.1961-02.peace-corps
      when: Feb., early
      date: 1961-02
      thread: peace-corps
      c: 'The task force''s office at the Mayflower. Wiggins of the aid administration, "The Towering Task": a Peace Corps
        only if large, thousands of volunteers in each of a few countries, 5,000 teachers for the Philippines. Shriver, reading
        it at night, telegraphs him about 3 a.m.; he comes to the first enlarged meeting of the task force that morning. By
        Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 253–54. Check: the day. Names: Shriver.'
      src:
        c: 0a6b55dd
        rows:
        - 'w.wofford-of-kennedys-and-kings 253–54: all'
      tags:
      - name:shriver-r-sargent
- add:
    entry:
      id: cal.1961-02-28.peace-corps
      when: Feb. 28
      date: '1961-02-28'
      thread: peace-corps
      c: 'Shriver''s report to the President: "I recommend its immediate establishment." The Peace Corps launched "now and
        in earnest by executive action," on Mutual Security funds, several hundred volunteers in training by summer; "not
        as an arm of the Cold War but as a ... genuine experiment in international partnership"; no draft exemption; a channel
        through the UN.'
      n: '[[w.wofford-of-kennedys-and-kings]], 255–57, 261. To check: Shriver to Kennedy, Feb. 28, 1961 (quoted by [[w.wofford-of-kennedys-and-kings]],
        256–57, 261). Names: Shriver, Kennedy.'
      src:
        c: 7b3551fd
        rows:
        - 'w.wofford-of-kennedys-and-kings 255–57: all'
        - 'w.wofford-of-kennedys-and-kings 261: all'
        - 'via x.1980.wofford-of-kennedys-and-king-p261: all'
      tags:
      - name:shriver-r-sargent
      - name:kennedy-john-f
