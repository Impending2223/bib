      - name:yarmolinsky-adam
      - name:wofford-harris
      - name:kennedy-john-f
      - name:lovett-robert-a
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1960-11-22.transition-and-staff-2
      when: Nov. 22
      date: '1960-11-22'
      thread: transition-and-staff
      also:
      - africa
      c: The outgoing administration moves to name seven senior Foreign Service officers ambassadors to the new African states.
        Thomas Farmer of the talent search protests to Robert Kennedy, Wofford to Bowles; Robert Kennedy agrees that New Frontier
        men will do best with the new African leaders, and the plan is held. By Wofford's account.
      n: '[[w.wofford-of-kennedys-and-kings]], 86. Check: the day; Wofford: two weeks after the election. Names: Robert Kennedy,
        Wofford, Bowles.'
      src:
        c: c0f14b67
        rows:
        - 'w.wofford-of-kennedys-and-kings 86: all'
      tags:
      - name:kennedy-robert-f
