      when: Apr. 18
      date: '1961-04-18'
      thread: civil-rights-the-executive
      c: A White House memorandum directs the departments to stop sponsoring employee associations or recreation that discriminate.
      n: '[[w.wofford-of-kennedys-and-kings]], 142.'
