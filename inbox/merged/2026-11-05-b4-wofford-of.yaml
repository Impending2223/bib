      when: Apr. 14
      date: '1961-04-14'
      thread: civil-rights-the-executive
      c: The Cabinet Room. Dutton convenes, in the President's name, the Subcabinet Group on Civil Rights, each department's
        and agency's man at the level of assistant secretary, "to survey civil rights aspects of public programs ... and coordinate
        these on a government-wide basis." He cites the President's words of Apr. 11 on federal money. Wofford its chairman
        thereafter.
      n: '[[w.wofford-of-kennedys-and-kings]], 145, 147. Names: Dutton, Kennedy, Wofford.'
