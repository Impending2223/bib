- add:
    entry:
      id: cal.1960-02.elections-1960-primaries
      when: Feb.
      date: 1960-02
      thread: elections-1960-primaries
      c: 'Madison, the University of Wisconsin''s law school. Wofford, sent by Shriver in Bowles''s place, speaks for Kennedy
        to some twenty: Kennedy "has approximately the same view of the world as Humphrey, Stevenson, and Bowles"; Humphrey''s
        amendment to outlaw the Communist Party, in the Communist Control Act of 1954, "the worst response in the whole period."
        Shriver prints the talk and mails thousands of copies around the State. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 41–43. Check: the day; Shriver''s call to Wofford, after a law class in February
        1960 (41). Names: Wofford, Shriver, Bowles, Kennedy, Humphrey, Stevenson.'
      src:
        c: 8171c8c0
        rows:
        - 'w.wofford-of-kennedys-and-kings 41–43: all'
      tags:
      - name:wofford-harris
