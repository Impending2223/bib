- add:
    entry:
      id: cal.1961-02.civil-rights-the-executive-3
      when: Feb.
      date: 1961-02
      thread: civil-rights-the-executive
      c: 'Dutton, Secretary to the Cabinet, to the President: a "special interdepartmental program," "an additional string
        in our civil rights harp": the departments'' assistant secretaries to work quietly, "economic and social in nature
        rather than legalistic," "anticipatory rather than only after-the-fact"; "showcase progress" in a few Southern cities.
        The President gives him leave. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 145. Check: the day; Wofford: a week after he joined the White House staff.
        Names: Dutton, Kennedy.'
