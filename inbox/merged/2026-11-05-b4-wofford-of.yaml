      when: Apr.
      date: 1961-04
      thread: civil-rights-the-executive
      c: 'Wofford, for the President, to the departments and agencies: "survey and specify the degree and location of any
        such discrimination in its operations, facilities, services or programs, including grant-in-aid programs," appraise
        their power to act, and recommend; written reports in two months.'
      n: '[[w.wofford-of-kennedys-and-kings]], 147. Check: the day; after the Subcabinet Group''s first meeting. See [[cal.1961-04-14.civil-rights-the-executive]].
