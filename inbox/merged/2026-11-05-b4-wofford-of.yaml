- add:
    entry:
      id: cal.1960-04.elections-1960-primaries-2
      when: Apr.
      date: 1960-04
      thread: elections-1960-primaries
      c: 'South Bend. Kennedy at Notre Dame, after Wisconsin: a standing ovation. Hesburgh, after their talk: "I guess I will
        opt for vigor and youth." Kennedy renews his request; Wofford agrees to join the staff full time when classes end,
        May 1.'
      n: '[[w.wofford-of-kennedys-and-kings]], 43. Check: the day. Names: Kennedy, Hesburgh, Wofford.'
      src:
        c: b0aa7aae
        rows:
        - 'w.wofford-of-kennedys-and-kings 43: all'
      tags:
      - name:kennedy-john-f
      - name:hesburgh-theodore-m
      - name:wofford-harris
- add:
    entry:
      id: cal.1960-05.elections-1960-nomination
      when: May
      date: 1960-05
      thread: elections-1960-nomination
      also:
      - civil-rights-organizations
      c: 'Wilkins of the NAACP to Wofford: Kennedy''s record not bad, a vote for every major civil rights measure, but his
        vote for the jury-trial amendment of 1957 used against him. "If you ask me who, of all the men in political life,
        I would trust to do the most about civil rights as President, it would be Lyndon Johnson." By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 46–47. Check: the day; after Kennedy asked Wofford, a few days after he joined
        the staff, whom to see (46). Names: Wilkins, Wofford, Kennedy, Johnson.'
      src:
        c: c52b29c4
        rows:
        - 'w.wofford-of-kennedys-and-kings 46–47: all'
      tags:
      - name:wilkins-roy
      - name:wofford-harris
      - name:kennedy-john-f
      - name:johnson-lyndon-b
