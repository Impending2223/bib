      id: cal.1961-03-01.peace-corps-2
      when: Mar. 1
      date: '1961-03-01'
      thread: peace-corps
      c: 'Special message: a permanent Peace Corps by law. "Although this is an American Peace Corps, the problem of world
        development is not just an American problem."'
      n: 'Special Message to the Congress on the Peace Corps, [1961 Pub. Papers 143](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=201)
        (Mar. 1, 1961). [[w.wofford-of-kennedys-and-kings]], 261–62. See [[cal.1961-03-01.peace-corps]]. Names: Kennedy.'
