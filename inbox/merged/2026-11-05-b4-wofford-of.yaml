      id: cal.1960-04.elections-1960-primaries
      when: Apr.
      date: 1960-04
      thread: elections-1960-primaries
      c: 'After the Wisconsin primary. Humphrey, having read Wofford''s Madison talk, writes him a bitter note: *Et tu, Brute*.
        By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 43. Check: the day. Names: Humphrey, Wofford.'
      src:
