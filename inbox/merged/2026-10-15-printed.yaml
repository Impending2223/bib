    set:
      n: 'A. L. Hopkins, [report to the Sovereignty Commission, Sept. 29, 1961](https://da.mdah.ms.gov/sovcom/document/images/png/cd03/023393), SCR ID 2-60-0-24-1-1-1, 1: "Monday morning, September 25, 1961," Hurst and Lee at "Westbrook''s gin at Osyka"; the coroner''s jury cleared Hurst; a preliminary hearing at Liberty, Sept. 26, ruled self-defense. Robert Moses, [Report Concerning the Louis Allen Case](https://www.wisconsinhistory.org/record/multi/W01DRZ7) (SNCC, 1964, after Jan. 31), 1: "murdered on September 30, 1961." Civil Rights Division, [Notice to Close File, Louis Allen](https://www.justice.gov/crt/case-document/file/1194136/dl) (May 19, 2015), 3, from the FBI''s files: Sept. 25 (printed "1964"). The literature: Sept. 25. [[w.carson-in-struggle]]; [[w.branch-parting-the-waters]]; [[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]. Check: the gin''s place (Hopkins: Osyka); the coroner''s inquest. See [[cal.1961-08.mississippi]]. Names: Lee, Moses, Hurst.'
