      id: cal.1964-06-23.mississippi-6
      when: June 23
      date: '1964-06-23'
      thread: mississippi
      c: 'Hoover to Johnson by telephone, 4:05 p.m.: agents have found the missing men''s car burning in a swamp outside Philadelphia,
        Miss.; whether bodies are inside not yet known. Hoover sure they are dead. Johnson: "Why won''t an agent be able to
        look at a car and see if any bones are in it?"'
      n: '[[w.kotz-judgment-days]], 164. To check: [Johnson and J. Edgar Hoover, 4:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-june-23-1964),
        Tape WH6406.14, PNO 4 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 164 n.14). See [[cal.1964-06-23.mississippi]].
        Names: Hoover, Johnson.'
      src:
        c: 07ba135f
        rows:
        - 'w.kotz-judgment-days 164: all'
        - 'via w.kotz-judgment-days 164 n.14: all'
      tags:
      - name:hoover-j-edgar
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-06-23.mississippi-7
      when: June 23
      date: '1964-06-23'
      thread: mississippi
      c: 'The Oval Office, twenty minutes, Lee White bringing them in. Johnson tells Robert and Carolyn Goodman and Nathan
        Schwerner of the burned car; calls McNamara, in their hearing, for Navy helicopters and men for the search. The parents
        ask federal protection for the others in Mississippi. Johnson to Mrs. Goodman: "Ma''am, we''ll do everything we can."'
      n: '[[w.kotz-judgment-days]], 164–65. To check: [[w.cagin-we-are-not-afraid]], 331–32; Bernard Asbell, "My Son Didn''t
        Die in Vain!" *Good Housekeeping*, May 1965 (cited by [[w.kotz-judgment-days]], 165 n.18). Names: Johnson, White,
        McNamara.'
      src:
        c: 6df367e2
        rows:
        - 'w.kotz-judgment-days 164–65: all'
        - 'via w.kotz-judgment-days 165 n.18: D'
      tags:
      - name:johnson-lyndon-b
      - name:white-lee-c
      - name:mcnamara-robert-s
