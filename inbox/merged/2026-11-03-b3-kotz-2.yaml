- add:
    entry:
      id: cal.1963-11-22.king
      when: Nov. 22
      date: '1963-11-22'
      thread: king
      c: 'Atlanta. King, with Clarence Jones and Levison by telephone, agrees a statement on the assassination: "He was a
        great and dedicated President." The finest tribute "to implement the progressive policies that he sought to initiate
        in foreign and domestic relations." The atmosphere of violence and hatred a cause.'
      n: '[[w.kotz-judgment-days]], 9. To check: "Statement of Dr. Martin Luther King Jr.," Nov. 22, 1963, King Papers, King
        Center; Clarence Jones, interview by Kotz (cited by [[w.kotz-judgment-days]], 9 n.33). Names: Martin Luther King,
        Levison.'
      src:
        c: 8458dfb1
        rows:
        - 'w.kotz-judgment-days 9: all'
        - 'via w.kotz-judgment-days 9 n.33a: B'
        - 'via w.kotz-judgment-days 9 n.33b: A, C'
      tags:
      - name:king-martin-luther-jr
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1963-11-22.succession-5
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Johnson to Goldberg by telephone, 9:06 p.m.: "I want you to be thinking about what I ought to do ... to try to bring
        all these elements together and unite the country." Whether to address a joint session after the funeral: Goldberg
        thinks he should; asked to help prepare the speech.'
      n: '[[w.kotz-judgment-days]], 15–16. To check: [Johnson and Goldberg, 9:06 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-arthur-goldberg-november-22-1963),
        Tape K6311.01A, PNO 1 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 16 n.58). Names: Johnson, Goldberg.'
      src:
        c: 04426e76
        rows:
        - 'w.kotz-judgment-days 15–16: all'
        - 'via w.kotz-judgment-days 16 n.58: all'
      tags:
      - name:johnson-lyndon-b
      - name:goldberg-arthur-j
- add:
    entry:
      id: cal.1963-11-22.civil-rights-bill
      when: Nov. 22
      date: '1963-11-22'
      thread: civil-rights-bill
      also:
      - succession
      c: 'The Elms, after 11 p.m. Johnson in bed with Moyers, Valenti and Cliff Carter, four hours: the next day''s calls
        and meetings. To Valenti: "I''m going to pass the civil rights bill and not change one word of it. ... I''m going
        to fix it so everyone can vote"; Truman''s health care bill too. By Valenti''s account.'
      n: '[[w.kotz-judgment-days]], 15–16. To check: [[w.valenti-very-human-president]], 152–53; Valenti, interview by Kotz;
        [[w.miller-lyndon]], 325; Cliff Carter, oral history, LBJ Library (cited by [[w.kotz-judgment-days]], 15–16 nn.55–59).
        Names: Johnson, Moyers, Valenti.'
      src:
        c: a2acf19e
        rows:
        - 'w.kotz-judgment-days 15–16: all'
        - 'via w.kotz-judgment-days 16 n.59a: B-C'
        - 'via w.kotz-judgment-days 15 n.56: A'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:valenti-jack
- add:
