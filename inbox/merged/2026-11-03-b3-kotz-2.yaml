      when: Jan. 4
      date: '1968-01-04'
      thread: king-poor-peoples
      c: 'The FBI launches POCAM, against the Poor People''s Campaign: a directive to its offices in twenty-one cities, to
        keep the caravans of the poor from reaching Washington.'
      n: '[[w.kotz-judgment-days]], 387. To check: [[w.mcknight-last-crusade]], 20–28 (cited by [[w.kotz-judgment-days]],
        387 n.14). Names: Martin Luther King.'
      src:
        c: f8ceeb28
        rows:
