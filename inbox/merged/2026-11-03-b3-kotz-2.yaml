      when: June 24
      date: '1964-06-24'
      thread: mississippi
      c: 'DeLoach having complained to Walter Jenkins, Johnson to Hoover by telephone, 5:30 p.m.: Dulles is not to be "an
        FBI inspector"; "I haven''t got a better friend in the government than you." Hoover, of Sheriff Rainey: "That sheriff
        is a pretty bad fellow."'
