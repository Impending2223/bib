      thread: mississippi
      c: 'Johnson to McCormack by telephone, 12:45 p.m.: assure Representatives Ryan and Reid that he is doing "everything
        humanly possible" to find the missing men; to ward off their visit with the parents.'
      n: '[[w.kotz-judgment-days]], 163. To check: [Johnson and John McCormack, 12:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-mccormack-june-23-1964),
