      id: cal.1963-11-23.elections-1964-2
      when: Nov. 23
      date: '1963-11-23'
      thread: elections-1964
      also:
      - democratic-party
      c: 'Johnson to Yarborough by telephone, 1:44 p.m.: he needs his support; Yarborough pledges it. The day before Dallas
        Johnson was still pressing Texas allies to challenge Yarborough in the 1964 Senate primary.'
      n: '[[w.kotz-judgment-days]], 29. To check: [Johnson and Yarborough, 1:44 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ralph-yarborough-november-23-1963),
