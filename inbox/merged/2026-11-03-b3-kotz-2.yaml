      when: July 10
      date: '1964-07-10'
      thread: mississippi
      also:
      - king
      c: 'Moses asks King to come to Mississippi for the Freedom Democratic Party and its challenge to the regular delegation
        at Atlantic City. The Summer Project shifting from registration to choosing the Freedom delegates: six killed, five
        hundred beaten or arrested, thirty-five churches burned.'
      n: '[[w.kotz-judgment-days]], 175–76. Names: Moses, Martin Luther King.'
