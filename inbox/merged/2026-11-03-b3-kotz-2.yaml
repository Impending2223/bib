      id: cal.1964-06-26.mississippi-3
      when: June 26
      date: '1964-06-26'
      thread: mississippi
      c: 'The Oval Office, 1:05 p.m. Dulles to Governor Johnson by telephone, the President, Katzenbach and Finney with him:
        the two to work together "to control and punish terroristic activities"; more FBI men; the National Council of Churches
        to warn the students. The President: more agents so that he can resist those "telling me ... I got to have marshals
        and troops."'
      n: '[[w.kotz-judgment-days]], 170–71. To check: [Johnson, Allen Dulles and Paul Johnson, 1:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-paul-johnson-and-allen-dulles-june-26-1964),
        Tape WH6406.17, PNO 20 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 170 n.31). See [[cal.1964-06-26.mississippi]].
        Names: Dulles, Johnson, Katzenbach.'
