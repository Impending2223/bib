    entry:
      id: cal.1964-11-05.king
      when: Nov. 5
      date: '1964-11-05'
      thread: king
      c: 'Johnson to King by telephone, 3:20 p.m., two days after the election: thanks for his support and the Negro turnout;
        Negroes "take great pride in your great honor"; the poverty program next. "I''ll be calling on you. ... Now we got
        to move on the next four years."'
      n: '[[w.kotz-judgment-days]], 228. To check: [Johnson and Martin Luther King, 3:20 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-martin-luther-king-november-5-1964),
        Tape WH6411.09, PNO 2 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 228 n.94). Names: Johnson, Martin
        Luther King.'
      src:
        c: 7305212f
        rows:
        - 'w.kotz-judgment-days 228: all'
        - 'via w.kotz-judgment-days 228 n.94: all'
      tags:
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
