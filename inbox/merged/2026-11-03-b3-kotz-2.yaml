      when: Mar. 13
      date: '1967-03-13'
      thread: king
      c: 'King, in Washington on urban development, cancels at the last minute an off-the-record meeting with Johnson set
        for 5:30 p.m. by James Jones and Louis Martin. Johnson to his staff: "Ask Louis Martin why he hasn''t brought [King]
        in. He''s canceled two engagements with me, and I don''t understand it."'
      n: '[[w.kotz-judgment-days]], 373. To check: Marvin Watson to Johnson, Mar. 13, 1967; "President''s Memo to Staff,"
