      id: cal.1964-01-06.civil-rights-the-executive
      when: Jan. 6
      date: '1964-01-06'
      thread: civil-rights-the-executive
      c: 'Johnson to Whitney Young by telephone, 3:55 p.m.: for Young''s proposal of Higginbotham and Constance Baker Motley
        for federal judgeships, but not "unless the whole Negro community knows that I''m doing it, and the Democrats are
        doing it, and this damn *Jet* and the rest of them quit cutting us up."'
      n: '[[w.kotz-judgment-days]], 94–95. To check: [Johnson and Whitney Young, 3:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-whitney-young-january-6-1964),
        Tape WH6401.06, PNO 5 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 95 n.26). Names: Johnson, Whitney
        Young, Higginbotham, Motley.'
      src:
        c: 03cf2051
        rows:
        - 'w.kotz-judgment-days 94–95: all'
        - 'via w.kotz-judgment-days 95 n.26: all'
