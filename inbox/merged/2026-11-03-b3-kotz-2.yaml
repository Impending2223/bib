      when: Dec. 25
      date: '1963-12-25'
      thread: civil-rights-bill
      c: 'Johnson to Harry Provence, a Waco newspaper editor, by telephone, 8:07 p.m.: ask Poage, chairman of House Agriculture,
        to sign the discharge petition, after reminding him of Johnson''s help on the farm bill. Poage refuses; half a dozen
        Texans sign.'
      n: '[[w.kotz-judgment-days]], 39. To check: Johnson and Provence, Dec. 25, 1963, 8:07 p.m., Tape K6312.18, PNO 1, LBJ
        Library (cited by [[w.kotz-judgment-days]], 39 n.73). Names: Johnson, Poage.'
