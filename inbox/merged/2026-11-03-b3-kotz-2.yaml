      when: Dec. 3
      date: '1963-12-03'
      thread: farm
      also:
      - civil-rights-bill
      c: 'Johnson to Daley by telephone, 10 a.m.: the cotton bill, billions in aid to Southern farmers. Daley, who holds the
        eleven votes of the Chicago delegation, and McCormack, against helping Southerners who vote against civil rights,
        come round.'
      n: '[[w.kotz-judgment-days]], 39 (the call by its note; the lobbying of Daley and McCormack). To check: Johnson and
        Daley, Dec. 3, 1963, 10:00 a.m., Tape K6312.02, PNO 14, LBJ Library; Kenneth O''Donnell, oral history, 71, LBJ Library
        (cited by [[w.kotz-judgment-days]], 39 nn.71–72). See [[cal.1963-12-03.civil-rights-bill]]. Names: Johnson, Daley,
        McCormack.'
      src:
        c: d559a35a
        rows:
        - 'w.kotz-judgment-days 39: all'
        - 'via w.kotz-judgment-days 39 n.72: A'
        - 'via w.kotz-judgment-days 39 n.71: B'
