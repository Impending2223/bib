      when: July 16
      date: '1964-07-16'
      thread: mississippi
      also:
      - king
      c: 'St. Augustine. King and his staff on the next campaign, Florida or Alabama, and on Moses''s call to Mississippi;
        Young for going, others against. King walks out, returns within the hour and agrees to go. To Gibson: "I want to live
        a normal life." The staff: "You have no normal life."'
      n: '[[w.kotz-judgment-days]], 176. To check: [[w.garrow-bearing-the-cross]], 341; [[w.branch-pillar-of-fire]], 408;
        John Gibson, oral history, Howard University (cited by [[w.kotz-judgment-days]], 176 n.39). Names: Martin Luther King,
        Andrew Young.'
