      when: June 23
      date: '1964-06-23'
      thread: mississippi
      c: 'Johnson to Hoover by telephone, 6:15 p.m., still no word whether bodies are in the car: "Why in the hell can''t
        they take a crowbar and break into the car?"'
      n: '[[w.kotz-judgment-days]], 164. To check: [Johnson and J. Edgar Hoover, 6:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-june-23-1964-0),
