      date: '1967-11-30'
      thread: king
      c: 'The FBI tells Johnson the SCLC is to receive a $250,000 grant from the Ford Foundation; he has Marvin Watson ask
        whether it might be stopped. Dec. 1, Mildred Stegall reports DeLoach''s word: the first recommendation $4 million;
        DeLoach talked to a Ford Motor Company man, a former agent, "and after the talk, the Company cut it down to a quarter
        million."'
      n: '[[w.kotz-judgment-days]], 386. Check: Kotz''s source (386 n.4, not legible in the copy read). Names: Johnson, DeLoach.'
      src:
        c: 32f867d7
        rows:
        - 'w.kotz-judgment-days 386: all'
      tags:
      - name:johnson-lyndon-b
      - name:deloach-cartha
