      thread: king
      c: 'FBI headquarters. Sullivan sends Hoover a "highlights" tape of the Willard Hotel recordings and an eight-page memorandum
        summarizing them. Hoover: "They will destroy the burrhead!" Sullivan proposes the memorandum be shown to Walter Jenkins,
        "inasmuch as Dr. King is seeking an appointment with President Johnson."'
      n: '[[w.kotz-judgment-days]], 85. To check: [[w.garrow-bearing-the-cross]], 312; [[w.branch-pillar-of-fire]], 207–08;
        [[w.garrow-fbi-and-martin-luther]], 106–07; Sullivan to Belmont, Jan. 8 and Jan. 27, 1964, Hoover Official and Confidential
        File, file 24; the Church Committee, *Final Report*, bk. 3, 121 (cited by [[w.kotz-judgment-days]], 85 nn.81–85).
        See [[cal.1964-01-05.king]]. Names: Sullivan, Hoover, Jenkins, Martin Luther King.'
