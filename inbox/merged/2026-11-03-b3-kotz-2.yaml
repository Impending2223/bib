        be appointed.'
      n: '[[w.kotz-judgment-days]], 245. To check: [Johnson and Nicholas Katzenbach, 11:30 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-nicholas-katzenbach-december-14-1964),
