      when: June 23
      date: '1964-06-23'
      thread: mississippi
      c: 'Johnson to Dulles by telephone, 7:05 p.m.: "We got the ox in the ditch and we need help"; the observer Governor
        Johnson asked for. Dulles demurs, the Warren Commission''s work. Robert Kennedy on the line: "The situation is explosive
        in Mississippi ... It would give us some breathing room." Tom Finney to go with him.'
      n: '[[w.kotz-judgment-days]], 168–69. To check: [Johnson, Allen Dulles and Robert Kennedy, 7:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-allen-dulles-and-robert-kennedy-june-23-1964),
        Tape WH6406.15, PNO 11 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 168 n.26). See [[cal.1964-06-23.mississippi]].
        Names: Johnson, Dulles, Robert Kennedy.'
