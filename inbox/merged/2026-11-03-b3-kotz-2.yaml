        Mexicans to learn English; a road in eastern Kentucky and West Virginia. Stone: "I''ll support you on poverty too!"'
      n: '[[w.kotz-judgment-days]], 94. To check: [Johnson and Walker Stone, 3:48 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walker-stone-january-6-1964),
        Tape WH6401.06, PNO 4 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 94 n.25). Names: Johnson.'
