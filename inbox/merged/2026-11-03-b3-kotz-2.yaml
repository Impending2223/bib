        dreamed possible. We haven''t weakened the bill one damn bit." Johnson: "we''ve got to make this an American bill
        and not just a Democratic bill." Robert Kennedy, of the civil rights leaders: "They''re not going to be happy, but
        nothing makes them happy."'
