      when: June 26
      date: '1964-06-26'
      thread: mississippi
      c: 'Oxford, Ohio. Moses to the second group of trainees: "the kids are dead." "There may be more deaths. ... people
        were being killed already, the Negroes of Mississippi, and I feel responsible for their deaths. Herbert Lee killed.
        Louis Allen killed. Five others killed this year."'
      n: '[[w.kotz-judgment-days]], 174–75. To check: Sally Belfrage, *Freedom Summer* (1965), 32–33 (cited by [[w.kotz-judgment-days]],
        175 n.37). Names: Moses.'
