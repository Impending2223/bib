      id: cal.1964-06-23.mississippi-5
      when: June 23
      date: '1964-06-23'
      thread: mississippi
      c: 'Johnson to Katzenbach by telephone, 4:16 p.m.: "if I start house-mothering each kid that''s gone down there and
        didn''t show up, that we''ll have this White House filled with people every day." Katzenbach: the three probably taken
        by the Klan and murdered. Johnson: send the parents to Lee White; "I just may drop in."'
      n: '[[w.kotz-judgment-days]], 163–64. To check: Johnson and Nicholas Katzenbach, telephone conversation, June 23, 1964,
        4:16 p.m., Tape WH6406.14, PNO 7, LBJ Library (cited by [[w.kotz-judgment-days]], 163 n.13). Names: Johnson, Katzenbach.'
      src:
        c: 56ce4161
