      date: '1964-05-02'
      thread: civil-rights-bill
      c: 'Johnson to Humphrey by telephone, 2:14 p.m., after the *Times* reports the dressing-down: with his liberal name,
        Humphrey "can get by with repealing the goddamn bill"; Johnson, a Southerner, would be accused of selling out if he
        "changed a comma." "The only bill that I am going to sign is one that you and the attorney general recommend in writing."'
      n: '[[w.kotz-judgment-days]], 140. To check: Johnson and Humphrey, May 2, 1964, 2:14 p.m., Tape WH6405.01, PNO 23, LBJ
