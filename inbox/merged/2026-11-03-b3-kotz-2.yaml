      when: Jan. 17
      date: '1964-01-17'
      thread: women
      c: 'Cabinet meeting, 10 a.m., called the day before after Johnson''s talk with Anna Rosenberg Hoffman; Carpenter and
        Esther Peterson up all night on women in the federal service. Johnson: "go back to your departments and see what you
        can do. Then report to me next Friday how many you have placed." Fifty-eight promotions recommended, announced at
        the Women''s National Press Club.'
      n: '[[w.kotz-judgment-days]], 95–96. To check: Elizabeth Carpenter, interview by Kotz; [[w.carpenter-ruffles-and-flourishes]],
