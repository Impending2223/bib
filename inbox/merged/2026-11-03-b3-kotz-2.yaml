      when: July 2
      date: '1964-07-02'
      thread: mississippi
      c: 'Johnson to Hoover by telephone, 5:02 p.m.: Hoover to go to Jackson next week and open a State office, some two hundred
        agents by summer''s end. "I think you ought to put five thousand people after this Klan. ... You ought to have the
        best intelligence system, better than you''ve got on the Communists."'
      n: '[[w.kotz-judgment-days]], 172. To check: [Johnson and J. Edgar Hoover, 5:02 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-july-2-1964),
