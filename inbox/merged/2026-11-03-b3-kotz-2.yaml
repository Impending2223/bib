      - name:yarborough-ralph
      - state:tx
- add:
    entry:
      id: cal.1963-11-23.succession-6
      when: Nov. 23–24
      date: '1963-11-23'
      thread: succession
      c: 'The Elms, the second night running, to 3 a.m., by Busby''s account. Johnson to Busby on what he means to do: strong
        civil rights legislation; immigration laws that do not discriminate against those not from England and western Europe;
        Social Security built up; health care for the elderly; federal support so that none is denied an education for lack
        of funds.'
      n: '[[w.kotz-judgment-days]], 26. To check: Busby, interview by Kotz (cited by [[w.kotz-judgment-days]], 26 nn.30–32).
        Names: Johnson, Busby.'
      src:
        c: 535bbed4
        rows:
        - 'w.kotz-judgment-days 26: all'
        - 'via w.kotz-judgment-days 26 n.30: all'
      tags:
      - name:johnson-lyndon-b
      - name:busby-horace
- add:
    entry:
      id: cal.1963-11-29.king
      when: Nov. 29
      date: '1963-11-29'
      thread: king
      also:
      - civil-rights-bill
      c: 'King, interviewed by Donald H. Smith, a University of Wisconsin graduate student: "I think that we still have the
        possibility for a strong civil rights bill. ... It may well be that the president''s death will speed this up"; had
        Kennedy lived, "continual delays and attempts to evade it."'
      n: '[[w.kotz-judgment-days]], 20. To check: Donald H. Smith, interview with King, Nov. 29, 1963, State Historical Society
        of Wisconsin (cited by [[w.kotz-judgment-days]], 20 n.13). Names: Martin Luther King.'
      src:
        c: 57b59fa3
        rows:
        - 'w.kotz-judgment-days 20: all'
        - 'via w.kotz-judgment-days 20 n.13: all'
      tags:
      - name:king-martin-luther-jr
