      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1968-03-13.open-housing
      when: Mar. 13
      date: '1968-03-13'
      thread: open-housing
      c: 'Johnson to the Cabinet, two days after the Senate''s vote: lobby the House for open housing. "If any Cabinet member
        has a ''deposit in the bank'' with any House member — particularly Republicans or southern Democrats — now is the
        time to use it."'
      n: '[[w.kotz-judgment-days]], 391. Check: the day; Kotz gives "two days later" after Mar. 11. See [[cal.1968-03-11.open-housing]].
        Names: Johnson.'
      src:
        c: 86bc86f0
        rows:
        - 'w.kotz-judgment-days 391: all'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-04-02.king-poor-peoples
      when: Apr. 2
      date: '1968-04-02'
      thread: king-poor-peoples
      c: 'Clark again refuses Hoover''s request to renew wiretaps on King, the Poor People''s Campaign the national security
        danger Hoover cites, as in January: no "national security threat"; the federal government to help King hold a peaceful
        protest in Washington. Larry Temple, at the White House, against.'
      n: '[[w.kotz-judgment-days]], 404. Check: Kotz''s sources. Names: Clark, Hoover, Martin Luther King.'
      src:
        c: bce578cb
        rows:
        - 'w.kotz-judgment-days 404: all'
