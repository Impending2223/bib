      id: cal.1963-12.civil-rights-bill
      when: Early Dec.
      date: 1963-12
      thread: civil-rights-bill
      c: Johnson asks Rauh, who had denounced his choice for Vice President at Los Angeles, to fly with him on Air Force One
        to Lehman's funeral; then, at the White House, the two agree to work together for the bill.
      n: '[[w.kotz-judgment-days]], 30; [[w.mann-walls-of-jericho]], 385 (early December; Air Force One; not the White House
        meeting). To check: [[w.stern-calculating-visions]], 166; [[w.mcpherson-political-education]], 216 (cited by [[w.kotz-judgment-days]],
        30 nn.43–45). Check: the day of the funeral. Names: Johnson, Rauh.'
      src:
        c: 22b41931
        rows:
        - 'w.kotz-judgment-days 30: all'
        - 'w.mann-walls-of-jericho 385: A'
      tags:
