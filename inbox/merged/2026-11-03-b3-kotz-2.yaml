      when: After Jan. 18
      date: 1964-01
      thread: king
      also:
      - poverty
      c: 'Black Mountain College, outside Asheville, N.C. King and his closest SCLC advisers, three days: new demonstrations,
        Birmingham again, or Northern voter registration for 1964; no agreement. The SCLC endorses the war on poverty; King
        changes the end of *Why We Can''t Wait*: "the twin goal of a battle against discrimination within the war against
        poverty."'
      n: '[[w.kotz-judgment-days]], 96–97. To check: [[w.king-why-we-cant-wait]], 146 (cited by [[w.kotz-judgment-days]],
        97 n.34). Check: the days. See [[cal.1964-01-18.poverty]]. Names: Martin Luther King.'
      src:
        c: 94affd7d
        rows:
        - 'w.kotz-judgment-days 96–97: all'
      tags:
      - name:king-martin-luther-jr
      - state:nc
- add:
    entry:
      id: cal.1964-01-20.transition-and-staff
      when: Jan. 20
      date: '1964-01-20'
