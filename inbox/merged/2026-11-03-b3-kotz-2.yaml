      when: July 21
      date: '1964-07-21'
      thread: mississippi
      also:
      - king
      c: 'Robert Kennedy to Johnson by telephone, 12:25 p.m., as King leaves for Greenwood: the Highway Patrol refuses to
        protect him; "if he gets killed — uh — it creates all kinds of problems." The FBI to protect him, the order from the
        President, Kennedy''s office having "no dealings with the FBI anymore"; Hoover''s reports "about me plotting the overthrow
        of the government by force and violence."'
      n: '[[w.kotz-judgment-days]], 177. To check: [Johnson and Robert Kennedy, 12:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-21-1964),
