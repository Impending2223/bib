      when: June 23
      date: '1964-06-23'
      thread: mississippi
      c: 'Robert Kennedy to the White House by telephone, after seeing Robert and Carolyn Goodman and Nathan Schwerner: Johnson
        should speak on television "about his concern on this thing. It''s the human element that''s damn important — for
        everything."'
      n: '[[w.kotz-judgment-days]], 163. To check: [Johnson, Jack Valenti and Robert Kennedy, 3:11 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-june-23-1964),
