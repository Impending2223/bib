      date: '1963-12-04'
      thread: civil-rights-bill
      c: The morning after Meany's ride, Johnson stops his limousine for Halleck and takes him to breakfast at the White House.
        Halleck leaves pledging to cooperate with the new President.
      n: '[[w.kotz-judgment-days]], 35. To check: [[w.stern-calculating-visions]], 168 (cited by [[w.kotz-judgment-days]],
