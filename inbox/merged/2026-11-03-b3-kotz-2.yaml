      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      c: Johnson, fearing that Wade, the Dallas district attorney, might rush to a public judgment of Oswald in a Communist
        plot, asks Busby to have Waggoner Carr, the Texas attorney general, take command of the investigation.
      n: '[[w.kotz-judgment-days]], 5. To check: "Warren Commission Born Out of Fear," *Washington Post*, Nov. 14, 1993, A1;
        Busby, interview by Kotz (cited by [[w.kotz-judgment-days]], 5 n.20). Check: the hour. Names: Johnson, Busby, Carr.'
      src:
        c: 80789b86
        rows:
        - 'w.kotz-judgment-days 5: all'
        - 'via w.kotz-judgment-days 5 n.20a: all'
        - 'via w.kotz-judgment-days 5 n.20b: all'
      tags:
