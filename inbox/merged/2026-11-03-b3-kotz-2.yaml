      id: cal.1964-01-12.civil-rights-bill
      when: Jan. 12
      date: '1964-01-12'
      thread: civil-rights-bill
      c: 'Russell, to a reporter: "We would have beaten President Kennedy, but now I won''t predict [the outcome]. ... Now
        it will be three times harder. President Kennedy didn''t have to pass a strong bill to prove anything on civil rights.
        President Johnson does."'
      n: '[[w.kotz-judgment-days]], 97. To check: *New York Times*, Jan. 12, 1964, sec. 4, 3 (cited by [[w.kotz-judgment-days]],
        97 n.35). Check: the day he spoke. Names: Russell.'
