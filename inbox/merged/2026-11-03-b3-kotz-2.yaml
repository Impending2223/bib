      when: June 23
      date: '1964-06-23'
      thread: mississippi
      c: 'Johnson to Lee White by telephone, 12:35 p.m., on the calls from Farmer and from Ryan, coming with the Goodmans
        and Schwerner''s father: "I''m shoving in as much [FBI] as I can. ... I didn''t ask [them] to go, and I can''t control
        the actions of Mississippi people."'
