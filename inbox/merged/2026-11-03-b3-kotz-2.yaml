      id: cal.1964-10-30.elections-1964
      when: Oct. 30
      date: '1964-10-30'
      thread: elections-1964
      also:
      - king
      c: 'Baltimore. King, from a flatbed truck: "To get rid of slums, ghettoes, poverty, unemployment, and segregation, we
        must recognize the power of the ballot — we must take a short walk to the voting booth on Tuesday." With every registered
        Negro voting for one candidate, Johnson would carry every State but Mississippi and Alabama.'
      n: '[[w.kotz-judgment-days]], 227. Check: Kotz''s source (227 nn.90–91). Names: Martin Luther King, Johnson.'
      src:
        c: 49028e3a
        rows:
        - 'w.kotz-judgment-days 227: all'
      tags:
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      - state:md
