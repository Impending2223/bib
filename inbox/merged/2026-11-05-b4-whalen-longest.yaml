        To check: Newsweek, Nov. 4, 1963, 27–28 (cited by [[w.whalen-longest-debate]], 250). See [[cal.1963-10-23.civil-rights-bill]].
        Names: Kennedy, Celler, Senner, Robert Kennedy.'
