      also:
      - civil-rights-bill
      c: 'The Leadership Conference''s lobbyists in Celler''s office, Clarence Mitchell, Rauh, Biemiller, Fauntroy and Aronson
        among them: "a whole loaf." Celler agrees to a strong public accommodations title, a sixth-grade education proof of
        literacy, school districts to begin complying by the year''s end. A participant to Evans and Novak: "they stomped
        Manny."'
      n: '[[w.whalen-longest-debate]], 36. To check: Leadership Conference memo no. 2, Aug. 5, 1963, Library of Congress;
