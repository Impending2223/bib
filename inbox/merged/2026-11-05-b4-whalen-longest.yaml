      date: '1963-09-17'
      thread: civil-rights-bill
      c: 'Subcommittee No. 5, after the Birmingham bombing: Rogers''s amendment, the Attorney General to intervene where a
        public facility is denied; Celler''s Title X, review of removed civil rights cases; Kastenmeier''s Title II reaching
        every business, private schools, law firms and medical associations, rooming houses of five units or fewer excepted.
        McCulloch, his compromise Title II with Justice days old, angry.'
