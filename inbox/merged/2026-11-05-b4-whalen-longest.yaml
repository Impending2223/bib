      c: 'Sunday afternoon, McCulloch''s office: McCulloch and Lindsay, with their aides Copenhaver and Kimball, go through
        the bill title by title and close the gap between them. Lindsay: "I can''t desert him now." A meeting with Katzenbach
        set for the morning, at the Congressional Hotel.'
