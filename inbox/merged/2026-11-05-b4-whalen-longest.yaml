      when: Oct. 28
      date: '1963-10-28'
      thread: civil-rights-bill
      c: '4 p.m., the Cabinet Room: Kennedy reads thirteen of the committee''s Democrats a summary of the compromise, McCulloch
        and Halleck behind it; ten votes needed. Libonati: "No." Edwards will not give way. Chelf to vote the bill out. Rodino
        for a strong FEPC; Kennedy: "we''ll go along." Toll held by Kennedy''s threat to Green to stay away from Philadelphia.
        Corman: "Ok."'
      n: '[[w.whalen-longest-debate]], 59–61. See [[cal.1963-10-28.civil-rights-bill]]. Names: Kennedy, McCulloch, Halleck,
        Libonati, Edwards, Chelf, Rodino, Toll, Green, Corman.'
