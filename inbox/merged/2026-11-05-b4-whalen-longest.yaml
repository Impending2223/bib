      c: 'Aronson, for the Leadership Conference, by telegram to the President, the Attorney General and the Judiciary Committee,
        against softening the subcommittee''s bill: "To weaken the bill at this time would simply encourage civil unrest and
        heighten racial tensions."'
      n: '[[w.whalen-longest-debate]], 46. To check: Aronson''s telegram, Oct. 17, 1963, Leadership Conference Papers, Library
