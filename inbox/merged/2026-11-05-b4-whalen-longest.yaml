      date: '1963-10-24'
      thread: civil-rights-bill
      c: '9:30 a.m., the Yellow Oval Room: Kennedy with the Judiciary Committee''s Northern Democrats, Celler leading, half
        an hour: "We can''t pass the bill in its present form." Senner: "We''re with you." No others. Robert Kennedy after:
        some liberals "in love with death."'
