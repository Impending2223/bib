      when: Oct. 28
      date: '1963-10-28'
      thread: civil-rights-bill
      c: 'The Congressional Hotel, in secret: McCulloch, Katzenbach, Marshall, Copenhaver and Kimball draft the compromise,
        points cleared with Robert Kennedy and the White House by telephone. Halleck''s green light; Moore will not withdraw
        his motion. The 56-page bill typed at Justice and delivered to the members'' homes by midnight.'
      n: '[[w.whalen-longest-debate]], 57–62. To check: Katzenbach, interview by Paige Mulhollan, Nov. 12, 1968, LBJ Library
        (cited by [[w.whalen-longest-debate]], 250). See [[cal.1963-10-27.republican-party-congress]]. Names: McCulloch, Katzenbach,
        Burke Marshall, Robert Kennedy, Halleck, Moore.'
