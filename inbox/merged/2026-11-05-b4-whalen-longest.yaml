      date: 1963-10
      thread: republican-party-congress
      also:
      - civil-rights-bill
      c: 'Marshall and Katzenbach in McCulloch''s office. He will try again, his price a guarantee that Justice make the Democrats
        support any changes. Katzenbach to liberal Democrats: "otherwise you can''t get a civil rights bill." Robert Kennedy
        orders no credit taken: "Congressman McCulloch has done it ... and Congressman Emanuel Celler."'
      n: '[[w.whalen-longest-debate]], 43. Check: the day. To check: Robert Kennedy and Burke Marshall, joint oral history,
        vol. 7, JFK Library; Katzenbach, interview by Paige Mulhollan, Nov. 12, 1968, LBJ Library (cited by [[w.whalen-longest-debate]],
        249). Names: Burke Marshall, Katzenbach, McCulloch, Robert Kennedy, Celler.'
