      date: '1961-03-31'
      thread: opinion
      also:
      - school-aid
      c: 'Gallup, Mar. 10–15: long-term, low-interest loans to Catholic schools for buildings. 42 percent approve, 46 disapprove; Catholics 76 approve, Protestants 34.'
      n: '*The Gallup Poll*, III, 1712 (K–J Cong. II.E).'
    section: mar
