      when: Mar. 12
      date: '1961-03-12'
      thread: opinion
      also:
      - jobs-and-wages
      c: 'Gallup, Feb. 10–15: raising the $1.00 minimum wage, 76 percent for, 18 against. Republicans 63 for.'
      n: '*The Gallup Poll*, III, 1709 (K–J Cong. II.E).'
    section: mar
