patch: gallup-issues
by: Claude (Gallup reader, The Gallup Poll III, 1961–64)
ops:
- add:
    entry:
      id: cal.1961-01-08.opinion
      when: Jan. 8
      date: '1961-01-08'
      thread: opinion
      also:
      - program
      c: 'Gallup, Dec. 8–13, 1960: for the new President and Congress to act on, holding down prices, 63 percent; medical care for the aged, 52; a $1.25 minimum wage, 48; lower taxes, 46; more to end segregation, 46; more school aid, 40; more spending against unemployment, 28.'
      n: '*The Gallup Poll*, III, 1700 (K–J Cong. II.E).'
    section: pro
- add:
    entry:
      id: cal.1961-01-22.opinion
      when: Jan. 22
      date: '1961-01-22'
      thread: opinion
      also:
      - space
      c: 'Gallup, Dec. 8–13, 1960: which country first to send a man into space. Russia 40 percent, the United States 35.'
      n: '*The Gallup Poll*, III, 1702 (K–J Cong. II.E).'
    section: jan
- add:
    entry:
      id: cal.1961-01-27.opinion
      when: Jan. 27
      date: '1961-01-27'
      thread: opinion
      also:
      - berlin-and-vienna
      c: 'Gallup, Jan. 12–17: a Kennedy–Khrushchev summit this year. 54 percent for, 30 against.'
      n: '*The Gallup Poll*, III, 1703 (K–J Cong. II.E). Names: Khrushchev (K–J Adm. III.J).'
      tags:
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
    section: jan
- add:
    entry:
      id: cal.1961-02-01.opinion
      when: Feb. 1
      date: '1961-02-01'
      thread: opinion
      also:
      - peace-corps
      c: 'Gallup, Jan. 12–17: a program sending young men abroad at government expense to give technical help, 71 percent for, 18 against. 66 percent would want a qualified son to go.'
      n: '*The Gallup Poll*, III, 1704 (K–J Cong. II.E).'
    section: feb
- add:
    entry:
      id: cal.1961-02-10.opinion-2
      when: Feb. 10
      date: '1961-02-10'
      thread: opinion
      also:
      - defense
      c: 'Gallup, Jan. 12–17: which country ahead in long-range missiles. The United States 49 percent, Russia 30.'
      n: '*The Gallup Poll*, III, 1705 (K–J Cong. II.E).'
    section: feb
- add:
    entry:
      id: cal.1961-02-12.opinion
      when: Feb. 12
      date: '1961-02-12'
      thread: opinion
      also:
      - desegregation-schools
      - desegregation-public-places
      c: 'Gallup, Jan. 12–17, in the South: will whites and Negroes one day share the same schools, restaurants, and public accommodations? 76 percent yes, 19 no.'
      n: '*The Gallup Poll*, III, 1705 (K–J Cong. II.E).'
    section: feb
- add:
    entry:
      id: cal.1961-02-26.opinion
      when: Feb. 26
      date: '1961-02-26'
      thread: opinion
      also:
      - transition-and-staff
      c: 'Gallup, Feb. 10–15, on "ask what you can do for your country": 63 percent can think of something they could do, 37 cannot.'
      n: '*The Gallup Poll*, III, 1707 (K–J Cong. II.E).'
      tags:
      - name:kennedy-john-f
    section: feb
- add:
    entry:
