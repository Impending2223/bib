      date: '1961-06-14'
      thread: opinion
      also:
      - press-and-broadcasting
      c: 'Gallup, May 17–22: greater curbs on what newspapers print, 31 percent approve, 55 disapprove. On television and radio programs, 49 approve, 39 disapprove; violence the thing most would control.'
      n: '*The Gallup Poll*, III, 1722 (K–J Cong. II.E).'
    section: jun
