      - school-aid
      c: 'Gallup, Mar. 10–15: federal school aid to public schools only, 57 percent; to Catholic and other private schools as well, 36. Catholics 66 for private schools too.'
      n: '*The Gallup Poll*, III, 1712 (K–J Cong. II.E).'
    section: mar
- add:
    entry:
