      when: May 5
      date: '1961-05-05'
      thread: opinion
      also:
      - cuba
      c: 'Gallup, Apr. 28–May 3: Kennedy''s handling of Cuba, 61 percent approve, 15 disapprove. 44 percent follow the news from Cuba a great deal.'
      n: '*The Gallup Poll*, III, 1717 (K–J Cong. II.E).'
      tags:
      - name:kennedy-john-f
    section: may
