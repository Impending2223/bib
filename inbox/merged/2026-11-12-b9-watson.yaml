patch: 2026-11-12-b9-watson
by: Claude (batch 9, Watson, Into the Missile Age; the "already in" rows), Nov. 11, 2026; audited (Opus), Nov. 11, 2026
ops:
- add:
    entry:
      id: cal.1960-05-07.soviet-union-u2-4
      when: May 7
      date: '1960-05-07'
      thread: soviet-union-u2
      c: 'Gates, angered by the day''s statement, which implies the flight an underling''s doing, telephones Herter: someone must assume responsibility. Herter: the principal objective is to keep the President clear.'
      n: '[[w.watson-into-the-missile-age]], 721 (the call, after Gates read "the CIA statement of 7 May"; the day of the call not given). To check: [[w.beschloss-mayday]], 251–52 (cited by [[w.watson-into-the-missile-age]], 721 n.172). See [[cal.1960-05-05.soviet-union]]. Names: Gates, Herter. Check: the day.'
      tags:
      - name:gates-thomas-s-jr
      - name:herter-christian-a
- add:
    entry:
      id: cal.1960-05-08.soviet-union-u2
      when: May 8
      date: '1960-05-08'
      thread: soviet-union-u2
      c: 'Washington. Members of Congress ask why the flight was made so near the summit; calls for a full congressional investigation. Reston, in the *New York Times*: "This was a sad and perplexed capital tonight, caught in a swirl of charges of clumsy administration, bad judgment and bad faith."'
      n: '[[w.watson-into-the-missile-age]], 721 (no member named). To check: [*New York Times*, May 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/05/09/issue.html) (cited by [[w.watson-into-the-missile-age]], 721 n.173). See [[cal.1960-05-07.soviet-union-u2]]. Names: Reston.'
      tags:
      - name:reston-james
- add:
    entry:
      id: cal.1960-05-10.soviet-union-u2-2
      when: May 10
      date: '1960-05-10'
      thread: soviet-union-u2
      c: The Soviet Government officially threatens retaliation against any repetition of the overflights.
      n: '[[w.watson-into-the-missile-age]], 722 (not the form of the threat or who made it). To check: *New York Times*, May 10, 11, 13, 1960 (cited by [[w.watson-into-the-missile-age]], 722 n.177). See [[cal.1960-05-09.soviet-union]].'
      tags:
      - polity:ussr
- add:
    entry:
      id: cal.1960-05-12.soviet-union-u2-2
      when: May 12
      date: '1960-05-12'
      thread: soviet-union-u2
      c: 'The United States answers the Soviet threat of May 10: no aggressive intent behind the flights.'
      n: '[[w.watson-into-the-missile-age]], 722 ("two days later"; not the form of the reply or who made it). To check: *New York Times*, May 10, 11, 13, 1960 (cited by [[w.watson-into-the-missile-age]], 722 n.177). See [[cal.1960-05-10.soviet-union-u2-2]].'
      tags:
      - polity:us
      - polity:ussr
- add:
    entry:
      id: cal.1960-07-01.elections-1960-rockefeller
      when: July 1
      date: '1960-07-01'
      thread: elections-1960-rockefeller
      also: [defense]
      c: 'Cabinet. Gates: his staff''s tentative figures put Rockefeller''s defense proposals closer to $10 billion. Eisenhower: Congress, in its present mood, would probably prefer the larger figure.'
      n: '[[w.watson-into-the-missile-age]], 769 (Rockefeller''s own estimate $3 billion). To check: handwritten notes of the Cabinet meeting, July 1, 1960, C-55 (2), Box 5, Cabinet ser., OSS files, WHO, DDEL (cited by [[w.watson-into-the-missile-age]], 769 n.171). See [[cal.1960-06-08.elections-1960]]. Names: Gates, Rockefeller, Eisenhower.'
      tags:
      - name:gates-thomas-s-jr
      - name:rockefeller-nelson
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-11-09.economy
      when: Nov. 9
      date: '1960-11-09'
      thread: economy
      c: 'Eisenhower with Anderson, Dillon, Gates, Stans, Martin and others, on the gold. Anderson: the stock $18,116 million, $218 million to go out Thursday, "almost a gold panic." Steps to take alone: fewer dependents abroad, fewer troops, no foreign goods at the exchanges, aid loans tied to American goods. Gates: the military not to be singled out; Eisenhower: no intention of it. Anderson to head a group.'
      n: '[FRUS 1958–60, IV, doc. 57](https://history.state.gov/historicaldocuments/frus1958-60v04/d57) (Goodpaster, memorandum of conference with the President, drafted Nov. 14; present Anderson, Dillon, Baird, Gates, Douglas, Lemnitzer, Stans, Martin, Paarlberg, Persons, Kendall, Goodpaster). Made public: FRUS 1958–60, IV (1992). [[w.watson-into-the-missile-age]], 749 (the meeting at the White House on the balance of payments; the talk of overseas dependents; Gates''s assurance from the president that the military would not be turned into "second class citizens"; not the gold, Anderson''s other steps or the group). To check: Memo of conf with Pres (Goodpaster), Nov. 9, 1960, Staff Notes Nov 60, Box 54, DDED ser, PP (AWF), DDEL (cited by [[w.watson-into-the-missile-age]], 749 n.88). Names: Eisenhower, Anderson, Dillon, Gates, Stans, Martin.'
      tags:
      - name:eisenhower-dwight-d
      - name:anderson-robert-b
      - name:dillon-c-douglas
      - name:gates-thomas-s-jr
      - name:stans-maurice-h
      - name:martin-william-mcchesney-jr
- add:
    entry:
      id: cal.1960-11-15.economy
      when: Nov. 15
      date: '1960-11-15'
      thread: economy
      c: 'Augusta, Ga. Eisenhower with Anderson, Gates and others; Goodpaster reads the draft directive on the balance of payments, and it is revised. Gates: 500,000 dependents abroad; Anderson: a goal of 200,000, a cut of 60 percent. Gates fears the services'' fuss and Kennedy''s use of the issue; Eisenhower: morale will be all right with proper leadership. State''s embassies to be cut too. Anderson to ask Adenauer $650 million a year; the directive out Wednesday.'
      n: '[FRUS 1958–60, IV, doc. 58](https://history.state.gov/historicaldocuments/frus1958-60v04/d58) (John S. D. Eisenhower, memorandum of conference with the President; present Anderson, Gates, Lennartson, von Klemperer, Gen. George Brown, Hagerty, Goodpaster, John Eisenhower). Made public: FRUS 1958–60, IV (1992). [[w.watson-into-the-missile-age]], 749 (the meeting of Nov. 15: the directive drafted by Goodpaster approved; the reduction of the estimated 500,000 military dependents; Gates on retention and enlistment, 60 percent; Eisenhower on service and "not personal gain"; not Augusta, State, Adenauer or the date of release). To check: Memo of conf with Pres (J. S. D. Eisenhower), Nov. 15, 1960, Staff Notes Nov 60, Box 54, DDED ser, PP (AWF), DDEL (cited by [[w.watson-into-the-missile-age]], 749 n.89). See [[cal.1960-11-09.economy]]; [[cal.1960-11-13.economy]]. Names: Eisenhower, Anderson, Gates, Goodpaster, Kennedy, Adenauer.'
      tags:
      - name:eisenhower-dwight-d
      - name:anderson-robert-b
      - name:gates-thomas-s-jr
      - name:goodpaster-andrew-j
      - name:kennedy-john-f
      - name:adenauer-konrad
      - state:ga
- add:
    entry:
      id: cal.1960-12-09.transition-and-staff-2
      when: Dec. 9
      date: '1960-12-09'
      thread: transition-and-staff
      also: [defense]
      c: Gates and McNamara meet for an hour.
      n: '[[w.watson-into-the-missile-age]], 771. To check: Gates to the Assistant to the President, Jan. 17, 1961, Reading and Speech Files—Gates, Box 32, OSD Admin Sec files, Acc 65-B3078; Gates, interview, July 16, 1962, 6–7, Columbia University Oral History (cited by [[w.watson-into-the-missile-age]], 771 n.183). See [[cal.1960-12-08.transition-and-staff-cabinet]]. Names: Gates, McNamara.'
      tags:
      - name:gates-thomas-s-jr
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1960-12-21.transition-and-staff-2
      when: Dec. 21
      date: '1960-12-21'
      thread: transition-and-staff
      also: [defense]
      c: Gates and McNamara meet a second time.
      n: '[[w.watson-into-the-missile-age]], 771. To check: Gates to the Assistant to the President, Jan. 17, 1961; Gates, interview, July 16, 1962, 6–7 (cited by [[w.watson-into-the-missile-age]], 771 n.183). See [[cal.1960-12-09.transition-and-staff-2]]. Names: Gates, McNamara.'
      tags:
      - name:gates-thomas-s-jr
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1961-01-02.laos-2
      when: Jan. 2
      date: '1961-01-02'
      thread: laos
      c: The Defense Department announces "normal precautionary actions" to raise the readiness of forces in the Pacific.
      n: '[[w.watson-into-the-missile-age]], 655 (the announcement; the United States had called for a meeting of the SEATO Council; not the forces or the hour). To check: *New York Times*, Jan. 1, 2, 3, 1961 (cited by [[w.watson-into-the-missile-age]], 655 n.151). See [[cal.1961-01-02.laos]].'
      tags: []
- add:
    entry:
      id: cal.1961-01-04.laos-2
      when: Jan. 4
      date: '1961-01-04'
      thread: laos
      c: 'The SEATO Council meets on Laos: it affirms the goal of a peaceful solution and expresses readiness to fulfill the alliance''s obligations.'
      n: '[[w.watson-into-the-missile-age]], 655 (the Council "met on 4 January"; not the place, the delegates or the text). To check: *New York Times*, Jan. 5, 11, 12, 1961 (cited by [[w.watson-into-the-missile-age]], 655 n.153). See [[cal.1961-01-02.laos-2]].'
      tags: []
- add:
    entry:
      id: cal.1961-01-04.laos-3
      when: Jan. 4
      date: '1961-01-04'
      thread: laos
      c: 'After the SEATO Council''s meeting, its secretary general, Pote Sarasin of Thailand, says publicly there is no proof that North Vietnamese troops have intervened in Laos.'
      n: '[[w.watson-into-the-missile-age]], 655. To check: *New York Times*, Jan. 5, 11, 12, 1961 (cited by [[w.watson-into-the-missile-age]], 655 n.153). See [[cal.1961-01-04.laos-2]].'
      tags: []
- add:
    entry:
      id: cal.1961-01-07.laos-3
      when: Jan. 7
      date: '1961-01-07'
      thread: laos
      c: 'The Joint Chiefs, after a "high-level conference" that day, authorize CINCPAC to use U.S. military aircraft, if need be, to airlift supplies into Laos, covert aircraft preferred. Armed T-6s authorized in Laos, no bombs: first against the Communist airlift, then troops, dumps and other military targets.'
      n: '[[w.watson-into-the-missile-age]], 655 (the "high-level conference" held that date). To check: JCS 988337 and 988339 to CINCPAC, Jan. 7, 1961, OSD Hist; *New York Times*, Jan. 13, 1961 (cited by [[w.watson-into-the-missile-age]], 655 n.154). See [[cal.1961-01-05.laos]].'
      tags: []
