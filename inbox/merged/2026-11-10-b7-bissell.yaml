- add:
    entry:
      id: cal.1960-08-18.congo-lumumba
      when: Aug. 18
      date: '1960-08-18'
      thread: congo-lumumba
      c: 'The CIA''s station at Léopoldville to headquarters, telegram 0772: "Embassy and Station believe Congo experiencing classic Communist effort take over government"; "there may be little time left in which take action to avoid another Cuba or Guinea." Its plan: help the Congolese organize an opposition and replace Lumumba with a pro-Western government. Ambassador Timberlake approves it (0775).'
      n: '[FRUS 1964–68, XXIII, doc. 10](https://history.state.gov/historicaldocuments/frus1964-68v23/d10) (the editorial note, quoting telegram 0772). [S. Rep. No. 94-465, 14–15 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=25) (the telegram, "another Cuba"; the plan "replacing Lumumba with pro Western Group"). [[w.bissell-reflections-of-a-cold]], 143–44 (the telegram, "In August"). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-08-18.congo-2]]. Names: Lumumba.'
      src:
        c: 'e25ca45c'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v23/d10: all'
        - 'via x.1960-08-18.leopoldville-station-telegram-0772: all'
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=25: A-C'
        - 'w.bissell-reflections-of-a-cold 143–44: A-B'
        - 'via w.bissell-reflections-of-a-cold 144 n.3a: A-B'
      tags: [name:lumumba-patrice]
- add:
    entry:
      id: cal.1960-08-19.congo-lumumba
      when: Aug. 19
      date: '1960-08-19'
      thread: congo-lumumba
      c: 'CIA headquarters to the station at Léopoldville, telegram 46115: "You are authorized proceed with operation," that of telegram 0772, provided the ambassador still agrees. Bissell signs it.'
      n: '[FRUS 1964–68, XXIII, doc. 10](https://history.state.gov/historicaldocuments/frus1964-68v23/d10) (the editorial note). [S. Rep. No. 94-465, 15 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=26) (the words; Bissell''s signature). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-08-18.congo-lumumba]]. Names: Bissell.'
      src:
        c: '579e82cf'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v23/d10: A'
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=26: all'
      tags: [name:bissell-richard-m-jr]
- add:
    entry:
      id: cal.1961-02-08.laos
      when: Feb. 8
      date: '1961-02-08'
      thread: laos
      c: 'The White House, 2:45 to 3:45 p.m., on Laos: Kennedy, Rusk, McNamara, Lemnitzer, Allen Dulles, Nitze, Rostow, Bissell, Bohlen, Parsons. Lemnitzer on Phoumi''s offensive, begun Feb. 6, to retake the Plaine des Jarres. C-130s authorized to carry supplies as far as Udon, Thailand; nine more training teams, 72 men, authorized. Kennedy against a SEATO force in Thailand for now. Bissell, later, of a meeting early in February: the Chiefs'' plan had the Plaine des Jarres seized by parachute troops about the tenth day; he found the briefing "almost surreal."'
      n: '[FRUS 1961–63, XXIV, doc. 14](https://history.state.gov/historicaldocuments/frus1961-63v24/d14). [[w.bissell-reflections-of-a-cold]], 147 (the plan briefed by Lemnitzer; the parachute troops; "almost surreal"). Check: that Bissell''s meeting is this one. See [[cal.1961-01-23.laos]]; [[cal.1961-01.laos]]. Names: Kennedy, Rusk, McNamara, Lemnitzer, Allen Dulles, Nitze, Rostow, Bissell, Bohlen, Parsons, Phoumi.'
      src:
        c: 'cc3a2e0d'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d14: A-E'
        - 'w.bissell-reflections-of-a-cold 147: B, F-G'
      tags: [name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:lemnitzer-lyman-l, name:dulles-allen-w, name:nitze-paul, name:rostow-walt-w, name:bissell-richard-m-jr, name:bohlen-charles-e, name:parsons-j-graham, name:phoumi-nosavan]
