      when: July 25–28
      date: '1960-07-25'
      thread: elections-1960
      also:
      - republican-party
      c: 'Chicago, the convention, by Nixon''s account. His Chicago supporters propose a mass picketing of the Merchandise
        Mart, Joseph Kennedy''s and Shriver''s, for hiring Negroes at the most menial levels only. Nixon refuses: he is running
        against Kennedy, not his father and brother-in-law.'
      n: '[[w.nixon-six-crises]], 421. Names: Nixon, Joseph Kennedy, Shriver. Check: the day.'
      tags:
