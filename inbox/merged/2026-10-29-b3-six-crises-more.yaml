      when: Sept.
      date: 1960-09
      thread: elections-1960
      c: 'Early in the fall. Billy Graham tells Nixon''s staff that he has written for *Life* an article endorsing Nixon,
        on his experience in world affairs, religion no issue, and will not release it without Nixon''s leave. Nixon vetoes
        it: the other side would call it bigotry.'
      n: '[[w.nixon-six-crises]], 365 (by Nixon''s account). Names: Graham, Nixon. Check: the day.'
      tags:
