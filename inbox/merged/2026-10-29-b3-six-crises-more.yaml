      c: Grand Forks, N.D., at noon; a cold caught on the flight to Peoria, Ill., and a rally at Bradley University's field
        house. St. Louis after eleven, 5,000 at the airport; work on the Machinists speech. At 3:30 a.m. a fever over 103,
        by Dr. Lungren's reading.
      n: 'Remarks of Vice President Richard M. Nixon, University of North Dakota Field House, Grand Forks, ND, [APP](https://www.presidency.ucsb.edu/documents/remarks-vice-president-richard-m-nixon-university-north-dakota-field-house-grand-forks-nd);
