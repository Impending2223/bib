      date: '1960-07-11'
      thread: elections-1960
      c: 'Camp David, through the Democratic convention, by Nixon''s account. Nixon at work on the first draft of his acceptance
        speech; of Los Angeles he watches only part of Church''s keynote. July 14, Rogers with him for the night: the two,
        hearing Johnson named, agree that the ticket is the strongest the Democrats could field.'
      n: '[[w.nixon-six-crises]], 312. See [[cal.1960-07-11.elections-1960]]. Names: Nixon, Church, Rogers, Johnson.'
