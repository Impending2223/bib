- add:
    entry:
      id: cal.1960-09-25.elections-1960-3
      when: Sept. 25–26
      date: '1960-09-25'
      thread: elections-1960
      c: Chicago. Met at the airport Sunday night by some 5,000, then street rallies in five wards on the way to the Pick-Congress,
