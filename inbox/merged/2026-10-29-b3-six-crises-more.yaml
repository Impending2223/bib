      c: 'Through the autumn, by the file Nixon''s staff shows him on Nov. 2. Stevenson wonders aloud why nobody makes an
        issue of Nixon''s Quaker faith; Hodges at Charlottesville, Va.: "if you vote for a Quaker this time, you will live
        to regret it horribly"; Jackson accuses Nixon of "conniving" with anti-Catholics; Representative Diggs in Detroit;
        Powell: "the Klan is riding again"; COPE''s pamphlet, "liberty vs. bigotry"; the Kennedy-Johnson Labor Committee''s
        leaflet.'
      n: '[[w.nixon-six-crises]], 365–66 (by Nixon''s account; the quotations his). See [[cal.1960-11-02.elections-1960-3]].
        Names: Stevenson, Hodges, Jackson, Diggs, Powell, Nixon. Check: each day and place.'
