      when: Dec. 3
      date: '1963-12-03'
      thread: legislatures
      also:
      - state-constitutions
      c: 'Iowa rejects the Shaff plan, 272,382 to 190,424, at a special election: a Senate of 58 by population, a House of 99, one to a county. The federal court, May 3, had held the apportionment of 1904 and 1928 invidiously discriminatory and let the election go ahead; Judge McManus would have enjoined it. Jan. 14, 1964, the court orders a special session to reapportion before the 1964 elections.'
      n: '*Davis v. Synhorst*, [217 F. Supp. 492](https://static.case.law/f-supp/217/html/0492-01.html) (S.D. Iowa 1963); [225 F. Supp. 689](https://static.case.law/f-supp/225/html/0689-01.html) (S.D. Iowa 1964). [*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 113–115. [[w.dixon-democratic-representation]]; [[w.larew-party-reborn]]. See [[cal.1962-03-26.court]]. Names: McManus (K–J Cong. III.K).'
      tags:
      - state:ia
      - name:mcmanus-edward-j
