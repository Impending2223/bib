- add:
    entry:
      id: cal.1962-11-06.governors-mn
      when: Nov. 6–Dec. 19
      date: '1962-11-06'
      thread: governors
      also:
      - elections-1962
      c: 'Minnesota, governor. The counties'' first returns: Rolvaag (DFL) 619,704, Governor Andersen (R) 619,646. Ten county boards reconvene and amend their returns. The State Canvassing Board deadlocks, Nov. 26; ordered by the Supreme Court to count the amended returns, it declares Andersen elected, Nov. 29: Andersen 619,722, Rolvaag 619,580. Rolvaag asks a recount, Dec. 3; three district judges named to try it; the hand count begins Dec. 19.'
      n: '[*Report of the State Canvassing Board, General Election, November 6, 1962*](https://www.lrl.mn.gov/docs/2023/Other/232070/1962.pdf), preface and the statement on the ten counties. *Rolvaag v. Donovan*, [264 Minn. 257](https://static.case.law/minn/264/html/0257-01.html), 119 N.W.2d 1 (1962) (the order of Nov. 28; opinion filed Dec. 11). Iric Nathanson, ["Gubernatorial Election Recount, 1962"](https://www.mnopedia.org/event/gubernatorial-election-recount-1962), *MNopedia*. [[w.stinnett-recount]]; [[w.andersen-mans-reach]]. See [[cal.1962-11-06.governors]]. Names: Andersen (K–J Cong. III.F).'
      tags:
      - state:mn
      - name:rolvaag-karl-f
      - name:andersen-elmer-l
- add:
    entry:
      id: cal.1963-03-15.governors-mn
      when: Mar. 15–25
      date: '1963-03-15'
      thread: governors
      also:
      - elections-1962
      c: Minnesota. The three judges find Rolvaag ahead by 91 votes, 619,842 to 619,751, Mar. 15, and order him declared elected, Mar. 21. Andersen waives appeal, Mar. 23. Rolvaag sworn in, Mar. 25, 139 days after the election; Andersen governor through the legislative session's first months.
      n: 'Nathanson, ["Gubernatorial Election Recount, 1962"](https://www.mnopedia.org/event/gubernatorial-election-recount-1962), *MNopedia*; final figures, [Wikipedia, "1962 Minnesota gubernatorial election"](https://en.wikipedia.org/wiki/1962_Minnesota_gubernatorial_election), from the Minnesota Historical Election Archive (Check: the Canvassing Board''s supplementary report on the recount). See [[cal.1962-11-06.governors-mn]]. Names: Andersen (K–J Cong. III.F).'
      tags:
      - state:mn
      - name:rolvaag-karl-f
      - name:andersen-elmer-l
- add:
    entry:
