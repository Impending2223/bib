      - state:mn
- add:
    entry:
      id: cal.1964-12-04.legislatures-mn
      when: Dec. 4
      date: '1964-12-04'
      thread: legislatures
      c: Minnesota. A three-judge federal court, Circuit Judge Blackmun writing, holds the legislative districts of 1959 unconstitutional, on a suit of voters of the four Twin Cities counties; the 1965 legislature to reapportion.
      n: '*Honsey v. Donovan*, [236 F. Supp. 8](https://static.case.law/f-supp/236/html/0008-01.html) (D. Minn. 1964). Paul Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993), *MNopedia*. [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]. Names: Blackmun (Cong. III.J).'
      tags:
      - state:mn
      - name:blackmun-harry-a
- add:
    entry:
      id: cal.1965-05-24.legislatures-mn
      when: May 24–Nov. 26
      date: '1965-05-24'
      thread: legislatures
      c: 'Minnesota. Rolvaag vetoes the legislature''s reapportionment, Senate File 102, May 24, the day it adjourns. Legislators sue: a reapportionment needs no governor. Nov. 26, the Supreme Court, 4–3, upholds the veto.'
      n: '*Duxbury v. Donovan*, [272 Minn. 424](https://static.case.law/minn/272/html/0424-01.html), 138 N.W.2d 692 (1965). Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993). See [[cal.1964-12-04.legislatures-mn]].'
      tags:
      - state:mn
      - name:rolvaag-karl-f
- add:
    entry:
      id: cal.1966-01-14.legislatures-mn
      when: Jan. 14–May 24
      date: '1966-01-14'
      thread: legislatures
      c: 'Minnesota. The federal court declines to draw the districts, Jan. 14: the governor and legislature "should do so." Rolvaag calls a special session; he vetoes its bill of May 9; a third bill passes May 20 and he approves it, May 24.'
      n: '*Honsey v. Donovan*, [249 F. Supp. 987](https://static.case.law/f-supp/249/html/0987-01.html) (D. Minn. 1966). Laws 1966, Ex. Sess., ch. 1. Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993) (Check: the Legislative Reference Library gives the approval as May 20). See [[cal.1964-12-04.legislatures-mn]].'
      tags:
      - state:mn
      - name:rolvaag-karl-f
