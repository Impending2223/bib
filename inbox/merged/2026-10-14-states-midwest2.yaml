    entry:
      id: cal.1965-01-11.legislatures-ia
      when: Jan. 11–June 10
      date: '1965-01-11'
      thread: legislatures
      c: 'Iowa''s 61st General Assembly, Democratic for the first time in thirty years: Senate 34–25, House 101–23. Feb. 12, the federal court holds its make-up void for future elections; the Assembly adopts a new temporary plan, Senate 61. The death penalty abolished; a civil rights commission created; withholding of the income tax; nine constitutional amendments proposed, annual sessions, home rule and four-year terms for governor among them. The longest session in the State''s history, 145 days.'
      n: '[*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 107–110, 116. *Davis v. Cameron*, [238 F. Supp. 462](https://static.case.law/f-supp/238/html/0462-01.html) (S.D. Iowa 1965). [[w.larew-party-reborn]]; [[w.hughes-man-from-ida-grove]]. See [[cal.1964-02-24.legislatures-ia]].'
      tags:
      - state:ia
