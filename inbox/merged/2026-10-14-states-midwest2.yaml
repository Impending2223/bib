    entry:
      id: cal.1964-05-18.desegregation-schools-milwaukee
      when: May 18
      date: '1964-05-18'
      thread: desegregation-schools
      c: Milwaukee. The Milwaukee United School Integration Committee, Barbee its chairman, keeps about 11,000 Negro children out of the public schools for a day; about 8,500 at its freedom schools. The school board had refused to call its schools segregated.
      n: 'Figures: University of Wisconsin–Milwaukee, [*March on Milwaukee*](https://uwm.edu/marchonmilwaukee/wp-json/wp/v2/cpt-keyterms/173), from the Barbee papers. [Wikipedia, "Lloyd Barbee"](https://en.wikipedia.org/wiki/Lloyd_Barbee). [[w.jones-selma-of-the-north]]; [[w.dougherty-more-than-one-struggle]]. Names: Barbee (K–J Cong. III.K).'
      tags:
      - state:wi
      - city:milwaukee
      - name:barbee-lloyd
