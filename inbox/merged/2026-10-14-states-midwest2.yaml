      when: Feb. 24–Apr. 8
      date: '1964-02-24'
      thread: legislatures
      c: Iowa's legislature in extraordinary session, called by Hughes. A temporary plan, House 124, Senate 59, signed Mar. 23; 44.02 percent of the people to elect a majority of the House, 38.9 of the Senate. A permanent plan proposed as an amendment, a Senate whose majority 36 percent could elect. The federal court accepts the temporary plan as interim, Mar. 27.
      n: '[*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 111–112, 115. *Davis v. Synhorst*, [231 F. Supp. 540](https://static.case.law/f-supp/231/html/0540-01.html) (S.D. Iowa 1964). See [[cal.1963-12-03.legislatures-ia]]. Names: Hughes (K–J Cong. III.F).'
