      c: Milwaukee. Groppi and the NAACP Youth Council picket the Fraternal Order of Eagles, which admits only whites, and the homes of judges and officials who belong to it. On and off into 1967.
      n: '[Wikipedia, "James Groppi"](https://en.wikipedia.org/wiki/James_Groppi) (Check: the month the pickets began). [[w.jones-selma-of-the-north]]. Names: Groppi (K–J Cong. III.K).'
      tags:
      - state:wi
      - city:milwaukee
      - name:groppi-james
