    entry:
      id: cal.1965-10-18.desegregation-schools-milwaukee
      when: Oct. 18
      date: '1965-10-18'
      thread: desegregation-schools
      c: Milwaukee. The second boycott of the schools by the Integration Committee, of several days; thousands of children at its freedom schools. Groppi, of St. Boniface parish, among its organizers.
      n: '[*March on Milwaukee*](https://uwm.edu/marchonmilwaukee/wp-json/wp/v2/cpt-keyterms/173) (Check: the days; the Milwaukee Neighborhood News Service timeline gives Oct. 18–22). [Wikipedia, "James Groppi"](https://en.wikipedia.org/wiki/James_Groppi). See [[cal.1964-05-18.desegregation-schools-milwaukee]]. Names: Groppi (K–J Cong. III.K).'
      tags:
      - state:wi
      - city:milwaukee
      - name:groppi-james
- add:
    entry:
      id: cal.1965-12-09.open-housing-wi
      when: Dec. 9
      date: '1965-12-09'
      thread: open-housing
      c: 'Wisconsin''s open housing law signed by Knowles: no discrimination by race, color, religion or national origin in the sale, rental or lease of housing as a business; one-family homes lived in by their owners, and owner-occupied buildings of four units or fewer, exempt. The fair employment division becomes the equal opportunities division. Laws of 1965, ch. 439 (Assembly Bill 852); published Dec. 18.'
      n: '[Laws of 1965, ch. 439](https://docs.legis.wisconsin.gov/1965/related/acts/439.pdf). Date of signing: Milwaukee Public Library, ["200 Nights That Shook Milwaukee"](https://mpl.org/blog/now/200-nights-that-shook-milwaukee-the-1967-1968-open-housing-marches) (Check). [[w.jones-selma-of-the-north]]. Names: Knowles (K–J Cong. III.F).'
      tags:
      - state:wi
      - name:knowles-warren-p
