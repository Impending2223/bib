- add:
    entry:
      id: cal.1964-02-28.legislatures-wi
      when: Feb. 28–May 14
      date: '1964-02-28'
      thread: legislatures
      c: 'Wisconsin Supreme Court, *State ex rel. Reynolds v. Zimmerman*: the legislature may not apportion itself by joint resolution, without the governor; Joint Resolution No. 49 invalid. The Rosenberry plan of 1961, assembly districts from 221.3 to 49.7 of the norm, unconstitutional. Legislature and governor given to May 1. May 14, none enacted, the court issues its own districts for the 1964 elections.'
      n: '*State ex rel. Reynolds v. Zimmerman*, [22 Wis. 2d 544](https://static.case.law/wis-2d/22/html/0544-01.html), 126 N.W.2d 551 (1964); [23 Wis. 2d 606](https://static.case.law/wis-2d/23/html/0606-01.html) (1964). [[w.dixon-democratic-representation]]; [[w.thompson-history-of-wisconsin-volume]]. See [[cal.1962-03-26.court]]. Names: Reynolds (K–J Cong. III.F).'
      tags:
      - state:wi
      - name:reynolds-john-w-jr
