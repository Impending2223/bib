patch: 2026-11-11-b8-ball
by: 'Claude (batch 8: Ball, The Past Has Another Pattern, the "already in" rows read by the card), Nov. 11, 2026'
ops:
- add:
    entry:
      id: cal.1961-04.cuba-3
      when: Apr.
      date: '1961-04'
      thread: cuba
      c: Bowles, the Under Secretary of State, lets it be known in public that he had advised against the Bay of Pigs venture.
      n: '[[w.ball-past-has-another-pattern]], 170 (after the failure, by Ball''s account; not the day, the means or the hearers). Check: the day and the month; Ball has only "When the Bay of Pigs failed". See [[cal.1961-03-31.cuba-2]]. Names: Bowles.'
      tags:
      - name:bowles-chester
- add:
    entry:
      id: cal.1965-04-25.latin-america-dominican-republic-2
      when: Apr. 25
      date: '1965-04-25'
      thread: latin-america-dominican-republic
      c: State instructs the embassy to advise authorities on both sides of the conflict that it plans to evacuate Americans and others wishing to leave, and requests a cease-fire for that purpose.
      n: '[[w.ball-past-has-another-pattern]], 328 (Ball: "we had instructed the embassy"). See [[cal.1965-04-25.latin-america-dominican-republic]].'
- add:
    entry:
      id: cal.1965-04-26.latin-america-dominican-republic-2
      when: Apr. 26
      date: '1965-04-26'
      thread: latin-america-dominican-republic
      c: The embassy asks American civilians to assemble the next day at the Embajador Hotel as a staging point for evacuation.
      n: '[[w.ball-past-has-another-pattern]], 328. See [[cal.1965-04-25.latin-america-dominican-republic-2]].'
- add:
    entry:
      id: cal.1965-04-28.latin-america-dominican-republic-3
      when: Apr. 28
      date: '1965-04-28'
      thread: latin-america-dominican-republic
      c: Ball, for the balance of the day, calls the Latin American ambassadors to advise them of an immediate meeting of the Organization of American States.
      n: '[[w.ball-past-has-another-pattern]], 328. See [[cal.1965-04-28.latin-america]]. Names: Ball.'
      tags:
      - name:ball-george-w
- cite:
    id: cal.1960-07-13.elections-1960
    item: '[[w.ball-past-has-another-pattern]], 159 (McCarthy''s nominating speech for Stevenson, "inspired", and the protracted demonstration when Stevenson came to the convention floor; Ball gives no day; not the count)'
    units: '?'
- cite:
    id: cal.1961-01-20.transition-and-staff
    item: '[[w.ball-past-has-another-pattern]], 180 (the inaugural address heard from the steps of the Capitol, in twenty-degree weather, by Ball and his wife; Ball''s quotations from it; not the cabinet)'
    units: '?'
- cite:
    id: cal.1960-06-30.congo
    item: '[[w.ball-past-has-another-pattern]], 226–27 (June 30, 1960, the independence "formally celebrated," a spectator stealing King Baudouin''s sword; the government formed June 23, Lumumba Prime Minister, Kasavubu President; not the speeches, the American delegation or Tshombe)'
    units: 'B'
- cite:
    id: cal.1960-07-10.congo
    item: '[[w.ball-past-has-another-pattern]], 227 (the Belgian government sends in paratroopers in July 1960, after the Congolese troops depose their Belgian officers, to protect its 90,000 citizens; no day)'
    units: '?'
- cite:
    id: cal.1960-07-11.congo
    item: '[[w.ball-past-has-another-pattern]], 227 (Tshombe announces an independent Katanga; Ball gives no day)'
    units: '?'
- cite:
    id: cal.1960-07-13.congo
    item: '[[w.ball-past-has-another-pattern]], 227 (the Security Council''s resolution, July 13, 1960, calling on Belgium to withdraw and authorizing the Secretary-General to give military assistance; Hammarskjöld approves a UN force; not the vote or the abstentions)'
    units: '?'
- cite:
    id: cal.1960-08-01.congo
    item: '[[w.ball-past-has-another-pattern]], 228 (Aug. 3, 1960, Hammarskjöld announces that UN troops will enter Katanga Aug. 8, cancelling the order when Tshombe refuses entry; not the Soviet statement)'
    units: '?'
- check:
    id: cal.1960-08-01.congo
    text: 'Check: Ball, 228, has Hammarskjöld announce on Aug. 3 that UN troops would enter Katanga on Aug. 8, and cancel the order when Tshombe refused entry; the entry has Aug. 2 and Aug. 6.'
- cite:
    id: cal.1960-08-12.congo
    item: '[[w.ball-past-has-another-pattern]], 228 (Hammarskjöld, deciding to visit Katanga, talks with Tshombe in a private interview; Tshombe agrees to the UN force''s entry; Ball gives no day and says no one can say what passed)'
    units: '?'
- cite:
    id: cal.1960-09-05.congo
    item: '[[w.ball-past-has-another-pattern]], 228 (Kasavubu dismisses Lumumba as Prime Minister; Ball gives no day, nor Ileo)'
    units: '?'
- cite:
    id: cal.1960-09-14.congo
    item: '[[w.ball-past-has-another-pattern]], 228 (Colonel Mobutu takes temporary control and expels the diplomatic representatives of the Soviet Union and Czechoslovakia; Ball gives no day, nor the parliament)'
    units: '?'
- cite:
    id: cal.1961-02-13.congo
    item: '[[w.ball-past-has-another-pattern]], 228 (Feb. 13, 1961, the Katangese authorities confirm the killing of Lumumba; not the Security Council)'
    units: 'A'
- cite:
    id: cal.1961-01-17.congo
    item: '[[w.ball-past-has-another-pattern]], 228 (Kasavubu turns Lumumba over to Tshombe; Ball gives no day, nor the killing that night)'
    units: '?'
- cite:
    id: cal.1961-02-15.congo
    item: '[[w.ball-past-has-another-pattern]], 229 (Kennedy''s warning that America would "defend the Charter of the United Nations by opposing any attempt by any government to intervene unilaterally in the Congo"; Ball dates it Feb. 25, 1961, citing Stebbins; not the opening statement''s wording)'
    units: '?'
- check:
    id: cal.1961-02-15.congo
    text: 'Check: Ball, 229, has the President''s warning on Feb. 25, 1961, "as one of his first acts," quoted "defend the Charter of the United Nations by opposing any attempt by any government to intervene unilaterally in the Congo" (n.6: Stebbins, *The United States in World Affairs, 1961*, 254); the entry has the news conference of Feb. 15.'
- cite:
    id: cal.1963-08-28.africa
    item: '[[w.ball-past-has-another-pattern]], 275 (Kennedy asks Ball for in-depth conversations with Salazar and Ayub Khan, "in the early fall of 1963"; the grievances of Portugal and Pakistan; not the day of leaving)'
    units: '?'
- check:
    id: cal.1963-08-28.africa
    text: 'Check: Ball, 275, has Kennedy ask him for the talks with Salazar and Ayub "in the early fall of 1963"; Ball left Aug. 28.'
- cite:
    id: cal.1962-12-20.latin-america
    item: '[[w.ball-past-has-another-pattern]], 327 (the election of Dec. 19, 1962, a two-to-one victory for Bosch, to everyone''s surprise; Ball has Dec. 19)'
    units: '?'
- cite:
    id: cal.1965-04-24.latin-america
    item: '[[w.ball-past-has-another-pattern]], 327 (April 1965, a small group of young colonels captures the army chief of staff and launches a golpe; the national radio seized; Wessin''s counter-revolution; no day; not Bosch''s Dominican Revolutionary Party or Reid Cabral)'
    units: '?'
- cite:
    id: cal.1965-04-28.latin-america
    item: '[[w.ball-past-has-another-pattern]], 328 (Wednesday, April 28: the government radio announces a new junta under Colonel Benoit, who asks Bennett for twelve hundred marines; Bennett first demurs; then his "critic" message, "American lives are in danger," "the time has come," reaches Johnson in the retreat off the Oval Office with Rusk, McNamara, Bundy, Moyers and Ball, talking of Vietnam; four hundred marines ashore within hours; not the 8:40 p.m. statement)'
    units: '?'
- cite:
    id: cal.1965-04-28.latin-america-dominican-republic-2
    item: '[[w.ball-past-has-another-pattern]], 328 (7:30 p.m., the Cabinet Room: Ball with the Congressional leadership, who "expressed their full assent with what we had done"; not the speakers or the questions)'
    units: '?'
- cite:
    id: cal.1965-04-30.latin-america
    item: '[[w.ball-past-has-another-pattern]], 329 (John Bartlow Martin, Kennedy''s ambassador, flown to Santo Domingo to work with Bennett and give the President an independent judgment; friendly with some rebels, he tries unsuccessfully to bring both sides together; Ball gives no day)'
    units: '?'
- cite:
    id: cal.1965-05-15.latin-america
    item: '[[w.ball-past-has-another-pattern]], 329 (Fortas''s secret mission to Puerto Rico, a friend of Governor Muñoz Marín, Bosch''s adviser; telephone calls from "Mr. Davidson"; not the day, Bundy or Vance)'
    units: '?'
- cite:
    id: cal.1965-05-16.latin-america
    item: '[[w.ball-past-has-another-pattern]], 329 (Bundy, Tom Mann, Vance and Jack Hood Vaughn also go to Santo Domingo; Ball gives no day)'
    units: '?'
- cite:
    id: cal.1965-06-01.latin-america
    item: '[[w.ball-past-has-another-pattern]], 329 (a special OAS committee of three, Bunker among them; not the day, the other members or the Marines)'
    units: '?'
- cite:
    id: cal.1965-06-18.latin-america
    item: '[[w.ball-past-has-another-pattern]], 329 (in June, the OAS''s three-man committee, Bunker among them, in Santo Domingo, its declaration urging free elections, general amnesty and a provisional government; not the day, the six to nine months or the arms)'
    units: '?'
- cite:
    id: cal.1966-06-01.latin-america
    item: '[[w.ball-past-has-another-pattern]], 329 (elections held June 1, 1966, a solution Ball credits almost wholly to Bunker; not the result)'
    units: '?'
- cite:
    id: cal.1961-01-19.laos
    item: '[[w.ball-past-has-another-pattern]], 361 (Eisenhower tells Kennedy "just before the inauguration" that Laos is the key to Southeast Asia, "unbelievable pressure" on Thailand, Cambodia and South Vietnam; "as a last desperate hope, to intervene unilaterally," n.2; not the day or the place)'
    units: 'B'
- cite:
    id: cal.1960-08-09.laos
    item: '[[w.ball-past-has-another-pattern]], 362 (Kong Le, a young paratroop captain, seizes power and asks Souvanna to form a neutralist government; Ball gives no day)'
    units: '?'
- cite:
    id: cal.1960-09-10.laos
    item: '[[w.ball-past-has-another-pattern]], 362 (Phoumi takes the Royal Laotian Army to Savannakhet in September 1960, proclaims a new government and denounces Souvanna; not Boun Oum or the day)'
    units: '?'
- cite:
    id: cal.1960-12-13.laos
    item: '[[w.ball-past-has-another-pattern]], 362 (December, shortly after the American elections, Phoumi marches on Vientiane; Kong Le, with a huge store of American supplies, joins the Pathet Lao; Ball has Kong Le join the Pathet Lao, the entry has him withdraw north)'
    units: '?'
- cite:
    id: cal.1960-12-08.laos
    item: '[[w.ball-past-has-another-pattern]], 362 (after Phoumi''s march on Vientiane in December, Souvanna flees to Cambodia; no day; not Kouprasith''s coup or the howitzers)'
    units: '?'
- cite:
    id: cal.1961-03-23.laos
    item: '[[w.ball-past-has-another-pattern]], 363 (the Seventh Fleet into the South China Sea, combat troops in Okinawa alerted, five hundred marines with helicopters into Thailand, as Kennedy''s warning to the Soviets; Ball gives no day and puts them before the Bay of Pigs)'
    units: '?'
- cite:
    id: cal.1963-05-08.vietnam
    item: '[[w.ball-past-has-another-pattern]], 370 (in May, a demonstration at which Vietnamese soldiers kill nine Buddhists; no day; the entry has eight by the consul''s first count)'
    units: '?'
- cite:
    id: cal.1963-06-11.vietnam
    item: '[[w.ball-past-has-another-pattern]], 370 (Quang Duc pours gasoline over his head and burns himself to death on a crowded Saigon street, other bonzes in a circle around him; no day; not the photograph)'
    units: '?'
- cite:
    id: cal.1963-08-21.vietnam
    item: '[[w.ball-past-has-another-pattern]], 370 (in August, Nhu engineers a midnight raid on the Buddhist pagodas; no day)'
    units: '?'
- cite:
    id: cal.1966-09-21.transition-and-staff
    item: '[[w.ball-past-has-another-pattern]], 432 (Ball resigns in September 1966, "quietly," not leaving over a principle; his reasons for not leaving earlier; not the letter or the day)'
    units: '?'
