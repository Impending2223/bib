      id: cal.1962-01.europe-and-the-alliance
      when: Jan.
      date: 1962-01
      thread: europe-and-the-alliance
      c: 'Luncheon, by Schlesinger''s account. Kennedy wonders aloud to Julian Amery, the British Minister of Aviation, whether Skybolt will ever work. Amery: the basis of British nuclear defense; anything happening to it could have far-reaching effects on Anglo-American relations. Kennedy: the United States doing everything possible to make it succeed. The Air Force takes Amery to Douglas Aircraft; he returns to London satisfied.'
      n: '[[w.schlesinger-thousand-days-1965]], 858. Check: the day ("One day in January 1962"). Names: Kennedy.'
      src:
        c: 76a9ae40
        rows:
        - 'w.schlesinger-thousand-days-1965 858: all'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-01-12.testing
      when: Jan. 12
      date: '1962-01-12'
      thread: testing
      also:
      - europe-and-the-alliance
      c: 'Bundy and Schlesinger in Rusk''s office over State''s draft of the President''s reply to Macmillan''s letter on testing, Christmas Island and a disarmament conference. Rusk: no perfunctory answer; it must affirm a concern equal to Macmillan''s, reject any link between Christmas Island and a new disarmament initiative, and offer an initiative of our own. Bundy then drafts the reply: "We are ready to examine with you the possibilities for new efforts toward disarmament on the most urgent basis."'
      n: '[[w.schlesinger-thousand-days-1965]], 493–94 (Schlesinger''s account; Bundy''s draft undated). Names: Bundy, Schlesinger, Rusk, Macmillan.'
      src:
        c: 062923bf
        rows:
        - 'w.schlesinger-thousand-days-1965 493–94: all'
      tags:
      - name:bundy-mcgeorge
      - name:schlesinger-arthur-m-jr
      - name:rusk-dean
      - name:macmillan-harold
- add:
    entry:
      id: cal.1962-08-01.latin-america-peru
      when: Aug. 1
      date: '1962-08-01'
      thread: latin-america-peru
      c: 'Kennedy to Schlesinger, by Schlesinger''s account, on Peru: the statement against the coup not regretted ("Certainly not"); but neither the Latin American governments, preparing to recognize the junta, nor the Peruvians, by the failed general strike, have given the support hoped for. His concern: prestige staked on reversing what cannot be reversed. The problem now: to show the condemnation has moved the junta to changes enough to resume relations.'
      n: '[[w.schlesinger-thousand-days-1965]], 787. See [[cal.1962-07-18.latin-america]]. Names: Kennedy, Schlesinger.'
      src:
        c: 28b42c78
        rows:
        - 'w.schlesinger-thousand-days-1965 787: all'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1962-09-13.cuba-2
      when: Sept. 13
      date: '1962-09-13'
      thread: cuba
      c: 'Schlesinger to Kennedy, by his own account, on the Soviet arms in Cuba: relatively a hard-liner; the State Department should tell the Soviet Ambassador, coldly and toughly, that persistence in arming Cuba would bring a larger defense budget and a surge of national indignation coloring every other issue between the two countries.'
      n: '[[w.schlesinger-thousand-days-1965]], 799–800 (and, at Bundy''s staff meeting, undated, the question put to him: "OK, but how far would you carry it if they keep on doing what you object to?"). Names: Schlesinger, Kennedy.'
      src:
        c: 5aaafdbe
        rows:
        - 'w.schlesinger-thousand-days-1965 799–800: all'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-11-06.europe-and-the-alliance
      when: Nov. 6
      date: '1962-11-06'
      thread: europe-and-the-alliance
      c: 'Election night, Schlesinger''s house. William R. Hawthorne of Cambridge, a close associate of Zuckerman''s, takes Schlesinger aside on Skybolt: deep concern over difficulties between the two countries; the importance of the United States taking the initiative in devising a substitute.'
      n: '[[w.schlesinger-thousand-days-1965]], 858–59 (Schlesinger''s account). The decision: [[cal.1962-11-07.europe-and-the-alliance]]. Names: Schlesinger.'
      src:
        c: c76d3b1c
        rows:
        - 'w.schlesinger-thousand-days-1965 858–59: all'
      tags:
      - name:schlesinger-arthur-m-jr
- add:
