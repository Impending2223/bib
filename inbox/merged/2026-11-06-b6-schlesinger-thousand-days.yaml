      id: cal.1961-12-15.latin-america-dominican-republic
      when: Dec. 15
      date: '1961-12-15'
      thread: latin-america-dominican-republic
      c: 'San Juan, La Fortaleza, the evening. Kennedy, stopping in Puerto Rico on his way to Venezuela, with Goodwin, Woodward, Bowles, Hill and Morales-Carrión on the Dominican Republic: a personal appeal to Balaguer and Rodríguez Echavarría.'
      n: '[[w.schlesinger-thousand-days-1965]], 772. Names: Kennedy, Goodwin, Woodward, Bowles, Morales-Carrión, Balaguer.'
