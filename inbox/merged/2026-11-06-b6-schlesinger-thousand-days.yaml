      id: cal.1960-10-13.elections-1960-kennedy-2
      when: Oct. 13
      date: '1960-10-13'
      thread: elections-1960-kennedy
      c: 'The Carlyle, lunch, by Schlesinger''s account: Kennedy with Sorensen, Galbraith and Schlesinger, a little nervous about Quemoy and Matsu, the talk mostly on that. In the elevator: "Do you realize the responsibility I carry? I''m the only person standing between Nixon and the White House."'
      n: '[[w.schlesinger-thousand-days-1965]], 71–72. See [[cal.1960-10-12.elections-1960-3]]. Names: Kennedy, Sorensen, Galbraith, Schlesinger, Nixon.'
      src:
