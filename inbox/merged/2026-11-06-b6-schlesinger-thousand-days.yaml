      id: cal.1963-07-28.testing
      when: July 28
      date: '1963-07-28'
      thread: testing
      c: 'Harriman, back from Moscow, goes straight to Hyannis Port. Kennedy: "Well, this is a good job." In Washington his Georgetown neighbors march with torches and candles to his house on P Street, singing; he thanks them from the steps.'
      n: '[[w.schlesinger-thousand-days-1965]], 909. Check: the day of Hyannis Port (Schlesinger: "On his return"; in Washington July 28). Names: Harriman, Kennedy.'
