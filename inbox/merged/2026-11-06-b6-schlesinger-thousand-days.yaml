      id: cal.1963-07-11.vietnam-saigon
      when: July 11
      date: '1963-07-11'
      thread: vietnam-saigon
      c: 'Nolting back in Saigon, for a last try at the policy of support for Diệm. By Schlesinger''s account: the Buddhists unappeasable; American pressure, above all a public disavowal, would only incite Diệm to repression or his opponents to a coup; separating Diệm from the Nhus "would be like separating Siamese twins."'
      n: '[[w.schlesinger-thousand-days-1965]], 989. Names: Nolting, Ngô Đình Diệm.'
      src:
        c: 1f09b16f
        rows:
        - 'w.schlesinger-thousand-days-1965 989: all'
      tags:
      - name:nolting-frederick-e-jr
      - name:ngo-dinh-diem
      - place:saigon
