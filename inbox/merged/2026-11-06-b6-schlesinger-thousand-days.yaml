    entry:
      id: cal.1960-10-11.elections-1960-kennedy
      when: Oct. 11
      date: '1960-10-11'
      thread: elections-1960-kennedy
      c: 'New York, the Carlyle, lunch, by Schlesinger''s account. Kennedy to Schlesinger on his staff: the senatorial group resists expansion and suspects every new face; the friction between Sorensen and Cox regretted; "Ted is indispensable to me." Galbraith and Schlesinger might be sent for later, with Nixon''s "party of Galbraith and Schlesinger and Bowles" to be weighed. Anything for him to go through Jacqueline Kennedy.'
      n: '[[w.schlesinger-thousand-days-1965]], 70. Names: John F. Kennedy, Schlesinger, Sorensen, Cox, Galbraith, Nixon, Bowles, Jacqueline Kennedy.'
