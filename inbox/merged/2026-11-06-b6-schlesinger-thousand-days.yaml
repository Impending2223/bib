- add:
    entry:
      id: cal.1960-10-20.elections-1960-kennedy
      when: Oct. 20
      date: '1960-10-20'
      thread: elections-1960-kennedy
      also:
      - cuba
      c: 'New York, by Schlesinger''s account. Kennedy to Schlesinger: things going well, "everything made" except the religious issue; concern about Cuba, Nixon making inroads among suburban Catholics; any measures against Castro to be taken with the other American republics. Of the Al Smith dinner, later: "when the chips are down, money counts more than religion."'
      n: '[[w.schlesinger-thousand-days-1965]], 72. See [[cal.1960-10-19.elections-1960]]. Names: Kennedy, Schlesinger, Nixon, Castro.'
      src:
        c: 5c3b71d0
        rows:
        - 'w.schlesinger-thousand-days-1965 72: all'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:nixon-richard-m
      - name:castro-fidel
      - city:nyc
      - state:ny
- add:
