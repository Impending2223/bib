      when: Oct. 19
      date: '1960-10-19'
      thread: elections-1960-kennedy
      also:
      - cuba
      c: 'The evening. Goodwin writes a statement on Cuba for Kennedy and shows it to Sorensen and Salinger: an answer to Nixon on Kennedy''s "softness." Kennedy gone to bed; they release it without his seeing it, by Schlesinger''s account the only time in the campaign. Kennedy later: he would have changed "fighters for freedom" to "forces of freedom."'
      n: '[[w.schlesinger-thousand-days-1965]], 72–73. To check: [[w.goodwin-remembering-america]]. The statement: [[cal.1960-10-20.cuba]]. Names: Goodwin, Kennedy, Sorensen, Salinger, Nixon.'
      src:
