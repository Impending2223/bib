      id: cal.1961-04-10.cuba-bay-of-pigs
      when: Apr. 10–13
      date: '1961-04-10'
      thread: cuba-bay-of-pigs
      c: The brigade begins to move by truck from the Guatemalan base to Puerto Cabezas, Nicaragua, the point of embarkation. By Apr. 13 the men begin to board the boats.
      n: '[[w.schlesinger-thousand-days-1965]], 269.'
      src:
        c: e074b261
        rows:
        - 'w.schlesinger-thousand-days-1965 269: all'
- add:
    entry:
      id: cal.1961-04-14.cuba-bay-of-pigs
      when: Apr. 14
      date: '1961-04-14'
      thread: cuba-bay-of-pigs
      c: 'Puerto Cabezas. The American advisers disclose the invasion plan to the brigade: three beaches along forty miles of shore in the Bay of Pigs area; paratroops inland to hold the roads across the swamps; Castro''s air force neutralized in advance; the beach held three days. Late afternoon, Luis Somoza at the dock: "Bring me a couple of hairs from Castro''s beard." The flotilla of seven small ships sails for Cuba.'
      n: '[[w.schlesinger-thousand-days-1965]], 269. To check: [[w.johnson-bay-of-pigs]], 83, the chief adviser''s words (cited by [[w.schlesinger-thousand-days-1965]], 269 n.*). Names: Castro.'
      src:
        c: fa8af241
        rows:
        - 'w.schlesinger-thousand-days-1965 269: all'
      tags:
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-05-03.cuba-bay-of-pigs
      when: May 3
      date: '1961-05-03'
      thread: cuba-bay-of-pigs
      also:
      - laos
      - opinion
      c: 'Kennedy to Schlesinger, back from Europe, by Schlesinger''s account: as a British prime minister he would have been thrown out; here failure has increased his charm. Evelyn Lincoln brings an advance on the Gallup poll, 82 percent behind the administration: "It''s just like Eisenhower. The worse I do, the more popular I get." Waving Lemnitzer''s cables from Laos: "If it hadn''t been for Cuba, we might be about to intervene in Laos. I might have taken this advice seriously."'
      n: '[[w.schlesinger-thousand-days-1965]], 292, 339. Names: Kennedy, Schlesinger, Lincoln, Eisenhower, Lemnitzer.'
      src:
        c: bb2cc52a
        rows:
        - 'w.schlesinger-thousand-days-1965 292: A-C'
        - 'w.schlesinger-thousand-days-1965 339: D'
      tags:
