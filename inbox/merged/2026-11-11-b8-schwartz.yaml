patch: 2026-11-11-b8-schwartz
by: 'Claude (batch 8: Schwartz, Lyndon Johnson and Europe, the "already in" rows read against the calendar), Nov. 11, 2026'
ops:
- cite:
    id: cal.1962-07-04.europe-and-the-alliance
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 9 (Kennedy''s "Declaration of Interdependence" speech of July 4, 1962, the "Grand Design" and "a true partnership" with Europe; not Independence Hall or a uniting Europe, n.1)'
    units: '?'
- cite:
    id: cal.1963-06-23.europe-and-the-alliance
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 9 (Kennedy''s European trip of June 1963; not Cologne, Bonn, Adenauer or the joint statement)'
    units: A
- cite:
    id: cal.1962-12-18.europe-and-the-alliance
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 11 (Kennedy''s decision of December 1962 to supply the British with Polaris; not Nassau, Skybolt or the NATO force; n.12 on the approach to the French)'
    units: '?'
- cite:
    id: cal.1964-09-07.elections-1964
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 19 (Johnson to a Detroit audience in September 1964 on the nuclear exchange, n.44 dating it Sept. 7, Pub. Papers 1049–52; the passage "Modern weapons are not like any other," not the Cadillac Square quotation)'
    units: '?'
- cite:
    id: cal.1964-09-07.elections-1964
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 43 (the "Daisy" ad, a girl picking the petals from a daisy, a nuclear countdown, a bomb; not the night, the network or its showing once)'
    units: '?'
- cite:
    id: cal.1964-02-12.europe-and-the-alliance
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 21 (Douglas-Home''s visit of February 1964: "the Americans [were] as anxious as we to promote a further relaxation of international tension," n.50, his telegram of Feb. 23; not the White House, the days or Zanzibar)'
    units: '?'
- cite:
    id: cal.1964-10-15.soviet-union
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 26 (Khrushchev deposed in October 1964; Brezhnev, called "party chairman," and Kosygin, "Premier," his successors; not the day, the Black Sea, the Central Committee or the Dobrynin visit)'
    units: '?'
- cite:
    id: cal.1964-04-20.testing
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 41 (the speech''s multilateral-force line, "nations that wish to participate," where the Pub. Papers have "which desire"; Schwartz''s "to newspaper editors": Johnson spoke to the editors Apr. 17 and to the AP, "their bosses," Apr. 20; not the uranium cuts, Khrushchev or Douglas-Home)'
    units: '?'
- cite:
    id: cal.1964-10-16.testing
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 43 (the Chinese nuclear test of October 1964; not the day, the place or the hour; Johnson''s warning against "the fearful possibility of nuclear spread" is not in the entry)'
    units: '?'
- check:
    id: cal.1964-10-16.testing
    text: 'Check: Schwartz, 43, says the test led Johnson to warn against "the fearful possibility of nuclear spread"; n.149 cites *Time*, Sept. 25, 1964, 17, which is before the test.'
- cite:
    id: cal.1962-05-04.europe-and-the-alliance
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 52 (the meeting of the NATO council at Athens in May 1962, where consultative arrangements on nuclear planning were discussed with "little response"; not McNamara, the guidelines agreed or NSAM 147)'
    units: A
- cite:
    id: cal.1965-06-23.robert-kennedy
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 55 (his maiden speech to the Senate, June 23, 1965, ignoring Vietnam, a strong plea for a nonproliferation treaty and a criticism, indirect, of Johnson for not doing "all we can"; not the quotation, the gallery or the Senators)'
    units: '?'
- cite:
    id: cal.1965-04-07.vietnam
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 88 (the Southeast Asian Development Program, "the heart of an April 1965 speech at Johns Hopkins University"; not the billion dollars, the Mekong or Black)'
    units: '?'
- cite:
    id: cal.1966-01-28.european-community
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 95–96 (after de Gaulle''s reelection in January 1966 the French boycott ended with the Luxembourg Compromise, a member state to invoke unanimity if its vital interests were at stake; not the day, the Six''s foreign ministers or the Commission)'
    units: '?'
- cite:
    id: cal.1966-10-10.soviet-union
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 137–38 (Gromyko with Johnson in early October 1966, an agreement on a nonproliferation treaty very close; Johnson that the President would never give up his veto over the power of decision to fire nuclear weapons, n.153, FRUS 1964–68, XI, 387; Rusk the same day; not the hour, "in two weeks" or the law)'
    units: '?'
- cite:
    id: cal.1966-09-01.vietnam
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 141 (de Gaulle''s speech at Phnom Penh, September 1966, n.3 dating it Sept. 1: American policy "more and more threatening for the peace of the world"; not the entry''s quotations or the replies)'
    units: '?'
- cite:
    id: cal.1968-01-17.program
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 198 (the State of the Union address of Jan. 17, 1968, calling for legislation lifting the gold cover; not the hour, the other requests or the quotations)'
    units: L
- cite:
    id: cal.1968-03-16.economy-gold
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 202–03 (the Washington meeting of the gold pool countries over the weekend, Carli''s two-tier market: central banks supplied at $35, governments not to buy gold for official purposes and sell it on the private market, more support for sterling; not the seven, the governors, the day or the $4 billion)'
    units: '?'
- cite:
    id: cal.1967-09-18.defense
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 207 (in mid-September 1967 the decision to proceed with a limited ABM system, Chinese threat in the 1970s, McNamara''s speech announcing it; not San Francisco, the Minuteman sites, the cost or the heavy defense)'
    units: '?'
- cite:
    id: cal.1968-07-01.testing
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 209 (the signing set for July 1; not the three capitals, the East Room, the signers, the terms, the announcement or Rusk to Dobrynin)'
    units: '?'
- cite:
    id: cal.1969-01-14.program
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 223 (the last State of the Union address, in person, January 1969, closing "I believe it will be said that we tried"; not the day or the entry''s "At least" line)'
    units: '?'
- cite:
    id: cal.1968-01-16.europe-and-the-alliance
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 233 (an accelerated British withdrawal east of the Suez announced in January 1968; not the day, the Commons, the end of 1971 or the F-111)'
    units: '?'
