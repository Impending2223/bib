    item: '[[w.schwartz-lyndon-johnson-and-europe]], 9 (the "dramatic Berlin speech" and the "huge and enthusiastic crowds"; the U.S. mission in Berlin: "a great day"; not Brandt, Adenauer, the wall, the words or the Free University)'
    units: '?'
