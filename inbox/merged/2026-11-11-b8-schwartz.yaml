    id: cal.1968-06-27.testing-missile-talks
    item: '[[w.schwartz-lyndon-johnson-and-europe]], 209 (on Johnson''s renewed appeal, Kosygin agrees in late June to a joint announcement at the treaty''s signing that talks "on limitation and reduction of offensive strategic nuclear weapons delivery systems as well as systems of defense against ballistic missiles" would begin in the "nearest future"; not the day or Gromyko)'
    units: '?'
