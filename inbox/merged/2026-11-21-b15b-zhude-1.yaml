        time_band: morning
        time_zone: Asia/Shanghai
        place: maanchang
        thread: china-leadership
        c: 'Ma''anchang 马鞍场. Zhu De 朱德 sees the old sites of the two private schools of his childhood, the Yaopu 药铺垭 school and Xi Pinsan''s 席聘三 school, and comforts Xi Pinsan''s descendants; sees his old homes at Dawan 大塆 and his parents'' at Bolinzui 柏林嘴, and calls on kin and commune members. At Dawan he hears the people on the public mess halls 公共食堂 and asks after the sugar and oil for new mothers. At Bolinzui, finding a room of exhibits on his old home, to the local committee: no exhibition of me; make it a school, now.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1767. The words: 上午; 随后 (1767). Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@D-F']
