  - cite: {id: cal.1961-01-14.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1792 (Jan. 14–18, 1961; Zhu De 朱德 at the Ninth Plenum of the Eighth Central Committee 中共八届九中全会, the Huairen Tang 怀仁堂, Zhongnanhai 中南海: the line of "readjustment, consolidation, filling out and raising standards" 调整、巩固、充实、提高; the plan in the order agriculture, light industry, heavy industry; Deng Xiaoping''s report on the Moscow conference and Li Fuchun''s on the 1960 plan and the main targets of 1961; the "Twelve Articles" to be carried through in the villages)'}
  - cite: {id: cal.1961-01-18.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1792 (Jan. 18, 1961; Zhu De 朱德 speaks to the plenary session: the plan in the order agriculture, light, heavy, good, to be pressed; farming needs land opened and water works; railways and shipping, backward, to be developed, freeing labor from carrying for farming and light industry. Mao Zedong''s 毛泽东 summing up: investigation and study, start from the facts, 1961 a year of "investigation and study, seeking truth from facts")'}
