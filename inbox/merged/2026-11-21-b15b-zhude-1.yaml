        thread: china-leadership
        c: 'Zhu De 朱德 back at Nanchong 南充. He talks with the Nanchong prefectural committee 中共南充地委: agriculture the foundation of the economy; communes and the technical reform of farming; tilling and carrying still by hand and on the shoulder; the bitter life gone but the improvement only a beginning; in the hills, grow what suits the ground; schools, theaters and cinemas to grow with output.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1768. The words: 下午 (1768). Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@B-G']
