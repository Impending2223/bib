  - add:
      entry:
        id: cal.1960-06-11.china-leadership-3
        when: June 11
        date: '1960-06-11'
        thread: china-leadership
        also: [china]
        c: 'Zhu De 朱德 to Liu Shaoqi 刘少奇, by letter, four proposals on the grain shortage: grow more sweet potatoes, maize, sorghum and other high-yield crops, and melons and vegetables in place of grain; deep-rooted crops such as sugar beet in the cold lands of Xinjiang 新疆, Qinghai 青海, Inner Mongolia 内蒙古 and the Northeast 东北, much new land opened there, small sugar mills, the tops and pulp to feed stock; more sugarcane in the south, sugar standing in for grain; coarse grain eaten with fine; short-haul transport to bring out the grain stuck in "dead corners" 死角粮. The letter is printed and given out as a paper of the meeting.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1777–1778. Made public: 2016. Names: Zhu De, Liu Shaoqi.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:liu-shaoqi', 'vis:only:prc']
