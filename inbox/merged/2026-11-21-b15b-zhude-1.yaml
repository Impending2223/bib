  - add:
      entry:
        id: cal.1960-01-12.china-leadership-7
        when: Jan. 12
        date: '1960-01-12'
        thread: china-leadership
        c: 'Zhu De 朱德 to the Center 中共中央 and Mao Zedong 毛泽东, by letter: beekeeping 养蜂事业 should be developed. Its direct return alone beats ordinary farming''s, and it raises farm output, a way to more crops beyond the "eight-character charter" 八字宪法; honey a food and a medicine.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1760–1761. Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
