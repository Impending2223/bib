        place: yilong
        thread: china-leadership
        c: 'Yilong 仪陇. Zhu De 朱德 hears the Yilong county committee 中共仪陇县委: the hills hold forests, bamboo, mountain goods and herbs; mulberry, tung oil, white wax and orchards; open up the mountain''s wealth, all lines of farming and local products, to get through the present temporary difficulties 暂时困难 and support the state''s construction; do things honestly, care for the people''s livelihood, consult them.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1767–1768. Made public: 2016. Names: Zhu De.'
