  - add:
      entry:
        id: cal.1961-02-08.china-leadership-10
        when: Feb. 8
        date: '1961-02-08'
        thread: china-leadership
        c: 'Zhu De 朱德 inspects western Fujian 闽西. Passing the Wuyi Mountains 武夷山, he recalls the Red Army''s 红军 attack on Ganzhou 赣州 in the spring of 1932: Wang Ming''s 王明 "left" opportunism pressed the wrong line of attacking central cities, and Ganzhou was not taken; Mao Zedong 毛泽东 proposed pushing into the Fujian–Zhejiang–Jiangxi region toward Zhejiang, was not heeded, and the forces were scattered, until Mao took Zhangzhou 漳州. The same day he writes the poem "Thoughts on passing western Fujian" 《经闽西感怀》.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1796. Made public: 2016. Names: Zhu De, Mao Zedong. Check: the day: the *Zhu De nianpu* prints this trip under Feb. 9, 1961, after that day''s items, as "the day before" (昨日), when it has Zhu De at the Gutian reservoir.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc@B-C']
