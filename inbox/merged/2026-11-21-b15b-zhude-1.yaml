      entry:
        id: cal.1961-01-30.china-leadership-9
        when: Jan. 30
        date: '1961-01-30'
        thread: china-leadership
        also: [china]
        c: 'Zhu De 朱德 to the Center 中共中央 and Mao Zedong 毛泽东, a report on Shanghai 上海 and Hangzhou 杭州: Shanghai''s industry "not fed enough," the textile mills at 50 percent of capacity and over 30 percent of light industry''s idle; domestic raw materials cannot fill it soon; "import to feed export" 以进养出, raw materials in, finished and semi-finished goods out, with five gains (exports, industry, foreign exchange, revenue, the home market); any industry so placed may follow Shanghai, best with deferred payment. Zhejiang''s 浙江 silkworm brigades contract with their teams for output, value, work points and cost, with a bonus for excess ("four contracts and one reward" 四包一奖); where peasants make their own silk floss, cocoons beyond the state''s quota split thirty to the state, seventy to the members; there contracts go smoothly and quotas rise 10 to 12 percent on last year.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1794. Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
