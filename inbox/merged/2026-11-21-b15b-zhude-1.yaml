        c: 'Peking 北京, the enlarged Military Commission 中共中央军委扩大会议. Zhu De 朱德 speaks: our army, led by the Party, has political work for its lifeline; arm it with Marxism–Leninism and Mao Zedong Thought and the spirit of hard struggle; no money, no fear of hardship or death, officers and men as one, the army helping the people produce in peace and the people helping it fight in war, the good tradition that carried us from victory to victory; the army must resolve to arm itself with the frontier technology 尖端技术, and with sound politics and advanced arms will be invincible and keep the imperialists from invading.'
