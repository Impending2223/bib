      id: cal.1968-07-19.crime-and-hijacking-guns-3
      when: July 19–24
      date: '1968-07-19'
      thread: crime-and-hijacking-guns
      c: 'The House on the gun bill, in committee of the whole. Latta''s amendment, a buyer whose gun is lost, stolen or broken in another State may buy another there on affidavit, adopted by teller vote, 111–69.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1939. Check: the day; CQ gives the four days of debate. See [[cal.1968-07-24.crime-and-hijacking]]. Names: Latta.'
      src:
