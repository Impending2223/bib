- add:
    entry:
      id: cal.1968-07-19.crime-and-hijacking-guns-4
      when: July 19–24
      date: '1968-07-19'
      thread: crime-and-hijacking-guns
      c: 'The House on the gun bill, in committee of the whole, on MacGregor''s amendment for unlimited sales of rifle, shotgun and .22 rimfire ammunition, offered after his first was beaten by teller vote, 90–99. Told that Robert Kennedy was killed with a .22 rimfire bullet, MacGregor: legislation cannot "eliminate the tragic incidents of homicide."'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1940. Check: the day; CQ gives the four days of debate. See [[cal.1968-07-24.crime-and-hijacking]]. Names: MacGregor, Robert Kennedy.'
      src:
        c: 702d7a62
        rows:
        - 'w.cq-weekly-report July 26, 1968, 1940: all'
      tags:
      - 'name:macgregor-clark'
      - 'name:kennedy-robert-f'
- add:
