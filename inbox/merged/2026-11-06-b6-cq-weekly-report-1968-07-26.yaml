      when: July 19–24
      date: '1968-07-19'
      thread: crime-and-hijacking-guns
      c: 'The House on the gun bill, H.R. 17735, in committee of the whole. Dingell''s amendment, a $10 license for "collectors" to buy from and sell to one another across State lines, adopted by teller vote, 99–56.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1939. Check: the day; CQ gives the four days of debate. See [[cal.1968-07-24.crime-and-hijacking]]. Names: Dingell.'
