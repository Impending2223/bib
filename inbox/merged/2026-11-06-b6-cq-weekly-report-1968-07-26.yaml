      id: cal.1968-07-01.congress
      when: July 1
      date: '1968-07-01'
      thread: congress
      c: 'J. Edward Day, Kennedy''s Postmaster General, becomes director of legislative and Post Office activities for the Associated Third Class Mail Users, in place of Harry Maginnis, in a bitter dispute with Monroney over third-class rates in 1967.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1975. Names: Day, Monroney.'
      src:
