      id: cal.1961-09-06.desegregation-schools
      when: Sept. 6
      date: '1961-09-06'
      thread: desegregation-schools
      also:
      - civil-rights-organizations
      c: 'Chicago, Operation Transfer. 160 parents refused the transfers they ask; the schools'' names kept from the press.
        CORE sends the Board of Education seven pages of schools said to have unused classrooms: drop the neighborhood school
        policy for "fuller use of the school plant, racial integration, and equal opportunity." Raymond Pasnick, of the board:
        he has waited eighteen months for the same figures.'
      n: '[[w.anderson-confronting-the-color-line]], 84. To check: Chicago Daily Defender, 8 September 1961 (cited by [[w.anderson-confronting-the-color-line]],
        84 n.29); Chicago Daily Defender, 8 September 1961 (cited by [[w.anderson-confronting-the-color-line]], 84 n.30).
        See [[cal.1961-08-30.desegregation-schools]].'
      src:
