      c: 'Springfield, Ill. The Illinois House passes the Armstrong Act, amending the School Code: school boards to avoid
        segregation in siting new schools and to rectify de facto segregation in drawing attendance zones. In force in June;
        the Chicago board to publish racial head counts.'
      n: '[[w.anderson-confronting-the-color-line]], 107. Check: the day; the session law. To check: The amendment to Paragraph
        10:20-11 and 34:2 was as follows: “In erecting, purchasing, or otherwise acquiring buildings for school purposes,
        the Board shall not do so in such a manner as to promote segregation or separation of children in public schools because
        of color, race or nationality.” The amendment to Paragraph 10:21-23 read as follows: “As soon as practicable, and
        from time to time there after, the Board shall change or revise existing [attendance] units or create new units in
        a manner which shall take into consideration the prevention of segrega tion, and the elimination of the separation
        of children in public schools because of color, race or nationality. All records pertaining to the creation of attendance
        units shall be open to the public.” This amendment is reprinted in the Report of the Advisory Panel on Integration
        of the Public Schools, popularly known as the Hauser report (cited by [[w.anderson-confronting-the-color-line]], 107
        n.9).'
