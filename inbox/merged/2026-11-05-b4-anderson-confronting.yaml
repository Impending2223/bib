- add:
    entry:
      id: cal.1961-01.desegregation-schools-2
      when: Jan.
      date: '1961-01'
      thread: desegregation-schools
      c: 'New Rochelle, N.Y. Federal Judge Irving R. Kaufman orders the city''s schools desegregated, *Taylor v. Board of
        Education*: "It is of no moment ... whether the segregation is labeled ... de jure ... or de facto, as long as the
        board, by its conduct, is responsible for its maintenance."'
      n: '[[w.anderson-confronting-the-color-line]], 80. Check: the day; the report of the opinion. To check: Taylor v. Board
        of Education, summarized in U.S. Commission on Civil Rights, Racial Isolation in the Public Schools, 2 vols. (Washington,
        D.C.: U.S. Government Printing Office, 1967) 1:220-21 (cited by [[w.anderson-confronting-the-color-line]], 80 n.22).'
      src:
        c: a6ebe6b0
        rows:
        - 'w.anderson-confronting-the-color-line 80: all'
        - 'via w.anderson-confronting-the-color-line 80 n.22: all'
      tags:
      - state:ny
- add:
    entry:
      id: cal.1961-02.desegregation-schools
      when: Feb.
      date: '1961-02'
      thread: desegregation-schools
      also:
      - civil-rights-organizations
      c: 'Chicago. The NAACP''s Chicago branch, the Reverend Carl A. Fuqua its new executive director, adopts a policy statement
        on education: it will "seek legal action" wherever the Board of Education is reluctant to change practices that result
        in "a ''separate but unequal'' school system."'
      n: '[[w.anderson-confronting-the-color-line]], 81. Check: the day. To check: Crisis 68 (April 1961): 240-41 (cited by
        [[w.anderson-confronting-the-color-line]], 81 n.24).'
      src:
        c: da77fc03
        rows:
        - 'w.anderson-confronting-the-color-line 81: all'
        - 'via w.anderson-confronting-the-color-line 81 n.24: all'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1961-04.desegregation-schools
      when: Apr.
      date: '1961-04'
      thread: desegregation-schools
      also:
      - civil-rights-organizations
      c: Chicago. The NAACP asks Daley to require of his school board nominees a statement of their positions on desegregation,
        on applying *Brown* and the New Rochelle decision to Chicago. Daley does not. The branch's task forces go to the parents
        of Chatham, West Avalon and Park Manor.
      n: '[[w.anderson-confronting-the-color-line]], 81, 84. Check: the day. To check: Chicago Daily Defender, 5, 13 April
        1961 (cited by [[w.anderson-confronting-the-color-line]], 84 n.27). Names: Daley.'
      src:
        c: 9a4bc603
        rows:
        - 'w.anderson-confronting-the-color-line 81, 84: all'
        - 'via w.anderson-confronting-the-color-line 84 n.27: all'
      tags:
      - name:daley-richard-j
      - state:ny
- add:
    entry:
