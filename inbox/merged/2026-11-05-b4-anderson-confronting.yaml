      thread: desegregation-schools
      also:
      - civil-rights-organizations
      c: 'Chicago. Paul Zuber, counsel for the plaintiffs in New Rochelle, arrives at the invitation of the NAACP and the
        Chatham-Avalon Park Community Council. Operation Transfer announced: Negro parents to register their children at nearby
        white schools not overcrowded and, refused, to sue.'
