    entry:
      id: cal.1961-09-18.desegregation-schools
      when: Sept. 18
      date: '1961-09-18'
      thread: desegregation-schools
      c: 'Chicago. *Webb v. Board of Education* filed in the federal court, Zuber''s suit for the Negro parents against the
