      - vis:only:ussr@I.K-L
- add:
    entry:
      id: cal.1964-12-08.soviet-union-leadership
      when: Dec. 8
      date: '1964-12-08'
      thread: soviet-union-leadership
      c: 'The Presidium (P 180/II) on the organization of the Supreme Soviet''s fifth session: Brezhnev to be proposed as chairman of the Constitutional Commission, Khrushchev relieved of it; Mikoyan''s note of Dec. 4 accepted, the decree on the Chairman of the Council of Ministers to be confirmed at the joint sitting of Dec. 9, and Kholov to replace Rakhmatov as a deputy chairman of the Presidium of the Supreme Soviet.'
      n: '[[w.khrushchev-1964-stenogrammy]], 435–36 (docs. 38–39; RGANI, f. 3, op. 16, d. 581, l. 14; op. 18, d. 306, ll. 2–3). Made public: 2007. Names: Brezhnev, Khrushchev, Mikoyan.'
      tags:
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-12-09.soviet-union-leadership-2
      when: Dec. 9
      date: '1964-12-09'
      thread: soviet-union-leadership
      c: The Supreme Soviet, the two chambers sitting together, fifth session. Brezhnev, for the Central Committee, proposes Kosygin as Chairman of the Council of Ministers; the deputies approve the decree of Oct. 15 appointing him, then the decree relieving Khrushchev for age and ill health, both unanimously.
      n: '[[w.khrushchev-1964-stenogrammy]], 436–37 (doc. 40, the stenogram; GARF, f. R-7523, op. 81, d. 173, ll. 1–3). Made public: 1964. Names: Brezhnev, Kosygin, Khrushchev.'
      tags:
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1962-02-05.soviet-union-leadership
      when: Feb. 5
      date: '1962-02-05'
      thread: soviet-union-leadership
      c: 'Khrushchev, at a conference on agriculture of the leaders of the RSFSR, the Ukraine, Belorussia, Kazakhstan and Georgia and of the Union''s central bodies'' farm workers: Stalin had the peasants "pay tribute," the prices never paid the labor, the state took and ruined the farms; in 1946 Stalin turned on him and on Starovsky for the Ukraine''s grain figures. Mikoyan puts in dates.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], I, 607–09 (IV, doc. 21, an extract of the unedited stenogram). Made public: 2009. Names: Khrushchev, Mikoyan. Check: the extract omits passages on the virgin lands, Williams'' theory and the organization of farm guidance (the editors'' notes); the conference''s place.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1961-09-28.soviet-union-leadership
      when: Sept. 28
      date: '1961-09-28'
      thread: soviet-union-leadership
      c: 'Khrushchev, remarks dictated at Pitsunda on building and town planning: architects want each house a monument; the British found four floors cheapest, and safest in war; the Kotelnicheskaya embankment block costs four or five times the ordinary house per meter, the university''s money would have built four or five; the Foreign Ministry''s tower was Stalin''s idea.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], I, 603–06 (IV, doc. 20; *Istochnik*, 2003, no. 6, 119–22). Made public: 2003. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1961-04-11.soviet-union-leadership
      when: Apr. 11
      date: '1961-04-11'
      thread: soviet-union-leadership
      also:
      - soviet-union-space
      c: 'Khrushchev, dictating at Pitsunda the day before Gagarin''s flight: Ustinov has called, the launch is set for 9:07 next morning. He has stopped the plan to bring the cosmonaut, Gagarin, to Pitsunda, and will go himself and persuade Mikoyan; a full welcome at Vnukovo, a short meeting, the Kremlin and a reception, perhaps a demonstration on Red Square. An appeal from the Central Committee and the government to the people, the party and all progressive mankind, to go out when the ship has landed: the first in space, Soviet, and the plea for general disarmament under the strictest control.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 387–89 (VI, doc. 20). Made public: 2009. Names: Khrushchev, Mikoyan, Ustinov, Gagarin.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:ustinov-dmitriy-f
      - name:gagarin-yuri
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1962-01-25.soviet-union-leadership
      when: Jan. 25
      date: '1962-01-25'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium''s members, dictated, "thoughts, not proposals," on the structure of the union, republic and oblast bodies for guiding farm production: a committee on the pattern of the industrial committees, the republic''s first secretary in the chair, with a first deputy premier freed for it, the head of the agriculture department, the head of Selkhoztekhnika, the minister and the chairman of procurement. Mazurov, to whom he put it, thought a second secretary might serve.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 631–34 (VIII, doc. 1). Made public: 2009. Names: Khrushchev, Mazurov.'
      tags:
      - name:khrushchev-nikita-s
      - name:mazurov-kirill-t
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1962-02-19.soviet-union-leadership
      when: Feb. 19
      date: '1962-02-19'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Central Committee on improving party, state and public control, as the Twenty-second Congress charged it: the successes would be larger if the checking of how the party''s directives are carried out were exemplary.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 634–44 (VIII, doc. 2, an extract of the note). Made public: 2009. Names: Khrushchev. Check: the note''s proposals, pp. 635–43, not read.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1962-08-17.soviet-union-leadership
      when: Aug. 17
      date: '1962-08-17'
      thread: soviet-union-leadership
      also:
      - defense-soviet-forces
      c: 'Khrushchev, a note to the Presidium, secret, on building launch pads for ballistic missiles: the generals'' specification of turntables turning 360 degrees is "illiterate," since a ballistic missile fires at fixed targets; one to three degrees will do, 200 km of range for a degree, and the money would build more silos. He has told Smirnov and Grechko his anger; Barmin and the builders not inventive, having first held silo launch impossible until the Americans built them; the General Staff to assign each battery its target and a double.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 670–72 (VIII, doc. 6; RGANI, f. 52, op. 1, d. 354, ll. 10–15). Made public: 2009. Names: Khrushchev, Grechko. Check: "200 km a degree" is his own figure for the fall of the warhead; Smirnov''s office is not given.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1962-09-10.soviet-union-leadership
      when: Sept. 10
      date: '1962-09-10'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium''s members, candidates and the Secretaries, with the plenum on industry set for November–December: how to raise the party''s guidance of the economy. The party and soviet organs to be restructured, the republics'' committees to have two production bureaus, for industry and for farming, with full autonomy, the committee''s presidium deciding only the republic''s own questions.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 672–84 (VIII, doc. 7; RGANI, f. 52, op. 1, d. 354, ll. 103–06 for the addition). Made public: 2009. Names: Khrushchev. Check: he says he spoke in August in the Presidium on the industry (n.18); the Presidium of that month not read.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1962-10-16.soviet-union-leadership
      when: Oct. 16
      date: '1962-10-16'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium on irrigating and opening new land and building cotton state farms in Central Asia: irrigated land there pays for itself in a year or two. The Karakum canal, water through 800 of 1,300 km, runs ahead of the farms to use it, the fault of the Ministry of Agriculture, Gosplan and Turkmenistan; 2.2 million hectares in the canal zone, 1.3 in the Karshi steppe, about a million in the Hungry Steppe; the order of works decided earlier to be corrected.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 185–90 (V, doc. 26; RGANI, f. 52, op. 1, d. 355, ll. 54–66; the editors'' n.32 to Section V). Made public: 2009. See [[cal.1962-10-16.soviet-union]]. Names: Khrushchev. Check: the editors place it on the Presidium''s agenda of Oct. 18 (Protocol 59, item 2); that session is not in the calendar.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1962-10-17.soviet-union-leadership
      when: Oct. 17
      date: '1962-10-17'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium on cotton for the Soviet Union and the other socialist countries: the seven-year plan''s cotton unmet, over 800,000 tons of raw cotton short in three years and the mills short of fiber; Gosplan''s miscalculation, resting on yields. Without the virgin lands the commercial grain would have been 1.9 to 2.1 billion poods, a catastrophe. Hungry Steppe farms cost some 3,000 rubles a hectare and gave 10.8 centners the first year, 13.8 expected.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 190–93 (V, doc. 27). Made public: 2009. See [[cal.1962-10-16.soviet-union]]. Names: Khrushchev. Check: the note''s proposals, pp. 192–93, not read.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1962-12-01.soviet-union-leadership
      when: Dec. 1
      date: '1962-12-01'
      thread: soviet-union-leadership
      c: Khrushchev, Brezhnev with him, tours the Moscow artists' exhibition at the Manège and speaks before the pictures. At a Falk canvas he asks whether the painters are married; as Chairman of the Council of Ministers he would give not a kopeck for such "trash," those who take the money will be punished and the press will not back them; those who prefer to go abroad to their kindred may. Of a letter from a group of artists he first reacted sharply; on looking at its facts he does not endorse them.
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 522–33 (VII, doc. 8). [[w.schattenberg-brezhnev]], 251 (Brezhnev with him; the rage before the abstract paintings). Made public: 2009. To check: Yu. Gerchuk, *Krovoizliyanie v MOSKh ili Khrushchev v Manezhe* (2008) (cited by [[w.schattenberg-brezhnev]], 251 n.63). Names: Khrushchev, Brezhnev. Check: his remarks were noted by hand and are partly illegible in the printed text; the press reports of the day not read.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - name:brezhnev-leonid
      - vis:only:ussr@B-F
- add:
    entry:
      id: cal.1962-12-17.soviet-union-leadership
      when: Dec. 17
      date: '1962-12-17'
      thread: soviet-union-leadership
      also:
      - press-and-broadcasting
      c: 'Khrushchev opens a meeting of the party and government leaders with writers and artists: no emergency; the party''s position good, the country''s good, the international position "excellent," the crisis survived. Ilyichev gives the Central Committee''s report. Yevtushenko, Deineka and Gribachev speak; Khrushchev, repeatedly, on the "rubbish" shown ("I am against" it), the young and the "healthy" art; Deineka asks for a gallery of Soviet art and says the young are not all rotten.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 533–600 (VII, doc. 9, the stenogram). Made public: 2009. Names: Khrushchev. Check: the place and the list present; the closing of the meeting, pp. 590–600, not read.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1963-02-20.soviet-union-leadership
      when: Feb. 20
      date: '1963-02-20'
      thread: soviet-union-leadership
      also:
      - press-and-broadcasting
      c: 'Khrushchev, a note to the Presidium on tidying the issue of newspapers and magazines and the guidance of publishing, with the party''s management of the economy reorganized: too many branch papers beside *Pravda* and *Izvestiya*. The Ideological Commission to take it up; Ilyichev, Satyukov and Adzhubei to prepare proposals on the supplements; a Central Committee paper to be drafted and talked over with Communists, Komsomol members and nonparty readers.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 700–04 (VIII, doc. 12; RGANI, f. 52, op. 1, d. 357, ll. 24–32). Made public: 2009. Names: Khrushchev, Adzhubei.'
      tags:
      - name:khrushchev-nikita-s
      - name:adzhubei-aleksei
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1963-03-05.soviet-union-leadership
      when: Mar. 5
      date: '1963-03-05'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium on managing industry and construction after the November plenum: the sovnarkhozy not to drag the branch offices to their new seats; the USSR council and the republics'' councils union-republic bodies binding from the top, and Gosplan the same; defense orders to go straight to the plant, not through many hands. A Supreme Council of the National Economy over the Union council, Gosplan and Gosstroi, their chairmen no longer deputy premiers, with a collegium and a bureau of five to nine, taking the Military-Industrial Commission, the defense committees and the Ministry of Medium Machine Building. A statute to be drafted.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 704–10 (VIII, doc. 13; RGANI, f. 52, op. 1, d. 357, ll. 52–61). Made public: 2009. Names: Khrushchev. Check: the Council''s creation (mid-March 1963) not read; the note''s number P 364.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1963-08-13.soviet-union-leadership
      when: Aug. 13
      date: '1963-08-13'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium proposing a commission on widening the assortment and improving the quality of light-industry goods: Podgorny, Mikoyan, Kosygin, Shelepin, Demichev, Maksimov, Pavlov and Struev, with Gosplan and VSNKh staff, the republics'' trade ministries and Central Committee secretaries and department heads.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 730–32 (VIII, doc. 18). Made public: 2009. Names: Khrushchev, Podgorny, Mikoyan, Kosygin, Shelepin, Demichev.'
      tags:
      - name:khrushchev-nikita-s
      - name:podgorny-nikolai-v
      - name:mikoyan-anastas
      - name:kosygin-aleksei
      - name:shelepin-aleksandr-n
      - name:demichev-pyotr-n
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1963-10-15.soviet-union-leadership
      when: Oct. 15
      date: '1963-10-15'
      thread: soviet-union-leadership
      also:
      - trade
      c: 'Khrushchev, a note to the Presidium on exports and imports, after a TASS bulletin of Oct. 5 quoting Japan''s minister of trade and industry: Japan to send $300 million of large-diameter pipe for Soviet oil, ten million tons a year. He knows of no such plan; the foreign trade ministry may have talked.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 732–34 (VIII, doc. 19). Made public: 2009. Names: Khrushchev. Check: the rest of the note, pp. 733–34, not read.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-09-22.soviet-union-leadership-2
      when: Sept. 22
      date: '1964-09-22'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium on reaching the most advanced level of production in industry: Soviet aircraft engines ran 500 hours to the English 2,500–3,000; after he raised it they run 2,500 and on the stand 7,000. Targets and dates to be set, so that engines of every kind match the best in power, fuel, oil and life.'
      n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 745–47 (VIII, doc. 23). Made public: 2009. See [[cal.1964-09-22.soviet-union-leadership]]. Names: Khrushchev. Check: the note''s other branches, pp. 746–47, not read; the day against the stenogram of the same day.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
