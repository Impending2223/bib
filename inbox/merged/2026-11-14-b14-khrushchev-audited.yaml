      when: Oct. 28
      date: '1964-10-28'
      thread: soviet-union-leadership
      c: 'The Presidium, Protocol 168. It approves the text of the communiqué on the talks with the French Communists, and the instructions to the Soviet ambassadors in the capitalist countries and in Cuba and Yugoslavia to tell the parties'' leaders, orally, more of the Khrushchev case: the line of the three congresses unchanged; with age and failing health he had decided without collective discussion, praised himself, lost modesty; the Presidium had tried to help him, and put the question to the plenum.'
      n: '[[w.khrushchev-1964-stenogrammy]], 323–28 (docs. 23–24, P 168/11 and 12; RGANI, f. 3, op. 18, d. 292, ll. 5, 21). Made public: 2007. See [[cal.1964-10-27.soviet-union-leadership]]. Names: Khrushchev. Check: the item numbers of Protocol 168, which the printed text gives as "11" and "12" for Oct. 28 and "I" and "II" for Oct. 29.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-10-28.china
      when: Oct. 28
      date: '1964-10-28'
      thread: china
      also:
      - soviet-union-leadership
      c: Peking, the evening. Zhou Enlai receives Ambassador Chervonenko, with Wu Xiuquan and Yu Zhan present. Since the night of Oct. 16, when the plenum and the Supreme Soviet were reported, China has sent greetings to Brezhnev and Kosygin; the Central Committee now proposes a party and government delegation to Moscow for the forty-seventh anniversary of October, or that Soviet representatives come to China, openly or not, or it will hear the Soviet side's proposal. Chervonenko to report at once.
      n: '[[w.khrushchev-1964-stenogrammy]], 330–33 (doc. 26; RGANI, f. 5, op. 49, d. 716, l. 353, the diary reprinted Nov. 18). Made public: 2007. Names: Zhou Enlai, Chervonenko, Brezhnev, Kosygin.'
      tags:
      - name:zhou-enlai
      - name:chervonenko-stepan-v
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      - polity:ussr
      - polity:prc
      - vis:only:ussr+prc
- add:
    entry:
      id: cal.1964-11-08.china
      when: Nov. 8
      date: '1964-11-08'
      thread: china
      also:
      - soviet-union-leadership
      c: 'Moscow, before dinner at the Chinese delegation''s residence. Zhou Enlai, with Kang Sheng and He Long, to Brezhnev, Kosygin, Mikoyan, Andropov and Gromyko: at the reception in the Palace of Congresses the day before Malinovsky told him that no Maos or Khrushchevs should come between the peoples, and that the Soviets had overthrown Khrushchev and the Chinese should overthrow Mao; and "every vegetable has its time." Was this provocation, the view of the Central Committee, a view of the quarrel as two men''s? Brezhnev: the Presidium''s attitude to the visit has been positive; Malinovsky is not a member; he had phoned him, drunk, and he would apologize; the vegetable remark, if Zakharov''s, aimed only at Khrushchev. Zhou: a man says what is in his head. Two or three meetings to follow.'
      n: '[[w.khrushchev-1964-stenogrammy]], 348–56 (doc. 32, the record; RGANI, f. 3, op. 16, d. 562, ll. 25–37, Kudashev and Rogachev recording). Made public: 2007. See [[cal.1964-11.china]]. Names: Zhou Enlai, Brezhnev, Kosygin, Mikoyan, Andropov, Gromyko, Malinovsky, Zakharov, Khrushchev, Mao. Check: the delegation''s days, Nov. 5–13 by Zhai; the words of the toasts were not recorded here.'
      tags:
      - name:zhou-enlai
      - name:brezhnev-leonid
      - name:kosygin-aleksei
