patch: 2026-11-14-b14-khrushchev
by: 'Claude (batch 14, reader 3: Khrushchev''s last years and his fall: *Nikita Khrushchev. 1964* (2007); *Dva tsveta vremeni*, vols. I–II (2009)), Nov. 14, 2026; audited by Claude (Opus), batch 14 audit, Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1964-06-13.soviet-union-leadership
      when: June 13
      date: '1964-06-13'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium on guiding agriculture as it turns to intensive methods: not another reorganization, but a system for specialized production; planning by zones, not by averages. Three versions of the 1970 targets side by side: grain 14–16 billion poods in the Twenty-second Congress''s decision, 14.3 by the republics, 14 by Gosplan''s farm section; raw cotton 8, 6.3 and 6.5 million tons. Sent to the Presidium''s members and candidates, the Secretaries, the deputy premiers, the Bureau for the RSFSR and the republics'' first secretaries.'
      n: '[[w.khrushchev-1964-stenogrammy]], 14–43 (doc. 1, the note; its distribution, n.1); [[w.khrushchev-dva-tsveta-vremeni]], II, 207 (V, doc. 31, the same note). Made public: 2007. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-06-27.soviet-union-leadership
      when: June 27
      date: '1964-06-27'
      thread: soviet-union-leadership
      c: 'Khrushchev, dictating on the steamer *Bashkiriya* on his trip to Denmark, Sweden and Norway, a note for the Presidium: can men not on Marxist ground build socialism? Nasser, Ben Bella, Ne Win, Modibo Keita and Nkrumah all speak of socialism and most mean it; none says how. The party came to its own through the underground and the fight with the church; the Presidium should settle its attitude to the variety.'
      n: '[[w.khrushchev-1964-stenogrammy]], 43–44 (doc. 2; RGANI, f. 52, op. 1, d. 363, ll. 83–85; *Istochnik*, 2003, no. 6, 182–83); [[w.khrushchev-dva-tsveta-vremeni]], II, 743–44 (VIII, doc. 22, the same text, "for discussion in the Presidium"). Made public: 2003. Names: Khrushchev, Nasser, Ben Bella.'
      tags:
      - name:khrushchev-nikita-s
      - name:nasser-gamal-abdel
      - name:ben-bella-ahmed
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-07-05.soviet-union-leadership
      when: July 5
      date: '1964-07-05'
      thread: soviet-union-leadership
      c: 'Khrushchev, a note to the Presidium on how to manage agriculture: a union-republic directorate for all grain, with its science and seed work; the separate Ministry of Agriculture to be corrected; a union-republic directorate for cattle with a deputy for science; no design bureau of its own, the stock-raisers to place orders; a zonal division, with Central Asia built round cotton.'
      n: '[[w.khrushchev-1964-stenogrammy]], 44–50 (doc. 3; "an addition to the last note on the organization of farm management," n.15). Made public: 2007. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-07-06.soviet-union-leadership
      when: July 6
      date: '1964-07-06'
      thread: soviet-union-leadership
      c: 'Khrushchev, two notes to the Presidium dictated on the road from Baltiysk to Moscow. One: a union-republic trust on cost accounting to cut peat, drain bogs and make organo-mineral fertilizer by Lysenko''s method, working to order for the farms. The other, for the coming report on agriculture: liquid and silage feeds, as at a state farm near Moscow, spread by "advisers," not inspector-organizers.'
      n: '[[w.khrushchev-1964-stenogrammy]], 50–52 (docs. 4–5; RGANI, f. 52, op. 1, d. 363, ll. 142–43; d. 341). Made public: 2007. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-07-11.soviet-union-leadership
      when: July 11
      date: '1964-07-11'
      thread: soviet-union-leadership
      c: 'The Central Committee''s plenum, Khrushchev in the chair, called only for the Supreme Soviet''s session: 148 of 169 members present. Brezhnev to be relieved as Chairman of the Presidium of the Supreme Soviet to work as a Secretary; Mikoyan recommended in his place, and relieved as first deputy premier; Khrushchev to move it in the Supreme Soviet. The session''s business: pensions for collective farmers, and pay for teachers, health, housing, trade and catering workers, Khrushchev to report. The five-day week not yet. He talks an hour on harvest, building, fertilizer and farm management and, of Sakharov''s speech against electing Remeslo, threatens to disband the Academy of Sciences.'
      n: '[[w.khrushchev-1964-stenogrammy]], 52–62 (doc. 6, the unedited stenogram; RGANI, f. 2, op. 1, d. 747), 62–65 (docs. 7–9, Protocol no. 8 and the two decrees, d. 744). Made public: 2007. Check: the stenogram has Khrushchev count 152 members present, the protocol 148 (n.22). Names: Khrushchev, Brezhnev, Mikoyan, Sakharov.'
      tags:
      - name:khrushchev-nikita-s
      - name:brezhnev-leonid
      - name:mikoyan-anastas
      - name:sakharov-andrei-d
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-07-16.soviet-union-leadership
      when: July 16
      date: '1964-07-16'
      thread: soviet-union-leadership
      c: The Supreme Soviet's Constitutional Commission meets, Khrushchev opening. The reports of the seven subcommissions to be heard in turn, on the state order, administration and the soviets, the economy, national policy, science and culture, foreign policy; then a draft outline to be worked up.
      n: '[[w.khrushchev-1964-stenogrammy]], 65–69 (doc. 10, the unedited stenogram; RGANI, f. 52, op. 1, d. 440, ll. 18–27; *Istoricheskii arkhiv*, 1997, no. 1, 48–51); [[w.khrushchev-dva-tsveta-vremeni]], II, 426–31 (VI, doc. 29). Made public: 1997. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1964-07-20.soviet-union-leadership
      when: July 20
      date: '1964-07-20'
      thread: soviet-union-leadership
      c: The Presidium discusses Khrushchev's note of June 13 on farm management. A reworked, shortened text approved, sent as no. P 1130 to the Central Committee's members, the republics' committees and councils of ministers and the krai and oblast organs for proposals before the November plenum.
      n: '[[w.khrushchev-1964-stenogrammy]], 450 n.12 (the editors'' note to doc. 1, Section I). Made public: 2007. Names: Khrushchev. Check: the editors date the session July 20 and the text no. P 1130 July 18; the Presidium''s own record not read. See [[cal.1964-06-13.soviet-union-leadership]].'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-07-24.soviet-union-leadership
      when: July 24
      date: '1964-07-24'
      thread: soviet-union-leadership
      c: 'Khrushchev, at an enlarged session of the Presidium of the Council of Ministers, on the draft plan for 1965–70: begin from the benefits the Program promises the people, not from an equal increase for each branch; free municipal services can wait to 1970 or 1975; the Program''s figures may be corrected, through the congresses. Fatten cattle at sugar and spirit works; the Latvians and Estonians should see Denmark and Sweden.'
      n: '[[w.khrushchev-1964-stenogrammy]], 69–79 (doc. 11, the unedited stenogram). Made public: 2007. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-08-08.soviet-union-leadership
      when: Aug. 8
      date: '1964-08-08'
      thread: soviet-union-leadership
      c: 'Khrushchev with the leaders of oblasts, krais and republics, short of time, on preparing the plenum on agriculture: the harvest, perhaps just over four billion poods; the corn planned for fodder not to be turned over to grain; Stavropol and Krasnodar putting in corrections, Krasnodar to fall well short; peas for pigs and poultry, not cattle.'
      n: '[[w.khrushchev-1964-stenogrammy]], 79–85 (doc. 12; RGANI, f. 52, op. 1, d. 416, ll. 1–12; the talk during his tour of the farming regions, n.44). Made public: 2007. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-09-18.soviet-union-leadership
      when: Sept. 18
      date: '1964-09-18'
      thread: soviet-union-leadership
      c: 'Khrushchev with some Presidium members and Central Committee staff on the plenum and on managing agriculture. Yefremov, for the Bureau for the RSFSR, lays out a draft scheme from Khrushchev''s note: the kolkhoz and sovkhoz production directorates stay apart; production not torn from procurement; one directorate for each product.'
      n: '[[w.khrushchev-1964-stenogrammy]], 114–32 (doc. 18, the unedited stenogram). Made public: 2007. Names: Khrushchev. Check: who of the Presidium were present; the stenogram heads Yefremov, Polyakov and Khrushchev among the speakers.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-09-22.soviet-union-leadership
      when: Sept. 22
      date: '1964-09-22'
      thread: soviet-union-leadership
      c: 'Khrushchev on the draft main lines of the economy for 1966–70, stenographed. Starovsky''s remarks sound: the fifteen years to 1980 in the Program to be cut into two plans, of seven years and eight, or eight and seven. The weight to consumer goods, with the means of production serving them; scientists to compare output with foreign firms'' and a plan made to buy equipment and licenses; his dictated text on chemistry to replace the old one in the minutes.'
      n: '[[w.khrushchev-1964-stenogrammy]], 133–40 (doc. 19, the unedited stenogram). Made public: 2007. Names: Khrushchev. Check: Gorelyad and Ustinov are named in his remarks; the speakers before him not read.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-09-26.soviet-union-leadership
      when: Sept. 26
      date: '1964-09-26'
      thread: soviet-union-leadership
      c: 'Khrushchev''s outline for a speech on planning, discussed with Kosygin, Ustinov, Rudakov, Gorelyad, Lebedev and Troyanovsky: give up five-year plans for longer ones, since the big works no longer fit five years; the Program leaves fifteen years to 1980, to be cut into eight and seven. Kosygin: ten years, five of operating plan and five of forecast. Khrushchev: eight, since ten would show the miscalculations sooner.'
      n: '[[w.khrushchev-1964-stenogrammy]], 142–50 (doc. 21, the unedited stenogram; the Presidium''s record of the same morning, p. 142, Gorelyad''s report on the draft plan); [[w.khrushchev-dva-tsveta-vremeni]], II, 747–54 (VIII, doc. 24, the outline). Made public: 2007. See [[cal.1964-09-25.soviet-union]]. Names: Khrushchev, Kosygin, Ustinov.'
      tags:
      - name:khrushchev-nikita-s
      - name:kosygin-aleksei
      - name:ustinov-dmitriy-f
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-09-29.soviet-union-leadership
      when: Sept. 29
      date: '1964-09-29'
      thread: soviet-union-leadership
      c: 'Khrushchev with Sukarno. Chemistry: 42 billion rubles in seven years, fertilizer to pass the United States next year and reach 80 million tons in 1970; Soviet synthetic rubber said to beat natural, Sukarno holding that ten years will show; the copper, cobalt and nickel ore found in the north.'
      n: '[[w.khrushchev-1964-stenogrammy]], 150–51 (doc. 22, the record of the talk). Made public: 2007. Names: Khrushchev, Sukarno. Check: the place; the record gives none.'
      tags:
      - name:khrushchev-nikita-s
      - name:sukarno
      - polity:ussr
      - polity:indonesia
      - vis:only:ussr+indonesia
- add:
    entry:
      id: cal.1964-09-29.soviet-union-leadership-2
      when: Sept. 29
      date: '1964-09-29'
      thread: soviet-union-leadership
      also:
      - indonesia
      c: 'Khrushchev''s toast at the lunch for Sukarno: the Soviet Union armed the Indonesian army and sent pilots and submariners; in the Yemen fighting, he says "by the way, in secret," the bombers wore Egyptian markings but the planes and pilots were Soviet. Nothing of it to be printed.'
      n: '[[w.khrushchev-1964-stenogrammy]], 151–53 (doc. 23, the unedited stenogram). Made public: 2007. See [[cal.1964-09-29.soviet-union-leadership]]. Names: Khrushchev, Sukarno.'
      tags:
      - name:khrushchev-nikita-s
      - name:sukarno
      - polity:ussr
      - polity:indonesia
      - vis:only:ussr+indonesia
- add:
    entry:
      id: cal.1964-10.soviet-union-leadership-2
      when: Oct., by the 2d
      date: 1964-10
      thread: soviet-union-leadership
      c: 'Mikoyan questions V. I. Galyukov, once of Ignatov''s guard, who tells of Ignatov at Sochi and Krasnodar in August and September: the talks with the Krasnodar, Rostov, Volgograd and other leaders, the calls with Brezhnev and Podgorny, and Ignatov''s abuse of Khrushchev, Polyansky, Voronov and Kosygin. Sergei Khrushchev keeps the notes.'
      n: '[[w.khrushchev-1964-stenogrammy]], 154–60 (doc. 1; RGASPI, f. 397, op. 1, d. 93, ll. 1–11 verso, the notes in his hand, first scientific publication). Made public: 2007. See [[cal.1964-10.soviet-union-2]]. Names: Mikoyan, Ignatov, Brezhnev, Podgorny, Polyansky, Voronov, Kosygin, Khrushchev. Check: the day of the talk, "not later than Oct. 2" in the book; the notes are in the son''s hand, not a stenogram.'
      tags:
      - name:mikoyan-anastas
      - name:ignatov-nikolai-g
      - name:brezhnev-leonid
      - name:podgorny-nikolai-v
      - name:polyansky-dmitri-s
      - name:voronov-gennady-i
      - name:kosygin-aleksei
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-10-03.soviet-union-leadership
      when: Oct. 3
      date: '1964-10-03'
      thread: soviet-union-leadership
      also:
      - japan
      c: 'Khrushchev and Mikoyan receive a delegation of Japanese members of the Diet on the Black Sea shore, Fujiyama speaking for the five after their twelve-day tour of Siberia, Tashkent, Kiev and Leningrad. Fujiyama asks leniency on the Japanese not repatriated, and Khrushchev''s view of a larger Security Council, the clause calling Japan and Germany "enemy states," and his proposal for standing United Nations forces. Khrushchev: those who wish to leave may go at once.'
      n: '[[w.khrushchev-1964-stenogrammy]], 160–77 (doc. 2, the unedited stenogram). Made public: 2007. Names: Khrushchev, Mikoyan, Fujiyama. Check: the place, Pitsunda by Khrushchev''s words ("the Abkhaz land"); the rest of the talk, pp. 163–77, not read.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:fujiyama-aiichiro
      - polity:ussr
      - polity:japan
