      id: cal.1964-10-25.soviet-union-leadership
      when: Oct. 25
      date: '1964-10-25'
      thread: soviet-union-leadership
      c: 'The Presidium approves the communiqué on the meeting of the CPSU and the Polish party: Brezhnev, Kosygin and Andropov; Gomułka, Cyrankiewicz and Kliszko; the talks "in an atmosphere of friendship, cordiality" and unity of views, on relations between the parties and cooperation of the two states.'
      n: '[[w.khrushchev-1964-stenogrammy]], 306–07 (doc. 15, P 167/16; RGANI, f. 3, op. 18, d. 291, ll. 10, 51). Made public: 2007. To check: *Pravda*, the date of the printing. See [[cal.1964-10-24.soviet-union-leadership-2]]. Names: Brezhnev, Kosygin, Andropov, Gomułka, Cyrankiewicz.'
