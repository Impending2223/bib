- add:
    entry:
      id: cal.1964-10-15.soviet-union-leadership-3
      when: Oct. 15
      date: '1964-10-15'
      thread: soviet-union-leadership
      c: The Presidium of the Supreme Soviet, Mikoyan in the chair, Protocol 32. Mikoyan reports the plenum; Ignatov, Kosygin and Mikoyan speak. A decree relieving Khrushchev as Chairman of the Council of Ministers for age and ill health, passed unanimously; a decree appointing Kosygin, relieving him as first deputy, passed; the members congratulate him.
      n: '[[w.khrushchev-1964-stenogrammy]], 267–70 (docs. 22–23, the protocol and the decree). Made public: 2007; the decrees, 1964. Names: Mikoyan, Ignatov, Kosygin, Khrushchev. See [[cal.1964-10-15.soviet-union]].'
      tags:
      - name:mikoyan-anastas
      - name:ignatov-nikolai-g
      - name:kosygin-aleksei
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1964-10-24.soviet-union-leadership-2
      when: Oct. 24
      date: '1964-10-24'
      thread: soviet-union-leadership
      also:
      - china
      c: 'The Belovezh forest. Brezhnev, Kosygin and Andropov, for the Presidium, meet Gomułka, Cyrankiewicz and Kliszko for over four hours, and tell them of Khrushchev''s removal. Gomułka: content; Khrushchev would not be contradicted; no consultation on foreign policy; last year''s nonproliferation proposal, and the multilateral force; the "second Rapallo," the trip to Bonn and Adzhubei; missiles to Cuba, unconsulted. On China no public polemic, talks to be sought, a CMEA parties'' meeting. The Poles ask what the Soviet Union wants of Poland.'
      n: '[[w.khrushchev-1964-stenogrammy]], 309–13 (doc. 18, the note of Oct. 27 to the Central Committee; RGANI, f. 3, op. 16, d. 552, ll. 16–20), 303–04 (doc. 10, P 166/I, Oct. 22, the authorization). Made public: 2007. See [[cal.1964-10-22.soviet-union-leadership]]. Names: Brezhnev, Kosygin, Andropov, Gomułka, Cyrankiewicz, Adzhubei, Khrushchev.'
      tags:
