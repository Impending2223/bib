- add:
    entry:
      id: cal.1964-11-09.soviet-union-leadership
      when: Nov. 9
      date: '1964-11-09'
      thread: soviet-union-leadership
      c: The Presidium (P 171/III) approves the work of the CPSU delegation at its meeting with the Chinese party and government delegation in Moscow for the anniversary of October.
      n: '[[w.khrushchev-1964-stenogrammy]], 356–57 (doc. 33; RGANI, f. 3, op. 18, d. 296, l. 2). Made public: 2007. See [[cal.1964-11-08.china]]. Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-11-13.soviet-union-leadership
      when: Nov. 13
      date: '1964-11-13'
      thread: soviet-union-leadership
      c: The Presidium (P 174/IX). The results of the meetings with the Chinese delegation to be reported to the plenum, Brezhnev giving the information; a proposal on Kozlov to be put to it.
      n: '[[w.khrushchev-1964-stenogrammy]], 362 (doc. 35; RGANI, f. 3, op. 18, d. 299, l. 3). Made public: 2007. Names: Brezhnev, Kozlov.'
      tags:
      - name:brezhnev-leonid
      - name:kozlov-frol-r
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-11-16.soviet-union-leadership-2
      when: Nov. 16
      date: '1964-11-16'
      thread: soviet-union-leadership
      c: 'The Central Committee''s plenum, Brezhnev in the chair, 146 of 168 members present. Presidium business first: Satyukov freed as editor of *Pravda*, Rumyantsev in; Polyakov freed as head of the agriculture department, Kulakov in, and as a Secretary, by vote; Kozlov, an invalid of the first group, freed as Secretary and member of the Presidium; Adzhubei out of the Central Committee, by secret ballot at the end. Shelest and Shelepin elected members of the Presidium, Demichev a candidate; Yepishev, Konotop, Semichastny, Lutak, Popov, Sizov and Zhigalin moved up from candidates. Podgorny reports on uniting the industrial and rural obkoms and krai committees; Shelest, V. Grishin, Zarobyan, Mazurov, Rashidov and Akhundov speak; the resolution passed. Brezhnev gives the plenum an account of the talks with the fraternal parties and the Chinese; none of it to be spread abroad.'
      n: '[[w.khrushchev-1964-stenogrammy]], 362–419 (doc. 36, the unedited stenogram; RGANI, f. 2, op. 1, d. 762, ll. 1–133), 419–35 (doc. 37, Protocol no. 10). Made public: 2007; the decisions, 1964. Names: Brezhnev, Podgorny, Kozlov, Adzhubei, Shelest, Shelepin, Demichev, Mazurov. Check: the stenogram printed in the book carries struck passages (n.1); Brezhnev''s account of the Chinese talks, pp. 411–19, not fully read.'
      tags:
      - name:brezhnev-leonid
      - name:podgorny-nikolai-v
      - name:kozlov-frol-r
      - name:adzhubei-aleksei
      - name:shelest-petro-y
      - name:shelepin-aleksandr-n
      - name:demichev-pyotr-n
