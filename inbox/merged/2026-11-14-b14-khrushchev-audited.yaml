      when: Oct. 26–27
      date: '1964-10-26'
      thread: soviet-union-leadership
      c: Brezhnev, Podgorny, Suslov and Ponomarev talk with a French Communist delegation, Marchais, Leroy and Chambaz, in the Central Committee; the unity of the movement and the new international meeting.
      n: '[[w.khrushchev-1964-stenogrammy]], 323–24 (doc. 23, the communiqué of the talks of Oct. 26–27). Made public: 2007; the communiqué, 1964. Names: Brezhnev, Podgorny, Suslov, Ponomarev, Marchais.'
