    base: 9f64c78d
    set:
      c: 'The Presidium, the second day. Mikoyan: "In general, I was right"; "sending the submarines verged on adventurism"; Khrushchev to lose some posts, not his seat. Brezhnev: "Dismiss Comrade Khrushchev from the posts he holds and divide them." Khrushchev: the risk in Cuba "inevitable"; "I do not ask for mercy"; "Finally the party has grown and is able to control anyone." He asks his own dismissal; his Zil replaced by a Volga. The Presidium resolves: Khrushchev relieved, one man not to hold both posts, the plenum to meet that day, Brezhnev opening and Suslov reporting; Adzhubei out as editor of *Izvestiya*, Stepakov in; Kharlamov out as chairman of the radio and television committee, Mesyatsev in.'
- edit:
    id: cal.1964-10-22.soviet-union-leadership
    base: ba7aa680
    set:
      c: 'The Presidium. Suslov on his talk with the Hungarians: harsh, nothing of his merits, unexpected; did Moscow mean to change its policy on the cult; they asked that Khrushchev''s working-over not become "вот был культ Сталина, вот культ Хрущева" (there was Stalin''s cult, here is Khrushchev''s) in the press. Brezhnev, Kosygin and Andropov to meet Gomułka and the Polish party on Oct. 24: of the cult, restrained words; of Adzhubei, "болтливый" (a chatterbox); the trip to the Federal Republic never decided; on China, no change, the press polemic halted. The obkoms to be reunited in principle, the plenum to take it up. Khrushchev freed as chairman of the Bureau for the RSFSR; his salary kept for life, a state dacha at Semenovskoe, a Volga with KGB drivers, the Fourth Chief Directorate''s care, the dietary canteen.'
- edit:
    id: cal.1964-10-12.soviet-union
    base: a26a1451
    set:
      c: Gagra. Khrushchev, with Mikoyan, sees the launch of the world's first three-man spacecraft. That evening word to Palewski, de Gaulle's envoy, that the lunch is off.
      n: '[[w.fursenko-khrushchevs-cold-war]], 535–36. Check: the work calls the spacecraft *Vostok 3*. To check: Trevelyan to FO, Oct. 16, 1964, FO 371/177665; Hohler, Oct. 21, 1964, FO 371/177665, National Archives (UK); "How They Removed Khrushchev," interview with Semichastny, *Argumenti i Facti*, May 1989, 5 (cited by [[w.fursenko-khrushchevs-cold-war]], 535 n.13, n.14, 536 n.18). See [[cal.1964-10-08.soviet-union]]. Names: Khrushchev, Mikoyan, Palewski, de Gaulle.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:palewski-gaston
      - name:de-gaulle-charles
- edit:
    id: cal.1964-10-27.soviet-union-leadership
    base: 81fc8a1c
    set:
      c: 'The Presidium on its report to the Central Committee on the discussion of Khrushchev. Kosygin: more on the cult, softer on his contribution; Podgorny would not use "культ личности" (the cult of personality); Grishin: "«Культ» – это репрессии" (the cult means the repressions); Polyansky: say something of his contribution. Suslov, Podgorny and Brezhnev to edit it and the plenum''s record of Oct. 14. Sorge''s Hero title to be studied further. The obkoms reunited, with amendments; the plenum for Nov. 15–20, Podgorny reporting; the Supreme Soviet in December. The talks with the Poles and with the French Communists approved.'
