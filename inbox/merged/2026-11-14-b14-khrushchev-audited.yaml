- add:
    entry:
      id: cal.1964-10-06.soviet-union-leadership
      when: Oct. 6
      date: '1964-10-06'
      thread: soviet-union-leadership
      also:
      - berlin-and-vienna
      c: 'East Berlin, the solemn session for the fifteenth anniversary of the East German state. Brezhnev: the Soviet–East German treaty of friendship, in force these days, a corner-stone; whoever plans to touch the Republic''s frontiers should read it; some who call themselves Marxists have taken up the bourgeois press''s attacks on it, a line to split the socialist states; the international meeting of the communist parties to come.'
      n: '[[w.khrushchev-1964-stenogrammy]], 177–78 (doc. 3, from *Pravda*, Oct. 7). Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1964-10-12.soviet-union-leadership
      when: Oct. 12
      date: '1964-10-12'
      thread: soviet-union-leadership
      c: 'The Presidium, Khrushchev at Pitsunda, on the questions raised in the Central Committee over the November plenum and the new long-term plan. Resolved to take them up next day with him: Brezhnev, Kosygin, Suslov and Podgorny to telephone him and have him in Moscow Oct. 13; his note of July 18 (no. P 1130) on managing agriculture, whose "muddled" directions have confused the field, to be recalled from the party organizations; the Central Committee''s members, candidates and auditors to be summoned. All the Presidium''s members, candidates and Secretaries had spoken, Brezhnev''s draft says, on Khrushchev''s seven- or eight-year plan put forward without the Presidium. Brezhnev telephones him: "We can''t decide without you.... We are asking you to come." Khrushchev: "What''s the hurry?"'
      n: '[[w.khrushchev-1964-stenogrammy]], 180–82 (doc. 6, P 163/II; RGANI, f. 2, op. 1, d. 749, ll. 1–2; *Istoricheskii arkhiv*, 1993, no. 1, 4), 216–18 (doc. 8, Brezhnev''s draft for the next day; APRF, f. 80, d. 132). [[w.fursenko-khrushchevs-cold-war]], 535–36 (the call). Made public: 1993. Names: Brezhnev, Kosygin, Suslov, Podgorny, Khrushchev. Check: the editors say the resolution, dated Oct. 12, was drawn up later (n.1); the time of the session.'
      tags:
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      - name:suslov-mikhail-a
      - name:podgorny-nikolai-v
      - name:khrushchev-nikita-s
