- add:
    entry:
      id: cal.1960-02-26.china-leadership-4
      when: Feb. 26
      date: '1960-02-26'
      thread: china-leadership
      c: 'Mao to Zhou Enlai on the State Economic Commission Party group''s outline: very good, a new method, to be kept up; a summary six times a year, one every two months, approved by the Center and circulated. Zhou is to show it to the reading group''s comrades, then Bo Yibo, then Liu Shaoqi, Deng Xiaoping and Peng Zhen. Beside the outline''s line that 16 of 40 supply areas lack power, some 300,000 kilowatts, he writes: build small modern power plants on a large scale. Beside its aim of 20 million tons of steel or a little more: strive for 22 million tons.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 41–43 (Feb. 26, 1960, with notes 1-5). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: State Economic Commission Party group, outline of Feb. 13, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 42 n.1a). See [[cal.1960-02-20.china-leadership-4]]. Names: Mao Zedong, Zhou Enlai, Bo Yibo, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
      tags:
