      c: 'Mao, on the Metallurgy Ministry Party group''s report of Apr. 18 to Li Xiannian on continuing the steel *xiaoyangqun* and raising them in grade: a very good document, worth reading, to be returned after reading; for Chen Boda, Hu Qiaomu, Hu Sheng and Tian Jiaying to read. The report: the groups, begun in autumn 1958, are growing into combined enterprises; a February conference of metallurgy bureau chiefs chose the better ones to add steel-making and rolling, and planned new ones so that every suitable county and commune has one or more. The Center forwards the report May 16.'
