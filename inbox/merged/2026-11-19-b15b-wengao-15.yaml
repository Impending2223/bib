      when: Feb. 13
      date: '1960-02-13'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao, Liu Shaoqi, Zhu De and Zhou Enlai telegraph Khrushchev and Voroshilov on the tenth anniversary of the Sino-Soviet treaty of alliance. They thank the Soviet Union for its aid; name Khrushchev's American visit, the Soviet disarmament proposal and cut of 1.2 million men, and the Warsaw Treaty meeting's declaration; say no force can break the alliance; and pledge China to treat the unity of the camp the Soviet Union leads as its most sacred international duty.
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 33–35 (Feb. 13, 1960, printed from *Renmin ribao*, Feb. 14). To check: Treaty of Friendship, Alliance and Mutual Assistance between China and the Soviet Union, Moscow, Feb. 14, 1950 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 35 n.1a). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Khrushchev, Voroshilov.'
