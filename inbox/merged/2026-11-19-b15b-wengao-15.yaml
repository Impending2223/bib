      date: '1960-02-20'
      thread: china-leadership
      c: 'The Center forwards the State Economic Commission Party group''s outline of Feb. 13 for its oral report to the Politburo to the provincial, municipal and regional committees and the Party groups of central ministries. Its instruction: this year''s start is better than last year''s, since the fourth quarter of 1959 prepared the first of 1960; with the first month, quarter or year of a plan, prepare the next. The outline: January''s plan largely met; transport the weakest link.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 42–43 (Feb. 20, 1960, in notes 1 and 2). Made public: 2023. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], vol. 9, 1996) give it. To check: State Economic Commission Party group, outline of its oral report to the Politburo on industrial and transport production in January and early February 1960, Feb. 13, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 42 n.1a); Central Committee, instruction of Feb. 20, 1960 forwarding the Economic Commission Party group''s outline to provincial, municipal and regional committees and the Party groups of central ministries and commissions (cited by [[w.jianguo-yilai-mao-zedong]], XV, 42 n.1b).'
