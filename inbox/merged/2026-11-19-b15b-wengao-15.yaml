- add:
    entry:
      id: cal.1960-02-20.china-leadership-3
      when: Feb. 20
      date: '1960-02-20'
      thread: china-leadership
      c: 'Mao to Lin Biao: an informal paper on industry is sent for him to read, with something of interest; the marshals may all read it, Lin to pass it on and, it being secret, to return it. The paper is Li Fuchun''s minute of Feb. 14 of a talk at Canton with ministers reading the Soviet textbook: the 1960 plan certain to be overfulfilled; 100 million tons of steel to be strived for in ten more years; 21 million tons possible in 1960; the technical revolution, the revolution in the relations of production and the revolution in the superstructure to go forward together.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 39–40 (Feb. 20, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Li Fuchun, minute of the talk on several questions of the economic plan held Feb. 14, 1960 at Canton with Zhang Linzhi, Lu Zhengcao, Peng Tao, Chen Zhengren, Yu Qiuli, Liu Lanbo, Gu Zhuoxin and Wang Guangwei (cited by [[w.jianguo-yilai-mao-zedong]], XV, 39 n.2). Names: Mao Zedong, Lin Biao, Li Fuchun.'
      tags:
