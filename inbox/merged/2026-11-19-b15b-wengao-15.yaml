      when: Apr. 7
      date: '1960-04-07'
      thread: china-leadership
      c: 'Mao, 4 a.m., on the Jilin committee''s request of Apr. 2 for arrangements for the "three antis" (graft, waste, bureaucratism): for Deng Xiaoping and Peng Zhen to read and handle, to be returned to Mao after use. Jilin''s six-level conference turned to style on Apr. 1; graft, waste and bureaucratism among commune cadres found serious; it proposes to open the "three antis" at the conference, then put spring sowing first and hold the county four-level meetings after it.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 151–152 (Apr. 7, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Jilin Provincial Committee, report-request of Apr. 2, 1960 to the Center on arranging the "three antis" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 151 n.1). Names: Mao Zedong, Deng Xiaoping, Peng Zhen.'
