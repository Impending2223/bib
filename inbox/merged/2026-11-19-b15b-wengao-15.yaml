      c: 'Mao, on the International Liaison Department''s digest of Apr. 22 of an article in the Italian Communist Party''s monthly *Rinascita*, no. 1, 1960, "Are there socialist economic forms inside capitalist society?": for Chen Boda and Lu Dingyi to read, then back to Deng Xiaoping; it can be read; he calls it a typical revisionist argument, a lackey of the bourgeoisie''s. The article: socialist forms begin before the proletariat takes power and are its precondition; modern capitalist factories, joint-stock companies, producers'' cooperatives and state capitalism are new socialist forms; the revolution is to resolve capitalism''s contradictions, not to deepen them till they explode.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 187–188 (Apr. 24, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Zhonglian bu, Gezhong gongchandang dongxiang, Apr. 22, 1960, "The Italian Communist monthly Rinascita holds that socialist economic forms exist inside capitalist society" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 188 n.3); Rinascita, no. 1, 1960, "Are there socialist economic forms inside capitalist society?" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 188 n.3b). Names: Mao Zedong, Chen Boda, Lu Dingyi, Deng Xiaoping.'
