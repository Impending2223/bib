        - 'via w.jianguo-yilai-mao-zedong XV, 118 n.2: all'
- add:
    entry:
      id: cal.1960-03-23.china-leadership-3
      when: Mar. 23
      date: '1960-03-23'
      thread: china-leadership
      c: 'The Center''s circular, drafted by Mao, forwarding Shandong''s bulletin no. 2 to the county committees: Shandong''s problems are surely in every province, differing little; in some counties and communes the Zhengzhou resolution of last March and the Shanghai conference''s eighteen questions of last April are forgotten, and the "communist wind", exaggeration and commandism are back; some commune staff act without approval; graft, waste and bureaucratism again. The Center believes most communes are good; the worst staff are to be removed, "levelling and transfers" repaid in full, big embezzlers prosecuted, and county committees that failed in their duty removed too; rectification every year, a six-level conference twice a year.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 116–120 (Mar. 23, 1960, printed from the Central Committee document, with Mao''s manuscript). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Shandong six-level cadre conference secretariat, Huiyi qingkuang no. 2, Mar. 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 118 n.3); Zhengzhou huiyi jilu (record of the enlarged Politburo meeting at Zhengzhou, Feb. 27-Mar. 5, 1959: the meeting summary, Mao''s speech, and the draft regulations on the management system of the people''s communes) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 119 n.4); Minutes of the enlarged Politburo meeting at Shanghai, Mar. 25-Apr. 1, 1959, "Eighteen questions on the people''s communes", adopted at the Seventh Plenum of the Eighth Central Committee, Apr. 2–5, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 120 n.5). See [[cal.1960-03-22.china-leadership-5]]. Names: Mao Zedong.'
