      when: Apr. 7
      date: '1960-04-07'
      thread: china-leadership
      c: 'Mao drafts the Center''s comment forwarding the Jiangsu committee''s report of Mar. 30 on its six-level cadre conference: the conference was held very well, the report is sent for reference. He sends it to Liu Shaoqi, Deng Xiaoping and Peng Zhen and asks Yang Shangkun to have it telegraphed. The report: the conference, Mar. 19, took two days on the situation and Mar. 22–28 on the transition to commune ownership and the commune economy; hard argument on "whether to pass over" and on conditions; the three-level ownership with the brigade as base to stay for now; "levelling and transfers" shown unworkable; the brigade economy over 70 percent of income, the commune''s about 10.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 148–150 (Apr. 7, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Jiangsu Provincial Committee, report of Mar. 30, 1960 to the Center, Mao and the Shanghai Bureau on its six-level Party cadre conference of Mar. 19–28 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 148 n.1). See [[cal.1960-03-14.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
