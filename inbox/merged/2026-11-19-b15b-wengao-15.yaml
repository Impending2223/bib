      date: '1960-03-05'
      thread: china-leadership
      c: 'Mao, on the Henan committee''s bulletin no. 1 of Feb. 27 on the drive against drought and for watering the wheat: very good; comrades to read it; places in like case are to do the same, "of the utmost importance". The bulletin: drought spreading in the wheat; an emergency directive early in February, three emergency telephone conferences, a standing committee meeting Feb. 23 making the drive and spring sowing the province''s central task, over 300 cadres sent down from the provincial organs.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 64–65 (Mar. 5, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Henan Provincial Committee, bulletin no. 1 of Feb. 27, 1960 on the movement against drought and for watering the wheat, to the Center and Mao (cited by [[w.jianguo-yilai-mao-zedong]], XV, 64 n.1). Names: Mao Zedong.'
