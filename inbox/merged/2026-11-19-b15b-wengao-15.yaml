      c: 'Mao, on Tan Zheng and Xi Zhongxun''s report of Mar. 21 on preparing the national militia representatives'' conference: before the meeting Tan Zheng is to confer with Deng Xiaoping; he wants real problems solved and no loud boasting outside. The report: the preparatory committee first met Mar. 17; 5,500 delegates (5,040 militia, 110 Red Guard, Young Pioneer and old militia, 350 soldiers about to be demobilized); to open Apr. 18 for ten days, Luo Ronghuan to open, Luo Ruiqing to report, Lin Biao to close.'
