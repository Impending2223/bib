- cite:
    id: cal.1960-05-03.china-leadership
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 202–203 (Mao''s talk of May 3 at Jinan as the press printed it (*Renmin ribao*, May 4): he conveys the firm support of China''s 650 million for Cuba and the national democratic movements of Asia, Africa and Latin America, thanks them for their help, says the common enemy is American imperialism, that all are on one front and need to support one another, that the peoples of the world, American included, are friends, and that he supports the coming four-power summit; the delegations by note 1: Cuban workers, Brazilian civil-service and bank unions, women''s delegations of Sierra Leone, Tanganyika, Cuba, Venezuela and Uruguay and women of eight other countries)'
    units: B, D
- cite:
    id: cal.1960-05-07.china-leadership
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 204–205 (Mao''s talk of May 7 at Zhengzhou as the press printed it (*Renmin ribao*, May 8): full sympathy and support for the African peoples'' fight against imperialism and colonialism, and for the South Korean and Turkish peoples'' patriotic struggles; the delegations by note 1: social figures and peace workers of Somaliland, Senegal, Sierra Leone and the Sudan; trade-union, youth and student delegations of Algeria, the Congo, Guinea, Cameroon, Madagascar, the Mali Federation, Morocco, Zanzibar and others)'
    units: B
- cite:
    id: cal.1960-05-08.china-leadership-2
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 210–211 (Mao''s talk of May 8 as the press printed it (*Renmin ribao*, May 9): China, like Latin America, long oppressed and exploited by imperialism, is building its country and needs time, peace and friends; the imperialists and their dogs are few; Cuba''s fight against American imperialism admired; the delegations by note 1: Chile''s Unified Workers'' Federation, Colombian oil workers, Costa Rican and Ecuadorian trade unions and figures of Argentina, Brazil, Chile, Ecuador and Peru, and the Cuban army''s Inspector General, Major William Gálvez Rodríguez, and his wife)'
    units: B, D
- cite:
    id: cal.1960-05-09.china-leadership
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 214–215 (Mao''s talk of May 9 at Zhengzhou as the press printed it (*Renmin ribao*, May 10): the greatest imperialism is the American; Chiang, Rhee, Kishi, Batista, Nuri Said and Menderes overthrown or to be overthrown; Japan''s people demonstrating against the Kishi government''s treaty with the United States, which China firmly supports; the imperialists'' days are short; a broad united front, not counting the enemy; the delegations: Iraqi cultural and workers'' delegations and the trade-union delegations of Iran and Cyprus; note 3 names the Japan–U.S. treaty of Jan. 19, 1960)'
    units: B
- cite:
    id: cal.1960-05-08.china-leadership
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 208 (May 8, 1960: "do as proposed", returned to Deng Xiaoping; the Military Commission''s report of May 4, sent by Deng May 5, which says the Commission''s standing committee agreed on Apr. 26 to form the fleet, for unified building of the northern naval forces and better cooperation with the army and air force in war; the fleet to hold the powers of a group army)'
    units: A-B
