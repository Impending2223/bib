      c: 'Mao, Liu Shaoqi, Zhu De and Zhou Enlai telegraph Novotný, Fierlinger and Široký on the fifteenth anniversary of Czechoslovakia''s liberation by the Soviet army: the republic''s gains under the Communist Party; the Eleventh Congress''s program and the new task of bringing farming up to industry in ten years; its stand against Yugoslav revisionism and for the unity of the camp the Soviet Union leads; its fight against the revival of West German militarism.'
