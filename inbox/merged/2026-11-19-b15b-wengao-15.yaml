      date: '1960-03-24'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Foreign Ministry sends its telegram to the Ambassador in Mongolia, Xie Fusheng, as Mao agreed on Mar. 21: he is to tell the Mongolian Foreign Minister that China warmly agrees with the Mongolian government''s proposal of a treaty of friendship and cooperation; if Mongolia agrees, Zhou Enlai will gladly sign it at Ulan Bator, the date to be settled later. A draft treaty is attached, to ask the Mongolian side''s views on its contents.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 103–104 (Mar. 24, 1960, in note 1). Made public: 2023. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], vol. 9, 1996) give it. To check: Foreign Ministry, draft telegram of Mar. 20, 1960 to the Ambassador in Mongolia on a Sino-Mongolian treaty of friendship and cooperation, sent by Zhou Enlai to Mao (cited by [[w.jianguo-yilai-mao-zedong]], XV, 103 n.1a). Names: Zhou Enlai.'
