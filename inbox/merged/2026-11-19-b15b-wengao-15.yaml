      date: 1960-01
      thread: china-leadership
      at: after 1960-01-27
      c: 'Mao, on the cover of the International Liaison Department''s *Gezhong gongchandang dongxiang* no. 18 of Jan. 27, which digests Harry and Bonaro Overstreet''s *What We Must Know About Communism* (1958): for the comrades to read and return to Mao. He marks the passage in the digest''s third part, on negotiating from strength, that Communist delegates at talks stand for one side of the class struggle and the conference table is another place of war, and writes that it is right.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 31–32 (Jan. 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the day; the digest is dated Jan. 27. To check: Zhonglian bu, Gezhong gongchandang dongxiang, no. 18, Jan. 27, 1960, digesting Overstreet''s What We Must Know About Communism (cited by [[w.jianguo-yilai-mao-zedong]], XV, 31 n.1a); [[w.overstreet-what-we-must-know]] (cited by [[w.jianguo-yilai-mao-zedong]], XV, 31 n.1b). Names: Mao Zedong.'
