- add:
    entry:
      id: cal.1960-03.china-leadership-4
      when: Mar., after the 16th
      date: 1960-03
      thread: china-leadership
      at: after 1960-03-16
      c: Mao revises the third revised draft of Li Fuchun's report on the draft 1960 plan, sent him Mar. 16. He adds that the continuous reform of the relations of production and the superstructure opens the way for the productive forces, which in turn force the reform; that officials and masses should stand as comrades on equal terms; that every year's rectification is to wipe out lordly, bureaucratic and commandist styles; and a paragraph on the Rightist opportunists of 1959, whose factional attack on the general line, the Leap and the communes reflects the class struggle in the Party. Li delivers the report to the National People's Congress Mar. 30; *Renmin ribao* prints it Mar. 31.
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 130–131 (Mar. 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the day; between Mar. 16, when the draft was sent, and Mar. 30. To check: Li Fuchun, "Report on the draft national economic plan for 1960", third revised draft, sent Mar. 16, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 131 n.1). Names: Mao Zedong, Li Fuchun.'
