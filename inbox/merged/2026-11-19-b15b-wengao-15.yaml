      id: cal.1960-04-08.china-leadership-3
      when: Apr. 8
      date: '1960-04-08'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, 7 a.m., on the cover of Xinhua''s *Cankao ziliao* no. 3520 of Apr. 7: pages 47 to 55 hold five articles worth reading, which he hopes the comrades will read carefully; Britain and France moving toward cooperation against America and Germany is a big event. He sends it to Liu Shaoqi, Zhou Enlai, Lin Biao and Deng Xiaoping, to be returned to him. The five: American papers on de Gaulle''s visit to London; the *Evening Star* on the split between Britain and the United States over the Six and the Seven; the plight of American farm workers; de Gaulle''s second day in London; *The Times* on Anglo-German unease.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 154–156 (Apr. 8, 1960, 7 a.m.). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Xinhua, Cankao ziliao no. 3520, Apr. 7, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 154 n.1a); Reuters, New York, Apr. 6, 1960, "American papers strike at Britain and divide Britain and France" (editorials on de Gaulle''s visit to London) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 155 n.1b); Xinhua, Geneva, Apr. 5, 1960, "The American Evening Star on Western contradictions: Britain opposes West European integration and fears above all a strong West Germany" (William White, Apr. 1) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 155 n.1c); AFP, London, Apr. 6, 1960, "De Gaulle continues his visits in London" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 155 n.1e); Xinhua, Geneva, Apr. 5, 1960, "The Times editorial concentrates its attack on West Germany for causing unease" (The Times, Apr. 5: Anglo-German relations and NATO) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 155 n.1f). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Lin Biao, Deng Xiaoping.'
