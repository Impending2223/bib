    item: '[[w.jianguo-yilai-mao-zedong]], XV, 90–92 (the technical-revolution comment, dated Mar. 16 and issued Mar. 18: the ACFTU Party group''s report on seven cities (Shanghai, Tianjin, Shenyang, Lüda, Harbin, Taiyuan, Chongqing) and the *Jingji xiaoxi* piece are important summaries, to go to all city, mine and commune committees; Wuhan, Canton, Xi''an, Lanzhou, the provincial capitals and hundreds of medium cities such as Tangshan, Shijiazhuang, Qingdao, Luoyang, Huangshi, Zhuzhou, Wuxi, Zhanjiang and Pingxiang to sum up and spread the work quickly, county and commune industry too, the investigating and summing up to be done in March, April and May with large field conferences; the First Ministry of Machine Building''s January field conference at Harbin, to which most cities were not invited, Wuhan and Canton among them, is faulted)'
