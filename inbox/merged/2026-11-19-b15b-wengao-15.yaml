    item: '[[w.jianguo-yilai-mao-zedong]], XV, 82–89 (the mess-hall comment, dated Mar. 15 and issued Mar. 18: the three papers (eight provinces; Henan; the nation at the end of 1959) are pleasing; each province to "grasp hard" the question twice in the year, in each half, with a scientific summary on the Guizhou and Henan pattern; welfare committees at the four levels from province to commune, each under a secretary, and a management committee in every hall; the same in factories, mines, streets, offices, schools and the army. Mao''s inserts: the nation to aim at 80 percent of rural people eating in halls, seven provinces and cities (Henan, Hunan, Sichuan, Yunnan, Guizhou, Shanghai, Anhui) already over 90 percent, the rest not to be forced, two or three years; starch from plant stalks "a great invention"; third-class halls to be made first-class. The papers: Henan, 336,000 halls and 99 percent of rural people; the nation, 3,919,000 halls and 72.6 percent of commune members at the end of 1959)'
    units: A
