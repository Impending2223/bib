      c: 'Mao, on the outline of Chen Yi''s report of Dec. 27, 1959 to the Party''s cultural work conference, "Some views on the present international situation", which Zhou Enlai sent him Jan. 10: print for the comrades to read and study. Zhou had written that Chen proposed printing it and that he had read it and found it fit. The outline has six parts, from the roads to socialism to the unity of the socialist camp.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 7 (Jan. 11, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Chen Yi, "Some views on the present international situation", outline of his report of Dec. 27, 1959 to the Party''s cultural work conference (cited by [[w.jianguo-yilai-mao-zedong]], XV, 7 n.1a); Zhou Enlai to Mao Zedong, Jan. 10, 1960, sending Chen Yi''s outline (cited by [[w.jianguo-yilai-mao-zedong]], XV, 7 n.1b). Names: Mao Zedong, Zhou Enlai, Chen Yi.'
      tags:
