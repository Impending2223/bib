      date: 1960-03
      thread: china-leadership
      at: after 1960-03-16
      c: 'Mao, on the fourth draft of Li Xiannian''s report on the 1959 final accounts and the 1960 budget, circulated Mar. 16: some opinions to talk over with Li; some of the fifteen questions should be added. He adds that some in the ranks could not see the general trend and doubted the adjusted targets of 1959, and that the year''s results showed their doubts needless and wrong. Li adds to and revises the passage on the 1960 budget''s aims; he delivers the report Mar. 30; *Renmin ribao* prints it Apr. 1.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 132–135 (Mar. 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the day; between Mar. 16 and Mar. 30. To check: Li Xiannian, "Report on the 1959 final accounts and the draft 1960 budget", fourth draft, circulated Mar. 16, 1960 by the Central Committee General Office (cited by [[w.jianguo-yilai-mao-zedong]], XV, 133 n.1); Zhou Enlai for the State Council, report of Aug. 26, 1959 to the fifth enlarged session of the Standing Committee of the Second National People''s Congress adjusting the main targets of the 1959 plan (cited by [[w.jianguo-yilai-mao-zedong]], XV, 134 n.4). Names: Mao Zedong, Li Xiannian.'
