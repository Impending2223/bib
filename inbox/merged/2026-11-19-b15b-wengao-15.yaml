- add:
    entry:
      id: cal.1960-04-11.china-leadership-4
      when: Apr. 11
      date: '1960-04-11'
      thread: china-leadership
      c: 'The Center issues its instruction forwarding the Jilin request, drafted by Deng Xiaoping on Apr. 7: Jilin''s view deserves weight; a good harvest this year is of the first importance; every committee is to weigh the timing of the "three antis" in the countryside, put them in lulls between farm tasks, or, if spring work is too heavy, defer them until after it and do only trials meanwhile. Mao adds a line: where some places are already at the "three antis" and see that they do not hinder or even help production, they may decide to go on.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 151–152 (Apr. 11, 1960, with note 1). Made public: 2023. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], vol. 9, 1996) give it. To check: Deng Xiaoping, draft of Apr. 7, 1960 of the Center''s instruction forwarding the Jilin committee''s request (cited by [[w.jianguo-yilai-mao-zedong]], XV, 152 n.1b). See [[cal.1960-04-07.china-leadership-4]]. Names: Mao Zedong, Deng Xiaoping.'
