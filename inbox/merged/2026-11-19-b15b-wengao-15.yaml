- cite:
    id: cal.1960-03-22.china-leadership
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 105–108 (the Center''s comment of Mar. 22, from Mao''s draft, printed from the Central Committee document: Anshan, the largest enterprise in the country with over 100,000 staff, held before 1958 that it was modern and needed no technical revolution, opposed mass movements and the "two participations, one reform, three-in-one", favored one-man management and held the "Magnitogorsk constitution" sacred; in 1959 it began to doubt; its report of July 1959, which Mao had printed for the Lushan meeting, backed the Leap and the fight on Rightism; its report of Mar. 1960 is the third stage, an "Anshan constitution" for the Far East; to be passed to big and medium enterprises and city committees and studied through 1960)'
    units: B
