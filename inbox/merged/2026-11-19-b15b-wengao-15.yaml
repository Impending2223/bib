      date: '1960-03-08'
      thread: china-leadership
      c: 'Mao drafts the Center''s comment forwarding the Henan committee''s report on its five-level cadre conference: written very well, a programmatic and scientific document, for study and reference; every committee should make a scientific summary of its own work, at least four times a year, one a quarter, with special summaries too, report it to the Center and pass it down. He has it taken to Yang Shangkun for the Center''s review and forwarding. The Center dates it Mar. 10 on issue. The report: the conference, Feb. 4–19, took up the farm base and grain, the technical movement and the study of Mao''s writings.'
