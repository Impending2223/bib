      date: '1960-01-23'
      thread: china-leadership
      c: 'Mao to Zhou Enlai, on the Taiyuan municipal committee''s resolution (abstract) on a technical innovation and technical revolution movement, printed in *Qingkuang jianbao* no. 17: he proposes that the Center forward it in its own name to the provincial, municipal and regional committees and those of all medium-size cities, to study and follow. The resolution: 1960 industrial output planned up 47.2 percent on 1959; mechanization and semi-mechanization from 42 to 65–70 percent by the end of June; labor productivity up 50 percent; 40,000 to 50,000 workers saved for new units.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 24–26 (Jan. 23, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Taiyuan Municipal Committee, resolution (abstract) on a technical innovation and technical revolution movement centered on mechanization and semi-mechanization, printed in Qingkuang jianbao no. 17 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 24 n.1b). Names: Mao Zedong, Zhou Enlai.'
      tags:
