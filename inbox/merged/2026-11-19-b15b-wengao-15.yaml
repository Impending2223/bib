- add:
    entry:
      id: cal.1960-05-08.china-leadership-5
      when: May 8
      date: '1960-05-08'
      thread: china-leadership
      c: 'Mao, on Tan Zheng''s report of May 6 to Lin Biao: of Mao''s two wordings of the Resist-Japan University''s motto (1938 and 1939), the 1939 is better; he changes "hard struggle" in the second phrase, on work style, to "hard and plain". Returned to Tan Zheng. The three phrases: a firm and correct political direction; a hard and plain work style; a flexible strategy and tactics. The army''s political department means to propagate them with the eight words unity, tension, earnestness and liveliness.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 209 (May 8, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Tan Zheng to Lin Biao, copied to Mao, May 6, 1960, asking which wording of the Resist-Japan University''s three phrases on style (given by Mao in 1938 and 1939) is to be used (cited by [[w.jianguo-yilai-mao-zedong]], XV, 209 n.1). Names: Mao Zedong, Lin Biao.'
      tags:
