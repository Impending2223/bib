    item: '[[w.jianguo-yilai-mao-zedong]], XV, 198–199 (Mao''s comment on the digest of Apr. 26: "this text must be criticized", with his views on page 2; Yang Shangkun to arrange it with Deng Xiaoping and Chen Boda; an article, "A discussion with Comrade Kuusinen", is to be written, well founded and convincing, to criticize the errors in Kuusinen''s article, shown first to a few comrades of the Center and revised, then considered for open publication or for reading by senior Party cadres only; the digest''s points: dogmatism a backward stand, new weapons pressing toward peace, sober statesmen in the imperialist camp)'
    units: A-C
