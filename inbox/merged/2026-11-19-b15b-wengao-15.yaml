      c: 'Mao, on Deng Xiaoping''s note of Apr. 21 sending Liao Chengzhi and Liu Ningyi''s report of Apr. 17 on the Second Afro-Asian Peoples'' Solidarity Conference at Conakry: Yang Shangkun is to act on Deng''s view. Deng had written that the report tells so much that it might be printed for the Politburo and Secretariat, the central ministries and Party groups, and telegraphed to the provincial committees. The report: the conference, Apr. 11–15, with 72 Asian and African delegations and observers, was filled with opposition to imperialism and colonialism; the reactionary and revisionist positions were routed; the Chinese delegation, under Liao, with Liu as deputy, held a weighty place.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 179–180 (Apr. 22, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Liao Chengzhi and Liu Ningyi to the Central Committee, Apr. 17, 1960, report on the Second Afro-Asian Peoples'' Solidarity Conference at Conakry, Apr. 11–15, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 179 n.1); Deng Xiaoping, note of Apr. 21, 1960 on the Conakry report, proposing it be printed for the Politburo, the Secretariat, central ministries and Party groups and telegraphed to provincial committees (cited by [[w.jianguo-yilai-mao-zedong]], XV, 179 n.1b). Names: Mao Zedong, Deng Xiaoping.'
