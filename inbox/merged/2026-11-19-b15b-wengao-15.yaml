      c: 'Mao, on the Damascus consulate''s telegram of Jan. 4 on Nasser''s break with the Syrian Socialist Party, retitled "Nasser''s complete break with the Socialist Party": print for the comrades at the enlarged Politburo. He writes that class struggle is sharp, in the capitalist world without exception, and in the socialist world too.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 16–17 (Jan. 14, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Chinese Consulate General at Damascus to the Embassy in the United Arab Republic and the Foreign Ministry, telegram of Jan. 4, 1960, "Some views on the complete break between Nasser and the Socialist Party" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 16 n.1). Names: Mao Zedong, Nasser.'
