- add:
    entry:
      id: cal.1960-02-29.china-leadership-2
      when: Feb. 29
      date: '1960-02-29'
      thread: china-leadership
      c: 'Mao, on the Agriculture Ministry Party group''s report of Feb. 2 on the national conference on agricultural scientific research (held by the Academy of Agricultural Sciences, Dec. 1–20, 1959): Kang Sheng, Hu Qiaomu and Tian Jiaying to read it; Hu to telephone Tan Zhenlin, to have a Center document drafted sending the report to the academic bodies and Party committees at every level, down to the communes, to be carried out.'
