      c: 'Mao, on Nie Rongzhen''s letter to the Center of Mar. 16 and his report on the technical-revolution movement in the factories of Canton and Chongqing: a very good, systematic summary, sent to the comrades to study, consult and follow. The movement for technical and cultural revolution of the whole people in industry and transport, farming, forestry, herding and fishing, finance and trade, culture, education and health, and defense is growing fast; new people and deeds abound; he asks them to observe closely, sum up and spread them.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 121–122 (Mar. 25, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Nie Rongzhen to the Central Committee and Mao, Mar. 16, 1960, with the report "Some conditions of the mass technical-revolution movement in the factories of Canton and Chongqing (a short report of visits and inquiries)" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 121 n.1). Names: Mao Zedong, Nie Rongzhen.'
