- add:
    entry:
      id: cal.1960-03-22.china-leadership-5
      when: Mar. 22
      date: '1960-03-22'
      thread: china-leadership
      c: 'Mao, on Shandong''s six-level cadre conference bulletin no. 1 of Mar. 21: for the comrades to read; these problems exist in every province, municipality and region and, if not handled, will cut the Party off from the masses; Shandong''s 12,000-man conference, with six from each commune, seems the better way. The bulletin: cadres still hasty to pass to commune ownership; 70 sows taken from a brigade by a commune without payment; Zhanhua county''s first secretary says 500 have died of dropsy since the Spring Festival; at Jining a commune secretary says over 90 percent of the economic staff have embezzled, some over 1,000 yuan; offices, theaters and halls planned, to be stopped.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 116–118 (Mar. 22, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Shandong six-level cadre conference secretariat, Huiyi qingkuang no. 1, Mar. 21, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 118 n.2). Names: Mao Zedong.'
      tags:
      - polity:prc
