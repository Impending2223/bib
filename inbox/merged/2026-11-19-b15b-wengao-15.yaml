      when: Jan. 15
      date: '1960-01-15'
      thread: china-leadership
      c: 'Mao to Liu Songlin (Liu Siqi), a student of Russian at Peking University, the widow of his son Mao Anying, killed in Korea Nov. 25, 1950: he asks after her health and urges her to keep her ambition, to attend to politics and theory, and to hold her own for Mao Anying, for himself, for the people and for those who despise and hate her. He is well and thinks of her.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 18 (Jan. 15, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Names: Mao Zedong.'
      tags:
