- add:
    entry:
      id: cal.1960.china-leadership-6
      when: '1960'
      date: '1960'
      thread: china-leadership
      c: 'Mao to his second son Mao Anqing, who is being treated for illness at Dalian: glad to hear he is much better; he is to heed the doctors and rest, and not be impatient. His sister-in-law Siqi (Liu Songlin) and her younger sister Shaohua are coming to see him; he asks whether Anqing and Shaohua mean to be friends, calls her a good child and tells him to talk with her. Letters are to go by Siqi and Shaohua, or by Jiaojiao (Li Min); he is to thank the Dalian city committee and the medical teams, to whom the letter may be shown.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 200–201 (1960, undated; notes 1-4). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the day; the editors give only the year. Names: Mao Zedong.'
