      n: '[[w.jianguo-yilai-mao-zedong]], XV, 14–15 (Jan. 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the day; the note gives only that it went to the enlarged Politburo, Jan. 7–17. To check: Chinese Embassy in the German Democratic Republic to the Foreign Ministry, telegram of Nov. 4, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 14 n.1). Names: Mao Zedong.'
