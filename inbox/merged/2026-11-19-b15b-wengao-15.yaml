      when: Mar. 16
      date: '1960-03-16'
      thread: china-leadership
      c: 'Mao, 8 a.m., to Hu Qiaomu: how far has the revision of Li Fuchun''s report got? It must be done by Mar. 18, so that on the 19th and 20th Hu can help revise Li Xiannian''s, now being revised by Wu Lengxi; Chen Boda might first help Wu, to lighten Hu''s last two days. The reports are for the second session of the Second National People''s Congress, Mar. 30: Li Fuchun''s on the draft 1960 plan, Li Xiannian''s on the 1959 final accounts and the 1960 draft budget.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 99–100 (Mar. 16, 1960, 8 a.m.). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Names: Mao Zedong, Li Fuchun, Li Xiannian, Chen Boda.'
