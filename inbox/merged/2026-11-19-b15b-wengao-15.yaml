      when: Jan. 13
      date: '1960-01-13'
      thread: china-leadership
      c: 'Mao, on Wang Heshou''s Jan. 9 letter and the Metallurgy Ministry Party group''s report of Jan. 8 on the small modern-method steel enterprises, the *xiaoyangqun*: "very good", to be printed for the comrades at the enlarged Politburo for reference. The report: over 1,300 groups in regular production, 50,000-odd cubic meters of small blast furnaces, half of the 22 million tons of pig iron made in 1959; 400-odd to be raised into small steelworks, about 100 of them to reach 100,000 to 300,000 tons a year.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 12–13 (Jan. 13, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Wang Heshou, Party secretary of the Metallurgy Ministry, to Mao Zedong, Jan. 9, 1960, with the ministry Party group''s report of Jan. 8 on the xiaoyangqun (cited by [[w.jianguo-yilai-mao-zedong]], XV, 12 n.1a). Names: Mao Zedong.'
      tags:
