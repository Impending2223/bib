      when: Jan. 23
      date: '1960-01-23'
      thread: china-leadership
      c: 'Mao, at Hangzhou, on *Qingkuang jianbao* no. 17 of Jan. 11, its piece on seven provinces and municipalities and fourteen key enterprises: for the comrades with him, to be returned to Mao; he means to speak on the matter; a continuous Leap looks possible. The piece: first-quarter 1960 plans in Peking, Shanghai, Tianjin, Liaoning, Guangdong, Sichuan and Shaanxi are mostly no lower than the fourth quarter of 1959; four shortages remain, in materials, repair parts, large equipment and coordination.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 22–23 (Jan. 23, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the comrades, by the note, are Chen Boda, Hu Sheng, Deng Liqun, Tian Jiaying and Lin Ke, reading the Soviet *Political Economy* textbook with Mao at Hangzhou. To check: Qingkuang jianbao no. 17, "The first-quarter industrial production arrangements of seven provinces and municipalities and fourteen key enterprises" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 22 n.1). Names: Mao Zedong, Chen Boda.'
      tags:
