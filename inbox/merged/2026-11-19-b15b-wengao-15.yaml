      c: 'Mao, on the Central Committee Investigation Department''s internal digest *Taiwan Conditions* of Jan. 12: marks the titles of three pieces (the Chiang group''s worry that 1960 will be hard; the new U.S. "two Chinas" proposals around New Year; the failure of the American agent Tang Shenggao to win over Chen Cheng) and writes "well worth reading", "worth noting", "very worth noting". The second and third comments mark Taibei papers'' dread of pressure for talks and the "two Chinas" argument; the fourth, Nationalist fear of losing the U.N. seat to Africa''s new states.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 19–21 (Jan. 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the day; the digest is dated Jan. 12 and the comrades are those at the enlarged Politburo, Jan. 7–17. To check: Central Committee Investigation Department, Taiwan qingkuang (Taiwan Conditions), Jan. 12, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 20 n.1). Names: Mao Zedong, Chen Cheng.'
      tags:
