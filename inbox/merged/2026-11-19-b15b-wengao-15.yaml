- add:
    entry:
      id: cal.1960-01-12.china-leadership-3
      when: Jan. 12
      date: '1960-01-12'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, on the Jan. 9 digest of the Shubao jianxun she, "How the foreign bourgeoisie discusses the Sino-Soviet differences": print for the comrades at the enlarged Politburo to read and study, adding that it holds many fine pieces. He marks the headings of questions 1, 2, 4, 9, 10, 11 and 12 of its sixteen: Soviet fear of war against Chinese fearlessness of tension; trust in the U.S. against distrust; the nationalist states; the criticism of modern revisionism; which country enters communism first; Soviet anxiety at the Leap; the communes as a challenge to the Soviet leaders.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 8–9 (Jan. 12, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Shubao jianxun she, Diaocha ziliao, Jan. 9, 1960 (foreign bourgeois press comment on Sino-Soviet relations, sixteen questions) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 8 n.1). Names: Mao Zedong.'
      tags:
