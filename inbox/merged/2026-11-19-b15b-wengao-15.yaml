      c: 'Mao, Liu Shaoqi, Zhu De and Zhou Enlai telegraph Pieck, Ulbricht, Grotewohl and Dieckmann on the fifteenth anniversary of Germany''s liberation from fascism: the Soviet army''s defeat of Hitler; the GDR''s gains, the completion of farm cooperation among them; its part against American imperialism and West German militarism; China''s firm support of its struggle to reunify Germany on a peaceful and democratic basis.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 206–207 (May 7, 1960, printed from *Renmin ribao*, May 8). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Ulbricht.'
