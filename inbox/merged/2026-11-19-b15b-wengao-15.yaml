      c: 'Mao, on Bo Yibo''s report of Apr. 18 on the technical innovation and technical revolution movement: send it to the provincial committees, the committees of the big and medium cities and autonomous regions, and the central ministries and Party groups; Deng Xiaoping and Peng Zhen to read it, Yang Shangkun to see to it. The report: on the first three and a half months the year''s industrial output is certain to go on leaping; the movement has ten marks (of the whole people, all-round, mechanizing first, scientific, modern and native together, continuous revolution, and joined to revolutions in organization, ideas and culture); four tasks now.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 184–186 (Apr. 24, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Bo Yibo, report of Apr. 18, 1960 to Mao on the technical innovation and technical revolution movement, given for the State Economic Commission Party group at the industrial secretaries'' conference (cited by [[w.jianguo-yilai-mao-zedong]], XV, 184 n.1). Names: Mao Zedong, Bo Yibo, Deng Xiaoping, Peng Zhen.'
