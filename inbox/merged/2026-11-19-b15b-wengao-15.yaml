      date: '1960-04-20'
      thread: china-leadership
      c: 'Mao, on Hu Qiaomu''s covering letter of Apr. 15 with his draft of the Center''s instruction forwarding the Shanxi committee''s report on spreading Wanrong county''s phonetic-spelling literacy drive: for Liu, Deng and Peng Zhen to read, Yang Shangkun to telegraph it, and a copy to the central ministries. He adds three sentences: a year of effort through 1961 could finish the literacy task a year later than Shanxi; the instruction and annex may go in the Party journals. He retitles the Shanxi report as a report on spreading Wanrong''s experience so that Shanxi may become an illiteracy-free province in 1960.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 172–174 (Apr. 20, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Hu Qiaomu to Mao, Apr. 15, 1960, sending his draft of the Center''s instruction forwarding the Shanxi report (cited by [[w.jianguo-yilai-mao-zedong]], XV, 173 n.1b); Central Committee, draft instruction of Apr. 15, 1960 forwarding the Shanxi report on Wanrong''s phonetic-spelling literacy drive, issued Apr. 22 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 173 n.4); Shanxi Provincial Committee, report of Apr. 5, 1960 to the Center and Mao on spreading the phonetic-spelling literacy experience of Wanrong county (cited by [[w.jianguo-yilai-mao-zedong]], XV, 173 n.1). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
