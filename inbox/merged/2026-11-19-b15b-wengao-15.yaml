      date: '1960-03-02'
      thread: china-leadership
      c: Mao, 3 a.m., orders his confidential secretary Gao Zhi to print nine copies of the Guangdong committee's directive of Feb. 25 for Zhou Enlai, Li Fuchun, Kang Sheng, Hu Qiaomu and the five first secretaries studying at Conghua, to be discussed on the afternoon of Mar. 3 and spread in the provinces. At 6 a.m., having revised his Mar. 1 letter into the draft instruction forwarding the directive, he has nine copies of it printed for the same readers. The directive names five problems in the communes.
