      c: 'Mao, 6 a.m., to his secretary Lin Ke: find for him that day the second piece in the United Front Work Department''s *Lingxun* of Apr. 23, which tells of the secretaries of five big cities speaking on the people''s communes at the National People''s Congress; and Qian Xuesen''s motion on agricultural factories. The joint speech, by the secretaries of Peking, Shanghai, Tianjin, Wuhan and Canton, held the urban communes proved in big cities; Qian proposed experimental factories using the whole of modern science for farm production.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 181–183 (Apr. 24, 1960, 6 a.m.). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: United Front Work Department, Lingxun, Apr. 23, 1960, second piece: "The state of mind of Tianjin''s bourgeois, bourgeois intellectuals and their families in the present urban people''s commune movement" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 181 n.2); Wan Li, Cao Diqiu, Wan Xiaotang, Song Yiping and Zhu Guang, joint speech "Establishing urban people''s communes has great historic significance" to the second session of the Second National People''s Congress, Apr. 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 182 n.3); Qian Xuesen, motion to the second session of the Second National People''s Congress, Apr. 1960, on establishing experimental factories for agricultural production (cited by [[w.jianguo-yilai-mao-zedong]], XV, 182 n.4). Names: Mao Zedong.'
