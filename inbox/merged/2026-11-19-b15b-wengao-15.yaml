- cite:
    id: cal.1960-04.china-leadership-3
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 162–165 (Mao''s eight comments and insertions on the two drafts, the manuscript dated only April 1960: on the Tito passage, "not thorough, add a few sentences"; on the passage that a socialist army driven over the border by an attack would still leave the people''s own will to make revolution, "Southeast Asia: the West will sow discord", the passage to be rewritten so that socialist states never send armies over their borders except when attacked; "revisionism is the main danger"; "peace and war: two hands"; "sum up the points of each section at the head and the end"; on the 1957 Moscow Declaration''s passage on revisionism, "quite correct, this is how it is"; an insertion that every socialist state should master more and more of the new technologies, atomic energy and rockets, for the people''s welfare; an insertion that the revolutionary proletarian party must rely on the semi-proletariat of the countryside, the poor peasants, in a worker-peasant alliance; Chen Boda''s letters of Apr. 14 and 16)'
    units: A-C
