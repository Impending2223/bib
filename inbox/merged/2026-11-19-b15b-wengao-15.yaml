      when: Mar. 31
      date: '1960-03-31'
      thread: china-leadership
      c: 'Mao, on the Center''s draft instruction approving the Ningxia committee''s correction of grave errors in Zhongning county and the removal of the county''s leading members: Yang Shangkun to see to it; it may go in the Party journals; Mao adds a passage. The instruction: Zhongning is an isolated case but grave; false reports, hiding faults and retaliating against those who tell the truth are breaches of discipline not to be tolerated; every unit with such cases is to learn from it and deal with them at once and sternly. The Center issues it Mar. 31.'
