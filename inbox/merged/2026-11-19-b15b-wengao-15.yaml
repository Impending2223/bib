    witness: w.jianguo-yilai-mao-zedong
    reads: 'fifteen questions (the editors, XV, 133 n.2: the four modernizations; mess halls everywhere in town and country; urban communes everywhere; five problems of the rural communes; agriculture; industry; railways; support for agriculture by industry, transport, finance and trade, and culture and education; education; early fulfilment of the forty articles; the four pests; the three antis; cadres'' avoidance; foreign guests to see both good and bad; increased output and economy with comprehensive use)'
