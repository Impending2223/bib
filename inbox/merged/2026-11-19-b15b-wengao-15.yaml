      when: Feb. 15
      date: '1960-02-15'
      thread: china-leadership
      c: 'Mao, at Canton, 5 a.m., to his confidential secretary Luo Guanglu: buy that day at the Guangzhou bookstore the combined November–December 1959 number of *Zhexue yanjiu* (Philosophical Research) and bring it in the afternoon. He is at Canton reading the second volume of the Soviet *Political Economy* textbook, third edition revised, with Chen Boda, Tao Zhu, Hu Qiaomu, Hu Sheng, Deng Liqun and Tian Jiaying. The number, Dec. 10, 1959, holds Chen Boda''s article on the proletarian and bourgeois world outlooks and nine others.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 37–38 (Feb. 15, 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Zhexue yanjiu, nos. 11-12 combined, Dec. 10, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 37 n.3a). Names: Mao Zedong, Chen Boda, Tao Zhu.'
