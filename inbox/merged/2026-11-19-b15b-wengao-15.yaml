      date: 1960-03
      thread: china-leadership
      at: after 1960-03-05
      c: 'Mao, on the record of the Heilongjiang committee''s rural work department''s telephone report of Mar. 5 on the mess halls: he writes down the marks of a good hall: strong leadership; whole-people halls; vegetables and pigs; planned use of grain, quotas to households and grain to the hall, rations by person against tickets, savings kept, accounts made monthly and posted; production and living both strong. The report: a field meeting in Kedong county in late February; some 75 percent of halls year-round, 25 percent seasonal; about 90 percent labor-collective halls and 10 percent whole-people halls.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 101–102 (Mar. 1960). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the day; the report is dated Mar. 5. To check: Heilongjiang Provincial Committee Rural Work Department, telephone report of Mar. 5, 1960 on the state of the rural public mess halls (cited by [[w.jianguo-yilai-mao-zedong]], XV, 101 n.1). Names: Mao Zedong.'
