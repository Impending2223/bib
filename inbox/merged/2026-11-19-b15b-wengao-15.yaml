      when: Apr. 10
      date: '1960-04-10'
      thread: china-leadership
      c: 'Mao drafts the Center''s comment forwarding the Shanxi committee''s report of Apr. 6 on its six-level cadre conference: held very well; the problems exposed and the policies and methods set for them are correct; a systematic document, with proper treatment, for others to adopt as they see fit; it may go in the Party journals. He sends it to Liu, Deng, Peng Zhen and Tan Zhenlin, then Yang Shangkun to see to it. The report: five conditions for passing to commune ownership, not yet met, with 34 trial communes approved; 70 percent of communes had planned "levelling and transfers"; bans on feasts and gifts and on communal halls for three years.'
