      c: 'Washington. Rusk with Mongi Slim, Tunisia''s foreign minister, Ambassador Bourguiba with him: five conversations, by Stackhouse''s memoranda. On Tunisia''s relations with France, Slim: the Bizerte problem "on the way to solution," de Gaulle still "mysterious," France holding to rights of a colonial character from the Protectorate. Rusk: de Gaulle has decided to put France''s relations with all the Arab states on a solid, friendly basis.'
