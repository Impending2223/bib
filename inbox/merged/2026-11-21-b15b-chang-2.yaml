      id: cal.1963-07-20.testing
      when: July 20
      date: '1963-07-20'
      thread: testing
      c: 'Moscow. The tripartite plenary, a little more than an hour and a half, on the test ban alone; the non-aggression pact not raised, the communiqué giving only the usual "other matters of mutual concern." Gromyko''s new withdrawal clause: a party may withdraw if "extraordinary circumstances, related to the contents of this treaty, have jeopardized the supreme interests of its country," on three months'' notice; Harriman asks authority to accept it. The preamble agreed, on the American text.'
      n: '[FRUS 1961–63, VII, doc. 335](https://history.state.gov/historicaldocuments/frus1961-63v07/d335) (Harriman, telegram 233, 4 p.m.: the plenary and the withdrawal clause, which Khrushchev and Gromyko take to cover France for them and China for the United States). [FRUS 1961–63, VII, doc. 336](https://history.state.gov/historicaldocuments/frus1961-63v07/d336) (Harriman and Fisher, telegram 238, 7 p.m.: the preamble agreed at the plenary). [[w.chang-friends-and-enemies]], 245–46 (general agreement on a limited treaty within the first two days; on July 20 the three powers announce a tentative agreement on a limited ban, underground tests exempt, linked to no other agreement). Made public: FRUS 1961–63, VII (1995). To check: Rusk to the ambassador, Bonn (cable), July 18, Kohler to Bundy (cable), July 21, 1963, FOIA releases in Benjamin Loeb''s possession; the *New York Times*, July 20, 21, 1963, 1, 2 (cited by [[w.chang-friends-and-enemies]], 246 n.36a–d). See [[cal.1963-07-15.testing]]. Names: Gromyko, Harriman. Check: Chang has the three powers announce that day their tentative agreement; the delegation''s cables of the day report only the communiqué''s "usual reference" to other matters.'
      src:
        c: 7dadf0f4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v07/d335: A-E'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v07/d336: A, F'
        - 'w.chang-friends-and-enemies 245–46: ?'
