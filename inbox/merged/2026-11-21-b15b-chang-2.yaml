      c: 'Washington. Jenkins to Rostow, "DOD Interest in ChiRep": Halperin told him at lunch that a Defense memorandum on Chinese representation, for abandoning the old formula and pointing toward a "two China" policy, has been approved all the way through McNamara without discernible opposition; McNamara wants Defense in the deliberations, the present stand hurting relations with friends, Japan above all. A topic for the Tuesday luncheon?'
      n: '[FRUS 1964–68, XXX, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v30/d178) (Washington, Sept. 1, 1966). [[w.chang-friends-and-enemies]], 273 (the Defense Department decides to endorse moving toward a two-China policy in the United Nations; 273 n.42b). Made public: 1990 ([[w.chang-friends-and-enemies]], 273, the decision); the text, FRUS 1964–68, XXX (1998). See [[cal.1966.china-6]]. Names: Jenkins, Rostow, Halperin, McNamara.'
