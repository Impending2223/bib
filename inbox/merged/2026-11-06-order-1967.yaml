- edit:
    id: cal.1967-01-10.congress
    base: a3e223af
    set:
      n: 'H. Res. 1, 90th Cong. [113 Cong. Rec. 26–27](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt1/pdf/GPO-CRECB-1967-pt1-1-2.pdf) (1967); H.R. Rep. No. 27, 90th Cong., 1st Sess., 1–2 (1967), as given in *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 489–90 (1969) (K–J Cong. II.J.1). [[w.branch-at-canaans-edge]], 570. Order: at the oath, after the House convened and chose its Speaker (roll calls 1–3; [[cal.1967-01-10.rules]]). To check: [[w.hamilton-adam-clayton-powell-jr]]; [[w.haygood-king-of-the-cats]]; [[w.powell-adam-by-adam]]; [[w.congress-and-the-nation-1969]]; "Democrats Vote to Oust Powell As House Committee''s Chairman/ He May Be Kept from Seat Today," NYT, Jan. 10, 1967, p. 1 (cited by [[w.branch-at-canaans-edge]], 570); "Powell Denied House Seat Pending Five-Week Inquiry/ Vote Is 364-64," NYT, Jan. 11, 1967, p. 1 (cited by [[w.branch-at-canaans-edge]], 570); Jacobs, *The Powell Affair*
        (1973), 6–7 (cited by [[w.branch-at-canaans-edge]], 570). See [[cal.1967-01-03.congress]]. Names: Powell, Udall.'
      follows:
      - cal.1967-01-10.rules
- edit:
    id: cal.1967-01-10.program
    base: eb9712a2
    set:
      n: 'Annual Message to the Congress on the State of the Union, [1967 Pub. Papers 2](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=70) (Jan. 10, 1967). FRUS 1964–68, V, doc. [11](https://history.state.gov/historicaldocuments/frus1964-68v05/d11) (editorial note: the surcharge; Vietnam). [[w.dallek-flawed-giant]], 449–50 (the address on Vietnam); [[w.califano-triumph-and-tragedy-of]], 182–83 (the date chosen for Dirksen''s birthday and the television schedule; no applause for the surcharge; Robert Kennedy''s arms folded at the wiretapping passage; "We face more cost, more loss, and more agony"); [[w.zelizer-fierce-urgency-of-now]], 271 (the 6 percent surcharge to be asked: "slightly more than one-fourth of that tax cut"); [[w.berman-lyndon-johnsons-war]], 26–27 (Westmoreland''s view that the enemy could no longer succeed on the battlefield; "more cost, more loss, and more agony"; the surcharge, 6 percent); [[w.bernstein-guns-or-butter]], 367 (the surcharge,
        "to last for 2 years or for so long as the unusual expenditures associated with our efforts in Vietnam continue"); [[w.thomas-robert-kennedy]], 330 (all wiretapping and bugging to be banned but to protect national security; in the chamber Kennedy does not applaud, arms crossed); [[w.gibbons-u-s-government-and]], IV, 547 ("a time of testing"). Order: the address to the new Congress in joint session, after it convened and acted on Powell that day ([[cal.1967-01-10.rules]]; [[cal.1967-01-10.congress]]). See [[cal.1966-01-12.program]]. Names: Johnson.'
      follows:
      - cal.1967-01-10.rules
      - cal.1967-01-10.congress
