- check:
    id: cal.1960-11-05.elections-1960-kennedy
    text: 'Check: the afternoon; Goodwin has O''Donnell tell him at the Biltmore, near 6 p.m., "we spent the whole afternoon riding around the Bronx" ([[w.goodwin-remembering-america]],
      127–28); [[w.communications-freedom-of-communications-part]] has the Bronx stops before the Queens luncheon (899–902), a Queens rally at "2:15 in the afternoon" (904) and Nassau
      County "on a Saturday afternoon" (905); O''Donnell has the Long Island suburbs last before the Biltmore ([[w.odonnell-johnny-we-hardly-knew]], 246).'
