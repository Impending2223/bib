- edit:
    id: cal.1960-11-05.elections-1960-2
    base: 5d0d6745
    set:
      c: 'New York, midnight, outside the Coliseum, in the rain. Kennedy''s turn on "Nixon Day in New York," at Stevenson''s suggestion: the elephants in the circus, each with the tail
        of the one before;{1} "Dick grabbed that tail in 1952 and 1956"; Nixon stands where McKinley, Taft, Harding, Coolidge, Landon and Dewey stood.{2}'
      n: '[[w.white-making-of-the-president]], 329 (heard by White, "at midnight in New York on November 5th to a street-corner audience in the rain"); [[w.communications-freedom-of-communications-part]],
        908–09 (outside the Coliseum, New York, Nov. 5, in rain, with Johnson, Mrs. Johnson and their daughters: the circus elephants, "Dick grabbed that tail in 1952 and 1956"; "Dick
        Nixon stands where McKinley stood and Taft," Harding, Coolidge, Landon, Dewey; "I understand that Tom Dewey has just joined Dick Nixon out on the coast"; Waterbury "at 1 in the
        morning" to come; not midnight, "Nixon Day" or Stevenson''s suggestion). The place: the words White quotes, the elephants, "Dick grabbed that tail in 1952 and 1956," and "I stand
        tonight where Woodrow Wilson stood," are those of the remarks outside the Coliseum ([[w.communications-freedom-of-communications-part]], 908–09), not of the 90th Street rally,
        whose elephants run otherwise (906–07). See [[cal.1960-10-31.elections-1960]]. Names: Kennedy, Stevenson, Nixon. Check: the hour; White has Kennedy back in New England, at the
        Bridgeport airport, at "12:30 in the morning" of Nov. 6 ([[w.white-making-of-the-president]], 338), and Goodwin the Coliseum speech some two hours after 6 p.m. ([[w.goodwin-remembering-america]],
        127–29).'
      src:
        c: cd7b07e5
        rows:
        - 'w.white-making-of-the-president 329: 1, 2'
        - 'w.communications-freedom-of-communications-part 908–09: 2'
    kind: correct
    settles:
    - 'Check: the place'
