      thread: elections-1960-chicago
      c: 'Chicago to Hyannis Port, after midnight. Daley to O''Donnell, at three in the morning by O''Donnell''s account: "We''re trying to hold back our returns. Every time we announce
        two hundred more votes for Kennedy in Chicago, they come up out of nowhere downstate with another three hundred votes for Nixon."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 252 ("At three o''clock in the morning" the outcome rests on four States; "Mayor Daley telephoned me from Chicago"; O''Donnell''s and
        Powers''s account); [[w.cohen-american-pharaoh]], 265 (Daley "later called" O''Donnell). The hour: "three o''clock in the morning" (252), at Hyannis Port, on O''Donnell''s clock:
        Nov. 9. See [[cal.1960-11-08.elections-1960-chicago]]. Names: Daley, O''Donnell.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
      - name:odonnell-kenneth-p
