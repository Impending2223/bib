      c: The President-elect to the Massachusetts Legislature and the Harvard Overseers.{2} The address is his "Farewell to Massachusetts," drafted by Sorensen.{5}
      n: '[[w.schlesinger-thousand-days-1965]], 162 (Kennedy "came to Cambridge to address the Massachusetts Legislature and attend a meeting of the Harvard Board of Overseers," then,
        "After luncheon," to Schlesinger''s house); [[w.odonnell-johnny-we-hardly-knew]], 274 (the Massachusetts legislature, the Harvard Overseers, then the meeting at Schlesinger''s
        house); [[w.sorensen-kennedy]], 233–34 (the legislature; the Overseers); [[w.sorensen-counselor]], 219–20 (Kennedy''s "Farewell to Massachusetts," delivered Jan. 9, drafted by
        Sorensen at the height of the transition; the "city upon a hill" from Winthrop and questions on integrity borrowed from Roosevelt; Kennedy''s parents thought it should have been
        kept for the inaugural; not Cambridge, the Overseers or the other business of the day); [[w.schlesinger-journals]], 102 (the afternoon at 109 Irving Street, arrival about 2:20,
        departure "shortly after 5"; not the Legislature or the Overseers); [[w.sorensen-counselor]], 219. Split under R25b: the afternoon at Schlesinger''s house is [[cal.1961-01-09.transition-and-staff-2]];
        no page read gives an hour for the address or the Overseers ([[w.odonnell-johnny-we-hardly-knew]], 274; [[w.schlesinger-thousand-days-1965]], 162, has them before "luncheon").
        See [[cal.1960-11-09.transition-and-staff]]. Names: Kennedy, Sorensen. Check: the address''s text.'
