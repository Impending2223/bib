        it will be all right.{2}'
      n: '[[w.cohen-american-pharaoh]], 265 (Daley to Robert Kennedy "around 1:00 a.m.," Cohen writes, naming White); [[w.white-making-of-the-president]], 23 (Robert Kennedy "took or
        made" the calls, "calls to Dick Daley in Chicago," who said not to worry; no hour: the "about one a.m." on that page is Eisenhower''s wire); [[w.odonnell-johnny-we-hardly-knew]],
        252 (Daley''s call to O''Donnell after three in the morning: "We''re trying to hold back our returns. Every time we announce two hundred more votes for Kennedy in Chicago, they
        come up out of nowhere downstate with another three hundred votes for Nixon"). Turnout in Chicago 89.3 percent (Cohen, 264–65). The hour: none; White, whom Cohen cites, gives
        the calls none (23), and the time field set from Cohen''s "around 1:00 a.m." is taken out, Cohen''s reading a variant. Split under R25b: Daley''s call to O''Donnell, three in
        the morning of Nov. 9, is [[cal.1960-11-09.elections-1960-chicago]]. Names: Daley, Robert Kennedy. Check: the hour of Daley''s calls to Robert Kennedy; Cohen''s "around 1:00
        a.m." is not on White''s page.'
