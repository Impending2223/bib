        (Nov. 7, 1960). Remarks of Senator John F. Kennedy, Park, Manchester, NH, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-park-manchester-nh) (Nov.
        7, 1960). [[w.sorensen-kennedy]], 210; [[w.white-making-of-the-president]], 341–44 (the New England day; the Boston Garden; Faneuil Hall at eleven, Nielsen 17.7); [[w.communications-freedom-of-communications-part]],
        938–41 (the remarks at the park, Manchester, N.H., with his three sisters Jean Smith, Eunice Shriver and Patricia Lawford; 939: "there is a publisher who has less regard for
        the truth than William Loeb, but I can''t think of his name"); [[w.communications-freedom-of-communications-part]], 941–50 (the television program, Manchester, N.H., with Gov.
        Hodges of North Carolina: his three sisters read him the questions; the report does not say nationwide); [[w.communications-freedom-of-communications-part]], 950–53 (the speech
        at the Boston Garden); [[w.communications-freedom-of-communications-part]], 953–58 (Faneuil Hall, "Eleven o''clock, election eve": the program of Citizens for Kennedy-Johnson,
        Johnson from Austin, Tex.; 956 Mrs. Kennedy at Hyannis Port: "The doctor wouldn''t let me leave Hyannis Port tonight"; 957, messages "recorded on film" shown; 958, "live from
        Austin, Tex., Hyannis Port, and Faneuil Hall"); [[w.obrien-no-final-victories]], 94 (Boston the night before the election: hours from the airport to the hotel to the Garden through
        the crowd, the car so dented it is scrapped; the Garden''s "explosion" of shouting; not Manchester or Faneuil Hall). Split under R25b and R17: the program''s own announcement
