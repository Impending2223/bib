      c: Kennedy names Williams Assistant Secretary of State for African Affairs, that morning.
      n: 'The hearing: *Nominations of Murat W. Williams, George W. Ball, Roger W. Jones, and G. Mennen Williams: Hearing Before the S. Comm. on Foreign Relations*, 87th Cong. (1961)
        ([online](https://www.govinfo.gov/app/details/CHRG-87shrg64718)), 2 (Williams, Jan. 24). [[w.schlesinger-thousand-days-1965]], 129–30 (Kennedy to Schlesinger, whom he saw in
        Washington on Dec. 1: "He had announced Williams''s appointment as Assistant Secretary of State for Africa that morning"; Williams passed over for Health, Education, and Welfare);
        [[w.wofford-of-kennedys-and-kings]], 85 (Williams "picked and announced as Assistant Secretary of State for Africa even before Rusk was chosen"; passed over for HEW; not the
        day). The hour: "that morning" (130). See [[cal.1960-12-01.transition-and-staff]], which holds the day''s bibliography. Names: Kennedy, Williams.'
      tags:
      - name:kennedy-john-f
      - name:williams-g-mennen
- add:
    entry:
      id: cal.1961-01-09.transition-and-staff-2
      when: Jan. 9
      date: '1961-01-09'
      time: 1961-01-09T19:20Z
      time_approx: true
      time_zone: America/New_York
      place: cambridge-ma
      thread: transition-and-staff
      c: Cambridge, Schlesinger's house. Bundy settles his post as Special Assistant for National Security Affairs; Chayes takes the Legal Adviser's; Wiesner on science adviser; the
        tax task force reports. Seaborg offered the AEC by telephone. Schlesinger to the White House, unannounced till Bowles is confirmed. Kennedy is at the house from about 2:20 to
        shortly after 5, about 300 people in the cold outside; after Schlesinger, 2:30 to 3:30, Surrey's tax task force, Chayes, Bundy, Stratton and Wiesner see him.
      n: '[[w.schlesinger-thousand-days-1965]], 162 ("After luncheon he set up headquarters in my house on Irving Street"; Bundy to complete the arrangements for Special Assistant for
        National Security Affairs; Chayes agrees to be Legal Adviser; Wiesner on Science Adviser; the tax task force reports; "In the middle of the afternoon" Bundy gets Seaborg on the
        telephone and Kennedy offers him the AEC; Schlesinger asked to the White House, nothing said "until Chester Bowles is confirmed"); [[w.schlesinger-journals]], 102 (109 Irving
        Street, "in the afternoon": JFK''s "arrival at about 2:20 and his departure shortly after 5," about 300 people; with Schlesinger "from about 2:30 to 3:30," then the tax task
        force under Surrey, Chayes, Bundy, Stratton and Wiesner; Bundy''s idea of Seaborg for the AEC, telephoned from the house); [[w.odonnell-johnny-we-hardly-knew]], 274 (the meeting
        with Bundy and Wiesner; Schlesinger signed, "We''ll keep your appointment quiet until after the Senate confirms Chester Bowles"). The hour: arrival "about 2:20" (Journals, 102).
        The order: after [[cal.1961-01-09.transition-and-staff]], [[w.schlesinger-thousand-days-1965]], 162 ("After luncheon"). See [[cal.1961-01-09.transition-and-staff]], which holds
        the day''s bibliography. Names: Kennedy, Bundy, Chayes, Wiesner, Seaborg, Schlesinger, Bowles, Surrey.'
      tags:
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:chayes-abram
      - name:wiesner-jerome-b
      - name:seaborg-glenn-t
      - name:schlesinger-arthur-m-jr
      - name:bowles-chester
      - name:surrey-stanley-s
      - state:ma
      follows:
      - cal.1961-01-09.transition-and-staff
