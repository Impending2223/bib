        295 (Dec. 9, 1960; 下午); [[w.lengxi-shinian-lunzhan-1956-1966]], 438 (Liu left Irkutsk by air in the afternoon and reached Peking very late; Mao, the Standing Committee, the whole
        Politburo, the NPC Standing Committee''s chairman and vice-chairmen and the heads of the democratic parties were at the airport); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II,
        499 (Dec. 9, 1960; Liu back in Peking; Mao, Zhu De, Zhou Enlai and others meet him at the airport; that day Mao convenes a meeting and hears Liu''s report on his visit to the
        USSR and the Moscow conference); [[w.deng-xiaoping-nianpu-1904]], III, 1604 (Dec. 9, 1960; afternoon; Deng, with Mao, Zhou, Zhu De and Chen Yun, meets Liu at the airport; evening
        (晚), Deng at Mao''s meeting hearing Liu on the conference of the eighty-one parties and his visit to the Soviet Union); [[w.mao-zedong-zhuan]], V, ch. 66 (Dec. 9: Liu Shaoqi
        back at Peking; Mao, Zhu De, Zhou Enlai and others meet him at the airport). [[w.chen-yi-nianpu]], 847 (Dec. 9, 1960, 6:40 p.m.; Chen Yi at the airport to welcome Liu Shaoqi
        and the Party and government delegation back from the Soviet Union); [[w.peng-zhen-nianpu-1902]], IV, 83 (Dec. 9, 1960, afternoon; Peng Zhen, with Mao, Zhou Enlai, Zhu De, Chen
        Yun, Deng Xiaoping, Li Fuchun and others, at the capital airport to meet Liu Shaoqi''s delegation, Li Jingquan, Lu Dingyi, Yang Shangkun and Liu Ningyi on the same plane); [[w.zhu-de-nianpu-xinbian]],
        III, 1789 (Dec. 9, 1960; Zhu De 朱德, with Mao Zedong 毛泽东, Zhou Enlai 周恩来, Chen Yun 陈云, Deng Xiaoping 邓小平 and others, at the airport to welcome Liu Shaoqi''s 刘少奇 delegation back
        from the October celebrations, the conference of the parties and the visit to the Soviet Union); [[w.chen-yun-nianpu-xiuding]], III, 58 (afternoon: Chen Yun with Mao, Zhou Enlai,
