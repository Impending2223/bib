    set:
      c: 'Peking to Moscow, by telephone, after Mao''s meeting on the delegation''s telegram. Zhou Enlai calls Deng Xiaoping at the Chinese embassy at Moscow.{1} He asks how the delegation
        lives, then says one thing: it has been discussed, the Center agrees with your view.{2} Nothing more, the Soviets listening.{3}'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 16, 1960 (the evening meeting in the Huairen Tang''s lounge on the delegation''s telegram of Nov. 15, 11 p.m., Moscow; "会后，周恩来即打电话给邓小平，转告中央常委的意见");
        [[w.lengxi-shinian-lunzhan-1956-1966]], 387 ("the next morning"; whose clock not stated; the call to Yang Shangkun, the delegation''s life asked after, "已商量过，同意你们的意见," the Soviets
        listening); [[w.yang-shangkun-riji]], I, 607 (Nov. 16, 1960; at the embassy after the session Deng reports his call with Zhou: the Standing Committee agrees with the delegation''s
        request of the day before, to plan for the worst, the delegation to decide; the Politburo to meet the next day); [[w.deng-xiaoping-nianpu-1904]], III, 1598–1599 (Nov. 16, 1960;
        Deng and Zhou Enlai by telephone on the line for signing; Zhou: the Standing Committee agrees with the delegation''s request of the 15th, the worst to be prepared for, the delegation
        to decide); [[w.peng-zhen-nianpu-1902]], IV, 75 (Nov. 16, 1960; the delegation receives Zhou''s reply (a cable, so the page): the Standing Committee agrees with the delegation''s
        request of the day before, all to be planned for the worst, the delegation to decide with full powers; the Politburo to meet the next day). The hour and the caller''s end: the
        Mao nianpu has Zhou telephone Deng "after the meeting," which it puts in the evening at Peking; Yang''s diary has Deng report the call at the embassy after the day''s session;
        Deng''s nianpu has Deng on the line: not the morning, nor Yang Shangkun, as Wu has it (variants). The order against Deng''s two evening talks at the embassy ([[cal.1960-11-16.china-leadership-7]],
        [[cal.1960-11-16.china-leadership-8]]) is left open: Deng''s nianpu prints the call after them (III, 1598–99), Yang''s diary has it reported at the dinner after the session (I,
        607). Made public: 1999. See [[cal.1960-11-15.china-leadership-4]]. Names: Zhou Enlai, Deng Xiaoping.'
