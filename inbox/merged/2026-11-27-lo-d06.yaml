      c: 'Chicago. The election-eve telecast, on the air at 9:30 p.m. Central: Eisenhower speaks first from Washington, then Lodge from Boston, then Nixon, who asks all to vote with
        "America first" in mind. Over at ten.'
      n: 'Radio and Television Remarks on Election Eve, [1960–61 Pub. Papers 852](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=904) (Nov. 7, 1960).
        [[w.nixon-six-crises]], 373–74 (by Nixon''s account: "scheduled to go on the air at 9:30 Central Time"; Eisenhower from Washington, then Lodge from Boston; Nixon''s closing;
        "The program was over at ten"); [[w.white-making-of-the-president]], 312 (the "three-way half-hour hookup between Nixon, Eisenhower and Lodge," repeated over ABC and NBC from
        11:30 to midnight; its hour a variant). The hour: 9:30 p.m. Central, the schedule (373). The order: after [[cal.1960-11-07.elections-1960-6]], Nixon at the studio before the
        broadcast (373). See [[cal.1960-11-07.elections-1960]], which holds the day''s bibliography. Names: Nixon, Eisenhower, Lodge. Check: whether the President''s remarks (Pub. Papers
        852) are his part of the half hour with Nixon and Lodge.'
      tags:
      - name:nixon-richard-m
      - name:eisenhower-dwight-d
      - name:lodge-henry-cabot
      - city:chicago
