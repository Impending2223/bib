        report that evening, at Mao''s meeting, is [[cal.1960-12-09.china-leadership-11]] ([[w.zhou-enlai-nianpu-1949]], II, 378). Made public: 1993. Names: Mao Zedong, Zhou Enlai, Zhu
        De, Chen Yun, Deng Xiaoping, Liu Shaoqi.'
