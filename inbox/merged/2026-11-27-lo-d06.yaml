      c: After the telethon, Dewey on television for Nixon, fifteen minutes from 6:30 p.m. Eastern, at an estimated $35,000 to $40,000.
      n: '[[w.white-making-of-the-president]], 312 ("Nixon was followed at 6:30 (EST) for fifteen minutes by Governor Thomas E. Dewey, at an estimated cost of $35,000 to $40,000"). The
        hour: "6:30 (EST)" (312). See [[cal.1960-11-07.elections-1960]], which holds the day''s bibliography. Names: Dewey, Nixon.'
      tags:
      - name:dewey-thomas-e
      - name:nixon-richard-m
