        311–13 (the telethon from Detroit, "On Monday afternoon," the costs as estimated; Dewey at 6:30; the half-hour of the three at eleven). [[w.nixon-six-crises]], 371–74 (the telethon
        from WXYZ-TV, Detroit, "four-hour afternoon," Lodge from Boston by split screen; the election-eve telecast from Chicago, Eisenhower from Washington, Lodge from Boston). [[w.gifford-center-cannot-hold]],
        161 (the sit-ins). The hours: the telethon, "a four-hour afternoon" show, ended "At six, Eastern Time" ([[w.nixon-six-crises]], 372). Split under R25b: Dewey''s quarter hour
