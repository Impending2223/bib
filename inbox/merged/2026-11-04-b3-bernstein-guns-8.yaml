      when: Jan.
      date: 1967-01
      thread: welfare
      c: 'Cohen with Mills and other members on the financing: the new benefits about 1.5 percent of payrolls, half under
        the present law; the earnings base from $6,600 to $7,800 in 1968, $9,000 in 1971, $10,800 in 1974; the rate to 4.5
        percent in 1969, 5 percent in 1973. Mills hopes for hearings in February. The AFL-CIO for the bill; Wickenden to
        coordinate the welfare agencies.'
      n: '[[w.bernstein-guns-or-butter]], 432. To check: Cohen to Cater, Jan. 12 and 13, 1967, Cater Papers, LBJ Library
        (cited by [[w.bernstein-guns-or-butter]], 432 n.3). Check: the days. See [[cal.1967-01-23.welfare]]. Names: Cohen,
