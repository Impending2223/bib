      when: Dec. 13
      date: '1967-12-13'
      thread: democratic-party
      also:
      - welfare
      c: 'Afternoon. Muskie calls the Democratic Senate Campaign Committee, 25 Senators, on the filibuster Harris and Robert
        Kennedy proposed against the social security conference report. Mansfield against: by Manatos''s account, they lack
        the votes "by the widest of margins." Bible, Church, McGovern, Mondale: they would suffer for it in 1968. Muskie:
        it would inflame Negro militants and alienate 24 million old people. Clinton Anderson: "suicidal." Ervin, Aesop''s
        dog and the bone. No filibuster.'
      n: '[[w.bernstein-guns-or-butter]], 437. To check: Manatos to Johnson, Dec. 13, 1967, EX LE/WE, LBJ Library (cited
        by [[w.bernstein-guns-or-butter]], 437 n.4). See [[cal.1967-12-11.welfare]]. Names: Muskie, Harris, Robert Kennedy,
        Mansfield, Manatos, Bible, Church, McGovern, Mondale, Anderson, Ervin.'
