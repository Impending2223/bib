- add:
    entry:
      id: cal.1965-12.jobs-and-wages
      when: Dec.
      date: 1965-12
      thread: jobs-and-wages
      c: 'Two proposals on the minimum wage. Ackley and Connor, the 3.2 percent guidepost: the 26 million covered before
        1961 from $1.25 to $1.40 in 1966, $1.50 in 1968, $1.60 in 1970; those covered in 1961 and the 4.6 million to be
        covered to $1.60 by 1972. Wirtz: $1.40 in 1966, $1.60 in 1967 for the first; $1.60 within four years for the others;
        the Council''s 1963 Economic Report for "faster increases in wage rates" where pay is exceptionally low.'
      n: '[[w.bernstein-guns-or-butter]], 428–29. To check: Wirtz to Califano, Dec. 14, 1965, Legislative Background, Minimum
        Wage, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 431 n.2); Economic Report of the President, 1963, 86
        (cited by [[w.bernstein-guns-or-butter]], 431 n.2). Check: the days. See [[cal.1965-12-01.jobs-and-wages]]. Names:
        Ackley, Connor, Wirtz.'
      tags:
      - name:ackley-gardner
      - name:connor-john-t
      - name:wirtz-w-willard
      src:
        c: e4b7209e
        rows:
        - 'w.bernstein-guns-or-butter 428–29: all'
        - 'via x.1965-12-14.wirtz-to-califano-minimum-wage-file: C'
        - 'via x.1963-01.economic-report-of-the-president-1963: C'
