      date: '1967-10-17'
      thread: welfare
      c: 'Cohen to Johnson: Long brought around to the administration''s benefits and taxes, "because he wants an increase
        in benefits, wants to be fiscally responsible in covering the cost and because he wants something to bargain with
        Wilbur Mills in Conference." John Williams likely with them.'
      n: '[[w.bernstein-guns-or-butter]], 434. To check: Cohen to Johnson, Oct. 17, 1967, EX LE/WE, LBJ Library (cited by
