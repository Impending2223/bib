      thread: welfare
      c: 'Ways and Means reports H.R. 12080: 12.5 percent for all 23.7 million beneficiaries; the minimum from $44 to $50;
        higher rates on a larger earnings base. Aid to dependent children rewritten: adults and older children out of school
        to work or training, mothers'' children to day care, a "freeze" on the numbers.'
      n: '[[w.bernstein-guns-or-butter]], 433–34. To check: CQ Almanac, 1967, 892–916 (cited by [[w.bernstein-guns-or-butter]],
