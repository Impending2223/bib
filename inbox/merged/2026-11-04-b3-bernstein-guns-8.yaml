        the minimum''s help to the poor not enough to justify them.'
      n: '[[w.bernstein-guns-or-butter]], 429. To check: Ackley to Califano, Jan. 31 and Feb. 4, 1966, Legislative Background,
        Minimum Wage, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 431 n.2). Check: which of the two memoranda.
        See [[cal.1965-12-01.jobs-and-wages]]. Names: Ackley, Califano.'
      tags:
