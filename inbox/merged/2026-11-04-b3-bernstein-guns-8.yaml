      when: Nov. 14
      date: '1967-11-14'
      thread: welfare
      c: 'Senate Finance reports H.R. 12080 with amendments, 11 to 6, by party; John Williams against. The administration''s
        benefits restored: 15 percent across the board, 20 percent on the average, a $70 minimum; the earnings base to $10,800
        in 1972. The House''s welfare freeze and coercion out; those certified to work to a new Labor Department training
        program.'
      n: '[[w.bernstein-guns-or-butter]], 435. To check: CQ Almanac, 1967, 892–916 (cited by [[w.bernstein-guns-or-butter]],
