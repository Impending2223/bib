        437 n.4). Check: the Daily Digest has the committee order H.R. 12080 reported Aug. 3 ([D394](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=392)).
