      - welfare
      c: 'The AFL-CIO against the social security conference report: the fight to be in the Senate, a filibuster. Meany
        telegrams every member of Congress. Nineteen governors, eleven Democrats and eight Republicans, on record against
        the freeze; Lindsay gathering the big-city mayors.'
