      when: May 21
      date: '1965-05-21'
      thread: program
      c: 'Lady Bird Johnson''s luncheon for the Hirshhorns, Ripley, Stevens, Harris and Fortas. Stevens: the museum about
        $10 million. Johnson comes in: "Joe, you don''t need a contract. Just turn the collection over to the Smithsonian
        and I''ll take care of the rest." Harris: "We ought to think about it"; to Fortas, after: "Over my dead body are
        you going to get this collection without the conditions written into the contract and a statute passed."'
      n: '[[w.bernstein-guns-or-butter]], 447–48 (Fortas''s recollection; Harris''s words). [[w.johnson-white-house-diary]],
        275–76, as quoted by [[w.bernstein-guns-or-butter]], 448 (Johnson''s thanks). To check: Barry Hyams, *Hirshhorn:
        Medici from Brooklyn* (1979) (cited by [[w.bernstein-guns-or-butter]], 451 n.4). See [[cal.1965-05-17.program]].
        Names: Lady Bird Johnson, Fortas, Johnson.'
