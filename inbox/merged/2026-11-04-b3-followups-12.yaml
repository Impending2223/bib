patch: b3-followups-12
by: 'Claude (merger, Nov. 4, 2026): the pinpoints notes/book-checks/westmoreland-soldier-reports.md held for entries then
  pending'
ops:
- cite:
    id: cal.1964-01-30.vietnam
    item: '[[w.westmoreland-soldier-reports]], 63 (the coup, bloodless; Westmoreland with Harkins at MACV through the night;
      neither Lodge nor Harkins interferes)'
    units: A-B
- cite:
    id: cal.1964-08-16.vietnam
    item: '[[w.westmoreland-soldier-reports]], 71–72 (the Vũng Tàu charter, briefed by Khánh at Vũng Tàu to Taylor and Westmoreland;
      the Military Revolutionary Council to elect Khánh president)'
    units: A-B
- cite:
    id: cal.1964-08-27.vietnam
    item: '[[w.westmoreland-soldier-reports]], 72 (the charter withdrawn; Khánh to Dalat, Oánh in his place; Westmoreland
      to Dalat at Taylor''s request, Khánh promising to return)'
    units: A, C
- cite:
    id: cal.1964-09-13.vietnam
    item: '[[w.westmoreland-soldier-reports]], 73–74 (the coup of Phát, Đức and Colonel Huỳnh Văn Tôn; Westmoreland and U.
      Alexis Johnson at MACV''s command post; Kỳ''s planes over the city; no support for the plotters)'
    units: A-B, D
- cite:
    id: cal.1964-10-24.vietnam
    item: '[[w.westmoreland-soldier-reports]], 92 (the council''s civilian government, Oct. 24; Sửu for Minh; Hương Prime
      Minister; Khánh head of the armed forces)'
    units: A-B, D
- cite:
    id: cal.1964-11-01.vietnam
    item: '[[w.westmoreland-soldier-reports]], 88, 111 (the attack; Westmoreland, with Taylor, for a reprisal; Washington
      against it two days before the election)'
- check:
    id: cal.1964-11-01.vietnam
    text: 'Check: Westmoreland gives two Americans and four Vietnamese killed and five B-57s destroyed (88).'
- cite:
    id: cal.1964-12-20.vietnam
    item: '[[w.westmoreland-soldier-reports]], 94 (the council dissolved in the night; Taylor to Thiệu, Thi, Kỳ and Cang:
      "Do you understand English?")'
    units: all
- cite:
    id: cal.1964-12-24.vietnam
    item: '[[w.westmoreland-soldier-reports]], 89, 113 (the bomb; Taylor and Westmoreland for a reprisal; Washington''s refusal;
      Johnson''s cable to Taylor, for Rangers and Special Forces rather than bombing)'
- check:
    id: cal.1964-12-24.vietnam
    text: 'Check: Westmoreland gives two killed, a Navy officer and a civilian, and more than a hundred wounded, sixty-six
      of them Americans (89).'
- cite:
    id: cal.1965-01-27.vietnam
    item: '[[w.westmoreland-soldier-reports]], 96 (the council ousts Hương''s government at Khánh''s bidding, Taylor away;
      Oánh acting)'
    units: A-C
- cite:
    id: cal.1965-02-22.vietnam
    item: '[[w.westmoreland-soldier-reports]], 123 (Throckmorton for a brigade; Westmoreland asks two battalions, a third
      offshore; Taylor objects, accepts one, then both)'
    units: A-B
- cite:
    id: cal.1965-03-02.vietnam
    item: '[[w.westmoreland-soldier-reports]], 118 (the campaign begins Mar. 2)'
    units: A
- cite:
    id: cal.1965-03-08.vietnam
    item: '[[w.westmoreland-soldier-reports]], 124–25 (the landing, the officials and the girls with leis; Taylor''s anger
      at not being told the hour)'
    units: A-B, D
- cite:
    id: cal.1965-04-06.vietnam
    item: '[[w.westmoreland-soldier-reports]], 131 (the NSC''s meetings of Apr. 1-2, Taylor there; the enclaves as an interim
      measure; two more Marine battalions, engineers and logistical troops; offensive operations within fifty miles of the
      bases)'
    units: A-C
- cite:
    id: cal.1965-06-07.vietnam
    item: '[[w.westmoreland-soldier-reports]], 140 (the message: the North will commit what it must "to tip the balance";
      the battalions asked)'
    units: A-D
- cite:
    id: cal.1965-07-28.vietnam
    item: '[[w.westmoreland-soldier-reports]], 143 (the decision, the reserves not called; the announcement quoted)'
    units: B-C, E
- cite:
    id: cal.1965-08-18.vietnam
    item: '[[w.westmoreland-soldier-reports]], 155–56 (the operation; some 700 Viet Cong dead)'
    units: A-B
- cite:
    id: cal.1965-11-14.vietnam
    item: '[[w.westmoreland-soldier-reports]], 157–58 (Moore''s battalion; B-52s in direct support for the first time; Westmoreland
      at the battalion''s critique, Moore for the M-16)'
    units: A-B
- check:
    id: cal.1965-11-14.vietnam
    text: 'Check: Westmoreland gives six days of fighting, Nov. 14–19, and more than 1,300 enemy dead (157).'
- cite:
    id: cal.1965-11-28.vietnam
    item: '[[w.westmoreland-soldier-reports]], 154 (McNamara from Europe to Saigon near the end of November; the build-up,
      nine North Vietnamese regiments possible)'
    units: A
- cite:
    id: cal.1966-10-24.vietnam-asian-trip
    item: '[[w.westmoreland-soldier-reports]], 190–91 (the delegations; Johnson wanted Westmoreland, without Wheeler or Sharp,
      the senior officer there; his and Cao Văn Viên''s review; the withdrawal clause, on which he was not consulted)'
    units: A-B
- cite:
    id: cal.1966-10-26.vietnam-asian-trip
    item: '[[w.westmoreland-soldier-reports]], 191–92 (the visit, settled the evening before in Johnson''s room at Manila;
      Westmoreland''s cover plan; to Johnson: "no Commander in Chief in our history has ever had finer troops than these")'
    units: A
- cite:
    id: cal.1968-02-09.vietnam
    item: '[[w.westmoreland-soldier-reports]], 350–51 (Wheeler: "if you need more troops, ask for them"; Westmoreland: the
      82d Airborne and half a Marine division, "a six-month loan"; the enemy''s three phases)'
    units: A, C-D
- cite:
    id: cal.1968-02-12.vietnam-tet
    item: '[[w.westmoreland-soldier-reports]], 352 (the request, quoted; the White House meeting that day, by Wheeler''s report:
      "you are not expressing a firm demand"; Westmoreland: "not because I fear defeat")'
    units: A-C
- cite:
    id: cal.1968-02-27.vietnam
    item: '[[w.westmoreland-soldier-reports]], 353–56 (Wheeler in Saigon from Feb. 23, three days; the forces in three increments;
      his report from Honolulu, "a very near thing")'
    units: A-B
- check:
    id: cal.1968-02-27.vietnam
    text: 'Check: Westmoreland gives the first increment as about 108,000 men, ready by May (355–56).'
- cite:
    id: cal.1968-03-09.vietnam-205000
    item: '[[w.westmoreland-soldier-reports]], 358 (Wheeler''s cable quoted: "strong resistance in all quarters ... You should
      not count on an affirmative decision")'
    units: all
- check:
    id: cal.1968-03-09.vietnam-205000
    text: 'Check: Westmoreland dates it Mar. 8 (358).'
- cite:
    id: cal.1968-03-10.vietnam
    item: '[[w.westmoreland-soldier-reports]], 358 (the story; Westmoreland: no request made for 206,000)'
    units: A
- cite:
    id: cal.1968-03-23.vietnam-abrams
    item: '[[w.westmoreland-soldier-reports]], 361 (Wheeler''s call; the message quoted)'
    units: all
- cite:
    id: cal.1968-04-06.vietnam
    item: '[[w.westmoreland-soldier-reports]], 362 (called to Washington, the trip to Honolulu cancelled after King''s death;
      a guest at the White House; asked his successor, he urges Abrams; with Johnson by helicopter over the burning city)'
    units: A
