    id: cal.1960-07-13.elections-1960
    base: 8f7c09d9
    set:
      follows:
      - cal.1960-07-13.elections-1960-5
      n: '[[w.schlesinger-robert-kennedy-and-his]], 205–06 (Robert Kennedy''s count, Wednesday, 740: 21 short, by
        Schlesinger''s journal); [[w.white-making-of-the-president]], 165–70 (McCarthy''s speech for Stevenson;
        the count; Wyoming; the final tally, 169 n.9); [[w.guthman-we-band-of-brothers]], 74, 76–77 (761 needed;
        Wyoming''s 15 votes putting him over; not the totals). [[w.kallina-kennedy-v-nixon]], 72–73 (Wyoming''s
        votes; 806; 761 needed). [[w.sorensen-kennedy]], 158–61. After [[cal.1960-07-13.elections-1960-5|Johnson''s
        plea of the morning]]. To check: Schlesinger, journal, July 14, 1960 (cited by [[w.schlesinger-robert-kennedy-and-his]],
        206 n.64); Hugh Sidey OHI, Apr. 7, 1964, JFK Library; Joseph D. Tydings OHI, Sept. 30, 1965, JFK Library
        (cited by [[w.kallina-kennedy-v-nixon]], 73 n.59). See [[cal.1960-07-12.elections-1960]]. Names: Kennedy,
        Johnson, Symington, Stevenson.'
