    id: cal.1960-09-10.laos
    base: e702ac58
    set:
      time: 1960-09-10T06:00Z
      n: 'FRUS 1958–60, XVI, docs. [391](https://history.state.gov/historicaldocuments/frus1958-60v16/d391) (Vientiane''s
        502: Phoumi on the revolution to be announced at noon in Boun Oum''s name), [392](https://history.state.gov/historicaldocuments/frus1958-60v16/d392),
        [396](https://history.state.gov/historicaldocuments/frus1958-60v16/d396) (NSC, Sept. 15). [[w.department-of-state-bulletin]],
        [Sept. 26, 1960, 499](https://archive.org/details/departmentofstat431960unit/page/499/mode/1up). [[w.watson-into-the-missile-age]],
        651 (Boun Oum''s proclamation, Sept. 10); [[w.poole-joint-chiefs-of-staff]], 122. The hour: FRUS 1958–60,
        XVI, doc. 391 n.5 (Vientiane''s 501). To check: Vientiane''s telegram 501, Sept. 10, 1960, OSD Hist., and
        the [*New York Times*, Sept. 12, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/12/issue.html)
        (cited by [[w.watson-into-the-missile-age]], 651 n.133). See [[cal.1960-08-09.laos]]. Names: Boun Oum na
        Champassak, Phoumi Nosavan, Souvanna Phouma.'
