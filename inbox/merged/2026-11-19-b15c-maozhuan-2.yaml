- add:
    entry:
      id: cal.1963-05-08.china-leadership-10
      when: May 8
      date: '1963-05-08'
      thread: china-leadership
      c: 'Hangzhou 杭州, evening, at his residence. Mao 毛泽东 calls the meeting again; Peng Zhen 彭真 reports the group''s discussion of the night before and says the drafts are poor, the
        group not keeping up with the Chairman since the Beidaihe meeting of last year. Mao: flat, not logical enough; the Henan papers, Xiyang and the seven Zhejiang papers show how;
        the range of inquiry is production, class struggle and scientific experiment; wound no more than a few; party rectification next year. He ends the meeting: "go."'
