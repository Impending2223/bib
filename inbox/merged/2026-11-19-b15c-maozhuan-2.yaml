    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 498–500 (Mar. 1963; Mao''s heading; printed from his manuscript; note 2: the directive of Mar. 23 (county and commune cadres in Xiyang
        in 1962 worked 62 and 82 labor days each in the teams); issued May 20 as annex six of the "Former Ten Points"; note 4: the Jinzhong prefecture''s rural work department''s report).
        Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 72); the text in full, 2023 ([[w.jianguo-yilai-mao-zedong]],
        the first open printing). To check: Shanxi provincial Party committee, note (summary) of Jan. 29, 1963 on the material "Cadres'' labor in Xiyang county, Shanxi, has become a
        social custom" (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 499 n.3); Jinzhong prefectural committee, rural work department, report (summary) on the investigation of cadres''
        labor in Xiyang county (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 499 n.4). Names: Mao Zedong. Check: the day; the directive is dated Mar. 23. Check: whether the first edition
        ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
