      when: May 31
      date: '1961-05-31'
      thread: china-leadership
      c: 'Liu Shaoqi to the work conference: the food problem is central; neither peasants, workers nor cadres have peace of mind. 30 per cent natural calamities, 70 per cent man-made, he says, citing the Hunan peasants and Shanxi''s Tao Lujia. The center bears responsibility for errors and deaths. "We cannot go on like this." Recovery in eight or ten years.'
