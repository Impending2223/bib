      when: Dec.
      date: 1960-12
      thread: china-leadership
      c: 'Qian Ying, formerly Minister of Internal Affairs, and Rong Zihe, a former Vice-Minister of Finance, investigate Gansu: the claimed grain output of 7 billion catties is in fact 4 billion; the county secretaries, too frightened to say so, are pressed by the Northwest Bureau''s official to accept the first secretary''s figure.'
