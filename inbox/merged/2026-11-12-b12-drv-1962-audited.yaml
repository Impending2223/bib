patch: 2026-11-12-b12-drv-1962-64
by: 'Claude (batch 12, audit of the 1962 third of 2026-11-12-b12-drv-1962-64: the DRV, Văn kiện Đảng toàn tập, vol. XXIII, 1962), Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1962-01-05.vietnam-hanoi
      when: Jan. 5
      date: '1962-01-05'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 33-NQ/TW on social insurance for the state''s workers and employees: the course for improving, supplementing and building the system; the Council of Ministers to adopt and issue the rules.'
      n: '*Nghị quyết của Bộ Chính trị số 33-NQ/TW về chính sách bảo hiểm xã hội đối với công nhân, viên chức nhà nước*, signed for the Politburo by Lê Thanh Nghị. [[w.van-kien-dang-toan]], XXIII, 1–14. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-01-10.vietnam-hanoi
      when: Jan. 10
      date: '1962-01-10'
      thread: vietnam-hanoi
      also: [soviet-union]
      c: 'The Central Committee to the CPSU Central Committee, signed by Hồ Chí Minh, after the sixth plenum (Nov. 30–Dec. 4, 1961) heard the delegation to the Twenty-second Congress: Stalin respected, his errors learned of only at the Twentieth Congress; the quarrel with Albania painful. Proposed: a conference of the twelve parties of the camp, or wider, to settle it, and an end meanwhile to attacks by radio and press; Hanoi keeps normal relations with Albania.'
      n: '*Thư Ban Chấp hành Trung ương Đảng Lao động Việt Nam gửi Ban Chấp hành Trung ương Đảng Cộng sản Liên Xô*. [[w.van-kien-dang-toan]], XXIII, 20–23 (the proposals, 22–23). See [[cal.1961-12.vietnam-hanoi]]. Made public: 2002. Names: Hồ Chí Minh, Stalin.'
      tags: ['name:ho-chi-minh', 'polity:drv', 'polity:ussr']
- add:
    entry:
      id: cal.1962-01-20.vietnam-hanoi
      when: Jan. 20
      date: '1962-01-20'
      thread: vietnam-hanoi
      c: 'The Politburo, resolution no. 39-NQ/TW, on the struggle against counterrevolutionaries in the North: the dangerous ones to be concentrated for reform, spies and saboteurs hunted down, the security movement pressed district by district, the histories of cadres vetted; and resolution no. 40-NQ/TW on strengthening the public security forces.'
      n: '*Nghị quyết của Bộ Chính trị số 39-NQ/TW về việc tăng cường đấu tranh chống các bọn phản cách mạng để phục vụ tốt công cuộc xây dựng chủ nghĩa xã hội ở miền Bắc và đấu tranh nhằm thực hiện hoà bình thống nhất nước nhà*. [[w.van-kien-dang-toan]], XXIII, 33–55 (the tasks, 51–53), 56–59 (No. 40-NQ/TW); each signed for the Politburo by Trường Chinh. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-01-27.vietnam-hanoi
      when: Jan. 27
      date: '1962-01-27'
      thread: vietnam-hanoi
      c: 'The Secretariat, the morning, on food: purchases of paddy too slow against the tenth-month crop of 1960, Hà Nam at 160 percent of its task, Bắc Ninh, Hà Giang, Bắc Kạn, Haiphong, Lạng Sơn and the Northwest far behind; not for want of food but because Party committees have not grasped the policy. The purchase target cut from 360,000 tons of paddy to some 250,000, "yêu cầu tối thiểu" (the least required); buying to be pressed to Tết and after; illicit distilling curbed.'
      n: '*Thông tri của Ban Bí thư số 61-TT/TW về quyết định họp ngày 27-1-1962 bàn về vấn đề lương thực hiện nay*, Jan. 30, of the meeting of Jan. 27, signed for the Secretariat by Nguyễn Khai, chief of the office. [[w.van-kien-dang-toan]], XXIII, 79–83. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-02-01.vietnam-hanoi
      when: Feb. 1
      date: '1962-02-01'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 43-NQ/TW on the 1962 plan: the 1961 plan, on the third plenum''s course, on the whole "những thắng lợi quan trọng" (important victories), industry, farming and construction growing at a fair pace. For 1962 production and capital construction the first task; the targets set lower than the control figures, a minimum to be met; the State Planning Commission to revise them for the Council of Ministers.'
      n: '*Nghị quyết của Bộ Chính trị số 43-NQ/TW về phương hướng và nhiệm vụ kế hoạch năm 1962*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIII, 84–114 (1961, 84; the tasks, 94; the targets, 97–98). Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-02-19.vietnam-hanoi
      when: Feb. 19
      date: '1962-02-19'
      thread: vietnam-hanoi
      c: The Politburo's resolution no. 46-NQ/TW on unified leadership of the patriotic emulation movement, grown since early 1961 into a mass movement in the plants, farms, cooperatives, army and schools.
      n: '*Nghị quyết của Bộ Chính trị số 46-NQ/TW về việc thống nhất lãnh đạo và đẩy mạnh phong trào thi đua yêu nước*, signed for the Politburo by Lê Thanh Nghị. [[w.van-kien-dang-toan]], XXIII, 123–35. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-03-03.vietnam-2
      when: Mar. 3
      date: '1962-03-03'
      thread: vietnam
      also: [vietnam-hanoi]
      c: The National Liberation Front's first congress, Feb. 16–Mar. 3, closes. Its resolution endorses the provisional Central Committee's political report, the program and the tasks; the Americans have brought nearly 8,000 troops into the South and set up a command in Saigon under Harkins.
      n: '*Nghị quyết của Đại hội đại biểu Mặt trận dân tộc giải phóng miền Nam Việt Nam lần thứ nhứt (ngày 16 tháng 2 năm 1962 đến ngày 3 tháng 3 năm 1962)*. [[w.van-kien-dang-toan]], XXIII, 940–56 (appendix; the troops, 941). Names: Harkins.'
      tags: ['name:harkins-paul-d', 'polity:us']
- add:
    entry:
      id: cal.1962-03-14.vietnam-hanoi
      when: Mar. 14
      date: '1962-03-14'
      thread: vietnam-hanoi
      also: [soviet-union, china]
      c: 'The Politburo''s resolution no. 50-NQ/TW on the world situation and "our international tasks": on the Moscow declarations of 1957 and 1960, the camp''s unity strengthened, "do Liên Xô làm trung tâm mà sự đoàn kết Xô - Trung là cái trụ" (with the Soviet Union at its center and Sino-Soviet unity its pillar); friendship with Laos and Cambodia; support from Southeast Asia above all for reunification and the South''s struggle.'
      n: '*Nghị quyết của Bộ Chính trị số 50-NQ/TW về triển vọng của tình hình thế giới và nhiệm vụ quốc tế của chúng ta*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIII, 181–200 (the tasks, 196–97). Made public: 2002.'
      tags: ['polity:drv', 'polity:ussr', 'polity:prc']
- add:
    entry:
      id: cal.1962-03-23.vietnam-hanoi
      when: Mar. 23
      date: '1962-03-23'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 40-CT/TW opens the campaign "bảo mật phòng gian" (keep secrets, guard against spies) in the government's offices, the enterprises and the armed units, under the Politburo's resolution against counterrevolutionaries.
      n: '*Chỉ thị của Ban Bí thư số 40-CT/TW về việc mở cuộc vận động "bảo mật phòng gian" trong các cơ quan, xí nghiệp, đơn vị vũ trang*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 208–16. See [[cal.1962-01-20.vietnam-hanoi]]. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-03-30.vietnam-hanoi
      when: Mar. 30
      date: '1962-03-30'
      thread: vietnam-hanoi
      c: 'The Politburo, Hồ Chí Minh and five members present, on food for the 1962 spring crop: purchases of the 1961 tenth-month crop fell short, but Sơn Tây, Hà Nam, Ninh Bình, Hải Ninh and Phú Thọ met their tasks. Decided: production first; the levy the least needed, the cooperative, not the household, to answer for it; forced purchase from individual farmers who will not deliver, by the provincial administrative committee''s decision; incentive prices 10 to 30 percent above the guide price.'
      n: '*Thông báo của Ban Bí thư số 21-TB/HN về Hội nghị Bộ Chính trị bàn công tác lương thực vụ chiêm năm 1962*, May 29, 1962, of the meeting of Mar. 30, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 573–79. Made public: 2002. Names: Hồ Chí Minh.'
      tags: ['name:ho-chi-minh', 'polity:drv']
- add:
    entry:
      id: cal.1962-04-07.vietnam-hanoi
      when: Apr. 7
      date: '1962-04-07'
      thread: vietnam-hanoi
      c: The Politburo's instruction no. 41-CT/TW on improving *Học Tập*, the Party's journal of theory and politics, published since December 1955 under the Politburo's direct guidance.
      n: '*Chỉ thị của Bộ Chính trị số 41-CT/TW về việc cải tiến tạp chí lý luận của Đảng*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIII, 400–04. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-04-16.vietnam-hanoi
      when: Apr. 16
      date: '1962-04-16'
      thread: vietnam-hanoi
      c: 'The Central Committee''s seventh plenum, enlarged, on industry, sitting since Mar. 26, ends. Its resolution: the tasks and course of building industry in the first five-year plan, socialist industrialization the central task of the transition. Hồ Chí Minh: heaven''s time, earth''s advantage and men''s accord, the three favorable conditions; "Có thực mới vực được đạo" (only the fed can follow the Way), so farming "cực kỳ quan trọng" (extremely important); industry and farming the economy''s two legs.'
      n: '*Báo cáo về nhiệm vụ và phương hướng xây dựng phát triển công nghiệp tại Hội nghị lần thứ bảy*; *Nghị quyết Hội nghị lần thứ bảy Ban Chấp hành Trung ương Đảng (khoá III) về nhiệm vụ và phương hướng xây dựng và phát triển công nghiệp*; *Bài nói của Chủ tịch Hồ Chí Minh tại Hội nghị lần thứ bảy*; *Thông cáo Hội nghị lần thứ bảy*. [[w.van-kien-dang-toan]], XXIII, 220–395 (the report on industry, 220–347; the resolution, 348–87; Hồ Chí Minh''s speech, Apr. 16, 388–92; the communiqué, 393–95, the plenum "họp từ ngày 26 tháng 3 đến ngày 16 tháng 4" (sat from Mar. 26 to Apr. 16) by the editors'' heading). Made public: the communiqué at the time; the resolution, published by Aug. 7 (XXIII, 727); the report, 2002. Names: Hồ Chí Minh.'
      tags: ['name:ho-chi-minh', 'polity:drv']
- add:
    entry:
      id: cal.1962-04-21.vietnam-hanoi
      when: Apr. 21
      date: '1962-04-21'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 42-CT/TW on local military work for 1962: the militia, self-defense and reserves, built up a step in 1961.'
      n: '*Chỉ thị của Ban Bí thư số 42-CT/TW về nhiệm vụ công tác quân sự địa phương năm 1962*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 405–10. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-04-26.vietnam-hanoi
      when: Apr. 26
      date: '1962-04-26'
      thread: vietnam-hanoi
      c: 'The Politburo: resolution no. 51-NQ/TW on the campaign to raise responsibility, tighten economic and financial management and fight embezzlement, waste and bureaucracy; resolution no. 52-NQ/TW on improving the Party''s theoretical and political education.'
      n: '*Nghị quyết của Bộ Chính trị số 51-NQ/TW về cuộc vận động nâng cao ý thức trách nhiệm, tăng cường quản lý kinh tế tài chính, chống tham ô, lãng phí, quan liêu*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXIII, 423–35, 436–56 (No. 52-NQ/TW; signed by Trường Chinh). Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-04.vietnam-hanoi
      when: Apr.
      date: 1962-04
      thread: vietnam-hanoi
      c: 'Lê Duẩn at the propaganda and education conference of the whole North, asked by Tố Hữu the night before, without an outline: "Tạo một chuyển biến mạnh mẽ về công tác tư tưởng" (make a strong turn in ideological work). Class consciousness, the technical revolution, the laws of ideology, the work carried to the masses through the Party cells.'
      n: '*Tạo một chuyển biến mạnh mẽ về công tác tư tưởng*, Lê Duẩn''s speech at the conference of propaganda and education of the whole North, April 1962, by the editors'' note. [[w.van-kien-dang-toan]], XXIII, 457–503 (printed from *Văn kiện lịch sử Đảng (12-1960 - 9-1964)*, Trường Nguyễn Ái Quốc, vol. XI, 185–229, by the volume''s note, 503). Made public: 2002. Check: the day; the editors give the month. Names: Lê Duẩn, Tố Hữu.'
      tags: ['name:le-duan', 'polity:drv']
- add:
    entry:
      id: cal.1962-04-30.vietnam-hanoi
      when: Apr. 30
      date: '1962-04-30'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Duẩn, Lê Đức Thọ, Nguyễn Văn Trân and Lê Văn Lương, with Trần Quốc Hoàn and the Public Security Ministry''s party group, on resolution no. 39: in the first four months the American and Diệm spies stepped up their commando work, aiming at a large sudden blow in the North, so far foiled.'
      n: '*Thông báo của Ban Bí thư số 26-TB/HN về Hội nghị Ban bí thư bàn việc tăng cường đấu tranh chống các bọn phản cách mạng*, June 21, 1962, of the meeting of Apr. 30, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 627–32. See [[cal.1962-01-20.vietnam-hanoi]]. Made public: 2002. Names: Lê Duẩn, Lê Đức Thọ, Nguyễn Văn Trân, Lê Văn Lương, Trần Quốc Hoàn.'
      tags: ['name:le-duan', 'name:le-duc-tho', 'polity:drv', 'polity:us', 'polity:rvn']
- add:
    entry:
      id: cal.1962-05-05.vietnam-hanoi
      when: May 5
      date: '1962-05-05'
      thread: vietnam-hanoi
      c: 'COSVN ("Anh Trọng") in conference, Apr. 20–May 5, on carrying out the Center''s ("Anh Tư") resolution on the immediate work of the revolution in the South, closes; its minutes stand as a resolution. Its resolution of October 1961 still sound; the course the Center''s, in its words: to press the political and military struggle, win and keep the initiative, break the Staley–Taylor plan. Its resolution of May on military tasks: the Americans'' command in Saigon, more advisers, units in the fighting.'
      n: '*Biên bản hội nghị Anh Trọng tháng 4 năm 1962 nghiên cứu và đặt kế hoạch thực hiện nghị quyết Anh Tư về công tác trước mắt của cách mạng miền Nam*; *Nghị quyết Hội nghị Trung ương Cục miền Nam, tháng 5 năm 1962, về nhiệm vụ quân sự*. [[w.van-kien-dang-toan]], XXIII, 851–906 (appendix; "Anh Trọng" COSVN and "Anh Tư" the Central Committee, the editors'' notes, 851; the course, 879, the words of the Politburo''s resolution of February, XXIII, 146); 907–15 (the military resolution: the command, the advisers and the units, 907; the course again, 909). See [[cal.1962-02-26.vietnam-hanoi]]. Made public: 2002. Check: the day of the military resolution; the volume gives May 1962.'
      tags: ['polity:drv', 'polity:us']
- add:
    entry:
      id: cal.1962-05-09.vietnam-hanoi
      when: May 9
      date: '1962-05-09'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 53-NQ/TW on the work of the national united front: the Fatherland Front''s tasks in the North, among them emulation and production, the struggle against "đế quốc Mỹ võ trang xâm lược miền Nam" (the American imperialists'' armed aggression in the South) and support of the South''s Liberation Front, and the full execution of the Geneva Agreements; the Central Front Board to answer for the Democratic and Socialist Parties, the notables, the religions and the Chinese residents.'
      n: '*Nghị quyết của Bộ Chính trị số 53-NQ/TW về công tác mặt trận dân tộc thống nhất*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIII, 507–20 (the tasks, 511–12; the Front Board, 513–14). Made public: 2002.'
      tags: ['polity:drv', 'polity:us']
- add:
    entry:
      id: cal.1962-05-10.vietnam-hanoi
      when: May 10
      date: '1962-05-10'
      thread: vietnam-hanoi
      c: 'The Politburo''s instruction no. 45-CT/TW on propaganda abroad: to present the North and win the world''s sympathy and support for building socialism and the struggle for reunification.'
      n: '*Chỉ thị của Bộ Chính trị số 45-CT/TW về công tác tuyên truyền đối ngoại*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIII, 521–34. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-05-11.vietnam-hanoi
      when: May 11
      date: '1962-05-11'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 44-CT/TW on the tasks of propaganda and education in 1962, the five-year plan's second year.
      n: '*Chỉ thị của Ban Bí thư số 44-CT/TW về nhiệm vụ công tác tuyên giáo trong năm 1962*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 535–53. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-06-01.vietnam-hanoi
      when: June 1
      date: '1962-06-01'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 46-CT/TW: for July 20, a month of struggle against "đế quốc Mỹ vũ trang xâm lược miền Nam Việt Nam" (the American imperialists'' armed aggression in South Vietnam), in support also of the World Congress for General Disarmament and Peace in Moscow in July. The Indian and Canadian members of the International Commission, under American pressure framing a majority report against the North, to be exposed.'
      n: '*Chỉ thị của Ban Bí thư số 46-CT/TW phát động một tháng đấu tranh chống đế quốc Mỹ vũ trang xâm lược miền Nam Việt Nam nhân dịp 20 tháng 7 năm 1962*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 583–89 (the Commission, 584, 586). Made public: 2002.'
      tags: ['polity:drv', 'polity:us', 'polity:ussr', 'polity:india', 'polity:canada']
- add:
    entry:
      id: cal.1962-06-01.vietnam-hanoi-2
      when: June 1–2
      date: '1962-06-01'
      thread: vietnam-hanoi
      also: [china]
      c: 'The Politburo, two days on the Thái Nguyên iron and steel complex, with the Heavy Industry Ministry''s party group, the complex''s committee and the State Planning Commission: the decision of 1958 to build it necessary and bold; China''s Party and government helping regardless of their own difficulties; the plant of 100,000 tons a year, to be extended to 200,000, at Lưu Xá, sound; the second stage''s design, total estimate and schedule; talks with the Chinese government for designs, materials and equipment, "đồng chí Trinh" in charge.'
      n: '*Nghị quyết của Bộ Chính trị số 56-NQ/TW về nhiệm vụ thiết kế mở rộng (đợt 2) và tổng khái toán, tổng tiến độ thi công của khu gang thép Thái Nguyên*, July 10, 1962, of the sessions of June 1 and 2, signed for the Politburo by Lê Thanh Nghị. [[w.van-kien-dang-toan]], XXIII, 685–91. Made public: 2002.'
      tags: ['polity:drv', 'polity:prc']
- add:
    entry:
      id: cal.1962-06-06.vietnam-hanoi
      when: June 6
      date: '1962-06-06'
      thread: vietnam-hanoi
      c: 'The Politburo''s instruction no. 47-CT/TW on international propaganda at home: the people''s need to know the world situation; the age''s chief feature the socialist system become "nhân tố quyết định" (the deciding factor) in mankind''s development.'
      n: '*Chỉ thị của Bộ Chính trị số 47-CT/TW về đẩy mạnh công tác tuyên truyền quốc tế ở trong nước*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIII, 604–15. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-06-23.vietnam-hanoi
      when: June 23–26
      date: '1962-06-23'
      thread: vietnam-hanoi
      c: 'The Secretariat''s conference on strengthening work among the ethnic minorities, June 23, 25 and 26: the highlands'' special importance in the North''s revolution reaffirmed.'
      n: '*Thông tri của Ban Bí thư số 89-TT/TW về vấn đề tăng cường công tác dân tộc ở các ngành, các cấp*, Sept. 15, 1962, on the conference, signed for the Secretariat by Nguyễn Khai, chief of the office. [[w.van-kien-dang-toan]], XXIII, 730–34. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-06-25.vietnam-hanoi
      when: June 25
      date: '1962-06-25'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Duẩn, Lê Đức Thọ, Nguyễn Chí Thanh, Lê Văn Lương, Nguyễn Văn Trân, Tố Hữu and Hoàng Anh, on the program for the second half of 1962 and the working methods of the Politburo and the Secretariat: their chief work to the year''s end the policies and measures to carry out the fifth and seventh plenums'' resolutions, the preparation of two plenums, on organization and on the five-year plan, and close watch on the world and the South.'
      n: '*Thông báo của Ban Bí thư số 30-TB/HN về Hội nghị Ban Bí thư ngày 25-6-1962 bàn chương trình công tác sáu tháng cuối năm 1962 và lề lối làm việc của Bộ Chính trị, Ban Bí thư*, July 9, 1962, of the meeting of June 25, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 678–84. Made public: 2002. Names: Lê Duẩn, Lê Đức Thọ, Nguyễn Chí Thanh, Lê Văn Lương, Nguyễn Văn Trân, Tố Hữu, Hoàng Anh.'
      tags: ['name:le-duan', 'name:le-duc-tho', 'name:nguyen-chi-thanh', 'polity:drv']
- add:
    entry:
      id: cal.1962-07-10.vietnam-hanoi
      when: July 10
      date: '1962-07-10'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 51-CT/TW on the boarding schools for pupils from the South: fifteen schools in the North, nearly 9,000 regrouped children; the schools to be strengthened.'
      n: '*Chỉ thị của Ban Bí thư số 51-CT/TW tích cực củng cố các trường nội trú học sinh miền Nam*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIII, 692–97. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-09-08.vietnam-hanoi
      when: Sept. 8
      date: '1962-09-08'
      thread: vietnam-hanoi
      c: 'The Politburo, the afternoon, on buying the 1962 tenth-month crop: the general levy fixed at 18 percent of the crop, under 20 percent reasonable by past years; more to be bought at incentive prices beyond the levy, and grain imported in time; rations held until a coming session on food.'
      n: '*Thông báo của Ban Bí thư số 37-TB/HN về Hội nghị Bộ Chính trị bàn về thu mua lương thực vụ mùa 1962*, Oct. 22, 1962, of the meeting of Sept. 8, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 783–86. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-09-24.vietnam-hanoi
      when: Sept. 24
      date: '1962-09-24'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 93-TT/TW: a month of support for the people of Algeria, independent after more than seven years of war, and for the peoples fighting for independence, Sept. 25 to Nov. 1.'
      n: '*Thông tri của Ban Bí thư số 93-TT/TW về Tháng ủng hộ nhân dân Angiêri và nhân dân các nước đang gian khổ đấu tranh cho độc lập dân tộc (từ ngày 25 tháng 9 đến ngày 1 tháng 11 năm 1962)*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 738–40. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-09-27.vietnam-hanoi
      when: Sept. 27
      date: '1962-09-27'
      thread: vietnam-hanoi
      c: The Secretariat sets up the Board of People's International Work, Xuân Thủy its head, to direct the mass organizations' activity abroad beside the state's diplomacy, and the Vietnam Peace Committee and Afro-Asian Solidarity Committee.
      n: '*Nghị quyết của Ban Bí thư số 58-NQ/TW về việc thành lập Ban công tác quốc tế nhân dân*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 746–47. Made public: 2002. Names: Xuân Thủy.'
      tags: ['name:xuan-thuy', 'polity:drv']
- add:
    entry:
      id: cal.1962-12.vietnam-hanoi
      when: Dec.
      date: 1962-12
      thread: vietnam-hanoi
      c: 'The Interzone V Party Committee''s standing committee, enlarged, at the year''s end: the enemy has carried out the Staley–Taylor plan in earnest, more troops, sweeps, terror, the people regrouped into strategic hamlets, in the mountains the people armed against the revolution; helicopter tactics new.'
      n: '*Nghị quyết Hội nghị thường vụ Khu uỷ 5 cuối năm 1962*, copied to "anh". [[w.van-kien-dang-toan]], XXIII, 916–39 (appendix). Made public: 2002. Check: the day; the volume gives the year''s end.'
      tags: ['polity:drv', 'polity:us']
- add:
    entry:
      id: cal.1962-01-10.vietnam-hanoi-2
      when: Jan. 10
      date: '1962-01-10'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 38-CT/TW on strengthening control work: the checks on democracy, discipline and the Party''s finances and the handling of members'' complaints improved since the Third Congress; the control commissions to be strengthened.'
      n: '*Chỉ thị của Ban Bí thư số 38-CT/TW về việc tăng cường công tác kiểm tra*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 15–19. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-01-11.vietnam-hanoi
      when: Jan. 11
      date: '1962-01-11'
      thread: vietnam-hanoi
      c: 'The Secretariat revises the allowances of commune cadres, with the reform of the communes'' organization and methods, the commune "một khâu quan trọng vào bậc nhất" (a link of the first importance) in the Party''s and the state''s leadership in the countryside: three to five full-time cadres a commune; the secretary and the chairman 23 đồng a month (25 in the high mountains), the others 20 (22); each to work in production at least 30 days a year.'
      n: '*Nghị quyết của Ban Bí thư số 35-NQ/TW về việc sửa đổi chế độ trợ cấp đối với cán bộ xã*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 24–30. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-01-16.vietnam-hanoi
      when: Jan. 16
      date: '1962-01-16'
      thread: vietnam-hanoi
      c: The Secretariat merges the Nguyễn Ái Quốc School's second branch and the Propaganda School into the Central Propaganda School, from Jan. 1.
      n: '*Nghị quyết của Ban Bí thư số 36-NQ/TW về việc thống nhất Trường Nguyễn ái Quốc phân hiệu II và Trường Tuyên giáo thành Trường Tuyên giáo Trung ương*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 31–32. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-01-20.vietnam-hanoi-2
      when: Jan. 20
      date: '1962-01-20'
      thread: vietnam-hanoi
      c: The Secretariat sets up, for the time being, a Party subcommittee to help the Propaganda Department prepare and conduct the Third National Congress of Literature and Arts, Đặng Thai Mai its head.
      n: '*Nghị quyết của Ban Bí thư số 38-NQ/TW thành lập Tiểu ban giúp Ban Tuyên giáo Trung ương hướng dẫn việc chuẩn bị và tiến hành Đại hội văn nghệ toàn quốc lần thứ III*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 60–62 (the members, 61). Made public: 2002. Names: Đặng Thai Mai.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-01-24.vietnam-hanoi
      when: Jan. 24
      date: '1962-01-24'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 41-NQ/TW on the Board for Research on Party History under the Central Committee, set up by the Third Congress''s decision: its tasks and powers, to record the Party''s achievements and sum up its experience.'
      n: '*Nghị quyết của Bộ Chính trị số 41-NQ/TW về Ban Nghiên cứu Lịch sử Đảng trực thuộc Trung ương*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIII, 63–69. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-01-24.vietnam-hanoi-2
      when: Jan. 24
      date: '1962-01-24'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 59-TT/TW on studying the Party''s new statute, issued over a year before, and keeping to it: its study and application still faulty.'
      n: '*Thông tri của Ban Bí thư số 59-TT/TW về việc đẩy mạnh tổ chức nghiên cứu và chấp hành nghiêm chỉnh điều lệ mới của Đảng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 70–73. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-01-30.vietnam-hanoi
      when: Jan. 30
      date: '1962-01-30'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 60-TT/TW on leading the elections, in March, of the people''s councils and administrative committees of the provinces, the Hồng Quảng zone and the Vĩnh Linh area: about half the councillors direct producers, women over a fifth, Party members some 60 percent and nowhere over 70; the provincial committee''s deputy secretary, as a rule, chairman of the administrative committee.'
      n: '*Thông tri của Ban Bí thư số 60-TT/TW về việc lãnh đạo bầu cử hội đồng nhân dân và uỷ ban hành chính cấp tỉnh, khu Hồng Quảng và khu vực Vĩnh Linh*, signed for the Secretariat by Nguyễn Khai, chief of the office. [[w.van-kien-dang-toan]], XXIII, 74–78. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-02-10.vietnam-hanoi
      when: Feb. 10
      date: '1962-02-10'
      thread: vietnam-hanoi
      c: The Politburo's resolution no. 44-NQ/TW on the plan to rebuild and extend the city of Nam Định, to become a socialist industrial city.
      n: '*Nghị quyết của Bộ Chính trị số 44-NQ/TW về quy hoạch cải tạo và mở rộng thành phố Nam Định*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIII, 115–20. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-02-12.vietnam-hanoi
      when: Feb. 12
      date: '1962-02-12'
      thread: vietnam-hanoi
      c: 'The Secretariat, the morning, Phạm Hùng, Tố Hữu and Lê Văn Lương, with Trần Quốc Hoàn, Hoàng Quốc Việt and the Supreme Court''s party group, on the courts'' work in 1962: under the Politburo''s new resolution, counterrevolutionaries, spies, commandos and bandits punished first; criminal and civil codes to be built step by step; the courts organized vertically under the Party''s leadership.'
      n: '*Thông báo về hội nghị Ban Bí thư số 16-TB/HN, ngày 26 tháng 3 năm 1962, bàn về công tác toà án*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 217–19 (the meeting the morning of Feb. 12). See [[cal.1962-01-20.vietnam-hanoi]]. Made public: 2002. Names: Phạm Hùng, Tố Hữu, Lê Văn Lương, Trần Quốc Hoàn, Hoàng Quốc Việt.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-02-16.vietnam-hanoi
      when: Feb. 16
      date: '1962-02-16'
      thread: vietnam-hanoi
      c: The Secretariat sets up a board, Lê Đức Thọ at its head, to draft the proposals for a Central Committee plenum in 1962 on the organization and working methods of the Party and the government, "một khâu yếu" (a weak link) from the center to the base; the Politburo had called the plenum after Lê Đức Thọ's report on organization and Party building in the Soviet Union.
      n: '*Nghị quyết của Ban Bí thư số 45-NQ/TW về việc thành lập Ban phụ trách chuẩn bị đề án cho Hội nghị Trung ương bàn về vấn đề tổ chức và lề lối làm việc*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 121–22. Made public: 2002. Names: Lê Đức Thọ.'
      tags: ['name:le-duc-tho', 'polity:drv', 'polity:ussr']
- add:
    entry:
      id: cal.1962-02-20.vietnam-hanoi
      when: Feb. 20
      date: '1962-02-20'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 64-TT/TW on strict control of spending within the Party, after the rectification of mid-1961.
      n: '*Thông tri của Ban Bí thư số 64-TT/TW về việc quản lý chặt chẽ chi tiêu trong Đảng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 136–39. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-02-24.vietnam-hanoi
      when: Feb. 24
      date: '1962-02-24'
      thread: vietnam-hanoi
      c: The Secretariat hands the Party cells of the geological survey teams from the General Department of Geology's committee to the local Party committees.
      n: '*Thông tri của Ban Bí thư số 67-TT/TW về việc chuyển giao tổ chức cơ sở đảng ở các đoàn thăm dò địa chất cho các cấp uỷ địa phương lãnh đạo*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 140–42. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-02-27.vietnam-hanoi
      when: Feb. 27
      date: '1962-02-27'
      thread: vietnam-hanoi
      c: The Secretariat turns class A1 into an in-service school of theory for the senior and middle cadres of the central offices and Hanoi.
      n: '*Nghị quyết của Ban Bí thư số 47-NQ/TW về việc chuyển lớp A1 thành trường lý luận tại chức*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 165–67. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-02-27.vietnam-hanoi-2
      when: Feb. 27
      date: '1962-02-27'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 48-NQ/TW on the press in 1962: the papers, by its resolution of early 1961, turned to serving economic construction; their quality and use to be improved further.'
      n: '*Nghị quyết của Ban Bí thư số 48-NQ/TW về phương hướng công tác báo chí năm 1962*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 168–75. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-02-28.vietnam-hanoi
      when: Feb. 28
      date: '1962-02-28'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 38-CT/TW on defense sports, begun in 1957: some 100,000 trained and competed in 1960, 300,000 by the end of 1961.'
      n: '*Chỉ thị của Ban Bí thư số 38-CT/TW về tăng cường công tác thể dục thể thao quốc phòng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 176–80. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-03-17.vietnam-hanoi
      when: Mar. 17
      date: '1962-03-17'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 39-CT/TW on propaganda and education for the Third National Congress of Heroes and Emulation Fighters.
      n: '*Chỉ thị của Ban Bí thư số 39-CT/TW về việc tuyên truyền và giáo dục nhân dịp Đại hội liên hoan anh hùng chiến sĩ thi đua toàn quốc lần thứ III*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIII, 201–07. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-04-02.vietnam-hanoi
      when: Apr. 2
      date: '1962-04-02'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 69-TT/TW on carrying out the Politburo's resolution no. 39 against counterrevolutionaries, most committees and party groups slow, and the security work to be done at once.
      n: '*Thông tri của Ban Bí thư số 69-TT/TW về việc thi hành Nghị quyết số 39 của Bộ Chính trị về tăng cường đấu tranh chống các bọn phản cách mạng và những công tác cần làm ngay trong vấn đề bảo vệ an ninh*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 396–99. See [[cal.1962-01-20.vietnam-hanoi]]. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-04-25.vietnam-hanoi
      when: Apr. 25
      date: '1962-04-25'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 43-CT/TW on protecting mothers and children: women 54.2 percent of the farm labor force in March 1960.'
      n: '*Chỉ thị của Ban Bí thư số 43-CT/TW về công tác bảo vệ bà mẹ và trẻ em*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 417–22. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-05-04.vietnam-hanoi
      when: May 4
      date: '1962-05-04'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 72-TT/TW on drafting the first five-year plan, 1961–65, due before a Central Committee plenum in early October 1962.
      n: '*Thông tri của Ban Bí thư số 72-TT/TW về việc lập dự án kế hoạch 5 năm lần thứ nhất (1961 - 1965)*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 504–06. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-06-05.vietnam-hanoi
      when: June 5
      date: '1962-06-05'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 79-TT/TW on the cadre strength of the Labor Youth Union and the children''s committees, some of their cadres moved to other branches: where no cadres can be transferred to them, they may fill their establishment from their own cadres at the base, the Prime Minister''s freeze on new staff (decree no. 161) notwithstanding.'
      n: '*Thông tri của Ban Bí thư số 79-TT/TW về biên chế cán bộ của Đoàn Thanh niên Lao động và của uỷ ban thiếu nhi các cấp*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 602–03. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-07-04.vietnam-hanoi
      when: July 4
      date: '1962-07-04'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 50-CT/TW on checking the execution of the Party's and the government's resolutions and instructions.
      n: '*Chỉ thị của Ban Bí thư số 50-CT/TW về việc tăng cường công tác kiểm tra việc chấp hành các nghị quyết, chỉ thị của Đảng và Chính phủ*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 662–68. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-07-05.vietnam-hanoi
      when: July 5
      date: '1962-07-05'
      thread: vietnam-hanoi
      c: The Secretariat names the central steering committee of the campaign to raise responsibility, tighten economic and financial management and fight embezzlement, waste and bureaucracy, Phạm Hùng at its head; its staff the Government Inspectorate's.
      n: '*Nghị quyết của Ban Bí thư số 55-NQ/TW thành lập Ban chỉ đạo Trung ương cuộc vận động Nâng cao ý thức trách nhiệm, tăng cường quản lý kinh tế, tài chính, chống tham ô lãng phí quan liêu*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 669–71. See [[cal.1962-04-26.vietnam-hanoi]]. Made public: 2002. Names: Phạm Hùng.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-07-09.vietnam-hanoi
      when: July 9
      date: '1962-07-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, after the Domestic Trade Ministry''s party group reports, on the organization of domestic commerce, which the ministry ran entire in the period of transformation. Decided: the production ministries to stop selling consumer goods, retail to come under commerce; the state''s unified control of goods and distribution, with management devolved.'
      n: '*Thông báo của Ban Bí thư số 29-TB/HN về Hội nghị Ban Bí thư bàn vấn đề tổ chức thương nghiệp nội địa hiện nay*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 672–77. Made public: 2002. Check: the day of the meeting; the notice, of July 9, gives none.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-07-10.vietnam-hanoi-2
      when: July 10
      date: '1962-07-10'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 83-TT/TW on carrying out the resolution of the fifth conference on organization, which reviewed the line on Party building in organization since the Third Congress.
      n: '*Thông tri của Ban Bí thư số 83-TT/TW về việc thi hành Nghị quyết Hội nghị tổ chức lần thứ năm*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIII, 698–99. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-07-13.vietnam-hanoi
      when: July 13
      date: '1962-07-13'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 52-CT/TW on the leadership of the work against floods and storms.
      n: '*Chỉ thị của Ban Bí thư số 52-CT/TW về việc tăng cường lãnh đạo công tác phòng, chống lụt, bão*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXIII, 700–04. Made public: 2002.'
      tags: ['polity:drv']
- add:
    entry:
      id: cal.1962-08-07.vietnam-hanoi
      when: Aug. 7
