- edit:
    id: cal.1962-02-26.vietnam-hanoi
    base: 44466b34
    set:
      n: '[[w.asselin-hanois-road-to-the]], 128; [[w.van-kien-dang-toan]], XXIII, 143–64 (Nghị quyết của Bộ Chính trị họp ngày 26–27 tháng 2 năm 1962, Về công tác cách mạng miền Nam; signed for the Politburo "Ba," Lê Duẩn by the editors'' note, 164: the Front''s slogans to include "đòi thực hiện chính sách trung lập" (to demand a policy of neutrality), 149; "vừa đánh, vừa đòi thành lập chính phủ liên hiệp thật sự, đòi tổng tuyển cử thật sự, đòi hoà bình trung lập" (fight while demanding a real coalition government, real general elections, peace and neutrality), steps of transition, 163; neutrality a demand, not a matter "to be explored"; not Nguyễn Vũ Tùng). Made public: 2002. Thereafter, by Elliott, units not to resist sweeps, to preserve forces; a cable to COSVN on the political struggle''s worth in negotiations (Asselin, 128, nn.68–69). To check: Nguyễn Vũ Tùng, "The 1961–1962 Geneva Conference," in Goscha and Laplante, eds., *The Failure of Peace in Indochina* (2010), 259 (cited by [[w.asselin-hanois-road-to-the]], 128 n.65). Names: Lê Duẩn.'
      src:
        c: bb8c4ca0
        rows: ['w.asselin-hanois-road-to-the 128: all', 'via x.1962-02-26.nghi-quyet-bo-chinh-tri-26-27: A', 'w.van-kien-dang-toan XXIII, 143–64: ?']
- edit:
    id: cal.1962-07-18.vietnam
    base: 95e9e9ab
    set:
      n: '[[w.asselin-hanois-road-to-the]], 134–36; [[w.van-kien-dang-toan]], XXIII, 705–26 (Thư của đồng chí Lê Duẩn gửi Trung ương Cục miền Nam, Về cách mạng miền Nam, the title the editors'', 705, the letter "Ba gửi T.W.C": the lesson of Laos, had the struggle been pushed "quá giới hạn của tình hình" (beyond the limits of the situation), above all the military struggle too far, "có thể có những phản ứng khác của đế quốc" (there could be other reactions of the imperialists), 708; to push the revolution in the South "đi quá mức độ cần thiết" (beyond the necessary degree) would bring no victory, 710; the Americans to be pushed back step by step, their puppet government overthrown and "một chính quyền độc lập và trung lập" (an independent and neutral government) built, the right measure, the Front''s ten slogans "chiến thuật hay" (a good tactic), 711–12; not "method"). Made public: 2002. Names: Lê Duẩn.'
      src:
        c: 32ad4441
        rows: ['w.asselin-hanois-road-to-the 135: A', 'w.asselin-hanois-road-to-the 135–36: B', 'via w.asselin-hanois-road-to-the 134 n.122: all', 'w.van-kien-dang-toan XXIII, 708: A', 'w.van-kien-dang-toan XXIII, 711–12: ?']
- cite: {id: cal.1962-12-06.vietnam, item: '[[w.van-kien-dang-toan]], XXIII, 812–38 (Nghị quyết hội nghị Bộ Chính trị họp từ ngày 6 đến ngày 10 tháng 12 năm 1962: the Americans'' "chiến tranh đặc biệt" (special war) "Từ một năm nay" (for a year now), 812; the armed forces grown fast but still weak, the kinds of troops out of proportion, their technique and tactics behind the enemy''s, 816; the main forces mostly to battalion strength, regiments where they can, 831; the passage on the Center''s leadership and the North''s part not printed, 838; not "two years," the units sent south or the trail)', units: '?'}
- variant: {id: cal.1962-12-06.vietnam, unit: A, witness: w.van-kien-dang-toan, reads: '"Từ một năm nay" (for a year now): the "special war" a year old', at: 'XXIII, 812'}
- check: {id: cal.1962-12-06.vietnam, text: 'Check: two years of the "special war," or one (the resolution, XXIII, 812: "Từ một năm nay," for a year now); and the days (its heading: the session Dec. 6–10).'}
