  - edit:
      id: cal.1967-08-07.china-leadership
      base: cb89561c
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 7, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 173 (Aug. 7, 1967; Wang Li receives the Foreign Ministry rebels and stirs them to seize its power; he reports to Jiang Qing and Chen Boda, who back him; mid-month the rebels storm and smash the ministry''s political department, declare they hold the Party committees power and seal all vice-ministers offices); [[w.macfarquhar-maos-last-revolution]], 228 (with Yao Dengshan and the Foreign Ministry''s rebels: replace the "bureaucrats" with "twenty-somethings"; Chen Yi may be attacked by name, Mao having agreed; the rebels have not seized power well); [[w.mao-zedong-zhuan]], VI, ch. 76 n.66 (Aug. 7, in the evening, Wang Li, just back from Wuhan to a great welcome and elated, sends for representatives of the Foreign Ministry''s ''revolutionary rebel liaison station'' and incites them to seize the power of the Ministry: ''diplomacy, it frightens, no one else can do it, you make it mysterious, only a few experts; is diplomacy so hard? I think handling the Red Guards'' internal problems is much harder; can the Red Guards not do diplomacy?''; ''the Ministry''s Party committee not touched? so great a revolution and the committee not moved? why may it not be moved?''; ''to haul Chen Yi out, the main direction is right, why may they not haul him?''; ''I think you have not got the power now, with some power you have prestige''; the rebels then smash the Ministry and ''seize'' the committee''s power; Aug. 22 at night the foreign-affairs rebels and Peking Red Guards storm and burn the British chargé''s office, the gravest breach of law toward foreigners since the founding, n.66). [[w.yang-jisheng-tiandi-fanfu]], I, 543 (Wang Li, of his own accord, to the Foreign Ministry''s rebels: "the Chairman and the Premier want me to look into the Foreign Ministry"; foreign affairs made a mystery; "can Red Guards not do diplomacy?"; "how much power did you seize in January? the ministry''s Party committee untouched?"; "at twenty one may be a minister"); [[w.yang-jisheng-tiandi-fanfu]], II, 1098 (evening, his Diaoyutai office; Yao Dengshan and the Liaison Station''s chief Wang Zhongqi 王中琪 and five others); [[w.jian-zhou-enlai]], 578 (Wang Li''s speech at the ministry backs Qi''s views as Yao conveyed them and the rebels'' "seizure of power," their attacks on Chen Yi included; Zhou, greatly offended, does not act at once); [[w.friedman-shadow-cold-war]], 153 (Wang Li''s talk to the Liaison Station: beside the Red Guards'' affairs nothing complicated about foreign affairs; a challenge to Zhou). Made public: 1995. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 76), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.hongweibing-jiu-ping-wang-li]], 22–26 (cited by [[w.macfarquhar-maos-last-revolution]], 228 n.27a); Wang Li''s talk of Aug. 7, 1967, in [[w.hongweibing-jiu-ping-wang-li]], 22–26 (cited by [[w.macfarquhar-maos-last-revolution]], 228 n.27b); [[w.li-insiders-account-of-the]], 77–79 (cited by [[w.macfarquhar-maos-last-revolution]], 228 n.28a); [[w.li-xianchang-lishi]], 47–65 (cited by [[w.macfarquhar-maos-last-revolution]], 228 n.28b); [[w.barnouin-chinese-foreign-policy-during]], 155–159 (cited by [[w.macfarquhar-maos-last-revolution]], 228 n.29a); [[w.ge-zai-waijiaobu-duoquan-qian]], 230–234 (cited by [[w.macfarquhar-maos-last-revolution]], 228 n.29b); Wang Li 王力, talk on the seizure of power in the Foreign Ministry 关于外交部夺权问题的讲话 (record 讲话记录), Aug. 7, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.66); the record of the Foreign Ministry stenographer Ye Jiwen 葉紀文, quoted in Yang Rongjia 楊榮甲, *Gongheguo waijiaobu mixin* 《共和國外交部秘辛》 (Dashan wenhua, Hong Kong, 2011), 119–121 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 543 n.72); Huang Hua 黃華, 〈文革時期的荒誕外交〉 (Gongshi wang, Dec. 5, 2014) (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 1098 n.20); [[w.ma-jisen-waijiaobu-wenge-jishi]], 169–171 (cited by [[w.jian-zhou-enlai]], 578 n.51a); [[w.li-wang-li-fansi-lu]], 1015–1026 (cited by [[w.jian-zhou-enlai]], 578 n.51b); [[w.qi-benyu-huiyilu]], II, 661–662 (cited by [[w.jian-zhou-enlai]], 578 n.51c). Names: Wang Li, Chen Yi.'
