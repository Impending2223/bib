  - edit:
      id: cal.1969-01-03.china-leadership
      base: 22577ff2
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 3, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 267 (Dec. 29, 1968; Mao''s note of Jan. 3, 1969); [[w.jianguo-yilai-mao-zedong]], XIX, 391–392 (Jan. 3, 1969; Mao''s note on the envelope (''there is a note inside; Huang Yongsheng to handle'') and his note, ''All the old comrades connected with the February counter-current and their families are not to be criticized; relations are to be mended'', on the Military Commission Office Group''s report of Dec. 26, 1968 with the papers on Xu Xiangqian''s recent conduct); [[w.mao-zedong-zhuan]], VI, ch. 77 n.58 (Jan. 3, on a paper sent by the Military Commission''s Office Group, Mao writes: all the old comrades tied to the ''February counter-current'' and their families are not to be criticized, relations are to be put right; the book does not name Huang Yongsheng or Xu Xiangqian, n.58). Made public: 1995. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Military Commission Office Group, report of Dec. 26, 1968 with the material on Xu Xiangqian''s recent conduct (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 391 n.1); Mao Zedong 毛泽东, comment on a paper sent by the Military Commission''s Office Group 军委办事组 (manuscript 手稿), Jan. 3, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.58). Names: Mao Zedong, Xu Xiangqian, Huang Yongsheng.'
