  - edit:
      id: cal.1969-10-17.china-leadership
      base: 43a92268
      set:
        time_range:
          - 1969-10-17T11:00Z
          - 1969-10-17T14:00Z
        time_band: evening
        time_zone: Asia/Shanghai
        n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 14, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 322 (Oct. 17, 1969; the evening talks with the old comrades); [[w.macfarquhar-maos-last-revolution]], 318 (Mao decides himself where each is to be sent); [[w.macfarquhar-maos-last-revolution]], 318 (the old colleagues often treated with contempt by the provincial authorities; Ye Jianying''s ten months away from the capital); [[w.deng-xiaoping-nianpu-1904]], III, 1948 (Oct. 17, 1969; the nianpu: Zhou Enlai and the Politburo''s members talk in groups with some old cadres in Peking and pass on the decision of Mao and the Center to disperse them, on a war footing, to other places on Oct. 20 or after; Mao names Dong Biwu, Zhu De and Ye Jianying for Guangdong, Chen Yun, Deng Xiaoping and Wang Zhen for Jiangxi, Chen Yi for Shijiazhuang, Nie Rongzhen for Handan and Xu Xiangqian for Kaifeng); [[w.yang-jisheng-tiandi-fanfu]], II, 738 (the decision taken that day by Zhou and the Politburo on Mao''s and the Center''s judgment, the old comrades to leave on Oct. 20 or soon after; Zhou names each one''s place); [[w.teiwes-tragedy-of-lin-biao]], 113 (Zhou, helped by Mao''s chief bodyguard Wang Dongxing, in charge of moving the leaders, Mao and Lin too, Deng Xiaoping and Chen Yun among them; by an authoritative oral source Mao, displeased with the old marshals'' gossiping by telephone, glad to see them scattered; Nie first thought the order came from Mao); [[w.jian-zhou-enlai]], 624 (Zhou''s evacuation plan: Mao to Wuhan, Lin to Suzhou, the four marshals to different places, their discussions ended; not the day). Made public: 1995 ([[w.chen-yi-nianpu]], 1214). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 322 (Oct. 17, 1969), has Zhou saying that Mao fixed each one''s place, that he would phone each place''s arrangements and the Central General Office would ready special planes or trains; afterward he repeatedly told those leaving to take their wives, their Peking residences being kept. To check: [[w.zhou-enlai-nianpu-1949]], III, 329 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.45); [[w.tingdong-wo-pei-ye-shuai]], 53–57 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.47); [[w.su-caiqing-wenhua-dageming-shishi-bianwu]], 79 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21a); [[w.yunsheng-maojiawan-jishi]], 106 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21b); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 320, 322 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21c); Nie Rongzhen, "Several questions concerning Lin Biao," *Xinhua ribao* (Nanjing), Oct. 18–26, 1984, parts of his memoirs serialized, translated in FBIS, Nov. 5–7, 1984, Oct. 25, 1984 (FBIS, Nov. 7, 1984, K24) (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21d); [[w.nianyi-da-dongluande-niandai]], 362 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21e); [[w.ke-wenhua-dageming-zhongde-renmin]], 125, 252 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21f); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21g); [[w.chen-yi-zhuan]], 615 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21h); [[w.li-genqing-before-and-after-lin-biaos-urgent]], 47 (cited by [[w.jian-zhou-enlai]], 624 n.43a); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (cited by [[w.jian-zhou-enlai]], 624 n.43b). See [[cal.1969-10-14.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Dong Biwu, Zhu De, Ye Jianying, Chen Yun, Deng Xiaoping, Wang Zhen, Chen Yi, Nie Rongzhen, Xu Xiangqian.'
