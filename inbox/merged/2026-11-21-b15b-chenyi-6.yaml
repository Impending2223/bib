  - cite:
      id: cal.1968-10-31.china-leadership
      item: '[[w.chen-yi-nianpu]], 1210–1211 (Oct. 31, 1968; the plenum, in a most abnormal state, approves the report on Liu Shaoqi''s crimes, written with false evidence with the backing of Jiang Qing, Kang Sheng, Xie Fuzhi and others, and decides his expulsion "for ever," which the nianpu calls wrong, and adopts several papers for the Ninth Congress; Mao''s closing speech: some comrades did not much understand the "February adverse current" and after some ten days understood it better; those who erred explained, were questioned, and explained again; the matter neither small nor very great; men with views to speak, Politburo members, vice-premiers, some vice-chairmen of the Military Commission, within what Party life allows, and they spoke openly; always a left, a center and a right; the absence of the "February adverse current" comrades from the Ninth Congress would be a shortcoming; "Comrade Chen Yi, you come to the Ninth Congress in the character of that right side")'
  - check:
      id: cal.1968-10.china-leadership-16
      text: 'Check: whether Mao said it as an interjection in Chen Yi''s self-criticism, or in his closing speech of Oct. 31, where the *Chen Yi nianpu* ([[w.chen-yi-nianpu]], 1211) has him tell Chen Yi to come to the Ninth Congress as the representative of the right.'
