        when: Oct., after the 17th
        date: 1969-10
        at: after 1969-10-17
        thread: china-leadership
        c: 'Xu Xiangqian 徐向前 asks the Center 中央 to change his and Chen Yi''s 陈毅 places of dispersal: Shijiazhuang 石家庄 has better medical care than Kaifeng 开封 and is nearer Peking 北京, and he is in better health than Chen Yi. The Center soon agrees.'
        n: '[[w.chen-yi-nianpu]], 1214. Made public: 1995. Names: Xu Xiangqian, Chen Yi.'
        tags: [polity:prc, name:chen-yi, name:xu-xiangqian, ok:fields-place, vis:only:prc]
  - add:
      entry:
        id: cal.1969-10-20.china-leadership-5
        when: Oct. 20
        date: '1969-10-20'
        place: shijiazhuang
        thread: china-leadership
        c: Chen Yi 陈毅, with his wife Zhang Qian 张茜, reaches Shijiazhuang 石家庄 by train, to work at the Ministry of Railways' Shijiazhuang Rolling Stock Works 铁道部石家庄车辆厂, half the day at labor and half at study.
        n: '[[w.chen-yi-nianpu]], 1214. The nianpu''s note (1214 n.1) dates the move from the Center''s deadline and from Zhang Qian''s letter of Dec. 22, 1970 (a year and a day at Shijiazhuang, back in Peking on Oct. 21, 1970), and calls an unnamed article''s departure of Oct. 21, put off a day for Chen Yi''s books with Zhou Enlai''s approval, probably wrong. Made public: 1995. To check: Zhang Qian 张茜, letter to 少艾 and 重坤 《张茜致少艾、重坤信》, Dec. 22, 1970 (cited by [[w.chen-yi-nianpu]], 1214 n.1). Names: Chen Yi.'
        tags: [polity:prc, name:chen-yi, vis:only:prc]
  - add:
      entry:
        id: cal.1969-10.china-leadership-15
        when: Oct.–Nov.
        date: 1969-10
        at: after 1969-10-20
        place: shijiazhuang
        thread: china-leadership
        c: 'Shijiazhuang 石家庄, the rolling stock works. Chen Yi 陈毅, after seeing the works'' history exhibition, calls 刘一身, one of its drafters, a "scholar" 秀才; to Liu''s demurral, that he went to work after primary school: a primary-school graduate is a small intellectual, and the Communist Party was founded by intellectuals joining Marxism-Leninism to the workers'' movement. Later, hearing his staff jibe at "stinking intellectuals" 臭知识分子: socialism cannot be built without intellectuals, and China has too few of them, not too many.'
        n: '[[w.chen-yi-nianpu]], 1214. Made public: 1995. Names: Chen Yi.'
        tags: [polity:prc, name:chen-yi, vis:only:prc]
  - add:
      entry:
        id: cal.1969-11.china-leadership-7
        when: Nov.
        date: 1969-11
        place: shijiazhuang
        thread: china-leadership
        c: 'Shijiazhuang 石家庄, the rolling stock works, at the restoring of its Party committee. To talk that the revolutionary committee suffices, and that with the rebels in power no Party committee is needed, Chen Yi 陈毅 at workshop group meetings: a revolutionary committee alone is not enough, nor Chairman Mao alone, nor mass organizations alone; there must be the Party and its organizations at every level; no syndicalism, which Zhang Guotao 张国焘 tried and failed; the works'' own Master Zhang 张师傅, who in 1913 struck the foreman Wang 王 and escaped, his two sons dying in prison, failed for want of the Party''s leadership.'
        n: '[[w.chen-yi-nianpu]], 1214–1215. Made public: 1995. Names: Chen Yi, Mao Zedong.'
        tags: [polity:prc, name:chen-yi, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1969-11.china-leadership-8
        when: Nov.
        date: 1969-11
        place: shijiazhuang
        thread: china-leadership
        c: 'Shijiazhuang 石家庄, the rolling stock works. Chen Yi 陈毅, later, at another meeting: the dialectical relations of masses, classes, parties and leaders must be made clear; masses without leaders will not do, leaders without masses still less; the Party the key link.'
        n: '[[w.chen-yi-nianpu]], 1215. Made public: 1995. Names: Chen Yi.'
        tags: [polity:prc, name:chen-yi, vis:only:prc]
