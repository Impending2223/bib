  - add:
      entry:
        id: cal.1968-12.china-leadership-13
        when: Dec.
        date: 1968-12
        thread: china-leadership
        c: 'The Ministry of Public Security 公安部, in the hands of Xie Fuzhi 谢富治, in tracing the "backers" of the leaflet case of the "Extraordinary Committee of the Communist Party of China''s Central Committee" 中共中央非常委员会, broken at Tianjin 天津 in November 1967, makes up a false party: Zhu De 朱德 "secretary" of the center of a "Chinese (Marxist-Leninist) Communist Party" 中国（马列）共产党, Chen Yi 陈毅 "deputy secretary and minister of defense," Li Fuchun 李富春 "premier," its members Dong Biwu 董必武, Ye Jianying 叶剑英, Li Xiannian 李先念, He Long 贺龙, Liu Bocheng 刘伯承, Xu Xiangqian 徐向前, Nie Rongzhen 聂荣臻, Tan Zhenlin 谭震林, Yu Qiuli 余秋里, Wang Zhen 王震, Liao Chengzhi 廖承志 and others, accused of "illicit relations with foreign countries" 里通外国, "preparing armed rebellion" and planning a "coup."'
        n: '[[w.chen-yi-nianpu]], 1211. Made public: 1995. Names: Xie Fuzhi, Zhu De, Chen Yi, Li Fuchun, Dong Biwu, Ye Jianying, Li Xiannian, He Long, Liu Bocheng, Xu Xiangqian, Nie Rongzhen, Tan Zhenlin.'
        tags: [polity:prc, name:chen-yi, name:xie-fuzhi, name:zhu-de, name:li-fuchun, name:dong-biwu, name:ye-jianying, name:li-xiannian, name:he-long, name:liu-bocheng, name:xu-xiangqian, name:nie-rongzhen, name:tan-zhenlin, ok:fields-place, vis:only:prc]
