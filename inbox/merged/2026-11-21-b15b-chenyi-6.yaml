  - add:
      entry:
        id: cal.1969.china-leadership-66
        when: 1969, from March
        date: '1969'
        at: before 1969-04
        thread: china-leadership
        also: [soviet-union]
        c: 'The four marshals'' forum (Ye Jianying 叶剑英, Chen Yi 陈毅, Xu Xiangqian 徐向前, Nie Rongzhen 聂荣臻), in reports among them "Looking at a Zhenbao tree from the world forest" 《从世界森林看一颗珍宝树》: the Soviet Union''s strategic center lies in Europe, its incidents on the Chinese border meant to bear fruit there; with Sino-Soviet relations tense China should ease its relations with the United States and so open a new phase in its diplomacy. The reports draw Mao''s 毛泽东 attention.'
        n: '[[w.chen-yi-nianpu]], 1213. Made public: 1995. See [[cal.1969-02-21.china-leadership-2]]. Names: Ye Jianying, Chen Yi, Xu Xiangqian, Nie Rongzhen, Mao Zedong. Check: the nianpu dates none of the reports, nor the one it names.'
        tags: [polity:prc, name:chen-yi, name:mao-zedong, name:ye-jianying, name:xu-xiangqian, name:nie-rongzhen, ok:fields-place, vis:only:prc]
