  - add:
      entry:
        id: cal.1968-10.china-leadership-25
        when: Oct., from the Twelfth Plenum's opening
        date: 1968-10
        at: after 1968-10-13
        place: peking
        thread: china-leadership
        c: The enlarged Twelfth Plenum 八届扩大的十二中全会, Peking 北京. From its opening Kang Sheng 康生, Jiang Qing 江青 and others, on the pretext of discussing Mao's 毛泽东 question whether the "Cultural Revolution" 文化大革命 was needed, have the groups besiege the old comrades of the so-called "February adverse current" 二月逆流, Chen Yi 陈毅, Ye Jianying 叶剑英, Li Fuchun 李富春, Li Xiannian 李先念, Xu Xiangqian 徐向前 and Nie Rongzhen 聂荣臻, and the old comrades "consistently rightist" 一贯右倾, Zhu De 朱德, Chen Yun 陈云, Deng Zihui 邓子恢 and Wang Jiaxiang 王稼祥.
        n: '[[w.chen-yi-nianpu]], 1210. Made public: 1995. Names: Kang Sheng, Jiang Qing, Mao Zedong, Chen Yi, Ye Jianying, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Zhu De, Chen Yun.'
        tags: [polity:prc, name:chen-yi, name:kang-sheng, name:jiang-qing, name:ye-jianying, name:li-fuchun, name:li-xiannian, name:xu-xiangqian, name:nie-rongzhen, name:zhu-de, name:chen-yun, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1968-11.china-leadership-8
        when: Nov.
        date: 1968-11
        place: shanghai
        thread: china-leadership
        c: Zhang Chunqiao 张春桥 has Wang Hongwen 王洪文, Xu Jingxian 徐景贤 and others, in the name of preparing materials for the Ninth Congress 中共第九次全国代表大会, compile a so-called *Short collection of Chen Yi's reactionary remarks* 《陈毅反动言论小集》 and hand it out at Shanghai 上海 in the study class of the Ninth Congress's delegates, slandering Chen Yi 陈毅 as having "capitulated to imperialism, revisionism and reaction" and "made public opinion for restoring capitalism," to keep him out of the Ninth Congress.
        n: '[[w.chen-yi-nianpu]], 1211. Made public: 1995. Names: Zhang Chunqiao, Chen Yi.'
        tags: [polity:prc, name:chen-yi, name:zhang-chunqiao, vis:only:prc]
