  - edit:
      id: cal.1968-03-22.china-leadership
      base: c76a023a
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 22, 1968. [[w.zhou-enlai-nianpu-1949-2020]], III, 221 (Mar. 22, 1968); [[w.jianguo-yilai-mao-zedong]], XIX, 440 n.15 (Mar. 1968; the editors'' note: Yang Chengwu, Yu Lijin and Fu Chongbi removed from their posts, and detained, in the "Yang, Yu, Fu incident"; it gives no day and no issuing bodies); [[w.macfarquhar-maos-last-revolution]], 246 (Huang Yongsheng, Lin Biao''s man, made chief of staff at once in full, not acting; Yu Lijin''s going leaves Wu Faxian more firmly in charge of the air force; Wen Yucheng the new garrison commander); [[w.mao-zedong-zhuan]], VI, ch. 77 n.5 (the book puts the fall of Yang Chengwu, Yu Lijin 余立金 and Fu Chongbi in March 1968 without the day, a stroke planned by Lin Biao 林彪 and Jiang Qing with Mao''s consent beforehand: Zhou Enlai told Yang after his release in 1974 that Lin denounced him to Mao repeatedly and it was studied four times before Mao agreed; Yang was acting chief of the General Staff, Yu political commissar of the Air Force, Fu commander of the Peking Garrison; Mao held back somewhat, n.5, n.6 (Apr. 6, 1968), n.7). [[w.teiwes-tragedy-of-lin-biao]], 90, 101–102 (on the 22nd Yang and Yu arrested and Fu transferred; Huang Yongsheng the new chief of staff); [[w.jian-zhou-enlai]], 584 (in March Yang Chengwu, acting chief of staff, Yu Lijin, the Air Force''s political commissar, and Fu Chongbi, the Peking Garrison''s commander, arrested without warning; on Mar. 22 removed from their posts). Made public: 1995. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.jiaoyanshi-zhongguo-gongchan-dang-qishi]], 555–557 (cited by [[w.macfarquhar-maos-last-revolution]], 246 n.32a); [[w.huang-factionalism-in-chinese-communist]], 311–314 (cited by [[w.macfarquhar-maos-last-revolution]], 246 n.32c); [[w.wenqian-wannian-zhou-enlai]], 265 (cited by [[w.macfarquhar-maos-last-revolution]], 246 n.32d); [[w.yunsheng-maojiawan-jishi]], 215–220 (cited by [[w.macfarquhar-maos-last-revolution]], 246 n.33); [[w.yang-chengwu-jiangjun-zishu]], 303, 339–340, 374 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.5); Mao Zedong 毛泽东, talk with all attending the Military Commission meeting 中央军委会议 (record 讲话记录), Dec. 21, 1973, in which he says the ''Yang, Yu, Fu affair'' was Lin Biao''s doing and that he heard one side only and made a mistake (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.7); [[w.kau-lin-piao-affair]], 488–489 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97a); [[w.yunsheng-maojiawan-jishi]], 151 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97b); [[w.weixun-wo-suo-zhidaode-ye]], 225 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97c); [[w.nianyi-da-dongluande-niandai]], 290 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97d); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97e). Names: Lin Biao, Huang Yongsheng, Yang Chengwu, Yu Lijin, Fu Chongbi, Wen Yucheng. Check: the chronology''s note 2 (Lin Biao and Jiang Qing framing them; rehabilitated 1974, 1979) is the editors''.'
  - edit:
      id: cal.1968-03-24.china-leadership
      base: b7aa5766
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 22, 1968. [[w.zhou-enlai-nianpu-1949-2020]], III, 221–222 (Mar. 24, 1968; Lin''s announcement, note 1); [[w.yang-jisheng-tiandi-fanfu]], I, 442–444 (the meeting of 10,000 cadres of regiment level and above of the army organs, units and academies in Peking in the Great Hall''s auditorium, waiting from 9 p.m. and beginning after midnight; Yang Chengwu removed as acting chief of staff, Yu Lijin arrested, Fu Chongbi removed as garrison commander; Lin, on Mao''s three points (against factionalism, against double-dealing, the relative and the absolute): "a matter neither large nor small"; Yang with Yu to bring down Wu Faxian, with Fu to bring down Xie Fuzhi; praise of Jiang Qing; Zhou: a new "February adverse current," praise of Jiang Qing in the thirties, and leads the cry "down with whoever opposes Comrade Jiang Qing"; Jiang Qing, Chen Boda and Kang Sheng speak; Mao appears on the platform); [[w.yang-jisheng-tiandi-fanfu]], II, 1146 (a rally of ten thousand at the Great Hall: Yang Chengwu, Yu Lijin and Fu Chongbi removed, Yu arrested); [[w.teiwes-tragedy-of-lin-biao]], 52, 92–101 (Lin, two hours late, speaks from an outline Mao gave him: Yang''s "mountaintopism," trusting a small gang from one district of Jin-Cha-Ji; "double dealing," a "Luo Ruiqing element"; the "distortion of Marxism," the "absolute authority" theory; Yang meant to remove Wu Faxian, Xie Fuzhi, Xu Shiyou, Han Xianchu, Huang Yongsheng, Chen Xilian and Yang Dezhi; the minority to be knocked down; the top leadership met Mao four times to decide; nothing of a "rightist wind" or a backer; of Jiang Qing: she "loyally executed Chairman Mao''s instructions" and "has been very creative herself"); [[w.jian-zhou-enlai]], 584 ("Two days later," at a mass rally, standing before Mao, Lin lists their crimes, factionalism and opposition to Mao Thought, mistakes "neither very big nor very small"). Made public: 1995. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 221–222 (Mar. 24, 1968), has Zhou speak at the meeting after Lin: he supports Mao''s decision and the order Lin announced, speaks of the three men''s "errors", and affirms and praises Jiang Qing. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 3rd ed., 2008), 727 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 442 n.57); Lin Biao 林彪, 《在軍隊幹部大會上講話》, Mar. 24, 1968, in the *Wenku* (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 443 n.58); 《中央首長在接見軍隊幹部會議上的講話》 (Zhou Enlai, Jiang Qing, Chen Boda), Mar. 24, 1968 (printed 1967), in the *Wenku* (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 443 n.59); [[w.nianyi-da-dongluande-niandai]], 273–284, 286, 293 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73a); [[w.harding-chinese-state-in-crisis-1991]], 186 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73b); [[w.teiwes-provincial-leadership-in-china]], 12, 22–24, 31 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73c); [[w.kau-lin-piao-affair]], 488–500 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73d); [[w.barnouin-ten-years-of-turbulence]], 165, 167 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73e); [[w.kau-lin-piao-affair]], 489–490, 494 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.74); [[w.kau-lin-piao-affair]], 488 (cited by [[w.teiwes-tragedy-of-lin-biao]], 93 n.78); [[w.kau-lin-piao-affair]], 493–494 (cited by [[w.teiwes-tragedy-of-lin-biao]], 94 n.79a); [[w.kau-lin-piao-affair]], 490, 495 (cited by [[w.teiwes-tragedy-of-lin-biao]], 96 n.84a); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXVI, 88, 90 (cited by [[w.teiwes-tragedy-of-lin-biao]], 96 n.84b); [[w.kau-lin-piao-affair]], 489, 497–499 (cited by [[w.teiwes-tragedy-of-lin-biao]], 100 n.93); [[w.kau-lin-piao-affair]], 488–489 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97a); [[w.yunsheng-maojiawan-jishi]], 151 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97b); [[w.weixun-wo-suo-zhidaode-ye]], 225 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97c); [[w.nianyi-da-dongluande-niandai]], 290 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97d); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97e); [[w.kau-lin-piao-affair]], 496 (cited by [[w.teiwes-tragedy-of-lin-biao]], 52 n.103); Lin Biao''s speech at a conference of commanders above army level, Mar. 24, 1968, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 584 n.73). See [[cal.1968-03-22.china-leadership]]. Names: Lin Biao, Yang Chengwu, Yu Lijin, Fu Chongbi.'
