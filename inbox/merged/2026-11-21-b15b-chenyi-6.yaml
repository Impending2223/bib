        c: Huang Yongsheng 黄永胜 and Wu Faxian 吴法宪 go to Li Fuchun's 李富春 home and convey Mao's 毛泽东 and Lin Biao's 林彪 notes on the old comrades of the "February adverse current" 二月逆流. The notes are conveyed only within Li Fuchun's Party branch, kept from the Party and the public, and kept from Zhou Enlai 周恩来, to whom with Lin Mao had sent them, until Lin's fall.
        n: '[[w.chen-yi-nianpu]], 1212. Made public: 1995. Names: Huang Yongsheng, Wu Faxian, Li Fuchun, Mao Zedong, Lin Biao, Zhou Enlai.'
