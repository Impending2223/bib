      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 21, 1962 (the entry for Feb. 21–23). [[w.zhou-enlai-nianpu-1949]], II, 460 (Feb. 21–23, 1962: Zhou Enlai attends; the discussion found a deficit of 5 billion yuan in that year''s budget; Chen Yun''s two stages, five years of recovery and then development; Zhou agrees); [[w.macfarquhar-origins-of-the-cultural]], III, 187–88 (Feb. 21–23: the Finance and Trade Office''s report, balanced at 30 billion yuan each side, found to hide a 1962 deficit of 5 to 6 billion; credit and currency figures; Liu orders a new report); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 549 (Feb. 21–23, 1962; Liu presides at the enlarged Politburo Standing Committee meeting at Xilou on the 1962 state budget and the economy; Liu: the work conference did not bring the difficulties fully to light; "if there is a problem, who does not wish to uncover it, afraid to say all is black?"; the present is a period of recovery, unlike the three years after 1949, an abnormal period with the character of an emergency, and not to be met by normal means; Chen Yun speaks on the economic situation and ways to overcome the difficulties, Liu approving, and Liu proposes a State Council meeting at which Chen Yun speaks more fully; Feb. 26 Chen Yun gives his report "Some measures for the present financial and economic situation and for overcoming difficulties" to the Party-group members of the State Council''s departments, with Li Fuchun and Li Xiannian on industry, construction, finance, credit and the market; afterward Liu proposes that the Center forward Chen Yun''s and the others'' reports to the whole country). Made public: 2013. Check: Zhou''s nianpu gives the deficit as 5 billion yuan, this entry 3 billion. Check: MacFarquhar gives the deficit found as 5 to 6 billion yuan (Li Xiannian''s estimate 6), this entry 3 billion. To check: [[w.gongheguo-zhuxi-liu-shaoqi]], 50–51 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 187 n.5); [[w.jin-1949-1989-nia