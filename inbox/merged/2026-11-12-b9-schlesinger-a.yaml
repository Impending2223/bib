- cite:
    id: cal.1960-11-08.elections-1960
    item: '[[w.schlesinger-robert-kennedy-and-his]], 220 (Herbert Klein, on Nixon''s behalf, reads a curt concession at the press conference Nixon called in Los Angeles, the morning after election night; not the figures, the States or the House and Senate)'
    units: F
- cite:
    id: cal.1960-12-15.robert-kennedy
    item: '[[w.schlesinger-robert-kennedy-and-his]], 231–32 (in mid-December, the morning after Robert Kennedy''s call to say no, at his brother''s house in Georgetown, over breakfast, Seigenthaler present: "I need you in this government"; "he needed some people around that he could talk to so I decided to accept it," by Robert Kennedy''s memorandum of 1961; the day not given)'
    units: A-C
- to-check:
    id: cal.1960-12-15.robert-kennedy
    add: 'John Seigenthaler, recorded interview by R. J. Grele, Feb. 22, 1966, 183–201, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 232 n.41).'
- cite:
    id: cal.1960-12.transition-and-staff-cabinet-9
    item: '[[w.schlesinger-robert-kennedy-and-his]], 231 (Hoover tells him to take it, and Kennedy tells Seigenthaler he doubts Hoover meant it; Rogers sees little challenge in it, McInerney and Ormsby-Gore against; Douglas for it; the last talk, with Ethel Kennedy and Seigenthaler over dinner at Hickory Hill, in mid-December; not McClellan or Pearson)'
    units: '?'
- check:
    id: cal.1960-12.transition-and-staff-cabinet-9
    text: 'Check: Schlesinger, 231, puts the dinner at Hickory Hill in mid-December, the evening before the Georgetown breakfast ([[cal.1960-12-15.robert-kennedy]]), and has Douglas, too, for his taking the office.'
- cite:
    id: cal.1961-05.freedom-rides-2
    item: '[[w.schlesinger-robert-kennedy-and-his]], 295 (the President, in the White House, preparing for de Gaulle and Khrushchev, to Wofford: "Tell them to call it off ... Stop them"; Wofford: "I don''t think anybody''s going to stop them right now"; before Seigenthaler is sent to Birmingham; not the telephone)'
    units: '?'
- to-check:
