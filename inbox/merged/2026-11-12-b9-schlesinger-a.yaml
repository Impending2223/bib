    text: 'Check: Schlesinger, 485, has the contaminated suit only proposed, Donovan giving Castro a clean one of his own before it.'
- cite:
    id: cal.1961-05-31.latin-america
    item: '[[w.schlesinger-robert-kennedy-and-his]], 491 (the President in Paris; Salinger, "running ahead of hard information," tells reporters that Trujillo is dead, a statement some took for foreknowledge; not Rusk''s call or Trujillo''s son)'
    units: '?'
- cite:
    id: cal.1962-12-24.cuba-2
    item: '[[w.schlesinger-robert-kennedy-and-his]], 537 (half the remaining prisoners loaded, the Cubans hold the rest until the $2.9 million unpaid for the April release comes; Robert Kennedy turns to Cushing, who raises $1 million in a few hours from Latin American friends; Clay raises the rest on his personal note; not the flights, the hour, the figure $1,925,000 or the calls of Nolan and Williams)'
    units: '?'
