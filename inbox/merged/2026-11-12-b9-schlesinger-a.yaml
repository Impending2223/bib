- cite:
    id: cal.1962-12-24.cuba
    item: '[[w.schlesinger-robert-kennedy-and-his]], 537 (Christmas Eve: the last of 1,113 prisoners off in Miami, Donovan calls Katzenbach, and Katzenbach Robert Kennedy at Hickory Hill, among his children: "Bob, they are all in; it''s over"; Kennedy: "what about Hoffa?"; not the hour or the down payment)'
