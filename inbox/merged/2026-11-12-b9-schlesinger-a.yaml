    text: 'Check: Schlesinger, 485, has the poison pills in April 1962; so [[cal.1962-05-07.robert-kennedy]].'
- cite:
    id: cal.1962-12.cuba-5
    item: '[[w.schlesinger-robert-kennedy-and-his]], 485 (a diving suit contaminated with a tubercle bacillus and dusted inside with a fungus, proposed for Donovan to give Castro during the talks on the prisoners; Donovan, knowing nothing of it, gives Castro a clean suit of his own; not "nice big germ bag")'
    units: '?'
