    add: 'Harris Wofford, recorded interview by Jean Stein, Oct. 3, 1968, 19, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 295 n.47).'
- cite:
    id: cal.1961-05-21.freedom-rides
    item: '[[w.schlesinger-robert-kennedy-and-his]], 297–98 (Sunday evening, fifteen hundred to hear King at the First Baptist Church; the mob burns a car before it; the marshals, with Mann''s troopers and at last the National Guard, drive the mob back, the Negroes in the church not daring to leave; airborne troops on alert at Fort Benning; not Abernathy, Patterson''s order or martial law)'
    units: '?'
- check:
    id: cal.1961-05-20.freedom-rides
    text: 'Check: Schlesinger, 297, has Robert Kennedy send in five hundred marshals, Byron White in command, on Sunday, May 21.'
- cite:
    id: cal.1963-05-08.alabama-birmingham-3
    item: '[[w.schlesinger-robert-kennedy-and-his]], 329 (after the agreement Connor arrests King again; Shuttlesworth readies the marchers; Dolan telephones the Attorney General, who talks with Shuttlesworth, by Andrew Young''s account; the march canceled and King released; not the bonds, the hearing, A. D. King, Bevel''s reserves or the day)'
    units: '?'
- to-check:
    id: cal.1963-10-14.defense
    add: 'Robert F. Kennedy, memorandum, Aug. 4, 1964, 3, RFK Papers; Robert F. Kennedy, recorded interview by John Bartlow Martin, Apr. 30, 1964, III, 9–10, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 384 n.69).'
- cite:
    id: cal.1960-08-25.congo
    item: '[[w.schlesinger-robert-kennedy-and-his]], 481, 485 (in August 1960 the CIA decides to kill Lumumba; a week after the NSC meeting Gray passes on to the Special Group the President''s "extremely strong feelings on the necessity for very straightforward action," not meaning assassination; the next day Dulles sends the assassination order to the station at Leopoldville; not the days, the planning''s words or Bissell)'
    units: '?'
- cite:
    id: cal.1960-09.cuba-2
    item: '[[w.schlesinger-robert-kennedy-and-his]], 483 (Rosselli brings in Giancana, whose connection is Trafficante; in the fall of 1960 the CIA installs Giancana and Rosselli in a Miami Beach hotel; not the week, the aliases, the exiles or Orta)'
    units: '?'
- cite:
    id: cal.1960-10-31.crime-and-hijacking-maheu
    item: '[[w.schlesinger-robert-kennedy-and-his]], 483 (Giancana, jealous over Phyllis McGuire, asks the CIA for an illegal tap in the room of the comedian Dan Rowan in Las Vegas, and the Agency obliges; when it is found, the Agency does its best to stop the prosecution; not the day, the maid, Balletti or Rosselli''s bail)'
    units: '?'
- cite:
    id: cal.1962-05.cuba-2
    item: '[[w.schlesinger-robert-kennedy-and-his]], 485 (poison pills in April 1962, after Helms ordered Harvey to reactivate the project; not the van, the parking lot or Robert Kennedy''s briefing)'
