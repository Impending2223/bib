- edit:
    id: cal.1964-01-05.elections-1964-johnson
    base: 684b5523
    set:
      n: '[[w.johnson-white-house-diary]], 30 (Lady Bird Johnson''s account; before it, coffee with the Connallys at the Governor''s Mansion). After [[cal.1964-01-05.press-and-broadcasting|St. Barnabas and the drive through Johnson City]], in Lady Bird Johnson''s sequence ("We began it by going to St. Barnabas," 29; "Next, we went out to Senator Yarborough''s," 30). Names: Johnson, Lady Bird Johnson, Yarborough.'
- edit:
    id: cal.1964-01-05.china-leadership-9
    base: 0c1123de
    set:
      n: '[[w.zhu-de-nianpu-xinbian]], III, 1895. After [[cal.1964-01-05.china-leadership-8|Jinan]]: the tour, as the nianpu gives it on Jan. 4, runs Shandong before Jiangsu (III, 1895). Made public: 2016. Names: Zhu De.'
- edit:
    id: cal.1964-01-11.poverty-2
    base: 7fd422db
    set:
      n: '[[w.johnson-white-house-diary]], 40–41 (Lady Bird Johnson''s account). After [[cal.1964-01-11.poverty|Scranton and Wilkes-Barre]], in Lady Bird Johnson''s sequence: the squares, the mill and the institute, then lunch, "Then we went to Wilkes College" (39–40). See [[cal.1964-01-11.poverty]]. Names: Lady Bird Johnson, Graham.'
- edit:
    id: cal.1964-01-18.china-leadership-7
    base: da4124c1
    set:
      n: '[[w.yang-shangkun-riji]], II, 344 (Jan. 18, 1964). The words: 办公到1时，打羽毛球后睡 (II, 344). After [[cal.1964-01-18.china-leadership-6|the 6 p.m. talk]], in the diary''s sequence: the talk at 6, a film after dinner, work to 1 a.m., then badminton and sleep (II, 344). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun.'
- edit:
    id: cal.1964-01-21.china-leadership-9
    base: 3898099e
    set:
      n: '[[w.chen-yi-nianpu]], 1010. The words: 之后 (1010). After [[cal.1964-01-21.china-leadership-2|the arrival at Conakry]]: the nianpu writes the poems "afterward" 之后, in its item of the morning''s flight from Bamako to Conakry (1010). To check: *Chen Yi shici xuanji* 陈毅诗词选集 (not carded), the poems. Names: Chen Yi, Zhang Qian.'
