      c: Mississippi 3rd, special election, all candidates on one ballot, a majority needed. Charles Evers (D) over Charles H. Griffin (D), 33,706 to 28,927, 29.3 percent, Ellis Bodron (D) 22,842, 19.9 percent, and four others; a run-off.
      n: 'Votes: CQ Guide 6th (2010) 1284, 1286 n.1. Check: the Mississippi secretary of state''s returns. [[w.dittmer-local-people]], 420; [[w.cq-weekly-report]], Mar. 1, 1968, 421, 422 (the date; seven candidates). Check: [[w.cq-weekly-report]], Mar. 1, 1968, 421, from 308 of 309 precincts: Evers 33,645, Griffin 28,792, Bodron 22,829. Griffin, after the vote, asked the white candidates'' supporters to unite behind him; Evers: "the beginning of the end of racism in Mississippi" (422). To check: [[w.crespino-in-search-of-another]]. See [[cal.1968-02-20.specials]]. Names: Charles Evers, Griffin.'
      tags:
      - name:evers-charles
      - name:griffin-charles-h
      - state:ms
- edit:
