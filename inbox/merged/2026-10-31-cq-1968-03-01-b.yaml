- edit:
    id: cal.1968-02-21.economy
    base: 0548d63b
    set:
      n: 'FRUS 1964–68, VIII, doc. [180](https://history.state.gov/historicaldocuments/frus1964-68v08/d180). [[w.cq-weekly-report]], Mar. 1, 1968, 382. On the floor, by its account (382–83): Blackburn''s amendment, a 12.5 percent cover, refused 39–73 standing; Albert W. Johnson''s, 18.75 percent, by voice; Mills: defeat "could create the greatest run on our gold stocks that has ever occurred"; Ford: "to cure cancer with a band aid." The House Republican Policy Committee against "sanctioning in advance the dissipation of our remaining gold supply"; Fowler and Martin, by letter to Patman, against a partial cover. Check: [[w.cq-weekly-report]], Mar. 1, 1968, 382, gives the recommittal 188–206. To check: [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]. See [[cal.1968-01-01.economy]]. Names: Fowler, Johnson.'
- edit:
    id: cal.1968-02-27.congress
    base: 98d14e2d
    set:
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 380–81. In the debate (381): Thompson, the floor manager, against the cuts; Steiger''s amendment would "bureaucratize the arts"; Gross: "twaddle"; Mahon for the current level. Matsunaga''s amendment for a Poet Laureate, five years at $25,000 a year, ruled not germane. Names: Ashbrook, Gibbons, Steiger.'
