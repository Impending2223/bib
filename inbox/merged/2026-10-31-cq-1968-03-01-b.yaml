      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 407. See [[cal.1968-02-19.economy]].'
- add:
    entry:
      id: cal.1968-02.war-opposition
      when: Feb.
      date: 1968-02
      thread: war-opposition
      c: 'The Friends Committee on National Legislation''s agenda for 1968, in its *Washington Newsletter*: the bombing of North Vietnam stopped; no more money for the war; no surcharge; no defoliants or napalm; the nonproliferation treaty ratified; no ABMs.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 408–09. Check: the day (CQ: early February).'
