      c: House Armed Services puts off its hearings on nuclear ships, set for Feb. 27, at the Defense Department's request; Rivers. Set first for Feb. 6, put off then at the Navy's.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 391. Names: Rivers.'
      tags:
      - name:rivers-l-mendel
