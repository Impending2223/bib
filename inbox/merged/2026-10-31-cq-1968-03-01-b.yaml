      when: Feb. 8
      date: '1968-02-08'
      thread: republican-party-congress
      also:
      - crime-and-hijacking
      c: 'Ford on the crime program: "much like a prize fighter with dazzling foot work but no punch."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 392. See [[cal.1968-02-07.crime-and-hijacking]]. Names: Ford.'
      tags:
      - name:ford-gerald-r
- add:
    entry:
      id: cal.1968-02-12.crime-and-hijacking
      when: Feb. 12
      date: '1968-02-12'
      thread: crime-and-hijacking
      also:
      - crime-and-hijacking-guns
      c: 'Ramsey Clark, in an interview: no deal planned on wiretapping for the safe streets bill; gun control as a rider on an antiriot bill "not entirely the strategy."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 394. See [[cal.1968-02-07.crime-and-hijacking]]. Names: Ramsey Clark.'
      tags:
      - name:clark-ramsey
- add:
    entry:
      id: cal.1967-12-11.crime-and-hijacking
      when: Dec. 11
      date: '1967-12-11'
      thread: crime-and-hijacking
      c: 'The FBI: crime in the first nine months of 1967 up 16 percent from 1966; 15 in the cities, 17 in the suburbs, 12 in rural areas; a shortage of more than 50,000 policemen.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 392.'
- add:
    entry:
      id: cal.1968-02-19.conservation
      when: Feb. 19–20
      date: '1968-02-19'
      thread: conservation
      c: 'Senate Interior''s public lands subcommittee on the San Gabriel, Mount Jefferson and Washakie wilderness bills, the first additions proposed since 1964. Cliff, for the Forest Service, Feb. 19. The Wilderness Society: the Service logged and built roads by Mount Jefferson "in a conscious effort" to keep land out; 730,000 acres for Washakie against the Service''s 679,520.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 391. Names: Cliff. Check: the day of the Society''s testimony.'
      tags:
      - name:cliff-edward-p
- add:
    entry:
      id: cal.1968-02-26.conservation
      when: Feb. 26
      date: '1968-02-26'
      thread: conservation
      c: Senate Interior reports S. 2531, the San Gabriel Wilderness, 36,137 acres of the Angeles National Forest, Cal., the first addition to the system (S. Rept. 1008).
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 390. See [[cal.1968-02-19.conservation]].'
      tags:
      - state:ca
