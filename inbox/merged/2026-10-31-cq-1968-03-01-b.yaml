ops:
- add:
    entry:
      id: cal.1968-02-27.open-housing
      when: Feb. 27
      date: '1968-02-27'
      thread: open-housing
      c: 'Dirksen on cloture: "If I walk in with a bill I think we can get cloture."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 377. See [[cal.1968-02-06.open-housing]]. Names: Dirksen.'
      tags:
      - name:dirksen-everett
- add:
    entry:
      id: cal.1968-02-28.open-housing
      when: Feb. 28
      date: '1968-02-28'
      thread: open-housing
      c: 'The compromise announced. Mondale: "a miracle," more than could have been expected "just a week ago." Dirksen on his change: "One would be a strange creature indeed in this world of mutation if in the face of reality he did not change his mind"; the riots of 1967 "put this whole matter in a different frame."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 377, 379. See [[cal.1968-02-06.open-housing]]. Names: Mondale, Dirksen. Check: the day of Dirksen''s remarks.'
      tags:
      - name:mondale-walter-f
      - name:dirksen-everett
- add:
    entry:
      id: cal.1968-02-29.open-housing
      when: Feb. 29
      date: '1968-02-29'
      thread: open-housing
      c: Senate, H.R. 2516. Dirksen modifies his substitute, narrowing its coverage; other amendments to restrict the fair housing title offered.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 377, 379. See [[cal.1968-02-06.open-housing]]. Names: Dirksen.'
      tags:
      - name:dirksen-everett
- add:
    entry:
      id: cal.1968-02-22.vietnam-congress-2
      when: Feb. 22
      date: '1968-02-22'
      thread: vietnam-congress
      c: 'Mansfield, in a newspaper interview: easing the tension between the administration and the Foreign Relations Committee "mandatory"; the Tonkin dispute "getting out of hand."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 385. See [[cal.1968-02-20.vietnam]]. Names: Mansfield.'
      tags:
      - name:mansfield-mike
- add:
    entry:
      id: cal.1968-02-23.vietnam-congress
      when: Feb. 23
      date: '1968-02-23'
      thread: vietnam-congress
      c: 'Herrick, the destroyers'' task group commander in 1964, in a newspaper interview: the *Maddox* did not provoke the attack; its radio gear only "passive."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 386. See [[cal.1968-02-20.vietnam]]. Names: Herrick. Check: the day (CQ sets it under Feb. 23).'
      tags:
      - name:herrick-john-j
- add:
    entry:
      id: cal.1968-02-16.economy-surcharge
      when: Feb. 16
      date: '1968-02-16'
      thread: economy-surcharge
      also:
      - farm
      c: 'Joint Economic Committee, the three farm organizations. The Farm Bureau: no tax increase without an equal cut in spending first. The Grange for the tax. The Farmers Union for Metcalf''s S. 2613, against farm losses written off against other income.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 386. See [[cal.1968-02-14.economy-surcharge]]. Names: Metcalf.'
      tags:
      - name:metcalf-lee-w
- add:
    entry:
      id: cal.1968-02-19.economy-gold
      when: Feb. 19
      date: '1968-02-19'
      thread: economy-gold
      c: 'Joint Economic Committee, economists on the balance of payments. Machlup: the United States to stop buying and selling gold, dollar holders offered gold for a time, other countries free to float. Butler, of the Chase Manhattan: the deficit cut by restraint and a surcharge. Behrman: controls on capital "attest to" the dollar''s weakness.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 386–87. See [[cal.1968-02-14.economy-surcharge]].'
- add:
    entry:
      id: cal.1968-02-06.consumers-2
      when: Feb. 6
      date: '1968-02-06'
      thread: consumers
      c: 'Agriculture''s study of State poultry inspection in 12 States, late 1967: of 97 State-inspected plants, 37 in compliance with federal rules, 34 in need of major improvements, 26 of moderate changes. Its count: 12 States with mandatory inspection, 4 enforcing it.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 388. See [[cal.1968-02-06.consumers]].'
- add:
    entry:
      id: cal.1968-02-19.consumers
      when: Feb. 19
      date: '1968-02-19'
      thread: consumers
      c: 'House Agriculture''s livestock subcommittee, Purcell chairman, opens hearings on H.R. 15146, the administration''s Wholesome Poultry Products Act, and Poage''s H.R. 15154. Mehren, for Agriculture: 1.6 billion pounds a year not federally inspected; "Only 18 percent of the noninspected carcasses appeared satisfactory." Leonor Sullivan: "I''m just sorry we have wasted 11 years."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 387–88. See [[cal.1968-02-06.consumers]]. Names: Purcell, Poage, Sullivan. Check: the day of Mehren''s and Sullivan''s testimony (CQ sets it before Feb. 20''s).'
      tags:
      - name:purcell-graham-b-jr
      - name:poage-william-r
      - name:sullivan-leonor-k
- add:
    entry:
      id: cal.1968-02-20.consumers-2
      when: Feb. 20
      date: '1968-02-20'
      thread: consumers
      also:
      - farm
      c: Poultry hearings. Lynn, for the Farm Bureau, for Poage's bill, without "the long arm of federal law"; to Foley, the 33 States without poultry laws doing a good job, then "all states could improve." The Broiler Council for the administration's bill, not its recordkeeping.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 388–89. See [[cal.1968-02-19.consumers]]. Names: Foley.'
      tags:
      - name:foley-thomas-s
- add:
    entry:
      id: cal.1968-02-21.consumers
      when: Feb. 21
      date: '1968-02-21'
      thread: consumers
      c: Poultry hearings. Katz, a kosher processor of Mifflintown, Pa., for the administration's bill and against the kosher exemption; Ferster, for New York's kosher processors, against deciding it.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 389. See [[cal.1968-02-19.consumers]].'
- add:
    entry:
      id: cal.1968-02-22.consumers
      when: Feb. 22
      date: '1968-02-22'
      thread: consumers
      c: Poultry hearings close. The Grange and the Amalgamated Meat Cutters for the administration's bill; the State departments of agriculture, tentatively, for Poage's.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 389. See [[cal.1968-02-19.consumers]].'
- add:
    entry:
      id: cal.1968-02-19.crime-and-hijacking
      when: Feb. 19
      date: '1968-02-19'
      thread: crime-and-hijacking
      c: 'House Commerce''s health subcommittee, Rogers acting chairman, opens hearings on H.R. 15355, possession of LSD and other dangerous drugs a misdemeanor, sale a felony. Vinson, for Justice, for it; Silver, for HEW: "we do not have the problem under control." Jacobson on chromosome damage in children of mothers who had taken LSD.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 389–90. See [[cal.1968-02-07.crime-and-hijacking]]. Names: Rogers.'
      tags:
      - name:rogers-paul-g
- add:
    entry:
      id: cal.1968-02-20.crime-and-hijacking
      when: Feb. 20
      date: '1968-02-20'
      thread: crime-and-hijacking
      c: 'HEW: Goddard free to testify after all. Huitt: his testimony had been thought not "timely" after the crime message. Dodd had put his own hearing off to Mar. 4 when told Goddard could not come.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 390. See [[cal.1968-02-19.crime-and-hijacking]]. Names: Goddard, Huitt, Dodd.'
      tags:
      - name:goddard-james-l
      - name:huitt-ralph-k
      - name:dodd-thomas-j
- add:
    entry:
      id: cal.1968-02-20.crime-and-hijacking-2
      when: Feb. 20
      date: '1968-02-20'
      thread: crime-and-hijacking
      c: 'Springer, ranking Republican on House Commerce, in the House: possession of LSD a felony.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 389. See [[cal.1968-02-19.crime-and-hijacking]]. Names: Springer.'
      tags:
      - name:springer-william-l
- add:
    entry:
      id: cal.1968-02-27.crime-and-hijacking
      when: Feb. 27
      date: '1968-02-27'
      thread: crime-and-hijacking
      c: 'Drug penalty hearings. Giordano, of the Bureau of Narcotics: no penalty for possessing LSD while marijuana''s is strict looks "hypocritical." Carter: the penalties "absolutely unenforceable"; Rogers: "a perversion of the legislation."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 390. See [[cal.1968-02-19.crime-and-hijacking]]. Names: Giordano, Carter, Rogers.'
      tags:
      - name:giordano-henry-l
      - name:carter-tim-l
      - name:rogers-paul-g
- add:
    entry:
      id: cal.1968-02-20.crime-and-hijacking-3
      when: Feb. 20
      date: '1968-02-20'
      thread: crime-and-hijacking
      c: 'Johnson adds $5,745,000 to the budget for law enforcement: 100 more FBI agents, 100 assistant United States attorneys, 100 places at the Food and Drug Administration for drug control, 60 narcotics agents.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 414. See [[cal.1968-02-07.crime-and-hijacking]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
