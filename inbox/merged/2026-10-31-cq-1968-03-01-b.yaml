      n: 'Statement by the President Upon Receiving Report of the Industry-Government Special Task Force on Travel, [1968–69 Pub. Papers 244](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=322) (Feb. 19, 1968). [[w.cq-weekly-report]], Mar. 1, 1968, 407. Names: McKinney, Johnson.'
