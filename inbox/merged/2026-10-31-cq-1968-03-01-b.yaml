      date: '1968-02-23'
      thread: economy
      c: Johnson asks Congress to waive visas for tourists and businessmen of countries that do so for Americans, to help the balance of payments.
      n: 'Letter to the President of the Senate and to the Speaker of the House Proposing a Bill To Simplify the Entry of Foreign Visitors, [1968–69 Pub. Papers 263](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=341) (Feb. 23, 1968). [[w.cq-weekly-report]], Mar. 1, 1968, 407. See [[cal.1968-02-19.economy]]. Names: Johnson.'
