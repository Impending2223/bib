      c: 'Rostow to Dobrynin by telephone, the day after their dinner: he is no longer handling the summit; the President
        has given it to Rusk. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 190. Rostow''s memorandum of the dinner, gone over with Rusk at lunch that day: [FRUS
        1964–68, XIV, doc. 295](https://history.state.gov/historicaldocuments/frus1964-68v14/d295), n. 1. Check: the day;
        the book gives "the next day." See [[cal.1968-09-09.soviet-union]]. Names: Rostow, Dobrynin, Rusk, Johnson.'
