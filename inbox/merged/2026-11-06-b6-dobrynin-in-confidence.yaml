      - soviet-union
      c: 'Dinner at the Harrimans'', Dobrynin a guest. Harriman: Johnson''s decision not a stratagem but final; only Lady
        Bird Johnson, Humphrey, Rusk and Clifford told beforehand, not Rostow or Harriman; Humphrey will run, without much
        chance; earlier that day Johnson told Harriman he would keep out of the party''s struggle and the campaign; Rusk and
        Rostow, "the American Rasputin," to go whoever wins. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 178–79. Check: the day; "the following day," after the address of Mar. 31 or after
        the Chicago speech of Apr. 1. See [[cal.1968-03-31.elections-1968]]. Names: Harriman, Dobrynin, Johnson, Lady Bird
        Johnson, Humphrey, Rusk, Clifford, Rostow.'
