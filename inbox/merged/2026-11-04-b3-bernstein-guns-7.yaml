- add:
    entry:
      id: cal.1965-04-02.vietnam-air-war
      when: Apr. 2
      date: '1965-04-02'
      thread: vietnam-air-war
      also:
      - vietnam-force-levels
      c: 'McCone to Rusk, copies to McNamara, McGeorge Bundy and Taylor: the ground forces'' change of mission to active
        combat right only if the strikes on the North really hurt. The strikes "have not caused a change in the North
        Vietnamese policy," "hardened their attitude." Else "we will find ourselves mired down in combat in the jungle in
        a military effort that we cannot win." Sent on to Johnson with a letter, after Apr. 2.'
      n: '[FRUS 1964–68, II, doc. 234](https://history.state.gov/historicaldocuments/frus1964-68v02/d234) (the
        memorandum, attached to the letter). [[w.bernstein-guns-or-butter]], 346 (the strikes; "mired down"). Made public:
        [[w.pentagon-papers-as-published]], 440–41 (1971), by FRUS''s note. The letter: [[cal.1965-04-06.vietnam]].
        Names: McCone, Rusk, McNamara, McGeorge Bundy, Taylor.'
      tags:
      - name:mccone-john-a
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:taylor-maxwell
      src:
        c: '3a77e28f'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d234: all'
        - 'w.bernstein-guns-or-butter 346: B-C'
        - 'via x.1965-04-02.mccone-to-rusk-mcnamara-mcgeorge-bundy: all'
- add:
    entry:
      id: cal.1965-04-06.vietnam-air-war
      when: Apr. 6
      date: '1965-04-06'
      thread: vietnam-air-war
      c: 'Wheeler to McNamara, CM-534-65, an appraisal of the strikes on the North, Feb. 7 to Apr. 4: 34 American, 10 South
        Vietnamese, bombs to 1,000 pounds, napalm; 25 American planes lost and 6 South Vietnamese, to antiaircraft fire
        until the MiGs of Apr. 3 and 4. The strikes "have not reduced in any major way the over-all military capabilities
        of the DRV."'
      n: '[FRUS 1964–68, II, doc. 241](https://history.state.gov/historicaldocuments/frus1964-68v02/d241).
        [[w.bernstein-guns-or-butter]], 345–46. See [[cal.1965-03-02.vietnam]]. Names: Wheeler, McNamara.'
      tags:
      - name:wheeler-earle
      - name:mcnamara-robert-s
      src:
        c: 'b9d8ed10'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d241: all'
        - 'w.bernstein-guns-or-butter 345–46: all'
        - 'via x.1965-04-06.cm-534-65-6-apr-65: all'
- add:
    entry:
      id: cal.1965-06.program
      when: June
      date: 1965-06
      thread: program
      also:
      - vietnam
      c: 'The White House mess, a dinner of Moyers and Goodwin for the task force chairmen, Haar among them. Johnson
        arrives about 10:30; after midnight, a monologue on Vietnam: those urging ground forces on him, the mothers who
        would lose their sons, Wilson and Roosevelt losing the New Freedom and the New Deal to wars. "I don''t want that
        to happen to the Great Society. ... I don''t want to get involved in a war." Moyers ends it about 2 a.m.'
      n: '[[w.bernstein-guns-or-butter]], 344 (Haar''s account). To check: Charles M. Haar, Oral History Interview, 35–44,
        LBJ Library (cited by [[w.bernstein-guns-or-butter]], 344 n.6). Check: the day. Names: Moyers, Goodwin, Haar,
        Johnson.'
      tags:
      - name:moyers-bill
      - name:goodwin-richard-n
      - name:haar-charles-m
      - name:johnson-lyndon-b
      src:
        c: 'da2cef6b'
        rows:
        - 'w.bernstein-guns-or-butter 344: all'
        - 'via x.undated.charles-m-haar-oral-history-35-44: all'
- add:
    entry:
      id: cal.1965-07.press-and-broadcasting-2
      when: July
      date: 1965-07
      thread: press-and-broadcasting
      also:
      - vietnam
      c: 'Joseph Alsop, after the news conference of July 28: "a genuine element of pathos (and pray God the pathos does
        not turn into tragedy) in the spectacle of this extraordinary man in the White House wrestling with the Vietnamese
        problem, which is so distasteful to him, and all the while visibly longing to go back to the domestic
        miracle-working he so much enjoys."'
      n: '[[w.bernstein-guns-or-butter]], 349. To check: [[w.bird-chairman]], 580 (cited by [[w.bernstein-guns-or-butter]],
        349 n.6). Check: the day. See [[cal.1965-07-28.vietnam]]. Names: Joseph Alsop.'
      tags:
      - name:alsop-joseph
      src:
        c: '25d9fab8'
        rows:
        - 'w.bernstein-guns-or-butter 349: all'
