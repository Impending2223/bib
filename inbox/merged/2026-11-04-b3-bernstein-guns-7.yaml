# ---- ch. 13, "Vietnam: Sliding into the Quagmire," pp. 324-57; notes pp. 563-65
- add:
    entry:
      id: cal.1964-12.press-and-broadcasting-5
      when: Dec.
      date: 1964-12
      thread: press-and-broadcasting
      also:
      - vietnam
      c: 'Johnson with three newsmen, Wise of the *Herald Tribune* among them, three hours on Vietnam, for background. His
        situation like standing on a newspaper in the middle of the Atlantic: "If I go this way ... I''ll topple over";
        if he stays, "the paper will be soaked up and I''ll sink slowly to the bottom of the sea."'
      n: '[[w.bernstein-guns-or-butter]], 343 (Wise''s account). To check: David Wise, *The Politics of Lying* (1973)
        (cited by [[w.bernstein-guns-or-butter]], 343 n.6). Check: the day. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: 'ea2c3fd6'
        rows:
        - 'w.bernstein-guns-or-butter 343: all'
        - 'via x.1973.wise-the-politics-of-lying: all'
