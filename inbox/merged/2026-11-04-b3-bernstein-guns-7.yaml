      thread: economy-surcharge
      also:
      - press-and-broadcasting
      c: 'Galbraith to Califano: the President to "stamp very hard on this talk about credibility," candid on the bad news
        as on the good; to say "flatly that we favor the equitable procedure of paying bills by taxation rather than by
        the inequitable and dangerous levy that is imposed by inflation"; no cutting of needed civilian spending for the
        war.'
      n: '[[w.bernstein-guns-or-butter]], 536–37. To check: Galbraith to Califano, Dec. 16, 1966, Legislative Background,
        Tax Increase File, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 536–37 n.3). Names: Galbraith,
        Califano.'
