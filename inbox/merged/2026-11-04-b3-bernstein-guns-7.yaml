        marches to a different drummer."'
      n: '[[w.bernstein-guns-or-butter]], 414. To check: McPherson to Johnson, May 15, 1967, McPherson Papers, LBJ Library
        (cited by [[w.bernstein-guns-or-butter]], 414 n.10). See [[cal.1967-05-07.war-opposition]]. Names: McPherson,
