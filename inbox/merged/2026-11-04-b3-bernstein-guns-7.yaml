      when: Aug. 23
      date: '1965-08-23'
      thread: civil-disorders-watts
      c: 'Louis Martin, deputy chairman of the Democratic National Committee, to Lee White, after four hours with Negro
        elected officials in the riot area: Assemblyman Ferrell threatened, Councilman Mills too; "The rioters had no love
        for ''upper class'' Negroes." All but one: Chief Parker and the police "a provocative force." Parker "adored like
        Edgar Hoover by the whites in power"; Yorty "now squarely in his corner."'
      n: '[[w.bernstein-guns-or-butter]], 387–89. To check: Martin to White with attached memorandum, Aug. 23, 1965, White
        Papers, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 387–89 n.3). See [[cal.1965-08-11.states-and-cities]].
        Names: Lee White, Parker, Yorty.'
