      date: '1967-05-07'
      thread: war-opposition
      c: 'Washington, St. Mark''s Episcopal, the Johnsons'' church at times. The Washington Ad Hoc Viet Nam Draft Committee,
        about 70, meets there before lobbying Congress, SDS, the Progressive Labor Party and the Spring Mobilization
        among them. The Secret Service reports Bevel: Johnson "that cat in the White House"; Adams, the rector, "very
        sympathetic to this group."'
