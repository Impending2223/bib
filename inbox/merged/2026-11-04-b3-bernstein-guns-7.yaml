      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'Cater to Johnson, after a talk with Rowland Evans, "deeply disturbed": Ford and Laird "embarked on a deliberate
        policy of setting conditions ... which you cannot possibly meet," the groundwork of a "Get Out of Vietnam"
        policy; hawks "shifting 180°." At dinner, Symington on the "necessity to tuck tail and get out of Vietnam."'
      n: '[[w.bernstein-guns-or-butter]], 415. To check: Cater to Johnson, Aug. 12, 1967, Cater Papers, LBJ Library (cited by
        [[w.bernstein-guns-or-butter]], 415 n.10). Check: the day (the talk Aug. 11; the note gives Aug. 12). Names: Cater,
        Evans, Ford, Laird, Symington, Johnson.'
