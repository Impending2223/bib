- add:
    entry:
      id: cal.1965-06-07.china-leadership-2
      when: June 7
      date: '1965-06-07'
      thread: china-leadership
      also: [africa]
      c: 'Zhou, at the farewell banquet in Dar es Salaam, gives five positions China holds with African states: support the peoples'' fight against imperialism and old and new colonialism for national independence; support the governments'' peaceful, neutral, non-aligned policies; support the peoples'' wish to achieve unity in their own way; support peaceful settlement of disputes among African states; and respect for African states'' sovereignty, against violation or interference from any quarter.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 461 (June 7, 1965; evening; Dar es Salaam). Names: Zhou Enlai, Nyerere.'
      tags: ['polity:prc', 'name:zhou-enlai', 'name:nyerere-julius-k']
