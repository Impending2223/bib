- edit:
    id: cal.1965-06-21.china-leadership
    base: 'daed0b8c'
    set:
      c: 'Zhou, second and third talks with Nasser; both agree to work to hold the conference on time. At the second talk, 11 a.m., at Nasser''s residence: a new state shedding colonial remnants and building an independent economy needs time and meets difficulties not yet foreseen; it relies first on its own effort, a strong leadership and a right direction, and next on equal, mutually beneficial cooperation with other states.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 738 (June 21, 1965); [[w.zhou-enlai-waijiao-huodong]], 463 (June 21, 1965; 11 a.m., the second talks, and 9:30 p.m., the third, at Nasser''s residence). Made public: 1997. Names: Zhou Enlai, Nasser.'
      src:
        c: '5b40f5d7'
        rows: ['w.zhou-enlai-nianpu-1949 II, 738: ?', 'w.zhou-enlai-waijiao-huodong 463: A, C-D']
