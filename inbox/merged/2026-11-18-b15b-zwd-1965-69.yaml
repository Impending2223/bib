- edit:
    id: cal.1965-06-04.china-leadership-2
    base: 'f6d66ea9'
    set:
      c: 'Zhou has five talks with Nyerere, June 4 to 7. June 4: wants the Sino-Tanzanian shipping company running soon; sailing needs a trial; both independent, with the right to sail the open sea, and their flags to be recognized and respected; at the coming Asian-African conference economics is a main question; begging imperialism and reform will not do. June 5: hopes most Tanzanian ministers who have not gone will visit China: "better to see once than hear a hundred times". June 6: on the Tanzania–Zambia railway: a comprehensive survey party in August or September, to survey the line, coal, iron ore, hydrology. June 7: new states should mind two key things: stress farming, build on it by their own conditions; live simply, not match developed states; and plan cities spread out, not too concentrated, industry spread out. At the first talk, June 4, Nyerere likens a new state that keeps a colonial economy to a leaky bucket that never fills; Zhou: the economic problem is the serious one for Asian and African states, and last year''s report to the U.N. trade conference at Geneva named the symptoms, not the remedy; the U.S. invades the Congo as a base against Africa, but Vietnam is the gravest problem for the world, and China will support it fully.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 735 (June 4–7, 1965); [[w.zhou-enlai-waijiao-huodong]], 460 (June 4, 1965, 6 p.m., first talks; June 5, 9 a.m., second talks, at the Dar es Salaam presidential palace). Made public: 1997. Names: Zhou Enlai, Nyerere.'
      src:
        c: 'b4d3e784'
        rows: ['w.zhou-enlai-nianpu-1949 II, 735: ?', 'w.zhou-enlai-waijiao-huodong 460: A, L-N']
