- edit:
    id: cal.1965-05-28.china-leadership
    base: '24a7382c'
    set:
      c: 'Zhou and Chen Yi fly to Guangzhou to welcome Subandrio, first deputy premier and foreign minister of Indonesia; three talks through the morning of May 29. On Vietnam: the U.S. rushes in unprepared for war; all its estimates wrong; its "gradual escalation" means one step at a time, the thing most forbidden in war; Taylor and Johnson are extreme pragmatists with no long strategy. On the second Asian-African conference: ten years ago all despised the conference, now all want in; difficult but of high market value; a great struggle ahead, in Asia and Africa and outside the U.N. In the second talk, at the Baiyunshan Hotel: 14 million South Vietnamese dare fight 200,000 Americans, so China, fifty times as many, would fight at least 10 million. Asked about bombing, Zhou repeats the four sentences of Bogor: China starts no war with the U.S.; its word counts, as ten years of talks on Taiwan and Korea show; the whole country is mobilizing; bombing China is war on China, and war has no limit, no air war without a land war.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 732–33 (May 28–29, 1965); [[w.zhou-enlai-waijiao-huodong]], 456 (May 28, 1965; afternoon, by special plane from Peking with Chen Yi to Guangzhou; 6:20 p.m., Baiyunshan Hotel (白云山宾馆), the first talks with Subandrio, with Chen Yi; 10 p.m. to 3:20 a.m., Baiyunshan Hotel, the second talks, Zhou on the Americans'' lack of preparation, "gradual escalation" and Taylor and Johnson as pragmatists). Made public: 1997. Names: Zhou Enlai, Chen Yi, Subandrio.'
      src:
        c: 'b456a058'
        rows: ['w.zhou-enlai-nianpu-1949 II, 732–33: ?', 'w.zhou-enlai-waijiao-huodong 456: A-F, J-M']
