- add:
    entry:
      id: cal.1965-02-11.china-leadership-3
      when: Feb. 11
      date: '1965-02-11'
      thread: china-leadership
      also: [soviet-union]
      c: 'Zhou, accompanying Kosygin to the airport, says on the road that the two sides'' views on foreign and international questions need regular exchange; differences of view and policy can be held, understood through unpublicized, informal exchanges; not everything at once, but many exchanges will show each side''s thinking. On state relations: China''s Friendship Association will agree to the Soviet–Chinese Friendship Association''s plan, on equal terms, beginning with the fifteenth anniversary of the treaty; Sino-Soviet trade in 1965 to grow somewhat over last year; cultural exchange to go on with fewer items; on travel, best to carry out the agreement.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 436 (Feb. 11, 1965; 1:35 p.m.; on the road to the airport, Beijing). Made public: 1993. Check: [[cal.1965-02-05.china-leadership]] (Zhou nianpu) holds Zhou''s proposals to Kosygin on the same matters, Feb. 5–6. Names: Zhou Enlai, Kosygin.'
      tags: ['polity:prc', 'name:zhou-enlai', 'name:kosygin-aleksei', 'vis:only:prc+ussr']
      src:
        c: fa4ab7ab
        rows: ['w.zhou-enlai-waijiao-huodong 436: all']
      time: 1965-02-11T05:35Z
      time_zone: Asia/Shanghai
