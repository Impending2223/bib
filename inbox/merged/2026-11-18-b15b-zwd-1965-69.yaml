- edit:
    id: cal.1967-06-23.china-leadership
    base: '12c4585f'
    set:
      c: 'Zhou Enlai, in talks with Kaunda: to hold national independence one must win economic independence. At the second talk Kaunda speaks of reactionary soldiers seizing power from progressives across Africa, and of the Middle East defeat; Zhou: Africa is for the moment under a dark cloud, but the tide of Asian and African independence cannot be stopped; repressed and set back, it will rise again, as China''s century of experience shows.'
      time: '1967-06-23T09:30Z'
      time_zone: 'Asia/Shanghai'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (under June 22, 1967); [[w.zhou-enlai-waijiao-huodong]], 513 (June 23, 1967; 5:30 p.m., Fujian Hall, Great Hall of the People, the second talks with Kaunda). Made public: 2020. See [[cal.1967-06-22.china-leadership]]. Names: Zhou Enlai, Kaunda.'
      src:
        c: 'ef911cce'
        rows: ['w.zhou-enlai-nianpu-1949-2020 III, 160: ?', 'w.zhou-enlai-waijiao-huodong 513: A, B-D']
