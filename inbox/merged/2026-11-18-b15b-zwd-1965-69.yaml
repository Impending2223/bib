- cite: {id: cal.1969-03-28.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 534 (Mar. 28, 1969; 4:45 p.m., Fujian Hall, Great Hall of the People; Pakistan''s ambassador Kaiser (the book gives 凯瑟))', units: A}
- cite: {id: cal.1969-03-28.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 534 (Mar. 28, 1969; 6 p.m., Fujian Hall, Great Hall of the People; the ambassador Robo and the counselor (阿果利) on the incident of the drunken driving that killed a Chinese worker; the book has Zhou on his thirty years of drinking from 1935 to 1965, four occasions on which he was plied with drink (the Whampoa Military Academy about 1925 over his marriage; Wuhan in 1938; Chongqing; Moscow before the 1954 Geneva conference, Korean and Vietnamese representatives present), his decision in 1965 to stop, and drink bringing harm to the body and political mistakes)', units: 'A, C-D'}
- cite: {id: cal.1969-04-20.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 535 (Apr. 20–21, 1969; Apr. 20, 11:30 a.m. and 7 p.m., the talks with Vietnam''s Phạm Hùng and Hoàng Văn Thái (黄文泰) in the Great Hall of the People, the book giving no content; Apr. 21, 12:30 p.m., the third talks, on the international situation and the U.S.–Soviet strategy for the world, the Vietnamese side to hold to independence and self-reliance)', units: A-B}
