- cite: {id: cal.1967-03-29.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 509 (Mar. 29, 1967; 11:30 a.m., Diaoyutai guesthouse, the first talks with Phạm Văn Đồng; 3:30 to 6:30 p.m., Building 18, the second; the book gives no content)', units: 'A'}
- edit:
    id: cal.1967-04-07.china-leadership
    base: 'a5c6fd74'
    set:
      c: 'Zhou Enlai holds talks with Premier Phạm Văn Đồng. At the third talk, 11 a.m., after Giáp on the military situation, Zhou on American aims: the U.S. learned its wars in the war of independence and the war between North and South, and came into both world wars at the last, landing in the second when Hitler was already weak. At the fourth, 3:30 p.m., Đồng says some of Vietnam''s methods in the South follow China''s earlier advice; Zhou: Vietnam has also created, "latecomers rise above"; China has not fought for fourteen years, its leaders near seventy, and if the southern war is not over next year he will come to see.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 7, 10, 11, 1967); [[w.zhou-enlai-waijiao-huodong]], 509–10 (Apr. 7, 1967; the talks with Phạm Văn Đồng in Building 18, Diaoyutai guesthouse: 11 a.m. to 1 p.m., the third, 3:30 to 6:30 p.m., the fourth). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
      src:
        c: '82b14254'
        rows: ['w.zhou-enlai-nianpu-1949-2020 III, 140: ?', 'w.zhou-enlai-waijiao-huodong 509–10: A, B-E']
- names: {id: cal.1967-04-07.china-leadership, add: ['Võ Nguyên Giáp'], tags: ['name:vo-nguyen-giap']}
- cite: {id: cal.1967-04-10.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 510 (Apr. 10, 1967; 11 a.m., Building 18, Diaoyutai guesthouse, the fifth talks, on the battlefield in Vietnam and the estimate of a wider U.S. war)', units: 'A'}
- edit:
    id: cal.1967-04-11.china-leadership-2
    base: '9208c2a6'
    set:
      c: 'Zhou Enlai, in talks with Phạm Văn Đồng: to win, the Vietnam war must not be given up halfway. Asked whether Stalin advised the PLA not to cross the Yangtze: Stalin doubted China could cross in 1949 and thought the U.S. would send troops; the U.S. did not. When Nanjing fell, the U.S. ambassador stayed and offered recognition and perhaps aid; China paid no heed and he left. China will rouse the world''s peoples to back Vietnam''s victory; the Soviet Union would have it stop halfway, as under Stalin, who after the two atomic bombs signed with Chiang, in effect leaving China to the U.S. for interests in the Northeast and Xinjiang and Mongolia, and in August 1945 wired Mao to cooperate with the Kuomintang and start no civil war; in Moscow after Shanghai''s liberation Stalin asked Liu Shaoqi whether that telegram had hampered the war, and Liu said not.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 7, 10, 11, 1967); [[w.zhou-enlai-waijiao-huodong]], 510 (Apr. 11, 1967; 11 a.m., Building 18, Diaoyutai guesthouse, the seventh talks, Zhou saying that of a hundred li, ninety is half the journey and the last ten the hardest). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng, Stalin.'
      src:
        c: '60677899'
        rows: ['w.zhou-enlai-nianpu-1949-2020 III, 140: ?', 'w.zhou-enlai-waijiao-huodong 510: A, F-H']
      time: '1967-04-11T03:00Z'
      time_zone: 'Asia/Shanghai'
- names: {id: cal.1967-04-11.china-leadership-2, add: ['Mao Zedong', 'Liu Shaoqi', 'Chiang Kai-shek'], tags: ['name:mao-zedong', 'name:liu-shaoqi', 'name:chiang-kai-shek']}
