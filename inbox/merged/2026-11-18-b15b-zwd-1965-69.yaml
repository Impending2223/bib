- cite: {id: cal.1969-02-28.china-leadership-3, item: '[[w.zhou-enlai-waijiao-huodong]], 533 (Feb. 28, 1969; 7:15 p.m., Fujian Hall, Great Hall of the People; the Guinean government delegation led by the minister of trade, transport and posts and telecommunications (the book gives 恩法马拉·凯塔))', units: A}
