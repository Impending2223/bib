- add:
    entry:
      id: cal.1965-01-27.china-leadership-2
      when: Jan. 27
      date: '1965-01-27'
      thread: china-leadership
      also: [indonesia]
      c: 'Zhou, at the third talks with Subandrio, in the Fujian Hall: the anti-imperialist, anti-colonial camp and the New Emerging Forces are growing, but much work remains, such as holding the second Asian–African conference. Algeria has proposed that for technical reasons it open in May at the earliest; Sukarno had to agree, and Bandung''s tenth anniversary will be celebrated first, to build momentum. That turns a bad thing into a good one, with two tasks: guard against sabotage in the four months left ("long nights, many dreams"), and celebrate the tenth anniversary well, the two tasks tied together.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 434 (Jan. 27, 1965; 11:15 a.m., Fujian Hall, Great Hall of the People). Made public: 1993. See [[cal.1965-01-24.china-leadership]]. Names: Zhou Enlai, Subandrio, Sukarno.'
      tags: ['polity:prc', 'name:zhou-enlai', 'name:subandrio', 'name:sukarno', 'vis:only:prc+indonesia']
      src:
        c: f7dfc440
        rows: ['w.zhou-enlai-waijiao-huodong 434: all']
      time: 1965-01-27T03:15Z
      time_zone: Asia/Shanghai
