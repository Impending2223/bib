- cite: {id: cal.1969-06-10.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 536 (June 10, 1969; 3 p.m., Jiangsu Hall, Great Hall of the People; the book adds that a visit to Pakistan was not possible before National Day, whether in the winter was hard to say, and that if he travelled abroad he would go to Pakistan first)', units: A-C}
- cite: {id: cal.1969-06-15.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 536 (June 15, 1969; morning, Great Hall of the People)', units: A}
- cite: {id: cal.1969-07-13.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 537 (July 13–14, 1969; July 13, 11 a.m., Jiangsu Hall, Great Hall of the People, the talks with Nur Khan; July 14, 4:30 p.m., the talks continued)', units: A}
