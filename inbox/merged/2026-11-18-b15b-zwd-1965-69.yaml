- cite: {id: cal.1969-09-04.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 538 (Sept. 4, 1969; morning, by special plane with the Chinese Party delegation to Hanoi to condole on Hồ Chí Minh''s death, met at the airport by Trường Chinh, Phạm Văn Đồng, Võ Nguyên Giáp and Nguyễn Duy Trinh; 3 p.m., the Presidential Palace, Zhou saying to the Vietnamese Party, government and army leaders that China came hurriedly yet late)', units: A-E}
- cite: {id: cal.1969-09-04.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 538 (Sept. 4, 1969; 5 p.m., the lying-in-state hall in the main hall of the Presidential Palace, Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Võ Nguyên Giáp, Lê Thanh Nghị and Hoàng Văn Hoan accompanying; 7 p.m., with Ye Jianying, to the hospital to view Hồ Chí Minh''s remains; 8 p.m., by plane from Hanoi for home)', units: A-B}
- cite: {id: cal.1969-09-06.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 538 (Sept. 6, 1969; morning)', units: A}
- cite: {id: cal.1969-09-07.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 538–39 (Sept. 7, 1969; 11:40 p.m., Building 2, Xinliusuo (新六所) guesthouse, Zhou with Li Xiannian meeting Maurer''s delegation on its way to Hanoi for Hồ Chí Minh''s funeral; the book adds that Zhou says the Paris talks have never concerned China, Vietnam being the host and the Soviet Union having a hand, that the Soviet Union treats Vietnam, the Middle East, West Berlin and China as trumps against the U.S., that the key to Sino-American relations is Taiwan and the U.N., and that the border clashes of recent months were deliberately provoked by the Soviet Union to turn people''s eyes from its troubles, China agreeing to reasonable negotiation and, until settlement, to maintain the status quo of the border)', units: A-D}
- cite: {id: cal.1969-09-10.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 539 (Sept. 10, 1969; evening, banquet for Choe Yong-gon (崔庸健) and the first talks, Zhou thanking Choe for conveying Premier Kim Il Sung''s wish)', units: A-B}
- cite: {id: cal.1969-09-11.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 539 (Sept. 11, 1969; 10:50 a.m., VIP lounge of the capital airport, Kosygin returning through Peking from Hồ Chí Minh''s funeral)', units: A-B}
- cite: {id: cal.1969-09-11.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 539–40 (Sept. 11, 1969; 4:30 p.m., Zhou briefing Maurer''s delegation on the talks with Kosygin; the book adds that the Cominform failed, that the 1957 and 1960 meetings'' documents had little effect, that a Moscow meeting cannot solve things and China does not care about it, a difference of principle with Romania)', units: A-C}
- cite: {id: cal.1969-09-30.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 542 (Sept. 30, 1969; evening, the grand reception in the Great Hall of the People for the twentieth anniversary of the People''s Republic, Zhou speaking)', units: A}
- cite: {id: cal.1969-10-02.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 543 (Oct. 2, 1969; 7 p.m., Jingxi Hotel; the talks with Choe Yong-gon)', units: A}
- cite: {id: cal.1969-10-02.china-leadership-3, item: '[[w.zhou-enlai-waijiao-huodong]], 543 (Oct. 2, 1969; 11:50 p.m., with the friendship delegation under the army chief of staff Lieutenant General Hamid Khan; the book has Zhou naming the tense areas since the Second World War, Korea, Berlin, Vietnam, China (Taiwan) and Pakistan (Kashmir, "made by Mountbatten, a friend of Nehru"), and the Middle East)', units: all}
- cite: {id: cal.1969-10-03.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 543 (Oct. 3, 1969; 2 a.m., Xinliusuo guesthouse, the third talks with Phạm Văn Đồng)', units: A}
- cite: {id: cal.1969-10-04.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 544 (Oct. 4, 1969; 10:05 p.m., Fujian Hall, Great Hall of the People; the Algerian government delegation under the minister of labor and social affairs (the book names him 穆罕默德·赛义德·马兹))', units: A}
- cite: {id: cal.1969-10-07.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 544 (Oct. 7, 1969; 3 p.m., Great Hall of the People, the second talks with Nguyễn Hữu Thọ)', units: A}
- cite: {id: cal.1969-10-08.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 544 (Oct. 8, 1969; 1:45 a.m., Fujian Hall, Great Hall of the People)', units: A}
- cite: {id: cal.1969-10-09.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 544 (Oct. 9, 1969; 3:15 p.m., Fujian Hall, Great Hall of the People)', units: A}
- cite: {id: cal.1969-10-08.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 544–45 (Oct. 10, 1969; morning, Zhou and Raoul sign, each for his government, the agreement on economic and technical cooperation between China and the Congo (Brazzaville))', units: B}
- cite: {id: cal.1969-10-19.china-leadership-3, item: '[[w.zhou-enlai-waijiao-huodong]], 545 (Oct. 19, 1969; evening; Edgar Snow and his wife)', units: A}
- cite: {id: cal.1969-10-21.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 545 (Oct. 21–23, 1969; Oct. 21, 12:20 p.m., the airport welcome of the Vietnamese party and government delegation under Phạm Văn Đồng, which came on to Peking after the German Democratic Republic''s national day and a visit to the Soviet Union; Oct. 22, 5 p.m., Fujian Hall, the fourth talks; Oct. 23, 6:30 p.m., Great Hall of the People, the fifth, and a welcoming banquet for Đồng''s visit)', units: B}
- variant: {id: cal.1969-10-23.china-leadership, unit: A, witness: w.zhou-enlai-waijiao-huodong, reads: 'The book dates Zhou''s meeting with Juan Bosch, former president of the Dominican Republic, and Aristides (阿里斯蒂德), leader of the Dominican April 24 movement, in the Fujian Hall of the Great Hall of the People to Oct. 21', at: '545'}
- cite: {id: cal.1969-11-23.china-leadership, item: '[[w.zhou-enlai-waijiao-huodong]], 546 (Nov. 23, 1969; 8:15 p.m., Fujian Hall, Great Hall of the People; the book gives Lê Thanh Nghị and Hoàng Văn Hoan as Politburo members of the Vietnam Workers'' Party and says the talk was on the situation of the Sino-Soviet boundary talks)'}
- cite: {id: cal.1969-12-04.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 546 (Dec. 4, 1969; 11:15 p.m., Great Hall of the People; the book has Zhou asking Vice Minister Ji (姬) to talk more with the ambassador)', units: A-D}
- cite: {id: cal.1969-12-12.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 546 (Dec. 12, 1969; 8:15 p.m., Fujian Hall, Great Hall of the People; the book has Zhou saying also that Nixon''s "age of negotiation" is not apt, that it is rather a time of arming for war and negotiating, that the Warsaw channel, broken off on Jan. 8 nearly two years before, had not been cancelled, and that Nixon should use it directly through his ambassador without roundabout tricks)', units: A-E}
