      thread: china-leadership
      also: [middle-east]
      c: 'Zhou, at the return banquet for Nasser in the garden of the Kubba Palace: China fully supports the second Asian–African conference being held on time and hopes the Afro-Asian states will unite so that it is held and goes well. On Algeria: China never interferes in other states'' internal affairs and always supports what benefits the Algerian people and the struggle against imperialism and old and new colonialism.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 463–64 (June 22, 1965; evening; Kubba Palace garden, Cairo). Names: Zhou Enlai, Nasser.'
      tags: ['polity:prc', 'name:zhou-enlai', 'name:nasser-gamal-abdel']
