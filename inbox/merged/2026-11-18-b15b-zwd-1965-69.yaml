- variant: {id: cal.1968-12-30.china-leadership, unit: A, witness: w.zhou-enlai-waijiao-huodong, reads: 'The departing Albanian ambassador is named 纳塔奈利 (Natanaili), elsewhere in the book the ambassador of 1966–68', at: '532'}
- cite: {id: cal.1969-01-18.china-leadership-2, item: '[[w.zhou-enlai-waijiao-huodong]], 533 (Jan. 18, 1969; the talks with the New Zealand Communist Party delegation of Politburo members (the book names them 杰·满生 and 拉·赫格曼), a banquet for the delegation following)', units: A}
