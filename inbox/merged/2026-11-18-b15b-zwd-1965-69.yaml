- edit:
    id: cal.1965-08-24.china-leadership
    base: '760240f8'
    set:
      c: 'Zhou receives Soumialot, chairman of the Supreme Revolutionary Council of the Congo (Leopoldville). Revolutionaries should care for their families, but where interests clash the revolution comes first. At the luncheon: the Chinese revolution knew two lines, Mao''s, relying on the people and above all the peasants, protracted guerrilla war in the countryside and self-reliance, and the wrong one, of haste for regular war, the cities, victory and outside help; a broad united front is to be built and comrades who erred kept in it if they correct themselves.'
      tags: ['name:zhou-enlai', 'polity:prc', 'polity:congo', 'vis:only:prc+congo@C-D']
      n: '[[w.zhou-enlai-nianpu-1949]], II, 751 (Aug. 24, 1965); [[w.zhou-enlai-waijiao-huodong]], 475 (Aug. 24, 1965; 12 noon, Great Hall of the People; Zhou receives and gives a luncheon for Soumialot). Made public: 1993. Names: Zhou Enlai, Soumialot.'
      src:
        c: '493ef5af'
        rows: ['w.zhou-enlai-nianpu-1949 II, 751: ?', 'w.zhou-enlai-waijiao-huodong 475: A, C-D']
