- edit:
    id: cal.1968-07-19.china-leadership-2
    base: 'ffef59eb'
    set:
      c: 'Zhou Enlai with Chen Yi receives the UAR''s ambassador in Peking, Imam: on the UAR''s difficulties, a nation that will not yield in hardship can stand up and make something. On the Sino-Indian border: the McMahon Line was drawn in pencil by British colonialists, as Africa was carved up; China would not recognize it but would keep the status quo; in 1960 he and Chen Yi saw Nehru daily for a week at New Delhi and Nehru refused an agreement of principle; India then added troops in all sectors and attacked, ignoring China''s warnings. On the June war China had not been told in advance; the UAR trusted Soviet advisers and believed the U.S. would not aid Israel, the greatest lesson for the Arab peoples.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 241–242 (July 19, 1968); [[w.zhou-enlai-waijiao-huodong]], 526–27 (July 19, 1968; afternoon, Great Hall of the People, with Chen Yi; the book ends Zhou''s remarks to Imam with: after the war the UAR lost much economically; a nation that is to stand up must not yield in hardship, and hardship forces things out, as it forced new China). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      src:
        c: '0e5d8b0f'
        rows: ['w.zhou-enlai-nianpu-1949-2020 III, 241–242: ?', 'w.zhou-enlai-waijiao-huodong 526–27: A, B-G']
- names: {id: cal.1968-07-19.china-leadership-2, add: ['Nehru'], tags: ['name:nehru-jawaharlal']}
