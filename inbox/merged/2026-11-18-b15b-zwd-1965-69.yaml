      when: June 24
      date: '1965-06-24'
      thread: china-leadership
      also: [middle-east, africa]
      c: 'Zhou, at talks with Nasser at Alexandria: Nasser says that if the host country finds it hard to meet on time, it might explain the difficulty in a small circle to the representatives of the UAR, Indonesia, China, Korea, Vietnam, Mali and Pakistan. He says it cannot do so before so many, for its face; fewer, China, Indonesia and the UAR. Zhou agrees. Nasser adds that the British Commonwealth African states, Kenya, Tanzania, Zambia, Malawi and Ghana, propose postponing the conference.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 464 (June 24, 1965; noon; Alexandria). Made public: 1993. See [[cal.1965-06-23.china-leadership-2]]; [[cal.1965-06-24.china-leadership-2]]. Check: the book says 东道国 (host country); taken as Algeria, the conference''s host. Names: Zhou Enlai, Nasser.'
