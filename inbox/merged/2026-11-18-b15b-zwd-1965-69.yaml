    set:
      c: 'Zhou has three talks with Hysni Kapo, Albanian Workers'' Party Politburo member and first deputy chairman of the Council of Ministers, May 8–10. May 9, second talk: China is mobilizing for war; the U.S. seems not yet resolved to carry the war to China, but war follows its own laws and often runs against the wish, so China cannot go unprepared.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 729 (May 8–10, 1965); [[w.zhou-enlai-waijiao-huodong]], 455 (May 9, 1965, 2nd talks, afternoon, Building 2, Diaoyutai guesthouse; May 10, morning, same place, the third). Made public: 1997. Names: Zhou Enlai, Hysni Kapo.'
