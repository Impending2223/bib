- edit:
    id: cal.1965-06-29.china-leadership
    base: '3456aa52'
    set:
      c: 'Zhou meets Shukairy, chairman of the Palestine Liberation Organization, Indonesia''s first deputy premier Subandrio, and Pakistan''s foreign minister Bhutto. To Subandrio, on how the postponement came about: the UAR, after seeing Bouteflika, told China that Algeria thought a meeting difficult but feared the blame for none, and was willing to propose postponement; the chief reason is that many black African states, for their ties with Ben Bella, do not want to meet at Algiers, the explosion another.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 740–41 (June 29, 1965); [[w.zhou-enlai-waijiao-huodong]], 465–66 (June 29, 1965; noon, Shukairy; 12:45 p.m., Subandrio, at the Chinese embassy in Cairo; afterward Bhutto). Made public: 1997. Names: Zhou Enlai, Shukairy, Subandrio, Bhutto.'
      src:
        c: '1966059a'
        rows: ['w.zhou-enlai-nianpu-1949 II, 740–41: ?', 'w.zhou-enlai-waijiao-huodong 465–66: A, B-C']
