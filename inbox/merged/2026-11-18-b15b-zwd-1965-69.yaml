- edit:
    id: cal.1965-03-02.china-leadership-2
    base: '22dfd00b'
    set:
      c: 'Zhou, with Liu Shaoqi, has talks with President Ayub Khan, visiting Mar. 2–9. Mar. 5: in the two countries'' Third Plan periods China will keep giving aid beyond the $60 million given, interest-free, repayment indefinitely extendable, some surely free, a gift without conditions; an international duty, a new principle: no exploiting or robbing others. Mar. 5, Building 18, Diaoyutai guesthouse, when Ayub speaks of Pakistan''s lack of an industrial base: China had none either, Chiang leaving some tens of thousands of tons of steel and a hundred thousand tons of oil, almost no machine-building, and the Soviet Union taking away what Japan built in the Northeast. China thanks the Soviet Union for 165 projects under Stalin, paid for with interest, and Khrushchev too, who wrecked all the agreements in 1960 and so forced China to do everything itself.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 715 (Mar. 2–5, 1965); [[w.zhou-enlai-waijiao-huodong]], 439 (Mar. 4, 1965; afternoon; Zhou and Liu Shaoqi continue the talks with Ayub Khan; the book gives no content); [[w.zhou-enlai-waijiao-huodong]], 439 (Mar. 5, 1965; 9:30 a.m., Building 18, Diaoyutai guesthouse). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Ayub Khan.'
      src:
        c: '55dc82d7'
        rows: ['w.zhou-enlai-nianpu-1949 II, 715: ?', 'w.zhou-enlai-waijiao-huodong 439: D-E']
- names: {id: cal.1965-03-02.china-leadership-2, add: ['Chiang Kai-shek', 'Stalin', 'Khrushchev'], tags: ['name:chiang-kai-shek', 'name:stalin', 'name:khrushchev-nikita-s']}
