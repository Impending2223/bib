      when: Apr. 20
      date: '1968-04-20'
      thread: china-leadership
      also: [soviet-union]
      c: 'Zhou, receiving Romania''s ambassador Duma in the Jiangsu Hall of the Great Hall of the People, discusses three questions: the treaty on nonproliferation, the preparations for the Moscow conference of communist parties, and Vietnam. To Romania''s proposal that the two parties'' leaders meet, Zhou says that China is for the present busy with the Cultural Revolution and finds it hard to send people out and to receive foreign guests, so it must be put off for a time.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 523 (Apr. 20, 1968; 2 a.m., Jiangsu Hall, Great Hall of the People). Made public: 1993. Names: Zhou Enlai.'
