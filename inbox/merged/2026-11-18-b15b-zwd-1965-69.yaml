      c: 'Zhou, at the banquet welcoming the Ghana government delegation: the anti-American, patriotic righteous struggle of the Vietnamese and Congolese (Léopoldville) peoples is also a struggle for the liberation of all oppressed nations, and peoples are in duty bound to support them. He praises Prince Sihanouk for seeing through the American plot over an international conference on Cambodia: Johnson''s government is now eager for the conference not to guarantee Cambodia''s neutrality and territory but to go on with a trick to lure the Vietnamese into submission.'
