    base: 7a902f16
    set:
      follows:
      - cal.1962-09-04.missile-crisis-2
      n: '[FRUS 1961–63, X, doc. 411](https://history.state.gov/historicaldocuments/frus1961-63v10/d411). Statement
        by the President on Cuba (Sept. 4, 1962). [[w.schlesinger-robert-kennedy-and-his]], 502, 505–06 (Dobrynin''s
        assurance, "in early September"; the statement); [[w.fursenko-one-hell-of-a]], 205–206 (the leaders'' meeting
        and the statement); [[w.sorensen-kennedy]], 670; [[w.dobrynin-in-confidence]], 71–72 (Robert Kennedy, agitated,
        on the SA-2s and what might follow; Moscow''s instruction: "only defensive Soviet weapons in Cuba"; by Dobrynin''s
        account); [[w.fursenko-khrushchevs-cold-war]], 453–54 (Robert Kennedy with Dobrynin, 2:15 p.m.; the statement,
        ready by 6, read by Salinger an hour later); [[w.thomas-robert-kennedy]], 224 (Dobrynin''s "defensive weapons"
        to Robert Kennedy over tea in early September). [[w.reeves-president-kennedy]], 346–47. [[w.ball-past-has-another-pattern]],
        287 (Dobrynin''s assurance; the warning). After the meeting that decided it: [[w.schlesinger-robert-kennedy-and-his]],
        505–06. To check: Dobrynin''s diary, Sept. 13, 1962, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        453 n.48). See [[cal.1962-05-24.missile-crisis]]. Names: Dobrynin, Robert F. Kennedy.'
