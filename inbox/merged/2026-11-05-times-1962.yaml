    id: cal.1962-10-25.soviet-union
    base: f6b10bd4
    set:
      follows:
      - cal.1962-10-25.missile-crisis-2
      n: '[[w.fursenko-one-hell-of-a]], 259–60; [[w.fursenko-khrushchevs-cold-war]], 483–84 ("Apparently Kennedy
        slept with a wooden knife"; the trade; "the rockets can appear there again"); [[w.prezidium-tsk-kpss-1954]],
        I, 620–22 (Protocol 61, Malin''s notes and Serov''s record). Check: by Serov''s note, Fursenko and Naftali
        have the colleagues vote "that night" (484), and Khrushchev ask that the last ship with "special cargo"
        be brought home. On [[cal.1962-10-25.missile-crisis-2|Kennedy''s letter]], delivered 1:45 a.m. Washington:
        [[w.fursenko-one-hell-of-a]], 259–60. Check: Malin''s notes (I, 620) have one ship with special cargo turned
        back, not four. To check: Malin''s notes, Protocol 61, Oct. 25, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        259 n.9, 260 n.12); Khrushchev, *Khrushchev Remembers* (1970), 497 (cited by [[w.fursenko-one-hell-of-a]],
