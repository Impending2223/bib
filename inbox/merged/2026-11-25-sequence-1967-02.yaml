    text: 'Check: the hour: Sharp''s answer to this cable, CINCPAC 170820Z ([[cal.1967-02-17.vietnam-air-war-2]]), is 3:20 a.m. Feb. 17, Washington time, so the cable went before it, the night of Feb. 16–17, not in the workday.'
