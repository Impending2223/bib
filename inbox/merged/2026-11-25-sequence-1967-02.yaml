    text: 'Check: the hour: Yang (I, 399) has the Military Commission leader''s call to Zhao Yongfu about 8 p.m. (晚八時許), after the General Staff''s call of 2 p.m. ([[cal.1967-02-23.china-leadership-5]]); MacFarquhar (180) has the congratulations immediately after the shooting.'
