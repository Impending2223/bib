    text: 'Check: the hour of the report to Mao, about 10 p.m. ([[w.yang-jisheng-tiandi-fanfu]], I, 390, "晚上 10 點左右"; [[w.macfarquhar-maos-last-revolution]], 194–195, between ten and midnight); the drawing up of the record is also told in [[cal.1967-02-16.china-leadership-6]], and the report, split from it (R25b), would take its hour.'
