      when: Feb. 21
      date: '1966-02-21'
      thread: states-and-cities
      also:
      - civil-rights-organizations
      c: 'Washington. Barry launches the Free D.C. Movement for home rule: merchants asked to display its sign and back home rule, a boycott threatened of those who will not. Check.'
      n: '[SNCC, Free D.C. memorandum, 1966](https://www.crmvet.org/docs/660600_fdc_whc_barry.pdf). [[w.asch-chocolate-city]]; [[w.jaffe-dream-city]]; [[w.gillette-between-justice-and-beauty]]. See [[cal.1965-09-27.states-and-cities]]; [[cal.1966-01-24.states-and-cities-dc]]. Names: Barry (K–J Cong. III.K).'
      tags:
      - state:dc
