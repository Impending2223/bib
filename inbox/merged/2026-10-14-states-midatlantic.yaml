      when: Oct. 1
      date: '1963-10-01'
      thread: desegregation-public-places
      also:
      - state-constitutions
      c: 'Cambridge, Md. The voters reject Charter Amendment No. 15, adopted by the council July 1 under the agreement of July 23 and petitioned to referendum: public accommodations open to all races. Richardsons Cambridge Nonviolent Action Committee had urged Negroes not to vote. Check the figures.'
      n: '[SNCC, press release, Dec. 22, 1963](https://crmvet.org/docs/pr/631222_sncc_pr_md_protests.pdf). [[w.levy-civil-war-on-race]]. See [[cal.1963-07-23.civil-rights-the-executive]]. Names: Richardson (K–J Cong. III.K).'
      tags:
      - state:md
      - city:cambridge-md
      - name:richardson-gloria
