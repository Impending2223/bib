      when: Jan. 24
      date: '1966-01-24'
      thread: states-and-cities
      also:
      - civil-rights-organizations
      c: Washington. A one-day boycott of D.C. Transits buses against a fare rise from 20 cents to 25, called by Barry of SNCCs Washington office; SNCC claims 130,000 riders stayed off. Check the figures.
      n: '[DC Preservation League, "Marion Barry and the Student Nonviolent Coordinating Committee"](https://historicsites.dcpreservation.org/items/show/968). [[w.asch-chocolate-city]]; [[w.jaffe-dream-city]]. Names: Barry (K–J Cong. III.K).'
      tags:
      - state:dc
      - city:washington
      - name:barry-marion-s-jr
