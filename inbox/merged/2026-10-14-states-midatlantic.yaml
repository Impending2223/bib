      when: Apr. 23
      date: '1965-04-23'
      thread: students
      also:
      - vietnam
      c: 'Teach-in at Rutgers, New Brunswick, N.J. Genovese, of its history department: "I do not fear or regret the impending Viet Cong victory in Vietnam. I welcome it." Dumont, Republican candidate for governor, calls for his dismissal; the university will not act (Check the dates).'
      n: '[Wikipedia, "Eugene Genovese"](https://en.wikipedia.org/wiki/Eugene_Genovese); check the words against the *New York Times* and the Newark *Star-Ledger*, Apr. 24, 1965. [[w.menashe-teach-ins]]; [[w.wells-war-within]]; [[w.salmore-new-jersey-politics-and]]. See [[cal.1965-03-24.students]]. Names: Genovese, Dumont (K–J Cong. III.K).'
      tags:
      - state:nj
      - name:genovese-eugene-d
      - name:dumont-wayne-jr
