      when: Sept. 13
      date: '1966-09-13'
      thread: state-constitutions
      c: Maryland. With the primaries, the voters call a constitutional convention for 1967, 160,280 to 31,680.
      n: '*Maryland Manual*, 1967–68, [p. 539](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--539.html), [288](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--288.html) (ch. 501, Acts of 1966). [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-09-13.elections-1966]].'
