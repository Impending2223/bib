      id: cal.1964-11-06.state-and-city-finance-md
      when: Nov. 6
      date: '1964-11-06'
      thread: state-and-city-finance
      c: Maryland. A one-day special session repeals the increase in the State income tax voted in March with the new school-aid formula.
      n: '*Maryland Manual*, 1965–66, [the special session of Nov. 6, 1964](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000172/html/am172--256.html). [[w.callcott-maryland-and-america-1940]].'
      tags:
      - state:md
- add:
    entry:
      id: cal.1965-10-11.legislatures-md
      when: Oct. 11–21
      date: '1965-10-11'
      thread: legislatures
      c: 'Maryland. Special session on reapportioning the General Assembly, under court order to reapportion the Senate. Two acts: a Senate of 53, each county at least one Senator (ch. 3); should the courts reject it, one of 43, some counties joined in districts (ch. 2).'
      n: '*Maryland Manual*, 1965–66, [the special session of Oct. 11, 1965](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000172/html/am172--260.html). [[w.cortner-apportionment-cases]]; [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]; [[cal.1962-05-24.legislatures-md]].'
      tags:
      - state:md
