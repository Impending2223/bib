      c: 'West Virginia primaries for governor. Democratic: Hulett Smith, the former State chairman, 53.3 percent over three others, the nearest 24.5; the Speaker of the House of Delegates 13.7. Republican: Underwood, governor 1957–61, 89.7.'
      n: '*West Virginia Blue Book*, 1964, [p. 467](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1964.pdf#page=477) (Smith 186,273, Bonn Brown 85,527, Julius W. Singleton 47,845, Harold G. Cutright 30,119), [p. 493](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1964.pdf#page=503) (Underwood 152,573, Harry H. Cupp 11,325, Freda P. Cavendish 6,114). [[w.williams-west-virginia]]; [[w.peirce-border-south-states]]. Names: Smith, Underwood (K–J Cong. III.F).'
