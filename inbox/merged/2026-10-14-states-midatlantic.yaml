      id: cal.1960-05-10.governors-wv
      when: May 10
      date: '1960-05-10'
      thread: governors
      also:
      - elections-1960
      c: 'West Virginia primaries for governor. Democratic: Barron, the attorney general, 51.0 percent; Hulett Smith 38.1; a third 10.9. Republican: Harold E. Neely 55.3, Revercomb, a former Senator, 44.7. Kennedy carries the presidential primary the same day.'
      n: '*West Virginia Blue Book*, 1960, [p. 732](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1960.pdf#page=741) (Barron 187,501, Smith 140,079, Orel J. Skeen 39,907), [p. 750](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1960.pdf#page=759) (Neely 102,618, Revercomb 83,028). [[w.williams-west-virginia]]; [[w.peirce-border-south-states]]. Names: Barron, Smith (K–J Cong. III.F); Neely, Revercomb (K–J Cong. III.K); Kennedy (Viet. III.A).'
      tags:
      - state:wv
      - name:barron-w-w
      - name:smith-hulett-c
      - name:neely-harold-e
      - name:revercomb-chapman
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-02-14.state-and-city-finance-wv
      when: Feb. 14
      date: '1961-02-14'
      thread: state-and-city-finance
      c: 'West Virginias personal income tax. Barron signs S. 106, passed Feb. 10: a tax of 6 percent of the taxpayers federal income tax, on the federal definitions of income, from the year 1961. The same session: an added one-cent consumers sales tax, to Aug. 31 (S. 3).'
      n: '*West Virginia Blue Book*, 1961, [p. 247](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1961.pdf#page=257); 1964, [p. 928](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1964.pdf#page=938) (W. Va. Code ch. 11, art. 21; "a conformity statute"). [[w.williams-west-virginia]]; [[w.peirce-border-south-states]]. Names: Barron (K–J Cong. III.F).'
      tags:
      - state:wv
      - name:barron-w-w
