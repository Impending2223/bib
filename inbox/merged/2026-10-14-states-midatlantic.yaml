      id: cal.1964-09-29.legislatures-pa
      when: Sept. 29
      date: '1964-09-29'
      thread: legislatures
      c: '*Butcher v. Bloom*: the Pennsylvania Supreme Court holds the General Assemblys apportionment acts of 1964 invalid under the Fourteenth Amendment, the State Constitutions provisions construed as valid. The 1964 elections to go forward; the General Assembly to reapportion by Sept. 1, 1965, or the court will.'
      n: '*Butcher v. Bloom*, 415 Pa. 438, 203 A.2d 556 (1964). *Scranton v. Drew*, [379 U.S. 40](https://tile.loc.gov/storage-services/service/ll/usrep/usrep379/usrep379040/usrep379040.pdf) (1964). [[w.dixon-democratic-representation]]; [[w.beers-pennsylvania-politics-today-and]]. See [[cal.1964-06-15.court]].'
