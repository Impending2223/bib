      when: May 11
      date: '1964-05-11'
      thread: desegregation-public-places
      also:
      - elections-1964
      c: Cambridge, Md. Wallace, campaigning for the May 19 primary, speaks to a white audience at the Rescue Fire Companys arena, invited by the Dorchester Business and Citizens Association. Some 300 Negro demonstrators march; the Guard disperses them with tear gas; Richardson arrested. Check.
      n: '[SNCC Digital Gateway, "Demonstrators Tear Gassed at George Wallace Protest in Cambridge"](https://snccdigital.org/events/demonstrators-tear-gassed-george-wallace-protest-cambridge/). [[w.levy-civil-war-on-race]]; [[w.carter-politics-of-rage-1995]]. See [[cal.1963-10-01.desegregation-public-places-cambridge]]. Names: Wallace (K–J Cong. III.F); Richardson (K–J Cong. III.K).'
      tags:
      - state:md
      - city:cambridge-md
      - name:wallace-george-c
      - name:richardson-gloria
