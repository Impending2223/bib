      when: Nov. 8
      date: '1966-11-08'
      thread: governors
      also:
      - elections-1966
      c: 'Maryland. Agnew (R), Baltimore County executive, governor over Mahoney (D) and Pressman, Baltimores comptroller, an independent: 455,318, 373,543 and 90,899; Agnew 49.5 percent. Agnew carries Baltimore City, 114,262 to 90,352.'
      n: '*Maryland Manual*, 1967–68, [p. 503](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--503.html). [[w.witcover-white-knight]]; [[w.coffey-spiro-agnew-and-the]]; [[w.durr-behind-the-backlash]]; [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-09-13.elections-1966]]. Names: Agnew (Opp. III.H); Mahoney, Pressman (K–J Cong. III.K).'
