      id: cal.1964-11-03.elections-1964-dc
      when: Nov. 3
      date: '1964-11-03'
      thread: elections-1964
      also:
      - states-and-cities
      c: 'The District of Columbia votes for President for the first time, under the Twenty-third Amendment: Johnson 169,796, Goldwater 28,801; 85.5 percent. Three electoral votes.'
      n: '[Wikipedia, "1964 United States presidential election in the District of Columbia"](https://en.wikipedia.org/wiki/1964_United_States_presidential_election_in_the_District_of_Columbia); the Clerks *Statistics* print no vote for the District; check against the Board of Elections certificate (National Archives). [[w.asch-chocolate-city]]; [[w.gillette-between-justice-and-beauty]]. See [[cal.1961-03-29.states-and-cities]]. Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
