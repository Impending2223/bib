    entry:
      id: cal.1964-03-14.desegregation-public-places-md
      when: Mar. 14
      date: '1964-03-14'
      thread: desegregation-public-places
      c: 'Maryland. The special session (Mar. 11–14) passes ch. 29: the public accommodations act to the whole State, the county exceptions dropped; pay for taking part in racial demonstrations forbidden. Tawes signs Apr. 7. Petitions for a referendum suspend it.'
      n: 'Acts, special session of 1964, ch. 29 (*Maryland Manual*, 1965–66, [p. 484](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000172/html/am172--484.html)); *Bell v. Maryland*, [378 U.S. 226](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378226/usrep378226.pdf) (1964). [[w.callcott-maryland-and-america-1940]]. See [[cal.1963-03-29.desegregation-public-places-md]]. Names: Tawes (K–J Cong. III.F).'
      tags:
      - state:md
      - name:tawes-j-millard
