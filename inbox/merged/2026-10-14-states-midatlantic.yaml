      when: May 15
      date: '1962-05-15'
      thread: governors
      also:
      - elections-1962
      c: 'Maryland primaries for governor. Democratic: Tawes renominated with 40.4 percent; Mahoney 28.5; David Hume 26.7; four others. Republican: Frank Small Jr. 77.8.'
      n: '*Maryland Manual*, 1963–64, [pp. 467–68](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--467.html) (Tawes 178,792, Mahoney 125,966, Hume 118,295; Small 71,791). [[w.callcott-maryland-and-america-1940]]. Names: Tawes (K–J Cong. III.F); Mahoney, Hume, Small (K–J Cong. III.K).'
