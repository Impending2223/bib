      when: Aug. 2–4
      date: '1964-08-02'
      thread: states-and-cities
      c: 'Jersey City. A womans arrest in the Lafayette section, Aug. 2; three nights of rock-throwing, window-breaking and looting. Aug. 3, Whelan meets the neighborhoods leaders: recreation, Negro policemen and jobs asked. Check the figures of hurt and arrested.'
      n: '[*New York Times*, Aug. 4, 1964](https://timesmachine.nytimes.com/timesmachine/1964/08/04/issue.html); [Aug. 5](https://timesmachine.nytimes.com/timesmachine/1964/08/05/issue.html). [[w.flamm-law-and-order]]; [[w.sugrue-sweet-land-of-liberty]]. See [[cal.1964-07-18.states-and-cities]]. Names: Whelan (K–J Cong. III.F).'
