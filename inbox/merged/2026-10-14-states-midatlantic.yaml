      - name:underwood-cecil-h
- add:
    entry:
      id: cal.1965-03-18.crime-and-hijacking-wv
      when: Mar. 18
      date: '1965-03-18'
      thread: crime-and-hijacking
      c: 'West Virginia abolishes capital punishment. Smith approves H.B. 517, passed Mar. 12: no one convicted, before or after, to be executed; life imprisonment for first-degree murder, kidnapping and rape, without parole unless the jury recommends mercy.'
      n: '[Enrolled Committee Substitute for H.B. 517](https://code.wvlegislature.gov/signed_bills/1965/1965-RS-HB517-SUB%20ENR_signed.pdf), approved Mar. 18, 1965; [W. Va. Code § 61-11-2](https://code.wvlegislature.gov/61-11-2/). *West Virginia Blue Book*, 1965, [p. 307](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1965.pdf#page=317). [[w.banner-death-penalty]]; [[w.williams-west-virginia]]. Names: Smith (K–J Cong. III.F).'
      tags:
      - state:wv
      - name:smith-hulett-c
- add:
    entry:
      id: cal.1961-12-18.crime-and-hijacking-de
      when: Dec. 18
      date: '1961-12-18'
      thread: crime-and-hijacking
      c: Delaware restores the death penalty for first-degree murder, abolished in 1958. The House overrides Carvels vetoes; the two acts become law without his approval. Hanging the method; a jury may recommend mercy, the court then to impose life imprisonment.
      n: 'Del. Laws 1961, [ch. 309](https://legis.delaware.gov/SessionLaws/Chapter?id=30285), [ch. 310](https://legis.delaware.gov/SessionLaws/Chapter?id=30286) ("became a law on December 18, 1961 without the approval of the Governor"). [*Harrington Journal*, Dec. 22, 1961](https://ghhsociety.org/wp-content/uploads/2022/06/19611222.pdf). [[w.banner-death-penalty]]; [[w.peirce-mid-atlantic-states-of]]. Names: Carvel (K–J Cong. III.F).'
      tags:
      - state:de
      - name:carvel-elbert-n
