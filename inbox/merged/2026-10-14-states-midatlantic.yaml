      id: cal.1960-11-08.state-constitutions-md
      when: Nov. 8
      date: '1960-11-08'
      thread: state-constitutions
      also:
      - cities-and-housing
      c: 'Maryland. Fifteen amendments, all ratified: counties and towns other than Baltimore may be empowered to clear slum areas by urban renewal, 327,178 to 100,527; a Municipal Court for Baltimore City; succession to the governorship; bills vetoed after the session no longer returned to the next; land in farming assessed as farmland. The Potomac River Compact approved at referendum, 244,510 to 204,837.'
      n: '*Maryland Manual*, 1963–64, [pp. 484–91](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--484.html). [[w.callcott-maryland-and-america-1940]].'
      tags:
      - state:md
