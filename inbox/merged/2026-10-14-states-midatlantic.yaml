      id: cal.1963-03-29.desegregation-public-places-md
      when: Mar. 29
      date: '1963-03-29'
      thread: desegregation-public-places
      c: 'Maryland. The General Assembly passes the public accommodations act, ch. 227: places of public accommodation not to refuse service for race, in Baltimore City and some of the counties, the others excepted; in force June 1. The Commission on Interracial Problems powers widened.'
      n: Acts 1963, ch. 227; *Bell v. Maryland*, [378 U.S. 226](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378226/usrep378226.pdf) (1964). *Maryland Manual*, 1963–64, [p. 241](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--241.html). [[w.callcott-maryland-and-america-1940]]. See [[cal.1962-03-09.desegregation-public-places-md]].
