- add:
    entry:
      id: cal.1962-05-24.legislatures-md
      when: May 24–31
      date: '1962-05-24'
      thread: legislatures
      c: 'Maryland. On remand from the Court of Appeals, Apr. 25, the Anne Arundel County Circuit Court holds the apportionment of the House of Delegates a denial of equal protection to Baltimore, Montgomery and Prince Georges Counties, May 24. Special session, May 25–31: 19 seats added for the term from 1963, 123 to 142, seven for Baltimore County; a constitutional apportionment refused. July 23, the Court of Appeals upholds the Senate, one Senator a county.'
      n: '*Maryland Committee for Fair Representation v. Tawes*, 228 Md. 412 (1962); its history in [377 U.S. 656](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377656/usrep377656.pdf) (1964). *Maryland Manual*, 1963–64, [p. 240](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--240.html). [[w.cortner-apportionment-cases]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]].'
      tags:
      - state:md
- add:
    entry:
      id: cal.1962-06-08.desegregation-public-places-baltimore
      when: June 8
      date: '1962-06-08'
      thread: desegregation-public-places
      c: 'Baltimore. Ordinance No. 1249: owners and operators of places of public accommodation, restaurants among them, not to refuse service for race; in force at once.'
      n: '*Bell v. Maryland*, [378 U.S. 226](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378226/usrep378226.pdf) (1964) (Brennan, J.), the ordinance quoted. [[w.durr-behind-the-backlash]]; [[w.callcott-maryland-and-america-1940]]. The Court on it: [[cal.1964-06-22.court]].'
      tags:
      - state:md
      - city:baltimore
- add:
    entry:
      id: cal.1962-11-06.state-constitutions-md
      when: Nov. 6
      date: '1962-11-06'
      thread: state-constitutions
      also:
      - legislatures
      c: 'Maryland. Amendments: legislators pay from $1,800 to $3,000 rejected, 124,323 to 212,608; more signers needed to refer an act to the voters, 193,840 to 124,600; a decree for an illegitimate childs support enforceable by imprisonment, 280,651 to 59,329; quick-taking of land in Baltimore City and Montgomery County. Referenda: the act of 1961 redrawing the congressional districts for an eighth seat rejected, 115,557 to 211,904, the eighth elected at large; the unemployment insurance act of 1961 approved, 242,895 to 185,010.'
      n: '*Maryland Manual*, 1963–64, [pp. 459–63](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--459.html), [238](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--238.html), [244](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--244.html). [[w.callcott-maryland-and-america-1940]]. See [[cal.1960-11-08.state-constitutions-md]].'
      tags:
      - state:md
