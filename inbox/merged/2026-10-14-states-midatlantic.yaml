      - name:pressman-hyman-a
- add:
    entry:
      id: cal.1966-11-08.state-constitutions-md
      when: Nov. 8
      date: '1966-11-08'
      thread: state-constitutions
      c: 'Maryland. Sixteen amendments, twelve ratified: intermediate courts of appeal, 296,940 to 123,227; a Commission on Judicial Disabilities; home rule for code counties; the Governors salary raised; the Land Office abolished. Rejected: the General Assembly to set its own pay, 137,201 to 277,917; a Workmens Compensation Commission; Baltimore Citys borrowing; Washington Countys deputy clerks. The act for a second Chesapeake Bay bridge rejected at referendum, 248,942 to 289,418.'
      n: '*Maryland Manual*, 1967–68, [pp. 511–20](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--511.html), [288](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--288.html). [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-09-13.state-constitutions-md]].'
      tags:
      - state:md
