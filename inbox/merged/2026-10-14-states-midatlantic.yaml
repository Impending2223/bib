      id: cal.1965-05-01.desegregation-schools-philadelphia
      when: May 1–Dec. 17
      date: '1965-05-01'
      thread: desegregation-schools
      also:
      - civil-rights-organizations
      c: 'Philadelphia. Moore and the NAACP picket the wall of Girard College, open by Stephen Girards will to "poor white male orphans" alone, from May 1 to Dec. 17. King at the wall, Aug. 3: "a kind of Berlin wall."'
      n: '[*New York Times*, Aug. 4, 1965](https://timesmachine.nytimes.com/timesmachine/1965/08/04/issue.html). [[w.countryman-up-south]]; [[w.branch-at-canaans-edge]]. Names: Moore (K–J Cong. III.K); King (K–J Cong. III.H).'
