      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - elections-1968-johnson
      c: 'Watson, about 10:30, to CBS: asked whether he "controlled" the convention for Johnson, he denies it; no knowledge of the President''s even contacting people. Asked of rumors of a draft, he does not know whether anyone plans anything.'
      n: '[[w.longley-lbjs-1968]], 217. To check: Nelson, "Drafting Lyndon Johnson," 707 (cited by [[w.longley-lbjs-1968]], 217 n.42). See [[cal.1968-08-26.elections-1968-chicago]]. Names: Watson, Johnson.'
      src:
