patch: four-year-house-term
by: agent
ops:
  - add:
      entry:
        id: cal.1966-01-20.amendments
        when: Jan. 20
        date: '1966-01-20'
        thread: amendments
        also: [congress, electoral-college]
        c: 'Special message: two amendments to the Constitution. Representatives elected for four years, with the President, from 1972 at the earliest; no Member of either House eligible for the other unless he resigns 30 days before the election. The electoral college reform of 1965 asked again: unpledged electors no longer free to throw the election into the House; in a contingent election, not one vote a State; President and Vice President chosen by the same body; the District a part in it; the death of a candidate or a President-elect provided for. The joint resolution printed as H. Doc. 364.'
        n: '[Special Message to the Congress Proposing Constitutional Amendments Relating to Terms for House Members and the Electoral College System](https://www.presidency.ucsb.edu/documents/special-message-the-congress-proposing-constitutional-amendments-relating-terms-for-house) (Jan. 20, 1966); H.R. Doc. No. 89-364, [112 Cong. Rec. 794](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-8-2.pdf) (1966). [[w.kyvig-explicit-and-authentic-acts]]; [[w.peirce-peoples-president]]; [[w.longley-politics-of-electoral-college]]. See [[cal.1966-01-12.program]]; [[cal.1965-01-28.succession]]. Names: Johnson.'
        tags: [name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1966-02-15.amendments
        when: Feb. 15
        date: '1966-02-15'
        thread: amendments
        also: [congress]
        c: 'House Judiciary Committee, Celler''s, on H.J. Res. 807, the President''s text, and nineteen other resolutions for a four-year House term. Katzenbach for H.J. Res. 807: the term to run with the President''s; half the House elected every two years refused. The hearings, begun Aug. 18, 1965, close Mar. 1. No resolution reported.'
        n: '*Congressional Tenure of Office: Hearings before the House Committee on the Judiciary and Subcommittee No. 5*, 89th Cong. (1965–66) ([HathiTrust](https://babel.hathitrust.org/cgi/pt?id=uc1.$b655183), full view; Check the page of Katzenbach''s testimony); [Statement by Attorney General Nicholas deB. Katzenbach](https://www.justice.gov/ag/aghistory/katzenbach/1966/02-15-1966.pdf) (Feb. 15, 1966). See [[cal.1966-01-20.amendments]]. Names: Celler, Katzenbach.'
        tags: [name:celler-emanuel, name:katzenbach-nicholas]
  - add:
      entry:
        id: cal.1966-07-13.amendments
        when: July 13–14
        date: '1966-07-13'
        thread: amendments
        also: [congress]
        c: 'Senate Judiciary''s Subcommittee on Constitutional Amendments, Bayh''s, on a four-year House term: S.J. Res. 72, 126, 128 and 132 and a House resolution. Neither Judiciary Committee reports a resolution; neither House votes.'
        n: '*Four-Year Term for Representatives: Hearings before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 89th Cong., 2d sess. (1966) ([Monthly Catalog](https://mocat.library.unt.edu/catalog/871-12417); Y 4.J 89/2:R 29/4; Check: a digitized copy, and the House resolution, H.J. Res. 394 or 391). [Congressional Research Service, *Proposals to Change the House Term of Office to Four Years*](https://www.everycrsreport.com/reports/RS21574.html) (2003). See [[cal.1966-01-20.amendments]]. Names: Bayh.'
        tags: [name:bayh-birch]
