      date: '1961-06-01'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 19-NQ/TW, under Article 37 of the statute: a joint cell committee (liên chi) where a basic organization has 300 members or more and one of its sections 50 or more.'
      n: '*Nghị quyết của Ban Bí thư số 19-NQ/TW về việc thành lập Liên chi trong tổ chức cơ sở của Đảng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 327–31. Made public: 2002.'
      tags:
      - polity:drv
# op 124
- add:
    entry:
      id: cal.1961-06-16.vietnam-hanoi
      when: June 16
      date: '1961-06-16'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN: directive on mass and front work. The movement strong and the National Liberation Front''s influence wide, but faults in the work; the mass organizations to be built wide and many in every area, and firm.'
      n: '*Chỉ thị của Trung ương Cục miền Nam thiết thực đẩy mạnh công tác dân vận - mặt trận để tiến kịp với tình hình phát triển hiện nay*. [[w.van-kien-dang-toan]], XXII, 633–40. Made public: 2002. Check: the issuer: the heading has COSVN; the directive asks the results reported to the Xứ uỷ, the Nam Bộ committee (640).'
      tags:
      - polity:drv
# op 125
- add:
    entry:
      id: cal.1961-06-26.vietnam-hanoi
      when: June 26
      date: '1961-06-26'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 20-CT/TW against "U.S.-Diệm" commandos and spies sent North, by sea, across the border or by parachute; since Kennedy became President, Washington more active in sending saboteurs into the socialist countries; the "observation teams" trained since late 1957.'
      n: '*Chỉ thị của Ban Bí thư số 20-CT/TW về công tác đối phó với hoạt động tung biệt kích gián điệp của bọn Mỹ - Diệm ra phá hoại miền Bắc nước ta*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 337–44. Made public: 2002. Names: Ngô Đình Diệm, Kennedy.'
      tags:
      - name:kennedy-john-f
      - polity:us
      - polity:rvn
      - name:ngo-dinh-diem
      - polity:drv
# op 126
- add:
    entry:
      id: cal.1961-06-30.vietnam-hanoi
      when: June 30
      date: '1961-06-30'
      thread: vietnam-hanoi
      c: 'The Central Committee''s fourth plenum, Hanoi: resolution no. 22-NQ/TW on strengthening the Central Committee''s leadership. Three years of victory; the land reform''s errors liquidated. The line right, but at times late and not made concrete; the faults chiefly in organizing and directing its execution, to be gone into at later plenums on single subjects. Every member of the Central Committee to spend time at the base each year, those over branches to direct one basic organization themselves.'
      n: '*Nghị quyết của Hội nghị Trung ương lần thứ tư số 22-NQ/TW về việc tăng cường lãnh đạo của Trung ương*. [[w.van-kien-dang-toan]], XXII, 345–64. Made public: 2002.'
      tags:
      - polity:drv
# op 127
- add:
    entry:
      id: cal.1961-07-03.vietnam-hanoi
      when: July 3
      date: '1961-07-03'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi, Lê Duẩn, Phạm Hùng, Hoàng Anh and Nguyễn Văn Trân present, on pay for commune cadres: the government and the Party to pay some Party and administration cadres; the cooperatives their own cadres; the mass organizations'' cadres, as revolutionary bodies, no state allowance.'
      n: '*Thông báo Hội nghị Ban Bí thư số 14-TB/TW về chế độ đãi ngộ đối với cán bộ xã*, Nov. 24, 1961, signed by Phạm Chung, deputy head of the Central Office. [[w.van-kien-dang-toan]], XXII, 550–54. Made public: 2002. Names: Lê Duẩn, Phạm Hùng, Hoàng Anh, Nguyễn Văn Trân.'
      tags:
      - name:le-duan
      - polity:drv
# op 128
- add:
