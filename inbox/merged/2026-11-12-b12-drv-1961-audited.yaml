      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 5-NQ/TW on the press in 1961, after reports on circulation and the papers'' finances: central papers'' circulation up at most 15 percent; each zone''s and province''s papers merged into one, under the Party committee; the papers toward economic accounting.'
