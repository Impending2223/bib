      when: Nov. 13
      date: '1961-11-13'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 32-CT/TW, pressing the movement to protect public order, "a broad mass campaign" by directive no. 186 of Feb. 17, 1960.'
      n: '*Chỉ thị của Ban Bí thư số 32-CT/TW về việc đẩy mạnh phong trào bảo vệ trị an*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 536–39. See [[cal.1960-02-17.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
# op 146
- add:
    entry:
      id: cal.1961-11-22.vietnam-hanoi
      when: Nov. 22
      date: '1961-11-22'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 33-CT/TW on the rules for merging farm cooperatives into larger ones, by the Politburo''s resolution on cooperativization in 1961: crops near harvest left to the small cooperative, the rest to the large; debts for production and for fixed assets.'
      n: '*Chỉ thị của Ban Bí thư số 33-CT/TW về một số chính sách trong khi tiến hành hợp nhất mở rộng quy mô hợp tác xã sản xuất nông nghiệp*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 543–49. See [[cal.1961-02-27.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
# op 147
- add:
    entry:
      id: cal.1961-11-24.vietnam-hanoi
      when: Nov. 24
      date: '1961-11-24'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 31-NQ/TW on the plan to rebuild and enlarge Haiphong, the North''s largest port, a strategic point for defense: 250,000 to 300,000 people over some three five-year plans to 1975; the port to 4 million tons a year, eastward; new industry at Vật Cách.'
      n: '*Nghị quyết của Bộ Chính trị số 31-NQ/TW về quy hoạch cải tạo và mở rộng thành phố Hải Phòng*. [[w.van-kien-dang-toan]], XXII, 555–60. Made public: 2002.'
      tags:
      - polity:drv
# op 148
- add:
    entry:
      id: cal.1961-11-25.vietnam-hanoi
      when: Nov. 25
      date: '1961-11-25'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat to COSVN, cable no. 525, on learning and reporting the enemy''s situation, the spies of the imperialists, the Americans above all, and the reactionaries: every member to report; trusted members to be placed in the enemy''s intelligence, police and reactionary bodies; men in key posts won over; some planted to stay hidden after the South''s liberation.'
      n: '*Điện của Ban Bí thư gửi Trung ương Cục số 525 hướng dẫn việc nắm và báo cáo về tình hình địch* (the heading the editors''). [[w.van-kien-dang-toan]], XXII, 561–67. Made public: 2002.'
      tags:
      - polity:us
      - polity:drv
# op 149
- add:
    entry:
      id: cal.1961-11-30.vietnam-hanoi
      when: Nov. 30–Dec. 2
      date: '1961-11-30'
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china
      c: The Central Committee's sixth plenum, Hanoi. Lê Duẩn reports for the delegation, led by Hồ Chí Minh, to the Soviet party's Twenty-second Congress; the plenum approves the report and the delegation's acts, studies Khrushchev's report on the new program "for building communism," to be spread in the Party and among the people. The Politburo to put the Central Committee's view of the Albanian-Soviet quarrel to the Soviet, Albanian and fraternal parties when it can. Unity with the Soviet and Chinese parties, the Soviet Union "the center."
      n: '*Báo cáo của Đoàn đại biểu Đảng Lao động Việt Nam dự Đại hội lần thứ XXII của Đảng Cộng sản Liên Xô do đồng chí Lê Duẩn trình bày ...*; *Kết luận của Hội nghị Ban Chấp hành Trung ương lần thứ sáu ...*; *Thông cáo về Hội nghị lần thứ sáu ...*. [[w.van-kien-dang-toan]], XXII, 568–608 (the report, 568–602; the conclusions, 603–04; the communiqué, 605–08). See [[cal.1961-11.vietnam-hanoi]]. Made public: 2002 (the report, the conclusions); the communiqué the plenum''s public statement. Names: Lê Duẩn, Hồ Chí Minh, Khrushchev.'
      tags:
      - name:le-duan
      - name:ho-chi-minh
      - name:khrushchev-nikita-s
      - polity:ussr
      - polity:prc
      - polity:drv
# op 150
- add:
    entry:
      id: cal.1961-12-11.vietnam-hanoi
      when: Dec. 11
      date: '1961-12-11'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 34-CT/TW, after the Center''s conference on the tenth-month grain: where the work is done well the people sell rice and pay the tax willingly; elsewhere the crop rated low without ground, lower purchase quotas asked, rice hoarded, grain wasted on liquor. The crop normal, about 1960''s: to be rightly assessed; winter-spring production pushed, corn and sweet potatoes above all; grain saved, its market managed.'
      n: '*Chỉ thị của Ban Bí thư số 34-CT/TW về việc tăng cường lãnh đạo công tác lương thực hiện nay*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 609–15. Made public: 2002.'
      tags:
      - polity:drv
# op 151
- add:
    entry:
      id: cal.1961-12-22.vietnam-hanoi
      when: Dec. 22
      date: '1961-12-22'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat, Hanoi: directive no. 35-CT/TW. With the Staley plan, and after General Taylor''s visit, the American National Security Council has approved a program of armed intervention: some 70 military aircraft, many weapons and nearly 1,000 American officers and men sent to the South, part of the Seventh Fleet patrolling its coast. The political struggle against it to go on and widen: American personnel, aircraft and arms out; the International Commission to act.'
      n: '*Chỉ thị của Ban Bí thư số 35-CT/TW về tiếp tục đẩy mạnh cuộc đấu tranh chống đế quốc Mỹ và tay sai Ngô Đình Diệm đưa thêm nhiều vũ khí và nhân viên quân sự Mỹ vào miền Nam Việt Nam*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXII, 616–20. Made public: 2002. Names: Taylor, Staley.'
      tags:
      - name:taylor-maxwell
      - polity:us
      - polity:rvn
      - name:staley-eugene
      - polity:drv
# op 152
- add:
