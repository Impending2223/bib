patch: 2026-11-12-b12-drv-1960-61
by: 'Claude (batch 12 audit, 1961: the DRV''s records, Văn kiện Đảng toàn tập, vol. 22), Nov. 12, 2026'
ops:
# op 89
- add:
    entry:
      id: cal.1961-01-03.vietnam-hanoi
      when: Jan. 3
      date: '1961-01-03'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 08-CT/TW on mass cultural work: since directive no. 109 of Oct. 21, 1958, wider and beginning to carry the Party''s thought, but weak in ideology and fight, little tied to the political tasks, thin in the countryside, on the building sites and in the mountains. Its aims: the Third Congress''s resolutions and the Party''s policies, science and technique, good literature and art spread; clubs and village culture houses; each committee to set its tasks for 1961.'
      n: '*Chỉ thị của Ban Bí thư số 08-CT/TW về việc tăng cường công tác văn hoá trong quần chúng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 1–12. Made public: 2002.'
      tags:
      - polity:drv
# op 90
- add:
    entry:
      id: cal.1961-01-05.vietnam-hanoi
      when: Jan. 5–7
      date: '1961-01-05'
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china
      c: 'The Central Committee''s third plenum, Hanoi, on the Moscow meeting of the communist and workers'' parties of November 1960. Lê Duẩn''s report for the delegation, "Strengthen unity, advance to new victories!": the socialist system becoming decisive, the colonial system breaking up, a world war preventable; differences among the parties, the Soviet and Chinese above all. The resolution: the new declaration of the 81 parties, with that of 1957, the movement''s common program; in Indochina and Southeast Asia "peace will surely defeat war"; its documents to be studied in the Party.'
      n: '*Tăng cường đoàn kết nhất trí, tiến tới những thắng lợi mới!* (Báo cáo của đồng chí Lê Duẩn ...); *Nghị quyết của Hội nghị lần thứ ba của Trung ương Đảng Lao động Việt Nam ... về Hội nghị đại biểu các Đảng Cộng sản và Đảng Công nhân tháng 11 năm 1960 ở Mạc Tư Khoa*; *Thông cáo của Ban Chấp hành Trung ương Đảng Lao động Việt Nam về Hội nghị Trung ương lần thứ ba*. [[w.van-kien-dang-toan]], XXII, 52–114, 118–22 (the report, 52–103, the parties'' differences, 53; the resolution, Jan. 5–7, 104–14; the communiqué, 121: the delegation led by Hồ Chí Minh, the documents'' study decided). Made public: 2002 (the report, the resolution); the communiqué the plenum''s public statement. Names: Lê Duẩn. Check: the day: the communiqué (118) has the plenum sit Dec. 28, 1960–Jan. 6, 1961; the resolution (104), Jan. 5–7.'
      tags:
      - name:le-duan
      - polity:ussr
      - polity:prc
      - polity:drv
