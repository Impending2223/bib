      c: 'The Politburo, sessions of Jan. 31 and Feb. 25, on the military tasks of 1961–65: peace in the North the first task; in the South armed struggle raised to equal weight with the political, ten to fifteen main-force regiments to be built; the Central Military Party Committee to direct the war there. Hồ Chí Minh to the closing session. The same day, its resolution 12-NQ/TW: a rectification campaign in the spring of 1961, ideological work tied to life and production, finished by the end of June; a Central Rectification Board under Trường Chinh.'
      n: '[[w.vietnam-victory-in-vietnam]], 74–77, 455 nn.2, 5–7; [[w.asselin-hanois-road-to-the]], 92–94 (the session of January; Lê Duẩn''s letter to the South, Feb. 7); [[w.van-kien-dang-toan]], XXII, 205–14 (*Nghị quyết của Bộ Chính trị số 12-NQ/TW về cuộc vận động chỉnh huấn mùa xuân 1961*, Feb. 25, signed for the Politburo by Lê Duẩn; it names no session). To check: the Politburo''s resolution of Feb. 25, 1961 (cited by [[w.vietnam-victory-in-vietnam]], 74 n.2); Hồ Chí Minh''s speech to the session of Feb. 25, 1961 (cited by [[w.vietnam-victory-in-vietnam]], 77 n.7); the Politburo''s instruction of Jan. 24, 1961, *Văn kiện Đảng toàn tập*, 22:153–55 (cited by [[w.asselin-hanois-road-to-the]], 92 n.1). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing); resolution 12-NQ/TW, 2002. Names: Hồ Chí Minh, Trường Chinh. Check: Asselin, 93, reads the January directive as preparation for war, the political struggle still first; his is the Politburo''s instruction of Jan. 24 (92 n.1).'
