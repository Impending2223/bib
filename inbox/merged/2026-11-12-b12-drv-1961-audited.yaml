      date: '1961-07-19'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: a resolution on the direction of credit, the management of money and the drawing of savings.'
      n: '[[w.van-kien-dang-toan]], XXII, 508 (the Secretariat''s directive no. 30-CT/TW of Nov. 9, 1961, citing it). Made public: 2002. To check: the resolution itself, not printed in the volume.'
      tags:
      - polity:drv
# op 132
- add:
    entry:
      id: cal.1961-07-24.vietnam-hanoi
      when: July 24
      date: '1961-07-24'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 25-CT/TW. The movement of "technical demonstrations" to rationalize production and improve technique in the enterprises, sites and handicraft cooperatives to be pressed.'
      n: '*Chỉ thị của Ban Bí thư số 25-CT/TW về việc tiếp tục đẩy mạnh phong trào thi đua hợp lý hoá sản xuất, cải tiến kỹ thuật*, signed for the Secretariat by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 399–403. Made public: 2002.'
      tags:
      - polity:drv
# op 133
- add:
    entry:
      id: cal.1961-07-25.vietnam-hanoi
      when: July 25
      date: '1961-07-25'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: regulation no. 24-QĐ/TW. Cadres and staff of the Party, state and mass organizations sent, and to be sent, to work in "the West" at the "friendly party''s" request: their political, cultural and professional training and their material care added to; proletarian internationalism; good relations among them and with the cadres at home.'
      n: '*Quy định của Ban Bí thư số 24-QĐ/TW về một số chế độ đối với cán bộ, nhân viên dân, chính, đảng công tác ở miền Tây*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 404–09. Made public: 2002.'
      tags:
      - polity:drv
# op 134
- add:
    entry:
      id: cal.1961-08-04.vietnam-hanoi
      when: Aug. 4
      date: '1961-08-04'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN''s standing committee: directive on the struggle against spies and on building its own "security" and "protection" organization. The enemy, weakening in the countryside and mountains, adds police and informers in the towns and rebuilds its spy networks in the strong rural areas, for commando raids and terror. The faults: punishment at random, crude, or lenient without principle. A security board in each commune under the cell committee, scouts in the hamlets; a few cadres for the work at district, province and zone.'
      n: '*Chỉ thị của Trung ương Cục miền Nam về đấu tranh chống gián điệp và xây dựng lần tổ chức "an ninh", "bảo vệ" của ta*, signed by COSVN''s standing committee ("TV. R"). [[w.van-kien-dang-toan]], XXII, 641–52. Made public: 2002.'
      tags:
      - polity:drv
# op 135
- add:
    entry:
      id: cal.1961-08-10.vietnam-hanoi
      when: Aug. 10
      date: '1961-08-10'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat to the Nam Bộ Executive Committee, secret cable no. 168, answering its no. 104/NB of July 11 on the first conference of the Central Office for South Vietnam: to grasp the whole South, Interzone V and Nam Bộ, and the Politburo''s new directive; COSVN''s organs, base area and division of work; the battlefields redrawn, their chiefs named; one leadership, one budget, one system of liaison, transport and supply. The Center has named its secretary and deputy; Trần Lương to stay in Nam Bộ with the standing committee; Võ Chí Công still deputy secretary, free to go to Interzone V as its secretary too; Trần Văn Quang commander for Nam Bộ, Nguyễn Đôn for Zone V.'
      n: '*Điện mật của Ban Bí thư gửi XUNB số 168 góp ý về nội dung Hội nghị lần thứ nhất của Trung ương Cục miền Nam*. [[w.van-kien-dang-toan]], XXII, 461–63. Made public: 2002. Names: Trần Lương, Võ Chí Công, Trần Văn Quang, Nguyễn Đôn.'
      tags:
      - polity:drv
# op 137
- add:
    entry:
      id: cal.1961-09-08.vietnam-hanoi
      when: Sept. 8
      date: '1961-09-08'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi, Hồ Chí Minh, Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Lê Thanh Nghị and Chu Văn Tấn present, on the summing up of the mountain campaign of cooperatives and democratic reform: on the whole good, feudal exploitation basically ended, some counterrevolutionaries repressed; over 73 percent of the working peasants'' households in cooperatives in nearly two years; management weak, technique little improved, livestock down. The mountain cooperative a political as well as a productive body, the upper strata of the minorities to be won.'
      n: '*Thông báo số 10-TB/VPTW về Hội nghị Bộ Chính trị ngày 8-9-1961 bàn về tổng kết hợp tác hoá kết hợp hoàn thành cải cách dân chủ ở miền núi*, Sept. 20, 1961, signed by Phạm Chung, deputy head of the Central Office. [[w.van-kien-dang-toan]], XXII, 475–79. Made public: 2002. Names: Hồ Chí Minh, Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Lê Thanh Nghị, Chu Văn Tấn.'
      tags:
      - name:ho-chi-minh
      - name:le-duan
      - name:truong-chinh
      - name:pham-van-dong
      - polity:drv
# op 138
- add:
    entry:
      id: cal.1961-09-15.vietnam-hanoi
      when: Sept. 15
      date: '1961-09-15'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat, Hanoi: directive no. 26-CT/TW, signed by Lê Duẩn, on helping the revolution in the South, now "a strong high tide," its bases forming; Diệm, with American help in everything, will strike harder. Beyond the South''s own efforts, the North''s active help in every field; the North to prepare too to help the South rebuild once liberated. The Politburo has passed principles of aid; the Reunification Board, the Organization Board and the Central Military Committee to make them known.'
      n: '*Chỉ thị của Ban Bí thư số 26-CT/TW về việc tích cực công tác giúp đỡ cách mạng miền Nam*, signed for the Secretariat by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 472–74. Made public: 2002. Names: Ngô Đình Diệm, Lê Duẩn.'
      tags:
      - name:le-duan
      - name:ngo-dinh-diem
      - polity:us
      - polity:rvn
      - polity:drv
# op 139
- add:
    entry:
      id: cal.1961-10-04.vietnam-hanoi
      when: Oct. 4
      date: '1961-10-04'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 27-CT/TW on the concentrated reform, in camps, of those "dangerous to social security," after directive no. 13 and the decisions of the National Assembly''s Standing Committee and the Council of Government: counterrevolutionaries first, those with "blood debts" to the people; to be done urgently and under the zone, city and province committees, for errors would cost politically.'
      n: '*Chỉ thị của Ban Bí thư số 27-CT/TW về việc lãnh đạo công tác tập trung cải tạo những phần tử nguy hiểm cho an ninh xã hội*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 480–83. See [[cal.1961-03-01.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
# op 140
- add:
    entry:
      id: cal.1961-10-31.vietnam-hanoi-2
      when: Oct. 31
      date: '1961-10-31'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 29-CT/TW on grain from the 1961 tenth-month crop. The fifth-month crop''s tax in rice at 100.46 percent of plan; purchases and debt collection 84.5 percent of the maximum, 100.8 of the minimum; corn 52.8 percent, sweet potatoes 3.6. For the tenth-month crop the policy basically unchanged: the obligatory purchase, set in late July, at the level of the 1959 crop, surplus bought at an incentive price; rice evened out within the cooperatives; sales managed, grain saved, the "ghost" ration figures in the state offices and towns ended.'
      n: '*Chỉ thị của Ban Bí thư số 29-CT/TW về công tác lương thực vụ mùa 1961*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 496–502. Made public: 2002.'
      tags:
      - polity:drv
# op 141
- add:
    entry:
      id: cal.1961-11-06.vietnam-hanoi
      when: Nov. 6
      date: '1961-11-06'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi. The morning, Phạm Hùng, Hoàng Anh, Tố Hữu, Lê Văn Lương, Nguyễn Chí Thanh and Nguyễn Văn Trân present, on commune cadres'' pay: the state to pay three to five cadres a commune, for the Party''s and the administration''s work, 20 to 25 đồng a month, each to work in production at least 30 days a year; the half-ration allowance of the others ended. The afternoon, Phạm Hùng, Hoàng Anh and Nguyễn Văn Trân, with the Labor Youth Union''s Vũ Quang, Lê Bình and Nguyễn Văn Trọng, on the congress of the Vietnam Youth Federation: its report and statute; Phạm Huy Thông to be its chairman.'
      n: '*Thông báo Hội nghị Ban Bí thư số 14-TB/TW về chế độ đãi ngộ đối với cán bộ xã*, Nov. 24, 1961, signed by Phạm Chung, deputy head of the Central Office, [[w.van-kien-dang-toan]], XXII, 551–54 (the morning); *Thông báo Hội nghị Ban Bí thư số 13-TB/HN bàn về Đại hội liên hiệp Thanh niên Việt Nam*, Nov. 17, 1961, XXII, 540–42 (the afternoon). See [[cal.1961-07-03.vietnam-hanoi]]. Made public: 2002. Names: Phạm Hùng, Hoàng Anh, Tố Hữu, Lê Văn Lương, Nguyễn Chí Thanh, Nguyễn Văn Trân, Vũ Quang, Lê Bình, Nguyễn Văn Trọng, Phạm Huy Thông.'
      tags:
      - name:nguyen-chi-thanh
      - polity:drv
# op 142
- add:
    entry:
      id: cal.1961-11-09.vietnam-hanoi
      when: Nov. 9
      date: '1961-11-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 30-CT/TW, under the Politburo''s resolution of July 19: credit and cash management better in the third quarter, but the imbalance between money in circulation and goods still serious; credit, money and savings work to be strengthened.'
      n: '*Chỉ thị của Ban Bí thư số 30-CT/TW về việc tăng cường công tác tiền tệ, tín dụng và huy động tiết kiệm*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 508–11. See [[cal.1961-07-19.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
# op 143
- add:
    entry:
      id: cal.1961-11-09.vietnam-hanoi-2
      when: Nov. 9
      date: '1961-11-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 31-CT/TW on finance, trade and banking. The year began with grain and food short and prices jumping; the winter-spring crop of 1960–61, rice, corn, sweet potatoes and cassava together, over 60 percent above 1960''s, the autumn rice 135,000 tons; food steadier in recent months. Its aims: more goods and less consumption; the cash deficit cut to the lowest, money in step with goods; exports pressed for machines and materials, the import surplus cut; the budget balanced, a little surplus by the year''s end.'
      n: '*Chỉ thị của Ban Bí thư số 31-CT/TW về việc tăng cường lãnh đạo công tác tài chính - mậu dịch - ngân hàng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 512–29. Made public: 2002.'
      tags:
      - polity:drv
# op 144
- add:
    entry:
      id: cal.1961-11-13.vietnam-hanoi
      when: Nov. 13
      date: '1961-11-13'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 30-NQ/TW on the Party''s organization in the army, after the resolutions of 1952 and 1955 and the directives of 1957 and 1960, for the army''s new brigades, arms and services and the local commands: a Party committee in each brigade, under the Central Military Committee; Party organizations in the arms and services and in the provincial and city commands; control commissions at every level in the army.'
      n: '*Nghị quyết của Bộ Chính trị số 30-NQ/TW về một số vấn đề về tổ chức đảng trong quân đội*, signed for the Politburo by Nguyễn Chí Thanh. [[w.van-kien-dang-toan]], XXII, 530–35. Made public: 2002. Names: Nguyễn Chí Thanh.'
      tags:
      - name:nguyen-chi-thanh
      - polity:drv
# op 145
- add:
