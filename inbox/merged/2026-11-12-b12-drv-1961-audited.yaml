      date: '1961-07-12'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 24-CT/TW. A corps of part-time lecturers in Marxism-Leninism for the cadres'' study at their posts: their standards, lists, hours and training.'
      n: '*Chỉ thị của Ban Bí thư số 24-CT/TW về tổ chức đội ngũ giảng viên lý luận kiêm chức*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 395–98. Made public: 2002.'
      tags:
      - polity:drv
# op 131
