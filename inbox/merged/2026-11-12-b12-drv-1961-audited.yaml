      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 389-NQNS/TW, after the second national trade union congress: the Party group of the General Federation of Labor reorganized, Trần Danh Tuyên secretary, Hoàng Quốc Việt a member.'
      n: '*Nghị quyết của Ban Bí thư số 389-NQNS/TW về việc tổ chức lại Đảng đoàn Tổng Công đoàn*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 305. Made public: 2002. Names: Trần Danh Tuyên, Hoàng Quốc Việt.'
      tags:
      - polity:drv
