# op 120
- add:
    entry:
      id: cal.1961-04-28.vietnam-hanoi
      when: Apr. 28
      date: '1961-04-28'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 18-CT/TW on irrigation works and the dikes in the flood season: 32 large works in 1961, 213 percent of the 1960 investment, over 500 local ones at twice 1960''s.'
      n: '*Chỉ thị của Ban Bí thư số 18-CT/TW về việc tăng cường lãnh đạo hơn nữa công tác xây dựng cơ bản công trình thuỷ lợi và công tác đê điều kè cống trong mùa lũ lụt bão*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 308–12. Made public: 2002.'
      tags:
      - polity:drv
# op 121
- add:
    entry:
      id: cal.1961-05-08.vietnam-hanoi
      when: May 8
      date: '1961-05-08'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 18-NQ/TW on grain policy. The 1960 fifth-month crop bad; for the tenth-month crop the Politburo had made selling surplus rice to the state an obligation by ratio: necessary and right, purchases near 1959''s good year; but commandism and coercion in many places, hoarding and fear of hunger widespread, the countryside tense in places. Grain to be discussed in full at the next plenum. For now: rice and starchy crops pushed; distribution planned from production; the state''s management of purchase and supply tightened; speculation in grain fought.'
      n: '*Nghị quyết của Bộ Chính trị số 18-NQ/TW về chính sách lương thực hiện nay*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 313–22. Made public: 2002.'
      tags:
      - polity:drv
# op 122
- add:
    entry:
      id: cal.1961-05-11.vietnam-hanoi
      when: May 11
      date: '1961-05-11'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat, Hanoi: directive no. 19-CT/TW, a campaign against the American plan to send troops into the South. Washington sends Vice President Johnson to Saigon this day to settle with Ngô Đình Diệm more military aid and troops; $41 million more for Diệm, counterguerrilla trainers and arms; its present aim to threaten the revolutions of the South and Laos and build up Diệm, the ground laid for intervention later. A political struggle: the army''s Commander-in-Chief to condemn it and send a note to the International Commission, the Foreign Ministry to write to the Geneva co-chairmen; protests and petitions, to rise to July 20.'
      n: '*Chỉ thị của Ban Bí thư số 19-CT/TW về phát động đấu tranh chống âm mưu đế quốc Mỹ định đưa quân vào miền Nam Việt Nam*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 323–26. Made public: 2002. Names: Ngô Đình Diệm, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:ngo-dinh-diem
      - polity:us
      - polity:rvn
      - polity:drv
# op 123
