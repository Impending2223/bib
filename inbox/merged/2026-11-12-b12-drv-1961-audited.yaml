# op 100
- add:
    entry:
      id: cal.1961-02.vietnam-hanoi
      when: Feb.
      date: 1961-02
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Interzone V Executive Committee: resolution no. 62 on proselytizing among the enemy''s troops. "U.S.-Diệm" plan to raise the regular army from 150,000 to 300,000, lengthen service, call up reserves, put the Civil Guard under Defense, form commando units, and draw the Self-Defense Corps and the youth into their forces; the troops'' morale lower, some officers against "U.S.-Diệm" since the coup of Nov. 11, 1960. The work''s faults: surrendered soldiers beaten and shot. Proselytizing to be raised: in the armed forces the military Party committees answerable, a cadre for it in every battalion and above, a man in every company and platoon.'
      n: '*Nghị quyết của Khu uỷ V số 62 về công tác binh vận*. [[w.van-kien-dang-toan]], XXII, 731–53. Made public: 2002. Names: Ngô Đình Diệm.'
      tags:
      - polity:us
      - polity:rvn
      - name:ngo-dinh-diem
      - polity:drv
