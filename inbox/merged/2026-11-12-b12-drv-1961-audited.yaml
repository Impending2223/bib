      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 9-CT/TW, by the Politburo''s instruction, a propaganda campaign at the new year, Jan. 20–Feb. 15, for the 1961 plan, the first of the five-year plan; eleven slogans, among them "the socialist camp with the great Soviet Union at its center" and the South''s struggle against "the bloodthirsty U.S.-Diệm regime."'
      n: '*Chỉ thị của Ban Bí thư Trung ương số 9-CT/TW về mở đợt tuyên truyền cổ động nhân dịp đầu năm động viên nhân dân thực hiện kế hoạch nhà nước năm 1961, năm đầu của kế hoạch 5 năm*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 130–37. Made public: 2002. Names: Ngô Đình Diệm.'
