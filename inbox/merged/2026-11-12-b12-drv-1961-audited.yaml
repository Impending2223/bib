      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 27-TT/TW on electing the district, town and châu Party committees as their terms end: nine to 25 members, by circular no. 322-TT/TW of Mar. 23, 1960.'
      n: '*Thông tri của Ban Bí thư số 27-TT/TW về việc bầu cử các Ban Chấp hành Đảng bộ huyện, thị, châu*, signed for the Secretariat by Nguyễn Khai, head of its office. [[w.van-kien-dang-toan]], XXII, 306–07. Made public: 2002.'
      tags:
