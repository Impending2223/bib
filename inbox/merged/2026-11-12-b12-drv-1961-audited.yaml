      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 21-NQ/TW, on the reports of the Central Industry Board and the central handicraft cooperative union board: the tasks of the handicraft cooperatives, production concentrated by trade, as far as it brings better process, tools or mechanization.'
      n: '*Nghị quyết của Ban Bí thư số 21-NQ/TW về nhiệm vụ, phương hướng phát triển sản xuất và củng cố hợp tác xã thủ công nghiệp*, signed for the Secretariat by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 371–88. Made public: 2002.'
      tags:
      - polity:drv
# op 129
- add:
    entry:
      id: cal.1961-07-07.vietnam-hanoi
      when: July 7
      date: '1961-07-07'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 23-CT/TW on finishing the grain work of the 1961 fifth-month crop under the Politburo''s resolution of May 8: the committees slow to lead from the start.'
      n: '*Chỉ thị của Ban Bí thư số 23-CT/TW về việc tăng cường lãnh đạo hoàn thành công tác lương thực vụ chiêm 1961*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXII, 389–94. See [[cal.1961-05-08.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
