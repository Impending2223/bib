patch: west
by: agent
ops:
  - add:
      entry:
        id: cal.1967-01-05.governors-ca
        when: Jan. 5
        date: '1967-01-05'
        thread: governors
        also: [state-and-city-finance]
        c: 'Sacramento. Reagan''s inaugural address on the Capitol steps. The year''s budget $4.6 billion, "an all-time high among the 50 states," with an estimated deficit of $63 million; next year''s could reach three-quarters of a billion. "We are going to squeeze and cut and trim until we reduce the cost of government." Property tax relief promised. The "Creative Society."'
        n: '[First Inaugural Address as Governor of California](https://www.presidency.ucsb.edu/documents/first-inaugural-address-governor-california) (Jan. 5, 1967); also [Reagan Library](https://www.reaganlibrary.gov/archives/speech/january-5-1967-inaugural-address-public-ceremony). [[w.cannon-governor-reagan]]; [[w.dallek-right-moment]]; [[w.groot-selling-ronald-reagan]]. See [[cal.1967-01-02.states-and-cities]]. Names: Reagan.'
        tags: [state:ca, name:reagan-ronald]
  - add:
      entry:
        id: cal.1967-01-17.students-ca
        when: Jan. 17
        date: '1967-01-17'
        thread: students
        also: [state-and-city-finance]
        c: 'Reagan on the University of California''s budget and tuition. Economies of "roughly 10 percent" in every department, savings over $200 million; new revenues still needed. Tuition proposed, with loans and scholarships. The university''s freeze on applications "unwarranted."'
        n: '[Statement of Governor Ronald Reagan on Tuition](https://www.reaganlibrary.gov/archives/speech/january-17-1967-statement-governor-ronald-reagan-tuition) (Reagan Library). [[w.kerr-gold-and-the-blue-2003]]; [[w.rosenfeld-subversives]]; [[w.cannon-governor-reagan]]. See [[cal.1967-01-05.governors-ca]]. Names: Reagan.'
        tags: [state:ca, name:reagan-ronald]
  - add:
      entry:
        id: cal.1967-02-11.students-ca
        when: Feb. 11
        date: '1967-02-11'
        thread: students
        also: [state-and-city-finance]
        c: 'Sacramento. Students and faculty march on the Capitol against tuition and the cuts. Reagan to them from the west steps: no Regent to campaign for him; the people "have some right to a voice in the principles and basic philosophy" of the education they pay for.'
        n: '[Governor Ronald Reagan''s Remarks to Marchers on the West Steps of the Capitol](https://www.reaganlibrary.gov/archives/speech/february-11-1967-governor-ronald-reagans-remarks-marchers-west-steps-capitol) (Reagan Library). See [[cal.1967-01-17.students-ca]]; [[cal.1967-01-20.students]]. Names: Reagan. Check: the marchers'' number.'
        tags: [state:ca, name:reagan-ronald]
  - add:
      entry:
        id: cal.1967-03-18.states-and-cities-us
        when: Mar. 18
        date: '1967-03-18'
        thread: states-and-cities
        c: 'White House Conference with the Governors. Johnson on "a new federalism": grants in aid $15 billion this year, $30 million in 1920, and could quadruple in five years; 400 authorities for grant programs. Authority to the States for "local treatment of local problems"; the governors to advise and consult with the President.'
        n: '[Remarks at a White House Conference With the Governors](https://www.presidency.ucsb.edu/documents/remarks-white-house-conference-with-the-governors); [Remarks at the Governors'' Luncheon](https://www.presidency.ucsb.edu/documents/remarks-the-governors-luncheon); [The President''s Toast at a Dinner for the Governors](https://www.presidency.ucsb.edu/documents/the-presidents-toast-dinner-for-the-governors) (Mar. 18, 1967). [[w.sabato-goodbye-to-good-time]]; [[w.conlan-new-federalism]]; [[w.sparacino-democratic-and-republican-governors]]. Names: Johnson.'
        tags: [name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1967-03-22.states-and-cities-nv
        when: Mar. 22
        date: '1967-03-22'
        thread: states-and-cities
        c: 'Las Vegas. Howard Hughes, in the Desert Inn since Nov. 1966, buys it: $13.2 million (Check). The legislature''s corporate gaming act of 1967, pressed by Laxalt: corporations may hold casino licenses (Check the terms and date).'
        n: 'Check: Nev. Stats. 1967. *Las Vegas Sun*, ["How Vegas went from mob to corporate"](https://lasvegassun.com/news/2008/may/15/how-vegas-went-mob-corporate/), May 15, 2008. [[w.moehring-resort-city-in-the]]; [[w.laxalt-nevadas-paul-laxalt]]; [[w.elliott-history-of-nevada]]. Names: Hughes, Laxalt.'
        tags: [state:nv, city:las-vegas, name:hughes-howard-r-jr, name:laxalt-paul]
  - add:
      entry:
        id: cal.1967-04-12.crime-and-hijacking-ca
        when: Apr. 12
        date: '1967-04-12'
        thread: crime-and-hijacking
        c: 'San Quentin, Cal. Aaron Mitchell, convicted of killing a Sacramento policeman in 1963, executed in the gas chamber, Reagan having refused clemency. The State''s only execution in Reagan''s two terms.'
        n: '[Wikipedia, "Aaron Mitchell (murderer)"](https://en.wikipedia.org/wiki/Aaron_Mitchell_(murderer)); Check: the governor''s clemency file and the day of refusal. [[w.hamm-rebel-and-a-cause]]; [[w.mandery-wild-justice]]; [[w.cannon-governor-reagan]]. See [[cal.1960-02-19.crime-and-hijacking-ca]]. Names: Mitchell, Reagan.'
        tags: [state:ca, name:mitchell-aaron, name:reagan-ronald]
  - add:
      entry:
        id: cal.1967-04-25.health-co
        when: Apr. 25
        date: '1967-04-25'
        thread: health
        also: [women]
        c: 'Colorado. Love signs Lamm''s abortion bill, the first State law to widen the grounds: in a hospital, on the approval of a panel of three physicians, where the pregnancy threatens the woman''s life or permanent physical or mental health, where the child would be born with grave defects, or after rape or incest.'
        n: 'Check: Colo. Sess. Laws 1967 (H.B. 1426). Colorado Public Radio, ["50 years ago, Colorado passed first state law liberalizing abortion"](https://www.cpr.org/2017/04/25/colorados-trailblazing-abortion-law-marks-50-years/), Apr. 25, 2017. [[w.garrow-liberty-and-sexuality]]; [[w.reagan-when-abortion-was-a]]; [[w.luker-abortion-and-the-politics]]; [[w.greenhouse-before-roe-v-wade]]. Names: Love, Lamm.'
        tags: [state:co, name:love-john-a, name:lamm-richard-d]
  - add:
      entry:
        id: cal.1967-05-02.black-nationalism-oakland
        when: May 2
        date: '1967-05-02'
        thread: black-nationalism
        also: [crime-and-hijacking]
        c: 'Sacramento. Armed Black Panthers from Oakland, some thirty, led by Seale, at the Capitol against Mulford''s bill to forbid carrying loaded guns in public; Seale reads the party''s "Executive Mandate Number One" on the steps; the group enters the Assembly''s chamber. Seale and others arrested.'
        n: 'A.B. 1591 (Mulford), 1967 Regular Session. [[w.bloom-black-against-empire]]; [[w.seale-seize-the-time]]; [[w.newton-revolutionary-suicide]]; [[w.winkler-gunfight]]. See [[cal.1966-10-15.black-nationalism]]. Names: Seale, Mulford. Check: the number and the arrests.'
        tags: [state:ca, city:oakland, name:seale-bobby, name:mulford-don]
  - add:
      entry:
        id: cal.1967-06-02.crime-and-hijacking-co
        when: June 2
        date: '1967-06-02'
        thread: crime-and-hijacking
        c: 'Cañon City, Colo. Luis José Monge, convicted of killing his wife and three of their children, executed in the State penitentiary''s gas chamber: the last execution in the United States until Jan. 1977.'
        n: '[Wikipedia, "Luis Monge"](https://en.wikipedia.org/wiki/Luis_Monge); Check: the Colorado Supreme Court''s affirmance. [[w.mandery-wild-justice]]. See [[cal.1967-04-12.crime-and-hijacking-ca]]. Names: Monge.'
        tags: [state:co, name:monge-luis-jose]
  - add:
      entry:
        id: cal.1967-06-05.states-and-cities-nm
        when: June 5
        date: '1967-06-05'
        thread: states-and-cities
        c: 'Tierra Amarilla, N.M. Tijerina''s Alianza raids the Rio Arriba County courthouse to free members arrested June 3 at Coyote, N.M., and arrest the district attorney; a jailer shot, a deputy hurt, two men taken. Lieutenant Governor Francis calls out the Guard; the largest manhunt in the State''s history. Tijerina taken days later.'
        n: '[Wikipedia, "Reies Tijerina"](https://en.wikipedia.org/wiki/Reies_Tijerina); Check: the State''s charges (54 counts) and the Guard''s order. [[w.nabokov-tijerina-and-the-courthouse]]; [[w.gardner-grito]]; [[w.peirce-mountain-states-of-america]]. Names: Tijerina, Francis. Check: whether Cargo was out of the State.'
        tags: [state:nm, name:tijerina-reies-lopez, name:francis-e-lee]
  - add:
      entry:
        id: cal.1967-06-15.health-ca
        when: June 15
        date: '1967-06-15'
        thread: health
        also: [women]
        c: 'Reagan signs Beilenson''s Therapeutic Abortion Act, [Cal. Stats. 1967, ch. 327](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1967/67Vol1_Chapters.pdf#page=1521): abortion in an accredited hospital, approved in advance by a committee of its medical staff, where continuing the pregnancy would "gravely impair the physical or mental health of the mother," or after rape or incest, the district attorney notified.'
        n: 'Statute, 1521–1523. [[w.luker-abortion-and-the-politics]]; [[w.garrow-liberty-and-sexuality]]; [[w.reagan-when-abortion-was-a]]; [[w.cannon-governor-reagan]]. See [[cal.1967-04-25.health-co]]. Names: Reagan, Beilenson.'
        tags: [state:ca, name:reagan-ronald, name:beilenson-anthony-c]
  - add:
      entry:
        id: cal.1967-07-01.states-and-cities-us
        when: July 1
        date: '1967-07-01'
        thread: states-and-cities
        also: [elections-1968]
        c: 'St. Louis. The Democratic Governors'' Conference: a statement of accord with Johnson on the peace in Vietnam, crime, and equality of opportunity; McKeithen and Maddox abstain. Johnson comes, briefs them in confidence, and signs the Older Americans Act Amendments before them.'
        n: '[Remarks to the Conference of Democratic Governors in St. Louis](https://www.presidency.ucsb.edu/documents/remarks-the-conference-democratic-governors-st-louis); [The President''s News Conference in St. Louis Following the Democratic Governors Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-st-louis-following-the-democratic-governors-conference) (July 1, 1967), Harold Hughes''s statement. [[w.sparacino-democratic-and-republican-governors]]; [[w.sabato-goodbye-to-good-time]]. See [[cal.1967-03-18.states-and-cities-us]]. Names: Johnson, Harold Hughes, McKeithen, Maddox.'
        tags: [name:johnson-lyndon-b, name:hughes-harold-e, name:mckeithen-john-j, name:maddox-lester, state:mo]
  - add:
      entry:
        id: cal.1967-07-06.conservation-or
        when: July 6
        date: '1967-07-06'
        thread: conservation
        c: 'Oregon. McCall signs the Beach Bill (H.B. 1601): the wet sand to sixteen feet above low tide the State''s; a public easement over the dry sand to the line of vegetation. Brought on by a Cannon Beach, Or., motel owner''s fencing of the dry sand, 1966.'
        n: 'Check: Or. Laws 1967. [Wikipedia, "Oregon Beach Bill"](https://en.wikipedia.org/wiki/Oregon_Beach_Bill). [[w.walth-fire-at-edens-gate]]; [[w.peirce-pacific-states-of-america]]. Names: McCall.'
        tags: [state:or, name:mccall-tom]
  - add:
      entry:
        id: cal.1967-07-28.crime-and-hijacking-ca
        when: July 28
        date: '1967-07-28'
        thread: crime-and-hijacking
        also: [black-nationalism]
        c: 'Reagan signs the Mulford Act, [Cal. Stats. 1967, ch. 960](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1967/67Vol2.PDF#page=604), an urgency statute: a loaded firearm carried in a public place or street of a city a misdemeanor; none on the Capitol''s grounds or at the residences of the governor and the legislators.'
        n: 'Statute, 2459–2462. Passed the Senate, 29–7, and the Assembly, 62–9 (Check against the *Journals*). See [[cal.1967-05-02.black-nationalism-oakland]]. Names: Reagan, Mulford.'
        tags: [state:ca, name:reagan-ronald, name:mulford-don]
  - add:
      entry:
        id: cal.1967-07-29.state-and-city-finance-ca
        when: July 29
        date: '1967-07-29'
        thread: state-and-city-finance
        c: 'Reagan signs the tax bill, S.B. 556, [Cal. Stats. 1967, ch. 963](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1967/67Vol2.PDF#page=616): the State''s sales tax from 3 to 4 percent, Aug. 1; the personal income tax rates from 1 to 10 percent, the top over $14,000 of taxable income; other taxes raised. An urgency statute.'
        n: 'Statute, 2471, 2479. Check: the yield (about $940 million in Cannon). [[w.cannon-governor-reagan]]; [[w.groot-selling-ronald-reagan]]. See [[cal.1967-01-05.governors-ca]]. Names: Reagan.'
        tags: [state:ca, name:reagan-ronald]
  - add:
      entry:
        id: cal.1967-09-02.health-ca
        when: Sept. 2
        date: '1967-09-02'
        thread: health
        c: 'Reagan signs the Lanterman-Petris-Short Act, [Cal. Stats. 1967, ch. 1667](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1967/67Vol3_Chapters.pdf#page=185), rewriting the State''s law of mental health services and involuntary commitment: holds for evaluation and short treatment in place of indefinite commitment; conservatorship for the gravely disabled. In force July 1, 1969 (Check).'
        n: 'Statute, 4053. [[w.grob-from-asylum-to-community]]; [[w.grob-dilemma-of-federal-mental]]; [[w.cannon-governor-reagan]]. Names: Reagan. Check: the periods of the holds.'
        tags: [state:ca, name:reagan-ronald]
  - add:
      entry:
        id: cal.1967-09-19.mayors-san-diego
        when: Sept. 19
        date: '1967-09-19'
        thread: mayors
        also: [elections-1967]
        c: 'San Diego''s primary for mayor. Curran, the mayor, 52,355, 47.2 percent; Hitch, once of the City Council, 36,060, 32.5; Clayton 10.2; four others. A runoff.'
        n: 'Votes: [City Clerk, *Election History: Mayor*](https://www.sandiego.gov/sites/default/files/legacy/city-clerk/pdf/mayorresults.pdf). See [[cal.1963-11-05.mayors-san-diego]]. Names: Curran, Hitch.'
        tags: [state:ca, city:san-diego, name:curran-frank, name:hitch-allen]
  - add:
      entry:
        id: cal.1967-10-16.states-and-cities-us
        when: Oct. 16–24
        date: '1967-10-16'
        thread: states-and-cities
        also: [vietnam, elections-1968]
        c: 'The National Governors'' Conference, its 59th meeting, aboard the *Independence*, New York to the Virgin Islands and back. Oct. 20: a resolution on non-defense spending and inflation tabled, 22–13; Rampton''s resolution "committed to the successful conclusion of the struggle" in Southeast Asia refused consideration, 26–18, three-fourths needed, the Republicans present all against but Rhodes. Volpe elected chairman.'
        n: '*Proceedings of the National Governors'' Conference, 1967*, [108–119](https://www.nga.org/wp-content/uploads/2021/03/1967NGAAnnualMeeting.pdf#page=121), 123. [[w.sabato-goodbye-to-good-time]]; [[w.sparacino-democratic-and-republican-governors]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1967-07-01.states-and-cities-us]]. Names: Rampton, Rhodes, Volpe. Check: the White House''s message to Price Daniel on the resolution, made public aboard (press accounts).'
        tags: [name:rampton-calvin-l, name:volpe-john-a, name:rhodes-james-a]
  - add:
      entry:
        id: cal.1967-10-28.black-nationalism-oakland
        when: Oct. 28
        date: '1967-10-28'
        thread: black-nationalism
        c: 'Oakland. Before dawn, a traffic stop: one policeman killed, another wounded; Newton wounded, charged with murder. "Free Huey" the party''s campaign.'
        n: 'Check: *People v. Newton*, 8 Cal. App. 3d 359 (1970), the appeal. [[w.bloom-black-against-empire]]; [[w.newton-revolutionary-suicide]]; [[w.self-american-babylon]]. See [[cal.1967-05-02.black-nationalism-oakland]]. Names: Newton.'
        tags: [state:ca, city:oakland, name:newton-huey-p]
  - add:
      entry:
        id: cal.1967-11-07.mayors-san-francisco
        when: Nov. 7
        date: '1967-11-07'
        thread: mayors
        also: [elections-1967]
        c: 'San Francisco. Alioto elected mayor, 110,405, 44.2 percent, over Dobbs, 94,504, 37.8, and Jack Morrison of the Board of Supervisors, 40,438, 16.2; fifteen others. Alioto entered after McAteer, the leading candidate, died in May; Shelley withdrew.'
        n: 'Votes: [Wikipedia, "1967 San Francisco mayoral election"](https://en.wikipedia.org/wiki/1967_San_Francisco_mayoral_election), from Our Campaigns; Check: the Registrar of Voters'' statement of the vote, and the dates of McAteer''s death and Shelley''s withdrawal. [[w.hartman-city-for-sale]]; [[w.peirce-pacific-states-of-america]]. See [[cal.1963-11-05.mayors-san-francisco]]. Names: Alioto, Dobbs, Morrison, McAteer, Shelley.'
        tags: [state:ca, city:san-francisco, name:alioto-joseph-l, name:dobbs-harold, name:morrison-jack, name:mcateer-j-eugene, name:shelley-john-f]
  - add:
      entry:
        id: cal.1967-11-07.state-constitutions-san-francisco
        when: Nov. 7
        date: '1967-11-07'
        thread: state-constitutions
        also: [war-opposition]
        c: 'San Francisco''s voters reject Proposition P, a declaration of policy for a cease-fire and the withdrawal of American troops from Vietnam, put on the ballot by the State Supreme Court''s order (Check the figures).'
        n: 'Check: *Farley v. Healey*, 67 Cal. 2d 325 (1967); the Registrar of Voters'' statement of the vote. [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]. See [[cal.1967-10-16.war-opposition]].'
        tags: [state:ca, city:san-francisco]
  - add:
      entry:
        id: cal.1967-11-07.mayors-san-diego
        when: Nov. 7
        date: '1967-11-07'
        thread: mayors
        also: [elections-1967]
        c: 'San Diego. Curran re-elected mayor over Hitch, 96,597 to 47,230, 67.2 percent.'
        n: 'Votes: [City Clerk, *Election History: Mayor*](https://www.sandiego.gov/sites/default/files/legacy/city-clerk/pdf/mayorresults.pdf). See [[cal.1967-09-19.mayors-san-diego]]. Names: Curran, Hitch.'
        tags: [state:ca, city:san-diego, name:curran-frank, name:hitch-allen]
  - add:
      entry:
        id: cal.1967-11-20.health-ca
        when: Nov. 20
        date: '1967-11-20'
        thread: health
        also: [welfare]
        c: '*Morris v. Williams*, 67 Cal. 2d 733: the Supreme Court of California holds unlawful the Health and Welfare Agency''s regulations cutting Medi-Cal''s services: physicians'' services restricted while the medically indigent stayed in the program; services cut out without showing that proportionate cuts could not be made. A class action brought by California Rural Legal Assistance.'
        n: '[Opinion](https://scocal.stanford.edu/opinion/morris-v-williams-32900) (SCOCAL). [[w.stevens-welfare-medicine-in-america]]; [[w.engel-poor-peoples-medicine]]; [[w.cannon-governor-reagan]]. See [[cal.1966-12.health-us]]. Check: the date of the regulations (Aug. 1967) and the sum restored.'
        tags: [state:ca]
  - add:
      entry:
        id: cal.1967-12-21.antisubversion-ca
        when: Dec. 21
        date: '1967-12-21'
        thread: antisubversion
        c: '*Vogel v. County of Los Angeles*, 68 Cal. 2d 18: the Supreme Court of California strikes the second paragraph of the public employee''s oath (the Levering Act''s, in the constitution since 1952), the disclaimer of membership in any party or organization advocating the overthrow of the government. The first paragraph, to support and defend the constitutions, stands.'
        n: '[Opinion](https://caselaw.findlaw.com/ca-supreme-court/1820877.html) (FindLaw). Check: the vote (6–1, Wikipedia). See [[cal.1962-11-06.antisubversion-ca]].'
        tags: [state:ca, city:los-angeles]
  - add:
      entry:
        id: cal.1967-12.court-us
        when: Dec.
        date: 1967-12
        thread: court
        also: [states-and-cities, legislatures]
        c: 'Dirksen''s drive for a convention on apportionment, at the year''s end: 32 legislatures have applied since 1963, by the Article V Library''s count; 34 needed. New in 1967: Colorado, Illinois, Indiana, North Dakota.'
        n: 'The applications in 113 Cong. Rec. 6384, 8004, 11,175, 18,007 (1967), as the [Article V Library](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0) lists them (Check each against the Record). [[w.bonfield-dirksen-amendment-and-the]]; [[w.macneil-dirksen]]. See [[cal.1966-12.court-us]]. Names: Dirksen.'
        tags: [name:dirksen-everett, state:co, state:il, state:in, state:nd]
