patch: 2026-11-12-b10-pilot-1962-10
by: 'Claude (batch 10, share 4: the foreign pilot, October 1962: the Presidium''s notes and resolutions, I and III; the AAPD 1962, III; Macmillan''s diaries, II; the DDF 1962 held is tome I, Jan.–June, nothing for October), Nov. 12, 2026; audited and corrected by the batch-10 auditor (Opus), Nov. 12, 2026'
ops:
# ---------------------------------------------------------------- USSR: Prezidium TsK KPSS, I and III
- add:
    entry:
      id: cal.1962-10-05.soviet-union
      when: Oct. 5
      date: '1962-10-05'
      thread: soviet-union
      c: 'Khrushchev, a note to the Presidium on his tour of Turkmenia, Tajikistan and Uzbekistan: a union production administration for Central Asia''s farming, chiefly cotton, best seated in Tashkent; the republics'' industry in one Central Asian sovnarkhoz; a Central Asian Bureau of the Central Committee, not elected but approved by the Presidium, the republics'' first secretaries among its members. The tour "как бы подготовкой к предстоящему Пленуму ЦК" (as it were a preparation for the coming Plenum of the Central Committee).'
      n: '*Zapiska Pervogo sekretarya TsK KPSS ... N. S. Khrushcheva v svyazi s ego poezdkoi v Tadzhikskuyu i Uzbekskuyu SSR*, Oct. 5, 1962 (RGANI, f. 3, op. 16, d. 158), sent to the members and candidates of the Presidium and the secretaries. [[w.prezidium-tsk-kpss-1954]], III, 326–34 (doc. 262.0.2; the Plenum, 334). Made public: 2008. Names: Khrushchev.'
      tags: [name:khrushchev-nikita-s, polity:ussr]
- add:
    entry:
      id: cal.1962-10-11.soviet-union
      when: Oct. 11
      date: '1962-10-11'
      thread: soviet-union
      also: [berlin-and-vienna]
      c: 'Khrushchev receives Max Reimann: West Germany; meat and milk short in the GDR; could Moscow help? Reimann, by his own word, without a mandate. Khrushchev: no promise, but Moscow will think about it.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 615 (Khrushchev to the Presidium, Oct. 12, of "yesterday"; the stenogram, f. 3, op. 16, d. 935). Made public: 2003. Names: Khrushchev, Reimann.'
      tags: [name:khrushchev-nikita-s, name:reimann-max, polity:ussr, polity:frg, polity:gdr]
- add:
    entry:
      id: cal.1962-10-12.soviet-union-2
      when: Oct. 12
      date: '1962-10-12'
      thread: soviet-union
      also: [berlin-and-vienna]
      c: 'The Presidium, stenographed, on Khrushchev''s report of his Central Asian tour and his notes of Sept. 29 and Oct. 5: the production administration for cotton and a Central Asian Bureau; Khrushchev against Gosplan''s officials; Dymshits for one sovnarkhoz. Approved: the Secretariat, with Gosplan and the five republics, to draft proposals. Plastics: more production, whole plants to be bought abroad. Gosplan and Foreign Trade to study more meat for the GDR.'
      n: 'Protocol 58, items I, III and IV. [[w.prezidium-tsk-kpss-1954]], I, 597–616 (doc. 262, the uncorrected stenogram); III, 318–19 (P 58/I), 334–35 (P 58/III, P 58/IV). See [[cal.1962-10-05.soviet-union]]. Made public: 2003. Names: Khrushchev, Dymshits.'
      tags: [name:dymshits-veniamin-e, name:khrushchev-nikita-s, polity:ussr, polity:gdr]
- add:
    entry:
      id: cal.1962-10-18.south-asia
      when: Oct. 18
      date: '1962-10-18'
      thread: south-asia
      also: [soviet-union, china]
      c: 'The Presidium, by poll, approves instructions to Benediktov, the Ambassador in New Delhi: to see Nehru alone and tell him in confidence that Moscow is deeply disturbed and disappointed by recent events; the McMahon line drawn by Britain and never recognized by China; Peking''s proposal of talks without preconditions constructive; a new withdrawal humiliating to China.'
      n: '*Ob ukazaniyakh sovposlu v Indii v svyazi s kitaisko-indiiskim pogranichnym konfliktom*, P 59/33, Oct. 18, 1962, and the instructions, drafted by the Foreign Ministry (Kuznetsov). [[w.prezidium-tsk-kpss-1954]], III, 335–39 (doc. 263.0; for: Kozlov, Kosygin, Polyansky, Suslov, Khrushchev, Shvernik); I, 1108 n.1 (the signed protocol of the session of Oct. 14 dated Oct. 18). See [[cal.1962-10-14.soviet-union]]. Made public: 2008. Names: Nehru, Benediktov.'
      tags: [name:benediktov-ivan-a, name:nehru-jawaharlal, polity:ussr, polity:india, polity:prc, polity:uk]
- add:
    entry:
      id: cal.1962-10-22.soviet-union-3
      when: Oct. 22
      date: '1962-10-22'
      thread: soviet-union
      also: [berlin-and-vienna]
      c: 'The Presidium, after Cuba, on Demichev''s report of the CPSU delegation in the GDR: the Ambassador better replaced by one who has their trust; their information wrong; Ulbricht to be answered on his planned reorganization of economic management: "в отношении Советов не разделяем, не возлагаем надежды" (on the councils, we do not share it, we place no hopes in them). The delegation''s work approved, by resolution of Oct. 23.'
      n: 'Protocol 60, item IV. [[w.prezidium-tsk-kpss-1954]], I, 619 (Malin''s notes); III, 351 (P 60/IV, Oct. 23). See [[cal.1962-10-22.soviet-union]]. Made public: 2003. Names: Ulbricht, Demichev.'
      tags: [name:demichev-pyotr-n, name:ulbricht-walter, polity:ussr, polity:gdr]
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-diplomacy
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis-diplomacy
      also: [soviet-union]
      c: 'Moscow. The Soviet government''s statement on Kennedy''s address: the quarantine piracy, a step toward a world thermonuclear war; Cuba''s arms for its defense; all foreign troops to come home; the Security Council to be called. Approved by the Presidium that day, for the press.'
      n: 'P 60/I, Oct. 23, 1962, item 1, and *Zayavlenie Sovetskogo pravitel''stva* (the revised draft). [[w.prezidium-tsk-kpss-1954]], III, 339–45 (341: "Соединенные Штаты Америки делают шаг на пути к развязыванию мировой термоядерной войны" (the United States is taking a step toward unleashing a world thermonuclear war)); I, 1109 n.3 (the editors: published Oct. 23; "но если агрессоры развяжут войну, то Советский Союз нанесет самый мощный ответный удар" (but if the aggressors unleash war, the Soviet Union will strike the most powerful return blow); the defensive arms to go if all foreign bases go). See [[cal.1962-10-22.soviet-union]]. Check: the volume prints the revised draft (III, 340 n.д); the text as published not read. Names: Kennedy.'
      tags: [name:kennedy-john-f, polity:ussr, polity:us, polity:cuba]
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-anadyr
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis-anadyr
      also: [cuba]
      c: 'Khrushchev to Castro, by cable to Alekseyev for delivery at once, with Kennedy''s letter: the address a gross interference in Cuba''s affairs and a brazen provocation against the Soviet Union; the Soviet military in Cuba ordered to take measures and be in full readiness. Approved by the Presidium.'
      n: 'P 60/I, Oct. 23, 1962, item 3. [[w.prezidium-tsk-kpss-1954]], III, 346–47 (doc. 264.0.3); I, 1110 n.7. Made public: 2003. Names: Khrushchev, Castro, Kennedy, Alekseyev.'
      tags: [name:alekseyev-aleksandr-i, name:khrushchev-nikita-s, name:castro-fidel, name:kennedy-john-f, polity:ussr, polity:cuba, polity:us]
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-diplomacy
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis-diplomacy
      also: [soviet-union]
      c: 'Khrushchev''s reply to U Thant, approved by the Presidium: "Заявляю Вам, что я согласен с Вашим предложением" (I declare that I agree with your proposal). The Foreign Ministry''s draft rejected as unfit; the reply to be published with U Thant''s appeal.'
      n: 'P 61/III, Oct. 25, 1962. [[w.prezidium-tsk-kpss-1954]], I, 620 (Malin''s notes: "Сказать кратко: «согласны с Вашим предложением»" (Say briefly: "we agree with your proposal")); I, 1111 n.4; III, 362–63 (the resolution and the reply). See [[cal.1962-10-24.missile-crisis-4]]. Names: Khrushchev, U Thant.'
      tags: [name:khrushchev-nikita-s, name:u-thant, polity:ussr]
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-quarantine
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis-quarantine
      c: 'Moscow''s note of protest to Washington, on Kuznetsov''s note of Oct. 24, approved by the Presidium by poll: on Oct. 24, from 1:30 to 6 a.m. Moscow time, American military aircraft buzzed the motor ship *Simferopol* three times on the high seas, at 23°30'' N, 62°56'' W, firing their cannon.'
      n: 'P 61/IV, Oct. 25, 1962, and the note''s draft. [[w.prezidium-tsk-kpss-1954]], III, 365–66 (doc. 265.4; the poll, 366 n.a). Names: Kuznetsov.'
      tags: [name:kuznetsov-vasily-v, polity:ussr, polity:us]
- add:
    entry:
      id: cal.1962-10-25.south-asia
      when: Oct. 25
      date: '1962-10-25'
      thread: south-asia
      also: [soviet-union, china]
      c: '*Pravda* prints an article in effect accepting the justice of China''s territorial claims against India (the editors'' account).'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 1107 n.3 (the editors: a step toward Peking in the Cuban crisis; Moscow went back to its neutral line later). To check: *Pravda*, Oct. 25, 1962, the article''s title and page (cited by [[w.prezidium-tsk-kpss-1954]], I, 1107 n.3). See [[cal.1962-10-18.south-asia]].'
      tags: [polity:ussr, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-27.soviet-union-2
      when: Oct. 27
      date: '1962-10-27'
      thread: soviet-union
      also: [missile-crisis]
      c: 'Moscow, the Presidium on further steps on Cuba, Khrushchev, Mikoyan, Malinovsky, Gromyko and others speaking. Malin''s notes: the Americans will hardly invade, but no one can vouch for it; no end to the conflict without satisfying the Americans and telling them the R-12s are there; with the base in Turkey and Pakistan liquidated besides, Moscow comes out the winner; inspection once the missiles are out. All for Khrushchev''s proposal. Pavlov''s proposal from Havana approved.'
      n: 'Protocol 62. [[w.prezidium-tsk-kpss-1954]], I, 622–23 (Malin''s notes: "Не сможем ликвидировать конфликта, если не дадим удовлетворения американцам и не скажем им, что наши ракеты Р-12 есть там" (We cannot liquidate the conflict unless we give the Americans satisfaction and tell them our R-12 missiles are there); "А если еще мы получим в придачу ликвидацию базы в Турции, Пакистане, то мы окажемся в выигрыше" (And if we also get the liquidation of the base in Turkey, Pakistan into the bargain, we shall come out the winners)); I, 1112 n.2 (the editors: "Pavlov" Alekseyev, Castro''s proposal to declare the missiles under Soviet control). Check: the volume''s other notes make "Pavlov" Pliyev (III, 367 n.г), and the cable of Oct. 27 "Товарищу ПАВЛОВУ" is addressed to Pliyev (III, 390, doc. 268.8.1). See [[cal.1962-10-27.soviet-union]]. Made public: 2003. Names: Khrushchev, Mikoyan, Malinovsky, Gromyko.'
      tags: [name:khrushchev-nikita-s, name:mikoyan-anastas, name:malinovsky-rodion-y, name:gromyko-andrei, polity:ussr, polity:us, polity:turkey, polity:pakistan, polity:cuba]
- add:
    entry:
      id: cal.1962-10-28.missile-crisis-anadyr
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis-anadyr
      also: [cuba]
      c: 'Khrushchev to Castro, dictated at the Presidium: "в такой кризисный, переломный момент не поддаваться чувству, проявить выдержку" (at such a critical turning point not to give way to feeling, to show restraint); no pretext for the Americans to wreck the settlement in sight: "Вчера вы сбили один из них" (Yesterday you shot one of them down).'
      n: 'Protocol 63, item V; P 63/V, Oct. 28, 1962, and the instructions to Alekseyev with the letter (f. 3, op. 18, d. 101, l. 17–18). [[w.prezidium-tsk-kpss-1954]], III, 386–87 (doc. 268.5.1); I, 624 (the letter dictated; its discussion not recorded); I, 1113 n.2. See [[cal.1962-10-28.soviet-union]]. Made public: 2003. Names: Khrushchev, Castro.'
      tags: [name:khrushchev-nikita-s, name:castro-fidel, polity:ussr, polity:cuba, polity:us]
- add:
    entry:
      id: cal.1962-10-28.missile-crisis-diplomacy
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis-diplomacy
      also: [soviet-union]
      c: 'Khrushchev to U Thant, approved by the Presidium: a copy of that day''s message to Kennedy; Kuznetsov sent to New York to help his talks with the Soviet, American and Cuban representatives.'
      n: 'P 63/II, Oct. 28, 1962. [[w.prezidium-tsk-kpss-1954]], III, 378–79 (doc. 268.2.1); I, 1113 n.4. See [[cal.1962-10-28.soviet-union]]. Names: Khrushchev, U Thant, Kennedy, Kuznetsov.'
      tags: [name:khrushchev-nikita-s, name:u-thant, name:kennedy-john-f, name:kuznetsov-vasily-v, polity:ussr, polity:us, polity:cuba]
# the Presidium's text of letters already entered
- cite:
    id: cal.1962-10-12.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 597 (Malin''s notes continued: Khrushchev on Yevtushenko, "Говорит с принципиальных позиций. О культе личности. М.б. доклад о культе личности сделать?" (He speaks from principled positions. On the cult of personality. Perhaps a report on the cult of personality?); not the decision, on 596)'
    units: '?'
- cite:
    id: cal.1962-10-23.missile-crisis-2
    item: '[[w.prezidium-tsk-kpss-1954]], III, 339–40, 345–46 (P 60/I, Oct. 23: the text approved, to go with the government''s statement through the American Ambassador; the letter: a "gross violation" of the UN Charter and of free navigation; the arms "exclusively" for defense; not its publication)'
    units: 'A, B'
- cite:
    id: cal.1962-10-24.missile-crisis-2
    item: '[[w.prezidium-tsk-kpss-1954]], III, 351–55 (P 61/8, Oct. 24, and the text, dictated by Khrushchev that day: "ultimatum" terms; the OAS without any authority; no instructions to Soviet captains to obey)'
    units: 'A, B, C'
- cite:
    id: cal.1962-10-26.missile-crisis
    item: '[[w.prezidium-tsk-kpss-1954]], III, 355–60 (P 61/I, Oct. 25, and the text dated Oct. 26, from Khrushchev''s dictation of Oct. 25: no invasion pledged, and the need for the arms falls away)'
    units: A
- cite:
    id: cal.1962-10-27.missile-crisis-2
    item: '[[w.prezidium-tsk-kpss-1954]], III, 367–73 (P 62/I and the text: the means called offensive out of Cuba, the like means out of Turkey; the Security Council''s agents to verify; of A, the terms but not the broadcast, which is in I, 623)'
    units: B
- cite:
    id: cal.1962-10-28.missile-crisis
    item: '[[w.prezidium-tsk-kpss-1954]], III, 374–78 (P 63/I and the text of the message: the arms called offensive to be dismantled, crated and returned to the Soviet Union; not the radio, nor Castro)'
    units: '?'
- cite:
    id: cal.1962-10-28.missile-crisis-3
    item: '[[w.prezidium-tsk-kpss-1954]], III, 379–80 (P 63/III, Oct. 28, and the draft, cabled to Dobrynin for Robert Kennedy: the bases in Turkey, as Robert Kennedy said, to be discussed in confidence through him and Dobrynin; not the day of delivery)'
    units: '?'
# ---------------------------------------------------------------- FRG: AAPD 1962, III
- add:
    entry:
      id: cal.1962-10-01.european-community
      when: Oct. 1
      date: '1962-10-01'
      thread: european-community
      also: [europe-and-the-alliance]
      c: 'Cadenabbia, 11 a.m. Adenauer receives Heath. Fanfani''s ideas of the Franco-German tie wrong; de Gaulle and he want the two peoples bound so close that no French government could go with Russia against Germany, nor a German one against France. On British entry he had spoken with de Gaulle once, last winter. German farming and textiles; the Common Market''s "bittere Früchte" (bitter fruits).'
      n: '*Gespräch des Bundeskanzlers Adenauer mit dem britischen Lordsiegelbewahrer Heath in Cadenabbia* (Kusterer''s record). [[w.akten-zur-auswartigen-politik]], III, 1571–74 (Dok. 368; present, Barth, Osterheld, Shuckburgh, Higgins). Names: Adenauer, Heath, Fanfani, de Gaulle.'
      tags: [name:adenauer-konrad, name:heath-edward-r-g, name:fanfani-amintore, name:de-gaulle-charles, polity:frg, polity:uk, polity:fr]
- add:
    entry:
      id: cal.1962-10-02.europe-and-the-alliance
      when: Oct. 2
      date: '1962-10-02'
      thread: europe-and-the-alliance
      also: [european-community]
      c: 'Cadenabbia, noon. Adenauer receives McGeorge Bundy with Dowling, the American Ambassador. America must lead; Khrushchev a convinced Communist; Soviet power grown enormously in ten years; Khrushchev afraid of America, and more of Red China; America should help Red China a little. De Gaulle''s reserve toward NATO, in confidence: put his generals under NATO and he would no longer have them in hand.'
      n: '*Gespräch des Bundeskanzlers Adenauer mit dem Sicherheitsberater des amerikanischen Präsidenten, Bundy, in Cadenabbia*. [[w.akten-zur-auswartigen-politik]], III, 1589–92 (Dok. 370; Kusterer''s record). Names: Adenauer, McGeorge Bundy, Dowling, Khrushchev, de Gaulle.'
      tags: [name:adenauer-konrad, name:bundy-mcgeorge, name:dowling-walter-c, name:khrushchev-nikita-s, name:de-gaulle-charles, polity:frg, polity:us, polity:fr, polity:prc]
- add:
    entry:
      id: cal.1962-10-05.berlin-and-vienna-2
      when: Oct. 5
      date: '1962-10-05'
      thread: berlin-and-vienna
      c: 'About an hour. Kennedy with Brandt, Knappstein, the German Ambassador, present. Civilian access: the "Westdeutschen und die West-Berliner" (West Germans and West Berliners) to bring concrete proposals now, the United States to make no more; formalities not to be met with a self-blockade that endangers Berlin''s "viability." And Bonn''s defense budget.'
      n: 'Knappstein to the Auswärtiges Amt, Fernschreiben Nr. 2946, Oct. 5, 1962, 10 p.m. [[w.akten-zur-auswartigen-politik]], III, 1629–31 (Dok. 377). To check: FRUS 1961–63, XV, 344–48 (cited by [[w.akten-zur-auswartigen-politik]], III, 1629 n.2). Names: Kennedy, Brandt, Knappstein.'
      tags: [name:kennedy-john-f, name:brandt-willy, name:knappstein-heinrich-k, polity:us, polity:frg]
- add:
    entry:
      id: cal.1962-10-10.berlin-and-vienna
      when: Oct. 10
      date: '1962-10-10'
      thread: berlin-and-vienna
      c: 'Schröder to Adenauer, by letter: a plebiscite in West Berlin, welcomed by Bundy and Kennedy, to be held when the East moves again, expected late November; the bill of April 1960 its basis; Brandt''s two questions, on the Western powers'' staying and West Berlin''s ties to the Federal Republic, likely to meet the Allies'' objections, the French''s above all.'
      n: '[[w.akten-zur-auswartigen-politik]], III, 1663–64 (Dok. 385). Names: Schröder, Adenauer, McGeorge Bundy, Kennedy, Brandt.'
      tags: [name:schroder-gerhard, name:adenauer-konrad, name:bundy-mcgeorge, name:kennedy-john-f, name:brandt-willy, polity:frg, polity:us, polity:fr]
- add:
    entry:
      id: cal.1962-10-12.berlin-and-vienna
      when: Oct. 12
      date: '1962-10-12'
      thread: berlin-and-vienna
      c: '5:45 p.m., Osterheld present. Dowling brings Adenauer an invitation to Washington for Nov. 7–8; accepted. Brandt "etwas viel geredet" (had talked rather much). Adenauer''s idea, to be kept secret: to propose to the Soviets "die Frage der deutschen Wiedervereinigung auf zehn Jahre hinauszuschieben" (to put off the question of German reunification for ten years), if the people in the Soviet zone could live decently and access to Berlin stayed free. Dowling: promising; one for the President.'
      n: '*Gespräch des Bundeskanzlers Adenauer mit dem amerikanischen Botschafter Dowling* (Weber''s record, Oct. 16). [[w.akten-zur-auswartigen-politik]], III, 1677–78 (Dok. 390; n.5: the "Burgfriedensplan," put to Smirnov on June 6). Names: Osterheld, Adenauer, Dowling, Brandt.'
      tags: [name:osterheld-horst, name:adenauer-konrad, name:dowling-walter-c, name:brandt-willy, polity:frg, polity:us, polity:ussr]
- add:
    entry:
      id: cal.1962-10-14.berlin-and-vienna
      when: Oct. 14
      date: '1962-10-14'
      thread: berlin-and-vienna
      c: 'Washington, an hour and three quarters. Rusk with Schröder: his talks with Gromyko in New York without progress; could the Soviets'' four-power arbitration body be made a four-power organ with real powers? Schröder: the access authority of nine members agreed in June still good. Rusk on nonproliferation: Red China comes first.'
      n: 'Schröder to the Auswärtiges Amt, Fernschreiben Nr. 3059, Oct. 15, 1962 (the talk "gestern"). [[w.akten-zur-auswartigen-politik]], III, 1694–95 (Dok. 394). Names: Rusk, Schröder, Gromyko.'
      tags: [name:rusk-dean, name:schroder-gerhard, name:gromyko-andrei, polity:us, polity:frg, polity:ussr, polity:prc]
- add:
    entry:
      id: cal.1962-10-17.berlin-and-vienna
      when: Oct. 17
      date: '1962-10-17'
      thread: berlin-and-vienna
      c: 'The White House, 10 a.m. Schröder with Kennedy, Bundy, Dowling and Salinger among those present: the Soviets may not mean to force the crisis by late November; a pass and visa requirement for civilian traffic would put land access in the Soviet zone''s hands, and must meet a hard reaction. Kennedy: civil and military access interdependent, but military access can go by air, the city''s supply cannot.'
      n: '*Gespräch des Bundesministers Schröder mit Präsident Kennedy in Washington*. [[w.akten-zur-auswartigen-politik]], III, 1717–19 (Dok. 399). Names: Schröder, Kennedy, McGeorge Bundy, Dowling, Salinger.'
      tags: [name:schroder-gerhard, name:kennedy-john-f, name:bundy-mcgeorge, name:dowling-walter-c, name:salinger-pierre, polity:frg, polity:us, polity:ussr, polity:gdr]
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-diplomacy-2
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis-diplomacy
      also: [europe-and-the-alliance]
      c: '5:45 to about 7 p.m. Acheson, with Dowling, briefs Adenauer: an air strike on the missile sites, 3,000 to 4,000 Russians killed; then the airfields and SAM sites, 10,000 to 15,000 Cubans; then a landing of 75,000 to 100,000; the President chose the blockade. Adenauer: unrest could be stirred up inside Cuba; no conflict if the West stands firm.'
      n: '*Gespräch des Bundeskanzlers Adenauer mit dem Sonderberater des amerikanischen Präsidenten, Acheson* (Weber''s record, Oct. 30). [[w.akten-zur-auswartigen-politik]], III, 1762–66 (Dok. 409). To check: FRUS 1961–63, American Republics; Cuba 1961–1962; Cuban Missile Crisis and Aftermath, Microfiche Supplement, doc. 378 (cited by [[w.akten-zur-auswartigen-politik]], III, 1762 n.2). See [[cal.1962-10-22.missile-crisis-22]]. Names: Acheson, Dowling, Adenauer.'
      tags: [name:acheson-dean-g, name:dowling-walter-c, name:adenauer-konrad, polity:us, polity:frg, polity:cuba, polity:ussr]
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-diplomacy-3
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis-diplomacy
      c: 'Adenauer to Kennedy, by letter: "aus voller Überzeugung" (from full conviction) for the President''s "große, umfassende Aktion" (great, comprehensive action) against the Soviet missile sites in Cuba.'
      n: '[[w.akten-zur-auswartigen-politik]], III, 1903 n.3. To check: [[w.adenauer-briefe-1961-1963]], 176 (cited by [[w.akten-zur-auswartigen-politik]], III, 1903 n.3). Names: Adenauer, Kennedy.'
      tags: [name:adenauer-konrad, name:kennedy-john-f, polity:frg, polity:us, polity:cuba]
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-diplomacy
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis-diplomacy
      also: [berlin-and-vienna]
      c: 'Schröder''s office, 3 p.m. Smirnov, the Soviet Ambassador, hands Schröder his government''s statement and asks Bonn to condemn the American aggression and use its influence with its allies. Schröder: the evidence shows Cuba made an offensive base, missiles of 1,800 to 3,700 km; peace threatened in Berlin too, where the Soviets are leaving the four powers'' footing.'
      n: '*Gespräch des Bundesministers Schröder mit dem sowjetischen Botschafter Smirnow* (Reinkemeyer present). [[w.akten-zur-auswartigen-politik]], III, 1782–84 (Dok. 415). See [[cal.1962-10-23.missile-crisis-diplomacy]]. Names: Smirnov, Schröder. Check: the record has the statement "vom 24. Oktober"; the editors, of Oct. 23 (1782 n.3).'
      tags: [name:smirnov-andrei-a, name:schroder-gerhard, polity:frg, polity:ussr, polity:us, polity:cuba]
- add:
    entry:
      id: cal.1962-10-28.missile-crisis-diplomacy-2
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis-diplomacy
      also: [europe-and-the-alliance]
      c: 'Rhöndorf, 11:30 a.m. to 1:15 p.m., Globke present. Dowling brings Adenauer Kennedy''s answer to Khrushchev and asks his view: the United States may soon have to bomb the sites or invade, within twenty-four hours, he expects. Adenauer: "er sei für beide Maßnahmen; die Basen müßten weg" (he was for both measures; the bases must go), for an invasion too; more pressure on Castro, an ultimatum of twenty-four hours. Bonn''s man at NATO to be instructed so.'
      n: '*Gespräch des Bundeskanzlers Adenauer mit dem amerikanischen Botschafter Dowling in Rhöndorf*. [[w.akten-zur-auswartigen-politik]], III, 1799–1803 (Dok. 419). See [[cal.1962-10-23.missile-crisis-diplomacy-2]]. Names: Globke, Dowling, Adenauer, Kennedy, Khrushchev, Castro.'
      tags: [name:globke-hans, name:dowling-walter-c, name:adenauer-konrad, name:kennedy-john-f, name:khrushchev-nikita-s, name:castro-fidel, polity:frg, polity:us, polity:cuba, polity:ussr]
- add:
    entry:
      id: cal.1962-10-10.europe-and-the-alliance
      when: Oct. 10
      date: '1962-10-10'
      thread: europe-and-the-alliance
      c: '*Der Spiegel*, no. 41: "Bedingt abwehrbereit" (Conditionally ready for defense), by Ahlers, on General Foertsch and the Bundeswehr, pp. 32–53.'
      n: '[[w.akten-zur-auswartigen-politik]], III, 1766 (Dok. 410, n.2, n.3: the article; the Foreign Office''s note of Oct. 23, that it rests in part on accurate secret information). Names: Ahlers, Foertsch.'
      tags: [name:foertsch-friedrich, name:ahlers-conrad, polity:frg]
- add:
    entry:
      id: cal.1962-10-26.europe-and-the-alliance
      when: Oct. 26
      date: '1962-10-26'
      thread: europe-and-the-alliance
      c: '*Der Spiegel*''s offices searched under the Federal Court''s orders; several of its staff provisionally arrested.'
      n: '[[w.akten-zur-auswartigen-politik]], III, 1768 n.11 (the Federal Prosecutor''s application of Oct. 22; the warrants of Oct. 23 against Augstein and Ahlers; Augstein gives himself up Oct. 27; Ahlers held in Spain). See [[cal.1962-10-10.europe-and-the-alliance]].'
      tags: [polity:frg]
- add:
    entry:
      id: cal.1962-10-31.europe-and-the-alliance-2
      when: Oct. 31
      date: '1962-10-31'
      thread: europe-and-the-alliance
      c: 'Bonn, the morning. Stammberger, a federal minister, hands Adenauer his request for dismissal: he was not told of the action against *Der Spiegel*.'
      n: '[[w.akten-zur-auswartigen-politik]], III, 1821 n.4 (Dohms''s chronology of Nov. 5: the complaint in the Cabinet, Oct. 29; in public, Oct. 30; the request withdrawn Nov. 5). See [[cal.1962-10-26.europe-and-the-alliance]]. Names: Adenauer, Stammberger.'
      tags: [name:stammberger-wolfgang, name:adenauer-konrad, polity:frg]
- add:
    entry:
      id: cal.1962-10-31.europe-and-the-alliance-3
      when: Oct. 31
      date: '1962-10-31'
      thread: europe-and-the-alliance
      c: 'Bonn, the Cabinet all day, with long breaks; from 6:30 p.m. without the FDP''s ministers. The social package passed all the same (continued pay in sickness, sickness insurance, child allowances), eleven CDU/CSU ministers a quorum. The FDP''s parliamentary executive asks the dismissal of Hopf and Strauß, the state secretaries.'
      n: 'Carstens to Schröder at Entebbe, Fernschreiben Nr. 21, Oct. 31, 1962, 9 p.m.: "Hier ist eine ernste Regierungskrise ausgebrochen" (a serious government crisis has broken out here). [[w.akten-zur-auswartigen-politik]], III, 1821 (Dok. 427; n.5, the FDP''s demand, refused Nov. 2; n.6, the Cabinet''s decision). To check: *Kabinettsprotokolle* 1962, 490–92 (cited by [[w.akten-zur-auswartigen-politik]], III, 1821 n.6). See [[cal.1962-10-31.europe-and-the-alliance-2]]. Names: Hopf, Strauss.'
      tags: [name:hopf-volkmar, name:strauss-walter, polity:frg]
- add:
    entry:
      id: cal.1962-10-30.south-asia
      when: Oct. 30
      date: '1962-10-30'
      thread: south-asia
      also: [china]
      c: '11 a.m. Adenauer receives Mrs. Pandit. She thanks him for Bonn''s full support; the Chinese aggression an attack on India''s way of life: if Indian democracy fails, communism Asia''s only alternative. Adenauer: Khrushchev may not mind China turning on India.'
      n: '*Gespräch des Bundeskanzlers Adenauer mit der indischen Gouverneurin Pandit*. [[w.akten-zur-auswartigen-politik]], III, 1807–08 (Dok. 422). Names: Adenauer, Pandit, Khrushchev.'
      tags: [name:adenauer-konrad, name:pandit-vijaya-l, name:khrushchev-nikita-s, polity:frg, polity:india, polity:prc, polity:ussr]
- add:
    entry:
      id: cal.1962-10-30.berlin-and-vienna
      when: Oct. 30
      date: '1962-10-30'
      thread: berlin-and-vienna
      also: [soviet-union]
      c: 'Moscow. Brezhnev, Chairman of the Supreme Soviet''s Presidium, takes Groepper''s credentials. Brezhnev: relations to be normalized quickly, so a peace treaty with both German states. Groepper: only with a reunited Germany.'
      n: 'Groepper''s record, Oct. 31, 1962 (Semenov and Scholl present). [[w.akten-zur-auswartigen-politik]], III, 1817–18 (Dok. 426). Names: Brezhnev, Groepper.'
      tags: [name:brezhnev-leonid, name:groepper-horst, polity:ussr, polity:frg, polity:gdr]
# ---------------------------------------------------------------- UK: The Macmillan Diaries, II
- add:
    entry:
      id: cal.1962-10-03.europe-and-the-alliance
      when: Oct. 3
      date: '1962-10-03'
      thread: europe-and-the-alliance
      c: 'The one-day railway strike. The *Daily Mail* and *Daily Express* urge Marples''s resignation or dismissal for his television effort of Oct. 2, against Greene of the NUR, to have it called off; he had not told Macmillan. Macmillan: "I must support him"; Marples told to keep quiet.'
      n: '[[w.macmillan-diaries]], 501–02. Names: Macmillan, Marples, Greene.'
      tags: [name:marples-ernest, name:greene-sidney-f, name:macmillan-harold, polity:uk]
- add:
    entry:
      id: cal.1962-10-04.europe-and-the-alliance
      when: Oct. 4
      date: '1962-10-04'
      thread: europe-and-the-alliance
      also: [european-community]
      c: '6:30 p.m. to 1:30 a.m. Macmillan with Macleod, the Chief Whip, Butler and Heath, over supper: an immediate election weighed, on Gaitskell''s Brighton speech. Not enough to justify it: "we must — I feel — go forward."'
      n: '[[w.macmillan-diaries]], 503. See [[cal.1962-10-03.european-community]]. Names: Macmillan, Macleod, Butler, Heath, Gaitskell.'
      tags: [name:macmillan-harold, name:macleod-iain-n, name:butler-richard-a, name:heath-edward-r-g, name:gaitskell-hugh, polity:uk]
- add:
    entry:
      id: cal.1962-10-04.european-community
      when: Oct. 4
      date: '1962-10-04'
      thread: european-community
      c: 'Chandos and Lennox-Boyd warn Macmillan of the trouble the "sovereignty" argument will cause in the Conservative Party: "It is being put about that I am determined to abandon the Queen and promote a federal Europe."'
      n: '[[w.macmillan-diaries]], 503. Names: Lennox-Boyd, Macmillan, Chandos.'
      tags: [name:chandos-oliver, name:lennox-boyd-alan-t, name:macmillan-harold, polity:uk]
- add:
    entry:
      id: cal.1962-10-11.european-community
      when: Oct. 11
      date: '1962-10-11'
      thread: european-community
      c: 'The Conservative conference rejects the Turton/Walker-Smith amendment on the Common Market, "only 50 or so out of 400 voting for it." Butler and Heath speak.'
      n: '[[w.macmillan-diaries]], 505 (the news at lunchtime, the count Macmillan''s). See [[cal.1962-10-04.european-community]]. Names: Butler, Heath, Turton, Walker-Smith.'
      tags: [name:turton-robin, name:walker-smith-derek-c, name:butler-richard-a, name:heath-edward-r-g, polity:uk]
- add:
    entry:
      id: cal.1962-10-20.european-community
      when: Oct. 20
      date: '1962-10-20'
      thread: european-community
      c: 'Macmillan with Heath, "harassed, but not depressed": his five hours with Couve de Murville, "going over the ground," no firm positions. France cannot now openly oppose British entry, or be seen to ask quite impossible terms.'
      n: '[[w.macmillan-diaries]], 508. Names: Macmillan, Heath, Couve de Murville. Check: the day of the talk with Couve de Murville.'
      tags: [name:macmillan-harold, name:heath-edward-r-g, name:couve-de-murville-maurice, polity:uk, polity:fr]
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-diplomacy-2
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-diplomacy
      c: 'London, after the text of Kennedy''s speech arrives about 5 p.m. Macmillan and Home draft the reply: support in preventing the Russians'' "new act of aggression," with points for thought. A first draft, advising him to seize Cuba, dropped.'
      n: '[[w.macmillan-diaries]], 509 (the "Suez analogy"; the fear of a trade of the Cuban rockets for Turkish or Italian bases, or of Berlin for Cuba). See [[cal.1962-10-22.missile-crisis-16]]. Names: Macmillan, Douglas-Home, Kennedy.'
      tags: [name:macmillan-harold, name:douglas-home-alec, name:kennedy-john-f, polity:uk, polity:us, polity:cuba, polity:ussr]
- add:
    entry:
      id: cal.1962-10-22.europe-and-the-alliance
      when: Oct. 22
      date: '1962-10-22'
      thread: europe-and-the-alliance
      also: [missile-crisis]
      c: 'London, 8 to 11 p.m., Macmillan''s dinner for Norstad. Washington is urging a NATO alert: for Britain a Royal Proclamation and the reservists called up. Macmillan: "we wd not repeat not agree at this stage"; mobilization had sometimes caused war. Norstad agrees.'
      n: '[[w.macmillan-diaries]], 510. Names: Macmillan, Norstad.'
      tags: [name:macmillan-harold, name:norstad-lauris, polity:uk, polity:us]
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-diplomacy-3
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-diplomacy
      c: 'London. Macmillan takes Gaitskell, a guest at the Norstad dinner, to the Cabinet room and shows him the documents and the President''s speech. Gaitskell: his party "would not like it."'
      n: '[[w.macmillan-diaries]], 510. See [[cal.1962-10-22.europe-and-the-alliance]]. Names: Macmillan, Gaitskell.'
      tags: [name:macmillan-harold, name:gaitskell-hugh, polity:uk]
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-diplomacy-4
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis-diplomacy
      c: 'The Cabinet, 10:30 a.m. to 1 p.m. Macmillan on Cuba, the documents read aloud, not circulated. Ministers "rather shaken, but satisfied."'
      n: '[[w.macmillan-diaries]], 510. Names: Macmillan.'
      tags: [name:macmillan-harold, polity:uk]
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-diplomacy-5
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis-diplomacy
      c: 'London, late into the night. Macmillan''s messages, each drafted apart, to de Gaulle, Adenauer and Fanfani; to Diefenbaker, Menzies and Holyoake; to Nehru and Ayub; and to Nehru a personal one on his war with China.'
      n: '[[w.macmillan-diaries]], 511 (Canada "has already got cold feet"; India given ammunition and light arms). Names: Macmillan, de Gaulle, Adenauer, Fanfani, Diefenbaker, Menzies, Holyoake, Nehru, Ayub Khan.'
      tags: [name:macmillan-harold, name:de-gaulle-charles, name:adenauer-konrad, name:fanfani-amintore, name:diefenbaker-john-g, name:menzies-robert-g, name:holyoake-keith, name:nehru-jawaharlal, name:ayub-khan-mohammad, polity:uk, polity:fr, polity:frg, polity:italy, polity:canada, polity:australia, polity:nz, polity:india, polity:pakistan, polity:prc]
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-diplomacy
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis-diplomacy
      c: 'Kennedy and Macmillan by telephone, 11 p.m. London, Home and Caccia with Macmillan. Kennedy: "Should he take out Cuba." Macmillan to think and answer. U Thant''s intervention "giving the show away": Khrushchev could accept an unpoliced truce, Kennedy could not.'
      n: '[[w.macmillan-diaries]], 511–12. See [[cal.1962-10-24.missile-crisis-4]]. Names: Kennedy, Macmillan, Douglas-Home, Caccia, U Thant, Khrushchev.'
      tags: [name:kennedy-john-f, name:macmillan-harold, name:douglas-home-alec, name:caccia-harold-a, name:u-thant, name:khrushchev-nikita-s, polity:uk, polity:us, polity:cuba]
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-diplomacy-2
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis-diplomacy
      c: 'The House of Commons. Macmillan''s statement on Cuba, with new points on U Thant''s move; well received on all sides. Gaitskell, asking ten questions, "most damaging about ''consultation''"; Wade and Shinwell.'
      n: '[[w.macmillan-diaries]], 512 (the statement finished with Home and Caccia at 9:30 a.m.; the House met at 11). To check: H.C. Deb., Oct. 25, 1962 (Hansard). Names: Macmillan, Gaitskell, Shinwell, U Thant, Wade.'
      tags: [name:wade-donald, name:macmillan-harold, name:gaitskell-hugh, name:shinwell-emanuel, name:u-thant, polity:uk]
- add:
    entry:
      id: cal.1962-10-25.europe-and-the-alliance
      when: Oct. 25
      date: '1962-10-25'
      thread: europe-and-the-alliance
      c: 'The Cabinet, 2:45 to 5:15 p.m., on the Home Secretary''s committee''s papers on "the future pattern of Britain": industrial location, housing, offices, transport. The "Liberal" survivors (Erroll, the Lord Chancellor, the Minister of Health) against the "Dirigists" (Brooke, Keith Joseph, the Secretary of State for Scotland). Macmillan''s summing up put off to Monday. Cuba left to him and Home; railway wages, Beeching and the unions.'
      n: '[[w.macmillan-diaries]], 512 (n.98: the Cabinet Committee on Population and Employment). Names: Macmillan, Douglas-Home, Erroll, Brooke, Joseph, Beeching.'
      tags: [name:erroll-frederick-j, name:brooke-henry, name:joseph-keith-s, name:beeching-richard, name:macmillan-harold, name:douglas-home-alec, polity:uk]
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-diplomacy-3
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis-diplomacy
      c: 'Kennedy and Macmillan by telephone, 11 p.m. London: U Thant''s "cease fire" accepted by the Russians; Kennedy''s answer, Stevenson to discuss it with U Thant, "very ingenious"; fourteen ships turned round, one tanker let through. No end to the blockade on the Russians'' unsupported word.'
      n: '[[w.macmillan-diaries]], 512–13. See [[cal.1962-10-25.missile-crisis-4]]. Names: Kennedy, Macmillan, U Thant, Stevenson.'
      tags: [name:kennedy-john-f, name:macmillan-harold, name:u-thant, name:stevenson-adlai-e, polity:uk, polity:us, polity:ussr]
- add:
    entry:
      id: cal.1962-10-26.europe-and-the-alliance-2
      when: Oct. 26
      date: '1962-10-26'
      thread: europe-and-the-alliance
      c: 'Noon. Macmillan and Maudling, the Chancellor of the Exchequer, settle their scheme: changes in investment allowances; purchase tax on motor cars cut at once from 45 to 25 percent.'
      n: '[[w.macmillan-diaries]], 513. See [[cal.1962-10-18.europe-and-the-alliance-2]]. Names: Macmillan, Maudling.'
      tags: [name:macmillan-harold, name:maudling-reginald, polity:uk]
- add:
    entry:
      id: cal.1962-10-28.missile-crisis-diplomacy-3
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis-diplomacy
      c: 'London, noon. Macmillan to Khrushchev, Butler, Home, Thorneycroft and Heath agreeing: the missiles to be taken out of Cuba, as the Americans demand; then to more constructive work, disarmament and the like. Sent through diplomatic channels; Moscow''s climb-down came by radio as they finished lunch.'
      n: '[[w.macmillan-diaries]], 513–14. See [[cal.1962-10-28.missile-crisis]]. Names: Macmillan, Khrushchev, Butler, Douglas-Home, Thorneycroft, Heath.'
      tags: [name:macmillan-harold, name:khrushchev-nikita-s, name:butler-richard-a, name:douglas-home-alec, name:thorneycroft-peter, name:heath-edward-r-g, polity:uk, polity:ussr, polity:us, polity:cuba]
- cite:
    id: cal.1962-10-22.missile-crisis-16
    item: '[[w.macmillan-diaries]], 508 (Bruce calls at noon with "a long letter from President Kennedy, as well as a great dossier" on the missiles, "contrary to specific assurances given by the Russian Govt and by Gromyko in particular"; not the cable''s hour, the word "incontrovertible" or the day of Gromyko''s assurances)'
    units: '?'
- cite:
    id: cal.1962-10-22.missile-crisis-23
    item: '[[w.macmillan-diaries]], 510 (the call at 7:30 p.m. Washington, 11:30 p.m. GMT, the broadcast just over: Kennedy "rather excited, but very clear," grateful for the messages; forces built up for a coup de main to seize Cuba "shd that become necessary"; nothing of Berlin, the summit or World War III)'
    units: '?'
- cite:
    id: cal.1962-10-03.european-community
    item: '[[w.macmillan-diaries]], 505 (the Conservative conference rejects the Turton/Walker-Smith amendment, the news reaching Macmillan Oct. 11; not the place)'
    units: '?'
# ---------------------------------------------------------------- the auditor's additions (missed by the reader)
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-diplomacy-4
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis-diplomacy
      also: [soviet-union]
      c: 'The Presidium''s instructions to Zorin on the Ghana–UAR draft in the Security Council: abstain if it will pass without the Soviet vote, else vote for it; in explaining the vote, call the resolution insufficient. Mikoyan, in the discussion, for voting "for."'
      n: 'P 61/II, Oct. 25, 1962, and the instructions. [[w.prezidium-tsk-kpss-1954]], III, 360–61 (docs. 265.2, 265.2.1); I, 620 (Malin''s notes: Mikoyan; "Т. Зорин правильно предлагает" (Comrade Zorin proposes rightly)). See [[cal.1962-10-25.missile-crisis]]. Made public: 2003. Names: Zorin, Mikoyan.'
      tags: [name:zorin-valerian, name:mikoyan-anastas, polity:ussr, polity:ghana, polity:uar]
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-anadyr
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis-anadyr
      also: [soviet-union]
      c: 'Moscow to Pliyev ("Pavlov"), by cipher cable over "Director": "применять ядерное оружие из ракет, ФКР, Луна и с самолетов без санкции из Москвы запрещается" (the use of nuclear weapons from missiles, cruise missiles, Lunas and aircraft without Moscow''s sanction is forbidden), "categorically" confirmed.'
      n: 'APRF, f. 3, op. 65, d. 906, l. 2 (a copy), approved with Pavlov''s instructions by P 63/IX, Oct. 28. [[w.prezidium-tsk-kpss-1954]], III, 390 (doc. 268.8.1); I, 1112 n.3 (the editors: after the U-2 was shot down, Khrushchev''s cable to Pliyev forbidding the missiles'' use). See [[cal.1962-10-27.soviet-union]]. Made public: 2008. Names: Pliyev.'
      tags: [name:pliyev-issa-a, polity:ussr, polity:cuba]
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-diplomacy-4
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-diplomacy
      also: [europe-and-the-alliance]
      c: 'Dowling briefs Adenauer in advance on the President''s measures against the Soviet missile sites in Cuba, with the text of the address and the CIA''s intelligence memorandum of Oct. 21.'
      n: '[[w.akten-zur-auswartigen-politik]], III, 1764 n.9 (with Knappstein to the Auswärtiges Amt, Drahtbericht Nr. 3151, Oct. 22: his thanks to Tyler for the advance briefing). To check: the letters of Kennedy and Adenauer, Oct. 22–23, [[w.adenauer-briefe-1961-1963]], 175–76, 453 (cited by [[w.akten-zur-auswartigen-politik]], III, 1765 n.9). See [[cal.1962-10-22.missile-crisis-22]]. Names: Dowling, Adenauer.'
      tags: [name:dowling-walter-c, name:adenauer-konrad, polity:us, polity:frg, polity:cuba, polity:ussr]
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-diplomacy-2
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis-diplomacy
      also: [europe-and-the-alliance]
      c: 'Adenauer to Steel, the British Ambassador, of his briefing by Dowling "und einem Herrn Smith von der CIA" (and a Mr. Smith of the CIA): "sehr beeindruckt von der großen Gefahr" (much impressed by the great danger) the United States was in; he could not see how it went unnoticed so long; Khrushchev wanted no "Fischereigeschäft" (fishing business) with Castro.'
      n: '[[w.akten-zur-auswartigen-politik]], III, 1765 n.9 (the editors'' quotation). To check: the record, Stiftung Bundeskanzler-Adenauer-Haus, Bestand III/61 (cited by [[w.akten-zur-auswartigen-politik]], III, 1765 n.9). See [[cal.1962-10-22.missile-crisis-diplomacy-4]]. Names: Adenauer, Steel, Dowling, Khrushchev, Castro.'
      tags: [name:adenauer-konrad, name:steel-christopher-e, name:dowling-walter-c, name:khrushchev-nikita-s, name:castro-fidel, polity:frg, polity:uk, polity:us, polity:cuba]
- add:
    entry:
      id: cal.1962-10-15.berlin-and-vienna
      when: Oct. 15
      date: '1962-10-15'
      thread: berlin-and-vienna
      c: 'Washington, the afternoon, nearly two and a half hours. Schröder with Rusk, Tyler, Hillenbrand, Thompson and Dowling: the Soviets have not settled their next steps; Khrushchev''s war of nerves; Berlin no war to him unless his prestige is gravely engaged. Rusk: not sure Khrushchev knows the West will fight; he will reopen talks after the American elections, insisting on West Berlin and the separate treaty.'
      n: 'Schröder to the Auswärtiges Amt, Fernschreiben Nr. 3070, Oct. 16, 1962, 6:40 p.m. (the talk "gestern"). [[w.akten-zur-auswartigen-politik]], III, 1712–14 (Dok. 398). See [[cal.1962-10-14.berlin-and-vienna]]. Names: Schröder, Rusk, Tyler, Thompson, Dowling, Khrushchev.'
      tags: [name:schroder-gerhard, name:rusk-dean, name:tyler-william-r, name:thompson-llewellyn-e, name:dowling-walter-c, name:khrushchev-nikita-s, polity:frg, polity:us, polity:ussr]
- add:
    entry:
      id: cal.1962-10-16.europe-and-the-alliance
      when: Oct. 16
      date: '1962-10-16'
      thread: europe-and-the-alliance
      also: [berlin-and-vienna]
      c: 'Washington, about an hour and a half, Taylor joining at the end. Schröder with McNamara: McNamara on his German tour, the forces'' readiness high but too dependent on nuclear war, a massive Soviet aggression the least likely case. Schröder: Khrushchev must see men ready, if need be, to fight a nuclear war; conventional forces needed as well.'
      n: 'Schröder to the Auswärtiges Amt, Fernschreiben Nr. 3086, Oct. 17, 1962, 10 a.m. (the visit "gestriger"). [[w.akten-zur-auswartigen-politik]], III, 1728 (Dok. 400). Names: Schröder, McNamara, Khrushchev.'
      tags: [name:schroder-gerhard, name:mcnamara-robert-s, name:khrushchev-nikita-s, polity:frg, polity:us]
- add:
    entry:
      id: cal.1962-10-16.middle-east
      when: Oct. 16
      date: '1962-10-16'
      thread: middle-east
      c: '4:30 to about 5 p.m. Adenauer receives Istuany, the Syrian Ambassador, at his request: the Cabinet''s decision of the week before misread; Bonn for going on with the talks on the Euphrates dam, a World Bank director''s opinion on the water first; Syria''s Cabinet decision, if the press has it right, rather hasty.'
      n: 'The record, Stiftung Bundeskanzler-Adenauer-Haus, Bestand III/78. [[w.akten-zur-auswartigen-politik]], III, 1708–09, 1712 (Dok. 397). Names: Adenauer.'
      tags: [name:adenauer-konrad, polity:frg, polity:syria]
- add:
    entry:
      id: cal.1962-10-23.european-community
      when: Oct. 23
      date: '1962-10-23'
      thread: european-community
      also: [missile-crisis-diplomacy]
      c: 'Brussels, the EEC''s foreign ministers in consultation, Piccioni in the chair. Cuba first: understanding for the American stand; firmness against the Soviet threat. Schröder on his talks with Kennedy and Rusk; in the afternoon, on Bonn''s recognition of the new government in Yemen, Piccioni and the French minister favorable, Paris to wait.'
      n: 'Jansen''s circular of Oct. 24, 1962, Fernschreiben Nr. 3674 Plurex, sent Oct. 25. [[w.akten-zur-auswartigen-politik]], III, 1779 (Dok. 414). See [[cal.1962-10-17.berlin-and-vienna]]. Names: Piccioni, Schröder, Kennedy, Rusk.'
      tags: [name:piccioni-attilio, name:schroder-gerhard, name:kennedy-john-f, name:rusk-dean, polity:frg, polity:italy, polity:fr, polity:us, polity:ussr, polity:yemen]
- add:
    entry:
      id: cal.1962-10-03.europe-and-the-alliance-2
      when: Oct. 3
      date: '1962-10-03'
      thread: europe-and-the-alliance
      also: [cuba]
      c: 'Home at supper with Macmillan, to report on New York and Washington. Macmillan: "The Russians are clearly using Cuba as a counter-irritant to Berlin"; the President angry with Britain for not joining a boycott or blockade, British shipping not to be ordered off Cuba without legislation; and for not boycotting Congolese copper.'
      n: '[[w.macmillan-diaries]], 502. See [[cal.1962-10-03.europe-and-the-alliance]]. Names: Douglas-Home, Macmillan, Kennedy.'
      tags: [name:douglas-home-alec, name:macmillan-harold, name:kennedy-john-f, polity:uk, polity:us, polity:ussr, polity:cuba, polity:congo]
- add:
    entry:
      id: cal.1962-10-09.africa-rhodesia
      when: Oct. 9
      date: '1962-10-09'
      thread: africa-rhodesia
      c: 'Macmillan with Butler, a long talk on Central Africa: six quiet months; with the Nyasaland conference in November and the Northern Rhodesia elections, a new crisis ahead.'
      n: '[[w.macmillan-diaries]], 504. Names: Macmillan, Butler.'
      tags: [name:macmillan-harold, name:butler-richard-a, polity:uk]
- add:
    entry:
      id: cal.1962-10-10.european-community
      when: Oct. 10
      date: '1962-10-10'
      thread: european-community
      c: 'Eden (Lord Avon) at luncheon with Macmillan, alone: doubtful but, Macmillan thinks, resigned about Europe; New Zealand to be safeguarded, Australia to some extent; Canada little affected.'
      n: '[[w.macmillan-diaries]], 505. See [[cal.1962-10-04.european-community]]. Names: Eden, Macmillan.'
      tags: [name:eden-anthony, name:macmillan-harold, polity:uk, polity:nz, polity:australia, polity:canada]
- add:
    entry:
      id: cal.1962-10-10.europe-and-the-alliance-2
      when: Oct. 10
      date: '1962-10-10'
      thread: europe-and-the-alliance
      c: 'The Governor of the Bank of England with Macmillan: no rise in private investment likely until the Common Market is settled; the economy to be restimulated only by public investment.'
      n: '[[w.macmillan-diaries]], 505. Names: Macmillan.'
      tags: [name:macmillan-harold, polity:uk]
- add:
    entry:
      id: cal.1962-10-13.european-community
      when: Oct. 13
      date: '1962-10-13'
      thread: european-community
      c: 'Macmillan''s speech to the Conservative conference, on the Saturday: "Everyone seems very pleased with the Tory Conference and with my speech."'
      n: '[[w.macmillan-diaries]], 504 (Oct. 10: "the speech for Saturday," written before the debate on the Common Market), 505–06 (Oct. 15). Check: the day (the diary''s "Saturday"). See [[cal.1962-10-11.european-community]]. Names: Macmillan.'
      tags: [name:macmillan-harold, polity:uk]
- add:
    entry:
      id: cal.1962-10-16.europe-and-the-alliance-2
      when: Oct. 16
      date: '1962-10-16'
      thread: europe-and-the-alliance
      c: 'Edinburgh, noon. The King of Norway, come to Leith by yacht, arrives at Princes Street Station for his state visit; Macmillan there.'
      n: '[[w.macmillan-diaries]], 506. Names: Macmillan.'
      tags: [name:macmillan-harold, polity:uk, polity:norway]
- add:
    entry:
      id: cal.1962-10-16.europe-and-the-alliance-3
      when: Oct. 16
      date: '1962-10-16'
      thread: europe-and-the-alliance
      c: 'Macmillan, the afternoon, at the new Forth Bridge (to be finished at the end of next year) and the new BMC truck factory at Bathgate: "The shop-stewards were friendly — or, at least, courteous."'
      n: '[[w.macmillan-diaries]], 506. See [[cal.1962-10-16.europe-and-the-alliance-2]]. Names: Macmillan.'
      tags: [name:macmillan-harold, polity:uk]
- add:
    entry:
      id: cal.1962-10-18.europe-and-the-alliance
      when: Oct. 18
      date: '1962-10-18'
      thread: europe-and-the-alliance
      c: 'Macmillan with Bligh, his private secretary, and Cary of the Cabinet Office, from luncheon to 6:30, on what he now calls "The Modernisation of Britain": a plan of action within a few days, for one or two colleagues.'
      n: '[[w.macmillan-diaries]], 507 (the diary of Oct. 19, "yesterday"; n.91: the paper, CAB 129/111, C(62) 201). Names: Macmillan.'
      tags: [name:macmillan-harold, polity:uk]
- add:
    entry:
      id: cal.1962-10-18.europe-and-the-alliance-2
      when: Oct. 18
      date: '1962-10-18'
      thread: europe-and-the-alliance
      c: 'Maudling, the Chancellor of the Exchequer, at dinner with Macmillan: Bank Rate not to be lowered for the present; the long-term rate of interest to be brought down; purchase tax on motor cars cut from 45 to 33⅓ percent, to be announced when Parliament returns, at £30 million to the revenue.'
      n: '[[w.macmillan-diaries]], 507. Check: the day: the diary of Oct. 19, after "We had a good day yesterday." See [[cal.1962-10-18.europe-and-the-alliance]]. Names: Maudling, Macmillan.'
      tags: [name:maudling-reginald, name:macmillan-harold, polity:uk]
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-diplomacy
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis-diplomacy
      also: [europe-and-the-alliance]
      c: 'About 10 p.m., London. A message from Kennedy to Macmillan: a short account of the serious situation developing between the United States and the Soviet Union over Cuba.'
      n: '[[w.macmillan-diaries]], 508. See [[cal.1962-10-21.missile-crisis-6]]. Names: Kennedy, Macmillan.'
      tags: [name:kennedy-john-f, name:macmillan-harold, polity:uk, polity:us, polity:ussr, polity:cuba]
- add:
    entry:
      id: cal.1962-10-22.middle-east
      when: Oct. 22
      date: '1962-10-22'
      thread: middle-east
      c: 'After luncheon with Home, Macmillan with the Governor of Aden, Home and Sandys present, on Yemen: the royalists unlikely to overthrow the new revolutionary government; early recognition inevitable. The Governor asks more time, about a week.'
      n: '[[w.macmillan-diaries]], 509 (n.93: Hassan, Badr). Names: Macmillan, Douglas-Home, Sandys.'
      tags: [name:macmillan-harold, name:douglas-home-alec, name:sandys-duncan-e, polity:uk, polity:yemen]
