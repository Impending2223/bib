- edit:
    id: cal.1960-01-08.china-leadership-2
    base: d4470ac4
    set:
      n: '[[w.yang-shangkun-riji]], I, 469 (Jan. 8, 1960). The words: 晚间 (I, 469). After [[cal.1960-01-08.china-leadership-3|the swim]]: the diary''s order alone, both in the evening, the talk written after the film and the swim (I, 469). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Peng Zhen.'
- edit:
    id: cal.1960-01-09.china-leadership-4
    base: 81c48d4a
    set:
      n: '[[w.yang-shangkun-riji]], I, 469 (Jan. 9, 1960). The words: 去俱乐部游泳 (I, 469). After [[cal.1960-01-09.china-leadership|Mao''s talk]]: the Mao nianpu has the talk at the afternoon session, after Ke Qingshi, Tao Zhu and Li Jingquan ([[w.zedong-mao-zedong-nianpu]], IV, Jan. 9, 1960); the diary has their reports from 4 to 7:30 p.m., then the opera and the swim in the evening (I, 469). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun.'
- edit:
    id: cal.1960-01-17.china-leadership-4
    base: 2965aaf8
    set:
      n: '[[w.yang-shangkun-riji]], I, 471 (Jan. 17, 1960). The words: 夜间……柯老来谈话到2时 (I, 471). After [[cal.1960-01-17.china-leadership-5|the swim]]: the diary''s order alone, both at night (I, 471). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Ke Qingshi, Yang Shangkun.'
- edit:
    id: cal.1960-01-21.china-leadership-4
    base: 2e243170
    set:
      n: '[[w.yang-shangkun-riji]], I, 472 (Jan. 21, 1960). The words: 下午 (I, 472). After [[cal.1960-01-21.china-leadership-3|the documents sent to be printed]]: the diary''s order alone, both in the afternoon (I, 472). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Gong Zirong.'
- edit:
    id: cal.1960-01-19.japan-and-korea
    base: 34a03425
    set:
      n: 'Joint Statement Following Discussions With Prime Minister Kishi of Japan, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165); Remarks at the Signing, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165) (Jan. 19, 1960). FRUS 1958–60, XVIII, docs. [132](https://history.state.gov/historicaldocuments/frus1958-60v18/d132)–[146](https://history.state.gov/historicaldocuments/frus1958-60v18/d146). After [[cal.1960-01-19.soviet-union|the morning''s talk]]: the joint statement has the two confer "prior to the formal signing," and the note to the remarks puts the ceremony in the East Room after the luncheon, which began at 2:06 p.m. (1960–61 Pub. Papers 112–13). The status of forces agreement signed the same day, [11 U.S.T. 1652](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-11-2/lltreaties-11-2.pdf#page=360). To check: [[w.packard-protest-in-tokyo]]; [[w.kapur-japan-at-the-crossroads]]; [[w.schaller-altered-states]]; [[w.lafeber-clash]]; [[w.eisenhower-white-house-years]]. Names: Eisenhower, Herter, Kishi.'
- edit:
    id: cal.1960-01-19.soviet-union
    base: 71dcbec3
    set:
      n: '[FRUS 1958–60, XVIII, doc. 135](https://history.state.gov/historicaldocuments/frus1958-60v18/d135) (Washington, Jan. 19, 1960, the morning''s talk, "Summit Prospects and East-West Relations"). [[w.chang-friends-and-enemies]], 213 (soon after Camp David, Eisenhower to Kishi: the summit had made him more hopeful; Khrushchev might fear a strong Red China). The hour: FRUS heads doc. 135 "10–11:40 p.m.," a misprint; docs. 132–134 and 136–138, the memoranda of the same talk, give "10–11:40 a.m.," and at lunch the President speaks of Kishi''s visit "this morning" (Toasts of the President and Prime Minister Kishi of Japan, [1960–61 Pub. Papers 110](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=162), 111 (Jan. 19, 1960)). Made public: 1990 ([[w.chang-friends-and-enemies]], 213). To check: memorandum, meeting with Kishi, Jan. 19, 1960, Eisenhower Papers (Ann Whitman File), Diaries, box 47, Staff Notes 1/60 (2) (cited by [[w.chang-friends-and-enemies]], 213 n.21). Names: Eisenhower, Kishi, Khrushchev.'
    settles:
    - 'Check: the hour; FRUS heads doc. 135 "10–11:40 p.m.," the morning''s other memoranda of the same talk (docs. 132, 134, 137) "10–11:40 a.m."'
- edit:
    id: cal.1960-01-23.elections-1960-nomination-2
    base: 103f2a18
    set:
      n: '[[w.schlesinger-journals]], 65. After [[cal.1960-01-23.elections-1960-nomination|the rewriting of Humphrey''s speech]]: Schlesinger meets Harriman "on returning from the Congressional to the Sheraton Park" (65). Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger, Johnson, Humphrey, Kennedy.'
- edit:
    id: cal.1960-01-23.democratic-party
    base: ddd387bf
    set:
      n: '[[w.schlesinger-journals]], 65. After [[cal.1960-01-23.elections-1960-nomination-2|the talk with Harriman]]: the dinner is "in the evening," Harriman already in his dinner clothes at about 4:30 (65). Names: Humphrey, Kennedy, Johnson, Eisenhower.'
- edit:
    id: cal.1960-01-14.china
    base: 9d15d5c0
    kind: correct
    set:
      c: 'The Foreign Ministry issues a statement against the U.S.–Japanese military alliance treaty. Kishi to sign it, in the name of revising the security treaty, against the will of the Japanese people and repeated warnings: a step toward new aggression and war, a revival of Japanese militarism, and Japan''s open entry into a U.S. aggressive military bloc.'
      n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 130 (Jan. 14, 1960). The treaty was signed Jan. 19: Remarks at the Signing of the Treaty of Mutual Cooperation and Security Between Japan and the United States, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165) (Jan. 19, 1960); the statement''s 签订 carries no tense (130). Names: Kishi.'
