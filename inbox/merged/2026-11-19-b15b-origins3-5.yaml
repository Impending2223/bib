      date: 1963-04
      thread: china-leadership
      at: before 1963-04-11
      c: 'Henan. The four clean-ups'' first stage, three-level cadres'' conferences in the counties, ends after about twenty days: 150,000 cadres above the brigade. Commune conferences and mass education to follow.'
