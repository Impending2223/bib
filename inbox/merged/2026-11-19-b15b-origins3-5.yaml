ops:
- add:
    entry:
      id: cal.1962-10-21.china-leadership-3
      when: Oct. 21
      date: '1962-10-21'
      thread: china-leadership
      c: 'The Hunan provincial committee reports over 25,200 production teams, 5.5 percent of all, farming their fields by household, after three waves: spring and autumn 1961, spring 1962. Its remedy: restore cadres'' and poor peasants'' faith in socialism and use them to turn it back.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 335–36. Made public: 1986. To check: Hunan Provincial Committee, report of Oct. 21, 1962 on the wind of individual operation, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 168–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 335 n.8); Hunan Provincial Committee, report of Oct. 21, 1962 on the wind of individual operation, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 169–71 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 336 n.9).'
      tags:
