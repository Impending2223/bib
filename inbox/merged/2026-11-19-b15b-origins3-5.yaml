- add:
    entry:
      id: cal.1962.china-leadership-25
      when: 1962, after the Tenth Plenum
      date: '1962'
      thread: china-leadership
      at: after 1962-09-27
      c: Fujian. The provincial small group opens socialist education at Lianjiang, Xiamen and Nan'an, against cadres' misconduct. The Lianjiang papers list houses built for cadres with collective brick and timber, feasts, gifts at weddings and birthdays, collective funds wasted, 'superstition' let be.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 335. Made public: 1964. To check: [[w.baum-prelude-to-revolution]], 12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 335 n.4a); [[w.roc-fangong-youjidui-tuji-fujian]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 335 n.4b); [[w.chen-rural-peoples-communes-in]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 335 n.4c); [[w.bianjibu-dangdai-zhongguode-fujian-contemporary]], 1, 133 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 335 n.4d); [[w.chen-rural-peoples-communes-in]], 109–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 335 n.5). Check: the month; the book says only ''before the end of 1962''. The Lianjiang documents were captured by the Nationalists in 1964.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: ebf4f5f3
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 335: all'
