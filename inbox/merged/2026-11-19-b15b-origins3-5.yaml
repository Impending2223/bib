- add:
    entry:
      id: cal.1963-04-23.china-leadership-5
      when: Apr. 23
      date: '1963-04-23'
      thread: china-leadership
      c: 'The Heilongjiang provincial committee opens the five-antis: first the Party, government and other units of Harbin and seven other cities, to August; then the counties, to the year''s end. In all, 55 enterprises in four cities find waste of nearly 103 million yuan.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 336–37. Made public: 1986. To check: [[w.heilongjiang-sishinian]], 332 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 336 n.17c); [[w.heilongjiang-sishinian]], 332–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 337 n.24). Check: the day; for Heilongjiang *Heilongjiang sishi nian* (332) is cited for a January and a March 1 start of the campaign (III, 336 n.17).'
