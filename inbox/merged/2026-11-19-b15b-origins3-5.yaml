- add:
    entry:
      id: cal.1963.china-leadership-5
      when: 1963, by May 20
      date: '1963'
      thread: china-leadership
      at: before 1963-05-20
      c: 'Mao''s directive on the three great revolutionary movements, class struggle, production and scientific experiment: without them, within some years or decades, counter-revolution nationwide and the Party turned revisionist, fascist.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 342. Made public: 1968. To check: Mao Zedong, directive on the three great revolutionary movements, 1963, in [[w.baum-ssu-ching]], 70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 342 n.49). See [[cal.1963-05-07.china-leadership]]. Names: Mao Zedong. Check: the date, and whether this is Mao''s written comment at Hangzhou on the seven Zhejiang documents (III, 340); the book calls it ''recent'' and quotes it from the Former Ten Points'' coda (III, 342).'
      tags:
