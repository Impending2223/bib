- add:
    entry:
      id: cal.1963-05.china-leadership-5
      when: May, mid
      date: 1963-05
      thread: china-leadership
      at: before 1963-05-11
      c: 'Peng Zhen tours Hebei, Jiangxi, Hunan, Guangxi, Yunnan, Guizhou, Sichuan and Shaanxi, to mid-June. He finds what Hunan and Hubei had reported: deaths, most of them suicides; beatings and strong-arm struggle.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 343. Made public: 1993. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1109, 1111–12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 343 n.52a). Names: Peng Zhen. Check: the days; the book says ''between mid-May and mid-June''.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-zhen
      src:
        c: d033ced7
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 343: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 343 n.52a: all'
- add:
    entry:
      id: cal.1963-07-04.china-leadership-5
      when: July 4
      date: '1963-07-04'
      thread: china-leadership
      c: Peng Zhen reports to Mao on his tour. Local cadres can run the movement, except where landlords or corrupt men hold power and outside work teams are needed; no repeat of land reform's leftist errors in the old north China base areas.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 343. Made public: 1993. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1109, 1111–12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 343 n.52a). Names: Peng Zhen, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-zhen
      - name:mao-zedong
      src:
