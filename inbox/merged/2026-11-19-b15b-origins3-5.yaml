- add:
    entry:
      id: cal.1962-12.china-leadership-5
      when: Dec., winter
      date: 1962-12
      thread: china-leadership
      at: before 1962-12-22
      c: 'Baoding prefecture, Hebei. An investigation group tries a ''four cleans'' in the villages: the teams'' accounts, granaries, property and work points, and fairer distribution. By Mao''s later account it set out on distribution and took up the four cleans at the peasants'' demand.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 336. Made public: 1969. To check: [[w.mao-zedong-sixiang-wan-1969]], 443 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 336 n.11); [[w.bianjibu-dangdai-zhongguode-hebei-contemporary]], 1, 111–12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 336 n.12). Check: the month; the book has ''the winter of 1962''.'
      tags:
