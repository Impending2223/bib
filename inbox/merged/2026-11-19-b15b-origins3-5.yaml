      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 336. Made public: 1988. To check: [[w.yunfei-liu-shaoqi-yu-liushi]], 13 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 336 n.18a); [[w.jiaoyanshi-zhongguo-gongchan-dang-qishi]], 513 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 336 n.18b). See [[cal.1963-02-11.china-leadership]]. Names: Mao Zedong. Check: *Qishi nian jianjie* (513) has the decision taken at Zhou Enlai''s suggestion, but not until Sept. 1963.'
