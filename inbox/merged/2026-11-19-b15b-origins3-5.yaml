- add:
    entry:
      id: cal.1963-04.china-leadership-7
      when: Apr.
      date: 1963-04
      thread: china-leadership
      c: 'The Henan Party committee sends the centre its counts: over 100,000 cases of speculation; over 1,300 of counter-revolutionary groups; over 26,000 of landlords and rich peasants against the government; 8,000 secret societies and sects; over 50,000 witches, sorcerers and geomancers.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 337. Made public: 1981. To check: Henan Provincial Committee, report with statistics to the centre, Apr. 1963, in [[w.nongye-jitihua-zhongyao-wenjian]], xia, 674–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 337 n.21). Check: the date and the author; the book gives the counts after its account of April.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: 457efcaa
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 337: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 337 n.21: all'
