- add:
    entry:
      id: cal.1963-02.china-leadership-4
      when: Feb., after the 11th
      date: 1963-02
      thread: china-leadership
      at: after 1963-02-11
      c: 'Central Work Conference. Mao breaks into a speech of Liu Shaoqi''s: revisionism is to be stopped in the countryside; a cadre is bought for three catties of pork or a few packs of cigarettes; only class struggle prevents it.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 336. Made public: 1989. To check: [[w.jin-1949-1989-niande-zhongguo]], 527 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 336 n.15); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1107 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 336 n.16a). See [[cal.1963-02-11.china-leadership]]. Names: Mao Zedong, Liu Shaoqi. Check: the day; whether Liu''s speech is the report of Feb. 25 on the struggle against modern revisionism (see the entry of Feb. 25).'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      - name:liu-shaoqi
      src:
        c: fb7b7296
        rows:
