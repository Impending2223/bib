patch: 2026-11-12-owner-variants-2
by: 'lead: the owner, Nov. 12 ("Were there variants with different senses? Those should be noted too!"): the readers'' variants of a different sense the b11 audits dropped'
ops:
- variant:
    id: cal.1961-01-31.rules
    unit: A
    witness: w.albert-little-giant-1990
    reads: 'Albert: "The vote came on December 31, 1961," on the amendment of the rules for the Eighty-seventh Congress to provide a fifteen-member Rules Committee'
    at: '242'
- variant:
    id: cal.1961-03-24.program
    unit: A
    witness: w.albert-little-giant-1990
    reads: 'Albert: "we lost to Kitchin-Ayres, 186 to 185"'
    at: '248'
- variant:
    id: cal.1961-03-24.program
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: the House lost on the floor "by a vote of 186 to 185," the day after the meeting in Rayburn''s office on the 24th; the House then passed a $1.15 version'
    at: '125'
- variant:
    id: cal.1963-11-22.democratic-party-5
    unit: B
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: on the Friday morning, on the sidewalk below the Hotel Texas where the motorcade waits, he persuades Yarborough to ride with Johnson, then tells Johnson at the hotel door "Yarborough''s going to ride with you"; Kennedy had told him in the suite to "throw Yarborough into the car with Lyndon"'
    at: '156'
- variant:
    id: cal.1965-03-11.civil-rights-the-executive
    unit: C
    witness: w.johnson-white-house-diary
    reads: the demonstrators "had departed, after some urging" by the police "around 6 o'clock"
    at: '251'
- variant:
    id: cal.1968-05-25.robert-kennedy-campaign-2
    unit: E
    witness: w.witcover-85-days
    reads: 'Witcover: Walinsky, Greenfield "and others" were "milling around, talking loudly" in the corridor; Kennedy, in his shorts, opened the door, "stalked out" and "stormed back inside"; Edelman is not named.'
    at: '215'
- variant:
    id: cal.1968-06-08.robert-kennedy
    unit: A
    witness: w.witcover-85-days
    reads: 'Witcover: "well before 9 o''clock Friday morning the first of the invited began to arrive" at the cathedral; the work has the Mass the morning of Friday, June 7.'
    at: '304'
- variant:
    id: cal.1961-01-03.congress
    unit: B
    witness: w.ritchie-minutes-of-the-senate
    reads: Mr. Mansfield emphasized that the proposal was his alone, not that of the Vice President-elect
    at: '578'
- variant:
    id: cal.1963-06-05.republican-party-congress
    unit: B
    witness: w.wolff-minutes-of-the-senate
    reads: 'The unlabeled draft the editor places with the June 5 minutes (969): "we as Republican members of the Senate will support any appropriate request by the President for such legislative authority as may be required" (the June 5-dated text, 968, has the entry''s words)'
    at: '969'
- variant:
    id: cal.1964-05-19.civil-rights-bill
    unit: B
    witness: w.ritchie-minutes-of-the-senate
    reads: Senator Clark stated that he was not satisfied with Title VII as it now existed
    at: '636'
- variant:
    id: cal.1964-05-25.republican-party-congress
    unit: B
    witness: w.wolff-minutes-of-the-senate
    reads: no consensus recorded; the afternoon taken with individual amendments (Mundt, Cotton, Miller, Allott) and the staff to work out language
    at: 983–84
