patch: ny
by: agent
ops:
  # ---------------------------------------------------------------- 1961
  - add:
      entry:
        id: cal.1961-01.states-and-cities-nyc
        when: Jan.–Feb.
        date: '1961-01'
        thread: states-and-cities
        also: [elections-1961]
        c: 'New York. Manhattan''s borough president removed on his conviction; the borough''s six members of the City Council choose Edward R. Dudley, Wagner''s candidate, over Tammany''s. In early February Wagner calls on DeSapio to step down as leader of the county''s Democrats.'
        n: '[Wikipedia, "1961 New York City mayoral election"](https://en.wikipedia.org/wiki/1961_New_York_City_mayoral_election). Check: *New York Times*, Jan.–Feb. 1961. [[w.moscow-last-of-the-big]]; [[w.wilson-amateur-democrat]]; [[w.soyer-left-in-the-center]]; [[w.costikyan-behind-closed-doors]]. Names: Wagner (K–J Cong. III.F); DeSapio (K–J Cong. III.K).'
        tags: [state:ny, city:nyc, name:dudley-edward-r, name:wagner-robert-f-jr, name:desapio-carmine]
  - add:
      entry:
        id: cal.1961-06-19.welfare-ny
        when: June 19
        date: '1961-06-19'
        thread: welfare
        also: [states-and-cities]
        c: 'Newburgh, N.Y. The City Council, four ayes, adopts City Manager Mitchell''s thirteen points on relief, in force July 15: vouchers for cash; able-bodied men on relief to work 40 hours a week for the city; relief denied to anyone who refuses a job or quits one, and to a mother who has another child out of wedlock; newcomers without an offer of work held to a week; aid, but for the aged, blind and disabled, limited to three months a year. June 22, State officials: the code breaks the State''s rules. Goldwater meets Mitchell in July.'
        n: '[The council''s minutes, June 19, 1961](https://en.wikisource.org/wiki/Thirteen_Points) (Wikisource). [[w.ritz-despised-poor]]; [[w.mittelstadt-from-welfare-to-workfare]]; [[w.neubeck-welfare-racism]]; [[w.tani-states-of-dependency]]; [[w.perlstein-before-the-storm]]. Names: Mitchell (K–J Cong. III.K); Goldwater (Opp. III.B).'
        tags: [state:ny, city:newburgh, name:mitchell-joseph-mcdowell, name:goldwater-barry-m]
  - add:
      entry:
        id: cal.1961-08-18.welfare-ny
        when: Aug. 18
        date: '1961-08-18'
        thread: welfare
        also: [court]
        c: 'Newburgh. The State Supreme Court for Orange County, on the State Board of Social Welfare''s suit, enjoins twelve of the thirteen points; the monthly report to the welfare department stands. Rockefeller orders an inquiry under the Moreland Act (Check the date). Dec. 19, the injunction made permanent.'
        n: '*State Bd. of Social Welfare v. City of Newburgh*, 28 Misc. 2d 539 (Sup. Ct. 1961). See [[cal.1961-06-19.welfare-ny]]. Names: Rockefeller (Opp. III.H).'
        tags: [state:ny, city:newburgh, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1961-08-21.states-and-cities-nyc
        when: Aug. 21
        date: '1961-08-21'
        thread: states-and-cities
        c: 'Special session at Albany, N.Y., called by Rockefeller: six hours, a law to reform New York City''s schools. The Board of Education removed; a new board to be named by the mayor from a screening panel''s nominees (Check the terms).'
        n: '[*New York Times*, Aug. 22, 1961](https://www.nytimes.com/1961/08/22/archives/reform-ordered-democrats-are-beaten-on-amendments-and-all-but-7.html); [Wikipedia, "173rd New York State Legislature"](https://en.wikipedia.org/wiki/173rd_New_York_State_Legislature). Check: *Laws of New York*, 1961, Extraordinary Session. [[w.ravitch-great-school-wars]]. Names: Rockefeller (Opp. III.H).'
        tags: [state:ny, city:nyc, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1961-11-07.mayors-ny
        when: Nov. 7
        date: '1961-11-07'
        thread: mayors
        also: [elections-1961]
        c: 'New York''s cities upstate. Buffalo: Kowal (R), the city comptroller, elected mayor; Sedita (D), mayor since 1958, out (Check: beaten in the primary or in November). Syracuse: Walsh (R), Onondaga County''s welfare commissioner, elected mayor. Albany, N.Y.: Corning (D), mayor since 1942, elected to a sixth term.'
        n: '[Wikipedia, "List of mayors of Buffalo, New York"](https://en.wikipedia.org/wiki/List_of_mayors_of_Buffalo,_New_York); ["William F. Walsh"](https://en.wikipedia.org/wiki/William_F._Walsh); ["Erastus Corning 2nd"](https://en.wikipedia.org/wiki/Erastus_Corning_2nd). Check: the county boards of elections'' canvasses. [[w.goldman-high-hopes]]; [[w.grondahl-mayor-corning]]. See [[cal.1961-11-07.states-and-cities]]. Names: Kowal, Sedita, Corning (K–J Cong. III.F).'
        tags: [state:ny, city:buffalo, city:syracuse, city:albany, name:kowal-chester, name:sedita-frank-a, name:walsh-william-f, name:corning-erastus]
  - add:
      entry:
        id: cal.1961-11-07.state-constitutions-nyc
        when: Nov. 7
        date: '1961-11-07'
        thread: state-constitutions
        also: [elections-1961]
        c: 'New York City''s voters approve a new charter, in force Jan. 1, 1963: the mayor''s powers over the budget and the city''s departments enlarged, the borough presidents'' public works moved to city departments; the City Council to have two members at large from each borough, one seat each for the minority. Check the vote.'
        n: '[The charter as revised, 1963](https://archive.org/details/newyorkcitychart00newy_0). [Wikipedia, "New York City Charter"](https://en.wikipedia.org/wiki/New_York_City_Charter). Check: *New York Times*, Nov. 8, 1961. [[w.sayre-governing-new-york-city]]; [[w.morris-cost-of-good-intentions]]. See [[cal.1961-11-07.states-and-cities]].'
        tags: [state:ny, city:nyc]
  - add:
      entry:
        id: cal.1961-11-09.legislatures-ny
        when: Nov. 9–10
        date: '1961-11-09'
        thread: legislatures
        also: [defense]
        c: 'Special session at Albany, N.Y., called by Rockefeller. New congressional districts on the 1960 census, the State''s seats down from 43 to 41, the city''s delegation by three. State aid for fallout shelters in schools and colleges (Check the sums).'
        n: '[*New York Times*, Oct. 22, 1961](https://www.nytimes.com/1961/10/22/archives/albany-session-set-on-shelters-and-districting-governor-calls.html); [*New York Times*, Nov. 11, 1961](https://www.nytimes.com/1961/11/11/archives/voting-is-close-city-house-delegation-cut-by-three-bill-bitterly.html); [Wikipedia, "173rd New York State Legislature"](https://en.wikipedia.org/wiki/173rd_New_York_State_Legislature). Check: *Laws of New York*, 1961, Extraordinary Session. [[w.connery-rockefeller-of-new-york]]; [[w.persico-imperial-rockefeller]]. See [[cal.1961-07-25.berlin-and-vienna]]. Names: Rockefeller (Opp. III.H).'
        tags: [state:ny, name:rockefeller-nelson]
  # ---------------------------------------------------------------- 1962
  - add:
      entry:
        id: cal.1962-02.states-and-cities-ny
        when: Feb.
        date: '1962-02'
        thread: states-and-cities
        also: [elections-1962]
        c: 'The Conservative Party of New York State organized. O''Doherty its first chairman; Mahoney from July. July 13, Jaquith, a Syracuse manufacturer, its candidate for governor against Rockefeller. Oct. 1, the Republican State chairman, Morhouse, drops the party''s suit against its petitions.'
        n: '[*New York Times*, July 14, 1962](https://www.nytimes.com/1962/07/14/archives/conservative-party-candidate-picked-to-oppose-rockefeller-david-h.html); [*New York Times*, Oct. 2, 1962](https://www.nytimes.com/1962/10/02/archives/gop-ends-suit-on-conservatives-new-party-assured-a-place-on-state.html); [Wikipedia, "Conservative Party of New York State"](https://en.wikipedia.org/wiki/Conservative_Party_of_New_York_State). [[w.mahoney-actions-speak-louder]]; [[w.kabaservice-rule-and-ruin]]; [[w.connery-rockefeller-of-new-york]]. Names: Mahoney, Jaquith (K–J Cong. III.K); Rockefeller (Opp. III.H).'
        tags: [state:ny, name:odoherty-kieran, name:mahoney-j-daniel, name:jaquith-david-h, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1962-09-17.governors-ny
        when: Sept. 17–19
        date: '1962-09-17'
        thread: governors
        also: [elections-1962]
        c: 'New York''s conventions. Democrats at Syracuse, Sept. 17: Morgenthau, United States Attorney in Manhattan, nominated for governor on the second ballot, over O''Connor, Stratton, Samuels, Beame and others. Sept. 18: Donovan for the Senate against Javits; Edward R. Dudley, Manhattan''s borough president, a Negro, for attorney general. Sept. 19, Republicans at Buffalo renominate Rockefeller and Javits; the Liberals endorse the Democrats'' ticket.'
        n: '[*New York Times*, Sept. 18, 1962](https://select.nytimes.com/gst/abstract.html?res=FB0610FA355C137A93CAA81782D85F468685F9); [Sept. 19](https://www.nytimes.com/1962/09/19/archives/democrats-name-dudley-a-negro-to-state-ticket-donovan-to-oppose.html); [Sept. 20](https://www.nytimes.com/1962/09/20/archives/governor-vows-hard-campaign-is-renominated-cheering-republican.html). [[w.persico-imperial-rockefeller]]; [[w.smith-on-his-own-terms]]; [[w.connery-rockefeller-of-new-york]]; [[w.underwood-governor-rockefeller-in-new]]. Names: Morgenthau (K–J Cong. III.K); O''Connor (K–J Cong. III.F); Beame (K–J Cong. III.K); Donovan (K–J Adm. III.I); Javits (K–J Cong. III.E); Rockefeller (Opp. III.H).'
        tags: [state:ny, name:morgenthau-robert-m, name:oconnor-frank-d, name:stratton-samuel-s, name:samuels-howard-j, name:beame-abraham-d, name:donovan-james-b, name:javits-jacob-k, name:dudley-edward-r, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1962-11-06.governors-ny
        when: Nov. 6
        date: '1962-11-06'
        thread: governors
        also: [elections-1962]
        c: 'New York. Rockefeller (R) reelected governor, 3,081,587, 53.1 percent; Morgenthau (D, Liberal) 2,552,418, 44.0; Jaquith (Conservative) 141,877, 2.4, enough for the party''s line on the ballot. Javits (R) reelected Senator over Donovan, 3,272,417 to 2,289,323; O''Doherty (Conservative) 116,151.'
        n: 'Governor: [Wikipedia, "1962 New York state election"](https://en.wikipedia.org/wiki/1962_New_York_state_election), from the *New York Red Book*, 1963; Check: the *Legislative Manual*, 1963. Senate: [*Statistics of the Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf) (Clerk of the House, 1963). See [[cal.1962-09-17.governors-ny]]; [[cal.1962-02.states-and-cities-ny]]. Names: Rockefeller (Opp. III.H); Morgenthau, Jaquith (K–J Cong. III.K); Javits (K–J Cong. III.E); Donovan (K–J Adm. III.I).'
        tags: [state:ny, name:rockefeller-nelson, name:morgenthau-robert-m, name:jaquith-david-h, name:javits-jacob-k, name:donovan-james-b, name:odoherty-kieran]
  - add:
      entry:
        id: cal.1962-12.cities-and-housing-nyc
        when: Dec.
        date: '1962-12'
        thread: cities-and-housing
        also: [transportation]
        c: 'New York. The Board of Estimate, after a hearing of six hours, sets aside Moses''s Lower Manhattan Expressway, an elevated highway across Broome Street from the Holland Tunnel to the East River bridges; Jacobs among its opponents. Check the date (Dec. 6 or 11) and the vote. Moses brings back a revised plan in May 1963.'
        n: '[*New York Times*, Dec. 4, 1962](https://www.nytimes.com/1962/12/04/archives/relocation-report-is-help-to-downtown-expressway-relocation-plan.html); [Dec. 7](https://www.nytimes.com/1962/12/07/archives/expressway-vote-delayed-by-city-final-decision-is-postponed-after.html); [Wikipedia, "Interstate 78 in New York"](https://en.wikipedia.org/wiki/Interstate_78_in_New_York). [[w.flint-wrestling-with-moses]]; [[w.caro-power-broker]]; [[w.robert-moses-and-the]]; [[w.zipp-manhattan-projects]]. Names: Jacobs (K–J Cong. III.K).'
        tags: [state:ny, city:nyc, name:jacobs-jane]
  # ---------------------------------------------------------------- 1963
  - add:
      entry:
        id: cal.1963-10-28.cities-and-housing-nyc
        when: Oct. 28
        date: '1963-10-28'
        thread: cities-and-housing
        c: 'New York. The Pennsylvania Railroad begins to pull down Pennsylvania Station''s building above the tracks, for Madison Square Garden and two office towers; trains run on below.'
        n: '[Wikipedia, "Pennsylvania Station (1910–1963)"](https://en.wikipedia.org/wiki/Pennsylvania_Station_(1910%E2%80%931963)). [[w.wood-preserving-new-york]].'
        tags: [state:ny, city:nyc]
  # ---------------------------------------------------------------- 1964
  - add:
      entry:
        id: cal.1964-02-17.legislatures-ny
        when: Feb. 17
        date: '1964-02-17'
        thread: legislatures
        also: [court, voting-rights]
        c: '*Wright v. Rockefeller*, [376 U.S. 52](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376052/usrep376052.pdf): Manhattan''s congressional districts of 1961 upheld. The voters who sued had not proved the lines drawn by race; the 18th, Powell''s, 86.3 percent Negro and Puerto Rican, the 17th 5.1. Black for the Court; Douglas and Goldberg dissent.'
        n: '[[w.cortner-apportionment-cases]]; [[w.hamilton-adam-clayton-powell-jr]]. See [[cal.1961-11-09.legislatures-ny]]; [[cal.1964-02-17.court]]. Names: Black, Douglas, Goldberg (K–J Cong. III.G); Powell (K–J Cong. III.D).'
        tags: [state:ny, city:nyc, name:black-hugo-l, name:douglas-william-o, name:goldberg-arthur-j, name:powell-adam-clayton-jr]
  - add:
      entry:
        id: cal.1964-03-16.desegregation-schools-nyc
        when: Mar. 16
        date: '1964-03-16'
        thread: desegregation-schools
        c: 'New York. A second one-day boycott of the city''s schools, called by Galamison''s committee without the NAACP (Check). Fewer children out than on Feb. 3 (Check the count).'
        n: 'See [[cal.1964-02-03.desegregation-schools]]. Names: Galamison (K–J Cong. III.K).'
        tags: [state:ny, city:nyc, name:galamison-milton-a]
  - add:
      entry:
        id: cal.1964-04-22.civil-rights-organizations-nyc
        when: Apr. 22
        date: '1964-04-22'
        thread: civil-rights-organizations
        also: [states-and-cities]
        c: 'Queens. The New York World''s Fair opens; Johnson speaks at the opening, hecklers in the crowd (Check). Brooklyn CORE''s "stall-in" on the highways to the fair, disowned by CORE''s national office, stops few cars; Farmer and other demonstrators arrested at the pavilions (Check).'
        n: '[Remarks at the Opening of the New York World''s Fair](https://www.presidency.ucsb.edu/documents/remarks-the-opening-the-new-york-worlds-fair) (Apr. 22, 1964). [[w.purnell-fighting-jim-crow-in]]; [[w.biondi-to-stand-and-fight]]. Names: Johnson (K–J Adm. III.D); Farmer (K–J Cong. III.H).'
        tags: [state:ny, city:nyc, name:johnson-lyndon-b, name:farmer-james]
  - add:
      entry:
        id: cal.1964-09-14.desegregation-schools-nyc
        when: Sept. 14
        date: '1964-09-14'
        thread: desegregation-schools
        c: 'New York. Parents and Taxpayers, white parents'' groups of Queens and Brooklyn, keep their children home against the pairing of schools to mix them by race, at the opening of the term. Check the dates and the count.'
        n: '[[w.ravitch-great-school-wars]]; [[w.sugrue-sweet-land-of-liberty]]; [[w.taylor-knocking-at-our-own]]. See [[cal.1964-02-03.desegregation-schools]].'
        tags: [state:ny, city:nyc]
  - add:
      entry:
        id: cal.1964-11-03.legislatures-ny
        when: Nov. 3
        date: '1964-11-03'
        thread: legislatures
        also: [elections-1964]
        c: 'New York. Democrats take both houses of the legislature, the first time since 1935 (Check): the Senate 33 to 25, the Assembly 88 to 62 (Check). Elected under the old apportionment for one year only, by the three-judge court''s order of the summer after *WMCA v. Lomenzo*.'
        n: '[Wikipedia, "175th New York State Legislature"](https://en.wikipedia.org/wiki/175th_New_York_State_Legislature) (the seats counted from its rolls). Check: the *Legislative Manual*, 1965. [[w.lee-one-man-one-vote]]; [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]].'
        tags: [state:ny]
  - add:
      entry:
        id: cal.1964-12-03.states-and-cities-nyc
        when: Dec. 3
        date: '1964-12-03'
        thread: states-and-cities
        c: 'New York. J. Raymond Jones, a Harlem district leader, elected leader of the New York County Democrats, Tammany, the first Negro to hold it (Check).'
        n: '[Wikipedia, "J. Raymond Jones"](https://en.wikipedia.org/wiki/J._Raymond_Jones). [[w.walter-harlem-fox]]. See [[cal.1961-01.states-and-cities-nyc]]. Names: Jones (K–J Cong. III.K).'
        tags: [state:ny, city:nyc, name:jones-j-raymond]
  - add:
      entry:
        id: cal.1964-12-15.legislatures-ny
        when: Dec. 15–30
        date: '1964-12-15'
        thread: legislatures
        c: 'New York. The Republican legislature, in a special session called by Rockefeller before the Democrats take over in January, reapportions itself for the election ordered for November 1965: a Senate of 65 and an Assembly of 165, the counties'' representation given up for population. Check: four alternative plans.'
        n: '[*New York Times*, Dec. 2, 1964](https://www.nytimes.com/1964/12/02/archives/rockefeller-calls-session-for-dec-15-democrats-assail.html); [Wikipedia, "174th New York State Legislature"](https://en.wikipedia.org/wiki/174th_New_York_State_Legislature). Check: *Laws of New York*, 1964, Extraordinary Session. See [[cal.1964-11-03.legislatures-ny]]. Names: Rockefeller (Opp. III.H).'
        tags: [state:ny, name:rockefeller-nelson]
  # ---------------------------------------------------------------- 1965
  - add:
      entry:
        id: cal.1965-01-06.legislatures-ny
        when: Jan. 6–Feb. 4
        date: '1965-01-06'
        thread: legislatures
        also: [robert-kennedy]
        c: 'Albany, N.Y. The Democratic majorities split, Wagner''s men against those of Robert Kennedy and the Brooklyn leaders; neither house organized for a month. Feb. 3, Zaretzki, Wagner''s candidate, elected the Senate''s leader with the Republicans'' votes, at Rockefeller''s urging; Feb. 4, Travia Speaker over Steingut, again with Republican votes.'
        n: '[*New York Times*, Jan. 7, 1965](https://www.nytimes.com/1965/01/07/archives/session-is-opened-two-attempts-to-elect-officers-fail-both-houses.html); [Feb. 4](https://www.nytimes.com/1965/02/04/archives/zaretzki-wins-as-gop-steps-in-giving-wagner-man-needed-votes.html); [Feb. 5](https://www.nytimes.com/1965/02/05/archives/travial-elected-speaker-gop-vote-again-decisive-as-streingut-is.html). [[w.connery-rockefeller-of-new-york]]; [[w.schlesinger-robert-kennedy-and-his]]. See [[cal.1964-11-03.legislatures-ny]]. Names: Wagner (K–J Cong. III.F); Robert Kennedy (K–J Cong. III.B); Zaretzki, Travia, Steingut (K–J Cong. III.K); Rockefeller (Opp. III.H).'
        tags: [state:ny, name:wagner-robert-f-jr, name:kennedy-robert-f, name:zaretzki-joseph, name:travia-anthony-j, name:steingut-stanley, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1965-02-23.states-and-cities-nyc
        when: Feb. 23
        date: '1965-02-23'
        thread: states-and-cities
        c: 'New York. Constance Baker Motley, of the NAACP Legal Defense Fund, a State Senator since Feb. 4, 1964, chosen Manhattan''s borough president by the borough''s members of the City Council, the first woman in the office (Check). Elected to a full term in November.'
        n: '[Wikipedia, "Constance Baker Motley"](https://en.wikipedia.org/wiki/Constance_Baker_Motley). [[w.motley-equal-justice-under-law]]; [[w.biondi-to-stand-and-fight]]. See [[cal.1964-12-03.states-and-cities-nyc]]. Names: Motley (K–J Cong. III.F).'
        tags: [state:ny, city:nyc, name:motley-constance-baker]
  - add:
      entry:
        id: cal.1965-04-14.legislatures-ny
        when: Apr. 14
        date: '1965-04-14'
        thread: legislatures
        also: [court]
        c: 'The New York Court of Appeals voids the plans of December: the State constitution fixes the Assembly at 150, and the Senate''s rise to 65 was not warranted. May 10, the three-judge federal court, 2–1: the November election to go on under the December plan all the same, its winners to serve one year, and a new plan due Feb. 1, 1966. Oct. 11, the Supreme Court dismisses the appeals.'
        n: '*Matter of Orans*, 15 N.Y.2d 339 (1965) (Check the cite). [*New York Times*, Apr. 15, 1965](https://www.nytimes.com/1965/04/15/archives/gop-plan-voided-constitution-is-cited-as-requiring-150-seats-in.html); [May 11](https://www.nytimes.com/1965/05/11/archives/decision-is-2-to-1-order-applies-only-to-1965-winners-to-serve-one.html); [Oct. 12](https://www.nytimes.com/1965/10/12/archives/supreme-court-clears-election-for-legislature-dismisses-appeals-to.html). See [[cal.1964-12-15.legislatures-ny]].'
        tags: [state:ny]
  - add:
      entry:
        id: cal.1965-04-19.cities-and-housing-nyc
        when: Apr. 19
        date: '1965-04-19'
        thread: cities-and-housing
        c: 'New York''s Landmarks Law, signed by Wagner (Check the day): the Landmarks Preservation Commission, his creation of 1962, may designate landmarks and historic districts, and none may be altered or pulled down without its leave. Brooklyn Heights the first district, Nov. 1965.'
        n: '[Wikipedia, "New York City Landmarks Preservation Commission"](https://en.wikipedia.org/wiki/New_York_City_Landmarks_Preservation_Commission). Check: Local Law No. 46 of 1965. See [[cal.1963-10-28.cities-and-housing-nyc]]. Names: Wagner (K–J Cong. III.F).'
        tags: [state:ny, city:nyc, name:wagner-robert-f-jr]
  - add:
      entry:
        id: cal.1965-06.crime-and-hijacking-ny
        when: June
        date: '1965-06'
        thread: crime-and-hijacking
        c: 'New York. Rockefeller signs the bill ending the death penalty but for the murder of a peace officer on duty and murder by a prisoner under a life sentence. The State''s last execution was Eddie Lee Mays''s, at Sing Sing, Aug. 15, 1963. Check the day.'
        n: '[Wikipedia, "Capital punishment in New York"](https://en.wikipedia.org/wiki/Capital_punishment_in_New_York). Check: *Laws of New York*, 1965. [[w.banner-death-penalty]]; [[w.connery-rockefeller-of-new-york]]. Names: Rockefeller (Opp. III.H).'
        tags: [state:ny, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1965-06-23.state-and-city-finance-nyc
        when: June 23
        date: '1965-06-23'
        thread: state-and-city-finance
        c: 'Albany, N.Y. The Assembly passes Wagner''s fiscal bills for the city''s budget of 1965–66, among them leave to borrow against future revenue to meet current expenses. Check the measures and the sums.'
        n: '[*New York Times*, June 23, 1965](https://www.nytimes.com/1965/06/23/archives/assembly-passes-city-fiscal-bills-session-near-end-wagner-package.html). [[w.morris-cost-of-good-intentions]]; [[w.shefter-political-crisis-fiscal-crisis]]. Names: Wagner (K–J Cong. III.F).'
        tags: [state:ny, city:nyc, name:wagner-robert-f-jr]
  - add:
      entry:
        id: cal.1965-06-24.mayors-nyc
        when: June 24
        date: '1965-06-24'
        thread: mayors
        also: [elections-1965]
        c: 'Buckley announces for mayor of New York, the Conservative Party''s candidate, against Lindsay. Check the date.'
        n: '[[w.buckley-unmaking-of-a-mayor]]; [[w.tanenhaus-buckley]]; [[w.mahoney-actions-speak-louder]]; [[w.cannato-ungovernable-city]]. See [[cal.1965-06-10.states-and-cities]]. Names: Buckley (Opp. III.F); Lindsay (Opp. III.D).'
        tags: [state:ny, city:nyc, name:buckley-william-f-jr, name:lindsay-john-v]
  - add:
      entry:
        id: cal.1965-08-01.state-and-city-finance-ny
        when: Aug. 1
        date: '1965-08-01'
        thread: state-and-city-finance
        c: 'New York''s first general State sales tax, 2 percent, in force, enacted in the spring at Rockefeller''s request. Check the rate, the dates and the votes.'
        n: 'Check: *Laws of New York*, 1965. [[w.connery-rockefeller-of-new-york]]; [[w.underwood-governor-rockefeller-in-new]]. Names: Rockefeller (Opp. III.H).'
        tags: [state:ny, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1965-09-14.mayors-nyc
        when: Sept. 14
        date: '1965-09-14'
        thread: mayors
        also: [elections-1965]
        c: 'New York''s Democratic primary for mayor. Beame, the city comptroller, 336,345, 44.8 percent; Screvane, president of the City Council, Wagner''s choice, 271,381, 36.2; Representative Ryan 113,738, 15.2; O''Dwyer 28,675, 3.8. Check the date.'
        n: '[Wikipedia, "1965 New York City mayoral election"](https://en.wikipedia.org/wiki/1965_New_York_City_mayoral_election). Check: the Board of Elections'' canvass. [[w.cannato-ungovernable-city]]; [[w.soyer-left-in-the-center]]; [[w.hentoff-political-life]]. See [[cal.1965-06-10.states-and-cities]]. Names: Beame, O''Dwyer (K–J Cong. III.K); Screvane, Wagner (K–J Cong. III.F).'
        tags: [state:ny, city:nyc, name:beame-abraham-d, name:screvane-paul-r, name:ryan-william-f, name:odwyer-paul, name:wagner-robert-f-jr]
  - add:
      entry:
        id: cal.1965-11-02.legislatures-ny
        when: Nov. 2
        date: '1965-11-02'
        thread: legislatures
        also: [elections-1965]
        c: 'New York. The legislature elected again, under the plan of December 1964, for one year, the only legislative election in an odd year since 1937: Republicans 37 of the Senate''s 65, Democrats a majority of the Assembly''s 165 (Check the counts). Brydges (R) the Senate''s leader from Jan. 5; Travia Speaker again.'
        n: '[Wikipedia, "176th New York State Legislature"](https://en.wikipedia.org/wiki/176th_New_York_State_Legislature); ["1965 New York state election"](https://en.wikipedia.org/wiki/1965_New_York_state_election). Check: the *Legislative Manual*, 1966. See [[cal.1965-04-14.legislatures-ny]]. Names: Brydges, Travia (K–J Cong. III.K).'
        tags: [state:ny, name:brydges-earl-w, name:travia-anthony-j]
  - add:
      entry:
        id: cal.1965-11-02.state-constitutions-ny
        when: Nov. 2
        date: '1965-11-02'
        thread: state-constitutions
        also: [conservation, elections-1965]
        c: 'New York''s voters call a constitutional convention for 1967, and approve a bond issue of $1 billion for sewage treatment, Rockefeller''s Pure Waters program. Check the votes.'
        n: 'Check: the *Legislative Manual*, 1966. [[w.dullea-charter-revision-in-the]]; [[w.nunez-new-york-state-constitutional]]; [[w.connery-rockefeller-of-new-york]]. Names: Rockefeller (Opp. III.H).'
        tags: [state:ny, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1965-11-02.mayors-ny
        when: Nov. 2
        date: '1965-11-02'
        thread: mayors
        also: [elections-1965]
        c: 'New York''s cities upstate. Buffalo: Sedita (D) elected mayor again. Syracuse: Walsh (R) reelected. Albany, N.Y.: Corning (D) elected to a seventh term. Check the votes.'
        n: '[Wikipedia, "Frank A. Sedita"](https://en.wikipedia.org/wiki/Frank_A._Sedita); ["William F. Walsh"](https://en.wikipedia.org/wiki/William_F._Walsh); ["Erastus Corning 2nd"](https://en.wikipedia.org/wiki/Erastus_Corning_2nd). Check: the county boards of elections'' canvasses. See [[cal.1961-11-07.mayors-ny]]. Names: Sedita, Corning (K–J Cong. III.F).'
        tags: [state:ny, city:buffalo, city:syracuse, city:albany, name:sedita-frank-a, name:walsh-william-f, name:corning-erastus]
  # ---------------------------------------------------------------- 1966
  - add:
      entry:
        id: cal.1966-03-22.legislatures-ny
        when: Mar. 22
        date: '1966-03-22'
        thread: legislatures
        also: [court]
        c: 'New York. The Court of Appeals adopts the districts drawn by its commission of five, Marden of the American Bar Association chairman, named Feb. 23 when the Republican Senate and the Democratic Assembly could not agree: a Senate of 57, an Assembly of 150, in force without the legislature''s vote.'
        n: '*Matter of Orans*, 17 N.Y.2d 107 (1966) (Check the cite). [*New York Times*, Mar. 15, 1966](https://www.nytimes.com/1966/03/15/archives/commission-ends-redistricting-job-legislators-await-details-of-plan.html). [[w.dullea-charter-revision-in-the]], 79. See [[cal.1965-11-02.legislatures-ny]].'
        tags: [state:ny]
  - add:
      entry:
        id: cal.1966-04-27.women-ny
        when: Apr. 27
        date: '1966-04-27'
        thread: women
        also: [states-and-cities]
        c: 'New York. Rockefeller signs the Divorce Reform Law, the first change in the grounds since adultery alone was made one in 1787: to it are added cruelty, abandonment for two years, imprisonment for three, and two years apart under a decree or agreement of separation; conciliation first. In force Sept. 1, 1967. Check the day.'
        n: 'Check: *Laws of New York*, 1966. [[w.jacob-silent-revolution]]. Names: Rockefeller (Opp. III.H).'
        tags: [state:ny, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1966-04.health-ny
        when: Apr.
        date: '1966-04'
        thread: health
        also: [medicare, welfare]
        c: 'New York''s Medicaid law, under Title XIX of the Social Security Amendments of 1965: medical care for those on relief and for the medically indigent, a family of four with a net income up to $6,000. Rockefeller signs. Check the day and the figure.'
        n: 'Check: *Laws of New York*, 1966. [[w.stevens-welfare-medicine-in-america]]; [[w.engel-poor-peoples-medicine]]; [[w.connery-rockefeller-of-new-york]]. See [[cal.1965-07-30.medicare]]. Names: Rockefeller (Opp. III.H).'
        tags: [state:ny, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1966-06-28.states-and-cities-nyc
        when: June 28
        date: '1966-06-28'
        thread: states-and-cities
        also: [robert-kennedy]
        c: 'Manhattan''s Democratic primary for Surrogate. Silverman, a Supreme Court justice, backed by Robert Kennedy, the reform clubs and the Liberals, beats Klein, the county organization''s choice, also endorsed by the Republicans (Check). Check the date and the vote.'
        n: '["The Making of the Surrogate," *Time*, July 8, 1966](https://web.archive.org/web/20121102175036/http://www.time.com/time/magazine/article/0,9171,835926,00.html); [Wikipedia, "Samuel Silverman"](https://en.wikipedia.org/wiki/Samuel_Silverman). [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]. Names: Silverman, Klein (K–J Cong. III.K); Robert Kennedy (K–J Cong. III.B).'
        tags: [state:ny, city:nyc, name:silverman-samuel-j, name:klein-arthur-g, name:kennedy-robert-f]
  - add:
      entry:
        id: cal.1966-07.state-and-city-finance-nyc
        when: July
        date: '1966-07'
        thread: state-and-city-finance
        c: 'Albany, N.Y. The legislature, before it adjourns July 6, lets New York City tax its residents'' incomes, and commuters'' earnings at a lower rate: Lindsay''s tax program, cut down. Check the dates, the rates and the city''s local law.'
        n: '[*New York Times*, July 7, 1966](https://www.nytimes.com/1966/07/07/archives/windup-in-albany-leaves-300-bills-leaders-evaluate-session-along.html). [[w.cannato-ungovernable-city]]; [[w.morris-cost-of-good-intentions]]; [[w.shefter-political-crisis-fiscal-crisis]]. See [[cal.1965-06-23.state-and-city-finance-nyc]]. Names: Lindsay (Opp. III.D).'
        tags: [state:ny, city:nyc, name:lindsay-john-v]
  - add:
      entry:
        id: cal.1966-07-11.crime-and-hijacking-nyc
        when: July 11
        date: '1966-07-11'
        thread: crime-and-hijacking
        also: [states-and-cities]
        c: 'New York. Lindsay''s civilian review board named: four civilians chosen by Lindsay, three police officers by Leary, the commissioner he brought from Philadelphia in February. The Patrolmen''s Benevolent Association, Cassese its president, petitions for a referendum to abolish it.'
        n: '[Wikipedia, "Howard R. Leary"](https://en.wikipedia.org/wiki/Howard_R._Leary); ["New York City Civilian Complaint Review Board"](https://en.wikipedia.org/wiki/New_York_City_Civilian_Complaint_Review_Board). [[w.cannato-ungovernable-city]]; [[w.black-people-and-the-police]]; [[w.flamm-law-and-order]]. See [[cal.1965-11-02.states-and-cities]]. Names: Lindsay (Opp. III.D); Leary, Cassese (K–J Cong. III.K).'
        tags: [state:ny, city:nyc, name:lindsay-john-v, name:leary-howard-r, name:cassese-john]
  - add:
      entry:
        id: cal.1966-09-07.governors-ny
        when: Sept. 7–8
        date: '1966-09-07'
        thread: governors
        also: [elections-1966]
        c: 'New York''s conventions. Democrats at Buffalo, Sept. 7: O''Connor, president of the City Council, nominated for governor on the first ballot over Samuels; Sept. 8, the delegates name Samuels for lieutenant governor against the leaders'' choice. Conservatives at Saratoga Springs, N.Y.: Adams, a professor, an enrolled Republican. Sept. 8, Republicans at Rochester renominate Rockefeller; the Liberals nominate Franklin D. Roosevelt Jr., 209 votes of 321 delegates present.'
        n: '[*New York Times*, Sept. 8, 1966](https://www.nytimes.com/1966/09/08/archives/2d-spot-at-issue-fourway-contest-for-lieutenant-governor-faces.html); [Sept. 8](https://www.nytimes.com/1966/09/08/archives/professor-named-by-conservatives-adams-to-run-for-governor-vietnam.html); [Sept. 9](https://www.nytimes.com/1966/09/09/archives/rockefeller-renominated-pledges-fight-on-bosses-republicans-pick.html); [Sept. 9](https://www.nytimes.com/1966/09/09/archives/rooseveltnamed-by-liberal-party-candidate-seeks-unity-after-getting.html). [[w.persico-imperial-rockefeller]]; [[w.smith-on-his-own-terms]]; [[w.connery-rockefeller-of-new-york]]; [[w.mahoney-actions-speak-louder]]. See [[cal.1962-11-06.governors-ny]]. Names: O''Connor (K–J Cong. III.F); Adams (K–J Cong. III.K); Rockefeller (Opp. III.H).'
        tags: [state:ny, name:oconnor-frank-d, name:samuels-howard-j, name:adams-paul-l, name:rockefeller-nelson, name:roosevelt-franklin-d-jr]
  - add:
      entry:
        id: cal.1966-09-13.states-and-cities-nyc
        when: Sept. 13
        date: '1966-09-13'
        thread: states-and-cities
        c: 'New York. Percy Sutton, Assemblyman from Harlem, chosen Manhattan''s borough president in Motley''s place, she having gone to the federal bench, Aug. 30.'
        n: '[Wikipedia, "Percy Sutton"](https://en.wikipedia.org/wiki/Percy_Sutton). See [[cal.1965-02-23.states-and-cities-nyc]]. Names: Sutton, Motley (K–J Cong. III.F).'
        tags: [state:ny, city:nyc, name:sutton-percy-e, name:motley-constance-baker]
  - add:
      entry:
        id: cal.1966-09.desegregation-schools-nyc
        when: Sept.
        date: '1966-09'
        thread: desegregation-schools
        c: 'New York. Intermediate School 201, in East Harlem, new and windowless, its pupils Negro and Puerto Rican: parents and community groups demand it be integrated or given a Negro principal and the community''s control; its opening put off. Check the dates.'
        n: '[[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]. See [[cal.1964-02-03.desegregation-schools]].'
        tags: [state:ny, city:nyc]
  - add:
      entry:
        id: cal.1966-11-08.governors-ny
        when: Nov. 8
        date: '1966-11-08'
        thread: governors
        also: [elections-1966]
        c: 'New York. Rockefeller (R) elected to a third term, 2,690,626, 44.6 percent; O''Connor (D) 2,298,363, 38.1; Adams (Conservative) 513,023, 8.5; Franklin D. Roosevelt Jr. (Liberal) 507,234, 8.4. The Conservatives take the third line on the ballot from the Liberals.'
        n: '[Wikipedia, "1966 New York state election"](https://en.wikipedia.org/wiki/1966_New_York_state_election). Check: the *Legislative Manual*, 1967. See [[cal.1966-09-07.governors-ny]]. Names: Rockefeller (Opp. III.H); O''Connor (K–J Cong. III.F); Adams (K–J Cong. III.K).'
        tags: [state:ny, name:rockefeller-nelson, name:oconnor-frank-d, name:adams-paul-l, name:roosevelt-franklin-d-jr]
  - add:
      entry:
        id: cal.1966-11-08.state-constitutions-ny
        when: Nov. 8
        date: '1966-11-08'
        thread: state-constitutions
        also: [legislatures, elections-1966]
        c: 'New York. Delegates to the constitutional convention of 1967 elected, fifteen at large from party lists and three from each Senate district: 99 Democrats, 82 Republicans, three Liberals, two Conservatives declared elected (Check). The legislature, under the court''s districts: Republicans keep the Senate, Democrats the Assembly (Check).'
        n: '[*New York Times*, Oct. 30, 1966](https://www.nytimes.com/1966/10/30/archives/atlarge-slate-may-control-constitutional-parley-15-to-be-elected.html); [Wikipedia, "1966 New York state election"](https://en.wikipedia.org/wiki/1966_New_York_state_election). [[w.dullea-charter-revision-in-the]]. See [[cal.1965-11-02.state-constitutions-ny]]; [[cal.1966-03-22.legislatures-ny]].'
        tags: [state:ny]
  - add:
      entry:
        id: cal.1966-11-08.states-and-cities-nyc
        when: Nov. 8
        date: '1966-11-08'
        thread: states-and-cities
        also: [state-constitutions, crime-and-hijacking, elections-1966]
        c: 'New York City. The Patrolmen''s Benevolent Association''s amendment to the charter carries, nearly two to one (Check the vote): the civilian review board abolished; complaints against the police reviewed by five of the department''s own employees, named by Leary.'
        n: '[Wikipedia, "Howard R. Leary"](https://en.wikipedia.org/wiki/Howard_R._Leary). Check: the Board of Elections'' canvass. [[w.cannato-ungovernable-city]]; [[w.flamm-law-and-order]]; [[w.black-people-and-the-police]]; [[w.freeman-working-class-new-york]]. See [[cal.1966-07-11.crime-and-hijacking-nyc]]. Names: Leary (K–J Cong. III.K).'
        tags: [state:ny, city:nyc, name:leary-howard-r]
  - add:
      entry:
        id: cal.1966-12-09.poverty-nyc
        when: Dec. 9
        date: '1966-12-09'
        thread: poverty
        also: [robert-kennedy]
        c: 'Brooklyn, P.S. 305. Robert Kennedy, with Lindsay and Javits, announces a program for Bedford-Stuyvesant: community corporations joined with private business. "The best of community action with the best of the private enterprise system."'
        n: '[Wikipedia, "Bedford Stuyvesant Restoration Corporation"](https://en.wikipedia.org/wiki/Bedford_Stuyvesant_Restoration_Corporation). [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]. Names: Robert Kennedy (K–J Cong. III.B); Lindsay (Opp. III.D); Javits (K–J Cong. III.E).'
        tags: [state:ny, city:nyc, name:kennedy-robert-f, name:lindsay-john-v, name:javits-jacob-k]
