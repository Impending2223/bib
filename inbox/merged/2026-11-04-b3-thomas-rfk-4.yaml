      when: July 1
      date: '1963-07-01'
      thread: press-and-broadcasting
      also: [robert-kennedy]
      c: 'Monday. Robert Kennedy summons Dom Frasca and James Horan of the *Journal-American* to his office, Courtney Evans of the FBI sitting in. The "high elected American official," they say, is the President. Kennedy: published "without any further check being made to get to the truth of the matter." The paper prints no more.'
      n: '[[w.thomas-robert-kennedy]], 254. To check: Courtney Evans to Director, "Interview by the Attorney General with Dom Frasca and James Horan of the N.Y. Journal-American, July 1, 1963," July 3, 1963, Hoover Official and Confidential files, FBI; Director, FBI, to Attorney General, "Christine Keeler" et al., July 5, 1963, "Bow Tie" File, FBI (cited by [[w.thomas-robert-kennedy]], 444). See [[cal.1963-06-29.press-and-broadcasting]]. Names: Robert Kennedy, Evans, Kennedy.'
      src:
        c: b9a50d21
        rows:
        - 'w.thomas-robert-kennedy 254: all'
        - 'via w.thomas-robert-kennedy 254 n.the-newspapermen-told-him: all'
      tags: ['name:kennedy-robert-f', 'name:evans-courtney-a', 'name:kennedy-john-f']
