    entry:
      id: cal.1963-07-03.baker
      when: July 3
      date: '1963-07-03'
      thread: baker
      also: [robert-kennedy]
      c: 'Hoover sends Robert Kennedy word of an informant''s report: Ellen Rometsch, twenty-seven, one of Bobby Baker''s "party girls," suspected by the FBI as an East German spy, has had a liaison with the President. Courtney Evans briefs Kennedy, who makes "particular note of Rometsch''s name."'
      n: '[[w.thomas-robert-kennedy]], 255. To check: Evans to Belmont, July 3, 1963, Hoover Official and Confidential files, FBI; Wannall to Sullivan, July 3, 1963, Rometsch FOIA/FBI (cited by [[w.thomas-robert-kennedy]], 444). See [[cal.1963-08.baker]]. Names: Hoover, Robert Kennedy, Baker, Kennedy, Evans.'
      src:
        c: ce504a47
        rows:
        - 'w.thomas-robert-kennedy 255: all'
        - 'via w.thomas-robert-kennedy 255 n.particular-note: all'
        - 'via w.thomas-robert-kennedy 255 n.ellen-rometsch-under-suspicion: all'
      tags: ['name:hoover-j-edgar', 'name:kennedy-robert-f', 'name:baker-robert-g', 'name:kennedy-john-f', 'name:evans-courtney-a']
