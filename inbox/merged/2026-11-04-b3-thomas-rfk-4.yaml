- add:
    entry:
      id: cal.1963-06-10.civil-rights-bill-3
      when: June 10
      date: '1963-06-10'
      thread: civil-rights-bill
      also: [alabama-schools]
      c: 'The Oval Office, filmed by Drew''s crew. Sorensen asks the President whether he will address the nation; Kennedy: "I don''t think so." Robert Kennedy: "I think it would be helpful. ... I don''t think you can get by without it."'
      n: '[[w.thomas-robert-kennedy]], 248. To check: Robert Drew, "Kennedy v. Wallace: A Crisis Up Close," the Time-Life film shown on ABC (cited by [[w.thomas-robert-kennedy]], 442). See [[cal.1963-06-11.civil-rights-bill]]. Names: Sorensen, Kennedy, Robert Kennedy. Check: the day; Thomas gives June 10, the day before the showdown.'
      src:
