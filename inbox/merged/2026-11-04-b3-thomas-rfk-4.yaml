        rows:
        - 'w.thomas-robert-kennedy 248: all'
        - 'via w.thomas-robert-kennedy 248 n.i-think-it-would-be-helpful: all'
      tags: ['name:sorensen-theodore-c', 'name:kennedy-john-f', 'name:kennedy-robert-f']
