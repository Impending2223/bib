      date: '1963-07-02'
      thread: robert-kennedy
      c: 'Robert Kennedy to the FBI: "Have we learned what Christine [Keeler] and her friend did here in the U.S., when they were here?"'
      n: '[[w.thomas-robert-kennedy]], 254. To check: Evans to Belmont, July 2, 1963, "Bow Tie" File, FBI (cited by [[w.thomas-robert-kennedy]], 444). See [[cal.1963-07-01.press-and-broadcasting]]. Names: Robert Kennedy.'
