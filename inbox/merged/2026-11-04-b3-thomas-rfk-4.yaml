- add:
    entry:
      id: cal.1963-04-14.alabama-birmingham
      when: Apr. 14
      date: '1963-04-14'
      thread: alabama-birmingham
      c: 'King in the Birmingham jail. Coretta King calls Robert Kennedy for help; he will look into it. To a friend of King''s: "I''m not sure we can get into prison reform right at this moment."'
      n: '[[w.thomas-robert-kennedy]], 242. See [[cal.1963-04-12.alabama]]. Names: Coretta Scott King, Robert Kennedy. Check: the day; Thomas does not date the call; Garrow, 243–44, as [[cal.1963-04-15.alabama-birmingham]]''s note cites it, gives Robert Kennedy''s call of Sunday, Apr. 14. Check: Thomas gives no source for the remark.'
      src:
        c: 1018bdee
        rows:
        - 'w.thomas-robert-kennedy 242: all'
      tags: ['name:king-coretta-scott', 'name:kennedy-robert-f', 'name:king-martin-luther-jr', 'state:al', 'city:birmingham']
    section: '196304'
- add:
    entry:
      id: cal.1963-05-12.civil-rights-the-executive
      when: May 12
      date: '1963-05-12'
      thread: civil-rights-the-executive
      also: [alabama-birmingham]
      c: 'The White House, Sunday, recorded: the President, Robert Kennedy, Marshall, McNamara and others on the Birmingham bombings. Marshall: "If that agreement blows up, the Negroes will be, uh . . ." The President: "Uncontrollable." Marshall: "And I think not only in Birmingham."'
      n: '[[w.thomas-robert-kennedy]], 243. To check: [John F. Kennedy, Nicholas Katzenbach, Robert F. Kennedy, Burke Marshall, Robert S. McNamara, Pierre Salinger, Theodore C. Sorensen and Earle G. Wheeler](https://prde.upress.virginia.edu/conversations/4006291), JFK Meeting Tape 86.2 (PRDE only). See [[cal.1963-05-11.alabama]]. Names: Kennedy, Robert Kennedy, Burke Marshall, McNamara.'
      src:
        c: 6008de0a
        rows:
        - 'w.thomas-robert-kennedy 243: all'
        - 'via w.thomas-robert-kennedy 243 n.uncontrollable: all'
      tags: ['name:kennedy-john-f', 'name:kennedy-robert-f', 'name:marshall-burke', 'name:mcnamara-robert-s', 'state:al', 'city:birmingham']
    section: '196305'
