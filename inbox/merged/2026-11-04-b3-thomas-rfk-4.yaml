      when: Apr. 23
      date: '1963-04-23'
      thread: press-and-broadcasting
      also: [robert-kennedy]
      c: 'Robert Kennedy to Sidey, by letter, after his apology: "You have been a good friend of all of ours for a long time." "P.S., needless to say this was not mentioned to anyone else in my family."'
      n: '[[w.thomas-robert-kennedy]], 254. To check: Robert Kennedy to Sidey, Apr. 23, 1963, courtesy Hugh Sidey (cited by [[w.thomas-robert-kennedy]], 444). See [[cal.1963-03.press-and-broadcasting-2]]. Names: Robert Kennedy, Sidey.'
      src:
        c: 6ab718f3
        rows:
        - 'w.thomas-robert-kennedy 254: all'
      tags: ['name:kennedy-robert-f', 'name:sidey-hugh']
