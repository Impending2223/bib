      when: May 24
      date: '1963-05-24'
      thread: desegregation-public-places
      c: New York, an office in midtown. Robert Kennedy presses the northern owners of chain stores to desegregate their lunch counters in the South. Fearing reporters, they wait a floor below until one signals the all-clear.
      n: '[[w.thomas-robert-kennedy]], 244. To check: [[w.robert-kennedy-in-his]], 181 (cited by [[w.thomas-robert-kennedy]], 244 n.). See [[cal.1963-05-24.civil-rights-the-executive]]. Names: Robert Kennedy.'
