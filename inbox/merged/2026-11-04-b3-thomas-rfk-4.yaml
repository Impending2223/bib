- add:
    entry:
      id: cal.1963-06-29.press-and-broadcasting
      when: June 29
      date: '1963-06-29'
      thread: press-and-broadcasting
      also: [robert-kennedy]
      c: 'Saturday. The *New York Journal-American*, Hearst''s, front page: a "high elected American official" a former paramour of Suzy Chang, one of two New York women named in the Profumo affair. Robert Kennedy calls the publishers.'
      n: '[[w.thomas-robert-kennedy]], 254. To check: [[w.hersh-dark-side-of-camelot]], 394; Kingsley Smith to Senator John J. Williams, Dec. 11, 1963, John J. Williams Papers, University of Delaware Library (cited by [[w.thomas-robert-kennedy]], 444). Names: Robert Kennedy. Check: Hersh, from James Horan''s son: the story spiked after one edition; Kingsley Smith, the publisher, to Williams: it ran in all editions (444).'
      src:
        c: 0b770ee4
        rows:
        - 'w.thomas-robert-kennedy 254: all'
      tags: ['name:kennedy-robert-f', 'city:nyc', 'state:ny']
    section: '196306'
