      c: 'The FBI to Robert Kennedy, "Re: Sit Ins; Birmingham Alabama; Racial Matters," from a bugged talk: Clarence Jones to Levison, of the Baldwin meeting, one guest called Kennedy "the worst illustration of white arrogant liberalism"; Levison: a good description of the Attorney General.'
