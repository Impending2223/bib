- add:
    entry:
      id: cal.1963-06-22.king
      when: June 22
      date: '1963-06-22'
      thread: king
      also: [civil-rights-the-executive]
      c: 'The White House, before the President''s meeting. Burke Marshall takes King aside: Levison must go, "a paid agent of the Soviet Communist apparatus." King disbelieving. Then Robert Kennedy, briefed to disclose next to nothing of the FBI''s sources; King asks for proof and observes that many are called Communists, Kennedy among them.'
      n: '[[w.thomas-robert-kennedy]], 252. To check: [[w.branch-parting-the-waters]], 835–38; [[w.robert-kennedy-in-his]], 143 (cited by [[w.thomas-robert-kennedy]], 443–44). See [[cal.1963-06-22.civil-rights-bill]]. Names: Burke Marshall, Martin Luther King, Levison, Robert Kennedy.'
      src:
        c: 867a367e
        rows:
        - 'w.thomas-robert-kennedy 252: all'
      tags: ['name:marshall-burke', 'name:king-martin-luther-jr', 'name:levison-stanley-d', 'name:kennedy-robert-f']
    section: '196306'
- add:
    entry:
