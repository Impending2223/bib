- add:
    entry:
      id: cal.1963-03.press-and-broadcasting-2
      when: Mar.
      date: '1963-03'
      thread: press-and-broadcasting
      also: [robert-kennedy]
      c: 'Hugh Sidey of Time-Life, in a memorandum to his editors not for publication: a racy party at Palm Beach at New Year''s. Robert Kennedy obtains it and summons Sidey: "I thought you were a different kind of guy, Sidey." Asked how he got it: "I have ways." Sidey apologizes in writing.'
      n: '[[w.thomas-robert-kennedy]], 253–54. To check: Hugh Sidey, interview (Evan Thomas) (cited by [[w.thomas-robert-kennedy]], 444). Names: Sidey, Robert Kennedy. Check: the day of the summons; Thomas dates the memorandum March.'
      src:
        c: f3fbf167
        rows:
        - 'w.thomas-robert-kennedy 253–54: all'
        - 'via w.thomas-robert-kennedy 253 n.sidey-nearly-broke-it: all'
      tags: ['name:sidey-hugh', 'name:kennedy-robert-f']
    section: '196303'
- add:
