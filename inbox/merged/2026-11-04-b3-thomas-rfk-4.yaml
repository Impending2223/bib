      when: June, late
      date: '1963-06'
      thread: king
      c: 'New Orleans, the federal courthouse. Burke Marshall gives Andrew Young the "proof" on Levison the President promised King: a comparison to Colonel Rudolf Abel, no other evidence.'
      n: '[[w.thomas-robert-kennedy]], 253. To check: [[w.branch-parting-the-waters]], 835–38; Stanley Levison, interviewed by Arthur Schlesinger, Schlesinger Papers, JFK Library (cited by [[w.thomas-robert-kennedy]], 444). See [[cal.1963-06-22.civil-rights-bill]]. Names: Burke Marshall, Young, Levison. Check: the day; Thomas: "a few days later."'
      src:
        c: 236f1d46
        rows:
        - 'w.thomas-robert-kennedy 253: all'
        - 'via w.thomas-robert-kennedy 253 n.king-and-kennedy-in-the-rose-garden: all'
      tags: ['name:marshall-burke', 'name:young-andrew-j-jr', 'name:levison-stanley-d']
    section: '196306'
