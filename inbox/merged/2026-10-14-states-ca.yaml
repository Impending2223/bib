        when: May 10
        date: '1966-05-10'
        thread: open-housing
        also: [court]
        c: '*Mulkey v. Reitman*, 64 Cal. 2d 529: the California Supreme Court holds Proposition 14, Art. I, § 26 of the State Constitution, void under the Fourteenth Amendment, the State having made itself a party to discrimination; a Negro couple''s suit under the Unruh Civil Rights Act against a landlord in Santa Ana to go forward (Check the place). Peek for the court, with four; White, sitting for Mosk, dissents.'
        n: '*Mulkey v. Reitman*, [64 Cal. 2d 529](https://static.case.law/cal-2d/64/html/0529-01.html) (1966). [[w.hosang-racial-propositions]]; [[w.brilliant-color-of-america-has]]. See [[cal.1964-11-03.cities-and-housing]].'
