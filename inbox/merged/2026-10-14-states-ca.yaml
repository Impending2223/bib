  - add:
      entry:
        id: cal.1966-09-27.states-and-cities-san-francisco
        when: Sept. 27–Oct. 2
        date: '1966-09-27'
        thread: states-and-cities
        c: 'San Francisco. A policeman shoots Matthew Johnson, 16, running from a stolen car at Hunters Point, Sept. 27; rioting at Hunters Point and in the Fillmore. Shelley asks for the Guard, 11:39 p.m.; Brown sends 2,000; a curfew. Sept. 28, police fire into the Bayview Community Center. Emergency ended Oct. 2. The police report: 457 arrested, 160 hurt.'
        n: 'San Francisco Police Department, *128 Hours* (1966) (Check the title), as [Wikipedia, "Hunters Point social uprising (1966)"](https://en.wikipedia.org/wiki/Hunters_Point_social_uprising_%281966%29) gives it. [[w.crowe-prophets-of-rage]]. See [[cal.1965-08-11.states-and-cities]]. Names: Brown (K–J Cong. III.F); Johnson (K–J Cong. III.K).'
        tags: [state:ca, city:san-francisco, name:johnson-matthew, name:shelley-john-f, name:brown-edmund-g]
  - add:
      entry:
        id: cal.1966-11-08.governors-ca
        when: Nov. 8
        date: '1966-11-08'
        thread: governors
        also: [elections-1966]
        c: 'California. Reagan (R) over Brown (D), 3,742,913 to 2,749,174, 57.6 percent. Finch (R) lieutenant governor over Anderson (D), the incumbent.'
        n: 'Votes: [Cal. *Statement of Vote*, Nov. 8, 1966, p. 6](https://archive.org/details/californiastate196668cali/page/n51). See [[cal.1966-06-07.elections-1966]]. Names: Reagan (Opp. III.F); Brown (K–J Cong. III.F); Finch (Adm. III.F).'
        tags: [state:ca, name:reagan-ronald, name:brown-edmund-g, name:finch-robert-h, name:anderson-glenn-m]
  - add:
      entry:
        id: cal.1966-11-08.state-constitutions-ca
        when: Nov. 8
        date: '1966-11-08'
        thread: state-constitutions
        also: [legislatures, elections-1966]
        c: 'California. Proposition 1-A, Constitutional Revision, carries, 4,156,416 to 1,499,675, 73.5 percent: annual general sessions of the Legislature; members'' pay set by statute on a two-thirds vote; laws against conflicts of interest; the initiative statute''s signatures cut from 8 to 5 percent, the initiative to the Legislature dropped; a governor''s disability or vacancy provided for.'
        n: 'Votes and the ballot''s summary: [Cal. *Statement of Vote*, Nov. 8, 1966, p. 27](https://archive.org/details/californiastate196668cali/page/n72). Measure: [UC Law SF, California Ballot Propositions, 1966](https://repository.uclawsf.edu/ca_ballot_props/694/). [[w.boyarsky-big-daddy]]; [[w.cannon-ronnie-and-jesse]].'
        tags: [state:ca]
  - add:
      entry:
        id: cal.1966-11-08.state-constitutions-ca-2
        when: Nov. 8
        date: '1966-11-08'
        thread: state-constitutions
        also: [elections-1966]
        c: 'California. Proposition 16, the CLEAN initiative on obscenity, fails: "obscene" and "knowingly" redefined, the seizure of obscene matter allowed, a prosecutor who will not enforce the law compellable. Yes 2,533,921, no 3,271,308; 43.6 percent.'
        n: 'Votes and the ballot''s summary: [Cal. *Statement of Vote*, Nov. 8, 1966, p. 32](https://archive.org/details/californiastate196668cali/page/n77). Measure: [UC Law SF, California Ballot Propositions, 1966](https://repository.uclawsf.edu/ca_ballot_props/693/). [[w.strub-perversion-for-profit]].'
        tags: [state:ca]
  - add:
      entry:
        id: cal.1966-11-08.voting-rights-ca
        when: Nov. 8
        date: '1966-11-08'
        thread: voting-rights
        also: [state-constitutions, elections-1966]
        c: 'California. Proposition 15, to exempt from the State''s English literacy requirement for voting anyone fifty or older on June 27, 1952, and resident in the United States twenty years, fails: yes 2,334,084, no 2,986,829; 43.9 percent.'
        n: 'Votes and the ballot''s summary: [Cal. *Statement of Vote*, Nov. 8, 1966, p. 32](https://archive.org/details/californiastate196668cali/page/n77). Measure: [UC Law SF, California Ballot Propositions, 1966](https://repository.uclawsf.edu/ca_ballot_props/692/).'
        tags: [state:ca]
