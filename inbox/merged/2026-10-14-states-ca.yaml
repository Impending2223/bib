  # ---------------------------------------------------------------- 1960
  - add:
      entry:
        id: cal.1960-02-19.crime-and-hijacking-ca
        when: Feb. 19–Mar. 10
        date: '1960-02-19'
        thread: crime-and-hijacking
        also: [states-and-cities]
        c: 'Brown gives Chessman, under sentence of death since 1948, a sixty-day reprieve hours before his execution at San Quentin, Cal., and asks the Legislature, in special session, to abolish the death penalty. Mar. 10, the Senate Judiciary Committee holds the bill, 8–7 (Check the date and the vote).'
        n: 'Check: *Journal of the Senate*, 1960 First Extraordinary Session. [[w.hamm-rebel-and-a-cause]]; [[w.brown-public-justice-private-mercy]]; [[w.rarick-california-rising]]; [[w.banner-death-penalty]]; [[w.mandery-wild-justice]]. Names: Brown (K–J Cong. III.F); Chessman (K–J Cong. III.K).'
        tags: [state:ca, name:brown-edmund-g, name:chessman-caryl]
  - add:
      entry:
        id: cal.1960-04-27.states-and-cities-ca
        when: Apr. 27
        date: '1960-04-27'
        thread: states-and-cities
        also: [students]
        c: 'California. Brown signs the Donahoe Higher Education Act, the Master Plan for Higher Education in statute: the state colleges under trustees of their own; a Coordinating Council for Higher Education; the doctorate left to the University. The Plan''s pools: the top eighth of high school graduates for the University, the top third for the state colleges, the junior colleges open to all. Check the day.'
        n: 'Cal. Stats. 1960, 1st Ex. Sess., ch. 49 (Check). [[w.douglass-california-idea-and-american]]; [[w.kerr-gold-and-the-blue]]; [[w.rarick-california-rising]]. Names: Brown (K–J Cong. III.F).'
        tags: [state:ca, name:brown-edmund-g]
  - add:
      entry:
        id: cal.1960-05-02.crime-and-hijacking-ca
        when: May 2
        date: '1960-05-02'
        thread: crime-and-hijacking
        also: [states-and-cities]
        c: Chessman executed in the gas chamber at San Quentin, his appeals refused.
        n: 'See [[cal.1960-02-19.crime-and-hijacking-ca]]. Names: Chessman (K–J Cong. III.K).'
        tags: [state:ca, name:chessman-caryl]
  - add:
      entry:
        id: cal.1960-11-08.state-constitutions-ca
        when: Nov. 8
        date: '1960-11-08'
        thread: state-constitutions
        also: [state-and-city-finance, conservation, elections-1960]
        c: 'California. Proposition 1, the Water Resources Development Bond Act of 1959 (Burns–Porter), carries: $1.75 billion in bonds for the State Water Project, Feather River water to the San Joaquin Valley and Southern California. Yes 3,008,328, no 2,834,384: 51.5 percent.'
        n: 'Votes: [Cal. *Statement of Vote*, Nov. 8, 1960, p. 23](https://archive.org/details/stateofcaliforn195262cali/page/n348). Measure: [UC Law SF, California Ballot Propositions, 1960](https://repository.uclawsf.edu/ca_ballot_props/606/). [[w.hundley-great-thirst]]; [[w.rarick-california-rising]].'
        tags: [state:ca]
  - add:
      entry:
        id: cal.1960-11-08.legislatures-ca
        when: Nov. 8
        date: '1960-11-08'
        thread: legislatures
        also: [state-constitutions, elections-1960]
        c: 'California. Proposition 15, an initiative to redraw the State Senate''s forty districts, no county more than seven, twenty given to named counties, every senator elected in 1962, fails: yes 1,876,185, no 3,408,090; 35.5 percent. The Senate stays on the "federal plan" of 1926, Los Angeles County''s six million with one senator.'
        n: 'Votes: [Cal. *Statement of Vote*, Nov. 8, 1960, p. 30](https://archive.org/details/stateofcaliforn195262cali/page/n355). Measure: [UC Law SF, California Ballot Propositions, 1960](https://repository.uclawsf.edu/ca_ballot_props/623/). [[w.dixon-democratic-representation]]; [[w.hill-dancing-bear]].'
        tags: [state:ca]

  # ---------------------------------------------------------------- 1961
  - add:
      entry:
        id: cal.1961-04-04.mayors-los-angeles
        when: Apr. 4
        date: '1961-04-04'
        thread: mayors
        also: [elections-1961]
        c: 'Los Angeles, nonpartisan primary for mayor: Poulson, mayor since 1953, 39.7 percent; Yorty, once a Representative, 27.1; Councilman McGee 25.6; six others. Poulson and Yorty to a runoff, May 31.'
        n: 'Votes: [Wikipedia, "1961 Los Angeles mayoral election"](https://en.wikipedia.org/wiki/1961_Los_Angeles_mayoral_election), from Our Campaigns; Check: the City Clerk''s canvass. [[w.bollens-yorty]]; [[w.sonenshein-politics-in-black-and]]. Names: Poulson, Yorty (K–J Cong. III.F); McGee (K–J Cong. III.K).'
        tags: [state:ca, city:los-angeles, name:poulson-norris, name:yorty-sam, name:mcgee-patrick-d]
  - add:
      entry:
        id: cal.1961-05.antisubversion-ca
        when: May
        date: '1961-05'
        thread: antisubversion
        also: [students]
        c: 'California. The Senate''s Fact-Finding Subcommittee on Un-American Activities, Burns chairman, its eleventh report, to the Legislature: the Communist Party "has steadily been gaining strength"; the student riots at the HUAC hearings in San Francisco, May 1960; SLATE and the student groups at Berkeley; the University of California. Check the month: the report cites events to Apr. 26.'
        n: '[*Un-American Activities in California, 1961: Report of the Senate Fact-Finding Subcommittee on Un-American Activities*](https://archive.org/details/1961ReportOfCaliforniaSenateFactfindingSubcommitteeOnUnAmericanActivities) (1961). [[w.heale-mccarthys-americans]]; [[w.rorabaugh-berkeley-at-war]]. See [[cal.1960-05-12.students]]. Names: Burns (K–J Cong. III.K).'
        tags: [state:ca, city:berkeley, city:san-francisco, name:burns-hugh-m]
  - add:
      entry:
        id: cal.1961-09.legislatures-ca
        when: Sept.
        date: '1961-09'
        thread: legislatures
        c: California. Unruh, Assemblyman from Los Angeles County, elected Speaker of the Assembly. Check the day.
        n: '[[w.boyarsky-big-daddy]]; [[w.cannon-ronnie-and-jesse]]. Names: Unruh (Cong. III.I).'
        tags: [state:ca, name:unruh-jesse-m]

  # ---------------------------------------------------------------- 1962
  - add:
      entry:
        id: cal.1962-11-06.governors-ca
        when: Nov. 6
        date: '1962-11-06'
        thread: governors
        also: [elections-1962]
        c: 'California. Brown (D) re-elected over Nixon (R), 3,037,109 to 2,740,351, 51.9 percent; Nixon 46.8.'
        n: 'Votes: [Cal. *Statement of Vote*, Nov. 6, 1962, p. 4](https://archive.org/details/castatem196264cali/page/n11). [[w.hill-dancing-bear]]; [[w.schuparra-triumph-of-the-right]]; [[w.farrell-richard-nixon]]. See [[cal.1962-06-05.elections-1962]]. Names: Brown (K–J Cong. III.F); Nixon (Opp. III.E).'
        tags: [state:ca, name:brown-edmund-g, name:nixon-richard-m]
  - add:
      entry:
        id: cal.1962-11-06.legislatures-ca
        when: Nov. 6
        date: '1962-11-06'
        thread: legislatures
        also: [state-constitutions, elections-1962]
        c: 'California. Proposition 23, an initiative constitutional amendment to reapportion the State Senate, fails: yes 2,181,758, no 2,495,440; 46.6 percent.'
        n: 'Votes: [Cal. *Statement of Vote*, Nov. 6, 1962, p. 33](https://archive.org/details/castatem196264cali/page/n40). Measure: [UC Law SF, California Ballot Propositions, 1962](https://repository.uclawsf.edu/ca_ballot_props/654/). [[w.dixon-democratic-representation]]. See [[cal.1960-11-08.legislatures-ca]].'
        tags: [state:ca]
  - add:
      entry:
        id: cal.1962-11-06.antisubversion-ca
        when: Nov. 6
        date: '1962-11-06'
        thread: antisubversion
        also: [state-constitutions, elections-1962]
        c: 'California. Proposition 24, "Subversive Activities," the initiative constitutional amendment called the Francis amendment, fails: yes 1,978,520, no 2,928,350; 40.3 percent.'
        n: 'Votes: [Cal. *Statement of Vote*, Nov. 6, 1962, p. 34](https://archive.org/details/castatem196264cali/page/n41). Measure: [UC Law SF, California Ballot Propositions, 1962](https://repository.uclawsf.edu/ca_ballot_props/655/). [[w.heale-mccarthys-americans]]; [[w.schuparra-triumph-of-the-right]].'
        tags: [state:ca]

  # ---------------------------------------------------------------- 1963
  - add:
      entry:
        id: cal.1963-04-02.mayors-los-angeles
        when: Apr. 2
        date: '1963-04-02'
        thread: mayors
        also: [elections-1963]
        c: 'Los Angeles City Council, 10th district: Bradley over the appointed incumbent, two elections, for the unexpired term, 17,760 to 10,540, 62.8 percent, and for the full term, 17,552 to 10,400. Sworn Apr. 15, the first Negro elected to the council.'
        n: 'Votes: [Wikipedia, "Tom Bradley (mayor)"](https://en.wikipedia.org/wiki/Tom_Bradley_(mayor)); Check: the City Clerk''s canvass. [[w.sonenshein-politics-in-black-and]]; [[w.sides-l-a-city-limits]]. Names: Bradley (K–J Cong. III.K).'
        tags: [state:ca, city:los-angeles, name:bradley-tom]
  - add:
      entry:
        id: cal.1963-04-02.open-housing-berkeley
        when: Apr. 2
        date: '1963-04-02'
        thread: open-housing
        also: [state-constitutions]
        c: 'Berkeley. The city''s fair housing ordinance, passed by the council, repealed by the voters at referendum. Check the council''s date and the vote.'
        n: '[[w.hosang-racial-propositions]]; [[w.rorabaugh-berkeley-at-war]]; [[w.brilliant-color-of-america-has]].'
        tags: [state:ca, city:berkeley]
  - add:
      entry:
        id: cal.1963-06-21.open-housing-ca
        when: June 21
        date: '1963-06-21'
        thread: open-housing
        also: [legislatures]
        c: 'California. The Rumford Fair Housing Act, Rumford''s A.B. 1240, passes the Senate in the session''s last hours and is signed by Brown: discrimination by race, religion or national origin barred in the sale and rental of publicly assisted housing and of private dwellings of more than four units, the Fair Employment Practice Commission to enforce it. Check the day passed, the day signed, and the coverage.'
        n: 'Cal. Stats. 1963, ch. 1853 (Health & Saf. Code §§ 35700–35744) (Check). [[w.hosang-racial-propositions]]; [[w.brilliant-color-of-america-has]]; [[w.self-american-babylon]]; [[w.rarick-california-rising]]. Names: Rumford (K–J Cong. III.K); Brown (K–J Cong. III.F).'
        tags: [state:ca, name:rumford-william-byron, name:brown-edmund-g]
  - add:
      entry:
        id: cal.1963-07-30.legislatures-ca
        when: July 30–31
        date: '1963-07-30'
        thread: legislatures
        also: [state-and-city-finance]
        c: 'California. Unruh keeps the Assembly''s Republicans locked in the chamber overnight until they vote on the budget. Check the bill and the hours.'
        n: '[[w.boyarsky-big-daddy]]; [[w.cannon-ronnie-and-jesse]]. See [[cal.1961-09.legislatures-ca]]. Names: Unruh (Cong. III.I).'
        tags: [state:ca, name:unruh-jesse-m]
  - add:
      entry:
        id: cal.1963-09-17.mayors-san-diego
        when: Sept. 17
        date: '1963-09-17'
        thread: mayors
        also: [elections-1963]
        c: 'San Diego, nonpartisan primary for mayor, Dail not running: Councilman Curran 22.4 percent, Goodrich 21.0, two others over 17; eight more. Curran and Goodrich to a runoff, Nov. 5.'
        n: 'Votes: [Wikipedia, "1963 San Diego mayoral election"](https://en.wikipedia.org/wiki/1963_San_Diego_mayoral_election); Check: the City Clerk''s canvass. Names: Curran (K–J Cong. III.F); Goodrich (K–J Cong. III.K).'
        tags: [state:ca, city:san-diego, name:curran-frank, name:goodrich-murray-d]
  - add:
      entry:
        id: cal.1963-11-05.mayors-san-diego
        when: Nov. 5
        date: '1963-11-05'
        thread: mayors
        also: [elections-1963]
        c: 'San Diego. Curran elected mayor over Goodrich, 96,898 to 55,520, 63.6 percent.'
        n: 'Votes: [Wikipedia, "1963 San Diego mayoral election"](https://en.wikipedia.org/wiki/1963_San_Diego_mayoral_election); Check: the City Clerk''s canvass. See [[cal.1963-09-17.mayors-san-diego]]. Names: Curran (K–J Cong. III.F); Goodrich (K–J Cong. III.K).'
        tags: [state:ca, city:san-diego, name:curran-frank, name:goodrich-murray-d]
  - add:
      entry:
        id: cal.1963-11-05.mayors-san-francisco
        when: Nov. 5
        date: '1963-11-05'
        thread: mayors
        also: [elections-1963]
        c: 'San Francisco. Shelley, Representative since 1949, elected mayor, 120,560 of 240,768, 50.1 percent; Supervisor Dobbs 38.5; a third 11.5. Christopher, mayor since 1956, not running. Nov. 3, pickets arrested at Mel''s Drive-In on Geary Boulevard, a chain Dobbs co-owns, over its hiring of Negroes.'
        n: 'Votes: [Wikipedia, "1963 San Francisco mayoral election"](https://en.wikipedia.org/wiki/1963_San_Francisco_mayoral_election), from Our Campaigns; Check: the Registrar of Voters'' canvass. Mel''s: R. J. Moore, ["Mel''s Drive-In Protest 1963"](https://www.foundsf.org/index.php?title=Mel%E2%80%99s_Drive-In_Protest_1963) (FoundSF). [[w.hartman-city-for-sale]]; [[w.crowe-prophets-of-rage]]. See [[cal.1963-11-05.states-and-cities]]. Names: Dobbs (K–J Cong. III.K); Christopher (K–J Cong. III.K).'
        tags: [state:ca, city:san-francisco, name:shelley-john-f, name:dobbs-harold, name:christopher-george]

  # ---------------------------------------------------------------- 1964
  - add:
      entry:
        id: cal.1964-03-06.states-and-cities-san-francisco
        when: Mar. 6–7
        date: '1964-03-06'
        thread: states-and-cities
        also: [jobs-and-wages]
        c: 'San Francisco. The Ad Hoc Committee to End Discrimination pickets the Sheraton-Palace Hotel over the hotels'' hiring of Negroes and sits in at its doors; 167 arrested in the night, Savio among them. Mar. 7, in Shelley''s office, the Hotel Owners Association signs an agreement for 33 hotels.'
        n: 'Jo Freeman, ["Freedom Now! to Free Speech"](https://www.foundsf.org/index.php?title=Freedom_Now!_to_Free_Speech:_How_the_1963-64_Bay_Area_Civil_Rights_Demonstrations_Paved_the_Way_to_Campus_Protest) (FoundSF), from the *San Francisco Chronicle*, Mar. 7–10, 1964, which revised the count to 171. [[w.crowe-prophets-of-rage]]; [[w.brilliant-color-of-america-has]]; [[w.cohen-freedoms-orator]]. Names: Savio (K–J Cong. III.H).'
        tags: [state:ca, city:san-francisco, name:savio-mario, name:shelley-john-f]
  - add:
      entry:
        id: cal.1964-03-14.states-and-cities-san-francisco
        when: Mar. 14–Apr. 17
        date: '1964-03-14'
        thread: states-and-cities
        also: [jobs-and-wages]
        c: 'San Francisco, Auto Row on Van Ness Avenue: 107 arrested at the Cadillac agency, Mar. 14; 226 in the sit-ins of Apr. 11. Apr. 17, the Lincoln-Mercury dealer settles; the dealers and the demonstrators give pledges on hiring to the mayor''s interim committee on human relations (Check the day).'
        n: 'Jo Freeman, ["Freedom Now! to Free Speech"](https://www.foundsf.org/index.php?title=Freedom_Now!_to_Free_Speech:_How_the_1963-64_Bay_Area_Civil_Rights_Demonstrations_Paved_the_Way_to_Campus_Protest) (FoundSF). See [[cal.1964-03-06.states-and-cities-san-francisco]].'
        tags: [state:ca, city:san-francisco, name:shelley-john-f]
  - add:
      entry:
        id: cal.1964-06-02.elections-1964-ca
        when: June 2
        date: '1964-06-02'
        thread: elections-1964
        also: [states-and-cities]
        c: 'California''s Senate primaries. Democratic: Salinger, the President''s press secretary, 1,177,517, 44.3 percent; Cranston, State Controller, endorsed by the California Democratic Council, 1,037,748, 39.0; Engle, who withdrew Apr. 28, 119,967. Republican: Murphy 1,121,591, 54.1 percent of the three; Leland Kaiser 689,323.'
        n: 'Votes: [Cal. *Statement of Vote*, June 2, 1964, p. 8](https://archive.org/details/castatem196264cali/page/n127). [[w.hill-dancing-bear]]; [[w.schuparra-triumph-of-the-right]]. See [[cal.1964-06-02.elections-1964]]. Names: Salinger (K–J Adm. III.B); Murphy (Opp. III.B).'
        tags: [state:ca, name:salinger-pierre, name:cranston-alan, name:engle-clair, name:murphy-george]
  - add:
      entry:
        id: cal.1964-11-03.state-constitutions-ca
        when: Nov. 3
        date: '1964-11-03'
        thread: state-constitutions
        also: [press-and-broadcasting, elections-1964]
        c: 'California. Proposition 15, the "Free Television Act," an initiative against pay television: a charge for programs carried into the home contrary to public policy. Yes 4,515,013, no 2,286,775: 66.4 percent. The same day, Proposition 14, against the Rumford Act, carries.'
        n: 'Votes: [Cal. *Statement of Vote*, Nov. 3, 1964, p. 26](https://archive.org/details/castatem196264cali/page/n174). Measure: [UC Law SF, California Ballot Propositions, 1964](https://repository.uclawsf.edu/ca_ballot_props/673/). See [[cal.1964-11-03.cities-and-housing]].'
        tags: [state:ca]

  # ---------------------------------------------------------------- 1965
  - add:
      entry:
        id: cal.1965-04-06.mayors-los-angeles
        when: Apr. 6
        date: '1965-04-06'
        thread: mayors
        also: [elections-1965]
        c: 'Los Angeles. Yorty re-elected mayor in the primary, 392,775 of 677,969, 57.9 percent; James Roosevelt, who left the House for the race, 247,313, 36.5; McGee 4.8; five others.'
        n: 'Votes: [Wikipedia, "1965 Los Angeles mayoral election"](https://en.wikipedia.org/wiki/1965_Los_Angeles_mayoral_election), from Our Campaigns; Check: the City Clerk''s canvass. [[w.bollens-yorty]]. See [[cal.1961-04-04.mayors-los-angeles]]. Names: Yorty (K–J Cong. III.F); McGee (K–J Cong. III.K).'
        tags: [state:ca, city:los-angeles, name:yorty-sam, name:roosevelt-james, name:mcgee-patrick-d]
  - add:
      entry:
        id: cal.1965-09-01.legislatures-ca
        when: Sept. 1
        date: '1965-09-01'
        thread: legislatures
        c: '*Silver v. Brown*, 63 Cal. 2d 270: the California Supreme Court, without dissent, finds both houses malapportioned (the Assembly''s largest district 306,191, its smallest 72,105), the federal court''s deadline of July 1 having passed with the Senate unreapportioned. The Legislature to act by Dec. 9; else the court''s own plans. No district more than 15 percent from the ideal; a majority of each house from districts of at least 48 percent of the people.'
        n: '*Silver v. Brown*, [63 Cal. 2d 270](https://static.case.law/cal-2d/63/html/0270-01.html) (1965); *Jordan v. Silver*, [381 U.S. 415](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381415/usrep381415.pdf) (1965) (the federal court''s judgment affirmed, June 1). [[w.dixon-democratic-representation]]; [[w.baker-reapportionment-revolution]]; [[w.ansolabehere-end-of-inequality-2008]]; [[w.boyarsky-big-daddy]]. See [[cal.1964-06-15.court]]; [[cal.1962-11-06.legislatures-ca]].'
        tags: [state:ca, name:brown-edmund-g]
  - add:
      entry:
        id: cal.1965-09-08.jobs-and-wages-ca
        when: Sept. 8–16
        date: '1965-09-08'
        thread: jobs-and-wages
        c: 'Delano, Cal. Filipino grape pickers of the AFL-CIO''s Agricultural Workers Organizing Committee strike the table-grape growers. Sept. 16, Chavez''s National Farm Workers Association votes to join them.'
        n: '[[w.pawel-crusades-of-cesar-chavez]]; [[w.bardacke-trampling-out-the-vintage]]. Names: Chavez (K–J Cong. III.H).'
        tags: [state:ca, name:chavez-cesar]
  - add:
      entry:
        id: cal.1965-09-17.conservation-ca
        when: Sept. 17
        date: '1965-09-17'
        thread: conservation
        also: [states-and-cities]
        c: 'The McAteer–Petris Act in force: a San Francisco Bay Conservation and Development Commission to plan for the bay and meanwhile to permit or refuse its filling. Check the dates of passage and signing.'
        n: 'Cal. Stats. 1965 (Check the chapter). [[w.walker-country-in-the-city]].'
        tags: [state:ca, city:san-francisco, city:oakland]
  - add:
      entry:
        id: cal.1965-10-21.legislatures-ca
        when: Oct. 21–27
        date: '1965-10-21'
        thread: legislatures
        c: 'California. In special session from Sept. 17, the Legislature passes its reapportionment of both houses by population, Oct. 21; Brown signs, Oct. 27. Los Angeles County''s one senator becomes fourteen (Check). The "federal plan" Senate ended.'
        n: 'Cal. Stats. 1965, 2d Ex. Sess., ch. 3, as *Silver v. Brown*, [63 Cal. 2d 841](https://static.case.law/cal-2d/63/html/0841-01.html) (1966), gives the dates. See [[cal.1965-09-01.legislatures-ca]]. Names: Brown (K–J Cong. III.F).'
        tags: [state:ca, name:brown-edmund-g]
  - add:
      entry:
        id: cal.1965-12-02.states-and-cities-los-angeles
        when: Dec. 2
        date: '1965-12-02'
        thread: states-and-cities
        c: 'The Governor''s Commission on the Los Angeles Riots, McCone chairman, reports: *Violence in the City—An End or a Beginning?*, 101 pages. Unemployment, the schools, and the conditions of life in Watts the causes. Check its recommendations: jobs, preschool, the police.'
        n: 'Governor''s Commission on the Los Angeles Riots, [*Violence in the City—An End or a Beginning?*](https://archive.org/details/ViolenceInCity) (1965). [[w.fogelson-white-on-black]]; [[w.horne-fire-this-time]]; [[w.sides-l-a-city-limits]]; [[w.bauman-race-and-the-war]]. See [[cal.1965-08-26.states-and-cities]]. Names: McCone (K–J Adm. III.I).'
        tags: [state:ca, city:los-angeles, name:mccone-john-a, name:brown-edmund-g]

  # ---------------------------------------------------------------- 1966
  - add:
      entry:
        id: cal.1966-01-11.legislatures-ca
        when: Jan. 11
        date: '1966-01-11'
        thread: legislatures
        c: '*Silver v. Brown*, 63 Cal. 2d 841: the California Supreme Court upholds the Legislature''s reapportionment, its drafting errors construed away; San Francisco''s and Alameda County''s senators at large no denial of equal protection.'
        n: '*Silver v. Brown*, [63 Cal. 2d 841](https://static.case.law/cal-2d/63/html/0841-01.html) (1966). See [[cal.1965-10-21.legislatures-ca]].'
        tags: [state:ca]
