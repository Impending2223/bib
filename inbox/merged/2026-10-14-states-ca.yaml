        when: Apr.
        date: '1966-04'
        thread: jobs-and-wages
        also: [cities-and-housing]
        c: 'Oakland. Foley''s Economic Development Administration announces some $23 million for the city: public works at the port and the airport, the employers'' hiring of the unemployed, Negroes most of all, the condition. Check the day and the figure.'
        n: '[[w.pressman-implementation]]; [[w.bradford-oaklands-not-for-burning]]; [[w.self-american-babylon]]. See [[cal.1965-08-26.jobs-and-wages]].'
