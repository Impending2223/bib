        also: [crime-and-hijacking]
        c: Los Angeles. Parker, chief of police since 1950, dies.
        n: '[[w.felker-kantor-policing-los-angeles]]; [[w.domanick-to-protect-and-to]]. See [[cal.1965-08-11.states-and-cities]]. Names: Parker (K–J Cong. III.K).'
