      c: '*New York Times*, page one, Halberstam''s dispatch of Aug. 21 on the pagoda raids: hundreds of monks arrested, many beaten; at Huế "particularly bloody." The army, not Nhu, in the lead.'
      n: '[[w.moyar-triumph-forsaken]], 233 (Moyar disputes the account, 233–34). To check: *New York Times*, Aug. 22, 1963 (cited by [[w.moyar-triumph-forsaken]], 233 n.11). See [[cal.1963-08-21.vietnam]]. Names: Halberstam, Ngô Đình Nhu.'
