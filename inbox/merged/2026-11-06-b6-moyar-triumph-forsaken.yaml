      c: 'Tân Sơn Nhứt, night. Lodge, landing, passes Harkins and the officials waiting on the runway and spends his first five minutes with the American newsmen: they are a vital part of American democracy.'
      n: '[[w.moyar-triumph-forsaken]], 238. See [[cal.1963-08-21.vietnam]]. Names: Lodge, Harkins.'
