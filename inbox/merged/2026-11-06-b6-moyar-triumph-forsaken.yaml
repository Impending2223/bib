      date: '1963-08-23'
      thread: press-and-broadcasting
      also:
      - vietnam
      c: '*New York Times*, page one, Halberstam''s dispatch of Aug. 22: by "highly reliable sources," Nhu planned and carried out the raids and martial law without the army''s knowledge; Đôn not told; opposition "extremely widespread"; defections in II Corps reported.'
      n: '[[w.moyar-triumph-forsaken]], 233–34 (Moyar disputes it, 234). To check: *New York Times*, Aug. 23, 1963 (cited by [[w.moyar-triumph-forsaken]], 234 n.12). See [[cal.1963-08-21.vietnam]]. Names: Halberstam, Ngô Đình Nhu, Trần Văn Đôn.'
