      when: Nov. 20
      date: '1960-11-20'
      thread: vietnam
      c: 'Saigon. Carver finds in his mailbox a death warrant in his name, purportedly from the failed coup''s leaders. Colby shows it to Nhu: the United States will remove Carver and his family; Nhu agrees, and police escort them to their flight. By Colby''s account.'
      n: '[[w.moyar-triumph-forsaken]], 114 (by Rust). To check: [[w.rust-kennedy-in-vietnam]], 19 (cited by [[w.moyar-triumph-forsaken]], 114 n.70); [[w.colby-honorable-men]], 164 (cited by [[w.moyar-triumph-forsaken]], 114 n.69). See [[cal.1960-11-11.vietnam]]. Names: Carver, Colby, Ngô Đình Nhu.'
      src:
        c: d9687bb8
        rows:
        - 'w.moyar-triumph-forsaken 114: all'
      tags:
