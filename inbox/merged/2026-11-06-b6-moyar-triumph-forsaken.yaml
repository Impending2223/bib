      c: '*New York Times*, Halberstam''s dispatches of Aug. 27, 29 and 31: a "strikingly unpopular" government; key Vietnamese waiting for Washington''s sign it has had enough of the Ngô family; Dương Văn Minh "as close to an authentic hero as South Vietnam has."'
      n: '[[w.moyar-triumph-forsaken]], 234. To check: *New York Times*, Aug. 27, 29 and 31, 1963 (cited by [[w.moyar-triumph-forsaken]], 234 n.17). Check: which dispatch says what; Moyar quotes them together. See [[cal.1963-08-21.vietnam]]. Names: Halberstam, Dương Văn Minh.'
