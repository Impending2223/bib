      c: 'Early March. Finch, Nixon''s chief of staff, to Bixby, secretary of New York''s Republican committee: what could
        Rockefeller want, to chair the convention, the keynote, a part in the platform? Bixby: let Nixon call Rockefeller.
        Not heeded.'
