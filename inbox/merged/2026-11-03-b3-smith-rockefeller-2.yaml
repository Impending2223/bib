patch: b3-smith-rockefeller-2
by: 'agent (batch 3 resumed, gop: Smith, On His Own Terms)'
ops:
- cite:
    id: cal.1960-05-23.elections-1960
    item: '[[w.smith-on-his-own-terms]], 337 (the U-2 down May 1, the Paris conference wrecked; Rockefeller seizes on it to
      question the direction of American foreign policy)'
    units: A
- cite:
    id: cal.1960-06-08.elections-1960
    item: '[[w.smith-on-his-own-terms]], 339–41 (drafted with Hughes at Pocantico over Memorial Day; Hinman: the party would
      never forgive him; breakfast with Eisenhower that morning; 2,700 words, "We have come to a time that calls for plain
      talk"; no "banner aloft whose emblem is a question mark"; $3 billion more for defense, $500 million for civil defense;
      the *Herald Tribune*: "quite indefensible"; Nixon, in private, "a good swift kick"; Eisenhower: "I see the fine hand
      of Emmet in this")'
    units: A-D
- cite:
    id: cal.1960-07-22.elections-1960
    item: '[[w.smith-on-his-own-terms]], 343–45 (Nixon''s call to Brownell; Rockefeller''s terms, the meeting at his apartment
      at Nixon''s asking; Nixon by Eastern Airlines in the late afternoon, there after 7:30; second place offered, declined,
      "standby equipment," by Kissinger''s account foreign policy and the State''s patronage promised too; Percy on the telephone
      three hours; fourteen points, half on defense; "There must be no ceiling on America''s security")'
    units: A-B, E-F
- cite:
    id: cal.1960-05-01.elections-1960
    item: '[[w.smith-on-his-own-terms]], 336–37 (May 1, off the record to Washington reporters; three days later in public,
      "tremendous support"; Rockefeller: "Did he say what place?")'
- cite:
    id: cal.1960-05-12.republican-party
    item: '[[w.smith-on-his-own-terms]], 337 (Hinman to Rockefeller, May 12: refusing Morton''s offer "could badly aggravate
      the image of poor sportsmanship"; Nixon''s "stranglehold")'
- cite:
    id: cal.1960-05-30.elections-1960
    item: '[[w.smith-on-his-own-terms]], 339 (the Memorial Day weekend at Pocantico; a statement of "quite explicit challenge"
      to Nixon and three policy addresses; Hughes presses "the 1964 argument")'
- cite:
    id: cal.1960-06-11.elections-1960
    item: '[[w.smith-on-his-own-terms]], 341 (Eisenhower returns the call two days late: "positive, realistic terms rather
      than in terms of personal criticism"; "off again, on again, gone again, Finnegan"; prospects "very remote"; not "a lone
      wolfer—a La Follette"; "Don''t let anyone else write your speeches")'
- check:
    id: cal.1960-06-11.elections-1960
    text: 'Check: Smith, 341, has Rockefeller telephone June 9 and Eisenhower return the call two days later.'
- cite:
    id: cal.1960-07-08.elections-1960-5
    item: '[[w.smith-on-his-own-terms]], 342 (Brinton''s advertisements in twenty-one States; forty thousand replies in three
      days)'
- cite:
    id: cal.1960-07-18.elections-1960
    item: '[[w.smith-on-his-own-terms]], 342 (the command post in the Conrad Hilton; television bought for the eve of the
      convention)'
- cite:
    id: cal.1960-07-19.elections-1960-2
    item: '[[w.smith-on-his-own-terms]], 343 (to the 103 members of the platform committee; a polite reception, against the
      ardor shown Goldwater)'
- check:
    id: cal.1960-07-19.elections-1960-2
    text: 'Check: Smith, 343, puts Rockefeller''s concerns before the platform committee "On Monday, July 18."'
- cite:
    id: cal.1960-07.elections-1960-2
    item: '[[w.smith-on-his-own-terms]], 343 (July 7, three hours, the draft platform line by line)'
- cite:
    id: cal.1960-07.elections-1960-12
    item: '[[w.smith-on-his-own-terms]], 342 (the words; "I knew there would never be a draft, but I had to do something to
      make them listen to me")'
- cite:
    id: cal.1962-09-17.governors-ny
    item: '[[w.smith-on-his-own-terms]], 379 (the Harris poll for Morgenthau at Kennedy''s behest; Syracuse, Buckley of the
      Bronx needed; "Down with the bosses!"; Morgenthau on the second ballot at four in the morning; Donovan against Javits)'
    units: A-C
- cite:
    id: cal.1963-07-14.elections-1964
    item: '[[w.smith-on-his-own-terms]], 412 (Goldwater told Saturday, July 13, to expect a statement of "common interest";
      "the Republican Party is in real danger of subversion by a radical, well-financed and highly disciplined minority";
      "the tactics of totalitarianism"; "Birchers and others of the radical right lunatic fringe"; "to erect political power
      on the outlawed and immoral base of segregation")'
    units: A-B
