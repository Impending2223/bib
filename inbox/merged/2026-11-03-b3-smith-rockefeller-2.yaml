- cite:
    id: cal.1960-05-25.elections-1960-2
    item: '[[w.smith-on-his-own-terms]], 338–39 (Morhouse''s emergency meeting of the county chairmen at Albany, Nixon''s
      upstate tour in the offing; Rockefeller hints he would accept a draft and will go to the convention at the head of an
      uncommitted delegation)'
- check:
    id: cal.1960-05-25.elections-1960-2
    text: 'Check: Smith, 338–39, gives no day for the county chairmen''s meeting at Albany; whether it is this meeting.'
