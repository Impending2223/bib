    item: '[[w.smith-on-his-own-terms]], 343 (a wing of the Sheraton Towers; Wilson and Carlino on the platform committee;
      Hinman, Ronan, Perkins in the penthouse; the visitors'' lament, "We''d like to vote for Nelson Rockefeller, but we have
      given a commitment")'
- cite:
    id: cal.1960-05.elections-1960-2
    item: '[[w.smith-on-his-own-terms]], 337 (Rockefeller had suggested staying away from Chicago, the one way to avoid a
      stampede for second place)'
