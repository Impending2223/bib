- check:
    id: cal.1963-07-05.china
    text: 'Check: the day the talks opened and who spoke first: Wu Lengxi, MacFarquhar and the Deng Xiaoping nianpu have the first meeting on July 6, Suslov speaking, and Deng''s speech of nearly five hours at the second, July 8 (the variants); the delegation reached Moscow at 2:40 p.m. on July 5 ([[cal.1963-07-05.china-leadership-4]]).'
