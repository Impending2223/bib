- edit:
    id: cal.1963-07-19.goldwater-2
    base: 5ee118f2
    set:
      n: '[[w.novak-agony-of-the-g]], 215–16. After [[cal.1963-07-19.elections-1964|Rockefeller''s news conference]]: the words are "Goldwater''s reply to Rockefeller''s challenge," the challenge to disavow right-wing support made at that news conference ([[w.novak-agony-of-the-g]], 215). See [[cal.1963-07-19.elections-1964]]. Names: Goldwater, Rockefeller. Check: the day.'
- check:
    id: cal.1963-07-20.china-leadership-4
    text: 'Check: when the communiqué was revised: Yang Shangkun''s diary has the Chinese ask a twenty-minute recess of the ninth meeting to discuss the draft, and on resuming the passage on stopping the open polemic struck and agreement reached, the meeting rising at 11:30 a.m. ([[w.yang-shangkun-riji]], II, 299–300); Wu has the revision after the meeting.'
