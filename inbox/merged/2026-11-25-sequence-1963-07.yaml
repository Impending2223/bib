    remove:
    - cal.1963-07-12.china-leadership-7
    why: 'Yang Shangkun''s diary (II, 296, July 12) has "8时晚餐后又去使馆，李岩同志来谈话": Li Yan''s talk is at the evening visit to the embassy that the -7 line counts as its meeting "again after 8 p.m.", so the two are of the same hour and the one occasion, not one after the other. Li Yan''s talk keeps its own hour, 8 p.m.'
