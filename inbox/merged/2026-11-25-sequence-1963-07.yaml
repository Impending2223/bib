- edit:
    id: cal.1963-07-02.europe-and-the-alliance-kennedy-in-4
    base: 8efbff72
    set:
      n: '[[w.odonnell-johnny-we-hardly-knew]], 425–26 (O''Donnell''s and Powers''s account). After [[cal.1963-07-02.europe-and-the-alliance-kennedy-in-3|the North American College]]: the visit to NATO headquarters at Naples, after Rome, comes "before his departure to the United States," and from Naples they fly "directly to Washington" ([[w.odonnell-johnny-we-hardly-knew]], 425–26). See [[cal.1963-07-01.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
