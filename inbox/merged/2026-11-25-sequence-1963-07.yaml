- edit:
    id: cal.1963-07-16.europe-and-the-alliance
    base: 5be47384
    set:
      n: '[[w.poole-joint-chiefs-of-staff]], 209–10. After [[cal.1963-07-16.economy-2|McNamara''s memorandum]]: McNamara sent his recommendations to the White House with the Chiefs'' caveats attached, and Kennedy approved them on July 16 ([[w.poole-joint-chiefs-of-staff]], 210); the memorandum of that day is the one that makes them, the 23 B-47s and 32 C-130s among them, with the Chiefs'' concern set out ([FRUS 1961–63, IX, doc. 28](https://history.state.gov/historicaldocuments/frus1961-63v09/d28)). See [[cal.1963-07-16.japan]]. Names: Kennedy, McNamara.'
- follows:
    id: cal.1963-07-16.japan
    add:
    - cal.1963-07-16.economy-2
- edit:
    id: cal.1963-07-16.japan
    base: 8294abe1
    set:
      n: '[[w.poole-joint-chiefs-of-staff]], 291. After [[cal.1963-07-16.economy-2|McNamara''s memorandum]]: McNamara dropped the move of the Marine Air Wing, and on July 16 Kennedy approved the smaller steps ([[w.poole-joint-chiefs-of-staff]], 290–91); the memorandum of that day proposes the steps in Japan and leaves the wing''s move to a review ([FRUS 1961–63, IX, doc. 28](https://history.state.gov/historicaldocuments/frus1961-63v09/d28)). Names: Kennedy.'
