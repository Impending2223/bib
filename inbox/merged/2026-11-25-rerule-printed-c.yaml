      n: '[[w.zhu-de-nianpu-xinbian]], III, 1842. Made public: 2016. The order: the tower is at Jianshui, which Zhu De reached from Tonghai that day ([[w.zhu-de-nianpu-xinbian]], III, 1842). The order: after [[cal.1962-06-08.china-leadership-12]], the printed order alone ([[w.zhu-de-nianpu-xinbian]], III, 1842). Names: Zhu De.'
