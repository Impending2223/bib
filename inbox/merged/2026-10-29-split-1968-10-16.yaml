    set:
      c: 'Johnson, by conference call, to Humphrey, Nixon and Wallace, 11:41 a.m.: "our position ... today is exactly what it was the last time all three of you were briefed." Christian: no basic change, no breakthrough.'
      n: '[Johnson, Humphrey, Nixon and Wallace, 11:41 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-conference-call-richard-nixon-george-wallace), Conversation WH6810-04-13547 (Miller Center). FRUS 1964–68, VII, doc. [80](https://history.state.gov/historicaldocuments/frus1964-68v07/d80). The President''s News Conference, [1968–69 Pub. Papers 1063](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=373) (Oct. 24, 1968) (Christian''s statement; Check the day). [[w.dallek-flawed-giant]], 583 (the conference call). [[w.nixon-rn]], 325 (the conference call, by Nixon''s account). To check: Territo to Johnson, Nov. 3, 1968, Reference File: Anna Chennault, LBJ Library; William Bundy''s letter, *New York Times*, June 13, 1991 (cited by [[w.dallek-flawed-giant]], 583). See [[cal.1968-09-07.vietnam]]. Names: Johnson, Humphrey, Nixon, Wallace, Christian. Check: Dallek, 583, after William Bundy, has Johnson telling the candidates he was
        ready to stop the bombing, Hanoi meeting his conditions; the words quoted say the position unchanged.'
