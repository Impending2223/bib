      when: Jan. 25
      date: '1964-01-25'
      thread: transition-and-staff
      also:
      - latin-america
      c: 'Johnson to Thomas Mann by telephone, 12:20 p.m., for a Mexican American as ambassador to Mexico, Daniel Luevano
        of California. Mann: "the Mexicans don''t like what they call ''pochan.''" Johnson: "Go get me a good one. I want
        to help ''em. We''ve been miserable to the Mexicans."'
      n: '[[w.kotz-judgment-days]], 95. To check: [Johnson and Mann, 12:20 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-thomas-mann-january-25-1964),
        Tape WH6401.21, PNO 8 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 95 n.29). Names: Johnson, Mann,
        Luevano.'
      src:
        c: 1501d3b3
        rows:
        - 'w.kotz-judgment-days 95: all'
        - 'via w.kotz-judgment-days 95 n.29: all'
      tags:
      - name:johnson-lyndon-b
      - name:mann-thomas-c
      - name:luevano-daniel-m
- add:
