      - name:hoover-j-edgar
- cite:
    id: cal.1963-01-10.alabama-birmingham
    item: '[[w.kotz-judgment-days]], 78 (Levison with King at a secret SCLC meeting outside Savannah, against the President''s
      advice that King break with him; no date given)'
    units: A-B
- add:
    entry:
