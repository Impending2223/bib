      when: Jan.
      date: 1964-01
      thread: king
      also:
      - press-and-broadcasting
      c: '*Time* names King its Man of the Year for 1963. Hoover, on a memorandum circulated at FBI headquarters: "[*Time*]
        really had to reach deep into the garbage for this one."'
      n: '[[w.kotz-judgment-days]], 77. To check: the Church committee''s Final Report, bk. III, 83; [[w.oreilly-racial-matters-the-fbis]],
        136 (cited by [[w.kotz-judgment-days]], 77 n.47). Made public: Check; Kotz cites the Church committee''s Book III.
        Check: the day of the notation. Names: Martin Luther King, Hoover.'
      src:
        c: a2a36a14
        rows:
        - 'w.kotz-judgment-days 77: all'
        - 'via w.kotz-judgment-days 77 n.47a: B'
      tags:
