      when: Jan. 6
      date: '1964-01-06'
      thread: transition-and-staff
      c: 'Johnson to John Macy of the Civil Service Commission by telephone, 3:30 p.m., Jenkins joining, on the White House
        secretaries: "I want the five smartest, best-educated, fastest, prettiest secretaries in Washington. ... I want them
        that can work Saturday and Sunday."'
      n: '[[w.kotz-judgment-days]], 96. To check: [Johnson and Macy, 3:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-macy-and-walter-jenkins-january-6-1964),
        Tape WH6401.06, PNO 2 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 96 n.33). Names: Johnson, Macy,
        Jenkins.'
      src:
        c: ee951209
        rows:
        - 'w.kotz-judgment-days 96: all'
        - 'via w.kotz-judgment-days 96 n.33: all'
      tags:
      - name:johnson-lyndon-b
      - name:macy-john-w-jr
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1964-01-16.transition-and-staff
      when: Jan. 16
      date: '1964-01-16'
      thread: transition-and-staff
      c: 'Johnson to McClellan by telephone, 4:20 p.m., on Rowan''s appointment to the USIA, its money in McClellan''s appropriations
        subcommittee: "I don''t want you to cut his guts out ''cause he''s a Nigra."'
      n: '[[w.kotz-judgment-days]], 95. To check: [Johnson and McClellan, 4:20 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-mcclellan-january-16-1964),
        Tape WH6401.15, PNO 6 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 95 n.28). Check: Kotz tells it
        after the call to Russell of Jan. 20; the tape is of Jan. 16. See [[cal.1964-01-20.transition-and-staff]]. Names:
        Johnson, McClellan, Rowan.'
      src:
        c: cc42a9d7
        rows:
        - 'w.kotz-judgment-days 95: all'
