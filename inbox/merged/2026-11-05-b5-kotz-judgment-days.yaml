      when: Dec. 3
      date: '1963-12-03'
      thread: congress
      also:
      - republican-party-congress
      c: Dirksen brings Johnson a turkey from the National Turkey Growers' Association, with a note asking his help for an
        Illinois radio station owner whose license the Federal Communications Commission is about to revoke.
      n: '[[w.kotz-judgment-days]], 116. To check: Dirksen to O''Brien, Dec. 6, 1963; Manatos to O''Brien, Dec. 16, 1963 (a
