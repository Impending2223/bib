        the press conference). Check: the day; the Times reports the statement Nov. 20, 1. Check: Young, 315, gives King''s
        answer as Hoover''s remarks "inconceivable," not to be answered. To check: Baumgardner to Sullivan, Nov. 19, 1964,
        FK-537 (cited by [[w.branch-pillar-of-fire]], 527); NYT, Nov. 20, 1964, p. 1 (cited by [[w.branch-pillar-of-fire]],
        527; by [[w.kotz-judgment-days]], 230 n.5); [[w.garrow-bearing-the-cross]], 360 (cited by [[w.branch-pillar-of-fire]],
        527). See [[cal.1964-11-18.civil-rights-the-executive]]. Names: King, Hoover, Rustin.'
