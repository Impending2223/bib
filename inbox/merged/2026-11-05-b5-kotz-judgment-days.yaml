- add:
    entry:
      id: cal.1964-02-08.civil-rights-bill-3
      when: Feb. 8
      date: '1964-02-08'
      thread: civil-rights-bill
      c: 'House, Committee of the Whole, Title VII: Dowdy of Texas moves to add "age" to its bans on discrimination in employment.
