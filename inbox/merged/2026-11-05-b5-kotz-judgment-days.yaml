- add:
    entry:
      id: cal.1963-03-20.king
      when: Mar. 20
      date: '1963-03-20'
      thread: king
      also:
      - antisubversion
      c: 'Jack Childs, the FBI''s informant "Solo," reports a meeting of Mar. 19 between Levison and Lem Harris of the Communist
        Party: for a group of eleven former stalwarts, Levison calls the party "irrelevant" and "ineffective," its "vanguard
        leadership" in civil rights given up; even "token support" unlikely.'
      n: '[[w.kotz-judgment-days]], 73. To check: SAC New York to Director, FBI, Aug. 15, 1966, FBI file 100-392452, p. 14
        (a retrospective account; cited by [[w.kotz-judgment-days]], 73 n.27). Made public: Check; Kotz cites the FBI''s Levison
        file. Names: Levison.'
      src:
        c: cb7499ae
        rows:
        - 'w.kotz-judgment-days 73: all'
        - 'via w.kotz-judgment-days 73 n.27: all'
      tags:
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1963-06.king-2
      when: June
      date: 1963-06
      thread: king
      also:
      - antisubversion
      c: 'Childs to the FBI, from Lem Harris: the Levisons find the party has done "little, if anything," for the Negroes''
        civil rights; they are "severing themselves, financially and in a disciplinary way, from the Party. ... With respect
        to the Martin Luther King movement, they will act on their own initiative."'
      n: '[[w.kotz-judgment-days]], 73. To check: SAC New York to Director, FBI, Aug. 15, 1966, FBI file 100-3-104-34, pp.
        14–25 (cited by [[w.kotz-judgment-days]], 73 n.28). Made public: Check; Kotz cites the FBI''s Levison file. Check:
        the day. See [[cal.1963-03-20.king]]. Names: Levison.'
      src:
        c: bff260e6
        rows:
        - 'w.kotz-judgment-days 73: all'
        - 'via w.kotz-judgment-days 73 n.28: all'
      tags:
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1963-07.king-2
      when: July
      date: 1963-07
      thread: king
      also:
      - antisubversion
      c: 'Gus Hall, general secretary of the Communist Party, to Childs: the party has accepted "the fact that Stanley Levison
        and Roy Bennett have severed themselves from Party discipline."'
      n: '[[w.kotz-judgment-days]], 73–74. To check: SAC New York to Director, FBI, Aug. 15, 1966, FBI file 100-3-104-34 (cited
        by [[w.kotz-judgment-days]], 73–74 n.29). Made public: Check; Kotz cites the FBI''s Levison file. Check: the day.
        See [[cal.1963-03-20.king]]. Names: Levison.'
      src:
        c: 5f1b9f42
        rows:
        - 'w.kotz-judgment-days 73–74: all'
        - 'via w.kotz-judgment-days 74 n.29: all'
      tags:
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1963-09.king
      when: Sept.
      date: 1963-09
      thread: king
      also:
      - antisubversion
      c: Through "Solo's" contacts with Hall, the FBI hears that "the CP is not happy with Stan Levison," who rebuffs the
        party's orders and its efforts to renew contact.
      n: '[[w.kotz-judgment-days]], 73–74. To check: SAC New York to Director, FBI, Aug. 15, 1966, FBI file 100-3-104-34 (cited
        by [[w.kotz-judgment-days]], 73–74 n.29). Made public: Check; Kotz cites the FBI''s Levison file. Check: the day;
        Kotz: "By mid-September." See [[cal.1963-03-20.king]]. Names: Levison.'
