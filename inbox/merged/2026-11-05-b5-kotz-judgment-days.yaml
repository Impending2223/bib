- add:
    entry:
      id: cal.1963-11.king-2
      when: Nov.
      date: 1963-11
      thread: king
      also:
      - antisubversion
      c: 'Asked by FBI officials, Childs analyzes the Levisons and the party: they "used" it and its funds to build their
        own business; Levison''s criticism of its "ineptness" on civil rights an excuse for the break. Hall calls Levison
        "a dirty son of a bitch."'
      n: '[[w.kotz-judgment-days]], 74. To check: SAC New York to Director, FBI, Nov. 26, 1963, FBI file 100-3-116-573; SAC
        New York to Director, Aug. 15, 1966, FBI file 100-392452, pp. 20, 22–23 (cited by [[w.kotz-judgment-days]], 74 n.30).
        Made public: Check; Kotz cites the FBI''s Levison file. Check: the day; Kotz: "in November 1963." See [[cal.1963-03-20.king]].
        Names: Levison.'
      src:
        c: 00a73462
        rows:
        - 'w.kotz-judgment-days 74: all'
        - 'via w.kotz-judgment-days 74 n.30a: B'
        - 'via w.kotz-judgment-days 74 n.30b: A'
      tags:
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1963-08-22.king
      when: Aug. 22–23
      date: '1963-08-22'
      thread: king
      also:
      - march-on-washington
      c: 'Baumgardner to Sullivan, FBI Domestic Intelligence, two memoranda, "March on Washington, August 28, 1963, Possible
        Subversive Influence": Levison "does not consider himself to be under the control of the Party with respect to his
        dealings with King"; the party targets the 19 million Negroes, "it would be foolhardy on anybody''s part to ignore
        this very significant truth"; it "may fail dismally" or "may make prodigious strides."'
      n: '[[w.kotz-judgment-days]], 75. To check: Baumgardner to Sullivan, Aug. 22, 1963, FBI file 100-3-116-230; Baumgardner
        to Sullivan, Aug. 23, 1963, FBI file 100-3-116-253X (cited by [[w.kotz-judgment-days]], 75 nn.37–38). Made public:
        Check; Kotz cites the FBI''s files. Check: which words each memorandum holds. See [[cal.1963-08-30.king]]. Names:
        Sullivan, Levison.'
      src:
        c: 37cd91d9
        rows:
        - 'w.kotz-judgment-days 75: all'
        - 'via w.kotz-judgment-days 75 n.37a: all'
        - 'via w.kotz-judgment-days 75 n.37b: all'
      tags:
      - name:sullivan-william-c
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1964-01-17.congress
      when: Jan. 17
      date: '1964-01-17'
      thread: congress
      c: 'The first of the White House evenings for members of Congress and their wives, about fifty at a time, twice a week:
        cocktails, a briefing by officials in the projection room, Lady Bird Johnson''s tour of the living quarters for the
        wives, dinner and dancing in the East Room. By early spring nearly every member entertained.'
      n: '[[w.kotz-judgment-days]], 90–91. Check: the day; Kotz: "Starting on January 17." Names: Johnson.'
      src:
        c: 280bb1f2
        rows:
        - 'w.kotz-judgment-days 90–91: all'
      tags:
      - name:johnson-lyndon-b
