- add:
    entry:
      id: cal.1963-12.civil-rights-organizations-2
      when: Dec.
      date: 1963-12
      thread: civil-rights-organizations
      also:
      - civil-rights-bill
      c: 'Dorothy Height, president of the National Council of Negro Women, with Johnson. Johnson on Mary McLeod Bethune at
        the NYA: she "put my integration diapers on me during my NYA days"; "From that point on, I never questioned. I was
        an agent of the federal government."'
      n: '[[w.kotz-judgment-days]], 24–25. To check: Dorothy Height, interview by Kotz (cited by [[w.kotz-judgment-days]],
        25 n.28). Check: the day, and the month; Kotz gives neither, among Johnson''s meetings with the Negro leaders after
        the assassination. See [[cal.1963-11-29.civil-rights-bill]]. Names: Johnson.'
      src:
        c: 4427c3eb
        rows:
        - 'w.kotz-judgment-days 24–25: all'
        - 'via w.kotz-judgment-days 25 n.28: all'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1963-12-01.poverty
      when: Dec. 1
      date: '1963-12-01'
      thread: poverty
      c: 'The Elms, Sunday supper. Johnson with Elizabeth Wickenden and Arthur Goldschmidt, friends from the New Deal: "I
        feel a moral obligation to carry on the things that Kennedy proposed, but I have to have issues I can take on as my
        own. I have to get reelected in a year." Poverty perhaps his issue.'
      n: '[[w.kotz-judgment-days]], 27 (Kotz spells her Wickendon). To check: [[w.lemann-promised-land]], 142; Arthur Goldschmidt
        and Elizabeth Wickenden, oral history, tape 2, LBJ Library (cited by [[w.kotz-judgment-days]], 27 n.34). Check: the
        day; Kotz gives a Sunday supper at The Elms after Heller''s visit of Nov. 23, no date (Johnson at The Elms to Dec.
        7: Nov. 24 or Dec. 1). See [[cal.1963-11-23.poverty-2]]. Names: Johnson, Goldschmidt, Kennedy.'
      src:
        c: 1c4e5e2c
        rows:
        - 'w.kotz-judgment-days 27: all'
        - 'via w.kotz-judgment-days 27 n.34b: all'
      tags:
      - name:johnson-lyndon-b
      - name:goldschmidt-arthur-e
- add:
    entry:
      id: cal.1963-12.poverty-2
      when: Dec.
      date: 1963-12
      thread: poverty
      c: 'Johnson, by a public letter to the National Welfare Association: "a national assault on the causes of poverty."'
      n: '[[w.kotz-judgment-days]], 27. To check: [[w.dallek-flawed-giant]], 61 (cited by [[w.kotz-judgment-days]], 27 n.35);
        the letter (not in the Public Papers, 1963–64). Check: the day, and the body''s name; Kotz: "Less than two weeks after
        becoming president." See [[cal.1963-11-23.poverty-2]]. Names: Johnson.'
      src:
        c: f4cdecc4
        rows:
        - 'w.kotz-judgment-days 27: all'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1963-12.civil-rights-bill-4
      when: Dec.
      date: 1963-12
      thread: civil-rights-bill
      c: 'Douglas of Illinois at the LBJ Ranch, at Johnson''s invitation; Johnson apologizes for his treatment of him in the
        1950s. Douglas: "He said we''d had many disputes, but in looking back, he felt that it was mostly his own fault."'
      n: '[[w.kotz-judgment-days]], 30–31. To check: Paul Douglas, oral history, LBJ Library (cited by [[w.kotz-judgment-days]],
        30–31 nn.46–49). Check: the date; Kotz gives none, among Johnson''s approaches to the Senate liberals after the assassination
        (his first stay at the Ranch as President from Dec. 24). Names: Douglas, Johnson.'
      src:
        c: 72a13355
        rows:
        - 'w.kotz-judgment-days 30–31: all'
        - 'via w.kotz-judgment-days 30 n.46: all'
      tags:
      - name:douglas-paul-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1963-11.king
      when: Nov.
      date: 1963-11
      thread: king
      also:
      - civil-rights-bill
      c: 'Atlanta. With Wilkins and Whitney Young called to the White House, King''s advisers urge him to "send Johnson a
        message." Levison: the movement "can''t rely on Roy Wilkins alone." Clarence Jones calls Louis Martin of the Democratic
        National Committee; King asked to the Oval Office for Dec. 3, 11:30 a.m.'
      n: '[[w.kotz-judgment-days]], 42. To check: FBI file 100-111180-9-367a (the tap on Levison); Clarence Jones, interview
        by Kotz; the Daily Diary Backup, Dec. 1, 1963, LBJ Library (cited by [[w.kotz-judgment-days]], 42 nn.1–3). Made public:
        Check; Kotz cites the FBI''s Levison file. Check: the day; Kotz: within Johnson''s first ten days. See [[cal.1963-12-02.king]].
        Names: Martin Luther King, Wilkins, Whitney Young, Levison.'
      src:
        c: c1c6a793
        rows:
        - 'w.kotz-judgment-days 42: all'
        - 'via w.kotz-judgment-days 42 n.1: A-C'
        - 'via w.kotz-judgment-days 42 n.2: D'
        - 'via w.kotz-judgment-days 42 n.3: D'
      tags:
      - name:king-martin-luther-jr
      - name:wilkins-roy
      - name:young-whitney-m-jr
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1963-06.civil-rights-bill-4
      when: June
      date: 1963-06
      thread: civil-rights-bill
      c: Johnson takes half a dozen liberal Democratic senators to his vice presidential office off the Senate floor and tells
        them how he would steer the civil rights bill through Congress if he were still in charge.
      n: '[[w.kotz-judgment-days]], 63. To check: Eugene McCarthy, interview by Kotz (cited by [[w.kotz-judgment-days]], 63
        n.57). Check: the date; Kotz places it after the bill went to Congress, June 19, 1963, no date given. Names: Johnson.'
      src:
        c: 9587bee4
        rows:
        - 'w.kotz-judgment-days 63: all'
        - 'via w.kotz-judgment-days 63 n.57: all'
      tags:
      - name:johnson-lyndon-b
