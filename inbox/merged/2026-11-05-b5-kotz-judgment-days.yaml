      when: Feb. 3
      date: '1964-02-03'
      thread: transition-and-staff
      c: 'Johnson to McNamara by telephone, 6:20 p.m., for Luevano in a high post at Defense: "He''s a Mexican boy and we
        got ''em dying all over the world as privates but we never do put any of them in any of these top jobs."'
      n: '[[w.kotz-judgment-days]], 95 (Luevano sworn in as an Assistant Secretary of Defense, July 1, 1964). To check: [Johnson
