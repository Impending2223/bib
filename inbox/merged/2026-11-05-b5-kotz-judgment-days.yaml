- edit:
    id: cal.1964-06-23.vietnam
    base: 044c71a6
    set:
      c: 'Lodge resigns as Ambassador to South Vietnam, for "entirely personal reasons." Taylor to succeed him, U. Alexis
        Johnson as his deputy; Wheeler for Taylor as Chairman of the Joint Chiefs. Westmoreland had taken over the command
        in Saigon from Harkins, June 20. At the news conference, of the three missing in Mississippi: the FBI "making every
        effort to locate them"; "Several weeks ago I had asked them to anticipate the problems that would come from this,
        and to send extra FBI personnel into the area."'
      n: 'The President''s News Conference, [1963–64 Pub. Papers 802](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=886),
        808 (June 23, 1964); Remarks Upon Presenting the Distinguished Service Medal to General Harkins, [1963–64 Pub. Papers
        813](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=897) (June 24, 1964). [FRUS 1964–68,
        I, doc. 220](https://history.state.gov/historicaldocuments/frus1964-68v01/d220) (editorial note). [President''s Daily
        Diary, June 23, 1964](https://catalog.archives.gov/id/192440), images 1, 2 (LBJ Library; National Archives Catalog).
        [[w.cosmas-joint-chiefs-of-staff-2012]], 83–84; [[w.kabaservice-rule-and-ruin]], 109 (Lodge out, to campaign for Scranton:
        "There is a threshold below which no party should go"); [[w.mcnamara-in-retrospect]], ch. 4 (Lodge resigns for the
        Republican campaign; Taylor and Alex Johnson; Westmoreland for Harkins). [[w.macv-command-history-1964]], 188 (Westmoreland
        in command, June 20); [[w.novak-agony-of-the-g]], 442 (to campaign for Scranton); [[w.poole-joint-chiefs-of-staff]],
        5 (Taylor accepts June 23; Wheeler for Taylor); [[w.taylor-swords-and-plowshares]], 313–15 (Taylor chosen, his condition
        of a year; announced June 23; U. Alexis Johnson his deputy); [[w.kotz-judgment-days]], 161 (the answer on the three
        missing; no extra agents had in fact been sent). To check: [[w.johnson-right-hand-of-power]]; [[w.blair-lodge-in-vietnam]];
        [[w.nichter-last-brahmin]]; [[w.westmoreland-soldier-reports]]. Names: Lodge, U. Alexis Johnson, Taylor, Wheeler,
        Westmoreland, Harkins, Johnson.'
      also:
      - transition-and-staff
      - mississippi
      src:
        c: 8af6bcd7
        rows:
