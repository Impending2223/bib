      id: cal.1963-10.king-2
      when: Oct.
      date: 1963-10
      thread: king
      also:
      - antisubversion
      c: Gus Hall denounces the Levisons as "anti-Communist" and accuses them of influencing King to criticize anti-Semitism
        in the Soviet Union, by Childs's report.
      n: '[[w.kotz-judgment-days]], 73–74. To check: SAC New York to Director, FBI, Aug. 15, 1966, FBI file 100-3-104-34 (cited
        by [[w.kotz-judgment-days]], 74 n.29). Made public: Check; Kotz cites the FBI''s Levison file. Check: the day; Kotz:
        "in late October 1963." See [[cal.1963-03-20.king]]. Names: Levison, Martin Luther King.'
      src:
        c: e753555e
        rows:
        - 'w.kotz-judgment-days 73–74: all'
        - 'via w.kotz-judgment-days 74 n.29: all'
      tags:
      - name:levison-stanley-d
