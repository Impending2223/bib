ops:
- add:
    entry:
      id: cal.1963-11.civil-rights-bill
      when: Nov.
      date: 1963-11
      thread: civil-rights-bill
      c: 'The Elms, the first week. Johnson''s advisers on how he should handle civil rights; to one who cautions him against
        spending his early goodwill on the bill, Johnson: "Well, what the hell''s the Presidency for?"'
      n: '[[w.kotz-judgment-days]], 22. To check: [[w.miller-lyndon]], 337 (cited by [[w.kotz-judgment-days]], 22 n.19). Check:
        the day; Kotz gives "that first week." See [[cal.1963-11-22.civil-rights-bill]]. Names: Johnson.'
      src:
        c: f4374742
        rows:
        - 'w.kotz-judgment-days 22: all'
      tags:
      - name:johnson-lyndon-b
- cite:
    id: cal.1963-12-04.civil-rights-bill-3
    item: '[[w.kotz-judgment-days]], 22 (Farmer with Johnson in the Oval Office; the story of Zephyr Wright, his cook, kept
      from "whites only" restrooms; Johnson lobbying senators by telephone during the talk; no date given)'
    units: A-B
- src:
    id: cal.1963-12-04.civil-rights-bill-3
