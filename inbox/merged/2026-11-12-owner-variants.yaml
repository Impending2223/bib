patch: 2026-11-12-owner-variants
by: 'lead: the owner''s ruling of Nov. 12, wording variants go in if we quote either wording; the readers'' variants the b11 audits dropped as the same sense'
ops:
- variant:
    id: cal.1968-03-05.robert-kennedy
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: Edward Kennedy to Dutton at the outset, in his own office: "Bob''s just about made up his mind to run. The thing now is to make sense of it."'
    at: '54'
- variant:
    id: cal.1968-03-13.robert-kennedy
    unit: A
    witness: w.witcover-85-days
    reads: 'Witcover: to Donaldson, "I am actively reconsidering the possibilities that are available to me, and I imagine that other people around the country are doing the same"; to another newsman he was "reassessing the possibility of whether I will run against President Johnson."'
    at: '68'
- variant:
    id: cal.1968-03-16.robert-kennedy
    unit: C
    witness: w.witcover-85-days
    reads: 'Witcover: the cries from the crowd included "You''ll never make it, ya bum!"'
    at: '93'
- variant:
    id: cal.1968-03-21.robert-kennedy
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: "When we are told to forgo all dissent and division, we must ask: who is it that is truly dividing the country? It is not those who call for change, it is those who make present policy ..."'
    at: '109'
- variant:
    id: cal.1968-04.robert-kennedy-campaign-primaries-2
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: "Do you know there are more rats in New York than people, and there are nine million people there? Children spend their nights trying to keep rats from biting them ... You can smile. It''s true."'
    at: '156'
- variant:
    id: cal.1968-05-13.elections-1968
    unit: C
    witness: w.witcover-85-days
    reads: 'Witcover: "if you look at any regiment or division of paratroopers in Vietnam, forty-five percent of them are black."'
    at: '194'
- variant:
    id: cal.1968-05-14.robert-kennedy-campaign-2
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: "I think the people want to move in a different direction. We can''t have the politics of happiness and joy when we have so many problems in our own country."'
    at: '198'
- variant:
    id: cal.1968-05-21.robert-kennedy-campaign
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: "If I get beaten in a primary, I''m not a viable candidate. I might be a nice man ... I''d return to being unruthless if I lose in Oregon."'
    at: '207'
- variant:
    id: cal.1968-06-02.elections-1968
    unit: B
    witness: w.witcover-85-days
    reads: 'Witcover: after California Kennedy hoped he and McCarthy could "somehow join and try to bring together" all the anti-Administration forces.'
    at: '246'
- variant:
    id: cal.1968-06-05.robert-kennedy-2
    unit: C
    witness: w.witcover-85-days
    reads: 'Witcover: "I would hope now that the California primary is finished ... that we could concentrate on having a dialogue—or a debate, I hope—between the Vice President and perhaps myself on what direction we want to go in."'
    at: '264'
- variant:
    id: cal.1964-01-08.program
    unit: B
    witness: w.albert-little-giant-1990
    reads: 'Albert quotes Johnson: "this administration, here and now, declares unconditional war on poverty in America" (no "today")'
    at: '287'
- variant:
    id: cal.1960-11-08.elections-1960-count-13
    unit: C
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Johnson calls and Kennedy breaks the tension by quipping, "Well, I see you lost Ohio and I won Texas"'
    at: '96'
- variant:
    id: cal.1962-10-19.missile-crisis-warnings
    unit: D
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Kennedy to O''Donnell: "You call McNamara and tell him to straighten out Allen and Scott."'
    at: '251'
- variant:
    id: cal.1968-03-15.robert-kennedy-campaign-2
    unit: H
    witness: w.schlesinger-journals
    reads: 'Schlesinger: Kennedy, to Edward Kennedy, Sorensen, vanden Heuvel and Schlesinger at the breakfast table: "Look, fellows, I can''t do that. I can''t come out for McCarthy. Let''s not talk about that anymore. I''m going ahead, and there is no point in talking about anything else."'
    at: '283'
