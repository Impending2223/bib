- add:
    entry:
      id: cal.1962-02-21.china-leadership-3
      when: Feb. 21–23
      date: '1962-02-21'
      thread: china-leadership
      c: 'Xilou conference: Chen Yun, in a speech to the Standing Committee''s work conference, names five areas of crisis (grain output, capital investment, inflation, cash in the countryside, urban living standards); says 5 million tons of grain were imported last year and 4 million more are needed; proposes a recovery stage of three more years before development, more people out of the cities, control of cash, three jin of soybeans a month for each city resident, nylon socks, 40 to 50 million yuan of delicacies for high-priced restaurants, 200 jin of grain for every 100 jin of ginned cotton, and a turn of planners from industry to agriculture.'
