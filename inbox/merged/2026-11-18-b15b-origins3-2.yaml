- add:
    entry:
      id: cal.1962-05-07.china-leadership-2
      when: May 7
      date: '1962-05-07'
      thread: china-leadership
      c: The Finance and Economics Small Group's report to the work conference puts 1961 grain output at 142.5 million tons, 42.5 million below 1957, and rural grain per head at 150 kg; finds a four-year deficit of over 25 billion yuan and 41.7 million urban workers, 17.2 million above 1957; and holds that Sichuan and Heilongjiang are now deficit provinces, with 4 million tons of grain to be imported. It proposes overall balance, a cut in industry to help agriculture, and a revised 1962 plan with capital construction down almost a quarter, to 4.6 billion yuan.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 200–04. Made public: 1997. To check: [[w.zhongguo-tongji-nianjian-1983]], 158 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 201 n.59); [[w.zhongguo-tongji-nianjian-1983]], 158 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 201 n.60); [[w.walker-food-grain-procurement-and]], 30, 276 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 201 n.61); [[w.sichuan-sheng-qing-sichuan]], 234 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 201 n.62); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 65–67 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 202 n.63); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 67 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 202 n.64); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 67 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 202 n.65a); [[w.macfarquhar-origins-of-the-cultural]], II, 89, 129 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 202 n.65b); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 66–68 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 202 n.66); [[w.lardy-chen-yuns-strategy-for]], xv–xviii (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 203 n.67a); [[w.renmin-shouce-peoples-handbook]], 100–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 203 n.67b); [[w.zhongguo-tongji-nianjian-1983]], 245 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 203 n.68); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 68–69, 72 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 204 n.69). Check: the day of the report; the book says the officials read it for the first two days.'
