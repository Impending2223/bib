      when: Apr. 27
      date: '1961-04-27'
      thread: china-leadership
      c: 'The Anhui party sends Mao and others a report renaming the system the "guarantee labor and production responsibility system": big jobs assigned to collective work groups, small ones to households as responsibility fields, output agreed with both. It lists advantages and the disadvantage that some peasants call the system baochan daohu or fentian.'
