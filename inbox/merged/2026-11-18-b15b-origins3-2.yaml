      id: cal.1962-07.china-leadership-4
      when: July
      date: 1962-07
      thread: china-leadership
      c: 'Hu Kaiming, a first secretary in northwest Hebei, speaks to a north China agricultural conference and sends the speech to Mao: peasants lack enthusiasm for three reasons, procurement, prices and the lack of production responsibility systems; the work-point system, with 200 to 300 norms, is too complicated; he proposes a "three guarantees" system of small voluntary work groups, and accepts household guarantees only if the peasants insist.'
