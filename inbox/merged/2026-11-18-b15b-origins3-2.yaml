- add:
    entry:
      id: cal.1962-01-18.china-leadership-2
      when: Jan. 18
      date: '1962-01-18'
      thread: china-leadership
      c: 'Redrafting committee: Peng Zhen says the general line is easy to explain, the Great Leap Forward not; that in 1960 the agricultural disaster and the growth of the urban population were underestimated; that the eight-character program was empty talk for want of a directive, with no adjustment until the 1961 Lushan conference. Bo Yibo agrees the general line is the easier to defend. Liu Shaoqi closes the discussion: the Leap may still be named, but looked at in a new, historical way. Peng Zhen says the Center''s blame falls on the Secretariat and, if they deserve it, the Chairman, Liu Shaoqi and the other Standing Committee members; that Mao suggested a transition to communism in three to five years, and advocated universal mess-halls. Deng Xiaoping interrupts, citing Mao''s remark of Dec. 16 on the Secretariat''s report that no one is a sage and his shortcomings may be named. Peng adds that Mao should self-criticize for even a one percent error.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 155–58. Made public: 1997. To check: [[w.macfarquhar-origins-of-the-cultural]], II, 323 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 156 n.83); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 2–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 156 n.84a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 156 n.84b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1026 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 156 n.85); [[w.macfarquhar-origins-of-the-cultural]], I, 141–46 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 156 n.86); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.87a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.87b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1026–27 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.87c); [[w.macfarquhar-origins-of-the-cultural]], II, 130 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.87d); [[w.macfarquhar-secret-speeches-of-chairman]], 431, 433 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.88); [[w.chinese-law-and-government]], I, no. 4, 41–42 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.89); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.90a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.90b); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.91a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.91b); [[w.volkogonov-stalin]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.91c); [[w.remnick-review-of-volkogonov-stalin]], 14 (cited by 