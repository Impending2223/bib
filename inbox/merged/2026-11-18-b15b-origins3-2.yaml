      id: cal.1962-02-14.china-leadership
      when: Feb. 14
      date: '1962-02-14'
      thread: china-leadership
      c: 'The Center decides to press on with the cut in the urban population: a further 7 million people to leave the cities in the first half of 1962, over 5 million of them workers. Those who came before the end of 1957 are to be reassigned or given inducements to go home; workers settled with their families may choose.'
