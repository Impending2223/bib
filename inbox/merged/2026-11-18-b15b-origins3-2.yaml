      when: Feb. 26
      date: '1962-02-26'
      thread: china-leadership
      c: 'Li Xiannian, at the same State Council meeting, lists the measures to balance the accounts and cut currency: 2 billion yuan more of consumer goods, a wage bill within 22.4 billion yuan, a three-year deferral of 700 million yuan of promissory notes to peasants, an end to bonus prices for grain, high-priced goods sold in the villages, tighter central control of banks. He closes by calling the crisis secondary to the party''s successes.'
