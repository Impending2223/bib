- add:
    entry:
      id: cal.1962-07-11.china-leadership-4
      when: July 11
      date: '1962-07-11'
      thread: china-leadership
      c: Deng Zihui, in a speech to the Central Party School, urges responsibility systems with household guarantees of output and at least 80 percent of any excess to the household; private plots of up to 10 percent of land, lent land up to five years, all household land under 20 percent; procurement of 32.5 million tons; industrial certificates for peasants; country fairs; a cap on subsidized rural cadres, 150 labor days a year for a brigade cadre, 30 for a team cadre. He warns that otherwise the cadres will make China revisionist in twenty years.
