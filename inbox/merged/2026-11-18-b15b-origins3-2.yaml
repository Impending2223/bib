- add:
    entry:
      id: cal.1962-05-24.china-leadership-2
      when: May 24
      date: '1962-05-24'
      thread: china-leadership
      c: 'Deng Zihui, director of the Central Committee''s Rural Work Department, reports to the Center and Mao on problems in the communes: low attendance and efficiency, egalitarianism, cadre privileges; individual operation, in some form, is practised by 20 percent of peasant households, 60 percent in some xian. He asks that the land-reform settlement be the baseline for returning property, a law holding the rural settlement for thirty years, and a national grain procurement target of 35 million tons for three to five years.'
