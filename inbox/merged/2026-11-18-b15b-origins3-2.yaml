      when: May 11
      date: '1962-05-11'
      thread: china-leadership
      c: 'Deng Xiaoping to the work conference: rehabilitation of those hit in 1959–60 is too slow; perhaps 10 million cases need review, 400,000 so far in Henan; he urges the Sichuan method, complete and en masse, with no stain on records. He says those who fear the charge of rightism and hide problems are themselves rightist.'
