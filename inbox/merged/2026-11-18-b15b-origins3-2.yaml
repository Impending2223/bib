      id: cal.1962-01-17.china-leadership-3
      when: Jan. 17
      date: '1962-01-17'
      thread: china-leadership
      c: 'Redrafting committee, Seven Thousand Cadres Conference, Peking: Ke Qingshi, first speaker, asks whether the Twelve-Year Agricultural Program still stands; says 300 million tons of grain is not possible but 250 million is, and that East China alone could produce 200 million by 1967; asks whether Britain is still to be overtaken in fifteen years and whether to go all out. Liu Shaoqi, Zhou Enlai and others reply that the Program was not properly researched and its grain targets not scientific; Deng Xiaoping, that the higher the figures, the harder to reach them.'
