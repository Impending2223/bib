      id: cal.1961-07-24.china-leadership
      when: July 24
      date: '1961-07-24'
      thread: china-leadership
      c: 'The Anhui party''s written report renames the policy the field management responsibility system with bonuses and stresses the collective: production guaranteed by the team, big jobs by the work group, only field management by the household, a role for the brigade. Of Anhui''s teams, 66.5 percent now use the methods on their own initiative; the share is 70.8 percent by mid-August, 84.4 by mid-October, 90.1 by the end of the year.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 216. Made public: 1997. To check: [[w.nongye-jitihua-zhongyao-wenjian]], 503–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 216 n.34); [[w.nongye-jitihua-zhongyao-wenjian]], 508 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 216 n.35).'
