- add:
    entry:
      id: cal.1962-02.china-leadership-5
      when: Feb., early
      date: 1962-02
      at: before 1962-02-01
      thread: china-leadership
      c: 'Seven Thousand Cadres Conference: after Zeng Xisheng''s self-criticism, Liu Shaoqi, who has spent several long days with the Anhui delegation, gives his verdict: Anhui''s trouble is its first secretary''s hot temper and dictatorial style, which made the province an independent kingdom that refused to admit error and resisted central inspection. He says Zeng is not dismissed because Anhui is in bad straits, and blames him for turning permission to experiment in one district into a province-wide practice.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 217–18. Made public: 1997. To check: [[w.shaoqi-yanlun-ji-a-collection]], 227 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 217 n.42a); [[w.shaoqi-yanlun-ji-a-collection]], 227 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 217 n.42b); [[w.shaoqi-yanlun-ji-a-collection]], 227–29 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 218 n.43); [[w.shaoqi-yanlun-ji-a-collection]], 231–32 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 218 n.44); [[w.qi-qian-ren-dahui]], 35–36 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 218 n.45); [[w.shaoqi-yanlun-ji-a-collection]], 232 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 218 n.46). Names: Liu Shaoqi. Check: the day; Liu made two speeches to the Anhui caucus, one in January on the conference, one in February on Zeng.'
