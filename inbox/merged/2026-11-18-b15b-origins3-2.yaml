- add:
    entry:
      id: cal.1962-05-11.china-leadership-2
      when: May 11
      date: '1962-05-11'
      thread: china-leadership
      c: 'Liu Shaoqi to the work conference: every year since the Leap but one has ended with lower targets, the party has been leftist for years and should be rightist for a while; sending the cities'' people to the countryside is harder than the Leap; student riots are to be kept few and small, martial law and cut transport links if they come, and no shooting; the most difficult period is past only in a few areas, not in the cities and industry.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 204–05, 208. Made public: 1997. To check: [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 72–73 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 204 n.70); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 70–71 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 205 n.74a); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 446–47 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 205 n.74b); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 444–46, 445 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 208 n.89). Names: Liu Shaoqi. Check: the day; the book gives the four Standing Committee members'' speeches as the last day.'
