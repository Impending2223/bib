      c: 'After a major cadre conference, the Anhui party issues a self-criticism: the responsibility field system was in fact baochan daohu heading toward independent operation, the error blamed on Zeng Xisheng''s leadership; with the directive on team accounting added to the Twelve and Sixty Articles, the lack of correspondence between work and reward and egalitarianism within teams can be solved; it lays down how the system is to be amended in 1962–63.'
