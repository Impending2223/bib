      when: Mar. 20
      date: '1961-03-20'
      thread: china-leadership
      c: 'Canton: Zeng Xisheng writes to Mao and other senior leaders to explain Anhui''s system: the province resisted the masses'' wish to fix output quotas by households; collective agriculture remains dominant; fields are fixed by output and work, with five unities, the team distributing grain and collective groups doing the big jobs. He lists advantages: realistic guaranteed outputs, better turnout, more manure, repaired tools.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 212–14. Made public: 1997. To check: [[w.kunchi-60-niandai-zeng-xisheng]], 58–59 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 212 n.19a); [[w.nongye-jitihua-zhongyao-wenjian]], 498 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 212 n.19b); [[w.nongye-jitihua-zhongyao-wenjian]], 498–500 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 214 n.26). Names: Mao Zedong.'
