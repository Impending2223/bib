      when: Jan. 11–25
      date: '1962-01-11'
      thread: china-leadership
      c: 'Seven Thousand Cadres Conference: a group of government cadres, dissatisfied with Liu Shaoqi''s four major problems, compiles twelve of its own: production relations and productive forces, speed of construction, accumulation and consumption, walking on two legs, mass movements, the law of value, party leadership and work style.'
