      c: 'Mao, on Li Xiannian''s 李先念 letter of Sept. 28, to Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Deng Xiaoping 邓小平, Li Xiannian, Li Fuchun 李富春, Tan Zhenlin 谭震林 and Bo Yibo 薄一波: the letter "very well written," accepting criticism and acting in earnest; that is taking the initiative, not "slow to see, slow to act," not bureaucracy; the other ministries and commissions should take the same attitude. The bulletin attached may be read or not.'
