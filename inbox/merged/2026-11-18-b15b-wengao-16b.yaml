- add:
    entry:
      id: cal.1962-04-27.china-leadership-6
      when: Apr. 27
      date: '1962-04-27'
      thread: china-leadership
      c: 'Mao to Zang Kejia 臧克家: his letters received; the changes all made as Zang proposed; this time only the six old ci in *Renmin wenxue* 人民文学, nothing more in *Shikan* 诗刊 for now; "forgive my not obeying."'
