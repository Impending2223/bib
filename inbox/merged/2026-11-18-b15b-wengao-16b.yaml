- add:
    entry:
      id: cal.1962-09-14.china-leadership-4
      when: Sept. 14
      date: '1962-09-14'
      thread: china-leadership
      time_range:
      - 1962-09-14T04:00Z
      - 1962-09-14T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
      also:
      - china
      c: 'Peking 北京, afternoon. Chen Yi 陈毅, in the East China group of the Tenth Plenum''s preparatory meeting: a wind of "three reconciliations and one reduction" 三和一少 (easing on America, the revisionists and Nehru; less aid to Asia, Africa and Latin America) is wrong; the struggle with Kennedy, Khrushchev and Nehru cannot be dodged and is measured; the liberation movements to get more help as China grows; the wind blows from three years'' difficulties.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 404–405 (Sept. 14, 1962; note 1 to Mao''s note of September, from the group''s bulletin no. 20 of Sept. 16). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Center General Office, confidential office, bulletin of the Tenth Plenum''s preparatory meeting, East China group no. 20, Sept. 16, 1962, with Chen Yi''s speech of the afternoon of Sept. 14 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 404 n.1). Names: Chen Yi, Kennedy, Khrushchev, Nehru. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
      tags:
      - polity:prc
