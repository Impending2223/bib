      c: 'Mao, on Xinhua''s 新华社 *Neibu cankao* 内部参考 no. 430 (supplement) of Apr. 4, a translation of Chalmers Roberts''s article in the *Washington Post* of Mar. 25 on the West''s slowly grasping the effects of the Communist split: beside its section on the West''s course (eight proposals, as the editors sum them: Kennedy''s offer of cooperation in space; the leaders'' television addresses; a Kennedy visit to the Soviet Union; recognizing Outer Mongolia; no nuclear arms for West Germany; restraining Yugoslavia or Greece from pressing Albania; assuring Poland and Czechoslovakia of their German borders; economic aid to Eastern Europe): "All eight are offensives, exposing revisionism before the world." Beside the passage that a strong West gives Khrushchev his argument to Mao on the danger of world war: "Contradiction."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 282–283 (Apr. 1962; Mao''s two annotations; printed from the manuscript; note 1: the issue, the article and the eight points; Roberts: the United States to seek common interests with Communist regimes, tell them apart, pursue friendship with the Soviet Union "on a firm basis" and keep China isolated). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Xinhua, Neibu cankao no. 430 (supplement), Apr. 4, 1962, with a translation of Chalmers Roberts''s Washington Post article of Mar. 25 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 282 n.1a); Chalmers M. Roberts, article in the Washington Post, Mar. 25, 1962, on the West''s slowly grasping the effects of the Communist split (in Chinese: 西方在逐渐明白共产党的分裂的影响) (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 282 n.1b). Names: Mao Zedong, Roberts, Kennedy, Khrushchev. Check: the day; the Wengao gives April, the issue of Apr. 4. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
