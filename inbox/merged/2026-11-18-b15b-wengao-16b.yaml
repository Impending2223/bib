      when: Sept. 15
      date: '1962-09-15'
      thread: china-leadership
      c: 'Mao to Liu Shaoqi 刘少奇: the article of Zhou Fucheng 周辅成, Peking University professor, in the *Wenhui bao* 文汇报 of Sept. 9, "The origins and lines of development of Greek ethical thought," worth a look if he has time and interest; then to Chen Boda 陈伯达, then back. Ethics a branch of social science on the differing moral standards of classes, "a tool of class struggle"; what the ruling class calls good the ruled call evil, and the reverse, "in our society too."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 402–403 (Sept. 15, 1962; Mao''s note of Sept. 15; printed from the manuscript; note 1: the article, page 3 of the issue). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Zhou Fucheng, "The origins and lines of development of Greek ethical thought," Wenhui bao, Sept. 9, 1962, p. 3 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 402 n.1). Names: Mao Zedong, Liu Shaoqi, Chen Boda, Zhou Fucheng. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:chen-boda
      - vis:only:prc
      src:
        c: 3fe360cf
        rows:
