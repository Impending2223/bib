      when: Apr. 24
      date: '1962-04-24'
      thread: china-leadership
      c: 'Mao to Chen Baichen 陈白尘, deputy editor of *Renmin wenxue* 人民文学, on the "Six ci poems" (*Ci liu shou* 词六首), six of his ci of 1929–31 he chose from the more than ten the magazine''s editors had collected, lightly revised: Chen to revise them as he sees fit and return them ("why will you not revise them for me in earnest once?"); Mao might write out the characters; when does the May issue appear, and when is copy due?'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 277 (Apr. 24, 1962; Mao''s letter; printed from the copy kept in the Central Archives; note 1: the six, printed in the May 1962 issue). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Names: Mao Zedong, Chen Baichen. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
