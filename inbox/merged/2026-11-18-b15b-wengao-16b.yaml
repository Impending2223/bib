      date: '1963-05-19'
      thread: china-leadership
      c: 'Mao, on Zhou Enlai''s 周恩来 draft of the Center''s notice issuing the draft decision on rural work, adds: the decision to go down to the Party branches in town and country; but while the "five-antis" lasts the provincial committees to hold it back in the cities, and in the villages to issue it by stages, not to counties, communes and brigades not yet ready for the movement.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 546–547 (May 19, 1963; Mao''s addition, in Song type; printed from his revised copy; note 1: the notice issued May 20 with the decision and seven annexes; carry it out by pilots and stages in two or three years; to be discussed again at a work conference in late July or early August and then adopted by a plenum; its principles apply to the cities too). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). See [[cal.1963-05-18.china-leadership]]. Names: Mao Zedong, Zhou Enlai. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
