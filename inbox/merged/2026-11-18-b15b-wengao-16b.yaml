- add:
    entry:
      id: cal.1963-05-08.china-leadership-4
      when: May 8
      date: '1963-05-08'
      thread: china-leadership
      c: 'Mao, on the *Zhongnan tongxun* 中南通讯 special number on the chief methods of the rural socialist education movement, picks four of its six documents (the three-level cadres'' meeting of Yanshi 偃师, Henan 河南; Wulijie 五里界 district, Wuchang 武昌, Hubei 湖北; Julingdian 巨陵店 district, Linying 临颍, Henan; Huaminglou 花明楼 commune, Ningxiang 宁乡, Hunan 湖南), titles them "Four good documents," and writes: they saw the problems, took up the work, rightly settled many contradictions among the people and with the enemy, and pushed farm output; a model for every province, prefecture, county and commune; such documents "with names, events, stages, course and conclusions" to be gathered.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 525–526 (May 8, 1963; Mao''s note of May 8; printed from the manuscript; notes 1–2: issued as annex four of the "Former Ten Points" (the Center''s draft decision on some questions of present rural work, issued May 20, 1963)). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Zhongnan tongxun, special number on the chief methods of the rural socialist education movement (six documents), 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 525 n.1). Names: Mao Zedong. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
