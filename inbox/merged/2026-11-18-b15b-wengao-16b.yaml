      when: May, after the 19th
      date: 1963-05
      thread: china-leadership
      at: after 1963-05-19
      also:
      - soviet-union
      c: 'Mao revises the drafts of May 19 and May 21 of the reply to the Soviet Central Committee''s letter of Mar. 30, adding among other things: a united front against imperialism on the worker-peasant alliance; in the national revolution the proletarian party to keep its own program and work; peaceful coexistence not to be stretched to oppressed and oppressor nations and classes nor made the road to socialism; in a socialist country the question who wins out, socialism or capitalism, takes a long historical period; against revisionism, also against dogmatism; a party that copies foreign experience and dances to a foreign baton has "both revisionism and dogmatism, a hodgepodge."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 513–518 (May 1963; items 2–11, his words in Song type; printed from his revised copy; note 1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Names: Mao Zedong. Check: the days of the revisions; the volume dates the item April–June and names the drafts of May 19 and 21. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
