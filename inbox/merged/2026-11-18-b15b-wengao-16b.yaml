      when: Jan. 4
      date: '1963-01-04'
      thread: china-leadership
      c: 'Hangzhou 杭州. Mao to his daughter Li Na 李讷, a history student at Peking University: her letter came just after his; her pain and sorrow "very good," a sign she is thinking in earnest and can turn from conceit and aloofness; the "cadres'' children" with their tails up no longer get on; she has read the "Autumn Floods" 秋水 of the *Zhuangzi* and will no longer be the Lord of the River. Signed "Papa."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 468–469 (Jan. 4, 1963; Mao''s letter of Jan. 4; printed from his manuscript; notes 1–3: Mao then at Hangzhou). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Names: Mao Zedong, Li Na. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
