      c: 'By Tao Zhu''s 陶铸 report to Mao that night: the Central-South Bureau''s 中南局 meeting closes at midnight, two days longer than planned, with two papers: the "Summary on preparing for war" 备战问题纪要 and the request "On improving the exchange of industrial and farm goods and lightening the production teams'' burden." Tao Zhu 陶铸 means to go back to Canton 广州 next morning.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 302 (June 24, 1962; note 1, from Tao Zhu''s report to Mao of the night of June 24). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Tao Zhu, report to Mao Zedong of the night of June 24, 1962 sending the two papers of the Central-South Bureau''s meeting (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 302 n.1a); Central-South Bureau meeting, "Summary on preparing for war" (备战问题纪要), June 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 302 n.1b); Central-South Bureau meeting, request for instructions "On improving the exchange of industrial and farm goods and lightening the production teams'' burden," June 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 302 n.1c). Names: Tao Zhu. Check: the place and the days of the meeting. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
