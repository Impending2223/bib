      thread: china-leadership
      c: 'Mao drafts a letter in Jiang Qing''s 江青 name, signed with her old name Yunhe 云鹤, to Chen Zong''e 陈宗娥, her classmate at the Shandong Experimental Theater 山东实验剧院 in 1929–30, now at the Central Experimental Opera Theater 中央实验歌剧院: her letter of June 27, 1961 reached her only that morning, held up ten and a half months in Peking; she has been two years away from Peking, seriously ill, now somewhat better; 500 yuan sent for Chen''s need; letters by way of Xu Yefu 徐业夫.'
