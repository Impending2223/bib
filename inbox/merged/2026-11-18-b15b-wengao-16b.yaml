      c: 'Mao, on Zhang Pinghua''s 张平化 letter of Sept. 9, with Wang Yanchun''s 王延春 account of the 13th team of Xiaogang 小港 brigade, Zhoukou 洲口 commune, Hanshou 汉寿 county, well managed with a strict responsibility system: "Print for the comrades. The provincial, municipal and regional committees to study it and take practical steps to improve the teams'' management."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 390–392 (Sept. 25, 1962; part two, dated Sept. 25; printed from the manuscript; note 1: Zhang''s letter (forms of responsibility may vary; a general "output responsibility system" risks sliding into household contracting; output-linked rewards for some tasks allowed as an aid); note 4: those at the Tenth Plenum, Sept. 24–27). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Zhang Pinghua, letter to Mao Zedong of Sept. 9, 1962 on Mao Huachu''s letter and the production teams'' management (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 391 n.1a); Wang Yanchun, "A production team well managed," on the 13th team of Xiaogang brigade, Zhoukou commune, Hanshou county, Hunan (sent with Zhang Pinghua''s letter of Sept. 9, 1962) (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 391 n.1b). See [[cal.1962-09-08.china-leadership-7]]. Names: Mao Zedong, Zhang Pinghua, Wang Yanchun. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
