      when: Aug. 29
      date: '1962-08-29'
      thread: china-leadership
      c: 'Mao, on the last page of Xiao Hua''s 萧华 paper of Aug. 20 on the army''s reaction to Deng Zihui''s 邓子恢 talk: go-it-alone 单干 seems to have a little market among the military cadres, but not a majority; the great majority are for socialism and against capitalism.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 366–367 (Aug. 29, 1962; part two of the item, Mao''s remark of Aug. 29; printed from the manuscript; note 1: written on Xiao Hua''s paper). [[w.zedong-mao-zedong-nianpu]], V, Aug. 26, 1962 (the remark of Aug. 29). Made public: 2013 ([[w.zedong-mao-zedong-nianpu]]). See [[cal.1962-08-26.china-leadership-2]]. Names: Mao Zedong, Xiao Hua, Deng Zihui. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
