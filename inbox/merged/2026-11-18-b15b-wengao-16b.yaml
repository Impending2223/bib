      c: 'Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhu De 朱德 and Zhou Enlai 周恩来 cable Novotný, Široký and Fierlinger on the fifth anniversary of the Sino-Czechoslovak treaty of friendship and cooperation: the treaty a great step in the two countries'' friendly cooperation, a help to their building of socialism, the camp''s unity and world peace; the friendship rests on Marxism-Leninism and proletarian internationalism, "eternal and unbreakable."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 265–266 (Mar. 26, 1962; dated Peking; printed from *Renmin ribao* 人民日报, Mar. 28, 1962). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Novotný, Široký, Fierlinger.'
