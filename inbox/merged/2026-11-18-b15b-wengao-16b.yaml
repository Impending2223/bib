      when: Apr. 24
      date: '1962-04-24'
      thread: china-leadership
      c: 'Mao to Zang Kejia 臧克家, editor of *Shikan* 诗刊: thanks for several letters; to print in two journals at once not fitting, since *Renmin wenxue* 人民文学 collected the poems; a few others might go in *Shikan*: when does its May issue go to press? Zang''s revisions good, fully agreed; anything more to revise?'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 278–279 (Apr. 24, 1962; Mao''s letter of Apr. 24; printed from the manuscript; notes 1–2: Zang then a secretary of the Writers'' Union''s secretariat and *Shikan*''s editor; the poems the more than ten the *Renmin wenxue* editors collected). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Names: Mao Zedong, Zang Kejia. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
