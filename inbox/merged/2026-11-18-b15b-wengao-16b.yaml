      c: 'Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhu De 朱德 and Zhou Enlai 周恩来 cable Kim Il Sung 金日成 on his fiftieth birthday: decades given to Korea''s independence, unification and socialism; in the hard 1930s he led Korean fighters in support of the Chinese revolution; his care for the Chinese People''s Volunteers in the war; the friendship "cemented in blood," the two parties'' unity "as firm as steel."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 273–274 (Apr. 14, 1962; printed from *Renmin ribao* 人民日报, Apr. 15, 1962). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Kim Il Sung.'
