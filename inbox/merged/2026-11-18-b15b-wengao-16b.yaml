      c: 'Mao, on eleven reports of early September on the year''s disasters (Hubei''s 湖北 Gucheng 谷城, Guanghua 光化 and Xiangyang 襄阳; Shandong 山东, Shaanxi 陕西, Sichuan 四川, Hailun 海伦 in Heilongjiang 黑龙江, Hengshan 衡山 in Hunan 湖南, the Leizhou 雷州 peninsula, Baichengzi 白城子 in Jilin 吉林, Southeast Guizhou, Inner Mongolia 内蒙古): print for the comrades. They show the cadres'' effort, the masses'' activity, minds steady; output down, but also up; even in the disaster areas "not all dark." "The Chinese can build socialism."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 383–384 (Sept. 8, 1962; Mao''s note of Sept. 8; printed from the manuscript; note 1: the Hubei report (thirteen brigades in three types: 80, 50 and 30–40 percent of the autumn fields without harvest, rations of nothing, 4–6 and about 10 jin a month); note 2: the eleven; note 3: those at the Tenth Plenum''s preparatory meeting, Peking, Aug. 26–Sept. 23). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Hubei disaster inspection group, Liu Yizhong, report to Zhou Enlai on the drought in Gucheng, Guanghua and Xiangyang counties, Sept. 3, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 383 n.1); Shandong disaster investigation group, report to Zhou Enlai on the Shandong disaster, Sept. 3, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2b); Shaanxi disaster investigation group, report to Zhou Enlai on the Shaanxi disaster, Sept. 3, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2c); Gan Zhongdou, report to Tan Zhenlin and Xi Zhongxun on the Sichuan disaster, Sept. 3, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2d); Central rural investigation group, report to Yang Fangzhi, deputy secretary-general of the State Council, on Hailun county, Heilongjiang, Sept. 2, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2e); Zhai Ziqiang, report to Yang Fangzhi on this year''s disaster in Hengshan county, Hunan, Sept. 4, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2f); State Council Hunan work group, Liu Chun, report to Xi Zhongxun and Zhou Enlai on the disaster investigation, Sept. 4, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2g); Guangdong work group, report to Xi Zhongxun and Zhou Enlai on the disaster on the Leizhou peninsula, Sept. 4, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2h); State Council Jilin work group, Guan Wenqi, report to Zhou Enlai, Tan Zhenlin and Xi Zhongxun on the disaster in the Baichengzi region, Sept. 3, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2i); State Council Guizhou work group, Jiang Kaifeng, bulletin to Tan Zhenlin and Xi Zhongxun, and to Zhou Enlai, on the disaster in the Southeast Guizhou Miao and Dong autonomous prefecture, Sept. 4, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2j); Inner Mongolia group, report to Zhou Enlai on the Inner Mongolian disaster, Sept. 3, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 384 n.2k). Names: Mao Zedong. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
