      when: Dec. 22
      date: '1962-12-22'
      thread: china-leadership
      c: 'Shanghai 上海. Mao to Ke Qingshi 柯庆施, on the Central Political Research Office''s material of August 1960, "Lenin''s struggle against opportunism in the Second International," in the Propaganda Department''s *Xuanjiao dongtai* 宣教动态 no. 109 of Dec. 14: "very important"; print it for the comrades of the East China Bureau''s meeting, to read once or twice and discuss for two days. He writes out on its last page an old poem on Li Keyong 李克用 and his son, "Sanchuigang" 三垂冈, by the Qing poet Yan Suicheng 严遂成.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 446–448 (Dec. 22, 1962; Mao''s note of Dec. 22 and the poem copied; printed from the manuscript; note 2: the material in six parts with four groups of documents (the Basel manifesto, the parties'' betrayal on the war''s outbreak, the Russian Social Democrats'' manifesto, the Zimmerwald Left); note 3: Mao then in Shanghai). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Propaganda Department, Xuanjiao dongtai no. 109, Dec. 14, 1962, printing "Lenin''s struggle against opportunism in the Second International" (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 447 n.2a). Names: Mao Zedong, Ke Qingshi. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
