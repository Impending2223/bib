      when: Sept. 29
      date: '1962-09-29'
      thread: china-leadership
      c: 'Mao to Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and Deng Xiaoping 邓小平, on the Propaganda Department''s *Xuanjiao dongtai* 宣教动态 supplement no. 63 of Sept. 24: the Party committee of the state organs had chosen a few rightists for trial review in June and July. Deng to find out who ordered it, the Organization Department, the central organs'' committee or the state organs'' committee itself: inside the central organs, the rightists not asking review and the higher level forcing a "trial point," "most rampant." Read, return, report.'
