      c: 'Mao to Chen Yun 陈云, Deng Zihui 邓子恢 and Tian Jiaying 田家英: read the piece on the socialization of Polish farming, on p. 5 of Xinhua''s 新华社 *Xiongdi guojia he xiongdi dang baokan cailiao* 兄弟国家和兄弟党报刊材料 no. 1110 of July 24; afterward back to Mao.'
