      c: 'Peking 北京, morning. The Southwest group of the Tenth Plenum''s preparatory meeting, on the second draft (Sept. 9) of the decision on commerce: commerce has had results, but goods rot and are wasted in great amounts, economic intelligence leaks to the enemy, many staff are corrupt, leaders privileged and bureaucratic; the commerce departments to examine themselves and account to the plenum; the draft to speak of the faults; a special meeting on carrying it out.'
