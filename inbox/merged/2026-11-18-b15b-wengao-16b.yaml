- add:
    entry:
      id: cal.1962-03-21.china-leadership-2
      when: Mar. 21
      date: '1962-03-21'
      thread: china-leadership
      c: 'Mao to Zhou Enlai 周恩来 on the edited text of Zhou''s speech of Feb. 7 to the enlarged Central Work Conference: read twice by a group under Tian Jiaying 田家英, with Luo Ruiqing 罗瑞卿, Xie Fuzhi 谢富治, Wang Renzhong 王任重 and a few others, with small changes; Mao read it again, "very good"; Zhou to settle it and have it done. The questions on its pages 8 and 10 to be studied closely.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 261–262 (Mar. 21, 1962; Mao''s note of Mar. 21; printed from the manuscript; note 1: the speech (the State Council and its commissions bear much of the blame for the faults; farming to recover in three to five years; 1962 the key year of adjustment); note 4: the questions are a passage on the speed of American farming (p. 8) and one comparing China''s coal and steel with America''s over a historical period (pp. 10–11), both struck out after study). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Zhou Enlai, speech to the enlarged Central Work Conference, Feb. 7, 1962, the edited text (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 261 n.1). See [[cal.1962-02-07.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Tian Jiaying, Luo Ruiqing, Xie Fuzhi, Wang Renzhong. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:luo-ruiqing
      - name:xie-fuzhi
      - vis:only:prc
      src:
        c: 58135fcb
        rows:
        - 'w.jianguo-yilai-mao-zedong XVI, 261–262: all'
        - 'via w.jianguo-yilai-mao-zedong XVI, 261 n.1: all'
- add:
    entry:
      id: cal.1962-03-25.china-leadership-3
      when: Mar. 25
      date: '1962-03-25'
      thread: china-leadership
      c: 'Mao to Deng Xiaoping 邓小平, Yang Shangkun 杨尚昆 and Wu Lengxi 吴冷西: Lin Ke 林克 being sent down to the base, he has no one to read international material for him or help with his English; they are to find one among the editors and translators of Xinhua''s 新华社 international department, aged 25 to 28, with experience translating English news, bright, honest, mild of speech, of middling English, on trial, to take turns with Lin Ke in going down. Also a secretary of higher cultural and political level, with practical mass work in the localities, to choose internal papers for him and offer views; of the "receiving and sending" secretaries one is enough.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 263–264 (Mar. 25, 1962; Mao''s letter of Mar. 25; printed from the manuscript; notes 1–2: Wu Lengxi then head of Xinhua and editor of *Renmin ribao*, Lin Ke a secretary of Mao''s office). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Names: Mao Zedong, Deng Xiaoping, Yang Shangkun, Wu Lengxi, Lin Ke. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
      src:
        c: 969c9c65
        rows:
