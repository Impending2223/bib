      when: Sept. 14
      date: '1962-09-14'
      thread: china-leadership
      c: 'Mao to Yang Shangkui 杨尚奎, first secretary of Jiangxi 江西: talk over Shao Shiping''s 邵式平 views of Aug. 7 with Liu Junxiu 刘俊秀 and the other Jiangxi comrades in Peking. Have the Center''s papers on farming and commerce taken some in? Besides the "Sixty Articles," should there be "trial rules" for the communes? Tell him.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 400–401 (Sept. 14, 1962; Mao''s letter of Sept. 14; printed from the manuscript; note 2: Shao''s three views (a draft of trial rules for the communes, members'' rights and duties, cadres elected and removable by members; exchange rights to follow ownership, the teams the units of exchange; those sent down still eat state grain); note 4: the Sixty Articles of March 1961 and their revision). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Shao Shiping, three views on consolidating the rural collective economy, Aug. 7, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 400 n.2). Names: Mao Zedong, Yang Shangkui, Shao Shiping, Liu Junxiu. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
