- add:
    entry:
      id: cal.1963-05.china-leadership-6
      when: May, before the 18th
      date: 1963-05
      thread: china-leadership
      at: before 1963-05-18
      c: 'Mao revises the drafts of the Center''s "Decision on some questions of present rural work (draft)" several times. He writes its preface: ten questions, learned through thirteen years'' practice; "Where do correct ideas come from? Do they drop from the skies? No. Are they innate in the mind? No." Only from the three practices of production, class struggle and scientific experiment; the two leaps of knowledge. He adds that a grave, sharp class struggle has appeared, the overthrown landlords and rich peasants corrupting cadres and seizing leadership; and a paragraph that the theory of knowledge be taught, "freeing philosophy from the philosophers'' classrooms."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 538–545 (May 1963; items 1–10, his words in Song type; printed from his revised copy and manuscript; note 1: the ten questions'' headings his; issued May 20; the preface excerpted in *Mao Zedong zhuzuo xuandu* (yi zhong ben 乙种本, Zhongguo Qingnian Chubanshe, 1964) as "Where do correct ideas come from?"; note 2: the twelve articles of Nov. 3, 1960). Made public: *Mao Zedong zhuzuo xuandu* (1964), the preface''s excerpt; the rest, 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). See [[cal.1963-05-07.china-leadership]]. Names: Mao Zedong. Check: the days of the drafts; the volume dates the item May and names the third and fourth drafts. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 5f4cb895
        rows:
        - 'w.jianguo-yilai-mao-zedong XVI, 538–545: all'
