      c: 'Mao, on the letter of Sept. 11 from Wang Heshou 王鹤寿, Minister of Metallurgy, sending the ministry''s report "What results in solving the problems of variety and quality?": "For Jiang Qing 江青 to read; very important. Back to Mao."'
