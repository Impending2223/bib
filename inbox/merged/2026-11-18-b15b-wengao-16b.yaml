      c: 'Mao, on the Center''s draft directive forwarding the Central Finance and Economic Group''s 中央财经小组 report of Apr. 30, "On discussing the adjusted plan for 1962," sent him by Zhou Enlai 周恩来 with a letter of May 19: "Back to the Premier; do as proposed."'
