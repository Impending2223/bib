      when: May 2
      date: '1963-05-02'
      thread: china-leadership
      c: 'Mao drafts, for the Center, the instruction forwarding Song Renqiong''s 宋任穷 report of Apr. 10 and the Henan 河南 committee''s of Apr. 15 on rural socialist education, and sends it to Zhou Enlai 周恩来, Deng Xiaoping 邓小平, Peng Zhen 彭真 and Yang Shangkun 杨尚昆: Henan trained over 150,000 cadres in twenty-odd days and will train 1.5 million cadres and activists, by steps and pilots; unite over 90 percent of cadres and masses, education first, punishment second; Song''s village, family, commune and factory histories for the young.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 534–537 (May 2, 1963; note 1 to the instruction of May 10: Mao drafted it May 2; printed from the Center''s document (the manuscript held)). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Song Renqiong, report to Mao Zedong and the Center on two questions of rural socialist education, Apr. 10, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 535 n.1a); Henan provincial Party committee, report to the Center, Mao Zedong and the Central-South Bureau on the present rural socialist education movement, Apr. 15, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 535 n.1b). Names: Mao Zedong, Song Renqiong, Zhou Enlai, Deng Xiaoping, Peng Zhen, Yang Shangkun. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
