      c: 'Mao''s introduction to the "Six ci poems" (*Ci liu shou* 词六首) for *Renmin wenxue* 人民文学: hummed on horseback in 1929–31 and long forgotten; the editors collected them, sent them and asked to print them; lightly revised and given. He also annotates the line "below Buzhou Mountain the red flags in disorder" 不周山下红旗乱: of the versions he takes the *Huainanzi* 淮南子''s, in which Gonggong 共工 is a victorious hero who did not die.'
