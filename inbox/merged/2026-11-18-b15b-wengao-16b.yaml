      c: 'Mao to Kang Sheng 康生, on the contents page of Xinhua''s 新华社 *Xiongdi guojia he xiongdi dang baokan cailiao* 兄弟国家和兄弟党报刊材料 no. 1010 of Apr. 15, which excerpts the article "Comrades, think about this!" in the Soviet *Uchitel''skaya gazeta* 教师报: study, with a few comrades, whether it is right or wrong, and tell him the result.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 275–276 (Apr. 16, 1962; Mao''s note of Apr. 16; printed from the manuscript; note 3: the article holds that Soviet schools fell behind from the late 1930s, the cult of Stalin harmed labor and polytechnical training, the school workshops closed by 1937, and educators and the Academy of Pedagogical Sciences avoid the cult''s harm). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Xinhua, Xiongdi guojia he xiongdi dang baokan cailiao no. 1010, Apr. 15, 1962, excerpting the Uchitel''skaya gazeta article "Comrades, think about this!" (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 275 n.1); Uchitel''skaya gazeta, article "Comrades, think about this!" (1962; the day not given) on Soviet schools and the cult of Stalin (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 275 n.3). Names: Mao Zedong, Kang Sheng. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
