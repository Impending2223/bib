      c: 'Mao, on the summary in Xinhua''s 新华社 *Cankao ziliao* 参考资料 no. 5184 of July 29 of the Yugoslav leaders'' speeches at the League of Communists'' Fourth Plenum of the Seventh Central Committee, July 22–23: print it for all to read on Yugoslavia''s economic disorder, and discuss whether the Yugoslav road or the Marxist-Leninist road is better.'
