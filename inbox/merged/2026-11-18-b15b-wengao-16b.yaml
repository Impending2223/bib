      c: 'Mao to Deng Xiaoping 邓小平, on the Organization Department''s report of Oct. 23, 1962 to him and the Standing Committee on carrying out democratic centralism: prepare to print it for the comrades of the Central Work Conference in February.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 470–471 (Jan. 8, 1963; Mao''s note of Jan. 8; printed from the manuscript; note 2: the report (great change since the enlarged conference, but uneven; ultra-democracy beginning to grow; four measures, among them Party committees freed from administrative business, "great power concentrated, small power dispersed"; a draft of Party work rules asked); note 3: the conference of Feb. 11–28, 1963). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee Organization Department, report to Mao Zedong and the Politburo Standing Committee on the carrying out of democratic centralism in the localities, Oct. 23, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 470 n.2). Names: Mao Zedong, Deng Xiaoping. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
