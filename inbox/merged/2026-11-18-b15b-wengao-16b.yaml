      time: 1962-06-11T19:00Z
      time_zone: Asia/Shanghai
      c: '3 a.m. Mao to Lin Ke 林克: the copy of the Xinhua 新华社 dispatch revised last night to go to Liu Shaoqi 刘少奇, who is to call the Standing Committee and Peng Zhen 彭真, Luo Ruiqing 罗瑞卿, Xiao Hua 萧华, Lu Dingyi 陆定一 and Wu Lengxi 吴冷西 to read it through and weigh it before it is fixed.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 298–300 (June 12, 1962; part two of the item, Mao''s note to his secretary Lin Ke, dated 3 a.m. June 12; printed from the manuscript; note 1: the dispatch sent to the Party committees June 18 and printed in *Renmin ribao* June 24; notes 3–4: the persons). [[w.zedong-mao-zedong-nianpu]], V, June 11, 1962. Made public: 2013 ([[w.zedong-mao-zedong-nianpu]]). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], 10, 101–3 (1996), as [[w.macfarquhar-origins-of-the-cultural]], III, 272 n.65b cites it. See [[cal.1962-06-11.china-leadership]]. Names: Mao Zedong, Lin Ke, Liu Shaoqi, Peng Zhen, Luo Ruiqing, Xiao Hua, Lu Dingyi, Wu Lengxi. Check: whether the 1996 pages hold this note as well as the revision.'
      tags: [polity:prc, name:mao-zedong, name:liu-shaoqi, name:peng-zhen, name:luo-ruiqing, name:lu-dingyi, vis:only:prc]
      src:
