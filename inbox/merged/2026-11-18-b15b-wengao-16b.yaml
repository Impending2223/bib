      date: '1963-01-15'
      thread: china-leadership
      c: 'Mao to Li Na 李讷: her letter received, "most glad": great progress, great ambition, self-criticism, pain and sorrow all very good; she has stood up. Read, no hurry; mix with the others, open up, learn their strengths.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 468–469 (Jan. 15, 1963; Mao''s letter of Jan. 15; printed from his manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). See [[cal.1963-01-04.china-leadership-6]]. Names: Mao Zedong, Li Na. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
