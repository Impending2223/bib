      c: 'Mao cables Nosaka Sanzō 野坂参三, chairman of the Japanese Communist Party''s Central Committee, in his own name, on his seventieth birthday: a tested fighter of the Japanese people and a close friend of the Chinese; he came to Yan''an 延安 in the war against Japan; after the war, against the American occupiers and the revival of Japanese militarism; American imperialism the two peoples'' common enemy.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 267–268 (Mar. 28, 1962; printed from *Renmin ribao* 人民日报, Mar. 30, 1962). Names: Mao Zedong, Nosaka.'
