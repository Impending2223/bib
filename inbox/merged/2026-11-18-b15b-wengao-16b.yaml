      id: cal.1962-05.china-leadership-11
      when: May, after the 9th
      date: 1962-05
      thread: china-leadership
      at: after 1962-05-09
      c: 'Mao, on the proofs of Guo Moruo''s 郭沫若 article on the "Six ci poems" (written May 1, sent him May 9), strikes Guo''s passage on "Loushan Pass" 娄山关 (its two halves two crossings, autumn 1934 and after the Zunyi meeting 遵义会议) and writes his own in Guo''s voice: he had first thought it one day, then argued at the Canton forum for two; he was wrong, the author told him. After Zunyi the Red Army took the pass, meant to cross into western Sichuan 四川 and strike Liu Xiang 刘湘, was stopped by the Sichuan and Yunnan 云南 armies at "the cock crows in three provinces," and on the Politburo''s decision turned back on Zunyi in February, taking the pass in one fight and Zunyi that night, two enemy divisions destroyed; the poem written afterward. "How hard it is to explain a poem."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 293–296 (May 1962; Mao''s text; printed from the manuscript; note 1: the article, its struck passage quoted, printed in the May 1962 issue of *Renmin wenxue* with the poems; note 2: the poetry forum at Canton, Mar. 7, 1962; note 4: the Zunyi meeting now dated Jan. 15–17, 1935, so the first taking of the pass came before it). Made public: *Renmin wenxue* 人民文学, May 1962, as Guo''s words; as Mao''s, 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Guo Moruo, "On happily reading Chairman Mao''s ''Six ci poems''" (喜读毛主席的《词六首》), written May 1, 1962, proofs sent to Mao May 9; printed in Renmin wenxue, May 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 294 n.1a). Names: Mao Zedong, Guo Moruo. Check: the day; the Wengao gives May, after Guo sent the proofs May 9. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
