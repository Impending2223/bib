      thread: china-leadership
      c: 'Mao, on the Hunan 湖南 committee''s two reports to the Center, Mao and the Central-South Bureau, of Apr. 16 (the second on the socialist education movement) and Apr. 22 (on the poor peasants'' ascendancy and the poor and lower-middle peasants'' representative groups, from Lingling 零陵): "Both good; comrades to study them for reference."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 522–524 (May 8, 1963; Mao''s note of May 8; printed from the Center''s document; note 1: the reports (the two roads'' struggle in plans, labor and distribution; representative groups in over half the teams); issued May 20 with the note as annex three of the "Former Ten Points" (the Center''s draft decision on some questions of present rural work, issued May 20, 1963)). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Hunan provincial Party committee, second report on the rural socialist education movement, Apr. 16, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 522 n.1a); Hunan provincial Party committee, report on establishing the poor peasants'' ascendancy and poor and lower-middle peasants'' representative groups, Apr. 22, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 522 n.1b). Names: Mao Zedong. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
