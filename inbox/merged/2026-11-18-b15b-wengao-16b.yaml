- add:
    entry:
      id: cal.1962-03-20.china-leadership-6
      when: Mar. 20
      date: '1962-03-20'
      thread: china-leadership
      time: 1962-03-20T01:00Z
      c: 'Wuhan 武汉, 9 a.m. Mao to Tian Jiaying 田家英 and Luo Ruiqing 罗瑞卿 on the edited text of Lin Biao''s 林彪 speech of Jan. 29 to the enlarged Central Work Conference: read through, "very good, weighty"; Luo to decide whether Lin reads it again (Mao''s view: send it); to Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and Deng Xiaoping 邓小平 for changes, settled finally in Peking, or else to Yang Shangkun 杨尚昆 to handle, not back to Mao; his small changes in the first part for them to settle; nothing especially secret in it, to go out with the other speeches, read or read out; to keep the question from senior and middle cadres "extremely harmful." His insertion: a backward country, united and well led, can turn over in some decades; to overtake the United States, a hundred-odd years at most.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 257–260 (Mar. 20, 1962; Mao''s note, dated 9 a.m. Mar. 20; printed from the manuscript, the insertion from his revised copy; note 2: the speech on Party work (the three red banners right; the difficulties temporary, in part from not following Mao''s instructions) and on military work (war unavoidable; no provocation, no pure defense); note 4: Mao then at Wuhan; note 6: his changes chiefly in part two, his words in Song type). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Lin Biao, speech to the enlarged Central Work Conference, Jan. 29, 1962, the edited text (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 258 n.2). See [[cal.1962-01-29.china-leadership]]. Names: Mao Zedong, Tian Jiaying, Luo Ruiqing, Lin Biao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Yang Shangkun. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:luo-ruiqing
      - name:lin-biao
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
