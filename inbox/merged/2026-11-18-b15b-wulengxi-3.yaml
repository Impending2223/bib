      date: '1963-06-10'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. Mao, back in Peking, holds the Standing Committee, which passes the draft reply to the CPSU letter of Mar. 30.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 576 ("on June 10, the Standing Committee meeting passed the draft reply"). Made public: 1999. See [[cal.1963-06-07.china-leadership-6]]. Names: Mao Zedong.'
      tags:
