- cite:
    id: cal.1963-07-20.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 624 (Wu: the Chinese Central Committee spokesman''s statement, broadcast the night of July 19 and printed in the *Renmin ribao* July 20: the Open Letter is not in accord with the facts and not agreed to; the Central Committee will in due time clear up and comment on the questions it raises; it will print the CPSU''s letter in full and its own of June 14; it welcomes the Soviet printing of the June 14 letter and hopes the Soviets will print the CCP''s documents as the Chinese print the CPSU''s, the seven articles since last December and the three statements of early July, and the statement of July 19 itself; the Chinese papers will print selections from the Soviet attacks since the Open Letter, from other parties'' support of it, and from the imperialists'' and reactionaries'' praise of it)'
    units: A-C
- add:
    entry:
      id: cal.1963-07-20.china-leadership-6
      when: July 20
      date: '1963-07-20'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The *Renmin ribao* prints the CPSU''s Open Letter, with the Chinese Proposal of June 14, and a long editors'' note. The note says the Open Letter turns the facts and the right and wrong around, and takes up four questions: nuclear war (Mao''s words on resistance or surrender, mankind surviving; not that China would have a nuclear war); the Twentieth Congress and Stalin (China told the CPSU in 1956 it was one-sided; Mao four times to Mikoyan and other Soviet comrades); peaceful transition (the 1957 memorandum); and the spreading of ideological differences into state relations (the withdrawal of over 1,000 Soviet experts and tearing up of hundreds of agreements, from July 16, 1960). The note says there are seventy or eighty such turnings in the letter, to be dealt with in later articles.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 624–627 (the plate of the *Renmin ribao* of July 20 (625); the editors'' note''s "four questions"; Wu: "seventy or eighty places"). See [[cal.1963-07-19.china-leadership-2]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      src:
        c: 9322af1b
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 624–627: all'
- cite:
    id: cal.1963-07-21.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 623–624 (Wu: at the Peking western suburb airport the afternoon after the banquet: Mao, Liu Shaoqi, Zhou Enlai, Zhu De and Dong Biwu, the deputy head of state, with department heads and crowds, some five thousand, a welcome meant to show the Center''s full support; Mao taking the delegation to the Yinian Tang (颐年堂) in Zhongnanhai for tea and talk of the banquet; Mao: "complete victory," that is, no agreement lost to principle; the two parties'' talks halted for the time, as the communiqué says, a tail left, so the relations are not wholly broken, though near the brink; Khrushchev had said of Deng, so small, a heavyweight; Mao: no meeting tomorrow or the day after, since China has already shown its stand on the Open Letter)'
    units: A-D
- cite:
    id: cal.1963-07-28.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 628 (Wu: the treaty concluded (签订) July 25, the fifth day after the talks'' end, banning tests in the atmosphere, in outer space and under water, not underground)'
    units: B
- add:
