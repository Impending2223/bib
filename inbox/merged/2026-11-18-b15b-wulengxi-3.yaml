      c: Peking and Hangzhou. The two drafts of the reply on the general line, Deng Xiaoping's group's at the Diaoyutai and Chen Boda's at Hangzhou, are printed by the month's end. Deng sends Peking's to Mao for his thoughts, not ripe, to be revised a good deal; Chen's comes to Peking.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 560 ("through all April ... by the month''s end, the drafts of Peking and of Hangzhou were both printed"). Made public: 1999. See [[cal.1963-04.china-leadership-4]]. Names: Deng Xiaoping, Chen Boda, Mao Zedong. Check: the days: Wu gives "by the month''s end"; the Mao chronology has Mao receive the second draft Apr. 19, and Deng, Kang Sheng, Lu Dingyi and Chen Boda at Hangzhou from Apr. 21 ([[cal.1963-04-17.china-leadership]]), of which Wu says nothing.'
