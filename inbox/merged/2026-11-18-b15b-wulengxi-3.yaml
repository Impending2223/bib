      - 1963-06-26T14:00Z
      time_band: evening
      time_zone: Asia/Shanghai
- check:
    id: cal.1963-06-28.china-leadership
    text: 'Check: Wu (595–598) has the Standing Committee meet the evening of June 26 ([[cal.1963-06-26.china-leadership-2]]) and twice more, the days not given; whether those are the meetings of June 28–30.'
- cite:
    id: cal.1963-06-28.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 596–598 (Wu: the matters of the Standing Committee''s meetings after June 26, undated: where the talks should begin, how the Soviets may open, a joint statement, a halt to the polemic, who speaks first; Mao''s three outcomes, some agreement, a quarrel and a break (very likely), a quarrel without a break; his course for the delegation: hold to principle, counterattack freely, win by reason, no haste for agreement, no break by China; "even with nothing from the talks, propose the next in Peking"; the writers'' group halved, Qiao Guanhua and three others left at Peking)'
    units: B-C
- cite:
    id: cal.1963-06-30.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 599 (Wu: June 30, Liu Shaoqi presides at the enlarged Politburo, which hears the analysis, line and tactics of Mao and the Standing Committee for the talks, agrees after careful discussion and passes the Central Committee''s statement, published July 1)'
    units: A
- add:
    entry:
      id: cal.1963-07-01.china-leadership-4
      when: July 1
      date: '1963-07-01'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The Central Committee''s statement names the delegation to the talks with the CPSU, to open in Moscow July 5: Deng Xiaoping head, Peng Zhen deputy, with Kang Sheng, Yang Shangkun, Liu Ningyi, Wu Xiuquan and Pan Zili. It holds to principle and unity, charges the delegation to discuss with the CPSU the general line and related matters on the basis of the June 14 letter, rejects the CPSU Central Committee''s statement of June 18, its resolution of June 21 and Khrushchev''s speech at the plenum, which called the letter groundless slander, and reserves the right to answer later.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 599 (the statement "published July 1"; Deng, "Standing Committee member and General Secretary of the Central Committee"; Peng Zhen, "Politburo member, member of the Secretariat"; Kang Sheng, Yang Shangkun, Liu Ningyi, Wu Xiuquan, Pan Zili, the writers going as advisers). See [[cal.1963-06-30.china-leadership-2]]. Names: Deng Xiaoping, Peng Zhen, Kang Sheng, Khrushchev.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:peng-zhen
      - name:kang-sheng
      - name:khrushchev-nikita-s
      src:
        c: f378d141
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 599: all'
- cite:
    id: cal.1963-07-04.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 599–600 (Wu: the CPSU Central Committee''s statement of July 4 repeats the charge of groundless attacks, defends its not printing the Chinese letter (it would have to answer, and sharpen the dispute) and says it will print an answer in due time; the Center asks the writers at once for a short reply; Mao holds the Standing Committee through the night; he reads the statement as Khrushchev''s resolve to attack the Chinese systematically at the talks and to name them in print, with word besides of Soviet talks with the United States and Britain on a partial test ban, to force China to give up its nuclear program; the delegation is not to kneel to Khrushchev, and reaching no agreement is the victory; the statement is passed in the small hours of July 5 and printed that day)'
    units: B, D
- variant:
    id: cal.1963-07-04.china-leadership
    unit: C
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: Mao holds the Standing Committee on the draft statement that night (连夜), and it is passed in the small hours of July 5
    at: '600'
- cite:
    id: cal.1963-07-05.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 601 (Wu: the delegation leaves in two planes the day of the statement, July 5, Liu Shaoqi, Zhou Enlai and other leaders seeing it off; Wu with Deng Xiaoping in the first reaches Moscow that afternoon; Peng Zhen''s plane, held by weather in Siberia, some hours later; the delegation lodged in two villas on the Lenin Hills, its meetings held in a secure room of the Chinese embassy)'
    units: B
- variant:
    id: cal.1963-07-05.china
    unit: B
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: the first meeting of the two delegations is on July 6, Suslov speaking first (the entry has the talks open July 5)
    at: '603'
- variant:
    id: cal.1963-07-05.china
    unit: C
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: Suslov's speech of over two hours opens the talks July 6; Deng Xiaoping's first speech is on July 8 (the entry has Deng's five-hour opening speech)
    at: 603–604
- cite:
    id: cal.1963-07-05.china
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 602–603 (Wu: the talks "from July 6 to July 20," nine meetings (the day: variant), at the CPSU Central Committee''s conference hall on the Lenin Hills; for the Soviets Suslov, Grishin, Ponomarev, Andropov, Ilyichev, Satyukov and Ambassador Chervonenko; the first meeting, July 6: Suslov speaks first, over two hours, against the Chinese letter of June 14 and for the CPSU''s of Mar. 30, the general line peaceful coexistence, competition and transition, the CPSU a party of the whole people; adjourned)'
    units: B
- add:
    entry:
      id: cal.1963-07-06.china-leadership-3
      when: July 6
      date: '1963-07-06'
      time_range:
      - 1963-07-06T16:00Z
      - 1963-07-06T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: Moscow, the Chinese embassy, evening. The delegation meets on Suslov's speech and decides to answer first on the origin of the Sino-Soviet differences, revising the text prepared at Peking so as to meet his attack on the letter of June 14. His "whole people" points are left for later speeches.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 604 ("that evening," after the first meeting; the text revised to meet the attack on the June 14 letter but with its main content kept, a historical account of where the two parties'' differences come from). Made public: 1999. See [[cal.1963-07-05.china]]. Names: Suslov.'
      tags:
      - polity:prc
      - name:suslov-mikhail-a
      - vis:only:prc
      src:
        c: 8a36c7e0
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 604: all'
- add:
    entry:
      id: cal.1963-07-08.china-leadership-3
      when: July 8
      date: '1963-07-08'
      thread: china-leadership
      also:
      - soviet-union
      c: Moscow. Second meeting. Deng Xiaoping, head of the Chinese delegation, speaks on the origin and the substance of the differences. They began with the CPSU's Twentieth Congress, he says, and went on through the Soviet–Polish strain and Hungary in 1956, the Moscow meeting of 1957, the Sino-Indian border and Camp David in 1959, Bucharest and the Moscow meeting of 1960, the Twenty-second Congress, and the attacks of the five European congresses in 1962–63, until two lines; the substance is revolution or no revolution. The Soviet side does not reply; the meeting adjourns.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 604 ("the second meeting was held on July 8"; Deng''s speech the basis of the first article answering the CPSU''s open letter, "The origin and development of the differences between the leadership of the CPSU and ourselves"). Made public: 1999. See [[cal.1963-07-07.china-leadership]]. Names: Deng Xiaoping.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc+ussr
      src:
        c: '31684732'
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 604: all'
- add:
    entry:
      id: cal.1963-07-09.soviet-union
      when: July 9
      date: '1963-07-09'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The CPSU Central Committee issues a statement on the mass meeting Peking held to welcome home the embassy staff and students the USSR had expelled: it says China''s action can only sharpen the situation at the talks.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 604 (after the second meeting; the statement aimed at the Peking meeting to welcome the returning embassy staff and students). See [[cal.1963-07-08.china-leadership-3]].'
      tags:
      - polity:prc
      src:
        c: c69f3600
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 604: all'
- cite:
    id: cal.1963-07-10.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 604–605 (Wu: the Central Committee''s statement of July 10 answers the CPSU''s of July 9: the June 14 letter answered the Mar. 30 letter, so there is no slander; Soviet staff in China had always spread the CPSU''s documents, so the embassy staff and students'' handing round the June 14 letter is normal and equal activity, not interference in Soviet internal affairs or breach of sovereignty (on that logic China was long no sovereign state); China still holds to principle, unity, removal of differences and a common stand against the enemy; unity too important to do what pains friends and gladdens foes)'
    units: A
- add:
    entry:
      id: cal.1963-07-10.china-leadership-3
      when: July 10
      date: '1963-07-10'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow. Third meeting. Suslov answers Deng: the differences began after Camp David, with China''s hostile turn against the USSR; he rejects Deng''s dating from the Twentieth Congress and his words on the Soviet–Polish strain and Hungary in 1956, denies that the CPSU took India''s side in the border dispute, and charges China with splitting, the seven answering articles being its proof.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 605–606 ("the third meeting on July 10"; Wu on the speech: it "forced the argument" (强词夺理), like his first). Made public: 1999. See [[cal.1963-07-08.china-leadership-3]]. Names: Suslov, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:suslov-mikhail-a
      - name:deng-xiaoping
      - vis:only:prc+ussr
      src:
        c: 2f9e9385
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 605–606: all'
- add:
    entry:
      id: cal.1963-07-10.china-leadership-4
      when: July 10
      date: '1963-07-10'
      time_range:
      - 1963-07-10T16:00Z
      - 1963-07-10T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      follows:
      - cal.1963-07-10.china-leadership-3
      c: Moscow, the Chinese embassy, evening. The delegation meets on the Central Committee's statement of the day. It holds that the statement's stress on unity is right, and that at the talks the delegation may answer Suslov's two speeches with a sharp attack on the CPSU leaders' splitting, seeking unity by struggle. The next speech to be altered little, the tone unchanged.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 606 ("that evening"; "to seek unity by struggle"). Made public: 1999. Names: Suslov.'
      tags:
      - polity:prc
      - name:suslov-mikhail-a
      - vis:only:prc
      src:
        c: 345d1bc6
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 606: all'
- add:
    entry:
      id: cal.1963-07-12.china-leadership-5
      when: July 12
      date: '1963-07-12'
      time_range:
      - 1963-07-12T03:00Z
      - 1963-07-12T09:00Z
      time_band: morning
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, morning. Fourth meeting. Deng Xiaoping''s second speech, on the CPSU''s splitting, from Bucharest on: the CPSU wields its baton, makes a split of its own and drives other parties to split, carries ideological difference into relations between states, with China and with Albania. He asks why the Soviets, speaking of the differences, say nothing of the withdrawal of all experts from China and the tearing up of the contracts; and on Cuba which of two Soviet lines, Kennedy a pirate or Kennedy a lover of peace, stands. Suslov, pale and red by turns, says the Soviets will answer next time, and asks to meet again in the afternoon.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 606–608 ("the fourth meeting on July 12, Deng''s second speech"; "before the break"; Deng: "if you follow your baton and fall into your own trap, you contradict the facts"; Deng on Cuba: "what do you mean to have us follow?"). Made public: 1999. See [[cal.1963-07-10.china-leadership-3]]. Names: Deng Xiaoping, Suslov.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:suslov-mikhail-a
      - vis:only:prc+ussr
      src:
        c: 707a0683
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 606–608: all'
- add:
    entry:
      id: cal.1963-07-12.china-leadership-6
      when: July 12
      date: '1963-07-12'
      time_range:
      - 1963-07-12T09:00Z
      - 1963-07-12T15:00Z
      time_band: afternoon
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      follows:
      - cal.1963-07-12.china-leadership-5
      c: Moscow, afternoon. Fifth meeting. Ponomarev, instead of answering Deng's questions, reads his prepared text on the struggle for peace, for general and complete disarmament, and for a "world without arms, armies or wars."
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 608 ("in the afternoon, the fifth meeting, Ponomarev spoke"; "a world of the three nos" (三无世界)). Made public: 1999. Names: Deng Xiaoping, Ponomarev.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:ponomarev-boris-n
      - vis:only:prc+ussr
      src:
        c: a8be0d8b
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 608: all'
- cite:
    id: cal.1963-07-12.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 608–610 (Wu: the editorial "We want unity, not a split," printed July 13, the first of five editorials or observers'' pieces the Center had Qiao Guanhua''s writing group draft after a week''s watching of the talks (the plate at 609 shows the five of July); it says the CCP looks to the whole and will do nothing against Sino-Soviet unity, hopes the talks bear fruit; but the CPSU, since they began, has not stopped its public attacks, running through Party meetings and resolutions across the country and a stream of press articles a campaign against the CCP; asks whether the CPSU means to take relations to the brink of a break, and calls it to put unity first)'
    units: A-C
- add:
    entry:
      id: cal.1963-07-13.china-leadership-2
      when: July 13
      date: '1963-07-13'
      time_range:
      - 1963-07-13T03:00Z
      - 1963-07-13T09:00Z
      time_band: morning
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: Moscow, the Chinese embassy, morning. The delegation meets on the day's *Renmin ribao* editorial and the situation. The Western press reports that the Soviet Union, the United States and Britain are to negotiate at Moscow, at the same time as the party talks, on a partial test ban. Most of the delegation hold that this bears on the talks, the Soviet course likely the same as in 1959 before Khrushchev's American trip, when, to please Eisenhower, he damaged Sino-Soviet relations, withheld an atomic bomb model and issued a TASS statement against China on the Indian border. It takes the three-power talks for a bad sign and has Peng Zhen's next speech altered to stress peace and revolution, in answer to Ponomarev.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 610 ("the morning of the 13th"). Made public: 1999. Names: Peng Zhen, Ponomarev, Khrushchev.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:ponomarev-boris-n
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: ad58d5bd
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 610: all'
- add:
    entry:
      id: cal.1963-07-14.soviet-union
      when: July 14
      date: '1963-07-14'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. The CPSU Central Committee's Open Letter to all Party organizations and all Communists of the Soviet Union, its answer to the Chinese letter of June 14, is broadcast by Moscow radio and printed in *Pravda*, the foreign edition with the Chinese letter beside it. It answers the Chinese letter point by point and names Mao and other Chinese leaders in attack.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 610–612, 614 (the interpreter told the delegation on the morning of the 14th of the broadcast; *Pravda* had two editions, one for foreign countries and foreigners in the USSR, small, which printed the Chinese Proposal too, the other for home, which printed the Open Letter alone; the letter came the day before the Soviet–American–British talks on a partial test ban opened (July 15); Wu: Burlatsky''s book says Suslov had it written in a day and a night, as "a blow China did not expect"). See [[cal.1963-06-18.soviet-union]]. Names: Mao Zedong, Suslov. Check: the Soviet text and the Burlatsky account (Wu cites the 1993 Chinese translation, 115) are not read.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:suslov-mikhail-a
      src:
        c: feee8b7f
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 610–612, 614: all'
- add:
    entry:
      id: cal.1963-07-14.china-leadership-4
      when: July 14
      date: '1963-07-14'
      time_range:
      - 1963-07-14T09:00Z
      - 1963-07-14T15:00Z
      time_band: afternoon
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      follows:
      - cal.1963-07-14.soviet-union
      c: 'Moscow, the Chinese embassy, afternoon. The delegation meets on the Open Letter and agrees that the CPSU, tearing off its mask, has chosen open polemic and that the talks can end only in a quarrel; its talk of stopping the polemic was false; it did not wait for the talks to end, and published a day before the three-power talks opened. It then cables Peking for the next step: agreement is no longer possible, a complete break not certain; to reply freely on the Soviet points at the talks, short of an open break, and keep some form of tie.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 611–612 ("in the afternoon"; "we thought the talks might break, or at best come to nothing"; the Open Letter an answer to the Proposal in 25 points, got up in a month at most, since the CPSU had not meant to reply to it in June). Made public: 1999.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: 183f1bee
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 611–612: all'
- add:
    entry:
      id: cal.1963-07-14.china-leadership-5
      when: July 14
      date: '1963-07-14'
      time_range:
      - 1963-07-14T16:00Z
      - 1963-07-14T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      follows:
      - cal.1963-07-14.china-leadership-4
      c: Moscow, the Chinese embassy, evening. The delegation meets again and revises Peng Zhen's draft for the sixth meeting, July 15. The Soviet publication of the Open Letter, during the talks, is to come first, as a grave step; he is to reserve the right to comment on it.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 613 ("in the evening, the delegation met again"). Made public: 1999. Names: Peng Zhen.'
      tags:
      - polity:prc
      - name:peng-zhen
      - vis:only:prc
      src:
        c: c2b6eac8
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 613: all'
- cite:
    id: cal.1963-07-15.testing
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 611 (Wu: the Soviet side announces the beginning of the three powers'' talks on a partial test ban on July 15, the day after the CPSU''s Open Letter, which, Wu holds, repeats Khrushchev''s 1959 trick before Camp David of courting the Americans against China)'
    units: A
- add:
    entry:
      id: cal.1963-07-15.china-leadership-4
      when: July 15
      date: '1963-07-15'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow. Sixth meeting. Peng Zhen speaks for the Chinese: the CPSU''s publishing an open letter, while the talks go on, to attack the CCP gravely harms the talks and gives reason to doubt Soviet good faith; what do they want? He reserves the delegation''s right to comment on the letter. He then criticizes the "three peaces" line and answers Ponomarev by name. The Soviets do not reply; the meeting adjourns.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 613 ("on July 15, the sixth meeting"; the speech on peace and revolution prepared at Peking and altered after Ponomarev''s of the 12th). Made public: 1999. See [[cal.1963-07-14.soviet-union]]. Names: Peng Zhen, Ponomarev.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:ponomarev-boris-n
      - vis:only:prc+ussr
      src:
        c: fe86ddf0
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 613: all'
- add:
    entry:
      id: cal.1963-07-17.china-leadership
      when: July 17
      date: '1963-07-17'
      time_range:
      - 1963-07-17T03:00Z
      - 1963-07-17T09:00Z
      time_band: morning
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, morning. Seventh meeting. Andropov speaks for the Soviets in Khrushchev''s defense: the Chinese letter of June 14 attacked him without naming him, and the delegation has named him many times; Khrushchev speaks for the whole of the CPSU Central Committee, so that to criticize him is to criticize the Party, and the Chinese wish to part him from it. He speaks of a "world without arms, armies or wars" and has nothing new. Adjourned.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 613–614 ("the morning of July 17"; the OCR has "July 1" for the 17th; he says Khrushchev''s views are the Central Committee''s). Made public: 1999. Names: Andropov, Khrushchev.'
      tags:
      - polity:prc
      - name:andropov-yuriy-vladimirovich
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr
      src:
        c: 5e011cff
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 613–614: all'
- cite:
    id: cal.1963-07-18.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 614–615 (Wu: in the afternoon of July 18 (Moscow) the delegation gets the Center''s telegram: the CPSU Central Committee has resolved not to settle matters at the talks and is in a very bad temper, naming Mao and other leaders in the Open Letter; in the second half of the talks the delegation is to criticize freely the CPSU leaders including Khrushchev by name, and at least to read its text on Stalin; one or two more meetings and then end the talks, with a recess for a time and a brief communiqué in which each side states its views and the talks are to go on later, but no promise to stop the open polemic, which the Chinese will answer; the Center will issue a statement, print the Open Letter with the editors'' note, and reprint the June 14 Proposal, to let the world judge)'
    units: C-D
- add:
    entry:
      id: cal.1963-07-18.china-leadership-3
      when: July 18
      date: '1963-07-18'
      time_range:
      - 1963-07-18T09:00Z
      - 1963-07-18T15:00Z
      time_band: afternoon
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      follows:
      - cal.1963-07-18.china-leadership
      c: 'Moscow, the Chinese embassy, afternoon. The delegation, having the Center''s telegram, decides to carry out its spirit: criticize without restraint, not fear a break, read the Stalin text at the next meeting; and to prepare to end the talks by proposing at the ninth meeting a pause. All are glad; nothing now binds them.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 615 ("the same afternoon"; the ninth meeting named for the proposal of a pause). Made public: 1999. Check: the Center''s telegram is dated by the nianpu to the evening of July 18 at Peking, the afternoon at Moscow.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: f0f5b73e
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 615: all'
- cite:
    id: cal.1963-07-19.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 615–616 (Wu: the eighth meeting, July 19, Kang Sheng speaking: he opens by charging the CPSU with breaking the agreement, made for the talks, that neither side publish, charge the other or disclose the talks, in the Open Letter, which put the differences before the world; then the dictatorship of the proletariat, the CPSU''s "party and state of the whole people" and Stalin, in a text prepared at Peking from several parts; Khrushchev''s praises of Stalin before the Twentieth Congress and abuse after; Suslov red in the face protests, Ponomarev tries several times to break in, Deng Xiaoping lets Kang Sheng finish, and Suslov protests again and rejects the speech, as never at the seven before)'
    units: B
- variant:
    id: cal.1963-07-19.china-leadership
    unit: C
