- cite:
    id: cal.1963-06-02.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 574 (Wu: June 3, Deng Xiaoping''s talk with the Vietnam Workers'' Party delegation, which had reached Wuhan June 2, Liu Shaoqi not named; its chief point, that the reply should say something of the economic basis of the CPSU''s "state of the whole people" and "party of the whole people")'
    units: A
- check:
    id: cal.1963-06-02.china-leadership
    text: 'Check: Wu (574) dates the talk June 3 and names Deng Xiaoping alone.'
- cite:
    id: cal.1963-06-04.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 574–576 (Wu: Mao''s talk with the Vietnamese delegation, June 4, the day after Deng''s: Mao first on the Vietnamese point (the economic basis of the "whole people" party and state is a point of principle which the draft had not touched, and the Vietnamese saw it); the sharing of the open dispute that China had not wanted public, as with the joint fleet of 1958, which Khrushchev proposed and the Chinese kept secret; Deng on the debt (mostly for war arms, a total of over 5 billion rubles, 60 percent of it; the Port Arthur and Dairen equipment priced at 1.4 billion; trade credits under 300 million; 80 percent paid, 1.2 billion left, to be paid in two years or sooner) and the Vietnamese debt (Lê Duẩn: more than 600 million rubles); Mao: China pays 700 million a year, 600 million next year, 500 million after)'
    units: A-B
- add:
    entry:
      id: cal.1963-06-06.china-leadership-3
      when: June 6
      date: '1963-06-06'
      thread: china-leadership
      also:
      - soviet-union
      c: Wuhan to Peking. After Mao's talk with Lê Duẩn, Wu Lengxi and the drafters are told to go back to Peking, gather the whole drafting group and others, and revise again; Mao would be back soon and have the Politburo adopt the reply. They return June 6.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 576 ("on June 6, from Wuhan"). Made public: 1999. See [[cal.1963-06-04.china-leadership]]. Names: Mao Zedong, Lê Duẩn.'
