- cite:
    id: cal.1962-12-14.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 515–516 (Mao at Wuchang, to whom the editorial was sent for the last word, notes "to Xiaoping: read; it is written very well; there is need to publish such articles," at 12:25 a.m. Dec. 14, and changes the title from "Hold to truth, tell right from wrong, unite against the enemy" to "Workers of the world, unite, oppose our common enemy," ''more embracing and ringing''; plate of the manuscript, 516)'
    units: A-C
- add:
    entry:
      id: cal.1962-12-15.china-leadership
      when: Dec. 15
      date: '1962-12-15'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* editorial "Workers of the world, unite, oppose our common enemy." It sums up the attacks on the CCP and Albania at the Bulgarian, Hungarian and Czechoslovak congresses, above all the Czechoslovak; states China's views on war and peace, on imperialism and nuclear weapons; answers the charges on the Sino-Indian border and on Cuba, as departures from the stand toward enemy and friend; holds that relations among parties cannot be settled by a majority over a minority; and asks the parties to hold to the Moscow Declaration and Statement.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 515–517 (the editorial of Dec. 15 (Mao''s title; the first draft titled "Hold to truth..."); the first of seven articles, Dec. 15, 1962, to Mar. 8, 1963, none naming the CPSU or Khrushchev). See [[cal.1962-12-14.china-leadership]].'
      tags:
      - polity:prc
      src:
        c: 5732b80d
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 515–517: all'
- add:
    entry:
      id: cal.1962-12.china-leadership-2
      when: Dec., after the 8th
      date: 1962-12
      at: after 1962-12-08
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. Liu Shaoqi calls the Standing Committee members in Peking and they decide to answer Togliatti''s more theoretical speech at the Italian congress: an editorial by the *Renmin ribao*, and, by order to the *Hongqi*, a long article on modern revisionism.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 517 ("Liu Shaoqi called the Politburo''s Standing Committee members who were in Peking"; the two pieces to become the editorial of Dec. 31 and the *Hongqi* editorial of 1963, no. 1). Made public: 1999. Names: Liu Shaoqi, Togliatti. Check: the day: Wu gives none; the Italian congress (Dec. 4–8) is past and Mao is already working on the draft at Hangzhou by Dec. 24.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:togliatti-palmiro
      - vis:only:prc
      src:
        c: 263c2d0d
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 517: all'
- cite:
    id: cal.1962-12-30.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 517 (Wu: Mao''s letter of Dec. 30 from Hangzhou to Deng Xiaoping: the article read, written very well, the title also right; it may be broadcast this afternoon and appear in tomorrow''s paper)'
    units: A-B
- add:
    entry:
      id: cal.1962-12-31.china-leadership-4
      when: Dec. 31
      date: '1962-12-31'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* editorial "The differences between Comrade Togliatti and us," in seven parts, on war and peace, nuclear weapons and war, the "paper tiger" view of imperialism and all reactionaries, peaceful coexistence, "structural reform" (peaceful transition), and whether Marxism–Leninism is out of date. It says China is driven to discuss the differences in public because Togliatti and others began it and would argue in public, hopes still for a comradely discussion, and asks again for a conference of the Communist and workers' parties.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 517–518 (the editorial of Dec. 31, 1962, broadcast the afternoon of Dec. 30; the commentary does not name the CPSU or its leaders; Togliatti, Wu says, was much displeased and meant to go on with the open dispute). See [[cal.1962-12-30.china-leadership]]. Names: Togliatti.'
      tags:
      - polity:prc
      - name:togliatti-palmiro
      src:
        c: 6b3ab9ea
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 517–518: all'
- add:
    entry:
      id: cal.1963-01-05.china-leadership-5
      when: Jan. 5
      date: '1963-01-05'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The *Renmin ribao* reprints the long editorial of the *Hongqi*, no. 1 of 1963, "Leninism and modern revisionism." It argues from theory the questions of the age: what kind of age it is, whether imperialism''s nature has changed, whether Marxism–Leninism is outdated, and the home and foreign roots of modern revisionism. It likens the present struggle to Lenin''s with the Second International''s opportunists.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 518–520 (the *Hongqi* editorial (no. 1 of 1963) and the plate of the *Renmin ribao* of Jan. 5, 1963, which reprinted it (the plate''s caption prints the *Hongqi* year as 1965, a slip); Wu holds that it gave the struggle''s nature and direction from theory). See [[cal.1963-01-04.china-leadership]].'
      tags:
      - polity:prc
      src:
        c: 9d850e22
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 518–520: all'
