- add:
    entry:
      id: cal.1962-12-12.soviet-union
      when: Dec. 12
      date: '1962-12-12'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. Khrushchev, speaking to the Supreme Soviet, defends his course in the Cuban crisis and attacks China without naming it. On the Sino-Indian conflict he asks why China's army, now withdrawn, had advanced from its positions at the start.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 499, 504 (Khrushchev''s speech to the Supreme Soviet, Dec. 12; Wu reads it as a reversal of his stand of Oct. 13 and of the *Pravda* editorial of Oct. 25, which had backed China, and as the start of a new wave against China). See [[cal.1962-10-13.soviet-union]]. Names: Khrushchev.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      src:
        c: 9ec3906d
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 499, 504: all'
- add:
    entry:
      id: cal.1962-11-05.soviet-union
      when: Nov. 5–14
      date: '1962-11-05'
      thread: soviet-union
      also:
      - china-leadership
      c: The Bulgarian Communist Party's Eighth Congress opens (to Nov. 14). Zhivkov's report attacks Albania and, in veiled words, the CCP. Suslov heads the CPSU delegation, Wu Xiuquan the CCP's.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 505, 507–508 (the Bulgarian congress, "Nov. 5 to 14"; Wu: "planned" by the CPSU delegation, the congress heats step by step, and some brother parties'' and Bulgarian delegates name the CCP in attack; the first of five congresses (Bulgarian, Hungarian, Czechoslovak, Italian, East German), Nov. 1962 to Jan. 1963; Zhao Yimin led the delegation to the Italian, Wu Xiuquan the other four, both deputy heads of the Liaison Department). Names: Zhivkov, Suslov.'
      tags:
      - polity:prc
      - name:zhivkov-todor
      - name:suslov-mikhail-a
      src:
        c: c14722c9
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 505, 507–508: all'
- add:
    entry:
      id: cal.1962-11-08.soviet-union
      when: Nov. 8
      date: '1962-11-08'
      thread: soviet-union
      also:
      - china-leadership
      c: The Chinese delegation, Wu Xiuquan at its head, speaks to the Bulgarian congress, as the hosts had set the day. It reads the text settled at Peking, answering the attack on Albania only; the speakers after it name the CCP in attack, and the delegation has no further chance to speak.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 508 (Deng Xiaoping had told the delegation before it left that if there were no attacks on Albania or China it was to read the text settled at home, and to be ready, as at the Twenty-second Congress, to answer an attack on Albania; the text had no reply to attacks on China, which no one had foreseen; Wu calls this "a misstep" (失着)). See [[cal.1962-11-05.soviet-union]].'
      tags:
      - polity:prc
      src:
        c: 9401579d
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 508: all'
- add:
    entry:
      id: cal.1962-11-20.soviet-union
      when: Nov. 20
      date: '1962-11-20'
      thread: soviet-union
      also:
      - china-leadership
      c: The Hungarian Socialist Workers' Party's Eighth Congress opens. From the first speeches Hungarian and other parties' delegates attack the Albanian party and the CCP.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 508–509 (the Hungarian congress "from Nov. 20"; Peking had told the delegation beforehand, after the Bulgarian congress, to be ready to answer attacks on China as well as on Albania; the delegation set down to speak the next day). See [[cal.1962-11-08.soviet-union]].'
      tags:
      - polity:prc
      src:
        c: 0b304491
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 508–509: all'
- add:
    entry:
      id: cal.1962-11-21.soviet-union
      when: Nov. 21
      date: '1962-11-21'
      thread: soviet-union
      also:
      - china-leadership
      c: Wu Xiuquan, for the CCP delegation, speaks to the Hungarian congress and says the delegation regrets the attacks on the Albanian party and the CCP. Through the congress more than thirty delegations attack the Albanian party, some naming the CCP; the Bulgarian congress had had a score or so.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 509 (the delegation was set down for the 21st; "thirty-odd" parties'' delegates against Albania, "not naming, even naming" the CCP, against twenty-odd at Bulgaria; the tone higher). See [[cal.1962-11-20.soviet-union]].'
      tags:
      - polity:prc
      src:
        c: e11131f6
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 509: all'
- add:
    entry:
      id: cal.1962-11.china-leadership
      when: Nov., after the 21st
      date: 1962-11
      at: after 1962-11-21
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. Liu Shaoqi calls a meeting on the delegation''s cable from the Hungarian congress, asking how to answer. The congress soon to end, it has a statement drafted at once, to be given out before the closing, and a cable telling the delegation to seize the chance and make three points: the blame for the worsening of Sino-Soviet and Soviet–Albanian relations is the CPSU''s; the chorus against China is the CPSU''s staging; a conference of the brother parties is to be called to remove the differences.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 509–510 (the cable and the statement sent together; the statement said the delegation came for unity, some parties used one congress after another to attack the Albanian and Chinese parties by name, such a use of a congress''s platform solves nothing, is abnormal, and grieves friends and gladdens foes; it asks for a conference of the brother parties). Made public: 1999. Names: Liu Shaoqi. Check: the day: Wu gives none; after the Chinese speech of Nov. 21 and before the congress closed.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
      src:
        c: f5c8b21b
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 509–510: all'
- add:
    entry:
      id: cal.1962-11.soviet-union
      when: Nov., closing day
      date: 1962-11
      at: after 1962-11-21
      thread: soviet-union
      also:
      - china-leadership
      follows:
      - cal.1962-11.china-leadership
      c: At the Hungarian congress's closing reception, the Chinese delegation has its statement read out in Hungarian and hands round Hungarian and Russian texts. It calls the use of one party's congress to attack another abnormal, to the grief of friends and joy of foes, and urges a conference of the brother parties. Kádár tells the delegation he regrets the statement; it answers that the Hungarians abused China at the congress and now at the reception, and leaves.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 510 (the statement and Peking''s cable reached the delegation just after the congress''s morning session ended, before the evening reception; the delegation''s head said a few words, an interpreter read the whole in Hungarian, the texts handed out on the spot; Wu has it from the delegation that neither Hungarians nor Soviets expected this, and that the Soviet delegation had some one delegate, possibly long an exile at Moscow, speak abusively; Kádár came to the delegation to say he regretted the statement). Names: Kádár. Check: the day: the congress''s closing day, which Wu does not give.'
      tags:
      - polity:prc
      - name:kadar-janos
      src:
        c: 08e661c9
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 510: all'
- add:
    entry:
      id: cal.1962-12-04.soviet-union
      when: Dec. 4–8
      date: '1962-12-04'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Prague. The Czechoslovak Communist Party''s Twelfth Congress opens (to Dec. 8). Novotný''s report attacks Albania sharply and the CCP without naming it, supporting Albania being supporting their dogmatism, sectarianism and nationalism; Brezhnev, heading the CPSU delegation and speaking second, abuses Albania and attacks, unnamed, "those who call themselves Marxists." A few parties apart, the delegations then attack Albania and name the CCP: of sixty-odd foreign delegations, fifty-odd name Albania, twenty-odd of them the CCP.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 510–511 (the congress "from Dec. 4 to Dec. 8"; Novotný''s report "as he began it"; Brezhnev second; the two speeches "a mobilization order"; more than at Bulgaria or Hungary). See [[cal.1962-11-21.soviet-union]]. Names: Novotný, Brezhnev.'
      tags:
      - polity:prc
      - name:novotny-antonin
      - name:brezhnev-leonid
      src:
        c: 1daeeaea
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 510–511: all'
- add:
    entry:
      id: cal.1962-12-04.soviet-union-2
      when: Dec. 4–8
      date: '1962-12-04'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Prague. The head of the Korean delegation to the Czechoslovak congress will not join in the attack on China: if a party''s attitude to the CPSU is a measure of its internationalism, he says, so is its attitude to the CCP. Some delegates reprove him for it.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 511 ("stepped forward" (挺身而出) in his greeting and did not agree to the attacks on the CCP, which he said greatly harmed the common cause of the working class of every country). See [[cal.1962-12-04.soviet-union]]. Check: the day: Wu gives none; during the congress, Dec. 4–8. The head''s name is not given.'
      tags:
      - polity:prc
      src:
        c: 024d6259
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 511: all'
- add:
    entry:
      id: cal.1962-12-05.soviet-union
      when: Dec. 5
      date: '1962-12-05'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Prague. The Chinese delegation speaks to the Czechoslovak congress on its second day, after Novotný and Brezhnev, and answers their attacks on the CCP and Albania at once: deep pain at a congress platform used again, a year after the CPSU''s congress, for public one-sided attacks on other parties, and great regret. The hall stamps, bangs tables, hisses, shouts; the delegation reads to the end.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 511–512 (set down for "the second day" (第二天), as at the Hungarian congress; Wu: the hosts seemingly meant the Chinese to speak first and be answered after, but Novotný and Brezhnev had attacked first). See [[cal.1962-12-04.soviet-union]]. Names: Novotný, Brezhnev. Check: the day: Wu gives "the second day"; Dec. 5, the congress having opened Dec. 4 (510).'
      tags:
      - polity:prc
      - name:novotny-antonin
      - name:brezhnev-leonid
      src:
        c: 16bf3080
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 511–512: all'
- add:
    entry:
      id: cal.1962-12.soviet-union
      when: Dec.
      date: 1962-12
      thread: soviet-union
      also:
      - china-leadership
      c: The Italian Communist Party's congress, held, Wu says, at the same time as the Czechoslovak. Togliatti and others attack the CCP in public.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 505, 517 (the "Tenth" congress at 505, "the Fourth" at 517, Wu''s slip; "at the same time" as the Czechoslovak congress, "both in December"; Zhao Yimin led the CCP delegation; Togliatti''s speech "with some theoretical coloring"). See [[cal.1962-12-04.soviet-union]]. Names: Togliatti. Check: the days: Wu gives the month and "at the same time"; the congress''s own dates are not read.'
      tags:
      - polity:prc
      - name:togliatti-palmiro
      src:
        c: 3d2f3bef
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 505, 517: all'
- add:
    entry:
      id: cal.1962-12-07.china-leadership
      when: Dec. 7
      date: '1962-12-07'
      time_range:
      - 1962-12-06T22:00Z
      - 1962-12-07T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, morning. Liu Shaoqi presides at the Standing Committee on the delegation''s report from Prague. The congresses'' attacks on Albania and China are growing worse and the Czechoslovak is most abnormal. It decides on a special statement by the delegation, with instructions: hold to principle and struggle, answer after, leave room, never leave the congress; Deng Xiaoping has the writers draft both at once. It decides too to write commentaries answering the attacks in public, the Czechoslovak congress first, the attackers'' words to be printed beforehand, the CPSU and Khrushchev not yet named, as Mao has said more than once; Mao agrees by Yang Shangkun''s telephone call.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 512, 514 ("the morning of Dec. 7"; Deng Xiaoping told the writers to draft at once the instruction telegram and the special statement, both to Prague; "in no case leave the congress, stay to the end"). Made public: 1999. See [[cal.1962-12-05.soviet-union]]. Names: Liu Shaoqi, Deng Xiaoping, Mao Zedong, Khrushchev.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
      - name:deng-xiaoping
      src:
        c: dc567314
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 512, 514: all'
- add:
    entry:
      id: cal.1962-12-08.china-leadership-2
      when: Dec. 8
      date: '1962-12-08'
      time_range:
      - 1962-12-07T16:00Z
      - 1962-12-07T22:00Z
      time_band: predawn
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
