      c: Hangzhou, Liuzhuang, evening. Mao holds the Standing Committee on the day the drafters arrive, with Peng Zhen, Chen Boda, Kang Sheng and Wu Lengxi present. Asked about the two drafts on the general line, Deng Xiaoping says neither is ripe and each needs large revision; Hangzhou has many views on Peking's and Peking on Hangzhou's. Mao has Deng gather both sides to exchange them, he himself staying out and sending his secretary Lin Ke to listen.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 562–563 ("the evening of the day we arrived"; Mao''s residence the Liuzhuang; the enlarged Standing Committee''s two subjects, home ("the four clean-ups," socialist education, a decision drafted almost wholly by Mao''s dictation and put in order by Chen Boda, the later "Former Ten Points") and abroad (the two drafts); the regional secretaries joined the first; Mao then gave himself to the "Former Ten Points"). Made public: 1999. See [[cal.1963-05-02.china-leadership-5]]. Names: Mao Zedong, Peng Zhen, Chen Boda, Kang Sheng, Deng Xiaoping. Check: the Mao chronology has Mao at Shanghai the afternoon of May 3 ([[cal.1963-05-03.china-leadership]]).'
      tags:
