- cite:
    id: cal.1963-03-05.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 530 (the editorial printed Mar. 8)'
    units: B
- cite:
    id: cal.1963-03-07.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 552–557 (Wu: Mao''s Standing Committee of Mar. 7 makes the final revisions of the reply, which goes next day to the Politburo under Liu Shaoqi (550 has the Standing Committee on Mar. 8); few views on the text; the two meetings review the seven articles of the open polemic and the line ahead, with Mao, Liu, Zhou, Deng and others speaking)'
    units: B-C
- add:
    entry:
      id: cal.1963-03-08.china-leadership-3
      when: Mar. 8
      date: '1963-03-08'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The Politburo, Liu Shaoqi presiding, approves the reply to the CPSU Central Committee''s letter of Feb. 21, which the Standing Committee under Mao had finally revised the day before. With the Standing Committee of Mar. 7, it reviews the seven articles of the open polemic and settle the line: talks with the CPSU, to be led by Deng Xiaoping, with neither Mao nor Liu; a conference of the parties, not feared though the CPSU would have a majority; no split begun by China; the open polemic held back from Mar. 9.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 552–557 (Liu Shaoqi''s remarks: the wave against China is offensive in form and defensive in substance, and the open answer defensive in form and offensive in substance; the writers'' seven pieces had beaten back the wave, the main target being the CPSU leaders though not named; "hold to principle, do not fear the splitting, keep the left, win the middle"; on the talks: go for agreement, but with two hands, one for a good result and one for a break; Mao will not appear; the delegation to be of the level of 1960''s). Made public: 1999. See [[cal.1963-03-07.china-leadership]]. Names: Liu Shaoqi, Deng Xiaoping, Mao Zedong. The Standing Committee''s day: Mar. 7 (552), as the Mao chronology ([[cal.1963-03-07.china-leadership]]); Wu has Mar. 8 at 550. Check: Zhou Enlai''s chronology has a Politburo on the reply Mar. 5 ([[cal.1963-03-05.china-leadership-3]]); whether that is this session.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:mao-zedong
      - vis:only:prc
      src:
        c: ebc02c11
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 552–557: all'
- add:
    entry:
      id: cal.1963-03-08.china-leadership-4
      when: Mar. 8
      date: '1963-03-08'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The *Renmin ribao* editorial "Comment on the statement of the Communist Party of the USA," answering the American party''s statement of Jan. 9, which had attacked the CCP and, on the Cuban crisis, charged China with a "double standard": no risks taken over Taiwan, Hong Kong and Macao, others urged to take them. The editorial answers that the double standard is others'', on the Indian border and on Cuba.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 530 ("Mar. 8"; the last of the seven articles of Dec. 15, 1962, to Mar. 8, 1963, none naming the CPSU or Khrushchev). See [[cal.1963-03-05.china-leadership]].'
      tags:
      - polity:prc
      src:
        c: 98adff5e
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 530: all'
- cite:
    id: cal.1963-03-09.china
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 550–552 (Wu: Mar. 9, Deng Xiaoping and Peng Zhen summon Chervonenko and hand him the reply in person; it agrees to stop the open polemic, announces the CCP''s own halt from Mar. 9 in publishing articles, agrees to a conference of the parties and to the two-party talks to prepare it, and proposes that a CPSU delegation come to Peking, Khrushchev not being named, since the Soviet ambassador said the date of his Cambodian trip was not set; if not, a CCP delegation to go to Moscow)'
    units: B
