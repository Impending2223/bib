    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 569 (Wu: Kim Il Sung''s delegation arrives at Peking May 26 and talks first with the leaders of the Party under Liu Shaoqi, with Zhou Enlai and Deng Xiaoping)'
    units: A
- add:
    entry:
      id: cal.1963-05-28.china-leadership-2
      when: May 28
      date: '1963-05-28'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking to Wuhan. Liu Shaoqi flies with Kim Il Sung to Wuhan, where they lodge at the Baihua Hotel, Buildings 1 and 2, by the East Lake. Deng Xiaoping takes the drafters in another plane; they lodge in Buildings 3 and 4. Mao is at the Hubin villa, rebuilt in 1959 as a tall stone house joined to an indoor swimming pool.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 569 ("on the 28th"; the Hubin villa (湖滨别墅)). Made public: 1999. See [[cal.1963-05-26.china-leadership-2]]. Names: Liu Shaoqi, Kim Il Sung, Deng Xiaoping, Mao Zedong. Check: Liu Shaoqi''s chronology has Liu fly to Wuhan May 29 (patch b15b-liu-1963-69, a cite on [[cal.1963-05-29.china-leadership]]).'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:kim-il-sung
