      c: Wuhan. The Vietnam Workers' Party delegation arrives, under Lê Duẩn, with Trường Chinh, Nguyễn Chí Thanh and others, and the Vietnamese ambassador, to give its view of the reply.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 574 ("on June 2"; the delegation "to follow the Koreans"; Wu names also Trần Quỳnh and another, and the ambassador as 黄明芳). Made public: 1999. See [[cal.1963-05-29.china-leadership]]. Names: Lê Duẩn, Trường Chinh, Nguyễn Chí Thanh.'
      tags:
      - polity:prc
