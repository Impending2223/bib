- cite:
    id: cal.1963-05-22.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 568–569 (Wu: Mao, at Hangzhou, May 22, asks Wilcox, general secretary of the New Zealand party, his view of the draft, then still the Chen Boda text not yet revised at Peking; Mao: the document not yet ripe; he is very dissatisfied with the first part of the general line, too long, repetitive, not terse, bright or comprehensive; it says five views are to be criticized, but all 21 points and the tail criticize them; Stalin, the Twentieth, Twenty-first and Twenty-second Congresses to be left as a title only, kept for the two parties'' talks; the Peking revision made it 25 points)'
    units: A-B, E
- add:
    entry:
      id: cal.1963-05.china-leadership
      when: May, after the 23rd
      date: 1963-05
      at: after 1963-05-23
      thread: china-leadership
