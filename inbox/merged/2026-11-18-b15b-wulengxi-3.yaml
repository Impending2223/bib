      when: June 7
      date: '1963-06-07'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. From June 7 Deng Xiaoping presides over the drafting group, revising from the beginning, paragraph by paragraph, the draft already revised at Wuhan; each passage as it is revised is reprinted and sent to Mao, the Politburo's members and others concerned. Liu Shaoqi takes part at times. The 21 points of the reply grow to 25.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 576–577 ("from the next day"; amended places marked in red for Mao, Liu and Zhou Enlai; "a new passage a time reprinted"). Made public: 1999. Names: Deng Xiaoping, Liu Shaoqi, Mao Zedong.'
      tags:
