      c: Peking, the Diaoyutai. At Deng Xiaoping's direction Wu Lengxi, Qiao Guanhua, Yao Zhen, Fan Ruoyu, Wang Li and Xiong Fu, and the younger drafters from the Propaganda Department, the *Renmin ribao*, Xinhua, the Liaison Department and the Foreign Ministry, meet for two or three days on Chen Boda's draft. They commend what is good in it and ask for additions and changes; Wu sums up their views in a short list of points.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 561 ("two or three days" of meetings; the "back-row members" (后排议员); the discussion on the main questions, not on details of wording). Made public: 1999. Names: Deng Xiaoping, Chen Boda, Qiao Guanhua. Check: the days: Wu gives none.'
