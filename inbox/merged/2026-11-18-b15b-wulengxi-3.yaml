- cite:
    id: cal.1963-06-12.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 576–577 (Wu: June 12, Liu Shaoqi presides at the full Politburo, which passes the revised reply; all the drafts had been sent to its members beforehand; few changes, passed quickly; the draft''s first title "Reply of the Chinese Central Committee to the CPSU Central Committee''s letter of Mar. 30" is changed at the last drafting by Mao)'
    units: B
- add:
    entry:
      id: cal.1963-06-14.china-leadership
      when: June 14
      date: '1963-06-14'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The Central Committee's reply to the CPSU letter of Mar. 30 is dated June 14, in Mao's title "A Proposal Concerning the General Line of the International Communist Movement," with the subtitle "Reply of the Central Committee of the CCP to the Central Committee of the CPSU's letter of Mar. 30, 1963." Mao has it so that it is at once an answer to the CPSU's letter and a proposal to all the brother parties, for the two parties' talks and the conference of parties, and not forced on any. Introduction, 25 points, conclusion.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 577–580 ("the date June 14, 1963"; the plate of Mao''s manuscript of the title (578: "June 1963"); Wu: "we do not want to force it on anyone"; the points of the Proposal summarized at 579–592). Made public: the text, the *Renmin ribao*, June 17, 1963 (590); Mao''s part in it, 1999. See [[cal.1963-06-12.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: d7b2049a
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 577–580: all'
