      c: Peking. The *Renmin ribao* prints an article on the Dange group of the Indian Communist Party, criticizing Dange's wrong stand on the Sino-Indian border conflict only, with nothing on the dispute within the international movement.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 553 ("the *Renmin ribao* of Mar. 9," image-checked; Wu does not count it among the seven articles of Dec. 15 to Mar. 8, it treating only Dange''s stand on the border conflict).'
