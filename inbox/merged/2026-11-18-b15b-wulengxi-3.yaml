patch: 2026-11-18-b15b-wulengxi-3
by: 'Claude (batch 15, second wave: Wu Lengxi, Shinian lunzhan, run 3, pp. 491-630), Nov. 18, 2026'
ops:
- add:
    entry:
      id: cal.1962-02-22.soviet-union
      when: Feb. 22
      date: '1962-02-22'
      thread: soviet-union
      also:
      - china-leadership
      c: The Central Committee of the CPSU writes to the Central Committee of the CCP, in answer to the Chinese delegation's speech at the CPSU's Twenty-second Congress, which criticized, without naming the CPSU, the attack on Albania. It charges the CCP with a "special position," a line apart from the other parties', and support of Albania; it asks for better relations and more unity, and that the CCP give up the position and take the "common line."
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 491 (the letter of Feb. 22, 1962; the CCP''s Central Committee took it up a month later, being then busy with the aftermath of the Seven Thousand Cadres Conference). Made public: 1999. See [[cal.1962-02-18.china-leadership]]. Check: the letter''s date is Wu''s alone here; the Presidium''s record (Apr. 14) and the nianpu (Mar. 20) both call it the letter of Feb. 22.'
      tags:
      - polity:prc
      - vis:only:prc+ussr
      src:
        c: bcd9a1b6
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 491: all'
- add:
    entry:
      id: cal.1962-03-27.china-leadership-3
      when: Mar. 27
      date: '1962-03-27'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, the Xilou of Zhongnanhai. The Politburo, Liu Shaoqi presiding, takes up the CPSU Central Committee''s letter of Feb. 22, a month after its date. It reads the letter three ways (a wish to ease relations; a pretext to put the blame for worse ones on China; an attempt to part the CCP from Albania and the other left parties) and decides to hold to principle and unity, and to answer with a proposal for a conference of the brother parties with no precondition, in steps: CPSU–CCP talks, CPSU–Albanian talks, a three-party meeting, the twelve ruling parties, then the 81. The writers of the 1960 Reply to form a group to collect the Soviet breaches of the Statement since 1960, and the Liaison Department, the Foreign Ministry, Xinhua and the Investigation Department each another.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 492–494 (the Politburo''s meeting of Mar. 27 in the Xilou (西楼), Liu Shaoqi presiding; the reading of the letter in three ways; the five steps (CPSU–CCP, CPSU–Albanian, the three, the twelve, the 81; "they can talk first, to prepare the conference, not to settle the others'' affairs"); the reply to be "reasonable, right and moving," without Khrushchev''s name; the Indonesian, Vietnamese and New Zealand parties'' proposals of Feb. and Mar. for CPSU–CCP talks and a conference, which the CPSU had refused in Feb., to be taken up and answered after the CPSU; the writers to move to the Diaoyutai when the material was in). Made public: 1999. See [[cal.1962-03-20.china-leadership]]. Names: Liu Shaoqi. Check: whether this is the Politburo''s first reading of the letter: the nianpu has a Central Committee draft reply of Mar. 15 ([[cal.1962-03-20.china-leadership]]), a fortnight before Wu''s meeting; Wu does not mention a draft.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
      src:
        c: c3350750
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 492–494: all'
- add:
    entry:
      id: cal.1962-04-07.soviet-union
      when: Apr. 7
      date: '1962-04-07'
      thread: soviet-union
      also:
      - china-leadership
      c: 'The Chinese Central Committee''s reply to the CPSU letter of Feb. 22 is handed to the Soviet ambassador at Peking and, the same day, by the Chinese ambassador at Moscow to the CPSU Central Committee. It proposes a conference of the brother parties in five steps: CPSU–CCP talks, CPSU–Albanian talks, a meeting of the CPSU, Albania and the CCP, the twelve ruling parties, then the 81.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 494 (the Standing Committee settled the text in early April after a week of drafting; "formally sent" Apr. 7, to the Soviet ambassador in China and by the Chinese ambassador in the USSR to the CPSU Central Committee). Made public: 1999. See [[cal.1962-04-07.china-leadership]]. Check: the hour and the Chinese ambassador at Moscow are not named; the nianpu does not date the delivery.'
      tags:
      - polity:prc
      - vis:only:prc+ussr
      src:
        c: 041c25d2
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 494: all'
- cite:
    id: cal.1962-04-03.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 494 (the reply, after a week of drafting by the writers, settled at the Standing Committee in early April and sent Apr. 7)'
    units: B
- cite:
    id: cal.1962-05-31.soviet-union-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 494 (the CPSU''s answer of May 31 to the Chinese letter of Apr. 7: in effect a refusal of a conference of the brother parties, since it makes the improvement of Albania''s relations with the USSR a precondition, asking the Albanian party to give up its position and yield to the CPSU leaders)'
    units: A-B
- cite:
    id: cal.1962-04-30.china-leadership-3
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 494–495 (Wu, on Apr. and May 1962 in the Tacheng and Ili areas of Xinjiang: tens of thousands of people (later counted at about 50,000) gone to the Soviet side, which he ascribes to Soviet subversion; the Chinese government''s strong protest and its demand that the Soviet consulates at Yining and Urumqi stop work and be withdrawn)'
    units: A
- add:
    entry:
      id: cal.1962-04.china-4
      when: Apr.–May
      date: 1962-04
      thread: china
      also:
      - china-leadership
      c: Fujian. Nationalist troops from Taiwan harass the coast, landing in many small parties; they are wiped out or fall back.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 495 ("at this very time" as the crossings from the Tacheng and Ili areas of Xinjiang, Apr.–May 1962; Wu: the landings "in the east" and the Soviet action "in the west," at a time of economic difficulty and adjustment, played on each other). Check: the days: Wu gives none.'
      tags:
      - polity:prc
      src:
        c: f98737af
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 495: all'
- variant:
    id: cal.1962-07-22.china-leadership
    unit: B
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: Indian troops enter a river valley of the western sector, in Xinjiang, on July 22 (7月22日); China protests most strongly
    at: '497'
- cite:
    id: cal.1962-07-22.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 497 (Wu: "July 22," Indian troops enter a river valley of the western sector, in Xinjiang (the day: variant); the Chinese governments strongest protest, refused; the frontier troops ordered not to fire, to fall back when pressed, to keep the clash small)'
    units: B-C
- cite:
    id: cal.1962-09-21.china
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 497 (Wu: Sept. 21, Indian troops cross the McMahon line in the eastern sector and kill and wound Chinese officers and men; the strongest protest, refused; the frontier troops again forbidden to open fire)'
    units: A
- cite:
    id: cal.1962-10-08.south-asia-3
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 497 (Wu: on Oct. 8 the Chinese government tells the Soviet ambassador that India has massed troops on the border and seems to mean war, and asks the Soviet government to use its influence and to persuade Nehru to turn back from the cliff''s edge; the Indian prime minister, in spite of seven strong protests, had not stopped the advance and had said in Parliament that China''s troops on the border must be cleared out)'
    units: A
- cite:
    id: cal.1962-10-13.soviet-union
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 497–498 (Wu: Oct. 13, Khrushchev himself calls in the Chinese ambassador, Liu Xiao, and says the USSR supports China''s stand for a peaceful settlement and would, in China''s place, protest as strongly to India; Wu ties it to the American–Soviet tension over Cuba, when Khrushchev needed China''s support)'
    units: A
- variant:
    id: cal.1962-10-20.india-and-china
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: the Indian army attacks on the eastern and western sectors at once, Oct. 20, with more than ten brigades and air support, and takes a large tract of Chinese territory; the Chinese frontier forces then counterattack ("自卫反击," a counterattack in self-defense)
    at: '498'
- cite:
    id: cal.1962-10-24.south-asia
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 498–499 (Wu: the government''s statement of Oct. 24 proposes an end to the conflict, new talks and a peaceful settlement; both armies to withdraw 20 kilometers and break contact, the Chinese in the east to north of the line of actual control, in the middle and western sectors neither side to cross the customary line; India refuses)'
    units: A-D
- cite:
    id: cal.1962-10-25.south-asia
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 498 (Wu: *Pravda*''s editorial of Oct. 25 supports China''s position, holds the McMahon line illegal and backs the proposals of the Chinese statement of Oct. 24 for a peaceful settlement)'
    units: A
- cite:
    id: cal.1962-11-21.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 499 (Wu: India refusing, the Chinese government announces a unilateral cease-fire along the whole border from midnight, Nov. 22, and a withdrawal from Dec. 1 to the Chinese side of the line of actual control of Nov. 7, 1959, and 20 kilometers back from it)'
    units: B, D-E
- cite:
    id: cal.1962-10-22.missile-crisis
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 500–501 (Wu, from Robert Kennedy''s account: Kennedy''s television address the evening of Oct. 22, the naval quarantine within 500 miles of Cuba, more than a hundred warships; the CIA''s U-2 had found the missile sites Oct. 16)'
    units: A-B
- cite:
    id: cal.1962-10-23.missile-crisis-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 501 (Wu: Khrushchev''s reply of Oct. 23: no missile bases in Cuba, the blockade "piracy," which the Soviet Union would not obey)'
    units: A
- cite:
    id: cal.1962-10-27.missile-crisis
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 503 (Wu: Oct. 27, an American U-2 shot down over Cuba; the White House meeting decides to bomb the missile bases, then to propose that Khrushchev withdraw them under American inspection)'
    units: B
- add:
    entry:
