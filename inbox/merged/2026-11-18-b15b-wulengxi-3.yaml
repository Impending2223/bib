- cite:
    id: cal.1963-04-03.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 558–560 (Mao at his house, the afternoon of Apr. 3, to the Standing Committee: the letter too long, not finished, he would hear the views first; Zhou Enlai: Khrushchev''s group will not change its line and dresses it up; talks cannot rest on the letter''s basis; Deng Xiaoping: a counter-proposal stating the general line from the basic principles of Marxism–Leninism, as in 1957, when the CPSU drafted first and China next; Mao: print the CPSU letter in the *Renmin ribao*, reply in the form of a positive statement of views, not a dispute with the letter, from the contradictions of the age to the end of open polemic; the talks may end in a great quarrel; Deng to prepare and bring it to the Standing Committee again)'
    units: A-G
- add:
    entry:
