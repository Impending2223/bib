- cite:
    id: cal.1963-05-29.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 570–571 (Mao''s talk with Kim Il Sung at the Hubin villa, May 29, the first: for the Korean side Kim with several others, for the Chinese Liu Shaoqi, Deng Xiaoping, Kang Sheng, Wang Renzhong, Wu Xiuquan, Fan Ruoyu, Yao Zhen, Wang Li, Wu Lengxi and the ambassador to Korea, Hao Deqing; Mao: the reply drafted by the writers, the Standing Committee has read it, the Politburo not yet formally, it is asked of the Korean friends, and next of the Vietnamese, that it be made correct before it appears; not a joint document but the CCP''s, "if it is wrong, we are the ones to be spanked"; Liu on his visit to Vietnam, May 6–16: Hồ Chí Minh and Lê Duẩn fear a break; he told them to think what to do if one comes; Hồ would rather none but prepared)'
    units: A-G
- add:
    entry:
      id: cal.1963-05-29.china-leadership-3
      when: May 29
      date: '1963-05-29'
      thread: china-leadership
      also:
      - soviet-union
      follows:
      - cal.1963-05-29.china-leadership
      c: Wuhan. Eight a side, the Chinese drafters and the Koreans, go through the reply paragraph by paragraph, in the afternoon and evening. For the Chinese, Wu Lengxi, Wu Xiuquan, Wang Renzhong, Yao Zhen, Fan Ruoyu, Wang Li, Kang Sheng and Ambassador Hao Deqing; for the Koreans five named, the ambassador and two interpreters. The Koreans' many points are for the Chinese to weigh and not to be altered on the spot; the unclear wording is explained, and many are accepted.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 572 ("that afternoon and evening"; Mao''s proposal at the end of the first talk, "you send some men, we send some"; "eight against eight, exactly equal"; the Koreans'' points taken into the revision under Deng Xiaoping). Made public: 1999. Names: Kang Sheng.'
      tags:
      - polity:prc
      - name:kang-sheng
      - vis:only:prc+dprk
      src:
        c: 3da47aa8
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 572: all'
      time_range:
      - 1963-05-29T04:00Z
      - 1963-05-29T14:00Z
      time_zone: Asia/Shanghai
- add:
    entry:
      id: cal.1963-05-30.china-leadership-2
      when: May 30
      date: '1963-05-30'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Wuhan, the Hubin villa. Mao''s second talk with Kim Il Sung, the two delegations present, Kim speaking first. He has read the paper several times, finds it good and strong, its spirit to carry the revolution through; it will help to win the middle, and the right cannot sweep it aside. Mao: the aim is to win the middle and leave the right unable to refute; the paper has much pepper and little sugar. Kim: no problem of principle, but how great the shock when it appears; both pepper and sugar; the middle parties and the nationalist states, to be won, and the right will still call China sectarian, nationalist, Trotskyist.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 572–574 ("the second day (May 30)"; Kim: the paper "a very strong document"; Mao: "they will not be able to fasten revisionism and right opportunism on us"; the points of the Korean delegation noted down for Deng Xiaoping''s later discussion). Made public: 1999. Names: Mao Zedong, Kim Il Sung.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:kim-il-sung
      - vis:only:prc+dprk
      src:
        c: ed9df5dc
