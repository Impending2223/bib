- add:
    entry:
      id: cal.1963-06.china-leadership-5
      when: June, after the 21st
      date: 1963-06
      at: after 1963-06-21
      thread: china-leadership
      also:
      - soviet-union
      follows:
      - cal.1963-06.china-leadership-4
      c: 'Peking. Mao''s Standing Committee on the CPSU''s statement and resolution: with the Secretariat before it, it judges the talks'' prospects poor and calls for full preparation. Deng Xiaoping to lead the delegation, Peng Zhen assisting, more to be added; Mao asks Deng to think out a plan. Deng asks first for a few days'' rest at Chengdu for the tired drafters; Mao agrees.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 594 (the drafters tired by the revisions of the reply and the preparation of the talks; "a tightening and a loosening"). Made public: 1999. See [[cal.1963-06.china-leadership-4]]. Names: Mao Zedong, Deng Xiaoping, Peng Zhen. Check: the day: Wu gives none; after the Secretariat''s meeting and before June 25.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
      src:
        c: 8abe6c87
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 594: all'
- add:
    entry:
      id: cal.1963-06-25.china-leadership-2
      when: June 25–26
      date: '1963-06-25'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking to Chengdu and back. Deng Xiaoping and Peng Zhen, with Wu Lengxi, Yao Zhen, Xiong Fu, Fan Ruoyu, Wang Li and a number of younger drafters, fly to Chengdu June 25 for a rest before Moscow. They arrive at noon and lodge at the Jinniuba Hotel; Wu's party drives to the foot of Mount Emei, which they reach at dusk, and does not climb. At midnight Deng's secretary Wang Ruilin telephones from Chengdu that Mao wants them back in Peking the next day; they return to Chengdu at dawn and fly to Peking in the afternoon.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 594–595 ("left Peking June 25"; "noon at Chengdu"; Deng: "if we go, go quickly, Mao may think of something and recall us"; Yao Zhen''s old injury to the back, Xiong Fu just over an illness; Wu wished to climb the mountain; "a military order is like a mountain falling"; Wu''s party "wished the mountain well from its foot"). Made public: 1999. Names: Deng Xiaoping, Peng Zhen, Mao Zedong. Check: whether Deng and Peng Zhen also went to Emei: Wu says only that his party did; Mao''s reason for the recall is not given.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:peng-zhen
      - name:mao-zedong
      - vis:only:prc
      src:
        c: a8a7b254
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 594–595: all'
- add:
    entry:
      id: cal.1963-06-26.china-leadership-2
      when: June 26
      date: '1963-06-26'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking, evening. Mao holds the Standing Committee on the Moscow talks, the day the drafters are back, the first of three sessions. Opening, Liu Shaoqi finds three marks in the CPSU since its Twenty-second Congress (views the 1960 meeting struck down revived; the rules among parties broken, by the Albanian break and the open polemic; Yugoslavia praised) and sees no good result; Mao takes the plenum's resolution of June 21 to show Khrushchev has decided, the talks likely worse than 1957's or 1960's; Zhou Enlai names Khrushchev's three fears, imperialism, Marxism–Leninism and the people.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 595–596 ("that evening (June 26), Mao called the Standing Committee, and then two more in succession"; "at the start" the Standing Committee analyzed the situation). Made public: 1999. See [[cal.1963-06-25.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Khrushchev. Check: the two further meetings: Wu gives no days; the Mao chronology has meetings each afternoon June 28–30 ([[cal.1963-06-28.china-leadership]]).'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:khrushchev-nikita-s
      - vis:only:prc
