      id: cal.1963-06.china-leadership-4
      when: June, after the 21st
      date: 1963-06
      at: after 1963-06-21
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The Secretariat takes up the CPSU Central Committee's statement of June 18 and the resolution of its plenum of June 21.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 594 ("the Secretariat''s meeting and the Standing Committee meeting Mao later called"). Made public: 1999. See [[cal.1963-06-21.soviet-union]]. Check: the day: Wu gives none; after the CPSU plenum of June 21 and before June 25.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
