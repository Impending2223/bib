      when: June 15
      date: '1963-06-15'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. Pan Zili, the new Chinese ambassador, to whom the text has been carried by a courier, asks to see the CPSU Central Committee and is received by Suslov. He hands over the Proposal as the reply to the CPSU letter of Mar. 30.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 579 ("the Proposal handed over as a reply"; the text carried to Moscow by a person after Mao''s final reading; "on June 15"). Made public: 1999. See [[cal.1963-06-14.china-leadership]]. Names: Suslov.'
      tags:
      - polity:prc
      - name:suslov-mikhail-a
      - vis:only:prc+ussr
      src:
        c: 63a83b73
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 579: all'
- add:
    entry:
      id: cal.1963-06-17.china-leadership-3
      when: June 17
      date: '1963-06-17'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* prints the Proposal in full, and Xinhua and the radio broadcast it, two days after it was handed over, the time used to make the foreign-language texts exact so that the broadcasts in other languages go out with the Chinese; pamphlets are issued in many tongues.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 579, 591 ("on June 17"; the plate of the *Renmin ribao* of Apr. 4 and June 17, 1963 (590); Wu: it "caused a great stir in the whole world"; the two general lines laid side by side before all communists, the CPSU''s of Mar. 30 and the CCP''s of June 14). See [[cal.1963-06-15.soviet-union]].'
      tags:
      - polity:prc
      src:
        c: f62e0530
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 579, 591: all'
- add:
    entry:
      id: cal.1963-06-18.soviet-union
      when: June 18
      date: '1963-06-18'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. The CPSU Central Committee issues a statement rejecting the Chinese Central Committee's letter of June 14 as groundless attack on the CPSU, and saying that it cannot print the document in the Soviet press. The Chinese letter had hoped the CPSU would print the Chinese reply as China had printed its letter of Mar. 30.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 593 ("on June 18, the CPSU Central Committee issued a statement"). See [[cal.1963-06-15.soviet-union]].'
      tags:
      - polity:prc
      src:
        c: 97375efc
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 593: all'
- cite:
    id: cal.1963-06-19.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 593 (Wu: the CPSU Central Committee''s statement of June 18, which rejects the Proposal as groundless attack and refuses to print it, the CCP having printed the CPSU''s letter of Mar. 30 and having hoped that the CPSU would print the reply)'
    units: B
- add:
    entry:
      id: cal.1963-06-21.soviet-union
      when: June 21
      date: '1963-06-21'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. The CPSU Central Committee, meeting in plenum, passes a resolution flatly rejecting the Chinese letter of June 14, affirms the line of the Twentieth, Twenty-first and Twenty-second Congresses, and charges its delegation to the coming talks to set out and defend it. Khrushchev speaks to the plenum.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 593–594, 599 ("on June 21, the CPSU convened a plenum of the Central Committee and passed a resolution"; the resolution "in a fierce tone"; Khrushchev''s speech at the plenum called the Chinese letter "groundless slander" in the Chinese Central Committee''s statement of July 1). See [[cal.1963-06-18.soviet-union]]. Names: Khrushchev.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      src:
        c: c926a440
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 593–594, 599: all'
- add:
