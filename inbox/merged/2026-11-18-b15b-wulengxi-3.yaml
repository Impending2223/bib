      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 560–561. Made public: 1999. Names: Mao Zedong, Deng Xiaoping, Chen Boda. Check: the day: Wu gives none; after Chen''s draft reached Peking, late April.'
