- add:
    entry:
      id: cal.1963-05-05.china-leadership-5
      when: May 5
      date: '1963-05-05'
      thread: china-leadership
      also:
      - soviet-union
      c: Hangzhou, Liuzhuang. Mao holds the Standing Committee on the Peking and Hangzhou drafts, Zhou Enlai and Deng Xiaoping, Peng Zhen, Lu Dingyi, Chen Boda, Kang Sheng and Wu Lengxi present, Liu Shaoqi abroad. He asks Wu his age (44) and says the young men are right. The reply is to set out the Party's view of the general line, as a proposal to the CPSU and the parties, in theory and with bearing on practice, from the contradictions of the age; Chen Boda to revise it and take it to Peking to work with the writers; to stay in the Standing Committee until ripe, then to ask the Korean, Vietnamese, New Zealand, Japanese and Indonesian parties; the paper the CCP's own proposal, not a common paper of the left parties.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 565–567 (the Liuzhuang on a peninsula of the West Lake; Mao: "Chen Boda, you too count as an old man, beaten by the young"; the reply to be an answer to the CPSU''s letter of Mar. 30 and a proposal; it to be taken to Peking, Zhou Enlai and Deng Xiaoping agreeing; Mao: the CCP''s alone, to avoid the name of sectarianism; Wu and Yao Zhen at first to stay to help Chen, but Chen, not satisfied, had them sent back to Peking). Made public: 1999. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Peng Zhen, Lu Dingyi, Chen Boda, Kang Sheng, Liu Shaoqi. Check: Zhou Enlai at Hangzhou May 5: Zhou''s chronology has him at Xihuating, Peking, that day ([[cal.1963-05-05.china-leadership-2]]) and at the Secretariat May 6 ([[cal.1963-05-06.china-leadership]]).'
