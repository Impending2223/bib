      c: Peking, before dawn. The telegram of instructions and the special statement for the delegation at Prague go out. Drafted Dec. 7 at the Standing Committee's order, revised by Deng Xiaoping that night, approved by Liu Shaoqi and Zhou Enlai, they have the delegation say it came for unity, that some Czechoslovak and other comrades used the congress's platform to go on attacking the Albanian party and the CCP, against the Moscow Declaration and Statement and for the enemy's gain, and that uproar and stamping prove nothing.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 512–513 ("early on the 8th" (8 日凌晨); the statement''s lines: the delegation came "with a sincere wish to strengthen" unity; the attacks "do not accord" with the Declaration and Statement; the uproar and stamping "cannot prove" them right; the attacks "can only deepen differences, make a split"; pain for friends, joy for foes). Made public: 1999. See [[cal.1962-12-07.china-leadership]]. Names: Deng Xiaoping, Liu Shaoqi, Zhou Enlai.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:liu-shaoqi
      - name:zhou-enlai
      - vis:only:prc
      src:
        c: 2fbd09f7
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 512–513: all'
- add:
    entry:
      id: cal.1962-12-08.soviet-union
      when: Dec. 8
      date: '1962-12-08'
      thread: soviet-union
      also:
      - china-leadership
      follows:
      - cal.1962-12-08.china-leadership-2
      c: Prague. Before Novotný's closing speech the Chinese delegation hands its statement to the congress's executive chairman, asking that it go to the delegations, and gives Brezhnev a Russian copy. Novotný breaks off, announces it and reads it through to the congress. Afterward Czechoslovak staff return the Russian and Czech texts, saying the congress has no duty to circulate them; the delegation hands them out itself, in the hall and outside.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 513–514 (the delegation, having translated the statement into Czech and Russian, took it into the hall "before Novotný''s closing speech ended"; Wu cannot say whether Novotný''s reading it was anger or a wish to give China an account; "all the congress heard China''s answer"). Names: Novotný, Brezhnev.'
      tags:
      - polity:prc
      - name:novotny-antonin
      - name:brezhnev-leonid
      src:
        c: 4b17195c
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 513–514: all'
