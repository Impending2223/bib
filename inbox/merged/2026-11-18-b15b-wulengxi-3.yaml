      c: The Chinese government's second statement on Cuba, of the same line as that of Oct. 25.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 503–504 (the second of the two statements, Oct. 25 and Oct. 30). See [[cal.1962-10-25.china-leadership-2]]. Check: the statements'' texts are not read: Wu gives the dates and his summary only; the day of the second as Wu prints it, image-checked.'
