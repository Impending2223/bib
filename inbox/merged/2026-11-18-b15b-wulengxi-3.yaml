      c: Peking, the Diaoyutai, Building 8. Deng Xiaoping, with Peng Zhen, Kang Sheng and Wu Lengxi, goes straight from the Standing Committee to the drafting group's seat and presides at its meeting on how to draft the reply on the general line. He relays the views of Mao, Liu Shaoqi and Zhou Enlai; the group agrees and asks for a draft quickly; Wu is to make a first outline.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 560 (the group formally led by Kang Sheng, in practice by Deng; Wu to prepare an outline, then the group to discuss, revise and add). Made public: 1999. Names: Deng Xiaoping, Peng Zhen, Kang Sheng, Liu Shaoqi, Zhou Enlai, Mao Zedong.'
