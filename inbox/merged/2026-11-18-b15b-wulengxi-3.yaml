      c: Moscow. Khrushchev, speaking at the Soviet–Hungarian friendship rally, abuses the Chinese without naming them, and attacks Mao's view of the atomic bomb as a paper tiger.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 617–618, 621 ("on the 19th, at the Soviet–Hungarian friendship meeting"; Deng Xiaoping later told Khrushchev to his face that he had called the Chinese a special line and splitters, himself and his friends the Marxist–Leninist line). Names: Khrushchev, Mao Zedong.'
      tags:
