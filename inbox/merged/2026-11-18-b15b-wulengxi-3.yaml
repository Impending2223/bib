      c: 'The Chinese government''s statement on Cuba: it supports Cuba against American aggression, and supports the Soviet Union''s stand against it.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 503–504 (two statements, Oct. 25 and Oct. 30; Wu: China did not say it supported Khrushchev''s shipping of missiles to Cuba, nor opposed their withdrawal; it opposed Soviet loss of nerve before American threats and the giving up of the defense of Cuba''s sovereignty, and an American demand for international inspection of Cuba). Check: the statements'' own texts are not read: Wu gives the dates and his summary only.'
      tags:
      - polity:prc
      src:
        c: de586eda
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 503–504: all'
