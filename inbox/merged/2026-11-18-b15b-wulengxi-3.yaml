      follows:
      - cal.1963-07-19.china-leadership
      c: 'Peking to Moscow, evening. Zhou Enlai telephones the delegation direct, in a few words: the Center agrees with its proposal, the line is set and no more detail is needed. The delegation reports on the afternoon''s meeting, and that it will propose at the next meeting that the talks pause and ask for a Soviet delegation, Khrushchev especially, at Peking.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 616 ("that evening"; the delegation''s cable of the afternoon reporting the eighth meeting and that, having put the Stalin question, it would propose a pause at the next meeting and ask the CPSU to send a delegation to Peking, Khrushchev especially, since Mao had refused to go to Moscow; Wu supposes the Soviets, who it seems tapped the line, knew of it). Made public: 1999. Names: Zhou Enlai, Khrushchev, Mao Zedong. Check: whether this is the telegram of the entry for the evening of July 19 at Peking ([[cal.1963-07-19.china-leadership-2]]), which the nianpu calls a telegram; Wu says the Soviets probably heard it (the visibility is Peking''s alone on the call''s face).'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:khrushchev-nikita-s
      - name:mao-zedong
      - vis:only:prc
      src:
        c: cd473d09
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 616: all'
- add:
    entry:
      id: cal.1963-07-20.china-leadership-3
      when: July 20
      date: '1963-07-20'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow. Ninth meeting. Deng Xiaoping, by the plan the Center approved, speaks first: from the eight meetings the two parties are seen to differ gravely, the Soviet papers since the Open Letter of July 14 are attacking the CCP, agreement is not to be had and even calm talks are hard to keep; the Chinese delegation proposes that the talks pause until a time agreed, the next to be in Peking, Khrushchev to lead the Soviet delegation. Suslov, regretting that no agreement was reached, agrees to the pause but would not now fix the time and place; Deng says Khrushchev''s grievances, voiced the day before at the rally, may be heard at Peking.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 616–618 ("the ninth meeting on July 20"; Suslov: "the time and place to be settled later"; Deng: "he can say them to us direct"; Wu thinks the Soviets heard Zhou''s telephone call). Made public: 1999. See [[cal.1963-07-19.china-leadership]]. Names: Deng Xiaoping, Suslov, Khrushchev.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:suslov-mikhail-a
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr
      src:
        c: 5400edf0
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 616–618: all'
- add:
    entry:
      id: cal.1963-07-20.china-leadership-4
      when: July 20
      date: '1963-07-20'
      thread: china-leadership
      also:
      - soviet-union
      follows:
      - cal.1963-07-20.china-leadership-3
      c: 'Moscow. After the ninth meeting Deng Xiaoping sends Wu Lengxi and Yao Zhen, with Satyukov and a section head of the CPSU''s International Department, to a small room to revise the Soviet draft communiqué. Deng''s instructions: no "friendly, comradely atmosphere," each side to state its views; nothing agreeing to stop the open polemic; the talks adjourned and to be resumed later, time and place to be settled. The "atmosphere" clause becomes: the two sides stated their positions on the world, the movement and Sino-Soviet relations; the polemic clause is left out; the last paragraph: at the Chinese delegation''s proposal the delegations'' work is adjourned, to be resumed later, time and place to be settled by the two Central Committees. Both delegations read it and agree.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 618–621 (Wu to Deng for instructions, "follow the Center''s telegram"; Satyukov for the Soviets held that the talks were in a friendly atmosphere and that agreement had been reached to stop the open dispute; Wu: "you published an open letter during the talks"; the Soviet insistence on "agreement reached to stop the open polemic," the Chinese counterproposal of a fair agreement sought jointly, neither stands; Satyukov adds "developments in the world today"; the Soviets will not agree to Peking as the place or a date). Made public: 1999. Names: Deng Xiaoping. See [[cal.1963-07-22.china-leadership-4]].'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc+ussr
      src:
        c: cd19f3f7
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 618–621: all'
- add:
    entry:
      id: cal.1963-07-20.soviet-union
      when: July 20
      date: '1963-07-20'
      thread: soviet-union
      also:
      - china-leadership
      follows:
      - cal.1963-07-20.china-leadership-4
      c: 'Moscow. Khrushchev gives a banquet for the Chinese delegation; the toasts are to health. He tells Deng Xiaoping there are no serious differences, the differences are invented. Deng: his Soviet–Hungarian rally speech called China''s line special and splitting, the Soviet line Marxist–Leninist, and the Chinese letter of June 14 and the Soviet letter of July 14 are two lines side by side. Khrushchev: leave the words to the writers. Deng asks that the Soviets print the Chinese articles and statements as the Chinese print the Soviet; Khrushchev: they cannot print groundless attacks; Deng: they are Khrushchev''s own words, as Liu Shaoqi had asked him in 1960 not to speak so much; Khrushchev shrugs.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 621–622 ("that evening"; Deng: the Chinese had printed the CPSU''s Mar. 30 and July 14 letters, and would print more, and hoped the Soviets would print their seven articles and the statements of July; Khrushchev: "we do not want to sharpen the open dispute"). Made public: 1999. Names: Khrushchev, Deng Xiaoping, Liu Shaoqi. The day: Wu puts the banquet "that evening" after the communiqué''s publication, July 22 (621), but the delegation left Moscow at 11 that night (622) and at Peking the next afternoon, July 21 ([[cal.1963-07-21.china-leadership]]), talked of "last night''s" banquet (623): July 20.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      - name:deng-xiaoping
      - name:liu-shaoqi
      - vis:only:prc+ussr
      src:
        c: 046bb8e0
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 621–622: all'
