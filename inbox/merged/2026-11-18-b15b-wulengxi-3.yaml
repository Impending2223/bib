      c: Harriman, before leaving for Moscow, says that one reason for the agreement the United States, the USSR and Britain are seeking on a partial ban of nuclear tests is that it may check the spread of nuclear weapons, and that the United States and the USSR can cooperate to prevent China's getting nuclear strength.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 628 (Harriman, then Under Secretary of State for Political Affairs, in a statement of June 21, as Wu gives it; Wu: the treaty "aimed at China"). Names: Harriman. Check: the statement''s own text is not read: Wu is the only source here.'
      tags:
      - polity:prc
      - name:harriman-w-averell
      src:
        c: 98edb6a2
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 628: all'
- add:
    entry:
      id: cal.1963-07-29.china
      when: July 29
      date: '1963-07-29'
      thread: china
      also:
      - testing
      - soviet-union
      c: 'Harriman, back in Washington, tells reporters that in Moscow he and Khrushchev had discussed the possibility of China''s nuclear development. Khrushchev, he says, did not seem unduly disturbed: it would be a very long time before the Chinese had any significant nuclear capacity, as he believes China lacks the industrial base for nuclear weapons and delivery systems, the USSR having given no industrial technical aid since 1960.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 629 (Harriman''s remarks as Wu quotes them, in a Chinese version; Wu: it shows that Khrushchev, in the party talks, "was bent on drawing close to the United States"). See [[cal.1963-07-29.testing]]. Names: Harriman, Khrushchev. Check: the remarks'' own text is not read: Wu quotes them from a Chinese translation.'
      tags:
      - polity:prc
      - name:harriman-w-averell
      - name:khrushchev-nikita-s
      src:
        c: d65e2cc7
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 629: all'
- cite:
    id: cal.1963-07-31.china
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 629–630 (Wu: the Chinese government''s statement of July 31 says the treaty is meant to consolidate the three powers'' nuclear monopoly and to bind the hands of every peace-loving state under nuclear threat; that Khrushchev, once against a partial ban, has made a turn of 180 degrees, betraying the Soviet and Chinese peoples'' interests and surrendering to American imperialism; and it repeats China''s stand for the complete, thorough and resolute prohibition and destruction of nuclear weapons)'
    units: A-C
