- cite:
    id: cal.1963-05-07.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 562 (Wu on the enlarged Standing Committee at Hangzhou, to which Wu''s party came May 2: its two subjects, the home one ("guard against revisionism at home"; the draft decision of the "Former Ten Points" on rural work, almost wholly dictated by Mao and put in order by Chen Boda, discussed chiefly by the regional bureaus'' secretaries) and the foreign one (the Peking and Hangzhou drafts of the reply on the general line))'
    units: A-B
- add:
    entry:
      id: cal.1963-05-17.china-leadership-2
      when: May 17
      date: '1963-05-17'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking, the Diaoyutai, Building 8. From May 17, for a week, Deng Xiaoping presides over the drafting group and the writers in discussing and revising the reply, morning and afternoon, passage by passage; the writers work nights on the passages left unfinished. Deng and Peng Zhen move into Buildings 11 and 10.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 567–568 ("from May 17"; "a whole week"; the writers, back from Hangzhou in mid-May, had joined the good points of the two drafts; Chen Boda brought his revised draft back to Peking, which Mao would read only after Deng''s and Liu Shaoqi''s discussion). Made public: 1999. Names: Deng Xiaoping, Peng Zhen. Check: the span: Wu gives "from May 17, a whole week."'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
      src:
        c: 54df9428
        rows:
