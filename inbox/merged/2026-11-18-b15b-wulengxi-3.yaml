      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 618–621 ("the communiqué was published July 22"; its text as the delegations settled it July 20). See [[cal.1963-07-20.china-leadership-4]]. Check: the day is Wu''s alone; the communiqué''s text in *Pravda* and the *Renmin ribao* is not read.'
