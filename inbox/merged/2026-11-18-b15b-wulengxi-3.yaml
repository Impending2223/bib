- cite:
    id: cal.1963-01-16.berlin-and-vienna
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 520–521 (Wu: Khrushchev, in person at the SED''s Sixth Congress (Jan. 15–21), names the CCP in attack for the first time, and asks for an end to open polemic, with Albania''s giving up its views as the condition; the hosts set the Chinese delegation''s greeting for the 18th, after Ulbricht and Khrushchev and some days of speeches)'
    units: A
- add:
    entry:
      id: cal.1963-01-17.china-leadership-3
      when: Jan. 17
      date: '1963-01-17'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. Liu Shaoqi calls the Politburo on the delegation''s cable from East Berlin: Khrushchev has named the CCP for the first time and asked for an end to open polemic, and the other speakers follow. It decides to change the delegation''s greeting, take the high line, speak for true unity against false and expose the trick of "stop the polemic." The delegation to speak whatever happens, with the text translated and printed beforehand and every Chinese in Berlin handing it round after.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 521–522 (Jan. 17, Liu Shaoqi''s Politburo; the delegation to expect interference, even interruption, and to have its text translated, typed and handed out from several places by the embassy, delegation, Xinhua and the students). Made public: 1999. Names: Liu Shaoqi, Khrushchev.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: 9d139b85
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 521–522: all'
- add:
    entry:
      id: cal.1963-01-18.soviet-union
      when: Jan. 18
      date: '1963-01-18'
      thread: soviet-union
      also:
      - china-leadership
      c: 'East Berlin. Wu Xiuquan speaks for the CCP at the SED''s Sixth Congress, the hosts having set it some days after Ulbricht''s and Khrushchev''s speeches and let only first secretaries and the Chinese and Czechoslovak heads speak. He answers Khrushchev''s call without naming him: to listen to the words of those who offer conciliation and watch their deeds; against false unity and a real split; regret again that a party''s congress is used to attack another party. The chair rings the bell and the hall shouts, whistles and bangs; the delegation stops and goes on, to the end.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 520–522 (set down for the 18th; the congress closed Jan. 21; Wu: the head said off the text that such conduct showed their "civilization," which the interpreter also voiced aloud; the text circulated by all Chinese in Berlin). Names: Ulbricht, Khrushchev.'
      tags:
      - polity:prc
      - name:ulbricht-walter
      - name:khrushchev-nikita-s
      src:
        c: 8c20c2fc
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 520–522: all'
- add:
    entry:
      id: cal.1963-01-27.china-leadership-2
      when: Jan. 27
      date: '1963-01-27'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* editorial "Unite on the basis of the Moscow Declaration and the Moscow Statement." It says for the first time that the open polemic began with the CPSU's Twenty-second Congress and its public naming of Albania; recalls that China had asked since Apr. 1962 for a conference of the brother parties and an end to attacks on the radio and in the press, and had been refused; and holds that to ask for an end of attacks while attacking is not an honest communist's way.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 522–524 (the editorial of Jan. 27, 1963, the fourth article; the Diaoyutai writers drafted it and the Standing Committee settled it; Mao at Hangzhou approved it by letter of Jan. 25; the Center held it not yet time to name Khrushchev). See [[cal.1963-01-25.china-leadership]].'
      tags:
      - polity:prc
      src:
        c: 72aadeba
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 522–524: all'
- cite:
    id: cal.1963-01-25.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 523 (Wu: Mao''s letter of Jan. 25 to Deng Xiaoping: the editorial sent on the 24th (廿四日, which the OCR reads as the 14th) read, written very well, may be published)'
    units: A
- cite:
    id: cal.1963-02-06.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 527–530 (Wu: the *Hongqi* article (nos. 3–4 of 1963), "More on the differences between Comrade Togliatti and us: some great questions of Leninism today" (Mao''s final title), of 110,000 characters in eight parts; Mao took great interest in it, gave many opinions through February and made many important changes himself; it opens with the "third great debate" in the history of Marxism, and argues from the main contradictions of the age, war and peace, state and revolution, and the two-front struggle)'
    units: A
- add:
    entry:
      id: cal.1963.china-leadership-2
      when: 1963, Hongqi nos. 3–4
      date: '1963'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The *Hongqi* prints, in nos. 3 and 4 of 1963, the long article "More on the differences between Comrade Togliatti and us: some great questions of Leninism today," a reply, in the *Hongqi* editors'' name, to Togliatti''s objection that the *Renmin ribao*''s editorial of Dec. 31 lacked clarity. It treats the debate among Communists as the third great debate in the history of Marxism, and puts the contradictions of the age, war and peace, state and revolution, the two-front struggle, and "Workers and oppressed nations of the world, unite."'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 527–530 (an article of 110,000 characters in eight parts, whose eight heads Wu lists; Togliatti was much displeased and meant to go on with the open dispute, so the *Hongqi*''s editors wrote to have a full debate on theory with practice; the article also criticizes Khrushchev''s "peaceful transition" by implication). See [[cal.1963-02-06.china-leadership]]. Check: the day: Wu gives the issue numbers, nos. 3–4 of 1963, not the date.'
      tags:
      - polity:prc
      src:
        c: fa97153b
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 527–530: all'
- add:
    entry:
      id: cal.1963-02.china-leadership
      when: Feb.
      date: 1963-02
      at: after 1963-02-11
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, the Central Work Conference (Feb. 11–28). Deng Xiaoping speaks at length on the struggle against revisionism: its course since the CPSU''s Twentieth Congress; the efforts of the Party to work on and to criticize the CPSU, at the Moscow meetings of 1957 and 1960, which did not stop Khrushchev''s revisionism; the new period opened by the Twenty-second Congress, with the systematizing of revisionism in theory and the cruder and cruder splitting; and the turn from private to public dispute, with five congresses used for attacks on the CCP.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 532 ("in this Central Work Conference" (Feb. 11–28, 1963); "in the seven years from the CPSU''s Twentieth Congress" (七年间); the conference''s discussion that follows (532–537) is of the course of Khrushchev''s wave, its five features, the nature of the struggle, its long course, the line and its tactics, the likelihood of a break). Made public: 1999. See [[cal.1963-02-11.china-leadership]]. Names: Deng Xiaoping. Check: the day within Feb. 11–28; whether the speech is a group meeting''s, or part of the closing day''s papers ([[cal.1963-02-28.china-leadership]]).'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
      src:
        c: 6a1abdd9
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 532: all'
- cite:
    id: cal.1963-02-25.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 532–537 (Wu''s account of the conference''s discussion of the struggle against revisionism, speakers named only as "everyone" and "leading comrades of the Center": the wave against China has five features (Khrushchev, hurt by the Indian border war and Cuba, turns it on China; it is open but leaves room; his "majority" fails, 20, 30, 40 parties at five congresses, fewer than in 1960; the left parties speak; the split question is raised); the struggle defends Marxism–Leninism and will be long; the line: principle against revisionism, unity against splitting, revolution against surrender, peace against imperialism, "unite and struggle, struggle to unite," no concession on principle or sovereignty, China never to split first; 42 parties now attack China (535))'
    units: B
- check:
    id: cal.1963-02-25.china-leadership
    text: 'Check: the report: Wu (532–537) gives the conference''s discussion of the struggle against revisionism, in these matters, without naming Liu Shaoqi as speaker; Deng Xiaoping is named as speaking on it at the conference.'
- add:
    entry:
      id: cal.1963-02-22.soviet-union
      when: Feb. 22
      date: '1963-02-22'
      thread: soviet-union
      also:
      - china-leadership
      c: Peking. Ambassador Chervonenko hands Wu Xiuquan, vice-minister of the Liaison Department, the CPSU Central Committee's letter, signed Feb. 21, in the middle of the Central Work Conference. It asks to stop the open polemic, to call an international meeting and, to prepare it, to begin with talks between the two parties.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 542 (the letter signed Feb. 21 and given to Wu Xiuquan Feb. 22; it followed the *Renmin ribao*''s fourth article, of Jan. 27, which, Wu says, alarmed Khrushchev''s group; the letter was printed in the *Renmin ribao* Mar. 14 with the replies (551)). See [[cal.1963-02-15.soviet-union-leadership]]. Names: Chervonenko.'
      tags:
      - polity:prc
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
      src:
        c: 2cd9e8a5
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 542: all'
- cite:
    id: cal.1963-02-23.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 543 (the Standing Committee in Mao''s bedroom at the Juxiang Shuwu, Mao in pajamas, half sitting against the bed, still recovering from a cold taken on coming back from his two months away; he, Liu Shaoqi, Zhou Enlai and Deng Xiaoping agree that the CPSU''s proposals are what China proposed in Apr. 1962, accepted now as the CPSU''s own, and take them up, though it may be a delaying move; the others leave; Liu and Zhou stay to receive the ambassador with Mao)'
    units: A-B
- cite:
    id: cal.1963-02-23.china-leadership-2
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 543–550 (from 8 p.m. to past 10 p.m., in Mao''s bedroom, Mao in pajamas, Mao doing most of the talking, Liu Shaoqi and Zhou Enlai interjecting, Chervonenko listening and offering no view; six points: the letter, read that day, good in tone and welcome, but words and deeds at odds, Khrushchev having called at the East German congress for a halt while himself attacking; the *Renmin ribao* printing the Soviet pieces since Feb. 20; 43 parties abuse China; China will reply in part and keep the rest in reserve; a pause is welcome, China having proposed it first, through Zhou Enlai, at the Twenty-second Congress; the open polemic no worse than "the sky falling"; talks at Peking, before or after Khrushchev passes through for Cambodia, or a Chinese delegation to Moscow, not Mao to Moscow; the 1957 manner better than the 1960; the formal reply within two weeks)'
    units: B-D, F-I
- variant:
    id: cal.1963-02-23.china-leadership-2
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: only Liu Shaoqi and Zhou Enlai stay with Mao to receive Chervonenko; Wu leaves with Deng Xiaoping and learns afterward how Mao received him
    at: '543'
- add:
    entry:
      id: cal.1963-02-27.china-leadership-2
      when: Feb. 27
      date: '1963-02-27'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* editorial "Whence the differences? A reply to Comrade Thorez and others." It traces the differences from the CPSU's Twentieth Congress but, for the movement's sake, takes up only the time since the Moscow Declaration of 1957; dates the opening of the public dispute to Sept. 9, 1959, when the agency of a socialist country, not named, issued a statement on the Sino-Indian conflict; defends the 1960 articles on Leninism; blames the Bucharest meeting of June 1960; charges the cancelling of hundreds of contracts; states China's stand on the Indian border and on Cuba; and holds that an end of public polemic must be mutual and full.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 525–527 (the editorial of Feb. 27, 1963; it names Thorez and others of the French party, which of the parties of the capitalist countries was loudest against China and Albania, Korea, Vietnam, Indonesia, Japan, Burma, Thailand and Malaya; the paper did not name the USSR or TASS; one of the three articles the Work Conference decided to write, the others being the second Togliatti piece and the answer to the American Communist statement). Names: Thorez.'
      tags:
      - polity:prc
      - name:thorez-maurice
      src:
        c: c29940ac
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 525–527: all'
- cite:
    id: cal.1963-02-28.china-leadership
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 537–540 (Wu on Mao''s closing remarks, Feb. 28: true Marxists to unite and educate the cadres and masses who do not understand Marxism, hence socialist education in the villages; 90 percent of the intellectuals approve the anti-revisionist articles (image: 百分之九十); 43 parties abuse China, and their texts are all to be printed; after a few more articles, a pause ("a tightening and a loosening"); Deng Xiaoping, agreeing, conveys the Standing Committee''s decision: stop after the planned articles; the two parties'' talks first, a third conference of the parties perhaps after; five possible states of relations, from a form of unity with differences to a split of everything; four tasks (finish the articles and turn to pamphlets; prepare the talks; strengthen propaganda abroad and the work with the left; guard against revisionism at home))'
    units: B, E
- add:
    entry:
      id: cal.1963-02.china-leadership-2
      when: Feb.
      date: 1963-02
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The Standing Committee, Mao back from his months away, formally names the Central Committee's anti-revisionist drafting group, under the Standing Committee. Kang Sheng heads it, Wu Lengxi is deputy; its members include Liao Chengzhi, Wu Xiuquan, Liu Ningyi, Zhang Hanfu and Kong Yuan, with the writers Xu Liqun, Yao Zhen, Qiao Guanhua (deputy head once the two-party talks begin), Wang Li, Fan Ruoyu, Hu Sheng and Xiong Fu; Chen Boda sits with it as he pleases. Drafts go first to a meeting under Deng Xiaoping, with Peng Zhen, Lu Dingyi, Luo Ruiqing and Liang Biye, and then to the Standing Committee.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 540–541 (the group''s work from Nov. 1962; the writers together at the Diaoyutai from Dec. 1962; named at the Standing Committee after Mao''s return, Feb. 1963; it kept at work until the start of the Cultural Revolution in May 1966, when it broke up; Qiao Mu (Hu Qiaomu) had been wholly on leave since the summer of 1961 by Mao''s order). Made public: 1999. Names: Kang Sheng, Qiao Guanhua, Chen Boda, Deng Xiaoping, Peng Zhen, Lu Dingyi, Luo Ruiqing, Mao Zedong. Check: the day: Wu gives Feb. 1963, after Mao''s return to Peking; the session is not dated.'
