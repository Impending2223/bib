      - soviet-union
      c: Wuhan to Peking, by telephone. The day after the Peking draft of the reply reaches him at Wuhan, Mao asks that the foreign party comrades in Peking and some foreign experts be asked their views first; Deng Xiaoping has the Liaison Department arrange it.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 568 ("the next day"; those asked: leaders of the Burmese, Malaysian and Thai parties and others of Southeast Asia, and the Liaison Department''s advisers Adler (艾德勒) and Coe (柯弗兰), members of the American party, Coe once, Wu says, head of the State Department''s finance division, in China from the late 1950s; their views gathered, what could be changed changed at once, the rest listed for study; the Standing Committee''s plan had been to invite the Korean and Vietnamese parties once the revision was out). Made public: 1999. Names: Mao Zedong, Deng Xiaoping. Check: the day: Wu gives none; after the drafting week from May 17 and before Kim Il Sung''s arrival, May 26.'
      tags:
