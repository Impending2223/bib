      when: Apr. 18
      date: '1968-04-18'
      thread: elections-1968
      also:
      - cities-and-housing
      c: 'Washington, the American Society of Newspaper Editors. Rockefeller, "The Making of a Just America": $150 billion
        to rebuild the cities, raised by "the imaginative and responsible use of credit"; "we cannot wage our wars, educate
