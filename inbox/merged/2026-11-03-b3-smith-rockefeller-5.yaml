        *Buffalo Evening News*, Jan. 11, 1969 (cited by [[w.smith-on-his-own-terms]], 522). To check: Joseph Canzeri, interview
        by Richard Norton Smith; Kenneth Riland''s diary, May 23, 1968 (cited by [[w.smith-on-his-own-terms]], 522). Names:
