        to scuttle the Urban Development Corporation; Robinson''s help asked in promoting it in the Negro neighborhoods.'
      n: '[[w.smith-on-his-own-terms]], 526. To check: Sam Singletary to Jackie Robinson, Apr. 12, 1968, Rockefeller Archive
        Center (cited by [[w.smith-on-his-own-terms]], 526). See [[cal.1968-04-09.cities-and-housing-ny]]. Names: Jackie Robinson,
