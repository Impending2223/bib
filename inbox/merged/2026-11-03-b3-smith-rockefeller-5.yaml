- add:
    entry:
      id: cal.1968-02-16.elections-1968
      when: Feb. 16
      date: '1968-02-16'
      thread: elections-1968
      also:
      - jobs-and-wages
      c: 'New York, Fifty-fifth Street, lunch: Rockefeller with Schlesinger and Kissinger. Romney''s "people think I am double-crossing
        him." He expects to outpoll Romney in New Hampshire, a write-in, and might carry Oregon; Nixon could sweep the primaries
        and lose the nomination. "There are eighteen Republican governors who want me." "You know, I have my roots in the
        New Deal."'
      n: '[[w.smith-on-his-own-terms]], 507, 511–12 (on Lindsay and the Guard: "I think he hoped to see on the front page
        of every newspaper in the country pictures of chaos in New York City because Governor Rockefeller called out the National
        Guard"; on Vietnam, hints of doubt that a military victory is possible). To check: Arthur Schlesinger Jr., unpublished
        journal, Feb. 19, 1968; Schlesinger, *Journals, 1952–2000*, 278 (cited by [[w.smith-on-his-own-terms]], 507, 512).
        See [[cal.1968-02-10.jobs-and-wages-nyc]]. Names: Rockefeller, Schlesinger, Kissinger, Romney, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:schlesinger-arthur-m-jr
      - name:kissinger-henry-a
      - name:romney-george-w
      - name:nixon-richard-m
      src:
        c: '55454158'
        rows:
        - 'w.smith-on-his-own-terms 507, 511–12: all'
        - 'via x.1968-02-19.schlesinger-journal-feb-19-1968: all'
