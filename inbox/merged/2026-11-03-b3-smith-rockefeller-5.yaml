      date: '1965-05-11'
      thread: mayors
      also:
      - republican-party
      c: 'Albany, N.Y., the Executive Mansion, at dinner, by Price''s account. Price, Lindsay''s campaign manager, brings
        him from Washington on Rockefeller''s plane. Rockefeller asks Lindsay to run; to Price: "An hour after he announces,
        you have half a million dollars." Price to Rosenthal of the *New York Times*: "Abe, run the story."'
      n: '[[w.smith-on-his-own-terms]], 472–73 (the gift near $800,000 with the family''s gift taxes; Lindsay''s account,
        his decision made the weekend before; Rockefeller''s, Lindsay talking mostly to Happy Rockefeller). To check: Robert
        Price, interview by Richard Norton Smith (cited by [[w.smith-on-his-own-terms]], 472–73). Check: Smith has Monday,
        May 11; May 11, 1965, was a Tuesday. See [[cal.1965-02-26.mayors-nyc]]. Names: Lindsay, Rockefeller.'
      tags:
      - name:lindsay-john-v
      - name:rockefeller-nelson
      - state:ny
      src:
        c: 0336d416
        rows:
