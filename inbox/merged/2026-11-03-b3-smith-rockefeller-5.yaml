      when: Feb. 9
      date: '1968-02-09'
      thread: jobs-and-wages
      c: 'New York, 2 a.m. The mediation panel proposes $425; DeLury and his stewards accept, and Rockefeller. At 2:45 a.m.,
        by telephone, Lindsay rejects it as excessive: no bargaining with a union on an illegal strike, and the time now to
        break the public employees'' unions; Rockefeller has him repeat it and writes it down.'
      n: '[[w.smith-on-his-own-terms]], 508–9. To check: Harry Albright, chronology of the strike, 6–10 (cited by [[w.smith-on-his-own-terms]],
        509). See [[cal.1968-02-08.jobs-and-wages-nyc]]. Names: Rockefeller, Lindsay.'
      tags:
      - name:rockefeller-nelson
      - name:lindsay-john-v
      - state:ny
