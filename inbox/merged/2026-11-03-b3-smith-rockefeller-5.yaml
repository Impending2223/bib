      when: Apr. 6
      date: '1968-04-06'
      thread: king
      c: 'Rockefeller sends Canzeri, Boyd and Wyatt Tee Walker to Atlanta, his money behind them, to help the King family.
        Canzeri, at Coretta King''s bedside, plans the funeral: the Marriott''s top floor, four cars with telephones, the
        casket, a farm wagon and mules; then a plane for her return to Memphis to finish the march.'
