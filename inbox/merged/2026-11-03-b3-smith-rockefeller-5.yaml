      n: '[[w.smith-on-his-own-terms]], 462. To check: Robert F. Wagner, oral history, 1069, Columbia Center for Oral History;
        *Economist*, Feb. 13, 1965; Hevesi, *Legislative Politics in New York State*, 99–101 (cited by [[w.smith-on-his-own-terms]],
        462). Check: the day. See [[cal.1965-01-06.legislatures-ny]]. Names: Rockefeller, Wagner.'
      tags:
      - name:rockefeller-nelson
      - name:wagner-robert-f-jr
      - state:ny
      src:
        c: dfcc1a78
        rows:
        - 'w.smith-on-his-own-terms 462: all'
