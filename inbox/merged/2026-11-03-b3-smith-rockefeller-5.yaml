- add:
    entry:
      id: cal.1968-01.cities-and-housing-ny
      when: Jan.
      date: 1968-01
      thread: cities-and-housing
      c: 'Rockefeller telephones Logue at Boston: "Can you come to New York?" The next day, at Fifty-fifth Street, over the
        draft bill for the Urban Development Corporation, Logue: "This is a great piece of legislation, but it won''t work";
        the city''s building permits and zoning would stop it. The bill redrawn to his terms, the power to override local
        zoning and codes among them.'
      n: '[[w.smith-on-his-own-terms]], 524 (Rockefeller later pays Logue''s political debt, $31,389, and lends him $145,000
        for a cooperative apartment). To check: [[w.persico-imperial-rockefeller]], 113; Gerald Benjamin and T. Norman Hurd,
        eds., *Rockefeller in Retrospect* (1984), 207–8 (cited by [[w.smith-on-his-own-terms]], 524). Check: the days. See
        [[cal.1968-04-09.cities-and-housing-ny]]. Names: Rockefeller, Logue.'
      tags:
      - name:rockefeller-nelson
      - name:logue-edward-j
      - state:ny
      src:
        c: '76670066'
        rows:
        - 'w.smith-on-his-own-terms 524: all'
