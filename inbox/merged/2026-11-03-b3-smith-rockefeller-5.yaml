- add:
    entry:
      id: cal.1968-02-08.jobs-and-wages-nyc
      when: Feb. 8
      date: '1968-02-08'
      thread: jobs-and-wages
      c: 'New York. At 8:45 in the morning Lindsay''s letter, a state of emergency and a formal request for the National Guard,
        at 20 West Fifty-fifth Street. Rockefeller calls both sides there: Van Arsdale, O''Dwyer and DeLury, let out of jail;
        Marshall and Sweet bargain for the two. Lindsay, leaving at five, agrees to a mediation panel to report by midnight;
        the city will reject a settlement of $450.'
      n: '[[w.smith-on-his-own-terms]], 507–8 (that week: a Teamster leader to Rockefeller, "I''ll shut this town down so
        tight even babies won''t get milk"; Rockefeller asks the White House whether Johnson would send troops in a general
        strike, and Johnson has none to spare). To check: Al Marshall, Robert Sweet, interviews by Richard Norton Smith; Ted
        Braun, interview by Hugh Morrow, 18–19, 21, Rockefeller Archive Center (cited by [[w.smith-on-his-own-terms]], 507–8).
        Check: the day of the call to the White House. See [[cal.1968-02-07.jobs-and-wages-nyc]]. Names: Lindsay, Rockefeller,
        O''Dwyer.'
      tags:
      - name:lindsay-john-v
      - name:rockefeller-nelson
      - name:odwyer-paul
      - state:ny
      - city:nyc
      src:
        c: d48000b0
        rows:
