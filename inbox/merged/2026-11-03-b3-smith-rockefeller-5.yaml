- add:
    entry:
      id: cal.1965-01-05.states-and-cities-ny
      when: Jan. 5
      date: '1965-01-05'
      thread: states-and-cities
      also:
      - state-and-city-finance
      c: 'Albany, N.Y. Rockefeller''s annual message, with the State''s first $3 billion budget: programs against pollution,
        discrimination, delinquency and drug abuse; workmen''s compensation and disability benefits raised; rent control extended;
        State aid to schools up; State inspection of every car; $90 million more for welfare; help for New York City.'
      n: '[[w.smith-on-his-own-terms]], 459 (and, 457, on the $120 million drawn from unspent bond issues: "It isn''t the
        end of a policy, it''s an exception to a policy"; the *World-Telegram*''s headline: "Rockefeller Wants More of Everything";
        460 n., Hurd''s account of a Democrat at the Executive Mansion after the message: "You aren''t throwing out pay as
        you go, we are"). To check: *New York Herald Tribune*, Jan. 7, 1965; *New York World-Telegram*, Jan. 7, 1965; T. Norman
        Hurd, interview by Hugh Morrow, 15, Rockefeller Archive Center (cited by [[w.smith-on-his-own-terms]], 457, 459, 460
        n.). Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
      - state:ny
      src:
        c: 7b230c6c
        rows:
        - 'w.smith-on-his-own-terms 459: all'
- add:
    entry:
