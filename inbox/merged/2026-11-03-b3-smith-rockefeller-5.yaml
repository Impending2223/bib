      when: Jan., late
      date: 1965-01
      thread: state-and-city-finance
      c: 'Rockefeller proposes the State''s first sales tax, 2 percent, and the cigarette tax and the fees for registering
        cars doubled, to balance his budget: "I feel worse about this than anything since I''ve been in office."'
      n: '[[w.smith-on-his-own-terms]], 460. To check: *New York Times*, Jan. 30, 1965 (cited by [[w.smith-on-his-own-terms]],
        460). Check: the day of the budget message. See [[cal.1965-01-05.states-and-cities-ny]]. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
      - state:ny
      src:
        c: 59e66b24
        rows:
        - 'w.smith-on-his-own-terms 460: all'
        - 'via x.1965-01-30.new-york-times-jan-30-1965: all'
