      n: '[[w.smith-on-his-own-terms]], 527–28 (a week before, the announcement that Hughes and Kissinger join his staff).
        To check: Joseph Persico, diary of the 1968 campaign, 1; Les Slote, interview by Richard Norton Smith (cited by [[w.smith-on-his-own-terms]],
        528). Check: the four speeches at this meeting or another. See [[cal.1968-03-21.elections-1968]]. Names: Rockefeller,
        Emmet Hughes.'
