      when: Feb. 9, evening
      date: '1968-02-09'
      thread: jobs-and-wages
      c: 'New York. Rockefeller on the air at 6 p.m., conciliatory toward the mayor. About 7:30 he telephones Lindsay to meet
        on neutral ground, the Roosevelt Hotel, Marshall and Sweet alone with them: "You mean that the Mayor of the City of
        New York won''t meet with the Governor in this crisis?" Lindsay sees "no solution," sends Sweet back to Fifty-fifth
        Street; Sweet and Marshall talk through the night.'
      n: '[[w.smith-on-his-own-terms]], 509–10 (by another in the room, Lindsay: "Fuck you"). To check: Harry Albright, chronology
        of the strike, 12–15; Roger Kahn, "On the Brink of Chaos," *Saturday Evening Post*, July 27, 1968; Joseph Canzeri,
        interview by Richard Norton Smith (cited by [[w.smith-on-his-own-terms]], 509–10). See [[cal.1968-02-09.jobs-and-wages-nyc]].
        Names: Rockefeller, Lindsay.'
      tags:
      - name:rockefeller-nelson
      - name:lindsay-john-v
      - state:ny
      - city:nyc
      src:
        c: b17e9c03
        rows:
