      when: Sept. 1
      date: '1961-09-01'
      place: washington
      thread: testing
      c: 'After Bundy''s call at three that a Soviet test seems to have taken place, two statements to Kennedy at the Mansion, in a bathrobe: McCloy and Dean for announcing resumption, Murrow and Schlesinger against. Kennedy is not inclined to announce resumption yet, not knowing how much longer he can refrain. Later, in the Oval Room: the Security Council question dropped, "It would look hypocritical." He leaves for Hyannis Port.'
