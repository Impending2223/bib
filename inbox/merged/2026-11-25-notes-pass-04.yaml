    item: '[[w.yang-shangkun-riji]], II, 48'
- add-words:
    id: cal.1961-07-06.china-leadership-2
    after: end
    words: 'Liu Shaoqi presides. Liu: a good document; the work is biased, with blind command, and the bias to be corrected.'
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 528'
- add-words:
    id: cal.1961-07-06.china-leadership-2
    after: end
    words: Nie Rongzhen and Zhang Jingfu report; Mao is absent. By Nie's account Liu, Zhou, Deng Xiaoping, Peng Zhen and Li Fuchun approve; Kang Sheng asks how Marxism-Leninism should lead science.
    item: '[[w.macfarquhar-origins-of-the-cultural]], III, 98–99'
- add-words:
    id: cal.1961-07-06.china-leadership-2
    after: end
    words: 'Deng: to be tried and amended into "a constitution for scientific work."'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1647'
