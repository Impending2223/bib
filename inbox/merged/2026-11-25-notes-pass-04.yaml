    words: 'In Wu Lengxi''s account the afternoon is at Mao''s residence by the lake, the Standing Committee on the CPSU''s draft Programme: Lu Dingyi, Wang Jiaxiang, Liu Ningyi, Zhang Hanfu, Peng Zhen, Yang Shangkun and Wu present; Deng Xiaoping, gone to Korea, not there. Mao: the draft is Old Mrs. Wang''s foot-binding cloth, long and foul. Lu: the "state" and the "party of the whole people" drop the dictatorship of the proletariat. Mao: two years'' struggle did not hold Khrushchev; prepare for a fight at the Twenty-second Congress.'
