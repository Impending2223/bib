    - name:zhu-de
- add-words:
    id: cal.1960-12-24.china-leadership
    after: end
    words: 'Chen Yun speaks on the way through the difficulties, from his three months'' inquiry. The conference also sets a billion yuan to raise the grain purchase price and raises the prices of oil-seed, pigs, poultry and eggs. Mao: socialist construction not to be rushed, half a century; 1961 a year of seeking truth from facts. The Center puts Chen Yun at the head of a small group on grain prices.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 60–61'
- add-words:
    id: cal.1960-12-24.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 86'
- add-words:
    id: cal.1960-12-24.china-leadership
    after: end
    words: Zhu De attends.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1790'
- names:
    id: cal.1960-12-24.china-leadership
    add:
    - Chen Yun
    - Peng Zhen
    - Zhu De
    tags:
    - name:chen-yun
    - name:peng-zhen
    - name:zhu-de
- add-words:
    id: cal.1960-12-26.china-leadership
    after: end
    words: 'Mao: he has not chaired the Politburo since 1953–54 and "practically never speaks" at the Central Committee''s plenums; Liu Shaoqi has run the Politburo''s routine since 1956. Yan Mingfu, Zhu Jueren, Sudarikov and Rakhmanin are also present; the greetings are from the CPSU Central Committee and Khrushchev. More than an hour.'
    item: '[[w.brothers-in-arms]], 365–369'
- names:
    id: cal.1960-12-26.china-leadership
    add:
    - Liu Shaoqi
    - Khrushchev
    - Yan Mingfu
    - Sudarikov
    tags:
    - name:liu-shaoqi
    - name:khrushchev-nikita-s
    - name:yan-mingfu
    - name:sudarikov
- add-words:
    id: cal.1961-01-09.china-leadership
    after: end
    words: 'Mao adds "no investigation, no right to speak." Liu Zihou reports on two Hebei counties; Mao: in the third-class counties the old cadres "false Communists, real Kuomintang."'
    item: '[[w.mao-zedong-zhuan]], V, ch. 67'
- add-words:
    id: cal.1961-01-09.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 90–91'
- names:
    id: cal.1961-01-09.china-leadership
    add:
    - Peng Zhen
    - Liu Zihou
    tags:
    - name:peng-zhen
    - name:liu-zihou
- add-words:
    id: cal.1961-01-09.transition-and-staff
    after: end
    words: Kennedy is at the house from about 2:20 to shortly after 5, about 300 people in the cold outside; after Schlesinger, 2:30 to 3:30, Surrey's tax task force, Chayes, Bundy, Stratton and Wiesner see him.
    item: '[[w.schlesinger-journals]], 102'
- add-words:
    id: cal.1961-01-09.transition-and-staff
    after: end
    words: The address is his "Farewell to Massachusetts," drafted by Sorensen.
    item: '[[w.sorensen-counselor]], 219'
- names:
    id: cal.1961-01-09.transition-and-staff
    add:
    - Surrey
    - Sorensen
    tags:
    - name:surrey-stanley-s
    - name:sorensen-theodore-c
- add-words:
    id: cal.1961-01-18.china-leadership
    after: end
    words: 'Liu Shaoqi and Chen Yun also speak: Liu on the Moscow conference, Chen Yun chiefly on planning and agriculture, the Moscow conference a success. Liu: Mikoyan and Kozlov came Nov. 26 to feel China out with the lure of restored aid.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 445–448'
- add-words:
    id: cal.1961-01-18.china-leadership
    after: end
    words: 'Mao: Khrushchev rushed to Bucharest, fearing the three articles; the 81-party meeting a great success; unity now, even with parties that cursed China.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 449–451'
- names:
    id: cal.1961-01-18.china-leadership
    add:
    - Liu Shaoqi
    - Chen Yun
    - Khrushchev
    - Mikoyan
    - Kozlov
    tags:
