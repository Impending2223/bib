    - name:lemnitzer-lyman-l
    - name:kennedy-robert-f
- add-words:
    id: cal.1961-04-22.china-leadership-2
    after: end
    words: 'The Laotian side: Souvanna Phouma and Souphanouvong. Zhou''s dinner on the 22nd; the talks the morning of the 23rd, Chen Yi at them.'
    item: '[[w.chen-yi-nianpu]], 868'
- add-words:
    id: cal.1961-04-22.china-leadership-2
    after: end
    words: The talks "in a cordial and friendly atmosphere."
    item: '[[w.guan-vietnamese-communists-relations-with]], 190'
- add-words:
    id: cal.1961-04-22.china-leadership-2
    after: end
    words: Common views reached.
    item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 192–193'
- names:
    id: cal.1961-04-22.china-leadership-2
    add:
    - Souphanouvong
    - Chen Yi
    tags:
    - name:souphanouvong
    - name:chen-yi
- add-words:
    id: cal.1961-04-26.china-leadership-2
    after: end
    words: Deng Xiaoping sends it, on Mao's wish, to the bureaus and committees, with four enclosures, subtitled as Hu's material on the mess halls.
    item: '[[w.mao-zedong-zhuan]], V, ch. 68'
- add-words:
    id: cal.1961-04-26.china-leadership-2
    after: end
    words: The document is Zhongfa [61] 323, titled "several important documents the Chairman commented on."
    item: '[[w.yang-jisheng-mubei]], II, 1173'
- add-words:
    id: cal.1961-04-26.china-leadership-2
    after: end
    words: 'Hu''s letter of Apr. 14: in three brigades of the former Dongjiao commune at Xiangxiang, 707 dead from October 1958 to March 1961, 13.5 percent of their people, by report; in two brigades nearby, about 20 percent over three years; in the county about 30,000 in three years.'
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 301–302'
- names:
    id: cal.1961-04-26.china-leadership-2
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1961-04-28.opinion
    after: end
    words: 'May 3, late afternoon: Evelyn Lincoln brings Kennedy an advance of the poll.'
    item: '[[w.schlesinger-journals]], 120–21'
- names:
    id: cal.1961-04-28.opinion
    add:
    - Lincoln
    tags:
    - name:lincoln-evelyn
- add-words:
    id: cal.1961-05-25.space
    after: end
    words: 'Defense: $100 million for the ROAD divisions, $138 million for Army and Marine equipment, the Marines raised from 178,000 to 190,000.'
    item: '[[w.poole-joint-chiefs-of-staff]], 65'
- add-words:
    id: cal.1961-05-25.space
    after: end
    words: Kennedy departs from his text to add a note of urgency, and inserts "this decade" himself.
    item: '[[w.sorensen-counselor]], 336–37'
- names:
    id: cal.1961-05-25.space
    add:
    - Sorensen
    tags:
    - name:sorensen-theodore-c
- add-words:
    id: cal.1961-06-03.berlin-and-vienna
    after: end
    words: 'Khrushchev: the treaty "in December of this year." Kennedy: "Then it will be a cold winter."'
    item: '[[w.prezidium-tsk-kpss-1954]], III, 214'
- add-words:
    id: cal.1961-06-03.berlin-and-vienna
    after: end
    words: On the test ban Khrushchev allows three inspections a year and a veto on enforcement.
    item: '[[w.fursenko-khrushchevs-cold-war]], 362'
- add-words:
    id: cal.1961-06-03.berlin-and-vienna
    after: end
    words: 'On China, Khrushchev presses its U.N. seat and Taiwan; Kennedy: the Soviets may get to know the Chinese "even better."'
    item: '[[w.chang-friends-and-enemies]], 231–32'
- add-words:
    id: cal.1961-06-03.berlin-and-vienna
    after: end
    words: On Laos both to press their clients to work with the Commission; Khrushchev to do his utmost for a truly neutral government.
    item: '[[w.guan-vietnamese-communists-relations-with]], 194'
- add-words:
    id: cal.1961-06-10.china-leadership-3
    after: end
    words: 'Deng presides, on the anniversary and university entrance. To Lu Dingyi on making intellectuals'' world-view a political question, Deng: the "left" again, some members capping others for their own ends; enough that they support the Party''s leadership.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1645'
- add-words:
    id: cal.1961-06-10.china-leadership-3
    after: end
    words: Peng Zhen attends, the 258th meeting; Liu Shaoqi's speech for the anniversary and college admissions are on the agenda.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 133'
- names:
    id: cal.1961-06-10.china-leadership-3
    add:
    - Deng Xiaoping
    - Lu Dingyi
    - Peng Zhen
    - Liu Shaoqi
    tags:
    - name:deng-xiaoping
    - name:lu-dingyi
    - name:peng-zhen
    - name:liu-shaoqi
- add-words:
    id: cal.1961-06-12.china-leadership
    after: end
    words: 'The plenary, 11 a.m. to 2 p.m. Mao: sum up eleven years of building, which may take another eleven.'
    item: '[[w.yang-shangkun-riji]], II, 41'
- add-words:
    id: cal.1961-06-12.china-leadership
    after: end
    words: 'Mao: read Stalin''s *Economic Problems of Socialism in the USSR* again.'
    item: '[[w.mao-zedong-zhuan]], V, ch. 68'
- add-words:
    id: cal.1961-06-12.china-leadership
    after: end
    words: When Li Fuchun says the plan must first meet farming and the market, Mao says Chen Yun held before that the market comes first, many opposed it and he kept silent; now back on that track.
    item: '[[w.chen-yun-nianpu-xiuding]], III, 93'
- add-words:
    id: cal.1961-06-12.china-leadership
    after: end
    words: After Mao, Li Fuchun, Zhou Enlai and Li Xiannian speak.
    item: '[[w.yang-shangkun-riji]], II, 41'
- add-words:
    id: cal.1961-06-12.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 133'
