- add-words:
    id: cal.1961-07-20.china-leadership-3
    after: end
    words: 'Peng Zhen, with Yang Shangkun, hears Qian Ying: reviews for cadres who erred in work, not for degenerates; production the center of work in the villages. Peng: the "left" and "right" labels on cadres not off production removed and no more pinned. He also hears Li Weihan, Xu Bing and Ping Jiesan: the national bourgeoisie mostly reformable, by Mao''s word; posts kept or raised, the wrongly treated restored, unpaid fixed interest paid.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 141–142'
