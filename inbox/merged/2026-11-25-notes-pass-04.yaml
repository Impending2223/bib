    - name:chen-yun
    - name:khrushchev-nikita-s
    - name:mikoyan-anastas
    - name:kozlov-frol-r
- add-words:
    id: cal.1961-03-15.china-leadership-2
    after: end
    words: Liu Shaoqi presides on the 20th, 22nd and 23rd.
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 508'
- add-words:
    id: cal.1961-03-15.china-leadership-2
    after: end
    words: 'Deng Xiaoping, in speeches of the 19th and 23rd, makes a self-criticism for the Secretariat: investigation a basic, permanent method.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1623'
- add-words:
    id: cal.1961-03-15.china-leadership-2
    after: end
    words: 'The conference in effect began Mar. 10: the Three South conference at Canton under Mao, the Three North at Peking under Liu, Zhou Enlai, Chen Yun and Deng, the Three North going to Canton Mar. 14.'
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1800 n.1'
- add-words:
    id: cal.1961-03-15.china-leadership-2
    after: end
    words: Zhu De attends.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1800'
- add-words:
    id: cal.1961-03-15.china-leadership-2
    after: end
    words: Zhou speaks on the 19th in the Central-South and North China group and on the 20th on grain and foreign trade; on the 22nd he revises the Center's letter on the draft.
    item: '[[w.zhou-enlai-nianpu-1949]], II, 398–99'
- add-words:
    id: cal.1961-03-15.china-leadership-2
