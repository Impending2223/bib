    words: 'The meeting begins Thursday morning shortly after 10, the leaders due at 10:45. Present: Johnson, Rusk, McNamara, Seaborg, Dulles, Lemnitzer, Taylor, Bohlen, Murrow, Fisher, Bundy, Scoville and Schlesinger. Rusk proposes a statement announcing the decision to resume; Kennedy, back from a call from Stevenson, turns it into preparations ordered. Johnson: let Khrushchev take the heat for a few days. Murrow is against a statement.'
