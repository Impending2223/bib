- add-words:
    id: cal.1961-06-17.china-leadership-2
    after: end
    words: 'The morning, Deng presiding, Zhou attending: working regulations for industrial enterprises to be drafted. Deng: industry far more complex than farming, "no bottom in our hearts"; regulations only with investigation.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1645'
- add-words:
    id: cal.1961-06-17.china-leadership-2
    after: end
    words: 'Peng Zhen, at the 259th meeting: these years advance and retreat without an overall plan; heavy industry''s retreat to be planned, not rash.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 134'
- names:
