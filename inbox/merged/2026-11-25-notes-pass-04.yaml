    after: end
    words: 'June 12: Liu Shaoqi, with Soong Ching-ling, Dong Biwu, Zhu De and Zhou Enlai, meets the delegation. Liu: shortcomings and errors, joined to two years of calamity, have added to the losses; cadres must know the laws of socialist economic development.'
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 526'
- add-words:
    id: cal.1961-06-12.china-leadership-3
    after: end
    words: Talks with Zhou, Li Fuchun, Luo Ruiqing, Luo Guibo, Fang Yi and He Wei. The communiqué of the 15th records "complete identity of views"; the South's struggle against American aggression and Diệm a sacred right.
    item: '[[w.guan-vietnamese-communists-relations-with]], 196–197'
- add-words:
    id: cal.1961-06-12.china-leadership-3
    after: end
    words: Peng Zhen, with Zhou, Dong Biwu and Li Fuchun, meets Phạm Văn Đồng at the airport, and attends Zhou's banquet that evening.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 133'
- names:
    id: cal.1961-06-12.china-leadership-3
