    item: '[[w.macfarquhar-origins-of-the-cultural]], III, 48'
- add-words:
    id: cal.1961-04-19.cuba
    after: end
    words: 'The Chiefs'' order to Dennison goes at 0337: pilots to carry as little identification as possible.'
    item: '[[w.poole-joint-chiefs-of-staff]], 115'
- add-words:
    id: cal.1961-04-19.cuba
    after: end
    words: 'At the meeting Lemnitzer: the invaders to "go guerrilla"; Burke, prodded by Robert Kennedy, proposes an hour of air cover.'
    item: '[[w.thomas-robert-kennedy]], 121'
- check:
    id: cal.1961-04-19.cuba
    text: 'Check: Poole has Lemnitzer''s "go guerrilla" to Kennedy on the morning of the 19th ([[w.poole-joint-chiefs-of-staff]], 116), Thomas at the meeting after midnight (121).'
- names:
    id: cal.1961-04-19.cuba
    add:
    - Dennison
    - Lemnitzer
    - Robert Kennedy
    tags:
