    text: 'Check: who presides on the 20th: Zhou''s chronology has Zhou ([[w.zhou-enlai-nianpu-1949]], II, 399), Liu''s has Liu ([[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 508).'
