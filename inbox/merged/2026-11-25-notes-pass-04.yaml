- add-words:
    id: cal.1960-12-19.china-leadership-3
    after: end
    words: Chen Yi and First Deputy Premier Nhiek Tioulong sign a protocol on economic and technical aid, a supplementary protocol to the aid agreement of June 21, 1956, a shipping agreement and notes on Chinese railway and farm experts.
    item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 177'
- cite:
    id: cal.1960-12-19.china-leadership-3
    item: '[[w.chen-yi-nianpu]], 848–849'
    'on': Chen Yi and First Deputy Premier … railway and farm experts.
- add-words:
    id: cal.1960-12-19.china-leadership-3
    after: end
    words: Zhu De attends the signing of the statement and the treaty.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1789'
- names:
    id: cal.1960-12-19.china-leadership-3
    add:
    - Chen Yi
    - Nhiek Tioulong
    - Zhu De
    tags:
    - name:chen-yi
