- add:
    entry:
      id: cal.1967-03.welfare
      when: Mar.–June
      date: 1967-03
      thread: welfare
      c: 'The Budget Bureau, the Council and the Treasury, worried about the economy, would have Mills and Long split the
        old-age benefits from the social security bill, 12 or 13 percent instead of 20, retroactive to Jan. 1, as a stimulus.
        Cohen: perhaps 15, or Meany will say the administration "sold out." The proposal dies.'
      n: '[[w.bernstein-guns-or-butter]], 433 ("in the first half of 1967"). Check: the days. See [[cal.1967-03-28.welfare]].
        Names: Mills, Long, Cohen, Meany.'
      tags:
      - name:mills-wilbur-d
      - name:long-russell-b
      - name:cohen-wilbur-j
      - name:meany-george
      src:
        c: ae2c0d84
        rows:
        - 'w.bernstein-guns-or-butter 433: all'
- add:
