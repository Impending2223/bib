- add:
    entry:
      id: cal.1968-03-22.economy-surcharge-3
      when: Mar. 22
      date: '1968-03-22'
      thread: economy-surcharge
      c: 'Fowler to Johnson, after four days on the Hill with Martin, and Zwick at times: with Smathers a plan of a 10 percent
        surcharge and a $5 billion cut; Dirksen "said he would try ... but gave me no commitment that he could deliver";
        Mills''s trouble, spending being Mahon''s; a 10–5 or 10–6 package might "break this logjam and put us well down
        the road, but far, far from home."'
      n: '[[w.bernstein-guns-or-butter]], 373–74. To check: Fowler to Johnson, Mar. 22, 1968, Confidential File, LBJ Library
        (cited by [[w.bernstein-guns-or-butter]], 373 n.7). See [[cal.1968-03-12.economy-surcharge]]. Names: Fowler, Johnson,
        Martin, Zwick, Smathers, Dirksen, Mills, Mahon.'
