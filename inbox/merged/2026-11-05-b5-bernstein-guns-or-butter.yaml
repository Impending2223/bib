      c: 'Santiago. Frei to Harriman, Dungan and Solomon, in the evening: the rollback "the most difficult problem conceivable"
        for his government, but not in his hands to refuse Johnson; he asks "another formula." Washington takes his second
        course, a bilateral arrangement, and announces the stockpile release that evening.'
      n: '[FRUS 1964–68, XXXI, doc. 287](https://history.state.gov/historicaldocuments/frus1964-68v31/d287) (Harriman to
        Johnson); [FRUS 1964–68, XXXI, doc. 288](https://history.state.gov/historicaldocuments/frus1964-68v31/d288) (State
        to Harriman, 8:47 p.m.). [[w.bernstein-guns-or-butter]], 362 (Anaconda surrenders). See [[cal.1965-11-15.latin-america]].
        Names: Frei, Harriman, Dungan, Johnson.'
