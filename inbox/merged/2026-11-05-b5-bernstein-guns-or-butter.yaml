- add:
    entry:
      id: cal.1968-03-14.program
      when: Mar. 14
      date: '1968-03-14'
      thread: program
      c: 'Ripley to McPherson on the Hirshhorn: the subcommittees "very nervous about defending this on the floor," a 66
        percent rise in the Smithsonian''s budget in an "appallingly austere year"; ask only $2 million for fiscal 1969,
        the installment plan. The Budget Bureau and Congress agree.'
      n: '[[w.bernstein-guns-or-butter]], 450. To check: Ripley to McPherson, Mar. 14, 1968, McPherson Papers, LBJ Library
        (cited by [[w.bernstein-guns-or-butter]], 450 n.4). Check: the day; dated by the note. See [[cal.1966-11-07.program]].
        Names: McPherson.'
      tags:
      - name:mcpherson-harry
      src:
        c: da8b6796
        rows:
        - 'w.bernstein-guns-or-butter 450: all'
        - 'via x.1968-03-14.ripley-to-mcpherson-mcpherson-papers: all'
