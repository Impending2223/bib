- add:
    entry:
      id: cal.1966-02.jobs-and-wages-3
      when: Feb.
      date: 1966-02
      thread: jobs-and-wages
      also:
      - labor
      c: 'The AFL-CIO refuses the Ackley–Connor formula for the minimum wage: Meany and Biemiller might have taken it, but
        Dubinsky of the Ladies'' Garment Workers and Potofsky of the Amalgamated Clothing Workers hold out for $1.60 in
        1967, to raise Southern pay; the administration will not go along.'
      n: '[[w.bernstein-guns-or-butter]], 430. Check: the day. See [[cal.1966-02-12.jobs-and-wages-2]]. Names: Ackley, Connor,
        Meany, Biemiller.'
      tags:
