      id: cal.1967-08.welfare
      when: Aug., early
      date: 1967-08
      thread: welfare
      c: 'Gardner against Ways and Means''s welfare amendments: children required "to pay for the real or supposed sins
        of their parents"; mothers forced into job training, their children into day care.'
      n: '[[w.bernstein-guns-or-butter]], 434. Check: the day; between the report of Aug. 7 and the rule of Aug. 16. See
        [[cal.1967-08-07.welfare]]. Names: Gardner.'
      tags:
      - name:gardner-john-w
