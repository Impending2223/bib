      thread: civil-rights-bill
      c: 'At Kennedy''s request Burke Marshall talks to Johnson on the bill being drafted. Johnson: jobs for Negroes the
        most important thing the government could do, but fair employment must stay out of the bill or kill it; "very dubious"
        it can pass, by Marshall''s account. Katzenbach: Johnson thought an employment title "absolutely politically impossible."'
