      c: 'Santiago. Harriman, Dungan and Solomon with Frei at his residence, 3 p.m.: Johnson asks Chile to bring copper
        back to 36 cents; the United States ready to compensate the short-term loss. Frei: "My disposition is to help ...
        But the problem is not easy."'
