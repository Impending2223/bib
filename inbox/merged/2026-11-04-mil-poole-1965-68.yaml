  - add:
      entry:
        id: cal.1968-01-28.japan-and-korea-pueblo
        when: Jan. 28–Feb. 6
        date: '1968-01-28'
        thread: japan-and-korea-pueblo
        c: 'After the *Pueblo*: 182 aircraft to South Korea Jan. 28–Feb. 2, 72 F-4s, 14 RF-4s, 34 F-104s, 38 F-102s, 18 F-100s, 6 EB-66s; the carriers *Yorktown* and *Ranger* into the Sea of Japan; Feb. 3–6, 26 B-52s to Guam and Okinawa; then 18 F-106s to Korea.'
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 241. McConnell, Jan. 29: still only 427 tactical aircraft in South Korea against 530 in the North (241). See [[cal.1968-01-23.japan-and-korea]].'
        src:
          c: b7315483
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 241: all'
