patch: 2026-11-04-mil-poole-1965-68
by: Claude (the military re-read, group jcs, Nov. 5, 2026), from Poole, JCS and National Policy, 1965–1968
ops:
  - add:
      entry:
        id: cal.1965-04-25.latin-america-dominican-republic
        when: Apr. 25–26
        date: '1965-04-25'
        thread: latin-america-dominican-republic
        c: 'At 9:30 a.m. Apr. 25 the Joint Chiefs order CINCLANT to "take appropriate action": six ships of Task Group 44.9 with the 6th Marine Expeditionary Unit, room for 3,600 evacuees, off the coast. Apr. 26, the civil war full-scale, the Constitutionalists let American helicopters land at the Embajador Hotel; that evening two battalions of the 82nd Airborne alerted at Fort Bragg, N.C., with airlift and air support.'
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 138. CINCLANT''s contingency plan, OPLAN 373-64: a show of force up to intervention by three battalions (138). See [[cal.1965-04-24.latin-america]].'
        src:
          c: dee4302a
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 138: all'
      section: '196504'
  - cite:
      id: cal.1965-04-28.latin-america
      item: '[[w.poole-joint-chiefs-of-staff-2012]], 139 (Bennett''s cable urging Marines ashore at once; that evening the Joint Chiefs'' order, on Johnson''s decision)'
      units: C-D
  - add:
      entry:
        id: cal.1965-04-29.latin-america-dominican-republic-2
        when: Apr. 29–30
        date: '1965-04-29'
        thread: latin-america-dominican-republic
        c: 'Midafternoon, on Johnson''s decisions, the Joint Chiefs order the rest of the 6th MEU ashore and two airborne battalions from Fort Bragg to Ramey Air Force Base, Puerto Rico, to drop on San Isidro airfield in the morning; with the C-130s already in the air, they are sent straight to San Isidro, to land in the night. 1:08 a.m. Apr. 30, Masterson''s concept: the paratroopers to hold San Isidro and the Ozama bridges, the Marines a line east of the embassy.'
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 140. See [[cal.1965-04-28.latin-america]].'
        src:
          c: 1113d55f
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 140: all'
      section: '196504'
  - add:
      entry:
        id: cal.1965-05-01.latin-america-dominican-republic
        when: May 1–2
        date: '1965-05-01'
        thread: latin-america-dominican-republic
        c: 'Palmer asks four more airborne battalions and a third of Marines. 6:40 p.m., Wheeler asks for three plans to confine the rebels to the south and east of the city; Masterson, 2:14 a.m. May 2: Plan A, 18 battalions and seven days, Plan B 15 and 24 hours, Plan C 12 over three to five days. 1:03 p.m. May 2 the Chiefs choose B, a corridor at dawn May 3, and approve another Marine battalion and the five uncommitted battalions of the 82nd.'
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 141–42. See [[cal.1965-04-29.latin-america-dominican-republic-2]]. Names: Palmer, Wheeler.'
        src:
          c: bb1e8c0c
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 141–42: all'
        tags: [name:palmer-bruce-jr, name:wheeler-earle]
      section: '196505'
  - add:
      entry:
        id: cal.1965-05-03.latin-america-dominican-republic
        when: May 3
        date: '1965-05-03'
        thread: latin-america-dominican-republic
        c: Shortly after midnight May 2–3 three airborne battalions close the cordon through Santo Domingo, without loss, in little over an hour, confining 80 percent of the rebel forces to the city's southeastern corner. With the new units in, May 3–4, twelve maneuver battalions and about 21,000 men ashore.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 142. May 6 the Joint Chiefs add F-104s to the F-100s at Ramey, against Cuba''s MiGs (142). See [[cal.1965-05-01.latin-america-dominican-republic]].'
        src:
          c: 625498e2
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 142: all'
      section: '196505'
  - add:
      entry:
        id: cal.1965-05-14.latin-america-dominican-republic
        when: May 14
        date: '1965-05-14'
        thread: latin-america-dominican-republic
        c: The Constitutionalists attack Imbert's GNR troops in northwestern Santo Domingo, unsuccessfully. Johnson orders Palmer to neutralize the Loyalist navy and air force and keep the Loyalists from attacking the rebel zone. American strength peaks May 17 at 23,889.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 144. See [[cal.1965-05-03.latin-america-dominican-republic]]. Names: Johnson, Palmer, Imbert.'
        src:
          c: 07d3e45b
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 144: all'
        tags: [name:johnson-lyndon-b, name:palmer-bruce-jr, name:imbert-barrera-antonio]
      section: '196505'
  - add:
      entry:
        id: cal.1965-05-19.latin-america-dominican-republic
        when: May 19
        date: '1965-05-19'
        thread: latin-america-dominican-republic
        c: Loyalist troops break the intended line of interposition, drive into the rebels' northern sector and take Radio Santo Domingo. An informal cease-fire follows.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 145. See [[cal.1965-05-14.latin-america-dominican-republic]].'
        src:
          c: 451a0c8c
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 145: all'
      section: '196505'
  - add:
      entry:
        id: cal.1965-05-27.latin-america-dominican-republic
        when: May 27–June 6
        date: '1965-05-27'
        thread: latin-america-dominican-republic
        c: The Joint Chiefs endorse Palmer's three-phase withdrawal May 27 and authorize 1,700 Army and Air Force men out May 28; Phase I done May 30. Phase II, 4,100 Marines, done June 6, leaving 12,832 Americans.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 147. See [[cal.1965-05-03.latin-america-dominican-republic]]. Names: Palmer.'
        src:
          c: 3852d40c
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 147: all'
        tags: [name:palmer-bruce-jr]
      section: '196505'
  - add:
      entry:
        id: cal.1965-07-11.latin-america-dominican-republic
        when: July 11
        date: '1965-07-11'
        thread: latin-america-dominican-republic
        c: The first of the two airborne battalions agreed by Palmer and Alvim returns to Fort Bragg; the second eight days later. The American contingent down to about 10,250, the Latin American about 1,750.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 147. See [[cal.1965-05-27.latin-america-dominican-republic]]. Names: Palmer.'
        src:
          c: 2e05559e
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 147: all'
        tags: [name:palmer-bruce-jr]
      section: '196507'
  - add:
      entry:
        id: cal.1967-05-23.middle-east-six-day-war-2
        when: May 23
        date: '1967-05-23'
        thread: middle-east-six-day-war
        c: A Joint Chiefs message drafted by the Joint Reconnaissance Center sends the intelligence ship *Liberty* from the Ivory Coast to the eastern Mediterranean. June 1, orders that from June 9 she keep 6.5 nautical miles off Israel and 12.5 off Egypt.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 175.'
        src:
          c: 5baeb6ca
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 175: all'
      section: '196705'
  - add:
      entry:
        id: cal.1967-05-31.middle-east-six-day-war
        when: May 31
        date: '1967-05-31'
        thread: middle-east-six-day-war
        c: The carrier *Intrepid*, bound for Southeast Asia and held in the eastern Mediterranean since May 20, passes through the Suez Canal without incident, on McNamara's and Rusk's recommendation and Johnson's approval.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 172. Names: McNamara, Rusk, Johnson.'
        src:
          c: b10eaa7c
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 172: all'
        tags: [name:mcnamara-robert-s, name:rusk-dean, name:johnson-lyndon-b]
      section: '196705'
  - add:
      entry:
        id: cal.1967-06-07.middle-east-six-day-war-3
        when: June 7
        date: '1967-06-07'
        thread: middle-east-six-day-war
        c: McDonald worried for the *Liberty*, the Joint Reconnaissance Center sends USCINCEUR, 6:30 p.m. Washington time, an order keeping her 15 miles from Israel and 20 from Egypt. Misrouted by the Army Communications Center to a naval station, it reaches USCINCEUR at 4:11 a.m. June 8, the Sixth Fleet at 6:55; the ship never has it.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 175. See [[cal.1967-05-23.middle-east-six-day-war-2]]. Names: McDonald.'
        src:
          c: ece1f08c
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 175: all'
        tags: [name:mcdonald-david-l]
      section: '196706'
  - cite:
      id: cal.1967-06-08.middle-east
      item: '[[w.poole-joint-chiefs-of-staff-2012]], 175–76 (her identification erased from the Israeli naval plot at 11 a.m.; strafing about 2 p.m., the torpedo boats about half an hour later; at 2:50 p.m. the Sixth Fleet orders aircraft from the *Saratoga* and *America*)'
      units: A, C
  - add:
      entry:
        id: cal.1964-10-15.congo
        when: Oct. 15
        date: '1964-10-15'
        thread: congo
        c: Washington suspends the American-supported air operations in the Congo, the rebels threatening to kill a hostage for every Congolese killed from the air; the United States had lent Tshombe seven B-26s. Resumed eight days later, without flights within 25 miles of Stanleyville or strikes near the towns.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 201. Names: Tshombe.'
        src:
          c: 4f519463
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 201: all'
        tags: [name:tshombe-moise]
      section: '196410'
  - add:
      entry:
        id: cal.1964-11-14.congo
        when: Nov. 14
        date: '1964-11-14'
        thread: congo
        c: Lemnitzer, USCINCEUR, promulgates Dragon Rouge. From Nov. 17 American C-130s move a Belgian paratroop battalion to Ascension Island.
        n: '[[w.poole-joint-chiefs-of-staff-2012]], 202. Names: Lemnitzer.'
        src:
          c: 1c54ccb7
          rows:
            - 'w.poole-joint-chiefs-of-staff-2012 202: all'
        tags: [name:lemnitzer-lyman-l]
      section: '196411'
  - cite:
      id: cal.1964-11-24.congo
      item: '[[w.poole-joint-chiefs-of-staff-2012]], 202 (twelve C-130s over Stanleyville airfield at 6 a.m.; some 300 held at the Victoria Hotel, 17 Americans among them)'
      units: A-C
