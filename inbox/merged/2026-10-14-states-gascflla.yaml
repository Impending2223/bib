      when: Nov. 6
      date: '1962-11-06'
      thread: south-carolina
      also:
      - elections-1962
      c: 'South Carolina, Senate: Johnston (D) over Workman (R), a correspondent of the Charleston *News and Courier*, 57.2 percent. Russell elected governor without opposition.'
      n: '[Clerk, *Statistics of the Presidential and Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf). [[w.kalk-origins-of-the-southern]]; [[w.black-rise-of-southern-republicans]]. See [[cal.1962-06-12.south-carolina-sc]]; [[cal.1962-11-06.governors]]. Names: Russell (K–J Cong. III.F); Workman (K–J Cong. III.K).'
      tags:
      - name:johnston-olin-d
      - name:workman-william-d-jr
      - name:russell-donald-s
