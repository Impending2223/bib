      n: '*Bush v. Orleans Parish School Board*, [188 F. Supp. 916](https://static.case.law/f-supp/188/html/0916-01.html) (E.D. La. 1960), App. A–B. [[w.inger-politics-and-reality-in]]; [[w.baker-second-battle-of-new]]; [[w.fairclough-race-and-democracy]]. See [[cal.1960-08-27.desegregation-schools-la]]. Names: Davis (K–J Cong. III.F).'
