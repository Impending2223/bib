      c: 'New Orleans. A three-judge court, Wright among its members, voids Louisiana''s school laws: Act 496 of 1960, separate schools, the legislature alone to classify them, the governor to take over a board under a desegregation order; Act 542 of 1960, the governor to close a school threatened by disorder; Act 319 of 1956; and a State court''s injunction of July 29 against the Orleans Parish board. Temporary injunction, Aug. 29. Wright''s plan of May 16 stands: desegregation from the first grade.'
      n: '*Bush v. Orleans Parish School Board*, [187 F. Supp. 42](https://static.case.law/f-supp/187/html/0042-01.html) (E.D. La. 1960). [[w.baker-second-battle-of-new]]; [[w.inger-politics-and-reality-in]]; [[w.crain-politics-of-school-desegregation]]; [[w.fairclough-race-and-democracy]]; [[w.bass-unlikely-heroes]]. Names: Wright (K–J Cong. III.G).'
