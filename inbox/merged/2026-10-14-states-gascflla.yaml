- add:
    entry:
      id: cal.1960-02-17.georgia-ga
      when: Feb. 17
      date: '1960-02-17'
      thread: georgia
      also:
      - desegregation-schools
      c: 'The General Assembly Committee on Schools, created by the legislature this month, holds its first meeting at the Capitol: nineteen members, John A. Sibley, an Atlanta businessman, chairman. The choice it puts: the State''s laws, which cut off funds to a desegregated school and close it, or local option. Ten hearings in March, one in each congressional district; some 1,800 witnesses, most for the laws.'
      n: '*Atlanta Constitution*, Feb. 18, 1960 ([archive.org](https://archive.org/details/per_atlanta-constitution_1960-02-18_92_208)). Check: the resolution, Ga. Laws 1960. [[w.roche-restructured-resistance]]; [[w.obrien-politics-of-race-and]]; [[w.bartley-creation-of-modern-georgia]]; [[w.kruse-white-flight]]. Names: Sibley (K–J Cong. III.K).'
      tags:
      - name:sibley-john-a
      - state:ga
- add:
    entry:
      id: cal.1960-04-28.georgia-ga
      when: Apr. 28
      date: '1960-04-28'
      thread: georgia
      also:
      - desegregation-schools
      c: 'Sibley presents the committee''s reports to the General Assembly. The majority, eleven: two constitutional amendments, no child forced into a desegregated school and a tuition grant to leave one, and a vote in each school district whether to close its schools or keep them open; pupil placement by local boards. The minority: tuition grants only as a last resort, segregated schools kept as far as possible. Vandiver calls no special session.'
      n: '*Atlanta Constitution*, Apr. 29, 1960 ([archive.org](https://archive.org/details/per_atlanta-constitution_1960-04-29_92_269)), the reports'' texts at pp. 12–13. See [[cal.1960-02-17.georgia-ga]]. Names: Vandiver (K–J Cong. III.F); Sibley (K–J Cong. III.K).'
      tags:
      - name:sibley-john-a
      - name:vandiver-s-ernest-jr
      - state:ga
- add:
    entry:
      id: cal.1961-01-18.georgia-ga
      when: Jan. 18–31
      date: '1961-01-18'
      thread: georgia
      also:
      - desegregation-schools
      c: 'Vandiver to the General Assembly in joint session, at night, the week after the riot at Athens: repeal of the laws that would close a desegregated school, the Sibley majority''s course. Jan. 31, he signs the "open schools" package, three bills and a constitutional amendment: "We are not law defiers."'
      n: '*Atlanta Constitution*, Jan. 19 and Feb. 1, 1961 ([archive.org](https://archive.org/details/per_atlanta-constitution_1961-01-19_93_182); [archive.org](https://archive.org/details/per_atlanta-constitution_1961-02-01_93_193)). Check: the acts, Ga. Laws 1961. [[w.roche-restructured-resistance]]; [[w.pratt-we-shall-not-be]]; [[w.trillin-education-in-georgia]]; [[w.bartley-creation-of-modern-georgia]]. See [[cal.1960-04-28.georgia-ga]]; [[cal.1961-01-06.desegregation-schools]]. Names: Vandiver (K–J Cong. III.F); Sibley (K–J Cong. III.K).'
      tags:
      - name:vandiver-s-ernest-jr
      - name:sibley-john-a
      - state:ga
- add:
    entry:
      id: cal.1961-09-13.georgia-atlanta
      when: Sept. 13
      date: '1961-09-13'
      thread: georgia
      also:
      - mayors
      - elections-1961
      c: Atlanta's primary for mayor, Hartsfield retiring. Allen, lately president of the Chamber of Commerce, 37,398; Maddox, a restaurant owner and segregationist, 21,091; three others 41,355. Runoff between Allen and Maddox.
      n: '*Atlanta Constitution*, Sept. 14, 1961 ([archive.org](https://archive.org/details/per_atlanta-constitution_1961-09-14_94_76)). [[w.allen-mayor]]; [[w.kruse-white-flight]]; [[w.stone-regime-politics]]; [[w.short-everything-is-pickrick]]. Names: Allen, Maddox, Hartsfield (K–J Cong. III.F).'
      tags:
      - name:allen-ivan-jr
      - name:maddox-lester
      - name:hartsfield-william-b
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1961-09-22.georgia-atlanta
      when: Sept. 22
      date: '1961-09-22'
      thread: georgia
      also:
      - mayors
      - elections-1961
      c: 'Atlanta''s runoff for mayor: Allen 64,313, Maddox 36,091; Allen 64.1 percent.'
      n: '*Atlanta Constitution*, Sept. 23, 1961 ([archive.org](https://archive.org/details/per_atlanta-constitution_1961-09-23_94_84)). See [[cal.1961-09-13.georgia-atlanta]]. Names: Allen, Maddox (K–J Cong. III.F).'
      tags:
      - name:allen-ivan-jr
      - name:maddox-lester
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1962-04-28.georgia-ga
      when: Apr. 28
      date: '1962-04-28'
      thread: georgia
      also:
      - court
      - elections-1962
      c: '*Sanders v. Gray*, Atlanta. A three-judge court, Tuttle sitting, enjoins the county unit system in any primary where its allotment of units falls short of the court''s standard: Fulton County, 14.1 percent of the people, has 1.46 percent of the 410 units. The General Assembly had amended the system days before; the new system "misses the mark."'
      n: '*Sanders v. Gray*, [203 F. Supp. 158](https://static.case.law/f-supp/203/html/0158-01.html) (N.D. Ga. 1962). [[w.bartley-from-thurmond-to-wallace]]; [[w.smith-on-democracys-doorstep-2014]]; [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1962-03-26.court]]. Names: Tuttle (K–J Cong. III.G).'
      tags:
      - name:tuttle-elbert-p
      - state:ga
- add:
    entry:
      id: cal.1962-05-25.georgia-ga
      when: May 25
      date: '1962-05-25'
      thread: georgia
      also:
      - legislatures
      - court
      c: '*Toombs v. Fortson*, Atlanta. A three-judge court, Tuttle writing, declares the General Assembly malapportioned, both houses by counties, not people. No injunction for now: the State to reconstitute the legislature before the January 1963 session, the court keeping the case.'
      n: '*Toombs v. Fortson*, [205 F. Supp. 248](https://static.case.law/f-supp/205/html/0248-01.html) (N.D. Ga. 1962). [[w.bartley-creation-of-modern-georgia]]; [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1962-04-28.georgia-ga]]. Names: Tuttle (K–J Cong. III.G).'
      tags:
      - name:tuttle-elbert-p
      - state:ga
- add:
    entry:
      id: cal.1962-09-12.georgia-ga
      when: Sept. 12
      date: '1962-09-12'
      thread: georgia
      also:
      - governors
      - elections-1962
      c: 'Georgia''s Democratic primary for governor, the first without the county unit: Sanders, of Augusta, president pro tempore of the State Senate, 58.1 percent; Griffin, governor 1955–59, 39.0; three others.'
      n: 'Ga. *Official and Statistical Register*, 1961–62, p. 1436 ([PDF](https://dlg.galileo.usg.edu/data/dlg/sreg/pdfs/dlg_sreg_1961.pdf)), as [Wikipedia](https://en.wikipedia.org/wiki/1962_Georgia_gubernatorial_election) gives it (Check). [[w.cook-carl-sanders]]; [[w.bartley-from-thurmond-to-wallace]]; [[w.black-southern-governors-and-civil]]. See [[cal.1962-04-28.georgia-ga]]. Names: Griffin (K–J Cong. III.F); Sanders (K–J Cong. III.K).'
      tags:
      - name:sanders-carl-e
      - name:griffin-marvin
      - state:ga
- add:
    entry:
      id: cal.1962-09-27.georgia-ga
      when: Sept. 27–Oct. 23
      date: '1962-09-27'
      thread: georgia
      also:
      - legislatures
      c: 'Special session, on *Toombs v. Fortson*. The General Assembly reapportions the Senate''s 54 seats, many to the cities; the Senate passes the plan Oct. 5, 43–4. Nominations already made void: special primaries Oct. 16, runoffs Oct. 23. Counties of several districts to elect their senators at large; Oct. 15, a Fulton Superior Court judge holds that void in Fulton.'
      n: '[Wikipedia, "1962 Georgia State Senate election"](https://en.wikipedia.org/wiki/1962_Georgia_State_Senate_election), from the *Valdosta Daily Times*, Oct. 5 and 16, 1962. Check: the act, Ga. Laws 1962, Extra Sess. [[w.bartley-creation-of-modern-georgia]]; [[w.carter-turning-point]]. See [[cal.1962-05-25.georgia-ga]]. Names: Vandiver (K–J Cong. III.F).'
      tags:
      - name:vandiver-s-ernest-jr
      - state:ga
- add:
    entry:
      id: cal.1962-11-06.georgia-ga
      when: Nov. 6
      date: '1962-11-06'
      thread: georgia
      also:
      - legislatures
      - elections-1962
      c: 'Georgia Senate, the first election under the new apportionment. Leroy Johnson (D), an Atlanta lawyer, elected in the 38th district over a Negro Republican, 7,372 to 3,291: the first Negro in the Senate since 1874. Two Republicans elected. Carter, his special primary in the 14th voided by a court for fraud, elected on write-ins, 3,013 to 2,182.'
      n: '[Wikipedia, "1962 Georgia State Senate election"](https://en.wikipedia.org/wiki/1962_Georgia_State_Senate_election), from the *Atlanta Constitution*, Nov. 8, 1962, and the *Atlanta Journal*, Nov. 10, 1962. [[w.carter-turning-point]]; [[w.tuck-beyond-atlanta]]; [[w.bartley-creation-of-modern-georgia]]. See [[cal.1962-09-27.georgia-ga]]. Names: Leroy Johnson (K–J Cong. III.K); Carter (Cong. III.H).'
      tags:
      - name:johnson-leroy-r
      - name:carter-jimmy
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1962-12-17.georgia-atlanta
      when: Dec. 17–18
      date: '1962-12-17'
      thread: georgia
      also:
      - open-housing
      c: Atlanta. A Negro having bought a house in Peyton Forest, white homeowners ask for barricades across Peyton and Harlan Roads; the Board of Aldermen votes them, Allen signs, and they go up the next day. Jan. 7, the aldermen vote to keep them; Mar. 1, a Fulton Superior Court judge holds them unconstitutional.
      n: '[Wikipedia, "Atlanta''s Berlin Wall"](https://en.wikipedia.org/wiki/Atlanta''s_Berlin_Wall); *Time*, Jan. 18, 1963, "The South: Divided City." [[w.kruse-white-flight]]; [[w.allen-mayor]]; [[w.stone-regime-politics]]. Names: Allen (K–J Cong. III.F).'
      tags:
      - name:allen-ivan-jr
      - state:ga
      - city:atlanta
- add:
    entry:
      id: cal.1965-01-18.georgia-ga
      when: Jan. 18
      date: '1965-01-18'
      thread: georgia
      also:
      - court
      - state-constitutions
      - legislatures
      c: '*Fortson v. Toombs*, [379 U.S. 621](https://tile.loc.gov/storage-services/service/ll/usrep/usrep379/usrep379621/usrep379621.pdf), per curiam: the district court''s bar on putting Georgia''s new constitution to the voters until the legislature is reapportioned vacated and remanded, the 1964 elections having changed the legislature.'
      n: Opinion. See [[cal.1964-06-30.states-and-cities]].
      tags:
      - state:ga
- add:
    entry:
      id: cal.1965-06-15.georgia-atlanta
      when: June 15
      date: '1965-06-15'
      thread: georgia
      also:
      - legislatures
      - elections-1965
      c: Georgia House elections under the 1965 reapportionment (Check which seats). Bond, SNCC's communications director, elected from the 136th district, Atlanta, over another Negro candidate, 2,320 to 487; some 6,000 of its 6,500 voters Negroes. Eleven Negroes elected to the House (Check).
      n: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf) (1966). [[w.neary-julian-bond]]; [[w.tuck-beyond-atlanta]]. See [[cal.1964-06-30.states-and-cities]]; [[cal.1965-01-18.georgia-ga]]. Names: Bond (K–J Cong. III.K).'
      tags:
      - name:bond-julian
      - state:ga
      - city:atlanta
