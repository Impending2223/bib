      when: Nov. 8
      date: '1966-11-08'
      thread: south-carolina
      also:
      - governors
      - elections-1966
      c: 'South Carolina. Governor: McNair (D) over Rogers (R), 58.2 percent, the first Republican to oppose a Democrat for governor since 1938. Senate: Thurmond, a Republican since 1964, re-elected, 62.2; Hollings (D) over Parker (R), 51.3, for Johnston''s unexpired term.'
      n: '[Clerk, *Statistics of the Congressional Election of November 8, 1966*](https://clerk.house.gov/member_info/electionInfo/1966election.pdf), 39. Governor: [Wikipedia](https://en.wikipedia.org/wiki/1966_South_Carolina_gubernatorial_election); Check: *Supplemental Report of the Secretary of State* (1967), 18. [[w.kalk-origins-of-the-southern]]; [[w.black-rise-of-southern-republicans]]. See [[cal.1966-06-14.south-carolina-sc]]; [[cal.1966-11-08.elections-1966]]. Names: Thurmond (K–J Cong. III.B); McNair (K–J Cong. III.F); Rogers (K–J Cong. III.K).'
