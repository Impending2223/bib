    entry:
      id: cal.1965-04-22.south-carolina-sc
      when: Apr. 22
      date: '1965-04-22'
      thread: south-carolina
      also:
      - governors
      c: Johnston having died Apr. 18, Governor Russell resigns; McNair, the lieutenant governor, sworn as governor, appoints him to the Senate.
      n: '[*Time*, Apr. 30, 1965, "South Carolina''s New Senator"](https://web.archive.org/web/20121022165945/http://www.time.com/time/magazine/article/0,9171,898654-1,00.html). [[w.edgar-south-carolina]]; [[w.kalk-origins-of-the-southern]]. See [[cal.1962-06-12.south-carolina-sc]]. Names: Russell, McNair (K–J Cong. III.F).'
      tags:
      - name:johnston-olin-d
      - name:russell-donald-s
      - name:mcnair-robert-e
      - state:sc
- add:
    entry:
      id: cal.1966-02-28.south-carolina-sc
      when: Feb. 28
      date: '1966-02-28'
      thread: south-carolina
      also:
      - legislatures
      - court
      c: '*O''Shields v. McNair*. A three-judge court, Haynsworth writing, upholds the House, 124 members apportioned among the counties by population, and approves, for the 1966 election only, the Act of Feb. 3: a Senate of fifty from 27 districts of whole counties, up to four a district, in place of one senator a county.'
      n: '*O''Shields v. McNair*, [254 F. Supp. 708](https://static.case.law/f-supp/254/html/0708-01.html) (D.S.C. 1966). [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1964-06-15.court]]. Names: McNair (K–J Cong. III.F); Haynsworth (Cong. III.J).'
      tags:
      - name:haynsworth-clement-f-jr
      - name:mcnair-robert-e
      - state:sc
- add:
    entry:
      id: cal.1966-06-14.south-carolina-sc
      when: June 14
      date: '1966-06-14'
      thread: south-carolina
      also:
      - elections-1966
      c: 'South Carolina''s Democratic primary. Senate, for Johnston''s unexpired term: Hollings 60.8 percent, Senator Russell 39.2. Governor McNair unopposed. Rogers, a State representative, the Republicans'' nominee for governor without a primary.'
      n: 'Check: *Supplemental Report of the Secretary of State*, in *Reports and Resolutions* (1967), II, as [Wikipedia](https://en.wikipedia.org/wiki/1966_United_States_Senate_special_election_in_South_Carolina) gives it. [[w.kalk-origins-of-the-southern]]; [[w.hollings-making-government-work]]. See [[cal.1965-04-22.south-carolina-sc]]. Names: Russell, McNair (K–J Cong. III.F); Rogers (K–J Cong. III.K).'
      tags:
      - name:hollings-ernest-f
      - name:russell-donald-s
      - name:mcnair-robert-e
      - name:rogers-joseph-o-jr
      - state:sc
