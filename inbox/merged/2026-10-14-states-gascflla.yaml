      - elections-1962
      c: 'South Carolina''s Democratic primary. Governor: Russell, president of the University of South Carolina 1952–57, 60.8 percent; Lieutenant Governor Maybank 31.4; three others; no runoff. Senate: Johnston 66.3, Governor Hollings 33.7.'
      n: 'Check: *Supplemental Report of the Secretary of State*, in *Reports and Resolutions* (1963), II, as Wikipedia gives it ([governor](https://en.wikipedia.org/wiki/1962_South_Carolina_gubernatorial_election); [Senate](https://en.wikipedia.org/wiki/1962_United_States_Senate_election_in_South_Carolina)). [[w.kalk-origins-of-the-southern]]; [[w.edgar-south-carolina]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.hollings-making-government-work]]. Names: Russell (K–J Cong. III.F); Maybank (K–J Cong. III.K).'
