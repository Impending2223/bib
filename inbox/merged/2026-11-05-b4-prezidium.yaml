- check:
    id: cal.1961-05-18.soviet-union
    text: 'Check: for May 18 the volume prints, from Protocol 329, item 2, by poll, only the press release on the meeting with Kennedy, for the radio on May 19 at 6 p.m., and the instructions to the ambassador in Austria ([[w.prezidium-tsk-kpss-1954]], III, 167–68); nothing of Bolshakov.'
- edit:
    id: cal.1963-04-25.testing
    base: 1f9ae14a
    set:
      c: 'The Presidium, Malinovsky invited. Khrushchev: the military need no more tests in the atmosphere; seek a partial ban, on tests in the atmosphere, in space and under water, with no condition, no moratorium underground, nothing of Berlin. "I think that on this issue we may reach an immediate agreement"; the timing his. Ilyichev''s note on jamming approved: the BBC and then the Voice of America to go unjammed by stages; more radio sets for the public.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 701–07 (Protocol 94 and the stenogram); [[w.prezidium-tsk-kpss-1954]], III, 465–72 (the resolutions, P 94/I and IV; Kennedy''s message of Apr. 16; Ilyichev''s note of Mar. 30); [[w.fursenko-khrushchevs-cold-war]], 520–21. Made public: 2003, 2008. See [[cal.1963-04-24.testing]], [[cal.1963-03-30.press-and-broadcasting]]. Names: Malinovsky, Khrushchev.'
