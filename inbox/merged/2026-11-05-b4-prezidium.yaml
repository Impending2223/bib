- add:
    entry:
      id: cal.1963-11-26.soviet-union-2
      when: Nov. 26
      date: '1963-11-26'
      thread: soviet-union
      also:
      - cuba
      - china
      c: 'The Presidium. On Professor Barghoorn''s arrest: "We made a mistake." The military delegation to Cuba under Bagramyan not to go now; Khrushchev against his own trip to Cuba, Castro to be prepared for it. Cambodia: support, no further. An answer to Iran''s note on the plane shot down. On the talk with Gomułka about a letter to Mao: perhaps a Central Committee letter to the party, nothing in the press; a month without open polemics.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 779–80 (Protocol 125, Malin''s notes). Made public: 2003. Names: Khrushchev, Castro, Mao.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-fidel
      - name:mao-zedong
      src:
        c: b17465bb
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 779–80: all'
        - 'via x.1963-11-26.presidium-protocol-125: all'
- add:
    entry:
      id: cal.1963-12-04.cuba
      when: Dec. 4
      date: '1963-12-04'
      thread: cuba
      also:
      - soviet-union
      c: The Presidium sends Podgorny to Cuba, Brezhnev to Czechoslovakia. At the plenum the medical report on Kozlov to be read; Shcherbitsky out as a candidate member of the Presidium, Shelest in, not recorded.
      n: '[[w.prezidium-tsk-kpss-1954]], I, 781 (Protocol 125, continued, Malin''s notes). Made public: 2003. See [[cal.1963-11-26.soviet-union-2]]. Names: Podgorny, Brezhnev, Kozlov.'
      tags:
      - name:podgorny-nikolai-v
      - name:brezhnev-leonid
      - name:kozlov-frol-r
      src:
        c: 9fe567c2
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 781: all'
        - 'via x.1963-12-04.presidium-protocol-125-continued: all'
- add:
    entry:
      id: cal.1964-03-20.soviet-union
      when: Mar. 20
      date: '1964-03-20'
      thread: soviet-union
      also:
      - defense
      - soviet-union-space
      c: 'The Presidium hears Brezhnev on military questions: the types of missiles; the launchers to be built soon; the plan for producing nuclear weapons. On the launches to the Moon and Venus: "Do not lose the priority in space"; a flight of three in preparation.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 820 (Protocol 137, Malin''s notes). Made public: 2003. Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      src:
        c: c44bb2c7
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 820: all'
        - 'via x.1964-03-20.presidium-protocol-137: all'
- add:
    entry:
      id: cal.1964-06-04.soviet-union
      when: June 4
      date: '1964-06-04'
      thread: soviet-union
      also:
      - china
      - laos
      - south-asia
      c: 'The Presidium. The answer to the Chinese party''s letter of May 7 approved in the main: a meeting of the parties, even without unity no split. Suslov on the French Communists'' congress. Mikoyan on Japan: rightly proposed a ban on underground tests. Kosygin on Nehru''s funeral: Shastri; a meeting with Rusk on economic questions. Laos: "Let them start."'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 825–27 (Protocol 147, items II, V–VII, Malin''s notes). Made public: 2003. Names: Suslov, Mikoyan, Kosygin, Nehru, Shastri, Rusk.'
      tags:
      - name:suslov-mikhail-a
      - name:mikoyan-anastas
      - name:kosygin-aleksei
      - name:nehru-jawaharlal
      - name:shastri-lal-bahadur
      - name:rusk-dean
      - name:khrushchev-nikita-s
      src:
        c: 4db00524
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 825–27: all'
        - 'via x.1964-06-04.presidium-protocol-147: all'
- add:
    entry:
      id: cal.1964-08-19.china
      when: Aug. 19
      date: '1964-08-19'
      thread: china
      also:
      - soviet-union
      c: 'The Presidium on principles for settling the territorial and border disputes that may arise between socialist countries: the Foreign Ministry and Andropov''s department to draft them.'
      n: '[[w.prezidium-tsk-kpss-1954]], III, 728 (Protocol 155, item II). Made public: 2008. Names: Andropov.'
      tags:
      - name:andropov-yuriy-vladimirovich
      src:
        c: 5b578414
        rows:
        - 'w.prezidium-tsk-kpss-1954 III, 728: all'
        - 'via x.1964-08-19.presidium-resolution-border-disputes: all'
- add:
    entry:
      id: cal.1964-09-25.soviet-union
      when: Sept. 25
      date: '1964-09-25'
      thread: soviet-union
      also:
      - china
      - cuba
      - defense
      c: 'The Presidium. A telegram from Peking: caution, nothing heated; "The Chinese do not want a conflict, I think," border clashes possible; perhaps mobile units, the sources checked; Malinovsky to look, not overdo it. Whether Chen Yi''s word of Romanian territorial claims on the Soviet Union is true. The delegation to Peking for the anniversary: party and government. Dobrynin''s telegram: agreed, he to talk with Thompson on Cuba. The missiles: no more money for the UR-200, the R-36 in production, Chelomei on the UR-100 and UR-500. Malinovsky and Biryuzov''s note on Cuba read.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 859–61 (Protocol 160, Malin''s notes). Made public: 2003. Names: Malinovsky, Dobrynin, Thompson.'
      tags:
      - name:malinovsky-rodion-yakovlevich
      - name:dobrynin-anatoly
      - name:thompson-llewellyn-e
      - name:khrushchev-nikita-s
      src:
        c: bea3cd79
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 859–61: all'
        - 'via x.1964-09-25.presidium-protocol-160: all'
- cite:
    id: cal.1960-02-01.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 422–35 (Protocol 262 and the stenogram)'
    units: all
- src:
    id: cal.1960-02-01.soviet-union
    rows:
    - 'via x.1960-02-01.presidium-stenogram: all'
- check:
    id: cal.1960-02-01.soviet-union
    text: 'Check: the stenogram (I, 435) has Khrushchev: "Now they themselves think we are stronger, and we propose this"; the words in c are Fursenko and Naftali''s.'
- cite:
    id: cal.1960-04-07.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 437–38 (Protocol 274)'
    units: A-C
- src:
    id: cal.1960-04-07.soviet-union
    rows:
    - 'via x.1960-04-07.presidium-protocol-274: A-C'
- check:
    id: cal.1960-04-07.soviet-union
    text: 'Check: the protocol (I, 438) has the letter read at the session, the political education of the commanders weak, perhaps lectures for the officers; no order of Khrushchev''s, no system of reporting what they say. Its item I (437): Khrushchev on France, the draft resolution "too hurrah," the failure to agree to be said too.'
- cite:
    id: cal.1960-04-28.soviet-union
