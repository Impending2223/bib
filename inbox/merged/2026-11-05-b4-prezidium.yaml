- check:
    id: cal.1960-05-04.soviet-union
    text: 'Check: the protocol (I, 441–42) has Kosygin first deputy chairman of the Council of Ministers, Polyansky a member of the Presidium, Podgorny from candidate to member; nothing of Kosygin''s Presidium seat.'
- cite:
    id: cal.1960-10-15.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 444–46 (Protocol 306)'
    units: A-C
- src:
    id: cal.1960-10-15.soviet-union
    rows:
    - 'via x.1960-10-15.presidium-protocol-306: A-C'
- check:
    id: cal.1960-10-15.soviet-union
    text: 'Check: the protocol (I, 444–46) has nothing of Hammarskjöld; it has the Geneva talks on a test ban to be slowed and tied to a general agreement on disarmament (445), Zorin to back the neutrals'' draft resolution (446; [[w.prezidium-tsk-kpss-1954]], III, 133).'
- cite:
    id: cal.1961-02-16.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 480, 487, 490 (Protocol 315 and the stenogram)'
    units: A-C
- src:
    id: cal.1961-02-16.soviet-union
    rows:
    - 'via x.1961-02-16.presidium-stenogram: A-C'
- check:
    id: cal.1961-02-16.soviet-union
    text: 'Check: the stenogram (I, 490) has Khrushchev: "We save gold, and then buy butter and give 23 tons," better spent on fertilizer and herbicides; no London, no $26 million. The cows (480, 487): a secretary who bought and slaughtered 100,000 workers'' cows in 1959, since moved to Kaluga.'
- cite:
    id: cal.1961-02-24.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 493–94 (Protocol 316)'
    units: A, C
- src:
    id: cal.1961-02-24.soviet-union
    rows:
    - 'via x.1961-02-24.presidium-protocol-316: A, C'
- check:
    id: cal.1961-02-24.soviet-union
    text: 'Check: the protocol (I, 493–94) has Khrushchev on "principled positions" in trade with Albania, polemic with Mikoyan; Mikoyan''s concern that "the Chinese and others" could say Moscow presses a small country; the decision not to break off trade, the trade agreement not signed now, the radio station dismantled.'
- cite:
    id: cal.1961-03-25.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 494–96 (Protocols 320 and 321)'
    units: A-B
- src:
    id: cal.1961-03-25.soviet-union
    rows:
    - 'via x.1961-03-25.presidium-protocol-321: A-B'
- check:
    id: cal.1961-03-25.soviet-union
    text: 'Check: the protocols (I, 494–96) have "Cut off the noise" (шумиху); no word of fudging the figures, only, on Mar. 23, the upward corrections without their sources and whether the figures are real.'
- cite:
    id: cal.1961-05-26.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 498–507 (Protocol 331; Khrushchev''s remarks)'
    units: A, D
- src:
    id: cal.1961-05-26.soviet-union
    rows:
    - 'via x.1961-05-26.presidium-stenogram-protocol-331: A, D'
- check:
    id: cal.1961-05-26.soviet-union
    text: 'Check: the protocol and Khrushchev''s remarks (I, 498–507) bear out Fursenko and Naftali against the approval of the paper as written: a peace treaty with the GDR "firmly"; Western planes to land at GDR fields, shot down if need be (505); "more than 95%" that there will be no war (503); arms into the GDR within six months; out of the protocol, the test ban tied to disarmament, no concession on the American two to one (499); presents for Kennedy, "One gives presents even before a war" (507). On May 17 the Foreign Ministry''s materials were set aside as "bureaucratic documents" (497–98).'
