    units: A-C
- src:
    id: cal.1960-04-28.soviet-union
    rows:
    - 'via x.1960-04-28.presidium-protocol-277: A-C'
- check:
    id: cal.1960-04-28.soviet-union
    text: 'Check: the protocol (I, 440) has Voroshilov on the scrap premiums, "a great misunderstanding"; out of the protocol, whether Khrushchev should speak on foreign and home policy at the Supreme Soviet''s session, no decision.'
- cite:
    id: cal.1960-05-04.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 441–42 (Protocol 279)'
    units: A-B
- src:
    id: cal.1960-05-04.soviet-union
    rows:
