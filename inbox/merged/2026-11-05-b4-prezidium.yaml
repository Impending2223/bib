ops:
- add:
    entry:
      id: cal.1960-01-28.africa-algeria-morocco
      when: Jan. 28
      date: '1960-01-28'
      thread: africa-algeria-morocco
      also:
      - europe-and-the-alliance-france
      - soviet-union
      c: 'The Presidium on Semenov''s telegram from Rabat: the Foreign Ministry to draft proposals on Algeria; Semenov''s instructions for a meeting with Belkacem Krim, of the Algerian Provisional Government, approved with additions. Khrushchev: contact before his visit to France; a trip to the Sahara a concession, for which de Gaulle should take the Soviet proposal on West Berlin, and no trip if he holds out. Vinogradov to be in Moscow from Paris by Jan. 30.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 421–22 (Protocol 261, item XXI, Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 80–83 (the resolution; Gromyko''s note of Jan. 27; the draft instructions to Semenov, and to Vinogradov to learn the French Communists'' position on Algeria). Made public: 2003, 2008. Names: Khrushchev, de Gaulle.'
      tags:
      - name:khrushchev-nikita-s
      - name:de-gaulle-charles
      src:
        c: 028e715e
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 421–22: all'
        - 'w.prezidium-tsk-kpss-1954 III, 80–83: A-B'
        - 'via x.1960-01-28.presidium-protocol-261: all'
        - 'via x.1960-01-28.presidium-resolution-algeria: A-B'
- add:
    entry:
      id: cal.1960-03-21.testing
      when: Mar. 21
      date: '1960-03-21'
      thread: testing
      also:
      - soviet-union
      c: 'The Presidium, on Khrushchev''s proposal: further Soviet positions on disarmament, against the Western powers'' plan before the Ten-Nation Committee, to be worked out in detail; the Foreign and Defense Ministries to draft them.'
      n: '[[w.prezidium-tsk-kpss-1954]], III, 97 (Protocol 271, item II). Made public: 2008. See [[cal.1960-03-15.testing]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 624f7c96
        rows:
        - 'w.prezidium-tsk-kpss-1954 III, 97: all'
        - 'via x.1960-03-21.presidium-resolution-disarmament: all'
- add:
    entry:
      id: cal.1960-05-27.testing
      when: May 27
      date: '1960-05-27'
      thread: testing
      also:
      - soviet-union
      c: By poll, the Presidium approves Khrushchev's message to the heads of government of all countries on general and complete disarmament, with further directives for the delegation to the Ten-Nation Committee; the ambassadors in Poland, Czechoslovakia, Romania and Bulgaria to clear the new steps with those governments; the message to go out June 2.
      n: '[[w.prezidium-tsk-kpss-1954]], III, 97–101 (Protocol 284, item 2; the Foreign and Defense Ministries'' note of May 25; the instructions; the directives). Made public: 2008. See [[cal.1960-03-21.testing]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 50c43fe0
        rows:
        - 'w.prezidium-tsk-kpss-1954 III, 97–101: all'
        - 'via x.1960-05-27.presidium-resolution-disarmament-message: all'
- add:
    entry:
      id: cal.1960-04-15.soviet-union
      when: Apr. 15
      date: '1960-04-15'
      thread: soviet-union
      c: 'The Presidium on a note of the KGB and the Procurator: Vasily Stalin, released early, back to prison, the decree releasing him annulled. Voroshilov censured for receiving him: "while I live, no one will touch you"; from him, they say, Vasily went to the Chinese embassy. Voroshilov: "I admit it."'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 438–39 (Protocol 275, item LVIII, Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 117–24 (the note of Shelepin and Rudenko; the resolution; Voroshilov''s note to Khrushchev of Apr. 13 and his talk with Vasily Stalin of Apr. 9). Made public: 2003, 2008. Names: Voroshilov.'
      tags:
      - name:voroshilov-klimenti-efremovich
      - name:shelepin-alexandr-n
      - name:suslov-mikhail-a
      src:
        c: b6afda8d
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 438–39: all'
        - 'w.prezidium-tsk-kpss-1954 III, 117–24: A'
        - 'via x.1960-04-15.presidium-protocol-275: all'
        - 'via x.1960-04-15.rudenko-shelepin-note-vasily-stalin: A'
- add:
    entry:
      id: cal.1960-06-02.soviet-union
      when: June 2
      date: '1960-06-02'
      thread: soviet-union
      also:
      - china
      c: 'By poll, the Presidium approves a letter to the parties of the socialist camp: a meeting of their representatives at Bucharest at the end of June, on the situation since the Americans wrecked the summit, with a session there of the Warsaw Pact''s Political Consultative Committee, Peking, Pyongyang and Ulan Bator as observers. Khrushchev, out of the protocol: discipline one for all, the Chinese representative having published his speech; perhaps the Chinese invited for talks, a number of measures held back; Mao''s remarks on Kim Il Sung to be given Kim to read.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 443 (Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 128–31 (the resolution; the letter, signed by Khrushchev; the instructions to the ambassadors). Made public: 2003, 2008. Names: Khrushchev, Mao.'
      tags:
      - name:khrushchev-nikita-s
      - name:mao-zedong
      src:
        c: 591505d3
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 443: B-D'
        - 'w.prezidium-tsk-kpss-1954 III, 128–31: A'
        - 'via x.1960-06-02.presidium-protocol-284: B-D'
        - 'via x.1960-06-02.cc-letter-to-socialist-camp-parties: A'
- add:
    entry:
      id: cal.1960-12-30.soviet-union
      when: Dec. 30
      date: '1960-12-30'
      thread: soviet-union
      also:
      - china
      c: 'The Presidium on Albania. Khrushchev: no favors, nothing for free; talks at the highest level only, party and state. The naval base: held by the Soviet side alone, its twelve submarines Soviet until relations are normal, or all twelve taken away. Mikoyan: two to the Albanians outright, two mixed, under the Warsaw Pact command. No more work on the base; work on the radio station stopped; a protest at Soviet ships held up. Khrushchev''s proposal on the base and the submarines adopted; the Defense and Foreign Ministries to draft the papers.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 475–76 (Protocol 312, item XII, Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 140 (the resolution; first printed in a Salonika collection, 2003). Made public: 2003. Names: Khrushchev, Mikoyan.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:malinovsky-rodion-yakovlevich
      src:
        c: 2b337d6d
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 475–76: all'
        - 'w.prezidium-tsk-kpss-1954 III, 140: A, I-J'
        - 'via x.1960-12-30.presidium-protocol-312: all'
        - 'via x.1960-12-30.presidium-resolution-albania: A, I-J'
- add:
    entry:
      id: cal.1961-05-17.soviet-union
      when: May 17
      date: '1961-05-17'
      thread: soviet-union
      also:
      - berlin-and-vienna
      - china
      c: 'The Presidium. Albania: the Foreign Ministry''s proposals, with small changes, for the press only if accepted; no cruisers or destroyers to be sent. The answer to Peking on the quarrel with Albania, to Zhou Enlai''s and Deng Xiaoping''s talks with the ambassador and the Chinese letter: small changes. For the meeting with Kennedy: in Europe, Berlin; on disarmament, troops withdrawn within national borders; the Foreign Ministry''s materials "bureaucratic documents," not approved, a memorandum instead.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 497–98 (Protocol 328, items II–IV, Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 161–67 (the resolutions; the instructions to Yudin in Peking, May 16). Made public: 2003, 2008. See [[cal.1961-02-24.soviet-union]]. Names: Zhou Enlai, Kennedy.'
      tags:
      - name:zhou-enlai
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      src:
        c: 5c4426a9
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 497–98: all'
        - 'w.prezidium-tsk-kpss-1954 III, 161–67: A-B, D'
        - 'via x.1961-05-17.presidium-protocol-328: all'
        - 'via x.1961-05-17.presidium-resolutions-protocol-328: A-B, D'
- add:
    entry:
      id: cal.1961-05-20.testing
      when: May 20
      date: '1961-05-20'
      thread: testing
      also:
      - soviet-union
      c: 'The Presidium approves, with amendments, instructions to the ambassador in Washington: to propose Soviet-American talks on disarmament there on June 5–6, as Gromyko and Stevenson agreed at the General Assembly, mid-June acceptable; the Soviet delegation Zorin, Menshikov, Gryzlov and Usachev.'
      n: '[[w.prezidium-tsk-kpss-1954]], III, 168–69 (Protocol 329, item II; the instructions). Made public: 2008. See [[cal.1961-05-17.soviet-union]]. Names: Gromyko, Zorin, Menshikov.'
      tags:
      - name:gromyko-andrei
      - name:zorin-valerian
      - name:menshikov-mikhail
      src:
        c: 5cf8f834
        rows:
        - 'w.prezidium-tsk-kpss-1954 III, 168–69: all'
        - 'via x.1961-05-20.presidium-instructions-menshikov-disarmament: all'
- add:
    entry:
      id: cal.1961-10-07.soviet-union
      when: Oct. 7
      date: '1961-10-07'
      thread: soviet-union
      also:
      - china
      c: 'The Presidium, out of the protocol. Albania: the congress report a little softer, a hope of better relations. Molotov''s note: without naming it, he is to be taken apart at the congress; perhaps recalled from Vienna and, if he persists, expelled from the party; no decision.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 529 (Protocol 349, Malin''s notes). Made public: 2003. See [[cal.1961-05-17.soviet-union]].'
      src:
        c: 78aed9d0
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 529: all'
        - 'via x.1961-10-07.presidium-protocol-349: all'
- add:
    entry:
      id: cal.1962-04-17.soviet-union
      when: Apr. 17
      date: '1962-04-17'
      thread: soviet-union
      also:
      - european-community
      - china
      c: 'The Presidium. Khrushchev: the propaganda against the Common Market weak and passive, the quarrels among its members and with the United States unused; Ilyichev and Ponomarev to work it out. The answer to the Chinese party''s letter not to be delayed; a meeting of the parties not opposed in principle, if it would make things better.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 552–53 (Protocol 26, item I, Malin''s notes). Made public: 2003. Names: Khrushchev, Ponomarev.'
      tags:
      - name:khrushchev-nikita-s
      - name:ponomarev-boris-n
      src:
        c: b684e171
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 552–53: all'
        - 'via x.1962-04-17.presidium-protocol-26: all'
- add:
    entry:
      id: cal.1962-04-28.berlin-and-vienna
      when: Apr. 28
      date: '1962-04-28'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'The Presidium on directives for further talks on a German peace treaty and West Berlin, Gromyko speaking first. No place for the Federal Republic and West Berlin on a commission. Western troops perhaps acceptable if counted as UN troops. Two courses: an agreement, the Western troops staying for a time, or more pressure; more to gain from an agreement: less tension, perhaps a partial cut in arms, more trade. A fallback: Danish, Norwegian, Dutch or Belgian troops in West Berlin, with Polish and Czechoslovak.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 553–54 (Protocol 28, item I, Malin''s notes). Made public: 2003. See [[cal.1962-01-08.soviet-union]]. Names: Gromyko.'
      tags:
      - name:gromyko-andrei
      - name:khrushchev-nikita-s
      src:
        c: 7fba0c3d
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 553–54: all'
        - 'via x.1962-04-28.presidium-protocol-28: all'
- add:
    entry:
      id: cal.1962-05-09.berlin-and-vienna-2
      when: May 9
      date: '1962-05-09'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'The Presidium, on a KGB note, to go to all members and secretaries. An article by "Observer" for *Pravda* or *Izvestia*: Adenauer sharply criticized, no Committee of Thirteen; the GDR a sovereign state, its functions not to be taken over; if the Western powers follow Adenauer''s ideas, nothing will come of the talks.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 554 (Protocol 30, item XXXIII, Malin''s notes). Made public: 2003. See [[cal.1962-04-28.berlin-and-vienna]]. Names: Adenauer.'
      tags:
      - name:adenauer-konrad
      src:
        c: c067fc2c
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 554: all'
        - 'via x.1962-05-09.presidium-protocol-30: all'
- add:
    entry:
      id: cal.1962-05-11.soviet-union-3
      when: May 11
      date: '1962-05-11'
      thread: soviet-union
      also:
      - defense
      c: The Presidium on defense, Malinovsky, Gorshkov and Biryuzov speaking. The shipbuilding and submarine programs to be reviewed; the dates may slip, "the situation allows." The missile program to be reviewed and studied more deeply; of the number of targets, "10, 25, 250"; the stress on underground launchers. A month; not to be recorded in the protocol. The Defense Ministry's note of May 10 to the Secretariat, those at fault to be punished.
      n: '[[w.prezidium-tsk-kpss-1954]], I, 555 (Protocol 30, continued, item XXXIX, Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 282 (the resolution on the note). Made public: 2003, 2008. Names: Malinovsky.'
      tags:
      - name:malinovsky-rodion-yakovlevich
      - name:khrushchev-nikita-s
      src:
        c: 5f74202b
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 555: A-F'
        - 'w.prezidium-tsk-kpss-1954 III, 282: G'
        - 'via x.1962-05-11.presidium-protocol-30-continued: A-F'
        - 'via x.1962-05-11.presidium-resolution-defense-note: G'
- add:
    entry:
      id: cal.1962-07-12.cuba
      when: July 12
      date: '1962-07-12'
      thread: cuba
      also:
      - soviet-union
      c: 'The Presidium sends Cuba a group of economic advisers, not under the ambassador, from Central Asia. Khrushchev: "Outrageous" to give the Cubans a tractor and no farm machines; more advisers; perhaps a hundred or two of the best ships for fishing, five sent. Mikoyan, Rashidov and Shelepin to prepare it.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 572 (Protocol 41, item II, Malin''s notes). Made public: 2003. See [[cal.1962-07-06.missile-crisis]]. Names: Khrushchev, Mikoyan, Shelepin.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:shelepin-alexandr-n
      src:
        c: 66d6b2b7
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 572: all'
        - 'via x.1962-07-12.presidium-protocol-41: all'
- add:
    entry:
      id: cal.1962-12-30.soviet-union
      when: Dec. 30
      date: '1962-12-30'
      thread: soviet-union
      also:
      - missile-crisis-settlement
      c: 'The Presidium. Khrushchev on his talks with Gomułka and Tito: with Tito, differences on ideology remain, trade on a commercial basis, a dam at the Iron Gates to be built jointly. A Warsaw Pact summit on military questions to be considered. Instructions to Kuznetsov for the talks with the Americans on the settlement in Cuba adopted: Mikoyan for McCloy''s first proposal; Gromyko against, "they want to spoil the agreement." S. P. Ivanov removed, the GRU''s whole network to be reviewed.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 664–65 (Protocol 75, Malin''s notes). Made public: 2003. See [[cal.1962-12-03.soviet-union]]. Names: Khrushchev, Tito, Kuznetsov, Mikoyan, McCloy, Gromyko.'
      tags:
      - name:khrushchev-nikita-s
      - name:tito-josip-broz
      - name:kuznetsov-vasily-v
      - name:mikoyan-anastas
      - name:mccloy-john-j
      - name:gromyko-andrei
      - name:malinovsky-rodion-yakovlevich
      src:
        c: 08a1e22d
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 664–65: all'
        - 'via x.1962-12-30.presidium-protocol-75: all'
- add:
    entry:
      id: cal.1963-01-02.soviet-union
      when: Jan. 2
      date: '1963-01-02'
      thread: soviet-union
      also:
      - cuba
      - china
      c: 'The Presidium, in a room off the Sverdlov Hall: a telegram from Washington to be sent to Cuba; the Leipzig fair to be attended; Khrushchev''s delegation to the East German party''s congress named, to be announced; a letter to China to be drafted, a separate letter on the meeting of the parties; Ehrenburg''s memoirs to be taken apart by the critics, his travel abroad limited.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 669 (Protocol 76, Malin''s notes). Made public: 2003. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 260a0371
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 669: all'
        - 'via x.1963-01-02.presidium-protocol-76: all'
- add:
    entry:
      id: cal.1963-01-24.europe-and-the-alliance-france-2
      when: Jan. 24
      date: '1963-01-24'
      thread: europe-and-the-alliance-france
      also:
      - soviet-union
      c: 'The Presidium on instructions to Vinogradov for a talk with de Gaulle, after the French-West German treaty of Jan. 22. Suslov and Mikoyan for a note and a statement, Mikoyan: "Give de Gaulle one in the teeth"; Kosygin for a paper on the agreements broken; Brezhnev: "The world must hear"; Kozlov: a sharp answer in the press. The Foreign Ministry to redraft; notes of protest to Bonn and Paris after.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 695 (Protocol 79, item XI, Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 436, 1020 n.3 (the resolution; the treaty of Jan. 22; the notes of protest, *Pravda*, Feb. 8). Made public: 2003, 2008. Names: de Gaulle, Suslov, Mikoyan, Kosygin, Brezhnev, Kozlov.'
      tags:
      - name:de-gaulle-charles
      - name:suslov-mikhail-a
      - name:mikoyan-anastas
      - name:kosygin-aleksei
      - name:brezhnev-leonid
      - name:kozlov-frol-r
      src:
        c: 8686372c
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 695: A-F'
        - 'w.prezidium-tsk-kpss-1954 III, 436, 1020 n.3: A, F-G'
        - 'via x.1963-01-24.presidium-protocol-79: A-F'
        - 'via x.1963-01-24.presidium-resolution-de-gaulle: A, F-G'
- add:
    entry:
      id: cal.1963-02-07.soviet-union
      when: Feb. 7
      date: '1963-02-07'
      thread: soviet-union
      c: 'The Presidium on Kuzmin''s telegrams from Bern: the Balzan Foundation''s committee proposes its 1962 prize "for peace and humanity" to Khrushchev jointly with Kennedy. Gromyko: more minuses than pluses; Mikoyan, for at first, wavers; Kozlov and Brezhnev against. Khrushchev: "In company with Kennedy unacceptable," yet much in its favor: "Kennedy will get a prize for peace. That will bind him." Kuzmin to find out more.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 698 (Protocol 81, item XLVII, Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 437–38 (the resolution; Kuzmin''s telegrams of Jan. 11 and Feb. 6). Made public: 2003, 2008. Names: Khrushchev, Kennedy, Gromyko, Mikoyan, Kozlov, Brezhnev.'
      tags:
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:gromyko-andrei
      - name:mikoyan-anastas
      - name:kozlov-frol-r
      - name:brezhnev-leonid
      src:
