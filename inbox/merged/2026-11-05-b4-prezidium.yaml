        - 'w.prezidium-tsk-kpss-1954 III, 437–38: A, F'
        - 'via x.1963-02-07.presidium-protocol-81: B-F'
        - 'via x.1963-02-06.kuzmin-telegrams-balzan-prize: A, F'
- add:
    entry:
      id: cal.1963-03-30.press-and-broadcasting
      when: Mar. 30
      date: '1963-03-30'
      thread: press-and-broadcasting
      also:
      - soviet-union
      c: 'Ilyichev to the Central Committee, on jamming: 131 stations broadcast to the Soviet Union, in 21 of its languages, 80 hours a day; nearly half the power of all Soviet radio stations goes to jamming them. Jamming of the BBC, then of the Voice of America, to be stopped by stages.'
      n: '[[w.prezidium-tsk-kpss-1954]], III, 468–72 (the note). Made public: 2008.'
      src:
        c: e11a2411
        rows:
        - 'w.prezidium-tsk-kpss-1954 III, 468–72: all'
        - 'via x.1963-03-30.ilyichev-note-jamming: all'
- add:
    entry:
      id: cal.1963-06-10.soviet-union
      when: June 10
      date: '1963-06-10'
      thread: soviet-union
      also:
      - china
      - testing
      c: 'The Presidium. Khrushchev on Algeria: Ben Bella''s agrarian line righter than Ponomarev''s answers to it. To Romania June 24, Khrushchev, Kosygin, Podgorny and Andropov. The answer to the Chinese note on nonproliferation to go before the two parties'' delegations meet, July 5. Thirty thousand tons of meat lent to Poland. The Italian Communists'' delegation for September or October.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 732 (Protocol 101, Malin''s notes). Made public: 2003. Names: Khrushchev, Ben Bella, Ponomarev, Kosygin, Podgorny, Andropov.'
      tags:
      - name:khrushchev-nikita-s
      - name:ben-bella-ahmed
      - name:ponomarev-boris-n
      - name:kosygin-aleksei
      - name:podgorny-nikolai-v
      - name:andropov-yuriy-vladimirovich
      src:
        c: cd295a73
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 732: all'
        - 'via x.1963-06-10.presidium-protocol-101: all'
- add:
    entry:
      id: cal.1963-09-04.soviet-union
      when: Sept. 4
      date: '1963-09-04'
      thread: soviet-union
      c: 'The Presidium, Khrushchev back from Yugoslavia: the Yugoslavs "close to us on most questions," but no "hundred-percent unity"; neither Leninists nor anti-Leninists; KGB men to study their border regime; perhaps in a few years the border open for free departure. Tito asks help in defense; Malinovsky to prepare. Dobrynin''s telegram on fishing vessels to Kosygin. Erroll, the British trade minister, to be received by Kosygin and Ustinov. Kosygin''s visit to Austria put off. The airfield at Conakry and gas for Afghanistan approved.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 735–37 (Protocol [113], Malin''s notes). Made public: 2003. Names: Khrushchev, Tito, Malinovsky, Dobrynin, Kosygin.'
      tags:
      - name:khrushchev-nikita-s
      - name:tito-josip-broz
      - name:malinovsky-rodion-yakovlevich
      - name:dobrynin-anatoly
      - name:kosygin-aleksei
      src:
        c: 9cc4b65a
        rows:
