patch: 2026-11-06-b6-cosmas-joint-chiefs
by: 'Claude (batch 6: the minor rows re-ruled; Cosmas, JCS and the War in Vietnam, pt. 2, 2012), Nov. 10, 2026'
ops:
- add:
    entry:
      id: cal.1963-12-21.vietnam-3
      when: Dec. 21
      date: '1963-12-21'
      thread: vietnam
      c: 'Krulak, the Joint Chiefs'' Special Assistant for Counterinsurgency and Special Activities, to Taylor, after Saigon:
        the government''s machinery, "far from satisfactory before the coup," has "decelerated greatly"; the junta''s generals,
        competent soldiers, preoccupied with politics; the civilians of marginal quality; officials in the provinces unsure
        of their authority and tenure.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 11 (quoting it). Check: the day; Cosmas''s text gives Dec. 23, his note
        the memorandum of Dec. 21 (11 n.15). To check: SACSA to CJCS, Dec. 21, 1963, OCJCS File, Trip Reports (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        11 n.15). See [[cal.1963-12-21.vietnam]]. Names: Krulak, Taylor.'
      src:
        c: 8a714a37
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 11: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 11 n.15: all'
      tags:
      - 'name:krulak-victor-h'
      - 'name:taylor-maxwell'
- add:
    entry:
      id: cal.1964-01-23.vietnam
      when: Jan. 23
      date: '1964-01-23'
      thread: vietnam
      c: 'Lodge and Harkins with Dương Văn Minh and other generals on a tour of several provinces. Lodge to Washington: the
        government trying to reach the people; the struggle against the Viet Cong now turning its way; Minh "pushing a sound
        plan, political and military, with determination and ability."'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 11 (quoting it). To check: Saigon 1374 to State, Jan. 23, 1964 (cited by
        [[w.cosmas-joint-chiefs-of-staff-2012]], 11 n.16). Names: Lodge, Harkins, Dương Văn Minh.'
      src:
        c: a34794bd
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 11: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 11 n.16: all'
      tags:
      - 'name:lodge-henry-cabot'
      - 'name:harkins-paul-d'
      - 'name:duong-van-minh'
- add:
    entry:
      id: cal.1964-03-06.vietnam
      when: Mar. 6
      date: '1964-03-06'
      thread: vietnam
      c: 'The Joint Staff''s study of a naval blockade of North Vietnam, drawn from CINCPAC''s reply, to the Joint Chiefs:
        the United States able to impose an effective blockade, but only if "prepared to accept escalation of the tempo of
        operations into a belligerent status with the DRV and subsequently with the Chinese communists"; a measure high on
        the scale of escalation.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 32 (quoting it). To check: JCS 2343/339, Mar. 6, 1964, JMF 9155.3/3100
        (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 32 n.13). See [[cal.1964-03-06.vietnam-34a]].'
      src:
        c: c91da5b3
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 32: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 32 n.13: all'
      tags: []
- add:
    entry:
      id: cal.1964-11-10.vietnam-2
      when: Nov. 10
      date: '1964-11-10'
      thread: vietnam
      c: 'Taylor to Rusk, Saigon 1445: the minimum government needed before pressure on the North, one able to keep order
        in the cities, secure the bases from the Viet Cong and gear its efforts to Washington''s. If the government falters
        for good, he would go against the North anyway: "pulmotor treatment for a government in extremis."'
      n: '[FRUS 1964–68, I, doc. 409](https://history.state.gov/historicaldocuments/frus1964-68v01/d409). [[w.cosmas-joint-chiefs-of-staff-2012]],
        161–62 (the Mission Council''s discussion). See [[cal.1964-11-03.vietnam]]. Names: Taylor, Rusk.'
      src:
        c: b92d932c
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d409: all'
        - 'via x.1964-11-10.saigon-1445-to-state-nov-10-1964: all'
        - 'w.cosmas-joint-chiefs-of-staff-2012 161–62: all'
      tags:
      - 'name:taylor-maxwell'
      - 'name:rusk-dean'
- add:
    entry:
      id: cal.1964-11-14.vietnam-2
      when: Nov. 14
      date: '1964-11-14'
      thread: vietnam
      c: 'The Joint Chiefs to McNamara, JCSM-955-64, on the enemy''s reactions to strikes on the North: Hanoi and Peking would
        try propaganda and diplomacy; the DRV and the Chinese "unlikely to expand the conflict"; China "very reluctant" to
        enter the fighting; no significant shortfalls short of the upper scale of action. Their program of Nov. 4 repeated.'
      n: '[FRUS 1964–68, I, doc. 411](https://history.state.gov/historicaldocuments/frus1964-68v01/d411). [[w.cosmas-joint-chiefs-of-staff-2012]],
        157–58. See [[cal.1964-11-03.vietnam]]. Names: McNamara.'
      src:
        c: f3f240d0
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d411: all'
        - 'via x.1964-11-14.jcsm-955-64-to-mcnamara-nov-14-1964: all'
        - 'w.cosmas-joint-chiefs-of-staff-2012 157–58: all'
      tags:
      - 'name:mcnamara-robert-s'
      - 'name:wheeler-earle'
- add:
    entry:
      id: cal.1964-11-16.vietnam-2
      when: Nov. 16
      date: '1964-11-16'
      thread: vietnam
      c: 'Rostow to McNamara, after their talk the night before: "too much thought is being given to the actual damage we
        do in the North, not enough thought to the signal we wish to send"; no next stage "without a US ground force commitment
        of some kind"; the first strikes "as limited and as unsanguinary as possible."'
      n: '[FRUS 1964–68, I, doc. 412](https://history.state.gov/historicaldocuments/frus1964-68v01/d412). [[w.cosmas-joint-chiefs-of-staff-2012]],
        162. See [[cal.1964-11-03.vietnam]]. Names: Rostow, McNamara.'
      src:
        c: ec226ed6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d412: all'
        - 'via x.1964-11-16.rostow-to-mcnamara-nov-16-1964: all'
        - 'w.cosmas-joint-chiefs-of-staff-2012 162: all'
      tags:
      - 'name:rostow-walt-w'
      - 'name:mcnamara-robert-s'
- add:
    entry:
      id: cal.1965-05-22.vietnam-air-war-3
      when: May 22
      date: '1965-05-22'
      thread: vietnam-air-war
      c: 'The Joint Chiefs to McNamara, JCSM-404-65: for CINCPAC''s concept of round-the-clock strikes in small increments,
        CINCPAC to have authority to plan strikes and restrikes, a weekly plan to the Joint Chiefs, 400 sorties a week.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 364–65. To check: JCSM-404-65, May 22, 1965, JMF 9155.3 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        365 n.13); CINCPAC to JCS, 120314Z May 1965, FRUS 1964–68, II, doc. 295 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]],
        364 n.12). Names: Sharp.'
      src:
        c: 2016fbd4
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 364–65: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 365 n.13: all'
      tags:
      - 'name:sharp-u-s-grant'
- add:
    entry:
      id: cal.1965-06-22.vietnam-air-war
      when: June 22
      date: '1965-06-22'
      thread: vietnam-air-war
      c: 'McNamara to Wheeler: CINCPAC''s concept and the Joint Chiefs'' recommendations of May 22 disapproved; "I doubt that,
        at this time, a change in our method of planning ROLLING THUNDER operations would be desirable."'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 365 (quoting it). To check: McNamara to Wheeler, June 22, 1965, JMF 9155.3
        (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 365 n.14). See [[cal.1965-05-22.vietnam-air-war-3]]. Names: McNamara,
        Wheeler.'
      src:
        c: a95d6744
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 365: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 365 n.14: all'
      tags:
      - 'name:mcnamara-robert-s'
      - 'name:wheeler-earle'
- add:
    entry:
      id: cal.1964-05-23.vietnam
      when: May 23
      date: '1964-05-23'
      thread: vietnam
      c: 'The Joint Chiefs to McNamara, JCSM-445-64, on the time to carry out Recommendation 12 under OPLAN 37-64: no consultation
        with Saigon yet ("The Department of State should take the lead on this but as yet has not"); VNAF training in aerial
        mine-laying to resume May 20, A-1s for the VNAF and Farm Gate on schedule; border operations within 72 hours of authorization,
        larger ones in 5 to 10 days; the deterrent forces 12 to 15 days, the last increment 45; the best weather for operations
        in the North mid-October to mid-December.'
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 46–47 (quoting it). To check: JCSM-445-64, May 23, 1964, JMF 9155.3/3100
        (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 47 n.55). See [[cal.1964-03-17.vietnam]]. Names: McNamara.'
      src:
        c: 639d5c65
        rows:
        - 'w.cosmas-joint-chiefs-of-staff-2012 46–47: all'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 47 n.55: all'
      tags:
      - 'name:mcnamara-robert-s'
