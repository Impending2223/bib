- edit:
    id: cal.1968-06-05.crime-and-hijacking-guns
    base: 72fc5d50
    set:
      time: 1968-06-05T11:00Z
      time_approx: true
      time_zone: America/New_York
      n: '[[w.johnson-white-house-diary]], 680 (Lady Bird Johnson''s account). The hour is "Very early in the morning ... I think it was around 7 o''clock." The words are as Mrs. Johnson gives them. Order: after [[cal.1968-06-05.assassination-4|Johnson''s call to Pierson]], by the hours: Pierson''s call at six (Shesol, 452), Mansfield in the bedroom about seven in the morning (the diary, 680). See [[cal.1968-06-05.assassination-3]]. Made public: 1970. Names: Mansfield, Johnson.'
- follows: {id: cal.1968-06-05.crime-and-hijacking-guns, add: [cal.1968-06-05.assassination-4]}
- edit:
    id: cal.1968-06-05.assassination-13
    base: 4548bea8
    set:
      n: '[[w.witcover-85-days]], 287, 294 (Lynch on Yorty''s "revelations of the previous day," June 6, 294). Order: after [[cal.1968-06-05.assassination-12|Yorty''s press conference]], by Witcover (286–87: the press conference naming the suspect; the notebooks, "he reported later in a television interview"). Names: Yorty, Sirhan.'
- follows: {id: cal.1968-06-05.assassination-13, add: [cal.1968-06-05.assassination-12]}
- edit:
    id: cal.1968-06-05.assassination-16
    base: 9b97697d
    set:
      n: '[[w.witcover-85-days]], 286 ("quickly arraigned at 7:40 A.M., Pacific time"). Check: the order. See [[cal.1968-06-05.assassination-12]]. Names: Sirhan.'
- follows: {id: cal.1968-06-05.assassination-16, remove: [cal.1968-06-05.assassination-12], why: 'Witcover, 286, the link''s only basis, prints the arraignment after Yorty''s naming of the suspect but gives no word of order between them: the press conference is "Several hours after his arrest," and the man "was quickly arraigned at 7:40 A.M.," quickly after the arrest. The order a narrative prints its items in is no order by itself (R25c).'}
