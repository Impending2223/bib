- edit:
    id: cal.1968-06-08.robert-kennedy-3
    base: d78bf56e
    set:
      n: '[[w.johnson-white-house-diary]], 685–86 (Lady Bird Johnson''s account). The page does not name who brought the request or give the hour. Order: after [[cal.1968-06-08.robert-kennedy-2|the wait in the car]], by the diary''s order (685–86: Humphrey''s words in the car; then the request; "Then we got the signal to get out of the car"), its hours agreeing ("at about 8:45" to the station); the weakest kind of basis. See [[cal.1968-06-08.robert-kennedy-2]]. Names: Johnson, Cushing.'
- follows: {id: cal.1968-06-08.robert-kennedy-3, add: [cal.1968-06-08.robert-kennedy-2]}
