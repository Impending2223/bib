- cite: {id: cal.1968-06-26.court-fortas, item: '[[w.johnson-vantage-point]], 546–47'}
- edit:
    id: cal.1968-06-26.court
    base: '33727295'
    set:
      n: 'The President''s News Conference, [1968–69 Pub. Papers 746](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=824) (June 26, 1968). [Johnson and Fortas, 3:48 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-abe-fortas-june-21-1968), Conversation WH6806-02-13127 (Miller Center). [[w.dallek-flawed-giant]], 556–60 (Warren''s letter; the nominations; Griffin''s statement); [[w.johnson-white-house-diary]], 689, 692 (June 26: "Lyndon nominated Abe Fortas for Chief Justice and Homer Thornberry for Associate Justice"; at dinner at Timberline Lodge "a former state official who was very interested in Lyndon''s appointments of the day," and "everyone came up to me with questions or expressions of interest," she unable to assess "the color of their thinking, approval or disapproval"; the diary has no hour and no Warren letter). [[w.longley-lbjs-1968]], 160–64 (Warren''s letter; the nominations; Griffin). Order: after [[cal.1968-06-26.court-fortas|Eastland''s call]], by Longley (163–64: Eastland with Johnson "On the 26th"; "Despite Eastland''s pessimistic report, on June 26, the president sent forth the names"); Johnson''s own account (Vantage Point, 546–47) dates the call June 26 and does not order it against the announcement. To check: [[w.kalman-abe-fortas]]; [[w.murphy-fortas]]; [[w.shogan-question-of-judgment]]; [[w.kalman-long-reach-of-the-2017]]; [[w.newton-justice-for-all]]; [[w.schwartz-super-chief]]; Jones''s memorandum for the record, June 13, 1968, WHCF: EX/FG535/A, LBJ Library (cited by [[w.dallek-flawed-giant]], 557). See [[cal.1967-06-13.court]]. Names: Warren, Fortas, Thornberry, Griffin, Johnson. Check: Dallek gives eighteen Senators with Griffin (560).'
- follows: {id: cal.1968-06-26.court, add: [cal.1968-06-26.court-fortas]}
