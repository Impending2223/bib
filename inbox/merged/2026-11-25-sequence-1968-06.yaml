patch: 2026-11-25-sequence-1968-06
by: 'Claude (Sonnet, sequence pass: R25c on June 1968), Nov. 25, 2026; notes/sequence/1968-06.md; audited and corrected by Claude (Opus, R25c, R33b), Nov. 25, 2026; notes/sequence/audit-1968-06.md'
ops:
- edit:
    id: cal.1968-06-01.elections-1968
    base: b11212a0
    set:
      n: '[[w.schlesinger-robert-kennedy-and-his]], 910–12 (the debate, its issues; not the network or its length); [[w.palermo-in-his-own-right]], 238–41 (the joint appearance in San Francisco after Oregon; the campaign''s memorandum before it; the issues); [[w.cq-weekly-report]], June 7, 1968, 1370–71 (ABC; an hour; the NLF); [[w.chester-american-melodrama]], 337–49; [[w.white-making-of-the-president-1969]], 179; [[w.bernstein-guns-or-butter]], 503 ("the affair was a wash"); [[w.thomas-robert-kennedy]], 386 (Saturday night, three journalists asking; Lawrence of ABC on the King wiretap, Kennedy''s "obvious set piece"; to McCarthy: "You say you are going to take ten thousand black people and move them into Orange County?"; more arms for Israel); [[w.zaroulis-who-spoke-up]], 170 (Saturday, June 1: the Kennedy–McCarthy debate; each claimed to have won; the ghetto more than Vietnam); [[w.obrien-no-final-victories]], 243 (Kennedy accepts McCarthy''s challenge to debate, a decision O''Brien counts important after the Oregon loss; Kennedy works hard preparing and "we were all pleased with the outcome"; not the day or the hour); [[w.witcover-85-days]], 240–46 (one hour, KGO-TV, an ABC affiliate, six-thirty Pacific time, Reynolds moderating, Lawrence and Clark asking; the coalition government at Saigon; McCarthy on housing out of the ghettos, Kennedy: "I don''t want to have them moved"; not "the one debate"). Order: after [[cal.1968-06-01.robert-kennedy-campaign-california|the day''s briefings]] and [[cal.1968-06-01.robert-kennedy-campaign-california-2|Lowell''s call]], by the lines (a rehearsal for the debate; "the morning of the debate") and Schlesinger (910–11: briefing sessions morning and afternoon; Lowell''s call "That Saturday morning," his word to McCarthy "Afterward," and the two together on the way to the studio). Check: CQ (1371) has Kennedy "all in favor of moving people out of the ghetto," but "a lot of these people are there and we have to do something for them there"; McCarthy for "a distribution of the races.". See [[cal.1968-05-28.elections-1968-2]]; [[cal.1968-03-14.robert-kennedy]]. Names: McCarthy, Kennedy.'
- follows: {id: cal.1968-06-01.elections-1968, add: [cal.1968-06-01.robert-kennedy-campaign-california-2, cal.1968-06-01.robert-kennedy-campaign-california]}
- edit:
    id: cal.1968-06-04.robert-kennedy-campaign-california-3
    base: bcb2caf7
    set:
      n: '[[w.schlesinger-robert-kennedy-and-his]], 913. Order: after [[cal.1968-06-04.robert-kennedy-campaign-2|Malibu]], by Schlesinger (913: Frankenheimer drives Kennedy to the Ambassador "About six-thirty"; McGovern calls "in mid-evening") and Witcover (254: the arrival "shortly after 7 P.M."). To check: George McGovern, interview by Jean Stein, Sept. 25, 1968, 12, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 913 n.58); [[w.vanden-heuvel-on-his-own]], 390–92 (Hackett''s estimate, misdated, cited by [[w.schlesinger-robert-kennedy-and-his]], 913 n.59). Names: McGovern, Robert Kennedy, Humphrey, Eugene McCarthy.'
- follows: {id: cal.1968-06-04.robert-kennedy-campaign-california-3, add: [cal.1968-06-04.robert-kennedy-campaign-2]}
- follows: {id: cal.1968-06-04.robert-kennedy-campaign-3, add: [cal.1968-06-04.robert-kennedy-campaign-california-3]}
- edit:
    id: cal.1968-06-04.robert-kennedy-campaign-california-4
    base: 2fc336f0
    set:
      n: '[[w.schlesinger-robert-kennedy-and-his]], 913. Order: after [[cal.1968-06-04.robert-kennedy-campaign-3|the talk in the bathroom]], by Schlesinger (913: the talk, then "Goodwin began calling") and Goodwin (536–38: after the talk, Goodwin on the telephone with a McCarthy supporter as Kennedy leaves for the ballroom). To check: J. K. Galbraith, interview by Jean Stein, July 30, 1968, 14, Stein Papers; Justin Feldman, interview by Roberta Greene, Feb. 4, 1970, 160–62, RFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 913 nn.61–62). See [[cal.1968-06-04.robert-kennedy-campaign-3]]. Names: Goodwin, Galbraith, Eugene McCarthy, Lowenstein.'
- follows: {id: cal.1968-06-04.robert-kennedy-campaign-california-4, add: [cal.1968-06-04.robert-kennedy-campaign-3]}
- edit:
    id: cal.1968-06-04.robert-kennedy-campaign-california-2
    base: 48d21152
    set:
      n: '[[w.thomas-robert-kennedy]], 388–89 (by O''Donnell''s account); [[w.witcover-85-days]], 257 (Kennedy telephones O''Donnell in Washington on a strategy meeting for which O''Donnell was flying out the next morning; O''Donnell: it looked as though he would be nominated; Kennedy: "I think I may"; O''Donnell later: "He had arrived ... as Robert Kennedy"). Thomas cites Lester and Irene David, 316 (477), not read. Order: after [[cal.1968-06-04.robert-kennedy-campaign-california-6|McCarthy''s interview with Schoumacher]], by Witcover (256–57: "First it was McCarthy"; then Kennedy''s turn, his putting off the television people, and the call to O''Donnell). See [[cal.1968-06-04.robert-kennedy]]. Names: Robert Kennedy, O''Donnell.'
- follows: {id: cal.1968-06-04.robert-kennedy-campaign-california-2, add: [cal.1968-06-04.robert-kennedy-campaign-california-6]}
- edit:
    id: cal.1968-06-04.robert-kennedy-campaign-california-5
    base: db3fab1b
    set:
      n: '[[w.witcover-85-days]], 258–60. Order: after [[cal.1968-06-04.robert-kennedy-campaign-california-2|the call to O''Donnell]], by Witcover (257–58: the call while Kennedy puts off the television people; "Finally," the interview with Vanocur; "Then" Mudd). Names: Robert Kennedy, McCarthy, Humphrey.'
- follows: {id: cal.1968-06-04.robert-kennedy-campaign-california-5, add: [cal.1968-06-04.robert-kennedy-campaign-california-2]}
