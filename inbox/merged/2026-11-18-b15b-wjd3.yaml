        id: cal.1966-01-12.china
        when: Jan. 12
        date: '1966-01-12'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy: strong protest at the Indian government''s long confinement and ill-treatment of many peaceable, law-abiding overseas Chinese in India. It repeats two demands: the release at once of all those held in camps and prisons, the return of their property and compensation for their losses; and an end to all discrimination and persecution of Chinese in India, with sure safety of their persons, lives and property.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 80 (Jan. 12, 1966).'
        tags: [polity:prc, polity:india]
        src:
          c: 603f80ed
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 80: all'
