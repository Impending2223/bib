        date: '1966-03-19'
        thread: china
        also: [africa]
        c: The Chinese embassy in Ghana's two notes, of Mar. 6 and 19, to the Ghanaian Foreign Ministry reject Ghana's notes of Mar. 4 and 16 accusing China of "deliberate interference" in Ghana's affairs. The Chinese military experts, like the economic and technical experts, were sent at the Ghanaian government's request under the two countries' agreements, and have always worked as Ghana arranged; the charges have no basis, and are Ghana's attempt to shift the blame for its unreasonable expulsion of Chinese diplomats and tearing up of the cooperation agreement. The embassy lodges the strongest protest.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 90 (Mar. 19, 1966).'
