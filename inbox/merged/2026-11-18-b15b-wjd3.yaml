        date: '1967-09-05'
        thread: china
        also: [soviet-union]
        c: 'The Chinese embassy in Mongolia''s note to the Mongolian Foreign Ministry: strong protest at Mongolia''s refusing China''s draft of the 1967 plan under the cultural cooperation agreement and one-sidedly dropping the talks on it, which cuts off the two countries'' cultural exchange, worsens relations and wrecks the peoples'' traditional friendship.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 172–173 (Sept. 5, 1967).'
