      item: '[[w.zhonghua-renmin-gongheguo-waijiao]], 61 (Oct. 6–20, 1965; Phạm Văn Đồng''s delegation, Oct. 6 to 20; Mao and Liu Shaoqi receive it; Zhou, Chen Yi and Luo Ruiqing hold talks)'
