        when: Aug. 20
        date: '1969-08-20'
        thread: china
        c: The Chinese Red Cross replies to the president of the Turkish Red Crescent, host of the 21st International Red Cross Conference, Reşit Çelçeri, in strong protest at the International Red Cross Standing Commission's "two Chinas" plot, run by the U.S. It says the Chinese Red Cross is China's only national Red Cross body and a full member of the International Red Cross, and that the Chiang clique and its "Red Cross" have no right to the conference. It decides to refuse to attend and will not be bound by, or owe any duty under, any of the conference's resolutions.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 220–221 (Aug. 20, 1969). Check: the president''s name, from the Chinese 理查·杰尔切尔.'
