        c: The Foreign Ministry's statement condemns the provocation of Thai armed forces' illegal entry into Cambodia's Battambang province and laying of mines, with Cambodian soldiers killed and wounded. China fully backs the stand in the Cambodian government's statement of Oct. 6 and Cambodia's just struggle to defend its sovereignty and territorial integrity.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 131 (Oct. 16, 1966).'
