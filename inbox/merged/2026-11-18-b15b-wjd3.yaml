        date: '1965-04-19'
        thread: china
        also: [japan]
        c: 'The China Council for the Promotion of International Trade and the Hokushinetsu economic friendship mission from Japan sign a joint statement, at Beijing: the "Yoshida letter" must be annulled and Sino-Japanese trade not obstructed.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 23 (Apr. 19, 1965).'
