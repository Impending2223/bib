        thread: china-leadership
        also: [africa]
        c: 'Chen Yi, at the Tanzanian embassy''s National Day reception, on Africa: the anti-imperialist revolutionary struggle is going deeper, but imperialism will not leave by itself; it presses control and aggression, interference and subversion, and plots coup after coup. It must be driven, and beaten down; the African peoples want revolution and full liberation.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 99 (Apr. 26, 1966). Names: Chen Yi.'
        tags: [polity:prc, polity:tanzania, name:chen-yi]
