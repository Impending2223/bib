        also: [south-asia]
        c: Foreign Ministry note to the Indian embassy, rejecting India's note of Sept. 24 defending the Indian army's incursion east of Dumuqielie in the western sector of the Sino-Indian border, and again demanding that India stop all incursions and provocations and not repeat them. The note says Indian troops and aircraft have violated Chinese territory and airspace over 300 times; the losses must be made good by India.
