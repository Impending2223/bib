        when: Oct. 2
        date: '1965-10-02'
        thread: china-leadership
        also: [south-asia]
        c: 'Liu Shaoqi answers President Ayub Khan''s letter: in this armed conflict between India and Pakistan, right and justice are on Pakistan''s side; Pakistan was attacked; its resistance is glorious and its cause just; the Chinese people and the just states and peoples of the world sympathize with and support it and condemn India''s aggression. Aggressor and victim must not be confused; China will back the victim and oppose the aggressor; the friendship of the two peoples will stand the test.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 59 (Oct. 2, 1965). Names: Liu Shaoqi, Ayub Khan.'
