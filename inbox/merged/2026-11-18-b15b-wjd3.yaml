  - add:
      entry:
        id: cal.1966-05-03.china-leadership-3
        when: May 3
        date: '1966-05-03'
        thread: china-leadership
        c: 'Chen Yi, at the cocktail party of the National Committee of the CPPCC for visiting overseas Chinese, compatriots of Hong Kong and Macao and the peoples'' delegations: the whole country, with confidence, is building the homeland by self-reliance, and no force can stop it. The time when the Chinese could not hold up their heads before foreigners is gone for good. To Western opinion that China is "isolated" and its foreign policy has "failed": China''s policy is right, it has not failed, it has more friends each day; as foreign minister he has no sense of isolation.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 101 (May 3, 1966). Names: Chen Yi.'
        tags: [polity:prc, name:chen-yi]
        src:
          c: cd95241f
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 101: all'
  - add:
      entry:
        id: cal.1966-05-04.china
        when: May 4
        date: '1966-05-04'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy, rejecting India''s notes of Feb. 2, 3 and 8, which charged Chinese troops with entering the 20-kilometer zone on the Chinese side of the line of actual control and Longju, Che Dong and other places China had of itself left without civil check posts, against India''s word and the Colombo proposals. The note calls this baseless: those areas are Chinese; China drew its border troops back 20 kilometers in its wish to ease the border; the Colombo proposals are only a proposal, and China''s acts went far past them; India has for three years kept entering the zone and the places left unposted.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 101–102 (May 4, 1966). Check: the place names, from the Chinese 朗久 and 扯冬.'
        tags: [polity:prc, polity:india]
        src:
          c: cb3b73fe
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 101–102: all'
