        when: Aug. 10
        date: '1967-08-10'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Burmese embassy: strong protest at the savage killing by Burmese authorities of seven Chinese frontier residents in recent days. China demands that the killers be punished at once, all losses of the victims made good and their families comforted, a public apology, the prompt release of the Chinese frontier residents still held without reason, and no repeat.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 168 (Aug. 10, 1967).'
