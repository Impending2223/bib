        date: '1965-06-14'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy: serious protest at Indian troops'' illegal crossing of the China–Sikkim border on May 29 into Kangba county and their seizure of two Tibetan women. China demands the immediate return of the two, punishment of those responsible, and effective steps against a repeat.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 33 (June 14, 1965).'
        tags: [polity:prc, polity:india]
        src:
          c: dd38862d
          rows:
