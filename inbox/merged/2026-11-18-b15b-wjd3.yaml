  - add:
      entry:
        id: cal.1965-09-16.china
        when: Sept. 16
        date: '1965-09-16'
        thread: china
        also: [south-asia]
        c: Foreign Ministry note to the Indian embassy, a sharp condemnation of Indian incursions and provocations on the Sino-Indian and China–Sikkim borders. It demands that India within three days dismantle all its aggressive works on the Chinese side of the Sikkim border and astride the line, stop at once every incursion on both borders, return the border people taken and the livestock seized, and not repeat. Otherwise India bears all the grave consequences. The note says China's staying out of the India–Pakistan dispute does not mean it asks nothing of right and wrong, nor that it agrees to the denial of the Kashmiris' right of self-determination, nor to India's attack on Pakistan on the pretext of Kashmir.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 53 (Sept. 16, 1965).'
        tags: [polity:prc, polity:india, polity:pakistan]
        src:
