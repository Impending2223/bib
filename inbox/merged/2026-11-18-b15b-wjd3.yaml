      item: '[[w.zhonghua-renmin-gongheguo-waijiao]], 170 (Aug. 29–Sept. 6, 1967; the joint delegation, Aug. 29 to Sept. 6; Zhou receives it; Li Xiannian''s talks; the Tanzania–Zambia railway agreement)'
