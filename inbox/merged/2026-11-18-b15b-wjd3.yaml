  - add:
      entry:
        id: cal.1965-10-18.china
        when: Oct. 18
        date: '1965-10-18'
        thread: china
        also: [indonesia]
        c: 'Foreign Ministry note to the Indonesian embassy: strong protest at the extremely grave incident of the afternoon of Oct. 16, when Indonesian armed forces fired on and searched the commercial counsellor''s office of China''s embassy and threatened and insulted Chinese diplomats. Since Oct. 1 slander and smear of China, and threats and intimidation of Chinese missions, have gone on in Indonesia, with the government letting them be; an anti-Chinese wave is beginning there, and unchecked, the results will be grave.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 62 (Oct. 18, 1965).'
        tags: [polity:prc, polity:indonesia]
        src:
          c: 6191616e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 62: all'
  - add:
      entry:
        id: cal.1965-10-18.china-2
        when: Oct. 18
        date: '1965-10-18'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy, answering India''s note of Sept. 27: on Sept. 26 three Indian soldiers crossed the Dongju La pass on the China–Sikkim border into China and were arrested on the spot by Chinese troops; China protested on Sept. 27. India, in a note of the same day, did not admit its error but charged China''s troops with seizing three Indian soldiers across the line, and protested; China rejects the protest. The three, it says, confessed they were sent by their superiors to spy, and were taken after the Chinese guards'' warning on the spot.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 62 (Oct. 18, 1965).'
        tags: [polity:prc, polity:india]
        src:
          c: 3f1b8ea1
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 62: all'
  - add:
      entry:
        id: cal.1965-10-20.china
        when: Oct. 20
        date: '1965-10-20'
        thread: china
        also: [laos]
        c: The Foreign Ministry's statement firmly supports the Cambodian government's most serious protest at the strafing of Batu village by U.S. and South Vietnamese aircraft. On Oct. 5 they strafed the village, in Svay Rieng province, three times, killing 7, wounding 6 and burning many houses. China warns the U.S. and South Vietnam to stop their provocation of Cambodia at once.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 62–63 (Oct. 20, 1965).'
        tags: [polity:prc, polity:cambodia, polity:us, polity:rvn]
        src:
