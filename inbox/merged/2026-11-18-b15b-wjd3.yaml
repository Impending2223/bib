  - add:
      entry:
        id: cal.1966-01-27.china
        when: Jan. 27
        date: '1966-01-27'
        thread: china
        also: [south-asia]
        c: Foreign Ministry note to the Indian embassy, rejecting India's three notes of Nov. 26 and 27 and Dec. 14, 1965. In recent months India has stepped up incursions and several times started armed clashes, the most prominent three at Demchok in the western sector of the Sino-Indian border, in the Laigoqiao area in the east and at the Dhaji pass on the China–Sikkim border; China protested each, and India instead protested in its notes. If India goes on over these clashes, China will no longer take notice.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 81–82 (Jan. 27, 1966). Check: the place names, from the Chinese.'
        tags: [polity:prc, polity:india]
        src:
          c: 749aa29d
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 81–82: all'
  - add:
      entry:
        id: cal.1966-01-30.china-leadership-2
        when: Jan. 30
        date: '1966-01-30'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: Liu Shaoqi writes in answer to President Hồ Chí Minh's letter of Jan. 24, which strongly condemned the U.S. war in Vietnam; China firmly supports the Vietnamese stand. To settle the question the U.S. must act on the four points of the Vietnamese government, stop its aggression, withdraw its forces from the South, accept the National Liberation Front as the one true representative of the South's people, and let the Vietnamese settle their own affairs.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 82 (Jan. 30, 1966). Names: Liu Shaoqi, Hồ Chí Minh.'
        tags: [polity:prc, polity:drv, name:liu-shaoqi, name:ho-chi-minh]
        src:
          c: afdc0691
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 82: all'
  - add:
      entry:
        id: cal.1966-02-01.china
        when: Feb. 1
        date: '1966-02-01'
        thread: china
        also: [europe-and-the-alliance-britain]
        c: 'Foreign Ministry note to the British chargé d''affaires'' office: strong protest at Britain''s letting the U.S. aircraft carrier *Enterprise* and the nuclear-powered *Bainbridge* gather at Hong Kong. The note stresses that U.S. war preparations at Hong Kong bode grave consequences for it; Britain must stop them at once and end Hong Kong''s use as a base for U.S. aggression.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 82 (Feb. 1, 1966).'
        tags: [polity:prc, polity:uk, polity:us]
        src:
          c: 0d3b178a
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 82: all'
  - add:
      entry:
        id: cal.1966-02-02.china
        when: Feb. 2
        date: '1966-02-02'
        thread: china
        also: [vietnam-hanoi]
        c: The Foreign Ministry's statement condemns the U.S. resumption of bombing of Vietnam. After its "bombing pause" the U.S. ordered bombing resumed Jan. 31 and at the same time put a "proposal" on Vietnam to the U.N. Security Council, in order to go on with its peace-talk plot through the U.N. The Vietnamese Foreign Ministry's statement of Feb. 1 condemned the bombing of the North and opposed the U.S. use of the U.N. to meddle; the Chinese government and people fully back the Vietnamese stand.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 82–83 (Feb. 2, 1966).'
        tags: [polity:prc, polity:drv, polity:us]
        src:
          c: d6b45226
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 82–83: all'
  - cite:
      id: cal.1966-02-02.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao]], 83 (Feb. 2, 1966; the departing ambassador Camara Mamadi; the bombing resumed after the 37-day pause)'
