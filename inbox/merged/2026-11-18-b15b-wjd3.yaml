        date: '1965-09-14'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy: protest at the Indian government''s forced closing and takeover of the Bank of China''s Calcutta branch and Bombay office, and its refusal for two years and ten months to return all the bank''s assets in India it seized. China calls it a rare international wrong, and demands compensation for all its losses and a clear reply.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 52 (Sept. 14, 1965).'
        tags: [polity:prc, polity:india]
        src:
