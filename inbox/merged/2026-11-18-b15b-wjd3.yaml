        when: Aug. 11
        date: '1967-08-11'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Burmese embassy: from October 1966 to July 1967 Burmese troops and aircraft have gone on entering the Yunnan region of China to scout, harass and wreck, gravely violating Chinese territory and airspace, menacing the peace of the border and repeatedly making military provocation. China protests strongly to the Burmese government.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 168 (Aug. 11, 1967).'
        tags: [polity:prc, polity:burma]
        src:
