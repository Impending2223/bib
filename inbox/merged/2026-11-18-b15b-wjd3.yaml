        date: '1966-05-12'
        thread: china
        also: [vietnam-hanoi]
        c: The spokesman of the Ministry of National Defense says U.S. fighter planes entered the airspace of the northeast of Maguan, in Yunnan, and made a sudden attack on a Chinese aircraft in training flight. He sternly condemns the U.S. war provocation and makes the strongest protest.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 103 (May 12, 1966).'
        tags: [polity:prc, polity:us]
        src:
