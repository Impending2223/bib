  - cite:
      id: cal.1966-08-31.china-leadership-4
      item: '[[w.zhonghua-renmin-gongheguo-waijiao]], 124 (Aug. 28–Sept. 20, 1966; Mouyabi''s parliamentary delegation, Aug. 28 to Sept. 20; Zhu De receives it and gives a banquet; Mao, Dong Biwu and Zhou each receive it)'
      units: all
  - add:
      entry:
        id: cal.1966-09-05.china
        when: Sept. 5
        date: '1966-09-05'
        thread: china
        also: [indonesia]
        c: 'Foreign Ministry note to the Indonesian embassy: the first Chinese ship to bring home the victimized overseas Chinese who wish to return will reach the port of Belawan, Medan, about Sept. 20. China puts five demands: stop the persecution and free all those held; take the Chinese home in successive batches from Jakarta, Surabaya, Makassar and other ports; guarantee the safety of the ships and crews; settle the matter by representatives of the two governments, with the consul general, Xu Ren, and consuls going to Medan at once to arrange the first lot; and guarantee the returnees'' safe passage, easy exit and right to take their property and funds.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 124–125 (Sept. 5, 1966).'
        tags: [polity:prc, polity:indonesia]
        src:
          c: 0a0f27c9
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 124–125: all'
  - add:
      entry:
        id: cal.1966-09-05.china-2
        when: Sept. 5
        date: '1966-09-05'
        thread: china
        also: [vietnam-hanoi]
        c: The spokesman of the Ministry of National Defense makes the strongest protest at the attack by U.S. military aircraft at dawn on Aug. 29 on small Chinese cargo boats on their regular route in the Gulf of Tonkin, which sank one, damaged one and killed or wounded 16 crew. He calls it another blood debt of the U.S. to the Chinese people.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 125 (Sept. 5, 1966).'
        tags: [polity:prc, polity:us]
        src:
          c: ee8cdd61
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 125: all'
  - add:
      entry:
        id: cal.1966-09-07.china
        when: Sept. 7
        date: '1966-09-07'
        thread: china
        c: Wang Kuo-ch'uan, China's ambassador to Poland, after the 131st U.S.–China ambassadorial meeting, issues a statement publishing his main speech at the meeting, because the U.S. government has again broken the agreement of the two sides by disclosing, one-sidedly, what is said at the talks. He stresses that for 17 years the U.S. has pursued hostility and aggression against China, with ever bolder military provocation and war threats, and now draws its military ring tighter, treating the Chinese people as its chief enemy; its talk of "easing" relations is worthless. The Chinese people will liberate Taiwan and, with the world's peoples, smash any U.S. plot of aggression. He restates China's resolve to back the Vietnamese struggle.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 125–126 (Sept. 7, 1966). Names: Wang Kuo-ch''uan.'
        tags: [polity:prc, polity:us, name:wang-kuo-chuan]
        src:
          c: 38d94bb1
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 125–126: all'
  - add:
      entry:
        id: cal.1966-09-12.china
        when: Sept. 12
        date: '1966-09-12'
        thread: china
        also: [indonesia]
        c: 'Foreign Ministry note to the Indonesian embassy: it asks that Chinese consular officials go to Medan quickly and that Indonesia reply fully and soon to the demands in China''s note of Sept. 5. The shipping home of the victims touches the two states'' relations and must be settled by officials of both; consuls going to Medan to organize the shipping, handle passports and visas and look after the ships have a right no one may take, wholly in line with international usage. Indonesia has agreed to the ships, yet blocks the consuls, which can only be read as making difficulties on purpose.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 126 (Sept. 12, 1966).'
        tags: [polity:prc, polity:indonesia]
        src:
          c: bea6a8c1
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 126: all'
  - add:
      entry:
        id: cal.1966-09-15.china
        when: Sept. 15
        date: '1966-09-15'
        thread: china
        also: [south-asia]
        c: Foreign Ministry note to the Indian embassy, flatly rejecting India's note of July 18, which charged and protested over broadcasts by Chinese border guards. The guards at the Nathu La pass on the China–Sikkim border broadcast on Chinese soil, to speak for Sino-Indian friendship and set out the truth on the border, wholly within China's sovereignty, which no outsider may touch. China holds to the Five Principles and, a socialist state, does not interfere in others' affairs.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 126–127 (Sept. 15, 1966).'
        tags: [polity:prc, polity:india]
        src:
          c: b9b34375
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 126–127: all'
  - add:
      entry:
        id: cal.1966-09-17.china
        when: Sept. 17
        date: '1966-09-17'
        thread: china
        also: [indonesia]
        c: 'The Chinese embassy in Indonesia''s note to the Indonesian Foreign Ministry: on Sept. 17 Indonesia''s Foreign Ministry told the consul general, Xu Ren, that it agreed only to one vice-consul going to Medan for the return of the victimized Chinese. With the first Chinese ship already on its way, and the work urgent, the embassy decides as an emergency step to fly the vice-consul, Wen Shuming, with the interpreter Liu Xinsheng, to Medan at once, and asks for their safety and every facility. China still holds it very necessary that Xu Ren and others go.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 127 (Sept. 17, 1966). Check: the names, from the Chinese 闻叔明 and 刘新生.'
        tags: [polity:prc, polity:indonesia]
        src:
          c: 2f9060fd
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 127: all'
  - add:
