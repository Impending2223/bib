        when: Apr. 5
        date: '1965-04-05'
        thread: china
        also: [japan]
        c: 'The Liao Chengzhi office cables the Takasaki Tatsunosuke office: the contract of Nov. 6, 1964, between Hitachi Zosen and the China Machinery Import and Export Corporation for a 10,000-ton freighter lapsed Mar. 31, because the Japanese government, openly bound by the "Yoshida letter", never approved Export-Import Bank funds for it. The harm to "memorandum trade" is very bad, and the Japanese government must bear all the responsibility. The editors explain the letter: in 1964 Japan''s rulers, following U.S. hostility to China, limited loans to the mainland to private commercial banks and barred Export-Import Bank funds for plant exports.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 18–19 (Apr. 5, 1965). Names: Takasaki Tatsunosuke.'
