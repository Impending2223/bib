        when: May 13
        date: '1966-05-13'
        thread: china-leadership
        also: [middle-east]
        c: 'Chen Yi, receiving Morocco''s ambassador, Filali, on the third non-aligned conference: the two earlier ones show that a third, unless anti-imperialism and anti-colonialism are its main business, in today''s world situation, would do doubtful good. Without support for the Vietnamese people against the U.S. war it would have no meaning, would reach nothing even if held, and might be used by the U.S.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 103–104 (May 13, 1966). Made public: 2002. Names: Chen Yi.'
        tags: [polity:prc, polity:morocco, name:chen-yi, vis:only:prc+morocco]
