        when: Feb. 28
        date: '1966-02-28'
        thread: china
        also: [africa]
        c: 'The Chinese embassy in Ghana''s note to the Ghanaian Foreign Ministry: strong protest at the beating, on Feb. 27, of the embassy''s staff and of Chinese experts. It asks the Ghanaian authorities to investigate, punish those responsible, protect all embassy staff and experts, and ensure no repeat. (The editors note that on the early morning of Feb. 24 part of Ghana''s army made a coup and took over the government.)'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 87 (Feb. 28, 1966).'
        tags: [polity:prc, polity:ghana]
        src:
          c: 93bff291
