        when: July 3
        date: '1966-07-03'
        thread: china
        also: [vietnam-hanoi]
        c: The government's statement gives the strongest condemnation of the continued U.S. bombing of Hanoi and Haiphong. The U.S. long ago tore up the Geneva agreements and broke the line between South and North, and by bombing the capital breaks it further, and it must bear all the results. China has always given Vietnam every possible political, moral and material support, and now, with the U.S. war in a new and graver stage, this support is free of every restraint and limit; China will take whatever action it thinks needed, by the Vietnamese people's interest and request. "The U.S. widening of the war has no limit; China's aid to Vietnam against the U.S. has no limit."
