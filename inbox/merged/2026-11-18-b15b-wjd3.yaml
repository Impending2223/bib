        c: A responsible official of the Soviet and East European department asks the Soviet embassy's chargé d'affaires, Burlin, to call and makes a strong protest at the Soviet side's pasting anti-Chinese slogans and articles on the news photo window newly built at the Chinese embassy in the Soviet Union. The Soviet demand, with threats, that the embassy take down a window on its own ground is, he says, a new anti-Chinese provocation; the embassy's right to show photographs there is sacred, and the Soviet side must not touch it.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 172 (Sept. 4, 1967). Check: the chargé''s name, from the Chinese 卜烈仁.'
