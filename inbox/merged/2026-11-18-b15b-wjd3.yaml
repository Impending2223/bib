        c: The Foreign Ministry's statement makes the strongest protest at the savage beating and detention on May 21, by Mongolian armed police and plainclothes agents at the Ulan Bator railway station, of embassy and Xinhua staff and Chinese residents who came to see off three Chinese teachers unreasonably expelled. It demands that Mongolia admit its error in public, release at once all the Chinese held, guarantee the diplomatic privilege of Chinese staff and the rights and safety of Chinese in Mongolia and no repeat, and punish the killers and instigators, with compensation for all China's losses.
