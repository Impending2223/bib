      entry:
        id: cal.1966-06-02.china-leadership-3
        when: June 2
        date: '1966-06-02'
        thread: china-leadership
        also: [south-asia]
        c: 'Chen Yi, receiving Pakistan''s ambassador, Raza, on the Tashkent conference: the Soviet Union, the U.S. and Britain use the "spirit of Tashkent" to hold down India and press Pakistan, and would use it on Vietnam, the Middle East and Cuba, to help the aggressor and strike the victim. Kashmir cannot be settled by it, and Kosygin was refused by Nasser at Cairo when he urged it on the Middle East. China does not recognize it and will help Pakistan not to be bound by it. (The editors'' note explains Tashkent.)'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 106–107 (June 2, 1966). Made public: 2002. Names: Chen Yi.'
