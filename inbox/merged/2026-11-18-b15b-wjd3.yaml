        also: [middle-east]
        c: 'Zhou cables the UAR''s President Gamal Abdel Nasser, Syria''s head of state Nur al-Din al-Atasi and the PLO''s chairman Ahmad Shukairy: Israel, urged on and backed by the U.S., has by surprise attack on Cairo, the Suez Canal, Gaza and other areas begun a war of aggression on Syria and all the Arab states and peoples. China has always prized the Arab peoples'' anti-imperialist struggle as its own and will be their faithful, reliable comrade-in-arms in repelling the U.S. and Israeli aggression.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 157 (June 6, 1967). Names: Zhou Enlai, Nasser, Nur al-Din al-Atasi, Shukairy.'
