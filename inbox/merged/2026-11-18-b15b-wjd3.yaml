        thread: china
        also: [africa]
        c: 'The Chinese embassy in Ghana''s note to the Ghanaian Foreign Ministry: the strongest protest at Ghana''s note of the 14th, which declares the embassy''s first secretary Hu Dingyi and two other diplomats persona non grata and gives them 48 hours to leave. The embassy states that Ghana must bear all the grave consequences.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 89 (Mar. 15, 1966).'
