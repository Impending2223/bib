        date: '1967-06-07'
        thread: china-leadership
        also: [latin-america]
        c: 'Chen Yi receives Philippine congressman Vicente Sagun, the vice-chairman of the Movement for the Promotion of Nationalism, the secretary-general José Sison, and other Philippine friends and the editors of the weekly *Free Press*. On trade, the main obstacle is the sending of Philippine troops to Vietnam; once that is gone private trade is possible, and official trade after the break with Chiang Kai-shek; the obstacle comes from the U.S. China opposes every form of "two Chinas". On Chinese in the Philippines: those who keep Chinese nationality must obey local law, and China must care for their safety; those who take local nationality are Filipinos, loyal to the local government; the imperialist charge that China uses overseas Chinese for subversion in Southeast Asia is ill-meant, since they are nationals of those states and China is not answerable for them.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 157–158 (June 7, 1967). Names: Chen Yi, Chiang Kai-shek. Check: the names, from the Chinese 文森索·萨贡, 何塞·西松, 迪奥多罗·络幸 and 尼克·华金; "the sending of Philippine troops to Vietnam" is the chronology''s wording.'
        tags: [polity:prc, polity:philippines, name:chen-yi, name:chiang-kai-shek]
        src:
          c: e8a59627
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 157–158: all'
