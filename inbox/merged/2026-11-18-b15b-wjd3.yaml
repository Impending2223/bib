        when: Jan. 8
        date: '1965-01-08'
        thread: china-leadership
        also: [europe-and-the-alliance-france]
        c: 'Chen Yi, receiving the French ambassador, Paye: the U.S. course in Southeast Asia and Indochina is meant to encircle China strategically and to wreck its construction. China, from its own interest, also favors settling the Indochina and Southeast Asia questions by peaceful means.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 1–2 (Jan. 8, 1965). Made public: 2002. Names: Chen Yi.'
        tags: [polity:prc, polity:fr, name:chen-yi, vis:only:prc+fr]
        src:
          c: 23bce49c
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 1–2: all'
