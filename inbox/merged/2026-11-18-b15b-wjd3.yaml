        date: '1966-05-09'
        thread: china
        also: [europe-and-the-alliance]
        c: Shen Weiliang, counsellor of China's chargé d'affaires' office in the Netherlands, calls on the deputy head of the Dutch Foreign Ministry's Eastern department, Claus, and says China is surprised at the Dutch justice ministry's announced expulsion of 300 overseas Chinese. The matter touches many Chinese closely; with diplomatic relations, it should be settled by consultation; China cannot agree to the one-sided, unreasonable step, and reserves the right to ask more.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 103 (May 9, 1966). Check: the names, from the Chinese 沈韦良 and 克劳斯.'
        tags: [polity:prc, polity:netherlands]
