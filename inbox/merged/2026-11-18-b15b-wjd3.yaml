        c: 'The Chinese embassy in Tunisia''s note to the Tunisian Foreign Ministry: strong protest at the Tunisian leader''s Sept. 11 interview with the French monthly *Réalités*, attacking China and its leaders. China hopes Tunisia will put friendship first and stop all words and acts that harm it.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 69 (Nov. 18, 1965).'
