        id: cal.1967-08-30.china
        when: Aug. 30
        date: '1967-08-30'
        thread: china
        also: [europe-and-the-alliance-britain]
        c: Luo Guibo urgently summons the British chargé, Hopson, and strongly protests the British government's sending large numbers of police and agents to provoke the Chinese chargé's office in Britain and other Chinese bodies, and its ordering police and thugs to beat the office's staff. He asks the British government to lift at once all its unreasonable limits on China's bodies in Britain, and stop every provocation. He announces that from that day the British office's whole staff may not leave China without the Foreign Ministry's leave and may move only between the office and their residences.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 170 (Aug. 30, 1967).'
        tags: [polity:prc, polity:uk]
