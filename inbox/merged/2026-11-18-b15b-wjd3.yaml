        when: Apr. 4
        date: '1969-04-04'
        thread: china
        also: [japan]
        c: The representatives of China's and Japan's memorandum-trade offices sign the communique of their talks at Beijing. Both sides reaffirm the three political principles and the inseparability of politics and economics, confirmed in 1968, as the principles to keep in relations and the political basis between the offices. China says the liberation of Taiwan is China's internal affair, and the Chinese people will liberate it; Japan agrees; Japan also states plainly that the PRC government is the sole legal government of the Chinese people, that Taiwan is an inseparable part of China, and that normal relations must rest on that and oppose every "two Chinas" plot. They agree the 1969 memorandum trade.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 212–213 (Apr. 4, 1969).'
