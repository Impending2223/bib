  - add:
      entry:
        id: cal.1966-10-02.china
        when: Oct. 2
        date: '1966-10-02'
        thread: china
        also: [laos]
        c: Chen Yi writes in reply to Phoumi Vongvichit, general secretary of the Lao Patriotic Front party, minister in the government of national union and member of the national commission for carrying out the 1962 Geneva agreement on Laos, supporting for the Chinese government and people the stand in the party central committee's statement of Aug. 29. (The editors say the statement condemned U.S. aggression and interference in Laos and its plot to widen the war in Indochina, and exposed and condemned the British government and the International Commission for Laos for serving the U.S. and slandering the DRV and the party.) The reply says Britain and the Soviet Union, the co-chairmen, have all along tolerated and covered for the Commission; China holds the party's position that any activity in the Commission's name is wholly illegal and void to be fully correct.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 128–129 (Oct. 2, 1966). Names: Chen Yi, Phoumi Vongvichit.'
        tags: [polity:prc, polity:pathet-lao, name:chen-yi, name:phoumi-vongvichit]
        src:
