        when: May 14
        date: '1965-05-14'
        thread: china
        also: [testing]
        c: Xinhua issues the press communique on the success of China's second atomic bomb test. It says China develops nuclear arms wholly for defense; China will never be the first to use them; the Chinese people sincerely hope nuclear war never comes; the government and people will go on, with all the peace-loving countries and peoples, to strive for the complete prohibition and thorough destruction of nuclear weapons.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 28 (May 14, 1965).'
        tags: [polity:prc]
        src:
          c: b5af5251
          rows:
