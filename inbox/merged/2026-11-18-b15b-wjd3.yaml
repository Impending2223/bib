        date: '1967-07-21'
        thread: china
        also: [europe-and-the-alliance-britain]
        c: 'The Foreign Ministry''s information department, by authority, summons Reuters'' correspondent in Beijing, Grey, and solemnly announces that, since Britain is illegally persecuting Xinhua''s Hong Kong reporters and other patriotic journalists, the Chinese government has decided to restrict his freedom: he may not leave his residence without leave and is to await disposal.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 167 (July 21, 1967). Check: the correspondent''s name, from the Chinese 格雷.'
