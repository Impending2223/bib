      entry:
        id: cal.1965-11-25.china-leadership-4
        when: Nov. 25
        date: '1965-11-25'
        thread: china-leadership
        also: [japan]
        c: 'Mao, at Shanghai, receives the 15 Japanese youth delegations and other Japanese friends of the great Sino-Japanese youth friendship gathering. Mao: the Japanese people and the Chinese are quite likely to unite against the common enemy. There are two movements in the world now: one is the Japanese and Chinese joining against the common enemy; the other is imperialism and its friends joining against China, and not only the Chinese people but the Japanese too.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 71–72 (Nov. 25, 1965). Made public: 2002. Names: Mao Zedong.'
        tags: [polity:prc, polity:japan, name:mao-zedong, vis:only:prc+japan@B-D]
        src:
          c: b57613b4
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 71–72: all'
