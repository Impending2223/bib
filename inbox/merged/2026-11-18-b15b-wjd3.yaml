        when: June 11
        date: '1966-06-11'
        thread: china
        also: [africa]
        c: 'The Chinese embassy in Kenya''s note to the Kenyan Foreign Ministry: serious protest at the steady anti-Chinese clamor of some Kenyan ministers, who charge China with interference. China, the note says, has always held to five principles in its dealings with African states and never interferes; the embassy has strictly kept to them. The ministers'' words and acts wreck normal relations and can only meet imperialism''s need.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 109 (June 11, 1966).'
