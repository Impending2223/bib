  - add:
      entry:
        id: cal.1965-09-20.china-leadership
        when: Sept. 20
        date: '1965-09-20'
        thread: china-leadership
        also: [south-asia]
        c: 'Chen Yi talks with Afghanistan''s prime minister, Yusuf, at Kabul airport. On the India–Pakistan war: both are Asian and China would not take sides, but India would not dare act without U.S., British and Soviet backing. Only after Pakistan''s request for help from the U.S. and Britain was refused did China give support, for humanity''s sake, and take limited action to hold India back and stop the conflict widening.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 54 (Sept. 20, 1965). Made public: 2002. Names: Chen Yi.'
        tags: [polity:prc, polity:afghanistan, polity:pakistan, polity:india, name:chen-yi, vis:only:prc+afghanistan@B-C]
        src:
          c: c4e96597
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 54: all'
  - add:
      entry:
        id: cal.1965-10-13.china-leadership
        when: Oct. 13
        date: '1965-10-13'
        thread: china-leadership
        also: [laos]
        c: 'Chen Yi, at the banquet at Kunming welcoming Prince Sihanouk: Sino-Cambodian friendship is for the common fight against imperialism, for world peace, for the peaceful coexistence of states of different systems, for justice and human progress; aid has always been mutual. Cambodia''s call in the U.N. to expel the Kuomintang clique and restore China''s seat, and its support for China''s recovery of Taiwan and the coastal islands, are its greatest aid to China; the Prince''s just words in the world forum are its greatest support, which no economic figure can measure.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 55 (Oct. 13, 1965). Names: Chen Yi, Sihanouk.'
        tags: [polity:prc, polity:cambodia, name:chen-yi, name:norodom-sihanouk]
        src:
          c: be4d4adb
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 55: all'
  - add:
      entry:
        id: cal.1965-09-24.china
        when: Sept. 24
        date: '1965-09-24'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy, answering India''s note of Sept. 21: India has withdrawn the invading troops within the time China set and razed part of the aggressive works; Chinese border troops now fully control the scene and hold much evidence; to go on denying and quibbling would only lose India face before the world. China is a reasonable, principled state; it will never commit aggression nor let others do so; it will oppose aggressors and support the victims.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 56 (Sept. 24, 1965).'
        tags: [polity:prc, polity:india]
        src:
          c: 62eaeaaf
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 56: all'
  - add:
      entry:
        id: cal.1965-09-26.china
        when: Sept. 26
        date: '1965-09-26'
        thread: china
        c: The Foreign Ministry's statement strongly protests the International Red Cross Standing Commission's invitation of a delegation of the Kuomintang clique and its so-called Red Cross to the coming 20th International Red Cross Conference, against China's and the Chinese Red Cross's repeated protests, in step with the U.S. plot for "two Chinas". The Chinese government will send no delegation and will cut all ties with the Commission.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 56 (Sept. 26, 1965).'
        tags: [polity:prc, polity:roc]
        src:
          c: c1fb5b24
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 56: all'
