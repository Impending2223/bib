        when: May 2
        date: '1965-05-02'
        thread: china
        also: [laos]
        c: 'The government''s statement supports the Cambodian government''s statement of May 1 on its three conditions for an international conference on Cambodia: a conference in the manner of the 1954 Geneva Conference on Indochina, not the 1961–62 one on Laos; no Saigon government at it; no bringing Vietnam and Laos into the talk of Cambodia. (The editors'' note gives the three conditions.) China fully endorses and firmly supports the stand.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 25 (May 2, 1965).'
