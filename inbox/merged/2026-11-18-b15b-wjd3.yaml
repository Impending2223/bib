        when: Nov. 25
        date: '1965-11-25'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy: in its habitual humanitarian spirit the Chinese government agrees that India may come, at the time and place named, to take back the bodies of the 3 Indian soldiers killed in the Nov. 24 incursion and to claim the 3 Indian soldiers captured in the Sept. 26 incursion. The note warns India to learn from these incursions and stop all aggression against China.'
