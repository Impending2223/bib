        when: Oct. 22
        date: '1966-10-22'
        thread: china
        also: [indonesia]
        c: 'The Chinese embassy in Indonesia''s note to the Indonesian Foreign Ministry: serious protest at the Indonesian local authorities'' announcing a "takeover" of the Chinese consulate at Medan. The consulate, after repeated attacks and wrecking, with its staff in danger and its duty limited, was forced to close for a time; China will not let Indonesia deny its existence one-sidedly and strip and infringe the consul''s privileges.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 133 (Oct. 22, 1966).'
        tags: [polity:prc, polity:indonesia]
        src:
          c: cf891fc0
          rows:
