  - add:
      entry:
        id: cal.1966-09-21.china
        when: Sept. 21
        date: '1966-09-21'
        thread: china
        also: [indonesia]
        c: A responsible Foreign Ministry official summons Indonesia's chargé d'affaires in great urgency and says that on Sept. 20 Indonesia's Foreign Ministry sent the Chinese embassy a memorandum refusing to let Chinese consular officers go to Medan and taking back its Sept. 17 promise on the vice-consul. This, China says, denies the officers their normal duty, a grave act; the official gives the chargé a memorandum demanding that Indonesia change its stand and arrange the consular officers' journey. (The editors add that after repeated representations Indonesia's Foreign Ministry agreed on the 24th to the vice-consul's going.)
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 127–128 (Sept. 21, 1966).'
        tags: [polity:prc, polity:indonesia]
        src:
          c: '35085070'
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 127–128: all'
  - add:
