        when: Sept. 1
        date: '1967-09-01'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Burmese embassy: from concern for the overseas Chinese and to protect their rights, China decides to send an investigation and condolence mission from the Overseas Chinese Affairs Commission, for the Chinese government and people, carrying relief goods, to Burma in mid-September. It asks the Burmese government for a quick answer and arrangements.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 171 (Sept. 1, 1967).'
        tags: [polity:prc, polity:burma]
        src:
