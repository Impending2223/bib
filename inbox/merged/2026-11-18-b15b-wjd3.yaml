        c: Liu Shaoqi receives Guillermo del Pedregal, Chile's former vice-president and chairman of the Friends of People's China Committee, and his wife. Liu welcomes trade offices on both sides and longer-term trade in set quantities; China is interested in Chilean uranium and nitrates, and hopes Chile will buy some Chinese goods.
