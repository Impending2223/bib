      entry:
        id: cal.1966-03-03.china
        when: Mar. 3
        date: '1966-03-03'
        thread: china
        also: [africa]
        c: 'The Chinese embassy in Ghana''s note to the Ghanaian Foreign Ministry: strong protest at Ghana''s unreasonable demand to withdraw the Chinese experts and cut the embassy''s staff, a grave act tearing up the China–Ghana economic and technical cooperation agreement. The embassy says Ghana must bear all the responsibility for breaking the agreement and for the economic loss.'
