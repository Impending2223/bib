        when: Sept. 26
        date: '1965-09-26'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy, a strong protest at a mob that came to the Chinese embassy in New Delhi on the afternoon of Sept. 24, led by Indian officials and Congress leaders and driving a flock of sheep, shouting that China would start a world war for a few sheep and yaks. The note says the questions between China and India are far more than a few sheep and yaks: every Indian incursion, harassment and armed provocation touches China''s sovereignty and territorial integrity. India''s government should know that everything has its limit.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 56–57 (Sept. 26, 1965).'
        tags: [polity:prc, polity:india]
        src:
