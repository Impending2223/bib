        c: A responsible official of the Foreign Ministry's information department summons the nine Japanese correspondents in Beijing and formally announces that three of them, from the *Mainichi Shimbun*, the *Sankei Shimbun* and the *Tokyo Shimbun*, must leave China by a set time.
