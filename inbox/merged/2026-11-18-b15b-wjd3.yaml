        also: [laos]
        c: Chen Yi cables Prince Souphanouvong, deputy prime minister of the Lao coalition government, in answer to his telegram of Jan. 16 on the U.S. widening of its direct military aggression in Laos. China, as a signatory of the Geneva agreements and a close neighbor of Laos, has always watched Laos closely, and has always favored reconvening the conference of the 14 signatories of the 1962 Geneva agreements to settle the Laos question peacefully.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 5 (Jan. 24, 1965). Names: Chen Yi, Souphanouvong.'
