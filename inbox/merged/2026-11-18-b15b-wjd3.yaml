        when: Jan. 10
        date: '1965-01-10'
        thread: china
        also: [indonesia]
        c: 'The Chinese government''s statement: firm support for President Sukarno''s decision, announced Jan. 7, to withdraw Indonesia from the United Nations.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 2 (Jan. 10, 1965). Names: Sukarno.'
