        when: Jan. 7
        date: '1966-01-07'
        thread: china
        also: [africa]
        c: 'The Foreign Ministry''s statement: serious protest at the Central African Republic government''s decision of Jan. 6 to break diplomatic relations with China. The act is groundless and breaks the most elementary norms of international relations; the government must bear all the responsibility. China will withdraw its embassy staff and its experts.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 79 (Jan. 7, 1966).'
        tags: [polity:prc, polity:central-african-republic]
        src:
          c: 8e5695d0
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 79: all'
