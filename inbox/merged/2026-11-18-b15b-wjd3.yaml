        when: Sept. 19
        date: '1965-09-19'
        thread: china
        also: [south-asia]
        c: 'The Foreign Ministry replies to the Indian embassy on India''s note of Sept. 7: China firmly demands that India dismantle, before midnight Sept. 22, all its aggressive works on the Chinese side of the Sikkim border and astride it, stop the incursions, return the border people and livestock, and not repeat. China fully supports the Kashmiri people''s struggle for self-determination, Pakistan''s resistance to India''s aggression, and the wish of India''s neighbors to keep their independence, neutrality and domestic affairs free of interference.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 54 (Sept. 19, 1965).'
        tags: [polity:prc, polity:india]
        src:
          c: d1ff1ac2
