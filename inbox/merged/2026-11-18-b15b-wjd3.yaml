        c: 'Foreign Ministry note to the Indian embassy: Indian invading troops crossed the China–Sikkim border at Nathu La and attacked the Chinese border troops, wounding 25 and wrecking houses and a temple. China makes the most urgent and serious protest.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 174 (Sept. 11, 1967).'
