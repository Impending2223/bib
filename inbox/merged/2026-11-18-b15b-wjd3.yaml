        date: '1965-06-19'
        thread: china
        also: [africa]
        c: China's first ambassador to Dahomey (today the People's Republic of Benin, the editors say), Li Yunchuan, presents his credentials to President Apithy. Li arrived at Cotonou June 5.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 34 (June 19, 1965). Check: names in Pinyin and Latin, from the Chinese 李云川 and 阿皮蒂.'
        tags: [polity:prc, polity:dahomey]
