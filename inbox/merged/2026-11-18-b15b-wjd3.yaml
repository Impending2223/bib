        thread: china
        also: [indonesia]
        c: 'The Chinese embassy in Indonesia''s note to the Indonesian Foreign Ministry: the strongest protest at the extremely grave attack by Indonesian thugs on the Chinese consulate at Medan, with insults to the Chinese flag, the national emblem and the country''s leaders. It asks for a public apology, the return of the flag and emblem taken, punishment of the culprits and those who set them on, and effective steps against a repeat.'
