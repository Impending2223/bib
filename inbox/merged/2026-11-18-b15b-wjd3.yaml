        also: [africa]
        c: China and the Congo (Brazzaville) sign, at Brazzaville, a protocol to their governments' agreement on economic and technical cooperation.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 33 (June 13, 1965).'
