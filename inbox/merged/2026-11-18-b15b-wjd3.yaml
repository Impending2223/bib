        thread: china-leadership
        also: [vietnam-hanoi]
        c: Zhu De, chairman of the NPC's Standing Committee, and the DRV National Assembly's Standing Committee chairman, Trường Chinh, exchange letters on the Vietnamese National Assembly's appeal to the world's parliaments. Zhu De restates his belief that Vietnam will win and the U.S. lose; China wholly endorses the four points the Vietnamese Assembly reaffirmed, and firmly supports the Vietnamese people's anti-U.S. patriotic struggle.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 28 (May 13, 1965). Names: Zhu De, Trường Chinh.'
        tags: [polity:prc, polity:drv, name:zhu-de, name:truong-chinh]
