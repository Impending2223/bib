        date: '1966-05-13'
        thread: china
        also: [vietnam-hanoi]
        c: 'The Foreign Ministry''s statement on the Thanom government''s announcement of May 3 that Thailand will send naval and air units to fight in South Vietnam: a grave step to openly joining the U.S. war in Vietnam, putting Thailand at enmity with the peoples of Indochina and Southeast Asia. China fully backs the DRV government''s stand and strongly condemns the Thai government''s provocation.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 103 (May 13, 1966).'
        tags: [polity:prc, polity:thailand, polity:drv]
        src:
