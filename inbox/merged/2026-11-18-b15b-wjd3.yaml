  - add:
      entry:
        id: cal.1965-11-04.china-2
        when: Nov. 4
        date: '1965-11-04'
        thread: china
        also: [indonesia]
        c: 'The Chinese embassy in Indonesia''s second note of the day to the Indonesian Foreign Ministry, a strong protest at the persecution of overseas Chinese going on all over Indonesia since early October: houses, schools, associations and shops burned, looted and wrecked, many Chinese summoned without cause, beaten and arrested, and portraits of China''s leaders and the Chinese flag burned and torn. The note demands punishment of those responsible, release of all those wrongly arrested, compensation, protection of the Chinese, an end to the persecution, and an apology for the burning of the portraits and flag.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 67–68 (Nov. 4, 1965).'
