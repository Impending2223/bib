        date: '1966-03-14'
        thread: china-leadership
        also: [middle-east]
        c: 'Chen Yi, at the Syrian embassy''s reception for the Mar. 8 revolution day: Syria has done much to keep national independence, grow its economy and build up the country; in world affairs its government and people oppose U.S. aggression and war policy, back national liberation, and sympathize with and support the Vietnamese people''s anti-U.S. struggle; the Chinese people admire and support this just stand. He restates firm Chinese support for the Arab and Palestinian peoples against imperialism and old and new colonialism.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 88–89 (Mar. 14, 1966). Names: Chen Yi.'
