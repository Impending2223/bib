  - add:
      entry:
        id: cal.1966-01-22.china
        when: Jan. 22
        date: '1966-01-22'
        thread: china
        also: [japan]
        c: The China Council for the Promotion of International Trade and the friendly delegation of the Japan–China Trade Promotion Association issue a joint statement condemning the widening of the U.S. war in Vietnam and the Satō government's war and aggression policy of following the U.S., its forcing through of the Japan–ROK treaty, which makes it more hostile to China and heightens tension in Asia. The two sides hold the widening of the war in Vietnam the greatest threat to peace in Asia and the world, with a great danger of dragging in not only Indochina but China and Japan.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 81 (Jan. 22, 1966).'
        tags: [polity:prc, polity:japan]
        src:
          c: '87254238'
