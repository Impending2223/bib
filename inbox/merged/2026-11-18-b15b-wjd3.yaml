        date: '1966-09-19'
        thread: china-leadership
        also: [europe-and-the-alliance]
        c: Chen Yi receives the delegation of the Austrian Federal Chamber of Commerce, led by its president, Rudolf Sallinger, who is also deputy chairman of the Austrian People's Party.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 127 (Sept. 19, 1966). Names: Chen Yi.'
        tags: [polity:prc, polity:austria, name:chen-yi]
        src:
          c: 6f44f2a4
          rows:
