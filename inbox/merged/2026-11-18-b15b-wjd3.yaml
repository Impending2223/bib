        thread: china
        also: [europe-and-the-alliance-britain]
        c: 'Foreign Ministry note to the British chargé d''affaires'' office: another strong protest at the Hong Kong British authorities'' steady provocation at the border at Man Kam To, Luofang and other places, with ever worse breaking of normal order and grave tension on the border. China asks that the British government make the authorities lift every border blockade, stop provocation and guard the border people''s safety.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 168 (Aug. 14, 1967).'
        tags: [polity:prc, polity:uk]
        src:
