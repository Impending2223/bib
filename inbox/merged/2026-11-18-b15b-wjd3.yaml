        date: '1965-06-22'
        thread: china-leadership
        also: [africa]
        c: Chen Yi arrives at Algiers at the head of the Chinese delegation to the second Afro-Asian Conference.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 35 (June 22–25, 1965; at Algiers, June 22 to 25, no days given: he calls on Boumedienne, who is satisfied with China''s support and says the conference will meet on time; he meets in turn the foreign ministers or heads of delegation of the DRV (Nguyễn Duy Trinh), North Korea (Pak Seong Cheol), Indonesia (Subandrio), the UAR (Riad), Iraq (Taleb), Cambodia (Wick), Mali (Ousmane Ba), Nepal (Bista), the Sudan (Khalil), Pakistan (Bhutto), Afghanistan''s U.N. representative (Rahman Pazhwak) and the Front''s delegate, Nguyễn Văn Hiếu, and sets out China''s stand: the conference on time, a postponement if need be). Names: Chen Yi. Check: the spellings of the ministers'' names, from the Chinese 朴成哲, 里亚德, 塔列布, 维克, 乌斯曼·巴, 比斯塔, 哈利勒, 拉幸曼·帕日瓦克; the Front''s delegate Nguyễn Văn Hiếu is the Chinese''s 阮文孝.'
