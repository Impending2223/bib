        c: Chen Yi receives a British freelance journalist and his wife and answers his questions.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 102 (May 5, 1966). Names: Chen Yi. Check: the journalist''s name, from the Chinese 吉尔德各他.'
