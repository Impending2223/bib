        when: Aug. 30
        date: '1967-08-30'
        thread: china
        also: [vietnam-hanoi]
        c: The Foreign Ministry's statement strongly condemns the recent continuous large-scale U.S. bombing of the DRV and its "bombing to force peace" plot. The Chinese people will bear the greatest national sacrifice to support the Vietnamese war of resistance with all their strength, and are resolved to fight shoulder to shoulder with the Vietnamese people to the end to defeat the U.S. aggressors.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 171 (Aug. 30, 1967).'
        tags: [polity:prc, polity:drv, polity:us]
        src:
          c: 105df2c8
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 171: all'
