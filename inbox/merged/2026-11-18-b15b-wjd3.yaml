        when: Apr. 13
        date: '1965-04-13'
        thread: china
        also: [soviet-union]
        c: The Foreign Ministry hands the Soviet embassy a memorandum protesting the Soviet authorities' unreasonable expulsion of four Chinese students, anti-U.S. demonstrators, from their Soviet schools. The real reason, it says, is to cover up the suppression of the anti-U.S. demonstration and the persecution of injured students.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 20 (Apr. 13, 1965).'
        tags: [polity:prc, polity:ussr]
        src:
          c: 2f3587ff
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 20: all'
