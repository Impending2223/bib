  - add:
      entry:
        id: cal.1965-09-29.china-leadership-5
        when: Sept. 29
        date: '1965-09-29'
        thread: china-leadership
        c: 'Chen Yi holds a press conference for Chinese and foreign journalists on the government''s foreign policy and the world situation. The U.S. war in Vietnam must end in a Vietnamese win and a U.S. loss, and the Chinese people stand unconditionally with the Vietnamese. The second Afro-Asian Conference must be well held: if it can be, China is for holding it; if not, wait till conditions are ripe. The U.N. is now a political exchange of a few great powers, ruled by the U.S., and must be thoroughly reorganized.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 58 (Sept. 29, 1965). Names: Chen Yi.'
        tags: [polity:prc, polity:us, name:chen-yi]
