        date: '1965-11-26'
        thread: china
        also: [indonesia]
        c: The Chinese embassy in Indonesia sends the Indonesian Foreign Ministry two notes, the most serious protest and the strongest protest, at persecution of overseas Chinese in Ambon in the Moluccas, South Sulawesi (the Chinese gives 万泰隆) and many places in Central Java. They demand an end to the violence, severe punishment of the instigators and of the killers of Chinese, solace for the dead's families, release of those arrested, compensation, and safety of life and property.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 72 (Nov. 26–27, 1965).'
        tags: [polity:prc, polity:indonesia]
