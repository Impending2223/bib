        thread: china
        also: [laos]
        c: The Foreign Ministry's statement condemns the U.S. for wild bombing of the liberated areas of Laos, a direct act of aggression. China hopes the Geneva Conference's co-chairmen will face the grave situation in Laos and Indochina and take real action to uphold the Geneva agreements and the peace of the region.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 4 (Jan. 20, 1965).'
