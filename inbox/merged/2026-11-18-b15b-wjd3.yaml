        thread: china
        also: [indonesia]
        c: 'Foreign Ministry note to the Indonesian embassy: the Chinese ship *Guanghua*, sent to bring back overseas Chinese, will enter Belawan on Sept. 26. The vice-consul will go to Medan at once to arrange the passage of the victims who wish to return and to look after the ship. China asks again that Indonesia meet the demands of its note of Sept. 5 and stop all obstruction.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 128 (Sept. 25, 1966).'
        tags: [polity:prc, polity:indonesia]
