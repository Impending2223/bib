  - add:
      entry:
        id: cal.1965-05-17.china
        when: May 17
        date: '1965-05-17'
        thread: china
        also: [south-asia]
        c: Foreign Ministry note to the Indian embassy flatly rejects India's "protests", in its Foreign Ministry's notes of Mar. 10 and Apr. 7, against the China–Pakistan protocol fixing the boundary between Xinjiang and the areas Pakistan actually controls and defends. China and Pakistan are neighboring sovereign states, with every right to fix their boundary by talks; the settlement serves peace on the border and good neighborly relations.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 28–29 (May 17, 1965).'
        tags: [polity:prc, polity:india, polity:pakistan]
