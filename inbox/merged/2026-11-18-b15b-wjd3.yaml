        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy: strong protest at an armed attack by Indian troops on Chinese border personnel. The note charges the Indian government with making tension on the border by arms to serve its present political needs, to oppose China.'
