        thread: china
        also: [vietnam-hanoi]
        c: The Foreign Ministry's statement supports the stand and just demands in the Vietnamese Foreign Ministry's statement of Nov. 26, which protested and accused U.S. aggression, called on all states to condemn it, and asked the U.S. to stop and withdraw from South Vietnam, leaving its people to settle their own affairs.
