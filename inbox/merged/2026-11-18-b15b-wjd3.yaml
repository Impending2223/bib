        date: '1965-04-18'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'A Beijing mass rally of all circles marks the tenth anniversary of the Bandung Conference; Liu Shaoqi, Acting Premier Deng Xiaoping and Peng Zhen attend. Peng speaks: the U.S. aggression and war adventures in Vietnam and Indochina are a grave challenge to the Bandung spirit; the Asian and African peoples must unite and firmly support the Vietnamese people''s just struggle.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 22 (Apr. 18, 1965). Names: Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
        tags: [polity:prc, polity:drv, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen]
