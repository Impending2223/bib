  - cite:
      id: cal.1966-02-09.china-leadership-3
      item: '[[w.zhonghua-renmin-gongheguo-waijiao]], 84 (Feb. 9, 1966; the departing ambassador; the U.S. sabotage of the Geneva agreements, point by point)'
      units: A
  - add:
      entry:
        id: cal.1966-02-12.china
        when: Feb. 12
        date: '1966-02-12'
        thread: china
        also: [vietnam-hanoi]
        c: 'The Foreign Ministry''s statement severely condemns the U.S. and the South Vietnamese authorities for holding the Honolulu conference to plan a wider war in Vietnam. The conference once more shows the U.S. government''s war made to look like peace; its declaration and communique are good negative teaching for the world''s peoples. It tells that the U.S. means to hold on in Vietnam, to take South Vietnam at any cost and divide it forever: the Vietnamese will not accept that, nor will the peoples of the world.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 84–85 (Feb. 12, 1966).'
        tags: [polity:prc, polity:drv, polity:us, polity:rvn]
        src:
          c: f6dee0f0
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 84–85: all'
  - add:
      entry:
        id: cal.1966-02-15.china
        when: Feb. 15
        date: '1966-02-15'
        thread: china
        also: [indonesia]
        c: 'The Chinese embassy in Indonesia''s note to the Indonesian Foreign Ministry: the strongest protest at the attack on Feb. 10 by the "Indonesian Students'' Action Front" on the Chinese consulate at Banjarmasin, and the wrecking of overseas Chinese shops and houses. The note says Indonesia has ignored China''s repeated protests, kept no promise of no repeat, and not guarded the safety of Chinese missions; the embassy, limited in what it can learn of the damage at Banjarmasin, reserves the right to ask more.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 85 (Feb. 15, 1966).'
        tags: [polity:prc, polity:indonesia]
        src:
          c: f5bc8c12
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 85: all'
  - add:
      entry:
        id: cal.1966-02-19.china
        when: Feb. 19
        date: '1966-02-19'
        thread: china
        also: [laos]
        c: The Foreign Ministry's statement strongly protests U.S. aircraft's bombing and strafing of the Chinese consulate general at Phongsaly. On the morning of Feb. 18 four U.S. jet fighter-bombers entered northern Laos, bombed and strafed the town of Phongsaly, and hit the consulate general, gravely damaging its buildings and property. It is the third time U.S. aircraft have bombed China's diplomatic offices in Laos; China expresses great indignation and strong protest.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 85 (Feb. 19, 1966).'
        tags: [polity:prc, polity:us]
        src:
          c: 39cd23ef
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 85: all'
  - add:
      entry:
        id: cal.1966-02-20.china
        when: Feb. 20
        date: '1966-02-20'
        thread: china
        also: [middle-east, vietnam-hanoi]
        c: China's chargé d'affaires in the UAR, He Gonggou, calls on the state secretary of the UAR Foreign Ministry, Shadi, and hands over, orally and as a memorandum, Zhou's message to President Nasser. The U.S. has launched a so-called "peace offensive" on Vietnam, under cover of which it hurries troops and enlarges bases to sharpen its war on the Vietnamese people. Whatever the intent, any proposal for peace talks now falls into the U.S. "peace talks" trap, helps U.S. aggression and harms the Vietnamese people's resistance. Zhou hopes Nasser will keep backing the whole Vietnamese people's struggle against U.S. armed aggression.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 85–86 (Feb. 20, 1966). Made public: 2002. Names: Zhou Enlai, Nasser. Check: when the message was first published; the officials'' names, from the Chinese 何功构 and 夏迪.'
        tags: [polity:prc, polity:uar, polity:us, vis:only:prc+uar, name:zhou-enlai, name:nasser]
        src:
          c: 721e7a65
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 85–86: all'
  - cite:
      id: cal.1966-02-24.china-leadership-2
      item: '[[w.zhonghua-renmin-gongheguo-waijiao]], 86 (Feb. 24, 1966; Liu Shaoqi''s speech at the banquet: the anti-imperialist struggle in Africa not ended)'
      units: all
  - add:
      entry:
        id: cal.1966-02-27.china
        when: Feb. 27
        date: '1966-02-27'
        thread: china
        also: [indonesia]
        c: 'Foreign Ministry note to the Indonesian embassy: the strongest protest at the savage attack by right-wing forces on the Chinese consulate at Makassar, wounding the consul and staff, wrecking the consulate''s offices and dormitory, and taking the Chinese emblem and the consulate''s brass plate. The note calls it a shocking breach of international norms and a grave provocation, and demands a public apology, punishment of the culprits and those who set them on, the return of the emblem and plate, compensation, no repeat, and protection of China''s missions and people in Indonesia.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 86–87 (Feb. 27, 1966).'
        tags: [polity:prc, polity:indonesia]
        src:
          c: 0bb40435
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 86–87: all'
