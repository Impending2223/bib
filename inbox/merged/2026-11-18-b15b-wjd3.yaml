        c: 'The Chinese embassy in Laos''s note to the Lao Foreign Ministry on the status of the consulate general at Phongsaly: it was set up by agreement of the two governments, its papers complete and its status lawful. Having let U.S. aircraft strafe it, the note says, Laos now quibbles over its status, to cover the U.S. crime; China hopes Laos will return to the road of peace and neutrality.'
