      item: '[[w.zhonghua-renmin-gongheguo-waijiao]], 167 (July 20–Aug. 6, 1967; Lê Thanh Nghị''s delegation; Li Xiannian and Lê Thanh Nghị sign the aid agreement at Beijing; no day given)'
