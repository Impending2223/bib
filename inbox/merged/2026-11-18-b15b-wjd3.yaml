          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 26: all'
  - add:
      entry:
        id: cal.1965-05-04.china
        when: May 4
        date: '1965-05-04'
        thread: china
        also: [south-asia]
        c: 'Xinhua, authorized, issues a statement: India''s recent slanders against China in the India–Pakistan border clash have no basis in fact. The Chinese government and people fully sympathize with and support the Pakistani government''s stand against India''s expansionist policy and for settling the border dispute by peaceful talks. China strongly condemns India''s great-power chauvinism and expansionism, and urges it to put the Indian people''s interest and Afro-Asian solidarity first and settle its disputes with its neighbors by peaceful talks.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 27 (May 4, 1965).'
        tags: [polity:prc, polity:india, polity:pakistan]
        src:
          c: 9bfafd9f
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 27: all'
