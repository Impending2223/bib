        when: Nov. 26
        date: '1969-11-26'
        thread: china
        also: [laos]
        c: The Foreign Ministry's statement firmly backs Prince Sihanouk's statement of Nov. 22 and voices great anger at the savage U.S. crimes of aggression on Cambodia. (The editors say Sihanouk's statement strongly condemned the new grave U.S. crimes and called on all states and peoples to stop the U.S. war of destruction in the Indochinese states.) China firmly backs the Cambodian people's just struggle against U.S. aggression.
