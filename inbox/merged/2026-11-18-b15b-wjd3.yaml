        when: Sept. 3
        date: '1967-09-03'
        thread: china
        c: The Chinese Red Cross issues a stern statement on the 29th meeting of the Council and the Conference of the Red Cross, to be held Sept. 5 at The Hague. It condemns some of the International Red Cross's leaders for serving the U.S. hostility to the Chinese people and its "two Chinas" plot and its war in Vietnam, and says the Chinese Red Cross will not go to The Hague and will no longer sit on the League's executive committee.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 171–172 (Sept. 3, 1967).'
        tags: [polity:prc, polity:un]
