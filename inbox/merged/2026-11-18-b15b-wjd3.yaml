        thread: china-leadership
        also: [africa]
        c: 'Chen Yi, at his reception at Bamako: the new Afro-Asian states meet difficulties in building; by self-reliance, holding their economic lifelines, drawing out their people''s initiative, developing their own resources, helping one another and resisting imperialism''s demands, they can overcome them and beat the plots of imperialism and old and new colonialism.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 51–52 (Sept. 10, 1965). See [[cal.1965-09-09.china-leadership-3]]. Names: Chen Yi.'
        tags: [polity:prc, polity:mali, name:chen-yi]
