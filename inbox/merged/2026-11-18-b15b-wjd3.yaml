        c: Fang Yi, director of the commission for economic relations with foreign countries, and the deputy minister Hamiti sign, for their governments, the agreement on a Chinese loan to Albania's petroleum industry.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 132 (Oct. 20, 1966).'
