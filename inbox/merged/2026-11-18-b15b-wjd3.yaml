        when: Oct. 22
        date: '1966-10-22'
        thread: china
        also: [soviet-union]
        c: 'Foreign Ministry note to the Soviet embassy: on Oct. 7 the Soviet ministry of higher and specialized secondary education decided that all Chinese students in the Soviet Union suspend study for a year and leave in October, a Soviet breach of the cultural cooperation agreement and a grave worsening of relations. The note rejects the pretext of reciprocity: China''s "cultural revolution" suspends a year for all foreign students in China, not Soviet ones alone, whereas no Soviet order suspends all foreign students, so the order is aimed at Chinese students alone; China protests strongly and orders its students to leave Moscow Oct. 27.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 132–133 (Oct. 22, 1966).'
        tags: [polity:prc, polity:ussr]
