        c: The government's statement condemns Israel, at the urging and with the backing of the U.S., for the large-scale armed aggression of June 5 on the UAR, Syria and other Arab states. China solemnly declares that the Chinese people will not let the U.S. and its partners run wild and invade everywhere; they stand firmly with the Arab people and back their just war against U.S. and Israeli aggression.
