  - add:
      entry:
        id: cal.1965-01-10.china-2
        when: Jan. 10–Dec. 2
        date: '1965-01-10'
        thread: china
        c: The Foreign Ministry spokesman, on orders, issues the 356th to the 396th "serious warnings" against U.S. military aircraft and warships entering again and again the airspace and territorial waters of Fujian and Guangdong. The chronology gives the run, Jan. 10 to Dec. 2.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 2 (Jan. 10–Dec. 2, 1965). Check: the day of each warning; the chronology gives only the span here.'
        tags: [polity:prc, polity:us]
        src:
          c: c8b18c2c
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 2: all'
