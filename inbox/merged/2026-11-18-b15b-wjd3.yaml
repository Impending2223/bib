        also: [africa]
        c: The first ambassador of the Central African Republic to China, Joseph-Gambéré Mamadou, presents his credentials to Zhu De. He reached Beijing Dec. 12.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 75 (Dec. 22, 1965). Names: Zhu De. Check: the name, from the Chinese 约瑟夫-冈贝亨·马马杜.'
        tags: [polity:prc, polity:central-african-republic, name:zhu-de]
