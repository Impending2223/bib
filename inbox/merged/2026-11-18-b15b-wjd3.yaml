  - add:
      entry:
        id: cal.1965-04-11.china
        when: Apr. 11
        date: '1965-04-11'
        thread: china
        also: [soviet-union, vietnam-hanoi]
        c: The Central Committee and the State Council reply, by letter, to the Soviet Central Committee and government, who proposed a top-level meeting of DRV, Chinese and Soviet representatives on further steps for Vietnam's security. China's stand on Vietnam is well known; it will under any circumstances meet its proletarian internationalist duty without hesitation, and has helped and will help Vietnam by military, economic and political means. China and Vietnam have held many talks and reached full agreement on major matters; there is no need to talk again. Soviet aid to Vietnam is too little; how to aid is for the Soviet–Vietnamese side to settle, and China need not take part.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 19–20 (Apr. 11, 1965). Made public: 2002. Check: when and where the letter was first published.'
        tags: [polity:prc, polity:ussr, polity:drv, vis:only:prc+ussr]
        src:
          c: 66ab83f1
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 19–20: all'
  - add:
      entry:
        id: cal.1965-04-12.china
        when: Apr. 12–18
        date: '1965-04-12'
        thread: china
        also: [europe-and-the-alliance-britain, vietnam-hanoi]
        c: The Foreign Ministry replies to the British government that China does not welcome a British representative to discuss Vietnam. Britain, a co-chairman of the 1954 Geneva Conference, has not taken a just stand to condemn and halt the open U.S. aggression, but has backed each step of its widening, and has even defended U.S. use of poison gas. In these circumstances a British special envoy's contact with the Chinese government on Vietnam and Indochina is improper and unwelcome.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 20 (Apr. 12–18, 1965). Check: the day of the reply; the chronology gives Apr. 12 to 18.'
        tags: [polity:prc, polity:uk]
        src:
          c: a0a7ea40
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 20: all'
  - add:
