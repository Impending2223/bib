        thread: china
        also: [japan]
        c: Wu Shudong, representative of the Liao Chengzhi Office's Tokyo liaison office, in a press conference strongly condemns Prime Minister Satō's "visit" to Taiwan, which, he says, openly follows the U.S. in making "two Chinas". Taiwan is China's sacred land; the Chinese people will liberate it and will let no foreign force interfere.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 173 (Sept. 8, 1967). Check: the name, from the Chinese 吴曙东.'
