        thread: china
        also: [korea]
        c: The Foreign Ministry's statement supports the North Korean Foreign Ministry's statement against the U.N. General Assembly's attempt, under U.S. management, to discuss the "Korean question" again illegally. The U.N. has no standing to discuss it.
