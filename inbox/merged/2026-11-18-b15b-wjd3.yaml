        date: '1965-01-20'
        thread: china
        also: [laos]
        c: The same day Chen Yi writes to the Geneva Conference's two co-chairmen, hoping the Soviet and British governments will take up their responsibility, stop the U.S. direct armed aggression against Laos and the widening of the Indochina war.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 4 (Jan. 20, 1965). Names: Chen Yi.'
        tags: [polity:prc, polity:us, polity:ussr, polity:uk, name:chen-yi]
