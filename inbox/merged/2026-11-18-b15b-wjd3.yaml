        when: Oct. 21
        date: '1966-10-21'
        thread: china
        also: [indonesia]
        c: Foreign Ministry note to the Indonesian embassy, a strong protest at Indonesia's persecution and driving out of overseas Chinese, which has come to collective expulsion. Indonesia now uses China's sending of ships to plunder the Chinese of their property and cut off their living, so as to drive them out in lots, which China cannot tolerate and cannot succeed. Under the two governments' treaties and agreements Indonesia must protect their rights; China's sending ships does not clear Indonesia of its duty, nor let it expel them at will.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 132 (Oct. 21, 1966).'
