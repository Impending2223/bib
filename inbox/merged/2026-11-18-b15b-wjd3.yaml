        date: '1966-05-18'
        thread: china
        also: [indonesia]
        c: Foreign Ministry note to the Indonesian embassy, in anger at Indonesia's note of May 5 denying anti-Chinese acts and rejecting the Chinese government's four demands for the return of the victimized overseas Chinese. It demands again that Indonesia arrange ships to send home those who wish to go, and says that until Indonesia meets its duty China will shortly send ships to bring them back, and proposes that the two governments at once hold talks on the arrangements.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 104 (May 18, 1966).'
        tags: [polity:prc, polity:indonesia]
        src:
          c: e2d47aa1
          rows:
