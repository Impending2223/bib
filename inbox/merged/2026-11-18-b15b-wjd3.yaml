      item: '[[w.zhonghua-renmin-gongheguo-waijiao]], 53 (Sept. 16–Oct. 7, 1965; Surjadi''s economic delegation, Sept. 16 to Oct. 7; Mao, Liu Shaoqi and Zhou receive him; Li Xiannian''s talks; the economic and technical cooperation, trade and payments agreements, no day given)'
