        when: Oct. 3
        date: '1966-10-03'
        thread: china-leadership
        also: [south-asia]
        c: Chen Yi, at the thanks banquet of the Pakistani friendship delegation, stresses that whatever happens on the Asian mainland or the subcontinent Sino-Pakistani friendship will not change; the peoples will unite more and stay friends through the generations. If Pakistan is attacked and needs help, the Chinese government and people will certainly be on its side.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 129 (Oct. 3, 1966). Names: Chen Yi.'
        tags: [polity:prc, polity:pakistan, name:chen-yi]
        src:
          c: e11983c1
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 129: all'
  - add:
      entry:
        id: cal.1966-10-07.china
        when: Oct. 7
        date: '1966-10-07'
        thread: china
        also: [vietnam-hanoi]
        c: The Chinese government hands a memorandum to Vietnam, Albania, Romania and each Afro-Asian state seated in the U.N., exposing the U.S. and its followers for using the U.N. voting machine to hide the substance of the invasion of Vietnam and push the "peace talks" plot. The U.N. has no right to take up Vietnam. China backs the Vietnamese government's stand against U.N. intervention and holds that any just state should firmly oppose the General Assembly's passing a resolution on Vietnam in any form; Asian, African and all peace-loving states may condemn the U.S. strongly outside the U.N. and demand the withdrawal of all U.S. and vassal forces.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 130–131 (Oct. 7, 1966).'
        tags: [polity:prc, polity:drv, polity:un]
        src:
          c: 952ceb25
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 130–131: all'
