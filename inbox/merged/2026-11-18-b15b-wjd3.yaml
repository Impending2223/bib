        c: The nine Chinese trade and press workers held for a year and a half, against the law, by the Brazilian authorities, Wang Yaoting among them, return home from Rio de Janeiro by way of Switzerland (the chronology gives Apr. 17 and 24). Liu Shaoqi and Li Xiannian receive them. On the 24th a mass rally of all circles in the Great Hall of the People welcomes them; Lu Dingyi, for the Party Central Committee, the State Council and the whole people, voices sympathy and praises their firmness against the Brazilian authorities, set on by the U.S.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 22 (Apr. 24, 1965). Names: Liu Shaoqi, Li Xiannian, Lu Dingyi. Check: the day of Liu''s and Li''s reception; the chronology gives none. Wang''s name from the Chinese 王耀庭.'
        tags: [polity:prc, polity:brazil, name:liu-shaoqi, name:li-xiannian, name:lu-dingyi]
