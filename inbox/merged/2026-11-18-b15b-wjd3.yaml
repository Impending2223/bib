        date: '1965-02-20'
        thread: china
        also: [africa]
        c: Zhou writes to Uganda's prime minister, Obote, with strong condemnation of the U.S. and the Tshombe clique for serious provocation and armed invasion against the Ugandan people. He states the Chinese government's full support for Uganda's just stand in repelling the U.S. aggression and defending its sovereignty.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 9 (Feb. 20, 1965). Names: Zhou Enlai, Obote, Tshombe.'
        tags: [polity:prc, polity:uganda, name:zhou-enlai, name:obote-a-milton, name:tshombe-moise]
