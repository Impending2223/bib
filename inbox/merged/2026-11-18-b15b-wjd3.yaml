        c: 'Liu Shaoqi, receiving Pakistan''s ambassador, Sultan Muhammad Khan: Sino-Pakistani friendship is rooted deep in the two peoples and is no mere tie of leaders; Pakistan''s leaders speak for its people''s will, and in China it is not a few but the Chinese people who wish for friendship with Pakistan; a friendship on a mass base is firm and not easily changed.'
