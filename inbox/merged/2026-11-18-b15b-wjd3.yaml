        c: After Geng Biao, the new Chinese ambassador to Albania, took up his post on May 15, and Huang Zhen, ambassador to France, returned to his on May 20, new ambassadors in turn take up posts in Vietnam, Cambodia, Pakistan, Tanzania, Guinea, Romania, Sweden, the Congo (Brazzaville), Syria, Nepal, Mauritania, Afghanistan and Algeria; the ambassadors to Ethiopia and Yemen return to theirs; and Huang Hua, ambassador to the UAR, leaves it on July 14 and returns home.
