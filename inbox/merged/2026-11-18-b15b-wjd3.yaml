        id: cal.1969-08-19.china
        when: Aug. 19
        date: '1969-08-19'
        thread: china
        also: [soviet-union]
        c: 'Foreign Ministry note to the Soviet embassy: strong protest at the Soviet army''s steady violation of Chinese land, waters and airspace at many places on the Sino-Soviet boundary in June and July, and its running provocation of armed clashes. The note says the Soviet government made 429 border incidents from June 1 to July 31, and that the bloody incident of Aug. 13 at Tielekti was the sure result of its planned making of such incidents in June and July. It demands that the Soviet government stop all incursion and provocation at once, take down all works built illegally, and not block Chinese vessels'' normal passage on the boundary rivers.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 220 (Aug. 19, 1969).'
