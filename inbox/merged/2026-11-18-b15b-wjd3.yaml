        when: Nov. 14
        date: '1965-11-14'
        thread: china
        also: [africa]
        c: 'The government''s statement on Southern Rhodesia: on Nov. 11 the white colonial authorities, with the backing of imperialism and old and new colonialism, declared a so-called "independence", against the firm opposition of the people of Zimbabwe and the African states. China strongly condemns it and firmly supports the Zimbabwe people''s anti-imperialist, anti-colonial struggle for national independence.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 69 (Nov. 14, 1965).'
