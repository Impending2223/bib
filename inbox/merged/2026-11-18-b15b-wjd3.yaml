        id: cal.1965-05-28.china-leadership-4
        when: May 28
        date: '1965-05-28'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Chen Yi, to Carol of *Le Nouvel Observateur*: the Vietnamese people can drive out the U.S. aggressors by their own strength, and the U.S. cannot escape defeat whatever tricks it uses. China firmly opposes the U.S. peace-talk fraud and firmly supports the stand of the Vietnamese government and the National Liberation Front: restore the 1954 Geneva agreements, withdraw U.S. aggressor forces from the South, accept the Front as the sole legitimate representative of the people of the South, leave the South''s internal affairs to its people, and leave Vietnam''s peaceful reunification to the Vietnamese.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 30 (May 28, 1965). Names: Chen Yi.'
        tags: [polity:prc, polity:drv, polity:nlf, polity:fr, name:chen-yi]
