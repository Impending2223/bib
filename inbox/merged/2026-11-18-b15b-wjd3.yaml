        thread: china
        also: [africa]
        c: 'The Chinese embassy in Kenya''s note to the Kenyan Foreign Ministry: serious protest at Kenya''s note of Mar. 9 declaring Zhang Zongxu, a member of the embassy staff, persona non grata, with no reason given, and ordering him out within 12 hours. The embassy calls it a further, extremely grave step by Kenya against normal relations.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 88 (Mar. 12, 1966). Check: Zhang''s name, from the Chinese 张宗绪.'
