        date: '1966-03-10'
        thread: china
        also: [indonesia]
        c: 'Foreign Ministry note to the Indonesian embassy: the strongest protest at the grave events of Mar. 9 and 10, when thugs organized by the Indonesian right-wing reactionary forces twice attacked the Xinhua Jakarta branch, the Chinese consulate general and the commercial counsellor''s office, wounding 30 Chinese diplomatic and consular officials and other staff, and gravely wrecking and looting the missions. If the Indonesian government goes on without checking this, relations will be much further damaged; China asks it to think this over and reply soon.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 87–88 (Mar. 10, 1966).'
