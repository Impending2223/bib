  - add:
      entry:
        id: cal.1968-11-26.china
        when: Nov. 26
        date: '1968-11-26'
        thread: china
        c: 'The spokesman of the Foreign Ministry''s information department rebuts the remarks of Nov. 18 of the U.S. State Department''s press officer and the U.S. embassy in Poland, who twisted the facts and disclosed how the date of the 135th U.S.–China ambassadorial meeting was discussed, charging China with no wish to meet on time. In the talks China has held two principles: that the U.S. pledge at once to withdraw all its armed forces from Taiwan and the Taiwan Strait and dismantle its military installations in Taiwan, and that the two sign an agreement on the Five Principles of Peaceful Coexistence. In 13 years the U.S. has refused to agree to them, and put the cart before the horse over side issues; China never trades principle, and the talks will come to nothing if the U.S. goes on so.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 205–206 (Nov. 26, 1968).'
        tags: [polity:prc, polity:us]
        src:
