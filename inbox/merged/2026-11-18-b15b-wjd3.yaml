        c: 'The Foreign Ministry publishes the document "Refuting the Soviet Government''s Statement of June 13, 1969". It restates China''s view of a whole settlement of the boundary question: tell historical right from wrong and hold that the present treaties are the unequal treaties of tsarist Russia; take the real situation into account and settle the whole question by peaceful talks on their basis; keep the status quo before it is settled, avoid armed clashes, and have both sides'' armed forces leave or not enter the disputed areas and break contact; sign a new equal treaty in place of the old.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 229 (Oct. 8, 1969).'
        tags: [polity:prc, polity:ussr]
        src:
          c: 3646e2d6
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 229: all'
