          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 75–76: all'
  - add:
      entry:
        id: cal.1965-12-30.china-leadership
        when: Dec. 30
        date: '1965-12-30'
        thread: china-leadership
        c: 'Chen Yi, answering questions of Takano Yoshihisa of *Akahata*, in Beijing: the Chinese people stand firmly with over 90 percent of the world''s people against U.S. aggression and war policy, and back every struggle of oppressed peoples and nations for freedom and independence. If the U.S. insists on carrying the war to China, China will fight.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 76 (Dec. 30, 1965). Names: Chen Yi. Check: the correspondent''s name, from the Chinese 高野好久.'
        tags: [polity:prc, polity:japan, name:chen-yi]
        src:
          c: caf86359
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 76: all'
