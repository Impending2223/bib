      entry:
        id: cal.1966-01-14.china
        when: Jan. 14
        date: '1966-01-14'
        thread: china
        also: [vietnam-hanoi]
        c: The Foreign Ministry's statement strongly condemns the U.S. for pressing a "scorched earth" and "three-all" policy and large-scale use of gas and chemical poisons in South Vietnam while playing the "peace talks" trick. China firmly backs the Vietnamese Foreign Ministry's statements of Jan. 9 and 11 and the Vietnamese government's stand and people's struggle.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 80 (Jan. 14, 1966).'
        tags: [polity:prc, polity:drv, polity:us]
        src:
          c: 09895bb7
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 80: all'
  - add:
      entry:
        id: cal.1966-01-18.china
        when: Jan. 18
        date: '1966-01-18'
        thread: china
        also: [laos]
        c: The Foreign Ministry's statement strongly condemns U.S. aircraft for wild bombing in Khammouane and Savannakhet provinces of Middle and Lower Laos and for spreading chemical poisons in Luang Prabang province in the north. China, a close neighbor of Laos and a Geneva signatory, fully endorses the stand of the Lao Patriotic Front party and the Lao patriotic neutralist forces, and calls on all peace-loving states and peoples to support the Indochinese peoples' just struggle.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 80–81 (Jan. 18, 1966).'
        tags: [polity:prc, polity:us]
        src:
          c: 2758f9bc
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 80–81: all'
  - cite:
      id: cal.1966-01-22.china-leadership
      item: '[[w.zhonghua-renmin-gongheguo-waijiao]], 81 (Jan. 22, 1966; the delegation under Kawase Ikkan, with Kimura Ichizō; Zhou against the Satō government''s following the U.S.)'
