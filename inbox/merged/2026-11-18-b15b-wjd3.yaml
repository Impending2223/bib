        id: cal.1966-01-03.china
        when: Jan. 3
        date: '1966-01-03'
        thread: china
        also: [laos]
        c: The Foreign Ministry's statement strongly condemns the U.S. for inciting Thai armed forces to attack a Cambodian frontier post at O Smach, in Oddar Meanchey province, with grave Cambodian casualties and losses.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 78 (Jan. 3, 1966).'
        tags: [polity:prc, polity:cambodia, polity:us]
        src:
          c: 237f5d7f
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 78: all'
  - add:
      entry:
        id: cal.1966-01-04.china
        when: Jan. 4
        date: '1966-01-04'
        thread: china
        also: [soviet-union, vietnam-hanoi]
        c: The Chinese government's memorandum to the Soviet government on the rumor that China obstructs the transit of Soviet military supplies for Vietnam. China has always met the Soviet government's reasonable requests for passage of arms Vietnam needs and the Soviet side is willing to supply, with every convenience and help; the Chinese railways carry these supplies and men free, not a U.S. cent or a ruble taken, and the Soviet officials concerned have said again and again that they are satisfied. Still the rumor keeps coming from the Soviet side; China asks the Soviet government to clear it up in public and guarantee no repeat.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 78–79 (Jan. 4, 1966). Made public: 2002. Check: when the memorandum was first published.'
        tags: [polity:prc, polity:ussr, polity:drv, vis:only:prc+ussr]
        src:
          c: '99141993'
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 78–79: all'
  - add:
      entry:
        id: cal.1966-01-05.china
        when: Jan. 5
        date: '1966-01-05'
        thread: china
        also: [africa]
        c: 'The Foreign Ministry''s statement on the Dahomey government''s unreasonable ending of diplomatic relations with China (Dahomey is today Benin, the editors say): a most grave act, a one-sided and groundless tearing up of the agreement establishing relations. China protests seriously and will withdraw the whole staff of its embassy in Dahomey.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 79 (Jan. 5, 1966).'
        tags: [polity:prc, polity:dahomey]
        src:
          c: 5889aee0
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 79: all'
  - add:
      entry:
        id: cal.1966-01-06.china
        when: Jan. 6
        date: '1966-01-06'
        thread: china
        also: [south-asia]
        c: Foreign Ministry note to the Indian embassy, rejecting six notes of the Indian Foreign Ministry between Nov. 27 and Dec. 13, 1965 as fabricated slanders, and refusing the protests based on them. Chinese border and civil personnel crossed neither the line of actual control nor the border line, on the Sino-Indian or the China–Sikkim border; India's armed tension on both borders is made for its present domestic and foreign needs. If India goes on with incursions, or again attacks Chinese border personnel, China will hit back.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 79 (Jan. 6, 1966).'
        tags: [polity:prc, polity:india]
        src:
          c: f636574e
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 79: all'
