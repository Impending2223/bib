        also: [vietnam-hanoi]
        c: The Foreign Ministry's statement condemns the U.S. Marines for using poison gas on the people of the Vĩnh Quang area, north of Quy Nhơn in South Vietnam. China answers the call of the Vietnamese government and the National Liberation Front and asks the world's peoples to condemn and stop the U.S. crime and support the Vietnamese people's just struggle.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 53–54 (Sept. 18, 1965).'
        tags: [polity:prc, polity:drv, polity:us]
