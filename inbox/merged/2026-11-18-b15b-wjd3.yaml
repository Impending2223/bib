        date: '1966-03-24'
        thread: china
        also: [vietnam-hanoi]
        c: 'The Foreign Ministry''s statement opposes the U.S. use of chemical poisons and gases of all kinds in the Vietnam war, killing the people of South Vietnam, and restates firm Chinese support for the Vietnamese people''s stand. The statement says the U.S., thinking such inhuman means will cow the Vietnamese, will find the opposite: the more savage and cruel it is, the more it hardens their resolve to fight to the death and the more the world''s peoples back their cause, so speeding the U.S. defeat.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 90 (Mar. 24, 1966).'
