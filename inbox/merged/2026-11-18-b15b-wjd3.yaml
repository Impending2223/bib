  - add:
      entry:
        id: cal.1965-02-13.china
        when: Feb. 13
        date: '1965-02-13'
        thread: china
        also: [vietnam-hanoi]
        c: The government's statement exposes a U.S. plot to widen the war in Indochina. The Chinese people have long been ready and know how to help the peoples of Vietnam and Indochina drive out the U.S. aggressors. The U.S. broke the Geneva agreement by entering South Vietnam, and now takes the lead in breaking the line between South and North. The statement calls on the world to support the Vietnamese and Indochinese peoples.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 8 (Feb. 13, 1965).'
        tags: [polity:prc, polity:drv, polity:us]
        src:
          c: 7f951003
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 8: all'
