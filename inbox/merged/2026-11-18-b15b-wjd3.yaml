        c: The Foreign Ministry hands the Soviet embassy the memorandum answering the Soviet government's letter of May 25. On the transit of MiG fighters the Soviet Union supplies to Vietnam, China says Vietnam long ago asked for rail carriage, and China told Vietnam and the Soviet Union it agreed to the Vietnamese proposal of carriage by land and not to the Soviet request to fly them; the three sides had settled it. The Soviet letter, undated, suddenly asks again to fly them in; such a large air military movement, China says, is meant to open a breach and then an air corridor.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 159 (June 10, 1967). Made public: 2002. Check: when the memorandum was first published.'
