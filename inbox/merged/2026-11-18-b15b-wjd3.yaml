        when: Jan. 7–Dec. 26
        date: '1966-01-07'
        thread: china
        c: The Foreign Ministry spokesman, on orders, makes the 397th to the 419th serious warnings against repeated intrusions of Chinese airspace and territorial waters by U.S. military aircraft and ships, the run given as Jan. 7 to Dec. 26.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 80 (Jan. 7–Dec. 26, 1966). Check: the day of each warning; the chronology gives only the span here.'
        tags: [polity:prc, polity:us]
        src:
          c: 5a10f3c8
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 80: all'
