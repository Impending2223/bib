  - add:
      entry:
        id: cal.1965-02-23.china-2
        when: Feb. 23
        date: '1965-02-23'
        thread: china
        also: [vietnam-hanoi, laos]
        c: Zhou cables the presidium of the Indochinese People's Conference to wish success to the conference, to open Mar. 1 at Phnom Penh. The cable says the U.S. has broken the Geneva agreements of 1954 and 1961, made war in South Vietnam, intervened by arms in Laos, kept up military provocation and political subversion against Cambodia, and bombed the DRV from the air. It praises Prince Sihanouk's call for the conference as a great service to peace in Indochina.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 9–10 (Feb. 23, 1965). Names: Zhou Enlai, Sihanouk.'
        tags: [polity:prc, polity:cambodia, polity:drv, name:zhou-enlai, name:norodom-sihanouk]
        src:
          c: 5c6d65db
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 9–10: all'
  - add:
      entry:
        id: cal.1965-02-27.china
        when: Feb. 27
        date: '1965-02-27'
        thread: china
        also: [korea, japan]
        c: The Foreign Ministry's statement supports North Korea's stand against the ROK–Japan talks and the "ROK–Japan basic treaty". The signing of the treaty was reached under direct U.S. management; for years the U.S. has urged Japan and South Korea to talk, to build up a "Northeast Asian military alliance".
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 10 (Feb. 27, 1965).'
        tags: [polity:prc, polity:dprk, polity:rok, polity:japan]
        src:
          c: c838a661
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 10: all'
  - add:
      entry:
        id: cal.1965-02-28.china-leadership-4
        when: Feb. 28
        date: '1965-02-28'
        thread: china-leadership
        c: 'Chen Yi, to Nebiolo of Italy''s *Il Popolo*: the future of Sino-Italian relations is hopeful; through the two countries'' trade offices, beginning with trade, then cultural exchange, step by step toward formal relations.'
