        c: 'Chen Yi cables a reply to the DRV foreign minister, Xuân Thủy, on the South Korean troops: China firmly supports the DRV''s stand and will strive with Vietnam, to the end, to defeat U.S. aggression.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 3 (Jan. 13, 1965). Names: Chen Yi, Xuân Thủy.'
