        when: May 17
        date: '1966-05-17'
        thread: china-leadership
        also: [europe-and-the-alliance]
        c: Chen Yi receives journalists from Denmark, Finland, Norway and Sweden. Asked about peaceful coexistence of states of different systems, he says China gets on well with the four on the Five Principles, so the barrier to coexistence is not socialist China but the imperialist states, above all the U.S., which refuses the Five Principles and invades, controls and meddles everywhere.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 104 (May 17, 1966). Names: Chen Yi.'
