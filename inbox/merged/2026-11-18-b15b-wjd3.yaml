        when: June 11
        date: '1966-06-11'
        thread: china-leadership
        also: [south-asia]
        c: Zhu De and Bo Yibo attend the reception given by Nepal's ambassador for King Mahendra's birthday. Bo Yibo says China stands with the Asian peoples in weal and woe, firmly opposes U.S. aggression, backs Afro-Asian independence and national economies, holds states large and small equal, and opposes great-power bullying and manipulation.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 108–109 (June 11, 1966). Names: Zhu De, Bo Yibo.'
