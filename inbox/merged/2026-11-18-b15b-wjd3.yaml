        thread: china
        also: [europe-and-the-alliance-britain]
        c: 'Foreign Ministry note to the British chargé d''affaires'' office, for the British government: the Hong Kong authorities'' string of mad political persecutions of the patriotic press and patriotic journalists has become extremely grave. China protests most urgently and strongly once more and states that Britain and the Hong Kong authorities must lift the suspension orders on the papers and printing companies and drop the illegal prosecutions, restoring their normal business.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 169–170 (Aug. 20, 1967).'
