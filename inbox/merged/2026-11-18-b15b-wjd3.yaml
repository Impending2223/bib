        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy: strong protest at renewed armed provocation by Indian troops against a Chinese border-guard unit on the China–Sikkim border, in which a Chinese soldier was wounded. China, with India provoking border clashes again and again, has had to tighten its border guard and watch events closely.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 60–61 (Oct. 6, 1965).'
