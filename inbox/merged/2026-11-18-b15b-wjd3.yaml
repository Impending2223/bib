        also: [indonesia]
        c: 'The Chinese embassy in Indonesia''s note to the Indonesian Foreign Ministry: the greatest indignation and strongest protest at recent persecution of overseas Chinese in several places. The embassy''s many earnest notes have not stopped the destruction of property and threats to life; the mobs'' killings of Chinese grow worse, with troops and police on the spot letting them do as they please, and local authorities heeding no reasonable plea. It demands effective curbs, punishment of instigators and killers, and protection of Chinese rights, lives and property.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 74 (Dec. 9, 1965).'
