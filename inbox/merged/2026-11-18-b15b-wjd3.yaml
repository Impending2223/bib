        when: June 11
        date: '1965-06-11'
        thread: china
        also: [europe-and-the-alliance-britain, vietnam-hanoi]
        c: The Foreign Ministry spokesman comments on the British government's white paper on the international conference on Cambodia and on Foreign Secretary Stewart's statement to the Commons on Cambodia and Vietnam. Britain goes on following the U.S. and directly helps its widening of the war in Vietnam; for any grave turn in Vietnam it bears a responsibility it cannot shirk.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 33 (June 11, 1965).'
