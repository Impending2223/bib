        thread: china
        also: [south-asia]
        c: 'The Chinese embassy in Ceylon''s note to Ceylon''s ministries of defense and foreign affairs: strong protest at the Ceylon government''s following the U.S. in making "two Chinas". The note states that Ceylon must cut every tie with the Chiang clique and promise to join in no "two Chinas" activity.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 170 (Aug. 22, 1967).'
