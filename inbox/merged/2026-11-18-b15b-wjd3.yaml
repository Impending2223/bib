        when: Mar. 17
        date: '1966-03-17'
        thread: china
        also: [africa]
        c: 'The Chinese embassy in Kenya''s note to the Kenyan government: protest at the Kenyan Senate''s anti-Chinese motion of Mar. 1, which viciously attacks China''s leaders and spoils relations. Zhou, on his 1964 African tour, had said in a speech that Africa was in an excellent revolutionary situation, because of the rising anti-imperialist, anti-colonial struggle of its people; imperialism, to stir up more anti-Chinese feeling, twists that speech and sows discord in some African states. The note says the motion, tying a series of reactionary coups and massacres lately planned by imperialism in Africa to Zhou''s speech, can only be taken as a plot to worsen relations, for all of whose results Kenya''s government is wholly responsible.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 89–90 (Mar. 17, 1966). Names: Zhou Enlai.'
        tags: [polity:prc, polity:kenya, name:zhou-enlai]
