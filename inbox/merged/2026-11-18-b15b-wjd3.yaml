        c: The Chinese embassy in Ceylon, on orders, makes a strong protest again to Ceylon's defense and foreign ministries, since Ceylon, despite its repeated representations, insists on tying itself to the Chiang Kai-shek clique and following the U.S. in making "two Chinas".
