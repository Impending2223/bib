        when: Apr. 18
        date: '1965-04-18'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: At the Foreign Ministry's reception for the tenth anniversary of the first Afro-Asian Conference, Acting Premier Deng Xiaoping says the Chinese government and people have always actively supported the Vietnamese people's great struggle to defend the North and liberate the South. Whatever happens, whatever the cost, they will meet their internationalist duty.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 22 (Apr. 18, 1965). Names: Deng Xiaoping.'
        tags: [polity:prc, polity:drv, name:deng-xiaoping]
