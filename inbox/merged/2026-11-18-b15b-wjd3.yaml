        thread: china
        also: [indonesia]
        c: 'The Chinese embassy in Indonesia''s note to the Indonesian Foreign Ministry: the strongest protest at the large-scale persecution of overseas Chinese at Makassar on Nov. 10 and 11. It asks punishment of the culprits and those who set them on, sure protection of the consulate, an apology for the torn portraits of China''s leaders, compensation, emergency relief for the destitute, help to reopen wrecked shops, and measures against a repeat.'
