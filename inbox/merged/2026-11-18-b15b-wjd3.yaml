        when: Feb. 28
        date: '1966-02-28'
        thread: china
        also: [laos]
        c: Liu Chun, China's ambassador to Laos, calls on the Lao Foreign Ministry's new secretary-general, Chao Ninokan, and makes an oral protest at the Vientiane government spokesman's open denial of the legal status of the Chinese consulate general. He says it was set up by agreement of the two governments and its status is wholly legal.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 87 (Feb. 28, 1966). Check: the secretary-general''s name, from the Chinese 昭·尼诺坎.'
        tags: [polity:prc, polity:laos, polity:pathet-lao]
        src:
