  - add:
      entry:
        id: cal.1966-05-23.china
        when: May 23
        date: '1966-05-23'
        thread: china
        also: [middle-east]
        c: Huang Hua, China's ambassador to the UAR, calls on the UAR Foreign Ministry's state secretary, Fiqi, and states China's stand on a world disarmament conference. The U.N. is run by the U.S., which keeps China from its rights; China has no ties with it and will join no disarmament conference connected with it. Even one apart from the U.N., while the U.S. presses its aggression in South Vietnam, bombs the DRV and threatens to carry the war to all Indochina and China, to sit with the U.S. on disarmament would be pointless, would turn the peoples' eyes from the target, and is not proper now.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 105 (May 23, 1966). Names: Huang Hua. Check: the state secretary''s name, from the Chinese 费基.'
        tags: [polity:prc, polity:uar, polity:un, name:huang-hua]
