        date: '1966-06-20'
        thread: china
        also: [laos]
        c: 'Han Nianlong, vice foreign minister, calls in Cambodia''s ambassador, Chang Kang, and answers on China''s stand on joining the International Court of Justice: the Court is a principal organ of the U.N., and until the Chiang clique''s men are expelled from the U.N. and China''s rights restored, China will have no tie with any of its organs.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 111 (June 20, 1966). Check: the ambassador''s name, from the Chinese 张岗.'
        tags: [polity:prc, polity:cambodia, polity:un]
