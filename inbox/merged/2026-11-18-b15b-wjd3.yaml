        id: cal.1965-05-03.china
        when: May 3
        date: '1965-05-03'
        thread: china
        also: [latin-america-dominican-republic]
        c: The government's statement opposes the U.S. armed aggression in the Dominican Republic. The Dominican people's rising on Apr. 24 to overthrow the dictatorship was their sacred and inviolable right. The statement condemns the U.S., on the pretext of protecting its nationals, for sending 14,000 troops into the Dominican Republic and meddling in its affairs, and says the Chinese government and people firmly support the Dominican people's just, patriotic anti-U.S. struggle.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 26 (May 3, 1965).'
