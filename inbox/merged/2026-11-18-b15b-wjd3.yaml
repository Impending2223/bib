      entry:
        id: cal.1965-01-03.china
        when: Jan. 3
        date: '1965-01-03'
        thread: china
        also: [south-asia]
        c: 'Foreign Ministry note to the Indian embassy, Beijing: strong protest at Indian troops crossing the China–Sikkim border in a series of serious new intrusions. China again urges India to tear down at once all fortifications on Chinese territory and on the line, withdraw all troops illegally stationed there, return the herdsmen''s livestock taken, and stop all aggression.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 1 (Jan. 3, 1965).'
        tags: [polity:prc, polity:india]
        src:
          c: 507968ca
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 1: all'
