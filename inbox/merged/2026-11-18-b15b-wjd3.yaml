      entry:
        id: cal.1965-06-18.china
        when: June 18
        date: '1965-06-18'
        thread: china
        also: [vietnam-hanoi]
        c: The Foreign Ministry's statement condemns the U.S. order to its forces to fight directly in South Vietnam, and answers and fully backs the National Liberation Front's and the Vietnamese government's just appeal. The Chinese people have always taken the Vietnamese struggle as their own; they are ready, and when the Vietnamese people call they will send volunteers at once to fight beside the Vietnamese army and people till the U.S. aggressors are driven out.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 34 (June 18, 1965).'
        tags: [polity:prc, polity:drv, polity:nlf, polity:us]
        src:
          c: '67001619'
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 34: all'
