        thread: china-leadership
        also: [europe-and-the-alliance]
        c: Lu Dingyi, alternate member of the Politburo, secretary of the Secretariat and vice-premier, begins the visit of his party and government delegation to the GDR for the 20th anniversary of Germany's liberation from fascism, to May 11.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 27 (May 4–11, 1965; the visit; Ulbricht and Stoph receive the delegation, no day given). Names: Lu Dingyi.'
