        when: Mar. 11
        date: '1966-03-11'
        thread: china
        also: [korea, vietnam-hanoi]
        c: The Foreign Ministry's statement supports the stand of North Korea and Vietnam and condemns the Park Chung Hee clique for sending 20,000 more troops to South Vietnam for the U.S. war. The U.S. plan to widen the war is aimed at the Vietnamese and Korean peoples and also at the Chinese and the Asian peoples; whether it takes the field itself or sends more of its vassals, it cannot save itself from defeat.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 88 (Mar. 11, 1966). Names: Park Chung Hee.'
