        when: Apr. 25
        date: '1966-04-25'
        thread: china
        also: [indonesia]
        c: 'Foreign Ministry note to the Indonesian embassy: the strongest protest at Indonesian forces and thugs seizing the Chinese embassy''s military attaché''s office, shooting at the embassy dormitory, and wrecking and looting. The note says the recent run of attacks and seizures of Chinese missions are wholly of the Indonesian government''s making, and demands the removal of the soldiers and thugs at once, compensation for all losses and sure safety for the missions and their staff.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 98 (Apr. 25, 1966).'
