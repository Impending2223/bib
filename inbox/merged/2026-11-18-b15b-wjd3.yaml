        thread: china
        also: [laos]
        c: The Foreign Ministry's statement strongly protests the savage act of U.S. aircraft, on Mar. 24, again wildly bombing Khang Khay and the quarters of the Chinese economic and cultural delegation in Laos, with heavy loss of the delegation's housing and property. The U.S. and its followers must bear all the consequences.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 91 (Mar. 25, 1966).'
