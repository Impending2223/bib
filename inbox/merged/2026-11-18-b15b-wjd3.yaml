  - add:
      entry:
        id: cal.1965-04-20.china
        when: Apr. 20
        date: '1965-04-20'
        thread: china
        also: [vietnam-hanoi]
        c: 'The Standing Committee of the National People''s Congress adopts a resolution wholly endorsing the four-point proposal of the Vietnamese National Assembly: (1) recognition of the Vietnamese people''s basic rights, independence, sovereignty, unity and territorial integrity; (2) while the peaceful reunification is awaited, with Vietnam divided for the time being into two zones, the military clauses of the 1954 Geneva agreement on Vietnam must be fully respected; (3) by the program of the Southern National Liberation Front, the South''s affairs are for the Southern people to settle, with no foreign interference; (4) peaceful reunification is for the Vietnamese people of both zones to settle themselves, with no foreign interference. The resolution warns that U.S. invasion of Vietnam is invasion of China, and the Chinese people cannot ignore it; they will give the Vietnamese people every aid they ask for in the common struggle.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 23–24 (Apr. 20, 1965).'
        tags: [polity:prc, polity:drv, polity:us]
        src:
          c: 56eba0ec
          rows:
            - 'w.zhonghua-renmin-gongheguo-waijiao 23–24: all'
