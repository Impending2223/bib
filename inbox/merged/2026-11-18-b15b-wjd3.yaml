        when: Jan. 13
        date: '1965-01-13'
        thread: china
        also: [korea, vietnam-hanoi]
        c: The government's statement condemns the U.S. for driving South Korea to send 2,000 troops into the war in South Vietnam. If the U.S. goes on widening the war until it is international, the Chinese government and people cannot but consider further their responsibility for peace in the region.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 3 (Jan. 13, 1965).'
        tags: [polity:prc, polity:rok, polity:us, polity:drv]
        src:
