        when: Oct. 9
        date: '1966-10-09'
        thread: china
        also: [laos]
        c: The Foreign Ministry's statement fully backs the Cambodian government's protest of Sept. 28 at the attack by U.S. and South Vietnamese helicopters on a frontier post, and its appeal to the peace- and justice-loving to stop the aggression; China will give every aid to the Cambodian people's struggle for sovereignty, neutrality and territorial integrity.
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 131 (Oct. 9, 1966).'
        tags: [polity:prc, polity:cambodia, polity:us, polity:rvn]
        src:
