        when: Sept. 9
        date: '1967-09-09'
        thread: china
        also: [japan]
        c: 'Wu Shudong, at a press conference, says that on the 8th and 9th the Japanese government sent out large numbers of police, agents and thugs, who beat several of the Liao Chengzhi Office''s staff and correspondents in Japan, and obstructed and wrecked their normal work, and the persecution has grown intolerable. He calls it a grave step in the Satō government''s anti-China policy, wrecking Sino-Japanese friendship and trade, and through the Takasaki office makes three demands: a public admission of error and no repeat; severe punishment of the police who used violence and those who set them on; and the right to ask more.'
        n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 173 (Sept. 9, 1967).'
        tags: [polity:prc, polity:japan]
