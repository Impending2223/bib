- add:
    entry:
      id: cal.1964-02-28.white-house
      when: Feb. 28
      date: '1964-02-28'
      thread: white-house
      c: Clifford brings Lady Bird Johnson and Jacqueline Kennedy together on the White House Historical Association, by Clifford's
        account. Lady Bird Johnson, in her first talk with Clifford as First Lady, had said she would carry on Jacqueline
        Kennedy's work. Jacqueline Kennedy later declines to have the garden behind the Oval Office named for her.
      n: '[[w.clifford-counsel-to-the-president-2]], 391–92. Check: the day of the garden''s refusal (Clifford: "Later").
        See [[cal.1961-11-03.white-house]]. Names: Clifford, Lady Bird Johnson, Jacqueline Kennedy.'
