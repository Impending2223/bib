patch: 2026-11-06-b6-clifford-counsel
by: Claude (batch 6 reader, Clifford with Holbrooke, Counsel to the President; R18 as amended Nov. 6, 2026)
ops:
- add:
    entry:
      id: cal.thread.white-house
      s: White House restoration
      c: The restoration of the White House's public rooms under Jacqueline Kennedy and its continuance under Lady Bird Johnson;
        the Fine Arts Committee, the White House Historical Association, the guidebook.
    section: th
    after: cal.thread.welfare
- add:
    entry:
      id: cal.1961-01-21.transition-and-staff
      when: Jan. 21
      date: '1961-01-21'
      thread: transition-and-staff
      c: 'The Alfalfa Club''s annual dinner, by Clifford''s account. Clifford its mock candidate for President, Bob Hope nominating
        him. Kennedy and Truman side by side; Johnson, most of the Supreme Court and nearly all the new Cabinet there. Kennedy:
        Clifford, asked his reward for the transition, wants only his law firm''s name on the back of the one-dollar bill.'
      n: '[[w.clifford-counsel-to-the-president-2]], 347–48. Names: Clifford, Kennedy, Truman, Johnson.'
      src:
        rows:
        - 'w.clifford-counsel-to-the-president-2 347–48: all'
        c: 3139d632
      tags:
      - name:clifford-clark
      - name:kennedy-john-f
      - name:truman-harry-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1961-02-06.white-house
      when: Feb. 6
      date: '1961-02-06'
      thread: white-house
      c: 'Lunch at the White House, Kennedy, Jacqueline Kennedy and Clifford, on her plans for the mansion, by Clifford''s
        account. Clifford: the White House is government property, "a sacred cow to the American people"; the legal ground
        to be laid first, the outcry over the Truman Balcony in mind. At Kennedy''s request Clifford and his partner Carson
        Glass draw the legal framework for her work.'
      n: '[[w.clifford-counsel-to-the-president-2]], 363–64. Names: Kennedy, Jacqueline Kennedy, Clifford.'
      src:
        rows:
        - 'w.clifford-counsel-to-the-president-2 363–64: all'
        c: 25be2dac
      tags:
      - name:kennedy-john-f
      - name:kennedy-jacqueline
      - name:clifford-clark
      short: the restoration begun
- add:
    entry:
      id: cal.1961-02-23.white-house
      when: Feb. 23
      date: '1961-02-23'
      thread: white-house
      c: 'Jacqueline Kennedy announces the Fine Arts Committee for the White House: to locate "authentic furniture of the
        date of the building of the White House" and raise funds to buy it as gifts. She its honorary chairman, Clifford its
        legal adviser. Some 75,000 letters offering gifts or sales within weeks.'
      n: '[[w.clifford-counsel-to-the-president-2]], 364. Names: Jacqueline Kennedy, Clifford.'
      src:
        rows:
        - 'w.clifford-counsel-to-the-president-2 364: all'
        c: 6cc393bc
      tags:
      - name:kennedy-jacqueline
      - name:clifford-clark
- add:
    entry:
      id: cal.1961-11-03.white-house
      when: Nov. 3
      date: '1961-11-03'
      thread: white-house
      c: The White House Historical Association incorporated, a nonprofit to raise money beyond the Fine Arts Committee's
        reach. Its incorporators John Walker, of the National Gallery, David Finley, of the Commission of Fine Arts, and Clifford.
        Jacqueline Kennedy's idea, a guidebook, to fund it; Clifford against her first, postcards.
      n: '[[w.clifford-counsel-to-the-president-2]], 366. See [[cal.1961-02-23.white-house]]. Names: Clifford, Jacqueline
        Kennedy.'
      src:
        rows:
        - 'w.clifford-counsel-to-the-president-2 366: all'
        c: 545df87e
      tags:
      - name:clifford-clark
      - name:kennedy-jacqueline
      short: the Historical Association
- add:
    entry:
      id: cal.1962-01-15.white-house
      when: Jan. 15
      date: '1962-01-15'
      thread: white-house
      c: 'Jacqueline Kennedy to Clifford, a handwritten letter: find legal ways to raise money for works of art without a
        political problem for her husband. Jayne Wrightsman would announce a goal of $2 million; "Jack and I agree that figure
        sounds awful. It could be politically used against us." The drive as soon as possible after her television tour.'
      n: '[[w.clifford-counsel-to-the-president-2]], 365 (the letter quoted; it gives the broadcast as Feb. 16). See [[cal.1961-11-03.white-house]].
        Names: Jacqueline Kennedy, Clifford.'
      src:
        rows:
        - 'w.clifford-counsel-to-the-president-2 365: all'
        - 'via x.1962-01-15.jacqueline-kennedy-to-clifford: all'
        c: 79b570ee
      tags:
      - name:kennedy-jacqueline
      - name:clifford-clark
- add:
    entry:
      id: cal.1962-05.white-house
      when: May
      date: 1962-05
      thread: white-house
      also:
      - press-and-broadcasting
      c: 'Reporters on a report of a deal over an expensive piece of furniture between an antique dealer and an employee of
        the Smithsonian. Jacqueline Kennedy to Clifford, a note written on a plane and talking points, for him to take to
        Alfred Friendly, managing editor of the *Washington Post*, if the paper pursues it: "Tell him the public does know—its
        all been printed."'
      n: '[[w.clifford-counsel-to-the-president-2]], 365–66 (the note and the talking points quoted). Check: the day; whether
        the *Post* ran the story. See [[cal.1961-11-03.white-house]]. Names: Jacqueline Kennedy, Clifford.'
      src:
