- add:
    entry:
      id: cal.1963-11-03.white-house
      when: Nov. 3
      date: '1963-11-03'
      thread: white-house
      c: 'Jacqueline Kennedy to Clifford, a handwritten letter for the Historical Association''s next meeting: economy until
        it is out of the red; new curtains for the East Room, the silk already being woven; the State Dining Room''s only
        when the money is in, "but if we are no longer in the White House—could you try to see that it gets done."'
      n: '[[w.clifford-counsel-to-the-president-2]], 367–68 (the letter quoted). See [[cal.1961-11-03.white-house]]. Names:
        Jacqueline Kennedy, Clifford.'
      src:
        rows:
