- add:
    entry:
      id: cal.1962-03-29.vietnam-force-levels
      when: Mar. 29
      date: '1962-03-29'
      thread: vietnam-force-levels
      c: 'Clifton to McGeorge Bundy and Bromley Smith: Bundy to prod McNamara, on or about Apr. 1, on the readiness of the
        contingency planning Kennedy asked of the Joint Chiefs, for an emergency in South Vietnam and for infiltration from
        Laos. "An important item in this planning is the timing of a decision for U.S. action and the factors that go into
        such a decision."'
      n: '[[w.selverstone-kennedy-withdrawal]], 64. Check: whose words the quotation is: the work gives them as Kennedy''s
        ("As Kennedy indicated"), the note citing Clifton''s memorandum (64 n.61). To check: Clifton to Bundy and Smith, Mar.
        29, 1962, NSF, Box 320, Staff Memoranda, Chester Clifton, JFK Library (cited by [[w.selverstone-kennedy-withdrawal]],
        64 n.61). See [[cal.1962-03-01.vietnam]]. Names: Clifton, McGeorge Bundy, Bromley Smith, McNamara, John F. Kennedy.'
      tags:
      - name:clifton-chester-v-jr
      - name:bundy-mcgeorge
      - name:smith-bromley-k
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      src:
        c: 2c134833
        rows:
