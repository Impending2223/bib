- add:
    entry:
      id: cal.1963-10-07.vietnam-force-levels
      when: Oct. 7
      date: '1963-10-07'
      time: 1963-10-07T12:00Z
      thread: vietnam-force-levels
      c: 'White House staff meeting, 8 a.m. Bundy surprised that some take as "pollyanna-ish" the McNamara–Taylor statement
        that the United States could pull out in two years: two years "really a long time," the war by then longer than most
        wars in U.S. history. The line should Kennedy be asked: in two years the Vietnamese "will be able to finish the job
        without US military forces on the scene," a position all think reasonable. Bundy asks Forrestal for a NSAM.'
      n: 'Memorandum of White House staff meeting, [FRUS 1961–63, IV, doc. 187](https://history.state.gov/historicaldocuments/frus1961-63v04/d187)
        (Oct. 7, 1963, 8 a.m.). [[w.selverstone-kennedy-withdrawal]], 191 ("pollyana-ish"; Bundy then moves to NSAM 263).
        Made public: FRUS 1961–63, IV. See [[cal.1963-10-02.vietnam]]. Names: McGeorge Bundy, Forrestal, John F. Kennedy.'
      tags:
      - name:bundy-mcgeorge
      - name:forrestal-michael-v
      - name:kennedy-john-f
      src:
        c: 769fdaad
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d187: all'
        - 'w.selverstone-kennedy-withdrawal 191: all'
        - 'via w.selverstone-kennedy-withdrawal 191 n.48: all'
- add:
    entry:
      id: cal.1963-10-18.vietnam-force-levels
      when: Oct. 18
      date: '1963-10-18'
      thread: vietnam-force-levels
      c: 'Kattenburg to Hilsman on Defense''s proposed release: 1,000 military personnel to leave South Vietnam beginning
        in November; 16,730 there as of Oct. 30, Defense''s first official total. The ICC may cite the United States under
        the Geneva Accord''s ceiling of 888 advisers. Approval recommended.'
      n: '[FRUS 1961–63, IV, doc. 201](https://history.state.gov/historicaldocuments/frus1961-63v04/d201) (the source text''s
        note: "Action was to be by leak to press"). [[w.selverstone-kennedy-withdrawal]], 192 (the draft release, 16,730).
        Made public: FRUS 1961–63, IV. See [[cal.1963-10-02.vietnam]]. Names: Kattenburg, Hilsman.'
      tags:
      - name:kattenburg-paul-m
      - name:hilsman-roger
      src:
        c: 835b5076
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d201: all'
