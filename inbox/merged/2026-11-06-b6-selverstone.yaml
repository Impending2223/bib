        - 'via w.selverstone-kennedy-withdrawal 64 n.61: all'
- add:
    entry:
      id: cal.1962-04-26.vietnam
      when: Apr. 26
      date: '1962-04-26'
      thread: vietnam
      c: 'Ball and McGeorge Bundy by telephone, on a speech by Ball to cast the war as a Vietnamese affair. Bundy: a "good
        thing to do," Ball "a brave man to do it." Kennedy''s "only guidance," as Bundy relays it: public comment "in as low
        a key as possible—not excluding the notion that there would come a time we could back off if the others do."'
      n: '[[w.selverstone-kennedy-withdrawal]], 69. Check: the day of Kennedy''s guidance: the note cites the telephone call
        of Apr. 26, and Ball''s clearing the idea with the President two days later, Ball and Alexis Johnson by telephone,
        Apr. 28 (69 n.82). To check: Ball–Bundy telcon, Apr. 26, 1962, Ball Papers, Box 9, JFK Library (cited by [[w.selverstone-kennedy-withdrawal]],
        69 n.82a). See [[cal.1962-05-01.vietnam]]. Names: Ball, McGeorge Bundy, John F. Kennedy.'
      tags:
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:kennedy-john-f
      src:
        c: 4e7dc8c7
        rows:
        - 'w.selverstone-kennedy-withdrawal 69: all'
        - 'via w.selverstone-kennedy-withdrawal 69 n.82a: all'
- add:
    entry:
      id: cal.1963-01-21.vietnam
      when: Jan. 21
      date: '1963-01-21'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Salinger''s office: Salinger, Manning, Sylvester, Dungan and Donald Wilson, at the Special Group (CI)''s charge,
        on the press''s coverage of Vietnam. Mecklin''s memorandum read: the policy of leaving the press to the Vietnamese
        to be reviewed. "Favorable accounts" of the situation to be given "to the right press men under the right circumstances":
        Felt''s news conference, Wheeler''s statement on his return.'
      n: 'Wilson to Murrow, Jan. 30, 1963, [FRUS 1961–63, III, doc. 23](https://history.state.gov/historicaldocuments/frus1961-63v03/d23).
        [[w.selverstone-kennedy-withdrawal]], 105. Made public: FRUS 1961–63, III. See [[cal.1963-01-30.vietnam-force-levels]].
        Names: Salinger, Manning, Sylvester, Dungan, Donald Wilson, Mecklin, Felt, Wheeler.'
      tags:
      - name:salinger-pierre
      - name:manning-robert-j
      - name:sylvester-arthur
      - name:dungan-ralph-a
      - name:wilson-donald-m
