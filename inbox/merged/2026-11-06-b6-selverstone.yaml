      c: '*Life* makes Vietnam its "Story of the Week": "Far Off War We Have Decided to Win," and Scot Leavitt''s "Dilemma
        for U.S.: Clever Adversary, a Difficult Friend," with photographs of American helicopters over Vietnam. The United
        States "committed to win."'
      n: '[[w.selverstone-kennedy-withdrawal]], 69. To check: *Life*, Mar. 16, 1962, 36–43 (cited by [[w.selverstone-kennedy-withdrawal]],
        69 n.81a).'
