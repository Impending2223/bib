patch: b3-sorensen-2
by: 'Claude (batch 3 reading, resumed: Sorensen, Kennedy), Nov. 4, 2026'
ops:
- add:
    entry:
      id: cal.1960-03.elections-1960-2
      when: Mar.
      date: 1960-03
      thread: elections-1960
      c: Shortly before New Hampshire's primary. Governor Wesley Powell, Nixon's campaign manager in the State, denounces
        Kennedy as "soft" on Communism. Nixon says he did not approve of the attack, before it or after; he congratulates
        Powell on the Republican turnout.
      n: '[[w.sorensen-kennedy]], 133. See [[cal.1960-03-08.elections-1960]]. Names: Powell, Kennedy, Nixon. Check: the day,
        before the primary of Mar. 8.'
      tags:
      - name:powell-wesley
      - name:kennedy-john-f
      - name:nixon-richard-m
      - state:nh
      src:
        c: 45c5438d
        rows:
        - 'w.sorensen-kennedy 133: all'
- add:
    entry:
      id: cal.1960-05.elections-1960-13
      when: May
      date: 1960-05
      thread: elections-1960
      c: West Virginia. Kennedy and Humphrey debate on television, Kennedy behind and hoping for a breakthrough; he would
        not debate Humphrey in Wisconsin. One sharp exchange, on the "stop-Kennedy gang-up." Kennedy holds up a surplus food
        package. By Sorensen's account, local papers in the next days show votes switching to Kennedy.
      n: '[[w.sorensen-kennedy]], 140–41. See [[cal.1960-04-21.elections-1960]]. Names: Kennedy, Humphrey. Check: the day,
        before the primary of May 10.'
      tags:
      - name:kennedy-john-f
      - name:humphrey-hubert-h
      - state:wv
      src:
        c: 0925ee0b
        rows:
        - 'w.sorensen-kennedy 140–41: all'
- add:
    entry:
      id: cal.1960-05.elections-1960-7
      when: May
      date: 1960-05
      thread: elections-1960
      c: 'Senator Byrd of West Virginia, for Johnson, endorses Humphrey for the May 10 primary: "If you are for Adlai Stevenson,
        Senator Stuart Symington, Senator Johnson or John Doe, this primary may be your last chance to stop Kennedy." Kennedy:
        West Virginians should be more interested in stopping Nixon.'
      n: '[[w.sorensen-kennedy]], 141. See [[cal.1960-04-21.elections-1960]]. Names: Robert Byrd, Humphrey, Kennedy. Check:
        the day.'
      tags:
      - name:byrd-robert-c
      - name:humphrey-hubert-h
      - name:kennedy-john-f
      - state:wv
      src:
        c: 3a1c15c3
        rows:
        - 'w.sorensen-kennedy 141: all'
- add:
    entry:
      id: cal.1960-05.elections-1960-11
      when: May
      date: 1960-05
      thread: elections-1960
      c: 'West Virginia. Franklin D. Roosevelt Jr., driving through the State, to an interviewer: Humphrey "a good Democrat,
        but I don''t know where he was in World War II." Headlined. Kennedy and Roosevelt later apologize to Humphrey.'
      n: '[[w.sorensen-kennedy]], 141–42. See [[cal.1960-04-21.elections-1960]]. Names: Franklin D. Roosevelt Jr., Humphrey,
        Kennedy. Check: the day, before the primary of May 10.'
      tags:
      - name:roosevelt-franklin-d-jr
      - name:humphrey-hubert-h
      - name:kennedy-john-f
      - state:wv
      src:
        c: 1e5ff8ef
        rows:
        - 'w.sorensen-kennedy 141–42: all'
- add:
    entry:
      id: cal.1960-07-11.elections-1960-5
      when: July 11
      date: '1960-07-11'
      thread: elections-1960
      c: Los Angeles, as the convention opens. Mrs. Roosevelt hopes Kennedy's "unselfishness and courage" will lead him to
        take the Vice Presidency, "the opportunity to grow and learn"; Negroes, she says, will not vote for him.
      n: '[[w.sorensen-kennedy]], 155 (an earlier column of Lippmann''s, the same). See [[cal.1960-07-11.elections-1960]].
        Names: Eleanor Roosevelt, Kennedy. Check: the day; Sorensen: "as the convention opened on Monday, July 11."'
      tags:
      - name:roosevelt-eleanor
      - name:kennedy-john-f
      src:
        c: 793c2d1f
        rows:
        - 'w.sorensen-kennedy 155: all'
- add:
    entry:
      id: cal.1960-07-11.elections-1960-6
      when: July 11
      date: '1960-07-11'
      thread: elections-1960
      c: Los Angeles, as the convention opens. Humphrey, never formally committed, announces he is "switching" from Kennedy
        to Stevenson out of "concern for my country."
      n: '[[w.sorensen-kennedy]], 155. See [[cal.1960-07-11.elections-1960]]. Names: Humphrey, Kennedy, Stevenson. Check:
        the day; Sorensen: "as the convention opened on Monday, July 11."'
      tags:
      - name:humphrey-hubert-h
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      src:
        c: 4c429e78
        rows:
        - 'w.sorensen-kennedy 155: all'
- add:
    entry:
      id: cal.1960-07.elections-1960-10
      when: July
      date: 1960-07
      thread: elections-1960
      c: Los Angeles, before the balloting. For Johnson, John Connally and India Edwards cast doubt on Kennedy's physical
        fitness; other Johnson men call Joseph Kennedy anti-Semitic and soft on Hitlerism. Adam Clayton Powell endorses Johnson.
        A $50,000 campaign of full-page advertisements for Johnson.
      n: '[[w.sorensen-kennedy]], 156. See [[cal.1960-07-11.elections-1960]]. Names: Connally, Kennedy, Johnson, Joseph P.
        Kennedy, Adam Clayton Powell. Check: the days.'
      tags:
      - name:connally-john
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:kennedy-joseph-p
      - name:powell-adam-clayton-jr
      src:
        c: 88f68147
        rows:
        - 'w.sorensen-kennedy 156: all'
- add:
    entry:
      id: cal.1960-08.elections-1960-8
      when: Aug.
      date: 1960-08
      thread: elections-1960
      c: Hyde Park, N.Y. Kennedy calls on Mrs. Roosevelt and has her support.
      n: '[[w.sorensen-kennedy]], 170 (between the convention and Labor Day). Names: Kennedy, Eleanor Roosevelt. Check: the
        day; Kennedy spoke at Hyde Park on Aug. 14, the Social Security Act''s twenty-fifth anniversary ([Speech, Hyde Park,
        NY](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-memorial-program-25th-anniversary-signing-social-security),
        APP, not read).'
      tags:
      - name:kennedy-john-f
      - name:roosevelt-eleanor
      src:
        c: c58f8aa3
        rows:
        - 'w.sorensen-kennedy 170: all'
- cite:
    id: cal.1960-08-20.elections-1960
    item: '[[w.sorensen-kennedy]], 170 (the visit; Truman''s support secured)'
- add:
    entry:
      id: cal.1960-08.elections-1960-9
      when: Aug.
      date: 1960-08
      thread: elections-1960
      c: 'The networks'' concrete offer of joint appearances, after Nixon''s nomination. Kennedy accepts at once, with a challenge
        to Nixon; Nixon four days later. The original proposal: four hours of straight debate and four of joint panel interviews;
        Nixon for three confrontations or fewer, no prepared texts. Reinsch and Sorensen negotiate for Kennedy.'
      n: '[[w.sorensen-kennedy]], 196. See [[cal.1960-08-24.press-and-broadcasting]]. Names: Kennedy, Nixon, Sorensen. Check:
        the day; Sorensen has the offer "in August, immediately after" Nixon''s nomination of July 27.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      - name:sorensen-theodore-c
      src:
        c: a6531bdd
        rows:
        - 'w.sorensen-kennedy 196: all'
- add:
    entry:
      id: cal.1960-08.elections-1960-10
      when: Aug.
      date: 1960-08
      thread: elections-1960
      also:
      - defense
      c: 'Late in the month. Kennedy flies to Strategic Air Command headquarters in Omaha for a briefing the Administration
        arranges; not given the full top-secret account of Soviet and American missile and bomber strength. Kennedy: he had
        more as a member of Foreign Relations; he will remember it at appropriation time.'
      n: '[[w.sorensen-kennedy]], 612. See [[cal.1960-07-23.elections-1960]]. Names: Kennedy. Check: the day; Sorensen: "late
        in August."'
      tags:
      - name:kennedy-john-f
      src:
        c: b899659a
        rows:
        - 'w.sorensen-kennedy 612: all'
- add:
    entry:
      id: cal.1960-09.elections-1960-4
      when: Sept.
      date: 1960-09
      thread: elections-1960
      c: 'Several papers drop Peale''s column. Peale withdraws from the "Peale group," by form letter: no relationship with
        it "except attendance upon this one meeting"; the press unfair to emphasize him "without reference to any of the [other]
        150 persons present."'
      n: '[[w.sorensen-kennedy]], 189. See [[cal.1960-09-07.elections-1960]]. Names: Peale. Check: the day.'
      tags:
      - name:peale-norman-vincent
      src:
        c: b1e27da0
        rows:
        - 'w.sorensen-kennedy 189: all'
- add:
    entry:
      id: cal.1960-10.elections-1960-9
      when: Oct.
      date: 1960-10
      thread: elections-1960
      c: Feldman, in Washington, obtains copies of the USIA's secret surveys of American prestige abroad, from a source outside
        the agency; the Administration had refused them to Congress. Kennedy gives them to the *New York Times*, which prints
        them without saying how they were had. An Eisenhower aide asks Allen of the USIA for a statement that prestige is
        at a record high; Allen refuses.
      n: '[[w.sorensen-kennedy]], 203–04. Names: Feldman, Kennedy, Eisenhower. Check: the day; the *Times*''s story.'
      tags:
      - name:feldman-myer
      - name:kennedy-john-f
      src:
        c: 0762c0db
        rows:
        - 'w.sorensen-kennedy 203–04: all'
- add:
    entry:
      id: cal.1960-10.elections-1960-10
      when: Oct.
      date: 1960-10
      thread: elections-1960
      c: 'Hyannis Port, one long October day. Kennedy''s strategy session with the whole top team from Washington: to identify
        Nixon with Republicanism, not with Eisenhower.'
      n: '[[w.sorensen-kennedy]], 187. Names: Kennedy. Check: the day.'
      tags:
      - name:kennedy-john-f
      src:
        c: 73a7a1ee
        rows:
        - 'w.sorensen-kennedy 187: all'
- add:
    entry:
      id: cal.1960-10-10.elections-1960-2
      when: Oct. 10
      date: '1960-10-10'
      thread: elections-1960
      c: Kennedy to NBC and ABC, by telegram, on a fifth debate. The staffs' negotiations come to nothing; his telegrams and
        statements on Nixon's refusal run to the campaign's end.
      n: '[Telegram to NBC and ABC on Fifth Debate](https://www.presidency.ucsb.edu/documents/telegram-from-senator-john-f-kennedy-nbc-and-abc-fifth-debate)
        (Oct. 10, 1960; APP, not read: the day); [Statement on Fifth Debate, Dayton, Ohio](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-fifth-debate-dayton-ohio)
        (Oct. 17); [Telegram to Nixon on Fifth Debate](https://www.presidency.ucsb.edu/documents/text-telegram-vice-president-richard-m-nixon-from-senator-john-f-kennedy-fifth-debate)
        (Oct. 23); [Telegram, Hazleton, Pa., to Nixon on Fifth Debate](https://www.presidency.ucsb.edu/documents/telegram-from-senator-john-f-kennedy-hazleton-pa-vice-president-richard-m-nixon-fifth)
        (Oct. 28). [[w.sorensen-kennedy]], 206 (the call, the negotiations, the telegrams; no days). Names: Kennedy, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      src:
        c: 12ebae36
        rows:
        - 'w.sorensen-kennedy 206: all'
- add:
    entry:
      id: cal.1960-10-17.elections-1960-3
      when: Oct. 17
      date: '1960-10-17'
      thread: elections-1960
      c: 'Springfield, Ohio, Wittenberg College. Kennedy on ethics in government: "Campaign contributions will not be regarded
        as a substitute for training and experience for diplomatic positions."'
      n: '[Speech, Wittenberg College Stadium, Springfield, Ohio](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-wittenberg-college-stadium-springfield-ohio)
        (Oct. 17, 1960; APP, not read: the day). [[w.sorensen-kennedy]], 174 (the speech and the pledge; of twenty-seven noncareer
        chiefs of mission appointed, twenty no known contributors). Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 6f5e5fb2
        rows:
        - 'https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-wittenberg-college-stadium-springfield-ohio:
          A'
        - 'w.sorensen-kennedy 174: all'
        - 'via x.1960-10-17.kennedy-speech-wittenberg-college: B'
- add:
    entry:
      id: cal.1960-10.elections-1960-11
      when: Oct.
      date: 1960-10
      thread: elections-1960
      c: 'The closing weeks. Puerto Rico''s Catholic bishops direct the island''s Catholics to vote against Governor Muñoz
        Marín and his Popular Democratic Party: birth control instruction, common-law marriage, religious education. Denver''s
        Methodist bishop: "I shall not mark my ballot for a Roman Catholic candidate." Kennedy to Sorensen: "If enough voters
        realize that Puerto Rico is American soil, this election is lost."'
      n: '[[w.sorensen-kennedy]], 209 (Puerto Rico votes for Muñoz Marín, n.9). Names: Kennedy, Sorensen. Check: the day of
        the letter.'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      src:
        c: fd6c46ba
        rows:
        - 'w.sorensen-kennedy 209: all'
- add:
    entry:
      id: cal.1961-01.right-and-the-military
      when: Jan.
      date: 1961-01
      thread: right-and-the-military
      c: Kennedy's first week. A strong anti-Soviet speech of Admiral Burke's, Chief of Naval Operations, toned down in the
        White House lest it upset the RB-47 fliers' release; outcry over "muzzling" the military. By Sorensen's account, Burke
        had submitted the speech himself, and the review was not unusual.
      n: '[[w.sorensen-kennedy]], 286. See [[cal.1962-01-23.right-and-the-military]]. Names: Kennedy, Burke. Check: the day;
        the speech.'
      tags:
      - name:kennedy-john-f
      - name:burke-arleigh-a
      src:
        c: 2aa5e2aa
        rows:
        - 'w.sorensen-kennedy 286: all'
- add:
    entry:
      id: cal.1961-03.economy
      when: Mar.
      date: 1961-03
      thread: economy
      c: 'Kennedy rules against a public works bill in 1961: too slow against the recession, and an addition to the deficit
        while he asks for more defense money, which must serve instead. Goldberg for a fight even if lost: Frost had told
        Kennedy to be "more Irish than Harvard." Kennedy: "As President, I have to be both Harvard and Irish." He promises
        Goldberg and labor a more careful bill next year.'
      n: '[[w.sorensen-kennedy]], 398. Names: Kennedy, Goldberg, Frost. Check: the month; Sorensen: "the spring."'
      tags:
      - name:kennedy-john-f
      - name:goldberg-arthur-j
      - name:frost-robert
      src:
        c: b1d17e5e
        rows:
        - 'w.sorensen-kennedy 398: all'
- add:
    entry:
      id: cal.1961-04.cuba-bay-of-pigs-6
      when: Apr.
      date: 1961-04
      thread: cuba-bay-of-pigs
      c: 'The week before the landing. Kennedy in a television interview: "If we don''t move now, Mr. Castro may become a
        much greater danger than he is to us today."'
      n: '[[w.sorensen-kennedy]], 296. See [[cal.1961-04-04.cuba]]. Names: Kennedy, Castro. Check: the day and the interview.'
      tags:
      - name:kennedy-john-f
      - name:castro-fidel
      src:
        c: 9156c478
        rows:
        - 'w.sorensen-kennedy 296: all'
- add:
    entry:
      id: cal.1961-09.steel
      when: Sept.
      date: 1961-09
      thread: steel
      c: Kennedy with Blough of U.S. Steel, on the coming contract.
      n: '[[w.sorensen-kennedy]], 445 ("the previous September"). See [[cal.1961-09-06.steel]]. Names: Kennedy, Blough. Check:
        the day, and what was said; Sorensen gives the meeting only.'
      tags:
      - name:kennedy-john-f
      - name:blough-roger-m
      src:
        c: dc51f0e6
        rows:
        - 'w.sorensen-kennedy 445: all'
- add:
    entry:
      id: cal.1962-02-14.labor
      when: Feb. 14
      date: '1962-02-14'
      thread: labor
      also:
      - economy
      c: 'Rose Garden, 9:45 a.m. Kennedy to the policy committee of the Communications Workers, Beirne their president, in
        Washington to settle their bargaining position: "I want to commend you for the responsible way that you are moving
        towards your assignment." Heller had talked with them the day before.'
      n: 'Remarks to the Policy Committee of the Communications Workers of America, [1962 Pub. Papers 132](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=192)
        (Feb. 14, 1962). [[w.sorensen-kennedy]], 438 (the call to meet their responsibility to the country). Names: Kennedy,
        Heller.'
      tags:
      - name:kennedy-john-f
      - name:heller-walter-w
      src:
        c: 4b7edf4d
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=192: all'
        - 'w.sorensen-kennedy 438: A-B'
- add:
    entry:
      id: cal.1962-04.steel
      when: Apr.
      date: 1962-04
      thread: steel
      c: After the rescission. In a brief meeting with Robert Kennedy and Sorensen, Kennedy decides against seeking a break-up
        of U.S. Steel in the courts, as some urge; nor will he back Kefauver's move to cite for contempt steel witnesses who
        refuse cost data. The white paper buried; the "tough-talk" press conferences canceled. A presidential panel on steel
        prices considered, and rejected.
      n: '[[w.sorensen-kennedy]], 459. See [[cal.1962-04-13.steel]]. Names: Kennedy, Robert Kennedy, Sorensen, Kefauver. Check:
        the day.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:sorensen-theodore-c
      - name:kefauver-estes
      src:
        c: 62d57700
        rows:
        - 'w.sorensen-kennedy 459: all'
- add:
    entry:
      id: cal.1962-07.economy-4
      when: July
      date: 1962-07
      thread: economy
      c: Margin requirements on stock purchases lowered to 50 percent, quietly, some six weeks after the market's fall of
        May 28. By late October the market rising again.
      n: '[[w.sorensen-kennedy]], 424. See [[cal.1962-05-29.economy]]. Check: the day, and the Federal Reserve''s record.'
      src:
        c: e1a3fe38
        rows:
        - 'w.sorensen-kennedy 424: all'
- add:
    entry:
      id: cal.1962-12.economy
      when: Dec.
      date: 1962-12
      thread: economy
      c: 'Palm Beach, over the holidays: the annual planning sessions. The tax bill hammered out, with the Budget and the
        debt limit; the internal arguments largely gone.'
      n: '[[w.sorensen-kennedy]], 429. See [[cal.1962-12-14.economy]]. Names: Kennedy. Check: the days.'
      tags:
      - name:kennedy-john-f
      src:
        c: 3c3dc5b1
        rows:
        - 'w.sorensen-kennedy 429: all'
- add:
    entry:
      id: cal.1963-01.economy-2
      when: Jan.
      date: 1963-01
      thread: economy
      c: 'Kennedy''s chart session with the congressional Democrats on the budget: four-fifths of its increases for defense,
        space and the costs of past or future wars; the rest loans to farmers and small business, education, conservation,
        urban renewal, area redevelopment.'
      n: '[[w.sorensen-kennedy]], 420. Names: Kennedy. Check: the day.'
      tags:
      - name:kennedy-john-f
      src:
        c: 3b2a12c8
        rows:
        - 'w.sorensen-kennedy 420: all'
- add:
    entry:
      id: cal.1963-10.poverty
      when: Oct.
      date: 1963-10
      thread: poverty
      c: Kennedy, moved by a *New York Times* story on families in eastern Kentucky, directs a special federal program for
        their relief, and plans to tour the area. That fall he orders a new federal antipoverty program drawn up.
      n: '[[w.sorensen-kennedy]], 404. See [[cal.1963-11-19.poverty]]. Names: Kennedy. Check: the month; Sorensen: "in the
        fall of 1963"; the *Times*''s story.'
      tags:
      - name:kennedy-john-f
      - state:ky
      src:
        c: 687b8c18
        rows:
        - 'w.sorensen-kennedy 404: all'
