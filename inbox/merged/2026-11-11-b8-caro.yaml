patch: 2026-11-11-b8-caro
by: 'Claude (batch 8: Caro, The Passage of Power, the "already in" rows read by the card), Nov. 11, 2026'
ops:
- add:
    entry:
      id: cal.1961-08-16.rules
      when: Aug. 16
      date: '1961-08-16'
      thread: rules
      c: Rayburn tells the House he is returning to Texas for medical treatment.
      n: '[[w.caro-passage-of-power]], 190. To check: the Congressional Record, Aug. 16, 1961 (Rayburn''s remarks); [[w.hardeman-rayburn]]. Names: Rayburn.'
      tags: [name:rayburn-sam]
- add:
    entry:
      id: cal.1960-07-13.elections-1960-los-angeles-2
      when: July 13
      date: '1960-07-13'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the Sports Arena, the convention gaveled to order at 3 p.m. Rayburn makes the first nominating speech, for Johnson: "a poor boy who dreamed great dreams." Johnson watches it on television in his suite.'
      n: '[[w.caro-passage-of-power]], 106–07. Names: Rayburn, Johnson. Check: the hour of the speech.'
      tags: [name:rayburn-sam, name:johnson-lyndon-b]
- add:
    entry:
      id: cal.1960-07-13.elections-1960-los-angeles-3
      when: July 13
      date: '1960-07-13'
      thread: elections-1960-los-angeles
      c: 'Early evening, the nominating speeches running on. Johnson, a delegate count in his pocket showing Kennedy "just barely" enough, telephones Connally at the Texas standard: have the chairman, Collins, recess after the speeches and put the voting off to the next day. Connally asks; Collins refuses at once.'
      n: '[[w.caro-passage-of-power]], 107. See [[cal.1960-07-13.elections-1960-los-angeles-2]]. Names: Johnson, Kennedy, Connally, Collins. Check: the hour.'
      tags: [name:johnson-lyndon-b, name:kennedy-john-f, name:connally-john, name:collins-leroy]
- add:
    entry:
      id: cal.1963-11-22.civil-rights-bill-2
      when: Nov. 22
      date: '1963-11-22'
      thread: civil-rights-bill
      c: 'Morning, about the time Kennedy speaks at Fort Worth. McCormack asks Smith when Rules will take up and report the civil rights bill. Smith: no time for hearings before the Christmas recess; they begin after Congress reconvenes. McCormack offers to keep the bill off the floor until January in return for hearings before the recess; Smith agrees to nothing, not even a date in January.'
      n: '[[w.caro-passage-of-power]], 463 (the bargain undated). To check: Johnson to McCormack, Nov. 29, "He won''t give you a hearing of any kind [before the recess]?" "No." (cited at 463); whether it is the call of [[cal.1963-11-29.assassination-6]]. See [[cal.1963-11-21.civil-rights-bill]]. Names: McCormack, Smith, Kennedy. Check: the day of the bargain.'
      tags: [name:mccormack-john-w, name:smith-howard-w, name:kennedy-john-f]
- cite:
    id: cal.1960-04-05.elections-1960
    item: '[[w.caro-passage-of-power]], 84 (Kennedy wins Wisconsin, Apr. 5; his margin over Humphrey not decisive, the vote from four Catholic districts, Humphrey''s from four Protestant; not the figures)'
    units: A, C
- cite:
    id: cal.1960-05-10.elections-1960
    item: '[[w.caro-passage-of-power]], 84, 86 (West Virginia, May 10: Kennedy over Humphrey with more than 60 percent of the vote; not Nebraska nor the unpledged delegates)'
    units: D
- cite:
    id: cal.1960-07-13.elections-1960
    item: '[[w.caro-passage-of-power]], 107 (the roll call from about 9:15: Kennedy 806, Johnson 409, the others together 306; Wyoming''s fifteen votes putting Kennedy over, at 763; not Symington''s and Stevenson''s totals, nor the 761)'
    units: A
- cite:
    id: cal.1960-12-19.elections-1960
    item: '[[w.caro-passage-of-power]], 154 (the Electoral College meets Dec. 19, in passing; not the vote)'
    units: A
- cite:
    id: cal.1961-08-31.rules
    item: '[[w.caro-passage-of-power]], 190–91 (ill; tells the House Aug. 16, [[cal.1961-08-16.rules]], that he is going to Texas for treatment; leaves for Bonham "the next morning" after his letter of Aug. 30; not the return)'
    units: A
- check:
    id: cal.1961-08-31.rules
    text: 'Check: Caro, 190–91, dates the leaving the morning after Rayburn''s letter of Aug. 30, i.e. Aug. 31.'
- cite:
    id: cal.1962-10-20.missile-crisis
    item: '[[w.caro-passage-of-power]], 211 (Saturday, Oct. 20, the ExComm decides on the blockade, or "quarantine," over the Joint Chiefs'' call for immediate bombing; Robert Kennedy calls his brother in Chicago, who, "pleading a cold," comes home; at the White House pool the President accepts the recommendation)'
    units: A, B
- cite:
    id: cal.1962-10-24.missile-crisis
    item: '[[w.caro-passage-of-power]], 213 (Wednesday, Oct. 24, the ExComm at 10 a.m.: McCone announces that the Russian ships have stopped, "and might be starting to turn around"; not Rusk''s words)'
    units: A
- cite:
    id: cal.1962-10-22.missile-crisis-4
    item: '[[w.caro-passage-of-power]], 215 (twenty leaders in the Cabinet Room before the telecast, Johnson attending; Russell for invasion at once; Fulbright, a blockade "the worst of the alternatives"; not the photographs)'
    units: B, C
- cite:
    id: cal.1964-05-14.robert-kennedy
    item: '[[w.caro-passage-of-power]], 242–43 (May 14, 1964: his oral history with Martin; on Johnson, "mean, bitter, vicious"; not that it was the last session)'
    units: A
- cite:
    id: cal.1963-05-11.alabama
    item: '[[w.caro-passage-of-power]], 257 (Sunday, May 12, after the bombs at the house of King''s brother and at the motel, Kennedy back from Camp David for crisis meetings; the Second Infantry Division and the 82nd Airborne on alert; the papers drawn to federalize the Alabama Guard at a moment''s notice; not the day of the bombs, nor the television)'
    units: A, D
- cite:
    id: cal.1963-06-22.civil-rights-bill
    item: '[[w.caro-passage-of-power]], 262 (June 22, the Cabinet Room, twenty-nine civil rights leaders; not the march nor the Rose Garden)'
    units: A
- check:
    id: cal.1963-06-22.civil-rights-bill
    text: 'Check: Caro, 262, has the President leave the meeting early, for the trip to West Germany, and ask Johnson to preside; Robert Kennedy, with a boat to catch, has Louis Martin tell Johnson to cut it short.'
- cite:
    id: cal.1963-06-11.civil-rights-bill
    item: '[[w.caro-passage-of-power]], 266 (the televised address: civil rights "a moral issue," "as old as the scriptures and . . . as clear as the American Constitution"; Caro dates it June 13)'
    units: A, B
- check:
    id: cal.1963-06-11.civil-rights-bill
    text: 'Check: Caro, 266, dates the address June 13.'
- cite:
    id: cal.1963-11-20.vietnam
    item: '[[w.caro-passage-of-power]], 403 (the Honolulu conference of Nov. 20, where OPLAN 34-A was discussed and approved; not those present, Lodge''s hopes nor the aid)'
    units: A
- cite:
    id: cal.1963-11-21.civil-rights-bill
    item: '[[w.caro-passage-of-power]], 463 (Nov. 21, after a five-month battle in Judiciary, the bill reported out to Smith''s Rules Committee, not the floor)'
    units: A
- check:
    id: cal.1963-11-20.civil-rights-bill
    text: 'Check: Caro, 463, dates the report Nov. 21.'
- cite:
    id: cal.1963-12-28.europe-and-the-alliance
    item: '[[w.caro-passage-of-power]], 506–07 (the state visit of Dec. 28: Erhard met at Bergstrom, by helicopter to the ranch; Johnson and Erhard with only the interpreters present, Rusk and Schroeder with the staffs in the next room; the talk in a meadow; not the terms)'
    units: A
- cite:
    id: cal.1963-12-23.vietnam
    item: '[[w.caro-passage-of-power]], 533 (the evening of Dec. 23, Johnson to Valeo: "Do you want that to be another China? . . . Get me a memo on it"; "They''re worried about whether you''ve got a weak President or a strong President"; the memo asked of Mansfield)'
    units: A, B
- variant:
    id: cal.1963-12-23.vietnam
    unit: D
    witness: w.caro-passage-of-power
    reads: They're worried about whether you've got a weak President or a strong President
    at: '533'
- check:
    id: cal.1963-12-23.vietnam
    text: 'Check: Caro, 533, has Johnson ask Valeo for another memo from Mansfield, not Valeo''s own views.'
- cite:
    id: cal.1964-01-06.vietnam
    item: '[[w.caro-passage-of-power]], 533 (Mansfield''s second memo, undated: "neither do we want another Korea"; "We are close to the point of no return in Vietnam")'
    units: A, B
- cite:
    id: cal.1964-02-07.economy
    item: '[[w.caro-passage-of-power]], 557 (the Finance report finished Tuesday, Jan. 28, printed and filed with the Senate that day; the bill passed Feb. 7, three days before the House passed the civil rights bill; not Long, the votes nor the amendments)'
    units: A, B
- cite:
    id: cal.1964-02-26.civil-rights-bill
    item: '[[w.caro-passage-of-power]], 561 (the Southern attempt to refer the bill to Eastland''s Judiciary Committee ended by a 54–37 vote; not the day)'
    units: C, E
- check:
    id: cal.1964-02-26.civil-rights-bill
    text: 'Check: Caro, 561, has the bill arrive in the Senate Feb. 10.'
- cite:
    id: cal.1964-03-30.civil-rights-bill
    item: '[[w.caro-passage-of-power]], 563 (Russell''s maneuvers delay the bill''s becoming the pending business until Mar. 30, "when the filibuster began"; Humphrey the floor leader, Mansfield having declined)'
    units: A
- cite:
    id: cal.1964-06-10.civil-rights-bill
    item: '[[w.caro-passage-of-power]], 568 (cloture 71–29, June 10, after a filibuster of fifty-seven days, the longest in Senate history; Democrats 44 for, 23 against; Republicans 27 for, 6 against, Goldwater among them; not Byrd''s speech)'
    units: A
- cite:
    id: cal.1964-07-02.civil-rights-bill
    item: '[[w.caro-passage-of-power]], 569 (the bill released from Rules June 30, over Smith; the House debate July 1; passed the House July 2; signed that evening, eight days before the Republican convention; not the count, the East Room nor the statute)'
    units: A, B
- cite:
    id: cal.1964-03-10.elections-1964
    item: '[[w.caro-passage-of-power]], 583 (the first Democratic presidential primary, Mar. 10; Corbin organizing a write-in for Robert Kennedy; not the returns)'
    units: A
- cite:
    id: cal.1964-08-04.congress
    item: '[[w.caro-passage-of-power]], 593 n. (Salinger, the Democratic nominee, appointed to the seat after Engle died July 30; not Brown, nor the day of the appointment)'
    units: A, B
