patch: 2026-11-12-b12-ussr-1960-61
by: 'Claude (batch 12 audit, Nov. 12, 2026, of the reader''s patch 2026-11-12-b12-ussr-1960-61; vols. I and III read again: I, 415–532, 1068–93; III, 71–232, 992–93) after Claude (batch 12, USSR 1960–61: *Prezidium TsK KPSS 1954–1964*, I, Malin''s notes and the stenograms of 1960–61, nos. 207–241; III, the resolutions and documents of 1960–61, docs. 207.0–241.2.4), Nov. 12–13, 2026'
ops:
# ---------------------------------------------------------------- new entries, 1960
- add:
    entry:
      id: cal.1960-01-07.soviet-union-leadership
      when: Jan. 7
      date: '1960-01-07'
      thread: soviet-union-leadership
      c: 'The Presidium on Kazakhstan. Brezhnev reports the Secretariat''s review of the republic''s leadership. Belyayev: "Критика в мой адрес правильна, с выводами согласен" (the criticism of me is right, I agree with the conclusions); the republic''s leaders against him: no collegiality, the grain left under the snow. Khrushchev: Belyayev overrated. In the continuation: his report untruthful, his conduct wrong in the Temirtau events; if Brezhnev is not sent, Kunaev first secretary, Rodionov second. Resolved: a plenum of the Kazakh Central Committee, Brezhnev to attend.'
      n: 'Protocol 258, item I. [[w.prezidium-tsk-kpss-1954]], I, 415–18 (Malin''s notes and the continuation of Jan. 7), 1068–69 nn.1–3, 8 (the editors: the Kazakh plenum of Jan. 19 relieved Belyayev, Kunaev elected first secretary, Rodionov second, Brezhnev there); III, 71 (P 258/I). Made public: 2003. Names: Brezhnev, Belyayev, Khrushchev, Kunaev, Rodionov.'
      tags: [name:brezhnev-leonid, name:belyayev-nikolai-i, name:khrushchev-nikita-s, polity:ussr]
- add:
    entry:
      id: cal.1960-01-13.soviet-union-leadership
      when: Jan. 13
      date: '1960-01-13'
      thread: soviet-union-leadership
      c: 'The Presidium on Gosplan. Back to the proposal of two planning bodies: the Committee (Kuzmin) the long-term plan, Gosplan the annual; Kosygin: the Committee unfit for such work as it stands. Khrushchev''s proposals on planning approved, a commission under Kozlov to propose measures within a month. Out of the protocol, on housing: Voroshilov: the houses badly built, the flats left empty; Khrushchev defends the Central Committee''s decision, the others with him; Kozlov: Voroshilov''s conduct and words "нетоварищескими, нелояльными и возмутительными" (uncomradely, disloyal and outrageous).'
      n: 'Protocol 259. [[w.prezidium-tsk-kpss-1954]], I, 420–21 (Malin''s notes), 1070 nn.1, 3; III, 74–75 (P 259/I). Made public: 2003. Names: Kuzmin, Kosygin, Khrushchev, Kozlov, Voroshilov.'
      tags: [name:kosygin-aleksei, name:khrushchev-nikita-s, name:kozlov-frol-r, name:voroshilov-kliment-e, polity:ussr]
- add:
    entry:
      id: cal.1960-02-25.soviet-union-leadership
      when: Feb. 25
      date: '1960-02-25'
      thread: soviet-union-leadership
      c: 'The Presidium, Suslov in the chair, on abolishing the income tax and the tax on bachelors and small families on wages. Suslov: another group, to 1,500 rubles, the whole done by 1965; Mikoyan: keep the bachelors'' tax; Furtseva: settle part now, leave wages alone. The line of the commission (Kozlov''s) approved, the draft to be reworked in two weeks.'
      n: 'Protocol 266, item III. [[w.prezidium-tsk-kpss-1954]], I, 437 (the notes in V. N. Chernukha''s pencil), 1073 nn.1–2 (Suslov presiding; the commission under Kozlov; the law of May 7, 1960); III, 106–16 (P 266/III; the commission''s note of Feb. 18; the drafts). Made public: 2003. Names: Suslov, Mikoyan, Furtseva, Kozlov.'
      tags: [name:suslov-mikhail-a, name:mikoyan-anastas, name:furtseva-yekaterina-a, name:kozlov-frol-r, polity:ussr]
- add:
    entry:
      id: cal.1960-02-09.soviet-union-leadership
      when: Feb. 9
      date: '1960-02-09'
      thread: soviet-union-leadership
      also: [south-asia]
      c: 'The Presidium on Voroshilov, Kozlov and Furtseva''s trip to India and Nepal. Kozlov: misunderstandings; with Nehru Voroshilov broke off the talk; he received the Chinese ambassador without consulting. Furtseva: Voroshilov spat on leaving the mausoleum. Kuznetsov: Voroshilov called him a toady. Gromyko: to the Italians Voroshilov said "никакого германского вопроса нет" (there is no German question). Khrushchev: no treaties with India, credits sympathetically, no sum yet. Voroshilov should himself ask to retire. The delegation''s work approved.'
      n: 'Protocol 263, item VI. [[w.prezidium-tsk-kpss-1954]], I, 435–36 (Malin''s notes), 1072 nn.1–5 (the visit Jan. 20–Feb. 6; the Taj Mahal, Jan. 22; Gronchi in Moscow Feb. 6–11); III, 106 (P 263/VI). Made public: 2003. Names: Voroshilov, Kozlov, Furtseva, Nehru, Kuznetsov, Gromyko, Khrushchev.'
      tags: [name:voroshilov-kliment-e, name:kozlov-frol-r, name:furtseva-yekaterina-a, name:nehru-jawaharlal, name:kuznetsov-vasily-v, name:gromyko-andrei, name:khrushchev-nikita-s, polity:ussr, polity:india, polity:italy]
- add:
    entry:
      id: cal.1960-03-03.soviet-union-leadership
      when: Mar. 3
      date: '1960-03-03'
      thread: soviet-union-leadership
      c: 'The Presidium approves the draft decree of the Central Committee and the Council of Ministers on the Moscow ring road: finished in 1962, not 1964, its eastern half in 1960; the Moscow Soviet to clear the route and rehouse its tenants.'
      n: '*Ob uskorenii stroitel''stva Moskovskoi kol''tsevoi avtomobil''noi dorogi*, P 267/IV, Mar. 3, 1960. [[w.prezidium-tsk-kpss-1954]], III, 77–80 (doc. 209.0.34 and the draft); I, 1070 n.2. On Jan. 28 (Protocol 261, item VI) the Moscow Soviet criticized for slowness, Gosplan and the city to build the road in the shortest time (I, 421; III, 75–77). Made public: 2003, 2008.'
      tags: [polity:ussr]
- add:
    entry:
      id: cal.1960-04-09.soviet-union-leadership
      when: Apr. 9
      date: '1960-04-09'
      thread: soviet-union-leadership
      c: 'Voroshilov receives Vasily Stalin, released early from prison: "ты должен стать другим человеком" (you must become another man); the reports of his drinking at Kislovodsk read to him, Timofeyev''s letter to Khrushchev among them; work if he stops drinking. Vasily: "Возьмите над мной шефство" (take me in your charge); asks for work. Recorded by Shcherbakov and Morozov.'
      n: '*Zapis'' besedy K. E. Voroshilova s V. I. Stalinym*, Apr. 9, 1960 (RGASPI, f. 558, op. 11, d. 1860), sent by Voroshilov to Khrushchev Apr. 13 for his opinion. [[w.prezidium-tsk-kpss-1954]], III, 119–24 (docs. 215.0.4, 215.0.5). Made public: 1993 (*Iosif Stalin v ob''yatiyakh sem''i*). Names: Voroshilov, Stalin, Timofeyev, Khrushchev, Shcherbakov, Morozov.'
      tags: [name:voroshilov-kliment-e, name:khrushchev-nikita-s, polity:ussr]
- add:
    entry:
      id: cal.1960-10-11.soviet-union-leadership
      when: Oct. 11
      date: '1960-10-11'
      thread: soviet-union-leadership
      c: 'The Presidium, Kozlov in the chair, on gross violations in livestock procurement in the RSFSR and Kazakhstan: cattle given the state farms in 1959 for fattening kept back, or handed in again against the 1960 meat plan. Ignatov: the facts true, adopt the paper now; Kozlov: "Либеральное решение" (a liberal decision). Aristov''s Bureau and Kunaev to find and punish the guilty; Kosygin and Ignatov to rework the draft decree.'
      n: 'Protocol 305, item V. [[w.prezidium-tsk-kpss-1954]], I, 443–44 (Malin''s notes), 1076 nn.1–3; III, 132 (P 305/V). Made public: 2003. Names: Kozlov, Ignatov, Aristov, Kunaev, Kosygin.'
      tags: [name:kozlov-frol-r, name:ignatov-nikolai-g, name:aristov-averky-b, name:kosygin-aleksei, polity:ussr]
- add:
    entry:
      id: cal.1960-10-21.soviet-union-leadership
      when: Oct. 21
      date: '1960-10-21'
      thread: soviet-union-leadership
      c: 'The Presidium, Khrushchev in the chair, on calling a plenum on agriculture: the year''s results and 1961. In the notes: last year''s pledges not met; perhaps new cadres, the old aging; the Agricultural Academy does nothing; weeds on the virgin lands, herbicides or clean fallow, "иначе дело придет к краху" (otherwise it will end in collapse). Resolved: a commission under Matskevich to prepare the plenum, a report from each republic; Kosygin''s group on the grain balance; the Secretariat to set the date.'
      n: 'Protocol 307, item I. [[w.prezidium-tsk-kpss-1954]], I, 446–47 (Malin''s notes), 1080 nn.1–2 (the plenum first set for Dec. 13, then Jan. 10, 1961); III, 133–34 (P 307/I). Made public: 2003. Names: Khrushchev, Matskevich, Kosygin.'
      tags: [name:khrushchev-nikita-s, name:kosygin-aleksei, polity:ussr]
- add:
    entry:
      id: cal.1960-12-13.soviet-union-leadership
      when: Dec. 13
      date: '1960-12-13'
      thread: soviet-union-leadership
      also: [china]
      c: 'The Presidium, Kozlov in the chair, on the results of the Moscow meeting of the parties. Mikoyan: no assessment of the Statement''s significance; Mukhitdinov: say more of Khrushchev''s speech, of Bucharest, of the cult of personality; Kosygin: circulate it, not publish; Polyansky: perhaps of the Albanians; Suslov: nothing of the cult. The draft resolution adopted: the delegation''s line under Khrushchev approved, the Statement and the Appeal binding in all the party''s work; the Secretariat to edit it, adopted if no objection.'
      n: 'Protocol 310, item I. [[w.prezidium-tsk-kpss-1954]], I, 447–48 (Malin''s notes), 1080–81 nn.1–5 (the meeting Nov. 11–25, 81 parties); III, 134–39 (P 310/I and the draft resolution, Dec. 12). Made public: 2003. Names: Kozlov, Mikoyan, Mukhitdinov, Khrushchev, Kosygin, Polyansky, Suslov.'
      tags: [name:kozlov-frol-r, name:mikoyan-anastas, name:mukhitdinov-nuritdin-a, name:khrushchev-nikita-s, name:kosygin-aleksei, name:polyansky-dmitri-s, name:suslov-mikhail-a, polity:ussr]
- add:
    entry:
      id: cal.1960-12-16.soviet-union-leadership
      when: Dec. 16
      date: '1960-12-16'
      thread: soviet-union-leadership
      also: [china]
      c: 'The enlarged Presidium on agriculture, stenographed, the republics'' leaders and Lysenko there. Khrushchev on his note: needs rising with wages, the economy to meet them; not to build communism on "moral factors" like the Chinese, "болтовня о коммунизме, а брюхо подтягивай" (talk of communism, and tighten your belly); irrigation and rice. In the notes: the Ukrainians first under fire, Poltava, Chernigov, Sumy; Georgia''s sheep; fraud in Ryazan; fewer museums and stadiums, no flowers for Moscow. Resolved: his proposals on farming and on reorganizing the Ministry of Agriculture approved; the republics to draft measures, Gosplan and Matskevich to sum them up.'
      n: 'Protocol 311, item I. [[w.prezidium-tsk-kpss-1954]], I, 448–49 (Malin''s notes), 450–74 (the stenogram; the Chinese, 453), 1081–82 nn.1–7 (the Ryazan pledges and Larionov); III, 139 (P 311/I). Made public: 2003. Names: Lysenko, Khrushchev, Matskevich.'
      tags: [name:khrushchev-nikita-s, polity:ussr, polity:prc]
# ---------------------------------------------------------------- new entries, 1961
- add:
    entry:
      id: cal.1961-01-20.soviet-union-leadership
      when: Jan. 20
      date: '1961-01-20'
      thread: soviet-union-leadership
      c: 'The Presidium. Khrushchev, out of the protocol, on the plenum''s results: take up the criticisms; the plan for farm machinery revised, Gitalov and Manukovsky brought in, Garst invited, Voronov at the head; feeds, transport, wages and incentives. Aristov out of the RSFSR Bureau, Voronov its deputy chairman; Abrasimov recalled from Warsaw, Aristov ambassador to Poland.'
      n: 'Protocol 314, items XL–XLI. [[w.prezidium-tsk-kpss-1954]], I, 479 (Malin''s notes), 1084–85 nn.1–6 (the plenum of Jan. 10–18; Garst''s letter of Nov. 29, 1960); III, 143 (P 314/XL, P 314/XLI). Made public: 2003. Names: Khrushchev, Gitalov, Manukovsky, Garst, Voronov, Aristov, Abrasimov.'
      tags: [name:khrushchev-nikita-s, name:voronov-gennady-i, name:aristov-averky-b, polity:ussr, polity:poland]
- add:
    entry:
      id: cal.1961-03-23.soviet-union-leadership
      when: Mar. 23
      date: '1961-03-23'
      thread: soviet-union-leadership
      c: 'The Presidium, Kozlov in the chair, on correcting the seven-year plan''s control figures for 1962–65: corrections upward, their sources not shown; are the figures real? Grishin: real wages and incomes lag; Kosygin: machine building needs 100 million tons of metal. Agreed: housing apart; a commission on real wages, "жалоб на зарплату нет, есть жалобы на недостаток мяса, молока, масла, на отсутствие жилья" (no complaints of wages; complaints of too little meat, milk, butter, of no housing); defense to Kozlov, Kosygin, Ustinov, Brezhnev and Polyansky. Resolved: the main lines, with the amendments, sent to the republics and ministries, not approved; their proposals by May 1, the draft decree by June 1.'
      n: 'Protocol 320, item I. [[w.prezidium-tsk-kpss-1954]], I, 494–95 (Malin''s notes), 1087 nn.1–2 (Kosygin, Zasyadko and Novikov''s note of Mar. 18); III, 158–60 (P 320/I; the Council of Ministers'' note of Mar. 18). Made public: 2003. Names: Kozlov, Grishin, Kosygin, Ustinov, Brezhnev, Polyansky.'
      tags: [name:kozlov-frol-r, name:kosygin-aleksei, name:brezhnev-leonid, name:polyansky-dmitri-s, polity:ussr]
- add:
    entry:
      id: cal.1961-06-29.soviet-union-leadership
      when: June 29
      date: '1961-06-29'
      thread: soviet-union-leadership
      c: 'The Presidium, Khrushchev in the chair, on the Albanian government''s continuing unfriendly acts: a representation to Tirana, by letter or note of the Foreign Ministry; Gromyko to draft it, to be sent on to the leaders of the socialist camp.'
      n: '*Voprosy po Albanii*, P 335/VII, June 29, 1961. [[w.prezidium-tsk-kpss-1954]], III, 219 (doc. 239.0; first printed in *KPSS i formirovanie sovetskoi politiki na Balkanakh*, Salonika, 2003, 308), 992 nn.1–2 (the note itself not in the file). See [[cal.1961-05-17.soviet-union]]. Made public: 2003. Names: Khrushchev, Gromyko.'
      tags: [name:khrushchev-nikita-s, name:gromyko-andrei, polity:ussr]
- add:
    entry:
      id: cal.1961-10-11.soviet-union-leadership
      when: Oct. 11
      date: '1961-10-11'
      thread: soviet-union-leadership
      c: 'By poll, the Presidium approves instructions to the Ambassador in Tirana, on Kuznetsov''s note of Oct. 6: the Albanian Foreign Ministry''s note and memoranda of Sept. 16, on fees for Albanian students and on their conduct, "изобилуют низкой клеветой" (abound in base slander) and will not be considered.'
      n: 'P 350/13, Oct. 11, 1961. [[w.prezidium-tsk-kpss-1954]], III, 219–20 (docs. 239.0.1–239.0.3; for: Brezhnev, Ignatov, Kozlov, Kosygin, Kuusinen, Mukhitdinov, Podgorny, Polyansky, Suslov, Furtseva, Shvernik; first printed at Salonika, 2003, 325–26). See [[cal.1961-10-07.soviet-union]]. Made public: 2003. Names: Kuznetsov.'
      tags: [name:kuznetsov-vasily-v, polity:ussr]
- add:
    entry:
      id: cal.1961-12-03.soviet-union-leadership
      when: Dec. 3
      date: '1961-12-03'
      thread: soviet-union-leadership
      c: 'A meeting at Khrushchev''s on the plan and the budget for 1962, kept as Protocol 7: Kozlov, Kosygin, Mikoyan, Rudnev, Ustinov, Ignatov, Novikov, Korovushkin, Garbuzov, Dymshits. Said: herbicides, tractors and corn combines for Siberia; better to sell goods for currency than gold; the Ust-Ilim and Sayan stations; plants perhaps bought in West Germany or Britain on credit; wages to be held down; the income tax''s abolition spread over the years, "Не бояться объяснить народу" (not to fear explaining to the people); students'' stipends cut.'
      n: 'Protocol 7, item 19. [[w.prezidium-tsk-kpss-1954]], I, 529–31 (Malin''s notes), 1092–93 nn.1–8 (the session of Dec. 15; the postponed tax cuts, Sept. 22, 1961). Made public: 2003. Names: Khrushchev, Kozlov, Kosygin, Mikoyan, Rudnev, Ustinov, Ignatov, Novikov, Korovushkin, Garbuzov, Dymshits.'
      tags: [name:khrushchev-nikita-s, name:kozlov-frol-r, name:kosygin-aleksei, name:mikoyan-anastas, name:ignatov-nikolai-g, name:dymshits-veniamin-e, polity:ussr, polity:frg, polity:uk]
- add:
    entry:
      id: cal.1961-12-15.soviet-union-leadership
      when: Dec. 15
      date: '1961-12-15'
      thread: soviet-union-leadership
      c: 'The Presidium, Kozlov in the chair. By poll, the Council of Ministers'' drafts approved: the State budget for 1962, revenue 80.3 billion rubles, 1.6 billion over expenditure; sick pay and sick notes.'
      n: '*O Gosudarstvennom byudzhete na 1962 god*, P 7/19, Dec. 15, 1961. [[w.prezidium-tsk-kpss-1954]], III, 221–22 (doc. 240.0 and the draft on sick pay; 221 n.a, adopted by poll), 992 n.1 (the session, Kozlov presiding, those present); I, 1092–93 nn.1, 5 (the session of Dec. 15, the resolution by poll; the figures, RGANI, f. 3, op. 18, d. 11). See [[cal.1961-12-03.soviet-union-leadership]]. Made public: 2003, 2008. Names: Kozlov.'
      tags: [name:kozlov-frol-r, polity:ussr]
- add:
    entry:
      id: cal.1961-12-28.soviet-union-leadership
      when: Dec. 28
      date: '1961-12-28'
      thread: soviet-union-leadership
      also: [china]
      c: 'The Presidium. Ponomarev''s report to the ideological meeting not to be named in the account or published. On the CPSU, the Chinese party and the Albanians: document No. 2192 and the answer to Aidit weak; why the ambassador was recalled to be explained; perhaps a letter to the Chinese Central Committee: "Почему мы на радость врагам должны расход[иться]?" (why should we part, to our enemies'' joy?). Resolved: three departments of the Central Committee to rework the instructions to the ambassadors where China is represented and to draft letters to the Chinese party, to Aidit and to the party organizations. On the economic agreement of June 19: Lysov to answer Li Qiang''s statement of Dec. 2; on Chervonenko''s proposal Skachkov to lead the talks; a joint communiqué, saying China asked for them.'
      n: 'Protocol 9, items XXVIII (I; XXXVIII in III) and XXII. [[w.prezidium-tsk-kpss-1954]], I, 531–32 (Malin''s notes), 1093 nn.1–2; III, 222–32 (P 9/XXXVIII; P 9/XXII, Lysov''s statement, the draft order, Skachkov''s note), 992 nn.1–7. Made public: 2003, 2008. Names: Ponomarev, Aidit, Lysov, Li Qiang, Chervonenko, Skachkov.'
      tags: [name:chervonenko-stepan-v, polity:ussr, polity:prc]
