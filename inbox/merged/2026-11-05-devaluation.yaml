        when: Oct. 19
        date: '1967-10-19'
        thread: economy
        c: 'Sterling. Walt Rostow to Johnson, 7:05 p.m., "Contingency Support for Sterling": the day''s rise in Bank rate "part of the last ditch British effort to hold the sterling rate"; Fowler asks $100 million more from the Exchange Stabilization Fund for market operations, $160 million on hand, the funds guaranteed against loss from devaluation. Deming, Okun, Daane and Fried concur.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 147](https://history.state.gov/historicaldocuments/frus1964-68v08/d147). Made public: FRUS 1964–68, VIII (1998). See [[cal.1966-07-29.europe-and-the-alliance]]. Names: Walt Rostow, Johnson, Fowler, Deming, Okun, Daane, Fried.'
