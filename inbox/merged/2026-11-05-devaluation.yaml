        when: Feb. 29
        date: '1968-02-29'
        thread: economy
        c: Ottawa, the Canadian dollar under pressure, draws $425 million from the Fund for the Bank of Canada's reserves.
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 185](https://history.state.gov/historicaldocuments/frus1964-68v08/d185) (editorial note). To check: *Current Economic Developments*, No. 801, Mar. 12, 1968, 4–6 (cited by FRUS 1964–68, VIII, doc. 185). See [[cal.1968-01-01.economy]].'
