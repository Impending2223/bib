  - add:
      entry:
        id: cal.1967-11-12.economy
        when: Nov. 12
        date: '1967-11-12'
        thread: economy
        c: 'Sterling. Fowler to Johnson, "Sterling Crisis": Callaghan''s aide Rickett and an official of the Bank of England with Fowler, Nov. 11: without long-term credit they may devalue "perhaps within a week"; $2 billion of short-term credit used, $600 to $800 million left. Letting the pound go "tempting," but "the risks for us are just too great": France might follow to force a rise in the price of gold; the dollar attacked, the gold market might explode. A package: $1.4 billion from the Fund, $1 billion in guaranteed sterling. The central bankers at Basel prefer a $3 billion standby.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 150](https://history.state.gov/historicaldocuments/frus1964-68v08/d150). [[w.gavin-gold-dollars-and-power]], 171 & n.10 (the package). Made public: FRUS 1964–68, VIII (1998). See [[cal.1967-10-19.economy-2]]. Names: Fowler, Johnson, Callaghan.'
        src:
          c: cec54287
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d150: all'
            - 'w.gavin-gold-dollars-and-power 171: F'
            - 'via w.gavin-gold-dollars-and-power 171 n.10: F'
        tags: [name:fowler-henry-h, name:johnson-lyndon-b, name:callaghan-james]
  - add:
      entry:
        id: cal.1967-11-13.economy
        when: Nov. 13
        date: '1967-11-13'
        thread: economy
        c: 'Sterling. Walt Rostow to Johnson, before Fowler at noon: without long-term credit the British may devalue within a week. "The main point is the risks for us are just too great to be worth the gamble"; a multilateral package, the IMF standby or bilateral credits and swaps, the last try. Johnson with Fowler, 1:05 to 2:10 p.m.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 151](https://history.state.gov/historicaldocuments/frus1964-68v08/d151) (drafted by Fried; its note: the Daily Diary for the meeting). [[w.gavin-gold-dollars-and-power]], 171 & nn.8–9 (Rostow''s words; Fowler, "The Gold Situation," Nov. 13: "The dollar will be affected strongly"). Made public: FRUS 1964–68, VIII (1998). To check: Fowler to Johnson, "The Gold Situation," Nov. 13, 1967, NSF, Gold Crisis, box 53, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 171 n.9). See [[cal.1967-11-12.economy]]. Names: Walt Rostow, Johnson, Fowler.'
        src:
          c: 5270d69b
          rows:
