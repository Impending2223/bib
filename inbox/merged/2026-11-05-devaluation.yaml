      entry:
        id: cal.1967-11-16.economy
        when: Nov. 16
        date: '1967-11-16'
        thread: economy
        c: 'Sterling. Walt Rostow to Johnson: Deming in Paris on the support operation; the Ten for a $1.4 billion drawing or standby for Britain, perhaps $2 billion, a package of $2.4 to $3 billion in all. Sounded out, the Ten would hold their rates if sterling were devalued; the French "until they were hurt."'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 152](https://history.state.gov/historicaldocuments/frus1964-68v08/d152). Made public: FRUS 1964–68, VIII (1998). See [[cal.1967-11-12.economy]]. Names: Walt Rostow, Johnson, Deming.'
