        c: Fowler, by circular telegram 115957, makes it explicit that raising the price of gold is unacceptable to the United States.
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v08/d113) (editorial note, from the Treasury''s release of Jan. 16). Made public: FRUS 1964–68, VIII (1998). To check: circular telegram 115957, Jan. 10, 1967, Department of State, Central Files, FN 19 (cited by FRUS 1964–68, VIII, doc. 113). See [[cal.1967-01-08.economy]]. Names: Fowler.'
