        tags: [name:fowler-henry-h, name:sharp-mitchell-w]
  - add:
      entry:
        id: cal.1968-03-12.economy
        when: Mar. 12
        date: '1968-03-12'
        thread: economy
        c: 'Pearson to Johnson, by letter: pleased with the exemption; on the border tax, after Sharp''s talk with Fowler of Mar. 1, Canada wants "an international discussion of the issues involved" and has suggestions for an initiative.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 185](https://history.state.gov/historicaldocuments/frus1964-68v08/d185) (editorial note, quoting the letter). To check: Pearson to Johnson, Mar. 12, 1968, Department of State, Central Files, FN 12 US (cited by FRUS 1964–68, VIII, doc. 185). See [[cal.1968-03-08.economy]]. Names: Pearson, Johnson, Sharp, Fowler.'
