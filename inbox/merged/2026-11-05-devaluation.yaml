  - add:
      entry:
        id: cal.1967-12-16.economy-gold
        when: Dec. 16
        date: '1967-12-16'
        thread: economy-gold
        c: 'Fowler and Martin: "The United States stands firm in its determination to maintain the gold value of the dollar"; the central banks of Belgium, Germany, Italy, the Netherlands, Switzerland and the United Kingdom support it, "the price of gold at $35 an ounce"; the London market to go on unchanged. Sent to all posts.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 159](https://history.state.gov/historicaldocuments/frus1964-68v08/d159) (circular telegram 85849, drafted by Widman; the text agreed with the Europeans). See [[cal.1967-12-15.economy-gold]]. Names: Fowler, Martin.'
        src:
          c: dd0e3246
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d159: all'
        tags: [name:fowler-henry-h, name:martin-william-mcchesney-jr]
  - add:
      entry:
        id: cal.1968-02-14.economy-gold
        when: Feb. 14
        date: '1968-02-14'
        thread: economy-gold
        c: 'Walt Rostow to Johnson: the gold losses could become "a crisis of confidence" feeding on itself, "much like a run on a bank." Three courses: a paper reserve in place of gold, the pool kept and losses made good in certificates; a higher price of gold; or an end to fixed rates. A two-price market unlikely to last; suspending convertibility the most risky.'
        n: '[[w.gavin-gold-dollars-and-power]], 178–80 & nn.29–32. To check: Rostow to Johnson, Feb. 14, 1968, NSF, Gold Crisis, box 53, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 179 n.29). See [[cal.1968-01-01.economy]]. Names: Walt Rostow, Johnson.'
        src:
          c: 2252d00a
          rows:
            - 'w.gavin-gold-dollars-and-power 178–80: all'
            - 'via w.gavin-gold-dollars-and-power 179 n.29: all'
        tags: [name:rostow-walt-w, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-03-04.economy-gold
        when: Mar. 4
        date: '1968-03-04'
        thread: economy-gold
        c: 'Fowler to Johnson, "Gold Problem": "our clear preference is to beat back the current speculative attack," the pool''s members to "firmly oppose any increase in the price of gold." If they drop out: the London market alone, a two-price market, or licensing. A gold embargo "would lead to exchange rate wars and trading blocs."'
        n: '[[w.gavin-gold-dollars-and-power]], 180 & nn.33–34. To check: Memo for the President, "Gold Problem," Mar. 4, 1968, NSF, Gold Crisis, box 53, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 180 nn.33–34). See [[cal.1968-02-14.economy-gold]]. Names: Fowler, Johnson.'
        src:
          c: 32d27474
          rows:
            - 'w.gavin-gold-dollars-and-power 180: all'
            - 'via w.gavin-gold-dollars-and-power 180 n.33: all'
        tags: [name:fowler-henry-h, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-03-08.economy-gold
        when: Mar. 8
        date: '1968-03-08'
        thread: economy-gold
        c: 'New York. Fowler''s advisory committee, informally, on gold and the balance of payments: Dillon, Roosa, Heller, Gordon, David Rockefeller, Bernstein, Wilde, Mayer, Bator. The tax bill a must; "unanimously opposed to an increase in the price of gold"; the pool cannot be held without arrangements the Europeans will not accept, so close it and let the market price go, with the partners, within thirty days. Heller to Walt Rostow, who reports to Johnson Mar. 9.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 187](https://history.state.gov/historicaldocuments/frus1964-68v08/d187) (Rostow to Johnson, Mar. 9, 4:45 p.m.). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-02-14.economy-gold]]. Names: Fowler, Dillon, Roosa, Heller, Gordon, David Rockefeller, Bator, Walt Rostow, Johnson.'
        src:
          c: b3b25b73
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d187: all'
        tags: [name:fowler-henry-h, name:dillon-c-douglas, name:roosa-robert-v, name:heller-walter-w, name:gordon-kermit, name:rockefeller-david, name:bator-francis-m, name:rostow-walt-w, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-03-10.economy-gold
        when: Mar. 10
        date: '1968-03-10'
        thread: economy-gold
        c: 'Basel. The central banks of the London gold pool reaffirm "their determination to continue their support to the pool, based on the fixed price of $35 per ounce of gold." Martin there: $500 million more for the pool, another $500 million contingent.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 188](https://history.state.gov/historicaldocuments/frus1964-68v08/d188) (Rostow to Johnson, Mar. 12, and its n.2, the communiqué). Made public: FRUS 1964–68, VIII (1998). To check: *New York Times*, Mar. 11, 1968, 60 (cited by FRUS 1964–68, VIII, doc. 188, n.2). See [[cal.1968-03-08.economy-gold]]. Names: Martin.'
        src:
          c: b6a6ba16
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d188: all'
        tags: [name:martin-william-mcchesney-jr]
  - add:
      entry:
        id: cal.1968-03-12.economy-gold
        when: Mar. 12
        date: '1968-03-12'
        thread: economy-gold
        c: 'Walt Rostow to Johnson, 6:25 p.m., on Martin''s report from Basel: on a change in the price of gold the British and Dutch inclined to "flirt with this option," the Germans "wobbly," the Italians, Belgians and Swiss strongly against. The Europeans ready to close the London market and let the free price float, the two-price system not thought through. An operational scenario drafted at Fried''s insistence: commitments from the members before the pool is closed, then a monetary conference. "The moment of truth is close upon us."'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 188](https://history.state.gov/historicaldocuments/frus1964-68v08/d188). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-03-10.economy-gold]]. Names: Walt Rostow, Johnson, Martin, Fried.'
        src:
          c: 0c87a7fa
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d188: all'
        tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:martin-william-mcchesney-jr, name:fried-edward-r]
  - add:
      entry:
        id: cal.1968-03-13.economy-gold
        when: Mar. 13
        date: '1968-03-13'
        thread: economy-gold
        c: '"Next Steps in International Monetary Policy," for Johnson: "we cannot go on selling gold indefinitely to speculators and hoarders"; "a visible mobilization of overwhelming force," or "a choice among even more difficult and disagreeable alternatives."'
        n: '[[w.gavin-gold-dollars-and-power]], 180 & n.35 (Rostow''s, by Gavin). Check: the author. To check: "Next Steps in International Monetary Policy," Mar. 13, 1968, NSF, Gold Crisis, box 53, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 180 n.35). See [[cal.1968-03-12.economy-gold]]. Names: Johnson.'
        src:
