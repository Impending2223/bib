  - add:
      entry:
        id: cal.1967-12-06.economy-gold
        when: Dec. 6
        date: '1967-12-06'
        thread: economy-gold
        c: 'Johnson to the Business Council: after the pound''s devaluation a speculative attack "decisively repelled" because the United States stood behind its pledge, "which I reaffirm today—to convert the dollar to gold at $35 an ounce"; liquidity need not rest on gold, "we must look beyond gold."'
        n: 'Remarks at a Meeting of the Business Council, [1967 Pub. Papers 1102](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=494) (Dec. 6, 1967). See [[cal.1967-11-18.economy]]. Names: Johnson.'
        src:
          c: cb00c3c0
          rows:
            - 'https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=494: all'
        tags: [name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1967-12-10.economy-gold
        when: Dec. 10
        date: '1967-12-10'
        thread: economy-gold
        c: Basel. The European central bankers meet; support for the gold pool weakening; no communiqué on it. In the week after, the pool loses $548 million.
        n: '[[w.gavin-gold-dollars-and-power]], 172 & n.15. To check: "The Gold Crisis: Nov. 1967–March 1968," NSF, Gold Crisis, box 53, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 172 n.15). See [[cal.1967-11-26.economy]].'
