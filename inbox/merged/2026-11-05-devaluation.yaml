        src:
          c: 4f6ee45f
          rows:
            - 'w.gavin-gold-dollars-and-power 76–77: all'
            - 'via w.gavin-gold-dollars-and-power 77 n.60: all'
        tags: [name:rueff-jacques, name:de-gaulle-charles]
  - add:
      entry:
        id: cal.1961-06-23.economy-gold
        when: June 23–29
        date: '1961-06-23'
        thread: economy-gold
        also: [europe-and-the-alliance-france, press-and-broadcasting]
        c: 'Paris. Rueff in *Le Monde*, three articles, reprinted in the London *Times*: "Deux Pyramides du crédit sur le stock d''or des États-Unis" (June 23), "Un danger pour l''occident: Le Gold-Exchange standard" (June 27), "Comment sortir du système?" (June 29). The gold exchange standard "a prodigious collective error"; de Gaulle to bypass Parliament, end the dollar''s reserve role and force its devaluation.'
        n: '[[w.gavin-gold-dollars-and-power]], 76–77 & n.60. Check: Gavin''s text dates the articles "early June 1961," its note June 23–29. To check: *Le Monde*, June 23, 27, 29, 1961 (cited by [[w.gavin-gold-dollars-and-power]], 77 n.60). See [[cal.1961-05-05.economy-gold]]. Names: Rueff, de Gaulle.'
        src:
          c: 3d411708
          rows:
            - 'w.gavin-gold-dollars-and-power 76–77: all'
            - 'via w.gavin-gold-dollars-and-power 77 n.60b: all'
        tags: [name:rueff-jacques, name:de-gaulle-charles]
  - add:
      entry:
        id: cal.1961-10-04.economy
        when: Oct. 4
        date: '1961-10-04'
        thread: economy
        c: 'The Committee of Under Secretaries on Foreign Economic Policy on the balance of payments, Ball presiding. Fowler: the program rests on the message of Feb. 6. Roosa on short-term capital movements under convertibility. Tobin: the balance will worsen as recovery draws in imports; the question is protecting the dollar from runs meanwhile, and later the supply of liquidity. Coppock: with devaluation, exchange controls and new import restrictions ruled out, the burden falls on exports and monetary restraint.'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 6](https://history.state.gov/historicaldocuments/frus1961-63v09/d6) (summary minutes; the Treasury paper, "The Balance of Payments and our Foreign Economic Policy," dated Sept. 29). Made public: FRUS 1961–63, IX (1995). See [[cal.1961-02-06.economy-gold]]. Names: Ball, Fowler, Roosa, Tobin.'
        src:
          c: fc798463
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d6: all'
        tags: [name:ball-george-w, name:fowler-henry-h, name:roosa-robert-v, name:tobin-james]
  - add:
      entry:
        id: cal.1961-12.economy-gold
        when: Dec.
        date: 1961-12
        thread: economy-gold
        c: 'The gold pool. Eight central banks to share the London gold market: the Bank of England to intervene from its own gold, keeping the price below $35.20, the others repaying it monthly by their shares; the United States half of $270 million, West Germany $30 million, Britain, France and Italy $25 million each, Switzerland, the Netherlands and Belgium $10 million each. The members to buy gold from the Treasury or from one another, not in the market.'
        n: '[[w.meltzer-history-of-the-federal]], 359 & n.156. Check: the day. To check: [[w.coombs-arena-of-international-finance]], 62 (cited by [[w.meltzer-history-of-the-federal]], 359 & n.156); [[w.solomon-international-monetary-system-1945]]. See [[cal.1960-10-25.economy]].'
        src:
          c: 6d2530d9
          rows:
            - 'w.meltzer-history-of-the-federal 359 & n.156: all'
            - 'via x.2010.meltzer-history-federal-reserve-p359: all'
  - add:
      entry:
        id: cal.1962-01-23.economy
        when: Jan. 23
        date: '1962-01-23'
        thread: economy
        c: 'The Open Market Committee votes, ten to two, for the System''s own operations in foreign currencies, an "experiment," Balderston''s motion; talks with the Treasury on the Exchange Stabilization Fund''s operations authorized. Robertson and Mitchell against: no clear statutory authority.'
        n: '[[w.meltzer-history-of-the-federal]], 352 & nn.141, 143. To check: FOMC Minutes, Dec. 5, 1961 (cited by [[w.meltzer-history-of-the-federal]], 352); Board of Governors, *Annual Report* (1962), 56–57 (cited by {M}, 352 n.141). See [[cal.1961-12.economy-gold]]. Names: Balderston, Robertson, Mitchell.'
        src:
          c: d3bfa723
          rows:
            - 'w.meltzer-history-of-the-federal 352 & nn.141, 143: all'
            - 'via x.2010.meltzer-history-federal-reserve-p352: all'
        tags: [name:balderston-c-canby, name:robertson-j-l, name:mitchell-george-w]
  - add:
      entry:
        id: cal.1962-02-13.economy
        when: Feb. 13
        date: '1962-02-13'
        thread: economy
        c: 'The Open Market Committee approves the operating rules for its foreign currency operations and their coordination with the Treasury; the Committee, not the Board, to direct them. Martin: a "lubricating device," not a cure for a basic deficit. The Exchange Stabilization Fund sells the System its first currencies: $7 million in marks, $1 million each in French and Swiss francs, lire, pounds and guilders.'
        n: '[[w.meltzer-history-of-the-federal]], 354–56. To check: FOMC Minutes, Feb. 13, 1962, 55–93 (cited by [[w.meltzer-history-of-the-federal]], 353–56). See [[cal.1962-01-23.economy]]. Names: Martin.'
        src:
          c: 29ffd733
          rows:
            - 'w.meltzer-history-of-the-federal 354–56: all'
            - 'via x.2010.meltzer-history-federal-reserve-p355: all'
        tags: [name:martin-william-mcchesney-jr]
  - add:
      entry:
        id: cal.1962-02-28.economy
        when: Feb. 28
        date: '1962-02-28'
        thread: economy
        c: 'The Open Market Committee, by telephone vote, nine to two, approves the first swap: $50 million for three months with the Bank of France. King and Robertson against, Mitchell abstaining.'
        n: '[[w.meltzer-history-of-the-federal]], 356 & n.151. To check: [[w.coombs-arena-of-international-finance]], 74–75 (cited by [[w.meltzer-history-of-the-federal]], 352 n.143). See [[cal.1962-01-23.economy]]. Names: Robertson, Mitchell.'
        src:
          c: ae26aa39
          rows:
            - 'w.meltzer-history-of-the-federal 356 & n.151: all'
        tags: [name:robertson-j-l, name:mitchell-george-w]
  - add:
      entry:
        id: cal.1962-03-06.economy
        when: Mar. 6
        date: '1962-03-06'
        thread: economy
        c: 'The Open Market Committee approves Coombs''s swaps with Switzerland and Britain. Coombs: they give the market confidence that the central banks will hold their rates. Balderston: the gold stock to fall to $15 billion from $16.7 billion.'
        n: '[[w.meltzer-history-of-the-federal]], 356–57. To check: FOMC Minutes, Mar. 6, 1962 (cited by [[w.meltzer-history-of-the-federal]], 355, 357). See [[cal.1962-02-28.economy]]. Names: Coombs, Balderston.'
        src:
          c: 37435a09
          rows:
            - 'w.meltzer-history-of-the-federal 356–57: all'
            - 'via x.2010.meltzer-history-federal-reserve-p357: all'
        tags: [name:coombs-charles-a, name:balderston-c-canby]
  - add:
      entry:
        id: cal.1962-03.economy-gold
        when: Mar.
        date: 1962-03
        thread: economy-gold
        c: 'The gold pool''s members agree to share purchases as well as sales and give up competing for gold: the Bank of England the single buyer for the group, at no more than $35.08.'
        n: '[[w.meltzer-history-of-the-federal]], 359–60. Check: the day. To check: [[w.coombs-arena-of-international-finance]]; [[w.solomon-international-monetary-system-1945]]. See [[cal.1961-12.economy-gold]].'
        src:
          c: faaa6f26
          rows:
            - 'w.meltzer-history-of-the-federal 359–60: all'
  - add:
      entry:
        id: cal.1962-07-06.economy-gold
        when: July 6
        date: '1962-07-06'
        thread: economy-gold
        c: 'Kaysen to Kennedy, "Gold," with the papers of the past two weeks: Louchheim''s plan for agreed ratios of gold to reserves, the 25 percent cover to go; Tobin and Roosa on it, Dillon added. Tobin: practical, and needed soon; Roosa doubts it. The Treasury sure it has the situation in hand; the Council for a fundamental change in the payments mechanism. Among the papers, by Gavin''s account, an essay of Keynes''s on a payments system without gold. Roosa had not answered Kennedy on Saager''s idea of raising the price of gold in all currencies: it creates "something of the same problems for us that devaluation would create."'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 56](https://history.state.gov/historicaldocuments/frus1961-63v09/d56). [[w.gavin-gold-dollars-and-power]], 81 & n.76 (the essay of Keynes''s). Made public: FRUS 1961–63, IX (1995). See [[cal.1962-05-29.economy]]. Names: Kaysen, Kennedy, Tobin, Roosa, Dillon.'
        src:
          c: 24359e90
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d56: all'
            - 'w.gavin-gold-dollars-and-power 81: G'
            - 'via w.gavin-gold-dollars-and-power 81 n.76: all'
        tags: [name:kaysen-carl, name:kennedy-john-f, name:tobin-james, name:roosa-robert-v, name:dillon-c-douglas]
  - add:
      entry:
        id: cal.1962-07-06.economy-gold-2
        when: July 6
        date: '1962-07-06'
        thread: economy-gold
        c: 'Kennedy to David Rockefeller, answering his letter on the balance of payments: "this country will not—I repeat not—increase the price of gold, thereby devaluating the dollar," nor impose exchange controls or import barriers. The deficit smaller this year; speculation virtually ended.'
        n: 'Letter to David Rockefeller on the Balance of Payments Question, [1962 Pub. Papers 547](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=607) (July 6, 1962). See [[cal.1962-07-06.economy-gold]]. Names: Kennedy, David Rockefeller.'
        src:
          c: 1d4e731e
          rows:
            - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=607: all'
        tags: [name:kennedy-john-f, name:rockefeller-david]
  - add:
      entry:
        id: cal.1962-07-18.economy-gold
        when: July 18
        date: '1962-07-18'
        thread: economy-gold
        c: 'Kaysen and Gordon, "Gold Guarantees": a devaluation of the dollar might stay a profitable action for the United States even after a gold guarantee of official balances was paid off.'
        n: '[[w.gavin-gold-dollars-and-power]], 84 & n.86. To check: Kaysen and Gordon, "Gold Guarantees," July 18, 1962, POF, Treasury (cited by [[w.gavin-gold-dollars-and-power]], 84 n.86). See [[cal.1962-07-06.economy-gold]]. Names: Kaysen, Gordon.'
