        id: cal.1967-01-21.economy
        when: Jan. 21–22
        date: '1967-01-21'
        thread: economy
        also: [europe-and-the-alliance]
        c: 'Chequers. Callaghan''s meeting of five finance ministers, Debré, Schiller, Colombo, Fowler and Callaghan: the communiqué, each "within the limits of their respective responsibilities" to cooperate so that interest rates may be "lower than they otherwise would be." Callaghan and Fowler, Jan. 21: France using monetary questions politically, its moves on gold; press on with the liquidity talks. The Treasury''s release of Jan. 16: the meeting on interest rates, not the price of gold.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 115](https://history.state.gov/historicaldocuments/frus1964-68v08/d115) (record of the meeting, Jan. 21); [FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 116](https://history.state.gov/historicaldocuments/frus1964-68v08/d116) (Fowler to Johnson, Jan. 23, with the communiqué); [FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v08/d113) (editorial note: the release). Made public: FRUS 1964–68, VIII (1998). To check: Fowler with Debré, Jan. 22, 1967, Fowler Papers, box 58, LBJ Library (cited by FRUS 1964–68, VIII, doc. 116, n.4). See [[cal.1967-01-10.economy-2]]. Names: Callaghan, Debré, Schiller, Fowler.'
