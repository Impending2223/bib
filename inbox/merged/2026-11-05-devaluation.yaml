          c: d8ff93d1
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d152: all'
        tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:deming-frederick-l]
  - add:
      entry:
        id: cal.1967-11-22.economy-gold
        when: Nov. 22
        date: '1967-11-22'
        thread: economy-gold
        c: 'Walt Rostow to Johnson at the Ranch: the gold pool lost $28 million Monday, $45 million Tuesday, $104 million today, the United States supplying 60 percent; rumors that the London price will not be held, fed by leaks from Paris of France''s withdrawal from the pool. Martin to ask the other governors to affirm business as usual.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 155](https://history.state.gov/historicaldocuments/frus1964-68v08/d155). Made public: FRUS 1964–68, VIII (1998). See [[cal.1967-11-18.economy]]. Names: Walt Rostow, Johnson, Martin.'
