  - add:
      entry:
        id: cal.1968-03-29.economy
        when: Mar. 29–30
        date: '1968-03-29'
        thread: economy
        c: 'Stockholm. The finance ministers and central bank governors of the Ten agree the amendments to the Fund''s Articles creating special drawing rights, for the Governors'' vote; Debré against the drafts, France reserving its position. The communiqué: exchange stability "based on the present official price of gold." Fowler leads for the United States.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 193](https://history.state.gov/historicaldocuments/frus1964-68v08/d193) (editorial note). Made public: FRUS 1964–68, VIII (1998). To check: the communiqué, *Annual Report of the Secretary of the Treasury* (1968), 372; De Vries, *The International Monetary Fund, 1966–1971*, I, 170–72 (both cited by FRUS 1964–68, VIII, doc. 193). See [[cal.1967-08-26.economy]]. Names: Debré, Fowler.'
        src:
          c: 55e5433e
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d193: all'
        tags: [name:debre-michel, name:fowler-henry-h]
  - add:
      entry:
        id: cal.1968-04-02.economy-2
        when: Apr. 2
        date: '1968-04-02'
        thread: economy
        c: 'Walt Rostow to Johnson on Stockholm: France kept from stalling the plan, which would have meant "a major drive to raise the official price of gold"; concessions to help the Four take the heat at home, the Community a veto on later quota increases. France abstained; it has "come out publicly for an increase in the price of gold." The tax bill "as much of a world issue as the controversy over the price of gold."'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 194](https://history.state.gov/historicaldocuments/frus1964-68v08/d194) (drafted by Fried). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-03-29.economy]]. Names: Walt Rostow, Johnson.'
        src:
          c: 302415fe
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d194: all'
        tags: [name:rostow-walt-w, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-11-15.economy-franc
        when: Nov. 15
        date: '1968-11-15'
        thread: economy-franc
        c: 'Walt Rostow to Johnson, 4:55 p.m.: the franc under heavy pressure, the pound less, money flowing to Germany. Ideally the pound and the franc stay, the mark is revalued, the lira and the guilder less; Strauss may resist on political grounds. Fowler, Deming and Fried in Europe; the central bankers at Basel tomorrow. The aim: no further devaluation of the pound, and if possible none of the franc.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 205](https://history.state.gov/historicaldocuments/frus1964-68v08/d205). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-06-06.europe-and-the-alliance-france]]. Names: Walt Rostow, Johnson, Strauss, Fowler, Deming, Fried.'
        src:
          c: 0a85936c
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d205: all'
        tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:strauss-franz-josef, name:fowler-henry-h, name:deming-frederick-l, name:fried-edward-r]
  - add:
      entry:
        id: cal.1968-11-15.economy-franc-2
        when: Nov. 15
        date: '1968-11-15'
        thread: economy-franc
        c: 'Fried to Walt Rostow from Brussels, the Fowler mission''s quiet talks on parities. The British: no moves now; they would stand still for a French devaluation of up to 10 percent with German and Italian moves up; any change multilateral, the Ten in Washington. Larre to Deming: France does not want to devalue, Couve and de Gaulle firm; but no stability without action on the mark; with a meeting, a credit package and no other upward moves, the franc could hold. Van Lennep and Zijlstra: a large enough German move would help the French hold. Ansiaux: worried for the pound.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 206](https://history.state.gov/historicaldocuments/frus1964-68v08/d206) (Brussels 3310, 2144Z). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-11-15.economy-franc]]. Names: Fried, Walt Rostow, Deming, Couve de Murville, de Gaulle, Fowler.'
        src:
          c: cc745b09
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d206: all'
        tags: [name:fried-edward-r, name:rostow-walt-w, name:deming-frederick-l, name:couve-de-murville-maurice, name:de-gaulle-charles, name:fowler-henry-h]
  - add:
      entry:
        id: cal.1968-11-17.economy-franc
        when: Nov. 17
        date: '1968-11-17'
        thread: economy-franc
        c: 'Walt Rostow to Fowler in Rome, 2258Z, from Basel''s weekend: Brunet of the Bank of France thinks France cannot hold its rate; Blessing still against a change in the mark; the Fund''s management sees a strong case for revaluing the mark and fears a French devaluation without it. Larre, from Paris: in a general change of European rates the United States "needs to decide" whether to raise the price of gold or demonetize it. Washington hopes for a German revaluation of not less than 10 percent.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 207](https://history.state.gov/historicaldocuments/frus1964-68v08/d207) (CAP 82761). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-11-15.economy-franc-2]]. Names: Walt Rostow, Fowler, Blessing.'
        src:
          c: c521ac97
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d207: all'
        tags: [name:rostow-walt-w, name:fowler-henry-h, name:blessing-karl]
  - add:
      entry:
        id: cal.1968-11-18.economy-franc
        when: Nov. 18
        date: '1968-11-18'
        thread: economy-franc
        c: 'Johnson to Wilson, approved 9:25 p.m.: Fowler to stay in Europe to persuade the Germans to revalue and prevent a large unilateral French devaluation; Bonn proposes border-tax changes instead, which would not do. The aim: about 10 percent up for the mark, 5 percent down for the franc, small moves by Italy and the Netherlands; a meeting of the Ten in Europe, Schweitzer present; London not to move meanwhile.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 210](https://history.state.gov/historicaldocuments/frus1964-68v08/d210) (CAP 82769, sent 0230Z, Nov. 19; its note: Rostow to Johnson, Nov. 18, 7:10 p.m., "Approved, 9:25 p.m."). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-11-18.economy]]. Names: Johnson, Wilson, Fowler, Schweitzer.'
        src:
          c: 8ab61c51
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d210: all'
        tags: [name:johnson-lyndon-b, name:wilson-harold, name:fowler-henry-h, name:schweitzer-pierre-paul]
  - add:
      entry:
        id: cal.1968-11-25.economy-franc
        when: Nov. 25
        date: '1968-11-25'
        thread: economy-franc
        c: 'The National Security Council, 12:06 p.m., after de Gaulle''s measures. Fowler: money out of Germany into France, the franc and the pound up, the dollar strong, the gold market calm; the French exchange controls tough. Martin with Blessing; the British Treasury "very glad there was no franc devaluation"; Schweitzer saw "some case for devaluation" but called the move "a gracious move."'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 222](https://history.state.gov/historicaldocuments/frus1964-68v08/d222) (record of the meeting). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-11-24.economy-franc]]. Names: Fowler, de Gaulle, Martin, Blessing, Schweitzer.'
        src:
          c: 5b09f05a
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d222: all'
        tags: [name:fowler-henry-h, name:de-gaulle-charles, name:martin-william-mcchesney-jr, name:blessing-karl, name:schweitzer-pierre-paul]
  - add:
      entry:
        id: cal.1968-11-19.economy-franc
        when: Nov. 19
        date: '1968-11-19'
        thread: economy-franc
        c: 'Walt Rostow to Johnson in New York, late evening: a second message from Wilson, handled with Barr; Wilson "pulling out all stops" to get the Germans above 4 percent, wrong to treat the French problem as secondary. Hold the French, or hold them to a modest devaluation with big short-term loans, and the pound can be protected; de Gaulle has "staked so much on a policy of "no devaluation.""'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 213](https://history.state.gov/historicaldocuments/frus1964-68v08/d213) (CAP 82725, sent 0357Z, Nov. 20; Wilson''s messages not printed). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-11-18.economy-franc]]. Names: Walt Rostow, Johnson, Wilson, Barr, de Gaulle.'
        src:
          c: 669e3406
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d213: all'
        tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:wilson-harold, name:barr-joseph-w, name:de-gaulle-charles]
  - add:
