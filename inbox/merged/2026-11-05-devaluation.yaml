        date: '1961-05-05'
        thread: economy-gold
        also: [europe-and-the-alliance-france]
        c: 'Paris. Rueff to de Gaulle, the first of his letters on the monetary system: end the dollar''s role as a reserve currency, force a devaluation of the dollar, convert France''s dollars into gold.'
