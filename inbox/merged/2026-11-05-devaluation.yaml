        tags: [name:adenauer-konrad, name:schiller-karl, name:rostow-walt-w]
  - add:
      entry:
        id: cal.1967-05-26.economy-gold
        when: May 26
        date: '1967-05-26'
        thread: economy-gold
        c: 'Fowler and Deming with Schweitzer of the Fund, 4:15 p.m., on the gold market and the Middle East: go on supporting the market, dangerous to let the price above $35.20; no startling announcement. Deming: at Bellagio a professor proposed a $10 billion pool; the pool has acquired $1 billion over time. Schweitzer: the Bank of France would be very unhappy to see the price rise in London.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 125](https://history.state.gov/historicaldocuments/frus1964-68v08/d125). Made public: FRUS 1964–68, VIII (1998). See [[cal.1967-06-19.economy]]. Names: Fowler, Deming, Schweitzer.'
        src:
          c: 5150f4b7
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d125: all'
        tags: [name:fowler-henry-h, name:deming-frederick-l, name:schweitzer-pierre-paul]
