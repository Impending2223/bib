        id: cal.1968-09-30.economy-gold
        when: Sept. 30
        date: '1968-09-30'
        thread: economy-gold
        c: 'Johnson to the annual meeting of the World Bank and the Fund: when Britain devalued, "we closed ranks to prevent a senseless round of competitive actions"; when speculators bet they could force a rise in the official price of gold, "we set up the two-tier system."'
        n: 'Remarks at a Meeting of the World Bank and the International Monetary Fund, [1968–69 Pub. Papers 987](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=297) (Sept. 30, 1968). See [[cal.1968-03-16.economy-gold]]. Names: Johnson.'
        src:
          c: d1d7248b
          rows:
            - 'https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=297: all'
        tags: [name:johnson-lyndon-b]
