        id: cal.1968-03-08.economy
        when: Mar. 8
        date: '1968-03-08'
        thread: economy
        c: 'Fowler and Sharp agree: Canada exempt from the capital measures of the payments program administered by Commerce and the Federal Reserve, free to borrow in the American market for its current deficit. Canada to keep itself from becoming a "pass through" for American funds bound elsewhere. Announced in Washington.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 185](https://history.state.gov/historicaldocuments/frus1964-68v08/d185) (editorial note). To check: *Current Economic Developments*, No. 801, Mar. 12, 1968, 4–6 (cited by FRUS 1964–68, VIII, doc. 185); the joint statement, the Treasury''s release and the *Bulletin*. See [[cal.1968-03-01.economy]]. Names: Fowler, Sharp.'
        src:
