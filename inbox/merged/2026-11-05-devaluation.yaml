  - add:
      entry:
        id: cal.1961-02-06.economy-gold
        when: Feb. 6
        date: '1961-02-06'
        thread: economy-gold
        c: Special message on gold and the balance of payments deficit. The basic deficit about $1.5 billion in 1960, the over-all $3.8 billion; the gold reserve $17.5 billion. "The United States official dollar price of gold can and will be maintained at $35 an ounce"; no exchange controls; the drawing rights in the Fund to be used "if and when appropriate"; the Treasury to study how the Fund may be strengthened.
        n: 'Special Message to the Congress on Gold and the Balance of Payments Deficit, [1961 Pub. Papers 57](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=115) (Feb. 6, 1961). [[w.meltzer-history-of-the-federal]], 342 (the commitment to $35 renewed). To check: [[w.roosa-dollar-and-world-liquidity]]; [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]; [[w.james-international-monetary-cooperation-since]]. See [[cal.1960-10-31.economy]]. Names: Kennedy.'
        src:
          c: bad84b95
          rows:
            - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=115: all'
            - 'w.meltzer-history-of-the-federal 342: D'
        tags: [name:kennedy-john-f]
