        date: '1968-03-27'
        thread: economy
        c: 'Johnson to Pearson: he shares the "view that the exemption, together with the measures Canada is taking, will benefit both our countries"; the GATT Council meets that week on a working party on border tax adjustments.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 185](https://history.state.gov/historicaldocuments/frus1964-68v08/d185) (editorial note, quoting the letter). To check: Johnson to Pearson, Mar. 27, 1968, Department of State, Central Files, FN 12 US (cited by FRUS 1964–68, VIII, doc. 185). See [[cal.1968-03-12.economy]]. Names: Johnson, Pearson.'
