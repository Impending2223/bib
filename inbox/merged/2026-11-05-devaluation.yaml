      entry:
        id: cal.1968-03-04.economy
        when: Mar. 4
        date: '1968-03-04'
        thread: economy
        c: 'Walt Rostow to Johnson, "Pressure on the Canadian Dollar," on Sharp''s visit: an Export-Import Bank standby in a multilateral operation with the Europeans, and a statement that the investment guidelines would be looked at again if they proved a serious problem for Canada, being explored.'
        n: '[FRUS 1964–68, XII: Western Europe, doc. 347](https://history.state.gov/historicaldocuments/frus1964-68v12/d347) (drafted by Fried). Made public: FRUS 1964–68, XII (2001). See [[cal.1968-03-01.economy]]. Names: Walt Rostow, Johnson, Sharp.'
        src:
          c: 9fd85c2c
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d347: all'
        tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:sharp-mitchell-w]
