          rows:
            - 'w.gavin-gold-dollars-and-power 84: all'
            - 'via w.gavin-gold-dollars-and-power 84 n.86: all'
        tags: [name:kaysen-carl, name:gordon-kermit]
  - add:
      entry:
        id: cal.1963-02-11.economy
        when: Feb. 11
        date: '1963-02-11'
        thread: economy
        c: 'Dillon to Kennedy, on Walt Rostow''s memorandum of Feb. 4: repeal of the 25 percent gold cover favored by all, but not pressed, the conservative opposition "intense and emotional"; ten-year loans from Europe would put the United States in the place of Brazil or Argentina stretching out their debts. "We must maintain the value of our currency and cannot allow it to be devalued as if we were Brazil, Canada or Argentina."'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 68](https://history.state.gov/historicaldocuments/frus1961-63v09/d68). Made public: FRUS 1961–63, IX (1995). See [[cal.1963-02-26.economy]]. Names: Dillon, Kennedy, Walt Rostow.'
        src:
          c: 7a2bba32
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d68: all'
        tags: [name:dillon-c-douglas, name:kennedy-john-f, name:rostow-walt-w]
  - add:
      entry:
        id: cal.1963-05-25.economy
        when: May 25
        date: '1963-05-25'
        thread: economy
        also: [europe-and-the-alliance-france]
        c: 'Couve de Murville with Kennedy at the White House, 11 a.m. Kennedy: the United States $2.5 billion short again this year; the danger a run on gold. Couve asks whether Washington has considered changing the international price of gold; agreed beforehand, he says, it would bring no run. The United States, he says, has no real deficit, only too much export of capital.'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 71](https://history.state.gov/historicaldocuments/frus1961-63v09/d71) (editorial note, quoting the memorandum of conversation; printed in full, FRUS 1961–63, XIII, 769–75). [[w.gavin-gold-dollars-and-power]], 75–76 (Couve for raising the dollar price of gold). Made public: FRUS 1961–63, IX (1995). To check: Ball with Couve, May 25, 1963, Department of State, Central Files, POL FR-US (cited by FRUS 1961–63, IX, doc. 71). See [[cal.1962-07-20.economy]]. Names: Couve de Murville, Kennedy.'
        src:
          c: 4281d088
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d71: all'
            - 'w.gavin-gold-dollars-and-power 75–76: D'
        tags: [name:couve-de-murville-maurice, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1963-09-30.economy-gold
        when: Sept. 30
        date: '1963-09-30'
        thread: economy-gold
        c: 'Kennedy to the annual meeting of the Fund and the Bank: the American gold reserves "a healthy but not excessive 40 percent" of the world''s; "to maintain the firm relationship of gold and the dollar at the present price of $35 an ounce, and I can assure you we will do just that."'
        n: 'Address at the Meeting of the International Monetary Fund, [1963 Pub. Papers 749](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=807) (Sept. 30, 1963). See [[cal.1962-09-20.economy]]. Names: Kennedy.'
        src:
          c: b0933379
          rows:
            - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=807: all'
        tags: [name:kennedy-john-f]
  - add:
      entry:
        id: cal.1964-12.economy
        when: Dec., early
        date: 1964-12
        thread: economy
        c: 'Martin with Johnson, Wilson and Dillon at the White House, by Bremner''s account: the overseas commitments will force a devaluation of the dollar in the end; Johnson to "declare yourself" against it. Dillon: the United States has not done enough.'
        n: '[[w.meltzer-history-of-the-federal]], 440. Check: the day (Wilson in Washington Dec. 7–9). To check: Bremner (2004), 159 (cited by [[w.meltzer-history-of-the-federal]], 440). See [[cal.1964-11-23.economy]]. Names: Martin, Johnson, Wilson, Dillon.'
        src:
          c: 67aec7fe
          rows:
            - 'w.meltzer-history-of-the-federal 440: all'
        tags: [name:martin-william-mcchesney-jr, name:johnson-lyndon-b, name:wilson-harold, name:dillon-c-douglas]
  - add:
      entry:
        id: cal.1965-01-05.economy
        when: Jan. 5
        date: '1965-01-05'
        thread: economy
        c: 'Dillon to Johnson on the balance of payments: the 1964 deficit about $2.8 billion, the fourth quarter at over $4 billion a year; $172 million in gold lost in the quarter; gold in London at its highest since the Cuban crisis. For a special message reaffirming "that a change in the price of gold is out of the question": the Gore amendment imposed on bank loans, the interest equalization tax extended two years, a $100 tax on travel abroad.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 26](https://history.state.gov/historicaldocuments/frus1964-68v08/d26). Made public: FRUS 1964–68, VIII (1998). See [[cal.1964-11-25.economy]]. Names: Dillon, Johnson.'
        src:
          c: ef40cc96
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d26: all'
        tags: [name:dillon-c-douglas, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1965-03-27.economy
        when: Mar. 27
        date: '1965-03-27'
        thread: economy
        c: 'Sterling. Dillon to Johnson: a French attack on the pound, Mar. 26, the rate below $2.79; the Europeans may force London by June to choose between further restraint and devaluation. The dollar could now ride out a devaluation that was not too extreme; the Continent thinks $2.50 right, and Washington agrees the pound should go no lower, Johnson to intercede with Wilson if need be.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 56](https://history.state.gov/historicaldocuments/frus1964-68v08/d56). [[w.meltzer-history-of-the-federal]], 440 (the speculators; Dillon could accept $2.50). Made public: FRUS 1964–68, VIII (1998). See [[cal.1965-03-30.economy]]. Names: Dillon, Johnson, Wilson.'
        src:
          c: 984f78f0
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d56: all'
            - 'w.meltzer-history-of-the-federal 440: C-E'
        tags: [name:dillon-c-douglas, name:johnson-lyndon-b, name:wilson-harold]
  - add:
      entry:
        id: cal.1965-07-28.economy-2
        when: July 28
        date: '1965-07-28'
        thread: economy
        c: 'Sterling. Ball to Fowler, "Some Thoughts on the British Crisis": if a run comes, $3 to $4 billion of multilateral support for the pound, half or three-quarters American, on hard conditions, raised by telephone among the Ten. "Appalled" at the suggestion in the Treasury''s talks that London be told a devaluation would be tolerated: "any change in the sterling rate is out of the question."'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 65](https://history.state.gov/historicaldocuments/frus1964-68v08/d65). Made public: FRUS 1964–68, VIII (1998). See [[cal.1965-07-27.economy]]. Names: Ball, Fowler.'
        src:
          c: db4de67f
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d65: all'
        tags: [name:ball-george-w, name:fowler-henry-h]
  - add:
      entry:
        id: cal.1966-07-06.economy
        when: July 6
        date: '1966-07-06'
        thread: economy
        c: 'Bator to Johnson on the balance of payments: about $1.5 billion of debt prepayment and long-term investment arranged, "useful cosmetics"; no drastic action needed, a run on gold unlikely before November. The danger a run on sterling; if Wilson''s prices run further out of line, devaluation "increasingly hard to avoid." Some advisers think a British devaluation a near disaster; Bator, after November, a chance "to force a change in the rules of the game on gold."'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 100](https://history.state.gov/historicaldocuments/frus1964-68v08/d100). Made public: FRUS 1964–68, VIII (1998). See [[cal.1965-09-10.economy]]. Names: Bator, Johnson, Wilson.'
        src:
          c: bcc8d6c7
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d100: all'
        tags: [name:bator-francis-m, name:johnson-lyndon-b, name:wilson-harold]
  - add:
      entry:
        id: cal.1966-09-20.economy
        when: Sept. 20
        date: '1966-09-20'
        thread: economy
        c: 'The Federal Reserve Board''s Division of International Finance, "Contingency Planning—Sterling," top secret, after the summer''s run: a devaluation of 10 to 20 percent, 15 the likeliest, would bring a bear attack on the dollar, a run on American gold, the gold pool overwhelmed. The responses: hold the new rates, with capital controls and the surplus countries revaluing; change gold''s role, ending sales to central banks, separating the private and official markets or raising the price; or a new par value for the dollar, or a float.'
        n: '[[w.gavin-gold-dollars-and-power]], 168–69 & nn.3–5 (Solomon and Young of the Board''s staff quoted). To check: "Contingency Planning—Sterling," Sept. 20, 1966, Bator Papers, box 8, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 168 nn.3–5). See [[cal.1966-07-29.europe-and-the-alliance]].'
        src:
          c: 8d3ea18e
          rows:
            - 'w.gavin-gold-dollars-and-power 168–69: all'
            - 'via w.gavin-gold-dollars-and-power 168 n.3: all'
  - add:
      entry:
        id: cal.1966-09-21.economy-2
        when: Sept. 21
        date: '1966-09-21'
        thread: economy
        c: 'The Division of International Finance, "Contingency Plan X": a sterling devaluation "a ready-made, welcome opportunity to get the gold and the balance of payments monkey off our back"; all gold sales and purchases suspended, the dollar left to float, "to make the Europeans fish or cut bait." Bator''s marginalia, by Gavin''s reading, favorable.'
        n: '[[w.gavin-gold-dollars-and-power]], 169–70 & nn.6–7. To check: "Contingency Plan X: A Proposal to Force Major Surplus Countries to Support the Dollar at Present Parities or to Allow a Relative Appreciation of Their Currencies," Sept. 21, 1966, Bator Papers, box 8, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 169 nn.6–7). See [[cal.1966-09-20.economy]]. Names: Bator.'
        src:
          c: 35480fb4
          rows:
            - 'w.gavin-gold-dollars-and-power 169–70: all'
            - 'via w.gavin-gold-dollars-and-power 169 n.6: A-B'
        tags: [name:bator-francis-m]
  - add:
      entry:
        id: cal.1967-04-27.economy
        when: Apr. 27
        date: '1967-04-27'
        thread: economy
        also: [europe-and-the-alliance]
        c: 'Bonn, after Adenauer''s funeral. Schiller to Walt Rostow on the Six''s Munich agreement on reserve creation: a political achievement, the French brought along; negotiate a drawing-rights scheme by stages. Rostow: a technical problem, or "a traumatic event." Schiller, on the lawn: "We know you are not going to change the price of gold. We are supporting the dollar with our commitment on gold."'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 121](https://history.state.gov/historicaldocuments/frus1964-68v08/d121) (Rostow''s memorandum, supplementing Bonn''s telegram 12850). Made public: FRUS 1964–68, VIII (1998). See [[cal.1967-08-26.economy]]. Names: Adenauer, Schiller, Walt Rostow.'
