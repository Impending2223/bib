    set:
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 423–24; [[w.mao-zedong-zhuan]], VI, ch. 73 (Dec. 26 Mao''s 71st birthday: that evening 当晚 he gives a dinner at the Great Hall, Old Peking Room, from his royalties, the guests chosen by him; he asks the labor model Chen Yonggui, Xing Yanzi, Dong Jiageng; Bo Yibo''s account of the seating (n.36, n.37)). The book reads the formulations as Liu''s and the kingdoms as Deng''s Secretariat and Li Fuchun''s Planning Commission (III, 423). Made public: 1993. To check: [[w.zhisui-private-life-of-chairman]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 423 n.130a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1131 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 423 n.131a); [[w.yao-san-ci-danan-buside]], 235–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 423 n.131b); [[w.qitai-dazhai-hongqide-shengqi-yu]], 35–69 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 424 n.133a); Mao Zedong 毛泽东, talk with Xing Yanzi 邢燕子, Dong Jiageng 董加耕, Chen Yonggui 陈永贵 and others, Dec. 26, 1964 (key points 谈话要点) (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.36); [[w.yibo-ruogan-zhongda-juece-yu-1997]], II, 1166–1167 (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.37). Names: Mao Zedong. Check: the guests at Mao''s table; Huang Yao adds Peng Zhen, Luo Ruiqing, Yu Qiuli and Zeng Zhi (III, 423 n.131).'
