patch: 2026-11-19-cards-link
by: cards-link agent (Claude), for the lead
ops:
- edit:
    id: cal.1960-03-16.china-leadership
    base: 928735b5
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 16, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 90–92 (the technical-revolution comment, dated Mar. 16 and issued Mar. 18: the ACFTU Party group''s report on seven cities (Shanghai, Tianjin, Shenyang, Lüda, Harbin, Taiyuan, Chongqing) and the *Jingji xiaoxi* piece are important summaries, to go to all city, mine and commune committees; Wuhan, Canton, Xi''an, Lanzhou, the provincial capitals and hundreds of medium cities such as Tangshan, Shijiazhuang, Qingdao, Luoyang, Huangshi, Zhuzhou, Wuxi, Zhanjiang and Pingxiang to sum up and spread the work quickly, county and commune industry too, the investigating and summing up to be done in March, April and May with large field conferences; the First Ministry of Machine Building''s January field conference at Harbin, to which most cities were not invited, Wuhan and Canton among them, is faulted); [[w.jianguo-yilai-mao-zedong]], XV, 93–96 (the health instruction, dated Mar. 16 and issued Mar. 18: health work slack for two years in the rush of the Leap; the Center''s approval of Feb. 2 of the Health Ministry''s report on the Jishan conference was not heeded by most first secretaries; the patriotic health campaign to be revived and show results in 1960, 1961 and 1962; each Party committee, health department and mass organization to meet four times a year, once a quarter, the patriotic health campaign committees too; the four pests to be rats, bedbugs, flies and mosquitoes, sparrows no longer to be hit; sport and exercise urged); [[w.jianguo-yilai-mao-zedong]], XV, 97–98 (Mao to Liu and Deng, Mar. 16: the technical-revolution and mess-hall comments and a draft telegram on health work are sent, with a request that they gather the comrades concerned, and that the three of Mar. 15 were sent the day before); [[w.mao-zedong-zhuan]], V, ch. 66 n.9 (the directive on health work drafted Mar. 16: the patriotic health campaign to be started again, flies and the other pests; sparrows spared, bedbugs put in their place). [[w.yang-jisheng-mubei]], I, 212 (the directive''s passage on the patriotic health campaign, quoted; the book sets it beside the deaths of that spring; n.54). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66). Check: the *Mao zedong zhuan* (V, ch. 66 n.4) prints 1963 for the manuscript of the comment on the technical revolution it dates Mar. 16, though its text puts the comments within Mar. 3–25, 1960. To check: All-China Federation of Trade Unions Party group, report of Mar. 5, 1960 to the Center on the present state of technical innovation and technical revolution (cited by [[w.jianguo-yilai-mao-zedong]], XV, 91 n.2); Jingji xiaoxi, no. 10, 1960, "The technical revolution movement reaps a harvest over a large area" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 92 n.3); Central Committee, circular of Mar. 18, 1960 forwarding the ACFTU report and the Jingji xiaoxi piece with Mao''s comment (cited by [[w.jianguo-yilai-mao-zedong]], XV, 91 n.1); Health Ministry Party group, report of Dec. 16, 1959 to the Central Committee Cultural and Educational Group and the Center on the national rural health field conference at Jishan county, Shanxi, Nov. 12–21, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 95 n.2); Central Committee, approval of Feb. 2, 1960 of the Health Ministry report and annex, sent to the provinces (as Mao''s text states) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 95 n.2b); Central Committee, instruction of Mar. 18, 1960 on health work, as drafted by Mao Mar. 16 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 95 n.1); Mao Zedong 毛泽东, directive drafted for the Center 中共中央 on health work 关于卫生工作的指示, Mar. 16, 1960; in [[w.mao-zedong-wenji]], VIII, 150 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.9). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
- edit:
    id: cal.1960-03-22.china-leadership-2
    base: 2e36f36a
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 22, 1960. [[w.lengxi-shinian-lunzhan-1956-1966]], 255–258 (the comment on the Pakistan embassy''s telegram, written two days before the Tianjin meeting; 5 percent, at most 10 percent; the Delhi pavilion''s 3.5 million visitors; given to those on the train); [[w.jianguo-yilai-mao-zedong]], XV, 109–113 (Mar. 22, 1960; the comment with its two annexes: of 2.7 billion people some 270 million are against China; of China''s 650 million at most 65 million against the Party; over 3.5 million visited the pavilion at New Delhi; Mao puts the anti-China chorus at ten years or more, perhaps the last forty years of the century); [[w.mao-zedong-zhuan]], V, ch. 66 n.11 ("On the anti-China question": about 5 percent, 10 at most, anti-China; the rest of the world for China or not against or briefly deceived; manuscript of Mar. 22; Mao says later (n.12) the Pakistan fair gave him the idea). Made public: 1999. To check: Chinese Embassy in Pakistan, report of Mar. 14, 1960 to the Foreign Ministry, the Foreign Trade Ministry and the International Trade Promotion Committee on China''s part in the East Pakistan industrial and agricultural exhibition (50,000 visitors by that day) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 112 n.2a); Renmin ribao, Mar. 17, 1960, the correspondent''s dispatch on the closing of the China pavilion at the New Delhi world agricultural fair (Feb. 29; 81 days, over three million visitors) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 112 n.2b); Mao Zedong 毛泽东, "On the anti-China question" 《关于反华问题》 (manuscript 手稿), Mar. 22, 1960; in [[w.mao-zedong-wenji]], VIII, 181, 188–189 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.11). Names: Mao Zedong.'
- edit:
    id: cal.1960-03-23.china-leadership-3
    base: 4a1414e6
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 116–120 (Mar. 23, 1960, printed from the Central Committee document, with Mao''s manuscript); [[w.mao-zedong-zhuan]], V, ch. 66 n.2 (the Center''s circular drafted by Mao forwarding the Shandong six-level cadre conference bulletin: its problems surely in every province; the Zhengzhou resolution and the Shanghai meeting''s eighteen points forgotten; "levelling and transfers" repaid in full, the worst removed, big embezzlers prosecuted; most communes good; manuscript of Mar. 23). [[w.yang-jisheng-mubei]], I, 443 (Mao''s comment on bulletin no. 2, quoted from the Mao wengao vol. 9; n.10). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66); the text in full, 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Shandong six-level cadre conference secretariat, Huiyi qingkuang no. 2, Mar. 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 118 n.3); Zhengzhou huiyi jilu (record of the enlarged Politburo meeting at Zhengzhou, Feb. 27-Mar. 5, 1959: the meeting summary, Mao''s speech, and the draft regulations on the management system of the people''s communes) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 119 n.4); Minutes of the enlarged Politburo meeting at Shanghai, Mar. 25-Apr. 1, 1959, "Eighteen questions on the people''s communes", adopted at the Seventh Plenum of the Eighth Central Committee, Apr. 2–5, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 120 n.5); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 forwarding the Shandong Provincial Committee''s bulletin on its six-level cadre conference (manuscript 手稿), Mar. 23, 1960; in [[w.mao-zedong-wenji]], VIII, 163–164 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.2). See [[cal.1960-03-22.china-leadership-5]]. Names: Mao Zedong.'
- edit:
    id: cal.1960-03-25.china-leadership-4
    base: cf4d550a
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 121–122 (Mar. 25, 1960); [[w.mao-zedong-zhuan]], V, ch. 66 n.5 (the comment forwarding Nie Rongzhen''s report on Canton and Chongqing: the movement of the whole people in industry, farming and the rest to be watched closely, summed up and spread; manuscript of Mar. 25). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66); the text in full, 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Nie Rongzhen to the Central Committee and Mao, Mar. 16, 1960, with the report "Some conditions of the mass technical-revolution movement in the factories of Canton and Chongqing (a short report of visits and inquiries)" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 121 n.1); Mao Zedong 毛泽东, comment forwarding Nie Rongzhen''s 聂荣臻 report on the technical revolution movement in Canton and Chongqing (manuscript 手稿), Mar. 25, 1960; in [[w.mao-zedong-wenji]], VIII, 153 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.5). Names: Mao Zedong, Nie Rongzhen.'
- edit:
    id: cal.1960-11-28.china-leadership-2
    base: 9b5fa0e1
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 28, 1960. [[w.macfarquhar-origins-of-the-cultural]], III, 12 (the Gansu report and Mao''s note on his error of 1958); [[w.jianguo-yilai-mao-zedong]], XV, 415–418 (Nov. 28, 1960; the comment, dated by the Center Nov. 28, from Mao''s manuscript: Gansu''s report of Nov. 25 worth study once or twice by the prefectures and counties; Mao read it twice and would read it again; the error of the Beidaihe resolution''s passage, his own, timing the change of ownership in three or four years or five or six; at least seven years now, at least twenty for pay by work; the report silent on livelihood and on sorting counties, communes and teams in three classes; his note: to Zhou, Li Fuchun, Tan Zhenlin and Chen Boda, then by telegram, the original back to him); [[w.yang-jisheng-mubei]], II, 818 (the Center''s comment on the Gansu committee''s report of Nov. 25, which Mao wrote himself; quoted: Mao read the report twice and would read it again; he too erred; the Beidaihe resolution''s timing; seven years at least, twenty at least; never levelling and transfers); [[w.mao-zedong-zhuan]], V, ch. 66 n.64 (Nov. 28: Mao''s comment forwarding Gansu''s report of Nov. 25: his own error in the Beidaihe decision of 1958 on the passage to ownership by the whole people; "seven years at least"; manuscript in *Wenji* 8). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 66), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.nongye-jitihua-zhongyao-wenjian]], xia, 407 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.11); Gansu Provincial Party Committee, "Fourth report on carrying out the Center''s Emergency Directive Letter", Nov. 25, 1960, to the Center and the Northwest Bureau (cited by [[w.jianguo-yilai-mao-zedong]], XV, 416 n.1); Resolution on establishing people''s communes in the countryside, Beidaihe enlarged Politburo meeting, Aug. 1958, the passage on the time of the passage to ownership by the whole people (cited by [[w.jianguo-yilai-mao-zedong]], XV, 418 n.2); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 forwarding the Gansu Provincial Committee''s fourth report of Nov. 25, 1960 on carrying out the urgent letter, Nov. 28, 1960; in [[w.mao-zedong-wenji]], VIII, 222–223 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.64). Names: Mao Zedong.'
- edit:
    id: cal.1961-01-13.china-leadership
    base: 2c853d51
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 13, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 13 (Mao on investigation); [[w.yang-shangkun-riji]], I, 643 (Jan. 13, 1961; the work conference ends; Mao speaks at 11 a.m.); [[w.deng-xiaoping-nianpu-1904]], III, 1611–1612 (Jan. 13, 1961; morning; Deng at the closing plenary; on Mao''s remarks on productivity Deng interjects: big, middle and small together; small first, but in the long run the middle road, the stress on the middle); [[w.mao-zedong-zhuan]], V, ch. 67 n.8 (Jan. 13: Mao closes the conference on investigation and research: the facts clear, the resolve great, the methods right; "a year of seeking truth from facts"; each leader to take a team or two for a survey). Made public: 2013. Check: Yang Shangkun''s diary has Mao speak at 11 a.m. ([[w.yang-shangkun-riji]], I, 643); and the conference resumes Jan. 19 (I, 644). Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], I, 643) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 67), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.xin-zhongguo-biannianshi-1949]], 182 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 13 n.16); [[w.mao-zedong-sixiang-wan]], xia, 323–24 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 13 n.17); Mao Zedong 毛泽东, speech closing the Central Work Conference 中央工作会议, Jan. 13, 1961; in [[w.mao-zedong-wenji]], VIII, 233–234, 237 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.8). Names: Mao Zedong.'
- edit:
    id: cal.1961-01-20.china-leadership
    base: d7597735
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 20, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 39–40 (the three teams, their leaders and members); [[w.jianguo-yilai-mao-zedong]], XV, 479–480 (Jan. 20, 1961; Mao''s letter to Tian Jiaying, 4 p.m. Jan. 20: ''On investigation work'' to Chen Boda and Hu Qiaomu for revision; three groups, each of six and its leader, formed in three days, all of high level; Tian to Zhejiang, Hu to Hunan, Chen to Guangdong; one team to the worst production team, one to the best, ten to fifteen days; then to Canton to report to him, a month on industry there; the Spring Festival in Guangdong; the letter to be read by all twenty-one; printed from the manuscript); [[w.mao-zedong-zhuan]], V, ch. 67 n.10 (Jan. 20, 4 p.m., the letter to Tian Jiaying on three survey groups, Chen Boda to Guangdong, Hu Qiaomu to Hunan, Tian to Zhejiang, six members each, each split in two, a worst and a best production team, ten to fifteen days, then to Canton to report and a month in the city on industry, two months in all; the groups'' twenty-one members to read the letter). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 67), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 902 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.1); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 421 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2a); [[w.bian-mao-zedong-he-tade]], 41–42, 107, 177 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2b); [[w.mao-zedong-shuxin-xuanji]], 574–75 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2c); [[w.zhongguo-gongchan-dang-liushi]], 483 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2d); [[w.chenghua-zhonghua-renmin-gongheguo-zhengzhi]], 219 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2e); [[w.xinhua-yuebao]], No. 10, 1992, 77–79 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5a); [[w.hu-qiaomu-wenji]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5b); [[w.rong-fengyun-renwu-jianwen-lu]], 69 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5c); [[w.jizhi-mao-zedong-yu-hu]], 81–86 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5d); [[w.weiyuanhui-zhonggong-renming-lu]], 850 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.6b); [[w.institute-whos-who-in-communist]], 271–72 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.6c); [[w.board-whos-who-in-china]], 526–27 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.6d); [[w.1961-nian-guangdong-nongcun]], 62–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.7b); Mao Zedong 毛泽东, letter to Tian Jiaying 田家英 on organizing the survey groups (manuscript 手稿), Jan. 20, 1961, 4 p.m.; in [[w.mao-zedong-wenji]], VIII, 239–240 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.10). Names: Mao Zedong, Tian Jiaying, Chen Boda, Hu Qiaomu.'
- edit:
    id: cal.1961-03-13.china-leadership
    base: 13939a0f
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 13, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 42–43 (Mao''s letter on the two egalitarianisms); [[w.jianguo-yilai-mao-zedong]], XV, 501–503 (Mar. 13, 1961; Mao''s letter of Mar. 13, 8 a.m., Canton, to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Peking conference, carried by Tao Zhu, who goes and returns the next day; Liao Luyan to go north in a few days; the conference of three days too short, five to seven needed; printed from the Center''s document (with the manuscript)); [[w.deng-xiaoping-nianpu-1904]], III, 1622 (Mar. 13, 1961; Mao''s letter to Liu, Zhou, Chen Yun, Deng, Peng Zhen and the Three North conference: the two egalitarianisms, between teams and within the team, "extremely grave"; Deng and Peng Zhen to spend ten days after the meeting at Miyun, Shunyi and Huairou, each level apart; "busy with routine", no typical inquiry in person; Tao Zhu to come to Peking (footnote 1: Tao, then first secretary of the Central-South Bureau and in Guangdong)); [[w.mao-zedong-zhuan]], V, ch. 67 n.26 (Mar. 13, early morning, the letter to Liu Shaoqi and the others: to study the two egalitarianisms, among teams of a brigade and among members of a team; Tao Zhu sent to the Peking meeting; Deng Xiaoping and Zhou Enlai propose joining the two meetings, Mao agrees, at Canton, and Tao Zhu does not go). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 67), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.zedong-jianguo-yilai-mao-zedong]], 9, 440–41 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24a); [[w.zhonggong-dangshi-jiaoxue-cankao]], 23, 448 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24b); [[w.jin-1949-1989-niande-zhongguo]], 376 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24c); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 904–05 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24d); Mao Zedong 毛泽东, letter to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the comrades at the Peking meeting, Mar. 13, 1961; in [[w.mao-zedong-wenji]], VIII, 250 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.26). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Tao Zhu.'
- edit:
    id: cal.1961-03-13.china-leadership-2
    base: 330d620a
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 13, 1961. [[w.mao-zedong-zhuan]], V, ch. 67 nn.27, 28 (Mar. 13, the Three South conference: the two egalitarianisms, and investigation; the mess halls, a Guangdong brigade secretary''s four harms). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 67). To check: Mao Zedong 毛泽东, speech at the Three South conference 三南会议, Canton, Mar. 13, 1961 (record 讲话记录; one sentence supplied from Tian Jiaying''s relay record and Wang Renzhong''s diary of Apr. 1, 1961, as n.27 says) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.27); Mao Zedong 毛泽东, speech at the Three South conference 三南会议, Mar. 13, 1961; in [[w.mao-zedong-wenji]], VIII, 252–254 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.28). Names: Mao Zedong.'
- edit:
    id: cal.1961-03-23.china-leadership
    base: 486eb2b6
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 23, 1961. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 508 (Mar. 23, 1961; Liu presides at the Central Work Conference''s session); [[w.jianguo-yilai-mao-zedong]], XV, 526–527 (Mar. 23, 1961; Mao''s title for Hu Qiaomu''s draft, his note on how far it goes (to counties, regiments, city districts, big factories, universities, the great papers) and his rewriting of a passage: the errors came at root from leaders slackening the investigation done well in the anti-Japanese and civil wars; he dates it Mar. 23; printed from the manuscript and his revised copy; the title and the reach, not the speech); [[w.yang-shangkun-riji]], I, 666 (Mar. 23, 1961; the conference ends that day, Mao speaking in the afternoon, as Yang hears it; the plane to Canton could not get through); [[w.deng-xiaoping-nianpu-1904]], III, 1624 (Mar. 23, 1961; afternoon; Deng at the plenary. Deng: the Chairman''s criticism apt and needed; the Secretariat''s routine not bad, its counsel on great decisions poor, for want of investigation, its material chiefly reports; problems sensed in some places and not investigated or solved; investigation a basic method); [[w.mao-zedong-zhuan]], V, ch. 67 n.33 (Mar. 23: the conference closes; Mao''s third speech on investigation since the Peking conference; the Center''s letter on earnest investigation adopted). Made public: 1996. To check: Mao Zedong 毛泽东, speech closing the Canton work conference 广州会议, Mar. 23, 1961; in [[w.mao-zedong-wenji]], VIII, 256–265 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.33). Names: Mao Zedong, Hu Qiaomu.'
- edit:
    id: cal.1961-04-25.china-leadership
    base: d1853dd8
    set:
