      - state:tx
- add:
    entry:
      id: cal.1965-04-19.program
      when: Apr. 19
      date: '1965-04-19'
      thread: program
      c: The Ranch. Johnson some three hours on the telephone with McGeorge Bundy on foreign problems.
      n: '[[w.johnson-white-house-diary]], 261. Made public: 1970. Names: Bundy, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - state:tx
- add:
    entry:
      id: cal.1965-04-19.vietnam-support
      when: Apr. 19
      date: '1965-04-19'
      thread: vietnam-support
      c: 'Aboard Air Force One, to four reporters of the pool, on Vietnam: "If they bomb our barracks or the Saigon Embassy, we never hear anything about it; but if we bomb a radar installation or munitions depot or a bridge, the papers give us hell for it." Of China and Russia saying stop: "It is not all right to bomb people in the North, but it is O.K. to invade the South." How can a Senator, a newspaperman or a student tie the hands of American military men?'
      n: '[[w.johnson-white-house-diary]], 262 (Mrs. Johnson''s account, aboard). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - polity:prc
      - polity:ussr
- add:
    entry:
      id: cal.1965-04-19.south-carolina
      when: Apr. 19
      date: '1965-04-19'
      thread: south-carolina
      c: Columbia, S.C. Johnson and Lady Bird Johnson stop on the way from the Ranch to Washington for a memorial service for Senator Olin Johnston, dead the day before, in the State Capitol, where his body lies in state in the rotunda. Governor and Mrs. Russell meet them at the airport. His minister and the Governor speak.
      n: '[[w.johnson-white-house-diary]], 262–63 (Mrs. Johnson''s account). Names: Johnston, Russell, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:johnston-olin-d
      - name:russell-donald-s
      - state:sc
      - city:columbia
