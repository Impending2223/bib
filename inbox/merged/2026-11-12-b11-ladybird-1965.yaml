    entry:
      id: cal.1965-04-11.elections-1968-johnson
      when: Apr. 11
      date: '1965-04-11'
      thread: elections-1968-johnson
      c: 'On the boat at the lake, Johnson tells Carl Albert and Senator McCarthy he is going to be a teacher, come back to the Hill Country and live. Mrs. Johnson: he is more and more enthusiastic about it.'
      n: '[[w.johnson-white-house-diary]], 259–60 (Mrs. Johnson''s account). Made public: 1970. Names: Albert, McCarthy, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
