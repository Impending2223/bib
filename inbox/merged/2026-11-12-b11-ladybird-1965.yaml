      when: Aug. 12
      date: '1965-08-12'
      thread: program
      c: Dinner on the Sequoia for thirty-five Ambassadors from countries scattered round the world, three and a half hours, Johnson moving about the boat to cover the crowd.
      n: '[[w.johnson-white-house-diary]], 311 (Mrs. Johnson, as Johnson told it at Andrews). Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-08-12.economy
      when: Aug. 12
      date: '1965-08-12'
      thread: economy
      c: Johnson, in the day, a fiscal talk with Henry Fowler.
      n: '[[w.johnson-white-house-diary]], 311 (Mrs. Johnson, of Johnson''s day, as he told it). Made public: 1970. Names: Fowler, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:fowler-henry-h
- add:
    entry:
      id: cal.1965-09-02.transition-and-staff
      when: Sept. 2
      date: '1965-09-02'
      thread: transition-and-staff
      c: Independence, Mo. Lady Bird Johnson, Bill Heath, Max Brooks and Roy White inspect the Truman Library for the Johnson Library; Truman gives the tour, Mrs. Truman and Dr. Philip Brooks with them, then lunch at the Old Apple Farm. No press at the airstrip; a few cameras at the Library.
      n: '[[w.johnson-white-house-diary]], 312–14 (Mrs. Johnson''s account). See [[cal.1965-02-12.transition-and-staff]]. Names: Truman, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - state:mo
- add:
    entry:
      id: cal.1965-09-02.program
      when: Sept. 2
      date: '1965-09-02'
      thread: program
      c: 'Abilene, Kan. The same party at the Eisenhower Library a few minutes before the 4:30 closing, Dr. William Aeschbacher the director; cameras and microphones at the front, where she says a few words. Dedicated two years before, not yet open to scholars. Mrs. Johnson''s view: the legislation, the decisions, to be displayed dramatically; library and museum to be melded.'
      n: '[[w.johnson-white-house-diary]], 314–15 (Mrs. Johnson''s account). See [[cal.1965-02-12.transition-and-staff]]. Names: Eisenhower, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:eisenhower-dwight-d
      - state:ks
- add:
    entry:
      id: cal.1965-09-07.succession
      when: Sept. 7
      date: '1965-09-07'
      thread: succession
      c: 'The Ranch, about 4 a.m. Johnson has "awful pains in his stomach"; he will not have Dr. Burkley called till dawn. Burkley thinks it kidney stones; an electrocardiogram. Johnson''s feeling: "as long as we really knew nothing, we should say nothing"; Mrs. Johnson goes on to Jackson Hole. In the evening he telephones her there: Dr. Hurst with him, X-rays, it sounds like gallstones; he will keep his appointments but make no more, and no statement yet; more tests next day.'
      n: '[[w.johnson-white-house-diary]], 316–19 (Mrs. Johnson''s account). Made public: 1970. Names: Burkley, Hurst, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:burkley-george-g
      - state:tx
      - name:hurst-e-h
- add:
    entry:
      id: cal.1965-09-07.conservation
      when: Sept. 7
      date: '1965-09-07'
      thread: conservation
      c: Jackson Hole, Wyo. The American Forestry Association's dinner, about five hundred; Senator Clinton Anderson receives its Distinguished Service Award. Laurance Rockefeller introduces Lady Bird Johnson; she speaks, then shakes hands with the guests at the door.
      n: '[[w.johnson-white-house-diary]], 318–20 (Mrs. Johnson''s account). See [[cal.1965-09-07.succession]]. Names: Anderson, Rockefeller, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:anderson-clinton-p
      - name:rockefeller-laurance-s
      - state:wy
- add:
    entry:
      id: cal.1965-09-10.states-and-cities
      when: Sept. 10
      date: '1965-09-10'
      thread: states-and-cities
      c: 'Johnson leaves the White House about 5 p.m. for New Orleans, to survey the damage of Hurricane Betsy; back about 1 a.m., he checks the Departments by telephone: food flown in, medicine and cots.'
      n: '[[w.johnson-white-house-diary]], 320 (Mrs. Johnson''s account, of Sept. 11; she reached the White House a little before midnight). To check: the President''s Daily Diary, Sept. 10, 1965. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:la
      - city:new-orleans
- add:
    entry:
      id: cal.1965-10-03.program
      when: Oct. 3
      date: '1965-10-03'
      thread: program
      c: 'New York. The Goldbergs'' dinner for the Johnsons in their Waldorf Towers suite: the Nelson Rockefellers, the McCormacks, the Rusks, Cardinal Spellman, Fanfani, U Thant, the Mansfields, the Javitses, Robert Kennedy, Mayor Wagner and others. Goldberg recites a Hebrew prayer for peace. Spellman would make "a small donation" to the Johnson Library. Demonstrators below, against Vietnam and the Dominican Republic.'
      n: '[[w.johnson-white-house-diary]], 323–24 (Mrs. Johnson''s account). See [[cal.1965-10-03.desegregation-schools]]. Made public: 1970. Names: Goldberg, Rockefeller, McCormack, Rusk, Spellman, Fanfani, Mansfield, Javits, Kennedy, Wagner, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:goldberg-arthur-j
      - name:rockefeller-nelson
      - name:mccormack-john-w
      - name:rusk-dean
      - name:spellman-francis
      - name:fanfani-amintore
      - name:mansfield-mike
      - name:javits-jacob-k
      - name:kennedy-robert-f
      - name:wagner-robert-f-jr
      - city:new-york
- add:
    entry:
      id: cal.1965-10-06.congress
      when: Oct. 6
      date: '1965-10-06'
      thread: congress
      c: At 5 the East Room, a reception for the new Democratic members of the 89th Congress. Johnson welcomes and thanks them; Larry O'Brien shows by charts the seventy bills of January, their progress, and the four yet to come to the floor.
      n: '[[w.johnson-white-house-diary]], 326 (Mrs. Johnson''s account). Names: O''Brien, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1965-10-06.europe-and-the-alliance
      when: Oct. 6
      date: '1965-10-06'
      thread: europe-and-the-alliance
      c: Upstairs at the White House, the Jacob Epstein bust of Churchill accepted from his wartime friends, Harriman's idea. Harriman's tribute; Johnson speaks briefly; Sir Patrick Dean replies; Mrs. Johnson speaks. Among the donors Ambassador Bruce, Spaatz, Anderson and Eaker; Churchill's grandson.
      n: '[[w.johnson-white-house-diary]], 327 (Mrs. Johnson''s account). Names: Harriman, Bruce, Dean, Churchill, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:bruce-david-k-e
      - name:dean-patrick
      - name:harriman-w-averell
      - name:churchill-winston-s
- add:
    entry:
      id: cal.1965-10-11.foreign-aid
      when: Oct. 11
      date: '1965-10-11'
      thread: foreign-aid
      c: 'Bethesda. Clark Clifford with Johnson on aid to foreign countries and the UN. Johnson: of Goldberg, "we have got a billion dollars in chips in your pile and don''t you put them in until you can win the hand." "I am just like a dog on a point."'
      n: '[[w.johnson-white-house-diary]], 328. Made public: 1970. Names: Clifford, Goldberg, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:goldberg-arthur-j
- add:
    entry:
      id: cal.1965-10-11.soviet-union
      when: Oct. 11
      date: '1965-10-11'
      thread: soviet-union
      c: Bethesda. Rusk, an hour with Johnson, brings good wishes from the leaders of the Soviet Union and brings him up to date on a number of matters.
      n: '[[w.johnson-white-house-diary]], 328. Made public: 1970. Names: Rusk, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:rusk-dean
      - polity:ussr
- add:
    entry:
      id: cal.1965-10-21.vietnam-support
      when: Oct. 21
      date: '1965-10-21'
      thread: vietnam-support
      c: 'Bethesda, leaving the hospital, Johnson stops in a ward of Marines wounded in Vietnam: "when I feel pretty blue at night, and I issue the orders that you carry out, I do it with a heavy heart." Patients at the windows: "Good luck, Mr. President." "The military is behind you."'
      n: '[[w.johnson-white-house-diary]], 329 (Mrs. Johnson''s account). See [[cal.1965-10-08.succession]]. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-11-02.elections-1965
      when: Nov. 2
      date: '1965-11-02'
      thread: elections-1965
      c: Johnson City, Tex. Johnson and Lady Bird Johnson vote first, 8 a.m., the Pedernales Electric Co-op Building, before the press and flashing cameras, Judge McNatt handing them the ballots. Then he leads about twenty cars of press home by country roads, past the Lewis place.
      n: '[[w.johnson-white-house-diary]], 332–33 (Mrs. Johnson''s account). See [[cal.1965-11-02.state-constitutions-tx]]. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1965-11-03.economy
      when: Nov. 3
      date: '1965-11-03'
      thread: economy
      c: 'The Ranch. Johnson, on a long drive and then at dinner with Moyers and the newspaper people, in discussing foreign affairs: "this country is in trouble because we cannot any longer make things bigger and better than other countries. We have put Germany and Japan back in business and they are selling their heads off."'
      n: '[[w.johnson-white-house-diary]], 336. Names: Moyers, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:moyers-bill
      - polity:frg
- add:
    entry:
      id: cal.1965-12-14.south-asia
      when: Dec. 14
      date: '1965-12-14'
      thread: south-asia
      c: 'The state dinner for Ayub Khan, 137 guests. His toast, to Johnson as "a friend": relations "to a certain extent, been soiled" through lack of understanding of each other''s difficulties; the war with "our big neighbor, India." Bhutto at Mrs. Johnson''s left. After dinner Johnson takes Ayub and some Ministers upstairs for about thirty minutes.'
      n: '[[w.johnson-white-house-diary]], 337–40 (Mrs. Johnson''s account). See [[cal.1965-12-14.india-and-china]]. To check: 1965 Pub. Papers. Names: Ayub Khan, Bhutto, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:ayub-khan-mohammad
      - name:bhutto-zulfikar-ali
- add:
    entry:
      id: cal.1965-12-20.europe-and-the-alliance-2
      when: Dec. 20
      date: '1965-12-20'
      thread: europe-and-the-alliance
      c: 'The state dinner for Chancellor Erhard. Johnson, in his toast: a Commission to Europe shortly on joint explorations in space; "There will be peace in Vietnam the very moment that others are ready to stop their attacks." Erhard, in German: the United States is making great sacrifices for the security of Vietnam, "But that is also our security. ... I feel ashamed, because what we can contribute is very modest compared with what you do."'
      n: '[[w.johnson-white-house-diary]], 341–42 (Mrs. Johnson''s account). See [[cal.1965-12-20.europe-and-the-alliance]]. To check: 1965 Pub. Papers. Names: Erhard, Schroeder, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:erhard-ludwig
      - name:schroder-gerhard
- add:
    entry:
      id: cal.1965-01-12.japan
      when: Jan. 12
      date: '1965-01-12'
      thread: japan
      c: 'The state dinner for Satō. Through it Johnson has ten-gallon hats brought and crimps them for Satō and his Foreign Minister. Johnson''s toast: to "make the world a better place through technology, a more beautiful place through the arts, and a more rational place through the quest for truth by unfettered minds." Satō: frictions more publicized than agreement; he hopes some day for a ten-gallon hat.'
      n: '[[w.johnson-white-house-diary]], 218–19 (Mrs. Johnson''s account: "Evidently Lyndon had had a preview of his toast"). See [[cal.1965-01-12.japan-and-korea]]. To check: The President''s Toast at a Dinner in Honor of Prime Minister Sato, [1965 Pub. Papers 36](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=112) (Jan. 12, 1965). Names: Satō, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:sato-eisaku
- add:
    entry:
      id: cal.1965-01-20.transition-and-staff-4
      when: Jan. 20
      date: '1965-01-20'
      thread: transition-and-staff
      c: The inaugural luncheon in the old Supreme Court Chamber, Senator Jordan presiding, as chairman of Rules having overridden the order against luncheons there.
      n: '[[w.johnson-white-house-diary]], 226–27 (Mrs. Johnson''s account; Leonard Marks there: the crowd the largest in the Capitol''s history). See [[cal.1965-01-20.transition-and-staff]]. Names: Jordan.'
      tags:
      - name:johnson-lady-bird
      - name:jordan-benjamin-e
- add:
    entry:
      id: cal.1965-01-21.transition-and-staff-2
      when: Jan. 21
      date: '1965-01-21'
      thread: transition-and-staff
      c: 'Dinner: Johnson has Humphrey call Muriel Humphrey to join them; Mrs. Johnson calls the Thornberrys; the six dine. Mrs. Johnson: no President and Vice President can keep up day after day "a completely simpatico relationship," but they have it now.'
      n: '[[w.johnson-white-house-diary]], 231 (Mrs. Johnson''s account). See [[cal.1965-01-21.program]]. Made public: 1970. Names: Humphrey, Thornberry, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:thornberry-william-h
- add:
    entry:
      id: cal.1965-02-09.transition-and-staff
      when: Feb. 9
      date: '1965-02-09'
      thread: transition-and-staff
      c: 'Dinner upstairs after the first Congressional reception: the Johnsons, the Humphreys and the Larry O''Briens. Humphrey''s new reason for not being sent to Churchill''s funeral: "Hubert just can''t look sad," so they are saying.'
      n: '[[w.johnson-white-house-diary]], 240 (Mrs. Johnson''s account; Johnson "reducing the day''s problems to salty, picturesque summaries"). See [[cal.1965-01-27.europe-and-the-alliance]]. Made public: 1970. Names: Humphrey, O''Brien, Churchill, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:churchill-winston-s
- add:
    entry:
      id: cal.1965-02-11.vietnam-congress-4
      when: Feb. 11
      date: '1965-02-11'
      thread: vietnam-congress
      c: 'The second of the ten Congressional receptions, 6:30 p.m.: Lady Bird Johnson meets the guests in the East Room, then the Green Room.'
      n: '[[w.johnson-white-house-diary]], 242 (Mrs. Johnson''s account; not the briefing). See [[cal.1965-02-09.vietnam-congress-3]]. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-02-12.transition-and-staff-2
      when: Feb. 12
      date: '1965-02-12'
      thread: transition-and-staff
      c: 'Dinner at 11 p.m., till 12:30: Johnson, Lady Bird Johnson, Lynda Bird and Bill Heath, on Heath''s plans for the library and a school at the University of Texas. Johnson on the difficulty of getting competent men to serve: he would call on men trained in Texas, the Southwest and the South for the Cabinet and the agencies.'
      n: '[[w.johnson-white-house-diary]], 243–44 (Mrs. Johnson''s account). See [[cal.1965-02-12.transition-and-staff]]. Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1965-03-03.soviet-union
      when: Mar. 3
      date: '1965-03-03'
      thread: soviet-union
      c: Moscow. Another attack on the American Embassy, stones and ink bottles hurled by "mobs of students and other dissidents."
      n: '[[w.johnson-white-house-diary]], 246 (Mrs. Johnson, Mar. 3: "this week ... another in Moscow"). See [[cal.1965-02-09.soviet-union]]. Check: the day.'
- add:
    entry:
      id: cal.1965-03-07.press-and-broadcasting-2
      when: Mar. 7
      date: '1965-03-07'
      thread: press-and-broadcasting
      c: 'The National City Christian Church: the Johnsons, Lynda and Paul Dresser. At the coffee hour, a receiving line; Johnson picks up, bounces and kisses a small girl in red velvet, Kimberley Fry, to the delight of the photographers.'
      n: '[[w.johnson-white-house-diary]], 247 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-03-09.vietnam-congress
      when: Mar. 9
      date: '1965-03-09'
      thread: vietnam-congress
      c: 'The ninth of the ten Congressional receptions, 6:30 p.m.: "the usual working session," a long briefing that ends after 9, "the ladies starving for refreshments."'
      n: '[[w.johnson-white-house-diary]], 250 (Mrs. Johnson''s account; not the speakers). See [[cal.1965-02-09.vietnam-congress-3]]. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-04-09.program
      when: Apr. 9
      date: '1965-04-09'
      thread: program
      c: 'On the Jetstar to the Ranch, arriving about 10:45 p.m., Johnson talks of the harvest of legislation: never has there been "such a hundred days."'
      n: '[[w.johnson-white-house-diary]], 257 (Mrs. Johnson, Apr. 10, of the night before; her week: Medicare through the House, the civil rights bill reported, the education bill). See [[cal.1965-04-08.medicare]]. Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-06-17.space-3
      when: June 17
      date: '1965-06-17'
      thread: space
      c: At dinner, past 11, Johnson telephones Mrs. Arthur Krim to fly to Paris within hours as interpreter for the astronauts; she comes, rests in the Queen's Room, and leaves before dawn with Humphrey, the astronauts and Dr. James Cain.
      n: '[[w.johnson-white-house-diary]], 291–92 (Mrs. Johnson''s account). See [[cal.1965-06-17.space]]. Made public: 1970. Names: Humphrey, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1965-07-18.press-and-broadcasting-2
      when: July 18
      date: '1965-07-18'
      thread: press-and-broadcasting
      c: Secretary Connor on Meet the Press, assured, his homework done. Johnson, watching at Camp David, telephones him as soon as it ends to tell him so.
      n: '[[w.johnson-white-house-diary]], 303 (Mrs. Johnson''s account; not the subjects). Names: Connor, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:connor-john-t
- add:
    entry:
      id: cal.1965-08-06.program
      when: Aug. 6
      date: '1965-08-06'
      thread: program
      c: Greenwich, Conn. Lady Bird Johnson and Lynda, asked by Mrs. Hirshhorn, an hour among Joseph Hirshhorn's sculpture at his house, his lawyer Sam Harris there. The Tate and New York museums are said to be wooing the collection.
      n: '[[w.johnson-white-house-diary]], 307–08 (Mrs. Johnson''s account). See [[cal.1965-05-21.program]]. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:ct
- add:
    entry:
      id: cal.1965-08-09.health
      when: Aug. 9
      date: '1965-08-09'
      thread: health
      c: 'Health Research Facilities Amendments of 1965 signed, [79 Stat. 448](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg448.pdf): construction grants for health research facilities extended to June 30, 1968, up to $280 million for fiscal 1967–69; three more Assistant Secretaries of Health, Education, and Welfare. Rogers, Kornegay, Javits and Hill at the signing.'
      n: 'Health Research Facilities Amendments of 1965, Pub. L. No. 89-115, [79 Stat. 448](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg448.pdf) (Aug. 9, 1965). [[w.johnson-white-house-diary]], plates following 278 (the caption: "Signing of Health Research Facilities Amendments, August 9, with Paul Rogers, Horace Kornegay, Jacob Javits, Lister Hill"). To check: 1965 Pub. Papers. Names: Rogers, Javits, Hill, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:rogers-paul-g
      - name:javits-jacob-k
      - name:hill-lister
