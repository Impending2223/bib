    entry:
      id: cal.1965-10-06.press-and-broadcasting
      when: Oct. 6
      date: '1965-10-06'
      thread: press-and-broadcasting
      c: Johnson pops in at the National Press Club's luncheon for cartoonists, the day before he enters the hospital.
      n: '[[w.johnson-white-house-diary]], 326 (Mrs. Johnson, of his day: "as though to show the world how tough, how indestructible he was on the eve of going to the hospital"). Names: Johnson.'
