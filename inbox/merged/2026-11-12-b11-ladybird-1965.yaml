    entry:
      id: cal.1965-04-21.europe-and-the-alliance
      when: Apr. 21
      date: '1965-04-21'
      thread: europe-and-the-alliance
      c: 'Moro''s return reception at the Italian Embassy, Ambassador Fenoaltea the host: Johnson and Lady Bird Johnson press through the crush with Moro and the Fenoalteas, the photographers retreating before them; little more than thirty minutes.'
      n: '[[w.johnson-white-house-diary]], 263–64 (Mrs. Johnson''s account). See [[cal.1965-04-20.europe-and-the-alliance]]. Names: Moro, Johnson.'
      tags:
