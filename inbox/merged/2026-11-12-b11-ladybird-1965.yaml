patch: 2026-11-12-b11-ladybird-1965
by: 'Claude (batch 11, share: Lady Bird Johnson, A White House Diary, 1965), Nov. 12, 2026; audited and corrected, batch 11 auditor, Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1965-01-04.democratic-party
      when: Jan. 4
      date: '1965-01-04'
      thread: democratic-party
      c: Russell Long wins the Senate Democrats' Number Two place, vacated by Humphrey, against Pastore and Monroney.
      n: '[[w.johnson-white-house-diary]], 215 (Mrs. Johnson''s account: he "just won"; not the vote or the hour). To check: the Congressional Record, Jan. 4, 1965. Names: Long, Pastore, Monroney, Humphrey.'
      tags:
      - name:long-russell-b
      - name:pastore-john-o
      - name:monroney-almer-s
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1965-01-06.congress
      when: Jan. 6
      date: '1965-01-06'
      thread: congress
      c: The Rayburn statue, by Felix de Weldon, the Texas State Society's gift, dedicated in the new Rayburn House Office Building, 10 a.m. Patman presides. Lady Bird Johnson speaks. The President comes in as a surprise visitor before she does. Everett Hutchinson presents the statue, McCormack accepts it.
      n: '[[w.johnson-white-house-diary]], 216 (Mrs. Johnson''s account, with her words: "I''m a Democrat, without suffix, prefix or apology"). To check: the Congressional Record, Jan. 6, 1965. Names: Rayburn, Patman, McCormack, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:rayburn-sam
      - name:patman-wright
      - name:mccormack-john-w
      - state:tx
- add:
    entry:
      id: cal.1965-01-14.poverty
      when: Jan. 14
      date: '1965-01-14'
      thread: poverty
      c: 'In the Queen''s Room, Shriver presents to Lady Bird Johnson and Liz Carpenter a detailed analysis of Operation Head Start: 100,000 children of five and six, before the first grade in September, an eight-week course. They discuss Operation VISTA, a domestic Peace Corps. She weighs which to take up.'
      n: '[[w.johnson-white-house-diary]], 219. Made public: 1970. Names: Shriver, Carpenter, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:shriver-r-sargent
      - name:carpenter-liz
- add:
    entry:
      id: cal.1965-01-14.transition-and-staff
      when: Jan. 14
      date: '1965-01-14'
      thread: transition-and-staff
      c: 'A farewell party for Martha and Luther Hodges, about 7:15 p.m., the Yellow Oval Room: the Cabinet and wives, about ten of the top staff and wives. Lady Bird Johnson speaks. The Cabinet gives them a silver tray. The Hodgeses are going back to North Carolina.'
      n: '[[w.johnson-white-house-diary]], 219–20. Made public: 1970. Names: Hodges, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:hodges-luther-h
      - state:nc
- add:
    entry:
      id: cal.1965-01-15.trade
      when: Jan. 15
      date: '1965-01-15'
      thread: trade
      also:
      - europe-and-the-alliance
      c: 'At the LBJ Ranch: Rusk, McGeorge Bundy and Canada''s Paul Martin land, then Prime Minister and Mrs. Pearson. Informal remarks at the hangar to the newspapermen. At dinner, with Connally, the talk is of Churchill, in a coma and said to be past hope.'
      n: '[[w.johnson-white-house-diary]], 220–21. Made public: 1970 (the dinner). To check: the President''s Daily Diary, Jan. 15, 1965. Names: Pearson, Rusk, Bundy, Connally.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:pearson-lester-b
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:connally-john
      - state:tx
- add:
    entry:
      id: cal.1965-01-18.democratic-party
      when: Jan. 18
      date: '1965-01-18'
      thread: democratic-party
      c: 'The pre-inaugural dinners: about three thousand at the Sheraton Park, renamed "Sheraton Texas," Connally introducing the President; eighteen hundred, the President''s Club, at the Shoreham. Brief stops, humorous remarks, ending: "Now is the time for hope and rededication." Humphrey at the two others.'
      n: '[[w.johnson-white-house-diary]], 223 (Mrs. Johnson''s account; Leonard Marks drove with them). To check: 1965 Pub. Papers. Names: Connally, Humphrey.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:connally-john
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1965-01-18.transition-and-staff
      when: Jan. 18
      date: '1965-01-18'
      thread: transition-and-staff
      c: 'The inaugural gala, the Armory; the Johnsons arrive on time. Richard Adler directs. Of the contemporary politics, Bobby Darin''s "Mack the Knife," which, he says, the Army Reserve dedicated to the Secretary of Defense, and Hitchcock''s message, ostensibly to the Republicans of Nov. 4: "do you have that ''morning after'' feeling?"'
      n: '[[w.johnson-white-house-diary]], 223–24 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-01-18.transition-and-staff-2
      when: Jan. 18
      date: '1965-01-18'
      thread: transition-and-staff
      c: The Distinguished Ladies' Reception, the National Gallery of Art, about 3 p.m., five thousand women; Lady Bird Johnson receives, diplomats' wives in native dress.
      n: '[[w.johnson-white-house-diary]], 222 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-01-20.transition-and-staff-2
      when: Jan. 20
      date: '1965-01-20'
      thread: transition-and-staff
      c: The inaugural parade, 2:30 to 5, fifty-two bands and fifteen thousand marchers, Howard Burris chairman; the President reviews it behind a glass barrier at the White House. On the avenue he had stopped the procession to shake hands with three or four of the Southwest Texas Strutters, of his old college. Governors pass in their convertibles; the McNamaras and Wheeler join the stand with the military units, Shriver and his children, Margaret Truman and Clifton Daniel with the Missouri float. Johnson greets Farley and Billy Graham in the stands.
      n: '[[w.johnson-white-house-diary]], 227–29 (Mrs. Johnson''s account). Names: McNamara, Wheeler, Shriver, Graham, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:shriver-r-sargent
      - name:graham-billy
- add:
    entry:
      id: cal.1965-01-20.democratic-party-2
      when: Jan. 20
      date: '1965-01-20'
      thread: democratic-party
      c: 'The inaugural balls, from 9:15: the Mayflower, the Statler-Hilton, the Armory (13,000), the Shoreham, "full of Minnesotans," the Sheraton Park, the Texans'' ball. At the last the President: "Never have so many paid so much to dance so little! ... One thing I can say about the Great Society—it sure is crowded."'
      n: '[[w.johnson-white-house-diary]], 229–30 (Mrs. Johnson''s account). See [[cal.1965-01-20.democratic-party]] (the Shoreham). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-01-20.transition-and-staff-3
      when: Jan. 20
      date: '1965-01-20'
      thread: transition-and-staff
      c: 'The Interfaith Prayer Service, the National City Christian Church, the morning (the Johnsons leave at a quarter of 9): the Court, the Cabinet, the principal figures of government and of Johnson City; brief prayers by ministers of many faiths, a Roman Catholic Monsignor who came with Archbishop Lucey among them. Not an empty seat.'
      n: '[[w.johnson-white-house-diary]], 224 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-01-21.program
      when: Jan. 21
      date: '1965-01-21'
      thread: program
      also:
      - congress
      c: 'The Yellow Room, 10 a.m.: Johnson with the House leadership and the committee chairmen, on how to start the legislative program: McCormack, Albert, Boggs, Humphrey; Busby, Valenti, Moyers, Cater, O''Brien; Smith, Rivers, Mills, Patman, Teague, Mahon. After the Congressmen leave, to O''Brien: "John Kennedy is watching us up in heaven and we are going to wrap up all of his legislation and put it in a package and tie it up and label it JFK."'
      n: '[[w.johnson-white-house-diary]], 230–31 (Mrs. Johnson, called in to greet them). See [[cal.1965-01-21.vietnam]]. To check: the President''s Daily Diary, Jan. 21, 1965. Names: McCormack, Albert, Boggs, Humphrey, Busby, Valenti, Moyers, Cater, O''Brien, Smith, Rivers, Mills, Patman, Teague, Mahon, Kennedy, Johnson. Check: the hour, 10 a.m., which [[cal.1965-01-21.vietnam]] gives (10:07) to the leaders of both parties on Vietnam.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:albert-carl
      - name:boggs-hale
      - name:humphrey-hubert-h
      - name:busby-horace
      - name:valenti-jack
      - name:moyers-bill
      - name:patman-wright
      - name:kennedy-john-f
      - name:cater-s-douglass
      - name:obrien-lawrence-f
      - name:smith-howard-w
      - name:rivers-l-mendel
      - name:mills-wilbur-d
      - name:teague-olin-e
      - name:mahon-george-h
- add:
    entry:
      id: cal.1965-01-24.succession
      when: Jan. 24
      date: '1965-01-24'
      thread: succession
      c: 'Bethesda Naval Hospital. Johnson''s doctors tell Lady Bird Johnson they are strongly opposed to his going to Churchill''s funeral next Saturday: he would be weak and open to infection, and they skirt the word "pneumonia." She thinks it wise not to go.'
      n: '[[w.johnson-white-house-diary]], 231 (Mrs. Johnson''s account; Dr. Wilbur Gould). See [[cal.1965-01-23.succession]]; [[cal.1965-01-24.europe-and-the-alliance]]. Made public: 1970. Names: Churchill, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:churchill-winston-s
- add:
    entry:
      id: cal.1965-01-27.europe-and-the-alliance
      when: Jan. 27
      date: '1965-01-27'
      thread: europe-and-the-alliance
      c: 'Johnson, at a 5:30 press conference in his bedroom, to a small group of newspapermen: the doctors have warned him against going to London, being susceptible to reinfection. He names Rusk, the Chief Justice and Ambassador Bruce to represent him.'
      n: '[[w.johnson-white-house-diary]], 232. See [[cal.1965-01-24.succession]]. To check: 1965 Pub. Papers; the President''s Daily Diary, Jan. 27, 1965. Names: Rusk, Warren, Bruce, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:warren-earl
      - name:bruce-david-k-e
      - name:churchill-winston-s
- add:
    entry:
      id: cal.1965-01-27.transition-and-staff
      when: Jan. 27
      date: '1965-01-27'
      thread: transition-and-staff
      c: Johnson decides to name the Acting Attorney General, Katzenbach, Attorney General, and Ramsey Clark Deputy Attorney General. He calls Katzenbach, who comes with his wife a little past 7 to the family quarters; he and Johnson talk of making Washington a law-abiding city.
      n: '[[w.johnson-white-house-diary]], 232–33 (Mrs. Johnson''s account: "the other decision" of the day). Made public: 1970 (the evening). Names: Katzenbach, Clark, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
      - name:clark-ramsey
- add:
    entry:
      id: cal.1965-01-27.press-and-broadcasting
      when: Jan. 27
      date: '1965-01-27'
      thread: press-and-broadcasting
      c: 'Luci Johnson''s interview with a Chilean newspaperwoman, who sold it to Ebony, runs in a long article; the wire services summarize it. Luci on race: "the problem will be solved only when Negroes are neither loved, hated nor accepted"; politics once the most despicable activity, her view changed by Kennedy''s assassination.'
      n: '[[w.johnson-white-house-diary]], 232–33 (Mrs. Johnson''s account, the day the wire services carried it; Luci''s words as she quotes them). Names: Johnson, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:johnson-luci-baines
- add:
    entry:
      id: cal.1965-02-03.conservation
      when: Feb. 3
      date: '1965-02-03'
      thread: conservation
      c: 'Laurance Rockefeller and Mrs. Rockefeller to coffee with Lady Bird Johnson: why he has put his life, mind and money into beautification and recreation. He is to chair the National Conference on Beauty that Johnson is calling for mid-May.'
      n: '[[w.johnson-white-house-diary]], 234. Made public: 1970. Names: Rockefeller, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:rockefeller-laurance-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-03.poverty
      when: Feb. 3
      date: '1965-02-03'
      thread: poverty
      c: 'About 4 p.m., Lady Bird Johnson''s tea in the Blue Room, at Shriver''s asking, for some thirty: the War on Poverty''s Advisory Council, five Cabinet members, Celebrezze, Freeman, Katzenbach, Udall and Wirtz, and Mrs. McNamara. Singletary, Job Corps director: applications about six thousand a day. Galbraith and A. Philip Randolph present. Shriver asks her to sponsor Head Start, an honorary chairmanship.'
      n: '[[w.johnson-white-house-diary]], 234–35 (Mrs. Johnson''s account). Made public: 1970. Names: Shriver, Celebrezze, Freeman, Katzenbach, Udall, Wirtz, Galbraith, Randolph, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:shriver-r-sargent
      - name:celebrezze-anthony-j
      - name:freeman-orville-l
      - name:katzenbach-nicholas
      - name:udall-stewart-l
      - name:wirtz-w-willard
      - name:galbraith-john-kenneth
      - name:randolph-a-philip
- add:
    entry:
      id: cal.1965-02-03.civil-rights-organizations
      when: Feb. 3
      date: '1965-02-03'
      thread: civil-rights-organizations
      c: The Shoreham. Johnson receives the Democratic Legacy Award of the Anti-Defamation League of B'nai B'rith; he arrives about 10 p.m. in a business suit, without dinner, met by Dore Schary and Abe Feinberg, and speaks.
      n: '[[w.johnson-white-house-diary]], 235–36. To check: 1965 Pub. Papers. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-04.soviet-union-un
      when: Feb. 4
      date: '1965-02-04'
      thread: soviet-union-un
      c: 'Stevenson, waiting to see Johnson, who is held on the telephone, talks with Lady Bird Johnson, who brings a birthday cake: the failure of Russia and others to pay their UN dues for peace-keeping, the Congo and perhaps Gaza; then China.'
      n: '[[w.johnson-white-house-diary]], 236 (Mrs. Johnson''s account: "he talked seriously to me"). Made public: 1970. Names: Stevenson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1965-02-04.republican-party-congress
      when: Feb. 4
      date: '1965-02-04'
      thread: republican-party-congress
      also:
      - program
      c: 'Dirksen at the family quarters, late afternoon, with Johnson in the West Hall for some two hours. Dirksen: "You don''t mind if we denounce you once in a while, do you, Lyndon?" Johnson on his years as Minority Leader under Eisenhower: with the President when he thought him right, against him "with dignity," and no "ugly things about him, nor about his wife, nor about his dog, nor his grandchildren."'
      n: '[[w.johnson-white-house-diary]], 237 (Mrs. Johnson, who left them and returned). Made public: 1970. To check: the President''s Daily Diary, Feb. 4, 1965. Names: Dirksen, Eisenhower, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:dirksen-everett
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1965-02-05.conservation
      when: Feb. 5
      date: '1965-02-05'
      thread: conservation
      c: 'Lady Bird Johnson''s Women Do-er''s Luncheon, the kick-off of the beautification program: Mary Lasker speaks, "masses of flowers where the masses pass." Senator Neuberger and Mrs. Udall among the guests.'
      n: '[[w.johnson-white-house-diary]], 237–38. Names: Neuberger, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:neuberger-maurine-b
- add:
    entry:
      id: cal.1965-02-05.students
      when: Feb. 5
      date: '1965-02-05'
      thread: students
      c: 'In the Diplomatic Reception Room, Johnson to the more than a hundred students of the Senate Youth Program, sponsored by the Hearst Foundation: why he wants them in government; out of office, he says, he will spend his retirement promoting their interest in it.'
      n: '[[w.johnson-white-house-diary]], 237–38 (Mrs. Johnson''s account). To check: 1965 Pub. Papers. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-08.press-and-broadcasting
      when: Feb. 8
      date: '1965-02-08'
      thread: press-and-broadcasting
      c: Lady Bird Johnson interviewed by six reporters of U.S. News & World Report, from 11, at Grant's Cabinet table in the Treaty Room, about two hours; a stenographer and a tape recorder.
      n: '[[w.johnson-white-house-diary]], 238–39 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-02-11.conservation
      when: Feb. 11
      date: '1965-02-11'
      thread: conservation
      c: 'The Committee on Beautification meets with Lady Bird Johnson, Blue Room tea, then the Red Room: Udall, Mary Lasker, Libby Rowe of the National Capital Planning Commission, Owings, Gruen, Walter Washington, Tobriner, Horsky, Boutin, Rogers, Walton, Laurance Rockefeller. She reads Lord Bryce on the capital. The Mall a showcase for the people; the city''s small triangles and squares planted by neighborhood and business volunteers. Norfolk offers five hundred azaleas, Freeman shrubs. Udall names small committees.'
      n: '[[w.johnson-white-house-diary]], 240–42 (Mrs. Johnson''s account). Names: Udall, Rockefeller, Washington, Boutin, Rogers, Walton, Freeman, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - name:rockefeller-laurance-s
      - name:washington-walter-e
      - name:boutin-bernard-l
      - name:rogers-william-p
      - name:walton-william
      - name:freeman-orville-l
- add:
    entry:
      id: cal.1965-02-12.program
      when: Feb. 12
      date: '1965-02-12'
      thread: program
      c: 'Lincoln''s birthday luncheon at the White House, Eric Goldman''s idea, for Lincoln scholars, actors who have played him and heads of the State Civil War Centennial Commissions. In the East Room Johnson receives the Gold Medal of the U.S. Civil War Centennial Commission; his luncheon speech: "love justice, extend liberty, remember you may be wrong, but act when you believe you''re right." Then by bus to the Lincoln Memorial, where Johnson is to lay a wreath.'
      n: '[[w.johnson-white-house-diary]], 242–43 (Mrs. Johnson''s account; Mary McGrory, later: Johnson "had kidnapped Lincoln"). To check: 1965 Pub. Papers. Names: Goldman, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:goldman-eric-f
- add:
    entry:
      id: cal.1965-02-12.transition-and-staff
      when: Feb. 12
      date: '1965-02-12'
      thread: transition-and-staff
      c: 'At 5 p.m. Lady Bird Johnson with Clark Clifford, Bill Heath and Busby on the Lyndon Baines Johnson Library: the University of Texas wants his papers, and proposes land, a building and a School of Political Science or Public Affairs named for him, at several million dollars.'
      n: '[[w.johnson-white-house-diary]], 243. Made public: 1970. Names: Clifford, Busby, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:busby-horace
      - state:tx
- add:
    entry:
      id: cal.1965-03-03.poverty
      when: Mar. 3
      date: '1965-03-03'
      thread: poverty
      c: Ringling Brothers' circus for six thousand poor children chosen by the United Givers Fund; Lady Bird Johnson, their guest, seated among them, with the press and television in front of her.
      n: '[[w.johnson-white-house-diary]], 246–47 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-03-09.conservation
      when: Mar. 9
      date: '1965-03-09'
      thread: conservation
      c: 'Lady Bird Johnson''s Beautification Committee, second meeting, the Yellow Room: Owings shows the Mall''s history and his plan, a sculpture garden, no cars on the Mall, tunnels, a reflecting pool at the Capitol end. Then about thirty by minibus, the press along: Ripley''s plans at the Museum of History and Technology, pansies on the Mall, a park triangle at Maryland and Virginia Avenues, and Greenleaf Gardens, Walter Washington''s, where she speaks briefly.'
      n: '[[w.johnson-white-house-diary]], 248–49 (Mrs. Johnson''s account; to Udall: all will fail unless the neighborhoods do the work themselves). See [[cal.1965-02-11.conservation]]. Names: Washington, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:washington-walter-e
- add:
    entry:
      id: cal.1965-03-09.program
      when: Mar. 9
      date: '1965-03-09'
      thread: program
      c: Connally, in town, joins the Johnsons late at the ninth Congressional reception and, after the Congressional guests leave, talks long with Johnson in the bedroom.
      n: '[[w.johnson-white-house-diary]], 250 (Mrs. Johnson''s account). See [[cal.1965-03-09.vietnam-congress]]. Made public: 1970. Names: Connally, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:connally-john
- add:
    entry:
      id: cal.1965-03-11.latin-america
      when: Mar. 11
      date: '1965-03-11'
      thread: latin-america
      c: 'Lunch at the Venezuelan Embassy, Mrs. Tejera Paris hostess, for the wives of the Latin American Ambassadors; Lady Bird Johnson guest of honor, riding with Mrs. Sevilla-Sacasa, wife of the dean of the Corps. The State Department''s precedence difficulties: Venezuela has no relations with some neighbors.'
      n: '[[w.johnson-white-house-diary]], 250–51 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-03-15.voting-rights-10
      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: 'From 6 p.m. the address is brought to Johnson a page at a time; he scratches out lines and writes in others, giving directions to Valenti. About 7: "Let''s close it up the way we closed the one [the State of the Union] where I talked about growing up in the Hill Country. Let''s talk about teaching the Mexicans in Cotulla, the first job I had after I left college."'
      n: '[[w.johnson-white-house-diary]], 252 (Mrs. Johnson''s account; the bracket is hers). See [[cal.1965-03-15.voting-rights]]. Made public: 1970. Names: Valenti, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1965-03-15.congress
      when: Mar. 15
      date: '1965-03-15'
      thread: congress
      c: 'After the address, Mrs. Johnson to the Speaker''s office with the leadership; then upstairs, Governor and Mrs. LeRoy Collins, Valenti, O''Brien, the Busbys and other staff with her over "the whole performance and the whole course of affairs": all think it a wonderful speech and delivery; one or two, as she, think it long.'
      n: '[[w.johnson-white-house-diary]], 253–54 (Mrs. Johnson''s account). See [[cal.1965-03-15.voting-rights]]. Made public: 1970. Names: Collins, Valenti, O''Brien, Busby, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:collins-leroy
      - name:valenti-jack
      - name:busby-horace
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1965-03-28.conservation
      when: Mar. 28
      date: '1965-03-28'
      thread: conservation
      c: 'The White House announces Mary Lasker''s gift: 9,300 azalea bushes, flowering dogwood and other plants for Pennsylvania Avenue.'
      n: '[[w.johnson-white-house-diary]], 254 (Mrs. Johnson''s account, from Camp David: "We gave out the story"). To check: the White House release.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-04-10.poverty
      when: Apr. 10
      date: '1965-04-10'
      thread: poverty
      c: 'Camp Gary, San Marcos, Tex.: the Job Corps camp dedicated in the old auditorium, nearly a hundred boys in residence. Singletary introduces Shriver; Pickle introduces Connally, who introduces the President. Three Corps members speak. Johnson ends with Lincoln and Kennedy looking down on the day.'
      n: '[[w.johnson-white-house-diary]], 257–58 (Mrs. Johnson''s account; she notes Johnson was Texas director of the NYA, which Pickle and Connally had worked for or been paid by). To check: 1965 Pub. Papers. Names: Shriver, Pickle, Connally, Kennedy, Johnson.'
      tags:
      - name:johnson-lady-bird
