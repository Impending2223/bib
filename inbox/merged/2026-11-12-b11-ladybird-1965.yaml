    entry:
      id: cal.1965-08-12.press-and-broadcasting
      when: Aug. 12
      date: '1965-08-12'
      thread: press-and-broadcasting
      c: Johnson, in the day, an interview with Ed Morgan.
      n: '[[w.johnson-white-house-diary]], 311 (Mrs. Johnson, of Johnson''s day: "interviews with Ed Morgan and old friend Sam Gilstrap"; not the subject). Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-08-12.africa
      when: Aug. 12
      date: '1965-08-12'
      thread: africa
      c: Johnson, in the day, sees Sam Gilstrap, back from Malawi, where he has served as Ambassador.
      n: '[[w.johnson-white-house-diary]], 311 (Mrs. Johnson, of Johnson''s day; not the subject). Made public: 1970. Names: Johnson.'
