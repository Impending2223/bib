      when: Apr. 11
      date: '1965-04-11'
      thread: intelligence
      c: At the Junction schoolhouse, after the signing, Johnson tells the newspapermen he has named Admiral Raborn head of the CIA and Richard Helms his Deputy.
      n: '[[w.johnson-white-house-diary]], 259 ("the second big news of the day"). See [[cal.1965-04-11.school-aid]]. Names: Raborn, Helms, Johnson.'
