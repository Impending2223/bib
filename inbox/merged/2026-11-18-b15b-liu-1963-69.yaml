  - add:
      entry:
        id: cal.1964-10-12.china-leadership-4
        when: Oct. 12
        date: '1964-10-12'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi drafts for the Central Committee a comment forwarding Li Xuefeng''s letter to him: in present conditions not to point out plainly to Party cadres at every level that the chief danger is the right is disadvantageous. Party committees at provincial, prefectural and county levels are asked, by the cadres'' thinking in each place, to raise in time the question of opposing the right, the thinking of "fear the left, not the right; rather right than left," for earnest discussion, to lay an ideological foundation for the movement. Mao, Zhou and Deng agree; the comment is issued Oct. 16 as a Central Committee document to the Party committees of counties and regiments.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 607 (Oct. 12, 1964). Made public: 1996. To check: Li Xuefeng''s letter to Liu Shaoqi, Oct. 11, 1964; the Central Committee''s comment of Oct. 16, 1964 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 607). Names: Liu Shaoqi, Mao Zedong, Zhou Enlai, Deng Xiaoping.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, name:zhou-enlai, name:deng-xiaoping, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-18.china-leadership-6
        when: Oct. 18
        date: '1964-10-18'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi replies to Li Fuchun, who had written that day: he cannot speak to the comrades at the planning meeting, having no mature views yet, and has not finished the material sent. The 1965 plan is better issued early. Planners and economic workers who would be thoroughgoing proletarian revolutionaries must seek truth from facts, be selfless, and dare to struggle against whatever thought and conduct harms socialism, without regard for personal feelings. Many comrades have rightist thinking on this point; the right deviation is the present chief danger; the Center has sent out Li Xuefeng''s letter for them to read, and a Hebei provincial committee summary on opposing the right. But not as before to oppose the right in production figures and plan targets, which must be realistic under strict thrift; today''s rightist thinking shows chiefly in class struggle, methods of managing enterprises, cadres'' state of mind and way of life.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 607 (Oct. 18, 1964). Made public: 1996. Names: Liu Shaoqi, Li Fuchun.'
        tags: [polity:prc, name:liu-shaoqi, name:li-fuchun, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-24.china-leadership-3
        when: Oct. 24
        date: '1964-10-24'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi drafts for the Central Committee an instruction on the struggle to seize power in the socialist-education movement and forwards the report of the Tianjin municipal committee on the seizure of power in the Xiaozhan area. The instruction says: where power has been manipulated or usurped by the enemy, a struggle to seize it must be carried out, or a grave mistake is made; before resolving on it, deep and detailed investigation is needed to know whether leadership is in the enemy''s hands and whether the leading core of the place has changed in nature, and only then can it be decided whether to struggle for power.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 607–608 (Oct. 24, 1964). Made public: 1996. To check: the Tianjin municipal committee''s report on the seizure of power in the Xiaozhan area and the Central Committee''s instruction (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 607–608). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
