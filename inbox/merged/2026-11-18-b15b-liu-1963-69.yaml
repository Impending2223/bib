        c: 'Liu Shaoqi visits the national exhibition of new industrial products at the National Defense Industry Pavilion and sees new defense-industry products: missiles, aircraft, submarines and communications equipment.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 594 (June 20, 1964). Made public: 1996. Names: Liu Shaoqi.'
