  - check:
      id: cal.1966-03-25.china-leadership
      text: 'Check: Liu''s chronology (II, 633–634) has Liu leave Peking Mar. 22 for Urumqi, hear the Xinjiang committee there Mar. 24 and leave Urumqi Mar. 26 for Pakistan; Zhou''s seeing him off at Peking Mar. 25 is not in it.'
  - add:
      entry:
        id: cal.1966-03-24.china-leadership-2
        when: Mar. 24
        date: '1966-03-24'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears the standing committee of the Xinjiang Uygur Autonomous Region committee report on its work. He says: Xinjiang has so large a grassland, and it is good; protect it, and improve it, and use it rationally. Livestock has a future, with herding the main thing and farming to promote it, farming and herding combined; in the herding areas have half-herding, half-study and give herdsmen a little more, the most important way to raise productivity. Farm plans are long-term, so should those of industry be; daily goods and consumer goods are to be made on the spot, for carrying them in from the interior is hard and so is moving them within the region; in about fifteen years nearly everything is to be made at home but a few things, steel, machine building, tractors and cars too.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 634 (Mar. 24, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-26.china-leadership-4
        when: Mar. 26
        date: '1966-03-26'
        thread: china-leadership
        also: [china, south-asia]
        c: 'Liu Shaoqi leaves Urumqi for Pakistan, reaches Rawalpindi and holds talks with President Ayub Khan. At Ayub''s welcome banquet he says: China resolutely opposes aggressors, supports all peoples who oppose aggression and will help their struggle as far as it can; the struggle of the Asian and African peoples against imperialism and aggression and for national independence will certainly win in the end.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 634 (Mar. 26, 1966). See [[cal.1966-03-26.china-leadership-3]]. Names: Liu Shaoqi, Ayub Khan.'
        tags: [polity:prc, polity:pakistan, name:liu-shaoqi, name:ayub-khan-mohammad]
  - cite:
      id: cal.1966-03-26.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 634–635 (Mar. 26–31, 1966; Liu visits Pakistan: Rawalpindi, Mar. 26 and 27; Islamabad, Mar. 28; Lahore, Mar. 28 and 29; Karachi, Mar. 30; leaves Karachi Mar. 31 and reaches Hotan)'
