        thread: china-leadership
        also: [china]
        c: Liu Shaoqi receives Kang Yang-uk (康良煜), Vice-Chairman of the Standing Committee of Korea's Supreme People's Assembly, and the Korean people's delegation he heads.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 622 (June 28, 1965). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:dprk, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1965-07-03.china-leadership-2
        when: July 3
        date: '1965-07-03'
        thread: china-leadership
        also: [china, vietnam-hanoi]
        c: Liu Shaoqi receives Nguyễn Duy Trinh, Deputy Premier and Foreign Minister of the Vietnamese government.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 622 (July 3, 1965). Names: Liu Shaoqi, Nguyễn Duy Trinh.'
        tags: [polity:prc, polity:drv, name:liu-shaoqi, name:nguyen-duy-trinh]
  - add:
      entry:
        id: cal.1965-07-05.china-leadership-3
        when: July 5
        date: '1965-07-05'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears the preparatory group of the forum on "four clean-up" trials in the national industrial and communications system report. He says there are three fundamental measures to keep capitalism from being restored and prevent peaceful evolution and revisionism: first, the socialist-education movement; second, half-work, half-study; third, cadres'' taking part in labor, which must become a habit and a system, not be seen as a small matter. Factory heads who have a secretary write their speeches: why do it? It is putting on airs; speak a little, speak what one can, and if one cannot, do not; hereafter this is to be stopped, and "to know is to know, not to know is not to know" encouraged.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 622 (July 5, 1965). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-11.china-leadership-3
        when: July 11
        date: '1965-07-11'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi drafts for the Central Committee the instruction on improving the method of leadership, forwarding nine materials on the socialist-education movement that Wang Renzhong reported to the Center. It says: leading cadres go to grassroots units, squat at points, learn the real situation and gain experience in solving problems, then lead the area by the points, points and area combined, to solve the area''s problems; this is an important method of leading the "four clean-ups" and all other work; every level of leadership must keep to it in all future work and change the subjectivist and bureaucratic method of leadership.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 622 (July 11, 1965). Made public: 1996. To check: Wang Renzhong''s nine materials and the Central Committee''s instruction on improving the method of leadership, July 1965 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 622). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
