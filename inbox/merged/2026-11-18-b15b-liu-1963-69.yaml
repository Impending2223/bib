        c: Liu Shaoqi holds talks with Hồ Chí Minh, Lê Duẩn (First Secretary of the Vietnam Workers' Party), Trường Chinh, Phạm Văn Đồng, Phạm Hùng, Võ Nguyên Giáp, Lê Đức Thọ, Nguyễn Duy Trinh and Hoàng Văn Hoan, May 11, 12, 14 and 15, chiefly on their views of the international communist movement.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 577 (May 11, 12, 14 and 15, 1963). Made public: 1996. Names: Liu Shaoqi, Hồ Chí Minh, Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Võ Nguyên Giáp, Lê Đức Thọ, Nguyễn Duy Trinh. Check: the Vietnamese names are the Chinese (黎笋, 长征, 范文同, 范雄, 武元甲, 黎德寿, 阮维桢, 黄文欢) read back.'
        tags: [polity:prc, polity:drv, name:liu-shaoqi, name:ho-chi-minh, name:le-duan, name:truong-chinh, name:pham-van-dong, name:vo-nguyen-giap, name:le-duc-tho, name:nguyen-duy-trinh, vis:only:prc+drv]
