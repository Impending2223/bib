        c: Liu Shaoqi talks with Jacques Grippa, secretary of the Belgian Communist Party's Central Committee.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 591 (May 22 and 23, 1964). Made public: 1996. Names: Liu Shaoqi. Check: the Latin form of 雅克·格里巴; the book gives no further title. Check: whether the talks were reported at the time.'
        tags: [polity:prc, polity:belgium, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-25.china-leadership
        when: May 25
        date: '1964-05-25'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, on reading a survey of how the Taoyuan brigade''s commune members feed pigs with goat milk, writes to Yang Shangkun: have it printed for the comrades of the work conference to read. Goats can be raised everywhere from north to south, mountain regions above all, and dairy goats especially pay; goat milk is highly nutritious, good for children and the old, though many are not used to it, especially unsweetened; infants have no such habit; used to supplement a mother''s milk it is very good; powdered milk or other infant food costs money and labor. Raising goats, dairy goats above all, is to be recommended in the villages.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 591 (May 25, 1964). Made public: 1996. To check: the survey of the Taoyuan brigade members'' feeding of pigs with goat milk (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 591). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-27.china-leadership-4
        when: May 27
        date: '1964-05-27'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, on reading the Zhejiang provincial committee''s report on gradually developing the commune (brigade) economy and trying out commune cadres not leaving production, writes to Tan Zhenlin: agreed, to be printed for the comrades of the conference. Two questions are in it. One is commune cadres not leaving production: they give over half their time to collective production and under half to the commune, which can be arranged. The other is the commune and brigade running collective enterprises: much experience from the past; only after the "four clean-ups" are the old experiences to be summed up, strict rules fixed, tried in model cases, and the provincial and prefectural committees then to lead trials by plan, by place and by stage; past mistakes must not be repeated. Zhejiang may try it and other provinces try points; later an experienced province is to draft a charter and send it to the Center for review.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 591–592 (May 27, 1964). Made public: 1996. To check: the Zhejiang provincial committee''s report (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 591–592). Names: Liu Shaoqi, Tan Zhenlin.'
        tags: [polity:prc, name:liu-shaoqi, name:tan-zhenlin, vis:only:prc]
  - cite:
      id: cal.1964-05-28.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 592 (May 28, 1964; Liu presides at the meeting, which this book gives as of the Politburo Standing Committee, the Secretariat and the regional bureaus'' first secretaries, on the guideline of the Third Five-Year Plan; he warns that the wish of every department to do more will lengthen the capital-construction line again, and asks the industrial departments to hold capital construction in check)'
  - check:
      id: cal.1964-05-28.china-leadership-2
      text: 'Check: Liu''s chronology (II, 592) gives the meeting as one of the Politburo Standing Committee, the Secretariat and the regional bureaus'' first secretaries, Liu presiding.'
  - add:
      entry:
        id: cal.1964-05-31.china-leadership-2
        when: May 31
        date: '1964-05-31'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi receives Lucien Paye, France's first ambassador to China. He says China admires General de Gaulle's independent policy in international affairs; the two countries' political and economic systems differ but this does not bar friendly relations between them and their peoples; a large part of China's international policy is like France's, independent and taking no orders; China is also developing its own economy, technology and culture, and on a number of concrete projects the two can help each other on mutually beneficial terms.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 592 (May 31, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, polity:fr, name:liu-shaoqi, vis:only:prc+fr@B-E]
  - add:
      entry:
        id: cal.1964-06-02.china-leadership-6
        when: June 2
        date: '1964-06-02'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi presides at a meeting of the Politburo Standing Committee, the Secretariat and the regional bureaus' first secretaries on the socialist-education movement in town and country. He says peaceful evolution has already evolved into some people in the high organs, and provincial and municipal committees have them; in some places cadres with "four unclean" faults handle the work teams by "feeding, resisting, dragging and muddling," and ways must be found to throw them off; until the masses are fully roused, the 95 percent of cadres cannot be united and the grassroots relied on.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 592 (June 2, 1964). Made public: 1996. Names: Liu Shaoqi. Check: the date against Mao''s undated remarks to a Politburo Standing Committee meeting of June 1964, [[cal.1964-06.china-leadership]].'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
