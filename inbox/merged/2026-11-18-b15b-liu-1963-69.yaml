  - cite:
      id: cal.1964-12-27.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 611 (Dec. 27, 1964; Liu attends the national work conference, at which Zhu De, Chen Boda, Dong Biwu, Lu Dingyi and Sai Fuding speak on how to carry on the socialist-education movement)'
      units: A, B
  - cite:
      id: cal.1964-12-28.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 611 (Dec. 28, 1964; Liu attends the national work conference, at which Luo Ruiqing, Chen Yi and Xie Fuzhi speak; Mao, speaking, criticizes the formulations of the nature of the movement as a contradiction between the "four clean-ups" and the "four unclean," a crossing of contradictions inside and outside the Party, a crossing of enemy and people''s contradictions; its nature is the contradiction between socialism and capitalism and its main point the rectifying of those in power in the Party who take the capitalist road)'
      units: A, B, C
  - add:
      entry:
        id: cal.1964-12-29.china-leadership-3
