        also: [china]
        c: The Central Committee forwards the report of the Party group of the Ministry of Higher Education on assigning a batch of liberal-arts college graduates to grassroots units below the county level, written on Liu Shaoqi's proposal.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 622 (June 14, 1965). Made public: 1996. To check: the Ministry of Higher Education Party group''s request for instructions on the assignment of liberal-arts graduates, June 1965 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 622). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
