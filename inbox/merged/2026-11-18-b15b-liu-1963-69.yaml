        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 637 (May 1, 1966). Names: Liu Shaoqi. Check: the Latin form of 贾尔.'
        tags: [polity:prc, polity:nepal, name:liu-shaoqi]
  - cite:
      id: cal.1966-05-01.china-leadership-5
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 637 (May 1, 1966; Liu receives Louis Béavogui (路易·贝昂赞), head of the Guinean trade-union delegation and inspector-general of education, and talks with him)'
  - cite:
      id: cal.1966-05-04.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 637–638 (May 4–26, 1966; Liu presides at the enlarged Politburo meeting; before it Mao, in turn, had criticized the errors of Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun and drawn up the Central Committee''s notice meant to launch the Cultural Revolution, later called the "May 16 Notification"; during the meeting Mao is not in Peking, and Kang Sheng reports to him; by Mao''s view the meeting stops and revokes the posts of Peng, Luo, Lu and Yang and adopts the Notification, which announces the withdrawal of the February Outline and of the former Cultural Revolution Group of Five)'
      units: B, C, D
  - cite:
      id: cal.1966-05-16.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 637–638 (May 1966; the chronology gives the Notification as adopted by the meeting, many of its important passages added by Mao: to hold high the banner of the proletarian cultural revolution, expose the "academic authorities," seize the leadership of those fields, and criticize the bourgeois representatives who have sneaked into the Party, government, army and cultural circles, whom it calls counter-revolutionary revisionists who will seize power when the time is ripe, some seen through, some not, some trusted and groomed as successors, "like Khrushchev")'
      units: B
  - cite:
      id: cal.1966-05-18.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638 (May 18, 1966; Lin Biao speaks at the meeting; the book says he praised Mao''s "personal genius" and spread rumors that some inside the Center want to seize power and overturn it, to create a climate of terror)'
      units: B
  - add:
      entry:
        id: cal.1966-05-18.china-leadership-4
        when: May 18
        date: '1966-05-18'
        thread: china-leadership
        also: [china, vietnam-hanoi]
        c: Liu Shaoqi, with Zhou Enlai and Deng Xiaoping, receives Hồ Chí Minh, Chairman of the Vietnam Workers' Party Central Committee.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638 (May 18, 1966). Made public: 1996. Names: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Hồ Chí Minh.'
        tags: [polity:prc, polity:drv, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:ho-chi-minh, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1966-05-26.china-leadership-3
        when: May 26
        date: '1966-05-26'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi speaks at the enlarged Politburo meeting on studying Mao Zedong Thought and the meaning of carrying out the cultural revolution, and makes a self-criticism. Of understanding the cultural revolution he says: on this question we were muddled in the past, did not understand well, were not earnest and were not effective, himself included; in this recent period he has read little of the material on it, fell ill once and went abroad once, missed much of the material and could not keep up.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638 (May 26, 1966). Made public: 1996. See [[cal.1966-05-04.china-leadership]]. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - add:
