  - cite:
      id: cal.1964-12-21.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 610 (Dec. 21, 1964–Jan. 4, 1965; Liu attends the First Session of the Third NPC, which adopts the government work report and the work reports of the NPC Standing Committee, the Supreme People''s Court and the Supreme People''s Procuratorate)'
