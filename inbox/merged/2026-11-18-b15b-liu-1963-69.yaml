        tags: [polity:prc, polity:nepal, name:liu-shaoqi, name:birendra-bir-bikram-sha-dev]
  - add:
      entry:
        id: cal.1966-06-29.china-leadership-3
        when: June 29
        date: '1966-06-29'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi telephones Kang Sheng and questions him on the *Renmin ribao* editorial for July 1 naming and criticizing Peng Dehuai and Peng Zhen, demanding that Kang at once stop such unauthorized naming.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 643 (June 29, 1966). Made public: 1996. Names: Liu Shaoqi, Kang Sheng, Peng Dehuai, Peng Zhen.'
        tags: [polity:prc, name:liu-shaoqi, name:kang-sheng, name:peng-dehuai, name:peng-zhen, vis:only:prc]
  - cite:
      id: cal.1966-07-02.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 643–644 (June 30 and July 2, 1966; Liu and Deng Xiaoping send Mao a letter with a draft notice on how industry, communications and capital-construction units are to carry out the cultural revolution: the movement is spreading, the Center and provinces must lead it with great force, and if factories, mines and construction units rise at once the leadership cannot cope; the plan results of industry, communications and construction have lately been poor, steel, steel products and coal output beginning to fall, quality falling, accidents rising, and the capital-construction task for the first half-year only 35.6 percent done against 40 planned; after discussion in Peking the deployment of the cultural revolution is to stress the culture and education departments and the Party and government organs, while industrial, communications, construction, commercial and hospital units go on with the "four clean-ups" and the "Twenty-three Articles" joined to the cultural revolution (Shanghai is doing so in an enterprise of 400,000 workers, with Liu''s reply of agreement), to be spread later; Mao writes on July 2 that he agrees and the notice should be issued quickly, and it goes out that day, saying the work is to be done by stages, by plan, under work teams sent from above)'
      units: A, B, C, D, E
  - add:
      entry:
        id: cal.1966-07-11.china-leadership-4
        when: July 11
        date: '1966-07-11'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi again hears the work group of the first middle school attached to Peking Normal University report on the movement there, and tells them his ideas for the deployment of the "Cultural Revolution": in the senior middle schools it is to be done by the end of the year; first fight the black gang, study Mao''s works, sort out the bad people and clear them out, keeping those who can stay in school; then criticize the "authorities"; then clear up the economy; last, a spell of teaching reform and school-system reform.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 644 (July 11, 1966). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1966-07-13.china-leadership-5
        when: July 13
        date: '1966-07-13'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi presides at an enlarged meeting of the Politburo Standing Committee, which hears the Youth League''s Central Committee on the "Preliminary Plan for the Cultural Revolution in Peking''s Middle Schools," and instructs on the aims, requirements and policy. (1) Education here comes down from the bourgeois education; so not all with bourgeois educational thought are to be criticized, only a few representatives, while most are to be educated, and a proletarian educational line set up. (2) Party and League organizational life is to be built up and perfected and the leading role of the Party branch and the helping role of the League branch restored; this is a separate item; the organizations are not to be put aside but watched in the movement for whether they can lead, and tempered; building, rectifying and perfecting them is to be a task. (3) Clear up the economy: with politics, organization and thought clear, take the chance to clear the economy too. Junior middle schools are to finish the first stage by the end of August or September, to open classes in October; senior middle schools in September or October.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 644–645 (July 13, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1966-07-18.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645 (July 18, 1966; Mao returns to Peking from Wuhan)'
      units: B
  - cite:
      id: cal.1966-07-19.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645 (July 19, 1966; Liu presides at the enlarged Standing Committee meeting on the "Cultural Revolution"; Chen Boda proposes to withdraw the work groups and is opposed by Deng Xiaoping and most others; Liu backs the majority, saying work groups are good and bad, are on the first line and have their hardships, and the demand is to help and educate them and sum up the work; the students'' recognition and action are not uniform and they may debate a while longer, gain experience, and then counter-attack the black gang)'
      units: B, C, D, E
  - cite:
      id: cal.1966-07-19.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645 (July 19, 1966; that evening Liu attends the enlarged Standing Committee meeting Mao presides over at the Huairen Hall)'
      units: B
  - add:
      entry:
        id: cal.1966-07-20.china-leadership-2
        when: July 20
        date: '1966-07-20'
        thread: china-leadership
        also: [china]
        c: The Central Committee issues a notice setting up an editorial committee for the works of Mao Zedong, with Liu Shaoqi as its head.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645 (July 20, 1966). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - cite:
      id: cal.1966-07-22.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645 (July 22, 1966; Liu attends the rally of the capital''s people supporting the Vietnamese people''s struggle against the U.S. and for national salvation)'
  - cite:
      id: cal.1966-07-22.china-leadership-4
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645 (July 22, 1966; Liu issues, as Chairman of the People''s Republic, a statement: for the Chinese people he declares most firmly and warmly their support for the "Appeal to the Whole Nation" of Hồ Chí Minh of July 17; to support the Vietnamese people to complete victory the Chinese people are prepared to bear the greatest national sacrifices; China''s 700 million are Vietnam''s strong backing and its vast territory a reliable rear)'
      units: A
  - add:
      entry:
        id: cal.1966-07-22.china-leadership-7
        when: July 22
        date: '1966-07-22'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi presides at an enlarged meeting of the Politburo Standing Committee, which takes up the "Preliminary Plan for the Cultural Revolution in Peking''s Institutions of Higher Learning" and instructs on the movement in the colleges: (1) the direction of the struggle, the main direction being the power-holders; (2) the way, civil and not armed struggle, with preparation first, no battle unprepared or unsure; (3) ranks, whose thought is first to be unified; (4) no "putting on caps" and no limiting others'' freedom. On the work groups: most are good and are to be helped and corrected, some should not be driven off, others should. There are now three directions of struggle in the schools, against the power-holders, against the work group and against the masses and students, and all three exist; schools differ and are not to adopt Peking University''s way. He suggests that Peking set up cultural revolution committees by class, department and school and hold a delegates'' conference, and the middle schools a conference of teacher and student delegates.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645–646 (July 22, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1966-07-24.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 646 (July 24 and 25, 1966; Mao, talking with the regional bureaus'' secretaries and the members of the Cultural Revolution Group, sharply criticizes the work groups: they block the mass movement, and to block the revolution is to help the counter-revolutionaries and the black gang; they have made much trouble, and what is wanted of them?)'
      units: B, C, D
  - cite:
      id: cal.1966-07-27.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 646 (July 28, 1966; the book dates the Peking committee''s "Decision on withdrawing the work groups from the colleges" July 28, on Mao''s instruction)'
  - cite:
      id: cal.1966-07-29.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 646–647 (July 29, 1966; Liu speaks at the Peking committee''s meeting of activists of the colleges and middle schools and takes responsibility on behalf of the Center for the work-group question: sending work groups was the Center''s decision and the Center''s consent; it is now found the form does not fit the present needs of the cultural revolution, and the Center has decided to withdraw them; he suggests that in the movement the few be protected, those with different views who are in the minority, for debate between them is needed; ox-ghosts and snake-spirits are to be handled by wall posters, great airing and great debate, and a debate meeting is not to become a struggle meeting (Zhou Enlai had just said so); the majority of today may be the minority of tomorrow; on how to carry out the proletarian cultural revolution he says he does not know, that he is not sure the Party Center''s other workers know, and that the revolution is chiefly to be learned among the masses of teachers, students and workers; "we can now only learn from you and listen to your views," and the announcement at the meeting is that all work groups are withdrawn)'
      units: B, C
  - cite:
      id: cal.1966-07-31.china-leadership-4
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 647 (July 31, 1966; Liu, with Zhou Enlai, Zhu De, Deng Xiaoping and others, receives scientists of 33 countries and regions at the 1966 summer physics symposium of the Peking Science Symposium and other foreign friends)'
  - cite:
      id: cal.1966-08-01.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 647 (Aug. 1–12, 1966; Liu attends the Eleventh Plenum of the Eighth Central Committee; Aug. 1 he reports to it the policies of the Politburo on international and domestic work since the Tenth Plenum and takes the responsibility for the work-group practice after the "Cultural Revolution" began: lately the Chairman was away and he presided over the Standing Committee''s work at home; when the Chairman returned he found the sending of work groups wrong, and the responsibility is chiefly his; Mao, interjecting, charges that the work groups made errors of direction and line, "actually standing on the bourgeois standpoint and opposing the proletarian revolution")'
      units: B, G, H, I, J
  - add:
      entry:
        id: cal.1966-08-02.china-leadership-2
        when: Aug. 2
        date: '1966-08-02'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi goes to the Peking Architecture and Engineering Institute, attends the students' meeting, hears speeches of the two factions of students and speaks at the end. He says it seems the work group made mistakes at their school; the Party Center and the Peking committee bear responsibility, too; the work group was sent with the Center's consent and the Peking committee followed it; differing views are to be discussed, mistakes corrected, right ones held to, and unity restored; he would be glad if he could help them to unite.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 647 (Aug. 2, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-03.china-leadership-7
        when: Aug. 3
        date: '1966-08-03'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi again goes to the Peking Architecture and Engineering Institute and talks separately with the delegates of the two mass organizations, asking them to unite, to attend to policy and to do the movement well together.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648 (Aug. 3, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-04.china-leadership-5
        when: Aug. 4
        date: '1966-08-04'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi speaks at the discussion of the Central-South group of the Eleventh Plenum. During the stretch the Chairman was away, he presided over the work and will not evade responsibility; the central question is standing on the bourgeois standpoint and opposing the mass movement. When the movement surged, the comrades of the Standing Committee and the Secretariat, those of the Peking committee too, agreed to and approved the sending of work groups. In this cultural revolution the masses rise to be masters and the Chairman backs them so strongly that those in between are squeezed from above and pressed from below: does one back the masses? To revolutionize others'' lives is allowed, but not ours? The resolve to revolutionize one''s own life is to be made; at worst it is stepping down, and people like us can step down; if they do not let others be revolutionized, they will have to step down.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648 (Aug. 4, 1966). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - cite:
      id: cal.1966-08-04.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648 (Aug. 4, 1966; Liu attends the enlarged Standing Committee meeting Mao calls, where Mao makes a still sharper charge on the sending of work groups: the Center broke its own order, it ordered classes suspended for half a year to do only the cultural revolution, and when the students rose it suppressed them; lightly put it is a question of direction, in fact one of line, a line error that violates Marxism; ox-ghosts and snake-spirits are in this room; Liu again takes responsibility, saying it is no more than stepping down, he is not afraid of that and has "five nots" of fear)'
      units: B, C, D, E, F, G, H
  - add:
      entry:
        id: cal.1966-08-04.china-leadership-6
        when: Aug. 4
        date: '1966-08-04'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi, at Zhongnanhai, talks with the heads of the work group at the Peking Architecture and Engineering Institute and asks them to make an active self-criticism to the masses, admit their mistakes and win the masses' understanding.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648 (Aug. 4, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1966-08-05.china-leadership-5
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648 (Aug. 5, 1966; Liu receives the Zambian friendship delegation, with all its members, headed by Chimba, Minister of Commerce and Industry; the book calls it the last time Liu received foreign guests)'
  - cite:
      id: cal.1966-08-05.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648–649 (Aug. 5 and 7, 1966; the book says Mao writes, aimed chiefly at Liu, the poster "Bombard the Headquarters: My Wall Poster," charging that certain leading comrades from the Center to the localities have "gone the opposite way," taken a reactionary bourgeois stand and enforced bourgeois dictatorship, beating down the proletarian cultural revolution; Aug. 7 the plenum issues it to its members, after which the plenum turns to exposing and criticizing Liu Shaoqi and Deng Xiaoping)'
      units: A, B
  - cite:
      id: cal.1966-08-05.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 642 (June 20 and Aug. 5, 1966; the book says the Center''s notice of Aug. 5, on Mao''s view, declares its approval on June 20 of the Peking University Cultural Revolution Bulletin no. 9 mistaken and revokes the document)'
      units: A, B
  - cite:
      id: cal.1966-08-08.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 649 (Aug. 8, 1966; the plenum adopts the Decision of the Central Committee on the Great Proletarian Cultural Revolution (the Sixteen Points))'
      units: B
  - cite:
      id: cal.1966-08-12.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 649 (Aug. 12, 1966; on Mao''s proposal the plenum reorganizes the central leadership and re-elects the Politburo Standing Committee; Liu falls from second place to eighth and Lin Biao, second, becomes Mao''s successor; the plenum elects no vice-chairmen but Lin alone goes on being called vice-chairman, and Liu''s vice-chairmanship is no longer mentioned)'
      units: A, E, F
  - add:
      entry:
        id: cal.1966-08-08.china-leadership-6
        when: Aug. 8–12
        date: '1966-08-08'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi says at the Eleventh Plenum: when the Chairman was not in Peking, the Center''s line errors in the cultural revolution are chiefly his responsibility; what he has said and done he is answerable for and does not shirk; the errors of other comrades he bears a share of, too. He abides by the Party''s basic discipline, forms no two factions and does no underground activity; opinions are to be put on the table. He asks to be relieved of his posts as member of the Politburo Standing Committee and head of state.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 649 (Aug. 8–12, 1966). Made public: 1996. Names: Liu Shaoqi, Mao Zedong. Check: the day; the book puts the statement after the Aug. 12 reorganization, with no date.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - cite:
      id: cal.1966-08-11.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 649 (Aug. 11, 12 and 14, 1966; the book says Lin Biao''s wife Ye Qun twice seeks people out and has them write materials slandering Liu Shaoqi; Aug. 14 Lin Biao passes the material to Mao through Jiang Qing)'
      units: A, B
  - cite:
      id: cal.1966-08-18.india-and-china-cultural-revolution
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 649 (Aug. 18, 1966; Mao and other Central leaders attend the rally of millions at Tiananmen "celebrating the Great Proletarian Cultural Revolution"; Mao in army uniform with a Red Guard armband receives Red Guards and masses from the whole country; from this to late November he reviews eleven million teachers, students and Red Guards eight times in Peking)'
      units: B
  - add:
      entry:
        id: cal.1966-09.china-leadership-8
        when: Sept., mid
        date: 1966-09
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes "Self-criticism outline for the meeting of leading cadres of the work groups in Peking (draft)" and sends it to Mao for review. Mao replies Sept. 14: basically very well written and very serious, the second half better; he suggests printing it as a draft for discussion by the comrades of the Politburo, Secretariat, work groups, Peking committee and Cultural Revolution Group, to ask their views, and after some gain to revise and report again.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 650 (Sept., mid, 1966). Footnote 1 (650): the outline was later turned into the self-criticism at the Central Work Conference of October of that year; footnote 2 names the Central Cultural Revolution Group. Made public: 1996. Names: Liu Shaoqi, Mao Zedong. Check: the day; the book has "mid-September" and gives Mao''s reply as of Sept. 14.'
        at: before 1966-09-21
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - cite:
      id: cal.1966-09-14.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 650 (Sept. 14, 1966; Mao''s reply to Liu Shaoqi''s draft outline of self-criticism)'
      units: A, B
  - add:
      entry:
        id: cal.1966-09-14.china-leadership-6
        when: Sept. 14
        date: '1966-09-14'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Zhou Enlai: Mao has read his self-criticism outline, added a paragraph and returned it; he sends it to Zhou. He agrees with Mao that it be printed in draft for discussion among the comrades of the Politburo, the Secretariat, the work-group leaders, the Peking committee and the Cultural Revolution Group, who are to give opinions, return it to him for revision and then he reports again; he asks them to give him their views within a few days and to have Mao''s comment printed too. Sept. 17 Zhou handles it as Mao and Liu wish.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 650 (Sept. 14, 1966). Made public: 1996. Names: Liu Shaoqi, Zhou Enlai, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - cite:
      id: cal.1966-09-16.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 650 (Sept. 16, 1966; the book says Kang Sheng, using the 1936 case in which sixty-one men including Bo Yibo were released from prison by Party organization decision, writes to Mao to implicate Liu: he has long suspected Liu''s decision that An Ziwen, Bo Yibo and others "turn themselves in," and says the decision "legalized" the counter-revolutionaries'' renunciation of the Party; Mao gives no response)'
      units: A
  - cite:
      id: cal.1966-10-09.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 650–651 (Oct. 9–28, 1966; Liu attends the Central Work Conference Mao presides over; there Lin Biao and Chen Boda name Liu and Deng Xiaoping as carrying out "a line suppressing the masses and opposing the revolution," and say the wrong line of this cultural revolution was chiefly started by Liu and Deng; Oct. 24 and 25 Mao says at the meeting that posting Liu''s and Deng''s big-character posters on the streets is not good, that people are to make revolution and not forbidden to, that Liu and Deng are not to be written off in one stroke nor can Liu and Deng wholly be blamed, and their two comrades had their reasons for the mistakes; after the meeting a wave of criticism of the "bourgeois reactionary line" rises across the country)'
      units: B, E
  - add:
      entry:
        id: cal.1966-10-22.china-leadership-4
        when: Oct. 22
        date: '1966-10-22'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Zhou Enlai: his self-criticism for the Central Work Conference (first draft) has been revised in several places, in the main on the views Zhou and Chen Boda gave; he sends it and asks Zhou to review and revise it. Zhou raises no further opinion.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 651 (Oct. 22, 1966). Made public: 1996. Names: Liu Shaoqi, Zhou Enlai, Chen Boda.'
        tags: [polity:prc, name:liu-shaoqi, name:zhou-enlai, name:chen-boda, vis:only:prc]
  - cite:
      id: cal.1966-10-23.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 651 (Oct. 23, 1966; Liu makes his self-criticism speech at the Central Work Conference and takes responsibility for the "line error": in the fifty-odd days after June 1 he made a line error and a directional error in leading the proletarian cultural revolution, chiefly his responsibility; the responsibility of other comrades, those in Peking at the Center, some in the State Council, the Peking committee, the work groups and some localities, is a lesser one; before July 18 Mao was not in Peking and the Center''s daily work was presided over by him, the Peking cultural revolution was reported to meetings he presided over, at which some wrong decisions were made and wrong suggestions approved or agreed to)'
      units: B
  - add:
      entry:
        id: cal.1966-10-31.china-leadership-6
        when: Oct. 31
        date: '1966-10-31'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Zhou Enlai: Tong Xiaopeng (director of Zhou''s office) has told him by telephone Zhou''s view that his self-criticism at the Central Work Conference be issued to the county and regiment levels; he agrees. He has made some changes and added a paragraph listing some mistakes he made in Party history; he sends it to Zhou to review and asks whether it should go to the Chairman and Lin Biao to review as well. Nov. 9 the self-criticism is printed and issued to the county and regiment levels.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 651–652 (Oct. 31, 1966). Made public: 1996. Names: Liu Shaoqi, Zhou Enlai, Lin Biao.'
        tags: [polity:prc, name:liu-shaoqi, name:zhou-enlai, vis:only:prc, name:lin-biao]
  - cite:
      id: cal.1966-11-06.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 652 (Nov. 9, 1966; the book says Liu''s self-criticism at the Central Work Conference is printed and issued to the county and regiment levels)'
      units: A, B
  - cite:
      id: cal.1966-11-12.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 652 (Nov. 12, 1966; Liu attends the meeting)'
  - check:
      id: cal.1966-11-12.china-leadership-2
      text: 'Check: Liu''s chronology (II, 652) has Liu attend, after Zhou''s advice of Nov. 8 that he and Deng might ask leave ([[cal.1966-11-08.china-leadership-2]]).'
  - cite:
      id: cal.1966-12-04.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 652 (Dec. 6, 1966; Liu attends the enlarged Politburo meeting under Lin Biao on the Cultural Revolution in industry and communications; Lin attacks Liu and Deng Xiaoping: not a matter of fifty days but of ten and twenty years, the industrial and communications front much influenced by them; Liu, speaking, is made to examine himself)'
  - add:
      entry:
        id: cal.1966-12-18.china-leadership-2
        when: Dec. 18
        date: '1966-12-18'
        thread: china-leadership
        also: [china]
        c: 'Zhang Chunqiao, in the reception room at Xihuamen, Zhongnanhai, calls Kuai Dafu, head of the Tsinghua rebel faction, alone, and urges him to agitate openly for the overthrow of Liu Shaoqi and Deng Xiaoping: the one or two people in the Center who put forward the bourgeois reactionary line have still not surrendered; the "little revolutionary generals" should unite and hit the drowned dog hard, make them stink, and not stop halfway.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 652 (Dec. 18, 1966). Made public: 1996. Names: Liu Shaoqi, Deng Xiaoping, Zhang Chunqiao.'
        tags: [polity:prc, name:liu-shaoqi, name:deng-xiaoping, name:zhang-chunqiao, vis:only:prc]
  - add:
      entry:
        id: cal.1966-12-25.china-leadership-2
        when: Dec. 25
        date: '1966-12-25'
        thread: china-leadership
        also: [china]
        c: 'Kuai Dafu leads over 5,000 on a street march, with many big-character posters and slogans: "Down with Liu Shaoqi!" "Down with Deng Xiaoping!"; the agitation goes on for days.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 652 (Dec. 25, 1966). See [[cal.1966-12-18.china-leadership-2]]. Names: Liu Shaoqi, Deng Xiaoping.'
        tags: [polity:prc, name:liu-shaoqi, name:deng-xiaoping]
  - add:
      entry:
        id: cal.1967-01-01.china-leadership-4
        when: Jan. 1
        date: '1967-01-01'
        thread: china-leadership
        also: [china]
        c: Rebels inside Zhongnanhai paste big slogans, "Down with China's Khrushchev, Liu Shaoqi," on the wall of the courtyard where Liu Shaoqi lives.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 653 (Jan. 1, 1967). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1967-01-03.china-leadership-4
        when: Jan. 3
        date: '1967-01-03'
        thread: china-leadership
        also: [china]
        c: Evening. Rebels hold the first struggle meeting against Liu Shaoqi and Wang Guangmei.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 653 (Jan. 3, 1967; the book has Qi Benyu and others behind it). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1967-01-06.china-leadership-4
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 653 (Jan. 6, 1967; the book says Tsinghua rebels falsely claim Liu Shaoqi''s daughter has been crippled in a car accident, trick Wang Guangmei out of Zhongnanhai, detain her and struggle against her; she is later released after Zhou Enlai intervenes)'
  - cite:
      id: cal.1967-01-06.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 653 (Jan. 5–7, 1967; Liu writes to Mao, Jan. 5: the Peking Architecture and Engineering Institute and the Jinggangshan Red Guards headquarters write that he is to make a public examination at the institute before 4 o''clock on Jan. 7, and a Red Guard regiment of the institute writes the same; he asks whether he should go; Mao comments Jan. 6 to Zhou Enlai that it is better he not speak and asks him to work on the students; early Jan. 7 Zhou sees the student delegates and stops the move to force Liu to the institute)'
      units: A, B, C, D, E
  - cite:
      id: cal.1967-01-12.china-leadership-4
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 653 (Jan. 12, 1967; Qi Benyu, calling some of the Central Committee General Office''s people to Diaoyutai, Building 16, says Liu, Deng and Tao Zhu are comfortable in Zhongnanhai, why do they not go to struggle against them; that day the rebels in Zhongnanhai force their way into Liu''s residence and a second time besiege and struggle against Liu and his wife)'
  - cite:
      id: cal.1967-01-13.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 653–654 (Jan. 13, 1967; Mao sends a man to take Liu to the Great Hall of the People to talk; Liu proposes (1) that the responsibility for the line error is his, that most cadres are good, that many old cadres are the Party''s precious wealth, and that the main responsibility is for him to bear, and the mass of cadres be freed as soon as possible to lessen the Party''s losses; (2) that he be relieved of his posts as head of state, member of the Politburo Standing Committee and chairman of the editorial committee for Mao''s works, to end the Cultural Revolution early and spare the country loss, and that he and his wife and children go to Yan''an or to their old home to farm; Mao tells him to study well and look after his health, and expresses no view on his requests)'
      units: A, B, C
  - cite:
      id: cal.1967-03-16.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 654 (Mar. 16, 1967; the book says the Center issues its comment on the materials of Bo Yibo, Liu Lantao, An Ziwen, Yang Xianzhen and others on "surrender and treason," with an attachment, calling the release of Bo Yibo and the others between August 1936 and March 1937, approved beforehand by the Center, "surrender and treason" and making it a great crime of Liu; "traitor-hunting" spreads over the country; Lin Biao, Jiang Qing and others falsely invent a "Liu Shaoqi traitor-clique line of organization" and from it forge the "Xinjiang traitor group," the "Northeast traitor group" and the "Southern traitor group," great wrongful cases)'
  - add:
      entry:
        id: cal.1967-03-21.china-leadership-7
        when: Mar. 21
        date: '1967-03-21'
        thread: china-leadership
        also: [china]
        c: The Politburo Standing Committee decides to hand the materials on Liu Shaoqi's "historical problems" to the Wang Guangmei special case group, set up in December 1966, for investigation; under the direct control and direction of Jiang Qing, Kang Sheng and Xie Fuzhi it becomes the "Liu Shaoqi–Wang Guangmei special case group."
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 654 (Mar. 21, 1967). Made public: 1996. Names: Liu Shaoqi, Jiang Qing, Kang Sheng, Xie Fuzhi.'
        tags: [polity:prc, name:liu-shaoqi, name:jiang-qing, name:kang-sheng, name:xie-fuzhi, vis:only:prc]
  - add:
      entry:
        id: cal.1967-03-28.china-leadership-4
        when: Mar. 28
        date: '1967-03-28'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Mao, answering what Zhang Chunqiao and others say of his judgment of the film *Secret History of the Qing Court*, and giving the facts: he saw the film, he recalls, after a meeting at the Chairman''s place, at the Chunou Zhai, when it was already well into the night, and the second half he did not see clearly; Premier Zhou Enlai was among those who watched with him, and apparently Hu Qiaomu and others; they dispersed without a word. He never had the thought or the view that *Secret History of the Qing Court* is patriotism and could not have said it.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 654 (Mar. 28, 1967). Made public: 1996. Names: Liu Shaoqi, Mao Zedong, Zhou Enlai, Zhang Chunqiao.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, name:zhou-enlai, vis:only:prc, name:zhang-chunqiao]
  - variant:
      id: cal.1967-03-30.china-leadership-3
      unit: A
      witness: w.shaoqi-liu-shaoqi-nianpu-chronology
      reads: on Apr. 1 the *Renmin ribao* and *Hongqi* print Qi Benyu's "Patriotism or National Betrayal? On the Reactionary Film *Secret History of the Qing Court*"
      at: 654–655
  - add:
      entry:
        id: cal.1967-04.china-leadership-2
        when: Apr.
        date: 1967-04
        thread: china-leadership
        also: [china]
        c: From April the newspapers begin to criticize and attack Liu Shaoqi without naming him.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 655 (April, 1967). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1967-04-06.china-leadership-2
        when: Apr. 6
        date: '1967-04-06'
        thread: china-leadership
        also: [china]
        c: 'Rebels in Zhongnanhai again struggle against Liu Shaoqi, ordering him to cook his own meals, sweep, wash his clothes and change his hours, and to answer the "eight whys" in Qi Benyu''s article. Liu answers them one by one from the historical record. Asked of the "traitor group of sixty-one," he says this is simply absurd: the release of the sixty-one from prison was approved by the Party Center; when the Japanese were about to attack North China the cadres had to be protected and could not again be left to the Japanese to kill; the Party organizations in the white areas had been largely destroyed by the Wang Ming line; these comrades are most valuable; many central leaders know it, and it was settled long ago.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 655 (Apr. 6, 1967). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-09.china-leadership-2
        when: Apr. 9
        date: '1967-04-09'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, learning that Tsinghua is to hold a congress of 300,000 to criticize and struggle against Wang Guangmei, says indignantly: he has mistakes and takes them; the work group was sent by the Center and Guangmei has no responsibility; why let a substitute suffer? He is the one to examine himself and be struggled; he will go to the masses, a Communist not afraid of death, and why of the masses? He tells those about him that when he is dead they should scatter his ashes on the great sea like Engels'' ("this is my testament to you"), and tells his children: their father is a proletarian and they must be proletarians; their father is a son of the people and they must be good sons and daughters of the people, always following the Party and always for the people.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 655 (Apr. 9, 1967). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1967-04-10.china-leadership-2
        when: Apr. 10
        date: '1967-04-10'
        thread: china-leadership
        also: [china]
        c: The rebels of Tsinghua hold a criticism and struggle meeting against Wang Guangmei, called a congress of 300,000; hundreds of leading cadres are made to stand with her.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 655 (Apr. 10, 1967). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi]
  - cite:
      id: cal.1967-04-12.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 655 (Apr. 12–18, 1967; at the enlarged meeting of the Military Commission Lin Biao, Jiang Qing, Chen Boda, Kang Sheng and Zhang Chunqiao speak in turn, the book says concocting and criticizing the so-called "crimes" of Liu Shaoqi and Deng Xiaoping)'
  - add:
      entry:
        id: cal.1967-04-14.china-leadership-4
        when: Apr. 14
        date: '1967-04-14'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hands the rebels, in reply to the "eight whys" of Qi Benyu''s article, a statement answering item by item and setting out the facts. In answer to "why propose and carry out a bourgeois reactionary line" he writes: he still does not know why, nor has he seen an article that fully explains why he committed a line error; after the Eleventh Plenum criticized his errors, others committed errors of the same kind, which shows they too do not know why; he will try to study Mao''s works and the other books and articles the Chairman has asked him to read, to be clear in his mind, and to test it in the revolutionary masses'' practice; only then can he answer why he made a line error in this proletarian cultural revolution and how to correct it. Staff paste the statement up as a big-character poster in Zhongnanhai; within hours it is torn to pieces.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 656 (Apr. 14, 1967; the book adds that Liu was thereafter wholly denied the right to defend himself). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1967-05-04.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 656 (May 8, 1967; the book says the editorial departments of the *Renmin ribao* and *Hongqi* publish "The Essence of ''Self-Cultivation'' Is Betrayal of the Proletarian Dictatorship," criticizing Liu Shaoqi''s *On the Self-Cultivation of a Communist* without naming him)'
      units: A
  - add:
      entry:
        id: cal.1967-05-11.china-leadership-6
        when: May 11
        date: '1967-05-11'
        thread: china-leadership
        also: [china]
        c: The Central Committee issues a notice that the article "The Essence of 'Self-Cultivation' Is Betrayal of the Proletarian Dictatorship" is an important article adopted after discussion at the enlarged meeting of the Standing Committee, and asks every unit to "earnestly organize study and discussion" and carry the great criticism of the biggest handful of capitalist-roaders in the Party further.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 656 (May 11, 1967). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1967-05-18.china-leadership-8
        when: May 18
        date: '1967-05-18'
        thread: china-leadership
        also: [china]
        c: The editorial departments of the *Renmin ribao* and *Hongqi* publish "A Great Historical Document," criticizing Liu Shaoqi under the name "China's Khrushchev," raising the charges to the level of principle and line; after that the papers across the country print many articles criticizing Liu, and the "great criticism movement," aimed chiefly at him, is launched among the masses.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 656 (May 18, 1967). See [[cal.1967-05-18.china-leadership]]. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1967-07-04.china-leadership-4
        when: July 4
        date: '1967-07-04'
        thread: china-leadership
        also: [china]
        c: Wang Dongxing, director of the Central Committee's General Office, tells Liu Shaoqi that the Party Center wants him to write an examination for the "New August 8 Combat Regiment" of the Peking Architecture and Engineering Institute.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 656 (July 4, 1967). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-08.china-leadership-2
        when: July 8
        date: '1967-07-08'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes his "Examination to the New August 8 Combat Regiment of the Peking Architecture and Engineering Institute and its revolutionary teachers, students and staff." He again takes responsibility for the work groups of the early stage of the "Cultural Revolution": before July 18 of last year Mao was not in Peking and the Center''s daily work was presided over by him; in the fifty-odd days after the work groups were sent he constantly supported them, which increased the likelihood and gravity of their errors; he did not understand his mistake until Mao''s poster "Bombard the Headquarters" came out on Aug. 5 last year, and before that did not see that he had committed so serious an error. The rebels denounce the examination as "iron proof of a false confession and a real counter-attack, and a manifesto."'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 656–657 (July 8, 1967). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-16.china-leadership-2
        when: July 16
        date: '1967-07-16'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Wang Dongxing: since his first examination has been called a "counter-attack," he does not mean to make a second examination to that organization.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 657 (July 16, 1967). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1967-07-18.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 657 (July 18, 1967; the book says Jiang Qing, Kang Sheng and Chen Boda, while Mao is away from Peking, organize a meeting to struggle against Liu and his wife, with raids on the house and personal persecution; before being dragged to the meeting Liu says to Wang Guangmei, "Fortunately in history it is the people who write"; after the meeting he is separated from his family, held alone and loses freedom of movement)'
  - add:
      entry:
        id: cal.1967-07-20.china-leadership-3
        when: July 20–24
        date: '1967-07-20'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi writes Wang Dongxing three letters, July 20 to 24, asking him to report to the Central Committee the letters of the "Eight-One Combat Regiment" of the Peking Architecture and Engineering Institute and the siege of Zhongnanhai by the rebels to "pull out Liu," and asks the Center to decide on the handling; none is answered.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 657 (July 20–24, 1967). Made public: 1996. Names: Liu Shaoqi. Check: the dates of the three letters; the book gives July 20–24.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07-20.china-leadership-4
        when: July 20
        date: '1967-07-20'
        thread: china-leadership
        also: [china]
        c: Night. People sent by Qi Benyu and others, as "revolutionary masses," press Liu Shaoqi to write an examination; he refuses.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 657 (July 20, 1967). Made public: 1996. See [[cal.1967-07-20.china-leadership-3]]. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1967-07.china-leadership-2
        when: July–Aug.
        date: 1967-07
        thread: china-leadership
        also: [china]
        c: Over a thousand rebel organizations in Peking and elsewhere set up a "Pull Out Liu Front Line," gathering up to tens of thousands to surround Zhongnanhai and shout that Liu must "roll out of Zhongnanhai."
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 657 (July–Aug., 1967; the book has members of the Central Cultural Revolution Group urging them on). Names: Liu Shaoqi. Check: the days; the book has "in July and August."'
        tags: [polity:prc, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1967-08-05.china-leadership-4
        when: Aug. 5
        date: '1967-08-05'
        thread: china-leadership
        also: [china]
        c: The rebels hold a meeting in Tiananmen Square to criticize Liu Shaoqi, said to be of a million; at the same time Zhongnanhai again organizes a "meeting to struggle against Liu, Deng and Tao."
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 657 (Aug. 5, 1967). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc@B]
  - add:
      entry:
        id: cal.1967-08-08.china-leadership-4
        when: Aug. 8
        date: '1967-08-08'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Mao and the Central Committee to state his political attitude further: when he sees it said that his aim is to "oppose the Party," "oppose socialism," "oppose Chairman Mao," "oppose Mao Zedong Thought," "restore capitalism in China" and "plot to usurp the Party''s power," he cannot accept it, for he has never thought so, and what he thought was the opposite; he has no faction in the Party and no illegal organizational activity inside it. The letter formally asks Mao and the Party Center to relieve him of all his posts in and outside the Party.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 658 (Aug. 8, 1967). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1967-09-13.china-leadership-7
        when: Sept. 13
        date: '1967-09-13'
        thread: china-leadership
        also: [china]
        c: Wang Guangmei is formally arrested; Liu Shaoqi's children are driven out of Zhongnanhai to their own schools to be criticized and investigated.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 658 (Sept. 13, 1967). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1967-11.china-leadership
        when: Nov.
        date: 1967-11
        thread: china-leadership
        also: [china]
        c: Wang Guangmei is moved to Qincheng prison; Liu Shaoqi is thereafter held alone at his residence.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 658 (Nov., 1967). Made public: 1996. Names: Liu Shaoqi. Check: the day; the book gives the month only.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1968-02-11.china-leadership-2
        when: Feb. 11
        date: '1968-02-11'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi, on a notice from the Political Department of the Central Committee's General Office, gives a written reply to the "proletarian revolutionaries of Zhongnanhai," telling how he joined the League and the Party and how twice in his history he was arrested by the enemy and got out of prison through rescue, and setting out the facts.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 659 (Feb. 11, 1968). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1968-02-26.china-leadership
        when: Feb. 26
        date: '1968-02-26'
        thread: china-leadership
        also: [china]
        c: 'Xie Fuzhi, on the report of the Wang Guangmei special case group, writes: "The case of the ''big traitor Liu Shaoqi'' is mainly handled in person by Comrade Jiang Qing; hereafter all reports and requests on important matters are to go first and directly to Comrade Jiang Qing."'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 659 (Feb. 26, 1968). Made public: 1996. Names: Liu Shaoqi, Xie Fuzhi, Jiang Qing.'
        tags: [polity:prc, name:liu-shaoqi, name:xie-fuzhi, name:jiang-qing, vis:only:prc]
  - add:
      entry:
        id: cal.1968.china-leadership-4
        when: '1968'
        date: '1968'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi, still held alone, falls ill successively from the start of the year with pneumonia, diabetes, high blood pressure and vegetative-nerve disorder.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 660 (1968, 1968). Made public: 1996. Names: Liu Shaoqi. Check: the book says "this year" for the illnesses of 1968 at p. 660, at the end of the entry for Oct. 16.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1968-04.china-leadership
        when: Apr., early
        date: 1968-04
        thread: china-leadership
        also: [china]
        c: In the first ten days of April Liu Shaoqi shows a clouded mind, a dull expression, abnormal movements, unsteady standing and small steps.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 660 (Apr., early, 1968). Made public: 1996. Names: Liu Shaoqi. Check: the day.'
        at: before 1968-04-11
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1968-07.china-leadership-3
        when: July, early
        date: 1968-07
        thread: china-leadership
        also: [china]
        c: In the first ten days of July Liu Shaoqi develops bronchopneumonia on top of chronic bronchitis.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 660 (July, early, 1968). Made public: 1996. Names: Liu Shaoqi. Check: the day.'
        at: before 1968-07-11
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1968-07-11.china-leadership-3
        when: July 11–14
        date: '1968-07-11'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi is gravely ill, July 11 to 14, and after emergency treatment out of danger; the attacks recur, and by October there are five major relapses.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 660 (July 11–14, 1968). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1968-09-16.china-leadership-2
        when: Sept. 16
        date: '1968-09-16'
        thread: china-leadership
        also: [china]
        c: The "Liu Shaoqi–Wang Guangmei special case group," under the direct control and direction of Jiang Qing, Kang Sheng and Xie Fuzhi, puts together three volumes of "crime materials of Liu Shaoqi." In her comment on them Jiang Qing calls Liu a "big traitor, big internal spy, big scab, big special agent, big counter-revolutionary," a "representative of the American Far East intelligence bureau."
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 659 (Sept. 16, 1968; the book says the group forged the evidence by fabrication, quotation out of context, interrogation and coercion). Made public: 1996. Names: Liu Shaoqi, Jiang Qing, Kang Sheng, Xie Fuzhi.'
        tags: [polity:prc, name:liu-shaoqi, name:jiang-qing, name:kang-sheng, name:xie-fuzhi, vis:only:prc]
  - add:
      entry:
        id: cal.1968-09-29.china-leadership-5
        when: Sept. 29
        date: '1968-09-29'
        thread: china-leadership
        also: [china]
        c: Lin Biao writes on the special case group's materials on Liu Shaoqi "completely agree," and "salute Comrade Jiang Qing, who leads the work on the case so brilliantly and has won huge success."
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 659 (Sept. 29, 1968). Made public: 1996. See [[cal.1968-09-16.china-leadership-2]]. Names: Lin Biao, Liu Shaoqi, Jiang Qing.'
        tags: [polity:prc, name:lin-biao, name:liu-shaoqi, name:jiang-qing, vis:only:prc]
  - cite:
      id: cal.1968-10-31.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 659–660 (Oct. 13–31, 1968; the book says the Twelfth Plenum of the Eighth Central Committee (enlarged) meets at Peking Oct. 13–31; of the Eighth Central Committee''s 97 members 40 can attend, 10 alternates are made members to pass half, and of the 133 participants 74 (over 57 percent) are enlarged participants, members of the Central Cultural Revolution Group and the Military Commission''s office group and persons from the provinces, municipalities, regions, great military regions and central organs; from the start the plenum breaks into groups to surround and criticize Zhu De, Chen Yun, Chen Yi, Ye Jianying, Li Fuchun, Li Xiannian and other veteran comrades; on the "Report on the examination of the crimes of the traitor, hidden enemy and scab Liu Shaoqi," written on forged evidence under Jiang Qing, Kang Sheng and Xie Fuzhi, it decides to expel Liu forever from the Party and strip him of all posts in and out of the Party, the book calling this the greatest wrongful case in the Party''s history; Chen Shaomin, member of the Central Committee and Vice-Chairman of the All-China Federation of Trade Unions, unafraid of the pressure, refuses to agree to it)'
      units: A, C, D
  - add:
      entry:
        id: cal.1968-10-09.china-leadership-4
        when: Oct. 9
        date: '1968-10-09'
        thread: china-leadership
        also: [china]
        c: From Oct. 9 Liu Shaoqi can no longer feed himself and is kept alive by nasal feeding.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 660 (Oct. 9, 1968). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1968-10-14.china-leadership-2
        when: Oct. 14
        date: '1968-10-14'
        thread: china-leadership
        also: [china]
        c: 'The "Condition Report" of Oct. 14 on Liu Shaoqi records coronary heart disease, hardening and softening of the cerebral blood vessels, and diabetes: his condition may worsen suddenly, and if a serious relapse comes again, he can no longer be saved.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 660 (Oct. 14, 1968). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1968-10-16.china-leadership-2
        when: Oct. 16
        date: '1968-10-16'
        thread: china-leadership
        also: [china]
        c: 'The *Renmin ribao* reprints the editorial of *Hongqi* no. 4, "Absorb the fresh blood of the proletariat: an important question in Party rectification," which calls on readers to criticize the "theory of the dying out of class struggle," the "docile tool theory," the "mass backwardness theory," the "joining the Party to become an official theory," the "inner-Party peace theory" and the "public-private fusion theory" it attributes to Liu Shaoqi.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 660 (Oct. 16, 1968; the book says many articles of this "great revolutionary criticism" were organized and commissioned by Lin Biao, Jiang Qing and others, quoting out of context and distorting facts). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi]
  - cite:
      id: cal.1969-04-01.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Apr. 1–24, 1969; the book says the Ninth Congress of the Chinese Communist Party meets at Peking; Lin Biao''s political report affirms the "theory of continuing revolution under the dictatorship of the proletariat" as the guiding thought of socialist revolution and the theoretical basis of the "Cultural Revolution," and so legitimizes the Cultural Revolution''s wrong theory and practice; the congress elects a new central leadership into which many close friends and followers of Lin Biao and Jiang Qing enter the Central Committee)'
      units: A
  - cite:
      id: cal.1969-04-28.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Apr. 28, 1969; at the First Plenum of the Ninth Central Committee, the book says, the main members of Lin Biao''s and Jiang Qing''s group enter the Politburo and Lin Biao is elected Vice-Chairman of the Central Committee)'
      units: A, B, D
  - add:
      entry:
        id: cal.1969-07-05.china-leadership
        when: July 5
        date: '1969-07-05'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi has a relapse of bronchial pneumonia: fever, cough, rapid breathing, many moist rales in both lungs and a quickened heartbeat. The consulting doctors'' "Condition Report" says that because of his age, long illness in bed, emaciation and poor resistance he is liable to shock, heart failure and diabetic ketoacidosis, so the outlook is poor and he may die at any time. After emergency treatment his condition is for the time stable.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (July 5, 1969). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
