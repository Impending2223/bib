      id: cal.1966-04-28.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 637 (Apr. 28, May 2 and 11, 1966; Liu, with Zhou Enlai, Zhu De and Deng Xiaoping, goes to the airport to welcome the Albanian party and government delegation headed by Mehmet Shehu, Politburo member and Chairman of the Council of Ministers; he holds talks with Shehu, continues them May 2 and sees him off May 11)'
      units: A
  - add:
      entry:
