        date: '1965-06-08'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi receives the Albanian government economic delegation led by Spiro Koleka (斯皮罗·科列加), Politburo member and First Vice-Chairman of the Council of Ministers, and Koço Theodhosi (科乔·蒂奥多西), alternate Politburo member and Vice-Chairman of the Council of Ministers and Chairman of the State Planning Commission.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 622 (June 8, 1965). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:albania, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1965-06-14.china-leadership-4
