  - add:
      entry:
        id: cal.1965-07-29.china-leadership-5
        when: July 29
        date: '1965-07-29'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears at Shenyang the Northeast Bureau and the Liaoning provincial committee report on their work. He says: the "four clean-ups" movement is to rouse the masses to solve the relations of production and superstructure that do not suit the growth of the productive forces, which gives a grip on everything else; but after the "four clean-ups" there will be new problems in the relations of production and superstructure, to be solved continually, and the style of the leading organs, their structure and methods, must go on being improved.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 623 (July 29, 1965). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
