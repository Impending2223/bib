      units: A
  - cite:
      id: cal.1965-01-03.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 613 (Jan. 3, 1965; Liu attends the enlarged meeting of the Politburo Standing Committee, at which Mao criticizes the first stage of the rural movement for relying only on work teams, ten thousand and more gathered in one county, long study of documents without relying on the masses, mystery-mongering, "rooting and linking up," a cold-and-clear method that makes a complex philosophy and a sea-of-men tactic; he asks every level of leadership to change this, to meet the masses directly with documents and rouse them widely to open the way quickly)'
      units: A, B, C, D
  - add:
      entry:
        id: cal.1965-01-08.china-leadership-4
        when: Jan. 8
        date: '1965-01-08'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi calls the plenary meeting of the National Defense Council and speaks.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 613 (Jan. 8, 1965). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-08.china-leadership-5
        when: Jan. 8
        date: '1965-01-08'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, on reading in the Four Clean-ups Bulletin of the Peking municipal committee''s work team in Tongxian county an article, "Poor and lower-middle peasants of Gaogezhuang brigade accuse the seriously "four unclean" cadre Dou Zixiang," writes: the work team''s ways of organizing mass struggle are not good, with too many large meetings, beating at the meetings and other forms of physical punishment; the Bulletin printed and issued the material without criticizing it, which is wrong.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 613 (Jan. 8, 1965). Made public: 1996. To check: the article in the Four Clean-ups Bulletin of the Tongxian work team and Liu''s note (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 613). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-09.china-leadership-3
        when: Jan. 9
        date: '1965-01-09'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi, Zhu De and Zhou Enlai jointly telegraph Sihanouk, Norodom Montana (诺罗敦·蒙达那), President of the National Assembly, and Norodom Kantol (诺罗敦·康托尔), head of government, thanking them and the Cambodian government for their efforts to rescue nine Chinese trade workers and journalists, arrested illegally by the Brazilian authorities in April 1964 and illegally sentenced on Dec. 22.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 613–614 (Jan. 9, 1965). Names: Liu Shaoqi, Zhu De, Zhou Enlai, Sihanouk, Norodom Kantol.'
        tags: [polity:prc, polity:cambodia, polity:brazil, name:liu-shaoqi, name:zhu-de, name:zhou-enlai, name:norodom-sihanouk, name:norodom-kantol]
  - cite:
      id: cal.1965-01-14.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 614 (Jan. 14, 1965; Liu attends the enlarged meeting of the Politburo Standing Committee, which discusses the work conference''s minutes, "Some problems now raised in the rural socialist-education movement" (the "Twenty-three Articles"); the same day the Central Committee issues the notice sending them down to the whole Party)'
      units: A, H
  - add:
      entry:
        id: cal.1965-01-20.china-leadership-2
        when: Jan. 20
        date: '1965-01-20'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi drafts for the Central Committee a notice on publicizing the "Twenty-three Articles," asking Party committees at every level to give the Articles and the Center's notice a wide publicity, in the points and over the whole area, so that the great majority of poor and lower-middle peasants and other masses are supported and encouraged, cadres and work-team members educated and raised, the people steadied and the few enemies of socialism more isolated, and the movement and this year's production go forward soundly.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 614 (Jan. 20, 1965). Made public: 1996. To check: the Central Committee''s notice on publicizing the Twenty-three Articles, Jan. 20, 1965 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 614). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
