  - cite:
      id: cal.1966-04-15.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 635 (Apr. 15, 1966; Liu leaves Kunming for East Pakistan, reaches Dacca, where President Ayub Khan welcomes him, and attends the reception of Dacca''s citizens)'
      units: A
  - add:
      entry:
        id: cal.1966-04-16.china-leadership-4
        when: Apr. 16
        date: '1966-04-16'
        thread: china-leadership
        also: [china, south-asia]
        c: 'Liu Shaoqi talks with Ayub Khan at Dacca. On the international situation he says: in the twenty years since the Second World War most Asian and African states and a few Latin American ones have thrown off colonial rule and won independence; independence for them is a general trend of development that goes on and will not change direction. The Western colonial states will not willingly withdraw wholly from their spheres of power and still hope to keep their political and economic interests; in fact there is a struggle, of the oppressed peoples of Asia, Africa and Latin America and their leaders who want independence against the colonial states that want to keep their interests and privileges, and it will continue; a reverse current may come for a time, but the general trend is for them to free themselves wholly from imperialism and colonialism and win complete independence.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 636 (Apr. 16, 1966). Made public: 1996. Names: Liu Shaoqi, Ayub Khan.'
        tags: [polity:prc, polity:pakistan, name:liu-shaoqi, name:ayub-khan-mohammad, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1966-04-16.china-leadership-5
        when: Apr. 16
        date: '1966-04-16'
        thread: china-leadership
        also: [china, south-asia]
        c: Liu Shaoqi tours the Shitalakshya river near Dacca and watches a Pakistani folk song and dance performance.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 636 (Apr. 16, 1966). Names: Liu Shaoqi. Check: the book prints 希塔拉雅河; the item has a triangle after the day''s talks.'
        tags: [polity:prc, polity:pakistan, name:liu-shaoqi]
  - cite:
      id: cal.1966-04-17.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 636 (Apr. 17–19, 1966; Liu leaves Dacca Apr. 17 for Burma, reaches Rangoon, where Ne Win welcomes him; at Ne Win''s welcome banquet he says the two countries have always been friendly, that in the ten-odd years whatever has changed in Asia and the world the friendship has gone ever forward, and that both sides have truly kept to the five principles; Apr. 18 he continues talks with Ne Win and lays a wreath at Aung San''s tomb; Apr. 19 he leaves Rangoon for home and reaches Kunming)'
      units: A, B
  - cite:
      id: cal.1966-04-16.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 636–637 (Apr. 20, 1966; Liu reaches Hangzhou and attends the enlarged meeting of the Politburo Standing Committee Mao presides over, which prepares for the enlarged Politburo meeting soon to be held in Peking)'
      units: B, D
  - add:
      entry:
        id: cal.1966-04-25.china-leadership-2
        when: Apr. 25
        date: '1966-04-25'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi returns to Peking.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 637 (Apr. 25, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
