  - cite:
      id: cal.1964-12-30.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 612 (Dec. 30, 1964; Liu presides at the Supreme State Conference and speaks on the international and home situation, the socialist-education movement and the two labor and two education systems; the movement''s main point is to rectify those in power in our Party who stubbornly take the capitalist road, in the production brigades, teams and communes, some in the counties, some in the special districts and provinces, and a few departments of the Center; on remolding he says not to fear it, for he too at first was no Marxist and believed in Confucius, in feudal literati, then in capitalism and the Kuomintang, and last found Marxism; if China itself is done well and its people and society remolded, a quarter of the world is done well)'
  - variant:
      id: cal.1965-01-04.china-leadership
      unit: B
      witness: w.shaoqi-liu-shaoqi-nianpu-chronology
      reads: on Jan. 3, 1965 the session elects Liu Shaoqi Chairman of the People's Republic, and he is also Chairman of the National Defense Council; on his nomination the session names Zhou Enlai Premier of the State Council
      at: 610–611
  - cite:
      id: cal.1965-01-01.china-leadership
