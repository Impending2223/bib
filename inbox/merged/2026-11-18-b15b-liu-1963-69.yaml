  - cite:
      id: cal.1964-03-21.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 589 (Mar. 21, 1964; Liu, with Zhou Enlai and Deng Xiaoping, receives the Japanese Communist Party Central Committee delegation headed by Hakamada Satomi, Politburo and Secretariat member)'
  - add:
      entry:
        id: cal.1964-03-27.china-leadership-2
        when: Mar. 27
        date: '1964-03-27'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Wang Guangmei in reply, on the course of the socialist-education movement at the Taoyuan brigade: 95 percent of the masses and 95 percent of the cadres are to be united, which is the movement''s and the struggle''s final aim, and cannot be reached without criticism and struggle. Those who violate the people''s interests and the Party''s policy, seek the illegal gains of a few, persist, and try to wreck, cannot but be fought on firmly, or the 95 percent of masses and cadres cannot be united.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 589 (Mar. 27, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1964-04-05.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 589 (Apr. 5, 1964; Liu, with Zhou Enlai, receives Prince Souvanna Phouma, Prime Minister of Laos)'
      units: B
  - add:
      entry:
        id: cal.1964-04-11.china-leadership-2
        when: Apr. 11
        date: '1964-04-11'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi replies to Wang Guangmei, who had told him her view of the socialist-education movement at the Taoyuan brigade: the actual conditions there and the practice of her and the commune members are the sole criterion of truth, and there can be no other; his letter can only be a reference to start them thinking in one direction; if it is not the truth, then whoever''s view it is, they must dare to deny it.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 590 (Apr. 11, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1964-04-12.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 590 (Apr. 12, 1964; Liu, with Zhou Enlai, receives Edward F. Hill, chairman of the Central Committee of the Communist Party of Australia (Marxist-Leninist))'
  - add:
      entry:
        id: cal.1964-04-19.china-leadership
        when: Apr. 19
        date: '1964-04-19'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi receives the Korean cultural delegation headed by Kang Ku-yong (康久永), Vice-Chairman of the Committee for Cultural Relations with Foreign Countries. On creative work in literature and art he says: an era of revolutionary development should have good works; the literature and art of the New Democratic period already had socialist elements; with ten-odd years since the victory, socialist transformation basically done and the economic base complete, the New Democratic literature and art alone is not enough; a step further is needed, to socialist literature and art, which needs creation. China has not solved its problems here well, nor in education: what to do with primary, middle and university schools, where it too has many faults; these need solving and it is time to solve them.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 590 (Apr. 19, 1964). Made public: 1996. See [[cal.1964-04-18.china-leadership-2]]. Names: Liu Shaoqi. Check: the Latin form of 康久永.'
        tags: [polity:prc, polity:dprk, name:liu-shaoqi, vis:only:prc+dprk@B-G]
  - add:
      entry:
        id: cal.1964-05-13.china-leadership-4
        when: May 13
        date: '1964-05-13'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi receives the Supreme People's Assembly delegation of Korea headed by Choe Won-taek, Chairman of the Assembly, and Kang Yang-uk, Vice-Chairman of its Standing Committee.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 590 (May 13, 1964). Names: Liu Shaoqi. Check: the Latin forms of 崔元泽 and 康良煜.'
        tags: [polity:prc, polity:dprk, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1964-05-14.china-leadership-3
        when: May 14
        date: '1964-05-14'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears the leading group of the State Council''s Planning Commission report on the long-term plan. He says: be honest people, speak honestly and do honest things; in arranging plans do not let the honest suffer or the boasting and false take advantage. He also asks how this country is to spread education: by present methods peasants cannot afford it and neither can the state, and under the present system, spreading education will not work; the way is work-study, half work and half study; one system will not do, there must be two labor systems, two education systems and two kinds of schools.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 590 (May 14, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1964-05-15.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 590–591 (May 15–June 17, 1964; Liu attends the Central Work Conference, which takes up farm planning and rural work, the Third Five-Year Plan (1966–70) and political work, and also the guard against revisionism, the training of successors, and the two labor systems and two education systems)'
      units: B, C
  - cite:
      id: cal.1964-05-16.china-leadership
