        c: Liu Shaoqi, with Deng Xiaoping, receives Vic Wilcox, general secretary of the Communist Party of New Zealand.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 633 (Mar. 7, 1966). Names: Liu Shaoqi, Deng Xiaoping.'
        tags: [polity:prc, polity:nz, name:liu-shaoqi, name:deng-xiaoping]
  - cite:
      id: cal.1966-03-17.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 633 (Mar. 17–20, 1966; Liu reaches Hangzhou Mar. 17 and attends the enlarged meeting of the Politburo Standing Committee Mao calls; Mao there condemns the present state of the cultural and educational circles, which he says "in fact are held by the bourgeoisie and petty bourgeoisie"; Mar. 20 Liu returns to Peking)'
      units: B
  - add:
      entry:
        id: cal.1966-03-22.china-leadership-4
        when: Mar. 22
