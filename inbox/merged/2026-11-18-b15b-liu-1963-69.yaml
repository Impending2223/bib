      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 608 (Oct. 31, 1964; Liu holds talks with King Mohammed Zahir Shah of Afghanistan)'
      units: B
  - cite:
      id: cal.1964-11-01.china-leadership-6
