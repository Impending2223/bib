        date: 1963-11
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes an inscription for the exhibition on Hebei''s fight against the floods, to open Dec. 13: remember the lessons of this flood and of other floods and droughts; the people of the province are to unite and struggle, determined to build Hebei''s water conservancy well in about twenty years, stage by stage.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 585–586 (Nov., late, 1963). Names: Liu Shaoqi. Check: the day; the book has "the last ten days of November."'
        at: after 1963-11-20
        tags: [polity:prc, name:liu-shaoqi]
