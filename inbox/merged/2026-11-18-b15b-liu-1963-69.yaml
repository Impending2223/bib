  - add:
      entry:
        id: cal.1963-04-24.china-leadership-6
        when: Apr. 24
        date: '1963-04-24'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi talks with Ne Win. On the road of the newly independent states he says there are three to choose: the capitalist road, which existing capitalist states will not let a backward country, a small one above all, travel to the end; the road of colony and dependency, which China will not take; so only the socialist road, on which China is, and which needs decades of work. At home it must rely on the great majority, workers, peasants, the urban petty bourgeoisie and others ready for socialism; abroad it joins all nations that respect its independence and equality and opposes imperialism. China truly respects Burma and treats it as an equal and will do nothing to harm it.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 575 (Apr. 24, 1963). Made public: 1996. Names: Liu Shaoqi, Ne Win.'
        tags: [polity:prc, polity:burma, name:liu-shaoqi, name:ne-win, vis:only:prc+burma]
  - add:
      entry:
