  - add:
      entry:
        id: cal.1965-02-09.china-leadership-5
        when: Feb. 9
        date: '1965-02-09'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi comments on a telegram of Li Fanwu, secretary of the Heilongjiang provincial committee, on preparing the forest reserve: "Let Comrade Yu Qiuli note that forest industry and forest resources are to be a heading in the long-term plan; do not forget the work of enlarging forest resources. Greening the whole country too is to be done by rousing the masses widely."'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 614–615 (Feb. 9, 1965). Made public: 1996. To check: Li Fanwu''s telegram and Liu''s comment (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 614–615). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
