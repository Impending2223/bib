  - add:
      entry:
        id: cal.1965-08-11.china-leadership-4
        when: Aug. 11
        date: '1965-08-11'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears Chen Zhengren, Minister of the Eighth Ministry of Machine Building, report on developing farm-machinery production. Liu says: farm machinery is a productive force; if it is not done well now it will have to be done in the end; it does not help agriculture if done badly, and farming cannot develop; take as few detours as possible, subsidize little, and open this road.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 624 (Aug. 11, 1965). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1965-08-13.china-leadership-2
        when: Aug. 13
        date: '1965-08-13'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Mao on four bulletins Tan Zhenlin sent him, reporting that in rural work in places members'' private plots have been confiscated, the accounting of production teams arbitrarily changed to that of brigades, and members forced to find funds: these are the materials Tan sent and asked to have issued to all places; Liu thinks it the first time Tan has noticed and raised such problems and agrees they be sent down; Mao is asked to review, and if he agrees to send them, to instruct. Mao approves on Aug. 20 with "do so."'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 624 (Aug. 13, 1965). Made public: 1996. To check: Tan Zhenlin''s four bulletins, Liu''s letter of Aug. 13 and Mao''s comment of Aug. 20, 1965; the Central Committee''s instruction on current problems in rural work, to which the materials and a Center remark were attached (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 624). Names: Liu Shaoqi, Mao Zedong, Tan Zhenlin.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, name:tan-zhenlin, vis:only:prc]
