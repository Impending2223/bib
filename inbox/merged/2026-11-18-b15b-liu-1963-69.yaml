  - add:
      entry:
        id: cal.1964-11-07.china-leadership-5
        when: Nov. 7
        date: '1964-11-07'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi drafts for the Central Committee an instruction on the exercise of power by poor and lower-middle peasant associations where the situation is grave: in places where some basic cadres lie down and will not work, to resist the movement, or leadership is held by degenerate elements, or by landlords, rich peasants, counter-revolutionaries and bad elements, or by new bourgeois elements, the poor peasants'' associations may take over once the facts are established and the work team approves, and all power goes to the associations. Issued Nov. 12 as a Central Committee document to the Party committees of counties and regiments.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 608 (Nov. 7, 1964). Made public: 1996. To check: the Central Committee''s instruction of Nov. 12, 1964 on the exercise of power by the poor and lower-middle peasant associations (关于在阶级斗争严重的地区由贫协行使权力的批示) (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 608). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11.china-leadership
        when: Nov.
        date: 1964-11
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi revises the Central Committee and State Council''s draft notice on strengthening market control and striking hard at speculation, and adds: Party members or organ cadres found to support or take part in speculation are, once the facts are established, at once expelled from the Party and dismissed from work, and sent to the villages to labor under supervision or sentenced to reform through labor. The notice is issued Nov. 12 as a Central Committee document.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 608 (Nov., 1964). Made public: 1996. Names: Liu Shaoqi. Check: the day; the book gives the month only.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-17.china-leadership-2
        when: Nov. 17
        date: '1964-11-17'
        thread: china-leadership
        also: [china]
        c: The Central Committee issues its instruction on the question of developing the half-work (half-farming), half-study system of education.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 608 (Nov. 17, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-06.china-leadership-3
        when: Dec. 6
        date: '1964-12-06'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi writes to Song Renqiong, first secretary of the Northeast Bureau, forwarding the Henan provincial committee's report on gathering and training work teams and settling the "four unclean" of backbone cadres at county and commune levels, and recommends it to the Northeast provincial committees. He asks the bureau and the provinces' leaders, in light of the serious "four unclean" of county and commune cadres in the Henan report, to take charge in person of the work teams in several counties and one or two cities, to carry on the movement, keep rectifying the work teams and win. On Mao's opinion, this letter and the Henan report go out Dec. 10 as a Central Committee document to provincial and army-level Party committees.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 608–609 (Dec. 6, 1964). Made public: 1996. To check: the Henan provincial committee''s report and Liu''s letter, Dec. 6, 1964 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 608–609). Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-07.china-leadership
        when: Dec. 7
        date: '1964-12-07'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Zhou Enlai: the statistical forms and so-called "outlines of inquiry" now going to the villages are too many and burden grassroots work; most are unnecessary and most of their figures false; the figures needed come only from great effort and not from sending out a form from an office; the statistics departments are to be improved at the bottom.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 609 (Dec. 7, 1964). Made public: 1996. Names: Liu Shaoqi, Zhou Enlai.'
        tags: [polity:prc, name:liu-shaoqi, name:zhou-enlai, vis:only:prc]
