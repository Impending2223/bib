  - cite:
      id: cal.1964-07-28.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 597 (July 28, 1964; Liu presides at the Politburo meeting, which discusses and adopts the Central Committee''s reply to the CPSU letter of June 15)'
      units: A
  - cite:
      id: cal.1964-08-01.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 597–598 (Aug. 1, 1964; Liu reports, at the meeting of the responsible cadres of the Party, government, army organs and mass bodies in Peking, on the socialist-education movement and the two labor and two education systems: the movement is a greater revolution than land reform and cooperation, wider, deeper, more complex and harder; leading cadres at every level must go themselves to farms and factories to squat at points to gain direct experience, and insufficient understanding of the "four clean-ups" and "five-antis" and fear of hardship are the main reason leaders do not stay at points; each province and large city is to begin to try the two systems as regular labor and education systems, which can spread education, lighten the burden of state and family and in the long run gradually remove the difference between mental and manual labor; fewer fixed and more temporary workers)'
  - add:
      entry:
        id: cal.1964-08-02.china-leadership
        when: Aug. 2
        date: '1964-08-02'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears the Central Committee''s study-system research group report. He says: many small children, a low enrollment rate, they want to study and to go on; that wish is right, and a proletarian-dictatorship state led by the Communist Party cannot fail to meet it; but with only full-time schools of one kind neither the state nor the masses can bear the cost; only half-work half-study can lighten the burden of state and family and meet the young''s wish to go on to school.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 598 (Aug. 2, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08.china-leadership-3
        when: Aug., early
        date: 1964-08
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, revising the record of his report of Aug. 1 on the socialist-education movement and the two labor and education systems, adds a passage: much of the enemy contradiction now appears in the form of contradictions among the people and even in the Party, and within the many such contradictions lies a very dangerous part of the enemy contradiction; the task of this movement, the "four clean-ups" and "five-antis," is to resolve the great mass of contradictions among the people and in the Party and at the same time to ferret out and settle this hidden part of the enemy contradiction.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 598 (Aug., early, 1964). Made public: 1996. See [[cal.1964-08-01.china-leadership]]. Names: Liu Shaoqi. Check: the day; the book has "the beginning of August."'
        at: before 1964-08-11
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1964-08-05.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 599 (Aug. 5, 1964; the Secretariat meeting decides that Liu presides over revising the "Later Ten Points" and that the Center set up a command post for the "four clean-ups" and "five-antis," Liu at its head)'
