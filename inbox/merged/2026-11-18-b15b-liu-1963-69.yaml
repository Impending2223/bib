        also: [china, indonesia]
        c: Liu Shaoqi presides at a Politburo meeting, which hears Zhou Enlai on the postponement of the Second Asian-African Conference and on the political situation of Indonesia.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 627 (Oct. 26, 1965). Made public: 1996. Names: Liu Shaoqi, Zhou Enlai.'
        tags: [polity:prc, name:liu-shaoqi, name:zhou-enlai, vis:only:prc]
  - cite:
      id: cal.1965-10-31.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 627 (Oct. 31, 1965; Liu speaks at the first meeting of the committee to prepare the centenary of Sun Yat-sen''s birth: he praises Sun as a forerunner and leader of the Chinese bourgeois democratic revolution and a great man who gave important impetus to modern Chinese history, and calls on the people of the whole country and patriots overseas to unite further and work for Sun''s ideal of overthrowing imperialism and building a strong China)'
  - add:
      entry:
        id: cal.1965-11-03.china-leadership
        when: Nov. 3
        date: '1965-11-03'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi hears Education Minister He Wei and Vice-Minister Liu Aifeng report on the national conference on urban half-work, half-study education then in session.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 627 (Nov. 3, 1965). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1965-11-06.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 627–628 (Nov. 6, 1965; Liu presides at the enlarged Politburo meeting on the system of urban half-work, half-study education and speaks: national education has three forms, full-time, spare-time and half-work, half-study (half-farming, half-study); half-work schools are to train a new kind of worker with socialist consciousness, culture, science and technique and practical skill, the goal being men able to be cadres, technicians and engineers but also workers and peasants; intellectuals are too few, not too many, and more are needed, and the villages need many technicians for the "four modernizations"; the course for the cities is "universal junior-middle education by full-time and half-work, half-study schools walking on two legs"; the trials are to be kept up five years and spread in ten; the three fundamental measures against revisionism and a capitalist restoration are the socialist-education movement carried through, the reform of the education system with half-work, half-study, and cadres'' taking part in labor)'
  - cite:
      id: cal.1965-11-09.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628 (Nov. 9, 1965; Liu, with Zhou Enlai, receives President Mohammad Ayub Khan of Pakistan)'
  - cite:
      id: cal.1965-11-10.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628 (Nov. 10, 1965; the book says Yao Wenyuan''s article, in the Shanghai *Wenhui bao*, on the historical play *Hai Rui Dismissed from Office* "opened the prelude to the Cultural Revolution"; footnote 1 (628) names Yao as then a member of the editorial board of *Jiefangjun bao* and of the writing group of the Shanghai committee)'
      units: A
  - cite:
      id: cal.1965-11-15.china-leadership-4
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628 (Nov. 15 and 16, 1965; Liu presides at the enlarged Politburo meeting again on the system of urban half-work, half-study education and says the industrial departments are both production teams and teaching teams and must attend to education, and that young people at labor need care for health, with hours not too long or heavy; some half-work, half-study schools have heavy labor and heavy lessons too)'
      units: A
  - cite:
      id: cal.1965-11-15.china-leadership-4
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628–629 (Nov. 17 and 18, 1965; Liu presides at the enlarged Politburo meeting, which hears Yu Qiuli on the national planning conference, Gu Mu on capital construction, Zhao Erlu on the defense industry and Wu Bo on finance, and in principle approves the 1966 national economic plan)'
      units: A, F
  - cite:
      id: cal.1965-11-18.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 629 (Nov. 18, 1965; Liu receives the heads of the second batch of Japanese youth delegations to the China–Japan youth friendship gathering and Sunama Ichiro of the Japanese Communist Party; he says China, once a backward country, still has much backwardness in economy and culture, the villages above all more than Japan, and it will take decades to overcome it; it can be done only by the Chinese government and people through thrift, not by plundering and exploiting other countries and nations; China''s great majority are united under the Party and Mao and will make the country well in economy and culture by hard effort)'
  - add:
      entry:
