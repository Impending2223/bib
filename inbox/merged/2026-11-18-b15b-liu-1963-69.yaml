        when: Dec. 8
        date: '1965-12-08'
        thread: china-leadership
        also: [china]
        c: 'The *Renmin ribao* prints Liu Shaoqi''s inscription for the twentieth anniversary of the founding of broadcasting: raise high the red banner of Mao Zedong Thought, do broadcasting well, and give heart to the people of the whole country and of the world.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 629 (Dec. 8, 1965). Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong]
  - cite:
      id: cal.1965-12-08.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 629–630 (Dec. 8–15, 1965; Liu attends the enlarged meeting of the Politburo Standing Committee held at Shanghai under Mao, which discusses the "problems" of Luo Ruiqing; the book says Lin Biao, Ye Qun, Wu Faxian, Li Zuopeng and others framed charges and attacked Luo by surprise, and he was removed from his posts; footnotes 1–4 (629) give their posts at the time: Luo, Secretary of the Secretariat, Vice-Premier and Chief of the General Staff; Ye Qun, director of Lin Biao''s office; Wu, commander of the air force; Li, deputy commander of the navy)'
      units: A, B
  - cite:
      id: cal.1965-12-14.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 630 (Dec. 15, 1965; Liu writes to Mao proposing to issue "On the Ten Major Relationships": he has read it again and thinks it speaks well on some basic problems and still guides present work; he suggests it be issued as an internal document to the Party committees of counties and regiments and above for study, to which Mao agreed when Liu saw him the day before, and asks Mao to look at it once more and hand it to Deng Xiaoping and Peng Zhen; with Mao''s consent it is issued Dec. 27)'
      units: A, B, C
  - add:
      entry:
        id: cal.1966-02-03.china-leadership-4
        when: Feb. 3
        date: '1966-02-03'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi sends the Central-South Bureau's "Decision on carrying further the movement to study Chairman Mao's writings" to Zhou Enlai, Deng Xiaoping and Peng Zhen; he agrees that the Central-South Bureau publish it and suggests it appear also in the *Renmin ribao*.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 631 (Feb. 3, 1966). Made public: 1996. To check: the Central-South Bureau''s decision on carrying the movement to study Chairman Mao''s writings further, 1966 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 631). Names: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen.'
        tags: [polity:prc, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, vis:only:prc]
  - cite:
      id: cal.1966-02-05.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 631 (Feb. 5, 1966; Liu presides at the Politburo Standing Committee meeting, which discusses and agrees to the "Outline Report on the Current Academic Discussion" the Central Cultural Revolution Group of Five submitted (the "February Outline"); the outline says to keep to Mao''s policy of "letting go" stated at the propaganda work conference of March 1957, to hold to seeking truth from facts and equality before truth, to convince by reason and not decide like an academic overlord or press by force, to promote holding to truth and correcting mistakes at any time, to establish while breaking, to allow and welcome those who err and those who counter-attack academically to correct themselves, and to be serious and kind toward them, not "forbid revolution," and careful about publicly naming names in the press; Feb. 8 Peng Zhen and others report to Mao at Wuhan; Feb. 12 the Center sends the outline to the whole Party; footnote 1 (631) gives the Group''s head as Peng Zhen and its members as Lu Dingyi, Kang Sheng, Zhou Yang and Wu Lengxi)'
      units: B
  - cite:
      id: cal.1966-02-19.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 631–632 (Feb. 19, 1966; Liu says the results of 1965 are the accumulation of eight years and progress is great, but rousing the masses has only begun and the potential is large; to be at once full of drive and steady, with a clear head and a cool promoter; the leap forward was halved for some years, the adjustment halved again, and recently each year is better than the last; in any work the political meaning is to be made clear to those who do it; the highlight on politics means that people will not haggle over material gain, and work done better must also be paid by labor, not work harder and wages less; workers have practical difficulties including those of their families: first highlight politics, second solve the practical problems and guarantee their livelihood, a mass-line question)'
      units: A
  - add:
      entry:
        id: cal.1966-02-23.china-leadership-4
        when: Feb. 23
        date: '1966-02-23'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, carrying out Mao''s comment on the report of Wang Renzhong, first secretary of the Hubei provincial committee, to the Center on ideas for gradually realizing farm mechanization, writes to Zhou Enlai and Deng Xiaoping: the Hubei committee''s document, Mao''s comment and Wang''s letter should first go to the comrades of the Politburo and Secretariat, and to the State Planning Commission, Economic Commission, Capital Construction Commission, Science Commission, the Ministry of Materials, the Eighth and First Ministries of Machine Building, and Li Xuefeng of the North China Bureau and Liu Zihou, for study and opinions, and in a few days the Center is to call a meeting on it.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 632–633 (Feb. 23, 1966). Made public: 1996. To check: Wang Renzhong''s report on ideas for gradually realizing farm mechanization and Mao''s comment on it (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 632–633). Names: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1966-02-23.china-leadership-5
        when: Feb. 23
        date: '1966-02-23'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi presides at an enlarged meeting of the Politburo Standing Committee with the Vice-Premiers in Peking, which discusses farm mechanization and charges the State Planning Commission's small group with finding out the situation and drafting a plan for the next Central Work Conference, and the group to send men to Hubei to study the plan with the Hubei committee and try it out.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 632–633 (Feb. 23, 1966). Made public: 1996. Names: Liu Shaoqi. Check: the day; the book says "afterward," on or after Feb. 23.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1966-03-11.china-leadership-2
        when: Mar. 11
        date: '1966-03-11'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi writes to Mao reporting how the farm mechanization question was handled, by his meeting of the Standing Committee and the sending of the planning commission's small group to Hubei.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 633 (Mar. 11, 1966). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - cite:
      id: cal.1966-02-24.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 633 (Feb. 24 and Mar. 4, 1966; Liu goes to the airport to welcome Kwame Nkrumah, President of Ghana, Feb. 24, and Mar. 4 to see him off)'
  - add:
      entry:
        id: cal.1966-02-26.china-leadership
        when: Feb. 26
        date: '1966-02-26'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi talks with Liu Ningyi, Chairman of the All-China Federation of Trade Unions, on trade-union work. Lenin said unions are a school of communism, a link between the Party and the masses, and a prop of state power, though Lenin himself had no practice of it; the unions are the Party's belt to the masses and are to act as belt and conduit and report conditions. If Liu Ningyi has misgivings, that is counting personal gain and loss; the unions must take a stand and hold the class stand firm to report conditions; a wrong report is a mistake and nothing to fear; if right, though it offends and he is removed from his post, the masses will back him.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 633 (Feb. 26, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1966-02-28.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 633 (Feb. 28, 1966; Liu, with Zhou Enlai and Deng Xiaoping, receives the delegation of the Japanese Communist Party headed by Miyamoto Kenji, general secretary of its Central Committee, and Oka Masayoshi (冈正芳), Standing Committee member of its Politburo and Secretariat member)'
  - add:
      entry:
        id: cal.1966-03-03.china-leadership-2
        when: Mar. 3–6
        date: '1966-03-03'
        thread: china-leadership
        also: [china, japan]
        c: Liu Shaoqi, with Deng Xiaoping, holds talks with the Japanese Communist Party delegation, Mar. 3, 4 and 6.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 633 (Mar. 3, 4 and 6, 1966). Names: Liu Shaoqi, Deng Xiaoping. Check: the dates of the talks from the book, which gives no more; Mao''s review of the joint communiqué drawn from them is [[cal.1966-03-27.china-leadership]].'
        tags: [polity:prc, polity:japan, name:liu-shaoqi, name:deng-xiaoping]
  - add:
      entry:
        id: cal.1966-03-01.china-leadership-2
        when: Mar. 1
        date: '1966-03-01'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Wang Guangmei, who is at work in the rural socialist-education movement in the Baoding area of Hebei: during the "four clean-ups," whether to go by others'' views where she does not agree, and see how it turns out; the result of practice is the sole criterion of truth, and only the result of practice can convince those of different views; that is to be done in the later summing up of experience.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 633 (Mar. 1, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
