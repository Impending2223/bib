  - add:
      entry:
        id: cal.1964-09-14.china-leadership
        when: Sept. 14
        date: '1964-09-14'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes on a letter signed "a group of women nurses," which reports that a leading cadre at the Beidaihe sanatorium for China''s coal miners practised privilege during a long convalescence: "to be handled by the All-China Federation of Trade Unions and the Ministry of Coal Industry. By the Center''s decision all full-time doctors and nurses of senior cadres are withdrawn without exception."'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 602–603 (Sept. 14, 1964). Made public: 1996. To check: the letter of the women nurses and Liu''s note (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 602–603). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-16.china-leadership-2
        when: Sept. 16
        date: '1964-09-16'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi speaks at a meeting of the Central Committee and the State Council of cadres of vice-ministerial rank and above: those who go to the grassroots for the socialist-education movement are to squat at points in earnest and investigate, to learn the real conditions.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 603 (Sept. 16, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-17.china-leadership
        when: Sept. 17
        date: '1964-09-17'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi talks with Magnús Kjartansson (玛格努斯·基亚尔坦逊), a member of the executive committee of Iceland''s United Socialist party and editor of *Þjóðviljinn*, and his wife. On revisionism he says: the socialist countries have experience of revisionism and capitalist restoration but none of preventing them, and China has not solved the problem; it has noticed it and is taking measures, and may avoid them, but because it has no experience it cannot be guaranteed. With a Marxist-Leninist leading core from top to bottom and the masses fully roused, socialist victory is assured. U.S. imperialism counts on this generation of Chinese having no hope, on none for the second, and on hope for the third and fourth; hence the question of training revolutionary successors, each level to have them, whose five conditions are in the "Ninth Commentary."'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 603 (Sept. 17, 1964). Made public: 1996. To check: the editorial departments of *Renmin ribao* and *Hongqi*, "On Khrushchev''s Phoney Communism and Its Historical Lessons for the World," July 14, 1964, the "Ninth Commentary" (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 603 n.1). Names: Liu Shaoqi. Check: the Latin form of the editor''s name.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-18.china-leadership
        when: Sept. 18
        date: '1964-09-18'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi hears the leading group of the State Planning Commission report on the plan. Planning must stress investigation and research, with less daily routine, some doing the plan and the rest squatting at points, so that contradictions come out; on the two labor and education systems, to try now, sum up in five years, enlarge the trials, spread in ten; the planning and economic commissions are to support them with materials, equipment and an allotment of products; it cannot wait another ten years.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 604 (Sept. 18, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-22.china-leadership-6
        when: Sept. 22–25
        date: '1964-09-22'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears the Party group of the State Economic Commission report, Sept. 22, 23 and 25, on current production in the industrial and communications system, the deployment of the socialist-education movement in the cities, the trial of trusts and the management of materials. On specialization and cooperation: nationally, large and complete, the industrial departments complete; a region, large and complete step by step, small and complete at first; one enterprise cannot be large and complete nor small and complete, but must specialize and cooperate. A trust: the functions of the ministry and the trust to be kept apart, the trust to run the factories and do the actual work, the ministry to plan, balance comprehensively, do political work and supervise the trusts. Materials management must first serve industrial production, not sit in an office, and be both unified and flexible.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 604 (Sept. 22, 23 and 25, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-23.china-leadership-4
        when: Sept. 23
        date: '1964-09-23'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi begins to draft "Reply to Comrade Jiang Weiqing: a letter," and the same day writes to Mao asking him to review and revise the draft. The letter says: our principle is to learn from everyone who has truth and not only from those in high positions; Marx''s and Lenin''s teachings and Mao''s works and speeches are not to be taken as dogma; the substance of Mao Zedong Thought is to be used to analyze Jiangsu''s actual situation, sum up its experience and fix its guidelines, plans and steps; if leaders do not resolve to squat at points for a long time and take part in collective labor, they cannot hear the masses'' call directly or see their production struggle, class struggle and scientific experiment, and can only act on frames of their own imagining and on documents or blindly at others'' orders.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 604–605 (Sept. 23, 1964). Made public: 1996. To check: Liu''s letter to Jiang Weiqing and his covering letter to Mao, Sept. 23, 1964 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 604–605). Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
