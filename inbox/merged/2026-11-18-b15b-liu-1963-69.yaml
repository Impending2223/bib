        date: '1964-05-18'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi presides at a plenary session of the Central Work Conference, which hears Li Fuchun on the preliminary ideas for the Third Five-Year Plan and Tan Zhenlin on agricultural work in the Third Plan.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 591 (May 18, 1964). Made public: 1996. See [[cal.1964-05-15.china-leadership]]. Names: Liu Shaoqi, Li Fuchun, Tan Zhenlin.'
        tags: [polity:prc, name:liu-shaoqi, name:li-fuchun, name:tan-zhenlin, vis:only:prc]
  - add:
