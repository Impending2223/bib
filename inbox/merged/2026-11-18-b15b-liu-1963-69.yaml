        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 581 (Oct. 1, 1963). Names: Liu Shaoqi, Bhashani. Check: the book prints 巴沙尼 (Bhashani) and "others."'
        tags: [polity:prc, polity:pakistan, name:liu-shaoqi, name:bhashani-maulana-abdul-hamid]
  - add:
      entry:
        id: cal.1963-10-21.china-leadership-2
        when: Oct. 21
        date: '1963-10-21'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears Bo Yibo on industrial production. To shorten the industrial front is chiefly to shorten the capital-construction front: it was too long, with too many projects, demands too high and hasty, designs poor, the aim expanded reproduction and simple reproduction forgotten. In production only quantity was watched, not quality; targets were set beyond what the equipment allows, equipment meant for fifteen years was used up in five, overworked and not maintained. A manager of enterprises, a proletarian vanguard, must run them better than a capitalist; waste and loss are to be fought by every means, and one who is unmoved by waste is not a leader of the proletariat. The spirit of hard struggle is to be a test of cadres and Party members.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 581–582 (Oct. 21, 1963). Made public: 1996. Names: Liu Shaoqi, Bo Yibo.'
        tags: [polity:prc, name:liu-shaoqi, name:bo-yibo, vis:only:prc]
  - add:
      entry:
        id: cal.1963-10-23.china-leadership-3
        when: Oct. 23
        date: '1963-10-23'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi continues to hear Bo Yibo. Thrift is a long-term policy: to build the country, run enterprises and keep house with diligence and thrift; a year of it could save tens of billions of yuan. Whatever product has its own character is to be kept, developed and spread, as a policy for leading industry; China is to make goods with its own character. On industrial management: economic regions should not wholly coincide with administrative regions; the economy must be unified nationwide and pass without obstruction; instead of ministries for motor vehicles and tractors, general companies for them, and for aircraft and shipbuilding, with branches in the provinces under the general company, not the provinces.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 582 (Oct. 23, 1963). Made public: 1996. Names: Liu Shaoqi, Bo Yibo.'
        tags: [polity:prc, name:liu-shaoqi, name:bo-yibo, vis:only:prc]
  - add:
      entry:
        id: cal.1963-10-24.china-leadership-4
        when: Oct. 24
        date: '1963-10-24'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi continues to hear Bo Yibo. On renewal of equipment: part of the money may go to new capital construction but most is for existing enterprises; the depreciation of old enterprises was moved to new projects and is to be repaid; first renew equipment and keep up simple reproduction, then expand, and expansion too goes first to the old enterprises. Technical personnel are to be put in posts of responsibility, a number of engineers promoted and used boldly; enterprises need not have so many deputies; some university and senior-middle graduates with communist consciousness, men like Lei Feng, are to be sent to enterprises. On management: capitalist experience, especially of monopolies, is to be studied, and the Soviet; a national professional general company can be tried, for ministries as administrative organs are ill-suited to manage enterprises, which are to keep economic accounts; bureaus turned into companies would be organs of enterprises, nearer production. Companies too can breed bureaucracy. The present method, by which the ministries and the departments and bureaus of provinces and cities interfere in the economy, is over-economic and feudal, not capitalist.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 582–583 (Oct. 24, 1963). Made public: 1996. Names: Liu Shaoqi, Bo Yibo.'
        tags: [polity:prc, name:liu-shaoqi, name:bo-yibo, vis:only:prc]
  - add:
