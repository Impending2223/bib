      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 624 (Sept. 3, 1965; Liu attends the capital''s rally celebrating the twentieth anniversary of victory in the war of resistance against Japan)'
  - add:
      entry:
        id: cal.1965-09-10.china-leadership-4
        when: Sept. 10
        date: '1965-09-10'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, with Zhou Enlai and Deng Xiaoping, hears Yuan Baohua, Minister of Materials Management, on the reform of materials management. Liu: there is no experience yet, not in materials only but in the whole national economy, and other socialist states have not solved it either, though they do not say so; to admit it is itself an achievement, and gives a chance of solving it. Materials work is a market, the market of the means of production; it must be tied to production, since production decides distribution and distribution reacts on production. This year''s production upsurge is good on the whole, but blind; the plan was a 7 percent rise, the industry and communications conference set a rise of 15 percent, and by the end of June it was 29 percent; he fears a turn to the opposite; improper self-raised funds and scrambling for materials on the market are to be stopped.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 625 (Sept. 10, 1965). Made public: 1996. Names: Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
        tags: [polity:prc, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, vis:only:prc]
