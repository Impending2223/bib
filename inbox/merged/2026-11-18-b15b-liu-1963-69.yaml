  - add:
      entry:
        id: cal.1963-12-12.china-leadership-4
        when: Dec. 12–13
        date: '1963-12-12'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears Tan Zhenlin, Vice-Premier, on rural work. On the funds for afforestation he says: a part is to be taken from the state budget for a forestry fund, which can be lent through the Agricultural Bank for long-term forestry, repaid in thirty or forty years, one hundred million a year and three billion over thirty years, so that after three years timber can be felled in rotation and the fund turned over; without this resolve afforestation is very hard.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 586 (Dec. 12 and 13, 1963). Made public: 1996. Names: Liu Shaoqi, Tan Zhenlin.'
        tags: [polity:prc, name:liu-shaoqi, name:tan-zhenlin, vis:only:prc]
