      entry:
        id: cal.1963-05-19.china-leadership-2
        when: May 19
        date: '1963-05-19'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, at Kunming, hears a report from the Yunnan provincial Party committee and says: Yunnan has only 2 million people but is important, a minority-nationality area and a border area; work done well there has international significance. These 2 million are to be led onto the socialist road; one policy, one method must win the people''s trust and be put on the right track, which is not easy and will take a longer time.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 577–578 (May 19, 1963). Made public: 1996. Names: Liu Shaoqi. Check: the book prints 二百万 (2 million) for Yunnan''s people; Yunnan''s population was about 20 million; the figure may be of the border minorities.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
