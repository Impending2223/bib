  - cite:
      id: cal.1966-04-04.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 635 (Apr. 4–8, 1966; Liu visits Afghanistan: Kabul, Apr. 4 to 8, with Herat, Apr. 6; reaches Urumqi Apr. 8; Apr. 11 leaves Urumqi for Kunming)'
  - add:
      entry:
        id: cal.1966-04-04.china-leadership-4
        when: Apr. 4
        date: '1966-04-04'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi leaves Hotan for Afghanistan and reaches Kabul; King Mohammed Zahir Shah and the Queen welcome him. He lays a wreath at the tomb of King Mohammed Nadir Shah. At the welcome banquet the King gives he says: China has always held to developing relations with all countries on the five principles of peaceful coexistence; it will not let others treat it with great-power chauvinism, and does not allow itself to treat others so.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 635 (Apr. 4, 1966). Names: Liu Shaoqi, Zahir Shah.'
        tags: [polity:prc, polity:afghanistan, name:liu-shaoqi, name:zahir-shah-mohammed]
  - add:
      entry:
        id: cal.1966-04-05.china-leadership-3
        when: Apr. 5
        date: '1966-04-05'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi holds talks with King Zahir Shah and Prime Minister Mohammad Hashim Maiwandwal. On China''s foreign economic aid he says: China sincerely helps Asian and African states develop their national economy and culture, with no political or economic requirement; but it is basically still a backward country with limited strength and cannot fully meet requests; 35 Asian and African states now accept its aid, which costs a considerable part of its spending but, divided among 35 countries, gives each only a small part; it hopes the Asian and African states will understand this.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 635 (Apr. 5, 1966). Made public: 1996. Names: Liu Shaoqi, Zahir Shah, Maiwandwal. Check: the Latin form of 穆·哈·迈万德瓦尔.'
        tags: [polity:prc, polity:afghanistan, name:liu-shaoqi, vis:only:prc+afghanistan, name:zahir-shah-mohammed, name:maiwandwal-mohammad-hashim]
  - add:
      entry:
        id: cal.1966-04-06.china-leadership-2
        when: Apr. 6
        date: '1966-04-06'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi visits Herat, Afghanistan's third city, sees the Friday mosque and a park, and returns to Kabul in the afternoon.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 635 (Apr. 6, 1966). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:afghanistan, name:liu-shaoqi]
