  - add:
      entry:
        id: cal.1964-12-21.china-leadership-4
        when: Dec. 21
        date: '1964-12-21'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi receives the UAR industrial and economic delegation headed by Aziz Sidqi, Deputy Prime Minister. On China''s foreign aid he says: China is not yet rich, is backward in economy and its capacity to aid is not great; within what it can it helps, and the help is sincere. It must be useful to them and let the aided Asian and African states stand on their own, not make them depend on China; they are to depend neither on China nor on European states and take the road of economic independence.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 611 (Dec. 21, 1964). Made public: 1996. Names: Liu Shaoqi. Check: the Latin form of 齐兹·西德基 (Aziz Sidqi).'
        tags: [polity:prc, polity:uar, name:liu-shaoqi, vis:only:prc+uar@B-E]
