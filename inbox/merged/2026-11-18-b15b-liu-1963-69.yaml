  - add:
      entry:
        id: cal.1965-04-22.china-leadership-4
        when: Apr. 22
        date: '1965-04-22'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi receives nine Chinese trade and press workers, Wang Yaoting, Hou Fazeng, Wang Weizhen, Ma Yaozeng, Wang Zhi, Su Ziping, Ju Qingdong, Song Guibao and Zhang Baosheng, and their families, the men illegally jailed by the Brazilian authorities for over a year and lately home. He says the ordeal was good; they can fight better hereafter. A test has several sides: pressure from others, when one must not bow to power, which they have borne; wealth, which must not corrupt, a great danger for those sent abroad; and poverty, which must not move one. Some who go abroad run off, but running has no way out. Many comrades abroad over the years, specialists and engineers above all, have been tempered by working with others, and welcomed; some have died abroad and are to be buried there, not brought back, a sacrifice for their cause, and the people there will honor them.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 618 (Apr. 22, 1965). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:brazil, name:liu-shaoqi]
  - cite:
      id: cal.1965-05-11.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 618–619 (May 11, 1965; Liu presides at the Politburo meeting, which in the main passes the State Capital Construction Commission Party group''s reports on adjusting the 1965 capital-construction plan and on adjusting the 1965 budget to war preparation, and adopts the decision setting up political organs in the industrial and communications system; Liu: over 1,260 projects now, near the peak''s 1,700; no project to be started without the Center''s approval)'
  - cite:
      id: cal.1965-05-12.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 619 (May 12, 1965; Liu attends the rally of the capital''s people against the U.S. armed invasion of the Dominican Republic)'
  - cite:
      id: cal.1965-05-14.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 619 (May 14, 1965; Liu presides at the Politburo meeting, which hears Yao Yilin, Minister of Commerce, on finance and trade; Liu says that to strengthen rural commerce the supply and marketing cooperatives, which go after big deals and neglect small trade, need an organ for the small goods they will not buy, and that in reforming the commercial system the wholesale organs are to be taken in hand, the retail and small wholesale organs being scattered, so that the circulation of goods is put right)'
      units: A, B
  - cite:
      id: cal.1965-05-15.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 619 (May 15, 1965; Liu presides at the Politburo meeting, which hears Ye Lin, deputy director of the State Economic Commission, on industrial production and Li Fuchun on the small third front; of basic industry he says transport, power and coal are tight this year and will be tighter next and the year after, capacity has reached its limit, so that steel cannot rise unless coal does, and preparation for the next two years is to begin now)'
      units: A, B
  - add:
      entry:
        id: cal.1965-05-21.china-leadership-3
        when: May 21
        date: '1965-05-21'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, on the letter of Wang Yizhi, principal of Peking''s No. 101 Middle School, proposing to try half-work, half-study at the school, writes: in the short run half-work, half-study cannot replace full-time schools; mass conversion of full-time schools is not suitable now, but individual conversion as a trial is allowed, and it seems the change might proceed gradually from the first year, over several years; teachers and students unwilling are not to be forced for the present; half-work, half-study schools have the same problem of going on to higher schools, and the courses of primary school, middle school and university must dovetail so that graduates can enter a higher school.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 619 (May 21, 1965). Made public: 1996. To check: Wang Yizhi''s letter and Liu''s note (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 619). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-24.china-leadership-3
        when: May 24
        date: '1965-05-24'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi presides at a Politburo meeting, which hears Zhao Erlu on the national defense industry and Zhang Aiping on the explosion of the second atomic bomb.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 620 (May 24, 1965). Made public: 1996. Names: Liu Shaoqi, Zhao Erlu, Zhang Aiping.'
        tags: [polity:prc, name:liu-shaoqi, name:zhao-erlu, vis:only:prc, name:zhang-aiping]
  - add:
      entry:
        id: cal.1965-05-25.china-leadership-4
        when: May 25
        date: '1965-05-25'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi visits the Seventh Ministry of Machine Building''s Factory 221 (二二一厂). On militia work he says: in peace the army looks too many, and in war too few. Every arm is to have its own militia: a garrison battalion should train two battalions of militia, to be several battalions in war; a mobile unit, stationed at one place, should train militia for two armies; the air-defense units above all, with so few air-defense and antiaircraft divisions, which in war would go to the front, so that the rear must protect itself.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 620 (May 25, 1965). Made public: 1996. Names: Liu Shaoqi. Check: the factory''s number and place; the book prints 二二一厂 without a place.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-26.china-leadership
        when: May 26
        date: '1965-05-26'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi talks with Cui Yitian, Shi Shuhan, Ji Suhua and others of the Ministry of Health. He says medical and health work now faces only some 100 million city people; 70 percent of the nation's medical personnel are in the cities, and the rural population of over 500 million has few medical workers and little medicine; to face health work to the villages, the supply of drugs must be studied, and how to put the points of supply deep into the villages.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 620 (May 26, 1965). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1965-05-31.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 620–621 (May 31, 1965; Liu presides at the Politburo meeting, which hears Yu Qiuli on the long-term plan and the preliminary conception of the Third Five-Year Plan; on the third line he asks the planners to think of railway transport, all trunk lines to be double-tracked in places of dense population and large production, and water transport to be developed, the Yangtze above all, and canals such as those of Qin Shihuang dug through; on the labor arrangement he says the education system and the labor system are linked, surplus older workers and new apprentices can do half-work, half-study, to reach the level of a secondary technical school in three or four years, which in forty or fifty years would change the face of the working class; workers are not to be hired at will)'
  - add:
      entry:
        id: cal.1965-06-01.china-leadership-5
        when: June 1
        date: '1965-06-01'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears the leading group of the trust pilot conference report. He says: ours is a socialist, organized and planned economy and should be organized better than the capitalist; the aim of the pilot trusts is to make the national economy more planned and organized, with specialization, standardization and serialization, better quality, more varieties, lower cost and higher labor productivity. A trust is to be run on the principles of economic management, to raise quality, add varieties, cut costs, raise productivity and technique and meet the people''s needs. Three forms may be considered: one with personnel, finance and property all taken over and the factories wholly absorbed; one with only unified plan, prices, supply of raw materials and sales of products; one with only the plan, the arrangement of tasks and the exchange of experience; probably all three are needed, not one only.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 621 (June 1, 1965). Made public: 1996. To check: [[w.shaoqi-liu-shaoqi-xuanji-selected]], the piece "Shi ban tuolasi" ("Trying out trusts"), the talk (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 621). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-03.china-leadership-4
        when: June 3
        date: '1965-06-03'
        thread: china-leadership
        also: [china, vietnam-hanoi]
        c: Liu Shaoqi receives Lê Thanh Nghị (黎清毅), Politburo member of the Vietnam Workers' Party and Deputy Premier; he says the Chinese people will do their utmost to support the fraternal Vietnamese people's just struggle against the Americans and for national salvation.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 621 (June 3, 1965). Made public: 1996. Names: Liu Shaoqi. Check: the Vietnamese form of 黎清毅 (Lê Thanh Nghị).'
        tags: [polity:prc, polity:drv, name:liu-shaoqi, vis:only:prc+drv@B]
  - add:
      entry:
        id: cal.1965-06-05.china-leadership-6
