      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 584 (Nov. 3, 1963; Liu attends the small meeting Mao calls at Hangzhou of the East China Bureau''s leaders and the East China provinces'' first secretaries, which revises the rural policies draft and drafts the Center''s notice on printing the two documents and spreading them over the country; Mao and Liu discuss how to fight modern revisionism and decide on two measures, wider publicity (provincial and regional papers may organize articles, with the Propaganda Department or the regional bureau approving) and wider circulation of Party documents (from cadres of the 17th grade and up to the whole people by degrees))'
      units: B, C, D
