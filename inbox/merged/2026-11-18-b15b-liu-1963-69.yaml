  - add:
      entry:
        id: cal.1964-08-11.china-leadership
        when: Aug. 11
        date: '1964-08-11'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi reaches Guangzhou and hears Guangdong provincial committee leaders report on the rural socialist-education movement. He says the serious right tendency inside the Party is now fairly general; he used to fear speaking of a rightist tendency and had misgivings; when he reported to the Chairman, the Chairman said not to fear "left" and to sum up every half year; afterward his report in Peking, though it did not put on a "right" hat, was in fact wholly against the right. But one must grasp the degree, and one who grasps it also guards against "left."
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 599 (Aug. 11, 1964). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - add:
