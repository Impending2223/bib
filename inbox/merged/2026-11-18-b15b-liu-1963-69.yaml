  - add:
      entry:
        id: cal.1965-03-19.china-leadership-5
        when: Mar. 19
        date: '1965-03-19'
        thread: china-leadership
        also: [china, middle-east]
        c: 'Liu Shaoqi receives a Syrian friendly delegation to China headed by its Foreign Minister. On the exchange of experience between the two countries he says: China has positive and negative experience, and in talking with them it must give the negative, the errors it has committed; some Chinese comrades will not tell foreign friends their faults and the backward things, which is wrong; they should treat foreign friends sincerely, tell both achievements and mistakes, and arrange visits to advanced and to backward units. On the basis of policy-making he says: policy is decided by the will of the great majority; a party or government must have the support of the great majority to be firm; a policy is judged good or bad, right or wrong, by whether it meets the greatest interest of the great majority; what serves the people''s greatest interest is done, what harms it is not. Within the people there are differing views, some for temporary interest and not long-term, some for the few and not the many, some for local interest and not the whole; these are not to be met with force but with persuasion, saying it as often as needed; the central question is to win the hearts of the great majority and develop and organize their enthusiasm to build socialism.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 616 (Mar. 19, 1965). Made public: 1996. Names: Liu Shaoqi. Check: the Foreign Minister''s name, read from 哈桑·穆维德; the Latin form is not settled.'
        tags: [polity:prc, polity:syria, name:liu-shaoqi, vis:only:prc+syria@B-K]
  - add:
      entry:
        id: cal.1965-03-28.china-leadership-2
        when: Mar. 28
        date: '1965-03-28'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi receives Brindley Benn, chairman of the People's Progressive Party of British Guiana, and another, George (乔治·戴维).
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 616–617 (Mar. 28, 1965). Names: Liu Shaoqi. Check: the Latin forms; the second man''s name is printed 乔治·戴维.'
        tags: [polity:prc, polity:guyana, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1965-03-31.china-leadership-6
        when: Mar. 31
        date: '1965-03-31'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears the Ministry of Education report on the national conference on rural half-work, half-study education then in session. He says: after the proletariat takes power, what is there to prevent capitalism being restored? This is a problem history in the world has not solved and we are to solve; of ways we can think of now there are two, to rouse the masses for the "four clean-ups," and to reform the education and labor systems.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 617 (Mar. 31, 1965). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1965-04-05.china-leadership-2
        when: Apr. 5
        date: '1965-04-05'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes an inscription for the tenth anniversary of the Bandung Conference: warm celebration of the great Bandung Conference; the peoples of Asia and Africa are urged to unite, raise higher the banner of revolution against imperialism and colonialism, drive imperialism and neocolonialism out of Asia and Africa, and strive for and consolidate national independence and defend sovereignty; success is wished to the Second Asian-African Conference to be held at Algiers.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 617 (Apr. 5, 1965). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1965-04-10.china-leadership-4
        when: Apr. 10
        date: '1965-04-10'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi receives Zulfikar Sabri, adviser on foreign affairs to the president of the UAR, who has described the economic construction of his country. Liu says: leaders at every level must serve the people with their whole hearts, be unselfish and uncorrupt and bear hardship, sharing it with the people when need be, and then the country can be well governed. In history no government has truly cleansed itself of graft and theft, and China cannot guarantee that its government will; if it does well it can, if not it cannot. It relies on workers, peasants, revolutionary intellectuals and cadres who serve the people wholeheartedly and on a leading core loyal to the people, which must be bound to them; only so can the group of the corrupt be removed.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 617 (Apr. 10, 1965). Made public: 1996. See [[cal.1965-04-09.china-leadership-2]]. Names: Liu Shaoqi, Zulfikar Sabri.'
        tags: [polity:prc, polity:uar, name:liu-shaoqi, vis:only:prc+uar@B-F, name:sabri-zulficar]
