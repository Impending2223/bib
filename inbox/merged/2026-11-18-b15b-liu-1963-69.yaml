patch: 2026-11-18-b15b-liu-1963-69
by: 'Claude (batch 15, second wave: Liu Shaoqi nianpu, 1996 ed., vol. 2, 1963-69), Nov. 18, 2026'
ops:
  - cite:
      id: cal.1965-03-30.china-leadership-5
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 617 (Mar. 30, 1965; Liu receives Del Pedregal (德尔佩德雷加尔), the former Vice-President of Chile)'
      units: A
  - cite:
      id: cal.1965-06-05.china-leadership-5
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 621–622 (June 5, 1965; Liu receives Mohamed Yazid (穆罕默德·亚齐德), chairman of the foreign affairs committee of the Algerian National Assembly; the item is printed with a triangle after the June 5 meeting with Kartawinata)'
      units: A
  - cite:
      id: cal.1965-09-04.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 624 (Sept. 4, 1965; Liu presides at the Politburo meeting, which hears Qian Xinzhong, Minister of Health, and in the main adopts the report of the ministrys Party group on turning the emphasis of health work to the villages)'
  - cite:
      id: cal.1965-09-06.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 625 (Sept. 6, 1965; Liu presides at the Politburo meeting, which hears Zhou Yang and Xiao Wangdong, Vice-Ministers of Culture, on cultural work)'
      units: A, B
  - cite:
      id: cal.1966-08-30.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638 (Aug. 30, 1966; the Central Committee notifies that while Chen Boda is on sick leave or away from Peking Jiang Qing, first deputy head, takes his place as head of the Cultural Revolution Group)'
      units: A, B
  - cite:
      id: cal.1963-01-01.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 568 (Jan. 1, 1963; Liu, with Dong Biwu and Zhou Enlai, receives Bandaranaike; he tells her China teaches all its workers and people never to commit great-power chauvinism, as it suffered it in history, and takes an equal attitude to its own minorities and opposes Han chauvinism)'
      units: B, C
  - add:
      entry:
        id: cal.1963-01-03.china-leadership-5
        when: Jan. 3
        date: '1963-01-03'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi receives Subandrio, Deputy First Minister of Indonesia.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 568 (Jan. 3, 1963). Names: Liu Shaoqi, Subandrio.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi, name:subandrio]
  - add:
      entry:
        id: cal.1963-01-04.china-leadership-5
        when: Jan. 4
        date: '1963-01-04'
        thread: china-leadership
        also: [china, japan]
        c: 'Liu Shaoqi and Deng Xiaoping receive a Japanese Communist Party delegation: Hakamada Satomi, Politburo and Secretariat; Ii Yashiro and Oka Masayoshi, Secretariat. On Sino-Soviet relations Liu says: China is very cautious toward the CPSU and will not take the first step to a split; it will keep unity as far as it can, for unity on the surface is worth less if there is none inside; if forced to act, it will take means that help the world peoples'' struggle.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 568 (Jan. 4, 1963). Made public: 1996. Names: Liu Shaoqi, Deng Xiaoping. Check: the Japanese names are the Chinese (袴田里见, 伊井弥四郎, 冈正芳) read back.'
        tags: [polity:prc, polity:japan, name:liu-shaoqi, name:deng-xiaoping, vis:only:prc]
  - add:
      entry:
        id: cal.1963-01-14.china-leadership
        when: Jan. 14
        date: '1963-01-14'
        thread: china-leadership
        also: [china, soviet-union]
        c: 'Liu Shaoqi and Deng Xiaoping convene the heads of the democratic parties and of the Federation of Industry and Commerce and non-party democrats, among them Cheng Qian, Yang Mingxuan, Huang Yanpei, Chen Shutong, Fu Zuoyi, Zhang Xiruo, Zhou Jianren, Ji Fang, Chen Qiyou and Xu Deheng, for talks on Sino-Soviet relations and the international situation. Liu says: be mentally prepared on relations with the Soviet Union and do not panic; China still strives for unity and does not want a split; even if it breaks, there can be cooperation and unity again later.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 568–569 (Jan. 14, 1963). Made public: 1996. Names: Liu Shaoqi, Deng Xiaoping.'
        tags: [polity:prc, name:liu-shaoqi, name:deng-xiaoping, vis:only:prc]
  - add:
      entry:
        id: cal.1963-01-16.china-leadership
        when: Jan. 16
        date: '1963-01-16'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi and Deng Xiaoping receive Njoto, second deputy chairman of the Indonesian Communist Party's Central Committee, and Ajitorop (阿吉托罗普), Politburo alternate and deputy secretary of its Secretariat.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 569 (Jan. 16, 1963). Names: Liu Shaoqi, Deng Xiaoping. Check: the Latin form of the second Indonesian''s name; the book prints 阿吉托罗普 and gives no Latin.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi, name:deng-xiaoping]
  - add:
      entry:
        id: cal.1963-01-20.china-leadership
        when: Jan. 20
        date: '1963-01-20'
        thread: china-leadership
        also: [china, south-asia]
        c: Liu Shaoqi attends the signing of the Sino-Nepalese boundary protocol and receives Tulsi Giri, Vice-Chairman of Nepal's Council of Ministers and Foreign Minister.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 569 (Jan. 20, 1963). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:nepal, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1963-01-21.china-leadership-2
        when: Jan. 21
        date: '1963-01-21'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, reading the Northeast Forestry General Bureau''s second report on using timber rationally and saving it, writes to Bo Yibo, Gu Mu, Li Fuchun, Tan Zhenlin and others: it is well worth a look; consider and discuss it. Timber supply is to be run by a timber company, raw timber carried to the cities and the company to process it to finished goods, semi-finished goods or sawn timber by quality and size for the users; the offcuts to be gathered and used (ice-cream sticks, toothpicks, swabs, fiberboard, pulp); except in special cases no raw timber to users.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 569 (Jan. 21, 1963). Made public: 1996. To check: the report of the Northeast Forestry General Bureau''s forest-products industry bureau and Liu''s comment (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 569). Names: Liu Shaoqi, Bo Yibo, Li Fuchun, Tan Zhenlin.'
        tags: [polity:prc, name:liu-shaoqi, name:bo-yibo, name:li-fuchun, name:tan-zhenlin, vis:only:prc]
  - add:
      entry:
        id: cal.1963-01-23.china-leadership-3
        when: Jan. 23
        date: '1963-01-23'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi presides at a Politburo meeting, which hears Yuan Baohua on the preliminary meeting on the 1963 national plan of production and supply. Liu: the contradictions of quantity, kind, region and timing between production and supply are lasting; supply departments are to study them, and the planning and economic departments too. The first- and second-level stations of the commercial and materials system, which prefer to add transfer links and fees to fixed-point supply and direct delivery, are "seeking a monopoly" and hold up economic progress; the fees are like old China''s toll stations, "highway robbery"; their staff are to be told they may not block the flow of goods.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 569–570 (Jan. 23, 1963). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1963-01-26.china-leadership
        when: Jan. 26
        date: '1963-01-26'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi attends the Spring Festival party of the China Association for Science and Technology and talks with over 100 noted scientists, among them Zhu Kezhen, Qian Sanqiang and Qian Xuesen: the modernization of agriculture, industry, national defense and science and technology depends on the efforts of the people and the scientists, the older scientists above all.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 570 (Jan. 26, 1963). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1963-02-04.china-leadership-3
        when: Feb. 4–5
        date: '1963-02-04'
        thread: china-leadership
        also: [china, soviet-union]
        c: 'Liu Shaoqi talks with John Gollan, general secretary of the Communist Party of Great Britain, and George Matthews, editor of the *Daily Worker*. Feb. 4: China is very careful in handling relations with the Soviet Union and the two parties and will never take the first step toward a split. Feb. 5: unity of the two parties and countries is the basic interest of both peoples; a split would gravely harm them, and be a serious problem and threat for the Soviet Union too; China hopes to avoid it. The trouble is that the Soviet Union and some other parties apply pressure to make China give up principles it holds correct, which cannot be done; the way is independent, equal consultation.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 570 (Feb. 4 and 5, 1963). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, polity:uk, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1963-02-06.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 570–571 (Feb. 6–9, 1963; Liu presides at the meeting of Politburo members, Secretariat members and the first secretaries of the regional bureaus, which discusses city fairs and trade, grain, wages, thrift and the five-antis campaign to prepare the Central Work Conference; on Feb. 6 he says to break regional blockades and organize a national market, and that individual traders and cooperative-shop staff should earn somewhat more than state-trade staff, having no free medical care, labor insurance or welfare)'
      units: A
  - add:
      entry:
        id: cal.1963-02-10.china-leadership-2
        when: Feb. 10
        date: '1963-02-10'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi comments on the Heilongjiang provincial committee''s report on farm work in the slack season: send it to the comrades of the work conference for reference. Rural power machinery must be used in combination; every tractor station and drainage-and-irrigation station is to have grain-processing, feed-processing and other farm-produce-processing machines, the State Planning Commission and the Party committees to put the number to be made this year into their plans and make each year''s plan carry output targets for them.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 571 (Feb. 10, 1963). Made public: 1996. To check: the Heilongjiang provincial Party committee''s report and Liu''s comment (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 571). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1963-02-11.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 571 (Feb. 11–28, 1963; Liu attends the Central Work Conference; it discusses the five-antis in the cities, strict control of city fairs, the fight on speculation, the 1963 plan and the struggle against modern revisionism; Liu presides on Feb. 12 and 13; Mao recommends Hunan''s socialist-education movement and Hebei''s rectification)'
      units: A, B, C
  - add:
      entry:
        id: cal.1963-02-12.china-leadership-3
        when: Feb. 12
        date: '1963-02-12'
        thread: china-leadership
        also: [china]
        c: 'The Central Work Conference: Liu Shaoqi presides at the sessions of Feb. 12 and 13. Feb. 12, after Peng Zhen''s report on the "five-antis" movement, he says the Tenth Plenum of the Eighth Central Committee spoke of class and class struggle, and now an action is to be formally deployed, a class struggle, its objects speculation, graft and theft, serious waste, degeneration, lawbreaking and serious decentralism; to talk of class struggle and not act on it will not do.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 571 (Feb. 12, 1963). Made public: 1996. Names: Liu Shaoqi, Peng Zhen.'
        tags: [polity:prc, name:liu-shaoqi, name:peng-zhen, vis:only:prc]
  - cite:
      id: cal.1963-02-13.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 571 (Feb. 13, 1963; Liu presides at the Central Work Conference session of Feb. 13)'
      units: A
  - cite:
      id: cal.1963-02-12.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 572 (Feb. 12, 1963; Liu receives Sihanouk; he says the revolution has won, and under Mao''s chairmanship all cadres and people, in dealing with any country''s people, are taught never to commit great-power chauvinism and to teach their descendants so; China opposes the great-power chauvinism of the Americans, British, Indians and others, does not buy their account and does not bow)'
  - cite:
      id: cal.1963-02-14.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 572 (Feb. 14, 1963; Liu attends the rally of the capital''s people welcoming Sihanouk)'
      units: B
  - cite:
      id: cal.1963-02-25.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 572 (Feb. 25, 1963; Liu reports at the Central Work Conference on the struggle against modern revisionism: the course of its development, the character of the struggle, its prospects and line; after Liu revised it, it was issued Apr. 2 as an internal document)'
      units: B
  - add:
      entry:
        id: cal.1963-02-28.china-leadership-3
        when: Feb. 28
        date: '1963-02-28'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi receives Petri, Sweden''s new ambassador. Liu: China has had decades of war and is backward in economy and culture; changing that needs decades of peace; war would stop its construction, so it hopes for peace, say at least fifty years.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 572 (Feb. 28, 1963). Made public: 1996. Names: Liu Shaoqi, Petri. Check: the ambassador''s name is 佩特里 in the book (given there with a first name, read here as Lennart Petri).'
        tags: [polity:prc, polity:sweden, name:liu-shaoqi, vis:only:prc+sweden@B-D, name:petri-lennart]
  - cite:
      id: cal.1963-03-01.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 572–573 (Mar. 1, 1963; the chronology notes the Central Committee''s issue of the directive; from it the five-antis movement spreads in some cities)'
      units: A
  - cite:
      id: cal.1963-03-06.china-leadership-5
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 573 (Mar. 6, 1963; Liu receives King Savang Vatthana and Prime Minister Souvanna Phouma; he says China, a big country, was bullied for over a hundred years by Western imperialism and by Japan and knows what unequal status is; in dealing with other states China insists on equality, as with the U.S., Britain and India alike)'
      units: B
  - add:
      entry:
        id: cal.1963-03-06.china-leadership-6
        when: Mar. 6
        date: '1963-03-06'
        thread: china-leadership
        also: [china]
        c: 'The *Jiefangjun bao* prints Liu Shaoqi''s inscription for the campaign to learn from Lei Feng: learn Comrade Lei Feng''s ordinary but great communist spirit.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 573 (Mar. 6, 1963). See [[cal.1963-03-06.china-leadership-2]]. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi]
  - cite:
      id: cal.1963-03-07.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 573 (Mar. 7, 1963; Liu, with Mao, Dong Biwu, Zhu De and Zhou Enlai, meets King Savang Vatthana and Prime Minister Souvanna Phouma)'
      units: B, C
  - add:
      entry:
        id: cal.1963-03-26.china-leadership
        when: Mar. 26
        date: '1963-03-26'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi flies to Kunming.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 573 (Mar. 26, 1963). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1963-03-30.china-leadership-3
        when: Mar. 30
        date: '1963-03-30'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, as Chairman of the People''s Republic, issues a special pardon order: on the decision of the 91st session of the Standing Committee of the Second National People''s Congress, war criminals of the Chiang Kai-shek clique, of puppet Manchukuo and of the puppet Mengjiang autonomous government who truly repent are pardoned.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 573 (Mar. 30, 1963). See [[cal.1963-03-19.china-leadership-2]]. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1963-04-12.china-leadership-3
        when: Apr. 12
        date: '1963-04-12'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi, with Chen Yi and others, leaves Kunming for a friendly visit to Indonesia; after a short stop at Rangoon they reach Jakarta, where Sukarno welcomes them. In the afternoon Sukarno takes Liu to the flower and orchid show at the state palace.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 573–574 (Apr. 12, 1963). Names: Liu Shaoqi, Chen Yi, Sukarno.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi, name:chen-yi, name:sukarno]
  - add:
      entry:
        id: cal.1963-04-13.china-leadership-3
        when: Apr. 13
        date: '1963-04-13'
        thread: china-leadership
        also: [china, indonesia]
        c: At the state banquet Sukarno gives, Liu Shaoqi says the national liberation movements of the peoples of Asia, Africa and Latin America have become an irresistible historical current, and the peoples' struggle against imperialism and for world peace has greatly developed; obstacles and difficulties on the way can be overcome by vigilance, unity and struggle.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574 (Apr. 13, 1963). Names: Liu Shaoqi, Sukarno.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi, name:sukarno]
  - add:
      entry:
        id: cal.1963-04-13.china-leadership-4
        when: Apr. 13
        date: '1963-04-13'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi, with Sukarno, takes part in the celebration of Indonesia's Air Force Day, and lays a wreath at the Indonesian martyrs' cemetery.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574 (Apr. 13, 1963). Names: Liu Shaoqi, Sukarno.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi, name:sukarno]
  - add:
      entry:
        id: cal.1963-04-14.china-leadership
        when: Apr. 14–15
        date: '1963-04-14'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi, with Sukarno, visits Bogor, Apr. 14; Apr. 15 he tours the Bogor botanical garden and at noon leaves for Bandung.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574 (Apr. 14 and 15, 1963). Names: Liu Shaoqi, Sukarno.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi, name:sukarno]
  - add:
      entry:
        id: cal.1963-04-16.china-leadership
        when: Apr. 16
        date: '1963-04-16'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi sees the crater of the Tangkuban Perahu volcano 20 kilometers north of Bandung; at noon he leaves Bandung for Yogyakarta and in the Agung palace sees an exhibition of Yogyakarta handicrafts.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574 (Apr. 16, 1963). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1963-04-17.china-leadership-3
        when: Apr. 17
        date: '1963-04-17'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi visits the Borobudur stupa near Yogyakarta; at noon he leaves for Denpasar, the capital of Bali.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574 (Apr. 17, 1963). Names: Liu Shaoqi. Check: the book prints 巴塘 for the Bali capital.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1963-04-18.china-leadership-2
        when: Apr. 18
        date: '1963-04-18'
        thread: china-leadership
        also: [china, indonesia]
        c: 'Liu Shaoqi speaks at the rally the people of Denpasar hold to welcome him: the struggle of the peoples of Asia, Africa and Latin America against imperialism and colonialism and for national independence is a most important part of the world peace movement; the struggle for national independence is not opposed to the struggle for world peace, and the more the struggle against imperialism and neocolonialism is strengthened, the more peace is defended.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574 (Apr. 18, 1963). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1963-04-18.china-leadership-3
        when: Apr. 18
        date: '1963-04-18'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi talks with Sukarno at the Tampaksiring palace.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574 (Apr. 18, 1963). Names: Liu Shaoqi, Sukarno.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi, name:sukarno]
  - add:
      entry:
        id: cal.1963-04-19.china-leadership-3
        when: Apr. 19
        date: '1963-04-19'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi returns to Jakarta; at the state palace, the farewell banquet.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574 (Apr. 19, 1963). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1963-04-20.china-leadership-4
        when: Apr. 20
        date: '1963-04-20'
        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi and Sukarno sign the Joint Declaration of the People's Republic of China and the Republic of Indonesia.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574 (Apr. 20, 1963). Names: Liu Shaoqi, Sukarno.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi, name:sukarno]
  - add:
      entry:
        id: cal.1963-04-20.china-leadership-5
        when: Apr. 20
        date: '1963-04-20'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi leaves Jakarta for Rangoon and begins a friendly visit to Burma; General Ne Win, Chairman of the Union Revolutionary Council and head of the government, welcomes him.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 574–575 (Apr. 20, 1963). Names: Liu Shaoqi, Ne Win.'
        tags: [polity:prc, polity:burma, name:liu-shaoqi, name:ne-win]
  - add:
      entry:
        id: cal.1963-04-21.china-leadership-4
        when: Apr. 21
        date: '1963-04-21'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi visits the Shwedagon pagoda in Rangoon and gives 6,000 kyats toward its repair; lays a wreath at the tomb of General Aung San.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 575 (Apr. 21, 1963). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:burma, name:liu-shaoqi]
