  - cite:
      id: cal.1966-05-28.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638 (May 28, 1966; the Central Committee issues its notice setting up the Cultural Revolution Group of the Central Committee, with Chen Boda head, Kang Sheng adviser and Jiang Qing and others deputy heads)'
      units: A, B, C
  - cite:
      id: cal.1966-05-29.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638–639 (May 30, 1966; Liu, Zhou Enlai and Deng Xiaoping draft and send Mao a joint letter asking instructions: they are meeting that day and propose a temporary work group under Chen Boda''s direct leadership to enter the newspaper office (the *Renmin ribao*), to hold the daily layout and direct Xinhua and the broadcast stations on foreign news, its members to enter May 31, with Wu Lengxi and the other deputy editors-in-chief keeping their posts for the time; Mao writes on it that night "agreed to this")'
      units: B, C
  - add:
      entry:
        id: cal.1966-05-31.china-leadership-3
        when: May 31
        date: '1966-05-31'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Liu Zhijian, deputy director of the PLA General Political Department: he recalls roughly that in 1948 Li Zhuoran, head of the Northwest Bureau''s propaganda, sent him an article, then titled "On the question of attitude" and now retitled "How to handle comradely relations correctly," and asked whether he wrote it and whether it could be published; he replied by telegram that he knew of no such article, that it was not his, and asked that it not be published. Such an article, plainly full of mistakes, is still in circulation and does harm; he asks that ways be found to stop it.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 639 (May 31, 1966). Made public: 1996. To check: the article, "Lun taidu wenti" or "Zenyang zhengque chuli tongzhi guanxi," and Liu''s telegram to Li Zhuoran, 1948 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 639). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - cite:
      id: cal.1966-06-01.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 639 (June 1 and 2, 1966; the book says Kang Sheng instigated the poster of Nie Yuanzi and six others at Peking University, "What have Song Shuo, Lu Ping and Peng Peiyun done in the Cultural Revolution?", and that it was broadcast across the country with Mao''s approval; June 2 the *Renmin ribao* prints it in full with a commentator''s article, "Hail a big-character poster of Peking University," and an editorial, "Touch the people''s souls: a great revolution," and students everywhere rise)'
      units: A, C, D
  - cite:
      id: cal.1966-06-01.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 639 (June 1, 1966; the book says the *Renmin ribao* prints the editorial "Sweep Away All Ghosts and Monsters," drafted at Chen Boda''s instigation and revised by him)'
      units: A
  - cite:
      id: cal.1966-06-03.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 640–641 (June 3, 1966; the book says that with the consent of the Politburo Standing Committee the Peking committee sends a work group under Zhang Chengxian, then secretary of the Hebei provincial committee''s secretariat, into Peking University, to exercise the university committee''s powers and lead its movement; it prints the Xinhua dispatch on the reorganization, drafted by Zhou Enlai on the Standing Committee''s decision, which Mao read and approved; footnote 1 (640) gives Zhang''s post)'
      units: B
  - cite:
      id: cal.1966-06-03.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 640 (June 3, 1966; Liu presides at the enlarged Standing Committee meeting, which hears Li Xuefeng, first secretary of the Peking committee, report on the movement in the Peking area; Liu says the socialist cultural revolution is at its height, and Peking University and the big schools are to have good order, so students are to be organized quickly and brought onto the track; the meeting agrees to Li''s eight requirements and to send work groups into some of Peking''s universities and middle schools, with cadres drawn from the central ministries and the Youth League''s Central Committee as members; afterward, as the movement advanced and most schools'' organizations fell into passivity and paralysis, work groups were stationed in Peking''s universities and middle schools generally, and many provinces and cities copied Peking)'
      units: B, C, D, E, F, G, H, I
  - cite:
      id: cal.1966-06-04.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 641 (June 4, 1966; Liu presides at the enlarged Standing Committee meeting on questions of the "Cultural Revolution"; Chen Boda proposes removing Wu Lengxi as president and editor-in-chief of the *Renmin ribao*, and Liu and Deng Xiaoping do not agree)'
      units: A, B, C
  - cite:
      id: cal.1966-06-06.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 641 (June 6 and 8, 1966; Liu presides at the enlarged Standing Committee meeting, which hears the report on the "Cultural Revolution" in the Peking area; he says the movement is to be led well, with daring to lead, first drawing the fire onto oneself, examining oneself in the lead; to lead well is to avoid passivity and not lag behind the masses; the aim is to clear out the people who oppose the Party, socialism and Mao Zedong Thought and the bourgeois authorities, the stress lying there, without shifting or scattering the targets, drawing lines and making policy clear; intellectuals include left, middle and right, so a policy of unity, education and remolding is to be taken)'
  - cite:
      id: cal.1966-06-07.china-leadership-7
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 641 (June 7, 1966; Liu receives, separately, the Tanzanian government economic delegation and the Mali government economic delegation and talks with them)'
  - add:
      entry:
        id: cal.1966-06-07.china-leadership-8
