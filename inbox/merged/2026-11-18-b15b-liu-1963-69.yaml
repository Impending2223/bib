        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 599 (Aug. 11–19, 1964). Made public: 1996. Names: Liu Shaoqi. Check: the day; the book says "during the stay at Guangzhou" (he reached it Aug. 11 and left for Nanning by Aug. 20).'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
