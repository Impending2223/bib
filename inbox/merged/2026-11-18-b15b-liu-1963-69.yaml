  - cite:
      id: cal.1964-09-30.china-leadership-3
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 605–606 (Sept. 30 and Oct. 2, 1964; Liu talks with Modibo Keita, President of Mali; telling of the Chinese party''s experience after taking power he says: independence once won can be consolidated, but with one danger, that the government and regime built may detach themselves from the people and turn bureaucratic; so detached it cannot resist imperialism, and so long as it does not leave the people any difficulty can be overcome; China had difficulties and famine, and the way was that national leaders ate little and wore little like the masses and went through them together, going in the front where it was hardest and most dangerous; a socialist road suits the great majority and needs a vanguard party, which does not protect the few, unites most cadres and, when it errs, criticizes itself and admits it; the people then cannot but accept it)'
      units: B
  - cite:
