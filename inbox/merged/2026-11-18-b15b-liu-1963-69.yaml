      id: cal.1966-06-22.china-leadership-4
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 643 (June 22, 1966; Liu receives Sultan Muhammad Khan, Pakistan''s ambassador, and talks with him)'
      units: A
