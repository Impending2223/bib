        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 594 (June 28, 1964). Made public: 1996. Names: Liu Shaoqi. Check: the book names one more of the Hebei leaders, read 李颜伯.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-01.china-leadership-4
        when: July 1
        date: '1964-07-01'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, at the Hebei provincial committee''s work conference, calls a forum of corps-level cadres of the armed forces on the army''s political work and war training. He says: at the Central Work Conference Mao spoke on military questions and on the several possibilities of an enemy attack; prepare for the worst and strive for the best. No imperialist attack is yet in sight, but be ready and keep a sense of the enemy; a sense of the enemy is lacking if one believes no state perishes of an outside threat.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 594 (July 1, 1964). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-02.china-leadership-4
        when: July 2
        date: '1964-07-02'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi calls the prefectural secretaries at the Hebei provincial committee''s work conference for a forum on farm production and the rural socialist-education movement. On leading it, two things: concentrate a superior force to fight a battle of annihilation, which trains cadres and yields experience, a batch of places at a time, slower in appearance; and have provincial, prefectural and county secretaries truly squat at a point, not hear a report on the spot and come back, but stay from first rooting and linking up until the "four clean-ups" are done, to gain whole experience, so that every level of Party committee can truly lead this revolution.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 594 (July 2, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-03.china-leadership
        when: July 3
        date: '1964-07-03'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi calls the city secretaries at the Hebei provincial committee''s work conference for a forum on city industry, culture and education, the "five-antis" movement and the two labor systems and two education systems. On labor he says: there is now only one system, fixed workers, with labor insurance; it cannot grow, hires are hard and have cost some pain. After this the labor system is not to be one only; make full use of temporary labor and the peasants'' slack seasons; the state''s labor system is to be two, saving the state money, lowering cost, and benefiting state and peasants.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 595 (July 3, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-05.china-leadership-3
        when: July 5
        date: '1964-07-05'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, with the Hebei provincial committee''s leaders, on the two labor systems and two education systems: a new undertaking, which will not grow without someone to care for it and support it. Should the education or industrial departments set up an office for it? Work-study factories are to get materials by direct allocation and some consideration in the purchase of products, as they are few.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 595 (July 5, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-06.china-leadership
        when: July 6
        date: '1964-07-06'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi leaves Tianjin and reaches Jinan.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 595 (July 6, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-08.china-leadership-2
        when: July 8
        date: '1964-07-08'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi calls the prefectural secretaries at the Shandong provincial committee's work conference for a forum on how to deepen the rural socialist-education movement. He asks leading cadres at every level to go in person with a work team to a production brigade, take part in the whole course of the "four clean-ups" and gain firsthand experience of a new kind of work.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 595 (July 8, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-09.china-leadership-2
        when: July 9
        date: '1964-07-09'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi calls the army-system cadres of the Shandong provincial committee''s work conference for a forum on the army''s political work and military training. On building the army: real military democracy inside it, so that soldiers speak without misgiving to cadres, is not easy; a climate is wanted that is both centralized and democratic, disciplined and free, unified in will and easy and lively in mind, and the armed forces, offices, enterprises, factories and villages we lead are all to reach such a normal state.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 595 (July 9, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-10.china-leadership-2
        when: July 10
        date: '1964-07-10'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi calls the heads of Shandong's industrial and educational departments for a forum on the two labor systems and two education systems. He says there is now only one education system, full-time universities, middle schools and primary schools, which cannot spread education; half-farming half-reading in the villages and half-work half-reading in the cities, a new kind of education, would meet many people''s wish to study without heavy burden on the state or the family, and spread primary and middle-school education and then university education; this is to be tried boldly.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 595 (July 10, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-11.china-leadership-3
        when: July 11
        date: '1964-07-11'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi calls the prefectural secretaries of Shandong for a forum on the socialist-education movement and other questions.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 596 (July 11, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-12.china-leadership-2
        when: July 12
        date: '1964-07-12'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi reaches Hefei; in the evening he calls the standing committee of the Anhui provincial committee for a forum on the socialist-education movement and other questions. On unity inside the provincial committee he says: attend to the views of the few; those of the many are naturally heeded, but the few''s are often little noticed and must be taken seriously; to hear the many is not hard, the few are not so easily taken in.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 596 (July 12, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-13.china-leadership-2
        when: July 13
        date: '1964-07-13'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi calls the provincial, prefectural and city secretaries of Anhui for a forum on the rural socialist-education movement and the two labor systems and two education systems. He says the movement is a great revolution, in fact wider, deeper and more complex than any earlier revolution; it must solve the contradictions among the people, the "four unclean" and, with the struggle against the enemy, the cadres' taking part in labor, none of which was solved before and is harder than land reform; one who does not gain direct experience himself cannot lead it. The two systems are to be made concrete, tried first and not spread all at once, with experience summed up after four or five years and a more regular form given.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 596 (July 13, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-14.china-leadership-5
        when: July 14
        date: '1964-07-14'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi reaches Nanjing and hears Jiang Weiqing, first secretary of the Jiangsu provincial committee, report on its work.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 596 (July 14, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-15.china-leadership-4
        when: July 15
        date: '1964-07-15'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi calls the prefectural and city secretaries of Jiangsu for a forum on the socialist-education movement. He asks the cadres of the provincial, prefectural and county levels to go down in batches to the grassroots to squat at points and gain experience of the movement.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 597 (July 15, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-16.china-leadership-2
        when: July 16
        date: '1964-07-16'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi calls the leaders of the Nanjing Military Region, the region's air force and the military institutes for a forum on political education and military training. He says military work is to be strengthened, the militia done well and local troops built up, with soldiers among the people; war is not to be fought now, but the army must be ready to fight it.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 597 (July 16, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
