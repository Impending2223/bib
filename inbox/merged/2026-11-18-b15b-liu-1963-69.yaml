  - add:
      entry:
        id: cal.1963-11-22.china-leadership-3
        when: Nov. 22
        date: '1963-11-22'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi receives Dr. Abdul Qayyum, Afghanistan''s Minister of the Interior, who has come to sign the boundary treaty. Liu: China wants to build its economy and culture and hopes for a peaceful international environment, without which construction comes to nothing; changing its economic and cultural backwardness needs decades and China does not want war anywhere.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 585 (Nov. 22, 1963). Made public: 1996. Names: Liu Shaoqi. Check: the Latin form of 阿布杜·卡尤姆.'
        tags: [polity:prc, polity:afghanistan, name:liu-shaoqi, vis:only:prc+afghanistan@B-C]
  - cite:
