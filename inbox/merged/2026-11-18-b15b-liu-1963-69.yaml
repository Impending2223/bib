  - add:
      entry:
        id: cal.1964-08-21.china-leadership
        when: Aug. 21–22
        date: '1964-08-21'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi reports, Aug. 21 and 22, to the meeting of responsible cadres of the Guangxi Zhuang Autonomous Region committee''s organs and the city committees on the socialist-education movement and the two labor systems and two education systems. Aug. 22: his two labor systems and two school systems go together, and also the industrial labor system with the agricultural one; to practise this union is good for now and makes it possible to spread education within what state and family can bear. With only the present full-time primary schools, middle schools and universities China cannot spread education: many children of school age cannot enter, and as illiteracy is wiped out new illiterates grow up; without ways found, spreading education has no hope.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 601–602 (Aug. 21 and 22, 1964). Made public: 1996. To check: [[w.shaoqi-liu-shaoqi-xuanji-selected]], the piece "Shixing gudinggong he hetonggong bingcun de laodong zhidu," part of the report (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 601–602). Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
