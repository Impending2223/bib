  - cite:
      id: cal.1964-08-29.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 602 (Aug. 29–Sept. 1, 1964; Liu presides at the meeting of the regional bureaus'' first secretaries on the deployment of the socialist-education movement and the revision of the "Later Ten Points"; the revised draft, "Some concrete policies in the rural socialist-education movement (revised draft)," approved by Mao, is issued by the Center on Sept. 18; it says the enemy wins over cadres and sets up a "counter-revolutionary two-faced regime," that the movement is a mass movement wider, more complex and deeper than land reform, and that in some places a "makeup lesson" of the democratic revolution is to be taken; it changes the original provision on reliance on the lowest organizations and cadres, putting the roused masses first and the problems among the cadres first, and has work teams lead the whole movement)'
      units: A, B, C, D, E
