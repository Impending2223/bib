        date: '1964-08-16'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi calls the standing committee of the Central-South Bureau and the secretariat members of the Guangdong provincial committee to discuss the revised draft of the "Later Ten Points."
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 599 (Aug. 16, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-16.china-leadership-2
        when: Aug. 16
        date: '1964-08-16'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi wires Mao and the Central Committee on his trip through Hubei, Hunan and Guangdong and the problems arising in the rural socialist-education movement. He proposes that forces be concentrated for the "five-antis" in towns and the rural socialist education and the old method of leadership by the county committee be changed: all counties'' work teams to be gathered at the prefectural committee, the provincial work teams also divided among the prefectures, and under the provincial and prefectural committees one county tackled at a time in concentration, with every trade, the towns'' "five-antis" and the villages'' socialist education below the county all done by the work teams, by a package or in turn, place after place. Mao wires back his approval on Aug. 18.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 599–600 (Aug. 16, 1964). Made public: 1996. To check: Liu''s telegram of Aug. 16 and Mao''s reply of Aug. 18 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 599–600). Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-19.china-leadership-3
        when: Aug. 19
        date: '1964-08-19'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi sends the revised draft of the "Later Ten Points" to the Central Committee, with a letter to Mao and the Central Committee: the "Second Ten Points" has been revised in some important respects by Tian Jiaying and the comrades of the Central-South Bureau and the Guangdong committee, and he has seen it. He proposes it be sent to the bureaus and the provincial, prefectural and county committees for views and fixed at the October meeting; Tian Jiaying is bringing it to Mao and the Center for review, and he will take it to a few other provinces and bureaus for views.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 600 (Aug. 19, 1964). Made public: 1996. To check: Liu''s letter of Aug. 19 and the revised draft (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 600). Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-19.china-leadership-4
        when: Aug. 19
        date: '1964-08-19'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi writes to Mao and the Central Committee on forwarding Wang Guangmei''s report. Wang had reported to the Hebei provincial committee''s work conference on July 5 on the experience of the socialist-education movement at the Taoyuan brigade, Lu Wangzhuang commune, Funing county (later the "Taoyuan experience"): first "rooting and linking up," then the "four clean-ups," then the struggle against the enemy; the lowest Party organizations and cadres are "both reliable and not wholly reliable"; "four unclean" cadres are influenced by landlords, rich peasants and capitalists, and there is also a root above, without which the "four clean-ups" are not thorough, and the "four clean-ups" cover not only work points, accounts, granaries and stores but the political, economic, ideological and organizational "four unclean." She then made the same report in places across the country. Liu says Chen Boda urges sending it to all Party committees and work teams; Wang revised the Hebei committee''s record twice and he read and revised it once; the Center''s draft comment is to be reviewed, and if the Center agrees it should issue it. In the draft comment Liu calls the report a fairly complete and detailed typical summary of experience in rural socialist education, of general significance, but warns that every place and brigade differs, no frame is to be set up beforehand, and Taoyuan is to be a reference, not a frame.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 600–601 (Aug. 19, 1964). Made public: 1996. To check: Liu''s letter of Aug. 19 and the draft comment; Wang Guangmei''s report of July 5 to the Hebei provincial committee''s work conference (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 600–601). See [[cal.1964-08-22.china-leadership]]. Names: Liu Shaoqi, Mao Zedong, Chen Boda.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, name:chen-boda, vis:only:prc]
  - cite:
      id: cal.1964-08-22.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 601 (Aug. 27 and Sept. 1, 1964; the chronology gives Mao''s comment of Aug. 27: print it first for the comrades at the coming meeting of the bureaus'' first secretaries to discuss, and if all agree send it over the country, which he does, agreeing with Chen Boda and Liu; Sept. 1 the report is issued as a document of the Central Committee)'
      units: A, B, C, D
  - add:
