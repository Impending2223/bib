  - add:
      entry:
        id: cal.1963-05-09.china-leadership-4
        when: May 9
        date: '1963-05-09'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi and Wang Guangmei write to their daughter Liu Pingping, at a Peking middle school, for her fourteenth birthday: think what kind of youth she will be. She is not to be content with the middle of the road or to drift through her years; they want her an advancing, revolutionary youth with great communist ideals and Lei Feng''s ordinary but great communist spirit, serious and diligent at study, loving labor, learning from others, caring for the collective and for affairs at home and abroad, ready to sacrifice, and to keep fit. The Party and the people will need her; it will mean hardship, setbacks and sacrifice, but with her heart in the great cause any difficulty can be overcome.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 576–577 (May 9, 1963). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
