      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 585 (Nov. 17–Dec. 3, 1963; Liu attends the Fourth Session of the Second NPC, which adopts the reports on the 1963 plan and 1964 draft plan and on the 1963 budget and 1964 first arrangement, and the explanation of the list and election of deputies to the Third NPC, and approves the Standing Committee''s work report)'
