  - add:
      entry:
        id: cal.1964-07-21.china-leadership-2
        when: July 21 and 23
        date: '1964-07-21'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi speaks, July 21 and 23, to the responsible cadres of the East China Bureau and the Shanghai municipal committee on the socialist-education movement and the two labor systems and two education systems. On labor: China is populous, with a large surplus of rural labor, so the slack-season surplus of the villages is to be used for some work in the towns; fixed workers are to be reduced step by step and temporary and contract workers added, or all will be fixed and the future will be unmanageable; rules in labor policy that hinder the two systems are to be changed and revised in the interest of the state and the people.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 597 (July 21 and 23, 1964). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
