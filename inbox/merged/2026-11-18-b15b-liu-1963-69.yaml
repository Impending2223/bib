        date: '1963-12-21'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi talks with his children, Liu Yunbin and others, on the causes and lessons of the rise of modern revisionism and on the relation of the world's basic contradictions to its principal one. He tells them to set great aims and ideals, to stand of their own will at the head of the tide of the times and push history on; only so will their lives have meaning, their hearts be at ease, and they will not be downcast before difficulty but keep a revolutionary optimism.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 586 (Dec. 21, 1963). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1963-12-22.china-leadership-6
        when: Dec. 22
        date: '1963-12-22'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi attends the public memorial meeting for Luo Ronghuan at the Working People's Cultural Palace and presides over it.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 586 (Dec. 22, 1963). Names: Liu Shaoqi, Luo Ronghuan.'
        tags: [polity:prc, name:liu-shaoqi, name:luo-ronghuan]
  - add:
      entry:
        id: cal.1963-12-26.china-leadership-4
        when: Dec. 26
        date: '1963-12-26'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi hears Bo Yibo, Yu Qiuli and others on industrial production and the national industrial conference. On the Songliao (Daqing) oilfield: vigorous and with style, well done, but keep to rest and the alternation of work and rest. Of the wage system: do not simply refuse pay; workers may speak of not counting pay, leaders must speak of distribution by labor and not drop it. Think long-term: farm production and city building are to be built up slowly; in the future special-zone governments with unified leadership. On technical renovation: take past lessons, do not boast; the movement is long-term and must not stop; encourage technical innovation and dare to think, speak and act, to speak in small circles and act first in the laboratory; what is spread and taught must be mature; for some years good things were overstated in the papers and immature things spread too, to be summed up. On trusts and local contradictions: as a big country with ever more factories, how to manage them to the state''s advantage; throw out individualism, localism and departmentalism; "inconvenient for the locality," "profit sharing," "product sharing," "who is bigger," "who says" are not to be weighed, and are matters for the distribution and finance systems. On management: Party committees and governments should rise a little above the companies and the contradictions and judge, not be a party to them; some bureau heads and industrial, commercial and coal secretaries have rolled in and do not see the whole; the Party and government are to manage planning, balance, arbitration, supervision and political-ideological work, and production is run by companies and factories.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 586–587 (Dec. 26, 1963). Made public: 1996. Names: Liu Shaoqi, Bo Yibo.'
        tags: [polity:prc, name:liu-shaoqi, name:bo-yibo, vis:only:prc]
  - add:
      entry:
        id: cal.1964-01-03.china-leadership-3
        when: Jan. 3
        date: '1964-01-03'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi presides at a forum of some thirty people from the Central Propaganda Department and the literary and art circles; he conveys Mao Zedong''s comment of Dec. 12, 1963 and hears Zhou Yang, Vice-Minister of Propaganda and of Culture, report on the literary and art circles. Liu: the circles are to study Mao''s writings on literature and art earnestly, try to reflect the socialist revolutionary struggle, and themselves receive socialist education.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 588 (Jan. 3, 1964). Made public: 1996. To check: Mao''s comment of Dec. 12, 1963 on a paper of the Propaganda Department''s literature and art office (quoted by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 588 n.1). See [[cal.1963-12-12.china-leadership-2]]. Names: Liu Shaoqi, Mao Zedong.'
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
  - cite:
      id: cal.1963-12-12.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 588 n.1 (Jan. 3, 1964, footnote; the footnote quotes Mao''s comment of Dec. 12, 1963 on the paper of the Propaganda Department''s literature and art office)'
      units: A, B
  - add:
      entry:
        id: cal.1964-02.china-leadership
        when: Feb., early
        date: 1964-02
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi, in the Spring Festival days, talks with Wang Guangmei, home on leave from the socialist-education work at the Taoyuan brigade of the Lu Wangzhuang commune in Funing county, Hebei. He asks where the root lies of the serious "four unclean" mistakes: the corrosion and influence of feudal and capitalist forces is the root below, but the masses too are to be told to look at the root above, including degenerate elements in the higher organs and the bad style of ordinary cadres. Cadres guilty of serious "four unclean" mistakes generally have roots above: those below give gifts and feasts to cadres above, even link up with one another, and someone above protects them; without that protection they would not dare to err so gravely. Wang, back in Hebei, passes Liu''s talk to the Hebei provincial committee.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 588–589 (Feb., early, 1964). Made public: 1996. Names: Liu Shaoqi. Check: the day; the book has "the first ten days of February" and puts the Spring Festival (Feb. 13) after it.'
        at: before 1964-02-11
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05.china-leadership
        when: May
        date: 1964-05
        thread: china-leadership
        also: [china]
        c: During the Central Work Conference Liu Shaoqi sends Mao the Hebei provincial committee's summary of the main points of his early-February talk with Wang Guangmei, drawn up from what she relayed, for Mao's review.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 589 (May, 1964). Made public: 1996. Names: Liu Shaoqi, Mao Zedong. Check: the day; the book gives "the May Central Work Conference" without a date.'
        at: after 1964-05-10
        tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
