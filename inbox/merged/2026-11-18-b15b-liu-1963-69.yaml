        also: [china]
        c: 'Liu Shaoqi reports to the Fourth Enlarged Meeting of the Philosophy and Social Sciences Division Committee of the Academy of Sciences on the international situation and the struggle against modern revisionism: the struggle on the philosophy and social science fronts is to go further and wider, with it as the key link to drive the study of Marxism-Leninism and scholarly research and writing, while the policy of letting a hundred schools contend and a hundred flowers bloom is firmly kept.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 584 (Nov. 11, 1963). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
