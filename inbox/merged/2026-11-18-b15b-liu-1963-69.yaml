        when: Sept. 25
        date: '1963-09-25'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi continues his talks with Kim Il Sung. Of the lessons of China's economic construction he says it did too much basic construction and paid too little attention to the people's livelihood, agriculture and light industry; too much basic construction means too many factories and too much expanded reproduction; many saw only expansion and overlooked simple reproduction. China has 600 million people and will soon have 700 million; the pressure is heavy and family planning must be taken up.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 581 (Sept. 25, 1963). Made public: 1996. Names: Liu Shaoqi, Kim Il Sung.'
