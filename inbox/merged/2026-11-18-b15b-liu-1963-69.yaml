        thread: china-leadership
        also: [china, indonesia]
        c: Liu Shaoqi receives Arudji Kartawinata, Speaker of the Indonesian Mutual Cooperation Parliament, and his wife.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 621 (June 5, 1965). Names: Liu Shaoqi.'
        tags: [polity:prc, polity:indonesia, name:liu-shaoqi]
