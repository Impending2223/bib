        tags: [polity:prc, polity:mali, name:liu-shaoqi]
  - cite:
      id: cal.1966-06-09.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 641 (June 9–12, 1966; Liu goes to Hangzhou with Zhou Enlai, Deng Xiaoping, Tao Zhu, Chen Boda, Kang Sheng and others to report on the "Cultural Revolution" to Mao and, under Mao, discusses it; Liu says: how are the schools to be done? Some seize power, some criticize the academic authorities, then the reform of the teaching system, which settles a chain of problems such as examinations and textbooks; for the cultural revolution of factories and villages in the cities and countryside, is it to be joined with the "four clean-ups"? The discussion reached no clear view on whether to send work groups or not; footnote 1 (641) gives Tao Zhu''s post)'
      units: B
  - cite:
      id: cal.1966-06-11.china-leadership
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 641–642 (June 11, 1966; Liu, with Zhou Enlai and Deng Xiaoping, holds talks at Hangzhou with Hồ Chí Minh, Chairman of the Vietnam Workers'' Party Central Committee)'
  - cite:
      id: cal.1966-06-13.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 642 (June 13, 1966; the Central Committee and State Council''s notice on reforming admission to higher schools: the Cultural Revolution in the colleges and senior middle schools is to be carried through, and the 1966 admission of new students is put off half a year)'
  - check:
      id: cal.1966-06-13.china-leadership-2
      text: 'Check: Liu''s chronology (II, 642) gives the notice of this day as one on reforming college admission that puts off the 1966 admissions half a year; MacFarquhar''s suspension of classes may be its reading.'
  - cite:
      id: cal.1966-06-14.china-leadership-2
      item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 642 (June 14–28, 1966; Liu repeatedly calls the enlarged Standing Committee on the "Cultural Revolution" in the Peking area and says in turn: none of us has experience of this struggle, nor have the work groups; some are good and can "three together" (live, eat and work) with the students, and the bad are to be withdrawn; draw a line, do not call everyone black gang; Party leadership is not to be interrupted and most Party organizations are good; do not knock down everything; through the movement hold on to production, work and life and restore normal order, attend to alternation of work and rest, and to counter-revolutionary sabotage; follow the spirit of the "Twenty-three Articles," forbid beating, insulting and corporal punishment; even power-holders and the black gang may correct their errors and be given a way out)'
      units: B
  - add:
      entry:
        id: cal.1966-06-20.china-leadership-5
        when: June 20
        date: '1966-06-20'
        thread: china-leadership
        also: [china]
        c: 'Liu Shaoqi drafts for the Central Committee the comment forwarding the Peking University Cultural Revolution Bulletin no. 9, which reports on how the work group there stopped disorderly beating: the Center thinks the work group''s handling of the disorder correct and timely, and any unit where it occurs may follow Peking University''s way.'
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 642 (June 20, 1966). Made public: 1996. To check: the Peking University Cultural Revolution Bulletin no. 9, the Central Committee''s comment of June 20, 1966 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 642). Names: Liu Shaoqi. Check: the book says Jiang Qing and others later called the forwarding "suppressing the student movement."'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - add:
      entry:
        id: cal.1966-06-20.china-leadership-6
        when: June 20
        date: '1966-06-20'
        thread: china-leadership
        also: [china]
        c: Liu Shaoqi hears the work group of the first middle school attached to Peking Normal University report on the "Cultural Revolution" there, and gives his view on the school's movement. He says the chief problem now is not knowing how to do it; they are to do it together with everyone, study together, discuss together and take the mass line.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 642–643 (June 20, 1966). Made public: 1996. Names: Liu Shaoqi.'
        tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
