        thread: china-leadership
        also: [china]
        c: Liu Shaoqi reaches Rangoon; at the farewell banquet he says that during the visit he has felt in person the "paukphaw" friendship between the two countries.
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 575 (Apr. 25, 1963). Names: Liu Shaoqi.'
