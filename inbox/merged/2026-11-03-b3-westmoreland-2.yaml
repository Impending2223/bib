        when: Mar., early
        date: 1968-03
        thread: vietnam-205000
        c: 'Sharp, after Clifford''s questions through Wheeler: "We are at a crossroads; either the U.S. uses its military power at full effectiveness with provision of adequate forces, or continues a campaign of gradualism and accepts a long drawn-out contest." Westmoreland and Bunker press with him to loosen the limits on ground operations in Laos and Cambodia and bomb the North harder.'
        n: '[[w.westmoreland-soldier-reports]], 357. To check: Sharp''s message (quoted by [[w.westmoreland-soldier-reports]], 357). Check: the day. See [[cal.1968-03-09.vietnam-205000]]. Names: Sharp, Clifford, Wheeler, Westmoreland, Bunker.'
