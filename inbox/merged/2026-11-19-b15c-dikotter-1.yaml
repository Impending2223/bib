      - soviet-union
      c: Ye Jizhuang, Minister of Foreign Trade, instructs his representatives abroad to cut imports from the socialist bloc. Talks on new trade agreements are to stop, but for a few strategic projects, such as steel from the Soviet Union for the Nanjing bridge; no new import contracts are to be signed, the pretext being the price or specifications of the goods offered.
      n: '[[w.dikotter-maos-great-famine]], 108 n.2. Made public: 2010. To check: Ye Jizhuang, instruction to the foreign-trade representatives abroad, file of Aug. 20, 1960, Ministry of Foreign Affairs Archives, Peking, 118-1378-13, pp. 32–33 (cited by [[w.dikotter-maos-great-famine]], 108 n.2). Check: the day.'
