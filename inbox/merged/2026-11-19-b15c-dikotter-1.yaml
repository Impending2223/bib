      id: cal.1961-07-17.china-leadership-10
      when: July 17
      date: '1961-07-17'
      place: beidaihe
      thread: china-leadership
      c: 'Beidaihe 北戴河. Li Fuchun 李富春, at a meeting of the party planners, on the economy: tens of millions of farmers in Shandong, Henan and Gansu live on a handful of grain a day, and the famine has little to do with natural calamities. He calls the Leap too high, too big, too equal, too dispersed, too chaotic, too fast and too given to transfers of resources, and proposes lower targets. Mao endorses the report.'
      n: '[[w.dikotter-maos-great-famine]], 121, 122 n.23 (Li: Mao''s directives "entirely correct," the mistakes made in carrying them out, 122). Made public: 2010. To check: Li Fuchun, speech of July 17, 1961 to the planners at Beidaihe, Hunan Provincial Archives, 186-1-584, pp. 7 and 13 (cited by [[w.dikotter-maos-great-famine]], 122 n.23). Names: Li Fuchun 李富春, Mao Zedong. Check: the day.'
