      id: cal.1961-08.china-leadership-6
      when: Aug.
      date: 1961-08
      thread: china-leadership
      also:
      - china
      c: 'Four officials report after Li Fuchun''s speech: Li Yiqing, a senior party secretary, that in 1958 over 140,000 tonnes of farming tools went into the backyard furnaces of Henan; Wu Jingtian, vice-minister of railways, that one locomotive in five is out of use for engine damage; Peng De, vice-minister of transportation, that fewer than two vehicles in three work; Xu Chi, vice-minister of metallurgy, that the Angang steelworks stopped for weeks in the summer for want of coal.'
      n: '[[w.dikotter-maos-great-famine]], 122 n.24, 144 n.70. Made public: 2010. To check: Documents from the Beidaihe conference, Aug. 11, 1961 (the Hunan file), Hunan Provincial Archives, 186-1-584, pp. 38–48, 125, 134 and 152 (cited by [[w.dikotter-maos-great-famine]], 122 n.24; 144 n.70). Check: the meeting and the days: the book sets the reports at Lushan in the summer of 1961 (122, 144); the file it cites is of the Beidaihe conference, Aug. 11.'
      src:
