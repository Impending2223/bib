      c: The Kremlin, Moscow. Khrushchev tells Ye Jizhuang, Minister of Foreign Trade, that he has every sympathy and repeats his offer of grain. The Ukraine had a terrible famine in 1946, he says, and there were cases of cannibalism. He then speaks of the Soviet Union about to overtake the United States in steel. Ye declines the offer.
      n: '[[w.dikotter-maos-great-famine]], 111 n.20. Made public: 2010. To check: Khrushchev, talk with Ye Jizhuang, the Kremlin, Apr. 4, 1961 (the Chinese record), Ministry of Foreign Affairs Archives, Peking, 109-2264-1, pp. 1–8 (cited by [[w.dikotter-maos-great-famine]], 111 n.20). Names: Khrushchev. Check: the day.'
