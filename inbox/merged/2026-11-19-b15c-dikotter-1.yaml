      c: Chengdu 成都. Nie Rongzhen 聂荣臻, travelling in the region, writes Mao Zedong that Guizhou is not poor at all but very rich, and should in future be the industrial base of the south-west.
      n: '[[w.dikotter-maos-great-famine]], 314 n.22. Made public: 2010. To check: Nie Rongzhen, letter to Mao Zedong sent from Chengdu, Mar. 16, 1960, Gansu Provincial Archives, 91-9-134, p. 2 (cited by [[w.dikotter-maos-great-famine]], 314 n.22). Names: Nie Rongzhen 聂荣臻, Mao Zedong 毛泽东. Check: whether it is the letter of Mar. 16 to the Center on which Mao commented Mar. 25 (Comment: [[cal.1960-03-25.china-leadership-4]]).'
