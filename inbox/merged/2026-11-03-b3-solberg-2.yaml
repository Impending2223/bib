      c: 'Harpsund, the Swedish prime minister''s country residence. Erlander''s weekend of Social Democratic leaders: the
        prime ministers of Sweden, Denmark and Norway, Brandt, Wilson the second day; Humphrey and Reuther the Americans,
        Andreas with them. Unemployment, agriculture, the balance of payments. Humphrey: eighty thousand new jobs a week for
        ten years, to absorb the labor force.'
      n: '[[w.solberg-hubert-humphrey]], 219–21 (Humphrey''s notes, Andreas''s memorandum; Johnson''s "My God, no" when told
        of it in 1964). To check: "Participants at Harpsund," July 13–14, 1963, Box 1401; Humphrey''s longhand notes, Harpsund,
        July 1963, Box 709; Reuther to Humphrey, June 26, 1963, Box 709, Humphrey Papers; Andreas''s memorandum on Harpsund,
        n.d., 1963, Andreas files (cited by [[w.solberg-hubert-humphrey]], 219, its note). Check: Solberg counts Britain among
        the prime ministers present; Wilson then led the Labour opposition. Names: Erlander, Brandt, Wilson, Humphrey, Reuther.'
      src:
        c: d6ba600f
        rows:
        - 'w.solberg-hubert-humphrey 219–21: all'
        - 'via w.solberg-hubert-humphrey 219 n.participants: all'
