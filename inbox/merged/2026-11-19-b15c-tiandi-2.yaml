      date: '1967-04-27'
      thread: china-leadership
      c: Zhou Enlai 周恩來 has Tan Qilong 譚啟龍 go back to Shandong, at the request of Wang Xiaoyu 王效禹, head of the provincial revolutionary committee; he is seized and struggled against
        as he steps off the plane.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 365. Made public: 2003. To check: *Tan Qilong huiyilu* 《譚啟龍回憶錄》 (2003), 646–650 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 365 n.74).
