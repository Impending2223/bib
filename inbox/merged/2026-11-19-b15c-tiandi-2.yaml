      c: Nanjing 南京. The Jiangsu Workers' Red Rebel General Headquarters (Sheng Gongzong 省工總) is reorganized around the industrial workers of the large and medium plants, Zhu Kaidi 朱開地
        of the Chenguang Machinery Plant 晨光機器廠 and Lu Xuezhi 魯學智 of the Changjiang Machinery Plant 長江機器廠 among its heads. Some of the old heads refuse to yield power; a "new" and an
        "old" Workers' General HQ stand side by side.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 320. See [[cal.1966-11.china-leadership-21]].'
      src:
        c: b0b9efb1
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 320: all'
      tags:
