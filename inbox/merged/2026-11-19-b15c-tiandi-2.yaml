- cite:
    id: cal.1967-01-08.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 349 (Mao calls Chen Boda, Kang Sheng, Jiang Qing, Wang Li 王力, Guan Feng 關鋒, Qi Benyu 戚本禹, Tang Pingzhu 唐平鑄 and Hu Chi 胡癡: on the two Shanghai
      papers, "a seizure of power by the left, the direction is good; the *Wenhui bao* rebelled on the 4th, the *Jiefang ribao* on the 6th; these are national questions, and we must
      back their rebellion; this is one class overthrowing another, a great revolution; the two papers will affect East China and the whole country; if the revolutionary forces in Shanghai
      rise, the whole country has hope"; and the Message to All Shanghai Citizens is a rare good article, on Shanghai and a national matter)'
- to-check:
    id: cal.1967-01-08.china-leadership
    add: Mao Zedong's talk to the Cultural Revolution Group on the seizure of the *Wenhui bao* and *Jiefang ribao*, Jan. 8, 1967, in Song Yongyi 宋永毅 et al., *Zhongguo wenhua dageming
      wenku* 《中國文化大革命文庫》 (2006) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 349 n.42)
- cite:
    id: cal.1967-01-09.china-leadership-7
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 349 (the *Renmin ribao* reprints the Message on Jan. 9, with an editors'' note giving the main content of Mao''s talk of Jan. 8)'
- cite:
    id: cal.1967-01-09.china-leadership-5
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 350 (the "Urgent Notice" 〈緊急通告〉, signed by the Workers'' General HQ and 31 other rebel bodies, 32 in all, and printed in both papers on
      Jan. 9, says the capitalist-roaders join with capitalist forces in society and use welfare to turn the struggle from its main direction, "set the masses against the masses," stop
      factories and cut the railway, squander state wealth, raise wages and welfare at will, issue allowances and incite seizure of public housing, and sets out ten points: grasp revolution
      and promote production, hold posts, and call the Shanghai workers, cadres and staff who are linking up elsewhere back at once to finish the plan of 1967; Yang says it is aimed
      at the "economism wind" of the end of 1966 and early 1967)'
- cite:
    id: cal.1967-01-10.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 350 (Mao instructs the Cultural Revolution Group to draft for the Center, the State Council and the Military Commission a telegram of congratulation
      to Shanghai''s revolutionary rebel bodies, saying that their policy and action are correct and calling on the whole country''s Party, government, army and people to learn from
      Shanghai''s experience and act as one)'
