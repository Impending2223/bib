- add:
    entry:
      id: cal.1967-02-12.china-leadership-2
      when: Feb. 12
      date: '1967-02-12'
      thread: china-leadership
      c: The Center and the State Council issue the "Notice on Banning National Organizations" 〈關於取締全國性組織的通告〉, ordering every national body dissolved.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 376.'
      src:
        c: ffa6a7d5
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 376: all'
