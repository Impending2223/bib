      thread: china-leadership
      c: At a meeting of the Red Guards' Capital Third Headquarters 紅衛兵首都三司 Zhou Enlai 周恩來 says the pickets are used by bad men to strike the revolutionary rebels, so they are to be
        abolished. The papers name the West City Pickets a reactionary organization; its head Kong Dan 孔丹 is arrested.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 280. Names: Zhou Enlai.'
