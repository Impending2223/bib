      id: cal.1966-12-05.china-leadership-2
      when: Dec. 5
      date: '1966-12-05'
      place: peking
      thread: china-leadership
      c: 'Peking. Zou Jianping 鄒建平 and others of the middle school attached to the Peking Industrial Institute 北京工業學院附中 climb the Xizhimen 西直門 wall and paint a slogan tens of meters
