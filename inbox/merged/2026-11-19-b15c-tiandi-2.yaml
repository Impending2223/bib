      c: 'Nanjing 南京. The Jiangsu Red Rebel General Headquarters 江蘇省紅色造反總司令部 (Sheng Hongzong 省紅總), Nanjing''s largest "mountain," is founded; its sponsor and core is the Nanjing University
        Red Rebel Corps 南大紅色造反隊. Chief figures: Wen Fenglai 文鳳來, middle-aged teacher of the politics department, Dai Guoqiang 戴國強 of the Xinhua branch, whom Yao Wenyuan has dismissed
        as a reporter for joining a local mass body, Kong Fanjie 孔繁潔, and students Shi Wei 施威, Yao Jinqiu 姚金鍬 and Geng Changxian 耿昌賢. The conservative Nanjing Red Guard Headquarters
        and the Nanjing workers'' Red Guards fall as the bourgeois line is criticized.'
