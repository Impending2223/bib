- cite:
    id: cal.1967-01-05.china-leadership-5
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 352 (at the Wukang Road no. 2 building 武康路二號樓 Zhang and Yao receive the heads of the Workers'' General HQ; Zhang: "now that the Scarlet
      Guards have collapsed, whether your ranks keep step bears on the whole of Shanghai; Shanghai''s two million industrial workers are our base; the workers'' movement must not be
      manipulated by the Red Guards, least of all by students from elsewhere"; "there is no need to cherish illusions about the municipal committee; the thing now is to take hold of
      the key organs, the port, railways, power plant, waterworks, gas and telephones")'
