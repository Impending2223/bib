      when: Jan. 17
      date: '1967-01-17'
      place: shanghai
      thread: china-leadership
      c: 'People''s Square 人民廣場, Shanghai. The "Rebel General Headquarters of Shanghai Workers Back from Supporting Agriculture" 上海支農工人回滬造反總司令部 brings sixty or seventy thousand to sit
        in with quilts and straw bags, asking Zhang Chunqiao 張春橋 and Yao Wenyuan 姚文元 to receive them: "we are old workers, not among those cut and sent down in the old days; the Center''s
        notice against economism is not aimed at us"; "one day without seeing you, one day we do not disperse." The Workers'' General HQ coaxes and presses them, and they give in.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 383. Made public: 2013. Names: Zhang Chunqiao, Yao Wenyuan.'
