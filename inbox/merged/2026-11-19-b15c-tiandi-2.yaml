- cite:
    id: cal.1967-01-06.china-leadership-9
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 352 (the rally of Jan. 6 of over thirty rebel bodies led by the Workers'' General HQ, at People''s Square, "hundreds of thousands" by Yang''s
      account and 100,000 as later announced, with 369 branch venues, over a thousand loudspeakers on four avenues and twelve crossroads, and a television relay; Chen Pixian, Cao Diqiu,
      Wei Wenbo 魏文伯, Han Zheyi 韓哲一, Ma Tianshui 馬天水, Wang Yiping 王一平, Yang Xiguang 楊西光, Wang Shaoyong 王少庸 and Liang Guobin 梁國斌 are brought on the platform to be struggled against, with
      hundreds of bureau-level cadres; Wang Hongwen''s speech "Expose the Shanghai Committee''s Heinous Crime of Aiming the Guns at the Proletarian Headquarters," revised by Zhang many
      times; a girl Red Guard from Peking reads the orders, whose first is that the rebels no longer recognize Cao Diqiu as secretary of the Shanghai committee''s secretariat)'
