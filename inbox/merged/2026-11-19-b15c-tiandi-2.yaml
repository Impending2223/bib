    id: cal.1967-01-22.china-leadership-3
    add: Zhou Enlai's speech of Jan. 22, 1967, printed by the Central Committee General Office's secretariat, Jan. 24, 1967, and the Tsinghua "Suoyaofeng" combat group's shorthand copy
      (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 351 n.44) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 351 n.44)
