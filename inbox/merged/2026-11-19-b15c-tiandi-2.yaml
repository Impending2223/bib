- add:
    entry:
      id: cal.1966-12-01.china-leadership-5
      when: Dec. 1
      date: '1966-12-01'
      place: shanghai
      thread: china-leadership
      c: 'Shanghai. The *Hongweibing zhanbao* 《紅衛兵戰報》 of the Shanghai Colleges'' Red Guards Revolutionary Committee 上海大專院校紅衛兵革命委員會 (Hongge hui 紅革會) prints "The *Liberation Daily* Is
        the Faithful Tool of the Shanghai Committee in Carrying Out the Bourgeois Reactionary Line" and asks that it be issued with the *Liberation Daily* 解放日報 "to disinfect" it; the
        paper''s heads refuse after asking the committee. The Hongge hui moves into the newspaper office and makes three demands: to insert its paper in the Nov. 30 issue, to reprint
        the article, and to be told the committee''s instructions on the bourgeois line. The deadlock stops the *Liberation Daily*; Nie Yuanzi, in Shanghai, and the Capital Third HQ''s
        liaison station back them, while thousands of Scarlet Guards march near the office shouting "we want to read the *Liberation Daily*."'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 346. Made public: 2009.'
      src:
        c: 6bb5e937
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 346: all'
      tags:
      - polity:prc
