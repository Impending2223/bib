    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 202 (June 18, 9 to 11 a.m. 上午9時至11時, the departments of chemistry, biology, Eastern languages, Western languages, Chinese and radio electronics
      and other units struggle against over 60 people, among them "key" persons, Party and League cadres and teachers "with problems," and two "reactionary students": faces blackened,
      tall hats, kneeling, a few beaten; the work group fixes it a "counter-revolutionary incident"; Yang thinks the excesses could have been corrected by policy and guidance)'
