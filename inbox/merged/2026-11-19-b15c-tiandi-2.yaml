      when: Jan. 7
      date: '1967-01-07'
      place: shanghai
      thread: china-leadership
      c: 'The Workers'' General HQ 工總司 meets at Cotton Mill no. 31 on the economism wind; Wang Hongwen 王洪文 says it must be stopped and tells the HQ to issue a leaflet at once. That night
        it issues the leaflet "Emergency Order" 〈緊急通令〉 in its own name: workers are not to leave their posts, seize housing or rebel over wages, but turn the spearhead on the capitalist-roaders,
        and are to send back the money they have drawn.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 381. Made public: 2016. To check: Shanghai chronicle of anti-economism, Mar. 17, 1967, in Song Yongyi 宋永毅 et al., Wenge ziliaoku 文革資料庫 (cited
        by [[w.yang-jisheng-tiandi-fanfu]], I, 381 n.29).'
      src:
