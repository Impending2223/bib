      c: 'Zhang Chunqiao 張春橋 and Yao Wenyuan 姚文元 reach Shanghai. Zhang tells Xu Jingxian 徐景賢 and the others: "Wenyuan and I are here sent by the Cultural Revolution Group; of course
        we stand with you"; their task is to investigate and report to the Center; the news of their coming is not to be made public.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 352. Made public: 2016. See [[cal.1967-01-02.china-leadership]]. Names: Zhang Chunqiao, Yao Wenyuan.'
