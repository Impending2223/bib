      when: Sept., early
      date: 1966-09
      at: before 1966-09-01
      thread: china-leadership
      c: 'Li Jingquan 李井泉, Sichuan''s first secretary, instructs that revolutionary cadres now have no voice and workers and peasants who speak are said to besiege the students; they
        must speak through their children: workers and peasants are to "send their sons" to the Red Guards, and the papers to publicize it, as important as peasants sending sons to the
        army in the revolutionary war.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 294. Made public: 2016. See [[cal.1966-09.china-leadership-21]]. Check: the date: the page gives the instruction no date of its own, after
