      id: cal.1966-08.china-leadership-38
      when: Aug., early
      date: 1966-08
      at: before 1966-08-01
      thread: china-leadership
      c: 'Under the Sichuan committee''s unified plan the colleges'' official cultural revolution groups take up the Sixteen Articles'' "struggle, criticize, reform" and begin "criticizing
        three, struggling against four": students and teachers sorted by politics, the third and fourth classes the targets. They plan one or two chosen in each department as a trial,
        then the study groups and classes, to finish struggle in a month and a half and offer the result for National Day. At Chengdu Institute of Technology 成都工學院 216 teachers, 26.2
        percent, are picked out, over 400 with those the authorities hold in secret.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 294. Made public: 1968. To check: Xiao Xidong 蕭喜東, 《文革中的領導與群眾:話語、衝突和集體行動》 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 294 n.13); *Jiaoyu
        geming* 《教育革命》, no. 6, 1968, Chengdu general station against Li Jingquan (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 294 n.12).'
      src:
