      when: May 9
      date: '1966-05-09'
      thread: china-leadership
      c: 'The Central-South Bureau''s propaganda department 中南局宣傳部 relays Tao Zhu''s 陶鑄 instruction: the movement is to turn to the anti-rightist; its meaning is great, more prolonged,
        deeper and wider than the earlier anti-rightist struggle.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 201. Made public: 2006. To check: Liu Guokai 劉國凱, *Wenhua dageming jianxi* 《文化大革命簡析》 (Boda chubanshe 博大出版社, Hong Kong, 2006), 10 (cited
        by [[w.yang-jisheng-tiandi-fanfu]], I, 201 n.32). Names: Tao Zhu.'
      src:
