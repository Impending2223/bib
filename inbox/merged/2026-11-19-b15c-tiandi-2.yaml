      time_band: afternoon
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Tsinghua University 清華大學, Peking. The preparatory committee holding the posters against Liu Shaoqi 劉少奇 a rightist reversal, He Pengfei 賀鵬飛 of the Tsinghua University Red Guards
        brings the Red Guards of twelve middle schools: a pledge meeting at the Tsinghua middle school in the afternoon; at 4:50 p.m. they run into Tsinghua, seal the poster area, broadcast
        an ultimatum to tear the posters down by 6, beat dissenting students, and by night every poster is torn down. At 6 they pull down the Second Gate 二校門; they search homes, beat
        cadres, and that night make the cadres kneel in rows and beat them, the deputy secretary Liu Bing 劉冰 among them. Yang, then a Tsinghua student, saw it.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 252–253. The words: 下午; 下午4點50分 (I, 252). Made public: 2008. To check: Liu Bing 劉冰, *Fengyu suiyue: 1964–1976 de Qinghua* 《風雨歲月——1964-1976年的清華》
        (Dangdai Zhongguo chubanshe 當代中國出版社, 2008), 83–85 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 253 n.17). See [[cal.1966-08-23.china-leadership-9]]. Names: Liu Shaoqi.'
