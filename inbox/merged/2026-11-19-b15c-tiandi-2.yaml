      when: Dec. 27–28
      date: '1966-12-27'
      place: shanghai
      thread: china-leadership
      c: Kangping Road 康平路, Shanghai. Enraged by Cao Diqiu's 曹荻秋 declaration, the Scarlet Guards surround the Shanghai committee's compound from Dec. 27, over 10,000 by the night of
        the 28th and in time 30,000, now turned against the committee. The leaders have left; only Zhang Chunqiao's wife Wen Jing 文靜 and the family of the late Ke Qingshi live there.
        On the 28th the Workers' General HQ brings tens of thousands to the road, and the two sides face each other; that night the Scarlet Guards brush on the wall "Down with the Shanghai
        committee."
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 347. Made public: 2016. See [[cal.1966-12-25.china-leadership-4]]. Names: Zhang Chunqiao, Ke Qingshi.'
