- add:
    entry:
      id: cal.1967-02-17.china-leadership-3
      when: Feb. 17
      date: '1967-02-17'
      thread: china-leadership
      c: 'The Center and the State Council issue the "Notice on the Handling of Temporary, Contract and Outside-Contract Workers during the Cultural Revolution" 〈關於文革期間對臨時工、合同工、外包工處理問題的通告〉:
        the joint notice of Jan. 2 of the Red Laborers'' Corps, the Ministry of Labor and the trade union federation is illegal and to be cancelled, and all documents the provincial
        labor bureaus made on it are void; the systems of temporary, contract, rotating and outside-contract labor are in part reasonable and in part not, and the Center is studying
        their reform and, till it decides, the old way stands.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 376. See [[cal.1967-02-12.china-leadership-2]].'
      src:
        c: c6ace007
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 376: all'
      tags:
      - polity:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1966-11-22.china-leadership-3
      when: Nov. 22–23
      date: '1966-11-22'
      place: shanghai
      thread: china-leadership
      c: Shanghai. On Nov. 22 Huang Yuqi 黃宇齊, director of the East China Bureau's industry office, and Yu Yongshi 于永實, deputy head of the Shanghai labor bureau, sign for the East China
        Bureau's representative the six demands of the temporary and outside-contract workers; on Nov. 23 Wang Ke 王克, head of the labor bureau, signs the demands of the workers sent
        to support agriculture.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 379. Made public: 2016. To check: Shanghai Revolutionary Committee''s liaison HQ against economism, 〈無產階級文化大革命中上海反對經濟主義大事記 1966年11月–1967年3月15日〉
        (discussion draft, Mar. 17, 1967), in the "Wenge bowuguan" 文革博物館 321 *Shanghai de "jingjizhuyi feng"* 《上海的「經濟主義風」》 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 379 n.21).'
      src:
        c: 7606bc2f
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 379: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 379 n.21: all'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1966-12-11.china-leadership-2
      when: Dec. 11
      date: '1966-12-11'
      place: shanghai
      thread: china-leadership
      c: 'Chen Pixian 陳丕顯, first secretary of the Shanghai committee, presides over a committee meeting and reads out the instruction of Tao Zhu 陶鑄, adviser to the Cultural Revolution
        Group: "we are very much on the defensive; we must win the initiative; meet their demands as far as possible."'
