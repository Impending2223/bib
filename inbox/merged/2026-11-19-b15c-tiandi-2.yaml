    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 347 (from 2 a.m. to 6 a.m. the Workers'' General HQ, after the order of the night of the 28th, attacks the Scarlet Guards on Kangping Road;
      they all surrender; 91 are wounded, the worst with a broken leg bone, none dead; six great heaps of armbands and several hundred cases of biscuits are taken; at 7 a.m. nearly 20,000
      Scarlet Guards line up in six columns on the surrounding roads, hear a lesson, and are sent home)'
