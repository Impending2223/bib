      place: peking
      thread: china-leadership
      c: 'Tsinghua University 清華大學, Peking. Kuai Dafu 蒯大富 and others found the Tsinghua University Jinggangshan Corps 清華大學井岡山兵團, only a few dozen members, those branded counter-revolutionaries
        with him. Its aim: to criticize the work group''s bourgeois reactionary line, to criticize the "Tsinghua University Red Guards," and to clear the "Kuai-type persons." Kuai had
        it from Zhang Chunqiao 張春橋 that he should have an organization of his own; Zhu Chengzhao and Han Aijing 韓愛晶 said the same. He wants the founding declaration broadcast on the
        campus station, and He Pengfei refuses.'
