      thread: china-leadership
      c: Peking. Cao Binhai 曹濱海, a third-year senior at the Normal University's second attached middle school, quarrels with the Red Guard classmates who come to search his home and
        wounds one with a kitchen knife. The police take him away; the Red Guards seize his mother, Fan Ximan 樊希曼, and beat her to death at the school. With the Li Wenbo case it is called
        a "mad revenge of the class enemy."
