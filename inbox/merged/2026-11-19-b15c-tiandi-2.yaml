      when: July 25
      date: '1968-07-25'
      place: peking
      thread: china-leadership
      c: East Hall of the Great Hall of the People 人民大會堂東大廳, Peking. Receiving the heads of the two Guangxi mass bodies and army cadres come to Peking, Zhou Enlai 周恩來, Chen Boda 陳伯達,
        Kang Sheng 康生, Yao Wenyuan 姚文元, Xie Fuzhi 謝富治, Huang Yongsheng 黃永勝, Wu Faxian 吳法憲 and Wen Yucheng 溫玉成 sternly rebuke the rebels with one voice and question them as at a trial
        on the "black meeting."
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 325. Made public: 2016. See [[cal.1968-07-17.china-leadership-3]]. Names: Zhou Enlai, Chen Boda, Kang Sheng, Yao Wenyuan, Xie Fuzhi, Huang
        Yongsheng, Wu Faxian.'
      src:
        c: 8ba9af31
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 325: all'
