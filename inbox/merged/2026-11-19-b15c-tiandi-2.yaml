      c: Northeast People's University 東北人民大學 (later Jilin University). The Changchun municipal committee's work group under Li Yiping 李一平, sent June 14 by the Jilin committee, convenes
        a meeting of all Party members to back it, and a mass meeting that evening. Students find no national flag on the platform and Mao's portrait hung crooked, and three or four
        hundred rush the platform. Public security men and 270 cadres are brought in; the "Red Flag incident" is fixed by the province and city committees as "waving the red flag to
        oppose the red flag."
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 211. The words: 晚上開群眾大會 (I, 211). Made public: 2016.'
