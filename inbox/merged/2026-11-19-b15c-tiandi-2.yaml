- add:
    entry:
      id: cal.1967-02-24.china-leadership-2
      when: Feb. 24
      date: '1967-02-24'
      place: shanghai
      thread: china-leadership
      c: On Mao's opinion the Shanghai People's Commune is renamed the Shanghai Municipal Revolutionary Committee 上海市革命委員會.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 360. Made public: 2016. See [[cal.1967-02-05.china-leadership-2]]. Names: Mao Zedong.'
      src:
        c: 768bc663
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 360: all'
