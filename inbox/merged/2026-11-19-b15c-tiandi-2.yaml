      c: 'Before dawn Chen Boda 陳伯達, head of the Cultural Revolution Group, receives two factions of Red Guards who differ on the couplet "if the father is a hero the son is a good fellow,
        if the father is a reactionary the son is a bastard," and says it is "not comprehensive." He rewrites it: "parents revolutionary, children carry on; parents reactionary, children
        rebel," with the top line "It Should Be So" 理應如此, and explains that Mao calls for uniting the majority, which the "bloodline theory" hurts.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 248. The words: 淩晨 (I, 248). Made public: 2016. Names: Chen Boda.'
