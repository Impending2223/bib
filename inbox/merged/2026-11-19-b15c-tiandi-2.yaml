      date: '1966-08-07'
      place: peking
      thread: china-leadership
      c: 'Tsinghua University 清華大學, Peking. The provisional preparatory committee for the cultural revolution leading group 清華大學文化革命領導小組臨時籌備委員會 (Linchou), set up in the work group''s
        time under Wang Renzhong''s 王任重 instruction and headed by He Pengfei 賀鵬飛, Liu Tao 劉濤, Li Lifeng 李黎風 and Qiao Zonghuai 喬宗淮, children of Politburo and Foreign Ministry leaders,
        proposes, on the spirit of Zhou Enlai''s 周恩來 speech, to end the criticism of the work group and turn the struggle to the "black gang": the "Aug. 7 proposal" 八七建議.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 310. Made public: 2015. To check: Sun Nutao 孫怒濤, ed., *Lishi jujue wangji: Qinghua shinian wenge huiyi* 《歷史拒絕遺忘——清華十年文革回憶》 (Zhongguo wenhua
