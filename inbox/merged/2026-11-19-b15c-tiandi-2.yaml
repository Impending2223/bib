- add:
    entry:
      id: cal.1966-11-08.china-leadership-5
      when: Nov. 8
      date: '1966-11-08'
      place: peking
      thread: china-leadership
      c: Peking. The All-China Red Laborers' Rebel Corps 全國紅色勞動者造反總團 (Quanhongzong 全紅總), a body of contract and temporary workers who have fled to Peking from places where their rebellion
        was put down, is founded at the Metallurgy Ministry's second guesthouse 冶金部第二招待所, on Xizhimen Inner Street, then renamed the Center and State Council cultural revolution joint
        reception station's guesthouse. Its sponsors come from Peking, Jiangsu, Anhui, Guangxi and Guizhou. The same day over fifty of them sit in at the conference hall of the All-China
        Federation of Trade Unions 中華全國總工會.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 372. Made public: 2016.'
      src:
        c: 8c7a04ff
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 372: all'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1966-11-18.china-leadership-3
      when: Nov. 18
      date: '1966-11-18'
      place: peking
      thread: china-leadership
      c: After ten days of sitting in, the number risen from over fifty to over three hundred, Wang Zhijie 王志傑, secretary of the Secretariat of the All-China Federation of Trade Unions
        中華全國總工會, recognizes the Red Laborers' Corps orally as a lawful rebel organization.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 372. Made public: 2016. See [[cal.1966-11-08.china-leadership-5]].'
      src:
        c: 455c2090
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 372: all'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1966-12-05.china-leadership
      when: Dec. 5
      date: '1966-12-05'
      place: peking
      thread: china-leadership
      c: The Peking branch of the Red Laborers' Corps 全紅總北京分團 is founded, and some 30,000 march and demonstrate on Tiananmen Square 天安門廣場. Branches soon follow in Guizhou, Hunan, Heilongjiang,
        Guangxi, Guangdong, Jiangsu, Shanghai, Hebei, Inner Mongolia, Anhui and Jiangxi, and thousands of letters a day reach the Peking headquarters from dismissed workers.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 373. Made public: 2016. See [[cal.1966-11-18.china-leadership-3]].'
      src:
        c: '69346293'
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 373: all'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1966-12-08.china-leadership-3
      when: Dec. 8
      date: '1966-12-08'
      thread: china-leadership
      c: The All-China Federation of Trade Unions 中華全國總工會, on Li Fuchun's 李富春 approval, tells the contract and temporary workers that it supports their rebellion, that contract and temporary
        workers may not be dismissed without cause in the cultural revolution, and that the system can be studied for reform, a plan to go to the State Council. Ma Chungu 馬純古 had reported
        to the federation's head Liu Ningyi 劉寧一 and then, jointly, to Li Fuchun, who has charge of industry and communications.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 372–373. Made public: 1988. To check: Wang Nianyi 王年一, *Da dongluan de niandai* 《大動亂的年代》 (Henan renmin chubanshe, 1988), 154–155 (card [[w.nianyi-da-dongluande-niandai]])
        (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 373 n.6). Names: Li Fuchun.'
      src:
        c: d4b3233e
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 372–373: all'
      tags:
      - polity:prc
      - name:li-fuchun
      - ok:fields-place
- add:
    entry:
      id: cal.1966-12-25.china-leadership-5
      when: Dec. 25
      date: '1966-12-25'
      place: peking
      time: 1966-12-25T06:00Z
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: Peking. At 2 p.m. the Red Laborers' Peking branch drives propaganda cars onto Tiananmen Square; tens of thousands fill both sides of the Jinshui Bridge and stop traffic on Chang'an
        Avenue. After a speech by Wang Zhenhai 王振海 they march behind the cars to the Ministry of Labor 勞動部, reach it about 5 p.m. and ring it so that no one can pass, until 8 or 9 p.m.
        They had resolved to seal the ministry and the federation if the three-sided talks of Dec. 23 were put off again.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 373. The words: 12月25日下午2點 (I, 373). Made public: 2016.'
      src:
        c: 57982dc4
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 373: all'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1966-12-26.china-leadership-9
      when: Dec. 26
      date: '1966-12-26'
      place: peking
      time: 1966-12-26T12:00Z
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'At 8 p.m. in the East Hall 東會議廳 of the Great Hall of the People, Peking, Jiang Qing 江青, Kang Sheng 康生, Chen Boda 陳伯達, Zhang Chunqiao 張春橋, Yao Wenyuan 姚文元 and Qi Benyu 戚本禹,
        with Hu Chi 胡癡 of the *Jiefangjun bao* and Tang Pingzhu 唐平鑄, acting editor of the *Renmin ribao*, meet delegates of the Red Laborers'' Corps. Jiang''s first words: "Chairman
        Mao supports you"; contract workers are proletarians, "you ministers, how do you treat workers? these contract workers are like bonded laborers"; she weeps at the accounts of
        the dismissed who drowned or hanged themselves. The three points agreed: all contract and temporary workers to take part in the cultural revolution without discrimination; none
        to be dismissed, wages to be paid, and those dismissed since June 1, 1966 to go back at once with back pay; counter-revolutionaries excepted.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 374. The words: 12月26日晚8點 (I, 374). Made public: 2016. To check: Fang Yuan 方園, 〈自由工人運動的先驅——紀念獨立工會「全紅總」成立三十週年〉 (year not given) (cited by
        [[w.yang-jisheng-tiandi-fanfu]], I, 374 n.7). Names: Jiang Qing, Kang Sheng, Chen Boda, Zhang Chunqiao, Yao Wenyuan.'
      src:
        c: 1df04f5e
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 374: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 374 n.7: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:jiang-qing
      - name:kang-sheng
      - name:chen-boda
      - name:zhang-chunqiao
      - name:yao-wenyuan
- add:
    entry:
      id: cal.1966-12-27.china-leadership-4
      when: Dec. 27
      date: '1966-12-27'
      place: peking
      thread: china-leadership
      c: The All-China Federation of Trade Unions sends cars to fetch the heads of the Red Laborers' Corps and has them work in its building, lodging in the small grey building; the
        federation is paralyzed and the Corps runs all its work until the Corps is banned.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 375. Made public: 2016. See [[cal.1966-12-26.china-leadership-9]].'
      src:
        c: 315e9a5b
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 375: all'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1967-01-02.china-leadership-10
      when: Jan. 2
      date: '1967-01-02'
      place: peking
      thread: china-leadership
      c: 'The Red Laborers'' Corps, the Ministry of Labor and the All-China Federation of Trade Unions sign a joint notice on Jiang Qing''s 江青 three points: contract, temporary and outside-contract
        workers are not to be dismissed, those dismissed since June 1, 1966 are to be recalled at once with back pay, and those hit by the bourgeois reactionary line are to be redressed.
        It is set in 300,000 copies in red at the *Gongren ribao* printing house and reported to the Group and the State Council.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 375. Made public: 2016. See [[cal.1966-12-27.china-leadership-4]]. Names: Jiang Qing.'
      src:
        c: 4b546bf4
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 375: all'
      tags:
      - polity:prc
      - name:jiang-qing
- add:
    entry:
      id: cal.1967-01-04.china-leadership-11
      when: Jan. 4
      date: '1967-01-04'
      thread: china-leadership
      c: Early. The Cultural Revolution Group decides to hold the joint notice back, then to destroy the copies already printed. Some of the Corps, unwilling to lose what they have won,
        reprint it in large numbers at Kunming and send it over the country, hoping to make it an accomplished fact.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 375. Made public: 2016. See [[cal.1967-01-02.china-leadership-10]].'
      src:
        c: d27321d1
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 375: all'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1967-01-08.china-leadership-7
      when: Jan. 8
      date: '1967-01-08'
      place: peking
      time: 1967-01-08T12:00Z
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'At 8 p.m. in the great conference hall of the Xiyuan Hotel 西苑飯店, Peking, the Red Laborers'' Corps convenes a "Symposium of the Revolutionary Left of the Five Continents": over
        a hundred foreign diplomats, resident journalists, left-wing bodies'' representatives and Chinese-employed experts attend, Li Dunbai 李敦白, an American in China since 1945, chairing
        and interpreting, Xiao Bihuang 蕭碧璜 presiding; Wang Zhenhai 王振海 speaks for the Corps and the other headquarters members tell of the temporary and contract workers'' sufferings;
        the foreign correspondents ask questions; it ends near midnight.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 375. The words: 1月8日晚8時 (I, 375). Made public: 2016.'
      src:
        c: 2bcbf8e3
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 375: all'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1967-01-16.china-leadership-7
      when: Jan. 16
      date: '1967-01-16'
      place: peking
      time_range:
      - 1967-01-16T11:00Z
      - 1967-01-16T14:00Z
      time_band: evening
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: Evening. The Red Laborers' Corps holds a rally of 10,000 at the Workers' Gymnasium 北京工人體育館, Peking. Zhou Enlai 周恩來 requires beforehand two chief slogans, "Go back to your old
        homes and make revolution on the spot!" and "Grasp revolution, promote production!", and wants the Corps to use the rally to see that the temporary and contract workers who have
        come to Peking return home at once.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 376. The words: 1月16日晚 (I, 376). Made public: 2016. Names: Zhou Enlai.'
      src:
        c: 28238ee2
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 376: all'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1967-01-17.china-leadership-6
      when: Jan. 17
      date: '1967-01-17'
      thread: china-leadership
      c: At a meeting with the Capital Red Guards' First, Second and Third Headquarters, the PLA's art bodies and the rebels of the State Council's ministries, Jiang Qing 江青 reverses
        her support of the Red Laborers' Corps and tells the capital's rebels to "press them back."
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 376. Made public: 2016. See [[cal.1967-01-16.china-leadership-7]]. Names: Jiang Qing.'
      src:
        c: ac0c82be
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 376: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:jiang-qing
      - ok:fields-place
- add:
    entry:
      id: cal.1967-01-19.china-leadership-7
      when: Jan. 19
      date: '1967-01-19'
      thread: china-leadership
      c: Zhou Enlai's 周恩來 office notifies the Red Laborers' Corps that there can be no nationwide mass organizations and the Corps' people are to go back to their own places to grasp
        revolution and promote production.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 376. Made public: 2016. See [[cal.1967-01-17.china-leadership-6]]. Names: Zhou Enlai.'
      src:
