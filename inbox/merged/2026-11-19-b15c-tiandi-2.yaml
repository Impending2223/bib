    id: cal.1967-01-10.china-leadership
    add: Xi Xuan 席宣 and Jin Chunming 金春明, *"Wenhua dageming" jianshi* 《「文化大革命」簡史》, enlarged ed. (2011), 122 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 350 n.43)
- cite:
    id: cal.1967-01-22.china-leadership-3
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 351 (at the wired-broadcast meeting of out-of-town masses in Peking, 800,000 in all, main hall the Great Hall of the People, Zhou says
      Mao decided in person to broadcast the Message and the Urgent Notice, announcing a new stage of the cultural revolution, whose chief fighting task is for the proletarian revolutionaries
      to unite and seize from the handful of capitalist-roaders in the Party the Party, government and financial power; only the seizure by the revolutionary masses can destroy the bourgeois
      reactionary line and beat back its new counterattack and put down economism)'
