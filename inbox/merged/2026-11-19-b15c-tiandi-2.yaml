      thread: china-leadership
      c: 'A leader of the Sichuan committee, at the committee''s meeting of the colleges'' "liaison men": the students, having found nothing big against the committee, want a pretext
        to make a "Hungarian incident" in the Chengdu area and lay the blame on us; organize the students to expose the plot.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 294. Made public: 2016.'
