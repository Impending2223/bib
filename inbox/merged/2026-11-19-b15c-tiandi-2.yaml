- cite:
    id: cal.1968-07-28.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 326–327 (Mao to the five rebel leaders: "some say the Guangxi notice applies only to Guangxi and the Shaanxi notice only to Shaanxi; now
      a notice will go out for the whole country: whoever goes on attacking the army, robbing army stores, wrecking communications, killing and burning is committing a crime; if a few
      will not heed advice, they are bandits, Kuomintang, and are to be surrounded and encircled and, if they hold out, annihilated"; Han Aijing''s record notes that at the end both
      Mao and the rebels wept; Mao also says that the half year of suspended classes announced became a year, then two, and "I said three years, so three years"; Yang adds that after
      this the Guangxi "4·22" suffered a massacre of 100,000)'
- to-check:
    id: cal.1968-07-28.china-leadership
    add: 'Han Aijing 韓愛晶, record of Mao''s five-and-a-half-hour talk, in Qi Zhi 啟之, ed., *Shuimu fengyu: Beijing Qinghua daxue wenge shi* 《水木風雨:北京清華大學文革史》 (Taipei, Mar. 2014), 157 (cited
      by [[w.yang-jisheng-tiandi-fanfu]], I, 324 n.21)'
