      when: Jan. 31
      date: '1967-01-31'
      place: peking
      thread: china-leadership
      c: 'The *Renmin ribao* 人民日報, Peking, early reprints the *Hongqi* 紅旗 editorial for Feb. 3, "On the Proletarian Revolutionaries'' Struggle to Seize Power" 〈論無產階級革命派的奪權鬥爭〉, which
        Mao revised in person: the old state machine cannot be taken over ready-made but "must be smashed completely," and new forms of the dictatorship of the proletariat created.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 357. Made public: 1998 (Mao''s revision). To check: *Jianguo yilai Mao Zedong wengao* 《建國以來毛澤東文稿》, vol. 12 (Zhongyang wenxian chubanshe,
        1998), 210 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 357 n.54). See [[cal.1967-01-30.china-leadership-2]]. Names: Mao Zedong.'
      src:
        c: 94c7cdca
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 357: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 357 n.54: all'
      tags:
