      thread: china-leadership
      c: 'Peking Normal University 北京師范大學. At 10 a.m. Sun Youyu 孫友余, head of the work group, broadcasts on the poster put up that morning by Tan Houlan 譚厚蘭 and sixteen other students,
        "Where does Sun Youyu mean to lead the movement?": it is ulterior, their fate is tied to the ox-demons, a planned and organized premeditated act. He opens the struggle to "sweep
        the periphery" and "resist interference."'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 198–199. The words: 上午10時 (I, 199). Made public: 1967. To check: Hongweibing shoudu sansi 紅衛兵首都三司, ed., *Tianfan difu kai er kang: wuchanjieji
