      c: Peking. In the morning Red Guards shave old teachers' heads in the "yin-yang" cut, burn the school library's books on the sports ground and make the staff kneel round the fire
        with their arms held out to it; the woman principal, Lin Jin 林瑾, is pushed onto the fire. The librarian Shen Shimin 沈世敏, burned and refused treatment at the hospital, hangs herself
        that night; the mathematics teacher Du Zhaonan 杜兆南, called a "fugitive landlord" and sent back to his village, lies on the railway; the Chinese teacher Wang Jingqing 王景清 jumps
        from a building; the mathematics teacher Li Panqing 李泮請 and his wife hang themselves; the school doctor Huo Ziqi 霍自岐 takes sleeping pills; the janitors Lin Shihui 林士慧 and Chen
        Yuhe 陳玉和 take poison. Eight die at the school.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 268. The words: 8月26日上午 (I, 268). To check: Wang Youqin 王友琴, 〈恐怖的紅八月〉, *Yanhuang chunqiu* 《炎黃春秋》, 2010, no. 10 (cited by [[w.yang-jisheng-tiandi-fanfu]],
