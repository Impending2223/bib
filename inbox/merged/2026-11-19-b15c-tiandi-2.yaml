      c: 'Shanghai. Without a clear instruction from the Center, the municipal committee draws up "Provisional Opinions on Several Concrete Questions in Consultation with the Masses"
        〈在與群眾協商時對幾個具體問題的暫行處理意見〉, seven articles: the wages and welfare of temporary and outside-contract workers, and the labor insurance, sick-leave and maternity pay, apprenticeship
