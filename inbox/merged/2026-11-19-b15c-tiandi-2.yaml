      - polity:prc
      - name:mao-zedong
- cite:
    id: cal.1967-12-06.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 361 (Dec. 6, 1967, members and staff of the committee gather in the old municipal committee building, hang up the "Tianjin Revolutionary
      Committee" sign and eat "bitter-memory meals" of coarse grain and chaff in the basement; Xie Xuegong 解學恭, the committee''s head, speaks; the committee is made of one office, two
      headquarters and six groups with 414 people, cut after three months to two departments and four groups)'
- add:
    entry:
      id: cal.1967-02-19.china-leadership-9
      when: Feb. 19–20
      date: '1967-02-19'
      time: 1967-02-19T14:00Z
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'At 10 p.m., by his own account, Tan Qilong 譚啟龍, Shandong first secretary, held in the medical college after being struggled against, is told that Yang Dezhi 楊得志 has had Zhou
        Enlai''s 周恩來 instruction to bring him to Peking: Zhou''s special plane waits at the airport at 8 a.m. He bathes and eats a Western meal at the airport guest house, and next morning
        lands in Peking and is lodged in a suite on the ninth floor of the Jingxi Hotel 京西賓館, where he finds most of the East China provincial secretaries.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 365. The words: 晚10點鐘 (I, 365). The time is the first day''s. Made public: 2003. To check: *Tan Qilong huiyilu* 《譚啟龍回憶錄》 (Zhonggong dangshi
        chubanshe 中共黨史出版社, 2003), 646–650 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 365 n.74). Names: Zhou Enlai.'
      src:
