    entry:
      id: cal.1966-09-15.china-leadership-8
      when: Sept. 15
      date: '1966-09-15'
      thread: china-leadership
      c: The Hunan committee 湖南省委 issues a notice requiring leaders at all levels to put the cause of the Party and the people first, hold their posts and uphold the Party's correct
        leadership, "straighten the back and shoulder the load." Xiangtan's deputy secretary Cheng Zhenmao 程貞茂, Party secretary of the Xiangtan Electrical Machinery Plant, takes the
        lead and seizes the "great black ghost" Lan Yunfei 蘭雲飛, the plant's propaganda head who supported the rebels.
