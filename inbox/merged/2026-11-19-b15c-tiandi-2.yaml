      - ok:fields-time
- add:
    entry:
      id: cal.1966-12-17.china-leadership-3
      when: Dec. 17
      date: '1966-12-17'
      place: peking
      thread: china-leadership
      c: 'Peking Capital Stadium 北京體育場. At the rally "to defend Mao''s revolutionary line and win new victories" of over 100,000 teachers, students and cadres of Peking and out of town,
        Jiang Qing 江青 and Chen Boda 陳伯達 criticize the Pickets; Zhou Enlai 周恩來 says that a handful of the pickets did things against the law and the Center''s rules and were arrested
        for education: the pickets in 1927 were workers'' guards against strike-breakers and gendarmes, but the Red Guard pickets did the opposite and became "managers of the Red Guards";
        he proposes that the schools drop the name.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 280. Made public: 1966. To check: Zhongyang shouzhang zai quanguo zai Jing zaofanpai pipan fandong luxian dahui shang de jianghua 〈中央首長在全國在京造反派批判反動路線大會上的講話〉,
        Dec. 17, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 280 n.71). See [[cal.1966-12-16.china-leadership-5]]. Names: Jiang Qing, Chen Boda, Zhou Enlai.'
      src:
        c: b121d73d
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 280: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 280 n.71: all'
