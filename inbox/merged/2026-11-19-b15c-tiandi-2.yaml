- cite:
    id: cal.1967-01-01.china-leadership-9
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 348–349 (Chen Pixian, in uniform as first political commissar of the Shanghai Garrison, tells the committee meeting that Zhou has just
      rung; from Dec. 30 for 26 hours 26 passenger trains were stopped, over 50,000 passengers could not board and over 50,000 stranded on the way, 38 freight trains stopped and 22 halted,
      tens of thousands of tons of goods piled up, and Shanghai has only a week''s grain; Xu Jingxian, standing opposite, blames Chen as the real commander behind Cao Diqiu, reads Zhang
      Chunqiao''s telephone record, and proposes a joint statement drafted by Central Conservatory and Jiaotong University students and agreed by Chen)'
