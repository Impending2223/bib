- cite:
    id: cal.1968-07-27.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 325–326 (July 27, 1968 Mao sends 30,000 workers and army men as the Capital Workers'' and Army Mao Zedong Thought Propaganda Team into
      Tsinghua, ending the fighting; the two student groups perish together; the "hundred-day great armed fight" began Apr. 23, 1968, and eleven students died in it)'
- add:
    entry:
      id: cal.1968-07-17.china-leadership-3
      when: July 17
      date: '1968-07-17'
      place: peking
      thread: china-leadership
      c: Peking Aeronautical Institute 北京航空學院, Peking. Rebel leaders from the provinces, among them Wu Chuanbin 武傳斌 of Zhongshan University's "8·31" and the leader of Canton's "Red Flag"
        faction, with the Guizhou "4·11," Guangxi "4·22," Qinghai "8·18," Liaoning "8·31," Henan "Feb. 7 Commune," Sichuan "Oppose to the End" and Heilongjiang "Bombardment" groups,
        meet to find a way out; Kuai Dafu 蒯大富 listens a while and leaves. The Proletarian Headquarters later brands it a "black meeting."
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 325. Made public: 2016.'
      src:
        c: 3294330a
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 325: all'
      tags:
      - polity:prc
      - vis:only:prc
