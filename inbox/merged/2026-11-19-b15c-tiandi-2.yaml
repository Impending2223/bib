      when: Nov. 18
      date: '1966-11-18'
      place: shanghai
      thread: china-leadership
      c: 'Municipal Children''s Palace 市少年宮, Shanghai. Cao Diqiu 曹荻秋, mayor, receives Li Jianyu 李劍鈺 and his group. Li asks whether, as the rebels have a city-wide body, a city-wide body
        may be set up to match it; Cao advises a provisional preparatory body, as flexible, with a way back should the Center later disagree. The committee''s spirit then: if the majority,
        the conservatives, wish to organize, let them.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 345–346. Made public: 2009. To check: Li Xun 李遜, 〈馬驥、李劍鈺回憶文革中的上海工人赤衛隊〉, *Jiyi* 《記憶》, no. 31 (Apr. 30, 2009) (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 346 n.34). See [[cal.1966-11-15.china-leadership-4]].'
