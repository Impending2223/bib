    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 349 (the "Message to All Shanghai Citizens" 〈告上海全市人民書〉 is signed by the Workers'' General HQ and 10 other mass bodies (11 in all), is printed
      in the *Wenhui bao* on Jan. 5 in 200,000 copies at Chen Pixian''s signing, and says 1967 will be the year of the bourgeois reactionary line''s total collapse and the proletarian
      cultural revolution''s decisive victory; Xu Jingxian and Wang Hongwen 王洪文 go to Kunshan to deal with the Scarlet Guards)'
