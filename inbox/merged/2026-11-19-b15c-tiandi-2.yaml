      - name:mao-zedong
- cite:
    id: cal.1967-01-30.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 357 (Mao, reading it on Jan. 30: "I have read this and find it very good" 此件我看了，認為很好)'
- add:
    entry:
      id: cal.1967-02-02.china-leadership-5
      when: Feb. 2
      date: '1967-02-02'
      place: shanghai
      thread: china-leadership
      c: On the proposal of Zhang Chunqiao 張春橋 and Yao Wenyuan 姚文元 the 41 bodies of the preparatory committee of the Shanghai People's Commune 上海人民公社籌委會 meet at the Shanghai branch of
        Xinhua and decide to set up at once a Paris-Commune-style temporary city-wide supreme organ of power, to be formally named the Shanghai People's Commune.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 357–358. Made public: 2013. To check: *Xu Jingxian de zuihou huiyi* 《徐景賢的最后回憶》 (2013), 421 (cited by [[w.yang-jisheng-tiandi-fanfu]], I,
        358 n.55). Names: Zhang Chunqiao, Yao Wenyuan.'
      src:
        c: a031f269
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 357–358: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 358 n.55: all'
      tags:
      - polity:prc
      - name:zhang-chunqiao
      - name:yao-wenyuan
      - ok:fields-time
- cite:
    id: cal.1967-02-05.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 358, 360 (Feb. 5, a mass meeting of 1,000,000 proclaims the Shanghai People''s Commune; the "Shanghai People''s Committee" sign is taken
      down and smashed with an iron hammer and the Commune''s big sign put up, and a parade follows; the "Declaration of the Shanghai People''s Commune" speaks of smashing the state
      organs usurped by revisionists and creating a new local organ of proletarian dictatorship)'
- cite:
    id: cal.1967-02-12.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 360 (on Feb. 12 Mao has Zhang Chunqiao and Yao Wenyuan called back from Shanghai to Peking, Wang Li meeting them at the airport and taking
      them to Mao''s swimming pool; Mao approves the Shanghai work but says Peking had considered a Peking commune and then thought the matter reached too far, to the whole state system,
      the revision of the constitution, and above all foreign recognition: "change the Shanghai commune back; better call it a revolutionary committee")'
- to-check:
    id: cal.1967-02-12.china-leadership
