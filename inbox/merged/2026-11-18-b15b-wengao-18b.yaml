- add:
    entry:
      id: cal.1966-04.china-leadership-7
      when: Apr.
      date: '1966-04'
      thread: china-leadership
      c: 'Mao, on the *Jizhe jianbao* 记者简报 of Mar. 30, compiled by the Peking office of the *Wenhui bao* 文汇报 and sent him by Jiang Qing 江青 Apr. 1, on historians'' reactions to the article of Qi Benyu 戚本禹 and others in *Hongqi* 红旗 of Mar. 25, "Comrade Jian Bozan''s 翦伯赞 historical views should be criticized": "Read. Back to Jiang Qing."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 241 (Apr. 1966; Mao''s note, April; printed from the manuscript; note 1: some historians held the article one-sided, the "concession policy" 让步政策 not Jian''s main question, and Chen Boda the first to put it forward, in *Jiefang* 解放 in 1941). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Wenhui bao, Peking office, Jizhe jianbao of Mar. 30, 1966, on historians'' reactions to the Hongqi article criticizing Jian Bozan (sent to Mao by Jiang Qing Apr. 1) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 241 n.1a); Qi Benyu and others, "Comrade Jian Bozan''s historical views should be criticized," Hongqi, Mar. 25, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 241 n.1b). Names: Mao Zedong, Jiang Qing, Qi Benyu, Jian Bozan. Check: the day; the Wengao gives April and Jiang Qing''s sending of Apr. 1.'
