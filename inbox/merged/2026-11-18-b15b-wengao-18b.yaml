      when: Apr. 23
      date: '1966-04-23'
      thread: china-leadership
      c: 'Mao, on the Center General Office Education Office''s bulletin of Apr. 19 on the Higher Education Ministry''s meeting of Apr. 17: "This is good"; to go to the comrades at the enlarged Standing Committee meeting at Hangzhou 杭州. College teachers and students, middle-school teachers and senior middle-school students everywhere should join the Cultural Revolution.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 254–255 (Apr. 23, 1966; Mao''s note; printed from the manuscript; note 2: the meeting at Hangzhou, Apr. 16–24). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Center General Office, Education Office, bulletin of Apr. 19, 1966 on the Higher Education Ministry Party committee''s meeting of Apr. 17 with ten Peking and Tianjin colleges on the academic criticism (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 254 n.1). Names: Mao Zedong.'
      tags:
