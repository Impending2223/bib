- cite:
    id: cal.1966-04-14.china-leadership-2
    item: '[[w.jianguo-yilai-mao-zedong]], XVIII, 246–253 (Apr. 14, 1966; Mao''s notes of the morning of Apr. 14: to Zhou Enlai, Deng Xiaoping, Peng Zhen and Kang Sheng, "some revisions, please consider"; at 8:30 a.m., sending two copies of the Peking draft for changes, Kang Sheng and Chen Boda to go to Shanghai that day or the next to discuss it and report to him on the night of the 16th; at 9 a.m., to Zhou, Deng and Peng 彭真, their letter of Apr. 12 with its enclosure received, Kang and Chen and the drafting group to go to Shanghai, then to him the night of the 16th or the morning of the 17th, the three to come on the 16th, whether the Center bureaus send men theirs to decide; his insertions, items 5–11 (on no equality between proletariat and bourgeoisie; the bourgeois representatives in Party, government and army, some trusted and groomed as successors "like Khrushchev," sleeping beside us); note 1: the notice adopted May 16 by the enlarged Politburo, printed in *Renmin ribao* May 17, 1967; note 2: Deng then with Mao at Hangzhou)'
    units: A, B
