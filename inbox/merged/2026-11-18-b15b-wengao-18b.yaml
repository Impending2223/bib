      when: Apr. 14
      date: '1966-04-14'
      thread: china-leadership
      c: 'Mao, on a passage of his opening address to the first plenary session of the Chinese People''s Political Consultative Conference 中国人民政治协商会议, Sept. 21, 1949 (the imperialists and domestic reactionaries will not accept defeat, will try every day and hour to restore their rule; vigilance not to be relaxed), in the Center General Office''s compilation of his instructions on confidential and secrecy work 机要保密工作: "This passage is put accurately; comrades should discuss this question often."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 245 (Apr. 14, 1966; Mao''s note, dated Apr. 14, 1966; printed from the manuscript; note 1: the compilation made in Feb. 1966 for those attending the national conference on confidential and secrecy work 全国机要保密会议). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Center General Office, compilation of Mao Zedong''s instructions on confidential and secrecy work, Feb. 1966, for the national conference on confidential and secrecy work (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 245 n.1a). Names: Mao Zedong.'
