- add:
    entry:
      id: cal.1966-04-17.china-leadership-2
      when: Apr. 17
      date: '1966-04-17'
      thread: china-leadership
      c: Peking. The Party committee of the Ministry of Higher Education 高等教育部 meets the Party secretaries and propaganda heads of ten colleges of Peking and Tianjin 天津 on carrying the academic criticism deeper. Peking University and others report it more academic than political; the struggle one of two roads on the literary, art and educational front 文艺教育战线, to seize the leadership of education; all college work to be tied to it; the masses to be roused.
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 254–255 (Apr. 17, 1966; note 1, from the Center General Office Education Office''s 中共中央办公厅教育办公室 bulletin of Apr. 19). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Center General Office, Education Office, bulletin of Apr. 19, 1966 on the Higher Education Ministry Party committee''s meeting of Apr. 17 with ten Peking and Tianjin colleges on the academic criticism (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 254 n.1). Check: whether the notes of the first edition give it.'
