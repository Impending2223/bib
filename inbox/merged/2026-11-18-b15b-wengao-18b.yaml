- add:
    entry:
      id: cal.1966-04.china-leadership-9
      when: Apr., after the 4th
      date: '1966-04'
      thread: china-leadership
      at: after 1966-04-04
      c: 'Mao, on Hu Qiaomu''s 胡乔木 letter of Apr. 5 on points in the annotated edition of *Mao zhuxi shici* 毛主席诗词: he rewrites the headnote proposed for "Butterflies Love Flowers: From Tingzhou to Changsha" 蝶恋花·从汀州向长沙 (June–July 1930; the attack on Changsha wrong; on his persuasion the Red Army divided to take county towns instead); on the two readings proposed for "Swimming" 游泳 and "Farewell to the God of Plague" 送瘟神: "Can be done"; on the envelope: "Read. Back to Qiaomu."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 256–258 (Apr. 1966; Mao''s revision and notes; printed from his revised copy and the manuscript; note 4: the headnote revised again in [[w.mao-zedong-shici-xuan]] and [[w.mao-zedong-shici-ji]]). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Hu Qiaomu, letter to Mao Zedong of Apr. 5, 1966 asking instructions on three points in the annotated edition of Mao zhuxi shici (a headnote for "From Tingzhou to Changsha," readings in "Swimming" and "Farewell to the God of Plague") (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 257 n.1). Names: Mao Zedong, Hu Qiaomu. Check: the day; the Wengao gives April, after the letter of Apr. 5.'
      tags:
      - polity:prc
      - name:mao-zedong
