      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 247, 253 (Apr. 1966; item four; Mao''s note; printed from the manuscript; note 5 gives Kang''s report). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Kang Sheng, report to Mao Zedong of Apr. 18, 1966 sending the Apr. 17 revision of the notice withdrawing the Five-Man Group''s Outline (article seven''s last sentence revised at Mao''s direction) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 253 n.5). See [[cal.1966-04-14.china-leadership-2]]. Names: Mao Zedong, Kang Sheng. Check: the day; the Wengao gives April, after Kang''s report of Apr. 18.'
