        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 speaks at the sixth plenary of the North China group 华北组 of the Ninth Congress 中共九大: he has been with Chairman Mao more than forty years, nearly every day; decades of experience show he did not oppose Chairman Mao; to call him a "three-anti element" 三反分子 does not fit the facts, so he has not admitted it. The nianpu''s note: three-anti, against the Chinese Communist Party, socialism and Mao Zedong Thought.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1968. Made public: 2016. See [[cal.1969-04-01.china-leadership]]. Names: Zhu De, Mao Zedong.'
