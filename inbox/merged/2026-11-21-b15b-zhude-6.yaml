        tags: ['polity:prc', 'ok:fields-place', 'name:kang-sheng', 'name:liu-shaoqi', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1967-01-01.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1960 (Jan. 1, 1967; the *Renmin ribao* 《人民日报》 and *Hongqi* 《红旗》 New Year editorial, passed by Mao Zedong 毛泽东, "Carry the Great Proletarian Cultural Revolution through to the end" 《把无产阶级文化大革命进行到底》: 1967 will be "a year of all-round class struggle across the country," "of general attack" on the handful in the Party in authority taking the capitalist road and the ox-demons and snake-spirits in society)'}
  - cite: {id: cal.1967-01-02.china-leadership-5, item: '[[w.zhu-de-nianpu-xinbian]], III, 1960 (Jan. 2, 1967; Zhu De 朱德, with Zhou Enlai 周恩来, Xiao Hua 萧华, Yang Chengwu 杨成武 and others, receives the Romanian army''s song and dance ensemble 罗马尼亚军队歌舞团 and watches its performance)'}
  - cite: {id: cal.1967-01-06.china-leadership-3, item: '[[w.zhu-de-nianpu-xinbian]], III, 1960 (Jan. 6, 1967; planned and directed by Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元, Shanghai''s "rebels" under Wang Hongwen 王洪文 seize the power of Shanghai''s Party and government, raising the so-called "January Storm" 一月风暴)'}
  - cite: {id: cal.1967-01-08.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1960 (Jan. 8, 1967; Mao Zedong 毛泽东 affirms the Shanghai rebels'' seizure of power: "This is a great revolution, a great revolution of one class overthrowing another"; after it the seizure of the leadership at every level of Party and government by "rebels" sweeps the country, and the Cultural Revolution enters the stage of "all-round seizure of power")'}
  - cite: {id: cal.1967-01-11.china-leadership-2, item: '[[w.zhu-de-nianpu-xinbian]], III, 1960 (Jan. 11, 1967; Zhu De 朱德 at the enlarged Politburo meeting 中共中央政治局扩大会议 Lin Biao 林彪 presides over, which adopts the Center''s 中共中央 notice against economism 《中共中央关于反对经济主义的通知》 and other papers and names Xu Xiangqian 徐向前 head of the All-Army Cultural Revolution Group 全军文革小组, Jiang Qing 江青 adviser and Xiao Hua 萧华 and Yang Chengwu 杨成武 deputy heads; Zhu De speaks: the movement has gone so far as to harm production, forgetting "grasp revolution, promote production," a new problem to be solved; armed fighting goes on though long forbidden, even to smashing machines and burning houses, with counter-revolutionaries making trouble among them)'}
  - variant: {id: cal.1967-01-11.china-leadership-2, unit: B, witness: w.zhu-de-nianpu-xinbian, reads: 'Jan. 11, 1967: an enlarged Politburo meeting, Lin Biao presiding', at: 'III, 1960'}
  - add:
      entry:
        id: cal.1967-01-14.china-leadership-9
        when: Jan. 14
        date: '1967-01-14'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Zhu De 朱德, after reading the papers, writes in his notebook: America 美国 sends 100,000 more troops to Vietnam 越南 and adds $12 to $15 billion to the war''s cost, to prepare a long war there; we must strengthen national defense the more.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1961. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967-01.china-leadership-45
        when: Jan., late
        date: 1967-01
        at: before 1967-01-21
        place: peking
        thread: china-leadership
        c: 'The Chinese People''s University 中国人民大学, Peking 北京. Qi Benyu 戚本禹, for the Central Cultural Revolution Group 中央文革, reads the wall posters and receives the heads of the two factions'' mass organizations: "Sun Yang 孙泱 was Zhu De''s 朱德 secretary; through Sun Yang''s question you can clear up Zhu De''s." The nianpu''s note: Sun Yang, then vice-president of the University, son of the revolutionary martyr Sun Bingwen 孙炳文, once Zhu De''s secretary.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1961. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-01.china-leadership-46
        when: Jan., late
        date: 1967-01
        at: before 1967-01-21
        place: peking
        thread: china-leadership
        c: Peking 北京. That evening the mass organizations cover the Chinese People's University 中国人民大学 and the streets and lanes of Peking with great slogans, "Down with Zhu De 朱德," "Zhu De is a great warlord."
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1961. See [[cal.1967-01.china-leadership-45]]. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-time', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-01.china-leadership-47
        when: Jan., late
        date: 1967-01
        at: before 1967-01-21
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Nie Yuanzi 聂元梓, head of the Peking University 北京大学 rebels, hearing of Qi Benyu''s 戚本禹 words: "Tsinghua 清华大学 dragged out Liu Shaoqi 刘少奇; this time we must do a big one too." She has the "New Peking University Commune" 新北大公社 and the "Revolutionary Rebel Corps" of the Chinese Writers'' Association 中国作家协会 form a "joint criticism group" 联合批判班子 to concoct articles slandering Zhu De 朱德, in the name of criticizing *Biography of General Zhu De* 《朱德将军传》, the manuscript the writer Liu Baiyu 刘白羽 wrote in the war years.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1961. Made public: 2016. See [[cal.1967-01.china-leadership-45]]. Names: Zhu De, Liu Shaoqi.'
        tags: ['polity:prc', 'name:zhu-de', 'name:liu-shaoqi', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967-01.china-leadership-48
        when: Jan., late
        date: 1967-01
        at: before 1967-01-21
        thread: china-leadership
        c: 'Mao Zedong 毛泽东, at the Military Commission''s briefing meeting 中共中央军委碰头会: "Zhu De 朱德 must still be protected."'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1961. Made public: 2016. Names: Mao Zedong, Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:mao-zedong', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967-02-02.china-leadership-7
        when: Feb. 2
        date: '1967-02-02'
        place: peking
        thread: china-leadership
        c: Peking 北京. Several rebel bodies of the Chinese People's University 中国人民大学 hold a rally denouncing the "monstrous crimes against the Party, socialism and Mao Zedong Thought of the great warlord and great careerist Zhu De 朱德," then parade through the city. They found a "Seize-Zhu liaison station" 揪朱联络站 of the rebel bodies of a dozen units, whose notice calls on the rebels of the country and of Peking to "drag out the black commander Zhu and struggle him down, struggle him flat, struggle him till he stinks!", and resolve to hold a "rally to criticize and struggle Zhu De" in the Peking Workers' Stadium 北京工人体育场 on Feb. 20.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1961. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-02.china-leadership-48
        when: Feb., before the 20th
        date: 1967-02
        at: before 1967-02-20
        thread: china-leadership
        c: Zhou Enlai 周恩来 intervenes, and the rally against Zhu De 朱德 set for Feb. 20 is not held. Smaller criticism meetings, "Seize-Zhu" 揪朱 parades, wall posters, great slogans, handbills and tabloids go on in numbers.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1961. Made public: 2016. See [[cal.1967-02-02.china-leadership-7]]. Names: Zhou Enlai, Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhou-enlai', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967-02.china-leadership-49
        when: Feb., early
        date: 1967-02
        at: before 1967-02-01
        thread: china-leadership
        c: The "Seize-Zhu liaison station" 揪朱联络站 sends many men from Peking 北京 across the country to "investigate" Zhu De's 朱德 "problems" through his secretaries, colleagues, kin and friends.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1961–1962. See [[cal.1967-02-02.china-leadership-7]]. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-02.china-leadership-50
        when: Feb., early
        date: 1967-02
        at: before 1967-02-01
        place: yilong
        thread: china-leadership
        c: 'Yilong county 仪陇县, Sichuan 四川省, Zhu De''s 朱德 home district. Men of the Chinese People''s University 中国人民大学, as a "Seize-Zhu corps" 揪朱兵团, stir the people against him: a "denunciation" rally in the county cinema; they break into the "exhibition room of Zhu De''s old home" 朱德旧居陈列室 and wreck relics and fittings.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1962. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-02.china-leadership-51
        when: Feb., early
        date: 1967-02
        at: before 1967-02-01
        place: tianjin
        thread: china-leadership
        c: Tianjin 天津. Men of the "Seize-Zhu liaison station" 揪朱联络站 raid the home of Zhu Qi 朱琦, Zhu De's 朱德 son, and force his wife Zhao Liping 赵力平 to tell Zhu De's "crimes."
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1962. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-02.china-leadership-52
        when: Feb., early
        date: 1967-02
        at: before 1967-02-01
        thread: china-leadership
        c: Zhu Qi 朱琦, Zhu De's 朱德 son, is held by the rebels of his own unit.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1962. See [[cal.1967-02.china-leadership-51]]. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-02-16.china-leadership-10
        when: Feb. 16
        date: '1967-02-16'
        place: peking
        thread: china-leadership
        c: Peking 北京. The *Xin Beida* 《新北大》, the paper of the Peking University 北京大学 rebels, prints "The self-confession of Zhu De 朱德, great careerist usurping the Party and the army" 《篡党篡军大野心家朱德的自供状》. The paper is printed in more than 500,000 copies and sent all over the country.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1962. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-02.china-leadership-53
        when: Feb., after the 16th
        date: 1967-02
        at: after 1967-02-16
        place: peking
        thread: china-leadership
        c: 'Peking 北京. The *Xin Beida* 《新北大》 puts out "Forger of history, anti-Party careerist: the great plot of *Biography of General Zhu De* exposed again" 《历史的伪造者、反党的野心家——再揭〈朱德将军传〉的大阴谋》.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1962. See [[cal.1967-02-16.china-leadership-10]]. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-02-22.china-leadership-6
        when: Feb. 22
        date: '1967-02-22'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. The *Hongwei zhanbao* 《红卫战报》 of the Chinese People''s University 中国人民大学 rebels, issue 7, prints a short comment, "Down with Zhu De" 《打倒朱德》: Zhu De 朱德 "has become one of the greatest in authority taking the capitalist road in our Party, a great time bomb planted at Chairman Mao''s side"; with it "Zhu De''s ''three-anti'' words" 《朱德"三反"言论》 and "The ''three-anti'' old hand Zhu De''s crimes are many" 《"三反"老手朱德罪恶累累》.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1962. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967-02.china-leadership-54
        when: Feb.
        date: 1967-02
        thread: china-leadership
        c: 'Zhu De 朱德, at his residence, receives Jiang Weiqing 江渭清, first secretary of the Jiangsu provincial committee 中共江苏省委: "Stopping work to make revolution is neither the Chairman''s view nor the Center''s; it is the rebels who would have it so, and they punish people very harshly." He urges him: "Be patient; bear a moment''s anger and spare a hundred days'' grief; without patience a small matter grows big."'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1962. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967-02.china-leadership-55
        when: Feb.
        date: 1967-02
        thread: china-leadership
        c: 'Zhu De 朱德 to his wife Kang Keqing 康克清, struggled by the rebels in the offices of the All-China Women''s Federation 全国妇联: "Do not fear their struggle meetings; go to the office every day. The masses are reasonable; be with them, and they will not struggle you every day."'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1962. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1967-02-25.china-leadership-5, item: '[[w.zhu-de-nianpu-xinbian]], III, 1963 (Feb.–Mar. 1967; the Center 中共中央 meets many times to criticize the so-called "February adverse current" 二月逆流; Zhu De 朱德 too is wrongly criticized; after it the Politburo 中共中央政治局 in effect stops working, replaced by the Central Cultural Revolution Group 中央文革小组)'}
  - cite: {id: cal.1967-02-16.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1963 (the nianpu''s note: at the Politburo briefing meetings 中共中央政治局碰头会 Zhou Enlai 周恩来 presides over, Feb. 11–16, 1967, Tan Zhenlin 谭震林, Chen Yi 陈毅, Ye Jianying 叶剑英, Li Fuchun 李富春, Li Xiannian 李先念, Xu Xiangqian 徐向前, Nie Rongzhen 聂荣臻 and others fight back against Lin Biao''s 林彪 and Jiang Qing''s 江青 persecution of old cadres and disordering of Party and army, their views coming to one point, whether the Party''s leadership is still wanted; their resistance is slandered as the "February adverse current")'}
  - add:
      entry:
        id: cal.1967-03-04.china-leadership-2
        when: Mar. 4
        date: '1967-03-04'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Qi Benyu 戚本禹 calls the delegates of the rebels of the Chinese People''s University 中国人民大学 and urges them on against Zhu De 朱德: "Do it yourselves and it will be done. Say I told you to, and it will not. You think yourselves clever; in fact you are the stupidest. Whether to do it, think it over yourselves."'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1963. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1967-03.china-leadership-44, item: '[[w.zhu-de-nianpu-xinbian]], III, 1963 (Mar. 1967; the Center''s General Office 中共中央办公厅 stops sending Zhu De 朱德, Chen Yun 陈云 and Li Fuchun 李富春 documents, Xinhua''s *Cankao ziliao* 《参考资料》 and *Cankao xiaoxi* 《参考消息》, and the papers other than the *Renmin ribao* 《人民日报》)'}
  - cite: {id: cal.1967-05-01.china-leadership-3, item: '[[w.zhu-de-nianpu-xinbian]], III, 1963 (May 1, 1967; Zhu De 朱德 at the capital''s evening gala for May Day in Tiananmen Square 天安门广场)'}
  - add:
      entry:
        id: cal.1967-07-01.china-leadership-4
        when: July 1
        date: '1967-07-01'
        thread: china-leadership
        c: Zhu De 朱德 writes in his notebook a short account of the forty-six years of the Chinese Communist Party's 中国共产党 history.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1963. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1967-07-31.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1963 (July 31, 1967; before the reception Lin Biao 林彪, Jiang Qing 江青 and others oppose Xu Xiangqian 徐向前, Nie Rongzhen 聂荣臻 and Ye Jianying 叶剑英 attending; Zhou Enlai 周恩来 asks Mao Zedong 毛泽东, away from Peking, who answers that Zhu De 朱德, Xu Xiangqian and the other old marshals under attack are all to attend)'}
  - cite: {id: cal.1967-07-31.china-leadership-4, item: '[[w.zhu-de-nianpu-xinbian]], III, 1963 (July 31, 1967; Zhu De 朱德 at the Ministry of National Defense''s 国防部 reception for the fortieth anniversary of the PLA 中国人民解放军)'}
  - cite: {id: cal.1967-08-17.china-leadership-4, item: '[[w.zhu-de-nianpu-xinbian]], III, 1963–1964 (Aug. 17, 1967; the Military Commission''s Administrative Group 中共中央军委办事组 is made up of Wu Faxian 吴法宪, Ye Qun 叶群, Qiu Huizuo 邱会作 and Zhang Xiuchuan 张秀川, Wu Faxian in charge, chiefly to run the Cultural Revolution 文化大革命 in the forces stationed in Peking 北京 and their organs)'}
  - variant: {id: cal.1967-08-17.china-leadership-4, unit: A, witness: w.zhu-de-nianpu-xinbian, reads: 'Aug. 17, 1967: the Military Commission''s Administrative Group (办事组) of Wu Faxian, Ye Qun, Qiu Huizuo and Zhang Xiuchuan, Wu Faxian in charge', at: 'III, 1963–1964'}
  - cite: {id: cal.1967-09.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1964 (under Aug. 17, 1967: on Sept. 24 Yang Chengwu 杨成武 is added as head of the Military Commission''s Administrative Group 中共中央军委办事组, Wu Faxian 吴法宪 deputy head)'}
  - variant: {id: cal.1967-09.china-leadership, unit: A, witness: w.zhu-de-nianpu-xinbian, reads: 'Sept. 24, 1967: Yang Chengwu is added as head of the Military Commission''s Administrative Group, Wu Faxian deputy head', at: 'III, 1964'}
  - cite: {id: cal.1967-10-01.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1964 (Oct. 1, 1967; Zhu De 朱德 at the capital''s rally in Tiananmen Square 天安门广场 for the eighteenth anniversary of the People''s Republic, reviewing the parade)'}
  - add:
      entry:
        id: cal.1967-11-17.china-leadership-2
        when: Nov. 17
        date: '1967-11-17'
        thread: china-leadership
        c: 'Zhu De 朱德 writes an answer to the inquiry of the Artillery''s organs 炮兵直属机关 into Ouyang Yi 欧阳毅, the Artillery''s deputy political commissar, in the Fourth Front Army 红四方面军: throughout his work there Ouyang Yi stood with the Center 党中央 headed by Chairman Mao against Zhang Guotao''s 张国焘 line; to control the Fifth Army Group 五军团 Zhang sent his confidant Huang Chao 黄超 to take Ouyang Yi''s place as head of its security bureau; Zhang, "a base opportunist," charged comrades loyal to Chairman Mao and the Center with "treason," hid murders as "missing" and set soldiers fighting one another; the three matters Ouyang Yi names are all true, "the third I handled myself."'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1964. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967-11.china-leadership-15
        when: Nov.–Dec.
        date: 1967-11
        thread: china-leadership
        c: Zhu De 朱德 studies Engels's *Dialectics of Nature* 《自然辩证法》, Lenin's *Philosophical Notebooks* 《哲学笔记》 and other works, and takes notes.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1964. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967-12-30.china-leadership-3
        when: Dec. 30
        date: '1967-12-30'
        thread: china-leadership
        c: 'Zhu De 朱德 writes to Mao Zedong 毛泽东: this year he has not gone into the great wind and waves to wash away all his past errors and faults, but has only read with a whole heart the revolutionary books of Marx, Engels, Lenin, Stalin and Mao, and the papers, to make up for past wrongs.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1964. Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967.china-leadership-153
        when: '1967'
        date: '1967'
        thread: china-leadership
        c: 'Zhu De''s 朱德 position is very hard: some no longer dare come near him; his children are barred from his home in Zhongnanhai 中南海.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1964. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967.china-leadership-154
        when: '1967'
        date: '1967'
        thread: china-leadership
        c: One or two who once worked at Zhu De's 朱德 side write wall posters and false "exposures" against him.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1964. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967.china-leadership-155
        when: '1967'
        date: '1967'
        thread: china-leadership
        c: Kang Keqing 康克清, Zhu De's 朱德 wife, is put under control by the rebels of the All-China Women's Federation 全国妇联, paraded through the streets and struggled.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1964. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de']
  - add:
      entry:
        id: cal.1967.china-leadership-156
        when: '1967'
        date: '1967'
        thread: china-leadership
        c: 'Zhu De 朱德 goes every week to see factories and villages: "I go out only from care for production. Seeing the crops grow, seeing the trees grow, seeing the masses, my heart finds a kind of comfort."'
