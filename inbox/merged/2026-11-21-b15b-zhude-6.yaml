  - cite: {id: cal.1966-08-08.china-leadership-2, item: '[[w.zhu-de-nianpu-xinbian]], III, 1956 (Aug. 8, 1966; the plenum 八届十一中全会 adopts the Central Committee''s "Decision on the Great Proletarian Cultural Revolution" 《中国共产党中央委员会关于无产阶级文化大革命的决定》 (the "Sixteen Points" 十六条): "a great revolution that touches people''s souls"; "the movement''s chief target is those within the Party in authority taking the capitalist road")'}
  - cite: {id: cal.1966-08-12.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1956 (Aug. 12, 1966; on Mao Zedong''s 毛泽东 proposal the plenum 八届十一中全会 reorganizes the Center''s 中共中央 leading bodies and elects Mao, Lin Biao 林彪, Zhou Enlai 周恩来, Tao Zhu 陶铸, Chen Boda 陈伯达, Deng Xiaoping 邓小平, Kang Sheng 康生, Liu Shaoqi 刘少奇, Zhu De 朱德, Li Fuchun 李富春 and Chen Yun 陈云 to the Politburo Standing Committee 中央政治局常委, four more than the seven before, Lin Biao second and Zhu De down to ninth; no chairman or vice-chairmen are elected anew, but thereafter, Lin Biao apart, Liu Shaoqi, Zhou Enlai, Zhu De and Chen Yun no longer act as vice-chairmen of the Center)'}
  - cite: {id: cal.1966-08-04.china-leadership-7, item: '[[w.zhu-de-nianpu-xinbian]], III, 1956 (Aug. 4, 1966; Zhu De 朱德 speaks at the meeting of ten thousand at Peking University 北京大学万人大会: the youth of the Mao Zedong era are stronger in thought and deed than the youth of any age before; after school they should take any work, the work of workers, peasants and soldiers)'}
