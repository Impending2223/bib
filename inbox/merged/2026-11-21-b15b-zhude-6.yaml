        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 speaks at the enlarged Politburo meeting 中共中央政治局扩大会议: there is now a problem of branding this man and that a counter-revolutionary; unless a man is a counter-revolutionary, his error, however grave, can be put right; once branded he has no way out; this must be settled.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1959. Made public: 2016. See [[cal.1966-12-15.china-leadership-4]]. Names: Zhu De.'
