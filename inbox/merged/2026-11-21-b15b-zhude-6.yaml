  - cite: {id: cal.1968-10-01.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1966 (Oct. 1, 1968; Zhu De 朱德 at the capital''s rally in Tiananmen Square 天安门广场 for the nineteenth anniversary of the People''s Republic, reviewing the parade)'}
  - cite: {id: cal.1968-10-13.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1966 (Oct. 13–31, 1968; Zhu De 朱德 at the enlarged Twelfth Plenum of the Eighth Central Committee 中共扩大的八届十二中全会 in Peking, Mao Zedong 毛泽东 presiding; in most abnormal conditions it adopts the "Report on the examination of the crimes of the traitor, hidden enemy and scab Liu Shaoqi" 《关于叛徒、内奸、工贼刘少奇罪行的审查报告》, written by Jiang Qing 江青, Kang Sheng 康生 and others on false evidence, expels Liu Shaoqi 刘少奇 from the Party forever and strips him of all posts, and decides to convene the Ninth Congress 中共九大)'}
  - add:
      entry:
        id: cal.1968-10-15.china-leadership-4
        when: Oct. 15
        date: '1968-10-15'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. In a group of the Twelfth Plenum 八届十二中全会, while Zhang Chunqiao 张春桥, Wu Faxian 吴法宪, Xie Fuzhi 谢富治 and others besiege Chen Yi 陈毅, Ye Jianying 叶剑英, Li Fuchun 李富春, Tan Zhenlin 谭震林, Li Xiannian 李先念, Xu Xiangqian 徐向前 and Nie Rongzhen 聂荣臻 of the so-called "February adverse current" 二月逆流, Zhu De 朱德 speaks: "Every question must be made clear; for how to deal with it the Chairman has a whole set of policies: strict in criticism, handled by the Chairman''s line. Tan Zhenlin and these marshals, do they truly oppose Chairman Mao?" Wu Faxian at once attacks him: "you have always opposed Chairman Mao and Mao Zedong Thought." Zhu De: "I follow Chairman Mao." Wu Faxian: "From Jinggangshan to now, when did you stand with Chairman Mao? You were commander-in-chief in name; the one who truly commanded us in battle, the true commander-in-chief, was Chairman Mao."'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1966. Made public: in part, [[w.chen-yun-nianpu-xiuding]], III, 165 (2015), the attacks on Zhu De 朱德 in the plenum''s groups; in full, [[w.zhu-de-nianpu-xinbian]] (2016). See [[cal.1968-10-13.china-leadership]]. Names: Zhu De, Zhang Chunqiao, Wu Faxian, Xie Fuzhi, Chen Yi, Ye Jianying, Li Fuchun, Tan Zhenlin, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Mao Zedong.'
        tags: ['polity:prc', 'name:zhu-de', 'name:zhang-chunqiao', 'name:wu-faxian', 'name:xie-fuzhi', 'name:chen-yi', 'name:ye-jianying', 'name:li-fuchun', 'name:tan-zhenlin', 'name:li-xiannian', 'name:xu-xiangqian', 'name:nie-rongzhen', 'name:mao-zedong', 'vis:only:prc']
  - cite: {id: cal.1968-10.china-leadership-28, item: '[[w.zhu-de-nianpu-xinbian]], III, 1966 (Oct. 17, 1968, in a group of the plenum 八届十二中全会; Xie Fuzhi 谢富治: Zhu De 朱德 opposed Chairman Mao from the first day at Jinggangshan 井冈山; Zhu De and Chen Yi 陈毅 joined to drive Chairman Mao out of the army, Chen Yi his chief of staff, and all these must be criticized; Liu and Deng made counter-revolutionary revisionism, Zhu De and Chen Yun 陈云 revisionism too; the "February adverse current" 二月逆流 men have not given up; the nianpu''s note: Xie Fuzhi then alternate member of the Politburo 中共中央政治局 and secretary of the Secretariat 书记处)'}
