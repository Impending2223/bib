  - cite: {id: cal.1968-03-25.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1965 (Mar. 25, 1968; Lin Biao 林彪 and Jiang Qing 江青 make the "Yang, Yu, Fu" affair 杨、余、傅事件, slandering Yang Chengwu 杨成武, acting chief of the General Staff 代总参谋长, Yu Lijin 余立金, political commissar of the Air Force 空军政治委员, and Fu Chongbi 傅崇碧, commander of the Peking Garrison 北京卫戍区, as "reversing the verdict on the February adverse current"; the three are removed from their army posts; Huang Yongsheng 黄永胜 is named chief of the General Staff 总参谋长 and head of the Military Commission''s Administrative Group 中央军委办事组, a new group of five formed of Huang Yongsheng, Wu Faxian 吴法宪, Ye Qun 叶群, Li Zuopeng 李作鹏 and Qiu Huizuo 邱会作; after it the group in effect takes the place of the Military Commission''s Standing Committee 军委常委)'}
