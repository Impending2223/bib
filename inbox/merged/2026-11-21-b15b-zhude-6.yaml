        place: peking
        thread: china-leadership
        c: Zhongnanhai 中南海, Peking 北京. At Jiang Qing's 江青 bidding the "rebels" of the Zhongnanhai offices 中南海机关 put up wall posters slandering Zhu De 朱德, shout "Down with Zhu De" and "Bombard Zhu De," and threaten to drive him and his family out of Zhongnanhai. Many of his activities are restricted; he still cares for production and fears its harm.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1959. Made public: 2016. Names: Jiang Qing, Zhu De.'
