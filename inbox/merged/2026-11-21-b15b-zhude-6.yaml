        when: Jan. 13
        date: '1966-01-13'
        thread: china-leadership
        c: 'Zhu De 朱德 hears Tan Qilong 谭启龙 and the other heads of the Shandong provincial committee 中共山东省委 on the socialist education campaign and on production, finance and trade. His remarks: act by materialist dialectics and the laws of nature, as Chairman Mao applied Marxism-Leninism to China''s reality; revolution is to develop the productive forces, and the relations of production must keep up with them; no one has seen what socialism looks like, and until it is given a shape people will not be clear; with production done well, people settled, life bettered and falsehood ended, they will have faith in socialism.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1946–1947. Made public: 2016. Names: Zhu De.'
