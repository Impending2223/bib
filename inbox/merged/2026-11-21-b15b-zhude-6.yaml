  - add:
      entry:
        id: cal.1969-06-18.china-leadership-2
        when: June 18
        date: '1969-06-18'
        thread: china-leadership
        c: 'Zhu De 朱德, having seen the "six factories and one school" 六厂一校 of Peking 北京, writes his thoughts in his notebook: for cadres who made the errors of capitalist-roaders, stress "help"; for active counter-revolutionaries, stress only "accuracy," accurate in judgment and in blows, leaving room and not making too many enemies; those who may or may not be, all to count among the people; for historical counter-revolutionaries, look above all at present political conduct. The nianpu''s note: the six factories and one school were Mao Zedong''s 毛泽东 models, whose workers'' and army propaganda teams, military control committees and revolutionary committees showed the way for the country''s "struggle, criticism, reform."'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1969–1970. Made public: 2016. See [[cal.1969-06-07.china-leadership-2]]. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
  - cite: {id: cal.1969-09-30.china-leadership-2, item: '[[w.zhu-de-nianpu-xinbian]], III, 1970 (Sept. 30, 1969, evening; Zhu De 朱德 at Zhou Enlai''s 周恩来 reception in the banquet hall of the Great Hall of the People 人民大会堂 for the twentieth anniversary of the People''s Republic)'}
  - cite: {id: cal.1969-10-01.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1970 (Oct. 1, 1969; Zhu De 朱德 at the capital''s rally in Tiananmen Square 天安门广场 for the twentieth anniversary of the People''s Republic, reviewing the parade)'}
  - cite: {id: cal.1969-10-17.china-leadership-4, item: '[[w.zhu-de-nianpu-xinbian]], III, 1970 (Oct. 17, 1969, afternoon; Zhu De 朱德, as the Center''s General Office 中共中央办公厅 arranges, at the sports display at the Capital Gymnasium 首都体育馆)'}
  - cite: {id: cal.1969-10-17.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1970 (Oct. 17, 1969; after the display Zhu De 朱德, with Dong Biwu 董必武, Chen Yun 陈云, Ye Jianying 叶剑英, Chen Yi 陈毅, Deng Zihui 邓子恢, Li Fuchun 李富春, Zhang Dingcheng 张鼎丞 and others, at the meeting Zhou Enlai 周恩来 calls in the gymnasium; Zhou announces the decision of Mao Zedong 毛泽东 and the Center 中共中央 on dispersal for war readiness: on the present situation the Chairman has decided that some comrades leave Peking 北京 for other places by or soon after the 20th, each to the place he names; Zhou to arrange their settling by telephone, the General Office 中央办公厅 to ready special planes or trains)'}
  - cite: {id: cal.1969-10-18.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1970 (Oct. 17, 1969; Lin Biao 林彪 issues an "urgent instruction" putting the whole army on emergency war readiness; on the 18th Huang Yongsheng 黄永胜, chief of the General Staff 总参谋长, and others send it down formally as "Vice-Chairman Lin''s Order No. 1" 林副主席第一个号令)'}
  - add:
      entry:
        id: cal.1969-10-18.china-leadership-9
        when: Oct. 18
        date: '1969-10-18'
        thread: china-leadership
        c: 'Zhu De 朱德, of Lin Biao''s 林彪 "Order No. 1" 第一个号令, to his wife Kang Keqing 康克清: "The drinker''s mind is not on the wine." There is no sign of war now; a war does not start from nothing; before it come many signs; it is not children fighting; no such signs are to be seen now.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1970. Made public: 2016. See [[cal.1969-10-18.china-leadership]]. Names: Zhu De, Lin Biao.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:lin-biao', 'vis:only:prc']
