        c: 'The Tiananmen tower 天安门城楼, Peking 北京. Zhu De 朱德 receives the National Day delegates from Yilong county 仪陇县, Sichuan 四川省, and Liu Guangyou 刘光友, mother of Zhang Side 张思德, and tells her: Comrade Zhang Side died for the people''s good; you are a hero''s mother, come to the people''s capital, and should be welcomed. The nianpu''s note: Zhang Side, of Yilong, a soldier of the Center''s guard regiment 中共中央警卫团 and a member of the Communist Party 共产党, joined the revolution in 1932 and died on Sept. 5, 1944, when a charcoal kiln fell in at Ansai county 安塞县, northern Shaanxi 陕北.'
