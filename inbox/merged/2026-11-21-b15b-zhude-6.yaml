        c: 'Peking 北京. Zhu De 朱德 presides over the enlarged twenty-fourth meeting of the Third NPC Standing Committee 第三届全国人大常委会, which hears Cao Lu 曹鲁, Vice-Minister of the First Light Industry 第一工业部 (so printed), on light industry''s goods for the countryside. Zhu De speaks: the basic aim of building socialism is to better the people''s life; once we learned from the Soviet Union 苏联; now, led by Chairman Mao, we build socialism of a Chinese kind. The meeting decides to put off the Third NPC''s 第三届全国人大 second session to the first half of 1966.'
