  - cite: {id: cal.1968-07-21.china-leadership-6, item: '[[w.zhu-de-nianpu-xinbian]], III, 1965 (July 21, 1968; Kang Sheng 康生, to prepare the personnel of the Ninth Congress 中共九大, writes to Jiang Qing 江青 with a list in his own hand sorting and labeling the Eighth Central Committee''s 八届中央委员会 members and alternates: Liu Shaoqi 刘少奇, Deng Xiaoping 邓小平 and 87 others "spies," "traitors," "men with illicit foreign ties," "anti-Party elements"; Zhu De 朱德, Chen Yun 陈云 and 27 others among those "with errors or historical questions to be examined"; the two classes 61 percent of the members and alternates)'}
