  - cite: {id: cal.1968-12.china-leadership-13, item: '[[w.zhu-de-nianpu-xinbian]], III, 1967 (Dec. 10–11, 1968; the Ministry of Public Security 公安部, in Xie Fuzhi''s 谢富治 hands, by inducing and forcing those under the "May 16" 五一六 case inquiry, makes up a monstrous false case of a "false party" 伪党, charging some tens of leading cadres of the Center 中共中央 and the localities, Zhu De 朱德, Dong Biwu 董必武, Ye Jianying 叶剑英, Li Xiannian 李先念, Li Fuchun 李富春, Chen Yi 陈毅, He Long 贺龙, Liu Bocheng 刘伯承, Xu Xiangqian 徐向前, Nie Rongzhen 聂荣臻, Tan Zhenlin 谭震林, Yu Qiuli 余秋里 among them, with forming a "Communist Party of China (Marxist-Leninist)" 中国（马列）共产党, "illicit ties with the Soviet revisionists" and "plotting a coup"; Zhu De its "secretary," Chen Yi "deputy secretary and minister of defense," Li Fuchun "premier"; the nianpu''s note: in December 1968 Xie Fuzhi used the inquiry into the so-called "May 16" to trace the backers of the "Extraordinary Committee" case)'}
