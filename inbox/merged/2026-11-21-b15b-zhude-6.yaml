  - cite: {id: cal.1966-08-01.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1955–1956 (Aug. 1–12, 1966; Zhu De 朱德 at the Eleventh Plenum of the Eighth Central Committee 中共八届十一中全会 in Peking, whose chief business is the decision on the Great Proletarian Cultural Revolution and the approval of the Center''s 中共中央 chief decisions on home and foreign questions since the Tenth Plenum 十中全会; the nianpu: the plenum marks the full launching of the "Cultural Revolution")'}
  - cite: {id: cal.1966-08-07.china-leadership-5, item: '[[w.zhu-de-nianpu-xinbian]], III, 1955–1956 (Aug. 7, 1966; Mao Zedong''s 毛泽东 "Bombard the Headquarters: My Wall Poster" 《炮打司令部——我的一张大字报》 is distributed at the plenum 八届十一中全会, which then turns to exposing and criticizing Liu Shaoqi 刘少奇)'}
