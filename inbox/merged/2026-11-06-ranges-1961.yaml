        n: 'H.R. Res. 127, 87th Cong. [[w.obrien-no-final-victories]], for the White House whip count. The vote divided about 195 Democrats and 22 Republicans against 64 Democrats and 148 Republicans. [[w.reeves-president-kennedy]], 55–57 (the vote; Smith and Colmer); [[w.sorensen-kennedy]], 340–41. [[w.kabaservice-rule-and-ruin]], 43 (twenty-two Republicans the margin). The House met at noon, the session''s standing hour, and adjourned at 2:33 p.m.: Daily Digest, [107 Cong. Rec. D5](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=3), [D29](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=27) (1961). To check: [[w.cummings-decision-to-enlarge-the]]; [[w.robinson-house-rules-committee]]; [[w.schickler-disjointed-pluralism]]; [[w.hardeman-rayburn]]; [[w.dierenfield-keeper-of-the-rules]]. Names: Rayburn, Smith, Colmer, Bolling, Halleck.'
