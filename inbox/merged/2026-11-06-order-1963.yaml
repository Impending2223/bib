        n: 'Annual Message to the Congress on the State of the Union, [1963 Pub. Papers 11](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=69) (Jan. 14, 1963). [109 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-3-1.pdf) (1963). The President in the House from 12:31 to 1:16 p.m.: [109 Cong. Rec. 171](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-3-1.pdf#page=2), [174](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-3-1.pdf#page=5) (1963). [[w.sorensen-kennedy]], 427, 429–30 (the tax cut); [[w.sundquist-politics-and-policy]], 46, 134 (the tax cut in stages, with reform, 46; the youth corps at the head of the program, 134; not the figures); [[w.fursenko-khrushchevs-cold-war]], 508–09 ("leaving fear astern"; "A moment of pause is not a promise of peace"); [[w.graham-uncertain-triumph]], 44; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 282 (Vietnam). To check: [[w.bernstein-promises-kept]]; [[w.giglio-presidency-of-john-f]]. See [[cal.1962-01-11.program]]. Check: the page.'
