        n: '[[w.branch-parting-the-waters]], 764. To check: FBI intercept of Levison''s telephone, May 4, 1963, FLNY-9-157a (cited by [[w.branch-parting-the-waters]], 764 n.1); L. H. Baily, memorandum, May 4, 1963, Bull Connor Papers (cited by [[w.branch-parting-the-waters]], 764 n.2). After the night''s mass meeting: [[w.branch-parting-the-waters]], 762–64. See [[cal.1963-05-03.alabama-birmingham-4]]. Names: Martin Luther King.'
