        n: '[Proclamation 3561—National Day of Mourning for President Kennedy](https://www.presidency.ucsb.edu/documents/proclamation-3561-national-day-mourning-for-president-kennedy) (Nov. 23, 1963). [President''s Daily Diary, Nov. 25, 1963](https://catalog.archives.gov/id/192433), images 2, 3 (LBJ Library; National Archives Catalog); image 1, the worksheet: Johnson leaves the Executive Office Building at 11:35 a.m., back at 3:36 p.m. [[w.rusk-as-i-saw-it-1990]], 321 (de Gaulle and Haile Selassie); [[w.dobrynin-in-confidence]], 114 (Mikoyan on foot in the front ranks); [[w.thomas-robert-kennedy]], 282 (Robert Kennedy behind the caisson; at the graveside). To check: [[w.zelizer-covering-the-body]]. See [[cal.1963-11-22.assassination]]; [[cal.1963-11-25.succession]] (the governors). Names: de Gaulle, Erhard, Haile Selassie I, Mikoyan. Check: by Rusk''s account de Gaulle refused to be driven and walked with Mrs. Kennedy ([[w.rusk-as-i-saw-it-1990]], 321).'
