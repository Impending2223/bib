  - edit:
      id: cal.1963-08-28.march-on-washington
      base: d9a8ae49
      set:
        time_range:
          - 1963-08-28T16:00Z
          - 1963-08-28T21:00Z
        time_zone: America/New_York
        range_basis: record
        n: 'Statement by the President on the March on Washington for Jobs and Freedom, [1963 Pub. Papers 645](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=703) (Aug. 28, 1963). [Kennedy with the March''s leaders, 5 p.m.](https://prde.upress.virginia.edu/conversations/4006294), JFK Meeting Tape 108.1 and 108.2 (PRDE only). March on Washington (Aug. 28, 1963) (K–J Cong. II.K). [[w.garrow-bearing-the-cross]], 280–86; [[w.branch-pillar-of-fire]], 130–33; [[w.sorensen-kennedy]], 504–05 (the President''s part; the leaders at the White House); [[w.mann-walls-of-jericho]], 371–73 (more than 200,000; the leaders to the White House after; "Pass the bill!"); [[w.branch-parting-the-waters]], 876–83; [[w.kotz-judgment-days]], 64; [[w.young-easy-burden]], 271–73. [[w.reeves-president-kennedy]], 571, 578–85 (the March; Rustin; Lewis''s text; King; the White House after). Check: Branch, 876–83: twenty-one charter trains, buses through the Baltimore tunnel at a hundred an hour (Gentile); the police estimate at noon more than 200,000; Wilkins announces Du Bois''s death in Ghana: "regardless of the fact that in his later years Dr. Du Bois chose another path"; Marshall brings a revised Lewis text by police sidecar; O''Boyle withholds the invocation; under Lincoln''s seat Randolph, King, Blake and Lewis cut the Sherman passage, King: "John, I know you as well as anybody. That doesn''t sound like you"; Lewis: "the party of Kennedy is also the party of Eastland. The party of Javits is also the party of Goldwater"; the leaders'' wives kept from the march; Mahalia Jackson, "Tell ''em about the dream, Martin"; King off his text after "a mighty stream.". The morning''s calls, before the program: [[w.branch-parting-the-waters]], 876. The March from about noon ([[cal.1963-08-28.march-on-washington-2|Humphrey''s account]]) to the leaders'' meeting at 5 p.m. (the recording above). To check: [[w.rosenberg-kennedy-johnson-and-the]] ("The Bill and the March"); [[w.demilio-lost-prophet]]; [[w.anderson-philip-randolph]]; [[w.lewis-walking-with-the-wind]]; [[w.gentile-march-on-washington]]; [[w.hansen-dream]]; [[w.euchner-nobody-turn-me-around]]; [[w.jones-behind-the-dream]]; [[w.jones-march-on-washington]]; King, "Advance Text . . .," Aug. 28, 1963, Harry Boyte Papers, Duke University (cited by [[w.garrow-bearing-the-cross]], 281 n.59); New York Times, Aug. 29, 1963, 20; John Lewis, "Six Month Report," Dec. 27, 1963, SNCC Papers, box 1, King Center; Rustin, remarks, Syracuse, N.Y., Jan. 4, 1964, State Historical Society of Wisconsin, tape 544 (cited by [[w.garrow-bearing-the-cross]], 283 n.60); King, "I Have a Dream," Aug. 28, 1963, on "The Great March on Washington," Gordy/Motown record 908; New York Times, Aug. 29, 1963, 1 (cited by [[w.garrow-bearing-the-cross]], 285 n.61); "Notes for Meeting . . .," Aug. 28, 1963, Lee C. White Papers, box 4, Johnson Library; "March on Washington—Report by the Leaders," WTTG-TV, Aug. 28, 1963, King Center (cited by [[w.garrow-bearing-the-cross]], 285 n.62); Fred Shuttlesworth, oral history; Roy Wilkins, oral history, Civil Rights Documentation Project, Howard University; Roy Wilkins, oral history, Kennedy Library; *Washington Post*, Aug. 29 and 30, 1963 (cited by [[w.reeves-president-kennedy]], 582). See [[cal.1963-06-11.civil-rights-bill]]. Names: Randolph, Rustin, Lewis, Martin Luther King.'
  - edit:
      id: cal.1963-06-26.berlin-and-vienna
      base: adb58e34
      set:
        time_range:
          - 1963-06-26T08:45Z
          - 1963-06-26T16:30Z
        time_zone: Europe/Berlin
        range_basis: record
        n: '[Remarks in the Rudolph Wilde Platz, Berlin](https://www.presidency.ucsb.edu/documents/remarks-the-rudolph-wilde-platz-berlin) (June 26, 1963). Address at the Free University of Berlin, [1963 Pub. Papers 526](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=584) (June 26, 1963). In Berlin from 9:45 a.m. to 5:30 p.m., by the notes: Remarks Upon Arrival at Tegel Airport in Berlin, [1963 Pub. Papers 522](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=580); Remarks at Tegel Airport, Berlin, Upon Leaving for Ireland, [1963 Pub. Papers 530](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=588) (June 26, 1963). Remarks, Rudolph Wilde Platz (K–J Adm. II.I). [[w.reeves-president-kennedy]], 535–37; [[w.rusk-as-i-saw-it-1990]], 227 (Rusk beside Adenauer during the speech; Adenauer afterward: "Does this mean that Germany could have another Hitler?"). [[w.sorensen-kennedy]], 600 (the reception). To check: [[w.daum-kennedy-in-berlin]]; [[w.brandt-begegnungen-und-einsichten]]; [*New York Times*, June 27, 1963](https://timesmachine.nytimes.com/timesmachine/1963/06/27/issue.html) (cited by [[w.reeves-president-kennedy]], 535). See [[cal.1963-06-23.europe-and-the-alliance]]. See [[cal.1961-08-13.berlin-and-vienna]]. Names: Brandt, Adenauer.'
