      id: cal.1963-11-25.economy
      base: 3d25fcca
      set:
        time: 1963-11-26T02:20Z
        n: '[President''s Daily Diary, Nov. 25, 1963](https://catalog.archives.gov/id/192433), image 3 (LBJ Library; National Archives Catalog) (the day''s schedule: Dillon, Kermit Gordon and Heller, 8:45 p.m.); image 2, the worksheet: Dillon, Heller, Fowler, Ackley, Gordon and Staats, 9:20 p.m. [[w.dallek-flawed-giant]], 60, 72 (from the notes of the meeting, Heller Papers, JFK Library, and Ackley''s, LBJ Library); [[w.caro-passage-of-power]], 418–24 (Ackley''s notes; the draft budget $101.5 billion); [[w.stein-fiscal-revolution-in-america]], 452–53 (the budget about $100 billion to get the bill to the Senate floor, by Evans and Novak''s account); [[w.zelizer-taxing-america]], 202 (Dillon''s and Heller''s memoranda of the day); [[w.zelizer-fierce-urgency-of-now]], 77 (the budget about $100 billion; Johnson: "Unless you get that budget down around $100 billion, you won''t pee one drop"; "You have to give something to buy off Byrd"); [[w.bernstein-guns-or-butter]], 31–32 (9:15 p.m.; Ackley''s notes: "say, $100.6 or $100.7"; Dillon''s head count; "You have to give something to buy off Byrd"). [[w.mann-walls-of-jericho]], 381–82 (the civil rights bill). Check: Bernstein, 31, gives 9:15 p.m.; the Daily Diary, 8:45. To check: Ackley''s notes of the meeting, Nov. 25, 1963, Diary Backup, LBJ Library; Dillon to Johnson, Nov. 25, 1963, WHCF Subject Files, LBJ Library; Walter W. Heller OH II, LBJ Library (cited by [[w.caro-passage-of-power]], 422); "Troika Meeting with President Johnson," Nov. 25, 1963, Heller Papers, JFK Library; Gardner Ackley OH, LBJ Library (cited by [[w.dallek-flawed-giant]], 72); Dillon to Johnson, Nov. 25, 1963, and Heller to Johnson, Nov. 25, 1963, Kermit Gordon Papers, Box 13, JFK Library (cited by [[w.zelizer-taxing-america]], 202 nn.94–95). See [[cal.1963-01-24.economy]]. Names: Johnson, Heller, Dillon, Harry F. Byrd.'
