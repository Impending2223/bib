      id: cal.1961-05-30.soviet-union
      when: May 30
      date: '1961-05-30'
      thread: soviet-union
      c: 'The Presidium on a Book of National Honor of the USSR. Mikoyan: the RSFSR''s rights not to be cut; let the republics award the prizes. Furtseva: are prizes needed? Polyansky: not agreed with the republic. The Secretariat to rework it.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 508 (Protocol 332, item VI, Malin''s notes). Made public: 2003. Names: Mikoyan.'
      src:
        c: 0ca64e58
        rows:
