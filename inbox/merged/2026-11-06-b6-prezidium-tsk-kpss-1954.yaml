      when: Mar. 29
      date: '1962-03-29'
      thread: soviet-union
      c: 'The Presidium on the plan of a many-volume History of the Communist Party. Mikoyan: from which congress does it begin? Khrushchev: the direction right; to Pospelov, can he manage it, with complete objectivity? Full trust in him. Shatalin to be released; the composition to the Secretariat; not approved yet.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 552 (Protocol 23, item XL, Malin''s notes). Made public: 2003. Names: Mikoyan, Khrushchev.'
