      id: cal.1963-08-01.soviet-union
      when: Aug. 1
      date: '1963-08-01'
      thread: soviet-union
      c: 'The Presidium on the Moscow film festival, whose jury gave its main prize to Fellini''s *8½*. Khrushchev, to Romanov, chairman of the cinema committee: Soviet members are not to vote on juries; he is unready for his post, and has betrayed the June plenum''s decision. The prize to be disowned; the Secretariat to look into it.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 734–35 (Protocol 108, item V, Malin''s notes); [[w.prezidium-tsk-kpss-1954]], I, 1143–44 nn.2–3 (the editors: the prize, against the party''s ideological organs; the plenum of June 18–21, 1963; Romanov kept his post). Made public: 2003. Names: Khrushchev.'
      src:
        c: f73ef0de
        rows:
        - 'w.prezidium-tsk-kpss-1954 I, 734–35: all'
        - 'w.prezidium-tsk-kpss-1954 I, 1143–44: A-B'
        - 'via x.1963-08-01.presidium-protocol-108: all'
      tags:
