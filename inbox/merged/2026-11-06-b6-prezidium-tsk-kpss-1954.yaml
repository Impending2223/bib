      date: '1961-04-06'
      thread: soviet-union
      c: 'The Presidium, outside the protocol, on the press at the Kuibyshev works. Khrushchev: will it not be fully loaded? Gosplan is swallowed by current business.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 497 (Protocol 323, Malin''s notes). Made public: 2003. Names: Khrushchev.'
