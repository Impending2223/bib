      id: cal.1963-11-26.soviet-union-3
      when: Nov. 26
      date: '1963-11-26'
      thread: soviet-union
      c: 'The Presidium on Professor Kolomiychenko, ear, nose and throat: twice put up for the Lenin Prize, twice refused, because he was not the first to perform the operation on the ear, the first being in the United States. Khrushchev: but the prize is given for putting it into practice.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 780 (Protocol 125, Malin''s notes). Made public: 2003. See [[cal.1963-11-26.soviet-union-2]]. Names: Khrushchev.'
      src:
