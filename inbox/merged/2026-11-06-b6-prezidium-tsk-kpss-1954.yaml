      c: 'The Presidium on the Council of Ministers'' commission on foreign economic questions and new men for it. Mikoyan proposes Lesechko, Kosygin Kabakov. Khrushchev: Kabakov the stronger for the state, Lesechko for the technical interest. Lesechko chosen.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 419 (Protocol 258, item VIII, Malin''s notes). Made public: 2003. Names: Mikoyan, Kosygin, Khrushchev.'
