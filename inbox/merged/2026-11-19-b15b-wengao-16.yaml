      when: Apr. 3
      date: '1961-04-03'
      thread: china-leadership
      c: 'Mao Zedong, Liu Shaoqi, Zhu De and Zhou Enlai cable Kádár, Dobi and Münnich on the 16th anniversary of Hungary''s liberation: Hungary''s achievements; the November 1960 Moscow conference of 81 parties strengthened the camp''s unity; the two peoples'' friendship "forever evergreen."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 1–2 (Apr. 3, 1961). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai.'
      src:
        c: b5afc62d
        rows:
        - 'w.jianguo-yilai-mao-zedong XVI, 1–2: all'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhu-de
      - name:zhou-enlai
      - polity:hungary
- add:
    entry:
      id: cal.1961-04-11.china-leadership-5
      when: 'Apr. 11'
      date: '1961-04-11'
      thread: china-leadership
      c: 'Changsha. Mao to Wang Dongxing, by letter: telephone Wang Renzhong and Wang Yanchun to be at Changsha at 2 p.m. on the 14th for three to five days, with the Hubei three-level conference''s bulletins and papers, to help the Hunan comrades on two matters, the mass line and seizing the initiative in time. Hunan has not carried out the twelve-article policy in earnest, and in half a year has not cleared the five winds; power in many places not yet taken back from the enemy. Copies to the Hunan secretariat, Liu Shaoqi, Tan Zhenlin and Hu Qiaomu.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 3–4 (Apr. 11, 1961). Made public: 2023. To check: the Central Committee''s urgent directive of Nov. 3, 1960 (cited at [[w.jianguo-yilai-mao-zedong]], XVI, 4 n.3). Names: Mao Zedong, Liu Shaoqi, Tan Zhenlin, Wang Dongxing, Wang Renzhong, Wang Yanchun, Hu Qiaomu. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
      src:
        c: a7b71973
        rows:
        - 'w.jianguo-yilai-mao-zedong XVI, 3–4: all'
        - 'via x.1960-11-03.cc-urgent-directive-twelve-articles-rural-communes: all'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:tan-zhenlin
      - vis:only:prc
