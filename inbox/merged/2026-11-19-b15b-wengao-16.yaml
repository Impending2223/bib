      when: 'May 6'
      date: '1961-05-06'
      thread: china-leadership
      c: 'Shanghai. Mao to Li Jingquan, for Chen Zhengren at Pingquan commune, Jianyang: Chen''s letter of May 1 received; a week or better two weeks more of inquiry there will do much good. To Li: why no letter? Has he been out to investigate? The Center''s list of topics went out Apr. 25; the May 4 notice puts the conference off to May 20 for fuller inquiry, so Peking can go further than Canton. The first secretaries of the bureaus and committees to spend this half-month in the villages and write to Mao freely; he will answer every letter. Reply by secure telephone to his residence or train.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 24–25 (May 6, 1961). Made public: 2023. Names: Mao Zedong, Li Jingquan, Chen Zhengren. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
