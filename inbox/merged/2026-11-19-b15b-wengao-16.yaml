      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 20–21 (May 4, 1961). Made public: 1996. To check: [[w.zedong-jianguo-yilai-mao-zedong]], 9, 475–76 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 61 n.123b). Names: Mao Zedong, Deng Xiaoping.'
