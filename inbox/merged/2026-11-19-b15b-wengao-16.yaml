      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 165–166 (Nov. 17, 1961). Made public: 2023. Names: Mao Zedong, Guo Moruo. Check: the volume prints it from *Mao Zedong shici ji* (the manuscript extant); the first printing and the day of Guo''s acceptance are not given. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
