      date: '1961-05-30'
      thread: china-leadership
      c: 'Mao on Qi Benyu''s paper again: it is to go down to the county and commune committees, the basic committees of factories, mines, transport, trade and culture, and the army''s regimental committees, for discussion; Party committees may educate investigators who work like overbearing bureaucrats, and send away "dead bureaucrats" who will not listen; the paper to be teaching material for training investigation teams. With his revision of it he gives it a title, "An Example of Investigation Becoming a Disaster."'
