      when: 'Nov. 6'
      date: '1961-11-06'
      thread: china-leadership
      c: 'Mao to Tian Jiaying in three notes, 6 a.m., 8:30 a.m. and 8 p.m.: for the collected poems of Lin Bu, the Song recluse, by that afternoon; then for the full eight lines of a plum poem with the couplet "snow fills the mountains, the scholar lies; the moon is bright in the woods, the beauty comes"; he thinks it Lin Bu''s, then Gao Shiqi''s. The editors identify it as one of Gao Qi''s nine plum poems.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 161–162 (Nov. 6, 1961). Made public: 2023. Names: Mao Zedong, Tian Jiaying. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
