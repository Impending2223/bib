      when: Apr. 27
      date: '1961-04-27'
      thread: china-leadership
      also:
      - china
      - cuba
      c: Hangzhou, 11 p.m. to 12:30 a.m. Mao receives Afro-Asian guests from Guinea, Jordan, South Africa, Uganda, Senegal, Northern Rhodesia and Kenya. The international situation favors the anti-imperialist struggle of Africa, Asia and Latin America; revolutionary parties begin as minorities; the Americans' attack on Cuba shows Kennedy's government can be only worse than Eisenhower's; the United States used the United Nations to attack the Congo and kill Lumumba; Mao welcomes the Afro-Asian–Latin American solidarity voiced at Bandung.
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 16–18 (Apr. 27, 1961; the talk printed from the *Renmin ribao* news item of Apr. 29, 1961; the guests, the hours). Names: Mao Zedong.'
