      c: 'Mao to Deng Xiaoping on the edited text of Deng''s speech of Feb. 6 to the enlarged work conference: read the whole, "very good." The speeches of Lin Biao, Zhou Enlai and Zhu De are to be sent quickly, to be read and printed with it as one book to issue early. In the speech the center, and in it the Secretariat doing the work, bears first responsibility for the faults of recent years.'
