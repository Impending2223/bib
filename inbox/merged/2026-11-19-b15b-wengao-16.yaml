      when: 'Nov. 11'
      date: '1961-11-11'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on two Xinhua internal reports, of a Chinese song and dance troupe''s reception at Leningrad and of Bulgarian meetings for China''s national day, which he titles "Two Matters in the USSR and Bulgaria": they show the depth of the brother peoples'' feeling for the Chinese; the revisionists who would isolate China are themselves isolated; the imperialists, reactionary nationalists and Yugoslav revisionists are under 10 percent of the world, the revolutionary people over 90 percent. The Indian people are not anti-Chinese; the 1960 agricultural exhibition was welcomed.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 163–164 (Nov. 11, 1961). Made public: 2023. To check: Neibu cankao, international edition, nos. 195 and 200, Nov. 4 and 8, 1961 (cited at [[w.jianguo-yilai-mao-zedong]], XVI, 163–164 n.1). Names: Mao Zedong. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
