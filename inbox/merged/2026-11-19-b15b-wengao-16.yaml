      when: 'Apr. 15'
      date: '1961-04-15'
      thread: china-leadership
      c: 'The Center, in Mao''s hand, sends the bureaus and the provincial, municipal and regional committees the Northwest Bureau''s report of Apr. 11 on investigation and study, for reference; Deng Xiaoping to see to it. The report: after the Canton conference the bureau''s secretariat resolved to make investigation each committee''s first task, the first secretaries to go in person, the villages first, the staff to go down by turns.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 9–10 (Apr. 15, 1961). Made public: 2023. To check: the Northwest Bureau''s report to the Center, Apr. 11, 1961 (cited at [[w.jianguo-yilai-mao-zedong]], XVI, 9 n.1a). Names: Mao Zedong, Deng Xiaoping. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
