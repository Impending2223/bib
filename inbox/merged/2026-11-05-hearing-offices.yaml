- edit:
    id: cal.1967-06-28.defense
    base: 3ae6d45f
    set:
      c: 'The Senate Armed Services Committee hears nominees: Charles F. Baird, Under Secretary of the Navy; John T. McNaughton, Secretary of the Navy; Paul Nitze, Deputy Secretary of Defense; Paul Warnke, an Assistant Secretary of Defense. McNaughton confirmed June 29; killed July 19, before taking office.'
      n: '*Nominations: Hearings Before the S. Comm. on Armed Services*, 90th Cong. (1967) ([online](https://www.govinfo.gov/app/details/CHRG-90shrg82763)), 10 (Nitze), 19 (McNaughton), 32 (Baird), 33 (Warnke). Daily Digest, [113 Cong. Rec. D322](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=320) (June 29, 1967) (the confirmation); [Wikipedia, "John McNaughton (government official)"](https://en.wikipedia.org/wiki/John_McNaughton_%28government_official%29) (the death, before taking office). Names: Baird, McNaughton, Nitze, Warnke.'
