      thread: opinion
      also:
      - congress
      c: 'Gallup, Jan. 26–31: have heard of the inquiry whether Powell should keep his seat, 88 percent. Of them: should keep it 20, should not 63. Negroes 2 to 1 that he should. Misuse of Government funds by congressmen fairly common: yes 60, no 21.'
      n: '[[w.gallup-poll]], III, 2048. Names: Powell.'
      tags:
      - name:powell-adam-clayton-jr
    section: feb67
