      when: Jan. 11
      date: '1967-01-11'
      thread: opinion
      also:
      - assassination
      c: 'Gallup, Dec. 8–13, 1966: one man responsible for the assassination of Kennedy, 36 percent; others involved, or uncertain, 64. Another investigation: should be 32, should not 63.'
      n: '[[w.gallup-poll]], III, 2044. Names: John F. Kennedy.'
      tags:
      - name:kennedy-john-f
    section: jan67
- add:
