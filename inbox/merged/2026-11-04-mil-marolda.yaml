patch: mil-marolda
by: 'Claude (the military re-read, group osd: Marolda and Fitzgerald, From Military Assistance to Combat, 1986), Nov. 5, 2026'
ops:
- add:
    entry:
      id: cal.1960-08-11.laos
      when: Aug. 11
      date: '1960-08-11'
      thread: laos
      c: Felt has Luckey assemble the staff elements of Task Force 116, a precaution after Kong Les coup.
      n: '[[w.marolda-united-states-navy-and]], 46. See [[cal.1960-08-09.laos]]. Names: Felt.'
      src:
        c: dd5b1ec6
        rows:
        - 'w.marolda-united-states-navy-and 46: all'
      tags:
      - name:felt-harry-d
- add:
    entry:
      id: cal.1960-08-18.laos
      when: Aug. 18
      date: '1960-08-18'
      thread: laos
      c: After the Assembly installs Souvanna Phoumas government, Pacific Fleet units deploy to the South China Sea off South
        Vietnam, ready "to react swiftly should decision be taken to do so." Hopwood has Griffin embark Marines in Japan in
        the *Lenawee* and *Thomaston*.
      n: '[[w.marolda-united-states-navy-and]], 46. See [[cal.1960-08-09.laos]]. Names: Souvanna Phouma.'
      src:
        c: ff15baf4
        rows:
        - 'w.marolda-united-states-navy-and 46: all'
      tags:
      - name:souvanna-phouma
- add:
    entry:
      id: cal.1960-09-01.vietnam
      when: Sept. 1
      date: '1960-09-01'
      thread: vietnam
      c: The SS *Breton* sails for Vietnam with the first six AD-6 Skyraiders for the Vietnamese air force, with their equipment;
        all twenty-five of the first squadron there by the end of May 1961.
      n: '[[w.marolda-united-states-navy-and]], 250. To check: CINCPAC, Command History, 1960, 141–42, 156; 1961, 186 (cited
        by [[w.marolda-united-states-navy-and]], 250).'
      src:
        c: f08c4b77
        rows:
        - 'w.marolda-united-states-navy-and 250: all'
- add:
    entry:
      id: cal.1961-05-18.vietnam
      when: May 18
      date: '1961-05-18'
      thread: vietnam
      c: 'Burke directs the Bureau of Ships and the Deputy CNO (Logistics) to study craft for guerrilla and counterguerrilla
        war: "boats of many kinds and sizes for real fighting." The Bureau sets up a body for it June 1.'
      n: '[[w.marolda-united-states-navy-and]], 116. Names: Burke.'
      src:
        c: 6ef15c60
        rows:
        - 'w.marolda-united-states-navy-and 116: all'
      tags:
      - name:burke-arleigh-a
- add:
    entry:
      id: cal.1961-07-09.vietnam-operations
      when: July 9
      date: '1961-07-09'
      thread: vietnam-operations
      c: Off the 17th parallel. Fishing boats from Gio Island, north of the Demilitarized Zone, lure South Vietnamese patrols;
        six junk force boats that pursue are surrounded by twenty armed motor boats and fired on. Their return fire drives
        the North Vietnamese off, one fishing boat left behind.
      n: '[[w.marolda-united-states-navy-and]], 160. To check: CINCPAC, Command History, 1960, 169 (cited by [[w.marolda-united-states-navy-and]],
        160).'
      src:
        c: 375052b1
        rows:
        - 'w.marolda-united-states-navy-and 160: all'
- add:
    entry:
      id: cal.1961-09-29.vietnam
      when: Sept. 29
      date: '1961-09-29'
      thread: vietnam
      c: Felt, visiting Vietnam, raises with Diệm the Vietnamese navys want of men.
      n: '[[w.marolda-united-states-navy-and]], 150. Check: the figures of the passage before it. Names: Felt, Ngô Đình Diệm.'
      src:
        c: 587fbd05
        rows:
        - 'w.marolda-united-states-navy-and 150: all'
      tags:
      - name:felt-harry-d
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1962-01-01.vietnam
      when: Jan. 1
      date: '1962-01-01'
      thread: vietnam
      c: Sixty-man SEAL units set up in the Atlantic and Pacific Fleets, on the CNOs authority; SEAL Team 1 at Coronado, Cal.,
        under Del Giudice, readied for Southeast Asia.
      n: '[[w.marolda-united-states-navy-and]], 189. Names: Anderson.'
      src:
        c: f1d0a14a
        rows:
        - 'w.marolda-united-states-navy-and 189: all'
      tags:
      - name:anderson-george-w-jr
- add:
    entry:
      id: cal.1962-01-04.vietnam-operations
      when: Jan. 4–27
      date: '1962-01-04'
      thread: vietnam-operations
      c: The *Cook*, with UDT detachments, surveys the beaches off South Vietnam (Quảng Trị, Đà Nẵng, Nha Trang, Cam Ranh
        Bay, Vũng Tàu, Qui Nhơn) for Sides; done without incident Jan. 27.
      n: '[[w.marolda-united-states-navy-and]], 178.'
      src:
        c: ea036e76
        rows:
        - 'w.marolda-united-states-navy-and 178: all'
- add:
    entry:
      id: cal.1962-02-17.vietnam-operations
      when: Feb. 17
      date: '1962-02-17'
      thread: vietnam-operations
      c: 'Seventh Fleet Operation Plan 75-62 takes effect: the destroyer escorts *Edmonds* and *Walton*, Lewis commanding,
        relieve Mine Division 11 on the patrol at the border between North and South Vietnam.'
      n: '[[w.marolda-united-states-navy-and]], 172. To check: CINCPACFLT 170301Z Jan. 1962; CINCPAC 192347Z Jan., CTF 72
        090308Z Feb., 100312Z (cited by [[w.marolda-united-states-navy-and]], 172).'
      src:
        c: 76cd47f8
        rows:
        - 'w.marolda-united-states-navy-and 172: all'
        - 'via x.1962-01-17.cpflt-170301z-patrol: all'
- add:
    entry:
      id: cal.1962-02-19.vietnam
      when: Feb. 19
      date: '1962-02-19'
      thread: vietnam
      c: 'Honolulu, the third Secretary of Defense conference. McNamara approves MAP money to expand the junk force from 80
        to 644 junks in twenty-eight divisions, 501 built in Vietnamese yards at American cost. Harkins and Nolting: internal
        security improving.'
      n: '[[w.marolda-united-states-navy-and]], 228, 264. To check: CINCPAC, "Record of the Secretary of Defense Conference
        held 19 February 1962," ser 00062, Feb. 20, 1962 (cited by [[w.marolda-united-states-navy-and]], 171). Names: McNamara,
        Harkins, Nolting.'
      src:
        c: 5eb22159
        rows:
        - 'w.marolda-united-states-navy-and 228: all'
        - 'w.marolda-united-states-navy-and 264: C'
        - 'via x.1962-02-20.cincpac-record-secdef-conference-feb-19: all'
      tags:
      - name:mcnamara-robert-s
      - name:harkins-paul-d
      - name:nolting-frederick-e-jr
- add:
    entry:
      id: cal.1962-07-01.vietnam
      when: July 1
      date: '1962-07-01'
      thread: vietnam
      c: 'The Headquarters Support Activity, Saigon, established, the MAAGs support staff its nucleus: 445 men by December,
        251 Navy, 188 Army, 6 Air Force.'
      n: '[[w.marolda-united-states-navy-and]], 255. To check: CINCPAC, Command History, 1962, 159–60 (cited by [[w.marolda-united-states-navy-and]],
        255).'
      src:
        c: 44afc5dd
        rows:
        - 'w.marolda-united-states-navy-and 255: all'
- add:
    entry:
      id: cal.1962-08-01.vietnam-operations
      when: Aug. 1
      date: '1962-08-01'
      thread: vietnam-operations
      c: The Seventh Fleet ends its patrol off the 17th parallel, after seven months its first major operation in direct support
        of the South Vietnamese.
      n: '[[w.marolda-united-states-navy-and]], 177. See [[cal.1962-02-17.vietnam-operations]].'
      src:
        c: c2e67d56
        rows:
        - 'w.marolda-united-states-navy-and 177: all'
- add:
    entry:
      id: cal.1962-09-27.vietnam
      when: Sept. 27
      date: '1962-09-27'
      thread: vietnam
      c: The Special Group (5412) proposes PT boats and SEALs for covert operations against North Vietnam.
      n: '[[w.marolda-united-states-navy-and]], 203. To check: Krisel, "Special Maritime Operations in Vietnam," 72–79; CINCPAC,
        Command History, 1962, 177–78 (cited by [[w.marolda-united-states-navy-and]], 203).'
      src:
        c: 459db207
        rows:
        - 'w.marolda-united-states-navy-and 203: all'
- add:
    entry:
      id: cal.1962-10-06.vietnam
      when: Oct. 6
      date: '1962-10-06'
      thread: vietnam
      c: Gilpatric directs the Navy to reactivate two aluminum-hulled motor torpedo boats of 1950 by January 1963.
      n: '[[w.marolda-united-states-navy-and]], 203. See [[cal.1962-09-27.vietnam]]. Names: Gilpatric.'
      src:
        c: 952da69a
        rows:
        - 'w.marolda-united-states-navy-and 203: all'
      tags:
      - name:gilpatric-roswell-l
- add:
    entry:
      id: cal.1963-10-16.vietnam
      when: Oct. 16
      date: '1963-10-16'
      thread: vietnam
      c: 'The Joint General Staff adopts the Vietnamese navys new structure: four naval zone commands working with the armys
        four corps zones, with operational control of the Coastal, River and Sea Force units in them.'
      n: '[[w.marolda-united-states-navy-and]], 225.'
      src:
        c: 2a0d142a
        rows:
        - 'w.marolda-united-states-navy-and 225: all'
- add:
    entry:
      id: cal.1963-12-20.vietnam
      when: Dec. 20
      date: '1963-12-20'
      thread: vietnam
      c: Saigon, the Secretary of Defense conference. McNamara reviews and approves the concept of operations of the completed
        plan 34A.
      n: '[[w.marolda-united-states-navy-and]], 335. To check: U.S.-V.N. Relations, bk. 3, pt. IVC.1, 1–7; pt. IVC.2a, 1–2;
        CINCPAC 301841Z Nov. 1963 (cited by [[w.marolda-united-states-navy-and]], 335). Names: McNamara.'
      src:
        c: '65981562'
        rows:
        - 'w.marolda-united-states-navy-and 335: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-01-07.vietnam
      when: Jan. 7
      date: '1964-01-07'
      thread: vietnam
      c: 'The Seventh Fleets revised directive for the Desoto Patrol: its mission broadened to "all-source intelligence."'
      n: '[[w.marolda-united-states-navy-and]], 394. Check: the change to the ships approach limit, in the sentence after.'
      src:
        c: 720720b7
        rows:
        - 'w.marolda-united-states-navy-and 394: all'
- add:
    entry:
      id: cal.1964-01-19.vietnam
      when: Jan. 19
      date: '1964-01-19'
      thread: vietnam
      c: The SS *Pioneer Myth* leaves Norfolk with PTF-1 and PTF-2 for Subic Bay, for the 34A raids; four Norwegian Nastys,
        PTF-5 to 8, shipped from Bergen Feb. 1 in the *Point Barrow*.
      n: '[[w.marolda-united-states-navy-and]], 340.'
      src:
        c: 5400b5f2
        rows:
        - 'w.marolda-united-states-navy-and 340: all'
- add:
    entry:
      id: cal.1964-01-24.vietnam
      when: Jan. 24
      date: '1964-01-24'
      thread: vietnam
      c: MACVs Special Operations Group, later the Studies and Observation Group, set up under Harkins, to run the 34A operations,
        the maritime ones among them; Washingtons control through SACSA.
      n: '[[w.marolda-united-states-navy-and]], 338. To check: CINCPAC 210314Z Jan. 1964; U.S.-V.N. Relations, bk. 3, pt.
        IVC.2(a), 1–4 (cited by [[w.marolda-united-states-navy-and]], 338). Names: Harkins.'
      src:
        c: e8cad16f
        rows:
        - 'w.marolda-united-states-navy-and 338: all'
      tags:
      - name:harkins-paul-d
- add:
    entry:
      id: cal.1964-04-21.vietnam
      when: Apr. 21
      date: '1964-04-21'
      thread: vietnam
      c: 'The Joint Chiefs approve Operation Plan 37-64: forces to strike North Vietnamese targets, then reinforce the South
        Vietnamese air forces.'
      n: '[[w.marolda-united-states-navy-and]], 372. Check: the plans terms on the page before.'
      src:
        c: a353e5ad
        rows:
        - 'w.marolda-united-states-navy-and 372: all'
- add:
    entry:
      id: cal.1964-04-22.laos
      when: Apr. 22
      date: '1964-04-22'
      thread: laos
      c: During the coup in Vientiane, a task group built around the *Kitty Hawk* steams for the South China Sea. Apr. 23,
        Souvanna Phouma back in power, it returns to normal operations, within forty-eight hours of a point off South Vietnam.
      n: '[[w.marolda-united-states-navy-and]], 375. To check: CINCPAC 222333Z Apr. 1964 (cited by [[w.marolda-united-states-navy-and]],
        375). Names: Souvanna Phouma.'
      src:
        c: 8379a7ee
        rows:
        - 'w.marolda-united-states-navy-and 375: all'
        - 'via x.1964-04-22.cincpac-222333z-kitty-hawk: all'
      tags:
      - name:souvanna-phouma
- add:
    entry:
      id: cal.1964-05-21.laos
      when: May 21
      date: '1964-05-21'
      thread: laos
      c: 'The Navys first Yankee Team mission: two RF-8As of Light Photographic Squadron 63 from the *Kitty Hawk* over the
        Plain of Jars, 8 a.m.; one hit by ground fire over Xieng Khouang.'
      n: '[[w.marolda-united-states-navy-and]], 379. See [[cal.1964-05-17.laos]].'
      src:
        c: 924be90c
        rows:
        - 'w.marolda-united-states-navy-and 379: all'
- add:
    entry:
      id: cal.1964-08-21.laos
      when: Aug. 21
      date: '1964-08-21'
      thread: laos
      c: Klusmann, shot down June 6, reaches friendly Meo forces near Bouam Long, three days after escaping from the Pathet
        Lao with five Thai and Lao prisoners; one companion with him at the end.
      n: '[[w.marolda-united-states-navy-and]], 382. See [[cal.1964-06-06.laos]].'
      src:
        c: 88f957d5
        rows:
        - 'w.marolda-united-states-navy-and 382: all'
- add:
    entry:
      id: cal.1964-09-21.vietnam
      when: Sept. 21
      date: '1964-09-21'
      thread: vietnam
      c: 'The Navy sends Captain Bartons team to Southeast Asia to investigate the incident of Sept. 18: Barton "90 percent
        certain" of one small, high-speed craft near the destroyers.'
      n: '[[w.marolda-united-states-navy-and]], 459. See [[cal.1964-09-18.vietnam]]. Check: the quotations close, on the next
        page.'
      src:
        c: c8b0028d
        rows:
        - 'w.marolda-united-states-navy-and 459: all'
- add:
    entry:
      id: cal.1965-01-28.vietnam
      when: Jan. 28
      date: '1965-01-28'
      thread: vietnam
      c: The Joint Chiefs call for a Desoto patrol from Feb. 3, no nearer than thirty miles to North Vietnam, south of the
        20th parallel; the *George K. Mackenzie* and *Ernest G. Small* named.
      n: '[[w.marolda-united-states-navy-and]], 494.'
      src:
        c: 18bcf1b2
        rows:
        - 'w.marolda-united-states-navy-and 494: all'
- add:
    entry:
      id: cal.1965-02-11.vietnam-operations
      when: Feb. 11–16
      date: '1965-02-11'
      thread: vietnam-operations
      c: Martin proposes a seaplane detachment at Đà Nẵng, SP-5B Marlins with a tender; set up, then deactivated Feb. 16 for
        fear of saboteurs, the patrol forces back to Sangley Point.
      n: '[[w.marolda-united-states-navy-and]], 495–96.'
      src:
        c: a03d7c60
        rows:
        - 'w.marolda-united-states-navy-and 495: all'
        - 'w.marolda-united-states-navy-and 496: all'
- add:
    entry:
      id: cal.1965-02-28.laos
      when: Feb. 28
      date: '1965-02-28'
      thread: laos
      c: 'The Navys first choke point mission in Barrel Roll: 14 Skyhawks and 10 Skyraiders from the *Coral Sea*, 2 Crusaders
        photographing, against Mụ Giạ Pass, 117 bombs of 500 to 2,000 pounds, some fused to explode six days later. No antiaircraft
        fire.'
      n: '[[w.marolda-united-states-navy-and]], 510.'
      src:
        c: ec0e2115
        rows:
        - 'w.marolda-united-states-navy-and 510: all'
- add:
    entry:
      id: cal.1965-03-15.vietnam-air-war
      when: Mar. 15
      date: '1965-03-15'
      thread: vietnam-air-war
      c: 'The Navys first Rolling Thunder strike: sixty-four Skyhawks and Skyraiders from the *Hancock* and *Ranger*, Millers
        Task Force 77, on the ammunition depot at Phú Quí, between Vinh and Thanh Hóa, 1 p.m.'
      n: '[[w.marolda-united-states-navy-and]], 505. See [[cal.1965-03-02.vietnam]].'
      src:
        c: 8b2ed0e7
        rows:
        - 'w.marolda-united-states-navy-and 505: all'
