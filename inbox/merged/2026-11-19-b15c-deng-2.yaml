- add:
    entry:
      id: cal.1964-10-13.china-leadership-5
      when: Oct. 13
      date: '1964-10-13'
      thread: china-leadership
      c: 'Deng Xiaoping 邓小平 presides at the Secretariat 书记处, which discusses and agrees Li Fuchun''s report of the national planning conference''s discussion of revolutionizing planning work and of the draft outline of national economic construction for 1965. On the State Planning Commission: it is the Center''s and State Council''s general staff, its main task the over-all balance of strategic layout, technical revolution, investment and labor and wages and the five-year and long-range plans; it must stand high and manage broadly; to build the southwest railways it must keep track of progress and whether ''battles of annihilation'' are fought; starting a dozen projects at once is worse than finishing one; on the first, second and third lines: they are a strategic question, the base of the Third Plan and in fact the long-range plan; moving plants is ''one into two'', moving key technical strength and prototypes to the rear to build the third line with the first line''s technical strength; coastal enterprises are to go on, mechanizing and automating; on trusts: to manage enterprises by economic methods, to cooperate through economic ties, to specialize and serialize, and develop new technique faster.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1831–1832 (Oct. 13, 1964). The words: 下午 (III, 1831–1832). Made public: 2009 (the nianpu). See [[cal.1964-10-13.china-leadership]]. Names: Deng Xiaoping. Check: whether the Secretariat session is that at which Zhou Enlai reported on propaganda after the explosion ([[cal.1964-10-13.china-leadership]]).'
      src:
        c: d86193b3
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1831–1832: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
      time_range:
      - 1964-10-13T04:00Z
      - 1964-10-13T10:00Z
