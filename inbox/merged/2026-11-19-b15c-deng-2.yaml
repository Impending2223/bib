      id: cal.1965-06-01.china-leadership-9
      when: June 1
      date: '1965-06-01'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 hears the leading group of the symposium on pilot work with trusts 托拉斯试点工作座谈会 (the nianpu''s note: held by the State Economic Commission''s Party group May 10–June 7, with the trusts and central industrial and communications and economic departments and nine provincial and municipal Party committees). Deng: the world speaks of trusts but the Chinese must differ; capitalist trusts are for monopoly, competition and profit, the Chinese are to be socialist trusts, and if they cannot raise quality, add variety, cut cost and raise labor productivity and technique it is no good; the Chinese too create profit and wealth, but chiefly to consolidate public ownership and bring out socialism''s superiority; for that rational layout must be weighed, as with salt, rock salt, lake salt and their use together; ''peace and war joined'' is also a question of layout; a trust charter is wanted to settle the trusts'' internal and external questions.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1864 (June 1, 1965). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
