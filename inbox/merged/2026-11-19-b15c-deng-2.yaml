- add:
    entry:
      id: cal.1966-03-10.china-leadership-6
      when: Mar. 10
      date: '1966-03-10'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 hears the Shaanxi provincial Party committee. When told that the landlords and rich peasants newly classed in the socialist education movement equal those of land reform, he says: those who for ten-odd years have worked honestly, accepted remolding and made no trouble need not again wear the cap; this policy must be shown, a very important policy. On industry: it is a question of matching sets; more small industry, a question of direction; go the way of specialization and cooperation, more economical; city surplus labor to be organized, all taking part in labor, so that petty theft and trouble at the city people''s committee fall off and the big plants'' output can multiply, the whole country to go this way. On the ''four clean-ups'': work with cadres who erred, encourage them, divide in two, say they are bad now, were good, have forgotten their root and may recall it, those who mend after a time may be elected again; the Twenty-three Articles have strict limits, restitution reasonable, the share of cadres dealt with not large, one, two, three, four percent, the blow not wide, so that after the work teams leave grass-roots cadres, new and old, can unite to work.'
      place: xian
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1899–1900 (Mar. 10, 1966). The words: 下午 (III, 1899–1900). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
