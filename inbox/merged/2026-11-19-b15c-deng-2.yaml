      c: 'Deng Xiaoping 邓小平 meets Williams 威廉斯, chairman of the New Zealand Communist Party, on a visit. Deng: China''s industry, after two years of adjustment, is wholly on track; capital construction in the Third Plan will total much more than in the first two plans; the country''s work comes down to two things, developing productive forces and preventing revisionism, which flies the flag of socialism and communism to serve a privileged stratum; this year and next China will buy some grain, chiefly for reserve; the world must still guard against imperialism and revisionism joining against China; the Chinese do not fear a third world war, but local wars are possible, the Tonkin Gulf incident being a signal.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1825 (Aug. 22, 1964). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
