      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, with Kang Sheng 康生 and Liu Ningyi 刘宁一, holds the second talk with the Moroccan Communist Party delegation. On national liberation: it is part of the world proletarian revolution and the direct ally of the proletariat; the third world of Asia, Africa and Latin America is the main force weakening imperialism; China as a socialist state will support all anti-imperialist struggles and preach self-reliance, so that imperialism loses its objects of exploitation; socialism in the end abolishes exploitation, and state management of enterprises alone is not socialism, for it exists in the United States, Germany and France.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1846–1847 (Feb. 12, 1965). The words: 下午 (III, 1846–1847). Made public: 2009 (the nianpu). See [[cal.1965-02-11.china-leadership-7]]. Names: Deng Xiaoping, Kang Sheng.'
