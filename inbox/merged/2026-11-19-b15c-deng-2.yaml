      c: Deng Xiaoping 邓小平, with Peng Zhen 彭真, Kang Sheng 康生, Yang Shangkun 杨尚昆 and Liu Ningyi 刘宁一, revises the Chinese delegation's address to the SED congress after the Politburo 政治局 meeting. The revised address stresses consultation among fraternal parties as equals, unity, and opposes sham unity and real split.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1743 (Jan. 17, 1963). The words: 会后 (III, 1743). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Peng Zhen, Kang Sheng.'
