- cite:
    id: cal.1966-08-12.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1930 (Aug. 12, 1966; Deng at the closing session of the Eleventh Plenum Lin Biao presides over; on Mao''s view the Central leadership is reorganized: the order of the Politburo Standing Committee becomes Mao Zedong, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Deng Xiaoping, Kang Sheng, Liu Shaoqi, Zhu De, Li Fuchun and Chen Yun; no new election of chairman and vice-chairmen, but except Lin Biao the vice-chairman posts of Liu, Zhou, Zhu and Chen Yun are no longer mentioned, Lin in fact becoming Mao''s ''successor''; Tao Zhu, Chen Boda, Kang Sheng, Xu Xiangqian, Nie Rongzhen and Ye Jianying are added to the Politburo, Li Xuefeng, Song Renqiong and Xie Fuzhi as alternates; the Secretariat is reorganized, Peng Zhen, Luo Ruiqing and Lu Dingyi removed as secretaries and Yang Shangkun as alternate, Xie Fuzhi and Liu Ningyi elected; Mao in his closing speech: comrades who err are to be given a way out, allowed to correct errors, the policy being ''learn from past mistakes to avoid future ones, cure the sickness to save the patient''; after the meeting the Secretariat that had handled the Center''s daily business since the Eighth Congress of 1956 in the main stops work; in late August, with Mao''s agreement, a system of ''head-bumping'' (碰头会) meetings of the Standing Committee (enlarged) with all members of the Cultural Revolution Group is set up, generally under Zhou Enlai)'
    units: B
- cite:
    id: cal.1966-08-13.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1930 (Aug. 13–23, 1966; Deng at the Central Work Conference Lin Biao presides over to carry out the spirit of the Eleventh Plenum; the conference goes on criticizing Liu Shaoqi, and Deng too is criticized; after it Deng hands the work of the Central Investigation Department, which he oversaw, and other work to Kang Sheng)'
    units: B
