- cite:
    id: cal.1966-02-12.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1894 (Feb. 12, 1966; 批发; Deng approves and issues the Outline Report on the current academic discussion, asking all places and departments to carry it out accordingly. In keeping with its spirit the Propaganda Department and other departments limit the critical articles that push the academic questions concerning Wu Han 吴晗 and his new historical play *Hai Rui Dismisses the Official* 海瑞罢官 《海瑞罢官》 to the extreme)'
- cite:
    id: cal.1966-02-12.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1894 (Feb. 12, 1966; afternoon, 下午; Deng with Liu Shaoqi and Zhou Enlai hears Yu Qiuli 余秋里 on his return from the Southwest; of ways of joining factory and commune he says the factory must help the commune bring politics and not let it lie on the state, with mutual aid, mutual benefit and exchange of equal values; of street and commune industry: Shanghai is formidable because its street industry is well developed, small plants, specialized, nimble, much invention; Jinzhou has many small things too; the experience is to be valued and some of the big plants'' production passed to small plants)'
