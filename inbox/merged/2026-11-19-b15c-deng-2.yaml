    id: cal.1963-07-12.china-leadership-5
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1764 (July 12, 1963; Deng at the fourth meeting; speaks that the differences show chiefly in two great questions, whether to have revolution and whether to keep the socialist camp united; says that on a series of questions the Soviet Union practices splitting, not internationalism)'
