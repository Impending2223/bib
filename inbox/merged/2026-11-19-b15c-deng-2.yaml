      thread: china-leadership
      also:
      - soviet-union
      c: 'Deng Xiaoping 邓小平 reads Kang Sheng''s 康生 letter of the same day to Mao Zedong 毛泽东. Comment: the original draft of the Central Committee''s 中央 statement can be fixed, not changed; after the Politburo 政治局 passes it at 8 tonight it can be broadcast tonight and printed tomorrow. Mao: read, agree with Deng''s view. Kang''s letter: the full text of Khrushchev''s 赫鲁晓夫 report to the CPSU plenum has been received and translated; the passage attacking the Chinese party is copied on another sheet.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1761 (June 30, 1963). The words: 阅 (III, 1761). Deng: 原中共中央声明稿可以定下，不要改了 (III, 1761). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Kang Sheng, Mao Zedong, Khrushchev.'
