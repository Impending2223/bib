    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1933 (Oct. 23, 1966; Deng makes his self-criticism at the Central Work Conference; besides examining his so-called ''line error'' he says it must be made clear that the great majority of the work teams are good comrades, and that for the mistakes made in this work, except in a few cases, the chief responsibility should not be borne by them but by himself and Comrade Shaoqi)'
    units: B
