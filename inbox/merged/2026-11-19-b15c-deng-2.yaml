- cite:
    id: cal.1966-07-29.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1926 (July 29, 1966; Deng speaks, for the Central Committee 中央, at the meeting of ten thousand teachers and students, activists of the ''cultural revolution'' in Peking''s 北京 colleges and middle schools, which the Peking municipal committee holds in the Great Hall of the People 人民大会堂; there Li Xuefeng 李雪峰, on Mao''s instruction, announces in the Central Committee''s name the withdrawal of the work teams from the schools, and Zhou Enlai 周恩来 and Liu Shaoqi 刘少奇 make self-criticisms and take responsibility for sending the teams. Deng: it must be said that after the new Peking Party committee was set up the teams were sent in its name on the Center''s view; the Center''s way of dealing with this new problem was fairly hasty; some comrades say old revolutionaries meet new problems, and so it is; the comrades in the Center and in the municipal committee have no experience of such an unprecedented movement and did not give the teams concrete support in some respects; most of the team members wished subjectively to do well, but leadership did not help them enough, and they had not learned to use Mao''s mass line and democratic centralism and made this or that error, most errors being of thinking and working method, some responsibility falling on those above; all good team comrades are to take an active attitude and accept the masses'' criticism with an open mind)'
