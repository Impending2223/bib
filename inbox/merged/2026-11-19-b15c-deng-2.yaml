      c: 'Deng Xiaoping 邓小平 writes to Mao Zedong 毛泽东 on making a self-criticism at the Central Work Conference 中央工作会议: "This is the draft of my self-criticism for the work conference the day after tomorrow (the 23rd); its basic content is what I had prepared for the meeting of the work-team heads, with small changes of words and content. I send it, hoping you will look at it and give instructions."'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1932 (Oct. 21, 1966). The words: 致信毛泽东 (III, 1932). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Mao Zedong.'
