- cite:
    id: cal.1966-04-09.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1907–1908 (Apr. 9, 11 and 12, 1966; Deng presides at three Secretariat meetings, at which Kang Sheng, back from outside Peking, conveys Mao''s three talks of late March (footnote 2: Mar. 28–30, at Shanghai, with Kang Sheng, Jiang Qing, Zhang Chunqiao and others, criticizing the ''February Outline'' for confusing class lines and right and wrong and calling the Propaganda Department a ''palace of the King of Hell'' that the Peking Party committee and the Propaganda Department shelter bad people, naming Peng Zhen); Kang Sheng and Chen Boda criticize Peng Zhen''s so-called ''serious errors'' and Peng is forced to make a self-criticism; Zhou Enlai and Wu Lengxi attend; the meeting decides to draft in the Center''s name a notice thoroughly criticizing the errors of the ''February Outline'' and revoking it, and to form a drafting group for cultural revolution documents headed by Chen Boda, to report to Mao and the Standing Committee)'
    units: B-C
- cite:
    id: cal.1966-04-12.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1908 (Apr. 12, 1966; Deng drafts the report he, Zhou Enlai and Peng Zhen send to Mao, then at Hangzhou, sending the ''Report on Comrade Luo Ruiqing''s errors'' and a draft of the Central Committee''s comment, and reporting the Secretariat''s decision on the ''February Outline''; with a letter: to report in person the three of them propose to go to the Chairman, with Jianying and Jinghua (Xiao Hua) for Luo''s problem, Boda and Kang Sheng for the academic criticism; they hope to go on the 15th, Lê Duẩn leaving Peking that day; after both are discussed Deng, Li Fuchun, Qiuli, Yibo and Gu Mu are to report on the Northwest trip, chiefly the Five-Year Plan; Mao replies on the 14th, asking Kang Sheng, Boda and other drafting-group members to go to Shanghai that day or the next to settle the document with the Shanghai comrades, then come to him the night of the 16th or morning of the 17th, the three of them to come on the 16th; he has some changes)'
    units: A-B
- cite:
    id: cal.1966-04-13.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1909 (Apr. 13, 1966; afternoon, 下午; Deng with Zhou Enlai meets the delegation of the Vietnam Workers'' Party Central Committee under Lê Duẩn 黎笋, its first secretary, exchanging views on the relations of the two parties and other matters)'
