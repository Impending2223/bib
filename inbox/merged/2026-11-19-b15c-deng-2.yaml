    units: B
- cite:
    id: cal.1963-07-15.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1765 (July 15, 1963; Deng at the sixth meeting; Peng Zhen, deputy head of the delegation, speaks: the CPSU''s open letter during the talks is a most serious step, bringing relations between the two parties and states to the brink of rupture)'
    units: B
