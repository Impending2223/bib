- cite:
    id: cal.1965-11-10.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1880 (Nov. 10, 1965; the Shanghai Wenhui bao prints Yao Wenyuan 姚文元''s article ''On the new historical play *Hai Rui Dismisses the Official*''; the nianpu (footnote 2: Yao then editorial-board member of the Jiefang ribao and a member of the Shanghai Party committee''s writing group): the article was planned by Jiang Qing at Shanghai and approved by Mao before publication; it ties the play''s ''returning the land'' and ''redressing wrongs'' to the so-called ''go-it-alone wind'' and ''reversal wind'' of 1962, charges the author Wu Han 吴晗 (footnote 3: then vice-mayor of Peking) with wishing to pull down the people''s communes and restore the landlords'' and rich peasants'' rule, shocked the country and became the fuse of the Cultural Revolution)'
