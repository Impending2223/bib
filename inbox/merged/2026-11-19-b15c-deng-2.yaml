      when: Feb. 11
      date: '1965-02-11'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, with Kang Sheng 康生 and Liu Ningyi 刘宁一, holds the first talk with the delegation of the Moroccan Communist Party under its first secretary Ali Yata 阿里·亚塔. Deng: the Chinese party''s two basic experiences are building socialism on self-reliance and fully rousing the people; in the first years of the state the Chinese made the error of dogmatism, copying others'' experience, and looking to the Soviet Union for lack of knowledge; part of the Soviet experience was rightly learned, part wrongly; self-reliance does not mean no contact abroad but relying chiefly on oneself; in hard times the leadership told the people the difficulties and its own errors and called on their wisdom; the mass line is the party''s and the country''s basic tradition.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1845–1846 (Feb. 11, 1965). The words: 下午 (III, 1845–1846). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Kang Sheng.'
