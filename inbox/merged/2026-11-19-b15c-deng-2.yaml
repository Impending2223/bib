      - vis:only:prc
- cite:
    id: cal.1969-10-17.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1948 (Oct. 17, 1969; the nianpu: Zhou Enlai and the Politburo''s members talk in groups with some old cadres in Peking and pass on the decision of Mao and the Center to disperse them, on a war footing, to other places on Oct. 20 or after; Mao names Dong Biwu, Zhu De and Ye Jianying for Guangdong, Chen Yun, Deng Xiaoping and Wang Zhen for Jiangxi, Chen Yi for Shijiazhuang, Nie Rongzhen for Handan and Xu Xiangqian for Kaifeng)'
    units: A-E
- add:
    entry:
      id: cal.1969-10.china-leadership-6
      when: Oct., mid
      date: 1969-10
      thread: china-leadership
      also:
      - china
      at: before 1969-10-11
      c: 'Deng Xiaoping 邓小平, at home, sees Wang Dongxing and Wang Liang''en 王良恩 (footnote: then a deputy director of the Central Committee''s 中央 General Office) and learns of the Center''s decision that some old cadres be dispersed on a war footing; he and Zhuo Lin are to go to a Jiangxi factory to work and be tempered. He asks Wang Dongxing to let him take his stepmother Xia Bogen along, to write to Wang from Jiangxi if need be, and to have wooden boxes made to carry his books. The General Office approves; Deng''s eldest daughter Deng Lin 邓林, sent down two years to Xuanhua in Hebei, is allowed back to help pack. Zhuo Lin visits Pufang at the General Hospital.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1948 (Oct. 1969). The words: 10月中旬 (III, 1948). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 9b3c2ff5
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1948: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
- cite:
    id: cal.1969-10-18.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1949 (Oct. 18, 1969; Zhou Enlai telephones Cheng Huiyuan 程惠远 (footnote: then head of the office of the core group of the Jiangxi revolutionary committee), asking Jiangxi to settle Chen Yun, Wang Zhen and Deng Xiaoping properly, to look after their living, and to report the arrangement to the Center)'
    units: A
- cite:
    id: cal.1969-10-19.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1949 (Oct. 19, 1969; Zhou Enlai, told that Jiangxi means to put Deng and his wife at Ganzhou 赣州, says by telephone that it is not fitting, communications are poor there and conditions in the hills bad; they should be put in the suburbs of Nanchang, in a two-storey house with its own courtyard; Jiangxi''s revolutionary committee readjusts its plan accordingly)'
    units: B-C
- add:
    entry:
      id: cal.1969-10-21.china-leadership-2
      when: Oct. 21
      date: '1969-10-21'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 writes to Wang Dongxing: he pledges to follow the Chairman''s teaching, be careful, and work and labour as best he can as an ordinary Party member and a citizen of socialist China. Wang passes the letter to Mao Zedong 毛泽东, Lin Biao 林彪, Zhou Enlai 周恩来 and others.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1949 (Oct. 21, 1969). The words: 致信汪东兴 (III, 1949). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Mao Zedong, Lin Biao, Zhou Enlai.'
      src:
        c: f40f35dd
        rows:
