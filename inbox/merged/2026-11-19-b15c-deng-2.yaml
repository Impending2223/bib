- cite:
    id: cal.1965-12-08.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1886–1887 (Dec. 8–15, 1965; Deng at the enlarged Politburo Standing Committee meeting Mao presides over at Shanghai, on the Luo Ruiqing 罗瑞卿 question; there Lin Biao, Ye Qun 叶群 (footnote: then director of Lin''s office), Wu Faxian 吴法宪 (commander of the Air Force) and Li Zuopeng 李作鹏 (deputy commander of the Navy) list charges against Luo, slandering him as ''opposing putting politics first'' and ''usurping the army and opposing the Party'', in a sudden attack, and Luo is moved from his military leading post)'
