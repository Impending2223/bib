      c: 'Deng Xiaoping 邓小平 meets the delegation of the Sudanese Communist Party 苏丹共产党 (the revolutionary leadership). Deng: to settle a country''s revolutionary questions is not easy; even with the line right, without a set of concrete policies serving it the line cannot be carried out; the only experience of the Chinese revolution of universal meaning is the principle of joining Marxism–Leninism to one''s own conditions; every party makes its own programme and policies from its own conditions, errors are corrected by itself, right or wrong both can be a precious asset; nationalist states, if they oppose imperialism and follow a policy of independent national economic development, are progressive.'
