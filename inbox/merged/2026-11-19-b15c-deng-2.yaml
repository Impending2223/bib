      c: 'Deng Xiaoping 邓小平, with Peng Zhen 彭真 and others, in talks with Aidit 艾地. Deng: the Chinese were a little dogmatic in thinking that much steel stood for a country''s industrial level; the slogan "catch up with Britain in fifteen years" is inexact and will no longer be borne; the present slogan is to build a fairly complete, independent, modern national economy, with the four modernizations of agriculture, industry, national defense, and science and technology.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1773 (Sept. 18, 1963). Made public: 2009 (the nianpu). See [[cal.1963-08-30.china-leadership-7]]. Names: Deng Xiaoping, Peng Zhen, Aidit.'
