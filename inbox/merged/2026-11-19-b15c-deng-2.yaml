      c: 'Deng Xiaoping 邓小平, at the Jiuquan 酒泉 steel works, hears Lü Dong 吕东, Minister of Metallurgy, on its construction. On small steel enterprises: coal pits are being made small, steel too must be small, 10,000, 20,000, 30,000 tons; local small steel works are the locality''s, not allocated by the state; they must be clear on technical policy and use model designs, make ordinary steel and ordinary sections, chiefly for local use serving agriculture; state investment to the localities is chiefly for small steel; their equipment must be in the state plan, since it takes machine-building capacity, and in the plan it can be arranged as a whole.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1902–1903 (Mar. 24, 1966). The words: 上午 (III, 1902–1903). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
