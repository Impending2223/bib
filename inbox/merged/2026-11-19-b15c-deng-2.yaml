    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1803 (Mar. 9, 1964; afternoon, 下午; Deng presides at the Secretariat; on the Central Work Conference to be held in April (it met May 15–June 17, the nianpu''s note) says the central subject is agricultural planning, basic farmland construction to go into the capital-construction plan and the economic plan to rest on it, less grain to be imported to save exchange for fertilizer and chemical plant; on education and science: students'' health is poor, their living allowances should be raised, useful out-of-class books published, and scientific authors'' fees raised)'
