- add:
    entry:
      id: cal.1963-09-20.china-leadership-3
      when: Sept. 20
      date: '1963-09-20'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, with Peng Zhen 彭真, meets and dines the Japanese Communist Party delegation under Takenaka Tsunesaburo 竹中恒三郎, member of its Central Committee 中央. On copying others'' experience: a dogmatism hard to avoid; it cannot be called an error, there being no other choice, as a child learning to walk must be held; looking back there are many mistakes in practical work; the thing is to sum up experience, in revolution and in construction. On the communes: in the first stage of communization there was too little experience, with equalitarianism, communes and production teams too large; the Center saw and noted these; at the end of 1958 Mao proposed opposing equalitarianism, but poor and lower-middle peasants like it and so do cadres; it violates distribution by labor; the social guarantee system was always kept, good for poor peasants short of labor.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1773–1774 (Sept. 20, 1963). Deng: 一个娃娃开始走路的时候，总是要有人扶着走的 (III, 1773). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Peng Zhen.'
      src:
        c: 36c3c22f
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1773–1774: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
- cite:
    id: cal.1963-09-23.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1774 (Sept. 23, 1963; Deng at the Central Work Conference''s plenary gives ''Report on international questions'' 《关于国际问题的报告》, with some of the Sino-Soviet party talks; says the CPSU Central Committee''s plenum resolution of June 21 and the open letter of July 14 mark a new stage; the line stays: hold to principle, hold to unity, fight resolutely, leave room, strike after the other, oppose a split; prepare for a final break in the relations of the two parties and states)'
- add:
    entry:
