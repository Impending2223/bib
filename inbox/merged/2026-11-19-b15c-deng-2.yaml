      c: 'Deng Xiaoping 邓小平, as acting premier, meets the new Norwegian ambassador, Helge Aakre 黑尔格·阿克雷. On Taiwan: the American ''two Chinas'' aims at long occupation of Taiwan; without a settlement the Chinese cannot settle state relations with the United States; Taiwan is wholly China''s internal affair and the Chinese can settle it themselves; China''s entry into the United Nations is wholly legal; Chiang Kai-shek''s group cannot and has no right to represent the Chinese people; while his representatives stay in the UN the Chinese will not accept entry even if a two-thirds majority votes it.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1798 (Feb. 22, 1964). The words: 下午 (III, 1798). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
