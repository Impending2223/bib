      c: 'Deng Xiaoping 邓小平 meets the delegation of the Khmer People''s Revolutionary Party of Cambodia. After describing the experience of the Chinese revolution he says: each party is to fix its own line and policy independently from its own conditions, with others'' experience for reference, which is the most reliable; on communism: the forefathers did not solve how to do communism; it develops on the basis of socialism; communism is to abolish three differences, between mental and manual labor, town and country, and industry and agriculture, the last two in fact one; the Soviet Union has worked at it for decades without solving it.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1891 (Jan. 10, 1966). The words: 下午 (III, 1891). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
