      c: Deng Xiaoping 邓小平, at Canton, holds talks with Miyamoto Kenji 宫本显治, general secretary of the Japanese Communist Party, who is on a rest in China. On the afternoon of the 17th Deng says Khrushchev 赫鲁晓夫 has Rumania's and Poland's parties mediate between the two parties and proposes 'stopping open dispute', when in truth the dispute has only begun; on the 18th afternoon, that China and Japan are near neighbors and should develop economic and cultural exchange.
