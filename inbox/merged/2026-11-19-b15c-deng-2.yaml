- cite:
    id: cal.1963-08-01.china-leadership-5
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1768 (Aug. 1, 1963; Deng, with Peng Zhen and Yang Shangkun, talks with Kurahara Korehito 藏原惟人, member of the JCP Politburo; on creative development of Marxism–Leninism: first, to seek and study its universal truths; second, to apply them to one''s own conditions, setting one''s own policies, guidelines and line)'
- cite:
    id: cal.1963-08-03.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1768 (Aug. 3, 1963; Deng, with Peng Zhen 彭真 and Yang Shangkun 杨尚昆, talks again with Kurahara Korehito 藏原惟人. Revisionism''s substance: not to make revolution, not to oppose imperialism and the reactionaries of every country, not to support the revolutions for national liberation, fear that a spark may bring a world war, great-power chauvinism, opposition to proletarian internationalism, wrecking the unity of the socialist camp)'
- add:
    entry:
