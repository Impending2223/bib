    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1932 (Oct. 9–28, 1966; Deng attends the Central Work Conference 中央工作会议 Mao presides over; on the 16th Chen Boda''s speech ''The two lines in the great proletarian cultural revolution'' 《无产阶级文化大革命中的两条路线》 concentrates on criticizing the ''bourgeois reactionary line'' and declares that those who put forward the wrong line are its representatives, Liu Shaoqi and Comrade Deng Xiaoping, who bear the chief responsibility)'
