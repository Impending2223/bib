- add:
    entry:
      id: cal.1964-07-03.china-leadership-6
      when: July 3
      date: '1964-07-03'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 reaches Anshan 鞍山 and inspects the Anshan Iron and Steel Company 鞍山钢铁公司. He says it must join carrying out the ''seventy articles on industry'' with the ''Anshan Constitution 鞍钢宪法'' (the nianpu''s note: the principles Mao drew up on Mar. 22, 1960 for managing socialist enterprises: politics in command, Party leadership, mass movement, two participations, one reform and three-in-one combination, technical innovation); an enterprise must in any case have a system and rules; big modern enterprises must also make revolution, learn from the Liberation Army and Daqing, be self-reliant, do technical innovation and revolution; the true revolution is revolution in thought.'
      place: anshan
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1819–1820 (July 3, 1964). The words: 下午 (III, 1819–1820). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
