    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1929 (Aug. 8, 1966; morning, 上午; Deng at the plenary session of the Eleventh Plenum Zhou Enlai presides over, which adopts the Decision of the Central Committee on the great proletarian cultural revolution (the ''Sixteen Points'' 十六条), drafted on Mao''s view; its aim is to overthrow those in power taking the capitalist road, criticize bourgeois reactionary academic ''authorities'' and the ideology of the bourgeoisie and all exploiting classes; its emphasis is to set in order those in the Party in power taking the capitalist road)'
    units: A-B
