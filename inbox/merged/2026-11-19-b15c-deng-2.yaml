- cite:
    id: cal.1966-08-01.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1927 (Aug. 1–12, 1966; Deng attends the Eleventh Plenum of the Eighth Central Committee; on the afternoon of Aug. 1, at the opening Mao presides over, he announces the agenda: (1) adopt the Central Committee''s decision on the proletarian cultural revolution; (2) discuss and approve the Center''s major measures at home and abroad since the Tenth Plenum; (3) complete the formalities for the personnel changes of the May Politburo meeting; (4) adopt the communiqué; Liu Shaoqi reports on the Center''s work since the Tenth Plenum and takes responsibility for the sending of work teams)'
    units: A-C
