- cite:
    id: cal.1963-07-19.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1765 (July 19, 1963; Deng at the eighth meeting; after Kang Sheng speaks he says that the two parties have serious differences, that since the Pravda open letter of July 14 the Soviet press attacks the CCP, that in such conditions agreement on any question, even calm talks, is no longer possible; proposes for the delegation that the talks pause until another agreed time)'
    units: C
- cite:
    id: cal.1963-07-20.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1765 (July 20, 1963; morning, 上午; Deng at the ninth meeting; Suslov accepts Deng''s proposal to stop the talks for now and offers a Soviet draft communique; after a break Deng gives the Chinese comments on it and proposes that each side name two persons to revise it)'
    units: B
- cite:
    id: cal.1963-07-20.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1765–1766 (July 20, 1963; Deng instructs Wu Lengxi, who takes part in the revision: not ''friendly, comradely atmosphere'' but, as the Central Committee''s reply directed, ''each stating its own views''; strike ''the two parties agree to stop open polemic''; say only that the talks pause, to be continued later, time and place to be fixed)'
    units: C-E
- cite:
    id: cal.1963-07-20.soviet-union
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1766 (July 20, 1963; evening, 晚; Deng at the banquet Khrushchev gives for the delegation; to Khrushchev''s saying there are no serious differences, only made-up ones, Deng says he disagrees: only by seeing the nature of the differences can a way be found to overcome them; proposes the next talks be in Peking)'
    units: 'B, D'
