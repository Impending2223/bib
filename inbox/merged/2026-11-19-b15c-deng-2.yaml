      when: Aug. 4
      date: '1963-08-04'
      thread: china-leadership
      c: 'Deng Xiaoping 邓小平 signs the Central Committee''s 中央 instruction replying to the Party committee of the Xinjiang Uighur Autonomous Region 新疆维吾尔自治区 on its "Decision on dealing with persons in secret contact with foreign countries" 《关于处理里通外国分子的决定》: the term may be defined as those who, on a foreign power''s instigation, act against the Chinese Communist Party, the people''s government, the people and the Liberation Army, split the nationalities and the unity of the country, or carry on other secret activities, subversion and sabotage for a foreign country.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1769 (Aug. 4, 1963). The words: 签发 (III, 1769). Made public: 2009 (the nianpu). To check: the Xinjiang Party committee''s draft decision (III, 1769). Names: Deng Xiaoping.'
