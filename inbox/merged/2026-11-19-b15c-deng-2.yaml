- cite:
    id: cal.1964-05-28.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1813–1814 (May 28, 1964; Deng at the meeting Liu Shaoqi presides over of the Politburo Standing Committee, the Secretariat and the regional bureaus'' first secretaries, on the guideline for the Third Five-Year Plan; Deng says that construction needs a long-range plan as well as a five-year one, however rough; that the State Planning Commission has put forward the order agriculture, light industry, heavy industry, food, clothing and goods, and the two ''fists'', basic industry to be balanced by them; that Mao later added the ''backside''; ''two fists and a backside'' is the whole line of construction; planning must weigh the first, second and third lines, the investment of agriculture, defense and culture and education must be cut a little to raise that for basic industry and the third line; Panzhihua is to be built by a ''war of annihilation'', the railway first, an oxygen steelmaking set bought; patents are worth buying but not enough, as with vinylon; equipment must be bought too, up to 60 or 70 percent of a set, the rest made at home)'
- check:
    id: cal.1964-05-28.china-leadership-2
    text: 'Check: whether the meeting Liu Shaoqi presides over in the nianpu ([[w.deng-xiaoping-nianpu-1904]], III, 1813) is the Secretariat''s session of Zhou Enlai''s chronology.'
- cite:
    id: cal.1964-06-02.china-leadership-6
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1814 (June 2, 1964; Deng at the meeting of the Politburo Standing Committee, the Secretariat and the first secretaries of the regional bureaus, on the socialist education movement in town and country; says the countryside''s movement is to be carried through, relying on poor and lower-middle peasants, with regular work, in periods and batches; the cities have the ''five-antis'', the ''four clean-ups'', the classing of classes and the setting in order of the trade unions, street bodies and trade organizations; classes have changed much and a standard for classing is wanted, which the Chinese do not yet have; the cities'' movement is to start in publicly owned enterprises, universities, big hospitals and big shops)'
