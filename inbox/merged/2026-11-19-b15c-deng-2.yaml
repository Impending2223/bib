- cite:
    id: cal.1966-02-04.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1893 (Feb. 4, 1966; Deng reads the draft of the Group of Five for the Cultural Revolution 中央文化革命五人小组 (footnote: set up in July 1964 on Mao''s proposal, of Peng Zhen, Lu Dingyi, Kang Sheng, Zhou Yang and Wu Lengxi), ''Outline Report on the current academic discussion'' 《关于当前学术讨论的汇报提纲》, to go to the Politburo (the ''February Outline'' 二月提纲), that Peng Zhen has passed on and which goes also to Liu Shaoqi, Zhou Enlai, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun 许立群 and Hu Sheng 胡绳; aimed at the ''leftist'' deviation in the academic discussion, the outline says: hold to seeking truth from facts, equality of all before truth, convince by reason, do not be arbitrary and overbearing like a scholar-tyrant)'
