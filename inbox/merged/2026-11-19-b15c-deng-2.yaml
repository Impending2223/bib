- cite:
    id: cal.1966-04-16.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1909 (Apr. 16–25, 1966; Deng at the enlarged Politburo Standing Committee meeting Mao holds at Hangzhou, which concentrates on criticizing Peng Zhen and also discusses revoking the ''February Outline'' and the Group of Five for the Cultural Revolution and setting up a Cultural Revolution Group again; it in the main adopts the draft ''Notice of the Central Committee'' 《中国共产党中央委员会通知》 (draft), several times revised by Mao, and the list of the Central Cultural Revolution Group, for the Politburo''s enlarged meeting about to be held at Peking)'
