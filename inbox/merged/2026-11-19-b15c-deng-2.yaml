- cite:
    id: cal.1968-06-30.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1944 (June 30, 1968; the nianpu: Mao, with members of the Cultural Revolution Group and other central leaders, says mistakes must be allowed; of Deng Xiaoping, my view is still the same; that he colluded with the enemy I do not much believe; you are so afraid of him, which shows he is formidable)'
    units: B
- add:
    entry:
      id: cal.1968-06.china-leadership-4
      when: June
      date: 1968-06
      thread: china-leadership
      also:
      - china
      c: From June the Deng Xiaoping 邓小平 case group, for a year and a half, sends out dozens of investigation teams, over a hundred cities and counties in over ten provinces, municipalities and autonomous regions, to look for proof of Deng's 'turning traitor' and 'present problems'. In its report to Kang Sheng 康生, Huang Yongsheng, Wu Faxian, Ye Qun and Li Zuopeng it says that after repeated checking no major finding of arrest, defection or dealing with the enemy has been made.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1944 (June 1968). The nianpu does not date the report. Made public: 2009 (the nianpu). Names: Deng Xiaoping, Kang Sheng.'
      src:
        c: 12f10758
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1944: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1968-06.china-leadership-5
      when: June
      date: 1968-06
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai 周恩来, reading the case group''s report, notes at its foot on Deng Xiaoping''s 邓小平 joining the Party: Deng joined the Youth League and changed to the Party during the work-study period in France, and he, Li Fuchun and Cai Chang 蔡畅 all knew of it.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1945 (June 1968). The nianpu gives no day. Made public: 2009 (the nianpu). To check: Zhou Enlai, note on the Deng Xiaoping case group''s report (III, 1945). Names: Zhou Enlai, Deng Xiaoping.'
      src:
        c: b0b60859
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1945: all'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1968-07.china-leadership-8
      when: July, late
      date: 1968-07
      thread: china-leadership
      also:
      - china
      at: before 1968-07-21
      c: The Deng Xiaoping 邓小平 case group writes a comprehensive report, "The main crimes of Deng Xiaoping, the other biggest person in power in the Party taking the capitalist road" 党内另一个最大的走资本主义道路的当权派邓小平的主要罪行, of over 15,000 characters in seven parts.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1945 (July 1968). The words: 7月下旬 (III, 1945). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: f88b4500
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1945: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1968-08.china-leadership-4
      when: Aug., end
      date: 1968-08
      thread: china-leadership
      also:
      - china
      at: before 1968-08-21
      c: Deng Pufang, unable to bear the Peking 北京 University 'rebels' abuse, jumps from the building where he is held; the eleventh and twelfth thoracic and first lumbar vertebrae are crushed. Poor treatment leaves him paralyzed from the waist down for life.
      place: peking
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1945 (Aug. 1968). The words: 8月底 (III, 1945). The nianpu gives it as late August. Made public: 2009 (the nianpu).'
      src:
        c: 8e9636a1
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1945: all'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-11.china-leadership
      when: Sept. 11
      date: '1968-09-11'
      thread: china-leadership
      also:
      - china
      c: 'The Deng Xiaoping 邓小平 case group reports to Huang Yongsheng, Wu Faxian, Ye Qun and Li Zuopeng: to clear up the historical problem Deng is to ''add to his account'' of his two returns to Shanghai 上海 from the Seventh Red Army in 1930 and 1931. Deng later writes a second statement on these points.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1945 (Sept. 11, 1968). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 2ecd53e4
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1945: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
- cite:
    id: cal.1968-10.china-leadership-9
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1946 (Oct. 13–31, 1968; the nianpu: the Twelfth Plenum (enlarged) meets with over half of the Eighth Central Committee''s members and alternates, Liu Shaoqi and Deng Xiaoping among them, struck down, persecuted and shut out, and many members not yet ''characterized'' denied attendance; the case group''s report on Deng''s main crimes is printed and issued at the meeting)'
    units: A
- add:
    entry:
      id: cal.1968-10.china-leadership-12
      when: Oct.
      date: 1968-10
      thread: china-leadership
      also:
      - china
      at: after 1968-10-13
      c: At the group meetings of the Twelfth Plenum Lin Biao 林彪, Jiang Qing, Kang Sheng 康生, Xie Fuzhi and others blame Deng Xiaoping 邓小平 hard and demand his expulsion from the Party.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1946 (Oct. 1968). The nianpu gives the plenum''s span, Oct. 13–31, no day. Made public: 2009 (the nianpu). See [[cal.1968-10-13.china-leadership]]. Names: Lin Biao, Kang Sheng, Deng Xiaoping.'
      src:
        c: 3c61c9d3
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1946: all'
      tags:
      - polity:prc
      - name:lin-biao
      - name:kang-sheng
      - name:deng-xiaoping
      - vis:only:prc
- cite:
    id: cal.1968-10-13.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1946 (Oct. 13, 1968; the nianpu: Mao, in his speech at the plenum''s opening session, says of Deng Xiaoping: I always say a word for him, for he fought the enemy in the war against Japan and the war of liberation and no other historical problem has been found)'
    units: A
- cite:
    id: cal.1968-10-31.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1946 (Oct. 31, 1968; the nianpu: Mao, at the closing session, says of Deng Xiaoping that all want to expel him and he has some reservation; this man, he must be told apart from Liu Shaoqi, and in fact there are differences; my thought is perhaps conservative, not to your taste, and I say a few good words for Deng)'
- add:
    entry:
      id: cal.1968-11-04.china-leadership-2
      when: Nov. 4
      date: '1968-11-04'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 writes to Wang Dongxing: his greatest hope is to remain in the Party as an ordinary member and, if possible, to be given a small job or labour within his powers. The letter goes the rounds of Zhou Enlai 周恩来, Chen Boda 陈伯达, Kang Sheng 康生, Jiang Qing and others and comes back to Wang; it is not sent on to Mao or Lin Biao 林彪.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1946 (Nov. 4, 1968). The words: 致信汪东兴 (III, 1946). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Zhou Enlai, Chen Boda, Kang Sheng, Lin Biao.'
      src:
        c: b33585d3
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1946: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:lin-biao
      - vis:only:prc
- cite:
    id: cal.1969-03-12.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1947 (Mar. 12, 1969; the nianpu: Mao, at the meeting of the Cultural Revolution Group''s liaison members on the drafting of the Ninth Congress political report, says: I have never been for lumping Deng Xiaoping together with Liu Shaoqi)'
- cite:
    id: cal.1969-03-22.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1947 (Mar. 22, 1969; the nianpu: Mao, with the Cultural Revolution Group''s liaison members, on preparing the Ninth Congress, says again that the report is to carry only his name and Liu Shaoqi''s, that Deng Xiaoping and Liu must be told apart, that the comrades who erred this time have not erred so much as Wang Ming, and that most are to be treated as contradictions among the people)'
    units: D-E
- cite:
    id: cal.1969-04-01.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1947 (Apr. 1–24, 1969; the nianpu: Lin Biao gives the political report for the Central Committee; many of the Eighth Central Committee''s members, Politburo members and Standing Committee members, Deng Xiaoping among them, and a large body of former chief leaders of the provinces and central organs, are shut out of the Congress)'
- cite:
    id: cal.1969-04-23.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1947 (Apr. 23, 1969; the nianpu: Mao, explaining the preliminary list to the enlarged presidium, says among other things that Deng Xiaoping and Liu Shaoqi must be told apart)'
- cite:
    id: cal.1969-05-03.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1948 (May 3, 1969; Deng writes to Wang Dongxing, asking him to pass the letter to Mao Zedong, Lin Biao and the Central Committee: the Ninth Congress is over and he awaits the Party''s decision; his greatest wish is to stay in the Party and do what work he is given or labour within his powers)'
- cite:
    id: cal.1969-05-05.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1948 (May 5, 1969; Mao reads the letter and passes it to Lin Biao, Zhou Enlai and the Politburo members in Peking to read)'
    units: A-B
