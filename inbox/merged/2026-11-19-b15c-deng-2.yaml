      c: 'Deng Xiaoping 邓小平, at the Jinqiao hotel in Guiyang 贵阳, hears the head of the Seventh Ministry of Machine Building''s Second Academy on the building of the ministry''s north-Guizhou base. Told that over twenty million bricks are still lacking for the first half of next year, he says the masses can be organized to quarry stone, which also adds arable land and peasants'' income, the hills being many and ''the foolish old man'' to move them; on power: Guizhou has coal and thermal power is quick, to be planned and used together; supplies of materials, grain and consumer goods are to be planned; Shanghai 上海 must help the Northwest and Southwest with talent, technique and materials.'
      place: guiyang
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1882 (Nov. 22, 1965). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
