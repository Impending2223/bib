- cite:
    id: cal.1964-06-16.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1816 (June 16, 1964; 下午; Deng attends the meeting Mao Zedong 毛泽东 calls of the Politburo 政治局 Standing Committee 政治局常委会 and the regional bureaus'' first secretaries, at which Mao speaks on the question of successors)'
- cite:
    id: cal.1964-06-17.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1816 (June 17, 1964; afternoon, 下午; Deng presides at the Secretariat on the questions the Central Work Conference is to settle: the socialist education movement to take four or five years in town and country, thoroughly; a full-time cadre for Youth League work and one for women''s work in each commune; the League has only 24 million members, over 7 million past the age, fewer than the Party; on grain, the principle of fixed compulsory purchase and assigned purchase in full and negotiated purchase according to means; crop adjustment and the adjustment of peasants'' income will take years, one of the main contents of the Third Plan; Tan Zhenlin to preside over revising the Latter Ten Points and the regulations on poor and lower-middle peasants'' associations as drafts to go down, Peng Zhen to preside over drafting an instruction on socialist education in the cities)'
- cite:
    id: cal.1964-06-19.china-leadership-6
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1816–1817 (June 19, 1964; afternoon, 下午; Deng gives the political report at the Youth League''s Ninth Congress. On the international situation: generally very good; in the imperialist camp the struggle against American control grows; Khrushchev''s great-power chauvinism makes for exploitation of the East European states; in Asia, Africa and Latin America revolutionary struggle develops; two great struggles, against imperialism and the reactionaries and against modern revisionism. At home: the adjustment basically finished; learn from the Liberation Army, Daqing and Dazhai in spirit, not in form; for the Third Plan basic industry, first, second and third lines, an industrial layout with regard to the rear; the three great revolutions, to produce productive forces and a China without revisionism; imperialism pins its hope on the third and fourth generations)'
    units: B
