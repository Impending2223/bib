      thread: china-leadership
      c: 'Deng Xiaoping 邓小平 reads a paper on the intellectuals'' problems, noting the fate of the bridge expert Mao Yisheng 茅以升 and his nephew Mao Yugong 茅于功 and the downcast mood of some intellectuals in recent years. Comment to Bo Yibo 薄一波: have someone look into Mao Yugong''s case; if he has real ability he is to be well used.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1799 (Feb. 23, 1964). The words: 阅 (III, 1799). Deng: 如真有本领，要好好用 (III, 1799). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Bo Yibo.'
