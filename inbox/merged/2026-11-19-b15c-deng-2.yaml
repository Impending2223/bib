      c: 'Deng Xiaoping 邓小平, with Liu Shaoqi 刘少奇, attends the reception the Cuban embassy 古巴驻中国使馆 gives for the fifth anniversary of Cuba''s liberation, and speaks: both countries face the task of defending their sovereignty and territorial integrity; the Chinese people will stand firm with the Cuban people and the peoples of the socialist camp, and with all who hold to revolution and love peace, to fight to the end against imperialism for world peace, national liberation, people''s democracy and socialism.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1786 (Jan. 2, 1964). Names: Deng Xiaoping, Liu Shaoqi.'
