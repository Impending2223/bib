      date: '1964-02-16'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, at Canton 广州, holds two talks, on the 16th and 17th, with the former prime minister of Thailand, Nai Pridi 乃比里. On the 17th morning, on the home situation: when farm output rises, workers'' wages are raised, when industry''s rises, peasants'' incomes; thus each helps the other and living standards improve step by step; the general line is agriculture as base and industry as leading factor; the human factor is chief; the ''compare, learn, catch up, help'' campaign: first compare, to see why others are ahead; the Chinese steel is poorer in quality and must catch up; Khrushchev''s 赫鲁晓夫 withdrawal of Soviet experts and scrapping of hundreds of agreements has driven the Chinese to self-reliance, to do better, more and more soundly.'
      place: canton
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1797–1798 (Feb. 16–17, 1964). The time given is the morning of the 17th for the second talk; the first day''s has none. Made public: 2009 (the nianpu). Names: Deng Xiaoping, Khrushchev. Check: the Latin form of the name (the nianpu: 乃比里, former prime minister of Thailand).'
