      c: 'Deng Xiaoping 邓小平 meets and gives a dinner for Williams 威廉斯, chairman of the New Zealand Communist Party, on a visit. Deng: the Chinese now mean to name Khrushchev 赫鲁晓夫 formally as a revisionist, and have a duty to make that clear.'
