      c: 'Deng Xiaoping 邓小平 meets the new Albanian Ambassador, Nesti Nase 奈斯蒂·纳赛. Deng: with agriculture steady, industry is steady; for ten to fifteen years the Chinese will concentrate on agriculture; food, clothing and goods come chiefly from it, clothing in time from industry; they will make synthetic fibers and buy some technology in Europe; when food and clothing are settled, self-reliance is settled. On the Sino-Soviet dispute: from July 14 to early November the Soviet press printed over 2,100 articles attacking China; the Chinese print fewer, each heavier.'
