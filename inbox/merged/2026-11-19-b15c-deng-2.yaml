- add:
    entry:
      id: cal.1964-09-28.china-leadership-6
      when: Sept. 28
      date: '1964-09-28'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - indonesia
      c: 'Deng Xiaoping 邓小平 meets the delegation of the Indonesian *Harian Rakjat* (the nianpu''s 印度尼西亚《人民日报》) and the delegation of the Vietnamese journal *Học Tập* 《学习》. Deng: the Chinese made the error of dogmatism, setting targets too high; they took too much grain from the peasants and hurt their vitality; rushing industrialization hurt the base; facts reminded them and they made three years of adjustment; in agriculture they will do solid work; learn from Daqing in industry, Dazhai in agriculture and from the Liberation Army, which is to learn political thought first; Dazhai and Daqing are marked by the close tie of cadres with the masses, their labor, and revolutionary drive and scientific spirit; revolution is revolution against nature and technique, and in the political and ideological field against capitalism and feudalism; cadres'' labor is a standard of socialism, it changes thought and keeps them from laziness and from corruption and waste; part of the education system is copied from capitalism and part from the Soviet Union, half-work half-study schools are to be developed, workers and peasants to study culture, to narrow the gap between mental and manual labor.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1828–1829 (Sept. 28, 1964). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 21cf96af
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1828–1829: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc+drv+indonesia
- add:
