      c: Deng Xiaoping 邓小平 presides at a meeting with the first secretaries of the regional bureaus, conveying the spirit of the Politburo 政治局 Standing Committee's 政治局常委会 meeting of the 26th, and discussing the 1964 plan. He says the discussion of industrial development agrees with the Chairman's thinking; the 1964 figures of 38.5 billion in revenue and 10.7 billion in investment are to be fixed; small irrigation works still rest on mass effort; with every set of equipment imported from abroad enough experts must go along, from fixing the plan and negotiating to installing, trial run and production.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1771 (Aug. 27, 1963). The words: 下午 (III, 1771). Deng: 一九六四年度财政的三百八十五亿收入和一百零七亿的投资 (III, 1771). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
