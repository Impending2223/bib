- cite:
    id: cal.1966-06-30.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1921–1922 (June 30, 1966; Deng drafts, and with Liu Shaoqi sends to Mao, a letter: the cultural revolution in culture and education is just unfolding and the Center and province and city leaders must give great strength to it; if grass-roots units of mines, plants and capital construction all move at once the leadership cannot cope and errors come easily; recently the plans for industry, communications and capital construction have been poorly met, steel, steel products and coal beginning to fall, quality falling most, accidents rising, the capital-construction task meant for 40 to 45 percent in the first half reaching only 35 or 36; so the comrades in Peking, after discussion, hold that the cultural revolution''s emphasis be put in the cultural and educational departments and Party and government organs, while industry, communications, construction, commerce and hospitals go on by the ''four clean-ups'' plan and the Twenty-three Articles together with the cultural revolution (Shanghai''s 400,000 workers'' enterprises in the ''four clean-ups'' are to run it with the cultural revolution as center, which has been agreed, to see how it goes); with a draft Central Committee and State Council notice on how industrial, communications and capital-construction units are to carry on the cultural revolution)'
    units: B
- cite:
    id: cal.1966-07-02.china-leadership
