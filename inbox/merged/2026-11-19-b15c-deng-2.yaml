      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1933 (Oct. 24, 1966). Made public: 2009 (the nianpu). See [[cal.1966-10-23.china-leadership]]. Names: Liu Shaoqi, Deng Xiaoping, Chen Boda, Kang Sheng, Xie Fuzhi.'
