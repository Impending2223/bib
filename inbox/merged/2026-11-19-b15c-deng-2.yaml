    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1806 (Apr. 3, 1964; Deng, with Zhou Enlai 周恩来, Peng Zhen 彭真 and others, at Liu Shaoqi''s 刘少奇 meeting on Sino-Soviet relations; says the CPSU, which once asked to stop open polemic, has now published three documents showing it means to press China harder and to show world opinion that it wanted to stop and China did not; Khrushchev 赫鲁晓夫 is preparing opinion for a splitting conference)'
