    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1933 (Oct. 22, 1966; noon, 中午; Deng with Zhou Enlai, Tao Zhu and Li Fuchun talks over the manner of making the self-criticism at the Central Work Conference the next day)'
