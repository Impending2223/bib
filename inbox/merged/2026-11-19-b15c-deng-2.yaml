      c: 'Deng Xiaoping 邓小平 goes with Tao Zhu 陶铸 and others to Renmin University 中国人民大学 to read the big-character posters. At the meeting of the whole university answering students'' questions he clears up Kang Sheng''s 康生 charge of July 27 at Peking 北京 Normal University that Peng Zhen 彭真 and He Long 贺龙 plotted a ''February mutiny'' 二月兵变 (footnote 1: in spring 1966 the Peking Military Region sent a regiment from outside to the Peking Garrison for militia training and local order, and the Garrison sent people to borrow quarters at Peking and Renmin universities; in early July a big-character poster at Peking University suspected a ''mutiny''; Kang Sheng that summer charged He Long and Peng Zhen at mass meetings and the Cultural Revolution Group with ''secretly moving troops for a February mutiny''); he says there was no such thing.'
