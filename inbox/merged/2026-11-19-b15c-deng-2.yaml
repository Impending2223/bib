- cite:
    id: cal.1965-08-09.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1871 (Aug. 9, 1965; afternoon, 下午; Deng presides at the Secretariat, which hears Hu Keshi 胡克实 and Ma Chungu 马纯古 on the work of the Youth League and the trade unions; Deng says the age structure of Party organizations and leaders is a problem and the young must be put in leading posts, the League cadres first renewed, those under county level not over thirty; League members in villages may reach 25 percent, in cities 30; on study that it is to be made interesting, the ''four articles'' (the nianpu''s note: *In Memory of Norman Bethune*, *Serve the People*, *The Foolish Old Man Who Removed the Mountains*, *Combat Liberalism*) learned for two or three years and again, what use now?; study Mao''s philosophical works, the *Communist Manifesto* and other classics more widely; study is to be voluntary; the League is to work with the backward and with children of landlords and rich peasants, by the policy of conduct first)'
    units: B
- cite:
    id: cal.1965-08-11.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1872 (Aug. 11, 1965; 下午; Deng, with Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and others, hears Chen Zhengren 陈正人, Minister of the Eighth Ministry of Machine Building, on the national conference on the management of farm machinery. Deng: farm machines must be used together, not here and there; in the North China plain and several deltas a number of counties can be fixed, and over some years the types gradually unified and made into matched sets; quality first in making them; the peasants who use them must gain, to the point where the state need bear no more)'
