      - vietnam-hanoi
      c: 'Deng Xiaoping 邓小平, in the talks at Hanoi 河内, on the border question raised again in the CPSU''s letter of Nov. 29, 1963: two kinds of border questions are to be told apart; those where imperialism has invaded and seized, from which it must withdraw; and the disputes between independent states left by imperialist invasion, to be settled by consultation; though the unequal treaties were forced on China by old Russia, China is willing to negotiate with the Soviet side on the basis of respect for them; if the Soviet side takes a reasonable attitude the Sino-Soviet border can become a border of lasting friendship.'
      place: hanoi
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1801 (Feb. 27, 1964). The words: 上午 (III, 1801). Made public: 2009 (the nianpu). See [[cal.1964-02.china-leadership-3]]. Names: Deng Xiaoping.'
