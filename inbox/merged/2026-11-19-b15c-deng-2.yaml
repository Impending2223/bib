    entry:
      id: cal.1966-03-30.china-leadership-5
      when: Mar. 30
      date: '1966-03-30'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 inspects the Qinghai nuclear-weapons development base on the Jinyintan grassland, seeing its model hall, experimental department, production department and shops. Seeing few trees he asks for more planting and more family production; he says several times that many crack people are gathered here, that people must first be protected, and equipment too; told of over 3,000 technical cadres he says: not a few, intellectuals in heaps, for this work cannot be done without them. He inscribes for the base: "Hold high the great red banner of Mao Zedong 毛泽东 Thought, advance with courage in the direction the Chairman has pointed: what others have done we shall do; what others have not done we shall also do."'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1904 (Mar. 30, 1966). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Mao Zedong.'
      src:
