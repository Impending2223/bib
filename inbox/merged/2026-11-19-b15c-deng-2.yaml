- add:
    entry:
      id: cal.1967-09-18.china-leadership-4
      when: Sept. 18
      date: '1967-09-18'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 writes to Wang Dongxing 汪东兴: "The order the Capital ''Seize Deng'' Liaison Station has given me I received last night. Several orders of the same kind have come before and more will come. About these orders to account by a time limit I do not know how to deal with them, and I ought to report and ask the Chairman and the Center. I enclose the original; please send it to the Chairman and the Center for report and instruction." He asks again to see Mao. Wang forwards it, and Mao comments: Lin, Zhou and the comrades of the Cultural Revolution Group to read, return to Wang to keep.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1939 (Sept. 18, 1967). The words: 致信汪东兴 (III, 1939). Made public: 2009 (the nianpu). See [[cal.1967-09-19.china-leadership-2]]. Names: Deng Xiaoping.'
      src:
        c: 3411a5ea
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1939: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
- cite:
    id: cal.1967-09-19.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1939 (Sept. 19, 1967; evening, 晚; at Wuchang Mao tells Yang Chengwu, Zhang Chunqiao, Wang Dongxing and Yu Lijin 余立金 (footnote: then political commissar of the Air Force) of the convening of the Ninth Congress and says of choosing Central Committee members: of Liu Shaoqi and Deng Xiaoping there should be a difference; Deng fought)'
    units: F
- cite:
    id: cal.1967-09-16.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1939 (Sept. 16, 1967; Mao Zedong 毛泽东, on his train stopped at Hangzhou 杭州, in talk with Nan Ping 南萍 and Chen Liyun 陈励耘 (footnote 1: Nan, political commissar of the 20th Army and head of Zhejiang''s military control committee; Chen, political commissar of the Air Force''s 5th Army and deputy head), mentions that Deng Xiaoping 邓小平 and Liu Shaoqi 刘少奇 still differ)'
- cite:
    id: cal.1967-09-20.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1940 (Sept. 20, 1967; evening, 晚; at Wuchang Mao tells Zeng Siyu, Liu Feng, Fang Ming and Zhang Chunqing of the choosing of Central Committee members at the Ninth Congress: Deng Xiaoping may be protected, for three reasons, he fought battles, he is not a Kuomintang man, he has no ''black cultivation'' (footnote 2: Liu Shaoqi''s *On the Self-Cultivation of a Communist*); can he be elected to the Central Committee, discuss it; he is a ''model soldier'')'
- cite:
    id: cal.1967-09-24.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1940 (Sept. 24, 1967; Mao calls Zhou Enlai and others to a meeting; on the Ninth Congress, while confirming Lin Biao as successor, says Liu Shaoqi and Deng Xiaoping must be told apart)'
    units: A-B
- add:
    entry:
      id: cal.1967-09.china-leadership-6
      when: Sept.
      date: 1967-09
      thread: china-leadership
      also:
      - china
      c: 'The Zhongnanhai ''rebels'' and the Central Committee''s 中央 General Office send people to Deng Xiaoping''s 邓小平 home with an announcement: Deng''s children are to return to school at once, his stepmother Xia Bogen 夏伯根 to her old home at once; only the cook and the orderly stay. After the children protest, the children and the stepmother are put in two rooms in Fanghu Lane 方壶斋胡同 outside Xuanwumen. Deng and Zhuo Lin are cut off from the outside entirely.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1940 (Sept. 1967). The nianpu gives the month only, after its Sept. 24 item. Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 007f761a
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1940: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
- cite:
    id: cal.1967-10-09.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1940 (Oct. 9, 1967; Mao, reading the draft publisher''s note to the selected *Remarks of Liu Shaoqi*, changes ''in league with the other biggest person in power in the Party taking the capitalist road, Deng Xiaoping'' to ''in league with some other persons in power taking the capitalist road'' and strikes out a second place where Deng''s name stands beside Liu''s; his note: ''Lin Biao and Enlai to read, then back to Chen Boda to handle. The note is not to mention Deng Xiaoping. Is that fitting? Decide as suits. Which body is to publish, settle at a meeting.''; the book appears internally under the name of the People''s Publishing House''s reference room, with no mention of Deng)'
    units: B
- add:
    entry:
      id: cal.1967-11-03.china-leadership-3
      when: Nov. 3
      date: '1967-11-03'
      thread: china-leadership
      also:
      - china
      c: Deng Xiaoping 邓小平 writes to Wang Dongxing, enclosing a statement on Qian Xinzhong 钱信忠, in answer to the demand of three 'rebel' organizations of the Ministry of Health that he say how he 'shielded, used and promoted' Qian. He cannot recall many things; he gives his view of Qian as a minister (small faults many, great ones few, wartime merit) and says that Zhou Enlai 周恩来 raised Qian's appointment as minister for discussion and that he agreed, and that he and An Ziwen 安子文 had no plot over it.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1941 (Nov. 3, 1967). The words: 致信汪东兴 (III, 1941). Made public: 2009 (the nianpu). To check: Deng Xiaoping, statement on Qian Xinzhong, Nov. 3, 1967 (III, 1941). Names: Deng Xiaoping, Zhou Enlai.'
      src:
        c: ee81428b
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1941: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:zhou-enlai
      - vis:only:prc
- cite:
    id: cal.1967-11-05.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1941 (Nov. 5, 1967; the nianpu: Mao, in talk with the members of the Cultural Revolution Group''s liaison meeting on the Ninth Congress and rectification, says Deng Xiaoping is to be criticized; my view is still to tell him apart from Liu Shaoqi; how to pull Liu and Deng apart)'
    units: A
- add:
    entry:
      id: cal.1967-11-23.china-leadership-2
      when: Nov. 23
      date: '1967-11-23'
      thread: china-leadership
      also:
      - china
      c: The *Renmin ribao* 人民日报, *Hongqi* 红旗 and *Jiefangjun bao* publish a joint editorial, "The struggle between the two roads in China's countryside" 中国农村两条道路的斗争. It calls 'the other biggest person in power in the Party taking the capitalist road' without naming him, and is taken as aimed at Deng Xiaoping 邓小平. From the next day the *Renmin ribao* and other papers print signed articles that criticize Deng's utterances without naming him.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1941 (Nov. 23, 1967). The nianpu gives the editorial''s first words of the title as printed; the naming is the nianpu''s account of its aim. To check: "The struggle between the two roads in China''s countryside," *Renmin ribao*, Nov. 23, 1967 (III, 1941–42). Names: Deng Xiaoping.'
      src:
        c: e6f2ed8a
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1941: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
- add:
    entry:
      id: cal.1967-12-28.china-leadership-2
      when: Dec. 28
      date: '1967-12-28'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 writes to Wang Dongxing in answer to questions on Wei Wenbo 魏文伯''s transfers and posts (footnote 1: before the Cultural Revolution a vice-chairman of the East China Military and Administrative Committee''s political and legal committee, deputy minister of justice, deputy secretary of the Shanghai 上海 Party committee and secretary of the East China Bureau): he knows little of Wei, does not know his historical problem, and did not propose Wei''s transfers; the archives will show how they went. Wang passes the letter to Zhou Enlai 周恩来 to read and file.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1942 (Dec. 28, 1967). The words: 致信汪东兴 (III, 1942). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Zhou Enlai.'
      src:
        c: 9e095a71
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1942: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-04-07.china-leadership-2
      when: Apr. 7
      date: '1968-04-07'
      thread: china-leadership
      also:
      - china
      c: On the prompting of Nie Yuanzi 聂元梓 the Peking 北京 University 'rebel' body, the "New Peita Commune" 新北大公社, makes a case of a 'counter-revolutionary clique' on the campus and sets up a case group. In its name it takes Deng Xiaoping's 邓小平 eldest son Deng Pufang 邓朴方 and second daughter Deng Nan 邓楠, students at the university, from Fanghu Lane to the university and orders them to account for the 'problems' of their parents Deng Xiaoping and Zhuo Lin.
      place: peking
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1943 (Apr. 7, 1968). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 0d8ea2f8
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1943: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
