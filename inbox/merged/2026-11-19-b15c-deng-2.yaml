    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1932–1933 (Oct. 22, 1966; Mao''s reply: ''Comrade Xiaoping: you may speak as it stands; but after the first line on page nine, ''turn over a new leaf'', add a few positive words, for instance that with one''s own effort and the comrades'' help one believes the errors will be corrected: ''let me have time, I shall stand up; after half a lifetime of revolution, having fallen, am I to be unable to rise?''; also the word ''preliminary'' can be struck from the title'')'
    units: B-C
