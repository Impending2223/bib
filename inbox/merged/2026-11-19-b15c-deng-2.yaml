      c: 'Deng Xiaoping 邓小平, at the meeting of the regional bureaus'' first secretaries, on relations between the Center and the localities and other questions: the Soviet frame is to be broken, costs cut, labor productivity raised, enterprises made small and fine; Chinese shipbuilding has as many workers as the foreigners'', who build 2.1 million tons a year against the Chinese 300,000, because they specialize and standardize.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1827 (Sept. 1, 1964). Made public: 2009 (the nianpu). See [[cal.1964-08-29.china-leadership]]. Names: Deng Xiaoping.'
