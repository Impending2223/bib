      date: '1963-01-18'
      thread: china-leadership
      c: 'Deng Xiaoping 邓小平 reads the draft Central Committee 中央 instruction on increasing production and thrift and against graft and theft, speculation, waste, departmentalism and bureaucratism, drafted under Peng Zhen''s 彭真 direction. Comment: broadly acceptable; the paper is to go to the work conference; it may first go to the provinces and cities for their views.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1743 (Jan. 18, 1963). Deng: 这个文件须提到工作会议 (III, 1743). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Peng Zhen.'
