      when: Jan. 9
      date: '1963-01-09'
      thread: china-leadership
      c: 'Deng Xiaoping 邓小平 reads the record of Zhou Enlai''s 周恩来 call of the 8th from Hangzhou 杭州 and sends it to Liu Shaoqi 刘少奇 and Peng Zhen 彭真. Comment: the third item, Yang Shangkun 杨尚昆 to notify and to tell the Chairman and the Premier.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1741–1742 (Jan. 9, 1963). The words: 阅八日周恩来从杭州打来电话的记录稿 (III, 1741–1742). Made public: 2009 (the nianpu). See [[cal.1963-01-08.china-leadership]]. Names: Deng Xiaoping, Zhou Enlai, Liu Shaoqi, Peng Zhen.'
      src:
