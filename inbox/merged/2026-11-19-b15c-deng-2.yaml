- add:
    entry:
      id: cal.1964-08-31.china-leadership-2
      when: Aug. 31
      date: '1964-08-31'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, at the meeting of the regional bureaus'' first secretaries, says the socialist education movement and the urban ''five-antis'' must concentrate forces for a battle of annihilation: there must be work teams and the masses must be roused; through the movement those who hold, or fairly hold, to Marxism–Leninism are to become the leading core at every level; basic cadres in town or country are chiefly to be educated, shown right from wrong, their errors corrected, and used again; cadres'' taking part in labor must become a basic system, a system for a hundred years.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1826–1827 (Aug. 31, 1964). Made public: 2009 (the nianpu). See [[cal.1964-08-29.china-leadership]]. Names: Deng Xiaoping.'
      src:
        c: b28dc8a5
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1826–1827: all'
      tags:
