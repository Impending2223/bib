      thread: china-leadership
      c: 'Deng Xiaoping 邓小平 asks Mao Zedong 毛泽东 and Liu Shaoqi 刘少奇 in writing about the agenda of the Central Work Conference 中央工作会议: he proposes to open the first session at 9 a.m. tomorrow, with Li Fuchun and Tan Zhenlin 谭震林 to explain, so that the groups can begin discussing (agriculture and the villages first); if they cannot come, he asks that Zhou Enlai 周恩来 preside. Mao: "do as proposed" (照办), the same day.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1812 (May 17, 1964). The words: 书面请示 (III, 1812). Made public: 2009 (the nianpu). See [[cal.1964-05-15.china-leadership]]. Names: Deng Xiaoping, Mao Zedong, Liu Shaoqi, Tan Zhenlin, Zhou Enlai.'
