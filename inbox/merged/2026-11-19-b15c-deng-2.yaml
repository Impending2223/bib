- cite:
    id: cal.1963-01-19.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1743–1744 (Jan. 19, 1963; afternoon, 下午; Deng presides at the Secretariat; decides that Wu Lengxi is to compile the French Unified Socialist Party''s attacks on the CCP into a page for the Renmin ribao, that Liu Ningyi goes to the Afro-Asian Solidarity Council, and the main agenda of the Central Work Conference; Deng explains the conference''s topics and on free markets says Peking is not to open them, to cut their scope, manage them, and replace them by state commerce and supply and marketing cooperatives (自由市场，北京不准开))'
    units: B
