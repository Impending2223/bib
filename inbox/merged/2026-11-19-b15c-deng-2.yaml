    entry:
      id: cal.1964-09-11.china-leadership-3
      when: Sept. 11
      date: '1964-09-11'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 meets Kim Il Sung at Shenyang 沈阳. On China''s home questions: in the Third Five-Year Plan capital construction will exceed the First''s, but the layout of production must be more rational and technical revolution weighed; some plants the Soviet Union helped to build are all-purpose and need many people at high cost, as in the motor and tractor industries; specialization and cooperation would save much manpower and material; in July at the Dalian shipyard he raised the matter of revolution, and they reckoned some thirty items could be specialized and made cooperative; how to rebuild existing plants is a great question; advanced technology is to be brought in from the developed countries.'
      place: shenyang
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1827–1828 (Sept. 11, 1964). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
