      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1767 (July 27, 1963). The words: 批阅同意 (III, 1767). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Kang Sheng, Mao Zedong.'
