- cite:
    id: cal.1965-04-12.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1855–1856 (Apr. 12, 1965; afternoon, 下午; Deng at the enlarged Politburo meeting, on the situation in Vietnam and war preparation at home; the meeting in the main adopts the Central Committee''s ''Directive on strengthening war preparation'' 《关于加强备战工作的指示》, issued on the 14th; Deng says Mao criticized the third-front construction as taken up late, the Secretariat included in the error, but it is not too late; not only the great third front but the small third front, chiefly arsenals, so that each region from the Northeast to South China could fight on its own, ''you fight yours, I fight mine; fight if you can win, leave if not, and fight again''; on Vietnam, the war depends neither on American imperialism''s will nor on that of Vietnam and China; the war may widen, first in the South, then the North and the Chinese border areas near Vietnam, or the Americans may fight the Chinese in a larger local war, even to Korea; every possible help is to be given to Vietnam)'
