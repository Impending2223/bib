      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 writes to Mao Zedong 毛泽东: having read these days Qi Benyu''s 戚本禹 article (footnote 1: "Patriotism or national betrayal? On the reactionary film *Secret History of the Qing Court*", printed Apr. 1 in the *Renmin ribao* 人民日报 and *Hongqi* 红旗, which calls Liu Shaoqi 刘少奇 ''the biggest person in power in the Party taking the capitalist road'' and Deng ''the other biggest'' and ''the second biggest''), he feels the nature of his errors seems settled, and is eager to see the Chairman.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1937 (Apr. 3, 1967). The words: 致信毛泽东 (III, 1937). Made public: 2009 (the nianpu). To check: Qi Benyu, ''Patriotism or national betrayal?'', *Renmin ribao* and *Hongqi*, Apr. 1, 1967 (III, 1937 n.1). Names: Deng Xiaoping, Mao Zedong, Liu Shaoqi.'
      src:
