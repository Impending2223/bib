    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1935 (Dec. 18, 1966; afternoon, 下午; Zhang Chunqiao alone summons Kuai Dafu 蒯大富, head of Tsinghua University''s rebels, at the west gate of Zhongnanhai and urges the criticism of ''the one or two'' who put forward the bourgeois reactionary line)'
    units: A
- cite:
    id: cal.1966-12-25.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1935 (Dec. 25, 1966; morning, 上午; Kuai Dafu leads over five thousand on to the streets with speeches, leaflets, big-character posters and slogans, carrying ''Down with Liu Shaoqi'' and ''Down with Deng Xiaoping'' into society)'
    units: A-B
- cite:
    id: cal.1967-01-11.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1936 (Jan. 11, 1967; the Politburo meeting decides to cancel the right of Liu Shaoqi, Deng Xiaoping, Tao Zhu, Chen Yun and He Long to attend Politburo meetings; after that Deng is sometimes notified to read in Zhongnanhai the big-character posters put up by the ''rebels'')'
- cite:
    id: cal.1967-01-17.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1936 (Jan. 17, 1967; Mao, in talk with foreign guests: will Liu and Deng be elected to the Central Committee at the next Party Congress? My view is still that they should be)'
    units: B
- cite:
    id: cal.1967-01-17.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1936 (Jan. 17, 1967; Zhou Enlai 周恩来, receiving the rebel delegates of the State Science Commission, says: Liu Shaoqi 刘少奇 and Deng Xiaoping 邓小平 are members of the Politburo 政治局 Standing Committee 政治局常委会 and the press has not named them; do not drag them to your meetings, otherwise we shall not attend)'
- cite:
    id: cal.1967-02-11.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1936 (Feb. 11 and 16, 1967; the nianpu: Tan Zhenlin, Chen Yi, Ye Jianying, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen and others speak in turn at the Center''s head-bumping meetings, criticizing sharply the many wrong ways of the Central Cultural Revolution Group; before that several leaders of the Military Commission quarrelled sharply on the army''s stability with Jiang Qing, Chen Boda and Kang Sheng at the enlarged Commission meeting of Jan. 19; their resistance is slandered as the ''February countercurrent'' and suppressed; after it the Cultural Revolution Group in the main takes over the Politburo''s function, and the Center''s head-bumping meeting that Zhou Enlai had presided over is replaced by the Group''s)'
    units: B
- add:
