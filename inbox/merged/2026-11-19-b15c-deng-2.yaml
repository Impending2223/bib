- cite:
    id: cal.1964-11-08.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1836 (Nov. 8, 1964; evening, 晚上; Deng with Mao, Liu Shaoqi and Peng Zhen meets Kim Il Sung, exchanging views on why Khrushchev fell, who is chief among the new Soviet leaders and their coming policy; the second talk on the 16th)'
- cite:
    id: cal.1964-11-10.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1836 (Nov. 10, 1964; evening, 晚; Deng at the Politburo Standing Committee meeting Mao presides over; Deng says that, from the delegation''s contacts in Moscow so far, the new leaders show no friendly sign and no turn for the better; probably they do not oppose Khrushchev''s line but only his arbitrariness and personal rule, and his mishandling of agriculture; they probably do not oppose his foreign policy of seeking peace with imperialism and great-power chauvinism toward socialist states, in which they took active part)'
- add:
