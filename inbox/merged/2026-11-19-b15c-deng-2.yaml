    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1786–1787 (Jan. 3, 1964; afternoon, 下午; Deng with Liu Shaoqi presides at the forum of the Central Propaganda Department and people of the literary and art circles, conveys Mao''s comment of Dec. 12, 1963 on literature and art, and hears Zhou Yang 周扬 on the state of the circles; Deng says the literary front is to take up three things: understanding (a right estimate of the situation, a clear direction), a plan with active promotion of modern plays, and a stronger body of writers. Footnote 1 quotes Mao''s comment)'
