      - china
      c: 'Deng Xiaoping 邓小平, as acting premier, meets the Cambodian military delegation under Lon Nol 朗诺, Deputy Prime Minister, Defense Minister and chief of staff of the Royal Armed Forces. Deng: the imperialists say a stronger China will threaten the world, its neighbors first, but the Chinese have their own work to finish; of China''s 9.6 million square kilometers most is thinly peopled, backward, ill served by roads; its industrial technology is backward; its clothes are poor, and food, clothing and goods will take great effort; to throw off economic and technical backwardness will take about fifty years.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1804 (Mar. 14, 1964). The words: 下午 (III, 1804). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Lon Nol.'
