      date: '1966-03-22'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, at Lanzhou 兰州, hears Yang Jingren 杨静仁, first secretary of the Ningxia Hui Autonomous Region Party committee, on Ningxia. Deng: in this movement the work teams must hold to democratic centralism and set an example of it, or after they leave the countryside is as before; all members should study Mao''s speech at the Seven Thousand Cadres Conference, whose center is democratic centralism; coal miners should be on rotating contracts, changed after seven or eight years, father going home and son coming, miners kept young and strong, for mining has occupational diseases; on half-work half-study schools: the road of spare-time education is affirmed but to be taken step by step, ''crossing the river by feeling the stones''.'
      place: lanzhou
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1902 (Mar. 22, 1966). The words: 下午 (III, 1902). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
