      c: 'Deng Xiaoping 邓小平, as acting premier, meets the wife of Souphanouvong 苏发努冯, chairman of the Lao Patriotic Front and Deputy Prime Minister of the Laotian government of national union. Deng: American ambitions are great, to dominate the world and control Asia, Africa and Latin America and all its allies; France, Japan and West Germany each want to resist America and can be indirect allies of the national democratic revolutions there; it is America that is most isolated; the atom bomb is no sure thing, a bluff; one day the Chinese too will have it.'
