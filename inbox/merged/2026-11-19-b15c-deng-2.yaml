- add:
    entry:
      id: cal.1968-05-16.china-leadership-4
      when: May 16
      date: '1968-05-16'
      thread: china-leadership
      also:
      - china
      c: The Deng Xiaoping 邓小平 case group meets at the Great Hall of the People; Kang Sheng 康生, in charge of case work, Huang Yongsheng 黄永胜 and Wu Faxian 吴法宪 attend. Kang says Deng's problem cannot be dealt with by direct interrogation, but attention must go to searching, inside and out, for evidence; Deng's historical problem has never been cleared up.
      place: peking
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1943 (May 16, 1968). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Kang Sheng.'
      src:
        c: c97b732f
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1943: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05.china-leadership-6
      when: May
      date: 1968-05
      thread: china-leadership
      also:
      - china
      at: after 1968-05-16
      c: The Deng Xiaoping 邓小平 case group reports that the existing material is not enough to fix a 'crime' and the Center does not allow direct interrogation of Deng, and proposes that Deng write an autobiography, from the age of eight, sent in as written and finished by early July at the latest. Huang Yongsheng approves the report; Wang Dongxing passes it to Deng.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1943 (May 1968). The nianpu gives no day for the report. Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: a7425749
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1943: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
