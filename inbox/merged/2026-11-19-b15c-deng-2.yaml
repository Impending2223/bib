    entry:
      id: cal.1966-03-20.china-leadership-3
      when: Mar. 20
      date: '1966-03-20'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 hears Wang Feng 汪锋 on the work of Gansu. On local arsenals: their products must not be dear, costs to be cut by low wages and the like; some civilian products must be made or they will be a heavy burden. On small local plants: care for quality from the start, no coarse and hasty work, or they will not stand; their merit is low wages, specialization, so low cost and good quality; boldness in technical revolution and making do with simple things is the direction, not plants like those of 1958 whose products no one wanted and which dispersed at once; the specialized small plants split off from big plants must keep at least the former quality and must not lie on the state. On farmland: with five mu a head in Gansu, slowly make three mu yield 1,000 jin, three mu being enough; the rest to trees, grass, alfalfa, rotation and sheep. On seed: every seed degenerates, there must be good seed of one''s own, changed often; the United States has seed companies; the whole country cannot do seed uniformly, the provinces chiefly, and the prefectures and counties too; green manure and grass-and-tree shrubs serve for fertilizer and fuel. On the socialist education movement: it is enough to settle 80 percent of the problems, the main thing being whether errors are admitted and mended and the self-criticism good; problems are divided in two and some thought work is needed; some may stay unsettled, it cannot be done too thoroughly; the work team must have a good style and set an example.'
      place: lanzhou
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1901–1902 (Mar. 20, 1966). The words: 下午 (III, 1901–1902). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
