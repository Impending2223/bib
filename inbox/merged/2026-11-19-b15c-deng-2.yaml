      c: 'Peng Zhen 彭真 cables, at 8 p.m., to the Chinese embassy in Vietnam, for Deng Xiaoping 邓小平, then visiting Hanoi 河内: on the question of a statement Prime Minister Pham spoke of on the struggle against the United States, it has been discussed at the Chairman''s and his view is agreed.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1800 (Feb. 25, 1964). The nianpu gives the hour as 二十时. Made public: 2009 (the nianpu). See [[cal.1964-02-24.china-leadership-10]]. Names: Peng Zhen, Deng Xiaoping. Check: in whose clock (Peking presumably).'
