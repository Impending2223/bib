      date: '1964-07-03'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 hears the leaders of the Party committee of Lüda 旅大 city. On schools: two legs, regular schools and simple schools, and vocational schools too; some ordinary middle schools can be made into technical or vocational schools, but enrolment is not to rise; vocational students are not to be assigned jobs; on the committee''s work: with so many rural people and so large an area one rural work department cannot manage, a rural work committee should be set up to stand alone; town and country work to be separated.'
      place: dalian
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1819 (July 3, 1964). The words: 上午 (III, 1819). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
