      c: 'Deng Xiaoping 邓小平, as acting premier, meets Henry Murii 享利·穆利, Kenya''s first ambassador to China. Deng: the peoples of Africa, Asia and Latin America have a common task; China''s economy is still weak and can help others only within its means, but will help the newly independent states build, push the anti-imperialist and anti-colonial struggle in Africa and strengthen it in the world; a nation is truly independent only when independent in economy as well as politics.'
