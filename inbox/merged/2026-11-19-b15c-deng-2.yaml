    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1917 (June 3, 1966; Deng at the enlarged Politburo Standing Committee meeting Liu Shaoqi presides over, which studies questions of the ''cultural revolution'' and lays down eight rules: inside and outside to be told apart, secrecy kept, big-character posters not on the streets, no demonstrations, no linking up, no large denunciation meetings, no besieging the ''black gang''s'' houses, no beating or insulting; the meeting agrees that the Peking municipal committee send work teams into some universities and middle schools, and the central departments and Youth League Central Committee draw cadres to join them)'
