      when: Oct., late
      date: 1969-10
      thread: china-leadership
      also:
      - china
      at: after 1969-10-26
      c: 'Soon after the house is arranged, Deng Xiaoping 邓小平 sees Cheng Shiqing 程世清 and Chen Changfeng 陈昌奉 (footnote: Cheng, then chairman of the Jiangxi revolutionary committee and political commissar of the Military District; Chen, head of an independent division of the District and of the committee''s security group), who visit separately. He is ruled: apart from labour at the works he may not go out at will, not even from the small courtyard; his children''s visits need first the Jiangxi revolutionary committee''s consent.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1950 (Oct. 1969). The nianpu gives no day. Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 9e8d5321
