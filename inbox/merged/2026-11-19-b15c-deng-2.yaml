    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1800–1801 (Feb. 25–28, 1964; Deng with Kang Sheng, Fang Yi 方毅 and Wu Lengxi goes to Hanoi for the Sino-Vietnamese party talks on the Central Committee''s reply to the CPSU letter of Nov. 29, 1963 and on economic aid to Vietnam; reaches Hanoi on the afternoon of the 25th; leaves on the 28th; the nianpu gives no sum of aid. Footnote 3: Fang Yi, then deputy director of the State Planning Commission, deputy director of the State Council''s Foreign Affairs Office, and head of the Foreign Economic Liaison Bureau)'
