- add:
    entry:
      id: cal.1964-07-10.china-leadership-10
      when: July 10
      date: '1964-07-10'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 inspects the First Automobile Works 第一汽车制造厂, its engine shop and final assembly plant. He tells its director Guo Li 郭力: some of those in industry think the bigger the plant and the more workers the more glorious, but comparison shows backwardness; Anshan may be the most backward of the world''s steel enterprises; China''s motor industry employs 160,000, half of Ford''s, which makes 3 million vehicles a year against China''s tens of thousands; China should make at least a million a year, to bring prices down; plants are not to be judged by number of workers or by ground held; a revolutionary plan is wanted to rebuild the motor plants, those of Peking 北京 and Shanghai 上海 too, covering production, scientific experiment and design, by revolutionary and not reformist methods, even cutting output to use the time for the rebuilding; the Liberation truck now at 100,000 a year will be out of date in a few years and must be rebuilt, as must shipbuilding, the two industries to set the example; standardization and series; the big plant and branch plants may keep separate accounts and bear their own losses; some foreign technology may be bought for standardization; the tool branch plant of the First Automobile Works may be set apart as a combined tool plant for motor and tractor industries; a plant must advertise and widen its service.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1820–1821 (July 10, 1964). The words: 下午 (III, 1820–1821). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: ac4952c6
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1820–1821: all'
      tags:
