      date: '1964-03-05'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 meets the departing Czechoslovak ambassador, 赛过维. On China''s economy and prospects: 1959–61 were hard years, with natural disasters, ignorance of the laws of socialist construction, and the Soviet withdrawal of experts and tearing up of contracts, which upset the plans and forced readjustment; from the second half of 1961 the Chinese began to readjust, thinking and solving problems themselves; in recent years the harvest is larger than in the ten before; industry, agriculture, heavy and light industry are on normal tracks; they mean to build for twenty years, agriculture as base, industry as leading factor, in the order agriculture, light, heavy, finally the four modernizations.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1802–1803 (Mar. 5, 1964). The words: 上午 (III, 1802–1803). Made public: 2009 (the nianpu). Names: Deng Xiaoping. Check: the ambassador''s name in Latin letters (the nianpu: 赛过维).'
