- cite:
    id: cal.1965-01-14.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1844 (Jan. 14, 1965; Deng at the close of the Central Work Conference Mao presides over; the conference adopts ''Some problems now raised in the rural socialist education movement'' (the ''Twenty-three Articles''): sharp class struggle in town and country; the movement''s basic nature the contradiction between socialism and capitalism; its point to set in order those in the Party in power who take the capitalist road; from now the movements in town and country are all called the ''four clean-ups'' (clear politics, economy, organization, thought); by spring 1966 about a third of the counties and communes in the country''s villages have taken part)'
