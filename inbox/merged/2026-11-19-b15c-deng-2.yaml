      c: Deng Xiaoping 邓小平 flies to Kunming 昆明 and inspects the Kunming Iron and Steel Works. Hearing its head he says new equipment must be of modern level and the rebuilding of old equipment pressed to raise labor productivity; 500,000 tons of steel needs only a few thousand men, and with another ten thousand it would still be the most backward in the country; Yunnan's emphasis in the long run is non-ferrous metals, for which conditions are especially good and its 'treasures' many; Yunnan is to be made a non-ferrous metal province.
