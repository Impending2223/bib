      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 holds talks with Sanmugathasan 桑穆加塔桑. He describes the Party''s and Mao''s way of handling inner-party questions in the ten years from the Zunyi meeting of 1935 to the Seventh Congress of 1945: educate those who erred, make clear the right and wrong and the two lines, and settle by thought; on the Chinese revolution: the Chinese only describe their experience to fraternal parties, which choose for themselves what to borrow; every party must join Marxism–Leninism''s universal truth to its own revolutionary practice; tactics serve strategy; in the land revolution the landlords'' land was confiscated, after the Japanese invasion the contradiction of nations became principal and the landlord class a class to unite with and struggle against, with rent and interest reduction; the chief target must not be confused.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1865–1866 (June 14, 1965). Made public: 1989, in part ([[w.xiaoping-deng-xiaoping-wenxuan-1938]], as the first part of "Build a mature, fighting party" 《建设一个成熟的有战斗力的党》); in full 2009 (the nianpu). To check: [[w.xiaoping-deng-xiaoping-wenxuan-1938]] ("Build a mature, fighting party"). Names: Deng Xiaoping.'
