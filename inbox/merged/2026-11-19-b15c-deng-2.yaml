      - vis:only:prc
- cite:
    id: cal.1967-05.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1937 (May 1967; Deng, at home, receives Wang Dongxing 汪东兴, sent by Mao, who conveys Mao''s three views: first, to endure and not be anxious; second, Liu and Deng can be separated; third, if there is anything he may write to Mao; Deng says that many questions in the big-character posters outside do not accord with fact, and asks to talk with Mao in person; Wang reports the request to Mao; then, one night late, Mao''s secretary Xu Yefu 徐业夫 fetches Deng to Mao, and they talk till near dawn: Deng reports how in the thirties he left the Seventh Red Army for Shanghai to report to the Center, and accepts Mao''s criticism of the work teams; asked whom to report to, Mao says Wang Dongxing or a letter to himself; asked his view of Lin Biao, Deng does not answer; the words: 一天深夜)'
    units: A-C
