      c: Deng Xiaoping 邓小平 attends the welcoming banquet of the Central Committee 中央 of the Vietnam Workers' Party 越南劳动党; in the talks after the meal he says that China, in thinking of its construction plans, has considered the two countries' coordinated economic construction; China fully agrees that Vietnam build, as it can, a fairly complete, self-contained economy, with farming and light industry and such heavy industry as is necessary and possible; what China has helped with has only been items for the early period; from now on China will give Vietnam more systematic aid.
