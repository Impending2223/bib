      c: 'Deng Xiaoping 邓小平 meets John Marks 约翰·马克斯, chairman of the South African Communist Party, on a visit. On Sino-Soviet relations: the substance of the differences is a matter of great principle, revolution or not, anti-imperialism or not, support of national liberation movements or not; relations are now in a half-split state; China has not been and will not be the first to take any step breaking unity.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1768 (Aug. 2, 1963). Deng: 中苏关系可说已处于半分裂状态 (III, 1768). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
