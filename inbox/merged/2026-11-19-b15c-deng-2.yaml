      c: 'Deng Xiaoping 邓小平 reads Zhu Qiwen 朱其文''s report on Phạm Văn Đồng 范文同''s remarks on the struggle against the United States and what to do. Pham proposes that, against American war talk toward North Vietnam, the Vietnamese government issue a statement first and the Chinese government then one in support. Comment: Peng Zhen 彭真 to check; to be discussed at the Chairman''s; if there are instructions, cable them; his own view is that the Vietnamese should not hurry to issue a statement, but wait till the Americans shout louder; the United States seems not yet about to bomb North Vietnam.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1800 (Feb. 24, 1964). The words: 阅 (III, 1800). Deng: 越方不要急于发表声明，等美国叫得更厉害些再说 (III, 1800). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Phạm Văn Đồng, Peng Zhen.'
      src:
