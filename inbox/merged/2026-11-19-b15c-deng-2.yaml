- add:
    entry:
      id: cal.1966-03-31.china-leadership-4
      when: Mar. 31
      date: '1966-03-31'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, back at Lanzhou, hears Wang Enmao 王恩茂 on Xinjiang and interjects that Xinjiang can do much; its economy well done is military preparation, besides some local arsenals there must be the militia, and the Xinjiang production and construction corps must form militia divisions. After the report he sums up the Northwest trip: first, the lines of the first, second and third fronts in the Northwest are clear, the great third-front objects being south of the Qinling and south of Xining 西宁; second, the key question of the Northwest is agriculture, not industry; first step to 650 jin of grain a head, the second 700, and every added industrial person adds 650 to 700 jin; new plants not too concentrated, nearer to farming and good for war preparation, with different wage and labor systems; street industry now answers employment and later serves big industry as matching sets; follow Shanghai 上海 but scattered, with small third-front plants round the big ones in a net; small plants must watch quality from the start; for central enterprises in the Northwest the Northwest Bureau''s third-front committee has a voice and a large power of decision over plant layout and sites, the central departments thinking only along lines, the committee by defense, region and factory-commune union, with final settlement still by the central ministries; minority cadres must be trained, in farm-reclamation divisions, plants and troops, which is the mass line.'
      place: lanzhou
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1904–1905 (Mar. 31, 1966). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
