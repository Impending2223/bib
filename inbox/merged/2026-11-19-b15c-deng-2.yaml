      c: 'Deng Xiaoping 邓小平 talks at the Binjiang Guesthouse with Yang Dongliang 杨栋梁 (footnote: then a vice-chairman of the Jiangxi revolutionary committee and commander of the Jiangxi Military District).'
      place: nanchang
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1949 (Oct. 22, 1969). The nianpu gives no hour for the talk; it follows the arrival at noon. Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
