      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 holds talks with Ceaușescu 齐奥塞斯库, Stoica 斯托伊卡, chairman of the State Council, and Maurer 毛雷尔, chairman of the Council of Ministers. Deng: the relations of the two parties rest on common ideas and some common experience; the two do not agree on all international questions but are at one on the basic ones; at home, industry and agriculture are in fairly good shape, output is up much with a third fewer people on present equipment; a new five-year plan and a ten-year perspective plan are being prepared, the three years'' recovery giving them a good basis.'
      place: bucharest
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1870 (July 26, 1965). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
