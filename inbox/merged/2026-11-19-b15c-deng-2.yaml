      when: Sept. 29
      date: '1964-09-29'
      thread: china-leadership
      also:
      - cuba
      c: 'Deng Xiaoping 邓小平 meets the Cuban party and government delegation under Isidoro Malmierca 伊西多罗·马尔米埃尔卡·佩奥里 Peoli 伊西多罗·马尔米埃尔卡·佩奥里, organizing secretary of the Havana provincial committee of the United Party of the Socialist Revolution. Deng: China as a whole is still ''poor and blank''; some say the Chinese five men share one pair of trousers and drink thin soup from the big pot, which is not so, but they are backward; the aim of the four modernizations will take decades; they are lucky to have a leader like Mao; over 90 percent of the people are united and in good spirit.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1829 (Sept. 29, 1964). The words: 上午 (III, 1829). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
