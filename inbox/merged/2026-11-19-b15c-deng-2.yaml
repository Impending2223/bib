- cite:
    id: cal.1964-04-07.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1807–1808 (Apr. 5–20, 1964; Deng with Peng Zhen and Kang Sheng leaves Peking with the members of the anti-revisionist drafting group on a special train, for visits in Shanxi, Inner Mongolia, Ningxia, Gansu, Shaanxi, Henan and Shandong; at the Hetao irrigation area says that crude farming is to be changed and yield per unit raised; at the Inner Mongolia No. 1 Machine-Building Plant, that old products are to be remade and new ones developed; on Apr. 9 at Baotou Iron and Steel Company 包头钢铁公司 says China can for a time build only three great steel combines, Anshan, Wuhan and Baotou (the nianpu''s note), and Baotou must go up, with the question of combined ore dressing pressed; to local officials, frontier defense and above all the frontier militia must be strengthened and a plan made; on Apr. 10 by train to Bayan Obo, hears its officials and says it is a treasure mountain and to learn from Daqing; on the morning of the 11th climbs on foot the main mine, over 1,800 meters, and says rare earths too are to be mined; at noon takes the train to Gansu; from 0 to 8 a.m. of the 12th halts at Changchuan station, hears the deputy secretary of the Zhenlan county committee; reaches Lanzhou at 9, inspects the Lanzhou Chemical Industry Company, the petrochemical plant and the Jianguo machinery plant, and says of synthetic rubber that using grain alcohol as raw material (8,000 tons of rubber take 20,000 tons of alcohol, 70,000 of grain) is wrong, oil is better)'
