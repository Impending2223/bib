      date: '1966-03-30'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 goes by train to Haiyan county; on the way he hears Yang Zhilin 杨植霖, first secretary of the Qinghai provincial Party committee, on Qinghai. He says its work turns on two questions, agriculture and the nationalities question, and the nationalities question is a cadre question: to build a stable rear there must be minority cadres and leaders, each brigade and each commune its own; excellent people are to be sent deliberately to plants and the army to study, to learn Chinese and Tibetan, to study culture for three years; plants are to be given the task of training minority cadres.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1904 (Mar. 30, 1966). The words: 上午 (III, 1904). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
