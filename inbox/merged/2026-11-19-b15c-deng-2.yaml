- cite:
    id: cal.1964-05-15.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1812 (May 15–June 17, 1964; Deng attends the Central Work Conference in Peking, on the agricultural plan for the Third Five-Year Plan period, current rural work and the socialist education movement, the first ideas for the Third Plan, political work in all systems and finance and trade work; on May 18 at the plenary he explains the arrangement of the agenda; on the afternoon of June 17 he gives the summing-up. Before the conference Mao says agriculture and national defense are the ''fist'', basic industry the ''backside''; during it he proposes the first, second and third lines and the building of the third line; the conference holds that a third of the grass-roots leadership is not in the Party''s hands)'
