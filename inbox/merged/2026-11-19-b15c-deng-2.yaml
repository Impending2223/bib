- cite:
    id: cal.1964-02-23.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1799 (Feb. 23, 1964; Deng reads the Central Committee''s reply to the CPSU letter of Nov. 29 (draft of Feb. 22): to Liu Shaoqi, ''I think this draft will do; I have made a few changes in wording; I propose a talk tomorrow (the 24th) afternoon at the Chairman''s, Peng back by then''; beside the sentence that all complete sets of equipment and general goods from the Soviet Union, loans included, were paid for in goods, gold and convertible currency, he writes that it should be added that what China imported from the Soviet Union cost far more than at world prices)'
- add:
