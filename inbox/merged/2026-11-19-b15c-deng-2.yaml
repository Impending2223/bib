      time_zone: Asia/Shanghai
- add:
    entry:
      id: cal.1964-10-15.china-leadership-5
      when: Oct. 15
      date: '1964-10-15'
      thread: china-leadership
      also:
      - cuba
      c: 'Deng Xiaoping 邓小平, with Lu Dingyi 陆定一, meets the Cuban party and government delegation. Deng: the people''s communes are still being tried and need more experience; to make them really good and show their superiority will take fifty years; a commune can have many lines, small processing industry among them, only with production up and accumulation; the social insurance part grows only with it; in time the communes'' wealth will bring unforeseen new problems; for the country, peasants'' living standard is to rise gradually to the workers''; if not solved, rural people will pour into the cities; now the city is better than the countryside, and communism is to abolish that difference.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1832 (Oct. 15, 1964). The words: 下午 (III, 1832). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Lu Dingyi.'
