      thread: china-leadership
      also:
      - soviet-union
      c: 'Deng Xiaoping 邓小平 writes to Mao Zedong 毛泽东, Liu Shaoqi 刘少奇 and Zhou Enlai 周恩来 on printing in the *Renmin ribao* 人民日报 the editorial of the Albanian *Zëri i Popullit* 人民之声报: Kang Sheng 康生 and others favor it; it names Khrushchev''s 赫鲁晓夫 group directly in many places, but Khrushchev''s attacks on the Albanian party have been venomous and the Chinese have not printed Albanian articles for long, so printing it after five or six Soviet, French and Italian pieces, not in bold type, seems possible. Asks for their ruling. Published Feb. 26.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1747 (Feb. 19, 1963). Deng: 我觉得是可以的。请予批示 (III, 1747). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Mao Zedong, Liu Shaoqi, Zhou Enlai, Kang Sheng, Khrushchev.'
