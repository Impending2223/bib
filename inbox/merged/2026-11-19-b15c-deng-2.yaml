    entry:
      id: cal.1969-11-09.china-leadership-2
      when: Nov. 9
      date: '1969-11-09'
      thread: china-leadership
      also:
      - china
      c: Deng Xiaoping 邓小平 and Zhuo Lin go to the Xinjian County Tractor Repair Works to labour. Deng is first set to wash parts and read drawings, then, at his own request, made a fitter, working parts with a file; Zhuo Lin is put in the electricians' team, washing coils with the women workers.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1950 (Nov. 9, 1969). The words: 上午 (III, 1950). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 6b011acd
        rows:
