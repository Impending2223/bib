- add:
    entry:
      id: cal.1965-11-22.china-leadership-10
      when: Nov. 22
      date: '1965-11-22'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, with Li Fuchun 李富春, Bo Yibo 薄一波 and others, hears Jia Qiyun 贾启允, first secretary of the Guizhou provincial Party committee. Deng: good, relatively young cadres with little actual work time are to be sent deliberately to mines, plants and capital-construction units, to do a few years of the ''four clean-ups'' and then come up, otherwise how to take over; the younger the better; Party members to be recruited in the ''four clean-ups'', some of forty or fifty but chiefly the young; cadres must be able to go up and down so that more get leading experience; long in power changes a man''s ideology, but production-team heads are to be re-elected steadily; Guizhou should do much subsidiary production so that its people can eat meat, tree oil crops, hemp for clothing; salt is unsolved, with goitre from lack of it; private plots are a policy question to be studied, what should be taken back and what let go; forest farms everywhere along the railways and waterways; Guizhou must be richer than Sichuan or the work is not done; native methods of mining and production are no good, modern mining after the reserves are known; Guizhou will be a great industrial zone; besides farming and grain self-sufficiency the provincial committee must build the Wujiang hydropower station.'
      place: guiyang
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1882–1883 (Nov. 22, 1965). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Li Fuchun, Bo Yibo.'
      src:
