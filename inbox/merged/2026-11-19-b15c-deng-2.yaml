      c: 'Deng Xiaoping 邓小平, at the Nanjiao guesthouse at Jinan, hears Tan Qilong 谭启龙, Bai Rubing 白如冰, Zhou Xing 周兴, Su Yiran 苏毅然 and Mu Lin 穆林 of the Shandong provincial Party committee. Deng: terraced fields, well made, can give high yields; where machine wells can be sunk, sink more; river courses to be dredged more, field work done more, to settle drought as well as flood; the question of drawing Yellow River water is not yet solved; water and soil conservation in the hills, Jiaodong and southern Shandong; make production the key link and raise it.'
