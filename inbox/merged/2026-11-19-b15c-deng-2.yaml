    entry:
      id: cal.1964-01-14.china-leadership-4
      when: Jan. 14
      date: '1964-01-14'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Deng Xiaoping 邓小平, as acting premier, meets Josef Hegen 约瑟夫·黑根, the departing ambassador of the German Democratic Republic. On the Sino-Soviet differences: the Chinese said not to expose internal differences before the enemy or widen them to relations of states; but since some said exposure was the only Marxist–Leninist attitude, the Chinese wrote some articles; now the same people say stop; the Chinese proposed that all the parties agree together on an accord to end disputes among parties, which the CPSU refused, wanting China and the CPSU silent while its allies go on attacking the CCP; open dispute may be no bad thing after all. On agriculture: output must rise by raising the yield of the land now tilled, so water comes first; irrigation rests on the peasants'' drive and on the communes, the teams alone cannot do it; Marx and Engels proposed agriculture as the base; the United States is developed because its agriculture came through.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1790–1791 (Jan. 14, 1964). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
