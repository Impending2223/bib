- add:
    entry:
      id: cal.1964-05-19.china-leadership-5
      when: May 19
      date: '1964-05-19'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'Deng Xiaoping 邓小平 meets the delegation of the Vietnam Working Youth League under Li Ping 黎平, secretary of its Central Committee''s 中央 Secretariat 书记处. Deng: in the 1930s the Soviet Union did not settle the theoretical question of what character the whole historical period of socialism has; Stalin''s early announcement that socialism was built, that there were no classes and class struggle was absent or unimportant, was an error of principle; his slogan ''technique decides everything'' had a positive side while Soviet technique was backward, but neglected joining technique to political thought; their ''socialism built'' means only that industrial output is above farm output, 70 percent of the national product, and says nothing of political thought.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1812–1813 (May 19, 1964). The words: 下午 (III, 1812–1813). Made public: 2009 (the nianpu). Names: Deng Xiaoping. Check: the Vietnamese form of the secretary''s name; the nianpu: 黎平.'
