- cite:
    id: cal.1966-03-04.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1898 (Mar. 4, 1966; 会议召开前; On Mao Zedong''s 毛泽东 instruction and the decision of the Politburo 政治局 Standing Committee 政治局常委会, the Central Committee 中央 convenes a small-group meeting to discuss the Luo Ruiqing 罗瑞卿 question. Before it opens, Deng Xiaoping 邓小平 states how it is to be run and its guiding idea, asking for the line of seeking truth from facts, curing the sickness to save the patient, and permitting revolution (the nianpu''s note: the meeting ended Apr. 8; the Central Committee named Deng, Peng Zhen 彭真 and Ye Jianying 叶剑英 a working group to handle the Luo Ruiqing question, Ye presiding at the meeting))'
