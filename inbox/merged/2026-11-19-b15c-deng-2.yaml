- cite:
    id: cal.1965-03-02.china-leadership-5
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1849 (Mar. 2, 1965; afternoon, 下午; Deng presides at the Secretariat, which hears Lu Dingyi on the socialist education movement in the literary and art circles; Deng: now no one dares write; Xinhua gets only two manuscripts a day; the stage shows only soldiers and battles; this is banned and that is banned; the ''revolutionaries'' want to make a name by criticizing others and climb on others'' shoulders; it is to be stopped quickly; work teams used to seek out poor peasants only, leaving cadres no way out, but under the Twenty-three Articles 80 percent of cadres'' drive is aroused; the three months'' going to the countryside by the cultural world is not to be done so mechanically)'
    units: B-D
- cite:
    id: cal.1965-03-03.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1849 (Mar. 3, 1965; afternoon, 下午; Deng presides at the Secretariat on the socialist education movement in cultural and educational departments; says the earlier work is to be affirmed for its gains and its faults pointed out; the weekly seven hours'' criticism of Feng Ding 冯定 (footnote 1: then professor of philosophy at Peking University) is to be stopped at once; the movement is to turn to carrying out teaching and rousing the staff''s drive; one cannot argue by class origin alone, Youth League members are to help those of bad origin serve socialism; the meeting also decides to set up the State Capital Construction Commission)'
    units: A
