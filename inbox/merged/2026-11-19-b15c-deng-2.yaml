    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1767 (July 28, 1963; Mao''s comment on Deng''s report: reading alone is not enough, the records are to be printed, a copy to every three or five of the seventeenth grade and above, to discuss, all called back after three months; the same day Deng to Yang Shangkun: handle it as the Chairman instructs)'
    units: A-C
- cite:
    id: cal.1963-07-28.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1767 (July 28–30, 1963; Deng at Mao''s meetings on the treaty banning nuclear tests in the atmosphere, in outer space and under water, signed in Moscow July 25 by the United States, Britain and the USSR, and on the draft statement of the Chinese government for a complete, thorough, clean and resolute ban and destruction of nuclear weapons and a summit conference of the world''s governments; the Renmin ribao prints the statement July 31)'
- cite:
    id: cal.1963-07-30.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1767 (July 30–Aug. 1, 1963; Deng on three successive mornings with Peng Zhen, Li Xiannian, Bo Yibo, Yang Shangkun, Gu Mu 谷牧, Cheng Zihua 程子华 and Wu Bo 吴波 discusses industrial questions; on the 30th says that in the next three years conditions must be made for the Third Five-Year Plan, each branch must fix its key points, capital construction must be real capital construction with no inclusion of outlays and equipment renewal, and a city plan is wanted)'
    units: B
- add:
    entry:
      id: cal.1963-07.china-leadership-2
      when: July, late
      date: 1963-07
      thread: china-leadership
      at: before 1963-07-21
      c: 'Deng Xiaoping 邓小平 reads the *Renmin ribao* 人民日报 editorial board''s request on propaganda for the Central Committee''s 中央 draft "Decision on some current problems of work" 《关于目前工作中若干问题的决定（草案）》. Comment: agrees with Peng Zhen''s 彭真 view. Peng Zhen, on the board''s plan for an editorial on the fifth anniversary, Aug. 29, of the resolution on setting up people''s communes in the countryside, on the commune as a scientific experiment and its great significance: better to print an editorial of that kind some time later, when it will be more convincing.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1768 (July 1963). The words: 7月下旬 (III, 1768). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Peng Zhen.'
