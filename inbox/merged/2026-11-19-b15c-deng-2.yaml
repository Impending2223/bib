      c: 'Deng Xiaoping 邓小平 reads the Foreign Ministry''s report on the line and tasks of the provisional chargé d''affaires going to France. Comment: agreed in principle; he will meet them tomorrow; Mao, Liu and Peng to read it; the chargé can reach Paris before the 15th; in principle, while the Chiang group keeps a consulate in France, China should not send an ambassador, and on this there is to be no ambiguity; that the Chiang group should give up its consulate in France while France keeps one in Taiwan is the less likely; if it does not arise, put it aside and wait.'
