      c: 'Deng Xiaoping 邓小平 meets the delegation of the Australian tramway workers'' unions. Deng: China''s two basic views of itself are that it is backward and that it has hope; to shake off backwardness and reach the four modernizations will take about fifty years; the people must be told so, and all difficulties plainly; no country, party or person is without error, the aim is to avoid big ones.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1806–1807 (Apr. 4, 1964). The words: 下午 (III, 1806–1807). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
