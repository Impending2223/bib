- add:
    entry:
      id: cal.1968-07-05.china-leadership-2
      when: July 5
      date: '1968-07-05'
      thread: china-leadership
      also:
      - china
      c: Deng Xiaoping 邓小平 finishes the first draft of "My Account", of over 26,500 characters, in twelve parts from his family and childhood to his life after coming to Peking 北京. He writes that his greatest hope is to remain in the Party as an ordinary member; he asks for a small job when it is possible and some labour within his powers, a chance to make amends. The text is later issued within the Party as *My Account*.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1943 (July 5, 1968). The words: 下午 (III, 1943). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 0e66e4ed
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1943: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
      time_range:
