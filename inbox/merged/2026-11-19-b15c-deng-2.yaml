- cite:
    id: cal.1964-11-08.china-leadership-4
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1835–1836 (Nov. 8, 1964; morning, 上午; Deng at the Politburo Standing Committee meeting; he says China can use the Malinovsky incident (footnote 1: at the Soviet reception of Nov. 7 Defense Minister Malinovsky told He Long that the Soviets had now got Khrushchev out and the Chinese should do the same with Mao, to be reconciled; He Long rejected it and told Zhou, who told Mikoyan it was a serious provocation) to lay the questions out, to show that the delegation went to Moscow for unity against the enemy and proposed that all the socialist states send delegations to show unity before imperialism; the Soviet side''s treating China as an enemy, wishing to meddle in its internal affairs and overthrow its leadership, turns enemy and friend upside down and wrecks unity)'
- add:
    entry:
      id: cal.1964-11-08.china-leadership-9
      when: Nov. 8
      date: '1964-11-08'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Deng Xiaoping 邓小平, after the meeting and on Mao Zedong''s 毛泽东 instruction, drafts at once a telegram to the Chinese Party and government delegation: (1) agrees that the delegation put a formal protest to the CPSU Central Committee 中央 for a formal answer; (2) the delegation is to seize on the Malinovsky incident and go on the offensive, blaming the new Soviet leadership for wrecking unity and continuing a Khrushchevism without Khrushchev 赫鲁晓夫; (3) in talks with the new leaders it is not to raise an international conference and its preparatory meeting, or Sino-Soviet party talks.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1836 (Nov. 8, 1964). The words: 会议结束后 (III, 1836). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Mao Zedong, Khrushchev.'
      src:
        c: 7741fab9
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1836: all'
