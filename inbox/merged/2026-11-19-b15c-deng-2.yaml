      c: 'Deng Xiaoping 邓小平 inspects the Northwest missile test base, watches a surface-to-air missile launched, receives its cadres, soldiers, workers and families, and is photographed with over five hundred outstanding workers. After hearing the base''s report on farming and sideline production he says: a willow is a small reservoir; plant trees, and when many are planted the climate will in time change.'
