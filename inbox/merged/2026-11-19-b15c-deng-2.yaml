    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1787–1788 (Jan. 6, 1964; afternoon, 下午; Deng presides at the Secretariat, which hears Bo Yibo on the national conference on industry and communications; Deng says all work is to put politics in command, that political-work systems with political organs like the Liberation Army''s are to be set up from mines and plants to the villages, and that seniority is a big problem of the country, to be met by choosing young and strong people to head the new political organs; on trials of ''trusts'' 托拉斯 says each must be joined with scientific experiment and research (footnote 1: trusts tried in industry and communications from the early 1960s at the proposal of Mao, Liu Shaoqi, Zhou Enlai and Deng))'
    units: B
