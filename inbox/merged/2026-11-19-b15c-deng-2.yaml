- cite:
    id: cal.1966-10-24.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1933 (Oct. 24, 1966; evening, 晚; Deng at Mao''s meeting, where Mao on Liu Shaoqi and Deng says the posters against them are not to be put in the streets; they are to be allowed to make revolution and to correct themselves, and the two alone are not to be held responsible for the Eighth Congress reports, which all read and the Congress passed)'
    units: E
- cite:
    id: cal.1966-10-25.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1933–1934 (Oct. 25, 1966; Deng at the plenary session of the Central Work Conference Mao presides over; Mao says that before the Eleventh Plenum he stood in the second line, not running daily work, many things left to others, and those in the first line handled them not so well, and that the first-line, second-line system is now changed, the Peking question in the main settled; he also shows his dissatisfaction with Deng: Deng is deaf, at a meeting sits far from him and never seeks him out)'
    units: B
- cite:
    id: cal.1966-11-06.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1934 (Oct. 31, 1966; Zhou Enlai writes to Mao and Lin Biao: ''I send the written self-criticisms of Shaoqi and Xiaoping; Shaoqi made some changes in his draft and added a paragraph, Xiaoping corrected only a few wrong characters; to be printed and issued, as first agreed, down to county and regiment level''; Mao: ''Do it'')'
    units: A
