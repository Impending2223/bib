    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1937–1938 (July 17, 1967; evening, 晚; Jiang Qing, Kang Sheng, Chen Boda, Qi Benyu and others meet at the Great Hall of the People and decide to struggle against Liu Shaoqi, Deng Xiaoping, Tao Zhu and Tao''s wife (the nianpu: Tao Zhu and his wife; Liu and Deng, with their wives, in the calendar''s entry); on July 18, in the small hours, Qi Benyu calls some Zhongnanhai people to a meeting at the Great Hall to arrange face-to-face struggle against Liu, Deng and Tao Zhu)'
    units: A
- cite:
    id: cal.1967-07-18.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1938 (July 18, 1967; Mao at Wuhan, in talk with Zhou Enlai and others, says that next spring, after the cultural revolution, the Ninth Congress will follow and free all the old comrades, many of whom will be delegates and members of the Central Committee, and names Deng Xiaoping, Peng Zhen, He Long and others)'
