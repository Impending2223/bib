      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 meets Saturnino Paredes 萨杜尼诺·帕雷德斯, first secretary of the Central Committee 中央 of the Communist Party of Peru (Marxist–Leninist). Deng: the personal cult was invented by Khrushchev 赫鲁晓夫, against Lenin''s principles of party-building and dissolving the party''s fighting power; Lenin''s *Left-Wing Communism* is clear on masses, classes, party and leaders; the Chinese party is a revolutionary, fighting party of a highly united will, its organizational principle democratic centralism; a party must have a leader and a leading core, the nation one, each locality one, even a branch; where there is none one must be trained; the Chinese revolution won because of a leader like Mao; leader and collective leadership do not conflict.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1837–1838 (Nov. 20, 1964). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Khrushchev.'
