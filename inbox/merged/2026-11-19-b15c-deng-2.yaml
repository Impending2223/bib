- cite:
    id: cal.1964-08-29.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1826–1827 (Aug. 29–Sept. 1, 1964; Deng at the meeting of the regional bureaus'' first secretaries Liu Shaoqi presides over, on the arrangements for the socialist education movement and the revised draft of the Latter Ten Points, which calls the movement a mass movement wider, more complex and deeper than land reform)'
