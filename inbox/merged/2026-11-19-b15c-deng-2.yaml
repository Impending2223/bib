- add:
    entry:
      id: cal.1966-01-17.china-leadership-2
      when: Jan. 17
      date: '1966-01-17'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 reports to the All-Army Political Work Conference 全军政治工作会议 in three parts: international questions, the home situation, and the army. On the first: last year was one of great upheaval, reorganization and splitting; war in fact exists in many places; whether a big one will come has two possibilities, it may be fought or not, and preparation is for its being fought; late or early are also two possibilities and early war must be prepared for; the people are taught not to fear war and to prepare for it actively, and so stand undefeated. At home: war preparation as the key link came up only after Mao''s pointing it out and especially his raising the big and small third fronts; it is now taken as the strategic guiding idea to be done with all strength, and has been built into the Third Five-Year Plan; the big and small third fronts mean much for defense and equally for construction. On the army: should trouble come, how well the war is fought depends on the army and its union with the people; imperialism fears the whole people in arms; the army fights political battles, politics first; strategy is politics, to beat the strong with the weak and the many with the few; ''fight if you can win, go if not'' is politics, a strategic principle; the army''s fighting power rests on political thought.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1891–1892 (Jan. 17, 1966). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 9c01ea33
        rows:
