      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 hears the leaders of the Sichuan provincial Party committee at the Panjiaping guesthouse in Chongqing 重庆. Cadres moved down in the provincial and prefectural adjustments are better placed on the spot, their pay unchanged, and may do concrete technical work; county and commune cadres may be older but local men, as far as possible; in training and promoting young cadres, to go by class origin is against the Party''s cadre line; children of cadres are not necessarily better than those of intellectuals; on rice: low double-crop yields round Luzhou and Zigong come from wrong seed; with the right seed double cropping can be done on both banks of the Yangtze; seed is not well done anywhere in the country, it must be bred continually or degenerates, American seed companies hybridize maize every year.'
      place: chongqing
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1882 (Nov. 19, 1965). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
