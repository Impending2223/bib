    entry:
      id: cal.1964-01-11.china-leadership-4
      when: Jan. 11
      date: '1964-01-11'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 reports on the present international and domestic situation to the All-Army Political Work Conference 全军政治工作会议. The international situation in four sentences: the imperialist camp is split in four; a revolutionary situation exists in Asia, Africa and Latin America; the socialist camp is in fact in a state of split; in the international communist movement Marxism–Leninism and revisionism are in a sharp struggle. At home: the ''great leap'' was one-sided in taking much steel as the leap; the leap is to be in variety, quality, science and technology; policies must serve productive forces and the four modernizations, and the Party must ensure the road to communism; Daqing is the model, joining thrift, speed, politics, revolutionary drive and strict scientific management; plans are to rest on agriculture as base and industry as leading factor, with food, clothing and goods first, then basic industry, then national defense; county cadres average fifty years old, successors are needed.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1789–1790 (Jan. 11, 1964). Deng: 不在乎钢有多少，而是要在品种、质量、科学技术方面有大跃进 (III, 1789). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 4fe20b81
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1789–1790: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
