      c: 'Deng Xiaoping 邓小平 visits the Dalian 大连 shipyard and the Institute of Chemical Physics. At the shipyard he says: fix the types of product by need and make them in batches, not one thing this year and another next; money and time spent without building a decent sea-going fleet; attend to organized cooperation among plants, no universal plants doing everything themselves.'
      place: dalian
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1819 (July 2, 1964). The words: 下午 (III, 1819). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
