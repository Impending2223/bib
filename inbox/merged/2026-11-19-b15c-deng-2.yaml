- add:
    entry:
      id: cal.1964-07-11.china-leadership-7
      when: July 11
      date: '1964-07-11'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 hears the leaders of the Jilin provincial Party committee. On the aim of the ''five-antis'' and ''four clean-ups'': to develop productive forces and prevent revisionism, by four things: leading groups holding to Marxism–Leninism; leading cadres'' labor made a system; the masses fully roused, so that the question of whom to rely on is settled; and management improved and production raised, with the old, weak, disabled and supernumerary cut, regular order set up and labor productivity raised, without which no economic accounting is possible. On trusts: not to be run by administrative methods; some plants are universal plants and some universities universal universities; the finer the departments are divided, the wider the use; the narrower the knowledge, the narrower the thought.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1821 (July 11, 1964). The words: 下午 (III, 1821). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
