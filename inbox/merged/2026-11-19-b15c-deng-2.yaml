      c: Deng Xiaoping 邓小平, with Zhuo Lin and his stepmother Xia Bogen, under the watch of two staff of the case group, flies from Peking's 北京 Shahe airfield 沙河机场 on an Il-14 military plane to Nanchang, Jiangxi. They arrive at noon and put up at the Binjiang Guesthouse 滨江招待所.
