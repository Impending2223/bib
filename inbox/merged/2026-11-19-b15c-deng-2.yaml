      c: 'Deng Xiaoping 邓小平 reads the draft speech of the head of the Chinese government delegation at the first meeting of the Sino-Soviet border negotiations 中苏边界谈判. Comment: the Soviet side has agreed to send a delegation of vice-ministerial rank to Peking 北京 in February (1964) to begin negotiations. (1) Agrees in principle with the Foreign Ministry''s request and report (the line for the negotiations); new problems will arise, to be dealt with then. (2) The head''s first speech can be used; it may be looked over once more before the talks. (3) The delegation''s make-up to be drawn up by the Foreign Ministry and sent for approval, and sent to Mao, Liu, Zhu and Peng for their reading.'
