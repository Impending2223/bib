      c: 'Deng Xiaoping 邓小平 meets the delegation of the Revolutionary Nationalist Movement of the Left (the nianpu: 玻利维亚左翼民族主义革命党) of Bolivia, headed by Héctor Cossío 埃克托尔·科斯奥. Deng: China is still backward and will take decades to become a developed industrial and agricultural socialist country; admitting backwardness helps building and progress; since they won the revolution by their own strength they can build by self-reliance; without pressure there is no building, pressure gives spirit and finds methods.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1856 (Apr. 16, 1965). The words: 下午 (III, 1856). Made public: 2009 (the nianpu). Names: Deng Xiaoping. Check: the party''s name and the leader''s in Latin letters.'
