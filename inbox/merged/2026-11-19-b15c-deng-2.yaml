- cite:
    id: cal.1963-08-20.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1770 (Aug. 20–24, 1963; Deng presides at the meetings of the Central Committee''s drafting committee on industrial development; on the 20th says that the industrial line and plan must start from reality and consider the base of agriculture, industry and science and technology; urges, as a near goal, within five to seven years an independent industrial system on a national scale; the summary is in the *Selected Works of Deng Xiaoping*, vol. 1, as ''Base on reality, look to the future'' 《立足现实，放眼前途》)'
