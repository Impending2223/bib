      id: cal.1964-02-24.china-leadership-9
      when: Feb. 24
      date: '1964-02-24'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, as acting premier, meets Joe Fio Meyer 乔·非奥·麦耶, the new ambassador of Ghana, and the first secretary Bone 波内. Deng: Ghana under President Nkrumah has taken many effective measures to defend national independence; the struggle bears on Africa, Asia and Latin America; the two peoples are comrades in arms and can compete in opposing imperialism, building national economies and defending independence; China is still weak economically and will help within its means; imperialism looks down on the colored races as low in ability, which they are not; China is backward economically and technically, not politically.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1799–1800 (Feb. 24, 1964). The words: 上午 (III, 1799–1800). Made public: 2009 (the nianpu). Names: Deng Xiaoping. Check: the ambassador''s name and the first secretary''s in Latin letters.'
