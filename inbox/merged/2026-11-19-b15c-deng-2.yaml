      c: 'Deng Xiaoping 邓小平, after the meeting and on Mao Zedong''s 毛泽东 instruction, has the substance put together and sent to the delegation by telegram: to refuse firmly to discuss an international conference of fraternal parties, and to declare that the Chinese will never attend the preparatory meeting the Soviet side ordered for December.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1836 (Nov. 10, 1964). The words: 会后 (III, 1836). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Mao Zedong.'
