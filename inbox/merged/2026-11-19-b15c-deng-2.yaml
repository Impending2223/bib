      id: cal.1964-06-26.china-leadership-8
      when: June 26
      date: '1964-06-26'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, at Shenyang 沈阳, hears an account of the production of the city''s machine industry. He says the machine industry must be specialized: the general-purpose shops scattered in the branch plants gathered, the foundries and forges of the whole machine industry concentrated, to cut cost, raise output and quality; without specialization advanced technique cannot develop; the main problem is dull variety of general-purpose machine tools and too few precision ones, whose key is reorganizing, rebuilding and adjusting the machine industry; within two or three years Shenyang''s Nos. 1, 2 and 3 machine-tool plants are to become precision plants, so as to win foreign markets; the rebuilding to be organized by the State Economic Commission and the State Planning Commission across the lines of center, province and city; increase variety and quality on the present base, not by adding people and plants; in the managing system the Chinese cannot use capitalist methods, and the Soviet way was an unsuccessful experience; how to do it is to be felt out slowly.'
      place: shenyang
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1818 (June 26, 1964). The words: 下午 (III, 1818). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
