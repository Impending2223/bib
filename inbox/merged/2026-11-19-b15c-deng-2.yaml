    entry:
      id: cal.1966-03-10.china-leadership-5
      when: Mar. 10
      date: '1966-03-10'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 hears Liu Lantao 刘澜涛 and Wang Lin 王林 on the work of the Central Committee''s 中央 Northwest Bureau 西北局. Deng: the Northwest must have machine-tool capacity on the third front; arsenals are to specialize, make some machine parts and some civilian things; on soil and water conservation: the film of the Gaoxigou in Mizhi county, with terraces and dam fields, is the way, ditch by ditch, a hundred years of tree planting on the loess plateau; the grain base is the whole country''s base and must send out commodity grain; the Sanmenxia reservoir has pushed the water up, turning harm to good, and with more groundwater terraced fields can be made; the Northwest need not send out grain but must raise reserves by 500 million jin a year for war, both in state granaries and in the hands of production teams; the key to the country''s farm problems is the North.'
      place: xian
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1899 (Mar. 10, 1966). The words: 上午 (III, 1899). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 89dfe051
        rows:
