      when: Jan. 2
      date: '1963-01-02'
      thread: china-leadership
      c: 'Deng Xiaoping 邓小平 writes to Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and Peng Zhen 彭真: Ke Qingshi 柯庆施 proposes to put the Central Work Conference 中央工作会议 off to early February; Mao Zedong 毛泽东 has agreed.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1741 (Jan. 2, 1963). The words: 致信 (III, 1741). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Liu Shaoqi, Zhou Enlai, Peng Zhen, Ke Qingshi, Mao Zedong.'
      src:
        c: b066aaba
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1741: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:peng-zhen
      - name:ke-qingshi
      - name:mao-zedong
      - vis:only:prc
- cite:
    id: cal.1963-01-05.china-leadership-7
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1741 (Jan. 5, 1963; afternoon, 下午; Deng receives Williams 姆威廉斯 of the New Zealand Communist Party; says since the CPSU''s Twenty-second Congress the Chinese have urged discussion among the parties, not in public before the enemy, and have tried to avoid a split, or if not, to delay it; the nianpu says a meeting, not a banquet)'
- cite:
    id: cal.1963-01-08.china-leadership-7
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1741 (Jan. 8, 1963; Deng presides at the Secretariat; four matters: the line for attending the SED''s Sixth Congress, an observation group to Vietnam, the National Fisheries Work Conference''s papers, and the Bo Yibo and Li Xiannian proposal that the State Council''s annual summaries in industry, communications, finance and trade go out under the vice-premiers)'
    units: B
- cite:
    id: cal.1963-01-08.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1741–1742 (Jan. 9, 1963; Deng reads the record of Zhou Enlai''s call of the 8th from Hangzhou, in which Zhou gives Mao''s three instructions: the anti-revisionist article held until Khrushchev has spoken at the SED congress and then answered with his Supreme Soviet speech; more ''writers'' (秀才) for the delegation; Ke Qingshi''s plan of a small meeting on Feb. 5 with the bureau secretaries and a work conference on Feb. 10 with the provincial secretaries)'
- variant:
    id: cal.1963-01-08.china-leadership
    unit: C
    witness: w.deng-xiaoping-nianpu-1904
    reads: the call is Zhou's of the 8th (the record, 八日...打来电话的记录稿, read by Deng on the 9th), not a call of the 9th
    at: III, 1741
