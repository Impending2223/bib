    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1920–1921 (June 22, 1966; Deng with Liu Shaoqi writes to Mao: July 1, the forty-fifth anniversary of the Party''s founding, is near; to push the country''s cultural revolution better and help Party committees and cadres carry out democratic centralism, develop democracy and improve work, the Secretariat, with the agreement of several Standing Committee members, proposes publishing on that day Mao''s speech of Jan. 30, 1962 at the enlarged Central Work Conference; on the evening of the 24th Xu Yefu 徐业夫 (footnote: Mao''s confidential secretary) telephones Mao''s view that it suffices to publish it inside the Party; on the 27th Wang Dongxing relays: not for now, wait another year; at 2 a.m. on the 30th Mao, on the way to Wuhan by Changsha, writes Liu and Deng that publishing it now is out of season, to be considered after the cultural revolution)'
