      c: Deng Xiaoping 邓小平 inspects the Jinchuan 金川 Non-ferrous Metals Company 金川有色金属公司 and an open-pit mining operation. In the company's exhibition room he hears its head and affirms that the mine's resources are a rare 'golden baby', a 'treasure bowl' of the country; at the concentrating and smelting plant he asks specific questions on the nickel process, total recovery and comprehensive use of resources; at the new plant area he receives the company's and the Eighth Metallurgical Construction Company's cadres and outstanding producers and is photographed with over a thousand workers.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1903 (Mar. 27, 1966). The words: 上午 (III, 1903). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
