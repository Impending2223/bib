      id: cal.1964-01-29.china-leadership-6
      when: Jan. 29
      date: '1964-01-29'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, as acting premier, meets the French parliamentary delegation under François Bénard 弗朗索瓦·贝纳尔. Deng: every state, large or small, strong or weak, has its place and two states cannot rule international affairs alone; those who call the Chinese warlike are wrong; the Chinese need a peaceful setting, for decades, to improve their economy; whoever threatens China with war it does not fear; the Sino-American ambassadorial talks are in their eighth year, the central matter that the United States wants to seize Taiwan and have the Chinese accept ''two Chinas''; Taiwan is part of China and nothing can change it; the American threat forces China to attend to its defense; atom bombs and hydrogen bombs that others can make the Chinese can also make.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1794 (Jan. 29, 1964). The words: 下午 (III, 1794). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
