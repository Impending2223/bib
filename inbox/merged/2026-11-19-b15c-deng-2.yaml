- add:
    entry:
      id: cal.1969-11-23.china-leadership-2
      when: Nov. 23
      date: '1969-11-23'
      thread: china-leadership
      also:
      - china
      c: 'Asked by the cadre of the Jiangxi Military District''s political department who supervises him to write his ''experience and understanding'' of a month''s labour and study in Jiangxi, Deng Xiaoping 邓小平 says: if there is anything I will write a report to Chairman Mao and the Central Committee 中央.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1950 (Nov. 23, 1969). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
      src:
        c: 2f1e8992
        rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1950: all'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1969-11-26.china-leadership-2
      when: Nov. 26
      date: '1969-11-26'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 writes to Wang Dongxing on his labour and life at Nanchang: from Nov. 9 he and Zhuo Lin have gone to the works, about three and a half hours'' labour a day; they read the *Selected Works of Mao Zedong 毛泽东* and the newspapers, listen to the radio at night, and have taken part in two Party rectification meetings and a mobilization meeting at the works. A note asks Wang to have clothes and books at the Peking 北京 home sent to Jiangxi, and they soon come.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1950 (Nov. 26, 1969). The words: 致信汪东兴 (III, 1950). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Mao Zedong.'
