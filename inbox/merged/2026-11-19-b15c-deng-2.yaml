- cite:
    id: cal.1965-05-11.china-leadership
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1861 (May 11, 1965; afternoon, 下午; Deng at the Politburo meeting, which in the main adopts the State Capital Construction Commission''s reports on adjusting the 1965 capital construction plan and the 1965 state budget to the situation of war preparation, and the Central Committee''s ''Decision on setting up political-work organs in the industrial and communications system''; Deng says the outstanding problem of the Third Plan is strategic reserves, grain, cloth and oil, to be considered as a whole; private income may be spent as people like, flowered clothes, more meat, better goods, a perm; Zhou: control of capital-construction investment, when he is away, may be sought directly from Deng)'
