    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1924 (July 19, 1966; afternoon, 下午; Deng at the enlarged Standing Committee meeting Liu Shaoqi holds on Mao''s view; when Chen Boda proposes to withdraw the work teams Deng and most others object; Deng says the work teams must be estimated correctly, neither the Party nor the teams had experience of such a movement; bad teams can be withdrawn first, good ones may stay and act for the Party committees; answering Chen''s charge that the central leaders in Peking ''fear the masses'' he rebuts it and says plainly that he does not agree to withdrawing all the work teams)'
