      when: Nov. 16
      date: '1965-11-16'
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平 hears Duan Junyi 段君毅 and others at Chongqing 重庆. On the machine industry: its variety and quantity conflict; ordinary new products are too few and precise and advanced ones fewer; it must go faster, above all in precision machine tools; with coal in Guizhou and timber in Yunnan opened up, there must be a machine industry to serve them; in the Third Plan 200 to 300 million more investment, to make a million machine tools, chiefly key machine tools, so that precision tools reach 30 percent; the Third Front 三线 Construction Committee must watch the layout, with cooperation nets and small satellite plants besides the big main plants; for the Second Automobile Plant: Sichuan''s communications are poor and the plant should be put outside, along the Sichuan–Henan railway.'
      place: chongqing
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1881 (Nov. 16, 1965). The words: 上午 (III, 1881). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Duan Junyi.'
