      c: Deng Xiaoping 邓小平 hears the head of the Northwest Metallurgical Geological Prospecting Company at Lanzhou 兰州. Besides technical revolution in the big coal mines, a set of machinery is to be designed for the 'chicken-coop mines' that produce civilian coal; the coal-mine design institute is to do it; small mines are of low efficiency and coal dear, the people cannot afford coal and burn straw and trees, which hurts grass and trees and the sideline production, a question tied to farming; small mines are to use water power and not depend on the railways; coal saving to be urged hard, honeycomb briquettes to save good coal, boilers rebuilt, 'revolutionized'.
      place: lanzhou
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1900 (Mar. 17, 1966). The words: 上午 (III, 1900). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
