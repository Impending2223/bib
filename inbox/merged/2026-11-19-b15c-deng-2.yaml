      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, on July 15 and 16, inspects at the Daqing 大庆 oilfield No. 1202 drilling team, the well group of Li Tianzhao 李天照, the central No. 3 transfer station and No. 2 water-injection station, the west oil depot, the electric de-waxing wells and the Daqing refinery. At Li Tianzhao''s group he says: raising labor productivity is a great matter, technical progress is endless; Daqing is hard, cold in winter, study time can be gathered in winter, in summer a little newspaper reading, free reading, a lecture when needed; do not fear it is said Daqing has stopped politics and class education: everyone working, is that not politics? no more farmland to be opened, more livestock and tree planting; the oilfield leaders to settle in three years the crowded housing of the workers.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1822 (July 15–16, 1964). The time is the first day''s. Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
