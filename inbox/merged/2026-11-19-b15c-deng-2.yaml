      when: Aug., early
      date: '1969-08'
      at: before 1969-08-01
      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping''s 邓小平 son Deng Pufang 邓朴方, through Wang Dongxing 汪东兴, is moved from the Peking 北京 Jishuitan Hospital 积水潭医院 to the surgical ward of the People''s Liberation Army General Hospital 解放军总医院 for further examination and treatment.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1948 (Aug. 1969). The words: 八月初 (III, 1948). Made public: 2009 (the nianpu). See [[cal.1969.china-leadership-43]]. Names: Deng Xiaoping.'
      src:
