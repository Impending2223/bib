      c: 'Deng Xiaoping 邓小平, before leaving Jinchuan at 5 p.m., exhorts its cadres and workers: at a time when the country is throttled abroad and its economy is at its hardest and most critical point at home, they have produced at the foot of the Qilian Mountains the nickel the country badly needs, bringing glory to the motherland; they are to bear hardship, learn from Daqing, win more and better nickel, and add to support of national defense and strengthened war preparation.'
