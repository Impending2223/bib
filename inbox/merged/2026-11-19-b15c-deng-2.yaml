      - china
      c: Deng Xiaoping 邓小平 begins, at home, to write "My Account" 我的自述.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1943 (June 20, 1968). The words: 在家中开始写 (III, 1943). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
