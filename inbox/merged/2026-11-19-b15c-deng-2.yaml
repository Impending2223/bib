    id: cal.1963-07-07.china-leadership-2
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1763 (July 7, 1963; Deng presides at the delegation''s working meeting on the theme of the next day''s speech at the talks; he receives and reads the Central Committee''s telegram approving the delegation''s line for the speech)'
- cite:
    id: cal.1963-07-08.china-leadership-3
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1763 (July 8, 1963; Deng at the second meeting; speaks nearly five hours, setting out the origin and substance of the Sino-Soviet differences; says that in the past month the CPSU, under the banner of stopping the dispute, has sharpened the open dispute, met the Chinese positive proposals with an arbitrary, unreasoning attitude, and carried the ideological differences into relations between the states)'
    units: C
