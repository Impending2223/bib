      thread: china-leadership
      also:
      - china
      c: 'Deng Xiaoping 邓小平, with Kang Sheng 康生 and Wu Xiuquan 伍修权, in talks with Kim Il Sung 金日成 at Pyongyang 平壤; returns to Peking 北京 May 4. At the second talk, May 3, Deng: this year''s agriculture fairly good; urban workers cut by 18 million, the wage bill by 5 billion; the people''s health much improved, but too many children, hence family planning; the Chinese are weighing Party rectification, trials this year, formal re-registration of members next year; the ''five-antis'' not ended with this round, rectification once every few years, ideology and literature and art also to be set in order.'
      place: pyongyang
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1756–1757 (May 2–4, 1963). The time is the first day''s. Made public: 2009 (the nianpu). Names: Deng Xiaoping, Kang Sheng.'
