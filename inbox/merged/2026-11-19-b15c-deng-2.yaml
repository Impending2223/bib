      c: 'Deng Xiaoping 邓小平, in the talks at Hanoi 河内, says two united fronts are now to be built: one uniting all who can be united in the world, indirect allies such as France and Japan included, against American imperialism; the other against revisionism with Khrushchev 赫鲁晓夫 as its representative.'
      place: hanoi
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1801 (Feb. 26, 1964). The words: 下午 (III, 1801). Made public: 2009 (the nianpu). See [[cal.1964-02.china-leadership-3]]. Names: Deng Xiaoping, Khrushchev.'
