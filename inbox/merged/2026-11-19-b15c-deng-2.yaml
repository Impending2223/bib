      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1772 (Sept. 24, 1963). Made public: 2009 (the nianpu). See [[cal.1963-09-10.china-leadership-7]]. Names: Deng Xiaoping, Peng Zhen.'
