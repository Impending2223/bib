      c: 'Deng Xiaoping 邓小平, with Kang Sheng 康生 and Liu Ningyi 刘宁一, meets Wilcox 威尔科克斯. On Khrushchev''s 赫鲁晓夫 stress on economic mutual aid and the international division of labor, even abolishing frontiers: its aim is control of others and it has done East European states great harm, whose discontent is general; under socialism, without a strong Marxist-Leninist party in the lead, some who hold power would degenerate. At home: the economy is sound after two years of adjustment on the basis of agriculture first; some free markets are open, and the free-market prices of some goods are drawing closer to the planned state prices.'
