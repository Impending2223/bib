      c: 'The President''s office, 6:04 p.m. Johnson with aides over the newspapers'' photographs and accounts of the Baker affair. The opening of Baker''s Carousel Motel at Ocean City, July 22, 1962: Johnson did not go on the bus with the champagne; he drove in and stayed five minutes, with Mrs. Johnson, Thornberry, the Jenkinses, because Baker was "a faithful, diligent, competent employee."'
      n: '[[w.taking-charge]], 104. To check: [Office conversation](https://millercenter.org/the-presidency/secret-white-house-tapes/office-conversation-december-17-1963), [office conversation](https://millercenter.org/the-presidency/secret-white-house-tapes/office-conversation-december-17-1963-0), Tape K6312.09 (Miller Center): neither dated by the hour. Names: Johnson, Baker, Lady Bird Johnson, Thornberry, Jenkins.'
