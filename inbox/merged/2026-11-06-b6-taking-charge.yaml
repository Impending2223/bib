      when: Nov. 22
      date: '1963-11-22'
      thread: elections-1964
      c: 'Fort Worth, the Hotel Texas, Kennedy''s suite, two hours before the assassination: Johnson brings his sister Lucia Alexander and her husband to meet him. Kennedy: "We''re going to carry two states next year if we don''t carry any others—Massachusetts and Texas." By Beschloss''s account, his last words to Johnson.'
      n: '[[w.taking-charge]], 78 (the headnote). Names: Kennedy, Johnson. Check: the hour; the book has two hours before the assassination.'
