      n: '[Johnson and George Reedy, 12:49 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-reedy-march-17-1964), Conversation WH6403-11-2525 (Miller Center); Remarks in New York City at a Dinner of the Friendly Sons of St. Patrick, [1963–64 Pub. Papers 388](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=472) (Mar. 17, 1964) (the speech). [[w.taking-charge]], 288–289. Names: Johnson, Reedy, Stewart Alsop, Robert Kennedy.'
