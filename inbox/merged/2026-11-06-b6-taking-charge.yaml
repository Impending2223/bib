      when: June 26
      date: '1964-06-26'
      thread: elections-1964-johnson
      c: 'Johnson, at the Sheraton-Cadillac in Detroit, to Jenkins by telephone, 5:30 p.m.: Camp David closed to the staff after Bundy''s request for the Fourth, "closed for repairs"; "I''m not going to have it as a campaign issue." Jenkins: Phinney''s word, from a Republican in Dallas, of three stories to be put out quietly: $32,000 from George Parr; Coke Stevenson sent round the country on Box Thirteen; friends'' land bought near the space center at Houston before it was announced. Johnson: "none of it''s true."'
      n: '[Johnson and Walter Jenkins, 5:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-jenkins-june-26-1964), Conversation WH6406-18-3929 (Miller Center); [5:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-jenkins-june-26-1964-0), Conversation WH6406-18-3930 (Miller Center). [[w.taking-charge]], 441–442. Names: Johnson, Jenkins, Bundy.'
