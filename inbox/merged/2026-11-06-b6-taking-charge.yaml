      c: 'Johnson, with Mrs. Johnson, Luci and Lynda, to Nellie Connally by telephone, 1:35 p.m., after the address to Congress: the Governor "doing real well," in "considerable" pain. Her praise of the address; their son John III at the funeral as his father''s representative.'
