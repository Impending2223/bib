      c: 'Johnson, at the Ranch, to Eisenhower at Palm Desert, Cal., by telephone, 1:16 p.m., Christmas: Eisenhower''s help on the first message to Congress. The budget: 133,000 employees added in three years, fewer in fiscal 1965 than in 1964; 5,000 the Post Office asked for cut; the Pentagon under a million civilians. Eisenhower: space "can take a little bit of contraction."'
      n: '[Johnson and Dwight Eisenhower, 1:16 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-december-25-1963), Tape K6312.17 (Miller Center). [[w.taking-charge]], 131–132. See [[cal.1963-12-23.economy]]. Names: Johnson, Eisenhower.'
