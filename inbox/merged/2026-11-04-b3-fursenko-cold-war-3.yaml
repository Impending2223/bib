      thread: soviet-union
      also:
      - middle-east
      c: 'The Presidium. Khrushchev back from Egypt: Nasser ready to help with Aref. Gromyko: Nasser "a serious political
        figure," "unyielding on a number of issues, but he tried to understand our views." Khrushchev: "There is no reason
        we should be against Arab unity"; more weapons to sell the Arabs, or "the Chinese might interfere."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 531. To check: Protocol 145, May 26, 1964, AOK (cited by [[w.fursenko-khrushchevs-cold-war]],
