- add:
    entry:
      id: cal.1964-10-12.soviet-union
      when: Oct. 12
      date: '1964-10-12'
      thread: soviet-union
      also:
      - soviet-union-space
      c: 'Gagra. Khrushchev, with Mikoyan, sees the launch of the world''s first three-man spacecraft. In Moscow Brezhnev
        gathers nearly the whole Presidium, Suslov and Kosygin now with him, and calls Khrushchev back for a meeting next
        day on "a variety of questions": "We can''t decide without you.... We are asking you to come." Khrushchev: "What''s
        the hurry?" That evening word to Palewski, de Gaulle''s envoy, that the lunch is off.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 535–36. Check: the work calls the spacecraft *Vostok 3*. To check: Trevelyan
        to FO, Oct. 16, 1964, FO 371/177665; Hohler, Oct. 21, 1964, FO 371/177665, National Archives (UK); "How They Removed
        Khrushchev," interview with Semichastny, *Argumenti i Facti*, May 1989, 5 (cited by [[w.fursenko-khrushchevs-cold-war]],
        535 n.13, n.14, 536 n.18). See [[cal.1964-10-08.soviet-union]]. Names: Khrushchev, Mikoyan, Brezhnev, Suslov, Kosygin,
        Palewski, de Gaulle.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:brezhnev-leonid
      - name:suslov-mikhail-a
      - name:kosygin-aleksei
      - name:palewski-gaston
      - name:de-gaulle-charles
      src:
        c: 45c44f3b
        rows:
        - 'w.fursenko-khrushchevs-cold-war 535–36: all'
        - 'via x.2006.kcw-p535-36-1964-10-12: all'
- add:
    entry:
      id: cal.1964-10-13.soviet-union
      when: Oct. 13
      date: '1964-10-13'
      thread: soviet-union
      c: 'Pitsunda, 9:30 a.m. Khrushchev with Palewski, briefly: "We can wait. We have patience." At the Moscow airport only
        Semichastny and Georgadze; his guards replaced; in the car Mikoyan urges him to give up the premiership to Kosygin:
        "I am not going to fight." The Presidium, Brezhnev in his place: his unilateral acts; Shelepin: growth down from 11
        to 4 percent, Anadyr "a risky enterprise," "juggl[ed] with people''s fates."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 536–37 (Palewski: "in excellent form"; twenty-five in the room). To check:
        Trevelyan, "The Circumstances of Mr. Khrushchev''s Downfall," Nov. 2, 1964, FO 371/177666; Baudet to Couve de Murville,
        Oct. 16, 1964, *Documents Diplomatiques Français*, 1964, II, no. 136; Protocol (no number), Oct. 13, 1964, AOK (cited
        by [[w.fursenko-khrushchevs-cold-war]], 536 n.19, n.20, 537 n.24). See [[cal.1964-10-12.soviet-union]]. Names: Khrushchev,
        Palewski, Mikoyan, Kosygin, Brezhnev, Shelepin.'
      tags:
      - name:khrushchev-nikita-s
      - name:palewski-gaston
      - name:mikoyan-anastas
      - name:kosygin-aleksei
      - name:brezhnev-leonid
      - name:shelepin-alexandr-n
      src:
        c: 42d5de47
        rows:
        - 'w.fursenko-khrushchevs-cold-war 536–37 (Palewski: "in excellent form"; twenty-five in the room): all'
        - 'via x.2006.kcw-p536-37-palewski-in-excellent-form-twenty-five-in-the-room--1964-10-13: all'
- add:
    entry:
      id: cal.1964-10-14.soviet-union
      when: Oct. 14
      date: '1964-10-14'
      thread: soviet-union
      c: 'The Presidium, the second day. Mikoyan: "In general, I was right"; "sending the submarines verged on adventurism";
        Khrushchev to lose some posts, not his seat. Brezhnev: "Dismiss Comrade Khrushchev from the posts he holds and divide
        them." Khrushchev: the risk in Cuba "inevitable"; "I do not ask for mercy"; "Finally the party has grown and is able
        to control anyone." He asks his own dismissal; his Zil replaced by a Volga.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 537–38. To check: Protocol (no number, continuation), Oct. 14, 1964, AOK (cited
        by [[w.fursenko-khrushchevs-cold-war]], 538 n.26; the note prints 1962); Fursenko''s interviews with veterans of the
        Kremlin guard, Oct. 2005 (cited by [[w.fursenko-khrushchevs-cold-war]], 538 n.28). See [[cal.1964-10-13.soviet-union]].
        Names: Mikoyan, Khrushchev, Brezhnev.'
      tags:
      - name:mikoyan-anastas
      - name:khrushchev-nikita-s
      - name:brezhnev-leonid
      src:
        c: 4ed959ec
        rows:
        - 'w.fursenko-khrushchevs-cold-war 537–38: all'
        - 'via x.2006.kcw-p537-38-1964-10-14: all'
- add:
