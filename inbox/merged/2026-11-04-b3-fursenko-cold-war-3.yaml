      n: '[[w.fursenko-khrushchevs-cold-war]], 456. To check: Ivanov, Spravka-Doklad, Sept. 13, 1962, Volkogonov Collection,
        Library of Congress (cited by [[w.fursenko-khrushchevs-cold-war]], 456 n.52). See [[cal.1962-09-07.missile-crisis-2]].'
      src:
        c: 43b7b491
        rows:
        - 'w.fursenko-khrushchevs-cold-war 456: all'
        - 'via x.2006.kcw-p456: all'
- add:
