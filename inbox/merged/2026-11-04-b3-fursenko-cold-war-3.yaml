      id: cal.1963-04-19.laos-2
      when: Apr. 19
      date: '1963-04-19'
      thread: laos
      also:
      - soviet-union
      c: 'Kennedy with his foreign policy advisers on Laos, taped: how to press Moscow and Hanoi to restrain the Pathet Lao.
        The Pentagon asked for options: the Marines back to Thailand, action against North Vietnam, pressure on Cuba. Harriman,
        going to Moscow, to raise Laos with Khrushchev.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 519. To check: tape 82, President''s Office Files, Presidential Recordings,
        JFK Library (cited by [[w.fursenko-khrushchevs-cold-war]], 519 n.100). See [[cal.1963-04-08.laos]]. Names: Kennedy,
        Harriman, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:harriman-w-averell
      - name:khrushchev-nikita-s
      src:
        c: f777cfe0
