      date: '1963-02-19'
      thread: europe-and-the-alliance-jupiters
      also:
      - soviet-union
      c: 'The KGB to the Foreign Ministry and the GRU: the Turkish government strongly opposes the removal of the Jupiters
        near Izmir.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 515. To check: report, KGB to MFA and GRU, Feb. 19, 1963, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
