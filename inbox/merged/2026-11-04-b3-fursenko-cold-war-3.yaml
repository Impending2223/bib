- add:
    entry:
      id: cal.1962-11-07.soviet-union
      when: Nov. 7
      date: '1962-11-07'
      thread: soviet-union
      c: 'Moscow, the reception the day after the American elections. Khrushchev to Kohler, the new American Ambassador: "we
        may not love each other, but we have to live together and may even have to embrace each other, if the world is to
        survive."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 498 (the elections a source of hope: "All aggressive U.S. candidates have been
        rejected by the wise U.S. electorate," Khrushchev later to a British diplomat). Check: the work cites the Embassy''s
        telegram for the words to the British diplomat and Roberts''s for those to Kohler; the notes may be transposed. To
        check: Roberts to Home, Nov. 19, 1962, PREM 11/3996; Moscow to the Secretary of State, Nov. 13, 1962, NSF, JFK Library
        (cited by [[w.fursenko-khrushchevs-cold-war]], 498 n.26, n.27). Names: Khrushchev, Kohler.'
      tags:
      - name:khrushchev-nikita-s
      - name:kohler-foy-d
      src:
        c: 3bfbc741
        rows:
        - 'w.fursenko-khrushchevs-cold-war 498: all'
        - 'via x.2006.kcw-p498-kohler: all'
- add:
    entry:
      id: cal.1962-11-12.soviet-union
      when: Nov. 12
      date: '1962-11-12'
      thread: soviet-union
      also:
      - testing
      - berlin-and-vienna
      c: 'Khrushchev''s farewell audience for Roberts, the British Ambassador: a comprehensive test ban possible, international
        inspectors to supervise automatic seismic stations on Soviet soil; the current Soviet series about to end, no more
        tests needed. Berlin, a Chinese seat at the UN and a NATO-Warsaw Pact nonaggression treaty "ripe" for settlement.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 504. To check: Roberts to London, Nov. 12, 1962, National Archives (UK) (cited
        by [[w.fursenko-khrushchevs-cold-war]], 504 n.42). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: d5a56e8a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 504: all'
        - 'via x.2006.kcw-p504-roberts: all'
- add:
    entry:
      id: cal.1962-11-13.soviet-union
      when: Nov. 13
      date: '1962-11-13'
      thread: soviet-union
      also:
      - missile-crisis
      - cuba
      c: 'The Presidium: the White House to be told the Il-28s can go within thirty days, two or three months preferred. Khrushchev
        to Mikoyan, of Castro: "because of his youth" he "cannot behave himself properly" and "cannot understand the difficulties."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 501–02. To check: Khrushchev to Mikoyan, extract from Protocol 65, Nov. 13,
        1962, 3-65-909, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 502 n.37). See [[cal.1962-11-10.soviet-union]].
        Names: Khrushchev, Mikoyan, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:castro-fidel
      src:
        c: a4ca6022
        rows:
        - 'w.fursenko-khrushchevs-cold-war 501–02: all'
        - 'via x.2006.kcw-p501-02: all'
- add:
    entry:
      id: cal.1962-11-14.missile-crisis-2
      when: Nov. 14
      date: '1962-11-14'
      thread: missile-crisis
      also:
      - robert-kennedy
      c: '5:45 p.m., the Oval Office, taped. Bundy to Kennedy, of what goes to Moscow through the back channel: "Bobby''s
        notion is there''s only one peace-lover in the [U.S.] government, and he''s entirely surrounded by militarists and
        it''s not a bad image. Well, Bobby''s feeding him that stuff, Mr. President."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 499 (an ExComm meeting, 5:45 to 6:02 p.m., by Coleman''s draft transcript).
        To check: [Informal Meeting on Cuba, 5:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/informal-meeting-cuba),
        Tape 58 (Miller Center); David G. Coleman''s draft transcript (cited by [[w.fursenko-khrushchevs-cold-war]], 499 n.31).
        See [[cal.1962-11-09.missile-crisis]]. Names: Bundy, Kennedy, Robert Kennedy.'
      tags:
      - name:bundy-mcgeorge
      - name:kennedy-john-f
      - name:kennedy-robert-f
      src:
        c: cf65c604
        rows:
        - 'w.fursenko-khrushchevs-cold-war 499: all'
        - 'via x.2006.kcw-p499-bundy: all'
- add:
    entry:
      id: cal.1962-11-15.missile-crisis-2
      when: Nov. 15
      date: '1962-11-15'
      thread: missile-crisis
      also:
      - intelligence
      - press-and-broadcasting
      c: 'Khrushchev reads the KGB''s New York station: Thomas Hamilton of the *New York Times* and a *Herald Tribune* man
        say that at a White House meeting Nov. 12 the "Pentagon chiefs" demanded an unconditional ultimatum, the Il-28s out
        and the sites inspected, or an invasion at once. Nov. 16, Moscow asks the station to confirm it.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 502 (the report inaccurate, by the work). Check: the note dates the report
        Dec. 15, 1962. To check: KGB (New York) to the Center, Delo 90238, SVR (cited by [[w.fursenko-khrushchevs-cold-war]],
        502 n.38). See [[cal.1962-11-13.soviet-union]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 503dde51
        rows:
        - 'w.fursenko-khrushchevs-cold-war 502: all'
        - 'via x.2006.kcw-p502-kgb: all'
- add:
    entry:
      id: cal.1962-11-15.china
      when: Nov. 15
      date: '1962-11-15'
      thread: china
      also:
      - soviet-union
      - cuba
      c: 'The Presidium. Khrushchev on the Chinese: "Of course, the least amount of assistance to Cuba came from the Chinese";
        their embassy''s staff giving blood for Cuba, "What demagogic, cheap assistance!"; Cuba needed "real military and
        political assistance."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 496–97. To check: Protocol 65, Presidium meeting of Nov. 15, 1962, Folio 3,
        List 65, File 911, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 497 n.18). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: ca72b50b
        rows:
        - 'w.fursenko-khrushchevs-cold-war 496–97: all'
        - 'via x.2006.kcw-p496-97: all'
- add:
    entry:
      id: cal.1962-11-16.missile-crisis-2
      when: Nov. 16
      date: '1962-11-16'
      thread: missile-crisis
      also:
      - defense
      - china
      c: '4:05 p.m., the Oval Office, taped. Kennedy with the Joint Chiefs. LeMay on the Il-28s: "The operation is fairly
        simple. ... It would be accomplished in a few minutes": nine bombers in crates at Holguín, thirty-two at San Julián,
        forty-eight planes in the attack. Anderson: "We''re ready to put the screws on at any time." Kennedy on China: "Khrushchev
        is attacked daily for a Munich and appeasement ... there''s a major collision going on here."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 502, 509 (Kennedy''s words to "his foreign policy advisers," by Coleman''s
        draft transcript of 4:05 to 4:55 p.m.). Check: whether Kennedy''s words on China are of this meeting. To check: [Meeting
        with the Joint Chiefs of Staff, 4:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-joint-chiefs-staff),
        Tape 60 (Miller Center). See [[cal.1962-11-16.soviet-union]]. Names: Kennedy, LeMay, Anderson, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:lemay-curtis-e
      - name:anderson-george-w-jr
      - name:khrushchev-nikita-s
      src:
        c: 5a06bb1f
        rows:
        - 'w.fursenko-khrushchevs-cold-war 502, 509: all'
        - 'via x.2006.kcw-p502-509: all'
- add:
    entry:
      id: cal.1962-11-19.cuba
      when: Nov. 19
      date: '1962-11-19'
      thread: cuba
      also:
      - missile-crisis
      c: 'Havana. After a day with his closest advisers, Castro to Mikoyan: Cuba will swallow the loss of the bombers, but
        no independent inspection of the island. Nov. 17 and 18 his gunners had not fired on the low-level flights.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 503. See [[cal.1962-11-16.soviet-union]]. Names: Castro, Mikoyan.'
      tags:
      - name:castro-fidel
      - name:mikoyan-anastas
      src:
        c: 7e139f70
        rows:
        - 'w.fursenko-khrushchevs-cold-war 503: all'
- add:
    entry:
      id: cal.1962-10-30.testing
      when: Oct. 30
      date: '1962-10-30'
      thread: testing
      also:
      - soviet-union
      c: Geneva. Dean, the American negotiator, with Kuznetsov. Kuznetsov leaves with the impression that the Senate would
        accept a treaty with three on-site inspections a year. Kennedy is privately considering eight; Washington's figure,
        twelve.
      n: '[[w.fursenko-khrushchevs-cold-war]], 507 (no American or Russian record of the talk found, 618 n.48). To check:
        editorial note, FRUS 1961–63, VII, 623–25 (cited by [[w.fursenko-khrushchevs-cold-war]], 507 n.48). See [[cal.1962-12-19.testing]].
        Names: Dean, Kuznetsov, Kennedy.'
      tags:
      - name:dean-arthur-h
      - name:kuznetsov-vasily-v
      - name:kennedy-john-f
      src:
        c: 906cc11a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 507: all'
- add:
    entry:
      id: cal.1962-12-03.soviet-union
      when: Dec. 3
      date: '1962-12-03'
      thread: soviet-union
      also:
      - missile-crisis
      - cuba
      c: 'The Presidium, the first session after Mikoyan''s return. Khrushchev''s postmortem: "Cuba has been maintained as
        a center of the revolutionary movement"; "The United States was forced to acknowledge that we have our own interests
        in the Western Hemisphere"; "We are members of the World Club. They themselves got scared." On Kennedy''s request
        for the Soviet troops'' withdrawal, he and Malinovsky to look into it.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 506–07. To check: Protocol 71, Dec. 3, 1962, AOK (cited by [[w.fursenko-khrushchevs-cold-war]],
        506 n.47). See [[cal.1962-11-29.missile-crisis]]. Names: Mikoyan, Khrushchev, Kennedy, Malinovsky.'
      tags:
      - name:mikoyan-anastas
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:malinovsky-rodion-yakovlevich
      src:
        c: 3d627984
        rows:
        - 'w.fursenko-khrushchevs-cold-war 506–07: all'
        - 'via x.2006.kcw-p506-07: all'
- add:
    entry:
      id: cal.1962-12.testing
      when: Dec., early
      date: 1962-12
      thread: testing
      also:
      - soviet-union
      - china
      c: 'Moscow. Cousins, with Pope John XXIII''s message for Khrushchev, hears from his inner circle that Khrushchev means
        to prove to the Chinese that coexistence pays. Khrushchev to him, privately: "The Chinese say I was scared. Of course
        I was scared. It would have been insane not to have been scared." Christmas greetings in his own hand for Kennedy
        and the Pope.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 507–08 (by Cousins''s account). Check: the day. To check: [[w.cousins-improbable-triumvirate]],
        32–33, 46, 57 (cited by [[w.fursenko-khrushchevs-cold-war]], 508 n.50–52). See [[cal.1962-11.testing]]. Names: Cousins,
        Khrushchev, Kennedy.'
      tags:
      - name:cousins-norman
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      src:
        c: f5fcd2b4
        rows:
        - 'w.fursenko-khrushchevs-cold-war 507–08: all'
- add:
    entry:
      id: cal.1962-12-18.testing
      when: Dec. 18–25
      date: '1962-12-18'
      thread: testing
      also:
      - soviet-union
      - defense
      c: Novaya Zemlya. The last Soviet series of atmospheric tests, at the northern test site.
      n: '[[w.fursenko-khrushchevs-cold-war]], 508, 619 n.53 (Khrushchev waits for it to start before his concession on inspections).
        See [[cal.1962-12-19.testing]].'
      src:
        c: f95e60df
        rows:
        - 'w.fursenko-khrushchevs-cold-war 508, 619: all'
- add:
    entry:
      id: cal.1962-10-11.south-asia
      when: Oct. 11
      date: '1962-10-11'
      thread: south-asia
      also:
      - soviet-union
      - china
      c: 'The Presidium: Moscow to back Peking''s territorial claims on the border with India.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 497. To check: Protocol 58, Oct. 11, 1962, AOK (cited by [[w.fursenko-khrushchevs-cold-war]],
        497 n.20).'
      src:
        c: a675d6b9
        rows:
        - 'w.fursenko-khrushchevs-cold-war 497: all'
        - 'via x.2006.kcw-p497-1962-10-11: all'
- add:
    entry:
      id: cal.1962-10-14.soviet-union
      when: Oct. 14
      date: '1962-10-14'
      thread: soviet-union
      also:
      - testing
      - south-asia
      c: 'The Presidium. Khrushchev: new language for a test ban treaty to be prepared. Support for Peking on the Indian border;
        his exchange of letters with Ulbricht on East German farming.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 460, 464, 497. To check: Protocol 59, Oct. 14, 1962, AOK (cited by [[w.fursenko-khrushchevs-cold-war]],
        464 n.74, 497 n.20; and 460 n.63). Names: Khrushchev, Ulbricht.'
      tags:
      - name:khrushchev-nikita-s
      - name:ulbricht-walter
      src:
        c: ed6e3f4f
        rows:
        - 'w.fursenko-khrushchevs-cold-war 460, 464, 497: all'
        - 'via x.2006.kcw-p460-464-497-1962-10-14: all'
- add:
    entry:
      id: cal.1963-01-16.berlin-and-vienna
      when: Jan. 16
      date: '1963-01-16'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'East Berlin, the Socialist Unity Party''s Sixth Congress. Khrushchev: the wall "a most important step"; a peace
        treaty "no longer the problem it was before the protective measures." No new ultimatum; the Western troops under the
        UN flag a hope, not a demand. Of the Soviet-American talks on Berlin, nothing.'
      n: '[FRUS 1961–63, V: Soviet Union, doc. 280](https://history.state.gov/historicaldocuments/frus1961-63v05/d280) (the
        CIA''s weekly review, Jan. 18). [[w.fursenko-khrushchevs-cold-war]], 509–10. Check: Fursenko and Naftali put the speech
        the day after the State of the Union, Jan. 15 (509); the day by the congress''s record. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 675abe70
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v05/d280: A-B, D'
        - 'w.fursenko-khrushchevs-cold-war 509–10: all'
