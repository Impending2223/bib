      when: Oct. 16
      date: '1964-10-16'
      thread: soviet-union
      also:
      - transition-and-staff-nsc
      c: '10:30 a.m., the White House. Johnson with an executive group of the NSC on the change in Moscow: McCone on the causes.
        Rusk, with Thompson: no anxiety to be shown, "American policy is made in Washington not Moscow"; "After all, it was
        Khrushchev who brought on the Berlin crisis and the Cuba missile crisis in 1962. Our approach should be watchful but
        steady."'
      n: '[FRUS 1964–68, XIV: Soviet Union, doc. 53](https://history.state.gov/historicaldocuments/frus1964-68v14/d53). [[w.fursenko-khrushchevs-cold-war]],
        539 (Johnson agrees). See [[cal.1964-10-15.soviet-union]]. Names: Johnson, McCone, Rusk, Thompson, Khrushchev.'
      tags:
      - name:johnson-lyndon-b
      - name:mccone-john-a
