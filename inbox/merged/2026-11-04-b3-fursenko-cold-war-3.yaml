      when: Nov. 1
      date: '1962-11-01'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'Lippmann to Dobrynin, by Dobrynin''s cable: war was hours away when Khrushchev''s message went out by Radio Moscow
        Oct. 28, an air strike, he believes, ordered for Oct. 29 or 30.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 498 (Lippmann mistaken in this, by the work). To check: Dobrynin to Moscow,
        Nov. 1, 1962, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 498 n.28). See [[cal.1962-10-28.missile-crisis]].
        Names: Lippmann, Dobrynin, Khrushchev.'
      tags:
      - name:lippmann-walter
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
