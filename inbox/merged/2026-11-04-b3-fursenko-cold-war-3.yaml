      when: Feb. 27
      date: '1963-02-27'
      thread: soviet-union
      c: 'Kalinin. Khrushchev prepares the Soviet people for a standard of living rising more slowly than promised, the arms
        race largely to blame: "give us time."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 513. To check: "Sir H. Trevelyan''s interview with Khrushchev of March 6,"
