      when: Apr., spring
      date: 1964-04
      thread: soviet-union
      also:
      - intelligence
      c: 'Brezhnev, with Podgorny and Shelepin in the plot to remove Khrushchev, asks Shelepin and Semichastny of the KGB
        to consider killing him, an air accident on a trip abroad, perhaps the Scandinavian one. Dropped: Khrushchev would
        lose a vote in the Central Committee.'
