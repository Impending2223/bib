      c: The *Indigirka* leaves the Soviet Union with the warheads for the Lunas and for the FKR cruise missiles, without
        a submarine escort.
      n: '[[w.fursenko-khrushchevs-cold-war]], 456, 462. To check: Zakharov to Kosygin, Sept. 16, 1962, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        462 n.67). See [[cal.1962-09-07.missile-crisis-2]].'
      src:
