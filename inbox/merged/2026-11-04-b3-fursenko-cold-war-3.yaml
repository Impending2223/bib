      date: '1963-06-09'
      thread: middle-east
      also:
      - soviet-union
      c: 'Moscow. Khrushchev with Marshal Amer''s Egyptian military delegation: "The Ba''athists borrowed their methods from
        Hitler"; "we hoped that the revolution would develop in a progressive way." Amer denies any Egyptian part in the coup
        of February; Nasser has warned Aref, he says, that persecuting Communists will hurt Iraq with the socialist world.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 513, 620 n.76. To check: memcon, Khrushchev and Amer, June 9, 1963, 52-1-561,
        APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 513 n.76). See [[cal.1963-02-08.middle-east]]. Names: Khrushchev,
        Amer, Nasser, Aref.'
      tags:
