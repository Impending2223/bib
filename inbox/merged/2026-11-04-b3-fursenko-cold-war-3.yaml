      when: Jan. 29
      date: '1963-01-29'
      thread: china
      also:
      - soviet-union
      c: 'The Presidium. Khrushchev: "The Chinese are dimwits." Yet a policy of severance only feeds nationalism in the movement,
        "Severance is not the Communist route"; "it is not obligatory to drag them to the cross."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 510, 526. To check: Protocol 80, Jan. 29, 1963, AOK (cited by [[w.fursenko-khrushchevs-cold-war]],
        510 n.61, 526 n.121). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
