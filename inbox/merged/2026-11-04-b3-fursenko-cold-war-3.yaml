      id: cal.1963-03-12.china
      when: Mar. 12
      date: '1963-03-12'
      thread: china
      also:
      - soviet-union
      c: 'The Presidium on the answer to Peking: Khrushchev will not go to China, but would see Mao in Moscow; the Foreign
        Ministry to write it "Not in a polemical form," and to remind Peking, respectfully, that Belgrade is an ally.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 515. To check: Protocol 87, Mar. 12, 1963, AOK (cited by [[w.fursenko-khrushchevs-cold-war]],
        515 n.88). See [[cal.1963-03-09.china]]. Names: Khrushchev, Mao.'
      tags:
      - name:khrushchev-nikita-s
      - name:mao-zedong
      src:
        c: 4f936c83
        rows:
        - 'w.fursenko-khrushchevs-cold-war 515: all'
        - 'via x.2006.kcw-p515-1963-03-12: all'
- add:
