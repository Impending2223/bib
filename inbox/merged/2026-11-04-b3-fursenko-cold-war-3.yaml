      when: Oct. 31
      date: '1962-10-31'
      thread: intelligence
      also:
      - missile-crisis
      - congress
      c: 'The KGB in Washington to the Center, quoting three congressional staff members: relief on the Hill when the expected
        military action did not come.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 498. To check: KGB (Washington) to the Center, Oct. 31, 1962, Delo 90238, vol.
