      date: '1963-04-06'
      thread: europe-and-the-alliance
      also:
      - soviet-union
      - berlin-and-vienna
      c: 'Bonn. Kroll, with Adenauer''s leave, calls on Smirnov, the Soviet Ambassador: against the pro-American lobby in
        the Foreign Office; the Kremlin to make use of the last of the Adenauer era. Adenauer, he says, hints that he should
        go back to Moscow.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 522–23. Check: the day of the call; Smirnov''s report is of Apr. 6. To check:
        Smirnov to MFA, Apr. 6, 1963, 0757 1963, 8/35/5, MFA (cited by [[w.fursenko-khrushchevs-cold-war]], 523 n.110). Names:
        Kroll, Adenauer, Smirnov.'
