        - 'via x.2006.kcw-p496-castro: all'
- add:
    entry:
      id: cal.1962-10-31.china
      when: Oct. 31
      date: '1962-10-31'
      thread: china
      also:
      - missile-crisis
      c: 'Peking changes tack: the front page of the *People''s Daily* assails Khrushchev for yielding to "the United States''
        imperialist attempt to browbeat the people of the world into retreat at the expense of Cuba"; the pledge against invasion
        "nothing but a hoax." In the days after, Castro''s five points endorsed as the only basis for a settlement.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 495–96. To check: Robert Trumbull, "Peking Criticizes Russians on Cuba," New
        York Times, Nov. 1, 1962; "China Press Sees K as Weak Man," Washington Post and Times Herald, Oct. 31, 1962 (cited
        by [[w.fursenko-khrushchevs-cold-war]], 496 n.10). Names: Khrushchev, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-fidel
      src:
        c: bb9eb29f
        rows:
        - 'w.fursenko-khrushchevs-cold-war 495–96: all'
        - 'via x.2006.kcw-p495-96-china: all'
- add:
    entry:
      id: cal.1962-11-03.china
      when: Nov. 3
      date: '1962-11-03'
      thread: china
      also:
      - cuba
      c: Peking. The first of four days of marches on the Cuban Embassy, tens of thousands a day by Reuters' count, three
        hundred thousand by the official one; Zhou Enlai reaffirms support of Cuba.
      n: '[[w.fursenko-khrushchevs-cold-war]], 496. To check: "Chinese Marchers Back Cuba" (Reuters) and "Chou Reaffirms Support
        of Cuba," New York Times, Nov. 4, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]], 496 n.12). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      src:
        c: c642f8e9
        rows:
        - 'w.fursenko-khrushchevs-cold-war 496: all'
        - 'via x.2006.kcw-p496-china: all'
- add:
    entry:
      id: cal.1962-11-06.china
      when: Nov. 6
      date: '1962-11-06'
      thread: china
      also:
      - cuba
      c: 'The *People''s Daily* likens Khrushchev''s course to Munich: "The attempt to play the Munich scheme against the
        Cuban people who have already stood on their own feet is doomed to complete failure."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 496. Check: the day; the *Washington Post* reports it Nov. 6. To check: John
        Roderick, "Chinese Liken Soviet Action on Cuba to Munich Appeasement," Washington Post, Nov. 6, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]],
        496 n.13). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: fe665842
        rows:
        - 'w.fursenko-khrushchevs-cold-war 496: all'
        - 'via x.2006.kcw-p496-china: all'
- add:
    entry:
      id: cal.1962-11-07.china
      when: Nov. 7
      date: '1962-11-07'
      thread: china
      also:
      - soviet-union
      c: Peking, the reception for the October Revolution's anniversary. The Soviet Ambassador toasts Khrushchev; his Chinese
        guests silent.
      n: '[[w.fursenko-khrushchevs-cold-war]], 496. To check: Adam Kellet-Long, "Soviet Envoy''s Praise of Khrushchev Meets
        Silence at Peking Celebration," Washington Post and Times Herald, Nov. 7, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]],
        496 n.14). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 45d666a8
        rows:
        - 'w.fursenko-khrushchevs-cold-war 496: all'
        - 'via x.2006.kcw-p496-china: all'
- add:
    entry:
      id: cal.1962-11-07.soviet-union-2
      when: Nov. 7
      date: '1962-11-07'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'Albania''s radio: Khrushchev''s "contemporary revisionism"; communism cannot prevail over capitalism "by bargaining
        and making concessions to imperialism."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 496. Check: the day; the *Washington Post* reports it Nov. 8. To check: "Soviet
        Policy on Cuba Is Attacked by Albania," Washington Post and Times Herald, Nov. 8, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]],
        496 n.15). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: e378da44
        rows:
        - 'w.fursenko-khrushchevs-cold-war 496: all'
        - 'via x.2006.kcw-p496-soviet-union-2: all'
- add:
    entry:
      id: cal.1962-11-05.south-asia
      when: Nov. 5
      date: '1962-11-05'
      thread: south-asia
      also:
      - soviet-union
      - china
      c: '*Pravda* reverses the Soviet line on the border war, saying nothing of Peking''s claims: "It is necessary to cease
        fire and sit down at the round table of negotiations without setting any terms." The MiG-21s for India to be delivered
        after all, and 1.5 million tons of refined petroleum.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 497. To check: Seymour Topping, "Soviet Indicates a Return to Neutrality on
        India," New York Times, Nov. 6, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]], 497 n.24).'
      src:
        c: 036521a4
        rows:
        - 'w.fursenko-khrushchevs-cold-war 497: all'
        - 'via x.2006.kcw-p497-south-asia: all'
- add:
