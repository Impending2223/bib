- check:
    id: cal.1962-10-22.soviet-union
    text: 'Check: in Fursenko and Naftali''s later account (467–74) the session opens at 10 p.m. Moscow time, all twelve members
      there; Khrushchev dictates leave for Pliyev to use the tactical atomic weapons against a landing; Mikoyan objects, and
      after Kosygin speaks the instruction is revised: "all means except those controlled by Statsenko and Beloborodov," sent
      at 11:55 p.m., Malinovsky asking only that it wait for the speech''s text; Kuznetsov brings the translation at 1:15
      a.m. (by Serov''s notes, RGANI, and Mikoyan''s unpublished memoir, RGASPI, cited by [[w.fursenko-khrushchevs-cold-war]],
      468 n.10, 472 n.26).'
