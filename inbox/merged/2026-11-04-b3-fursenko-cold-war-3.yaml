- add:
    entry:
      id: cal.1963-02-08.testing
      when: Feb. 8
      date: '1963-02-08'
      thread: testing
      c: '4:30 to 5:30 p.m., the Cabinet Room. Kennedy on the test ban with Johnson, Rusk, McNamara, Seaborg, Foster, McCone
        and Bundy: six on-site inspections "the rock-bottom position"; "proceed on the assumption that the USSR will cheat";
        "the whole reason for having a test ban is related to the Chinese situation."'
      n: '[FRUS 1961–63, VII: Arms Control and Disarmament, doc. 262](https://history.state.gov/historicaldocuments/frus1961-63v07/d262)
        (editorial note, by Seaborg''s account). [[w.fursenko-khrushchevs-cold-war]], 510–11 (he doubted he could sell six
        to the Senate, never three, by the tape of Apr. 22). See [[cal.1962-12-19.testing]]. Names: Kennedy, Johnson, Rusk,
        McNamara, Seaborg, Foster, McCone, Bundy.'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:seaborg-glenn-t
      - name:foster-william-c
      - name:mccone-john-a
