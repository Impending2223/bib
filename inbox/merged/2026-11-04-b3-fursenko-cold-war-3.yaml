      date: 1963-05
      thread: europe-and-the-alliance
      also:
      - soviet-union
      c: 'Bonn, a diplomatic reception. Adenauer takes Smirnov aside: he hopes for a broad normalization with Moscow; Brentano
        and Hallstein against an Eastern policy; Kroll''s recall forced, "without the advice of our allies" not possible.
        "The date of my resignation is up to me alone."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 522. Check: the day. To check: Smirnov to MFA, May [29?], 1963, 0757 1963,
        8/35/5, MFA (cited by [[w.fursenko-khrushchevs-cold-war]], 522 n.109). See [[cal.1963-05-17.europe-and-the-alliance]].
        Names: Adenauer, Smirnov, Kroll, Brentano, Hallstein.'
