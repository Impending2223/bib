      when: Feb. 19
      date: '1963-02-19'
      thread: middle-east
      also:
      - soviet-union
      c: The Soviet Red Cross asks the International Red Cross to "use its prestige and authority to stop the blood bath"
        in Iraq; Shostakovich, Ehrenburg and others of the Soviet Peace Committee for an international crusade; students at
        the Patrice Lumumba University march against "Fascism in Iraq."
      n: '[[w.fursenko-khrushchevs-cold-war]], 512. To check: "Soviet Bloc Campaigns against Iraqi Regime," *Washington Post
        and Times Herald*, Feb. 20, 1963 (cited by [[w.fursenko-khrushchevs-cold-war]], 512 n.72). See [[cal.1963-02-08.middle-east]].'
