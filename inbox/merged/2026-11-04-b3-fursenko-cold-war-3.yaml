      date: '1963-07-05'
      thread: china
      also:
      - soviet-union
      c: 'Moscow. The Soviet and Chinese parties'' talks open, Suslov and the International Department against Deng Xiaoping''s
        delegation, to July 20. Deng''s five-hour opening speech: "How can these two countries, which belong to two fundamentally
        different social systems, coexist?"; the Cuban PSP, the Algerian and Iraqi parties misled by Moscow.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 527–28. To check: Westad, "The Sino-Soviet Alliance and the United States,"
        in *Brothers in Arms* (1998), 180, 385–86 (cited by [[w.fursenko-khrushchevs-cold-war]], 527 n.124, 528 n.125). See
