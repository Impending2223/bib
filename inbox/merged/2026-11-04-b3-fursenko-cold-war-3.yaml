      date: '1963-04-06'
      thread: soviet-union
      also:
      - robert-kennedy
      - testing
      c: 'Kennedy with his foreign policy advisers, taped, on the talking paper. Robert Kennedy: "It was as if a person had
        come down from Mars and written this." The President proposes his brother go to Moscow to see Khrushchev; Rusk and
        Bundy against. Harriman to go instead, by the end of the month.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 517. To check: Tape 79-2, meeting, Apr. 6, 1963, President''s Office Files,
        Presidential Recordings, JFK Library (cited by [[w.fursenko-khrushchevs-cold-war]], 516 n.94, 517 n.97). See [[cal.1963-04-03.soviet-union]].
        Names: Kennedy, Robert Kennedy, Khrushchev, Rusk, Bundy, Harriman.'
