      date: '1963-02-23'
      thread: middle-east
      also:
      - soviet-union
      c: Iraq accuses "some socialist states" of trying to provoke the Kurdish tribes in the north to overthrow the regime.
      n: '[[w.fursenko-khrushchevs-cold-war]], 512. To check: "Iraqi Accuses Red Bloc of Plotting Overthrow," *Washington
        Post and Times Herald*, Feb. 24, 1963 (cited by [[w.fursenko-khrushchevs-cold-war]], 512 n.73). See [[cal.1963-02-08.middle-east]].'
