      when: June 13
      date: '1963-06-13'
      thread: soviet-union
      also:
      - berlin-and-vienna
      - europe-and-the-alliance
      c: 'The Presidium, on Adenauer''s approach. Khrushchev: "Let''s change the tactic. We will not get an agreement from
        the Americans." With Bonn, "We really are partners"; "Rapallo is advantageous for both the Federal Republic and the
        Soviet Union." The Foreign Ministry to prepare directives for talks with Adenauer''s men.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 525–26. To check: Protocol [102], June 13, 1963, AOK (cited by [[w.fursenko-khrushchevs-cold-war]],
