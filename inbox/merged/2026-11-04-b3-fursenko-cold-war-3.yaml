      thread: middle-east
      also:
      - soviet-union
      c: Baghdad. Husain Ahmad ar-Radi, first secretary of the Iraqi Communist Party, arrested with two other leaders; a fourth
        killed resisting. Seven thousand held as Communists, about as many killed, by Batatu's estimate.
      n: '[[w.fursenko-khrushchevs-cold-war]], 512. To check: "High Iraqi Red Killed, Others Arrested," *Washington Post and
