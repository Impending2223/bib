      date: '1962-11-05'
      thread: cuba
      also:
      - missile-crisis
      c: 'Castro to Mikoyan: "I want to tell you, Comrade Mikoyan, and in this, what I say reflects the decision of the Cuban
        people: We oppose this inspection." "We have the right to defend our dignity." Moscow to back his five points.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 496. To check: Mikoyan to Khrushchev, Nov. 6, 1962, Folio 3, List 65, File
        908, p. 184, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 496 n.17). See [[cal.1962-11-03.cuba]]. Names: Castro,
        Mikoyan.'
      tags:
      - name:castro-fidel
      - name:mikoyan-anastas
      src:
        c: cfffc0ae
        rows:
