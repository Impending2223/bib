      - press-and-broadcasting
      - soviet-union-space
      c: 'The Kremlin, a Saturday afternoon. Khrushchev''s interview with Roy Thomson, the press baron: of a man on the moon,
        "Quite sincerely I''d say I don''t know ... Let those make haste to get to the moon who lead a bad life on this earth."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 512, 514. To check: unpublished transcript, Roy H. Thomson Archive, Toronto
        (cited by [[w.fursenko-khrushchevs-cold-war]], 513 n.75, 514 n.80). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 4f932ab6
        rows:
        - 'w.fursenko-khrushchevs-cold-war 512, 514: all'
