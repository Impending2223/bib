      date: '1963-04-08'
      thread: laos
      c: Souphanouvong leaves Vientiane for the Pathet Lao's zone, the coalition split, the cease-fire broken earlier in the
        month by a pro-Pathet Lao faction's attack on the government's forces.
      n: '[[w.fursenko-khrushchevs-cold-war]], 519. See [[cal.1963-04-20.laos]]. Names: Souphanouvong.'
      tags:
      - name:souphanouvong
      src:
        c: 7a2a76bf
        rows:
