    text: 'Check: Fursenko and Naftali''s later account (476–80) has the Presidium sit again at 10 a.m., after lunch and in
      the evening, Oct. 23: the ships in the Atlantic to go no farther than the approaches to Cuba; Mikoyan twice overruled
      on the submarines, then Gorshkov''s map, the four to hold two days'' sail from Cuba, an order none of them received;
      the ships with the R-14s told to turn only Oct. 25 (477 n.47).'
