- add:
    entry:
      id: cal.1960-01-08.berlin-and-vienna
      when: Jan. 8
      date: '1960-01-08'
      thread: berlin-and-vienna
      c: 'Moscow. Kroll, the West German Ambassador, to Khrushchev: Bonn could accept a number of concessions, recognition
        of East Germany and the Oder-Neisse line among them, never the loss of West Berlin. "Berlin is our historical capital
        and Bonn is only temporary."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 457–58 (by Khrushchev''s record of 1962 quoting it). To check: memorandum of
        conversation, Khrushchev and Kroll, Jan. 8, 1960, 0757, 7/33/2, MFA (cited by [[w.fursenko-khrushchevs-cold-war]],
        458 n.57). Names: Kroll, Khrushchev.'
      tags:
      - name:kroll-hans-s
      - name:khrushchev-nikita-s
      src:
        c: a39b73c4
        rows:
        - 'w.fursenko-khrushchevs-cold-war 457–58: all'
        - 'via x.2006.kcw-p457-58: all'
- add:
    entry:
      id: cal.1962-09-07.missile-crisis-3
      when: Sept. 7
      date: '1962-09-07'
      thread: missile-crisis
      also:
      - defense
      c: 'Khrushchev''s second decision of the day: the navy to guard more closely the ships carrying the nuclear missiles
        and to strengthen the flotilla for the island; submarines with nuclear-tipped torpedoes to trail the ships with the
        warheads and to stay on station in the Caribbean.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 456. See [[cal.1962-09-07.missile-crisis-2]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 3b076a39
        rows:
        - 'w.fursenko-khrushchevs-cold-war 456: all'
- add:
    entry:
      id: cal.1962-09-11.berlin-and-vienna
      when: Sept. 11
      date: '1962-09-11'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - europe-and-the-alliance
      c: 'Moscow. Khrushchev with Kroll, the West German Ambassador, recalled, a Foreign Ministry official the only other
        there: after the American elections of Nov. 6 a push for a free city of West Berlin, "We have already prepared everything
        for this"; Kennedy "is waiting to be pushed to the brink—agreement or war? Of course, he will not want war; he will
        concede." On Cuba, of his own accord: were the Americans to renounce the call-up and restore normal relations, "Cuba
        would not need to get weapons from us."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 457–59 (Kroll told the American Embassy and the Canadian Ambassador the same
        day, 459). To check: memorandum of conversation, Khrushchev and Kroll, Sept. 11, 1962, 0757, 7/33/2, MFA (cited by
        [[w.fursenko-khrushchevs-cold-war]], 457 n.56, 458 n.59). See [[cal.1962-09-11.missile-crisis]]. Names: Khrushchev,
        Kroll, Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:kroll-hans-s
      - name:kennedy-john-f
      src:
        c: 883387b5
        rows:
        - 'w.fursenko-khrushchevs-cold-war 457–59: all'
        - 'via x.2006.kcw-p457-59: all'
- add:
    entry:
      id: cal.1962-09-13.berlin-and-vienna
      when: Sept. 13
      date: '1962-09-13'
      thread: berlin-and-vienna
      also:
      - intelligence
      c: 'SNIE 11-15-62, "Current Soviet Tactics on Berlin": the Soviets have declared a "pause" and appear to have ruled
        out a separate treaty in the next few months; Khrushchev likely to go on with unilateral moves. "The Soviets have
        recently encouraged rumors that they will raise the Berlin issue this fall at the General Assembly."'
      n: '[FRUS 1961–63, V: Soviet Union, doc. 235](https://history.state.gov/historicaldocuments/frus1961-63v05/d235). [[w.fursenko-khrushchevs-cold-war]],
        460 (the rumors; no confrontation thought more likely than in August). See [[cal.1962-08-01.berlin-and-vienna]]. Names:
        Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 7132d8ab
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v05/d235: all'
        - 'w.fursenko-khrushchevs-cold-war 460: C'
