      id: cal.1963-03-28.soviet-union
      when: Mar. 28
      date: '1963-03-28'
      thread: soviet-union
      also:
      - intelligence
      - europe-and-the-alliance
      c: 'Ormsby-Gore from Washington to the Foreign Office, top secret: a CIA source in Moscow says Khrushchev will resign
        as Chairman of the Council of Ministers on his birthday, Apr. 17, his colleagues finding it awkward that he conduct
        the talks with the Chinese. The British have nothing to add: "We have no certain knowledge of anything that goes on
        inside the Soviet Praesidium."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 516. To check: Ormsby Gore to FO, Mar. 28, 1963; Caccia to de Zulueta, Apr.
        3, 1963; PREM 11/4496, National Archives (UK) (cited by [[w.fursenko-khrushchevs-cold-war]], 516 n.89, n.90). Names:
        Ormsby-Gore, Khrushchev.'
      tags:
      - name:ormsby-gore-david
      - name:khrushchev-nikita-s
      src:
        c: 1780bbdb
        rows:
        - 'w.fursenko-khrushchevs-cold-war 516: all'
        - 'via x.2006.kcw-p516-1963-03-28: all'
