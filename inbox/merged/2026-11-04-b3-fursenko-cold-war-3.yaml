      id: cal.1963-03-26.soviet-union
      when: Mar. 26
      date: '1963-03-26'
      thread: soviet-union
      also:
      - intelligence
      c: 'The Secretary''s Policy Planning meeting on "More on the ''Khrushchev at Bay'' Thesis," an interim paper of a project
        looking to a post-Khrushchev Russia: Moscow, INR and the CIA report what suggests "a quiet but deep crisis is underway
        in the USSR"; Khrushchev "needs badly to score a quick success."'
      n: '[FRUS 1961–63, V: Soviet Union, doc. 309](https://history.state.gov/historicaldocuments/frus1961-63v05/d309). [[w.fursenko-khrushchevs-cold-war]],
        516 (the paper substantially Walt Rostow''s, by the work). Names: Rusk, Khrushchev.'
      tags:
      - name:rusk-dean
      - name:khrushchev-nikita-s
      src:
        c: 6de45bb6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v05/d309: all'
        - 'w.fursenko-khrushchevs-cold-war 516: A'
- add:
    entry:
      id: cal.1963-04-03.soviet-union-2
      when: Apr. 3
      date: '1963-04-03'
      thread: soviet-union
      also:
      - intelligence
      - defense
      c: 'Thompson to Rusk: "I am becoming increasingly concerned that the Soviets may be tempted to shoot down one of our
        many flights along the periphery of the Soviet Union." The flights far more numerous than the situation justifies.'
      n: '[FRUS 1961–63, V: Soviet Union, doc. 313](https://history.state.gov/historicaldocuments/frus1961-63v05/d313). [[w.fursenko-khrushchevs-cold-war]],
        516 (Thompson''s fear that Khrushchev, pressed by the Chinese, might take a harder line). Names: Thompson, Rusk.'
      tags:
      - name:thompson-llewellyn-e
      - name:rusk-dean
      src:
        c: d9c7777f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v05/d313: all'
        - 'w.fursenko-khrushchevs-cold-war 516: A'
