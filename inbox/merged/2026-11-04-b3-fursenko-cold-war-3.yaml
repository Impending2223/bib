- add:
    entry:
      id: cal.1962-09-18.missile-crisis-2
      when: Sept. 18
      date: '1962-09-18'
      thread: missile-crisis
      also:
      - defense
      c: 'Zakharov and Fokin to the Defense Council, "to show to NSK, only": a convoy for Cuba, seven Golf missile submarines
        and four Foxtrots, two cruisers, two cruise-missile ships, two destroyers; most to reach Cuba Nov. 9, the submarines
        to leave the Kola Peninsula Oct. 7, nuclear-armed, the Golfs with a list of targets on the American coast. Khrushchev
        strikes the Golfs and the surface ships: the four Foxtrots only, with nuclear torpedoes.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 461–62 (the military''s report to the Presidium: fifty American reconnaissance
        flights over fifteen Soviet ships in the first twelve days of September, 461). Check: the day of Khrushchev''s decision;
        the work gives "mid-September." To check: Zakharov and Fokin to the Defense Council, Sept. 18, 1962; to the commander
        of the Soviet Forces in Cuba, Sept. 8, 1962; Volkogonov Collection, Library of Congress (cited by [[w.fursenko-khrushchevs-cold-war]],
        461 n.65, n.66). See [[cal.1962-09-07.missile-crisis-3]]. Names: Zakharov, Khrushchev.'
      tags:
      - name:zakharov-matvei-vasileevich
      - name:khrushchev-nikita-s
      src:
        c: 1024cf69
        rows:
        - 'w.fursenko-khrushchevs-cold-war 461–62: all'
        - 'via x.2006.kcw-p461-62: all'
- add:
    entry:
      id: cal.1962-09-25.missile-crisis
      when: Sept. 25
      date: '1962-09-25'
      thread: missile-crisis
      also:
      - defense
      c: 'Zakharov and Fokin to Khrushchev: the Zulu-class B-75, on patrol off the American coast with its two nuclear missiles,
        to meet the *Indigirka* near Bermuda.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 462. To check: Zakharov and Fokin to Khrushchev, Sept. 25, 1962, Volkogonov
        Collection, Library of Congress (cited by [[w.fursenko-khrushchevs-cold-war]], 462 n.68). See [[cal.1962-09-16.missile-crisis]].
        Names: Zakharov, Khrushchev.'
      tags:
      - name:zakharov-matvei-vasileevich
      - name:khrushchev-nikita-s
      src:
        c: 45932a59
        rows:
        - 'w.fursenko-khrushchevs-cold-war 462: all'
        - 'via x.2006.kcw-p462-b75: all'
- add:
    entry:
      id: cal.1962-09-18.berlin-and-vienna
      when: Sept. 18
      date: '1962-09-18'
      thread: berlin-and-vienna
      c: 'Burris, the Vice President''s military aide, to Johnson, "Khrushchev Moves Towards Berlin Showdown": Khrushchev
        "stated quite emphatically to Kroll just before he left Moscow" that steps toward a separate treaty will begin soon;
        Western leaders, he has concluded, "so anxious to avoid conflict" they will accept it. "Our diplomats and certain
        political appointees seem unable or unwilling to accept the fact that it is impossible to negotiate politely with
        the Soviets on an issue like Berlin."'
      n: '[FRUS 1961–63, XV: Berlin Crisis, 1962–1963, doc. 119](https://history.state.gov/historicaldocuments/frus1961-63v15/d119).
        [[w.fursenko-khrushchevs-cold-war]], 459–60 (the report of Kroll''s words at State Sept. 14, at the White House within
        four days). See [[cal.1962-09-11.berlin-and-vienna]]. Names: Johnson, Khrushchev, Kroll.'
      tags:
      - name:johnson-lyndon-b
      - name:khrushchev-nikita-s
      - name:kroll-hans-s
      src:
        c: 6b5498c5
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d119: all'
        - 'w.fursenko-khrushchevs-cold-war 459–60: all'
- add:
    entry:
      id: cal.1962-09-28.berlin-and-vienna
      when: Sept. 28
      date: '1962-09-28'
      thread: berlin-and-vienna
      also:
      - europe-and-the-alliance
      c: 'Kroll goes public. "Endkampf um Berlin in 4 Wochen," the *Deutsche Soldaten-Zeitung und National-Zeitung*: a "dramatic
        development" after the American elections, a separate treaty with East Germany and Western access to West Berlin ended
        at once; his source his talk with Khrushchev.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 460. To check: *Deutsche Soldaten-Zeitung und National-Zeitung*, Sept. 28,
        1962 (cited by [[w.fursenko-khrushchevs-cold-war]], 460 n.62). See [[cal.1962-09-11.berlin-and-vienna]]. Names: Kroll,
        Khrushchev.'
      tags:
      - name:kroll-hans-s
      - name:khrushchev-nikita-s
      src:
        c: 992833a6
        rows:
        - 'w.fursenko-khrushchevs-cold-war 460: all'
        - 'via x.2006.kcw-p460-kroll: all'
- add:
    entry:
      id: cal.1962-09-28.laos
      when: Sept. 28
      date: '1962-09-28'
      thread: laos
      also:
      - soviet-union
      c: 'Moscow. Kosygin with Souphanouvong, Khrushchev touring Central Asia: "We are in for more battles with the American
        imperialist in the diplomatic arena. It will involve, in particular, the Berlin question, Cuba and other issues."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 460. To check: memorandum of conversation, Kosygin and Souphanouvong, Sept.
        28, 1962, 0570, 8/7/3, MFA (cited by [[w.fursenko-khrushchevs-cold-war]], 460 n.64). Names: Kosygin, Souphanouvong,
        Khrushchev.'
      tags:
      - name:kosygin-aleksei
      - name:souphanouvong
      - name:khrushchev-nikita-s
      src:
        c: 410cacbe
        rows:
        - 'w.fursenko-khrushchevs-cold-war 460: all'
        - 'via x.2006.kcw-p460-kosygin: all'
- add:
    entry:
      id: cal.1962-09-28.testing
      when: Sept. 28
      date: '1962-09-28'
      thread: testing
      also:
      - soviet-union
      - berlin-and-vienna
      c: 'Khrushchev to Kennedy: a treaty banning tests in the atmosphere, outer space and under water, without inspection
        on Soviet soil, and a moratorium on underground tests while talks go on, "for instance, on a 5-year term." Berlin
        among the "hot-beds of international tension"; nothing on West Berlin until after the American elections, the talks
        to go on in the second half of November; "personal contacts of statesmen on the highest level."'
      n: '[FRUS 1961–63, VI: Kennedy-Khrushchev Exchanges, doc. 56](https://history.state.gov/historicaldocuments/frus1961-63v06/d56).
        [[w.fursenko-khrushchevs-cold-war]], 462. Names: Khrushchev, Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      src:
        c: '19189852'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v06/d56: all'
        - 'w.fursenko-khrushchevs-cold-war 462: all'
- add:
    entry:
      id: cal.1962-10-08.soviet-union
      when: Oct. 8
      date: '1962-10-08'
      thread: soviet-union
      also:
      - missile-crisis
      - robert-kennedy
      c: 'Bolshakov with Robert Kennedy, by Bolshakov''s report to Dobrynin: Kennedy "in an unusually gloomy mood"; "the Soviet
        Union''s most recent steps regarding Cuba have angered the president"; no withdrawal of the Western troops from West
        Berlin, no five-year moratorium on underground tests. Bolshakov: Khrushchev not to come to the General Assembly before
        the elections, perhaps after.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 462–63. Check: the calendar has Bolshakov with Robert Kennedy Oct. 4 and 6
        ([[cal.1962-10-04.soviet-union]]); Fursenko and Naftali date this meeting Oct. 8, by Dobrynin''s report of Oct. 9.
        To check: Dobrynin to Khrushchev, Oct. 9, 1962, Volkogonov Collection, Library of Congress (cited by [[w.fursenko-khrushchevs-cold-war]],
        462 n.72). Names: Bolshakov, Robert Kennedy, Dobrynin, Khrushchev.'
      tags:
      - name:bolshakov-georgi
      - name:kennedy-robert-f
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
      src:
        c: 268aece3
        rows:
        - 'w.fursenko-khrushchevs-cold-war 462–63: all'
        - 'via x.2006.kcw-p462-63: all'
- add:
    entry:
      id: cal.1962-10-09.berlin-and-vienna
      when: Oct. 9
      date: '1962-10-09'
      thread: berlin-and-vienna
      also:
      - europe-and-the-alliance-france
      c: 'Kennedy with Couve de Murville, 4 p.m., Rusk and Bohlen present, on Berlin. Couve: the question "how much risk they
        were prepared to take"; "not unlikely that Khrushchev would come to New York under cover of the General Assembly in
        order to talk over Berlin with the President." Kennedy: "as a result of the Soviet actions on Cuba, there was much
        less prospect of reaching agreement on Berlin. Thus Khrushchev might try to force something."'
      n: '[FRUS 1961–63, XV: Berlin Crisis, 1962–1963, doc. 130](https://history.state.gov/historicaldocuments/frus1961-63v15/d130).
        [[w.fursenko-khrushchevs-cold-war]], 463–64 (Kennedy''s words). Check: Fursenko and Naftali give Couve''s two remarks
        to Kennedy (463); the American memorandum gives them to the Foreign Minister. To check: *Documents Diplomatiques Français*,
        1962, II, 283–86 (cited by [[w.fursenko-khrushchevs-cold-war]], 464 n.73). Names: Kennedy, Couve de Murville, Rusk,
        Bohlen, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:couve-de-murville-maurice
      - name:rusk-dean
      - name:bohlen-charles-e
      - name:khrushchev-nikita-s
      src:
        c: a995d4c8
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d130: all'
        - 'w.fursenko-khrushchevs-cold-war 463–64: D'
- add:
    entry:
      id: cal.1962-10-18.missile-crisis-6
      when: Oct. 18
      date: '1962-10-18'
      thread: missile-crisis
      c: Kennedy has Sorensen begin a letter to Khrushchev offering negotiations. Neither finds a way to open talks without
        seeming weak.
      n: '[[w.fursenko-khrushchevs-cold-war]], 466. To check: [[w.presidential-recordings]], II, 512–72 (cited by [[w.fursenko-khrushchevs-cold-war]],
        466 n.2). Reply: none sent; see [[cal.1962-10-20.missile-crisis-2]]. Names: Kennedy, Sorensen, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      - name:khrushchev-nikita-s
      src:
        c: d02ce3ec
        rows:
        - 'w.fursenko-khrushchevs-cold-war 466: all'
- add:
    entry:
      id: cal.1962-10-22.intelligence
      when: Oct. 22
      date: '1962-10-22'
      thread: intelligence
      also:
      - missile-crisis
      - soviet-union
      c: 'Washington, the morning. The KGB and GRU stations report unusual activity at the White House and the Pentagon. Chizhov,
        the GRU''s resident: "The press emphasizes that the reasons for this official activity remain top secret. It is assumed
        that this has to do with the possibility of new measures regarding Cuba or Berlin."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 467. To check: Chizhov to Center, Oct. 22, 1962, GRU; the GRU''s summary of
        its reports through Oct. 22 (prepared 1994) (cited by [[w.fursenko-khrushchevs-cold-war]], 467 n.4, n.5, n.6). See
        [[cal.1962-10-16.missile-crisis]].'
      src:
        c: 189c0ebf
        rows:
        - 'w.fursenko-khrushchevs-cold-war 467: all'
        - 'via x.2006.kcw-p467-gru: all'
- add:
    entry:
      id: cal.1962-10-22.intelligence-2
      when: Oct. 22
      date: '1962-10-22'
      thread: intelligence
      also:
      - missile-crisis
      - soviet-union
      c: Moscow, just before the Presidium meets. The KGB arrests Penkovsky of the GRU, the CIA's and MI6's agent.
      n: '[[w.fursenko-khrushchevs-cold-war]], 476 (the next day he signs a letter promising full cooperation, and offers
        to work against the Western services). To check: interrogations of Oleg Penkovsky, Central Archive, FSB (cited by
        [[w.fursenko-khrushchevs-cold-war]], 476 n.43). See [[cal.1961-06-25.intelligence]].'
      src:
        c: 392d0579
        rows:
        - 'w.fursenko-khrushchevs-cold-war 476: all'
        - 'via x.2006.kcw-p476-penkovsky: all'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-12
      when: Oct. 22–23
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - intelligence
      c: 11:15 p.m., less than four hours after the address. The NSA hears an alert to the Soviet ships at sea, under Moscow's
        call sign, not Odessa's; at 12:05 a.m., Oct. 23, the instruction itself, to seven ships first, its cipher unbroken.
        Within two hours the ships answer, one by one.
      n: '[[w.fursenko-khrushchevs-cold-war]], 475–76 (by information from the NSA; 2:30 a.m., Oct. 24, another urgent message
        from Odessa to all ships, and word that Moscow would send the rest, 481). See [[cal.1962-10-22.missile-crisis]].'
      src:
        c: 393c10c3
        rows:
        - 'w.fursenko-khrushchevs-cold-war 475–76: all'
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-10
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      also:
      - defense
      c: 'Late in the day. Foxtrot C-19 surfaces for the news; Shumkov, its captain, tells the crew of the blockade: "in our
        path stood an American fleet ... we were going to continue to carry out our mission." None of the four submarines
        gets an order to turn.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 480 (Shumkov: "we couldn''t use our weapons independently"; twenty-two torpedoes,
        one nuclear). To check: transcripts, interviews with Nikolai Shumkov and "Albert" Chebrasov, BBC Scotland (cited by
        [[w.fursenko-khrushchevs-cold-war]], 480 n.53, n.54). See [[cal.1962-10-23.soviet-union]].'
      src:
        c: 3f333be8
        rows:
        - 'w.fursenko-khrushchevs-cold-war 480: all'
        - 'via x.2006.kcw-p480-c19: all'
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-11
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      also:
      - defense
      c: The American Embassy in Moscow delivers the Defense Department's procedures for identifying submarines that try to
        pass the quarantine.
      n: '[[w.fursenko-khrushchevs-cold-war]], 480–81. To check: [[w.presidential-recordings]], III, 192 (U. Alexis Johnson
        at the ExComm, Oct. 24) (cited by [[w.fursenko-khrushchevs-cold-war]], 481 n.56). See [[cal.1962-10-23.missile-crisis]].'
      src:
        c: f035098b
        rows:
        - 'w.fursenko-khrushchevs-cold-war 480–81: all'
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-5
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis
      also:
      - defense
      c: About 10 p.m. C-19, its batteries low, surfaces to recharge; two or three hours, then four American antisubmarine
        ships close in. Shumkov dives; a destroyer passes over the conning tower; three grenades dropped. "I thought they
        were bombing us." A leak, repaired.
      n: '[[w.fursenko-khrushchevs-cold-war]], 486–87 (a try on Oct. 25 given up on sighting an American ship). To check:
        transcript, interview with Nikolai Shumkov, BBC Scotland (cited by [[w.fursenko-khrushchevs-cold-war]], 487 n.79).
        See [[cal.1962-10-23.missile-crisis-10]].'
      src:
        c: afbb2904
        rows:
        - 'w.fursenko-khrushchevs-cold-war 486–87: all'
        - 'via x.2006.kcw-p487-c19: all'
- add:
    entry:
      id: cal.1962-10-26.soviet-union
      when: Oct. 26
      date: '1962-10-26'
      thread: soviet-union
      also:
      - missile-crisis
      - intelligence
      c: 'Moscow, early. Reports that the Americans are readying an attack for Oct. 27: Warren Rogers of the *Herald Tribune*,
        in the Pentagon''s pool for an invasion, overheard with his editor, Robert Donovan, at the National Press Club bar
        the night before by an émigré bartender; Heffernan of Reuters and a KGB source, "Garn," the same; Dorticós''s fears
        to the GRU. Khrushchev decides to seek his diplomatic way out.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 486. To check: Markov to Serov, Oct. 26, 1962, GRU; Feklisov to Center, Oct.
        25, 1962, SVR; Murov to Serov, Oct. 24, 1962, GRU (cited by [[w.fursenko-khrushchevs-cold-war]], 486 n.75, n.76).
        See [[cal.1962-10-25.soviet-union]]. Names: Dorticós, Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - name:dorticos-torrado-osvaldo
      src:
        c: a4806666
        rows:
        - 'w.fursenko-khrushchevs-cold-war 486: all'
        - 'via x.2006.kcw-p486-reports: all'
- add:
    entry:
      id: cal.1962-10-25.press-and-broadcasting
      when: Oct. 25
      date: '1962-10-25'
      thread: press-and-broadcasting
      also:
      - missile-crisis
      - europe-and-the-alliance-jupiters
      c: 'Lippmann''s column: the Soviet base in Cuba and the American Jupiters in Turkey, both to be dismantled. Khrushchev
        has it late Oct. 26 or early Oct. 27.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 487–88 (Mikoyan later told the Cubans the column had been Khrushchev''s inspiration,
        488 n.81). To check: Mikoyan, memorandum of conversation, Nov. 4, 1962, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        488 n.81). See [[cal.1962-10-27.missile-crisis-2]]. Names: Lippmann, Khrushchev.'
      tags:
      - name:lippmann-walter
      - name:khrushchev-nikita-s
      src:
        c: e1d8114e
        rows:
        - 'w.fursenko-khrushchevs-cold-war 487–88: all'
        - 'via x.2006.kcw-p488-lippmann: B'
- add:
    entry:
      id: cal.1962-10-26.cuba
      when: Oct. 26–27
      date: '1962-10-26'
      thread: cuba
      also:
      - missile-crisis
      c: 'Havana, overnight. Castro dictates a letter to Khrushchev at Alekseyev''s: "if they actually carry out the brutal
        act of invading Cuba, that would be the moment to eliminate such danger forever through an act of legitimate defense,
        however harsh and terrible the solution would be."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 490. To check: [[w.fursenko-one-hell-of-a]], 272 (cited by [[w.fursenko-khrushchevs-cold-war]],
        490 n.85). See [[cal.1962-10-27.soviet-union]]. Names: Castro, Khrushchev.'
      tags:
      - name:castro-fidel
      - name:khrushchev-nikita-s
      src:
        c: 0e46ce5a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 490: all'
- add:
    entry:
      id: cal.1962-10-27.berlin-and-vienna
      when: Oct. 27
      date: '1962-10-27'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: Moscow. Khrushchev and several of the Presidium with a large East German delegation under Ulbricht, at Ulbricht's
        request. What was said is not known; Ulbricht leaves satisfied.
      n: '[[w.fursenko-khrushchevs-cold-war]], 491 (Oct. 23, the Kremlin on a report of East Germany''s economy, Ulbricht
        again wanting gold and hard currency). Check: the day; the work has Ulbricht ask to be received Oct. 27. To check:
        Ulbricht to Khrushchev, Oct. 1962, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 491 n.88). Names: Khrushchev,
        Ulbricht.'
      tags:
      - name:khrushchev-nikita-s
      - name:ulbricht-walter
      src:
        c: 778dd741
        rows:
        - 'w.fursenko-khrushchevs-cold-war 491: all'
        - 'via x.2006.kcw-p491-ulbricht: all'
- add:
    entry:
      id: cal.1962-10-28.soviet-union
      when: Oct. 28
      date: '1962-10-28'
      thread: soviet-union
      also:
      - missile-crisis
      c: About noon, Khrushchev's dacha outside Moscow, the whole Presidium and his advisers. He dictates his letter accepting
        the first terms before word of Robert Kennedy's talk with Dobrynin reaches the room; delighted at it, he leaves the
        letter as it is, the Jupiters secret. The Red Cross for the inspection; the letter to go by radio.
      n: '[[w.fursenko-khrushchevs-cold-war]], 489–91 (from Malin''s notes; the report of a SAM fired without leave, Castro''s
        letter). Check: Fursenko and Naftali number the protocol 64 here (616 n.86), 63 in [[w.fursenko-one-hell-of-a]]. To
        check: Malin''s notes, Oct. 28, 1962, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 490 n.86). See [[cal.1962-10-27.missile-crisis]].
        Names: Khrushchev, Robert Kennedy, Dobrynin.'
      tags:
      - name:khrushchev-nikita-s
      - name:kennedy-robert-f
      - name:dobrynin-anatoly
      src:
        c: d3de028a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 489–91: all'
        - 'via x.2006.kcw-p489-91: all'
- add:
    entry:
      id: cal.1962-10-29.cuba
      when: Oct. 29
      date: '1962-10-29'
      thread: cuba
      also:
      - missile-crisis
      - soviet-union
      c: 'Alekseyev to Moscow, after seeing Castro on the 28th: never so depressed and irritated; Castro takes the withdrawal
        for a first step to abandoning Cuba; the offer of inspection, made without asking Havana, the worst of it.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 494. To check: Alekseyev to Moscow, Oct. 29, 1962, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        494 n.3). See [[cal.1962-10-28.missile-crisis]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 4cfbc1c9
        rows:
        - 'w.fursenko-khrushchevs-cold-war 494: all'
        - 'via x.2006.kcw-p494-alekseyev: all'
- add:
    entry:
      id: cal.1962-10-29.cuba-2
      when: Oct. 29
      date: '1962-10-29'
      thread: cuba
      also:
      - intelligence
      c: 'The KGB in Havana to the Center: Castro''s talk with his military leaders; Piñeiro, chief of Cuban intelligence,
        on the Soviet decision.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 494 (the anger reaching the army and the security services; Cuban officials,
        without exception, call the Soviets naive to take any deal from Kennedy). To check: KGB (Havana) to Center, Oct. 29,
        1962, SVR (cited by [[w.fursenko-khrushchevs-cold-war]], 494 n.5). See [[cal.1962-10-29.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: a328affe
        rows:
        - 'w.fursenko-khrushchevs-cold-war 494: all'
        - 'via x.2006.kcw-p494-kgb: all'
- add:
    entry:
      id: cal.1962-11-01.cuba
      when: Nov. 1
      date: '1962-11-01'
      thread: cuba
      also:
      - intelligence
      c: 'The KGB in Havana to the Center: dissatisfaction with the Soviets in the Ministry of the Interior, other ministries
        and the armed forces.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 494. To check: KGB (Havana) to Center, Nov. 1, 1962, SVR (cited by [[w.fursenko-khrushchevs-cold-war]],
        494 n.5). See [[cal.1962-10-29.cuba-2]].'
      src:
        c: acedea4c
        rows:
        - 'w.fursenko-khrushchevs-cold-war 494: all'
        - 'via x.2006.kcw-p494-kgb: all'
- add:
    entry:
      id: cal.1962-10-31.cuba
      when: Oct. 31
      date: '1962-10-31'
      thread: cuba
      also:
      - missile-crisis
      c: 'Castro to Alekseyev: "it is not that some Cubans cannot understand the Soviet decision to dismantle the missiles,
        but all Cubans."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 494. To check: Alekseyev to Moscow, Oct. 31, 1962, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        494 n.4). See [[cal.1962-10-29.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 06ade6e9
        rows:
        - 'w.fursenko-khrushchevs-cold-war 494: all'
        - 'via x.2006.kcw-p494-castro: all'
- add:
    entry:
      id: cal.1962-11-03.cuba
      when: Nov. 3
      date: '1962-11-03'
      thread: cuba
      also:
      - missile-crisis
      - soviet-union
      c: 'Havana. Mikoyan''s first meeting with Castro: "What we are speaking of is not a broad inspection, but a verification
        of the sites known to the Americans due to aerial photography and which have been the locations of the strategic missile
        launchers." No permanent or general inspection.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 496. Check: the work dates the first meeting Nov. 3, the memorandum Nov. 4.
        To check: memorandum of conversation, Nov. 4, 1962, *CWIHP Bulletin*, no. 5 (Spring 1995) (cited by [[w.fursenko-khrushchevs-cold-war]],
        496 n.16). See [[cal.1962-11-02.missile-crisis]]. Names: Mikoyan, Castro.'
      tags:
      - name:mikoyan-anastas
      - name:castro-fidel
      src:
