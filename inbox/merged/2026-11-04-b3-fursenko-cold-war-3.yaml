- add:
    entry:
      id: cal.1963-04-12.testing
      when: Apr. 12
      date: '1963-04-12'
      thread: testing
      also:
      - soviet-union
      c: 'Pitsunda. Khrushchev with Cousins, Kennedy''s message in hand, after a night in Moscow: "Whenever I have a big egg
        to hatch, this is where I come." No more concessions on a test ban: "We held out our hand, it was not accepted"; "Take
        my word for it, I went as far as I could go; this is the end of the line for me." He will have something to say at
        the plenum in mid-May.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 517–18 (by Cousins''s report to Kennedy on tape; Cousins left Apr. 10; Khrushchev
        home Apr. 20, 520). To check: [[w.cousins-improbable-triumvirate]], 79 (cited by [[w.fursenko-khrushchevs-cold-war]],
        517 n.98); tape 82, President''s Office Files, Presidential Recordings, JFK Library (cited by [[w.fursenko-khrushchevs-cold-war]],
        518 n.99). See [[cal.1963-04.testing]]. Names: Khrushchev, Cousins, Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:cousins-norman
      - name:kennedy-john-f
      src:
        c: 3224fca2
        rows:
        - 'w.fursenko-khrushchevs-cold-war 517–18: all'
        - 'via x.2006.kcw-p517-18-1963-04-12: all'
