- add:
    entry:
      id: cal.1964-05.soviet-union
      when: May, late
      date: 1964-05
      thread: soviet-union
      c: 'Just after Khrushchev''s return from Egypt. Galyukov, of Ignatov''s bodyguard, tells Sergei Khrushchev that Ignatov
        is lining up support for his father''s removal: Shelepin, Brezhnev, Podgorny in it, the move set for October, before
        the November plenum. Khrushchev: "Brezhnev, Shelepin, Podgorny—such different people.... Unbelievable!" He asks Mikoyan
        to see Galyukov; confronts Podgorny, who denies it.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 534. Check: the month. To check: Sergei Khrushchev, *Khrushchev on Khrushchev*
        (1990), 725–26 (cited by [[w.fursenko-khrushchevs-cold-war]], 534 n.11, n.12). See [[cal.1964-04.soviet-union]]. Names:
        Khrushchev, Shelepin, Brezhnev, Podgorny, Mikoyan.'
