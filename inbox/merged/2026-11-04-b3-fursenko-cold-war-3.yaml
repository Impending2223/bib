      when: May
      date: 1964-05
      thread: middle-east
      also:
      - soviet-union
      c: 'Egypt. Khrushchev at the ceremony for the Aswan Dam, seated beside Aref of Iraq. In private, the Soviet delegation
        to the Egyptians on Nasser''s persecution of Egypt''s Communists: "How is it possible to pursue a policy of anticommunism
        in a country that is building socialism?"'
      n: '[[w.fursenko-khrushchevs-cold-war]], 531. Check: the days. Names: Khrushchev, Aref, Nasser.'
