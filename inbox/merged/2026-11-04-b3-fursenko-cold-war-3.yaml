      when: Dec. 23
      date: '1963-12-23'
      thread: soviet-union
      c: 'The Presidium on the schools. Khrushchev for eight years of schooling, then work: "Those who support the idea of
        an eleven-year education system support a politically wrong trend." Mikoyan for more scientists. The argument runs
        to July.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 532. To check: Protocol 126, Dec. 23, 1963, AOK (cited by [[w.fursenko-khrushchevs-cold-war]],
