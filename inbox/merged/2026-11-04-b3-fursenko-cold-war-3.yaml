      c: '2:30 p.m., Moscow. Gromyko calls in Kohler with two oral statements for the President and the Secretary: a proposal
        to go on with the Soviet-American talks on a German peace settlement, and a protest at the embargo on large-diameter
        pipe. Not for the press.'
