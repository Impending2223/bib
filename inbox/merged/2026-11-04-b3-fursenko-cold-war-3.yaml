      when: Mar. 9
      date: '1963-03-09'
      thread: china
      also:
      - soviet-union
      c: 'Peking answers Khrushchev''s olive branch: a letter suggesting he visit, his first in four years; another Russian
        may come, or a Chinese go to Moscow; the rebuke to "Yugoslav revisionism" insisted on.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 515. To check: Seymour Topping, *New York Times*, Mar. 14, 1963 (cited by [[w.fursenko-khrushchevs-cold-war]],
        515 n.87). See [[cal.1963-01-29.china]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
