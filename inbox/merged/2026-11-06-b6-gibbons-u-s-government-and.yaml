- add:
    entry:
      id: cal.1966-01-18.vietnam-air-war
      when: Jan. 18
      date: '1966-01-18'
      thread: vietnam-air-war
      also:
      - vietnam-barrier
      c: 'McNaughton''s paper for McNamara, "Some Observations about Bombing North Vietnam": despite interdiction, the North
        can infiltrate 4,500 men a month and 50 to 300 tons of supplies a day, against needs of 20 tons a day for the 1964
        level of activity, 80 for "light combat." Heavier bombing might cut supplies to 50 tons a day ("without convincing
        back-up"), some 90 short of the 140 needed by 155 battalions at year''s end. So: expand the bombing as the military
        propose, POL and power plants among it; mine the ports; consider barriers across Vietnam and Laos south of the 17th
        parallel and to Cambodia.'
      n: '[[w.gibbons-u-s-government-and]], IV, 148–49 & n.104 (the second draft). To check: McNaughton, "Some Observations
        about Bombing North Vietnam," Jan. 18, 1966, 2nd draft, McNaughton Files, Warnke Papers, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 149 n.104); [[w.pentagon-papers]], IV, 48 (cited by [[w.gibbons-u-s-government-and]], IV, 149 n.105). Names: McNaughton,
        McNamara.'
      src:
        c: 949e3e1b
        rows:
        - 'w.gibbons-u-s-government-and IV, 148–49: all'
        - 'via x.1966-01-18.mcnaughton-some-observations-about-bombing: all'
      tags:
      - name:mcnaughton-john-t
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-10-09.vietnam-pacification
      when: Oct. 9
      date: '1966-10-09'
      thread: vietnam-pacification
      c: 'Lodge, not sent McNamara''s memorandum but aware of its proposal to put pacification under the military, drafts
        a statement against it, not sent: rhetorical questions on the military''s "wholesale" personnel, its reliance on statistics,
        its "telling and ordering" and not persuading. "Would it not tend to encourage military government in the GVN, slow
        up its move toward democracy?"'
      n: '[[w.gibbons-u-s-government-and]], IV, 470 & n.104. To check: Lodge, draft of Oct. 9, 1966, Lodge Papers, Massachusetts
        Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 470 n.104). Names: Lodge, McNamara.'
      src:
        c: a5572c54
        rows:
        - 'w.gibbons-u-s-government-and IV, 470: all'
        - 'via x.1966-10-09.lodge-draft-statement-military-pacification: all'
      tags:
      - name:lodge-henry-cabot
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-01-05.vietnam-diplomacy
      when: Jan. 5
      date: '1967-01-05'
      thread: vietnam-diplomacy
      c: 'Rostow sends Rusk, for his approval, the draft of a letter from the President to Hồ Chí Minh: direct and secret
        talks at a neutral, secure place, preferably Burma. The draft has "no status"; the President knows of it but has not
        seen it. Not sent.'
      n: '[FRUS 1964–68, V: Vietnam, 1967, doc. 5](https://history.state.gov/historicaldocuments/frus1964-68v05/d5), n.4.
        [[w.gibbons-u-s-government-and]], IV, 502. Made public: FRUS 1964–68, V (2002). To check: the draft letter, NSF Country
        File, Vietnam, Marigold, vol. II, LBJ Library (cited by FRUS 1964–68, V, doc. 5, n.4). See [[cal.1967-01-03.vietnam-diplomacy]].
        Names: Rostow, Rusk, Johnson, Hồ Chí Minh.'
      src:
        c: 8a97dced
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d5: all'
        - 'w.gibbons-u-s-government-and IV, 502: A'
      tags:
      - name:rostow-walt-w
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1967-01-06.vietnam-diplomacy
      when: Jan. 6
      date: '1967-01-06'
      thread: vietnam-diplomacy
      c: 'Rostow to Rusk, after their talk that morning: following up every lead through the channel that brings it must convey
        to Hanoi "confusion and uncertainty"; "a direct bilateral clandestine approach is what is required." He still recommends
        the letter he drafted.'
      n: '[FRUS 1964–68, V: Vietnam, 1967, doc. 10](https://history.state.gov/historicaldocuments/frus1964-68v05/d10). [[w.gibbons-u-s-government-and]],
        IV, 502–03 & n.70. Made public: FRUS 1964–68, V (2002). Check: Gibbons''s note dates the memorandum Jan. 5 (State''s
        Lot File 74 D 164); FRUS, Jan. 6, and it speaks of the draft sent "yesterday." See [[cal.1967-01-05.vietnam-diplomacy]].
        Names: Rostow, Rusk.'
      src:
        c: dacd8179
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d10: all'
        - 'w.gibbons-u-s-government-and IV, 502–03: all'
        - 'via x.1967-01-06.rostow-to-rusk-direct-approach: all'
      tags:
