- add:
    entry:
      id: cal.1965-10.vietnam-congress-foreign-relations-2
      when: Oct.
      date: 1965-10
      thread: vietnam-congress-foreign-relations
      c: 'Fulbright, privately, still criticized for taking issue with the administration: he cannot encourage other Senators
        to speak out. "I can''t advise them to speak out, because if you do then everyone jumps down your throat. This country
        has gotten to where you are not supposed to speak out."'
      n: '[[w.gibbons-u-s-government-and]], IV, 41 & n.128. To check: [[w.johnson-fulbright-the-dissenter]], 220 (cited by
        [[w.gibbons-u-s-government-and]], IV, 41 n.128). Check: the day; Gibbons places it after the letter to Johnson in
        the hospital. See [[cal.1965-10.vietnam-congress-foreign-relations]]. Names: Fulbright.'
      src:
        c: 2c2ebef2
        rows:
        - 'w.gibbons-u-s-government-and IV, 41: all'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1965-11.vietnam-congress-foreign-relations
      when: Nov.
      date: 1965-11
      thread: vietnam-congress-foreign-relations
      c: 'Fulbright, by report, to a colleague: "My God, I feel so alone. No one seems to give a damn. I feel at times that
        I am walking among the blind and the deaf."'
      n: '[[w.gibbons-u-s-government-and]], IV, 41 & n.129 ("several weeks later," after his private remark of October). To
        check: [[w.coffin-senator-fulbright]], 264 (cited by [[w.gibbons-u-s-government-and]], IV, 41 n.129). Check: the day
        and the colleague; Gibbons gives "several weeks later." See [[cal.1965-10.vietnam-congress-foreign-relations]]. Names:
        Fulbright.'
      src:
        c: bf48ba06
        rows:
        - 'w.gibbons-u-s-government-and IV, 41: all'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1965-11-30.vietnam-pause-3
      when: Nov. 30
      date: '1965-11-30'
      thread: vietnam-pause
      c: 'William Bundy''s draft memorandum to the President, "A Pause," apparently State''s position, weeks in preparation:
        a pause of a month, the bombing resumed sooner if Hanoi rejects it or takes significant military action; "we would
        resist continuing the pause in return for mere negotiating gestures." In his words, a "hard-line pause."'
      n: '[[w.gibbons-u-s-government-and]], IV, 114 n.5 (a third draft, Nov. 14, in the same file). To check: William Bundy,
        "A Pause," draft memorandum to the President, Nov. 30, 1965, and its third draft, Nov. 14, NSF Country File, Vietnam,
        LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 114 n.5). See [[cal.1965-11-30.vietnam-pause]]. Names:
        William Bundy.'
      src:
        c: 04a616ee
        rows:
        - 'w.gibbons-u-s-government-and IV, 114: all'
        - 'via x.1965-11-30.william-bundy-a-pause-draft: all'
      tags:
      - name:bundy-william
- add:
