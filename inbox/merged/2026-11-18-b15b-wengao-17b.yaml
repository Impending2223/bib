      date: '1964-06-03'
      thread: china-leadership
      c: 'Mao sends Wu Lengxi 吴冷西, head of Xinhua 新华社 and editor of *Renmin ribao* 人民日报, Li Xuefeng''s 李雪峰 speech of May 30: he should resolve to squat at a point in the Peking or Tianjin 天津 countryside this winter and spring, at least five months, coming back now and then for the work at home; a work team of Xinhua and *Renmin ribao* people with local cadres to take on the worst commune and finish the work there, then keep it as their contact point; another winter and spring in the cities'' "five antis". Not to miss this great revolution.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 257–258 (June 3, 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Names: Mao Zedong, Wu Lengxi, Li Xuefeng. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
