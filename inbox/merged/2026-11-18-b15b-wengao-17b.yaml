      when: Sept. 27
      date: '1964-09-27'
      thread: china-leadership
      c: 'Mao to Lu Dingyi 陆定一, on a Central Conservatory student''s letter of Sept. 1, summarized in *Qunzhong fanying* 群众反映 no. 79 (Sept. 16): the school learns Western bourgeois music without criticism; some will not play for workers, peasants and soldiers; too few worker and peasant children; drive emperors, kings and ladies from the stage: the letter well written, the problems to be solved, but by asking the masses'' views, discussed first among teachers and students. Make the past serve the present, the foreign serve China. The letter speaks for one faction; many may disagree.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 367–368 (Sept. 27, 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Qunzhong fanying no. 79, Sept. 16, 1964: summary of a Central Conservatory student''s letter of Sept. 1 to Mao, "Views on the Central Conservatory" (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 367 n.1). Names: Mao Zedong, Lu Dingyi. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
