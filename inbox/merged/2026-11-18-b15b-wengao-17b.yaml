- add:
    entry:
      id: cal.1964-02-03.china-leadership-6
      when: Feb. 3
      date: '1964-02-03'
      thread: china-leadership
      c: 'Mao to Liu Shaoqi 刘少奇 and Deng Xiaoping 邓小平, on the *Renmin ribao* 人民日报 editorial board''s report of Jan. 31 on adding academic articles: the paper has never cared for ideological and theoretical work, with few articles on philosophy and the social sciences and fewer on the natural sciences, leaving the field to *Guangming ribao* 光明日报, *Wenhui bao* 文汇报 and the monthly *Xin jianshe* 新建设. That must change; now they mean to change it. The Secretariat to discuss it and solve their want of cadres.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 192–193 (Feb. 3, 1964; the report, to the Secretariat and Mao: a philosophy drive this year, natural-science articles chiefly on agriculture, three pages a week of theory, and ten to fifteen more cadres asked for). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Renmin ribao editorial board to the Central Committee Secretariat and Mao Zedong, "Report on increasing academic articles," Jan. 31, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 192 n.1). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
      src:
        c: c7e3f5a3
        rows:
        - 'w.jianguo-yilai-mao-zedong XVII, 192–193: all'
        - 'via w.jianguo-yilai-mao-zedong XVII, 192 n.1: all'
