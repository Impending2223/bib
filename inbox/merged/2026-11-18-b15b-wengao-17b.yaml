      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 259–260 (May 9, 1964; note 1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: General Political Department, Gongzuo tongxun no. 131, June 2, 1964, printing Lin Biao''s talk of May 9 on army arts (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 259 n.1). Names: Lin Biao, Liu Zhijian, Fu Zhong, Chen Qitong. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
