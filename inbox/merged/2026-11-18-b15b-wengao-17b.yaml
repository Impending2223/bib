      when: July–Aug.
      date: '1964-07'
      thread: china-leadership
      c: 'Mao, at Beidaihe 北戴河, in several talks with his nephew Mao Yuanxin 毛远新, a student at the Military Engineering Institute, Harbin: class struggle a main course, the institute to go to the countryside for the "four cleanups" and to factories for the "five antis"; marks not to be prized; spoon-feeding to be opposed, lecture notes given to students; reform of teaching is chiefly a question of the teachers.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 304–305 (July 1964; an extract of the record of several talks, printed from *Mao zhuxi lun jiaoyu geming* (Renmin Chubanshe, Dec. 1967)). Made public: 1967 ([[w.jianguo-yilai-mao-zedong]], XVII, 305: *Mao zhuxi lun jiaoyu geming*, Renmin Chubanshe, Dec. 1967). Names: Mao Zedong, Mao Yuanxin. Check: whether that printing of 1967 was open. Check: the days of the talks; several talks in one record.'
