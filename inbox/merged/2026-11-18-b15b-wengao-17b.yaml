      when: Nov. 2
      date: '1964-11-02'
      thread: china-leadership
      c: 'Gu Mu 谷牧, in the morning, calls the heads of nineteen industrial, transport and defense ministries and lays out the mass revolution in design on Mao''s note of Nov. 1: every institute, Peking''s first, to start; each ministry to take one institute in hand; three months to expose problems for the February conference; three steps; a vice-minister in charge. He reports the plan to Peng Zhen 彭真, for Mao, the same day.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 408–410 (Nov. 2, 1964; note 2: the morning of Nov. 2 (十一月二日上午); the conference held Mar. 16–Apr. 4, 1965). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Gu Mu to Peng Zhen, for Mao Zedong, report of Nov. 2, 1964 on the plan for a mass revolution in design (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 410 n.2). Names: Gu Mu, Peng Zhen, Mao Zedong. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
      tags:
