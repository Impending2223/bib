      date: '1964-07-07'
      thread: china-leadership
      c: 'Mao, on Tian Jiaying''s 田家英 draft news item of July 5 on the *Selected readings from Mao Zedong''s works* 毛泽东著作选读, editions A and B: back to Tian to do. The item: both out early this month, on sale everywhere from the 10th; A, for cadres, thirty-seven pieces of 1927–58, three first published ("Oppose book worship", "To be attacked by the enemy is a good thing", the 1957 speech to the propaganda conference); B, for workers, peasants and young intellectuals, thirty-seven of 1926–63, with "Where do correct ideas come from?" first published.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 278–279 (July 7, 1964; Tian: revised on Kang Sheng''s and others'' views, to be broadcast the evening of the 9th and printed the 10th). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Tian Jiaying to Mao Zedong, July 5, 1964, sending the draft news item on the publication of editions A and B of Mao Zedong zhuzuo xuandu (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 278 n.1). Names: Mao Zedong, Tian Jiaying. Check: when the item was broadcast and printed. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
