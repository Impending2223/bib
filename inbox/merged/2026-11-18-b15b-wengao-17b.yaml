    item: '[[w.jianguo-yilai-mao-zedong]], XVII, 194–196 (Feb. 13, 1964; an extract of the talk at the Spring Festival forum, printed from *Mao zhuxi lun jiaoyu geming* (Renmin Chubanshe, Dec. 1967), which Mao had checked before it came out (note 1); a three-sentence sample: schooling shortened, girls too to have half a year to a year of army life, open examination questions)'
