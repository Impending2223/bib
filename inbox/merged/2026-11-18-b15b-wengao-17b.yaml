- add:
    entry:
      id: cal.1964-01.china-leadership-5
      when: Jan., before the 13th
      date: '1964-01'
      at: before 1964-01-13
      thread: china-leadership
      c: 'Mao, revising Xu Bing''s 徐冰 summary of May 27, 1963 of the United Front Work Department''s errors of policy and theory (an unnamed critique of its head Li Weihan 李维汉 since 1956), adds a paragraph: if we and our heirs do not keep vigilant, raise the masses'' consciousness, carry socialist education deep, and hold leadership at every level in true Marxists'' hands, letting revisionists usurp it, China may yet go some way down the road of capitalist restoration. He also adds "capitalism, the reactionaries of each country" and makes "even a hundred years" "even several hundred years."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 180–182 (Jan. 1964; dated only Jan. 1964; the summary went out from the Center Jan. 13 after Mao''s revision (note 1)). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Xu Bing, deputy head of the United Front Work Department, "Summary of the review of some questions of policy and theory in the Central United Front Work Department''s work of recent years," May 27, 1963 (seven parts) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 180 n.1a). Names: Mao Zedong, Xu Bing, Li Weihan. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: '8622ab15'
        rows:
        - 'w.jianguo-yilai-mao-zedong XVII, 180–182: all'
        - 'via w.jianguo-yilai-mao-zedong XVII, 180 n.1a: all'
- add:
