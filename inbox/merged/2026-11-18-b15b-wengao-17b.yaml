      thread: china-leadership
      c: 'Mao to Luo Ruiqing 罗瑞卿, on the Kunming Military Region''s bulletin of July 27 on the 126th Regiment''s swimming of the Jinsha 金沙 River: very good. Could most of the troops, wherever conditions allow, try learning to swim? Has the Military Commission issued an instruction? Bad conditions: rivers and ponds with snail fever or other poisons, whirlpools, seas with sharks; not everyone to be forced into the water.'
