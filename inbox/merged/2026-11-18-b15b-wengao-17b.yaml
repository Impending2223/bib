      when: Nov. 6
      date: '1964-11-06'
      thread: china-leadership
      c: 'Mao, returning to Wu Lengxi 吴冷西 the *Renmin ribao* 人民日报 editorial for the October Revolution''s forty-seventh anniversary, "Unite under the banner of the great October Revolution": read; well written; a small change on p. 4. He adds: imperialism, the United States above all, takes the unity of China and the Soviet Union, of the camp and of the world''s revolutionary peoples, as the chief bar to its conquest, and works to split it.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 414–415 (Nov. 6, 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Wu Lengxi to Mao Zedong, letter of Nov. 5, 1964 sending the draft Renmin ribao editorial for the forty-seventh anniversary of the October Revolution (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 415 n.1a). Names: Mao Zedong, Wu Lengxi. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
      tags:
      - polity:prc
