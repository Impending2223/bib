- add:
    entry:
      id: cal.1964-08-18.china-leadership-4
      when: Aug. 18
      date: '1964-08-18'
      thread: china-leadership
      c: 'Mao on the Propaganda Department''s request of Aug. 14 to show and criticize in seven big cities the films *Beiguo jiangnan* 北国江南 and *Eryue* 二月 (bourgeois humanism, the "middle character" as hero, the "tradition of the thirties"): show them not only in the big cities but in tens to over a hundred middle cities, to make these revisionist materials public; perhaps there are others to criticize. For Deng Xiaoping 邓小平, Peng Zhen 彭真, Kang Sheng 康生 and Lu Dingyi 陆定一.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 326–327 (Aug. 18, 1964; note 1: Kang Sheng''s marginal note on the report, *Beiguo jiangnan* modern revisionism, not only the thirties; *Eryue* shown as *Zaochun eryue*). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Propaganda Department to the Secretariat, "Request to show publicly and criticize the films Beiguo jiangnan and Eryue," Aug. 14, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 326 n.1a); Kang Sheng, marginal note on the Propaganda Department''s report of Aug. 14, 1964 on the two films (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 327 n.1b). Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Kang Sheng, Lu Dingyi. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
