      thread: china-leadership
      c: 'Mao, for Zhu De 朱德, Deng Xiaoping 邓小平, Peng Zhen 彭真 and Kang Sheng 康生, on the Health Ministry party group''s report of July 29 on the senior cadres'' health service: the Secretariat to consider whether the proposals will do and tell the ministry. In the margins: the Health Care Bureau should be abolished; the Peking Hospital, many doctors and few patients, a hospital for lords, should be opened.'
