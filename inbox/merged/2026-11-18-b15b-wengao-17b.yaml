      c: 'Li Xuefeng 李雪峰, first secretary of the North China Bureau, to the North China group of the Central Work Conference: this winter''s and next spring''s "four cleanups" are the first decisive battle in North China; cadres of every trade to squat at points; those of culture and education, finance and trade, industry and transport to go to the villages for a term of five or six months, besides the "five antis" in the cities.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 257–258 (May 30, 1964; note 1: the afternoon of May 30 (五月三十日下午), as printed in the conference''s bulletin). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Bulletin of the group meetings of the Central Work Conference: record of Li Xuefeng''s speech to the North China group, afternoon of May 30, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 257 n.1). Names: Li Xuefeng. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
