- add:
    entry:
      id: cal.1964-01-31.china-leadership-2
      when: Jan. 31
      date: '1964-01-31'
      thread: china-leadership
      c: 'Mao to Zhou Shizhao 周世钊 (Dunyuan 惇元), vice-governor of Hunan 湖南, his schoolmate at the First Normal: his two letters and two poems, with a letter of their schoolmate Yu Gai 余盖, received. He sends 2,000 yuan: 1,500 to their old psychology teacher Li Daliang 李大梁 for medicine, 500 to Yu. The explanations of his own poems differ; Zhou may take his own view.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 190 (Jan. 31, 1964; note 4: the poems are *Mao zhuxi shici*, Renmin Wenxue and Wenwu, Jan. 1, 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Names: Mao Zedong, Zhou Shizhao, Yu Gai, Li Daliang. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
