- add:
    entry:
      id: cal.1964-11-21.china-leadership-3
      when: Nov. 21
      date: '1964-11-21'
      thread: china-leadership
      c: 'Lin Biao 林彪, hearing Zhang Zongxun 张宗逊 report on military training: hold the gains; spread the skills as Chairman Mao directs; training and socialist education both; about ten marksmen a company, one a squad; close and night combat, within one or two hundred meters even in nuclear conditions; the academies to take Chairman Mao''s works as their texts.'
