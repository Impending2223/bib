      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 316–318 (Aug. 12, 1964; note 2: Yang sent the report on May 9, Luo to Mao, Liu, Zhou, Deng and Peng May 25). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: General Staff Operations Department, report of Apr. 25, 1964 on how national economic construction may guard against the enemy''s surprise attack (sent on by Yang Chengwu May 9 and by Luo Ruiqing May 25) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 316 n.2). Names: Mao Zedong, Luo Ruiqing, Yang Chengwu. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
