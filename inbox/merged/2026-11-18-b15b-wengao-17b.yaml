      time: '1964-10-24T07:00:00Z'
      time_zone: Asia/Shanghai
      c: 'Mao settles his letter to Ben Bella 本·贝拉, on Qiao Guanhua''s 乔冠华 draft of Oct. 23, and writes at 3 p.m.: back to the Foreign Ministry, to type and bring in the afternoon for signing. The letter: glad of both letters and of the ambassador Yala, Boumaza and Ouzegane''s delegation; Algeria''s seven years'' war an example to three continents; some Algerians he met have left the revolution, which is no surprise; the democratic stage first, then socialism; Chen Yi 陈毅 to lead the delegation to the anniversary; he hopes to see Ben Bella in China.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 383–386 (Oct. 24, 1964; the note dated Oct. 24, 15:00 (十月二十四日十五时), printed from the original in the Central Archives). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Qiao Guanhua, Vice-Minister of Foreign Affairs, draft of Oct. 23, 1964 of Mao''s reply to Ben Bella (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 386 n.1c). Names: Mao Zedong, Ben Bella, Qiao Guanhua, Chen Yi, Boumaza, Ouzegane. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
