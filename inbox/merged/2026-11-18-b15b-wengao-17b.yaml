- add:
    entry:
      id: cal.1964-07-04.china-leadership
      when: July 4
      date: '1964-07-04'
      thread: china-leadership
      c: 'Mao to Wu Lengxi 吴冷西, on that day''s *Renmin ribao* 人民日报 report of the Yiduhe 一渡河 brigade branch, Beijing commune, Huairou 怀柔 county, promoting young cadres (seventeen under thirty, 39 percent of its cadres): such practice may be found in every province; report and reprint it widely, so that within a few years every county, commune, factory, school and office has its report, true and typical, with a few of the self-satisfied for contrast. The paper and Xinhua 新华社 to discuss it and to ask the provinces to do the same. Also for Peng Zhen 彭真, An Ziwen 安子文, Lu Dingyi 陆定一 and Luo Ruiqing 罗瑞卿.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 272–273 (July 4, 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Renmin ribao, July 4, 1964: report of the Yiduhe brigade Party branch, Beijing commune, Huairou county, promoting and using able young cadres (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 272 n.2). Names: Mao Zedong, Wu Lengxi, Peng Zhen, An Ziwen, Lu Dingyi, Luo Ruiqing. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
