      c: 'Liu Shaoqi 刘少奇 sends Mao and the Center two papers to forward, with a draft comment: the Yiyang 益阳 prefectural committee''s report of Aug. 14 on the counterattack against socialist education at Yingfeng 迎丰 commune, led by its Party secretary Kuang Aiguo, with Hunan 湖南''s forwarding of Aug. 15; and Zhang Jingliang''s speech of July 21 to the Jiangsu 江苏 committee on the dispute between the committee of Gaogou 高沟 commune, Lianshui county, and the work team. Yingfeng a grave counter-revolutionary event; Jiangsu has not treated Gaogou so; Jiangsu to answer at once.'
