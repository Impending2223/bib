      c: 'Mao on Xie Fuzhi''s 谢富治 letter of Feb. 12 sending the Public Security Ministry party group''s opinion on carrying out in the cities the Center''s directive on relying on the masses to strengthen the people''s democratic dictatorship: read; back to Xie; this paper very good, act on it.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 173–175 (Feb. 15, 1964; comment two of two; the opinion: in factories and mines with grave struggle, mass movements joined to the "five antis"; the four kinds of elements kept at their units under the masses'' watch; a socialist education campaign proposed in every town this year). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Xie Fuzhi to Mao Zedong, letter of Feb. 12, 1964 sending the Public Security Ministry party group''s opinion (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 174 n.1b); Public Security Ministry party group, "Opinion on how to carry out in the cities the Center''s directive on relying on the strength of the masses to strengthen the people''s democratic dictatorship," Feb. 12, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 174 n.3). Names: Mao Zedong, Xie Fuzhi. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
      tags:
      - polity:prc
