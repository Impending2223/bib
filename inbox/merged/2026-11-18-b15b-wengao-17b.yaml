      when: Oct., after the 3rd
      date: '1964-10'
      at: after 1964-10-03
      thread: china-leadership
      c: 'Mao, on Li Jingquan 李井泉 and Lü Zhengcao''s 吕正操 request of Oct. 3 on routing the Sichuan–Hankou 川汉 railway (the Yuanjiang route by Changde and Chongqing, about 1,300 km, or the Lishui route) and the comments on it: back to Bo Yibo 薄一波. Beside Zhou Enlai 周恩来''s note: Zhou is right; the coal, iron, other metals and forests along all three routes to be surveyed together.'
