      thread: china-leadership
      c: 'Mao has the record of Xu Yinsheng''s 徐寅生 talk of Sept. 28, 1964 to the women''s table-tennis team, with He Long''s 贺龙 comment of Oct. 10, printed for the work conference and then further: the young generals challenge us old generals; the talk is full of dialectical materialism, against idealism and every metaphysics; no such good work seen for years; from his talk of ping-pong we should learn theory, politics, economics, culture, war; if we do not learn from the young, we are finished.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 508–510 (Jan. 12, 1965). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Xu Yinsheng, talk of Sept. 28, 1964 to the Chinese women''s table-tennis team, summary record (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 508 n.1a); He Long, comment of Oct. 10, 1964 on Xu Yinsheng''s talk (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 509 n.1b). Names: Mao Zedong, Xu Yinsheng, He Long. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
