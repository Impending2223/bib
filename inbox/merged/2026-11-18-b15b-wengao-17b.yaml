      thread: china-leadership
      c: The Center forwards Xu Bing's 徐冰 summary of the United Front Work Department's errors of policy and theory, as revised by Mao, to the regional bureaus, the provincial, municipal and regional committees, and the Center's departments, commissions and party groups.
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 180–182 (Jan. 13, 1964; note 1: the forwarding is dated Jan. 13; the UFWD''s review report of Aug. 18, 1980 on Li Weihan''s rehabilitation proposed the document be withdrawn, and the Secretariat agreed Nov. 20, 1980). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, forwarding of Xu Bing''s summary of the United Front Work Department''s review, Jan. 13, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 182 n.1b). Names: Xu Bing. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
