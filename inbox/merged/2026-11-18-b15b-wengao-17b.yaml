patch: 2026-11-18-b15b-wengao-17b
by: 'Claude (batch 15b, cite pass of the *Jianguo yilai Mao Zedong wengao*, vol. 17, from p. 173, Jan. 1964 on, 2023 ed.), Nov. 18, 2026'
ops:
- add:
    entry:
      id: cal.1964-01-01.china-leadership-3
      when: Jan. 1
      date: '1964-01-01'
      thread: china-leadership
      c: 'Mao to Xie Fuzhi 谢富治, Minister of Public Security, on the ministry''s party group''s third comprehensive report of 1963 (Dec. 30), which Xie sent him: read, very good. Should some of them go down to a few counties, communes, factories and mines for a short investigation, to prepare the February public security conference better? Some work groups to the cities'' factories and mines too.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 173–174 (Jan. 1, 1964; comment one of two; the report: since the Hangzhou conference of May, more than ten work groups sent down; "kill none, arrest few" (more than 95 percent not arrested) found right; a national meeting of public security heads planned for mid-February). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Xie Fuzhi to Mao Zedong, letter of Dec. 30, 1963 sending the Public Security Ministry party group''s third comprehensive report of 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 173 n.1a); Public Security Ministry party group, "Third comprehensive report of 1963," Dec. 30, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 174 n.2). Names: Mao Zedong, Xie Fuzhi. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:xie-fuzhi
      - vis:only:prc
      src:
        c: 7d88efe7
        rows:
        - 'w.jianguo-yilai-mao-zedong XVII, 173–174: all'
        - 'via w.jianguo-yilai-mao-zedong XVII, 173 n.1a: all'
        - 'via w.jianguo-yilai-mao-zedong XVII, 174 n.2: all'
- add:
    entry:
      id: cal.1964-01-07.china-leadership-3
      when: Jan. 7
      date: '1964-01-07'
      thread: china-leadership
      c: 'Mao on Luo Ruiqing''s 罗瑞卿 covering letter of Jan. 7 sending an article from the Hong Kong weekly *Xinwen tiandi* 新闻天地, "The age of the ''anti-missile'' has come!" (the Soviet-American race in anti-missile arms, from 1962): read; after Jiang Qing 江青 reads it, back to Luo; send it to Nie Rongzhen 聂荣臻 to read? Luo to decide.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 176–177 (Jan. 7, 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Luo Ruiqing to Mao Zedong, covering letter of Jan. 7, 1964 sending the Xinwen tiandi article (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 176 n.1a); "The age of the ''anti-missile'' has come!" ("Fan feidan" shidai daolai!), Xinwen tiandi, Hong Kong weekly, issue not given (before Jan. 7, 1964) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 176 n.1b). Names: Mao Zedong, Luo Ruiqing, Jiang Qing, Nie Rongzhen. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:luo-ruiqing
      - name:jiang-qing
      - name:nie-rongzhen
      - vis:only:prc
      src:
        c: cb93a804
        rows:
        - 'w.jianguo-yilai-mao-zedong XVII, 176–177: all'
        - 'via w.jianguo-yilai-mao-zedong XVII, 176 n.1a: all'
        - 'via w.jianguo-yilai-mao-zedong XVII, 176 n.1b: all'
- add:
    entry:
      id: cal.1964-01-09.china-leadership-4
      when: Jan. 9
      date: '1964-01-09'
      thread: china-leadership
      also:
      - africa
      c: 'Mao to Kwame Nkrumah, President of Ghana, letter of sympathy on the attempt on his life: indignation at the enemies'' new and base attempt; joy at his escape; imperialism and reaction will not leave the African stage of their own accord; China will always support the Ghanaian and African peoples.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 178–179 (Jan. 9, 1964; printed from *Renmin ribao*, Jan. 13, 1964; note 1: the attempt was the afternoon of Jan. 2, as Nkrumah left his office; Zhou Enlai, visiting Ghana, handed over the letter when he called on Nkrumah Jan. 11). See [[cal.1964-01-06.china-leadership]]. Names: Mao Zedong, Nkrumah.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:nkrumah-kwame
      - polity:ghana
      src:
        c: 68bb843d
        rows:
        - 'w.jianguo-yilai-mao-zedong XVII, 178–179: all'
