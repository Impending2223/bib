      when: Sept. 11
      date: '1964-09-11'
      thread: china-leadership
      c: 'Mao to Xu Bing 徐冰, on the United Front Work Department office''s compilation of Sept. 3 of Li Weihan''s 李维汉 chief words on nationalities and religion (eight heads: reform and the suppression of the rebellion, religion, regional autonomy, the Panchen Lama, the upper-class united front, Xinjiang 新疆, nationalism, the nation under socialism), which Xu sent through Peng Zhen 彭真: hold to your class stand, unite the majority, tell them not to waver. Back to Xu to keep.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 353–354 (Sept. 11, 1964; note 1: the compilation was used to criticize Li; the review of Aug. 18, 1980, passed by the Secretariat Nov. 20, 1980, withdrew the criticisms of 1962–65 and the Center''s notice of Dec. 25, 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Xu Bing to Peng Zhen, letter of Sept. 3, 1964 sending Luo Mai''s (Li Weihan''s) words on nationalities and religion, to go to Mao (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 353 n.1a); United Front Work Department office, "Chief words of Li Weihan on questions of nationality and religion," Sept. 3, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 353 n.1b). Names: Mao Zedong, Xu Bing, Li Weihan, Peng Zhen. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
