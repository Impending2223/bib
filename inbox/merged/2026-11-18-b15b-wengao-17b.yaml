      c: 'Mao to Peng Zhen 彭真, on Huang Zhen''s 黄镇 telegram of Feb. 24 from Pakistan on Souvanna Phouma''s visit, planned for Mar. 15: better put off fifteen days; Zhou Enlai 周恩来 and Chen Yi 陈毅 may have an important meeting between Mar. 15 and 20.'
