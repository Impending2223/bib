      date: '1964-11-06'
      thread: china-leadership
      c: 'Mao, on Liu Ningyi''s 刘宁一 draft speech for the Peking meeting on the October Revolution''s anniversary, which Wu Lengxi 吴冷西 sent Nov. 5: usable, with small changes. Strikes "ours is the age when the east wind prevails over the west": not to be said at this time. Adds that the American election, Johnson re-elected, was the monopoly bourgeoisie''s game to fool the people; no peace candidate against a war candidate.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 416–417 (Nov. 6, 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Liu Ningyi, draft of his speech to the Peking meeting for the forty-seventh anniversary of the October Revolution, sent by Wu Lengxi Nov. 5, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 417 n.1a). Names: Mao Zedong, Liu Ningyi, Wu Lengxi. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
      tags:
