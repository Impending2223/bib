      thread: china-leadership
      c: 'Mao on no. 1 (Mar. 4) of the bulletins of the Hunan 湖南 conference of poor and lower-middle peasants'' representatives: to Wang Dongxing 汪东兴 and Lin Ke 林克, then Jiang Qing 江青, then Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Deng Xiaoping 邓小平, Peng Zhen 彭真 and Lu Dingyi 陆定一, back to Mao. Good material, easy to read, much never heard of, of great benefit; the question to be talked over at the May meeting.'
