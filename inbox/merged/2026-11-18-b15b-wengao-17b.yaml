- add:
    entry:
      id: cal.1964-08-27.china-leadership-2
      when: Aug. 27
      date: '1964-08-27'
      thread: china-leadership
      c: 'Mao to Deng Xiaoping 邓小平, on the record of Chen Boda''s 陈伯达 talk with Yang Bo 杨波 on changing the methods of planning, which Chen sent Aug. 20 (see the whole; finance for renovating old plants; the third front urgent, with the first and second lines'' renovation; an end to dawdling): print it for those coming to the meeting and for the province, municipal and middle-city committees to study, for the October work conference. Chen''s proposals seem workable. The planning methods must change within this year and next; if not, the present Planning Commission must go and another body be set up.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 334–335 (Aug. 27, 1964; Mao changed Chen''s "not enough attention" to "no attention"). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Record of Chen Boda''s talk with Yang Bo, deputy head of the State Planning Commission''s research office, on changing the methods of planning work, sent to Mao Aug. 20, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 334 n.1). Names: Mao Zedong, Deng Xiaoping, Chen Boda, Yang Bo. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
