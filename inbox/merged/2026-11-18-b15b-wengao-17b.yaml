- add:
    entry:
      id: cal.1964-03-10.china-leadership-3
      when: Mar. 10
      date: '1964-03-10'
      thread: china-leadership
      c: 'Mao, for Liu Shaoqi 刘少奇, Deng Xiaoping 邓小平 and Peng Zhen 彭真, then Yang Shangkun 杨尚昆 to act, on *Qunzhong fanying* 群众反映 no. 16 (Mar. 6), which prints a letter of Feb. 1964 from Wei Lianyi 魏莲一, principal of Peking Railway No. 2 Middle School, on lightening pupils'' loads: send it to every head and deputy head of the Propaganda Department, the heads, deputies and bureau chiefs of the Ministry of Education, the Peking Party committee and council''s education officials, three copies to the Youth League Center, for investigation. Too many courses, a load too heavy; teaching ill done; examinations treat pupils as enemies, by surprise attack. None of it helps the young grow lively in morals, mind and body.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 207–208 (Mar. 10, 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Qunzhong fanying no. 16, Mar. 6, 1964, printing a letter of Feb. 1964 from Wei Lianyi, principal of Peking Railway No. 2 Middle School, on lightening the load of middle-school pupils (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 207 n.1a); Central Committee, Zhongfa [64] 180, Mar. 14, 1964, issuing Mao''s comment with Qunzhong fanying no. 16 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 207 n.1b). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Yang Shangkun, Wei Lianyi. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
