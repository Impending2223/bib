      c: 'Mao writes two passages into the tenth draft (Mar. 16) of the eighth comment on the CPSU''s open letter, then titled "Khrushchev''s revisionism, which betrays the proletarian revolution": at the head of the preface, the article is on the much-known question of "peaceful transition," known because Khrushchev raised it at the Twentieth Congress, made it program at the Twenty-second and the open letter of July 14, 1963 sang it again; at its end, hence this article, to answer the revisionists in plainer words than before.'
