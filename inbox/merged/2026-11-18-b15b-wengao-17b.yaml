      when: Feb. 15
      date: '1964-02-15'
      thread: china-leadership
      c: 'Mao to Lu Dingyi 陆定一 on the Propaganda Department''s request of Dec. 31, 1963 that the Center send out two papers on senior cadres'' study of Marx, Engels, Lenin and Stalin: read, very good, send it out now. The thirty books in large type, thread-bound, in fascicles: Lu to press it, done this year if possible; ten, twenty or thirty thousand copies each? He is eager to read such large-type books.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 197–200 (Feb. 15, 1964; note 3: the papers, a draft Center comment and a draft list of readings; note 4: the thirty books, eight of Marx, three of Engels, eleven of Lenin, five of Stalin, three of Plekhanov, two more added later). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Propaganda Department, request of Dec. 31, 1963 that the Center send out two papers on organizing senior cadres'' study of the works of Marx, Engels, Lenin and Stalin (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 197 n.1); Central Propaganda Department, draft Center comment and draft list of the works of Marx, Engels, Lenin and Stalin for cadres to read (sent with the request of Dec. 31, 1963) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 198 n.3a); Li Mancun, head of the General Political Department''s propaganda department, and Zhang Boxiang, deputy head of its cadre department, "Report on the study of the second senior reading class of the Higher Military Academy," June 18, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 198 n.3b); Work group of the propaganda departments of the General Political Department and the Air Force Political Department, "Report on the reading of senior cadres in several Air Force units," Nov. 1, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 198 n.3c). Names: Mao Zedong, Lu Dingyi. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
      tags:
