      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao annotates *Hongqi*''s 红旗 extract translation (Sept. 1) of chapter 2 of a Leningrad University book of 1963 edited by Tugarinov, on the categories of the law of unity and struggle of opposites in socialist society (worker and peasant now in difference, not contradiction): "abolished?", "developed?", "nonsense" twice; and at length: forty-seven years have bred a worker and a peasant aristocracy, the two bourgeoisies of town and country, ruling together over the workers and peasants, in struggle with them and among themselves; China has much the same, and is beginning to know and solve it.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 374–376 (Sept. 1964). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Hongqi editorial department philosophy group, extract translation of Sept. 1, 1964: "The Soviet modern revisionist Tugarinov on the categories of the law of unity and struggle of opposites in socialist society" (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 375 n.1a). Names: Mao Zedong, Tugarinov. Check: the day; the translation is of Sept. 1. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
