- add:
    entry:
      id: cal.1964-11-23.china-leadership-5
      when: Nov. 23
      date: '1964-11-23'
      thread: china-leadership
      c: 'Mao revises Hu Qiaomu''s 胡乔木 sixteen *ci* 词十六首 and writes into Hu''s letter to the *Renmin ribao* 人民日报 editors: please improve them; if fit, print them. Among his changes: lines of the National Day poem and the Hangzhou 杭州 poem; the title of the atomic-bomb poems made "Oct. 16, 1964, the atomic bomb explodes". On Hu''s note that the Hangzhou poem''s ghosts no longer fit, the tombs by Gushan being cleared: Hangzhou and elsewhere are neighbors of ghosts for centuries; to dig up a few old bones and call it solved is to underrate the enemy; not to add the note. On Hu''s gloss to the bomb poem: no note needed, readers will not misread.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 428–433 (Nov. 23, 1964; note 1: Hu''s letter dated Oct. 25, later changed to Dec. 5; the volume dates Mao''s comments and revisions Nov. 23 and Dec. 2). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Hu Qiaomu to the Renmin ribao editors, letter dated Oct. 25, 1964 (later changed to Dec. 5), asking them to print some of his ci (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 431 n.1a); Hu Qiaomu, Ci shiliu shou (Sixteen ci), manuscript with Mao''s revisions, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 431 n.1b); Hu Qiaomu to Mao Zedong, letter of Dec. 2, 1964 from Hangzhou: the Zhejiang committee has decided to remake the West Lake scenic area; Zhejiang ribao has printed readers'' letters on clearing such things as Su Xiaoxiao''s tomb (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 432 n.11). Names: Mao Zedong, Hu Qiaomu. Check: which of the comments and revisions are of Nov. 23 and which of Dec. 2. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it, and in which volume.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: a3c5264b
        rows:
        - 'w.jianguo-yilai-mao-zedong XVII, 428–433: all'
        - 'via w.jianguo-yilai-mao-zedong XVII, 431 n.1a: all'
        - 'via w.jianguo-yilai-mao-zedong XVII, 431 n.1b: all'
        - 'via w.jianguo-yilai-mao-zedong XVII, 432 n.11: all'
