      thread: china-leadership
      c: 'Mao to Peng Zhen 彭真, for Gu Mu 谷牧, on Song Yangchu''s 宋养初 letter of Oct. 24, printed in the General Office''s *Qingkuang jianbao* 情况简报 no. 408 (Oct. 29), on fourteen design institutes'' mass movements to reform design work: before the national design conference next February, bring every design institute into a mass revolution in design, to speak out fully; in three months much can be gained. Gu Mu to lay it out at once, check, press and sum up.'
