      c: 'Mao rewrites the mastheads of four provincial and city Party papers, with letters to Fan Jin 范瑾 (*Beijing ribao* 北京日报), Wan Xiaotang 万晓塘 (*Tianjin ribao* 天津日报), Jiang Weiqing 江渭清 (*Xinhua ribao* 新华日报, Jiangsu 江苏) and Zhang Pinghua 张平化 (*Xin Hunan bao* 新湖南报, to be *Hunan ribao* 湖南日报, like *Hubei ribao*): the old mastheads poorly written; if usable, best changed on National Day; if not, send back to be written again.'
