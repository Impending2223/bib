      when: Apr. 7
      date: '1962-04-07'
      thread: china-leadership
      also: [soviet-union]
      c: 'Luo Shigao 罗士高, the Ambassador to Albania, reports his talk with Hoxha 霍查: Hoxha holds that Khrushchev and his followers must admit their errors in public, or there can be no meeting. The full record to come within days.'
      n: '[[w.yang-shangkun-riji]], II, 140–141 (Apr. 7, 1962; notes 3–4: Hoxha, Khrushchev). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Luo Shigao, Hoxha, Khrushchev.'
      src:
        c: c0ecf70d
        rows: ['w.yang-shangkun-riji II, 140–141: all']
      tags: ['polity:prc', 'name:khrushchev-nikita-s', 'vis:only:prc']
- add:
    entry:
      id: cal.1962-04-07.china-leadership-5
      when: Apr. 7
      date: '1962-04-07'
      thread: china-leadership
      also: [korea]
      c: 'The Center decides that Peng Zhen 彭真 lead a National People''s Congress delegation to Korea; the Korean side welcomes it. The Korean party, the diary notes, more and more against revisionism: a "self-reliant economy" 自主经济, against "flunkeyism" 事大主义.'
      n: '[[w.yang-shangkun-riji]], II, 141 (Apr. 7, 1962; note 1: Peng Zhen). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Peng Zhen.'
      src:
        c: 4818ec6d
        rows: ['w.yang-shangkun-riji II, 141: all']
      tags: ['polity:prc', 'name:peng-zhen', 'vis:only:prc']
- add:
    entry:
      id: cal.1962-04-07.china-leadership-6
      when: Apr. 7
      date: '1962-04-07'
      thread: china-leadership
      c: 'Yang Shangkun''s 杨尚昆 work notes, Shanghai''s 上海 streamlining: 300,000 workers can go; of 90,000 textile workers, 20,000–30,000 near fifty, to be laid off four or five years before retiring; 30,000 machine workers for the Center to place; administrative cadres to the villages on their pay. Xinjiang 新疆: 150,000 to settle, at 600 yuan each, 100 for the drifters 盲流.'
      n: '[[w.yang-shangkun-riji]], II, 141 (Apr. 7, 1962; note 2: the work notes, in 仿宋). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun.'
      src:
        c: a3f5589e
        rows: ['w.yang-shangkun-riji II, 141: all']
      tags: ['polity:prc', 'vis:only:prc']
