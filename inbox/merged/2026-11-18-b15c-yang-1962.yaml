    entry:
      id: cal.1962-01-01.china-leadership-2
      when: Jan. 1
      date: '1962-01-01'
      thread: china-leadership
      c: 'Yang Shangkun 杨尚昆 reads the *Renmin ribao* 人民日报 New Year message (1962 the key year for readjusting the economy) and sets himself four tasks for the year: to read more, to go to the villages or factories to investigate, to shed routine work for political and ideological work, to exercise.'
      n: '[[w.yang-shangkun-riji]], II, 106 (Jan. 1, 1962). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun.'
      src:
