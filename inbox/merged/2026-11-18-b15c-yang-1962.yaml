      time: 1962-05-07T07:30Z
      thread: china-leadership
      c: 'Li Fuchun 李富春 to the work conference''s plenary, by Yang''s notes: the economy''s balance broken; 1962 grain put at 320 billion jin, enough after rural needs for 35.3 million town people, 52.3 million with imports, so the towns must fall below 107 million; workers at most 11 million of the present 16 million; 2.3 million off construction; 61,671 industrial enterprises in 1961, far too many.'
