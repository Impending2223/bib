      id: cal.1962-05-10.china-leadership-3
      when: May 10
      date: '1962-05-10'
      time: 1962-05-10T07:30Z
      thread: china-leadership
      c: 'The Xilou 西楼, 3:30 to 7:30 p.m. Liu Shaoqi''s 刘少奇 meeting of the regions on grain and streamlining. By Yang''s notes: East China''s summer crop put at 11.03 billion jin; Zhou Enlai 周恩来: the difficulties not yet fully gauged, resolve short; an economic emergency; 20 million to go. Liu: not a fine situation, the difficulties underrated, not overrated; the retreat must be enough.'
      n: '[[w.yang-shangkun-riji]], II, 166–169 (May 10, 1962; note 1: the work notes, in 仿宋, 166–169). The words: 下午3时半到7时半 (II, 166–169). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Liu Shaoqi, Zhou Enlai.'
      src:
        c: c9088ee7
        rows: ['w.yang-shangkun-riji II, 166–169: all']
      tags: ['polity:prc', 'name:liu-shaoqi', 'name:zhou-enlai', 'vis:only:prc']
      time_zone: Asia/Shanghai
- add:
    entry:
      id: cal.1962-05-11.china-leadership-6
      when: May 11
      date: '1962-05-11'
      time: 1962-05-11T02:00Z
      thread: china-leadership
      c: 'The work conference''s plenary, 10 a.m. to 1 p.m.: Xie Fuzhi 谢富治, Lin Feng 林枫 and Peng Zhen 彭真 speak. By Yang''s notes, Xie on public security, Gansu 甘肃, Qinghai 青海 and Anhui 安徽 worst; Liu Shaoqi 刘少奇: the dictatorship''s weapons were turned on the people, a grave error; a man who cries "down with the Communist Party" when his family has died not lightly to be judged a counterrevolutionary.'
      n: '[[w.yang-shangkun-riji]], II, 169 (May 11, 1962; notes 1–2: the work notes, in 仿宋; Lin Feng). The words: 上午10时到13时 (II, 169). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Xie Fuzhi, Lin Feng, Peng Zhen, Liu Shaoqi.'
      src:
        c: f3a97564
        rows: ['w.yang-shangkun-riji II, 169: all']
      tags: ['polity:prc', 'name:xie-fuzhi', 'name:peng-zhen', 'name:liu-shaoqi', 'vis:only:prc']
      time_zone: Asia/Shanghai
- cite: {id: cal.1962-05-11.china-leadership, item: '[[w.yang-shangkun-riji]], II, 169–171 (May 11, 1962; the plenary, from 3:30 p.m.; by Yang''s notes: cutting 20 million like moving a country; the Seven Thousand conference''s long-range targets untenable; the summer harvest poor; imports held within 700 million dollars; workers down 10–10.7 million, town people 10 million)', units: E}
- cite: {id: cal.1962-05-11.china-leadership-3, item: '[[w.yang-shangkun-riji]], II, 171 (May 11, 1962; by Yang''s notes: two centers, streamlining and the production team; rehabilitation to go faster; the county committees'' core to be built)', units: A}
- cite: {id: cal.1962-05-11.china-leadership-2, item: '[[w.yang-shangkun-riji]], II, 171–172 (May 11, 1962; Liu sums up, the conference ends; by Yang''s notes: the targets lowered every year since 1958; the hardest time not past, save in places; trouble to be prepared for, martial law among the means; the heroes of adjustment above those of the Leap)', units: 'A, C, D'}
