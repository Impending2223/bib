- add:
    entry:
      id: cal.1968-04-02.elections-1968-humphrey-2
      when: Apr. 2
      date: '1968-04-02'
      thread: elections-1968-humphrey
      c: 'Monroney, of Oklahoma, telephones Humphrey: he fears a Kennedy blitz. Robert Kennedy has offered Fred Harris second place on the ticket and urged him to stand as Oklahoma''s favorite son, then withdraw in Kennedy''s favor; Harris, Monroney says, has held back, friendly to Humphrey.'
      n: '[[w.solberg-hubert-humphrey]], 324–25. To check: Humphrey, "Memo for record," Apr. 2, 1968, WHM u/p, Box 48, Humphrey Papers (cited by [[w.solberg-hubert-humphrey]], 324, its note). See [[cal.1968-04-02.elections-1968-2]]. Names: Monroney, Humphrey, Robert Kennedy, Fred Harris.'
