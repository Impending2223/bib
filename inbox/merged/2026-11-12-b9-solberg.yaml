      when: Apr. 2
      date: '1968-04-02'
      thread: elections-1968-humphrey
      c: 'At the congressional leadership breakfast, Hale Boggs and Russell Long take Humphrey aside: he should declare at once, "or Kennedy will wrap it up."'
      n: '[[w.solberg-hubert-humphrey]], 324. To check: Humphrey, "Notes on Mexico," n.d., WHM u/p, Box 48, Humphrey Papers (cited by [[w.solberg-hubert-humphrey]], 324, its note). See [[cal.1968-04-02.congress]]. Names: Boggs, Long, Humphrey.'
