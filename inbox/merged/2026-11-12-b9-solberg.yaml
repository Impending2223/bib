- cite:
    id: cal.1968-04-03.robert-kennedy
    item: '[[w.solberg-hubert-humphrey]], 325 (Kennedy asks to see Johnson, to ask whether the President meant to cut his throat; Johnson, on the request: "I won''t bother answering that grandstanding little runt"; Rostow and Charles Murphy attend and record; friendly; "You and I weren''t meant to be vice presidents"; no intention of dictating his successor; closer to the Vice President; "if I campaign for someone else, it will defeat what I am trying to do"; not Sorensen, the fund-raising dinners or the options)'
    units: '?'
