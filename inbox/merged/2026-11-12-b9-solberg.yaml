- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-24
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago-platform
      also:
      - vietnam
      c: 'Chicago, after Humphrey''s breakfast. Ginsburg, three hours more with Charles Murphy over the plank on Vietnam: Humphrey''s text, "Stop the bombing of North Vietnam. The action and its timing shall take into account the security of our troops and the likelihood of a response from Hanoi"; Johnson''s, the "when clause," "Stop all the bombing of North Vietnam when this action would not endanger the lives of our troops in the field; this action should take into account the response from Hanoi." Murphy calls the Ranch twice; Jim Jones stands against Humphrey''s wording both times.'
      n: '[[w.solberg-hubert-humphrey]], 353 (Ginsburg at lunch: "They played with these words, and the President at the other end of the line down on the ranch just hung on to every inch as if he had nothing else to do"). See [[cal.1968-08-26.elections-1968-chicago-platform]]. Names: Ginsburg, Charles Murphy, Humphrey, Johnson, Jones.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 353: all'
      tags:
      - name:humphrey-hubert-h
      - name:ginsburg-david
      - name:murphy-charles-s
      - name:jones-jim
      - name:johnson-lyndon-b
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-09-28.elections-1968-humphrey
      when: Sept. 28
      date: '1968-09-28'
      thread: elections-1968-humphrey
      c: 'The morning after Ball''s arrival. Humphrey, with Muriel Humphrey, who has broken off her campaigning in Idaho, to Berman at breakfast: "I''d kill myself to win if I thought I had a chance. But if I don''t have a chance, it''s no use." He will "go like hell for the next two weeks, see what happens," and if no better "take it easy and maybe go out two days a week."'
      n: '[[w.solberg-hubert-humphrey]], 381. To check: Edgar Berman, diary, Sept. 28, 1968, Berman files (cited by [[w.solberg-hubert-humphrey]], 381, its note). Check: the day; Solberg''s text gives none, the breakfast after the night of Ball''s arrival; his note, Berman''s diary of Sept. 28. See [[cal.1968-09-27.elections-1968]]. Names: Humphrey, Ball.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 381: all'
      tags:
      - name:humphrey-hubert-h
      - name:ball-george-w
