      when: Aug. 25, night
      date: '1968-08-25'
      thread: elections-1968-chicago-platform
      c: Chicago, late at night. Ginsburg to Humphrey's suite, crowded with newsmen and politicians; Humphrey takes him into a bedroom, closes the door, and they go over "the differences and their implications." Humphrey vows to stand firm.
      n: '[[w.solberg-hubert-humphrey]], 353. See [[cal.1968-08-25.elections-1968-chicago-9]]. Names: Ginsburg, Humphrey.'
