      id: cal.1967-06-02.middle-east-six-day-war-4
      when: June 2
      date: '1967-06-02'
      thread: middle-east-six-day-war
      c: ISA suggests working toward a compromise political settlement rather than a strong maritime declaration or a show
        of naval force.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 439. To check: Hoopes to McNamara, June 2, 1967, FRUS 1964–68, XIX, 261
        (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 439 n.47). See [[cal.1967-06-02.middle-east-six-day-war-3]].
        Names: McNamara. Check: the author; the page has "ISA," its note a memorandum of Hoopes for the Secretary.'
      tags:
      - name:mcnamara-robert-s
