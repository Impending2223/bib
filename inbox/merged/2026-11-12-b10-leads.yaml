    entry:
      id: cal.1967-06-02.middle-east-six-day-war-3
      when: June 2
      date: '1967-06-02'
      thread: middle-east-six-day-war
      c: 'The Joint Chiefs to McNamara, a longer-range scenario for naval action in the Red Sea, in response to ISA''s recommendation
        of May 28. A balanced American force would take 31 days to assemble; a probe before that would use the warships on
        hand, with little chance of survival against UAR air and sea attacks. Even the stronger option is unsound: carriers
        in restricted waters, naval units divided between the Red and Mediterranean seas. The Chiefs want a force off the
        Straits of Tiran, American and British carriers in the eastern Mediterranean, and merchant ships sent through the
        Straits one class at a time, non-Israeli, Israeli-owned and non-Israeli-flagged, Israeli-owned and flagged. If the
        Egyptians challenge it: "discriminating air and naval attacks against selected military targets to full-scale airstrikes
        against all UAR military targets."'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 438. To check: JCSM-310-67 for SecDef, June 2, 1967, NSC History of Middle
        East Crisis, vol. 3, box 18, NSF, LBJ Library; Poole, *The Joint Chiefs of Staff and National Policy, 1965–1968*,
        pt. 2, 560 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 438 n.46). See [[cal.1967-06-02.middle-east-six-day-war]].
        Names: McNamara.'
      tags:
      - name:mcnamara-robert-s
- add:
