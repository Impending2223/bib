    entry:
      id: cal.1968-08-17.health
      when: Aug. 17
      date: '1968-08-17'
      thread: health
      c: 'Johnson''s statement on signing the bill for a National Eye Institute in the National Institutes of Health, [82
        Stat. 771](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg771.pdf): more than 400,000 Americans blind,
        more than 30,000 losing their sight each year.'
      n: 'Statement by the President Upon Signing Bill Establishing the National Eye Institute, [1968–69 Pub. Papers 891](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=201)
        (Aug. 17, 1968; released at Austin). [[w.dallek-flawed-giant]], 552 (Aug. 17; 400,000 blind). See [[cal.1968-08-02.health]].
        Names: Johnson. Check: the day; the Papers'' note has the bill, H.R. 12843, approved Aug. 16.'
      tags:
