      thread: latin-america-dominican-republic
      c: 'Washington, noon. Kennedy with Bosch, President-elect of the Dominican Republic; Dungan and Martin present. Kennedy
        congratulates him; Bosch: the new government must prove to the people and the hemisphere that democracy works.'
      n: '[FRUS 1961–63, XII, doc. 353](https://history.state.gov/historicaldocuments/frus1961-63v12/d353) (memorandum of
