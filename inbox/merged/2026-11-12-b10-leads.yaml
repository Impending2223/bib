    entry:
      id: cal.1962-03-29.court
      when: Mar. 29
      date: '1962-03-29'
      time: 1962-03-29T16:00Z
      thread: court
      c: 'The President''s news conference, 11 a.m., the State Department Auditorium. Asked about the Supreme Court''s reapportionment
        decision and what the Federal Government could do to support it: the administration had endorsed the principles as
        a friend of the Court; not appropriate to comment on the merits of a case in litigation. "[T]he right to fair representation
        and to have each vote count equally is, it seems to me, basic to the successful operation of a democracy."'
      n: 'The President''s News Conference, [1962 Pub. Papers 271](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=331)
        (Mar. 29, 1962), at 274 (read on govinfo; the page [[w.schlesinger-robert-kennedy-and-his]], 398 n.29 gives), [American
        Presidency Project](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-203) (the twenty-ninth,
        the question and the answer read there). [[w.schlesinger-robert-kennedy-and-his]], 398 ("in his next press conference").
        See [[cal.1962-03-27.court]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
