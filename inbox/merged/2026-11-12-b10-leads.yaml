    entry:
      id: cal.1961-03.laos-3
      when: Mar.
      date: 1961-03
      thread: laos
      c: 'Kennedy, privately, to his own men, by Reeves''s account, after his public warnings on Laos: he does not intend
        to honor obligations in Laos; the talk and the troop movements are a bluff. If the United States must make a stand
        in Southeast Asia, it will be across the border, in Vietnam.'
      n: '[[w.reeves-president-kennedy]], 75 ("two days later," of the public warning after Mar. 23, is the warning, not the
        remark). To check: James Reston, interview; Collier and Horowitz, *The Kennedys*, 274; Rust, *Kennedy in Vietnam*,
        32–34 (cited by [[w.reeves-president-kennedy]], Source Notes, 75). See [[cal.1961-03-23.laos]]. Names: Kennedy. Check:
        the day and the month; Reeves gives no date, the remark told after the public warnings of Mar. 23 and two days later.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-11-29.civil-rights-bill-3
      when: Nov. 29
      date: '1963-11-29'
      time: 1963-11-29T17:04Z
      thread: civil-rights-bill
      c: 'Johnson to McCormack by telephone, on Smith and the civil rights bill in Rules. Johnson: "He won''t give you a hearing
        of any kind [before the recess]?" McCormack: "No." "He was frank about it. He won''t do anything to help [the bill]
        along."'
      n: '[[w.caro-passage-of-power]], 463 (the call and its words; the hour and Arends from the note). To check: transcript,
        "12:04 P.M. to John McCormack and Leslie Arends," Nov. 29, 1963, *The Presidential Recordings: Lyndon B. Johnson*,
        I, 252–53, 300 (cited by [[w.caro-passage-of-power]], Notes, 463). See [[cal.1963-11-22.civil-rights-bill-2]]; not
        the call of [[cal.1963-11-29.assassination-6]] (4:55 p.m., on Warren). Names: Johnson, McCormack, Smith. Check: the
        hour, from the transcript''s heading in Caro''s note, which names Arends as well.'
      tags:
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:smith-howard-w
