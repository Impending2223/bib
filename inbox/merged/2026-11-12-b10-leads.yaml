      id: cal.1964-09-07.vietnam-air-war
      when: Sept. 7
      date: '1964-09-07'
      thread: vietnam-air-war
      also:
      - laos
      c: 'Washington, the principals without the President. Wheeler presents a JCS proposal for "deliberately provocative
        actions" against North Vietnam, then a systematic bombing campaign of increasing severity. Taylor opposes it; the
        others agree. Systematic bombing might be needed "depending on GVN progress and Communist reaction in the meantime,"
        but not yet. They will recommend to Johnson limited actions to "show the Communists we mean business": naval patrols
        in the Tonkin Gulf and Oplan 34-A operations resumed, consultations with Souvanna Phouma for limited South Vietnamese
        operations in Laos, preparations "to respond on a tit-for-tat basis" to provocations.'
      n: '[[w.logevall-choosing-war]], 233–34 (the meeting of Sept. 7; the proposal, Taylor, the agreement, the actions).
        To check: William Bundy''s summary of the meeting, attached to McGeorge Bundy to Johnson, Sept. 8, 1964, [FRUS 1964–68,
        I, doc. 342](https://history.state.gov/historicaldocuments/frus1964-68v01/d342) (cited by [[w.logevall-choosing-war]],
        234 n.23). See [[cal.1964-09-06.vietnam-2]]. Names: Wheeler, Taylor, Souvanna Phouma.'
      tags:
      - name:wheeler-earle
      - name:taylor-maxwell
      - name:souvanna-phouma
- add:
    entry:
      id: cal.1964-12.europe-and-the-alliance-france
      when: Dec.
      date: 1964-12
      thread: europe-and-the-alliance-france
      also:
      - vietnam-diplomacy
      c: 'Paris. Rusk calls on de Gaulle. Rusk: Communists cannot be trusted and can never be neutral. De Gaulle: neutralization
        is working, imperfectly, in Cambodia and Laos, and no one can be sure it would not work in Vietnam; America cannot
        win militarily in the region and should learn from the French experience in Indochina and Algeria and "eliminate this
        area from the Cold War."'
      n: '[[w.logevall-choosing-war]], 280 ("in mid December"). To check: Rusk to LBJ, Dec. 16, 1964, NSF CF, box 170, LBJ
        Library; Couve–Rusk meeting notes, Dec. 17, 1964, Quai d''Orsay (cited by [[w.logevall-choosing-war]], 280 n.49).
        Names: Rusk, de Gaulle. Check: the day; Logevall has "mid December," his note a report of Dec. 16 and meeting notes
        of Dec. 17.'
      tags:
      - name:rusk-dean
      - name:de-gaulle-charles
- add:
    entry:
      id: cal.1964-12.vietnam-diplomacy
      when: Dec.
      date: 1964-12
      thread: vietnam-diplomacy
      also:
      - press-and-broadcasting
      - europe-and-the-alliance-france
      c: 'Walter Lippmann, back from Paris and de Gaulle, summoned to the Oval Office. Johnson asks about de Gaulle''s neutralization
        plan: could it prevent a Communist takeover of the entire country? Lippmann: no other choice; it would take a million
        Americans to pacify the country, and a lasting military victory could never be achieved. Johnson, doubtful: "This
        is a commitment I inherited. I don''t like it, but how can I pull out?"'
      n: '[[w.logevall-choosing-war]], 280 ("Upon his return from Paris"). To check: Ronald Steel, *Walter Lippmann and the
        American Century*, 555–56; Lippmann''s column, *Washington Post*, Dec. 22, 1964 (cited by [[w.logevall-choosing-war]],
        280 n.50). See [[cal.1964-12.europe-and-the-alliance-france]]. Names: Lippmann, Johnson. Check: the day; Logevall
        places the Paris talk in mid December and the summons on his return.'
      tags:
      - name:lippmann-walter
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-01.japan
      when: Jan.
      date: 1965-01
      thread: japan
      also:
      - vietnam-diplomacy
      c: 'Satō, after the talks in Washington, to a group of reporters: the solution for Vietnam must lie with Asians, not
        westerners; the western world''s "rational approach" would fail to resolve it.'
      n: '[[w.logevall-choosing-war]], 336–37 ("After the meetings"; the visit "mid-January"; not the gloss on the Asian mind,
        which is Logevall''s). To check: *Washington Post*, Jan. 13, 1965, among the sources of [[w.logevall-choosing-war]],
        337 n.5. See [[cal.1965-01-12.japan-and-korea]]. Names: Satō. Check: the day; Logevall has no day, only after the
        talks of Jan. 12–13.'
      tags:
      - name:sato-eisaku
- add:
    entry:
      id: cal.1965-04-21.vietnam-4
      when: Apr. 21
      date: '1965-04-21'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Chester Cooper to Johnson: the honeymoon after the Johns Hopkins speech is over. The administration''s propaganda
        position is hurt by the comments of Lippmann, Kennan, Galbraith and Fulbright, the student demonstrations, the unhelpful
        comments of France and Canada, and the "worldwide fear of war," especially in India and Japan.'
      n: '[[w.logevall-choosing-war]], 372 (Cooper''s memorandum, by Logevall''s account; "honeymoon period" is his phrase,
        not Cooper''s quoted). To check: Cooper to LBJ, Apr. 21, 1965, NSF VN, box 16, LBJ Library (cited by [[w.logevall-choosing-war]],
        372 n.94). See [[cal.1965-04-11.vietnam-congress]]. Names: Cooper, Lippmann, Kennan, Galbraith, Fulbright, Johnson.'
      tags:
      - name:cooper-chester-l
      - name:lippmann-walter
      - name:kennan-george-f
      - name:galbraith-john-kenneth
      - name:fulbright-j-william
      - name:johnson-lyndon-b
