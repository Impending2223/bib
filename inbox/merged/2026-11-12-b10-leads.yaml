      when: June 2
      date: '1967-06-02'
      thread: middle-east-six-day-war
      c: Later in the day, the crisis perhaps lengthening, the Joint Chiefs let the Sixth Fleet make port calls for upkeep,
        subject to curtailment on short notice.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 439 (after Evron''s word to Rostow; with it the Pentagon''s command center
