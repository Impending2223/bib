      id: cal.1960-11-09.elections-1960-count-3
      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960-count
      c: 'The Cabinet, the day after the election. Gates, on the election: "It was certainly no mandate from the people."'
      n: '[[w.watson-into-the-missile-age]], 771 ("the day after the election"). To check: Robert Keith Gray, *Eighteen Acres
        Under Glass*, 325, with the *New York Times* of Nov. 9 and 10, 1960 (cited by [[w.watson-into-the-missile-age]], 771
        n.180). Check: the meeting; Watson has "a cabinet meeting," from Gray, the Cabinet Secretary; the President''s conference
        on the gold the same day, Gates present, is [[cal.1960-11-09.economy]]. See [[cal.1960-11-08.elections-1960]]. Names:
        Gates.'
      tags:
      - name:gates-thomas-s-jr
