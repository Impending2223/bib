- add:
    entry:
      id: cal.1968-08-06.elections-1968-6
      when: Aug. 6
      date: '1968-08-06'
      thread: elections-1968
      c: 'Humphrey''s and McCarthy''s spokesmen agree on a televised debate: an hour, in three parts, foreign affairs, domestic problems, each man''s idea of the Presidency. Humphrey''s aides: Aug. 23 or 24. Blair Clark: "the dates aren''t all that certain."'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2177. Names: Humphrey, McCarthy.'
      tags:
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-08-08.elections-1968
      when: Aug. 8
      date: '1968-08-08'
      thread: elections-1968
      c: 'Waverly, Minn., at his home. Humphrey: Nixon and Agnew "a strong ticket"; the voters "a clear choice"; Agnew "a rather significant compromise," Maryland a border State.'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2177. Names: Humphrey, Nixon, Agnew.'
      tags:
      - name:humphrey-hubert-h
      - name:nixon-richard-m
      - name:agnew-spiro-t
      - state:mn
- add:
    entry:
      id: cal.1968-08-12.elections-1968-4
      when: Aug. 12
      date: '1968-08-12'
      thread: elections-1968
      also:
      - king-poor-peoples
      c: 'Atlanta. Abernathy, back from Miami Beach: Humphrey to resign as Vice President, to run "as the true Hubert H. Humphrey."'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2178. Names: Abernathy, Humphrey.'
      tags:
      - name:abernathy-ralph-david
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-08-04.elections-1968
      when: Aug. 4
      date: '1968-08-04'
      thread: elections-1968
      c: Blatnik, O'Hara and Jim Wright form the Congressmen for Humphrey for President Committee. CQ lists some seventy House Democrats for Humphrey.
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2178 Check: the count of the list. Names: Blatnik, O''Hara, Humphrey.'
      tags:
      - name:blatnik-john-a
      - name:ohara-james-g
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-08-11.democratic-party
      when: Aug. 11
      date: '1968-08-11'
      thread: democratic-party
      also:
      - elections-1968
      c: 'Sacramento. McCarthy''s reforms of the party, for the convention: national conventions every two years; national committeemen and committeewomen elected in the primaries; the committee to meet around the country, with staff "to hold hearings"; the national chairman in his administration "an important participant." "Since 1952 ... an empty shell."'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2178. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-08-08.elections-1968-2
      when: Aug. 8
      date: '1968-08-08'
      thread: elections-1968
      c: 'Washington, a news conference. McCarthy: "the choice of Nixon is a proper choice. He is truly a Republican candidate."'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2178–79. Names: McCarthy, Nixon.'
      tags:
      - name:mccarthy-eugene-j
      - name:nixon-richard-m
