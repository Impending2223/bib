      date: '1968-08-09'
      thread: republican-party
      c: Miami Beach. The new Republican National Committee re-elects Bliss chairman for four years, unanimously, at Nixon's wish, his salary from $30,000 to $40,000; Stans chairman of the Finance Committee, for Lucius Clay, who resigned that week; Middendorf treasurer again.
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2180. Names: Bliss, Nixon, Stans, Clay, Middendorf.'
