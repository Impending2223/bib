      date: '1968-08-09'
      thread: elections-1968
      c: 'Miami Beach. Nixon on Agnew: "the toughest political decision I ever made"; Volpe next to last; Agnew for "brains" and "city stuff"; Reagan and Lindsay not asked, "presumptuous." The South: "They talk of the South as racist. That''s bunk." His trip to the Soviet Union put off until after the election.'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2180–81. Names: Nixon, Agnew, Volpe, Reagan, Lindsay.'
