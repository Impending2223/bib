- add:
    entry:
      id: cal.1968-08-11.elections-1968
      when: Aug. 11
      date: '1968-08-11'
      thread: elections-1968
      also:
      - robert-kennedy
      c: 'NBC''s *Meet the Press*. McGovern: "at least a fighting chance" that a third candidate can emerge; no "stalking horse" for Edward Kennedy; from the top aides of both Kennedys "a very clear green light." No fourth party; not interested in the vice presidency, though he would not refuse it.'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2175. Names: McGovern, Edward Kennedy.'
      tags:
      - name:mcgovern-george
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1968-08-12.elections-1968-2
      when: Aug. 12
      date: '1968-08-12'
      thread: elections-1968
      also:
      - vietnam-paris
      c: 'McGovern to editors and reporters of the *New York Times*, published Aug. 13: a plank for a halt to the bombing of North Vietnam and a broader government in Saigon, the NLF, Buddhists and others in a coalition; the bombing has not achieved its military objectives. He hopes for 200 to 250 delegates before the convention opens Aug. 26.'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2175. Names: McGovern.'
      tags:
      - name:mcgovern-george
- add:
    entry:
      id: cal.1968-08-13.elections-1968-2
      when: Aug. 13
      date: '1968-08-13'
      thread: elections-1968
      c: 'New York. McGovern with John J. Burns, the State chairman, at the head of its 190-vote delegation, once for Robert Kennedy: Burns still "uncommitted." In Bedford-Stuyvesant McGovern meets some 40 Negro and white ministers and community leaders.'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2175. Names: McGovern.'
      tags:
      - name:mcgovern-george
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-08-14.elections-1968
      when: Aug. 14
      date: '1968-08-14'
      thread: elections-1968
      also:
      - elections-1968-polls
      c: 'UPI''s count of the first ballot, all but 11½ of the 2,622 votes placed: Humphrey 1,056½, 255 short of the 1,312 needed; McCarthy 428; McGovern 31; Wallace 16½; uncommitted 578½; favorite sons 500. About half Humphrey''s total from private preferences.'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2176 Check: the Wallace of the count (CQ gives no first name). Names: Humphrey, McCarthy, McGovern.'
      tags:
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
      - name:mcgovern-george
- add:
    entry:
      id: cal.1968-08-15.democratic-party
      when: Aug. 15
      date: '1968-08-15'
      thread: democratic-party
      also:
      - elections-1968-chicago
      c: 'The Democratic National Committee''s revised count for the convention: 177 Negro delegates, 136 Negro alternates.'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2177.'
- add:
    entry:
      id: cal.1968-08-11.elections-1968-2
      when: Aug. 11
      date: '1968-08-11'
      thread: elections-1968
      also:
      - vietnam-paris
      c: 'ABC''s *Issues and Answers*. Humphrey: the Paris talks "at a very serious stage"; no problem in halting the bombing "if we have some kind of restraint or response from North Vietnam"; "reciprocity" taken as "a rather hard and harsh word." Running mates named: Richard Hughes, Muskie, Bayh, Fred Harris, Alioto; the Vice President "a sort of super Cabinet officer." His first-ballot count about 1,600; McGovern''s entry no "appreciable effect."'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2177–78. Names: Humphrey, Richard Hughes, Muskie, Bayh, Harris, Alioto, McGovern.'
      tags:
      - name:humphrey-hubert-h
      - name:hughes-richard-j
      - name:muskie-edmund-s
      - name:bayh-birch
      - name:harris-fred-r
      - name:alioto-joseph-l
      - name:mcgovern-george
- add:
    entry:
      id: cal.1968-07-27.elections-1968-5
      when: July 27
      date: '1968-07-27'
      thread: elections-1968
      also:
      - vietnam-paris
      c: 'Humphrey to Clark Kerr, of the National Committee for a Political Settlement in Vietnam: its eight-point program endorsed with "one measure of elaboration": the bombing to "be terminated as reciprocity is obtained from North Vietnam."'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2177. Names: Humphrey, Kerr.'
      tags:
      - name:humphrey-hubert-h
      - name:kerr-clark
- add:
    entry:
      id: cal.1968-08-12.elections-1968-3
      when: Aug. 12
      date: '1968-08-12'
      thread: elections-1968
      also:
      - vietnam-paris
      c: 'Humphrey to Kerr again: "restraint and reasonable response" for "reciprocity," a word "unfortunately ... interpreted as a harsh or rigid word."'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2177 See [[cal.1968-07-27.elections-1968-5]]. Names: Humphrey, Kerr.'
      tags:
      - name:humphrey-hubert-h
      - name:kerr-clark
