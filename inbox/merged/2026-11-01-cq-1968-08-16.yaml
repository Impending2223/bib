      when: Aug. 10
      date: '1968-08-10'
      thread: elections-1968
      c: 'Sacramento, a news conference. McCarthy: Nixon "will make it easier" to support the Democratic nominee; McGovern''s candidacy "no significant effect"; "I would rather have had his endorsement."'
      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2179. Names: McCarthy, Nixon, McGovern.'
      tags:
      - name:mccarthy-eugene-j
      - name:nixon-richard-m
      - name:mcgovern-george
