  - add:
      entry:
        id: cal.1963-07-06.china-leadership-2
        when: July 6
        date: '1963-07-06'
        thread: china-leadership
        also: [soviet-union]
        c: 'Moscow 莫斯科, from 10 a.m. The first meeting of the Chinese and Soviet parties'' talks. Suslov 苏斯洛夫 welcomes the Chinese delegation and speaks on five questions: the strength and unity of the socialist system; peace and peaceful coexistence against the imperialist camp led by the United States; national liberation and the socialist states'' support for it; general questions of the theory of world revolution today; the unity of the international communist movement. A twenty-minute break after the third; translation then by passages, not simultaneous. He speaks to 2:40 p.m., five hours. No afternoon session; the Chinese to speak on Monday.'
        n: '[[w.yang-shangkun-riji]], II, 293–294 (July 6, 1963). The words: 10点钟开始会谈……苏一直讲到2时40分，共花了5个钟头 (II, 293). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Suslov.'
        src:
          c: 7e9680db
          rows: ['w.yang-shangkun-riji II, 293–294: all']
        tags: ['polity:prc', 'name:suslov-mikhail-a', 'vis:only:prc+ussr']
        time: 1963-07-06T07:00Z
        time_zone: Europe/Moscow
