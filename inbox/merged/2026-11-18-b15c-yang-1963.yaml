  - add:
      entry:
        id: cal.1963-07-05.china-leadership-4
        when: July 5
        date: '1963-07-05'
        thread: china-leadership
        also: [soviet-union]
        c: Peking 北京 to Moscow 莫斯科. The Chinese delegation, Yang Shangkun 杨尚昆 with it, flies from Peking at 7:40 a.m., by Irkutsk 伊尔库茨克 (11:15) and Omsk 鄂木斯克 (3:30 p.m.), an hour or more at each, and reaches Moscow at 7:40 p.m. Peking time, 2:40 p.m. there. Suslov 苏斯洛夫, Grishin 格里申, Ilyichev 伊利切夫, Ponomarev 波诺马廖夫, Andropov 安德罗波夫, Satyukov 萨丘科夫 and Chervonenko 契尔沃年科, the embassy, students and the women's delegation, some 150 in all, meet it.
        n: '[[w.yang-shangkun-riji]], II, 292–293 (July 5, 1963). The words: 7:40由北京起飞……19:40到达莫斯科(当地时间为下午2:40) (II, 292). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Suslov, Grishin, Ilyichev, Ponomarev, Andropov, Satyukov, Chervonenko.'
        src:
          c: 1d2a368c
          rows: ['w.yang-shangkun-riji II, 292–293: all']
