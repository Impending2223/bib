- edit:
    id: cal.1960-07-22.elections-1960
    base: 61e806ca
    set:
      c: 'Nixon flies to New York to see Rockefeller at his Fifth Avenue apartment, the night of July 22. Their statement,
        July 23, fourteen points: the platform''s civil rights and defense planks redrawn in Chicago. Goldwater: "the Munich
        of the Republican Party." By Nixon''s account, he offers Rockefeller second place; declined.'
      n: 'The convention: [[w.white-making-of-the-president]]. [[w.perlstein-before-the-storm]], 81–85; [[w.young-two-suns-of-the]],
        27 (the meeting at Rockefeller''s New York home, July 22; Goldwater''s "Munich"). [[w.kallina-kennedy-v-nixon]], 91–92
        (the meeting; the fourteen points); [[w.nixon-rn]], 215 (the meeting in New York, July 22; the offer). To check: New
        York Times, July 24, 1960 (the Compact of Fifth Avenue made public) (cited by [[w.perlstein-before-the-storm]], 84
        n.1); New York Times, July 24, 1960 (Goldwater''s press conference) (cited by [[w.perlstein-before-the-storm]], 85
        n.2); Press release of Goldwater''s "Munich" statement (cited by [[w.perlstein-before-the-storm]], 85 n.3); [[w.smith-on-his-own-terms]];
        [[w.persico-imperial-rockefeller]]; [[w.kabaservice-rule-and-ruin]]; [[w.gifford-center-cannot-hold]]; [[w.pietrusza-1960]];
        [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]; [[w.nixon-six-crises]]; The Reminiscences of
        Robert Merriam, Mar. 3, 1969, Columbia University Oral History Collection; Robert Merriam Papers, Republican Party
        Platform, July 1960, Eisenhower Library (cited by [[w.kallina-kennedy-v-nixon]], 92 n.27). Names: Nixon, Rockefeller,
        Goldwater.'
