      thread: republican-party
      also:
      - cuba
      c: 'Chicago, the Executives Club. Nixon''s first speech against the administration: criticism to be "responsible and
        constructive"; the worst of the failure in Cuba that it "may discourage American policymakers from taking decisive
        steps in the future." "We should not start things in the world unless we are prepared to finish them."'
