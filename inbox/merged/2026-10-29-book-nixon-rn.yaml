      thread: cuba-bay-of-pigs
      also:
      - republican-party
      c: 'Washington, Nixon''s house, after 7:30 p.m., by Nixon''s account. Allen Dulles, come to brief him for a speech:
        "Everything is lost. The Cuban invasion is a total failure." Two of the three air strikes canceled at the last. Dulles:
        he should have told the President "that we must not fail"; "It was the greatest mistake of my life."'
      n: '[[w.nixon-rn]], 232–33. See [[cal.1960-03-17.cuba]]. Names: Nixon, Dulles.'
