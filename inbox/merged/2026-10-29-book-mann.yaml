- edit:
    id: cal.1961-05-25.vietnam-johnson-asia
    base: aa25a586
    set:
      n: '[[w.gibbons-u-s-government-and]], II, 46; [[w.mann-grand-delusion]], 239 (the bully; the troops). To check: *Executive
        Sessions of the Senate Foreign Relations Committee (Historical Series)*, XIII, pt. 1, 629–51 (cited by [[w.gibbons-u-s-government-and]],
        II, 46 n.118, and [[w.mann-grand-delusion]], 239 n.17, at 633). See [[cal.1961-05-23.vietnam-johnson-asia]]. Names:
        Johnson.'
      c: 'Johnson reports on his trip to 57 Senators, Foreign Relations the host: a "major effort" in Southeast Asia, knowing
        it may later mean withdrawing or committing major forces. "If a bully can come in and run you out of the yard today,
        tomorrow he will come back and run you off the porch." Laos: "I don''t think anything is going to come out of the
        conference." American troops "not desirable": "Asian leaders at this time do not want American troops involved in
        Southeast Asia, other than on training missions."'
