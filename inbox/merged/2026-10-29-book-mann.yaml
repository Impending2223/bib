      c: 'The 545th NSC, 7:45 to 9 p.m., on reprisal for Pleiku, McCormack and Mansfield present. Mansfield: "We are not now
        in a penny ante game"; the people of the South "not behind us"; caution "our watchword"; what government had cleared
        it? A war with China, the Soviet-Chinese split healed, "worse than Korea." Johnson: "cowardice has gotten us into
        more wars than response has." The strikes authorized.'
      n: 'FRUS 1964–68, II, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v02/d76) (summary notes);
        [77](https://history.state.gov/historicaldocuments/frus1964-68v02/d77) (memorandum for the record). [[w.mann-grand-delusion]],
        394–95. Check: Mann dates the meeting the evening of Feb. 7. See [[cal.1965-02-07.vietnam]]. Names: McCormack, Mansfield,
        Johnson.'
