- add:
    entry:
      id: cal.1964-03-21.vietnam-congress
      when: Mar. 21
      date: '1964-03-21'
      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'The *New York Times*''s survey of the Senate: most "reluctantly support the present Administration policy for lack
        of acceptable alternatives"; against withdrawal, and against advisers in combat. Mansfield: the "only feasible choice";
        "this is a Vietnamese war and it must be won by the Vietnamese"; "plenty of debating on Vietnam before the year is
        out." Fulbright: "I don''t think senators spouting off helps the situation." Margaret Chase Smith: "We should either
        pull out and stop losing our men over there, or we should go in and clean up."'
      n: '[[w.mann-grand-delusion]], 323. To check: *New York Times*, Mar. 21, 1964, John D. Morris''s survey (cited by [[w.mann-grand-delusion]],
        323 nn.4, 5). Check: Mann puts the survey "in late March." Names: Mansfield, Fulbright, Margaret Chase Smith.'
      tags:
      - name:mansfield-mike
      - name:fulbright-j-william
      - name:smith-margaret-chase
      src:
        c: 7538569f
        rows:
        - 'w.mann-grand-delusion 323: all'
        - 'via w.mann-grand-delusion 323 n.4: D'
        - 'via w.mann-grand-delusion 323 n.5: A-C'
