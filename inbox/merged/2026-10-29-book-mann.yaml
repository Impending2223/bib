- add:
    entry:
      id: cal.1966-06-02.vietnam-congress
      when: June 2
      date: '1966-06-02'
      thread: vietnam-congress
      c: 'Johnson and Russell by telephone, 8:05 p.m. Johnson: "a pretty disastrous poll coming up on Vietnam," 35 or 36 percent
        for getting out. Russell: "Well, you''re going have to do something different out there. If you don''t you''re going
        eventually get in trouble"; push "a little bit harder." No real government in Saigon, he thinks, any more than in
        Santo Domingo.'
      n: '[FRUS 1964–68, IV, doc. 151](https://history.state.gov/historicaldocuments/frus1964-68v04/d151) (editorial note,
        from the recording). [[w.mann-grand-delusion]], 513. To check: [Johnson and Russell, 8:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-june-3-1966),
        Conversation WH6606-01-10204 (Miller Center), not heard. Names: Johnson, Russell.'
