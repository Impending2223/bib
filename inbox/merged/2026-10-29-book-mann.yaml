      when: Mar. 26
      date: '1964-03-26'
      thread: vietnam-congress
      c: 'Morse in the Senate, after McNamara''s testimony that morning: "even more unsound than I thought he could concoct
        by way of a chain of fallacies." A Marine Corps officer "of substantial rank" has told him of his "complete agreement":
        "We are acting as though we are not at war, but we are killing men as though we were at war." The only foreign soldiers
        in South Vietnam American.'
      n: '[110 Cong. Rec. 6468–69](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt5/pdf/GPO-CRECB-1964-pt5-7-2.pdf)
        (1964). [[w.mann-grand-delusion]], 323–24. See [[cal.1964-03-26.vietnam-congress]]. Names: Morse, McNamara.'
      tags:
