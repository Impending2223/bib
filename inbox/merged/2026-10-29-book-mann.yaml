    set:
      n: '[111 Cong. Rec., Senate, Sept. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-2-1.pdf);
        [111 Cong. Rec., House, Sept. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-5-1.pdf).
        [[w.gibbons-u-s-government-and]], IV, 38–41 (the speech''s making; Fulbright''s note to Johnson the same morning;
        his loss of access). [[w.mann-grand-delusion]], 473–74 (the speech; the letter). To check: [[w.fulbright-arrogance-of-power]];
        [[w.woods-fulbright]]; [[w.lowenthal-dominican-intervention]]. See [[cal.1965-04-28.latin-america]]; [[cal.1965-09-03.latin-america]].
        Names: Fulbright, Selden.'
      c: 'Fulbright in the Senate on the Dominican intervention, from his committee''s hearings: policy "characterized initially
        by overtimidity and subsequently by overreaction," and throughout "by a lack of candor"; the decision that the revolt
        "should not be allowed to succeed" rested on "exaggerated estimates of Communist influence." Sept. 20, the House,
        on Selden''s H. Res. 560, [312–52](https://voteview.com/rollcall/RH0890160): an American state may meet Communist
        subversion in the hemisphere "so far as resort to armed force." Saving lives "more a pretext than a reason for the
        massive U.S. intervention"; the response "to intervene forcibly and illegally against a revolution." His letter to
        Johnson, sent ahead: he takes exception to "the faulty advice that was given to you."'
      src:
        c: 6d4cd0ce
        rows:
