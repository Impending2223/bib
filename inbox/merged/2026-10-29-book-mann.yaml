        Aug. 11, 1967). [[w.gibbons-u-s-government-and]], IV, 758–59. [[w.mann-grand-delusion]], 554. Names: Javits, Clark,
        Case, McGovern.'
      c: 'Javits in the Senate: "an imperative need to reassess our commitment"; the momentum threatens "a full-blown colonial
        venture." South Vietnam''s elections to begin the end of the commitment; the bombing ended or held to the routes near
        the DMZ. Clark welcomes him "to the ranks of the ''nervous nellies'' and the ''doves.''" Case: "is the Johnson administration
        blind to the signs of growing public unrest?" McGovern: the 45,000 more "perhaps the most significant—turning point,"
        taking the country "more deeply into the war."'
