        (412).'
      c: 'The White House briefing for members of Congress, after Church''s speech for a negotiated settlement: Johnson backs
        Church into a corner of the dining room for an hour, "to show me my error," by Church''s account; the story Johnson
        gives a reporter the next day: "The next time you want a dam in Idaho, Frank, go see Walter." Johnson opens with a
        Senator who "predicted ... that there would be no war in Europe," Borah. Mansfield, at the reception: "Frank, I was
        expecting you to speak up." McCarthy, leaving: "If Frank Church had just surrendered, we all could have gone home
        thirty minutes ago." By Church''s account.'
