      date: '1964-05-15'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'The 532d NSC, noon, the bipartisan congressional leaders invited. McNamara on his trip: the situation worse, the
        Viet Cong holding the initiative. Johnson: the situation "deteriorating," "extremely alarmed." Saltonstall asks whether
        Americans will fight; McNamara: not in combat except in training the Vietnamese.'
