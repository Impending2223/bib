    base: d126b7ea
    set:
      n: '[110 Cong. Rec. 14,790–96](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-5-2.pdf)
        (1964). [[w.gibbons-u-s-government-and]], II, 276. [[w.mann-grand-delusion]], 338–40 (the speech; Humphrey; Morse).
        Check: Gibbons, II, 276, dates the speech June 26. Names: Church, Fulbright, Humphrey, Morse. Check: Mann dates it
        June 23, and gives Church, not Fulbright, "our determined support [of Saigon] at this time is indispensable."'
      c: 'Church in the Senate, on the UN: upheaval in Africa and Asia "not likely to be assuaged for long through the unilateral
        intervention of any white nation"; the UN as "honest broker" in Indochina. Fulbright: not while Saigon is so weak;
        "our determined support at this time is indispensable." Then ten minutes on Vietnam: twenty-five thousand hard-core
        Viet Cong supplied by runners; "how on earth will the situation be improved by extending the war to the north?"; "Expanding
        the war is not getting out. ... It is getting further in." Humphrey: no escalation; the issue to the UN. Morse: "We
        are making war in South Vietnam, and we are making it unconstitutionally"; a choice in November "between a slower-paced
        Democratic war and a faster-paced Republican war."'
