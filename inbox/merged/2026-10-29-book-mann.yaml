        Names: Humphrey, Ball, McNamara, Thompson, Kosygin.'
      c: 'Qui Nhơn. A Viet Cong bomb wrecks a hotel billeting American enlisted men: 23 killed. Humphrey, Ball and Thompson
        ask that reprisal wait until Kosygin has left the area; McNamara and most of the others for striking at once. Flaming
        Dart II, Feb. 11: Navy planes from the *Hancock*, *Coral Sea* and *Ranger* hit Chánh Hòa, just north of the demilitarized
        zone; American and South Vietnamese planes, the barracks at Chấp Lễ. Humphrey, asked by Johnson: "I don''t think we
        should."'
