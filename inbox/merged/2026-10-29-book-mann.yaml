    base: 75c2a443
    set:
      n: '[[w.gibbons-u-s-government-and]], II, 312. [[w.mann-grand-delusion]], 372–73. Names: Taylor, Morse, Nguyễn Khánh.'
      c: 'Taylor before Foreign Relations in executive session. Morse asks whether Khánh consulted him before the raids on
        the islands of July 30; Taylor: "Any specific action of that sort I would not be counselled about." Taylor: "That
        is not the time for anyone to become fainthearted and say we cannot win." Would he object to American advisers going
        with South Vietnamese units into the North? Not "if it is in the interest of American policy." Morse: "I am more convinced
        than ever that our policy in Vietnam is against America''s public interest."'
