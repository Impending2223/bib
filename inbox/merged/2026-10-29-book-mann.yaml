        Hickenlooper, Smathers, Kuchel, Long, McCormack, Ford, Arends, Boggs, Albert. Check: Mann, 455, leaves Kuchel out.'
      c: 'The NSC: troops to Vietnam, no reserves called, no emergency declared, money asked later. That evening, the congressional
        leaders; Mansfield reads a statement of his doubts. Present at the leaders'' meeting: Senators Mansfield, Dirksen,
        Hickenlooper, Smathers, Kuchel and Long, Representatives McCormack, Ford, Arends, Boggs and Albert. Long: "Should
        we put in more men or take a whipping? We''d better go in." Dirksen: make the country realize this is "dangerous,
        serious business." Mansfield''s statement, by his notes: "whatever the basic commitment, it was abrogated with the
        assassination of Diem"; "escalation begets escalation."'
