- add:
    entry:
      id: cal.1962-06-10.vietnam-congress
      when: June 10
      date: '1962-06-10'
      thread: vietnam-congress
      c: 'Mansfield''s commencement address at Michigan State, East Lansing, Mich.: "events appear to be moving in Southeast
        Asia toward a point of critical decision." The SEATO allies unwilling or unable to bear the burdens. South Vietnam
        "more, rather than less, dependent" on American aid after years of it. The interests in Southeast Asia "limited,"
        the policy of "minimum involvement" turned "about 180°" to "very deep involvement and enormous cost"; at worst "a
        possible conflict of indefinite depth and duration." Inserted in the Record June 11.'
      n: '[108 Cong. Rec. 10,047–50](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt8/pdf/GPO-CRECB-1962-pt8-1-2.pdf)
        (1962) (June 11; the address, "on yesterday"). [[w.mann-grand-delusion]], 262–64, 266. Names: Mansfield.'
      tags:
      - name:mansfield-mike
      src:
        c: 5f7a587d
        rows:
