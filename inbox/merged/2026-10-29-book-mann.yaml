      - vietnam-congress
      c: 'Press conference. Asked of Mansfield''s call for a review of Far Eastern policy: "we should constantly review,"
        judge "between what is essential to our interest and what is marginal." "I know Senator Mansfield does not think we
        should withdraw, because a withdrawal in the case of Viet-Nam and in the case of Thailand might mean a collapse of
        the entire area."'
