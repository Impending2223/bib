      c: 'Mansfield to Kennedy, "Observations on Viet Nam": whether to support Diệm "the secondary or tactical question";
        the question "of which way is likely to be least costly in American lives and money." "We have talked ourselves and
        ''agencied'' ourselves" into the premise that Vietnam matters as much to us as to the Vietnamese; it is "peripheral"
        to American interests. Not "countless American lives and billions of dollars to maintain an illusion of freedom in
        a devastated South Viet Nam."'
