- edit:
    id: cal.1962-02-13.republican-party
    base: bd6d0825
    set:
      n: 'The charge as put to Kennedy the next day: The President''s News Conference of February 14, 1962, [1962 Pub. Papers
        134](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=194) (Feb. 14, 1962), question
        9. [[w.moyar-triumph-forsaken]], 145 n.85, 443 (the charge; the 4,000 and the 685). [[w.selverstone-kennedy-withdrawal]],
        60 (the charge and the call, as the *New York Times* reported them). [[w.mann-grand-delusion]], 257 (*Battle Line*;
        the questions). To check: *New York Times*, Feb. 14, 1962 (cited by [[w.moyar-triumph-forsaken]], 145 n.85); Jack
        Raymond, "G.O.P. Asks Candor on Vietnam War," *New York Times*, Feb. 14, 1962, 1; James Reston, "The Undeclared War
        in South Vietnam," *New York Times*, Feb. 14, 1962, 34 (cited by [[w.selverstone-kennedy-withdrawal]], 60 n.44); *Newsweek*,
        Feb. 26, 1962 (cited by [[w.mann-grand-delusion]], 257 n.9). Reply: [[cal.1962-02-14.vietnam]]. Check: the publication''s
        title and day. Check: the day (Selverstone gives Feb. 13; the *Times* reports it Feb. 14). Check: Mann names the weekly
        *Battle Line*, of "the day before" Reston''s article of Feb. 14.'
      c: 'The Republican National Committee''s publication: Kennedy "less than candid" with the American people on how deeply
        the United States is involved in Vietnam. By the *New York Times*''s report, it asks whether 4,000 Americans are there,
        not the 685 the administration admits. Kennedy to "drop the pretense that the United States is merely acting as military
        adviser to South Vietnam." By Mann''s account the weekly *Battle Line*: "Is the country moving toward another Korea
        which might embroil the entire East?" The people not to wait "until American casualty lists are posted."'
      src:
        c: 2e1a6bb9
