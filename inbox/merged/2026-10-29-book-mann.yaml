      when: Nov. 30–Dec. 2
      date: '1962-11-30'
      thread: vietnam-congress
      c: 'Mansfield in Saigon, with Pell, Boggs and Benjamin Smith, on a trip of forty-five days. Nolting and Harkins hopeful;
        Trueheart: the government "essentially a dictatorship." Diệm talks two and a half hours of the strategic hamlets;
        Trần Lệ Xuân takes Mansfield to task for the Michigan State speech. Mansfield hears the American correspondents, Halberstam,
        Sheehan, Browne and Arnett among them, and at the airport declines the embassy''s statement, praising Diệm alone.'
      n: '[[w.mann-grand-delusion]], 270–73. To check: the briefing''s summary, Nov. 30, 1962; Mansfield''s memorandum, Dec.
        2, 1962; the memorandum of conversation with Nhu, Dec. 1, 1962; the proposed statement, Dec. 2, 1962, XXII, 53, 95,
        96, Mansfield Papers (cited by [[w.mann-grand-delusion]], 270 n.1, 271 nn.3, 6, 272 nn.7, 10); [[w.gibbons-u-s-government-and]],
        II, 131. Report: [[cal.1962-12-18.vietnam-congress]]. Names: Mansfield, Pell, Boggs, Benjamin Smith, Nolting, Harkins,
        Trueheart, Ngô Đình Diệm, Trần Lệ Xuân, Halberstam, Sheehan, Browne, Arnett.'
