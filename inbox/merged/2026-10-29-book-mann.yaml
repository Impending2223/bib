        [96](https://history.state.gov/historicaldocuments/frus1964-68v03/d96). [[w.gibbons-u-s-government-and]], III, 424–31;
        [[w.drea-mcnamara-clifford-and-the-2011]], 46 (the NSC; the leaders); [[w.poole-joint-chiefs-of-staff-2012]], 43 (no
        reserves); [[w.cosmas-joint-chiefs-of-staff-2012]], 309 (the NSC''s decision); [[w.johnson-vantage-point]], 148–51;
        [[w.herring-lbj-and-vietnam]], 35, 129, 131 (the NSC: Wheeler''s nod; Johnson''s question on 600,000 men, Resor''s
        answer; "I don''t want to be dramatic and cause tension"). [[w.mann-grand-delusion]], 454–57 (the NSC; the leaders;
        Mansfield''s statement). To check: notes of the NSC meeting, July 27, 1965, Meeting Notes File, LBJ Library (cited
        by [[w.herring-lbj-and-vietnam]], 131 n.45); Mansfield, notes on Vietnam, July 28, 1965, XXII, 102, Mansfield Papers
