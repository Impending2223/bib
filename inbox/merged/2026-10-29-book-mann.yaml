- add:
    entry:
      id: cal.1962-06-14.vietnam-congress
      when: June 14
      date: '1962-06-14'
      thread: vietnam-congress
      c: 'Trần Văn Chương, South Vietnam''s ambassador, three and a half hours with Valeo of Mansfield''s staff, by Valeo''s
        memorandum to Mansfield of June 15: Diệm''s government "in very deep trouble"; would Mansfield again say "Diem or
