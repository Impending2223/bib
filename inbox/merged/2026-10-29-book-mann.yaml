- add:
    entry:
      id: cal.1964-01-09.vietnam
      when: Jan. 9
      date: '1964-01-09'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'Bundy sends Johnson Rusk''s, McNamara''s and his own comments on Mansfield''s memoranda. Bundy: Truman and Acheson
        damaged because Americans came to believe more should have been done for China; so now "if we should seem to be the
        first to quit in Saigon." "When we are stronger, then we can face negotiation." Trade with Mansfield: his support
        for the war against ours for programs in South Vietnam. McNamara: neutralization would mean a government in Saigon
        "Communist-dominated"; "we can still win, even on present ground rules."'
      n: '[FRUS 1964–68, I, doc. 8](https://history.state.gov/historicaldocuments/frus1964-68v01/d8) (Bundy''s memorandum
        and its tabs). [[w.mann-grand-delusion]], 308–9. See [[cal.1964-01-06.vietnam]]. Names: Bundy, Johnson, Rusk, McNamara,
        Mansfield.'
      tags:
      - name:bundy-mcgeorge
