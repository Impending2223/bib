- add:
    entry:
      id: cal.1964-04-03.vietnam
      when: Apr. 3
      date: '1964-04-03'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'The 526th NSC, 2 p.m., with the congressional leaders. McNamara: the situation worse since September, the Viet Cong
        controlling 40 percent of the territory; the program chosen, the present assistance made more effective; preparations
        to broaden the war if it fails. Morse "disagrees entirely": SEATO and the UN for a settlement. Khánh has called him
        a traitor; Johnson: "no one in this room has called you a traitor." Dirksen asks if SEATO is viable; Mansfield: "a
        paper tiger," the President''s policy "the only one we could follow."'
      n: '[FRUS 1964–68, I, doc. 107](https://history.state.gov/historicaldocuments/frus1964-68v01/d107). [[w.mann-grand-delusion]],
        325. Names: McNamara, Morse, Nguyễn Khánh, Johnson, Dirksen, Mansfield.'
      tags:
