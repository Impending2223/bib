- edit:
    id: cal.1961-11-15.vietnam
    base: 702be38c
    set:
      n: '[FRUS 1961–63, I, doc. 254](https://history.state.gov/historicaldocuments/frus1961-63v01/d254) (notes, probably
        by Burris). [[w.miller-misalliance]], 229 (Kennedy against the troops; the rest of the partnership endorsed). [[w.selverstone-kennedy-withdrawal]],
        46 (the meeting; the two fronts). [[w.reeves-president-kennedy]], 259–60 (the NSC; Kennedy''s case against intervening).
        [[w.mann-grand-delusion]], 250 (Kennedy; the Democrats). To check: Kennedy to Rusk and McNamara, Nov. 14, 1961, President''s
        Office Files, box 128, Kennedy Library (cited by [[w.reeves-president-kennedy]], 259). See [[cal.1961-11-11.vietnam]].
        Names: Kennedy, Rusk, McNamara.'
      c: 'NSC, 10 a.m., on Rusk''s draft memorandum on South Vietnam. Kennedy fears being involved on two fronts at once;
        Vietnam not Korea, its issue obscure; he could make "a rather strong case against intervening in an area 10,000 miles
        away against 16,000 guerrillas with a native army of 200,000." McNamara: action would become clear if American forces
        went in, against the sources of Viet Cong power, those in North Vietnam among them. The contrast with Berlin "could
        even make leading Democrats wary."'
