        Names: Allott, Javits, Robert Byrd, Clark, Church, Stennis.'
      c: 'Appropriations and Armed Services, jointly, report the $700 million unanimously in the morning; the Senate debates
        it from the afternoon. Allott: "we are there and that we must win." Javits for it, but no substitute for a new resolution:
        "I want to be consulted again." Byrd against signals "confused" by "pacifistic demonstrations." Clark: "What is the
        difference between voting for a $700 million appropriation and voting for a declaration of war?" Church: Stennis,
        managing, "I do not think we are signing a blank check"; Church for it, "no blank-check endorsement of decisions to
        be made in the future."'
