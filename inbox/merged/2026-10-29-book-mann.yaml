      - vietnam
      c: 'The congressional leaders at the White House, 6:45 p.m., by Jenkins''s notes. McNamara on the second attack; Rusk:
        "we are not going to run out of South East Asia." Russell: "I hope you will keep going until they get the last one
        of them." Hickenlooper: the President to prepare the resolution he thinks proper. Johnson: "I don''t think any resolution
        is necessary, but I think it is a lot better to have it in the light of what we did in Korea." McCormack: "a united
        front"; Halleck: "no partisanship among us." Mansfield: "I don''t know how much good it will do"; "a minor third rate
        state"; "The Communists won''t be faced down." Johnson: "I have told you what I want from you." Fulbright: "I will
        support it." Aiken: "By the time you send it up there won''t be anything for us to do but support you."'
      n: '[FRUS 1964–68, I, doc. 280](https://history.state.gov/historicaldocuments/frus1964-68v01/d280) (notes by Walter
        Jenkins; Kuchel, Vinson and Morgan also present). [[w.mann-grand-delusion]], 353–54. Check: Mann dates the meeting
        "the evening of August 5." See [[cal.1964-08-04.vietnam]]. Names: McNamara, Rusk, Russell, Hickenlooper, Johnson,
        McCormack, Halleck, Mansfield, Fulbright, Aiken.'
