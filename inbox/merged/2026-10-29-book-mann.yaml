        Names: Taylor, Fulbright, Hickenlooper, Church.'
      c: 'Taylor before Foreign Relations in executive session: action against the North needed at some point, no disagreement
        "in the councils I have attended," but not with Saigon so weak. Fulbright would not back an attack on the North just
        because the government fell. Hickenlooper: "we are going down the same road the French did." Church on the "growing
        speculation that we are about to underwrite attacks on North Vietnam." Fulbright: "This is a hell of a problem. I
        don''t think it is worth a war."'
