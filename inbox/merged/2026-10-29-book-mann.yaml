        boys to do the fighting for Asian boys"; "we are not going north and drop bombs at this stage of the game, and we
        are not going south and run out." Nixon, Rockefeller, Scranton and Goldwater "have all, at some time or other, suggested
        the possible wisdom of going north in Viet-Nam."'
