- add:
    entry:
      id: cal.1966-06-10.vietnam-congress
      when: June 10
      date: '1966-06-10'
      thread: vietnam-congress
      also:
      - vietnam-air-war
      c: 'Johnson and Mansfield by telephone, 8:45 a.m., on the oil stores. Mansfield: heavier bombing of Hanoi and Haiphong
        "a serious mistake"; mining Haiphong "a hell of a can of worms"; it "could turn into an open-ended war." Johnson:
        the military think it a "tragic mistake" not to destroy the oil; "I seem to be the only one that''s afraid that they''ll
        hit the United States Capitol or hit a hospital or hit a school."'
      n: '[FRUS 1964–68, IV, doc. 154](https://history.state.gov/historicaldocuments/frus1964-68v04/d154). [[w.mann-grand-delusion]],
        513 (Johnson''s words). To check: [Johnson and Mansfield, 8:45 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-mike-mansfield-june-10-1966),
        Conversation WH6606-03-10222 (Miller Center), not heard. Names: Johnson, Mansfield.'
