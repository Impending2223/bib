        Armed Services and House Foreign Affairs on the resolution. Fulbright to introduce it, Russell, Hickenlooper and Saltonstall
        cosponsors; joint hearings the next day. Mansfield: pass it as sent. Russell''s addition: "except that it may be terminated
        earlier by concurrent resolution of the Congress." By the account of Pat Holt, of the committee''s staff.'
      n: '[[w.mann-grand-delusion]], 357–58. To check: Holt''s oral history, Oct. 19, 1980, Senate Historical Office (cited
        by [[w.mann-grand-delusion]], 358 n.65); [[w.gibbons-u-s-government-and]], II, 305; [[w.goulden-truth-is-the-first]],
        51 (cited by [[w.mann-grand-delusion]], 357 n.64). Names: Mansfield, Ball, Fulbright, Russell, Hickenlooper, Saltonstall.'
