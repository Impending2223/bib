- edit:
    id: cal.1964-08-06.vietnam-congress
    base: f76d14f0
    set:
      n: '[110 Cong. Rec. 18,399–471](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-3-2.pdf)
        (1964) (Aug. 6–7). [[w.gibbons-u-s-government-and]], II, 316–25. [[w.mann-grand-delusion]], 361–66. See [[cal.1964-08-06.vietnam]].
        Names: Nelson, Fulbright, Morse, Gore, Aiken, Mansfield, McGovern, Brewster, Cooper, Russell, Gruening.'
      c: 'The Senate debates the Southeast Asia resolution. Nelson: does it agree in advance to "as many divisions as deemed
        necessary"? Fulbright: a grave decision for later, Congress able to end the resolution by concurrent resolution. Morse:
        a "snow-job" by the Pentagon and State. Gore: doubts "water over the dam"; Aiken "apprehensive," but with the President.
        Mansfield opens: "in the hope of restraining the dogs of war." McGovern: why would North Vietnam seek a naval fight?
        Fulbright: the destroyers "entirely unconnected" with any South Vietnamese forays. Brewster: armies in Vietnam or
        China? Fulbright: the language "would not prevent it." Cooper: advance authority? Fulbright: "I think that is correct."
        Russell: "Our national honor is at stake." Aug. 7, Nelson''s amendment, the role limited to aid, training and advice:
        Fulbright will not take it to conference. Morse, near two hours: "a predated declaration of war"; Gruening with him.'
      src:
        c: 9067eec4
