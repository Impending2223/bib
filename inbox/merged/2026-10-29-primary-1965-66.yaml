        c: 'Rostow to Johnson, who has asked about McNamara to State in Ball''s place and Komer for William Bundy: the pairing of Rusk and McNamara "exceedingly attractive," but McNamara needed at Defense "until we are over the hump in Viet Nam." For Ball''s post, Bruce or Clifford, Bruce preferred.'
