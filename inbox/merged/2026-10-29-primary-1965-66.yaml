  - edit:
      id: cal.1966-04-18.vietnam-congress
      base: 29b4b5df
      set:
        n: '[112 Cong. Rec. 8223–25](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt6/pdf/GPO-CRECB-1966-pt6-11-2.pdf#page=12) (Apr. 18, 1966) (the speech: the place, Japan or Burma; the parties). [[w.gibbons-u-s-government-and]], IV, 304–05. To check: *New York Times*, Apr. 20, 1966. The Record has "no better place to locate a peace table of this kind than in Japan or Burma or some other proximate and appropriate Asian setting" (8224), not who would call it. Names: Mansfield.'
        c: 'Mansfield in the Senate, on the "inner conflicts" in South Vietnam: a new effort to negotiate, perhaps a peace table in Japan, Burma or another Asian setting, among the United States, North Vietnam, China and "such elements in South Vietnam as may be essential." State, with the White House''s approval, welcomes it; the Saigon government to be South Vietnam''s sole official representative.'
