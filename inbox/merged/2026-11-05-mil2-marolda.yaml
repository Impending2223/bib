      when: Feb. 24
      date: '1961-02-24'
      thread: defense
      also:
      - vietnam
      c: 'Burke to Felt, informally, on the President''s meeting: the services to build a worldwide counterguerrilla capability
        and train friendly forces; SEATO to take up the concepts. "There is going to be an awful lot of guerrilla warfare
        training by U.S. forces all over [the] world, I''ll betcha."'
      n: '[[w.marolda-united-states-navy-and]], 99–100. To check: msg, CNO 240133Z Feb 1961 (cited by [[w.marolda-united-states-navy-and]],
        100 n.25). Check: the meeting''s day; the note''s number read by its order on the page. Names: Burke, Felt.'
      src:
