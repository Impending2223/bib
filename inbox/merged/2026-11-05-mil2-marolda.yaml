- add:
    entry:
      id: cal.1962-09.vietnam-operations
      when: Sept., mid
      date: 1962-09
      thread: vietnam-operations
      c: 'The 22d River Assault Group, a company of marines embarked, to the Rừng Sát for thirty days, landing marines in
        civilian clothes for intelligence. Ended Oct. 8: 26 enemy killed, an arms factory, a hospital, a training camp destroyed.'
      n: '[[w.marolda-united-states-navy-and]], 245. Check: the day; the page has "less than two weeks" after Sept. 1. See
        [[cal.1962-09-01.vietnam]].'
      src:
        c: a3c49683
        rows:
        - 'w.marolda-united-states-navy-and 245: all'
