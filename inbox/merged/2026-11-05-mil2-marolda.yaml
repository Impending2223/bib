      when: May 9
      date: '1964-05-09'
      thread: vietnam
      c: On the Joint Chiefs' approval, CINCPAC directs the Pacific Fleet to survey Cam Ranh Bay as a fleet anchorage; Nha
        Trang and Bến Gội added. The first RA-3B photographic flight at the end of May.
      n: '[[w.marolda-united-states-navy-and]], 376.'
      src:
        c: b6f63d55
        rows:
