      id: cal.1963-06-01.vietnam
      when: June 1
      date: '1963-06-01'
      thread: vietnam
      c: 'The South Vietnamese navy sets up a patrol area along the Cambodian border, after seven attempts to smuggle explosives
        across in three months: a Sea Force ship and two River Force boats. Contraband found, not arms.'
      n: '[[w.marolda-united-states-navy-and]], 247.'
      src:
