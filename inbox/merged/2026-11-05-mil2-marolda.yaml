      when: Mar. 5
      date: '1962-03-05'
      thread: defense
      also:
      - vietnam
      c: The Chief of Naval Operations directs that the motor gunboat (PGM) prototypes be designed for patrol, blockade
        or surveillance in coastal waters; McNamara had cut the fiscal 1963 program from sixteen to two.
      n: '[[w.marolda-united-states-navy-and]], 289. Names: McNamara.'
