      date: '1964-09-19'
      thread: vietnam-tonkin
      c: McDonald fully supports Hollyfield's decision to fire first.
      n: '[[w.marolda-united-states-navy-and]], 459 n.54. See [[cal.1964-09-18.vietnam]]. Names: McDonald.'
