    item: '[[w.marolda-united-states-navy-and]], 460–61 (the patrol ended Sept. 19)'
    units: B
- check:
    id: cal.1964-09-19.vietnam-tonkin
    text: 'Check: Marolda, 461: in September Johnson ordered the Desoto Patrols in Southeast Asia suspended.'
- add:
    entry:
      id: cal.1964-09-21.vietnam-tonkin
      when: Sept. 21
      date: '1964-09-21'
      thread: vietnam-tonkin
      c: 'Sharp to the Joint Chiefs on resuming the patrols: intelligence the military reason; politically "our right to
        go anyplace we desire on the high seas"; "if they can keep us out of the Gulf of Tonkin what do we do when they
        try to stop us using the straits of Malacca."'
      n: '[[w.marolda-united-states-navy-and]], 460. To check: msg, CP 210025Z Sep 1964 (cited by [[w.marolda-united-states-navy-and]],
        460 n.57). See [[cal.1964-09-19.vietnam-tonkin]]. Names: Sharp.'
      src:
        c: 6315de87
        rows:
        - 'w.marolda-united-states-navy-and 460: all'
        - 'via x.1964-09-21.cincpac-to-cjcs-210025z-sep-64: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-09-21.vietnam-tonkin-2
      when: Sept. 21
      date: '1964-09-21'
      thread: vietnam-tonkin
      also:
      - vietnam-34a
      c: 'Westmoreland on resuming the patrols: to reestablish an American presence off the North, tie down its forces,
        and "provide provocation to Commie if he chooses to take bait for retaliatory actions"; best mixed with 34A raids
        for "max harassment and confusion."'
      n: '[[w.marolda-united-states-navy-and]], 460. To check: msg, COMUSMACV 211422Z Sep 1964 (cited by [[w.marolda-united-states-navy-and]],
        460 n.58). See [[cal.1964-09-19.vietnam-tonkin]]. Names: Westmoreland.'
      src:
        c: 11b882af
        rows:
        - 'w.marolda-united-states-navy-and 460: all'
        - 'via x.1964-09-21.msg-comusmacv-211422z-sep-1964: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-09-23.vietnam-tonkin
      when: Sept. 23
      date: '1964-09-23'
      thread: vietnam-tonkin
      c: 'Moorer: the patrols'' military value significant; without them "the CHICOMS could claim that the United States
        stood down to their threat and is in fact a paper tiger."'
      n: '[[w.marolda-united-states-navy-and]], 461. To check: msg, CPFLT 230639Z Sep 1964 (cited by [[w.marolda-united-states-navy-and]],
        461 n.59). See [[cal.1964-09-19.vietnam-tonkin]]. Names: Moorer.'
      src:
        c: d49d983c
        rows:
        - 'w.marolda-united-states-navy-and 461: all'
        - 'via x.1964-09-23.msg-cpflt-230639z-sep-1964: all'
      tags:
      - name:moorer-thomas
- add:
    entry:
      id: cal.1964-09-26.vietnam-tonkin
      when: Sept. 26
      date: '1964-09-26'
      thread: vietnam-tonkin
      also:
      - defense
      c: 'The Joint Chiefs relax the Seventh Fleet''s readiness: the *Constellation* to Japan, the *Ticonderoga* to Subic,
        the *Kearsarge* group to Hong Kong, the *Bon Homme Richard* kept at Yankee Station for Laos; the antisubmarine barrier
        and the patrols on the Communist periphery ended; Task Force 76 and the 9th MEB to port. One amphibious ready group
        off South Vietnam.'
      n: '[[w.marolda-united-states-navy-and]], 460. To check: msg, CP 280001Z Sep 1964 (cited by [[w.marolda-united-states-navy-and]],
        460 n.56). See [[cal.1964-09-19.vietnam-tonkin]].'
      src:
        c: 9ee4792a
        rows:
        - 'w.marolda-united-states-navy-and 460: all'
        - 'via x.1964-09-28.msg-cp-280001z-sep-1964: all'
