      when: June 8
      date: '1964-06-08'
      thread: laos
      c: 'Lynn, the F-8D pilot downed June 7, found by his radio and flares and lifted out by an H-34, to Udorn. McNamara
        questions the mission''s split and its escorts above the reconnaissance planes, its Sidewinders, its little ordnance
        expended. Nitze: requirements to be stated more precisely, commanders given "maximum practicable flexibility."'
      n: '[[w.marolda-united-states-navy-and]], 386. Check: the days of McNamara''s questions and Nitze''s answer. See [[cal.1964-06-06.laos]].
        Names: McNamara, Nitze.'
