      date: '1962-02-09'
      thread: defense
      also:
      - vietnam-macv
      c: 'Anderson to Felt: shares his concern "over the Army''s efforts to make inroads on our control of the Pacific Command";
        the Army can find plausible reasons for an Army CINCPAC. The Navy to give the new command''s logistic support.'
      n: '[[w.marolda-united-states-navy-and]], 253. Names: Anderson, Felt.'
