      when: Sept. 1
      date: '1962-09-01'
      thread: vietnam
      c: 'The 22d River Assault Group operational: nineteen boats, about 250 men, a mobile group for the Saigon River and
        the Rừng Sát.'
      n: '[[w.marolda-united-states-navy-and]], 245.'
      src:
