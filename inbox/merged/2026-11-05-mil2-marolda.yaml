      when: Mar. 2
      date: '1962-03-02'
      thread: defense
      c: 'Tulungan, SEATO''s amphibious exercise, to Apr. 12: over 70 ships, 400 aircraft, 37,000 men, the largest amphibious
        training operation in the Pacific since the Second World War.'
      n: '[[w.marolda-united-states-navy-and]], 285.'
