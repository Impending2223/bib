      when: Oct. 29
      date: '1963-10-29'
      thread: vietnam
      c: The Joint Chiefs direct the Pacific Command to move naval forces to South Vietnam's coast again, against the coup.
      n: '[[w.marolda-united-states-navy-and]], 272. See [[cal.1963-10-29.vietnam]].'
