      when: Oct. 31
      date: '1963-10-31'
      thread: vietnam
      c: 'The *Oriskany* carrier group from Iwakuni for the South China Sea at first light; the Amphibious Ready Group,
        the *Iwo Jima*, *Point Defiance* and *Noble*, to its station off Vũng Tàu. Cover: the exercise Yellow Bird.'
      n: '[[w.marolda-united-states-navy-and]], 272. See [[cal.1963-10-29.vietnam]].'
