      when: Dec. 18–19
      date: '1963-12-18'
      thread: vietnam-34a
      c: 'Subic Bay. Harkins''s conference on the PTFs: forward 40-mm gun out, fuel tanks in, for long runs north; a mobile
        support team and repair package to Đà Nẵng by Feb. 15, the boats ready by Mar. 20.'
      n: '[[w.marolda-united-states-navy-and]], 335. See [[cal.1963-12-20.vietnam]]. Names: Harkins.'
      src:
