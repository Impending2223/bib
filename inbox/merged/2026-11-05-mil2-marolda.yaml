patch: mil2-marolda
by: 'Claude (the military re-read, second run: Marolda and Fitzgerald, chs. XIV-XV and the earlier rows), Nov. 5, 2026'
ops:
- add:
    entry:
      id: cal.1962-03-14.china
      when: Mar. 14
      date: '1962-03-14'
      thread: china
      also:
      - defense
      c: 'Schoech, Commander Seventh Fleet, proposes a destroyer patrol in international waters along the Chinese coast:
        to collect intelligence on "CHICOM electronic and naval activity," show the fleet''s presence, and "serve as a minor
        cold war irritant to CHICOMs." The Desoto Patrol.'
      n: '[[w.marolda-united-states-navy-and]], 393. To check: msg, COM7FLT 140536Z Mar 1962 (cited by [[w.marolda-united-states-navy-and]],
        393 n.1). Check: the day, by the message''s date-time group; the page has "March 1962." Names: Schoech.'
      src:
        c: a52c5437
        rows:
        - 'w.marolda-united-states-navy-and 393: all'
        - 'via x.1962-03-14.msg-com7flt-140536z-mar-1962: all'
      tags:
      - name:schoech-william-a
- add:
    entry:
      id: cal.1962-04.china
      when: Apr., mid
      date: 1962-04
      thread: china
      also:
      - defense
      c: 'The first Desoto Patrol: the destroyer *DeHaven* along the northern coast of China. A patrol a month for five
        months, without incident; Peking broadcasts protests.'
      n: '[[w.marolda-united-states-navy-and]], 393. See [[cal.1962-03-14.china]].'
      src:
        c: b785af91
        rows:
        - 'w.marolda-united-states-navy-and 393: all'
- add:
    entry:
      id: cal.1962-10.korea
      when: Oct.
      date: 1962-10
      thread: korea
      also:
      - defense
      c: The *Hollister*'s Desoto Patrol extended to the North Korean coast, the first; the *Shelton*'s of November the
        same. No Communist reaction.
      n: '[[w.marolda-united-states-navy-and]], 393. See [[cal.1962-03-14.china]].'
      src:
        c: afa43854
        rows:
        - 'w.marolda-united-states-navy-and 393: all'
- add:
    entry:
      id: cal.1962-12-16.vietnam
      when: Dec. 16
      date: '1962-12-16'
      thread: vietnam
      also:
      - china
      c: 'The first Desoto Patrol off North Vietnam: the destroyer *Agerholm* from Keelung, round Hainan, into the Gulf
        of Tonkin to 21° north, no closer than twenty miles to Communist territory; EC-121 and EA-3B flights over the same
        waters. Peking protests.'
      n: '[[w.marolda-united-states-navy-and]], 394. To check: msg, ADMINO COM7FLT 080250Z Dec 1962 (cited by [[w.marolda-united-states-navy-and]],
        394 n.2). See [[cal.1962-03-14.china]].'
      src:
        c: 68a598d5
        rows:
        - 'w.marolda-united-states-navy-and 394: all'
        - 'via x.1962-12-08.msg-admino-com7flt-080250z-dec-1962: all'
- add:
    entry:
      id: cal.1963-04.vietnam
      when: Apr., mid
      date: 1963-04
      thread: vietnam
      also:
      - china
      c: The *Richard S. Edwards* on a Desoto Patrol off Hainan and North Vietnam, shadowed by five or six North Vietnamese
        submarine chasers and minesweepers and by Chinese aircraft. Peking's "serious warnings." Six patrols in 1963, off
        China, the Soviet Union, Indonesia and North Vietnam, none closer than twenty miles.
      n: '[[w.marolda-united-states-navy-and]], 394. See [[cal.1962-12-16.vietnam]].'
      src:
        c: 8f6484de
        rows:
        - 'w.marolda-united-states-navy-and 394: all'
- add:
    entry:
      id: cal.1964-01.vietnam-34a
      when: Jan., mid
      date: 1964-01
      thread: vietnam-34a
      also:
      - vietnam
      c: Harkins asks that the Desoto Patrol of February be designed to give the coming 34A program its intelligence.
      n: '[[w.marolda-united-states-navy-and]], 395. See [[cal.1964-01-07.vietnam]]. Names: Harkins.'
      src:
        c: 6d760326
        rows:
        - 'w.marolda-united-states-navy-and 395: all'
      tags:
      - name:harkins-paul-d
- add:
    entry:
      id: cal.1964-01-22.vietnam-2
      when: Jan. 22
      date: '1964-01-22'
      thread: vietnam
      also:
      - vietnam-34a
      c: Moorer, commanding the Seventh Fleet, schedules the *Radford* for the first week of February off North Vietnam,
        for the first time allowed within four miles of Communist territory, a MACV officer aboard. Then put off past mid-February,
        for the 34A missions of the month's first two weeks.
      n: '[[w.marolda-united-states-navy-and]], 395. To check: msg, COM7FLT 220602Z Jan 1964 (cited by [[w.marolda-united-states-navy-and]],
        395 n.6). See [[cal.1964-01.vietnam-34a]]. Names: Moorer.'
      src:
        c: 1e6be738
        rows:
        - 'w.marolda-united-states-navy-and 395: all'
        - 'via x.1964-01-22.msg-com7flt-220602z-jan-1964: all'
      tags:
      - name:moorer-thomas
- add:
    entry:
      id: cal.1964-01-24.vietnam-34a
      when: Jan. 24
      date: '1964-01-24'
      thread: vietnam-34a
      also:
      - vietnam
      c: 'Felt to the Joint Chiefs: a "continuing requirement" for intelligence on the North Vietnamese forces able to resist
        operations under OPLAN 34A; the Desoto ship "excellent means for obtaining this INTEL."'
      n: '[[w.marolda-united-states-navy-and]], 395. To check: msg, CP 240124Z Jan 1964 (cited by [[w.marolda-united-states-navy-and]],
        395 n.5). See [[cal.1964-01.vietnam-34a]]. Names: Felt.'
      src:
        c: d10b3663
        rows:
        - 'w.marolda-united-states-navy-and 395: all'
        - 'via x.1964-01-24.msg-cp-240124z-jan-1964: all'
      tags:
      - name:felt-harry-d
- add:
    entry:
      id: cal.1964-01-31.vietnam
      when: Jan. 31
      date: '1964-01-31'
      thread: vietnam
      c: 'Sharp, commanding the Pacific Fleet, orders the *John R. Craig* on the postponed patrol, Feb. 25 to Mar. 12: twelve
        miles from China, eight from North Vietnam''s mainland, four from its islands. No carrier air cover, the threat
        "almost non-existent"; the *Ingersoll* at the gulf''s entrance.'
      n: '[[w.marolda-united-states-navy-and]], 396. To check: msg, CPFLT 311834Z Jan 1964 (cited by [[w.marolda-united-states-navy-and]],
        396 n.9). See [[cal.1964-01.vietnam-34a]]. Names: Sharp.'
      src:
        c: 2a44f1e9
        rows:
        - 'w.marolda-united-states-navy-and 396: all'
        - 'via x.1964-01-31.msg-cpflt-311834z-jan-1964: all'
      tags:
      - name:sharp-u-s-grant
- cite:
    id: cal.1964-02.vietnam-3
    item: '[[w.marolda-united-states-navy-and]], 396–97'
    units: all
- check:
    id: cal.1964-02.vietnam-3
    text: 'Check: Marolda, 396–97: the *Craig* leaves Keelung Feb. 25, ordered to patrol to Mar. 12; eleven days of surveillance,
      done by Mar. 9.'
- add:
    entry:
      id: cal.1964-04-01.vietnam-34a
      when: Apr. 1
      date: '1964-04-01'
      thread: vietnam-34a
      c: 'Felt: the "lack of adequate intelligence is a prime factor in the failure of maritime operations"; with North
        Vietnam alerted, "the odds against pulling off operations under present conditions are high." With 30,000 Viet Cong
        in the South, the enemy knows of the base at Đà Nẵng; agents perhaps among the boat crews.'
      n: '[[w.marolda-united-states-navy-and]], 397, 406. To check: msg, CP 012205Z Apr 1964 (cited by [[w.marolda-united-states-navy-and]],
        397 n.12). Names: Felt.'
      src:
        c: 2aca7a52
        rows:
        - 'w.marolda-united-states-navy-and 397, 406: all'
        - 'via x.1964-04-01.msg-cp-012205z-apr-1964: all'
      tags:
      - place:da-nang
      - name:felt-harry-d
- add:
    entry:
      id: cal.1964-05-19.vietnam-34a
      when: May 19
      date: '1964-05-19'
      thread: vietnam-34a
      c: Sharp, commanding the Pacific Fleet, proposes coordinating the PTF raids on the North with a destroyer's radar,
        to keep North Vietnam's radars from finding the boats.
      n: '[[w.marolda-united-states-navy-and]], 402. To check: msg, CPFLT 190259Z May 1964 (cited by [[w.marolda-united-states-navy-and]],
        402 n.19). Names: Sharp.'
      src:
        c: 4a2f10f7
        rows:
        - 'w.marolda-united-states-navy-and 402: all'
        - 'via x.1964-05-19.msg-cpflt-190259z-may-1964: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-05-27.vietnam-34a
      when: May 27
      date: '1964-05-27'
      thread: vietnam-34a
      c: 'Felt endorses Sharp''s proposal: a destroyer available; it would vector a PTF and a Swift boat to the target,
        an American officer in the Swift.'
      n: '[[w.marolda-united-states-navy-and]], 402. To check: msg, CP 272258Z May 1964 (cited by [[w.marolda-united-states-navy-and]],
        402 n.20). Names: Felt, Sharp.'
      src:
        c: 17eddb17
        rows:
        - 'w.marolda-united-states-navy-and 402: all'
        - 'via x.1964-05-27.msg-cp-272258z-may-1964: all'
      tags:
      - name:felt-harry-d
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-06-25.vietnam-34a
      when: June 25
      date: '1964-06-25'
      thread: vietnam-34a
      c: 'Westmoreland against combined Desoto and 34A operations, beyond the South Vietnamese crews: a destroyer''s appearance
        before a raid "would tend to be self defeating." The idea dropped.'
      n: '[[w.marolda-united-states-navy-and]], 402. To check: msg, COMUSMACV 250741Z Jun 1964 (cited by [[w.marolda-united-states-navy-and]],
        402 n.21). Names: Westmoreland.'
      src:
        c: 1a547f25
        rows:
        - 'w.marolda-united-states-navy-and 402: all'
        - 'via x.1964-06-25.msg-comusmacv-250741z-jun-1964: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-07-03.vietnam-34a
      when: July 3
      date: '1964-07-03'
      thread: vietnam-34a
      c: MACV reports ten Swatow gunboats added to the defenses at Đồng Hới, four more at Quảng Khê, perhaps in answer to
        "recent successful 34A MAROPS." The report soon disputed.
      n: '[[w.marolda-united-states-navy-and]], 398. To check: msg, COMUSMACV 030307Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        398 n.13).'
      src:
        c: 6e99395a
        rows:
        - 'w.marolda-united-states-navy-and 398: all'
        - 'via x.1964-07-03.msg-comusmacv-030307z-jul-1964: all'
      tags:
      - place:dong-hoi
- add:
    entry:
      id: cal.1964-07-10.vietnam
      when: July 10
      date: '1964-07-10'
      thread: vietnam
      also:
      - vietnam-34a
      c: Sharp, now CINCPAC, directs Moorer, now commanding the Pacific Fleet, to finish planning a Desoto Patrol into the
        Gulf of Tonkin, to begin by Aug. 1, "primary purpose of determining DRV coastal patrol activity"; direct liaison
        with Westmoreland.
      n: '[[w.marolda-united-states-navy-and]], 398. To check: msg, CP 100342Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        398 n.14). See [[cal.1964-01-07.vietnam]]. Names: Sharp, Moorer, Westmoreland.'
      src:
        c: ed69bf39
        rows:
        - 'w.marolda-united-states-navy-and 398: all'
        - 'via x.1964-07-10.msg-cp-100342z-jul-1964: all'
      tags:
      - name:sharp-u-s-grant
      - name:moorer-thomas
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-07-11.vietnam
      when: July 11
      date: '1964-07-11'
      thread: vietnam
      c: 'Roy L. Johnson, the new Seventh Fleet commander, issues the patrol''s first instructions: the *Picking*, with
        Herrick, from Keelung July 28; a track of sixteen points off North Vietnam, July 31 to Aug. 8; eight miles from
        the mainland, four from the islands.'
      n: '[[w.marolda-united-states-navy-and]], 398–400. To check: msg, COM7FLT 110652Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        400 n.16). See [[cal.1964-07-10.vietnam]]. Names: Roy L. Johnson, Herrick.'
      src:
        c: 60b90330
        rows:
        - 'w.marolda-united-states-navy-and 398–400: all'
        - 'via x.1964-07-11.msg-com7flt-110652z-jul-1964: all'
      tags:
      - name:johnson-roy-l
      - name:herrick-john-j
- add:
    entry:
      id: cal.1964-07-14.soviet-union
      when: July 14–24
      date: '1964-07-14'
      thread: soviet-union
      also:
      - defense
      c: 'Desoto Patrol in the Sea of Japan: the *George K. MacKenzie* within fifteen miles of Soviet territory near Vladivostok
        and Sakhalin. Soviet ships and aircraft approach; no incidents.'
      n: '[[w.marolda-united-states-navy-and]], 397. To check: msg, CPFLT 212103Z Jun 1964 (cited by [[w.marolda-united-states-navy-and]],
        397 n.11). See [[cal.1962-03-14.china]].'
      src:
        c: 382a4c98
        rows:
        - 'w.marolda-united-states-navy-and 397: all'
        - 'via x.1964-06-21.msg-cpflt-212103z-jun-1964: all'
- add:
    entry:
      id: cal.1964-07-15.vietnam-4
      when: July 15
      date: '1964-07-15'
      thread: vietnam
      c: 'Sharp on the patrol in the gulf: no visual intelligence of the North Vietnamese coast since March; with Yankee
        Team and possible overt action against the North, and more 34A operations, current intelligence the more essential.'
      n: '[[w.marolda-united-states-navy-and]], 405. To check: msg, ADMINO CP 152123Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        405 n.28). See [[cal.1964-07-10.vietnam]]. Names: Sharp.'
      src:
        c: db7e06e0
        rows:
        - 'w.marolda-united-states-navy-and 405: all'
        - 'via x.1964-07-15.msg-admino-cp-152123z-jul-1964: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-07-17.vietnam
      when: July 17
      date: '1964-07-17'
      thread: vietnam
      c: 'Seventh Fleet''s detailed guidelines for the patrol: the *Ticonderoga* to give the Desoto ship air support on
        call against ships and aircraft; a "flash" message if attacked; radio checks every four hours.'
      n: '[[w.marolda-united-states-navy-and]], 405–6. To check: msg, COM7FLT 170531Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        406 n.29). See [[cal.1964-07-10.vietnam]]. Names: Roy L. Johnson.'
      src:
        c: f806c384
        rows:
        - 'w.marolda-united-states-navy-and 405–6: all'
        - 'via x.1964-07-17.msg-com7flt-170531z-jul-1964: all'
      tags:
      - name:johnson-roy-l
- add:
    entry:
      id: cal.1964-07-18.defense
      when: July 18
      date: '1964-07-18'
      thread: defense
      also:
      - vietnam
      c: 'McDonald asks for an analysis of the Desoto program''s worth: the Navy not to go on "DeSoto patrolling once a
        quarter because it has been going on for some time."'
      n: '[[w.marolda-united-states-navy-and]], 404–5. To check: memo, OP-002 to OP-03/OP-06/OP-92, ser 00197-64, July 18,
        1964 (cited by [[w.marolda-united-states-navy-and]], 405 n.25). See [[cal.1962-03-14.china]]. Names: McDonald.'
      src:
        c: f86f3df3
        rows:
        - 'w.marolda-united-states-navy-and 404–5: all'
        - 'via x.1964-07-18.memo-op-002-to-op-03: all'
      tags:
      - name:mcdonald-david-l
- add:
    entry:
      id: cal.1964-07-19.vietnam-34a
      when: July 19
      date: '1964-07-19'
      thread: vietnam-34a
      c: Westmoreland doubts the Desoto Patrol can give the 34A program adequate intelligence; a mix of regular patrols
        by aircraft, destroyers and submarines the answer. No MACV officer to go with the patrol.
      n: '[[w.marolda-united-states-navy-and]], 400. To check: msg, COMUSMACV 192241Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        400 n.17). See [[cal.1964-07-10.vietnam]]. Names: Westmoreland.'
      src:
        c: 10317d95
        rows:
        - 'w.marolda-united-states-navy-and 400: all'
        - 'via x.1964-07-19.msg-comusmacv-192241z-jul-1964: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-07-22.vietnam-2
      when: July 22
      date: '1964-07-22'
      thread: vietnam
      c: The Joint Chiefs order CINCPAC to execute the Desoto Patrol into the Gulf of Tonkin.
      n: '[[w.marolda-united-states-navy-and]], 406. To check: msg, JCS 221930Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        406 n.30). See [[cal.1964-07-10.vietnam]].'
      src:
        c: 27d5d64b
        rows:
        - 'w.marolda-united-states-navy-and 406: all'
        - 'via x.1964-07-22.msg-jcs-221930z-jul-1964: all'
- add:
    entry:
      id: cal.1964-07-22.vietnam-34a
      when: July 22
      date: '1964-07-22'
      thread: vietnam-34a
      c: 'A 34A raid on the islands and Vinh Sơn put off: two Swatows sighted off Hòn Ngư, three near Hòn Mê. Westmoreland
        sends PTF-3, -4, -5 and -6 to reconnoiter; little of value.'
      n: '[[w.marolda-united-states-navy-and]], 406–7. To check: msg, COMUSMACV 240915Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        407 n.32). Names: Westmoreland.'
      src:
        c: bf546f0d
        rows:
        - 'w.marolda-united-states-navy-and 406–7: all'
        - 'via x.1964-07-24.msg-comusmacv-240915z-jul-1964: all'
      tags:
      - place:hon-me
      - place:hon-ngu
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-07-22.vietnam-34a-2
      when: July 22
      date: '1964-07-22'
      thread: vietnam-34a
      also:
      - vietnam
      c: Moorer authorizes the Seventh Fleet to arrange liaison with MACV "to assure all feasible measures are taken to
        avoid interference with 34A operations"; its officers meet MACV's staff the fourth week of July. The *Maddox* has
        replaced the *Picking*.
      n: '[[w.marolda-united-states-navy-and]], 402, 404. To check: msg, CPFLT 222224Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        404 n.23). See [[cal.1964-07-10.vietnam]]. Names: Moorer.'
      src:
        c: 931a1fc4
        rows:
        - 'w.marolda-united-states-navy-and 402, 404: all'
        - 'via x.1964-07-22.msg-cpflt-222224z-jul-1964: all'
      tags:
      - name:moorer-thomas
- add:
    entry:
      id: cal.1964-07-25.vietnam-34a
      when: July 25
      date: '1964-07-25'
      thread: vietnam-34a
      c: 'Westmoreland to Moorer: given expeditious notice of the patrol''s changes, "34A operations will be adjusted to
        prevent interference."'
      n: '[[w.marolda-united-states-navy-and]], 404. To check: msg, COMUSMACV 250705Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        404 n.22). See [[cal.1964-07-10.vietnam]]. Names: Westmoreland, Moorer.'
      src:
        c: e4af3ee0
        rows:
        - 'w.marolda-united-states-navy-and 404: all'
        - 'via x.1964-07-25.msg-comusmacv-250705z-jul-1964: all'
      tags:
      - name:westmoreland-william
      - name:moorer-thomas
- add:
    entry:
      id: cal.1964-07-26.vietnam
      when: July 26
      date: '1964-07-26'
      thread: vietnam
      c: 'Roy L. Johnson to the patrol''s commander: watch the clock; report what elsewhere would be routine, shadowing,
        overflights, "unusual radar interest," as significant.'
      n: '[[w.marolda-united-states-navy-and]], 404. To check: msg, COM7FLT 260955Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        404 n.24). See [[cal.1964-07-10.vietnam]]. Names: Roy L. Johnson, Herrick.'
      src:
        c: e2bf1ec7
        rows:
        - 'w.marolda-united-states-navy-and 404: all'
        - 'via x.1964-07-26.msg-com7flt-260955z-jul-1964: all'
      tags:
      - name:johnson-roy-l
      - name:herrick-john-j
- add:
    entry:
      id: cal.1964-07-26.vietnam-34a
      when: July 26
      date: '1964-07-26'
      thread: vietnam-34a
      c: Through the Joint Chiefs, McNamara asks whether "standoff gunfire or rocket attack" would serve better than raids
        ashore, the coastal defenses "improved and alerted" and the "tempo of attack" not building up.
      n: '[[w.marolda-united-states-navy-and]], 407. To check: msg, JCS 260003Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        407 n.34). Names: McNamara.'
      src:
        c: 5ab147c2
        rows:
        - 'w.marolda-united-states-navy-and 407: all'
        - 'via x.1964-07-26.msg-jcs-260003z-jul-1964: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-07-27.vietnam-34a
      when: July 27
      date: '1964-07-27'
      thread: vietnam-34a
      c: Seizing a junk southeast of Vinh Sơn, two PTFs and two Swift boats attacked by North Vietnamese patrol craft, without
        effect.
      n: '[[w.marolda-united-states-navy-and]], 407. To check: msg, COMUSMACV 271035Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        407 n.32). Check: the day; the page has "five days later" than July 22.'
      src:
        c: f5196bfb
        rows:
        - 'w.marolda-united-states-navy-and 407: all'
        - 'via x.1964-07-27.msg-comusmacv-271035z-jul-1964: all'
- add:
    entry:
      id: cal.1964-07-29.vietnam-34a
      when: July 29
      date: '1964-07-29'
      thread: vietnam-34a
      c: 'Westmoreland answers McNamara: the boats testing 81-mm mortars, to try 4.5-inch rockets and recoilless rifles;
        VNAF bombing of chosen targets in the North, with Sharp, the most effective pressure.'
      n: '[[w.marolda-united-states-navy-and]], 407–8. To check: msg, COMUSMACV 291233Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        408 n.35). Names: Westmoreland, McNamara, Sharp.'
      src:
        c: 3920111f
        rows:
        - 'w.marolda-united-states-navy-and 407–8: all'
        - 'via x.1964-07-29.msg-comusmacv-291233z-jul-1964: all'
      tags:
