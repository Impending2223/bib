      when: Nov., early
      date: 1961-11
      thread: vietnam-macv
      also:
      - defense
      c: McNamara directs the Joint Chiefs to plan an overall American command in South Vietnam, separate from CINCPAC,
        reporting to the Chiefs. Opposition in the Chiefs and from CINCPAC; Anderson fears the erosion of Felt's authority.
      n: '[[w.marolda-united-states-navy-and]], 219–20. See [[cal.1962-02-08.vietnam]]. Names: McNamara, Anderson, Felt.'
      src:
