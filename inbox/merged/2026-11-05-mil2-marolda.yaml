      - name:mcnamara-robert-s
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-07-30.vietnam-34a
      when: July 30
      date: '1964-07-30'
      thread: vietnam-34a
      c: 'Westmoreland''s plan for August''s 34A operations, assuming "off-shore bombardment will be approved": raids up
        283 percent over July, 566 over June, most with shelling or sabotage.'
      n: '[[w.marolda-united-states-navy-and]], 408–9. To check: msg, COMUSMACV 301107Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        409 n.36). Names: Westmoreland.'
      src:
        c: cf97666f
        rows:
        - 'w.marolda-united-states-navy-and 408–9: all'
        - 'via x.1964-07-30.msg-comusmacv-301107z-jul-1964: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-07-30.vietnam-34a-2
      when: July 30–31
      date: '1964-07-30'
      thread: vietnam-34a
      also:
      - vietnam-tonkin
      c: 'PTF-2, -3, -5 and -6 from Đà Nẵng against Hòn Mê and Hòn Ngư. At Hòn Mê, after midnight, fired on, four of PTF-6''s
        crew wounded, no landing: the boats shell the island from offshore, the first standoff bombardment of 34A; a gun
        emplacement and buildings destroyed. A Swatow, T-142, gives chase. All back at Đà Nẵng by midday July 31.'
      n: '[[w.marolda-united-states-navy-and]], 409–10. To check: SACSA, "Description of South Vietnamese Operations on
        30/31 July 1964" (cited by [[w.marolda-united-states-navy-and]], 410 n.38). See [[cal.1964-07-30.vietnam-34a]].'
      src:
        c: 76eeb1ed
        rows:
        - 'w.marolda-united-states-navy-and 409–10: all'
        - 'via x.1964-07-31.sacsa-description-of-south-vietnamese-operations: all'
      tags:
      - place:hon-me
      - place:hon-ngu
      - place:da-nang
- add:
    entry:
      id: cal.1964-07-30.defense
      when: July 30
      date: '1964-07-30'
      thread: defense
      also:
      - vietnam
      c: 'Moorer to McDonald: the Desoto patrols worth more than they cost: training close to unfriendly forces, the right
        to the free use of international waters, intelligence. He asks to send a destroyer into the Sea of Okhotsk, unentered
        by an American ship in eleven years.'
      n: '[[w.marolda-united-states-navy-and]], 405. To check: msg, CPFLT 302237Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        405 n.26). Names: Moorer, McDonald.'
      src:
        c: 45b6be4d
        rows:
        - 'w.marolda-united-states-navy-and 405: all'
        - 'via x.1964-07-30.msg-cpflt-302237z-jul-1964: all'
      tags:
      - name:moorer-thomas
      - name:mcdonald-david-l
- add:
    entry:
      id: cal.1964-07-31.vietnam-2
      when: July 31–Aug. 1
      date: '1964-07-31'
      thread: vietnam
      c: 'The *Maddox* on patrol off North Vietnam: past the returning PTFs at dawn July 31; Point Alpha, near Gio Island.
        Aug. 1, Points Bravo and Charlie, tracked all day; at 2115H five miles southeast of Hòn Vát, the closest of the
        patrol.'
      n: '[[w.marolda-united-states-navy-and]], 410–11. To check: msg, CTU72.1.2 311320Z Jul 1964 (cited by [[w.marolda-united-states-navy-and]],
        411 n.41). See [[cal.1964-07-28.vietnam]].'
      src:
        c: 9dac8a89
        rows:
        - 'w.marolda-united-states-navy-and 410–11: all'
        - 'via x.1964-07-31.msg-ctu72-1-2-311320z-jul: all'
- cite:
    id: cal.1964-07-28.vietnam
    item: '[[w.marolda-united-states-navy-and]], 410, 399 (the *Maddox* from Keelung July 28; eight miles)'
    units: A
- add:
    entry:
      id: cal.1964-08-01.vietnam-34a
      when: Aug. 1
      date: '1964-08-01'
      thread: vietnam-34a
      c: 'Westmoreland asks "ASAP, policy reading on stand off bombardment of DRV coastal targets": unless told otherwise,
        the boats to shell the Vinh Sơn radar and a post on the Ròn River Aug. 3. Not told otherwise.'
      n: '[[w.marolda-united-states-navy-and]], 409. To check: msg, COMUSMACV 010717Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        409 n.37). Names: Westmoreland.'
      src:
        c: df48b82c
        rows:
        - 'w.marolda-united-states-navy-and 409: all'
        - 'via x.1964-08-01.msg-comusmacv-010717z-aug-1964: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1964-08-02.vietnam-tonkin
      when: Aug. 2
      date: '1964-08-02'
      thread: vietnam-tonkin
      c: 'The Chief of Naval Operations to the Pacific Fleet: the attack on the *Maddox* possibly the "aftermath" of the
        raid on Hòn Mê. The New China News Agency, Aug. 1: Hanoi''s protest to the Control Commission of the shelling of
        Hòn Ngư and Hòn Mê July 30.'
      n: '[[w.marolda-united-states-navy-and]], 422. To check: msg, CNO, of 2 Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        422 n.64). See [[cal.1964-08-02.vietnam]]. Names: McDonald.'
      src:
        c: 359e17c4
        rows:
        - 'w.marolda-united-states-navy-and 422: all'
        - 'via x.1964-08-02.msg-cno-of-2-aug-1964: all'
      tags:
      - name:mcdonald-david-l
- add:
    entry:
      id: cal.1964-08-03.vietnam-tonkin
      when: Aug. 3
      date: '1964-08-03'
      thread: vietnam-tonkin
      c: 'A CIA bulletin: "Hanoi''s naval units have displayed increasing sensitivity to U.S. and South Vietnamese naval
        activity in the Gulf of Tonkin during the past few months."'
      n: '[[w.marolda-united-states-navy-and]], 422. To check: CIA, Bulletin, Aug. 3, 1964 (cited by [[w.marolda-united-states-navy-and]],
        422 n.65). See [[cal.1964-08-02.vietnam]].'
      src:
        c: 6c834a2a
        rows:
        - 'w.marolda-united-states-navy-and 422: all'
        - 'via x.1964-08-03.cia-bulletin-aug-3-1964: all'
- add:
    entry:
      id: cal.1964-08-03.vietnam-tonkin-2
      when: Aug. 3
      date: '1964-08-03'
      thread: vietnam-tonkin
      c: 'The *Maddox* and the *Turner Joy* under Herrick head into the gulf, 0900H, ordered to destroy any attacker; the
        *Ticonderoga*: "maximum effort" to destroy the attacking units. Fire may be kept on boats inside the eleven-mile
        zone; no pursuit into it. Seventh Fleet asks MACV the next 34A mission''s time: the destroyers to keep clear between
        the 17th and 18th parallels Aug. 3–4.'
      n: '[[w.marolda-united-states-navy-and]], 421–22. To check: msg, COM7FLT 030553Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        422 n.66). See [[cal.1964-08-02.vietnam]]. Names: Herrick.'
      src:
        c: ddd50f26
        rows:
        - 'w.marolda-united-states-navy-and 421–22: all'
        - 'via x.1964-08-03.msg-com7flt-030553z-aug-1964: all'
      tags:
      - name:herrick-john-j
- add:
    entry:
      id: cal.1964-08-03.vietnam-34a
      when: Aug. 3–4
      date: '1964-08-03'
      thread: vietnam-34a
      also:
      - vietnam-tonkin
      c: 'The second 34A raid: PTF-1 and PTF-5 shell the radar at Vinh Sơn from midnight, 770 rounds in twenty-five minutes;
        PTF-6 the security post at the Ròn River''s mouth, chased off by a boat. All back at Đà Nẵng by 0715H Aug. 4. PTF-2
        turned back with engine failure.'
      n: '[[w.marolda-united-states-navy-and]], 424. To check: Joint Staff, JCS, "Description of South Vietnamese Operations
        on 3/4 August 1964" (cited by [[w.marolda-united-states-navy-and]], 424 n.68). See [[cal.1964-07-30.vietnam-34a]].'
      src:
        c: bb8787a8
        rows:
        - 'w.marolda-united-states-navy-and 424: all'
        - 'via x.1964-08-04.joint-staff-jcs-description-of-south: all'
      tags:
      - place:da-nang
- add:
    entry:
      id: cal.1964-08-03.vietnam-tonkin-3
      when: Aug. 3
      date: '1964-08-03'
      thread: vietnam-tonkin
      c: 'Roy L. Johnson proposes ending the patrol after the next day. Moorer refuses: ending it "does not in my view adequately
        demonstrate U.S. resolve"; two more days on the Charlie–Delta track, a third to the north, a fourth back. The Joint
        Chiefs agree.'
      n: '[[w.marolda-united-states-navy-and]], 424–25. To check: msg, COM7FLT 031712Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        425 n.70); msg, CPFLT 032259Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 425 n.71). See [[cal.1964-08-02.vietnam]].
        Names: Roy L. Johnson, Moorer.'
      src:
        c: 3eecd494
        rows:
        - 'w.marolda-united-states-navy-and 424–25: all'
        - 'via x.1964-08-03.msg-com7flt-031712z-aug-1964: all'
        - 'via x.1964-08-03.msg-cpflt-032259z-aug-1964: all'
      tags:
      - name:johnson-roy-l
      - name:moorer-thomas
- add:
    entry:
      id: cal.1964-08-03.vietnam-tonkin-4
      when: Aug. 3
      date: '1964-08-03'
      thread: vietnam-tonkin
      c: 'Sharp objects to the Joint Chiefs'' bar on the destroyers within twelve miles, even in hot pursuit: "a retreat
        at a time when aggressive measures are necessary."'
      n: '[[w.marolda-united-states-navy-and]], 425. To check: msg, CP 032353Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        425 n.72). See [[cal.1964-08-03.vietnam-tonkin-3]]. Names: Sharp.'
      src:
        c: 36c33c3c
        rows:
        - 'w.marolda-united-states-navy-and 425: all'
        - 'via x.1964-08-03.msg-cp-032353z-aug-1964: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-08-04.vietnam-tonkin-2
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-tonkin
      c: 'The Joint Chiefs keep the destroyers out of the eleven-mile zone, even in hot pursuit; aircraft may answer an
        attack to three miles of the coast. Herrick: Hanoi "considers patrol directly involved with 34-A OPs."'
      n: '[[w.marolda-united-states-navy-and]], 425. To check: msg, JCS 041433Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        425 n.73). See [[cal.1964-08-03.vietnam-tonkin-3]]. Names: Herrick.'
      src:
        c: 1a46980c
        rows:
        - 'w.marolda-united-states-navy-and 425: all'
        - 'via x.1964-08-04.msg-jcs-041433z-aug-1964: all'
      tags:
      - name:herrick-john-j
- add:
    entry:
      id: cal.1964-08-04.vietnam-tonkin-3
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-tonkin
      c: 'During the night action, CINCPAC orders air and surface pursuit of the attackers to three miles of the islands
        and eleven of the coast; Roy L. Johnson to Herrick: "patrols will be continued." CINCPAC proposes "punitive U.S.
        air strikes ... in increasing stages of severity": the boats near Hòn Mê and Hòn Ne and in the Lạch Chao estuary,
        the bases at Quảng Khê, Bến Thủy and Hòn Mê, the oil at Bến Thủy; and asks leave to attack aircraft whose behavior
        shows an attack intended.'
      n: '[[w.marolda-united-states-navy-and]], 438. To check: msg, COM7FLT 041540Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        438 n.2); msg, CP 041657Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 438 n.3); msg, CP 041718Z Aug
        1964 (cited by [[w.marolda-united-states-navy-and]], 438 n.4). See [[cal.1964-08-04.vietnam]]. Names: Sharp, Roy
        L. Johnson, Herrick.'
      src:
        c: 16e34ca2
        rows:
        - 'w.marolda-united-states-navy-and 438: all'
        - 'via x.1964-08-04.msg-com7flt-041540z-aug-1964: all'
        - 'via x.1964-08-04.msg-cp-041657z-aug-1964: all'
        - 'via x.1964-08-04.msg-cp-041718z-aug-1964: all'
      tags:
      - place:hon-me
      - name:sharp-u-s-grant
      - name:johnson-roy-l
      - name:herrick-john-j
- add:
    entry:
      id: cal.1964-08-04.vietnam-tonkin-4
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-tonkin
      c: At McNamara's direction, aerial mining of North Vietnam's five naval bases prepared; 100 Mark 50 mines airlifted
        to the *Ticonderoga* and the *Constellation*. Overtaken by events.
      n: '[[w.marolda-united-states-navy-and]], 440. To check: msg, CP 041547Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        440 n.6). See [[cal.1964-08-04.vietnam]]. Names: McNamara.'
      src:
        c: 6e50ad9e
        rows:
        - 'w.marolda-united-states-navy-and 440: all'
        - 'via x.1964-08-04.msg-cp-041547z-aug-1964: all'
      tags:
      - name:mcnamara-robert-s
- cite:
    id: cal.1964-08-05.vietnam
    item: '[[w.marolda-united-states-navy-and]], 449 (the count: 33 of the 34 boats hit, 7 destroyed, 10 badly damaged;
      4 of 67 aircraft hit or lost, two aviators lost; Williams killed on the *Ticonderoga*''s deck)'
    units: A-B
- add:
    entry:
      id: cal.1964-08-05.vietnam-tonkin
      when: Aug. 5–8
      date: '1964-08-05'
      thread: vietnam-tonkin
      c: 'The patrol resumed, on the Pacific Fleet''s order of 0044H Aug. 5, ten aircraft over it from dawn to dusk, no
        closer than eleven miles. Herrick: the *Maddox* "considered to be [prime] target." Nine radar contacts Aug. 5, gone;
        supply Aug. 6; patrols Aug. 7–8 without incident. At 1400H Aug. 8 the two ships head for the open sea.'
      n: '[[w.marolda-united-states-navy-and]], 449–51. To check: msg, CPFLT 041644Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        451 n.30). See [[cal.1964-08-05.vietnam]]. Names: Herrick.'
      src:
        c: 611ed376
        rows:
        - 'w.marolda-united-states-navy-and 449–51: all'
        - 'via x.1964-08-04.msg-cpflt-041644z-aug-1964: all'
      tags:
      - name:herrick-john-j
- add:
    entry:
      id: cal.1964-08-05.vietnam-tonkin-2
      when: Aug. 5–12
      date: '1964-08-05'
      thread: vietnam-tonkin
      also:
      - defense
      c: 'The Pacific concentration after Pierce Arrow: the Amphibious Ready Group with the Special Landing Force from Subic,
        the evening of Aug. 5, for central South Vietnam; the 9th Marine Expeditionary Brigade loading at Okinawa; the *Kearsarge*
        group south; the *Pine Island* to Đà Nẵng; an antisubmarine barrier off Taiwan and Luzon; the *Ranger* ordered west.
        By Aug. 12: the *Ticonderoga*, *Constellation*, *Kearsarge*, *Oklahoma City*, *Topeka*, 25 destroyers, 4 submarines,
        10 minesweepers; three Marine battalions in 15 amphibious ships.'
      n: '[[w.marolda-united-states-navy-and]], 452–53. To check: msg, CP 070422Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        453 n.32). See [[cal.1964-08-04.vietnam-tonkin]].'
      src:
        c: 1fc91041
        rows:
        - 'w.marolda-united-states-navy-and 452–53: all'
        - 'via x.1964-08-07.msg-cp-070422z-aug-1964: all'
- add:
    entry:
      id: cal.1964-08-06.vietnam-tonkin
      when: Aug. 6
      date: '1964-08-06'
      thread: vietnam-tonkin
      c: 'Ogier, of the *Maddox*, who had not confirmed the attack: "I am now convinced that ... torpedo attacks did take
        place." Herrick: "certainly a PT boat action did take place." Barnhart, of the *Turner Joy*, had confirmed two PT
        craft.'
      n: '[[w.marolda-united-states-navy-and]], 442. To check: msg, CTG72.1 062355Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        442 n.17). See [[cal.1964-08-04.vietnam]]. Names: Herrick.'
      src:
        c: b8fd9744
        rows:
        - 'w.marolda-united-states-navy-and 442: all'
        - 'via x.1964-08-06.msg-ctg72-1-062355z-aug-1964: all'
      tags:
      - name:herrick-john-j
- add:
    entry:
      id: cal.1964-08-07.vietnam-tonkin
      when: Aug. 7
      date: '1964-08-07'
      thread: vietnam-tonkin
      also:
      - defense
      c: On the Joint Chiefs' direction, CINCPAC orders four attack carriers kept in the western Pacific, two in the South
        China Sea. The *Bon Homme Richard*'s return home put off.
      n: '[[w.marolda-united-states-navy-and]], 452. See [[cal.1964-08-04.vietnam-tonkin]].'
      src:
        c: a93ff1a0
        rows:
        - 'w.marolda-united-states-navy-and 452: all'
- add:
    entry:
      id: cal.1964-08-08.vietnam-tonkin
      when: Aug. 8
      date: '1964-08-08'
      thread: vietnam-tonkin
      c: 'Sharp recommends another destroyer patrol in the gulf from Aug. 12: "to assert U.S. rights in the international
        waters off NVN and to ascertain through NVN reaction whether they intend to continue attacks." Not approved then.'
      n: '[[w.marolda-united-states-navy-and]], 453. To check: msg, CP 080155Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        453 n.33). See [[cal.1964-08-05.vietnam]]. Names: Sharp.'
      src:
        c: 2d934393
        rows:
        - 'w.marolda-united-states-navy-and 453: all'
        - 'via x.1964-08-08.msg-cp-080155z-aug-1964: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-08-14.vietnam-tonkin
      when: Aug. 14
      date: '1964-08-14'
      thread: vietnam-tonkin
      c: 'Roy L. Johnson to Moorer: "convinced beyond any doubt that Maddox and Turner Joy were subjected to an unprovoked
        surface torpedo attack on the night of 4 August." Sharp and Moorer of the same view.'
      n: '[[w.marolda-united-states-navy-and]], 442. To check: ltr, COM7FLT to CINCPACFLT, ser N13-00141, Aug. 14, 1964
        (cited by [[w.marolda-united-states-navy-and]], 442 n.18). See [[cal.1964-08-04.vietnam]]. Names: Roy L. Johnson,
        Moorer, Sharp.'
      src:
        c: 708dd244
        rows:
        - 'w.marolda-united-states-navy-and 442: all'
        - 'via x.1964-08-14.ltr-com7flt-to-cincpacflt-ser-n13: all'
      tags:
      - name:johnson-roy-l
      - name:moorer-thomas
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1964-08-14.vietnam-tonkin-2
      when: Aug. 14
      date: '1964-08-14'
      thread: vietnam-tonkin
      c: 'Serrell''s memorandum for the record: the Defense Department''s team, Serrell and Wentworth, sent to the western
        Pacific to interview the crews and read the records, finds the attack of Aug. 4 genuine: the *Turner Joy*''s sighting
        of the torpedo the *Maddox*''s sonar heard, the boats seen, the two ships'' radar tracks alike. Kerr, for the Seventh
        Fleet, aboard the destroyers, the same.'
      n: '[[w.marolda-united-states-navy-and]], 443. To check: Serrell, memo for record, Aug. 14, 1964 (cited by [[w.marolda-united-states-navy-and]],
        443 n.19). See [[cal.1964-08-04.vietnam]].'
      src:
        c: f610d0db
        rows:
        - 'w.marolda-united-states-navy-and 443: all'
        - 'via x.1964-08-14.serrell-memo-for-record-aug-14: all'
- add:
    entry:
      id: cal.1964-08-17.vietnam-tonkin
      when: Aug. 17
      date: '1964-08-17'
      thread: vietnam-tonkin
      c: 'Sharp proposes a follow-up to Pierce Arrow: the Desoto Patrol resumed, air base defense forces to South Vietnam;
        "pressures against the other side once instituted should not be relaxed"; a falling off "could easily be interpreted
        as period of second thoughts." None approved then.'
      n: '[[w.marolda-united-states-navy-and]], 453. To check: msg, CP 170530Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]],
        453 n.34). See [[cal.1964-08-05.vietnam]]. Names: Sharp.'
      src:
        c: 25470c3f
        rows:
        - 'w.marolda-united-states-navy-and 453: all'
        - 'via x.1964-08-17.msg-cp-170530z-aug-1964: all'
      tags:
      - name:sharp-u-s-grant
- cite:
    id: cal.1964-09-10.vietnam-tonkin
    item: '[[w.marolda-united-states-navy-and]], 453–54 (the three-day patrol, mid-September; hot pursuit)'
    units: A
- check:
    id: cal.1964-09-10.vietnam-tonkin
    text: 'Check: Marolda, 453–54, dates the approval Sept. 9 and has the ships no closer than twenty miles to the mainland,
      twelve to the islands, aircraft allowed into North Vietnamese air space in hot pursuit.'
- add:
    entry:
      id: cal.1964-09-17.vietnam-tonkin
      when: Sept. 17
      date: '1964-09-17'
      thread: vietnam-tonkin
      c: The *Morton* and the *Richard S. Edwards*, under Hollyfield, enter the gulf an hour after dawn on the September
        patrol; the *Morton* had left Subic Sept. 13. Guest, in the *Constellation*, in operational control.
      n: '[[w.marolda-united-states-navy-and]], 454. To check: msg, CPFLT 090916Z Sep 1964 (cited by [[w.marolda-united-states-navy-and]],
