      when: Oct. 23
      date: '1962-10-23'
      thread: vietnam
      c: Felt directs the Navy's and the Air Force's air defense detachments to deploy from the Philippines to South Vietnam
        in turn, six weeks at a time.
      n: '[[w.marolda-united-states-navy-and]], 185. Names: Felt.'
