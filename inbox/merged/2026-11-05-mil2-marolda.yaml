      when: Jan. 3
      date: '1963-01-03'
      thread: vietnam
      c: 'The Navy''s EA-1Fs back on air alert at Tân Sơn Nhứt, to Feb. 17, after the Air Force''s F-102s. Moorer objects
        to the next turn, May 1: "detrimental [to] Seventh Fleet training and readiness."'
      n: '[[w.marolda-united-states-navy-and]], 185. Names: Moorer.'
