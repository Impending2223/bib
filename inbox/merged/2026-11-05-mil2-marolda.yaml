      when: Nov. 1
      date: '1963-11-01'
      thread: vietnam-saigon
      c: The morning of the coup. Captain Quyền, the navy's chief, on his birthday, refuses an officer's invitation to join
        the plotters and is shot dead on the highway to Thủ Đức; the officer arrests his staff.
      n: '[[w.marolda-united-states-navy-and]], 273. See [[cal.1963-11-01.vietnam]].'
      src:
