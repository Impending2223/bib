patch: state-conventions
by: 'Claude (state conventions agent), Oct. 22, 2026: the figures from Wikipedia''s tables of the 1964 Republican and 1968 Democratic primaries and conventions, each row from a paper of the day; the methods from the Hughes Commission''s Table I and report (114 Cong. Rec. 31544-31556)'
