      c: 'Texas''s Democratic State convention: its 104 delegates for Governor Connally as favorite son, the delegation''s votes his to cast.'
      n: '"Free Hand Given Connally on Votes," [*Fort Worth Star-Telegram*, June 12, 1968](https://www.newspapers.com/image/642357328). How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): convention; open precinct. The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. See [[cal.1968-05-16.elections-1968-state-conventions]]. Names: Connally. Check: the paper (newspapers.com, by subscription; not read here).'
