      c: Michigan's Democratic State convention names its 96 delegates, uncommitted.
      n: '"Democrats Pick Michigan Slate," [*New York Times*, June 3, 1968](https://timesmachine.nytimes.com/timesmachine/1968/06/03/issue.html), 35. How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): convention; closed precinct, the precinct delegates elected in the primary two years before (its note 4). The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. See [[cal.1968-05-16.elections-1968-state-conventions]]. Check: the Times''s page (TimesMachine, by subscription; not read here). Check the day: the table''s June 2; the Times reports it June 3.'
