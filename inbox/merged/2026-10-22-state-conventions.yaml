      when: June 1
      date: '1968-06-01'
      thread: elections-1968-state-conventions
      c: Missouri's Democratic State convention names its 60 delegates, uncommitted; the Times reports them for Humphrey.
      n: '"Humphrey Wins Missouri Votes," [*New York Times*, June 2, 1968](https://timesmachine.nytimes.com/timesmachine/1968/06/02/issue.html), 26. How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): convention; open precinct; the report on a district convention in Missouri held in secret, [31551](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=177). The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. See [[cal.1968-05-16.elections-1968-state-conventions]]. Names: Humphrey. Check: the Times''s page (TimesMachine, by subscription; not read here).'
      tags:
      - state:mo
      - name:humphrey-hubert-h
