      when: June 6
      date: '1968-06-06'
      thread: elections-1968-state-conventions
      c: 'North Carolina''s Democratic State convention: its 59 delegates for Governor Moore as favorite son, 22 of them his own choice.'
      n: '"HHH Comes Out Tops as State Demo''s Choice," [*Robesonian*, June 7, 1968](https://www.newspapers.com/image/42045817) (Lumberton); the governor''s 22, the Hughes Commission''s report, [114 Cong. Rec. 31548](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=174) (Oct. 14, 1968). How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): appointment; convention; open precinct. The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. See [[cal.1968-05-16.elections-1968-state-conventions]]. Names: Moore. Check: the paper (newspapers.com, by subscription; not read here).'
      tags:
      - state:nc
      - name:moore-dan-k
