      when: June 22
      date: '1968-06-22'
      thread: elections-1968-state-conventions
      c: 'Minnesota''s Democratic-Farmer-Labor State convention chooses its delegates at large: Humphrey''s, 14 by the Times''s count.'
      n: '"Humphrey Gains 14 in Minnesota Delegate Test," [*New York Times*, June 23, 1968](https://timesmachine.nytimes.com/timesmachine/1968/06/23/issue.html), 1. How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): convention; open precinct. The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. See [[cal.1968-05-16.elections-1968-state-conventions]]. Names: Humphrey. Check: the Times''s page (TimesMachine, by subscription; not read here). Check the count: Wikipedia''s table gives 13½ votes chosen and Humphrey 14.'
      tags:
      - state:mn
      - name:humphrey-hubert-h
