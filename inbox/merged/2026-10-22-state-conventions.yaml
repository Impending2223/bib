      c: 'Georgia''s Republican State convention pledges its 4 delegates at large to Goldwater: with the district conventions'' 18 of Mar. 21, 22 of the State''s 24. The Associated Press''s count after it, as the Times printed it May 4: Goldwater 209; uncommitted 143; Scranton 63; Lodge 43; others 55; Rockefeller none.'
      n: '"4 More Delegates Vow Support to Goldwater," [*Atlanta Journal*, May 3, 1964](https://www.newspapers.com/image/970588398); for Mar. 21, "9 Districts Give Delegates to Barry," [*Atlanta Journal*, Mar. 22, 1964](https://www.newspapers.com/image/970586821); the count, [*New York Times*, May 4, 1964](https://timesmachine.nytimes.com/timesmachine/1964/05/04/issue.html). The figures: [Wikipedia, "1964 Republican Party presidential primaries"](https://en.wikipedia.org/wiki/1964_Republican_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026; the count, its narrative, citing the Times. [[w.cosman-five-states-for-goldwater]]. See [[cal.1964-02-29.elections-1964-state-conventions]]. Names: Goldwater, Scranton, Lodge, Rockefeller. Check: the papers and the Times''s page (by subscription; not read here).'
