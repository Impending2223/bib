    entry:
      id: cal.1968-05-25.elections-1968-state-conventions
      when: May 25
      date: '1968-05-25'
      thread: elections-1968-state-conventions
      c: 'Iowa''s Democratic State convention divides its 46 votes: Robert Kennedy 25, Humphrey 9½, McCarthy 5, uncommitted 6½.'
      n: '"Kennedy Winner in Iowa Contest," [*New York Times*, May 26, 1968](https://timesmachine.nytimes.com/timesmachine/1968/05/26/issue.html), 53. How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): convention; open precinct. The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. See [[cal.1968-05-16.elections-1968-state-conventions]]. Names: Robert Kennedy, Humphrey, McCarthy. Check: the Times''s page (TimesMachine, by subscription; not read here).'
      tags:
      - state:ia
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
