      thread: elections-1968-state-conventions
      c: 'New York''s Democratic State committee names 65 delegates at large: McCarthy 15½ votes, uncommitted 49½. Some 300 of McCarthy''s people walk out.'
      n: '"300 McCarthyites Stage a Walkout at State Meeting," [*New York Times*, June 29, 1968](https://timesmachine.nytimes.com/timesmachine/1968/06/29/issue.html), 1. How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): appointment; direct election by district. The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. See [[cal.1968-05-16.elections-1968-state-conventions]]. Names: McCarthy. Check: the Times''s page (TimesMachine, by subscription; not read here).'
      tags:
