- add:
    entry:
      id: cal.1968-06-22.elections-1968-state-conventions
      when: June 22
      date: '1968-06-22'
      thread: elections-1968-state-conventions
      c: 'Hartford. Connecticut''s Democratic State convention: McCarthy''s delegates, given 9 of the 44, ask a tenth; refused, some 200 walk out, and the nine places go to uncommitted delegates.'
      n: '"200 M''Carthy Men Bolt in Hartford," [*New York Times*, June 23, 1968](https://timesmachine.nytimes.com/timesmachine/1968/06/23/issue.html), 1. How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): convention; open precinct; closed precinct; the State''s officers chosen a year and more before (its note 2); its report, of the town primaries: "In Connecticut this year, thirty-one primary challenges were invoked and nine changed the results" ([31551](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=177)). The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026, and its note. See [[cal.1968-05-16.elections-1968-state-conventions]]. Names: McCarthy. Check: the Times''s page (TimesMachine, by subscription; not read here).'
      tags:
      - state:ct
      - name:mccarthy-eugene-j
