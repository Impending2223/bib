      c: Oklahoma's Republican State convention pledges its 22 delegates to Goldwater, the first State to.
      n: '"State Becomes First Going for Goldwater for GOP Nomination," [*Daily Oklahoman*, Mar. 1, 1964](https://www.newspapers.com/image/451527290). The figures: [Wikipedia, "1964 Republican Party presidential primaries"](https://en.wikipedia.org/wiki/1964_Republican_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. [[w.novak-agony-of-the-g]]; [[w.white-making-of-the-president-1965]]; [[w.rusher-rise-of-the-right]]; [[w.kessel-goldwater-coalition]]; [[w.perlstein-before-the-storm]]; [[w.middendorf-glorious-disaster]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1963-04-08.elections-1964]]. Names: Goldwater. Check: the paper (newspapers.com, by subscription; not read here).'
