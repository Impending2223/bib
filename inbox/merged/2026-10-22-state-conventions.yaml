      id: cal.1968-05-16.elections-1968-state-conventions
      when: May 16
      date: '1968-05-16'
      thread: elections-1968-state-conventions
      also:
      - georgia
      c: 'Georgia''s Democratic delegation to Chicago named, 43, unpledged. The party''s Rule 55: the State chairman chooses the delegates, with the governor''s advice and consent.'
      n: '"Unpledged Slate Voted in Georgia," [*New York Times*, May 17, 1968](https://timesmachine.nytimes.com/timesmachine/1968/05/17/issue.html), 26; the rule, the Hughes Commission''s report, [114 Cong. Rec. 31548](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=174) (Oct. 14, 1968). How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): appointment. The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. [[w.commission-on-the-democratic-choice]]; [[w.chester-american-melodrama]]; [[w.white-making-of-the-president-1969]]; [[w.selection-mandate-for-reform]]; [[w.shafer-quiet-revolution]]. Bibliography of the Chicago credentials: [[cal.1968-08-26.elections-1968-2]]. Names: Maddox. Check: the Times''s page (TimesMachine, by subscription; not read here).'
      tags:
      - state:ga
      - name:maddox-lester
      - ok:thread-first
