    entry:
      id: cal.1960-12.china-leadership-12
      when: Dec., after the 20th
      date: 1960-12
      thread: china-leadership
      at: after 1960-12-20
      c: The Secretariat takes a formal decision to prepare Liu Shaoqi's selected works, by Deng Liqun's account at the end of the year. Mao had suggested it in 1952 and again in 1960. Liu, reluctant to appear to rival Mao, had procrastinated.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 263. Made public: 1992. To check: [[w.xiaoming-zhonggong-dangjian-shi-1949]], 154–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.11a); Informant J, *Informant J, interview with the author* (undated) (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.11b); Deng Liqun, account of the preparation of Liu Shaoqi''s selected works, in [[w.simin-wo-yanzhongde-liu-shaoqi]], 433–43 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.11c). Names: Mao Zedong, Liu Shaoqi. Check: the day; Deng Liqun does not mention Kang Sheng''s role.'
