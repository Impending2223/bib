      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 263. Made public: 1992. To check: Li Xiannian, speech of June 6, 1962, in [[w.xiannian-li-xiannian-lun-caizheng]], xia, 21, 31, 35 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.14a). Names: Li Xiannian, Liu Shaoqi. Check: whether the speech was made public at the time.'
