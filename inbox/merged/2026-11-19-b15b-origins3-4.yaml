      thread: south-asia
      also:
      - china
      c: 'General Kaul, back in command in NEFA, attacks the Chinese in one area only, the east of the eastern sector, on Nehru''s birthday, against Ding Sheng''s Korean War veterans: an Indian defeat. Kaul then tells New Delhi his forces are too few and urges that foreign forces be brought in.'
