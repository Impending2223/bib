      date: '1962-07-12'
      thread: china-leadership
      c: Li Xiannian, in a speech, refers again to Mao and his thought, when senior officials may have had an inkling that Mao would resume control at the coming Beidaihe conference.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 263. Made public: 1992. To check: Li Xiannian, speech of July 12, 1962, in [[w.xiannian-li-xiannian-lun-caizheng]], xia, 21, 31, 35 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.14b). Names: Li Xiannian, Mao Zedong.'
