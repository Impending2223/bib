        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 266: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 266 n.26: all'
- add:
    entry:
      id: cal.1962-07-09.china-leadership-3
      when: July 9–11
      date: '1962-07-09'
      thread: china-leadership
      c: Mao consults provincial leaders from Henan, Shandong and Jiangxi, among them Henan's first secretary Liu Jianxun and Shandong's Tan Qilong.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 267. Made public: 1993. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1086 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 267 n.28). Names: Mao Zedong. Check: the Mao chronology has Mao, on July 8, ask Liu Shaoqi and others to see the Henan, Shandong and Jiangxi comrades ([[cal.1962-07-08.china-leadership]]); Zhou heard Liu Jianxun at Liu Shaoqi''s July 9 ([[cal.1962-07-09.china-leadership-2]]).'
