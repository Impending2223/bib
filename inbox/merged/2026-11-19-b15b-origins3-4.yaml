      when: May
      date: 1961-05
      thread: china-leadership
      c: At Changsha the editorial group for Liu Shaoqi's selected works, Kang Sheng, Deng Liqun, Xiong Fu and Wang Zongyi, reports to Liu on its work, while he is in the midst of his rural investigation.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 263. Made public: 1988. To check: [[w.li-wang-li-yiyan-wang]], 11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.12a); [[w.zheng-liu-shaoqi-yi-sheng]], 375–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.12b). See [[cal.1960-12.china-leadership-12]]. Names: Liu Shaoqi, Kang Sheng. Check: the day.'
