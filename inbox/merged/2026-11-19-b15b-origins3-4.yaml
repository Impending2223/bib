- add:
    entry:
      id: cal.1962-07.china-leadership-8
      when: July
      date: 1962-07
      thread: china-leadership
      at: after 1962-07-08
      c: Chen Yun writes to Deng Xiaoping, General Secretary, with a copy to Mao, asking leave on grounds of ill health and supporting the Central Committee resolution on strengthening the collective economy that Chen Boda has drafted for Mao.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 267–68. Made public: 1991. To check: [[w.chen-yun-yu-xin]], 168–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 268 n.33a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1085–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 268 n.33b). See [[cal.1962-07-07.china-leadership-3]]. Names: Chen Yun, Deng Xiaoping, Mao Zedong, Chen Boda. Check: the day; the book places it after Mao''s anger of July 7.'
