      c: 'At the airport, leaving for Ceylon, Nehru to the press on the orders in the eastern sector: "Our instructions are to free our territory"; when, he does not say. No talks while the Chinese hold the southern slope of Thag La.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 307–08. To check: [[w.maxwell-indias-china-war]], 369–71 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 308 n.61); [[w.bianjibu-dangdai-zhongguo-junduide-junshi]], 617 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 308 n.62). See [[cal.1962-10-11.south-asia-2]]. Names: Jawaharlal Nehru. Check: the book notes that Chinese statements usually translate only "free" (qingchu diao, get rid of), as Xinhua did three days later (III, 308 n.62).'
