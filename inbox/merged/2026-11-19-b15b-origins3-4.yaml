      c: Sofia. At the customary formal call on Zhivkov after the close of the congress, Wu Xiuquan explains the Chinese position on the border war, to combat any wrong impressions Zhivkov may have got from the Western media. Zhivkov, like Kádár at the Hungarian congress, follows the resumed Soviet line of urging peace in the Himalayas while remaining neutral.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 319. Made public: 1963. To check: [[w.xiuquan-huiyi-yu-huainian]], 344–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 319 n.116); [[w.griffith-albania-and-the-sino]], 165 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 319 n.117). See [[cal.1962-11.soviet-union-2]]. Names: Zhivkov, Kádár. Check: the day.'
