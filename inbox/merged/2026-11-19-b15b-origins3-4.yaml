- add:
    entry:
      id: cal.1962-07-07.china-leadership-3
      when: July 7
      date: '1962-07-07'
      thread: china-leadership
      c: Mao says angrily that dividing the fields for individual operation is revisionism that would unravel the collective system. Chen Yun learns of it the day after his interview.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 267. Made public: 1997. Names: Mao Zedong, Chen Yun. Check: the day, by the book''s "the following day" after Chen Yun''s interview of July 6 ([[cal.1962-07-06.china-leadership-2]]).'
      tags:
