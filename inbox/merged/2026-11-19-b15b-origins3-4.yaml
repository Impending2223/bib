      when: Oct. 14
      date: '1962-10-14'
      thread: china
      also:
      - south-asia
      c: 'A *Renmin ribao* editorial declares that a "massive invasion of Chinese territory by Indian troops in the eastern sector... seems imminent," asks how the Chinese could possibly be "so weak-kneed and faint-hearted" as to tolerate it, and tells the PLA''s border guards to redouble their vigilance: "Be well prepared! Your sacred task now is to defend our territory and be ever-ready to deal resolute counterblows at any invaders."'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 308. To check: [[w.whiting-chinese-calculus-of-deterrence]], 117–18 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 308 n.63). Check: the day; the book says two days after Nehru''s remark.'
