      c: Liu Xiao, back in Peking, reports in minute detail to the centre on the Khrushchev dinner. Mao and Zhou, who trust Khrushchev no more than before, decide that the Soviet leader's expressions of support do not warrant a response.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 314. Made public: 1986. To check: [[w.xiao-chushi-sulian-banian-ambassador]], 122 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 314 n.97). Names: Mao Zedong, Zhou Enlai, Khrushchev. Check: the day.'
