      when: Oct. 27
      date: '1962-10-27'
      thread: china
      also:
      - south-asia
      c: '*Renmin ribao* prints a 15,000-word article, "More on Nehru''s philosophy in the light of the Sino-Indian boundary question," a sequel to its article of 1959 on Nehru''s "philosophy" and the Tibetan revolt. It calls Nehru a "lackey" of US imperialism and a pawn "in the international anti-China campaign." Mao contributes much to it.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 310. Rittenberg, who supervised the translation: over two dozen drafts, Mao, Liu Shaoqi and Zhou Enlai amending, Mao''s amendments dominant (III, 310 n.76). To check: Renmin Ribao, Oct. 27, 1962, ''More on Nehru''s philosophy in the light of the Sino-Indian boundary question'', in [[w.whiting-chinese-calculus-of-deterrence]], 127–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 310 n.76a); [[w.maxwell-indias-china-war]], 419–20 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 310 n.76b); [[w.gopal-jawaharlal-nehru]], 227 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 310 n.76c); [[w.macfarquhar-origins-of-the-cultural]], II, 259 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 310 n.76d); [[w.hu-qiaomu-wenji]], 1, 618–44 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 310 n.76e); Renmin Ribao, Oct. 27, 1962, ''More on Nehru''s philosophy in the light of the Sino-Indian boundary question'', in [[w.rittenberg-man-who-stayed-behind]], 263–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 310 n.76f). Names: Mao Zedong, Jawaharlal Nehru. Check: the author, unknown; Whiting holds the article too long to have been written after Nehru''s rejection of Zhou''s offer.'
