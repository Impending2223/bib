- add:
    entry:
      id: cal.1961-03.china-leadership-18
      when: Mar.
      date: 1961-03
      thread: china-leadership
      also:
      - soviet-union
      c: Canton. Wang Jiaxiang, convalescing during the conference deliberating on the Sixty Articles, is visited by Wang Li, a drafter of the Articles now on his department's staff. Wang Li tells him of deaths from starvation in Hunan, and Wang Jiaxiang weeps. He says the Party must give all its attention to such domestic problems and adopt more conciliatory external policies, to avoid crises with the United States, the Soviet Union and India. He would spend less on foreign aid, and would have China issue a general statement of foreign policy principles stressing its peaceful posture.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 269. Made public: 1988. To check: [[w.li-wang-li-yiyan-wang]], 9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 269 n.47). Check: the day; Wang Li Yiyan dates the meeting 1960, which the book takes for a misprint, since Wang Li was then helping draft the Sixty Articles, in 1961.'
      tags:
