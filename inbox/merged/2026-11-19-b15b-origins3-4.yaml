      when: Oct. 6
      date: '1962-10-06'
      thread: china-leadership
      also:
      - south-asia
      c: 'The PLA General Staff transmits to the border forces a directive from the centre and the Chairman: "If the Indian army attacks, hit back ruthlessly... If they attack, don''t just repulse them, hit back ruthlessly so that it hurts." Mao had complained that the Indians had pressed on the border three years, 1959–61, and that if they tried a fourth year China would strike back.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 307. Made public: 1994. To check: [[w.zhongyin-bianjie-ziwei-fanji]], 179–81, 187 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 307 n.59a); [[w.zhongyin-bianjie-ziwei-fanji]], 191–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 307 n.59b). Names: Mao Zedong. Check: the day; the Mao chronology has the preliminary order and the Standing Committee''s meeting of Oct. 8 ([[cal.1962-10-08.south-asia]], [[cal.1962-10-08.south-asia-2]]).'
      tags:
