      at: after 1962-10-17
      c: The Chinese muster a force of 10,300 men in the east to attack the Indian 7th Brigade, whose strength they estimate at 6,000. In the west their front-line troops are two battalions, increased by 4,000 men including an extra infantry battalion. The eastern sector is chosen for the main assault, as militarily more advantageous and to demonstrate that the Chinese do not accept the McMahon Line.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 308. Made public: 1993. To check: [[w.zhongyin-bianjie-ziwei-fanji]], 183–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 308 n.67a); [[w.xianjin-re-xue-bing-shan]], 99 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 308 n.67b); [[w.zhongyin-bianjie-ziwei-fanji]], 191 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 308 n.68). See [[cal.1962-10-16.china-leadership]]. Check: the day.'
