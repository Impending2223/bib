- add:
    entry:
      id: cal.1962-07.china-leadership-7
      when: July
      date: 1962-07
      thread: china-leadership
      at: after 1962-07-11
      c: Tian Jiaying asks Mao to transfer him to the countryside. Mao refuses.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 267. Made public: 1989. To check: [[w.bian-mao-zedong-he-tade]], 71–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 267 n.31). Names: Mao Zedong. Check: the day; the book places it after the staff meeting at which Mao criticized him.'
