- add:
    entry:
      id: cal.1962.china-leadership-10
      when: '1962'
      date: '1962'
      thread: china-leadership
      c: A small group under Kang Sheng is preparing, at Mao's suggestion, a first volume of Liu Shaoqi's selected works. It is published only after Liu's death, twenty years later.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 263. Made public: 1981. To check: [[w.li-wang-li-yiyan-wang]], 11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.12a); [[w.zheng-liu-shaoqi-yi-sheng]], 375–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.12b); [[w.shaoqi-liu-shaoqi-xuanji-selected-1981]], 97–167 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.13a); [[w.shaoqi-selected-works-of-liu]], 107–68 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.13b). See [[cal.1961-05.china-leadership-9]]. Names: Mao Zedong, Liu Shaoqi, Kang Sheng. Check: the day; the book places the work in the first half of 1962.'
