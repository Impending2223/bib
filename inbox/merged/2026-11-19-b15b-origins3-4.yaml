- add:
    entry:
      id: cal.1962-03-22.china-leadership-3
      when: Mar. 22
      date: '1962-03-22'
      thread: china-leadership
      c: Wuchang, the East Lake guesthouse. Mao receives the seventeen members of Tian Jiaying's rural investigation team, Hubei's first secretary Wang Renzhong present. He asks each one's name and tells political jokes. He tells them to work closely with local cadres at all levels, issue no instructions off the top of the head, carry no preconception but Marxism, mind the historical context, point only to good people and good things, and do some light manual labor.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 264. Made public: 1989. To check: [[w.bian-mao-zedong-he-tade]], 62–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 264 n.15). Names: Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      src:
        c: beabacf5
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 264: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 264 n.15: all'
- add:
    entry:
      id: cal.1962-03.china-leadership-3
      when: Mar.–June
      date: 1962-03
      thread: china-leadership
      at: after 1962-03-22
      c: 'Tian Jiaying''s team investigates in Hunan: Shaoshan, Mao''s home village, the village of Mao''s grandparents and Liu Shaoqi''s home village. The fourth planned site, Tianhua brigade, where Liu had investigated in 1961, is not visited. At Shaoshan the peasants besiege the team with demands for baochan daohu and even fentian daohu. Tian is won over and tells only one colleague. In Liu''s village the peasants live with the 1961 system.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 264–65. Made public: 1989. To check: [[w.bian-mao-zedong-he-tade]], 63–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 264 n.16a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1083–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 264 n.16b); [[w.bian-mao-zedong-he-tade]], 64–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 265 n.17). See [[cal.1962-03-22.china-leadership-3]]. Names: Mao Zedong, Liu Shaoqi. Check: the days; the book gives none for the stay.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      - name:liu-shaoqi
      src:
        c: 8aa96779
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 264–65: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 264 n.16a: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 264 n.16b: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 265 n.17: all'
- add:
    entry:
      id: cal.1962-05.china-leadership-6
      when: May–June
      date: 1962-05
      thread: china-leadership
      c: Tian Jiaying, back from Hunan, reports to Liu Shaoqi in Peking on his home village. Liu receives the report with equanimity.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 265. Made public: 1989. To check: [[w.bian-mao-zedong-he-tade]], 64–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 265 n.17). See [[cal.1962-03.china-leadership-3]]. Names: Liu Shaoqi. Check: the day; the book gives none. The Mao chronology has Tian with Mao at Shanghai May 18 ([[cal.1962-05-18.china-leadership]]).'
      tags:
      - polity:prc
      - vis:only:prc
      - name:liu-shaoqi
      src:
        c: aff10623
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 265: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 265 n.17: all'
- add:
    entry:
      id: cal.1962-05.china-leadership-7
      when: May–June
      date: 1962-05
      thread: china-leadership
      c: Shanghai. Tian Jiaying shows his report to Chen Yun, who is there too. Chen, who had disagreed with Tian at the Canton conference, is very supportive.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 265. Made public: 1989. To check: [[w.bian-mao-zedong-he-tade]], 64–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 265 n.17). See [[cal.1962-05.china-leadership-6]]. Names: Chen Yun. Check: the day; the book gives none.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:chen-yun
      src:
        c: de37be05
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 265: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 265 n.17: all'
- add:
    entry:
      id: cal.1962-05.china-leadership-8
      when: May–June
      date: 1962-05
      thread: china-leadership
      c: 'Shanghai. Tian Jiaying reports orally to Mao, who seems not to have read his report and listens coolly. Mao: "We want to follow the mass line, but there are times when we cannot completely heed the masses. For example, if they want to institute baochan daohu, we cannot listen to them."'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 265. Made public: 1989. To check: [[w.bian-mao-zedong-he-tade]], 65–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 265 n.18). See [[cal.1962-05.china-leadership-7]]. Names: Mao Zedong. Check: the day; the book gives none.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      src:
        c: 869cf50c
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 265: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 265 n.18: all'
- add:
    entry:
      id: cal.1962-06.china-leadership-3
      when: June
      date: 1962-06
      thread: china-leadership
      c: Tian Jiaying, back at Shaoshan where his team is winding up, does not pass on Mao's view on baochan daohu. He sends two team members to examine the Anhui experience.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 265. Made public: 1993. To check: [[w.bangongshi-mao-zedong-yu-xiangtan]], 313–14 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 265 n.20). See [[cal.1962-05.china-leadership-8]]. Names: Mao Zedong. Check: the day; the book places it before Tian returns to Peking at the end of June.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      src:
        c: 2f5b8ba5
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 265: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 265 n.20: all'
- add:
    entry:
      id: cal.1962-06.china-leadership-4
      when: June, late
      date: 1962-06
      thread: china-leadership
      at: before 1962-06-21
      c: 'Peking. Tian Jiaying reports to Liu Shaoqi, who cuts him short: he knows the situation. Liu says: "In industry, we must retreat adequately, and in agriculture, too, we must retreat adequately, including baochan daohu and individual operation." He asks Tian to sound out policy experts without revealing his own view, and agrees that Tian may tell Mao.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 266. Made public: 1993. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1084 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 266 n.22). See [[cal.1962-06.china-leadership-3]]. Names: Liu Shaoqi, Mao Zedong. Check: the day, and whether the quotation is from this occasion ("It may well have been on this occasion," the book says); Tian returned at the end of June.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:liu-shaoqi
      - name:mao-zedong
      src:
        c: 88fa554f
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 266: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 266 n.22: all'
- add:
    entry:
      id: cal.1962-06.china-leadership-5
      when: June, late
      date: 1962-06
      thread: china-leadership
      at: before 1962-06-21
      c: 'Tian Jiaying tells Deng Xiaoping of his plan for a ten-item policy document on reviving the rural economy, to allow many forms of ownership, collective, semi-collective, baochan daohu and even fentian dan''gan. Deng says: "Approved."'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 266. Made public: 1997. See [[cal.1962-06.china-leadership-4]]. Names: Deng Xiaoping. Check: the day; the book gives no source for Deng''s reply.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:deng-xiaoping
      src:
        c: fb1882e0
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 266: all'
- add:
    entry:
      id: cal.1962-06.china-leadership-6
      when: June, late
      date: 1962-06
      thread: china-leadership
      at: before 1962-06-21
      c: Tian Jiaying takes part in Zhongnanhai meetings on baochan daohu and finds the other leaders to whom he confides his views supportive. Almost all the Standing Committee members other than Mao favor baochan daohu or some responsibility system.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 266. Made public: 1989. To check: Informant B, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 266 n.24); [[w.bian-mao-zedong-he-tade]], 67 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 266 n.25a); [[w.qian-wannian-suiyue]], 177–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 266 n.25b); [[w.wenping-zhenli-yu-mingyun-truth]], 193 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 266 n.25c). See [[cal.1962-06.china-leadership-5]]. Names: Mao Zedong. Check: the day; the book gives none. Check: the Standing Committee members'' views rest on Tian''s biography, as the book reads it: Liu, Zhou, Zhu De, Chen Yun and Deng approving, Lin Biao waiting.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      src:
        c: 1a6515e8
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 266: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 266 n.24: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 266 n.25a: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 266 n.25b: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 266 n.25c: all'
- add:
    entry:
      id: cal.1962-07.china-leadership-6
      when: July, early
      date: 1962-07
      thread: china-leadership
      at: before 1962-07-01
      c: Tian Jiaying telephones Hebei, where Mao is again at Handan, to arrange to report his final analysis on baochan daohu. The reply is that Mao says not to hurry, which Tian knows shows Mao's impatience.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 266. Made public: 1993. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1078 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 266 n.26). Names: Mao Zedong. Check: the day; the book gives only ''two days'' before the Peking meeting, which the Mao chronology dates July 6 ([[cal.1962-07-06.china-leadership]]).'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      src:
