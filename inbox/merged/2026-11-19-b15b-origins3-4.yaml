- add:
    entry:
      id: cal.1962-11-24.china-leadership
      when: Nov. 24
      date: '1962-11-24'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Budapest, the final day of the Hungarian congress. In the morning an official asks whether the Chinese delegation will speak at the closing reception that night. As no directive has come from Beijing, Wu Xiuquan promises a reply in the afternoon. A telegram arrives in the lunch interval, with instructions to use the reception to rebut critics on three points: that the worsening of relations between the CPSU and the CCP and the Albanians is attributable to Moscow, that the anti-China chorus is directed by the CPSU, and that party congresses should promote unity, not split. It includes an official Chinese statement to be read out.'
      time_range:
      - 1962-11-24T05:00Z
      - 1962-11-24T11:00Z
      time_band: morning
      time_zone: Europe/Budapest
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 319–20. Made public: 1991. To check: [[w.xiuquan-huiyi-yu-huainian]], 349–52 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 320 n.119). Check: the hour of the telegram; the calendar''s entry for the Peking meeting on the delegation''s cable ([[cal.1962-11.china-leadership]]) is dated after Nov. 21.'
      tags:
      - polity:prc
      - polity:hungary
      - vis:only:prc
