- add:
    entry:
      id: cal.1962-02-27.china-leadership-2
      when: Feb. 27
      date: '1962-02-27'
      thread: china-leadership
      also:
      - soviet-union
      c: Wang Jiaxiang, head of the International Liaison Department, writes to the three men running foreign affairs, Zhou Enlai, Deng Xiaoping and Chen Yi. His deputies, Liu Ningyi and Wu Xiuquan, sign too. He does not write to Mao. He argues for a peaceful international environment so that China can recover at home. World war is not settled as avoidable, nor settled as unavoidable. Aid to revolutionary and nationalist movements should follow "seeking truth from facts", from speeches and declarations to volunteers. China must consider carefully what it spends overseas. Critics later call this the "three reconciliations and one reduction" (san he yi shao).
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 270–71. Made public: 1988. To check: Wang Jiaxiang, Liu Ningyi and Wu Xiuquan, letter of Feb. 27, 1962, to Zhou Enlai, Deng Xiaoping and Chen Yi, in [[w.li-wang-li-yiyan-wang]], 9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.49); Wang Jiaxiang, Liu Ningyi and Wu Xiuquan, letter of Feb. 27, 1962, to Zhou Enlai, Deng Xiaoping and Chen Yi, in [[w.li-wang-li-yiyan-wang]], 9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.50a); Wang Jiaxiang, Liu Ningyi and Wu Xiuquan, letter of Feb. 27, 1962, to Zhou Enlai, Deng Xiaoping and Chen Yi, in [[w.zhonggong-dangshi-renwuzhuan]], 33, 50 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.50b); [[w.bianjizu-wang-jiaxiang-xuanji-selected]], 444–60 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.50c); Wang Jiaxiang, Liu Ningyi and Wu Xiuquan, letter of Feb. 27, 1962, to Zhou Enlai, Deng Xiaoping and Chen Yi, in [[w.jin-1949-1989-niande-zhongguo]], 500–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.50d); [[w.bianjizu-wang-jiaxiang-xuanji-selected]], 450 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.51a); [[w.macfarquhar-origins-of-the-cultural]], II, 272–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.51b); [[w.bianjizu-wang-jiaxiang-xuanji-selected]], 444–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.52); [[w.bianjizu-wang-jiaxiang-xuanji-selected]], 445 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.53). See [[cal.1962-02.china-leadership-7]]. Names: Zhou Enlai, Deng Xiaoping, Chen Yi, Mao Zedong.'
