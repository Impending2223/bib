patch: '2026-11-12-b11-sorensen-counselor'
by: 'Claude (batch 11: Sorensen, Counselor (2008), chapters on 1960-68), Nov. 12, 2026; audited by Claude (batch 11 audit), Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1960-06.elections-1960-nomination-2
      when: June, late
      date: '1960-06'
      thread: elections-1960-nomination
      c: 'Sorensen, by letter, asks some liberal Democrats for drafts of Kennedy''s acceptance speech: "Senator Kennedy''s nomination now appears sufficiently likely that work should be undertaken now on his acceptance speech." A full draft of ten double-spaced pages, or paragraphs "which contain specific themes or striking phrases."'
      n: '[[w.sorensen-counselor]], 218 (Sorensen''s account, written in 2008: "roughly two weeks before the convention"; the letter quoted in part; Freedman and Rostow among those who received it). See [[cal.1960-07-15.elections-1960]]. Names: Sorensen, Kennedy. Check: the day (two weeks before the convention opened July 11).'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1960-07.elections-1960-los-angeles-4
      when: July
      date: '1960-07'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the convention. Two Puerto Rican delegations seek the Credentials Committee''s approval: Luis Muñoz Marín''s, for Johnson, and José Benítez''s, allied with Kennedy. Sorensen mediates: every member of both given a seat on the floor and a half vote, committed to Kennedy.'
      n: '[[w.sorensen-counselor]], 183–84 (Sorensen''s account, written in 2008; Muñoz Marín''s delegation on the advice of Fortas and Porter; "An excellent compromise"; not the committee''s action or the day). Names: Sorensen, Johnson, Kennedy. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1960-09-26.elections-1960-debates-3
      when: Sept. 26
      date: '1960-09-26'
      thread: elections-1960-debates
      c: 'Chicago, the television studio, after the first debate. At a wall pay telephone, with coins from Sorensen, Kennedy calls his father: "Dad, what did you think?" After a long listen: "Thanks, Dad, I''ve got to go to Ohio." To Sorensen: "I still don''t know how I did."'
      n: '[[w.sorensen-counselor]], 190 (Sorensen''s account, written in 2008; the father would have praised "the way you picked yourself up" had his son fallen on the floor; not the hour). See [[cal.1960-09-26.elections-1960]]. Names: Sorensen, Kennedy, Joseph P. Kennedy.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:kennedy-joseph-p'
- add:
    entry:
      id: cal.1961-03.foreign-aid-2
      when: Mar.
      date: '1961-03'
      thread: foreign-aid
      c: 'Sorensen to the President, by memorandum, on the new foreign aid agency: its name, the Agency for International Development or the "Growth Administration For Freedom"; whether the Administrator reports to the Secretary of State or to the President; whether military assistance joins economic aid in one message and agency; whether to ask for more than is needed, given Congress''s cuts.'
      n: '[[w.sorensen-counselor]], 312–13 (Sorensen''s account, written in 2008; March 1961 from the page; the questions listed in part; not the day or the answers). Names: Sorensen, Kennedy. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1961-04.cuba-bay-of-pigs-9
      when: Apr., early
      date: '1961-04'
      thread: cuba-bay-of-pigs
      c: 'Bundy and Bell, at a weekly meeting with Sorensen, let him learn "almost accidentally" of the Cuba plan and its imminence. Sorensen asks the President in the Oval Office; he grimaces and will not discuss it, saying that those who know the subject are trying to protect themselves: "I know, everyone''s grabbing their nuts on this one."'
      n: '[[w.sorensen-counselor]], 316 (Sorensen''s account, written in 2008; "early in April"; the words as the page prints them; not the day). Names: Bundy, Bell, Sorensen, Kennedy. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:bundy-mcgeorge'
      - 'name:bell-david-e'
- add:
    entry:
      id: cal.1961-04-13.space
      when: Apr. 13
      date: '1961-04-13'
      thread: space
      c: 'The day after Gagarin''s flight, the President, with an interview on the space program due with Hugh Sidey of *Time*, asks Sorensen to gather a group to determine how the United States can best respond.'
      n: '[[w.sorensen-counselor]], 334 (Sorensen''s account, written in 2008: "On the following day"; not the hour). Names: Kennedy, Sorensen, Sidey.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:sidey-hugh'
- add:
    entry:
      id: cal.1961-04-14.space
      when: Apr. 14
      date: '1961-04-14'
      thread: space
      c: 'Sorensen''s office: Bell and his assistants, Wiesner and his space experts, Dryden. The Soviet lead in rocket thrust will win every first, but a manned lunar landing is far enough off that the United States might have as good a chance. Sorensen, by his recollection, first discusses the moon here.'
      n: '[[w.sorensen-counselor]], 334–35 (Sorensen''s account, written in 2008: "That Friday, April 14"; "I believe it was at this meeting"; the meetings that day "merge in my memory"). Names: Sorensen, Bell, Wiesner, Dryden.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:bell-david-e'
      - 'name:wiesner-jerome-b'
      - 'name:dryden-hugh-l'
- add:
    entry:
      id: cal.1961-04-14.space-2
      when: Apr. 14
      date: '1961-04-14'
      thread: space
      c: 'The Cabinet Room, evening: the President, Sorensen, other advisers and Hugh Sidey on the options in space. Sidey asks about going to the moon; Kennedy: "Wait here," and calls Sorensen into the Oval Office, incredulous but excited: "Get it staffed out. ... Go find out what McNamara''s department thinks."'
      n: '[[w.sorensen-counselor]], 335–36 (Sorensen''s account, written in 2008; "I do not recall precisely what was said"; Sorensen then tells Sidey, "We''re going to the moon," not entered). See [[cal.1961-04-12.space-2]]. Names: Kennedy, Sorensen, Sidey.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:sidey-hugh'
- add:
    entry:
      id: cal.1961-07-17.berlin-and-vienna-3
      when: July 17
      date: '1961-07-17'
      thread: berlin-and-vienna
      c: 'Sorensen to the President, "The Decision on Berlin," four and a half pages: against the more militant options, a declaration of a national emergency and a call-up of the reserves and National Guard, which might engage Khrushchev''s prestige and divide the West; for a televised address; "Is a wholly negative diplomatic posture necessary now?" The UN or the World Court to be explored.'
      n: '[[w.sorensen-counselor]], 321–22 (Sorensen''s account, written in 2008; the President had asked him to analyze the advice and start work on a speech). See [[cal.1961-07-17.berlin-and-vienna-2]]. Names: Sorensen, Kennedy, Khrushchev.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:khrushchev-nikita-s'
- add:
    entry:
      id: cal.1961-09.press-and-broadcasting
      when: Sept., mid
      date: '1961-09'
      thread: press-and-broadcasting
      c: 'A private home, off the record. O''Brien and Sorensen to some thirty reporters from the major media markets, after Congress adjourns: a three-page memorandum, "for your information in writing your stories ... not to be attributed to the White House," on the session''s "substantial" accomplishments. The *Chicago Tribune* reports a shout: "Do you expect us to swallow this bunk?"'
      n: '[[w.sorensen-counselor]], 344–45 (Sorensen''s account, written in 2008; the shout from the *Tribune*, which had a copy of the memorandum; "Propaganda" in red pen on his Library copy). Names: O''Brien, Sorensen. Check: the day; the session adjourned Sept. 27, after mid-month.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:obrien-lawrence-f'
- add:
    entry:
      id: cal.1961-11.transition-and-staff-3
      when: Nov., Thanksgiving
      date: '1961-11'
      thread: transition-and-staff
      c: 'Told by Rusk that he is to leave the State Department as Under Secretary, Bowles threatens to resign. Sorensen, just come to Hyannis Port with the President for Thanksgiving, is sent back to Washington on Air Force One to keep Bowles from making a storm; they talk for hours in Bowles''s office, Sorensen affirming the new role and a White House car. Kennedy: "Ted, that''s your best work since the Michigan delegation!"'
      n: '[[w.sorensen-counselor]], 235 (Sorensen''s account, written in 2008; the President had told only Rusk, Robert Kennedy and Sorensen; Adzhubei on the plane, not entered). See [[cal.1961-11-26.transition-and-staff]]. Names: Bowles, Rusk, Sorensen, Kennedy. Check: the day; Adzhubei interviewed Kennedy at Hyannis Port Nov. 25 ([[cal.1961-11-25.berlin-and-vienna]]).'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:bowles-chester'
      - 'name:rusk-dean'
- add:
    entry:
      id: cal.1961-12.transition-and-staff-3
      when: Dec.
      date: '1961-12'
      thread: transition-and-staff
      c: Kennedy flies to Palm Beach on Air Force One to see his father after the stroke, taking Sorensen to work on the plane on the legislative planning for 1962.
      n: '[[w.sorensen-counselor]], 262 (Sorensen''s account, written in 2008: "Shortly afterward"; not the day or the stay). See [[cal.1961-12-19.transition-and-staff]]. Names: Kennedy, Sorensen, Joseph P. Kennedy. Check: the day; the stroke Dec. 19.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:kennedy-joseph-p'
- add:
    entry:
      id: cal.1962-01-20.democratic-party
      when: Jan. 20
      date: '1962-01-20'
      thread: democratic-party
      c: 'The Democratic National Committee''s fund-raising dinner, a year after the inaugural: a parody of the inaugural address, which Kennedy and Sorensen enjoyed, ending: "ask not what your party can give to you—ask what you can give to your party. Let us never contribute to our own decline; but let us never decline a contribution." Robert Kennedy had cautioned against mocking the inaugural.'
      n: '[[w.sorensen-counselor]], 225–26 (Sorensen''s account, written in 2008, "exactly one year after the inaugural"; he does not say who spoke it). Names: Kennedy, Sorensen, Robert Kennedy. Check: the day; whether Kennedy delivered it.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:kennedy-robert-f'
- add:
    entry:
      id: cal.1962-06.latin-america
      when: June
      date: '1962-06'
      thread: latin-america
      c: 'The bedroom session before a press conference. Asked by Sorensen about the Mexican ambassador to the OAS, who had criticized his policies and urged him to cancel the coming trip to Mexico City, Kennedy first tries a stiff, evasive non-answer, then: "It means that no little SOB in the Mexican government is going to stop my trip!"'
      n: '[[w.sorensen-counselor]], 342 (Sorensen''s account, written in 2008; at the conference an hour or so later the answer was "This is really a matter between the representative and his government rather than between this government and the representative," not entered). Names: Sorensen, Kennedy. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1962-09-30.mississippi-ole-miss-6
      when: Sept. 30
      date: '1962-09-30'
      thread: mississippi-ole-miss
      c: 'The Cabinet Room, the night of the riot at Oxford: the President, Robert Kennedy and Sorensen, with, as Sorensen recalls, O''Donnell, O''Brien and Burke Marshall; constant telephone calls; Johnson absent. Kennedy: "I haven''t had such an interesting time since the Bay of Pigs." Sorensen suggests the Attorney General might provide air cover for his marshals. Sorensen, to the President, of the rioting: "Sad day in our country."'
      n: '[[w.sorensen-counselor]], 276 (Sorensen''s account, written in 2008; "as I recall"; the last words from the transcript of a chat that night; Robert Kennedy seeing to tear gas, not entered). See [[cal.1962-09-30.mississippi-ole-miss]]. Names: Kennedy, Robert Kennedy, Sorensen, O''Donnell, O''Brien, Marshall, Johnson.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:kennedy-robert-f'
      - 'name:odonnell-kenneth-p'
      - 'name:obrien-lawrence-f'
      - 'name:marshall-burke'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1962-11-05.transition-and-staff
      when: Nov. 5
      date: '1962-11-05'
      thread: transition-and-staff
      c: 'The Oval Office, recorded, after the missile crisis: the President considers moving Bundy to the State Department, Sorensen to Bundy''s place and Feldman to Sorensen''s as Counsel: "Number one, put Sorensen in Bundy''s place; put Feldman in Sorensen''s place as Counsel ... Sorensen and Bundy are equally good."'
      n: '[[w.sorensen-counselor]], 236 (Sorensen''s account, written in 2008, of a transcript a presidential historian brought him in 2001; not the hour or the speakers present). To check: the recording. Names: Kennedy, Bundy, Sorensen, Feldman.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:bundy-mcgeorge'
      - 'name:feldman-myer'
- add:
    entry:
      id: cal.1963-02-12.transition-and-staff
      when: Feb. 12
      date: '1963-02-12'
      thread: transition-and-staff
      c: 'Sorensen to the President, "Overnight Observations," on the State Department, asked for the day before: a new chief needs "solid judgment attuned to your own, imaginative ideas and initiative ... and a tough, efficient capacity for administration and organization." For the number two post, Robert Kennedy, Bundy, Bell or Clifford, with Harriman behind; unless the right person is available, keep the present team and "lay the groundwork for a wholesale change in January 1965."'
      n: '[[w.sorensen-counselor]], 236 (Sorensen''s account, written in 2008; the memorandum quoted in part; "I was no expert on the department''s problems"). See [[cal.1962-11-05.transition-and-staff]]. Names: Sorensen, Kennedy, Robert Kennedy, Bundy, Bell, Clifford, Harriman.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:kennedy-robert-f'
      - 'name:bundy-mcgeorge'
      - 'name:bell-david-e'
      - 'name:clifford-clark'
      - 'name:harriman-w-averell'
- add:
    entry:
      id: cal.1963-05.alabama
      when: May, early
      date: '1963-05'
      thread: alabama
      c: 'Sorensen to the President, "The Range of Alternatives in Birmingham": private presidential telephone calls to the parties, including the local newspaper publisher; a public presidential statement by telephone loudspeaker, and a call on both sides to sit down with Marshall and Hodges; a White House meeting of Negro and business leaders from Birmingham with its new Mayor; a board of fact-finders and mediators; legal action, including federalizing the Alabama Guard before the Governor could mobilize it. Nationally, a conference of business, labor and Negro leaders.'
      n: '[[w.sorensen-counselor]], 277–78 (Sorensen''s account, written in 2008; "Early in May 1963"; the five steps as the page lists them, in part). Names: Sorensen, Kennedy, Marshall, Hodges. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:marshall-burke'
      - 'name:hodges-luther-h'
- add:
    entry:
      id: cal.1963-06-11.civil-rights-bill-2
      when: June 11
      date: '1963-06-11'
      thread: civil-rights-bill
      c: 'The Oval Office, the schoolhouse door on television. As Wallace leaves the doorway, Kennedy to Sorensen: "I think we''d better give that speech tonight." No decision had been made and no draft prepared; O''Donnell and O''Brien opposed a speech, Sorensen had reservations. Kennedy settles on 8 p.m.; Salinger asks the networks for the time, by then after 4:30 p.m. Robert Kennedy, come with Burke Marshall: "Don''t worry, we have a lot of good material over at the Justice Department that we can send to you."'
      n: '[[w.sorensen-counselor]], 278–79 (Sorensen''s account, written in 2008; Sorensen "made some noises about limited time"; not the hour of the decision). See [[cal.1963-06-11.alabama]]. Names: Kennedy, Sorensen, Wallace, O''Donnell, O''Brien, Salinger, Robert Kennedy, Marshall.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:wallace-george-c'
      - 'name:odonnell-kenneth-p'
      - 'name:obrien-lawrence-f'
      - 'name:salinger-pierre'
      - 'name:kennedy-robert-f'
      - 'name:marshall-burke'
- add:
    entry:
      id: cal.1963-06-11.civil-rights-bill-4
      when: June 11
      date: '1963-06-11'
      thread: civil-rights-bill
      c: 'Sorensen drafts the civil rights address. Kennedy comes to his office, the only time in three years he did so to ask about a speech; Sorensen: "Don''t worry. It''s in the typewriter now." In the Cabinet Room, with Robert Kennedy and Burke Marshall, Kennedy marks up the first draft, mostly in tone: "The cesspools of segregation and discrimination exist in every state" becomes "difficulties over segregation and discrimination exist in every city"; "But the pace is still shamefully slow," "But the pace is very slow." At four minutes to eight Sorensen is still at work; his closing dropped for the paragraphs Kennedy had scribbled while waiting.'
      n: '[[w.sorensen-counselor]], 279–82 (Sorensen''s account, written in 2008; Kennedy: "Oh, I thought I was going to have to go off the cuff on national television"; Robert Kennedy recalled that when he returned about 7 p.m. the first draft was unsatisfactory; the other edits, and the closing''s repeated statistics, not entered). See [[cal.1963-06-11.civil-rights-bill-2]]. Names: Sorensen, Kennedy, Robert Kennedy, Marshall. Check: the hours of the visit and the markup.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:kennedy-robert-f'
      - 'name:marshall-burke'
- add:
    entry:
      id: cal.1963-06-11.civil-rights-bill-6
      when: June 11
      date: '1963-06-11'
      thread: civil-rights-bill
      c: 'Washington, dinner at Joe Alsop''s. When the guests say, "Let''s tune in the president''s speech," Bundy: "There isn''t going to be a speech. I just left the White House 30 minutes ago and Sorensen didn''t have a draft yet."'
      n: '[[w.sorensen-counselor]], 279 (Sorensen''s account, written in 2008; "That was true. I didn''t."). Names: Bundy, Alsop, Sorensen. Check: the hour.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:bundy-mcgeorge'
      - 'name:alsop-joseph'
- add:
    entry:
      id: cal.1963-06-09.testing
      when: June 9–10
      date: '1963-06-09'
      thread: testing
      c: Aboard the plane home from Honolulu, overnight, Kennedy reviews the American University draft with Sorensen and adds, as a concrete demonstration, a unilateral moratorium on atmospheric nuclear tests. By telephone he has Bundy show it to the Secretaries of State and Defense, but not circulate copies in their departments.
      n: '[[w.sorensen-counselor]], 326–27 (Sorensen''s account, written in 2008; the mayors'' speech June 9, back at Andrews Monday morning; the moratorium approved the morning of the address by the Chairman of the Joint Chiefs and the Chairman of the Atomic Energy Commission, not entered; "safe for diversity" for Wilson''s "safe for democracy," agreed between Kennedy and Sorensen, not dated). See [[cal.1963-06-08.testing]]. Names: Kennedy, Sorensen, Bundy.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:bundy-mcgeorge'
- add:
    entry:
      id: cal.1963-06-26.berlin-and-vienna-5
      when: June 26
      date: '1963-06-26'
      thread: berlin-and-vienna
      c: 'West Berlin, the luncheon in City Hall after the speech. Bundy to Sorensen: the speech''s reference to the West''s inability to work with the Communists needs correcting, weeks before the Moscow talks on a test ban. They insert new material into the afternoon speech to students at the Free University: the "winds of change" over the Iron Curtain, and "the power of historical evolution" to be felt in Eastern Europe too.'
      n: '[[w.sorensen-counselor]], 325 (Sorensen''s account, written in 2008; the quotations as the page gives them). See [[cal.1963-06-26.berlin-and-vienna]]. Names: Bundy, Sorensen.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:bundy-mcgeorge'
- add:
    entry:
      id: cal.1963-11-12.elections-1964-2
      when: Nov. 12
      date: '1963-11-12'
      thread: elections-1964
      c: 'Sorensen, memorandum for the strategy meeting, on the Democratic convention of 1964: "the present system is substantively illogical, harmful, and unfair, if not unconstitutional"; delegates to be apportioned on "one man-one vote." No attention is paid.'
      n: '[[w.sorensen-counselor]], 347 (Sorensen''s account, written in 2008; the memorandum quoted in part; "That grand if unrealistic suggestion received no attention"). See [[cal.1963-11-12.elections-1964]]. Names: Sorensen. Check: the day (prepared for the meeting).'
      tags:
      - 'name:sorensen-theodore-c'
- add:
    entry:
      id: cal.1963-11.elections-1964-3
      when: Nov.
      date: '1963-11'
      thread: elections-1964
      c: 'Omaha, the Annual State Democratic Dinner. Sorensen, the keynote speaker, makes clear that Kennedy will run in 1964. He calls him "a president who cares about America" and names three "overriding qualities needed in a president—a creative mind, a compassionate heart, and a courageous spirit."'
      n: '[[w.sorensen-counselor]], 349–50 (Sorensen''s account, written in 2008; "Shortly after our early November planning and strategy session"; no clearance or instructions). Names: Sorensen, Kennedy. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1963-11-19.elections-1964
      when: Nov. 19
      date: '1963-11-19'
      thread: elections-1964
      c: 'Sorensen to Arthur Krim, thanking him for the hospitality of the previous weekend in New York: "I will be sending some materials on convention movies to you, Arthur, as soon as I get the President off to Texas on Thursday."'
      n: '[[w.sorensen-counselor]], 350 (Sorensen''s account, written in 2008; the letter quoted in part). Names: Sorensen.'
      tags:
      - 'name:sorensen-theodore-c'
- add:
    entry:
      id: cal.1963-11-21.assassination-2
      when: Nov. 21
      date: '1963-11-21'
      thread: assassination
      c: '10:45 a.m., the White House back lawn. Sorensen runs out to the President at the helicopter and hands him the material on Texas humor he had asked for that morning. Their last talk; Sorensen does not remember what they said.'
      n: '[[w.sorensen-counselor]], 360 (Sorensen''s account, written in 2008; the day before he had given suggestions to Mrs. Kennedy''s assistant for her appearance before a Spanish-speaking audience, not entered). Names: Sorensen, Kennedy.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1963-11-22.elections-1964-5
      when: Nov. 22
      date: '1963-11-22'
      thread: elections-1964
      c: Washington, the Carlton Hotel, suite 1412, noon. Roy Roberts, president and editor of the Kansas City Star, asks Sorensen about rumors that Kennedy will drop Johnson from the ticket in 1964. Sorensen replies that the President has every intention of keeping him.
      n: '[[w.sorensen-counselor]], 361 (Sorensen''s account, written in 2008; Roberts wanted to discuss the leadership and program of the administration). Names: Sorensen, Kennedy, Johnson.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1963-11-26.succession-7
      when: Nov. 26
      date: '1963-11-26'
      thread: succession
      c: 'Tuesday evening. Sorensen submits his draft of the address to Congress to Johnson, who glances at it and says he "wouldn''t change a word." In Bundy''s office, with McNamara and Rusk, Sorensen is told, when Johnson comes in with Fortas and Jenkins: "We made some changes because it sounds too much like President Kennedy."'
      n: '[[w.sorensen-counselor]], 382 (Sorensen''s account, written in 2008; Sorensen did not see the draft again until just before delivery; the opening line "I who cannot fill his shoes must occupy his desk" deleted, not dated). See [[cal.1963-11-24.succession-4]]. Names: Sorensen, Johnson, Bundy, McNamara, Rusk, Fortas, Jenkins. Check: the hour.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:johnson-lyndon-b'
      - 'name:bundy-mcgeorge'
      - 'name:mcnamara-robert-s'
      - 'name:rusk-dean'
      - 'name:fortas-abe'
      - 'name:jenkins-walter-w'
- add:
    entry:
      id: cal.1963-12-02.succession-3
      when: Dec. 2
      date: '1963-12-02'
      thread: succession
      c: 'Johnson meets O''Brien, O''Donnell and Sorensen: he and the country need them, and Kennedy would have wanted them to stay. O''Brien and O''Donnell agree to stay at least through the transition. Asked whether he is "with him," Sorensen: "I''m still here, Mr. President."'
      n: '[[w.sorensen-counselor]], 384–85 (Sorensen''s account, written in 2008: "That same day," the Monday after the speech). See [[cal.1963-12-02.civil-rights-bill-2]]. Names: Johnson, O''Brien, O''Donnell, Sorensen. Check: the hour.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:johnson-lyndon-b'
      - 'name:obrien-lawrence-f'
      - 'name:odonnell-kenneth-p'
- add:
    entry:
      id: cal.1963-12-05.transition-and-staff-2
      when: Dec. 5
      date: '1963-12-05'
      thread: transition-and-staff
      c: 'Sorensen, for the first time in government, writes confidential notes for history, "Notes on What Happens to Government When the President Dies": O''Brien, Dungan and Reardon uncertain of the future; Eisenhower and Anderson telling the new President to cut the budget; Dillon moving in Heller''s absence; Wirtz walking out of Johnson''s talk to the Business Council; Bundy and Rusk competing to flatter Johnson; "First message to Congress altered, no longer a tribute to JFK."'
      n: '[[w.sorensen-counselor]], 385–86 (Sorensen''s account, written in 2008; the notes quoted in part; "written in anger as well as sorrow"). Names: Sorensen, O''Brien, Dungan, Eisenhower, Anderson, Johnson, Dillon, Heller, Wirtz, Bundy, Rusk, Kennedy.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:johnson-lyndon-b'
      - 'name:kennedy-john-f'
      - 'name:obrien-lawrence-f'
      - 'name:dillon-c-douglas'
      - 'name:heller-walter-w'
      - 'name:bundy-mcgeorge'
      - 'name:rusk-dean'
      - 'name:dungan-ralph-a'
      - 'name:eisenhower-dwight-d'
      - 'name:anderson-robert-b'
      - 'name:wirtz-w-willard'
- add:
    entry:
      id: cal.1963-12.program-2
      when: Dec., ranch
      date: '1963-12'
      thread: program
      c: 'The Johnson Ranch, over the Christmas–New Year holidays, a late session on the State of the Union proposals. Sorensen''s last item, from the 1962 White House Conference on Narcotics, is expanded federal enforcement with treatment and rehabilitation. Johnson: "Drugs? I don''t want to have anything to do with them. Just lock them up and throw away the key!" Sorensen deletes it from the speech and keeps it in the legislative program.'
      n: '[[w.sorensen-counselor]], 387 (Sorensen''s account, written in 2008; the Drug Abuse Control Amendments of 1965 and the Addict Rehabilitation Act of 1966 followed). See [[cal.1963-12-30.program]]. Names: Johnson, Sorensen. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1964-01.transition-and-staff
      when: Jan.
      date: '1964-01'
      thread: transition-and-staff
      c: 'Sorensen to Johnson, by memorandum, "U.S. Peace Offensive": food surpluses to the hungry of all nations; the Bering Strait a "Sea of Peace"; a demilitarized and denuclearized boundary between the United States and the Soviet Union. On Vietnam, a public proposal to Khrushchev for neutralizing both parts and an end to all military activity there by the United States and North Vietnam.'
      n: '[[w.sorensen-counselor]], 388 (Sorensen''s account, written in 2008; "My proposals fell on deaf ears"; the memorandum described, not quoted at length; not the day). Names: Sorensen, Johnson, Khrushchev. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:johnson-lyndon-b'
      - 'name:khrushchev-nikita-s'
- add:
    entry:
      id: cal.1964-02-19.transition-and-staff
      when: Feb. 19
      date: '1964-02-19'
      thread: transition-and-staff
      c: 'The Benjamin Franklin Room, Department of State: a farewell party for Sorensen, with Goldberg as master of ceremonies. The cabinet, the White House staff, Chief Justice Warren, Justices Brennan and White, Lippmann, Katharine Graham, Moyers and Valenti attend; Rusk and Feldman speak; Johnson and Mrs. Johnson drop by.'
      n: '[[w.sorensen-counselor]], 390–91 (Sorensen''s account, written in 2008; Roncalio and Senator Paul Douglas also named; Rusk''s and Feldman''s jests, not entered). Names: Sorensen, Goldberg, Warren, Brennan, White, Lippmann, Graham, Moyers, Valenti, Rusk, Feldman, Johnson, Lady Bird Johnson.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:goldberg-arthur-j'
      - 'name:lippmann-walter'
      - 'name:graham-katharine'
      - 'name:moyers-bill'
      - 'name:valenti-jack'
      - 'name:rusk-dean'
      - 'name:feldman-myer'
      - 'name:johnson-lyndon-b'
      - 'name:johnson-lady-bird'
      - 'name:warren-earl'
      - 'name:brennan-william-j-jr'
      - 'name:white-byron-r'
- add:
    entry:
      id: cal.1966-01.robert-kennedy-2
      when: Jan.
      date: '1966-01'
      thread: robert-kennedy
      c: 'The Supreme Court, a snowy day. Robert Kennedy, a member of the Court''s bar, moves the admission of Sorensen: "I am satisfied that he possesses the qualifications." Chief Justice Warren smiles down from the bench.'
      n: '[[w.sorensen-counselor]], 255 (Sorensen''s account, written in 2008, quoting *Time*; "that snowy day in January 1966"; not the day). Names: Robert Kennedy, Sorensen, Warren. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-robert-f'
      - 'name:warren-earl'
- add:
    entry:
      id: cal.1966-12.robert-kennedy-7
      when: Dec.
      date: '1966-12'
      thread: robert-kennedy
      c: 'Robert Kennedy asks Sorensen to examine the whole file on the leaks, through Drew Pearson and others, that as Attorney General he had greatly expanded FBI wiretapping, King''s conversations included: by Sorensen''s reading, Johnson and Hoover smearing him, Senator Edward Long of Missouri their instrument. Sorensen prepares for Kennedy''s signature a letter to Long urging a "comprehensive" hearing, with Kennedy, Hoover and Johnson''s closest aides to testify under oath.'
      n: '[[w.sorensen-counselor]], 255 (Sorensen''s account, written in 2008; "One day in December 1966"; Sorensen later hands the draft to Clifford, the leaks stop, and the letter is never sent, not dated). Names: Robert Kennedy, Sorensen, Pearson, King, Johnson, Hoover, Long. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-robert-f'
      - 'name:johnson-lyndon-b'
      - 'name:king-martin-luther-jr'
      - 'name:pearson-drew'
      - 'name:hoover-j-edgar'
      - 'name:long-edward-v'
- add:
    entry:
      id: cal.1968-04-04.robert-kennedy-campaign-4
      when: Apr. 4
      date: '1968-04-04'
      thread: robert-kennedy-campaign
      c: 'The night of King''s death. Kennedy telephones Sorensen at home in Washington for thoughts on the speech scheduled for Cleveland next day, and will call back in an hour. Sorensen scribbles notes, and reads them to Kennedy, who writes them down: "mindless menace of violence in America"; "violence breeds violence, repression brings retaliation, and only a cleansing of our whole society can remove this sickness from our soul."'
      n: '[[w.sorensen-counselor]], 463–64 (Sorensen''s account, written in 2008; the notes quoted in part; Kennedy''s staff inserted the language into their draft that night). See [[cal.1968-04-04.robert-kennedy]]. Names: Sorensen, Robert Kennedy, King.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-robert-f'
      - 'name:king-martin-luther-jr'
- add:
    entry:
      id: cal.1968-06-04.robert-kennedy-campaign-4
      when: June 4
      date: '1968-06-04'
      thread: robert-kennedy-campaign
      c: 'Los Angeles, the Ambassador, Kennedy''s suite, after the California victory is clear. Before he goes down to the Embassy Ballroom, Kennedy talks with Sorensen in the bathroom, the only quiet spot: the loss in Oregon, the weeks ahead, a trip to Romania, a delegate hospitality headquarters at Hyannis Port for East Coast delegates, including those leaning to Humphrey.'
      n: '[[w.sorensen-counselor]], 465 (Sorensen''s account, written in 2008; the night of the primary, the talk before the victory speech, given after midnight; Stephen Smith, Edward Kennedy and Sorensen had planned an all-day meeting with him for the next day, not entered). See [[cal.1968-06-04.robert-kennedy-campaign-3]]. Names: Sorensen, Robert Kennedy, Humphrey. Check: the hour.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-robert-f'
      - 'name:humphrey-hubert-h'
- add:
    entry:
      id: cal.1968-07-13.elections-1968-3
      when: July 13
      date: '1968-07-13'
      thread: elections-1968
      c: 'New York, Rockefeller''s Fifth Avenue apartment, breakfast. Rockefeller tells Sorensen that Lindsay and Sorensen are the only prospects for Robert Kennedy''s Senate seat with whom he has talked, Sorensen the only Democrat given "active" consideration, and that Sorensen could help in "creating a climate" for his own Republican nomination. He fears Republican leaders would be "extremely angry" if he named a Democrat.'
      n: '[[w.sorensen-counselor]], 468–69 (Sorensen''s account, written in 2008, with his private memorandum of the talk quoted in part; Kissinger and Sorensen''s future father-in-law as intermediaries, not entered). Names: Rockefeller, Sorensen, Lindsay, Robert Kennedy.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-robert-f'
      - 'name:rockefeller-nelson'
      - 'name:lindsay-john-v'
- cite:
    id: cal.1960-10-25.king
    item: '[[w.sorensen-counselor]], 271–72 (Sorensen''s account, written in 2008: after "an intensive hotel room debate among his advisors" Kennedy calls Coretta King; Sorensen was among those arguing against the call; a Georgia judge sentenced King to four months at hard labor for a "traffic technicality"; not the day, Wofford or Shriver, or Robert Kennedy''s call to the judge)'
    units: '?'
- cite:
    id: cal.1960-06-29.elections-1960
    item: '[[w.sorensen-counselor]], 243 (Sorensen''s confidential memorandum to John and Robert Kennedy "one week before the 1960 convention," Johnson first on the vice-presidential list: "helps with the farmers, Southerners and Texas; easier to work with in this position than as Majority Leader"; Stevenson, Humphrey, Yarborough, Engle and Symington after him; Freeman and Jackson among men "handicapped by being young"; Docking and Loveless "conservative, inarticulate"; the memorandum quoted in part; not the day or "too much like JFK")'
    units: B
- cite:
    id: cal.1960-06.elections-1960-2
    item: '[[w.sorensen-counselor]], 242 (June, "a few weeks before the convention," Bobby Baker takes Sorensen aside after a dinner at Joe Alsop''s to confide, "undoubtedly on instructions from LBJ," that Johnson was coming around to accepting second place if he did not win first; not Baker''s words or any doubt of Sorensen''s)'
    units: '?'
- cite:
    id: cal.1960-07-04.elections-1960
    item: '[[w.sorensen-counselor]], 182–83 (Truman''s denunciation; Sorensen summoned to Hyannis Port from Los Angeles; the reply on national television, with Jefferson, Columbus and Alexander the Great from Sorensen''s file of young achievers; the notes typed on the porch by Mrs. William Battle; Sorensen''s account, written in 2008; not the day or the quotations)'
    units: '?'
- cite:
    id: cal.1960-07-04.robert-kennedy
    item: '[[w.sorensen-counselor]], 193 (at a convention press conference two of Johnson''s top aides question Kennedy''s life expectancy on the ground of Addison''s disease; the Kennedy for President press office issues a statement from Robert Kennedy that the candidate "does not now nor has he ever had an ailment described classically as Addison''s Disease, which is a tuberculous destruction of the adrenal gland"; not the day, the doctors'' report or "malicious and false")'
    units: '?'
- cite:
    id: cal.1960-07-15.elections-1960
    item: '[[w.sorensen-counselor]], 217–19 (Sorensen''s drafting of the acceptance speech: his letter two weeks before the convention soliciting drafts; "the New Frontier" first in one of his drafts, by his recollection; not the text)'
    units: '?'
- cite:
    id: cal.1960-09-25.elections-1960-4
    item: '[[w.sorensen-counselor]], 189–90 (the morning of the first debate, on the roof of Kennedy''s Chicago hotel, Kennedy with Feldman and Sorensen goes through Feldman''s card file of positions and questions, with no rehearsal or debate coach; after lunch he naps under his cards and drives himself to the studio; Sorensen''s account, written in 2008; not the Knickerbocker or the length of the work)'
    units: A
- cite:
    id: cal.1960-11-09.elections-1960-11
    item: '[[w.sorensen-counselor]], 196–97 (election night at Hyannis Port, Kennedy sleeping at his own house; early in the morning Sorensen, alone at the television, goes to his bedroom, congratulates him as the next President and tells him the morning news has California in his column, mistakenly as it later turned out; his mother-in-law telephones; not the hour)'
    units: '?'
- cite:
    id: cal.1960-11-09.transition-and-staff
    item: '[[w.sorensen-counselor]], 198–99 (a day or two after the election, Kennedy begins the first staff meeting at Hyannis Port by saying he wants Sorensen for the post of principal adviser on domestic policy, and announces it that afternoon to the press: "He will begin work immediately to assist me in preparing for a new administration, having worked with me on policy matters during the past eight years"; Clifford''s and Neustadt''s reports; not the other posts or the day)'
    units: '?'
- cite:
    id: cal.1960-12.transition-and-staff-4
    item: '[[w.sorensen-counselor]], 200 (December, Sorensen''s first one-on-one meeting of any length with Kennedy since the nomination: he should decline the speaking invitations, "Keep your head down"; Sherman Adams, Harry Hopkins and Colonel House "ended up in the shithouse"; at the same meeting Sorensen reviews his choices for deputies and assistants, fourteen names, and the transition task forces)'
    units: '?'
- cite:
    id: cal.1961-01-09.transition-and-staff
    item: '[[w.sorensen-counselor]], 219–20 (Kennedy''s "Farewell to Massachusetts," delivered Jan. 9, drafted by Sorensen at the height of the transition; the "city upon a hill" from Winthrop and questions on integrity borrowed from Roosevelt; Kennedy''s parents thought it should have been kept for the inaugural; not Cambridge, the Overseers or the other business of the day)'
    units: '?'
- cite:
    id: cal.1961-01-15.transition-and-staff-cabinet
    item: '[[w.sorensen-counselor]], 231 (Goldberg''s brunch for the entire cabinet on the Sunday before the inauguration, where Sorensen saluted them in doggerel, "All hail the men of new frontiers"; not the lox and bagels or Kennedy at Palm Beach)'
    units: A
- cite:
    id: cal.1961-01-19.civil-rights-the-executive
    item: '[[w.sorensen-counselor]], 221 (the inaugural''s one domestic reference, added on the final day on the suggestion of Wofford and Louis Martin, the words "at home and around the world" after "those human rights to which this nation has been committed, and to which we are committed today"; Sorensen''s proposed question to the audience was not used; Sorensen does not say who wrote the words in)'
    units: '?'
- cite:
    id: cal.1961-01-20.transition-and-staff
    item: '[[w.sorensen-counselor]], 222–23 (revisions of the inaugural: "liberty" restored in the torch; "cooperative ventures" for Galbraith''s "joint ventures"; "oppose aggression" for "prevent aggression ... in the Americas"; "those nations who would make themselves our adversary" for "enemy," a few days earlier at Lippmann''s suggestion; the delivery, the first applause a third of the way through; not the other business of the day)'
    units: A
- cite:
    id: cal.1961-05-25.space
    item: '[[w.sorensen-counselor]], 336–37 (the message on Urgent National Needs, to a joint session: Kennedy, sensing a skeptical audience, departs from his prepared text, the only time Sorensen recalls in a formal address, to add a personal note of urgency; "this decade" inserted by Kennedy himself)'
    units: A
- add:
    entry:
      id: cal.1961-10-06.berlin-and-vienna-2
      when: Oct. 6
      date: '1961-10-06'
      thread: berlin-and-vienna
      c: 'The President asks Sorensen for an outline of points for his talks on Berlin with Gromyko. Sorensen proposes that both sides "strive for agreement, after a ''cooling-off-period'' in which we can both consult with our respective allies and Congresses," and make "no more unilateral acts or threats that make a negotiating climate impossible."'
      n: '[[w.sorensen-counselor]], 322 (Sorensen''s account, written in 2008; the talks "upcoming," Gromyko at the White House the same day; not the hour or whether the outline was used). See [[cal.1961-10-06.berlin-and-vienna]]. Names: Kennedy, Sorensen, Gromyko.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:gromyko-andrei'
- cite:
    id: cal.1962-09-28.mississippi-ole-miss-4
    item: '[[w.sorensen-counselor]], 274–75 (Kennedy telephones Sorensen at Bethesda on Saturday, Sept. 29, to put his thoughts on paper, a television speech appearing likely; that night he dictates to Gloria Sitrin a memorandum, quoted in part: "Stay out of it personally for the time being"; no press conference afterward; "Keep moving, but move slowly"; if troops, 15 to 30 minutes of nationwide television for an address to Mississippians; Sunday the President: "You might as well come back now")'
    units: '?'
- cite:
    id: cal.1962-10-16.missile-crisis
    item: '[[w.sorensen-counselor]], 285–86 (Tuesday morning, Kennedy calls Sorensen into the Oval Office with the U-2 news and the false assurances of Khrushchev and Dobrynin, and asks him to bring copies of his two public warnings on Soviet offensive weapons in Cuba; first meeting of his advisers at 11:45 a.m.; the air strike the first choice of nearly everyone; Sorensen''s account, written in 2008; not Bundy''s breakfast call or the taping)'
    units: '?'
- cite:
    id: cal.1962-10-17.missile-crisis-5
    item: '[[w.sorensen-counselor]], 290 (Wednesday evening, Robert Kennedy and Sorensen meet the President at the airport on his return from Connecticut; in the limousine his first question is "Any leaks yet?"; Sorensen: "Only your talk with Joe Alsop"; they tell him of the middle-level officials'' greater candor when he is absent, and he stays away from many meetings that first week while Sorensen summarizes them for him; not the memorandum)'
    units: A, B
- cite:
    id: cal.1962-10-18.missile-crisis-6
    item: '[[w.sorensen-counselor]], 291–92 (Thursday, the ExComm asks Sorensen to draft a warning note from Kennedy to Khrushchev; the conditions of "practically everyone at the table"; his draft, quoted in part, gives notice that the President has "no choice but to initiate appropriate military action against the island of Cuba" unless the work halts and the weapons are removed; never completed or delivered; Sorensen reports to the ExComm that no draft could meet all its conditions)'
    units: '?'
- cite:
    id: cal.1962-10-19.missile-crisis-5
    item: '[[w.sorensen-counselor]], 292–93 (Friday morning, after the Joint Chiefs, LeMay on "the appeasement at Munich" and Shoup "Youll have to invade," Kennedy meets Sorensen in the hall outside his office, about to leave on a campaign trip, still seething: "You and Bobby have to pull this thing together. Its falling apart"; not the words about "brass hats")'
    units: '?'
- cite:
    id: cal.1962-10-20.missile-crisis-2
    item: '[[w.sorensen-counselor]], 295 (Saturday morning, on his return from Chicago, Kennedy is given Sorensen''s draft blockade speech and a one-page memorandum: "There are two fundamental objections to air strike which have never been answered," the first that "no one has been able to devise a satisfactory message to Khrushchev" and an air strike means a U.S.-initiated "Pearl Harbor"; two fundamental advantages to a blockade; the memorandum quoted in part)'
    units: '?'
- cite:
    id: cal.1962-10-22.missile-crisis-4
    item: '[[w.sorensen-counselor]], 297 (hours before the address, Russell calls for an invasion: "You should assemble as speedily as possible an adequate force and clean out that situation!"; Fulbright for an invasion "and an all-out one, as quickly as possible"; Kennedy: it "would be foolish" to expect the Russians not to regard it as far more offensive than a blockade; not the day''s hour)'
    units: C
- cite:
    id: cal.1962-10-22.missile-crisis-30
    item: '[[w.sorensen-counselor]], 297 (that day Sorensen takes only three calls from politicians: Mills, asking if the situation was severe, Bayh, and Edward Kennedy, "Can I continue giving my standard speech on Cuba?" - "No. Wait for the president''s speech tonight"; he hands Feldman and White copies of the speech and White says, "What a shame—they just finished sanding that building across the street")'
    units: A, D
- cite:
    id: cal.1962-10-27.missile-crisis
    item: '[[w.sorensen-counselor]], 300–01 (Saturday afternoon, Sorensen with Robert Kennedy and Thompson urges the President to answer the first letter and delay the reply to the second for twenty-four to forty-eight hours; the Joint Chiefs remind Kennedy of the understanding to retaliate against a SAM that downs a U-2 and he says, "Let''s wait and see how this exchange of letters plays out," cancelling next day''s low-level flights; of the Alaska U-2 over the Chukotski Peninsula, "There''s always one son-of-a-bitch who doesn''t get the message")'
    units: B, C
- cite:
    id: cal.1962-10-27.missile-crisis-8
    item: '[[w.sorensen-counselor]], 302–03 (after the ExComm dispersed, a smaller meeting in the Oval Office with Robert Kennedy, McNamara, Rusk, Bundy, Thompson, Sorensen "and possibly others" to instruct Robert Kennedy for his meeting with Dobrynin; Rusk''s proposal of a private word on the Turkish missiles; Sorensen learned later that Robert Kennedy varied the letter''s language; not the hour)'
    units: C
- cite:
    id: cal.1962-10-27.missile-crisis-9
    item: '[[w.sorensen-counselor]], 304 (later that Saturday night, after dinner, the full ExComm reconvenes in the Cabinet Room, without the President by Sorensen''s account; the hawks insist the blockade has not worked; Johnson, silent until then: "All I know is that when you were walking along a Texas road and a rattlesnake rose up ready to strike, there was only one thing to do—take a long stick and knock its head off"; Sorensen''s account, written in 2008; not the hour, the taping or the words entered)'
    units: '?'
- cite:
    id: cal.1963-06-10.civil-rights-bill-3
    item: '[[w.sorensen-counselor]], 278 (Robert Kennedy arranged for Robert Drew and his crew to film one of the strategy sessions in the Oval Office; Sorensen stopped short at the lights and camera: "It''s OK, it''s been arranged"; he later saw himself yawn on the film; not the day or the exchange on an address)'
    units: '?'
- cite:
    id: cal.1963-06-11.alabama
    item: '[[w.sorensen-counselor]], 278 (Kennedy and Sorensen watch Wallace''s stand and his stepping aside on the Oval Office television, "that little dance ... peacefully performed as choreographed," after the advance agreement; the Guard federalized and Katzenbach informing him; not the hour)'
    units: A, C
- cite:
    id: cal.1963-06-11.civil-rights-bill
    item: '[[w.sorensen-counselor]], 279–82 (the address televised at 8 p.m. on the networks; its closing paragraphs from Kennedy''s own scribbled notes, Sorensen''s closing dropped; the text "toned down, but its substance remained"; civil rights "a moral issue," "as old as the Scriptures and as clear as the American Constitution"; Sorensen''s account, written in 2008; not "partly extemporized" or the law asked)'
    units: B
- cite:
    id: cal.1963-06-26.berlin-and-vienna
    item: '[[w.sorensen-counselor]], 323–25 (Sorensen on the City Hall steps behind Kennedy; the closing line with "ein" and what it means in German, for which he takes responsibility; Brandt''s memoirs say Sorensen rehearsed the line with him at dinner in Bonn the evening before, which Sorensen doubts; Kennedy''s toast at the City Hall luncheon "to the people of Berlin on both sides of the wall"; his afternoon speech at the Free University; not Adenauer, the platform at the wall or the German words)'
    units: E
- cite:
    id: cal.1963-11-12.elections-1964
    item: '[[w.sorensen-counselor]], 346–48 (Kennedy''s first strategy meeting for 1964: Robert Kennedy, Steve Smith, Bailey, O''Donnell, O''Brien, Maguire, Scammon and Sorensen; Johnson not present; Smith for fund-raising, O''Donnell scheduling, O''Brien and Bailey organization, Sorensen issues, platform, debates and speeches; an independent citizens'' organization; the Florida and Texas trip; Goldwater or Rockefeller; Sorensen "the sole survivor")'
    units: A, C
- cite:
    id: cal.1963-11-24.succession-4
    item: '[[w.sorensen-counselor]], 381 (drafts of the address from Valenti, Murphy, Busby, Stevenson and Galbraith, who left his on Sorensen''s desk, "this one''s perfect so you won''t have to change it"; Sorensen starts fresh Monday evening, Nov. 25, in the White House mess; Johnson had asked him to draft it later that weekend)'
    units: '?'
- cite:
    id: cal.1963-11-25.economy-3
    item: '[[w.sorensen-counselor]], 381–82 (late Monday night Johnson and Sorensen speak by telephone on the legislative agenda; Johnson wants more "date" stuff; "This is a mighty hard life"; Sorensen: "It is going to get harder. I think you ought to think about going away for Thanksgiving"; "I''m afraid to"; Sorensen''s account, written in 2008, quoting the transcript in part)'
    units: '?'
- cite:
    id: cal.1963-11-27.succession
    item: '[[w.sorensen-counselor]], 382–83 (the address to the joint session, Sorensen''s draft changed by Johnson, Fortas and Jenkins; its ending a quotation of "America the Beautiful," Sorensen''s, which Alsop at lunch that day called "corny"; Sorensen''s account, written in 2008; not "let us continue" or the bills)'
    units: '?'
- cite:
    id: cal.1963-12-02.civil-rights-bill-2
    item: '[[w.sorensen-counselor]], 384 (Katharine Graham to Johnson on a recorded call the Monday after the speech: Sorensen did not look well, "He is very hurt," and she does not forgive him for asking her to leave a funeral planning meeting on the day of the assassination; Johnson: "I''ve done as much as I can and have any pride and self-respect left"; not the discharge petition)'
    units: '?'
- cite:
    id: cal.1964-01-15.transition-and-staff
    item: '[[w.sorensen-counselor]], 388–90 (Sorensen hands Johnson his letter of resignation, effective Feb. 29, in the Oval Office on Jan. 14 to write his book; Johnson protests, keeping the Davis Cup team waiting more than an hour in the Cabinet Room; Johnson''s reply the same day, both letters quoted in part)'
    units: B
- cite:
    id: cal.1964-01-27.baker
    item: '[[w.sorensen-counselor]], 386 (Sorensen advises Johnson on Jan. 27 how to respond to the Baker scandal; Johnson that night to his confidants in the Oval Office, as Sorensen later learned: "the smartest man I''ve met in this White house is Sorensen," who thought him a "numbskull" for following the advice to get out in front of the press; not the hour or the others present)'
    units: '?'
- cite:
    id: cal.1966-07.robert-kennedy-3
    item: '[[w.sorensen-counselor]], 452–53 (July 1966, Sorensen''s memorandum to Robert Kennedy on the contingencies of a future presidential bid, under three alliterative headings: "the futility of prophecy is in direct proportion to the multitude of possibilities," "the paucity of potential Presidential contenders presently prominent permits increased perspective," and "Nomination requires a majority, not merely a plurality")'
    units: '?'
- cite:
    id: cal.1967-10-08.robert-kennedy
    item: '[[w.sorensen-counselor]], 453 (Sunday, Oct. 8, afternoon, a strategy discussion on a Kennedy entry in Pierre Salinger''s room at the Regency Hotel, New York; Sorensen takes part; not the others present)'
    units: A
- cite:
    id: cal.1967-12-10.robert-kennedy
    item: '[[w.sorensen-counselor]], 453–54 (at a meeting "nearly two months" after Oct. 8 at Bill vanden Heuvel''s home Sorensen argues that a run would be futile; Ethel Kennedy, in Schlesinger''s journal: "Why, Ted, after all those high-flown phrases you wrote for President Kennedy!"; Ted Kennedy, Steve Smith and Sorensen all opposed a run; not the lunch or the day)'
    units: '?'
- cite:
    id: cal.1968-03-11.robert-kennedy-campaign
    item: '[[w.sorensen-counselor]], 455–56 (Sorensen''s two hours with Johnson in his small private study, "frank and cordial"; Rostow, Goodwin and Stevenson; Johnson will not enter the Massachusetts primary, FDR and Garner, "maybe I won''t run at all"; Sorensen suggests replacing Rusk and a national commission on Vietnam; Johnson asks for a list and says he would make a good member; not the hours)'
    units: '?'
- cite:
    id: cal.1968-03-11.robert-kennedy-campaign-decision
    item: '[[w.sorensen-counselor]], 455 (Sorensen, on his way to the White House, visits Robert Kennedy in his Senate office; Kennedy asks him to relay to Johnson, without naming the source, Mayor Daley''s proposal of an independent commission to evaluate America''s role in the war; not the day''s other business)'
    units: '?'
- cite:
    id: cal.1968-03-14.robert-kennedy
    item: '[[w.sorensen-counselor]], 457–58 (Thursday morning at the Pentagon Kennedy and Sorensen urge Clifford to take up the Vietnam commission; Sorensen reads a list of thirty-nine names; Clifford says Kennedy has no chance; hours later Clifford telephones the Senate office, "emphatically no," Johnson listening, and Kennedy, listening on another line, says he will run)'
    units: B
- cite:
    id: cal.1968-04-03.robert-kennedy
    item: '[[w.sorensen-counselor]], 461–62 (10 a.m., the Cabinet Room, one hour and forty minutes, with Rostow and Murphy; Johnson does 90 percent of the talking; Kennedy: "A lot of it was my fault"; Johnson: "I want to keep the Presidency out of this campaign. I''m not that pure, but I am that scared"; "I do not hate you, I do not dislike you"; Kennedy: "You are a brave and dedicated man, Mr. President"; at the door Johnson to Sorensen: "None of this would have happened if you hadn''t left"; Humphrey the next visitor)'
    units: A, B
- check:
    id: cal.1960-06-29.elections-1960
    text: 'Check: Counselor, 243, puts the memorandum "one week before the 1960 convention," about July 4, not June 29.'
- check:
    id: cal.1960-07-04.robert-kennedy
    text: 'Check: Counselor, 193, has the statement come from the press office as Robert Kennedy''s, "does not now nor has he ever had an ailment described classically as Addison''s Disease, which is a tuberculous destruction of the adrenal gland"; the entry has him say it at a press conference, "ailment classically described as Addison''s disease."'
- check:
    id: cal.1962-09-28.mississippi-ole-miss-4
    text: 'Check: Counselor, 274–75, has the President''s call and the memorandum on Saturday, Sept. 29, dictated that night, and the text in part; the entry has the memorandum Sept. 28 and "not found."'
- check:
    id: cal.1962-10-16.missile-crisis
    text: 'Check: Counselor, 286, has the first meeting at 11:45 a.m.; the entry has 11:50.'
- check:
    id: cal.1962-10-18.missile-crisis-6
    text: 'Check: Counselor, 291–92, has the ExComm, not Kennedy alone, ask for a warning note that gives notice of military action unless the missiles are halted, with an offer to meet; the entry has a letter offering negotiations.'
- check:
    id: cal.1962-10-19.missile-crisis-5
    text: 'Check: Counselor, 293, has Kennedy say, "You and Bobby have to pull this thing together. It''s falling apart"; the entry has "This thing is falling apart. You have to pull it together."'
- check:
    id: cal.1962-10-22.missile-crisis-30
    text: 'Check: Counselor, 297, has three callers, Mills asking if the situation was severe, Bayh and Edward Kennedy, who asked "Can I continue giving my standard speech on Cuba?"; the entry has one Congressman ("Is it serious?" "Yes") and Kennedy''s "Should I give my campaign dinner speech on Cuba?"'
- check:
    id: cal.1964-01-15.transition-and-staff
    text: 'Check: Counselor, 388–90, has the letter handed to Johnson, and his reply, on Jan. 14; the entry has Jan. 15.'
- add:
    entry:
      id: cal.1960-04.elections-1960-religion-2
      when: Apr.
      date: '1960-04'
      thread: elections-1960-religion
      c: 'During the West Virginia primary, at Kennedy''s asking, Sorensen asks the Senate chaplain, the Reverend Mr. Harris, for a public statement deploring religious bigotry and prejudice in presidential politics. Harris, who had assured Kennedy he would speak out at the appropriate time, declines, mindful, Sorensen supposes, that he served Nixon, Johnson, Humphrey and Symington too.'
      n: '[[w.sorensen-counselor]], 160–61 (Sorensen''s account, written in 2008; Kennedy had asked him to explore it; Sorensen then turned to Sayre, Arthur L. Miller, Bishop Oxnam, Blake and Dahlberg, not entered). See [[cal.1960-05-03.elections-1960-2]]. Names: Sorensen, Kennedy, Nixon, Johnson, Humphrey, Symington. Check: the day and the month.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:nixon-richard-m'
      - 'name:johnson-lyndon-b'
      - 'name:humphrey-hubert-h'
      - 'name:symington-william-s'
- add:
    entry:
      id: cal.1960-09.elections-1960-religion-2
      when: Sept., before Houston
      date: '1960-09'
      thread: elections-1960-religion
      c: 'Late at night, as Sorensen works on the Houston speech, Feldman telephones with the answer to his question whether any Catholics died at the Alamo: no way to confirm that the fallen with Irish and Hispanic-sounding names were Catholics, because there was no religious test. Sorensen: "That''s it! That''s the line I want!"'
      n: '[[w.sorensen-counselor]], 163 (Sorensen''s account, written in 2008; the line as it appeared: "At the Alamo, side by side with Bowie and Crockett died Fuentes and McCafferty and Bailey, Badillo and Carey—but no one knows whether they were Catholic or not. For there was no religious test there."). See [[cal.1960-09-12.elections-1960]]. Names: Sorensen, Feldman. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:feldman-myer'
- cite:
    id: cal.1960-04-21.elections-1960
    item: '[[w.sorensen-counselor]], 162 (Sorensen "had a hand in the speech," Kennedy''s first full-length treatment of the issue, quoted in part: "I want no votes solely on account of my religion"; "There is only one legitimate question ... Would you, as President of the United States, be responsive in any way to ecclesiastical pressures or obligations"; not the words of the entry)'
    units: '?'
- cite:
    id: cal.1960-05-03.elections-1960-2
    item: '[[w.sorensen-counselor]], 160–62 (Sorensen''s own work to obtain the statement from Protestant leaders: Sayre, Arthur L. Miller, a confidential meeting at the Oyster Bar of Grand Central with Bishop Oxnam, Blake, Dahlberg; the letter to "fellow pastors in Christ" published May 3, 1960; he had "little or no hand" in its wording; not the signers or the text)'
    units: '?'
- cite:
    id: cal.1960-09-12.elections-1960
    item: '[[w.sorensen-counselor]], 162–63 (the Houston speech "JFK at his best," Sorensen drafting it; the passage on "what kind of America I believe in" quoted in part; the Alamo line that Feldman supplied; not the questions or the date)'
    units: A
- cite:
    id: cal.1962-06-27.court
    item: '[[w.sorensen-counselor]], 166 (Kennedy''s reply on the school prayer decision, "superb," not scripted or suggested in advance by Sorensen: "We have in this case a very easy remedy ... We can pray a good deal more at home"; Sorensen had visited Justice Douglas that spring at the President''s request, a visit he later cut from his book at Robert Kennedy''s request)'
    units: A
- add:
    entry:
      id: cal.1964-12.transition-and-staff-2
      when: Dec.
      date: '1964-12'
      thread: transition-and-staff
      c: 'Johnson, through intermediaries, asks whether Sorensen will draft his inaugural address of Jan. 20, saying Sorensen had "promised" to when he agreed to his resignation. Sorensen declines, by letter to Moyers: "it would be a mistake for anyone so far removed from the Washington scene to attempt a draft of the Inaugural Address."'
      n: '[[w.sorensen-counselor]], 401 (Sorensen''s account, written in 2008; the letter quoted in part; he gives "December 1964"). Names: Johnson, Sorensen, Moyers. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:johnson-lyndon-b'
      - 'name:moyers-bill'
- add:
    entry:
      id: cal.1964-12.transition-and-staff-3
      when: Dec.
      date: '1964-12'
      thread: transition-and-staff
      c: 'Sorensen, having declined to draft the inaugural, relents and provides a one-page memorandum for Johnson''s address, "Thoughts on 1964 Inaugural": "Rebuke those who teach hate and violence ... the fanatics, foreign and domestic ... the bigots, foreign and domestic ..."'
      n: '[[w.sorensen-counselor]], 401 (Sorensen''s account, written in 2008, "Then I relented"; he is "uncertain whether LBJ and his team accepted any of my advice"; the title as the page prints it; to whom sent, not stated). See [[cal.1964-12.transition-and-staff-2]]. Names: Sorensen, Johnson. Check: the day and the month.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1965-07.transition-and-staff-3
      when: July
      date: '1965-07'
      thread: transition-and-staff
      c: Bundy recommends Sorensen to Johnson as the successor to Adlai Stevenson, dead in London, as Ambassador to the United Nations. Sorensen is briefly considered.
      n: '[[w.sorensen-counselor]], 414 (Sorensen''s account, written in 2008: "in the summer of 1965"; Johnson persuades Goldberg instead, by rumor; not the day). See [[cal.1965-07-14.transition-and-staff]]. Names: Bundy, Sorensen, Johnson, Stevenson, Goldberg. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:johnson-lyndon-b'
      - 'name:bundy-mcgeorge'
      - 'name:stevenson-adlai-e'
      - 'name:goldberg-arthur-j'
- cite:
    id: cal.1960-07-04.elections-1960
    item: '[[w.sorensen-counselor]], 134 (the closing, a quotation of Lincoln suggested by the historian James MacGregor Burns, "on the eve of the 1960 Democratic National Convention," for the speech in answer to Truman; no other historian could find that Lincoln had said the words; Sorensen''s account, written in 2008; not the words quoted)'
    units: '?'
- add:
    entry:
      id: cal.1961-11-24.vietnam-2
      when: Nov. 24
      date: '1961-11-24'
      thread: vietnam
      c: 'Sorensen to the President, by memorandum: a televised address on policy in Vietnam and Laos, to dispel "wildly inaccurate speculation and debate ... on what we are going to do in SE Asia." "Only the Vietnamese can defeat the Viet Cong, we cannot do it for them. Troops of a different country, color and culture are not ... effective in combating civil disorders, guerrilla actions and most local wars."'
      n: '[[w.sorensen-counselor]], 355 (Sorensen''s account, written in 2008; the memorandum quoted in part, with the President''s Seattle words of a few weeks before; "I was not in the loop on Vietnam"). To check: the memorandum, Nov. 24, 1961. See [[cal.1961-11-24.vietnam]]. Names: Sorensen, Kennedy.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1961-11.vietnam-4
      when: Nov.
      date: '1961-11'
      thread: vietnam
      c: 'Sorensen to the President, by memorandum, cautions against a significant military escalation in Vietnam, with questions: whether American troops will be welcomed or resented; whether Khrushchev will regard it as "more stupid than bold" and "feel we are sufficiently weakened and diverted to permit him further moves"; whether they can do much more than Vietnamese troops "that already outnumber Communists 10-1"; whether "all other courses have been explored or exhausted."'
      n: '[[w.sorensen-counselor]], 355–56 (Sorensen''s account, written in 2008: "still another November 1961 memorandum"; the questions quoted in part; Sorensen "sensed those memos met with his approval"). See [[cal.1961-11-24.vietnam]]. Names: Sorensen, Kennedy, Khrushchev. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
- cite:
    id: cal.1961-04-28.vietnam
    item: '[[w.sorensen-counselor]], 355 (Sorensen''s memorandum to the President of Apr. 28, 1961, skeptical of the latest plan: "The outcome is highly doubtful" as it depends on Communist reactions, "speculative at best" as it depends on popular support and reforms by Diem; no timetable, no clear division of authority, no realistic estimate of costs; "There is no clearer example of a country that cannot be saved unless it saves itself"; Sorensen''s account, written in 2008; not Bundy and Bell)'
    units: B
- cite:
    id: cal.1960-05-07.elections-1960-primaries
    item: '[[w.sorensen-counselor]], 179 (Sorensen''s account, written in 2008: "On my birthday in May 1960," the senator sent him to see Governor Williams in Michigan and persuade the Michigan delegation to support Kennedy for president; Sorensen''s birthday is May 8, which the page does not say; not the quotation, "we don''t know what''s going to happen," or the other Michigan politicians)'
    units: '?'
- add:
    entry:
      id: cal.1961-04.cuba-bay-of-pigs-13
      when: Apr., after the failure
      date: '1961-04'
      thread: cuba-bay-of-pigs
      c: 'Sorensen holds a background session for the press, putting the failure in context: Kennedy had fired the weapon, but it had been built and loaded by his predecessor, Eisenhower. Kennedy publicly rejects the line.'
      n: '[[w.sorensen-counselor]], 317 (Sorensen''s account, written in 2008: "After it was over"; Kennedy''s answer at his press conference of Apr. 21, "I am the responsible officer of the government, and that is quite obvious," not entered here; not the day or the reporters). Names: Sorensen, Kennedy, Eisenhower. Check: the day.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
      - 'name:eisenhower-dwight-d'
- add:
    entry:
      id: cal.1963-11-27.succession-3
      when: Nov. 27
      date: '1963-11-27'
      thread: succession
      c: 'The limousine to the Capitol for the address. Johnson insists that O''Brien, Salinger and Sorensen ride with him; to O''Brien and Salinger: "This is a fine speech, 90 percent Sorensen, only 10 percent Johnson." Sorensen: "not more than 50 percent Sorensen." Johnson: "your 50 percent is the best." Sorensen: "On that point, Mr. President, we agree."'
      n: '[[w.sorensen-counselor]], 382–83 (Sorensen''s account, written in 2008; Sorensen had been grumbling about the changes; not the hour). See [[cal.1963-11-27.succession]]. Names: Johnson, O''Brien, Salinger, Sorensen.'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:johnson-lyndon-b'
      - 'name:obrien-lawrence-f'
      - 'name:salinger-pierre'
- cite:
    id: cal.1961-02.civil-rights-the-executive-2
    item: '[[w.sorensen-counselor]], 273 (Sorensen''s account, written in 2008: Whitney Young and other civil rights leaders, told by the President to "Write him a memo," bring a long memorandum urging "one monumental Executive Order to cover everything, a second Emancipation Proclamation," and meet Sorensen at the White House in February, after first meeting the President; by Wilkins''s later recollection Sorensen "promised to consider it," fearing for Robert Weaver''s nomination; not the sixty-one pages, King''s memorandum or the centennial)'
    units: '?'
- cite:
    id: cal.1961-04-20.cuba-bay-of-pigs-2
    item: '[[w.sorensen-counselor]], 316–17 (Sorensen''s account, written in 2008: their first real talk of the operation, after its failure, walking the White House driveway behind the West Wing; Kennedy "anguished and fatigued": "How could I have been so far off base? All my life I have known better than to depend on the experts. How could I have been so stupid, to let them go ahead?"; "the worst week of his public life"; not the day, the South Lawn, the speech or the Republican leaders)'
    units: '?'
- cite:
    id: cal.1961-04-12.school-aid
    item: '[[w.sorensen-counselor]], 164–65 (Sorensen''s account, written in 2008: his secret meetings with Bishop Hannan at the Washington Chancery at the President''s direction, one on a proposed amendment to the pending school bill; his confidential memorandum of Apr. 12, 1961, quoted in part; at day''s end, orally, that he and the bishop had "gotten along splendidly"; not Ribicoff, the monsignors, the NDEA or the amendment''s terms)'
    units: '?'
- check:
    id: cal.1961-04-12.school-aid
    text: 'Check: Counselor, 165, quotes the memorandum "... taken any position on this amendment or strategy"; the entry has "on this amendment or course of strategy."'
- cite:
    id: cal.1968-03-31.robert-kennedy
    item: '[[w.sorensen-counselor]], 461 (Sorensen''s account, written in 2008: that night at Robert Kennedy''s New York apartment, with other friends and advisers, he watches Johnson''s address; astonished at the withdrawal, he urges a friendly farewell meeting with Johnson, seeking at the least his neutrality; Kennedy asks him to arrange it and attend; not La Guardia, the calls or the telegram)'
    units: '?'
- cite:
    id: cal.1968-04-05.robert-kennedy
    item: '[[w.sorensen-counselor]], 463–64 (Sorensen''s notes, read to Kennedy by telephone the night before, "a portion of his moving address the next day," inserted by his staff into their draft that night: "What has violence ever accomplished?"; "violence breeds violence, repression brings retaliation, and only a cleansing of our whole society can remove this sickness from our soul"; Sorensen''s account, written in 2008; not the City Club or the words as delivered)'
    units: '?'
- cite:
    id: cal.1963-06-26.europe-and-the-alliance-kennedy-in
    item: '[[w.sorensen-counselor]], 325 (at day''s end Kennedy, weary, climbs into Air Force One and sinks into a chair opposite Sorensen: "We will never have another day like this one"; Sorensen''s account, written in 2008; not the flight to Ireland or the note for his successor)'
    units: '?'
- check:
    id: cal.1963-06-26.europe-and-the-alliance-kennedy-in
    text: 'Check: Counselor, 325, has "We will never have another day like this one"; the entry has "We''ll never have another day like this one as long as we live."'
- check:
    id: cal.1960-12.transition-and-staff-4
    text: 'Check: Counselor, 200, has "Keep your head down"; "Everyone who''s held a job like yours—Sherman Adams, Harry Hopkins, Colonel House, all the rest—ended up in the shithouse"; "The best way for you to stay out of trouble is to stay out of sight." The entry has "Turn them all down"; "Every man that''s ever held a job like yours ... has ended up in the ---"; "The best way to stay out of trouble is to stay out of sight."'
- check:
    id: cal.1962-10-27.missile-crisis-8
    text: 'Check: Counselor, 303–04, has the Turkish missile understanding "first made public ten years later, in a Time magazine article cosigned by the surviving participants" of the Oval Office meeting; the entry has it made public by Bundy, 1988.'
