- check:
    id: cal.1966-04-30.china-leadership-7
    text: 'Check: the day; Zhou was in Peking on Apr. 30, at the afternoon rally ([[cal.1966-04-30.china-leadership-3]]), and the Zhou chronology has him go to Shanghai Apr. 25 and fly back to Peking the next day (III, 28; [[cal.1966-04-25.china-leadership]]).'
