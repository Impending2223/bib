    base: 07e30d3b
    set:
      time: 1966-04-05T02:03Z
      time_zone: America/New_York
      n: 'FRUS 1964–68, IV, docs. [110](https://history.state.gov/historicaldocuments/frus1964-68v04/d110), [112](https://history.state.gov/historicaldocuments/frus1964-68v04/d112). Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 279–81. Telegram 2965 to Lodge and Westmoreland, "the first one" Johnson approved at the meeting, transmitted at 9:03 p.m. (doc. 112 and its note 2). After [[cal.1966-04-04.vietnam-struggle-3|the meeting]]. See [[cal.1966-03-10.vietnam]].'
