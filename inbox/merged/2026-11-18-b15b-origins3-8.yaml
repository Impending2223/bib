- add:
    entry:
      id: cal.1964-12-26.china-leadership-2
      when: Dec. 26
      date: '1964-12-26'
      thread: china-leadership
      c: 'Peking, the Great Hall of the People. Mao''s seventy-first birthday: a banquet for central and regional leaders, some ministers, scientists, labor models. At Mao''s table the scientists and labor models, Chen Yonggui of Dazhai among them; the Standing Committee at another. Mao: the movement''s formulations not Marxist; "independent kingdoms" at the center; the Party may yet produce revisionism.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 423–24. The book reads the formulations as Liu''s and the kingdoms as Deng''s Secretariat and Li Fuchun''s Planning Commission (III, 423). Made public: 1993. To check: [[w.zhisui-private-life-of-chairman]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 423 n.130a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1131 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 423 n.131a); [[w.yao-san-ci-danan-buside]], 235–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 423 n.131b); [[w.qitai-dazhai-hongqide-shengqi-yu]], 35–69 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 424 n.133a). Names: Mao Zedong. Check: the guests at Mao''s table; Huang Yao adds Peng Zhen, Luo Ruiqing, Yu Qiuli and Zeng Zhi (III, 423 n.131).'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: b06cada2
        rows:
        - 'w.macfarquhar-origins-of-the-cultural III, 423–24: all'
        - 'via w.macfarquhar-origins-of-the-cultural III, 423 n.130a: all'
