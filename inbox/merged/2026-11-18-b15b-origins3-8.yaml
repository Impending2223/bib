      when: Dec. 30
      date: '1964-12-30'
      thread: china-leadership
      c: 'A "small-scale conference." Mao brings Chen Boda''s changes to the seventeen articles, on the power holders: some in front of the curtain, some behind it; of those behind, some at lower levels, some at higher. To be issued if Liu Shaoqi and the Secretariat accept them.'
