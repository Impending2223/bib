      date: '1964-12-12'
      thread: china-leadership
      c: 'Mao''s written comment on a report of Chen Zhengren, his former secretary, on the five antis: a bureaucratic class forming, capitalist elements "drinking the blood of the workers." The comment as printed for distribution speaks of "leaders taking the capitalist road", a gloss of Bo Yibo''s.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 418, 421. Made public: 1987 ([[w.chenghua-zhonghua-renmin-gongheguo-zhengzhi]]). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 11 (1996). To check: Mao Zedong, comment of Dec. 12, 1964, on Chen Zhengren''s report, in [[w.zedong-jianguo-yilai-mao-zedong]], 11, 265–74 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 418 n.104b); [[w.mao-zedong-jingji-nianpu]], 615–16 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 418 n.104e); Mao Zedong, comment of Dec. 12, 1964, on Chen Zhengren''s report, in [[w.zedong-jianguo-yilai-mao-zedong]], 11, 267 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 421 n.116a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1128–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 421 n.116b); [[w.chenghua-zhonghua-renmin-gongheguo-zhengzhi]], 282 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 421 n.117a); [[w.zedong-jianguo-yilai-mao-zedong]], 11, 268 n.8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 421 n.117b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1128–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 421 n.117c). Names: Mao Zedong, Bo Yibo. Check: whether Bo added the gloss after consulting Mao; the Wengao''s note has the phrase as Bo''s, Bo''s own account does not mention it (III, 421 n.117). Check: Made public; whether [[w.chenghua-zhonghua-renmin-gongheguo-zhengzhi]] (1987), cited for the phrase alone (III, 421 n.117), or [[w.mao-zedong-jingji-nianpu]] (1993), cited with three other documents (III, 418 n.104), prints the comment.'
