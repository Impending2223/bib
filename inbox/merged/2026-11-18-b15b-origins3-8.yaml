patch: 2026-11-18-b15b-origins3-8
by: 'Claude (batch 15, second wave, MacFarquhar, The Origins of the Cultural Revolution, vol. 3, run 8: pp. 416–430, chapter 18 to its end, with notes 86–164), Nov. 18, 2026'
ops:
- edit:
    id: cal.1964-11-26.china-leadership
    base: 1123ffa7
    set:
      c: 'Mao, with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen: hears Li Fuchun and Bo Yibo on their survey of the Panzhihua third-front area. Steel by 1975? "Eleven years; faster, Zhou says; faster still"; the imperialists have not fought for twenty years, they will; the H-bomb and missiles faster too, three years too slow. Of six sites for Panzhihua''s steel base: drop Yibin, no coal, no railway. Deng: plan the railway net early. Mao: no dawdling; mines first; one center, no many heads; new techniques; the Soviet frame, to be analyzed. Mao to Liu: Liu still in command, the four clean-ups, the five antis and the economy his to run; something unexpected could happen at any time, so change over now: "You be Chairman; you be Qin Shi Huang"; Liu to tell people off and to take charge of Deng and the Premier. Liu: he can run the four clean-ups; Peng Zhen and Xie Fuzhi, Minister of Public Security, run the five antis, Deng and Zhou the economy. Mao: they are busy; without Liu no unity.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 26, 1964. [[w.macfarquhar-origins-of-the-cultural]], III, 417–18 (Mao''s exchange with Liu at the meeting on the third front). Made public: 1989. To check: [[w.jin-1949-1989-niande-zhongguo]], 602 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 417 n.97a); [[w.mao-zedong-jingji-nianpu]], 615 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 417 n.97b); [[w.jin-1949-1989-niande-zhongguo]], 602 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 418 n.103). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Fuchun, Bo Yibo, Xie Fuzhi.'
