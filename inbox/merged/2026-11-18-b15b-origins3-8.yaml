- add:
    entry:
      id: cal.1965-01.china-leadership-7
      when: Jan.
      date: 1965-01
      thread: china-leadership
      c: 'Liu Shaoqi, urged by Peng Zhen and Tao Zhu, self-criticizes and apologizes for interrupting Mao, by Ye Yonglie''s account. Mao: not a matter of respect but of principle, revisionism against anti-revisionism.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 425–26. Wang Li credits Chen Boda''s work behind the scenes (III, 425 n.140) and says it put off Mao''s attack on Liu (III, 426 n.145). Made public: 1990. To check: [[w.yonglie-chen-boda-qiren]], 214, 212 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 425 n.140a); [[w.li-xianchang-lishi]], 147 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 425 n.140b); [[w.li-wang-li-tan-mao]], 80–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 425 n.140c); [[w.li-insiders-account-of-the]], 16 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 426 n.145a). Names: Liu Shaoqi, Peng Zhen, Tao Zhu, Mao Zedong. Check: the day; the book says only that Liu "may have" self-criticized, after the Dec. 31 directive (III, 426), and Ye puts Mao''s démarches in the January sessions under Deng Xiaoping (III, 425 n.140).'
