      thread: civil-rights-bill
      c: '11:30 a.m. Johnson keeps Kennedys promise of Oct. 28 to Rodino: Rodino, his wife and Peter Jr. in the Cabinet Room,
        then the Oval Office for pictures. Johnson sends the parents out, "this is Peter juniors meeting," and hears the boy
        on his "little people to little people" peace campaign.'
