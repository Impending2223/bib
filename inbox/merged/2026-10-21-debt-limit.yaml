patch: debt-limit
by: Claude (fiscal agent)
ops:
- add:
    entry:
      id: cal.1960-06-08.economy-debt-limit
      when: June 8
      date: '1960-06-08'
      thread: economy-debt-limit
      c: 'House passes the Public Debt and Tax Rate Extension Act, H.R. 12381: the debt limit $8 billion over the permanent $285 billion for fiscal 1961; the corporate rate and the excises extended a year. Closed rule, [204–181](https://voteview.com/rollcall/RH0860143); passed, [223–174](https://voteview.com/rollcall/RH0860144).'
      n: '[106 Cong. Rec., House, June 8, 1960](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt9/pdf/GPO-CRECB-1960-pt9-9-2.pdf). The thirteen acts, 1960–69: [OMB, *Historical Tables*, Table 7.3](https://www.govinfo.gov/content/pkg/BUDGET-2025-TAB/xls/BUDGET-2025-TAB-8-3.xlsx). [[w.morgan-eisenhower-versus-the-spenders]]; [[w.stein-fiscal-revolution-in-america]]; [[w.morgan-deficit-government]]; [[w.zelizer-taxing-america]].'
      tags:
      - debt-limits
- add:
    entry:
      id: cal.1960-06-20.economy-debt-limit
