      id: cal.1963-02-13.elections-1964
      when: Feb. 13
      date: '1963-02-13'
      thread: elections-1964
      c: 'A small dinner at the White House, by Theodore White''s notes. Kennedy: "Rockefeller gets away with murder, what''s
        he doing for Negroes in New York?" White plans another book on 1964. Both take Rockefeller to be the nominee. Kennedy:
        "He''ll get to hate me. That''s inevitable."'
      n: '[[w.reeves-president-kennedy]], 465. To check: Theodore White, "Notes on Social Gathering with the President," Feb.
        13, 1963, Schlesinger Papers, box W-6, Kennedy Library (cited by [[w.reeves-president-kennedy]], 465). See [[cal.1963-02-12.republican-party]].
