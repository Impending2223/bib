      date: '1963-02-12'
      thread: republican-party
      also:
      - civil-rights-the-executive
      - elections-1964
      c: 'Rockefeller, the Republicans'' Lincoln Day: "The fact is that the President, on recommendation of his brother the
        Attorney General, named at least four Federal judges in the South who were known at the time of their appointment
        for their segregationist views. This is a strange way to expedite civil rights action."'
      n: '[[w.reeves-president-kennedy]], 465. To check: *Washington Post*, Feb. 13, 1963 (cited by [[w.reeves-president-kennedy]],
