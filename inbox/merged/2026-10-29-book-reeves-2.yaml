      thread: press-and-broadcasting
      also:
      - berlin-and-vienna
      - vietnam
      c: 'Vienna, the embassy, ten minutes after Khrushchev, the blinds drawn. Kennedy to Reston of the *Times*: "Worst thing
        in my life. He savaged me." "He thinks because of the Bay of Pigs that I''m inexperienced." Then: "I''ll have to increase
        the defense budget. And we have to confront them. The only place we can do that is in Vietnam. We have to send more
        people there." By Reston''s account.'
      n: '[[w.reeves-president-kennedy]], 172–73. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Reston, Khrushchev, Kennedy.'
