- add:
    entry:
      id: cal.1962-10-29.missile-crisis
      when: Oct. 29
      date: '1962-10-29'
      thread: missile-crisis
      c: 'Kennedy, twice that day, to Schlesinger, for the record, by Schlesinger''s notes: the Soviets moved to bring Russia
        and China together, to recast the setting for Berlin after the election, and to deal the United States a political
        blow. The policy worked for three reasons: overwhelming local conventional superiority; no vital Soviet interest at
        stake in Cuba; no case the Soviets could sustain before the world. "Not just because we were tough."'
      n: '[[w.reeves-president-kennedy]], 427–28. To check: Proceedings of the Hawk''s Cay Conference on the Cuban Missile
        Crisis, Mar. 5–8, 1987, 11–12, 15, Center for Science and International Affairs, Harvard (cited by [[w.reeves-president-kennedy]],
        427). Made public: the Hawk''s Cay Conference, Mar. 5–8, 1987, by Reeves''s note (427). Names: Schlesinger, Kennedy.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      src:
        c: b97b5e34
        rows:
        - 'w.reeves-president-kennedy 427–28: all'
        - 'via w.reeves-president-kennedy 427 n.he-told-me-he-thought-it: all'
