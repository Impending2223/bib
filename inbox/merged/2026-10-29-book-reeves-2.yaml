      date: '1963-01-24'
      thread: trade
      also:
      - europe-and-the-alliance-jupiters
      - testing
      c: 'News conference. Most-favored-nation treatment for Yugoslavia and Poland: legislation denying the chance "to exploit
        or to develop whatever differences in attitude or in tempo which may take place behind the Iron Curtain seems to me
        to be unwise." The Jupiters'' removal from Turkey and Italy, modernization; Polaris to cover their targets. The White
        House releases parts of three letters with Khrushchev on a test ban: Dec. 19, Dec. 28 and Jan. 7.'
      n: 'The President''s News Conference of January 24, 1963, [1963 Pub. Papers 92](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=150).
        [[w.reeves-president-kennedy]], 455. See [[cal.1962-12-19.testing]]. Names: Khrushchev, Kennedy.'
