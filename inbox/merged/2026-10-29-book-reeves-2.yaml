- edit:
    id: cal.1961-05-05.cuba
    base: 399f47ea
    set:
      c: '483d NSC meeting, on Cuba. No Navy blockade; an Air Force plan of heavy bombardment, which the other services opposed,
        rejected. Overflights every two or three days. The exiles to be refugees (Robert Kennedy). The Trading with the Enemy
        Act to be invoked at an overt act, $30 million in food and drugs exempted. By Schlesinger''s journal, McNamara: Defense
        against enlisting a Cuban Freedom Brigade in the Army. South Vietnam: no American troops before the conference on
        Laos opens, the MAAG''s increase left to Gilpatric and State. The Council, on British Guiana, breaks off for Shepard''s
        launch, watched on Evelyn Lincoln''s television. On the Dominican Republic: "The United States should not initiate
        the overthrow of Trujillo before knowing what kind of government would succeed him."'
      n: '[FRUS 1961–63, I, doc. 46](https://history.state.gov/historicaldocuments/frus1961-63v01/d46) (Burke''s debrief;
        South Vietnam). [FRUS 1961–63, X, doc. 204](https://history.state.gov/historicaldocuments/frus1961-63v10/d204) (Burris''s
        notes). [[w.schlesinger-robert-kennedy-and-his]], 472–73 (the Freedom Brigade). [[w.reeves-president-kennedy]], 117–18,
        125, 141 (British Guiana and Shepard, 117–18; Trujillo, 141). To check: Schlesinger, journal, May 4–5, 1961 (cited
        by [[w.schlesinger-robert-kennedy-and-his]], 473 n.17); *Time*, May 12, 1961 (cited by [[w.reeves-president-kennedy]],
        118); Record of Actions of the National Security Council, May 5, 1961, Cuba papers, National Security Archive (cited
        by [[w.reeves-president-kennedy]], 125). See [[cal.1961-04-15.cuba]]. Names: Robert Kennedy, Schlesinger, McNamara,
        Gilpatric, Lincoln, Trujillo. Check: Reeves has five hundred more troops ordered to South Vietnam that day (125);
        by FRUS''s note, Rusk decided the same day on up to 100 more for the MAAG.'
      src:
        c: 4205d560
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d204: A-F'
        - 'w.schlesinger-robert-kennedy-and-his 472–73: A, G'
        - 'via w.schlesinger-robert-kennedy-and-his 473 n.17: G'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d46: H'
        - 'w.reeves-president-kennedy 117–18, 125, 141: I-J'
        - 'via w.reeves-president-kennedy 118 n.two-minutes-to-launch: I'
        - 'via w.reeves-president-kennedy 125 n.he-ordered-five-hundred-more-american: H'
      also:
      - robert-kennedy
      - vietnam
      - latin-america
      tags:
