      id: cal.1963-01.democratic-party
      when: Jan.
      date: 1963-01
      thread: democratic-party
      also:
      - elections-1964
      c: 'A day with the Democratic National Committee and its gala, $250 a head. To the committee: no Democratic candidate
        since 1876 but Roosevelt has had half the vote; if two more States, Michigan and Pennsylvania, go Republican in 1964,
        the Republicans are back. At the gala, Sorensen''s jokes: "Vaughn Meader was busy tonight, so I came myself."'
      n: '[[w.reeves-president-kennedy]], 461. To check: Sorensen, briefing papers for Kennedy, Jan. 17, 1963, Sorensen Papers,
        box 36, Kennedy Library (cited by [[w.reeves-president-kennedy]], 461). Check: the day; Reeves has it toward the end
        of January. Names: Sorensen, Kennedy.'
