      date: '1961-06-29'
      thread: berlin-and-vienna
      also:
      - congress
      c: 'The NSC on Berlin, Fulbright and Mansfield among the senators let read Acheson''s thirty-three pages: "Khrushchev
        now going further than the USSR had ventured since 1948." Acheson: Khrushchev "a false trustee and a war monger."
        Kennedy doubts pressing for unification; Rusk: self-determination the better ground; a plebiscite in Berlin to be
        planned with the Germans. Burke against the scale of Acheson''s probe.'
      n: '[FRUS 1961–63, XIV, doc. 52](https://history.state.gov/historicaldocuments/frus1961-63v14/d52) (the meeting). [[w.reeves-president-kennedy]],
        183–84, 189. To check: Acheson, report to Kennedy, "Berlin," June 28, 1961, Department of State, FOIA case 9100042
        (cited by [[w.reeves-president-kennedy]], 183). Check: the senators present (Reeves; FRUS''s record names none). See
        [[cal.1961-06-28.cuba]]. Names: Fulbright, Mansfield, Acheson, Khrushchev, Rusk, Burke, Kennedy.'
      tags:
