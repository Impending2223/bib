      date: '1962-10-25'
      thread: republican-party-congress
      also:
      - missile-crisis
      c: 'Van Zandt (R-Pa.), leaving a State Department briefing, makes public what the Navy has done, or not done, at the
        quarantine line, which Kennedy wanted kept secret; on radio and television within the hour. Kennedy, angry, has Hughes,
        the deputy director of intelligence who gave the briefing, paged at Idlewild: "What the hell is going on?"'
      n: '[[w.reeves-president-kennedy]], 404. To check: *New York Times*, Oct. 26, 1962 (cited by [[w.reeves-president-kennedy]],
        404). Check: the day. Names: Van Zandt, Hughes, Kennedy.'
