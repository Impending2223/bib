- add:
    entry:
      id: cal.1961-03-01.vietnam
      when: Mar. 1
      date: '1961-03-01'
      thread: vietnam
      c: 'State to Saigon, telegram 1115: "White House ranks defense Viet-Nam among highest priorities US foreign policy."
        The Counterinsurgency Plan approved; the President asks what can be done at once, without awaiting the GVN''s approval:
        officers best qualified in counterguerrilla training to the MAAG; British and Malayan officers sought.'
      n: '[FRUS 1961–63, I, doc. 16](https://history.state.gov/historicaldocuments/frus1961-63v01/d16). [[w.reeves-president-kennedy]],
        69. See [[cal.1961-01-28.vietnam]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: b2214b13
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d16: all'
        - 'w.reeves-president-kennedy 69: all'
        - 'via w.reeves-president-kennedy 69 n.white-house-ranks-defense-viet-nam: all'
- add:
    entry:
      id: cal.1961-03-28.berlin-and-vienna
      when: Mar. 28
      date: '1961-03-28'
      thread: berlin-and-vienna
      also:
      - cuba
      c: 'Kennedy and Acheson on a bench in the Rose Garden. On the landing, Acheson: Castro might put twenty-five thousand
        men at the beachhead the first day; "it doesn''t take Price-Waterhouse to figure out that fifteen hundred Cubans aren''t
        as good as twenty-five thousand." On the draft of his Berlin paper: "It seems more likely than not that the USSR will
        move toward a crisis on Berlin this year."'
      n: '[[w.reeves-president-kennedy]], 76–78. To check: Dean Acheson, oral history, 2, 13, Kennedy Library (cited by [[w.reeves-president-kennedy]],
        76); Acheson to Kennedy, Apr. 3, 1961, Nuclear History papers, National Security Archive; Bundy to Kennedy, cover
        memorandum, Apr. 4, 1961, National Security Files, box 81, Kennedy Library (cited by [[w.reeves-president-kennedy]],
        77). Check: the day; Reeves has it the day of the defense message ([[cal.1961-03-28.defense]]); the paper is dated
        Apr. 3. Names: Acheson, Castro, Kennedy.'
      tags:
      - name:acheson-dean-g
      - name:castro-fidel
      - name:kennedy-john-f
      src:
        c: 18e356a1
        rows:
        - 'w.reeves-president-kennedy 76–78: all'
        - 'via w.reeves-president-kennedy 76 n.do-you-know-anything: A'
        - 'via w.reeves-president-kennedy 77 n.it-seems-more-likelv-than-not.a: B'
        - 'via w.reeves-president-kennedy 77 n.it-seems-more-likelv-than-not.b: B'
- add:
    entry:
      id: cal.1961-04-01.cuba
      when: Apr. 1
      date: '1961-04-01'
      thread: cuba
      also:
      - press-and-broadcasting
      c: 'Schlesinger to Kennedy, by memorandum, on his lunch with Handleman of *U.S. News & World Report*, who recited the
        details of the CIA''s plan: "Obviously if an enterprising magazine writer could pick this all up in Miami in a couple
        of weeks, Havana must be well-posted on developments."'
      n: '[[w.reeves-president-kennedy]], 83. To check: [[w.schlesinger-thousand-days-1965]], 260–61 (cited by [[w.reeves-president-kennedy]],
        83); Schlesinger to Kennedy, Apr. 1, 1961, President''s Office Files, box 65, Kennedy Library (cited by [[w.reeves-president-kennedy]],
        83). Names: Schlesinger, Kennedy.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      src:
        c: '35387267'
        rows:
        - 'w.reeves-president-kennedy 83: all'
        - 'via w.reeves-president-kennedy 83 n.a-correspondent-named-harold-handleman: all'
- add:
    entry:
      id: cal.1961-04-06.press-and-broadcasting
      when: Apr. 6
      date: '1961-04-06'
      thread: press-and-broadcasting
      also:
      - cuba
      c: 'Schlesinger sends Kennedy "Our Men in Miami," Karl Meyer''s article due in the *New Republic*; Kennedy: "Stop it."
        Schlesinger, after seeing the publisher: "Gil Harrison came through like a gentleman and a patriot. He asked no questions
        and said he would drop the piece."'
      n: '[[w.reeves-president-kennedy]], 83. To check: Schlesinger to Kennedy, Apr. 6, 1961, Schlesinger Papers, box W-5,
        Kennedy Library; Schlesinger to Kennedy, follow-up, Apr. 6, 1961, Schlesinger Papers, box W-5, Kennedy Library (cited
        by [[w.reeves-president-kennedy]], 83). See [[cal.1961-04-07.cuba]]. Names: Schlesinger, Kennedy.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      src:
        c: '44432483'
        rows:
        - 'w.reeves-president-kennedy 83: all'
        - 'via w.reeves-president-kennedy 83 n.the-attached-article: A'
        - 'via w.reeves-president-kennedy 83 n.gil-harrison-came-through: B'
- add:
    entry:
      id: cal.1961-04.cuba-bay-of-pigs
      when: Apr.
      date: 1961-04
      thread: cuba-bay-of-pigs
      c: 'Kennedy tells Dulles and Bissell they must leave once things quiet down. To Bissell: "In a parliamentary system
        I would resign. In our system the President can''t and doesn''t. So you and Allen must go."'
      n: '[[w.reeves-president-kennedy]], 103. To check: [[w.powers-man-who-kept-the]], 115; [[w.ranelagh-agency]], 365, 770
        (cited by [[w.reeves-president-kennedy]], 103). Check: the day; by some accounts Kennedy said it to Dulles (Reeves''s
        note, 103). Names: Dulles, Bissell, Kennedy.'
      tags:
      - name:dulles-allen-w
      - name:bissell-richard-m-jr
      - name:kennedy-john-f
      src:
        c: c80a86a7
        rows:
        - 'w.reeves-president-kennedy 103: all'
- add:
    entry:
      id: cal.1961-05.cuba-2
      when: May
      date: 1961-05
      thread: cuba
      c: 'The Cuba task force at the State Department, two weeks after the landing. McNamara, his hand on Goodwin''s shoulder:
        "The only thing to do is eliminate Castro. ... I mean it, Dick. It''s the only way." By Goodwin''s account.'
      n: '[[w.reeves-president-kennedy]], 113. To check: [[w.goodwin-remembering-america]], 189 (cited by [[w.reeves-president-kennedy]],
        113). Check: the day. Names: McNamara, Goodwin, Castro.'
      tags:
      - name:mcnamara-robert-s
      - name:goodwin-richard-n
      - name:castro-fidel
      src:
        c: 11d92513
        rows:
        - 'w.reeves-president-kennedy 113: all'
- add:
    entry:
      id: cal.1961-05-01.laos-2
      when: May 1
      date: '1961-05-01'
      thread: laos
      also:
      - vietnam-congress
      c: 'Mansfield to Kennedy, by memorandum, on sending forces to Laos: "If the intervention involves U.S. forces, the initial
        approval, such as it is, will start to disappear as soon as the first significant casualty lists are published," and
        approval of "stand-firm" give way to disapproval of "Kennedy''s War."'
      n: '[[w.reeves-president-kennedy]], 115. To check: Mansfield to Kennedy, May 1, 1961, Vice-Presidential Security File,
        box 4, Johnson Library (cited by [[w.reeves-president-kennedy]], 115). See [[cal.1961-05-01.cuba-2]], his memorandum
        on Cuba the same day. Names: Mansfield, Kennedy.'
      tags:
      - name:mansfield-mike
      - name:kennedy-john-f
      src:
        c: d40f00ff
        rows:
        - 'w.reeves-president-kennedy 115: all'
        - 'via w.reeves-president-kennedy 115 n.if-the-intervention-involves-u-s: all'
- add:
    entry:
      id: cal.1961-05-05.berlin-and-vienna
      when: May 5
      date: '1961-05-05'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'McNamara to Kennedy, "Military Planning for a Possible Berlin Crisis," answering NSAM 41: no deficiencies in the
        unilateral contingency plans "within existing capabilities and national policy guidance"; deficiencies in the tripartite
        ones, among them a plan for a reinforced division to restore access.'
      n: '[FRUS 1961–63, XIV, doc. 22](https://history.state.gov/historicaldocuments/frus1961-63v14/d22). [[w.reeves-president-kennedy]],
        125. Check: Reeves''s note dates the memorandum May 6. Names: McNamara, Kennedy.'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      src:
        c: dcb000df
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d22: all'
        - 'w.reeves-president-kennedy 125: all'
        - 'via w.reeves-president-kennedy 125 n.military-planning-for-a-possible-berlin: all'
- add:
    entry:
      id: cal.1961-03-22.space
      when: Mar. 22
      date: '1961-03-22'
      thread: space
      c: 'Kennedy tells Webb of NASA: no new money for Apollo. The moon project on hold.'
      n: '[[w.reeves-president-kennedy]], 139. To check: [[w.murray-apollo]], 66–67 (cited by [[w.reeves-president-kennedy]],
        139). See [[cal.1961-04-12.space]]. Names: Webb, Kennedy.'
      tags:
      - name:webb-james-e
      - name:kennedy-john-f
      src:
        c: 1b22485f
        rows:
        - 'w.reeves-president-kennedy 139: all'
- add:
    entry:
      id: cal.1961-05.space
      when: May
      date: 1961-05
      thread: space
      also:
      - africa
      c: 'A White House state dinner for Bourguiba of Tunisia. Kennedy, with Wiesner: "we''re having a terrible argument in
        the White House over whether we should put a man on the moon. ... If I told you you''d get an extra billion dollars
        a year in foreign aid if I didn''t do it, what would be your advice?" Bourguiba: "I wish I could tell you to put it
        in foreign aid. But I cannot."'
      n: '[[w.reeves-president-kennedy]], 139. To check: [[w.murray-apollo]], 66–67 (cited by [[w.reeves-president-kennedy]],
        139). Check: the day; Reeves has the dinner the day after Shepard''s flight ([[cal.1961-05-05.space]]), the state
        visit having begun May 3 ([[cal.1961-05-03.africa]]). Names: Bourguiba, Wiesner, Kennedy.'
      tags:
      - name:bourguiba-habib-ben-ali
      - name:wiesner-jerome-b
      - name:kennedy-john-f
      src:
        c: a7f9c214
        rows:
        - 'w.reeves-president-kennedy 139: all'
- add:
    entry:
      id: cal.1961-07-26.berlin-and-vienna
      when: July 26–27
      date: '1961-07-26'
      thread: berlin-and-vienna
      also:
      - testing
      c: 'McCloy, the disarmament adviser, with Khrushchev at his dacha on the Black Sea. By McCloy''s cable, eyes only, July
        29: Khrushchev cordial the first day, "Really mad on Thursday after digesting President''s speech": he will sign the
        peace treaty "no matter what"; occupation rights cease, access cut off; "war bound to be thermonuclear and though
        you and we may survive all your European allies will be completely destroyed." Then offers to negotiate.'
      n: '[FRUS 1961–63, XIV, doc. 85](https://history.state.gov/historicaldocuments/frus1961-63v14/d85) (McCloy''s cable).
        [[w.reeves-president-kennedy]], 203. To check: McCloy to Finletter, Aug. 2, 1961, Berlin papers, National Security
        Archive; *Time*, Aug. 11, 1961 (cited by [[w.reeves-president-kennedy]], 203). See [[cal.1961-07-25.berlin-and-vienna]].
        Names: McCloy, Khrushchev.'
      tags:
      - name:mccloy-john-j
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      src:
        c: 165c9b47
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d85: all'
        - 'w.reeves-president-kennedy 203: all'
        - 'via w.reeves-president-kennedy 203 n.khrushchev-was-cordial.a: all'
        - 'via w.reeves-president-kennedy 203 n.khrushchev-was-cordial.b: all'
        - 'via w.reeves-president-kennedy 203 n.khrushchev-was-cordial.c: all'
- add:
    entry:
      id: cal.1961-08-03.testing
      when: Aug. 3
      date: '1961-08-03'
      thread: testing
      c: 'Kennedy to Macmillan, by letter, on testing: "we simply cannot be sure, without a control system, that the Soviets
        are not testing"; still "most reluctant" to decide to resume; one more try at Geneva. If the United States resumes,
        underground, unless the Soviets resume in the atmosphere.'
      n: '[FRUS 1961–63, VII, doc. 50](https://history.state.gov/historicaldocuments/frus1961-63v07/d50). [[w.reeves-president-kennedy]],
        224. To check: Kennedy to Macmillan, Aug. 3, 1961, Nuclear History papers, National Security Archive (cited by [[w.reeves-president-kennedy]],
        224). Names: Macmillan, Kennedy.'
      tags:
      - name:macmillan-harold
      - name:kennedy-john-f
      src:
        c: 43b56a5f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v07/d50: all'
        - 'w.reeves-president-kennedy 224: all'
        - 'via w.reeves-president-kennedy 224 n.what-we-have-all-feared: all'
- add:
    entry:
      id: cal.1961-08-07.berlin-and-vienna
      when: Aug. 7
      date: '1961-08-07'
      thread: berlin-and-vienna
      c: 'Khrushchev on Soviet television: the peace treaty with the GDR; the access agreements of the occupation "will become
        null and void." But "Barring access to West Berlin or a blockade of West Berlin are entirely out of the question."
        The White House: "Nothing new."'
      n: '[[w.reeves-president-kennedy]], 205–6. To check: [[w.slusser-berlin-crisis-of-1961]], 107–14 (cited by [[w.reeves-president-kennedy]],
        205); *New York Times*, Aug. 8, 1961 (cited by [[w.reeves-president-kennedy]], 206). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: d6432a74
        rows:
        - 'w.reeves-president-kennedy 205–6: all'
        - 'via w.reeves-president-kennedy 206 n.if-mr-khrushchev: C'
- add:
    entry:
      id: cal.1961-08-09.berlin-and-vienna
      when: Aug. 9
      date: '1961-08-09'
      thread: berlin-and-vienna
      c: 'Dowling, ambassador in Bonn, and Lightner, minister in Berlin, brief the American chiefs of mission in Europe on
        the Paris meetings. By Lightner''s notes: the other side might stop the refugees at the zonal border, "but there was
        also the alternative of putting the border control right through the middle of the city."'
      n: '[[w.reeves-president-kennedy]], 206. Check: Lightner''s notes, their place (Reeves''s note gives none). See [[cal.1961-08-13.berlin-and-vienna]].
        Names: Dowling, Lightner.'
      tags:
      - name:dowling-walter-c
      - name:lightner-e-allan-jr
      src:
        c: 3704eff3
        rows:
        - 'w.reeves-president-kennedy 206: all'
- add:
    entry:
      id: cal.1961-08-09.soviet-union
      when: Aug. 9–10
      date: '1961-08-09'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'Khrushchev, at the Moscow reception for Titov: "If Adenauer thinks he can achieve reunification of the German nation
        by war and we are attacked, there will be no German nation left." Aug. 10, to all of Europe: "The laws of war are
        cruel. Hundreds of millions of people will die," the NATO bases struck wherever they are, "even if they are in the
        orange groves."'
      n: '[[w.reeves-president-kennedy]], 206. To check: [[w.slusser-berlin-crisis-of-1961]], 124 (cited by [[w.reeves-president-kennedy]],
        206); Slusser, *The Berlin Crisis of 1961*, 124 (cited by [[w.reeves-president-kennedy]], 206). Names: Khrushchev,
        Titov, Adenauer.'
      tags:
      - name:khrushchev-nikita-s
      - name:titov-gherman
      - name:adenauer-konrad
      src:
        c: 298027ba
        rows:
        - 'w.reeves-president-kennedy 206: all'
        - 'via w.reeves-president-kennedy 206 n.the-laws-of-war-are-cruel: B'
- add:
    entry:
