      when: June 10
      date: '1961-06-10'
      thread: berlin-and-vienna
      c: 'Moscow releases the texts of the aides-mémoire handed Kennedy at Vienna: a peace treaty with Germany at once, the
        occupation rights ended by it, "a deadline period not exceeding six months." Rusk, on the flight home from London,
        had told Kennedy their release would mean the Soviets ready for a crisis over Berlin.'
      n: '[[w.reeves-president-kennedy]], 178–79. To check: *New York Times*, June 12, 1961 (cited by [[w.reeves-president-kennedy]],
        178). Names: Rusk, Kennedy.'
