- edit:
    id: cal.1963-07-17.civil-rights-bill
    base: 6dc241f1
    set:
      c: 'News conference. The March on Washington "a peaceful assembly calling for a redress of grievances," not "a march
        on the Capital." Warns against demonstrations "which could lead to bloodshed." Wants the tax and civil rights bills
        both this year. On Vietnam: "We are not going to withdraw from that effort"; to withdraw "would mean a collapse not
        only of South Viet-Nam, but Southeast Asia." The Republican National Committee''s resolution that he has been pretty
        much a failure: "I am sure it was passed unanimously."'
      n: 'The President''s News Conference, [1963 Pub. Papers 566](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=624)
        (July 17, 1963). [[w.selverstone-kennedy-withdrawal]], 137–38 (Vietnam). [[w.reeves-president-kennedy]], 544 (the
        Republican resolution). See [[cal.1963-06-11.civil-rights-bill]]. Names: Kennedy.'
      src:
