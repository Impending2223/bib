        - 'w.reeves-president-kennedy 466: all'
        - 'via w.reeves-president-kennedy 466 n.is-it-real-bad: all'
- add:
    entry:
      id: cal.1963-04-16.cuba
      when: Apr. 16
      date: '1963-04-16'
      thread: cuba
      c: 'The Standing Group of the NSC, revived, to take up Cuba at its first meeting; its members not all exposed to the
        Special Group''s work. By the memorandum for the record: "the desirability of not spreading knowledge of covert operations
        any wider than absolutely necessary, if we are to preserve the principle of deniability"; the covert annex to be handed
