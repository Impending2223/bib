- add:
    entry:
      id: cal.1960-12-08.transition-and-staff-cabinet
      when: Dec. 8
      date: '1960-12-08'
      thread: transition-and-staff-cabinet
      c: 'Kennedy and McNamara, president of the Ford Motor Company, a Republican, meet for the first time. Kennedy offers
        him the Treasury or Defense. McNamara: he knows nothing of government; Kennedy: "I don''t know how to be president,
        either."'
      n: '[[w.reeves-president-kennedy]], 25. To check: Roswell Gilpatric, oral history, 63, Kennedy Library; Robert McNamara,
        oral history, 11, Kennedy Library (cited by [[w.reeves-president-kennedy]], 25). Check: the day, "six days" after
        *Time* of Dec. 2 by Reeves. Names: McNamara, Kennedy.'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      src:
        c: ce81e000
        rows:
        - 'w.reeves-president-kennedy 25: all'
        - 'via w.reeves-president-kennedy 25 n.robert-mcnamara.a: all'
        - 'via w.reeves-president-kennedy 25 n.robert-mcnamara.b: all'
        - 'via w.reeves-president-kennedy 25 n.robert-mcnamara.c: all'
- add:
    entry:
      id: cal.1960-12.transition-and-staff-cabinet
      when: Dec.
      date: 1960-12
      thread: transition-and-staff-cabinet
      also:
      - economy
      c: 'Gore to the President-elect, against Dillon for the Treasury: a Republican, who gave $30,000 to Nixon''s campaign;
        "If you want someone rich from Wall Street, pick Averell Harriman." Against Surrey for tax policy under him: "Dillon
        will make the policy. Nobody''s going to listen to some assistant secretary."'
      n: '[[w.reeves-president-kennedy]], 26–27. Check: the day; Reeves has Gore the visitor after Dillon. See [[cal.1960-12-16.robert-kennedy]].
        Names: Gore, Dillon, Harriman, Surrey, Kennedy.'
      tags:
      - name:gore-albert-sr
      - name:dillon-c-douglas
      - name:harriman-w-averell
      - name:surrey-stanley-s
      - name:kennedy-john-f
      src:
        c: b26ec5f0
        rows:
        - 'w.reeves-president-kennedy 26–27: all'
- add:
    entry:
      id: cal.1961-01-19.civil-rights-the-executive
      when: Jan. 19–20
      date: '1961-01-19'
      thread: civil-rights-the-executive
      c: 'The inaugural address, the last revisions, thirty-one in the last hours. Wofford: "There''s an equal rights struggle
        here at home, too." Kennedy writes in "at home": the rights "to which we are committed today at home and around the
        world."'
      n: '[[w.reeves-president-kennedy]], 39. To check: *Washington Post*, Jan. 21, 1961 (cited by [[w.reeves-president-kennedy]],
        39). Check: the day of the change. See [[cal.1961-01-20.transition-and-staff]]. Names: Wofford, Kennedy.'
      tags:
      - name:wofford-harris
      - name:kennedy-john-f
      src:
        c: 1638f89d
        rows:
        - 'w.reeves-president-kennedy 39: all'
        - 'via w.reeves-president-kennedy 39 n.you-cant-do-this: all'
        - 'via w.reeves-president-kennedy 39 n.thirty-one-changes: all'
- add:
    entry:
      id: cal.1961-01.rules
      when: Jan.
      date: 1961-01
      thread: rules
      c: 'At breakfast, Rayburn to Kennedy: "Mr. President, I don''t believe we have the votes to expand the Rules Committee."
        Kennedy to O''Brien: "We can''t lose this one, Larry. The ball game is over if we do."'
      n: '[[w.reeves-president-kennedy]], 55. To check: [[w.obrien-no-final-victories]], 107 (cited by [[w.reeves-president-kennedy]],
        55). Check: the day; Reeves has it "during those first days in office"; perhaps the leaders'' first breakfast, [[cal.1961-01-24.congress]].
        Names: Rayburn, O''Brien, Kennedy.'
      tags:
      - name:rayburn-sam
      - name:obrien-lawrence-f
      - name:kennedy-john-f
      src:
        c: f33bb6f6
        rows:
        - 'w.reeves-president-kennedy 55: all'
- add:
    entry:
      id: cal.1961-02-08.defense
      when: Feb. 8
      date: '1961-02-08'
      thread: defense
      also:
      - desegregation-schools
      c: 'News conference, the third. The missile gap: the studies not complete, "it would be premature to reach a judgment
        as to whether there is a gap or not a gap." New Orleans: "all students should be given the opportunity to attend public
        schools regardless of their race"; what to do there "a matter which we are carefully considering."'
      n: 'The President''s News Conference of February 8, 1961, [1961 Pub. Papers 66](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=124).
        [[w.reeves-president-kennedy]], 59, 61. To check: Kennedy to Bundy, Feb. 8, 1961, President''s Office Files, box 62,
        Kennedy Library (cited by [[w.reeves-president-kennedy]], 59). See [[cal.1961-02-06.defense]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 7611fbcd
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=124: all'
        - 'w.reeves-president-kennedy 59, 61: all'
        - 'via w.reeves-president-kennedy 59 n.could-you-let-me-know: A'
- add:
    entry:
      id: cal.1961-02-08.civil-rights-the-executive
      when: Feb. 8
      date: '1961-02-08'
      thread: civil-rights-the-executive
      c: 'Hesburgh of the Civil Rights Commission with Kennedy: no Negroes in the Alabama National Guard. Kennedy: "I may
        have to send the Alabama National Guard to Berlin tomorrow and I don''t want to have to do it in the middle of a revolution
        at home." Hesburgh asks for a White House liaison to the Commission; Kennedy names Wofford, "a special assistant who''s
        working on that full time."'
      n: '[[w.reeves-president-kennedy]], 59–60. To check: Theodore Hesburgh, oral history, Kennedy Library (cited by [[w.reeves-president-kennedy]],
        59); Harris Wofford, oral history, 103, Kennedy Library (cited by [[w.reeves-president-kennedy]], 60). Check: the
        day; Reeves has the appointment delayed the morning of the news conference. Names: Hesburgh, Wofford, Kennedy.'
      tags:
      - name:hesburgh-theodore-m
      - name:wofford-harris
      - name:kennedy-john-f
      src:
        c: 7524d2b2
        rows:
        - 'w.reeves-president-kennedy 59–60: all'
        - 'via w.reeves-president-kennedy 59 n.theodore-hesburgh.a: all'
        - 'via w.reeves-president-kennedy 59 n.theodore-hesburgh.b: all'
        - 'via w.reeves-president-kennedy 60 n.i-already-have-a-special-assistant.a: C'
        - 'via w.reeves-president-kennedy 60 n.i-already-have-a-special-assistant.b: C'
