- edit:
    id: cal.1963-03-06.economy
    base: b722f7de
    set:
      c: 'News conference. A $13½ billion cut without the reforms? "No, that isn''t what I said." The program sent up, reduction
        and reform together, the best combination; the bill Congress enacts will hold "important elements of the reforms."
        On Mansfield''s report: no large cut in aid to South Vietnam, Cambodia and Thailand "unless you want to withdraw from
        the field." His judges in the South, "sharing perhaps as they do the general outlook of the South, have done a remarkable
        job in fulfilling their oath of office."'
      n: 'The President''s News Conference of March 6, 1963, [1963 Pub. Papers 236](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=294),
        item 2. [[w.stein-fiscal-revolution-in-america]], 438–39. [[w.selverstone-kennedy-withdrawal]], 107 (Mansfield''s
        report). [[w.reeves-president-kennedy]], 466 (the judges). See [[cal.1963-01-24.economy]]. Names: Mansfield, Kennedy.'
      src:
