- edit:
    id: cal.1962-08-29.conservation
    base: 3e4b5fb8
    set:
      c: 'News conference. Asked about DDT and other pesticides: the Department of Agriculture and the Public Health Service
        already examining the matter, "particularly, of course, since Miss Carson''s book." *Silent Spring* serialized in
        *The New Yorker* from June 16; the book out Sept. 27. On Cuba: "We''ve no evidence of troops." Capehart''s call for
        an invasion: "I think it would be a mistake to invade Cuba."'
      n: 'The President''s News Conference, [1962 Pub. Papers 648](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=708)
        (Aug. 29, 1962). [[w.reeves-president-kennedy]], 343–44 (Cuba). To check: [[w.carson-silent-spring]]; [[w.lear-rachel-carson]].
        Names: Carson, Capehart, Kennedy.'
