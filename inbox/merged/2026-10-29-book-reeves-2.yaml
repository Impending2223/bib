    entry:
      id: cal.1963-02.vietnam
      when: Feb.
      date: 1963-02
      thread: vietnam
      c: 'Kennedy, to the sister of McAndrew, a helicopter gunner killed at Ấp Bắc, his own reply in place of the Army''s
        draft: "Americans are in Vietnam because we have determined that this country must not fall under Communist domination."'
      n: '[[w.reeves-president-kennedy]], 449–50. To check: [[w.lieberson-john-fitzgerald-kennedy-as]], 187–89 (cited by [[w.reeves-president-kennedy]],
        449). Check: the day; Reeves has the letter shown him two weeks after the condolences. See [[cal.1963-01-02.vietnam]].
        Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
