        start protecting the interests of the United States."'
      n: 'The question put to Kennedy: The President''s News Conference, [1962 Pub. Papers 648](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=708)
