- edit:
    id: cal.1963-03-21.cuba
    base: 205c1e5c
    set:
      c: 'News conference: the raiders "do not have a connection with the United States Government." On the test ban: "we
        test and test and test, and you finally get weapons which are increasingly sophisticated." "Personally I am haunted
        by the feeling that by 1970, unless we are successful, there may be 10 nuclear powers instead of 4, and by 1975, 15
        or 20." The Civil Rights Commission''s hearing in Mississippi: "any hearing that they feel advances the cause or meets
        their responsibility ... then they should go ahead and hold it."'
      n: 'The President''s News Conference, [1963 Pub. Papers 273](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=331)
        (Mar. 21, 1963). [[w.reeves-president-kennedy]], 311, 469 (testing, 311; the Commission, 469). See [[cal.1963-03-17.cuba]].
        Names: Kennedy. Check: Reeves gives the first words as of the news conference of May 17, 1962 (311).'
      src:
