- edit:
    id: cal.1963-02-12.civil-rights-the-executive
    base: 402b37ee
    set:
      c: 'Lincoln''s Birthday. The Civil Rights Commission presents *Freedom to the Free*, its report on the century since
        emancipation. At the Lincoln Day reception, Hannah, the Commission''s chairman, tells Kennedy of its coming report
        on Mississippi. Kennedy: "You''re making my life difficult. I''ve read this law and I know you can do anything you
        want to, but I would appreciate if you didn''t."'
      n: 'Remarks Upon Receiving Civil Rights Commission Report "Freedom to the Free", [1963 Pub. Papers 159](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=217)
        (Feb. 12, 1963). [[w.reeves-president-kennedy]], 462–64, 469 (Hannah, 469). To check: [[w.rights-freedom-to-the-free]];
        [[w.brauer-john-f-kennedy-and]]; [[w.dulles-civil-rights-commission-1957]]; *New York Times*, Feb. 13, 1963 (cited
        by [[w.reeves-president-kennedy]], 463); Lee White, oral history, 104–05, Kennedy Library (cited by [[w.reeves-president-kennedy]],
        464). See [[cal.1962-11-20.civil-rights-the-executive]]. Names: Hannah, Kennedy.'
      src:
