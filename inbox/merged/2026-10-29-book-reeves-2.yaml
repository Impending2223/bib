      when: Mar. 7
      date: '1963-03-07'
      thread: civil-rights-the-executive
      c: 'Kennedy to Katzenbach, recorded, on his Southern judges, after the news conference: "Is it real bad?" Katzenbach:
        "Not too good," of one; "They''re all Eastland''s." Kennedy asks a memorandum, "so I''ll be able to talk about it
        in case it comes up again."'
