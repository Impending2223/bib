      c: 'Bình Hòa, near the Cambodian border, seventeen miles west of Saigon: an hour''s bombing by Vietnamese planes with
        American pilots, then five ARVN battalions; no Viet Cong found. Five civilians dead and eleven wounded; one Cambodian
        dead, stray bombs over the border. Hilsman watches. Kennedy, on his report: "How can things like this go on happening?
        I''ve been President for a year."'
