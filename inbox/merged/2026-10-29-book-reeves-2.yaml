      date: '1962-10-13'
      thread: elections-1962
      c: 'Indianapolis, campaigning for Bayh against Capehart: "These self-appointed generals and admirals who want to send
        somebody else''s son to war ought to be kept home by the voters and be replaced by somebody like Birch Bayh." Then
        Buffalo.'
