      n: '[[w.zhu-de-nianpu-xinbian]], III, 1861. Made public: 2016. After [[cal.1963-01-21.china-leadership-8|the return to Haikou]]: he comes back to Haikou from the eastern road (回到海口市) and goes out by the western road (乘车沿西线) (III, 1861). Names: Zhu De.'
