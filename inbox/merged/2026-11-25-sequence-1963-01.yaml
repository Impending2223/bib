- edit:
    id: cal.1963-01-17.china-leadership-2
    base: e966c5d9
    set:
      n: '[[w.zhou-enlai-nianpu-1949]], II, 526 (Jan. 17, 1963). Made public: 1997. After [[cal.1963-01-17.china-leadership-6|the delegation''s journey to Hangzhou]]: Zhou is at Hangzhou Jan. 9–21 ([[cal.1963-01-09.china-leadership]]), and Chen Yi brings the delegation there from Guangzhou that morning ([[w.chen-yi-nianpu]], 951). Names: Zhou Enlai, Chen Yi, Kofi Asante Ofori-Atta.'
