- edit:
    id: cal.1963-01-21.china-leadership-9
    base: c4d91f08
    set:
      n: '[[w.zhu-de-nianpu-xinbian]], III, 1861. Made public: 2016. After [[cal.1963-01-21.china-leadership-8|the return to Haikou]]: away from Haikou since Jan. 15, he comes back to it on the 21st by the eastern road (III, 1860–1861); the hearing is at Haikou as the line places it, the nianpu naming no place for it. Names: Zhu De.'
