    - cal.1963-01-08.china-leadership-3
- edit:
    id: cal.1963-01-08.china-leadership
    base: ae11799b
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 8, 1963 (and Jan. 9). [[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 15, 1963: Zhou Enlai, at Mao''s request, drafts the Central Committee notice on the 1963 plan and the like; the nianpu gives a conference in mid-February, not a meeting of the regional secretaries from Feb. 5); [[w.deng-xiaoping-nianpu-1904]], III, 1741–1742 (Jan. 9, 1963; Deng reads the record of Zhou Enlai''s call of the 8th from Hangzhou, in which Zhou gives Mao''s three instructions: the anti-revisionist article held until Khrushchev has spoken at the SED congress and then answered with his Supreme Soviet speech; more ''writers'' (秀才) for the delegation; Ke Qingshi''s plan of a small meeting on Feb. 5 with the bureau secretaries and a work conference on Feb. 10 with the provincial secretaries). The words: 晚上，同周恩来谈话 ([[w.zedong-mao-zedong-nianpu]], V, Jan. 8, 1963). Made public: 1997. After [[cal.1963-01-08.china-leadership-4|Zhou''s seeing Bandaranaike off at Shanghai]]: Zhou is at Shanghai''s Hongqiao airport that day ([[w.zhou-enlai-waijiao-huodong]], 349), and with Mao at Hangzhou that evening. Check: Yang Shangkun''s diary records a call from Zhou Enlai at Hangzhou on Jan. 8 ([[w.yang-shangkun-riji]], II, 241–242), none on Jan. 9; whether the call of unit C is that one. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Khrushchev, Yang Shangkun.'
      time_range:
      - 1963-01-08T11:00Z
      - 1963-01-08T14:00Z
      time_band: evening
      time_zone: Asia/Shanghai
- follows:
    id: cal.1963-01-08.china-leadership
    add:
    - cal.1963-01-08.china-leadership-4
- edit:
    id: cal.1963-01-08.china-leadership-8
    base: e0f42fa1
    set:
      n: '[[w.yang-shangkun-riji]], II, 241–242 (Jan. 8, 1963); [[w.peng-zhen-nianpu-1902]], IV, 238 (Jan. 9, 1963; Zhou Enlai telephones from Hangzhou to Liu Shaoqi, Deng Xiaoping, Peng Zhen and others three instructions of Mao: the articles against modern revisionism held until Khrushchev speaks at the East German congress, then both his speeches answered; a few more "scholars" in the delegation to the congress; Ke Qingshi''s proposal agreed, a small meeting of the regional bureaus'' secretaries Feb. 5 and a Central Work Conference with the provincial secretaries Feb. 10). The words: 总理由杭州来电话 (II, 241). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). After [[cal.1963-01-08.china-leadership-4|the seeing-off at Shanghai]], Zhou being at Hongqiao airport that day ([[w.zhou-enlai-waijiao-huodong]], 349); and after [[cal.1963-01-08.china-leadership-7|the Secretariat''s meeting]]: the diary writes the call after the meeting of 3:30 to 6 p.m. and before the evening (晚间) (II, 241–242), the order of its sentences, the weakest basis. Names: Zhou Enlai, Yang Shangkun.'
