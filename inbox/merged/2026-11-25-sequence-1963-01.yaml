- edit:
    id: cal.1963-01-05.china-leadership
    base: 48d7edaf
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1963 (and n. 4). [[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 5, 1963: Zhou Enlai with Mao receives Bandaranaike, and Subandrio brought by Chen Yi). The words: 下午，同本日到达杭州的周恩来谈话 ([[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1963). Made public: 1997. After [[cal.1963-01-05.china-leadership-4|Zhou''s departure from Peking]]: Zhou reaches Hangzhou that day (the Mao nianpu, above), the party there at noon ([[w.chen-yi-nianpu]], 950). Names: Mao Zedong, Zhou Enlai, Bandaranaike, Subandrio.'
      time_range:
      - 1963-01-05T04:00Z
      - 1963-01-05T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
- edit:
    id: cal.1963-01-05.china-leadership-2
    base: 2053f249
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1963 ("同日"). [[w.zhou-enlai-waijiao-huodong]], 349 (Jan. 5, 1963; 下午6时, 杭州, 陪同毛泽东主席会见). Made public: 1993. See [[cal.1963-01-05.china-leadership]]. After [[cal.1963-01-05.china-leadership|Mao''s talk with Zhou]]: the Mao nianpu puts the talk in the afternoon (下午) and this reception at 6 p.m. (下午六时) (V, Jan. 5, 1963). Names: Mao Zedong, Bandaranaike, Zhou Enlai, Chen Yi, Huo Shilian.'
- follows:
    id: cal.1963-01-08.china-leadership-4
