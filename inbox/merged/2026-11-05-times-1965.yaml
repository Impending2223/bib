        alone of the governors refusing to endorse Johnson''s policy). Check: Gibbons, III, 451, from Hatfield''s
        account (CRS interview; *Not Quite So Simple*, 156–59), has Hatfield vote no and Romney tell reporters he
        had too. After the news conference, which they watch. See [[cal.1965-07-28.vietnam]]. Names: Johnson, Sanders,
        Romney, Hatfield. Check: Mann, 464, from Hatfield''s interview, has him alone against it.'
