      n: '[[w.branch-pillar-of-fire]], 582–83; [[w.kotz-judgment-days]], 270–71 (White to Wachtel, Sunday: total
        secrecy, or "all bets were off"); [[w.bernstein-guns-or-butter]], 221 (White''s arrangement: "if word of
        this got out in advance, all bets were off"). To check: SAC, New York, to Director, Feb. 7, 1965, FK-852
        (cited by [[w.branch-pillar-of-fire]], 582); Int. Lee White, Dec. 13, 1983, Dec. 3, 1991 (cited by [[w.branch-pillar-of-fire]],
        582); Int. Harry Wachtel, Oct. 27, 1983 (cited by [[w.branch-pillar-of-fire]], 582); SAC, New York, to Director,
        Feb. 7, 1965, FK-857 (cited by [[w.branch-pillar-of-fire]], 582); Hoover to the Attorney General, Feb. 8,
        1965, FDCA-389 (cited by [[w.branch-pillar-of-fire]], 582); [[w.garrow-bearing-the-cross]], 386–87 (cited
        by [[w.branch-pillar-of-fire]], 583). After Pleiku: [[cal.1965-02-07.vietnam]]. See [[cal.1965-02-05.king]].
        Names: White, Humphrey, Johnson, King.'
