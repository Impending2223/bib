      follows:
      - cal.1965-03-09.voting-rights-selma-3
      n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 103
        (M.D. Ala. 1965) (the order of Mar. 9). Statement by the President on the Situation in Selma, Alabama, [1965
        Pub. Papers 272](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=348) (Mar.
        9, 1965): "deploring the brutality." Check the number. [[w.garrow-bearing-the-cross]], 401–05; [[w.branch-at-canaans-edge]],
        67–80 (not Reeb''s death); [[w.mann-walls-of-jericho]], 454–55 (the march to the bridge, the turn back,
        Collins''s arrangement; Reeb); [[w.zelizer-fierce-urgency-of-now]], 211 (two thousand cross the bridge,
        pray, and turn back); [[w.kotz-judgment-days]], 294–96 (fifteen hundred; Collins with Clark and Lingo; Wallace
        by telephone to Lingo); [[w.kotz-judgment-days]], 296–97 (three Unitarian ministers, Reeb, Orloff Miller
        and Clark Olsen, from dinner at Walker''s cafe; Reeb struck on the skull with a long club; four hours to
        the hospital at Birmingham); [[w.bernstein-guns-or-butter]], 229–30 (the restraining order served mid-morning;
        the halt 50 feet from the troopers; Reeb struck about 7:30 p.m.; he dies at 6:55 p.m., Thursday); [[w.young-easy-burden]],
        360–61 (about two thousand from Brown Chapel about 3 p.m.; Reeb); [[w.wofford-of-kennedys-and-kings]], 181–85
        (Wofford with King before the march; King: "We march," "But we may not march very far"; the march to the
        troopers and back to Brown''s Chapel; Reeb attacked that night). Check: Kotz gives fifteen hundred marchers
        (295). Check: Kotz dates Judge Johnson''s order late on Mar. 8 (292). After Collins''s arrangement that
        morning: [[cal.1965-03-09.voting-rights-selma-3]]. See [[cal.1965-03-07.voting-rights]]. Check: Garrow,
        403, gives two thousand marchers. Check: Branch gives the FBI''s estimate of two thousand to twenty-five
        hundred gathered (72), the order signed at 9:46 a.m. (note, 72). Names: Frank Johnson, King, Collins, Clark,
        Lingo, Reeb. Check: Mann, 454, gives 1,500 marchers.'
