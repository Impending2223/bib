      time: 1965-07-27T21:40Z
      follows:
      - cal.1965-07-27.vietnam-july-decision-2
      n: 'FRUS 1964–68, III, docs. [93](https://history.state.gov/historicaldocuments/frus1964-68v03/d93), [94](https://history.state.gov/historicaldocuments/frus1964-68v03/d94),
        [96](https://history.state.gov/historicaldocuments/frus1964-68v03/d96). [[w.gibbons-u-s-government-and]],
        III, 424–31; [[w.drea-mcnamara-clifford-and-the-2011]], 46 (the NSC; the leaders); [[w.poole-joint-chiefs-of-staff-2012]],
        43 (no reserves); [[w.cosmas-joint-chiefs-of-staff-2012]], 309 (the NSC''s decision); [[w.johnson-vantage-point]],
        148–51; [[w.herring-lbj-and-vietnam]], 35, 129, 131 (the NSC: Wheeler''s nod; Johnson''s question on 600,000
        men, Resor''s answer; "I don''t want to be dramatic and cause tension"); [[w.mcnamara-in-retrospect]], ch.
        7 (the program approved; the appropriation held below McNamara''s estimate). [[w.mann-grand-delusion]],
        454–57 (the NSC; the leaders; Mansfield''s statement); [[w.califano-triumph-and-tragedy-of]], 41–46 (the
        NSC: Johnson asks approval of a more limited plan; the leaders, 6:45 p.m. to about 8:30, Califano''s notes:
        Johnson''s five choices, "the choice is between four and five"; Smathers, "Has our policy changed?"; Ford
        on 4 and 5; Dirksen, "peel off the dramatics," "this is serious business"; Mansfield, "abrogated with the
        assassination of Diem," no "tangible national interest"; Hickenlooper, "We win victories in war and lose
        in negotiations"); [[w.bernstein-guns-or-butter]], 347–48 (the short-term recommendations approved; no Reserves,
        no appeal to Congress); [[w.gibbons-u-s-government-and]], IV, 22 (the leaders, eleven: Mansfield the only
        dissenter; Hickenlooper dubious, for "supporting the President rather than approving"); [[w.drea-mcnamara-clifford-and-the-2011]],
        46 (the NSC, expanded; the leaders told). [[w.ball-past-has-another-pattern]], 403 (Mansfield at the leaders''
        meeting); [[w.woods-fulbright]], 374 (Mansfield''s words, by Woods; his support). Check: Califano gives
        Long: "If we back out, they''d move somewhere else. ... I''m not ready to turn tail" (42); he names neither
        Kuchel, Arends, Boggs nor Albert. Check: the hour of Mansfield''s words; Woods has them that morning, before
        the meeting, in Mansfield''s office (374). To check: notes of the NSC meeting, July 27, 1965, Meeting Notes
        File, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 131 n.45); Mansfield, notes on Vietnam, July
        28, 1965, XXII, 102, Mansfield Papers (cited by [[w.mann-grand-delusion]], 457 n.54); Congressional Leadership
        Meeting, July 27, 1965, Meeting Notes File, box 1, Johnson Papers (cited by [[w.woods-fulbright]], 374 n.47).
        After the leaders'' breakfast: [[cal.1965-07-27.vietnam-july-decision-2]]. See [[cal.1965-07-01.vietnam]].
        Names: Johnson, Mansfield, Dirksen, Hickenlooper, Smathers, Kuchel, Long, McCormack, Ford, Arends, Boggs,
        Albert. Check: Mann, 455, leaves Kuchel out.'
