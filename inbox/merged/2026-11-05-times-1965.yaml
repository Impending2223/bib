      n: '[FRUS 1964–68, II, doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v02/d43) (State to
        Taylor, 8:48 p.m.: the meeting "at highest levels"; the evacuation, "clearing decks"); doc. [42](https://history.state.gov/historicaldocuments/frus1964-68v02/d42)
        n.2 (McNamara: the views given Johnson "in a mtg with Dean Rusk"). [[w.logevall-choosing-war]], 318–19 (the
        meeting; Johnson''s words; the patrols, 319); [[w.mcnamara-in-retrospect]], ch. 6 at n.22 (the Treaty Room,
        that morning, with Rusk). Johnson to Taylor, 9:46 p.m.: [FRUS 1964–68, II, doc. 44](https://history.state.gov/historicaldocuments/frus1964-68v02/d44).
        [[w.preston-war-council]], 168 (Johnson''s cable to Taylor: "the U.S. will spare no effort and no sacrifice");
        [[w.branch-pillar-of-fire]], 572. To check: MB meeting notes, Jan. 27, 1965, NSF MPB, LBJ Library (cited
        by [[w.logevall-choosing-war]], 318 n.32); [[w.rusk-as-i-saw-it-1990]], 447 (cited by [[w.branch-pillar-of-fire]],
        572). After Bundy''s memorandum for the meeting: [[cal.1965-01-27.vietnam-2]]. See [[cal.1965-01-27.vietnam-2]].
        Names: Johnson, Rusk, McNamara, McGeorge Bundy, Nguyễn Khánh.'
