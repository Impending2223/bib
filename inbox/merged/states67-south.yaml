patch: south
by: agent
ops:
  # ---------------------------------------------------------------- Georgia
  - add:
      entry:
        id: cal.1967-01-10.georgia-ga
        when: Jan. 9–10
        date: '1967-01-09'
        thread: georgia
        also: [governors, legislatures, elections-1966]
        c: 'Atlanta. Jan. 9, the House convenes; Bond sworn in, a year after it refused him his seat. Jan. 10, the General Assembly in joint session chooses the governor from the two highest: Maddox 182, Callaway 66. Bond among those not voting. Maddox sworn the same evening.'
        n: '[*Georgia''s Official Register, 1967–1968*, 25](https://dlg.galileo.usg.edu/data/dlg/sreg/pdfs/dlg_sreg_1967.pdf#page=27) ("Governor, Jan. 10, 1967-date"). The vote: [Wikipedia, "1966 Georgia gubernatorial election"](https://en.wikipedia.org/wiki/1966_Georgia_gubernatorial_election), from the *Atlanta Constitution*, Jan. 11, 1967; Check: the *Journal of the House*, 1967. [[w.short-everything-is-pickrick]]; [[w.bartley-from-thurmond-to-wallace]]; [[w.neary-julian-bond]]. See [[cal.1966-12-12.georgia]]; [[cal.1966-12-05.georgia]]. Names: Maddox, Callaway, Bond.'
        tags: [state:ga, city:atlanta, name:maddox-lester, name:callaway-howard-h, name:bond-julian]
  # ---------------------------------------------------------------- Alabama
  - add:
      entry:
        id: cal.1967-01-16.alabama-al
        when: Jan. 16
        date: '1967-01-16'
        thread: alabama
        also: [governors, desegregation-schools]
        c: 'Montgomery. Lurleen Wallace sworn as governor. She ran "for the purpose of permitting my husband to take our fight to the final court of appeal"; her election "notice to all the world that the strength and determination of a free people to defend the principles of self-government will not be suppressed by force--force from China, from Russia, from Cuba, or from Washington, D.C." Jan. 10, George Wallace''s last address to the legislature: "federal judicial blackguards."'
        n: '[U.S. Comm''n on Civil Rights, *School Desegregation in the Southern and Border States*, Jan. 1967](https://usccr.gov/files/historical/1967/67-007.pdf), Alabama. [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]. See [[cal.1966-11-08.alabama-al]]. Names: Lurleen Wallace, George Wallace.'
        tags: [state:al, name:wallace-lurleen-b, name:wallace-george-c]
  - add:
      entry:
        id: cal.1967-03-30.alabama-al
        when: Mar. 30
        date: '1967-03-30'
        thread: alabama
        also: [desegregation-schools, legislatures]
        c: 'Lurleen Wallace, on statewide television, to a joint session of the legislature in special session, on the three-judge court''s order of Mar. 22 to desegregate the State''s schools: an appeal; the legislature to sit as a committee of the whole and hear the educators; if a stay is refused or the appeal fails, "all powers heretofore vested ... in the State Superintendent of Education" to be placed in the governor, or the governor and legislature; the State''s "police power" to be invoked. May 2, to the regular session, no word of taking over the schools.'
        n: '[U.S. Comm''n on Civil Rights, *School Desegregation in the Southern and Border States*, Mar. 1967](https://usccr.gov/files/historical/1967/67-009.pdf), Alabama; [May 1967](https://usccr.gov/files/historical/1967/67-006.pdf), Alabama. *Lee v. Macon County Board of Education*, [267 F. Supp. 458](https://static.case.law/f-supp/267/case-pdfs/0458-01.pdf) (M.D. Ala. 1967). [[w.carter-politics-of-rage-1995]]; [[w.bass-taming-the-storm]]. See [[cal.1967-01-16.alabama-al]]. Names: Lurleen Wallace.'
        tags: [state:al, name:wallace-lurleen-b]
  # ---------------------------------------------------------------- Mississippi
  - add:
      entry:
        id: cal.1967-08-08.mississippi-ms
        when: Aug. 8
        date: '1967-08-08'
        thread: mississippi
        also: [governors, elections-1967]
        c: 'Mississippi''s Democratic primary for governor, the first since the Voting Rights Act. William Winter, the State treasurer, 222,001, 32.5 percent; U.S. Representative John Bell Williams, stripped of his seniority by the House Democrats in 1965 for backing Goldwater, 197,778, 28.9; Swan 124,361, 18.2; Barnett, governor 1960–64, 76,053, 11.1; Waller, the Hinds County district attorney, 60,090, 8.8; two others. Runoff between Winter and Williams.'
        n: 'Votes: [Wikipedia, "1967 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1967_Mississippi_gubernatorial_election), from Our Campaigns; Check: Miss. Secretary of State, Election Returns (MDAH Series 0107). [[w.crespino-in-search-of-another]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.peirce-deep-south-states-of]]; [[w.black-rise-of-southern-republicans]]. See [[cal.1963-11-05.mississippi-ms]]. Names: Winter, Williams, Swan, Barnett, Waller.'
        tags: [state:ms, name:winter-william-f, name:williams-john-b, name:swan-jimmy, name:barnett-ross-r, name:waller-william-l]
  - add:
      entry:
        id: cal.1967-08-29.mississippi-ms
        when: Aug. 29
        date: '1967-08-29'
        thread: mississippi
        also: [governors, elections-1967]
        c: 'Mississippi''s Democratic runoff for governor: Williams 371,815, 54.5 percent; Winter 310,527.'
        n: 'Votes: [Wikipedia, "1967 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1967_Mississippi_gubernatorial_election), from Our Campaigns; Check: the date, and MDAH Series 0107. See [[cal.1967-08-08.mississippi-ms]]. Names: Williams, Winter.'
        tags: [state:ms, name:williams-john-b, name:winter-william-f]
  - add:
      entry:
        id: cal.1967-11-07.mississippi-ms
        when: Nov. 7
        date: '1967-11-07'
        thread: mississippi
        also: [governors, legislatures, elections-1967, voting-rights]
        c: 'Mississippi. Williams (D) elected governor over Rubel Phillips (R), 315,318 to 133,379, 70.3 percent; the Freedom Democrats had endorsed Phillips. The legislature elected in the districts the federal court drew. In Holmes County, Robert Clark, a teacher, on the Freedom Democrats'' slate, elected to the House: the first Negro in the legislature since the 1890s. He takes his seat Jan. 2, 1968.'
        n: 'Votes: [Wikipedia, "1967 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1967_Mississippi_gubernatorial_election); [Wikipedia, "Robert G. Clark Jr."](https://en.wikipedia.org/wiki/Robert_G._Clark_Jr.); [SNCC Digital Gateway, "November 1967"](https://snccdigital.org/?p=166). Check: MDAH Series 0107; *Mississippi Official and Statistical Register, 1968–1972*. [[w.campbell-robert-g-clarks-journey]]; [[w.parker-black-votes-count]]; [[w.dittmer-local-people]]. See [[cal.1967-08-29.mississippi-ms]]; [[cal.1966-07-22.mississippi-ms]]. Names: Williams, Phillips, Clark.'
        tags: [state:ms, name:williams-john-b, name:phillips-rubel, name:clark-robert-g-jr]
  # ---------------------------------------------------------------- Louisiana
  - add:
      entry:
        id: cal.1967-11-04.governors-la
        when: Nov. 4
        date: '1967-11-04'
        thread: governors
        also: [elections-1967, legislatures]
        c: 'Louisiana''s Democratic primary. McKeithen, the first governor the constitution lets succeed himself (the amendment of 1966), renominated, 836,304, 80.6 percent, over U.S. Representative Rarick, 179,846, 17.3; three others. No Republican files; the general election, Feb. 6, 1968, uncontested. Morial, a New Orleans lawyer, wins a House seat from Uptown in the primaries of 1967, the first Negro in the legislature since Reconstruction (Check: the round).'
        n: 'Votes: [Wikipedia, "1968 Louisiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Louisiana_gubernatorial_election), from the Secretary of State''s *Primary Election Returns*, 1967; [Wikipedia, "Dutch Morial"](https://en.wikipedia.org/wiki/Dutch_Morial). Check: the Secretary of State''s returns. [[w.peirce-deep-south-states-of]]; [[w.fairclough-race-and-democracy]]. See [[cal.1966-11-08.state-constitutions-la]]. Names: McKeithen, Rarick, Morial.'
        tags: [state:la, city:new-orleans, name:mckeithen-john-j, name:rarick-john-r, name:morial-ernest-n]
  # ---------------------------------------------------------------- Kentucky
  - add:
      entry:
        id: cal.1967-05-23.governors-ky
        when: May 23
        date: '1967-05-23'
        thread: governors
        also: [elections-1967]
        c: 'Kentucky primaries for governor. Democratic: Ward, the highway commissioner, 207,797, 52.4 percent; Chandler, governor 1935–39 and 1955–59, 111,782, 28.2; Lieutenant Governor Waterfield 42,583, 10.7; seven others. Republican: Nunn, the 1963 nominee, 90,216, 50.4; Marlow Cook, Jefferson County judge, 86,397, 48.3.'
        n: '[Ky. *Statement of the Official Vote*, Democratic primary, May 23, 1967](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf#page=1); [Republican](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf#page=2). [[w.harrison-new-history-of-kentucky]], 413; [[w.peirce-border-south-states]]. Names: Ward, Chandler, Waterfield, Nunn, Cook.'
        tags: [state:ky, name:ward-henry, name:chandler-a-b, name:waterfield-harry-lee, name:nunn-louie-b, name:cook-marlow-w]
  - add:
      entry:
        id: cal.1967-11-07.governors-ky
        when: Nov. 7
        date: '1967-11-07'
        thread: governors
        also: [elections-1967]
        c: 'Kentucky. Nunn (R) elected governor over Ward (D), 454,123 to 425,674, 51.2 percent; a third candidate 7,149. The first Republican governor elected since 1943. Chandler had endorsed Nunn. The Democrats keep the lieutenant governorship and the General Assembly.'
        n: '[Ky. *Statement of the Official Vote*, general election, Nov. 7, 1967](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf#page=6). [[w.harrison-new-history-of-kentucky]], 413–14. See [[cal.1967-05-23.governors-ky]]. Names: Nunn, Ward, Chandler.'
        tags: [state:ky, name:nunn-louie-b, name:ward-henry, name:chandler-a-b]
  - add:
      entry:
        id: cal.1967-04-11.open-housing-louisville
        when: Apr. 11
        date: '1967-04-11'
        thread: open-housing
        c: 'Louisville. The Board of Aldermen, Republican, defeats an open housing ordinance, 9–3, over Mayor Schmied''s appeal; no further action, its majority says, until the city is calm. Marches downtown that night, and through April and May.'
        n: '*Kentucky Kernel*, Apr. 12, 1967 ([ExploreUK](https://exploreuk.uky.edu/catalog/xt7xwd3pzn0m)); Check: the Board''s journal. [[w.kmeyer-civil-rights-in-the]]. Names: Schmied.'
        tags: [state:ky, city:louisville, name:schmied-kenneth-a]
  - add:
      entry:
        id: cal.1967-12-13.open-housing-louisville
        when: Dec. 13
        date: '1967-12-13'
        thread: open-housing
        also: [mayors, elections-1967]
        c: 'Louisville. The Board of Aldermen, Democrats elected Nov. 7 on a promise to pass it, adopts an open housing ordinance, 9–3: a fine of $100 for refusing to sell or rent for race, religion or national origin; owner-occupied buildings of four units or fewer exempt. Mayor Schmied neither signs nor vetoes it; it takes effect without him.'
        n: 'Ordinance No. 4522, Series 1967 (a copy, [Ivan Allen Jr. mayoral records](https://ivanallen.iac.gatech.edu/mayoral-records/traditional/items/show/2286)); [*Carolina Times*, Dec. 23, 1967](https://newspapers.digitalnc.org/lccn/sn83045120/1967-12-23/ed-1/seq-1/). Check: the date of the vote. See [[cal.1967-04-11.open-housing-louisville]]. Names: Schmied.'
        tags: [state:ky, city:louisville, name:schmied-kenneth-a]
  # ---------------------------------------------------------------- Tennessee
  - add:
      entry:
        id: cal.1967-05-17.states-and-cities-tn
        when: May 13–17
        date: '1967-05-13'
        thread: states-and-cities
        also: [desegregation-schools]
        c: 'Tennessee repeals the Butler Act of 1925, which forbade teaching that man descended from a lower order of animals: passed May 13, approved by Ellington May 17, in force Sept. 1. Gary Scott, a teacher at Jacksboro, Tenn., dismissed under it, had sued in federal court at Nashville.'
        n: 'Tenn. Pub. Acts 1967, ch. 237 (H.B. 48), [text](http://law2.umkc.edu/faculty/projects/ftrials/scopes/tennstat.htm). [Wikipedia, "Butler Act"](https://en.wikipedia.org/wiki/Butler_Act). [[w.larson-summer-for-the-gods]]. Names: Ellington.'
        tags: [state:tn, name:ellington-buford]
  - add:
      entry:
        id: cal.1967-11-02.mayors-memphis
        when: Nov. 2
        date: '1967-11-02'
        thread: mayors
        also: [elections-1967]
        c: 'Memphis, under the charter of 1966: Loeb, mayor 1960–63, elected mayor over Mayor Ingram in the runoff, Ingram with most of the Negro vote. First round, Oct. 5, seven candidates; State Representative A. W. Willis Jr., the first Negro to run, fourth. Three Negroes elected to the council of thirteen (Check).'
        n: '[Wikipedia, "Henry Loeb"](https://en.wikipedia.org/wiki/Henry_Loeb); NAACP, [*Analysis of Run-Off Election, November 2, 1967*](https://radar.auctr.edu/islandora/object/auc.076%3A1958). Check: the Shelby County Election Commission''s returns, and the date of the first round. [[w.honey-going-down-jericho-road]]. See [[cal.1966-11-08.states-and-cities-memphis]]. Names: Loeb, Ingram, Willis.'
        tags: [state:tn, city:memphis, name:loeb-henry, name:ingram-william-b, name:willis-a-w-jr]
  # ---------------------------------------------------------------- Maryland
  - add:
      entry:
        id: cal.1967-03-24.state-constitutions-md
        when: Mar. 24
        date: '1967-03-24'
        thread: state-constitutions
        c: 'Maryland. Agnew signs H.B. 28, the procedures for the constitutional convention: delegates elected without party designation June 13, the convention to open at Annapolis, Md., Sept. 12.'
        n: 'Agnew, [Statement on the Signing of House Bill 28](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--116.html), Mar. 24, 1967, 83 Archives of Maryland 116–17. [Archives of Maryland, "Constitutional Convention, 1967–1968"](https://www.msa.maryland.gov/msa/speccol/sc2600/sc2685/html/conv1967.html). [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-09-13.state-constitutions-md]]. Names: Agnew.'
        tags: [state:md, name:agnew-spiro-t]
  - add:
      entry:
        id: cal.1967-04-14.state-and-city-finance-md
        when: Apr. 14
        date: '1967-04-14'
        thread: state-and-city-finance
        c: 'Maryland. Agnew signs H.B. 378, the tax reform bill: a graduated income tax of 2 to 5 percent in place of the flat 3 percent.'
        n: 'Agnew, [Statement on Signing House Bill 378](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--148.html), Apr. 14, 1967, 83 Archives of Maryland 148. [[w.witcover-white-knight]]; [[w.coffey-spiro-agnew-and-the]]; [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-03-30.state-and-city-finance-md]]. Names: Agnew.'
        tags: [state:md, name:agnew-spiro-t]
  - add:
      entry:
        id: cal.1967-04-21.open-housing-md
        when: Apr. 21
        date: '1967-04-21'
        thread: open-housing
        also: [desegregation-public-places]
        c: 'Maryland. Agnew signs the open housing act, S.B. 237: no discrimination in the sale of new houses or the rental of new apartments in buildings of 12 units or more built after July 1, 1968; an owner reselling the house he lived in exempt. "A similar first," south of the Mason-Dixon line, to the public accommodations law. With it, S.B. 173, extending the public accommodations law. The same session repealed the law against interracial marriage. The act petitioned to referendum.'
        n: 'Agnew, [Statement on Signing Senate Bill 237 (Open Housing Bill) and Senate Bill 173](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--158.html), Apr. 21, 1967, 83 Archives of Maryland 158; [Statement on Open Housing Legislation](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--108.html), Mar. 17. The act: ch. 385, Acts of 1967 (*Maryland Manual*, 1969–70, [483](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000174/html/am174--483.html)). Check: the date of the miscegenation repeal. [[w.witcover-white-knight]]; [[w.coffey-spiro-agnew-and-the]]; [[w.durr-behind-the-backlash]]. Names: Agnew.'
        tags: [state:md, name:agnew-spiro-t]
  - add:
      entry:
        id: cal.1967-09-12.state-constitutions-md
        when: Sept. 12
        date: '1967-09-12'
        thread: state-constitutions
        c: 'Maryland''s constitutional convention opens at Annapolis: 142 delegates, elected June 13. Eney, chairman of the Constitutional Convention Commission, president. It sits until Jan. 10, 1968.'
        n: '[Archives of Maryland, "Constitutional Convention, 1967–1968"](https://www.msa.maryland.gov/msa/speccol/sc2600/sc2685/html/conv1967.html). Check: the convention''s *Proceedings* and the returns of June 13. [[w.callcott-maryland-and-america-1940]]. See [[cal.1967-03-24.state-constitutions-md]]. Names: Eney.'
        tags: [state:md, name:eney-h-vernon]
  - add:
      entry:
        id: cal.1968-01-10.state-constitutions-md
        when: Jan. 10
        date: '1968-01-10'
        thread: state-constitutions
        c: 'Maryland''s constitutional convention adjourns, its constitution to go to the voters May 14 (Check the vote on adoption).'
        n: '[Archives of Maryland, "Constitutional Convention, 1967–1968"](https://www.msa.maryland.gov/msa/speccol/sc2600/sc2685/html/conv1967.html). See [[cal.1967-09-12.state-constitutions-md]].'
        tags: [state:md]
  - add:
      entry:
        id: cal.1967-11.mayors-baltimore
        when: Nov.
        date: '1967-11'
        thread: mayors
        also: [elections-1967]
        c: 'Baltimore. Thomas D''Alesandro III, president of the City Council, son of the mayor of 1947–59, elected mayor over Arthur W. Sherwood (R), 138,938 to 28,528, 83.0 percent, carrying every precinct. McKeldin (R) not running. Democratic primary: D''Alesandro 91,965, 75.0; Angelos, once a councilman, 30,641. Sworn Dec. 5.'
        n: 'Votes: [Wikipedia, "1967 Baltimore mayoral election"](https://en.wikipedia.org/wiki/1967_Baltimore_mayoral_election), from Our Campaigns. Check: the dates of the primary and the election (Wikipedia gives Nov. 2), and the Board of Supervisors of Elections'' returns. [[w.durr-behind-the-backlash]]. Names: D''Alesandro, Angelos, McKeldin.'
        tags: [state:md, city:baltimore, name:dalesandro-thomas-iii, name:angelos-peter-g, name:mckeldin-theodore-r]
  # ---------------------------------------------------------------- District of Columbia
  - add:
      entry:
        id: cal.1967-06-19.desegregation-schools-dc
        when: June 19
        date: '1967-06-19'
        thread: desegregation-schools
        also: [states-and-cities]
        c: 'Washington. Judge Wright, sitting in the District Court: the track system, the neighborhood school zones and the assignment of teachers deny Negro and poor children equal educational opportunity. The tracks abolished; optional zones ended; busing to relieve crowding; faculty to be integrated; plans due Oct. 2. The Board of Education votes 6–2 not to appeal and orders Superintendent Hansen not to; Hansen resigns and appeals (Check the dates).'
        n: '*Hobson v. Hansen*, [269 F. Supp. 401](https://static.case.law/f-supp/269/case-pdfs/0401-01.pdf) (D.D.C. 1967). [Wikipedia, "Hobson v. Hansen"](https://en.wikipedia.org/wiki/Hobson_v._Hansen). [[w.asch-chocolate-city]]; [[w.jaffe-dream-city]]. Names: Wright, Hansen.'
        tags: [state:dc, city:washington, name:wright-j-skelly, name:hansen-carl-f]
  # ---------------------------------------------------------------- Virginia
  - add:
      entry:
        id: cal.1967-11-07.legislatures-va
        when: Nov. 7
        date: '1967-11-07'
        thread: legislatures
        also: [elections-1967, voting-rights]
        c: 'Virginia, the General Assembly. William Ferguson Reid, a Richmond surgeon, a founder of the Richmond Crusade for Voters, elected to the House of Delegates, the first Negro in the Assembly since 1891; a segregationist delegate unseated. Takes his seat in January.'
        n: '[Wikipedia, "William Ferguson Reid"](https://en.wikipedia.org/wiki/William_Ferguson_Reid), from the State Board of Elections'' *Statement of the Vote*, Nov. 7, 1967. Check: [the State''s historical database](https://historical.elections.virginia.gov/) for his district and vote. [[w.atkinson-dynamic-dominion]]; [[w.heinemann-harry-byrd-of-virginia]]. Names: Reid.'
        tags: [state:va, city:richmond, name:reid-william-ferguson]
  # ---------------------------------------------------------------- Florida
  - add:
      entry:
        id: cal.1967-01.crime-and-hijacking-fl
        when: Jan.
        date: '1967-01'
        thread: crime-and-hijacking
        also: [states-and-cities]
        c: 'Florida. Kirk, sworn Jan. 3, the first Republican governor since Reconstruction, opens a "war on crime," hiring the Wackenhut Corporation, a private detective agency: a contract of $500,000 (Check). The ties cut in April (Check).'
        n: '[Wikipedia, "Wackenhut"](https://en.wikipedia.org/wiki/Wackenhut). Check: the contract and the legislature''s inquiry. [[w.kallina-claude-kirk-and-the]]; [[w.colburn-floridas-gubernatorial-politics-in]]. See [[cal.1966-11-08.governors-fl]]. Names: Kirk.'
        tags: [state:fl, name:kirk-claude-r-jr]
  - add:
      entry:
        id: cal.1967-05-12.states-and-cities-fl
        when: May 12
        date: '1967-05-12'
        thread: states-and-cities
        c: 'Florida. Kirk signs the act creating the Reedy Creek Improvement District, for the Walt Disney Company''s land southwest of Orlando: a district with powers of its own over planning, building codes, roads, water, drainage and utilities, governed by its landowners; two cities within it.'
        n: 'Laws of Fla. 1967, [ch. 67-764](https://edocs.dlis.state.fl.us/fldocs/leg/actsflorida/1967/LOF1967V1Pt2Ch0614-1068.pdf) (Check: the bill). [[w.kallina-claude-kirk-and-the]]. See [[cal.1967-01.crime-and-hijacking-fl]]. Names: Kirk.'
        tags: [state:fl, name:kirk-claude-r-jr]
  - add:
      entry:
        id: cal.1967-08-30.mayors-miami
        when: Aug. 30–31
        date: '1967-08-30'
        thread: mayors
        c: 'Miami. Mayor High, in office since 1957, the Democratic nominee for governor in 1966, dies at 43. Aug. 31, Commissioner Stephen P. Clark succeeds him.'
        n: '[Wikipedia, "Robert King High"](https://en.wikipedia.org/wiki/Robert_King_High); [Wikipedia, "Stephen P. Clark"](https://en.wikipedia.org/wiki/Stephen_P._Clark). Check: the City Commission''s minutes. [[w.colburn-floridas-gubernatorial-politics-in]]; [[w.dunn-black-miami-in-the]]. See [[cal.1966-11-08.governors-fl]]. Names: High, Stephen Clark.'
        tags: [state:fl, city:miami, name:high-robert-king, name:clark-stephen-p]
  - add:
      entry:
        id: cal.1967-12-26.crime-and-hijacking-miami
        when: Dec. 26
        date: '1967-12-26'
        thread: crime-and-hijacking
        also: [civil-disorders]
        c: 'Miami. Police Chief Headley announces patrols of shotguns and dogs in the Negro districts against "young hoodlums": "When the looting starts, the shooting starts." "We don''t mind being accused of police brutality."'
        n: 'AP, "Big City Police Deciding to Be Tough on Rioters Next Summer," [*San Bernardino Sun*, Dec. 30, 1967](https://cdnc.ucr.edu/?a=d&d=SBS19671230.1.2). Check: the second quotation. [[w.dunn-black-miami-in-the]]. Names: Headley.'
        tags: [state:fl, city:miami, name:headley-walter-e]
  # ---------------------------------------------------------------- Texas
  - add:
      entry:
        id: cal.1967-11-10.governors-tx
        when: Nov. 10
        date: '1967-11-10'
        thread: governors
        also: [elections-1968]
        c: 'Texas. Connally: he does not "intend to be a candidate for reelection," after eight years of public service; no fourth term. The race for 1968 opens.'
        n: '[*The Battalion* (Texas A&M), Nov. 10, 1967, 1](https://newspaper.library.tamu.edu/lccn/sn86088544/1967-11-10/ed-1/seq-1.pdf). Check: the day of the announcement. [[w.reston-lone-star]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1966-05-07.governors-tx]]. Names: Connally.'
        tags: [state:tx, name:connally-john]
  - add:
      entry:
        id: cal.1967-11-11.state-constitutions-tx
        when: Nov. 11
        date: '1967-11-11'
        thread: state-constitutions
        also: [state-and-city-finance]
        c: 'Texas adopts six amendments: the Veterans'' Land Fund''s bonds raised to $400 million, 58.7 percent; a Texas Park Development Fund and its bonds, 54.7; counties to pay medical expenses of officers hurt on duty, 65.4; counties to put their taxes in one general fund, 50.3; and two others.'
        n: 'Texas Legislative Council, [*Amendments to the Texas Constitution Since 1876*](https://tlc.texas.gov/docs/amendments/Constamend1876.pdf) (2026), art. 3, §§ 49-b, 49-e, 52e; art. 8, § 9; art. 9, § 13; art. 16, § 33. Check: the Secretary of State''s canvass. [[w.reston-lone-star]]. See [[cal.1966-11-08.state-constitutions-tx]].'
        tags: [state:tx]
  # ---------------------------------------------------------------- Arkansas
  - add:
      entry:
        id: cal.1967-02-14.states-and-cities-ar
        when: Feb. 14
        date: '1967-02-14'
        thread: states-and-cities
        also: [press-and-broadcasting]
        c: 'Arkansas. Winthrop Rockefeller, inaugurated Jan. 10, the first Republican governor since Reconstruction, signs the Freedom of Information Act: public records open to any citizen, meetings of public bodies open.'
        n: 'Ark. Acts 1967, No. 93 (Ark. Code Ann. § 25-19-101 et seq.). [Encyclopedia of Arkansas, "Arkansas Freedom of Information Act"](https://encyclopediaofarkansas.net/entries/arkansas-freedom-of-information-act-4599/). [[w.urwin-agenda-for-reform]]; [[w.ward-arkansas-rockefeller]]. See [[cal.1966-11-08.governors-ar]]. Names: Winthrop Rockefeller.'
        tags: [state:ar, name:rockefeller-winthrop]
  # ---------------------------------------------------------------- Oklahoma
  - add:
      entry:
        id: cal.1967-07-11.state-constitutions-ok
        when: July 11
        date: '1967-07-11'
        thread: state-constitutions
        c: 'Oklahoma, special election, after the bribery of the Supreme Court: a new judicial article, the justices of the peace abolished, judges elected without party, 90,167 to 73,919; the justices of the Supreme Court and the Court of Criminal Appeals chosen from a Judicial Nominating Commission''s names and kept by retention votes, 86,183 to 79,280.'
        n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 71](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=71) (State Questions 447, 448). [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1965-01-21.states-and-cities-ok]].'
        tags: [state:ok]
