      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 957–958 (Feb. 3, 1967; the big-character poster of Zhou''s secretaries, doctors, nurses, attendants, guards, cooks and drivers on his office door; Ye Jianying 叶剑英, Chen Yi 陈毅, Li Xiannian 李先念 and Nie Rongzhen 聂荣臻 sign it)'
