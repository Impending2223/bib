      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 978 (the sixth group''s siege of Ye Jianying 叶剑英, Oct. 17, 1968)'
  - add:
      entry:
        id: cal.1968-10-18.china-leadership-3
        when: Oct. 18
        date: '1968-10-18'
        thread: china-leadership
        c: Ye Jianying 叶剑英 hands the sixth group of the Twelfth Plenum 八届十二中全会第六小组 his written self-criticism, forced to "examine" his "errors" toward the Central Cultural Revolution Group 中央文革 and in handling the Qinghai 青海 incident and the Chengdu 成都 question.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 978. Made public: 2007. Names: Ye Jianying.'
