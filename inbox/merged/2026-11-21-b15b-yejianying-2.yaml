      id: cal.1969-01-03.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 980 (Jan. 3, 1969; Mao''s comment on a paper: all the old comrades tied to the "February adverse current" 二月逆流, and their families, not to be criticized; relations to be mended)'
  - add:
      entry:
        id: cal.1969-01-05.china-leadership
        when: Jan. 5, about
        date: '1969-01-05'
        thread: china-leadership
        c: 'Huang Yongsheng 黄永胜, Wu Faxian 吴法宪 and Li Zuopeng 李作鹏 come to Ye Jianying''s 叶剑英 residence and relay Mao Zedong''s 毛泽东 comment of Jan. 3; before Ye they tell his secretaries: the Chairman 主席 has commented; your criticism of the old marshal stops here; never mind the criticism outside; get on with your work. To Ye: you must take it rightly.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 980. Made public: 2007. Names: Huang Yongsheng, Wu Faxian, Li Zuopeng, Ye Jianying, Mao Zedong. Check: the day: the book has "about Jan. 5" 1月5日前后.'
