      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 985 (Lin Biao''s "Emergency directive on strengthening war readiness and preventing surprise attack by the enemy" 《关于加强战备，防止敌人突然袭击的紧急指示》, by this book of Oct. 17, 1969; on the 18th Huang Yongsheng 黄永胜 and others issue it as "Vice-Chairman Lin''s Order No. 1"; the whole army on emergency alert; about then, by Mao''s view and the Center''s plan, some Party and state leaders in Peking, many organs and cadres'' families "evacuated for war readiness")'
