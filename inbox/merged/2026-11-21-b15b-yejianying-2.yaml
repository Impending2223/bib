  - cite:
      id: cal.1969-10-17.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 985–986 (Oct. 17, 1969; after the display Ye Jianying 叶剑英 with Dong Biwu, Zhu De, Chen Yun, Chen Yi, Deng Zihui 邓子恢, Li Fuchun, Zhang Dingcheng 张鼎丞 and others at the meeting Zhou calls in the gymnasium''s rest room; Zhou announces Mao''s and the Center''s decision on war-readiness evacuation, some old comrades to leave Peking on the 20th or a little later, Mao naming each one''s place, Zhou to telephone the arrangements, the General Office to ready special planes or trains: Dong Biwu, Zhu De and Ye Jianying to Guangdong 广东, Chen Yun and Wang Zhen 王震 to Jiangxi 江西, Chen Yi to Kaifeng 开封 in Henan, Nie Rongzhen to Zhengzhou 郑州, Xu Xiangqian to Shijiazhuang 石家庄; later changed: Ye to Hunan 湖南, Chen Yi to Shijiazhuang, Xu to Kaifeng, Nie to Handan 邯郸 in Hebei)'
