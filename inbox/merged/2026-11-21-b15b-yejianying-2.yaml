      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 981 (Mar. 22, 1969; afternoon; Ye Jianying 叶剑英 at Mao''s; Mao: you old comrades must work for the country, not a single department; Nie Rongzhen not only the Defense Science Commission, Ye Jianying not only the Academy of Military Science; military, political, domestic and foreign matters; the "little turnip-heads" look down on you as old and useless; "I don''t agree"; Mao on the border clashes and the Ninth Congress)'
  - cite:
      id: cal.1969-03-18.china-leadership-2
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 982 (Mar. 29, 1969; Ye Jianying 叶剑英, from the forum''s discussions, draws up the report "Looking at a Zhenbao tree from the world''s forest" 《从世界的森林看一棵珍宝树》; checked by Chen Yi 陈毅, Xu Xiangqian 徐向前 and Nie Rongzhen 聂荣臻, it goes to Mao and the Center under the four names: the causes, aims and course of the Soviet incursion on Zhenbao Island 珍宝岛, the American and Soviet bids for world hegemony and their contradictions with other countries; proposals on the militia, training and military production)'
