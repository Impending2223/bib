  - add:
      entry:
        id: cal.1968-08.china-leadership-9
        when: Aug., mid- to late
        date: 1968-08
        at: before 1968-08-11
        place: peking
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 and Nie Rongzhen 聂荣臻, in the Western Hills 西山, Peking 北京, talk together again and again: the students'' and rebels'' criticism and "bombardment" of the old marshals and many old comrades grows ever louder; why does the Center 中央 not speak out and protect them? We can no longer run anything, only close the door and read.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 977. Made public: 2007. Names: Ye Jianying, Nie Rongzhen.'
