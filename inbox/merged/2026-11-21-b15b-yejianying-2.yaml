  - cite:
      id: cal.1968-03-24.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 975–976 (Mar. 24, 1968; evening; the Great Hall of the People; Ye Jianying 叶剑英 with Chen Yi 陈毅 and others at the meeting of army cadres of regiment level and above, seated below the platform; Lin Biao announces the three men''s "errors": Yang Chengwu and Yu Lijin plotting to seize the Air Force and bring down Wu Faxian 吴法宪, Yang and Fu Chongbi to bring down Xie Fuzhi; four meetings at the Chairman''s; Kang Sheng: Yang has a "black backer"; after it, inside and outside the army, a wind to seize the "black backer of Yang, Yu and Fu", Ye Jianying, Chen Yi, Xu Xiangqian, Nie Rongzhen, Li Fuchun and Li Xiannian its chief targets)'
  - cite:
