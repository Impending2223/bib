  - add:
      entry:
        id: cal.1969-10.china-leadership-17
        when: Oct., after the 20th
        date: 1969-10
        at: after 1969-10-20
        thread: china-leadership
        c: 'Lin Biao''s 林彪 people pass word down the army: Ye Jianying 叶剑英 is the "February adverse current''s" 二月逆流 chief, an "old rightist," to be kept at a distance. Some heads of the Canton Military Region 广州军区 and the Hunan Military District 湖南省军区 treat him coldly, and he meets many difficulties in daily life. Li Yuan 黎原 and Li Zhenjun 李振军, heads of an army stationed in Hunan 湖南, its security section''s Zhao Fuhe 赵福和, the guard platoon leader Hu Jiahu 胡家虎, and Zhao Yunhong 赵云宏, head of the First Military Medical University 第一军医大学 then at Changsha 长沙, look after him as they can, through his difficulties of daily life and illness.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 986. Made public: 2007. Names: Lin Biao, Ye Jianying.'
        tags:
        - polity:prc
        - name:lin-biao
        - name:ye-jianying
        - vis:only:prc
        - ok:fields-place
