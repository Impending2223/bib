  - cite:
      id: cal.1968-10-31.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 978–979 (Oct. 31, 1968; the plenum closes, approving the report on Liu Shaoqi''s "crimes", written by Jiang Qing, Kang Sheng, Xie Fuzhi and others on false evidence, expelling him for ever, deciding to convene the Ninth Congress, adopting the draft constitution; Mao at the closing on the "February adverse current": a big thing and not so very great; they spoke openly, as Politburo members, vice-premiers and vice-chairmen of the Military Commission, as Party life allows; leaving them out of the Ninth Congress a shortcoming; old comrades: "criticize first, protect second, watch third")'
  - add:
      entry:
        id: cal.1968-11.china-leadership-9
        when: Nov., after the plenum
        date: 1968-11
        at: before 1968-11-01
        thread: china-leadership
        c: After the Twelfth Plenum 八届十二中全会 Ye Jianying 叶剑英 is stripped of the power to work; documents almost all stopped to him; his life put under many restrictions.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 979. Made public: 2007. Names: Ye Jianying.'
