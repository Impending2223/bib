        - vis:only:prc
  - cite:
      id: cal.1967-01-24.china-leadership-3
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956–957 (Jan. 24, 1967; evening; Xu Xiangqian 徐向前, Ye Jianying 叶剑英 and Nie Rongzhen 聂荣臻 go in turn to Lin Biao''s 林彪 residence at Maojiawan 毛家湾 and tell him why the army cannot be left in disorder; Lin dictates a draft order of nine articles)'
  - place:
      id: cal.1967-01-24.china-leadership-3
      at: peking
      basis: n
      note: 'the Ye Jianying nianpu: Lin Biao''s residence at Maojiawan'
  - cite:
      id: cal.1967-01-24.china-leadership-4
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 957 (Jan. 24, 1967; that night 连夜 Xu, Ye Jianying 叶剑英 and Nie take Lin''s draft of nine articles to the Diaoyutai 钓鱼台 to discuss with the Cultural Revolution Group, Zhou Enlai 周恩来 and Chen Yi 陈毅 taking part; the Group rejects two articles (the movement in the army led by the Party committees; no fighting bodies across systems, trades and units) and accepts seven)'
  - cite:
      id: cal.1967-01-25.china-leadership-5
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 957 (after the Diaoyutai discussion of Jan. 24, 1967, Lin Biao sends the draft to Mao)'
  - cite:
      id: cal.1967-01-28.china-leadership-2
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 957 (Jan. 28, 1967; before dawn 凌晨; Ye Jianying 叶剑英 at the liaison meeting Zhou Enlai 周恩来 chairs in Building 16 of the Diaoyutai 钓鱼台十六号楼, Politburo and Cultural Revolution Group members attending, on the Military Commission''s draft order)'
  - place:
      id: cal.1967-01-28.china-leadership-2
      at: peking
      basis: n
      note: 'the Ye Jianying nianpu: Building 16 of the Diaoyutai'
  - cite:
      id: cal.1967-01-28.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 957 (Jan. 28, 1967; afternoon; Ye Jianying 叶剑英 with Zhou Enlai 周恩来, Xu Xiangqian 徐向前 and Nie Rongzhen 聂荣臻 at Zhongnanhai 中南海 reporting the draft to Mao, who adds an article: cadres, senior cadres above all, to discipline their children; the same day Mao: "the eight articles fixed are very good; issue")'
  - place:
      id: cal.1967-01-28.china-leadership
      at: peking
      basis: n
      note: 'the Ye Jianying nianpu: Zhongnanhai'
  - cite:
      id: cal.1967-01-31.china-leadership-4
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 957 (Jan. 31, 1967; Ye Jianying 叶剑英 with Zhou Enlai 周恩来 receiving the delegates of army schools, arts troupes, hospitals and military factories; Zhou explains the eight articles)'
  - cite:
      id: cal.1967-01-31.china-leadership-7
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 957 (Jan. 31, 1967; on Zhou Enlai''s 周恩来 instruction Ye Jianying 叶剑英 arranges for Qin Jiwei 秦基伟, commander of the Kunming Military Region 昆明军区, to be brought to Peking 北京 for treatment)'
  - add:
