      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 961 (Feb. 25–Mar. 18, 1967; Ye Jianying 叶剑英 at the seven "political life criticism meetings" 政治生活批评会 in the Huairen Hall 怀仁堂, at which Jiang Qing 江青, Kang Sheng 康生, Chen Boda 陈伯达, Xie Fuzhi 谢富治 and others besiege and struggle Chen Yi, Tan Zhenlin, Xu Xiangqian, Ye Jianying and others for a "bourgeois restoration countercurrent" 资产阶级复辟逆流 (later the "February countercurrent" 二月逆流) and force their self-criticisms; the Politburo then stops meeting, the Group in effect taking its place)'
  - add:
      entry:
        id: cal.1967-02-26.china-leadership-3
        when: Feb. 26–Mar. 25
        date: '1967-02-26'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 presides at the all-army conference of cadres of army rank and above 全军军以上干部会议: the army''s help to spring plowing, military training of college and middle-school teachers and students, the seizures of power. At its preparatory meeting and in the groups he asks the cadres to set aside their worries and tell the troops'' true state (positive education, training, the "three supports and two militaries" 三支两军, relations with the localities, organs stormed and the counterstorms); later several speeches: the Party 党, government 政府, army 军队 and cadres at every level not to be denied wholesale; to act by Chairman Mao''s 毛主席 strategy 战略部署, not rashly; unity and discipline in the army; war readiness.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 961–962. At the conference, by this page, Zhou Enlai 周恩来 speaks twice (industry, military control, spring plowing); Chen Boda 陈伯达 and Kang Sheng 康生 attack Liu Shaoqi 刘少奇 by name; Lin Biao 林彪 speaks. Made public: 2007. Names: Ye Jianying, Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Liu Shaoqi, Lin Biao.'
