        when: Nov. 2
        date: '1968-11-02'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 visits Nie Rongzhen 聂荣臻, in the PLA General Hospital 解放军总医院 with a high fever; not let see him, he tells Nie''s wife Zhang Ruihua 张瑞华 by telephone: tell Marshal Nie I trust myself and I trust him; we are not men who plot.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 979. Made public: 2007. Names: Ye Jianying, Nie Rongzhen.'
        tags:
        - polity:prc
