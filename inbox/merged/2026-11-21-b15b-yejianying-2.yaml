        c: 'Ye Jianying 叶剑英, in a speech, on the storm of seizures of power across the country: the Cultural Revolution 文化大革命 "first smashes the Party''s organs 党的机关, then the government 政府, then the Liberation Army 解放军!"'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 957. Made public: 2007. Names: Ye Jianying.'
        tags:
