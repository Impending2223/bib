      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 980 (Jan. 25, 1969; at the Capital Gymnasium 首都体育馆, Ye Jianying 叶剑英 at Mao''s reception of the PLA commanders and fighters in the Mao Zedong Thought study classes, the delegates to several army conferences, the members of the study class of the Defense Science Commission 国防科委 and the Seventh Ministry of Machine Building 七机部, and the delegates to some special conferences)'
  - cite:
      id: cal.1969-02-19.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 980–981 (Feb. 19, 1969; afternoon; Ye Jianying 叶剑英 at Mao''s with Lin Biao, Zhou, the members of the Cultural Revolution Group''s liaison meeting, Li Fuchun, Li Xiannian, Chen Yi, Xu Xiangqian and Nie Rongzhen; Mao wants Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying to squat in factories for investigation and to study international questions; the book: in early February, on Zhou''s proposal and with Mao''s approval, the idle old marshals and old comrades sent to factories, Ye to the Peking Xinhua Printing Plant 北京新华印刷厂)'
  - add:
      entry:
        id: cal.1969-02.china-leadership-14
        when: Feb., early, to Oct.
        date: 1969-02
        at: before 1969-02-11
        place: peking
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 "squats" 蹲点 at the Peking Xinhua Printing Plant 北京新华印刷厂, Peking 北京, two days a week, working, taking the workers'' "re-education" and investigating; attends the meetings of the workers'' "struggle, criticism, transformation" 斗、批、改 study class; with Chen Yun 陈云, Tan Qilong 谭启龙, Huang Huoqing 黄火青, Yang Shangkui 杨尚奎 and Huo Shilian 霍士廉, squatting there too, holds over ten forums to learn from the workers: the plant''s history before 1949, its seventeen years to the Cultural Revolution, its three years of Cultural Revolution 文化大革命, its plant and capacity, the great alliance and three-in-one, the revolutionary committee, the cleansing of class ranks, Party and League rectification 整党、整团, workers'' families, earmarked funds, Mao Zedong Thought 毛泽东思想 and apprentices.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 980–981. Made public: 2007. Names: Ye Jianying, Chen Yun.'
        tags:
        - polity:prc
        - name:ye-jianying
        - name:chen-yun
        - vis:only:prc
