  - cite:
      id: cal.1969-06-07.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 982–983 (June–Oct. 1969; Ye Jianying 叶剑英, Chen Yi 陈毅, Xu Xiangqian 徐向前 and Nie Rongzhen 聂荣臻 hold over twenty forums on the international situation and strategy in Zhongnanhai 中南海; Ye, in many speeches, urges using the contradictions among the United States, the Soviet Union and Europe to break the Sino-American deadlock soon and resume the Sino-American talks 中美会谈: America must withdraw step by step from South Vietnam; the Soviet Union pushes an "Asian security system" 亚洲安全体系; Nixon tours five Asian countries for fear the Soviet Union will fill the "vacuum"; the State Department''s "two relaxations" 两个放宽, small steps, show Nixon''s new move to draw in China)'
