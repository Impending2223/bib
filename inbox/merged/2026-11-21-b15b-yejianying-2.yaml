  - cite:
      id: cal.1968-10-13.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 977–978 (Oct. 13, 1968; Ye Jianying 叶剑英 at the opening of the enlarged Twelfth Plenum of the Eighth Central Committee 中共八届扩大的十二中全会; Mao presides; Zhou gives the agenda: the Ninth Congress''s preparations, the Party constitution''s revision, the situation at home and abroad, the report on Liu Shaoqi''s case; Mao: the Cultural Revolution completely necessary and very timely)'
  - add:
      entry:
        id: cal.1968-10-17.china-leadership-5
        when: Oct. 17
        date: '1968-10-17'
        thread: china-leadership
        c: 'The sixth group of the enlarged Twelfth Plenum 八届扩大的十二中全会第六小组 besieges and criticizes Ye Jianying 叶剑英. He answers: he did not understand the movement, could not keep up, made too much of its side currents, had rightist ideas against the Cultural Revolution 文化大革命; but no link in organization with the others, only a sympathy of thought; his "tongue-lashing the scholars" 舌战群儒 meant Wang Li 王力, Guan Feng 关锋 and Qi Benyu 戚本禹; he opposed wild struggle of leading cadres to protect them; in Qinghai 青海, Chengdu 成都 and Wanxian 万县 he feared for the army. Many in the group, dissatisfied, attack him further, some risen from the workers to the leadership in ultra-left words.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 978. Made public: 2007. Names: Ye Jianying.'
        tags:
        - polity:prc
        - name:ye-jianying
        - vis:only:prc
        - ok:fields-place
