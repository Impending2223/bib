        at: before 1968-11-11
        thread: china-leadership
        c: Units across the country relay the enlarged Twelfth Plenum 中共扩大的八届十二中全会; a new tide of criticism of the "February adverse current" 二月逆流 rises, Ye Jianying 叶剑英 one of its chief targets.
