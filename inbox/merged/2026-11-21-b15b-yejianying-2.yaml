  - cite:
      id: cal.1967-01-01.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 954 (Jan. 1, 1967; the *Renmin ribao* 人民日报 and *Hongqi* 红旗 New Year editorial, revised by Mao)'
  - cite:
      id: cal.1967-01-02.china-leadership-3
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 954 (Jan. 2, 1967; Ye Jianying 叶剑英 at the Center''s liaison meeting 中央碰头会 Zhou Enlai 周恩来 chairs, on East China and the military training of college and middle-school students)'
  - cite:
      id: cal.1967-01-03.china-leadership-3
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 954 (Jan. 3 and 4, 1967; Zhou''s three talks, the Jan. 5 meeting aimed at Ye Jianying 叶剑英 and Chen Yi 陈毅)'
  - cite:
      id: cal.1967-01-06.china-leadership-3
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 954 (Jan. 6, 1967; the Shanghai 上海 rebels under Wang Hongwen 王洪文, planned by Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元)'
  - cite:
      id: cal.1967-01-11.china-leadership-2
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 954–955 (Jan. 11, 1967; Ye Jianying 叶剑英 at the Politburo: "the more disorder in the localities, the steadier the army must be"; seven of the thirteen military regions in the movement, and all 157 army schools; the General Logistics Department 总后 paralyzed, the General Political Department 总政 nearly so, the General Staff 总参 in part, the Navy and Air Force too; the Air Force''s command moved into war shelters; the meeting passes the notice against economism and the message to the Shanghai rebel bodies)'
  - cite:
      id: cal.1967-01-11.china-leadership-3
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 955 (Jan. 11, 1967; the Politburo meeting reorganizes the All-Army Cultural Revolution Group 全军文化革命小组: Xu Xiangqian 徐向前 head, Yang Chengwu 杨成武 and Xiao Hua 萧华 deputies)'
  - add:
      entry:
        id: cal.1967-01-11.china-leadership-11
        when: Jan. 11
        date: '1967-01-11'
        place: peking
        thread: china-leadership
        c: Capital Airport 首都机场, Peking 北京. Ye Jianying 叶剑英 welcomes the Albanian military delegation 阿尔巴尼亚军事代表团 led by Beqir Balluku 巴卢库.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 955. Names: Ye Jianying. Check: the *Waijiao dashiji* has the delegation''s visit from Jan. 10 ([[cal.1967-01-11.china-leadership-4]]).'
        tags:
        - polity:prc
        - name:ye-jianying
  - cite:
      id: cal.1967-01-11.china-leadership-4
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 955 (Jan. 11, 1967; evening; Ye Jianying 叶剑英 with Zhou at the meeting and banquet for the whole delegation)'
  - cite:
      id: cal.1967-01-13.china-leadership-3
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 955 (Jan. 13, 1967; Ye Jianying 叶剑英 at the Politburo meeting adopting the provisions on public security work)'
  - cite:
      id: cal.1967-01-14.china-leadership-4
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 955 (Jan. 14, 1967; after the fight of Ye Jianying 叶剑英, Xu Xiangqian 徐向前, Nie Rongzhen 聂荣臻 and others, with Zhou Enlai''s 周恩来 support)'
  - add:
      entry:
        id: cal.1967-01-16.china-leadership-8
        when: Jan. 16
        date: '1967-01-16'
        place: peking
        thread: china-leadership
        c: Huairen Hall 怀仁堂, Zhongnanhai 中南海, Peking 北京. Ye Jianying 叶剑英 at the Center's liaison meeting 中央碰头会 Zhou Enlai 周恩来 chairs; from it to Mao Zedong's 毛泽东 meeting in the Great Hall of the People 人民大会堂.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 955. Made public: 2007. Names: Ye Jianying, Zhou Enlai, Mao Zedong.'
        tags:
        - polity:prc
        - name:ye-jianying
        - name:zhou-enlai
        - name:mao-zedong
        - vis:only:prc
  - cite:
      id: cal.1967-01-16.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 955 (Jan. 16, 1967; Ye Jianying 叶剑英 at the meeting Mao Zedong 毛泽东 chairs in room 118 of the Great Hall of the People 人民大会堂一一八号, after Zhou''s liaison meeting at the Huairen Hall 怀仁堂: the left''s seizure of power good; takeover, running affairs, not business)'
  - place:
      id: cal.1967-01-16.china-leadership
      at: peking
      basis: n
      note: 'the Ye Jianying nianpu: room 118 of the Great Hall'
  - cite:
      id: cal.1967-01-19.china-leadership-9
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 955–956 (Jan. 19, 1967; Ye Jianying 叶剑英 at the enlarged liaison meeting of the Military Commission 军委扩大的碰头会议, against the Cultural Revolution Group''s 中央文革 call for the "four bigs" 四大 in the army: the army may not have them; the pillar of the dictatorship, heavy war-readiness duties; the Party''s absolute leadership; discipline; with the "four bigs", anarchy, and how could it fight?)'
  - cite:
      id: cal.1967-01-19.china-leadership-3
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 19, 1967; after the meeting Ye Jianying 叶剑英 reports it to Zhou Enlai 周恩来; Zhou''s telephone call on Jiang Qing''s 江青 and Chen Boda''s 陈伯达 rally of 100,000 that night: without my order Xiao Hua 萧华 not to go to it)'
  - cite:
      id: cal.1967-01-19.china-leadership-8
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 19, 1967; that night 当晚 rebels of the Peking Military Region''s Zhanyou troupe 北京军区战友文工团 and other units raid Xiao Hua''s 萧华 quarters; he flees by the back door to Ye Jianying''s 叶剑英 residence in the Western Hills 西山)'
  - cite:
      id: cal.1967-01-20.china-leadership-5
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 20, 1967; asked where Xiao Hua had hidden, Ye Jianying 叶剑英 rises and bangs the table: he came to me at midnight, I took him in, "if there is a crime of harboring, I bear it"; the blow breaks a bone of his right hand)'
  - cite:
      id: cal.1967-01-21.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 21, 1967; Mao''s comment to Lin Biao 林彪: the army to back the broad left masses, a new order to be issued, the earlier ones void)'
  - cite:
      id: cal.1967-01-23.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 23, 1967; the Center, State Council, Military Commission and Cultural Revolution Group issue the Decision that the PLA firmly supports the revolutionary left)'
  - cite:
      id: cal.1967-01-22.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 22, 1967; noon 中午; Ye Jianying 叶剑英 with Mao Zedong 毛泽东 in room 118 of the Great Hall of the People 人民大会堂一一八室, receiving those at the enlarged liaison meeting of the Military Commission; photographed together)'
  - add:
      entry:
        id: cal.1967-01-22.china-leadership-7
        when: Jan. 22
        date: '1967-01-22'
        time_range:
        - 1967-01-22T11:00Z
        - 1967-01-22T14:00Z
        time_band: evening
        time_zone: Asia/Shanghai
        place: peking
        thread: china-leadership
        c: 'Ye Jianying''s 叶剑英 residence in the Western Hills 西山, Peking 北京. Ye, Chen Yi 陈毅, Liu Bocheng 刘伯承 and Nie Rongzhen 聂荣臻 together: it cannot go on in such disorder; the army must have some limits.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956. The words: 晚 (956). Made public: 2007. Names: Ye Jianying, Chen Yi, Liu Bocheng, Nie Rongzhen.'
        tags:
        - polity:prc
        - name:ye-jianying
        - name:chen-yi
        - name:liu-bocheng
