        c: 'Ye Jianying 叶剑英 investigates at the Changsha 长沙 Shuguang electron tube plant 曙光电子管厂 and some basic units, on production and the workers'' lives, and on Hunan''s 湖南 broadcasting, noting in his work book: in 1960 the province''s 89 counties and cities had 6 city people''s radio stations, 765 commune broadcasting stations, over 4,000 km of broadcasting lines, 180,000 loudspeakers; in 1961 five of the six city stations and every commune station cut, 100,000 of the 180,000 speakers smashed, the 4,000 km of lines wrecked; no better by 1969, nearly 80 percent of the communes and production teams without a broadcasting station or wired broadcasting.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 986. Made public: 2007. Names: Ye Jianying.'
        tags:
