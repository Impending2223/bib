        (Senate, Aug. 11, 1967). [[w.palermo-in-his-own-right]], 57. See [[cal.1967-08-11.vietnam-congress]]. Names: Robert
        Kennedy, Javits, Pastore, Clark. Check: Palermo, 57, has "Candidates have been barred because their views were ''unacceptable''";
        the Record, "some because."'
