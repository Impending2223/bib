      c: 'Roche to Johnson, eyes only: the McCarthy campaign''s "three great assets": "inertia on the part of pro-Administration
        people," the "crusading zeal of the anti-war young," and "the organizational talents of the Communists and the hemi-demi-semi-Communists
        who have been out of circulation (and making money) since Henry Wallace." Invite Robert Kennedy "with due respect
        and plenty of publicity" to the meeting of New York Democrats for an administration slate. Johnson to Watson, 8:30
        p.m.: "get it done."'
      n: '[[w.palermo-in-his-own-right]], 131–32. To check: Roche to Johnson, Mar. 8, 1968, Watson Papers, LBJ Library (cited
        by [[w.palermo-in-his-own-right]], 131 n.6); Johnson to Watson, Mar. 8, 1968, 8:30 p.m., Watson Papers, LBJ Library
