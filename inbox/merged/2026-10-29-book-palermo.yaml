        them whip-sawed out there." Panzer to Johnson, 4 p.m., on an unreleased Gallup poll: "Of the two doves, Bobby is the
        one with the claws. He hurts far more than McCarthy." Watson with William S. White, 5:45 p.m.: Kennedy may ask McCarthy
        "if he wouldn''t rather be Secretary of State than United States Senator." Connally to Johnson, 8:30 p.m., passing
        on Hearnes: "If Bobby Kennedy gets into this, they will undermine you with your delegates. They will steal them or
        buy them."'
