      c: 'Robert Kennedy''s office, 3:30 to 4:15 p.m.: Kennedy, Walinsky and David Burke with Philip Heymann of State''s Bureau
        of Security and Consular Affairs, at Kennedy''s asking, on the prisoners in Vietnam. "Not enough is being done." Heymann:
        more than eighty held in the North, about twenty-seven by the Liberation Front; talks with it in the South "might
        result in some degree of recognition of the VC." Kennedy proposes a committee of the families with a lawyer to go
        to Vietnam, Staughton Lynd as intermediary, the Soviet Embassy, a third party as in the Cuban exchange; Heymann against
        each. By the memorandum of the conversation.'
      n: '[[w.palermo-in-his-own-right]], 33–34. To check: memorandum of conversation, "U.S. Prisoners in Hands of North Vietnam
        and Viet Cong," Apr. 14, 1966, Walinsky Papers, JFK Library (cited by [[w.palermo-in-his-own-right]], 33 n.3). Names:
        Robert Kennedy, Walinsky, Heymann, Lynd.'
