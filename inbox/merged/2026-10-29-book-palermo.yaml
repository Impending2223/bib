        the utility" of the trip to Europe; with this draft "trying to have it both ways." Walinsky, in his notes on it: it
        nowhere questions "any of the basic premises of the war."'
      n: '[[w.palermo-in-his-own-right]], 45–46. To check: Edelman to Robert Kennedy, Feb. 27, 1967, Walinsky Papers, JFK
        Library (cited by [[w.palermo-in-his-own-right]], 46 n.77); Walinsky to Robert Kennedy, n.d., Walinsky Papers, JFK
