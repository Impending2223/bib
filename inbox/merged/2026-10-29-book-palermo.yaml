      when: Feb. 8
      date: '1966-02-08'
      thread: robert-kennedy
      also:
      - vietnam
      c: 'Dutton to Robert Kennedy, against the trip to South Vietnam that Harriman, McNamara and Taylor urge on him: Vietnam
        "the indigestible lump in this country''s gut"; the invitation "an unconscious effort by McNamara, Taylor and Harriman
        to have you help pull their and President Johnson''s badly charred chestnuts out of a fire that they are all letting
        get out of control"; "a whole new mess." Let Fulbright and McCarthy "illuminate the problem," Kennedy then adding
        his support. Kennedy does not go.'
      n: '[[w.palermo-in-his-own-right]], 18–19. To check: Dutton to Robert Kennedy, Feb. 8, 1966, RFK Papers, JFK Library
        (cited by [[w.palermo-in-his-own-right]], 19 n.56). Names: Dutton, Robert Kennedy, Harriman, McNamara, Taylor, Johnson,
        Fulbright, Eugene McCarthy.'
