      c: 'Robert Kennedy, by hand, to Anthony Lewis in London: "everyone I respect with the exception of Dick Goodwin and
        Arthur Schlesinger have been against my running"; McNamara''s and Moyers''s "prophecies of future doom," the politicians''
        feeling his running would elect Nixon. "So once again—what should I do? By the time you read this letter both of us
        will know." Schlesinger to Kennedy the same day: stay out of the primaries, McCarthy now "the symbol of the opposition";
        he would "appear a spoiler, trying to run off with Gene''s marbles."'
      n: '[[w.palermo-in-his-own-right]], 134, 141–42. To check: Robert Kennedy to Anthony Lewis, Mar. 13, 1968, RFK Papers,
        JFK Library (cited by [[w.palermo-in-his-own-right]], 142 n.52); Schlesinger to Robert Kennedy, Mar. 13, 1968, RFK
        Papers, JFK Library (cited by [[w.palermo-in-his-own-right]], 134 n.21). See [[cal.1968-03-13.robert-kennedy]]. Names:
        Robert Kennedy, Anthony Lewis, Goodwin, Schlesinger, McNamara, Moyers, Nixon, McCarthy.'
