      - elections-1968
      c: 'Shepard, founder of Citizens for Kennedy, to Robert Kennedy: "You are fond of saying the hottest place in hell is
        reserved for those who fail to act in times of great moral crisis. With villages burning and men risking their lives
        daily in this obscene war, I don''t think it is asking too much of you to risk your political prestige by becoming
        an active Presidential candidate." The group to carry his banner in New Hampshire, Pennsylvania and South Dakota,
        his name on the ballot in Wisconsin, Oregon and Nebraska.'
      n: '[[w.palermo-in-his-own-right]], 92. To check: Shepard to Robert Kennedy, Jan. 22, 1968, RFK Papers, JFK Library
        (cited by [[w.palermo-in-his-own-right]], 92 n.81). See [[cal.1968-01-02.robert-kennedy]]. Names: Robert Kennedy.'
