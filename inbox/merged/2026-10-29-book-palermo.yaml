      c: 'Robert Kennedy, in a statement on the Watts commission''s report: a terrible mistake "to limit our efforts to the
        support of the war in Vietnam" and "postpone action on our pressing domestic needs"; to put the war first "would be
        to invite the very internal conflagration of which we have been warned—to invite a society so irretrievably split
        that no war will be worth fighting, and no war will be possible to fight."'
      n: '[[w.palermo-in-his-own-right]], 15. To check: Robert Kennedy, press release, Dec. 16, 1965, RFK Papers, JFK Library
        (cited by [[w.palermo-in-his-own-right]], 15 n.33). Names: Robert Kennedy.'
