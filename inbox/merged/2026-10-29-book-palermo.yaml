        LBJ Library (cited by [[w.palermo-in-his-own-right]], 43 n.63); Rostow to Johnson, Feb. 7, 1967, Daily Diary Backup,
        LBJ Library (cited by [[w.palermo-in-his-own-right]], 44 n.64). See [[cal.1967-02-06.robert-kennedy]]. Names: Rostow,
        Johnson, Sidey.'
