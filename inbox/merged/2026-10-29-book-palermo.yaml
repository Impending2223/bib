      c: 'Robert Kennedy in the Senate, after Javits, on South Vietnam''s elections: "There is mounting and distressing evidence
        of efforts to interfere with the free choice of the people"; candidates barred, prisoners whose only offense is opposition,
        the press censored, the military government "moving to perpetuate its power, regardless of the voting." "Our commitment
        is to the Vietnamese people—not to any government, not to any generals, not to the powerful and privileged few." Pastore:
        "Bombs are no substitute for ballots." Clark: the election "close to a fraud."'
