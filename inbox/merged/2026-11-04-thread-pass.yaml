    after: cal.thread.elections-1960-count
- add:
    entry:
      id: cal.thread.elections-1960-nomination
      s: Democratic nomination
      parent: elections-1960
      c: 'The race for the Democratic nomination outside the primaries: Johnson, Symington, the Stevenson draft, Truman, the
        delegations and their counts, the talk of second place, to Los Angeles.'
