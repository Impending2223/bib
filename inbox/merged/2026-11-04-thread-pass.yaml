patch: thread-pass
by: Claude (thread pass, volume.md section 2), for the owner to rule; not merged
ops:
- add:
    entry:
      id: cal.thread.missile-crisis-anadyr
      s: Anadyr
      parent: missile-crisis
      c: 'The Soviet operation: the Presidium''s decisions, the forces, missiles and warheads sent to Cuba, the submarines,
        the Cubans'' part, and the warheads'' withdrawal.'
    section: th
    after: cal.thread.missile-crisis
- add:
    entry:
      id: cal.thread.missile-crisis-diplomacy
      s: Diplomacy
      parent: missile-crisis
      c: The letters between Kennedy and Khrushchev, the United Nations, the OAS and the allies, and the back channels, from
        the address to the broadcast.
    section: th
    after: cal.thread.missile-crisis-anadyr
- add:
    entry:
      id: cal.thread.missile-crisis-excomm
      s: ExComm
      parent: missile-crisis
      c: 'The President and his advisers in Washington from the photographs to Khrushchev''s broadcast: the Executive Committee''s
        meetings, the choice of the quarantine, the address, the briefings of the leaders and the former Presidents.'
    section: th
    after: cal.thread.missile-crisis-diplomacy
- add:
    entry:
      id: cal.thread.missile-crisis-quarantine
      s: Quarantine
      parent: missile-crisis
      c: 'The quarantine at sea and the forces'' alert: the proclamation, the ships stopped, turned or boarded, the submarines,
        the reconnaissance, the reserves.'
    section: th
    after: cal.thread.missile-crisis-excomm
- add:
    entry:
      id: cal.thread.missile-crisis-settlement
      s: Settlement
      parent: missile-crisis
      c: 'From Khrushchev''s broadcast to the year''s end: inspection, the Il-28s, the talks in New York, Mikoyan in Havana,
        the pledge against invasion, the Stevenson affair.'
    section: th
    after: cal.thread.missile-crisis-quarantine
- add:
    entry:
      id: cal.thread.missile-crisis-warnings
      s: Warnings
      parent: missile-crisis
      c: 'Before the photographs of Oct. 14: the reports from Cuba, McCone''s warnings, Keating''s charges, the President''s
        statements, the estimates, the Cuba resolution.'
    section: th
    after: cal.thread.missile-crisis-settlement
- add:
    entry:
      id: cal.thread.elections-1960-chicago
      s: Chicago
      parent: elections-1960
      c: 'The Republican convention: the platform, Eisenhower''s address, Nixon''s nomination, Lodge for second place.'
    section: th
    after: cal.thread.elections-1960
- add:
    entry:
      id: cal.thread.elections-1960-count
      s: Count
      parent: elections-1960
      c: 'Election night and after: the returns, Nixon''s concession, the charges of fraud, the recounts in Illinois and Hawaii,
        California''s absentee ballots, the electors'' votes.'
    section: th
    after: cal.thread.elections-1960-chicago
- add:
    entry:
      id: cal.thread.elections-1960-debates
      s: Debates
      parent: elections-1960
      c: 'The four Kennedy–Nixon debates on television: the negotiations, the studios, the questions, the reactions.'
