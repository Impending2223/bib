patch: 2026-11-05-asselin
by: Claude (the witness re-read of Asselin, Hanoi's Road to the Vietnam War, 1954-1965, 2013), Nov. 5, 2026
ops:
- add:
    entry:
      id: cal.1960-01.vietnam-hanoi
      when: Jan.
      date: 1960-01
      thread: vietnam-hanoi
      c: 'The Nam Bộ leaders send Hanoi a new assessment: political struggle with armed propaganda not enough to protect the
        bases; violent struggle to be raised to the level of the political, offensive as well as defensive; more support from
        the North.'
      n: '[[w.asselin-hanois-road-to-the]], 73. To check: the Party''s history, *Lịch sử Đảng Cộng sản Việt Nam*, vol. 2 (Hanoi,
        1995), 106 (cited by [[w.asselin-hanois-road-to-the]], 73 n.1). Check: the assessment itself, not cited; Asselin quotes
        it through the Party''s history.'
      src:
        c: 1d2143f8
        rows:
        - 'w.asselin-hanois-road-to-the 73: all'
        - 'via x.1995.lich-su-dang-cong-san-viet-nam-tap-2: all'
- add:
    entry:
      id: cal.1960-03.vietnam-hanoi
      when: Mar.
      date: 1960-03
      thread: vietnam-hanoi
      c: The "Former Resistance Fighters of the Nam Bộ Region," veterans of the war against France, appeal to Hanoi for more
        military aid to step up the armed struggle in the South.
      n: '[[w.asselin-hanois-road-to-the]], 75. To check: Philippe Devillers, "La lutte pour la réunification du Viêt Nam
        entre 1954 et 1961," in Chesneaux, Boudarel and Hémery, eds., *Tradition et révolution au Viêt Nam* (1971), 346 (cited
        by [[w.asselin-hanois-road-to-the]], 75 n.15). Check: the appeal''s text and where it was published.'
      src:
        c: 58d6ded0
        rows:
        - 'w.asselin-hanois-road-to-the 75: all'
        - 'via x.1971.devillers-la-lutte-pour-la-reunification: all'
- add:
    entry:
      id: cal.1960-04-15.vietnam-hanoi
      when: Apr. 15
      date: '1960-04-15'
      thread: vietnam-hanoi
      c: 'Hanoi. The National Assembly''s twelfth session closes (Apr. 11–15). Tôn Đức Thắng, chairman of its Standing Committee:
        not yet the time to shift to war in the South; the people''s wish "work and peace"; the coming summit promises gains
        for peace. The subcommittee on the military service bill: defense some 16 percent of the budget this year, from 27
        percent in 1955. Phạm Văn Bạch, deputy for Bến Tre: the South in "an extremely unsafe situation" while the North builds
        socialism.'
      n: '[[w.asselin-hanois-road-to-the]], 74–75. To check: Tôn Đức Thắng''s closing address, the subcommittee''s presentation
        and Phạm Văn Bạch''s address, Apr. 15, 1960, Hồ sơ 64, Phông Quốc hội, Vietnam National Archives Center 3 (cited by
        [[w.asselin-hanois-road-to-the]], 74–75 nn.11–13, 16).'
      src:
        c: 8a3a8885
        rows:
        - 'w.asselin-hanois-road-to-the 74–75: all'
        - 'via x.1960-04-15.dien-van-be-mac-cua-ton: A-B'
        - 'via x.1960-04-15.thuyet-trinh-cua-tieu-ban: C'
        - 'via x.1960-04-15.dien-van-be-mac-cua-ton: B'
        - 'via x.1960-04-15.tham-luan-pham-van-bach: D'
- add:
    entry:
      id: cal.1960-04-28.vietnam-hanoi
      when: Apr. 28
      date: '1960-04-28'
      thread: vietnam-hanoi
      c: 'The Party Center to the Nam Bộ Executive Committee, secret cable no. 160, answering its plea: the policy of caution
        stands; without heed to the limits at home and abroad the Party would "meet difficulties and possibly lose ground."'
      n: '[[w.asselin-hanois-road-to-the]], 75. To check: the cable, *Văn kiện Đảng toàn tập*, 21:289, 293 (cited by [[w.asselin-hanois-road-to-the]],
        75 n.14). See [[cal.1960-01.vietnam-hanoi]].'
      src:
        c: 8768dee8
        rows:
        - 'w.asselin-hanois-road-to-the 75: all'
        - 'via x.1960-04-28.dien-mat-160-gui-xu-uy-nam-bo: all'
- add:
    entry:
      id: cal.1960-05-04.vietnam-hanoi
      when: May 4
      date: '1960-05-04'
      thread: vietnam-hanoi
      c: 'The Interzone V Executive Committee''s enlarged plenum: Saigon''s attacks on the bases have cost "human and material
        losses"; the fault lies in the armed struggle, not the political; the two to be used together.'
      n: '[[w.asselin-hanois-road-to-the]], 75–76. To check: the plenum''s resolution, *Văn kiện Đảng toàn tập*, 21:1095–1127
        (cited by [[w.asselin-hanois-road-to-the]], 76 n.17). Check: Asselin, 75, puts the meeting "that summer"; the resolution
        is dated May 4, 1960 (76 n.17).'
      src:
        c: e65794bf
        rows:
        - 'w.asselin-hanois-road-to-the 75–76: all'
        - 'via x.1960-05-04.nghi-quyet-lien-khu-uy-v: all'
- add:
