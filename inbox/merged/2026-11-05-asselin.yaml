- add:
    entry:
      id: cal.1961-06.vietnam-hanoi-3
      when: June
      date: 1961-06
      thread: vietnam-hanoi
      also:
      - china
      - soviet-union
      c: 'Phạm Văn Đồng to China, North Korea, Mongolia, the Soviet Union, Poland and Czechoslovakia, June and July, for support
        and more aid; by a French report, he asks that the North''s debts to its allies at Jan. 1, 1961, be forgiven. Hanoi:
        the visits strengthened the camp "with the Soviet Union at its core." A delegation to China, the Soviet Union and
        Eastern Europe brings pledges of 295 million rubles for the five-year plan, some eighty enterprises.'
      n: '[[w.asselin-hanois-road-to-the]], 100, 104. To check: the British Embassy at Saigon, "Review of Events in North
        Vietnam during 1961," Jan. 31, 1962, FO 371/166697 (cited by [[w.asselin-hanois-road-to-the]], 104 n.77); the National
        Assembly''s resolution, Oct. 27, 1961, VNAC3 (cited by [[w.asselin-hanois-road-to-the]], 104 n.79); "Calendar of Events
        in North Vietnam during 1961," FO 371/166697 (cited by [[w.asselin-hanois-road-to-the]], 100 n.53). Names: Phạm Văn
        Đồng. Check: whether the delegation of the pledges (100) is Đồng''s; Asselin does not say.'
      src:
