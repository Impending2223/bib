      when: May
      date: 1960-05
      thread: china
      also:
      - vietnam-hanoi
      c: 'Hanoi. Zhou Enlai, in private meetings, urges the North''s leaders to keep the status quo in the South, avoid escalation,
        and finish collectivizing agriculture and build light industry: the North first a rear base.'
      n: '[[w.asselin-hanois-road-to-the]], 79. To check: [[w.zhai-china-and-the-vietnam]], 82–83 (cited by [[w.asselin-hanois-road-to-the]],
        79 n.41). Names: Zhou Enlai. Check: the days.'
      src:
        c: f6fda84e
        rows:
        - 'w.asselin-hanois-road-to-the 79: all'
        - 'via x.2000.zhai-china-and-the-vietnam-82-83: all'
      tags:
      - name:zhou-enlai
      - place:hanoi
- add:
    entry:
      id: cal.1960-07.vietnam-hanoi
      when: July
      date: 1960-07
      thread: vietnam-hanoi
      c: 'The Nam Bộ Executive Committee''s fifth plenum: the political struggle''s results disappointing, propaganda among
        Saigon''s soldiers and officials ineffective; the armed forces weak, their weapons, buried since 1954, "archaic" and
        few. Hanoi asked to back a more forward strategy.'
      n: '[[w.asselin-hanois-road-to-the]], 76. To check: the plenum''s resolution, *Văn kiện Đảng toàn tập*, 21:1059–94 (cited
        by [[w.asselin-hanois-road-to-the]], 76 n.19); Khuất Biên Hòa, *Đại tướng Lê Đức Anh* (2005), 61–62 (cited by [[w.asselin-hanois-road-to-the]],
        76 n.18). See [[cal.1960-05-04.vietnam-hanoi]].'
      src:
        c: bf23672b
        rows:
        - 'w.asselin-hanois-road-to-the 76: all'
        - 'via x.2005.khuat-bien-hoa-dai-tuong-le-duc-anh: B'
        - 'via x.1960-07.nghi-quyet-xu-uy-nam-bo-lan-v: all'
