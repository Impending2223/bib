      c: 'Lê Quang Đạo, of the army, in *Học Tập* no. 12, defending the refusal of COSVN''s call: guard against a clash with
        the Americans; a new war "a modern war" across the whole country, needing an army, reserves and a rear the North does
        not yet have.'
