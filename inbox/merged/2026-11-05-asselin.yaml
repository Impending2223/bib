- add:
    entry:
      id: cal.1960-11.vietnam-hanoi
      when: Nov.
      date: 1960-11
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china
      c: 'Moscow, the meeting of the communist parties. Hồ Chí Minh''s address: the unity of the socialist countries and the
        parties the most important international issue; Soviet and Chinese aid behind the North''s achievements. A reluctant
        Chinese delegation signs the final declaration. At the closing banquet, by a Yugoslav diplomat''s account, Hồ hurries
        to Zhou Enlai after Khrushchev''s toast; a conciliatory Chinese speech and embraces follow.'
      n: '[[w.asselin-hanois-road-to-the]], 80–81. To check: Hồ Chí Minh''s address, *Văn kiện Đảng toàn tập*, 21:1035–46
        (cited by [[w.asselin-hanois-road-to-the]], 81 n.55); British Embassy, Paris, to the Foreign Office, Feb. 15, 1962,
        FO 371/160125 (cited by [[w.asselin-hanois-road-to-the]], 81 n.58); P. J. Honey, "The Position of the DRV Leadership
        and the Succession to Ho Chi Minh," *China Quarterly*, no. 9 (1962), 28 (cited by [[w.asselin-hanois-road-to-the]],
        80 n.54, 81 n.57). See [[cal.1960-11.soviet-union]]. Names: Hồ Chí Minh, Zhou Enlai, Khrushchev. Check: the days.'
      src:
        c: 536e8b79
        rows:
        - 'w.asselin-hanois-road-to-the 80–81: all'
        - 'via x.1960-11.bai-noi-ho-chi-minh-matxcova: B'
        - 'via x.1962.honey-position-of-the-drv-leadership: C'
        - 'via x.1962-02-15.british-embassy-paris-to-fo: D-E'
      tags:
      - name:ho-chi-minh
      - name:zhou-enlai
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1961-01-24.vietnam-hanoi
      when: Jan. 24
      date: '1961-01-24'
      thread: vietnam-hanoi
      c: 'The Politburo''s instruction on the direction and tasks of the revolution in the South, after its first session:
        no sudden "explosion" from "relative calmness"; war likely needed in time, the forces there to be built and readied
        for a protracted fight; political struggle still central, no military adventures.'
      n: '[[w.asselin-hanois-road-to-the]], 92–93. To check: the instruction, *Văn kiện Đảng toàn tập*, 22:153–58, 163 (cited
        by [[w.asselin-hanois-road-to-the]], 92 n.1, 93 n.3); the Reunification Committee''s draft presentation on the South,
        undated [1962], Hồ sơ 252, Vietnam National Archives Center 3 (cited by [[w.asselin-hanois-road-to-the]], 93 n.3).'
      src:
        c: 85f39641
        rows:
        - 'w.asselin-hanois-road-to-the 92–93: all'
        - 'via x.1961-01-24.chi-thi-cua-bo-chinh-tri: all'
        - 'via x.undated.du-thao-de-cuong-tinh-hinh-mien-nam-1962: B'
- add:
    entry:
      id: cal.1961-02-07.vietnam-hanoi
      when: Feb. 7
      date: '1961-02-07'
      thread: vietnam-hanoi
      c: 'Lê Duẩn to "Mười Cúc" and the Nam Bộ comrades: not the Chinese road of a long war from the countryside, but struggle
        in town and country at once, toward a general uprising; political forces built with the armed; "We are weaker than
        the enemy"; "We must know to exploit time."'
      n: '[[w.asselin-hanois-road-to-the]], 94. Made public: Lê Duẩn, *Thư vào Nam* (Hanoi), by Asselin''s note (94 n.6; Check:
        the first printing). To check: Lê Duẩn, *Thư vào Nam* (Hanoi, 2005), 7–15 (cited by [[w.asselin-hanois-road-to-the]],
        94 n.6). See [[cal.1961-01-24.vietnam-hanoi]]. Names: Lê Duẩn.'
      src:
        c: e76224f9
        rows:
        - 'w.asselin-hanois-road-to-the 94: all'
        - 'via x.1961-02-07.le-duan-gui-anh-muoi-cuc: all'
      tags:
      - name:le-duan
