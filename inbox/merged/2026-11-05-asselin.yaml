      when: Oct. 31
      date: '1961-10-31'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 45-TT/TW: a "wide and strong struggle" against the Americans'' new scheme of intervention
        in the South. The government sends a letter to the world''s governments, the United States and its "colonial countries"
        excepted, and another to the Geneva signatories asking them to press the Control Commission.'
      n: '[[w.asselin-hanois-road-to-the]], 102, 126. To check: the circular, *Văn kiện Đảng toàn tập*, 22:484–89 (cited by
