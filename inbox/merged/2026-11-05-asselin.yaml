      when: Mar. 14
      date: '1961-03-14'
      thread: vietnam-hanoi
      c: 'The Party Center''s secret cable no. 28/DM to the Nam Bộ and Interzone V committees, on the organization and tasks
        of the Central Office for South Vietnam (COSVN): to choose, train and assign cadres in its area, run the Party''s
        finances there and the insurgency.'
      n: '[[w.asselin-hanois-road-to-the]], 95. To check: the cable, *Văn kiện Đảng toàn tập*, 22:263–65 (cited by [[w.asselin-hanois-road-to-the]],
