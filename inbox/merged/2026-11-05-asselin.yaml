      when: Oct. 24
      date: '1961-10-24'
      thread: vietnam-hanoi
      c: 'Hanoi. The National Assembly''s third meeting of its second session (Oct. 23–27). Ưng Văn Khiêm, the Foreign Minister,
        on the world and the diplomatic line: closer ties with the socialist countries, the camp''s unity, ties with the new
        states; Kennedy has "aggressively prepared for war" since he came to power. The Reunification Committee: American
        aid to Saigon tenfold, $41 million a year in 1956 to $400 million in 1961.'
      n: '[[w.asselin-hanois-road-to-the]], 101, 109, 113. To check: Ưng Văn Khiêm''s report, the Reunification Committee''s
        and the Standing Committee''s, Oct. 24, 1961, Hồ sơ 728, Phông Quốc hội, VNAC3 (cited by [[w.asselin-hanois-road-to-the]],
        101 nn.56, 59, 62; 109 n.124; 113 n.145). See [[cal.1961-10.vietnam]]. Names: Kennedy.'
