      date: '1961-10-26'
      thread: vietnam-hanoi
      c: 'The National Assembly. Nguyễn Văn Hướng, deputy for Long Xuyên, on Kennedy''s preparations for war and the NLF''s
        figures: by early 1961, 2,185 sweeps, 874 political prisons, 270,000 held; 77,500 killed by Diệm''s forces, 1954–60;
        the North answers with meetings and petitions. Trần Tống, deputy for Quảng Nam: the South "surely will secure victory."'
      n: '[[w.asselin-hanois-road-to-the]], 116–17. To check: the addresses of Nguyễn Văn Hướng and Trần Tống, Oct. 26, 1961,
        Hồ sơ 729, Phông Quốc hội, VNAC3 (cited by [[w.asselin-hanois-road-to-the]], 116–17 nn.163–66). See [[cal.1961-10-24.vietnam-hanoi]].
        Names: Kennedy, Ngô Đình Diệm. Check: Asselin, 116, dates the address "late 1961"; the file is the sitting of Oct.
        26 (116 n.163).'
