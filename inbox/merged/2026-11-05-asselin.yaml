      thread: vietnam-hanoi
      c: Haiphong. Unrest; 1,500 troops sent to restore order. Protesters set rice stocks afire and harass the police and
        firemen.
      n: '[[w.asselin-hanois-road-to-the]], 98. To check: the French General Delegation at Hanoi to the Foreign Ministry,
        Sept. 1, 1961 (cited by [[w.asselin-hanois-road-to-the]], 98 n.33). Check: the month; Asselin, 98, sets it in mid-1961,
