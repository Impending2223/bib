      c: 'Hanoi. Marshal Ye Jianying heads a Chinese military delegation. In public, the North an "outpost" of the camp in
        Southeast Asia, the Americans aggressors; no word of the Soviet Union. By Bùi Tín''s account the mission came to urge
        caution: attacks in the South at section or company level only. Giáp, during the visit: the key to victory the camp''s
        solidarity "with the great Soviet Union as the nucleus."'
      n: '[[w.asselin-hanois-road-to-the]], 114–15. To check: the British Consulate General at Hanoi, "Visit of Chinese Military
        Delegation to North Vietnam," Jan. 3, 1962, FO 371/166713 (cited by [[w.asselin-hanois-road-to-the]], 114–15 nn.155,
        158–59); [[w.tin-following-ho-chi-minh]], 45 (cited by [[w.asselin-hanois-road-to-the]], 115 n.156); [[w.zhai-china-and-the-vietnam]],
        113 (cited by [[w.asselin-hanois-road-to-the]], 115 n.157). Names: Yeh, Bùi Tín, Võ Nguyên Giáp. Check: the days.'
