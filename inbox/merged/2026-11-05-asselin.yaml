      thread: vietnam-hanoi
      c: 'Nguyễn Chí Thanh, of the Politburo, now over agriculture, in *Học Tập*: socialist construction in the North the
        Party''s "central task"; the struggle against poverty and backwardness "extremely important."'
      n: '[[w.asselin-hanois-road-to-the]], 97. To check: Nguyễn Chí Thanh, "We Must Study, Support and Develop What Is New,"
