  - edit:
      id: cal.1968-11-01.vietnam
      base: dfad022d
      set:
        n: 'FRUS 1964–68, VII, doc. [256](https://history.state.gov/historicaldocuments/frus1964-68v07/d256). [[w.hunt-pacification]]; [[w.sorley-better-war]]; [[w.colby-lost-victory]]; [[w.andrade-ashes-to-ashes]]; [[w.vietnam-victory-in-vietnam]], 237–38 (Hanoi''s account: a trial in Vĩnh Long and Trà Vinh showed its weakness in the countryside); [[w.cosmas-joint-chiefs-of-staff]], 247. Made public: FRUS 1964–68, VII (2003). Check: Cosmas, 247, gives "more than 1,200 hamlets," contested or Viet Cong-controlled; his dates, Nov. 1–Jan. 31, the entry''s. Names: Abrams, Colby, Komer.'
        c: 'The Accelerated Pacification Campaign opens, to run to Jan. 31: about 1,000 contested hamlets to be brought under the Saigon government; the attack on the Viet Cong infrastructure, the Phoenix program, pressed. Abrams in command; Colby, Komer''s deputy, to head CORDS (Check the figure). Dec. 16, the CIA stations assessment of Phoenix: "encouraging progress," but no significant reduction yet in the Communists'' ability to carry on.'
