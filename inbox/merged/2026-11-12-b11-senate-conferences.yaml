      when: Jan. 18
      date: '1963-01-18'
      thread: congress
      also:
      - democratic-party
      c: 'Mansfield''s committee of six Senate Democrats on the session''s schedule, at lunch: Monroney elected chairman; a schedule of recesses proposed. By unanimous vote it recommends that debate for four hours after the morning hour be germane to the pending business, and that committees may sit during sessions by majority vote.'
      n: '[[w.ritchie-minutes-of-the-senate]], 616–17 (Monroney''s report to the Senate Democratic Conference, Feb. 7, 1963, attached to its minutes). Names: Mansfield, Monroney.'
