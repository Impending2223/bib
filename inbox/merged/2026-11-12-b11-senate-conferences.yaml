      when: Feb. 19
      date: '1963-02-19'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-one present, 11:20 to 11:43 a.m., confirms the Committee on Committees'' assignments, Williams acting for Carlson. Dirksen: the Democrats refused the Appropriations ratio on Russell''s objection; Dominick''s Interior seat, against the rule for two Senators of one State, temporary. He reports the White House briefing of the evening before. Keating: the Democrats'' action "a direct slap" at his colleague. Allott on the Committee on Committees'' procedure.'
      n: '[[w.wolff-minutes-of-the-senate]], 958–60 (the briefing, 959; Allott, 959–60). See [[cal.1963-02-18.cuba-2]], [[cal.1963-02-19.republican-party-congress-2]]. Names: Williams, Carlson, Dirksen, Russell, Dominick, Keating, Allott. Check: the minutes head the meeting "Monday, February 19, 1963"; Feb. 19 was a Tuesday.'
