    entry:
      id: cal.1963-01-18.congress-2
      when: Jan. 18
      date: '1963-01-18'
      thread: congress
      also:
      - republican-party-congress
      c: 'The Democrats'' committee on the schedule with the Republicans'', Mansfield''s office, from 3:10 p.m.; Monroney chosen chairman, Dirksen, Cotton and Cooper for the minority. Recesses agreed: Lincoln''s Birthday, Feb. 11–14; Easter, Apr. 11–19; Memorial Day; July 4. The summer recess put off until the House leaders are consulted. Dirksen "strongly opposed" the germaneness rule, Cotton too; Cotton and Cooper against committees sitting during sessions; the consensus approves neither.'
      n: '[[w.ritchie-minutes-of-the-senate]], 616–18 (Monroney''s report and Baker''s version of it, attached to the minutes of the Senate Democratic Conference, Feb. 7, 1963). See [[cal.1963-01-18.congress]]. Names: Mansfield, Monroney, Dirksen, Cotton, Cooper.'
