      id: cal.1962-03-13.congress-2
      when: Mar. 13
      date: '1962-03-13'
      thread: congress
      also:
      - democratic-party
      - trade
      c: 'Senate Democrats meet Commerce Secretary Hodges, 3:30 p.m., on the Trade Expansion Act, the first of the Cabinet officers'' meetings. Hodges: authority to cut tariffs across the board, to zero on the "dominant supplier" list, by half elsewhere. Kerr, Long (La.) and Russell doubt the most-favored-nation effects; Ervin raises a constitutional question; Muskie doubts the export figures.'
      n: '[[w.ritchie-minutes-of-the-senate]], 594–98. Names: Hodges, Kerr, Long, Russell, Ervin, Muskie.'
