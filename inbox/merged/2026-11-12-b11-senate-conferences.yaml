      id: cal.1962-05-02.congress
      when: May 2
      date: '1962-05-02'
      thread: congress
      also:
      - democratic-party
      - economy
      c: 'Senate Democrats on the tax bill, after Mansfield''s report of the leaders'' morning meeting with the President. Withholding on interest and dividends: Muskie says it would destroy Democratic chances in Maine; Douglas: the mail against it is the savings and loan companies'' work; he is against the investment credit; McNamara against the credit, a "subsidy for automation." Kerr: "if the four Democratic Senators on the Finance Committee, present in this room, will support it, we will report the bill out this year."'
      n: '[[w.ritchie-minutes-of-the-senate]], 598–99. See [[cal.1962-05-02.economy]]. Names: Mansfield, Muskie, Douglas, McNamara, Kerr.'
