      c: 'Kennedy''s breakfast with the congressional leaders: urban affairs, the Easter recess, the week''s programs, the education bill. By O''Brien''s account, the urban affairs department no "political plot on his part"; its civil rights aspect "had not occurred to him." He is sending a message on education and is "not giving up" on the general bill.'
      n: '[[w.ritchie-minutes-of-the-senate]], 591–93 (Mansfield''s report to the Senate Democratic Conference, Feb. 7, 1962, 591–92; O''Brien''s account, 592–93). Names: Kennedy, O''Brien.'
