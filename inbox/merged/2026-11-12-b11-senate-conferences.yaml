      c: 'Senate Democrats on the mass transit bill, S. 6, 10:10 to 11:15 a.m., Mansfield''s office. Williams (N.J.), Sparkman, Magnuson and Cannon explain the bill as reported by Banking and Currency and by Commerce. Clark: it is vital to the Democrats in the suburbs in 1964. Morse cannot vote for it as it stands; Robertson, who reported it, opposes it. Mansfield asks for a show of hands; the count is not given.'
