      c: Senate Democrats, 12:35 to 1 p.m., forty-nine present. Russell moves that Mansfield choose the secretary to the majority; he names Valeo, the acting secretary. Mansfield asks the officers the conference elected for statements of their assets, held in confidence, and backs Morse's public disclosure bill; asks that Valeo not use the Senate automobile; twelve Democrats absent. Anderson, Russell, Ervin, Jordan and Ellender oppose disclosure; Clark for it.
      n: '[[w.ritchie-minutes-of-the-senate]], 622–25. Names: Russell, Mansfield, Valeo, Morse, Anderson, Ervin, Jordan, Ellender, Clark.'
