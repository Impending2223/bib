      c: 'Senate Republican conference, 2:45 to 4:02 p.m., twenty-five present, on the administration''s civil rights bills. Dirksen: Mansfield introduced two, a package and one on Title II; he and Mansfield will introduce a third with all but Title II, which Dirksen cannot sponsor. Javits: that leaves the party in a "twilight zone." Dirksen cautions against a Republican bill of their own.'
