      n: '[[w.dallek-flawed-giant]], 8 (the caucus, the motion, Gore, the vote); [[w.caro-passage-of-power]], 164–69 (the conference, the protest, the role unused; no count given); [[w.mann-walls-of-jericho]], 291–92 (the day; the motion; Gore and Clark against; Mansfield''s threat to resign; 46–17); [[w.shesol-mutual-contempt]], 63–64 (the conference, sixty-four Democrats; Mansfield''s motion; Clark and Gore against; 46 to 17, from *Time*); [[w.bernstein-guns-or-butter]], 8 (Clark, Gore, Anderson, Johnston and Robertson against); [[w.mcpherson-political-education]], 184 (the suggestion that Johnson chair the Democratic caucus; "immediate opposition ... from other members," so that he understood his guidance was not welcome). [[w.humphrey-education-of-a-public-1976]], 243 (Johnson presides at the caucus''s first meeting; Russell later tells him he cannot keep the power). [[w.ritchie-minutes-of-the-senate]], 577–81 (the Democratic Conference, Tuesday, Jan. 3, 1961, 9:45 a.m., Johnson in the chair; Mansfield elected majority leader, Humphrey whip, Smathers secretary, each by acclamation, 577; Mansfield "proposed that the Vice President-elect preside over future Conferences," Clark and Gore among those raising questions, 578; Kefauver''s motion to postpone a week lost, 18 yeas and 45 nays; Holland''s substitute, that the Majority Leader invite the Vice President to attend and ask him, the president pro tempore or any Democratic Senator to preside, agreed to, 46 yeas and 17 nays, 579; Hayden elected president pro tempore, 579; Johnson''s remarks, from the Johnson Library: he will take the oath for his new term and resign at once, 579–81; not Gore''s words as quoted; not the loud protest). Drew Pearson, *Washington Post*, Jan. 18, 1961 (cited by [[w.caro-passage-of-power]], 169). Names: Mansfield, Johnson, Gore. Check: Dallek gives Jan. 5, "seventeen days before taking office" (8), which would be Jan. 3. Check: Mann, 291, gives Gore''s words as "We might as well ask Jack [Kennedy] to come back up and take his turn at presiding," and Jan. 3. Check: Humphrey: Johnson "presided at the first meeting of the caucus" (243).'
