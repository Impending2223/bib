      c: The Senate Republicans' Committee on Committees, Williams presiding for Carlson, 9:35 to 10:30 a.m. Allott objects that the assignments reached the press, and to the procedure. Cooper to Rules and Administration in Morton's place, Morton yielding; the assignments approved on Mundt's motion. On Javits's motion a subcommittee of three to study assignments and seniority.
      n: '[[w.wolff-minutes-of-the-senate]], 952–57 (the minutes and the worksheets). Names: Williams, Carlson, Allott, Cooper, Morton, Mundt, Javits. Check: the minutes head the meeting "Monday, February 19, 1963"; Feb. 19 was a Tuesday.'
