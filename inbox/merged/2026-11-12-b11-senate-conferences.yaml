- add:
    entry:
      id: cal.1964-01-08.congress
      when: Jan. 8
      date: '1964-01-08'
      thread: congress
      also:
      - democratic-party
      - civil-rights-bill
      c: 'Senate Democrats, the session''s first meeting, 4:15 to 4:48 p.m., forty present. Mansfield reports his meetings with the President: appropriations, civil rights, the tax bill on the floor by Feb. 1, health care for the aged. Recesses set, Feb. 11–17 and Mar. 26–30 among them; no important business May 25–26, the Kennedy birthday dinner. On civil rights he asks members to consider what "an acrid and excessively prolonged debate" will do "to the President, to the Senate, and to the party." Fulbright''s three-day week discussed; no action.'
      n: '[[w.ritchie-minutes-of-the-senate]], 625–29 (the meeting; Mansfield''s statement, 626–27; the agenda attached, 628–29). See [[cal.1964-01-08.congress-2]]. Names: Mansfield, Fulbright, Johnson.'
      tags:
      - name:mansfield-mike
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-08.congress-2
      when: Jan. 8
      date: '1964-01-08'
      thread: congress
      c: 'Mansfield with the Senate Appropriations subcommittee chairmen, morning: in his judgment they can finish their preliminary work before the House''s bills arrive.'
      n: '[[w.ritchie-minutes-of-the-senate]], 625 (his report to the Senate Democratic Conference that afternoon). Names: Mansfield.'
      tags:
      - name:mansfield-mike
- add:
    entry:
      id: cal.1964-01-28.congress
      when: Jan. 28
      date: '1964-01-28'
      thread: congress
      also:
      - democratic-party
      - economy
      c: 'Senate Democrats, 2:45 to 4:15 p.m., forty-four present, on the campaign and the tax bill. Mansfield: no independent fund raising in New York or Washington; Inouye to coordinate speaking dates. Magnuson: $15,000 for each candidate, a dinner Mar. 19 at the Armory, Farley treasurer. Long (La.) floor manager of the tax bill, 153 committee amendments; Gore: "a rich man''s bill." Mansfield to call it up Thursday.'
      n: '[[w.ritchie-minutes-of-the-senate]], 629–34 (the campaign, 629–32; the tax bill, 632–34). Names: Mansfield, Inouye, Magnuson, Long, Gore.'
      tags:
      - name:mansfield-mike
      - name:inouye-daniel-k
      - name:magnuson-warren-g
      - name:long-russell-b
      - name:gore-albert-sr
- add:
    entry:
      id: cal.1964-01-29.republican-party-congress-2
      when: Jan. 29
      date: '1964-01-29'
      thread: republican-party-congress
      c: 'Senate Republican conference, 9:45 to 11 a.m., twenty-four present, on the tax bill. Dirksen: floor action by Feb. 7; he will offer amendments to repeal four excise taxes. Williams, of Finance, against agreeing to the committee amendments en bloc before the report; Dominick on the college tax credit amendment with Ribicoff.'
      n: '[[w.wolff-minutes-of-the-senate]], 973–75. Names: Dirksen, Williams, Dominick, Ribicoff.'
      tags:
      - name:dirksen-everett
      - name:williams-john-j
      - name:dominick-peter-h
      - name:ribicoff-abraham
- add:
    entry:
      id: cal.1964-07-20.congress
      when: July 20
      date: '1964-07-20'
      thread: congress
      also:
      - democratic-party
      - medicare
      c: 'Senate Democrats, 10:10 to 11:02 a.m., forty-two present, on what must pass before adjournment. Mansfield: the work could be done in the month before the Democratic convention; "if we meet on Saturdays we must have a quorum and we must conduct business." Dodd asks for the drug and gun bills. Holland against Medicare this session; Russell: it and the Social Security increases cannot both pass; Gore for a strong stand; Long (La.): the House will not accept it. Neuberger proposes another meeting July 27.'
      n: '[[w.ritchie-minutes-of-the-senate]], 638–42 (Mansfield''s statement, 638–39; Medicare, 640–42). Names: Mansfield, Dodd, Holland, Russell, Gore, Long, Neuberger.'
      tags:
      - name:mansfield-mike
      - name:dodd-thomas-j
      - name:holland-spessard-l
      - name:russell-richard-b
      - name:gore-albert-sr
      - name:long-russell-b
      - name:neuberger-maurine-b
- add:
    entry:
      id: cal.1964-07-27.congress
      when: July 27
      date: '1964-07-27'
      thread: congress
      also:
      - democratic-party
      - baker
      c: 'Senate Democrats, 11:10 to 11:55 a.m., forty-nine present, on the Senate disclosure resolution, S. Res. 337. Mansfield: recommit it with instructions to report it back with a joint resolution for a commission on ethics covering every branch; "I think it is about time that Senators stopped tearing the Senate down." Pastore, Gruening, Holland, Russell, Ervin, Jordan and Cannon object to singling out the Senate; Clark defends disclosure; Mansfield says the Senate would be "in the soup" if it did not act.'
      n: '[[w.ritchie-minutes-of-the-senate]], 642–48 (Mansfield''s statement, 643–46; the discussion, 646–48). Names: Mansfield, Pastore, Gruening, Holland, Russell, Ervin, Jordan, Cannon, Clark.'
