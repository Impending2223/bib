      when: Feb. 7
      date: '1963-02-07'
      thread: congress
      also:
      - democratic-party
      c: Senate Democrats, Johnson presiding, 3:05 to 4 p.m. Clark moves to enlarge the Steering Committee from fifteen to nineteen; lost, 39 to 21, on a secret ballot, Holland objecting to the secret ballot. Anderson's motion for seventeen lost on a division. Douglas and Symington elected to the Steering and Policy Committees. Morse asks support for his resolution to expunge Williams of Delaware's remarks on Powell from the Record. Monroney reports for the ad hoc committee on recesses and a germaneness rule.
      n: '[[w.ritchie-minutes-of-the-senate]], 613–15 (the meeting; the vote, 614; Monroney''s report attached, 616–18). Names: Johnson, Clark, Holland, Anderson, Douglas, Symington, Morse, Williams, Monroney.'
