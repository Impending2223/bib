    entry:
      id: cal.1962-03-13.republican-party-congress
      when: Mar. 13
      date: '1962-03-13'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-four present, on the United Nations bond bill, S. 2768. Aiken: the Aiken–Hickenlooper substitute, a three-year loan of up to $100 million, lost in Foreign Relations, 8 to 7, and Lausche''s amendment was adopted. Hickenlooper: the substitute would force the U.N. to put its house in order; he expects to offer a dollar-for-dollar match if it fails. No positions taken.'
      n: '[[w.wolff-minutes-of-the-senate]], 908–09 (9:38 to 11:05 a.m.). Names: Aiken, Hickenlooper, Lausche.'
      tags:
      - name:aiken-george-d
      - name:hickenlooper-bourke-b
      - name:lausche-frank-j
- add:
    entry:
      id: cal.1962-04-03.republican-party-congress
      when: Apr. 3
      date: '1962-04-03'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-five present, 9:40 to 10:39 a.m., on the Dirksen–Mansfield compromise on the U.N. bond bill: a $100 million loan, loans over $25 million to be matched by other nations. Hickenlooper: the Aiken–Hickenlooper substitute would draw 32 to 42 votes. Dirksen: it gets the administration "off the hook." Ten Senators give their views, among them that it is "a complete capitulation to the White House"; Javits: it takes the party "off the hook for wrecking the United Nations." Teeple introduced as the Policy Committee''s staff director.'
      n: '[[w.wolff-minutes-of-the-senate]], 910–12. Names: Dirksen, Mansfield, Hickenlooper, Aiken, Javits.'
      tags:
      - name:dirksen-everett
      - name:hickenlooper-bourke-b
