- add:
    entry:
      id: cal.1962-06-06.congress
      when: June 6
      date: '1962-06-06'
      thread: congress
      also:
      - democratic-party
      - economy
      c: 'Senate Democrats, 3 p.m., thirty-four attending. Mansfield on absences: the Democratic side is "looking ridiculous"; eleven absent that day, as many as twenty-six in earlier weeks. Adjournment October 1 if lucky. Church: "those of us up for reelection this year simply cannot afford to be here on October 1." Byrd, of Finance: the most contentious bill in his twenty-nine years. Magnuson: leave the tax bill to next year; Monroney: to after the election.'
      n: '[[w.ritchie-minutes-of-the-senate]], 599–603 (the attendance, 603). Names: Mansfield, Church, Byrd, Magnuson, Monroney.'
      tags:
      - name:mansfield-mike
