    entry:
      id: cal.1963-02-18.cuba-2
      when: Feb. 18
      date: '1963-02-18'
      thread: cuba
      also:
      - missile-crisis
      c: 'White House briefing for the congressional leaders, evening. By Dirksen''s account to the Senate Republicans next day: Kennedy "seemed to be very nervous"; his latest letters with Khrushchev hold out a hope of "a pull out of some additional troops" in early March. Dirksen cites Drummond''s figures of troops, missiles and planes; the President calls the summary "practically correct." Asked "what is down the road," he says only "We do the best we can."'
      n: '[[w.wolff-minutes-of-the-senate]], 959 (Dirksen''s report to the conference; the minutes'' words). Names: Kennedy, Dirksen, Khrushchev, Drummond. Check: the day; the minutes head the conference "Monday, February 19, 1963," and Feb. 19 was a Tuesday.'
      tags:
      - name:kennedy-john-f
      - name:dirksen-everett
      - name:khrushchev-nikita-s
      - name:drummond-roscoe
