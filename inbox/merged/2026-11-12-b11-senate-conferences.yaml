      when: Feb. 7
      date: '1962-02-07'
      thread: congress
      also:
      - democratic-party
      c: Senate Democrats, an informal conference. Mansfield reports the President's breakfast with the leaders Feb. 6; O'Brien's account of it supplied. Randolph raises the offices' clerical funds, left short by the House; Morse proposes lend-lease of staff and more live pairs for Senators up for reelection; Sparkman for the live pairs.
      n: '[[w.ritchie-minutes-of-the-senate]], 591–93 (the minutes'' own words, 591–92; O''Brien''s account, 592–93). See [[cal.1962-02-06.congress]]. Names: Mansfield, O''Brien, Randolph, Morse, Sparkman.'
