      when: Jan. 9
      date: '1963-01-09'
      thread: congress
      also:
      - democratic-party
      c: Senate Democrats organize the 88th Congress, Johnson presiding, 9:35 to 11:30 a.m., nine new Senators introduced. Hayden president pro tempore, Mansfield leader, Humphrey whip, Smathers secretary, each by acclamation. Morse moves that the Steering Committee report its committee assignments to the conference before they are final; lost, 50 to 8, Clark, Douglas, Gruening, McNamara, Morse, Nelson, Neuberger and Proxmire for. Russell, on Clark's remarks, objects that the South has been singled out. Mansfield asks that Rule 22 wait until after the State of the Union; agreed.
      n: '[[w.ritchie-minutes-of-the-senate]], 607–13 (the elections, 607–08; Morse''s motion, 609; the tally, 611–13, read off the page: the yeas Clark, Douglas, Gruening, McNamara, Morse, Nelson, Neuberger, Proxmire); the recess proposals attached, 610–11. See [[cal.1963-01-09.congress]]. Names: Johnson, Hayden, Mansfield, Humphrey, Smathers, Morse, Clark, Douglas, Gruening, McNamara, Nelson, Neuberger, Proxmire, Russell.'
