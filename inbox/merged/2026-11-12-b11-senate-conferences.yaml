- add:
    entry:
      id: cal.1960-01-06.republican-party-congress
      when: Jan. 6
      date: '1960-01-06'
      thread: republican-party-congress
      c: 'Senate Republican conference, Saltonstall chairman, thirty-four present, 2:38 to 4:07 p.m.; condolences for Langer and for Thurmond''s wife; the floor leader''s and the whip''s seats made permanent. Dirksen on the session: aid to education the likely first bill, civil rights about Feb. 15, a minimum wage bill early. Javits asks for a conference before the civil rights bill; Dirksen reports the Revenue Service ruling that a sitting Senator''s contributions are tax free.'
      n: '[[w.wolff-minutes-of-the-senate]], 846–50 (the meeting; Dirksen''s report, 847–50; exhibits, 850–52). Names: Saltonstall, Langer, Thurmond, Dirksen, Javits.'
      tags:
      - name:saltonstall-leverett
      - name:dirksen-everett
      - name:javits-jacob-k
      - name:thurmond-strom
      - name:langer-william-l
- add:
    entry:
      id: cal.1960-01-07.congress
      when: Jan. 7
      date: '1960-01-07'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats in conference, Johnson in the chair, 3:30 to 5:12 p.m. Clark moves that the conference meet every two weeks or on the request of fifteen members; Russell: it "would destroy the Conference system after the second week." Clark withdraws it. Gore moves that Policy Committee vacancies be filled by the conference, and withdraws it until the next meeting. Hayden: Cannon has called him; Rayburn wants to adjourn July 2.'
      n: '[[w.ritchie-minutes-of-the-senate]], 515–22 (the meeting; the motions; Russell''s words, 517; Hayden''s report, 522; no vote taken). Names: Johnson, Clark, Russell, Gore, Hayden, Cannon, Rayburn.'
      tags:
      - name:johnson-lyndon-b
      - name:clark-joseph-s
      - name:russell-richard-b
      - name:gore-albert-sr
      - name:hayden-carl
      - name:rayburn-sam
      - name:cannon-clarence
- add:
    entry:
      id: cal.1960-01-08.republican-party-congress
      when: Jan. 8
      date: '1960-01-08'
      thread: republican-party-congress
      c: The Senate Republicans' Committee on Committees, Schoeppel chairman, 10:20 to 11:20 a.m., on the seats Langer's death leaves on Foreign Relations, Judiciary and Post Office. Javits's letter asking for Commerce would upset the proposed slate; Allott and Scott propose rules to spread the major committees. Recessed for further consultation.
      n: '[[w.wolff-minutes-of-the-senate]], 852–54 (the Committee on Committees'' minutes, printed with the conference''s). Names: Schoeppel, Langer, Javits, Allott, Scott.'
      tags:
      - name:schoeppel-andrew-f
      - name:langer-william-l
      - name:javits-jacob-k
      - name:allott-gordon-l
      - name:scott-hugh-d-jr
- add:
    entry:
      id: cal.1960-01-18.republican-party-congress
      when: Jan. 18
      date: '1960-01-18'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-five present, 11:07 to 11:55 a.m. Schoeppel moves, and the conference unanimously approves, the Committee on Committees'' assignments for the vacancies after Langer''s death. Javits''s resolution for a special committee on assignments, any change to take effect next session, adopted. Bridges, Policy Committee chairman, on the Democrats'' proposal to rename it a Steering Committee: he prefers the name, but the Democrats have the votes if they insist; he is made a committee of one to confer with Hayden and Johnson.'
      n: '[[w.wolff-minutes-of-the-senate]], 856–58 (the assignments, 856–57; the resolution, 857; Bridges, 858; exhibits, 859–60). See [[cal.1960-01-18.republican-party-congress-2]]. Names: Schoeppel, Langer, Javits, Bridges, Hayden, Johnson.'
      tags:
      - name:javits-jacob-k
      - name:hayden-carl
      - name:johnson-lyndon-b
      - name:bridges-henry-s
      - name:schoeppel-andrew-f
      - name:langer-william-l
- add:
    entry:
      id: cal.1960-01-18.republican-party-congress-2
      when: Jan. 18
      date: '1960-01-18'
      thread: republican-party-congress
      c: 'The Senate Republicans'' Committee on Committees, 10:40 to 11:05 a.m.: the slate for Langer''s seats approved unanimously on Hruska''s motion, Williams to Foreign Relations, Cotton to Judiciary, Morton to Finance. On Javits''s motion, unanimous, it asks the conference for a committee to study assignments.'
      n: '[[w.wolff-minutes-of-the-senate]], 854–56. Names: Langer, Hruska, Williams, Cotton, Morton, Javits.'
      tags:
      - name:langer-william-l
      - name:hruska-roman-l
      - name:williams-john-j
