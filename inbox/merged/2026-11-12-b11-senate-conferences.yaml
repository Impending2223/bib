      - name:eisenhower-dwight-d
      - name:javits-jacob-k
      - name:kuchel-thomas-h
      - name:schoeppel-andrew-f
      also:
      - berlin-and-vienna
- add:
    entry:
      id: cal.1962-01-10.republican-party-congress
      when: Jan. 10
      date: '1962-01-10'
      thread: republican-party-congress
      c: 'Senate Republican conference elects Hickenlooper Policy Committee chairman, 21 to 14 over Saltonstall, on the death of Styles Bridges; made unanimous on Saltonstall''s motion. Thirty-five present. Murphy, appointed for Bridges, introduced. Javits''s resolution that the Committee on Committees propose how to fill vacancies, adopted. Dirksen: Lincoln Day recess Feb. 8–14; the DuPont bill first.'
      n: '[[w.wolff-minutes-of-the-senate]], 895–98 (the vote, 896, read off the page; Javits''s resolution, 897; Dirksen, 897–98). Names: Hickenlooper, Saltonstall, Bridges, Murphy, Javits, Dirksen.'
      tags:
      - name:hickenlooper-bourke-b
      - name:saltonstall-leverett
      - name:bridges-henry-s
      - name:javits-jacob-k
      - name:dirksen-everett
      - name:murphy-maurice-j-jr
- add:
    entry:
      id: cal.1962-01-18.republican-party-congress
      when: Jan. 18
      date: '1962-01-18'
      thread: republican-party-congress
      c: The Senate Republicans' Committee on Committees, Carlson acting chairman, 11:05 to 11:30 a.m., on the Appropriations, Armed Services and Space vacancies and Murphy's committees, by seniority; approved on Boggs's motion, for the conference of Jan. 22. Allott and Javits for a fairer system.
      n: '[[w.wolff-minutes-of-the-senate]], 899–900. Names: Carlson, Murphy, Boggs, Allott, Javits.'
      tags:
      - name:carlson-frank
      - name:murphy-maurice-j-jr
      - name:boggs-james-c
      - name:allott-gordon-l
      - name:javits-jacob-k
- add:
    entry:
      id: cal.1962-01-31.republican-party-congress
      when: Jan. 31
      date: '1962-01-31'
      thread: republican-party-congress
      c: The Senate Republicans' Committee on Committees, Carlson acting chairman, 3:10 to 4:25 p.m., on Schoeppel's seats, Appropriations and Commerce. Its action of Jan. 18 rescinded by unanimous consent; a new slate for the conference, Cotton and Clifford Case to Appropriations, Keating to Commerce. Javits asks why two Republicans of one State may not sit on one committee; recorded "not voting" on it.
      n: '[[w.wolff-minutes-of-the-senate]], 900–02. Names: Carlson, Schoeppel, Cotton, Case, Keating, Javits.'
      tags:
      - name:carlson-frank
      - name:schoeppel-andrew-f
      - name:cotton-norris-h
      - name:case-clifford-p
      - name:keating-kenneth-b
      - name:javits-jacob-k
- add:
    entry:
      id: cal.1962-02-01.republican-party-congress
      when: Feb. 1
      date: '1962-02-01'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-two present, 9:27 to 10 a.m. Carlson, acting for Schoeppel, reports assignments for the vacancies after the deaths of Bridges and Schoeppel; approved. Aiken says a member has waited for Commerce and Judiciary; Williams: stop assigning a third committee until every Senator has two major ones.'
      n: '[[w.wolff-minutes-of-the-senate]], 903–05. See [[cal.1962-01-31.republican-party-congress]]. Names: Carlson, Bridges, Schoeppel, Aiken, Williams.'
      tags:
      - name:carlson-frank
      - name:aiken-george-d
      - name:williams-john-j
      - name:bridges-henry-s
      - name:schoeppel-andrew-f
