- add:
    entry:
      id: cal.1960-01-20.congress
      when: Jan. 20
      date: '1960-01-20'
      thread: congress
      also:
      - democratic-party
      - school-aid
      c: Senate Democrats in conference on S. 8, the emergency federal aid to education bill, 10:40 a.m. to 12:25 p.m.; thirty-eight answer the roll. Hill and McNamara explain the bill, reported 11 to 2. Clark will offer two amendments, funds for college construction and teachers' salaries. Holland counts twenty-six present of sixty-five Democrats and opposes the bill. No vote.
      n: '[[w.ritchie-minutes-of-the-senate]], 544–55 (the roll, 544; the bill''s committee vote, 548; Clark''s amendments, 550–51; Holland''s count, 552; the close, 555). Names: Hill, McNamara, Clark, Holland.'
      tags:
      - name:hill-lister
      - name:mcnamara-patrick-v
      - name:clark-joseph-s
      - name:holland-spessard-l
- add:
    entry:
      id: cal.1960-02.foreign-aid
      when: Feb.
      date: 1960-02
      thread: foreign-aid
      also:
      - congress
      c: 'Eisenhower with the congressional leaders, unpublicized, asks support for his $4.175 billion foreign aid request. Rayburn: members back from abroad are concerned at its poor administration; the President, "highly upset," says that is often an excuse to vote against it. Taber, ranking Republican on House Appropriations: the whole program a "boondoggle."'
      n: '[[w.ritchie-minutes-of-the-senate]], 573 (Johnson''s account to the Senate Democratic Conference, Feb. 18, 1960, of "a recent unpublicized meeting"; the minutes'' words). Names: Eisenhower, Rayburn, Taber. Check: the day; the minutes of Feb. 18 call the meeting recent.'
      tags:
      - name:eisenhower-dwight-d
      - name:rayburn-sam
      - name:taber-john
- add:
    entry:
      id: cal.1960-02-15.congress
      when: Feb. 15
      date: '1960-02-15'
      thread: congress
      also:
      - democratic-party
      - economy
      c: 'Senate Democrats in conference at the freshmen''s request, Muskie speaking for them; Johnson reads a statement on the session''s problems. Douglas leads on the Joint Economic Committee''s report: growth 2.3 percent a year, 1953–59, against 4.6 to 4.7 percent, 1947–53; unemployment 4 percent. Against lifting the 4¼ percent interest ceiling: it would be "unilateral disarmament." Long (La.): the Republicans "want to saddle us with high interest rates for the next twenty years." Adjourned 12:11 p.m.'
      n: '[[w.ritchie-minutes-of-the-senate]], 557–71 (the meeting, 557–60; Johnson''s statement, 561–63; Douglas, 558–59; Long, 560; the interest-rate papers attached, 564–71). Names: Johnson, Muskie, Douglas, Long.'
      tags:
      - name:johnson-lyndon-b
      - name:muskie-edmund-s
      - name:douglas-paul-h
      - name:long-russell-b
- add:
    entry:
      id: cal.1960-02-18.congress
      when: Feb. 18
      date: '1960-02-18'
      thread: congress
      also:
      - democratic-party
      - foreign-aid
      c: 'Senate Democrats in conference, adjourning 10:54 a.m. Clark on the budget: "We cannot be the party of irresponsible spenders." Johnson tells of the leaders'' recent unpublicized meeting with Eisenhower on foreign aid. Symington: the President "is acting like a spoiled child on defense." Douglas, asked by Johnson, says stand firm on the 4¼ percent ceiling.'
      n: '[[w.ritchie-minutes-of-the-senate]], 572–75 (the meeting; Johnson''s account of the White House meeting, 573; Symington''s words, 573; Douglas, 575). See [[cal.1960-02.foreign-aid]]. Names: Clark, Johnson, Eisenhower, Symington, Douglas.'
      tags:
      - name:clark-joseph-s
      - name:johnson-lyndon-b
      - name:eisenhower-dwight-d
      - name:symington-william-s
      - name:douglas-paul-h
- add:
    entry:
      id: cal.1960-03-03.republican-party-congress
      when: Mar. 3
      date: '1960-03-03'
      thread: republican-party-congress
      c: Senate Republican luncheon conference on the civil rights bill, 12:30 to 3:04 p.m., Saltonstall calling it, twenty-nine present. Dirksen asks for views on his package, on cloture and on the more liberal proposals; nineteen Senators speak. A questionnaire of four questions, unsigned, to go to each Republican Senator.
      n: '[[w.wolff-minutes-of-the-senate]], 861–62 (the meeting; the speakers, 862). Names: Saltonstall, Dirksen.'
      tags:
      - name:saltonstall-leverett
      - name:dirksen-everett
- add:
    entry:
      id: cal.1960-03-30.republican-party-congress
      when: Mar. 30
      date: '1960-03-30'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-five present, 10:15 to 11:30 a.m., on the Judiciary Committee''s civil rights bill, H.R. 8601. Dirksen: four of thirty-two amendments adopted, Lausche''s to Section 1 and Kefauver''s on parties at referee hearings among them; he wants a solid party vote should there be a move to strike Section 1. A second cloture petition may be needed, he and Johnson to file it; he fears an extra session if no bill passes before the July adjournment.'
      n: '[[w.wolff-minutes-of-the-senate]], 862–64 (Dirksen''s report, 863–64). Names: Dirksen, Johnson.'
      tags:
      - name:dirksen-everett
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-06-30.republican-party-congress
      when: June 30
      date: '1960-06-30'
      thread: republican-party-congress
      c: 'Senate Republican conference, 9:22 to 10:55 a.m., twenty-four present, called by Dirksen. The recess: no party position; each on his own. Aiken reports no interest in the committee on assignments by seniority; closed for the session. On Eisenhower''s veto of the pay bill Dirksen says the President is right but the Senate will not sustain it; put over to August, the vote might go otherwise. The conference concludes it cannot be deferred.'
      n: '[[w.wolff-minutes-of-the-senate]], 864–66 (the recess, 865; the veto, 866). Names: Dirksen, Aiken, Eisenhower.'
      tags:
      - name:dirksen-everett
      - name:aiken-george-d
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1961-01-03.republican-party-congress
      when: Jan. 3
      date: '1961-01-03'
      thread: republican-party-congress
      c: 'Senate Republican conference organizes the 87th Congress, thirty-three present: Saltonstall chairman, Young secretary, Bridges Policy Committee chairman, Dirksen floor leader, Kuchel whip, each by unanimous ballot; Boggs and Miller introduced. Morton: research on the Cabinet nominees, the Policy Committee the focal point. Dirksen: no course of blind opposition, but modify where necessary.'
      n: '[[w.wolff-minutes-of-the-senate]], 867–71 (the elections, 868–69; Morton, 870; Dirksen, 871). See [[cal.1961-01.republican-party-congress]]. Names: Saltonstall, Young, Bridges, Dirksen, Kuchel, Boggs, Miller, Morton.'
      tags:
      - name:saltonstall-leverett
      - name:young-milton-r
      - name:bridges-henry-s
      - name:dirksen-everett
      - name:kuchel-thomas-h
      - name:morton-thruston-b
      - name:boggs-james-c
      - name:miller-jack-r
- add:
    entry:
      id: cal.1961-01-04.congress-2
      when: Jan. 4
      date: '1961-01-04'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats in conference, Mansfield in the chair, on Gore''s resolution that Policy and Steering Committee vacancies be filled by election. Mansfield''s resolution supersedes it: he names the members, after consulting the president pro tempore, whip and conference secretary, "as representative as possible of the geographic and philosophic composition of the Democratic Conference," subject to confirmation by the conference; voice vote. Pastore''s resolution that the Steering Committee assign Democrats to committees, voice vote. Proxmire takes the leaders'' assurance of periodic caucuses in place of a vote.'
      n: '[[w.ritchie-minutes-of-the-senate]], 581–83 (10:10 a.m. to 12:58 p.m.; the resolution as printed, 583). Names: Mansfield, Gore, Pastore, Proxmire.'
      tags:
      - name:mansfield-mike
      - name:gore-albert-sr
      - name:pastore-john-o
      - name:proxmire-william
- add:
    entry:
      id: cal.1961-01-05.congress
      when: Jan. 5
      date: '1961-01-05'
      thread: congress
      also:
      - democratic-party
      c: Senate Democrats in conference, Mansfield in the chair, 10:10 to 10:50 a.m. Long (La.) offers a resolution that the author of a major amendment in conference be considered in choosing Senate conferees, and that the majority of them be "Senators who voted for the Senate position"; Mansfield promises to consult the committee chairmen; not voted. Clark puts off his rules proposals to Jan. 10.
      n: '[[w.ritchie-minutes-of-the-senate]], 583–85 (the resolution as printed, 584). Names: Mansfield, Long, Clark.'
      tags:
      - name:mansfield-mike
      - name:long-russell-b
      - name:clark-joseph-s
- add:
    entry:
      id: cal.1961-01-10.congress
      when: Jan. 10
      date: '1961-01-10'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats in conference, 10:05 to 11:35 a.m. Mansfield names Dodd, Williams (N.J.) and Clark to the Steering Committee; confirmed. Muskie to the Calendar Committee. Clark withdraws his motion to enlarge the Policy Committee''s voting membership, which the law fixes at seven. The President-elect''s letter on his Cabinet nominees read: he hopes the hearings will be quick; Mansfield: the Senate may sit right after the inauguration to receive the nominations. None of Clark''s rules proposals is voted.'
      n: '[[w.ritchie-minutes-of-the-senate]], 585–88 (the Steering Committee, 585; the Policy Committee''s number, 585–86; the Cabinet message, 587; Clark''s proposals, 587–88). Names: Mansfield, Dodd, Williams, Clark, Muskie.'
      tags:
      - name:mansfield-mike
      - name:dodd-thomas-j
      - name:clark-joseph-s
      - name:muskie-edmund-s
      - name:williams-harrison-a-jr
- add:
    entry:
      id: cal.1961-01-12.republican-party-congress
      when: Jan. 12
      date: '1961-01-12'
      thread: republican-party-congress
      c: 'The Senate Republicans'' Committee on Committees, 3:15 to 4:20 p.m.; Mansfield wants their assignments by Jan. 13. Javits: Space should be a major committee. On Case''s motion, unanimous, the leaders to seek larger Government Operations and Rules Committees, Government Operations major, Rules minor. The slate by seniority approved unanimously, Javits and Allott reserving the right to oppose the seniority rule.'
      n: '[[w.wolff-minutes-of-the-senate]], 878–80. Names: Mansfield, Javits, Case, Allott.'
      tags:
      - name:mansfield-mike
      - name:javits-jacob-k
      - name:case-francis-h
      - name:allott-gordon-l
- add:
    entry:
      id: cal.1961-01-13.republican-party-congress
      when: Jan. 13
      date: '1961-01-13'
      thread: republican-party-congress
      c: Senate Republican conference, twenty present, 10:13 to 10:45 a.m., on committee assignments. Schoeppel moves the Committee on Committees' recommendations; approved, Javits voting "Present." Javits calls the assignments a "rubber stamp" and moves that the committee consult the leadership to suspend seniority; held over under the rules. Goldwater and Allott also against seniority.
      n: '[[w.wolff-minutes-of-the-senate]], 880–83 (the meeting; Javits''s motion, 881–82). See [[cal.1961-01-12.republican-party-congress]]. Names: Schoeppel, Javits, Goldwater, Allott.'
      tags:
      - name:javits-jacob-k
      - name:goldwater-barry-m
      - name:allott-gordon-l
      - name:schoeppel-andrew-f
- add:
    entry:
      id: cal.1961-02-27.congress
      when: Feb. 27
      date: '1961-02-27'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats in conference, Johnson in the chair, 10:10 to 10:35 a.m. Mansfield on four or five White House meetings: "these meetings have been most cordial and most helpful"; the President knows "the line of demarcation" between the branches. He reads the "Must Bills"; in five weeks the Senate has confirmed 14,000 appointments and passed 65 bills. Kerr and Mansfield on adjournment by July 31.'
      n: '[[w.ritchie-minutes-of-the-senate]], 588–91 (the meeting, 588–90; the Leader reads sixteen ''Must Bills'', 589, the program attached lists seventeen items, 590–91; Mansfield''s notes, 591). Names: Johnson, Mansfield, Kerr, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:kerr-robert-s
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-05-16.republican-party-congress
      when: May 16
      date: '1961-05-16'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-nine present, on federal aid to education and Kennedy''s four reorganization plans. Dirksen: the customary resolutions drawn, two introduced; he asks that action on Swidler''s nomination to the Power Commission wait until he learns how the President means to displace Chairman Kuykendall. Goldwater to offer amendments on parochial schools and tax credits; Javits and Cooper on the formula; Case on a 1 percent withholding returned to the States; Allott: the 1960 platform covered construction only.'
      n: '[[w.wolff-minutes-of-the-senate]], 884–86 (the meeting). Names: Kennedy, Dirksen, Swidler, Kuykendall, Goldwater, Javits, Cooper, Case, Allott.'
      tags:
      - name:dirksen-everett
      - name:goldwater-barry-m
      - name:javits-jacob-k
      - name:cooper-john-sherman
      - name:allott-gordon-l
      - name:kennedy-john-f
      - name:swidler-joseph-c
      - name:case-francis-h
      - name:kuykendall-jerome-k
- add:
    entry:
      id: cal.1961-07-10.republican-party-congress
      when: July 10
      date: '1961-07-10'
      thread: republican-party-congress
      also:
      - berlin-and-vienna
      c: 'Dirksen and Halleck call on Eisenhower. By Dirksen''s account to the Senate Republicans next day: a number of subjects discussed; Eisenhower "not too communicative on the Berlin matter."'
      n: '[[w.wolff-minutes-of-the-senate]], 890 (Dirksen''s report to the conference, July 11, 1961, of the visit "on yesterday"; the minutes'' words). Names: Dirksen, Halleck, Eisenhower.'
      tags:
      - name:dirksen-everett
      - name:halleck-charles-a
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1961-07-10.republican-party-congress-2
      when: July 10
      date: '1961-07-10'
      thread: republican-party-congress
      c: 'The Senate Republicans'' Committee on Committees, 10:05 to 10:20 a.m., on Tower''s assignments: Commerce, promised him in the campaign, cannot be had. Banking and Currency and Labor for Tower, Interior for Dirksen, Judiciary for Fong, on Carlson''s motion, unanimous. Javits on the seniority rule''s cost in campaigns.'
      n: '[[w.wolff-minutes-of-the-senate]], 886–87. Names: Tower, Dirksen, Fong, Carlson, Javits.'
      tags:
      - name:tower-john-g
      - name:dirksen-everett
      - name:fong-hiram-l
      - name:carlson-frank
      - name:javits-jacob-k
- add:
    entry:
      id: cal.1961-07-11.republican-party-congress
      when: July 11
      date: '1961-07-11'
      thread: republican-party-congress
      c: Senate Republican conference, thirty present, 9:37 to 10:33 a.m. On Schoeppel's motion it assigns Dirksen, Fong and Tower to committees; on the leaders' recommendation it enlarges the Policy Committee to sixteen for the 87th and names Tower to it. Dirksen reports his and Halleck's visit to Eisenhower the day before; on the U.N., a possible trade of Outer Mongolia's admission for Mauritania's; on Laos "the best judgment was to protect Viet-Nam and Thailand"; on Berlin, firmness. Javits proposes a task force of Senators and outsiders for a Republican statement on Berlin; Kuchel adds nuclear testing.
      n: '[[w.wolff-minutes-of-the-senate]], 888–92 (the assignments, 888–89; Tower and the Policy Committee, 889–90; Dirksen''s report, 890–91; Javits and Kuchel, 891); the minutes'' account of Dirksen, not his words. See [[cal.1961-07-10.republican-party-congress]]. Names: Schoeppel, Dirksen, Fong, Tower, Halleck, Eisenhower, Javits, Kuchel.'
      tags:
