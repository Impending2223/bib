      c: 'The South Vietnamese government to the International Control Commission: the increased U.S. military aid it has asked, for the "flagrant violations of the 1954 Agreement" by the DRV, "can be terminated" once the North ends its aggression and respects the Geneva Accords.'
      n: '[FRUS 1964–68, II, doc. 32](https://history.state.gov/historicaldocuments/frus1964-68v02/d32) (Taylor, Jan. 22, 1965: "the GVN letter of December 9, 1961 to the ICC"). To check: the letter''s text.'
      tags:
