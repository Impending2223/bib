- add:
    entry:
      id: cal.1965-01-21.vietnam-2
      when: Jan. 21
      date: '1965-01-21'
      time: 1965-01-22T00:52Z
      time_zone: America/New_York
      place:
      - washington
      - saigon
      thread: vietnam
      c: 'Rusk to Taylor, Department of State 1509, 7:52 p.m., answering his 2186: the view remains that the dependents should be withdrawn. Taylor to put it to Hương, Viên with him if he wishes, with the substance of the proposed statement only, and to say that no decision to evacuate has been taken. The statement acceptable in substance, but to be made first in Washington; two sentences cut, lest they invite terror; readiness "to take whatever action may be required." The other governments told here first, each free to decide (in Laos in 1960 most left their dependents); private Americans to decide for themselves; Pan American may drop Saigon. A month to carry out the evacuation acceptable; with any reprisal, a much stepped-up evacuation of the rest.'
      n: '[FRUS 1964–68, II, doc. 31](https://history.state.gov/historicaldocuments/frus1964-68v02/d31) (drafted by Unger, cleared by Cooper, McNamara and Rusk, approved by William Bundy; Top Secret, Immediate, Nodis). See [[cal.1965-01-18.vietnam]] (Taylor''s 2186); [[cal.1965-01-21.vietnam]] (Johnson to the leaders on the dependents). Names: Rusk, Taylor, Trần Văn Hương.'
      tags:
      - name:rusk-dean
      - name:taylor-maxwell
      - name:tran-van-huong
