      c: 'Taylor to Rusk, Saigon 2186, 9 p.m.: before he sees Hương on evacuating the dependents (General Viên with him, he and Alex Johnson think), answers wanted. A draft statement: the charge found at the pool on Jan. 16 shows Americans, wives and children among them, now Viet Cong targets; the wives and children to leave South Vietnam on a phased schedule. His questions: the other governments, private Americans and tourists, Pan American''s service, Free World aid, the time (a month at least, no air of emergency; a reprisal meanwhile, then a faster evacuation). A reprisal within twenty-four hours: the clock to run from verification; the Brink bombing took about 29 hours to confirm; six to ten targets approved ahead, the Prime Minister''s concurrence, aircraft on alert at Đà Nẵng; the weather may delay days. No presidential statement: act, not talk, as the Thais and Souvanna hold; the first statement Saigon''s, the first bombs the VNAF''s.'
      n: '[FRUS 1964–68, II, doc. 28](https://history.state.gov/historicaldocuments/frus1964-68v02/d28) (Secret, Priority, Nodis; referring to Deptel 1477, doc. 27, and the position paper of Dec. 7, 1964, FRUS 1964–68, I, doc. 433). To check: [FRUS 1964–68, II, doc. 27](https://history.state.gov/historicaldocuments/frus1964-68v02/d27) (Deptel 1477). See [[cal.1965-01-14.vietnam]]; [[cal.1964-12-07.vietnam]] (the position paper); [[cal.1964-12-24.vietnam]] (the Brink); [[cal.1965-01-16.vietnam-operations]] (the pool). Names: Taylor, Rusk, Trần Văn Hương, U. Alexis Johnson, Souvanna Phouma. Check: the name of General Viên, not further given.'
