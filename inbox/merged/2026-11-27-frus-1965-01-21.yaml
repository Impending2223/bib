      id: cal.1965-01-22.program
      when: Jan. 22
      date: '1965-01-22'
      time: 1965-01-22T22:40Z
      time_zone: America/New_York
      place: washington
      thread: program
      also:
      - vietnam-congress
      c: 'Johnson with the Democratic chairmen of the Senate committees, 5:40–7:25 p.m. Each reports the timetable of his committee''s major bills; Johnson reviews at length his efforts to hold down the cost of government. More than half the time goes to Vietnam, led by Fulbright. Johnson: he agrees totally with all Fulbright has said and with his review of the problems, but no one in the room has an answer.'
      n: '[[w.gibbons-u-s-government-and]], III, 41 and n.103 ("That afternoon"; the notes dictated to Juanita Roberts by O''Brien and by Ramsey Clark, who attended, by Gibbons''s account apparently the only notes, give no more on Vietnam). To check: Diary Backup, Jan. 22, 1965, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 41 n.103). See [[cal.1965-01-21.vietnam]]; [[cal.1965-01-21.program]] (the House chairmen "the day before" by Gibbons, Vietnam not discussed). Names: Johnson, Fulbright. Check: the day. Gibbons sets this the afternoon of the leaders'' meeting, which he dates Jan. 22 and FRUS Jan. 21; the Diary Backup he cites is of Jan. 22.'
      tags:
      - name:johnson-lyndon-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1965-01.vietnam-congress
      when: Jan.
      date: '1965-01'
      thread: vietnam-congress
      c: 'Jonathan Moore to William Bundy, "Congressional Attitudes on SVN": "generalized frustration" with the war; most members neither satisfied nor dissatisfied, ready to go along with the Executive Branch''s experts, more of the rest for doing more militarily than for withdrawing. The House keeps with the herd; more senators take stands, some moving toward negotiation and neutralization. Support adequate for the moment, largely passive. A group of fairly junior Senate liberals, Church, McGovern, Gore, Pell and Nelson, partly dormant but growing in size and boldness, for an honorable withdrawal under international safeguards; the larger Monroney–Saltonstall–Scott group with the Administration. Without more effort on the Hill, support could erode; public opinion moving toward the middle.'
      n: '[[w.gibbons-u-s-government-and]], II, 396–97 and n.136 (the survey of the Senate and the House by State Department staff during January; the Senate rundown; the conclusion); [[w.gibbons-u-s-government-and]], III, 39 and n.100 (no date, written in January 1965; Kennedy Library, Thomson Papers, the folder 1-65 to 2-65; the three points). To check: Moore to William Bundy, "Congressional Attitudes on SVN," Jan. 1965, Thomson Papers, Kennedy Library (cited by [[w.gibbons-u-s-government-and]], III, 39 n.100). See [[cal.1965-01-15.vietnam-congress]]. Names: Moore, William Bundy, Church, McGovern, Gore, Pell, Nelson, Monroney, Saltonstall, Scott. Check: the day.'
      tags:
