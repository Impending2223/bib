      c: 'Taylor to the Department, Saigon 2235, 1 p.m.: before Phase II is taken up with Saigon, the objectives and terms of a settlement. A return to the 1954 Accords enough; no new agreement needed. Demands on Hanoi: stop the infiltration and bring about "a cessation of VC armed insurgency"; the Viet Minh out of Laos, the ICC free there. Offers: safe passage north and amnesty for the Viet Cong, no force against the DRV, a return over time to the 1954 ceilings (about 600 advisers), trade talks. Talks between Saigon and Hanoi, at the military level in the DMZ under the ICC; no cease-fire with strung-out negotiations; the National Liberation Front no party. Comments asked of Vientiane and Bangkok; a copy for Ambassador Martin, in the United States.'
      n: '[FRUS 1964–68, II, doc. 32](https://history.state.gov/historicaldocuments/frus1964-68v02/d32) (Top Secret, Exdis; also to CINCPAC, repeated to Vientiane). See [[cal.1964-12-01.vietnam]] (the two phases); [[cal.1961-12-09.vietnam-diplomacy]] (Saigon''s letter to the ICC). Names: Taylor, Martin.'
      tags:
      - name:taylor-maxwell
      - name:martin-graham-a
