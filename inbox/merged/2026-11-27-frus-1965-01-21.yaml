      gloss:
        title: Commentary
        text:
        - 'Gibbons (1988): no expressions of dissent from the leaders, and only one "direct statement of support," Ford''s ([[w.gibbons-u-s-government-and]], III, 41).'
        - 'Logevall (1999): Rusk misrepresented the Administration''s position on negotiations, failing to say that it opposed a return to Geneva, and wrongly said the United States welcomed a fourteen-power conference on Laos; McNamara exaggerated the results of the covert operations and of Barrel Roll, and the South Vietnamese army''s gains; the hawks well represented, Mansfield the only critic there, and silent; "the campaign of deception on Vietnam" already "in full swing" ([[w.logevall-choosing-war]], 314–15).'
        - 'Mann (2001): the briefing designed "not so much to inform, but to inflame"; statistics and anecdotes to bolster the case for greater intervention, no advice sought; Johnson led the group to believe he still strongly opposed escalation ([[w.mann-grand-delusion]], 390).'
