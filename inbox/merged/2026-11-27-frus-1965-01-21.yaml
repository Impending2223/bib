      c: 'Taylor to Johnson, Saigon 2207, 5 p.m., the week''s report: the cabinet''s presentation called off on the 19th by Khánh, Kỳ''s complaint that no civilian minister was purged. Hương now to replace Foreign Minister Lâm and Health Minister Diệu after Tết, about Feb. 5, Lâm''s count against him a tie to "Big" Minh; the presentation reset for 5 p.m. today. The generals'' "consensus of views" a thinly disguised caucus; Khánh pulling the strings. Viet Cong incidents down; 422 Viet Cong killed in action, 146 of the government''s; pacification sluggish.'
