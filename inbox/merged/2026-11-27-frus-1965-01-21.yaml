      c: 'Johnson with the congressional leaders of both parties, 10:07 a.m.–12:45 p.m., Russell and Fulbright not asked.{1} A stable government in Saigon first.{2} More American forces not needed "short of a decision to go to full-scale war."{3} Johnson opens: "We do not separate Democrats and Republicans in Vietnam." Vietnam is his worst problem, one he "wrestles with all the time, day and night." Rusk: political instability is the greatest problem. McNamara puts infiltration since 1959 at 19,000 to 34,000. Long asks why not push into North Vietnam; Dirksen asks why not bring the dependents home, "We are pampering our forces in South Vietnam."{4} Thirteen lawmakers attend, among them Mansfield, Dirksen, Long, Smathers, Ford, Laird and McCormack; Johnson says he wants the meeting kept small.{5} The others: Senators Aiken, Kuchel and Saltonstall; Representatives Albert, Arends and Boggs. With them Humphrey, Rusk, McNamara, McCone, Bundy and O''Brien; Busby, Cater, Moyers, Reedy and Valenti for part.{19} Johnson wants procedures for the Administration to think and plan with the leaders; he will be frank if nothing reaches the public. Eisenhower''s way of consulting the leaders the best he has known. Rusk has briefed the committees; McNamara to go to the Hill. Johnson will meet any leader at any time.{6} On the dependents: he fears Viet Cong attacks on Americans in Saigon, and Hanoi''s bombs on the city, if the U.S. strikes the North. Taylor and others in Saigon oppose sending them home; he has thought for over fourteen months they should come. He has no "Lincoln Cabinet": the decision still being explored. If women and children were lost, the people would hold him responsible.{7} Foreign relations to be dealt with without politics: Kennedy had Republican support, Truman had Vandenberg; "The Administration has no mortgage on patriotism." He wants Republicans in on "take-offs rather than merely at the time of crash landings." The responsibility his; he wants all views. Never more willingness to weigh foreign policy and defense by the national interest, not party. He praises McCone, whom he is keeping in government, and Rusk and McNamara, who lost over $4 million leaving industry for Defense. His aim: a country united in the eyes of the world, a nuclear holocaust avoided, the nation defended.{8} Johnson, breaking in on Rusk: friendly states hold back aid for fear the country "goes to pieces politically." Rusk: Hanoi thinks it can win by holding on while the instability grows. The new cabinet a compromise between civilians and the military. The lines kept open for a settlement on the 1954 or the 1962 agreement; if the Communists will not return to them, "a very difficult time." Laos a "thermometer" of what is possible: the three factions'' talks may lead to a fourteen-nation conference, and a settlement on the 1962 agreements would help in South Vietnam.{9} McNamara: Viet Cong strength estimates up; infiltration up substantially, now perhaps near 10,000 a year. South Vietnamese forces growing too, hoped up by 87,000 in 1965; desertions high. To Saltonstall: deserters go home, not to the Viet Cong. Killed in 1964: 17,000 Viet Cong, 7,500 South Vietnamese; Americans killed since 1954: 245. To Saltonstall on the disparity: ten to one needed to win a guerrilla war; more South Vietnamese troops, not more U.S. forces.{10} Johnson: the ratio now about 5 to 1.{21} The war to be fought by the South Vietnamese: "we have to count on their fighting their war."{22} Dirksen cites Keyes Beech of the *Chicago Daily News*, "a reliable correspondent." Johnson challenges that: Beech reported in December that Taylor was returning to Washington, threatening to resign unless the President ordered attacks on the North; Taylor flatly denied it and telephoned the White House from Honolulu.{11} Johnson, after Long''s question: he called the leaders to inform them in general and to work out meetings every few weeks, not to go through all the details. He warns again against leaks: if reporters learn what the leaders are told, "all would be lost."{12} Long: perhaps he should not be told all the details, but he wants an answer why the U.S. does not move against North Vietnam. McNamara: the covert program against the North, South Vietnamese forces trained by the U.S., some now in use; teams dropped in North Vietnam; attacks from the sea on its coast. Semi-covert, at Souvanna Phouma''s request: more than 450 reconnaissance missions over Laos facilitated, four U.S. aircraft lost, Pathet Lao forces found moving into the Panhandle. The recent bombing of the bridge at Ban Ken, not officially confirmed, by U.S. planes on armed reconnaissance: the bridge heavily defended by antiaircraft guns, beyond the Lao T-28s. To Saltonstall, whether the aim is Laos or Vietnam: both.{13} McNamara on the dependents: the U.S. political and military officers in Saigon do not want them sent home, for the effect in Southeast Asia and on personnel; 1,700 dependents of government personnel, besides those of non-U.S. personnel and of some other non-government Americans.{14} Johnson, after Dirksen: for fourteen months he has agreed with those who want the dependents brought home; the officers in Saigon still oppose it.{15} Ford shares the "Vandenberg philosophy"; his relations with Rusk, McNamara and McCone are excellent; the opposition party will cooperate and take no position harmful to the national interest. He agrees with the course in South Vietnam; the commitment must be kept. With 25,000 to 30,000 infiltrated since 1959, how can the ratio better 5 to 1 if infiltration keeps rising? Should military action cut it down? He hopes for frequent, regular meetings.{16} Smathers asks why the Navy is not used to halt infiltration by sea; some Navy officers, he says, see many unused ways. McNamara: sea infiltration almost stopped; South Vietnamese ships, under a program the U.S. began, patrol all sea areas and stop and search every junk moving south. Part of the land border is under water, with no solution found; infiltration across the water borders goes on.{17} Talk also of Europe, the Congo, Egypt, Indonesia and West New Guinea, Pearson''s visit, Burundi, the Sudan, the Middle East, Germany, the Alliance for Progress, the defense posture, China, defense research, Soviet nuclear testing, the Kennedy Round, nonproliferation and Sino-Soviet relations.{20} Johnson reads parts of a draft press statement, asks for objections, hears none and authorizes its issue.{18}'
      n: '[FRUS 1964–68, II, doc. 30](https://history.state.gov/historicaldocuments/frus1964-68v02/d30) (Bromley Smith''s notes, which Branch, 563, cites as his minutes of Jan. 22 in the Bundy files; the source text dated Jan. 22, the editors giving the President''s Daily Diary''s Jan. 21, 10:07 a.m.–12:45 p.m., note 1; those present, note 1; the talk on the other matters given by the editors in brackets only; no answer to Ford''s question printed, the talk after it given in brackets only; the press statement attached to the notes, not printed). [[w.gibbons-u-s-government-and]], III, 39–41 (Jan. 22, 10:00 a.m.–12:40 p.m.; those present, 39–40 n.101; the procedures, the goal of a united country, Rusk on the agreements, McNamara''s 10,000 a year and ten to one, the war the South Vietnamese''s to fight, 40; the covert operations and Barrel Roll, 40–41; Ford, 41); [[w.branch-pillar-of-fire]], 563 (Friday morning, Jan. 22; Vietnam the worst problem; no air operations while the dependents remain; Long for bombing the North; Dirksen for the dependents'' return, "Why do we have to send all our civilization to war?"); [[w.logevall-choosing-war]], 314–15 (the meeting of Jan. 21, the day after the inauguration, no hour: Russell and Fulbright not invited; Mansfield, Dirksen and Ford among the thirteen lawmakers; Johnson, "There are no Democrats or Republicans on Vietnam"); [[w.logevall-choosing-war]], 315. [[w.mann-grand-delusion]], 390 (Jan. 21; the Republicans "in on foreign policy take-offs"; Johnson on more U.S. forces). Made public: [[w.gibbons-u-s-government-and]], III, 39–41 (1988); in full, FRUS 1964–68, II (1996). Check: the day and the hour. FRUS''s note 1 has the source text at Jan. 22 and the President''s Daily Diary (not seen) at Jan. 21, 10:07 a.m.–12:45 p.m.; Gibbons (III, 39) has Jan. 22, 10:00 a.m.–12:40 p.m., the Senate Democratic chairmen that afternoon, and the House chairmen "the day before" (41); Branch (563) Friday morning; Logevall (314) and Mann (390) Jan. 21. Check: Branch sets the meeting Friday, Jan. 22, by Bromley Smith''s minutes of that date (563). Check: Mrs. Johnson''s diary (230–31) has Johnson at 10 a.m. this day in the Yellow Room with the House leadership and the committee chairmen, on the legislative program; [[cal.1965-01-21.program]]. Check: Branch (563) gives to Rusk the allies'' fear of aiding an unstable South Vietnam, which the notes give to Johnson, breaking in; Logevall (315) has the war "must be fought by the South Vietnamese" as Johnson''s closing words, which the notes put after McNamara''s figures. To check: the President''s Daily Diary, Jan. 21, 1965; the press statement (attached to the notes, LBJ Library). See [[cal.1964-12-01.vietnam]] (Johnson''s conference with Taylor in December); [[cal.1964-10-19.congress]] (the last meeting with the leaders, October); [[cal.1965-01-13.laos]] (the Ban Ken bridge); [[cal.1965-01-15.vietnam-congress]] (Rusk before Foreign Relations); [[cal.1964-12.vietnam-7]] (Beech''s report). Names: Johnson, Russell, Fulbright, Rusk, McNamara, Mansfield, Dirksen, Long, Smathers, Ford, Laird, McCormack, Aiken, Kuchel, Saltonstall, Albert, Arends, Boggs, Humphrey, McCone, Bundy, O''Brien, Busby, Cater, Moyers, Reedy, Valenti, Eisenhower, Taylor, Kennedy, Truman, Beech, Souvanna Phouma, Pearson.'
