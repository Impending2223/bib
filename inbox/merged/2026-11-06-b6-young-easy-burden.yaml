- add:
    entry:
      id: cal.1966-06-06.civil-rights-organizations
      when: June 6
      date: '1966-06-06'
      thread: civil-rights-organizations
      also:
      - mississippi-meredith
      c: 'Atlanta, SCLC''s staff meeting, at the radio''s report that Meredith is shot and the first word that he is dead.
        Hosea Williams: "If they killed James Meredith we gotta do something," and for flying to Memphis at once; Young for
        deciding first; the two nearly come to blows. Most of the staff go, King with them; Young and Bevel stay in Atlanta.'
      n: '[[w.young-easy-burden]], 393–94. Young''s account. See [[cal.1966-06-06.mississippi]]. Names: Hosea Williams, Young,
        Martin Luther King.'
      src:
        c: 7d455649
        rows:
        - 'w.young-easy-burden 393–94: all'
      tags:
      - name:williams-hosea
      - name:young-andrew-j-jr
      - name:king-martin-luther-jr
      follows:
      - cal.1966-06-06.mississippi
- add:
    entry:
      id: cal.1966-06-07.mississippi-meredith-2
      when: June 7
      date: '1966-06-07'
      thread: mississippi-meredith
      also:
      - civil-rights-organizations
      c: 'King, by telephone, to Young in Atlanta: SCLC is taking major responsibility for the march; come to Mississippi
        at once. Young goes.'
      n: '[[w.young-easy-burden]], 395. Young''s account. Check: the day; Young places the call after the leaders'' vow at
        Meredith''s bedside in Memphis. See [[cal.1966-06-07.mississippi-meredith]]. Names: Martin Luther King, Young.'
      src:
        c: 267dcd11
        rows:
        - 'w.young-easy-burden 395: all'
      tags:
      - name:king-martin-luther-jr
      - name:young-andrew-j-jr
- add:
    entry:
      id: cal.1966-07.africa
      when: July
      date: 1966-07
      thread: africa
      also:
      - civil-rights-organizations
      c: Château de Bossey, near Geneva. Young, of SCLC, for the United Church of Christ at the World Council of Churches'
        board, which he gives as that of the Programme to Combat Racism; meets Sam Nujoma, leader of SWAPO, and José Chipenda
        of Angola.
      n: '[[w.young-easy-burden]], 410–11. Young''s account. Check: the month; Young gives "that summer," after the Chicago
        riot; and the board''s name. Names: Young.'
      src:
        c: a8dc3ede
        rows:
        - 'w.young-easy-burden 410–11: all'
      tags:
      - name:young-andrew-j-jr
- add:
    entry:
      id: cal.1967-07.mayors
      when: July
      date: 1967-07
      thread: mayors
      also:
      - king
      - elections-1967
      c: 'Cleveland, during Stokes''s campaign. A woman at a corner in the ghetto calls King an "Uncle Tom"; King has the
        car turned round and asks her and her friends to the Sheraton-Cleveland at three. There, to the women, on registering
        and voting: "We can get rid of this ghetto if we go to work politically."'
      n: '[[w.young-easy-burden]], 436–37. Young''s account. Check: the month; Young gives only "during the mayoral campaign,"
        SCLC''s staff in Cleveland from the summer of 1967. See [[cal.1967-10-03.mayors-cleveland]]. Names: Martin Luther
        King.'
      src:
        c: 73ac2a80
        rows:
        - 'w.young-easy-burden 436–37: all'
      tags:
      - name:king-martin-luther-jr
