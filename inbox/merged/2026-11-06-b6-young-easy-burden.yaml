- add:
    entry:
      id: cal.1963-08-26.march-on-washington
      when: Aug. 26
      date: '1963-08-26'
      thread: march-on-washington
      also:
      - king
      c: Washington, the Willard. King, arrived a couple of days before the March, finds Young and Bevel absent from SCLC's
        staff and calls them to come. Young flies up with his wife; Bevel stays in the South.
      n: '[[w.young-easy-burden]], 271. Young''s account. Check: the day; Young gives only "a couple of days before the march."
        See [[cal.1963-08-28.march-on-washington]]. Names: Martin Luther King, Young.'
