      id: cal.1963-05-12.alabama-birmingham-3
      when: May 12
      date: '1963-05-12'
      thread: alabama-birmingham
      c: 'Atlanta, Sunday morning. King, by telephone, to Young, home for the cooling-off period: the motel and A. D. King''s
        house bombed; back to Birmingham, lest the agreement be lost to retaliation.'
      n: '[[w.young-easy-burden]], 249. Young''s account. See [[cal.1963-05-11.alabama]]. Names: Martin Luther King, Young.'
