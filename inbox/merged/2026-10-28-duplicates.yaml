- edit:
    id: cal.1963-11-25.assassination
    base: 29c491f7
    set:
      c: Funeral. Requiem mass at St. Matthew's; burial at Arlington. De Gaulle, Erhard, Haile Selassie, and Mikoyan among the mourners. A national day of mourning by proclamation.
      n: '[Proclamation 3561—National Day of Mourning for President Kennedy](https://www.presidency.ucsb.edu/documents/proclamation-3561-national-day-mourning-for-president-kennedy) (Nov. 23, 1963). [President''s Daily Diary, Nov. 25, 1963](https://catalog.archives.gov/id/192433), images 2, 3 (LBJ Library; National Archives Catalog). To check: [[w.zelizer-covering-the-body]]. See [[cal.1963-11-22.assassination]]; [[cal.1963-11-25.succession]] (the governors). Names: de Gaulle, Erhard, Haile Selassie I, Mikoyan.'
