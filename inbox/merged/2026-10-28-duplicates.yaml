      c: Phước Thành. About three Viet Cong battalions take Phước Vĩnh, the capital of the new province, on the edge of War Zone D, the night of Sept. 17–18, shortly after midnight, and hold it some hours; the province chief and his assistant executed in the market place. The first provincial capital taken.
