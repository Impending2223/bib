- edit:
    id: cal.1968-08-19.testing
    base: 840f1379
    set:
      c: 'Dobrynin to Rusk, a handwritten note: Moscow "positive" on Johnson''s wish to meet the Soviet leaders in the Soviet Union, in the first ten days of October; Leningrad acceptable; an announcement soon, a joint text proposed. Rostow cables it to Johnson, flying to Detroit. Back at the White House that night, Johnson agrees with Rusk and Rostow to announce it Aug. 21, by his account.'
      n: 'FRUS 1964–68, XIV, docs. [285](https://history.state.gov/historicaldocuments/frus1964-68v14/d285), [286](https://history.state.gov/historicaldocuments/frus1964-68v14/d286) (Rostow''s cable to Johnson). [[w.johnson-vantage-point]], 487 (the note, the cable, the decision that night). Made public: FRUS 1964–68, XIV (2001). See [[cal.1968-07-25.testing]]. Names: Dobrynin, Rusk, Johnson, Rostow.'
