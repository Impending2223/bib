    set:
      c: Supplemental military authorization signed, [80 Stat. 36](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg36.pdf). The appropriation, some $13 billion, before Congress later the same day.
      n: Remarks at the Signing of the Supplemental Military Authorization Bill, [1966 Pub. Papers 321](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=397) (Mar. 15, 1966). See [[cal.1966-01-19.vietnam]]; [[cal.1966-03-15.congress]] (the House's vote).
- edit:
    id: cal.1961-01-03.rules
    base: 93bb7c9d
    set:
      c: 87th Congress convenes. Senate 65 D–35 R, Hickey (D) appointed in Wyoming for Keith Thomson (R), elected and dead in December; House 263–174. Rayburn Speaker; Mansfield and Humphrey lead the Senate Democrats, Dirksen and Kuchel the Republicans; Halleck the House Republicans.
      n: '[Cong. Rec., Senate, Jan. 3, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-1-1.pdf). [House roll call 1](https://voteview.com/rollcall/RH0870001). To check: [[w.hardeman-rayburn]]. See [[cal.1961-01-03.congress]] (the Democrats'' conference). Names: Hickey, Thomson, Rayburn, Mansfield, Humphrey, Dirksen, Kuchel, Halleck.'
