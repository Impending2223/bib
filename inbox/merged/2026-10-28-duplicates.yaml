- edit:
    id: cal.1967-11-20.elections-1968
    base: e943fe58
    set:
      c: 'Night, the Westmorelands at the White House, Russell at dinner. Johnson to Westmoreland, by his notes: McNamara leaving, Clifford to succeed him; his health not good, he and his wife tired; he does not plan to run in 1968. How would the troops take it? Westmoreland: told why, they would understand. By Johnson''s account, after dinner in the family quarters: would the men in Vietnam think themselves let down? "Mr. President, I do not believe so."'
      n: '[[w.gibbons-u-s-government-and]], IV, 900 (Westmoreland''s history notes for Nov. 20, 1967, CMH, Westmoreland Papers; all but Johnson''s account); [[w.johnson-vantage-point]], 429, 434 (Johnson''s account). To check: [[w.westmoreland-soldier-reports]], 233. See [[cal.1967-10-03.elections-1968]]. Names: Johnson, Westmoreland, Russell, McNamara, Clifford. Check: the day of Johnson''s account, which gives none; taken as Nov. 20, by Westmoreland''s notes.'
