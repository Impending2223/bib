        86 (the memorandum; "a stronger position"); [[w.gibbons-u-s-government-and]], III, 107 (the memorandum, drafted by Hughes, sent Feb. 17; the exclusion). Check: Gibbons gives the exclusion as his
        inference ("probably confirmed"); no record of Johnson''s reaction. To check: [[w.humphrey-education-of-a-public-1976]], 320–24 (the text, cited by [[w.gibbons-u-s-government-and]], III, 107 n.27);
