      when: May 13
      date: '1962-05-13'
      thread: laos
      c: McCone, McNamara and Lemnitzer with Eisenhower on Laos, Vietnam and Thailand. If Laos is lost, South Vietnam and Thailand will follow; the forces for Thailand approved; Laos to be partitioned if
        it can be; no American combat troops into Laos now. He will try to keep his party's leaders out of public debate.
