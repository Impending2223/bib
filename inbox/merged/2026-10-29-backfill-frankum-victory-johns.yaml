      c: 'Humphrey to Johnson, on the war''s politics: 1965 "the year of minimum political risk"; the administration "in a stronger position" to cut losses "than any Administration in this century"; the
        opposition at home "more Democratic than Republican." Humphrey kept from the Vietnam councils for a time after.'
