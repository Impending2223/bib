        "would just be warming up"; "I see Nixon is raising hell about it today. Goldwater too." Neutralize, "totally impractical"; or go in.'
      n: '[Johnson and John Knight, 5:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-knight-february-3-1964), Conversation WH6402-03-1839 (Miller Center). [[w.johns-vietnams-second-front]],
