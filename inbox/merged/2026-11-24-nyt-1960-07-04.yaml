patch: 2026-11-24-nyt-1960-07-04
by: 'Claude (reader, New York Times, July 4, 1960, from the owner''s screenshots of Nov. 23; inventory notes/nyt/1960-07-04.md), Nov. 24, 2026'
ops:
- primary:
    id: cal.1960-07-03.elections-1960
    text: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 4 ("Johnson Supports Truman in Criticizing Convention," "Johnson Upholds Truman''s Opinion," Washington, July 3: Johnson on the American Broadcasting Company''s "College News Conference"; agrees with Truman that the convention has "aspects of a prearranged affair"; Butler set it up without consulting him; would serve "from running the elevator to the top job"; no talks with Kennedy on second place; his announcement within days)'
    units: '?'
- primary:
    id: cal.1960-07-02.immigration
    text: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 ("Congress Passes Cuba Sugar Bill": the refugee bill among those passed before the recess, some 5,000 European refugees, one for every four the other countries take; the conferees drop Fong''s amendment for 4,500 from the Far East and the Middle East; Walter against)'
    units: '?'
- primary:
    id: cal.1960-07-02.china-leadership-2
    text: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 3 ("Nepal Moves Troops," Katmandu, July 3, dispatch of the *Times*, London: Zhou''s letter received; the troops to withdraw six and a quarter miles from the border; the apology; Peking admits ten seized)'
    units: '?'
- add:
    entry:
      id: cal.1960-07-03.cuba-2
      when: July 3
      date: '1960-07-03'
      place: washington
      thread: cuba
      also: [congress]
      c: 'Congress passes the sugar bill. Conferees agree; House by a unanimous shout; Senate, after two hours, 32–24. The President to set Cuba''s quota for 1960 and the first quarter of 1961 at any figure; cuts made up from fifteen other countries, the Philippines 15 percent of the rest; the President may allot 160,000 tons to domestic growers.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 2 ("Congress Passes Cuba Sugar Bill; Quits till August," Washington, July 3: the conferees at 4:15 a.m., the House at 5:50; Cooley led the House''s fight; Macomber and Harlow carried word the President would be "furious"); William M. Blair, "Stakes Were High for Sugar Lobby" (McCormack and John O''Donnell, for the Philippine growers, after 5 a.m.); Tad Szulc, "Cuba Awaits Cut by U.S. on Sugar," Havana, July 3. Check: the vote''s question and the bill''s number. To check: 106 Cong. Rec. (1960). Law: [[cal.1960-07-06.cuba-2]]. Names: Cooley, McCormack.'
      tags: [name:cooley-harold-d, name:mccormack-john-w]
      time_range:
        - 1960-07-03T08:15Z
        - 1960-07-03T12:30Z
      time_band: morning
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-03.congress
      when: July 3
      date: '1960-07-03'
      place: washington
      thread: congress
      c: Congress recesses for the conventions. Senate, in session since 10 a.m. July 2, more than twenty-two hours, quits at 8:33 a.m.; House, sitting since noon, at 8:51. House to return Aug. 15; Senate Aug. 8.
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1 ("Congress Passes Cuba Sugar Bill; Quits till August"). Pending: aid to schools, minimum wage, medical aid for the aged, housing, the size of the foreign aid appropriation. See [[cal.1960-06-29.congress]].'
      time_range:
        - 1960-07-03T12:33Z
        - 1960-07-03T12:51Z
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-03.congress-2
      when: July 3
      date: '1960-07-03'
      place: washington
      thread: congress
      c: Congress passes the Senate's version of Summerfield's bill against obscene mail. Post Office may stop an addressee's mail only by a court order on probable cause.
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 ("Congress Passes Cuba Sugar Bill": the Post Office had asked forty-five days'' stop orders, and the House passed the bill so; the compromise passed the Senate without objection). Check: the hour and the bill''s number. Names: Summerfield.'
      tags: [name:summerfield-arthur-e]
- add:
    entry:
      id: cal.1960-07-02.press-and-broadcasting
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: press-and-broadcasting
      also: [congress]
      c: House leaders lay aside until Aug. 15 the Senate-passed bill relaxing equal time; for President and Vice President, stations bound only to the two major parties' nominees. Oren Harris, chairman of Interstate Commerce, to call it up Aug. 15.
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html) ("Equal-Time Bill Tabled," Washington, July 3, UPI: "yesterday"; page not shown). Names: Harris.'
      tags: [name:harris-oren]
- add:
    entry:
      id: cal.1960-07-03.elections-1960-rockefeller
      when: July 3
      date: '1960-07-03'
      thread: elections-1960-rockefeller
      also: [cuba]
      c: 'Rockefeller on CBS''s "Face the Nation": the Republican leadership does not want a contest of men or issues, "a mistake"; Nixon could not win in a popular election far from New York''s stand; odds 99 to 1 on his nomination. On Cuba, a meeting of foreign ministers; the sugar premium might be impounded for the expropriated.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 28 (Douglas Dales, "Rockefeller Says G.O.P. Bars a Test of Men and Issues": Percy to come to New York next week on the platform; no plan to have his name placed). Names: Rockefeller, Nixon, Percy.'
      tags: [name:rockefeller-nelson, name:nixon-richard-m, name:percy-charles-h, ok:fields-place]
- add:
    entry:
      id: cal.1960-07-03.elections-1960-nomination
      when: July 3
      date: '1960-07-03'
      thread: elections-1960-nomination
      c: 'Collins, the convention''s permanent chairman, on NBC''s "Meet the Press": an orderly procedure for changes of votes during a roll call, fair to all. Has telegraphed Truman twice, without answer, urging him to attend.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html) ("Collins Pledges Fair Convention," Los Angeles, July 3: the second telegram sent July 2; Loveless''s Rules Committee weighing a rule; page not shown). Names: Collins, Truman.'
      tags: [name:collins-leroy, name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-03.elections-1960-nomination-2
      when: July 3
      date: '1960-07-03'
      place: nyc
      thread: elections-1960-nomination
      c: 'Harriman, on WRCA-TV''s "Searchlight": Truman''s charge will not move many; the convention "entirely open." Expects New York''s delegation to cast at least 105 votes for Kennedy on the first ballot.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 ("Harriman Doubts Truman''s Charge"). See [[cal.1960-07-02.elections-1960-2]]. Names: Harriman, Truman, Kennedy.'
      tags: [name:harriman-w-averell, name:truman-harry-s, name:kennedy-john-f]
- add:
    entry:
      id: cal.1960-07-03.elections-1960-nomination-3
      when: July 3
      date: '1960-07-03'
      thread: elections-1960-nomination
      also: [press-and-broadcasting]
      c: Kennedy to answer Truman at his own news conference, the Roosevelt Hotel, New York, July 4. NBC, by Kintner's telegram, to carry it live, radio and television; CBS to tape it and use what it judges news; ABC portions.
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 4 (Clayton Knowles, "Kennedy Replies to Charge Today": arranged by telephone from Hyannis Port; Sorensen flew in from the West Coast July 3; Shriver''s arrangements); Jack Gould, "TV: Battle of Unequals" (CBS''s decision "yesterday"; page not shown). Reply: [[cal.1960-07-04.elections-1960]]. Names: Kennedy, Truman, Sorensen.'
      tags: [name:kennedy-john-f, name:truman-harry-s, name:kintner-robert-e, name:sorensen-theodore-c, ok:fields-place]
- add:
    entry:
      id: cal.1960-07-03.elections-1960-religion
      when: July 3
      date: '1960-07-03'
      place: dallas
      thread: elections-1960-religion
      c: 'W. A. Criswell, preaching at the First Baptist Church, Dallas: Kennedy''s election would "spell the death of a free church in a free state."'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 ("Kennedy Is Attacked," Dallas, July 3, AP). Names: Criswell, Kennedy.'
      tags: [name:criswell-john, name:kennedy-john-f, state:tx, city:dallas]
- add:
    entry:
      id: cal.1960-07-03.japan
      when: July 3
      date: '1960-07-03'
      thread: japan
      c: 'Saitama, governor. Kurihara (Liberal Democrat), re-elected, defending the security treaty, 374,598 of 667,579, unofficial, over Umezawa (Socialist) and Baba (Democratic Socialist).'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 3 (Richard J. H. Johnston, "Kishi Party Again Wins Election over Japanese Leftist Opposition," Tokyo, July 4: with the Liberal Democrats'' win in Aomori, July 1; Kishi names no successor). Check: the Aomori result.'
- add:
    entry:
      id: cal.1960-07-03.soviet-union
      when: July 3
      date: '1960-07-03'
      thread: soviet-union
      also: [europe-and-the-alliance-federal-republic]
      c: Khrushchev, at Mauthausen on the first day of a five-day tour of the Austrian provinces, lays a wreath to the Soviet dead and likens Adenauer to Hitler; names Oberländer.
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 3 (M. S. Handler, "Khrushchev Sees Hitlerite Threat from Bonn Regime," Mauthausen, July 3: Figl present; the photographers'' strike at Ybbs-Persenbeug). Names: Khrushchev, Adenauer.'
      tags: [name:khrushchev-nikita-s, name:adenauer-konrad]
- add:
    entry:
      id: cal.1960-07-03.soviet-union-2
      when: July 3
      date: '1960-07-03'
      thread: soviet-union
      c: 'Khrushchev, at an impromptu news conference at Linz: ready to negotiate with any future American government, but not with Eisenhower''s; new negotiations unlikely before the American elections.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 3 ("Early Talks Ruled Out," Linz, July 3, UPI). See [[cal.1960-07-03.soviet-union]]. Names: Khrushchev, Eisenhower.'
      tags: [name:khrushchev-nikita-s, name:eisenhower-dwight-d]
- add:
    entry:
      id: cal.1960-07-03.middle-east
      when: July 3
      date: '1960-07-03'
      thread: middle-east
      c: Jordan's Cabinet decides to complain to the Arab League of the United Arab Republic's instigation and interference. Majali; the League's council at Beirut, Aug. 22.
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 ("Jordan to Protest Attacks by Nasser," Amman, July 3, dispatch of the *Times*, London: Nasser''s speech of June 24; Hussein''s reply July 2).'
      tags: [name:hussein-ibn-talal, name:nasser-gamal-abdel]
- add:
    entry:
      id: cal.1960-07-03.europe-and-the-alliance-france
      when: July 3
      date: '1960-07-03'
      place: paris
      thread: europe-and-the-alliance-france
      c: The Socialist party reaffirms its support of de Gaulle's self-determination for Algeria. Gazier, Pineau and three others quit the directing committee just elected, finding Mollet too uncritical of de Gaulle.
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 ("Socialists Renew Paris Algeria Aid," Paris, July 3). Names: de Gaulle.'
      tags: [name:de-gaulle-charles]
- add:
    entry:
      id: cal.1960-07-03.china
      when: July 3
      date: '1960-07-03'
      place: peking
      thread: china
      also: [africa]
      c: Peking, a rally of 1,000 for the new African states. Liu Changsheng, of the China–Africa Friendship Association, and Liao Chengzhi, of the Afro-Asian Solidarity Committee, against American "neocolonial" aid.
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html) ("Peiping Assails U.S.," Hong Kong, July 3; page not shown). Names: Liu Changsheng, Liao Chengzhi.'
      tags: [name:liao-chengzhi, name:liu-changsheng]
