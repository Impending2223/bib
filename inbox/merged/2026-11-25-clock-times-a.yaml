      time_zone: Asia/Shanghai
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 24, 1962. [[w.jianguo-yilai-mao-zedong]], XVI, 449–450 (Dec. 24, 1962; Mao''s note to Hu Qiaomu, dated Dec. 24, "7:30" (七时半, a.m. or p.m. not said); the points of the night before and the Politburo''s comments of the afternoon to be worked in; the logic to be tightened; "so-called" may go from "formalistic so-called consultation"; the whole about 14,000 characters; printed from the manuscript; note 2: "nine" though eight are named, Deng Xiaoping perhaps left out). The time: 晨七时半 ([[w.zedong-mao-zedong-nianpu]], V, Dec. 24, 1962). Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Chen Boda, Kang Sheng, Togliatti, Wang Jiaxiang, Hu Qiaomu, Tian Jiaying, Yang Shangkun.'
