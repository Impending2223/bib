      c: 'Bear Mountain, N.Y. Some two dozen intellectuals, at the invitation of Cary, the American Friends Service Committee''s
        chairman: Fromm, Riesman, Coser, H. Stuart Hughes, Hayakawa, and the pacifists Muste, Gilmore, Pickett, Meacham and
        Pickus. The Committees of Correspondence formed: reliance on deterrence "a deep malaise"; for continued abstention
        from testing, rapprochement with China, economic conversion.'
