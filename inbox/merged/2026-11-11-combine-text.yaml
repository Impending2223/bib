patch: 2026-11-11-combine-text
by: 'Claude (the lead), Nov. 11, 2026: the text of the 14 duplicates combined after the b6/b7 merges, written from both entries (each work kept, with what it bears); and the Oct. 18, 1960 campaign entry cut to the quips, its Tampa speech being cal.1960-10-18.latin-america.'
ops:
- edit:
    id: cal.1960-07-14.elections-1960-los-angeles-3
    base: 1e7b03d4
    set:
      c: 'Beverly Hills, the evening, Marion Davies''s house, rented by Joseph Kennedy. Kennedy and Robert Kennedy dine with their father; Bartlett with them. Joseph Kennedy on the choice of Johnson: "Don''t worry, Jack. Within two weeks they''ll be saying it''s the smartest thing you ever did." Robert Kennedy to Bartlett: "Yesterday was the best day of my life. Today is the worst day." Jacqueline Kennedy low. By Bartlett''s account.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 211 (the dinner, at Marion Davies''s house; Joseph Kennedy''s words; Schlesinger: the father had no part in the Johnson decision); [[w.thomas-robert-kennedy]], 98 (the house rented, in Beverly Hills; Robert Kennedy''s best day and worst; Joseph Kennedy: "In two weeks"); [[w.kallina-kennedy-v-nixon]], 77 (Thursday night; Jacqueline Kennedy low, Robert Kennedy near despair). To check: Charles Bartlett, interview by Jean Stein, Jan. 9, 1970, 14, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 211 n.83); [[w.bryant-bystander]], 149–51; Charles Bartlett OHI, May 6, 1969, LBJL, 35–36 (both cited by [[w.kallina-kennedy-v-nixon]], 77 n.73). See [[cal.1960-07-14.elections-1960]]. Names: Kennedy, Robert Kennedy, Joseph Kennedy, Bartlett, Jacqueline Kennedy.'
- edit:
    id: cal.1962-10-28.missile-crisis-settlement
    base: 4bf6ea1f
    set:
      c: 'That night. Kennedy, remembering Lincoln shot at Ford''s Theatre after Appomattox, to his brother: "This is the night I should go to the theater." Robert Kennedy: "If you go, I want to go with you"; he had seen Johnson make no contribution in all the meetings; after them Johnson would "whine and complain about our being weak," and on Saturday night said people felt they were backing down, with no specifics. By Robert Kennedy''s memorandum of Nov. 15. Kennedy to Powers: "Thank God for Bobby."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 525 & n.* (the theater; Johnson in the meetings); [[w.thomas-robert-kennedy]], 231 (Ford''s Theatre; the words), 233 ("Thank God for Bobby"). To check: Robert Kennedy, memorandum, Nov. 15, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 525 n.*); [[w.kennedy-thirteen-days]], 110 (cited by Thomas, 438). Names: Kennedy, Robert Kennedy, Johnson, Powers. Check: the night of "Thank God for Bobby"; Thomas: "on the last night of the Cuban Missile Crisis."'
- edit:
    id: cal.1963-05-04.elections-1964-2
    base: a0690b2e
    set:
      c: 'The afternoon of the wedding, some three hours after it, before the press is told. Rockefeller telephones Goldwater at the Westchester Apartments: sorry to miss a coming dinner at which he was to pay him tribute. Goldwater to his wife: "Rockefeller just got married." Peggy Goldwater: "Bully for him!" David Rockefeller calls Javits; Hinman, Representatives Morse, Sibal and Mathias among others, to sound and reassure them.'
      n: '[[w.novak-agony-of-the-g]], 140–41 & n.1 (the calls; some three hours after the wedding); [[w.smith-on-his-own-terms]], 407 (the call to Goldwater after the wedding and lunch; the dinner; Peggy Goldwater). See [[cal.1963-05-04.elections-1964]]. Names: Rockefeller, Goldwater, David Rockefeller, Javits, Hinman, Morse, Sibal, Mathias.'
- cite:
    id: cal.1963-05.civil-rights-the-executive-5
    item: '[[w.thomas-robert-kennedy]], 245 ("A few days after" the meeting)'
    units: all
- cite:
    id: cal.1963-11-20.democratic-party
    item: '[[w.dallek-flawed-giant]], 43–44 (by Robert Kennedy''s recollection, the day before the trip: the President irritated with Johnson, who would not help with the party''s problems in his own State; no reception, no names of the feud)'
    units: all
- edit:
    id: cal.1964-06-17.civil-rights-bill-4
    base: ae6f0eba
    set:
      c: 'Afternoon, just after the vote on the substitute. Humphrey, called off the floor: word from his wife that the biopsy on their son Robert, 20, shows a malignant tumor in a lymph node of his neck; the operation June 23 in Minneapolis. Humphrey stays in Washington, on the floor for the debate, until the bill clears the Senate. Rauh and Mitchell come to the whip''s office over the vote, find him in tears and stay with him.'
      n: '[[w.mann-walls-of-jericho]], 427 (just after the vote on the substitute; in tears); [[w.whalen-longest-debate]], 210 (the biopsy; the operation June 23 in Minneapolis; he stays until the bill clears the Senate); [[w.humphrey-education-of-a-public-1976]], 285, 479–80 n.13 (the call; he stays on the floor; Rauh and Mitchell, pleased with the bill''s progress, stay with him; by the note no flight to Minneapolis on the Friday, at his son''s side Saturday morning). To check: *Life*, Sept. 27, 1968 (cited by [[w.mann-walls-of-jericho]], 427); [[w.humphrey-beyond-civil-rights]], 96 (cited by [[w.whalen-longest-debate]], 271). See [[cal.1964-06-17.civil-rights-bill-3]]. Names: Humphrey, Rauh, Clarence Mitchell. Check: the day; the memoir puts the final passage "the next day," and its note puts the Friday, June 19, the day of the final vote, as the day he could not fly.'
- cite:
    id: cal.1966-12.robert-kennedy-5
    item: '[[w.thomas-robert-kennedy]], 332 (by Newfield''s account: "Maybe I will have to say something. The bombing is getting worse all the time now")'
    units: all
- cite:
    id: cal.1967-10-27.vietnam-air-war
    item: '[[w.dallek-flawed-giant]], 492 (a letter; the air war about become the war to the press and the public; also middle-road Democrats edgy about the bombing, time to say what is hoped from it)'
    units: A
- edit:
    id: cal.1967-11-29.robert-kennedy-2
    base: db70cfe1
    set:
      c: 'New York, the King Cole Bar, 11 p.m., the afternoon papers with McNamara leaving Defense for the World Bank. Robert Kennedy with Schlesinger, Salinger and others: Johnson sent McNamara''s name up without a word to him; McNamara heard it from a leak in London. Kennedy thinks he will refuse the Bank and quietly resign. Schlesinger: "Wouldn''t any self-respecting man have his resignation on the president''s desk half an hour" after the story? About 1 a.m., the *Times*: "McNamara Takes World Bank Post."'
      n: '[[w.shesol-mutual-contempt]], 394 (Schlesinger cited there at 884); [[w.thomas-robert-kennedy]], 350 (two nights later, the King Cole Bar; Schlesinger: "Wouldn''t any self-respecting man have his resignation on the President''s desk [in] half an hour?"; the *Times*''s first edition: "McNamara Takes World Bank Post"); [[w.schlesinger-robert-kennedy-and-his]], 823 (by his journal: the afternoon papers; no intimation, a leak in London; refuse the Bank and quietly resign; the morning *Times* at one). To check: Schlesinger, journal, Nov. 29, 1967, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 823 n.8). See [[cal.1967-11-28.robert-kennedy-3]]; [[cal.1967-11-29.defense]]. Names: Robert Kennedy, Schlesinger, Salinger, McNamara, Johnson.'
- edit:
    id: cal.1968-01-28.robert-kennedy-campaign
    base: 547a603a
    set:
      c: 'Hickory Hill, dinner. Robert Kennedy has asked Schlesinger and Goodwin: "We have to settle this thing one way or another." They find him among guests, John Glenn, Mike Nichols, Rod Steiger, the George Stevenses. Nothing settled.'
      n: '[[w.shesol-mutual-contempt]], 412 (Schlesinger cited there at 902–3); [[w.schlesinger-robert-kennedy-and-his]], 840 (the guests). See [[cal.1968-01-25.robert-kennedy-campaign-decision]]. Names: Robert Kennedy, Schlesinger, Goodwin, Glenn.'
- edit:
    id: cal.1968-03.robert-kennedy-2
    base: 30cb5944
    set:
      c: 'New York, a dinner party, a few days after the announcement. Jacqueline Kennedy to Schlesinger: "Do you know what I think will happen to Bobby? The same thing that happened to Jack. ... There is so much hatred in this country, and more people hate Bobby than hated Jack." By Schlesinger''s journal.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 857; [[w.thomas-robert-kennedy]], 361; [[w.bernstein-guns-or-butter]], 501. To check: Schlesinger, journal, Apr. 2, 1968, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 857 n.54). See [[cal.1968-03-16.robert-kennedy]]. Names: Jacqueline Kennedy, Schlesinger, Robert Kennedy. Check: the day.'
- edit:
    id: cal.1960-10-18.elections-1960-kennedy
    base: 087271c7
    set:
      c: Goodwin and Sorensen at work on quips for the Al Smith dinner, the afternoon of the Tampa speech.
      n: '[[w.white-making-of-the-president]], 325–26. See [[cal.1960-10-18.latin-america]]; [[cal.1960-10-17.elections-1960-kennedy]]. Names: Goodwin, Sorensen.'
