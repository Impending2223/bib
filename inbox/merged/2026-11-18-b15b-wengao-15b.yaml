      set:
        c: 'Mao to Zhou Yang, on his report for the Third Congress of Writers and Artists: the parts against "human nature" and on the inheritance "superb"; the rest to be brought up to them; the congress put off to the 25th if need be; the passage praising his poems to be struck.'
        n: '[[w.zedong-mao-zedong-nianpu]], IV, July 19, 1960; [[w.jianguo-yilai-mao-zedong]], XV, 271–274 (July 19, 1960; Mao''s letter of 4 a.m. to Zhou Yang 周扬: the draft well written, the parts against the bourgeois theory of human nature and on the critical inheritance of the heritage very good; the first two parts and the last weaker, to be rewritten if time allows, or the congress put off to the 25th; a talk proposed for that afternoon; his note asking that the passage praising his poems be deleted, 273 n.5; his revisions of the draft listed, 273 n.4; printed from the manuscript and the revised copy). Made public: 2013. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Zhou Yang, report to the Third National Congress of Literary and Art Workers, "The road of socialist literature and art" 《社会主义文学艺术的道路》, draft revised July 18, 1960 (six parts) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 272 n.2). Names: Mao Zedong, Zhou Yang.'
