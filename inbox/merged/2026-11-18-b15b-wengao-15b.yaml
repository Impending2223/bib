        n: '[[w.jianguo-yilai-mao-zedong]], XV, 327–328 (Sept. 1, 1960; Mao''s note of 1 a.m., Sept. 1; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Heilongjiang Provincial Party Committee, report of Aug. 29, 1960 to the Center and Mao Zedong on conveying the Beidaihe meeting (provincial work conference from Aug. 20) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 327 n.1). Names: Mao Zedong, Yang Shangkun.'
