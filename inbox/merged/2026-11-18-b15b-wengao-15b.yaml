        thread: china-leadership
        also: [soviet-union]
        c: 'Mao 毛泽东, on ''Macmillan''s role'' by Hasi 哈希, the *Christian Science Monitor*''s correspondent at the United Nations (translated in *Neibu cankao* 内部参考 supplement no. 80, Oct. 6): ''Hasi is an American journalist with a head; this piece is worth study.'' Sent to Liu, Zhou, Zhu, Lin, Chen Yun 陈云, Li Fuchun 李富春, Chen Boda 陈伯达 and Wu Lengxi 吴冷西. The piece: Khrushchev a prisoner of Chinese party policy; Macmillan wants the bridges between East and West kept open and a summit restored.'
