        date: 1960-08
        thread: china-leadership
        at: after 1960-08-19
        c: 'Mao 毛泽东 to Jiang Qing 江青, on the account of a Venezuelan Communist Party Politburo alternate, Aliaidi 阿里埃蒂, of his view of the Bucharest meeting: read it carefully and slowly, of much benefit. A second comment: ''A good talk.'' Aliaidi, after touring the Northeast, told the Chinese frankly that the meeting was badly arranged, the delegates not told beforehand, Khrushchev arrogant, and that the money Moscow gave China should not have been mentioned.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 325–326 (Aug. 1960; two comments of Aug. 1960; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Central Committee International Liaison Department, *Geguo gongchandang dongxiang* 《各国共产党动向》, Aug. 19, 1960 (the Venezuelan Communist Party Politburo alternate Aliaidi''s views on the Bucharest meeting) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 325 n.1). Names: Mao Zedong, Jiang Qing, Khrushchev. Check: the day: ''Aug.'' only, after the paper of Aug. 19; the man''s own name: the book gives only 阿里埃蒂, a Politburo alternate of the Venezuelan party.'
        tags: [polity:prc, name:mao-zedong, name:jiang-qing, name:khrushchev-nikita-s, vis:only:prc]
