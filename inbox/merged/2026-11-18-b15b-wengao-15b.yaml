        c: 'Mao 毛泽东 to Yang Shangkun 杨尚昆, on the supplement no. 30 of *Neibu cankao* 内部参考, July 28: send word that all the comrades at the Work Conference read its ten pieces closely, the most important twice; then each group to discuss a day, the Center''s ministers present; return it to him today. The pieces are Western and other press comment on Khrushchev''s ''appeasement'', China''s analysis, Ulbricht, the Indian Communists'' three groups, Suslov, and the Chinese–Soviet ''split''.'
