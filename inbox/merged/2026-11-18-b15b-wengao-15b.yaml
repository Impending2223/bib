        thread: china-leadership
        c: 'Mao 毛泽东 to Li Fuchun 李富春, on the Shanxi 山西 Party committee''s report of Oct. 12 on farm labor: very good; read it, send to Chen Boda 陈伯达 to have a few people study it and draft a Center telegram introducing it to the bureaus, the provinces, cities and regions and the Center''s ministries and Party groups, for study and vigorous action; the Secretariat to count how much labor each province has drawn back to the farm front. The report: 2.4 million at work in the fields in April–May, 48 percent; 1.1 million returned by September, 3.7 million, 74 percent.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 363–365 (Oct. 17, 1960; Mao''s note of Oct. 17, written on the report; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Shanxi Provincial Party Committee, report of Oct. 12, 1960 to the Center and Mao Zedong, "On the rural labor question" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 363 n.1); Central Committee, directive of Oct. 27, 1960 forwarding the Shanxi report on rural labor (drafted for the Center by Deng Zihui 邓子恢) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 365 n.4). Names: Mao Zedong, Li Fuchun, Chen Boda, Deng Zihui.'
        tags: [polity:prc, name:mao-zedong, name:li-fuchun, name:chen-boda, vis:only:prc]
