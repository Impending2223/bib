        n: '[[w.zedong-mao-zedong-nianpu]], IV, June 10, 1960; [[w.lengxi-shinian-lunzhan-1956-1966]], 277–278 (the reply sent June 10 after the Standing Committee had revised it; Mao: prepare two ways, to be attacked and to be courted); [[w.jianguo-yilai-mao-zedong]], XV, 236–238 (June 10, 1960; the reply, printed from the typeset copy in the Central Archives, a revised copy extant; the fourteen: France, Italy, Britain, the United States, Canada, Mexico, Brazil, Cuba, Indonesia, India, Japan, Iraq, Syria, Australia). Made public: 1999. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Names: Mao Zedong.'
