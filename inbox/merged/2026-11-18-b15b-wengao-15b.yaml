        c: 'Mao 毛泽东 on Tan Zhenlin''s 谭震林 report of Sept. 23 on agriculture in Shanxi 山西, Hebei 河北, Henan 河南, Shandong 山东 and Liaoning 辽宁: the Secretariat to discuss it seriously; if it is workable, to be sent down; the South to let the North have tractors and other heavy implements first, or the problem cannot be solved. Sent to Li Fuchun 李富春 to handle. Tan''s report: of 493.64 million mu, 37 percent plowed by animals, 8.1 percent by machines; nearly 40 percent of the tractors and pumps of Shanxi, Hebei, Shandong and Henan idle; a request for 100,000 standard tractors in two years.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 340–341 (Sept. 26, 1960; Mao''s note of Sept. 26; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Tan Zhenlin, report of Sept. 23, 1960 to the Politburo and Secretariat on agriculture in Shanxi, Hebei, Henan, Shandong and Liaoning (cited by [[w.jianguo-yilai-mao-zedong]], XV, 340 n.1a); Central Committee, approval of Oct. 7, 1960 of Tan Zhenlin''s report (100,000 standard tractors allotted to the five provinces in the next two years) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 341 n.1b). The approval: [[cal.1960-10-07.china-leadership-5]]. Names: Mao Zedong, Tan Zhenlin, Li Fuchun. Check: Li Fuchun ran the Secretariat then, Deng Xiaoping and Peng Zhen being at Moscow (the Wengao''s note, 341 n.2).'
