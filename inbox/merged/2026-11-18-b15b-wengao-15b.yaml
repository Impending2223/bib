ops:
  - add:
      entry:
        id: cal.1960-05-18.china-leadership-2
        when: May 18
        date: '1960-05-18'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhu De 朱德 and Zhou Enlai 周恩来 telegraph Hồ Chí Minh 胡志明 on his seventieth birthday, for the Chinese Party, government and people: founder and leader of the Lao Động Party, friend of the Chinese people; wishes for his health and long life, and for Vietnam''s socialist construction, peaceful unification and struggle against American war policy.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 221–222 (May 18, 1960; telegram of May 18, 1960; printed from the *Renmin ribao* 人民日报 of May 19, 1960). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Hồ Chí Minh.'
        tags: [polity:prc, name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:zhou-enlai, name:ho-chi-minh]
        src:
          c: 1a7119e3
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 221–222: all'
  - add:
      entry:
        id: cal.1960-05.china-leadership-4
        when: May
        date: 1960-05
        thread: china-leadership
        at: after 1960-05-16
        c: 'Mao 毛泽东, on an internal collection of Yugoslav statements compiled May 16: quotes Tao Yuanming 陶渊明, ''strange writings to enjoy together, doubtful points to analyze together'', and writes that it can be looked at. To Kang Sheng 康生, Yang Shangkun 杨尚昆 and Tian Jiaying 田家英, read and back to Gao Zhi 高智, his confidential secretary. The collection draws on Tito''s April report to the congress of the Socialist Alliance of Working People, his talk to the editors of *Rad* before May Day, and pieces in *Borba*, *Komunist* and *Politika*.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 226–227 (May 1960; two comments of May 1960 on the collection; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Internal collection of Yugoslav statements, compiled May 16, 1960 (Tito and others, April 1960, at the congress of the Socialist Alliance of Working People; Tito before May Day to the editors of *Rad*; *Borba*, Apr. 22 and 27; *Komunist*, May 12, "The true aims"; *Politika*, Apr. 18, "The strength of Bandung") (cited by [[w.jianguo-yilai-mao-zedong]], XV, 226 n.1). Names: Mao Zedong, Kang Sheng, Yang Shangkun, Tian Jiaying, Gao Zhi, Tito. Check: the day: ''May'' only; the collection is dated May 16.'
        tags: [polity:prc, name:mao-zedong, name:kang-sheng, name:tito-josip-broz, vis:only:prc]
        src:
          c: 4254996a
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 226–227: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 226 n.1: all'
  - add:
      entry:
        id: cal.1960-05.china-leadership-5
        when: May
        date: 1960-05
        thread: china-leadership
        at: after 1960-05-28
        c: 'Mao 毛泽东, on the article "First reactions after the break-up of the four-power summit" 《四国首脑会议破裂后的初步反应》 in *Waishi dongtai* 外事动态 no. 34 of May 28: ''this piece can be read.'' To Kang Sheng 康生, Yang Shangkun 杨尚昆 and Tian Jiaying 田家英, read and back to Gao Zhi 高智.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 228–229 (May 1960; two comments of May 1960; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: *Waishi dongtai* no. 34, May 28, 1960, "First reactions after the break-up of the four-power summit" (Khrushchev''s statement of May 16 at the preliminary session; Eisenhower''s refusal; summit declared broken May 17; Western reactions; the socialist states'' mass meetings; Polish and *Izvestia* comment on the Chinese view) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 228 n.1). Names: Mao Zedong, Kang Sheng, Yang Shangkun, Tian Jiaying, Gao Zhi. Check: the day: ''May'' only; the paper is of May 28, so the comment is after it.'
        tags: [polity:prc, name:mao-zedong, name:kang-sheng, vis:only:prc]
        src:
          c: 80e78b2b
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 228–229: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 228 n.1: all'
  - add:
      entry:
        id: cal.1960-06-04.china-leadership-4
        when: June 4
        date: '1960-06-04'
        thread: china-leadership
        c: 'Mao 毛泽东 to Yang Shangkun 杨尚昆: print the report on China''s participation in the East Pakistan international industrial fair 东巴基斯坦国际工业展览会 for the comrades at the Shanghai 上海 June meeting to read. The report, by the Chinese embassy in Pakistan, gives 750,000 visitors to the Chinese pavilion in fifty-three days.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 230–231 (June 4, 1960; Mao''s note of June 4; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Chinese embassy in Pakistan, report of May 14, 1960 to the Foreign Ministry, the Foreign Trade Ministry, the Committee for the Promotion of Foreign Trade and the Commission for Cultural Relations with Foreign Countries, on China''s participation in the East Pakistan international industrial fair (750,000 visitors in 53 days) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 230 n.2). Names: Mao Zedong, Yang Shangkun.'
        tags: [polity:prc, name:mao-zedong, vis:only:prc]
        src:
          c: cd19f6fb
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 230–231: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 230 n.2: all'
  - add:
      entry:
        id: cal.1960-06-07.china-leadership-5
        when: June 7
        date: '1960-06-07'
        thread: china-leadership
        c: 'Mao 毛泽东, on a telegram of May 28 from Huan Xiang 宦乡, chargé d''affaires in London, on the international situation after the failure of the four-power summit: print for the comrades at the Shanghai 上海 meeting, ''this paper is very well put.'' The telegram reads the Soviet turn as the logic of the U-2 affair, not a new view of imperialism, expects wavering to continue, and says the West aims the cold war at China and at Sino-Soviet relations.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 232–233 (June 7, 1960; Mao''s comment of June 7; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Huan Xiang, Chinese chargé d''affaires in Britain, telegram of May 28, 1960 to the Foreign Ministry, analysis and outlook of the international situation after the collapse of the four-power summit (six points) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 232 n.1). Names: Mao Zedong, Huan Xiang.'
        tags: [polity:prc, name:mao-zedong, vis:only:prc]
        src:
          c: 4f589920
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 232–233: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 232 n.1: all'
  - add:
      entry:
        id: cal.1960-06-08.china-leadership-6
        when: June 8
        date: '1960-06-08'
        thread: china-leadership
        c: 'Mao 毛泽东, on ''Some materials on American military production'' from the Foreign Ministry''s Institute of International Relations: print for the comrades; worth study. Why does America not want disarmament? The answer is here: the monopoly bourgeoisie needs a huge force and a huge arsenal. On June 9 he changes the print line to the comrades at the Politburo meeting.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 234–235 (June 8, 1960; Mao''s comment of June 8, revised June 9; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: *Waishi dongtai* 外事动态 no. 35, May 25, 1960, "Some materials on American military production" (Institute of International Relations, Foreign Ministry: employment in the military sector; the effect of military procurement on the American economy) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 235 n.1a); Victor Perlo and Carl Marzani, a book rendered in the Wengao as "Dollars and the idea of disarmament" 《金元与裁军思想》 (cited in the paper) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 235 n.1b); Joint Economic Committee of the U.S. Congress, report "Background material on the economic impact of federal procurement and supply" (cited in the paper) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 235 n.1c). Names: Mao Zedong. Check: the day: the comment is dated June 8; the Wengao note says he rewrote the addressee line on June 9.'
        tags: [polity:prc, name:mao-zedong, vis:only:prc]
        src:
          c: 0aec9009
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 234–235: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 235 n.1a: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 235 n.1b: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 235 n.1c: all'
  - add:
      entry:
        id: cal.1960-06-09.china-leadership-2
        when: June 9
        date: '1960-06-09'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao 毛泽东 to Khrushchev 赫鲁晓夫, sending the paper on American military production: it is worth serious attention; has he noticed the question? Closes: his health, and eternal unity of the two countries.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 234–235 (June 9, 1960; Mao''s letter of June 9; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Names: Mao Zedong, Khrushchev. Check: whether and how the paper was sent to Khrushchev; the Wengao gives the letter only.'
        tags: [polity:prc, name:mao-zedong, name:khrushchev-nikita-s, polity:ussr, vis:only:prc+ussr]
        src:
          c: 86a8aee8
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 234–235: all'
  - add:
      entry:
        id: cal.1960-06-13.china-leadership-4
        when: June 13
        date: '1960-06-13'
        thread: china-leadership
        c: 'Mao''s 毛泽东 regulated-verse poem ''Reading the Papers'' 读报 (Qilü: Dubao), eight lines: Trotsky 托洛茨基 back at his old home, neither peace nor war, the Black Sea churning, the Elysée Palace, Camp David.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 239–240 (June 13, 1960; the poem as Mao finalized it, from the Central Archives). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Names: Mao Zedong, Trotsky. Check: when the poem was first printed; the Wengao gives no earlier printing.'
        tags: [polity:prc, name:mao-zedong, vis:only:prc]
        src:
          c: 215ab3e4
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 239–240: all'
  - add:
      entry:
        id: cal.1960-06-14.china-leadership-3
        when: June 14
        date: '1960-06-14'
        thread: china-leadership
        c: 'The Center, by Mao''s 毛泽东 draft, to the Shanghai 上海 Bureau and the Party committees of the provinces, cities and autonomous regions: encloses two Guangdong 广东 papers on the ''three antis'' 三反 in the countryside; the Center finds the questions raised and their handling correct, for other places to consult. The papers: Tao Zhu 陶铸''s opinions of May 21 from Shantou 汕头 and the provincial committee''s report of June 4. Tao proposes provincial committee members four months a year below, prefectural six, county secretaries seven, and, from then to 1962, the ''three togethers'' 三同 with cadres and masses restored at once.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 241–243 (June 14, 1960; the Center''s comment of June 14, 1960; printed from Mao''s manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Tao Zhu, "Opinions on doing the rural ''three antis'' well and thoroughly improving cadres'' work style", written at Shantou, May 21, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 241 n.1a); Guangdong Provincial Party Committee, report "The rural ''three antis'' must win a great victory", June 4, 1960 (cadres to eat in the mess halls and farm; twelve rules for rural cadres; mess halls the center of reform; coarse grains to be planted) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 241 n.1b). Names: Mao Zedong, Tao Zhu.'
        tags: [polity:prc, name:mao-zedong, name:tao-zhu, vis:only:prc]
        src:
          c: f6c9efa9
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 241–243: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 241 n.1a: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 241 n.1b: all'
  - add:
      entry:
        id: cal.1960-06-15.china-leadership
        when: June 15
        date: '1960-06-15'
        thread: china-leadership
        c: 'Mao 毛泽东, on four documents to be read at the enlarged Politburo meeting at Shanghai 上海 and returned: things develop by their own laws, whatever imperialists, reactionaries, revisionists and ''semi-revisionists'' 半修正主义者 will; those who find the laws and unite all they can will win; class struggle is so, production struggle also. ''All the world''s victories are ours.'' The four: Huan Xiang''s 宦乡 report of June 9 on the SEATO foreign ministers'' meeting; the embassy in Moscow''s of June 12 on the Soviet press''s counterattack, marking Lenin''s "Left-Wing" Communism; the embassy in Bucharest''s of June 10; the embassy in Prague''s of June 11.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 244–246 (June 15, 1960; Mao''s comment of June 15; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Huan Xiang, Chinese chargé d''affaires in Britain, report of June 9, 1960, "On the SEATO foreign ministers'' meeting" (the meeting reassessed China; the U.S. for military action; Britain, France, Canada and others opposed) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 245 n.1a); Chinese embassy in the Soviet Union, report of June 12, 1960, "New current trends in the Soviet Union" (Soviet press of June 10 and 12 on the 40th anniversary of Lenin''s "Left-Wing" Communism) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 245 n.1b); Chinese embassy in Romania, report of June 10, 1960, on the Romanian party''s *Lupta de clasă* no. 5 reprinting in full the Soviet *Kommunist* no. 8 article "On the old positions of revisionism", and *Scînteia*''s commentary of June 5 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 246 n.1c); Chinese embassy in Czechoslovakia, report of June 11, 1960, "A few scattered reactions to three articles" (Polish attaché and Czechoslovak officials on the Chinese articles for Lenin''s anniversary) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 246 n.1d). Names: Mao Zedong, Huan Xiang.'
        tags: [polity:prc, name:mao-zedong, vis:only:prc]
        src:
          c: c9f2cf8e
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 244–246: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 245 n.1a: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 245 n.1b: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 246 n.1c: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 246 n.1d: all'
  - add:
      entry:
        id: cal.1960-06-20.china-leadership
        when: June 20
        date: '1960-06-20'
        thread: china-leadership
        c: 'Mao 毛泽东 to Jiang Qing 江青, on the *Sunday Times* article ''My talks with Mao'' 《我同毛的会谈》 by Field Marshal Montgomery, in *Cankao ziliao* 参考资料 no. 3660 of June 16: it can be read, of much interest. Montgomery praised the Chinese people''s drive: they want peace and no aggression, and have much to do in fifty years. He said the Chinese revolution was right and unavoidable.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 253–254 (June 20, 1960; Mao''s note of the morning of June 20; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Xinhua, *Cankao ziliao* no. 3660, June 16, 1960, "British press prints Montgomery''s first article on his visit to China" (the *Sunday Times*, June 12, 1960, Montgomery, "My talks with Mao": his late-May visit and talks with Mao Zedong and Zhou Enlai 周恩来) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 253 n.1). See [[cal.1960-05-27.china-leadership]]. Names: Mao Zedong, Jiang Qing, Montgomery.'
        tags: [polity:prc, name:mao-zedong, name:jiang-qing, name:montgomery-of-alamein-bernard-l, vis:only:prc]
        src:
          c: 75dd2473
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 253–254: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 253 n.1: all'
  - add:
      entry:
        id: cal.1960-06-21.china-leadership-2
        when: June 21
        date: '1960-06-21'
        thread: china-leadership
        c: 'Mao 毛泽东 to Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and Deng Xiaoping 邓小平, on Montgomery''s *A Sober Approach* 《一种清醒的作法》: read, very interesting, a book to be read.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 255–256 (June 21, 1960; Mao''s note of June 21, written on the cover of the internal reading edition (Shijie Zhishi Chubanshe 世界知识出版社, March 1960); printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: [[w.montgomery-yizhong-qingxing-de-zuofa]] 《一种清醒的作法——东西方关系研究》 (the Beijing Bianyishe 北京编译社 translation for internal reading; his two Oxford lectures during the 1959 foreign ministers'' conference and *Sunday Times* articles) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 255 n.1). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Montgomery. Check: the English original''s title; ''A Sober Approach'' renders the Chinese.'
        tags: [polity:prc, name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:montgomery-of-alamein-bernard-l, vis:only:prc]
        src:
          c: 6321934a
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 255–256: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 255 n.1: all'
  - add:
      entry:
        id: cal.1960-06-22.china-leadership-2
        when: June 22
        date: '1960-06-22'
        thread: china-leadership
        c: 'Mao 毛泽东 at Shanghai 上海 to Chen Pixian 陈丕显, secretary of the Shanghai Party committee: please send word to Wu Qirui 吴启瑞 to come, within one or two days; say only that Chen wants to see her; she to be received, as Mao wants to ask her some things. Wu, long a teacher at the primary school of the Wuxi Normal School 无锡师范学校, is the daughter-in-law of Wang Li''an 王立庵, his mathematics teacher at the First Normal School in Hunan 湖南.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 259 (June 22, 1960; Mao''s note of June 22; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Names: Mao Zedong, Chen Pixian, Wu Qirui, Wang Li''an. Check: whether Wu came and what he asked her.'
        tags: [polity:prc, name:mao-zedong, vis:only:prc]
        src:
          c: 97b90e94
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 259: all'
  - add:
      entry:
        id: cal.1960-06.china-leadership-3
        when: June
        date: 1960-06
        thread: china-leadership
        at: after 1960-06-24
        c: 'Mao 毛泽东 to Jiang Qing 江青, on the Foreign Ministry''s summary of Montgomery''s speech of June 9 at a dinner of the De La Rue company 德拉鲁公司, circulated June 24: read; ''we should study why he says these things.'' Montgomery says the revolution helped China and drove out corruption, warlords and ''foreign devils''; that Mao called him an enlightened British marshal; that China''s leaders are learned; that the West must live with communism while keeping its Christian civilization.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 262–263 (June 1960; Mao''s comment of June 1960; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Ministry of Foreign Affairs General Office, summary of Montgomery''s speech at the De La Rue company dinner, June 9, 1960 (circulated June 24) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 262 n.1). Names: Mao Zedong, Jiang Qing, Montgomery. Check: the day: ''June'', after the summary''s circulation on June 24.'
        tags: [polity:prc, name:mao-zedong, name:jiang-qing, name:montgomery-of-alamein-bernard-l, vis:only:prc]
        src:
          c: 1518ce6b
          rows:
            - 'w.jianguo-yilai-mao-zedong XV, 262–263: all'
            - 'via w.jianguo-yilai-mao-zedong XV, 262 n.1: all'
  - add:
      entry:
        id: cal.1960-07-05.china-leadership-2
        when: July 5
        date: '1960-07-05'
        thread: china-leadership
        c: 'Mao 毛泽东 to Yang Shangkun 杨尚昆: this batch of documents is of interest, sixteen of them; print them as one book at once and send to the comrades at the Central Work Conference at Beidaihe 北戴河. He titles them ''Sixteen reports on the present situation''. They are, in the Public Security Ministrys internal publication of July 1, a ministry paper and cables from the embassies in fifteen countries, among them the embassy in Denmark on Jespersen''s impressions of his visit, Wang Bingnan 王炳南 at Warsaw, and Ke Hua 柯华 on Nkrumah''s audience at Accra.'
        n: '[[w.jianguo-yilai-mao-zedong]], XV, 264–265 (July 5, 1960; Mao''s note of July 5, written on the Ministry''s internal publication; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Ministry of Public Security, internal publication of July 1, 1960 (a paper of the ministry and cables from the embassies in fifteen countries) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1a); Chinese embassy in Denmark, cable of July 1, 1960 to the Central Committee''s International Liaison Department and the Foreign Ministry, on the Danish party chairman Jespersen''s impressions of his visit to China (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1b); Wang Bingnan, Chinese ambassador in Poland, cable of June 30, 1960 to the Foreign Ministry and the International Liaison Department, on a talk with the deputy head of the Polish party''s propaganda department (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1c); Chinese embassy in Hungary, cable of June 29, 1960 to the International Liaison Department and the Foreign Ministry, on the Hungarian internal bulletin''s report of Khrushchev''s speech at the Romanian Workers'' Party reception (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1d); Chinese embassy in the Soviet Union, cable of July 1, 1960 to the Foreign Ministry, on the Soviet press and leaders'' continued propaganda for peaceful coexistence (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1e); Chinese embassy in the Soviet Union, cable of June 29, 1960 to the Foreign Ministry, that the Soviet press said nothing of the *Renmin ribao* 人民日报 editorial of June 29 on the Bucharest meeting (cited by [[w.jianguo-yilai-mao-zedong]], XV, 265 n.1f); Ke Hua, Chinese ambassador in Guinea, at the Republic of Ghana''s founding ceremony, cable of July 2, 1960 to the Foreign Ministry, on President Nkrumah''s audience that day (cited by [[w.jianguo-yilai-mao-zedong]], XV, 265 n.1g). Names: Mao Zedong, Yang Shangkun, Jespersen, Wang Bingnan, Ke Hua, Nkrumah.'
