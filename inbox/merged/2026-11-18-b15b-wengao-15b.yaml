  - edit:
      id: cal.1960-09-30.china-leadership
      base: 04dcfdb7
      set:
        c: 'The Qinzheng Hall. Mao and Liu Shaoqi receive Ferhat Abbas, Prime Minister of the Algerian Provisional Government; Zhu De, Zhou Enlai, Dong Biwu, He Long, Chen Yi present. China supports the war; the referendum and French withdrawal right; United Nations troops to be called in with care: the Congo''s lesson, "invited in, it does not leave." Mao''s points, in writing: a long war; a narrow blow, 5 to 10 percent; prisoners taught and sent back.'
        n: '[[w.zedong-mao-zedong-nianpu]], IV, Sept. 30, 1960. [[w.zhou-enlai-nianpu-1949]], II, 353, Sept. 30, 1960 (Zhou present at Mao''s reception of Ferhat Abbas). [[w.zhou-enlai-waijiao-huodong]], 290 (Sept. 30, 1960; 下午3时10分, 中南海勤政殿); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 494 (Sept. 30, 1960; Liu, with Mao, Dong Biwu, Zhu De and Zhou Enlai, receives Ferhat Abbas); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 167 (Sept. 29–Oct. 6, 1960; Ferhat Abbas, Premier of the Algerian Provisional Government, visits with a delegation on invitation; Mao and Liu receive him, the day not given here); [[w.jianguo-yilai-mao-zedong]], XV, 342–345 (Sept. 30, 1960; the "points of the talk" 谈话要点, printed from the typeset copy in the Central Archives, which Zhou Enlai handed Abbas Oct. 6, 344 n.1, not a record of the talk: the war six years old, China''s support, no relations with France unless it breaks with Chiang Kai-shek 蒋介石 and leaves China''s aid alone; the referendum and withdrawal approved, the United Nations in the Congo worse than Belgium; a long war; China''s twenty-two years of war; a blow at 5 to 10 percent; French prisoners taught and freed in batches, collaborators told apart). Made public: 1993. Names: Mao Zedong, Liu Shaoqi, Ferhat Abbas, Zhu De, Zhou Enlai, Dong Biwu, He Long, Chen Yi.'
