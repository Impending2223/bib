        c: 'Mao 毛泽东, 3 a.m., to Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Zhu De 朱德, Lin Biao 林彪, Chen Yun 陈云, Chen Yi 陈毅, Li Fuchun 李富春, Chen Boda 陈伯达 and Wu Lengxi 吴冷西: read pp. 47–59 of the *Cankao ziliao* 参考资料 of the afternoon of Oct. 12, on the General Assembly''s debate on Khrushchev''s disarmament proposal, the Soviet side badly beaten, by 4 p.m.; he proposes a talk on the international situation around 4.'
