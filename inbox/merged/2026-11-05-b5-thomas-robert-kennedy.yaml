      c: 'Robert Kennedy to Rusk, by memorandum, on his meeting with Dobrynin of Oct. 27: the U-2 down; the bases "had to go and they had to go right away"; on the missiles in Turkey "there could be no quid pro quo." In the draft, a mention of a deal on the Turkish missiles struck out.'
