    entry:
      id: cal.1961-11-21.cuba
      when: Nov. 21
      date: '1961-11-21'
      thread: cuba
      also:
      - robert-kennedy
      c: 'The White House, 4:30 p.m.: the President, Robert Kennedy, Lansdale, Goodwin, McCone. The President wants a plan of action on Cuba within two weeks. Robert Kennedy: "immediate dynamic action," covert operations, propaganda, dissension within Cuba, political action in the OAS; a Lansdale committee of the CIA, State, USIA and Defense to "cut across" the agencies. McCone: the agency and the administration "in a condition of ''shock''"; the committee to report to the 5412 group.'
      n: 'Memorandum for the Record, [FRUS 1961–63, X: Cuba, January 1961–September 1962, doc. 275](https://history.state.gov/historicaldocuments/frus1961-63v10/d275) (Nov. 22, 1961). See [[cal.1961-11-03.cuba]]. Names: Kennedy, Robert Kennedy, Lansdale, Goodwin, McCone.'
      src:
        c: f12b9446
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d275: all'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:lansdale-edward-g
      - name:goodwin-richard-n
      - name:mccone-john-a
