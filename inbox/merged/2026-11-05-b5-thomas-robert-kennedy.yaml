      id: cal.1962-03-21.cuba-3
      when: Mar. 21
      date: '1962-03-21'
      thread: cuba
      also:
      - intelligence
      c: NIE 85-62, "The Situation and Prospects in Cuba." Cuba "behind an iron curtain." Castro keeps the positive support of at least a quarter of the population. Active resistance "limited, uncoordinated, unsupported, and desperate"; the regime can contain it. Bloc strategic weapons, or combat units, in Cuba unlikely.
      n: 'National Intelligence Estimate, [FRUS 1961–63, X: Cuba, January 1961–September 1962, doc. 315](https://history.state.gov/historicaldocuments/frus1961-63v10/d315) (Mar. 21, 1962). [[w.thomas-robert-kennedy]], 176 (an internal uprising highly unlikely; Kennedy refused to believe it).'
      src:
        c: 11c69606
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d315: all'
        - 'w.thomas-robert-kennedy 176: D-E'
