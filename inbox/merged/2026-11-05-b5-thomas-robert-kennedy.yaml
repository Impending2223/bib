      c: 'McCone with Robert Kennedy, about an hour, the morning. The Cuba ransom committee: Kennedy sympathetic, but no covert support now for its fund raising; a "lower price," an independent negotiator, part in food and medicine and four or five million dollars. McCone: the prisoners an asset, but payment would prolong Castro''s regime. The matter compartmented.'
