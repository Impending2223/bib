      c: 'Dulles''s office: Dulles, Cabell, Bissell, Helms, Kirkpatrick and McCone review the plan for the Lansdale committee; general agreement. Lansdale had proposed Critchfield as the CIA''s man; Bissell names others, Critchfield hard to spare. McCone: the ablest man available to be put at Lansdale''s disposal.'
      n: 'Memorandum for the Record, [FRUS 1961–63, X: Cuba, January 1961–September 1962, doc. 275](https://history.state.gov/historicaldocuments/frus1961-63v10/d275) (Nov. 22, 1961). See [[cal.1961-11-21.cuba]]. Names: Dulles, Bissell, Helms, McCone, Lansdale.'
      src:
