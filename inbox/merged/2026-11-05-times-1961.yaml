    id: cal.1961-04-17.cuba
    base: cd5b3d97
    set:
      time: 1961-04-17T06:00Z
      follows:
      - cal.1961-04-17.cuba-3
      n: 'FRUS 1961–63, X, docs. [112](https://history.state.gov/historicaldocuments/frus1961-63v10/d112), [116](https://history.state.gov/historicaldocuments/frus1961-63v10/d116);
        [109](https://history.state.gov/historicaldocuments/frus1961-63v10/d109) (Lynch''s report), [110](https://history.state.gov/historicaldocuments/frus1961-63v10/d110)
        (Robertson''s); [221](https://history.state.gov/historicaldocuments/frus1961-63v10/d221), 542 (the Cuba
        Study Group with Lemnitzer, May 18, cited by [[w.poole-joint-chiefs-of-staff]], 115 n.27: a Sea Fury hit
        the Río Escondido, the ships gone out 15 miles); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231),
        599 (the Taylor report, cited by Poole, 115 n.27, paras. 48–49, 53: the Río Escondido sunk about 9:30, the
        Houston hit and run aground, the ships to sea). [[w.poole-joint-chiefs-of-staff]], 114–115 (the landings;
        the Río Escondido sunk); [[w.sorensen-kennedy]], 298–99 (the landing; the Houston and the Rio Escondido
        sunk); [[w.fursenko-khrushchevs-cold-war]], 348 (word in Moscow that afternoon; the landing at three beaches).
        [[w.jones-bay-of-pigs]], 99–108 (the landings; the paratroopers, 7:30; the Houston hit and run aground;
        the Río Escondido sunk; the ships to sea). After [[cal.1961-04-17.cuba-3|the word to Lynch]], before 1 a.m.
        To check: [[w.lynch-decision-for-disaster]]. See [[cal.1961-04-15.cuba]]. Names: Castro. Check: Poole, 115,
        and the Taylor report have the Houston hit and run aground, not sunk. Check: Jones too has the Houston hit
        and run aground (107).'
