      follows:
      - cal.1961-02-08.civil-rights-the-executive
      n: '[[w.reeves-president-kennedy]], 60–61; [[w.wofford-of-kennedys-and-kings]], 131–33 (sworn in by "a solemn-looking
        man in a dark suit," in the outer office, before seeing the President; the officer not named). [[w.branch-parting-the-waters]],
        398–99. Check: the day. Minutes after Hesburgh''s talk: [[w.reeves-president-kennedy]], 60–61. Check: Wofford
        has the oath the day of the Commissioners'' meeting, Feb. 7, and then the President in the Oval Office:
        the strategy for 1961 "minimum civil rights legislation, maximum executive action" (130–33). To check: [[w.navasky-kennedy-justice]],
        160ff (cited by [[w.branch-parting-the-waters]], 398 n.1). See [[cal.1961-02-08.civil-rights-the-executive]].
        Names: Wofford, Hopkins. Check: Branch, 398–99, has it Feb. 7, the President telling Wofford after the oath
        to work for "minimum civil rights legislation, maximum executive action."'
