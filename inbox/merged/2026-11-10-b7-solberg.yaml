      c: 'The FBI''s tap on the South Vietnamese embassy: Chennault to Bùi Diễm, Saigon will get a better deal from Nixon if it holds out. Does Nixon know she is calling? "No, but our friend in New Mexico does": Agnew, that day in Albuquerque.'
