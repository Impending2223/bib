      c: Minnesota. Humphrey (DFL) re-elected to the Senate over Peterson (R), 884,168 to 648,586, 57.5 percent. For the State's
        electors, Kennedy (D) over Nixon (R), 779,933 to 757,915, 50.6 percent, a 22,018-vote margin.
