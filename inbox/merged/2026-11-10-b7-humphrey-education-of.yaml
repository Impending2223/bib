      when: June 23–29
      date: '1966-06-23'
      thread: vietnam-pacification
      c: 'Komer''s second trip to Vietnam: by his report, talks with sixty to seventy Americans and at least sixty Vietnamese.
        Sent, by Humphrey''s account, after the oil strikes were decided, for the civil side: the economy''s inflation, the
        port of Saigon clogged.'
      n: '[FRUS 1964–68, IV, doc. 171](https://history.state.gov/historicaldocuments/frus1964-68v04/d171) (the trip, its days
        and its talks; inflation; the port). [[w.humphrey-education-of-a-public-1976]], 344 (sent after the decision on the
        oil strikes; the civil side; inflation, corruption and mismanagement; the port clogged). The report: [[cal.1966-07-01.vietnam]].
        See [[cal.1966-03-28.vietnam]]. Names: Komer, Humphrey.'
      src:
        c: ecc36687
