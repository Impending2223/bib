      c: 'The Knight newspapers print McCarthy''s remark to John Knight, made privately some days before: his chances of the nomination zero.'
      n: '[[w.white-making-of-the-president-1969]], 282. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
