ops:
- add:
    entry:
      id: cal.1963-11-11.democratic-party
      when: Nov. 11
      date: '1963-11-11'
      thread: democratic-party
      c: Kennedy accepts his advisers' plan to double, roughly, the number of delegates to the Democratic convention, by a formula meant to reduce the South's weight in choosing the nominee.
      n: '[[w.white-making-of-the-president-1969]], 259 n.1 ("Eleven days before he died"). Check: the day, and the formula (the call for 1964). Names: John F. Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1966-11-13.republican-party
      when: Nov. 13
      date: '1966-11-13'
      thread: republican-party
      also:
      - elections-1968
      c: 'New York, the Metropolitan Club, the Sunday after the midterms. The last meeting of Congress ''66, Nixon presiding, two hours: a decision to be made in the next few weeks; the group''s view, that he must run.'
      n: '[[w.white-making-of-the-president-1969]], 50, 52 (Congress ''66: Flanigan, Hobart Lewis, Amberg, Stans, John Lodge, Garment, Sears and Evans, some twenty-five in all; $30,000 from the Republican Congressional Campaign Committee, two dozen checks of $1,000 from Helen Clay Frick, $60,000 raised by Flanigan; Nixon''s 30,000 miles and 82 districts; the meeting). See [[cal.1966-11-08.elections-1966]]. Names: Nixon, Flanigan, Stans, Garment.'
      tags:
      - name:nixon-richard-m
      - name:flanigan-peter-m
      - name:stans-maurice-h
      - name:garment-leonard
- add:
    entry:
      id: cal.1966-11-17.elections-1968
      when: Nov. 17
      date: '1966-11-17'
      thread: elections-1968
      c: 'Pacific Palisades, Los Angeles. Reagan, governor-elect, with his inner circle at his home: their first talk of the Presidency. Thomas Reed named captain of the effort.'
      n: '[[w.white-making-of-the-president-1969]], 35. Names: Reagan, Reed.'
      tags:
      - name:reagan-ronald
      - name:reed-thomas-c
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1966-11.elections-1968
      when: Nov.–Dec.
      date: 1966-11
      thread: elections-1968
      c: Reed engages F. Clifton White as counsel to Reagan's campaign. The two draw up a plan for the nomination in five phases, each with its deadline, December 1966 to August 1968.
      n: '[[w.white-making-of-the-president-1969]], 35 ("in the next two weeks" after Nov. 17). Check: the day. See [[cal.1966-11-17.elections-1968]]. Names: Reed, F. Clifton White, Reagan.'
      tags:
      - name:reed-thomas-c
      - name:white-f-clifton
      - name:reagan-ronald
- add:
    entry:
      id: cal.1966-11.elections-1968-2
      when: Nov.
      date: 1966-11
      thread: elections-1968
      c: 'Rockefeller with Shafer, Pennsylvania''s governor-elect: Shafer to take Rockefeller''s guidance on 1968; the Pennsylvania and New York delegations to go to the convention as a package.'
      n: '[[w.white-making-of-the-president-1969]], 38–39 (three days before Romney''s lunch at Dorado Beach). Check: the day. Names: Rockefeller, Shafer.'
      tags:
      - name:rockefeller-nelson
      - name:shafer-raymond-p
- add:
    entry:
      id: cal.1966-11.elections-1968-3
      when: Nov.
      date: 1966-11
      thread: elections-1968
      c: 'Dorado Beach, P.R., the Rockefeller family''s hotel. Romney, nine days after Rockefeller''s arrival, at lunch with him: Rockefeller''s promise of all support, public and private, research, speechwriters, staff if needed, money and his name.'
      n: '[[w.white-making-of-the-president-1969]], 38 (Rockefeller there the week after his re-election). Check: the day. Names: Romney, Rockefeller.'
      tags:
      - name:romney-george-w
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1966-12-16.elections-1968
      when: Dec. 16–17
      date: '1966-12-16'
      thread: elections-1968
      c: 'White Sulphur Springs, W. Va., the Greenbrier, the Governors'' Conference. Romney at a private breakfast with Republican governors: no pledges asked of them; only that none pledge to another candidate without telling him first; he will tell them first if he cannot make it. Love, Chafee, Scranton, Shafer, Winthrop and Nelson Rockefeller, Boe, Evans, Bellmon and Volpe agree.'
      n: '[[w.white-making-of-the-president-1969]], 39 ("Four weeks later" than Dorado Beach). Check: the day. See [[cal.1966-12-16.state-and-city-finance-us]]. Names: Romney, Love, Chafee, Scranton, Shafer, Winthrop Rockefeller, Nelson Rockefeller, Boe, Evans, Bellmon, Volpe.'
      tags:
      - name:romney-george-w
      - name:love-john-a
      - name:chafee-john-h
      - name:scranton-william-w
      - name:shafer-raymond-p
      - name:rockefeller-winthrop
      - name:rockefeller-nelson
      - name:boe-nils-a
      - name:evans-daniel-j
      - name:bellmon-henry
      - name:volpe-john-a
- add:
    entry:
      id: cal.1966-12.elections-1968
      when: Late Dec.
      date: 1966-12
      thread: elections-1968
      c: New York, the Waldorf-Astoria, eleven days after the Greenbrier. Romney's campaign leaders draw up a strategic plan; Leonard Hall, former national chairman, Rockefeller's surrogate there, to manage the campaign. DeVries, from the governor's staff, sets up Romney Associates over a store on East Michigan Avenue in Lansing.
      n: '[[w.white-making-of-the-president-1969]], 39–40. Check: the day. See [[cal.1966-12-16.elections-1968]]. Names: Romney, Leonard Hall, Rockefeller.'
      tags:
      - name:romney-george-w
      - name:hall-leonard-w
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1966-11.opinion
      when: Nov.
      date: 1966-11
      thread: opinion
      c: 'Harris, at the end of November: Romney 54 percent, Johnson 46. Gallup much the same.'
      n: '[[w.white-making-of-the-president-1969]], 41 (the figures as White gives them; no field dates). Check: the release and the field dates. Names: Romney, Johnson.'
      tags:
      - name:romney-george-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-04-07.elections-1968-2
      when: Apr. 7
      date: '1967-04-07'
      thread: elections-1968
      c: Johnson, irritated at first by Romney's draft speech on Vietnam, praises it that night, told the differences are minor.
      n: '[[w.white-making-of-the-president-1969]], 57 (the draft sent first to Rockefeller in New York, then a hawk, for approval). Check: the words of Johnson''s praise. See [[cal.1967-04-07.elections-1968]]. Names: Johnson, Romney.'
      tags:
      - name:johnson-lyndon-b
      - name:romney-george-w
- add:
    entry:
      id: cal.1967-07.elections-1968-4
      when: Summer
      date: 1967-07
      thread: elections-1968
      c: Sacramento. A key aide of Reagan's 1966 campaign, now in the governor's office, found a homosexual placing others on the staff. Reagan purges his staff and puts his lawyer, William French Smith, over all his political affairs; Reed's and White's plans set aside.
      n: '[[w.white-making-of-the-president-1969]], 35–36. Check: the month (White: "the summer of 1967"), and whether Pearson''s column of Oct. 31, 1967 made it public. Names: Reagan, Reed, F. Clifton White.'
      tags:
      - name:reagan-ronald
      - name:reed-thomas-c
      - name:white-f-clifton
      - state:ca
- add:
    entry:
      id: cal.1967-08-31.elections-1968-2
      when: Aug. 31
      date: '1967-08-31'
      thread: elections-1968
      c: Bloomfield Hills, Mich., the governor's residence, the morning. Romney's review of the whole campaign with Leonard Hall and his staff, running late; then the State Fair; then, late, the taping of Lou Gordon's program in Detroit.
      n: '[[w.white-making-of-the-president-1969]], 58–59. See [[cal.1967-09-04.elections-1968]]. Names: Romney, Leonard Hall.'
      tags:
      - name:romney-george-w
      - name:hall-leonard-w
      - state:mi
- add:
    entry:
      id: cal.1967-09-05.press-and-broadcasting
      when: Sept. 5
      date: '1967-09-05'
      thread: press-and-broadcasting
      also:
      - elections-1968
      c: '*New York Times*, page 28: "Romney Asserts He Underwent ''Brainwashing'' on Vietnam Trip," from its man in Detroit, Jerry Flint, to whom Gordon had given the transcript Sept. 3. The networks run the clip that evening.'
      n: '[[w.white-making-of-the-president-1969]], 59–60. To check: [*New York Times*, Sept. 5, 1967](https://timesmachine.nytimes.com/timesmachine/1967/09/05/issue.html), 28. See [[cal.1967-09-04.elections-1968]]. Names: Romney.'
      tags:
      - name:romney-george-w
- add:
    entry:
      id: cal.1967-09-06.elections-1968
      when: Sept. 6
      date: '1967-09-06'
      thread: elections-1968
      c: 'Bailey, the Democratic national chairman: Romney has "insulted the integrity of two dedicated and honorable men," Westmoreland and Lodge. McNamara: "I don''t think Governor Romney can recognize the truth when he sees it or hears it."'
      n: '[[w.white-making-of-the-president-1969]], 60 ("Within the next day or two" after Sept. 5). Check: the day of each. See [[cal.1967-09-04.elections-1968]]. Names: Romney, Westmoreland, Lodge, McNamara.'
      tags:
      - name:romney-george-w
      - name:westmoreland-william
      - name:lodge-henry-cabot
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-09-10.press-and-broadcasting
      when: Sept. 10
      date: '1967-09-10'
      thread: press-and-broadcasting
      also:
      - elections-1968
      c: 'The *Detroit News*, a Sunday editorial: Romney to quit the race, unfit; only Rockefeller can save the Republican Party.'
      n: '[[w.white-making-of-the-president-1969]], 60. Check: the day (White: "for its Sunday editorial pages"). See [[cal.1967-09-04.elections-1968]]. Names: Romney, Rockefeller.'
      tags:
      - name:romney-george-w
      - name:rockefeller-nelson
      - state:mi
      - city:detroit
- add:
    entry:
      id: cal.1967-10-16.elections-1968
      when: Oct. 16–24
      date: '1967-10-16'
      thread: elections-1968
      c: 'Aboard the *Independence*, the Governors'' Conference cruise to the Virgin Islands. Romney, *Time*''s cover on Rockefeller and Reagan under every cabin door, three times in Rockefeller''s cabin asks to be let off: he is through; Rockefeller must run. Rockefeller refuses: Romney the governors'' candidate.'
      n: '[[w.white-making-of-the-president-1969]], 60. See [[cal.1967-10-16.states-and-cities-us]]. Names: Romney, Rockefeller, Reagan.'
      tags:
      - name:romney-george-w
      - name:rockefeller-nelson
      - name:reagan-ronald
- add:
    entry:
      id: cal.1967-12-28.elections-1968
      when: Dec. 28
      date: '1967-12-28'
      thread: elections-1968
      c: 'New York, the Port Authority''s conference room at La Guardia, in secret. Romney''s lieutenants hear the poll of New Hampshire''s Republicans Rockefeller has paid for: Nixon 64.2 percent, Romney 12.0.'
      n: '[[w.white-making-of-the-president-1969]], 61 ("Three days after Christmas"). Names: Romney, Rockefeller, Nixon.'
      tags:
      - name:romney-george-w
      - name:rockefeller-nelson
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1967-08.democratic-party
      when: Early Aug.
      date: 1967-08
      thread: democratic-party
      also:
      - elections-1968
      c: 'New York, Lowenstein''s apartment, a night session with five or six student leaders: Johnson to be beaten in the primaries, a third party out of the question; a national network of students to canvass, a roof for the Democrats who will join; Wisconsin and California the targets. Lowenstein leaves $2,000 for his deputies'' travel and flies to Africa the next day. They organize ACT-68, the Alternate Candidate Task Force.'
      n: '[[w.white-making-of-the-president-1969]], 72–73 (Lowenstein: "we''ll build the base first, the candidate will come along"). Check: the day. See [[cal.1967-08-04.democratic-party]]. Names: Lowenstein.'
      tags:
      - name:lowenstein-allard
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1967-08.democratic-party-2
      when: Late Aug.
      date: 1967-08
      thread: democratic-party
      also:
      - elections-1968
      c: 'The California Democratic Council''s money pays the first full-time staff of the Concerned Democrats: Curtis Gans, from Americans for Democratic Action. By September Gans and Lowenstein a team: Gans the lists, Lowenstein a public meeting, a private meeting of leaders and a university meeting in each State.'
      n: '[[w.white-making-of-the-president-1969]], 73. Check: the day. See [[cal.1967-08-05.democratic-party]]. Names: Gans, Lowenstein.'
      tags:
      - name:gans-curtis
      - name:lowenstein-allard
- add:
    entry:
      id: cal.1967-12-05.elections-1968
      when: Dec. 5
      date: '1967-12-05'
      thread: elections-1968
      also:
      - press-and-broadcasting
      c: 'Theodore White with McCarthy, three days after the Chicago conference: the war''s drain of the country''s material and moral resources, "the old Roman problem"; Rusk''s "billion Chinese" of October the point at which he "would call a halt."'
      n: '[[w.white-making-of-the-president-1969]], 79–80 (White''s interview; McCarthy: "What''s called for is a decision"). See [[cal.1967-11-30.elections-1968]]. Names: Theodore White, McCarthy, Rusk.'
      tags:
      - name:white-theodore-h
      - name:mccarthy-eugene-j
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-12.elections-1968-4
      when: Mid-Dec.
      date: 1967-12
      thread: elections-1968
      c: 'Washington. Blair Clark takes charge of McCarthy''s campaign: two rooms in the Carroll Arms Hotel, a few volunteers, several thousand dollars a day coming unasked by mail. Clark''s first staff: Gans; Sandy Frucher, administrative assistant; Peter Barnes, researcher and writer; Seymour Hersh, press.'
      n: '[[w.white-making-of-the-president-1969]], 81 (McCarthy to Clark: "Events will march in our favor"). Check: the day. See [[cal.1967-12-14.elections-1968]]. Names: McCarthy, Gans.'
      tags:
      - name:mccarthy-eugene-j
      - name:gans-curtis
- add:
    entry:
      id: cal.1967-12.students
      when: Late Dec.
      date: 1967-12
      thread: students
      also:
      - elections-1968
      c: Sam Brown, of the Harvard Divinity School, proposes to Blair Clark $20,000 to mobilize the schools for McCarthy. Clark gives him a personal check of $200 for the University Christian Movement's conference at Cleveland; a week later, at Cleveland, Clark guarantees the $20,000; Brown to recruit five student leaders for the campuses.
      n: '[[w.white-making-of-the-president-1969]], 81. Check: the days. Names: Sam Brown, McCarthy.'
      tags:
      - name:brown-sam
      - name:mccarthy-eugene-j
      - state:oh
      - city:cleveland
- add:
    entry:
      id: cal.1967-12-27.elections-1968
      when: Dec. 27
      date: '1967-12-27'
      thread: elections-1968
      c: 'Washington. McCarthy: the New Hampshire primary "not particularly significant."'
      n: '[[w.white-making-of-the-president-1969]], 82. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:nh
- add:
    entry:
      id: cal.1967-12.elections-1968-5
      when: Late Dec.
      date: 1967-12
      thread: elections-1968
      c: 'On a train from Washington to New York, the planes grounded, in the dining car: McCarthy would open in Massachusetts and go abroad meanwhile; Blair Clark: not to be delayed, and New Hampshire the test, if the case is good anywhere.'
      n: '[[w.white-making-of-the-president-1969]], 82 (between Dec. 27 and the announcement of Jan. 3). Check: the day. See [[cal.1968-01-03.elections-1968]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-01-12.elections-1968
      when: Jan. 12
      date: '1968-01-12'
      thread: elections-1968
      c: 'Concord, N.H. Hoeh rents a storefront for McCarthy''s student volunteers, 3 Pleasant Street, a quarter of a mile down the hill from the State House: the first of hundreds.'
      n: '[[w.white-making-of-the-president-1969]], 82, 84. See [[cal.1968-01-03.elections-1968]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:nh
- add:
    entry:
      id: cal.1967-12-16.vietnam-tet
      when: Dec. 16
      date: '1967-12-16'
      thread: vietnam-tet
      also:
      - vietnam
      c: 'A summary of the enemy''s intentions and capabilities, from documents captured, in a memorandum for the President alone: Hanoi preparing a climactic drive, with a general uprising, to bring down the government in Saigon and install coalition governments in the capital and the countryside.'
      n: '[[w.white-making-of-the-president-1969]], 9 (the 101st Airborne flown out; by Christmas 102 of the 106 maneuver battalions promised for the end of 1968 deployed). Check: the paper, its author and its print. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-12-21.vietnam
      when: Dec. 21
      date: '1967-12-21'
      thread: vietnam
      c: 'Canberra, the cabinet room. Johnson briefs Australia''s cabinet: dark days ahead, "kamikaze" tactics in the coming offensive, American troops being flown out, a new division promised from Korea, a greater Australian effort wanted.'
      n: '[[w.white-making-of-the-president-1969]], 9–10. Check: FRUS for a memorandum of the meeting. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-01-31.vietnam-tet-3
      when: Jan. 31
      date: '1968-01-31'
      thread: vietnam-tet
      also:
      - elections-1968
      c: 'The White House, the upstairs sitting hall, the evening, by a guest''s account. Johnson, thirty-six hours without sleep, the Saigon embassy cleared: the cities under control; Khe Sanh will hold, Wheeler has sworn it; the hot line with Kosygin in June, twenty-seven times; McCarthy will get some votes, Robert Kennedy no trouble, Daley firm.'
      n: '[[w.white-making-of-the-president-1969]], 10–12 (Westmoreland had telephoned from the embassy in mid-afternoon). Names: Johnson, Wheeler, McCarthy, Robert Kennedy, Daley.'
      tags:
      - name:johnson-lyndon-b
      - name:wheeler-earle
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - name:daley-richard-j
      - name:westmoreland-william
- add:
    entry:
      id: cal.1968-01.war-opposition
      when: Late Jan.
      date: 1968-01
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: 'Chicago, the University of Chicago, the Student Mobilization Committee''s conference, just after the seizure of the *Pueblo*. In the chapel, a minute''s silence for Che Guevara; Kinoy: the government "The Enemy," to be fought by resistance. The march on the convention left to the Continuations Committee.'
      n: '[[w.white-making-of-the-president-1969]], 216–18 (registration at Ida Noyes Hall; the literature tables). Check: the days. Names: Kinoy.'
      tags:
      - name:kinoy-arthur
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1967-12.war-opposition
      when: Dec.
      date: 1967-12
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: The National Mobilization Committee's steering committee, some hundred, authorizes Dellinger to call a conference on the Democratic convention at Chicago.
      n: '[[w.white-making-of-the-president-1969]], 265. Check: the day. Names: Dellinger.'
      tags:
      - name:dellinger-david
- add:
    entry:
      id: cal.1968-01-27.war-opposition
      when: Jan. 27
      date: '1968-01-27'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: New York, an apartment. Twenty-five of the Mobilization meet to plan the demonstrations at the Democratic convention; the black militants will not join them.
      n: '[[w.white-making-of-the-president-1969]], 265. See [[cal.1967-12.war-opposition]]. Names: Dellinger.'
      tags:
      - name:dellinger-david
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-02-03.elections-1968-2
      when: Feb. 3
      date: '1968-02-03'
      thread: elections-1968
      c: 'Manchester, St. Anselm''s College. Nixon''s first public reception of the campaign, some two thousand. Mothers of men in Vietnam on the line; Nixon to his wife: "We''re going to see to it that boys of fourteen or fifteen ... don''t have to go off to any more wars like this."'
      n: '[[w.white-making-of-the-president-1969]], 6, 129. See [[cal.1968-02-01.elections-1968]]. Names: Nixon, Pat Nixon.'
      tags:
      - name:nixon-richard-m
      - name:nixon-pat
      - state:nh
- add:
    entry:
      id: cal.1968-02-03.elections-1968-3
      when: Feb. 3
      date: '1968-02-03'
      thread: elections-1968
      c: 'Concord, N.H., the New Hampshire Highway Hotel, a dinner of several hundred Republicans: Nixon''s first formal speech. "I don''t think America can afford four more years of Lyndon Johnson"; what America needs "the lift of a driving dream."'
      n: '[[w.white-making-of-the-president-1969]], 10, 129–30. See [[cal.1968-02-01.elections-1968]]. Names: Nixon, Johnson.'
      tags:
      - name:nixon-richard-m
      - name:johnson-lyndon-b
      - state:nh
- add:
    entry:
      id: cal.1968-02-03.elections-1968-4
      when: Feb. 3–4
      date: '1968-02-03'
      thread: elections-1968
      c: Hillsboro, N.H., the town hall, Saturday and Sunday mornings. Nixon answers a panel of New Hampshire Republicans before a color tape truck, no reporters admitted; Treleaven and Garment produce. The tapes cut into five-minute spots.
      n: '[[w.white-making-of-the-president-1969]], 133–34 (Shakespeare on "the Hillsboro approach"). See [[cal.1968-02-01.elections-1968]]. Names: Nixon, Garment.'
      tags:
      - name:nixon-richard-m
      - name:garment-leonard
      - state:nh
- add:
    entry:
      id: cal.1968-02-03.elections-1968-5
      when: Feb. 3
      date: '1968-02-03'
      thread: elections-1968
      c: Boston. A planning session for Gavin's candidacy, on entering New Hampshire's primary; Rockefeller, told of it, has Hinman telephone to stop it. Romney the standard-bearer.
      n: '[[w.white-making-of-the-president-1969]], 228. See [[cal.1968-02-23.elections-1968-2]]. Names: Gavin, Rockefeller, Hinman, Romney.'
      tags:
      - name:gavin-james-m
      - name:rockefeller-nelson
      - name:hinman-george-l
      - name:romney-george-w
      - state:ma
      - city:boston
- add:
    entry:
      id: cal.1968-02-12.elections-1968
      when: Feb. 12
      date: '1968-02-12'
      thread: elections-1968
      c: Sam Brown arrives in New Hampshire to direct McCarthy's students there.
      n: '[[w.white-making-of-the-president-1969]], 88 (Brown: "We aren''t the see-you-in-Chicago crowd"). Names: Sam Brown, McCarthy.'
      tags:
      - name:brown-sam
      - name:mccarthy-eugene-j
      - state:nh
- add:
    entry:
      id: cal.1968-02-24.elections-1968-3
      when: Feb. 24–25
      date: '1968-02-24'
      thread: elections-1968
      c: Washington's Birthday weekend. Three chartered buses from Washington and Baltimore, and nearly three hundred students from the Boston area, to canvass New Hampshire for McCarthy.
      n: '[[w.white-making-of-the-president-1969]], 85–86. Check: the days. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:nh
- add:
    entry:
      id: cal.1968-02-25.elections-1968-3
      when: Feb. 25
      date: '1968-02-25'
      thread: elections-1968
      c: 'New York, Rockefeller''s suite, Sunday afternoon. Leonard Hall, Romney''s manager, with Scranton and Hinman: Rockefeller''s last secret poll for Romney in New Hampshire, six to one against him. Scranton: mobilize the governors now; Hinman: wait. Rockefeller undecided.'
      n: '[[w.white-making-of-the-president-1969]], 229. See [[cal.1968-02-24.elections-1968]]. Names: Rockefeller, Leonard Hall, Romney, Scranton, Hinman.'
      tags:
      - name:rockefeller-nelson
      - name:hall-leonard-w
      - name:romney-george-w
      - name:scranton-william-w
      - name:hinman-george-l
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-03-02.robert-kennedy-campaign
      when: Mar. 2
      date: '1968-03-02'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'Unruh to Robert Kennedy by telephone, late at night: his private poll of California''s Democrats, Kennedy 42 percent, Lynch, Johnson''s stand-in, 28, McCarthy 11. California''s law: a statement of intention filed by Mar. 5, petitions and a slate of 344 delegates and alternates by Apr. 5.'
      n: '[[w.white-making-of-the-president-1969]], 160. See [[cal.1968-03-21.robert-kennedy-campaign]]. Names: Unruh, Robert Kennedy, McCarthy.'
      tags:
      - name:unruh-jesse-m
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-03-05.elections-1968-2
      when: Mar. 5
      date: '1968-03-05'
      thread: elections-1968
      c: 'New Hampshire, a week before the primary: Nixon''s tour of six towns of the south, Hampton, Exeter, Raymond, Plaistow, Nashua and Salem. "We ended that war, we will end this one and win the peace"; "End the War and Win the Peace."'
      n: '[[w.white-making-of-the-president-1969]], 130. Check: the day. Names: Nixon.'
      tags:
      - name:nixon-richard-m
      - state:nh
- add:
    entry:
      id: cal.1968-03-10.robert-kennedy-campaign
      when: Mar. 10–11
      date: '1968-03-10'
      thread: robert-kennedy-campaign
      c: 'Robert Kennedy, in the West, through his wife to Schlesinger: he will enter if McCarthy can be got to withdraw. Mar. 11, Schlesinger: against it; Kennedy to come out for McCarthy before the primary. Kennedy: McCarthy not fit to be President; he cannot support him.'
      n: '[[w.white-making-of-the-president-1969]], 161. Check: Chester, 119, and Schlesinger''s own account. Names: Robert Kennedy, Schlesinger, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-03-12.elections-1968-3
      when: Mar. 12
      date: '1968-03-12'
      thread: elections-1968
      also:
      - press-and-broadcasting
      c: 'New York, Nixon''s apartment, early afternoon of the primary, with Theodore White: Lamprey has called, the vote heavy; no statement on Vietnam, lest it bind him or undercut Johnson''s negotiations; if elected, the first thing he would do is try to get in touch with Red China.'
      n: '[[w.white-making-of-the-president-1969]], 147–48 ("How do you liquidate that war with honor?"; Rockefeller to need 30 percent of the Republican vote, retracted). Names: Nixon, Theodore White, Johnson.'
      tags:
      - name:nixon-richard-m
      - name:white-theodore-h
      - name:johnson-lyndon-b
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-03-13.elections-1968-3
      when: Mar. 13
      date: '1968-03-13'
      thread: elections-1968
      c: 'Manchester, McCarthy''s press conference the morning after: "I think I can get the nomination"; the Wisconsin campaign now to be financed. In Washington, off the plane, Eller with the news-ticker''s report of Robert Kennedy "reassessing"; questions at the airport about Kennedy.'
      n: '[[w.white-making-of-the-president-1969]], 89–90 (Charles Bailey of the *Minneapolis Tribune*). See [[cal.1968-03-13.robert-kennedy]]. Names: McCarthy, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - state:nh
- add:
    entry:
      id: cal.1968-03-15.robert-kennedy-campaign
      when: Mar. 15
      date: '1968-03-15'
      thread: robert-kennedy-campaign
      c: 'Kings Point, N.Y., a coffee for 175 women civic leaders: Robert Kennedy will announce his plans in Washington the next day. Leaving, asked if he has resolved "a lot of problems": "Yes, I have." At nine that morning he had told his staff he is running.'
      n: '[[w.white-making-of-the-president-1969]], 164. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      - state:ny
- add:
    entry:
      id: cal.1968-03-15.robert-kennedy-campaign-2
      when: Mar. 15–16
      date: '1968-03-15'
      thread: robert-kennedy-campaign
      c: 'Hickory Hill, a party long planned; at eleven the planners take Robert Kennedy aside: whether to fight McCarthy in the primaries. Sorensen, Dutton, Schlesinger, vanden Heuvel for avoiding battle; Walinsky and Greenfield for it; Lowenstein there. About five in the morning Edward Kennedy, back from Green Bay: "Abigail said no." At seven, in the breakfast room, Schlesinger, Sorensen, vanden Heuvel, Edward Kennedy and Dutton unanimous against a fight primary by primary. Kennedy: "I''m going to do it myself. I''m going."'
      n: '[[w.white-making-of-the-president-1969]], 165–66. See [[cal.1968-03-16.elections-1968]]; [[cal.1968-03-14.robert-kennedy]]. Names: Robert Kennedy, Sorensen, Dutton, Schlesinger, vanden Heuvel, Walinsky, Greenfield, Lowenstein, Edward Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:sorensen-theodore-c
      - name:dutton-frederick-g
      - name:schlesinger-arthur-m-jr
      - name:vanden-heuvel-william-j
      - name:walinsky-adam
      - name:greenfield-jeff
      - name:lowenstein-allard
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1968-03-24.elections-1968-2
      when: Mar. 24
      date: '1968-03-24'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Washington, the Postmaster General''s offices, a Sunday. O''Brien, by Johnson''s leave, calls the Cabinet together, State and Defense excepted: a fight to save the administration; the Secretaries of Agriculture, Labor and the Post Office into the primaries. O''Brien to Wisconsin Mar. 27.'
      n: '[[w.white-making-of-the-president-1969]], 113 (the National Committee''s last $200,000 for the final weekend''s media; twenty young men to fly to Wisconsin). See [[cal.1968-03-26.elections-1968-2]]. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-25.elections-1968-3
      when: Mar. 25
      date: '1968-03-25'
      thread: elections-1968
      c: 'Califano, called back by Johnson from a vacation in Puerto Rico, to the Democratic leaders of Queens County: get with it. His staff to compile the record of Johnson''s achievements for the campaign. Mar. 26, Califano to Johnson: his prospects in New York poor.'
      n: '[[w.white-making-of-the-president-1969]], 113. Check: the day of the meeting. Names: Califano, Johnson.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-03-23.vietnam-205000-2
      when: Mar. 23
      date: '1968-03-23'
      thread: vietnam-205000
      c: Clark Field, the Philippines. Wheeler, flown out at Johnson's request, with Westmoreland in secret, ninety minutes, on his requests.
      n: '[[w.white-making-of-the-president-1969]], 111. Check: the day (White''s Mar. 23 is a Saturday, Washington time). Names: Wheeler, Westmoreland, Johnson.'
      tags:
      - name:wheeler-earle
      - name:westmoreland-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-26.elections-1968-3
      when: Mar. 26
      date: '1968-03-26'
      thread: elections-1968
      also:
      - press-and-broadcasting
      c: 'The Oval Office, the evening, an hour: Johnson with Theodore White, Rowe present. No questions on politics, Kennedy, McCarthy or the war; the war costing only $17 billion a year, the tax cut of 1964 what squeezes; never again a tax cut; more than forty education bills; 35,000 pregnant women treated for German measles; a "Kiddicare" he would like; "I guess not many Presidents have been understood in their own time."'
      n: '[[w.white-making-of-the-president-1969]], 114–16 (Rowe, after: "up one day, down the next"). Names: Johnson, Theodore White, Rowe.'
      tags:
      - name:johnson-lyndon-b
      - name:white-theodore-h
      - name:rowe-james-h-jr
- add:
    entry:
      id: cal.1968-03-29.elections-1968
      when: Mar. 29
      date: '1968-03-29'
      thread: elections-1968
      c: 'Mrs. Johnson to a women''s group of politicians, Friday night: she will go anywhere, stump anywhere, to re-elect the President.'
      n: '[[w.white-making-of-the-president-1969]], 119. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1968-03-31.elections-1968-7
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968
      also:
      - democratic-party
      c: 'The White House, during the drafting. The Democrats'' senior politicians plan the campaign and the last effort in Wisconsin: Watson, Bailey, Criswell, Rowe, O''Brien, and Terry Sanford, named in secret the manager of Johnson''s campaign. In the Treaty Room Johnson and Busby finish the peroration.'
      n: '[[w.white-making-of-the-president-1969]], 120. See [[cal.1968-03-31.elections-1968-3]]. Names: Watson, Criswell, Rowe, O''Brien, Sanford, Johnson, Busby.'
      tags:
      - name:watson-w-marvin
      - name:criswell-john
      - name:rowe-james-h-jr
      - name:obrien-lawrence-f
      - name:sanford-terry
      - name:johnson-lyndon-b
      - name:busby-horace
- add:
    entry:
      id: cal.1968-03-31.elections-1968-8
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968
      c: 'Whitewater, Wis., the State university, the morning. McCarthy: "I don''t wish to sound overconfident, but I think the test is pretty much between me and Nixon now."'
      n: '[[w.white-making-of-the-president-1969]], 122. Names: McCarthy, Nixon.'
      tags:
      - name:mccarthy-eugene-j
      - name:nixon-richard-m
      - state:wi
- add:
    entry:
      id: cal.1968-03-31.elections-1968-9
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968
      c: 'Waukesha, Wis., the evening: McCarthy at a students'' meeting as Johnson withdraws. Abigail McCarthy telephones the President: the campaign never a matter of friendship. Johnson: "No one man can stand in the way of history." At the Schroeder in Milwaukee, McCarthy: perhaps Johnson decided he could not make peace and run at once; "five million college kids just shouting for peace."'
      n: '[[w.white-making-of-the-president-1969]], 124–25 (Goodwin, watching: "It only took six weeks"). See [[cal.1968-03-31.elections-1968]]. Names: McCarthy, Johnson, Goodwin.'
      tags:
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - state:wi
- add:
    entry:
      id: cal.1968-04-23.elections-1968-2
      when: Apr. 23
      date: '1968-04-23'
      thread: elections-1968
      c: 'New York, Whitney Communications. The Draft Rockefeller leaders to Emmet Hughes, Rockefeller''s spokesman: Rockefeller to announce now, or they give up. That night Hughes and J. Irwin Miller dine with Rockefeller and his wife: she agrees, and he.'
      n: '[[w.white-making-of-the-president-1969]], 232 (Whitney, Thayer, Miller, Stewart Mott; David Rockefeller now for running). See [[cal.1968-04-30.elections-1968-2]]. Names: Emmet Hughes, Rockefeller, Miller.'
      tags:
      - name:hughes-emmet-john
      - name:rockefeller-nelson
      - name:miller-j-irwin
      - name:whitney-john-h
      - name:rockefeller-david
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-05-28.elections-1968-11
      when: May 28
      date: '1968-05-28'
      thread: elections-1968
      c: 'Portland, Ore., the Benson Hotel''s London Grill, late, the night of the primary. Nixon at dinner, all but alone, with his wife and Howell Appling, his Oregon manager: the night''s two winners himself and McCarthy ("I''m going to have to learn more about Eugene McCarthy"); Reagan''s poor showing ends him as the South''s candidate. To Theodore White: "I''m going on to Atlanta."'
      n: '[[w.white-making-of-the-president-1969]], 136–37 (Nixon on his telethon: "a lot of these people think Bobby is more of a law-and-order man than I am!", 136 n.3). Names: Nixon, Pat Nixon, McCarthy, Reagan, Theodore White.'
      tags:
      - name:nixon-richard-m
      - name:nixon-pat
      - name:mccarthy-eugene-j
      - name:reagan-ronald
      - name:white-theodore-h
      - state:or
- add:
    entry:
      id: cal.1968-06-04.elections-1968-9
      when: June 4
      date: '1968-06-04'
      thread: elections-1968
      c: 'Key Biscayne, Fla., three days after Atlanta. Nixon''s high command, Haldeman, Mitchell, Kleindienst, Klein, Garment, Flanigan and Ellsworth, review his holdings: 757 votes by Kleindienst''s count. Kleindienst to keep the delegates and the convention; the rest to plan the general election.'
      n: '[[w.white-making-of-the-president-1969]], 139 (112 won in primaries, 108 in the Rocky Mountain States, 394 in the South and Border States). Check: the day. See [[cal.1968-05-31.elections-1968]]. Names: Nixon, Haldeman, Mitchell, Kleindienst, Klein, Garment, Flanigan, Ellsworth.'
      tags:
      - name:nixon-richard-m
      - name:haldeman-h-r
      - name:mitchell-john-n
      - name:kleindienst-richard-g
      - name:klein-herbert-g
      - name:garment-leonard
      - name:flanigan-peter-m
      - name:ellsworth-robert
- add:
    entry:
      id: cal.1968-06-04.robert-kennedy-campaign-2
      when: June 4
      date: '1968-06-04'
      thread: robert-kennedy-campaign
      also:
      - press-and-broadcasting
      c: 'Malibu, Frankenheimer''s house, the primary day, with Theodore White. Robert Kennedy pulls his son David from the undertow. CBS''s early sampling: Kennedy 49 percent, McCarthy 41, Lynch-Humphrey 10; Kennedy: two more votes a precinct, and a clean majority. Of McCarthy''s offer to step aside after one term: "Can you imagine that?"'
      n: '[[w.white-making-of-the-president-1969]], 180–81 (the week ahead: two days'' rest, then New York''s forty-one districts to the primary of June 18). See [[cal.1968-06-05.robert-kennedy]]. Names: Robert Kennedy, Theodore White, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:white-theodore-h
      - name:mccarthy-eugene-j
      - state:ca
- add:
    entry:
      id: cal.1968-07-06.elections-1968
      when: July 6–7
      date: '1968-07-06'
      thread: elections-1968
      c: 'Pacific Palisades, Los Angeles, the weekend of July 4. Emmet Hughes, for Rockefeller, an hour and a half with Reagan at his home: no deal; Reagan in the race for keeps.'
      n: '[[w.white-making-of-the-president-1969]], 236. Check: the day. Names: Emmet Hughes, Rockefeller, Reagan.'
      tags:
      - name:hughes-emmet-john
      - name:rockefeller-nelson
      - name:reagan-ronald
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-08-07.elections-1968-miami-7
      when: Aug. 7
      date: '1968-08-07'
      thread: elections-1968-miami
      c: 'Lindsay, through a friend, to Nixon: if the party makes him run for Vice President he will, but he would feel free to speak out, on foreign or urban affairs, wherever he disagreed with the President.'
      n: '[[w.white-making-of-the-president-1969]], 251 n.3 ("If I were Nixon ... I wouldn''t dream of accepting my offer"). Check: the day (White: "the previous day"). See [[cal.1968-08-08.elections-1968-miami-2]]. Names: Lindsay, Nixon.'
      tags:
      - name:lindsay-john-v
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-08.elections-1968-chicago-2
      when: Aug.
      date: 1968-08
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'The National Mobilization, Dellinger, Hayden and Rennie Davis, plans for Chicago: half a million called for in the spring, a hundred thousand hoped for, twenty to thirty thousand expected; forty mobile command posts, not the hundred planned.'
      n: '[[w.white-making-of-the-president-1969]], 287. Check: the date. Names: Dellinger, Hayden, Rennie Davis.'
      tags:
      - name:dellinger-david
      - name:hayden-tom
      - name:davis-rennie
- add:
    entry:
      id: cal.1968-08-20.elections-1968-chicago-5
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968-chicago
      also:
      - soviet-union-czechoslovakia
      c: 'The night of the invasion of Czechoslovakia, after the National Security Council: Johnson keeps Humphrey for a lecture: not Presidential timber, soft on foreign policy, bending to McCarthy''s doves, straining the loyalty of Connally and the South.'
      n: '[[w.white-making-of-the-president-1969]], 278 (the President to a newsman, of Humphrey: "He cries too much"; to a friend in July: "Hubert''s just too old-fashioned"). Check: Humphrey''s own account. Names: Johnson, Humphrey, McCarthy, Connally.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
      - name:connally-john
- add:
    entry:
      id: cal.1968-08-20.soviet-union-2
      when: Aug. 20
      date: '1968-08-20'
      thread: soviet-union
      also:
      - testing-missile-talks
      c: William Bundy has finished the draft of a secret note to the allies telling them of a coming summit with Kosygin and its purpose; Christian ready to tell the country. That evening the invasion of Czechoslovakia ends it.
      n: '[[w.white-making-of-the-president-1969]], 277–78. Check: the note in FRUS. See [[cal.1968-08-20.testing-missile-talks-2]]. Names: William Bundy, Christian, Kosygin.'
      tags:
      - name:bundy-william
      - name:christian-george
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1968-08-24.elections-1968-chicago-7
      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968-chicago
      c: 'Humphrey, from Minnesota, Saturday evening, to a friend in New York: is Johnson going to dump him? "I can''t believe it."'
      n: '[[w.white-making-of-the-president-1969]], 279 n.5 (the White House''s polls of Oklahoma, Tennessee, Kentucky and North Carolina, Humphrey third behind Wallace; "Hubert''s been destroyed by the Czechoslovakia thing"). Names: Humphrey, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-20
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - opinion
      c: 'Harris, held to the *Washington Post*''s release, to Johnson at the Ranch by telephone, 9 p.m.: Humphrey, McCarthy and Johnson alike six points behind Nixon. Asked how a visit to the convention for Daley''s party on his sixtieth birthday would go: he might be booed.'
      n: '[[w.white-making-of-the-president-1969]], 279–80 n.5 (Watson''s message that "Austin" wanted him; by midnight the Southern governors back with Humphrey). Names: Johnson, Humphrey, McCarthy, Nixon, Daley, Watson.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
      - name:nixon-richard-m
      - name:daley-richard-j
      - name:watson-w-marvin
- add:
    entry:
      id: cal.1968-08-23.elections-1968-chicago-9
      when: Aug. 23
      date: '1968-08-23'
      thread: elections-1968-chicago
      c: 'Stephen Smith, in secret, to Chicago, the Friday before the convention: talk of a draft of Edward Kennedy, unlikely, confirmed.'
      n: '[[w.white-making-of-the-president-1969]], 283. See [[cal.1968-08-24.elections-1968-2]]. Names: Stephen Smith, Edward Kennedy.'
      tags:
      - name:smith-stephen-e
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-14
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: 'Chicago, the Conrad Hilton, after eight. Daley at breakfast pledges Humphrey his full support. Then McKeithen of Louisiana: the Southern favorite sons have withdrawn. Alioto to nominate Humphrey.'
      n: '[[w.white-making-of-the-president-1969]], 290 (Edward Kennedy''s call during the breakfast). See [[cal.1968-08-28.elections-1968-2]]. Names: Daley, Humphrey, McKeithen, Alioto.'
      tags:
      - name:daley-richard-j
      - name:humphrey-hubert-h
      - name:mckeithen-john-j
      - name:alioto-joseph-l
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-15
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: 'Suite 2525A, 1:40 p.m., Humphrey at lunch with Jackie Robinson and Elgin Baylor, for the photographers, watching the debate on Vietnam: Nixon''s law-and-order "subdued racism"; "I''m not going to pay the price of silence." At 2:40, with O''Brien and Connell, the Vice Presidency: Muskie, Harris, Alioto, Hughes, Shriver, Shriver Daley''s choice.'
      n: '[[w.white-making-of-the-president-1969]], 291–93 (to Rolvaag: "I talked to Rockefeller on the phone and told him we needed a coalition government"; Vanocur: "It wasn''t a Kennedy boom, it was a Vanocur boom"). Names: Humphrey, Jackie Robinson, Nixon, O''Brien, Muskie, Harris, Alioto, Shriver, Daley.'
      tags:
      - name:humphrey-hubert-h
      - name:robinson-jackie
      - name:nixon-richard-m
      - name:obrien-lawrence-f
      - name:muskie-edmund-s
      - name:harris-fred-r
      - name:alioto-joseph-l
      - name:shriver-r-sargent
      - name:daley-richard-j
      - name:rolvaag-karl-f
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-13
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      c: 'About 1:30 a.m., the Southern governors, Connally leading, an hour with Humphrey: Governor Hughes of New Jersey struck off for the Vice Presidency. Humphrey tells Hughes. Connally suggests Vance.'
      n: '[[w.white-making-of-the-president-1969]], 304 (at four, Humphrey''s three: Harris, Vance, Muskie). See [[cal.1968-08-29.elections-1968-chicago-7]]. Names: Connally, Humphrey, Richard Hughes, Vance.'
      tags:
      - name:connally-john
      - name:humphrey-hubert-h
      - name:hughes-richard-j
      - name:vance-cyrus
- add:
    entry:
      id: cal.1968-08-31.elections-1968
      when: Aug. 31
      date: '1968-08-31'
      thread: elections-1968
      c: 'Waverly, Minn. Humphrey''s first statement of the campaign: the Chicago riots "planned" and "premeditated"; time to "quit pretending that Mayor Daley did something that was wrong."'
      n: '[[w.white-making-of-the-president-1969]], 334. Check: the day. Names: Humphrey, Daley.'
      tags:
      - name:humphrey-hubert-h
      - name:daley-richard-j
      - state:mn
- add:
    entry:
      id: cal.1968-09.elections-1968-17
      when: Sept.
      date: 1968-09
      thread: elections-1968
      c: 'New Orleans. Nixon to the American Legion''s convention, his sixth, then lunch at Antoine''s with the press and Louisiana''s Republicans, off the record: the honeymoon in Mexico, the trip in the worst cabin of the *Ulua*.'
      n: '[[w.white-making-of-the-president-1969]], 332–33 (Price''s guess for the result, Nixon 48, Humphrey 41, Wallace 11; four things that could lose it). Check: the day. Names: Nixon, Price.'
      tags:
      - name:nixon-richard-m
      - name:price-raymond-k-jr
      - state:la
      - city:new-orleans
- add:
    entry:
      id: cal.1968-09.elections-1968-18
      when: Late Sept.
      date: 1968-09
      thread: elections-1968
      c: 'Chicago, four weeks after the convention: Wallace''s motorcade through the Loop, then, in the evening, Cicero, Ill.: the schools, the open housing law to be repealed, "a man''s home is still his castle." A youth with a McCarthy placard set upon in the crowd.'
      n: '[[w.white-making-of-the-president-1969]], 348–50 (the signs: "POLISH WANT WALLACE"). Check: the day. Names: Wallace.'
      tags:
      - name:wallace-george-c
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-10-02.elections-1968
      when: Oct. 2–3
      date: '1968-10-02'
      thread: elections-1968
      c: McCarthy's organization in Maryland for Humphrey; Oct. 3, several New York reform clubs and the Student Leaders for McCarthy.
      n: '[[w.white-making-of-the-president-1969]], 356 (ten Democratic Congressmen, McCarthy''s supporters, for Humphrey the same week). Names: McCarthy, Humphrey.'
      tags:
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-10-05.elections-1968
      when: Oct. 5
      date: '1968-10-05'
      thread: elections-1968
      c: Americans for Democratic Action endorses Humphrey, its executive board 71 to 16.
      n: '[[w.white-making-of-the-president-1969]], 356. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-10-07.vietnam-paris-2
      when: Oct. 7
      date: '1968-10-07'
      thread: vietnam-paris
      also:
      - soviet-union
      c: 'New York, an unofficial channel: a Soviet diplomat to an American political figure, unnamed: Moscow wants the war ended and now holds the upper hand in Hanoi; if the bombing stops, a positive answer from Hanoi guaranteed. Oct. 8 to the White House, which adds the demilitarized zone; a day later it tells him to drop out.'
      n: '[[w.white-making-of-the-president-1969]], 377–78 (Oct. 12, the channel''s guarantee; Oct. 16, closed). Check: the participants. See [[cal.1968-10-06.vietnam-paris]].'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-10-18.elections-1968-3
      when: Oct. 18–19
      date: '1968-10-18'
      thread: elections-1968
      c: Connally publicly back with Humphrey, promising all help; to stump Texas with him the next week. Oct. 19, Ribicoff.
      n: '[[w.white-making-of-the-president-1969]], 357. Names: Connally, Humphrey, Ribicoff.'
      tags:
      - name:connally-john
      - name:humphrey-hubert-h
      - name:ribicoff-abraham
- add:
    entry:
      id: cal.1968-10-22.elections-1968-4
      when: Oct. 22
      date: '1968-10-22'
      thread: elections-1968
      c: 'Ohio, Nixon''s train from Cincinnati north toward Toledo, his eighth speech of the day at dusk at Deshler, Ohio: the crimes of forty-five minutes; leadership that has "struck out on every count." A girl''s sign in the crowd: BRING US TOGETHER. That night, to Finch: the crowds better than 1960''s, but older.'
      n: '[[w.white-making-of-the-president-1969]], 373–75 (Safire: "the campaign needed some excitement"). Check: the day. Names: Nixon, Finch.'
      tags:
      - name:nixon-richard-m
      - name:finch-robert-h
      - state:oh
- add:
    entry:
      id: cal.1968-10-25.elections-1968-4
      when: Oct. 25
      date: '1968-10-25'
      thread: elections-1968
      c: 'Las Vegas, the airport, at dusk, two speeches still to come. Humphrey: "Who can you trust?"; "if he is a friend of the workingman, Scrooge is Santa Claus"; Agnew: "if you have seen one of Nixon''s decisions, you have seen them all."'
      n: '[[w.white-making-of-the-president-1969]], 359–61 (the day: Los Angeles, a staff conference on Nixon''s nuclear position, the Farmers'' Market; San Jose State College; a seminar with California scientists). See [[cal.1968-10-25.elections-1968-2]]. Names: Humphrey, Agnew, Nixon.'
      tags:
      - name:humphrey-hubert-h
      - name:agnew-spiro-t
      - name:nixon-richard-m
      - state:nv
- add:
    entry:
      id: cal.1968-11-03.elections-1968-chennault-3
      when: Nov. 3
      date: '1968-11-03'
      thread: elections-1968-chennault
      c: 'Johnson to Nixon in Los Angeles by telephone, Sunday, of Saigon''s refusal. Finch''s charge that Johnson had moved before "he had gotten all his ducks in a row": "Who''s this guy Fink you got?"'
      n: '[[w.white-making-of-the-president-1969]], 381, 383 n.4. To check: [Johnson and Nixon, 1:54 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-november-3-1968), Conversation WH6811-02-13710 (Miller Center). See [[cal.1968-10-23.elections-1968]]. Names: Johnson, Nixon, Finch.'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      - name:finch-robert-h
- add:
    entry:
      id: cal.1968-12.transition-and-staff-2
      when: Dec.
      date: 1968-12
      thread: transition-and-staff
      also:
      - press-and-broadcasting
      c: 'New York, the Pierre, the thirty-ninth floor, an hour: Nixon, President-elect, with Theodore White. A continuing dialogue with the Soviet Union; Europe, Germany first, the "condition precedent"; then the Middle East, Latin America, Africa; China someday, once Asia can stand; the Defense budget "the most shocking thing, those damned figures"; "a whole-worlder, not a half-worlder."'
      n: '[[w.white-making-of-the-president-1969]], 412–15 (America "the best-fed, the best-clothed, the best-housed nation in the world—but also the ugliest"). Check: the day (the week before the Cabinet''s naming, Dec. 11). Names: Nixon, Theodore White.'
      tags:
      - name:nixon-richard-m
      - name:white-theodore-h
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1967-11.elections-1968-6
      when: Early Nov.
      date: 1967-11
      thread: elections-1968
      c: Rowe to Johnson, a long memorandum analyzing the unrest in the party.
      n: '[[w.white-making-of-the-president-1969]], 105. Check: the day and the text. Names: Rowe, Johnson.'
      tags:
      - name:rowe-james-h-jr
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-11.elections-1968-4
      when: Nov.
      date: 1967-11
      thread: elections-1968
      c: O'Brien, Postmaster General, to Johnson, a memorandum on the trouble in the party, after Rowe's.
      n: '[[w.white-making-of-the-president-1969]], 105. Check: the day and the text. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-11.elections-1968-5
      when: Nov.
      date: 1967-11
      thread: elections-1968
      c: 'The White House. Johnson with old political friends, their first talk of the campaign: the war, getting out the vote, the women''s committee, labor, the farmers, money; whether to enter the primaries, undecided. Truman''s 1948 recalled; no decisions.'
      n: '[[w.white-making-of-the-president-1969]], 105–6. Check: the day. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-12.elections-1968-6
      when: Mid-Dec.
      date: 1967-12
      thread: elections-1968
      also:
      - press-and-broadcasting
      c: 'O''Brien to Theodore White, a few weeks after the White House meeting: the old rules of politics to be rewritten; some 14,000,000 new voters, 2,000,000 of them Negroes, 12,000,000 young, youth to head the list; a sitting President not to be unhorsed within his party.'
      n: '[[w.white-making-of-the-president-1969]], 106 ("six weeks before Tet"). Check: the day. See [[cal.1967-11.elections-1968-5]]. Names: O''Brien, Theodore White.'
      tags:
      - name:obrien-lawrence-f
      - name:white-theodore-h
- add:
    entry:
      id: cal.1967-10.elections-1968-3
      when: Oct.
      date: 1967-10
      thread: elections-1968
      c: The Ranch. Johnson dictates to Christian a draft statement of resignation, to be shown to Connally. No decision.
      n: '[[w.white-making-of-the-president-1969]], 107 (Johnson''s own version of the renunciation). Check: the day; Christian''s account. Names: Johnson, Christian, Connally.'
      tags:
      - name:johnson-lyndon-b
      - name:christian-george
      - name:connally-john
      - state:tx
- add:
    entry:
      id: cal.1967-12.elections-1968-7
      when: Late Dec.
      date: 1967-12
      thread: elections-1968
      c: On the flight around the world, Australia to Rome and home, Busby urges Johnson to withdraw.
      n: '[[w.white-making-of-the-president-1969]], 107. Check: the day. See [[cal.1967-10.elections-1968-3]]. Names: Busby, Johnson.'
      tags:
      - name:busby-horace
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-16
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: 'The Conrad Hilton, Suite 2320, about 7:30 p.m. McCarthy at the window with Walter and Marie Ridder as the police draw up on Michigan Avenue: Cannae, a double envelopment; "a ballet of purgatory." The wounded brought up to the fifteenth floor, his staff''s; he will not go down: "If I go down, I claim them; and they''re not mine."'
      n: '[[w.white-making-of-the-president-1969]], 300–301. To check: Marie and Walter Ridder, unpublished reporting, Aug. 28, 1968 (cited by [[w.white-making-of-the-president-1969]], 300 n.9). See [[cal.1968-08-28.elections-1968-chicago]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1967-11-10.elections-1968
      when: Nov. 10
      date: '1967-11-10'
      thread: elections-1968
      also:
      - press-and-broadcasting
      c: 'New York, Nixon''s apartment, Theodore White''s first call: no "new Nixon," only time to read these eight years, Moynihan among others; a book with Price nearly done, on the last third of the century; of the feud with Rockefeller, two quantities too large for one party; "I''ve always thought this country could run itself domestically without a President ... the President makes foreign policy."'
      n: '[[w.white-making-of-the-president-1969]], 144, 146–47. Names: Nixon, Theodore White, Price, Rockefeller, Moynihan.'
      tags:
      - name:nixon-richard-m
      - name:white-theodore-h
      - name:price-raymond-k-jr
      - name:rockefeller-nelson
      - name:moynihan-daniel-patrick
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1967-12.elections-1968-8
      when: Dec.
      date: 1967-12
      thread: elections-1968
      c: 'Nixon to his delegate men in Washington, from New York: no muscle tactics; the nomination to come in good will, not by Goldwater''s way of 1964; scout and be ready.'
      n: '[[w.white-making-of-the-president-1969]], 135 (Sears''s and Ellsworth''s charts of convention strength at the end of 1967). Check: the day. Names: Nixon.'
      tags:
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-02.elections-1968-4
      when: Feb.
      date: 1968-02
      thread: elections-1968
      c: Nixon names Kleindienst, of Arizona, Goldwater's deputy in 1964, his director of field operations.
      n: '[[w.white-making-of-the-president-1969]], 135 (Parkinson, then Bellmon, then Ellsworth and Sears before him; eight delegate regions, Denver the first meeting a few days after New Hampshire). Check: the day. Names: Nixon, Kleindienst.'
      tags:
      - name:nixon-richard-m
      - name:kleindienst-richard-g
- add:
    entry:
      id: cal.1967-12.robert-kennedy-campaign-2
      when: Late Dec.
      date: 1967-12
      thread: robert-kennedy-campaign
      c: 'The week after Christmas. Robert Kennedy skiing at Sun Valley, Idaho, with Salinger: his own future no longer matters; the country cannot stand four more years of Johnson. Then California: Unruh presses him to run; at Los Angeles the RAND Corporation''s experts brief him on the war, discouraging. Back in Washington, Edward Kennedy no longer argues against it.'
      n: '[[w.white-making-of-the-president-1969]], 158. Check: the days. Names: Robert Kennedy, Salinger, Johnson, Unruh, Edward Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:salinger-pierre
      - name:johnson-lyndon-b
      - name:unruh-jesse-m
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1968-08.elections-1968-miami-2
      when: Early Aug.
      date: 1968-08
      thread: elections-1968-miami
      c: 'A telephone call from Miami Beach to Nixon, resting at Montauk, N.Y.: to his staff''s surprise, he will take a Vietnam plank pointed toward negotiation, not escalation.'
      n: '[[w.white-making-of-the-president-1969]], 245–46 (Lipscomb''s subcommittee''s first draft; Romney''s and Rockefeller''s language joined; Javits''s call for negotiations; the final draft marked by paragraph "P," "R" and "N"). Check: the day. See [[cal.1968-08-04.elections-1968-miami-2]]. Names: Nixon.'
      tags:
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-07.elections-1968-3
      when: July
      date: 1968-07
      thread: elections-1968
      c: 'Nixon to Finch by telephone, several weeks before the convention: the Vice Presidency. Finch declines, not ready, and suggests John Gardner; Nixon thinks of Franklin Murphy, of UCLA. Nixon''s private polls: no name adds or takes more than a point or two.'
      n: '[[w.white-making-of-the-president-1969]], 249–50 (Bob Wilson''s poll of House Republicans, Lindsay three to one). Check: the day. Names: Nixon, Finch, Gardner.'
      tags:
      - name:nixon-richard-m
      - name:finch-robert-h
      - name:gardner-john-w
- add:
    entry:
      id: cal.1968-08-06.elections-1968-miami-19
      when: Aug. 5–7
      date: '1968-08-06'
      thread: elections-1968-miami
      c: 'Miami Beach, the Deauville, Reagan''s headquarters, the sixteenth floor. F. Clifton White counting: sixteen North Carolina votes taken from Nixon; a hundred more needed from Georgia, Mississippi, Florida and Louisiana; Florida''s chairman, Murfin, holding out.'
      n: '[[w.white-making-of-the-president-1969]], 240–41 (Charlton Lyons "on the wire" but held by his commitment). Check: the day. Names: Reagan, F. Clifton White, Nixon.'
      tags:
      - name:reagan-ronald
      - name:white-f-clifton
      - name:nixon-richard-m
