patch: 2026-11-14-rok-public-1961
by: 'Claude (Reader B, the ROK pilot, Nov. 14, 2026: the Official Gazette, nos. 2856–2889, May 16–June 22, 1961, read from the page images); audited by Opus, Nov. 14, 2026 (the doubles with the log merged into the log''s patch or here, the readings checked against the pages)'
ops:
- add:
    entry:
      id: cal.1961-05-17.korea-leadership-3
      when: May 17
      date: '1961-05-17'
      thread: korea-leadership
      c: 'Proclamations 9–11, Chang Do-young, chairman. Curfew cut to 10 p.m.–5 a.m. Arrest, detention and search in the martial-law area without a court warrant where the revolution needs it; cases it needs go to a military court. Judges and prosecutors to clear civil and criminal cases promptly and without favor; the Chief Justice and the Justice Minister to report their progress to him.'
      n: '[[w.kwanbo]], [no. 2857 (May 17, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647886&actionType=date) (Committee Proclamations 9–11). Names: Chang Do-young.'
      tags:
      - polity:rok
      - name:chang-yo-yong
- add:
    entry:
      id: cal.1961-05-18.korea-leadership-3
      when: May 18
      date: '1961-05-18'
      thread: korea-leadership
      c: '4 p.m. The Military Revolutionary Committee names its members, Decree 3: thirty officers, Chang Do-young and Park Chung Hee at their head, and two advisers, Kim Hong-il and Kim Tong-ha.'
      n: '[[w.kwanbo]], [no. 2860 (May 20, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647889&actionType=date) (Committee Decree 3, dated May 18). Names: Chang Do-young, Park, Kim Hong-il, Kim Tong-ha.'
      tags:
      - polity:rok
      - name:chang-yo-yong
      - name:park-chung-hee
      - name:kim-hong-il
- add:
    entry:
      id: cal.1961-05-18.korea-leadership-4
      when: May 18
      date: '1961-05-18'
      thread: korea-leadership
      c: 'Proclamation 13. Non-political marches by students, working people, religious bodies and citizens in support of the revolution allowed, with notice to the local authority; the freeze lifted on foreigners'' funds, the diplomatic missions'' and the U.N. forces''; ordinary dealings with foreign banks resumed. Proclamations 12 and 14–16 the same day: public works go on, details of the freeze, coastal shipping may sail.'
      n: '[[w.kwanbo]], [no. 2858 (May 18, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647887&actionType=date) (Committee Proclamations 12–16). [[w.ilchi]], I, May 18, 1961, directives, item 1 (Proclamation 12, the public works).'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-19.korea-leadership-3
      when: May 19
      date: '1961-05-19'
      thread: korea-leadership
      c: 'Proclamation 18, Chang Do-young. Communist activity a danger to the state. Severe punishment for forming or joining an anti-state body, for praising or helping it, for taking its orders or its money, and for making or spreading its papers; the Communist party and bodies acting with it are such a body.'
      n: '[[w.kwanbo]], [no. 2859 (May 19, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647888&actionType=date) (Committee Proclamation 18; the page image upside down). See [[cal.1961-05-18.korea-leadership-3]]. Names: Chang Do-young.'
      tags:
      - polity:rok
      - name:chang-yo-yong
- add:
    entry:
      id: cal.1961-05-19.korea-leadership-4
      when: May 19
      date: '1961-05-19'
      thread: korea-leadership
      c: 'Proclamation 17, Chang Do-young. One month, May 20 to June 19, to turn in unlicensed firearms, blades and explosives; no charge for those who report in the time, severe punishment after.'
      n: '[[w.kwanbo]], [no. 2859 (May 19, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647888&actionType=date) (Committee Proclamation 17). See [[cal.1961-05-19.korea-leadership-3]]. Names: Chang Do-young.'
      tags:
      - polity:rok
      - name:chang-yo-yong
- add:
    entry:
      id: cal.1961-05-20.korea-leadership-6
      when: May 20
      date: '1961-05-20'
      thread: korea-leadership
      c: 'Supreme Council Proclamation 1. The ban on leaving the country eased, for those on public business, Koreans returning to homes abroad, students and scholarship holders, the spouses and adopted children of foreigners, airline crews and a few others; not for Communist sympathizers, opponents of the revolution, holders of illicit wealth or others found unfit.'
      n: '[[w.kwanbo]], [no. 2860 (May 20, 1961), 2](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647889&actionType=date) (Supreme Council Proclamation 1).'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-21.korea-leadership-3
      when: May 21
      date: '1961-05-21'
      thread: korea-leadership
      c: 'Supreme Council Decrees 5–7. Decree 5: every officer, soldier and army civilian to keep to the rules; no leaving the post, no drink in working hours, no restaurants, dance halls, billiard rooms or tea rooms. Decree 6: generals and colonels relieved or moved, and officers set over the Board of Audit, the Inspection Committee, the Maritime Affairs Administration and the coal and electric companies. Decree 7 confirms Brig. Gen. Cho Hŭng-man at the Home Ministry''s public security bureau.'
      n: '[[w.kwanbo]], [no. 2861 (May 21, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647890&actionType=date) (Supreme Council Decrees 5–7). Names: Cho Hŭng-man.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-22.korea-leadership-2
      when: May 22
      date: '1961-05-22'
      thread: korea-leadership
      c: 'Supreme Council Proclamation 6. All political parties and social organizations dissolved as of May 23. Relief, scholarly and religious bodies without politics, and others the Council allows, to register again by May 31.'
      n: '[[w.kwanbo]], [no. 2862 (May 22, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647891&actionType=date) (Supreme Council Proclamations 5–10). [[w.ilchi]], I, May 23, 1961, revolution, item 4 (the day it took effect).'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-22.korea-leadership-3
      when: May 22
      date: '1961-05-22'
      thread: korea-leadership
      c: 'Supreme Council Proclamation 9. Parades and events in support of the revolution barred from May 23; Committee Proclamation 13 of May 18 void.'
      n: '[[w.kwanbo]], [no. 2862 (May 22, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647891&actionType=date) (Supreme Council Proclamation 9). See [[cal.1961-05-18.korea-leadership-4]].'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-27.korea-leadership-5
      when: May 27
      date: '1961-05-27'
      thread: korea-leadership
      c: 'Supreme Council Decree 17. All functions of the special courts and special prosecutors'' offices stopped from noon.'
      n: '[[w.kwanbo]], [no. 2867 (May 27, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647896&actionType=date) (Supreme Council Decree 17). [[w.ilchi]], I, May 27, 1961, business, item 1.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-28.korea-leadership
      when: May 28
      date: '1961-05-28'
      thread: korea-leadership
      c: 'Supreme Council Decree 20, the outline for dealing with illicit wealth, July 1, 1953 to May 15, 1961. Officials and politicians who took 50 million hwan or more by their posts; businessmen who gained 100 million or more from state property or contracts, or 200 million from public works, purchases abroad or unpaid taxes, or $300,000 in foreign-exchange loans; those who sent $20,000 or more abroad. A committee under the Council to investigate and dispose: officials and those who sent property abroad in three months, the businessmen in one. Decree 22 the same issue stops the earlier special law.'
      n: '[[w.kwanbo]], [no. 2868 (May 28, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647897&actionType=date) (Supreme Council Decree 20; Decree 22 by its title in the contents).'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-06-05.korea-leadership-3
      when: June 5
      date: '1961-06-05'
      thread: korea-leadership
      c: 'Supreme Council Decree 39. Changes in the Central Intelligence Agency''s bureaus: two bureau chiefs relieved, others named, Kim Chong-p''il among them.'
      n: '[[w.kwanbo]], [no. 2875 (June 5, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647904&actionType=date) (Supreme Council Decree 39). Names: Kim Chong-p''il. Check: which post Kim Chong-p''il takes; the page sets the ranks and names in columns apart from the posts, and the pairing is not sure.'
      tags:
      - polity:rok
      - name:kim-chong-pil
- add:
    entry:
      id: cal.1961-06-05.korea-leadership-4
      when: June 5
      date: '1961-06-05'
      thread: korea-leadership
      c: 'President Yun Po-sun signs a general amnesty, Cabinet Decree 8, Chang Do-young countersigning: offenses before June 6 against the curfew, the road rules and the minor-offenses law pardoned.'
      n: '[[w.kwanbo]], [no. 2875 (June 5, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647904&actionType=date) (Cabinet Decree 8). See [[cal.1961-05-17.korea-leadership-3]]. Names: Yun, Chang Do-young.'
      tags:
      - polity:rok
      - name:yun-po-sun
      - name:chang-yo-yong
- add:
    entry:
      id: cal.1961-06-10.korea-leadership-4
      when: June 10
      date: '1961-06-10'
      thread: korea-leadership
      c: 'President Yun Po-sun promulgates the Supreme Council Law, Law 618, Chang Do-young countersigning: seven standing committees and a standing committee of their chairmen; planning committees; under the Council, a Central Intelligence Agency, a secretariat, the Reconstruction National Movement headquarters and other bodies. Law 620, on rural debt, the same day.'
      n: '[[w.kwanbo]], [no. 2879 (June 10, 1961), supp. 1, 1–2](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647909&actionType=date) (Law 618; Law 620 by its title in the contents). [[w.ilchi]], I, June 11, 1961, announcements, item 2 (Law 618, entered a day late); June 9, announcements, item 2 (Law 620, entered a day early). Names: Yun, Chang Do-young.'
      tags:
      - polity:rok
      - name:yun-po-sun
      - name:chang-yo-yong
- add:
    entry:
      id: cal.1961-06-12.korea-leadership-2
      when: June 12
      date: '1961-06-12'
      thread: korea-leadership
      c: 'President Yun Po-sun promulgates Law 621, on the registration of social organizations, Chang Do-young countersigning. Relief, scholarly, religious and other bodies register with the ministers concerned, the bodies the Council allows with the Minister of Public Information; a minister may dissolve one that acts against the state; those registered under Proclamation 6 dissolved unless they take their certificates in fifteen days.'
      n: '[[w.kwanbo]], [no. 2880 (June 12, 1961), supp. 1, 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647910&actionType=date) (Law 621). See [[cal.1961-05-22.korea-leadership-2]]. Names: Yun, Chang Do-young. Check: the articles on dissolution are read in part.'
      tags:
      - polity:rok
      - name:yun-po-sun
      - name:chang-yo-yong
- add:
    entry:
      id: cal.1961-06-22.korea-leadership-4
      when: June 22
      date: '1961-06-22'
      thread: korea-leadership
      c: 'President Yun Po-sun promulgates Law 633, the Special Crimes Punishment Law, under Article 22 of the Extraordinary Measures Law. Death, life or five years and more for murder, injury or arson tied to elections, and for organized or habitual smuggling of 50 million hwan or more; abuse of office by ministers and assemblymen.'
      n: '[[w.kwanbo]], [no. 2889 (June 22, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647919&actionType=date) (Law 633). [[w.ilchi]], I, June 23, 1961, announcements, item 1 (entered a day late: counter-revolutionary and anti-state acts). Names: Yun. Check: the later articles are not read.'
      tags:
      - polity:rok
      - name:yun-po-sun
- cite:
    id: cal.1961-05-16.japan-and-korea
    item: '[[w.kwanbo]], [no. 2856 (May 16, 1961), 1–2](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647885&actionType=date) (the Committee''s decrees and proclamations: martial law, the seizure of power, Chang Do-young its chairman and martial-law commander, Park his deputy commander; not the Army units, the Americans, or the 18th)'
    units: A, D
