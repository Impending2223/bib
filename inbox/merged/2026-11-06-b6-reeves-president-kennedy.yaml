      when: June 22
      date: '1961-06-22'
      thread: transition-and-staff
      c: 'After two days of a sore throat, the President in a high fever, 105 degrees; penicillin and cold sponge baths through
        the night. In the morning, at 101, he hands his crutches to a Secret Service man and walks into the meeting with Ikeda.
        Dr. Travell''s statement: no serious concern about his health.'
      n: '[[w.reeves-president-kennedy]], 181. To check: Herbert Parmet and Hans Kraus, interviews by Reeves; Andrew Hatcher,
        press briefing, June 16, 1961, Salinger papers, Box 46, JFK Library (cited by [[w.reeves-president-kennedy]], 181).
        Check: the day of the meeting with Ikeda, and of Travell''s statement; Reeves gives none for the statement. See [[cal.1961-06-20.transition-and-staff]].
        Names: Kennedy, Ikeda.'
      src:
        c: 7fcf688d
        rows:
        - 'w.reeves-president-kennedy 181: all'
        - 'via w.reeves-president-kennedy 181 n.on-june-22.a: all'
        - 'via w.reeves-president-kennedy 181 n.on-june-22.b: all'
      tags:
