      when: Dec. 10
      date: '1960-12-10'
      thread: transition-and-staff-cabinet
      also:
      - press-and-broadcasting
      c: Palm Beach. Rusk arrives; at Kennedy's feet the *Washington Post*, its headline naming him Secretary of State, leaked
        by Kennedy to Philip Graham, its publisher. With Rusk in the room, Kennedy telephones Stevenson and offers him the
        UN; Stevenson accepts, to serve under Rusk.
      n: '[[w.reeves-president-kennedy]], 25–26. To check: Dean Rusk, interview by Reeves (cited by [[w.reeves-president-kennedy]],
        25). Check: the day; Reeves has Kennedy tell Rusk, the day after the offer, "I''m going to Palm Beach tomorrow. You
        come down." See [[cal.1960-12-09.transition-and-staff]]. Names: Rusk, Kennedy, Stevenson.'
      src:
        c: 858feb98
        rows:
        - 'w.reeves-president-kennedy 25–26: all'
        - 'via w.reeves-president-kennedy 25 n.dean-rusk.a: all'
      tags:
      - name:rusk-dean
      - name:kennedy-john-f
      - name:stevenson-adlai-e
