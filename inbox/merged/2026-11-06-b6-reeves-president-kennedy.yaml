      id: cal.1960-12-09.transition-and-staff-cabinet
      when: Dec. 9
      date: '1960-12-09'
      thread: transition-and-staff-cabinet
      c: Rusk, offered State by telephone, tells Kennedy he cannot afford to leave his Rockefeller Foundation salary for a
        Cabinet member's. Calls to the Rockefeller brothers, Nelson Rockefeller first; the Foundation provides a financial
        package to supplement his government salary.
      n: '[[w.reeves-president-kennedy]], 25–26. To check: Dean Rusk, interview by Reeves; [[w.schoenbaum-waging-war-and-peace]],
        15–24 (cited by [[w.reeves-president-kennedy]], 25). Check: the day; Reeves puts the calls between the offer and Rusk''s
        arrival at Palm Beach. See [[cal.1960-12-09.transition-and-staff]]. Names: Rusk, Kennedy, Nelson Rockefeller.'
      src:
        c: e6aba289
        rows:
        - 'w.reeves-president-kennedy 25–26: all'
        - 'via w.reeves-president-kennedy 25 n.dean-rusk.a: all'
      tags:
      - name:rusk-dean
      - name:kennedy-john-f
      - name:rockefeller-nelson
- add:
    entry:
