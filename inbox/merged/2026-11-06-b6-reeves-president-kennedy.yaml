      c: 'The Cabinet Room. Wofford brings in the Peace Corps'' National Advisory Council. Harry Belafonte asks Kennedy to
        say something more about the Freedom Riders; Eugene Rostow: "a need now for moral leadership." Kennedy, angry, asks
        if they have read his statement; afterward, to Wofford, he has done more for civil rights than any President.'
      n: '[[w.reeves-president-kennedy]], 131–132. To check: [[w.wofford-of-kennedys-and-kings]], 125–126 (cited by [[w.reeves-president-kennedy]],
