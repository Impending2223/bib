      date: '1962-12-31'
      thread: states-and-cities
      c: Albany, the Executive Mansion. The second term opens with Rockefeller's New Year's Eve dinner for family and close
        associates; at ten thirty he bids them good night. Oren Root, the banking commissioner, and Brownell see 1963 in at
        the DeWitt Clinton's bar.
