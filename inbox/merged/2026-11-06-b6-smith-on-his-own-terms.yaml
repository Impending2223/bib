      when: Feb. 13
      date: '1961-02-13'
      thread: elections-1964
      c: 'Rockefeller to Rod Perkins: Charles Bartlett has asked, within days of the inauguration, that the President, to
        escape the White House, may walk the grounds of Rockefeller''s Foxhall Road estate in Washington; Rockefeller "delighted."'
      n: '[[w.smith-on-his-own-terms]], 356. To check: Rockefeller to Rod Perkins, Feb. 13, 1961, Rockefeller Archive Center
        (cited by [[w.smith-on-his-own-terms]], 356 n.). Names: Rockefeller, Bartlett, Kennedy.'
