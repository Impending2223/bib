- add:
    entry:
      id: cal.1961-03-02.states-and-cities
      when: Mar. 2
      date: '1961-03-02'
      thread: states-and-cities
      c: Albany, the Executive Mansion, shortly before eleven at night. Fire, blamed on faulty wiring; the governor and his
        wife down a fire ladder from the porch roof. Seventy pictures and sculptures lost, among them canvases by Stuart and
        Sully left by Harriman. Rockefeller keeps the house and contributes toward its repair; meanwhile the Ten Eyck Hotel.
      n: '[[w.smith-on-his-own-terms]], 358. To check: Robert Bennett, interview by Smith; *Newsweek*, Mar. 13, 1961; *Time*,
        Mar. 10, 1961 (cited by [[w.smith-on-his-own-terms]], 358 n.). Names: Rockefeller, Harriman.'
      tags:
      - name:rockefeller-nelson
      - name:harriman-w-averell
      - state:ny
      src:
        c: 73a83b2d
        rows:
        - 'w.smith-on-his-own-terms 358: all'
