      c: 'A governors'' conference, by Cargo''s account. Rockefeller and Cargo of New Mexico at George Wallace''s table for
        lunch. Wallace lights a cigar; Rockefeller calls a Negro aide of his party to join them; Wallace grinds the stub into
        his custard. Rockefeller: "there are many things in this life that can be forgiven, but that isn''t one of them."'
      n: '[[w.smith-on-his-own-terms]], 535. To check: David Cargo, interview by Smith (cited by [[w.smith-on-his-own-terms]],
        535 n.). See [[cal.1968-07-21.states-and-cities-us]]. Check: the day; whether the conference at Cincinnati, July 21–24.
        Names: Rockefeller, Cargo, Wallace.'
