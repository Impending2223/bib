      c: 'Margate, Scranton''s estate, both men now for Scranton. Rockefeller asks Grindle what it would have taken to get
        him out of New Hampshire. Grindle: "A bribe ... For ten thousand dollars, you would have seen the back of me." Rockefeller:
        "Oh, my Christ ... And I spent three million."'
      n: '[[w.smith-on-his-own-terms]], 443. To check: Paul Grindle, interview by Smith (cited by [[w.smith-on-his-own-terms]],
