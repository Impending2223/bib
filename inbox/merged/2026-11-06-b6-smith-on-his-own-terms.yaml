      when: Nov. 29
      date: '1961-11-29'
      thread: elections-1964
      c: Idlewild, evening. Rockefeller back from New Guinea, met by family, State officials and some two hundred reporters;
        a tribute to Michael, in the present tense. Then to Pocantico.
      n: '[[w.smith-on-his-own-terms]], 367–68. See [[cal.1961-11-19.elections-1964]]. Names: Rockefeller.'
      tags:
