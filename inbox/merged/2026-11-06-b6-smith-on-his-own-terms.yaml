      id: cal.1961-11-19.elections-1964
      when: Nov. 19
      date: '1961-11-19'
      thread: elections-1964
      c: 'Sunday, two days after the separation. Word through the Dutch ambassador: Michael Rockefeller missing in the Arafura
        Sea off New Guinea since the 18th. Near midnight Rockefeller leaves New York with Mary, Michael''s twin, to take charge
        of the search, a dozen reporters aboard.'
      n: '[[w.smith-on-his-own-terms]], 365–66. To check: Rockefeller oral history, July 26, 1977, 48 (cited by [[w.smith-on-his-own-terms]],
        366 n.). See [[cal.1961-11-17.elections-1964]]. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
      src:
        c: 0e8098d2
        rows:
        - 'w.smith-on-his-own-terms 365–66: all'
- add:
    entry:
      id: cal.1961-11-22.elections-1964
      when: Nov. 22
      date: '1961-11-22'
      thread: elections-1964
      also:
      - defense
      c: 'Merauke, New Guinea. Rockefeller cables Louise Boyer: "Reasonable chance Michael reached shore"; helicopters needed.
        Boyer to ask Gilpatric, Deputy Secretary of Defense, his friend, for Dutch and Australian helicopters. Rockefeller
        turns down an aircraft carrier of the Seventh Fleet.'
      n: '[[w.smith-on-his-own-terms]], 367. To check: Rockefeller to Louise Boyer, cable, Nov. 22, 1961, Rockefeller Archive
        Center; *Newsweek*, Dec. 4, 1961 (cited by [[w.smith-on-his-own-terms]], 367 n.). See [[cal.1961-11-19.elections-1964]].
        Check: the day of the carrier''s offer. Names: Rockefeller, Gilpatric.'
      tags:
      - name:rockefeller-nelson
      - name:gilpatric-roswell-l
      src:
        c: a0dbfe93
        rows:
        - 'w.smith-on-his-own-terms 367: all'
        - 'via x.1961-11-22.rockefeller-cable-to-boyer-nov-22-1961: A, B'
