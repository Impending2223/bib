- add:
    entry:
      id: cal.1966-11-10.king
      when: Nov. 10
      date: '1966-11-10'
      thread: king
      also:
      - labor
      c: 'King with Hoffa, the meeting put off to this day after the reporters'' questions; Clarence Jones and Harold Gibbons,
        a Teamsters vice president, sitting in. King will support a union drive to organize Chicago''s hospital workers; Hoffa
        pledges SCLC $50,000.'
      n: '[[w.garrow-bearing-the-cross]], 536. To check: New York Times, Nov. 8, 1966, 23 (cited by [[w.garrow-bearing-the-cross]],
        536 n.13); [[w.garrow-fbi-and-martin-luther]], 179 (cited by [[w.garrow-bearing-the-cross]], 536 n.13); FBI 100-438794-1643,
        1659, NY 100-111180-9-1117A, Nov. 8, 1966, and 100-106670-2764, Nov. 9, 1966 (cited by [[w.garrow-bearing-the-cross]],
        536 n.13). Made public: Check. See [[cal.1966-10-28.king]]. Names: Martin Luther King, Hoffa.'
      src:
        c: 42a931f3
        rows:
