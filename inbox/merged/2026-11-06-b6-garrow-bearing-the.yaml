- add:
    entry:
      id: cal.1967-01.congress-powell
      when: Jan.
      date: 1967-01
      thread: congress-powell
      also:
      - king
      c: 'Levison to King on the telephone: black leaders puzzled that King has not spoken up for Powell, kept from his seat.
        King: his silence odd, with Wilkins for Powell, but Wilkins and the others do not know Powell as he does; he does
        not care what becomes of him. By the FBI''s wiretap.'
      n: '[[w.garrow-bearing-the-cross]], 542. Made public: Check. Check: the day; Garrow: "Several days later" than the call
        of Jan. 3–5, after the House''s vote; his note gives an FBI report of Jan. 9 among others. To check: SAC, New York,
        to Director, Jan. 9, 1967, 100-106670-2814 (cited by [[w.garrow-bearing-the-cross]], 542 n.18). See [[cal.1967-01-10.congress]].
        Names: Levison, Martin Luther King, Powell, Wilkins.'
      src:
        c: 5dfe6313
