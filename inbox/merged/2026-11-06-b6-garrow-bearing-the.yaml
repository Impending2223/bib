- add:
    entry:
      id: cal.1963-03-19.king
      when: Mar. 19
      date: '1963-03-19'
      thread: king
      c: 'Levison at lunch with Lem Harris, a financial officer of the Communist party: he and his friends are through with
        the party. Harris''s memorandum of the talk ("a whole group ... are now disenchanted") reaches the FBI through its
        double agents in the party, Jack and Morris Childs. Levison to his brother, Roy Bennett, the next day, on the wiretap:
        "I was tough."'
      n: '[[w.garrow-bearing-the-cross]], 235 (quoting the memorandum). Made public: Check. To check: FBI NY 100-111180-9-112,
        Mar. 20, 1963 (cited by [[w.garrow-bearing-the-cross]], 235 n.6); SAC New York to Director, Apr. 3, 1963, 100-392452-196
        (cited by [[w.garrow-bearing-the-cross]], 235 n.6); Garrow''s conversations with Roy Bennett (cited by [[w.garrow-bearing-the-cross]],
        235 n.6). Names: Levison.'
      src:
        c: 93fbafac
        rows:
        - 'w.garrow-bearing-the-cross 235: all'
        - 'via w.garrow-bearing-the-cross 235 n.6d: all'
        - 'via w.garrow-bearing-the-cross 235 n.6e: all'
        - 'via w.garrow-bearing-the-cross 235 n.6f: all'
      tags:
      - 'name:levison-stanley-d'
- add:
    entry:
      id: cal.1965-05-24.alabama
      when: May 24
      date: '1965-05-24'
      thread: alabama
      also:
      - voting-rights
      c: 'Montgomery. SCLC''s "descent" on the legislature, put off from May 18: in place of a sit-in at the capitol, a cordial
        visit to some willing legislators by a modest number of black constituents. King in town little more than a day; to
        the Negro American Labor Council''s convention: "there must be a better distribution of wealth within this country."'
      n: '[[w.garrow-bearing-the-cross]], 425–27. To check: New York Times, May 25, 1965, 23 (cited by [[w.garrow-bearing-the-cross]],
        427 n.70); New York Times, May 26, 1965, 1 (cited by [[w.garrow-bearing-the-cross]], 427 n.70). See [[cal.1965-05-07.alabama]].
        Names: Martin Luther King.'
      src:
        c: 50c49ee2
        rows:
        - 'w.garrow-bearing-the-cross 425–27: all'
        - 'via w.garrow-bearing-the-cross 427 n.70a: all'
      tags:
