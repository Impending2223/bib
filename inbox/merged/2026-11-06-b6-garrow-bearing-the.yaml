- add:
    entry:
      id: cal.1967-01-03.king
      when: Jan. 3–5
      date: '1967-01-03'
      thread: king
      also:
      - war-opposition
      c: 'Los Angeles, King at the Hyatt House for a week''s rest and his book. Levison telephones with messages: Lowenstein,
        McWilliams of the *Nation*, Coffin and Norman Thomas want him to take a stronger stand against the war; Coffin, Thomas
        and Lowenstein would talk with him of a third-party candidacy in 1968. King, by the FBI''s summary: not with the idea
        of winning but "to give an alternative"; running "an interesting idea." Levison: it needs more sober thought.'
      n: '[[w.garrow-bearing-the-cross]], 541–42 (quoting the FBI''s summary). Made public: Check. Check: the day; Garrow:
        the first of two calls after his arrival Jan. 3; his note''s FBI reports of Jan. 3–5. To check: FBI 100-106670-2809,
        2810, 2811, Jan. 3–5, 1967, and FBI NY 100-111180-9-1175A, Jan. 5, 1967 (cited by [[w.garrow-bearing-the-cross]],
        542 n.18); Thomas to King, Dec. 31, 1966 (cited by [[w.garrow-bearing-the-cross]], 542 n.18). Names: Martin Luther
        King, Levison, Lowenstein, Coffin.'
      src:
        c: '21518944'
        rows:
        - 'w.garrow-bearing-the-cross 541–42: all'
        - 'via w.garrow-bearing-the-cross 542 n.18b: all'
        - 'via w.garrow-bearing-the-cross 542 n.18d: all'
      tags:
