      c: 'Mao 毛泽东 revises the Center''s 中共中央 telegram of Oct. 22 thanking the National Committee of the Popular Socialist Party of Cuba 古巴人民社会党 for its greetings on the People''s Republic''s national day. The closing passage is his: new victories, under the leadership of Fidel Castro 菲德尔·卡斯特罗, against aggression led by American imperialism; cries for Cuba against the Yankees and for the peoples of the twenty Latin American countries.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 369 (Oct. 22, 1960; printed from Mao''s revised copy; his additions set in a different type). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Central Committee of the CCP, telegram of Oct. 22, 1960 thanking the National Committee of the Popular Socialist Party of Cuba for its national-day greetings (cited by [[w.jianguo-yilai-mao-zedong]], XV, 369 n.1). Names: Mao Zedong, Fidel Castro. Check: whether and where the telegram was printed at the time.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:castro-fidel
      - vis:only:prc
      src:
        c: b55686d9
        rows:
