      c: 'Mao 毛泽东, 1 a.m.: ''an important document'', to be printed for the Central Work Conference at Canton 广州 (Mar. 15–23) to discuss: Chen Boda''s 陈伯达 record, sent Mar. 15, of the talk of Mar. 14–15 of the Guangdong 广东 committee and the Center''s investigation group with Liang Jinan 梁纪南, Party branch secretary of Mengkeng 蒙坑 brigade, and Su Pinfang 苏品芳, of Lidong 里洞 commune, Xinxing 新兴 county: the brigade split back into its two old cooperatives; all by work, the needy helped from welfare funds; grain to households, mess halls in the busy season; procurement fixed three to five years.'
