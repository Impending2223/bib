      when: Mar. 29
      date: '1961-03-29'
      thread: china-leadership
      time: 1961-03-28T20:00Z
      time_zone: Asia/Shanghai
      c: 'Mao 毛泽东, 4 a.m., to Tao Zhu 陶铸 and Chen Boda 陈伯达: read on arrival the General Office''s *Qingkuang jianbao* 情况简报 no. 113 of Mar. 24, the Shandong 山东 rural work department''s views on the commune system; to be taken up at their talk about 1 p.m. The views: big counties and communes to be cut; the small team the real producer without the right to distribute; ownership, use, production and distribution to be one; accounting units of fifty or sixty households.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 530–531 (Mar. 29, 1961; Mao''s comment of Mar. 29, 4 a.m. (上午四时); printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: General Office of the Central Committee, *Qingkuang jianbao*, no. 113, Mar. 24, 1961 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 530 n.2a); Rural Work Department of the Shandong Provincial Party Committee, "Views from discussions on the system of the rural people''s communes", *Nongcun gongzuo qingkuang*, no. 5, Mar. 17, 1961 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 530 n.2b). Names: Mao Zedong, Tao Zhu, Chen Boda.'
