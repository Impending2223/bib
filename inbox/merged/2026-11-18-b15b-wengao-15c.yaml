- add:
    entry:
      id: cal.1961-01-10.china-leadership-3
      when: Jan. 10
      date: '1961-01-10'
      thread: china-leadership
      c: 'Mao 毛泽东, on the report of Jan. 9 of Huang Huoqing 黄火青, first secretary in Liaoning 辽宁, and Zhou Yang 周扬 on how Jinzhou''s 锦州 Factory 401 settled its workers'' grain troubles, which he titles ''Is the Jinzhou experience worth spreading?'': worth spreading, but real problems to be solved; the papers to be printed for those at the conference. The report: troubles May–July, from strain, low rural rations and seven or eight hundred drifters hired; education and better mess halls from August; workers'' families'' low rations, newly promoted cadres, some intellectuals, over twenty with edema.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 474–475 (Jan. 10, 1961; Mao''s comment of Jan. 10; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Huang Huoqing and Zhou Yang, report of Jan. 9, 1961 on Jinzhou''s Factory 401 settling its workers'' grain troubles (cited by [[w.jianguo-yilai-mao-zedong]], XV, 474 n.1); Zhou Yang, letter of Jan. 9, 1961 to Mao Zedong sending the Jinzhou report (cited by [[w.jianguo-yilai-mao-zedong]], XV, 475 n.2a); General Office of the Central Committee, *Qingkuang jianbao*, Jan. 3, 1961: "Some noteworthy points in present school work" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 475 n.2b); Propaganda Department, *Xuanjiao dongtai*, 1961, no. 2, Jan. 9, 1961: "Some good ways to do public-order work by caring for the people''s livelihood and patient education" (cited by [[w.jianguo-yilai-mao-zedong]], XV,
        475 n.2c). See [[cal.1960-12-30.china-leadership-3]]. Names: Mao Zedong, Huang Huoqing, Zhou Yang.'
