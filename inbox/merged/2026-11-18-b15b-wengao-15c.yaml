      when: Mar. 22
      date: '1961-03-22'
      thread: china-leadership
      c: 'Mao 毛泽东: ''Some members'' and cadres'' views on pay by work'', inquiry material Chen Boda 陈伯达 sends him Mar. 22, written by two of his staff in Guangdong 广东 and before that in Hebei 河北, to be printed for the Central Work Conference at Canton 广州 (Mar. 15–23): a national question, to be solved quickly. The views: without pay by work no zeal; help for needy households open, not hidden in supply; ''work points carry grain''; 80 percent of one county''s people for a 3:7 split of supply and wages.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 524–525 (Mar. 22, 1961; Mao''s comment of Mar. 22, written on Chen''s report; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Chen Boda, report of Mar. 22, 1961 sending "Some members'' and cadres'' views on pay by work" (by two staff who inquired with him in Guangdong and earlier in Hebei) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 524 n.1). Names: Mao Zedong, Chen Boda.'
      tags:
