    units: A
- cite:
    id: cal.1961-03-11.china-leadership
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 499–500 (Mar. 11, 1961; Mao''s note of Mar. 11 on ''Investigation work'': an old piece against dogmatism in the Red Army, called ''book worship'', written about spring 1930, unseen thirty years, found in January 1961 at the Central Revolutionary Museum, which had it from the Longyan prefectural committee in Fujian; copies to be printed; and his note to Lin Biao the same day; the editors (500 n.1): a lithographed copy given by a peasant of Shanghang county in 1957, sent to the museum in August 1959, lent to the Political Research Office at the end of 1960; printed from the manuscript)'
