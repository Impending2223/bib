    item: '[[w.jianguo-yilai-mao-zedong]], XV, 383–386 (Nov. 3, 1960; Mao''s note to Zhou Enlai, early Nov. 3 (''3rd, early''), on Zhou''s draft of Oct. 31: revisions made, some of them important; Zhou to talk them over with Li Fuchun, Tan Zhenlin, Liao Luyan, Chen Zhengren and Chen Boda and settle them; to go by telegram, the faster the better; his revisions (three-level ownership unchanged at least seven years, to 1967; pay by work at least twenty years; grain to pass the test, 1961–67; classes three winters running) and the changed wording on household pigs (''should be encouraged''); he set the issue date Nov. 3 and the Center issued it that day (386 n.3); printed from the manuscript and Mao''s revised copy; the volume gives no hour for the telegram)'
