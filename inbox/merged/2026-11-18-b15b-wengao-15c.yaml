- add:
    entry:
      id: cal.1960-10-27.china-leadership-8
      when: Oct. 27
      date: '1960-10-27'
      thread: china-leadership
      c: 'Mao 毛泽东: the Hebei 河北 measures on rural grain rations, running the mess halls well and distribution to be printed and sent to the regional bureaus and the provincial, city and regional first secretaries for reference. The measures, the points of an oral report of Oct. 20 by Yan Dakai 阎达开, a secretary of the Hebei Party committee and vice-governor: rations set at the mess halls at six, seven or eight liang a head a day (ten-liang scale), ''melons and vegetables in place of grain'' 瓜菜代; next year''s contracted output 18.2 billion jin, 2 billion more sought, all to reserves; 5.46 billion jin procured; plots for the mess halls; seventy percent of income to the members; the ''communist wind'' 共产风 to be cleared and repaid.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 375–376 (Oct. 27, 1960; Mao''s comment of Oct. 27, written on the General Office''s *Qingkuang jianbao* 情况简报 no. 581 of Oct. 25; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: General Office of the Central Committee, *Qingkuang jianbao* no. 581, Oct. 25, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 375 n.1a); Yan Dakai, secretary of the Hebei Party committee secretariat and vice-governor, oral report of Oct. 20, 1960, "Some measures on rural grain rations, running the mess halls well and distribution" (its points printed in *Qingkuang jianbao* no. 581) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 375 n.1b). Names: Mao Zedong, Yan Dakai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
