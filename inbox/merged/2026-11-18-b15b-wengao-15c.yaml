      when: Jan. 3
      date: '1961-01-03'
      thread: china-leadership
      c: 'The Henan 河南 provincial committee directs the prefectural committees and the Zhengzhou 郑州 city committee to carry out Mao''s 毛泽东 and the Central-South Bureau''s comments on the Xinyang 信阳 report: every county, commune and team whose leadership the enemy has seized to take it back by Xinyang''s means and make up the democratic revolution to the end. It says Wu Zhipu 吴芝圃, its first secretary, telephoned Mao''s comment from Peking 北京 the evening of Jan. 1, and the bureau''s came the morning of the 2nd.'
