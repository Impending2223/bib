- add:
    entry:
      id: cal.1960-11-25.china-leadership-2
      when: Nov. 25
      date: '1960-11-25'
      thread: china-leadership
      c: 'Mao 毛泽东 to Zhou Enlai 周恩来, on the Zhejiang 浙江 provincial committee''s report of Aug. 26 on the key commercial-grain areas, sent him by Deng Zihui 邓子恢 Nov. 23: read it if he has not, and return it to Deng; Deng, back from Shanxi 山西, Hebei 河北, Anhui 安徽 and Jiangsu 江苏, has some good ideas; Zhou to talk with him when free. The report: in ten key counties the 1959 procurement over 300 jin a mu; heavier farm tax there; it proposes procurement adjusted between counties, the tax rate held to 11 percent of fixed output, a fen more a jin for communes selling over 10 million jin, and the aid for poor teams sent to those areas.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 413–414 (Nov. 25, 1960; Mao''s comment of Nov. 25, written on Deng Zihui''s letter of Nov. 23; printed from the manuscript. The editors (414 n.3): Deng toured Shanxi, Hebei and Jiangsu, three provinces, not four). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Zhejiang Provincial Party Committee, report of Aug. 26, 1960 to the Center and the Shanghai Bureau, "On the problems in the key commercial-grain areas" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 413 n.2a); Deng Zihui, letter of Nov. 23, 1960 to Mao Zedong sending the Zhejiang report (Mao''s comment written on it) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 413 n.2b). Names: Mao Zedong, Zhou Enlai, Deng Zihui. Check: the provinces: Mao names four, the editors three (Anhui not among them).'
      tags:
