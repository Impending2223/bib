- add:
    entry:
      id: cal.1960-11-13.china-leadership-4
      when: Nov. 13
      date: '1960-11-13'
      thread: china-leadership
      c: 'Mao 毛泽东 sends Zhou Enlai 周恩来 Xinhua''s 新华社 *Cankao ziliao* 参考资料 no. 3952 of Nov. 11: read pp. 53–55, two UPI 合众国际社 items, Kennedy to push a larger military budget through Congress quickly, and UPI, on Kennedy''s election, soothing South Korea: the Democrats to keep the Republicans'' anticommunist policy. He marks ''readable'' by both titles and underlines the Democratic platform''s words on resisting communism ''in Berlin, Formosa''.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 396–397 (Nov. 13, 1960; Mao''s comments of Nov. 13 on the cover and by the two titles; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Xinhua, *Cankao ziliao*, no. 3952, Nov. 11, 1960, pp. 53–55 (two UPI items on Kennedy: the military budget; South Korea) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 396 n.1). Names: Mao Zedong, Zhou Enlai, Kennedy.'
      tags:
