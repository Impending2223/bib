- add:
    entry:
      id: cal.1960-12-23.china-leadership-4
      when: Dec. 23
      date: '1960-12-23'
      thread: china-leadership
      c: 'Mao 毛泽东, at Peking 北京, on the General Office''s bulletin on three Hebei 河北 communes: read it quickly and discuss it; the whole country, he thinks, is much like this, good, bad and middling; it may go down to the communes. To Chen Boda 陈伯达 and Yang Shangkun 杨尚昆: to be printed for those at the coming conference. The bulletin, ''A sharp contrast'': in Tangshan 唐山, Wangguanying 王官营 commune of Fengrun 丰润, on poor hill land, has gained each year by holding to the policy; Shaliuhe 沙流河 of Yutian 玉田, richer, has lost output and people since 1958, edema and abnormal deaths, the ''winds'', the Twelve Articles not yet shown to the masses; Liangjiadian 亮甲店, flooded, over-procured, cleaned up in March, has near 800 jin a head.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 442–444 (Dec. 23, 1960; Mao''s comment of Dec. 23 and his note to Chen and Yang; printed from the manuscripts). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: General Office of the Central Committee, *Qingkuang jianbao*, no. 664, Dec. 15, 1960: the General Office''s Hebei work team, "A sharp contrast" (Wangguanying, Shaliuhe and Liangjiadian communes) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 442 n.1). Names: Mao Zedong, Chen Boda, Yang Shangkun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:chen-boda
      - vis:only:prc
      src:
        c: '6c0206c2'
        rows:
        - 'w.jianguo-yilai-mao-zedong XV, 442–444: all'
        - 'via w.jianguo-yilai-mao-zedong XV, 442 n.1: all'
- add:
    entry:
      id: cal.1960-12-23.china-leadership-5
      when: Dec. 23
      date: '1960-12-23'
      thread: china-leadership
      c: 'Mao 毛泽东: Tan Zhenlin''s 谭震林 report of Dec. 12 on grain to be printed for those at the coming Central Work Conference, to study and discuss whether it is fit; he titles it ''The grain situation and the planned use of grain''. Tan: the year''s output about 370 billion jin, 320 to 330 billion into the granaries; rations very low in the villages, city sales and exports cannot be cut more; eat less for three months to avoid grain troubles in spring; next year a tight-then-loose plan, rations of one jin of rice a head a day and 0.75 jin of wheat and coarse grain, city sales 4.2 billion jin a month.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 445–446 (Dec. 23, 1960; Mao''s comment of Dec. 23, written on the report; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Tan Zhenlin, report of Dec. 12, 1960 to Mao Zedong and the Politburo Standing Committee on the grain situation (titled by Mao "The grain situation and the planned use of grain") (cited by [[w.jianguo-yilai-mao-zedong]], XV, 445 n.1). Names: Mao Zedong, Tan Zhenlin.'
      tags:
