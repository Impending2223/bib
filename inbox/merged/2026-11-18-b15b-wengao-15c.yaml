      when: Mar. 27
      date: '1961-03-27'
      thread: china-leadership
      c: 'Zhou Enlai 周恩来, back in Peking 北京, cables Mao 毛泽东 at Canton 广州 the draft oral answer to the CPSU''s letter of Mar. 21, agreed by the Secretariat: thanks for the loan of a million tons of grain and 500,000 of sugar, the grain kept as China''s reserve; after the June wheat harvest or a new Australian contract for a million tons (3.64 million in all, 7.28 billion jin), the Soviets to be told it is no longer needed.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 528–529 (Mar. 27, 1961; note 1, Zhou''s telegram as the volume gives it). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Zhou Enlai, telegram of Mar. 27, 1961 to Mao Zedong with the draft oral answer to the CPSU Central Committee''s letter of Mar. 21 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 528 n.1). Names: Zhou Enlai, Mao Zedong. Check: whether the first edition''s notes (vol. 9, 1996) give it.'
      tags:
