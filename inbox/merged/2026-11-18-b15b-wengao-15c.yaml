- add:
    entry:
      id: cal.1960-11-28.china-leadership-7
      when: Nov. 28
      date: '1960-11-28'
      thread: china-leadership
      c: 'Mao 毛泽东 drafts the Center''s 中共中央 comment of Nov. 28 sending the regional bureaus and the provincial, city and regional committees the Zhejiang 浙江 provincial committee''s report of Nov. 20 on carrying out the Emergency Directive Letter: it reflects Zhejiang''s real state, of use everywhere. His note: to Zhou Enlai 周恩来, Li Fuchun 李富春, Tan Zhenlin 谭震林 and Chen Boda 陈伯达, then by telegram; not to Tibet; the report itself not back to Zhejiang. The report: the letter received Nov. 4 and passed down; the ''five winds'' traced to ownership and farm labor misjudged, output overestimated; a five-level cadre meeting by counties in November–December, rectification to the end of February.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 419–421 (Nov. 28, 1960; the comment, dated by the Center Nov. 28, and Mao''s note; printed from Mao''s manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Zhejiang Provincial Party Committee, report of Nov. 20, 1960 to the Center and the East China Bureau, "On carrying out the current policy questions of the people''s communes" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 420 n.1). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Tan Zhenlin, Chen Boda. Check: the day the Center sent it.'
