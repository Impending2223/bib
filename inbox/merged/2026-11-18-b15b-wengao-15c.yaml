      c: 'Mao 毛泽东, morning, to Tian Jiaying 田家英, on the *Hongqi* 红旗 editorial department''s article ''A basic summary of the experience of the Chinese people''s revolutionary victory'', for the fourth volume of the *Selected Works* 毛泽东选集: well written; he has revised it a little; Tian and Chen Boda 陈伯达 to weigh it and, if they agree, print it. His revisions add that the ''Left'' adventurists held the Party''s leading organs for several years and struck down the correct leaders headed by Mao; that after the victory of 1935 the revolution''s forces, cut to a tenth, quickly revived; that the revolutionary people''s task was to guard and strengthen their state machine.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 377–379 (Oct. 28, 1960; Mao''s comment of the morning of Oct. 28 and his revisions; printed from the manuscript and the Central Archives'' revised copy). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Names: Mao Zedong, Tian Jiaying, Chen Boda. Check: the dates of the revisions: the volume prints them under Oct. 28–29.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:chen-boda
      - vis:only:prc
      src:
        c: ec6f956e
        rows:
