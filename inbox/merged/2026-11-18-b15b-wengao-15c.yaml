      c: 'Mao 毛泽东 on the Gansu 甘肃 provincial committee''s second report of Nov. 15 on carrying out the Center''s Emergency Directive Letter: ''readable; should be read''; and, 7 a.m., to Chen Boda 陈伯达: read it and send it back. The report: the province''s three-level cadre meeting from Nov. 6; the ''communist wind'' common and grave; of 560 communes, 29 percent badly hit, 1 percent untouched; draught animals and labor much reduced, sown area and output down; the provincial committee''s own errors.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 408–409 (Nov. 20, 1960; Mao''s two comments on the report, the second dated Nov. 20, 7 a.m.; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Gansu Provincial Party Committee, "Second report on carrying out the Center''s Emergency Directive Letter", Nov. 15, 1960, to the Center and the Northwest Bureau (cited by [[w.jianguo-yilai-mao-zedong]], XV, 408 n.1). Names: Mao Zedong, Chen Boda.'
