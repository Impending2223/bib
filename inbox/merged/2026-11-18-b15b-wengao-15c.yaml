      when: Mar. 19
      date: '1961-03-19'
      thread: china-leadership
      c: 'Mao 毛泽东: Song Renqiong''s 宋任穷 ''Some questions of the rural people''s communes and farm output in the Northeast'' 东北, very well written, to be printed for the Central Work Conference at Canton 广州 (Mar. 15–23) to study and adopt. The material, from the Northeast group of Mar. 15–16: a commune to a township, the brigade the old higher cooperative, the team the lower; the brigade the basic accounting unit; egalitarianism cut; mess halls voluntary and smaller; supply and marketing and handicraft cooperatives restored; eighteen questions in all.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 521–522 (Mar. 19, 1961; Mao''s comment of Mar. 19; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Song Renqiong, first secretary of the Northeast Bureau, "Some questions of the rural people''s communes and farm output in the Northeast" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 521 n.1). Names: Mao Zedong, Song Renqiong.'
