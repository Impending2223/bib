      c: 'Mao 毛泽东, Liu Shaoqi 刘少奇, Zhu De 朱德 and Zhou Enlai 周恩来 telegraph Hoxha, Lleshi and Shehu from Peking 北京 on the 16th anniversary of Albania''s liberation: the second five-year plan''s industrial and cooperative targets met a year early; the Albanian Party''s fight against modern revisionism, ''the chief danger'' in the movement, and for the unity of the camp headed by the Soviet Union; the Chinese Party proud of such a comrade-in-arms.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 422–424 (Nov. 28, 1960; telegram of Nov. 28, 1960; printed from the *Renmin ribao* of Nov. 29, 1960). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Hoxha, Lleshi, Shehu.'
