      when: Dec. 14
      date: '1960-12-14'
      thread: china-leadership
      c: 'Mao 毛泽东 to Liu Shaoqi 刘少奇, Zhu De 朱德, Zhou Enlai 周恩来, Deng Xiaoping 邓小平 and Peng Zhen 彭真: the Military Commission''s resolution on political and ideological work in the army, revised by a small group of Chen Boda 陈伯达 and Tian Jiaying 田家英, the changes agreed by Luo Ruiqing 罗瑞卿, Xiao Hua 萧华 and Liu Zhijian 刘志坚; to be read in about ten days and given to Yang Shangkun 杨尚昆 to print for the Party, government, army and mass systems, the army first. He revises the corrected draft again: leading cadres to study Mao''s works and the classics of Marx, Engels, Lenin and Stalin for their spirit; the militia''s composition to be pure, under reliable Party cadres.'
