      time: 1960-10-25T18:00Z
      time_zone: Asia/Shanghai
      c: 'Mao 毛泽东, 2 a.m., to Zhou Enlai 周恩来 and Li Fuchun 李富春, on the list of rightists under the Center''s review whose caps are to be removed this year: for Huang Shaohong 黄绍竑 and Liu-Wang Liming 刘王立明 removal is the better course; Zhou and Li to decide finally. Should they act in a seriously reactionary or counterrevolutionary way later, they can be dealt with then; ''we still have the initiative.'''
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 370–371 (Oct. 26, 1960; Mao''s comment of Oct. 26, 2 a.m., written on Li Fuchun''s report of Oct. 16; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Li Fuchun, report of Oct. 16, 1960 sending Mao the Organization and United Front Work Departments'' request (first sent to Zhou Enlai) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 370 n.1a); Organization Department and United Front Work Department of the Central Committee, request report of Oct. 14, 1960 to the Center and Mao Zedong on the list of rightists under the Center''s review whose caps are to be removed this year (Huang Shaohong, Liu-Wang Liming among them) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 370 n.1b). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Huang Shaohong, Liu-Wang Liming.'
      tags:
      - polity:prc
