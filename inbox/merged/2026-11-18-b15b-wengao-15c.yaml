      c: 'Mao 毛泽东 drafts the Center''s 中共中央 comment of Nov. 23 sending the regional bureaus and the provincial, city and regional committees the Sichuan 四川 provincial committee''s bulletin of Nov. 20, for reference; to Zhou Enlai 周恩来, Li Fuchun 李富春 and Tan Zhenlin 谭震林: to go by telegram once read, then to Chen Boda 陈伯达, the original back to him. The bulletin: the Emergency Letter read out article by article in the trial communes, steadying people; most cadres for it, a few uneasy or resisting; landlords, rich peasants and bad elements making trouble.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 410–412 (Nov. 23, 1960; the comment, dated by the Center Nov. 23, and Mao''s note; printed from Mao''s manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Sichuan Provincial Party Committee, bulletin of Nov. 20, 1960 to the Southwest Bureau, the Center and Mao Zedong on the first responses to the Center''s Emergency Directive Letter of Nov. 3 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 410 n.1). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Tan Zhenlin, Chen Boda. Check: the day the Center sent it.'
