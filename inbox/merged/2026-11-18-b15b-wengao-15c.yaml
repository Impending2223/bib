- add:
    entry:
      id: cal.1960-11-02.china-leadership-5
      when: Nov. 2
      date: '1960-11-02'
      thread: china-leadership
      time: 1960-11-01T18:00Z
      time_zone: Asia/Shanghai
      c: 'Mao 毛泽东 drafts the Center''s 中共中央 comment forwarding to the regional bureaus, the provincial, city and regional committees and the Center''s ministries and Party groups the Anhui 安徽 provincial committee''s report of Oct. 28 on the county meetings of five levels of cadres to carry out policy: read it with care, take Anhui''s experience, fix measures and act at once; each county''s meeting to be held in November and December and reported to the Center. To Zhou Enlai 周恩来, Li Fuchun 李富春 and Tan Zhenlin 谭震林, 2 a.m.: Li to send it by telegram within two days. The report: from early October, five-level meetings county by county, from team leaders up, to check the carrying out of the Center''s and Mao''s directives since the Zhengzhou 郑州 conference; over 365,000 cadres and members'' delegates; the ''communist wind'', exaggeration and coercion named; the province''s two proclamations explained.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 380–382 (Nov. 2, 1960; the comment, dated by the Center Nov. 2, printed from Mao''s manuscript; his note of Nov. 2, 2 a.m., from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Anhui Provincial Party Committee, report of Oct. 28, 1960 to the Center, Mao Zedong and the East China Bureau on the counties'' meetings of five levels of cadres to carry out policy (cited by [[w.jianguo-yilai-mao-zedong]], XV, 380 n.1). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Tan Zhenlin. Check: the day the Center issued the comment: the volume dates it Nov. 2 and gives no day of issue.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:li-fuchun
      - name:tan-zhenlin
      - vis:only:prc
      src:
