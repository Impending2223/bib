      when: Dec. 30
      date: '1960-12-30'
      thread: china-leadership
      c: 'Mao 毛泽东: the Propaganda Department''s *Xuanjiao dongtai* 宣教动态 no. 113 of Dec. 26, on educating the masses on grain, to be printed for those at the conference; Jinzhou''s 锦州 experience very good, to be used in factories and mines, offices, schools and the army; the groups to discuss it. The piece, from the Liaoning 辽宁 committee''s industry department''s report of Oct. 24: output stalled since May–June over grain troubles; ''politics in command'', airing and debate, old workers'' recollections; at Jinzhou''s Factory 401, where 85 percent had made or backed grain troubles, rations cut by over 9,000 jin and no one complains.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 457–458 (Dec. 30, 1960; Mao''s comment of Dec. 30; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Propaganda Department of the Central Committee, *Xuanjiao dongtai*, no. 113, Dec. 26, 1960: "Some noteworthy points on ideological education of the masses on the grain question" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 457 n.1a); Industry Department of the Liaoning Provincial Party Committee, report of Oct. 24, 1960 on a campaign of education on the grain question among workers (forwarded by the Liaoning committee Oct. 30) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 457 n.1b). Names: Mao Zedong.'
