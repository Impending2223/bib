      date: '1961-03-17'
      thread: china-leadership
      c: 'Mao 毛泽东: the Three South paper of Mar. 13, ''Opinions of some East China comrades on questions the rural people''s communes must now solve'', very well written, to be printed for the Central Work Conference at Canton 广州 (Mar. 15–23); weigh it when discussing the commune regulations. The paper, of Ke Qingshi 柯庆施, Zeng Xisheng 曾希圣, Tan Qilong 谭启龙, Jiang Weiqing 江渭清 and six others: size settled by the masses and fixed at least seven years, teams of about twenty households; the commune off blind orders; cadres elected; procurement fixed.'
