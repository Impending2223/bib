- add:
    entry:
      id: cal.1960-12-22.china-leadership-4
      when: Dec. 22
      date: '1960-12-22'
      thread: china-leadership
      c: 'Mao 毛泽东 drafts the Center''s 中共中央 comment of Dec. 22 sending the regional bureaus and the provincial, city and regional committees the Hunan 湖南 provincial committee''s report of Dec. 18 on the rectification of style and of the communes, for reference. His note: to Liu Shaoqi 刘少奇, Deng Xiaoping 邓小平 and Peng Zhen 彭真, then to Yang Shangkun 杨尚昆 to send by telegram; also printed for those at the Central Work Conference; not to Tibet. The report: Tonghaikou''s 通海口 method; three batches by communes, the worst first, from early November; the passive state turned by about Mar. 15.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 440–441 (Dec. 22, 1960; the comment, dated by the Center Dec. 22, and Mao''s note; printed from Mao''s manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Hunan Provincial Party Committee, report of Dec. 18, 1960 to the Central-South Bureau, the Center and Mao Zedong, "On the plan for the rectification of style and of the communes" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 440 n.1). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Yang Shangkun. Check: the day the Center sent it.'
