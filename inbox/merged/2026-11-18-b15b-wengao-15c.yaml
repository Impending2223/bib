      c: 'Mao 毛泽东: the Three South conference''s bulletin no. 3 of Mar. 13 to be printed for the Central Work Conference at Canton 广州 (Mar. 15–23); it raises many great questions. The bulletin, the groups'' talk of the afternoon of Mar. 12 on the draft commune regulations: Tan Qilong 谭启龙 (Shandong 山东) asks a model charter, an inner-Party document, labor cut from industry and the towns, power to the teams and peasants; Jiang Weiqing 江渭清 (Jiangsu 江苏) two documents, regulations and an inner-Party directive; the Central-South group: ''unchanged at least ten years'' for the four fixed too rigid.'
