      c: 'Mao 毛泽东 to Huang Yanpei 黄炎培, Vice-Chairman of the National People''s Congress Standing Committee, thanking him for his letter: Abbas, Prime Minister of Algeria, back home, told a French reporter how Mao urged on him the policy of not killing prisoners, of great effect in breaking up the enemy''s army; the talk was in a recent *Cankao ziliao* 参考资料 he cannot now find; he sends p. 41 of the afternoon edition of Dec. 3, an American paper''s words, those Abbas spoke to the French reporter.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 427–428 (Dec. 5, 1960; letter of Dec. 5, 1960, signed by Mao; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Xinhua, *Cankao ziliao*, no. 3974, Nov. 22, 1960: "The French *L''Express* reporter on what Abbas told him of Chairman Mao''s talk" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 427 n.3); Xinhua, *Cankao ziliao*, afternoon edition of Dec. 3, 1960, p. 41: Xinhua dispatch from Geneva, Nov. 12, "American *Nation* weekly notes Chairman Mao''s talk with Abbas on the prisoner policy" (the *Nation* editorial "Terror''s means and effects") (cited by [[w.jianguo-yilai-mao-zedong]], XV, 428 n.4). Names: Mao Zedong, Huang Yanpei, Abbas.'
