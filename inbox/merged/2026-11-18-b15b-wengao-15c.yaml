      c: 'The Center 中共中央 issues within the Party the ''Three Main Rules and Eight Points for Party and Government Cadres'' 党政干部三大纪律、八项注意, second revised draft. Rules: start from the facts; carry out the Party''s policy correctly; practice democratic centralism. Points: labor and eat with the people; be kind; be fair in business; buy and sell fairly; report truly; raise the political level; work with the masses; no investigation, no right to speak.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 473 (Jan. 27, 1961; note 1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, "Three Main Rules and Eight Points for Party and Government Cadres (second revised draft)", issued Jan. 27, 1961 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 473 n.1b). See [[cal.1961-01-09.china-leadership]]. Check: whether the first edition''s notes (vol. 9, 1996) give it.'
