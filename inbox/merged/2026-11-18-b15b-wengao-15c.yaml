      c: 'Mao 毛泽东: Li Jingquan''s 李井泉 material of Mar. 17 on Huohua 火花 commune, Nanchong 南充, Sichuan 四川, its 1960 final distribution, to be printed for the Central Work Conference at Canton 广州 (Mar. 15–23); a common question; study Sichuan''s experience. The material: of three plans put to the members, the third (the ''five guarantees'' households covered, the needy helped, a small part of food supplied) chosen by 81.2 percent; in Nanchong prefecture''s 500-odd communes, 76.84 percent; the supply share never over 30 percent.'
