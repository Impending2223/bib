      c: 'Mao 毛泽东 to Yang Shangkun 杨尚昆: send the provincial, city and regional committees by telegram Yao Yilin''s 姚依林 account of Nov. 12 of the conference on food substitutes; a month old, but still of use. The account: the delegates find Tan Zhenlin''s 谭震林 report clear on the line for food substitutes; nutrition, not only quantity; much zeal; bodies, labor and training to be set up; the peasants'' view of fungi to be changed.'
