      c: 'Mao 毛泽东, at midnight, returns to Chen Boda 陈伯达 the *Hongqi* 红旗 editorial draft ''Agriculture and industry together is an important law of China''s socialist economy'': read; usable. The draft: agriculture first in the economy; enough labor kept on the front line of farming; three-level commune ownership based on the production team held steady for a long time.'
