      c: 'Mao 毛泽东, on Hu Qiaomu''s 胡乔木 letter of Oct. 27 proposing to spread chlorella 小球藻 and other grain substitutes: to be printed and sent to the Center''s regional bureaus and the first secretaries of the provinces, cities and regions, to study and spread. Hu: with grain short from the disasters, chlorella would at least keep people from starving and cut edema, cut poisonings from foraged substitutes and keep up strength, and hardly competes with crops for land, water, manure or labor; he asks a special directive of the Center, down to the communes.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 373–374 (Oct. 27, 1960; Mao''s comment of Oct. 27, written on Hu Qiaomu''s letter; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Hu Qiaomu, letter of Oct. 27, 1960 to Mao Zedong proposing the spread of chlorella and other grain substitutes (cited by [[w.jianguo-yilai-mao-zedong]], XV, 373 n.1a). Names: Mao Zedong, Hu Qiaomu.'
      tags:
