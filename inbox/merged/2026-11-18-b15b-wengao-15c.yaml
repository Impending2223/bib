      time_range:
      - 1961-02-14T21:00Z
      - 1961-02-15T00:00Z
      time_band: early morning
      time_zone: Asia/Shanghai
      c: 'Mao 毛泽东, early morning, on He Ming''s 何明 article ''Frames? Or guiding principles?'' in *Guangming ribao* 光明日报 of Feb. 11: ''a good article.'' To Chen Boda 陈伯达: who is He Ming? He wrote a fine short piece in the 1957 rectification; Mao had wanted to see him; Chen to have him fly to Canton 广州, with Ai Siqi 艾思奇, Hu Sheng 胡绳, Wang Ruoshui 王若水, Ren Jiyu 任继愈 and Guan Feng 关锋. (He Ming is Guan Feng''s pen name, the editors say.)'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 491–492 (Feb. 15, 1961; Mao''s two comments, the second of the morning of Feb. 15 (二月十五日晨); printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: He Ming (Guan Feng), "Frames? Or guiding principles?", *Guangming ribao*, Feb. 11, 1961, p. 3 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 492 n.1). Names: Mao Zedong, Chen Boda, Ai Siqi, Hu Sheng, Wang Ruoshui, Ren Jiyu, Guan Feng.'
