- add:
    entry:
      id: cal.1960-12-26.china-leadership-2
      when: Dec. 26
      date: '1960-12-26'
      thread: china-leadership
      c: 'Mao 毛泽东, on his birthday, to Lin Ke 林克, Gao Zhi 高智, Ye Zilong 叶子龙, Li Yinqiao 李银桥, Wang Jingxian 王敬先, Feng Yaosong 封耀松 and Wang Dongxing 汪东兴: the six besides Wang go down, not to Shandong 山东 but to Xinyang 信阳 prefecture, now improving and with relief grain; a medicine kit each, his head nurse to show them its use; the Huai 淮河 valley warmer; two weeks'' training at Peking 北京 from Jan. 2; Wang to prepare it; he will send beef and mutton if they go hungry. He is old; they have much to do. They are to read the Xinyang report.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 453–454 (Dec. 26, 1960; letter of Dec. 26, 1960, his birthday, signed by him; printed from the manuscript; note 2: the Henan committee later sent the six to Xuchang 许昌 prefecture instead). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Xinyang Prefectural Party Committee, report of Dec. 22, 1960 to the Henan Provincial Party Committee, the Center and the Central-South Bureau on the rectification campaign and production and famine relief (cited by [[w.jianguo-yilai-mao-zedong]], XV, 454 n.4). Names: Mao Zedong, Lin Ke, Gao Zhi, Ye Zilong, Li Yinqiao, Wang Jingxian, Feng Yaosong, Wang Dongxing.'
