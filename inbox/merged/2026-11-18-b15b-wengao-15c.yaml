        - 'via w.jianguo-yilai-mao-zedong XV, 387 n.1: all'
- add:
    entry:
      id: cal.1960-11-06.china-leadership-5
      when: Nov. 6
      date: '1960-11-06'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao 毛泽东, Liu Shaoqi 刘少奇, Zhu De 朱德 and Zhou Enlai 周恩来 telegraph Khrushchev and Brezhnev from Peking 北京 on the 43rd anniversary of the October Revolution: socialism won on over a third of the world''s people and a quarter of its land; the camp headed by the Soviet Union stronger than ever, the imperialists headed by America isolated; thanks for Soviet aid; Sino-Soviet friendship and unity, founded on Marxism-Leninism and proletarian internationalism, ''firm as a rock'', beyond any force to break.'
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 389–391 (Nov. 6, 1960; telegram of Nov. 6, 1960; printed from the *Renmin ribao* of Nov. 7, 1960). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Khrushchev, Brezhnev.'
