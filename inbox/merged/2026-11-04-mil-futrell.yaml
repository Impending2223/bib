patch: mil-futrell
by: 'Claude (the military re-read, group af: Futrell, The Advisory Years to 1965, 1981), Nov. 5, 2026'
ops:
- cite:
    id: cal.1960-12-20.vietnam
    item: '[[w.futrell-united-states-air-force]], 58'
- cite:
    id: cal.1960-12-31.laos
    item: '[[w.futrell-united-states-air-force]], 58 (Felt, on Washington''s direction, raises the alert of Joint Task Force
      116 and asks a C-130 squadron)'
- add:
    entry:
      id: cal.1960-12-14.laos
      when: Dec. 14
      date: '1960-12-14'
      thread: laos
      c: CINCPAC alerts all the units of Joint Task Force 116, should the United States intervene in Laos.
      n: '[[w.futrell-united-states-air-force]], 58.'
      src:
        c: 7ee13045
        rows:
        - 'w.futrell-united-states-air-force 58: all'
- add:
    entry:
      id: cal.1961-01-06.laos
      when: Jan. 6
      date: '1961-01-06'
      thread: laos
      c: CINCPAC, instructed from Washington, reduces Joint Task Force 116's alert. The 773d Troop Carrier Squadron's C-130s
        had reached Clark Jan. 2; de Gaulle refused French part in a SEATO intervention Jan. 5.
      n: '[[w.futrell-united-states-air-force]], 58. See [[cal.1960-12-14.laos]].'
      src:
        c: e0133066
        rows:
        - 'w.futrell-united-states-air-force 58: all'
- add:
    entry:
      id: cal.1961-04-14.defense
      when: Apr. 14
      date: '1961-04-14'
      thread: defense
      also:
      - vietnam
      c: 'The 4400th Combat Crew Training Squadron, Jungle Jim, formed at Eglin, Fla., to train indigenous air forces in counterinsurgency:
        Colonel King, 124 officers, 228 airmen, sixteen C-47s, eight B-26s, eight T-28s.'
      n: '[[w.futrell-united-states-air-force]], 79.'
      src:
        c: 54dd54ef
        rows:
        - 'w.futrell-united-states-air-force 79: all'
- add:
    entry:
      id: cal.1961-06-29.vietnam-2
      when: June 29
      date: '1961-06-29'
      thread: vietnam
      c: Vietnamese and American officials agree to place ARPA's Combat Development and Test Center within the Vietnamese
        armed forces' headquarters in Saigon, with the Joint General Staff.
      n: '[[w.futrell-united-states-air-force]], 73.'
      src:
        c: d052df79
        rows:
        - 'w.futrell-united-states-air-force 73: all'
- add:
    entry:
      id: cal.1961-10-05.vietnam-3
      when: Oct. 5
      date: '1961-10-05'
      thread: vietnam
      c: 'A mobile combat reporting post of the 507th Tactical Control Group begins operating at Tan Son Nhut: 67 men, MPS-11
        and MPS-16 radars, airlifted in secret Sept. 26 to Oct. 3, its markings painted out; directed Sept. 11 at Felt''s
        request. The first Air Force unit in Vietnam on a permanent basis.'
      n: '[[w.futrell-united-states-air-force]], 74.'
      src:
        c: 8f519615
        rows:
        - 'w.futrell-united-states-air-force 74: all'
- cite:
    id: cal.1961-10-11.vietnam
    item: '[[w.futrell-united-states-air-force]], 76, 80 (Kennedy authorizes the Jungle Jim detachment to Vietnam, "to serve
      under the MAAG as a training mission and not for combat at the present time")'
- add:
    entry:
      id: cal.1961-11-05.vietnam
      when: Nov. 5
      date: '1961-11-05'
      thread: vietnam
      c: 'Farm Gate, Detachment 2 of the 4400th, leaves Florida: four SC-47s fly to Clark; eight T-28s, disassembled in California,
        and 140 officers and airmen ferried by MATS.'
      n: '[[w.futrell-united-states-air-force]], 81. See [[cal.1961-04-14.defense]].'
      src:
        c: c007ed9d
        rows:
        - 'w.futrell-united-states-air-force 81: all'
- add:
    entry:
      id: cal.1961-11-16.vietnam-2
      when: Nov. 16
      date: '1961-11-16'
      thread: vietnam
      c: Farm Gate operationally ready at Bien Hoa; Felt tasks it with tactical training and pilot upgrading for the Vietnamese.
        Four B-26s reach Bien Hoa near the end of December.
      n: '[[w.futrell-united-states-air-force]], 81–82. See [[cal.1961-11-05.vietnam]]. Names: Felt.'
      src:
        c: 32494f6b
        rows:
        - 'w.futrell-united-states-air-force 81–82: all'
      tags:
      - name:felt-harry-d
- add:
    entry:
      id: cal.1961-11-20.vietnam-2
      when: Nov. 20
      date: '1961-11-20'
      thread: vietnam
      c: Anthis sets up the 2d Advanced Echelon, Thirteenth Air Force, at the Brink Hotel in Saigon, beside the MAAG's Air
        Force section; then moves it to Tan Son Nhut. Nolting, learning of it Nov. 24, is surprised.
      n: '[[w.futrell-united-states-air-force]], 95. Names: Anthis, Nolting.'
      src:
        c: a5311da5
        rows:
        - 'w.futrell-united-states-air-force 95: all'
      tags:
      - name:anthis-rollen-h
      - name:nolting-frederick-e-jr
- add:
    entry:
      id: cal.1961-12-06.vietnam
      when: Dec. 6
      date: '1961-12-06'
      thread: vietnam
      c: The Joint Chiefs authorize Farm Gate to fly combat with Vietnamese aboard. Dec. 4 Felt told O'Donnell to ready plans,
        and O'Donnell allowed combat missions "with at least one South Vietnamese national aboard"; McNamara approved mixed
        crews that day.
      n: '[[w.futrell-united-states-air-force]], 82–83. See [[cal.1961-11-16.vietnam-2]]. Names: Felt, McNamara.'
      src:
        c: 6f0ccef1
        rows:
        - 'w.futrell-united-states-air-force 82–83: all'
      tags:
      - name:felt-harry-d
      - name:mcnamara-robert-s
- cite:
    id: cal.1961-12-16.vietnam
    item: '[[w.futrell-united-states-air-force]], 119'
- add:
    entry:
      id: cal.1962-01-13.vietnam-3
      when: Jan. 13
      date: '1962-01-13'
      thread: vietnam
      c: 'The tactical air control system begins operating: the 315th Air Division''s airlift of men and equipment Jan. 2–14;
        the 5th Tactical Control Group at Tan Son Nhut and Da Nang, the Vietnamese at Pleiku; teletype circuits to Da Nang,
        Bien Hoa, Pleiku and Nha Trang.'
      n: '[[w.futrell-united-states-air-force]], 106.'
      src:
        c: ac55fb1a
        rows:
        - 'w.futrell-united-states-air-force 106: all'
- cite:
    id: cal.1962-01-13.vietnam
    item: '[[w.futrell-united-states-air-force]], 113 (three C-123s at Tan Son Nhut, two familiarization sweeps along Highway
      15, the first full mission on the 13th; a 200-meter swath for three days)'
- cite:
    id: cal.1962-01-21.vietnam
    item: '[[w.futrell-united-states-air-force]], 120 (Farm Gate bombs hit a Cambodian village by accident, several civilians
      killed)'
- cite:
    id: cal.1962-02-08.vietnam
    item: '[[w.futrell-united-states-air-force]], 97'
- add:
    entry:
      id: cal.1962-02-11.vietnam
      when: Feb. 11
      date: '1962-02-11'
      thread: vietnam
      c: 'A Farm Gate SC-47 on a leaflet mission south of Da Lat crashes: eight Americans killed, six Air Force and two Army,
        and one Vietnamese. The press and Congress call the "training" label fiction.'
      n: '[[w.futrell-united-states-air-force]], 122. See [[cal.1961-11-16.vietnam-2]].'
      src:
        c: f44688ba
        rows:
        - 'w.futrell-united-states-air-force 122: all'
- add:
    entry:
      id: cal.1962-03-22.vietnam-2
      when: Mar. 22
      date: '1962-03-22'
      thread: vietnam
      c: Diệm having asked jet interceptors after unknown tracks from Cambodia Mar. 20, a detachment of the 509th Fighter
        Interceptor Squadron, three F-102s and a TF-102, from Clark to Tan Son Nhut; the Chiefs authorize Americans to engage
        hostile aircraft over South Vietnam.
      n: '[[w.futrell-united-states-air-force]], 129, 131. Names: Ngô Đình Diệm.'
      src:
        c: 6c4135c1
        rows:
        - 'w.futrell-united-states-air-force 129, 131: all'
      tags:
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1962-10-08.vietnam
      when: Oct. 8
      date: '1962-10-08'
      thread: vietnam
      c: 2d ADVON discontinued; the 2d Air Division organized at Tan Son Nhut under Anthis, assigned to Thirteenth Air Force.
        Nolting had dropped his objection July 19, if done without publicity.
      n: '[[w.futrell-united-states-air-force]], 101. See [[cal.1961-11-20.vietnam-2]]. Names: Anthis, Nolting.'
      src:
        c: 6644c5cf
        rows:
        - 'w.futrell-united-states-air-force 101: all'
      tags:
      - name:anthis-rollen-h
      - name:nolting-frederick-e-jr
- add:
    entry:
      id: cal.1962-12-31.vietnam-2
      when: Dec. 31
      date: '1962-12-31'
      thread: vietnam
      c: Kennedy approves augmenting Farm Gate.
      n: '[[w.futrell-united-states-air-force]], 170. See [[cal.1961-11-16.vietnam-2]]. Names: Kennedy.'
      src:
        c: 3cfd2c7b
        rows:
        - 'w.futrell-united-states-air-force 170: all'
      tags:
      - name:kennedy-john-f
- cite:
    id: cal.1963-01-02.vietnam
    item: '[[w.futrell-united-states-air-force]], 156–58'
- add:
    entry:
      id: cal.1963-02-03.vietnam
      when: Feb. 3
      date: '1963-02-03'
      thread: vietnam
      c: Captains Bartley and Shaughnessy killed in an RB-26 shot down by Viet Cong fire; Major O'Neill killed in a crash
        three days later.
      n: '[[w.futrell-united-states-air-force]], 170.'
      src:
        c: bcb42cef
        rows:
        - 'w.futrell-united-states-air-force 170: all'
- add:
    entry:
      id: cal.1963-03-04.vietnam
      when: Mar. 4
      date: '1963-03-04'
      thread: vietnam
      c: The Joint Chiefs approve MACV's National Campaign Plan, Diệm's formal approval given Nov. 26, 1962, revised since;
        its intelligence annex without an enemy order of battle.
      n: '[[w.futrell-united-states-air-force]], 152. Names: Ngô Đình Diệm.'
      src:
        c: 53fea3bd
        rows:
        - 'w.futrell-united-states-air-force 152: all'
      tags:
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1963-07-08.vietnam
      when: July 8
      date: '1963-07-08'
      thread: vietnam
      c: Farm Gate at Bien Hoa becomes the 1st Air Commando Squadron (Composite), a regular PACAF unit, the code name kept;
        the 33d and 34th Tactical Groups formed.
      n: '[[w.futrell-united-states-air-force]], 171. See [[cal.1962-12-31.vietnam-2]].'
      src:
        c: 82a3e4ea
        rows:
        - 'w.futrell-united-states-air-force 171: all'
- add:
    entry:
      id: cal.1963-07-16.vietnam-operations
      when: July 16
      date: '1963-07-16'
      thread: vietnam-operations
      c: Twenty to thirty 60-mm mortar rounds on troop housing at Can Tho airfield, ten minutes before midnight; seventeen
        Vietnamese and American Special Forces wounded.
      n: '[[w.futrell-united-states-air-force]], 179.'
      src:
        c: 0498613f
        rows:
        - 'w.futrell-united-states-air-force 179: all'
- add:
    entry:
      id: cal.1963-08-16.vietnam
      when: Aug. 16
      date: '1963-08-16'
      thread: vietnam
      c: A Farm Gate B-26 loses a wing on a combat mission; two Americans and a Vietnamese killed.
      n: '[[w.futrell-united-states-air-force]], 181.'
      src:
        c: 79016fc3
        rows:
        - 'w.futrell-united-states-air-force 181: all'
- add:
    entry:
      id: cal.1963-09-10.vietnam-operations
      when: Sept. 10–14
      date: '1963-09-10'
      thread: vietnam-operations
      c: 'Soc Trang airfield mortared before dawn; four Farm Gate pilots scramble two T-28s and drive the attackers off, without
        Vietnamese crewmen. Viet Cong battalions hit Dam Doi and Cai Nuoc; T-28s escort marines in by helicopter; a T-28 lost;
        ten C-47s and seven C-123s drop 498 paratroopers of the 21st Division. The enemy''s loss 122 killed, 30 by air; 153
        civilians killed or wounded. Sept. 10–14: seventy-two air cover, ten escort, eighteen prelanding and twenty-two forward
        air control sorties.'
      n: '[[w.futrell-united-states-air-force]], 183.'
      src:
        c: 95f4fe64
        rows:
        - 'w.futrell-united-states-air-force 183: all'
- add:
    entry:
      id: cal.1963-10-28.vietnam
      when: Oct. 28
      date: '1963-10-28'
      thread: vietnam
      c: The Joint Chiefs direct CINCPAC to sail a naval task force off Vietnam; three Air Force F-102s fly to Tan Son Nhut.
        Harkins, told, has no idea a coup is near.
      n: '[[w.futrell-united-states-air-force]], 191. Names: Harkins.'
      src:
        c: dbd99368
        rows:
        - 'w.futrell-united-states-air-force 191: all'
      tags:
      - name:harkins-paul-d
- add:
    entry:
      id: cal.1963-11-24.vietnam-operations
      when: Nov. 24
      date: '1963-11-24'
      thread: vietnam-operations
      c: The 21st Division ambushed in An Xuyen, after the Viet Cong strike the Cha La outpost and a strategic hamlet near
        the tip of the Ca Mau Peninsula; four helilifts into two landing zones; an H-21 downed, ten H-21s and UH-1s damaged.
      n: '[[w.futrell-united-states-air-force]], 196.'
      src:
        c: 1977c3a2
        rows:
        - 'w.futrell-united-states-air-force 196: all'
- add:
    entry:
      id: cal.1963-12-31.vietnam-operations
      when: Dec. 31
      date: '1963-12-31'
      thread: vietnam-operations
      c: A ranger battalion meets some two battalions of Viet Cong ten miles west of Ben Cat; the 5th Division, close by at
        Ben Cat and Dau Tieng, a major defeat.
      n: '[[w.futrell-united-states-air-force]], 197.'
      src:
        c: '80716249'
        rows:
        - 'w.futrell-united-states-air-force 197: all'
- cite:
    id: cal.1964-01-22.vietnam
    item: '[[w.futrell-united-states-air-force]], 198'
- add:
    entry:
      id: cal.1964-03-19.vietnam
      when: Mar. 19
      date: '1964-03-19'
      thread: vietnam
      c: Cambodian T-28s shoot down an Air Force O-1 during Vietnamese border actions; Captain Scobel and the Vietnamese observer
        killed.
      n: '[[w.futrell-united-states-air-force]], 199.'
      src:
        c: e1f41f8f
        rows:
        - 'w.futrell-united-states-air-force 199: all'
- add:
    entry:
      id: cal.1964-03-27.vietnam-2
      when: Mar. 27
      date: '1964-03-27'
      thread: vietnam
      c: 'MACV''s border rules for strike aircraft: to the border where it is a river or road; elsewhere within two thousand
        meters with a forward air controller, five thousand without.'
      n: '[[w.futrell-united-states-air-force]], 203.'
      src:
        c: 92fe91e8
        rows:
        - 'w.futrell-united-states-air-force 203: all'
- add:
    entry:
      id: cal.1964-04-08.vietnam
      when: Apr. 8
      date: '1964-04-08'
      thread: vietnam
      c: The last of the B-26s and RB-26s, every one with cracked stress plates and loose rivets, to be ferried to Clark for
        salvage; the T-28s left.
      n: '[[w.futrell-united-states-air-force]], 213.'
      src:
        c: abdd55d2
        rows:
        - 'w.futrell-united-states-air-force 213: all'
- cite:
    id: cal.1964-05-15.vietnam-2
    item: '[[w.futrell-united-states-air-force]], 208'
- cite:
    id: cal.1964-11-01.vietnam
    item: '[[w.futrell-united-states-air-force]], 253'
- add:
    entry:
      id: cal.1964-11-06.vietnam-2
      when: Nov. 6
      date: '1964-11-06'
      thread: vietnam
      c: Ky leads thirty-two Vietnamese A-1Hs at night against a Viet Cong camp in Zone D, a reprisal for Biên Hòa widely
        announced; five hundred enemy casualties, by South Vietnamese intelligence.
      n: '[[w.futrell-united-states-air-force]], 254. See [[cal.1964-11-01.vietnam]]. Names: Nguyễn Cao Kỳ.'
      src:
        c: e517e05e
        rows:
        - 'w.futrell-united-states-air-force 254: all'
      tags:
      - name:nguyen-cao-ky
- add:
    entry:
      id: cal.1964-12-14.laos
      when: Dec. 14
      date: '1964-12-14'
      thread: laos
      c: 'Barrel Roll''s first mission, from Da Nang: four F-105s of the 80th Tactical Fighter Squadron from Korat on Route
        8, the Nape road bridge for unused ordnance, three RF-101s, eight F-100s on MiG patrol; fifteen planes.'
      n: '[[w.futrell-united-states-air-force]], 256; [[w.anthony-war-in-northern-laos]], 146 (the day). See [[cal.1964-12-12.laos]].'
      src:
        c: 0a145b8e
        rows:
        - 'w.futrell-united-states-air-force 256: all'
        - 'w.anthony-war-in-northern-laos 146: A'
- add:
    entry:
      id: cal.1964-12-25.laos
      when: Dec. 25
      date: '1964-12-25'
      thread: laos
      c: Barrel Roll's fourth mission. Four F-105s of the 44th Tactical Fighter Squadron, out from Okinawa to Da Nang, reconnoiter
        Route 23 and strike the barracks at Tchepone. Dec. 30, Navy A-1Hs on the same camp.
      n: '[[w.futrell-united-states-air-force]], 257. See [[cal.1964-12-14.laos]].'
      src:
        c: caabaa9f
        rows:
        - 'w.futrell-united-states-air-force 257: all'
- add:
    entry:
      id: cal.1965-01-05.vietnam-operations
      when: Jan. 5
      date: '1965-01-05'
      thread: vietnam-operations
      c: Eight A-1Es drop Lazy Dog XM-44 canisters on Viet Cong firing at American helicopter observers in Phuoc Tuy; the
        fire stops; fifteen oxcart loads of dead and wounded carried away, by an intelligence report.
      n: '[[w.futrell-united-states-air-force]], 261. See [[cal.1964-12-28.vietnam-operations]].'
      src:
        c: 54a62eb1
        rows:
        - 'w.futrell-united-states-air-force 261: all'
- cite:
    id: cal.1965-02-19.vietnam-operations
    item: '[[w.futrell-united-states-air-force]], 267'
- cite:
    id: cal.1965-02-24.vietnam
    item: '[[w.futrell-united-states-air-force]], 267'
