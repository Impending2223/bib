      - '1969-04-02T00:00Z'
      time_band: early morning
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: Peng Dehuai 彭德怀, up early, reads the papers, underlining and annotating, pounding his waist with his fist, leaning back on the table to stare at the ceiling. Awake all night, he weeps three times.
      n: '[[w.peng-dehuai-nianpu]], 822. The words: 早起 (822). Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
