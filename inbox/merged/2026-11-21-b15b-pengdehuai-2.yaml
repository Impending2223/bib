    item: '[[w.peng-dehuai-nianpu]], 821 (Mar. 2, 1969: *Renmin ribao* 人民日报 issues the news "Our government lodges the strongest protest with the Soviet government" 《我国政府向苏联政府提出最强烈抗议》: Soviet frontier troops have intruded into the Zhenbao Island 珍宝岛 area of Heilongjiang 黑龙江 and made a very grave bloody incident)'
