      when: Oct. 8
      date: '1969-10-08'
      place: peking
      thread: china-leadership
      c: Peng Dehuai 彭德怀 moves now fast, now slow, his mood now high, now low. Awake all night; just asleep, he suddenly beats his head hard with his hand, weeps and sighs.
      n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai.'
