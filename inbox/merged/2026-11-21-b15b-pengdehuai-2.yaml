      c: 'Peng Dehuai 彭德怀 asks to urinate; the sentry 哨兵, calling him "criminal" 犯人, tells him to wait; he loses his temper and shouts: wait by day, wait by night, what does it mean?'
      n: '[[w.peng-dehuai-nianpu]], 821–822. The words: 0点至2点 (midnight to 2) (821–822). Made public: 1998. Names: Peng Dehuai.'
