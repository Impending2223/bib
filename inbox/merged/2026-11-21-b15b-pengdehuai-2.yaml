      c: The Su Zhenhua 苏振华 case group and the Rao Zhengxi 饶正锡 case group 专案组 interrogate Peng Dehuai 彭德怀 four times on his visit to the Soviet Union 苏联. After the sessions he writes his material, his head in his hands, slumped on the table, sighing; three days without a moment's sleep.
      n: '[[w.peng-dehuai-nianpu]], 820. Made public: 1998. Names: Peng Dehuai.'
