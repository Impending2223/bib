    entry:
      id: cal.1969-10-03.china-leadership-9
      when: Oct. 3
      date: '1969-10-03'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 asks to urinate, and called out does not know what to do; asks to empty the rubbish, and when the sentry 哨兵 calls him a moment later has forgotten. The log: from 8 to 10 a.m. he sits still 15 minutes; from 2 to 4 p.m., 30; from 4 to 6 he looks at the portrait of Lin Biao 林彪 and sits still 5; from 6 to 8, four or five; from 8 to 10 p.m., ten. He reads the *Selected Works of Lenin* 《列宁选集》. At night he can hardly sleep; he weeps and sighs.'
      n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai, Lin Biao.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:lin-biao
      - ok:fields-time
