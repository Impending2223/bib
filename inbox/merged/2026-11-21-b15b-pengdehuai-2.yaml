      when: Oct. 25
      date: '1969-10-25'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 to the sentry 哨兵: class struggle alone will not do, there must be scientific experiment too; this thing (his watch), if not wound to run, will rust. He reads the paper aloud and hums.'
      n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
