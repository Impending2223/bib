    entry:
      id: cal.1969-02-04.china-leadership-2
      when: Feb. 4
      date: '1969-02-04'
      thread: china-leadership
      c: The case group 专案组 begins examining whether the materials of the Peng Dehuai 彭德怀 case are "poisonous" 有毒, the Lushan anti-Party clique 庐山反党小集团, the Peng–Gao–Rao anti-Party alliance 彭高饶反党联盟, the "illicit relations with foreign countries" 里通外国 and his history having been examined. By then its "Report on the examination of Peng Dehuai's anti-Party question" 《关于彭德怀反党问题审查报告》 has set him down as an "anti-Party element with illicit relations with foreign countries" 反党里通外国分子 and proposed how he is to be dealt with (the report undated on the page).
      n: '[[w.peng-dehuai-nianpu]], 821. Made public: 1998. Names: Peng Dehuai.'
