    entry:
      id: cal.1968-03-01.china-leadership-3
      when: Mar. 1
      date: '1968-03-01'
      place: peking
      thread: china-leadership
      c: From Mar. 1 to 23 Peng Dehuai 彭德怀 is interrogated twenty-eight times, chiefly on his meeting and talk with Khrushchev 赫鲁晓夫 on his visit to Albania 阿尔巴尼亚, May 28–June 2, 1959, before the Soviet ambassador's 苏联驻阿大使 reception for Khrushchev and the Albanians' rally of welcome to him. Back from the sessions he writes his confessions 交代, at times twelve hours a day, often sleepless all night.
      n: '[[w.peng-dehuai-nianpu]], 818. Made public: 1998. Names: Peng Dehuai, Khrushchev.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1968-03-23.china-leadership-7
      when: Mar. 23
      date: '1968-03-23'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 copies into his diary the "Confession" 《认罪书》 he has given the case group 专案组, and writes after it: the confession is made up; in the small rest room Khrushchev 赫鲁晓夫 talked with Hoxha 霍查, and he put in no word; however often he says so, the examiners will not believe it, sure he was close to Khrushchev, and half a month has gone on it; if he called what he had thought and heard a talk with Khrushchev, they would agree; it must be called collusion with the Khrushchev revisionists 赫修 against Chairman Mao 毛主席, the Three Red Banners 三面红旗 and the General Line 总路线. A confession is an admission of guilt, not a show of merit: he understands it now. At his oath on joining the Party he said he would give his life for the revolution if need be; now is the time, for the Party''s good and Chairman Mao''s prestige.'
      n: '[[w.peng-dehuai-nianpu]], 818. Made public: 1998. Names: Peng Dehuai, Khrushchev, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:khrushchev-nikita-s
      - name:mao-zedong
- add:
    entry:
      id: cal.1968-04-08.china-leadership-7
      when: Apr. 8
      date: '1968-04-08'
      place: peking
      thread: china-leadership
      c: From Apr. 8 to May 31 Peng Dehuai 彭德怀 is interrogated twenty-eight times, chiefly on his visit to the Soviet Union 苏联. He writes his confession 交代 every day, about ten hours; often sleepless all night, in tears.
      n: '[[w.peng-dehuai-nianpu]], 818. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
      id: cal.1968-04-26.china-leadership-4
      when: Apr. 26
      date: '1968-04-26'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, in the interrogation room, to the interrogators: at his oath on joining the Party he added words of his own, that he was ready to sacrifice himself when the revolution needed it; when seven or eight of them interrogated and pressed him that day, he thought of them.'
      n: '[[w.peng-dehuai-nianpu]], 818. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
      id: cal.1968-05-08.china-leadership-4
      when: May 8
      date: '1968-05-08'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 writes a slip and lays it squarely on his table: for the revolution he may give his life if need be, the last line of his oath on joining the Party; now the time has come.'
      n: '[[w.peng-dehuai-nianpu]], 818. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
      id: cal.1968-06.china-leadership-8
      when: June
      date: '1968-06'
      place: peking
      thread: china-leadership
      c: Peng Dehuai 彭德怀 is interrogated seven times; he writes his confession 交代 every day; his sleep is disordered.
      n: '[[w.peng-dehuai-nianpu]], 818. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
      id: cal.1968-07-31.china-leadership-3
      when: July 31
      date: '1968-07-31'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 writes the confession material 交代材料 "My crimes since the Lushan Conference" 《庐山会议以后的罪行》: the general course of things and his "reversal of verdict" 翻案 activities from his move from Zhongnanhai 中南海 to Wujiahuayuan 吴家花园 at Guajiatun 挂甲屯 on Sept. 30, 1959 to his seizure by the Red Guards 红卫兵 at Chengdu 成都 on Dec. 22, 1966.'
      n: '[[w.peng-dehuai-nianpu]], 818. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
