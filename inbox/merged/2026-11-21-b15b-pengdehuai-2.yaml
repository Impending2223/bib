      when: Aug. 28
      date: '1968-08-28'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, on the case group''s 专案组 outline, writes confession material 交代材料 on two questions: what he talked of with Lu Zhonglin 鹿钟麟 in their two meetings when Lu came to North China 华北 in the war against Japan 抗日战争 (Lu, the page''s note says, in 1939 the Nationalist 国民党 commander of the Hebei–Chahar war zone 冀察战区 and chairman of Hebei 河北 province); and what he talked of with Chiang Kai-shek 蒋介石 in their two meetings at Wuchang 武昌 and Chongqing 重庆 in the war.'
      n: '[[w.peng-dehuai-nianpu]], 819. 819 n.1 (Lu Zhonglin). Made public: 1998. Names: Peng Dehuai, Chiang Kai-shek.'
      tags:
      - polity:prc
