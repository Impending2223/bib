      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 to the sentry 哨兵: have a pear. The sentry: who would eat your stinking pear? Stung, he cries out: so fierce!'
      n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai.'
