    id: cal.1969-04-28.china-leadership-4
    item: '[[w.peng-dehuai-nianpu]], 824 (Lin Biao''s 林彪 political report in print by the evening of Apr. 28, 1969, when Peng Dehuai 彭德怀 reads it; the page names no paper)'
- add:
    entry:
      id: cal.1969-05.china-leadership-6
      when: May
      date: '1969-05'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 reads the "Report to the Ninth National Congress of the Communist Party of China" 《在中国共产党第九次全国代表大会上的报告》 of Lin Biao 林彪 of Apr. 1, as *Hongqi* 红旗 1969, no. 5 prints it, and writes 24 comments and marks over 40 places. On its part 1, on the preparation for the Cultural Revolution 无产阶级文化大革命: before it was launched, he had sensed the need to fight revisionism and prevent a restoration, break the four olds and oppose extravagance, but did not know what to do; without settling the two kinds of contradiction, launching it would have made chaos. On part 4, by "grasp revolution, promote production" 抓革命，促生产: only by carrying out these policies fully, step by step, can its victory be won and held. On part 5: the teaching guards against pride and for continuing the revolution, and exposes the Soviet revisionists'' fraud of building "communism". On part 6 he rebuts the words "defeated the Right opportunist anti-Party alliance of Peng Dehuai, Gao Gang 高岗, Rao Shushi 饶漱石 and others".'
      n: '[[w.peng-dehuai-nianpu]], 824–825. Made public: 1998. Names: Peng Dehuai, Lin Biao.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:lin-biao
