- add:
    entry:
      id: cal.1969-04-28.china-leadership-7
      when: Apr. 28
      date: '1969-04-28'
      time_range:
      - '1969-04-27T22:00Z'
      - '1969-04-28T04:00Z'
      time_band: morning
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 is interrogated, to learn his thinking on the Ninth Congress 九大. He says: the new Central Committee 中央委员 pleases him, twenty-odd workers, peasants and women; the way of electing it good too; for himself, productive labor or some years shut up to study, he has no thoughts on it; Chen Yi 陈毅 and Zhu De 朱德 have been set there, and not to set them there would be bad; on "... merits and faults half and half" (the page leaves out the words) he does not understand well; Chen Yi is like him, and he says Chen Yi is a Marxist.'
      n: '[[w.peng-dehuai-nianpu]], 824. The words: 上午 (824). Made public: 1998. Names: Peng Dehuai, Chen Yi, Zhu De.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:chen-yi
      - name:zhu-de
