- add:
    entry:
      id: cal.1968-01-18.china-leadership-6
      when: Jan. 18
      date: '1968-01-18'
      time: '1968-01-18T11:00:00Z'
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, called to interrogation again, asks: again? The case group''s 专案组 five hold him until 3:30 a.m. on the 19th, pressing him over and over to admit that he spoke with Khrushchev 赫鲁晓夫 of Gao Gang 高岗. He answers that he cannot meet their subjective needs; the interrogators rebuke him: attack, poison, slander, a counter-reckoning, hatred of the interrogation. He does not sleep that night.'
      n: '[[w.peng-dehuai-nianpu]], 816. The words: 晚上7点 (7 p.m.); 19日凌晨3时30分 (3:30 a.m. on the 19th) (816). Made public: 1998. Names: Peng Dehuai, Khrushchev.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
