      - '1968-01-02T11:00Z'
      - '1968-01-02T14:00Z'
      time_band: evening
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: Peng Dehuai 彭德怀 is interrogated on his history, chiefly from his enlistment at 18 in 1916 to the killing of Ou (Shengqin) 欧（盛钦） in August or September 1921 and his flight.
      n: '[[w.peng-dehuai-nianpu]], 815. The words: 晚上 (815). Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
