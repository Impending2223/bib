      when: Sept. 16
      date: '1968-09-16'
      place: peking
      thread: china-leadership
      c: From Sept. 16 to 30 Peng Dehuai 彭德怀 is interrogated ten times on his so-called "going over to the enemy" 投敌 in the Soviet area 苏区. He writes his confession 交代 every day, thirteen hours on the 23rd; eight nights he does not sleep at all, the others an hour or two. He often stares blankly at the portrait of Mao Zedong 毛泽东 on the wall.
      n: '[[w.peng-dehuai-nianpu]], 819. Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
