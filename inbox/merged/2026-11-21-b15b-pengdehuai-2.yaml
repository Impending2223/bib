- cite:
    id: cal.1969-04-01.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 822 (Apr. 1–24, 1969: the Ninth Congress of the Chinese Communist Party 中国共产党第九次全国代表大会 held at Peking 北京)'
- cite:
    id: cal.1969-04-01.china-leadership-5
    item: '[[w.peng-dehuai-nianpu]], 822 (Apr. 1, 1969, evening: the news of the Ninth Congress''s opening at Peking 北京 comes over the broadcast, with gongs and drums outside, as Peng Dehuai 彭德怀 hears it)'
- add:
    entry:
      id: cal.1969-04-01.china-leadership-6
      when: Apr. 1
      date: '1969-04-01'
      time_range:
      - '1969-04-01T11:00Z'
      - '1969-04-01T14:00Z'
      time_band: evening
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, hearing gongs and drums outside and the news on the broadcast of the opening of the Ninth Congress 中国共产党第九次全国代表大会 at Peking 北京, stares out, stunned. The sentry''s 哨兵 log of the night, from 8:30 p.m. to 6 a.m. in spells of two hours: never asleep: in the first two hours he sighs five times and turns over eight, moving his hands and feet, rubbing his eyes and clasping his head; then he grinds his teeth, scratches, sighs three times; once, his eyes shut, he laughs suddenly; up, he is low and looks about him; washes once, pours water once.'
      n: '[[w.peng-dehuai-nianpu]], 822. The words: 晚上; 20:30–22:30, 22:30–0:30, 0:30–2:00, 2:00–4:00, 4:00–6:00 (the sentry''s log) (822). Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
      id: cal.1969-04-02.china-leadership-3
