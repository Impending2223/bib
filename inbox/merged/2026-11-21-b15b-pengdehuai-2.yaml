      c: Peng Dehuai 彭德怀 reads *Taking Tiger Mountain by Strategy* 《智取威虎山》 in the paper and sings 65 minutes, giggling, kicking, clapping, as if dancing.
      n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai.'
