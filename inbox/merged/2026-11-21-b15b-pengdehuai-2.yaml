      when: Oct. 14
      date: '1969-10-14'
      thread: china-leadership
      c: 'The case group 专案组 ranks its prisoners 案犯排队: Peng Dehuai 彭德怀, of the nature of enemy and ourselves 敌我性质, to be handled as a contradiction between the enemy and ourselves; Pu Anxiu 浦安修, one who has made mistakes, who carried out the bourgeois reactionary line in education and drew no clear line politically with Peng.'
      n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
      id: cal.1969-10-22.china-leadership-5
      when: Oct. 22
      date: '1969-10-22'
      thread: china-leadership
      c: 'The Central Case Examination Group 中央专案审查小组 discusses the disposal of the prisoners: nine (so printed; eight are named) to be held and reformed by labor 关押、劳动改造, Peng Dehuai 彭德怀, Huang Kecheng 黄克诚, Liu Zhen 刘震, Li Jukui 李聚奎, Wu Zili 吴自立, Wang Ping 王平, Rao Zhengxi 饶正锡 and Li Rui 李锐; two to be handed to their units, Tang Dihua 唐棣华 and Pu Anxiu 浦安修.'
      n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
