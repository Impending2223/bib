patch: 2026-11-01-cq-1968-06-07-b
by: reader (Claude), CQ Weekly Report, June 7, 1968, second run
ops:
- add:
    entry:
      id: cal.1962-03-14.elections-1962
      when: Mar. 14
      date: '1962-03-14'
      thread: elections-1962
      c: Edward Kennedy, 30, the minimum age, announces for the Senate seat his brother had held.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1395. Howe: "His candidacy is both preposterous and insulting" (1395). See [[cal.1962-06-08.elections-1962]]. Names: Edward Kennedy.'
      tags:
      - name:kennedy-edward-m
      - state:ma
- add:
    entry:
      id: cal.1968-02-12.transportation
      when: Feb. 12
      date: '1968-02-12'
      thread: transportation
      c: 'Las Vegas. Boyd to the American Road Builders: the cities can no longer "undertake extensive road building" for the automobile without weighing rail or other mass transit; the urban Interstates slowed or stalled "in city after city."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1402. Names: Boyd.'
      tags:
      - name:boyd-alan-s
      - state:nv
- add:
    entry:
      id: cal.1968-03-12.transportation
      when: Mar. 12
      date: '1968-03-12'
      thread: transportation
      c: 'Allott, at the Third International Conference on Urban Transportation: federal transit money small beside $4 billion a year for highways; "current (economic) conditions" forbid a much larger program; the results "disappointing," the Watts project his example.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1401. Names: Allott.'
      tags:
      - name:allott-gordon-l
- add:
    entry:
      id: cal.1968-03-14.cities-and-housing
      when: Mar. 14
      date: '1968-03-14'
      thread: cities-and-housing
      also:
      - transportation
      c: 'Mayor Tate of Philadelphia, for the National League of Cities, to the House housing subcommittee: transit funding inadequate; $1.5 billion of contract authority in place of year-to-year funds; private transit companies'' money to count toward the local match.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1402. The match provision in S. 3497 as the Senate passed it, May 28 (1402). Names: Tate.'
      tags:
      - name:tate-james-h-j
- add:
    entry:
      id: cal.1968-04-16.poverty
      when: Apr. 16
      date: '1968-04-16'
      thread: poverty
      c: 'The Committee on School Lunch Participation, of five women''s church and civic bodies, reports *Their Daily Bread*: the school lunch program "failing to meet the needs of poor children"; of 50 million pupils some 18 million take part, fewer than two million free or at reduced price. Freeman tells the committee the Department will consider national guidelines.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1408, 1410. The report, from more than 1,500 interviews; its aim, a lunch at 20 cents at most (1408–09). Names: Freeman.'
      tags:
      - name:freeman-orville-l
- add:
    entry:
      id: cal.1968-04-18.transportation
      when: Apr. 18
      date: '1968-04-18'
      thread: transportation
      c: Washington, the Highway Transportation Congress. Boyd will "resist any effort" to take the Highway Trust Fund for mass transit; any other "reasonable plan" he would support.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1402. Names: Boyd.'
      tags:
      - name:boyd-alan-s
- add:
    entry:
      id: cal.1968-04-22.poverty
      when: Apr. 22
      date: '1968-04-22'
      thread: poverty
      c: 'The Citizens Board of Inquiry into Hunger and Malnutrition, 25 members, formed at Reuther''s request as chairman of the Citizens Crusade Against Poverty, reports *Hunger, USA*: over 300 of the poorest counties with no food help of any kind; food stamps priced too high; Section 32 put to producers'' uses.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1409. Names: Reuther.'
      tags:
      - name:reuther-walter
- add:
    entry:
      id: cal.1968-04-30.conservation
      when: Apr. 30–May 2
      date: '1968-04-30'
      thread: conservation
      c: 'Gruening''s Senate Interior subcommittee on surface mining, S. 217, S. 3126 and S. 3132, the administration''s: Udall, reclamation of land mined in future first, of past damage "for later consideration"; only 14 States with reclamation laws. The American Mining Congress, the Coal Policy Conference and the Iron Ore Association against; the Sierra Club''s spokesman, Caudill, for stronger controls.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1413–14. Names: Gruening, Udall.'
      tags:
      - name:gruening-ernest
      - name:udall-stewart-l
- add:
    entry:
      id: cal.1968-05-10.conservation
      when: May 10
      date: '1968-05-10'
      thread: conservation
      c: 'The National Association of Manufacturers, in a statement to Gruening''s subcommittee: S. 3132 should not be enacted; reclamation a State function.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1414. See [[cal.1968-04-30.conservation]].'
- add:
    entry:
      id: cal.1968-05-13.economy-surcharge
      when: May 13
      date: '1968-05-13'
      thread: economy-surcharge
      c: 'Fowler, after testifying to Senate Foreign Relations: personally "for the bill" with its $6 billion cut in spending.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1417. Names: Fowler.'
      tags:
      - name:fowler-henry-h
- add:
    entry:
      id: cal.1968-05-13.labor-2
      when: May 13
      date: '1968-05-13'
      thread: labor
      also:
      - economy-surcharge
      c: 'The AFL-CIO''s Executive Council "unalterably opposed" to the $6 billion cut: "We intend to oppose with all our strength all indiscriminate Budget slashing."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1417.'
- add:
    entry:
      id: cal.1968-05-14.crime-and-hijacking
      when: May 14–16
      date: '1968-05-14'
      thread: crime-and-hijacking
      c: 'Smathers''s Select Committee on Small Business, on loan-sharking and organized crime. Petersen of Justice: loan-sharking perhaps the Cosa Nostra''s second source of income, more than 120 members in it about New York. Metzger, of the New York County district attorney''s office: rates averaging 262 percent a year; a hooded witness.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1411–12. Salerno: the crime bill''s wiretapping title the "single greatest weapon" (1412). Names: Smathers.'
      tags:
      - name:smathers-george-a
- add:
    entry:
      id: cal.1968-05-15.transition-and-staff
      when: May 15
      date: '1968-05-15'
      thread: transition-and-staff
      c: 'Phillip S. Hughes, deputy budget director, to the Senate subcommittee on executive reorganization: no Hoover-type commission on the executive branch "at least until after the coming change in Administrations"; S. 47, Pearson''s, and S. 2116, Ribicoff''s.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1416.'
- add:
    entry:
      id: cal.1968-05-16.japan
      when: May 16
      date: '1968-05-16'
      thread: japan
      also:
      - testing
      c: 'The administration sends the Joint Committee on Atomic Energy a 30-year agreement with Japan, signed Feb. 27: up to 161,000 kilograms of enriched uranium and 365 of plutonium for its power program, the IAEA to safeguard them. Hearings set for June 5.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1404.'
- add:
    entry:
      id: cal.1968-05-17.poverty
      when: May 17
      date: '1968-05-17'
      thread: poverty
      c: The Senate passes S. 3068, food stamps for fiscal 1969 raised from $225 million to $245 million, by voice vote; May 21, the vote reconsidered, passed again with a printing error corrected.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1418. Reported May 16, S. Rept. 1130 (1418).'
- add:
    entry:
      id: cal.1968-05-19.economy
      when: May 19
      date: '1968-05-19'
      thread: economy
      also:
      - economy-gold
      c: 'The National Association of Manufacturers: the controls on private investment abroad to end "regardless of our specific balance-of-payments position," a date set for them to expire; fiscal and monetary restraint instead.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384.'
- add:
    entry:
      id: cal.1968-05-20.latin-america
      when: May 20
      date: '1968-05-20'
      thread: latin-america
      c: 'The Senate passes H.R. 15364, by voice vote, and sends it to the President: the American vote for a $1 billion increase in the Inter-American Development Bank''s callable capital, a subscription of $411,760,000.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1425.'
- add:
    entry:
      id: cal.1968-05-20.transportation
      when: May 20
      date: '1968-05-20'
      thread: transportation
      c: 'Boyd sends Congress the airport bills: the Airport Development Act, S. 3566, up to $1 billion in loans and $100 million in grants; the passenger ticket tax from 5 percent to 8, a new 8 percent tax on air freight, general aviation''s fuel taxes raised. May 22, to the Aerospace Industries Association: about $500 million in fiscal 1969.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1403. Names: Boyd.'
      tags:
      - name:boyd-alan-s
- add:
    entry:
      id: cal.1968-05-21.poverty-2
      when: May 21
      date: '1968-05-21'
      thread: poverty
      c: 'House Education and Labor opens hearings on H.R. 17144, Perkins''s American Hunger Commission. Perkins: "We all know we are not spending enough." Jean Fairfax, of the Committee on School Lunch Participation: "we don''t need a study."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1410. Held May 21–23, 27–29 and June 3–5 (1410). Names: Perkins.'
      tags:
      - name:perkins-carl-d
- add:
    entry:
      id: cal.1968-05-21.space
      when: May 21
      date: '1968-05-21'
      thread: space
      also:
      - space-apollo
      c: 'The Senate Aeronautics Committee reports H.R. 15856, NASA''s authorization for fiscal 1969, $4,150,560,000: $219,840,000 under the request, $119,317,000 over the House; Apollo applications $350 million, nuclear rockets $55 million.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1411. S. Rept. 1136. The House had appropriated $4,008,223,000, May 8 (1411). CQ prints the House figure $4,031,243,000 in its text, $4,031,423,000 in its table. Names: Anderson.'
      tags:
      - name:anderson-clinton-p
- add:
    entry:
      id: cal.1968-05-21.labor
      when: May 21
      date: '1968-05-21'
      thread: labor
      also:
      - jobs-and-wages
      c: 'Holland: letters "from the merely outraged to the downright abusive" against H.R. 14816, occupational safety, but "support has begun to appear"; letters of support put in the Record.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Names: Holland.'
      tags:
      - name:holland-elmer-j
- add:
    entry:
      id: cal.1968-05-21.crime-and-hijacking
      when: May 21
      date: '1968-05-21'
      thread: crime-and-hijacking
      c: 'Green''s House subcommittee on census and statistics, on a National Criminal Justice Statistics Center. Fred Vinson Jr., of Justice: "absolutely necessary." May 23, Lloyd Ohlin, of the Crime Commission: how big the crime problem is, "nobody really knows."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1414. Names: Green.'
      tags:
      - name:green-william-j-jr
- add:
    entry:
      id: cal.1968-05-21.economy-surcharge-2
      when: May 21
      date: '1968-05-21'
      thread: economy-surcharge
      also:
      - elections-1968
      c: 'Ways and Means orders H.R. 17325 reported: tax deductions for corporate advertising in the conventions'' programs, as in the tax bill, in case H.R. 15414 is delayed or beaten.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1417. Names: Mills.'
      tags:
      - name:mills-wilbur-d
- add:
    entry:
      id: cal.1968-05-22.poverty
      when: May 22
      date: '1968-05-22'
      thread: poverty
      c: 'Freeman before House Education and Labor: family food programs in 2,400 counties, about 6.1 million persons, soon; the purchase price for the poorest cut from $2 a month to 50 cents; "Our problem has been getting the money appropriated"; Section 32 money for any food program welcome.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1410. See [[cal.1968-05-21.poverty-2]]. Names: Freeman.'
      tags:
      - name:freeman-orville-l
- add:
    entry:
      id: cal.1968-05-22.war-opposition
      when: May 22
      date: '1968-05-22'
      thread: war-opposition
      c: 'Washington. The Business Executives Move for Vietnam Peace, claiming 2,100 members in 48 States: Rusk and Rostow to resign; all bombing north of the Demilitarized Zone to end; no tax increase, no cuts in social programs; less for the military.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Names: Rusk, Rostow.'
      tags:
      - name:rusk-dean
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1968-05-22.transportation-auto-safety
      when: May 22
      date: '1968-05-22'
      thread: transportation-auto-safety
      c: 'Johnson signs S.J. Res. 129: Transportation to study automobile insurance and the compensation of accident losses, a report in two years, $2 million.'
      n: 'Remarks Upon Signing Joint Resolution Authorizing a Study of Motor Vehicle Insurance, [1968–69 Pub. Papers 630](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=708). [[w.cq-weekly-report]], June 7, 1968, 1420. Public Law 90-313; asked in the consumer message of Feb. 6. The House''s H.J. Res. 958, 363–3, May 7; the Senate took the House''s changes May 8 (1420). Check: the day (APP dates it May 22; the Papers'' item carries no date). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-05-22.state-and-city-finance
      when: May 22
      date: '1968-05-22'
      thread: state-and-city-finance
      c: The House passes H.R. 2158, limits on the States' taxing of small out-of-state firms, 285–89, a motion of Hutchinson's to recommit refused by voice vote. Fifteen States in the Multistate Tax Compact.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1421–22.'
- add:
    entry:
      id: cal.1968-05-22.elections-1968
      when: May 22
      date: '1968-05-22'
      thread: elections-1968
      c: 'Arizona. Roy Elson, Hayden''s aide, for the Democratic nomination to succeed him, Hayden his honorary chairman: Goldwater a "Senate dropout."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1402. Names: Elson, Hayden, Goldwater.'
      tags:
      - name:elson-roy-l
      - name:hayden-carl
      - name:goldwater-barry-m
      - state:az
- add:
    entry:
      id: cal.1968-05-23.king-poor-peoples-2
      when: May 23
      date: '1968-05-23'
      thread: king-poor-peoples
      c: 'Eighteen of some 300 demonstrators against the welfare restrictions of 1967 arrested outside Mills''s office: the Poor People''s Campaign''s first arrests.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Names: Mills.'
      tags:
      - name:mills-wilbur-d
- add:
    entry:
      id: cal.1968-05-23.king-poor-peoples-3
      when: May 23
      date: '1968-05-23'
      thread: king-poor-peoples
      also:
      - poverty
      c: 'Abernathy''s delegation with Freeman: $60 million in surplus foods added; food programs in all 331 of the poorest counties.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Check: CQ (1410) dates Freeman''s five added foods, $60 million, to Apr. 23. See [[cal.1968-04-29.king]]. Names: Abernathy, Freeman.'
      tags:
      - name:abernathy-ralph-david
      - name:freeman-orville-l
- add:
    entry:
      id: cal.1968-05-23.king-poor-peoples-4
      when: May 23
      date: '1968-05-23'
      thread: king-poor-peoples
      c: 'An ad hoc committee of 32 members of Congress formed to carry the Campaign''s demands: Brooke chairman; Hart, Diggs and Ogden Reid cochairmen.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Names: Brooke, Hart, Diggs, Reid.'
      tags:
      - name:brooke-edward-w
      - name:hart-philip-a
      - name:diggs-charles-c-jr
      - name:reid-ogden-r
- add:
    entry:
      id: cal.1968-05-23.poverty
      when: May 23
      date: '1968-05-23'
      thread: poverty
      c: Joseph Clark's Senate subcommittee on employment, manpower and poverty opens hearings on hunger and malnutrition and on S. Res. 281, a Select Committee on Nutrition and Human Needs.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1410, 1418. Names: Joseph Clark.'
      tags:
      - name:clark-joseph-s
- add:
    entry:
      id: cal.1968-05-23.civil-disorders
      when: May 23
      date: '1968-05-23'
      thread: civil-disorders
      c: 'House Post Office and Civil Service reports H.R. 17267: no federal or District employment for five years for anyone convicted of an act in a riot. Nix, Morris Udall and Waldie: "a product of hysteria."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1412–13. H. Rept. 1456 (1412). Names: Dulski.'
      tags:
      - name:dulski-thaddeus-j
- add:
    entry:
      id: cal.1968-05-23.transportation
      when: May 23
      date: '1968-05-23'
      thread: transportation
      c: 'House Commerce reports H.R. 3400, unanimously: the FAA''s administrator to set standards for aircraft noise and sonic boom.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1414. H. Rept. 1463 (1414). Names: Staggers.'
      tags:
      - name:staggers-harley-o
- add:
    entry:
      id: cal.1968-05-23.congress
      when: May 23
      date: '1968-05-23'
      thread: congress
      c: 'Colmer to the House committee chairmen: to adjourn by Aug. 2, before the conventions, the Rules Committee will clear no routine bills after July 9.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1416. Names: Colmer.'
      tags:
      - name:colmer-william-m
- add:
    entry:
      id: cal.1968-05-23.conservation
      when: May 23
      date: '1968-05-23'
      thread: conservation
      also:
      - oil
      c: The House passes H.R. 8578, the Land and Water Conservation Fund to $200 million a year from offshore oil and gas leases, 336–13; Willis's amendment against the earmark, and Pelly's against contract authority, refused by voice vote.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1419. Aspinall: "a sincere attempt to resolve the dilemma" (1419). Names: Aspinall.'
      tags:
      - name:aspinall-wayne-n
- add:
    entry:
      id: cal.1968-05-24.conservation
      when: May 24
      date: '1968-05-24'
      thread: conservation
      c: Johnson signs S. 2531, the San Gabriel Wilderness, 36,137 acres in the Angeles National Forest, Cal., the second addition to the wilderness system.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1420. Public Law 90-318 (1420). To check: the statute. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:ca
- add:
    entry:
      id: cal.1968-05-25.goldwater
      when: May 25
      date: '1968-05-25'
      thread: goldwater
      c: New York. A federal jury awards Goldwater $75,000 in punitive damages and $1 in compensatory against Ralph Ginzburg, publisher of *Fact*, for its article of October 1964 on his fitness for the presidency.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1402. To check: the case. Names: Goldwater, Ginzburg.'
      tags:
      - name:goldwater-barry-m
      - name:ginzburg-ralph
      - city:nyc
- add:
    entry:
      id: cal.1968-05-27.desegregation-schools-2
      when: May 27
      date: '1968-05-27'
      thread: desegregation-schools
      c: 'HEW''s survey, released: 14 percent of Negro pupils in the eleven Southern States in desegregated schools in 1967–68, a school now counted desegregated at 50 percent white; Mississippi 3.9, Texas 26.1.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1404.'
- add:
    entry:
      id: cal.1968-05-27.trade
      when: May 27
      date: '1968-05-27'
      thread: trade
      c: 'Commerce: April''s trade surplus $248 million, after March''s deficit of $157.7 million; exports a record $2.9 billion, imports $2.6 billion.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1404.'
- add:
    entry:
      id: cal.1968-05-27.poverty
      when: May 27
      date: '1968-05-27'
      thread: poverty
      also:
      - press-and-broadcasting
      c: 'Freeman to Perkins: CBS''s *Hunger in America* "a biased, one-sided, dishonest presentation"; 600 counties without food programs, not 1,000.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1410. See [[cal.1968-05-21.poverty]]. Names: Freeman, Perkins.'
      tags:
      - name:freeman-orville-l
      - name:perkins-carl-d
- add:
    entry:
      id: cal.1968-05-28.king-poor-peoples
      when: May 28
      date: '1968-05-28'
      thread: king-poor-peoples
      c: Mills meets a small group of the Campaign's demonstrators in his office.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. See [[cal.1968-05-23.king-poor-peoples-2]]. Names: Mills.'
      tags:
      - name:mills-wilbur-d
- add:
    entry:
      id: cal.1968-05-28.congress
      when: May 28
      date: '1968-05-28'
      thread: congress
      also:
      - economy-surcharge
      c: 'The House passes H.R. 17522, State, Justice and Commerce, $1,794,981,500, 347–28; Jonas''s motion to recommit with a ceiling of $1,989,640,000 on spending carried, 223–154. Hall''s points of order strike $256 million for ships; Rooney: Hall "doing his best to wreck the merchant marine."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1426, 1428. Reported May 24, H. Rept. 1468, $2,050,981,500 (1426). Check: the roll calls on Voteview. Names: Hall, Rooney.'
      tags:
      - name:hall-durward-g
      - name:rooney-john-j
- add:
    entry:
      id: cal.1968-05-28.oil
      when: May 28
      date: '1968-05-28'
      thread: oil
      also:
      - conservation
      c: 'Interior''s report on oil shale in Colorado, Utah and Wyoming: "at least five years" before private leasing; two test leases by competitive bid. Udall invites comment.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1403. Names: Udall.'
      tags:
      - name:udall-stewart-l
- add:
    entry:
      id: cal.1968-05-29.king-poor-peoples
      when: May 29
      date: '1968-05-29'
      thread: king-poor-peoples
      c: 'Five windows of the Supreme Court broken, eight arrested: a protest for the Indians against the ruling that Washington might bar net fishing for salmon.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Check: the case (CQ does not name it).'
- add:
    entry:
      id: cal.1968-05-29.poverty
      when: May 29
      date: '1968-05-29'
      thread: poverty
      also:
      - king-poor-peoples
      c: 'Abernathy before Joseph Clark''s subcommittee: "We cannot let Americans starve because Agriculture Committees choose to dislike the poor"; commodity programs in all the poorest counties, a balanced diet, free stamps for those without money.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1410. Names: Abernathy, Joseph Clark.'
      tags:
      - name:abernathy-ralph-david
      - name:clark-joseph-s
