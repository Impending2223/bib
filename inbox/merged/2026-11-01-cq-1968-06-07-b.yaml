    entry:
      id: cal.1968-05-29.defense
      when: May 29
      date: '1968-05-29'
      thread: defense
      c: 'The Senate clears H.R. 15004: three civil defense aid programs extended four years, through fiscal 1972; Young''s two-year amendment refused.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1418. Names: Young.'
      tags:
      - name:young-stephen-m
- add:
    entry:
      id: cal.1968-05-29.conservation
      when: May 29
      date: '1968-05-29'
      thread: conservation
      c: 'Aspinall: his committee to try before adjournment for the Palmetto Bend project, the Redwoods park, the wild and scenic rivers and the Oahe project.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1416. Names: Aspinall.'
      tags:
      - name:aspinall-wayne-n
- add:
    entry:
      id: cal.1968-05-29.amendments
      when: May 29
      date: '1968-05-29'
      thread: amendments
      c: 'Fort Worth, Texas Christian University''s commencement. Johnson: "the time is already here" to grant the vote to 18-year-olds.'
      n: 'Commencement Address at Texas Christian University, [1968–69 Pub. Papers 666](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=744) (May 29, 1968). [[w.cq-weekly-report]], June 7, 1968, 1404. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1968-05-30.king-poor-peoples
      when: May 30
      date: '1968-05-30'
      thread: king-poor-peoples
      c: Some 500 of the Campaign march on HEW; Cohen sets out the Department's steps and asks support for a "single federal system of welfare."
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Names: Cohen.'
      tags:
      - name:cohen-wilbur-j
- add:
    entry:
      id: cal.1968-05-30.economy-surcharge
      when: May 30
      date: '1968-05-30'
      thread: economy-surcharge
      also:
      - vietnam
      - amendments
      c: 'The LBJ Ranch, a news conference, Gorton and Westmoreland present. Johnson will accept the $6 billion cut: the need for a tax increase is "that urgent"; "I shall approve it." A message on the vote at 18 to come. Westmoreland: the enemy "approaching a point of desperation."'
      n: 'The President''s News Conference at the LBJ Ranch, [1968–69 Pub. Papers 670](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=748) (May 30, 1968). [[w.cq-weekly-report]], June 7, 1968, 1404, 1417. Mills, May 30, predicts the conference report will be accepted (1417). Names: Johnson, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - state:tx
- add:
    entry:
      id: cal.1968-05-31.labor
      when: May 31
      date: '1968-05-31'
      thread: labor
      also:
      - jobs-and-wages
      c: Fifty of the National Council of Senior Citizens picket the Chamber of Commerce for its opposition to the occupational safety bill.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. See [[cal.1968-05-21.labor]].'
- add:
    entry:
      id: cal.1968-05-31.desegregation-schools
      when: May 31
      date: '1968-05-31'
      thread: desegregation-schools
      c: 'Justice sues the Indianapolis schools: discrimination in assigning pupils and teachers, its second school suit in the North.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1404. The first, Apr. 25, against a district near Chicago (1404).'
      tags:
      - state:in
- add:
    entry:
      id: cal.1968-05-31.railroads
      when: May 31
      date: '1968-05-31'
      thread: railroads
      c: 'The ICC asks the House and Senate Commerce Committees for hearings on passenger trains: Tierney, it lacks the power to stop the decline.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1404.'
- add:
    entry:
      id: cal.1968-05-31.vietnam-paris
      when: May 31
      date: '1968-05-31'
      thread: vietnam-paris
      c: 'Paris, the sixth meeting, three and a half hours: "an inch of progress," none, by Hanoi''s spokesman.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1404.'
- add:
    entry:
      id: cal.1968-06-01.king-poor-peoples
      when: June 1
      date: '1968-06-01'
      thread: king-poor-peoples
      c: Some 100 from Appalachia demonstrate outside Robert Byrd's home; he will meet the Campaign's West Virginians.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Names: Byrd.'
      tags:
      - name:byrd-robert-c
- add:
    entry:
      id: cal.1968-06-02.vietnam
      when: June 2
      date: '1968-06-02'
      thread: vietnam
      c: 'Saigon. A rocket from an American helicopter strikes a South Vietnamese command post: six officials killed, among them the police chief, the port director, a brother-in-law of Kỳ and the commander of the 5th Ranger Group; the mayor wounded.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1404. Names: Kỳ.'
      tags:
      - name:nguyen-cao-ky
      - place:saigon
- add:
    entry:
      id: cal.1968-06-03.king-poor-peoples
      when: June 3
      date: '1968-06-03'
      thread: king-poor-peoples
      c: 'Udall hears a group of Indians on housing, schools and the Bureau''s "paternalism": in many States "altogether too many people" with an attitude "that can only be regarded as racist."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Names: Udall.'
      tags:
      - name:udall-stewart-l
- add:
    entry:
      id: cal.1968-06-03.poverty
      when: June 3
      date: '1968-06-03'
      thread: poverty
      c: 'Agriculture: food donation programs in the 42 counties that refused them, all 1,000 of the poorest then served; the fiscal 1969 food stamp request may rise from $245 million to about $270 million.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1410.'
- add:
    entry:
      id: cal.1968-06-04.king-poor-peoples
      when: June 4
      date: '1968-06-04'
      thread: king-poor-peoples
      c: A delegation of 100 accuses Ramsey Clark of not enforcing the laws against discrimination; Clark answers with a 15-page report.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1384. Names: Clark.'
      tags:
      - name:clark-ramsey
- add:
    entry:
      id: cal.1968-06-04.trade
      when: June 4
      date: '1968-06-04'
      thread: trade
      c: 'Ways and Means opens hearings on H.R. 17551, the Trade Expansion Act of 1968. C. R. Smith: the share of free-world exports from 18.1 percent in 1960 to 16.6 in 1967; import restrictions "a confession that we cannot compete." Udall: quotas "the least economic sense." Wirtz; Roth: retaliation "massive."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1415–16. See [[cal.1968-05-28.trade]]. Names: Mills, Smith, Udall, Wirtz, Roth.'
      tags:
      - name:mills-wilbur-d
      - name:smith-c-r
      - name:udall-stewart-l
      - name:wirtz-w-willard
      - name:roth-william-m
- add:
    entry:
      id: cal.1968-06-04.economy-surcharge
      when: June 4
      date: '1968-06-04'
      thread: economy-surcharge
      c: 'Albert now for the $6 billion cut: "I am for this conference report."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1417. See [[cal.1968-05-29.economy-surcharge]]. Names: Albert.'
      tags:
      - name:albert-carl
- add:
    entry:
      id: cal.1968-06-05.vietnam-paris
      when: June 5
      date: '1968-06-05'
      thread: vietnam-paris
      c: 'Paris, the seventh meeting: Hanoi again calls the demand for reciprocal restraint "absurd."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1404.'
- add:
    entry:
      id: cal.1968-06-06.economy-surcharge
      when: June 6
      date: '1968-06-06'
      thread: economy-surcharge
      c: 'Mills to the House: the conference report on H.R. 15414, not yet filed, put off to June 19.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1417. See [[cal.1968-05-29.economy-surcharge]]. Names: Mills.'
      tags:
      - name:mills-wilbur-d
