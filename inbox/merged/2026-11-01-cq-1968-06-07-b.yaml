    entry:
      id: cal.1968-05-29.farm
      when: May 29
      date: '1968-05-29'
      thread: farm
      also:
      - poverty
      c: 'The Senate passes H.R. 16913, Agriculture for fiscal 1969, $5,540,550,300, by voice vote: Hart''s amendment restoring $10 million for school lunches in needy areas and $6.5 million for breakfasts; Javits''s, removing a limit on Freeman''s use of customs revenues for food aid, 31–30.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1428. Check: the roll call on Voteview. Names: Hart, Javits, Freeman.'
      tags:
      - name:hart-philip-a
      - name:javits-jacob-k
      - name:freeman-orville-l
