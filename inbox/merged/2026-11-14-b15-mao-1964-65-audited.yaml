patch: 2026-11-14-b15-mao-1964-65
by: 'Claude (batch 15, reader 3: the PRC skeleton, 1964–65, from *Mao Zedong nianpu, 1949–1976*, vol. V, the owner''s Drive epub of the 2013 set), Nov. 14, 2026; audited by Claude (Opus), batch 15 audit, Nov. 14, 2026'
ops:
  - add:
      entry:
        id: cal.1964-01-05.china-leadership
        when: Jan. 5
        date: '1964-01-05'
        thread: china-leadership
        also: [japan, soviet-union]
        c: 'Mao, Beijing, the Fujian Hall, afternoon: receives Kikunami Katsumi, Japanese Communist Party Politburo member (Tingtao Keji in the Chinese); Wu Xiuquan present. Two intermediate zones, both against American control; Eastern Europe against Soviet. The JCP to hold the patriotic flag and study the monopoly capital at home; do not repeat the French party''s loss of the anti-American banner to de Gaulle. Revisionism in the Soviet Union from Stalin''s unfinished revolution, the unsplit two kinds of contradiction, a high-pay stratum; China to rectify every few years, no guarantee against revisionism, to be seen in decades.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1964. Made public: 2013. Names: Mao Zedong, Wu Xiuquan, de Gaulle, Stalin.'
        tags: [name:mao-zedong, name:de-gaulle-charles, name:stalin-joseph, polity:japan, polity:prc, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1964-01-12.china-leadership
        when: Jan. 12
        date: '1964-01-12'
        thread: china-leadership
        also: [latin-america-panama]
        c: 'Mao, in a statement to a People''s Daily reporter: the Chinese people stand with the Panamanian people and support their demand for the return of the Canal Zone; U.S. imperialism the fiercest enemy of the world''s peoples; all countries it invades, controls or bullies to form the broadest united front against its policies of aggression and war.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 12, 1964. Published in the People''s Daily (the chronology: a statement, not a talk). Names: Mao Zedong. Check: the date of publication in the People''s Daily.'
        tags: [name:mao-zedong, polity:prc, polity:us]
  - add:
      entry:
        id: cal.1964-01-17.china-leadership
        when: Jan. 17
        date: '1964-01-17'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Zhongnanhai, the Yinian Tang, afternoon: receives Anna Louise Strong, and Frank Coe, Sol Adler, Israel Epstein and Sidney Rittenberg, translators of his works; Kang Sheng, Wu Lengxi, Yuan Shuipai present. Guerrillas must learn to destroy the enemy one column at a time. Asks two questions: does the U.S. watch the Soviet Union or China now, and is it preparing a third world war? Adler: Soviet Union the enemy in the short term, China in the long. Mao: the view stands; the U.S. has always entered the world wars last; two "third worlds", the U.S. resisted in both. Coe: where does the struggle with revisionism stand? Mao: the counteroffensive, like July 1947 in the civil war.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 17, 1964. Made public: 2013. Names: Mao Zedong, Kang Sheng, Wu Lengxi, Anna Louise Strong, Frank Coe, Sol Adler, Israel Epstein, Sidney Rittenberg, Yuan Shuipai.'
        tags: [name:mao-zedong, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-01-17.china-leadership-2
        when: Jan. 17 or 18
        date: '1964-01-17'
        thread: china-leadership
        also: [testing]
        c: 'Mao reads the Second Ministry of Machine Building party group''s report of Jan. 15: the gaseous-diffusion plant produced qualified enriched uranium hexafluoride-235 from the morning of Jan. 14, the most basic condition for making atomic weapons. Mao: "Read. Very good."'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 17 or 18, 1964. Made public: 2013. To check: the Second Ministry''s report of Jan. 15, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Jan. 17 or 18, 1964). Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-01-27.china-leadership
        when: Jan. 27
        date: '1964-01-27'
        thread: china-leadership
        also: [japan]
        c: 'Mao, in an evening talk with Suzuki Kazuo, Saionji Kinkazu and Takano Yoshihisa of Akahata (Kang Sheng, Liao Chengzhi, Wu Lengxi present): the Japanese people''s great anti-American demonstration of Jan. 26 a patriotic movement; the Chinese people support it; the demands: no F-105D nuclear aircraft or nuclear submarines, bases and troops out, Okinawa back, the security treaty ended.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 27, 1964. Published in the People''s Daily, Jan. 28. See [[cal.1964-01-27.japan-and-korea]]. Names: Mao Zedong, Kang Sheng, Liao Chengzhi, Wu Lengxi. Check: the Japanese forms of the three names.'
        tags: [name:mao-zedong, name:kang-sheng, polity:prc, polity:japan, polity:us]
  - add:
      entry:
        id: cal.1964-01-28.china-leadership
        when: Jan. 28
        date: '1964-01-28'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao reads the General Staff Intelligence Department''s summary of Jan. 27, "Albania breaks a treason case", and writes to Xiao Hua and Xu Zirong: of note; are there people placed by the Soviet revisionists in the army, the public security forces, the offices and society, and more important, by Chiang''s gang? Xie Fuzhi to see it.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 28, 1964. Made public: 2013. To check: the summary of Jan. 27, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Jan. 28, 1964). Names: Mao Zedong, Xiao Hua, Xu Zirong, Xie Fuzhi.'
        tags: [name:mao-zedong, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-01-30.china-leadership
        when: Jan. 30
        date: '1964-01-30'
        thread: china-leadership
        also: [vietnam-hanoi, soviet-union]
        c: 'Mao, Beijing, the Hall of the People, afternoon: receives Lê Duẩn, heading the Workers'' Party delegation to Moscow, with a dinner; Li Fuchun, Li Xiannian, Kang Sheng, Yang Shangkun, Wu Xiuquan present. Mao: Soviet experts withdrawn and contracts torn up, China''s self-reliance began; he has told Hồ Chí Minh to rely on neither the Soviet Union nor China. China has its dark side, the two roads. If China turns revisionist, the Vietnamese party is to oppose it as it opposed Moscow.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 30, 1964. Made public: 2013. Names: Mao Zedong, Lê Duẩn, Li Fuchun, Li Xiannian, Kang Sheng, Hồ Chí Minh, Yang Shangkun, Wu Xiuquan.'
        tags: [name:mao-zedong, name:le-duan, name:li-fuchun, name:li-xiannian, name:kang-sheng, name:ho-chi-minh, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1964-01.china-leadership
        when: Jan., early
        date: 1964-01
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Zhongnanhai, the Yinian Tang: twice presides over the Politburo Standing Committee on the reply to the CPSU Central Committee''s letter of Nov. 29, 1963 (trade, the border, an end to open polemics). Mao: the letter was forced out of Moscow; Khrushchev is going downhill, the 22nd Congress his peak; the polemic goes on, six commentaries written, seventh to tenth to come; no end to it, no international meeting; the letter still to be answered, with care. On the People''s Daily: more scholarly articles, in philosophy, economics, history, literature and art; less news of meetings.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan., early, 1964 ("1月上旬"). Made public: 2013. To check: the CPSU letter of Nov. 29, 1963 (named by [[w.zedong-mao-zedong-nianpu]], V, Jan., early, 1964). Names: Mao Zedong, Khrushchev.'
        tags: [name:mao-zedong, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-01.china-leadership-2
        when: Jan., late
        date: 1964-01
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao revises the 18th draft (Jan. 28) of the seventh commentary on the CPSU Central Committee''s open letter, "The Leaders of the CPSU Are the Greatest Splitters of Our Times": adds that the Soviet leaders'' revisionism and splittism come from the flood and growth of bourgeois elements at home, and that Marxism-Leninism is a science and a science does not fear polemic.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan., late, 1964 ("1月底"). Made public: 2013. The article public: People''s Daily, Feb. 4, 1964. To check: the Jan. 28 draft (named by [[w.zedong-mao-zedong-nianpu]], V, Jan., late, 1964). Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-02-06.china-leadership
        when: Feb. 6
        date: '1964-02-06'
        thread: china-leadership
        also: [testing]
        c: 'Mao, Zhongnanhai, the Juxiang Shuwu: two hours with Qian Xuesen, Li Siguang and Zhu Kezhen on agriculture, geology and nuclear weapons. Of the missile vehicle: a 1,000-kilometer one made, then a 2,000; always defense, tunnels. Qian: a small group set up to study defense against ballistic missiles; no design work in the Third Five-Year Plan for want of technique. Mao: no spear without a shield; ten years, fifteen if need be.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 6, 1964. Made public: 2013. Names: Mao Zedong, Qian Xuesen, Li Siguang, Zhu Kezhen.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-02-13.china-leadership
        when: Feb. 13
        date: '1964-02-13'
        thread: china-leadership
        c: 'Mao, Beijing, the Hall of the People, Spring Festival: calls sixteen to a forum on education: Liu Shaoqi, Deng Xiaoping, Peng Zhen, Lu Dingyi, Kang Sheng, Guo Moruo, Lin Feng, Yang Xiufeng, Jiang Nanxiang, Zhang Jinfu, Lu Ping, Zhu Muzhi, Chen Shutong, Huang Yanpei, Xu Deheng, Zhang Shizhao. Mao: the old schooling ruins talent; courses can be cut by half, study shortened; exams are ambushes, to be replaced by open questions, books not always to be read; verbose scholasticism will perish. Learning to be joined with labor.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 13, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Lu Dingyi, Kang Sheng, Guo Moruo, Lin Feng, Yang Xiufeng, Jiang Nanxiang, Zhang Jinfu, Lu Ping, Zhu Muzhi, Chen Shutong, Huang Yanpei, Xu Deheng, Zhang Shizhao. Check: Whether the talk was circulated in the Party in 1964 (the chronology notes none).'
        tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:lu-dingyi, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-02-23.china-leadership
        when: Feb. 23
        date: '1964-02-23'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao revises the 7th draft of the Central Committee''s reply to the CPSU Central Committee''s letter of Nov. 29, 1963; adds that the CPSU letter only called for an end to open polemics and proposed no concrete measure, and that China now offers concrete proposals. To Kang Sheng and Chen Boda: a few corrections, discuss in a meeting, reprint for tomorrow. Feb. 24: the 8th draft, small changes.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 23, 1964. Made public: 2013. To check: the Central Committee''s reply (dated Feb. 29, handed to the Soviet chargé Mar. 1, published May 9; named by [[w.zedong-mao-zedong-nianpu]], V, Feb. 29, 1964). Names: Mao Zedong, Kang Sheng, Chen Boda.'
        tags: [name:mao-zedong, name:kang-sheng, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-02-26.china-leadership
        when: Feb. 26
        date: '1964-02-26'
        thread: china-leadership
        also: [korea-leadership, soviet-union]
        c: 'Mao to Kim Il Sung, by letter: asks him and a few others to come to Beijing on Feb. 27, to help correct the reply to the CPSU letter of Nov. 29, which must go out by Feb. 29 or Mar. 1, before the Romanian delegation arrives; other matters also to be discussed.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 26, 1964. Made public: 2013. Names: Mao Zedong, Kim Il Sung.'
        tags: [name:mao-zedong, name:kim-il-sung, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-02-27.china-leadership
        when: Feb. 27
        date: '1964-02-27'
        thread: china-leadership
        also: [korea-leadership, soviet-union]
        c: 'Mao, Beijing, Diaoyutai, no. 18, afternoon: receives Kim Il Sung to ask the Korean side''s views on the Central Committee''s reply to the CPSU letter of Nov. 29, 1963; Liu Shaoqi, Peng Zhen, Li Fuchun, Yang Shangkun for China; Pak Kum-chol, Kim Chang-man, Pak Yong-guk for Korea.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 27, 1964. Made public: 2013. Names: Mao Zedong, Kim Il Sung, Liu Shaoqi, Peng Zhen, Li Fuchun, Yang Shangkun, Pak Kum-chol, Kim Chang-man, Pak Yong-guk. Check: the Korean names (Chinese: Pu Jinzhe, Jin Changman, Pu Yongguo).'
        tags: [name:mao-zedong, name:kim-il-sung, name:liu-shaoqi, name:peng-zhen, name:li-fuchun, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-02-28.china-leadership
        when: Feb. 28
        date: '1964-02-28'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides in the evening over the Politburo Standing Committee on the line for talks with the Romanian Workers'' Party delegation due. Mao''s three points: no inch on ending open polemics, all parties that have attacked the Chinese party to retract; no criticism of Khrushchev in print while the talks last, then resumed; the reply to the CPSU to be sent before the delegation arrives, not during or after; and the line toward Romania one of friendship and cooperation, allowing for its position, to resist Khrushchev''s great-power chauvinism.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 28, 1964. Made public: 2013. Names: Mao Zedong, Khrushchev.'
        tags: [name:mao-zedong, name:khrushchev-nikita-s, polity:prc, polity:romania, vis:only:prc]
  - add:
      entry:
        id: cal.1964-02-29.china-leadership
        when: Feb. 29
        date: '1964-02-29'
        thread: china-leadership
        also: [korea-leadership, soviet-union]
        c: 'Mao, Beijing, Diaoyutai, no. 18, morning: receives Kim Il Sung again. If China turns revisionist, what would Korea do? (He has said so to Miyamoto Kenji, to Wilcox of New Zealand, to the Indonesians.) Against the new bourgeoisie, who steal and speculate and are few but able; the Soviet Union is full of them. The CPSU letter threatens "collective measures", "decisive blows": China is waiting. The seventh commentary took two months and 18 drafts; its title was found two weeks before publication.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 29, 1964. Made public: 2013. Names: Mao Zedong, Kim Il Sung, Miyamoto Kenji, Wilcox.'
        tags: [name:mao-zedong, name:kim-il-sung, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-02-29.china-leadership-2
        when: Feb. 29
        date: '1964-02-29'
        thread: china-leadership
        also: [soviet-union]
        c: 'The Politburo in enlarged session, Liu Shaoqi presiding, afternoon: adopts the Central Committee''s reply to the CPSU letter of Nov. 29, 1963; five matters: the border, aid, Soviet experts, trade, the open polemic. Dated Feb. 29, handed to the Soviet chargé Cherbakov Mar. 1; published May 9.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 29, 1964. Made public: 2013. To check: the reply of Feb. 29, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Feb. 29, 1964). Names: Liu Shaoqi. Check: the Soviet chargés name (the Chinese: Qierbakefu).'
        tags: [name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-03-02.china-leadership
        when: Mar. 2–3
        date: '1964-03-02'
        thread: china-leadership
        also: [soviet-union]
        c: 'Beijing, the Romanian Workers'' Party delegation under Maurer (Bodnăraș, Ceaușescu, Stoica) arrives Mar. 2 with a letter from Gheorghiu-Dej to Mao. Mar. 3: the talks open, Liu Shaoqi heading the Chinese side (Deng Xiaoping, Peng Zhen, Kang Sheng); six sessions in all, to Mar. 10.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 2 and 3, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng, Maurer, Ceaușescu, Gheorghiu-Dej, Bodnăraș, Stoica.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:kang-sheng, name:maurer-ion-gheorghe, name:ceausescu-nicolae, name:gheorghiu-dej-gheorghe, name:bodnaras-emil, polity:prc, polity:romania, vis:only:prc+romania]
  - add:
      entry:
        id: cal.1964-03-05.china-leadership
        when: Mar. 5
        date: '1964-03-05'
        thread: china-leadership
        also: [korea-leadership, soviet-union]
        c: 'Mao, Diaoyutai, no. 18, evening: third talk with Kim Il Sung, with the Korean side as on Feb. 27. Kim on his talk the day before with the Romanians: they have a quarrel with Khrushchev over interference, not theory; fear a split. Liu on the afternoon''s talks: Romania wants the polemic stopped before the October two-party talks and agrees to China''s four points. Mao: Romania''s position changed from before; 40 percent of its trade is with the Soviet Union; of 100-odd parties only a dozen or so truly oppose China.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 5, 1964. Made public: 2013. Names: Mao Zedong, Kim Il Sung, Liu Shaoqi, Khrushchev.'
        tags: [name:mao-zedong, name:kim-il-sung, name:liu-shaoqi, name:khrushchev-nikita-s, polity:dprk, polity:prc, polity:romania, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-03-06.china-leadership
        when: Mar. 6–7
        date: '1964-03-06'
        thread: china-leadership
        also: [soviet-union]
        c: Mao presides in the evenings over the Politburo Standing Committee on the talks with the Romanian delegation; Liu Shaoqi and Deng Xiaoping attend, Peng Zhen and Kang Sheng sit in.
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 6 and 7, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:kang-sheng, polity:prc, polity:romania, vis:only:prc]
  - add:
      entry:
        id: cal.1964-03-09.china-leadership
        when: Mar. 9
        date: '1964-03-09'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides in the evening over the Politburo Standing Committee: Peng Zhen reports the Romanian delegation''s request to prolong the talks; one more session decided. Liu Shaoqi and Deng Xiaoping attend, Kang Sheng sits in.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 9, 1964. Made public: 2013. Names: Mao Zedong, Peng Zhen, Liu Shaoqi, Deng Xiaoping, Kang Sheng.'
        tags: [name:mao-zedong, name:peng-zhen, name:liu-shaoqi, name:deng-xiaoping, name:kang-sheng, polity:prc, polity:romania, vis:only:prc]
  - add:
      entry:
        id: cal.1964-03-10.china-leadership
        when: Mar. 10
        date: '1964-03-10'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Beijing, the Hall of the People, afternoon: receives and dines the Romanian delegation, with Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng. Mao: the open polemic was begun by the other side, to end only when they retract; it is a war of pens: no one dies, the sky does not fall, grass grows, fish swim, women bear children. China will answer every article and resolution, perhaps ten years, there are 2,000; he has a five-year plan, then Liu and the others. Both sides were equal at the talks; "tonight a meeting of unity".'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 10, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:kang-sheng, polity:prc, polity:romania, vis:only:prc+romania]
  - add:
      entry:
        id: cal.1964-03-16.china-leadership
        when: Mar. 16
        date: '1964-03-16'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides over the Politburo Standing Committee, the Hall of the People, Room 118, afternoon: Zhou Enlai reports on the 14-country tour; the CPSU letter of Mar. 7 answering China''s of Feb. 29. Mao: answer, but briefly; the CPSU has not published its February plenum documents nor sent China its letter to the parties, so what "decisive rebuff" or "collective measures" are meant? The more he hurries, the slower China walks; the correspondence to be considered for publication. Three more commentaries to the tenth; then theory: modern revisionism and social democracy, internationalism and nationalism.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 16, 1964. Made public: 2013. To check: the CPSU letter of Mar. 7, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Mar. 16, 1964). Names: Mao Zedong, Zhou Enlai.'
        tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-03-18.china-leadership
        when: Mar. 18
        date: '1964-03-18'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides over the Politburo Standing Committee, Zhongnanhai, the Juxiang Shuwu, afternoon, on holding a Central Work Conference. Mao: for a year his time has gone to the struggle with Khrushchev; now back to domestic questions. Khrushchev''s 70th birthday in April: send a telegram with some substance; the more he opposes China the more China is friendly, he for a split China for unity, to hold the initiative.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 18, 1964. Made public: 2013. Names: Mao Zedong, Khrushchev.'
        tags: [name:mao-zedong, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-03-22.china-leadership
        when: Mar. 22
        date: '1964-03-22'
        thread: china-leadership
        c: 'Mao drafts for the Central Committee the instruction on organizing teams of cadres to lecture, to carry the socialist education movement through to the end: three to four years at least; the "double ten points" to be read, explained and discussed in countryside and town over several years; every Central Committee member down to county Party committee members to lecture once or twice, those who refuse called slackers. Encloses the PLA General Political Department report of Mar. 16 and Qufu county committee''s of Feb. 10. Sent out Mar. 31.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 22, 1964. Made public: 2013. To check: the instruction (sent Mar. 31, 1964; named by [[w.zedong-mao-zedong-nianpu]], V, Mar. 22, 1964). Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-03-22.china-leadership-2
        when: Mar. 22
        date: '1964-03-22'
        thread: china-leadership
        also: [soviet-union]
        c: Mao presides over the Politburo Standing Committee, Juxiang Shuwu, afternoon, on the eighth commentary on the CPSU open letter. A few days later he revises the 12th draft (Mar. 24); retitled "The Proletarian Revolution and Khrushchev's Revisionism", published Mar. 31 in the People's Daily and Red Flag, no. 6.
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 22, 1964. Made public: 2013. The article public: People''s Daily, Mar. 31, 1964. Names: Mao Zedong, Khrushchev.'
        tags: [name:mao-zedong, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-03-23.china-leadership
        when: Mar. 23
        date: '1964-03-23'
        thread: china-leadership
        also: [japan, soviet-union]
        c: 'Mao, Beijing, the Hall of the People, evening: receives and dines the Japanese Communist Party delegation under Hakamada Satomi, back from the Soviet Union; Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng, Yang Shangkun, Liao Chengzhi, Zhao Yimin present. The encirclement of cities from the countryside will not do in Japan, Britain, the U.S. or much of Europe; two experiences, October''s and China''s. Of the CPSU: the Soviet side threatens "decisive rebuff" and "collective measures" and China waits; he asked the Romanians to tell Khrushchev that China is ready for a break in relations, a break in trade, the treaty torn up, an army from the northeast or Xinjiang. The JCP to hold the flag of national independence, use the Japanese-American monopoly split, build a broad front with some anti-American capitalists.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 23, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng, Yang Shangkun, Liao Chengzhi, Hakamada Satomi, Zhao Yimin, Khrushchev.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:kang-sheng, name:khrushchev-nikita-s, polity:japan, polity:prc, polity:ussr, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1964-04-09.china-leadership
        when: Apr. 9
        date: '1964-04-09'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao approves Luo Ruiqing''s report of Mar. 15 on war preparation in Xinjiang: the Khrushchev group is stirring up frontier tension; the economy and politics first; in arms, active defense, striking second, a protracted war. Mao: "Returned to Luo Ruiqing; do it."'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 9, 1964. Made public: 2013. To check: Luo Ruiqing''s report of Mar. 15, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Apr. 9, 1964). Names: Mao Zedong, Luo Ruiqing, Khrushchev.'
        tags: [name:mao-zedong, name:luo-ruiqing, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-13.china-leadership
        when: Apr. 13–14
        date: '1964-04-13'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Changsha, Rong Yuan: calls Deng Xiaoping, Kang Sheng, Wang Renzhong, Zhang Pinghua and Wu Lengxi on the telegram for Khrushchev''s 70th birthday; it is to be printable in the Soviet Union, a united-and-struggling move, saying that in any emergency the two parties will unite. The CPSU''s publication of the February plenum documents looks strong and is empty; the Beijing reply is to be rewritten before sending; the 9th and 10th commentaries to be hurried. Apr. 14: approves the first, longer draft, adds the last line, and meets with Deng, Kang, Tao Zhu, Wang, Zhang, Wu at 5 p.m.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 13 and 14, 1964. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Kang Sheng, Tao Zhu, Khrushchev, Wang Renzhong, Zhang Pinghua, Wu Lengxi.'
        tags: [name:mao-zedong, name:deng-xiaoping, name:kang-sheng, name:tao-zhu, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-16.china-leadership
        when: Apr. 16
        date: '1964-04-16'
        thread: china-leadership
        also: [soviet-union]
        c: 'Telegram of Mao, Liu Shaoqi, Zhu De and Zhou Enlai to Khrushchev on his 70th birthday: for the demands of both peoples and of revolutionary peoples the two parties and countries will in the long run unite; the differences on Marxism-Leninism are temporary; in any great world event the two parties, two countries and peoples will stand together against the enemy.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 16, 1964. See [[cal.1964-04-13.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Khrushchev. Check: whether printed at the time (the chronology says only that it was sent).'
        tags: [name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:zhou-enlai, name:khrushchev-nikita-s, polity:prc, polity:ussr, vis:only:prc+ussr]
  - add:
      entry:
        id: cal.1964-04-16.china-leadership-2
        when: Apr. 16
        date: '1964-04-16'
        thread: china-leadership
        also: [congo]
        c: 'Mao, Changsha, evening: talks with Zhou Enlai, who has brought guests from Beijing, then with them: Antoine, special envoy of Congo (Brazzaville), and Léonard Mitudidi, Politburo member of the African Solidarity Party of Congo (Léopoldville). The oppressor alone is low; Lumumba died for lack of an army; no army, no state power, no independence, no freedom, no equality. China sees their cause as its own, a duty to support it.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 16, 1964. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Antoine, Léonard Mitudidi, Lumumba. Check: Antoine''s surname (the Chinese gives only Andoine).'
        tags: [name:mao-zedong, name:zhou-enlai, name:lumumba-patrice, polity:congo, polity:congo-brazzaville, polity:prc, vis:only:prc+congo+congo-brazzaville]
  - add:
      entry:
        id: cal.1964-04-25.china-leadership
        when: Apr. 25
        date: '1964-04-25'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Hangzhou, afternoon: receives and dines Hill, chairman, and Oke, a member, of the Communist Party of Australia (Marxist-Leninist); Xie Fuzhi, Jiang Hua, Huo Shilian, Lin Hujia present. Khrushchev rushed in 1960 to strike a party that did not obey; the pressure, the withdrawal of experts and the 22nd Congress all failed; revisionism peaked at the 22nd. China will publish the 9th and 10th commentaries, then answer the CPSU''s Feb. 14 resolution and Suslov''s report; then the question Hill raised, social democracy.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 25, 1964. Made public: 2013. Names: Mao Zedong, Xie Fuzhi, E. F. Hill, Oke, Jiang Hua, Huo Shilian, Lin Hujia, Khrushchev, Suslov. Check: the Australian names (Chinese: Xi''er, Aoke).'
        tags: [name:mao-zedong, name:xie-fuzhi, name:khrushchev-nikita-s, name:suslov-mikhail-a, polity:australia, polity:prc, vis:only:prc+australia]
  - add:
      entry:
        id: cal.1964-04-30.china-leadership
        when: Apr. 30
        date: '1964-04-30'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao revises and approves the Central Committee''s letter to the CPSU Central Committee in reply to its letter of Mar. 7 (Kang Sheng and Wu Lengxi''s draft of Apr. 29): sends it to the Standing Committee. The CPSU has lost its way on the date of a meeting; most parties fear a splitting meeting. Mao adds four paragraphs: what talks and a meeting could do but quarrel; China is against a split; two-party talks should be put off to next May; no party may call a world conference against the rule of consultation. Dated May 7, published May 9.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 30, 1964. Made public: 2013. To check: the letter of May 7, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Apr. 30, 1964); the CPSU letter of Mar. 7. Names: Mao Zedong, Kang Sheng, Wu Lengxi.'
        tags: [name:mao-zedong, name:kang-sheng, polity:prc, polity:ussr, vis:only:prc]
  - add:
      entry:
        id: cal.1964-04-30.china-leadership-2
        when: Apr. 30
        date: '1964-04-30'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao approves the Central Committee''s letter to the Romanian Workers'' Party in reply to its letter of Mar. 25 (draft of Kang Sheng and Wu Lengxi): China will not join the Romanian appeal to end the open polemic, since the Romanian party, calling for an end, itself names China in public attack.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 30, 1964. Made public: 2013. To check: the Romanian letter of Mar. 25, 1964 and China''s reply (named by [[w.zedong-mao-zedong-nianpu]], V, Apr. 30, 1964). Names: Mao Zedong, Kang Sheng, Wu Lengxi.'
        tags: [name:mao-zedong, name:kang-sheng, polity:prc, polity:romania, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-10.china-leadership
        when: May 10–13
        date: '1964-05-10'
        thread: china-leadership
        also: [china]
        c: 'Mao, on his train at Nanjing, Bengbu, Jinan and Tianjin: hears the State Planning Commission''s leading group (Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Chen Boda) on preliminary ideas for the Third Five-Year Plan. Mao: population 800 million by 1970; industry to serve agriculture; two fists, farming and defense industry, and a backside, basic industry; plan small and complete; keep Jiuquan and Panzhihua; leave margins, no full-up revenue; learn from Dazhai; for class and conduct, conduct counts. May 13: the standards of a good socialist education.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, May 10–13, 1964. Made public: 2013. Names: Mao Zedong, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Chen Boda.'
        tags: [name:mao-zedong, name:li-fuchun, name:li-xiannian, name:tan-zhenlin, name:bo-yibo, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-15.china-leadership
        when: May 15
        date: '1964-05-15'
        thread: china-leadership
        also: [china]
        c: 'The Central Work Conference opens, Beijing (to June 17): farm plans in the Third Plan period, rural work and the socialist education movement, the preliminary ideas for the Third Plan, political work in industry and communications, finance and trade. It discusses Mao''s four items: the third front, socialist revolution and preventing revisionism, military strategy, successors; and Liu Shaoqi''s two labor systems and two education systems.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, May 15, 1964 ("5月15日一6月17日"). Made public: 2013. To check: the conference''s records and documents (not named by [[w.zedong-mao-zedong-nianpu]], V, May 15, 1964). Names: Mao Zedong, Liu Shaoqi.'
        tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-05-27.china-leadership
        when: May 27
        date: '1964-05-27'
        thread: china-leadership
        also: [china]
        c: 'Mao presides over the Politburo Standing Committee, the Juxiang Shuwu: two things not enough attended to, the third front and basic industry. First line the coast, second line the Baotou to Lanzhou belt, third the southwest; resolved to build the Panzhihua iron mine, even with the leaders'' salaries. In the atomic age no rear is no safety; Beijing flooded, Panzhihua remains. Luo Ruiqing raises the General Staff''s worry that the Miyun and Guanting reservoirs'' spillways are too small.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, May 27, 1964. Made public: 2013. To check: Liu Shaoqi''s account of Mao''s talk of May 27, in the meeting of May 28 (named by [[w.zedong-mao-zedong-nianpu]], V, May 27, 1964, note). Names: Mao Zedong, Luo Ruiqing.'
        tags: [name:mao-zedong, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-02.china-leadership
        when: June 2
        date: '1964-06-02'
        thread: china-leadership
        c: 'Mao, Beijing, afternoon: receives Senator Vittorelli of Italy and the Italian trade commissioner at Hong Kong; Lu Xuzhang present. An Italian exhibition in China good, normal trade a base for relations. Could Chiang Kai-shek return as a party head? Mao: if he wishes, he may stay in Taiwan, as governor, a province not a state, no foreign relations. No journalists to the U.S. until the big questions are settled; the main question with the U.S. is Taiwan.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 2, 1964. Made public: 2013. Names: Mao Zedong, Chiang Kai-shek, Vittorelli, Lu Xuzhang.'
        tags: [name:mao-zedong, name:chiang-kai-shek, polity:prc, polity:italy, polity:roc, vis:only:prc+italy]
  - add:
      entry:
        id: cal.1964-06-08.china-leadership
        when: June 8
        date: '1964-06-08'
        thread: china-leadership
        also: [china]
        c: 'Mao presides over an enlarged Politburo Standing Committee meeting at the Central Work Conference, and speaks; the first time he meets the conference in 20-odd days. Liu Shaoqi on two education systems; on the French party giving up arms; on whether China may turn revisionist. Mao: it already has, as at the Baiyin works and at Xiaozhan commune near Tianjin, which Chen Boda investigated; a third of the power is in enemy hands. The "two into one" is revisionism, class conciliation; the Selected Works, second edition, a fifth volume: "nothing to put in it." Each province to have grenade, explosive and arms plants; cadres in three lines against sudden death.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 8, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Peng Zhen, Kang Sheng, Tao Zhu, Li Xuefeng, Chen Boda.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:peng-zhen, name:kang-sheng, name:tao-zhu, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-09.china-leadership
        when: June 9
        date: '1964-06-09'
        thread: china-leadership
        also: [middle-east-yemen]
        c: 'Mao, Beijing, afternoon: receives Abdullah al-Sallal, President of the Yemen Arab Republic, and party; Liu Shaoqi and Zhou Enlai present. China supports every people and government against imperialism; if not under imperialist control, it can go well.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 9, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Sallal.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:sallal-abdullah-al, polity:prc, polity:yemen, vis:only:prc+yemen]
  - add:
      entry:
        id: cal.1964-06-11.china-leadership
        when: June 11
        date: '1964-06-11'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides over a plenary session of the Central Work Conference, Hall of the People, Room 118, afternoon; Liu Shaoqi reports on the struggle against modern revisionism. Liu: if the Soviet Union went revisionist in 40 years and Lenin''s party was transformed, will China''s? Mao: it will if no attention is paid; and may anyhow; it would be a matter of months, years, decades, then a turn back. Prepare now for the day. Mass movements against it, the five-antis and four-cleans; theory and the arts. Do not arrest, expel or kill at random. "The sky may darken."'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 11, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi.'
        tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-16.china-leadership
        when: June 16
        date: '1964-06-16'
        thread: china-leadership
        also: [china]
        c: 'Mao, at the Ming Tombs Reservoir, afternoon: after watching the Beijing and Jinan troops'' display, presides over a meeting of the Politburo Standing Committee and the first secretaries of the Party''s regional bureaus. Two things: local Party committees to take up military matters, and successors. Each province to build a militia, local troops, an arms plant. For successors, five conditions: know some Marxism-Leninism; serve the majority at home and abroad; unite most, even those once opposed; consult, no one-man talk; criticize oneself. Three tiers of successors, from the bureaus to the branches.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 16, 1964. Made public: 2013. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-19.china-leadership
        when: June 19
        date: '1964-06-19'
        thread: china-leadership
        c: 'Mao presides over the Politburo Standing Committee, the Fujian Hall, afternoon. Mao on the People''s Daily: it spread "ghosts do no harm" in 1961 and never accounted for it; after the 10th plenum all the Party pursued class struggle, the paper did not criticize it; it talks class struggle abroad, none at home; no paper is free of error, the answer is to correct it. Wu Lengxi relays this to the staffs of the paper and Xinhua on June 23.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 19, 1964. Made public: 2013. To check: the People''s Daily''s 1961 pieces on ghosts (named by [[w.zedong-mao-zedong-nianpu]], V, June 19, 1964). Names: Mao Zedong, Wu Lengxi.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-06-24.china-leadership
        when: June 24
        date: '1964-06-24'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Mao, Beijing, Hall of the People, Room 118, evening: receives Văn Tiến Dũng, Workers'' Party Politburo member and chief of staff of the Vietnam People''s Army; He Long present. Both parties and countries cooperate against the enemy; China is preparing to aid Vietnam; if the U.S. ventures into the North, Chinese troops go over as volunteers. Prepare for every case; the enemy grows bolder as one fears; strength in the South and Laos still on the enemy''s side; the point is to destroy its living force. Criticizes high-cadres'' health care as learned from the Soviet Union.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 24, 1964. Made public: 2013. See [[cal.1964-06.china]]. Names: Mao Zedong, Văn Tiến Dũng, He Long.'
        tags: [name:mao-zedong, name:van-tien-dung, name:he-long, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1964-06.china-leadership
        when: June
        date: 1964-06
        thread: china-leadership
        also: [china]
        c: 'Mao, to a meeting of the Politburo Standing Committee and the bureau first secretaries: six marks of a good socialist education: poor and lower-middle peasants truly roused; the cadres'' four unclean matters settled; cadres in labor; a good leading core; saboteurs among the landlords, rich peasants, counter-revolutionaries and bad elements watched locally, not sent up; output up.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June, 1964 ("6月"). Made public: 2013. Names: Mao Zedong. Check: the day of the meeting (the nianpu gives only the month).'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-02.china-leadership
        when: July 2
        date: '1964-07-02'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao talks on military strategy with Zhou Enlai, Peng Zhen, He Long, Yang Chengwu. The picked units'' display to be spread through the army. Watch the north, not only the east: revisionism as well as imperialism. Each province to have an arms plant, repair first, then manufacture; no reliance on the Center. Prepared, the enemy may not come; unprepared, he may.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 2, 1964. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Peng Zhen, He Long, Yang Chengwu.'
        tags: [name:mao-zedong, name:zhou-enlai, name:peng-zhen, name:he-long, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-05.china-leadership
        when: July 5
        date: '1964-07-05'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao revises, from July 5, in several meetings, the ninth commentary on the CPSU open letter: retitled "On Khrushchov''s Phony Communism and Its Historical Lessons for the World". He changes the time the contest between socialism and capitalism needs from "quite long" to "very long", adding: not in decades, a hundred to several hundred years; prepare for longer, not shorter. July 12: the Politburo, in a meeting, approves it. Published July 14 in the People''s Daily and Red Flag, no. 13.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 5 and 12, 1964. Made public: 2013. The article public: People''s Daily, July 14, 1964. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-07.china-leadership
        when: July 7
        date: '1964-07-07'
        thread: china-leadership
        also: [china]
        c: 'The Secretariat meets, on Mao''s nomination: a five-man group of Peng Zhen (head), Lu Dingyi, Kang Sheng, Zhou Yang and Wu Lengxi to direct the carrying out of the Center''s and Mao''s instructions on literature and art and philosophy and social science.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 7, 1964. Made public: 2013. Names: Mao Zedong, Peng Zhen, Lu Dingyi, Kang Sheng, Zhou Yang, Wu Lengxi. Check: the group''s later name (the "Group of Five") and the chronology''s silence on its minutes.'
        tags: [name:mao-zedong, name:peng-zhen, name:lu-dingyi, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-15.china-leadership
        when: July 15
        date: '1964-07-15'
        thread: china-leadership
        also: [china]
        c: 'Mao, Zhongnanhai, the Yinian Tang, afternoon, with Zhou Enlai, Peng Zhen, He Long, Chen Yi, Luo Ruiqing, Kang Sheng, Wu Xiuquan, Yang Chengwu, Wu Lengxi. Luo reports Lin Biao''s word that Mao''s instruction on strategy was thought out, to be carried out firmly. Mao: two questions: where the enemy comes from; and local forces, with arms plants in some provinces. Panzhihua and Jiuquan not yet settled; if materials fall short, build the Chengdu-Kunming line first.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 15, 1964. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Peng Zhen, He Long, Chen Yi, Luo Ruiqing, Kang Sheng, Lin Biao, Wu Xiuquan, Yang Chengwu, Wu Lengxi.'
        tags: [name:mao-zedong, name:zhou-enlai, name:peng-zhen, name:he-long, name:chen-yi, name:luo-ruiqing, name:kang-sheng, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-25.china-leadership
        when: July 25
        date: '1964-07-25'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides over an enlarged Politburo Standing Committee, the Yinian Tang, on the reply to the CPSU letter of June 15. A general review of the anti-revisionist struggle: Khrushchev may run a desperate risk, from unrest at home and trouble with other parties. Henceforth the articles aim at Khrushchev alone: "when jackals hold the road, why ask after the foxes", not other parties, nor other Soviet leaders.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 25, 1964. Made public: 2013. To check: the CPSU letter of June 15, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, July 25, 1964). Names: Mao Zedong, Khrushchev.'
        tags: [name:mao-zedong, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-07-27.china-leadership
        when: July 27
        date: '1964-07-27'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Mao, Hall of the People, Room 118: receives three Vietnamese delegations at the 10th anniversary of the Geneva Agreements; Guo Moruo and Liao Chengzhi present. Of an American bombing or invasion of the North: Vietnam and China both to prepare; if the U.S. bombs or lands, China will fight; the war would be no longer Vietnam''s alone; the U.S. can send troops, so can China; "a step and we are there".'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 27, 1964. Made public: 2013. Names: Mao Zedong, Liao Chengzhi, Guo Moruo.'
        tags: [name:mao-zedong, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1964-07-28.china-leadership
        when: July 28
        date: '1964-07-28'
        thread: china-leadership
        also: [soviet-union]
        c: 'The Politburo in enlarged session, Liu Shaoqi presiding: adopts the Central Committee''s reply to the CPSU letter of June 15. Mao has added: a "splitting meeting, no, a splitting small meeting"; the revisionists a handful; a world conference might better come late than early, or not at all; had not been held for 14 years. Sent; the CPSU answers on July 30.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 28, 1964. Made public: 2013. To check: the reply (named by [[w.zedong-mao-zedong-nianpu]], V, July 28, 1964). Names: Mao Zedong, Liu Shaoqi.'
        tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-04.china-leadership
        when: Aug. 4
        date: '1964-08-04'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Beidaihe, Building no. 1: calls Deng Xiaoping, Peng Zhen and others on the CPSU letter of July 30. Mao: the guess was right, Khrushchev jumps at a touch; he answered in two days to China''s letter of July 28, a prepared plot; with the order to meet, he has resolved to split; no talks, no international meeting to consider; answer briefly.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 4, 1964. Made public: 2013. To check: the CPSU letter of July 30, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Aug. 4, 1964). Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Khrushchev.'
        tags: [name:mao-zedong, name:deng-xiaoping, name:peng-zhen, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-05.china-leadership
        when: Aug. 5
        date: '1964-08-05'
        thread: china-leadership
        also: [china]
        c: 'The Secretariat decides: Liu Shaoqi to preside over revising the "latter ten points" on rural socialist education; a command post for the four-cleans and five-antis, Liu in charge. Liu goes south to Guangzhou with Tian Jiaying to revise. Asked by Tian for instructions, Mao: first, do not take the basic cadres for pitch black; second, do not mass many work-team members in one place.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 5, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Tian Jiaying.'
        tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-06.china-leadership
        when: Aug. 6
        date: '1964-08-06'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam-tonkin]
        c: 'Mao, Beidaihe, morning: reads the draft Chinese government statement condemning U.S. aggression against the Democratic Republic of Vietnam (the Aug. 5 naval air raids on Nghệ An, Hòn Gai, Thanh Hóa): an attack on Vietnam is an attack on China, the Chinese people will not sit by. At 6 a.m. instructs Wang Dongxing: read, then to Jiang Qing; "war is coming, my plans for movement must be reconsidered" (his planned ride along the Yellow and Yangtze rivers). The statement published that day.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 6, 1964. Made public: 2013. The statement public: People''s Daily, Aug. 6, 1964. See [[cal.1964-08-05.china]]. Names: Mao Zedong, Jiang Qing, Wang Dongxing.'
        tags: [name:mao-zedong, name:jiang-qing, polity:prc, polity:drv, polity:us, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-06.china-leadership-2
        when: Aug. 6
        date: '1964-08-06'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Beidaihe, Building no. 1: calls Deng Xiaoping, Peng Zhen and others: Khrushchev is resolved to hold a splitting meeting. China, with Korea and Vietnam and the other left parties, need not consult beforehand nor draft a program; China will not attend whatever he calls. The writers may rest, bathe, and think on a tenth commentary.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 6, 1964. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Khrushchev.'
        tags: [name:mao-zedong, name:deng-xiaoping, name:peng-zhen, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-13.china-leadership
        when: Aug. 13
        date: '1964-08-13'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam-tonkin]
        c: 'Mao, Beidaihe, afternoon: receives Lê Duẩn, first secretary of the Workers'' Party; Deng Xiaoping, Peng Zhen, Kang Sheng, Wu Xiuquan present. After the U.S. raid of Aug. 5: from China''s inside reports the Americans are in a state; no U.S. army sent; so none of Washington, Hanoi, Beijing wants a fight. For the next ten to fifteen years fight small wars like the South''s, not large; a first, second, third line, Hanoi the second; keep the main force, do not trade blows on the coast; if the U.S. lands, it needs several hundred thousand men. China too will prepare; it sent troops into Korea only when the enemy reached the Yalu.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 13, 1964. Made public: 2013. Names: Mao Zedong, Lê Duẩn, Deng Xiaoping, Peng Zhen, Kang Sheng, Wu Xiuquan.'
        tags: [name:mao-zedong, name:le-duan, name:deng-xiaoping, name:peng-zhen, name:kang-sheng, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1964-08-17.china-leadership
        when: Aug. 17
        date: '1964-08-17'
        thread: china-leadership
        also: [africa-algeria-morocco]
        c: 'Mao, Beidaihe, afternoon: receives the Algerian ambassador, Mohamed Yala, with Ben Bella''s letter as FLN secretary-general and president; Qiao Guanhua present. Mao: a cable to the president greeting him; in opposing U.S. imperialism China has common ground with de Gaulle. So the "middle world", the "third world", is split: the first third world Asia, Africa, Latin America; the second France, Japan, Canada and some of Europe, in conflict with the U.S.; Japan and West Germany show signs.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 17, 1964. Made public: 2013. Names: Mao Zedong, Ben Bella, de Gaulle, Qiao Guanhua, Mohamed Yala. Check: the ambassador''s name (Chinese: Muhanmode Yala).'
        tags: [name:mao-zedong, name:ben-bella-ahmed, name:de-gaulle-charles, name:qiao-guanhua, polity:prc, polity:algeria, polity:fr, vis:only:prc+algeria]
  - add:
      entry:
        id: cal.1964-08-18.china-leadership
        when: Aug. 18
        date: '1964-08-18'
        thread: china-leadership
        also: [china]
        c: 'Mao, Beidaihe, afternoon: with Kang Sheng, Chen Boda, Wu Jiang, Guan Feng, Gong Yuzhi and Shao Tiezhen on philosophy. Philosophers to go to the countryside this winter and join the class struggle; arts students and teachers all to go, five months in the country and five in a factory; science stays. Synthesis is a big fish eating small fish; Yang Xianzhen''s "two into one" is wrong. Of the three laws, quantity and quality, negation of the negation, and the unity of opposites: only one, the unity of opposites; no negation of the negation.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 18, 1964. Made public: 2013. Names: Mao Zedong, Kang Sheng, Chen Boda, Wu Jiang, Guan Feng, Gong Yuzhi, Shao Tiezhen, Yang Xianzhen.'
        tags: [name:mao-zedong, name:kang-sheng, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-19.china-leadership
        when: Aug. 19
        date: '1964-08-19'
        thread: china-leadership
        also: [soviet-union, japan]
        c: 'Mao, Beidaihe, calls Deng Xiaoping, Peng Zhen and others again: the Party will not attend the CPSU''s 26-party preparatory meeting even if only China and Albania hold out; the Japanese party to be told, to decide for itself. Aug. 30: the Central Committee''s reply to the CPSU says so.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 19, 1964. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Peng Zhen.'
        tags: [name:mao-zedong, name:deng-xiaoping, name:peng-zhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-20.china-leadership
        when: Aug. 20
        date: '1964-08-20'
        thread: china-leadership
        also: [china]
        c: 'Mao, Beidaihe, morning: hears Bo Yibo on planning and tells him: with the coast so built up, industry must move; the second line Western Hunan, Western Hubei, Western Henan, Shanxi, Shaanxi, Jiangxi, Jilin, Inner Mongolia; the third line Sichuan, Yunnan, Guizhou. The lesson of Stalin: no works prepared, no enemy attack prepared for, no moving. The coastal provinces to move not only factories but schools, academies, design institutes; later is worse than early. The Chengdu-Kunming line, the Hunan-Guizhou, Yunnan-Guizhou, Sichuan-Guizhou still without a shadow. Each coastal province a division, an arms plant. Bo: a third of the units are rotten.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 20, 1964. Made public: 2013. Names: Mao Zedong, Bo Yibo, Stalin.'
        tags: [name:mao-zedong, name:bo-yibo, name:stalin-joseph, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-22.china-leadership
        when: Aug. 22
        date: '1964-08-22'
        thread: china-leadership
        also: [china]
        c: 'Mao, to Deng Xiaoping, on Liu Shaoqi''s letter of Aug. 19 and Wang Guangmei''s report on Peach Garden brigade, Funing county, Hebei (the "Peach Garden experience") with Liu''s draft covering note: let Deng handle it, after the regional secretaries'' meeting. Aug. 27: print for those at that meeting; if they agree, send throughout the country; "I agree with Chen Boda and Liu Shaoqi".'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 22, 1964. Made public: 2013. To check: Wang Guangmei''s report of July 5, 1964 to the Hebei Party committee (named by [[w.zedong-mao-zedong-nianpu]], V, Aug. 22, 1964). Names: Mao Zedong, Deng Xiaoping, Liu Shaoqi, Chen Boda, Wang Guangmei.'
        tags: [name:mao-zedong, name:deng-xiaoping, name:liu-shaoqi, name:chen-boda, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-29.china-leadership
        when: Aug. 29–Sept. 1
        date: '1964-08-29'
        thread: china-leadership
        also: [china]
        c: 'Meeting of the first secretaries of the Party''s regional bureaus, Beijing, Liu Shaoqi presiding: the plan for the socialist education movement and the revised "latter ten points". The revised draft issued Sept. 18: the enemy corrupts cadres and sets up counter-revolutionary "two-faced" power; the movement bigger than land reform; the work teams to lead everything, the grass roots no longer relied on; some regions to make up the democratic revolution. Mao talks with seven of the secretaries on Aug. 30.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 29–Sept. 1, 1964. Made public: 2013. To check: the "latter ten points", the revised draft (issued Sept. 18, 1964; named by [[w.zedong-mao-zedong-nianpu]], V, Aug. 29, 1964). Names: Mao Zedong, Liu Shaoqi.'
        tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-29.china-leadership-2
        when: Aug. 29
        date: '1964-08-29'
        thread: china-leadership
        also: [china]
        c: 'Mao, afternoon: with Li Fuchun, Bo Yibo and Chen Boda on planning. Li proposes merging the Planning and Economic Commissions; Mao agrees to a decision-making body of twelve: himself in charge, Liu, Deng, Zhou, Peng Zhen, the six economic sectors'' heads Li Fuchun, Li Xiannian, Bo Yibo, Tan Zhenlin, Nie Rongzhen, Luo Ruiqing, and Chen Boda.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 29, 1964. Made public: 2013. Names: Mao Zedong, Li Fuchun, Bo Yibo, Chen Boda, Liu Shaoqi, Deng Xiaoping, Zhou Enlai, Peng Zhen, Li Xiannian, Tan Zhenlin, Nie Rongzhen, Luo Ruiqing.'
        tags: [name:mao-zedong, name:li-fuchun, name:bo-yibo, name:chen-boda, name:liu-shaoqi, name:deng-xiaoping, name:zhou-enlai, name:peng-zhen, name:li-xiannian, name:tan-zhenlin, name:nie-rongzhen, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-08-30.china-leadership
        when: Aug. 30
        date: '1964-08-30'
        thread: china-leadership
        also: [soviet-union]
        c: 'The Central Committee''s reply to the CPSU letter of July 30 goes out, on the decision of Aug. 19: the CPSU letter shuts the door to consultation on a conference of the parties and orders a split; "we will not attend your international meeting that splits the movement, nor its preparatory meeting". Repeats the stand of July 28.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 30, 1964. Made public: 2013. See [[cal.1964-08-19.china-leadership]]. To check: the reply of Aug. 30, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Aug. 30, 1964). Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, polity:ussr, vis:only:prc+ussr]
  - add:
      entry:
        id: cal.1964-09-13.china-leadership
        when: Sept. 13
        date: '1964-09-13'
        thread: china-leadership
        also: [japan]
        c: 'Mao, Hangzhou, afternoon: receives Miyamoto Kenji, general secretary of the Japanese Communist Party; Peng Zhen, Jiang Hua present. Questions about the Japanese parties and the JCP''s line. Each party settles its own affairs; others'' views are advice; two-sided and many-sided talks, public or not, remain possible. Feudalism in China lasted two thousand years because the peasants were scattered; people must unite to beat a ruling class.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 13, 1964. Made public: 2013. Names: Mao Zedong, Peng Zhen, Miyamoto Kenji, Jiang Hua.'
        tags: [name:mao-zedong, name:peng-zhen, polity:prc, polity:japan, vis:only:prc+japan]
  - add:
      entry:
        id: cal.1964-09-15.china-leadership
        when: Sept. 15
        date: '1964-09-15'
        thread: china-leadership
        also: [china]
        c: Mao, as chairman of the Central Committee, writes separately to the Central Committees of the Communist parties of Japan, Indonesia, Thailand, Malaya, Burma and Ceylon, inviting delegations to the 15th anniversary of the People's Republic.
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 15, 1964. Made public: 2013. Names: Mao Zedong. Check: whether the letters went to other parties as well (the nianpu names six).'
        tags: [name:mao-zedong, polity:burma, polity:ceylon, polity:indonesia, polity:japan, polity:malaysia, polity:prc, polity:thailand, vis:only:prc+japan+indonesia+thailand+malaysia+burma+ceylon]
  - add:
      entry:
        id: cal.1964-09-21.china-leadership
        when: Sept. 21
        date: '1964-09-21'
        thread: china-leadership
        also: [testing]
        c: 'Mao reads Luo Ruiqing''s report of Sept. 20: all preparations for the nuclear test complete, to be fired in October; and Zhou Enlai''s letter: the Central Committee''s fifteen-man special committee met twice in September; best between mid-October and early November, 20 days'' notice. Mao: "Read. To be done."'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 21, 1964. Made public: 2013. To check: Luo Ruiqing''s report of Sept. 20 and Zhou Enlai''s letter of Sept. 21 (named by [[w.zedong-mao-zedong-nianpu]], V, Sept. 21, 1964). Names: Mao Zedong, Luo Ruiqing, Zhou Enlai.'
        tags: [name:mao-zedong, name:luo-ruiqing, name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-09-27.china-leadership
        when: Sept. 27
        date: '1964-09-27'
        thread: china-leadership
        also: [china]
        c: 'Mao, Hall of the People, evening: receives Prince Norodom Sihanouk, Cambodia''s head of state, and Princess; Liu Shaoqi, Wang Guangmei, Dong Biwu and Zhou Enlai present. A country of six million dares to oppose the first imperialist power; the U.S. has no answer. Chiang''s UN seat: in a few years, perhaps ten, the U.S. must expel his delegate, not yet. On a book Mao recommended: Engels, Socialism: Utopian and Scientific; and the Manifesto.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 27, 1964. Made public: 2013. Names: Mao Zedong, Norodom Sihanouk, Liu Shaoqi, Dong Biwu, Zhou Enlai.'
        tags: [name:mao-zedong, name:norodom-sihanouk, name:liu-shaoqi, name:dong-biwu, name:zhou-enlai, polity:prc, polity:cambodia, vis:only:prc+cambodia]
  - add:
      entry:
        id: cal.1964-09-29.china-leadership
        when: Sept. 29
        date: '1964-09-29'
        thread: china-leadership
        c: 'Mao, Hall of the People, evening: receives Alphonse Massamba-Débat, President of Congo (Brazzaville); Zhou Enlai and Chen Yi present. Welcomes all African peoples against imperialism and colonialism; China will support Congo, as equals, and brothers.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 29, 1964. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Yi, Alphonse Massamba-Débat.'
        tags: [name:mao-zedong, name:zhou-enlai, name:chen-yi, polity:congo-brazzaville, polity:prc, vis:only:prc+congo-brazzaville]
  - add:
      entry:
        id: cal.1964-10-05.china-leadership
        when: Oct. 5
        date: '1964-10-05'
        thread: china-leadership
        also: [vietnam-hanoi]
        c: 'Mao, Hall of the People, evening: receives Phạm Văn Đồng, premier, leading a Party and government delegation; Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi, Li Fuchun present. Mao: the U.S. may fight as long as it likes, Vietnam will fight as long; Korea showed that it can be fought. Not the time to send Chinese troops to the South; when depends. Whether to hit the North is not decided. Phạm Văn Đồng: Vietnam will keep the war in the South to "special war" and not let it spread north. Mao: good; prepare, but be careful, no haste. A talk with the U.S. may be of use. China is ready for an American landing, which will need Chiang and South Korea; if it comes, let it go where it likes, and fight guerrilla as with the Japanese.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 5, 1964. Made public: 2013. Names: Mao Zedong, Phạm Văn Đồng, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi, Li Fuchun, Chiang Kai-shek.'
        tags: [name:mao-zedong, name:pham-van-dong, name:liu-shaoqi, name:zhou-enlai, name:zhu-de, name:deng-xiaoping, name:peng-zhen, name:chen-yi, name:li-fuchun, name:chiang-kai-shek, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1964-10-07.china-leadership
        when: Oct. 7
        date: '1964-10-07'
        thread: china-leadership
        also: [korea-leadership]
        c: 'Mao, Yinian Tang, afternoon: receives a Korean Party and government delegation under Choe Yong-gon; Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, Kang Sheng present. Mao: the two parties to cooperate as one; if the U.S. attacks China it needs Japan, South Korea and Chiang, not Europe; Japan fought China fourteen years. China''s method: go where you like, I go where I like; the Korean-style works, a first line, a second, tunnels, China will build too.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 7, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, Kang Sheng, Choe Yong-gon.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:dong-biwu, name:zhu-de, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:kang-sheng, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-10-08.china-leadership
        when: Oct. 8
        date: '1964-10-08'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Hall of the People, Room 118, afternoon: receives a Romanian Party and government delegation under Maurer; Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Xiannian present. The U.S. "nonproliferation" spreads nuclear arms to capitalists, not to socialists; China hopes to draw West Germany away from the U.S., with Britain, France, Italy, Japan. Two controllers: the Soviet Union and the U.S. Khrushchev has put his own noose on, to be in Moscow for the 26 parties on Dec. 15; a soft-bodied animal, not to be feared. Comecon will either collapse or be opened to thirteen socialist states on an equal footing.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 8, 1964. Made public: 2013. Names: Mao Zedong, Maurer, Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Xiannian, Khrushchev.'
        tags: [name:mao-zedong, name:maurer-ion-gheorghe, name:liu-shaoqi, name:dong-biwu, name:zhu-de, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:li-xiannian, name:khrushchev-nikita-s, polity:prc, polity:romania, vis:only:prc+romania]
  - add:
      entry:
        id: cal.1964-10-09.china-leadership
        when: Oct. 9
        date: '1964-10-09'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Diaoyutai guesthouse, afternoon: receives an Albanian Party and government delegation under Balluku; Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, He Long, Luo Ruiqing present. Revisionists and imperialists both split, a revolutionary situation favorable to China; Europe to be drawn against the U.S., Japan too. Khrushchev bullies the weak and fears the strong. For Sino-Soviet border talks, China wants a reasonable frontier and a treaty.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 9, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, He Long, Luo Ruiqing, Khrushchev, Balluku.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:dong-biwu, name:zhu-de, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:he-long, name:luo-ruiqing, name:khrushchev-nikita-s, polity:albania, polity:prc, vis:only:prc+albania]
  - add:
      entry:
        id: cal.1964-10-16.china-leadership
        when: Oct. 16
        date: '1964-10-16'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides over the Politburo Standing Committee, Zhongnanhai, the Juxiang Shuwu, 1 p.m., on Khrushchev''s fall. Mao: his fall is a sign of change, else why; the CPSU leaders will change, but not quickly nor far; to see how, then to settle countermeasures. Decisions: a joint telegram of Mao, Liu Shaoqi, Zhu De and Zhou Enlai to Brezhnev on his election as First Secretary and to Kosygin as Chairman of the Council of Ministers, sent that day; no polemical articles for the present.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 16, 1964. Made public: 2013. See [[cal.1964-10-16.testing]]. Names: Mao Zedong, Khrushchev, Liu Shaoqi, Zhu De, Zhou Enlai, Brezhnev, Kosygin.'
        tags: [name:mao-zedong, name:khrushchev-nikita-s, name:liu-shaoqi, name:zhu-de, name:zhou-enlai, name:brezhnev-leonid, name:kosygin-aleksei, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-16.china-leadership-2
        when: Oct. 16
        date: '1964-10-16'
        thread: china-leadership
        also: [soviet-union, cuba]
        c: 'Mao, Hall of the People, Shanghai Room, 6 p.m.: receives a Cuban Party and government delegation; Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, Lu Dingyi present. The quarrel with the Soviet leaders temporary; the two countries will not split; the Chinese telegrams to Kosygin and Brezhnev go that day, an exception to the rule of no congratulations between parties. Khrushchev was a figure; his portraits down in Moscow on the 14th; he handled Stalin too hard. China is carrying on a longer, deeper revolution, the socialist education movement, perhaps ten years.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 16, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, Lu Dingyi, Khrushchev, Kosygin, Brezhnev, Stalin.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:dong-biwu, name:zhu-de, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:lu-dingyi, name:khrushchev-nikita-s, name:kosygin-aleksei, name:brezhnev-leonid, name:stalin-joseph, polity:cuba, polity:prc, vis:only:prc+cuba]
  - add:
      entry:
        id: cal.1964-10-22.china-leadership
        when: Oct. 22
        date: '1964-10-22'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides in the evening over an enlarged Politburo Standing Committee on Khrushchev''s fall and what to do. Kang Sheng''s list of ten charges, five foreign, five domestic (the test ban, Germany, China, Cuba, Comecon; farming, the army, spending, planning, nepotism). Mao: the three-power test-ban treaty tied the Soviet hands, their generals against it; Germany, a surrender, frightening the East Europeans; relations with China; failure in farming, in industry; army upset, marshals retired; denial of Stalin, curbs on democracy, personality cult. Not to write now: "freeze" two months, a look first. The new men still revisionist but, with doubts about the U.S., need China as a friend. Mao agrees on a letter to the left parties; a pause on articles.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 22, 1964. Made public: 2013. Names: Mao Zedong, Kang Sheng, Khrushchev, Stalin.'
        tags: [name:mao-zedong, name:kang-sheng, name:khrushchev-nikita-s, name:stalin-joseph, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-22.china-leadership-2
        when: Oct. 22
        date: '1964-10-22'
        thread: china-leadership
        also: [china]
        c: 'Mao reads the Guangdong Party committee''s report of Oct. 18 on defense industry and third-front war preparation, and writes to Liu, Zhou, Deng, Peng and Luo Ruiqing: Guangdong has moved; send it to the front and second-line provinces to discuss their own third fronts and report; about 1.5 billion yuan nationwide over two or three years, "the cost of a long strategic question; to fail now is to regret it". Oct. 27: Lin Biao sends the report on; Mao: "great minds think alike". Nov. 3: Mao approves the Center''s instruction to all provinces.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 22, 1964. Made public: 2013. To check: the Guangdong report of Oct. 18, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Oct. 22, 1964). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Luo Ruiqing, Lin Biao.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:luo-ruiqing, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-27.china-leadership
        when: Oct. 27
        date: '1964-10-27'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides in the afternoon over the Politburo Standing Committee, Room 118, with a dozen more on foreign affairs: on what to do since Khrushchev''s fall, ten days'' watching. The policy so far was "affirm and watch" (one telegram); now "push and watch". Zhou Enlai to lead a Party and government delegation to the October Revolution celebrations, with He Long; no decision that day. The new CPSU leaders will first take up farming, industry, Party structure; the policy toward China unlikely to change soon; work on them, no great hopes.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 27, 1964. Made public: 2013. Names: Mao Zedong, Zhou Enlai, He Long, Khrushchev.'
        tags: [name:mao-zedong, name:zhou-enlai, name:he-long, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-29.china-leadership
        when: Oct. 29
        date: '1964-10-29'
        thread: china-leadership
        also: [soviet-union, korea-leadership]
        c: 'Mao presides over the Politburo Standing Committee at Diaoyutai, no. 10: not enough that China alone send a delegation to Moscow; propose that the twelve socialist states all send, the Koreans, Vietnamese, Romanians and Albanians in particular, as China alone would be conspicuous; East Europe''s states want the CPSU line kept. Both to be put to the CPSU, and the four ambassadors in Beijing to be told. Liu, Zhou and Deng agree; Deng, with Peng Zhen and others, to Korea to inform Kim Il Sung; Deng to tell Zhu De and Chen Yun, Zhou to tell Lin Biao.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 29, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Kim Il Sung, Zhu De, Chen Yun, Lin Biao.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:kim-il-sung, name:zhu-de, name:chen-yun, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-10-30.china-leadership
        when: Oct. 30
        date: '1964-10-30'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao to Liu, Zhou, Deng, Peng Zhen, Kang Sheng, Wu Lengxi on the draft People''s Daily commentary, "Another Self-exposure by the Tito Clique": not tactical to print this kind of piece now ("after the jackal falls, scolding the fox"); the draft not to be used.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 30, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Kang Sheng, Tito, Wu Lengxi.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:kang-sheng, name:tito-josip-broz, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-01.china-leadership
        when: Nov. 1
        date: '1964-11-01'
        thread: china-leadership
        also: [soviet-union, korea-leadership]
        c: 'Mao presides over the Politburo Standing Committee, Juxiang Shuwu, evening: hears Zhou Enlai on his briefing of the socialist states'' ambassadors and chargés on sending a Party and government delegation to the October Revolution celebrations, and Deng Xiaoping on his visit to Korea. Mao: the policy is "push and watch"; the push not to be much hoped from, the watch still important; the ten days past were watching; the trip to Moscow is watching too, to see why Khrushchev was removed and what comes; but not too earnest, chiefly a friendly gesture.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 1, 1964. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Khrushchev.'
        tags: [name:mao-zedong, name:zhou-enlai, name:deng-xiaoping, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-05.china-leadership
        when: Nov. 5
        date: '1964-11-05'
        thread: china-leadership
        also: [soviet-union]
        c: Mao presides over the Politburo Standing Committee at 3 a.m., Juxiang Shuwu, again on the line for the Party and government delegation under Zhou Enlai and He Long to the 47th anniversary of the October Revolution at Moscow; it leaves Beijing that day.
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 5, 1964. Made public: 2013. Names: Mao Zedong, Zhou Enlai, He Long.'
        tags: [name:mao-zedong, name:zhou-enlai, name:he-long, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-07.china-leadership
        when: Nov. 7
        date: '1964-11-07'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides over the Politburo Standing Committee, Yinian Tang, afternoon, on Brezhnev''s speech of Nov. 6. Mao: the new CPSU leadership is weak and timid, will not break with Khrushchev, will not announce the planned meeting; they removed him from long-stored discontent, hurriedly, without clearing his errors or his line; no program among them. They may improve or worsen, or change a little with the line unchanged. Keep watching.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 7, 1964. Made public: 2013. Names: Mao Zedong, Brezhnev, Khrushchev.'
        tags: [name:mao-zedong, name:brezhnev-leonid, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-08.china-leadership
        when: Nov. 8
        date: '1964-11-08'
        thread: china-leadership
        also: [korea-leadership, soviet-union]
        c: 'Mao, Hall of the People, Room 118, evening: with Liu Shaoqi, Deng Xiaoping and Peng Zhen receives Kim Il Sung, for an exchange on why Khrushchev fell, who counts in the new CPSU leadership, and where it will go.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 8, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kim Il Sung, Khrushchev.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:kim-il-sung, name:khrushchev-nikita-s, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-11-10.china-leadership
        when: Nov. 10
        date: '1964-11-10'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides over the Politburo Standing Committee, Yinian Tang, evening. From the first Moscow talks (Nov. 9): the CPSU group wants to trade a show of unity for an end to the open polemic and for the legitimacy of the December meeting; refuse to discuss a conference of parties, say China will not attend the December preparatory meeting. Mao: no one expected Khrushchev to fall so soon; China was right in March, in the talks with the Romanians, to give not an inch: a pause then would have saved him. Deng to cable the delegation: finish the talks and return; nothing published, not even news. Cable sent 1 a.m. Nov. 11.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 10, 1964. Made public: 2013. Names: Mao Zedong, Khrushchev, Deng Xiaoping, Zhou Enlai.'
        tags: [name:mao-zedong, name:khrushchev-nikita-s, name:deng-xiaoping, name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-14.china-leadership
        when: Nov. 14
        date: '1964-11-14'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Beijing airport, afternoon: with Liu Shaoqi, Zhu De, Dong Biwu, Deng Xiaoping and others meets Zhou Enlai and He Long returning from Moscow; then presides in Room 118 over the Standing Committee on their report. Zhou: the new leaders do not intend a basic change toward China; no clear account why Khrushchev went, no difference of line; want China to end open polemic. Mao: the "Khrushchevism without Khrushchev" guess was right. Close the door on a conference of parties and its preparatory meeting, and on ending the polemic; polemic goes on, answer only after being hit. A Red Flag piece on Khrushchev''s errors. Of the push: a step taken; the new leaders tried to subvert inside the Party; still watch.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 14, 1964. Made public: 2013. To check: Zhou Enlai''s talks with the CPSU leaders at Moscow, Nov. 9–12, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Nov. 11 and 12, 1964). Names: Mao Zedong, Liu Shaoqi, Zhu De, Dong Biwu, Deng Xiaoping, Zhou Enlai, He Long, Khrushchev.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:dong-biwu, name:deng-xiaoping, name:zhou-enlai, name:he-long, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-16.china-leadership
        when: Nov. 16
        date: '1964-11-16'
        thread: china-leadership
        also: [korea-leadership, soviet-union]
        c: 'Mao, Hall of the People, Room 118: second talk with Kim Il Sung. Both agree that the socialist states'' sending delegations to Moscow was a good device. Mao: China went for the Soviet people and the world''s; a loud campaign against the new Soviet leaders would be unpopular; furl the flag, muffle the drums, watch for a time.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 16, 1964. Made public: 2013. See [[cal.1964-11-08.china-leadership]]. Names: Mao Zedong, Kim Il Sung.'
        tags: [name:mao-zedong, name:kim-il-sung, polity:prc, polity:dprk, vis:only:prc+dprk]
  - add:
      entry:
        id: cal.1964-11-25.china-leadership
        when: Nov. 25
        date: '1964-11-25'
        thread: china-leadership
        also: [china]
        c: 'Mao presides over an enlarged Politburo Standing Committee, Yinian Tang, afternoon: decides to hold a Central Work Conference in December on rural socialist education and the Third National People''s Congress at the same time, on the 1965 plan; and discusses Chen Yi''s trip to Indonesia and Burma.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 25, 1964. Made public: 2013. Names: Mao Zedong, Chen Yi.'
        tags: [name:mao-zedong, name:chen-yi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-26.china-leadership
        when: Nov. 26
        date: '1964-11-26'
        thread: china-leadership
        also: [china]
        c: 'Mao, with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen: hears Li Fuchun and Bo Yibo on their survey of the Panzhihua third-front area. Steel by 1975? "Eleven years; faster, Zhou says; faster still"; the imperialists have not fought for twenty years, they will; the H-bomb and missiles faster too, three years too slow. Of six sites for Panzhihua''s steel base: drop Yibin, no coal, no railway. Deng: plan the railway net early. Mao: no dawdling; mines first; one center, no many heads; new techniques; the Soviet frame, to be analyzed.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 26, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Fuchun, Bo Yibo.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:li-fuchun, name:bo-yibo, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-27.china-leadership
        when: Nov. 27
        date: '1964-11-27'
        thread: china-leadership
        also: [congo]
        c: 'Mao reads Chen Jiakang''s cable from Cairo proposing a Beijing rally in support of the Congolese (Léopoldville) people against U.S. aggression: do it, at once, 500,000 to 600,000 at Tiananmen, he will attend.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 27, 1964. Made public: 2013. Names: Mao Zedong, Chen Jiakang.'
        tags: [name:mao-zedong, polity:prc, polity:congo, polity:us, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-28.china-leadership
        when: Nov. 28
        date: '1964-11-28'
        thread: china-leadership
        also: [soviet-union]
        c: Mao presides over the Politburo Standing Committee, Juxiang Shuwu, afternoon, on the CPSU letter of Nov. 26 putting the 26-party preparatory meeting off from Dec. 15, 1964 to Mar. 1, 1965 and calling it a "consultative meeting". China keeps its line and opposes a meeting held against the rule of unanimity; its stand set out in the reply of Aug. 30; no answer.
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 28, 1964. Made public: 2013. To check: the CPSU letter received Nov. 26, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Nov. 28, 1964). Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-11-28.china-leadership-2
        when: Nov. 28
        date: '1964-11-28'
        thread: china-leadership
        also: [congo]
        c: Mao, a statement supporting the people of the Congo (Léopoldville) against U.S. aggression.
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 27, 1964 (the statement, Nov. 28). See [[cal.1964-11-27.china-leadership]]. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:congo, polity:prc, polity:us]
  - add:
      entry:
        id: cal.1964-11-29.china-leadership
        when: Nov. 29
        date: '1964-11-29'
        thread: china-leadership
        also: [congo]
        c: 'Beijing, Tiananmen: Mao at a rally of more than 700,000 against U.S. aggression in the Congo (Léopoldville).'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 27, 1964 (the rally, Nov. 29). See [[cal.1964-11-28.china-leadership-2]]. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:congo, polity:prc, polity:us]
  - add:
      entry:
        id: cal.1964-12-15.china-leadership
        when: Dec. 15
        date: '1964-12-15'
        thread: china-leadership
        also: [china]
        c: 'The Central Work Conference opens, Beijing, the Hall of the People, Hebei Hall, afternoon, Mao presiding (to Jan. 14, 1965): on the rural socialist education movement, to adopt a document on it. Zhou Enlai on Khrushchev''s fall and the Moscow trip: Brezhnev follows Khrushchevism without Khrushchev, new struggles to be prepared. Liu Shaoqi opens the movement''s problems. Mao interjects: this is a plenum, enlarged; he is for clearing out some millions of Party members; no levy on grain where concealed land is reported. A plenary every afternoon at 3:30.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 15, 1964 (the session), and Dec. 15, 1964–Jan. 14, 1965 (the conference). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Khrushchev, Brezhnev.'
        tags: [name:mao-zedong, name:zhou-enlai, name:liu-shaoqi, name:khrushchev-nikita-s, name:brezhnev-leonid, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-20.china-leadership
        when: Dec. 20
        date: '1964-12-20'
        thread: china-leadership
        also: [china]
        c: 'Mao presides over an enlarged Politburo Standing Committee, Hebei Hall, afternoon, on the main contradiction in the countryside; 31 present. Liu: Tao Zhu says it is between the better-off peasant stratum and the poor and lower-middle peasants. Mao: the landlords and rich peasants are the backstage bosses, the cadres of the four uncleans the men in power; the center is these brigade and team cadres; mobilize the masses to rectify the Party, the branch, the commune committee; do not say "stratum"; landlords and rich peasants not above 7 or 8 percent of households, about 10 percent of people; "a leftist tide" feared if 20 percent.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 20, 1964. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Tao Zhu.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:tao-zhu, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-27.china-leadership
        when: Dec. 27
        date: '1964-12-27'
        thread: china-leadership
        also: [china]
        c: 'Mao presides over the Central Work Conference, Hebei Hall, afternoon, on its minutes, the 17 points. Chen Boda: the main contradiction, the four-cleans and the socialism-capitalism contradiction. Mao: the Party has at least two factions, a socialist and a capitalist; and, Beijing has two "independent kingdoms", not the municipal committee. Orders the text issued as "the discussion minutes of the national work conference called by the Politburo", dated Dec. 27; Dec. 28 issued (Central Committee [64] no. 811). Dec. 31: the Central''s General Office stops it, to be destroyed.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 27, 1964. Made public: 2013. See [[cal.1964-12-15.china-leadership]]. To check: the document "Some Problems Now Raised in the Rural Socialist Education Movement" (Central Committee [64] 811, stopped Dec. 31, 1964; named by [[w.zedong-mao-zedong-nianpu]], V, Dec. 15, 1964). Names: Mao Zedong, Chen Boda, Zhu De, Dong Biwu, Lu Dingyi.'
        tags: [name:mao-zedong, name:chen-boda, name:zhu-de, name:dong-biwu, name:lu-dingyi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1964-12-28.china-leadership
        when: Dec. 28
        date: '1964-12-28'
        thread: china-leadership
        also: [china]
        c: 'Mao presides over the Central Work Conference, Hebei Hall, afternoon, after Luo Ruiqing, Chen Yi and Xie Fuzhi speak: the nature of the movement; he takes the third of three formulations, the main contradiction that between socialism and capitalism; the target, those in power in the Party taking the capitalist road. And article 16, the work style: more democracy; "what frightens people has less reason". Tells them to read the Party constitution, the 8th Congress documents, pp. 100–104, and the Constitution''s article 85.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 28, 1964. Made public: 2013. Names: Mao Zedong, Luo Ruiqing, Chen Yi, Xie Fuzhi.'
        tags: [name:mao-zedong, name:luo-ruiqing, name:chen-yi, name:xie-fuzhi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-03.china-leadership
        when: Jan. 3
        date: '1965-01-03'
        thread: china-leadership
        also: [china]
        c: 'Mao presides in the evening over an enlarged Politburo Standing Committee, Hebei Hall, and speaks again on the socialist education movement. Against the "sea of men" method: 15,000 work-team members sent to Xincheng county, Hebei, population 280,000, months and not through; 40 days of reading documents before entering a village is scholasticism; "fear of the wrong root, the wrong household, cadres'' tricks" is nonsense. Enter a village and announce a few things: not to purge the members, to purge the Party and the cadres; cadres who confess small embezzlements and return them are done; the masses will pick their own leaders in the struggle. Rely on the masses first, cadres who have cast off their burdens second, the work team third.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 3, 1965. Made public: 2013. See [[cal.1964-12-15.china-leadership]]. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-05.china-leadership
        when: Jan. 5
        date: '1965-01-05'
        thread: china-leadership
        also: [china]
        c: 'Mao presides over the enlarged Politburo Standing Committee, Hebei Hall, afternoon, continuing. The "17 points": revise them here, or carry them down and amend after; the second ten points too long, cut by half. The "six fears" are fears of the right; "against what there is, as much as there is, right or left". Work teams too many, idle, a "sea of men"; officials from commune level up not to serve in their home areas; Time: the whole country in six or seven years, as written, or sooner; a single unit needs only some months. Seventy to 80 percent of cadres are good, to be won over.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1965. Made public: 2013. See [[cal.1965-01-03.china-leadership]]. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-09.china-leadership
        when: Jan. 9
        date: '1965-01-09'
        thread: china-leadership
        also: [vietnam, china]
        c: 'Mao, Beijing, Room 118, afternoon: receives Edgar Snow; Qiao Guanhua, Gong Peng present. The atom bomb a paper tiger: he only said so; in a war men die, but it will in the end be destroyed. China has none and does not want war; if war comes, use conventional arms. China does not yet want a UN seat, nor does the U.S. want it in. Relations with the U.S. can improve, with time; China and America will draw closer. South Vietnam: talks before or after U.S. troops leave, or the Americans driven out, perhaps held in Korean fashion. Dissatisfied with birth planning in the countryside; wants an oral pill. A personality cult in China "perhaps a little"; Khrushchev fell for having none.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 9, 1965. Snow published an account at the time (Check where and when); the nianpu''s fuller words made public: 2013. Names: Mao Zedong, Qiao Guanhua, Edgar Snow, Gong Peng, Khrushchev.'
        tags: [name:mao-zedong, name:qiao-guanhua, name:khrushchev-nikita-s, polity:prc]
  - add:
      entry:
        id: cal.1965-01-14.china-leadership
        when: Jan. 14
        date: '1965-01-14'
        thread: china-leadership
        also: [china]
        c: 'Mao speaks at the close of the Central Work Conference, Hall of the People, Fujian Hall, afternoon, as the final text, the 23 points ("Some Problems Now Raised in the Rural Socialist Education Movement"), is settled: the meeting a month, a turn and a return; the 10th plenum began the movement, ten points in May 1963, another in September; the second ten too long; no more "root-striking"; Liu''s summer speech sent the cadres to the villages. Not to make a great din; again that the movement is a contest of socialism and capitalism. The Central Committee issues the 23 points as [65] no. 26, replacing earlier documents where they conflict.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 14, 1965. Made public: 2013. See [[cal.1964-12-15.china-leadership]]. To check: the "23 points" (Central Committee, [65] no. 26, Jan. 14, 1965; named by [[w.zedong-mao-zedong-nianpu]], V, Jan. 14, 1965). Names: Mao Zedong, Liu Shaoqi.'
        tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-23.china-leadership
        when: Jan. 23–24
        date: '1965-01-23'
        thread: china-leadership
        also: [china]
        c: 'Mao presides in the afternoon over an enlarged Politburo Standing Committee and hears Yu Qiuli on revolutionizing planning and the long-term plan. To Yu and Gu Mu: the state''s business now to them; the old go as staff officers and advisers; the young are the capable. Dare to think and do, not to be rash: do away with superstition, not with science. Publish the 23 points as a placard; those who have erred and mended to be used. His writings "historical material"; only the "On Practice" has use. Not all of the Center''s policy is right: it went for "more, faster" and forgot "better, cheaper"; the 1,700 projects wrong. Third-front building: two possibilities, good and bad.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 23 and 24, 1965. Made public: 2013. Names: Mao Zedong, Yu Qiuli, Gu Mu.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01-29.china-leadership
        when: Jan. 29
        date: '1965-01-29'
        thread: china-leadership
        also: [soviet-union, vietnam-hanoi]
        c: Mao calls Liu Shaoqi, Zhou Enlai and Deng Xiaoping at 1 p.m., Juxiang Shuwu; at 3 p.m. Liu presides over a Politburo meeting at which Deng reports on a Cuban delegation's coming and Zhou on Kosygin's passage through Beijing on his way to Vietnam.
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 29, 1965. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kosygin.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:kosygin-aleksei, polity:prc, polity:cuba, polity:ussr, polity:drv, vis:only:prc]
  - add:
      entry:
        id: cal.1965-01.china-leadership
        when: Jan., late
        date: 1965-01
        thread: china-leadership
        also: [china]
        c: 'Mao approves the Military Commission''s report of Jan. 12 to abolish the system of military ranks: all ranks below general abolished, the marshals'' kept; decided at the Commission''s seventh enlarged office meeting and its 223rd, after the military regions, services and academies'' Party committees were consulted.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan., late, 1965 ("1月下旬"). Made public: 2013. To check: the report of Jan. 12, 1965 (named by [[w.zedong-mao-zedong-nianpu]], V, Jan., late, 1965). Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-02-03.china-leadership
        when: Feb. 3
        date: '1965-02-03'
        thread: china-leadership
        also: [china]
        c: 'Mao reads the Central Investigation Department''s report that Li Zongren means to return to China: "To Zhou Enlai: Li should be welcomed home; his letter to an American paper last year does not matter, no criticism, he has owned it himself."'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 3, 1965. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Zongren.'
        tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-04.china-leadership
        when: Mar. 4
        date: '1965-03-04'
        thread: china-leadership
        also: [south-asia]
        c: 'Mao, Hall of the People, Room 118, afternoon: receives President Ayub Khan of Pakistan; Liu Shaoqi, Zhou Enlai, Chen Yi present. Every country that wants revolution must guard against subversion, China too; the main thing is internal stability: unite the people behind you and nothing is to be feared. The Soviet Union fell to internal trouble: Khrushchev was removed by Russians, not by China or the U.S. China and Pakistan are friends and look after each other''s interests; neither means harm to the other.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 4, 1965. Made public: 2013. Names: Mao Zedong, Ayub Khan, Liu Shaoqi, Zhou Enlai, Chen Yi, Khrushchev.'
        tags: [name:mao-zedong, name:ayub-khan-mohammad, name:liu-shaoqi, name:zhou-enlai, name:chen-yi, name:khrushchev-nikita-s, polity:pakistan, polity:prc, vis:only:prc+pakistan]
  - add:
      entry:
        id: cal.1965-03-11.china-leadership
        when: Mar. 11
        date: '1965-03-11'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao presides over the Politburo Standing Committee, Fujian Hall, afternoon, revising the People''s Daily and Red Flag article on the Moscow splitting meeting (the CPSU''s "consultative meeting" of Mar. 1–5 and its communiqué of Mar. 10). Beforehand he had read it, changed "small meeting" in the title to "meeting", and added that the Soviet leaders took over slogans and the U.S. took over Khrushchev''s: peaceful coexistence, competition, transition, détente, disarmament, two powers ruling the world, joint aid to India, joint help to reactionaries, joint use of the UN, joint anti-China.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 11, 1965. Made public: 2013. The article public: People''s Daily and Red Flag, Mar. 23, 1965, as "Comment on the March Moscow Meeting" (Check the date). Names: Mao Zedong, Khrushchev.'
        tags: [name:mao-zedong, name:khrushchev-nikita-s, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-14.china-leadership
        when: Mar. 14
        date: '1965-03-14'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Hall of the People, Room 118, noon: receives Wilcox and Williams of the New Zealand Communist Party and Hill of the Australian (Marxist-Leninist) party, for their views on the article on the Moscow meeting. A defect: unity of the majority not prominent; not said that the Soviet people and 95 percent of Party members and cadres are to be united; a strategic matter. Asks their help to improve it.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 14, 1965. Made public: 2013. Names: Mao Zedong, Wilcox, Williams, Hill.'
        tags: [name:mao-zedong, polity:prc, polity:nz, polity:australia, vis:only:prc+nz+australia]
  - add:
      entry:
        id: cal.1965-03-17.china-leadership
        when: Mar. 17–19
        date: '1965-03-17'
        thread: china-leadership
        also: [soviet-union]
        c: 'Mao, Wuchang, East Lake guesthouse: discusses the article on the Moscow meeting with Deng Xiaoping, Peng Zhen, Kang Sheng (Mar. 17, 18); the tone not to change, the shrill words to; title changed to "Comment on the March Moscow Meeting", each of the four parts a headed section. Mar. 19: asks the foreign experts, Frank Coe, Sol Adler and Israel Epstein, whether to print it and how sharp: Adler would stress unity and the anti-imperialist, anti-U.S. camp; Mao: both worth noting.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 17–19, 1965. Made public: 2013. See [[cal.1965-03-11.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Kang Sheng, Frank Coe, Sol Adler, Israel Epstein.'
        tags: [name:mao-zedong, name:deng-xiaoping, name:peng-zhen, name:kang-sheng, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-22.china-leadership
        when: Mar. 22
        date: '1965-03-22'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Mao, Wuchang, East Lake guesthouse, afternoon: hears Zhou Enlai on the Standing Committee meeting of Mar. 21 (Xie Fuzhi, Yang Chengwu, Wang Renzhong present). Agrees with the Committee''s analysis of how Southeast Asia may develop and why the Workers'' Party Politburo is sending men. Mao: if there is to be fighting, better early, while "we are still alive" to finish it. Three matters for his decision: Chinese antiaircraft and railway divisions and radar regiments to Vietnam if asked; Vietnamese planes to use Chinese airfields if theirs are bombed, covered by Chinese aircraft; Chinese air support "Antung style" if asked. Mao: "probably all to be answered"; after all the statements that China cannot ignore an attack, it cannot leave a friend to die. An operations meeting Apr. 10; prepare for war this year, next, and the year after; a mobilization at home, a show of force to the enemy and an aid to Vietnam; begin inside the Party.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 22, 1965. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Xie Fuzhi, Yang Chengwu, Wang Renzhong.'
        tags: [name:mao-zedong, name:zhou-enlai, name:xie-fuzhi, polity:prc, polity:drv, vis:only:prc]
  - add:
      entry:
        id: cal.1965-03-24.china-leadership
        when: Mar. 24
        date: '1965-03-24'
        thread: china-leadership
        also: [middle-east]
        c: 'Mao, Wuchang, afternoon: receives Ahmad Shukairy, chairman of the Palestine Liberation Organization, and delegation; Zhang Tixue, Hu Yuzhi present. Gives the Chinese way of winning by arms: you fight yours, I mine; fight if you can win, else move. The visitors to speak in Shanghai and Hangzhou; China will print and broadcast the Palestinians'' cause.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 24, 1965. Reception reported by Xinhua (Check); the words made public: 2013. Names: Mao Zedong, Shukairy, Zhang Tixue, Hu Yuzhi.'
        tags: [name:mao-zedong, name:shukairy-ahmad, polity:prc]
  - add:
      entry:
        id: cal.1965-04-09.china-leadership
        when: Apr. 9
        date: '1965-04-09'
        thread: china-leadership
        also: [vietnam-air-war, vietnam]
        c: 'Mao, at noon, on the report brought by Yang Chengwu on Zhou Enlai''s instruction that American aircraft entered the air over Hainan on Apr. 8 and 9: the Standing Committee members in Beijing agree to strike hard. Mao: they should be hit; "yesterday was a probe, today another, now a real provocation"; send strong units, the Navy''s to Hainan, if not enough the Air Force''s; navy air and air force under one command.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 9, 1965. Made public: 2013. See [[cal.1965-04-09.vietnam]]. Names: Mao Zedong, Zhou Enlai, Yang Chengwu.'
        tags: [name:mao-zedong, name:zhou-enlai, polity:prc, polity:us, vis:only:prc]
  - add:
      entry:
        id: cal.1965-04-13.china-leadership
        when: Apr. 13
        date: '1965-04-13'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Mao reads and approves the Central Committee''s instruction on strengthening war preparation: the U.S. is widening the war in Vietnam and attacking the DRV, a menace to China; Party cadres from county committee up to prepare in mind and in work for the worst: American bombing of military sites, industrial bases, communications and big cities, even fighting on Chinese soil; for small, middling and large wars alike.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 13, 1965. Made public: 2013. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, polity:us, polity:drv, vis:only:prc]
  - add:
      entry:
        id: cal.1965-04-22.china-leadership
        when: Apr. 22
        date: '1965-04-22'
        thread: china-leadership
        also: [china, vietnam]
        c: 'Mao with Lin Biao: Lin reports on learning to swim and building works for war, and, with the war threat grown, asks that the daily work of the Military Commission be strengthened: Yang Chengwu to be deputy secretary general of the Commission and first deputy chief of the General Staff. Mao agrees.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 22, 1965. Made public: 2013. Names: Mao Zedong, Lin Biao, Yang Chengwu.'
        tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-04-22.china-leadership-2
        when: Apr. 22
        date: '1965-04-22'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Mao approves Luo Ruiqing''s report: three engineer units to go to Vietnam, as agreed by Chinese and Vietnamese leaders, to fortify the northeast islands, build and repair railways and build airfields. Mao: "Read; do it."'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 22, 1965. Made public: 2013. To check: Luo Ruiqing''s report (named by [[w.zedong-mao-zedong-nianpu]], V, Apr. 22, 1965). Names: Mao Zedong, Luo Ruiqing.'
        tags: [name:mao-zedong, name:luo-ruiqing, polity:prc, polity:drv, vis:only:prc]
  - add:
      entry:
        id: cal.1965-04-28.china-leadership
        when: Apr. 28–29
        date: '1965-04-28'
        thread: china-leadership
        also: [china, vietnam]
        c: 'Mao, Wuchang, hears He Long, Luo Ruiqing and Yang Chengwu on operational plans and on changing the army''s cap badges and collar tabs (Dong Biwu, Wang Renzhong present). The third front is all first line, deep country, to prepare against airborne landings: tunnels in hills, built-up hills on plains. Three lines of defense; no hasty deep entry as Chiang let Japan, or Stalin let Hitler; in the first stage hold where one must, in places let go, to draw the enemy in and destroy him; "you fight yours, I mine".'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 28 and 29, 1965. Made public: 2013. Names: Mao Zedong, He Long, Luo Ruiqing, Yang Chengwu, Dong Biwu, Wang Renzhong, Stalin.'
        tags: [name:mao-zedong, name:he-long, name:luo-ruiqing, name:dong-biwu, name:stalin-joseph, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-05-12.china-leadership
        when: May 12
        date: '1965-05-12'
        thread: china-leadership
        also: [latin-america-dominican-republic]
        c: 'Mao, "Statement Supporting the Dominican People''s Struggle against U.S. Armed Aggression": after the coup against Cabral''s regime, Johnson sent over 30,000 troops; the "freedom" the U.S. defends is that of killing other peoples with planes and guns. Zhou Enlai wired the draft on May 11 after a Beijing rally; Mao approved by telephone through his secretary.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, May 12, 1965. Published May 12, 1965. Names: Mao Zedong, Zhou Enlai, Johnson.'
        tags: [name:mao-zedong, name:zhou-enlai, name:johnson-lyndon-b, polity:dominican-republic, polity:prc, polity:us]
  - add:
      entry:
        id: cal.1965-05-16.china-leadership
        when: May 16
        date: '1965-05-16'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Mao, Changsha, receives Hồ Chí Minh, on leave in China; Tao Zhu present. The U.S. cannot defeat Vietnam, it fears it, Vietnam will beat it. Hồ asks China to build six roads from its border to the rear areas and the front; Mao: "At President Hồ''s order. We will undertake it." Hồ: after the French war the party in the hills went down to the plains and a pacifist mood arose; Mao: China made the same mistake, only now begun to correct.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, May 16, 1965. Made public: 2013. Names: Mao Zedong, Hồ Chí Minh, Tao Zhu.'
        tags: [name:mao-zedong, name:ho-chi-minh, name:tao-zhu, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-06-02.china-leadership
        when: June 2
        date: '1965-06-02'
        thread: china-leadership
        also: [vietnam, china]
        c: 'Mao reads the Academy of Sciences'' Institute of International Relations bulletin of May 3 arguing that the Johnson administration is preparing to widen the Vietnam war for a trial of strength with China; to Jiang Qing: an institute''s analysis, worth a look; maybe war at once, maybe not for one, two, three years; "but we put work on the footing of war at once", on which the Center has already decided.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 2, 1965. Made public: 2013. To check: the bulletin *Diguozhuyi dongxiang*, no. 15 (May 3, 1965; named by [[w.zedong-mao-zedong-nianpu]], V, June 2, 1965). Names: Mao Zedong, Jiang Qing, Johnson.'
        tags: [name:mao-zedong, name:jiang-qing, name:johnson-lyndon-b, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-13.china-leadership
        when: June 13
        date: '1965-06-13'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Mao, Hangzhou, Wang Zhuang, afternoon: receives Hồ Chí Minh again; Dong Biwu and Jiang Hua present. On Vietnam: "We are prepared; as the U.S. fights, so we." Johnson not shrewd, not logical, unpredictable. Of Confucius'' homeland (Hồ had visited Qufu): Confucius killed his opponent; Qin Shihuang the one who did something.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 13, 1965. Made public: 2013. Names: Mao Zedong, Hồ Chí Minh, Dong Biwu, Jiang Hua, Johnson.'
        tags: [name:mao-zedong, name:ho-chi-minh, name:dong-biwu, name:johnson-lyndon-b, polity:drv, polity:prc, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-06-16.china-leadership
        when: June 16
        date: '1965-06-16'
        thread: china-leadership
        also: [china]
        c: 'Mao, Hangzhou, Wang Zhuang: hears Yu Qiuli on the Third Five-Year Plan and Gu Mu on the third front; Zhou Enlai, Peng Zhen, Chen Yi, Li Xiannian, Bo Yibo, Luo Ruiqing, Jiang Hua present. Mao: too many projects, too much investment, the targets too high; fewer; food, clothing, use not to fall, rise a little yearly; farm investment (14 billion yuan) too much, learn from Dazhai; industry from Daqing. Putting defense first "has to go against the line a little"; the third front in two ways, success or not. Hurry slowly.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 16, 1965. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Peng Zhen, Chen Yi, Li Xiannian, Bo Yibo, Luo Ruiqing, Yu Qiuli, Gu Mu, Jiang Hua.'
        tags: [name:mao-zedong, name:zhou-enlai, name:peng-zhen, name:chen-yi, name:li-xiannian, name:bo-yibo, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-06-26.china-leadership
        when: June 26
        date: '1965-06-26'
        thread: china-leadership
        also: [china]
        c: 'Mao, to Wang Dongxing, on Yu Qiuli''s account at the 14th National Public Security Conference of Mao''s instructions on the Third Plan: "I pressed them again"; more than 100 billion yuan at a stroke will not do; transport, grain, steel, timber not equal to it, three southwest railways cannot be built at once, another reversal likely; not to turn the people upside down. Third front: factories that cannot move are not to be moved; two hands. Public security: arrest who should be arrested, don''t go to the other extreme.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, June 26, 1965. Made public: 2013. Names: Mao Zedong, Wang Dongxing, Yu Qiuli.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-04.china-leadership
        when: July 4
        date: '1965-07-04'
        thread: china-leadership
        also: [indonesia]
        c: 'Mao, Hall of the People, Room 118, afternoon: receives an Indonesian Communist Party delegation. China has classes and class struggle; new bourgeois grow among the powerful by embezzling and speculating, small capitalists in primitive accumulation; the struggle is by education, no arrest, no killing; those who err, mostly Party members, may mend; errors are a fortune, like an illness that leaves resistance.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 4, 1965. Made public: 2013. Names: Mao Zedong. Check: the delegation''s head (the nianpu names none).'
        tags: [name:mao-zedong, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1965-07-12.china-leadership
        when: July 12
        date: '1965-07-12'
        thread: china-leadership
        also: [china]
        c: 'Mao reads the Central Investigation Department''s request on Li Zongren''s return: whether he should issue a written statement on reaching the Beijing airport, or later. Zhou Enlai (July 9) agrees with the first plan (no statement on arrival). Mao to Zhou: the second plan better, a statement at once at the airport, the text agreed beforehand. July 15: Zhou to stay some days in Shanghai to agree the text with Li, fly back with him, and meet him at the airport.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 12, 1965. Made public: 2013. See [[cal.1965-02-03.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Li Zongren.'
        tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-16.china-leadership
        when: July 16
        date: '1965-07-16'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Mao, Hall of the People, Fujian Hall, afternoon: receives a Vietnamese National Assembly delegation under Hoàng Văn Hoan; Liu Shaoqi, Peng Zhen, Guo Moruo present. Of the war: eat American troops a mouthful at a time, division by division; China, with three armies, nine divisions, never matched one American division''s fire; a counter-revolution cannot meet a people''s war: it is blind, the people have eyes; but mobilization takes time. Geneva was not kept; the U.S. escalates and so will Vietnam. First politics with the military subordinate, then both, then the military first and politics guarding it.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 16, 1965. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Peng Zhen, Hoàng Văn Hoan, Guo Moruo.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:peng-zhen, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-07-25.china-leadership
        when: July 25
        date: '1965-07-25'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Mao reads Luo Ruiqing''s report of that day on sending antiaircraft divisions to Vietnam: two divisions to enter at Vietnam''s request on Aug. 1 by two routes; a 57mm regiment on the north line, to train both of China''s 57mm regiments in rotation. Mao: "Luo Ruiqing: read; do it."'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 25, 1965. Made public: 2013. To check: Luo Ruiqing''s report of July 25, 1965 (named by [[w.zedong-mao-zedong-nianpu]], V, July 25, 1965). Names: Mao Zedong, Luo Ruiqing.'
        tags: [name:mao-zedong, name:luo-ruiqing, polity:prc, polity:drv, vis:only:prc]
  - add:
      entry:
        id: cal.1965-07-27.china-leadership
        when: July 27
        date: '1965-07-27'
        thread: china-leadership
        also: [china]
        c: 'Mao, Zhongnanhai, noon: receives Li Zongren and his wife Guo Dejie, back from the United States; Peng Zhen, Guo Moruo, Xu Bing, Zhang Shizhao and Liu Zhongrong present. Welcome; the motherland stronger but not strong, another 20 or 30 years'' work; all who left are welcome home and will be treated with courtesy; Taiwan will come home, an irreversible tide.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, July 27, 1965. Reported by Xinhua (Check); the words made public: 2013. See [[cal.1965-07-12.china-leadership]]. Names: Mao Zedong, Peng Zhen, Zhou Enlai, Li Zongren, Guo Dejie, Guo Moruo, Xu Bing, Zhang Shizhao, Liu Zhongrong.'
        tags: [name:mao-zedong, name:peng-zhen, name:zhou-enlai, polity:prc, polity:roc]
  - add:
      entry:
        id: cal.1965-08-03.china-leadership
        when: Aug. 3
        date: '1965-08-03'
        thread: china-leadership
        also: [europe-and-the-alliance-france, china]
        c: 'Mao, Hall of the People, Room 118, afternoon: receives André Malraux, de Gaulle''s special envoy and minister of cultural affairs; Liu Shaoqi, Chen Yi present. Why peasants fought: ate the same food, dressed alike, land reform, democratic government, and victories; unite the national bourgeois and the intellectuals who did not flee to the enemy; united with Chiang for a time. China needs decades; also friends, like France, with diplomatic relations. Malraux: the Soviet leaders flee communism but do not know where to. Mao: they confuse the masses; China has two roads, Marxism-Leninism or the other.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 3, 1965. Made public: 2013. Names: Mao Zedong, Malraux, Liu Shaoqi, Chen Yi, de Gaulle.'
        tags: [name:mao-zedong, name:malraux-andre, name:liu-shaoqi, name:chen-yi, name:de-gaulle-charles, polity:prc, polity:fr, vis:only:prc+fr]
  - add:
      entry:
        id: cal.1965-08-05.china-leadership
        when: Aug. 5
        date: '1965-08-05'
        thread: china-leadership
        also: [indonesia]
        c: 'Mao, Hall of the People, Room 118, morning: receives an Indonesian Communist Party delegation under Aidit; Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Chen Yi, Kang Sheng present. On gods and the human model; read Feuerbach, Hegel, Kant. On himself: 70 or 80 percent of the work now done by Liu, Zhou, Deng; he has not attended a Politburo meeting for some years, Liu presides, Deng is general secretary, Zhou premier, and better than he; he has a little bureaucracy, needed. Wrote no military book before fighting; had read the *Three Kingdoms* not Sun Zi.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 5, 1965. Made public: 2013. Names: Mao Zedong, Aidit, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Chen Yi, Kang Sheng.'
        tags: [name:mao-zedong, name:aidit-dipa-nusantara, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:chen-yi, name:kang-sheng, polity:prc, polity:indonesia, vis:only:prc+indonesia]
  - add:
      entry:
        id: cal.1965-08-11.china-leadership
        when: Aug. 11
        date: '1965-08-11'
        thread: china-leadership
        also: [vietnam, china]
        c: 'Mao presides over the Politburo Standing Committee, morning and afternoon (the Secretariat joins in the afternoon): hears Luo Ruiqing on Lin Biao''s directions for carrying out the strategy of drawing the enemy in. Mao: let the enemy in; those who draw him in annihilate him, those who chase deep lose; the General Staff to study how to let him in; no early wins for him. Gain half a year to move supplies, give what cannot be moved to the people. Soviet revisionism may envelop China. If Beijing is taken, the leaders go elsewhere, scattered; if one dies, another remains; promote new cadres, exchange north and south, retire the old. Of Vietnam: the U.S. is going soft.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 11, 1965. Made public: 2013. Names: Mao Zedong, Luo Ruiqing, Lin Biao, Peng Zhen.'
        tags: [name:mao-zedong, name:luo-ruiqing, name:lin-biao, name:peng-zhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-15.china-leadership
        when: Sept. 15
        date: '1965-09-15'
        thread: china-leadership
        also: [china]
        c: 'Mao presides over the Politburo Standing Committee, Juxiang Shuwu, morning, on the coming Central Work Conference: five items. The 1966 plan, the long-term plan not settled; two grain and price policies (purchases fixed for two three-year periods, 20 billion yuan to adjust prices in the Third Plan); Party building (young members, the grass roots, younger cadres; a Party congress in two years, with a younger 40-odd-year-old group added to the Central Committee); the four-cleans; the situation, against revisionism, last.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 15, 1965. Made public: 2013. See [[cal.1965-09-03.china]]. Names: Mao Zedong.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-18.china-leadership
        when: Sept. 18
        date: '1965-09-18'
        thread: china-leadership
        also: [china]
        c: The Central Work Conference opens, Beijing (to Oct. 12); Mao attends the opening plenary in the Henan Hall, Liu Shaoqi presiding, Deng Xiaoping on the order of business, Yu Qiuli on the Third Plan and 1966. By the chronology's account of the whole conference, it approves the 1966 plan outline (agriculture first, a campaign to produce and save); the Third Plan's guiding idea of "defense first, the third front quickened, industry gradually redistributed"; fixed grain purchases for three years, "grain stored with the people"; 20 billion yuan to adjust prices over the plan; Party members to be recruited, with care, where the four-cleans are done.
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 18, 1965 (the session), and Sept. 18–Oct. 12, 1965 (the conference). Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Yu Qiuli.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-19.china-leadership
        when: Sept. 19
        date: '1965-09-19'
        thread: china-leadership
        also: [south-asia, india-and-china-kashmir]
        c: 'Mao revises the Foreign Ministry''s draft note to India of Sept. 19, 4 a.m., sent up by Zhou Enlai: the draft demands that India dismantle by midnight of the 19th the fortifications on the Chinese side of the Sikkim border and straddling it. Mao: one day is too hurried, India cannot do it, it would win no sympathy; make it two days, or three, the 21st. The note changes it to midnight of the 22nd, handed to the Indian embassy at 3:40 p.m.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 19, 1965. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: Sikkim: the nianpu says "the China-Sikkim boundary".'
        tags: [name:mao-zedong, name:zhou-enlai, polity:prc, polity:india, vis:only:prc]
  - add:
      entry:
        id: cal.1965-09-23.china-leadership
        when: Sept. 23
        date: '1965-09-23'
        thread: china-leadership
        also: [china]
        c: 'Mao, Yinian Tang, morning: talks five and a half hours with Peng Dehuai, with Liu Shaoqi, Deng Xiaoping, Peng Zhen joining. Peng writes after years; he asks to go to the countryside, not to the third front. Mao: the third front is now to be built, the southwest most investment; go to the southwest; "you may lead troops again, to recover your name"; "perhaps the truth is on your side"; Peng to be deputy to Li Jingquan in a general command post for third-front building, with Cheng Zihua. Liu and Deng to meet the southwest comrades. Lunch with Peng.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 23, 1965. Made public: 2013. Names: Mao Zedong, Peng Dehuai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Li Jingquan, Cheng Zihua. Check: the letter of Sept. 22 and the "three guarantees" at Lushan (the nianpu''s notes 71 and 72).'
        tags: [name:mao-zedong, name:peng-dehuai, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:li-jingquan, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-10-08.china-leadership
        when: Oct. 8
        date: '1965-10-08'
        thread: china-leadership
        also: [soviet-union, china]
        c: 'Mao, Yinian Tang: calls a meeting with the regional bureaus'' first secretaries. On class struggle: before the 10th plenum it was said there was none; not understood till 1964–65. The CPSU''s coming 23rd Congress: China will send none, only a message. To Peng Zhen: can Wu Han be criticized? Peng: yes. Mao: let those below do it.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 8, 1965. Made public: 2013. Names: Mao Zedong, Peng Zhen, Wu Han. Check: whether Wu Han''s criticism then meant the later *Hai Rui* piece (Nov. 10).'
        tags: [name:mao-zedong, name:peng-zhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-10-10.china-leadership
        when: Oct. 10
        date: '1965-10-10'
        thread: china-leadership
        also: [china]
        c: 'Mao, Yinian Tang: with the bureau first secretaries again, on war preparation. Talk of war every day and the enemy does not come? that would make us King You lighting the beacons; but he did call it; better a big and small third front. About three and a half years'' time, Yu Qiuli says five; a small steel works in each province. If the Center turns revisionist, rebel: small third fronts make that easier. Prepare for U.S. and revisionist attacks, and for revisionism and fascism inside, landlord restoration.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 10, 1965. Made public: 2013. Names: Mao Zedong, Yu Qiuli.'
        tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-10-12.china-leadership
        when: Oct. 12
        date: '1965-10-12'
        thread: china-leadership
        also: [china]
        c: Mao presides over the second plenary session of the Central Work Conference; Yu Qiuli, Li Xiannian, Peng Zhen, Zhu De, Zhou Enlai speak on the Third Plan, grain and trade, the Party, studying Mao's thought, the world situation; Mao interjects often. He backs provincial steel works of about 50,000 tons; no more rail; the Yidu mine to be opened; a Center gone revisionist, local officials not to follow, else "rebel"; the Party's fine young members; "we old men hold the helm, and you may be at ease."
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 12, 1965. Made public: 2013. Names: Mao Zedong, Li Xiannian, Peng Zhen, Zhu De, Zhou Enlai, Yu Qiuli.'
        tags: [name:mao-zedong, name:li-xiannian, name:peng-zhen, name:zhu-de, name:zhou-enlai, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-10-20.china-leadership
        when: Oct. 20
        date: '1965-10-20'
        thread: china-leadership
        also: [vietnam-hanoi, vietnam]
        c: 'Mao, Yinian Tang, afternoon: receives Phạm Văn Đồng leading a Party and government delegation; Zhou Enlai, Chen Yi, Luo Ruiqing present. The war goes well in South and North; the world is not at peace, not because Vietnamese or Chinese invaded America. Negotiate at the right time, but keep the pitch high; expect to be deceived. China will back it to the end. Faith in victory is made in fighting; the myth that the U.S. cannot be beaten must be broken.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 20, 1965. Made public: 2013. Names: Mao Zedong, Phạm Văn Đồng, Zhou Enlai, Chen Yi, Luo Ruiqing.'
        tags: [name:mao-zedong, name:pham-van-dong, name:zhou-enlai, name:chen-yi, name:luo-ruiqing, polity:prc, polity:drv, vis:only:prc+drv]
  - add:
      entry:
        id: cal.1965-11-10.china-leadership
        when: Nov. 10
        date: '1965-11-10'
        thread: china-leadership
        also: [india-and-china-cultural-revolution]
        c: 'Shanghai''s *Wenhui bao* prints Yao Wenyuan''s "On the New Historical Play *Hai Rui Dismissed from Office*": the play''s returning of land and redressing of wrongs tied to the "go-it-alone" and "reversal" winds of 1962; Wu Han charged with wanting to pull down the people''s communes and restore the landlords and rich peasants.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 10, 1965. Published: *Wenhui bao*, Nov. 10, 1965. Names: Yao Wenyuan, Wu Han.'
        tags: [name:yao-wenyuan, polity:prc]
  - add:
      entry:
        id: cal.1965-11-10.china-leadership-2
        when: Nov. 10
        date: '1965-11-10'
        thread: china-leadership
        also: [china]
        c: 'The Central Committee''s notice: Yang Shangkun relieved as director of its General Office and moved to be a secretary of the Guangdong provincial Party committee.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 10, 1965. Made public: 2013. Names: Yang Shangkun.'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-11-23.china-leadership
        when: Nov. 23
        date: '1965-11-23'
        thread: china-leadership
        also: [china, india-and-china-cultural-revolution]
        c: 'Mao, displeased that the Beijing papers did not reprint Yao Wenyuan''s article on *Hai Rui*, directs Shanghai to issue it as a pamphlet and take subscriptions across the country: "If they will not print it, you make a booklet."'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 23, 1965. Made public: 2013. See [[cal.1965-11-10.china-leadership]]. Names: Mao Zedong, Yao Wenyuan.'
        tags: [name:mao-zedong, name:yao-wenyuan, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-11-24.china-leadership
        when: Nov. 24
        date: '1965-11-24'
        thread: china-leadership
        also: [indonesia, vietnam]
        c: 'Mao, Shanghai, Jinjiang Hotel, afternoon: with Anna Louise Strong, on her 80th birthday, and with Frank Coe, Israel Epstein, Sidney Rittenberg, George Hatem and others; Jiang Qing, Liao Chengzhi, Wu Lengxi present. Strong sees the world changed since the U.S. bombing of North Vietnam in February and the Indonesian events of Sept. 30–Oct. 1. Mao: new things lately, American students demonstrating in crowds and the Indonesian right''s counter-revolutionary coup; seen in one moment, the sky looks black; with right policy and line the people wake and stand with us; no matter how many Khrushchevs or Indonesian rightists, the people''s tide cannot be turned, only delayed.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 24, 1965. Made public: 2013. Names: Mao Zedong, Jiang Qing, Liao Chengzhi, Wu Lengxi, Anna Louise Strong, George Hatem, Khrushchev, Frank Coe, Israel Epstein, Sidney Rittenberg.'
        tags: [name:mao-zedong, name:jiang-qing, name:khrushchev-nikita-s, polity:indonesia, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-11.china-leadership
        when: Nov., mid
        date: 1965-11
        thread: china-leadership
        also: [china, india-and-china-cultural-revolution]
        c: 'Mao reads the *Guangming ribao* editorial office''s digest no. 362 of Nov. 15 on its reporter''s visit to Wu Han on the 14th: Wu says he will not answer Yao Wenyuan, is writing a report to the municipal committee to go to Peng Zhen direct; farfetched, labels, who dares write or talk history? Mao: "I have read them all. A sleepless night. Send these to Jiang Qing, then to Hangzhou."'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Nov., mid, 1965 ("11月中旬"). Made public: 2013. To check: the digest of Nov. 15, 1965 (named by [[w.zedong-mao-zedong-nianpu]], V, Nov., mid, 1965). Names: Mao Zedong, Jiang Qing, Peng Zhen, Wu Han, Yao Wenyuan.'
        tags: [name:mao-zedong, name:jiang-qing, name:peng-zhen, name:yao-wenyuan, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-12-01.china-leadership
        when: Dec. 1
        date: '1965-12-01'
        thread: china-leadership
        also: [china]
        c: Lin Biao sends Ye Qun to Mao at Hangzhou with his letter of Nov. 30 and ten items of material against Luo Ruiqing.
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 1, 1965. Made public: 2013. Names: Lin Biao, Ye Qun, Luo Ruiqing, Mao Zedong.'
        tags: [name:lin-biao, name:ye-qun, name:luo-ruiqing, name:mao-zedong, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-12-08.china-leadership
        when: Dec. 8
        date: '1965-12-08'
        thread: china-leadership
        also: [china]
        c: 'Mao presides over an enlarged Politburo Standing Committee, Shanghai, opening Dec. 8 (to Dec. 15), on the "Luo Ruiqing question". Lin Biao, Ye Qun, Wu Faxian and Li Zuopeng charge Luo with opposing "putting politics first" and "usurping the army"; Ye Qun speaks three times, about ten hours, alleging Luo pressed Lin to give way. Five points fixed: the matter serious, the means vile; different from Peng and Huang; his record some achievement; "learn from the past" and "cure the sick"; the leadership partly to blame. Two steps, transfer, no face-to-face, cool handling. After it, Luo removed from his military posts, Yang Chengwu acting chief of staff.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 8, 1965 ("12月8日一15日"). Made public: 2013. Names: Mao Zedong, Lin Biao, Ye Qun, Wu Faxian, Li Zuopeng, Luo Ruiqing, Yang Chengwu.'
        tags: [name:mao-zedong, name:lin-biao, name:ye-qun, name:wu-faxian, name:li-zuopeng, name:luo-ruiqing, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-12-11.china-leadership
        when: Dec. 11
        date: '1965-12-11'
        thread: china-leadership
        also: [laos, vietnam]
        c: 'Mao, Shanghai, Hongqiao guesthouse, morning: receives a Lao People''s Party delegation. Win the masses; treat prisoners kindly, even officers, keep those who wish in the army, send the rest home; he may be captured again, release again. The South Vietnamese armed struggle has gone beyond what the Chinese did against the Japanese, to be learned from by Laos and Southeast Asian parties. Asia, Africa and Latin America are a furnace.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 11, 1965. Made public: 2013. Names: Mao Zedong. Check: the delegation''s head and which Lao party (the Chinese: the Lao People''s Party).'
        tags: [name:mao-zedong, polity:prc, polity:pathet-lao, vis:only:prc+pathet-lao]
  - add:
      entry:
        id: cal.1965-12-14.china-leadership
        when: Dec. 14
        date: '1965-12-14'
        thread: china-leadership
        also: [china]
        c: 'Mao talks with Liu Shaoqi, who proposes sending "On the Ten Great Relationships" to Party committees at county and regimental levels and up as an internal document; Mao agrees. Dec. 15: Liu writes with that proposal; Dec. 18 Mao: send to Deng Xiaoping and Peng Zhen to do as Liu suggests; "read it, not quite satisfied"; send down for comment toward later revision, and say so in the Center''s covering note.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 14, 1965. Made public: 2013. To check: "On the Ten Great Relationships" (named by [[w.zedong-mao-zedong-nianpu]], V, Dec. 14, 1965). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
        tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-12-21.china-leadership
        when: Dec. 21
        date: '1965-12-21'
        thread: china-leadership
        also: [china, india-and-china-cultural-revolution]
        c: 'Mao, Hangzhou, with Chen Boda, Hu Sheng, Tian Jiaying, Ai Siqi and Guan Feng on prefaces to Marx, Engels and Lenin''s classics, the "philosophy, hard to do". Of *Hai Rui*: Qi Benyu''s article good, read three times, fault no name; Yao Wenyuan''s good, named, shook drama, history and philosophy, but missed the point, the "dismissal": the Jiajing emperor dismissed Hai Rui, in 1959 we dismissed Peng Dehuai, who is a Hai Rui. Of the *Qing gong mishi* film: not patriotic, but national betrayal. One basic law only: contradiction.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 21, 1965. Made public: 2013. Names: Mao Zedong, Chen Boda, Peng Dehuai, Hu Sheng, Tian Jiaying, Ai Siqi, Guan Feng, Qi Benyu, Yao Wenyuan.'
        tags: [name:mao-zedong, name:chen-boda, name:peng-dehuai, name:yao-wenyuan, polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1965-12-22.china-leadership
        when: Dec. 22
        date: '1965-12-22'
        thread: china-leadership
        also: [china, india-and-china-cultural-revolution]
        c: 'Mao, Hangzhou, with Peng Zhen, Kang Sheng and Yang Chengwu: again that *Hai Rui*''s point is the dismissal and Peng Dehuai a Hai Rui. Peng Zhen: by inquiry Wu Han and Peng Dehuai have no organizational link. Dec. 23: with Peng Zhen alone. Mao: Wu Han''s question to be given a political conclusion in two months.'
        n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 22, 1965. Made public: 2013. Names: Mao Zedong, Peng Zhen, Kang Sheng, Peng Dehuai, Yang Chengwu, Wu Han.'
        tags: [name:mao-zedong, name:peng-zhen, name:kang-sheng, name:peng-dehuai, polity:prc, vis:only:prc]
