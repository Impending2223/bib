      c: Peking. The Politburo Standing Committee meets several times on the seventh commentary and makes many changes. The text is set in early February and retitled "The leaders of the CPSU are the greatest splitters of our times."
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 663 (after the Politburo''s comments in late January, "several" Standing Committee meetings, "final in early February"). Made public: 1999. See [[cal.1964-01.china-leadership-3]]. Check: the days; Wu gives none.'
