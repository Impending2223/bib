      id: cal.1964-02.china-leadership-4
      when: Feb., after the 9th
      date: 1964-02
      at: after 1964-02-09
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Hanoi. Vietnamese leaders brief the *Renmin ribao* delegation under Wu Lengxi: Nguyễn Duy Trinh on the economy, Nguyễn Chí Thanh on the countryside, Xuân Thủy on propaganda. Phạm Văn Đồng receives it.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 666 ("after we reached Hanoi"; no days; 阮维桢 (the image; the OCR''s 阮维核), 阮志清 and 春水). Made public: 1999. See [[cal.1964-02-09.china-leadership-2]]. Names: Nguyễn Duy Trinh, Nguyễn Chí Thanh, Xuân Thủy, Phạm Văn Đồng. Check: the days.'
      tags:
