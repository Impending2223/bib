      date: '1964-04-14'
      time: 1964-04-14T09:00Z
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Changsha: approves the first, longer draft of the telegram for Khrushchev''s 70th birthday, adds the last line, and meets with Deng Xiaoping, Kang Sheng, Tao Zhu, Wang Renzhong, Zhang Pinghua and Wu Lengxi at 5 p.m.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 13 and 14, 1964 (Apr. 14; 5 p.m.). [[w.lengxi-shinian-lunzhan-1956-1966]], 747–749, 752 (Mao chose the first, longer draft, putting "dear comrade" at its head and adding at its end that imperialism and reaction may tremble before the two peoples'' unity; the text settled at Changsha, "already Apr. 14", and sent to Peking for Liu Shaoqi and Zhou Enlai, who agreed; Mao''s markup of Apr. 14 shown at 749; through Deng he told Zhou that no anti-revisionist article be printed for a week after the telegram, 748). Made public: 1999. See [[cal.1964-04-13.china-leadership]], [[cal.1964-04-12.china-leadership-6]]. Names: Mao Zedong, Deng Xiaoping, Kang Sheng, Tao Zhu, Khrushchev, Wang Renzhong, Zhang Pinghua, Wu Lengxi. Check: Wu (747–748) has Mao''s meeting on the two drafts the afternoon after the morning''s redrafting, the 13th by his count, and the text settled "already Apr. 14".'
