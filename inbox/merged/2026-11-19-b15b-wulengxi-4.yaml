      when: Apr. 6
      date: '1964-04-06'
      thread: soviet-union
      also:
      - china-leadership
      c: Hungary, a factory meeting. Khrushchev says of the Chinese that they have no trousers and say one pair to a man is enough; in warm lands one pair may do, but in the north thicker clothes are needed.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 765 (Apr. 6; by Wu''s summary, as printed in the *Renmin ribao* of Apr. 28). To check: Khrushchev''s speech of Apr. 6, 1964 (the text). See [[cal.1964-04-05.soviet-union]]. Names: Khrushchev.'
