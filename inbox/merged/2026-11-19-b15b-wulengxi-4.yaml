      c: 'Changsha to Peking. Deng Xiaoping telephones Zhou Enlai with Mao''s remarks on the talks on Soviet trade: imports from the Soviet Union to be cut; China to pay its debt in its exports, and if the Soviets will not take them, to let the account stand.'
