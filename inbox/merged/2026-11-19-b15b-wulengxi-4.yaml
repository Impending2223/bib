    id: cal.1964-04-26.china-leadership
    base: ae5b5fab
    set:
      c: 'Zhou goes to Liu Shaoqi''s to settle the *People''s Daily* editor''s note to Suslov''s Feb. 14 report: it counts 140 or 150 places of distortion, calls the report false; all anti-China Soviet documents, past and later, to be answered in turn once the reply to the Soviet Central Committee''s open letter is done.'
- edit:
    id: cal.1964-04-30.china-leadership
    base: 2481790d
    set:
      c: 'Mao revises and approves the Central Committee''s letter to the CPSU Central Committee in reply to its letter of Mar. 7 (Kang Sheng and Wu Lengxi''s draft of Apr. 29): sends it to the Standing Committee. The CPSU has lost its way on the date of a meeting; most parties fear a splitting meeting. Mao adds four paragraphs: what talks and a meeting could do but quarrel; China is against a split; two-party talks should be put off to next May; no party may call a world conference against the rule of consultation.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 30, 1964. Made public: 1999. To check: the letter of May 7, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Apr. 30, 1964); the CPSU letter of Mar. 7. Names: Mao Zedong, Kang Sheng, Wu Lengxi.'
- cite:
    id: cal.1963-09-13.china-leadership
    units: A, B
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 645–646 (Mao made the most changes of the second commentary and wrote its opening himself: the Stalin question a world question, no verdict likely in this century)'
- cite:
    id: cal.1963-12-03.china-leadership
    units: A
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 655 (the CPSU letter of Nov. 29, its date and contents; Wu does not give its handing: it asks an end to the open polemic and a conference of the brother parties; it offers more trade and orders, complete sets of equipment, oil and mining equipment above all, experts if China wishes, a coordination of the new five-year plans, and talks on some stretches of the border; Wu: "the stick and the carrot")'
- cite:
    id: cal.1964-01.china-leadership
    units: A-F
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 657–662 (after New Year''s Day Mao called two Standing Committee meetings on the letter of Nov. 29; Mao''s four causes for it (Khrushchev fears the open polemic; the parties that followed him split or doubt him; the United States in transition after Kennedy''s death on Nov. 22; trouble at home, the virgin lands and the industrial and agricultural parties); the letter forced out of him, and two-faced, to shift to China the blame for a bad relation; the 22nd Congress his peak, since then downhill; the counter-offensive begun, six commentaries written and the seventh to tenth to come, "a ten-year plan", about one a month; no haste to reply, no halt to the polemic, no international meeting; the foreign, foreign-trade, finance-trade, culture-education and planning offices and the General Staff to study the letter''s questions, the writers its call to stop; Liu Shaoqi and others on what to say to parties that ask (the polemic not China''s doing; the right to reply; watch deeds; a fair agreement, the CPSU to admit its error and withdraw its texts); Liu: the left parties are in good heart, "pursue the weakened foe")'
- variant:
    id: cal.1964-01.china-leadership-2
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: the draft that went to the Politburo comrades in late January is the tenth; the Standing Committee then met several times and revised it again; the final text, early February, was the eighteenth
    at: '663'
- variant:
    id: cal.1964-02-10.soviet-union-leadership
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: the February plenum held Feb. 14 to 15 (763), its resolution adopted Feb. 15 (762); the Chinese reply of May 7, as Wu prints it, has the plenum's report and resolution Feb. 15 and 16 (772)
    at: 762, 763, 772
- cite:
    id: cal.1964-02-27.china-leadership
    units: B, D
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 670–675 (the first of three talks with Kim Il Sung, Feb. 27, the day before Wu and Deng returned from Vietnam; Mao put three proposals, talks again, a meeting of 17 parties, a world conference of 81 or 100-odd, the talks in October or September or August but not July; the CPSU plenum and its letter of Feb. 12; the Soviet ambassador to Pyongyang''s call on Kim before he left; Mao expects the CPSU to hold two hands, a "decisive rebuff" and Romania as mediator; the Korean side: Pak Kum-chol, Kim Chang-man and Pak Yong-guk; Wu was not at the talk and read the record)'
- check:
    id: cal.1964-02-27.china-leadership
    text: 'Check: Wu (671) has "most of the Standing Committee" at the three talks with Kim Il Sung, the Chinese side headed by Mao, Zhou Enlai being abroad; Deng Xiaoping was in Vietnam on Feb. 27.'
- cite:
    id: cal.1964-02-28.china-leadership
    units: A-E
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 675–677 (the evening of Feb. 28, the day Deng and Wu came back from Hanoi; Deng''s short account of the Vietnam talks, then the line for the Romanian delegation; the Standing Committee thinks it sent by Khrushchev and wanting to sound China out; Liu Shaoqi: Khrushchev bullies the weak and fears the strong; Mao sums up three points: no inch on the polemic, no articles criticizing Khrushchev while the talks last, the reply to the CPSU to go before the Romanians come, friendship with Romania)'
- cite:
    id: cal.1964-02-29.china-leadership
    units: A, B
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 677–681 (the second talk with Kim Il Sung, Feb. 29, in building 18 of Diaoyutai; present with Kim: Pak Kum-chol, Kim Chang-man, Pak Yong-guk and four others of the Korean Politburo; with Mao: Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng, Wu Xiuquan, Wu Lengxi and Yao Zhen; Deng on the Vietnam talks; Mao on the polemic, that China could not name the CPSU before its Open Letter of July 14 and now can; how to receive the Romanians; the reply to go before they arrive, the talks put to October, then September, then August and no earlier; the polemic paused while the Romanians are in Peking; Kim to stay to work on them while his delegation goes home)'
- cite:
    id: cal.1964-02-29.china-leadership-2
    units: B, C
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 681–687, 729 (the reply, "decided that evening" (681); five matters in Wu''s order: the border, aid, experts, trade, the open polemic; its four proposals (talks of the two parties and the others, a world conference prepared, Soviet–Chinese talks in Peking Oct. 10 to 15, 1964, a preparatory meeting of 17 parties); "signed Feb. 29, sent Mar. 1", not published, the Romanians coming in two days (687); received by the CPSU Mar. 1 (729); printed May 9 (774))'
- check:
    id: cal.1964-02-29.china-leadership-2
    text: 'Check: Wu (681) has the decision to send the reply taken the evening of Feb. 29, after the second talk with Kim Il Sung; he names no session of the Politburo.'
- cite:
    id: cal.1964-03-02.china-leadership
    units: A
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 688, 723 (the delegation left Bucharest Mar. 1 and reached Peking by way of Moscow on Mar. 2; Maurer, deputy head of the State Council, leading, Bodnăraș, Ceaușescu and Stoica, the prime minister, with him; the Chinese press held its polemic from that day to the evening of Mar. 12)'
- cite:
    id: cal.1964-03-05.china-leadership
    units: B-G
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 695–697 (the evening of Mar. 5 ("toward evening"), Mao and others at building 18 of Diaoyutai with Kim Il Sung; Liu Shaoqi came after the afternoon talk; Kim on his talk with the Romanians the day before: their quarrel with Khrushchev about his interference and pressure, not theory, and their fear of a split; they said they would go on to Korea and Vietnam; Mao: Romania is changed from before, but is bound to the USSR by 40 percent of its trade; Kim: they want a middle force; Liu: Ceaușescu spoke three hours, asking the stop before the October talks and a joint appeal of the two parties and Romania, China to speak first; Deng: "now the real exchange begins"; the talk went on at dinner, and the evening was Kim''s farewell)'
- cite:
    id: cal.1964-03-06.china-leadership
    units: A
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 704 (the Standing Committee at Mao''s on the evening of Mar. 6, before the fifth talk: Liu Shaoqi and Deng Xiaoping agreed on the line; Mao had read the records; no capital for the Romanians, the right to answer every party kept, their request that China stop first unjust; the Romanian party close to Khrushchev in thought, though at odds with his great-power chauvinism)'
- cite:
    id: cal.1964-03-09.china-leadership
    units: A, B
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 709 (the evening of Mar. 9, the Standing Committee at Mao''s home: Peng Zhen reports Ceaușescu''s wish to meet again and extend the pause; agreed, for courtesy, one more talk, with the condition that all parties that attacked China admit it in public; the Romanians told that the articles resume when they leave; the eighth and ninth commentaries not ready, so on their departure the left parties'' pieces to be printed and the three revised)'
- cite:
    id: cal.1964-03-10.china-leadership
    units: A-D, F, G
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 712–723 (Mao received the delegation in the Old Peking Hall (老北京厅) of the Great Hall from 5:30 p.m. until past 7, with Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng, Wu Xiuquan and Wu Lengxi; Mao: the polemic is a war of pens, no one dies, the sky does not fall, the grass grows, the fish swim, women bear children; China will answer every article of the 2,000-odd and every resolution, about ten years; the quarrel began in 1958 over the joint fleet and in 1960 at Bucharest; "two fortresses neither taken"; a dinner, toasts to Gheorghiu-Dej and to Mao, "a meeting of unity")'
- cite:
    id: cal.1964-03-16.china-leadership
    units: B-H
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 727–733 (the Standing Committee Mar. 16, the Chinese side with Peng Zhen and Chen Yi attending besides the members; Zhou Enlai, back from 14 countries on Mar. 15, reports first on Africa; Mao raises the CPSU letter of Mar. 7: answer it briefly; the CPSU has not printed its plenum documents or given its letter; the talks to May of next year, the preparatory meeting for the autumn after, the world conference the year after; "the more he hurries, the slower we walk"; the letters may be published; the commentaries go on to the tenth, then theory (modern revisionism and social democracy, internationalism and nationalism) and the international organizations'' two lines; the analysis of the letter as pressure, a pretext for a split and a diversion from Khrushchev''s troubles at home)'
- variant:
    id: cal.1964-03-16.china-leadership
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: the Standing Committee met in the west hall of the Yinian Tang (颐年堂西厅) on Mar. 16
    at: '727'
- cite:
    id: cal.1964-03-18.china-leadership
    units: B-E
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 733–734 (the Standing Committee at Mao''s home the day after the Mar. 16 meeting, on the Central Work Conference and the third-line construction; Mao: for a year his main energy has gone to the struggle with Khrushchev, now back to domestic questions; the telegram for Khrushchev''s seventieth birthday, with matter in it, in the opposite posture, he for a split and China for unity, so that China is in the initiative and may attack or fall back; Gomułka''s letter of mid-March to be answered)'
- variant:
    id: cal.1964-03-18.china-leadership
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: the Standing Committee met at Mao's home on Mar. 17, the day after the Mar. 16 meeting
    at: '733'
- cite:
    id: cal.1964-03-26.china-leadership
    units: A
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 734, 739 (the Standing Committee at Mao''s home Mar. 26, the first of two meetings on Mar. 26 and 27, on the struggle with Khrushchev and the Central Work Conference)'
- cite:
    id: cal.1964-04-13.china-leadership
    units: B-E
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 745–747 (Mao''s meeting at Changsha the afternoon of Apr. 12, as soon as lunch was over, with Deng Xiaoping, Kang Sheng and Wu Lengxi, Wang Renzhong and Zhang Pinghua present; the telegram to be printable in the Soviet Union, a "united-and-struggling" move: "dear comrade", and that in any trouble, "to be felt, not said", the two parties would stand together; Khrushchev not the most rightist of the Soviet leaders; the plenum documents "strong in form, base in content", to be printed in the central papers in full; the reply held for rewriting, and then the whole exchange of letters to be published; the ninth and tenth commentaries to be pressed; Mao''s further views on a Soviet-called conference and on preparing a draft programme to meet theirs)'
- variant:
    id: cal.1964-04-13.china-leadership
    unit: A
    witness: w.lengxi-shinian-lunzhan-1956-1966
    reads: Mao calls Deng Xiaoping, Kang Sheng and Wu Lengxi on the telegram the afternoon of Apr. 12, the day they reach Changsha, as soon as lunch is over
    at: 744–745
- cite:
    id: cal.1964-04-16.china-leadership
    units: A-C
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 752–754 (the telegram''s text, dated Apr. 16 over the names of Mao Zedong, Liu Shaoqi, Zhu De and Zhou Enlai; sent in plain code in the small hours of the 16th)'
- cite:
    id: cal.1964-04-26.china-leadership
    units: B
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 768–769 (the editors'' note: every anti-Chinese text the CPSU has issued, before or since, to be answered in turn after the Open Letter is answered; Wu says the note was written after the group returned to Peking, revised by Liu Shaoqi and sent to Mao at Hangzhou)'
- cite:
    id: cal.1964-04-30.china-leadership
    units: B-D
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 770–771 (Mao, back in Peking "on the eve of May Day", at a meeting at his home Apr. 30 on the revision: the CPSU''s baton no longer works; the Italian, Polish, Swedish and Norwegian parties do not want a meeting, fewer than ten are for it; the conference to be opposed outright, no 17-party committee and no conference without Soviet–Chinese talks and agreement; the preparation to be put at four or five years or more, not two or three; a passage added asking what talks and a conference could be but a quarrel or a split, "do you want to split today?")'
- cite:
    id: cal.1964-03-15.china-leadership
    units: A
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 727 (Zhou Enlai back in Peking on Mar. 15 from the 14-country tour of four months, Chen Yi with him)'
- check:
    id: cal.1964-03-26.china-leadership
    text: 'Check: Wu (734, 739) has the meeting at Mao''s home a Standing Committee, the first of two on Mar. 26 and 27, on the struggle with Khrushchev and the Central Work Conference; he does not name the African trip.'
- check:
    id: cal.1964-04-30.china-leadership
    text: 'Check: Wu (770) has Mao, back in Peking "on the eve of May Day", hold a meeting at his home on Apr. 30 on the revision of the reply, and add two passages to it, not four.'
