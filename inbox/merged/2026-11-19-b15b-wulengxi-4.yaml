      c: 'Peking, morning. Wu Lengxi, the news of the CPSU''s publication just in, reports to Liu Shaoqi, who directs the Standing Committee''s work in Mao''s absence. Liu: the reply to the CPSU letter of Mar. 7, settled and passed by Mao at Wuhan, is to be held back, neither handed over nor printed yet; Mao is to be asked.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 740–741 (Apr. 3, the news "in the morning"; Liu: the reply to be revised in the light of the new situation). Made public: 1999. See [[cal.1964-04-03.soviet-union]], [[cal.1964-04.china-leadership-2]]. Names: Liu Shaoqi, Mao Zedong.'
