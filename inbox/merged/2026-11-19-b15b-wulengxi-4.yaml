- add:
    entry:
      id: cal.1964-03-13.china-leadership
      when: Mar. 13
      date: '1964-03-13'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The *Renmin ribao* resumes its polemic the day after the Romanians leave, printing statements, resolutions, speeches and articles of left parties against the CPSU: Albania, Vietnam, Indonesia, Japan, New Zealand, North Korea, the Belgian communists and the Marxist–Leninist party of Australia. The seventh commentary is rebroadcast. The writers press on with the eighth and begin the ninth. The Chinese press had held its polemic from the Romanians'' arrival on Mar. 2 to the evening of Mar. 12.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 723–724 (the pause "from Mar. 2 to the evening of Mar. 12"; the resumption Mar. 13; the left parties named). To check: the *Renmin ribao*, Mar. 13, 1964 (the texts). See [[cal.1964-03-12.china-leadership]], [[cal.1964-02-04.china-leadership-4]].'
      tags:
      - polity:prc
      src:
        c: 19c204af
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 723–724: all'
- add:
    entry:
      id: cal.1964-03-27.china-leadership-3
      when: Mar. 27
      date: '1964-03-27'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao's home. Mao presides at the Standing Committee, the second day running (the first, Mar. 26), on the struggle with Khrushchev and the Central Work Conference; Wu gives the two days' matters together. Mao's line is to drag out the break, and to prepare for it. The reply to the CPSU letter of Mar. 7, drafted, is to say that Soviet–Chinese talks cannot be this May, and October is too early, and that they should be in the first half of 1965, May say, and put off again if either side finds the time not ripe; that the preparatory meeting is of 17 parties, not the 26 of 1960; that the world conference is not to be dated, perhaps three years off; and that each side should print the other's criticisms, the demand pressed without end. The eighth commentary is read and needs only wording, to appear at the month's end. If the CPSU prints its plenum documents and begins a campaign, China will print the two parties' letters of recent months and ask the CPSU to do the same. The telegram to Khrushchev for his seventieth birthday to be drafted in Peking, sent when Mao has seen it, in four names. Mao allows that Khrushchev may be put out by a palace coup and a worse man come, so the telegram is friendly; he likens Khrushchev to Marshal Hong of the *Water Margin*, who let out the 108 demons, the Chinese leaders being the demons.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 734–739 (the two Standing Committee meetings at Mao''s home "on Mar. 26 and 27", "two days running"; the matters given together, not by day). Made public: 1999. See [[cal.1964-03-26.china-leadership]]. Names: Mao Zedong, Khrushchev. Check: which day each matter was raised.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: '24523892'
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 734–739: all'
