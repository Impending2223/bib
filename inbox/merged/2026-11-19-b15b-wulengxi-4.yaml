      c: 'Peking, afternoon. Fourth talk with the Romanians. Bodnăraș explains Romania''s relations with Yugoslavia since 1948, tied to the Soviet attitude, Khrushchev wishing to control the Balkans. Deng Xiaoping: the Moscow Statement of 1960 judged Yugoslavia, China holds the judgment, and Khrushchev signed it and dropped it that evening. Liu Shaoqi, answering remarks Bodnăraș and Ceaușescu had made at the coffee break: Stalin had faults but his merit was greater, and he admitted his error toward China; Khrushchev cannot admit any, so he cannot be got to correct his; Khrushchev called the partial test-ban treaty a swindle sixty days before he signed it. Liu''s answer to Ceaușescu of Mar. 5 is left for want of time.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 697–699 (Mar. 6 afternoon; the Romanians'' words "said not in the talks but at the coffee break", yet "a serious matter", which Deng and Liu answered gravely). Made public: 1999. See [[cal.1964-03-05.china-leadership-3]]. Names: Bodnăraș, Deng Xiaoping, Liu Shaoqi, Khrushchev, Ceaușescu.'
      tags:
      - polity:prc
      - polity:romania
      - vis:only:prc+romania
      - name:bodnaras-emil
      - name:deng-xiaoping
      - name:liu-shaoqi
      - name:khrushchev-nikita-s
      - name:ceausescu-nicolae
      src:
