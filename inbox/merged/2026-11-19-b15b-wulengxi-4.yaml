- add:
    entry:
      id: cal.1964-04-27.china-leadership-4
      when: Apr. 27
      date: '1964-04-27'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The *Renmin ribao* begins to print the CPSU''s three documents of Apr. 3: Suslov''s report of 80,000 characters, in five pages, the plenum''s resolution, and the *Pravda* editorial. An editors'' note says the CPSU leaders shout for a stop while setting up a campaign; counts 140 or 150 places of distortion; says China will print every anti-Chinese word of theirs and asks whether they dare print China''s eight commentaries; and that each text will be answered once the Open Letter is. It names Mao as the leaders'' chief target, "ants shaking a tree". Provincial papers print summaries, and Xinhua broadcasts in many languages.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 754, 767–769 (Apr. 27; the editors'' note, "written on Mao''s opinion"; the plan for the provincial papers and for broadcasts). To check: the *Renmin ribao*, Apr. 27, 1964 (the three texts and the note). See [[cal.1964-04-26.china-leadership-3]], [[cal.1964-04-03.soviet-union]]. Names: Suslov, Mao Zedong.'
