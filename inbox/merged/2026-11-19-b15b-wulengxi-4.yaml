      c: 'Peking, afternoon. Liu Shaoqi telephones Deng Xiaoping: Mao agrees that the reply to the CPSU letter of Mar. 7 not go yet; it is to be revised, after a wait to see the CPSU''s next moves. Deng tells the writers.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 741 ("that afternoon"). Made public: 1999. See [[cal.1964-04-03.china-leadership]]. Names: Liu Shaoqi, Deng Xiaoping, Mao Zedong.'
