patch: 2026-11-19-b15b-wulengxi-4
by: 'Claude (batch 15, second wave: Wu Lengxi, Shinian lunzhan, run 4, pp. 631-776), Nov. 19, 2026; audited Nov. 19, 2026 (Opus)'
ops:
- add:
    entry:
      id: cal.1963.china-leadership-3
      when: 1963, after Oct. 22
      date: '1963'
      thread: china-leadership
      also:
      - korea-leadership
      at: after 1963-10-22
      c: 'Wu Lengxi, at the invitation of the *Rodong Sinmun*, takes the *Renmin ribao* delegation to North Korea for a week: Pyongyang, Kaesong, Hamhung. Recalled early by a cable from Peking, he goes back to Pyongyang, where Kim Il Sung receives the delegation. Kim says he reads the *Renmin ribao* nearly every day and likes the commentaries on the CPSU letter, the first and second very much. The delegation''s other members stay on.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 653–654 (after the fourth commentary of Oct. 22 and before the fifth of Nov. 19; "a week", Pyongyang, Kaesong, Hamhung (the OCR''s 威兴, the book''s Hamhung); Kim''s words). Made public: 1999. See [[cal.1963-10-19.china-leadership]]. Names: Kim Il Sung. Check: the days, which Wu does not give, and whether the visit was reported at the time.'
      tags:
      - polity:prc
      - name:kim-il-sung
      - vis:only:prc+dprk
      - polity:dprk
      src:
        c: 1c3794bc
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 653–654: all'
- add:
    entry:
      id: cal.1963-07.china-leadership
      when: July, after the 21st
      date: 1963-07
      thread: china-leadership
      also:
      - soviet-union
      at: after 1963-07-21
      c: 'Peking. Back from Moscow, the drafting group studies the CPSU Open Letter, lists its arguments by class, and sets some dozen titles for replies: the origin of the differences, Stalin, Yugoslavia, war and peace, the national independence movement, the strategy and tactics of the workers'' movements, the general line of peaceful coexistence, relations among socialist states, Sino-Soviet relations, splitting, the defense of unity, the international mass organizations. Wu Lengxi, Qiao Guanhua, Yao Zhen, Fan Ruoyu and Wang Li lead the drafting, each with one or two helpers; Xiong Fu and Hu Sheng are ill. Each takes one or two titles, the Propaganda and International Liaison Departments take some, and the drafts go to the Center as they are done.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 637–639 ("after returning from Moscow"; the list of titles; the five leaders, the illness of two; the procedure: Deng Xiaoping presides at the group''s discussion, then Mao, Liu Shaoqi and Zhou Enlai read the draft, then the Standing Committee and the Politburo under Mao; all nine pieces passed by the Standing Committee and fixed by Mao, 639). Made public: 1999. See [[cal.1963-07-23.china-leadership]]. Names: Qiao Guanhua, Deng Xiaoping, Mao Zedong, Liu Shaoqi, Zhou Enlai. Check: the days, which Wu does not give; the OCR''s 能复 and 胡强 are 熊复 and 胡绳 by the image (p. 637).'
      tags:
      - polity:prc
      - name:qiao-guanhua
      - name:deng-xiaoping
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - vis:only:prc
      src:
        c: 988600a6
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 637–639: all'
- add:
    entry:
      id: cal.1963-08.china-leadership
      when: Aug., early
      date: 1963-08
      thread: china-leadership
      also:
      - soviet-union
      at: before 1963-08-01
      c: 'Mao presides at the Standing Committee on how to answer the CPSU Open Letter. His five points: the Letter names China, so China names the CPSU; go after the Letter and the Soviet leaders, leave other parties'' attacks for now; aim at Khrushchev, the first to speak and the worst; first print the Soviet leaders'' anti-Chinese words, his last two speeches above all; the replies to argue and to mock, firm and soft together. Other members: follow the Letter''s questions without being led by it; the first reply on the origin of the differences, the second on Stalin, war and peace, peaceful coexistence and peaceful transition each its own. Mao and Liu Shaoqi: the writers to list the Soviet arguments, quote the classics exactly, and finish soon but not carelessly.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 638–639 (the Standing Committee "in early August" (8月初); the five points in Wu''s numbering; "the wolf is in the road, do not ask the fox"; Mao and Liu on the writers'' work: "better, then faster"). Made public: 1999. See [[cal.1963-07-23.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Khrushchev. Check: the day within early August, and the place; Wu gives neither.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: e5e2c6ba
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 638–639: all'
- add:
    entry:
      id: cal.1963-09-06.china-leadership-5
      when: Sept. 6
      date: '1963-09-06'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The editorial departments of the *Renmin ribao* and *Hongqi* print the first commentary on the CPSU Open Letter, "The origin and development of the differences between the leadership of the CPSU and ourselves." It puts the parting at the Twentieth Congress, not in 1960 as the Letter has it. On Mao''s wish it makes public for the first time the Soviet proposal of 1958 for a joint fleet and the Soviet tearing up in June 1959 of the agreement to give China an atomic bomb sample and its technical data. Three annexes go with it: the Chinese outline on peaceful transition of Jan. 10, 1957, the delegation''s statement at Bucharest of June 26, 1960, and the five proposals of the Reply of Sept. 10, 1960.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 639–645 (Sept. 6; built on Deng Xiaoping''s first speech at the Moscow talks, which the leaders had approved before the delegation left, filled out and revised after its return; the editorial departments'' name, in use since 1956; the review of each piece by the writers'' group, Mao and the Standing Committee, 638–639; Mao''s wish for the disclosures, 643; the three annexes, 645). To check: the commentary, *Renmin ribao*, Sept. 6, 1963 (the text). See [[cal.1963-09.china-leadership]]. Names: Deng Xiaoping, Mao Zedong.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:mao-zedong
      src:
        c: ff686ff7
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 639–645: all'
- add:
    entry:
      id: cal.1963-09-13.china-leadership-3
      when: Sept. 13
      date: '1963-09-13'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* and *Hongqi* print the second commentary on the CPSU Open Letter, "On the question of Stalin." Built on a speech of the delegation at the Moscow talks in July, it weighs Stalin's merits and faults, the merits the greater, and says China defends Stalin against Khrushchev's wholesale negation, quoting Khrushchev's own past praise of him.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 645–650 (Sept. 13; the faults weighed on the views of Mao and Zhou Enlai, some of principle, some in the work; China''s defense of Stalin said plainly on Deng Xiaoping''s view). To check: the commentary, *Renmin ribao*, Sept. 13, 1963 (the text). See [[cal.1963-09-06.china-leadership-5]], [[cal.1963-09-13.china-leadership]]. Names: Khrushchev.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      src:
        c: 1ba314f8
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 645–650: all'
- add:
    entry:
      id: cal.1963-09-26.china-leadership-4
      when: Sept. 26
      date: '1963-09-26'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* and *Hongqi* print the third commentary, "Is Yugoslavia a socialist country?" It says Yugoslavia's leaders, having taken part in the Moscow meeting of 1957, then issued a programme against its Declaration; and that Khrushchev takes Yugoslavia as the model for his own revisionist line.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 650–651 (Sept. 26; Wu''s later view that its analysis of the Yugoslav facts was inaccurate and some of its wording went too far, while its points on the nature of the state and on "peaceful evolution" kept their worth). To check: the commentary, *Renmin ribao*, Sept. 26, 1963 (the text). Names: Khrushchev.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      src:
        c: 9a33baa1
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 650–651: all'
- add:
    entry:
      id: cal.1963-10-22.china-leadership-2
      when: Oct. 22
      date: '1963-10-22'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* and *Hongqi* print the fourth commentary, "Apologists of neo-colonialism," after a halt of four weeks over National Day. It rejects the four "prescriptions" of the CPSU leaders for the oppressed nations (peaceful coexistence and competition; Soviet–American aid; the savings of disarmament; the United Nations) and charges Khrushchev with the "yellow peril."
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 651–653 (Oct. 22; the Central Committee had stopped the articles over National Day, while a Soviet delegation under Grishin was in China; the "yellow peril", Khrushchev to Adenauer in 1954). To check: the commentary, *Renmin ribao*, Oct. 22, 1963, and *Hongqi* 1963 no. 20. See [[cal.1963-10-19.china-leadership]]. Names: Khrushchev.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      src:
        c: 10abe981
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 651–653: all'
