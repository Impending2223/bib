      c: Changsha. The evening of Apr. 12 and the morning of the 13th, Wu Lengxi redrafts the telegram to Khrushchev from Mao's four points, then Deng Xiaoping, Wang Renzhong, Zhang Pinghua and Kang Sheng discuss and amend it. Some want it fuller, some two plain paragraphs; Deng has Wu make a long and a short draft for discussion in the afternoon and then for Mao.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 747 ("that evening and the next morning"; the two drafts). The time is the first day''s. Made public: 1999. See [[cal.1964-04-12.china-leadership-4]]. Names: Deng Xiaoping, Kang Sheng, Mao Zedong. Check: the Mao chronology dates Mao''s call on them Apr. 13 and his approval Apr. 14.'
