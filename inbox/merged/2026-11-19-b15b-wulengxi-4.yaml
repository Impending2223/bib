      when: Mar. 31
      date: '1964-03-31'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* and *Hongqi* print the eighth commentary, "Proletarian revolution and Khrushchev's revisionism." It argues the principles of proletarian revolution against the parliamentary road and peaceful transition, sets Khrushchev in the line of Kautsky and Browder, and ends, on Mao's lines, with the sunk ship passed by a thousand sails.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 22, 1964 (published Mar. 31 in the People''s Daily and Red Flag, no. 6). [[w.lengxi-shinian-lunzhan-1956-1966]], 739–740 (Mar. 31, "a few days" after Mao left; the closing lines added on his instruction). To check: the commentary, *Renmin ribao*, Mar. 31, 1964 (the text). See [[cal.1964-03.china-leadership-3]]. Names: Khrushchev, Mao Zedong.'
      tags:
      - polity:prc
