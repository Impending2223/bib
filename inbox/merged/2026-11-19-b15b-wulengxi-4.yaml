- add:
    entry:
      id: cal.1964-05-03.china-leadership-2
      when: May 3
      date: '1964-05-03'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. Mao calls the Standing Committee after May Day and makes further changes to the reply to the CPSU: the passage that a conference called by one side is illegal is too weak, and he strengthens it. A man like Khrushchev must be told the harm again and again. He writes in two sentences: a world conference called against the rule of consultation is illegal, wholly wrong and of grave results; and "do you want to take such a dead-end road?" The reply is to go exactly two months after the CPSU''s letter: handed May 7, broadcast the evening of May 8, printed May 9.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 771 (May 3, "after May Day"; Mao''s two hand-written sentences; the schedule). Made public: 1999. See [[cal.1964-04-30.china-leadership]]. Names: Mao Zedong, Khrushchev.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: 3b36de8d
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 771: all'
- add:
    entry:
      id: cal.1964-05-07.china-leadership-2
      when: May 7
      date: '1964-05-07'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Chinese Central Committee gives the CPSU its reply to the letter of Mar. 7. A stop to the open polemic needs agreement: China has not finished answering the Open Letter of July 14, and has not begun on the two thousand texts since; the CPSU''s plenum, Feb. 15 and 16 by this letter, made its "decisive rebuff" three weeks before its call for a stop. The Soviet–Chinese talks, the CPSU''s May and China''s October, are both too early: best in the first half of 1965, to be put off again if either side finds it not ripe. A preparatory meeting of 17, not 26, parties; the world conference, not this autumn. No party may call it against the rule of consultation, and one that did would bear the blame for a split. Preparation may take four or five years or longer. The Chinese letters since Nov. 1963 and the CPSU''s are to be printed in full, and the CPSU asked to do the same.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 772–774 (May 7; the reply''s points in Wu''s order; the call to print the letters, and the six others with it). Made public: the *Renmin ribao*, May 9, 1964 (774–775). See [[cal.1964-05-03.china-leadership-2]], [[cal.1964-03-07.soviet-union]]. Check: the plenum days (Feb. 15 and 16 here, Feb. 14 to 15 at 763 in Wu); the hour and the person who handed it.'
      tags:
      - polity:prc
      - polity:ussr
      - vis:only:prc+ussr
      src:
        c: d1b7d4ed
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 772–774: all'
