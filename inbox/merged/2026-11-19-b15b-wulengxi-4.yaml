- add:
    entry:
      id: cal.1963-11-19.china-leadership
      when: Nov. 19
      date: '1963-11-19'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* and *Hongqi* print the fifth commentary, "The two lines on the question of war and peace." It sets Khrushchev in the line of the Second International, of Bernstein and Kautsky; lists the American arms drive against the Soviet Union; and calls his "nuclear fetishism and nuclear blackmail" the ground of modern revisionism on war and peace.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 14, 1963 (printed Nov. 19). [[w.lengxi-shinian-lunzhan-1956-1966]], 653–655 (Nov. 19; before Wu left for Korea, Mao asked that the article carry new matter, the false peace and real arms drive of the United States and the Soviet Union, the American above all, and China''s own peace diplomacy (the Korean armistice talks, Geneva in 1954, the Warsaw talks), not Khrushchev''s Caribbean course, "adventurism, then capitulation"; Qiao Guanhua, deputy head of the drafting group since the July talks, finished the revision; Khrushchev''s two speeches of late October and early November, attacking China and asking an end to the polemic, the Central Committee judged insincere and decided to ignore). To check: the commentary, *Renmin ribao*, Nov. 19, 1963, and *Hongqi* 1963 no. 22. See [[cal.1963-11-18.china-leadership-4]]. Names: Khrushchev.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      src:
        c: e03fddf3
        rows:
        - 'w.zedong-mao-zedong-nianpu V, Nov. 14, 1963: B'
        - 'w.lengxi-shinian-lunzhan-1956-1966 653–655: all'
- add:
    entry:
      id: cal.1963-12.china-leadership-2
      when: Dec., early
      date: 1963-12
      thread: china-leadership
      also:
      - soviet-union
      at: before 1963-12-01
      c: 'Mao presides at the Standing Committee on the CPSU letter of Nov. 29. China is in no haste to answer, the Open Letter of July 14, the Soviet articles and the resolutions of 42 parties being still unanswered; the writing goes on. The letter''s offers: trade is business; the five-year plan, likewise; the border, they wish to sound China out; experts, "we are not fools". The offices concerned to study them, no hurry. The next article, on peaceful coexistence, to say the five principles are China''s own, set Lenin''s coexistence against Khrushchev''s, and show that Khrushchev has bent Lenin.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 655–656 (Mao "at a Standing Committee called in early December", after the letter of Nov. 29; his remarks on trade, the plan, the border and experts; the article''s line). Made public: 1999. See [[cal.1963-12-03.china-leadership]]. Names: Mao Zedong, Khrushchev. Check: the day, and whether this is the session at which Mao heard the letter of Nov. 29 (Dec. 3); Wu names neither.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: f2852bd8
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 655–656: all'
- add:
    entry:
      id: cal.1963-12.china-leadership-3
      when: Dec.–Jan.
      date: 1963-12
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. In the revision of the seventh commentary, first meant to be on relations among brother parties, Mao tells the drafting group to begin from dialectics: all things divide in two; the movement has grown by parting and joining, from the First International to the Third; Khrushchev is the greatest splitter; a party splits first in thought, and revisionism is splittism; parties large and small are equal and independent.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 662–663 (the drafting group on the seventh commentary "in December and January", its title and structure changed several times; Mao''s remarks "in the course of revision", undated; the group, under Deng Xiaoping, followed them; eighteen revisions in all, more than for any earlier piece). Made public: 1999. See [[cal.1963-12.china-leadership-2]]. Names: Mao Zedong, Khrushchev. Check: the day of Mao''s instruction, in December or January; Wu gives only "in the course of revision".'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
      src:
        c: 8583c357
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 662–663: all'
- add:
    entry:
      id: cal.1963-12-12.china-leadership-5
      when: Dec. 12
      date: '1963-12-12'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* and *Hongqi* print the sixth commentary, "Two fundamentally opposed policies of peaceful coexistence." It sets the policy of Lenin and Stalin, which China has held since 1949 and put with India into five principles in 1954, against the CPSU leaders', which it says is a Soviet–American agreement to run the world.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 656–657 (Dec. 12; the two policies; the five principles of 1954 and the Bandung ten of 1955; the writers recast the article on the line Mao gave in early December, and the Standing Committee passed it, 656). To check: the commentary, *Renmin ribao*, Dec. 12, 1963 (the text). See [[cal.1963-12-12.china-leadership]], [[cal.1963-12.china-leadership-2]].'
      tags:
      - polity:prc
      src:
        c: 18019e96
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 656–657: all'
