- add:
    entry:
      id: cal.1964-04-15.soviet-union
      when: Apr. 15
      date: '1964-04-15'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow, the Polish–Soviet friendship rally, in the Polish party and government delegation''s visit of Apr. 13 to 18. Khrushchev says the Chinese party would divide the white race from the others: that whites will never understand blacks and yellows, whose interests differ. He says the Chinese tell the Soviets not to build the economy or raise living standards but to turn industry to belts and march to the grave, and shows his belly; that the Chinese have eaten all their eggs and killed all their hens.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 765–767 (Apr. 15, one of four speeches Khrushchev made during the Polish visit, "the worst"; by Wu''s summary and the foreign correspondents'' accounts he quotes, as printed in the *Renmin ribao* of Apr. 28). To check: Khrushchev''s speech of Apr. 15, 1964 (the text). See [[cal.1964-04-06.soviet-union]]. Names: Khrushchev.'
