      c: 'Wu Lengxi leads the *Renmin ribao* delegation to Vietnam for the Spring Festival, at the Vietnamese side''s wish: it leaves Peking in the morning and reaches Hanoi that afternoon, three weeks planned.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 666 (leaving Peking the morning of Feb. 9, in Hanoi that afternoon; the Vietnamese side "hoped" Wu would bring a delegation for the Spring Festival). The time is the departure''s. Made public: 1999. See [[cal.1964-02-04.china-leadership-4]]. Check: whether the visit was reported at the time.'
      tags:
