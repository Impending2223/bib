      when: Apr. 7–12
      date: '1964-04-07'
      thread: china-leadership
      c: 'Deng Xiaoping and Peng Zhen take the drafting group out of Peking by special train, to rest: Datong, the Yungang caves; Baotou, the steel works and the rare-metal mines, two days; Yinchuan, a day, the "Dayan Pagoda" and the Ningxia secretary''s account; Lanzhou, two days, the Gansu committee''s account and a defense plant.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 744 (leaving "two days" after the meeting of Apr. 5, that is Apr. 7; Wu among the party). Made public: 1999. See [[cal.1964-04-05.china-leadership-4]]. Names: Deng Xiaoping, Peng Zhen. Check: the days at each stop, Wu giving the lengths only; and the pagoda, Wu''s 大雁塔 being the Xi''an pagoda''s name.'
