- add:
    entry:
      id: cal.1964-03-06.china-leadership-3
      when: Mar. 6
      date: '1964-03-06'
      time_range:
      - 1964-03-06T04:00Z
      - 1964-03-06T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
