- add:
    entry:
      id: cal.1964-04-03.soviet-union
      when: Apr. 3
      date: '1964-04-03'
      thread: soviet-union
      also:
      - china-leadership
      c: Moscow. The CPSU publishes together Suslov's report to its February plenum, some 80,000 characters in eight parts, the plenum's resolution of Feb. 15, and a *Pravda* editorial. The report charges the Chinese leaders with petty-bourgeois, nationalist and neo-Trotskyist tendencies and with splitting, takes up the test-ban treaty, the Caribbean crisis, the Indian border and the Sino-Soviet trade, and asks a conference of the parties to fix "ways and means" of unity; the resolution calls for a public, decisive rebuff to the Chinese stand and says the CPSU will not leave the line of its Twentieth and Twenty-second Congresses; the editorial gives over 200 anti-Soviet articles in the *Renmin ribao* since Nov. 1963, and Feb. 12 for the letter to the parties.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 740, 754–764 (the three texts published at Moscow Apr. 3; the report''s eight parts in Wu''s list; the resolution of Feb. 15; the editorial). To check: *Pravda*, Apr. 3, 1964 (the three texts). See [[cal.1964-02-12.soviet-union]], [[cal.1964-02-10.soviet-union-leadership]]. Names: Suslov.'
      tags:
      - polity:ussr
      - polity:prc
      - name:suslov-mikhail-a
      src:
        c: 02e419c0
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 740, 754–764: all'
- add:
    entry:
      id: cal.1964-04-05.china-leadership-4
      when: Apr. 5
      date: '1964-04-05'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Liu Shaoqi presides at a small meeting at his home; Zhou Enlai, Deng Xiaoping, Peng Zhen and Chen Yi attend. They take the CPSU''s plenum documents as a serious event, though the three texts, over 60,000 characters, have nothing new but abuse. Chen Yi: they name Mao, Liu, Zhou, Deng, Tao Zhu and himself, seven or eight in all, where China has named Khrushchev alone. Deng: the CPSU asked talks in May and prints this; it prepares a splitting meeting. Zhou: Khrushchev could not hold his place without some answer. Liu: sit steady on the fishing platform, print the three texts later, wait and watch. The ninth commentary is to rest on the roots of Khrushchev''s revisionism at home and abroad, his "state of the whole people" and "party of the whole people"; a piece on the border is to follow. The meeting sends Deng with the writers out of Peking to rest.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 741–744 (Apr. 5 at Liu''s home; the speakers in Wu''s order). Made public: 1999. See [[cal.1964-04-03.china-leadership]]. Names: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Chen Yi, Mao Zedong, Tao Zhu, Khrushchev.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:peng-zhen
      - name:chen-yi
      - name:mao-zedong
      - name:khrushchev-nikita-s
