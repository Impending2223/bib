- add:
    entry:
      id: cal.1964-03-10.china-leadership-2
      when: Mar. 10
      date: '1964-03-10'
      time_range:
      - 1964-03-09T22:00Z
      - 1964-03-10T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, morning. Sixth and last talk with the Romanians. Ceaușescu: his Central Committee cables that the delegation ask China again to reconsider the pause; the delegation has also the CPSU''s recent reply to China, whose proposals include China''s; the interest of the movement lies in a stop; abuse does not make unity. Liu Shaoqi: China''s position is the four proposals of Feb. 29, agreement before a stop; he doubts the sincerity of those who ask a stop; the parties that passed anti-Chinese resolutions are to admit error and withdraw them; Romania itself had backed Khrushchev''s polemic against Albania and China. Bodnăraș: and if they admit? Liu: then China will answer no more. Deng Xiaoping: the admission to be public and quick. Ceaușescu asks a pause of a month or two. Maurer: they will tell Khrushchev at Moscow, and will go to Korea.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 709–712 (Mar. 10 morning; Wu has Maurer say the delegation goes to Korea "tomorrow", though the delegation left Mar. 12 (723)). Made public: 1999. See [[cal.1964-03-09.china-leadership-2]], [[cal.1964-03-10.china-leadership]]. Names: Ceaușescu, Liu Shaoqi, Bodnăraș, Deng Xiaoping, Maurer, Khrushchev.'
      tags:
      - polity:prc
      - polity:romania
      - vis:only:prc+romania
