- add:
    entry:
      id: cal.1964-03-03.china-leadership-2
      when: Mar. 3
      date: '1964-03-03'
      time_range:
      - 1964-03-02T22:00Z
      - 1964-03-03T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, the Fujian Hall of the Great Hall of the People, morning: the talks with the Romanian delegation open, the first of six sessions, to Mar. 10, Liu Shaoqi heading the Chinese side (Deng Xiaoping, Peng Zhen, Kang Sheng, Wu Xiuquan, Wu Lengxi). Maurer: Romania opposes making Comecon a supranational body and the Warsaw Pact''s political committee fixing the allies'' foreign policy; the Soviet Union has interfered often, and put missiles into Cuba without consulting Romania. Romania fears a split between China and the USSR and asks both to stop the open polemic; Khrushchev at Moscow seemed willing, not firmly; China should take the first step. He approves the Chinese letter of Feb. 29, shown to the delegation at Peking. Bodnăraș: China should understand Romania''s geography and position; Romania is not wholly on the Soviet side and welcomes the four proposals. The talk adjourns.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 2 and 3, 1964 (the talks open Mar. 3, Liu Shaoqi heading the Chinese side). [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 589 (Mar. 3–10, 1964; Liu holds talks with the Romanian Workers'' Party Central Committee delegation under Ion Gheorghe Maurer, Politburo member). [[w.lengxi-shinian-lunzhan-1956-1966]], 688–690 (Mar. 3 morning, the Fujian Hall; six sessions, Mar. 3, 4, 5, 6, 7 and 10; Maurer''s three points (the quarrels with the CPSU; the fear of a split; the bilateral relation); Bodnăraș). Made public: 1996. See [[cal.1964-03-02.china-leadership]]. Names: Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng, Maurer, Bodnăraș.'
      tags:
      - polity:prc
      - polity:romania
      - vis:only:prc+romania
