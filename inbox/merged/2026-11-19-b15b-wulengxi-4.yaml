      c: Hungary, a railway station. Khrushchev, visiting Hungary from Apr. 3, says the Chinese hold Stalin good and attack him for his course at the Twentieth Congress; those who would bring Stalin back may take him and live with him.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 764 (Apr. 5; by Wu''s summary, from the extracts the *Renmin ribao* printed on Apr. 28). To check: Khrushchev''s speech of Apr. 5, 1964 (the text). Names: Khrushchev.'
