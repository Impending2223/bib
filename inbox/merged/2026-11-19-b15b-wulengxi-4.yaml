      c: Lanzhou to Changsha. Deng Xiaoping, Kang Sheng and Wu Lengxi, called by Mao through a telephone call from the Central Committee's General Office on their second night at Lanzhou, fly by way of the military airfield at Wugong and reach Changsha at noon. Peng Zhen takes the rest of the group on to Xi'an.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 744–745 (the call "the second night at Lanzhou"; Mao''s naming of the three; Apr. 12; arrival at noon, Mao calling a meeting as soon as lunch is over). Made public: 1999. See [[cal.1964-04-07.china-leadership-2]]. Names: Deng Xiaoping, Kang Sheng, Mao Zedong, Peng Zhen.'
