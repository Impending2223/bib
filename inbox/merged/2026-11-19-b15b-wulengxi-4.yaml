      c: Mao reads the final text of the fifth commentary, adding the sentence "social practice is the sole criterion of truth," and tells Kang Sheng.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 14, 1963 (Nov. 18). Made public: 2013. See [[cal.1963-11-14.china-leadership]]. Names: Mao Zedong, Kang Sheng.'
