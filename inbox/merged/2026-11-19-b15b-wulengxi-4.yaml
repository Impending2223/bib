      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 29, 1964 (the reply of Feb. 29 published May 9). [[w.zedong-mao-zedong-nianpu]], V, Apr. 30, 1964 (the letter of May 7 published May 9). [[w.lengxi-shinian-lunzhan-1956-1966]], 774–776 (May 9; the seven letters named; the paper''s page shown at 775; the broadcast the evening before, by Mao''s schedule of May 3, 771; after it, by Wu, the Center turned chiefly to domestic questions and the Central Work Conference of May and June on the third five-year plan, 776). To check: the *Renmin ribao*, May 9, 1964 (the letters). See [[cal.1964-05-07.china-leadership-2]]. Check: whether the CPSU printed them.'
