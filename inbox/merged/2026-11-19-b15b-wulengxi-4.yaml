      c: Peking. Kim Il Sung, in the city for his talks with Mao, calls on the Romanian delegation. By his account to Mao the next evening, the Romanians say they quarrel with Khrushchev over interference and pressure, not theory, and they fear a split; they mean to go on to Korea and Vietnam after China, and ask about the Vietnamese party's recent trip to Moscow.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 695–696 (Kim''s report to Mao on "the talk yesterday, Mar. 4", at Diaoyutai on Mar. 5). Made public: 1999. Names: Kim Il Sung, Mao Zedong, Khrushchev. Check: the place and hour of the call, and the Romanians present; Wu has it only at second hand.'
