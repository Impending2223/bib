- add:
    entry:
      id: cal.1964-03-04.china-leadership
      when: Mar. 4
      date: '1964-03-04'
      time_range:
      - 1964-03-03T22:00Z
      - 1964-03-04T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: Peking, morning. Second talk with the Romanians; Liu Shaoqi speaks at length. The differences began at the Twentieth Congress; China kept them to private talk; the CPSU named Albania at its Twenty-second Congress and China in its Open Letter, and China had to answer. The polemic can stop when the CPSU and the forty-odd parties that have printed some two thousand articles admit their error and withdraw their texts; China will answer every article. The CPSU's plenum and its letter to the parties are to be seen first. That the polemic harms, Liu told Khrushchev at the meeting of 81 parties and Zhou Enlai the 22nd Congress; Khrushchev would not listen, and once called open polemic the Marxist–Leninist way. China waits to see whether the CPSU accepts the four points of Feb. 29, the third time China has proposed a halt. The Romanians would do better to go to Khrushchev.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 690–693 (Mar. 4 morning (Wu: "the next day"); Liu''s speech in his order). Made public: 1999. See [[cal.1964-03-03.china-leadership-2]]. Names: Liu Shaoqi, Zhou Enlai, Khrushchev.'
      tags:
      - polity:prc
      - polity:romania
      - vis:only:prc+romania
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:khrushchev-nikita-s
      src:
