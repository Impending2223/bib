- add:
    entry:
      id: cal.1964-03-05.china-leadership-3
      when: Mar. 5
      date: '1964-03-05'
      time_range:
      - 1964-03-05T04:00Z
      - 1964-03-05T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: Peking, afternoon. Third talk with the Romanians; Ceaușescu speaks for some three hours. The CPSU treats itself as leader and orders Romania about; its troops stayed in Romania until Romania asked again and again; the joint companies are run by the Soviets, who answered a proposal to end them with "buy it yourselves"; it called Romania nationalist, then said national sovereignty is out of date. In 1962 Khrushchev brought a letter and read it out to the Romanian Politburo; in June 1963 he abused Ceaușescu, who had come with a letter from Gheorghiu-Dej, and then in Romania quarreled two days. Ceaușescu agrees with China on the norms between parties and that criticism of one party at another's congress is wrong; he disliked the East German congress's treatment of the Chinese. He does not approve the CPSU's letters of July 14 and Nov. 29 or that of Feb. 12; asks "urgently" an end to the open polemic and that China take the lead. Maurer thanks Liu, who adjourns the talk.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 693–694, 696 (Mar. 5 afternoon; "three hours" (696); the Romanian Central Committee''s call to the CPSU on Feb. 14). Made public: 1999. See [[cal.1964-03-04.china-leadership]], [[cal.1964-02-14.soviet-union-2]]. Names: Ceaușescu, Maurer, Liu Shaoqi, Gheorghiu-Dej, Khrushchev.'
