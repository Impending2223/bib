- add:
    entry:
      id: cal.1964-02-12.soviet-union
      when: Feb. 12
      date: '1964-02-12'
      thread: soviet-union
      also:
      - china-leadership
      c: 'The CPSU Central Committee writes to the brother parties, the Chinese not among them: it will give the Chinese party a public and decisive rebuff and take "collective measures" against it.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 673, 694, 763 (Mao to Kim Il Sung on Feb. 27, guessing at its contents; Ceaușescu to Liu Shaoqi on Mar. 5: the letter speaks of a decisive rebuff and collective measures; the *Pravda* editorial of Apr. 3: the CPSU consulted the parties in it on the measures planned, the editorial''s date of the letter printed by Wu as "July 12", 763). Made public: *Pravda*, Apr. 3, 1964 (the letter and its purpose named in the editorial; Wu, 763). Check: the letter''s text and its addressees: Wu names the Romanian party, and Kim Il Sung says the Soviet ambassador at Pyongyang brought him, before he left for Peking, a CPSU letter to the Romanian party that spoke of a "decisive rebuff" (673).'
