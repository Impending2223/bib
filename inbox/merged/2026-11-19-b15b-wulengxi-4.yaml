        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 697–699: all'
- add:
    entry:
      id: cal.1964-03-07.china-leadership
      when: Mar. 7
      date: '1964-03-07'
      time_range:
      - 1964-03-07T04:00Z
      - 1964-03-07T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, afternoon. Fifth talk with the Romanians. Maurer: his Central Committee authorized only talk of stopping the polemic. Stoica: Comecon is run by one state; China should join. Liu Shaoqi: China''s letter asks that Comecon be reorganized; Deng Xiaoping: China has not applied. Liu gives the Chinese Central Committee''s formal answer: the CPSU is to publish its plenum resolution, give China its letter to the parties, and bring out its "decisive rebuff" and "collective measures", after which China will see whether it means to stop; China has answered only the CPSU so far, not the forty-odd parties. Peng Zhen: two "guns" are aimed at China; the Chinese have paused the articles for the Romanians'' stay, with no promise for after. Ceaușescu asks that the pause be extended; Peng Zhen refuses. The talk adjourns; Mar. 8 is a day of rest.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 699–704 (Mar. 7 afternoon; Liu''s "formal reply" in his words; Deng on the British party; Peng Zhen''s "two guns", pause "only for you"). Made public: 1999. See [[cal.1964-03-06.china-leadership-3]]. Names: Maurer, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Ceaușescu.'
      tags:
      - polity:prc
      - polity:romania
      - vis:only:prc+romania
      - name:maurer-ion-gheorghe
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:peng-zhen
      - name:ceausescu-nicolae
