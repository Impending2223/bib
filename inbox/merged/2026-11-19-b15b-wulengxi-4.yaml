      when: Mar. 7
      date: '1964-03-07'
      time_range:
      - 1964-03-07T11:00Z
      - 1964-03-07T14:00Z
      time_band: evening
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao''s home, evening. Mao presides at the Politburo Standing Committee after the fifth talk with the Romanians. Liu Shaoqi: five talks, each on the polemic after the Romanians'' quarrels with the Soviets; the delegation sent at the CPSU''s prompting, yet with real quarrels of its own; a chance to pull Romania a little against Khrushchev''s great-power chauvinism. Mao: the line unchanged, no stop without agreement; the articles resume when the delegation leaves.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 6 and 7, 1964 (the evenings of Mar. 6 and 7; Liu Shaoqi and Deng Xiaoping attend, Peng Zhen and Kang Sheng sit in). [[w.lengxi-shinian-lunzhan-1956-1966]], 705–706 ("after the fifth talk" of Mar. 7, at Mao''s residence). Made public: 1999. See [[cal.1964-03-07.china-leadership]], [[cal.1964-03-06.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Khrushchev.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:khrushchev-nikita-s
      - vis:only:prc
      follows:
      - cal.1964-03-07.china-leadership
