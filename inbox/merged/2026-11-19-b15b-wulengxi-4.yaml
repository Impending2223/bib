- add:
    entry:
      id: cal.1964-02-04.china-leadership-4
      when: Feb. 4
      date: '1964-02-04'
      thread: china-leadership
      also:
      - soviet-union
      c: Peking. The *Renmin ribao* prints the seventh commentary, "The leaders of the CPSU are the greatest splitters of our times." It says the unity of the movement was never so threatened; follows the struggle of Marxism–Leninism against opportunism, and of unity against splitting, from 1848 to the Third International; and says the CPSU leaders, holding the power of a great socialist state, are now the chief modern revisionists and the greatest splitters in the movement. It answers the charges of "anti-Sovietism," "seeking leadership," "defying the majority," "breaking discipline" and "backing anti-party groups."
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 663–665 (Feb. 4; its argument in Wu''s summary). To check: the commentary, *Renmin ribao*, Feb. 4, 1964 (the text). See [[cal.1964-02.china-leadership-2]], [[cal.1964-01.china-leadership-2]]. Check: the paper only; Wu says nothing of *Hongqi* for this one.'
      tags:
      - polity:prc
      src:
        c: 75fab228
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 663–665: all'
- add:
