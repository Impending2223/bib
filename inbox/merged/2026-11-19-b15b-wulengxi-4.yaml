      c: Peking. The *Renmin ribao* prints in full the telegram of Mao, Liu Shaoqi, Zhu De and Zhou Enlai to Khrushchev on his seventieth birthday, which Xinhua broadcast the evening before.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 752–754 (the telegram sent in plain code to Moscow "early on the 16th" (Moscow''s night of the 15th), broadcast by Xinhua the evening of the 16th, printed on the 17th; many cadres asked why so mild a telegram, "dear comrade" and the line on standing together above all; from Apr. 17 the Chinese press, Xinhua and the radio carried nothing critical of the CPSU, Mao''s week becoming ten days, 754). To check: the *Renmin ribao*, Apr. 17, 1964 (the telegram). See [[cal.1964-04-16.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Khrushchev.'
