- add:
    entry:
      id: cal.1964-03-07.soviet-union
      when: Mar. 7
      date: '1964-03-07'
      thread: soviet-union
      also:
      - china-leadership
      c: The CPSU Central Committee answers the Chinese letter of Feb. 29. It passes over the trade, experts and border of its earlier letter, and calls the Chinese letter slander. Printing the criticisms each has made would sharpen the polemic, not halt it; the seventh commentary of Feb. 4 left the CPSU unable to keep silent, so its plenum of 6,000 activists, and its letter of Feb. 12 to the parties, which it will not give China, "demand" or "request"; the demand is an ultimatum; China criticizes the CPSU to hold the place of "father party". It proposes talks in Peking in May, a preparatory meeting of the 26 parties of 1960 in June and July, and a conference in the autumn of 1964; October is too late, and 17 parties are wrong.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 724–726 (the letter of Mar. 7, "received during the talks with the Romanians", the Central Committee deciding to leave it until they had gone; Peng Zhen to Ceaușescu on Mar. 9, "yesterday we received his letter", 707; the CPSU''s three proposals and its objections; the Romanian delegation had the letter by Mar. 10, 710). Made public: the *Renmin ribao*, May 9, 1964 (774–775). See [[cal.1964-02-12.soviet-union]]. Check: the letter''s text.'
      tags:
      - polity:ussr
      - polity:prc
      - vis:only:prc+ussr
      - polity:romania
      - vis:from:romania:1964-03-10
      src:
        c: ce16ab33
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 724–726: all'
- add:
    entry:
      id: cal.1964-03-09.china-leadership-2
      when: Mar. 9
      date: '1964-03-09'
      time_range:
      - 1964-03-08T22:00Z
      - 1964-03-09T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, Diaoyutai, morning. At Ceaușescu''s urgent request Peng Zhen, Wu Xiuquan and Wu Lengxi call on him. Tense and excited, he says that many parties want the polemic stopped; the delegation has telephoned Gheorghiu-Dej, and the Romanian Central Committee asks China to extend the pause and the delegations to meet once more; he has not consulted the CPSU, and will take it up at Moscow on the way home. Peng Zhen: the pause, eight days so far and ten by their leaving, is China''s courtesy to Romania and ends when they go; the CPSU''s letter received the day before still refuses the letter of Feb. 12; Khrushchev should be asked to give the letter of Feb. 12 and say what his "decisive rebuff" is; he recalls Bucharest in 1960, where Romania urged patience, and proposes that the two parties resist Khrushchev''s great-power chauvinism together. He will report to the delegation.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 706–709 (the morning of Mar. 9, Diaoyutai; the Secretariat''s query to Mao and Liu Shaoqi before the three went). Made public: 1999. See [[cal.1964-03-07.china-leadership]], [[cal.1964-03-09.china-leadership]]. Names: Peng Zhen, Ceaușescu, Gheorghiu-Dej, Khrushchev.'
      tags:
      - polity:prc
      - polity:romania
