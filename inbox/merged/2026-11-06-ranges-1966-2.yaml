      time_range: ['1966-06-29T16:00Z', '1966-06-29T18:28Z']
      time_zone: America/New_York
      n: '[[w.gibbons-u-s-government-and]], IV, 377; [[w.gibbons-u-s-government-and]], IV, 377 (Russell for the strikes; Fulbright, Robert Kennedy, Javits and House Democratic liberals against; Aiken "in a voice quaking with emotion"). On the strikes: [[cal.1966-06-29.vietnam]]. The Senate met at noon, its standing hour ([Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=1)), and adjourned at 1:52 p.m. ([Daily Digest, D335](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=333)); the House met at noon, its standing hour ([Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=1)), and adjourned at 2:28 p.m. ([Daily Digest, D337](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=335)). To check: [*New York Times*, June 30, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/30/issue.html); 112 Cong. Rec., June 29 and 30, 1966. See [[cal.1966-06-29.vietnam]]. Names: Russell, Saltonstall, Symington, Ford, Mansfield, Aiken.'
