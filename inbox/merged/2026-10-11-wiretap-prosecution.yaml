patch: wiretap-prosecution
by: Claude (from the Church Committee's interim report)
ops:
  - add:
      entry:
        id: cal.1962-03-28.crime-and-hijacking
        when: Mar. 28–Apr. 20
        date: '1962-03-28'
        thread: crime-and-hijacking
        also: [cuba]
        c: 'The CIA asks the Justice Department not to prosecute in the Las Vegas wiretap case. Edwards to the FBI''s liaison, Mar. 28 or 29: prosecution "would endanger sensitive sources and methods used in a duly authorized intelligence project and would not be in the national interest." Hoover to Miller, Apr. 10: Edwards holds that prosecuting Maheu would expose "most sensitive information relating to the abortive Cuban invasion." Houston, the CIA''s General Counsel, Apr. 16: Miller sees "no major difficulty in stopping action for prosecution." Apr. 20, Houston asks it formally, "on grounds of security."'
        n: '[S. Rep. No. 94-465, 130–31 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=141) (K–J Adm. II.H.3). See [[cal.1962-02-07.crime-and-hijacking]]; [[cal.1962-03-22.transition-and-staff]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Hoover (K–J Adm. III.I); Maheu, Houston (K–J Cong. III.K).'
        tags: [name:edwards-sheffield, name:hoover-j-edgar, name:maheu-robert-a, name:houston-lawrence]
  - edit:
      id: cal.1962-05-07.robert-kennedy
      base: b2ad3580
      set:
        c: 'Robert Kennedy, at his request, briefed by Lawrence Houston, the CIA''s General Counsel, and Sheffield Edwards, its Director of Security, on the Agency''s use of Giancana and Rosselli, through Maheu, to kill Castro: described as ended in May 1961. In April Harvey had given Rosselli poison pills. Kennedy, by Houston''s account: if the Agency was "going to get involved with Mafia personnel again he wanted to be informed first." May 9, he tells Hoover; Hoover''s record, May 10: the CIA "could not afford to have any action taken against Giancana and Maheu." No one is prosecuted for the tap.'
        n: '[S. Rep. No. 94-465, 131–34 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=142) (K–J Adm. II.H.3). Thomas, *The Very Best Men*; Powers, *The Man Who Kept the Secrets* (K–J Adm. II.E). Thomas, *Robert Kennedy: His Life* (K–J Adm. II.G.1). See [[cal.1962-03-28.crime-and-hijacking]]; [[cal.1962-03-22.transition-and-staff]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Robert Kennedy (K–J Adm. III.A); Houston (K–J Cong. III.K); Giancana, Harvey, Hoover (K–J Adm. III.I); Castro (K–J Adm. III.J).'
