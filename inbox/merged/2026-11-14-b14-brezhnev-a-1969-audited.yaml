- add:
    entry:
      id: cal.1969-12-05.soviet-union-leadership
      when: Dec. 5
      date: '1969-12-05'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev with Ceaușescu. His notes of Ceaușescu: the irritants in the relations of the parties and the countries to be removed, on both sides; no agreement for 1970 on coke; military equipment, aircraft among it, not delivered in 1969, and cooperation between aircraft plants; an agreement for 1971–75 and a meeting of the two governments'' delegations; the Romanian party''s fight with the right.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 433–34 (№№ 97–98, Brezhnev''s notes of Ceaușescu''s statement and "О положении в партии" (on the situation in the party), Dec. 5), 452 nn.270–275 (the editors: Ceaușescu on relations of the RCP and CPSU, coke, the shortfall in the 1965–70 supply agreement, military cooperation, the 1971–75 agreement). Made public: 2016. To check: the Romanian record. Names: Ceaușescu, Brezhnev.'
      tags:
      - polity:ussr
      - polity:romania
      - name:brezhnev-leonid
      - name:ceausescu-nicolae
      - vis:only:ussr+romania
