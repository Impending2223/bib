patch: 2026-11-14-b14-brezhnev-a-1969
by: 'Claude (batch 14, reader 1: Brezhnev''s workbooks, vol. I, Oct. 1964–Dec. 1969), Nov. 14, 2026; audited by Claude (Opus), batch 14 audit, Nov. 14, 2026 (each entry against its pages; c clipped to the event, quotations in translation; Oct. 2 read as Gomułka''s words, the Poles shocked by what they heard; the June 27 aktiv cut from the plenum; doubles with vol. II folded: vol. II''s Feb. 4, June 25–27 and Oct. 1–3 entries and its Dec. 5 talk become cites on these)'
ops:
- add:
    entry:
      id: cal.1969-02-04.soviet-union-leadership-2
      when: Feb. 4
      date: '1969-02-04'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Moscow. Brezhnev with Erban, chairman of the Czechoslovak National Front, whose delegation is in the USSR Feb. 2–4. His points for the talk: the relations of the two parties good, and others wanting to set them at odds; the post-January course juggled by the right; open struggle, no halting halfway, the anti-socialist forces well organized; the opposition''s aims, a congress, elections to the National Assembly, the unions, workers'' councils taking industry out of the party''s reach, attacks on the security organs; the National Front''s part, and Erban''s, praised.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 348–49 (№ 82, Brezhnev''s points for the talk, Feb. 4), 434 nn.1–3 (the editors: the National Front delegation under Erban, the Politburo''s decision of Jan. 19; the talk Feb. 4). Made public: 2016. To check: the Czechoslovak record; the points are Brezhnev''s, not what was said. Names: Erban, Brezhnev.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - vis:only:ussr+czechoslovakia
- add:
    entry:
      id: cal.1969-02-25.soviet-union-leadership
      when: Feb. 25
      date: '1969-02-25'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'The Politburo, by the editors probably on Chervonenko''s report on Czechoslovakia. Brezhnev''s notes: the Czechoslovak editions, to be halted or not; the "Black Book"; a letter to the Czechoslovak party''s Executive Committee, on the party''s leading role and normalization; support for the internationalist cadres; a meeting on the model of Čierna nad Tisou, or of the six parties; a marshal to go at Svoboda''s request. By the editors neither meeting was held.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 359–60 (№ 85, Brezhnev''s notes, Feb. 25), 438–39 nn.51–62 (the editors: the meeting question, the six parties, not held). Made public: 2016. To check: the protocol of Feb. 25, and the date, which the book gives from the notes'' own heading. Names: Chervonenko, Brezhnev, Svoboda.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:chervonenko-stepan-v
      - name:svoboda-ludvik
