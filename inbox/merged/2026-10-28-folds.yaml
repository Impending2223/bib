- edit:
    id: cal.1967-10-03.vietnam
    base: f15fd43a
    set:
      c: 'Johnson with Rusk, McNamara, Rostow, Helms, Christian and Tom Johnson, 6:10 to 9:32 p.m. Rusk, from the United Nations:
        no one can say what would follow a halt; Moscow has given up trying to move Hanoi. Johnson: no halt unless Hanoi agrees
        to meet promptly and push for a settlement. Rostow: the bombing costly to Hanoi; McNamara: "I do not agree." From
        the Friendly Five reports: all "think that we will lose the election if we do not do something about Vietnam quick."
        Of the march on the Pentagon: "They are not going to run me out of town." Nothing to leave the room: what would it
        do to the war if he announced he would not run? "If it were set either way today, the decision would be that he would
        not run." Rusk: "You must not go down."'
      n: 'FRUS 1964–68, V, doc. [341](https://history.state.gov/historicaldocuments/frus1964-68v05/d341). [[w.gibbons-u-s-government-and]],
        IV, 784, 807–08, 839, 861 (Tom Johnson''s notes); [[w.johnson-vantage-point]], 428 (the question of not running).
        Made public: Johnson''s memoir (1971), the question; the notes, FRUS 1964–68, V (2002). See [[cal.1967-08-21.vietnam-congress]].
        Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian.'
      also: &id027
      - vietnam-pennsylvania
