- edit:
    id: cal.1968-11-26.vietnam
    base: e45b2cee
    set:
      c: 'Saigon will send a delegation to Paris; its statement and the American, agreed in advance with the troop-contributing
        countries, released Nov. 27 in Saigon. Johnson: "a new and hopeful phase in the negotiations," but "both hard bargaining
        and hard fighting in the days ahead."'
      n: 'Statement by the President on the Decision by the Republic of Vietnam To Participate in the Peace Talks in Paris,
        [1968–69 Pub. Papers 1158](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=468) (Nov.
        26, 1968). [FRUS 1964–68, VII, doc. 236](https://history.state.gov/historicaldocuments/frus1964-68v07/d236). See [[cal.1968-05-13.vietnam]].
        Rusk at the White House: [[cal.1968-11-26.testing-missile-talks]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - place:saigon
- edit:
    id: cal.1967-06-06.middle-east
    base: 4f309550
    set:
      c: 'The Security Council, unanimous, Resolution 233: a cease-fire. Johnson: "a first step" toward peace. Radio Cairo,
        from 7:40 a.m.: American aircraft in the Israeli attacks; Egypt closes the Suez Canal. Egypt, Syria, Iraq, Algeria,
        Sudan and Yemen break relations with the United States, June 6–7 (Check the list).'
      n: 'Security Council Resolution [233 (1967)](https://undocs.org/S/RES/233(1967)). Statement by the President on the
        United Nations Security Council''s Cease-Fire Vote in the Middle East Situation, [1967 Pub. Papers 598](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=666)
        (June 6, 1967). [FRUS 1964–68, XXXIV, doc. 233](https://history.state.gov/historicaldocuments/frus1964-68v34/d233)
        (Radio Cairo). [[w.drea-mcnamara-clifford-and-the-2011]], 443–444. To check: [[w.yergin-prize]]. See [[cal.1967-06-05.middle-east]].
        The oil embargo: [[cal.1967-06-06.oil]]. Names: Johnson.'
