- edit:
    id: cal.1963-12-03.civil-rights-bill
    base: 1f88c158
    set:
      c: 'The leaders'' breakfast, Meany in with Johnson from The Elms; labor''s "full support." The tax cut: "We have been
        a year in doing it. [We] can''t expect better results in a week." Civil rights before the committee since May, no
        hearings before next year; Johnson for the petition: "All you are asking is a hearing"; as many Democrats as can be
        had, the Republicans to match them. Albert''s count, 165 or 150; Johnson asks one by the whips. Albert Thomas brings
        six Texans. The leaders offer a cotton bill; Johnson will not "launch my administration with a Cotton Bill."'
      n: 'The breakfast, the petition and the counts: [Johnson and Carl Albert, 5:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-albert-december-3-1963),
        Tape K6312.03 (Miller Center); [Johnson and David McDonald, 12:10 p.m.](https://prde.upress.virginia.edu/conversations/9020036),
        Tape K6312.02, PNO 18 (PRDE only); [[w.caro-passage-of-power]], 492–94. The tax cut, the committee and the cotton
        bill: [[w.dallek-flawed-giant]], 70 (from the notes of the breakfast, Diary Backup, LBJ Library). See [[cal.1963-11-15.foreign-aid]].
        Names: Meany, Johnson, Albert, Boggs, Albert Thomas, McCormack. Check: Dallek''s text gives Dec. 5, his note the breakfast
        of Dec. 3 (70 n.36).'
      also: &id005
      - foreign-aid
      tags: &id006
      - name:meany-george
      - name:johnson-lyndon-b
      - name:albert-carl
      - name:boggs-hale
      - name:thomas-albert
      - name:mccormack-john-w
