ops:
- add:
    entry:
      id: cal.1968-03-23.vietnam-abrams
      when: Mar. 23
      date: '1968-03-23'
      thread: vietnam-abrams
      c: 'Johnson to Westmoreland, by telegram: relieved of the command in Vietnam, to be Army Chief of Staff. "Your appointment
        as Army Chief of Staff gives me great personal pleasure."'
      n: '[FRUS 1964–68, VI, doc. 151](https://history.state.gov/historicaldocuments/frus1964-68v06/d151) (editorial note:
        telegram WH 80711). See [[cal.1968-03-22.transition-and-staff]]. Names: Johnson, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-10-13.cuba
      when: Oct. 13
      date: '1965-10-13'
      thread: cuba
      c: 'Cuba answers the American note of Oct. 6, through the Swiss: ready to begin at once, 12,000 a month against the
        3,000 asked; men of 15 to 26 kept back; Cuba to draw the lists, subject to an American veto; no Red Cross. Boats from
        Florida since Oct. 7, over 700 refugees in by Oct. 18.'
      n: 'McGeorge Bundy to Johnson, Oct. 14, 1965 (LBJ Library, NSF, Files of McGeorge Bundy, Daily Regional Staff Reports),
        quoted in [FRUS 1964–68, XXXII, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v32/d308) (editorial
        note). The boats: Remarks at the Signing of the Immigration Bill, [1965 Pub. Papers 1037](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=511),
        the editors'' note. See [[cal.1965-09-28.cuba]]. Made public: FRUS 1964–68, XXXII. Check: the day; Bundy, Oct. 14,
        has the reply received "the previous night."'
- add:
    entry:
      id: cal.1965-09-28.cuba
      when: Sept. 28
      date: '1965-09-28'
      thread: cuba
      c: 'Castro: Cubans who wish may go to the United States; exiles may come for their relatives at the port of Camarioca
        after Oct. 10.'
      n: '[FRUS 1964–68, XXXII, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v32/d308) (editorial note).
        To check: [[w.garcia-havana-usa]]; [[w.schoultz-that-infernal-little-cuban]]; [[w.leogrande-back-channel-to-cuba]].
        See [[cal.1964-02-02.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
- add:
    entry:
      id: cal.1965-08-11.court
      when: Aug. 11
      date: '1965-08-11'
      thread: court
      c: Fortas confirmed by the Senate, without a roll call.
      n: '[111 Cong. Rec., Senate, Aug. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf).
        See [[cal.1965-07-28.vietnam]]. Names: Fortas. Check: the Judiciary Committee''s hearing, Aug. 5, as the entry of
        July 28 had it; no source read for the day.'
      tags:
      - name:fortas-abe
- edit:
    id: cal.1961-07-25.berlin-and-vienna
    base: 6d3f19ca
    set:
      c: 'Report to the nation on Berlin. $3.25 billion more for defense; reserves to be called; draft calls tripled; fallout
        shelters. No new taxes: a temporary increase, which Kennedy had favored, dropped after Heller and Samuelson argued
        it would choke the recovery. No direct challenge to the Soviet zone.'
      n: 'Radio and Television Report to the American People on the Berlin Crisis, [1961 Pub. Papers 533](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=591)
        (July 25, 1961). [[w.schlesinger-thousand-days-1965]], 391–92 (the requests). The taxes: NSC minutes, July 19, 1961,
        [FRUS 1961–63, XIV, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v14/d77); [[w.stein-fiscal-revolution-in-america]],
        391, 403 (the tax increase considered and dropped on the economists'' advice). The Republican leaders on Berlin and
        the budget: Joint Senate–House Republican Leadership minutes, July 27, 1961 (Dirksen Congressional Center; Opp. II.J).
        To check: [[w.sorensen-kennedy]]; [[w.heller-new-dimensions-of-political]], 32. See [[cal.1961-06-03.berlin-and-vienna]].
        Recording (K–J Adm. II.I). Names: Kennedy, Heller, Samuelson, Nitze, Acheson. Check: who argued against the tax increase.'
      also: &id001
      - defense
      - economy
      tags: &id002
      - name:kennedy-john-f
      - name:nitze-paul
      - name:acheson-dean-g
      - name:heller-walter-w
      - name:samuelson-paul-a
