- edit:
    id: cal.1965-07-28.vietnam
    base: 77bf5332
    set:
      c: 'News conference, the East Room, midday: "Why are we in Viet-Nam?" The Air Mobile Division and other forces ordered,
        from 75,000 men to 125,000 "almost immediately"; more later as asked. The monthly draft call from 17,000 to 35,000.
        Reserves not called now. Goldberg to carry a letter to U Thant. Fortas named to Goldberg''s seat: "the job has sought
        the man."'
      n: 'The President''s News Conference, [1965 Pub. Papers 794](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=268)
        (July 28, 1965). The war: [FRUS 1964–68, III, doc. 97](https://history.state.gov/historicaldocuments/frus1964-68v03/d97);
        [[w.gibbons-u-s-government-and]], III, 436–443; [[w.drea-mcnamara-clifford-and-the-2011]], 47; [[w.poole-joint-chiefs-of-staff-2012]],
        43; [[w.cosmas-joint-chiefs-of-staff-2012]], 309. Fortas: [[w.dallek-flawed-giant]], 235. To check: [[w.murphy-fortas]].
        See [[cal.1965-07-01.vietnam]]; [[cal.1965-07-21.vietnam]]; [[cal.1965-07-14.transition-and-staff]]. Names: Goldberg,
        U Thant, Fortas.'
      also: &id009
      - court
      tags: &id010
      - name:johnson-lyndon-b
      - name:goldberg-arthur-j
      - name:u-thant
      - name:westmoreland-william
      - name:fortas-abe
