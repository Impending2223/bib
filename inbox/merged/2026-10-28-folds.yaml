    id: cal.1968-05-03.vietnam
    base: 8024d3ca
    set:
      c: 'Word from Hanoi, received at 1 a.m.: it will meet in Paris on May 10 or several days after. Johnson to Rostow by
        telephone: "I''d rather go to almost any place than Paris." Morning news conference: Paris and May 10 accepted, after
        consulting Rusk, Clifford, Goldberg, Ball, Harriman and Vance; "only the very first step." A tax bill "without any
        ''ands,'' ''buts,'' or ''ors''"; cuts as each appropriation bill comes up: "stand up like men and answer the roll
        call."'
      n: 'The President''s News Conference, [1968–69 Pub. Papers 556](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=634)
        (May 3, 1968). Paris: FRUS 1964–68, VI, doc. [221](https://history.state.gov/historicaldocuments/frus1964-68v06/d221);
        [Johnson and Rostow, 1 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walt-rostow-may-3-1968),
        Conversation WH6805-01-13004 (Miller Center); [[w.nguyen-hanois-war]], 118 (Hanoi''s proposal of Paris). The tax bill:
        [[w.zelizer-taxing-america]], 275. See [[cal.1968-03-31.elections-1968]]; [[cal.1967-01-10.economy]]. Names: Rostow,
        Rusk, Clifford, Goldberg, Ball, Harriman, Vance, Johnson.'
