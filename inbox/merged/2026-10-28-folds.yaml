    set:
      c: 'The Tuesday lunch, 1:10 p.m.: Wheeler proposes armed reconnaissance up to 19°50′, a buffer, and shows targets on
        a map. Clifford: a bad time to expand the bombing, the targets not worth it; Rusk would not oppose strikes between
        the 19th and 20th parallels. Johnson: "I want to hear both sides"; to meet again the next day. On the conference report
        on taxes: "Labor is completely against it."'
      n: '[FRUS 1964–68, VI, doc. 232](https://history.state.gov/historicaldocuments/frus1964-68v06/d232). [[w.johnson-vantage-point]],
        508 (the bombing). Made public: in part, [[w.johnson-vantage-point]], 508; FRUS 1964–68, VI (2002). See [[cal.1968-03-31.elections-1968]];
        [[cal.1968-03-26.economy]]. Names: Wheeler, Clifford, Rusk, Johnson.'
      also: *id035
      tags: *id036
      thread: vietnam
      when: May 14
      date: '1968-05-14'
