- edit:
    id: cal.1968-11-26.testing-missile-talks
    base: 22c0c5c0
    set:
      c: 'Johnson with Rusk, Clifford, Rostow, Fulbright and Tom Johnson, 10:21 to 11:11 a.m. Rusk: "The logjam is broken";
        "it would be good for the President and Kosygin to meet." Nixon''s aide Ellsworth to Dobrynin: Nixon objects to a
        summit (Dobrynin''s account; Check the day).'
      n: 'FRUS 1964–68, XIV, doc. [323](https://history.state.gov/historicaldocuments/frus1964-68v14/d323) (the meeting);
        VII, doc. [237](https://history.state.gov/historicaldocuments/frus1964-68v07/d237) (the meeting); XIV, doc. [324](https://history.state.gov/historicaldocuments/frus1964-68v14/d324)
        (the summit again, 1:45 p.m.). [[w.dobrynin-in-confidence]], 186–87 (Ellsworth). See [[cal.1968-11-25.soviet-union]].
        Names: Rusk, Clifford, Rostow, Fulbright, Johnson, Kosygin, Ellsworth, Dobrynin, Nixon.'
      also:
      - soviet-union
      - transition-and-staff
      - vietnam-paris
      tags:
