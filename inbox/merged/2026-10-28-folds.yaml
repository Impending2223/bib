- edit:
    id: cal.1966-06-18.vietnam
    base: 10f0dbab
    set:
      c: 'News conference: the alternatives examined, "including all suggestions from those who have not shared our views";
        "the national interest requires that we persist in our present policy." Forces and operations may increase. Hanoi''s
        hopes rest "more on political differences in Saigon and Washington than on his military capacity." Raborn resigns
        as Director of Central Intelligence after fourteen months; Helms, his deputy, named.'
      n: 'The President''s News Conference, [1966 Pub. Papers 625](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=701)
        (June 18, 1966). [[w.gibbons-u-s-government-and]], IV, 344–45 (the war). To check: [[w.powers-man-who-kept-the]];
        [[w.helms-look-over-my-shoulder]]. See [[cal.1965-04-28.transition-and-staff]]. Names: Johnson, Raborn, Helms.'
