- edit:
    id: cal.1963-09-06.vietnam
    base: 693545df
    set:
      c: Meeting with the President on Vietnam, 10:30 a.m. Robert Kennedy asks whether the war can be won with Diệm and Nhu;
        if not, "why do we not grasp the nettle now." Diệm to be told he must do what is asked, or the effort will be cut.
        Krulak and Mendenhall sent to Vietnam, to be back in four days.
      n: '[FRUS 1961–63, IV, doc. 66](https://history.state.gov/historicaldocuments/frus1961-63v04/d66). [[w.gibbons-u-s-government-and]],
        II, 169–171; [[w.schlesinger-robert-kennedy-and-his]], 714 (Robert Kennedy''s question); [[w.kaplan-mcnamara-ascendancy-1961-1965]],
        288, and [[w.schulimson-joint-chiefs-of-staff]], 359 (Krulak and Mendenhall). To check: [[w.kaiser-american-tragedy]];
        [[w.krulak-first-to-fight]]; [[w.coram-brute]]; [[w.mecklin-mission-in-torment]]; [[w.phillips-why-vietnam-matters]];
        [[w.hilsman-to-move-a-nation]]. See [[cal.1963-08-24.vietnam]]. Made public: FRUS 1961–63, IV (1991). Names: Robert
        Kennedy, Ngô Đình Diệm, Ngô Đình Nhu, Krulak, Mendenhall.'
      also: &id003
      - robert-kennedy
      tags: &id004
      - name:krulak-victor-h
