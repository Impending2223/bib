- edit:
    id: cal.1965-10-03.immigration
    base: 52d0df7e
    set:
      c: 'Immigration and Nationality Act Amendments signed on Liberty Island, N.Y., [79 Stat. 911](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg911.pdf).
        The national-origins quotas end June 30, 1968: then 170,000 a year from the Eastern Hemisphere, no country over 20,000,
        by preference for kin of citizens and residents and for skills; 120,000 from the Western Hemisphere. Johnson: "not
        a revolutionary bill"; it corrects "a cruel and enduring wrong." To Cuba, after Castro''s offer: "those who seek refuge
        here in America will find it"; an "orderly entry" to be arranged, Cuba''s agreement sought through the Swiss, $12.6
        million asked of Congress.'
      n: 'Statute (K–J Cong. II.J.2). Remarks at the Signing of the Immigration Bill, Liberty Island, New York, [1965 Pub.
        Papers 1037](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=511) (Oct. 3, 1965). [FRUS
        1964–68, XXXII, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v32/d308) (Cuba). See [[cal.1965-01-13.immigration]];
        [[cal.1965-09-22.immigration]]; [[cal.1965-09-28.cuba]]. Names: Johnson, Castro.'
      also: &id013
      - cuba
      tags: &id014
      - name:johnson-lyndon-b
      - bill:immigration-1965
      - name:castro-fidel
