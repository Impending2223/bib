- edit:
    id: cal.1966-12-31.vietnam
    base: 51a5c56e
    set:
      c: 'New Year truce, 48 hours (Check the hours). News conference at the ranch: a representative ready to be named today,
        if Hanoi will name one; the British proposal of talks welcome; U Thant urged to take the lead. On Salisbury''s reports:
        "only military targets have been authorized." A tax increase for 1967: no decision. Not a mistake to have asked none
        in 1966: the act of Mar. 15 and the investment credit''s suspension took "several billions." The year''s deficit $2.3
        billion, against $6.4 billion estimated, by his figures; the next not as low.'
      n: 'The President''s News Conference at the LBJ Ranch, [1966 Pub. Papers 1458](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=832)
        (Dec. 31, 1966). [[w.zelizer-taxing-america]], 257 (no general increase asked in 1966). To check: [[w.bernstein-guns-or-butter]].
        See [[cal.1966-12-24.vietnam]]; [[cal.1966-12-25.vietnam]]; [[cal.1966-11-29.economy]]. Names: U Thant, Salisbury.'
      also: &id021
