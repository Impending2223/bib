    id: cal.1967-05-19.vietnam-2
    base: fac30a16
    set:
      c: 'Johnson with Rusk, McNamara, Rostow and Christian, 5:38 to 6:59 p.m., chiefly on the Hanoi power plant and a shift
        south of the 20th parallel. Rostow''s memorandum, 3 p.m.: "dangerously strong feelings in your official family"; strike
        the plant, then cut back around Hanoi and Haiphong for some weeks while Moscow has its chance to "deliver something."
        Accepted, by Gibbons''s reading. The Middle East: Bohlen and Bruce to ask the French and British what they will do,
        to revive "as much of the tripartite as we can."'
      n: 'FRUS 1964–68, V, doc. [176](https://history.state.gov/historicaldocuments/frus1964-68v05/d176) (Rostow''s memorandum);
        XIX, doc. [22](https://history.state.gov/historicaldocuments/frus1964-68v19/d22) (the hour; the Middle East, from
        Rostow''s notes). [[w.gibbons-u-s-government-and]], IV, 650–52 (the war). Made public: FRUS 1964–68, V (2002). To
        check: [[w.cooper-lost-crusade]], 375 (Cooper''s account, cited by Gibbons, IV, 651). See [[cal.1967-05-19.vietnam]];
        [[cal.1967-05-16.middle-east]]. Names: Johnson, Rusk, McNamara, Rostow, Christian, Bohlen, Bruce.'
