        n: '[Johnson and Robert McNamara, 5:34 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-and-office-conversation-july-0), Conversation WH6407-20-4429 (Miller Center). Statement by the President Relating to the Selection of a Vice Presidential Candidate, [1963–64 Pub. Papers 919](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=159) (July 30, 1964). [[w.schlesinger-robert-kennedy-and-his]], 661–62 (the statement); [[w.johnson-vantage-point]], 98–99; [[w.dallek-flawed-giant]], 140–41 (the statement); [[w.mann-walls-of-jericho]], 437 (the statement); [[w.white-making-of-the-president-1965]], 266 (Thursday evening, before the television cameras); [[w.shesol-mutual-contempt]], 208 (the statement, from the White House press release; the six told); [[w.branch-pillar-of-fire]], 425; [[w.bernstein-guns-or-butter]], 136; [[w.taking-charge]], 484. [[w.clifford-counsel-to-the-president-2]], 397–98 (the formula Clifford''s, his draft in longhand; the announcement at 6 p.m.). After Bundy''s advice that morning: [[cal.1964-07-30.elections-1964-vice-presidency]]. The statement between Johnson''s calls with Rowe at 5:56 p.m. ("before the statement") and Russell at 6:10 p.m. ("after the statement"), by the Miller Center''s catalogue. To check: [[w.taking-charge-2001]]; Even in his 1971 memoirs, Johnson presented Robert Kennedy as the incidental victim of a high-minded maxim that a president should separate electoral politics from good government. Johnson, The Vantage Point, pp. 98–100 (cited by [[w.branch-pillar-of-fire]], 425). See [[cal.1964-03-10.elections-1964]]. Names: Johnson, Robert Kennedy, Rusk, Stevenson, McNamara, Freeman, Shriver.'
