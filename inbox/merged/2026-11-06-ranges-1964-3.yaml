        n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt16/pdf/GPO-CRECB-1964-pt16-5-1.pdf) (1964). Statement by the President Following Senate Passage of the Medicare Bill, [1963–64 Pub. Papers 1032](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=272) (Sept. 2, 1964): "the first time either House of Congress has endorsed health care for the aged under the social security system." [[w.marmor-politics-of-medicare]];[[w.zelizer-taxing-america]], 229–30 (the Senate''s vote; Mills and the House conferees against). [[w.sundquist-politics-and-policy]], 316–17 (Gore''s amendment, 49–44; the conference); [[w.bernstein-guns-or-butter]], 167–68 (42 to 42 at first; Goldwater flown in from Arizona; adopted on the third ballot; passed Sept. 3, 60 to 28; the conferees named). The Senate met at noon (its standing order, Daily Digest, D3) and adjourned at 7:17 p.m.: [Daily Digest, D463](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=461). Check: Bernstein, 167, gives the Gore amendment 49 to 46. To check: [[w.harris-sacred-trust]]; [[w.blumenthal-heart-of-power]]; [[w.david-with-dignity]]; Henry Hall Wilson to O''Brien, June 21, 1964; Cohen to O''Brien, Aug. 13, 1964; O''Brien to Johnson, Sept. 13, 1964; Wilson to O''Brien, Sept. 20, 1964, White House Office Aides Files, Henry Hall Wilson, LBJ Library (cited by [[w.zelizer-taxing-america]], 230 n.72). See [[cal.1964-07-29.medicare]]; [[cal.1961-02-09.medicare]]. Names: Gore, Johnson. Check: the page.'
