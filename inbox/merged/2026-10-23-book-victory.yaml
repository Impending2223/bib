- add:
    entry:
      id: cal.1961-02-25.vietnam
      when: Feb. 25
      date: '1961-02-25'
      thread: vietnam
      c: 'The Politburo, sessions of Jan. 31 and Feb. 25, on the military tasks of 1961–65: peace in the North the first task; in the South armed struggle raised to equal weight with the political, ten to fifteen main-force regiments to be built; the Central Military Party Committee to direct the war there. Hồ Chí Minh to the closing session.'
      n: '[[w.vietnam-victory-in-vietnam]], 74–77, 455 nn.2, 5–7. Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). Names: Hồ Chí Minh.'
      tags:
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1961-09.vietnam
      when: Sept.
      date: 1961-09
      thread: vietnam
      c: 'The Politburo and the Central Military Party Committee approve the General Staff''s plan for the South, 1961–63: besides recruits there, 30,000 to 40,000 men trained in the North to be sent down; Group 559, the trail''s transport group, grown to 2,000–3,000.'
      n: '[[w.vietnam-victory-in-vietnam]], 80, 456 n.26 (sent down the trail in 1961, 7,664 men). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1961-02-25.vietnam]].'
- add:
    entry:
      id: cal.1961-09-17.vietnam
      when: Sept. 17–18
      date: '1961-09-17'
      thread: vietnam
      c: Phước Thành. Viet Cong battalions take the capital of the new province, on the edge of War Zone D, the night of Sept. 17–18, and hold it some hours; the province chief and his assistant executed in the market place. The first provincial capital taken.
      n: '[FRUS 1961–63, I, doc. 135](https://history.state.gov/historicaldocuments/frus1961-63v01/d135) (Nolting, Sept. 20). [[w.vietnam-victory-in-vietnam]], 85 (the 500th Battalion of Military Region 7, with district local forces; the town held three days; 600 weapons taken). Check: the capital''s name, and the three days of Hanoi''s account against the embassy''s hours.'
- add:
    entry:
      id: cal.1962-12-06.vietnam
      when: Dec. 6
      date: '1962-12-06'
      thread: vietnam
      c: 'The Politburo on the South after two years of the "special war": the armed forces grown but out of balance and behind the enemy''s tactics. Combat units to be sent south quickly, main forces and specialty branches enlarged, the trail''s transport group reinforced.'
      n: '[[w.vietnam-victory-in-vietnam]], 113–15 (by its count, more than 40,000 men down the trail by the end of 1963). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1961-02-25.vietnam]].'
- add:
    entry:
      id: cal.1963-12.vietnam
      when: Dec.
      date: 1963-12
      thread: vietnam
      c: The Ninth Plenum of the Lao Động Central Committee. Armed struggle the direct deciding factor in the South; a decisive victory sought in a relatively short time; the main forces there to be built up, the North to supply them; preparation against a "limited war." The army in the North brought toward 300,000 by the end of 1964; whole regiments to go south.
      n: 'Washington''s reading of Hanoi''s statements after it: [FRUS 1964–68, I, doc. 48](https://history.state.gov/historicaldocuments/frus1964-68v01/d48) (State''s intelligence bureau, Feb. 15, 1964). [[w.vietnam-victory-in-vietnam]], 124–26, 460 n.10. Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing).'
- add:
    entry:
      id: cal.1964-09.vietnam
      when: Sept.
      date: 1964-09
      thread: vietnam
      c: The Politburo resolves to seek a decisive victory in the South within a few years by main-force campaigns. Nguyễn Chí Thanh, of the Politburo, sent south with senior cadres to direct them.
      n: '[[w.vietnam-victory-in-vietnam]], 137–38. Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1963-12.vietnam]]. Names: Nguyễn Chí Thanh.'
      tags:
      - name:nguyen-chi-thanh
- add:
    entry:
      id: cal.1965-03-28.vietnam
      when: Mar. 28
      date: '1965-03-28'
      thread: vietnam
      c: 'Resolution of the Eleventh Plenum, after the Central Military Party Committee''s session of February: the North''s economy to a war footing, the standing army enlarged quickly, all the military aid to be had from the socialist countries sought; the South to keep the offensive and destroy the Saigon army''s regulars even as American troops arrive.'
      n: '[[w.vietnam-victory-in-vietnam]], 143–44, 155, 462 nn.1, 5. Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1963-12.vietnam]].'
- add:
    entry:
      id: cal.1965-12-27.vietnam-2
      when: Dec. 27
      date: '1965-12-27'
      thread: vietnam
      c: The Twelfth Plenum opens in Hanoi, Hồ Chí Minh presiding. The war protracted, but forces of North and South to be concentrated to "secure a decisive victory within a relatively short period of time"; the North to defeat the bombing and supply the South; its main forces a strategic reserve for the South.
      n: '[[w.vietnam-victory-in-vietnam]], 171–74 (quoted, 171). Washington''s reading of Hanoi after the pause began: [FRUS 1964–68, IV, doc. 44](https://history.state.gov/historicaldocuments/frus1964-68v04/d44) (State''s intelligence bureau, Jan. 26, 1966). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1963-12.vietnam]]. Names: Hồ Chí Minh.'
      tags:
      - name:ho-chi-minh
      - place:hanoi
- add:
    entry:
      id: cal.1967-06.vietnam-tet
      when: June
      date: 1967-06
      thread: vietnam-tet
      c: 'The Politburo approves the strategic resolve: the war still protracted, but a decisive victory to be sought within a relatively short time, projected for 1968, by defeating the Americans militarily.'
      n: '[[w.vietnam-victory-in-vietnam]], 206–7. Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). Bibliography of the offensive: [[cal.1968-01-30.vietnam]].'
      tags:
      - ok:thread-first
- add:
    entry:
      id: cal.1967-07.vietnam-tet
      when: July
      date: 1967-07
      thread: vietnam-tet
      c: 'The General Staff''s plan for a general offensive and general uprising, put to the Politburo and the Central Military Party Committee: a surprise attack on the cities, Saigon, Huế and Đà Nẵng the main targets, American forces held in the mountains and on the borders.'
      n: '[[w.vietnam-victory-in-vietnam]], 207. See [[cal.1967-06.vietnam-tet]].'
- add:
    entry:
      id: cal.1967-07-06.vietnam
      when: July 6
      date: '1967-07-06'
      thread: vietnam
      c: Nguyễn Chí Thanh, of the Politburo, political commissar of the military command in the South, dies, of a sudden heart attack by Hanoi's account.
      n: 'William Bundy to Rusk, July 18: [FRUS 1964–68, V, doc. 248](https://history.state.gov/historicaldocuments/frus1964-68v05/d248) ("however it happened, must have been a blow"). [[w.vietnam-victory-in-vietnam]], 211. See [[cal.1964-09.vietnam]]. Names: Nguyễn Chí Thanh.'
      tags:
      - name:nguyen-chi-thanh
- add:
    entry:
      id: cal.1967-10.vietnam-tet
      when: Oct.
      date: 1967-10
      thread: vietnam-tet
      c: 'The Politburo, on reports from the fronts, finds the plan can go earlier than intended: the general offensive to open at Tet.'
      n: '[[w.vietnam-victory-in-vietnam]], 214. What Washington read: the captured documents on the winter–spring campaign, Rostow to Johnson, Dec. 16, [FRUS 1964–68, V, doc. 440](https://history.state.gov/historicaldocuments/frus1964-68v05/d440). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1967-06.vietnam-tet]].'
- add:
    entry:
      id: cal.1968-01.vietnam-tet
      when: Jan.
      date: 1968-01
      thread: vietnam-tet
      c: 'The Fourteenth Plenum, in Hanoi, approves the Politburo''s resolution of December, "Moving the revolutionary war into a new era, the era of securing a decisive victory": the bulk of the Saigon army destroyed, its government overthrown, the American will to fight broken. Saigon, Huế and Đà Nẵng the focal points.'
      n: '[[w.vietnam-victory-in-vietnam]], 214–15 (quoted, 214). The warning in Washington''s hands: [FRUS 1964–68, VI, doc. 32](https://history.state.gov/historicaldocuments/frus1964-68v06/d32) (editorial note). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1967-06.vietnam-tet]].'
      tags:
      - place:hanoi
