    entry:
      id: cal.1969-08.soviet-union
      when: Aug.
      date: 1969-08
      thread: soviet-union
      also:
      - china
      c: Soviet bomber units moved from Eastern Europe to the Russian Far East; practice strikes on targets in northwest China, where the Chinese nuclear facilities lie.
      n: '[[w.khoo-collateral-damage]], 57. Made public: 2006 ([[w.lewis-imagined-enemies]], 55, the earliest printing the note names). To check: [[w.lewis-imagined-enemies]], 55 (cited by [[w.khoo-collateral-damage]], 57 n.92). Check: the day.'
      tags:
      - polity:ussr
      - vis:only:ussr
      - ok:fields-place
- add:
    entry:
      id: cal.1969-08.soviet-union-2
      when: Aug.
      date: 1969-08
      thread: soviet-union
      also:
      - china
      c: The Soviets tell their Eastern European allies that a strike on the Chinese will be made, and leak it on purpose to foreign intelligence.
      n: '[[w.khoo-collateral-damage]], 57. Made public: 1999 ([[w.gobarev-soviet-policy-toward-china]], 46, the earliest printing the note names). To check: [[w.gobarev-soviet-policy-toward-china]], 46 (cited by [[w.khoo-collateral-damage]], 57 n.93). Check: the day.'
      tags:
      - polity:ussr
      - vis:only:ussr
      - ok:fields-place
- add:
    entry:
      id: cal.1968.soviet-union
      when: '1968'
      date: '1968'
      thread: soviet-union
      also:
      - vietnam-hanoi
      c: The Soviet ambassador in Hanoi sees the Vietnamese stressing military, political and diplomatic struggle together, not the purely military struggle Peking urges.
      n: '[[w.khoo-collateral-damage]], 61. Made public: 1996 ([[w.gaiduk-soviet-union-and-the]], 216). To check: [[w.gaiduk-soviet-union-and-the]], 216 (cited by [[w.khoo-collateral-damage]], 61 n.137). Check: the day.'
