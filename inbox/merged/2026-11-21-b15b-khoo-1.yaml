    entry:
      id: cal.1969-08-13.soviet-union
      when: Aug. 13
      date: '1969-08-13'
      thread: soviet-union
      also:
      - china
      c: A mid-level Soviet official asks an American official how the United States would react to a Soviet strike on Chinese nuclear facilities.
      n: '[[w.khoo-collateral-damage]], 57. Made public: 1977 ([[w.barnett-china-and-the-major]], 50, the earliest printing the note names). To check: [[w.goldstein-do-nascent-wmd-arsenals]], 60 (cited by [[w.khoo-collateral-damage]], 57 n.94a); [[w.lawson-sino-vietnamese-conflict]], 170 (so cited: "Sino-Vietnamese Alliance") (cited by [[w.khoo-collateral-damage]], 57 n.94b); [[w.barnett-china-and-the-major]], 50 (cited by [[w.khoo-collateral-damage]], 57 n.94c). Check: the day.'
