      id: cal.1969-03-21.soviet-union
      when: Mar. 21
      date: '1969-03-21'
      time_range:
      - 1969-03-21T14:00Z
      - 1969-03-21T16:00Z
      time_band: night
      time_zone: Asia/Shanghai
      thread: soviet-union
      also:
      - china-leadership
      c: Kosygin, the night of Mar. 21, telephones on a Foreign Ministry line and tells a Chinese official he wishes to speak to Zhou Enlai.
      n: '[[w.khoo-collateral-damage]], 56 (at midnight the Soviet chargé brings the Foreign Ministry the same message). Made public: 2006 ([[w.lewis-imagined-enemies]], 50, the earliest printing the notes name). To check: [[w.lewis-imagined-enemies]], 50 (cited by [[w.khoo-collateral-damage]], 56 nn.82–83). Reply: [[cal.1969-03-21.china-leadership-3]]. Names: Kosygin, Zhou Enlai.'
      tags:
      - polity:ussr
      - polity:prc
      - vis:only:ussr+prc
      - name:kosygin-aleksei
      - name:zhou-enlai
      - ok:fields-place
