      - polity:ussr
      - vis:only:ussr
      - ok:fields-place
- add:
    entry:
      id: cal.1969-09.china-leadership-11
      when: Sept., before the 11th
      date: 1969-09
      at: before 1969-09-11
      thread: china-leadership
      also:
      - soviet-union
      c: Mao, fearing Kosygin's plane a "Trojan horse," has Zhou Enlai put military units on high alert and several specialist battalions secure the Peking airport.
      n: '[[w.khoo-collateral-damage]], 58. Made public: 2006 ([[w.lewis-imagined-enemies]], 58, the earliest printing the note names). To check: [[w.lewis-imagined-enemies]], 58 (cited by [[w.khoo-collateral-damage]], 58 n.99). See [[cal.1969-09.china-leadership-6]]. Check: the day. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      - name:zhou-enlai
      - ok:fields-place
- add:
    entry:
      id: cal.1969-10-14.china-leadership-3
      when: Oct. 14
      date: '1969-10-14'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao leaves Peking for Wuhan, ahead of the Soviet delegation's arrival for the border talks.
      n: '[[w.khoo-collateral-damage]], 59 n.115. Made public: Check (the note gives no source). See [[cal.1969-10-14.china-leadership]]. Check: the hour (Mao in Hall 118 at 6 p.m., the Politburo at 8:30, by [[cal.1969-10-14.china-leadership]]; on his train at Wuchang the evening of Oct. 15). Names: Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      - ok:fields-place
