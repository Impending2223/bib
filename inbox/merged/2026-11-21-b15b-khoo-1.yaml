      when: Apr. 17
      date: '1965-04-17'
      thread: soviet-union
      also:
      - china
      - vietnam-diplomacy
      c: 'Moscow asks Peking for help to Hanoi: transit of 4,000 Soviet troops through China, use of Chinese airfields for Soviet planes defending North Vietnam, an air corridor over China.'
      n: '[[w.khoo-collateral-damage]], 22, 26 (the requests "a fortnight later" than the letter of Apr. 3; rejected). Made public: 1967 ([[w.zagoria-vietnam-triangle]], 141, the earliest printing the notes name). To check: [[w.zedong-jianguo-yilai-mao-zedong]], XI, 394–395 (cited by [[w.khoo-collateral-damage]], 23 n.79); [[w.zagoria-vietnam-triangle]], 141 (cited by [[w.khoo-collateral-damage]], 26 n.114). See [[cal.1965-04-03.soviet-union]]. Check: the day: the book has "a fortnight later" than Apr. 3; the Chinese reply of July 10, which rejects the requests, answers the CPSU''s letter of Apr. 17 ([[cal.1965-07-11.china-leadership-4]]).'
