      when: June, mid-
      date: 1969-06
      at: before 1969-06-11
      thread: china-leadership
      also:
      - soviet-union
      c: Mao approves the CMC Administrative Group's request to prepare the General Staff and the General Logistics Department for war.
      n: '[[w.khoo-collateral-damage]], 57. Made public: 2006 ([[w.lewis-imagined-enemies]], 53, the earliest printing the note names). To check: [[w.lewis-imagined-enemies]], 53 (cited by [[w.khoo-collateral-damage]], 57 n.88). See [[cal.1969-06.china-leadership-4]]. Check: the day. Names: Mao Zedong.'
