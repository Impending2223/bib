      when: July 20
      date: '1969-07-20'
      thread: china
      also:
      - soviet-union
      c: Another clash on the Sino-Soviet border.
      n: '[[w.khoo-collateral-damage]], 57. To check: [[w.lewis-imagined-enemies]], 53 (cited by [[w.khoo-collateral-damage]], 57 n.89). See [[cal.1969-07-08.china]].'
