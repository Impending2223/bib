- add:
    entry:
      id: cal.1969-08-12.intelligence
      when: Aug. 12
      date: '1969-08-12'
      thread: intelligence
      also:
      - soviet-union
      - china
      c: 'A National Intelligence Estimate: the Soviet proposal for collective security in Asia "an effort to capitalize on an anticipated reduction in Western presence" and to forestall Chinese gains.'
      n: '[[w.khoo-collateral-damage]], 63. Made public: 2004 ([[w.council-tracking-the-dragon]], 543). To check: [[w.council-tracking-the-dragon]], 543 (cited by [[w.khoo-collateral-damage]], 63 n.147).'
      tags:
      - polity:us
      - vis:only:us
- add:
    entry:
      id: cal.1969-09-05.soviet-union
      when: Sept. 5
      date: '1969-09-05'
      thread: soviet-union
      also:
      - china
      c: The United States tells the Soviets it "could not fail to be deeply concerned" by any escalation of the Sino-Soviet crisis.
      n: '[[w.khoo-collateral-damage]], 58. To check: [[w.goldstein-do-nascent-wmd-arsenals]], 61 (cited by [[w.khoo-collateral-damage]], 58 n.98). Check: by whom, and how.'
      tags:
      - polity:us
      - polity:ussr
      - ok:fields-place
- add:
    entry:
      id: cal.1969-09-16.soviet-union
      when: Sept. 16
      date: '1969-09-16'
      thread: soviet-union
      also:
      - china
      c: 'The Moscow *Evening News*, in English: a journalist close to the Soviets hints at an attack on Lop Nur, citing the Brezhnev Doctrine.'
      n: '[[w.khoo-collateral-damage]], 58. To check: [[w.lawson-sino-vietnamese-conflict]], 170 (so cited: "Sino-Vietnamese Alliance") (cited by [[w.khoo-collateral-damage]], 58 n.101). Check: the paper and the journalist (the book: "the Moscow English newspaper the *Evening News*").'
      tags:
      - polity:ussr
      - ok:fields-place
- add:
    entry:
      id: cal.1969-09.china-leadership-12
      when: Sept., after the 26th
      date: 1969-09
      at: after 1969-09-26
      thread: china-leadership
      also:
      - soviet-union
      c: The Central Military Commission orders elite units moved to the north; the infantry there increased by 20 percent.
      n: '[[w.khoo-collateral-damage]], 58. Made public: 2000 ([[w.yang-kuisong-sino-soviet-border-clash]], 39–40, the earliest printing the note names). To check: [[w.yang-kuisong-sino-soviet-border-clash]], 39–40 (cited by [[w.khoo-collateral-damage]], 58 n.106a); [[w.lewis-imagined-enemies]], 59 (cited by [[w.khoo-collateral-damage]], 58 nn.106b, 107, 108). See [[cal.1969-09-25.china-leadership-3]]. Check: the day (the book sets it after Kosygin''s letter of Sept. 26); whether the order came from the war-fighting conference of Sept. 25–27.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1969-10-20.china-leadership-4
      when: Oct. 20
      date: '1969-10-20'
      place: peking
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai drives to the advance command post under the Baiwang Shan, in Peking's Western Hills, and takes charge of the crisis.
      n: '[[w.khoo-collateral-damage]], 59–60. Made public: 2006 ([[w.lewis-imagined-enemies]], 69). To check: [[w.lewis-imagined-enemies]], 69 (cited by [[w.khoo-collateral-damage]], 60 n.123). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:zhou-enlai
