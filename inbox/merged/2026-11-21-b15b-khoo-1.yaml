      when: Apr. 3
      date: '1965-04-03'
      thread: soviet-union
      also:
      - china
      - vietnam-diplomacy
      c: 'The Soviet leaders, by letter to Peking, propose a meeting with the North Vietnamese: the three to discuss cooperation for Vietnam.'
      n: '[[w.khoo-collateral-damage]], 22, 26 (turned down by Peking, as Hanoi later said in public). Made public: 1967 ([[w.zagoria-vietnam-triangle]], 141, the earliest printing the notes name). To check: [[w.zedong-jianguo-yilai-mao-zedong]], XI, 394–395 (cited by [[w.khoo-collateral-damage]], 23 n.79); [[w.zagoria-vietnam-triangle]], 141 (cited by [[w.khoo-collateral-damage]], 26 n.112); [[w.truth-about-vietnamo-chinese]], 37–38 (cited by [[w.khoo-collateral-damage]], 26 n.113). Reply: [[cal.1965-04-11.china]]. Check: the day: Gromyko''s handing of the letter to Pan Zili was reported in Peking at 10:15 p.m., Apr. 4 ([[cal.1965-04-04.china-leadership-6]]).'
      tags:
      - polity:ussr
      - polity:prc
      - vis:only:ussr+prc
      - ok:fields-place
- add:
    entry:
