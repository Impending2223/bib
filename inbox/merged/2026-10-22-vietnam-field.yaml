      date: '1968-08-18'
      thread: vietnam-operations
      c: 'The third offensive. In Tây Ninh Province, from the night of Aug. 17–18: Tây Ninh City attacked; sappers into the relay station on Núi Bà Đen; the 5th Division''s regiments on the roads to Dầu Tiếng. In II Corps, a Special Forces camp in Kon Tum attacked the same morning.'
