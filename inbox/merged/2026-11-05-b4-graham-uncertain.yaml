      date: '1961-06-20'
      thread: school-aid
      also:
      - press-and-broadcasting
      c: 'The *New York Times*, editorially: the NDEA''s revision "dominated by efforts to write into this legislation
        provisions for aid to private and parochial schools," a "cover" for "large-scale Federal aid to non-public
        schools." For Thompson''s bill; Delaney asked to support it in Rules.'
      n: '[[w.graham-uncertain-triumph]], 21–22. To check: *New York Times*, June 20, 1961 (cited by [[w.graham-uncertain-triumph]],
        22 n.56). Names: Thompson, Delaney.'
      tags:
