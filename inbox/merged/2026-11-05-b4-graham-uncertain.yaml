      when: July 3
      date: '1961-07-03'
      thread: school-aid
      also:
      - press-and-broadcasting
      c: 'The *Times* again: the amended NDEA "was the ransom; and so the public-school bill ought to be ... liberated
        from the Rules Committee, where it has unconscionably been held by a strange coalition."'
      n: '[[w.graham-uncertain-triumph]], 22. To check: *New York Times*, July 3, 1961 (cited by [[w.graham-uncertain-triumph]],
        22 n.57).'
      src:
