- add:
    entry:
      id: cal.1961-08-14.school-aid
      when: Aug. 14
      date: '1961-08-14'
      thread: school-aid
      c: 'Sorensen to Kennedy: "no real possibility of the bill receiving approval without clearing the House Rules
        Committee," which needs Delaney or a Republican; Ribicoff''s compromise of the week before went too far
        for the House leaders, not far enough for the Senate''s. Not the "anemic" bill Humphrey called it: "Teachers
        will be glad to get any Federal aid to education after 40 years."'
      n: '[[w.graham-uncertain-triumph]], 24. To check: Memorandum, Sorensen to President Kennedy, Aug. 14, 1961,
        Sorensen file, container 32, JFK Library (cited by [[w.graham-uncertain-triumph]], 24 n.62); Hugh Douglas
        Price, "Race, Religion, and the Rules Committee: The Kennedy Aid-to-Education Bills," in *The Uses of Power*,
        ed. Alan F. Westin (1962) (cited by [[w.graham-uncertain-triumph]], 24 n.63). Names: Sorensen, Kennedy,
        Delaney, Ribicoff, Humphrey.'
      tags:
      - name:sorensen-theodore-c
