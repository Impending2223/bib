      id: cal.1961-06-01.school-aid
      when: June 1
      date: '1961-06-01'
      thread: school-aid
      c: House Education and Labor reports H.R. 7300, a clean bill like the Senate's. Rules, Delaney and O'Neill
        pressing, holds it for the National Defense Education Act bill and its loans for parochial schools.
      n: '[[w.graham-uncertain-triumph]], 21. Names: Delaney, O''Neill.'
      tags:
