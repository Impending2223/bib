# Graham, The Uncertain Triumph (1984), read Nov. 5-6, 2026 from the owner's copy; book-check: notes/book-checks/graham-uncertain-triumph.md
patch: b4-graham-uncertain
by: batch-4 reader, graham-uncertain (Hugh Davis Graham, The Uncertain Triumph, 1984)
