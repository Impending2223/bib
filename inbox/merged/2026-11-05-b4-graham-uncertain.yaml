      when: Sept. 24
      date: '1964-09-24'
      thread: school-aid
      c: 'Gardner to the task force''s members, a nine-page draft of their priorities: first, "to equalize educational
        opportunity for the disadvantaged segments of our population," the city slums above all; supplementary educational
