- add:
    entry:
      id: cal.1961-07-20.school-aid
      when: July 20
      date: '1961-07-20'
      thread: school-aid
      c: 'Ribicoff to Kennedy, a compromise through the regular channels, Rules and Delaney among them: teachers''
        salaries and the parochial loans dropped; building aid for impacted areas only in overcrowded districts,
        the amount the House passed in 1960; $300 million for college buildings.'
      n: '[[w.graham-uncertain-triumph]], 23. To check: Memorandum, Ribicoff to President Kennedy, July 20, 1961,
        Sorensen file, container 32, JFK Library (cited by [[w.graham-uncertain-triumph]], 23 n.60a); Memorandums,
        Cohen to Sorensen, Aug. 7 and 9, 1961, Sorensen file, container 32, JFK Library (cited by [[w.graham-uncertain-triumph]],
        23 n.60b). Names: Ribicoff, Kennedy, Delaney.'
      tags:
