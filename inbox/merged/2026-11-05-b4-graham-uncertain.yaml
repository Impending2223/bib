      when: Oct. 6
      date: '1961-10-06'
      thread: school-aid
      c: 'Ribicoff to Kennedy, five pages on the year''s failure: "a broad program of grants to states for public
        school construction and teachers'' salaries is virtually impossible to pass." Put it off to 1963, an issue
        for the elections; in 1962 the college and medical bills, and an Emergency Educational Opportunities Act
        of special programs, perhaps as amendments to the NDEA.'
      n: '[[w.graham-uncertain-triumph]], 26. To check: Memorandum, Ribicoff to President Kennedy, Oct. 6, 1961,
        Sorensen file, container 34, JFK Library (cited by [[w.graham-uncertain-triumph]], 26 n.1). Names: Ribicoff,
        Kennedy.'
