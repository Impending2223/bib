        "There is some feeling in the Task Force that Federal education programs now in place are adequate"; "We
        have an overdose of underfunded legislation on the books." Among its twenty-three proposals a Day Care and
        Child Development Act, school building grants with federal debt service, adult basic education for the 64
        million without a high school diploma.'
