      thread: school-aid
      c: 'Wilbur Cohen''s education proposals for 1962 to the White House: federal scholarships and grants to raise
        the quality of teaching. The Budget Bureau''s staff for them: merit rewarded, not $300 million spread over
        an $8 or $9 billion payroll.'
      n: '[[w.graham-uncertain-triumph]], 27. To check: Staff memorandum of M. S. March, "Analysis of HEW''s proposals
