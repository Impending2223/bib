- edit:
    id: cal.1962-07-23.economy-gold
    base: d2357316
    set:
      c: 'News conference, its first minutes carried live to Europe by Telstar: "The United States will not devalue
        its dollar." Salinger, after it: the price of gold on the London market is breaking. On the fall elections,
        the Republicans against his program: "the American people will have a choice. And they will choose, as I
        have said, either to put anchor down or to sail."'
      n: 'The President''s News Conference of July 23, 1962, [1962 Pub. Papers 568](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=628).
        [[w.reeves-president-kennedy]], 328–29; [[w.graham-uncertain-triumph]], 38 (the elections). To check: [[w.salinger-with-kennedy]],
        189–90 (cited by [[w.reeves-president-kennedy]], 329). Names: Salinger, Kennedy.'
      src:
        c: da52356b
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=628: A, C'
        - 'w.reeves-president-kennedy 328–29: A-B'
        - 'w.graham-uncertain-triumph 38: C'
