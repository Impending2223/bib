      thread: school-aid
      c: 'Sorensen to Kennedy, for the compromise: $180 million of the college aid in grants, not loans, "and to
        accept grants as well as loans is a major change from the original administration position."'
      n: '[[w.graham-uncertain-triumph]], 23–24. To check: Memorandum, Sorensen to President Kennedy, Aug. 9, 1961,
