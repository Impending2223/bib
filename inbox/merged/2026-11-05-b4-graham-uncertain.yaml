- add:
    entry:
      id: cal.1960-09-25.elections-1960-5
      when: Sept. 25
      date: '1960-09-25'
      thread: elections-1960
      also:
      - school-aid
      c: 'The *New York Herald Tribune* prints the candidates'' answers to seven questions on education. Nixon:
        teachers'' pay "the greatest single challenge confronting our American educational system today," but aid
        for building and debt service only, to keep out federal control; tuition tax credits to be considered. Kennedy:
        "Federal aid to education via the States is a must," for teachers'' salaries as well as building, public
        schools only, more for the poorer States.'
      n: '[[w.graham-uncertain-triumph]], 7–8. To check: *New York Herald Tribune*, Sept. 25, 1960 (cited by [[w.graham-uncertain-triumph]],
        8 n.18). Names: Nixon, Kennedy.'
      tags:
      - name:nixon-richard-m
      - name:kennedy-john-f
      src:
        c: 8fbf9864
        rows:
        - 'w.graham-uncertain-triumph 7–8: all'
        - 'via w.graham-uncertain-triumph 8 n.18: all'
- add:
    entry:
      id: cal.1960-12-13.school-aid
      when: Dec. 13
      date: '1960-12-13'
      thread: school-aid
      also:
      - transition-and-staff
      c: 'The Budget Bureau''s Division of Labor and Welfare to the Director, a transition memorandum: general aid
        to education a "unique opportunity" to recast the federal role. The federal share of the schools'' money
        9 percent, about $1 billion in fiscal 1961, most of it aid to impacted areas. Federal money to stimulate
        State, local and private spending, not replace it; the special programs to be examined, consolidated or
        ended.'
      n: '[[w.graham-uncertain-triumph]], 14–15. To check: Memorandum, Labor and Welfare Division to the Director,
        Dec. 13, 1960, Director file, container 375, OMB Records Division, National Archives (cited by [[w.graham-uncertain-triumph]],
        15 n.44).'
      src:
        c: 205227f4
        rows:
        - 'w.graham-uncertain-triumph 14–15: all'
        - 'via w.graham-uncertain-triumph 15 n.44: all'
- add:
    entry:
      id: cal.1961-01-06.school-aid
      when: Jan. 6
      date: '1961-01-06'
      thread: school-aid
      c: 'The Carlyle, New York. Hovde and members of his task force on education give the President-elect their
        report; Salinger hands out its seven pages. More than $9.39 billion in grants and loans over four and a
        half years, $5.84 billion of it in grants to the States for public schools only: $30 a pupil, $20 more in
        the poorer States and in cities over 300,000. Kennedy: "great value," but "I don''t know whether we have
        the resources immediately to take on the whole program"; by Feldman''s account, "quite annoyed."'
      n: '[[w.graham-uncertain-triumph]], 11–13. Check: Graham, 11, has "Friday, 7 January"; the Friday was Jan.
        6, and the *Times* reported the report Jan. 7 (232 n.37). To check: *New York Times*, Jan. 7, 1961 (cited
        by [[w.graham-uncertain-triumph]], 12 n.37); Myer Feldman, Oral History Interview, May 29, 1966, JFK Library
        (cited by [[w.graham-uncertain-triumph]], 13 n.38). Names: Kennedy, Salinger, Feldman.'
      tags:
      - name:kennedy-john-f
      - name:salinger-pierre
      - name:feldman-myer
      src:
        c: b4e91b6a
        rows:
        - 'w.graham-uncertain-triumph 11–13: all'
        - 'via w.graham-uncertain-triumph 12 n.37: all'
        - 'via w.graham-uncertain-triumph 13 n.38: all'
- add:
    entry:
      id: cal.1961-02-13.school-aid
      when: Feb. 13
      date: '1961-02-13'
      thread: school-aid
      c: 'Feldman with Wilbur Cohen and Jack Forsythe, counsel to Senate Labor and Public Welfare, by their memorandum
        of the talk: the further the message strays from S. 8, the Senate''s bill of 1960, the harder its way; a
        bill like it would be reported "in a few days" and pass "overwhelmingly." On Hovde''s lines Hill might not
        sponsor it, McNamara would find it hard to vote for, Morse would sponsor it reluctantly.'
      n: '[[w.graham-uncertain-triumph]], 17–18. To check: Memorandum of Conversation by Jack Forsythe, Wilbur Cohen,
        and Myer Feldman, Feb. 13, 1961, Feldman file, container 27, JFK Library (cited by [[w.graham-uncertain-triumph]],
        18 n.51). Names: Feldman, Cohen, Hill, McNamara, Morse.'
      tags:
      - name:feldman-myer
      - name:cohen-wilbur-j
      - name:hill-lister
      - name:mcnamara-patrick-v
      - name:morse-wayne
      src:
        c: cc1c36fd
        rows:
        - 'w.graham-uncertain-triumph 17–18: all'
        - 'via w.graham-uncertain-triumph 18 n.51: all'
