      when: July 19
      date: '1961-07-19'
      thread: school-aid
      c: 'News conference, on the school bills held in Rules: "we were defeated in the Rules Committee by a vote
        of 8 to 7"; seven of the eight "not sympathetic to the legislation nor supported me in the last election."
        The House has procedures to bring the bill to a vote; "probably the most important piece of domestic legislation."'
      n: 'The President''s News Conference of July 19, 1961, [1961 Pub. Papers 513](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=571)
        (July 19, 1961). [[w.graham-uncertain-triumph]], 23. Check: Graham, 23, quotes "who were in the last election."
        Names: Kennedy.'
      tags:
      - name:kennedy-john-f
