- add:
    entry:
      id: cal.1961-02-27.school-aid
      when: Feb. 27
      date: '1961-02-27'
      thread: school-aid
      c: 'The administration''s school bill sent to Congress. Title I: $3.3 billion over three years in grants for
        building or teachers'' salaries, public schools only, $15 a pupil, a 10 percent set-aside, a penalty for
        States that do not keep up their effort. Titles II and III: aid to impacted areas made permanent, at half
        its amount.'
      n: '[[w.graham-uncertain-triumph]], 19.'
      src:
        c: 7b89d342
        rows:
        - 'w.graham-uncertain-triumph 19: all'
- add:
    entry:
      id: cal.1961-03-01.school-aid-2
      when: Mar. 1
      date: '1961-03-01'
      thread: school-aid
      c: 'News conference. No aid to private and parochial schools: "the Constitution clearly prohibits aid to the
        school, to parochial schools"; *Everson*, 5 to 4, aid to the child. The college program different: "We are
        aiding the student in the same way the GI bill of rights aided the student."'
      n: 'The President''s News Conference of March 1, 1961, [1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193)
        (Mar. 1, 1961). [[w.graham-uncertain-triumph]], 19–20. Check: Graham, 234 n.54, cites the Papers at 154–55,
        the conference of Mar. 8. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 2e4ab8c7
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193: all'
        - 'w.graham-uncertain-triumph 19–20: all'
- add:
    entry:
      id: cal.1961-03-07.school-aid
      when: Mar. 7
      date: '1961-03-07'
      thread: school-aid
      c: 'The higher education bills sent: academic buildings, $2.8 billion in loans over five years, and $892 million
        for 212,000 four-year scholarships by merit and need; church colleges eligible for both; a second bill for
        student housing.'
      n: 'Letter to the President of the Senate and to the Speaker of the House on Federal Aid to Colleges and Universities,
        [1961 Pub. Papers 151](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=209)
        (Mar. 7, 1961). [[w.graham-uncertain-triumph]], 19. Names: Kennedy.'
