      when: July 18
      date: '1961-07-18'
      thread: school-aid
      c: 'Kennedy calls Wilbur Cohen to the Oval Office on the news from Rules: "Wilbur, why couldn''t you get one
        more Republican on the Rules Committee to vote with us?" Cohen: "Mr. President, why can''t you get one more
        Catholic?" By Cohen''s account.'
      n: '[[w.graham-uncertain-triumph]], 22–23. Check: the day. To check: Wilbur Cohen to Hugh Davis Graham, Apr.
        20, 1981 (cited by [[w.graham-uncertain-triumph]], 23 n.58). Names: Kennedy, Cohen.'
      tags:
      - name:kennedy-john-f
      - name:cohen-wilbur-j
