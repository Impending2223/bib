      c: 'The President''s list of legislative priorities: aid to education seventh, aid to colleges ninth, after
        the antirecession and welfare measures, area redevelopment, the minimum wage and the feed-grain program.'
      n: '[[w.graham-uncertain-triumph]], 18. Names: Kennedy.'
