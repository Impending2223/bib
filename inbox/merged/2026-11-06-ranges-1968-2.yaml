        n: '[*New York Times*, Apr. 5, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/05/issue.html). [[w.schlesinger-robert-kennedy-and-his]], 873–75; [[w.palermo-in-his-own-right]], 179–81 (the news at Muncie; the rally at the Broadway Center basketball court, about a thousand; the words, from Guthman and Allen''s text); [[w.thomas-robert-kennedy]], 366–67 (Apple tells him on the plane; Indianapolis; his words); [[w.shesol-mutual-contempt]], 447 (against the pleas of his advisers and the police; "to tame the savageness of man and to make gentle the life of this world"); [[w.zelizer-fierce-urgency-of-now]], 296. Order: after the shooting, the news given the crowd. After King''s shooting at 6:01 p.m., Memphis: [[cal.1968-04-04.king]]. To check: [[w.clarke-last-campaign]]; Guthman and Allen, *RFK: Collected Speeches*, 355–58 (cited by [[w.palermo-in-his-own-right]], 181 n.91). See [[cal.1968-03-14.robert-kennedy]]. Names: Kennedy, King.'
