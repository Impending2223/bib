patch: order-of-battle
by: the war-table agent, Oct. 22, 2026
ops:
- add:
    entry:
      id: cal.thread.vietnam-order-of-battle
      s: Order of battle
      parent: vietnam
      c: The count of the enemy, MACV's order of battle against the CIA's estimate. The Saigon conference and the agreed figures; Bunker on the press briefing; MACV's new count; SNIE 14.3-67; the November briefings; Wheeler against airing the CIA's higher count; Helms and Wheeler.
    section: th
    after: cal.thread.vietnam-commitments
- add:
    entry:
      id: kjc.who.adams-samuel-a
      s: Adams, Samuel A.
      r: Analyst, CIA Office of Current Intelligence; at the order-of-battle conference in Saigon, Sept. 1967
    section: III.K
    after: kjc.who.adams-paul-l
- add:
    entry:
      id: kjc.who.davidson-phillip-b-jr
