- add:
    entry:
      id: cal.1967-09-09.vietnam-order-of-battle
      when: Sept. 9
      date: '1967-09-09'
      thread: vietnam-order-of-battle
      c: 'The order-of-battle conference in Saigon. MACV''s intelligence staff briefs Carver''s delegation from the CIA, DIA and INR on its revised count: main and local forces 119,000, administrative services 29,000, guerrillas 65,000, political cadre 85,000; 298,000 in all. No figure for the self-defense militia. The draft national estimate: 121,000; 40,000–60,000; 60,000–100,000; 90,000; others 120,000.'
      n: 'FRUS 1964–68, V, doc. [314](https://history.state.gov/historicaldocuments/frus1964-68v05/d314) (Carver to Helms, Sept. 11). [[w.adams-vietnam-cover-up]]; [[w.adler-reckless-disregard]]; [[w.wirtz-intelligence-to-please]]; [[w.wirtz-tet-offensive]]; [[w.adams-war-of-numbers]]; [[w.ford-cia-and-the-vietnam]]; [[w.allen-none-so-blind]]; [[w.hiam-who-the-hell-are]]; [[w.thayer-systems-analysis-view]], II, 7–10. Made public: the dispute, [[w.adams-vietnam-cover-up]]; the cables, FRUS 1964–68, V (2002). Names: Carver.'
      tags: [name:carver-george-a-jr, place:saigon]
- add:
    entry:
      id: cal.1967-09-10.vietnam-order-of-battle
      when: Sept. 10
      date: '1967-09-10'
      thread: vietnam-order-of-battle
      c: 'Second day in Saigon, the evidence on administrative services and guerrillas. Adams and Hyland present the draft estimate''s case; Davidson rejects it. The draft counts 17,000 administrative services at district level, from documents covering 14 districts; MACV accepts 5,000, from three.'
      n: 'FRUS 1964–68, V, doc. [314](https://history.state.gov/historicaldocuments/frus1964-68v05/d314). Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Adams, Hyland, Davidson.'
      tags: [name:adams-samuel-a, name:hyland-william-g, name:davidson-phillip-b-jr, place:saigon]
- add:
    entry:
      id: cal.1967-09-11.vietnam-order-of-battle
      when: Sept. 11
      date: '1967-09-11'
      thread: vietnam-order-of-battle
      c: 'Carver to Helms: the mission stalled. In his reading Westmoreland, with Komer''s encouragement, has in effect ordered that the enemy''s total not exceed 300,000.'
      n: 'FRUS 1964–68, V, doc. [314](https://history.state.gov/historicaldocuments/frus1964-68v05/d314), 0203Z. Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Carver, Helms, Westmoreland, Komer.'
      tags: [name:carver-george-a-jr, name:helms-richard, name:westmoreland-william, name:komer-robert-w]
- add:
    entry:
      id: cal.1967-09-13.vietnam-order-of-battle
      when: Sept. 13
      date: '1967-09-13'
      thread: vietnam-order-of-battle
      c: 'Carver with Westmoreland, Abrams, Komer and Sidle. The analysts then agree, Westmoreland endorsing: main and local forces 119,000; administrative services 35,000–40,000; guerrillas 70,000–90,000; military total 224,000–249,000; political cadre 75,000–85,000. Adams stays in Saigon on the political categories.'
      n: 'FRUS 1964–68, V, doc. [325](https://history.state.gov/historicaldocuments/frus1964-68v05/d325) (Carver to Helms, Sept. 13). Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Carver, Westmoreland, Abrams, Komer, Sidle, Adams.'
      tags: [name:carver-george-a-jr, name:westmoreland-william, name:abrams-creighton, name:komer-robert-w, name:sidle-winant, name:adams-samuel-a, place:saigon]
- add:
    entry:
      id: cal.1967-10-28.vietnam-order-of-battle
      when: Oct. 28
      date: '1967-10-28'
      thread: vietnam-order-of-battle
      c: 'Bunker to Rostow on the draft press briefing on the new order of battle, for Westmoreland and Komer too: leave out the self-defense forces dropped from the count; do not split the old 100,000–120,000 irregulars into guerrillas and militia. MACV''s new guerrilla figures, carried back, give 110,000–150,000 for Dec. 1966.'
      n: 'FRUS 1964–68, V, doc. [370](https://history.state.gov/historicaldocuments/frus1964-68v05/d370) (CIA to the White House, 1111Z). Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Bunker, Rostow, Westmoreland, Komer.'
      tags: [name:bunker-ellsworth, name:rostow-walt-w, name:westmoreland-william, name:komer-robert-w]
- add:
    entry:
      id: cal.1967-10-31.vietnam-order-of-battle
      when: Oct. 31
      date: '1967-10-31'
      thread: vietnam-order-of-battle
      c: 'MACV''s order of battle in its new form. The self-defense and secret self-defense forces and the political cadre dropped; administrative services and guerrillas raised. 235,852 in the military count (combat 116,552, administrative services 38,000, guerrillas 81,300), against 294,240 in the old.'
      n: 'MACV Monthly Order of Battle Summary, Oct. 31, 1967, as Systems Analysis gave it in the *Southeast Asia Analysis Report*, Dec. 1967: [Thayer, vol. 2, pp. 7–8](https://archive.org/details/DTIC_ADA051609/page/n17); [[w.thayer-systems-analysis-view]], II, 7–8. Made public: the Thayer volumes, declassified May 9, 1977 (DTIC''s cover). See [[cal.1967-09-09.vietnam-order-of-battle]].'
- add:
    entry:
      id: cal.1967-11-13.vietnam-order-of-battle
      when: Nov. 13
      date: '1967-11-13'
      thread: vietnam-order-of-battle
      c: 'SNIE 14.3-67, *Capabilities of the Vietnamese Communists for Fighting in South Vietnam*, as of Oct. 1: regular forces 118,000; guerrillas 70,000–90,000, reduced since early 1966; administrative services 35,000–40,000; at most 248,000. Political cadre 75,000–85,000 outside the total; the self-defense militia not counted.'
      n: 'FRUS 1964–68, V, doc. [397](https://history.state.gov/historicaldocuments/frus1964-68v05/d397) and its note. Made public: FRUS 1964–68, V (2002), in part. See [[cal.1967-09-09.vietnam-order-of-battle]].'
      tags: [name:helms-richard]
- add:
    entry:
      id: cal.1967-11-14.vietnam-order-of-battle
      when: Nov. 14
      date: '1967-11-14'
      thread: vietnam-order-of-battle
      c: 'Helms sends the estimate to Johnson: "sensitive and potentially controversial" for the "variance" of its figures with past estimates. He had thought of withholding it.'
      n: 'Helms to the President, Nov. 14, quoted in a note to FRUS 1964–68, V, doc. [397](https://history.state.gov/historicaldocuments/frus1964-68v05/d397). Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Helms, Johnson.'
      tags: [name:helms-richard, name:johnson-lyndon-b]
- add:
    entry:
      id: cal.1967-11-15.vietnam-order-of-battle
      when: Nov. 15
      date: '1967-11-15'
      thread: vietnam-order-of-battle
      c: 'Rostow to Johnson with the estimate: manpower the Communists'' main problem; guerrillas reduced since early 1966; the main forces held up by North Vietnamese replacements. Not in it, Wheeler''s count of combat-effective enemy battalions: all 123 in Oct. 1965, 87 of 162 in Oct. 1967.'
      n: 'FRUS 1964–68, V, doc. [399](https://history.state.gov/historicaldocuments/frus1964-68v05/d399), 12:15 p.m.; the President saw it. Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Rostow, Johnson, Wheeler.'
      tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:wheeler-earle]
- add:
    entry:
      id: cal.1967-11-22.vietnam-order-of-battle
      when: Nov. 22
      date: '1967-11-22'
      thread: vietnam-order-of-battle
      c: Westmoreland's press briefing gives the estimate's figures; the enemy's ability to carry on the war has declined.
      n: 'A note to FRUS 1964–68, V, doc. [397](https://history.state.gov/historicaldocuments/frus1964-68v05/d397). Check the briefing''s place and transcript. See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Westmoreland.'
      tags: [name:westmoreland-william]
- add:
    entry:
      id: cal.1967-11-24.vietnam-order-of-battle
      when: Nov. 24
      date: '1967-11-24'
      thread: vietnam-order-of-battle
      c: 'MACV''s briefing on the enemy order of battle. The self-defense forces "not a fighting force comparable to the guerrillas"; the political cadre "has no military function." The old count''s 100,000–120,000 irregulars had been one-third guerrillas, two-thirds self-defense.'
      n: 'MACV briefing on Enemy Order of Battle, Nov. 24, 1967, quoted in [Thayer, vol. 2, p. 8, table 1, notes d, e](https://archive.org/details/DTIC_ADA051609/page/n18); [[w.thayer-systems-analysis-view]], II, 8. Check whether a press briefing, and where. Made public: the Thayer volumes, declassified May 9, 1977 (DTIC''s cover). See [[cal.1967-09-09.vietnam-order-of-battle]].'
- add:
    entry:
      id: cal.1968-04-22.vietnam-order-of-battle
      when: Apr. 22
      date: '1968-04-22'
      thread: vietnam-order-of-battle
      c: 'Wheeler to Clifford on the order of battle. CIA''s analysts about to put the enemy at 480,000–615,000, the political infrastructure counted, twice the agreed figures; MACV will not count the "insurgency base," the self-defense forces and the like, 210,000–230,000 in CIA''s count. With Westmoreland: airing the figures would be "contrary to our national interest."'
      n: 'FRUS 1964–68, VI, doc. [202](https://history.state.gov/historicaldocuments/frus1964-68v06/d202) (CM-3230-68), and Wheeler''s covering note to Helms, Apr. 22. Made public: FRUS 1964–68, VI (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Wheeler, Clifford, Westmoreland, Helms.'
      tags: [name:wheeler-earle, name:clifford-clark, name:westmoreland-william, name:helms-richard]
- add:
    entry:
      id: cal.1968-05-03.vietnam-order-of-battle
      when: May 3
      date: '1968-05-03'
      thread: vietnam-order-of-battle
      c: 'Helms and Wheeler, with Carroll of DIA and Walsh of the CIA, on the estimates of enemy strength. Back to the drawing board: the CIA and DIA to work out new formats and definitions; Helms to withhold the CIA''s figures meanwhile; Wheeler to cut MACV''s order-of-battle reporting.'
      n: 'FRUS 1964–68, VI, doc. [220](https://history.state.gov/historicaldocuments/frus1964-68v06/d220), 10:30 a.m. Made public: FRUS 1964–68, VI (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Helms, Wheeler, Carroll, Walsh.'
      tags: [name:helms-richard, name:wheeler-earle, name:carroll-joseph-f, name:walsh-paul-v]
