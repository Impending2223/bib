patch: people-1968
by: agent
ops:
- add:
    section: III.K
    entry:
      id: kjc.who.bucher-lloyd-m
      s: Bucher, Lloyd M.
      r: Commander of the USS Pueblo, seized by North Korea Jan. 23, 1968; released with the crew Dec. 23, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.kitt-eartha
      s: Kitt, Eartha
      r: Singer and actress; at the White House luncheon of Jan. 18, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.ford-henry-ii
      s: Ford, Henry, II
      r: Chairman, Ford Motor Company; chairman, National Alliance of Businessmen, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.sanchez-hernandez-fidel
      s: Sánchez Hernández, Fidel
      r: President of El Salvador, 1967–72; host of the meeting of the Central American Presidents with Johnson, San Salvador, July 1968
- add:
    section: III.K
    entry:
      id: kjc.who.fort-jeff
      s: Fort, Jeff
      r: Leader of the Blackstone Rangers, Chicago; cited by the Senate for contempt, July 1968
- add:
    section: III.K
    entry:
      id: kjc.who.evans-fred
      s: Evans, Fred
      r: '"Ahmed" Evans, leader of the Black Nationalists of New Libya, Cleveland; tried for the deaths in the Glenville shootout of July 23, 1968'
- add:
    section: III.K
    entry:
      id: kjc.who.davis-rennie
      s: Davis, Rennie
      r: A coordinator of the National Mobilization Committee to End the War in Vietnam at the Democratic convention, Chicago, 1968; a defendant in the conspiracy trial, 1969–70
- add:
    section: III.K
    entry:
      id: kjc.who.hoffman-abbie
      s: Hoffman, Abbie
      r: A founder of the Youth International Party (Yippies), Chicago, 1968; witness before the House Un-American Activities Committee, Oct. 1968; a defendant in the conspiracy trial, 1969–70
- add:
    section: III.K
    entry:
      id: kjc.who.phillips-channing-e
      s: Phillips, Channing E.
      r: Washington minister; head of the District of Columbia delegation to the Democratic National Convention, 1968, and placed in nomination for President there
- add:
    section: III.K
    entry:
      id: kjc.who.pool-elizabeth
      s: Pool, Elizabeth
      r: Democratic candidate for her husband Joe Pool's seat, Texas 3d, in the special election of Aug. 24, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.evers-charles
      s: Evers, Charles
      r: NAACP field secretary, Mississippi, from 1963; candidate in the special election for the House, Mississippi 3rd, Feb.–Mar. 1968
- add:
    section: III.K
    entry:
      id: kjc.who.ray-james-earl
      s: Ray, James Earl
      r: Named by the FBI, Apr. 19, 1968, as the man sought for the murder of Martin Luther King Jr.; arrested in London, June 8, 1968; pleaded guilty, Mar. 10, 1969
- add:
    section: III.K
    entry:
      id: kjc.who.rudd-mark
      s: Rudd, Mark
      r: Chairman of the Columbia chapter of Students for a Democratic Society, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.kirk-grayson
      s: Kirk, Grayson
      r: President of Columbia University, 1953–68
- add:
    section: III.F
    entry:
      id: kjc.who.shapiro-samuel-h
      s: Shapiro, Samuel H.
      r: Lieutenant Governor of Illinois, 1961–68, acting governor in April 1968; Governor, 1968–69
- add:
    section: III.K
    entry:
      id: kjc.who.sirhan-sirhan-bishara
      s: Sirhan, Sirhan Bishara
      r: Shot Robert Kennedy at Los Angeles, June 5, 1968; convicted of his murder, Apr. 17, 1969
- add:
    section: III.K
    entry:
      id: kjc.who.hayakawa-s-i
      s: Hayakawa, S. I.
      r: Acting president of San Francisco State College, from Nov. 26, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.walker-daniel
      s: Walker, Daniel
      r: Director of the Chicago Study Team of the National Commission on the Causes and Prevention of Violence; its report, Rights in Conflict, Dec. 1, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.bailey-lloyd-w
      s: Bailey, Lloyd W.
      r: Republican presidential elector of North Carolina who voted for Wallace and LeMay, Dec. 16, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.kaiser-edgar-f
      s: Kaiser, Edgar F.
      r: Chairman of the President's Committee on Urban Housing, 1967–68
- add:
    section: III.K
    entry:
      id: kjc.who.eisele-donn-f
      s: Eisele, Donn F.
      r: Astronaut; command module pilot, Apollo 7, Oct. 1968
- add:
    section: III.K
    entry:
      id: kjc.who.cunningham-r-walter
      s: Cunningham, R. Walter
      r: Astronaut; lunar module pilot, Apollo 7, Oct. 1968
- add:
    section: III.K
    entry:
      id: kjc.who.smith-tommie
      s: Smith, Tommie
      r: Sprinter; Olympic champion at 200 meters, Mexico City, Oct. 16, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.carlos-john
      s: Carlos, John
      r: Sprinter; bronze medalist at 200 meters, Mexico City, Oct. 16, 1968
- add:
    section: III.K
    entry:
      id: kjc.who.brundage-avery
      s: Brundage, Avery
      r: President, International Olympic Committee, 1952–72
