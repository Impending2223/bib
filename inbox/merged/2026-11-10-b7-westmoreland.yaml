        when: Mar., early
        date: 1968-03
        thread: vietnam-205000
        c: 'Wheeler, at the request of Clifford''s task force, puts its questions to Westmoreland: what military and other objectives more forces would advance; what dangers they would avoid; what goals they would achieve; whether the South Vietnamese forces could grow further. Westmoreland, who thinks them answered when Wheeler was in Saigon, makes no strong case. By Westmoreland''s account.'
