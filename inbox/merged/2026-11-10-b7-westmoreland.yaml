      section: '196709'
  - add:
      entry:
        id: cal.1967-10.vietnam-operations-2
        when: Oct.
        date: 1967-10
        thread: vietnam-operations
        c: 'American troops capture an enemy document on an offensive in western Kon Tum: annihilate a major American unit, draw more American troops to the Highlands, destroy much of the South Vietnamese army, "make a concentrated offensive effort in co-ordination with other units in various battle areas throughout South Vietnam"; supplies for attacks far from the bases, "in preparation for a prolonged battle." By Westmoreland''s account.'
        n: '[[w.westmoreland-soldier-reports]], 239, 313 (Abrams cables its contents to Westmoreland in Washington in November). To check: the document (quoted by [[w.westmoreland-soldier-reports]], 239). Check: the day; the book gives "a fortnight before the Dak To fight began." See [[cal.1967-11-03.vietnam]]. Names: Westmoreland.'
        tags: [name:westmoreland-william, place:kontum]
        src:
          c: de4cad37
          rows:
            - 'w.westmoreland-soldier-reports 239, 313: all'
            - 'via x.1967.enemy-document-offensive-western-kontum: all'
      section: '196710'
  - add:
      entry:
        id: cal.1967-11-19.vietnam-tet
        when: Nov. 19
        date: '1967-11-19'
        thread: vietnam-tet
        c: 'Men of the 101st Airborne capture a document, an outline for a major offensive: "Central Headquarters concludes that the time has come for a direct revolution and that the opportunity for a general offensive and general uprising is within reach." By Westmoreland''s account.'
        n: '[[w.westmoreland-soldier-reports]], 313–14. To check: the document (quoted by [[w.westmoreland-soldier-reports]], 313–14). Made public: by the Mission at Saigon, [[cal.1968-01-05.vietnam-tet]]. Names: Westmoreland.'
        tags: [name:westmoreland-william]
        src:
          c: 22757c85
          rows:
            - 'w.westmoreland-soldier-reports 313–14: all'
            - 'via x.1967.document-captured-101st-airborne-general-offensive: all'
      section: '196711'
  - add:
      entry:
        id: cal.1968-01-31.vietnam-tet-6
        when: Jan. 31
        date: '1968-01-31'
        thread: vietnam-tet
        c: Quảng Trị City. Forsythe, Komer's military deputy, after a night as a rifleman in the MACV advisory compound, learns of an enemy force coming from the southeast, where the defenses have a gap. At his asking Rattan's brigade of the 1st Cavalry Division sends a battalion, less than an hour before the North Vietnamese; more than 400 of them killed. By Westmoreland's account.
        n: '[[w.westmoreland-soldier-reports]], 331. Check: the day; the book gives none. See [[cal.1968-01-31.vietnam-tet]]. Names: Forsythe, Komer, Westmoreland.'
        tags: [name:forsythe-george-i, name:komer-robert-w, name:westmoreland-william, place:quang-tri]
