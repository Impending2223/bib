ops:
  - cite:
      id: cal.1964-03-08.vietnam
      item: '[[w.westmoreland-soldier-reports]], 64 (McNamara, sent with instructions to embrace Khánh "both figuratively and literally," puts his arms round him at a public appearance at Huế; the visit not dated)'
      units: B
  - cite:
      id: cal.1964-08-12.vietnam-2
      item: '[[w.westmoreland-soldier-reports]], 82, 85 (Hop Tac, his program, outward from Saigon into the six provinces round it, the concept and the plan the III Corps advisers''; "a slow start in September 1964")'
      units: A, C
  - cite:
      id: cal.1964-12-12.laos
      item: '[[w.westmoreland-soldier-reports]], 110 (Barrel Roll, flights over the panhandle with authority to attack targets of opportunity, two missions a week of four aircraft each; "Operations began on December 14, 1964")'
      units: A
  - variant:
      id: cal.1964-12-12.laos
      unit: A
      witness: w.westmoreland-soldier-reports
      reads: Operations began on December 14, 1964
      at: '110'
  - check:
      id: cal.1964-12-12.laos
      text: 'Check: Westmoreland too dates the first flights Dec. 14 (110).'
  - cite:
      id: cal.1965-10-26.vietnam-3
      item: '[[w.westmoreland-soldier-reports]], 137 (Clifford, of the Foreign Intelligence Advisory Board, in Saigon in 1965: Westmoreland, piqued at a B-52 target refused, asks him to tell Washington that if it had no more confidence in him "somebody should come up with another commander"; interference eased after)'
      units: B, D
  - cite:
      id: cal.1966-10-20.vietnam-force-levels
      item: '[[w.westmoreland-soldier-reports]], 194 (his request after a staff study, not dated: about 30 percent more troops, to level off near 500,000, and a corps of three divisions held in reserve in the United States)'
      units: A
  - check:
      id: cal.1966-10-20.vietnam-force-levels
      text: 'Check: whether the request Westmoreland gives at 194, about 500,000 men and a corps in reserve, undated, is this one.'
  - cite:
      id: cal.1967-09-07.vietnam
      item: '[[w.westmoreland-soldier-reports]], 200 (McNamara at a press conference in Washington, not dated, announces "grandiose plans for the barrier"; the reporters'' "McNamara Line")'
      units: A
  - cite:
      id: cal.1967-02-19.vietnam-force-levels
      item: '[[w.westmoreland-soldier-reports]], 201 (Rosson, his chief of staff, to assemble a planning group for a provisional division-size task force of three brigades from II and III Corps, to take over the southern provinces of I Corps and let the Marines go north; not dated)'
      units: A
  - cite:
      id: cal.1967-04-12.vietnam-force-levels
      item: '[[w.westmoreland-soldier-reports]], 201 (the plan put into effect "sooner than I had anticipated")'
      units: A
  - cite:
      id: cal.1967-09-22.vietnam-force-levels-2
      item: '[[w.westmoreland-soldier-reports]], 201 (redesignated the "Americal Division"; not dated)'
      units: A
  - cite:
      id: cal.1967-04-24.vietnam-operations
      item: '[[w.westmoreland-soldier-reports]], 201–2 (the morning of Apr. 24, a Marine patrol meets the enemy near Khe Sanh, the start of the "hill fights"; Hill 861 "fell fairly readily")'
      units: A
  - check:
      id: cal.1967-04-24.vietnam-operations
      text: 'Check: Westmoreland gives a platoon-size patrol and a second sent to relieve it, attacked by at least a company; thirteen Marines killed, the bulk of both patrols getting away (202).'
  - cite:
      id: cal.1967-05-05.vietnam-operations
      item: '[[w.westmoreland-soldier-reports]], 202 ("the next day," after the attack on Làng Vây of May 4, the Marines secure the last of the three hills)'
      units: A
  - cite:
      id: cal.1967-01-08.vietnam
      item: '[[w.westmoreland-soldier-reports]], 205 (a corps-size sweep of the Iron Triangle in January, the 1st and 25th Divisions, the 173d Airborne Brigade and the 11th Armored Cavalry; the tunnels, command posts, mess halls, munitions factories and quarters destroyed; more than 500,000 documents taken, maps of Saigon with the American headquarters and billets marked among them)'
      units: C
  - variant:
      id: cal.1967-01-26.vietnam-operations
      unit: A
      witness: w.westmoreland-soldier-reports
      reads: the American troops stayed for seventeen days
      at: '205'
  - check:
      id: cal.1967-01-26.vietnam-operations
      text: 'Check: Westmoreland gives seventeen days, some 700 of the enemy killed and about as many captured or rallied (205).'
  - cite:
      id: cal.1967-02-22.vietnam
      item: '[[w.westmoreland-soldier-reports]], 206 (in February, twenty-two American and four South Vietnamese battalions round three sides of War Zone C, COSVN the objective; a battalion of the 173d by parachute, "the only airborne assault launched by American troops during the war")'
      units: A-B
  - variant:
      id: cal.1967-05-14.vietnam-operations
      unit: D
      witness: w.westmoreland-soldier-reports
      reads: According to official North Vietnamese accounts, 13,500 American and South Vietnamese troops were killed; the actual total was 282
      at: '206'
  - check:
      id: cal.1967-05-14.vietnam-operations
      text: 'Check: Westmoreland gives the 282 as the American and South Vietnamese dead, against Hanoi''s 13,500; close to 3,000 of the enemy killed; lost, twenty-one armored personnel carriers, three tanks and five guns, against Hanoi''s 800 armored vehicles and 119 guns (206).'
  - cite:
      id: cal.1967-02-13.vietnam-operations
      item: '[[w.westmoreland-soldier-reports]], 207 (from early 1967, the 1st Cavalry Division''s operations in Bình Định against North Vietnamese regulars out of the Đỗ Xá, through much of the year, more than 3,000 of the enemy killed; Pershing not named)'
      units: A
  - cite:
      id: cal.1967-01-09.vietnam-operations-2
      item: '[[w.westmoreland-soldier-reports]], 209 (Viet Cong sappers sink a dredge early in January 1967; under salvage it goes down in deep water in heavy seas; the base named Đồng Tâm by Westmoreland)'
      units: A
  - cite:
      id: cal.1966-12-19.vietnam-force-levels
      item: '[[w.westmoreland-soldier-reports]], 208 (the 9th Infantry Division, Eckhardt commanding, met ashore at Vũng Tàu by Westmoreland; a brigade to Bear Cat, one with the headquarters near Mỹ Tho, the third the Riverine Force; not dated)'
      units: A
  - cite:
      id: cal.1966-03-10.vietnam
      item: '[[w.westmoreland-soldier-reports]], 169 (the military council headed by Thiệu and Kỳ removes Thi from I Corps)'
      units: A
  - cite:
      id: cal.1966-03-11.vietnam-struggle
      item: '[[w.westmoreland-soldier-reports]], 169 (within a day of Thi''s relief thousands of students in Đà Nẵng demand his reinstatement; the Buddhists'' rally a few days later; at Huế students seize the radio station)'
      units: A
  - cite:
      id: cal.1966-03-24.vietnam-struggle
      item: '[[w.westmoreland-soldier-reports]], 170 (at Westmoreland''s suggestion Lodge tells Kỳ that 228 Americans had died in I Corps in the three weeks of "this ''foolishness''")'
      units: A
  - variant:
      id: cal.1966-03-24.vietnam-struggle
      unit: A
      witness: w.westmoreland-soldier-reports
      reads: 228 Americans in the I Corps region had died fighting for South Vietnam during the three weeks
      at: '170'
  - check:
      id: cal.1966-03-24.vietnam-struggle
      text: 'Check: Westmoreland gives the 228 as the American dead in I Corps (170).'
  - cite:
      id: cal.1966-03-25.vietnam-struggle
      item: '[[w.westmoreland-soldier-reports]], 170 (a committee to draft a constitution within two months, a referendum, elections perhaps before the end of 1966; "if anything, that appeared to feed the dissidence")'
      units: A-B
  - cite:
      id: cal.1966-04-12.vietnam-struggle
      item: '[[w.westmoreland-soldier-reports]], 171 (the military council promises amnesty and decrees free elections for a constituent assembly within three to five months)'
      units: B
  - cite:
      id: cal.1966-05-17.vietnam-struggle
      item: '[[w.westmoreland-soldier-reports]], 172–73 (Cao and Hamblen at Huế in an American helicopter; an ARVN lieutenant''s two pistol shots hit the tail rotor; at Hamblen''s signal the door gunner kills him; not dated)'
      units: A
  - cite:
      id: cal.1966-05-21.vietnam-struggle
      item: '[[w.westmoreland-soldier-reports]], 175 (Cao authorizes the attacks on the pagodas, armed camps; resistance soon collapses; "By May 23 Danang was calm")'
      units: B-C
  - cite:
      id: cal.1966-05-21.vietnam-struggle-4
      item: '[[w.westmoreland-soldier-reports]], 174 (Wheeler asks his opinion on withholding all American military and economic aid and pulling the troops into base camps; not dated)'
      units: C
  - cite:
      id: cal.1966-05-22.vietnam-struggle
      item: '[[w.westmoreland-soldier-reports]], 174–75 (withholding the aid "quite clearly was inadvisable"; his messages to Washington urging "calm and patience")'
      units: C
  - cite:
      id: cal.1966-05-26.vietnam
      item: '[[w.westmoreland-soldier-reports]], 175 (Trí Quang, fled to Huế, steps up the unrest there, the USIS library sacked and burned; not dated)'
      units: A
  - cite:
      id: cal.1966-06-01.vietnam-struggle
      item: '[[w.westmoreland-soldier-reports]], 175 (the American consulate at Huế sacked and burned; not dated)'
      units: A
  - cite:
      id: cal.1966-06-08.vietnam
      item: '[[w.westmoreland-soldier-reports]], 175 (the military council elects ten civilians to its membership; not dated)'
      units: D
  - cite:
      id: cal.1966-06-15.vietnam-struggle
      item: '[[w.westmoreland-soldier-reports]], 175 (an ARVN airborne force into Huế June 15, establishing control "with considerable restraint")'
      units: B
  - cite:
      id: cal.1967-05-09.vietnam
      item: '[[w.westmoreland-soldier-reports]], 214–15 (the President''s formal approval May 9, "five days after Komer and General Abrams had joined the staff in Saigon"; Komer his deputy for pacification alone, with the personal rank of ambassador; CORDS)'
      units: A-C, E
  - variant:
      id: cal.1967-04-06.vietnam
      unit: B
      witness: w.westmoreland-soldier-reports
      reads: Not until May 9, five days after Komer and General Abrams had joined the staff in Saigon
      at: '215'
  - check:
      id: cal.1967-04-06.vietnam
      text: 'Check: Westmoreland has Komer and Abrams join his staff in Saigon May 4 (215).'
  - cite:
      id: cal.1967-11-19.vietnam
      item: '[[w.westmoreland-soldier-reports]], 233–34 (from Camp David to Washington the next morning, with Bunker on *Meet the Press*; there he elaborates his estimate of when the American withdrawals might begin)'
      units: A
  - cite:
      id: cal.1967-10-17.vietnam-operations
      item: '[[w.westmoreland-soldier-reports]], 237 (a battalion of the 1st Division ambushed south of Lộc Ninh, its commander, Lieutenant Colonel Terry Allen Jr., and its operations officer, Holleder, killed; 103 of the Viet Cong killed; not dated)'
      units: B-C
  - variant:
      id: cal.1967-10-17.vietnam-operations
      unit: D
      witness: w.westmoreland-soldier-reports
      reads: 'they took a heavy toll of the American battalion: 55 killed, 66 wounded'
      at: '237'
  - check:
      id: cal.1967-10-17.vietnam-operations
      text: 'Check: Westmoreland gives 55 Americans killed and 66 wounded (237).'
  - cite:
      id: cal.1967-10-29.vietnam-operations
      item: '[[w.westmoreland-soldier-reports]], 237 (Oct. 29, a heavy mortar barrage, then a Viet Cong regiment against three CIDG companies, a Regional Forces company and a Popular Forces platoon; into the headquarters compound''s outer perimeter before two ARVN companies help drive it out; again two days later)'
      units: A-D
  - check:
      id: cal.1967-10-29.vietnam-operations
      text: 'Check: Westmoreland gives at least 852 of the Viet Cong killed against 50 American and South Vietnamese dead, the town calm eleven days after the first attack, a brigade of the 1st Division sweeping the plantations (237).'
  - variant:
      id: cal.1967-11-19.vietnam-operations
      unit: B
      witness: w.westmoreland-soldier-reports
      reads: The fiercest ground engagement developed on November 17 southwest of Dak To when a battalion of the 173d Airborne Brigade found a large enemy force entrenched on the slopes and atop a peak known as Hill 875
      at: '238'
  - check:
      id: cal.1967-11-19.vietnam-operations
      text: 'Check: Westmoreland dates the battalion''s fight for Hill 875 from Nov. 17, five days to secure the hill (238).'
  - variant:
      id: cal.1967-11-23.vietnam-operations
      unit: E
      witness: w.westmoreland-soldier-reports
      reads: The ARVN lost 73 men killed, the Americans, 289
      at: 238–39
  - check:
      id: cal.1967-11-23.vietnam-operations
      text: 'Check: Westmoreland gives the fighting round Đắk Tô sixteen South Vietnamese and American battalions, 1,400 North Vietnamese dead, 289 Americans and 73 South Vietnamese killed (238–39).'
  - cite:
      id: cal.1967-12-21.vietnam
      item: '[[w.westmoreland-soldier-reports]], 239, 314 (Johnson to members of the Australian Cabinet in late December, reflecting Westmoreland''s advice and his cable of Dec. 20: "The enemy is building his forces in the South ... We face dark days ahead.")'
      units: B
  - cite:
      id: cal.1967-12-29.vietnam
      item: '[[w.westmoreland-soldier-reports]], 312 (word dropped at a diplomatic reception in Hanoi and at diplomatic posts elsewhere: if the bombing stopped, North Vietnam would "hold talks"; the reception dated Dec. 30)'
      units: A
  - variant:
      id: cal.1967-12-29.vietnam
      unit: A
      witness: w.westmoreland-soldier-reports
      reads: at a diplomatic reception in Hanoi on December 30, 1967
      at: '312'
  - check:
      id: cal.1967-12-29.vietnam
      text: 'Check: Westmoreland dates the reception Dec. 30 (312).'
  - cite:
      id: cal.1968-01-03.vietnam
      item: '[[w.westmoreland-soldier-reports]], 312 (the bombing in and around Hanoi halted during a Romanian representative''s visit there)'
      units: B
  - check:
      id: cal.1968-01-03.vietnam
      text: 'Check: Westmoreland places the Romanian''s visit to Hanoi in mid-January (312).'
  - cite:
      id: cal.1968-02-01.vietnam
      item: '[[w.westmoreland-soldier-reports]], 328 ("on the second day of the fighting," near the An Quang pagoda; Adams''s photograph; NBC''s film)'
      units: A-C
  - cite:
      id: cal.1968-02-05.vietnam-tet-2
      item: '[[w.westmoreland-soldier-reports]], 328 (seven American battalions moved into the city or its outskirts over two days; "By February 5 ... Saigon was free of all but small enemy groups")'
      units: B
  - cite:
      id: cal.1968-02-24.vietnam
      item: '[[w.westmoreland-soldier-reports]], 330 (the Tiger Force of Trưởng''s division pulls down the enemy''s flag over the Citadel twenty-five days after the fighting began and runs up the Republic''s; resistance over the next day; eleven South Vietnamese and three Marine battalions, the 1st Cavalry outside the city; sixteen enemy battalions; over 5,000 of the enemy killed in the city, 3,000 nearby; 142 Marines and 384 South Vietnamese killed)'
      units: A-B
  - cite:
      id: cal.1968-02-24.vietnam
      item: '[[w.westmoreland-soldier-reports]], 330–31 (the graves found over the weeks and months after; more than 2,800 residents executed or buried alive; Miller of USIA and Niles of NBC International among the Americans killed; Manhard taken prisoner)'
      units: C
  - cite:
      id: cal.1968-02-18.vietnam-tet
      item: '[[w.westmoreland-soldier-reports]], 332 ("a sharp flurry of local attacks, mostly with mortars and rockets, on February 18")'
      units: C
  - variant:
      id: cal.1968-02-29.vietnam-tet
      unit: B
      witness: w.westmoreland-soldier-reports
      reads: By the end of February ... the enemy toll rose to 37,000 killed
      at: '332'
  - check:
      id: cal.1968-02-29.vietnam-tet
      text: 'Check: Westmoreland gives, Jan. 29–Feb. 11, 32,000 of the enemy killed and 5,800 captured, 1,001 Americans and 2,082 South Vietnamese and allied troops killed; 37,000 of the enemy killed by the end of February; 600,000 new refugees (332).'
  - cite:
      id: cal.1968-02-07.vietnam
      item: '[[w.westmoreland-soldier-reports]], 341 (nine Soviet-built PT-76 tanks with infantry; the CIDG troops and their advisers under Willoughby driven out; of twenty-four Americans, fourteen out, all but three of them wounded, ten killed; dated "just after midnight on February 6")'
      units: A
  - variant:
      id: cal.1968-02-07.vietnam
      unit: A
      witness: w.westmoreland-soldier-reports
      reads: Out of the darkness just after midnight on February 6 trundled nine Soviet-built PT-76 tanks
      at: '341'
  - check:
      id: cal.1968-02-07.vietnam
      text: 'Check: Westmoreland dates the attack just after midnight Feb. 6, and his conference at Đà Nẵng "the next day, February 7" (341).'
  - check:
      id: cal.1968-03-08.vietnam-205000-4
      text: 'Check: Westmoreland recalls a message from Wheeler that he could not fill the "request" for lack of troops, and answers that he had asked no immediate deployment but a Marine regiment and a brigade of the 82d Airborne (357); whether it is the message these comments answer.'
  - cite:
      id: cal.1968-05-05.vietnam
      item: '[[w.westmoreland-soldier-reports]], 360 (from May 5, "a sharply reduced version of the Tet offensive," mostly rockets and mortars on towns, cities and American installations; Saigon the most visible, guerrilla bands holding out in Cholon, fires set in the shanty towns)'
      units: B
  - cite:
      id: cal.1968-05-12.vietnam-operations
      item: '[[w.westmoreland-soldier-reports]], 360 (Khâm Đức: a thrust from Laos; Cushman at first reinforces the camp; Westmoreland orders it evacuated, the Air Force pilots under the single manager flying it out)'
      units: A, C
