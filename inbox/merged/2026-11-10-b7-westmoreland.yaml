  - add:
      entry:
        id: cal.1967-09.vietnam-hanoi
        when: Sept.
        date: 1967-09
        thread: vietnam-hanoi
        c: 'Giáp, an article in an official North Vietnamese journal: a protracted war of attrition, the forces to be conserved. By Westmoreland''s account, which calls it "camouflage, planned deception."'
        n: '[[w.westmoreland-soldier-reports]], 313. Check: the journal, the title and the day. Names: Võ Nguyên Giáp, Westmoreland.'
