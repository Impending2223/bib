        date: '1966-05-20'
        thread: vietnam-macv
        also: [vietnam-struggle]
        c: Westmoreland back in Saigon, ordered back from Honolulu by McNamara after a day or so. He had told Rusk he would rather not hurry back, lest the Americans seem unduly concerned at Kỳ's move on Đà Nẵng. By Westmoreland's account.
        n: '[[w.westmoreland-soldier-reports]], 171–72. See [[cal.1966-05-12.vietnam-macv]]. Names: Westmoreland, McNamara, Rusk, Nguyễn Cao Kỳ.'
