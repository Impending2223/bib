        when: Jan. 31
        date: '1968-01-31'
        thread: vietnam-tet
        c: Long Bình. A Viet Cong regiment strikes the base's perimeter, the offensive's one major attack on an American base but the shared airfields; Davison's 199th Infantry Brigade intercepts part of it and surrounds the rest. By Westmoreland's account.
        n: '[[w.westmoreland-soldier-reports]], 331. Check: the day; the book gives none. See [[cal.1968-01-31.vietnam-tet]]. Names: Westmoreland.'
        tags: [name:westmoreland-william, place:long-binh]
        src:
          c: 181aa476
          rows:
            - 'w.westmoreland-soldier-reports 331: all'
      section: '196801'
  - add:
      entry:
        id: cal.1968-02-01.vietnam-tet
        when: Feb. 1
        date: '1968-02-01'
        thread: vietnam-tet
        c: 'COSVN orders the offensive continued: "We failed to seize a number of primary objectives and to completely destroy mobile and defensive units of the enemy. We also failed to hold the occupied areas. In the political field we failed to motivate the people to stage uprisings and break the enemy''s oppressive control."'
        n: '[[w.westmoreland-soldier-reports]], 332. To check: COSVN''s order of Feb. 1, 1968 (quoted by [[w.westmoreland-soldier-reports]], 332). Check: where and when the order was made public. See [[cal.1968-01-31.vietnam-tet]].'
        tags: []
        src:
          c: 4ee42444
          rows:
            - 'w.westmoreland-soldier-reports 332: all'
            - 'via x.1968-02-01.cosvn-order-offensive-to-continue: all'
      section: '196802'
