        date: '1968-02-07'
        thread: vietnam-khe-sanh
        c: 'Đà Nẵng, soon after daylight. Westmoreland''s conference of the Marine and Army commanders in I Corps: Cushman to give helicopters for a relief force of CIDG troops and Special Forces advisers to bring out Làng Vây''s survivors. Seven enemy divisions in the north; after almost two hours of reports Westmoreland gives orders to Cushman''s subordinate units himself, and sends Koster and Robertson out to plan coordinated offensive action against the threat to the Đà Nẵng airfield. By Westmoreland''s account.'
        n: '[[w.westmoreland-soldier-reports]], 341–42. See [[cal.1968-02-07.vietnam]]. Names: Westmoreland, Cushman.'
        tags: [name:westmoreland-william, name:cushman-robert-e-jr, place:da-nang]
