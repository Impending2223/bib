      when: June 1
      date: '1965-06-01'
      thread: desegregation-schools
      also:
      - civil-rights-organizations
      c: 'Chicago, the Coordinating Council, planning the boycott of June 10–11 and the march. Gregory for an extended boycott
        and a summer of demonstrations in the Loop; a demonstration for Johnson at the Cook County Democrats dinner, Gregory
        drafting a telegram to him; the march from Soldier Field to City Hall and the Board of Education; Raby: a "socially
        disruptive march."'
      n: '[[w.anderson-confronting-the-color-line]], 154. Names: Gregory, Raby, Johnson.'
      src:
        c: c7289659
        rows:
