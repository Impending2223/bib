      also:
      - labor
      c: Chicago, late Tuesday night. The action committee, members of the agenda committee with it, four hours on the UAWs
        request to suspend the demonstrations while talks are explored. Raby leaves thinking it agreed to divert the next
        days march from Bogan to the Real Estate Boards offices; Bevel, Jackson and Lafayette think the decision theirs.
