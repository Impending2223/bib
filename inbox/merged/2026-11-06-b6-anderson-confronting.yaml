      when: Oct.
      date: '1961-10'
      thread: desegregation-schools
      c: 'Chicago. The regional Parent Teacher Association joins the Citizens Schools Committee in asking an independent survey
        of the schools educational and administrative policies. Willis: "we do not need a survey to tell us that we could
        use more teachers."'
      n: '[[w.anderson-confronting-the-color-line]], 88. To check: Chicago Tribune, 17 October 1961 (cited by [[w.anderson-confronting-the-color-line]],
        88 n.42). Check: the day. Names: Willis.'
