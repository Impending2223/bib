      date: '1966-04-23'
      thread: civil-rights-organizations
      also:
      - open-housing
      c: Chicago, the Coordinating Council. The steering committee would spend the Freedom Festivals money on staff, a coordinator
        of community organization, a research coordinator and two organizers in public housing; CORE and the West Chatham
        Community Improvement Association, their projects unfunded, against. Approved 13 to 10. A retreat on SCLC and the
        steering committee.
      n: '[[w.anderson-confronting-the-color-line]], 192–93.'
