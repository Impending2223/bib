      c: 'Chicago, the agenda committee. The Coordinating Councils account: $7,400 spent in July, $2,200 in August, $1,200
        in September, a balance of $2,400 on Oct. 1; a drive for $100,000 before Christmas proposed, nothing coming of it.
        McDermott: "The movement has not operated in a truly democratic fashion." A committee on electing the agenda committee
        and the Coordinating Councils future.'
      n: '[[w.anderson-confronting-the-color-line]], 281.'
