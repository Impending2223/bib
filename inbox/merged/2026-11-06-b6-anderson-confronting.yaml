      thread: open-housing
      c: 'Chicago, the Chicago Freedom Movements action committee, which ran the summers demonstrations: the summit agreement
        "very bad"; the task "to show that the various agencies will not abide by the implications of the agreement." The
        agenda committee criticized for taking the decisions without consulting; the march on Cicero given up too easily.'
      n: '[[w.anderson-confronting-the-color-line]], 274. To check: Chicago Freedom Movement, Action Committee minutes, 30
        August 1966 (cited by [[w.anderson-confronting-the-color-line]], 274 n.10).'
