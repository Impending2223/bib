      when: Feb.
      date: '1966-02'
      thread: open-housing
      c: 'Chicago. 1321 South Homan, the building SCLC and the West Side Federation took in trusteeship, found to be the only
        income of an eighty-one-year-old invalid. John B. Bender, its owner, wishes King well: "All I want ... is maybe a
        thousand dollars more than the mortgage."'
      n: '[[w.anderson-confronting-the-color-line]], 191. To check: Chicago Daily News, 25 February 1966; Chicago Sun-Times,
        28 April 1966 (cited by [[w.anderson-confronting-the-color-line]], 191 n.62). See [[cal.1966-02-23.open-housing]].
        Check: the day. Names: King.'
