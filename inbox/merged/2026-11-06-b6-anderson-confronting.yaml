      thread: open-housing
      c: 'Chicago, the agenda committee, Friday morning, on the movements structure: a four-part plan, a Chicago Freedom Movement
        Assembly for general policy, its members named by King and Raby. The rallys unpaid bills $18,000 against $10,000 in
        the treasury; under 1 percent of its pledges collected.'
