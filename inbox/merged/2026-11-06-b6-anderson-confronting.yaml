      when: June 17
      date: '1965-06-17'
      thread: civil-rights-organizations
      also:
      - desegregation-schools
      c: Chicago, an expanded meeting of the Coordinating Council, after a week of marches and arrests. Civil disobedience
        raised as a question of principle, buried under tactics and put off.
      n: '[[w.anderson-confronting-the-color-line]], 158.'
