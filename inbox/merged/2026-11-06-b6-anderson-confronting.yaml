      date: '1965-10-02'
      thread: civil-rights-organizations
      also:
      - desegregation-schools
      c: 'Chicago, the Coordinating Council, on Keppels deferral of the funds. Weinberg: "HEW has started to accept some of
        our arguments"; "The only thing that will satisfy us will be a change in our school board policy." Telegrams of support
        to Keppel; a press conference planned; delegates urge confronting Pucinski.'
      n: '[[w.anderson-confronting-the-color-line]], 180. Names: Keppel, Pucinski.'
