      date: '1965-09-02'
      thread: civil-rights-organizations
      also:
      - desegregation-schools
      - open-housing
      c: 'Chicago, the Coordinating Councils delegates, on the conference of Aug. 31. They support the Englewood residents
        suit under Title VI against urban renewal. The education panels Fall Freedom Program: the movement to give the schools
        standardized tests itself; Hal Baron of the Urban League on Operation Spotlights failure.'
      n: '[[w.anderson-confronting-the-color-line]], 175.'
      src:
        c: b94c9534
