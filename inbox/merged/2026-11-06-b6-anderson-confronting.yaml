      when: Dec.
      date: '1962-12'
      thread: desegregation-schools
      c: 'Chicago. Willis puts the neighborhood school to the Board of Education for a decision of policy: he prefers it,
        but will prepare a transfer plan using all the space available by Jan. 29, 1963, if the board wishes. The board, after
        several weeks, does not.'
      n: '[[w.anderson-confronting-the-color-line]], 96. To check: Chicago Daily News, 28 December 1962 (cited by [[w.anderson-confronting-the-color-line]],
        96 n.76). Check: the day; the day of the boards answer. Names: Willis.'
