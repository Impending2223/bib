      thread: civil-rights-organizations
      also:
      - open-housing
      c: Chicago, the Coordinating Councils delegates, first meeting since January, on the Freedom Festivals funds. Guidelines
        adopted; the Citizens Housing Committees federal suit against the Englewood renewal partly funded; a "congress" called
        for May 7 to put the program to the public.
