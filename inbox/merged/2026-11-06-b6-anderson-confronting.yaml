      thread: civil-rights-organizations
      also:
      - desegregation-schools
      - king
      c: Chicago, the Coordinating Councils steering committee, Bevel and Bernard Lafayette of the American Friends Service
        Committee present, on organizing parents around the test scores. Lafayette for a "reverse boycott," students refusing
        to leave their classrooms; Bevel for slide shows on the jobs not waiting for the ghetto schools graduates.
      n: '[[w.anderson-confronting-the-color-line]], 177. To check: CCCO meeting, 20 June 1965 [as the note gives it, for
        the steering committee of Sept. 6] (cited by [[w.anderson-confronting-the-color-line]], 177 n.20).'
