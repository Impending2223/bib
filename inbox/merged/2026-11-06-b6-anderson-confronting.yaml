      when: Feb. 27
      date: '1965-02-27'
      thread: civil-rights-organizations
      c: Chicago, the Coordinating Council. The delegates set out to restore and expand the coalition; Timuel Black reports
        the national leaders anger that Chicago has not supported the groups in the South. A new planning committee, about
        half of it new recruits against Willis.
      n: '[[w.anderson-confronting-the-color-line]], 151–52.'
