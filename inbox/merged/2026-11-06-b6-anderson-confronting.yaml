- add:
    entry:
      id: cal.1964-08.desegregation-schools-2
      when: Aug.
      date: '1964-08'
      thread: desegregation-schools
      c: 'Chicago. Willis, by mid-August, adds to the Willis–Whiston permissive transfer plan a proviso that the board may
        consider paid transportation for transfer students under special conditions, and a study of clustering schools: the
        most of the Hauser report that can be done without new funds. Whiston to the Friends of the Chicago Schools Committee,
        asking the board to reconsider its transportation policy: support the board "or be dissolved."'
      n: '[[w.anderson-confronting-the-color-line]], 142. To check: Chicago Daily News, 21 August 1964; Chicago Defender,
        22–28 August 1964; Chicago Daily Defender, 8, 9 September 1964 (cited by [[w.anderson-confronting-the-color-line]],
        142 n.30). Check: the day. Names: Willis.'
      src:
        c: ac970c5c
        rows:
