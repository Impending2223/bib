      thread: open-housing
      also:
      - civil-disorders
      c: 'Chicago, the agenda committee, on the Sun-Timess report that most of Daleys new police-community relations committee
        think police brutality beyond them. Jesse Jackson: what can it be expected to do; McDermott: "recommend a civilian
        police review board"; Bevel: not worth fighting for.'
      n: '[[w.anderson-confronting-the-color-line]], 221. Names: Daley.'
