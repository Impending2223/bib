      thread: civil-rights-organizations
      also:
      - open-housing
      c: Chicago, the agenda committee agrees to hold a retreat of the Coordinating Council, on its "structural and functional
        difficulties."
      n: '[[w.anderson-confronting-the-color-line]], 287.'
