      when: Sept. 15
      date: '1966-09-15'
      thread: open-housing
      c: 'Chicago, the agenda committee, before the delegates meeting: the mayors injunction on marches; bail and defense
        for the summers marchers; the civil rights bill of 1966, a telegram to Percy proposed. It approves William Moyers
        proposal that the Commission on Human Relations test two hundred realtors a week.'
      n: '[[w.anderson-confronting-the-color-line]], 278–79. Names: Percy.'
