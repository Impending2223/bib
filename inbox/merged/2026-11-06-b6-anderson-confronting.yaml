      date: '1966-04-09'
      thread: civil-rights-organizations
      also:
      - open-housing
      c: 'Chicago, the Coordinating Council. A motion to print the treasurers report, $40,000 from the Freedom Festival: three
        roll calls, a motion to overrule Raby; printed. Frustration with SCLC; a delegate: "we invited those people here and
        they are beginning to treat us like kids."'
      n: '[[w.anderson-confronting-the-color-line]], 192. Names: Raby.'
