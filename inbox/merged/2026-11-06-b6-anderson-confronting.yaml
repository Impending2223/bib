      thread: civil-rights-organizations
      also:
      - elections-1964
      c: 'Chicago. The organizing meeting of the Coordinating Council Political Action Committee, more than fifty organizations.
        William Robinson, State representative, back from the Republican platform hearings in San Francisco, on what to expect
        of a convention set on Goldwater. No consensus: a boycott of the polls, voter registration, endorsing the Democratic
        ticket.'
      n: '[[w.anderson-confronting-the-color-line]], 140. Names: Goldwater.'
