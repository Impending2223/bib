      date: '1965-04-24'
      thread: civil-rights-organizations
      also:
      - desegregation-schools
      c: 'Chicago, the Coordinating Council, after the Good Friday march: "we have an $800 deficit from 16 April and that
        counts $500 of unpaid pledges." No decisions; some for civil disobedience at once, others for waiting on King. The
        council does not meet again for more than a month.'
      n: '[[w.anderson-confronting-the-color-line]], 153.'
      src:
