      thread: civil-rights-organizations
      c: 'Chicago, the Coordinating Councils steering committee. Raby: "the fight is going out of the dissidents," but proceed
        as if they were strong, for the delegates meeting of Nov. 12. The follow-up committees report leaked: the summit agreements
        implementation a "slowdown."'
      n: '[[w.anderson-confronting-the-color-line]], 289. Names: Raby.'
