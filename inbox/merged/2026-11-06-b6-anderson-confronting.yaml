      when: July 11
      date: '1964-07-11'
      thread: civil-rights-organizations
      also:
      - desegregation-schools
      c: 'Chicago, the Coordinating Council, on Williss answer to the Hauser report. Meyer Weinberg: "The civil rights movement
        always loses because we let Willis define the problem and make the proposals—to which we only react"; the Civil Rights
        Act against the boards use of federal funds. A committee named to develop a program.'
      n: '[[w.anderson-confronting-the-color-line]], 139. Names: Willis.'
