      when: Nov. 2
      date: '1965-11-02'
      thread: civil-rights-organizations
      also:
      - king
      c: 'Chicago, the Coordinating Councils delegates. Bevel reports on his organizing; a delegate: his efforts "seem to
        bypass CCCO and make unilateral decisions which could lead to dissension." Andrew Young: "We cant contribute at your
        [CCCOs] level, but we can organize in the streets."'
      n: '[[w.anderson-confronting-the-color-line]], 185. Names: Andrew Young.'
