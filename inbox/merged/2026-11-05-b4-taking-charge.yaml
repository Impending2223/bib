      n: '[Johnson and Jack Brooks, 4:53 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-jack-brooks-november-24-1963), Tape K6311.02 (Miller Center). [[w.taking-charge]], 27. Names: Brooks, Johnson, Oswald.'
