- add:
    entry:
      id: cal.1963-11-22.succession-9
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Air Force One. Johnson and Mrs. Johnson by radio patch to Nellie Connally at Parkland Hospital: the Governor, after surgery, "going to be all right."'
      n: '[[w.taking-charge]], 18–19. Names: Johnson, Lady Bird Johnson, Connally.'
      tags:
