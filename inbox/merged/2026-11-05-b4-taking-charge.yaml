      thread: succession
      c: 'Bundy to Johnson by telephone, 5:52 p.m.: de Gaulle, Erhard, Douglas-Home and, apart, Mikoyan coming to the funeral; Tuesday morning for brief meetings. Johnson: let State say what it wants.'
      n: '[Johnson and McGeorge Bundy, 5:52 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-mcgeorge-bundy-november-23-1963), Tape K6311.01A (Miller Center). [[w.taking-charge]], 26. Names: Bundy, Johnson, de Gaulle, Erhard, Douglas-Home, Mikoyan.'
