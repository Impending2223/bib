- add:
    entry:
      id: cal.1963-11-22.succession-10
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'The Executive Office Building, Room 274. Johnson telephones the former Presidents. To Eisenhower, 7:10 p.m., after his message through Bundy: "I need you more than ever now." Eisenhower to come over after viewing the casket the next day.'
      n: '[[w.taking-charge]], 19–20. Names: Johnson, Eisenhower, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:eisenhower-dwight-d
      - name:bundy-mcgeorge
