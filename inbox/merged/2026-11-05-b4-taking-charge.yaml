      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: Air Force One, twenty-eight minutes out of Dallas. Johnson's first call after the oath, by radio patch, to Rose Kennedy at Hyannis Port; Mrs. Johnson on the line.
      n: '[[w.taking-charge]], 17–18. Names: Johnson, Lady Bird Johnson.'
