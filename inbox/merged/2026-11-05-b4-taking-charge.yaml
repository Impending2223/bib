      c: 'Johnson and Sorensen by telephone, 10:10 p.m. Moyers first: a budget of $100 to $101.5 billion until the tax bill passes; the tax bill before civil rights. Johnson: Byrd will report no bill over $100 billion. Galbraith''s draft for the address liked. Sorensen: the leaders had decided to move civil rights first.'
      n: '[Johnson and Theodore Sorensen, 10:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ted-sorensen-november-26-1963), Tape K6311.02 (Miller Center). [[w.taking-charge]], 38–41. Names: Johnson, Sorensen, Moyers, Byrd, Galbraith.'
