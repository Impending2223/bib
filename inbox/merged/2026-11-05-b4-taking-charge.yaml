      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      c: 'Johnson to Dirksen by telephone, 1:50 p.m.: a Joint Session the day after the funeral, probably Wednesday. Dirksen: "reassuring to the country."'
      n: '[Johnson and Everett Dirksen, 1:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-november-23-1963), Tape K6311.01A (Miller Center). [[w.taking-charge]], 24. Names: Johnson, Dirksen.'
