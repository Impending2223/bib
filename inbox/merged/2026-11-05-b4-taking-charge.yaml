      when: Nov. 22
      date: '1963-11-22'
      thread: democratic-party
      c: 'Johnson to Maguire, treasurer of the Democratic National Committee, by telephone, 9:10 p.m.: "want to rely on you more than he did"; the same relationship as before, and frank counsel.'
      n: '[Johnson and Richard Maguire, 9:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-maguire-november-22-1963), Tape K6311.01A (Miller Center). [[w.taking-charge]], 21. Names: Johnson.'
