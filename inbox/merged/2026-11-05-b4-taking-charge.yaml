- add:
    entry:
      id: cal.1963-11-23.assassination-4
      when: Nov. 23
      date: '1963-11-23'
      thread: assassination
      c: 'Hoover to Johnson by telephone, 10:01 a.m.: the rifle bought by money order from a Chicago firm, $21, sent to "A. Hidell," an alias of Oswald''s; the case "not very, very strong." The man at the Soviet embassy in Mexico City under Oswald''s name, by the tape and photograph, not Oswald.'
      n: '[Johnson and J. Edgar Hoover, 10:01 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-november-23-1963), Tape K6311.01A (Miller Center). [[w.taking-charge]], 22–23. Names: Hoover, Johnson, Oswald.'
      tags:
      - name:hoover-j-edgar
      - name:johnson-lyndon-b
      - name:oswald-lee-harvey
      src:
        c: 98dfe932
        rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-november-23-1963: A'
        - 'w.taking-charge 22–23: all'
        - 'via x.1963-11-23.johnson-j-edgar-hoover-telephone-1001: all'
