      when: Nov. 24
      date: '1963-11-24'
      thread: assassination
      c: 'Bundy to Johnson by telephone, 5:10 p.m.: after the burial Mrs. Kennedy to receive the heads of delegations briefly, then Johnson at the State Department; Tuesday''s appointments not yet to be announced, State''s bureaus at odds with the White House.'
      n: '[Johnson and McGeorge Bundy, 5:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-mcgeorge-bundy-november-24-1963), Tape K6311.02 (Miller Center). [[w.taking-charge]], 28. Names: Bundy, Johnson, Jacqueline Kennedy.'
