# cal.1961-12-05.africa: Schlesinger, RFK, 560
- add-words:
    id: cal.1961-12-05.africa
    after: end
    words: Robert Kennedy sits along the wall with the staff.
    item: '[[w.schlesinger-robert-kennedy-and-his]], 560'
- add-words:
    id: cal.1961-12-05.africa
    after: end
    words: 'Kennedy: Dillon and the Attorney General seem opposed; the Attorney General has not spoken, but he can feel the hot breath of his opinion.'
    text: '[FRUS 1961–63, XXI, doc. 240](https://history.state.gov/historicaldocuments/frus1961-63v21/d240)'
- variant:
    id: cal.1961-12-05.africa
    on: 'Kennedy: Dillon and the Attorney General seem opposed; … his opinion.'
    witness: w.schlesinger-robert-kennedy-and-his
    reads: '"The Attorney General has not yet spoken but I can feel the cold wind of his disapproval on the back of my neck."'
    at: '560'
# cal.1962-04-04.vietnam: Schlesinger, RFK, 709
- add-words:
    id: cal.1962-04-04.vietnam
    after: end
    words: 'By Schlesinger, Galbraith offers "phased withdrawal" as part of a larger deal with the Soviet Union, which might get Hanoi to call off the Viet Cong. Lemnitzer, the Chairman of the Joint Chiefs, denounces Galbraith for wishing the United States "to seek disengagement from what is now a well-known commitment" in Southeast Asia.'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 709'
- names:
    id: cal.1962-04-04.vietnam
    add:
    - Lemnitzer
    tags:
    - name:lemnitzer-lyman-l
