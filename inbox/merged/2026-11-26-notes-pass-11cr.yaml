      src:
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 709: 2, 3, 4'
        - 'via w.schlesinger-robert-kennedy-and-his 709 n.42: 3'
        - 'w.selverstone-kennedy-withdrawal 69–70: 2, 3'
        - 'via w.selverstone-kennedy-withdrawal 70 n.85: 3'
