# --- the audit (notes/notes-pass/audit-11.md): splits, fields, variants, the gloss, and the dated acts the pages report ---
- add:
    entry:
      id: cal.1961-08-18.latin-america
      when: Aug. 18
      date: '1961-08-18'
      time: 1961-08-18T05:00Z
      time_approx: true
      time_zone: America/Montevideo
      place: montevideo
      thread: latin-america
      also: [cuba]
      c: 'Montevideo, a birthday party for the Brazilian delegate to the Free Trade Association, about 2 a.m. Guevara asks to speak with Goodwin; they talk in a sitting room, an Argentine and a Brazilian interpreting, for almost three hours, to about 6 a.m. Goodwin: no authority to negotiate, he will listen and report. Guevara thanks the United States for the invasion. His terms: no return of the expropriated factories and banks, but payment in trade; no political alliance with the East; free elections after the revolution is institutionalized, a one-party system; no attack on Guantanamo; the revolution''s activity "in other countries" open to discussion; an interim modus vivendi. In return the United States to stop efforts to overthrow the government by force and lift the embargo. Begin, he proposes, with subordinate issues, such as the hijacking of airplanes.'
      n: 'Goodwin to Kennedy, Aug. 22, [FRUS 1961–63, X, doc. 257](https://history.state.gov/historicaldocuments/frus1961-63v10/d257) ("The conversation took place the evening of August 17 at 2 A.M."; "On Thursday we arrived in Montevideo"). [[w.goodwin-remembering-america]], 196–202 (Goodwin''s account: the drive to Montevideo the day after the signing; Guevara at the party "at the early Latin hour of 2 a.m."; Juan de Onis sent out; almost three hours; almost 6 a.m.). [[w.schlesinger-robert-kennedy-and-his]], 542 (the talk); [[w.fursenko-one-hell-of-a]], 142 (the talk). Check: Fursenko and Naftali put the Argentines'' cornering of Goodwin at a birthday party for a Brazilian delegate on Aug. 16 ([[w.fursenko-one-hell-of-a]], 142, citing Goodwin''s memorandum of Aug. 22). Check: the day; Goodwin''s memoir has the drive to Montevideo "the next day" after the signing and the talk that night, Aug. 18–19, the memorandum the night of Thursday, Aug. 17. See [[cal.1961-08-17.latin-america]]. Names: Goodwin, Guevara.'
      tags:
      - name:goodwin-richard-n
      - name:guevara-ernesto
      variants:
      - field: date
        value: '1961-08-19'
        witness: w.goodwin-remembering-america
        reads: the talk the night after the drive to Montevideo, "the next day" after the signing
        at: 196–97
