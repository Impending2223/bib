# cal.1961-04-20.cuba-bay-of-pigs: Wofford, 352; Schlesinger, Thousand Days, 337
- add-words:
    id: cal.1961-04-20.cuba-bay-of-pigs
    after: end
    words: 'Kennedy asks, "What would you do now in Cuba?" Nixon: "I would find proper legal cover, and I would go in." Kennedy: if the United States moves on Cuba, Khrushchev may move on Berlin.'
    item: '[[w.wofford-of-kennedys-and-kings]], 352'
- add-words:
    id: cal.1961-04-20.cuba-bay-of-pigs
    after: end
    words: 'Kennedy, by Nixon again: no move in Laos, 5,000 miles away, if none in Cuba, 90 miles away.'
    item: '[[w.schlesinger-thousand-days-1965]], 337'
- names:
    id: cal.1961-04-20.cuba-bay-of-pigs
    add:
    - Khrushchev
    tags:
    - name:khrushchev-nikita-s
# cal.1961-04-21.cuba-bay-of-pigs-3: Goodwin, Remembering America, 181
- add-words:
    id: cal.1961-04-21.cuba-bay-of-pigs-3
    after: end
    words: 'By Goodwin''s notes, Kennedy opens: "The happiest people in government today are the ones who can say they didn''t know anything about it." He will make a short opening statement and take no more questions on Cuba. He wants the blame kept from the CIA after James Reston''s story in the *New York Times* that the operation was not properly staffed and had no NSC meeting; the story to be leaked that the Joint Chiefs studied and approved it. He could fire Allen Dulles, but Dulles helps keep the Republicans off his back. If "we just sit tight for about three weeks, things will cool off."'
    item: '[[w.goodwin-remembering-america]], 181'
- names:
    id: cal.1961-04-21.cuba-bay-of-pigs-3
    add:
    - Reston
    - Dulles
    tags:
    - name:reston-james
    - name:dulles-allen-w
