- edit:
    id: cal.1966-03-01.vietnam
    base: 0d68e5ae
    set:
      follows:
      - cal.1966-03-01.vietnam-congress-2
      - cal.1966-03-01.vietnam-2
      n: 'The vote to table: [112 Cong. Rec. 4404](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=82)
        (1966) (Senate, Mar. 1, 1966). [[w.mann-grand-delusion]], 504–05 (Johnson to Mansfield; the votes); [[w.branch-at-canaans-edge]],
        451; [[w.woods-fulbright]], 410 ($4.8 billion; two weeks before the Senate, thirty-five Senators speaking
        against the war or its tactics). [[w.rusk-as-i-saw-it-1990]], 501, 546 (only five against tabling). Check:
        the pages of the other votes. [FRUS 1964–68, IV, doc. 87](https://history.state.gov/historicaldocuments/frus1964-68v04/d87)
        (Johnson to Mansfield by telephone, 9:42 a.m.: the motion to table must not "imply any dilution" of the
        resolution). [[w.gibbons-u-s-government-and]], IV, 251–59. Check: Branch dates the vote Mar. 2. After the
        debate on Morse''s amendment (the Record) and Ball''s lunch with the four Senators, before the vote by Gibbons''s
        account. To check: [[w.berman-william-fulbright-and-the]]; [[w.evans-lyndon-b-johnson]], 597 (cited by [[w.branch-at-canaans-edge]],
        451). See [[cal.1966-01-19.vietnam]]; [[cal.1966-02-04.vietnam]]. Names: Morse, Gruening, Fulbright, McCarthy,
        Young.'
