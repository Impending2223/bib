      when: Feb. 11
      date: '1967-02-11'
      thread: vietnam-air-war
      c: 'Wheeler, Chairman of the Joint Chiefs, advises Sharp and Westmoreland that operations against the North will not resume at the end of the Tet truce, a decision at first put
        down to Kosygin''s presence in London, "until late on the 12th of February."'
      n: '[[w.macv-command-history-1967]], 494–95 (Feb. 11, "the CJCS"; no hour). See [[cal.1967-02-09.vietnam-air-war]]. Names: Wheeler, Sharp, Westmoreland.'
      tags:
      - name:wheeler-earle
      - name:sharp-u-s-grant
      - name:westmoreland-william
      - ok:fields-place
