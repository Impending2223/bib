      c: Zhou Enlai's secretary Sun Yue takes Wang Guangmei back from Tsinghua after her self-criticism on the gymnasium's balcony.
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 692 (Zhou sends the secretary Sun Yue, 孫岳, who takes her back after the evening at the West Field); [[w.zhou-enlai-nianpu-1949-2020]],
        III, 106 (Jan. 6, 1967; 得知 ... 蒯大富 ... 骗出中南海后，立即派秘书孙岳赶至清华大学要回王光美，并打电话催蒯大富放人). Made public: 2020. Check: the nianpu puts Zhou''s sending of Sun Yue at once on learning of it,
        with the call to Kuai; Yang has Sun Yue fetch her after the evening. See [[cal.1967-01-06.china-leadership-4]]. The order: after [[cal.1967-01-06.china-leadership-16]], Yang
        Jisheng, II, 692. Names: Sun Yue, Zhou Enlai, Wang Guangmei.'
      tags:
