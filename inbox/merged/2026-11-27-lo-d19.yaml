- add:
    entry:
      id: cal.1967-02-09.china-seizures
      when: Feb. 9
      date: '1967-02-09'
      thread: china-seizures
      also:
      - china-mao-cr
      - china-army
      follows:
      - cal.1967-02-09.china-leadership
      c: 'Mao, to Lin Biao, on the revised draft: changed more; to be passed at the party-government-army meeting under Zhou first. He adds article five (even a counter-revolutionary
        body''s masses are mostly good; bad men few) and article six (stand firm; though tens of thousands demonstrate, surround, beat, seize, insult, no matter; fear is the great error).'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 9, 1967. [[w.jianguo-yilai-mao-zedong]], XVIII, 463–465 (Feb. 9, 1967; the second note, to Lin Biao, 二月九日下午, on the revised draft
        (note 1: the draft Lin sent Feb. 7 had four articles); read on the page image; his articles five and six and the retitling to the "truly" revolutionary left, printed from his revised copy; issued Feb. 10; note
        3: Ye Jianying to Lin Biao, Feb. 11, article three read out only and the paper sent as five). Made public: 2013. To check: Ye Jianying, letter to Lin Biao of Feb. 11, 1967 on
        issuing the rules against firing at will as five articles, article three read at the meeting only (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 465 n.3). Check: which of the
        two readings added articles five and six; the Wengao (463–64, n.1) and the nianpu say only that Mao added them in reviewing. See [[cal.1967-02-09.china-leadership]]. Names: Mao
        Zedong, Lin Biao, Zhou Enlai.'
      tags:
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
      time_range:
      - 1967-02-09T04:00Z
      - 1967-02-09T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
      range_basis: record
- add:
    entry:
      id: cal.1967-02-11.china-seizures
      when: Feb. 11
      date: '1967-02-11'
      thread: china-seizures
      also:
      - china-mao-cr
      - china-army
      follows:
      - cal.1967-02-11.china-leadership
      c: 'Mao, at 10 p.m., on Zhou''s text of the draft rules, which the liaison meeting revised the night of Feb. 10: "to the Premier, issue." Seven articles: study and carry out the
        eight-article order of Jan. 28; the "four bigs" by stages; none for army units below, naval bases, the Peking garrison and special units; no link-ups with them.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 11, 1967 (晚上). [[w.jianguo-yilai-mao-zedong]], XVIII, 468–471 (Feb. 11, 1967; Mao''s second note, 二月十一日二十二时, "To the Premier, issue,"
        on the text the liaison meeting revised the night of Feb. 10, issued that day, read on the page image; a third note, "Do so," on the supplementary rules Lin sent Feb. 25, issued
        Feb. 27); [[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 10, 1967; the provisions adopted at Zhou''s liaison meeting and sent to Mao and Lin Biao; Mao on the 11th: issue as
        is); [[w.macfarquhar-maos-last-revolution]], 201 (the Military Commission''s seven-point regulations, issued Feb. 11, which Chen Zaidao read as leave to dissolve rebel bodies
        in the army); [[w.yang-jisheng-tiandi-fanfu]], I, 423–424 (among the 17 documents of the Military Commission''s enlarged meeting: the Commission''s rules on the Cultural Revolution
        in the leading organs above the army level, issued Feb. 11); [[w.liu-jixian-ye-jianying-nianpu]], II, 959 (Feb. 11, 1967; the Several Provisions, approved by Mao, issued). Made
        public: 1988. To check: Military Affairs Commission regulations, Feb. 11, 1967, in [[w.wenhua-dageming-yanjiu-ziliao]], I, 290–291 (cited by [[w.macfarquhar-maos-last-revolution]],
        201 n.14). See [[cal.1967-02-11.china-leadership]]. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      place: peking
      tags:
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
      time: 1967-02-11T14:00Z
      time_zone: Asia/Shanghai
- add:
    entry:
      id: cal.1967-05-31.china-wuhan
      when: May 31
      date: '1967-05-31'
      thread: china-wuhan
      also:
      - china-mao-cr
      follows:
      - cal.1967-05-31.china-leadership
      c: Mao writes "do it" on each of the two draft decisions, of the Center, the State Council, the Military Commission and the Cultural Revolution Group, on military control of the
        Ministry of Railways and the Ministry of Communications (trial drafts). The Center issues both that day.
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 99–100 (May 31, 1967; Mao''s two notes, "Do as proposed" (照办), after he heard Zhou on military control of the Railways and Communications
        ministries; no hour; the same day the two documents are issued; read on the page image). [[w.zedong-mao-zedong-nianpu]], VI, May 31, 1967 (the decisions issued that day with
        Mao''s note 照办). Made public: 2013. To check: Central Committee, State Council, Military Commission and Cultural Revolution Group, Decision on military control of the Ministry
        of Railways, trial draft, May 31, 1967 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 99 n.1a); Central Committee, State Council, Military Commission and Cultural Revolution
        Group, Decision on military control of the Ministry of Communications, trial draft, May 31, 1967 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 99 n.1a); Central Committee, State
        Council, Military Commission and Cultural Revolution Group, Order on firmly maintaining the revolutionary order of the railways and transport (Guanyu jianjue weihu tielu jiaotong
        yunshu geming zhixu de mingling 关于坚决维护铁路、交通运输革命秩序的命令), June 1, 1967 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 100 n.1). See [[cal.1967-05-31.china-leadership]]. Names: Mao
        Zedong.'
      tags:
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-01.china-wuhan
      when: June 1
      date: '1967-06-01'
      thread: china-wuhan
      also:
      - china-mao-cr
      c: The Center, the State Council, the Military Commission and the Cultural Revolution Group issue an order on firmly keeping the revolutionary order of the railways and transport.
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 100 n.1 (June 1, 1967, the order 《关于坚决维护铁路、交通运输革命秩序的命令》; read on the page image). [[w.zedong-mao-zedong-nianpu]], VI, May 31, 1967 (the
        order of June 1); [[w.zhou-enlai-nianpu-1949-2020]], III, 155 n.1 (the letter to the railway workers Zhou proposed on May 31 is this order of June 1; read on the page image). Made public: 2013. See [[cal.1967-05-31.china-leadership]]; [[cal.1967-05-31.china-wuhan]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-09.vietnam-air-war
      when: Feb. 9
      date: '1967-02-09'
      thread: vietnam-air-war
      follows:
      - cal.1967-02-09.vietnam
      c: 'Sharp, CINCPAC, citing the supply effort, the firing on the *Stoddard* and the F-100 reconnaissance aircraft shot down, asks the Joint Chiefs for authority to resume Sea Dragon
        interdiction with naval gunfire and air strikes. Later that day he sends a summary of the spot reports: some 30,000 tons of supplies to move during the truce, 300 division days
        of support for the enemy''s forces in the South.'
      n: '[[w.macv-command-history-1967]], 494 (CINCPAC''s request, and, "later, on 9 February," his summary of the spot reports to the JCS: "I urgently request authority"). See
        [[cal.1967-02-09.vietnam]]. The order: after [[cal.1967-02-09.vietnam]], MACV, 494 ("Citing the increased enemy logistic effort"). Names: Sharp.'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1967-02-17.vietnam-air-war-4
      when: Feb. 17
      date: '1967-02-17'
      place: saigon
      thread: vietnam-air-war
      also:
      - vietnam-force-levels
      follows:
      - cal.1967-02-17.vietnam-air-war
      c: 'Westmoreland answers Wheeler, MAC 1658: the ground war cannot be "significantly" speeded, its pace set by "intelligence, troop availability, and helicopter support"; 550,000
        for 1967 still valid against the 470,000 approved; "if Pandora''s Box is to be opened and the ceiling set by Program IV is to be voided," he will restudy and ask more.'
      n: '[[w.gibbons-u-s-government-and]], IV, 559 (the same day; no hour). To check: Westmoreland to Sharp and Wheeler, MAC 1658, Feb. 17, 1967, Westmoreland Papers, Message Files,
        CMH (cited by [[w.gibbons-u-s-government-and]], IV, 559 n.5). See [[cal.1967-02-17.vietnam-air-war-2]]. Names: Westmoreland, Wheeler.'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
- add:
    entry:
      id: cal.1967-03-16.vietnam-supplemental-3
      when: Mar. 16
      date: '1967-03-16'
      place: washington
      thread: vietnam-supplemental
      also:
      - congress
      - defense
      c: The House passes the war's supplemental appropriation, H.R. 7123, some $12 billion, [385–11](https://voteview.com/rollcall/RH0900022), after Brown's amendment, no funds of the
        act for a plan to invade the North with ground forces "except in time of war," is refused on a division, 2–123.
      n: '[113 Cong. Rec. 6889](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt6/pdf/GPO-CRECB-1967-pt6-1-1.pdf#page=23) (Mar. 16, 1967). [113 Cong. Rec. 6886–89](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt6/pdf/GPO-CRECB-1967-pt6-1-1.pdf#page=20)
        (1967) (House, Mar. 16, 1967). [[w.gibbons-u-s-government-and]], IV, 601–02 (the House); [[w.barrett-uncertain-warriors]], 64–65 (H.R. 7123, "over $12 billion," through the House
        Mar. 16, 385 to 11; Brown''s amendment against an invasion of the North with ground forces without a declaration of war lost 123 to 2; the eleven against named, 65 n.10). Gibbons dates the House''s passage May 16 (IV, 602), a misprint: Voteview
        and the Record''s day, Mar. 16. See [[cal.1967-03-16.vietnam-supplemental]]. Names: Brown.'
      tags:
      - name:brown-george-e-jr
- add:
    entry:
      id: cal.1967-03-28.vietnam-thant-2
      when: Mar. 28
      date: '1967-03-28'
      place: washington
      thread: vietnam-thant
      follows:
      - cal.1967-03-28.vietnam-thant
      c: 'Johnson, in his toast at the luncheon for Prime Minister Maiwandwal of Afghanistan, on Thant''s proposal: the United States welcomed it Mar. 15 and answered it Mar. 18, "positive,"
        "definitive," "affirmative." Of Hanoi''s refusal by radio: "We respectfully disagree."'
      n: 'Toasts of the President and Prime Minister Maiwandwal, [1967 Pub. Papers 396](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=464) (Mar. 28,
        1967) (the toast at 2:17 p.m., at the luncheon in the State Dining Room; "This morning as we were talking, the Secretary General ... made public"). See [[cal.1967-03-28.vietnam-thant]].
        Names: Johnson, U Thant.'
      tags:
      - name:johnson-lyndon-b
      - name:u-thant
      time: 1967-03-28T19:17Z
      time_zone: America/New_York
- add:
    entry:
      id: cal.1967-03-29.mississippi
      when: Mar. 29
      date: '1967-03-29'
