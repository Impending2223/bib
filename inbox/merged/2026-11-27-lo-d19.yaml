      id: cal.1966-11-28.transportation
      when: Nov. 28
      date: '1966-11-28'
      place: washington
      thread: transportation
      also:
      - court
      c: 'Stuart Saunders, staying at the Hay-Adams Hotel across Lafayette Square from the White House, telephones Califano. Califano: the President worked on the problem over the weekend,
        and Saunders will be pleased with the government''s brief.'
      n: '[[w.califano-triumph-and-tragedy-of]], 163 ("the Monday morning after Thanksgiving"). To check: Califano''s telephone log, Nov. 28, 1966 (cited by [[w.califano-triumph-and-tragedy-of]],
        163 n.36). See [[cal.1966-11-25.transportation]]. Names: Califano.'
      tags:
      - name:califano-joseph-a-jr
      time_range:
      - 1966-11-28T11:00Z
      - 1966-11-28T17:00Z
      time_band: morning
      time_zone: America/New_York
      range_basis: record
