    set:
      c: Zhou Enlai, for the 25th anniversary of Mao's Yan'an Talks on literature and art, directs the arts troupes of the army, navy and air force in Peking to perform jointly. Li Zuopeng
        and others, backing one side, work against it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149–150 (May 13, 1967, the item after); [[w.yang-jisheng-tiandi-fanfu]], I, 429–430 (that evening Zhou, Chen Boda, Xiao Hua and Zhang
        Xiuchuan 張秀川 are at the Great Hall; Zhou, not knowing Mao''s and Lin''s mind, works on both sides'' heads for a joint performance; Liu Suyuan comes and tells him Mao backs her
        side; Zhou stands on a chair: "do not storm the performance; to storm it again is to storm Chairman Mao''s revolutionary line!" and sends Chen Boda and Xiao Hua to the theater
        to stop it). Made public: 2020. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xin shiji chubanshe 新世紀出版社, Hong Kong, 2011), 529 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 430 n.32).
        Split under R17: the nianpu (III, 150, read on the page image) goes on to the fight of May 13, which is [[cal.1967-05-13.china-leadership-5]], and to Zhou''s criticism of the
        two sides, now an entry. Names: Zhou Enlai, Li Zuopeng.'
