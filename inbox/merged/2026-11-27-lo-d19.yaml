      id: cal.1967-02-10.vietnam-air-war
      when: Feb. 10
      date: '1967-02-10'
      thread: vietnam-air-war
      c: 'No authority to resume Sea Dragon having come, Sharp adds that trucks are moving, a pilot reporting that the road "looked like the New Jersey Turnpike," and more logistics craft:
        the enemy''s resupply will succeed if its tempo is let go on. He directs a maximum air effort, right after the Tet truce, against the off-loading and storage areas Sea Dragon has
        found; the commanders plan strikes for first light Feb. 12, three carrier air wings and the seven destroyers of the Sea Dragon area.'
      n: '[[w.macv-command-history-1967]], 494 (Feb. 10; "Concurrently"). See [[cal.1967-02-09.vietnam-air-war]]. Names: Sharp.'
      tags:
      - name:sharp-u-s-grant
