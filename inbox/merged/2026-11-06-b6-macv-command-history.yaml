    entry:
      id: cal.1964-08-05.vietnam-macv
      when: Aug. 5
      date: '1964-08-05'
      thread: vietnam-macv
      c: MACV's J5 completes an outline defense plan, Contingency Defense Plan PT-2-64, against a surprise attack on Huế by
        a force massed in Laos astride Route 9 or in the mountains west and southwest of the city. Meant for the RVNAF; overtaken
        by the Gulf of Tonkin and the covert buildup, it is shelved and never sent to the High Command.
      n: '[[w.macv-command-history-1964]], 161 & n.28. To check: Contingency Defense Plan PT-2-64, MACJ5, Aug. 1964, file
        MACJ54 (cited by [[w.macv-command-history-1964]], 161 n.28).'
      src:
