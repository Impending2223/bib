    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 13, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 48 (Aug. 13, 1966; Zhou at the Central Work Conference under Lin Biao, who calls for a few months of uproar, a purge of "ghosts and monsters", and removals and promotions); [[w.macfarquhar-maos-last-revolution]], 98 (the day after the plenum closes, Lin Biao makes personal observations at a work conference); [[w.deng-xiaoping-nianpu-1904]], III, 1930 (Aug. 13–23, 1966; Deng at the Central Work Conference Lin Biao presides over to carry out the spirit of the Eleventh Plenum; the conference goes on criticizing Liu Shaoqi, and Deng too is criticized; after it Deng hands the work of the Central Investigation Department, which he oversaw, and other work to Kang Sheng); [[w.zhu-de-nianpu-xinbian]], III, 1956 (Aug. 13, 1966; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 Lin Biao 林彪 presides over); [[w.pu-weihua-zalan-jiu-shijie]], 201 (Aug. 13 to 17, so printed (Bu has Mao speak at the conference on Aug. 23, 219 n.53); to carry out the plenum; Mao talks with some to bring them round). The time is the first day''s, Ye Jianying''s morning (上午, [[w.liu-jixian-ye-jianying-nianpu]], II, 942). Made public: [[w.macfarquhar-maos-last-revolution]], 98 (2006). Circulated in China: [[w.gaoju-mao-zedong-sixiang]], 34 (a Red Guard compilation of leaders'' speeches, 1967; cited by [[w.macfarquhar-maos-last-revolution]], 98 n.62). To check: [[w.gaoju-mao-zedong-sixiang]], 34 (cited by [[w.macfarquhar-maos-last-revolution]], 98 n.62).'
      time_range:
      - 1966-08-12T22:00Z
      - 1966-08-13T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
