      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 15–18, 1967); [[w.macfarquhar-maos-last-revolution]], 208–209 (on the afternoons of July 15 to 18 Zhou, with Xie Fuzhi and Wang Li, chairs meetings with some two dozen members of the Region''s Party committee; at the end rejects their explanations); [[w.yang-jisheng-tiandi-fanfu]], I, 524 (the afternoon of July 17 Zhou calls the Military Region''s leaders and the heads of the units supporting the left to Baihua No. 1; army cadres give the Workers'' Headquarters'' "ten great crimes" and the Million Heroes'' "ten great merits"; from the 17th to the 18th Zhou, Xie Fuzhi, Yu Lijin and Wang Li meet them again and again: "to admit error and write a self-criticism is to protect you"; Chen Zaidao still unconvinced; the views sharply opposed). The time is the first day''s, the afternoon (MacFarquhar, 208). Made public: 1989. To check: [[w.zaidao-haojie-zhongde-yi-mu]], 74–79 (cited by [[w.macfarquhar-maos-last-revolution]], 210 n.44a); [[w.shaoguang-failure-of-charisma]], 152–153 (cited by [[w.macfarquhar-maos-last-revolution]], 210 n.44d); Xu Hailiang 徐海亮, *7·20 shijian shilu* 《7·20事件實錄》 (Zhongguo wenhua chuanbo chubanshe, 2010) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 524 n.13a); *Li Zuopeng huiyilu* 《李作鵬回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2011), 592–593 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 524 n.13b, n.14). Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua, Mao Zedong.'
      time_range:
      - 1967-07-15T04:00Z
