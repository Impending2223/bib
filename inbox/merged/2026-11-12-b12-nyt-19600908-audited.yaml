      c: St. Louis. Albert J. Hayes, president of the Machinists, announces to the convention, to scattered boos, that Nixon will address it on its closing day, Sept. 15, and Kennedy on Sept. 14.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Meany Bids Labor Vote for Kennedy"). See [[cal.1960-09-07.labor]]. Names: Nixon, Kennedy.'
      tags:
