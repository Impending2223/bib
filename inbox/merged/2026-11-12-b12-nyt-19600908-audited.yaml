      c: 'St. Louis. Meany, to 1,500 delegates at the Machinists'' quadrennial convention: get out the vote for the Democratic party. Unless the Democratic approach is adopted, "every economic barometer shows there is a recession coming and it is coming this winter." The Republican party''s philosophy is reflected most accurately in the "conservative, anti-labor" views of Goldwater; he speaks several times of "the candidate of Mr. Goldwater," meaning Nixon, the *Times* says.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Meany Bids Labor Vote for Kennedy"). See [[cal.1960-09-05.labor]]. Names: Meany, Goldwater, Nixon, Kennedy.'
      tags:
      - name:meany-george
      - name:goldwater-barry-m
      - name:nixon-richard-m
      - name:kennedy-john-f
      - state:mo
      - city:st-louis
