      when: Sept. 7
      date: '1960-09-07'
      thread: labor
      also:
      - elections-1960-kennedy
      c: 'Robert F. Kennedy, by telephone, on the affidavits: "this is obviously an attempt by Mr. Hoffa to try to hurt Senator Kennedy."'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Hoffa Is Balked on Ouster Move"). Names: Robert Kennedy, Hoffa, Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:hoffa-james-r
      - name:kennedy-john-f
