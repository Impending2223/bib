- add:
    entry:
      id: cal.1960-09-07.congo-8
      when: Sept. 7
      date: '1960-09-07'
      thread: congo
      also:
      - africa
      c: Accra. Nkrumah, in a broadcast to the nation, urges independent African States to help the Security Council prevent the great powers from intervening in the Congo; there is a "real danger that the Congo will not be allowed to settle its own affairs." He says nothing of Lumumba's request for immediate military assistance.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Ghana Bids Africans Help U.N. in Congo"). See [[cal.1960-09-05.congo]]. Names: Nkrumah, Lumumba.'
      tags:
      - name:nkrumah-kwame
      - name:lumumba-patrice
      - polity:ghana
- add:
    entry:
      id: cal.1960-09-07.latin-america
      when: Sept. 7
      date: '1960-09-07'
      thread: latin-america
      also:
      - cuba
      c: 'Bogotá, the second plenary session of the inter-American economic conference. Cuba''s Economy Minister, Regino Boti, in a fifty-minute speech, denounces Eisenhower''s $500,000,000 social-improvement plan as an instrument "to silence the militant hope awakened in the people of Latin America by the Cuban revolution." He calls for "forced loans" from U.S. companies, says Cuba will rule out direct private investment, attacks the IMF and the World Bank, and announces a "black book" on seized U.S. companies. Against Dillon''s statement of the day before on the fall in U.S. investment: the reason is "the permanent lack of interest by the United States in the economic development of Latin America." A U.S. delegation spokesman says there will be no official reply.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 14 ("Cuba Scores U.S. on Latin Aid Plan," by Juan de Onís). See [[cal.1960-09-06.latin-america-2]]. Names: Eisenhower, Dillon.'
      tags:
      - name:eisenhower-dwight-d
      - name:dillon-c-douglas
      - polity:cuba
      - polity:us
