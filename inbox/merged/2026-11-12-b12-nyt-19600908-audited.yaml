      when: Sept. 7
      date: '1960-09-07'
      thread: labor
      also:
      - elections-1960-kennedy
      c: 'Hoffa, to reporters after the hearing: "to say the least, it was indiscreet to hold the [alleged] meeting in the Kennedy apartment, which is shared by Jack, Joe and Bobby boy, in an attempt to use the same Hitler Gestapo tactics Bobby used on the McClellan committee."'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Hoffa Is Balked on Ouster Move"). Names: Hoffa, Robert Kennedy, Kennedy.'
      tags:
      - name:hoffa-james-r
      - name:kennedy-robert-f
      - name:kennedy-john-f
