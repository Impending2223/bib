      id: cal.1960-09-07.elections-1960-religion-3
      when: Sept. 7
      date: '1960-09-07'
      thread: elections-1960-religion
      c: 'Atlanta. Ben Fortson, Georgia''s Secretary of State, charges that Republicans are responsible for "floods of anti-Catholic literature" entering Georgia and other Southern States, a tactic to hurt Kennedy: "the same sort of campaign used by Hoover forces against Al Smith in 1928." He says officials of other Southern States have also seen an "influx" of it.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Georgian Scores G.O.P.," AP). Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:ga
      - city:atlanta
