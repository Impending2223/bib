      id: cal.1960-09-07.berlin-and-vienna
      when: Sept. 7
      date: '1960-09-07'
      thread: berlin-and-vienna
      also:
      - soviet-union-un
      c: 'Vienna. As the *Times* reports it: a source "who in the past has been knowledgeable about Soviet foreign policy" says the Soviet Government plans drastic measures in Germany if the West rejects Khrushchev''s disarmament proposals at the UN: a total blockade of Berlin, and a separate peace treaty with East Germany.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Soviet U.N. Plan Linked to Berlin," by M. S. Handler, Vienna, Sept. 7: the source''s statements, as the *Times* reports them; the motive "could not be determined"). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - polity:gdr
- add:
    entry:
      id: cal.1960-09-07.berlin-and-vienna-2
      when: Sept. 8
      date: '1960-09-08'
      thread: berlin-and-vienna
      also:
      - europe-and-the-alliance-federal-republic
      c: 'As the *Times* reports it: the United States, Britain, France and West Germany have undertaken a study of possible reprisals if East Germany resumes harassing West Berlin''s communications. Allied sources name a move to bar the transit of goods for East Germany through the territory or ports of NATO members, an idea reported put before the NATO Council in Paris.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Allies Weighing Berlin Reprisals," by Sydney Gruson, Bonn, Sept. 7: the study, no day given; the transit idea, "it was reported here today").'
      tags:
      - form:state
      - polity:us
      - polity:uk
      - polity:fr
      - polity:frg
      - polity:gdr
- add:
    entry:
      id: cal.1960-09-07.latin-america-2
      when: Sept. 7
      date: '1960-09-07'
      thread: latin-america
      c: 'Miami. Counsel for Marcos Pérez Jiménez, Venezuela''s ousted dictator, asks Judge William C. Mathes, U.S. District Court, to dismiss the extradition proceedings: all his acts in office were in performance of his duties as head of the Government. The Venezuelan Government, which charges embezzlement and murder, opposes; argument is to continue the next day. His chief counsel, David W. Walters, predicts a trial of at least three months, with 200 witnesses, if the charges are not thrown out.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Venezuelan Asks Dismissal of Case").'
      tags:
      - state:fl
      - city:miami
- add:
    entry:
      id: cal.1960-09-07.intelligence
      when: Sept. 7
      date: '1960-09-07'
      thread: intelligence
      also:
      - congress
      c: Vinson, chairman of the House Armed Services Committee, orders a "complete investigation" of the intelligence agencies after the NSA defections, emphasizing the methods of recruiting, screening and clearing personnel. A special subcommittee, Kilday chairman, with Hardy and Arends, has gathered considerable preliminary data.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 11 ("President Urges Security Review," by Jack Raymond). See [[cal.1960-09-06.antisubversion]]. Names: Vinson, Hardy, Arends. Check: the day: the *Times* of Sept. 8 gives no day for the order.'
      tags:
      - name:vinson-carl
      - name:hardy-porter-jr
      - name:arends-leslie-c
- add:
    entry:
      id: cal.1960-09-07.antisubversion
      when: Sept. 7
      date: '1960-09-07'
      thread: antisubversion
      also:
      - intelligence
      c: The House Un-American Activities Committee delivers a subpoena to Maurice H. Klein, personnel chief of the National Security Agency, for a closed hearing Sept. 16 in its previously announced investigation of the NSA defections.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 11 ("President Urges Security Review"; the committee "finally succeeded in delivering" the subpoena). See [[cal.1960-09-06.antisubversion]]. Check: the day: the *Times* of Sept. 8 gives no day for the delivery.'
      tags: []
- add:
    entry:
      id: cal.1960-09-07.antisubversion-2
      when: Sept. 7
      date: '1960-09-07'
      thread: antisubversion
      also:
      - intelligence
      c: Walter, chairman of the House Un-American Activities Committee, complains that the President is refusing to cooperate in one phase of its investigations. He says he asked on Jan. 15 that agencies make available the names of persons who regained Government employment after being dropped as security risks, perhaps up to 1,000; the President replied Feb. 19 and Apr. 19, citing the separation of powers, that it would not be in the national interest for the executive to make the names available to the legislative body.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 11 ("President Urges Security Review"). See [[cal.1960-09-06.antisubversion]]. Names: Walter. Check: the day: the *Times* of Sept. 8 gives no day for the complaint.'
      tags:
      - name:walter-francis-e
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-09-07.intelligence-2
      when: Sept. 7
      date: '1960-09-07'
      thread: intelligence
      c: A Defense Department spokesman says a security review affecting the Department is already under way, not limited to Bernon F. Mitchell and William H. Martin, the former NSA employees who denounced the United States at Moscow the day before. Responding to published reports that the FBI had such information about one of them, he says nothing in the personal records of either indicates homosexuality or any form of sexual perversion.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 11 ("President Urges Security Review"). See [[cal.1960-09-06.intelligence-2]].'
      tags: []
- add:
    entry:
      id: cal.1960-09-07.intelligence-3
      when: Sept. 7
      date: '1960-09-07'
      thread: intelligence
      also:
      - congress
      c: 'Wayne L. Hays, Democrat of Ohio, by telephone at Flushing, Ohio, says he may have been the member of Congress to whom Mitchell and Martin came last spring: two young men who said the United States was sending spy planes over Russia and identified themselves as Central Intelligence Agency men, as he remembered. Their pictures and names do not stir his recollection; he says he reported it to the Foreign Affairs Committee.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 11 ("President Urges Security Review"). See [[cal.1960-09-06.soviet-union]]. Names: Hays.'
      tags:
      - name:hays-wayne-l
      - state:oh
- add:
    entry:
      id: cal.1960-09-08.congo
      when: Sept. 8
      date: '1960-09-08'
      thread: congo
      c: 'United Nations. Hammarskjold, in a message just after midnight, asks the Security Council to reaffirm that all UN members must refrain from interference in the Congo, and to clarify the duties of the 16,000-man UN force. In his fourth report: the struggle between Kasavubu and Lumumba, and war in Kasai, may require the temporary disarming of some Congolese military units. He asks the Council to appeal to member governments for voluntary contributions to a UN Fund for the Congo; the need is $100,000,000 in convertible currencies.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 4, 5 ("Hammarskjold Says Some of Nation''s Forces May Have to Be Disarmed," at 1, 5; "Text of New Hammarskjold Report to U.N. on Congo Issues," at 4). To check: the Secretary General''s fourth report to the Security Council, Sept. 8, 1960. See [[cal.1960-09-05.congo]]. Names: Hammarskjold, Kasavubu, Lumumba.'
      tags:
      - name:hammarskjold-dag
      - name:kasavubu-joseph
      - name:lumumba-patrice
- primary:
    id: cal.1960-09-07.elections-1960
    text: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 25 ("Protestant Unit Wary on Kennedy," at 1, 25; "Protestant Groups'' Statements," the texts, at 25: the meeting at the Mayflower Hotel, 150 ministers and laymen of the National Conference of Citizens for Religious Freedom "under the leadership of" Peale, who spoke at the news conference; the statement said to be adopted "unanimously," statement and summary "prepared in advance," the text at 25; not that Peale signed it, that he presided at one session only, or his part in the drafting)'
    units: '?'
- primary:
    id: cal.1960-09-06.elections-1960
    text: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 24 ("Kennedy Says U.S. Must Regain Lead in ''Fight for Peace''"; "Kennedy Pledges ''Fight for Peace''": Seattle, "crowds fell below expectations," the Civic Auditorium short by 500 to 600 seats of 5,800; Eugene and Salem, Sept. 7; Portland, the Civic Auditorium; not Pocatello, Spokane or the advance work)'
    units: '?'
- primary:
    id: cal.1960-09-07.elections-1960-kennedy-2
    text: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 24 ("Kennedy Pledges ''Fight for Peace''": Salem, a state fair crowd of more than 8,000; a better housing program, which would increase the demand for lumber; not the statement on timber or the national forests)'
    units: '?'
- primary:
    id: cal.1960-09-05.congo
    text: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 2 ("Leopoldville''s Parliament Rejects Ousters"; "Deputies Reject Congo Dismissals"; "Belgium Airlifts Arms to Katanga": Kasavubu''s attempt to remove Lumumba "Monday"; the dismissal of each by the other; Ileo, named by Kasavubu to become Premier; the UN control of the airports and the closed radio station on Sept. 7; not that Lumumba spoke on the radio)'
    units: '?'
- check:
    id: cal.1960-09-09.congo
    text: 'Check: the day and the house: the *Times*, Sept. 8, 1960, at 1, 2, has the lower house invalidating both dismissals on Sept. 7, 60 to 19 ([[cal.1960-09-07.congo-3]]), and the Senate, which declined a joint session that day, still to meet; whether the annulment here is that vote or the Senate''s.'
- primary:
    id: cal.1960-09-05.congo-2
    text: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 5 ("Eisenhower Bids Soviet Stop Aid to Congo Forces": reports of Soviet crews flying fifteen Ilyushin-14 planes to Stanleyville, able to carry more than 500 persons besides crews, and of 100 Soviet trucks for 2,000 troops; Eisenhower, Sept. 7, no evidence "as of now" that Soviet crews were operating the planes; not the 450 soldiers, Katanga or the halting)'
    units: '?'
- check:
    id: cal.1960-09-05.congo-2
    text: 'Check: whether Soviet crews flew the planes: Eisenhower, Sept. 7, in the *Times*, Sept. 8, 1960, at 1, 5, has "no evidence ''as of now''" that they did, and ten of the planes, inspected at Athens, carrying cargo "for peaceful uses."'
