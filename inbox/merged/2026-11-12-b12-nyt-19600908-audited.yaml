      id: cal.1960-09-07.labor-2
      when: Sept. 7
      date: '1960-09-07'
      thread: labor
      c: Washington. The U.S. Court of Appeals denies the Teamsters' motion to prevent District Judge F. Dickinson Letts from installing Terence McShane, a former FBI agent, as chairman of the union's board of monitors. It sends the matter back to Letts, who had agreed to reconsider filling the post in light of "considerable" new material. Hoffa's lawyers had sought to reverse the appointment; Godfrey P. Schmidt, attorney for insurgent teamsters, had nominated McShane.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Hoffa Is Balked on Ouster Move"). Names: Hoffa.'
      tags:
      - name:hoffa-james-r
- add:
    entry:
      id: cal.1960-09-07.labor-3
      when: Sept. 7
      date: '1960-09-07'
      thread: labor
      also:
      - elections-1960-kennedy
      c: 'Washington, the Court of Appeals hearing. Robert Silagi, an attorney for anti-Schmidt insurgents, presents affidavits from two New York teamsters of Local 808, Steve Milone and John McManus: they met Robert F. Kennedy, McShane and Walter Sheridan in Kennedy''s Park Avenue apartment on May 17, and Kennedy and McShane tried to browbeat them into withdrawing their support from the monitor Lawrence Smith and backing McShane as his replacement; Kennedy contended that Smith was accepting money from the Teamsters. Smith and Hoffa deny it.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Hoffa Is Balked on Ouster Move"). See [[cal.1960-09-07.labor-2]]. Names: Robert Kennedy, Sheridan, Hoffa.'
      tags:
      - name:kennedy-robert-f
      - name:sheridan-walter
      - name:hoffa-james-r
      - city:new-york
- add:
