      id: cal.1960-09-07.labor-6
      when: Sept. 7
      date: '1960-09-07'
      thread: labor
      c: Washington. Hoffa says the executive board approved the appointment of Anthony Provenzano, president of the New Jersey Joint Council and head of Hoboken's Local 560, as thirteenth international vice president, to fill the vacancy left by John Conlin's death; Provenzano takes the oath. At the Senate hearings he was charged with accepting payments from employers with Teamsters contracts in exchange for guaranteed labor peace.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Teamsters Name Aide," AP). Names: Hoffa.'
      tags:
      - name:hoffa-james-r
      - state:nj
- add:
    entry:
      id: cal.1960-09-07.labor-7
      when: Sept. 7
      date: '1960-09-07'
      thread: labor
      c: Washington. Labor Department investigators interrupt a meeting of the Teamsters' international executive board to serve a subpoena for the financial records of the union's St. Louis Joint Council No. 13. Hoffa, relating it to reporters, accuses the Department and Secretary Mitchell of persecuting the teamsters; the subpoena, he says, is an effort to get evidence for the Justice Department's prosecution of Harold J. Gibbons, administrative vice president and his chief aide, indicted for using St. Louis teamsters' funds for political purposes.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Writ for Teamsters," AP: the incident as Hoffa related it). Names: Hoffa, Mitchell.'
      tags:
      - name:hoffa-james-r
      - name:mitchell-james-p
      - state:mo
- add:
    entry:
      id: cal.1960-09-07.congo-3
      when: Sept. 7
      date: '1960-09-07'
      thread: congo
      c: Léopoldville. The lower house votes 60 to 19 to "invalidate" both Kasavubu's dismissal of Lumumba and Lumumba's of Kasavubu; the motion declares the statements of both "null and nonexistent." Ninety-one of the 137 members are present at the beginning of the debate; most of the Opposition stay away. Lumumba, after a two-hour address attacking the UN, "imperialists" and "plotters" around Kasavubu, asks only that the chamber appoint a commission to study the situation, and joins the majority. In a speech to the house he denies he is a Communist.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 2 ("Leopoldville''s Parliament Rejects Ousters"; Lumumba''s denial from "Kasavubu Soldiers Arrive," AP). See [[cal.1960-09-05.congo]]. Names: Lumumba, Kasavubu.'
      tags:
      - name:lumumba-patrice
      - name:kasavubu-joseph
- add:
    entry:
      id: cal.1960-09-07.congo-4
      when: Sept. 7
      date: '1960-09-07'
      thread: congo
      c: Léopoldville. The Senate rejects the Government's invitation to meet the lower house in joint session. Under the "fundamental law" only a joint session can endorse the dismissal of the Premier. It is to meet again the next day.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 2 ("Leopoldville''s Parliament Rejects Ousters"). See [[cal.1960-09-05.congo]].'
      tags: []
- add:
    entry:
      id: cal.1960-09-07.congo-5
      when: Sept. 7
      date: '1960-09-07'
      thread: congo
      c: Léopoldville, the lower house. Albert Delvaux, a minister in Lumumba's Cabinet, comes in and takes a seat away from the Government benches; asked by the Speaker why, he answers, "because I'm under arrest." He says the Army arrested him that morning and took him to a military camp because he countersigned Kasavubu's decree relieving Lumumba; he does not say how he escaped.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 2 ("Deputies Reject Congo Dismissals"). See [[cal.1960-09-07.congo-3]]. Names: Lumumba, Kasavubu.'
      tags:
      - name:lumumba-patrice
      - name:kasavubu-joseph
- add:
    entry:
      id: cal.1960-09-07.congo-9
      when: Sept. 7
      date: '1960-09-07'
      thread: congo
      c: Léopoldville. Military policemen call at the hotel of Justin Bomboko, the Foreign Minister, who countersigned Kasavubu's decree, a few moments before he returns that morning. He leaves his limousine and drives off in a private car; he is reported that night at Kasavubu's residence, guarded by United Nations forces.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 2 ("Deputies Reject Congo Dismissals"). See [[cal.1960-09-07.congo-5]]. Names: Kasavubu.'
      tags:
      - name:kasavubu-joseph
- add:
    entry:
      id: cal.1960-09-07.congo-6
      when: Sept. 7
      date: '1960-09-07'
      thread: congo
      c: 'Elisabethville. A plane from Brussels lands nine tons of ammunition, the fourth shipment to arrive recently. Belgian sources: it was in the "supply pipeline" before the Congo''s independence, destined for the Public Force.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Belgium Airlifts Arms to Katanga"). See [[cal.1960-09-05.congo]].'
      tags:
      - polity:belgium
