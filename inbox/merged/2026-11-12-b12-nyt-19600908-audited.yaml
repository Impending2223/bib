      c: 'Atlanta. Robert F. Kennedy, directing Kennedy''s campaign, at a news conference after arriving for a strategy meeting with southeastern Democrats: Kennedy faces an uphill struggle in six Southern States and Kentucky because of the religious issue; he names Virginia, the Carolinas, Florida, Tennessee and Texas as "problem" States but sees "a chance in every one of them." Kennedy''s Roman Catholic faith is "the major problem." Governors Almond of Virginia, Hodges of North Carolina and Vandiver of Georgia, the host, are present; Almond and Hodges agree that the issue could decide the election in their States. Gore attends as a consultant.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Kennedy Faces Southern Battle Over Religion, Brother Reports": the planning session to meet the next day at the Dinkler Plaza Hotel). Names: Robert Kennedy, Kennedy, Hodges, Vandiver, Gore.'
      tags:
      - name:kennedy-robert-f
      - name:kennedy-john-f
      - name:hodges-luther-h
      - name:vandiver-s-ernest-jr
      - name:gore-albert-sr
