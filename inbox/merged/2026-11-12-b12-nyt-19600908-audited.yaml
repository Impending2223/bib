      when: Sept. 7
      date: '1960-09-07'
      thread: congo
      c: 'Elisabethville. Tshombe sends messages to important African leaders charging that Lumumba''s troops have killed hundreds of people in the Kasai city of Bakwanga: "genocide."'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Belgium Airlifts Arms to Katanga"). See [[cal.1960-09-05.congo]]. Names: Tshombe, Lumumba.'
