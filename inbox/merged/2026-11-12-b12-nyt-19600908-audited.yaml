- add:
    entry:
      id: cal.1960-09-05.congo-4
      when: Sept. 5–7
      date: '1960-09-05'
      thread: congo
      c: Tshombe, President of Katanga, makes overtures toward an agreement with Kasavubu after hearing of Kasavubu's attempt to remove Lumumba as Premier. He calls for a conference of Congo leaders, without Lumumba, to establish a confederation of the Congo.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Belgium Airlifts Arms to Katanga," Elisabethville, Sept. 7: the overtures and the call; Tshombe heard of the move through foreign correspondents). See [[cal.1960-09-05.congo]]. Names: Tshombe, Kasavubu, Lumumba. Check: the day: the *Times* has the overtures "shortly after" Kasavubu''s attempt "Monday," Sept. 5, and gives no day for the overtures or the call.'
      tags:
      - name:tshombe-moise
      - name:kasavubu-joseph
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-09-05.elections-1960-religion
      when: Sept. 5
      date: '1960-09-05'
      thread: elections-1960-religion
      c: Marion, Ind. Truman charges that supporters of Nixon are bringing the religious question into the campaign "by way of the back door while he stands at the front door proclaiming charity and tolerance."
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1 ("Religion as Issue Denounced Again by White House": the charge, a speech at Marion "on Monday"; not its text). To check: Truman''s speech at Marion, Ind., Sept. 5, 1960. Names: Truman, Nixon.'
      tags:
      - name:truman-harry-s
      - name:nixon-richard-m
      - state:in
      - city:marion
- add:
    entry:
      id: cal.1960-09-06.congo-2
      when: Sept. 6
      date: '1960-09-06'
      thread: congo
      c: Kasavubu addresses the people of Léopoldville in a recorded message, broadcast that night by a radio station at Brazzaville, capital of the French Community's Congo Republic, across the Congo River.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 2 ("Deputies Reject Congo Dismissals": the message "last night"; its words not given). See [[cal.1960-09-05.congo]]. Names: Kasavubu.'
      tags:
      - name:kasavubu-joseph
- add:
    entry:
      id: cal.1960-09-06.congo-3
      when: Sept. 6
      date: '1960-09-06'
      thread: congo
      c: Several hundred Congolese soldiers, loudly proclaiming loyalty to Kasavubu, arrive at Léopoldville from the military base at Thysville, seventy miles southwest.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Kasavubu Soldiers Arrive," AP, Sept. 7: "pulled in last night"). See [[cal.1960-09-05.congo]]. Names: Kasavubu.'
      tags:
      - name:kasavubu-joseph
- add:
    entry:
      id: cal.1960-09-06.congo-4
      when: Sept. 6
      date: '1960-09-06'
      thread: congo
      c: About 100 of the soldiers from Thysville free Jean Bolikango, National Unity party leader, in a raid on a prison where he was held by Lumumba's order. Lumumba had accused Bolikango's followers of plotting to assassinate him.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Kasavubu Soldiers Arrive," AP, Sept. 7). See [[cal.1960-09-06.congo-3]]. Names: Lumumba. Check: the day: the *Times* dates the soldiers'' arrival "last night" and gives no day for the raid.'
      tags:
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-09-07.congo-2
      when: Sept. 7
      date: '1960-09-07'
      thread: congo
      c: 'Washington. Eisenhower''s news conference. The Congo, a formal statement he reads: the United States deplores "the unilateral action of the Soviet Union in supplying aircraft and other equipment for military purposes to the Congo, thereby aggravating an already serious situation which finds Africans killing other Africans"; he urges the Soviet Union to desist and to support "collective effort through the United Nations"; the United States will support the UN in what it finds "necessary within the limits of the Charter." Later: no evidence "as of now" that Soviet crews fly the planes. Religion: he and Nixon agreed long ago never to raise or mention "the religious issue"; "I not only don''t believe in voicing prejudice—I want to assure you I feel none. And I am sure that Mr. Nixon feels exactly the same." The session''s failures, laid to him by the Democrats: "Apparently this other party is making me responsible for splitting theirs"; the record should cause "some disappointment, if not dismay, throughout the nation." The campaign: he will not become "a sphinx." The NSA defectors: "always on the alert, very alert"; "we must go through our entire procedures" for hiring and checking employees of sensitive agencies.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 5, 11, 16 ("Eisenhower Bids Soviet Stop Aid to Congo Forces," by E. W. Kenworthy, at 1, 5: the Congo statement, question 3, and the answer on the crews, question 12, ten planes inspected at Athens carrying cargo "for peaceful uses"; "Religion as Issue Denounced Again by White House," by Felix Belair Jr., at 1, 16: religion, question 2; the session, question 17; "a sphinx," question 5; "President Urges Security Review," by Jack Raymond, at 1, 11: the defectors, question 11; the transcript, at 16, not in the clippings). To check: *Public Papers of the Presidents*, Eisenhower, 1960–61, the news conference of Sept. 7, 1960. See [[cal.1960-09-05.congo-2]], [[cal.1960-09-05.elections-1960-religion]], [[cal.1960-09-06.intelligence]]. Names: Eisenhower, Nixon, Lumumba.'
