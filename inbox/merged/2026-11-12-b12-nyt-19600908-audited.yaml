      id: cal.1960-09-07.elections-1960-religion-2
      when: Sept. 7
      date: '1960-09-07'
      thread: elections-1960-religion
      c: Washington. The board of trustees of Protestants and Other Americans United for Separation of Church and State calls for "calm analysis and sober speech about the religious issue." It praises Kennedy for declaring Government financial aid to parochial schools unconstitutional and for opposing an ambassador to the Vatican; it is skeptical of his "equivocal" position on birth control and troubled about his stand on "the official boycott of public schools" in his church's canon law.
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 25 (the board of trustees'' statement, "Earlier," as summarized at 1 and printed at 25 under "Protestant Groups'' Statements," "By the P.O.A.U."). See [[cal.1960-09-07.elections-1960]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - polity:vatican
- add:
    entry:
      id: cal.1960-09-07.elections-1960-kennedy-4
      when: Sept. 7
      date: '1960-09-07'
      thread: elections-1960-kennedy
      c: 'Portland, Oreg., the Civic Auditorium. Kennedy''s speech, prepared for delivery: diplomatic policies that teeter "on the brink of war," no solid plans for disarmament, a philosophy of "swapping threats and insults with the Russians." He calls for rebuilt defenses, a revamp of education and research, and renewed leadership for peace.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 24 ("Kennedy Says U.S. Must Regain Lead in ''Fight for Peace''"). To check: Speech of Senator John F. Kennedy, Civic Auditorium, Portland, OR, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-civic-auditorium-portland-or) (Sept. 7, 1960). See [[cal.1960-09-06.elections-1960]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:or
      - city:portland
      - polity:ussr
- add:
    entry:
      id: cal.1960-09-07.elections-1960-kennedy-5
      when: Sept. 7
      date: '1960-09-07'
      thread: elections-1960-kennedy
      also:
      - school-aid
      c: 'Eugene, Oreg., Courthouse Square. Kennedy, to a crowd of more than 5,000: emergency action on education, a massive construction program for public schools and colleges, Federal aid to raise teachers'' salaries, a scholarship program and more support of basic research; he rejects Federal control and Federal replacement of local effort.'
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 24 ("Kennedy Pledges ''Fight for Peace''"). To check: Remarks of Senator John F. Kennedy, Eugene, OR, Courthouse Square, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-eugene-or-courthouse-square) (Sept. 7, 1960). See [[cal.1960-09-06.elections-1960]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:or
      - city:eugene
- add:
    entry:
      id: cal.1960-09-07.elections-1960-2
      when: Sept. 7
      date: '1960-09-07'
      thread: elections-1960
      also:
      - democratic-party
      c: Chicago, the Medinah Temple, the Illinois Democratic convention, a crowd of some 5,000. Stevenson says he is "proud to campaign now with all my heart and strength across the country" for Kennedy. His prepared speech assailed "regional-minded Democrats" as allies of Eisenhower and the Republican "old Guard wing"; he omitted the passage but said afterward that he stood by it. The price of a Republican President with a Congress "bound to be Democratic" is "a continual stalemate"; he finds it hard to follow the reasoning that a "new liberal Nixon is disengaging from the old conservative Eisenhower."
      n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Stevenson Assails Democrats Who Aided G.O.P. in Congress"). Names: Stevenson, Kennedy, Eisenhower, Nixon.'
      tags:
      - name:stevenson-adlai-e
      - name:kennedy-john-f
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
      - state:il
      - city:chicago
