      text: 'Check: Herter''s answers at the National Press Club (the *Bulletin*, Mar. 7, 1960, 361) speak of France as "an atomic power" and of the bomb "exploded," and name no place, day, yield or message.'
  - check:
      id: cal.1960-04-15.civil-rights-organizations
      text: 'Check: the King Papers'' notes to King''s statement of Apr. 15 have King''s press conference that day and his address to a mass meeting Apr. 16, and King and Lawson only "present in an advisory capacity" to the student committee; Lawson''s speaking rests on Branch (291).'
  - check:
      id: cal.1960-06.cuba-bay-of-pigs
      text: 'Check: the Cuba Study Group''s Memorandum No. 1 (FRUS 1961–63, X, doc. 231) has none of these.'
  - check:
      id: cal.1960-07.cuba-bay-of-pigs
      text: 'Check: the Cuba Study Group''s Memorandum No. 1 (FRUS 1961–63, X, doc. 231) has no thirty recruits and no jungle camp.'
  - check:
      id: cal.1960-11-11.vietnam
      text: 'Check: McGarr (FRUS 1958–60, I, doc. 233) has the coup leaders flown out at 2 p.m. Nov. 12 on a C-47, "rumored for Phnom Penh" as its destination.'
  - variant:
      id: cal.1960-11-29.cuba-2
      'on': 'By Jones: Castro''s support 30 percent;'
      witness: x.1960-11-29.memorandum-of-conversation-at-state-nov
      reads: Castro has "25 to 30%" of the Cuban people supporting him
      at: FRUS 1958–60, VI, doc. 614, par. 13
  - variant:
      id: cal.1960-11-29.cuba-2
      'on': a force of about 3,000 could seize ground and declare itself the government;
      witness: x.1960-11-29.memorandum-of-conversation-at-state-nov
      reads: '"A force of 2 to 3 thousand men"'
      at: FRUS 1958–60, VI, doc. 614, par. 19
  - check:
      id: cal.1960-11-29.cuba-2
      text: 'Check: the memorandum (doc. 614) has Varona put the force at "2 to 3 thousand men" and Castro''s support at "25 to 30%" of the people.'
