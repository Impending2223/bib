patch: 2026-11-26-via-read-c
by: 'reader (via-read batch c); audited on Opus, Nov. 26, 2026 (notes/via-read/audit-c.md): two src ops struck, one primary narrowed, the cites of Jianguo yilai zhongyao wenxian XIV made the items the entries already print, and the audit''s own edits, Checks and variants added'
ops:
  - edit:
      id: cal.1960-02-25.conservation-2
      base: baa29c8e
      kind: correct
      set:
        c: 'Edith Green in the House, on the veto of the water pollution bill: "Why is water pollution so exclusively local? ... Is the President aware of the fact that his own home State of Pennsylvania shares the Delaware River with New Jersey?"'
        n: '[106 Cong. Rec. 3490](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt3/pdf/GPO-CRECB-1960-pt3-7-2.pdf#page=8) (1960). [[w.sundquist-politics-and-policy]], 331. The House sat from noon to 2:14 p.m.: [Daily Digest, D4](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=2), [D93](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=91). The Record has Green''s words on 3490, not 3491, and a sentence between the two questions. See [[cal.1960-02-25.conservation]]. Names: Green.'
        src:
          c: 2f47abe1
          rows:
            - 'w.sundquist-politics-and-policy 331: all'
            - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt3/pdf/GPO-CRECB-1960-pt3-7-2.pdf#page=8: all'
            - 'via w.sundquist-politics-and-policy 331 n.19: all'
  - edit:
      id: cal.1960-07-25.cuba
      base: '90887873'
      settles:
        - 'Check: Eisenhower''s words on Trujillo in the memorandum (Jones, 21, cites FRUS 1958–60, VI, 1029).'
      set:
        n: '[FRUS 1958–60, VI, doc. 565](https://history.state.gov/historicaldocuments/frus1958-60v06/d565). The President, by the memorandum: "Until Trujillo is eliminated, we cannot get our Latin American friends to reach a proper level of indignation in dealing with Castro." Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 21 (Trujillo). See [[cal.1960-07-09.cuba]]. Names: Dulles, Raúl Castro, Eisenhower, Trujillo.'
  - src:
      id: cal.1960-07-25.cuba
      row: https://history.state.gov/historicaldocuments/frus1958-60v06/d565
      'on': 'By Jones, Eisenhower: Trujillo will have to be "eliminated" before the other states support policy on Cuba.'
