  - primary:
      id: cal.1961-04-06.cuba-bay-of-pigs
      text: Cuba Study Group, Memorandum No. 1 to President Kennedy, "Narrative of the Anti-Castro Cuban Operation Zapata" (June 13, 1961), [FRUS 1961–63, X, doc. 231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 30 (the diversionary landing of 160 men in eastern Cuba, D-2).
      'on': a guerrilla landing on D-2.
  - cite:
      id: cal.1961-01-20.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107 (the letter printed in full, from *Mao Zedong shuxin xuanji*)'
      'on': 'Mao to Tian Jiaying: three investigation groups of seven, led by Chen Boda (Guangdong), Hu Qiaomu (Hunan) and Tian (Zhejiang), each with his 1930 "On Investigation Work";'
  - cite:
      id: cal.1961-01-20.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107 (the letter printed in full, from *Mao Zedong shuxin xuanji*)'
      'on': one team to the worst brigade, one to the best, ten to fifteen days;
  - cite:
      id: cal.1961-01-20.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107 (the letter printed in full, from *Mao Zedong shuxin xuanji*)'
      'on': then to report to him at Guangzhou and study industry there a month.
  - cite:
      id: cal.1961-01-21.china-leadership-3
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 83–88 (the communiqué 《中国共产党第八届中央委员会第九次全体会议公报》, dated Jan. 20, printed from *Renmin ribao* of Jan. 21: the plenum met in Peking Jan. 14–18, Mao presiding; 83 members and 87 alternates; 23 others attended)'
      'on': rectification in stages over the country.
  - cite:
      id: cal.1961-03-13.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 215–216 (the letter printed in full, signed 8 a.m., Mar. 13, Guangzhou; the notes: the Peking meeting the conference of the North China, Northeast and Northwest bureaus and provinces that Liu Shaoqi and Zhou Enlai had called, the "Three North" conference; Mao at Guangzhou with the Central-South, Southwest and East China, the "Three South"; Tao Zhu sent that day to report)'
      'on': 'Mao, 8 a.m., to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Three North conference, by Tao Zhu: the two egalitarianisms, between teams in a brigade and between members in a team, "two extremely grave questions," to be studied in person; Deng and Peng to spend ten days in Miyun, Shunyi, Huairou: are they "still unclear"?'
  - cite:
      id: cal.1961-03-23.china-leadership-3
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 225–227 (the letter printed in full: Mao''s "On investigation work" of spring 1930, newly found, to be studied by the Party''s higher and middle cadres; the note: the essay is "Oppose book worship", left out, and gives Mao''s comment on it of Mar. 11)'
      'on': 'The Center sends the Party''s regional bureaus and provincial committees a letter on conducting investigation seriously, with Mao''s 1930 essay "Investigation Work": county committees and above, first secretaries first, to study Mao''s method and make going down to the base, in person, for systematic typical inquiry the first task of leadership.'
  - cite:
      id: cal.1961-04-15.china-leadership-5
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 300–315 (Mao''s comment, signed the morning of Apr. 15, printed in full in the Center''s forwarding of Apr. 26, 300–301, with Hu Qiaomu''s letter of Apr. 14, 301–302, and its four enclosures, 303–315)'
      'on': to be printed that day for the Hunan three-level cadre conference and discussed there;
  - cite:
      id: cal.1961-05-06.china-leadership-3
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316–317 (the letter printed in full, signed May 6, at Shanghai, to Li Jingquan for Chen Zhengren and to the first secretaries of the bureaus and provinces: the Center''s list of subjects for inquiry sent Apr. 25, its notice of May 4 putting the meeting off to May 20; each first secretary to spend the half-month in the villages and write to him; the note quotes the notice of Apr. 25)'
      'on': 'Mao to Li Jingquan, for Chen Zhengren at Pingquan commune, Jianyang: Chen''s letter of May 1 received;'
  - cite:
      id: cal.1961-05-06.china-leadership-3
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316–317 (the letter printed in full, signed May 6, at Shanghai, to Li Jingquan for Chen Zhengren and to the first secretaries of the bureaus and provinces: the Center''s list of subjects for inquiry sent Apr. 25, its notice of May 4 putting the meeting off to May 20; each first secretary to spend the half-month in the villages and write to him; the note quotes the notice of Apr. 25)'
      'on': 'To Li: why no letter? Has he been out to investigate? The Center''s list of topics went out Apr. 25; the May 4 notice puts the conference off to May 20 for fuller inquiry, so Peking can go further than Guangzhou.'
  - cite:
      id: cal.1961-05-07.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319 (Zhou Enlai''s telephone report from the Handan 邯郸 district of May 7, printed from *Zhou Enlai xuanji*, II, as "On the inquiry into the mess halls, work points and other questions" 《关于食堂和评工记分等问题的调查》: three days of reports at Handan, then five days at Boyan 伯延 commune, Wu''an 武安 county; nearly all members, women and single men too, want to cook at home; members against the supply system, for keeping the "five guarantee" households; the work-point system of the higher cooperatives wanted back; the note: Mao forwarded it May 7 to the bureaus and committees)'
      'on': supply only for the "five guarantees" households and the needy; work points as in the higher cooperatives, output contracted to the teams, work to groups.
  - cite:
      id: cal.1961-05-09.china-leadership-7
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 320–323 (Mao''s comment, 3 a.m., May 9, at Shanghai, and Hu Qiaomu''s letter, 11 a.m., May 8, at Changsha, printed in full: the investigation group and the Hunan committee have proposed changes to the Sixty Articles; Hu, Wang Li and others to Liuyang 浏阳 to see the new handicraft cooperatives; Tao Zhu to Taoyuan 桃源)'
      'on': 'Mao has Hu Qiaomu''s letter of May 8 on the Hunan investigation group sent to the bureaus and committees for reference. Hu: with the Hunan committee the group has made first revisions to the Sixty Articles; Shaoshan commune''s mess halls are down from 112 to 6;'
  - cite:
      id: cal.1961-05-14.china-leadership-2
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 332–336 (Mao''s comment, May 14, at Tianjin, and Zhang Pinghua''s letter of May 13, printed in full: Zhang and an investigation group at Dajiang 大江 brigade, Wenjiashi 文家市 commune, Liuyang 浏阳, from May 2; Mao: the letter to go to every prefectural, city and county committee in Hunan; policy to be made with the masses; no Party committee to make policy shut indoors without inquiry)'
      'on': Mao has Zhang Pinghua's letter of May 13 on his investigation at a brigade of Wenjiashi commune sent to the bureaus and committees for reference.
  - cite:
      id: cal.1961-05-14.china-leadership-2
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 332–336 (Mao''s comment, May 14, at Tianjin, and Zhang Pinghua''s letter of May 13, printed in full: Zhang and an investigation group at Dajiang 大江 brigade, Wenjiashi 文家市 commune, Liuyang 浏阳, from May 2; Mao: the letter to go to every prefectural, city and county committee in Hunan; policy to be made with the masses; no Party committee to make policy shut indoors without inquiry)'
      'on': the mass line, every matter settled with the masses; no committee may go without investigation, and a few men shut in a room making "policies that kill people" are "absolutely forbidden."
