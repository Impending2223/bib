      thread: desegregation-schools
      also:
      - mayors
      c: Chicago. Daley questions Superintendent Redmond's plan to bus Negro pupils to white schools.
      n: '[[w.ralph-northern-protest]], 223. Check: the month (Ralph: the fall of 1967). Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
- add:
    entry:
