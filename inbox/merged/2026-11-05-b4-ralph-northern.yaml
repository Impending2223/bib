      when: Nov. 8
      date: '1966-11-08'
      thread: legislatures
      also:
      - elections-1966
      c: 'Illinois. Two Negro independents elected to the State Senate from Chicago. Check: the names and the counts.'
      n: '[[w.ralph-northern-protest]], 230.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1967-02-28.mayors
      when: Feb. 28
      date: '1967-02-28'
      thread: mayors
      c: 'Chicago, the aldermanic elections. Two Negro independents defeat candidates of Daley''s organization for the City
        Council. Check: the names, the day and the counts.'
      n: '[[w.ralph-northern-protest]], 230. See [[cal.1967-02-28.mayors-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-01.states-and-cities
      when: Jan.
      date: 1968-01
      thread: states-and-cities
      c: Chicago. Father Francis X. Lawlor, a Southwest Side teacher and spokesman for its whites, defies Cody's order sending
        him to Kansas.
      n: '[[w.ralph-northern-protest]], 222. Check: the month (Ralph: early 1968).'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-11.black-nationalism
      when: Nov.
      date: 1968-11
      thread: black-nationalism
      c: Chicago. Fred Hampton and Bobby Rush found the Illinois chapter of the Black Panther Party.
      n: '[[w.ralph-northern-protest]], 230. Check: the month (Ralph: late 1968).'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1963-12.civil-rights-organizations
      when: Dec.
      date: 1963-12
      thread: civil-rights-organizations
      also:
      - desegregation-schools
      c: Chicago. Lawrence Landry, wanting more militancy than the Coordinating Council's, leaves it to found ACT with militants
        elsewhere.
      n: '[[w.ralph-northern-protest]], 23, 77. Check: the month (Ralph: late 1963).'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1964-05.king
      when: May
      date: 1964-05
      thread: king
      c: 'King to an interviewer: "more and more I feel that the problem is so national in its scope that I will have to do
        more work in the North than I have in the past."'
      n: '[[w.ralph-northern-protest]], 31. Check: the day. Names: King.'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1964-07.civil-disorders
      when: July
      date: 1964-07
      thread: civil-disorders
      also:
      - civil-rights-organizations
      c: 'Rochester, N.Y., after the riot, at local ministers'' call. Andrew Young and Bevel lead seven SCLC organizers in
        overalls among the young: violence will not solve their problems. Young: "amazing and almost immediate success."'
      n: '[[w.ralph-northern-protest]], 32. Check: the days. See [[cal.1964-07-24.states-and-cities]]. Names: Young.'
      tags:
      - state:ny
      - city:rochester
      - name:young-andrew-j-jr
- add:
    entry:
      id: cal.1965-07-27.king
      when: July 27
      date: '1965-07-27'
      thread: king
      c: 'Cleveland. King on the East Side, at a breakfast with the clergy, an evening address: "the Negro is not free in
        the North."'
      n: '[[w.ralph-northern-protest]], 35. See [[cal.1965-07-24.king]]. Names: King.'
      tags:
      - state:oh
      - city:cleveland
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1965-07-28.king
      when: July 28
      date: '1965-07-28'
      thread: king
      c: 'Cleveland. King to over three thousand: a "grand alliance" of "intellectuals, liberals, labor, management, churches."'
      n: '[[w.ralph-northern-protest]], 35. See [[cal.1965-07-27.king]]. Names: King.'
      tags:
      - state:oh
      - city:cleveland
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1965-07.king
      when: July, late
      date: 1965-07
      thread: king
      also:
      - civil-rights-organizations
      c: 'Powell to reporters: he has told King not to come to New York; "go to cities where they had no real Negro leadership—like
        Chicago, Cleveland, and Washington." The New York stop of King''s tour is called off.'
      n: '[[w.ralph-northern-protest]], 35–36. Check: the day. Names: Powell, King.'
      tags:
      - name:powell-adam-clayton-jr
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1965-07.king-2
      when: July, late
      date: 1965-07
      thread: king
      also:
      - civil-rights-organizations
      c: Philadelphia. Cecil Moore of the NAACP's branch against King's visit, "an unwitting tool" of the "egghead white power
        structure"; King has Fauntroy call it off; Moore, under criticism, endorses a new invitation.
      n: '[[w.ralph-northern-protest]], 35–36. Check: the day. Names: King.'
      tags:
      - state:pa
      - city:philadelphia
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1965-09.civil-rights-organizations
      when: Sept.
      date: 1965-09
      thread: civil-rights-organizations
      c: 'Chicago. Alderman Ralph Metcalfe on SCLC''s choice of Chicago: "We have competent leadership in Chicago and all
        things necessary to work out our city''s own destiny"; with Bishop Louis Henry Ford he announces the Chicago Committee
        to Fulfill These Rights.'
      n: '[[w.ralph-northern-protest]], 81. Check: the day. See [[cal.1965-09-01.king]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-02.open-housing-5
      when: Feb., late
      date: 1966-02
      thread: open-housing
      c: 'Chicago. Judge James Parsons, of the federal bench, a chairman of the National Conference on Religion and Race,
        on the seizure of 1321 South Homan: "theft" and "a revolutionary tactic."'
      n: '[[w.ralph-northern-protest]], 78. Check: the day. See [[cal.1966-02-23.open-housing]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-07.open-housing-2
      when: July, mid
      date: 1966-07
      thread: open-housing
      c: 'Alinsky to a Washington Post reporter: "I think King is finished. He''s trapped. He can''t get out of [Chicago]
        in less than ten months to a year and he doesn''t know what to do if he stays."'
      n: '[[w.ralph-northern-protest]], 92. Check: the day. To check: Washington Post, July 17, 1966, 8 (cited by [[w.ralph-northern-protest]],
        92 n.2). Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-08.republican-party-2
      when: Aug., early
      date: 1966-08
      thread: republican-party
      also:
      - open-housing
      c: 'Chicago. The 13th Ward''s Republican committeeman: "I ... am fed up with sociologists and bearded weirdies telling
        me that I am incapable of brotherly love ... and Martin Luther King telling me how I must live and who I must live
        with."'
      n: '[[w.ralph-northern-protest]], 129. Check: the day and the name. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-08.mayors
      when: Aug.
      date: 1966-08
      thread: mayors
      also:
      - open-housing
      c: 'Chicago, City Hall, after the march of Aug. 5. Southwest Side delegates beg Daley to stop the marches, some for
        an inquiry into "communist influence"; Daley: "They have a right to march."'
      n: '[[w.ralph-northern-protest]], 129–30. Check: the day. See [[cal.1966-08-02.mayors]]. Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
- add:
    entry:
      id: cal.1966-08.open-housing-2
      when: Aug., mid
      date: 1966-08
      thread: open-housing
      c: 'Humphrey, to a nationwide audience, after Cody''s call: it "merits support"; the demonstrators have "gone so far"
        as to provoke a backlash. "People are sick and tired of violence and disorder."'
      n: '[[w.ralph-northern-protest]], 183. Check: the day. See [[cal.1966-08-10.open-housing]]. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1966-08.civil-rights-organizations
      when: Aug., mid
      date: 1966-08
      thread: civil-rights-organizations
      also:
      - open-housing
      c: 'Philadelphia. Wilkins: "Any Chicagoan could have advised Dr. King that the Selma technique was not suited to the
        Chicago Gage Park district."'
      n: '[[w.ralph-northern-protest]], 190. Check: the day. Names: Wilkins, King.'
      tags:
      - state:pa
      - city:philadelphia
      - name:wilkins-roy
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-08-20.open-housing-2
      when: Aug. 20
      date: '1966-08-20'
      thread: open-housing
      also:
      - civil-rights-the-executive
      c: 'Kingston, R.I., the second day of Johnson''s swing through the Northeast: "Men have the right to use the law, but
        they also have the responsibility to obey it."'
      n: '[[w.ralph-northern-protest]], 183. To check: Congressional Quarterly Weekly Report, Sept. 2, 1966, 1932 (cited by
        [[w.ralph-northern-protest]], 183 n.29). See [[cal.1966-08-19.cities-and-housing-2]]. Names: Johnson.'
      tags:
      - state:ri
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-09.open-housing-4
      when: Sept.
      date: 1966-09
      thread: open-housing
      c: Chicago. Robert Lucas of CORE, threatening more marches after Cicero, jailed for failing to pay the fines of his
        civil disobedience in 1965.
      n: '[[w.ralph-northern-protest]], 200. Check: the day. See [[cal.1966-09-04.open-housing]]. Names: Lucas.'
      tags:
      - state:il
      - city:chicago
      - name:lucas-robert
- add:
    entry:
      id: cal.1966-10.jobs-and-wages
      when: Oct.
      date: 1966-10
      thread: jobs-and-wages
      c: 'Chicago. Operation Breadbasket, its staff enlarged, turns to the supermarkets: to stock Negro-made goods and bank
        with Negro banks. High Low Foods, National Tea, Jewel and A & P give way, one by one. King makes Jesse Jackson an
        officer of SCLC by the year''s end.'
      n: '[[w.ralph-northern-protest]], 200. Check: the months (Ralph: the fall of 1966).'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1967-03.open-housing-2
      when: Mar., late
      date: 1967-03
      thread: open-housing
      c: 'Chicago. James Cook of the Leadership Council, on King''s threat of more marches: they could "uncork the bottle."
        The Defender against new ventures: "almost certain ... to produce strife, and little else."'
      n: '[[w.ralph-northern-protest]], 218. Check: the day. See [[cal.1967-03-24.open-housing]]. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1963-07-10.desegregation-schools
      when: July 10
      date: '1963-07-10'
      thread: desegregation-schools
      also:
      - civil-rights-organizations
      c: Chicago. CORE's chapter sits in at the Board of Education, more than a week.
      n: '[[w.ralph-northern-protest]], 19.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1963-07.desegregation-schools
      when: July, late
      date: 1963-07
      thread: desegregation-schools
      c: 'Chicago, Englewood, 73rd Street and Lowe Avenue. Parents led by Rosie Simpson of the 71st and Stewart Parents Council,
        with CORE, the Chicago Area Friends of SNCC, Dick Gregory and later Shuttlesworth, against mobile classrooms on the
        lot: lie-downs before the builders, mass arrests, until the Board of Education cancels the project.'
      n: '[[w.ralph-northern-protest]], 19. Check: the day. Names: Gregory, Shuttlesworth.'
      tags:
      - state:il
      - city:chicago
      - name:gregory-dick
      - name:shuttlesworth-fred
- add:
    entry:
      id: cal.1963-08.desegregation-schools-2
      when: Aug.
      date: 1963-08
      thread: desegregation-schools
      c: Chicago. The Webb suit suspended, the Board of Education agreeing to sponsor a study of the schools' practices, Philip
        Hauser directing.
      n: '[[w.ralph-northern-protest]], 22–23. Check: the month (Ralph: the summer of 1963). See [[cal.1961-09.desegregation-schools]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1963-10-04.desegregation-schools
      when: Oct. 4
      date: '1963-10-04'
      thread: desegregation-schools
      c: Chicago. Willis, ordered by a court to carry out the Board of Education's transfer plan after he had struck white
        high schools from its list, resigns rather than obey.
      n: '[[w.ralph-northern-protest]], 20. Names: Willis.'
      tags:
      - state:il
      - city:chicago
      - name:willis-benjamin-c
- add:
    entry:
      id: cal.1963-10-07.desegregation-schools
      when: Oct. 7
      date: '1963-10-07'
      thread: desegregation-schools
      c: Chicago. The Board of Education rejects Willis's resignation and names a committee to bring him back.
      n: '[[w.ralph-northern-protest]], 20. See [[cal.1963-10-04.desegregation-schools]]. Names: Willis.'
      tags:
      - state:il
      - city:chicago
      - name:willis-benjamin-c
- add:
    entry:
      id: cal.1965-06-08.desegregation-schools
      when: June 8
      date: '1965-06-08'
      thread: desegregation-schools
      c: Chicago. The Board of Education gets an injunction restraining the NAACP's and the Coordinating Council's leaders
        from directing the boycott called against Willis's new contract.
      n: '[[w.ralph-northern-protest]], 25. See [[cal.1965-05-27.desegregation-schools]]. Names: Willis.'
      tags:
      - state:il
      - city:chicago
      - name:willis-benjamin-c
- add:
    entry:
      id: cal.1966-01.open-housing-2
      when: Jan., late
      date: 1966-01
      thread: open-housing
      also:
      - king
      c: Chicago, East Garfield Park, the Church of the Brethren. A mass meeting, over seven hundred, on the community's grievances;
        a woman will "pay no more rent." King pledges SCLC's help toward a union to end slums.
      n: '[[w.ralph-northern-protest]], 60. Check: the day. See [[cal.1966-01-07.king]]. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-02.open-housing-2
      when: Feb., early
      date: 1966-02
      thread: open-housing
      c: Chicago, North Kenwood–Oakland. King and Raby at a rally christening the Kenwood-Oakland Community Organization,
        Jesse Jackson's work.
      n: '[[w.ralph-northern-protest]], 67. Check: the day. Names: King, Raby.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:raby-albert
- add:
    entry:
      id: cal.1966-02.desegregation-schools
      when: Feb., late
      date: 1966-02
      thread: desegregation-schools
      also:
      - open-housing
      c: Chicago, the Near North Side. King and Raby at a rally of parents against Mildred Chuchut, principal of the Jenner
        Elementary School.
      n: '[[w.ralph-northern-protest]], 66. Check: the day. Names: King, Raby.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:raby-albert
- add:
    entry:
      id: cal.1966-07-16.open-housing
      when: July 16
      date: '1966-07-16'
      thread: open-housing
      c: Chicago. A hundred of the movement, Negro and white, picnic in Marquette Park.
      n: '[[w.ralph-northern-protest]], 117. See [[cal.1966-07-14.open-housing]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-08-08.mayors
      when: Aug. 8
      date: '1966-08-08'
      thread: mayors
      also:
      - open-housing
      c: 'Chicago, City Hall. Alderman John Hoellen, Republican, without an appointment, his first visit in over a decade,
        asks Daley to halt the marches; Daley: he has no authority to.'
      n: '[[w.ralph-northern-protest]], 141. Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
- add:
    entry:
      id: cal.1966-12.cities-and-housing
      when: Dec.
      date: 1966-12
      thread: cities-and-housing
      also:
      - king
      c: SCLC gets a $4 million HUD grant to rehabilitate housing in Chicago with the Community Renewal Foundation of the
        Chicago City Missionary Society.
      n: '[[w.ralph-northern-protest]], 225. Check: the day.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1967-06.open-housing
      when: June, late
      date: 1967-06
      thread: open-housing
      c: 'Weston, Ill. Raby and the Coordinating Council against federal funds for the atomic accelerator, the village having
        no fair housing ordinance: a "tent-in," a handful camping.'
      n: '[[w.ralph-northern-protest]], 223. Check: the day. Names: Raby.'
      tags:
      - state:il
      - name:raby-albert
