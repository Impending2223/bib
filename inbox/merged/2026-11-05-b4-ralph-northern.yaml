      when: July 25
      date: '1960-07-25'
      thread: elections-1960-chicago
      also:
      - civil-rights-organizations
      c: Chicago, the Republican convention. Thousands march on it, King and Randolph leading, for a strong civil rights plank.
      n: '[[w.ralph-northern-protest]], 10. Check: the day (Ralph: the summer of 1960). Names: King, Randolph.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:randolph-a-philip
- add:
    entry:
      id: cal.1961-07.desegregation-public-places
      when: July
      date: 1961-07
      thread: desegregation-public-places
      c: Chicago, a South Side beach. Negro youths and white allies hold "wade-ins" against the custom barring Negroes from
        it; they keep on more than two weeks, through beatings and threats.
      n: '[[w.ralph-northern-protest]], 13. Check: the month (Ralph: "the next summer"). To check: "Report on Rainbow Beach,"
        Aug. 1961, CIC papers, box 46, CHS (cited by [[w.ralph-northern-protest]], 13 n.17).'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1961-08.desegregation-schools
      when: Aug.
      date: 1961-08
      thread: desegregation-schools
      c: 'Chicago. The NAACP''s branch, the Reverend Carl Fuqua leading, the Defender urging, calls on Negro parents to register
        their children at less crowded white schools: "Operation Transfer." School officials refuse the transfers.'
      n: '[[w.ralph-northern-protest]], 15. Check: the month (Ralph: the summer of 1961). See [[cal.1961-09.desegregation-schools]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1961-09.desegregation-schools
      when: Sept., late
      date: 1961-09
      thread: desegregation-schools
      c: Chicago. The Woodlawn Organization, the Reverend Arthur Brazier its head, backs the Webb suit, the class action of
        Negro parents refused transfers under Operation Transfer, with the Chatham–Avalon Park Community Council behind them.
      n: '[[w.ralph-northern-protest]], 15, 17. Check: the day the suit was filed (Ralph: after the transfers were refused,
        1961). See [[cal.1961-08.desegregation-schools]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1961-11.desegregation-schools
      when: Nov.
      date: 1961-11
      thread: desegregation-schools
      c: 'Chicago. The Woodlawn Organization''s "death watch" on the Board of Education: two or three of its members, dressed
        in black, sit silently through each meeting.'
      n: '[[w.ralph-northern-protest]], 17. Check: the month (Ralph: two months after late September). See [[cal.1961-09.desegregation-schools]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1962-01.desegregation-schools
      when: Jan., early
      date: 1962-01
      thread: desegregation-schools
      c: Chicago, Vernon Park. Negro mothers sit in at the Burnside School against the transfer of their children from its
        crowded rooms to a more distant school, an uncrowded white school nearby; the Chicago movement's first sit-in. They
        come back each day; ministers join them.
      n: '[[w.ralph-northern-protest]], 15–16 (Alma Coggs: "We just wanted our school situation straightened out"). To check:
        Coggs and others to Richard Daley, Jan. 1, 1962, CUL papers (76-116), box 179-5, UIC; Chicago Daily Defender, Jan.
        4 and 8, 1962 (cited by [[w.ralph-northern-protest]], 16 n.26).'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1962-01-16.desegregation-schools
      when: Jan. 16–17
      date: '1962-01-16'
      thread: desegregation-schools
      c: 'Chicago. The police arrest the Burnside sit-in: seventeen Jan. 16, ten the next day. The judge: he never thought
        he would "see the day" such a case was heard in Chicago. The uproar brings Daley and five Negro aldermen to meet Willis.'
      n: '[[w.ralph-northern-protest]], 16, 16 n.26 (the arrests by day). Check: the day of Daley''s meeting with Willis.
        See [[cal.1962-01.desegregation-schools]]. Names: Daley, Willis.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
      - name:willis-benjamin-c
- add:
    entry:
      id: cal.1962-02.desegregation-schools
      when: Feb.
      date: 1962-02
      thread: desegregation-schools
      c: Chicago. Willis refusing to release an inventory of the city's classrooms, Woodlawn parents form a "truth squad"
        to count the empty rooms in nearby white schools; arrested. The Chatham–Avalon Park Community Council's public conference
        on segregation in the schools.
      n: '[[w.ralph-northern-protest]], 17. See [[cal.1961-11.desegregation-schools]]. Names: Willis.'
      tags:
      - state:il
      - city:chicago
      - name:willis-benjamin-c
- add:
    entry:
      id: cal.1962-05.desegregation-schools
      when: May
      date: 1962-05
      thread: desegregation-schools
      c: 'Chicago, Woodlawn. The Woodlawn Organization''s protests and school boycotts against mobile classrooms at an elementary
        school. Brazier: "The whole Negro community is positively opposed to mobile classrooms, because we believe this is
        a means of maintaining segregation."'
      n: '[[w.ralph-northern-protest]], 17. Check: the month (Ralph: three months after February). See [[cal.1962-02.desegregation-schools]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1963-09.open-housing
      when: Sept.
      date: 1963-09
      thread: open-housing
      also:
      - mayors
      c: 'Chicago. The City Council passes the Fair Housing Ordinance, at Daley''s wish, Alderman James Murray of the Southwest
        Side its floor manager: no discrimination by race, color, religion, national origin or ancestry in the sale, rental
        or lease of housing. Murray''s constituents chase him out of a meeting and picket his house nearly a week.'
      n: '[[w.ralph-northern-protest]], 102 (the ordinance''s terms), 115, 115 n.68 (Murray: "Jim, we''ve got to have it").
        Check: the day. Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
- add:
    entry:
      id: cal.1964-11-03.legislatures
      when: Nov. 3
      date: '1964-11-03'
      thread: legislatures
      also:
      - elections-1964
      c: 'Illinois, the 27th District, the Southwest Side of Chicago, for the State Senate: John Lanigan (R), against fair
        housing, over the Democratic organization''s candidate, Alderman Murray behind him. Check: the count.'
      n: '[[w.ralph-northern-protest]], 116.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1965-04-04.civil-rights-organizations
      when: Apr. 4
      date: '1965-04-04'
      thread: civil-rights-organizations
      also:
      - open-housing
      c: 'Evanston, Ill., Northwestern University, a civil rights rally, Studs Terkel presiding. Bevel of SCLC: "We''re going
        to have a movement in Chicago. We plan to close [Chicago] down."'
      n: '[[w.ralph-northern-protest]], 1. To check: tape of Northwestern civil rights rally, Apr. 4, 1965, Northwestern University
        Archives; Daily Northwestern, Apr. 2 and 6, 1965 (cited by [[w.ralph-northern-protest]], 1 n.1).'
      tags:
      - state:il
      - city:evanston
- add:
    entry:
      id: cal.1965-05.civil-rights-organizations
      when: May, late
      date: 1965-05
      thread: civil-rights-organizations
      also:
      - king
      c: 'Warrenton, Va. King and his advisers on going North. Some against: much left in the South, the North unreceptive,
        the money from Northern givers at risk. King for it: "this is where our mission is, we have received a calling to
        come north" (by Norman Hill''s account).'
      n: '[[w.ralph-northern-protest]], 33. Check: the day. Names: King.'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1965-07.desegregation-schools
      when: July, mid
      date: 1965-07
      thread: desegregation-schools
      c: 'Chicago. Joseph Block of Inland Steel, Peter Peterson of Bell and Howell, Ben Heineman of the Chicago and North
        Western and others, a public letter: "equal access to our schools by all races, with a positive policy and program
        to eliminate segregation."'
      n: '[[w.ralph-northern-protest]], 27–28. Check: the day. Names: Heineman.'
      tags:
      - state:il
      - city:chicago
      - name:heineman-ben-w
- add:
    entry:
      id: cal.1965-08-11.mayors
      when: Aug. 11
      date: '1965-08-11'
      thread: mayors
      c: 'O''Brien to Johnson, of Rostenkowski: "most concerned" about Daley''s race troubles and their effect "on the Mayor
        personally"; the White House might give Daley an assignment "to take him out of the country for a week or two."'
      n: '[[w.ralph-northern-protest]], 81, 81 n.110 (O''Brien''s report quoted). To check: O''Brien to Johnson, Aug. 11,
        1965, Name file, Richard Daley, WHCF, box 10, LBJ Library (cited by [[w.ralph-northern-protest]], 81 n.110). Made
        public: [[w.ralph-northern-protest]], 81 (1993). Names: O''Brien, Johnson, Rostenkowski, Daley.'
      tags:
      - name:daley-richard-j
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:rostenkowski-daniel-d
- add:
    entry:
      id: cal.1965-09-01.king
      when: Sept. 1
      date: '1965-09-01'
      thread: king
      also:
      - civil-rights-organizations
      c: 'Andrew Young to reporters: SCLC has chosen Chicago for its first Northern campaign, with the Coordinating Council
        of Community Organizations.'
      n: '[[w.ralph-northern-protest]], 42. To check: Chicago Sun-Times, Sept. 2, 1965, 1, 30; King, "Why Chicago Is the Target,"
        Amsterdam News, Sept. 11, 1965, 16 (cited by [[w.ralph-northern-protest]], 42 n.101). See [[cal.1965-08-26.civil-rights-organizations]].
        Names: Young.'
      tags:
      - state:il
      - city:chicago
      - name:young-andrew-j-jr
- add:
    entry:
      id: cal.1965-09.king
      when: Sept.
      date: 1965-09
      thread: king
      c: Chicago. SCLC's staff, Bevel in charge, opens its headquarters in the Warren Avenue Congregational Church, East Garfield
        Park, the West Side Christian Parish's and the AFSC's workers joining it.
      n: '[[w.ralph-northern-protest]], 44. Check: the day. See [[cal.1965-09-01.king]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1965-09.king-2
      when: Sept., late
      date: 1965-09
      thread: king
      c: Aurora, Ill., Pleasant Valley Farm. Bevel's five-day retreat for nearly a hundred, toward a program for Chicago;
        then his twice-weekly Wider Community Staff meetings.
      n: '[[w.ralph-northern-protest]], 49. Check: the day. See [[cal.1965-09-01.king]].'
      tags:
      - state:il
- add:
    entry:
      id: cal.1966-01-19.king
      when: Jan. 19
      date: '1966-01-19'
      thread: king
      also:
      - open-housing
      c: 'Chicago, eleven days after the Chicago Plan. King: "I am here to get things started."'
      n: '[[w.ralph-northern-protest]], 43. To check: Los Angeles Times, Jan. 21, 1966, 16 (cited by [[w.ralph-northern-protest]],
        43 n.1). See [[cal.1966-01-07.king]]. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-01.open-housing
      when: Jan., late
      date: 1966-01
      thread: open-housing
      also:
      - king
      c: 'Chicago. King, Raby and Young with the Chicago Conference on Religion and Race, Edgar Chandler, Rabbi Samuel Karff
        and others: the Chicago Plan. Pledges of help; warned that Selma''s backers are not all committed to Chicago''s.'
      n: '[[w.ralph-northern-protest]], 72–73. Check: the day. To check: memo to J. H. Johnson and Hale Nelson, Jan. 20, 1966,
        LCMOC papers, box 154, CHS (cited by [[w.ralph-northern-protest]], 73 n.86). See [[cal.1966-01-07.king]]. Names: King,
        Raby, Young.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:raby-albert
      - name:young-andrew-j-jr
- add:
    entry:
      id: cal.1966-02.open-housing
      when: Feb., early
      date: 1966-02
      thread: open-housing
      c: Chicago, the Mozart Baptist Church. The People's Conference of East Garfield Park, some 450 through the day; King
        closes it. From it the East Garfield Park Union to End Slums, SCLC and over twenty local groups.
      n: '[[w.ralph-northern-protest]], 60–61. Check: the day. To check: "Proposal for a Union to End Slums," Mar. 3, 1966,
        Jehnsen materials, MLK Library (cited by [[w.ralph-northern-protest]], 61 n.53). Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-02-11.jobs-and-wages
      when: Feb. 11
      date: '1966-02-11'
      thread: jobs-and-wages
      also:
      - king
      c: Chicago, a South Side church. King to a large gathering of priests and ministers, for a Chicago Operation Breadbasket.
        Some forty clergy then form committees on the bread, milk, soft drink and soup companies; Jesse Jackson coordinates.
      n: '[[w.ralph-northern-protest]], 68. To check: FBI 100-106670-2303, Feb. 14, 1966 (cited by [[w.ralph-northern-protest]],
        68 n.74). Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-02.king
      when: Feb., early
      date: 1966-02
      thread: king
      also:
      - open-housing
      c: 'Chicago, the archbishop''s residence. King with Archbishop Cody, over an hour: "a very friendly and I might say
        fruitful discussion."'
      n: '[[w.ralph-northern-protest]], 73, 75, 147 n.55 (dated early February). Check: the day. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-02.labor
      when: Feb., mid
      date: 1966-02
      thread: labor
      also:
      - open-housing
      c: 'Chicago. A luncheon called by Charles Hayes of the Packinghouse Workers'' District 1: King''s appeal to labor leaders,
        William Lee of the Chicago Federation of Labor among them, to back the movement.'
      n: '[[w.ralph-northern-protest]], 71. Check: the day. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-02.open-housing-3
      when: Feb., mid
      date: 1966-02
      thread: open-housing
      also:
      - king
      c: Northbrook, Ill. King at a fund raiser given by Lucy Montgomery for the Chicago campaign. Two weeks later, a dinner
        for him at a Hyde Park home, Robert Merriam among the guests.
      n: '[[w.ralph-northern-protest]], 69–70. Check: the days. Names: King.'
      tags:
      - state:il
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-02.open-housing-4
      when: Feb., mid
      date: 1966-02
      thread: open-housing
      c: 'Chicago. William Moyer of the American Friends Service Committee, for Bevel and Young, a report on Chicago''s dual
        housing market: a "color tax" on every Negro family.'
      n: '[[w.ralph-northern-protest]], 100. Check: the day.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-02.black-nationalism
      when: Feb., late
      date: 1966-02
      thread: black-nationalism
      c: 'Chicago, the Nation of Islam''s convention, a few days after King''s dinner with him. Elijah Muhammad: "King does
        not understand the Negro problem. The white people want to buy King."'
      n: '[[w.ralph-northern-protest]], 76–77. Check: the day. See [[cal.1966-02-23.black-nationalism]]. Names: Muhammad,
        King.'
      tags:
      - state:il
      - city:chicago
      - name:muhammad-elijah
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-03.desegregation-schools
      when: Mar., mid
      date: 1966-03
      thread: desegregation-schools
      c: Chicago. Some 150 march on the Board of Education behind Raby and the president of the Concerned Parents of Jenner
        School.
      n: '[[w.ralph-northern-protest]], 66. Check: the day. See [[cal.1966-02.desegregation-schools]]. Names: Raby.'
      tags:
      - state:il
      - city:chicago
      - name:raby-albert
- add:
    entry:
      id: cal.1966-03.open-housing
      when: Mar., late
      date: 1966-03
      thread: open-housing
      also:
      - king
      c: Chicago, East Garfield Park. Six hundred tenants testify against their landlords, John Condor and Louis Costalis,
        King presiding. "We have a power that nobody in Chicago can stop."
      n: '[[w.ralph-northern-protest]], 63. Check: the day. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-03.labor
      when: Mar., late
      date: 1966-03
      thread: labor
      also:
      - open-housing
      c: 'Chicago. Ralph Helstein and Charles Hayes of the Packinghouse Workers, Jack Conway and Norman Hill of the AFL-CIO''s
        Industrial Union Department, Brendan Sexton of the UAW with King, Bevel, Young, Raby, Rustin and Richard Boone: labor
        organizers for the ghettos.'
      n: '[[w.ralph-northern-protest]], 71–72. Check: the day. Names: King, Young, Raby, Rustin.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:young-andrew-j-jr
      - name:raby-albert
      - name:rustin-bayard
- add:
    entry:
      id: cal.1966-03.open-housing-2
      when: Mar., late
      date: 1966-03
      thread: open-housing
      also:
      - mayors
      c: 'Chicago, City Hall. King and some forty ministers with Daley and his officials nearly four hours. King: "very meaningful,
        frank and exhaustive."'
      n: '[[w.ralph-northern-protest]], 88. Check: the day (the notes cite the papers of Mar. 25). To check: Daley to King,
        Mar. 25, 1966, MLK papers, box 5-29, MLK Library (cited by [[w.ralph-northern-protest]], 88 n.127). Names: King, Daley.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:daley-richard-j
- add:
    entry:
      id: cal.1966-05-09.open-housing
      when: May 9
      date: '1966-05-09'
      thread: open-housing
      c: 'Chicago. SCLC''s workshop for some four hundred Blackstone Rangers: a film of the Watts riot; Bevel: the gangs are
        playing Daley''s game, "fighting each other while he gets free."'
      n: '[[w.ralph-northern-protest]], 94. Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
- add:
    entry:
      id: cal.1966-05-11.open-housing
      when: May 11
      date: '1966-05-11'
      thread: open-housing
      also:
      - king
      c: 'Chicago. King with a large gathering of South Side gang members: to help in the coming voter registration and to
        end the gang wars.'
      n: '[[w.ralph-northern-protest]], 94. See [[cal.1966-05-09.open-housing]]. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-05.open-housing
      when: May, mid
      date: 1966-05
      thread: open-housing
      c: 'Oak Park, Ill. Project Open Communities, the AFSC''s: after two months'' testing of real estate offices, marches
        every Saturday, fifty to a hundred, to the offices and the village hall for a fair housing ordinance; Bevel, LaFayette
        and Jesse Jackson join them. Through July.'
      n: '[[w.ralph-northern-protest]], 100–101, 125. Check: the day.'
      tags:
      - state:il
      - city:oak-park
- add:
    entry:
      id: cal.1966-05.desegregation-schools
      when: May, late
      date: 1966-05
      thread: desegregation-schools
      c: Chicago. Willis announces he will retire early.
      n: '[[w.ralph-northern-protest]], 98. Check: the day. Names: Willis.'
      tags:
      - state:il
      - city:chicago
      - name:willis-benjamin-c
- add:
    entry:
      id: cal.1966-06.civil-disorders
      when: June, mid
      date: 1966-06
      thread: civil-disorders
      also:
      - states-and-cities
      c: Chicago. Rioting in a Puerto Rican neighborhood; SCLC's and the West Side Christian Parish's workers go there.
      n: '[[w.ralph-northern-protest]], 105, 105 n.37. Check: the days. To check: Robert Mueller, Executive Director''s Report,
        June 20, 1966, CCMS papers, vol. 6, CTS (cited by [[w.ralph-northern-protest]], 105 n.37).'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-06.open-housing
      when: June, late
      date: 1966-06
      thread: open-housing
      also:
      - king
      c: 'Chicago, the movement''s steering committee. King agrees: the goal an "open city," housing discrimination the first
        target of direct action.'
      n: '[[w.ralph-northern-protest]], 102–3. Check: the day. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-07-11.open-housing
      when: July 11
      date: '1966-07-11'
      thread: open-housing
      c: Chicago, the New Friendship Baptist Church, the South Side. LaFayette and Bevel give over five hundred the open-housing
        "battle plan"; marchers warned to expect hostility. Testing of real estate offices on the Southwest Side; by July
        14, seventy-eight cases of discrimination claimed.
      n: '[[w.ralph-northern-protest]], 114, 116. See [[cal.1966-07-10.open-housing]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-07-13.open-housing
      when: July 13
      date: '1966-07-13'
      thread: open-housing
      c: 'Chicago. The East Garfield Park Union to End Slums signs a collective bargaining agreement with Condor and Costalis,
        after a rent strike: prompt maintenance for rules of tenant conduct; rent withheld if the landlords default.'
      n: '[[w.ralph-northern-protest]], 64. To check: "Agreement between Condor-Costalis Real Estate Company and East Garfield
        Park Union to End Slums," July 13, 1966, Gilbert Cornfield files (cited by [[w.ralph-northern-protest]], 61 n.53).
        See [[cal.1966-03.open-housing]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-07-14.open-housing
      when: July 14
      date: '1966-07-14'
      thread: open-housing
      c: 'Chicago, Gage Park–Chicago Lawn. Nearly a hundred march on real estate offices; Bevel: "to see if we like it here."
        A basketball game in Marquette Park.'
      n: '[[w.ralph-northern-protest]], 117. See [[cal.1966-07-11.open-housing]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-07-14.open-housing-2
      when: July 14
      date: '1966-07-14'
      thread: open-housing
      also:
      - king
      c: 'Chicago, the New Friendship Baptist Church, evening. King, of Kerner''s executive order against discrimination in
        the sale and rental of housing: "we want that thin paper to turn into thick action"; "we will make [Chicago] an open
        city through non-violence."'
      n: '[[w.ralph-northern-protest]], 117. Check: the date of Kerner''s order. Names: King, Kerner.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:kerner-otto
- add:
    entry:
      id: cal.1966-07-18.press-and-broadcasting
      when: July 18
      date: '1966-07-18'
      thread: press-and-broadcasting
      also:
      - open-housing
      c: 'The Chicago Defender, editorial, after the riots: "it is regrettable that Dr. King did not avail himself of the
        counsel and influence of the whole local leadership."'
      n: '[[w.ralph-northern-protest]], 113. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-07-21.open-housing
      when: July 21
      date: '1966-07-21'
      thread: open-housing
      also:
      - king
      c: 'Chicago. King: "we shall step up our plans for nonviolent direct action to make Chicago an open city." A new command:
        the Agenda Committee for strategy, King, Raby, Berry, Hayes, McDermott, Kale Williams; the Action Committee for tactics,
        Bevel, LaFayette and Jesse Jackson leading.'
      n: '[[w.ralph-northern-protest]], 117–18. Names: King, Raby.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:raby-albert
- add:
    entry:
      id: cal.1966-07-24.open-housing
      when: July 24
      date: '1966-07-24'
      thread: open-housing
      c: Chicago, Gage Park. A prayer vigil at St. Gall's Catholic Church; young whites throw eggs and jeer.
      n: '[[w.ralph-northern-protest]], 119. See [[cal.1966-07-17.open-housing]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-07-28.open-housing-2
      when: July 28
      date: '1966-07-28'
      thread: open-housing
      also:
      - king
      c: Chicago, a South Side rally, Carmichael in the city the same day. King announces an all-night vigil on the Southwest
        Side for the next day.
      n: '[[w.ralph-northern-protest]], 119. Names: King, Carmichael.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:carmichael-stokely
- add:
    entry:
      id: cal.1966-07.jobs-and-wages
      when: July, late
      date: 1966-07
      thread: jobs-and-wages
      c: Chicago. Operation Breadbasket turns from the dairies to the soft drink bottlers; by the month's end, agreements
        with Coca-Cola and Pepsi-Cola, thirty new Negro employees each.
      n: '[[w.ralph-northern-protest]], 200. Check: the day. See [[cal.1966-07-22.jobs-and-wages]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-07.open-housing
      when: July, late
      date: 1966-07
      thread: open-housing
      c: Chicago. Women Mobilized for Change, formed after a meeting with Coretta King in mid-July, holds a women's witness
        outside City Hall for Negro rights; Daley meets a delegation that day.
      n: '[[w.ralph-northern-protest]], 140–41. Check: the days. To check: "An Open Letter of Concern," July 29, 1966, WMC
        papers, box 1-1, UIC (cited by [[w.ralph-northern-protest]], 141 n.32). Names: Coretta King, Daley.'
      tags:
      - state:il
      - city:chicago
      - name:king-coretta-scott
      - name:daley-richard-j
- add:
    entry:
      id: cal.1966-08-01.open-housing
      when: Aug. 1
      date: '1966-08-01'
      thread: open-housing
      also:
      - king
      c: 'King, from Atlanta, and Raby, a statement against the police''s failure to protect the marchers. Raby: "We will
        march for two weeks or two years if necessary."'
      n: '[[w.ralph-northern-protest]], 121. See [[cal.1966-07-31.open-housing]]. Names: King, Raby.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:raby-albert
- add:
    entry:
      id: cal.1966-08-02.mayors
      when: Aug. 2
      date: '1966-08-02'
      thread: mayors
      also:
      - open-housing
      c: 'Chicago, City Hall. Daley with the Southwest Side''s aldermen, clergy and civic leaders; his statement a call for
        order: "Violence never led to anything constructive, and disorder leads to disorder."'
      n: '[[w.ralph-northern-protest]], 129. Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
- add:
    entry:
      id: cal.1966-08-03.open-housing-2
      when: Aug. 3
      date: '1966-08-03'
      thread: open-housing
      c: Chicago, Belmont-Cragin. A second march; hundreds of whites, held back by police, curse and jeer.
      n: '[[w.ralph-northern-protest]], 122. See [[cal.1966-08-02.open-housing]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-08-04.open-housing-2
      when: Aug. 4
      date: '1966-08-04'
      thread: open-housing
      also:
      - mayors
      c: 'Chicago, the Washington Park YMCA, three hours. King and Raby with elected officials, most of them Negro, Metcalfe
        at the head of Daley''s six aldermen; Chew charges the movement with freezing out politicians who back it. The aldermen
        endorse open housing and nondiscriminatory mortgages; not Raby''s call for precinct captains to live in their precincts.
        King: "nonviolence needs some victories."'
      n: '[[w.ralph-northern-protest]], 143–44. To check: Woodlawn Booster, Aug. 11, 1966; Chicago''s American, Aug. 10, 1966,
        1, 10; New Crusader, Aug. 6, 1966, 1, 3 (cited by [[w.ralph-northern-protest]], 143 n.39). Names: King, Raby.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:raby-albert
- add:
    entry:
      id: cal.1966-08-05.open-housing-2
      when: Aug. 5
      date: '1966-08-05'
      thread: open-housing
      c: 'A top aide sends Johnson a report from Ramsey Clark: the "situation in Chicago is extremely bad."'
      n: '[[w.ralph-northern-protest]], 180. Names: Johnson, Clark.'
      tags:
      - name:johnson-lyndon-b
      - name:clark-ramsey
- add:
    entry:
      id: cal.1966-08-08.open-housing
      when: Aug. 8
      date: '1966-08-08'
      thread: open-housing
      c: 'Chicago, the Warren Avenue Congregational Church, nearly five hundred. Jesse Jackson: "I''m going to Cicero." Bevel:
        "They can buy tanks and they can arm every child, but we''re going to Cicero." The pledge unauthorized; King, in the
        South, says he will go if Chicago does not act.'
      n: '[[w.ralph-northern-protest]], 138–39. To check: Chicago Daily News, Aug. 9, 1966, 11; WGN files, Aug. 9, 1966, FF1728,
        CHS (cited by [[w.ralph-northern-protest]], 139 n.23). Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-08-09.mayors
      when: Aug. 9
      date: '1966-08-09'
      thread: mayors
      also:
      - open-housing
      c: 'Chicago. Daley: "I am asking for calm. I will meet with anyone and do anything to prevent what is happening to our
        city." The Commission on Human Relations, at a noon meeting, proposes a peace conference; Daley telephones Ross Beatty
        of the Real Estate Board to call one.'
      n: '[[w.ralph-northern-protest]], 130, 149–50. To check: CCHR minutes, Aug. 9, 1966, Marciniak files (cited by [[w.ralph-northern-protest]],
        150 n.62). Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
- add:
    entry:
      id: cal.1966-08-09.open-housing-2
      when: Aug. 9
      date: '1966-08-09'
      thread: open-housing
      also:
      - labor
      c: Robert Johnston, the UAW's Midwest director, with Raby on starting talks; Reuther telephones King, ill in Jackson,
        Miss.
      n: '[[w.ralph-northern-protest]], 145. Names: Raby, Reuther, King.'
      tags:
      - state:il
      - city:chicago
      - name:raby-albert
      - name:reuther-walter
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-08-09.open-housing-3
      when: Aug. 9
      date: '1966-08-09'
      thread: open-housing
      c: 'Pucinski to Johnson, a letter released: the marchers "not interested in furthering the cause of social justice and
        human dignity but instead are bent upon a policy of turmoil."'
      n: '[[w.ralph-northern-protest]], 142. To check: Pucinski to Johnson, Aug. 9, 1966, Gen HU2, WHCE, box 14, LBJ Library
        (cited by [[w.ralph-northern-protest]], 142 n.38). Names: Pucinski, Johnson.'
      tags:
      - state:il
      - city:chicago
      - name:pucinski-roman-c
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-08-10.press-and-broadcasting
      when: Aug. 10
      date: '1966-08-10'
      thread: press-and-broadcasting
      also:
      - open-housing
      c: 'The Chicago Daily News: "Dr. Martin Luther King has made his point in Chicago"; call off the marches. The day before:
        "We question the sense of Sunday''s march."'
      n: '[[w.ralph-northern-protest]], 144. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-08-10.open-housing-3
      when: Aug. 10
      date: '1966-08-10'
      thread: open-housing
      c: Chicago. Bevel, angry at Raby's word to the press that the Southwest Side march is off, wants it held; both lead
        a demonstration at the Chicago Real Estate Board instead. William Caples and Paul Lund ask Eugene Callahan of the
        Conference on Religion and Race to convene the peace conference.
      n: '[[w.ralph-northern-protest]], 139, 150. Names: Raby.'
      tags:
      - state:il
      - city:chicago
      - name:raby-albert
- add:
    entry:
      id: cal.1966-08-11.mayors
      when: Aug. 11
      date: '1966-08-11'
      thread: mayors
      also:
      - labor
      c: 'Chicago. Daley with the city''s labor leaders, two and a half hours, Johnston arranging: William Lee and William
        McFetridge of the Chicago Federation of Labor, Joseph Germano of the Steelworkers; their "unanimous support" for taking
        the conflict to the conference table.'
      n: '[[w.ralph-northern-protest]], 145, 145 n.44 (reports differ on the day). Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
- add:
    entry:
      id: cal.1966-08-14.open-housing
      when: Aug. 14
      date: '1966-08-14'
      thread: open-housing
      c: Chicago, Marquette Park. The movement's march not coming, the editor of the Nazi party's Stormtrooper speaks to over
        a thousand counterdemonstrators; the crowd attacks passing Negro motorists, a woman's jaw broken.
      n: '[[w.ralph-northern-protest]], 148–49. See [[cal.1966-08-12.open-housing]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-08-18.open-housing
      when: Aug. 18
      date: '1966-08-18'
      thread: open-housing
      also:
      - king
      c: 'Chicago, the Greater Mount Hope Baptist Church, fifteen hundred inside, a thousand outside. King: "We''ve just brought
        to the surface hatred that was already there"; "I''m going to live wherever I want to live."'
      n: '[[w.ralph-northern-protest]], 159–60. To check: King speech, Aug. 18, 1966, MLK speech file, MLK Library (cited
        by [[w.ralph-northern-protest]], 160 n.92). See [[cal.1966-08-17.open-housing]]. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-08-19.mayors
      when: Aug. 19
      date: '1966-08-19'
      thread: mayors
      also:
      - open-housing
      c: 'Daley on television in prime time, his first such address, ten minutes: he hates injunctions, but the "dilemma of
        balancing rights"; the leaders should take "the issue out of the streets and onto the conference table."'
      n: '[[w.ralph-northern-protest]], 160–61. See [[cal.1966-08-19.open-housing]]. Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
- add:
    entry:
      id: cal.1966-08-19.open-housing-2
      when: Aug. 19
      date: '1966-08-19'
      thread: open-housing
      c: 'Chicago. The summit''s subcommittee meets first, Thomas Ayers of Commonwealth Edison in the chair; for the movement
        Raby, Kale Williams, McDermott, Berry and Bevel. Raby: "we will get definite agreements on open housing and get them
        in writing."'
      n: '[[w.ralph-northern-protest]], 161–62. See [[cal.1966-08-17.open-housing]]. Names: Raby.'
      tags:
      - state:il
      - city:chicago
      - name:raby-albert
- add:
    entry:
      id: cal.1966-08-19.open-housing-3
      when: Aug. 19
      date: '1966-08-19'
      thread: open-housing
      also:
      - king
      c: 'Chicago, Al Pitcher''s home, night. The Action Committee, Jesse Jackson for breaking the injunction; King, with
        Young, for restraint: one march within the order, five hundred at most, others into the suburbs.'
      n: '[[w.ralph-northern-protest]], 162–63. Names: King, Young.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:young-andrew-j-jr
- add:
    entry:
      id: cal.1966-08-20.open-housing
      when: Aug. 20
      date: '1966-08-20'
      thread: open-housing
      also:
      - king
      c: 'Chicago, the Urban League''s office. The Agenda Committee with Bevel, LaFayette, Jackson and Pitcher: King against
        defying the injunction, its penalty fines, not jail. King announces a march into Cicero for Aug. 28; Kerner agrees
        to the town''s plea for the Guard.'
      n: '[[w.ralph-northern-protest]], 163, 166. Names: King, Kerner.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:kerner-otto
- add:
    entry:
      id: cal.1966-08-23.open-housing
      when: Aug. 23
      date: '1966-08-23'
      thread: open-housing
      c: 'Chicago. Bevel and Jesse Jackson lead two hundred through the East Side. King, back from Atlanta, to students and
        gang members at Christ Methodist Church: "We''re not only going to walk in Cicero, we''re going to work and live there."'
      n: '[[w.ralph-northern-protest]], 166. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-08-24.open-housing
      when: Aug. 24
      date: '1966-08-24'
      thread: open-housing
      c: Chicago, West Elsdon. Jesse Jackson and James Orange lead over a hundred through hostile crowds.
      n: '[[w.ralph-northern-protest]], 166. See [[cal.1966-08-21.open-housing]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-08-26.civil-rights-organizations
      when: Aug. 26
      date: '1966-08-26'
      thread: civil-rights-organizations
      also:
      - open-housing
      c: 'Chicago, after the summit agreement. Robert Lucas of CORE: "nothing but another promise on a piece of paper." Chester
        Robinson of the West Side Organization: "the poor Negro has been sold out"; WSO will march into Cicero "come hell
        or high water." The march put off to Sept. 4.'
      n: '[[w.ralph-northern-protest]], 195–96. To check: Los Angeles Times, Aug. 27, 1966, 1, 5; New York Times, Aug. 27,
        1966, 1, 17 (cited by [[w.ralph-northern-protest]], 196 n.3). See [[cal.1966-08-26.open-housing]]. Names: Lucas.'
      tags:
      - state:il
      - city:chicago
      - name:lucas-robert
- add:
    entry:
      id: cal.1966-08-28.king
      when: Aug. 28
      date: '1966-08-28'
      thread: king
      also:
      - open-housing
      c: 'Atlanta, Ebenezer Baptist Church. King of the summit agreement: "what will probably stand out as a most significant
        and far-reaching victory that has ever come about in a Northern community on the whole question of open housing."'
      n: '[[w.ralph-northern-protest]], 195. To check: King speech, Aug. 28, 1966, MLK speech file, MLK Library (cited by
        [[w.ralph-northern-protest]], 195 n.1). See [[cal.1966-08-26.open-housing]]. Names: King.'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-08-31.desegregation-schools
      when: Aug. 31
      date: '1966-08-31'
      thread: desegregation-schools
      c: Chicago. Willis's last day as superintendent; James Redmond, from Long Island, succeeds him.
      n: '[[w.ralph-northern-protest]], 202. Names: Willis.'
      tags:
      - state:il
      - city:chicago
      - name:willis-benjamin-c
- add:
    entry:
      id: cal.1966-09.open-housing
      when: Sept., mid
      date: 1966-09
      thread: open-housing
      c: Chicago. A Nazi-sponsored march through the South Side ghetto; few join it.
      n: '[[w.ralph-northern-protest]], 221. Check: the day.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-09.labor
      when: Sept., mid
      date: 1966-09
      thread: labor
      c: 'Chicago, a South Side rally. Young for organizing underpaid workers: join the fight against Saks Fifth Avenue for
        union recognition. Jesse Jackson and others picket the store.'
      n: '[[w.ralph-northern-protest]], 202. Check: the day. Names: Young.'
      tags:
      - state:il
      - city:chicago
      - name:young-andrew-j-jr
- add:
    entry:
      id: cal.1966-09.cities-and-housing
      when: Sept., late
      date: 1966-09
      thread: cities-and-housing
      also:
      - king
      c: 'Chicago, Englewood. King at a rally against razing housing for a parking lot at 63rd and Halsted: he will lead the
        fight against callous urban renewal. Picketing, boycotts and marches through the fall.'
      n: '[[w.ralph-northern-protest]], 202. Check: the day. Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1966-09.open-housing-2
      when: Sept.
      date: 1966-09
      thread: open-housing
      c: Chicago. The summit's follow-up committee chooses James W. Cook, president of Illinois Bell, to chair the continuing
        body for fair housing; religious leaders, Cody among them, ask him.
      n: '[[w.ralph-northern-protest]], 206. Check: the day.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1966-10.civil-rights-organizations
      when: Oct., early
      date: 1966-10
      thread: civil-rights-organizations
      c: Chicago. Coordinating Council delegates, angry at the summit agreement and at not meeting as a body for over a month,
        move to oust Raby as convenor; they nearly succeed.
      n: '[[w.ralph-northern-protest]], 203. Check: the day. Names: Raby.'
      tags:
      - state:il
      - city:chicago
      - name:raby-albert
- add:
    entry:
      id: cal.1966-12.king
      when: Dec., early
      date: 1966-12
      thread: king
      c: Chicago. King announces "an intensive voter registration and voter motivation drive," Hosea Williams to run it with
        a dozen of his workers.
      n: '[[w.ralph-northern-protest]], 204–5. Check: the day. Names: King, Hosea Williams.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:williams-hosea
- add:
    entry:
      id: cal.1967-01.king-2
      when: Jan., early
      date: 1967-01
      thread: king
      c: 'Chicago. The voter drive''s opening rally: Abernathy, Conyers of Michigan, Robert Henry, Negro mayor of Springfield,
        Ohio. Few come on the trial "Freedom Day" at City Hall; Williams claims 32,000 registered, the city fewer than five
        hundred.'
      n: '[[w.ralph-northern-protest]], 205. Check: the day. See [[cal.1966-12.king]]. Names: Abernathy, Conyers, Hosea Williams.'
      tags:
      - state:il
      - city:chicago
      - name:abernathy-ralph-david
      - name:conyers-john-jr
      - name:williams-hosea
- add:
    entry:
      id: cal.1967-04.mayors
      when: Apr., early
      date: 1967-04
      thread: mayors
      c: 'Chicago, days before the election. King and Young having said there will be more protests in the summer, Daley:
        "We''ve been listening to statements from outsiders for a long time, and I think the people of Chicago are about filled
        up with these kind of statements."'
      n: '[[w.ralph-northern-protest]], 223. Check: the day. See [[cal.1967-03-24.open-housing]]. Names: King, Young, Daley.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
      - name:young-andrew-j-jr
      - name:daley-richard-j
- add:
    entry:
      id: cal.1967-04.open-housing
      when: Apr.
      date: 1967-04
      thread: open-housing
      c: Chicago. The Lawndale union, after a long rent strike, forces Eva Atlas to sell her eleven Lawndale buildings to
        the Kate Maremount Foundation; the union and the foundation to rehabilitate six.
      n: '[[w.ralph-northern-protest]], 201. Check: the day.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1967-05.open-housing
      when: May, early
      date: 1967-05
      thread: open-housing
      also:
      - king
      c: Louisville. King takes up the open housing campaign; against the Committee on Open Housing's threat to the Derby,
        a march downtown instead, the race run undisturbed.
      n: '[[w.ralph-northern-protest]], 215–16. Check: the day. See [[cal.1967-04-11.open-housing-louisville]]. Names: King.'
      tags:
      - state:ky
      - city:louisville
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1967-05.open-housing-2
      when: May
      date: 1967-05
      thread: open-housing
      also:
      - king
      c: Louisville, the South End, a week after the Derby march. King, following a march by car, is nicked on the neck by
        a rock thrown at his car.
      n: '[[w.ralph-northern-protest]], 216. Check: the day. See [[cal.1967-05.open-housing]]. Names: King.'
      tags:
      - state:ky
      - city:louisville
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1967-05.open-housing-3
      when: May, late
      date: 1967-05
      thread: open-housing
      c: 'Chicago. The Leadership Council''s "Project: Good Neighbor," a campaign of advertising and programming on housing
        discrimination. King: "If this progress continues, I see no need for further demonstrations here."'
      n: '[[w.ralph-northern-protest]], 219. Check: the day. To check: Chicago''s American, May 26, 1967, 5 (cited by [[w.ralph-northern-protest]],
        219 n.70). Names: King.'
      tags:
      - state:il
      - city:chicago
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1967-07.civil-rights-organizations-2
      when: July
      date: 1967-07
      thread: civil-rights-organizations
      c: Chicago, Englewood. Raby, with Rennie Davis of SDS and others, founds a school for community organizers.
      n: '[[w.ralph-northern-protest]], 226. Check: the month (Ralph: the summer of 1967). Names: Raby.'
      tags:
      - state:il
      - city:chicago
      - name:raby-albert
- add:
    entry:
      id: cal.1967-07.king
      when: July
      date: 1967-07
      thread: king
      c: Chicago. King and SCLC announce the Chicago Adult Education Program, $100,000 from the Office of Education, Robert
        Green of Michigan State directing, for Lawndale's residents.
      n: '[[w.ralph-northern-protest]], 225. Check: the month (Ralph: the summer of 1967). Names: King.'
