      c: 'Robert Kennedy''s "Some Notes on the Steel Increase": the President, he writes, is "very anxious to make peace with industry"; Clifford and Bartlett anxious that the grand jury "be delayed or
        forgotten"; "I was very anxious that I continue although in low key." After a strong exchange with Clifford, the President to Bartlett, "joking I think": "What we need in this Administration is
        a good Attorney General that can be fixed."'
