        (the notes). [[w.schlesinger-robert-kennedy-and-his]], 476. Check: FRUS''s editorial note sets the notes at the meeting of Nov. 3, Schlesinger at this one; they are dated Nov. 7 (cited by [[w.schlesinger-robert-kennedy-and-his]],
        476 n.29). The program: [[cal.1961-11-30.cuba]]. Names: Robert Kennedy, McNamara, Nitze, Lansdale, Johnson, Goodwin, Bissell.'
