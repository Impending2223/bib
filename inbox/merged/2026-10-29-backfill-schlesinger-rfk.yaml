      - name:mccone-john-a
      - name:attwood-william
      - name:castro-fidel
      src:
        c: 798dee58
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d376: A-B'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d377: C-D'
        - 'w.schlesinger-robert-kennedy-and-his 553–54: C-D'
