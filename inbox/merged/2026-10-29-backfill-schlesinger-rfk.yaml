      when: Mar. 14
      date: '1963-03-14'
      thread: cuba
      also:
      - robert-kennedy
      - latin-america
      c: 'After the day''s NSC meeting, Robert Kennedy to the President: new efforts against Cuban-trained agents in South America; McCone''s optimism about a military revolt, "What is the basis for that
        appraisal?" "I would not like it said a year from now that we could have had this internal breakup in Cuba but we just did not set the stage for it." The President has Bundy send the questions to
        the CIA.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 538–39. To check: Robert Kennedy to the President, Mar. 14, 1963, and Bundy to the Acting Director of Central Intelligence, Mar. 14, 1963, RFK Papers
        (cited by [[w.schlesinger-robert-kennedy-and-his]], 539 n.24–25). See [[cal.1963-01-08.cuba]]. Names: Robert Kennedy, Kennedy, McCone, Bundy.'
      tags:
      - name:kennedy-robert-f
