- add:
    entry:
      id: cal.1963-10-29.cuba
      when: Oct. 29
      date: '1963-10-29'
      thread: cuba
      c: FitzGerald, head of the CIA's Cuban operations, meets Rolando Cubela (AM/LASH) abroad, holding himself out, with Helms's assent, as Robert Kennedy's personal representative; Robert Kennedy not
        consulted. Cubela asks a means of killing Castro without being killed himself. By FitzGerald's account, the United States would back a coup but have "no part of an attempt on Castro's life"; the
        case officer does not recall it.
      n: '[S. Rep. No. 94-465, 87–88 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=98) ("late fall 1963"). [[w.schlesinger-robert-kennedy-and-his]],
        547 (the day). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: S. Rep. No. 94-755, bk. V, 17, 74–75 (1976) (cited by [[w.schlesinger-robert-kennedy-and-his]], 547 n.60).
        Names: Helms, Robert Kennedy, Castro.'
      tags:
      - name:helms-richard
      - name:kennedy-robert-f
      - name:castro-fidel
      src:
        c: ba475b6a
        rows:
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=98: all'
        - 'w.schlesinger-robert-kennedy-and-his 547: all'
        - 'via w.schlesinger-robert-kennedy-and-his 547 n.60: A-B'
    section: '196310'
- add:
    entry:
      id: cal.1963-11-22.cuba
      when: Nov. 22
      date: '1963-11-22'
      thread: cuba
      c: 'Paris. FitzGerald and the case officer meet Cubela: a cache with high-powered rifles to be dropped in Cuba; "everything he needed (telescopic sight, silencer, all the money he wanted)"; a ball-point
        pen with a hypodermic needle, Blackleaf-40 recommended. Leaving, they learn the President has been shot.'
      n: '[S. Rep. No. 94-465, 88–89 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=99). [[w.schlesinger-robert-kennedy-and-his]], 548. Made public:
        the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1963-10-29.cuba]].'
      tags: []
      src:
        c: 9e84d482
        rows:
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=99: all'
        - 'w.schlesinger-robert-kennedy-and-his 548: B-C'
        - 'via w.schlesinger-robert-kennedy-and-his 548 n.61: B-C'
    section: '196311'
