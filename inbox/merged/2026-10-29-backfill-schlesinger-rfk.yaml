      when: Oct. 19
      date: '1962-10-19'
      thread: missile-crisis
      also:
      - robert-kennedy
      c: 'The ExComm at State, 11 a.m., the President campaigning. Bundy reopens the air strike: "decisive action with its advantages of surprise." Acheson, Dillon, McCone and Taylor for a strike; McNamara
        readies the forces but does not advocate it. Robert Kennedy, with a grin, has also talked with the President: an air strike "with all the memory of Pearl Harbor"; "For 175 years we had not been
        that kind of country. A sneak attack was not in our traditions." He favors action that leaves the Soviets room to pull back.'
      n: 'Meeker''s record, [FRUS 1961–63, XI, doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v11/d31). [[w.schlesinger-robert-kennedy-and-his]], 508–10, with Robert Kennedy''s memorandum
        of Oct. 31. To check: Robert Kennedy, memorandum dictated Oct. 31, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 509 n.45). See [[cal.1962-10-16.missile-crisis]]. Names: Bundy,
        Acheson, Dillon, McCone, Taylor, McNamara, Robert Kennedy, Kennedy.'
