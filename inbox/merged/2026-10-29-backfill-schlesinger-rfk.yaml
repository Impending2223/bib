- add:
    entry:
      id: cal.1963-05-18.alabama
      when: May 18
      date: '1963-05-18'
      thread: alabama
      also:
      - civil-rights-the-executive
      c: 'The President at Vanderbilt University''s ninetieth anniversary, Nashville: "for one man to defy a law or court order he does not like is to invite others to defy those which they do not like."
        Then Muscle Shoals, Ala., the TVA''s thirtieth anniversary, and Huntsville. Wallace with him on the helicopter from Muscle Shoals to Huntsville; on Birmingham, by Salinger''s memorandum, Wallace
        calls King a "faker."'
      n: 'Remarks in Nashville at the 90th Anniversary Convocation of Vanderbilt University, [1963 Pub. Papers 406](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=464); Remarks
        at Muscle Shoals, Alabama, at the 30th Anniversary Celebration of TVA, [1963 Pub. Papers 409](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=467); Remarks at Redstone
        Arsenal, Huntsville, Alabama, [1963 Pub. Papers 412](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=470) (May 18, 1963). [[w.schlesinger-robert-kennedy-and-his]],
        339 (the address; the helicopter). To check: Salinger, "Memorandum of Conversation between President Kennedy and Governor George Wallace ... May 18, 1963," JFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]],
        339 n.106). See [[cal.1963-04-25.alabama]]. Names: Kennedy, Wallace, Salinger, Martin Luther King.'
      tags:
      - name:kennedy-john-f
      - name:wallace-george-c
