      - soviet-union
      c: 'Bolshakov gives Robert Kennedy a message from Khrushchev: if the United States insists on occupation rights in West Berlin, the Soviet Union will have to sign a peace treaty with the GDR, and
        West Berlin become "a free demilitarized city."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 512. To check: the message, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 512, the footnote). Names: Bolshakov, Robert Kennedy, Khrushchev.'
      tags:
