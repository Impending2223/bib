        Robert Kennedy''s notes dictated Aug. 1: he for the increase, with all the cabinet but perhaps Dillon, and Murrow; Sorensen, Heller and the Council of Economic Advisers against. The next weekend:
        "Why don''t you admit that you were wrong about it?"'
