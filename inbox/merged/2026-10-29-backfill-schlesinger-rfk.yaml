      c: 'Bundy to Robert Kennedy, after another review: "useful organized sabotage is still very hard to get. ... Proposals which do more good than harm are rare."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 540–41. To check: McGeorge Bundy to Robert Kennedy, May 16, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 541 n.33). See [[cal.1963-04-03.cuba]].
