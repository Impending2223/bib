- add:
    entry:
      id: cal.1963-04.cuba
      when: Apr.
      date: 1963-04
      thread: cuba
      c: 'Early in the month, Donovan and Nolan in Havana for the Americans in Cuban prisons. Castro at the Bay of Pigs with them; he asks about American policy and how relations might be resumed. Vallejo,
        his physician: Castro wants them, though some Communist officials are opposed. By the CIA''s debriefing of Donovan, Apr. 13.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 541. To check: M. C. Miskovsky to McCone, Apr. 13, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 541 n.37); John Nolan, oral history
        interview by Frank DeRosa, Apr. 25, 1967, 11–12, JFK Library (cited by [[w.schlesinger-robert-kennedy-and-his]], 541 n.34). Check: the days. See [[cal.1961-04-15.cuba]]. Names: Donovan, Castro.'
      tags:
      - name:donovan-james-b
      - name:castro-fidel
      src:
