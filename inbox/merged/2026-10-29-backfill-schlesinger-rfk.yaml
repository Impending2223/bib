        1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 513 n.67). See [[cal.1962-10-16.missile-crisis]]. Names: Bohlen, Kennedy, Sorensen, Rusk, Khrushchev.'
