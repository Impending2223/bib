      c: 'Cabinet Room, 2 p.m., on Cuba: Robert Kennedy, McNamara, Nitze, Lansdale, U. Alexis Johnson, Goodwin, Bissell. By Robert Kennedy''s handwritten notes, McNamara lends him Lansdale, and he sets
        Lansdale to survey Cuba, "the problems & our assets." His idea: "to stir things up on island with espionage, sabotage, general disorder, run & operated by Cubans themselves."'
