      when: Apr.
      date: 1963-04
      thread: republican-party
      also:
      - cuba
      c: 'Nixon on Kennedy''s Cuba policy: "we have goofed an invasion, paid tribute to Castro for the prisoners, then given the Soviets squatters'' rights in our backyard"; he asks a "command decision"
        to get the Russians out.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 540. To check: the New York Times, Apr. 21, 1963 (cited by [[w.schlesinger-robert-kennedy-and-his]], 540 n.27). Check: the day and the occasion. Names:
