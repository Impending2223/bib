      when: May 28
      date: '1963-05-28'
      thread: cuba
      also:
      - robert-kennedy
      c: 'The NSC''s Standing Group on Cuba. McCone for economic hardship and sabotage, to bring the military to overthrow Castro; McNamara doubts sabotage, would study economic pressures. Robert Kennedy:
        the United States "must do something against Castro, even though we do not believe our actions would bring him down."'
      n: '[FRUS 1961–63, XI, doc. 344](https://history.state.gov/historicaldocuments/frus1961-63v11/d344); [S. Rep. No. 94-465, 172 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=183).
        [[w.schlesinger-robert-kennedy-and-his]], 543. See [[cal.1963-01-08.cuba]]. Names: McCone, McNamara, Robert Kennedy, Castro.'
      tags:
