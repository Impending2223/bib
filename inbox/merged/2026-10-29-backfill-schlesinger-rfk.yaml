      thread: robert-kennedy
      also:
      - court
      - georgia
      c: Robert Kennedy argues *Gray v. Sanders* for the United States before the Supreme Court, in morning coat, his first and last appearance as a lawyer in a courtroom. Not that "in all cases all votes
        must be identical in value," but any departure from the ideal needs "a full, good and complete reason." "With Georgia's county-unit system, all you have to do is vote early."
      n: '*Gray v. Sanders*, [372 U.S. 368](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372368/usrep372368.pdf) (1963) (argued Jan. 17). [[w.schlesinger-robert-kennedy-and-his]],
        397–99. To check: Robert Kennedy, "Gray v. Sanders. Notes for Oral Argument," RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 399 n.35); Cox to Robert Kennedy, Dec. 20, 1962, RFK
        Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 398 n.32). The decision: [[cal.1963-03-18.court-2]]. Names: Robert Kennedy.'
