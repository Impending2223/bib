      date: '1963-04-25'
      thread: alabama
      also:
      - robert-kennedy
      - desegregation-schools
      c: 'Montgomery, the Capitol, ringed by state troopers. Robert Kennedy, with Burke Marshall and Guthman, calls on Wallace, who tapes the talk. Wallace: "I will never submit myself voluntarily to any
        integration in a school system in Alabama." Kennedy: "I don''t want to have another Oxford, Mississippi"; "I have no plans to use troops. You seem to want me to use troops."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 337–39. To check: "Transcript of Conversation between Attorney General Robert F. Kennedy and Governor Wallace, Montgomery, Alabama, April 25, 1963," RFK
        Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 339 n.104); Robert Kennedy, interview by Anthony Lewis, Dec. 6, 1964, I, 19–20, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]],
        338 n.103). See [[cal.1963-06-11.alabama]]. Names: Robert Kennedy, Burke Marshall, Guthman, Wallace.'
