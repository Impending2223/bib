      thread: king
      also:
      - robert-kennedy
      c: 'Robert Kennedy learns that the Army has a copy of the FBI''s monograph "Communism and the Negro Movement—A Current Analysis," sent round the government Oct. 18. He calls Evans and Hoover: every
        copy to be got back. All recovered by Oct. 28.'
