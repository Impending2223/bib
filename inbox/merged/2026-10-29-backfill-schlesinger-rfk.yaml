      c: 'Robert Kennedy summons Bolshakov, with a personal message for Khrushchev: the President, relying on Soviet assurances of no new fighting in Laos, "felt now he had been double-crossed." Days later
        Khrushchev''s answer: no further armed action. By Robert Kennedy''s memorandum dictated May 29.'
