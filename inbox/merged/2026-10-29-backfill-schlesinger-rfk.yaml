      date: '1964-02-07'
      thread: cuba
      also:
      - robert-kennedy
      c: 'The White House, 9 a.m., Rusk presiding, and with the President at 5 p.m., on the fishing boats and Guantánamo''s water. Mann for dismissing the base''s Cuban workers; Robert Kennedy strongly
        against: an overreaction, hurting loyal Cubans; McCone with him. By Robert Kennedy''s later account, Mann "sounded like Barry Goldwater making a speech at the Economic Club." The workers are dismissed.'
