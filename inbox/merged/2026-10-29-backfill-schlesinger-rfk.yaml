      date: '1961-11-09'
      thread: cuba
      also:
      - robert-kennedy
      c: 'Szulc, with Goodwin, an hour with the President in the Oval Office. By Szulc''s notes, Kennedy asks, "What would you think if I ordered Castro to be assassinated?" Szulc against it; Kennedy: he
        was testing him, and "under terrific pressure from advisers (think he said intelligence people, but not positive) to okay a Castro murder." By Goodwin''s account, a day or two later: "If we get
        into that kind of thing, we''ll all be targets."'
      n: '[S. Rep. No. 94-465, 138–139 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=149); [[w.schlesinger-robert-kennedy-and-his]], 492. Check:
        the Church report gives Goodwin''s words as "we can''t get into that kind of thing, or we would all be targets." Made public: Szulc, "Cuba on Our Mind," *Esquire*, Feb. 1974. See [[cal.1961-11-08.cuba]].
        Names: Szulc, Goodwin, Kennedy, Castro.'
