      n: '[[w.schlesinger-robert-kennedy-and-his]], 347–48. To check: Schlei to Robert Kennedy, "Comments of the Vice President on the Civil Rights Legislative Proposals," June 4, 1963, RFK Papers (cited
        by [[w.schlesinger-robert-kennedy-and-his]], 348 n.17a); Schlei, interview by John Stewart, Feb. 20–21, 1968, 47–49, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]],
        348 n.17b). See [[cal.1963-06-03.civil-rights-bill]]. Names: Schlei, Robert Kennedy, Johnson.'
