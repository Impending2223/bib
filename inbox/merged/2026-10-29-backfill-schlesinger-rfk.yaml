      when: July 16
      date: '1963-07-16'
      thread: civil-rights-the-executive
      also:
      - robert-kennedy
      c: 'Robert Kennedy''s memorandum: he has told the President of "a difficult time with Johnson and the committee because of his oversensitivity of any outside criticism"; the equal employment committee
        "has not really accomplished what ... the press releases would indicate"; Johnson so furious with Wirtz, over his figures on government contractors with no Negro employees, that "it appeared that
        he would never talk to him."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 336. To check: Robert Kennedy, memorandum, July 16, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 336 n.95). See [[cal.1963-05-29.civil-rights-the-executive]].
        Names: Robert Kennedy, Johnson, Wirtz.'
