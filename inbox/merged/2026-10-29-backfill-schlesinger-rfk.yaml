      date: '1961-04-19'
      thread: cuba
      also:
      - robert-kennedy
      c: 'Robert Kennedy to the President, through O''Donnell: no return to waiting and hoping. Three courses: American troops, rejected "for good and sufficient reasons (although this might have to be
        reconsidered)"; a blockade; or the American republics, through the OAS, to keep all outside arms from Cuba, perhaps after a reported MIG attack on Guantánamo. "If we don''t want Russia to set up
        missile bases in Cuba, we had better decide now what we are willing to do to stop it."'
      n: '[FRUS 1961–63, X, doc. 157](https://history.state.gov/historicaldocuments/frus1961-63v10/d157). [[w.schlesinger-robert-kennedy-and-his]], 471. See [[cal.1961-04-15.cuba]]. Names: Robert Kennedy,
        Kennedy, O''Donnell.'
