      date: '1963-12-14'
      thread: latin-america
      c: 'Johnson names Thomas Mann, ambassador to Mexico, to direct Latin American affairs, the Kennedys unconsulted. Schlesinger''s journal: "a declaration of independence, even perhaps a declaration
        of aggression, against the Kennedys."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 630–31. To check: Schlesinger, journal, Dec. 14, 1963 (cited by [[w.schlesinger-robert-kennedy-and-his]], 631 n.53). Check: the announcement''s form and
        Mann''s titles. See [[cal.1963-12-13.robert-kennedy]]. Names: Johnson, Mann, Schlesinger.'
      tags:
      - name:johnson-lyndon-b
      - name:mann-thomas-c
      - name:schlesinger-arthur-m-jr
