      n: '[[w.schlesinger-robert-kennedy-and-his]], 538. To check: Sterling Cottrell to McGeorge Bundy, Jan. 22, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 538 n.22). See [[cal.1963-01-08.cuba]].
