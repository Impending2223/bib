      date: '1963-12-13'
      thread: robert-kennedy
      also:
      - democratic-party
      c: 'Late afternoon, Robert Kennedy with Goodwin and Schlesinger at Justice, Harriman distressed by Mann''s coming appointment for Latin America: "Our power will last for just eleven months. ... After
        November 5th we''ll all be dead." The hundred men devoted to the purposes "must all stay in close touch"; "collective action." Of Johnson: "He knows all about politics and nothing about human beings."
        By Schlesinger''s journal.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 630–31. To check: Schlesinger, journal, Dec. 13, 1963 (cited by [[w.schlesinger-robert-kennedy-and-his]], 631 n.51–52); Goodwin, "The Structure Itself
        Must Change," *Rolling Stone*, June 6, 1974. Names: Robert Kennedy, Goodwin, Schlesinger, Harriman, Mann, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:harriman-w-averell
      - name:mann-thomas-c
