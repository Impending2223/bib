      when: Dec. 13
      date: '1963-12-13'
      thread: robert-kennedy
      also:
      - cuba
      c: 'State''s meeting on the Attorney General''s proposal to lift the restrictions on travel to Cuba. Martin and others against: the Latin Americans'' restrictions, the isolation of Cuba. Ball to Rusk:
        lift them for every place but Cuba.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 550. To check: Ball to Rusk, Dec. 13, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 550 n.72); Schlesinger, journal, Dec. 13, 1963,
        and Goodwin''s notes of the meeting, Goodwin Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 550 n.70). Names: Martin, Ball, Rusk.'
      tags:
