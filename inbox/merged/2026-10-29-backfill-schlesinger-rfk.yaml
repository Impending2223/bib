      when: Mar. 29
      date: '1963-03-29'
      thread: cuba
      also:
      - robert-kennedy
      c: 'The Executive Committee, 12:30 p.m., on the exile raids. McCone: less criticism from the press and Congress if the raids are not stood down. Rusk: "If anyone is shooting Russians we ought to be
        doing it." By Robert Kennedy''s notes, decided to work up a plan to stop the attacks.'
      n: '[FRUS 1961–63, XI, doc. 303](https://history.state.gov/historicaldocuments/frus1961-63v11/d303). [[w.schlesinger-robert-kennedy-and-his]], 540. To check: Robert Kennedy, handwritten notes, Mar.
        29, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 540 n.30). The announcement: [[cal.1963-03-30.cuba]]. See [[cal.1963-03-17.cuba]]. Names: McCone, Rusk, Robert Kennedy.'
      tags:
