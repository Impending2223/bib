    section: '196311'
- add:
    entry:
      id: cal.1963-11-18.cuba
      when: Nov. 18
      date: '1963-11-18'
      thread: cuba
      also:
      - latin-america
      - elections-1964
      c: 'Miami, to the Inter-American Press Association: Latin America''s problems "will not be solved simply by complaining about Castro, by blaming all problems on communism, or generals, or nationalism."
        A "small band of conspirators" has made Cuba a weapon of external powers to subvert the hemisphere. "This, and this alone, divides us. As long as this is true, nothing is possible. Without it, everything
        is possible."'
      n: 'Address in Miami Before the Inter-American Press Association, [1963 Pub. Papers 872](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=930) (Nov. 18, 1963). [[w.schlesinger-robert-kennedy-and-his]],
        554 (the speech''s signal; Goodwin its chief author). The Tampa address the same day: [[cal.1963-11-18.elections-1964]]. See [[cal.1963-09-18.cuba]]. Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      src:
        c: 66cd9312
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=930: all'
        - 'w.schlesinger-robert-kennedy-and-his 554: B-C'
    section: '196311'
- add:
    entry:
      id: cal.1963-11-19.cuba
      when: Nov. 19
      date: '1963-11-19'
      thread: cuba
      c: 'Bundy to Attwood: the President wants to see him as soon as he has talked with Lechuga; he will not leave Washington again but for a brief trip to Dallas. That night, in Havana, Castro comes to
        Jean Daniel''s hotel and talks till four: "I believe Kennedy is sincere."'
