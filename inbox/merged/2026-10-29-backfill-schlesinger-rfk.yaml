      c: 'Bohlen, leaving for Paris, to the President: the missiles must go, but "it seems to me essential that this channel should be tested out before military action is employed." Sorensen''s summary
        the same day: "the Rusk or the Bohlen approaches," a strike without warning or a prompt letter to Khrushchev first.'
