      when: July 24
      date: '1963-07-24'
      thread: king
      also:
      - robert-kennedy
      c: 'Robert Kennedy tells Evans he has decided against wiretaps on King at his home and office, which Hoover had formally asked July 23: "ill-advised." The tap on the New York attorney to go forward.
        The day before, he had written the Commerce Committee that the Justice Department had no evidence that King or any other leader of the civil rights movement was a Communist.'
      n: '[S. Rep. No. 94-755, Book III, 100–02 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=114) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]],
        359–60. Made public: S. Rep. No. 94-755, Book III (1976). See [[cal.1963-07-16.king]]. Names: Robert Kennedy, Evans, Hoover, Martin Luther King.'
      tags:
