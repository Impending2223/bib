        plot and asks whether he should be sworn in at once. Kennedy asks Katzenbach and calls back: anyone can swear him in. Evening, Andrews and Bethesda.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 607–10. To check: Robert Kennedy, interview by William Manchester, 12–33, 40–45; Robert Morgenthau, interview by Jean Stein, Apr. 20, 1970, 1–2, Stein
