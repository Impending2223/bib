      thread: civil-rights-bill
      also:
      - robert-kennedy
      c: Robert Kennedy before Eastland's Judiciary Committee on the civil rights bill, the first of his days there; to go on July 24. "Those who preach most frequently about states' rights today are not
        seeking the protection of the individual citizen, but his exploitation."
      n: 'Daily Digest, [109 Cong. Rec. D341](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=339) (1963). [[w.schlesinger-robert-kennedy-and-his]], 366. To check:
