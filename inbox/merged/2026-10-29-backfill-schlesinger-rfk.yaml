      thread: cuba
      c: The Special Group (Augmented), Rusk in the chair, McNamara present. Against the stepped-up Course B Plus, for McCone's "CIA variant." By McCone's chronology, he expects Soviet medium-range missiles
        in Cuba. The killing of Cuba's leaders raised and kept out of the record, by Harvey's memorandum of Aug. 14 and McCone's of 1967.
      n: '[FRUS 1961–63, X, doc. 371](https://history.state.gov/historicaldocuments/frus1961-63v10/d371) (editorial note); [S. Rep. No. 94-465, 147 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=158)
        (B Plus and the CIA variant). See [[cal.1961-11-30.cuba]]. Made public: the Church Committee''s interim report, Nov. 20, 1975 (B Plus, the CIA variant). Names: Rusk, McNamara, McCone, Harvey.'
