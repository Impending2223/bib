      when: Dec. 24
      date: '1962-12-24'
      thread: robert-kennedy
      c: 'Junius Scales, the one Communist imprisoned under the Smith Act''s membership clause, out of prison, his sentence commuted, home on Christmas Eve. He had broken with the party in 1956 and would
        not name those he had known in it; Hoover against release; White and Katzenbach had advised against. Robert Kennedy, in 1964: "I had his sentence commuted. I never discussed it with the President."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 394–95. To check: Schlesinger''s journal, Dec. 21, 1962 (cited by [[w.schlesinger-robert-kennedy-and-his]], 395 n.13); Robert Kennedy, interview by John
        Bartlow Martin, Apr. 30, 1964, I, 38–39, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 395 n.14). See [[cal.1961-06-05.court]]. Names: Hoover, White, Katzenbach, Robert
        Kennedy. Check: the day of the commutation.'
