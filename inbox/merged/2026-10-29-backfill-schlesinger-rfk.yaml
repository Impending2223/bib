      date: '1963-07-16'
      thread: king
      also:
      - robert-kennedy
      c: 'Late afternoon, at his request, Robert Kennedy and Courtney Evans: a New York attorney close to King and Levison had been to see Burke Marshall; Kennedy raises wiretaps on the attorney and on
        King. Evans: King is nearly always traveling, and the repercussions if it became known. Kennedy, by Evans''s memorandum: that "did not concern him at all"; "in view of the possible Communist influence
        in the racial situation," as complete coverage as possible.'
      n: '[S. Rep. No. 94-755, Book III, 100–01 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=114) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]],
        359 (and Evans''s testimony of 1975: the idea not clearly Kennedy''s). Made public: S. Rep. No. 94-755, Book III (1976). See [[cal.1962-11.king]]. Names: Robert Kennedy, Evans, Burke Marshall, Martin
        Luther King, Levison.'
