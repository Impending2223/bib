        - 'via w.schlesinger-robert-kennedy-and-his 552 n.78: B-C'
    section: '196309'
- add:
    entry:
      id: cal.1963-10-24.cuba
      when: Oct. 24
      date: '1963-10-24'
      thread: cuba
      c: '5:30 p.m. Jean Daniel of L''Express, on his way to Havana, with the President, at Bradlee''s and Attwood''s urging. By Daniel''s account, Kennedy: "I believe that we created, built and manufactured
        the Castro movement out of whole cloth and without realizing it"; but Castro has agreed "to be a Soviet agent in Latin America"; the blockade to go on as long as the subversion. "Come and see me
        on your return from Cuba."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 552–53 (from Daniel, "Unofficial Envoy," *New Republic*, Dec. 14, 1963, and *Le Temps qui reste* (1973), 149–52). Made public: Daniel, *New Republic*,
        Dec. 14, 1963. See [[cal.1963-09-18.cuba]]. Names: Bradlee, Attwood, Kennedy, Castro.'
      tags:
      - name:bradlee-benjamin-c
      - name:attwood-william
      - name:kennedy-john-f
      - name:castro-fidel
      src:
        c: f6794c2d
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 552–53: all'
    section: '196310'
- add:
    entry:
      id: cal.1963-10-31.cuba
      when: Oct. 31
      date: '1963-10-31'
      thread: cuba
      c: 'Vallejo, Castro''s physician, to Lisa Howard: Castro ready to meet a designated American official, flown secretly by a Cuban plane to a private airport near Havana.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 552. To check: [[w.attwood-reds-and-the-blacks]], 143 (cited by [[w.schlesinger-robert-kennedy-and-his]], 552 n.79). See [[cal.1963-09-18.cuba]]. Names:
        Howard, Castro.'
      tags:
      - name:howard-lisa
      - name:castro-fidel
      src:
        c: ddbf5eac
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 552: all'
    section: '196310'
- add:
    entry:
      id: cal.1963-11-05.cuba
      when: Nov. 5
      date: '1963-11-05'
      thread: cuba
      also:
      - robert-kennedy
      c: 'Special meeting of the Special Group, Robert Kennedy present for the sabotage items and for "Cuba — Peace Feelers": Bundy, Castro would like a talk toward some "arrangement"; Attwood, in touch
        with Lechuga, a likely man for it. The same day Bundy tells Attwood the President more interested than State in exploring the overtures.'
      n: 'Minutes, [FRUS 1961–63, XI, doc. 373](https://history.state.gov/historicaldocuments/frus1961-63v11/d373). [[w.schlesinger-robert-kennedy-and-his]], 553 (Bundy to Attwood). See [[cal.1963-09-18.cuba]].
        Names: Robert Kennedy, Bundy, Castro, Attwood, Lechuga, Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:bundy-mcgeorge
      - name:castro-fidel
      - name:attwood-william
      - name:lechuga-carlos
      - name:kennedy-john-f
      - name:mccone-john-a
