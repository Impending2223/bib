      thread: robert-kennedy
      c: 'Robert Kennedy''s memorandum: Goldfine, ready to talk through Edward Bennett Williams, claims Sherman Adams had "more than $150,000 in cash" from him over some five years, and implicates a Democratic
        governor of Massachusetts and Republican Senators, Bridges among them. The President has called: Bridges has cancer, and "obviously, we did not want to develop this information about him as he was
        dying."'
