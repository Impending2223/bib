        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d373: A'
        - 'w.schlesinger-robert-kennedy-and-his 553: B'
    section: '196311'
- add:
    entry:
      id: cal.1963-11-07.cuba
      when: Nov. 7
      date: '1963-11-07'
      thread: cuba
      c: 'State''s American Republics Division, "The Future of Cuba": before even minimum relations Cuba must leave the bloc, end its subversion, "renounce Marxism-Leninism," compensate expropriated property
        and restore private enterprise.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 553. To check: the memorandum, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 553 n.83). See [[cal.1963-09-18.cuba]].'
      tags: []
      src:
        c: 338d3dce
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 553: all'
        - 'via w.schlesinger-robert-kennedy-and-his 553 n.83: all'
    section: '196311'
- add:
    entry:
      id: cal.1963-11-12.cuba
      when: Nov. 12
      date: '1963-11-12'
      thread: cuba
      also:
      - robert-kennedy
      c: 'Morning, the President with Rusk, McNamara, Robert Kennedy, Bundy, McCone and others on Cuban operations: the CIA''s sabotage to proceed that weekend; ninety days of patrols to catch Castro shipping
        arms. Afternoon, Bundy to Attwood, orally at the President''s instruction: Vallejo to come to the United States first; the "flatly unacceptable" points, submission to external Communist influence
        and subversion in the hemisphere.'
      n: '[FRUS 1961–63, XI, doc. 376](https://history.state.gov/historicaldocuments/frus1961-63v11/d376) (the morning); [FRUS 1961–63, XI, doc. 377](https://history.state.gov/historicaldocuments/frus1961-63v11/d377)
        (Bundy''s record). [[w.schlesinger-robert-kennedy-and-his]], 553–54. See [[cal.1963-09-18.cuba]]. Names: Kennedy, Rusk, McNamara, Robert Kennedy, Bundy, McCone, Attwood, Castro.'
      tags:
