      thread: desegregation-schools
      also:
      - robert-kennedy
      c: 'The President to Robert Kennedy: some way must be found to teach the Negro children of Prince Edward County, Va., its public schools closed since 1959, until the courts reopen them. Kennedy calls
        in William vanden Heuvel, who plans the Prince Edward Free School Association: private money, the county''s schools leased.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 345. To check: vanden Heuvel, interview by Jean Stein, Nov. 10, 1968, 1–5, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 345 n.8).
        The schools opened: [[cal.1963-09-16.desegregation-schools]]. Names: Kennedy, Robert Kennedy, vanden Heuvel. Check: the day; the year of vanden Heuvel''s interview.'
