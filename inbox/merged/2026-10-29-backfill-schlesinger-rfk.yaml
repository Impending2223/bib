      when: Nov. 28
      date: '1964-11-28'
      thread: king
      also: []
      c: 'Katzenbach and Burke Marshall fly to the LBJ Ranch: a Washington bureau chief had told Katzenbach Nov. 25 that the FBI offered one of his reporters tapes on King. Katzenbach, by his testimony
        of 1975: it should be stopped at once, the President should call Hoover; Johnson seemed to take it very seriously.'
      n: '[S. Rep. No. 94-755, Book III, 152 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=166) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]],
        364. To check: Church committee, Hearings, vol. 6, 210 (cited by [[w.schlesinger-robert-kennedy-and-his]], 364 n.100); Sidey, "L.B.J., Hoover and Domestic Spying," *Time*, Feb. 10, 1975 (cited by
        [[w.schlesinger-robert-kennedy-and-his]], 364 n.101). Made public: S. Rep. No. 94-755, Book III (1976). See [[cal.1964-11-18.civil-rights-the-executive]]. Names: Katzenbach, Burke Marshall, Johnson,
        Hoover, Martin Luther King.'
