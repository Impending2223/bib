      c: 'A month after the invasion Castro offers the prisoners for an "indemnity" of five hundred bulldozers. The President asks Mrs. Roosevelt, Walter Reuther, Milton Eisenhower and George Romney to
        head a committee to raise the money; Romney declines. Most Republican leaders against: Goldwater, "surrender to blackmail"; Nixon, "Human lives are not something to be bartered."'
