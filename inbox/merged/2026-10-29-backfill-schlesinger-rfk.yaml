      c: 'Mansfield to the President, "The Cuban Aftermath": the clamor for further action largely Republican. "If we yield to the temptation to give vent to our anger at our own failure, we will, ironically,
        strengthen Castro''s position." Gradual disengagement from the anti-Castro groups; an end to violent verbal attacks on Castro; the Alliance for Progress pushed hard and fast.'
