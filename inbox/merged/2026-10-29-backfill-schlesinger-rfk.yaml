      when: Dec. 17
      date: '1962-12-17'
      thread: latin-america
      also:
      - robert-kennedy
      c: 'Brasília, 11:15 a.m. to 2:30 p.m. Robert Kennedy, with Ambassador Gordon, to Goulart for the President: the gravest doubts, the government and the unions "systematically and resolutely anti-American";
        business to be treated fairly. Goulart: the popular classes against the old elites; the hostility will pass after the plebiscite. Kennedy''s note to Gordon: "We seem to be getting no place." Gordon
        names agencies with left-wing penetration; Goulart: in any showdown Brazil with the United States.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 581–82. To check: American embassy, Brazil, memorandum of conversation, Robert Kennedy, Goulart and Gordon, Dec. 17, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]],
        582 n.90). Check: Campos thought the results "negligible, if not negative"; Gordon, Kennedy too casual (582). See [[cal.1962-04-03.latin-america]]. Names: Robert Kennedy, Gordon, Goulart, Kennedy.'
      tags:
