        - 'via w.schlesinger-robert-kennedy-and-his 550 n.72: all'
    section: '196312'
- add:
    entry:
      id: cal.1963-09-19.cuba
      when: Sept. 19
      date: '1963-09-19'
      thread: cuba
      also:
      - robert-kennedy
      c: 'Harriman to Attwood: "adventuresome" enough to favor the approach, but, for its politics, Attwood to see Robert Kennedy. Robert Kennedy sends him to Bundy, the effort "worth pursuing"; by Bundy''s
        report to Attwood, the President for "pushing towards an opening toward Cuba."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 552. [S. Rep. No. 94-465, 173 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=184) (Robert Kennedy''s
        word, by Attwood''s testimony). To check: [[w.attwood-reds-and-the-blacks]], 142 (cited by [[w.schlesinger-robert-kennedy-and-his]], 552 n.77). Check: the days after Harriman''s. See [[cal.1963-09-18.cuba]].
        Names: Harriman, Attwood, Robert Kennedy, Bundy, Kennedy.'
      tags:
      - name:harriman-w-averell
      - name:attwood-william
      - name:kennedy-robert-f
      - name:bundy-mcgeorge
      - name:kennedy-john-f
