      c: '483d NSC meeting, on Cuba. No Navy blockade; an Air Force plan of heavy bombardment, which the other services opposed, rejected. Overflights every two or three days. The exiles to be refugees
        (Robert Kennedy). The Trading with the Enemy Act to be invoked at an overt act, $30 million in food and drugs exempted. By Schlesinger''s journal, McNamara: Defense against enlisting a Cuban Freedom
        Brigade in the Army.'
      n: '[FRUS 1961–63, X, doc. 204](https://history.state.gov/historicaldocuments/frus1961-63v10/d204) (Burris''s notes). [[w.schlesinger-robert-kennedy-and-his]], 472–73 (the Freedom Brigade). To check:
        Schlesinger, journal, May 4–5, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 473 n.17). See [[cal.1961-04-15.cuba]]. Names: Robert Kennedy, Schlesinger, McNamara.'
