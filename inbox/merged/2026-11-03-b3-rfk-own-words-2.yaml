- add:
    entry:
      id: cal.1962-09-20.elections-1962
      when: Sept. 20
      date: '1962-09-20'
      thread: elections-1962
      c: 'Harrisburg, the Democratic State Finance Committee''s dinner. Kennedy opens the 1962 campaign, 47 days before the
        election: "a Democratic House and a Democratic Senate"; the voters to choose "whether this Nation sails or anchors."
        If the Democrats are charged with "daring to try something new, I plead ''guilty.''"'
      n: 'Remarks in Harrisburg at a Democratic State Finance Committee Dinner, [1962 Pub. Papers 695](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=755)
        (Sept. 20, 1962). [[w.robert-kennedy-in-his]], 342 (the opening of his campaign; he liked campaigning). Names: Kennedy,
        Clark, Dilworth. Check: Martin gives Sept. 22 (342).'
      tags:
      - name:kennedy-john-f
      - name:clark-joseph-s
      - name:dilworth-richardson
      - state:pa
      src:
        c: e0c954e9
        rows:
