- add:
    entry:
      id: cal.1961-08-28.latin-america
      when: Aug. 28
      date: '1961-08-28'
      thread: latin-america
      also:
      - robert-kennedy
      c: 'The White House: a meeting to set Dominican policy, Murphy present. Earlier in the day Robert Kennedy sees two Dominicans
        Stephen Smith brings him, Luis Manuel Baquero of the National Civic Union and Johnny Vicini of the sugar interest.
        The outcome: to get along with Balaguer, Ramfis Trujillo to keep his uncles out and withdraw, an election to follow.
        The next day Smith asks John Bartlow Martin to go; his fact-finding mission through September.'
      n: '[[w.robert-kennedy-in-his]], 322–23 (Martin''s account, put to Robert Kennedy; Kennedy on the outcome). See [[cal.1961-11-19.latin-america]].
        Names: Robert Kennedy, Murphy, Stephen Smith, Balaguer, Martin. Check: the meeting''s record.'
      tags:
      - name:kennedy-robert-f
      - name:murphy-robert-d
      - name:smith-stephen-e
      - name:balaguer-joaquin-videla
      - name:martin-john-bartlow
      src:
        c: 5743b2dd
        rows:
        - 'w.robert-kennedy-in-his 322–23: all'
        - 'via x.1964-03-01.rfk-oral-history-martin-sessions: all'
