      c: 'A Monday. Salinger talks to Robert Kennedy and Mrs. Kennedy of running for the Senate in California, thinking he
        has three weeks to decide. Robert Kennedy: first find out what the papers will do, what support and money he can get.
        By Robert Kennedy''s account.'
      n: '[[w.robert-kennedy-in-his]], 413. See [[cal.1964-03-19.transition-and-staff]]. Names: Salinger, Robert Kennedy,
        Jacqueline Kennedy. Check: the day, "a Monday before" his resignation.'
