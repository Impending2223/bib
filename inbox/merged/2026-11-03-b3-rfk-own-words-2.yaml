      c: 'Glen Ora. Kennedy telephones Robert Kennedy, at Williamsburg, Va., to speak to the Scripps-Howard papers: he is
        going ahead; any reservations? Robert Kennedy: go on. By Robert Kennedy''s account.'
      n: '[[w.robert-kennedy-in-his]], 242. See [[cal.1961-04-12.cuba-5]]. Names: Kennedy, Robert Kennedy. Check: the day;
        Robert Kennedy: "Saturday night, maybe Sunday night."'
