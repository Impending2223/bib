- add:
    entry:
      id: cal.1964-10.elections-1964-4
      when: Oct.
      date: 1964-10
      thread: elections-1964
      also:
      - robert-kennedy
      c: 'In the Jenkins case, by Robert Kennedy''s account. Johnson with him: FBI material on certain Republican senators
        and congressmen to bring out, and Goldwater to be tied to Jenkins; a statement aimed at Goldwater, shown him in the
        car. Johnson had sat up the night before reading the FBI''s files. Kennedy''s advice: answer with foreign policy,
        a meeting of the National Security Council, television on the Chinese explosion.'
      n: '[[w.robert-kennedy-in-his]], 130–31. See [[cal.1964-10-14.elections-1964]]. Names: Johnson, Robert Kennedy, Goldwater,
        Jenkins. Check: the day and the place; after the Chinese test of Oct. 16, Kennedy''s "up here."'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:goldwater-barry-m
      - name:jenkins-walter-w
      src:
        c: cffdb452
        rows:
        - 'w.robert-kennedy-in-his 130–31: all'
        - 'via x.1964-12-04.rfk-oral-history-lewis-sessions: all'
- add:
    entry:
      id: cal.1963-09.robert-kennedy
      when: Sept.
      date: 1963-09
      thread: robert-kennedy
      also:
      - elections-1964
      c: 'Robert Kennedy and the President on his leaving the Attorney Generalship, a burden in the 1964 election, the South
        speaking of "the Kennedy brothers." The President: impossible while the civil rights bill is pending; it would look
        like running away. The one way out, to manage the campaign. By Robert Kennedy''s account.'
      n: '[[w.robert-kennedy-in-his]], 75. Names: Robert Kennedy, Kennedy. Check: the month; Robert Kennedy: "September or
        October of 1963."'
      tags:
      - name:kennedy-robert-f
      - name:kennedy-john-f
      src:
        c: 2712c805
        rows:
        - 'w.robert-kennedy-in-his 75: all'
        - 'via x.1964-12-04.rfk-oral-history-lewis-sessions: all'
