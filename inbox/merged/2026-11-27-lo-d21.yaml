      c: Muncie. Boarding the plane for Indianapolis, Robert Kennedy hears from Salinger that King has been shot. By Schlesinger's account.
      n: '[[w.schlesinger-robert-kennedy-and-his]], 874 (as they boarded the plane for Indianapolis Salinger telephoned that King had been shot). [[w.witcover-85-days]], 139 (as the chartered plane was
        leaving Muncie in early evening a reporter who had just called his office told him; not Salinger''s call). The hour: "early evening" (Witcover, 139), after the shooting at 7:01 p.m. Eastern. To
        check: John J. Lindsay, oral history interview by Jean Stein, Sept. 6, 1968, 10, Stein Papers; Walter Sheridan to Schlesinger, Oct. 17, 1977 (cited by [[w.schlesinger-robert-kennedy-and-his]], 874
        n.79). See [[cal.1968-04-04.elections-1968]]. The order: after [[cal.1968-04-04.elections-1968]], Schlesinger, 874 ("A few moments later, as they boarded the plane"); after [[cal.1968-04-04.king]],
        the shooting. Names: Robert Kennedy, Salinger, King.'
      tags:
      - name:kennedy-robert-f
      - name:salinger-pierre
      - name:king-martin-luther-jr
      - state:in
      - city:muncie
      time_range:
