      c: Humphrey, at the head table, is handed a note that King has been shot; the dinner goes on; a second note that he is dead, he writes a brief eulogy, delivers it, and announces the dinner over. By
        Humphrey's account.
      n: '[[w.humphrey-education-of-a-public-1976]], 361–62; [[w.solberg-hubert-humphrey]], 326 (told of the shooting at a fund-raising dinner that evening); [[w.califano-triumph-and-tragedy-of]], 274 (Johnson,
        in the Oval Office, has Califano call the Vice President and the congressional leaders to say a prayer for King and close the dinner down; not Humphrey''s notes or eulogy). See [[cal.1968-04-04.democratic-party]].
        The order: after [[cal.1968-04-04.democratic-party]], the dinner already in progress ([[w.johnson-white-house-diary]], 648); after [[cal.1968-04-04.king]], Humphrey, 361–62 (the notes of the shooting
        and the death). Names: Humphrey, Martin Luther King.'
      tags:
      - name:humphrey-hubert-h
      - name:king-martin-luther-jr
      time_range:
      - 1968-04-05T00:00Z
      - 1968-04-05T03:00Z
