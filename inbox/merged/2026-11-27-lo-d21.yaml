      time_zone: America/New_York
      range_basis: record
- add:
    entry:
      id: cal.1968-04-04.king-memphis-3
      when: Apr. 4
      date: '1968-04-04'
      place: memphis
      thread: king-memphis
      follows:
      - cal.1968-04-04.king-memphis-2
      time_zone: America/Chicago
      c: 'Memphis, the Lorraine Motel, Room 201, after Young''s return from court about 5 p.m. Eskridge, in from a lawyers'' conference with Judge Brown, to King: the judge will let SCLC lead the march
        on Monday, its route prescribed, no weapons, narrow ranks.'
      n: '[[w.branch-at-canaans-edge]], 764 ("About five o''clock," Young back from court to the bull session in Room 201; Eskridge walked in from the lawyers'' conference with Judge Brown as the motel
        television turned to the network news; Officer Richmond logs King''s walk upstairs at 5:40). [[w.young-easy-burden]], 463–64 (Young back at the Lorraine "almost five," telling King what passed in
        court; not Eskridge). The hour: after Young''s return "About five o''clock" and before King''s walk upstairs at 5:40 (Branch, 764). See [[cal.1968-04-04.king-memphis]]. The order: after [[cal.1968-04-04.king-memphis-2]],
        [[w.branch-at-canaans-edge]], 761, 764 (King''s afternoon in Room 201, "hearing nothing all day from Andrew Young"; Young''s return about five). Names: Young, Martin Luther King.'
      tags:
      - name:young-andrew-j-jr
      - name:king-martin-luther-jr
      - state:tn
      - city:memphis
      time_range:
      - 1968-04-04T23:00Z
      - 1968-04-04T23:40Z
      range_basis: record
- add:
    entry:
      id: cal.1968-04-04.elections-1968-5
      when: Apr. 4, evening
      date: '1968-04-04'
      place: muncie
      thread: elections-1968
      also:
      - robert-kennedy-campaign
      follows:
