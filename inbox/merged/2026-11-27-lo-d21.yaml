        day.'
- check:
    id: cal.1968-03-16.robert-kennedy-2
    text: 'Check: the part of the day: Palermo, 151, has the staffs meet the morning of the announcement; Witcover, 86, 91–92 (read), has the meeting in Edward Kennedy''s Senate office held "while the candidate
      was en route to New York," after the announcement at 10 a.m., and "stretched through the afternoon," with the call from Newsweek to Mankiewicz taken during the afternoon session (92).'
- edit:
    id: cal.1968-03-19.elections-1968-3
    base: 915eb244
    kind: correct
    set:
      c: 'O''Brien to Johnson, from Washington, against Rowe''s draft telegram to the party''s leaders ("There are those who seek to divide us"): "bound to be construed as a nationwide effort for loyalty
        oaths ... a clear sign of panic. ... we should let the dividers slug it out among themselves."{1} McPherson the same day: "Half-way support for you is to be preferred to total support for Bobby."{2}'
      n: '[[w.shesol-mutual-contempt]], 428; [[w.obrien-no-final-victories]], 222–23 (the proposed telegram, the loyalty-oath point, "an extension of the ''overkill'' tactics used in New Hampshire," "let
        the ''dividers'' slug it out among themselves"; the memorandum sent after Rowe''s call; not McPherson). The place: O''Brien, 222–23, back in Washington late Sunday night, writes the memorandum "as
        it was outlined to me this morning following my return from four days on the road"; Shesol, 428, has him canvassing in Massachusetts the days before. Check: the day: Shesol, 428, dates the memorandum
        Mar. 19; O''Brien, 222–23, has Rowe''s call and the memorandum the morning after his return, Monday, Mar. 18. To check: O''Brien to Johnson, Mar. 19, 1968, Watson Files, box 28; McPherson to Johnson,
        Mar. 19, 1968, McPherson Files, box 53, LBJ Library (cited by [[w.shesol-mutual-contempt]], 428). Names: O''Brien, Johnson, Rowe, McPherson, Robert Kennedy.'
      place: washington
- check:
    id: cal.1968-03-22.china-leadership
    text: 'Check: the day: the order is dated Mar. 22 in the Mao nianpu (VI, Mar. 22, read) and the other chronologies, and Mao''s chronology adds that Lin Biao announced the three men''s "errors" on the
      24th; Yang Jisheng, I, 442 (read), from Wu Faxian''s memoir, has the meeting at Mao''s that decided Yang''s removal at 1 a.m. on Mar. 23, and I, 445 has Zhou telephone Huang Yongsheng "late at night"
      on the 22nd and Lin Biao and Zhou tell Yang Chengwu of his removal at about 10 a.m. on the 23rd (Teiwes, 101, has Yang and Yu arrested on the 22nd).'
