patch: b3-novak-agony-2
by: 'Claude (batch 3 resumed, b3-1964: Robert D. Novak, The Agony of the G.O.P. 1964, the cites held up in part)'
ops:
- cite:
    id: cal.1962-01.republican-party
    item: '[[w.novak-agony-of-the-g]], 52, 55 (January 1962, the Skirvin Hotel; the Bliss committee''s report, 102 pages;
      Bliss: the committee "established only to examine and report on the mechanics and techniques of campaigning in the cities")'
    units: A-B
- src:
    id: cal.1962-01.republican-party
    rows:
    - 'via w.novak-agony-of-the-g 55 n.text: B'
- cite:
    id: cal.1962-02.elections-1964
    item: '[[w.novak-agony-of-the-g]], 66 (the night of Feb. 2, 1962; dinners in seventeen cities, some three hundred thousand
      tickets; Rockefeller from Des Moines)'
    units: A
- check:
    id: cal.1962-02.elections-1964
    text: 'Check: Novak, 66, gives Feb. 2, 1962.'
- cite:
    id: cal.1963-09-07.republican-party
    item: '[[w.novak-agony-of-the-g]], 220–21 (a week before Rockefeller''s *Meet the Press* of Sept. 14; the Ogle County
      Fairgrounds; no serious candidate for governor there; Daly the only one)'
    units: 'A, F'
- cite:
    id: cal.1963-07-14.elections-1964
    item: '[[w.novak-agony-of-the-g]], 202 (July 14, 1963; the Young Republicans'' convention two weeks before)'
    units: A
- cite:
    id: cal.1964-07-09.elections-1964
    item: '[[w.novak-agony-of-the-g]], 448 (Thursday, July 9, at Columbus; Bliss, the State chairman, not told beforehand)'
    units: A
- check:
    id: cal.1964-07-09.elections-1964
    text: 'Check: Novak, 448, has 42 of Ohio''s 58 go to Goldwater at once.'
- add:
    entry:
      id: cal.1962-10.goldwater-5
      when: Oct.
      date: 1962-10
      thread: goldwater
      c: 'Chicago, the Avenue Motel. White and a few of the draft''s inner circle, in secret, kept even out of White''s confidential
        memoranda: Goldwater unresponsive. To bids that he run, Goldwater: "That''s all right for you, but what about me?
        It''s my neck that would go on the chopping block—not yours."'
      n: '[[w.novak-agony-of-the-g]], 126. See [[cal.1962-10-18.goldwater]]. Names: White, Goldwater. Check: the day.'
      tags:
