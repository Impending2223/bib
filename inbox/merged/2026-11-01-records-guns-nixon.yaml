- edit:
    id: cal.1968-08-07.elections-1968
    base: bd8532de
    set:
      c: 'Miami Beach. Thurmond and the Southern delegations hold for Nixon (Check). Nixon nominated on the first ballot, early Aug. 8: 692 votes, 667 needed; Rockefeller 277, Reagan 182, Rhodes 55, Romney 50. After the roll, the delegations change: Nixon 1,238, Rockefeller 93, Reagan 2. New York''s and Kentucky''s motions to make it unanimous not recognized. The rules suspended by voice vote, on California''s motion, for Reagan to speak; he moves that the convention "declare itself as unanimously and united behind the candidate Richard Nixon." The chair thanks him. No vote put.'
      n: '[*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), the fourth session, Aug. 7, the roll call [368–379](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/368/mode/1up), the changes and the final tabulation [379–389](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/379/mode/1up), the motions [381–389](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/381/mode/1up) (Rule 17, the chair to put "Shall the nomination of the candidate be made unanimous?", read, 381; New York, 382, and the table''s note, "not recognized under the rules of the Convention," 389; Kentucky, "not recognized for that purpose," 383; California''s motion, seconded by Maine and Virginia, put as "to suspend the rules ... for the Convention
        to cast a unanimous vote for Richard M. Nixon," the ayes having it, "under the motion, the Governor of California will be recognized," 386–87; Reagan''s motion and the chair''s thanks, 387; the table''s note, "Governor Reagan moved that the nomination of Richard M. Nixon be made unanimous," no outcome given, 389). [[w.nixon-rn]], 309–11 (Thurmond and Tower holding the South; the first ballot, 692, 25 more than needed; Reagan''s motion); [[w.cq-weekly-report]], Aug. 9, 1968, 2096, 2098, 2141 (the first ballot and the changes; no vote on Reagan''s motion, 2096). Check: CQ: Reagan''s motion to make it unanimous "never put to a vote," and Nixon "apparently never was declared the unanimous choice" (2096); New York''s and Kentucky''s motions ruled out of order (2141); after the changes Nixon 1,238, Rockefeller 93, Reagan 2 (2096). To check: [[w.witcover-resurrection-of-richard-nixon]]; [[w.perlstein-nixonland-2008]]; [[w.nelson-resilient-america]]. See [[cal.1968-08-05.elections-1968]].
        Names: Thurmond, Nixon, Rockefeller, Reagan, Rhodes, Romney.'
      src:
        c: f228d54e
        rows:
