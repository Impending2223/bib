patch: 2026-11-12-b9-group-4
by: 'Claude (batch 9, group 4: Six Crises, Two Suns, We Band of Brothers, Suite 3505, The Republican Establishment, Poole), the "already in" rows read by the card, Nov. 12, 2026; audited blind, every row and op, Nov. 12, 2026'
# Audit (Nov. 12, 2026): the variant "by acclamation" dropped (the page leaves out the roll call; the acclamation followed it: no disagreement with 1,321 to 10); the cite of Six Crises, 371, on the Nov. 6 proposal dropped (the page tells the telecast, not the proposal: no unit borne out); Six Crises, 384-85, bears the conference on a statement (count-3, A-C); White, 366, puts "Did you see him on television?" later, to a reporter (F unmapped, a Check); the Poole JCSM-number Check dropped (no unit names a memorandum: in the parenthetical); cal.1962-05-08.laos not used (May 8-11 is the file title of the whole visit to Southeast Asia, Vietnam's May 9-11 already in; Poole dates neither the Mekong flight nor the talk with Sarit: two entries, the month); forward links pointed back; added: Brown's prediction, Scott's statement, cites of Poole on July 19, 24, 25 and Aug. 10, 1961 and May 11, 1962.
ops:
- cite:
    id: cal.1960-07-26.elections-1960
    item: '[[w.nixon-six-crises]], 316 (Eisenhower arrives in Chicago Tuesday and delivers "one of the most effective political speeches he had ever made"; the weekday only)'
    units: 'A'
- cite:
    id: cal.1960-07-26.elections-1960
    item: '[[w.nixon-six-crises]], 316–18 (Hatfield, Wednesday, places Nixon''s name in nomination, Nixon chosen "by acclamation"; Goldwater "spoke with great effect, calling on his supporters to join him in working enthusiastically for the Convention''s nominee"; not the withdrawal, the words, Fannin or the roll call)'
    units: '?'
- cite:
    id: cal.1960-11-08.elections-1960-count-2
    item: '[[w.nixon-six-crises]], 381–82 (at 8:30 Pacific, 11:30 Eastern: Finch calls Dewey and New York is lost; Scott, called, had counted on a 200,000 lead at the Philadelphia line, which Kennedy''s Philadelphia margin of over 300,000 wiped out; Texas "appeared" Kennedy''s by about 40,000)'
    units: 'B, C'
- cite:
    id: cal.1960-11-08.elections-1960-count-3
    item: '[[w.nixon-six-crises]], 384–85 (the Ambassador, shortly after eleven Pacific: Hall and Folger, then Finch, Seaton and Klein, on making a statement; Seaton against an outright concession, on calls from Worthy and Rainville; Klein reporting the press for one; Dreiske''s call: it "just wasn''t in the cards" to take Illinois; not Morton or Dirksen)'
    units: 'A-C'
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-4
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      also: [elections-1960-nixon]
      c: 'Los Angeles, 6:45 p.m. Pacific, before the polls close in the West, the networks'' computers all for Kennedy. Hall, interviewed: "I think we should put all of those electronic computers in the junk pile so far as election returns are concerned. This one is going down to the wire—a squeaker, a real close election."'
      n: '[[w.nixon-six-crises]], 380 (by Nixon''s account; Sevareid on CBS just before: "All of the computing machines are now saying Kennedy"). Check: the words as broadcast. See [[cal.1960-11-08.elections-1960]]. Names: Hall.'
      tags: [name:hall-leonard-w, city:los-angeles]
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-5
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      also: [democratic-party]
      c: 'Stevenson, 9:30 p.m. Pacific: "I am elated at the prospect of a sweeping victory for Jack Kennedy."'
      n: '[[w.nixon-six-crises]], 383 (by Nixon''s account; among the "victory statements" recorded between nine and ten). Check: the place and the medium; the hour is Pacific by the page''s run of times. See [[cal.1960-11-08.elections-1960-count-4]]. Names: Stevenson, Kennedy.'
      tags: [name:stevenson-adlai-e, name:kennedy-john-f]
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-6
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      also: [goldwater]
      c: 'Goldwater, interviewed on CBS by Cronkite, about 9:35 p.m. Pacific. Cronkite: "Well, that''s it. Goldwater wrote off Nixon''s chances to win in this presidential race."'
      n: '[[w.nixon-six-crises]], 383 (by Nixon''s account, quoting the broadcast: "Five minutes later" than Stevenson''s 9:30; not Goldwater''s own words). Check: Goldwater''s words; the place. See [[cal.1960-11-08.elections-1960-count-5]]. Names: Goldwater, Cronkite, Nixon.'
      tags: [name:goldwater-barry-m, name:cronkite-walter, name:nixon-richard-m]
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-7
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      also: [elections-1960-nixon]
      c: 'Los Angeles, the Ambassador, about 11:30 p.m. Pacific. Nixon to his wife, by his account: "I don''t intend to make an outright concession, but the least I can do is to indicate that, if the present trend continues, Kennedy will be elected." Pat Nixon, "adamant against my making any kind of a concession statement—even a conditional one": "I simply cannot bring myself to stand there with you while you concede the election to Kennedy." Nixon does not press the point.'
      n: '[[w.nixon-six-crises]], 386 (by Nixon''s account). See [[cal.1960-11-08.elections-1960-count-3]]. Names: Nixon, Pat Nixon, Kennedy.'
      tags: [name:nixon-richard-m, name:nixon-pat, name:kennedy-john-f, city:los-angeles]
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-8
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      also: [democratic-party]
      c: 'Governor Brown, by CBS, about 9 p.m. Pacific, 15 percent of California counted: "Kennedy will carry California by 800,000 votes." Two hours later, a million.'
      n: '[[w.nixon-six-crises]], 383 (by Nixon''s account). Check: the words and the hours as broadcast. See [[cal.1960-11-08.elections-1960-count-4]]. Names: Brown, Kennedy.'
      tags: [name:brown-edmund-g, name:kennedy-john-f, state:ca]
- add:
    entry:
      id: cal.1963-12.robert-kennedy-5
      when: Dec., early
      date: '1963-12'
      thread: robert-kennedy
      also: [elections-1964]
      c: 'Robert Kennedy at lunch with Rowland Evans, by Evans''s recollection: "I don''t know whether I''ll stay, or whether I want to go on the ticket in ''64, or anything, until I know whether I think Johnson can be president of the United States and follow through with the Kennedy program." It is "too early for me to even think about ''64, because I don''t know whether I want to have any part of these people."'
      n: '[[w.young-two-suns-of-the]], 48 (Evans''s recollection of an early December 1963 lunch; no day). To check: Rowland Evans Jr., recorded interview by Roberta W. Greene, July 30, 1970, pp. 15–16, Robert F. Kennedy Oral History Program, John F. Kennedy Library (cited by [[w.young-two-suns-of-the]], 48). Check: the day. Names: Robert Kennedy, Evans, Johnson.'
      tags: [name:kennedy-robert-f, name:evans-rowland-jr, name:johnson-lyndon-b]
- add:
    entry:
      id: cal.1963-11-25.succession-3
      when: Nov. 25
      date: '1963-11-25'
      thread: succession
      c: 'Schlesinger, in his journal, on Johnson: "My guess is that [Johnson] will be pretty good on issues, and that in some respects he will be more liberal than JFK."'
      n: '[[w.young-two-suns-of-the]], 48 (the journal for Nov. 25, 1963, quoted). To check: [[w.schlesinger-journals]], 207–08 (cited by [[w.young-two-suns-of-the]], 48). See [[cal.1963-11-22.succession]]. Names: Schlesinger, Johnson.'
      tags: [name:schlesinger-arthur-m-jr, name:johnson-lyndon-b]
- cite:
    id: cal.1964-06-07.elections-1964-3
    item: '[[w.white-suite-3505]], 366 (Rockefeller''s press conference at the Sheraton after Scranton "escaped from the television cameras"; asked whether he would support Scranton; "Did you see him on television?" later, to a reporter who cornered him; Rockefeller''s "More Romneys" is given at "a press conference," not said to be this one)'
    units: 'A-C'
- check:
    id: cal.1964-06-07.elections-1964-3
    text: 'Check: White, *Suite 3505*, 366, has "Did you see him on television?" said later, to a reporter who cornered Rockefeller, not at the press conference.'
- variant:
    id: cal.1964-06-07.elections-1964-3
    unit: D
    witness: w.white-suite-3505
    reads: 'Governor Scranton said that he was waiting to see where Senator Goldwater stood. And after listening to his press conference, I think I''ve got to wait and see where he stands.'
    at: '366'
- add:
    entry:
      id: cal.1964-06-07.elections-1964-scranton
      when: June 7
      date: '1964-06-07'
      thread: elections-1964-scranton
      c: 'Cleveland. Romney, watching Scranton on *Face the Nation*: "Where are his principles?"'
      n: '[[w.white-suite-3505]], 366 (by White''s account; Romney "started taking pot shots at Scranton" as the Liberal-moderate "cabal" at the Governors'' Conference divided). Check: the hour and the place of the viewing. See [[cal.1964-06-07.elections-1964]]. Names: Romney, Scranton.'
      tags: [name:romney-george-w, name:scranton-william-w, city:cleveland]
- cite:
    id: cal.1966-08-02.governors-id
    item: '[[w.hess-republican-establishment]], 2 (Smylie, defeated for renomination to a fourth term by "a Goldwater conservative, Don Samuelson, who was elected in November"; not the votes or the Democratic primary)'
    units: '?'
- check:
    id: cal.1966-08-02.governors-id
    text: 'Check: Hess and Broder, 2, have Smylie defeated for renomination "in July, 1966"; the primary was Aug. 2.'
- cite:
    id: cal.1966-11-08.elections-1966
    item: '[[w.hess-republican-establishment]], 2–4 (the Republican governors from 17 to 25, met at Colorado Springs; Agnew, Governor-elect of Maryland; Baker "the first of his party to be elected by popular vote to the U.S. Senate from Tennessee")'
    units: 'E, G, K'
- cite:
    id: cal.1966-11-08.elections-1966
    item: '[[w.hess-republican-establishment]], 2, 4–5 (140 House Republicans after 1964 and forty-seven seats added in 1966; the "Republican-Negro-Protestant candidate" elected to the Senate in Massachusetts; Reagan "returning the California state capitol to the G.O.P."; Rockefeller winning a third term in New York; Romney''s Detroit deficit cut from 207,834 to 68,382; Florida''s governorship won for the first time since Reconstruction; no totals, votes or margins)'
    units: '?'
- cite:
    id: cal.1966-11-08.governors
    item: '[[w.hess-republican-establishment]], 2, 5 (of the fifteen Republican governorships at stake the party held all but two, Maine and Kansas, and took ten from the Democrats; Rockefeller winning a third term; the Republicans holding "half of the statehouses")'
    units: 'B, D, J'
- cite:
    id: cal.1966-11-08.governors
    item: '[[w.hess-republican-establishment]], 3–5 (Agnew, Governor-elect of Maryland; Florida''s first Republican governorship since Reconstruction; Reagan returning the California capitol to the party; Republican governors up from 17 to 25; not Brown, Mahoney, Arkansas, Alabama or Georgia)'
    units: '?'
- cite:
    id: cal.1966-11-08.legislatures-us
    item: '[[w.hess-republican-establishment]], 2, 4 (after 1964 Republicans controlled "only 7 of the 50 legislatures"; in 1966 they "nearly tripled the number" and captured the legislatures of Arizona and Alaska for the first time since statehood; no seat counts, no chamber by chamber)'
    units: '?'
- check:
    id: cal.1966-11-08.legislatures-us
    text: 'Check: Hess and Broder, 2, have the Republicans in control of "only 7 of the 50 legislatures" after 1964; the entry has 6 before the election.'
- cite:
    id: cal.1964-06-07.states-and-cities-us
    item: '[[w.hess-republican-establishment]], 31–32 (the Governors'' Conference at Cleveland, 1964: "an attempted power play by the Governors to block the nomination of Goldwater" collapses "in a tragicomedy of conflicting ambitions, inept communication and bad politics"; no day, no speakers)'
    units: 'A'
- cite:
    id: cal.1960-03-17.cuba
    item: '[[w.poole-joint-chiefs-of-staff]], 108 (Mar. 17, 1960: Eisenhower approves a CIA "paramilitary" plan patterned on the Guatemala effort of 1954: exiles infiltrate Cuba, arms are airdropped, guerrilla bands grow; Guatemala''s president agrees that the exiles may train in his country; not the title, the 5412 Committee, the radio, the network or those present)'
    units: '?'
- cite:
    id: cal.1961-07-12.berlin-and-vienna
    item: '[[w.poole-joint-chiefs-of-staff]], 145–46 & n.28 (the JCS proposals to McNamara of July 12: the division-size probe, the corps-size thrust, a program built around a 559,000-man expansion; NATO''s "main reliance" on nuclear weapons; partial mobilization "would not generate enough conventional forces" for non-nuclear combat "on a broad scale"; the Joint Chiefs, not Lemnitzer alone; Poole cites JCSM-461-61, Kaplan JCSM-476-61, perhaps another paper of the day; not the Army''s half or the Soviet timetable)'
    units: '?'
- add:
    entry:
      id: cal.1961-07-14.berlin-and-vienna-4
      when: July 14
      date: '1961-07-14'
      thread: berlin-and-vienna
      c: 'Kennedy asks for an interagency evaluation of two requests to Congress: $1 to $1.5 billion at once, without controls or taxes; $4 to $5 billion in two or three weeks, with controls, taxes and a declaration of national emergency.'
      n: '[[w.poole-joint-chiefs-of-staff]], 146 & n.29. To check: FRUS 1961–1963, XIV, *Berlin Crisis, 1961–1962*, 197–98 (cited by [[w.poole-joint-chiefs-of-staff]], 146 n.29). See [[cal.1961-07-14.berlin-and-vienna-3]]. Names: Kennedy.'
      tags: [name:kennedy-john-f]
- add:
    entry:
      id: cal.1961-07-18.berlin-and-vienna-2
      when: July 18
      date: '1961-07-18'
      thread: berlin-and-vienna
      also: [defense]
      c: 'The Joint Chiefs to McNamara on the $4 to $5 billion proposal, repeating their memorandum of July 12. The issues "in their simplest form": a decision to stay in Berlin "at all costs and risks"; a willingness to accept general war, made clear to the Soviets; prompt measures to deter Soviet trouble-making; partial mobilization to raise credibility and the capability for conventional and nuclear conflict.'
      n: '[[w.poole-joint-chiefs-of-staff]], 146 & n.29 ("Their answer, dated 18 July"). To check: JCSM-486-61, JCS to McNamara, July 18, 1961, JCS 1907/329, JMF 9172 Berlin/3100 (14 Jul 61) sec. 2 (cited by [[w.poole-joint-chiefs-of-staff]], 146 n.29). See [[cal.1961-07-14.berlin-and-vienna-4]]. Names: McNamara.'
      tags: [name:mcnamara-robert-s]
- add:
    entry:
      id: cal.1961-07-18.berlin-and-vienna-3
      when: July 18
      date: '1961-07-18'
      thread: berlin-and-vienna
      also: [defense]
      c: 'Kennedy confers with the Joint Chiefs. He says, and they agree, that a declaration of national emergency can be postponed. Could NATO''s air forces follow a ground probe with non-nuclear air action? LeMay: yes, if NATO members acted together and took the initiative. Could added US divisions be used if the allies add none? Lemnitzer: no, but more US forces with added allied strength would widen the non-nuclear options.'
      n: '[[w.poole-joint-chiefs-of-staff]], 147 & n.31. To check: FRUS 1961–1963, XIV, *Berlin Crisis, 1961–1962*, 216–17 (cited by [[w.poole-joint-chiefs-of-staff]], 147 n.31). See [[cal.1961-07-18.berlin-and-vienna-2]]. Names: Kennedy, LeMay, Lemnitzer.'
      tags: [name:kennedy-john-f, name:lemay-curtis-e, name:lemnitzer-lyman-l]
- add:
    entry:
      id: cal.1962-05.laos-2
      when: May
      date: '1962-05'
      thread: laos
      c: 'McNamara and Lemnitzer, at the NATO meeting in Athens, sent by Kennedy to learn whether the Mekong would stop the Communists and whether Thai forces could block a crossing. Non-stop to Bangkok; along the river at 100 to 200 feet: the dry season, people wading across. Thai posts near the river, as disposed, unable to block a crossing.'
      n: '[[w.poole-joint-chiefs-of-staff]], 135 & n.49 (after Nam Tha; before their return on May 12; no day). Check: the day. To check: General Lemnitzer, interviewed by W. S. Poole, Dec. 16, 1976; "Visit to SEA by the Secretary of Defense, 8–11 May 1962," JMF 9150/5420 (14 May 62) sec. 1 (cited by [[w.poole-joint-chiefs-of-staff]], 135 n.49): the whole visit, South Vietnam''s days ([[cal.1962-05-09.vietnam]]) among them. See [[cal.1962-05-06.laos]]. Names: McNamara, Lemnitzer, Kennedy.'
      tags: [name:mcnamara-robert-s, name:lemnitzer-lyman-l, name:kennedy-john-f]
- add:
    entry:
      id: cal.1962-05.laos-3
      when: May
      date: '1962-05'
      thread: laos
      c: 'McNamara urges Prime Minister Sarit to raise an airborne regiment, a reserve to be moved quickly, as Lemnitzer advised. Sarit agrees if the United States furnishes the equipment and the money; McNamara: the Thais can pay for it themselves. No agreement.'
      n: '[[w.poole-joint-chiefs-of-staff]], 135 & n.49 (no day; on the same visit). Check: the day. To check: "Visit to SEA by the Secretary of Defense, 8–11 May 1962," JMF 9150/5420 (14 May 62) sec. 1 (cited by [[w.poole-joint-chiefs-of-staff]], 135 n.49). See [[cal.1962-05.laos-2]]. Names: McNamara, Sarit, Lemnitzer.'
      tags: [name:mcnamara-robert-s, name:sarit-thanarat, name:lemnitzer-lyman-l, polity:th]
- cite:
    id: cal.1962-05-11.laos-2
    item: '[[w.poole-joint-chiefs-of-staff]], 135 & n.50 (the Service Chiefs, by JCSM-376-62 of May 11: Nam Tha "conclusive evidence" of Souvanna''s inability to control the Pathet Lao; against State''s steps to undermine Phoumi; the battle group in Thailand to the Laotian border, SEATO or US troops visibly alerted; intervention with willing SEATO members unless the cease-fire line is restored; not Decker or McNamara''s marginalia)'
    units: '?'
- cite:
    id: cal.1961-07-19.berlin-and-vienna
    item: '[[w.poole-joint-chiefs-of-staff]], 147 (the NSC, "next day" after July 18: Acheson for a declaration of national emergency and a reserve call-up by September; McNamara''s flexible timetable, six Army and two Marine divisions in an active reserve, six divisions deployable to Europe by Jan. 1, 1962, without a national emergency or mobilizing major ground units; not the hour, the Steering Group, Acheson''s assent, Kennedy on taxes or the decisions)'
    units: '?'
- cite:
    id: cal.1961-07-24.berlin-and-vienna-2
    item: '[[w.poole-joint-chiefs-of-staff]], 147 (NSAM No. 62, July 24, adopting McNamara''s approach of July 19: six divisions and supporting air units deployable to Europe by Jan. 1, 1962, without a national emergency or mobilizing major ground units; $3.2 billion in new obligational authority asked of Congress)'
    units: 'A-C'
- cite:
    id: cal.1961-07-25.berlin-and-vienna
    item: '[[w.poole-joint-chiefs-of-staff]], 147 (the televised address "the next evening" after NSAM 62, quoted: West Berlin "the great testing place of Western courage and will"; not the figures)'
    units: '?'
- cite:
    id: cal.1961-08-10.defense
    item: '[[w.poole-joint-chiefs-of-staff]], 147 (ten days after Aug. 1, the House and Senate complete a $46.662 billion military appropriation, "virtually everything" the administration wanted; not the amendments)'
    units: '?'
- add:
    entry:
      id: cal.1966-11.republican-party-3
      when: Nov.
      date: '1966-11'
      thread: republican-party
      c: 'Scott (R-Pa.) on the midterm returns: "new strength to the centrist tradition of our party."'
      n: '[[w.hess-republican-establishment]], 5 (after the election; no day). Check: the day and the occasion. See [[cal.1966-11-08.elections-1966]]. Names: Scott.'
      tags: [name:scott-hugh-d-jr, state:pa]
