      id: cal.1967-12.vietnam-congress-3
      when: Dec.
      date: 1967-12
      thread: vietnam-congress
      c: 'McGovern, leaving a White House dinner: Johnson "a tortured and confused man" over Vietnam, by Fry''s report.'
      n: '[[w.longley-lbjs-1968]], 3. To check: [[w.fry-debating-vietnam]], 139 (cited by [[w.longley-lbjs-1968]], 3 n.8). Check: the day; Longley dates it "in late 1967." Names: McGovern, Johnson.'
      src:
