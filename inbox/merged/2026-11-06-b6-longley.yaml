        - 'via w.longley-lbjs-1968 15 n.17: all'
      tags:
      - 'name:acheson-dean-g'
      - 'name:rostow-walt-w'
- add:
    entry:
      id: cal.1968-01-04.program
      when: Jan. 4
      date: '1968-01-04'
      thread: program
      c: 'McPherson''s first full draft of the State of the Union, from a twenty-page outline, by teletype to the Ranch. Johnson edits it, wanting it under 4,000 words; Roche and Levinson among the drafters.'
      n: '[[w.longley-lbjs-1968]], 14 (the day; the length, 14, by Kintner to Christian, Jan. 16, 14 n.14). See [[cal.1967-12-19.program]]. Names: McPherson, Johnson, Roche, Levinson.'
      src:
        c: ff6dd577
        rows:
        - 'w.longley-lbjs-1968 14: all'
      tags:
      - 'name:mcpherson-harry'
      - 'name:johnson-lyndon-b'
      - 'name:roche-john-p'
      - 'name:levinson-lawrence-e'
- add:
    entry:
      id: cal.1968-01-12.program
      when: Jan. 12
      date: '1968-01-12'
      thread: program
      c: 'Rusk to McPherson and to Johnson on the State of the Union: keep it to the San Antonio formula; "Our war aim is peace."'
      n: '[[w.longley-lbjs-1968]], 288 n.15 (Rusk''s memoranda, quoted in the note). To check: Rusk to McPherson, Jan. 12, 1968; Rusk to Johnson, Jan. 12, 1968, Statements of Lyndon Baines Johnson, Jan. 7–17, 1968, box 260, LBJ Library (cited by [[w.longley-lbjs-1968]], 15 n.15). See [[cal.1967-12-19.program]]. Names: Rusk, McPherson, Johnson.'
