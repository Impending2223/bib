        rows:
        - 'w.longley-lbjs-1968 84: all'
      tags:
      - 'name:johnson-lynda-bird'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-4
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: 'In the car after Mass, the partition up, Johnson reads Luci and Patrick Nugent the statement to close his address. Luci in tears: "It is more complicated." By his account.'
      n: '[[w.longley-lbjs-1968]], 89. To check: [[w.johnson-vantage-point]], 432 (cited by [[w.longley-lbjs-1968]], 89 n.29). See [[cal.1968-03-31.elections-1968-4]]. Names: Johnson, Luci Baines Johnson Nugent, Patrick Nugent.'
      src:
