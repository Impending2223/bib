      - 'name:johnson-lyndon-b'
      - 'name:evers-charles'
- add:
    entry:
      id: cal.1968-06-05.civil-disorders-4
      when: June 5
      date: '1968-06-05'
      thread: civil-disorders
      c: 'Washington''s precautions: Califano, Christopher and others on 600 Guardsmen in the capital, 600 police at least on the streets, plans for the Poor People''s march of June 19. Walter Washington asks for Army officers in the precincts and troops on thirty minutes'' alert.'
      n: '[[w.longley-lbjs-1968]], 141. To check: Califano to Johnson, June 5, 1968, White House Famous Names, box 8, LBJ Library (cited by [[w.longley-lbjs-1968]], 141 nn.20–21). See [[cal.1968-06-05.civil-disorders-3]]. Names: Califano, Christopher, Walter Washington.'
