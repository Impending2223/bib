- add:
    entry:
      id: cal.1968-01-15.program
      when: Jan. 15
      date: '1968-01-15'
      thread: program
      c: 'Reedy to Johnson on the State of the Union draft: the line on "using our antennae" rings hollow; something to "cut through the fog." Johnson accepts his recommendations.'
      n: '[[w.longley-lbjs-1968]], 15. To check: Reedy to Johnson, Jan. 15, 1968, Statements of Lyndon Baines Johnson, Jan. 7–17, 1968, box 260, LBJ Library (cited by [[w.longley-lbjs-1968]], 15 n.15). See [[cal.1967-12-19.program]]. Names: Reedy, Johnson.'
