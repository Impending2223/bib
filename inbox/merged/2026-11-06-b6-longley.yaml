    entry:
      id: cal.1968-03-31.elections-1968-johnson-5
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: 'Minutes before the address, at Johnson''s order, the calls: Watson''s list, McNamara, Rowe, Daley and Meany among the Cabinet members; Rostow to Wheeler and Westmoreland.'
      n: '[[w.longley-lbjs-1968]], 99. To check: [[w.watson-chief-of-staff]], 284; [[w.johnson-vantage-point]], 434 (cited by [[w.longley-lbjs-1968]], 99 nn.80–81). See [[cal.1968-03-31.elections-1968]]. Names: Johnson, Watson, McNamara, Rowe, Daley, Meany, Rostow, Wheeler, Westmoreland.'
