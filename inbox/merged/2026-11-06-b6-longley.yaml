        rows:
        - 'w.longley-lbjs-1968 141: all'
        - 'via w.longley-lbjs-1968 141 n.20: A'
        - 'via w.longley-lbjs-1968 141 n.21: B'
      tags:
      - 'name:califano-joseph-a-jr'
      - 'name:christopher-warren'
      - 'name:washington-walter-e'
      - 'city:washington'
- add:
    entry:
      id: cal.1968-06-05.assassination-9
      when: June 5
      date: '1968-06-05'
      thread: assassination
      c: 'Gaither to Califano: only Presidents and Vice Presidents have state funerals, lying in the Capitol''s rotunda; others, by the President''s designation, an "official" funeral.'
      n: '[[w.longley-lbjs-1968]], 145. To check: Gaither to Califano, June 5, 1968, Office Files of White House Aides, Gaither, box 17, LBJ Library (cited by [[w.longley-lbjs-1968]], 145 n.30). Names: Califano.'
      src:
        c: 2230ef9c
        rows:
        - 'w.longley-lbjs-1968 145: all'
        - 'via w.longley-lbjs-1968 145 n.30: all'
      tags:
      - 'name:califano-joseph-a-jr'
- add:
    entry:
      id: cal.1968-06-07.robert-kennedy
      when: June 7
      date: '1968-06-07'
      thread: robert-kennedy
      c: 'Califano to Johnson on the burial: in the plot reserved for John Kennedy at Arlington, McNamara making the plans; Katzenbach in charge from Union Station to the cemetery; the family wants no military honors, no taps.'
      n: '[[w.longley-lbjs-1968]], 145. To check: Califano to Johnson, June 7, 1968, White House Famous Names, box 8, LBJ Library (cited by [[w.longley-lbjs-1968]], 145 n.31). Check: Longley places it late in the morning of June 6. See [[cal.1968-06-06.robert-kennedy-campaign-2]]. Names: Califano, Johnson, John Kennedy, McNamara, Katzenbach, Robert Kennedy.'
      src:
        c: 41e2284e
        rows:
        - 'w.longley-lbjs-1968 145: all'
        - 'via w.longley-lbjs-1968 145 n.31: all'
