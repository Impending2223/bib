- add:
    entry:
      id: cal.1968-04-07.civil-disorders-king-4
      when: Apr. 7
      date: '1968-04-07'
      thread: civil-disorders-king
      c: 'Palm Sunday, St. Dominic''s, the 12:15 p.m. Mass: Johnson with Luci Nugent, Fehmer, Jones and Califano. The priest prays for the President''s wisdom and on King''s death; the congregation rises and stays in place as he leaves.'
      n: '[[w.califano-triumph-and-tragedy-of]], 281 (the hour; those with him; the congregation); [[w.longley-lbjs-1968]], 127 (the homily, by Risen). To check: [[w.risen-nation-on-fire]], 186 (cited by [[w.longley-lbjs-1968]], 127 n.74). Check: Longley has Patrick Nugent there, Califano Fehmer and Jones. See [[cal.1968-04-07.civil-disorders-king-2]]. Names: Johnson, Luci Baines Johnson Nugent, James R. Jones, Califano, Martin Luther King.'
      src:
        c: 9d273706
        rows:
        - 'w.califano-triumph-and-tragedy-of 281: A, C'
        - 'w.longley-lbjs-1968 127: B-C'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:nugent-luci-baines-johnson'
      - 'name:jones-james-r'
      - 'name:califano-joseph-a-jr'
      - 'name:king-martin-luther-jr'
- add:
    entry:
      id: cal.1968-06-05.assassination-7
      when: June 5
      date: '1968-06-05'
      thread: assassination
      c: 'About 6 p.m., Manatos to Johnson: Chuck Roche, at Good Samaritan Hospital, finds the Kennedy people "gloomy"; the family knows of the President''s willingness to do what he can.'
      n: '[[w.longley-lbjs-1968]], 141. To check: Manatos to Johnson, June 5, 1968, WHCF, Name File, Kennedy, Robert F., box 98, LBJ Library (cited by [[w.longley-lbjs-1968]], 141 n.18). See [[cal.1968-06-05.assassination-3]]. Names: Manatos, Johnson.'
