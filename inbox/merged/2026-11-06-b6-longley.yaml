      when: Jan. 14
      date: '1968-01-14'
      thread: program
      c: 'Rostow to Johnson on the State of the Union: no reference to the French. Johnson agrees.'
      n: '[[w.longley-lbjs-1968]], 15. To check: Rostow to Johnson, Jan. 14, 1968, Statements of Lyndon Baines Johnson, Jan. 7–17, 1968, box 260, LBJ Library (cited by [[w.longley-lbjs-1968]], 15 n.16). See [[cal.1967-12-19.program]]. Names: Rostow, Johnson.'
