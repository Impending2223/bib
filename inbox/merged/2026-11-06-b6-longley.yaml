      n: '[[w.longley-lbjs-1968]], 152. To check: [[w.johnson-white-house-diary]], 685 (cited by [[w.longley-lbjs-1968]], 152 n.59). Names: Johnson, Lady Bird Johnson, McCormack, Humphrey, Sevareid.'
