        rows:
        - 'w.longley-lbjs-1968 3: all'
      tags:
      - 'name:mcgovern-george'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1967-12-19.program
      when: Dec. 19
      date: '1967-12-19'
      thread: program
      c: 'Acheson to Rostow on a draft of the State of the Union: abandon it, start fresh; the Vietnam sections "tired clichés."'
      n: '[[w.longley-lbjs-1968]], 15. To check: Acheson to Rostow, Dec. 19, 1967, Statements of Lyndon Baines Johnson, Jan. 7–17, 1968, box 260, LBJ Library (cited by [[w.longley-lbjs-1968]], 15 n.17). Names: Acheson, Rostow.'
