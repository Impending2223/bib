      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1968-01-16.program
      when: Jan. 16
      date: '1968-01-16'
      thread: program
      c: 'Kintner to Christian: Eisenhower''s and Kennedy''s State of the Union addresses longer than Johnson''s, with the word counts of the four Presidents before, to "plant this information appropriately."'
      n: '[[w.longley-lbjs-1968]], 14 (by the note, 14 n.14). To check: Kintner to Christian, Jan. 16, 1968, Statements of Lyndon Baines Johnson, Jan. 7–17, 1968, box 260, LBJ Library (cited by [[w.longley-lbjs-1968]], 14 n.14). See [[cal.1967-12-19.program]]. Names: Kintner, Christian, Eisenhower, Kennedy, Johnson.'
      src:
        c: b8c86e1a
        rows:
        - 'w.longley-lbjs-1968 14: all'
        - 'via w.longley-lbjs-1968 14 n.14: all'
      tags:
