      - 'name:christian-george'
      - 'name:eisenhower-dwight-d'
      - 'name:kennedy-john-f'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1968-01-15.elections-1968-johnson
      when: Jan. 15
      date: '1968-01-15'
      thread: elections-1968-johnson
      c: 'Late lunch, Johnson with Christian and Mrs. Johnson, the day after his talk with Busby: "I have been in a hurry all of my life." Mrs. Johnson, in her diary: his mind on running again or getting out.'
      n: '[[w.longley-lbjs-1968]], 19. To check: [[w.johnson-white-house-diary]], 615 (cited by [[w.longley-lbjs-1968]], 19 n.23). See [[cal.1968-01-14.elections-1968]]. Names: Johnson, Christian, Lady Bird Johnson.'
      src:
        c: 9206f7bd
        rows:
        - 'w.longley-lbjs-1968 19: all'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:christian-george'
      - 'name:johnson-lady-bird'
- add:
    entry:
      id: cal.1968-01-16.program-2
      when: Jan. 16
      date: '1968-01-16'
      thread: program
      c: 'From 9 a.m., the Cabinet officers to Califano''s office, one an hour, each to read only the parts of the State of the Union on his department; the text out of the White House only to Rusk and McNamara. Johnson fears a leak "to some columnist."'
      n: '[[w.califano-triumph-and-tragedy-of]], 255 (the hours; Rusk and McNamara; the columnist); [[w.longley-lbjs-1968]], 19–20 (at Johnson''s request). See [[cal.1967-12-19.program]]. Names: Califano, Rusk, McNamara, Johnson.'
      src:
        c: 4382b43a
        rows:
        - 'w.califano-triumph-and-tragedy-of 255: all'
        - 'w.longley-lbjs-1968 19–20: A, C'
      tags:
      - 'name:califano-joseph-a-jr'
      - 'name:rusk-dean'
      - 'name:mcnamara-robert-s'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1968-01-23.japan-and-korea-pueblo-2
      when: Jan. 23
      date: '1968-01-23'
      thread: japan-and-korea-pueblo
      c: '2:24 a.m., Rostow wakes Johnson by telephone: the Navy has a distress signal from the *Pueblo*. Johnson goes back to sleep.'
      n: '[[w.longley-lbjs-1968]], 32. See [[cal.1968-01-23.japan-and-korea]]. Names: Rostow, Johnson.'
      src:
        c: ea47f26e
        rows:
        - 'w.longley-lbjs-1968 32: all'
      tags:
      - 'name:rostow-walt-w'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1968-01-31.japan-and-korea-pueblo
      when: Jan. 31
      date: '1968-01-31'
      thread: japan-and-korea-pueblo
      c: 'Pyongyang. A party leader: the American move to bring the *Pueblo* to the United Nations "a premeditated intrigue"; the Military Armistice Commission the precedent for such cases.'
      n: '[[w.longley-lbjs-1968]], 45 (by Lerner). To check: [[w.lerner-pueblo-incident]], 143 (cited by [[w.longley-lbjs-1968]], 45 n.36). See [[cal.1968-01-23.japan-and-korea]].'
      src:
        c: d4d775d7
        rows:
        - 'w.longley-lbjs-1968 45: all'
      tags: []
- add:
    entry:
      id: cal.1968-03.japan-and-korea-pueblo
      when: Mar.
      date: 1968-03
      thread: japan-and-korea-pueblo
      c: 'Sam Houston Johnson sounds opinion on the *Pueblo* for his brother. A Louisiana Democratic leader: tell North Korea to return the ship or be "blown off the map."'
      n: '[[w.longley-lbjs-1968]], 50. Check: the day; Longley dates it "In March." See [[cal.1968-01-23.japan-and-korea]].'
      src:
        c: 687a2582
        rows:
        - 'w.longley-lbjs-1968 50: all'
      tags: []
- add:
    entry:
      id: cal.1968-04.japan-and-korea-pueblo
      when: Apr.
      date: 1968-04
      thread: japan-and-korea-pueblo
      c: 'The crew''s families, led by Rose Bucher, lobby the press and Congress; one family pickets Rusk''s office. A National Remember the *Pueblo* Committee, its bumper stickers, presses the White House and State to act.'
      n: '[[w.longley-lbjs-1968]], 50 (by Lerner). To check: [[w.lerner-pueblo-incident]], 199–200 (cited by [[w.longley-lbjs-1968]], 50 n.50). Check: the days; Longley gives "throughout the spring." See [[cal.1968-01-23.japan-and-korea]]. Names: Rusk.'
      src:
        c: b094099c
        rows:
        - 'w.longley-lbjs-1968 50: all'
      tags:
      - 'name:rusk-dean'
- add:
    entry:
      id: cal.1968-06-20.japan-and-korea-pueblo
      when: June 20
      date: '1968-06-20'
      thread: japan-and-korea-pueblo
      c: 'The House. Reid (R-Ill.), extending her remarks: 150 days on, the *Pueblo*''s 83 crewmen still captive; the incident has "seriously injured America''s prestige." She inserts the Aurora *Beacon-News* editorial of June 9, "Listen, Washington."'
      n: '[114 Cong. Rec. 18,098](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt14/pdf/GPO-CRECB-1968-pt14-2-1.pdf#page=140) (1968) (June 20, 1968). See [[cal.1968-01-23.japan-and-korea]]. Names: Reid.'
      src:
        c: a0f60d19
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt14/pdf/GPO-CRECB-1968-pt14-2-1.pdf#page=140: all'
      tags:
      - 'name:reid-charlotte-t'
- add:
    entry:
      id: cal.1968-02-27.vietnam-205000-2
      when: Feb. 27
      date: '1968-02-27'
      thread: vietnam-205000
      c: 'Califano and McPherson, riding back to the White House from the meeting at State. Califano: "It really is all over, isn''t it?" McPherson: "You bet it is." By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 264; [[w.longley-lbjs-1968]], 68 (by Califano, 68 n.45). See [[cal.1968-02-27.vietnam-205000]]. Names: Califano, McPherson.'
      src:
        c: 9c3ef5da
        rows:
        - 'w.califano-triumph-and-tragedy-of 264: all'
        - 'w.longley-lbjs-1968 68: all'
      tags:
      - 'name:califano-joseph-a-jr'
      - 'name:mcpherson-harry'
- add:
    entry:
      id: cal.1968-03-17.elections-1968-johnson
      when: Mar. 17
      date: '1968-03-17'
      thread: elections-1968-johnson
      c: 'Sunday, the Ranch. Mrs. Johnson, watching Humphrey defend the administration: he and Rusk "about the only two" speaking for it now, by her diary.'
      n: '[[w.longley-lbjs-1968]], 78. To check: [[w.johnson-white-house-diary]], 641 (cited by [[w.longley-lbjs-1968]], 78 n.93). Names: Lady Bird Johnson, Humphrey, Rusk.'
      src:
