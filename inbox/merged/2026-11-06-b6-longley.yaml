        rows:
        - 'w.longley-lbjs-1968 78: all'
      tags:
      - 'name:johnson-lady-bird'
      - 'name:humphrey-hubert-h'
      - 'name:rusk-dean'
- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-3
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: About 7 a.m., the Diplomatic Reception Room. Lynda Robb, back from seeing her husband off to Vietnam, asks her father why he must fight for people who do not want to be protected. Johnson, by his account, cannot comfort her.
      n: '[[w.longley-lbjs-1968]], 84. To check: [[w.johnson-vantage-point]], 431; [[w.russell-lady-bird]], 300 (cited by [[w.longley-lbjs-1968]], 84 nn.3–4). See [[cal.1968-03-31.elections-1968-10]]. Names: Lynda Bird Johnson, Johnson.'
