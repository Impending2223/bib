      - 'name:johnson-lyndon-b'
      - 'name:kennedy-robert-f'
- add:
    entry:
      id: cal.1968-06-05.assassination-8
      when: June 5
      date: '1968-06-05'
      thread: assassination
      c: 'Reedy to Johnson, before the evening address: take no action "to feed the flames"; Evers wrong that speaking for the poor risks one''s life; no steps but protecting the candidates until the situation is clear.'
      n: '[[w.longley-lbjs-1968]], 141. To check: Reedy to Johnson, June 5, 1968, White House Famous Names, box 8, LBJ Library (cited by [[w.longley-lbjs-1968]], 141 n.19). See [[cal.1968-06-05.civil-disorders-2]]. Names: Reedy, Johnson, Charles Evers.'
