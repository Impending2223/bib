      when: Dec. 17
      date: '1967-12-17'
      thread: vietnam
      c: '11:35 a.m., Johnson to Cross, his pilot, on word of Holt''s death: he may fly to Australia the next day. The big 707 under repair in New York; Johnson takes a backup 707.'
      n: '[[w.longley-lbjs-1968]], 1–2 (by Cross''s account). To check: [[w.cross-around-the-world-with]], 134–35 (cited by [[w.longley-lbjs-1968]], 2 n.1). See [[cal.1967-12-17.vietnam-2]]. Names: Johnson.'
