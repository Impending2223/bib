- add:
    entry:
      id: cal.1968-04-01.elections-1968-johnson-3
      when: Apr. 1
      date: '1968-04-01'
      thread: elections-1968-johnson
      c: '12:12 a.m., after the news conference, Johnson to Arthur Krim: "I never was any surer of any decision I ever made in my life"; 525,000 men depend on him, and he "can''t worry about the primaries."'
      n: 'FRUS 1964–68, VI, doc. [169](https://history.state.gov/historicaldocuments/frus1964-68v06/d169) (editorial note, by the Daily Diary). [[w.longley-lbjs-1968]], 103. See [[cal.1968-03-31.elections-1968]]. Names: Johnson.'
