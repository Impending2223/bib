      n: '[[w.yang-shangkun-riji]], I, 682–684 (Apr. 16, 1961; note 1 and the work notes (仿宋体): farmland 860,000 mu; draft animals 21,688, now 17,000; 162 bad elements in 66 brigades; levelled and transferred 1.197 million yuan, 1.089 million (90.9 percent) returned; 4,759 laborers sent down; private plots 43,016 mu (5 percent); 1960 income 32.57 million yuan, shared 3 to 7; 2,332 mess halls; sick 11,347 (Jan.), 8,560 (Feb.), 12,108 (Mar.), 9,651 (to Apr. 7); coal short 19,055 tons to June 20). The words: 下午3时 (I, 682). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Zhang Liu, Yang Shangkun.'
