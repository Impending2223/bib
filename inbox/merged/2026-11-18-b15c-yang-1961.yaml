    entry:
      id: cal.1961-04-07.china-leadership-3
      when: Apr. 7
      date: '1961-04-07'
      thread: china-leadership
      c: 'Xushui 徐水, 4 to 6:30 p.m. Liu Yinchun 刘因春 of the county committee gives Yang Shangkun 杨尚昆 the county''s state: 101,664 households, 464,733 farm people; grain 349 million jin in 1958, 217 million in 1959, 183 million in 1960. The causes of the fall: no pay by work, full supply in 1958; brigades merged, great mess halls, private plots taken; close planting; too much labor on water works.'
      n: '[[w.yang-shangkun-riji]], I, 671–673 (Apr. 7, 1961; note 2 and Yang''s work notes (仿宋体): 1,135,445 mu; draft animals 32,253 (1958), 25,353 (1960), 23,041 (1961); pigs 76,557 (1958), 198,440 (1959), 56,225 (1960), 34,924 (1961); cotton 406,390 jin (1958); compensation due 18.77 million yuan, 8.72 million (46.5 percent) paid; 1960 distribution: 401 accounting units, 32.16 million yuan, 9.82 million withheld (30.5 percent), 22.33 million shared; 482 units, 63 percent with the three guarantees and one reward; thirteen county industries, 4,600 workers; 11 communes; 428 production teams, 2,034 small teams; labor 196,370 (end 1957), 157,309 (end 1960); animals 31,894 (end 1957), 25,353 (end 1960)). The words: 4时到6时半 (I, 671). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Liu Yinchun, Yang Shangkun.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: bf64e772
        rows:
        - 'w.yang-shangkun-riji I, 671–673: all'
      time: 1961-04-07T08:00Z
      time_zone: Asia/Shanghai
