- cite:
    id: cal.1961-01-03.china-leadership
    item: '[[w.yang-shangkun-riji]], I, 639 (Jan. 3, 1961; the meeting at Mao''s, 晚间...10 时在主席处开会; Li Fuchun: 20 million tons of steel leaves gaps in iron, coal, transport and timber, to be cut to 19 or 19.5 million for margin; Mao: report so tomorrow for discussion; high targets and strain for three years squeezed farming, and even 19 million may bring the same strain in the fourth quarter, to be avoided; the meeting broke up at 1:45 a.m.)'
    units: B
