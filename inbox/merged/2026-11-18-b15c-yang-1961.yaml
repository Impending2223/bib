- add:
    entry:
      id: cal.1961-05-09.china-leadership-11
      when: May 9
      date: '1961-05-09'
      thread: china-leadership
      c: 'Baoding 保定, 4 p.m. Li Yuenong 李悦农 and Yang Peisheng 杨培生 of the prefectural committee to Yang Shangkun 杨尚昆 on the mess halls and the supply system: cadres and cooks eat outside the ration; grain lost at storage, milling and the pot; poor food; waste of labor and coal; pigs from 800 to 185 in one place. 1960, distribution 340 million yuan, the supply part 17 percent of consumption; 3,588 teams under 50 yuan a head. The prefecture to try it in a county, a commune, a team, before the autumn harvest.'
      n: '[[w.yang-shangkun-riji]], II, 4–7 (May 9, 1961; note 3 and the work notes (仿宋体): mess hall coal 2.8 million jin in 1960, 5.6 jin a head a day; supply 43.7 percent of distribution (1958), 22 (1959), 17 (1960)). The words: 下午4时 (II, 4). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Li Yuenong, Yang Peisheng, Yang Shangkun.'
