      when: May 23
      date: '1961-05-23'
      thread: china-leadership
      c: 'Liu Shaoqi 刘少奇 to the North China and Central-South group: investigation the basic question, one with the mass line; investigate with a purpose, to test whether the policies are right and rightly done, not to prove one''s own frame; peasants are afraid to tell the truth; investigation a test of cadres, "even in communism." Repayment: the seizures shook ownership; rehabilitation, not in a gust; Deng Xiaoping''s 邓小平 view that cadres not off production wear no labels.'
      n: '[[w.yang-shangkun-riji]], II, 29–31 (May 23, 1961; the work notes; the commune red banner a black one to the peasants unless the errors are put right, said at the session, the speaker not named). The words: 下午3时到6时半 (II, 29). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). See [[cal.1961-05-21.china-leadership]]. Names: Liu Shaoqi, Deng Xiaoping.'
