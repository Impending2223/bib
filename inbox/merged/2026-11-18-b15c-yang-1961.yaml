- add:
    entry:
      id: cal.1961-01-01.china-leadership-3
      when: Jan. 1
      date: '1961-01-01'
      thread: china-leadership
      c: '*Renmin ribao* 人民日报, the New Year''s editorial: the whole country to "unite as one, rely on the masses" for new victories in world peace and socialist construction at home. Steel in 1960, 18.45 million tons; other industry grown; 900 million mu hit by natural disasters, 300 to 400 million badly; the plans for grain and the light industries that rest on farming unfulfilled. The three red banners 三面红旗 to be held to.'
      n: '[[w.yang-shangkun-riji]], I, 638 (Jan. 1, 1961; Yang''s summary; his aside: the real steel figure 18.76 million tons). To check: *Renmin ribao*, Jan. 1, 1961, editorial.'
      tags:
      - polity:prc
      src:
        c: 979e6597
        rows:
        - 'w.yang-shangkun-riji I, 638: all'
