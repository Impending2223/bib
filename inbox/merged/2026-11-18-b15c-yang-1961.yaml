- add:
    entry:
      id: cal.1961-05-26.china-leadership
      when: May 26
      date: '1961-05-26'
      thread: china-leadership
      c: 'Peking Hotel 北京饭店, seventh floor, morning and afternoon. The Central Work Conference''s group: the ten "great drives" 十个大办; farmland down 250 million mu, 200 million opened; responsibility chiefly the Center''s, the Secretariat''s and the government''s; grain 280 billion jin in 1960, 4 billion imported in the half-year; 310 billion for 1961–62, procurement of 80 billion possible. Li Xiannian 李先念 on commerce''s five great errors; the towns 40 million more than in 1955.'
      n: '[[w.yang-shangkun-riji]], II, 33–36 (May 26, 1961; note 1 and the work notes; the speakers not named but Li; steel''s 18.4 million tons in 1960 forced; Mao''s talk on the *Political Economy* to be recalled). The words: 今天上下午 (II, 33). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). See [[cal.1961-05-21.china-leadership]]. Names: Li Xiannian.'
