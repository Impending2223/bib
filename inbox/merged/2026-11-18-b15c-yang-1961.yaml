      c: 'At Mao''s 毛泽东, 11 to 12. Yang Shangkun 杨尚昆 talks with the men of Mao''s staff going down to work in Xinyang 信阳 prefecture, Henan 河南: Ye Zilong 叶子龙, Wang Jingxian 王敬先, Lin Ke 林克, Gao Zhi 高智, Li Yinqiao 李银桥 and Feng Yaosong 封耀松.'
      n: '[[w.yang-shangkun-riji]], I, 640 (Jan. 4, 1961; note 2: the six named; Mao''s letter of Dec. 26, 1960 sent them down together; seven more added later (Luo Daorang 罗道让, Yan Changlin 阎长林, Gao Biceng 高碧岑, Shen Jianxin 沈剑心, Wang Zhaoguang 王兆光, Liu Xuran 刘栩然, Zhang Yu 章禹); the Henan committee sent them to Xuchang 许昌 prefecture). The words: 11时到12时 (I, 640). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: Mao Zedong, letter of Dec. 26, 1960 to Ye Zilong and others (cited by [[w.yang-shangkun-riji]], I, 640 n.2). See [[cal.1960-12-26.china-leadership-2]]. Names: Yang Shangkun, Mao Zedong, Ye Zilong, Wang Jingxian, Lin Ke, Gao Zhi, Li Yinqiao, Feng Yaosong.'
      tags:
