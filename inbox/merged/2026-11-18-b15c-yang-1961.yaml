- add:
    entry:
      id: cal.1961-04-29.china-leadership-6
      when: Apr. 29
      date: '1961-04-29'
      thread: china-leadership
      c: Yang Shangkun 杨尚昆, 3 to 5 p.m., with Ye Zilong 叶子龙, Kang Yimin 康一民, Wang Jingxian 王敬先, Gao Zhi 高智, Luo Guanglu 罗光禄 and Gong Zirong 龚子荣 on the question of the recordings 录音问题.
      n: '[[w.yang-shangkun-riji]], I, 724–725 (Apr. 29, 1961; note 1: the recordings of Mao''s talks on his tours, end of Jan. to early Apr. 1961; the Confidential Office recorded the Center''s formal meetings and leaders'' speeches, and from Nov. 1958 Mao''s important talks away from Peking; at the Hangzhou meeting of Nov. 1959 Mao told them to keep no record and criticized it; finding the recordings again on his tour of Jan.–Apr. 1961 he criticized them severely and had Wang Dongxing report to the Secretariat; in April the Secretariat criticized the Confidential Office, a serious warning to Ye Zilong and Kang Yimin, a warning to Wu Zhenying; May 17, the Secretariat''s decision forbidding recordings; in the Cultural Revolution the affair turned against Yang; the General Office''s review report of Oct. 15, 1980, approved by the Secretariat and issued Oct. 23, 1980, cleared Yang, Ye, Kang and Wu). The words: 3时到5时 (I, 724). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: Central Committee Secretariat, decision on the question of sound recordings and minutes, May 17, 1961 (cited by [[w.yang-shangkun-riji]], I, 725 n.1a); Central Committee General Office, review report on the "secret recording" question of the former General Office Confidential Office, Oct. 15, 1980 (cited by [[w.yang-shangkun-riji]], I, 725 n.1b); Central Committee General Office, request report on the rehabilitation of the former General Office and Yang Shangkun, Oct. 15, 1980 (cited by [[w.yang-shangkun-riji]], I, 725 n.1c). See [[cal.1961.china-leadership-8]]. Names: Yang Shangkun, Ye Zilong, Kang Yimin, Wang Jingxian, Gao Zhi, Luo Guanglu, Gong Zirong.'
      tags:
      - polity:prc
