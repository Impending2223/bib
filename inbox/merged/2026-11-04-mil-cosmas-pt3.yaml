        when: July 29
        date: '1967-07-29'
        thread: vietnam-operations
        c: The Mobile Riverine Force's second fight with a battalion-size enemy element, of its Coronado campaign. It reports a kill ratio of fifteen to one, and high non-combat losses in the swamps.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 89. To check: COMUSMACV to CINCPAC, 10 Oct 67, JCS IN 35776 (cited by [[w.cosmas-joint-chiefs-of-staff]], 89 n.5). See [[cal.1967-06-04.vietnam-operations]].'
