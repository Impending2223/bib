        when: Feb. 25–28
        date: '1967-02-25'
        thread: vietnam-operations
        c: Westmoreland authorizes III MAF to fire on artillery north of the DMZ, under Johnson's authority for artillery and naval gunfire on North Vietnamese weapons firing from beyond the line. From Feb. 25, four days, the Marines fire 2,171 rounds north of the demarcation line.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 35–36. In March, nine attacks on the Marine artillery positions; a two-battalion assault on the firebases thrown back; more than 500 bodies counted around Camp Carroll, Cam Lộ, Cồn Tiên and Gio Linh (36). To check: JCS 1422-67 and JCS 6957 to CINCPAC, 22 and 23 Feb 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 36 n.13); FMFPAC, Operations of US Marine Forces Vietnam, April 67, pp. 17-21, OCJCS File 091 Vietnam Jun 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 36 n.13). Names: Westmoreland.'
