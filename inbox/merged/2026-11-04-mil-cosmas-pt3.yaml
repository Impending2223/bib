        date: '1967-11-10'
        thread: vietnam-air-war
        c: McNamara approves the Joint Chiefs' surge to 1,200 B-52 sorties a month and more B-52s at U Tapao, 25 not 30.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 96. To check: JCSM-55-4-67 to SecDef, 14 Oct 67 (derived from JCS 2477/166-5), JMF 907/323 (4 Oct 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 96 n.20); Memo, SecDef to SecAF, CJCS, ASD(ISA), 10 Nov 67, Att to JCS 2472/166-7, 14 Nov 67, JMF 907/323 (4 Oct 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 96 n.20). See [[cal.1967-10-14.vietnam-air-war]]. Names: McNamara.'
