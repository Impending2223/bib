        when: Nov. 28
        date: '1967-11-28'
        thread: vietnam-air-war
        c: McNamara delegates to the Joint Chiefs, for CINCPAC and CINCSAC, the approval of Arc Light strikes in southern North Vietnam up to the 17th parallel, as they asked Oct. 2.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 96. To check: JCSM-532-67 to SecDef, 2 Oct 67 (derived from JCS 2472/157), JMF 912/323 (11 Sep 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 96 n.21); Memo, SecDef to CJCS, 28 Nov 67, Att to JCS 2472/157-1, 30 Nov 67, JMF 912/323 (11 Sep 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 96 n.21). Names: McNamara.'
