      entry:
        id: cal.1967-11-08.vietnam-air-war-2
        when: Nov. 8
        date: '1967-11-08'
        thread: vietnam-air-war
        c: McNamara declares the MK-36 Destructor mine "just another weapon," authorized against all permissible targets, the prohibited zones included. Operational since April, it had been treated as a mine, for waters south of the 20th parallel only.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 82. To check: J-3 Briefing Sheet for CJCS, "JCS 2343/751-1," 21 Dec 66, JMF 9155.3 (7 Dec 65) (cited by [[w.cosmas-joint-chiefs-of-staff]], 82 n.40); JCS 2729 to CINCPAC, 14 Apr 67, OCJCS File 091 Vietnam Nov 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 82 n.40); JCS 2385 to CINCPAC, 082343Z Nov 67, OCJCS File 091 Vietnam Nov 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 82 n.40). Names: McNamara.'
