        when: Apr. 1
        date: '1968-04-01'
        thread: laos
        also: [vietnam-air-war]
        c: The Seventh Air Force opens its southwest monsoon interdiction campaign against the Ho Chi Minh Trail, with the new Muscle Shoals sensors (later Igloo White). From Apr. 19, half the Arc Light force, 30 B-52 sorties a day, to it.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 206. Attack sorties against the North: 5,142 in March, 7,262 in April, 10,000 each in May and June, 9,149 a month in the second quarter against 4,932 in the first; trucks reported destroyed 896 a month and 1,101. Against Laos 7,292 a month in the first quarter, 4,596 in the second (206). In July 14,647 attack sorties below the 19th; July–September 38,334 against 27,447 (212). To check: CIA/DIA, "An Appraisal of the Bombing of North Vietnam, 1 Apr-30 Jun 68," (cited by [[w.cosmas-joint-chiefs-of-staff]], 206 n.9); Combat Analysis Group, J-3, "Statistical Digest of Military Developments in Southeast Asia," CAG Statistical Series, vol. I, no. 7, 3 Feb 69 (cited by [[w.cosmas-joint-chiefs-of-staff]], 206 n.9); COMUSMACV 10917 to CINCPAC, 180508Z Apr 68, JCS IN 50236 (cited by [[w.cosmas-joint-chiefs-of-staff]], 206 n.10); COMUSMACV 12886 to CJCS, 062357Z May 68, JCS IN 88481 (cited by [[w.cosmas-joint-chiefs-of-staff]], 206 n.10); OASD (SA), "Interdiction Campaign since March 31," 22 Aug 68, OCJCS File 091 Vietnam Aug 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 206 n.10).'
