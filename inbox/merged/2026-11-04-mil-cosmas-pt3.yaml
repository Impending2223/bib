  - add:
      entry:
        id: cal.1967-08-09.vietnam-air-war
        when: Aug. 9
        date: '1967-08-09'
        thread: vietnam-air-war
        also: [china]
        c: Johnson approves ten targets in the buffer zone along the Chinese border, cut by the Joint Staff from Sharp's list. Four railroad bridges, five yards and sidings, the Port Wallut naval base; rolling stock south of the Lạng Sơn bridge; Walleye against the bridges; the border not to be crossed. The minor ports of Cẩm Phả and Hòn Gai authorized too, when ships are 2,000 yards from the docks.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 76–77, 79. By Sept. 5, nine more targets in the zone, eight bridges and a siding (77). The Joint Chiefs had opposed the minor ports for now (79). To check: CINCPAC to CJCS, 031933Z Aug 67 and 030123Z Aug 67, OCJCS File 091 Vietnam Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.23); Memo, Jt Staff to CJCS, "CHICOM Buffer Zone Targets," 4 Aug 67, OCJCS File 091 Vietnam Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.23); CJCS 6377-67 to CINCPAC, 8 Aug 67, OCJCS File 091 Vietnam Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.23); JCS 3365 to CINCPAC, 9 Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.23); JCS 3365 to CINCPAC, 090005Z Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.24); CJCS 6377-67 to CINCPAC, 8 Aug 67, OCJCS File 091 Vietnam Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.24); JCS 4091 to CINCPAC, 171459Z Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.24); JCS 5073 to CINCPAC, 301356Z Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.24); JCS 5480 to CINCPAC, 052113Z Sep 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.24); JCS 5073 to CINCPAC, 301356Z Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.24); Memo, CJCS to SecDef, "RT," 30 Aug 67, OCJCS File 091 Vietnam Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 77 n.24). Names: Johnson, Sharp.'
