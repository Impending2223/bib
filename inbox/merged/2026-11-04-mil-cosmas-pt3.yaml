        c: Nitze proposes a variable B-52 rate for 1969, 1,400 to 1,800 sorties a month, 19,200 for the year. The Joint Chiefs answer with J-3's and DIA's study of November, the valid targets five times the force's capacity. Unresolved at the year's end.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 243–44. To check: CINCPAC to JCS et al., 191152Z Oct 68, JCS IN 48683. "ARC LIGHT Follow-On Study," 18 Nov 68, CAG 4-68, JMF 911/323 (26 Nov 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 244 n.23); Memo, DepSecDef to CJCS, "ARC LIGHT Sortie Rate," 26 Nov 68, Att to JCS 2472/389, 27 Nov 68, JMF 911/323 (26 Nov 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 244 n.24); JCSM-711-68 to SecDef, 4 Dec 68 (derived from JCS 2472/389-1, 30 Nov 68), JMF 911/323 (26 Nov 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 244 n.24); CM-3805-68 to SecDef, 4 Dec 68, JMF 911/323 (26 Nov 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 244 n.24). Names: Nitze.'
