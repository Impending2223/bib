  - add:
      entry:
        id: cal.1967-03-23.vietnam-air-war
        when: Mar. 23
        date: '1967-03-23'
        thread: vietnam-air-war
        c: 'Sharp asks authority for spoiling attacks on the Hòa Lạc and Kép airfields before their MiGs can "seriously" interfere with Rolling Thunder: Hòa Lạc nearly complete, Kép recently improved. The Joint Chiefs put both into their proposal for Rolling Thunder 55.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 20. January to March, no American plane lost in 24 engagements with MiGs; eight lost to SAMs, 43 to antiaircraft guns (20). To check: CINCPAC to JCS, 230037Z Mar 67, JCS IN 83893 (cited by [[w.cosmas-joint-chiefs-of-staff]], 20 n.13); Telecon, NMCC to CINCPAC, 231816Z Mar 67, JMF9155 (18 Feb 65) ROLLING THUNDER 54, sec 15 (cited by [[w.cosmas-joint-chiefs-of-staff]], 20 n.13). Names: Sharp.'
        src:
          c: 218cde0d
          rows:
            - 'w.cosmas-joint-chiefs-of-staff 20: all'
            - 'via x.1967-03-23.cincpac-to-jcs-230037z-mar-67: all'
            - 'via x.1967-03-23.telecon-nmcc-to-cincpac-231816z-mar-67: all'
        tags: [name:sharp-u-s-grant]
      section: '196703'
  - add:
      entry:
        id: cal.1967-04-13.vietnam-air-war
        when: Apr. 13
        date: '1967-04-13'
        thread: vietnam-air-war
        c: Sharp to Wheeler, asking leave to strike all of North Vietnam's airfields, to drive the MiGs to fields in China, where they could be intercepted along the buffer zone. Hot pursuit into China, he grants, would not be allowed.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 20–21. To check: CINCPAC to JCS, 130432Z Apr 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 54, sec 15 (cited by [[w.cosmas-joint-chiefs-of-staff]], 21 n.14). See [[cal.1967-03-23.vietnam-air-war]]. Names: Sharp, Wheeler.'
        src:
          c: 866f0d27
          rows:
            - 'w.cosmas-joint-chiefs-of-staff 20–21: all'
            - 'via x.1967-04-13.cincpac-to-jcs-130432z-apr-67: all'
        tags: [name:sharp-u-s-grant, name:wheeler-earle]
      section: '196704'
