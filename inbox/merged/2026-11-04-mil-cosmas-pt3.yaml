        when: Sept. 25
        date: '1967-09-25'
        thread: vietnam-air-war
        c: After several MiG engagements, Johnson authorizes strikes on Phúc Yên. Two raids set for Sept. 28 cancelled before launch, Romania's Prime Minister being in Hanoi.
