        when: Apr. 18
        date: '1968-04-18'
        thread: vietnam
        c: 'MACV''s survey of the enemy''s lines of communication by the DMZ: a massive movement of equipment, supplies and men south; truck traffic in southern Laos and the panhandle near an all-time high, convoys of over 100 trucks; water traffic round Vinh the heaviest since 1965. The same day a Soviet suction dredge photographed at Haiphong.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 180. Photographs of Hanoi and Haiphong, Apr. 14–15: the key rail bridges repaired, the Doumer bypass on the Hanoi–Vinh line among them (180). To check: COMUSMACV to CINCPAC, 180508Z Apr 68, JCS IN 50236 (cited by [[w.cosmas-joint-chiefs-of-staff]], 180 n.23); CINCPAC to JCS, 272158Z Apr 68, JCS IN 71044 (cited by [[w.cosmas-joint-chiefs-of-staff]], 180 n.23); DIA Intelligence Bulletin (IB), 29 Apr 68, pp. S-l, 2 (cited by [[w.cosmas-joint-chiefs-of-staff]], 180 n.23); DIA IB, 24 Apr 68, p. A-3 (cited by [[w.cosmas-joint-chiefs-of-staff]], 180 n.24); IB, 25 Apr 68, p. A-6 (cited by [[w.cosmas-joint-chiefs-of-staff]], 180 n.24).'
