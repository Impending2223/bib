  - add:
      entry:
        id: cal.1967-05-29.vietnam-air-war
        when: May 29
        date: '1967-05-29'
        thread: vietnam-air-war
        c: 'Sharp to Wheeler: April and May have destroyed most of Hanoi''s major electric power, brought several key war-supporting industries to a standstill, hampered imports through Haiphong and on the railways from China. The air war the only way to carry the war home to the enemy. His list of targets inside the ten-mile Hanoi zone, asked by Wheeler May 25, not acted upon.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 26. To check: CINCPAC to JCS, 240120Z May 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 56, sec 17 (cited by [[w.cosmas-joint-chiefs-of-staff]], 26 n.31); JCS 3903-67 to CINCPAC, 25 May 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 56, sec 17 (cited by [[w.cosmas-joint-chiefs-of-staff]], 26 n.31); CINCPAC to JCS 290506Z May 67, JCS IN 40905 (cited by [[w.cosmas-joint-chiefs-of-staff]], 26 n.31); JCS 3903-67 to CINCPAC, 25 May 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 56, sec 17 (cited by [[w.cosmas-joint-chiefs-of-staff]], 26 n.32); CINCPAC to JCS, 290506Z May 67, JCS IN 40905 and 030424Z Jun 67, OCJCS File 091 Vietnam, Jun 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 26 n.32). See [[cal.1967-05-22.vietnam-air-war]]. Names: Sharp, Wheeler.'
