        when: June 22
        date: '1968-06-22'
        thread: vietnam-air-war
        c: Nitze approves for planning up to 1,800 B-52 sorties a month through December, to be reviewed within 60 days, and more B-52s in Thailand, the Thai government consenting. The review never takes place.
