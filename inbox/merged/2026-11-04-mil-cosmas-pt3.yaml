      section: '196709'
  - add:
      entry:
        id: cal.1967-09-27.vietnam-operations
        when: Sept. 27
        date: '1967-09-27'
        thread: vietnam-operations
        c: 'Westmoreland to the acting Chairman on the DMZ: September''s losses not out of line; no authority to invade the North, a combined attack out of the question before May or June. Barrier work stopped, an airstrip begun near Quảng Trị, two airborne battalions from the Joint General Staff. He asks B-52s at once to the maximum, 1,200 a month, more naval gunfire, MK-36s, the Program 5 units sooner, M-16s for the army.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 92–94. To check: COMUSMACV MAC 9056 to Actg CJCS, 270438Z Sep 67, OCJCS File 091 Vietnam Sep 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 94 n.14). See [[cal.1967-09-24.vietnam-operations]]. Names: Westmoreland.'
        src:
          c: d08e9cf1
          rows:
            - 'w.cosmas-joint-chiefs-of-staff 92–94: all'
            - 'via x.1967-09-27.comusmacv-mac-9056-to-actg-cjcs-270438z: all'
        tags: [name:westmoreland-william]
