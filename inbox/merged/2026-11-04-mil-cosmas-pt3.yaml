        date: '1967-07-20'
        thread: vietnam-air-war
        c: Johnson approves Rolling Thunder 57. Sixteen new fixed targets in the Hanoi–Haiphong area, eleven military support, four transportation, one air defense, from CINCPAC's list of 129; armed reconnaissance on chosen rail lines, roads and waterways inside the thirty-mile Hanoi restricted zone, not the ten-mile prohibited area.
