        date: '1967-09-10'
        thread: vietnam-air-war
        c: Cẩm Phả port struck, 31 sorties, severe damage. For two weeks in mid-September a Soviet ship at the docks bars strikes; Sharp's wish to hit a coal plant and a rail yard there regardless left to wait.
