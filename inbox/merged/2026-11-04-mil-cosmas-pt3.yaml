  - add:
      entry:
        id: cal.1967-11-08.vietnam-air-war
        when: Nov. 8
        date: '1967-11-08'
        thread: vietnam-air-war
        c: Johnson authorizes seventeen new targets round Hanoi and Haiphong, the air defense control facilities at Bạch Mai airfield, three shipyards in each city, rail yards, two plants and three POL sites. Stray bombs from the Bạch Mai raid kill an Indian sergeant of the International Control Commission in downtown Hanoi.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 82. Wheeler to Sharp: strike them in a "measured and deliberate manner" to keep the "noise level" down (82). Oct. 23–Nov. 20, 48 aircraft lost over North Vietnam, 39 in Route Package VI (83). To check: CJCS 9610-67 to CINCPAC, 8 Nov 67, OCJCS File 091 Vietnam Nov 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 82 n.39); Memo, DepDir for Ops, NMCC to SecDef, "Aircraft Losses over North Vietnam, 17-20 November 1967," 20 Nov 67, OCJCS File 091 Vietnam Nov 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 83 n.41). See [[cal.1967-10-23.vietnam]]. Names: Johnson, Wheeler, Sharp.'
