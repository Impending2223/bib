        date: '1967-03-02'
        thread: vietnam-air-war
        also: [laos]
        c: McNamara extends the Joint Chiefs' authority to approve Arc Light strikes to Laos and the DMZ south of the line, the embassies and the governments in Saigon and Vientiane to concur, Washington to have the targets 24 hours ahead. Mar. 3, the Chiefs delegate it to CINCPAC and CINCSAC.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 32. In practice MACV nominated the targets, approved "almost automatic[ally]" up the chain (32). To check: SecDef 7668 to JCS, 2 Mar 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 32 n.8); JCS 7757 to CINCPAC and CINCSAC, 3 Mar 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 32 n.8). Names: McNamara.'
