        when: Apr. 2
        date: '1968-04-02'
        thread: vietnam-air-war
        c: 'Goulding, at 4:50 p.m.: attacks go on "from the twentieth parallel just north of Thanh Hoa, south to the DMZ," the area freed holding almost 90 percent of the North''s people and three fourths of its land; 90 percent of the sorties within 60 miles of the DMZ, 2.3 percent near Thanh Hóa. Wheeler puts off the strike on the Thanh Hóa bridge set for Apr. 3, 48 hours.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 175. To check: DEF 5321 to CINCPAC et al., 2 Apr 68, OCJCS File 091 Vietnam (1-15 Apr 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 175 n.8); JCS 3652 to CINCPAC, 2 Apr 68, OCJCS File 091 Vietnam (1-15 Apr 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 175 n.9). See [[cal.1968-03-30.vietnam-air-war]]. Names: Goulding, Wheeler.'
