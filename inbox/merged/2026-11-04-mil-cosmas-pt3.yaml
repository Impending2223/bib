        when: July 21
        date: '1967-07-21'
        thread: vietnam
        c: McNamara withholds approval of the Army's plan of May 9 for a single common supply system in South Vietnam, for want of firmer requirements, the Army's capability there and an end to the services' disputes. Still in planning at the year's end.
