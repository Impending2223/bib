        when: Late Oct.–mid-Nov.
        date: 1968-10
        thread: vietnam-operations
        c: Abrams moves the 1st Cavalry Division from northern I Corps to III Corps, against an enemy concentration on the Cambodian border, to attack the bases and infiltration routes and forestall an offensive on Saigon. The move begun late in October, done by mid-November.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 238. Check: the day the move began. To check: COMUSMACV MAC 14472 to CINCPAC, 271008Z Oct 68, OCJCS File 091 Vietnam Oct 68. "1968 Year-End Review," II, p. 3-7 (cited by [[w.cosmas-joint-chiefs-of-staff]], 238 n.4); HQ USARPAC "Highlights of USARPAC Activities," Nov 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 238 n.4). Names: Abrams.'
