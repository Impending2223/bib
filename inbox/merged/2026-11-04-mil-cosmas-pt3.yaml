        when: Nov. 12
        date: '1968-11-12'
        thread: vietnam-operations
        c: Abrams reports the enemy using the southern half of the DMZ to fire on American positions, troops seen there; he has ordered his commanders to answer at once with fire. Nitze and others find it reasonable. His wish to operate up to the demarcation line refused by the Joint Chiefs, for Paris.
