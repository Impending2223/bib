  - add:
      entry:
        id: cal.1968-03-30.vietnam-air-war
        when: Mar. 30
        date: '1968-03-30'
        thread: vietnam-air-war
        c: 'Wheeler''s execute order to Sharp, the evening of Mar. 30: no Rolling Thunder strikes north of 20 degrees from 0800 Apr. 1, Saigon time (1900 Mar. 31 in Washington), two hours before the address; reconnaissance above the line, without armed escort. Another to Westmoreland: all possible offensive pressure in the South, Pegasus to begin Mar. 31.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 173–74. Sharp: "Again, I have been caught completely unaware of an impending major change of policy on the air war" (174). To check: JCS 3583 to CINCPAC, 1 Apr 68, OCJCS File 091 Vietnam (1-15 Apr 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 173 n.1); JCS 5145 to CINCPAC, 31 Mar 68, OCJCS File 091 Vietnam (1-15 Apr 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 173 n.1); JCS 5183 to CINCPAC and CINCSAC, 1 Apr 68, OCJCS File 091 Vietnam (1-15 Apr 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 173 n.1); JCS 3564 to COMUSMACV, 31 Mar 68, OCJCS File 091 Vietnam (14-31 Mar 68) (cited by [[w.cosmas-joint-chiefs-of-staff]], 174 n.3). Names: Wheeler, Sharp, Westmoreland.'
