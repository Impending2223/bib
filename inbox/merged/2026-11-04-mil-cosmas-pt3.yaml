  - add:
      entry:
        id: cal.1967-08-20.vietnam-air-war
        when: Aug. 20–22
        date: '1967-08-20'
        thread: vietnam-air-war
        also: [vietnam-pennsylvania]
        c: 'Sharp, after a stretch of bad weather, against the suspension: it would look like a de-escalation; let him strike Haiphong targets and Phúc Yên, to show Hanoi the United States not "vacillating." Refused, but authorized targets may be struck when the skies clear. Aug. 20 and the two days after, heavy bombing near Hanoi, Haiphong and the Chinese border. Hanoi cancels Marcovich''s and Aubrac''s visit, for the envoys'' safety.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 76. McNamara: "Once again, we had failed miserably to coordinate our diplomatic and military actions" (76, from his memoir). To check: JCS 3365 to CINCPAC, 090005Z Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 76 n.15); JCS 4091 to CINCPAC, 171459Z Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 76 n.15); JCS 4344 to CINCPAC, 191432Z Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 76 n.15); NMCC Memos for Record, 12 and 13 Aug 67, OCJCS File 091 Vietnam, Aug 67. , NMCC OPSUMs 195and 196-67, 21 and 22 Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 76 n.15). See [[cal.1967-08-19.vietnam-pennsylvania]]. Names: Sharp, Marcovich, Aubrac.'
