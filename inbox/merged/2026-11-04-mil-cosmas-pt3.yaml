  - add:
      entry:
        id: cal.1967-05-10.vietnam-air-war
        when: May 10
        date: '1967-05-10'
        thread: vietnam-air-war
        c: The Haiphong power plants struck again. Within a week the Hanoi plant authorized, two Walleye aircraft only, the strike to be done before May 20, for the British Foreign Secretary's visit to Moscow and the stand-down of May 23, Buddha's birthday.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 22. To check: NMCC OPSUM 110-67, 11 May 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 22 n.21); JCS 5404 to CINCPAC, 162108Z May 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 22 n.21); Fact Sheet, "Operation Hickory ," 16 May 67, OCJCS File 091 Vietnam, May 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 22 n.21). See [[cal.1967-04-22.vietnam-air-war]].'
