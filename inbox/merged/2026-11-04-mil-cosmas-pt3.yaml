  - add:
      entry:
        id: cal.1967-08-05.vietnam-air-war
        when: Aug. 5–6
        date: '1967-08-05'
        thread: vietnam-air-war
        c: Sharp lifts his own limits on strikes in the ten-mile Haiphong restricted zone, Aug. 5. Aug. 6 he asks for 19 targets in the Hanoi restricted zone and 10 in Haiphong's, both restricted zones ended, the prohibited areas cut to two miles round Hanoi and a small rectangle at Haiphong's center. Not granted.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 79. To check: CINCPAC to CJCS, 030123Z Aug 67, OCJCS File 091 Vietnam Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 79 n.29); CINCPAC to CJCS, 050244Z Aug 67, OCJCS File 091 Vietnam Aug 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 79 n.29); CINCPAC to CINCPACFLT and CINCPACAF, 052234Z Aug 67, JCS IN 95324 (cited by [[w.cosmas-joint-chiefs-of-staff]], 79 n.29); CINCPAC to JCS, 062347Z Aug 67, JCS IN 96713 (cited by [[w.cosmas-joint-chiefs-of-staff]], 79 n.29). Names: Sharp.'
