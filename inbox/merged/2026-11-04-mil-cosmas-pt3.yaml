        when: Apr. 8
        date: '1967-04-08'
        thread: vietnam
        c: McNamara approves for planning the forces the Joint Chiefs recommend for the linear barrier, less 531 men; authorized strength in South Vietnam up 7,522 spaces, offshore Navy strength 300.
