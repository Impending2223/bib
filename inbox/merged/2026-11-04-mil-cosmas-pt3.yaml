        when: Oct. 16
        date: '1967-10-16'
        thread: vietnam-force-levels
        c: New Zealand announces another infantry company, 150 to 170 men. It arrives in mid-December with the Australian battalion.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 99. At the year''s end 60,531 allied troops: 47,802 Koreans, 6,715 Australians, 2,205 Thais, 2,020 Filipinos, 522 New Zealanders, 31 Nationalist Chinese, 13 Spaniards (99). To check: COMUSMACV and CJGS, RVNAF, AB 142, "Combined Campaign Plan, 1967," 7 Nov 66, JMF 9155.3/3100 (7 Nov 66), sec 1A (cited by [[w.cosmas-joint-chiefs-of-staff]], 99 n.31); MACV Command History, 1967, II, p. 765 (cited by [[w.cosmas-joint-chiefs-of-staff]], 99 n.31); CINCPACCOMUSMACV, Report on the War in Vietnam, Jun 68, p. 296 (cited by [[w.cosmas-joint-chiefs-of-staff]], 99 n.31).'
