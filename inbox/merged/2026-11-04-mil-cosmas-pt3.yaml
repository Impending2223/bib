          rows:
            - 'w.cosmas-joint-chiefs-of-staff 91: all'
            - 'via x.1967-09-22.memo-cmc-to-pres-situation-in-the: all'
        tags: [name:johnson-lyndon-b, name:greene-wallace-m-jr]
      section: '196709'
  - add:
      entry:
        id: cal.1967-09-24.vietnam-operations
        when: Sept. 24–25
        date: '1967-09-24'
        thread: vietnam-operations
        c: 'Greene to the Joint Chiefs: the Marines'' losses on the DMZ "too high, considering the operational benefits received"; two regiments more and more air and naval gunfire north of the line. Sept. 25 the Chiefs ask Sharp and Westmoreland what would help.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 92. To check: CMCM 31-67 to JCS, 24 Sep 67, Art to JCS 2472/158, JMF 911/321 (22 Sep 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 92 n.12); JCS 7987 to CINCPAC and COMUSMACV, 25 Sep 67, OCJCS File 091 Vietnam Sep 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 92 n.13); Not to Control Div, "CMCM-31-67...," 25 Sep 67, JMF 911/321 (22 Sep 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 92 n.13). See [[cal.1967-09-21.vietnam-operations]]. Names: Greene, Sharp, Westmoreland.'
        src:
          c: b5da9327
          rows:
            - 'w.cosmas-joint-chiefs-of-staff 92: all'
            - 'via x.1967-09-24.cmcm-31-67-to-jcs-24-sep: all'
            - 'via x.1967-09-25.jcs-7987-to-cincpac-and-comusmacv-25: all'
            - 'via x.1967-09-25.not-to-control-div-cmcm-31-67: all'
