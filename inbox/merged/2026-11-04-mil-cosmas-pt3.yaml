        c: Kép and Hòa Lạc struck again; sixteen MiGs destroyed on the ground.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 21. Seven American planes lost to MiGs in April (21). To check: NMCC OPSUMs 95-67 through 100-67, 24 through 29 Apr 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 21 n.16); CINCPAC ROLLING THUNDER Digest, Apr-Jun 67, JMF 912/323 (10 Feb 67), sec ID (cited by [[w.cosmas-joint-chiefs-of-staff]], 21 n.16); CINCPAC to JCS, 300055Z Apr 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 55, sec 16 (cited by [[w.cosmas-joint-chiefs-of-staff]], 21 n.16); JCS 3223-67 to CINCPAC, 2 May 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 55, sec 16 (cited by [[w.cosmas-joint-chiefs-of-staff]], 21 n.16). See [[cal.1967-04-24.vietnam-air-war]].'
