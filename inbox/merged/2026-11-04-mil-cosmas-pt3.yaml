  - add:
      entry:
        id: cal.1968-01-16.vietnam-air-war
        when: Jan. 16
        date: '1968-01-16'
        thread: vietnam-air-war
        c: Johnson orders a five-mile prohibited area round Haiphong, against Sharp's protest of Jan. 15 ("We seem determined to ease the pressure on the enemy at a time when our long bombing campaign is having a telling effect"). Six targets added to the list; none struck by the month's end, for weather.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 84. To check: CINCPAC to CJCS, 150705Z Jan 68, OCJCS File 091 Vietnam Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.45); JCS 7402 to CINCPAC, 162247Z Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.46); CJCS 00489-68 to CINCPAC, Jan 68, OCJCS File 091 Vietnam Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.46). See [[cal.1968-01-04.vietnam-air-war]]. Names: Johnson, Sharp.'
