        id: cal.1967-08-19.vietnam
        when: Aug. 19
        date: '1967-08-19'
        thread: vietnam
        c: The Joint Chiefs ask McNamara to seek State's and AID's agreement to take from MACV the handling of AID's Central Purchasing Authority cargoes, Saigon's port being cleared. The agencies agree; Aug. 29 Saigon told to draft the turnover.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 100. By the end of June ship turnaround at Saigon down from 89 days to seven; in 1967 the port capacity of the two northern provinces from 540 to 5,500 short tons a day (100). To check: JCSM-458-67 to SecDef, 19 Aug 67 (derived from JCS 2472/130), JMF 911/479 (7 Aug 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 100 n.33); DEF 5000 to Saigon, 29 Aug 67, JMF 911/479 (7 Aug 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 100 n.33); Memo, Acting VD/JS to ASD (I&L), 18 Jul 68, Att to JCS 2472/330, 20 Jul 68, JMF 911/479 (7 Aug 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 100 n.33); MACV Command History, 1967, II, p. 816 (cited by [[w.cosmas-joint-chiefs-of-staff]], 100 n.33). Names: McNamara.'
