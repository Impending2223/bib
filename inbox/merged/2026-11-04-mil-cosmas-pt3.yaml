        c: Sharp gives the Doumer railroad and highway bridge, the choke point for all rail traffic from China to Hanoi and south, the highest strike priority, the river below it to be seeded with mines. The bridges and the power plant hit within three days; most of the other targets of Oct. 23 not until November, some not in 1967.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 82. To check: CINCPAC to CINCPACAF et al, 252248Z Oct 67, OCJCS File 091 Vietnam Oct 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 82 n.38); NMCC OPSUMs 249-67 through 1-68, 24 Oct 67 through 2 Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 82 n.38). See [[cal.1967-10-23.vietnam]]. Names: Sharp.'
