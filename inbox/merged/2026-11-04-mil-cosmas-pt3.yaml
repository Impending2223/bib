        id: cal.1967-08-30.vietnam-air-war
        when: Aug. 30
        date: '1967-08-30'
        thread: vietnam-air-war
        c: Johnson authorizes strikes on targets inside the Haiphong rings, with more Sept. 5, eight in all. By Sept. 27, 177 sorties against six; all eight struck by Oct. 13.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 79. DIA: late in September the lines from Haiphong could clear 4,300 short tons a day, against 9,700 in May (79). To check: JCS 5480 to CINCPAC, 052113Z Sep 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 79 n.30); NMCC OPSUMs 204-67 through 227-67, 31 Aug through 28 Sep 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 79 n.30); DIA to CJCS et al, Fact Sheet, "Haiphong Port Clearance," 27 Sep 67, OCJCS File 091 Vietnam Sep 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 79 n.30); CINCPAC to JCS, 120157Z Oct 67, JCS IN 39404 (cited by [[w.cosmas-joint-chiefs-of-staff]], 79 n.30). Names: Johnson.'
