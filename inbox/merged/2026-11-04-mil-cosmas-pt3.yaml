        c: McNamara, holding to the barrier's date of Nov. 1, starts State's negotiations with Laos and Thailand for Practice Nine's bases and wider Prairie Fire, and approves for planning the forces, less nearly 1,800 spaces; Nam Phong refused.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 42–43. To check: Memo, SecDef to CJCS, 22 Apr 67, att to JCS 2471/11-2, 28 Apr 67, JMF 911/321 (9 Jan 67), sees 6 and 7 (cited by [[w.cosmas-joint-chiefs-of-staff]], 43 n.30); Memo, SecDef to CJCS, 8 May 67, att to JCS 2471/11-3, 10 May 67, JMF 911/321 (9 Jan 67), sees 6 and 7 (cited by [[w.cosmas-joint-chiefs-of-staff]], 43 n.30); JCSM-400-67 to SecDef, 15 Jul 67 (derived from JCS 2471/11-5), JMF 911/321 (9 Jan 67), sees 6 and 7 (cited by [[w.cosmas-joint-chiefs-of-staff]], 43 n.30); Memo, SecDef to CJCS, 25 Jul 67, att to JCS 2471/11-6, 27 Jul 67, JMF 911/321 (9 Jan 67), sees 6 and 7 (cited by [[w.cosmas-joint-chiefs-of-staff]], 43 n.30). See [[cal.1967-04-17.vietnam-2]]. Names: McNamara.'
