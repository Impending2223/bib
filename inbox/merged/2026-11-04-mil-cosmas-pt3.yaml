        when: Feb. 13–15
        date: '1968-02-13'
        thread: vietnam-205000
        c: 'J-5''s report on the mobilization the emergency reinforcement requires, approved by the Joint Chiefs the day they get it and sent to McNamara: two Army infantry brigades, a Marine regiment, a Marine aircraft group, two Navy construction battalions, 46,300 reservists at once, 137,000 more readied. Feb. 15 the Chiefs: more troops only when Westmoreland asks, but no delay in the call-up.'
