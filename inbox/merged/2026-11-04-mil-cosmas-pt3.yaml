        when: Sept. 30
        date: '1968-09-30'
        thread: vietnam
        c: 'MACV and the Joint General Staff issue the Combined Campaign Plan for 1969, AB 144: "no functional separation of responsibilities" between the South Vietnamese and the allies in the main-force war, the cities and pacification; the South Vietnamese divisions to turn to the main forces, the Regional and Popular Forces to take over pacification support as they improve.'
