        when: Dec. 24–25
        date: '1968-12-24'
        thread: vietnam
        c: A 24-hour Christmas truce, 6 p.m. Dec. 24 to 6 p.m. Dec. 25, Saigon time, over COMUSMACV's and CINCPAC's opposition. For the Viet Cong's New Year truce, Dec. 30 to Jan. 2, none by the allies.
