        id: cal.1967-10-07.vietnam-force-levels
        when: Oct. 7
        date: '1967-10-07'
        thread: vietnam-force-levels
        c: McNamara approves MACV's plan for South Vietnam's forces in fiscal 1968, 685,739, Westmoreland's figure since July (678,728 in April). Of the 63,586 more, 14,966 to the army, 47,839 to the Regional and Popular Forces; 2,243 more American advisers; $10.2 million once, $47.5 million a year, on the Army.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 111. To check: COMUSMACV to CINCPAC, 261145Z Apr 67, JCS IN 62616 (cited by [[w.cosmas-joint-chiefs-of-staff]], 111 n.19); COMUSMACV to CINCPAC, 261220Z Jul 67, JCS IN 75415 (cited by [[w.cosmas-joint-chiefs-of-staff]], 111 n.19); App A to JCSM-630-67 to SecDef, 28 Sep 67 (derived from JCS 2472/151), 20 Sep 67, JMF 911/535 (26 Jul 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 111 n.19); JCSM-630-67 to SecDef, 28 Sep 67 (derived from JCS 2472/151, 20 Sep 67), JMF 911/535 (26 Jul 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 111 n.20); Memo, SecDef to CJCS, 7 Oct 67, Att to JCS 2472/151-1, 11 Oct 67, JMF 911/535 (26 Jul 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 111 n.20); JCS 8670 to CINCPAC, 112108Z Oct 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 111 n.20). Names: McNamara, Westmoreland.'
