        date: '1968-11-20'
        thread: vietnam-operations
        c: Johnson and his senior advisers, at the Tuesday lunch, agree to Abrams's squad patrols into the southern half of the DMZ, to watch the enemy and take prisoners; Clifford approves them for Nov. 24 to Dec. 3. Two days in, soldiers plainly from North Vietnamese units captured. Extended after; larger forces refused but for extracting a patrol.
