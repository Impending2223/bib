patch: 2026-11-04-mil-cosmas-pt3
by: Claude (the military re-read, group jcs, Nov. 4-5, 2026), from Cosmas, JCS and the War in Vietnam, pt. 3
ops:
  - add:
      entry:
        id: cal.1966-11-11.vietnam-air-war
        when: Nov. 11
        date: '1966-11-11'
        thread: vietnam-air-war
        also: [vietnam-marigold]
        c: Rolling Thunder 52 approved, twelve targets within ten miles of Hanoi and Haiphong. The same day Johnson withdraws authority for further strikes of the program near Hanoi, not to "rock the boat" during Brown's visit to Moscow.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 9. Check: FRUS''s editorial note has the targets near Hanoi authorized Nov. 10 ([[cal.1966-12-02.vietnam-marigold]]). Names: Johnson.'
        src:
          c: 66e94adc
          rows:
            - 'w.cosmas-joint-chiefs-of-staff 9: all'
        tags: [name:johnson-lyndon-b]
      section: '196611'
  - cite:
      id: cal.1966-12-02.vietnam-marigold
      item: '[[w.cosmas-joint-chiefs-of-staff]], 9 (Rolling Thunder 52, approved Nov. 11, twelve targets within ten miles of Hanoi and Haiphong, held back by the weather; strikes within five miles of the center Dec. 2 and 4; Rapacki''s complaint to Gronouski Dec. 5)'
      units: A-B
  - add:
      entry:
        id: cal.1966-12-13.vietnam-air-war
        when: Dec. 13–14
        date: '1966-12-13'
        thread: vietnam-air-war
        also: [vietnam-marigold]
        c: The skies clear over Hanoi; strikes near the city resumed Dec. 13 and 14, after none on North Vietnam for weather Dec. 5–12. Rapacki tells Gronouski Dec. 13 that the North Vietnamese will not now talk in Warsaw.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 9–10. See [[cal.1966-12-02.vietnam-marigold]]. Names: Rapacki, Gronouski.'
        src:
          c: e6eeef2a
          rows:
            - 'w.cosmas-joint-chiefs-of-staff 9–10: all'
        tags: [name:rapacki-adam, name:gronouski-john-a, place:hanoi]
      section: '196612'
