  - add:
      entry:
        id: cal.1967-10-14.vietnam-air-war
        when: Oct. 14
        date: '1967-10-14'
        thread: vietnam-air-war
        c: 'The Joint Chiefs to McNamara, after McConnell''s report of Oct. 4 that the Air Force could reach 1,200 B-52 sorties a month by December: keep 800, with a surge to 1,200 ready, nine more B-52s on Guam and nineteen on 72 hours'' notice; at U Tapao 30 instead of 15, to save $3.5 million a month.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 95–96. To check: CSAFM R-10-67 to JCS, 4 Oct 67, Att to JCS 2472/166, 4 Oct 67, JMF 907/323 (4 Oct 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 95 n.19); JCSM-55-4-67 to SecDef, 14 Oct 67 (derived from JCS 2477/166-5), JMF 907/323 (4 Oct 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 96 n.20); Memo, SecDef to SecAF, CJCS, ASD(ISA), 10 Nov 67, Att to JCS 2472/166-7, 14 Nov 67, JMF 907/323 (4 Oct 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 96 n.20). Names: McNamara, McConnell.'
        src:
          c: 5bb938c5
          rows:
