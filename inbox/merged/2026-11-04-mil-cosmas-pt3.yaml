      units: A
  - add:
      entry:
        id: cal.1967-01-18.vietnam-air-war
        when: Jan. 18
        date: '1967-01-18'
        thread: vietnam-air-war
        c: 'Sharp''s plan to the Joint Chiefs for Route Package VI: steady pressure on six target systems, electric power, war-supporting industry, transportation, military complexes, petroleum, Haiphong and the other ports, to destroy the North''s "war making potential"; "general disruption" enough.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 18. To check: CINCPAC to JCS, 02224Z Feb 67, OCJCS File 091 Vietnam, Feb 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 18 n.3); CINCPAC to JCS, 182210Z Jan 67, JCS IN 53524 (cited by [[w.cosmas-joint-chiefs-of-staff]], 18 n.3). Names: Sharp.'
        src:
          c: dd490e9c
          rows:
            - 'w.cosmas-joint-chiefs-of-staff 18: all'
            - 'via x.1967-02.cincpac-to-jcs-02224z-feb-67: all'
            - 'via x.1967-01-18.cincpac-to-jcs-182210z-jan-67: all'
        tags: [name:sharp-u-s-grant]
      section: '196701'
  - cite:
      id: cal.1967-02-13.vietnam-air-war
      item: '[[w.cosmas-joint-chiefs-of-staff]], 17 (the resumption, a day after the Tet stand-down)'
      units: A
  - cite:
      id: cal.1967-02-17.vietnam
      item: '[[w.cosmas-joint-chiefs-of-staff]], 18 (Wheeler for striking the power net, "even to the point of destroying the entire system")'
      units: B
  - src:
      id: cal.1967-02-17.vietnam
      rows:
        - 'via x.1967-02-18.wheeler-to-sharp-and-westmoreland-jcs: B'
  - add:
      entry:
        id: cal.1967-02-23.vietnam-air-war
        when: Feb. 23
        date: '1967-02-23'
        thread: vietnam-air-war
        c: Rolling Thunder 54 approved, ten days after the resumption. Five new targets, four thermal power plants and the Thái Nguyên steel plant, and the targets of 53 not yet struck, six of nine; sorties a month from 13,200 to 14,500. Three more power plants, the Hanoi transformer station and the Haiphong cement plant, asked by the Joint Chiefs, refused.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 18–19. With it Sea Dragon to the 20th parallel, the mining of inland waterways, naval gunfire on shore targets, and artillery from the South at targets north of the DMZ (19): [[cal.1967-02-23.vietnam]]. Check: Cosmas dates the approval Feb. 22 at 35; the execute message, JCS 6955, is of 230308Z Feb. 67. To check: JCS 6955 to CINCPAC, 230308Z Feb 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 18 n.6); Memo, J-3 to CJCS, ROLLING THUNDER with draft execute message, 21 Feb 67, same file (cited by [[w.cosmas-joint-chiefs-of-staff]], 18 n.6). Names: Johnson.'
        src:
          c: 941047fc
          rows:
            - 'w.cosmas-joint-chiefs-of-staff 18–19: all'
            - 'via x.1967-02-23.jcs-6955-to-cincpac-230308z-feb-67: all'
            - 'via x.1967-02-21.memo-j-3-to-cjcs-rolling-thunder: all'
        tags: [name:johnson-lyndon-b]
      section: '196702'
  - cite:
      id: cal.1967-02-23.vietnam
      item: '[[w.cosmas-joint-chiefs-of-staff]], 19 (Sea Dragon to 20 degrees, with Rolling Thunder 54)'
      units: B
  - add:
      entry:
        id: cal.1967-03-22.vietnam-air-war
        when: Mar. 22
        date: '1967-03-22'
        thread: vietnam-air-war
        c: With Johnson's approval, the Joint Chiefs add the two Haiphong thermal power plants to Rolling Thunder 54's list, civilian casualties and damage to foreign shipping to be kept down. Not struck until Apr. 20.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 19–20. To check: NMCC OPSUMs 46-67 through 95-67, 25 Feb through 24 Apr 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 54, sec. 15 (cited by [[w.cosmas-joint-chiefs-of-staff]], 19 n.10); Telecon, NMCC to CINCPAC, 171840Z Mar 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 54, sec. 15 (cited by [[w.cosmas-joint-chiefs-of-staff]], 19 n.10); JCS 9614 to CINCPAC, 222314Z Mar 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 54, sec. 15 (cited by [[w.cosmas-joint-chiefs-of-staff]], 19 n.10); JCS 2601-67 to CINCPAC, 10 Apr 67, JMF 9155 (18 Feb 65) ROLLING THUNDER 54, sec. 15 (cited by [[w.cosmas-joint-chiefs-of-staff]], 19 n.10). See [[cal.1967-02-23.vietnam-air-war]]. Names: Johnson.'
