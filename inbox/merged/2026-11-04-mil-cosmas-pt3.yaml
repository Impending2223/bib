  - add:
      entry:
        id: cal.1968-04-04.laos
        when: Apr. 4
        date: '1968-04-04'
        thread: laos
        also: [vietnam-air-war]
        c: Radio Hanoi charges that three waves of American aircraft bombed populated areas of Lai Châu, on the Laotian border far above the 20th parallel, Apr. 3. The Joint Chiefs find no American mission there; Souvanna denies his planes did it. The same day the Chiefs stop Barrel Roll strikes in the parts of Laos bordering northwestern North Vietnam; elsewhere above the 19th, only under forward air control.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 177. Clifford asserts American innocence at his press conference, Apr. 8 (177). To check: CM-3189-68 to SecDef, 8 Apr 68, OCJCS File 091 Vietnam (1-15 Apr 68). "Summary Chronology - Operation CROCODILE," p. 6 (cited by [[w.cosmas-joint-chiefs-of-staff]], 177 n.14); CINCPAC HWA 1213 to CJCS, 13 Apr 68, OCJCS File 091 Vietnam (1-15 Apr 68). "Summary Chronology - Operation CROCODILE," p. 6 (cited by [[w.cosmas-joint-chiefs-of-staff]], 177 n.14); JCS 5540, 5617, and 5686 to CINCPAC et al., 4, 5, and 6 Apr 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 177 n.15); VIENTIANE 5814 to CINCPAC, 12 Apr 68, JCS IN 39897 (cited by [[w.cosmas-joint-chiefs-of-staff]], 177 n.15). Names: Souvanna Phouma, Clifford.'
