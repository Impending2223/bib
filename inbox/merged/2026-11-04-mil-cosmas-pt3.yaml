  - add:
      entry:
        id: cal.1967-09-21.vietnam-operations
        when: Sept. 21–22
        date: '1967-09-21'
        thread: vietnam-operations
        c: 'Johnson asks Greene, the Marine Commandant, outside the chain of command, his view of the DMZ. Greene to Johnson, Sept. 22: the Marines "not supinely enduring," but the situation "not to our liking"; attack north, more forces on the line, or a mobile defense farther south, all "under active consideration."'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 91. To check: Memo, CMC to Pres, "Situation in the Area of the Vietnam Demilitarized Zone," 22 Sep 67, JMF 911/321 (22 Sep 67) (cited by [[w.cosmas-joint-chiefs-of-staff]], 91 n.11). See [[cal.1967-09.vietnam]]. Names: Johnson, Greene.'
