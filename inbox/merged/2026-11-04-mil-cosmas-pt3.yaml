  - add:
      entry:
        id: cal.1968-12-24.vietnam-2
        when: Dec. 24
        date: '1968-12-24'
        thread: vietnam
        c: 'McCain to Johnson, at his asking, on the enemy since the halt: the logistic center of gravity moved south, new depots near the DMZ; "the enemy has the capability of dramatically increasing his forces in northern South Vietnam in a matter of approximately two weeks rather than about two months as in the past"; 85mm and 100mm antiaircraft ammunition moving into Laos and South Vietnam.'
        n: '[[w.cosmas-joint-chiefs-of-staff]], 252. To check: CINCPAC to CJCS, 240620Z Dec 68, OCJCS File 091 Vietnam Dec 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 252 n.50). Names: McCain, Johnson.'
        src:
