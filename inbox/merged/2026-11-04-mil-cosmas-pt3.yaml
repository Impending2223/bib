        when: Feb. 25
        date: '1967-02-25'
        thread: laos
        c: The Joint Chiefs widen Shining Brass's zone, the cross-border forays into Laos by teams of irregulars under Special Forces, to more of eastern Laos. Renamed Prairie Fire from Mar. 1.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 98. In 1967 an average of 3,219 attack sorties a month in the Steel Tiger and Tiger Hound areas (98). To check: CINCPAC Command History, 1967, II, pp. 741-745 (cited by [[w.cosmas-joint-chiefs-of-staff]], 98 n.28); JCS 7248 to CINCPAC, 251907Z Feb 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 98 n.28); JCS 6319 to CINCSAC et al., 142123Z Feb 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 98 n.28).'
