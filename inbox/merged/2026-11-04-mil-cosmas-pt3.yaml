        when: Mar. 15
        date: '1967-03-15'
        thread: vietnam-force-levels
        c: 'Saigon. MACV''s conference gives final approval to the Thai force worked out by American and Thai officers in Bangkok: a regimental combat team of 2,207, four rifle companies, a field artillery battery, supporting elements. Thailand had offered it Dec. 30, 1966; New Zealand a rifle company more, Mar. 7.'
