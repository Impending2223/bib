        c: 'Westmoreland asks CINCPAC to put off the strongpoint obstacle system indefinitely, Sept. 16, Cushman foreseeing 450 killed and 3,000 wounded by Nov. 1 on schedule; Sharp concurs Sept. 18. The Joint Chiefs, Sept. 19: the whole system thirty days later; McConnell, acting Chairman, tells McNamara Sept. 22.'
