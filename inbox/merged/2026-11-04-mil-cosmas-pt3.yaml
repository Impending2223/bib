        date: '1967-09-01'
        thread: vietnam-air-war
        also: [vietnam-pennsylvania]
        c: Johnson extends the suspension near Hanoi indefinitely, for Pennsylvania. Sept. 20 Sharp urges it lifted, and Phúc Yên and Bạch Mai struck; Wheeler with the Chiefs presses McNamara, Sept. 21, with fifteen targets in the prohibited zone. McNamara refuses both.
