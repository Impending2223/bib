      entry:
        id: cal.1967-10-04.vietnam-force-levels
        when: Oct. 4
        date: '1967-10-04'
        thread: vietnam-force-levels
        c: McNamara approves 5,000 M-16s at once from the Army's depots for chosen South Vietnamese units, on Westmoreland's request of Aug. 28 for 105,705 and 3,005 more. Oct. 24 he approves the Joint Materiel Priorities and Allocations Board's schedule of Oct. 12, the remaining 103,710 by Sept. 30, 1968.
