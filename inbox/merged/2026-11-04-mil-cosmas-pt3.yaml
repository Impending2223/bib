        thread: vietnam
        c: 'The Joint Chiefs to McNamara: put off executing the barrier plan to about Apr. 1, 1968; meanwhile approvals for Practice Nine''s construction and wider Prairie Fire operations, the forces added to Program 4, the funds allocated.'
