  - add:
      entry:
        id: cal.1967-05-22.vietnam-operations
        when: May 22
        date: '1967-05-22'
        thread: vietnam-operations
        c: The Joint Chiefs direct CINCPAC to begin Daniel Boone, clandestine reconnaissance in eastern Cambodia by Special Forces–led teams, a few a month. The State-Defense-CIA Study Group for Cambodia, of Dec. 21, 1966, had urged it, reconnaissance only, with a chiefly diplomatic course and against hot pursuit; State and Defense approved May 9 and 17, and Johnson.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 98. To check: Initial Rept, Jt State-Def-CIA Study Gp for Cambodia, n.d., JMF 9155 (1 Feb 66), sec. 1A (cited by [[w.cosmas-joint-chiefs-of-staff]], 98 n.29); Ltr, USecState to DepSecDef, 9 May 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 98 n.29); Memo, ASD (ISA) to DepSecDef, 15 May 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 98 n.29); Ltr, DepSecDef to USecState, 17 May 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 98 n.29); Att to JCS 2343/820-6, 24 May 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 98 n.29); JCS 5937 to CINCPAC, 221958Z May 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 98 n.29). Names: Johnson.'
