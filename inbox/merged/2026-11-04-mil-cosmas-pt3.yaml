        date: '1967-06-08'
        thread: vietnam
        c: The Joint Chiefs again doubt the barrier's cost and timing; if McNamara executes it, CINCPAC and COMUSMACV to have the widest latitude with its resources. Wheeler, dissenting, for leaving Westmoreland to use them as he needs.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 43. To check: JCSM-322-67 to SecDef, 8 Jun 67, end A to JCS 2471/3-9, 8 Jun 67, JMF 911/321 (9 Jan 67), sec 7 (cited by [[w.cosmas-joint-chiefs-of-staff]], 43 n.31). See [[cal.1967-04-17.vietnam-2]]. Names: McNamara, Wheeler, Westmoreland.'
