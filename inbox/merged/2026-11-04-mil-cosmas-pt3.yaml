      entry:
        id: cal.1968-01-04.vietnam-air-war
        when: Jan. 4
        date: '1968-01-04'
        thread: vietnam-air-war
        also: [soviet-union]
        c: Seeding an approach to Haiphong with MK-36s, an American plane by a map error drops its load too soon, narrowly missing a Soviet ship. Wheeler warns Sharp a five-mile prohibited zone round Haiphong may follow; strikes in the port area only in good weather, few planes close in.
