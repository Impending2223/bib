  - add:
      entry:
        id: cal.1967-05-02.vietnam-air-war
        when: May 2
        date: '1967-05-02'
        thread: vietnam-air-war
        c: CINCPAC's authority for Rolling Thunder 56. Ten targets in the northeast quadrant, four of them restrikes, the two Haiphong power plants until destroyed among them; three barracks in crowded areas, a SAM depot, a storage site; the Kiến An airfield with those of 55. Seven targets more asked by the Joint Chiefs refused, the Hanoi thermal power plant the chief.
        n: '[[w.cosmas-joint-chiefs-of-staff]], 22. To check: JCS 4255 to CINCPAC, 022248Z May 67 (cited by [[w.cosmas-joint-chiefs-of-staff]], 22 n.19); Draft Execute Msg, JCS to CINCPAC, Tab 2A, JMF 9155 (18 Feb 65) ROLLING THUNDER 56, sec 17 (cited by [[w.cosmas-joint-chiefs-of-staff]], 22 n.19). See [[cal.1967-04-22.vietnam-air-war]].'
