- add:
    entry:
      id: cal.1965-08-21.defense-2
      when: Aug. 21
      date: '1965-08-21'
      thread: defense
      also:
      - court
      c: 'Saturday morning, on the veto: Ramsey Clark, Vance, McPherson, Sanders, Clifford and Justice Fortas. Vance, and
        McNamara: the Pentagon could not be run; Clark and McPherson: probably unconstitutional; Fortas: clearly so, and the
        Court would find it. A compromise of sixty days'' notice; the staff calls the Congress; Fortas, Clifford, Clark and
        Califano finish the message. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 95–96. The veto: [[cal.1965-08-21.defense]]. Names: Ramsey Clark, Vance,
        McPherson, Sanders, Clifford, Fortas, McNamara, Califano.'
