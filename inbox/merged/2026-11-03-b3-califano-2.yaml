      c: 'McNamara, Fowler, Wirtz, Connor, Schultze, Ackley, Clifford and Califano initial a memorandum recommending the surcharge,
        5:30 p.m.; Clifford: "Does he want it notarized and sworn to?" The Cabinet reads the State of the Union one by one
        in Califano''s office, Fowler alone the tax section, Connor and Wirtz the merger of their departments.'
      n: '[[w.califano-triumph-and-tragedy-of]], 182. To check: their memorandum to Johnson, Jan. 9, 1967, 5:30 p.m., LBJ
        Library (cited by [[w.califano-triumph-and-tragedy-of]], 182 n.15). Names: McNamara, Fowler, Wirtz, Connor, Schultze,
        Ackley, Clifford, Califano.'
