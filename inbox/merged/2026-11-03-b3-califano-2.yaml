- add:
    entry:
      id: cal.1968-06-06.robert-kennedy-campaign
      when: June 6
      date: '1968-06-06'
      thread: robert-kennedy-campaign
      also:
      - crime-and-hijacking-guns
      c: 'At 1 a.m., dinner in the mansion with Temple, Christian, McPherson and Califano, Johnson asking the Secret Service
        by the telephone under the table, "Is he dead yet?" Word at 5:01 a.m.; the proclamation for Sunday, June 9; the burial
        site near the President''s, McNamara''s choice; at 4 p.m. the statement on guns taped, then taped again: "Too many
        lines in my face."'
      n: '[[w.califano-triumph-and-tragedy-of]], 299–300. Names: Johnson, Temple, Christian, McPherson, Califano, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:temple-larry
      - name:christian-george
      - name:mcpherson-harry
      - name:califano-joseph-a-jr
      - name:mcnamara-robert-s
      src:
