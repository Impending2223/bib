- add:
    entry:
      id: cal.1965-08-28.steel
      when: Aug. 28
      date: '1965-08-28'
      thread: steel
      c: 'Saturday afternoon. Califano briefs Morse and Collins at the White House. Morse: "The fact that I''m opposed to
        the war doesn''t mean that I''d take a personal advantage of it." Johnson means him to chair a Taft-Hartley board
        if it comes to that. After midnight, Califano to Johnson: no progress in Pittsburgh. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 89–90. To check: Califano to Johnson, Aug. 30, 1965, 2:45 a.m., LBJ Library
        (cited by [[w.califano-triumph-and-tragedy-of]], 90 n.14). Names: Califano, Morse, Collins, Johnson.'
      tags:
