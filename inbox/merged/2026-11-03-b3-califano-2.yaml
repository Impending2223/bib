        - 'via w.califano-triumph-and-tragedy-of 17 n.1: all'
- add:
    entry:
      id: cal.1964-11-10.transition-and-staff
      when: Nov. 10
      date: '1964-11-10'
      thread: transition-and-staff
      c: 'McNamara, back from the LBJ Ranch, to Califano: he is not going to the White House, "At least for now." By Califano''s
        account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 18. Check: the day; McNamara at the Ranch Nov. 9–10 by the Daily Diary (18
        n.4). See [[cal.1964-11-04.transition-and-staff]]. Names: McNamara, Califano.'
      tags:
      - name:mcnamara-robert-s
