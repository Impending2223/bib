- add:
    entry:
      id: cal.1965-08-14.civil-disorders-watts
      when: Aug. 14
      date: '1965-08-14'
      thread: civil-disorders-watts
      c: 'Saturday. Johnson at the Ranch, not taking Califano''s calls since the 13th. Abrams asks to supply and fly the California
        Guard; McNamara and Katzenbach agree; Ramsey Clark drafts an order and proclamation for troops. Califano to Abrams:
        "You''ve got White House approval." Valenti''s note to Johnson; Johnson by telephone, 9:09 p.m.: "Not one of our people
        sets foot there until you talk to me." By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 59–61. To check: Valenti to Johnson, Aug. 14, 1965, 6:25 p.m., and Califano
        to Valenti, Aug. 14, 1965, 11:52 p.m., LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 61 n.16, 60 n.14);
        *Military Support of Law Enforcement During Civil Disturbances: A Report Concerning the California National Guard''s
        Part in Suppressing the Los Angeles Riot—August 1965*, 28 (cited by [[w.califano-triumph-and-tragedy-of]], 60 n.13).
        See [[cal.1965-08-11.states-and-cities]]. Names: Johnson, Califano, Abrams, McNamara, Katzenbach, Ramsey Clark, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:abrams-creighton
      - name:mcnamara-robert-s
      - name:katzenbach-nicholas
