      when: Sept. 1
      date: '1965-09-01'
      thread: steel
      c: 'Clifford to Califano: the companies would raise their offer for selective price increases where Japan does not compete.
        Wirtz: the union thinks they would if the administration would "wink"; Dillon, close to Blough, the same. Johnson:
        "No price increase. None. Zero." Clifford and Connor to "turn him upside down and shake him."'
      n: '[[w.califano-triumph-and-tragedy-of]], 92. Check: the day, "On Wednesday." Names: Clifford, Califano, Wirtz, Dillon,
        Blough, Johnson, Connor.'
