      when: Jan. 11
      date: '1967-01-11'
      thread: labor
      c: 'Evening, the Cabinet Room: Johnson with Meany and the labor leaders over an hour on merging Labor and Commerce.
        Meany had committed to it in the Oval Office Jan. 5; the Executive Council fiercely against.'
      n: '[[w.califano-triumph-and-tragedy-of]], 185. Names: Johnson, Meany.'
