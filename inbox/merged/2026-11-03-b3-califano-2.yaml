- add:
    entry:
      id: cal.1967-07-19.civil-disorders-3
      when: July 19
      date: '1967-07-19'
      thread: civil-disorders
      also:
      - cities-and-housing
      c: 'The Cabinet: "When members complain about riots, ask them what they''re doing to build programs like model cities
        and rent supplements"; "We are not getting our story over"; a group under Humphrey on the cities. Then Wilkins and
        Whitney Young: "I''m a progressive. I''m not a liberal"; "You know the difference between cannibals and liberals?
        Cannibals eat only their enemies." That evening Califano''s summary of the task force on the cities: by 1983 the major
        cities 40 percent Negro and 40 percent poor.'
      n: '[[w.califano-triumph-and-tragedy-of]], 210–12. Names: Johnson, Humphrey, Wilkins, Whitney Young, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:wilkins-roy
      - name:young-whitney-m-jr
      - name:califano-joseph-a-jr
      src:
