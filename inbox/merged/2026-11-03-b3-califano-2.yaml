- add:
    entry:
      id: cal.1965-11-16.economy
      when: Nov. 16
      date: '1965-11-16'
      thread: economy
      c: The Cabinet group with Zimmerman in Califano's office on the copper program; Johnson stops by just before 8 p.m.
        to bless it.
