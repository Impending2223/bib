      when: Apr. 29
      date: '1968-04-29'
      thread: elections-1968
      also:
      - labor
      c: 'Reuther with Johnson an hour, Califano there: for Humphrey; involve him publicly in big decisions. Johnson: "There
        are fifteen states in the U.S. that can''t go with me ... I''ve spent my popularity"; "Do whatever you are going to
        do and put it on the line."'
      n: '[[w.califano-triumph-and-tragedy-of]], 293. Names: Reuther, Johnson, Califano, Humphrey.'
      tags:
