        - 'via w.califano-triumph-and-tragedy-of 24 n.10: A'
- add:
    entry:
      id: cal.1965-10-05.program
      when: Oct. 5
      date: '1965-10-05'
      thread: program
      c: 'A stag dinner at the White House for heads of Fortune 500 companies, Gregory Peck and Hugh O''Brian among the guests.
        Fowler explains the "speaker-writer": one at each table speaks to the President, the rest write him. One executive:
        the Cabinet looks tired, give them a month''s vacation; Johnson does not applaud. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 28–29. Names: Fowler, Johnson.'
      tags:
      - name:fowler-henry-h
      - name:johnson-lyndon-b
