- add:
    entry:
      id: cal.1967-12-30.economy
      when: Dec. 30
      date: '1967-12-30'
      thread: economy
      c: 'The Cedar Guest House at the Ranch, ten to three, lunch on trays: Rusk, Fowler, Trowbridge, Schultze, Rostow, Mills,
        Russell Long, Martin; the essentials of the balance-of-payments program. Califano to Washington to finish it.'
      n: '[[w.califano-triumph-and-tragedy-of]], 247. The program: [[cal.1968-01-01.economy]]. Names: Rusk, Fowler, Trowbridge,
        Schultze, Rostow, Mills, Russell Long, Martin, Califano.'
