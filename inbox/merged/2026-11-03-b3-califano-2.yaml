- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-17
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: 'Albert reads the convention Johnson''s message: his decision "irrevocable ... I ask therefore that my name not be
        considered by the Convention."'
      n: '[[w.califano-triumph-and-tragedy-of]], 322. Names: Albert, Johnson.'
      tags:
