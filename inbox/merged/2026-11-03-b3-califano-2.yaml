        rows:
        - 'w.califano-triumph-and-tragedy-of 79: all'
        - 'via w.califano-triumph-and-tragedy-of 79 n.6: all'
- add:
    entry:
      id: cal.1965-12-18.poverty
      when: Dec. 18
      date: '1965-12-18'
      thread: poverty
      c: 'Califano to Johnson, 6:40 p.m., in confidence: dismantle OEO without Congress, Shriver delegating its functions
        to the departments, Katzenbach agreeing it can be done; the director''s duties, Community Action among them, to the
        new Housing Secretary, Shriver the Secretary. "potentially the most politically explosive act the Administration could
        take." Justice drafts the papers; Johnson lets it go.'
      n: '[[w.califano-triumph-and-tragedy-of]], 80. To check: Califano to Johnson, Dec. 18, 1965, 6:40 p.m., LBJ Library
        (cited by [[w.califano-triumph-and-tragedy-of]], 80 n.7). Names: Califano, Johnson, Shriver, Katzenbach.'
      tags:
