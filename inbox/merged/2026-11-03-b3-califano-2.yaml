      id: cal.1965-07-28.court-2
      when: July 28
      date: '1965-07-28'
      thread: court
      c: 'The Oval Office, 12:15 p.m. Califano''s statement for a nominee, the name left blank. Johnson to Fortas: "Abe, I''m
        sending fifty thousand boys to Vietnam today and I''m sending you to the Supreme Court." Fortas goes with him to the
        East Room. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 47–48, 50 (the next day, Fortas''s "graceful note of surrender"). See [[cal.1965-07-19.court]];
        the announcement: [[cal.1965-07-28.vietnam]]. Names: Califano, Johnson, Fortas.'
      tags:
