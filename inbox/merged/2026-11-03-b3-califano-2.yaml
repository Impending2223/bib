- add:
    entry:
      id: cal.1967-12-13.welfare-2
      when: Dec. 13
      date: '1967-12-13'
      thread: welfare
      c: 'Evening, the green den: Johnson with Mills, Schultze and Califano against the freeze on aid to dependent children.
        Mills: across town from his mother in Arkansas "a Negro woman has a baby every year." Johnson to Califano after: "That''s
        the way most members feel." The freeze adopted.'
      n: '[[w.califano-triumph-and-tragedy-of]], 245–46. See [[cal.1967-12-13.welfare]]. Names: Johnson, Mills, Schultze,
        Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:mills-wilbur-d
