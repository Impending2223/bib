- add:
    entry:
      id: cal.1965-08.conservation
      when: Aug.
      date: '1965-08'
      thread: conservation
      c: 'Two weeks after Califano joins the staff, Johnson by telephone: "Take over the highway beautification bill. I want
        you to get it out of the Senate and through the House!" The same order to Moyers, Valenti, Busby, Lee White, O''Brien
        and Connor. Moyers''s secret talks with Tocker of the Outdoor Advertising Association before the bill went up.'
      n: '[[w.califano-triumph-and-tragedy-of]], 81–82. Check: the day, about Aug. 9. Names: Johnson, Califano, Moyers, Valenti,
        Busby, Lee White, O''Brien, Connor.'
