        rows:
        - 'w.califano-triumph-and-tragedy-of 210–12: all'
- add:
    entry:
      id: cal.1967-07-25.civil-disorders-detroit-2
      when: July 25
      date: '1967-07-25'
      thread: civil-disorders-detroit
      c: 'Early morning. Stanton of CBS to Califano: "the television side of the job was not well handled"; McNamara and the
        others "look like props"; "[using the times] 11:02 and 10:56 was beneath the office of the President." Johnson: "I
        had the best damn constitutional lawyer in the country write that statement." King''s telegram: Califano to tell him
        a jobs program is coming.'
      n: '[[w.califano-triumph-and-tragedy-of]], 218. See [[cal.1967-07-24.civil-disorders-detroit]]; [[cal.1967-07-25.civil-disorders]].
        Names: Stanton, Califano, McNamara, Johnson, Martin Luther King.'
      tags:
      - name:stanton-frank
      - name:califano-joseph-a-jr
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      src:
        c: e3a8ddd7
        rows:
        - 'w.califano-triumph-and-tragedy-of 218: all'
- add:
    entry:
      id: cal.1967-08-02.civil-disorders
      when: Aug. 2
      date: '1967-08-02'
      thread: civil-disorders
      c: 'The Cabinet on the riots. Clark: few Negroes in them, restraint, no conspiracy; Humphrey: "fifty-two cities potentially
        about to explode"; Gardner disputes his figures; Rusk on Carmichael and Rap Brown, some legal way to "take care of
        them"; Fowler: "It is incredible to think you can''t make a case"; Goldberg: "solutions do not come from nightsticks."
        Johnson after: "If I had ever known that he didn''t measure up to his daddy, I''d never have made him Attorney General."'
      n: '[[w.califano-triumph-and-tragedy-of]], 221–22. Names: Ramsey Clark, Humphrey, Gardner, Rusk, Carmichael, Fowler,
        Goldberg, Johnson.'
      tags:
      - name:clark-ramsey
      - name:humphrey-hubert-h
      - name:gardner-john-w
      - name:rusk-dean
      - name:carmichael-stokely
      - name:fowler-henry-h
      - name:goldberg-arthur-j
      - name:johnson-lyndon-b
      src:
        c: '63db8744'
        rows:
        - 'w.califano-triumph-and-tragedy-of 221–22: all'
- add:
    entry:
      id: cal.1967-10.jobs-and-wages
      when: Oct.
      date: '1967-10'
      thread: jobs-and-wages
      c: 'The pilot program of jobs for the hard-core unemployed with business in five cities. Califano would announce Avco''s
        new plant in Boston to hire them; Johnson: "Let''s keep these small items out of WH & particularly Boston."'
      n: '[[w.califano-triumph-and-tragedy-of]], 223–24. Check: the days. Names: Califano, Johnson.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      src:
        c: c61e3829
        rows:
        - 'w.califano-triumph-and-tragedy-of 223–24: all'
- add:
    entry:
      id: cal.1968-01-22.jobs-and-wages
      when: Jan. 22
      date: '1968-01-22'
      thread: jobs-and-wages
      c: 'About 6:30 p.m., Johnson to Califano: J. Paul Austin of Coca-Cola vice chairman of the National Alliance of Businessmen,
        Henry Ford II its chairman, by morning; "nobody''s that sick." Austin, with the flu, agrees before midnight.'
      n: '[[w.califano-triumph-and-tragedy-of]], 224–25. See [[cal.1968-01-23.jobs-and-wages]]. Names: Johnson, Califano,
        Henry Ford II.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:ford-henry-ii
      src:
        c: e69ecf1c
        rows:
        - 'w.califano-triumph-and-tragedy-of 224–25: all'
- add:
    entry:
      id: cal.1965-09-14.states-and-cities
      when: Sept. 14
      date: '1965-09-14'
      thread: states-and-cities
      c: 'Home rule for the District. Johnson''s pencilled note to Watson: "Let''s go to work on each signer of petition.
        Unless we do we are going to lose—L."'
      n: '[[w.califano-triumph-and-tragedy-of]], 229. See [[cal.1965-09-03.states-and-cities]]. Names: Johnson, Watson.'
      tags:
      - name:johnson-lyndon-b
      - name:watson-w-marvin
      - city:dc
      src:
        c: '9addf3c0'
        rows:
        - 'w.califano-triumph-and-tragedy-of 229: all'
- add:
    entry:
      id: cal.1966-05.states-and-cities
      when: May
      date: '1966-05'
      thread: states-and-cities
      c: 'The District''s commissioners. Louis Martin and Califano recommend Walter Washington, of the National Capital Planning
        Authority, for Tobriner, and Hechinger for Duncan; Katharine Graham and Wiggins of the *Post* approve. Rowe to Johnson:
        the District not "immediately ready for a Negro" president of the board; if it must be, give the police to the white
        commissioner.'
      n: '[[w.califano-triumph-and-tragedy-of]], 230. Check: the days. Names: Califano, Walter Washington, Hechinger, Katharine
        Graham, Wiggins, Rowe, Johnson.'
      tags:
      - name:califano-joseph-a-jr
      - name:washington-walter-e
      - name:graham-katharine
      - name:rowe-james-h-jr
      - name:johnson-lyndon-b
      - city:dc
      src:
        c: '7949b065'
        rows:
        - 'w.califano-triumph-and-tragedy-of 230: all'
- add:
    entry:
      id: cal.1966-06.states-and-cities
      when: June
      date: '1966-06'
      thread: states-and-cities
      c: 'Walter Washington with Johnson, Louis Martin and Califano: he will not take the number-two place on the board, "in
        this climate it wouldn''t help you and it wouldn''t help me, unless I got the top job and responsibility for the police
        and firemen." Johnson refuses.'
      n: '[[w.califano-triumph-and-tragedy-of]], 230–31. Check: the day; after mid-June. Names: Walter Washington, Johnson,
        Califano.'
      tags:
      - name:washington-walter-e
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - city:dc
      src:
        c: c086e591
        rows:
        - 'w.califano-triumph-and-tragedy-of 230–31: all'
- add:
    entry:
      id: cal.1966-10-03.states-and-cities
      when: Oct. 3
      date: '1966-10-03'
      thread: states-and-cities
      also:
      - press-and-broadcasting
      c: 'At Johnson''s direction, Califano and McPherson at lunch with Katharine Graham and Bradlee on the District: a white
        president of the commissioners, Edward Bennett Williams, Rockefeller, Harriman, Acheson or Shriver; Duncan should
        go. A week later Mrs. Graham: Williams "would undoubtedly accept."'
      n: '[[w.califano-triumph-and-tragedy-of]], 231. Names: Califano, McPherson, Katharine Graham, Bradlee, Williams, Rockefeller,
        Harriman, Acheson, Shriver.'
      tags:
      - name:califano-joseph-a-jr
      - name:mcpherson-harry
      - name:graham-katharine
      - name:bradlee-benjamin-c
      - name:rockefeller-nelson
      - name:harriman-w-averell
      - name:acheson-dean-g
      - name:shriver-r-sargent
      - city:dc
      src:
        c: e80d612f
        rows:
        - 'w.califano-triumph-and-tragedy-of 231: all'
- add:
    entry:
      id: cal.1967-06.states-and-cities
      when: June
      date: '1967-06'
      thread: states-and-cities
      also:
      - press-and-broadcasting
      c: 'After the reorganization plan goes up June 1, the White House leaks McMillan''s dealings: the insurance broker''s
        Cadillac, the auto dealer''s car for his son, the tobacco interests'' District taxes. The *Post*''s editorial; McMillan
        opposes the plan, temperately.'
      n: '[[w.califano-triumph-and-tragedy-of]], 231–32. Check: the days. Names: McMillan.'
      tags:
      - name:mcmillan-john-l
      - city:dc
      src:
        c: e975ae82
        rows:
        - 'w.califano-triumph-and-tragedy-of 231–32: all'
- add:
    entry:
      id: cal.1967-08-22.states-and-cities
      when: Aug. 22
      date: '1967-08-22'
      thread: states-and-cities
      c: 'Johnson offers Walter Washington the District''s mayoralty and he accepts; Lindsay, met on the shuttle, threatens
        to leave the Kerner Commission. Bradlee to Califano three times: the FBI checking, "I''m running with the story";
        the lead softened to "the odds-on choice." Johnson, at the bulldog edition: "he''s certainly not the odds-on choice
        of the President."'
      n: '[[w.califano-triumph-and-tragedy-of]], 232–35. Names: Johnson, Walter Washington, Lindsay, Bradlee, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:washington-walter-e
      - name:lindsay-john-v
      - name:bradlee-benjamin-c
      - name:califano-joseph-a-jr
      - city:dc
      src:
        c: '4c12d3a0'
        rows:
        - 'w.califano-triumph-and-tragedy-of 232–35: all'
- add:
    entry:
      id: cal.1967-08-23.states-and-cities
      when: Aug. 23
      date: '1967-08-23'
      thread: states-and-cities
      c: Johnson's deputy mayor, Thomas Fletcher of San Diego, found by the FBI at a traffic light in Rapid City, S.D., flown
        by jet fighter from Ellsworth Air Force Base, in the Oval Office by evening; he sleeps in the mansion.
      n: '[[w.califano-triumph-and-tragedy-of]], 235. Names: Johnson, Fletcher.'
