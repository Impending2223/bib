      when: Dec. 11
      date: '1967-12-11'
      thread: health
      c: 'The United Nations: the statement on population of more than two dozen world leaders, Johnson among them, family
        planning for "the enrichment of human life, not its restriction," no word of "birth control" or "contraceptives";
        sent in secret to Hurley in October. The bishops silent.'
      n: '[[w.califano-triumph-and-tragedy-of]], 158–59. To check: Califano to Hurley, Oct. 14, 1967, Califano''s papers (cited
        by [[w.califano-triumph-and-tragedy-of]], 159 n.20). Names: Johnson.'
