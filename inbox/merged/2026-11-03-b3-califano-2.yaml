      when: Oct. 2
      date: '1966-10-02'
      thread: press-and-broadcasting
      c: 'Camp David, at dinner. Johnson on "Communist infiltration": the Communists "had heavy influence in the networks
        (except ABC) and on several columnists." By Califano''s account.'
