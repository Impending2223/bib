- add:
    entry:
      id: cal.1967-07-22.economy-surcharge
      when: July 22
      date: '1967-07-22'
      thread: economy-surcharge
      c: The advisers initial a memorandum for a 10 percent surcharge on corporate and individual income taxes, the lowest
        brackets exempt.
      n: '[[w.califano-triumph-and-tragedy-of]], 244.'
      src:
        c: d0ac5461
        rows:
        - 'w.califano-triumph-and-tragedy-of 244: all'
