- add:
    entry:
      id: cal.1965-11-01.economy
      when: Nov. 1
      date: '1965-11-01'
      thread: economy
      c: 'Monday, 10:51 a.m. Johnson to Califano on the *Times*''s "JOHNSON, ANGRY, MOVES TO RETAIN ALUMINUM PRICE": "I am
        not now, never in my life have been, and I never will be sputtering mad!" The release to be presented as for the war''s
        needs and the balance of payments, any design on the price denied. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 99–100. To check: Califano, "Draft Memorandum for the Record," Nov. 1, 1965,
        Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 100 n.47). Names: Johnson, Califano.'
      tags:
