- add:
    entry:
      id: cal.1964-08-08.poverty-2
      when: Aug. 8
      date: '1964-08-08'
      thread: poverty
      c: 'News conference at the LBJ Ranch. Asked of Yarmolinsky, "He had been with the Department of Defense": "He still
        is." Working on the poverty bill? "No, your thoughts are wrong."'
      n: 'The President''s News Conference at the LBJ Ranch, [1963–64 Pub. Papers 937](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=177)
        (Aug. 8, 1964). [[w.califano-triumph-and-tragedy-of]], 76–77 (the exchange; "the day after the House passed the bill").
        See [[cal.1964-08-08.poverty]]. Names: Yarmolinsky.'
