- add:
    entry:
      id: cal.1967-01-11.program
      when: Jan. 11
      date: '1967-01-11'
      thread: program
      c: 'King''s telegram, Reston''s "guns and margarine speech," the market down. Johnson to Califano on the hotline: "get
        the messages out as fast as possible ... get the word out that the surcharge is under $5 a month"; Ford, Hartke and
        Russell Long "giving us hell"; Meany and his people in that afternoon. Stanton of CBS: "He has never looked better
        on television"; Johnson: "not one Goddamn vote."'
      n: '[[w.califano-triumph-and-tragedy-of]], 183–84. Names: Martin Luther King, Reston, Johnson, Califano, Ford, Hartke,
