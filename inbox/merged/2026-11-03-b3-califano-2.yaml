        rows:
        - 'w.califano-triumph-and-tragedy-of 72–73: all'
        - 'via w.califano-triumph-and-tragedy-of 73 n.43: all'
- add:
    entry:
      id: cal.1965-11-17.desegregation-schools
      when: Nov. 17
      date: '1965-11-17'
      thread: desegregation-schools
      also:
      - civil-rights-the-executive
      c: 'Johnson asks the Civil Rights Commission to study segregation in fact: "racial isolation in the schools persists—both
        in the North and the South—because of housing patterns, school districting, economic stratification and population
        movements."'
      n: 'Letter Requesting a Study of Racial Isolation as a Barrier to Quality in Education, [1965 Pub. Papers 1116](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=590)
        (Nov. 17, 1965). [[w.califano-triumph-and-tragedy-of]], 74. Names: Johnson.'
