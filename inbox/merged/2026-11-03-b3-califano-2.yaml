- add:
    entry:
      id: cal.1965-10-29.economy
      when: Oct. 29
      date: '1965-10-29'
      thread: economy
      c: 'Aluminum. Ormet, Olin Mathieson''s subsidiary, raises its price; Reynolds and Kaiser follow; Alcoa studying it.
        Eckstein, acting chairman of the Council, cables Johnson at the Ranch: the fifth rise in two years, profits near record;
        act.'
      n: '[[w.califano-triumph-and-tragedy-of]], 98. To check: Eckstein to Johnson, cable, Oct. 29, 1965, LBJ Library (cited
        by [[w.califano-triumph-and-tragedy-of]], 98 n.39). Names: Eckstein, Johnson.'
      tags:
