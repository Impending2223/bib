        to Califano, Oct. 5, and Justice''s memorandum, "Legal authority to control prices and wages under § 5(b) of the Trading
        with the Enemy Act" (cited by [[w.califano-triumph-and-tragedy-of]], 147 n.70). Names: Califano, Johnson, Robson,
        Truman, Katzenbach, Fortas.'
