- add:
    entry:
      id: cal.1966-12-22.program
      when: Dec. 22
      date: '1966-12-22'
      thread: program
      c: 'The Ranch, the book "''The Great Society,'' A Third Year Legislative Program," more than a hundred ideas: senior
        centers with hot lunch; the nursing homes; the estate tax refused, "That''ll still make everyone mad"; the vote at
        eighteen, "Wait until next year"; tar and nicotine labels, "The day you quit smoking those things"; truth in lending
        with Proxmire; safety caps for medicine bottles.'
      n: '[[w.califano-triumph-and-tragedy-of]], 178–80. Names: Johnson, Califano, Proxmire.'
      tags:
      - name:johnson-lyndon-b
