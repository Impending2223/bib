        rows:
        - 'w.califano-triumph-and-tragedy-of 205: all'
- add:
    entry:
      id: cal.1967-06-07.middle-east-six-day-war-2
      when: June 7
      date: '1967-06-07'
      thread: middle-east-six-day-war
      c: 'Levinson and Wattenberg to Johnson: a message to tomorrow''s mass meeting of American Jews in Lafayette Park would
        "neutralize" State''s neutrality statement and "could lead to a great domestic political bonus." Johnson, down the
        hall: "You Zionist dupe! ... Why can''t you see I''m doing all I can for Israel."'
      n: '[[w.califano-triumph-and-tragedy-of]], 205. Names: Levinson, Wattenberg, Johnson.'
      tags:
      - name:levinson-lawrence-e
      - name:wattenberg-ben-j
