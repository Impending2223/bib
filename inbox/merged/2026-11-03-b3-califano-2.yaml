      when: Sept. 20
      date: '1965-09-20'
      thread: civil-rights-the-executive
      c: 'Califano, Katzenbach and Lee White''s plan to Johnson: Humphrey''s two councils abolished, coordination to the Attorney
        General, each department its own programs'' civil rights.'
      n: '[[w.califano-triumph-and-tragedy-of]], 66. To check: Watson to Johnson, Sept. 20, 1965, 8:45 p.m., with Katzenbach
        to Johnson, Sept. 20, and "Suggested Summary of Re-organization of Civil Rights Responsibilities," LBJ Library (cited
        by [[w.califano-triumph-and-tragedy-of]], 66 n.28). Names: Califano, Katzenbach, Lee White, Johnson, Humphrey.'
