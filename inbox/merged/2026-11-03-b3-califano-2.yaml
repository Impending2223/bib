      src:
        c: abf40b3f
        rows:
        - 'w.califano-triumph-and-tragedy-of 205: all'
- add:
    entry:
      id: cal.1967-07-14.civil-disorders-newark-3
      when: July 14
      date: '1967-07-14'
      thread: civil-disorders-newark
      c: 'Midday. Johnson to Governor Hughes by telephone: "everyone ... here wants to support you and give you any aid";
        ask Ramsey Clark or Hoover. Hughes will restore order with his own forces.'
      n: '[[w.califano-triumph-and-tragedy-of]], 209. See [[cal.1967-07-14.civil-disorders-newark]]. Names: Johnson, Richard
        Hughes, Ramsey Clark, Hoover.'
      tags:
