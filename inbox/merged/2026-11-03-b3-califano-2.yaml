      when: Nov. 1
      date: '1966-11-01'
      thread: elections-1966
      c: 'Anchorage, the Westward Hotel, the night before Washington. Johnson to aides and secretaries: "FDR passed five major
        bills the first one hundred days. We passed 200 in the last two years"; signings in the East Room, the Cabinet Room,
        the Fish Room. The tour dropped; Brown and Douglas left to fill their schedules.'
