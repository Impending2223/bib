- add:
    entry:
      id: cal.1967-04-24.railroads
      when: Apr. 24
      date: '1967-04-24'
      thread: railroads
      c: 'Johnson from Germany: assemble the advisers, Fortas among them, and cable recommendations. Evening, Califano''s
        office: the Fahy panel, Wirtz, McNamara, Boyd, Clifford and Fortas; Fahy shaken to see a Justice there. Clifford for
        more bargaining; the rest for what would be compulsory arbitration. Morse: "unalterably opposed." Califano''s cable:
        Congress will try "to put as much of the monkey on your back as is possible."'
      n: '[[w.califano-triumph-and-tragedy-of]], 191. To check: Califano to Johnson, Apr. 24, 1967, 9:45 p.m., LBJ Library
        (cited by [[w.califano-triumph-and-tragedy-of]], 191 n.42). Names: Johnson, Fortas, Califano, Fahy, Wirtz, McNamara,
        Boyd, Clifford, Morse.'
      tags:
