        - 'w.califano-triumph-and-tragedy-of 249: all'
- add:
    entry:
      id: cal.1966-08-25.transition-and-staff
      when: Aug. 25
      date: '1966-08-25'
      thread: transition-and-staff
      c: 'Johnson to Califano: McNamara to take Ball''s place as Under Secretary of State, "In effect he would be co-Secretary."
        Califano does not raise it; neither does Johnson.'
      n: '[[w.califano-triumph-and-tragedy-of]], 249. See [[cal.1966-08.transition-and-staff]]. Names: Johnson, Califano,
        McNamara, Ball.'
