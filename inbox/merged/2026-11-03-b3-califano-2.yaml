- add:
    entry:
      id: cal.1965-08-26.steel
      when: Aug. 26
      date: '1965-08-26'
      thread: steel
      c: 'Johnson with Connor, Wirtz, Fowler, Ackley and Califano, over an hour: Connor to tell the companies 3.2 percent
        in wages and benefits without a price rise, Wirtz the union that 3.2 is all he will tolerate. Wirtz: the unions will
        take "mighty offense." Ackley: "There won''t be any Great Society unless we hold the economy in step."'
      n: '[[w.califano-triumph-and-tragedy-of]], 88–89. See [[cal.1965-08-30.steel]]. Names: Johnson, Connor, Wirtz, Fowler,
        Ackley, Califano.'
