      when: Sept. 17
      date: '1965-09-17'
      thread: labor
      also:
      - cities-and-housing
      c: 'Reuther with Johnson: a massive program to rebuild the cities, or Negroes will come out of the ghettos and burn
        them down. By Johnson''s account to Califano the next day.'
      n: '[[w.califano-triumph-and-tragedy-of]], 65–66. Names: Reuther, Johnson.'
      tags:
