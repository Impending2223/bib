      when: Oct. 5
      date: '1966-10-05'
      thread: economy
      c: 'Califano to Johnson on controls, top secret: Robson''s finding that under a declared emergency the Trading with
        the Enemy Act of 1917 might serve for wage and price controls without Congress, Truman''s emergency of 1951 still
        in force; Katzenbach''s eyes-only doubts unless Congress ratified it. Secret talks among the advisers, Fortas among
        them; all against controls.'
