      when: Nov. 14
      date: '1966-11-14'
      thread: health
      also:
      - poverty
      c: 'The Catholic bishops, "Statement on the Government and Birth Control": the government "rapidly abandoning" neutrality,
        seeking "to persuade and even coerce the underprivileged to practice birth control"; aid not to be conditioned on
        it. Hurley rushes it to Califano; Johnson writes "Terrible" on Califano''s memorandum.'
      n: '[[w.califano-triumph-and-tragedy-of]], 156–57. To check: Califano to Johnson, Nov. 14, 1966, 10 p.m., with the National
        Catholic Welfare Conference''s statement, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 156 n.11).
