- add:
    entry:
      id: cal.1965-07-12.transition-and-staff
      when: July 12
      date: '1965-07-12'
      thread: transition-and-staff
      c: 'One in the morning, back from the Ranch. Johnson to Califano: "get on over here as fast as you can finish up your
        work for Bob McNamara. And I don''t want any Goddamn leaks about your appointment." McNamara: report to the White
        House Monday, July 26.'
      n: '[[w.califano-triumph-and-tragedy-of]], 24–25. Names: Johnson, Califano, McNamara.'
      tags:
      - name:johnson-lyndon-b
