      when: Sept. 17
      date: '1965-09-17'
      thread: civil-rights-the-executive
      c: 'Humphrey to Johnson, 2 p.m.: his meetings with Cabinet officers and agency heads; his directives on discrimination
        in schools and jobs, statistics of Negroes in federal programs, Title VI in schools, hospitals and welfare.'
      n: '[[w.califano-triumph-and-tragedy-of]], 65. To check: Humphrey to Johnson, Sept. 17, 1965, 2 p.m., LBJ Library (cited
