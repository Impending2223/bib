        - 'via w.califano-triumph-and-tragedy-of 98 n.39: B'
- add:
    entry:
      id: cal.1965-10-30.economy
      when: Oct. 30
      date: '1965-10-30'
      thread: economy
      c: 'Johnson, convalescing at the Ranch, to Califano at 8:50 a.m.: flood the market with stockpile aluminum to break
        the price. Connor: the rises justified, the President has no "dictatorial authority ... to order price reductions."
        Johnson: "I''ll get Bob McNamara to do it"; McNamara called back from a football game at St. Paul''s School. By Califano''s
        account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 98–99. To check: Califano to Johnson, Oct. 30, 1965, LBJ Library (cited by
        [[w.califano-triumph-and-tragedy-of]], 99 n.43). Names: Johnson, Califano, Connor, McNamara.'
      tags:
