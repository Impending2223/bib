      - name:young-whitney-m-jr
      - name:gardner-john-w
      src:
        c: '6983dfb4'
        rows:
        - 'w.califano-triumph-and-tragedy-of 274–75: all'
      follows:
      - cal.1968-04-04.king
- add:
    entry:
      id: cal.1968-04-05.civil-disorders-king
      when: Apr. 5
      date: '1968-04-05'
      thread: civil-disorders-king
      also:
      - mayors
      c: 'Shortly before midnight, at dinner with Higginbotham, Busby, Tom Johnson and Califano: Johnson has word that Daley
        is "marked for assassination"; the FBI to tell Daley''s police. To Busby, of the address to Congress: "can make or
        break us."'
      n: '[[w.califano-triumph-and-tragedy-of]], 278–79. Names: Johnson, Busby, Califano, Daley.'
      tags:
      - name:johnson-lyndon-b
      - name:busby-horace
      - name:califano-joseph-a-jr
      - name:daley-richard-j
      - city:chicago
      src:
        c: '8bbb118d'
        rows:
        - 'w.califano-triumph-and-tragedy-of 278–79: all'
- add:
    entry:
      id: cal.1968-04-26.economy-surcharge
      when: Apr. 26
      date: '1968-04-26'
      thread: economy-surcharge
      c: 'The Urban Institute''s board at its first meeting, the Cabinet Room. Johnson sets aside his text: "You''ve got to
        figure out how to raise the taxes to pay for these social programs"; "tell us how to convince the American people
        that they should ante up."'
      n: '[[w.califano-triumph-and-tragedy-of]], 284. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: '5f6c89ff'
        rows:
        - 'w.califano-triumph-and-tragedy-of 284: all'
- add:
    entry:
      id: cal.1968-05-02.economy-surcharge
      when: May 2
      date: '1968-05-02'
      thread: economy-surcharge
      c: 'Califano to Johnson, the evening before his news conference: the lame duck''s power "could deteriorate rapidly if
        Wilbur Mills rolls over us"; come out fighting; "take the Ways and Means Committee away from Mills."'
      n: '[[w.califano-triumph-and-tragedy-of]], 285. Names: Califano, Johnson, Mills.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:mills-wilbur-d
      src:
        c: '0a22e778'
        rows:
        - 'w.califano-triumph-and-tragedy-of 285: all'
- add:
    entry:
      id: cal.1968-05-21.economy-surcharge-3
      when: May 21
      date: '1968-05-21'
      thread: economy-surcharge
      c: 'Okun to Johnson: the world financial crisis if the tax bill fails, "the first casualty might be the Paris peace
        talks"; his note: "We can''t make these arguments publicly." Johnson reads it to members by telephone: "That''s the
        risk Wilbur Mills is taking with our country."'
      n: '[[w.califano-triumph-and-tragedy-of]], 286. Names: Okun, Johnson, Mills.'
      tags:
      - name:okun-arthur-m
      - name:johnson-lyndon-b
      - name:mills-wilbur-d
      src:
        c: '424c8869'
        rows:
        - 'w.califano-triumph-and-tragedy-of 286: all'
- add:
    entry:
      id: cal.1968-04-05.elections-1968
      when: Apr. 5
      date: '1968-04-05'
      thread: elections-1968
      also:
      - republican-party
      c: 'J. Irwin Miller of Cummins Engine, a Republican for Johnson in 1964, through Califano: any objection to his chairing
        a Rockefeller-for-President effort? Johnson: full speed ahead.'
      n: '[[w.califano-triumph-and-tragedy-of]], 290. Names: Miller, Califano, Johnson, Rockefeller.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:rockefeller-nelson
      src:
        c: '9cb88df6'
        rows:
        - 'w.califano-triumph-and-tragedy-of 290: all'
- add:
    entry:
      id: cal.1968-04-23.elections-1968-3
      when: Apr. 23
      date: '1968-04-23'
      thread: elections-1968
      also:
      - republican-party
      c: Evening. The Johnsons at dinner alone with Nelson and Happy Rockefeller, brought in secretly through Larry Temple's
        office. Johnson will be neutral among the Democrats and urges Rockefeller to seek the Republican nomination; Rockefeller
        announces Apr. 30.
      n: '[[w.califano-triumph-and-tragedy-of]], 290 (Happy Rockefeller and Mrs. Johnson to Califano later). Names: Johnson,
        Lady Bird Johnson, Rockefeller, Temple.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rockefeller-nelson
      - name:temple-larry
      src:
        c: '0ea07d1c'
        rows:
        - 'w.califano-triumph-and-tragedy-of 290: all'
- add:
    entry:
      id: cal.1968-04-24.elections-1968
      when: Apr. 23–24
      date: '1968-04-24'
      thread: elections-1968
      also:
      - transition-and-staff
      c: 'After the wire''s word of Freeman for Humphrey, Johnson to Califano: the Cabinet to "stay out of the race or get
        out of the government," none at Humphrey''s luncheon; the next day, Schnittker for Kennedy, Baker for Humphrey: "no
        statements of support and no staff work." Johnson orders Baker''s resignation; Califano tells Baker to forget it.'
      n: '[[w.califano-triumph-and-tragedy-of]], 291–92. Names: Freeman, Humphrey, Johnson, Califano, Robert Kennedy.'
