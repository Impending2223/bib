      when: Oct. 6
      date: '1965-10-06'
      thread: economy
      c: 'The Quadriad: Martin, Ackley, Fowler, Schultze, Califano. Fowler: "a lot of discussion of pressures to get rates
        up." Martin asks what McNamara will spend; Johnson: "It could be $10 billion, it could be $3 to $5 billion," McNamara
        says under $5 billion for fiscal 1966. Fowler and Ackley would hold the line; Martin leans to higher rates: "whose
        crystal ball is right?"'
      n: '[[w.califano-triumph-and-tragedy-of]], 107–08 (Califano''s notes). Names: Martin, Ackley, Fowler, Schultze, Califano,
        McNamara, Johnson.'
