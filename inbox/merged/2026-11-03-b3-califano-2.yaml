        dealing with Congress: "What I want to know is what he said to you"; Rayburn''s lesson. With Lady Bird, the House
        strategy for the beauty bill: each a list of members; Califano and White to ask Sheldon Cohen about the billboards''
        depreciation and investment credit.'
      n: '[[w.califano-triumph-and-tragedy-of]], 82–83. To check: Califano to Johnson, Mrs. Johnson and the staff, Sept. 11,
        1965, 5:30 p.m.; Tina Lawson''s typed notes of the meeting, July 17, 1972, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]],
        83 n.10). Names: Cater, Jacobsen, Valenti, Busby, McPherson, Lee White, Goodwin, Califano, Johnson, Sheldon Cohen.'
