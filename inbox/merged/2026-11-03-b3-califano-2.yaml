- add:
    entry:
      id: cal.1967-06-06.middle-east-six-day-war-2
      when: June 6
      date: '1967-06-06'
      thread: middle-east-six-day-war
      also:
      - democratic-party
      c: 'Johnson has Califano call Krim, Wasserman and Weisl: he stands with Israel; get the word out and the Jewish community
        off his back. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 205. Check: the day. Names: Johnson, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      src:
