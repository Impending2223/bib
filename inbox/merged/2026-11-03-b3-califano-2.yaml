        - 'via w.califano-triumph-and-tragedy-of 99 n.45: A'
        - 'via w.califano-triumph-and-tragedy-of 100 n.47: B'
- add:
    entry:
      id: cal.1965-11-12.economy
      when: Nov. 12–13
      date: '1965-11-12'
      thread: economy
      c: 'Copper. Anaconda''s rise; Ackley wires the Ranch. Friday evening Califano gathers McNamara, Fowler, Connor, Katzenbach,
        Ackley, Eckstein and David Ginsburg. Johnson: find "a little man" of the Preparedness Subcommittee who knows copper:
        Joseph Zimmerman, flown down Saturday, to the Cabinet Room at four: Chile sets the world price. Johnson: send Harriman
        to Frei. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 101–02. To check: Ackley to Johnson, cable, Nov. 8, 1965, LBJ Library (cited
        by [[w.califano-triumph-and-tragedy-of]], 101 n.50). Names: Califano, McNamara, Fowler, Connor, Katzenbach, Ackley,
        Eckstein, Ginsburg, Johnson, Bundy, Harriman, Frei.'
