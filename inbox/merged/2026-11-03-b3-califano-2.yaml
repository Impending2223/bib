        - 'via w.califano-triumph-and-tragedy-of 63 n.19: A'
- add:
    entry:
      id: cal.1965-08.civil-disorders-watts-3
      when: Aug.
      date: '1965-08'
      thread: civil-disorders-watts
      c: 'Collins, Under Secretary of Commerce, sent to Los Angeles, to Johnson in confidence: the danger "a feeling ... on
        the part of the Negro community that they are ''out of it''"; riots will go on until they share in the community;
        "multiplied in every city in this country."'
      n: '[[w.califano-triumph-and-tragedy-of]], 63–64. Check: the day. To check: Collins to Califano, undated, with Collins
        to Johnson, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 64 n.20). Names: Collins, Johnson.'
      tags:
