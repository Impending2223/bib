      date: '1967-03-27'
      thread: court
      also:
      - transportation
      c: The Supreme Court sends the Penn-Central case back to the ICC. Fortas, with Harlan, Stewart and White, dissents for
        the merger at once, quoting the Solicitor General's brief on the executive agencies' view.
      n: '[[w.califano-triumph-and-tragedy-of]], 163. To check: the Court''s opinion. See [[cal.1966-11-25.transportation]].
