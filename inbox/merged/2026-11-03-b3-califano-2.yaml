      date: '1966-02'
      thread: economy
      c: 'Johnson''s choice for the Board, Andrew Brimmer, Assistant Secretary of Commerce: Martin finds him too young, a
        fourth economist. Johnson to Califano: "Thinking so is not good enough. I want you to know so" that he will vote to
        hold rates down; then talks with Brimmer himself. To Russell Long, "What the hell am I going to tell the people in
        my state?": "Tell them he''s from Louisiana."'
      n: '[[w.califano-triumph-and-tragedy-of]], 109–11. Check: the days. Names: Brimmer, Martin, Johnson, Califano, Russell
