      when: Mar. 7
      date: '1966-03-07'
      thread: economy
      c: 'Capital spending forecast up 19 percent, unemployment at 3.7. Johnson''s orders to Califano: Lee White''s power
        permits, Boyd''s highways, Gardner''s hospitals, housing, Vance''s Corps projects, Udall, the SEC''s stock issues,
        EDA, rural electrification, all slowed; "We''re going to have to take our time on everything, except Vietnam." To
        Patman by telephone: interest rates up faster under Fowler than any Secretary this century; "send him a blistering
        letter."'
      n: '[[w.califano-triumph-and-tragedy-of]], 140–42. To check: Califano to Johnson, Mar. 7, 1966, 3:50 p.m., with economic
        statistics, Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 142 n.52). Names: Johnson, Califano,
        Lee White, Boyd, Gardner, Vance, Udall, Patman, Fowler.'
