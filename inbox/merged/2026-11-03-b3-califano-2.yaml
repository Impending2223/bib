- add:
    entry:
      id: cal.1965-07-23.vietnam-july-decision-2
      when: July 23
      date: '1965-07-23'
      thread: vietnam-july-decision
      c: McNamara's three ways to carry out his program, one with neither a national emergency nor a reserve call-up. Johnson
        in the Cabinet Room with McNamara, Rusk, Ball, Wheeler, Bundy, Moyers and Busby, Busby to draft the announcement;
        then Rusk alone; that evening Chancellor on the Voice of America, and Fulbright on Vietnam. To Camp David for the
        weekend.
      n: '[[w.califano-triumph-and-tragedy-of]], 38–39. To check: McNamara''s Plans I, II and III, dated July 23, July 23
        and "7/24/65—Rev #1," LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 38 n.16). Names: McNamara, Johnson,
        Rusk, Ball, Wheeler, Bundy, Moyers, Busby, Chancellor, Fulbright.'
