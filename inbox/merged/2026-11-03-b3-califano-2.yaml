      when: Oct.
      date: '1967-10'
      thread: economy-surcharge
      also:
      - transportation
      c: 'Boyd wires the governors: the talks with Congress on cuts could halve highway construction from Nov. 1; governors
        and legislators press their members for the surcharge.'
      n: '[[w.califano-triumph-and-tragedy-of]], 244–45. Check: the day. Names: Boyd.'
      tags:
      - name:boyd-alan-s
