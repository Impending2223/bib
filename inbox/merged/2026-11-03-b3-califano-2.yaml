      when: Nov. 17
      date: '1967-11-17'
      thread: economy-surcharge
      c: 'News conference, the lavaliere microphone: "One of our failures in the administration has been our inability to
        convince the Congress"; Ford and Mills "will live to rue the day."'
      n: 'The President''s News Conference of November 17, 1967, [1967 Pub. Papers 1045](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=437)
        (Nov. 17, 1967). [[w.califano-triumph-and-tragedy-of]], 245. Names: Johnson, Ford, Mills.'
