      when: Nov. 24
      date: '1966-11-24'
      thread: transportation
      also:
      - court
      c: 'Thanksgiving, 9 a.m., Califano''s office, the Solicitor General''s draft before them: Boyd, the department to set
        the government''s position; Clark, the Solicitor General to decide. Johnson by telephone with Fortas, the tape''s
        belt "destroyed on President''s instruction"; to Califano: "the best lawyer I know says" no need to remand, the transportation
        agencies for the merger at once. Fortas to Califano the same. Marshall, in Atlantic City, balks.'
      n: '[[w.califano-triumph-and-tragedy-of]], 161–62. Names: Califano, Boyd, Ramsey Clark, Johnson, Fortas, Thurgood Marshall.'
      tags:
      - name:califano-joseph-a-jr
