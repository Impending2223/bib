        rows:
        - 'w.califano-triumph-and-tragedy-of 197: all'
- add:
    entry:
      id: cal.1967-10-22.war-opposition
      when: Oct. 22
      date: '1967-10-22'
      thread: war-opposition
      c: Sunday. After church Johnson and Mrs. Johnson drive past the Lincoln Memorial, where the marchers had gathered, and
        Johnson unnoticed to the Pentagon's Mall entrance, the road lined with soldiers. By Califano's account.
      n: '[[w.califano-triumph-and-tragedy-of]], 199–200. See [[cal.1967-10-21.war-opposition]]. Names: Johnson, Lady Bird
        Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      src:
        c: fbdd094c
        rows:
        - 'w.califano-triumph-and-tragedy-of 199–200: all'
- add:
    entry:
      id: cal.1967-10.war-opposition
      when: Oct.
      date: '1967-10'
      thread: war-opposition
      also:
      - press-and-broadcasting
      c: The week after the march, a raw intelligence report of protesters at the Pentagon; Johnson has Califano leak it to
        Joseph Alsop, and release the cost of the demonstration and cleanup, over $1 million.
      n: '[[w.califano-triumph-and-tragedy-of]], 200. Check: the days. Names: Johnson, Califano, Joseph Alsop.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:alsop-joseph
      src:
        c: '9b712cf8'
        rows:
        - 'w.califano-triumph-and-tragedy-of 200: all'
- add:
    entry:
      id: cal.1967-11-18.draft
      when: Nov. 18
      date: '1967-11-18'
      thread: draft
      also:
      - war-opposition
      c: 'Off the record, Johnson with Hershey and Clark: Clark has prosecuted 1,300 of 7,300 arrested for not reporting;
        Johnson: "If you need more laws, submit your suggestions at once!" After it, Johnson''s eyes-only memorandum to Clark
        with the statutes on sabotage, espionage and interference, Nimetz''s list: dissent not to be infringed; disrupters
        "prosecuted to the full extent of the law."'
      n: '[[w.califano-triumph-and-tragedy-of]], 200–01. Names: Johnson, Hershey, Ramsey Clark, Nimetz.'
      tags:
      - name:nimetz-matthew
      - name:johnson-lyndon-b
      - name:hershey-lewis-b
      - name:clark-ramsey
      src:
        c: fce88fdf
        rows:
        - 'w.califano-triumph-and-tragedy-of 200–01: all'
- add:
    entry:
      id: cal.1967-12-21.draft
      when: Dec. 21
      date: '1967-12-21'
      thread: draft
      also:
      - war-opposition
      c: 'Brewster of Yale for the Ivy League presidents to Johnson: due process "in serious jeopardy unless you make it clear
        that the draft is not to be used as punishment." Dec. 26, Johnson reworking the drafts, Califano''s "Dear King" answer:
        the System "not an instrument to repress and punish unpopular views"; Hershey adheres.'
      n: '[[w.califano-triumph-and-tragedy-of]], 202–03. Names: Johnson, Califano, Hershey.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:hershey-lewis-b
      src:
        c: dad57e77
        rows:
        - 'w.califano-triumph-and-tragedy-of 202–03: all'
- add:
    entry:
      id: cal.1967-12.draft
      when: Dec.
      date: '1967-12'
      thread: draft
      c: 'Mid-December. Califano recommends drafting the youngest first; Johnson on the memorandum: "I don''t want to draft
        19 year olds first as General Hershey, Secretary McNamara and Joe Califano prefer. I want to draft everyone that graduates
        from college. Start at age 23."'
      n: '[[w.califano-triumph-and-tragedy-of]], 203. Check: the day. Names: Califano, Johnson, Hershey, McNamara.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:hershey-lewis-b
      - name:mcnamara-robert-s
      src:
        c: '3d17fc83'
        rows:
