      date: '1966-05-31'
      thread: cities-and-housing
      c: 'The Democratic leadership breakfast. Johnson: Demonstration Cities "the most important domestic measure before the
        Congress and to the future of the American cities"; O''Brien and Califano to "get the legislation passed." The *Times*
        had called it "dead" May 15; Barrett''s House subcommittee poised to gut it.'
