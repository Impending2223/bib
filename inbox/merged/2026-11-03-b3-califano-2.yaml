      date: '1965-09-12'
      thread: conservation
      c: 'Califano to Johnson, 5:15 p.m.: Sheldon Cohen will not go after the billboard owners on depreciation, may on the
        investment credit; "Place the burden clearly on one person to get this straightened out on the Hill. I recommend Larry
        O''Brien."'
