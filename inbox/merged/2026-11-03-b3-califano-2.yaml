- add:
    entry:
      id: cal.1967-06-14.transition-and-staff
      when: June 14
      date: '1967-06-14'
      thread: transition-and-staff
      c: 'Los Angeles, Chasen''s: Califano at dinner with academics on the 1968 program, Warren Christopher setting it up.
        Johnson by telephone: bring Christopher back that night; interviewed, he is named Deputy Attorney General the next
        day.'
      n: '[[w.califano-triumph-and-tragedy-of]], 193 n. Names: Califano, Christopher, Johnson.'
      tags:
      - name:califano-joseph-a-jr
      - name:christopher-warren
      - name:johnson-lyndon-b
      src:
        c: b58ac535
        rows:
        - 'w.califano-triumph-and-tragedy-of 193 n.: all'
- add:
    entry:
      id: cal.1967-02.draft
      when: Feb.
      date: '1967-02'
      thread: draft
      c: 'After the Marshall commission''s report (a lottery, nineteen-year-olds first, an end to college deferments, 11 to
        7), Califano asks to imply Johnson agrees; Johnson: "No. Don''t quote me or imply. Let''s get his best judgment free
        of influence." Hershey, with McNamara and Califano: random selection and the youngest first he can accept; not less
        power for the local boards. Johnson: "go with Hershey where we can," if he puts Negroes and Mexican Americans on the
        boards.'
      n: '[[w.califano-triumph-and-tragedy-of]], 197. Check: the days. Names: Califano, Johnson, Hershey, McNamara, Burke
        Marshall.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:hershey-lewis-b
      - name:mcnamara-robert-s
      - name:marshall-burke
      src:
