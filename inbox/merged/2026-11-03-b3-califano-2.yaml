      id: cal.1965-08-19.steel
      when: Aug. 19
      date: '1965-08-19'
      thread: steel
      c: 'Eckstein''s analysis of the union''s demands for Johnson: far from the companies'' offer, and a price rise to follow.
        Johnson to Califano after 11 p.m.: "Learn everything you can about steel. Meet every day with" Wirtz, Connor and Ackley;
        "I''m afraid that this one''s going to end up here."'
      n: '[[w.califano-triumph-and-tragedy-of]], 87–88. To check: Califano to Johnson, Aug. 19, 1965, 8:40 p.m., with Eckstein
        to Johnson, Aug. 19, 1965, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 88 n.4). See [[cal.1965-08-17.steel]].
        Names: Eckstein, Johnson, Califano, Wirtz, Connor, Ackley.'
