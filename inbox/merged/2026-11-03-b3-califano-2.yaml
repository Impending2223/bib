- add:
    entry:
      id: cal.1967-02.welfare
      when: Feb.
      date: '1967-02'
      thread: welfare
      c: 'Califano to Sigma Delta Chi, Johnson approving the draft: of 7.3 million on welfare, net of children, their mothers,
        the old, the blind and the disabled, only some 50,000 fathers and no more than 300,000 mothers could be put to work.
        The *Times*''s front page; the networks.'
      n: '[[w.califano-triumph-and-tragedy-of]], 169. Check: the day. To check: Califano to Johnson, Feb. 20, 1967, 3:45 p.m.,
        Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 169 n.6). Names: Califano, Johnson.'
