        rows:
        - 'w.califano-triumph-and-tragedy-of 192–93: all'
- add:
    entry:
      id: cal.1967-06-15.railroads
      when: June 15
      date: '1967-06-15'
      thread: railroads
      c: 'Wirtz had not sent Albert the letter against Brock Adams''s seizure amendment that Levinson asked for at 10:36 the
        night before. Johnson on the speaker phone: "If you get a call from the cleaning woman who mops the floors at three
        a.m. and she tells you that the President wants you to do something, you do it!" The letter delivered within the hour.'
      n: '[[w.califano-triumph-and-tragedy-of]], 193–94. Names: Wirtz, Albert, Brock Adams, Levinson, Johnson.'
      tags:
      - name:levinson-lawrence-e
      - name:wirtz-w-willard
