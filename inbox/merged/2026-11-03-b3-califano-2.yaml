      id: cal.1965-07-11.transition-and-staff
      when: July 11
      date: '1965-07-11'
      thread: transition-and-staff
      c: 'Sunday, the LBJ Ranch. Johnson''s news conference: Major Hugh Robinson his Army aide, the first Negro military aide
        to a President, on Califano''s recommendation.'
      n: '[[w.califano-triumph-and-tragedy-of]], 23. Check: the Papers print no news conference of July 11. Names: Johnson,
        Califano.'
