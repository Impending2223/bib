        rows:
        - 'w.califano-triumph-and-tragedy-of 70: all'
        - 'via w.califano-triumph-and-tragedy-of 70 n.39: all'
- add:
    entry:
      id: cal.1965-10-04.desegregation-schools-2
      when: Oct. 4
      date: '1965-10-04'
      thread: desegregation-schools
      c: 'Evening, the Oval Office: Gardner, Keppel, Katzenbach, Cater, Cohen. Katzenbach: had Keppel told Daley, given the
        city a chance, told the committees thirty days before? He had not. Johnson sends Cohen to Chicago for a plan of voluntary
        compliance; Califano to tell Daley the funds will not be cut off. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 72–73. See [[cal.1965-10-01.desegregation-schools-chicago]]; Cohen''s agreement:
        [[cal.1965-10-04.desegregation-schools]]. Names: Gardner, Keppel, Katzenbach, Cater, Cohen, Daley, Johnson, Califano.'
      tags:
      - name:gardner-john-w
      - name:keppel-francis
      - name:katzenbach-nicholas
