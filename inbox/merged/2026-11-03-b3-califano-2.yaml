      when: July 14
      date: '1966-07-14'
      thread: economy
      c: 'Califano brings John Robson, a Republican lawyer of Illinois, to Johnson in the den as an unannounced price watcher:
        "I need you more than I need a company of Marines in Vietnam." His office in the Budget Bureau, his task given out
        as federal procurement''s effect on the economy.'
