      when: Dec. 10
      date: '1965-12-10'
      thread: cities-and-housing
      c: 'Johnson reads Humphrey quoted on a program to rebuild demonstration cities; to Califano, who had asked him to the
        urban task force: "You are never, never to let the Vice President attend any meeting on the legislative program. He
        has Minnesota running-water disease." Califano tells Humphrey to stop talking of "a Marshall plan or demonstration
        plan." By Califano''s account.'
