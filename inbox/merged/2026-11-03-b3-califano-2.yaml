      id: cal.1963-11-23.assassination
      when: Nov. 23
      date: '1963-11-23'
      thread: assassination
      c: Arlington, in pouring rain. Califano, General Counsel of the Army, with Robert Kennedy walks the 3.2-acre site for
        the grave on the hill below the Lee Mansion, outlining it on the cemetery's map. By Califano's account.
      n: '[[w.califano-triumph-and-tragedy-of]], 14. Names: Califano, Robert Kennedy.'
