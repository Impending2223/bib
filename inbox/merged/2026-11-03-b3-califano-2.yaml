- add:
    entry:
      id: cal.1966-11-04.health
      when: Nov. 4
      date: '1966-11-04'
      thread: health
      c: 'The Fish Room. Johnson to his task force on nursing homes, Lewis Davis among them: "Fire traps, rat traps, a disgrace
        ... no one of you would let your mother near one"; flat floors and grades for wheelchairs, handles on the baths, the
        toilet paper within reach.'
      n: '[[w.califano-triumph-and-tragedy-of]], 178–79. To check: "Report of the [1966] Task Force on Nursing Homes and Other
        Institutions for the Care of the Elderly," Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 179
        n.8). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
