      thread: economy
      c: 'Fowler and Ackley to Johnson: Martin will vote to raise the discount rate if any Reserve Bank proposes it; three
        boards meet Dec. 2; the Board split 3 to 3, the seventh leaning to the rise. Johnson: Ackley to work on the undecided
        member, Califano to sound the Congress.'
