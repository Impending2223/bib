- add:
    entry:
      id: cal.1967-09-27.vietnam-congress-2
      when: Sept. 27
      date: '1967-09-27'
      thread: vietnam-congress
      c: 'The Democratic leadership breakfast. Johnson: "they tell me Clifford Case has been looking in the mirror an awful
        lot lately." To Califano: tell Case "if I want advice like that I''ll get it from Wayne Morse and Ernest Gruening."'
      n: '[[w.califano-triumph-and-tragedy-of]], 248–49. See [[cal.1967-09-26.vietnam-congress]]. Names: Johnson, Case, Califano,
        Morse, Gruening.'
