    entry:
      id: cal.1964-11-04.transition-and-staff
      when: Nov. 4
      date: '1964-11-04'
      thread: transition-and-staff
      c: 'The day after the election. Bundy and Moyers to Califano, McNamara''s special assistant: join the White House staff
        as recruiter of talent and expert on Latin America. McNamara at lunch: "Out of the question." By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 17–18. Names: Bundy, Moyers, Califano, McNamara.'
      tags:
