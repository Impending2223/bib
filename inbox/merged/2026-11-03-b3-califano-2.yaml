      when: Oct. 29
      date: '1966-10-29'
      thread: elections-1966
      c: 'From Asia, Johnson''s plan for a pre-election tour signing the bills: Congress to hold them; Markman and others
        find the sites, a shopping center for truth-in-packaging, Minnesota for clean water, Boston for Model Cities to help
        Edward McCormack, Chicago for the Indiana Dunes and Douglas, North Dakota for Food for Freedom; eleven cities in four
