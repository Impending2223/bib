        - 'w.califano-triumph-and-tragedy-of 249: all'
- add:
    entry:
      id: cal.1967-12-04.program
      when: Dec. 4
      date: '1967-12-04'
      thread: program
      also:
      - economy-surcharge
      c: 'Monday evening. Califano to Johnson, against Fowler''s cuts: repackage the tax increase for more revenue, drop obsolete
        programs like school milk for suburban children, new programs in housing and jobs, "Let the Congress chop it up";
        Mills "wants either (or both) (1) to force you to your knees ... or (2) to dismantle great hunks of the Great Society."'
      n: '[[w.califano-triumph-and-tragedy-of]], 253–54. Names: Califano, Johnson, Fowler, Mills.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:fowler-henry-h
      - name:mills-wilbur-d
      src:
        c: dd7e370b
        rows:
        - 'w.califano-triumph-and-tragedy-of 253–54: all'
- add:
    entry:
      id: cal.1967-12-28.program
      when: Dec. 28
      date: '1967-12-28'
      thread: program
      also:
      - crime-and-hijacking-safe-streets
      c: 'The Ranch, most of the day: Califano briefs Johnson on the new programs. The Safe Streets bill recast for the Senate
        with an antiriot provision of his own; every decision held until he can see how to get his tax bill.'
      n: '[[w.califano-triumph-and-tragedy-of]], 254–55. Names: Califano, Johnson.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      src:
        c: e5713f14
        rows:
        - 'w.califano-triumph-and-tragedy-of 254–55: all'
- add:
    entry:
      id: cal.1968-02-27.civil-disorders-kerner
      when: Feb. 27
      date: '1968-02-27'
      thread: civil-disorders-kerner
      c: 'Breakfast in the White House mess. Kerner and Ginsburg give Califano an advance copy of the Commission''s report:
        "the best they could do for LBJ." That evening Califano to Johnson: have Kerner send it with a letter praising his
        progress; answer it as "the beginning of a national dialogue."'
      n: '[[w.califano-triumph-and-tragedy-of]], 260–61. Names: Kerner, Ginsburg, Califano, Johnson.'
      tags:
      - name:kerner-otto
      - name:ginsburg-david
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      src:
        c: ffb2264f
        rows:
        - 'w.califano-triumph-and-tragedy-of 260–61: all'
- add:
    entry:
      id: cal.1968-02-29.civil-disorders-kerner
      when: Feb. 29
      date: '1968-02-29'
      thread: civil-disorders-kerner
      c: 'Johnson and Califano argue an hour over the Kerner report; he will not acknowledge it: tell Ginsburg it is "destroying
        the President''s interest in things like this." The *Post* to run it the next day despite the embargo; Bradlee: a
        copy came with its cover torn off. Johnson will not take the bound copy.'
      n: '[[w.califano-triumph-and-tragedy-of]], 261–62. See [[cal.1968-02-29.civil-disorders]]. Names: Johnson, Califano,
        Ginsburg, Bradlee.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:ginsburg-david
      - name:bradlee-benjamin-c
      src:
        c: e50142c4
        rows:
        - 'w.califano-triumph-and-tragedy-of 261–62: all'
- add:
    entry:
      id: cal.1968-03-28.elections-1968
      when: Mar. 28
      date: '1968-03-28'
      thread: elections-1968
      c: 'After the lunch, the Oval Office, Johnson at the signing table: Califano to run the poverty program when Shriver
        goes to Paris, "if I decide to run"; Califano will leave after the election. Who if he doesn''t run? "Bobby Kennedy";
        "What about Hubert?" Say nothing bad of McCarthy or Kennedy. "Only Bob McNamara and George Christian know how close
        I''ve come to announcing that I would not run."'
      n: '[[w.califano-triumph-and-tragedy-of]], 266–69. Names: Johnson, Califano, Shriver, Robert Kennedy, Humphrey, McCarthy,
        McNamara, Christian.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:shriver-r-sargent
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
      - name:mcnamara-robert-s
      - name:christian-george
      src:
        c: ffa78958
        rows:
        - 'w.califano-triumph-and-tragedy-of 266–69: all'
      follows:
      - cal.1968-03.elections-1968-2
- add:
    entry:
      id: cal.1968-03-29.elections-1968-2
      when: Mar. 29
      date: '1968-03-29'
      thread: elections-1968
      c: 'Lunch in the Flower Garden again: the poverty program pressed less; "a lot of people ready to surrender without
        knowing they are following a party line"; the speech''s tax section, the figures to go over with Okun and Fowler;
        Patrick Lyndon Nugent and the photographers.'
      n: '[[w.califano-triumph-and-tragedy-of]], 269–70. Names: Johnson, Califano, Okun, Fowler.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:okun-arthur-m
      - name:fowler-henry-h
      src:
        c: '65158e35'
        rows:
        - 'w.califano-triumph-and-tragedy-of 269–70: all'
- add:
    entry:
      id: cal.1968-04-02.congress
      when: Apr. 2
      date: '1968-04-02'
      thread: congress
      also:
      - elections-1968
      c: 'The Democratic leaders'' breakfast. Johnson turns aside the politics: "I''m not going to influence the Convention
        ... probably won''t even go. Much to everyone''s disbelief, I never wanted to be President to begin with. I''m leaving
        without any bitterness." He presses for the tax bill.'
      n: '[[w.califano-triumph-and-tragedy-of]], 271. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: ba6d5d1d
        rows:
        - 'w.califano-triumph-and-tragedy-of 271: all'
- add:
    entry:
      id: cal.1968-04-04.elections-1968-4
      when: Apr. 4
      date: '1968-04-04'
      thread: elections-1968
      c: 'New York, Cooke installed as Archbishop: the congregation in St. Patrick''s stands and cheers Johnson. He speaks
        with Jacqueline Kennedy, sees Nelson and Happy Rockefeller at the Archbishop''s residence, then U Thant and Goldberg
        at the UN. Back at 6:30 p.m.'
      n: '[[w.califano-triumph-and-tragedy-of]], 271–72. See [[cal.1968-04-04.vietnam-paris]]. Names: Johnson, Rockefeller,
        U Thant, Goldberg.'
      tags:
      - name:johnson-lyndon-b
      - name:rockefeller-nelson
      - name:u-thant
      - name:goldberg-arthur-j
      src:
        c: ede5a120
        rows:
        - 'w.califano-triumph-and-tragedy-of 271–72: all'
- add:
    entry:
      id: cal.1968-04-04.civil-disorders-king-2
      when: Apr. 4
      date: '1968-04-04'
      thread: civil-disorders-king
      c: 'Night. Fauntroy to Califano before ten: "unprecedented violence" in the city. Johnson''s calls till after 1 a.m.:
        the Negro leaders for the morning, Stokes, Evers, Hatcher, Higginbotham, Rustin, McKissick, Marshall, Dorothy Height,
        Wilkins, Clarence Mitchell, Whitney Young; a service at the National Cathedral; O''Boyle''s masses; Gardner''s Urban
        Coalition; pleas from Mrs. Kennedy and King''s widow and father.'
      n: '[[w.califano-triumph-and-tragedy-of]], 274–75. Names: Califano, Johnson, Stokes, Evers, Hatcher, Higginbotham, Rustin,
        McKissick, Thurgood Marshall, Wilkins, Clarence Mitchell, Whitney Young, Gardner.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:stokes-carl-b
      - name:evers-charles
      - name:hatcher-richard-g
