      date: '1966-02-09'
      thread: crime-and-hijacking
      also:
      - civil-rights-the-executive
      c: Califano and Lee White to Johnson, 6:45 p.m., on a bill to bar private wiretaps and limit official ones. Johnson
        writes "I like this best" by "a complete ban on all taps, even in national security cases," and of bugging devices,
