      when: Aug. 27
      date: '1965-08-27'
      thread: steel
      c: 'Simkin, the federal mediator, on his own suggests to each side a settlement above the guideposts. Califano wires
        Johnson, at the Ranch for his birthday; Johnson by telephone: send Morse and LeRoy Collins to Pittsburgh. By Califano''s
        account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 89. To check: Califano to Johnson, Aug. 27, 1965, 8:55 p.m., LBJ Library
        (cited by [[w.califano-triumph-and-tragedy-of]], 89 n.9). Names: Simkin, Califano, Johnson, Morse, Collins.'
