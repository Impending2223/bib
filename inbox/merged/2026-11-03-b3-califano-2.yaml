- add:
    entry:
      id: cal.1965-09-23.civil-rights-the-executive
      when: Sept. 23
      date: '1965-09-23'
      thread: civil-rights-the-executive
      c: 'Johnson to Califano: Humphrey should recommend the changes himself; "get yourself a piece of his stationery and
        type up these recommendations." At seven, in his Executive Office Building suite, Humphrey reads the draft: "I''ll
        have to talk to some of my people"; he will sign it at home that night. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 67–69. Names: Johnson, Califano, Humphrey.'
      tags:
      - name:johnson-lyndon-b
