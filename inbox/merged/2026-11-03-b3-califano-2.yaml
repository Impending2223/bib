- add:
    entry:
      id: cal.1965-07-26.vietnam-july-decision
      when: July 26
      date: '1965-07-26'
      thread: vietnam-july-decision
      c: 'After Goldberg''s swearing-in, the Cabinet Room: Rusk, Ball, McNamara, Wheeler, Bundy, Raborn and Helms, Lodge,
        Goldberg, Clifford, Humphrey. How to explain the escalation to the public, Congress and the world. That night Johnson
        calls the Situation Room at 1, 3:30 and 7:35 a.m. on the raids on a SAM site near Hanoi and a power plant. By Califano''s
        account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 40. To check: Bundy to Johnson, July 26, 1965, 11:30 a.m., with "Agenda.
        Meeting at 12:00, Monday, July 26, 1965," LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 40 n.24). Names:
        Rusk, Ball, McNamara, Wheeler, Bundy, Raborn, Helms, Lodge, Goldberg, Clifford, Humphrey, Johnson.'
