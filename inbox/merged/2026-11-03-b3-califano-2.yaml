- add:
    entry:
      id: cal.1967-09-26.vietnam-congress
      when: Sept. 26
      date: '1967-09-26'
      thread: vietnam-congress
      c: 'Case of New Jersey in the Senate against the "misuse" and "perversion" of the Tonkin Gulf resolution: a "crisis
        of confidence" in the President. Democrats and Dirksen answer him; Mansfield: Congress did pass it.'
      n: '[[w.califano-triumph-and-tragedy-of]], 248. Check: the Record''s pages. Names: Case, Dirksen, Mansfield.'
      tags:
