      - name:mansfield-mike
      src:
        c: '4ce61e1b'
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=832: A-B'
        - 'w.califano-triumph-and-tragedy-of 180–81: C'
