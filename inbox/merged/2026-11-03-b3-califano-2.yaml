    text: 'Check: Califano puts the meeting on the morning of the day Johnson met the Pope, Oct. 4 (72; the Daily Diary of
      Oct. 3–4, 71 n.40).'
- check:
    id: cal.1965-11-06.economy
    text: 'Check: Califano has McNamara announce the release of 200,000 tons, and Califano a further 100,000 (100).'
- check:
    id: cal.1965-11-18.economy
    text: 'Check: Califano puts McNamara''s announcement "the next day" after Nov. 16 (102).'
- check:
    id: cal.1965-12-31.steel
    text: 'Check: the amount; Califano gives $5 a ton (102).'
- check:
    id: cal.1966-12-21.elections-1966
    text: 'Check: Califano has the governors, Hearnes leading, attack the school desegregation guidelines through the afternoon
      (177–78).'
- check:
    id: cal.1967-07-14.civil-disorders-newark-2
    text: 'Check: Califano puts the UPI report of Humphrey''s offer of federal aid on Saturday, July 15 (209–10).'
- check:
    id: cal.1968-03.elections-1968-2
    text: 'Check: Califano dates the lunch Mar. 28, shortly before three, in the Flower Garden (265).'
- check:
    id: cal.1968-04-06.civil-disorders-baltimore
    text: 'Check: Califano hands Johnson the Baltimore proclamation and order at dinner, about 10:15 p.m., Palm Sunday, Apr.
      7 (280–81).'
- check:
    id: cal.1968-06-29.court-fortas
    text: 'Check: Califano dates Henry Ford''s report on Griffin "June 31" (311).'
