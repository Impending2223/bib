- add:
    entry:
      id: cal.1964-10-14.elections-1964-3
      when: Oct. 14
      date: '1964-10-14'
      thread: elections-1964
      c: 'About 7 p.m. McNamara to Califano: Jenkins''s Air Force Reserve file, copied, nothing removed; Haig watches the
        copying. From Moyers''s office Johnson, at the Al Smith dinner, suspects a frame-up; McNamara reads him the fitness
        reports, signed by the unit''s commander, Major General Barry Goldwater. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 19–20. To check: "Statement of Mrs. Lyndon B. Johnson," Oct. 15, 1964, LBJ
        Library (cited by [[w.califano-triumph-and-tragedy-of]], 20 n.6). See [[cal.1964-10-14.elections-1964]]. Names: McNamara,
        Califano, Jenkins, Haig, Moyers, Johnson, Goldwater.'
