        rows:
        - 'w.califano-triumph-and-tragedy-of 79: all'
        - 'via w.califano-triumph-and-tragedy-of 79 n.4: A'
- add:
    entry:
      id: cal.1965-11-06.poverty
      when: Nov. 6
      date: '1965-11-06'
      thread: poverty
      c: 'After the Schultze–Shriver quarrel reaches the *New York Times*''s front page and Johnson tells Califano to stop
        it, both to Johnson: Schultze, that Shriver leaked to inflame it; Shriver, that the White House, perhaps the President,
        is undercutting him. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 79. To check: Redmon to Moyers, Nov. 5, 1965; Schultze to Johnson and Shriver
        to Johnson, Nov. 6, 1965, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 79 n.6). Names: Schultze, Shriver,
        Johnson, Califano.'
      tags:
      - name:schultze-charles-l
