      when: Dec. 22
      date: '1966-12-22'
      thread: civil-rights-the-executive
      c: 'The Ranch, the day after the governors. Johnson to Califano, on Wallace and the governors: "If I don''t achieve
        anything else while I''m President, I intend to wipe that word out of the English language."'
      n: '[[w.califano-triumph-and-tragedy-of]], 178. See [[cal.1966-12-21.elections-1966]]. Names: Johnson, Califano, Wallace.'
