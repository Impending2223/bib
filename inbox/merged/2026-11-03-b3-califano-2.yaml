        rows:
        - 'w.califano-triumph-and-tragedy-of 299–300: all'
- add:
    entry:
      id: cal.1968-07.elections-1968-chicago
      when: July
      date: '1968-07'
      thread: elections-1968-chicago
      c: 'Early July. On Califano''s memorandum on a first draft of the platform, Johnson: "Do nothing for God''s sake on
        this." McPherson and Levinson sent to Los Angeles to script a film of his presidency for the convention; his people
        write the platform; he scuttles a compromise plank for an immediate bombing halt: "by God, the Democratic party ought
        not to be doing that to me."'
      n: '[[w.califano-triumph-and-tragedy-of]], 318. Check: the days. Names: Califano, Johnson, McPherson, Levinson, Humphrey.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      - name:levinson-lawrence-e
      - name:humphrey-hubert-h
      src:
        c: '558e8e6c'
        rows:
        - 'w.califano-triumph-and-tragedy-of 318: all'
- add:
    entry:
      id: cal.1968-07-30.elections-1968-chicago-2
      when: July 30
      date: '1968-07-30'
      thread: elections-1968-chicago
      c: 'Stephen Smith to Califano: the Kennedys'' film of Robert Kennedy for the convention. Johnson: "I''ve got no choice,
        so O.K."; but not before the nominees are chosen, Thursday, Aug. 29.'
      n: '[[w.califano-triumph-and-tragedy-of]], 318–19. Names: Califano, Johnson, Robert Kennedy.'
      tags:
      - name:califano-joseph-a-jr
