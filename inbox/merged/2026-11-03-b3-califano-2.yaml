        - 'via w.califano-triumph-and-tragedy-of 128 n.14: B'
        - 'via w.califano-triumph-and-tragedy-of 128 n.15: C'
- add:
    entry:
      id: cal.1965-11-03.cities-and-housing
      when: Nov. 3
      date: '1965-11-03'
      thread: cities-and-housing
      c: 'Johnson by telephone in the morning: "Did you get it?"—Weaver''s resignation; in the afternoon, Weaver on his way
        with it: "I don''t want him to resign! ... he''s on it, and I''m going to make a selection in January"; "He''s got
        to resign to the President." Weaver takes his letter back; that night he will sit it out. Young, Wilkins and Frank
        Horne''s letter-writers for him. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 128–29. To check: Watson to Johnson, Nov. 18, 1965, with Carter to Watson
        and Frank Horne''s letter of Nov. 8, 1965, Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 129
        n.21). The nomination: [[cal.1966-01-13.cities-and-housing]]. Names: Johnson, Weaver, Califano, Whitney Young, Wilkins.'
      tags:
      - name:johnson-lyndon-b
      - name:weaver-robert-c
