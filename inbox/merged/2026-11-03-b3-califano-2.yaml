        rows:
        - 'w.califano-triumph-and-tragedy-of 80: all'
        - 'via w.califano-triumph-and-tragedy-of 80 n.7: A-C'
- add:
    entry:
      id: cal.1967-06-14.poverty
      when: June 14
      date: '1967-06-14'
      thread: poverty
      c: 'After a day "pretty disgusted at" Cabinet officers guarding their turf and Senators running from a labor vote, Johnson
        to Shriver: "Sarge, you''re the only one that''s not letting me down."'
      n: '[[w.califano-triumph-and-tragedy-of]], 80. Names: Johnson, Shriver.'
      tags:
