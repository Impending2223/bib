- add:
    entry:
      id: cal.1967-04-09.railroads
      when: Apr. 9
      date: '1967-04-09'
      thread: railroads
      c: 'Sunday night, the Cabinet Room, Johnson back from Camp David; Siemiller''s machinists alone refuse to extend. Boyd,
        Ackley, McNamara, Vance and Wirtz: ask Congress for more time. Clifford: twenty days'' delay "is to take a great right
        a working man has away from him." Fortas: "the stove is too cold"; a statement only. Califano to draft both.'
      n: '[[w.califano-triumph-and-tragedy-of]], 189. To check: Califano to Johnson, Apr. 10, 1967, 2 a.m., with a "Draft
        Statement" and "Message on the Impending Nation-Wide Rail Strike," LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]],
        189 n.35). Names: Johnson, Siemiller, Boyd, Ackley, McNamara, Vance, Wirtz, Clifford, Fortas, Califano.'
      tags:
