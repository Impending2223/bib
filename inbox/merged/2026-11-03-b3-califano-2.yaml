- add:
    entry:
      id: cal.1965-10.conservation
      when: Oct.
      date: '1965-10'
      thread: conservation
      c: 'Johnson to Califano: no more talk of closing veterans hospitals, no controversial action anywhere in the government
        "until we get our beauty bill"; a special Cabinet meeting to round up votes. "You know I love that woman and she wants
        that highway beauty bill."'
      n: '[[w.califano-triumph-and-tragedy-of]], 84. Check: the days, Oct. 1–7. Names: Johnson, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
