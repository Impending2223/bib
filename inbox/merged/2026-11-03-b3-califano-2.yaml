- add:
    entry:
      id: cal.1967-02.labor
      when: Feb.
      date: '1967-02'
      thread: labor
      c: 'Califano, rushed to Miami by Johnson, asks the AFL-CIO''s Executive Council to hold off a vote on merging Labor
        and Commerce, which would fail two to one. Early March, the Council at lunch with Johnson; no give. Johnson will not
        hold Meany to his word: "You can''t ever ask a man to do something that will jeopardize his job." The merger sent
        to a committee.'
      n: '[[w.califano-triumph-and-tragedy-of]], 185. Check: the days. Names: Califano, Johnson, Meany.'
