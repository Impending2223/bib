      when: Feb. 11
      date: '1967-02-11'
      thread: press-and-broadcasting
      c: 'Saturday, the living quarters, the Pickles and Califano there, after a David Susskind show on his credibility. Johnson:
        "the credibility gap comes from four completely false stories and one that was half true": the $100 billion budget,
        the speeding in Texas, the canceled trip after Asia, the planes lost; and, Califano reminding him, "sputtering mad."'
      n: '[[w.califano-triumph-and-tragedy-of]], 174–75. Names: Johnson, Pickle, Califano.'
