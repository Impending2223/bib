      date: '1966-11-23'
      thread: transportation
      also:
      - court
      c: 'Thanksgiving Eve. Jacobsen from the Ranch: no commitment by Johnson, but Kennedy''s memorandum "sure sounds like
        it does commit"; why file a brief? Katzenbach: "pretty well a commitment"; Clark: the United States "is obligated
        to give the Court its views." Johnson that night: no brief, or one with Boyd''s view, for the merger.'
      n: '[[w.califano-triumph-and-tragedy-of]], 161. See [[cal.1966-11-21.transportation]]. Names: Jacobsen, Johnson, Robert
        Kennedy, Katzenbach, Ramsey Clark, Boyd.'
