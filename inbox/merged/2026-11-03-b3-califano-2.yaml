      when: Jan. 16
      date: '1966-01-16'
      thread: press-and-broadcasting
      c: 'McGrory in the *Evening Star*, her column a letter to Watson, whose operators log the callers to Johnson''s aides:
        not to credit her with ten calls to Califano, on two she "was merely trying to tell [his] secretary that [the] deadline
        had passed." Johnson rescinds the order, as if he had not known of it. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 170–71. Names: McGrory, Watson, Califano, Johnson.'
