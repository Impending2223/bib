- add:
    entry:
      id: cal.1965-10-07.conservation
      when: Oct. 7–8
      date: '1965-10-07'
      thread: conservation
      also:
      - congress
      c: The House on the highway beauty bill into the night of the party for the 89th Congress; Dole moves to put "Lady Bird"
        for "Secretary of Commerce"; the Republicans make it a party question; the vote about 1 a.m. Oct. 8, the Democrats
        carrying it. The States to regulate billboards and junkyards; 10 percent of highway funds the penalty.
      n: '[[w.califano-triumph-and-tragedy-of]], 84–85. Check: the vote, and the Record''s pages. Names: Dole.'
