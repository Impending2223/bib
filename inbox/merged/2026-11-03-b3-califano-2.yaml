        rows:
        - 'w.califano-triumph-and-tragedy-of 127: all'
        - 'via w.califano-triumph-and-tragedy-of 127 n.9: A'
- add:
    entry:
      id: cal.1965-11-02.cities-and-housing
      when: Nov. 2
      date: '1965-11-02'
      thread: cities-and-housing
      c: 'Katzenbach''s second opinion, "lapse" read as "to pass ... gradually": no need to name anyone by Nov. 9; the first
        opinion destroyed. Weaver to Califano: "embarrassing, downright humiliating"; he would resign. Johnson, at the Ranch,
        that evening: "Let him resign." By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 128. To check: Califano to Johnson, Nov. 4, 1965, 8:11 p.m., LBJ Library
        (cited by [[w.califano-triumph-and-tragedy-of]], 128 n.13). Names: Katzenbach, Weaver, Califano, Johnson.'
      tags:
      - name:katzenbach-nicholas
      - name:weaver-robert-c
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      src:
        c: ce29d501
        rows:
