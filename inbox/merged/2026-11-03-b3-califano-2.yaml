      when: Sept. 18
      date: '1965-09-18'
      thread: civil-rights-the-executive
      c: 'Saturday lunch in the Mansion, an hour. Johnson to Califano: fair housing by law, "a permanent national commitment;
        a presidential executive order can easily be changed"; the civil rights leaders slack on registration; "I want you
        and Nick to put together a plan and get the civil rights programs out from under the Vice President." By Califano''s
        account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 65–66. Names: Johnson, Califano, Katzenbach, Humphrey.'
      tags:
      - name:johnson-lyndon-b
