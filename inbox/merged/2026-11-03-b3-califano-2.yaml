      when: Dec.
      date: '1965-12'
      thread: economy
      also:
      - defense
      c: 'The defense budget for fiscal 1967, $60.5 billion: McNamara assumes the war ends June 30, 1967, without which $63
        to $65 billion; no pipeline after that date, a supplemental to come. His history for Johnson: in the Korean War Defense
        asked $164 billion, got $156 billion, spent $102 billion; Truman''s two budgets and four supplementals in fourteen
        months.'
      n: '[[w.califano-triumph-and-tragedy-of]], 111. Check: the days. To check: Califano to Johnson, Dec. 18, 1965, 12:25
        p.m., and Dec. 23, 1965, Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 111 n.12). Names: McNamara,
