      when: Aug. 7
      date: '1964-08-07'
      thread: poverty
      c: 'Shriver to Johnson: the poverty bill cannot pass the House unless Yarmolinsky is sacrificed; the North Carolina
        delegation and its allies demand he have no place in the new office.'
      n: '[[w.califano-triumph-and-tragedy-of]], 76. See [[cal.1964-08-08.poverty]]. Names: Shriver, Johnson, Yarmolinsky.'
