        - 'via w.califano-triumph-and-tragedy-of 60 n.13: B'
        - 'via w.califano-triumph-and-tragedy-of 61 n.16: D'
- add:
    entry:
      id: cal.1965-08-15.civil-disorders-watts
      when: Aug. 15
      date: '1965-08-15'
      thread: civil-disorders-watts
      c: 'Sunday morning. Johnson to Califano: "You work for the President. Not for McNamara. Not for Katzenbach. Not for
        Brown. And damn sure not for Yorty." His statement: congratulate Brown, law and order a local charge, against violence
        and the denial of an equal chance. Califano to ask King, Whitney Young, Wilkins and Randolph to condemn the violence;
        Brown to name McCone to inquire. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 61–63. The statement: [[cal.1965-08-15.states-and-cities]]. Names: Johnson,
        Califano, McNamara, Katzenbach, Pat Brown, Yorty, Martin Luther King, Whitney Young, Wilkins, Randolph, McCone.'
      tags:
