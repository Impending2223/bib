- add:
    entry:
      id: cal.1965-09.desegregation-schools
      when: Sept.
      date: '1965-09'
      thread: desegregation-schools
      also:
      - states-and-cities
      c: 'Twenty-nine Texas districts without plans. Johnson enlists Connally, telephones Edgar, the State''s education commissioner,
        has Jacobsen call each district: "Don''t embarrass your President." His notes to Jacobsen and Califano: "Please hurry
        and clear up once and for all." In the end every Texas district with federal funds complies. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 70. Check: the days, late August to mid-September. To check: Jacobsen to
        Johnson, Sept. 17, 1965, 5:30 p.m., LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 70 n.39). Names:
        Johnson, Connally, Jacobsen, Califano.'
      tags:
      - name:johnson-lyndon-b
