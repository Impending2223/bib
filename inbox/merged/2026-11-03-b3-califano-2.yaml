- add:
    entry:
      id: cal.1966-11-25.transportation
      when: Nov. 25
      date: '1966-11-25'
      thread: transportation
      also:
      - court
      c: 'Ackley, for the merger, to Marshall: Marshall "obviously unhappy" but finds it "inconceivable that the Solicitor
        General could fail to take a position." The new brief: no quarrel with the merits; the economic and transportation
        agencies think the merger "in the public interest and that its consummation should be promptly effected." Califano
        tells Saunders, at the Hay-Adams, he will be pleased.'
      n: '[[w.califano-triumph-and-tragedy-of]], 162–63. To check: Ackley to Marshall, Nov. 25, 1966, LBJ Library (cited by
        [[w.califano-triumph-and-tragedy-of]], 163 n.34). Names: Ackley, Thurgood Marshall, Califano.'
