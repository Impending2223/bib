      when: Aug. 21
      date: '1967-08-21'
      thread: press-and-broadcasting
      also:
      - school-aid
      c: 'Marjorie Hunter in the *New York Times*, the second lead on the front page: the Friday task force''s secret report
        on education, the programs to stay concentrated on poor urban and rural children. Califano had leaked it through an
        intermediary at Johnson''s order; Johnson chews out Cater for the leak.'
      n: '[[w.califano-triumph-and-tragedy-of]], 172. To check: Califano to Johnson, July 24, 1967, 11 a.m., Califano''s papers
