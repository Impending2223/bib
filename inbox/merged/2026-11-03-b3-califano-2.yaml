- add:
    entry:
      id: cal.1965-07-19.vietnam-july-decision
      when: July 19
      date: '1965-07-19'
      thread: vietnam-july-decision
      c: 'Bundy for Johnson, "The Reasons for Avoiding a Billion Dollar Appropriation in Vietnam": a challenge to the Soviets;
        talk of controls and inflation; "the false impression that we have to have guns, not butter"; Geneva. Johnson has
        it rewritten without the guns-and-butter point and "(like calling reserves)." By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 35. Check: the memorandum''s source note. Names: Bundy, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      src:
        c: deb73d67
        rows:
        - 'w.califano-triumph-and-tragedy-of 35: all'
- add:
    entry:
      id: cal.1965-07-21.vietnam-july-decision
      when: July 21
      date: '1965-07-21'
      thread: vietnam-july-decision
      c: 'Bundy to Johnson, 8 p.m.: announce the escalation as soon as possible, by Monday, July 26; the leadership called
        Sunday or Monday, the President to Congress Monday. McNamara: $2 billion now, "on the order of" $8 billion next year.'
      n: '[[w.califano-triumph-and-tragedy-of]], 36–37. To check: Bundy to Johnson, July 21, 1965, 8 p.m., LBJ Library (cited
        by [[w.califano-triumph-and-tragedy-of]], 37 n.10). See [[cal.1965-07-20.vietnam]]. Names: Bundy, Johnson, McNamara.'
      tags:
      - name:bundy-mcgeorge
