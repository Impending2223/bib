      thread: oil
      c: 'Duesenberry of the Council would hold oil prices down by raising import quotas; Udall resists. Johnson to Califano:
        "I''ve never intervened to help the domestic oil industry and I''m not going to intervene to hurt them"; guide Duesenberry,
        don''t "get personally involved." The quotas not relaxed.'
      n: '[[w.califano-triumph-and-tragedy-of]], 139. Check: the days. To check: Robson to Califano, Dec. 14 and 28, 1966,
