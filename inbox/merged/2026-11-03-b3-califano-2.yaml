- add:
    entry:
      id: cal.1965-10-25.economy
      when: Oct. 25
      date: '1965-10-25'
      thread: economy
      c: Aluminum. The General Services Administration, prodded by Johnson, tells the major companies it will sell 100,000
        tons from the stockpile; 1.4 million tons in excess, worth close to $700 million.
      n: '[[w.califano-triumph-and-tragedy-of]], 97–98. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
