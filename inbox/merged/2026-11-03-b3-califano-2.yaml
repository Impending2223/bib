- add:
    entry:
      id: cal.1964-08-15.poverty
      when: Aug. 15
      date: '1964-08-15'
      thread: poverty
      c: 'News conference. Asked whether Yarmolinsky was offered as a sacrifice to the Southerners: "no one, at any time,
        any place, anywhere, suggested to me anyone for any of these places"; Yarmolinsky "employed by the Defense Department."'
      n: 'The President''s News Conference of August 15, 1964, [1963–64 Pub. Papers 964](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=204)
        (Aug. 15, 1964). [[w.califano-triumph-and-tragedy-of]], 77. See [[cal.1964-08-08.poverty]]. Names: Yarmolinsky.'
      tags:
