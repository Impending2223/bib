      thread: economy
      c: 'Evening. Martin to Johnson for Balderston''s seat on the Board: Atherton Bean of Minneapolis, "too fine a man for
        anyone to think of him as my man, or yours." Martin has said he would resign if he found himself steadily in the minority.'
      n: '[[w.califano-triumph-and-tragedy-of]], 109. To check: Martin to Johnson, Feb. 1 and 2, 1966, LBJ Library (cited
