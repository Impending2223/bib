        rows:
        - 'w.califano-triumph-and-tragedy-of 178–79: all'
        - 'via w.califano-triumph-and-tragedy-of 179 n.8: all'
- add:
    entry:
      id: cal.1966-12-31.program
      when: Dec. 31
      date: '1966-12-31'
      thread: program
      c: 'News conference at the Ranch: "We must continue the war against our ancient enemies"; the nation, with a gross national
        product of $700 to $800 billion, "can afford what it needs to spend. And I shall so recommend." Mansfield had asked
        the chairmen two days before for a top-to-bottom review of the programs.'
      n: 'The President''s News Conference at the LBJ Ranch, [1966 Pub. Papers 1458](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=832)
        (Dec. 31, 1966). [[w.califano-triumph-and-tragedy-of]], 180–81. Names: Johnson, Mansfield.'
      tags:
