- add:
    entry:
      id: cal.1966-01-29.vietnam-pause-3
      when: Jan. 29
      date: '1966-01-29'
      thread: vietnam-pause
      c: 'The NSC with the Joint Chiefs, Califano present: the Chiefs'' "highest priority on resuming bombing"; Harold Johnson:
        "surge troops in, doubling and tripling the number," an emergency, the reserves. Johnson: "Senator McCarthy wants
        to know how much it really stops." Califano to Johnson that afternoon: the case for resuming "totally unconvincing";
        get a good lawyer to argue it to Congress and the public.'
      n: '[[w.califano-triumph-and-tragedy-of]], 120–21 (Califano''s notes). To check: notes of the NSC meeting of Jan. 29,
        1966, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 121 n.30). See [[cal.1966-01-29.vietnam-pause]].
        Names: Califano, Harold Johnson, Lyndon Johnson, McCarthy.'
