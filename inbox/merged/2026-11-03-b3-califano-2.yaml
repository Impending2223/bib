      id: cal.1965-09-08.economy
      when: Sept. 8
      date: '1965-09-08'
      thread: economy
      c: 'Califano to Johnson, 7:45 p.m.: stockpile sales of $550 million in fiscal 1966, $700 million the next. Johnson pencils:
        "Joe, shouldn''t we set goals, call in Cong leaders, incl chr of committees, & sell 1 Bil if possible."'
      n: '[[w.califano-triumph-and-tragedy-of]], 97. To check: Califano to Johnson, Sept. 8, 1965, 7:45 p.m., LBJ Library
        (cited by [[w.califano-triumph-and-tragedy-of]], 97 n.37). Names: Califano, Johnson.'
      tags:
