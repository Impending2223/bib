- add:
    entry:
      id: cal.1965-07-08.transition-and-staff
      when: July 8
      date: '1965-07-08'
      thread: transition-and-staff
      c: 'Valenti to Califano: Reedy resigning today, Moyers to be press secretary, Califano to take Moyers''s place: the
        legislative program, domestic crises. McNamara: he has the President''s word Califano will coordinate economic policy.
        That evening at the mess, Johnson''s dinner for the chairmen of the 1964 task forces; Califano introduced as of his
        staff.'
      n: '[[w.califano-triumph-and-tragedy-of]], 18–19. Names: Valenti, Califano, Reedy, Moyers, McNamara, Johnson.'
      tags:
      - name:valenti-jack
      - name:califano-joseph-a-jr
