    entry:
      id: cal.1966-05-28.crime-and-hijacking
      when: May 28
      date: '1966-05-28'
      thread: crime-and-hijacking
      c: 'After Edward Long''s subcommittee on the Internal Revenue Service''s eavesdropping, Sheldon Cohen''s explanation
        to Johnson: the practices "simply not [wrong] ... in the eyes of the law or of reasonable people." Johnson on it:
        "Sheldon—Stop it all at once—and this is final—no microphones—taps or any other hidden devices, legal or illegal if
        you are going to work for me."'
      n: '[[w.califano-triumph-and-tragedy-of]], 187. To check: Watson to Johnson, May 28, 1966, 3:35 p.m., with Cohen to
        Watson, May 27, 1966, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 187 n.30). Names: Edward Long,
        Sheldon Cohen, Johnson.'
      tags:
