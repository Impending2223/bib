- add:
    entry:
      id: cal.1967-10-13.states-and-cities
      when: Oct. 13
      date: '1967-10-13'
      thread: states-and-cities
      c: 'The Fish Room, the District''s Council, mayor and deputy mayor: "the people of Washington are about as franchised
        as we can get them"; Blondin on the tightrope over Niagara: "pray like crazy ... cheer like hell."'
      n: '[[w.califano-triumph-and-tragedy-of]], 241. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
