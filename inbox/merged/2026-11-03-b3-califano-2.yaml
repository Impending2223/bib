        - 'via w.califano-triumph-and-tragedy-of 63 n.17: all'
- add:
    entry:
      id: cal.1965-08-24.civil-disorders-watts
      when: Aug. 24
      date: '1965-08-24'
      thread: civil-disorders-watts
      c: 'Califano and Lee White to Johnson, the package for Watts: remedial education, health, jobs, small business, surplus
        food, housing, pilot child-care centers to "provide care for children; thus freeing mothers for training and employment."
        Johnson wants the Guard in every State trained for civil disturbances, orders on live ammunition.'
      n: '[[w.califano-triumph-and-tragedy-of]], 63. To check: Califano and Lee White to Johnson, Aug. 24, 1965, LBJ Library
        (cited by [[w.califano-triumph-and-tragedy-of]], 63 n.19). The program announced: [[cal.1965-08-26.states-and-cities]].
        Names: Califano, Lee White, Johnson.'
      tags:
      - name:califano-joseph-a-jr
      - name:white-lee-c
      - name:johnson-lyndon-b
      src:
        c: '32dad9c7'
        rows:
