- add:
    entry:
      id: cal.1968-04-27.vietnam-paris-2
      when: Apr. 27
      date: '1968-04-27'
      thread: vietnam-paris
      c: 'Raimondi, the Apostolic Delegate, to Califano, for Johnson: Paul VI ready to offer the Vatican as a site for the
        first meeting. Johnson: "the sooner the Pope makes an announcement of his invitation the better," publicly and without
        notice to Hanoi. The Pope prefers diplomatic channels; Johnson accepts.'
      n: '[[w.califano-triumph-and-tragedy-of]], 326–27. Names: Raimondi, Califano, Johnson.'
      tags:
      - name:raimondi-luigi
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      src:
        c: '04755761'
        rows:
        - 'w.califano-triumph-and-tragedy-of 326–27: all'
- add:
    entry:
      id: cal.1969-01-06.economy-surcharge
      when: Jan. 6
      date: '1969-01-06'
      thread: economy-surcharge
      c: 'The Democratic leaders'' breakfast, Edward Kennedy''s first and only, as Whip: Johnson for no extension of the surcharge.
        Robert Byrd, Mansfield, McCormack, Albert and Boggs agree; Mansfield, on "the only facts I have." Kennedy for extending
        it. Johnson to Califano: "tear up" his notes on "the Kennedy thing."'
      n: '[[w.califano-triumph-and-tragedy-of]], 331–32. Names: Johnson, Edward Kennedy, Robert Byrd, Mansfield, McCormack,
        Albert, Boggs, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-edward-m
      - name:byrd-robert-c
      - name:mansfield-mike
      - name:mccormack-john-w
