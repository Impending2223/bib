- add:
    entry:
      id: cal.1967-05-03.railroads
      when: May 3
      date: '1967-05-03'
      thread: railroads
      c: 'Johnson with Meany, Goldberg and Califano there: cigars from Paraguay''s President, a Rayburn story. Meany for seizure,
        nothing else; "the solution may be nationalization"; Javits "just trying to embarrass you." Johnson: "George, all
        we''re talking about here is a few lousy pieces of silver"; "Don''t oppose it too damn much." Meany: "I won''t testify
        unless I have to testify."'
      n: '[[w.califano-triumph-and-tragedy-of]], 192–93. Names: Johnson, Meany, Goldberg, Califano, Javits.'
      tags:
      - name:johnson-lyndon-b
      - name:meany-george
      - name:goldberg-arthur-j
