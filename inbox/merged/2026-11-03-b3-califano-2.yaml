- add:
    entry:
      id: cal.1965-08.defense
      when: Aug.
      date: '1965-08'
      thread: defense
      c: 'The members'' count in, Johnson takes thirty days'' notice at most: "I suggest you start listening to what I say
        instead of thinking what I say." McNamara, who had sold Russell and Rivers sixty: "Goddamnit ... They can count too."
        By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 96–97. Check: the day. The act signed: Statement by the President Upon Signing
        the Military Construction Authorization Act, [1965 Pub. Papers 1003](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=477)
        (Sept. 16, 1965). Names: Johnson, McNamara, Russell, Rivers.'
