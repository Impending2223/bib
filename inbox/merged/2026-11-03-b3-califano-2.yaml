      when: July 28
      date: '1965-07-28'
      thread: defense
      c: 'The Pentagon, the Defense Department''s cost reduction awards. In the car Johnson tells Califano and Moyers: an
        alarm clock at the Vietnam briefings, five minutes. On the way back: announce the Voice of America''s head and a Justice
        for the evening news.'
      n: 'Remarks at the Department of Defense Cost Reduction Awards Ceremony, [1965 Pub. Papers 790](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=264)
