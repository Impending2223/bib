      - name:boggs-hale
      - name:califano-joseph-a-jr
      src:
        c: '6aefb2b7'
        rows:
        - 'w.califano-triumph-and-tragedy-of 331–32: all'
- add:
    entry:
      id: cal.1969-01-10.economy-surcharge
      when: Jan. 10
      date: '1969-01-10'
      thread: economy-surcharge
      c: 'After Califano''s memorandum against a budget without the surcharge ("a ''phony budget''"), torn up by Johnson''s
        order, Johnson meets Zwick, Barr, Okun and McPherson without him; at 6:22 p.m. to Califano and Levinson: "make this
        message bleed." The drafts extend the full surcharge through fiscal 1970; Johnson had talked Nixon into backing it
        that afternoon.'
      n: '[[w.califano-triumph-and-tragedy-of]], 332–33. Names: Califano, Johnson, Zwick, Barr, Okun, McPherson, Levinson,
        Nixon.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:zwick-charles-j
      - name:barr-joseph-w
      - name:okun-arthur-m
      - name:mcpherson-harry
      - name:levinson-lawrence-e
      - name:nixon-richard-m
      src:
        c: '39dc6e88'
        rows:
        - 'w.califano-triumph-and-tragedy-of 332–33: all'
- add:
    entry:
      id: cal.1969-01-19.transition-and-staff
      when: Jan. 19
      date: '1969-01-19'
      thread: transition-and-staff
      c: 'Johnson''s last full day: mass with Luci in the solarium; the National City Christian Church with Billy Graham;
        Humphrey''s call; Rusk and Harriman to say goodbye; Johnson to Rockefeller, thanking him; the staff''s buffet: of
        Fulbright, "We never should have let the fight become so personal"; one more act, more land for the parks. To bed
        before 11:29 p.m.'
      n: '[[w.califano-triumph-and-tragedy-of]], 334–38. Names: Johnson, Graham, Humphrey, Rusk, Harriman, Rockefeller, Fulbright.'
      tags:
      - name:johnson-lyndon-b
      - name:graham-billy
      - name:humphrey-hubert-h
      - name:rusk-dean
      - name:harriman-w-averell
      - name:rockefeller-nelson
      - name:fulbright-j-william
      src:
        c: d7132630
        rows:
        - 'w.califano-triumph-and-tragedy-of 334–38: all'
