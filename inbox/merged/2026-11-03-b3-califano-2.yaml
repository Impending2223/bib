      when: Nov. 15
      date: '1966-11-15'
      thread: health
      c: 'Johnson to Califano on the bishops: the "President is entitled to better treatment"; Shriver to deny the charge
        and answer their letter; find out whether Cushing was behind it, "probably Bobby." Califano with Hurley: talk of "the
        population problem," not birth control, and the bishops may lie back. Dearden''s letter of prayers as Johnson enters
        Bethesda: "they can stop attacking me in the press."'
      n: '[[w.califano-triumph-and-tragedy-of]], 157–58. To check: Califano to Johnson, Nov. 15, 1966, 1:30 p.m. and 8 p.m.,
        with Dearden to Johnson, Nov. 15, Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 158 n.15). Names:
        Johnson, Califano, Shriver, Cushing, Robert Kennedy, Dearden.'
