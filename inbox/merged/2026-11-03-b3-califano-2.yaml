- add:
    entry:
      id: cal.1963-11-24.assassination-3
      when: Nov. 24
      date: '1963-11-24'
      thread: assassination
      c: 'Califano''s legal opinion on the title, from a title search, and an order setting the 3.2 acres aside for the grave
        for good: signed by Vance; McNamara signs it too, in his car at the cemetery.'
      n: '[[w.califano-triumph-and-tragedy-of]], 14. To check: Califano to Vance, Nov. 24, 1963, and the order, signed by
        Vance and McNamara, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 14 n.2). See [[cal.1963-11-23.assassination]].
        Names: Califano, Vance, McNamara.'
