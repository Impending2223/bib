        - 'w.califano-triumph-and-tragedy-of 77: all'
- add:
    entry:
      id: cal.1964-08.transition-and-staff
      when: Aug.
      date: '1964-08'
      thread: transition-and-staff
      also:
      - poverty
      c: 'A Saturday morning after the House vote. McNamara to Califano, his special assistant in Yarmolinsky''s place, shaken
        by Yarmolinsky''s treatment: "When the President, or one of his major programs, is involved, none of us is important.
        Everyone''s expendable." By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 77. Check: the day, Aug. 8 or 15. Names: McNamara, Califano, Yarmolinsky.'
      tags:
      - name:mcnamara-robert-s
      - name:califano-joseph-a-jr
      - name:yarmolinsky-adam
      src:
        c: '2b950d89'
        rows:
        - 'w.califano-triumph-and-tragedy-of 77: all'
- add:
    entry:
      id: cal.1965-10-20.poverty
      when: Oct. 20
      date: '1965-10-20'
      thread: poverty
      c: 'Shriver to Johnson: a plan "to end poverty in the United States, as we know it today, within a generation," housing
        to a negative income tax. Johnson takes it for a Kennedy manifesto written to leak. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 79. To check: Shriver to Johnson, Oct. 20, 1965, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]],
        79 n.4). Names: Shriver, Johnson.'
      tags:
      - name:shriver-r-sargent
      - name:johnson-lyndon-b
