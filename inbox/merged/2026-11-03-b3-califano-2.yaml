      date: '1965-08-25'
      thread: steel
      c: 'News conference: "I expect full and complete responsibility in the current wage negotiations and I expect continued
        stability in steel prices." Blough to Connor: the remark on price stability "very troublesome."'
      n: 'The President''s News Conference of August 25, 1965, [1965 Pub. Papers 917](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=391)
