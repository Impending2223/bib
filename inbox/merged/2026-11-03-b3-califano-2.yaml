      when: Nov. 21
      date: '1966-11-21'
      thread: transportation
      also:
      - court
      c: 'Penn-Central. Saunders to Califano: commitments from Robert Kennedy as Attorney General, and from Johnson, that
        Justice would not oppose the merger once the examiner approved; Kennedy''s memorandum of Sept. 3, 1964, sent by Katzenbach.
        Ramsey Clark, Acting Attorney General: not binding. Califano to Johnson, 7 p.m.: without word from the White House,
        Clark will ask the Supreme Court to send the case back to the ICC.'
      n: '[[w.califano-triumph-and-tragedy-of]], 159–61. To check: Califano to Johnson, Nov. 21, 1966, 7 p.m., with Katzenbach
        to Saunders, Sept. 4, 1964, and Robert Kennedy''s memorandum for the files, Sept. 3, 1964, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]],
        161 n.21, 160 n.23). Names: Califano, Robert Kennedy, Johnson, Katzenbach, Ramsey Clark.'
      tags:
