      when: Aug. 30
      date: '1965-08-30'
      thread: steel
      c: 'After the meeting, Johnson''s secret channel: Goldberg to the union, Clifford, counsel to Republic Steel, to the
        companies; Califano meets them in the military aide''s office in the East Wing; Wirtz and Connor not told. Eisenhower
        at the White House that afternoon, briefed by Califano, before the press with Johnson. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 91. See [[cal.1965-08-30.steel]]. Names: Johnson, Goldberg, Clifford, Califano,
        Wirtz, Connor, Eisenhower.'
