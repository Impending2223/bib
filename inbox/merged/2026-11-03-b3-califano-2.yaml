- add:
    entry:
      id: cal.1967-10-11.states-and-cities
      when: Oct. 11
      date: '1967-10-11'
      thread: states-and-cities
      c: 'Kampelman asked by Califano to withdraw as the Council''s chairman. Hechinger, chosen the night before, at Johnson''s
        order kept in Califano''s office, the hotline ringing; then to the living quarters: "I need you right here." Johnson:
        "On that tax matter, Joe will have the bill at your house in the morning." Christian announces him.'
      n: '[[w.califano-triumph-and-tragedy-of]], 236–41. Names: Kampelman, Califano, Hechinger, Johnson, Christian.'
      tags:
