- add:
    entry:
      id: cal.1967-06-12.economy-surcharge
      when: June 12
      date: '1967-06-12'
      thread: economy-surcharge
      c: 'Califano to Johnson: the advisers still at odds on the timing, Wirtz and Ginsburg doubtful. Johnson: "For God''s
        sake get agreement. L." By June 17 they agree to ask after the July 4 recess.'
      n: '[[w.califano-triumph-and-tragedy-of]], 243. Names: Califano, Johnson, Wirtz, Ginsburg.'
      tags:
      - name:califano-joseph-a-jr
