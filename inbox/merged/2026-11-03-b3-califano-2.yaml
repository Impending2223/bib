- add:
    entry:
      id: cal.1965-09-02.steel
      when: Sept. 2
      date: '1965-09-02'
      thread: steel
      c: 'Johnson to the negotiators again: an agreement so he can go to the Ranch and Lady Bird for Labor Day; a sound settlement
        and they are all invited to the inauguration of January 1969. About midnight he sets Connor and Wirtz, who cannot
        agree on the costs of the benefits, to negotiate with each other, Califano mediating: "If you two can''t agree, how
        the hell can we expect Abel and Cooper to agree?"'
      n: '[[w.califano-triumph-and-tragedy-of]], 92–93. To check: Califano to Johnson, Sept. 2, 1965, 10:35 a.m., with "Points
        for Visit to Steel Negotiators," Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 92 n.22). Names:
        Johnson, Connor, Wirtz, Califano, Abel, Cooper.'
      tags:
