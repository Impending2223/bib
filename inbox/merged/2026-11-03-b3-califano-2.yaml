- add:
    entry:
      id: cal.1967-08-23.defense
      when: Aug. 23
      date: '1967-08-23'
      thread: defense
      c: 'After the Cabinet, McNamara to Califano: he may be recommended for the World Bank; "for God''s sake, so you don''t
        tell the President I''m indispensable if he asks you."'
      n: '[[w.califano-triumph-and-tragedy-of]], 249. The nomination: [[cal.1967-11-29.defense]]. Names: McNamara, Califano.'
      tags:
