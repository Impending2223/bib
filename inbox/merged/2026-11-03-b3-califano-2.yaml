- add:
    entry:
      id: cal.1965-09-18.conservation
      when: Sept. 18
      date: '1965-09-18'
      thread: conservation
      c: 'O''Brien to Johnson: "our performance to date on the Highway Beauty bill has fallen far below the standards of our
        usual work"; "our unnecessary harassment of friendly members"; the billboard lobby "singularly ineffective"; the trouble
        "our own bungling," much of it the President''s.'
      n: '[[w.califano-triumph-and-tragedy-of]], 84. To check: O''Brien to Johnson, Sept. 18, 1965, LBJ Library (cited by
        [[w.califano-triumph-and-tragedy-of]], 84 n.13). Names: O''Brien, Johnson.'
