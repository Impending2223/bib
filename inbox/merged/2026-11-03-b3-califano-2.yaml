- add:
    entry:
      id: cal.1965-10-27.cities-and-housing
      when: Oct. 27
      date: '1965-10-27'
      thread: cities-and-housing
      c: 'Weaver to Califano with papers for Johnson to sign within two weeks, naming the Housing Secretary or an acting one
        by Nov. 9 as the act requires. Johnson has not settled on Weaver; Katzenbach''s first opinion: he must act. Johnson:
        "Now find another way to look at this." By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 127. Check: Califano''s text dates Weaver''s visit Oct. 17; his note, his
        Day-at-a-Glance of Oct. 27 (127 n.9). See [[cal.1965-09-09.cities-and-housing]]. Names: Weaver, Califano, Johnson,
        Katzenbach.'
      tags:
