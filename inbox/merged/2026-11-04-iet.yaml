  - add:
      entry:
        id: cal.1963-10-21.economy
        when: Oct. 21–24
        date: '1963-10-21'
        thread: economy
        c: Ways and Means in executive session on H.R. 8000, with the coffee agreement bill on Oct. 21–22. No final action.
        n: Daily Digest, [109 Cong. Rec. D507](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=505); [109 Cong. Rec. D511](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=509); [109 Cong. Rec. D513](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=511); [109 Cong. Rec. D516](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=514). See [[cal.1963-08-20.economy]].
