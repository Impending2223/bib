  - add:
      entry:
        id: cal.1963-09-12.economy
        when: Sept. 12
        date: '1963-09-12'
        thread: economy
        c: 'Kennedy''s memorandum for the record, after the discussions of Sept. 11: Defense to find further savings abroad; the Treasury to study broadening the interest equalization tax to bank loans, dissuading investment abroad, and asking the European ministers and central bankers to slow American direct investment there; the Treasury to plan for direct controls on capital if the tax fails of enactment, the balance does not improve early in 1964, or a crisis comes. Galbraith, Tobin and Kaysen to write.'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 33](https://history.state.gov/historicaldocuments/frus1961-63v09/d33) (a version addressed to McNamara, Dillon, Ball, Roosa, Bell, Heller, Gordon, Sorensen, Bundy, Galbraith, Kaysen and Tobin, apparently withdrawn, in the note; no record of the discussions found). Made public: FRUS 1961–63, IX (1995). See [[cal.1963-08-28.economy]]. Names: Kennedy, Galbraith, Tobin, Kaysen.'
        src:
