patch: iet
by: 'Claude (the event pass on the Interest Equalization Tax: the Record, the Statutes, FRUS, the Public Papers, the Bulletin, Meltzer), Nov. 4, 2026'
ops:
  - add:
      entry:
        id: cal.1963-07-17.economy
        when: July 17
        date: '1963-07-17'
        thread: economy
        c: 'State to the missions, by circular telegram, 9:51 p.m.: the balance of payments message at noon July 18. To draw attention abroad: about $1 billion a year less in the government''s dollar spending overseas; an interest equalization tax adding about 1 percent to foreigners'' cost of capital here; a $500 million IMF standby. Nothing to be released before the hour.'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 76](https://history.state.gov/historicaldocuments/frus1961-63v09/d76) (drafted by Widman of the Treasury and Caplan; cleared by Roosa). Made public: FRUS 1961–63, IX (1995). See [[cal.1963-07-18.economy]]. Names: Rusk.'
        src:
          c: 11190aaf
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d76: all'
        tags: [name:rusk-dean]
  - add:
      entry:
        id: cal.1963-07-19.economy
        when: July 19
        date: '1963-07-19'
        thread: economy
        c: 'Ritchie, the Canadian ambassador, with Rusk and Ball, at his urgent request: the news of the measures has sent Canada''s stock markets down; they will bear most heavily on Canada; the Conservative opposition and the press call them retaliation for Canada''s budget. Ball: no retaliation or discrimination; the tax to slow, not stop, foreign use of the money markets, in place of capital controls; defects can be corrected in the legislative process. State has denied retaliation to the press; Roosa has briefed the Canadian correspondents.'
        n: '[FRUS 1961–63, XIII: Western Europe and Canada, doc. 452](https://history.state.gov/historicaldocuments/frus1961-63v13/d452) (Carlson''s memorandum). Made public: FRUS 1961–63, XIII (1994). To check: Rasminsky''s account of his conversation with Dillon, in Peter Stursberg, *Lester Pearson and the American Dilemma*, 189–92 (cited by FRUS 1961–63, XIII, doc. 452, source note). See [[cal.1963-07-18.economy]]. Names: Ritchie, Rusk, Ball, Roosa.'
        src:
          c: 59d693d7
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d452: all'
        tags: [name:ritchie-charles-s-a, name:rusk-dean, name:ball-george-w, name:roosa-robert-v]
  - add:
      entry:
        id: cal.1963-07-20.economy
        when: July 20
        date: '1963-07-20'
        thread: economy
        c: 'Treasury''s supplemental release, "in view apparent misunderstanding abroad": July 19 remains the tax''s effective date for new issues and for purchases outside the registered exchanges; purchases on the exchanges registered with the SEC are not taxed through Aug. 16, as Treasury announced at 6:15 p.m. on July 18. State asks the embassies to spread it.'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v09/d77) (State to London, 8:20 p.m., repeated to Paris, Bonn, Rome, The Hague, Brussels, Ottawa and Tokyo). The announcement of July 18: [[w.department-of-state-bulletin]], [Aug. 12, 1963, 256 n.](https://archive.org/details/departmentofstat491963unit/page/256/mode/1up). See [[cal.1963-07-18.economy]].'
        src:
          c: aae6a2ed
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d77: all'
            - 'https://archive.org/details/departmentofstat491963unit/page/256/mode/1up: B'
  - add:
      entry:
        id: cal.1963-07-21.economy
        when: July 21
        date: '1963-07-21'
        thread: economy
        c: 'Joint Canadian–United States statement, released at Ottawa and Washington after the weekend''s talks in Washington: the tax would require "a very substantial rise in the entire Canadian interest rate structure." The bill to let the President exempt new issues, without limit or within one; outstanding securities still taxed. Canada not to raise its reserves by borrowing here; both hope for "an unlimited exemption for Canada."'
        n: '[[w.department-of-state-bulletin]], [Aug. 12, 1963, 256](https://archive.org/details/departmentofstat491963unit/page/256/mode/1up) (Treasury''s release). Rasminsky, governor of the Bank of Canada, negotiated the exemption: Dillon to Johnson, Jan. 15, 1965, [FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 28](https://history.state.gov/historicaldocuments/frus1964-68v08/d28). Check: Canada''s representatives (the statement names none). See [[cal.1963-07-18.economy]].'
        src:
          c: 5447ffeb
          rows:
            - 'https://archive.org/details/departmentofstat491963unit/page/256/mode/1up: all'
  - add:
      entry:
        id: cal.1963-07-23.economy
        when: July 23
        date: '1963-07-23'
        thread: economy
        c: 'Bonn to State: German opinion on the program soured over the weekend. The Canadian exception, doubts of enforcement and the rumored exception for Japan make many think the tax ineffective; some fear it will draw the United States into exchange controls. The Bundesbank (Emminger) and the Economics Ministry still support it, but privately are disappointed by the Canadian exception. The *Frankfurter Allgemeine*: the program "not thought through."'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 78](https://history.state.gov/historicaldocuments/frus1961-63v09/d78) (telegram 314, 7 p.m., Hillenbrand). Made public: FRUS 1961–63, IX (1995). See [[cal.1963-07-21.economy]]. Names: Hillenbrand, Emminger.'
        src:
          c: bb7a9ee6
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d78: all'
        tags: [name:hillenbrand-martin-j, name:emminger-otmar]
  - add:
      entry:
        id: cal.1963-07-23.economy-2
        when: July 23
        date: '1963-07-23'
        thread: economy
        c: 'Sproul to Blough, by letter: the Blough commission has reported to Dillon for lower taxes, higher interest rates and less military aid and government spending abroad, but not for the interest equalization tax. Sproul''s complaints of the administration: "there never was enough power and pressure put behind tax reduction"; "happy illusions" about the deficit; interest rates raised too late.'
        n: '[[w.meltzer-history-of-the-federal]], 424 (by the letter, Sproul papers). To check: Sproul to Blough, July 23, 1963, Sproul papers (cited by [[w.meltzer-history-of-the-federal]], 424). Check: the commission, Meltzer''s "Blough commission." See [[cal.1963-07-18.economy]]. Names: Blough, Dillon.'
        src:
          c: de3c06a3
          rows:
            - 'w.meltzer-history-of-the-federal 424: all'
            - 'via x.2009.meltzer-424-sproul-to-blough: all'
        tags: [name:blough-roger-m, name:dillon-c-douglas]
  - add:
      entry:
        id: cal.1963-07-26.japan-and-korea
        when: July 26
        date: '1963-07-26'
        thread: japan
        also: [economy]
        c: 'Dillon hands Takeuchi his letter answering the Japanese minister''s of July 24, which asked an exemption: no consulting abroad was possible before the announcement; direct controls contrary to "our basic precept of free markets"; the tax will deter some Japanese borrowers, "but not all"; Canada''s exemption "unusual," for new issues only. Talks with Roosa this week. Dillon shows Takeuchi a release saying Japan will have no exemption; Takeuchi objects, and Dillon holds it.'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 79](https://history.state.gov/historicaldocuments/frus1961-63v09/d79) (State''s circular telegram 176, 10:08 p.m., the letter''s text; the release, by circular telegram 179, July 27, in the note). Made public: FRUS 1961–63, IX (1995). To check: the minister''s letter of July 24, 1963 (not found, FRUS 1961–63, IX, doc. 79 n.2). Check: the minister (FRUS does not name him). See [[cal.1963-07-21.economy]]. Names: Dillon, Takeuchi, Roosa.'
        src:
          c: 57739d02
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d79: all'
        tags: [name:dillon-c-douglas, name:takeuchi-ryuji, name:roosa-robert-v]
  - add:
      entry:
        id: cal.1963-07-29.japan-and-korea
        when: July 29
        date: '1963-07-29'
        thread: japan
        also: [economy]
        c: 'Takeuchi with Ball: the Tokyo market down another 59.54 points that day, to its lowest since the war, on reports that no exemption will be given Japan; Ikeda and Tanaka saying the measures will be moderated. Will the bill name the countries exempted or leave it to the President? If Canada is named, Japan must hurry; two Cabinet ministers may be sent. Ball: sure no country will be named; State would oppose a bill that did not leave exemptions to the President.'
        n: '[FRUS 1961–63, VII–IX, microfiche supp., doc. 364](https://history.state.gov/historicaldocuments/frus1961-63v07-09mSupp/d364) (the memorandum of conversation; Goldstein and Vettel present). Made public: FRUS 1961–63, VII–IX, microfiche supp. (1997). See [[cal.1963-07-26.japan-and-korea]]. Names: Takeuchi, Ball, Ikeda, Tanaka.'
        src:
          c: 46154d06
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v07-09mSupp/d364: all'
        tags: [name:takeuchi-ryuji, name:ball-george-w, name:ikeda-hayato, name:tanaka-kakeui, name:vettel-thelma-e]
  - add:
      entry:
        id: cal.1963-07-29.economy-2
        when: July 29
        date: '1963-07-29'
        thread: economy
        c: 'Coombs to the Board, by telegram: the higher discount rate "brought about a significant improvement in dollar exchange rates on the following day. This favorable reaction has been almost obliterated, however, by the Presidential message . . . calling for an interest equalization tax." The rest on his operations in the gold and exchange markets.'
        n: '[[w.meltzer-history-of-the-federal]], 418–19 & n.256 (by the telegram, Board Records). To check: Coombs to the Board, July 29, 1963, Board Records (cited by [[w.meltzer-history-of-the-federal]], 419). See [[cal.1963-07-18.economy]]. Names: Coombs.'
        src:
          c: 78d764b2
          rows:
            - 'w.meltzer-history-of-the-federal 418–19 & n.256: all'
            - 'via x.2009.meltzer-419-coombs-telegram: all'
        tags: [name:coombs-charles-a]
  - add:
      entry:
        id: cal.1963-07-29.economy-3
        when: July 29
        date: '1963-07-29'
        thread: economy
        c: 'Coombs to Sproul, by letter, answering his comments on the tax: "I hasten to assure you that neither Al Hayes nor I hatched this ''turkey'' . . . but we have been doing our best to minimize . . . its unsettling effects on the markets."'
        n: '[[w.meltzer-history-of-the-federal]], 424 n.264 (by the letter, Sproul papers). To check: Coombs to Sproul, July 29, 1963, Sproul papers (cited by [[w.meltzer-history-of-the-federal]], 424 n.264). See [[cal.1963-07-23.economy-2]]. Names: Coombs.'
        src:
          c: ebdad716
          rows:
            - 'w.meltzer-history-of-the-federal 424 n.264: all'
            - 'via x.2009.meltzer-424-coombs-to-sproul: all'
        tags: [name:coombs-charles-a]
  - add:
      entry:
        id: cal.1963-07-30.economy
        when: July 30
        date: '1963-07-30'
        thread: economy
        c: 'The Open Market Committee. Hayes: the tax has brought a boom in foreign term loans in place of securities. The staff: no effect of the announcements on covered interest differentials. Balderston: controls where they would work, on the government''s own spending and lending abroad. Martin denies a commitment to the administration on monetary policy.'
        n: '[[w.meltzer-history-of-the-federal]], 418, 420 & n.259 (by the minutes). To check: FOMC Minutes, July 30, 1963, 6, 55 (cited by [[w.meltzer-history-of-the-federal]], 418, 420). See [[cal.1963-07-18.economy]]. Names: Balderston, Martin.'
        src:
          c: dcaabfe9
          rows:
            - 'w.meltzer-history-of-the-federal 418: E'
