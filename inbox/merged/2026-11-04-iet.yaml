  - add:
      entry:
        id: cal.1965-01-15.economy
        when: Jan. 15
        date: '1965-01-15'
        thread: economy
        c: 'Dillon to Johnson, before Pearson''s visit to the Ranch: Canada to keep restraint on its new issues here under its exemption from the tax. New Canadian issues $676 million in 1964, $359 million of it in the fourth quarter, held back until the act and the exemption; Canada''s reserves up $81 million. Gordon has asked the provinces to borrow at home; the Bank of Canada has narrowed the long-term differential to about .80 percent. Johnson might warn of a ceiling on Canadian borrowing after the tax is extended.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 28](https://history.state.gov/historicaldocuments/frus1964-68v08/d28). Made public: FRUS 1964–68, VIII (1998). See [[cal.1963-07-21.economy]]. Names: Dillon, Johnson, Pearson, Gordon.'
        src:
          c: 7bca625d
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d28: all'
        tags: [name:dillon-c-douglas, name:johnson-lyndon-b, name:pearson-lester-b, name:gordon-walter-a]
  - add:
      entry:
        id: cal.1965-02-09.economy-2
        when: Feb. 9
        date: '1965-02-09'
        thread: economy
        c: 'Bundy to Johnson, for his call to Pearson: Pearson''s consent to a sentence in the message that Canada will hold its borrowing to levels "consistent with that special exemption"; else a strict dollar limit. Johnson to tell him the Gore amendment will be invoked, the tax on bank loans of a year or more, no exemption for Canada. Dillon''s memorandum of Feb. 8: new Canadian issues $687 million in 1964; Deming has met Plumptre, the Canadian Deputy Minister of Finance.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 41](https://history.state.gov/historicaldocuments/frus1964-68v08/d41) (with Tab A). Made public: FRUS 1964–68, VIII (1998). Check: whether the call was made. See [[cal.1965-01-15.economy]]. Names: Bundy, Johnson, Pearson, Gore, Dillon, Deming.'
        src:
