  - add:
      entry:
        id: cal.1964-08-04.economy
        when: Aug. 4
        date: '1964-08-04'
        thread: economy
        c: 'Senate passes H.R. 8000, amended, [45–28](https://voteview.com/rollcall/RS0880476). Gore''s amendment, standby authority to tax the commercial banks'' foreign loans, carried [44–25](https://voteview.com/rollcall/RS0880475); Javits''s two, an exemption for underwriters and a capital issues committee in place of the tax, lost [27–61](https://voteview.com/rollcall/RS0880473) and [17–63](https://voteview.com/rollcall/RS0880474). Fong against: "the first time in the history of our country that such a tax has ever been imposed"; he puts in the appeal of Okumura, of Nomura Securities and the Federation of Economic Organizations'' Foreign Capital Committee: the tax "a new form of what one may call a protective tariff."'
        n: '[110 Cong. Rec. 18023](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-1-2.pdf#page=59); [110 Cong. Rec. 18044](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-1-2.pdf#page=80); [110 Cong. Rec. 18049](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-1-2.pdf#page=85); [110 Cong. Rec. 18053](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-1-2.pdf#page=89) (the votes); [110 Cong. Rec. 18026–27](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-1-2.pdf#page=62) (Fong; Okumura''s appeal and his letter to Carlson of July 22). Check: the day the Senate took up the bill. See [[cal.1964-07-27.economy]]. Names: Gore, Javits, Fong.'
