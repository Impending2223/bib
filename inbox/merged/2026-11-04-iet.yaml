        c: 'Johnson to Fowler, by letter: the Cabinet Committee''s recommendations approved, the voluntary program improved for 1966; the deficit at an annual rate of $1.3 billion in the first three quarters. The summary released the same day: direct investment in 1965–66 held to 90 percent of 1962–64; the tax extended to Abu Dhabi, Bahrain, Indonesia, Iran, Iraq, the Kuwait–Saudi Arabia Neutral Zone, Libya, Qatar and Saudi Arabia; the banks'' ceiling to 109 percent of the 1964 base by the last quarter of 1966; Canada''s unlimited exemption continued.'
        n: 'Letter to Secretary Fowler Approving the Recommendations of the Cabinet Committee on Balance of Payments, [1965 Pub. Papers 1135](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=609) (Dec. 5, 1965), and its note (the summary, 1 Weekly Comp. Pres. Docs. 560). To check: the Cabinet Committee''s report of Nov. 26, 1965, [FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 82](https://history.state.gov/historicaldocuments/frus1964-68v08/d82). See [[cal.1965-02-10.economy]]. Names: Johnson, Fowler.'
        src:
          c: 38ec563a
          rows:
