  - add:
      entry:
        id: cal.1964-01-28.economy
        when: Jan. 28
        date: '1964-01-28'
        thread: economy
        c: 'The Open Market Committee. Hayes: much of the improvement in the payments from one-time changes, loan repayments and military purchases. Balderston credits the interest equalization tax, and fears the improvement will end; the staff: its projection depends very little on the tax.'
        n: '[[w.meltzer-history-of-the-federal]], 428 (by the minutes). To check: FOMC Minutes, Jan. 28, 1964, 17–18 (cited by [[w.meltzer-history-of-the-federal]], 428). See [[cal.1963-07-18.economy]]. Names: Balderston.'
