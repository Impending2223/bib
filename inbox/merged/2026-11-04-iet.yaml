        when: Feb. 10
        date: '1965-02-10'
        thread: japan
        also: [economy]
        c: 'Reischauer to State: an understanding with Tokyo, subject to Washington''s approval, after Trued''s and Trezise''s talks there, Feb. 6–7. Japan''s government and government-guaranteed issues exempt to $100 million a year; the tax paid on all else; private issues and term loans held within Japan''s borrowing of December 1964; a task force on the payments figures.'
        n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 42](https://history.state.gov/historicaldocuments/frus1964-68v08/d42) (telegram 2508, 9 p.m.; the talks in the note, no record of them found). Made public: FRUS 1964–68, VIII (1998). See [[cal.1963-11-18.japan-and-korea]]. Names: Reischauer, Trued, Trezise.'
        src:
