  - add:
      entry:
        id: cal.1964-02-25.economy
        when: Feb. 25
        date: '1964-02-25'
        thread: economy
        c: 'Johnson to Mills, by letter, at Mills''s request through Dillon: "I fully support H.R. 8000 as reported." The tax would add about 1 percent a year to foreigners'' cost of American portfolio capital. The outflow into foreign securities under $100 million at an annual rate in the fourth quarter; the deficit on regular transactions $1.5 billion.'
        n: 'Letter to the Chairman, House Ways and Means Committee, Endorsing the Interest Equalization Tax on Foreign Securities, [1963–64 Pub. Papers 311](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=395) (Feb. 25, 1964). See [[cal.1963-12-05.economy-2]]. Names: Johnson, Mills, Dillon.'
        src:
