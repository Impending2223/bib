        when: Mar. 5
        date: '1964-03-05'
        thread: economy
        c: 'House passes H.R. 8000, [238–142](https://voteview.com/rollcall/RH0880135); Byrnes''s motion to recommit rejected without a roll call. Mills: "no single measure can make a greater contribution over the critical period immediately ahead." Byrnes: "inconsistent with the trade philosophy of the administration."'
        n: '[110 Cong. Rec. 4488](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-2-2.pdf#page=2) (Mills); [110 Cong. Rec. 4506](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-2-2.pdf#page=20) (Byrnes); [110 Cong. Rec. 4523–24](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-2-2.pdf#page=37) (the votes). See [[cal.1964-02-27.economy]]. Names: Mills, Byrnes.'
