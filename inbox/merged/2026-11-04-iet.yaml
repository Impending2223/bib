        c: 'Interest Equalization Tax Extension Act signed, [81 Stat. 145](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg145.pdf): the tax through July 31, 1969. The President may raise or lower the rates by executive order, the stock rate to no more than 22.5 percent; from Jan. 26 to the thirtieth day after enactment, 22.5 percent on stock and the higher column on debt.'
