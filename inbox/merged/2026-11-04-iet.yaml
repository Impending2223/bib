  - add:
      entry:
        id: cal.1963-11-18.japan-and-korea
        when: Nov. 18
        date: '1963-11-18'
        thread: japan
        also: [economy]
        c: 'The Consultative Task Force on the interest equalization tax at State: Yamashita for Japan; Daane of the Treasury, Barnett and Trezise for the United States. The Japanese worry at the delay and at budgeting for foreign capital; Europe''s markets disappointing. The Americans: the bill unchanged, delayed by "legislative glue"; the House perhaps in December, the Senate in January; no backing for the *Post*''s and the *Times*''s capital issues committee.'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 83](https://history.state.gov/historicaldocuments/frus1961-63v09/d83) (State to Tokyo, telegram 1317, Nov. 20). Made public: FRUS 1961–63, IX (1995). See [[cal.1963-07-29.japan-and-korea]]. Names: Daane, Trezise.'
        src:
          c: 140cb5f7
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d83: all'
        tags: [name:daane-j-dewey, name:trezise-philip-h]
  - add:
      entry:
        id: cal.1963-12-02.economy
        when: Dec. 2
        date: '1963-12-02'
        thread: economy
        c: 'Dillon to Johnson, a report on the balance of payments: the third quarter the best since 1957, by the summer''s higher short-term rates and the proposed tax; 1963 little better than 1962. With the tax enacted, the deficit on regular transactions might fall to about $1 billion in 1965, from $3.5 billion.'
        n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 39](https://history.state.gov/historicaldocuments/frus1961-63v09/d39). Made public: FRUS 1961–63, IX (1995). See [[cal.1963-07-18.economy]]. Names: Dillon, Johnson.'
        src:
          c: 96cb22e3
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d39: all'
        tags: [name:dillon-c-douglas, name:johnson-lyndon-b]
