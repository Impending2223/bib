- edit:
    id: cal.1960-03-05.china-leadership-3
    base: 8cf246ac
    set:
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 480 (Mar. 5, 1960); [[w.jianguo-yilai-mao-zedong]], XV, 59–60 (the Jilin report: the Center formally forwarded it Mar. 5, note 1); [[w.jianguo-yilai-mao-zedong]], XV, 52 (the Guangdong instruction, issued dated Mar. 5, note 1); [[w.yang-shangkun-riji]], I, 485 (Mar. 5, 1960; the afternoon; the Politburo on several documents Mao had commented on); [[w.deng-xiaoping-nianpu-1904]], III, 1531 (Mar. 5, 1960; afternoon; Deng attends; the three notices Mao drafted forwarding the Guangdong, Guizhou and Jilin documents adopted; Mao had asked Liu and Deng to review them and bring them to a Central meeting); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 32 (the Center''s comment forwarding the Guangdong instruction, dated Mar. 5, 1960). After [[cal.1960-03-05.china-leadership-6|Yang''s reading]]: the diary''s order alone, both in the afternoon (I, 485). Made public: 1996. To check: Central Committee, circular of Mar. 5, 1960 formally forwarding the Jilin report (cited by [[w.jianguo-yilai-mao-zedong]], XV, 60 n.1b). Names: Liu Shaoqi.'
