    set:
      n: '[[w.yang-shangkun-riji]], I, 484 (Mar. 1, 1960). The words: 晚间 (I, 484). After [[cal.1960-03-01.china-leadership-4|Luo and Ye''s report]]: the diary''s order alone, both in the evening (I, 484). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Kang Yimin.'
