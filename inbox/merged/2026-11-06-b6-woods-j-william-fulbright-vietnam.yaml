      when: June 10
      date: '1968-06-10'
      thread: elections-1968-mccarthy
      c: Marcy to Jean D. Andres, by letter, on McCarthy's candidacy, by Woods's reading of it the culmination of Marcy's crusade to bring the executive to heel and restore Congress's influence on foreign policy.
      n: '[[w.woods-j-william-fulbright-vietnam]], 176. To check: Marcy to Andres, June 10, 1968, Marcy Papers, RG 46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 176 n.64). See [[cal.1968-06-07.elections-1968-2]]. Names: Marcy, McCarthy.'
