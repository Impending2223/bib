      when: Apr. 12
      date: '1967-04-12'
      thread: vietnam-congress-foreign-relations
      c: 'A. J. Levin, a British M.P., to Fulbright, by letter: wherever Vietnam comes up abroad, his name comes into the conversation; his risking his political neck in differing from his Administration "will serve the United States in good stead in the future."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 144. To check: Levin to Fulbright, Apr. 12, 1967, Fulbright Papers, Series 48:18, Box 52:4, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 144 n.6). Names: Fulbright.'
