      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: Mexico City, the American embassy, a crowd around a radio. As Johnson says he will not run, the room silent; Morse in tears, by Roy Reed's account.
      n: '[[w.woods-j-william-fulbright-vietnam]], 173. To check: Roy Reed, interview by Woods, Sept. 17, 1993 (cited by [[w.woods-j-william-fulbright-vietnam]], 173 n.53). Check: Woods has "That Wednesday evening"; the address was Sunday, Mar. 31. Names: Johnson, Morse.'
