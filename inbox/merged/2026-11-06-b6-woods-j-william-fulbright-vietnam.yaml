      id: cal.1966-04-25.vietnam-congress-foreign-relations
      when: Apr. 25
      date: '1966-04-25'
      thread: vietnam-congress-foreign-relations
      c: Johnson invites Fulbright and his wife to fly to Houston with him and Lady Bird Johnson. Fulbright, held by his speech in New York, declines, with profuse thanks.
      n: '[[w.woods-j-william-fulbright-vietnam]], 132 ("in late April"). To check: Lee Williams to Fulbright, Apr. 25, 1966 (cited by [[w.woods-j-william-fulbright-vietnam]], 132 n.23). Check: the day of the invitation and of the reply. Names: Johnson, Fulbright, Lady Bird Johnson.'
