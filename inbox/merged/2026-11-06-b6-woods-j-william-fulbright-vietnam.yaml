      when: July 27
      date: '1967-07-27'
      thread: vietnam-commitments
      c: 'Marcy to Newhouse of the Foreign Relations staff, of Fulbright''s national commitments resolution: "This could be a pretty important statement." "[T]he break between JWF and LBJ openeth again."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 155. To check: Marcy to Newhouse, July 27, 1967, Marcy Papers, RG 46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 155 n.13). The resolution introduced: [[cal.1967-07-31.vietnam]]. Names: Marcy, Fulbright, Johnson.'
