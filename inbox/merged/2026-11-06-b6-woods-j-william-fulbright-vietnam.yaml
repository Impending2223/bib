      when: Oct. 30
      date: '1967-10-30'
      thread: vietnam-congress-foreign-relations
      c: Fulbright to Burton K. Wheeler, Roosevelt's old isolationist foe, by letter, in an admiring correspondence struck up early in the year.
      n: '[[w.woods-j-william-fulbright-vietnam]], 146 (the old isolationists finding Fulbright''s critique congenial). To check: Fulbright to Wheeler, Oct. 30, 1967, Fulbright Papers, Series 48:18, Box 53:5, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 146 n.15). Check: the matter of the letters; Woods gives none. Names: Fulbright.'
