      id: cal.1967-07-05.vietnam-hanoi-2
      when: July 5
      date: '1967-07-05'
      thread: vietnam-hanoi
      c: 'Thanh and Võ Nguyên Giáp walk round West Lake with their wives, then dine without them at Giáp''s house: Thanh''s send-off before the front. Thanh home about 11 p.m.'
      n: '[[w.nguyen-hanois-war]], 87 (after the lunch with Hồ: "his next appointment"). The passage''s note, 88 n.3, cites Lê Hải Triều''s life of Thanh, 35–37. See [[cal.1967-07-06.vietnam]]. Names: Nguyễn Chí Thanh, Võ Nguyên Giáp.'
