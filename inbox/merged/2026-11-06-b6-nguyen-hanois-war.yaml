      date: '1967-07-05'
      thread: vietnam-hanoi
      c: Nguyễn Chí Thanh, commander of COSVN, due to return South the next day, lunches with Hồ Chí Minh, who is ill. Hồ asks him to tell the southern revolutionaries that the South is always in his heart.
      n: '[[w.nguyen-hanois-war]], 87. Nguyen''s account, from Vietnamese works; the passage''s note, 88 n.3, cites Lê Hải Triều''s life of Thanh, 35–37. See [[cal.1967-07-06.vietnam]]. Names: Nguyễn Chí Thanh, Hồ Chí Minh.'
