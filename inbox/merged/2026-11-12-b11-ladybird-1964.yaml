- cite:
    id: cal.1964-04-22.civil-rights-organizations-nyc
    item: '[[w.johnson-white-house-diary]], 115 (Johnson off by helicopter in the morning "to open the World''s Fair in New York"; not the speech, the hecklers or the stall-in)'
