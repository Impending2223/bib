- add:
    entry:
      id: cal.1964-05-06.white-house
      when: May 6
      date: '1964-05-06'
      thread: program
      c: The White House, 1 p.m. Mrs. Johnson's luncheon for the Senate Ladies Red Cross unit, 130 at tables set with the
        china of eighteen Administrations; the wives of sitting and former Senators, among them Mrs. Mansfield, Mrs. Kuchel,
        Mrs. Kefauver. Mrs. Johnson reads Abigail Adams's letter of 1800; Helen Hayes and company perform from Hotchner's
        play *The White House*. Johnson comes in and calls the Senate wives "the jewels" of the Senators.
      n: '[[w.johnson-white-house-diary]], 130–32 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      also:
      - congress
      - white-house
- cite:
    id: cal.1964-05-06.press-and-broadcasting
    item: '[[w.johnson-white-house-diary]], 132–33 (the South grounds, 4:30 p.m., the press with their wives and children;
      Johnson in the band shell answering questions on the gross national product, Vietnam and Republican nominees; his photographs
      with the children; Mary McGrory''s piece; not the number, the refreshments, the statement or Congress)'
    units: A, C
- add:
    entry:
      id: cal.1964-05-06.white-house-2
      when: May 6
      date: '1964-05-06'
      thread: white-house
      c: Alice Brown, wife of George Brown of Houston, arrives as a White House guest with a Winslow Homer watercolor, "The
        Surf at Prout's Neck," and a Sully portrait of Washington for the house; Mrs. Johnson expects the Homer to be the
        first important acquisition to come to the White House through her.
      n: '[[w.johnson-white-house-diary]], 133 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-07.white-house
      when: May 7
      date: '1964-05-07'
      thread: white-house
      c: 'The Yellow Oval Room, 10:30 a.m. Meeting of the Committee for the Preservation of the White House, about an hour
        and a half: the first panel of damask for the East Room''s draperies; John Adams''s silver coffee urn acquired; West
        to price copies of the antique Green, Blue and Red Room rugs; Clifford on the finances of the White House Historical
        Association.'
      n: '[[w.johnson-white-house-diary]], 134 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Clifford.'
      tags:
      - name:johnson-lady-bird
      - name:clifford-clark
- cite:
    id: cal.1964-05-07.poverty
    item: '[[w.johnson-white-house-diary]], 134 (Johnson and Lynda Bird leave by helicopter for Andrews that morning on a
      five-State poverty tour of two days; not the stops)'
    units: A
- add:
    entry:
      id: cal.1964-05-07.white-house-2
      when: May 7
      date: '1964-05-07'
      thread: white-house
      c: 'The Green Room and Blue Room, 4 p.m. Mrs. Johnson''s tea for about fifty-five people of the art world: members of
        Mrs. Kennedy''s Fine Arts, Paintings and Library Committees and the Advisory Committee, curators and museum directors;
        a list of gifts to the collection since Mrs. Kennedy''s tea of Dec. 1, 1962. She makes a speech of welcome.'
      n: '[[w.johnson-white-house-diary]], 135–36 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
- cite:
    id: cal.1964-05-14.elections-1964
    item: '[[w.johnson-white-house-diary]], 138–40 (Huntland, Middleburg, Va., May 14: her own "nine-page analysis" for Johnson,
      with a draft announcement "that I will not be a candidate for reelection"; if he quits, "questionings and innuendos
      as to his motives" and "You let us down, Lyndon"; if he runs, criticism, slander, and perhaps an earlier death; her
      conclusion in other words: run, and announce in "February or March 1968" that he will not run again; sealed, marked
      "Personal, please," and given to Dr. Hurst and Dr. Cain for Johnson next morning; she does not say he asked for it,
      or a notebook, or "bad decisions" or "semi-idle")'
    units: B, C
- add:
    entry:
      id: cal.1964-05-14.elections-1964-johnson
      when: May 14
      date: '1964-05-14'
      thread: elections-1964-johnson
      c: Huntland, Middleburg, Va. Mrs. Johnson has Dr. Hurst and Dr. James Cain of the Mayo Clinic to dinner, with Luci,
        to talk over Johnson's situation; she gives them her memorandum to take to Johnson the next morning. Both think from
        the psychological side that he should continue now, that idleness and loss of command would be harder on him than
        the work. She doubts either understands his pain at the thought of sending many thousands of American boys to Vietnam
        or elsewhere.
      n: '[[w.johnson-white-house-diary]], 138–40 (Lady Bird Johnson''s account). See [[cal.1964-05-14.elections-1964]]. Names:
        Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-05-15.elections-1964-johnson
      when: May 15
      date: '1964-05-15'
      thread: elections-1964-johnson
      c: 'Planned for the morning, by Mrs. Johnson''s account the night before: Dr. Hurst and Dr. James Cain to confer with
        Dr. Larry Lamb of San Antonio and Dr. George Burkley and Dr. Janet Travell of the White House over Johnson''s health,
        with a thorough check-up; her memorandum to be handed to Johnson at the meeting.'
      n: '[[w.johnson-white-house-diary]], 138–40 (Lady Bird Johnson''s account of what was planned; she does not describe
        the meeting). Check: whether held. See [[cal.1964-05-14.elections-1964]]. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-14.elections-1964-johnson-2
      when: May 14–15
      date: '1964-05-14'
      thread: elections-1964-johnson
      c: 'Huntland, a little after midnight. Johnson, back from a stag party, telephones Mrs. Johnson: lonesome, by her account;
        "a sad-happy talk," his "restive desire to seek a way out of the burdens he carries."'
      n: '[[w.johnson-white-house-diary]], 140 (Lady Bird Johnson''s account). See [[cal.1964-05-14.elections-1964]]. Names:
        Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-21.poverty
      when: May 21
      date: '1964-05-21'
      thread: poverty
      c: Kentucky. Mrs. Johnson, with Carpenter, Bess Abell, Representative Perkins, Batt of the A.R.A. and aides of Agriculture
        and Commerce, lands at Lexington about 8 a.m., Governor and Mrs. Breathitt meeting her. Eight hours by motorcade,
        foot and helicopter through the Cumberland Plateau. On the road she stops the motorcade at a school of children on
        the last day of classes.
      n: '[[w.johnson-white-house-diary]], 140–41 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Carpenter, Perkins,
        Batt, Breathitt.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
      - name:perkins-carl-d
      - name:batt-william-l-jr
      - name:breathitt-edward-t
- add:
    entry:
      id: cal.1964-05-21.poverty-2
      when: May 21
      date: '1964-05-21'
      thread: poverty
      c: 'Warshoal Branch, Breathitt County, Ky. Mrs. Johnson walks almost a mile up the creek to the three-room house of
        Arthur Robertson, his wife and seven children: a $700 federal grant for materials, siding, insulation, a well; three-fifths
        of an acre cleared for tobacco with the Agriculture Department''s help; a part-time job on the Unemployed Parents
        program. Mrs. Robertson: "It don''t hurt to dream!"'
      n: '[[w.johnson-white-house-diary]], 141–42, 144 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-21.poverty-3
      when: May 21
      date: '1964-05-21'
      thread: poverty
      c: 'Lick Branch School, Breathitt County. Mrs. Johnson lunches with the 25 children of the one-room school, a hot lunch
        for ten cents; presents a flag that flew over the Capitol and a set of encyclopedias; throws the switch on the school''s
        first electric lights. Marie Turner, the county superintendent: a teacher hardly ever stays longer than a year; a
        meal a day lifts the children.'
      n: '[[w.johnson-white-house-diary]], 142–44 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-21.poverty-4
      when: May 21
      date: '1964-05-21'
      thread: poverty
      c: Breathitt High School, Jackson, Ky. Mrs. Johnson makes her first speech of the day to about 5,000, among them the
        Lieutenant Governor and Perkins, at the dedication of the new gymnasium, one of 188 accelerated public works projects
        in the Cumberland area; Mrs. Roosevelt dedicated the old one 26 years before. Mrs. Breathitt gives her a hooked rug
        and a quilt.
      n: '[[w.johnson-white-house-diary]], 144 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Perkins, Breathitt.'
      tags:
      - name:johnson-lady-bird
      - name:perkins-carl-d
      - name:breathitt-edward-t
- cite:
    id: cal.1964-05-23.europe-and-the-alliance
    item: '[[w.johnson-white-house-diary]], 144–46 (Lexington, Va.: Johnson and Mrs. Johnson with Acheson, Rusk and Byrd;
      Johnson inspects the V.M.I. honor guard; the visit to the library with Eisenhower, Mrs. Marshall and Governor Harrison,
      for the photographers; Bradley presiding, then Eisenhower''s speech and Johnson''s, "touching"; not the words of Johnson''s
      speech)'
    units: '?'
