      when: May 27
      date: '1964-05-27'
      thread: europe-and-the-alliance
      c: 'The South Lawn. Johnson and Mrs. Johnson receive President de Valera of Ireland: the Diplomatic Corps, anthems,
        troops reviewed, speeches; they ride with him to Blair House.'
      n: '[[w.johnson-white-house-diary]], 148–49 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
