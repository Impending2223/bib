- add:
    entry:
      id: cal.1964-05-27.europe-and-the-alliance-2
      when: May 27
      date: '1964-05-27'
      thread: europe-and-the-alliance
      c: 'The White House, State dinner for de Valera. Gifts: a vermeil cigar box, an antique ballot box, a copy of his baptismal
        certificate (St. Agnes, New York). Robert Kennedy and Mrs. Kennedy and Edward Kennedy and his wife, invited, do not
        come; the Shrivers come for the family; Ball and Mrs. Ball for Rusk, away at Nehru''s funeral. Johnson''s toast: "I
        have heard it said that there are more Irishmen in the White House than people."'
      n: '[[w.johnson-white-house-diary]], 149–50 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Robert
        Kennedy, Ted Kennedy, Shriver, Ball, Rusk.'
      tags:
      - name:johnson-lyndon-b
