      - name:conte-silvio-o
      - name:meany-george
      - name:reuther-walter
      - name:saragat-giuseppe
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-01-15.europe-and-the-alliance
      when: Jan. 15
      date: '1964-01-15'
      thread: europe-and-the-alliance
      c: The Italian Embassy, 1:30 p.m. The Segnis' luncheon in the Johnsons' honor; Mrs. Johnson between Segni and Saragat, the Foreign Minister, who tells her that when he sees the Pope now he wears a business suit and does not kneel. The toasts "pro-Western," by her account.
      n: '[[w.johnson-white-house-diary]], 48–49 (Lady Bird Johnson''s account: "the Segnis'' lunch in our honor"). Names: Lady Bird Johnson, Johnson, Segni, Saragat.'
      tags:
      - name:johnson-lady-bird
      - name:saragat-giuseppe
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-15.congress
      when: Jan. 15
      date: '1964-01-15'
      thread: congress
      c: The White House, the Blue Room and State Dining Room. Mrs. Johnson receives about forty senators and representatives and members of the Canadian Parliament, the Inter-Parliamentary Committee, at Senator Aiken's request. Johnson comes in for ten minutes of greetings.
      n: '[[w.johnson-white-house-diary]], 49–50 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Aiken, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:aiken-george-d
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-16.congress
      when: Jan. 16
      date: '1964-01-16'
      thread: congress
      c: The White House, 7 p.m. Dinner, about sixty-four guests, for the chairmen and ranking members of the Senate committees and the leaders of both parties with their wives. Johnson takes the men to the little theater for a briefing by McCone, McNamara, Rusk and Gordon, the purpose, by Mrs. Johnson, "really business"; Margaret Chase Smith goes with them. Mrs. Johnson shows the wives the second floor. Russell on her left at dinner, Hayden on her right. Humphrey, the Fulbrights and the O'Briens stay on upstairs.
      n: '[[w.johnson-white-house-diary]], 51–52 (Lady Bird Johnson''s account; she was not at the briefing). Johnson then reads papers on Panama until 2 a.m. Names: Johnson, Lady Bird Johnson, McCone, McNamara, Rusk, Kermit Gordon, Margaret Chase Smith, Russell, Hayden, Humphrey, Fulbright, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mccone-john-a
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:gordon-kermit
      - name:smith-margaret-chase
      - name:russell-richard-b
      - name:hayden-carl
      - name:humphrey-hubert-h
      - name:fulbright-j-william
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1964-01-17.white-house
      when: Jan. 17
      date: '1964-01-17'
      thread: white-house
      c: 'The White House, 11 a.m. Clifford with Mrs. Johnson on the committees Mrs. Kennedy set up for the White House''s art: Clifford proposes an Executive Order making the Curator an official position and creating a Committee on the Preservation of the White House (Walker, Carmichael, Clifford, Walton and Hartzog, with public members); Mrs. Kennedy has made suggestions.'
      n: '[[w.johnson-white-house-diary]], 53–54 (Lady Bird Johnson''s account). To check: Executive Order 11145 (Mar. 7, 1964). Names: Lady Bird Johnson, Clifford, Hartzog.'
      tags:
      - name:johnson-lady-bird
      - name:clifford-clark
- add:
    entry:
      id: cal.1964-01-17.white-house-2
      when: Jan. 17
      date: '1964-01-17'
      thread: white-house
      c: The White House, 7:30 p.m. Dinner for the Charles Engelhards and the Mansfields, seven in all, Johnson late. Mrs. Johnson shows Jane Engelhard the dining room furniture the Engelhards gave.
      n: '[[w.johnson-white-house-diary]], 54 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Mansfield.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mansfield-mike
- add:
    entry:
      id: cal.1964-01-20.white-house
      when: Jan. 20
      date: '1964-01-20'
      thread: white-house
      c: New York. Mrs. Johnson, by commercial airline, tours the Metropolitan Museum of Art with Mary Lasker, Rorimer, Rousseau and Fosburgh, and the Whitney Museum, to choose American paintings that the museums will lend the White House for two years; lunch at Mrs. Lasker's with Roger Stevens of the Kennedy Cultural Center.
      n: '[[w.johnson-white-house-diary]], 55–56 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Roger Stevens.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-20.white-house-2
      when: Jan. 20
      date: '1964-01-20'
      thread: white-house
      c: New York. Mrs. Johnson with Fortas, Stevenson and Mary Lasker sees Arthur Miller's *After the Fall*, the repertory theater's first play, a benefit; then the champagne supper at New York University with Miller, Robards, Myrna Loy, Lauren Bacall and Mayor Wagner. Stevenson takes her home.
      n: '[[w.johnson-white-house-diary]], 56–57 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Fortas, Stevenson, Wagner.'
      tags:
      - name:johnson-lady-bird
      - name:fortas-abe
      - name:stevenson-adlai-e
      - name:wagner-robert-f-jr
- add:
    entry:
      id: cal.1964-01-21.economy-2
      when: Jan. 21
      date: '1964-01-21'
      thread: economy
      c: 'The Canadian Embassy. Prime Minister Pearson''s dinner in honor of Johnson and Mrs. Johnson, about eighteen: Rusk, Duke, the Canadian ambassador Ritchie, Butterworth and Canadian Cabinet members. Pearson''s toast; the Canadians give Mrs. Johnson a maple-leaf pin and Johnson a Mountie''s saddle.'
      n: '[[w.johnson-white-house-diary]], 58–59 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Lester Pearson, Rusk, Duke, Ritchie, Butterworth.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:pearson-lester-b
      - name:rusk-dean
      - name:duke-angier-b
      - name:ritchie-charles-s-a
- cite:
    id: cal.1964-01-23.baker
    item: '[[w.johnson-white-house-diary]], 60 (Mrs. Johnson, in the evening: Johnson looks "relaxed, happy, successful, even after what must have been a rather grueling press conference"; not the subject)'
    units: '?'
- add:
    entry:
      id: cal.1964-01-23.white-house
      when: Jan. 23
      date: '1964-01-23'
      thread: white-house
      c: 'The White House, 2 p.m. Mrs. Johnson with Cliff Carter of the Democratic National Committee, Carpenter, Bess Abell and Kilduff on her schedule: a reception for college editors in February, the Society of Newspaper Editors in April, the fund-raising dinners, visits to Kentucky, Michigan and New York; she wants a trip South for the A.R.A. or a college.'
      n: '[[w.johnson-white-house-diary]], 59 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Cliff Carter, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
- add:
    entry:
      id: cal.1964-01-23.congress
      when: Jan. 23
      date: '1964-01-23'
      thread: congress
      c: The White House, dinner at round tables in the State Dining Room, the Senate briefing. Mrs. Johnson between Dodd and McGee. Johnson speaks of Hruska; Mrs. Johnson, of Magnuson, who came to Congress with them in 1937; Lynda Bird, at her father's prodding, speaks.
      n: '[[w.johnson-white-house-diary]], 59–60 (Lady Bird Johnson''s account). See [[cal.1964-01-17.congress]]. Names: Johnson, Lady Bird Johnson, Dodd, McGee, Hruska, Magnuson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:dodd-thomas-j
      - name:mcgee-gale-w
      - name:hruska-roman-l
      - name:magnuson-warren-g
- add:
    entry:
      id: cal.1964-01-24.white-house
      when: Jan. 24
      date: '1964-01-24'
      thread: white-house
      c: 'The Queen''s Sitting Room. Clifford, Fortas, Walton, Salinger, Carpenter and Mrs. Johnson go over the Executive Order for a permanent Curator and a Committee for the Preservation of the White House. Clifford: Mrs. Kennedy has suggested Henry duPont and James Fosburgh as public members, and has agreed to serve herself. The draft, Clifford''s, gone over by Fortas and Walton, put to Salinger and Carpenter "from the news standpoint."'
      n: '[[w.johnson-white-house-diary]], 60–61 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Clifford, Fortas, Salinger, Carpenter, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:clifford-clark
      - name:fortas-abe
      - name:salinger-pierre
      - name:carpenter-liz
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1964-01-12.white-house
      when: Jan. 12
      date: '1964-01-12'
      thread: white-house
      c: 'Mrs. Johnson''s television interview with Nancy Dickerson, filmed the week before, shown on "The Week That Was" with film from her Pennsylvania trip. By her account "a catastrophe": "I looked just as old and just as frenetic and just as tired and just as unprepared as I was."'
      n: '[[w.johnson-white-house-diary]], 42 (Lady Bird Johnson''s account of her own appearance; she saw it at Camp David). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-27.cyprus
      when: Jan. 27
      date: '1964-01-27'
      thread: cyprus
      c: 'The White House, 1 p.m. Luncheon for Queen Frederika of Greece and Princess Irene, with the Greek ambassador Matsas, Warren, Ball for Rusk, Fulbright, Sparkman, Symington, Neuberger, Albert Thomas, Frelinghuysen and Brademas. The Queen to Johnson on Cyprus: "Forty miles straight, between there and Turkey, ... can get there in a motorboat." Johnson''s toast on Greece; the Queen''s reply on John Govatos, a friend of Johnson''s since 1931, who had predicted in Corpus Christi that he would be President.'
      n: '[[w.johnson-white-house-diary]], 61–63 (Lady Bird Johnson''s account; she overheard the remark on Cyprus; the guests are hers). Names: Johnson, Lady Bird Johnson, Frederika, Matsas, Warren, Ball, Sparkman, Albert Thomas, Frelinghuysen, Brademas, Neuberger.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:warren-earl
      - name:ball-george-w
      - name:sparkman-john
      - name:thomas-albert
      - name:frelinghuysen-peter-h-jr
      - name:brademas-john
      - name:neuberger-maurine-b
- add:
    entry:
      id: cal.1964-01-30.congress
      when: Jan. 30
      date: '1964-01-30'
      thread: congress
      c: 'The White House, the last of the Senate dinners and briefings: cocktails, the briefing for the men by Rusk, McNamara and Gordon, the wives upstairs, then dinner. Johnson toasts Keating, the top Republican present; Mrs. Johnson toasts Monroney, who with Johnson alone of the oil States'' senators voted to hold the price of crude oil, during the war or after (she is not sure). Dancing in the East Room, Thurmond and Smathers among Mrs. Johnson''s partners.'
      n: '[[w.johnson-white-house-diary]], 66 (Lady Bird Johnson''s account; she was not at the briefing). See [[cal.1964-01-17.congress]]. Names: Johnson, Lady Bird Johnson, Rusk, McNamara, Kermit Gordon, Keating, Monroney, Thurmond, Smathers.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:gordon-kermit
      - name:keating-kenneth-b
      - name:monroney-almer-s
      - name:thurmond-strom
      - name:smathers-george-a
- add:
    entry:
      id: cal.1964-02-05.white-house
      when: Feb. 5
      date: '1964-02-05'
      thread: white-house
      c: The Mayflower Hotel, 7:30 a.m. Congressional wives' prayer breakfast, Mrs. Langford presiding, Mrs. B. Everett Jordan introducing Mrs. Billy Graham, who speaks; Mrs. Johnson quotes a hymn learned in Greece; Mrs. Hodges reads. Johnson and a few Senators who began the Prayer Breakfast come in, and Billy Graham speaks briefly. Mrs. Johnson takes the Grahams to Johnson's office.
      n: '[[w.johnson-white-house-diary]], 67–68 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at the Presidential Prayer Breakfast, Feb. 5, 1964. Names: Johnson, Lady Bird Johnson, Billy Graham.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:graham-billy
- cite:
    id: cal.1964-02-05.cuba
    item: '[[w.johnson-white-house-diary]], 68 (Johnson leaves in the middle of the afternoon for New York and the Joseph P. Kennedy Foundation dinner; Mrs. Johnson stays; not the Weizmann dinner or Cuba)'
    units: '?'
- add:
    entry:
      id: cal.1964-02-11.white-house
      when: Feb. 11
      date: '1964-02-11'
      thread: white-house
      c: 'The White House, 7 p.m. Diplomatic reception. Mrs. Johnson and Johnson receive the Dean of the Corps, Sevilla-Sacasa of Nicaragua, Warren, Rusk and Sparkman upstairs; the Spanish ambassador presents a letter to Johnson on Spain''s recognition of Russia, and they leave the room for a while. Four new ambassadors present credentials: the Dominican Republic, Libya, Peru and Sweden. Dancing: Mrs. Johnson with Dobrynin, who tells her of Siberia''s diamonds, and with the Kuwaiti Al-Ghoussein; Dobrynin dances with Lynda Bird. Johnson stays until 9:30.'
      n: '[[w.johnson-white-house-diary]], 69–71 (Lady Bird Johnson''s account; she leaves early with flu). See [[cal.1964-02-11.civil-rights-bill-2]]. Names: Johnson, Lady Bird Johnson, Sevilla-Sacasa, Warren, Rusk, Sparkman, Dobrynin.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:warren-earl
      - name:rusk-dean
      - name:sparkman-john
      - name:dobrynin-anatoly
- cite:
    id: cal.1964-02-11.civil-rights-bill-2
    item: '[[w.johnson-white-house-diary]], 70–71 (the diplomatic reception in the evening, Johnson at it until 9:30; not the talk of cloture)'
    units: '?'
- cite:
    id: cal.1964-02-12.europe-and-the-alliance
    item: '[[w.johnson-white-house-diary]], 71 (the arrival ceremonies for the Douglas-Homes in the morning, brief speeches by the Prime Minister and Johnson; not the talks)'
    units: '?'
- add:
    entry:
      id: cal.1964-02-12.white-house
      when: Feb. 12
      date: '1964-02-12'
      thread: white-house
      c: 'The White House, dinner with William S. White, the columnist, and Mrs. White: his book, and Johnson''s reasons for going to church, which Mrs. Johnson gives as that anyone in his house needed help "more than man''s" and that no one could any longer say he went for political reasons.'
      n: '[[w.johnson-white-house-diary]], 71–72 (Lady Bird Johnson''s account; she does not say Johnson was at the table). Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-27.white-house
      when: Jan. 27
      date: '1964-01-27'
      thread: white-house
      c: The White House, after the Queen's luncheon. Mrs. Johnson gives Mrs. Charles Lindbergh two hours for an interview for a magazine article she is writing, in the Queen's Sitting Room; they talk of Mrs. Lindbergh's books *Gift from the Sea* and *Dearly Beloved*.
      n: '[[w.johnson-white-house-diary]], 63 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-02-14.soviet-union
      when: Feb. 14
      date: '1964-02-14'
      thread: soviet-union
      c: 'The White House, late afternoon. Mrs. Johnson has John and Elaine Steinbeck to tea, back from six months in Poland, Czechoslovakia and Russia on a cultural-exchange mission. Steinbeck: the Russians were hospitable but would not believe facts about the United States, among them Khrushchev''s shoe at the United Nations.'
      n: '[[w.johnson-white-house-diary]], 72 (Lady Bird Johnson''s account of what the Steinbecks told her). To check: the Steinbecks'' tour. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-02-14.program
      when: Feb. 14
      date: '1964-02-14'
      thread: program
      c: St. Louis. Johnson speaks at the city's bicentennial celebration.
      n: '[[w.johnson-white-house-diary]], 72–73 (Lady Bird Johnson''s account: "Tonight Lyndon is in St. Louis, making a speech celebrating St. Louis'' Bicentennial"; she is in Washington). To check: the Public Papers, Remarks in St. Louis, Feb. 14, 1964. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-02-25.white-house
      when: Feb. 25
      date: '1964-02-25'
      thread: white-house
      c: 'The Executive Office Building. Mrs. Johnson visits the volunteers answering mail for Mrs. Kennedy, Tuckerman showing her four rooms: Foreign Service and Army wives, Mrs. Moorhead, translators. The mail has fallen from 44,000 messages on a peak day after Nov. 22 to seven or eight hundred a day. She thanks the telephone operators, and sees the Kennedy files, to go to the Kennedy Library.'
      n: '[[w.johnson-white-house-diary]], 73–74 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
- cite:
    id: cal.1964-02-26.economy
    item: '[[w.johnson-white-house-diary]], 74–76 (the East Room, evening, the signing before the congressional leaders; Johnson''s statement of the $11.5 billion cut and its effects; the vote 74 to 19; Byrd thanked for letting the bill out of committee; Russell Long, Smathers, Mills, Albert, McCormack and Dillon present; not the rates)'
    units: '?'
- add:
    entry:
      id: cal.1964-02-26.robert-kennedy
      when: Feb. 26
      date: '1964-02-26'
      thread: robert-kennedy
      c: Mrs. Kennedy's house, Georgetown, after the tax bill signing. Johnson and Mrs. Johnson meet the Kennedy Cabinet there, for about forty-five minutes; Johnson brings four of the signing pens, for Mrs. Kennedy, the Kennedy Library and the two children. The Cabinet gives her a gold tray and coffee service engraved with the names of the Cabinet and the President's closest advisers; Rusk makes the speech. To the reporters outside Johnson calls the visit "very moving" and says Kennedy had worked long and hard on the bill.
      n: '[[w.johnson-white-house-diary]], 76 (Lady Bird Johnson''s account; it was meant as a surprise to Mrs. Kennedy). See [[cal.1964-02-26.economy]]. Names: Johnson, Lady Bird Johnson, Jacqueline Kennedy, Kennedy, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
      - name:kennedy-john-f
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-02-28.succession
      when: Feb. 28
      date: '1964-02-28'
      thread: succession
      c: Palm Beach, Fla. Johnson and Mrs. Johnson pay a courtesy call on Joseph P. Kennedy, an invalid since his stroke in December 1961, and Mrs. Kennedy at their house; two of the Robert Kennedy children are there. Mrs. Kennedy talks of the house and the family, and is grateful for Johnson's kindnesses to the family.
      n: '[[w.johnson-white-house-diary]], 77–78 (Lady Bird Johnson''s account; she is "returning from Florida" on the 28th, home about 8:30 a.m.). Check: the day of the visit. Names: Johnson, Lady Bird Johnson, Joseph Kennedy, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-joseph-p
      - name:kennedy-robert-f
- cite:
    id: cal.1964-02-28.white-house
    item: '[[w.johnson-white-house-diary]], 78–79, 97–98 (Mrs. Johnson to Mrs. Kennedy''s house, 11 a.m., after "many conferences with Clark Clifford": the Committee for the Preservation of the White House, its members; Mrs. Kennedy accepts to serve, her Fine Arts Committee to be dissolved; not the Historical Association or Clifford present. The garden: Mrs. Kennedy declines by telephone Mar. 20)'
    units: '?'
- add:
    entry:
      id: cal.1964-03-10.succession
      when: Mar. 10
      date: '1964-03-10'
      thread: succession
      c: Washington. Mrs. Johnson leaves for Athens for the funeral of King Paul, co-chief with Truman of the official delegation, which includes Brademas, Manatos of the White House staff, John Plumides of Ahepa, Judge John Pappas, Archbishop Iakovos, General Vaughan, Clifton Daniel, Angier Biddle Duke and Mrs. Duke. Mrs. Johnson meets the delegation, Truman among them, in the Diplomatic Reception Room about 3:45; Mrs. Johnson says good-by to Johnson on the lawn; helicopter to Andrews; Air Force One leaves about 5 p.m.
      n: '[[w.johnson-white-house-diary]], 81–82 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson, Truman, Brademas, Manatos, Duke.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:truman-harry-s
      - name:brademas-john
      - name:manatos-mike-n
      - name:duke-angier-b
- add:
    entry:
      id: cal.1964-03-10.succession-2
      when: Mar. 10
      date: '1964-03-10'
      thread: succession
      c: 'Air Force One to Athens. Truman to Mrs. Johnson: the Truman Doctrine "was all the Marshall Plan"; on the Presidency, "Get all the information you can, make up your mind and go ahead—and tell them to go to Hell"; of a wife, "Protect him. Don''t let people use you"; his three lectures to students; Tyler''s answer to Webster, "I am the President."'
      n: '[[w.johnson-white-house-diary]], 82–84 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
- cite:
    id: cal.1964-03-10.elections-1964
    item: '[[w.johnson-white-house-diary]], 84 (on the plane that night, reporters bring word that Lodge, a write-in and away in Vietnam, beat Rockefeller and Goldwater, with write-ins for Robert Kennedy for Vice President and more for Johnson; no figures)'
    units: '?'
- add:
    entry:
      id: cal.1964-03-11.succession
      when: Mar. 11
      date: '1964-03-11'
      thread: succession
      c: 'Athens, 8:45 a.m. Mrs. Johnson and Truman land, met by Prince Michael and the Grand Mistress of the Court; anthems, troops reviewed, to the Athens Hilton. Prince Michael says his grandfather was aide-de-camp to Grant; Truman: "on the wrong side." With Ambassador Labouisse they sign the guest book at the Palace.'
      n: '[[w.johnson-white-house-diary]], 84–85 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Labouisse.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:labouisse-henry-r-jr
- add:
    entry:
      id: cal.1964-03-11.cyprus-2
      when: Mar. 11
      date: '1964-03-11'
      thread: cyprus
      c: Athens, 4:30 p.m. Mrs. Andreas Papandreou, the Prime Minister's American daughter-in-law, and Mrs. Costopoulos, the Foreign Minister's wife, take Mrs. Johnson to a Byzantine monastery and to a hill facing the Parthenon, where the three are photographed. Mrs. Papandreou speaks of her husband's interest in industrializing Greece, on Israel's example.
      n: '[[w.johnson-white-house-diary]], 85–86 (Lady Bird Johnson''s account; at lunch Mrs. Labouisse, the Ambassador''s wife, had told her of George Papandreou''s election and of Andreas Papandreou''s giving up his American citizenship to serve in his father''s government). Names: Lady Bird Johnson, Andreas Papandreou.'
      tags:
      - name:johnson-lady-bird
      - name:papandreou-andreas
- add:
    entry:
      id: cal.1964-03-11.cyprus-3
      when: Mar. 11
      date: '1964-03-11'
      thread: cyprus
      c: 'The Royal Palace, Athens, 9 p.m. Informal supper for the funeral delegations; two of each delegation invited, Mrs. Johnson and Truman for the United States. Queen Frederika receives Mrs. Johnson alone. Present: Kings and Queens of Denmark, Sweden, Norway, Belgium, the Netherlands, Prince Philip, Prince Rainier, exiled and pretender kings, German princes of the Queen''s family. Makarios of Cyprus the center of all eyes; the Queen speaks with him in a corner for a long time, and "everyone was mentally clocking the minutes."'
      n: '[[w.johnson-white-house-diary]], 86–89 (Lady Bird Johnson''s account; Truman left early). Names: Lady Bird Johnson, Truman, Frederika, Makarios.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:makarios-iii
- add:
    entry:
      id: cal.1964-03-12.succession
      when: Mar. 12
      date: '1964-03-12'
      thread: succession
      c: 'Athens Cathedral. Requiem Mass for King Paul, Archbishop Chrysostomos and about fifty prelates; Queen Frederika and King Constantine, Princess Sophie, Juan Carlos, Princess Irene. Chiefs of State on the left: Mrs. Johnson, Truman, Queen Juliana, Baudouin, Frederick IX, Gustaf VI, Olav V, Prince Philip. The coffin on a gun carriage drawn by one hundred sailors; Mrs. Johnson walks the mile and a half to the Athens Hilton, about 1,000,000 lining the road, with Prince Philip and Archbishop Makarios in her row; the crowd cheers Makarios.'
      n: '[[w.johnson-white-house-diary]], 89–91 (Lady Bird Johnson''s account; the crowd is by report). Names: Lady Bird Johnson, Truman, Constantine, Makarios.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:constantine-ii
      - name:makarios-iii
- add:
    entry:
      id: cal.1964-03-12.succession-2
      when: Mar. 12
      date: '1964-03-12'
      thread: succession
      c: Tatoi, the royal summer palace. Burial of King Paul in the family cemetery; Queen Juliana asks Labouisse to introduce the chiefs of state, among them the prince of Cambodia (whose countrymen had stoned the American Embassy the day before), the Crown Prince of Ethiopia, Couve de Murville and the Jordanian foreign minister. Constantine receives the folded standard from the coffin and gives it to the Queen; three shots; Mrs. Johnson and Truman bow at the grave. Lunch at the palace near 4 p.m.
      n: '[[w.johnson-white-house-diary]], 91–94 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Labouisse, Couve de Murville, Constantine.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:labouisse-henry-r-jr
      - name:couve-de-murville-maurice
      - name:constantine-ii
- add:
    entry:
      id: cal.1964-03-12.succession-3
      when: Mar. 12
      date: '1964-03-12'
      thread: succession
      c: 'Athens, on the way back from Tatoi. Truman to Mrs. Johnson: Roosevelt picked him as running mate because "he couldn''t stand to see anybody succeed him that he thought could do as well"; "I want Lyndon Johnson to do well. I know he''s going to be a great President. ... I''ve been for him all these years."'
      n: '[[w.johnson-white-house-diary]], 94 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:johnson-lyndon-b
- cite:
    id: cal.1964-03-19.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 96 (Salinger tells Johnson in his office about 3 p.m. that he will resign to run for the Senate in California, and then tells the press; the diary has no lunch)'
    units: '?'
- add:
    entry:
      id: cal.1964-03-19.transition-and-staff-2
      when: Mar. 19
      date: '1964-03-19'
      thread: transition-and-staff
      c: Johnson telephones George Reedy in the hospital and asks him to take the press secretary's job; Reedy accepts and agrees to come over as soon as possible, so that the announcement can be made.
      n: '[[w.johnson-white-house-diary]], 96 (Lady Bird Johnson''s account; she gives no hour). See [[cal.1964-03-19.transition-and-staff]]. Names: Johnson, Reedy, Salinger.'
      tags:
      - name:johnson-lyndon-b
      - name:reedy-george-e
      - name:salinger-pierre
- add:
    entry:
      id: cal.1964-03-19.democratic-party-2
      when: Mar. 19
      date: '1964-03-19'
      thread: democratic-party
      c: The Armory. The Democratic fund-raising dinner, 5,300 present, for the Congressional Class of 1936, of which Johnson was a member; James Farley toastmaster; the co-chairmen Mrs. Miller, Lindy Boggs and Mrs. Claiborne Pell; about thirty-five Texans from the old Tenth District. Stevenson with the Johnsons. Johnson's speech, with little humor. Mrs. Johnson notes the St. Patrick's decorations and no member of the Kennedy family.
      n: '[[w.johnson-white-house-diary]], 96–97 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Stevenson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1964-03-20.white-house
      when: Mar. 20
      date: '1964-03-20'
      thread: white-house
      c: 'Mrs. Paul Mellon with Mrs. Johnson in the White House gardens: her plan for the East Garden, with a little plaque to Mrs. Kennedy. Johnson approves naming it the Jacqueline Kennedy Garden; so do Clifford, Hartzog of the Park Service and Walton of the Fine Arts Commission. Mrs. Kennedy, by telephone: "No"; "Well, if she wants to, scratch my initials on a tree, or put a plaque, ever so little, underneath some bench."'
      n: '[[w.johnson-white-house-diary]], 97–98 (Lady Bird Johnson''s account). See [[cal.1964-02-28.white-house]]. Names: Lady Bird Johnson, Jacqueline Kennedy, Johnson, Clifford, Walton.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:walton-william
- add:
    entry:
      id: cal.1964-03-24.space
      when: Mar. 24
      date: '1964-03-24'
      thread: space
      c: 'Huntsville, Ala. Mrs. Johnson, with Carpenter and twenty-five or thirty of the press, lands at the Marshall Space Flight Center; Webb, Von Braun and Representative Robert Jones meet her. Her speech to about 300: she comes because Johnson wrote the Space Act in 1958, because women hold 20 percent of the payroll, and because the space program takes the South into the future. "The South has hitched its wagon to the stars."'
      n: '[[w.johnson-white-house-diary]], 98–99 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson, Webb, Von Braun, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:webb-james-e
      - name:von-braun-wernher
      - name:carpenter-liz
- add:
    entry:
      id: cal.1964-03-24.space-3
      when: Mar. 24
      date: '1964-03-24'
      thread: space
      c: The Saturn exhibits and test stand. Mrs. Johnson, with Webb and Von Braun, tours the engineering hangar and the Saturn exhibits, and is given a hard hat. Von Braun wears the Stetson Johnson gave him at the Ranch at Erhard's visit. After lunch she watches from a bunker the test firing of an eight-engine cluster of Saturn I; Saturn I is to put an unmanned Apollo craft in orbit, one on the pad at Cape Kennedy.
      n: '[[w.johnson-white-house-diary]], 99–101 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Webb, Von Braun, Johnson, Erhard.'
      tags:
      - name:johnson-lady-bird
      - name:webb-james-e
      - name:von-braun-wernher
      - name:johnson-lyndon-b
      - name:erhard-ludwig
- add:
    entry:
      id: cal.1964-03-24.space-4
      when: Mar. 24
      date: '1964-03-24'
      thread: space
      c: The Administration Building auditorium. Mrs. Johnson presents service, invention and achievement awards to NASA employees, about 500 present, and speaks; then a reception hosted by Mrs. Webb and Mrs. Von Braun for Alabama officials and organization leaders.
      n: '[[w.johnson-white-house-diary]], 101 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Webb, Von Braun.'
      tags:
      - name:johnson-lady-bird
      - name:webb-james-e
      - name:von-braun-wernher
- cite:
    id: cal.1964-04-07.farm
    item: '[[w.johnson-white-house-diary]], 101–02 (her entry of Apr. 8, of "last night," after the North Carolina reception: Johnson in the little room with staff, O''Brien going through a list of House members, committed, against, shaky, absent and pairable; Johnson making call after call; "The Food Stamp plan was tied in with it"; she has "The bill passed" that night: the House''s votes, cal.1964-04-08.farm, are of Apr. 8)'
    units: '?'
- add:
    entry:
      id: cal.1964-04-08.succession
      when: Apr. 8
      date: '1964-04-08'
      thread: succession
      c: 'Union Station and the Capitol. Funeral of General Douglas MacArthur. Johnson and Mrs. Johnson board the train to greet Mrs. MacArthur and the family, among them Ambassador Douglas MacArthur and General Courtney Whitney. The casket goes by caisson to the Capitol; the House and Senate adjourned, the Rotunda full of their members; the two chaplains pray and Johnson places a wreath. Robert Kennedy, beside Mrs. Johnson: "We seem always to be meeting at funerals ... There''ve been a lot of them these last four months." And: "You''re doing a wonderful job. Everybody says so ... and so is your husband."'
      n: '[[w.johnson-white-house-diary]], 102–03 (Lady Bird Johnson''s account; Johnson on the ride tells Lynda Bird of the Silver Star MacArthur gave him in New Guinea). Names: Johnson, Lady Bird Johnson, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-04-08.press-and-broadcasting
      when: Apr. 8
      date: '1964-04-08'
      thread: press-and-broadcasting
      c: Lippmann on television, an hour. On foreign aid, by Mrs. Johnson's account, ammunition for those against it; of the Vice Presidency, it makes no difference whom Johnson asks, for he does not need the help; McNamara, once a registered Republican, put aside.
      n: '[[w.johnson-white-house-diary]], 104 (Lady Bird Johnson''s account). Names: Lippmann, Johnson, McNamara.'
      tags:
      - name:lippmann-walter
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-04-09.succession
      when: Apr. 9
      date: '1964-04-09'
      thread: succession
      c: New York Hilton. The first anniversary luncheon of the Eleanor Roosevelt Memorial Foundation, 2,800 at $12.50, to raise $100,000, Jean Kintner its organizer. Mrs. Johnson, Mrs. Kintner and Anna Rosenberg Hoffman receive donors of $1,000. Stevenson introduces Mrs. Johnson, who speaks of Mrs. Roosevelt at a benefit luncheon in 1939 and of her speaking out. Marian Anderson reads from Mrs. Roosevelt's book.
      n: '[[w.johnson-white-house-diary]], 105–06 (Lady Bird Johnson''s account; she speaks from a draft she wrote with Hester Provenson). Names: Lady Bird Johnson, Stevenson.'
      tags:
      - name:johnson-lady-bird
      - name:stevenson-adlai-e
- cite:
    id: cal.1964-04-09.railroads
    item: '[[w.johnson-white-house-diary]], 106 (the diary: Johnson, who told her at breakfast of the railroad strike due that night, has asked the Brotherhood and the railroads to meet with him; he stays at the office until midnight)'
    units: '?'
- add:
    entry:
      id: cal.1964-04-10.program
      when: Apr. 10
      date: '1964-04-10'
      thread: program
      c: 'The White House, 2:30 p.m. Mrs. Johnson receives Carl Sandburg, his wife and Edward Steichen and Mrs. Steichen, brought by Udall and Mrs. Udall. In the Lincoln Room Sandburg signs her books on Lincoln; Johnson joins; Sandburg: "You look like you could take care of yourself." Tea in the Yellow Room. Then Johnson takes them into the Cabinet Room to see the railroad leaders: "some tough men operating . . . men who can throw several million people out of work."'
      n: '[[w.johnson-white-house-diary]], 107–08 (Lady Bird Johnson''s account). See [[cal.1964-04-09.railroads]]. Names: Lady Bird Johnson, Johnson, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:udall-stewart-l
- add:
    entry:
      id: cal.1964-04-10.press-and-broadcasting
      when: Apr. 10
      date: '1964-04-10'
      thread: press-and-broadcasting
      c: 'The Truman Balcony. Johnson takes Sandburg and Steichen out on the balcony and shouts back and forth with reporters in the Rose Garden. The Associated Press: "President Johnson staged a balcony scene."'
      n: '[[w.johnson-white-house-diary]], 107–08 (Lady Bird Johnson''s account, quoting the AP and the Herald Tribune). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-04-10.transition-and-staff
      when: Apr. 10
      date: '1964-04-10'
      thread: transition-and-staff
      c: 'The home of Mr. and Mrs. Dillon. Dinner in honor of Under Secretary Fowler and Mrs. Fowler, who is leaving government for the third time; toasts. Johnson''s toast: "Go off and get rich and have a good time—for about ninety days."'
      n: '[[w.johnson-white-house-diary]], 108–09 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Dillon, Fowler.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:dillon-c-douglas
      - name:fowler-henry-h
- add:
    entry:
      id: cal.1964-04-14.middle-east-2
      when: Apr. 14
      date: '1964-04-14'
      thread: middle-east
      c: The White House, 11:30 a.m. King Hussein of Jordan arrives by helicopter on the South Lawn, with his brother Prince Hassan; Johnson's welcome and the King's response on the North Portico. Johnson, to the surprise of the Secret Service, rides with him to Blair House and walks back, shaking hands and signing autographs.
      n: '[[w.johnson-white-house-diary]], 109 (Lady Bird Johnson''s account; Johnson told her to appear). See [[cal.1964-04-14.middle-east]]. Names: Johnson, Lady Bird Johnson, Hussein.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:hussein-ibn-talal
- add:
    entry:
      id: cal.1964-04-14.consumers
      when: Apr. 14
      date: '1964-04-14'
      thread: consumers
      c: The Department of Agriculture. Mrs. Johnson opens the Food and Home Fair for Consumers, Jane and Orville Freeman, Esther Peterson and Mrs. John G. Lee of the Consumer Advisory Council receiving her; a few words as the family's "purchasing agent."
      n: '[[w.johnson-white-house-diary]], 109–10 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Freeman, Esther Peterson.'
      tags:
      - name:johnson-lady-bird
      - name:freeman-orville-l
      - name:peterson-esther
- add:
    entry:
      id: cal.1964-04-14.middle-east-3
      when: Apr. 14
      date: '1964-04-14'
      thread: middle-east
      c: 'The White House, State dinner for King Hussein, about 150 guests. In the Yellow Oval Room, gifts: from the Johnsons a gold clock, a pen stand and a book of Johnson''s speeches; from the King two bracelets of Abraham''s time, a lamp, and a Bible in mother-of-pearl. The guests include Warren, Ball, the Dukes, Hoover, Najeeb Halaby, Helen Thomas of UPI. Hussein tells Mrs. Johnson that many of the Jordan''s springs rise in Israel; he piloted his own 707; the Dave Brubeck Quartet plays.'
      n: '[[w.johnson-white-house-diary]], 110–12 (Lady Bird Johnson''s account; Hoover "never goes to affairs of this sort"). See [[cal.1964-04-14.middle-east]]. Names: Johnson, Lady Bird Johnson, Hussein, Warren, Ball, Duke, Hoover.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:hussein-ibn-talal
      - name:warren-earl
      - name:ball-george-w
      - name:duke-angier-b
      - name:hoover-j-edgar
- add:
    entry:
      id: cal.1964-04-16.white-house
      when: Apr. 16
      date: '1964-04-16'
      thread: white-house
      c: The White House, afternoon. Johnson brings some forty Texas newspaper editors and their wives to the Oval Room for refreshments, among them Hobby, Mayborn and Humphrey; Jenkins, Cliff Carter and Valenti help; Johnson shows them the gardens from the Truman Balcony.
      n: '[[w.johnson-white-house-diary]], 112 (Lady Bird Johnson''s account; the names are hers). Names: Johnson, Lady Bird Johnson, Jenkins, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:jenkins-walter-w
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-04-16.program
      when: Apr. 16
      date: '1964-04-16'
      thread: program
      c: 'The White House, dinner. Barbara Ward (Lady Jackson), staying on the third floor writing memoranda and speech material, and Dr. Willis Hurst with the Johnsons. Lady Jackson: the money saved and men put out of work by McNamara''s base closings might serve a pilot program in urban renewal, a model city; automation can be a blessing. Johnson listens.'
      n: '[[w.johnson-white-house-diary]], 112–13 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-04-17.press-and-broadcasting
      when: Apr. 17
      date: '1964-04-17'
      thread: press-and-broadcasting
      c: 'The Rose Garden and South Lawn, 5:30 p.m. Reception for the American Society of Newspaper Editors, 1,200. Mrs. Johnson and Lynda Bird welcome them; Johnson speaks: the President''s duties, civil rights, the war on poverty, "turning tax eaters into tax payers," 49 percent of draftees unfit, Medicare, the pay bill, the railroad talks; and "we must either love each other or we must die." Food in the State Dining Room, dancing in the East Room; Miles Wolff and Herbert Brucker of the Society with them.'
      n: '[[w.johnson-white-house-diary]], 113–14 (Lady Bird Johnson''s account). To check: the Public Papers, remarks to the American Society of Newspaper Editors, Apr. 17, 1964. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-04-19.white-house
      when: Apr. 19
      date: '1964-04-19'
      thread: white-house
      c: Johnson and Mrs. Johnson to St. Mark's Church with Dillon and Mrs. Dillon and Stevenson, who had come about 10:15 to talk a little business; Johnson shakes hands with tourists at the gate. Lunch with the Dillons and the McNamaras.
      n: '[[w.johnson-white-house-diary]], 114–15 (Lady Bird Johnson''s account; she does not say what Stevenson''s business was). Names: Johnson, Lady Bird Johnson, Dillon, Stevenson, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:dillon-c-douglas
      - name:stevenson-adlai-e
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-04-22.white-house
      when: Apr. 22
      date: '1964-04-22'
      thread: white-house
      c: The White House, 4 p.m. Mrs. Johnson receives about 200 Daughters of the American Revolution, the State Regents and national officers, the first First Lady's reception for them in eleven years; Mrs. Duncan, the president, brings two pairs of white gloves.
      n: '[[w.johnson-white-house-diary]], 115–16 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- cite:
    id: cal.1964-04-22.railroads
    item: '[[w.johnson-white-house-diary]], 116–17 (Johnson comes out of the elevator with the men for the Yellow Room, about twenty, among them Dr. William J. Taylor of the mediators; later, thumb and forefinger raised to Mrs. Johnson as a sign of success; the announcement on television on the David Brinkley show, with a word for Taylor, whose wife was in surgery; not the terms)'
    units: '?'
- cite:
    id: cal.1964-04-24.poverty
    item: '[[w.johnson-white-house-diary]], 117–23 (the day from Chicago, 5:30 a.m.: South Bend, the Cline School, some 15,000, Studebaker''s 8,700 out of work since Christmas Eve, Johnson''s speech from the athletic field; Bunker Hill Air Force Base; Pittsburgh, the League of Women Voters'' convention, Wirtz having brought Johnson along, and the motorcade, a quarter of a million by the police; Inez, Ky., Tom Fletcher''s porch; Paintsville, the courthouse speech; Huntington, nearly two hours with Welsh, Breathitt, Barron and Scranton''s representative on the Appalachian plan, about $3 billion over five years, then the televised speech; with Wirtz, Hodges, Franklin Roosevelt Jr. and Celebrezze; all day, "We are going to have a Civil Rights Bill if it takes all summer"; not the bill of Apr. 28)'
    units: A-D
- add:
    entry:
      id: cal.1964-04-24.poverty-4
      when: Apr. 24
      date: '1964-04-24'
      thread: poverty
      c: Pittsburgh, David McDonald Hall, the Steelworkers' home local. McDonald, introducing Johnson, pledges "that the Union shall do all of the down-to-earth work that is possible to elect you this November." Mrs. Johnson speaks a minute.
      n: '[[w.johnson-white-house-diary]], 119–20 (Lady Bird Johnson''s account: "the first really outspoken assumption that Lyndon is running"). See [[cal.1964-04-24.poverty]]. Names: Johnson, Lady Bird Johnson, David McDonald.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mcdonald-david-l
      also:
      - elections-1964-johnson
- add:
    entry:
      id: cal.1964-04-25.succession
      when: Apr. 25
      date: '1964-04-25'
      thread: succession
      c: The White House, morning. Johnson holds a brief press conference in his office, 60 to 70 reporters in a half circle, with Truman on his right and J. Frank Dobie, the Texas folklorist, a guest at the White House, on his left.
      n: 'The President''s News Conference, [1963–64 Pub. Papers 547](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=631) (Apr. 25, 1964). [[w.johnson-white-house-diary]], 123–24 (Lady Bird Johnson''s account, from Dobie''s description; she gives no subject). Names: Johnson, Truman.'
      tags:
      - name:johnson-lyndon-b
      - name:truman-harry-s
- add:
    entry:
      id: cal.1964-04-25.succession-2
      when: Apr. 25
      date: '1964-04-25'
      thread: succession
      c: 'The White House, lunch after 2 p.m. Johnson with Truman, Dobie and the editors Walker Stone and Bill Steven; Lynda Bird and a friend. Truman on the decision to use the bomb: told it would end the war in days, he asked Marshall and Bradley the cost of an invasion, 200,000 to 250,000 lives; "there was nothing to do but drop it." His hard decisions all made the same way, and he sleeps. Dobie reports Truman as saying, "Lyndon Johnson may be the greatest President since Lincoln," from the railroad settlement.'
      n: '[[w.johnson-white-house-diary]], 124 (Lady Bird Johnson''s account; the Lincoln remark is Dobie''s report). Names: Johnson, Truman, Marshall, Bradley.'
      tags:
      - name:johnson-lyndon-b
      - name:truman-harry-s
      - name:marshall-george-c
      - name:bradley-omar-n
- add:
    entry:
      id: cal.1964-04-25.succession-3
      when: Apr. 25
      date: '1964-04-25'
      thread: succession
      c: The Gridiron Dinner, Washington. Johnson attends in white tie, a stag dinner; Dobie goes with Walker Stone.
      n: '[[w.johnson-white-house-diary]], 124–25 (Lady Bird Johnson''s account; she records only that he goes). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-04-27.south-asia
      when: Apr. 27
      date: '1964-04-27'
      thread: south-asia
      c: 'The White House, 11 a.m. Mrs. Johnson has coffee with Indira Gandhi, Mrs. Avtar Dhar of the Indian Embassy and Mrs. Rusk; Mrs. Gandhi: the health of Nehru is steadily improving. Mrs. Johnson thinks that with Nehru gone Mrs. Gandhi may be the leading influence in India.'
      n: '[[w.johnson-white-house-diary]], 125 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Indira Gandhi, Rusk.'
      tags:
      - name:johnson-lady-bird
      - name:gandhi-indira
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-04-27.white-house
      when: Apr. 27
      date: '1964-04-27'
      thread: white-house
      c: 'Georgetown. Mrs. Johnson asks Mrs. Kennedy to attend the meeting of the Committee for the Preservation of the White House and the tea on May 7. Mrs. Kennedy: "I cannot return to the White House"; she asks Mrs. Johnson to tell them she sends her best wishes. Mrs. Johnson shows her the East Room drapery fabric, chosen last summer from Boudin.'
      n: '[[w.johnson-white-house-diary]], 125–27 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1964-04-27.labor
      when: Apr. 27
      date: '1964-04-27'
      thread: labor
      c: The White House. Johnson's impromptu reception for labor newspaper editors, nominally stag; Johnson sends for Mrs. Johnson because some of the editors are women.
      n: '[[w.johnson-white-house-diary]], 127 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-04-28.program
      when: Apr. 28
      date: '1964-04-28'
      thread: program
      c: The White House, black-tie dinner for business leaders. Batten of J. C. Penney, Blough of U.S. Steel, Busch, Donald David of the Ford Foundation, Henry Ford II, Greenewalt of du Pont, Kappel, McCabe of Scott Paper, David and James Rockefeller and Touhy of the C&O among them. Mrs. Johnson, at Johnson's note passed by Valenti, proposes a toast "on behalf of a grateful nation to the leaders of business in this generous country, who have done so much for so many, and in the doing, have made us great"; dancing in the East Room.
      n: '[[w.johnson-white-house-diary]], 127–28 (Lady Bird Johnson''s account; she does not give the guests as a list of the whole). Names: Johnson, Lady Bird Johnson, Blough, Henry Ford II, Kappel, David Rockefeller, Valenti.'
      tags:
      - name:johnson-lyndon-b
