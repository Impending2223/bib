      when: May 25
      date: '1964-05-25'
      thread: program
      c: New York, Museum of Modern Art, evening. Dinner for 400 at the opening of the new wing, at Frank Stanton's urging;
        Stevenson takes Mrs. Johnson; David Rockefeller speaks; Lipchitz, who designed the Presidential scholars' medal, at
        her table. Mrs. Johnson presses the switch that lights the garden and the wing and salutes "a war against the poverty
        of man's spirit."
      n: '[[w.johnson-white-house-diary]], 146–48 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Stevenson, Stanton,
        David Rockefeller.'
      tags:
