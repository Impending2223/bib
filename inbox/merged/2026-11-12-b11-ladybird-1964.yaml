    item: '[[w.johnson-white-house-diary]], 51–52, 59–60, 66, 89 (the evenings for the Senate, Thursdays, Jan. 16, 23 and 30, "our last dinner and briefing for the Senate": cocktails, a briefing for the men, the wives shown the second floor, dinner; for the House six groups, the last Mar. 11, Lynda Bird hostess; not twice a week, nor about fifty at a time)'
    units: '?'
