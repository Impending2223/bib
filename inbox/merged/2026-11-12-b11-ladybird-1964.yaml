- add:
    entry:
      id: cal.1964-04-30.white-house
      when: Apr. 30
      date: '1964-04-30'
      thread: white-house
      c: The Sheraton Park, the Congressional Club's annual breakfast in honor of the First Lady, about a thousand women; the president Carrie Davis. Mrs. Johnson recalls her first, in 1938, with Eleanor Roosevelt as guest.
      n: '[[w.johnson-white-house-diary]], 128–29 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-04-30.program-2
      when: Apr. 30
      date: '1964-04-30'
      thread: program
      c: 'Winchester, Va. Johnson drives to the Shenandoah Apple Blossom Festival for the crowning of Luci Johnson as queen by General LeMay on the steps of the high school: "She''s always been a Queen to me." His telegram to the festival''s officials warns the city of Winchester "is in danger of being taken over by a new monarch."'
      n: '[[w.johnson-white-house-diary]], 129–30 (Lady Bird Johnson''s account; she saw the photograph and read the telegram). Names: Johnson, Lady Bird Johnson, LeMay.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:lemay-curtis-e
- add:
    entry:
      id: cal.1964-04-30.japan-and-korea-far-east
      when: Apr. 30
      date: '1964-04-30'
      thread: japan-and-korea-far-east
      c: The White House, Blue Room. Mrs. Johnson, at the State Department's request, receives eleven visiting Japanese Governors and their wives; Duke and Mrs. Ball for the department.
      n: '[[w.johnson-white-house-diary]], 130 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Duke.'
      tags:
      - name:johnson-lady-bird
      - name:duke-angier-b
- add:
    entry:
      id: cal.1964-04-30.democratic-party
      when: Apr. 30
      date: '1964-04-30'
      thread: democratic-party
      c: 'The Sheraton Park, evening. Johnson addresses the Democratic Women''s Conference, 3,000, Margaret Price introducing him; jokes, then women in government jobs: "I promise this tonight not because you need jobs but because the country needs you." Mrs. Johnson takes a bow.'
      n: '[[w.johnson-white-house-diary]], 130 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
