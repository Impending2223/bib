      id: cal.1964-05-25.white-house-2
      when: May 25
      date: '1964-05-25'
      thread: program
      c: 'New York, Waldorf Towers. Stevenson''s party after the opening: Richard Rodgers, Marc Connelly, Galbraith, Josh
        Logan, Fredric March, the Weisls, the Fortases. Galbraith with Mrs. Johnson on her Kentucky trip and the idea of a
        teachers training corps.'
      n: '[[w.johnson-white-house-diary]], 148 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Stevenson, Galbraith,
        Fortas.'
      tags:
      - name:johnson-lady-bird
      - name:stevenson-adlai-e
      - name:galbraith-john-kenneth
      - name:fortas-abe
- cite:
    id: cal.1964-05-27.india-and-china
    item: '[[w.johnson-white-house-diary]], 148–49 (the news of Nehru''s death at about 6 a.m.; Rusk left at dawn for the
      funeral; not the place)'
    units: '?'
