patch: 2026-11-12-b11-ladybird-1964
by: 'Claude (batch 11 reader, Lady Bird Johnson, A White House Diary, Nov. 1963-Nov. 1964; audited in two halves)'
ops:
- cite:
    id: cal.1963-11-22.assassination
    item: '[[w.johnson-white-house-diary]], 3–5 (Lady Bird Johnson''s account from the third car, with Yarborough: a report, then two more shots; Youngblood of the Secret Service throws Johnson to the floor; the car to Parkland; O''Donnell: "The President is dead"; not the times, Tippit or Oswald''s arrest)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-22.succession-18
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: Parkland Hospital, a small room lined with sheets. Johnson with Thornberry, Brooks, O'Donnell and Secret Service agents; he proposes that Air Force One be moved and that Mrs. Johnson see Mrs. Kennedy and Nellie Connally. Kilduff comes in and says "Mr. President." The party leaves for Love Field.
      n: '[[w.johnson-white-house-diary]], 4–5 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Kenneth O''Donnell, Thornberry, Brooks, Jacqueline Kennedy, Kilduff.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:odonnell-kenneth-p
      - name:thornberry-william-h
      - name:brooks-jack-b
      - name:kennedy-jacqueline
- cite:
    id: cal.1963-11-22.robert-kennedy
    item: '[[w.johnson-white-house-diary]], 5 (on Air Force One "a telephone call to Washington—I believe to the Attorney General"; it is decided Johnson be sworn in at once, and Judge Sarah Hughes is called; Lady Bird Johnson''s account, not who spoke or Katzenbach)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession
    item: '[[w.johnson-white-house-diary]], 5–6, 7 (the oath at Mrs. Kennedy''s side, Mrs. Johnson beside him, Judge Hughes before him; the brief statement at Andrews; not the time, the words of the oath or of the statement: "Only about four sentences")'
    units: '?'
- cite:
    id: cal.1963-11-22.succession-14
    item: '[[w.johnson-white-house-diary]], 7 (home from Andrews in a car with Liz Carpenter; not what was said)'
    units: '?'
- cite:
    id: cal.1963-11-23.succession-12
    item: '[[w.johnson-white-house-diary]], 7 (Johnson with Mrs. Johnson to the White House, the Kennedy family in the Green Room; he walks past the casket in the East Room; the Cabinet, congressional leaders, Court and staff there; the diary has no north portico)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-23.succession-13
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      c: St. John's Episcopal Church, Lafayette Square. Johnson and Mrs. Johnson at a brief service after the viewing of the body in the East Room.
      n: '[[w.johnson-white-house-diary]], 7 (Lady Bird Johnson''s account; not the hour). See [[cal.1963-11-23.succession-12]]. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
    id: cal.1963-11-24.succession-6
    item: '[[w.johnson-white-house-diary]], 8 (church at St. Mark''s with Luci and Thornberry; Baxter''s sermon: whoever fostered an atmosphere of hate had his hand on the gun barrel)'
    units: '?'
- cite:
    id: cal.1963-11-24.assassination
    item: '[[w.johnson-white-house-diary]], 8–10 (the ride behind the caisson with Mrs. Kennedy and Robert Kennedy, who says passing a building, "That was where it all began. That was where he ran for the Presidency"; the Rotunda, eulogies by Warren, McCormack and Mansfield, Johnson''s wreath; Mrs. Shriver''s word that Oswald has been killed, in the Green Room before; not Ruby or the times)'
    units: C
- cite:
    id: cal.1963-11-26.succession-3
    item: '[[w.johnson-white-house-diary]], 10 (J. B. West at The Elms in the morning on moving three suites of furniture; Mrs. Johnson''s and her daughters'' into Mrs. Kennedy''s, Caroline''s and John Jr.''s rooms)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-26.succession-5
      when: Nov. 26
      date: '1963-11-26'
      thread: succession
      c: 'The White House, 3 p.m. Mrs. Kennedy receives Mrs. Johnson to go over the housekeeping, by Mrs. Johnson''s account: West and the Curator, Ketchum, to depend on; the third-floor school to continue until after Christmas, which Mrs. Johnson grants. Mrs. Johnson asks her, by her later account, to serve on a committee for the house.'
      n: '[[w.johnson-white-house-diary]], 10–12, 61 (Lady Bird Johnson''s account; the request to serve is in her entry of Jan. 24, 1964: "I had asked her the very first day ... Tuesday, November 26"). See [[cal.1963-11-26.succession-3]]. Names: Lady Bird Johnson, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
- cite:
    id: cal.1963-11-26.latin-america
    item: '[[w.johnson-white-house-diary]], 12 (the East Room, about 5 p.m.: Johnson to the Alliance for Progress members, by Mrs. Johnson to reassure them of "our country''s continued strength and interest in them"; Mrs. Johnson and Mrs. Kennedy take seats behind him; not his words)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-02.program
      when: Dec. 2
      date: '1963-12-02'
      thread: program
      c: 'The Cabinet Room, late afternoon. Johnson presents the Enrico Fermi Award to Oppenheimer, the citation signed by Kennedy before his death, with the $50,000 to Mrs. Oppenheimer. Present: the senior Democrats of the Atomic Energy Committee, Teller, Smyth; the ranking Republicans absent, "reportedly" by choice. Johnson, handing the check to Mrs. Oppenheimer: "The wives usually get hold of the money." Oppenheimer: "it has taken some charity and some courage for you to make this award today."'
      n: '[[w.johnson-white-house-diary]], 12–13 (Lady Bird Johnson''s account; she was present). To check: the Public Papers, remarks at the presentation, Dec. 2, 1963. Names: Johnson, Lady Bird Johnson, Oppenheimer, Kennedy, Teller.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:oppenheimer-j-robert
      - name:kennedy-john-f
      - name:teller-edward
- add:
    entry:
      id: cal.1963-12-02.succession-2
      when: Dec. 2
      date: '1963-12-02'
      thread: succession
      c: The Elms, dinner. Johnson and Mrs. Johnson with Drew and Luvie Pearson, Justice and Mrs. Goldberg, Bess and Tyler Abell.
      n: '[[w.johnson-white-house-diary]], 13–14 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Drew Pearson, Goldberg.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:pearson-drew
      - name:goldberg-arthur-j
- cite:
    id: cal.1963-12-07.succession
    item: '[[w.johnson-white-house-diary]], 14–16 (the move in the afternoon, Mr. West notifying them Mrs. Kennedy had left; the press at the gates; not the hour)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-07.press-and-broadcasting-2
      when: Dec. 7
      date: '1963-12-07'
      thread: press-and-broadcasting
      c: 'Mrs. Johnson, impatient with the press''s question when the Johnsons will move in, to Liz Carpenter, her staff director and press secretary, who passes it on to the newswomen word for word: "I would to God I could serve Mrs. Kennedy''s comfort; I can at least serve her convenience." The question abates.'
      n: '[[w.johnson-white-house-diary]], 14 (Lady Bird Johnson''s account, in her entry of Dec. 7: "Several days ago"). Check: the day. Names: Lady Bird Johnson, Carpenter, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1963-12-14.congress
      when: Dec. 14
      date: '1963-12-14'
      thread: congress
      c: 'The White House, dinner. Johnson with Boggs, Albert Thomas, Mills, Brooks, Albert, Gerald Ford and Thornberry and their wives. The talk: recognizing the Dominican Republic, Mann''s naming for Latin America, and "the Tax Bill, the Tax Bill, the Tax Bill."'
      n: '[[w.johnson-white-house-diary]], 16–17 (Lady Bird Johnson''s account). See [[cal.1963-12-14.latin-america]]. Names: Johnson, Lady Bird Johnson, Boggs, Albert Thomas, Mills, Brooks, Albert, Gerald Ford, Thornberry, Mann.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:boggs-hale
      - name:thomas-albert
      - name:mills-wilbur-d
      - name:brooks-jack-b
      - name:albert-carl
      - name:ford-gerald-r
      - name:thornberry-william-h
      - name:mann-thomas-c
- add:
    entry:
      id: cal.1963-12-18.program-2
      when: Dec. 18
      date: '1963-12-18'
      thread: program
      c: Eva Adams, Director of the Mint, and the sculptor Gilroy Roberts show Mrs. Johnson a head of Johnson for the Presidential medal. She asks a change in the mouth, for "a certain grimness"; Roberts makes it.
      n: '[[w.johnson-white-house-diary]], 17–18 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson, Eva Adams.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- cite:
    id: cal.1963-12-21.foreign-aid
    item: '[[w.johnson-white-house-diary]], 18–19 (Mrs. Johnson, Dec. 21: Congress will not adjourn, so no flight home on Sunday; she goes to the President''s office to comfort him; not Halleck or the credit for wheat sales)'
    units: '?'
- cite:
    id: cal.1963-12-24.foreign-aid
    item: '[[w.johnson-white-house-diary]], 19 (the House met early and passed the foreign aid bill, which released the Johnsons; not the amendment or the vote)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-24.succession
      when: Dec. 24
      date: '1963-12-24'
      thread: succession
      c: Johnson leaves Washington about 9:30 a.m., after the House passes the foreign aid bill. At Philadelphia, the funeral of Representative William Green; then to Austin.
      n: '[[w.johnson-white-house-diary]], 19 (Lady Bird Johnson''s account). See [[cal.1963-12-23.democratic-party]], [[cal.1963-12-24.foreign-aid]]. Names: Johnson, Lady Bird Johnson, William Green.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:green-william-j-jr
- add:
    entry:
      id: cal.1963-12-24.succession-2
      when: Dec. 24
      date: '1963-12-24'
      thread: succession
      c: Austin, the Governor's Mansion. Johnson and Mrs. Johnson see Connally, his arm in a sling, and his wife.
      n: '[[w.johnson-white-house-diary]], 19 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Connally.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:connally-john
- add:
    entry:
      id: cal.1963-12-25.press-and-broadcasting-4
      when: Dec. 25
      date: '1963-12-25'
      thread: press-and-broadcasting
      c: The LBJ Ranch. The press at the house for a family Christmas picture; at a reporter's request Johnson takes fifty to seventy-five of them through the house, and gives them ashtrays.
      n: '[[w.johnson-white-house-diary]], 21 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
    id: cal.1963-12-27.succession
    item: '[[w.johnson-white-house-diary]], 21–22 (some two hundred reporters, White House, Texas and German, by bus round the Ranch, Mrs. Johnson on the microphone; the barbecue; Johnson on a bale of hay introduces Rusk, Freeman and Mann, "whose job as Number One coordinator of Latin American affairs had been announced"; by Mrs. Johnson "an all-around press conference, but most casual"; not the budget)'
    units: A
- add:
    entry:
      id: cal.1963-12-28.europe-and-the-alliance-2
      when: Dec. 28
      date: '1963-12-28'
      thread: europe-and-the-alliance
      c: 'Bergstrom Air Force Base, Austin. Johnson and Mrs. Johnson, Connally and his wife meet Erhard: troops reviewed, both anthems, brief speeches by Erhard and Johnson. Then by helicopter to the Ranch.'
      n: '[[w.johnson-white-house-diary]], 23 (Lady Bird Johnson''s account). To check: the Public Papers, remarks on Erhard''s arrival, Dec. 28, 1963. See [[cal.1963-12-28.europe-and-the-alliance]]. Names: Johnson, Lady Bird Johnson, Connally, Erhard.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:connally-john
      - name:erhard-ludwig
- add:
    entry:
      id: cal.1963-12-28.europe-and-the-alliance-3
      when: Dec. 28
      date: '1963-12-28'
      thread: europe-and-the-alliance
      c: The Ranch, evening. Stag dinner for Erhard and about forty of the German delegation. Gifts exchanged; the Johnsons give a book of poems by Hulda Walter, a Fredericksburg girl, translated, with a letter to Mrs. Erhard.
      n: '[[w.johnson-white-house-diary]], 24 (Lady Bird Johnson''s account). See [[cal.1963-12-28.europe-and-the-alliance]]. Names: Johnson, Lady Bird Johnson, Erhard.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:erhard-ludwig
- add:
    entry:
      id: cal.1963-12-29.europe-and-the-alliance-2
      when: Dec. 29
      date: '1963-12-29'
      thread: europe-and-the-alliance
      c: Fredericksburg. Johnson and Mrs. Johnson with Erhard and the German party at the Pioneer Memorial; speeches by the postmaster and a lawyer, a book presented to Erhard, his response; then the Lutheran church service.
      n: '[[w.johnson-white-house-diary]], 24–25 (Lady Bird Johnson''s account). See [[cal.1963-12-29.europe-and-the-alliance]]. Names: Johnson, Lady Bird Johnson, Erhard.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:erhard-ludwig
- add:
    entry:
      id: cal.1963-12-29.europe-and-the-alliance-3
      when: Dec. 29
      date: '1963-12-29'
      thread: europe-and-the-alliance
      c: 'Stonewall school gymnasium, the barbecue for Erhard: the German delegation, the German, White House and local press, about seventy-five invited guests; Van Cliburn plays. Johnson introduces the Germans and his own party; Rusk''s introduction moving. Toasts by Erhard and Johnson.'
      n: '[[w.johnson-white-house-diary]], 25–27 (Lady Bird Johnson''s account; the guests are hers, among them Von Braun, Kleberg, Ransom and Dobie). See [[cal.1963-12-29.europe-and-the-alliance]]. Names: Johnson, Erhard, Rusk, Van Cliburn.'
      tags:
      - name:johnson-lyndon-b
      - name:erhard-ludwig
      - name:rusk-dean
- cite:
    id: cal.1963-12-30.defense
    item: '[[w.johnson-white-house-diary]], 27 (the Joint Chiefs, led by Taylor and including LeMay and Shoup, at the Ranch in the morning; Heller and Gordon in and out of the meetings; not McNamara, Gilpatric or the reporters)'
    units: '?'
- cite:
    id: cal.1963-12-29.poverty
    item: '[[w.johnson-white-house-diary]], 27 (Heller and Gordon at the Ranch, in and out of the meetings of Dec. 30; Lynda Bird talks economics with Heller after dinner; not poverty)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-30.succession
      when: Dec. 30
      date: '1963-12-30'
      thread: succession
      c: Austin. Johnson and Mrs. Johnson at the funeral of Mrs. Tom Miller, widow of the mayor.
      n: '[[w.johnson-white-house-diary]], 27–28 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1963-12-30.succession-2
      when: Dec. 30
      date: '1963-12-30'
      thread: succession
      c: 'Austin, dedication of the Agudas Achim Synagogue, postponed from Nov. 24. Novy introduces Johnson: "all those Jews he got out of Germany during the days of Hitler." Johnson: his first unofficial speech in the office was in a place of worship in his home town.'
      n: '[[w.johnson-white-house-diary]], 28 (Lady Bird Johnson''s account; the words are Novy''s as she gives them). To check: the Public Papers, remarks at the dedication, Dec. 30, 1963. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-05.press-and-broadcasting
      when: Jan. 5
      date: '1964-01-05'
      thread: press-and-broadcasting
      c: St. Barnabas Church, Fredericksburg. Johnson and Mrs. Johnson with James Reston of the *New York Times*, Mrs. Reston, Lynda Bird and Gerri Whittington; then a drive through Johnson City, the boyhood home to become a community center.
      n: '[[w.johnson-white-house-diary]], 29–30 (Lady Bird Johnson''s account; she records no talk with Reston). Names: Johnson, Lady Bird Johnson, Reston.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:reston-james
- add:
    entry:
      id: cal.1964-01-05.elections-1964-johnson
      when: Jan. 5
      date: '1964-01-05'
      thread: elections-1964-johnson
      c: 'Austin. Johnson and Mrs. Johnson at Senator Yarborough''s New Year''s reception for his neighbors, the street gathered to see them. Mrs. Johnson, in her diary: "We''re going to need him, we''re going to need everybody, we''re going to need to make peace all around."'
      n: '[[w.johnson-white-house-diary]], 30 (Lady Bird Johnson''s account; before it, coffee with the Connallys at the Governor''s Mansion). Names: Johnson, Lady Bird Johnson, Yarborough.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:yarborough-ralph
- add:
    entry:
      id: cal.1964-01-07.labor
      when: Jan. 7
      date: '1964-01-07'
      thread: labor
      c: 'The White House, 1 p.m. Johnson''s stag luncheon for labor leaders. Mrs. Johnson stands in line in the Red Room to greet them: Meany, Reuther, Dubinsky, James Carey, David McDonald, Suffridge and Biemiller; the Cabinet officers and staff receiving them are Rusk, Dillon, McNamara, Hodges, Wirtz, Gordon, Heller, O''Brien, Salinger and Sorensen.'
      n: '[[w.johnson-white-house-diary]], 32 (Lady Bird Johnson''s account; she records no talk; the guests'' names are hers). Names: Johnson, Lady Bird Johnson, Meany, Reuther, Rusk, Dillon, McNamara, Hodges, Wirtz, Kermit Gordon, Heller, O''Brien, Salinger, Sorensen.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:meany-george
      - name:reuther-walter
      - name:rusk-dean
      - name:dillon-c-douglas
      - name:mcnamara-robert-s
      - name:hodges-luther-h
      - name:wirtz-w-willard
      - name:gordon-kermit
      - name:heller-walter-w
      - name:obrien-lawrence-f
      - name:salinger-pierre
      - name:sorensen-theodore-c
- add:
    entry:
      id: cal.1964-01-07.economy-2
      when: Jan. 7
      date: '1964-01-07'
      thread: economy
      c: 'The White House, evening. Stag dinner for the Business Council, about 89 businessmen: Blough of U.S. Steel, Kappel of A.T.&T., Watson of I.B.M., McElroy of Procter and Gamble, C. R. Smith of American Airlines, Stanton of C.B.S., Lazarus, Murphy, McCollum and Turman among them. Dillon, McNamara, Hodges, Wirtz, Gordon and Heller attend "to give them an impression of what this Administration plans to do."'
      n: '[[w.johnson-white-house-diary]], 33 (Lady Bird Johnson''s account; she greets sixteen guests upstairs before Johnson comes down, then leaves them). See [[cal.1963-12-07.economy-2]]. Names: Johnson, Lady Bird Johnson, Blough, Kappel, McElroy, C. R. Smith, Stanton, Dillon, McNamara, Hodges, Wirtz, Kermit Gordon, Heller.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:blough-roger-m
      - name:kappel-frederick-r
      - name:mcelroy-neil-h
      - name:smith-c-r
      - name:stanton-frank
      - name:dillon-c-douglas
      - name:mcnamara-robert-s
      - name:hodges-luther-h
      - name:wirtz-w-willard
      - name:gordon-kermit
      - name:heller-walter-w
- check:
    id: cal.1963-12-07.economy-2
    text: 'Check: Lady Bird Johnson, 33, has "about eighty-nine businessmen" at a stag dinner for the Business Council at the White House on the evening of Jan. 7, 1964, with Cabinet officers; the entry has the same number on Dec. 7, 1963, in the Cabinet Room. Whether one event, and which day.'
- cite:
    id: cal.1964-01-08.program
    item: '[[w.johnson-white-house-diary]], 34–35 (the House chamber: Mrs. Johnson in the front row with Luci and relatives; Johnson introduced, McCormack and Hayden behind him; the opening, "I will be brief", and the war on poverty; about thirty minutes; the Republican applause sparse; she speaks to the press after)'
    units: '?'
- add:
    entry:
      id: cal.1964-01-10.white-house
      when: Jan. 10
      date: '1964-01-10'
      thread: white-house
      c: The Yellow Room, 4 p.m. Mrs. Johnson's tea for about sixty-five newswomen. She introduces Esther Peterson, the President's Assistant for Consumer Problems, who discusses her mail and plans; a tour of the second floor; the tea to set the tone of her "informal meetings" with the press.
      n: '[[w.johnson-white-house-diary]], 36–37 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Esther Peterson.'
      tags:
      - name:johnson-lady-bird
      - name:peterson-esther
- add:
    entry:
      id: cal.1964-01-11.poverty
      when: Jan. 11
      date: '1964-01-11'
      thread: poverty
      c: 'Pennsylvania. Mrs. Johnson with Flood, McDade, Batt, Carpenter, Kilduff and about forty newswomen to the coal region, 11 percent unemployed by Flood''s figure, twice the national rate. Scranton: Mrs. Scranton at her side, the Courthouse Square, flowers, the Mayor. Wilkes-Barre: the key to the city, Goldsmith Mill (a payroll of about a hundred saved by the town and the A.R.A.), the Wyoming Valley Technical Institute.'
      n: '[[w.johnson-white-house-diary]], 38–40 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Flood, Batt, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:flood-daniel-j
      - name:batt-william-l-jr
      - name:carpenter-liz
- add:
    entry:
      id: cal.1964-01-11.poverty-2
      when: Jan. 11
      date: '1964-01-11'
      thread: poverty
      c: Wilkes College, Wilkes-Barre. Mrs. Johnson meets students, then attends the dedication of the Science Center, built with A.R.A. funds matched locally; the speaker Frank Graham, former Senator, praises her. Lunch before at the home of the college's president, Eugene Farley.
      n: '[[w.johnson-white-house-diary]], 40–41 (Lady Bird Johnson''s account). See [[cal.1964-01-11.poverty]]. Names: Lady Bird Johnson, Graham.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-11.democratic-party
      when: Jan. 11
      date: '1964-01-11'
      thread: democratic-party
      c: The White House, 6:30 p.m. Mrs. Johnson with Johnson receives about 150 Democratic National Committee members, State chairmen and vice chairmen, and Democratic women. In the State Dining Room Johnson stands on a chair and speaks of the Administration's aims and plans; Margaret Price, vice chairman, takes over the party.
      n: '[[w.johnson-white-house-diary]], 41 (Lady Bird Johnson''s account; Mrs. Johnson was called on for a greeting). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
    id: cal.1964-01-12.civil-rights-bill-2
    item: '[[w.johnson-white-house-diary]], 41–42 (Camp David: Johnson to church in Thurmont; Russell arrives about 11 and tells of Antietam, the lost Lee order and McClellan; McNamara''s staff, Vance among them, telephone about Panama; not Russell''s other meetings)'
    units: '?'
- add:
    entry:
      id: cal.1964-01-13.latin-america-panama
      when: Jan. 13
      date: '1964-01-13'
      thread: latin-america-panama
      c: The Cabinet Room, from about 9 p.m. Johnson with Rusk, McNamara, Bundy and others, about fourteen in all; the meeting breaks up a little after midnight, Johnson talks with his staff and reaches home at 2 a.m.
      n: '[[w.johnson-white-house-diary]], 44–45 (Lady Bird Johnson''s account; she learned the hours next morning, and took the meeting for Panama, having watched a program on Panama). Check: the subject. Names: Johnson, Lady Bird Johnson, Rusk, McNamara, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-01-14.europe-and-the-alliance
      when: Jan. 14
      date: '1964-01-14'
      thread: europe-and-the-alliance
      c: Union Station, noon. Johnson and Mrs. Johnson greet President Segni of Italy and Signora Segni at 18 degrees, the fifty States' flags, a short ceremony, then a parade down Pennsylvania Avenue to Blair House.
      n: '[[w.johnson-white-house-diary]], 45–46 (Lady Bird Johnson''s account). To check: the Public Papers, remarks of welcome to Segni, Jan. 14, 1964. Names: Johnson, Lady Bird Johnson, Segni.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-14.europe-and-the-alliance-2
      when: Jan. 14
      date: '1964-01-14'
      thread: europe-and-the-alliance
      c: 'The White House, State dinner for Segni. In the Yellow Room, Warren, Rusk, the Italian ambassador Fenoaltea, Reinhardt and Duke; gifts, a silver box and a 1774 letter of Philip Mazzei. In the East Room, guests include Pastore, Rodino, Fascell, Conte, Meany, Dubinsky, Reuther; Saragat on Mrs. Johnson''s left. Entertainment by Robert Merrill and the Christy Minstrels. Johnson, at the porch: "I must get back to work."'
      n: '[[w.johnson-white-house-diary]], 46–47 (Lady Bird Johnson''s account; Bundy is quoted: "The President just hates to be unemployed."). Names: Johnson, Lady Bird Johnson, Segni, Warren, Rusk, Duke, Pastore, Rodino, Fascell, Conte, Meany, Reuther, Saragat, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:warren-earl
      - name:rusk-dean
      - name:duke-angier-b
      - name:pastore-john-o
      - name:rodino-peter-w-jr
