      - name:rusk-dean
- add:
    entry:
      id: cal.1964-06-04.white-house
      when: June 4
      date: '1964-06-04'
      thread: white-house
      c: The East Room, 5 p.m. Mark Bortman of Boston, who headed the People-to-People program, presents John Adams's silver
        coffee urn to the White House, before 13 Adamses, the Massachusetts delegation led by Saltonstall, and about 80 guests.
        Mrs. Johnson accepts it; Thomas Boylston Adams of the Massachusetts Historical Society gives her two volumes of the
        Adams letters.
      n: '[[w.johnson-white-house-diary]], 151–53 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Saltonstall, Thomas
        Boylston Adams.'
      tags:
      - name:johnson-lady-bird
      - name:saltonstall-leverett
      - name:adams-thomas-boylston
- add:
    entry:
      id: cal.1964-06-04.white-house-2
      when: June 4
      date: '1964-06-04'
      thread: program
      c: The home of Max Freedman, Washington. Johnson and Mrs. Johnson at a birthday supper for Bill Moyers, thirty, about
        twenty present.
      n: '[[w.johnson-white-house-diary]], 153 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Moyers.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:moyers-bill
- add:
    entry:
      id: cal.1964-06-04.elections-1964-johnson
      when: June 4
      date: '1964-06-04'
      thread: elections-1964-johnson
      c: The Senate caucus room. Rally forming Young Citizens for Johnson, Bayh and Marvella Bayh the organizers; Charlotte
        Ford, daughter of Henry Ford II, who says she decided to vote for Johnson before her father, a Republican, declared
        for him; John Reuther, son of Victor Reuther, Bobby Mitchell of the Redskins, Peter Duchin and Mayor Wagner's son
        Bob Jr. among them. Lynda Bird and Luci attend.
      n: '[[w.johnson-white-house-diary]], 154 (Lady Bird Johnson''s account of the *New York Times* report; "yesterday" in
        her entry of June 5). Names: Johnson, Bayh, Lynda Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:bayh-birch
      - name:johnson-lynda-bird
- add:
    entry:
      id: cal.1964-06-05.middle-east-2
      when: June 5
      date: '1964-06-05'
      thread: south-asia
      c: 'National Cathedral. Memorial service for Nehru, Johnson and Mrs. Johnson attending with Rusk and Mrs. Rusk and Mrs.
        B. K. Nehru; B. K. Nehru, India''s Ambassador, followed with Bunker, formerly Ambassador to India, and Dean Sayre.
        Present: Lord and Lady Harlech, Dobrynin, the Dean of the Corps. Bunker on Nehru: lines of Frost on a pad on his desk.'
      n: '[[w.johnson-white-house-diary]], 154–55 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Nehru,
        Rusk, Bunker, Dobrynin.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:nehru-jawaharlal
      - name:rusk-dean
      - name:bunker-ellsworth
      - name:dobrynin-anatoly
- cite:
    id: cal.1964-06-05.middle-east
    item: '[[w.johnson-white-house-diary]], 155 (the State luncheon at the White House for the Shah and the Empress Farah,
      Mrs. Johnson on the North Portico; Johnson late; the Shah on his dams, one a year; not the talks with Johnson)'
    units: '?'
- add:
    entry:
      id: cal.1964-06-05.program
      when: June 5
      date: '1964-06-05'
      thread: program
      c: 'The White House. Dinner for John and Elaine Steinbeck. Johnson''s troubles, by Mrs. Johnson''s account: the Turks
        on the point of invading Cyprus; the coal industry wants Venezuelan oil imports stopped. Steinbeck on Russia: the
        Russians'' dislike of the Chinese, shown by Khrushchev''s daughter Rada; "blindness" not to have relations with a
        quarter of the people of the earth, Red China; invite young Russian writers who object to their government. Steinbeck
        has written a piece on Johnson that the Democratic Committee will likely distribute at the Convention; Mrs. Johnson
        asks for more such help. The Johnsons walk the Steinbecks across Pennsylvania Avenue.'
      n: '[[w.johnson-white-house-diary]], 155–57 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Khrushchev.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:khrushchev-nikita-s
      also:
      - cyprus
- cite:
    id: cal.1964-06-06.laos
    item: '[[w.johnson-white-house-diary]], 157–58 (the telephone call from McGeorge Bundy at 4:30 a.m. that one of the reconnaissance
      planes had been shot down over Laos; Johnson up early)'
    units: '?'
- add:
    entry:
      id: cal.1964-06-06.laos-2
      when: June 6
      date: '1964-06-06'
      thread: laos
      c: 'Johnson in the White House hall to Mrs. Johnson, about 1:45 p.m.: "We''ve got our planes ready to go in if absolutely
        necessary. Everybody''s in agreement that we can''t turn and run." He asks her to take something to Walter Jenkins.'
      n: '[[w.johnson-white-house-diary]], 158 (Lady Bird Johnson''s account; she puts it about 1:45 p.m.). See [[cal.1964-06-06.laos]].
        Names: Johnson, Lady Bird Johnson, Walter Jenkins.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1964-06-09.program
      when: June 9
      date: '1964-06-09'
      thread: program
      c: 'Cambridge, Mass. Mrs. Johnson gives the baccalaureate address at Radcliffe, in the Memorial Church of Harvard: education
        a loan to be repaid by a gift of self; the "natural woman"; better cities; "make your front line of freedom your front
        door"; women''s low voting rate. She notes Mary Bunting''s appointment to the Atomic Energy Commission by Johnson.'
      n: '[[w.johnson-white-house-diary]], 158–60 (Lady Bird Johnson''s account; Johnson spoke at Swarthmore the day before).
        Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-06-09.program-2
      when: June 9
      date: '1964-06-09'
      thread: program
      c: Cambridge. Mrs. Johnson, with Mrs. Peabody and Mrs. John Collins, walks the site on the Charles River given by Harvard
        for the Kennedy Library; flies back to Washington.
      n: '[[w.johnson-white-house-diary]], 160 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-06-09.europe-and-the-alliance
      when: June 9
      date: '1964-06-09'
      thread: europe-and-the-alliance
      c: 'The White House, State dinner-dance for Prime Minister Jens Otto Krag of Denmark and Mrs. Krag, Peter Duchin''s
        music. Gifts: for the Krags'' estate a barbecue wagon and a turquoise-and-silver Hopi necklace; Lynda Bird gives the
        children a talking doll and a hobby horse. Luci Johnson''s first State dinner.'
      n: '[[w.johnson-white-house-diary]], 160–62 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-06-10.program
      when: June 10
      date: '1964-06-10'
      thread: program
      c: 'The East Room, 5:30 p.m. Johnson presents the Presidential Scholars'' medals to 121 students, two from each State
        and others, chosen by a commission headed by Milton Eisenhower, with Fulbright among its members; they had been briefed
        by Rusk, shown the Capitol, lunched with their Congressmen, briefed by Alan Shepard at NASA and met Warren at the
        Supreme Court. Johnson: "You are younger than most of the earth''s quarrels, and you are older than most of the earth''s
        governments." His delivery below par; Southeast Asia has kept him at his desk.'
      n: '[[w.johnson-white-house-diary]], 162–64 (Lady Bird Johnson''s account). Names: Johnson, Milton Eisenhower, Fulbright,
        Rusk, Shepard, Warren.'
      tags:
      - name:johnson-lyndon-b
      - name:eisenhower-milton-s
      - name:fulbright-j-william
      - name:rusk-dean
      - name:shepard-alan-b-jr
      - name:warren-earl
- add:
    entry:
      id: cal.1964-06-10.program-2
      when: June 10
      date: '1964-06-10'
      thread: program
      c: The White House. The Presidential Scholars' reception with invited artists and scientists, among them Balanchine,
        Herblock, Helen Hayes, de Kooning, Harper Lee, Lippmann, Oppenheimer, Seaborg, Shepard, Ben Shahn and John Walker;
        entertainment on the lawn, Poitier, the Gerry Mulligan Quartet, Jose Ferrer, Bernstein, the Kingston Trio. Lynda Bird
        host to the students.
      n: '[[w.johnson-white-house-diary]], 164–65 (Lady Bird Johnson''s account; guests as she recognized them). Names: Lippmann,
        Oppenheimer, Seaborg, Shepard, Lady Bird Johnson.'
      tags:
      - name:lippmann-walter
      - name:oppenheimer-j-robert
      - name:seaborg-glenn-t
      - name:shepard-alan-b-jr
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-06-10.robert-kennedy
      when: June 10
      date: '1964-06-10'
      thread: robert-kennedy
      c: The South Lawn. Johnson, who has been in the West Wing in a Southeast Asia briefing with Cabinet members, goes out
        to mingle with the Presidential Scholars, goes back in and brings out Robert Kennedy to meet the young people.
      n: '[[w.johnson-white-house-diary]], 164–65 (Lady Bird Johnson''s account, from the newspapers). Names: Johnson, Robert
        Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-06-11.program
      when: June 11
      date: '1964-06-11'
      thread: program
      c: Philadelphia. Mrs. Johnson at the Golden Slipper Dinner, for the Golden Slipper's summer camp for underprivileged
        children; a three-hour drive back to Washington.
      n: '[[w.johnson-white-house-diary]], 165 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-06-11.elections-1964-johnson
      when: June 11
      date: '1964-06-11'
      thread: elections-1964-johnson
      c: 'Johnson, by Mrs. Johnson''s account, wants out: "He wants me to help him get out but I think I can only say: ''Stay
        on for now.''" She thinks the signing of the civil rights bill a high point for an announcement, but fears "a wave
        of disillusion, resentment, even bitterness" and that no Democrat is ready to step into his shoes.'
      n: '[[w.johnson-white-house-diary]], 165–66 (Lady Bird Johnson''s account, her thoughts on the drive home from Philadelphia).
        See [[cal.1964-05-14.elections-1964]]. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
    id: cal.1964-06-10.civil-rights-bill
    item: '[[w.johnson-white-house-diary]], 165–66 (June 11: "Yesterday the Senate had cleared the way for a vote on the Civil
      Rights Bill, by invoking cloture, with about four votes to spare"; not the count, Byrd or Dirksen)'
    units: '?'
- add:
    entry:
      id: cal.1964-06-14.succession
      when: June 14
      date: '1964-06-14'
      thread: transportation
      c: Johnson and Mrs. Johnson to the National City Christian Church with Secretary Hodges, Mrs. Hodges and the Udalls;
        lunch with them, on the Interstate highways, 90 percent federal, and Hodges's ruling that routes across parks and
        shrines are decided case by case; Udall for preserving the wilderness.
      n: '[[w.johnson-white-house-diary]], 166 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Hodges,
        Udall.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:hodges-luther-h
      - name:udall-stewart-l
      also:
      - conservation
- add:
    entry:
      id: cal.1964-06-14.elections-1964-johnson
      when: June 14
      date: '1964-06-14'
      thread: elections-1964-johnson
      c: 'Afternoon. Another talk with Mrs. Johnson: Johnson faces the next five months wishing "there were some honorable
        way out of it," by her account; Vietnam, Laos and Cyprus, and the turmoil if the civil rights bill passes, worse if
        it fails. She: "caught on this pinpoint in history, what exit is there?"'
      n: '[[w.johnson-white-house-diary]], 166–67 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-06-14.vietnam
      when: June 14
      date: '1964-06-14'
      thread: vietnam
      c: About 8:30 p.m. Johnson telephones Rusk at his office; Rusk brings a wire from Lodge, who wants to resign as Ambassador
        to Vietnam and come home. Johnson has already asked Bundy, McNamara and Rusk whom they would recommend should Lodge
        resign; the men they suggest, their willingness to go "in most instances" checked.
      n: '[[w.johnson-white-house-diary]], 167 (Lady Bird Johnson''s account). See [[cal.1964-06-06.vietnam]]. Names: Johnson,
        Rusk, Lodge, Bundy, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:lodge-henry-cabot
      - name:bundy-mcgeorge
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-06-15.succession
      when: June 15
      date: '1964-06-15'
      thread: assassination
      c: The White House. Mrs. Johnson is interviewed for two hours by William Manchester, whom Mrs. Kennedy has chosen to
        write a book on the assassination; Manchester is interviewing everyone present in the five days.
      n: '[[w.johnson-white-house-diary]], 167 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Manchester, Jacqueline
        Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:manchester-william
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1964-06-15.elections-1964-johnson
      when: June 15
      date: '1964-06-15'
      thread: elections-1964
      c: 'The White House, dinner with Joseph Alsop and Mrs. Alsop and Clifford and Mrs. Clifford. Wagers on the Republican
        nomination: Alsop five to two and Clifford four to one for Goldwater; one thinks Scranton is thinking of the future,
        to pick up the pieces. Alsop on the Turks and Greeks, with Inonu and Papandreou to come in a week. After they leave,
        Johnson says Alsop told him, "in effect": "if you don''t commit troops you''re going to preside over the first real
        defeat of the United States in history."'
      n: '[[w.johnson-white-house-diary]], 167–68 (Lady Bird Johnson''s account). Names: Johnson, Alsop, Clifford, Goldwater,
        Scranton, Inonu, George Papandreou.'
      tags:
      - name:johnson-lyndon-b
      - name:alsop-joseph
      - name:clifford-clark
      - name:goldwater-barry-m
      - name:scranton-william-w
      - name:inonu-ismet
      - name:papandreou-george
      also:
      - cyprus
      - vietnam
- add:
    entry:
      id: cal.1964-06-16.cities-and-housing
      when: June 16
      date: '1964-06-16'
      thread: cities-and-housing
      c: The White House, Mrs. Johnson's Women Do-ers luncheon, with Jane Jacobs, author of *The Death and Life of Great American
        Cities*, as speaker; Mary Roebling the banker, Mrs. Clark Kerr and Marie Turner of Breathitt County among the guests.
        Jacobs on park upkeep and the mortgage blackout in changing neighborhoods. Johnson greets them after lunch.
      n: '[[w.johnson-white-house-diary]], 169–70 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jane Jacobs, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:jacobs-jane
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-06-16.robert-kennedy
      when: June 16
      date: '1964-06-16'
      thread: robert-kennedy
      c: 'New York, the St. Regis. Dinner for 300 given by Stephen Smith and the trustees of the Kennedy Library in honor
        of Mrs. Kennedy, her first public social appearance since the assassination; Johnson and Mrs. Johnson, with Warren,
        Goldberg, the Freemans, the McNamaras, the Celebrezzes and Edward Kennedy, fly from Washington. Mrs. Johnson sits
        between Robert Kennedy and Stephen Smith; Johnson at Mrs. Kennedy''s table. Robert Kennedy: the guests all gave $10,000
        or more; the $10 million expected by September. Fredric March reads poems Mrs. Kennedy chose.'
      n: '[[w.johnson-white-house-diary]], 170–71 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Jacqueline
        Kennedy, Stephen Smith, Warren, Goldberg, Freeman, McNamara, Celebrezze, Ted Kennedy, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
      - name:smith-stephen-e
      - name:warren-earl
      - name:goldberg-arthur-j
      - name:freeman-orville-l
      - name:mcnamara-robert-s
      - name:celebrezze-anthony-j
      - name:kennedy-edward-m
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-06-16.defense
      when: June 16
      date: '1964-06-16'
      thread: defense
      also:
      - congress
      c: 'On the plane to New York, with Johnson, Warren, Goldberg, McNamara and others: Edward Kennedy argues the cause of
        naval bases for Boston, more closed in Massachusetts than in Texas.'
      n: '[[w.johnson-white-house-diary]], 170–71 (Lady Bird Johnson''s account). Names: Ted Kennedy, Johnson, Warren, Goldberg,
        McNamara.'
      tags:
      - name:kennedy-edward-m
      - name:johnson-lyndon-b
      - name:warren-earl
      - name:goldberg-arthur-j
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-06-16.civil-rights-the-executive
      when: June 16
      date: '1964-06-16'
      thread: civil-rights-the-executive
      c: 'New York, the car in from the St. Regis, Johnson and Mrs. Johnson with Warren and Robert Kennedy. Johnson and Kennedy,
        in earnest, on the first acts after the civil rights bill passes: a meeting of the Governors of the nineteen States
        without public accommodations laws, not only Southern ones, to work out a peaceful transition; and a mediator, Johnson
        wanting a Southerner, for the complaints.'
      n: '[[w.johnson-white-house-diary]], 171–72 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Warren,
        Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:warren-earl
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-06-20.congress
      when: June 20
      date: '1964-06-20'
      thread: congress
      c: Mrs. Johnson telephones Rose Kennedy and the Northampton hospital about Edward Kennedy's plane crash; Dr. Corriden
        reports on Bayh and his wife, who escaped with minor injuries; Joan Kennedy says Kennedy can use his arms and legs
        but the broken back's condition is unknown. His executive assistant and the pilot died.
      n: '[[w.johnson-white-house-diary]], 172 (Lady Bird Johnson''s account). See [[cal.1964-06-19.congress]]. Names: Lady
        Bird Johnson, Ted Kennedy, Bayh.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-edward-m
      - name:bayh-birch
- add:
    entry:
      id: cal.1964-06-20.civil-rights-bill
      when: June 20
      date: '1964-06-20'
      thread: civil-rights-bill
      c: Boggs, who comes over to see Mrs. Johnson, says the House has set July 4 as the day for passing the civil rights
        bill and, barring accident, will meet it.
      n: '[[w.johnson-white-house-diary]], 173 (Lady Bird Johnson''s account). Names: Boggs, Lady Bird Johnson.'
      tags:
      - name:boggs-hale
      - name:johnson-lady-bird
- cite:
    id: cal.1964-07-02.civil-rights-bill
    item: '[[w.johnson-white-house-diary]], 173–74 (the news of the House vote, 289 to 126, mid-afternoon; the signing in
      the East Room at 6:30 with television, the congressional leaders behind Johnson, Mansfield, Dirksen, Boggs and Robert
      Kennedy there; Humphrey asks for the copy of the statement and it has vanished; Mrs. Johnson to the newswomen on 1957
      and the thirty-seven nights; not the words)'
    units: A
- add:
    entry:
      id: cal.1964-07-02.succession
      when: July 2
      date: '1964-07-02'
      thread: program
      c: 'Johnson telephones Mrs. Johnson, as though the thought had just come to him: "We might just get off to Texas tonight."
        At 10:30 p.m. they leave the South Lawn by helicopter with Moyers; Jetstar from Andrews to the Ranch, midnight Texas
        time.'
      n: '[[w.johnson-white-house-diary]], 174–75 (Lady Bird Johnson''s account). See [[cal.1964-07-02.civil-rights-bill]].
        Names: Johnson, Lady Bird Johnson, Moyers.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:moyers-bill
- add:
    entry:
      id: cal.1964-07-06.elections-1964-johnson
      when: July 6
      date: '1964-07-06'
      thread: elections-1964-johnson
      c: 'Scharnhorst Ranch. Johnson with Mrs. Johnson, Jesse Kellam and A. W. Moursund on whether he will run: "Lyndon wants
        to get out. But there *is* no way out now." Ed Weisl to Mrs. Johnson: "Bird, I don''t know any honorable way for him
        *not* to run." Moursund: "you are the only man that can make up your mind." Kellam: run, and announce right away after
        election that he will hold the job four years and not seek reelection.'
      n: '[[w.johnson-white-house-diary]], 175 (Lady Bird Johnson''s account; Weisl spoke looking at her). Names: Johnson,
        Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-07-11.elections-1964-johnson-2
      when: July 11
      date: '1964-07-11'
      thread: elections-1964-johnson
      c: 'The White House, the weekend. Johnson "is going through the throes of what may be the last desperate turning away,
        the desire to escape being the Democratic candidate this fall"; Mrs. Johnson: "he can''t find any honorable escape."'
      n: '[[w.johnson-white-house-diary]], 176 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-07-13.elections-1964-johnson
      when: July 13
      date: '1964-07-13'
      thread: elections-1964-johnson
      c: 'The White House, Johnson''s small room, until nearly 11 p.m. Johnson meeting with O''Donnell, Valenti, Maguire,
        "Cliff," Jenkins, "at least eight of the chief political cogs in the machine" by Mrs. Johnson''s count. He comes home
        with Jenkins and Maguire: "We are on the move."'
      n: '[[w.johnson-white-house-diary]], 177 (Lady Bird Johnson''s account). Check: who "Cliff" is (Cliff Carter?). Names:
        Johnson, Lady Bird Johnson, O''Donnell, Valenti, Walter Jenkins.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:odonnell-kenneth-p
      - name:valenti-jack
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1964-07-15.elections-1964-johnson
      when: July 15–16
      date: '1964-07-15'
      thread: elections-1964-johnson
      c: 'The White House, the night after watching the Republican convention, about 3:30 or 4 a.m. Johnson wakes and goes
        over with Mrs. Johnson, in detail, the pros and cons of every decision before him in the campaign: "every sensitive
        job to be filled, every spot on the battlefield that needs to be manned."'
      n: '[[w.johnson-white-house-diary]], 178 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-07-16.elections-1964-johnson
      when: July 16
      date: '1964-07-16'
      thread: elections-1964-johnson
      c: The White House, 9 a.m. Galbraith to breakfast with Johnson and Mrs. Johnson, two hours. He says he is first a friend
        of the Kennedy family but understands Johnson; friendly toward Humphrey. Johnson asks him to help with any Congressmen
        he can to pass the poverty bill; Galbraith willing, Mrs. Johnson believes, to write campaign material and speeches.
      n: '[[w.johnson-white-house-diary]], 178 (Lady Bird Johnson''s account). Names: Galbraith, Johnson, Lady Bird Johnson,
        Humphrey.'
      tags:
      - name:galbraith-john-kenneth
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1964-07-16.program
      when: July 16
      date: '1964-07-16'
      thread: program
      c: The Yellow Room, late afternoon. Representative James Roosevelt and his daughter Anna with Mrs. Johnson. Roosevelt
        says he will go before the Commission to prevent acceptance of the proposed Franklin Roosevelt memorial, the "Instant
        Stonehenge" of pillars, which none of the four sons likes; Mrs. Johnson dislikes it too.
      n: '[[w.johnson-white-house-diary]], 179–80 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, James Roosevelt.'
      tags:
      - name:johnson-lady-bird
      - name:roosevelt-james
- add:
    entry:
      id: cal.1964-07-17.white-house
      when: July 17
      date: '1964-07-17'
      thread: white-house
      c: The White House. Mrs. Johnson presents the one millionth copy of the White House guidebook to a tourist family at
        the entrance desk, before cameras and reporters; photographs in the Rose Garden.
      n: '[[w.johnson-white-house-diary]], 180 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-07-17.program
      when: July 17
      date: '1964-07-17'
      thread: program
      c: 'Independence, Mo. Mrs. Johnson and Lynda Bird, on a trip promised her by Truman on the flight to Athens, are taken
        through the Truman Library by Truman, with Mrs. Truman: original documents of each President, the State Dining Room
        mantel with John Adams''s inscription, the Benton mural, a replica of the Oval Office. Truman talks with school children
        there for several hours a day, three or four days a week in summer. Mrs. Johnson gives him a flag from Blair House.
        They have a soft drink at the Trumans'' house.'
      n: '[[w.johnson-white-house-diary]], 180–82 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Lynda
        Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:johnson-lynda-bird
- add:
    entry:
      id: cal.1964-07-17.elections-1964-johnson
      when: July 17
      date: '1964-07-17'
      thread: elections-1964-johnson
      c: Kansas City, the Muehlebach Hotel, about 6:30 p.m. Truman and Mrs. Truman have drinks with Mrs. Johnson and Lynda
        Bird; Truman plays Chopin; he "reiterated that he wanted to do whatever he could to help Lyndon."
      n: '[[w.johnson-white-house-diary]], 182–83 (Lady Bird Johnson''s account). Names: Truman, Lady Bird Johnson, Lynda
        Bird Johnson.'
      tags:
      - name:truman-harry-s
      - name:johnson-lady-bird
      - name:johnson-lynda-bird
- cite:
    id: cal.1964-07-24.elections-1964
    item: '[[w.johnson-white-house-diary]], 183–84 (the afternoon: Johnson''s televised press conference at 3:30, which Mrs.
      Johnson watched from her room; Bryson Rash on his having "mouse-trapped" Goldwater by saying, "Of course we will talk
      about Civil Rights"; "All campaigns are rough"; Johnson to leave early for his 5:30 appointment with Goldwater; not
      the meeting itself or the words of B)'
    units: '?'
- add:
    entry:
      id: cal.1964-07-24.labor
      when: July 24
      date: '1964-07-24'
      thread: labor
      c: The Mansion, after the press conference. Johnson's reception for 250 to 300 labor leaders, invited for a report on
        the State of the Nation, like his stag luncheons for business leaders. Late from the press conference and gone early
        for the 5:30 appointment with Goldwater, he is in the receiving line less than an hour.
      n: '[[w.johnson-white-house-diary]], 183–84 (Lady Bird Johnson''s account, from an aide). Names: Johnson, Goldwater.'
      tags:
      - name:johnson-lyndon-b
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-07-24.elections-1964-vice-presidency
      when: July 24
      date: '1964-07-24'
      thread: elections-1964-vice-presidency
      c: The White House, the little room at Johnson's office, evening. Johnson with staff discussing Vice Presidential nominees,
        Rusk, McNamara, Kennedy, McCarthy, Humphrey and Muskie, "the favorite guessing game of the Capitol." Mrs. Johnson
        takes him home to dinner at 10.
      n: '[[w.johnson-white-house-diary]], 184 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Rusk, McNamara,
        Robert Kennedy, Eugene McCarthy, Humphrey, Muskie.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - name:muskie-edmund-s
- cite:
    id: cal.1964-07-26.vietnam-congress
    item: '[[w.johnson-white-house-diary]], 185–86 (the evening dinner at the Fulbrights'', the Johnsons with the Restons,
      the Dillons and Russell; Reston, back from the Republican convention: "Just one thing. Work like Hell"; Mrs. Johnson
      with Fulbright on his *Old Myths and New Realities*, De Gaulle, China, consular and student exchanges with the Iron
      Curtain countries; no talk of Vietnam reported)'
    units: A
- add:
    entry:
      id: cal.1964-07-26.elections-1964-vice-presidency
      when: July 26
      date: '1964-07-26'
      thread: elections-1964-vice-presidency
      c: 'Afternoon. Eugene McCarthy on television, the Johnsons watching. Mrs. Johnson: "Handsome, humorous, but a little
        too verbose."'
      n: '[[w.johnson-white-house-diary]], 185 (Lady Bird Johnson''s account). Check: the program. Names: Eugene McCarthy,
        Johnson, Lady Bird Johnson.'
      tags:
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-07-26.elections-1964-3
      when: July 26
      date: '1964-07-26'
      thread: program
      c: Johnson and Mrs. Johnson walk the grounds after church; at the gates Johnson invites about a hundred tourists at
        each to walk around the block with him.
      n: '[[w.johnson-white-house-diary]], 185 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-08-01.succession
      when: Aug. 1
      date: '1964-08-01'
      thread: congress
      c: Fort Myer Chapel. Memorial service for Senator Clair Engle, the Senate Chaplain officiating; Johnson and Mrs. Johnson
        in the front row. Mrs. Johnson speaks to Mrs. Engle, who has lived "a tortured year," part of it the pressure from
        California leaders that the Senator get out of the race.
      n: '[[w.johnson-white-house-diary]], 186 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Clair Engle.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:engle-clair
- cite:
    id: cal.1964-08.elections-1964-4
    item: '[[w.johnson-white-house-diary]], 186–87 (Saturday, Aug. 1: dinner for Wagner on the Truman Balcony with Celebrezze
      and Wirtz and their wives; King "the only leader the Negro people will listen to," with "an emotional hold over them";
      Harlem''s unemployment, 1,300 jobs promised youth, a million dollars for rat eradication, public housing deteriorating;
      a review board would make police morale "drop to zero overnight"; not that King was brought in)'
    units: B
- cite:
    id: cal.1964-08-04.vietnam-congress-2
    item: '[[w.johnson-white-house-diary]], 187–88 (Tuesday evening, cars through the Southwest Gate; Johnson an hour and
      a half with congressional leaders, the Cabinet and the Joint Chiefs; not the hour or the speakers)'
    units: '?'
- add:
    entry:
      id: cal.1964-08-04.vietnam-tonkin-9
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-tonkin
      c: The White House, the regular Tuesday lunch of Johnson with the Secretary of Defense, the Secretary of State and McGeorge
        Bundy, which runs long. Bundy in the hall afterward "extraordinarily grave"; to Mrs. Johnson a "portentous answer."
      n: '[[w.johnson-white-house-diary]], 187–88 (Lady Bird Johnson''s account; she does not give what Bundy said). Names:
        Johnson, McNamara, Rusk, Bundy, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-08-04.vietnam-tonkin-10
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-tonkin
      c: Evening. Johnson delays his statement on the second attack in the Gulf of Tonkin, first talked of for 7, then 8,
        wanting accurate information on where his planes are before word goes out; at 10:40 Mrs. Johnson brings him, Bundy
        and Valenti over to dinner, Reedy dropping in for dessert.
      n: '[[w.johnson-white-house-diary]], 188 (Lady Bird Johnson''s account). Names: Johnson, Bundy, Valenti, Reedy, Lady
        Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - name:valenti-jack
      - name:reedy-george-e
      - name:johnson-lady-bird
- cite:
    id: cal.1964-08-04.vietnam
    item: '[[w.johnson-white-house-diary]], 187–89 (word that two destroyers were attacked by North Vietnamese PT boats, one
      on Sunday unanswered; Johnson ordered air action against the gunboats and their bases; after 11 p.m. on the air: "limited
      and fitting," "We still seek no wider war," Stevenson to the Security Council, a resolution asked of Congress; not the
      hour, the ships'' names or the NSC)'
    units: E, G
- add:
    entry:
      id: cal.1964-08-06.civil-disorders
      when: Aug. 6
      date: '1964-08-06'
      thread: civil-disorders
      c: 'The White House bedroom, morning. Mayor Daley of Chicago with Johnson in bed and Mrs. Johnson, over coffee, on how
        he would meet a race riot in Chicago: no steel helmets, caps only, so that each policeman looks "like the friend down
        the block"; year-round meetings with the press, television, Negro leaders, white businessmen and churches. Mrs. Johnson
        on television and newspapers egging on trouble.'
      n: '[[w.johnson-white-house-diary]], 189 (Lady Bird Johnson''s account). Names: Daley, Johnson, Lady Bird Johnson.'
      tags:
      - name:daley-richard-j
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
    id: cal.1964-08-06.vietnam-2
    item: '[[w.johnson-white-house-diary]], 189–91 (the welcome a little past 11 in the Rose Garden, without military pomp;
      U Thant an hour in conference with Johnson; then a tour of the flower gardens with Mrs. Johnson, Johnson and Stevenson
      following; the State dinner, the gifts, Ranger VII photographs and an 1829 letter of Andrew Jackson, and a Burmese silver
      service; Johnson presents Fulbright, Dirksen, Stevenson and Lodge before his toast; not the twenty minutes alone, the
      others present or the toast''s words)'
    units: '?'
- add:
    entry:
      id: cal.1964-08-06.vietnam-4
      when: Aug. 6
      date: '1964-08-06'
      thread: vietnam
      c: After the State dinner for U Thant. Johnson leaves at the earliest respectable hour after his guest of honor to talk
        over "the latest developments" with Rusk and Bundy.
      n: '[[w.johnson-white-house-diary]], 191 (Lady Bird Johnson''s account). See [[cal.1964-08-06.vietnam-2]]. Names: Johnson,
        Rusk, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-08-06.governors
      when: Aug. 6
      date: '1964-08-06'
      thread: governors
      c: Governor and Mrs. Pat Brown of California, the John Daltons of Missouri and the Matthew Welshes of Indiana arrive
        as the Johnsons' houseguests.
      n: '[[w.johnson-white-house-diary]], 190 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Brown, Dalton, Welsh.'
      tags:
      - name:johnson-lady-bird
      - name:brown-edmund-g
      - name:dalton-john-m
      - name:welsh-matthew-e
- add:
    entry:
      id: cal.1964-08-25.transition-and-staff-nsc
      when: Aug. 25
      date: '1964-08-25'
      thread: transition-and-staff-nsc
      c: The White House, about 1 p.m. Johnson lunches with Rusk, McNamara and Bundy.
      n: '[[w.johnson-white-house-diary]], 192 (Lady Bird Johnson''s account; the subject not given). Names: Johnson, Rusk,
        McNamara, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-08-25.elections-1964-johnson
      when: Aug. 25
      date: '1964-08-25'
      thread: elections-1964-johnson
      c: 'The White House, the afternoon. Johnson alone in his room with the shades drawn, not sleeping, making many telephone
        calls; to Mrs. Johnson "the same old refrain": he does not believe he should accept the nomination; he does not want
        to go to Atlantic City.'
      n: '[[w.johnson-white-house-diary]], 192 (Lady Bird Johnson''s account). See [[cal.1964-08-25.elections-1964-2]]. Names:
        Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
    id: cal.1964-08-25.elections-1964-2
    item: '[[w.johnson-white-house-diary]], 192 (her letter of that afternoon, "Personal," in full: "You are as brave a man
      as Harry Truman—or FDR—or Lincoln ... To step out now would be wrong for your country, and I can see nothing but a lonely
      wasteland for your future ... I know it''s only *your* choice"; signed "Bird"; after a talk with Lynda Bird on the South
      grounds; the answer, she writes, his acceptance on the night of Aug. 27; not the statement or its readers)'
    units: C-D
- cite:
    id: cal.1964-08-27.elections-1964-2
    item: '[[w.johnson-white-house-diary]], 192 (Johnson accepts the nomination before the convention on the night of Aug.
      27, "the answer to my letter"; not the words)'
    units: '?'
- add:
    entry:
      id: cal.1964-09-04.elections-1964-vice-presidency
      when: Sept. 4
      date: '1964-09-04'
      thread: elections-1964-vice-presidency
      c: The White House. Abigail McCarthy, wife of Senator Eugene McCarthy, comes for coffee with Mrs. Johnson to say that
        Johnson's choice of Humphrey for Vice President makes no difference to their friendship, or to hers with the Humphreys;
        Mrs. Johnson notes a week of strain among their friends and promoters, and means to remind both McCarthys how much
        they are valued.
      n: '[[w.johnson-white-house-diary]], 193–94 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Eugene McCarthy,
        Humphrey, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-09-04.elections-1964-johnson
      when: Sept. 4
      date: '1964-09-04'
      thread: elections-1964-johnson
      c: The White House, 11:30 a.m., three hours. Mrs. Johnson with Carpenter, Bess Abell, Scooter Miller, Woodward, Joe
        Moran of the advance men, White House transportation men and Dewey Long, who arranged Truman's 1948 whistle-stop,
        plan her whistle-stop train trip. They cut a ten-day, fourteen-State plan to four days; end it in New Orleans, not
        Tallahassee, at Bill Brawley's urging as head of the Democratic National Committee's Southern campaign; more stops
        in North Carolina and Virginia, and Georgia.
      n: '[[w.johnson-white-house-diary]], 194 (Lady Bird Johnson''s account). See [[cal.1964-09.elections-1964-5]]. Names:
        Lady Bird Johnson, Carpenter, Truman.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
      - name:truman-harry-s
- cite:
    id: cal.1964-09.elections-1964-5
    item: '[[w.johnson-white-house-diary]], 195–98 (Friday, Sept. 11: her telephone calls to the Governors and Senators of
      the States on the train''s route; Byrd, "an invisible silken curtain fell across his voice," no public affairs since
      Mrs. Byrd''s death; Thurmond, "a really basic decision within the next two weeks"; Russell, no, but glad to lend one
      or two advance men from his staff; the acceptances and refusals of Harrison, Sanford, Ervin, Jordan, Olin Johnston,
      Donald Russell, Talmadge, Sanders, Holland, Smathers, Bryant, Hill, Sparkman, Ellender, Robertson, Stennis, McKeithen;
      the Moores, Burns and Eastland not reached)'
    units: A, B, D
- add:
    entry:
      id: cal.1964-09-11.elections-1964-johnson
      when: Sept. 11
      date: '1964-09-11'
      thread: elections-1964-johnson
      c: The Yellow Oval Room, afternoon. Mrs. Johnson has the Cabinet wives to tea, Mrs. Rusk, Mrs. McNamara, Mrs. Gronouski,
        Mrs. Udall, Mrs. Freeman, Mrs. Wirtz, Mrs. Celebrezze and Mrs. Katzenbach, with Muriel Humphrey's press secretary
        and Margaret Price, Carrie Davis and Scooter Miller of the Democratic National Committee, on what the wives can do
        in the seven weeks of the campaign and who shall fill the invitations she must refuse. Freeman and Celebrezze the
        most active.
      n: '[[w.johnson-white-house-diary]], 197–98 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- cite:
    id: cal.1964-10-06.elections-1964
    item: '[[w.johnson-white-house-diary]], 194, 198–99 (written later: "forty-seven stops in four days"; a woman at a North
      Carolina stop, "was it Ahoskie?", milked twenty cows to be at the train; she kept no diary of the campaign; planned
      Sept. 4 to begin in Washington and end in New Orleans, 194; the plate after 182: "''Lady Bird Special'' in Virginia
      during the Whistlestop campaign through the South, October 6-9"; not Alexandria, the days'' stops or Johnson at New
      Orleans)'
    units: A
- add:
    entry:
      id: cal.1964-11-14.poverty
      when: Nov. 14
      date: '1964-11-14'
      thread: transition-and-staff-cabinet
      c: 'The LBJ Ranch, the morning. Celebrezze confers with Johnson, with Wirtz the fifth and sixth Cabinet members there
        in the eleven days since the campaign. To Mrs. Johnson: hurt by columns saying he is leaving the Cabinet; he wants
        a judgeship when one opens; his department''s budget to rise next year, with Johnson''s blessing, for the new education
        aid.'
      n: '[[w.johnson-white-house-diary]], 199–200 (Lady Bird Johnson''s account). Names: Celebrezze, Johnson, Lady Bird Johnson.'
      tags:
      - name:celebrezze-anthony-j
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-11-14.jobs-and-wages
      when: Nov. 14
      date: '1964-11-14'
      thread: jobs-and-wages
      also:
      - poverty
      c: 'The LBJ Ranch, the morning. Wirtz confers with Johnson. To Mrs. Johnson: 3.5 million turning eighteen next year,
        a million more than this; one in seven to find "a door slammed in his face—a job door or a college door"; 200,000
        without a college place, 300,000 without jobs for want of training. His program: "Operation Birthright."'
      n: '[[w.johnson-white-house-diary]], 199–200 (Lady Bird Johnson''s account). See [[cal.1964-11-14.poverty]]. Names:
        Wirtz, Johnson, Lady Bird Johnson.'
      tags:
      - name:wirtz-w-willard
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-11-14.transition-and-staff-cabinet
      when: Nov. 14–15
      date: '1964-11-14'
      thread: transition-and-staff-cabinet
      c: The LBJ Ranch, Weisl, Frank Stanton of C.B.S., Donald Cook of American Electric Power Service and Thomas Watson of
        I.B.M. with Johnson for the weekend. Johnson is asking Watson to be Secretary of Commerce in Hodges's place, hopes
        Cook will accept a place in the Cabinet, would love to have Stanton in it. Later he tells Mrs. Johnson his bet is
        that none of the three will accept.
      n: '[[w.johnson-white-house-diary]], 200–02 (Lady Bird Johnson''s account; she does not say what any of them answered).
        Names: Johnson, Lady Bird Johnson, Stanton, Don Cook, Hodges.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:stanton-frank
      - name:cook-donald-c
      - name:hodges-luther-h
- add:
    entry:
      id: cal.1964-11-15.transition-and-staff-cabinet
      when: Nov. 15
      date: '1964-11-15'
      thread: transition-and-staff-cabinet
      c: 'The Ranch airstrip, about 2 p.m. Mrs. Johnson to Cook, leaving: she hopes he will take the Cabinet post. Cook: "This
        is the capstone of his career" (Johnson''s); she: "we can''t make the four years really first-class, unless we''ve
        got some good troops"; Cook: "We''ll find them. We''ll have to find a way."'
      n: '[[w.johnson-white-house-diary]], 202 (Lady Bird Johnson''s account). See [[cal.1964-11-14.transition-and-staff-cabinet]].
        Names: Lady Bird Johnson, Don Cook, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:cook-donald-c
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-11-15.succession
      when: Nov. 15
      date: '1964-11-15'
      thread: program
      c: 'The White House lawn, 6:30 p.m. Johnson and Mrs. Johnson return from Texas, their first since the election, met
        by the Cabinet and their wives with Rusk at the foot of the steps, and 200 or 300 of the staff and families: "Congratulations!
        Welcome home!"'
      n: '[[w.johnson-white-house-diary]], 202–03 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-11-15.transition-and-staff
      when: Nov. 15
      date: '1964-11-15'
      thread: transition-and-staff
      c: 'The State Department, evening. Party for Walter Heller, who leaves the Council of Economic Advisers for the University
        of Minnesota, given by the Cabinet and top officials. Heller: "We have had two perceptive and restless Presidents,
        who realize the economy''s potential"; "I have Potomac Fever."'
      n: '[[w.johnson-white-house-diary]], 203 (Lady Bird Johnson''s account). Names: Heller, Johnson, Lady Bird Johnson.'
      tags:
      - name:heller-walter-w
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-11-15.transition-and-staff-2
      when: Nov. 15
      date: '1964-11-15'
      thread: transition-and-staff
      c: Later that evening Johnson meets some of the staff on a talent search for the best people for the next four years.
      n: '[[w.johnson-white-house-diary]], 203 (Lady Bird Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-11-17.transition-and-staff
      when: Nov. 17
      date: '1964-11-17'
      thread: elections-1964-jenkins
      c: 'Mrs. Johnson calls on Walter Jenkins and Mrs. Jenkins, who are going home to Texas: to her, Jenkins "as much a casualty
        of the incredible hours and burdens he has carried in government service as a soldier in action"; a barrage of mail
        from the public; friends offering jobs.'
      n: '[[w.johnson-white-house-diary]], 204 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Walter Jenkins.'
      tags:
      - name:johnson-lady-bird
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1964-11-17.program
      when: Nov. 17
      date: '1964-11-17'
      thread: program
      c: The White House second floor. Mary Lasker with Mrs. Johnson on giving the Inaugural ceremonies more style and flair,
        perhaps a march or a symphony written for the occasion; she suggests an entertainment at the White House for the committee
        of the Kennedy Cultural Center.
      n: '[[w.johnson-white-house-diary]], 205 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-11-17.transition-and-staff-2
      when: Nov. 17
      date: '1964-11-17'
      thread: transition-and-staff
      c: The State Department, farewell reception for Ralph Dungan, leaving to be Ambassador to Chile. Johnson and Mrs. Johnson
        stay about thirty minutes, Johnson in no hurry to leave.
      n: '[[w.johnson-white-house-diary]], 205 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Dungan.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:dungan-ralph-a
- add:
    entry:
      id: cal.1964-11-17.white-house
      when: Nov. 17
      date: '1964-11-17'
      thread: program
      c: 'The White House, 9 p.m. Johnson''s surprise party for Mrs. Johnson''s thirtieth wedding anniversary: the Fortases,
        the Alsops, the Carpenters, Justice Tom Clark and Mrs. Clark, Corcoran, Katharine Graham, the Valentis, the Tyler
        Abells. Gifts; a thirty-pound wedding cake; toasts. Mrs. Johnson''s toast to "happiness" and "pedestrian courage."'
      n: '[[w.johnson-white-house-diary]], 205–07 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Fortas,
        Tom Clark, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:fortas-abe
      - name:clark-tom-c
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-11-21.farm
      when: Nov. 21
      date: '1964-11-21'
      thread: farm
      c: The LBJ Ranch. Richard Juhl and a party of eleven from Iowa, including the presidents of the National Swinegrowers'
        Association and the Iowa Farm Brokers' Association and two farm editors, drive 1,600 miles to present Johnson with
        a Yorkshire boar; photographs with Freeman, a house guest. Johnson takes them over the Ranch and keeps them to lunch.
      n: '[[w.johnson-white-house-diary]], 206–08 (Lady Bird Johnson''s account). Names: Johnson, Freeman, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:freeman-orville-l
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-11-21.farm-2
      when: Nov. 21
      date: '1964-11-21'
      thread: farm
      c: 'The Ranch, lunch. Freeman to Mrs. Johnson on why the Department of Agriculture grows while farm population falls
        to 8 percent: consumer inspection and grading, research, and forestry.'
      n: '[[w.johnson-white-house-diary]], 208–09 (Lady Bird Johnson''s account). Names: Freeman, Lady Bird Johnson.'
      tags:
      - name:freeman-orville-l
      - name:johnson-lady-bird
