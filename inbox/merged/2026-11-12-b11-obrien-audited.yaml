- add:
    entry:
      id: cal.1969-01.transition-and-staff-4
      when: Jan., one afternoon
      date: 1969-01
      thread: transition-and-staff
      c: 'The White House, 5 p.m., almost two hours: O''Brien''s farewell call on Johnson. Johnson asks who will succeed O''Brien as chairman of the Democratic National Committee; Fred Harris, O''Brien understands; Johnson noncommittal. Of his sons-in-law in Vietnam: "I''m not a President where those two boys are concerned," he says. "I''m just a worried father." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 266. Check: the day (the work says "one January afternoon" as the Nixon inauguration neared). Names: Johnson, O''Brien, Harris.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
      - name:harris-fred-r
- add:
    entry:
      id: cal.1969-01-19.elections-1968-humphrey
      when: Jan. 19
      date: '1969-01-19'
      thread: elections-1968-humphrey
      c: 'Washington, the evening before the Nixon Inauguration. Humphrey calls in the afternoon; he and Muriel come that evening. They go over the campaign, how close it was, the ifs: more money, a bombing halt sooner. Humphrey thanks O''Brien for his efforts. He goes back to Minnesota to teach and write, O''Brien to New York. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 266–67. Check: the day (the work says "the afternoon before the Inauguration"). Names: Humphrey, O''Brien, Nixon.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:nixon-richard-m
