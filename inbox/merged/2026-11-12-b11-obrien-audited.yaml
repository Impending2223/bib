    text: 'Check: the hour: [[w.obrien-no-final-victories]], 265, has Humphrey concede "in the early hours of Wednesday morning."'
- cite:
    id: cal.1968-08.elections-1968-humphrey-2
    units: '?'
    item: '[[w.obrien-no-final-victories]], 249 (Humphrey, back from a visit to Johnson at the Ranch "about a week" after his July lunch with O''Brien, tells him the President advised him of a major new development on Vietnam, a step to please the anti-war people, and that he should make no statement until the President''s announcement; the details withheld; not the softened plank, Paris or the month)'
