- cite:
    id: cal.1968-08-29.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 253–56 (Napolitan''s outline of organization, personnel, issues and media strategy, with no part for O''Brien; Humphrey asks him to stay through November, O''Brien refuses; late that evening a Secret Service agent calls him to the Vice President''s suite; "Dump the Hump" from the street; "Don''t leave me naked"; Napolitan''s note "Elva and I say do it. Joe"; O''Brien then explains his clients, the networks and Hughes, and Humphrey calls Maheu, Stanton and Bessie the next morning; not the day, or the plan cut from Freeman''s book)'
    units: D
- add:
    entry:
      id: cal.1968-08.elections-1968-humphrey-4
      when: Aug., end
      date: 1968-08
      thread: elections-1968-humphrey
      c: Humphrey, the morning after O'Brien agrees to stay on through November, telephones Robert Maheu of Hughes Enterprises, Frank Stanton, president of CBS, and Mike Bessie, O'Brien's publisher, to ask them to wait for O'Brien until after the election; all agree. Bessie will not believe it is Humphrey. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 256. Check: the day (the work: "the next morning," after the night in Humphrey''s suite in Chicago). See [[cal.1968-08-29.elections-1968-2]]. Names: Humphrey, Maheu, Stanton, O''Brien.'
      tags:
      - name:humphrey-hubert-h
      - name:maheu-robert-a
      - name:stanton-frank
      - name:obrien-lawrence-f
- cite:
    id: cal.1968-08-30.elections-1968-2
    units: '?'
    item: '[[w.obrien-no-final-victories]], 256–57 (the planning at Waverly, by O''Brien''s account: the Labor Day weekend, three days, in the Humphreys'' guest cottage; Humphrey and his staff, O''Brien, Napolitan and Kapenstein; no travel plans, no media program, no one in key posts, little money; the weekend spent telephoning to recruit staff; not the press conference or the others named)'
- cite:
    id: cal.1968-09-26.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 259 (September 27: O''Brien sees an advance copy of a Gallup poll, Nixon 43, Humphrey 28, Wallace 21; $100,000 gathered for half an hour of national television; Monday, Sept. 30, from Salt Lake City, the day chosen)'
    units: '?'
- check:
    id: cal.1968-09-26.elections-1968-2
    text: 'Check: the day: [[w.obrien-no-final-victories]], 259, has O''Brien see the advance copy of the Gallup poll on Sept. 27.'
- cite:
    id: cal.1968-09-28.elections-1968
    item: '[[w.obrien-no-final-victories]], 259 (Saturday morning in Washington, two days before the speech: O''Brien shown what he is told is the final draft of the Vietnam speech; telecopier message to Humphrey: a waste of $100,000; Humphrey that afternoon: "that wasn''t any final draft you saw. The speech isn''t even written yet. Why don''t you fly out here"; not the Watergate or "an abomination")'
    units: C
- cite:
    id: cal.1968-09-29.elections-1968-4
    item: '[[w.obrien-no-final-victories]], 260 (Sunday morning to Seattle, Humphrey''s hotel suite; Humphrey had read the draft and reacted much as O''Brien had; on to Salt Lake City that afternoon; the night''s discussion of the draft in Humphrey''s suite, a dozen present: Harris and O''Brien for a softer line, Rowe and Connell for the Johnson policy; Rowe: "You can''t expect to be elected President if you turn on the President you served under"; Humphrey: "Damn it, I''m on my own two feet ... This is my speech and I''ll write it myself"; he takes a pen; not Ball, Van Dyk or the 2 p.m. list)'
    units: '?'
- check:
    id: cal.1968-09-29.elections-1968-4
    text: 'Check: the hour: [[w.obrien-no-final-victories]], 260, has the drafting go on "until three or four in the morning, when I finally decided to leave."'
- cite:
    id: cal.1968-09-30.elections-1968-humphrey-7
    item: '[[w.obrien-no-final-victories]], 261 (after the speech Humphrey receives a telegram of congratulations from Ted Kennedy and shows it to O''Brien and the staff, beaming; the key passage on stopping the bombing; the page has a telegram, the entry a telephone call)'
    units: '?'
- check:
    id: cal.1968-09-30.elections-1968-humphrey-7
    text: 'Check: the means: [[w.obrien-no-final-victories]], 261, has Edward Kennedy send Humphrey a telegram of congratulations, not telephone.'
- cite:
    id: cal.1968-10-08.press-and-broadcasting
    item: '[[w.obrien-no-final-victories]], 263 (the campaign urges its allies on the Hill to pass a bill waiving the equal-time law so a Nixon–Humphrey debate could take place; the House passes it after McCormack locks the members in the chamber; Mansfield and Pastore decline in the Senate; not the resolution''s number or the dates)'
    units: '?'
- cite:
    id: cal.1968-11-03.elections-1968
    item: '[[w.obrien-no-final-victories]], 264 (the Astrodome in Houston, "a tremendous reception" for Humphrey that final weekend; not Johnson or the broadcast)'
    units: A
- cite:
    id: cal.1968-11-04.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 262–64 (Monday: Humphrey drives through the streets of Los Angeles "like a conquering hero"; the final night''s telethons, Muskie "virtually a co-performer with Hubert"; on Humphrey''s final election-eve program, the film of Edward Kennedy and O''Brien on the beach at the Cape; not the noon, ABC, the two broadcasts or the questions)'
    units: '?'
- add:
    entry:
      id: cal.1968-11-05.elections-1968-humphrey-4
      when: Nov. 5
      date: '1968-11-05'
      thread: elections-1968-humphrey
      c: 'Election night, Humphrey''s hotel suite in Minneapolis. The early returns show New Jersey lost; O''Brien telephones Governor Hughes in hope the report is wrong. Hughes calls back: it is accurate. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 264–65. Names: O''Brien, Hughes, Humphrey.'
      tags:
      - name:obrien-lawrence-f
      - name:hughes-richard-j
