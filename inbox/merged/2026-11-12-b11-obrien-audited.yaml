- cite:
    id: cal.1968-08-26.elections-1968-chicago
    units: '?'
    item: '[[w.obrien-no-final-victories]], 251–52 (O''Brien''s account, undated: Charles Murphy, the President''s spokesman, pronounces the Ginsburg–Sorensen draft unacceptable; Ginsburg and O''Brien urge Humphrey to call the President; Humphrey: "These are just words ... I don''t see that we''ve upset any applecarts"; O''Brien to Ginsburg: "This could blow the whole campaign"; Humphrey accepts the Johnson plank; not Watson, Rusk and Rostow, or the day)'
- variant:
    id: cal.1968-08-26.elections-1968-chicago
    unit: D
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: "Humphrey placed the call, but the President was unavailable. We waited for a while, but it became clear that the President was not going to return the call"'
    at: '252'
- cite:
    id: cal.1968-08-28.elections-1968
    item: '[[w.obrien-no-final-victories]], 252 (Humphrey accepts the Johnson Vietnam plank and the Convention endorses it, in O''Brien''s words "by a two-to-one margin"; not the plank''s words, the roll call or the day)'
    units: '?'
- check:
    id: cal.1968-08-28.elections-1968
    text: 'Check: the vote: [[w.obrien-no-final-victories]], 252, has the Convention endorse the Johnson plank "by a two-to-one margin"; 1,567¾ to 1,041¼ is about three to two.'
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-14
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      c: 'Chicago, Humphrey''s suite. Humphrey, Rowe, Connell and O''Brien in one bedroom, Muskie in another, Harris in the living room. Humphrey: "if you had fifteen seconds to decide, who would it be?" O''Brien: "Ed Muskie"; Rowe and Connell agree. Humphrey tells each himself. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 253. Check: the day (the work gives none). Names: Humphrey, Rowe, O''Brien, Muskie, Harris.'
      tags:
      - name:humphrey-hubert-h
