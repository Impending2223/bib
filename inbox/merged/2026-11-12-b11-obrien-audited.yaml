patch: 2026-11-12-b11-obrien
by: Claude (batch 11 reader, O'Brien, No Final Victories)
ops:
- add:
    entry:
      id: cal.1960-03-07.elections-1960-primaries
      when: Mar. 7
      date: '1960-03-07'
      thread: elections-1960-primaries
      c: 'Manchester, N.H., election eve. Governor Wesley Powell, Nixon''s New Hampshire manager, on his way to a television station to repeat that Kennedy is "soft" on communism. Boutin, Salinger and O''Brien buy the fifteen minutes right after Powell, $75; Boutin answers him, Salinger writing the pages as he speaks. Powell to O''Brien: "I''ll see you in Wisconsin." O''Brien: "I''ll be happy to buy your plane ticket." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 64. Names: Powell, Boutin, Salinger, O''Brien, Kennedy, Nixon.'
      tags:
      - name:powell-wesley
      - name:boutin-bernard-l
      - name:salinger-pierre
      - name:obrien-lawrence-f
      - name:kennedy-john-f
      - name:nixon-richard-m
      - state:nh
      - city:manchester
- cite:
    id: cal.1960-03-08.elections-1960
    item: '[[w.obrien-no-final-victories]], 62, 64 (the first primary, New Hampshire, Mar. 8; Kennedy over Paul Fisher, a California penmaker, "by a nine-to-one margin"; not the totals or the Republican side)'
    units: A
- cite:
    id: cal.1960-04-05.elections-1960
    item: '[[w.obrien-no-final-victories]], 65 (Kennedy 56.5 per cent and six of the ten congressional districts; not Humphrey''s vote, the totals or the Republican side)'
    units: A
- cite:
    id: cal.1960-04-05.elections-1960-kennedy
    item: '[[w.obrien-no-final-victories]], 65 (primary night, the gloom at the Kennedy headquarters: Kennedy pacing, shaking his head, biting his fingers; Humphrey on television claiming a moral victory; not the sister''s question or Kennedy''s answer)'
    units: '?'
- cite:
    id: cal.1960-04-06.elections-1960
    item: '[[w.obrien-no-final-victories]], 66 (O''Brien, Robert Kennedy and O''Donnell fly to West Virginia the morning after the Wisconsin primary, held up at the airport by a flat tire on the Caroline; not the Clarksburg and Charleston meetings, the counties or the numbers)'
    units: A
- cite:
    id: cal.1960-04-26.elections-1960
    item: '[[w.obrien-no-final-victories]], 78 (Pennsylvania: Lawrence a favorite son, Kennedy''s men kept out of the State; the write-in for Kennedy, 183,073 votes; O''Brien wakes Kennedy by telephone with the first returns; not Massachusetts or the Republican side)'
    units: '?'
- add:
    entry:
      id: cal.1960-05-01.elections-1960-primaries
      when: May 1
      date: '1960-05-01'
      thread: elections-1960-primaries
      c: West Virginia, the Sunday nine days before the primary. O'Brien, McDonough and Phyllis Maddock hop across the State in a twin-engine plane, about ten stops, to meet local political leaders; on confirming each slating arrangement O'Brien hands over the agreed share of the expenses. The last landing, late at night, in a field lit by the headlights of three automobiles. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 74. Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
      - state:wv
- cite:
    id: cal.1960-05-03.elections-1960
    item: '[[w.obrien-no-final-victories]], 77 (Indiana, May 3: Kennedy about eighty per cent, Lar Daly and another the rest; Eddie King telephones O''Brien the result on election night; not the District or Ohio)'
    units: E
- cite:
    id: cal.1960-05.elections-1960-primaries-4
    item: '[[w.obrien-no-final-victories]], 72 (the copies of Humphrey''s correspondence with his draft board from an anonymous Minnesota source; the camp decides to do nothing with them for the time being, to use them only to answer some low blow from Humphrey, and then through Roosevelt; the papers given to Roosevelt; not the day; see Variant)'
    units: '?'
- variant:
    id: cal.1960-05.elections-1960-primaries-4
    unit: B
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: the camp decides to do nothing with the papers for the time being, to retaliate with them, through Roosevelt, only if Humphrey strikes some extremely low blow; Roosevelt hands them to a reporter in anger; the incident "happened inadvertently"'
    at: 72–73
- cite:
    id: cal.1960-05.elections-1960-11
    item: '[[w.obrien-no-final-victories]], 73 (Roosevelt, driving with Forbes and a reporter, angered by Humphrey''s remarks about him, hands the reporter the draft-board papers; the story published; Humphrey''s camp demands retractions; Roosevelt apologizes and offers to leave the campaign; Kennedy, introducing him at a Charleston rally that evening, speaks warmly of him; not the words to the interviewer or Kennedy''s apology)'
    units: '?'
- cite:
    id: cal.1960-05.elections-1960-8
    item: '[[w.obrien-no-final-victories]], 75 (the Sunday before the election, the afternoon, a television studio, Kennedy''s last major appearance: a question-and-answer session with Roosevelt as moderator, Kennedy changing the format toward the close to speak directly of his religion, of serving in the war and his brother''s death in it; not Sorensen''s words or the passage on the oath)'
    units: '?'
- add:
    entry:
      id: cal.1960-05-08.elections-1960-primaries
      when: May 8
      date: '1960-05-08'
      thread: elections-1960-primaries
      c: 'Charleston, W. Va., the Sunday before the primary. Kennedy, Powers and O''Brien to Mass in the rain, the polls showing Kennedy behind. On the ride back O''Brien, recalling Ribicoff''s televised talk of his immigrant parents: "Well, are you ready to cry a little?" Kennedy: "I''m desperate but not that desperate." In the hotel room they agree to claim a moral victory, as Humphrey had in Wisconsin, if he loses by no more than 53–47; no word of quitting. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 74–75. Names: Kennedy, Powers, O''Brien, Ribicoff, Humphrey.'
      tags:
      - name:kennedy-john-f
      - name:powers-david-f
      - name:obrien-lawrence-f
      - name:ribicoff-abraham
      - name:humphrey-hubert-h
      - state:wv
      - city:charleston
- cite:
    id: cal.1960-05-10.elections-1960
    item: '[[w.obrien-no-final-victories]], 75–76 (West Virginia: Kennedy 61 to 39, forty-eight of the fifty-five counties; Nebraska the same day: Kennedy 89.1 per cent, the largest Democratic vote since Roosevelt in 1940; not the Republican side)'
    units: A, D
- cite:
    id: cal.1960-05-10.elections-1960-4
    item: '[[w.obrien-no-final-victories]], 76 (Humphrey concedes; Robert Kennedy goes to his headquarters and escorts him back to the Kennedy headquarters, Humphrey "gallant and gracious"; Kennedy flies down from Washington on the Caroline to thank the workers; not the hotel room, Muriel Humphrey or Rauh)'
    units: '?'
- add:
    entry:
      id: cal.1960-05-11.elections-1960-primaries-2
      when: May 11
      date: '1960-05-11'
      thread: elections-1960-primaries
      c: The commercial flight back to Washington, Wednesday morning. O'Brien, Maddock and King near Humphrey and his wife; O'Brien and Humphrey agree it had been "a hard fight, but fairly fought." Kennedy workers at the back sing a parody of the Humphrey song; O'Brien sends Maddock to stop them. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 76–77. Names: O''Brien, Humphrey.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - state:wv
- cite:
    id: cal.1960-05-17.elections-1960
    item: '[[w.obrien-no-final-victories]], 77 (the Maryland primary, May 17: Kennedy over Morse, 70.3 per cent to 17.2; O''Brien''s belief that Teamster money was behind Morse; not the votes)'
    units: A
- cite:
    id: cal.1960-05-20.elections-1960
    item: '[[w.obrien-no-final-victories]], 79 (Oregon, May 20: Kennedy 51 per cent, Morse 32, Humphrey 5.7, Symington 4.4, Johnson just under 4; not the votes or the Republican side)'
    units: A
- cite:
    id: cal.1960-05.elections-1960
    item: '[[w.obrien-no-final-victories]], 79–80 (after the Oregon primary, O''Brien and O''Donnell persuade Kennedy to stop in Illinois on his way east and call on Stevenson; Stevenson "cool and aloof," no sign of retiring; Kennedy furious at the position; not Libertyville or the words on Johnson)'
    units: '?'
- cite:
    id: cal.1960-07-10.elections-1960-3
    item: '[[w.obrien-no-final-victories]], 81 (the Sunday before the convention: Illinois gives Kennedy 59½ of its 69 votes, by Daley''s judgment; not Los Angeles)'
    units: B
- cite:
    id: cal.1960-07-12.elections-1960-2
    item: '[[w.obrien-no-final-victories]], 81–82 (Johnson''s challenge to debate before the Texas delegation; Kennedy, driving across Los Angeles with O''Brien between delegations: "I''m going to do it, Larry ... I''m sure as hell not afraid of Lyndon"; Kennedy''s opening, "full of admiration for Senator Johnson ... for majority leader of the United States Senate"; Johnson deflated, the Texans cheering; not the hour, the place, the telegram or the Massachusetts delegation)'
    units: '?'
- check:
    id: cal.1960-07-12.elections-1960-2
    text: 'Check: the day of the challenge: [[w.obrien-no-final-victories]], 81–82, has Johnson issue it the day before Kennedy, driving with O''Brien early in convention week, decides to accept.'
- add:
    entry:
      id: cal.1960-07-11.elections-1960-los-angeles-3
      when: July 11–13
      date: '1960-07-11'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, a CBS television booth above the convention floor, as Stevenson makes his first appearance in the hall and his followers set off a demonstration. Mike Wallace asks O''Brien how he feels, as a Kennedy man, about the outpouring. O''Brien: "It''s a fine demonstration but I don''t think it''s changing any delegate votes. It only shows Stevenson might be elected mayor of Los Angeles." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 81. Check: the day (the work gives none; Stevenson''s first appearance in the hall, during the convention). Names: O''Brien, Stevenson.'
      tags:
      - name:obrien-lawrence-f
      - name:stevenson-adlai-e
      - state:ca
      - city:los-angeles
- cite:
    id: cal.1960-07-13.elections-1960
    item: '[[w.obrien-no-final-victories]], 82–83 (the roll call, Wednesday night; O''Brien on the floor near the California delegation, which gives Kennedy 33½ of its 81; Wyoming puts Kennedy over, Edward Kennedy waving its standard; not the totals or the 761)'
    units: '?'
- cite:
    id: cal.1960-07-14.elections-1960-2
    item: '[[w.obrien-no-final-victories]], 84–85 (the morning after the nomination, Kennedy''s suite: Jackson and Symington told of the choice of Johnson; Jackson, as consolation, to be national chairman for the campaign, though it was promised to Bailey, who agrees to wait until January; not the hours or Salter)'
    units: '?'
- cite:
    id: cal.1960-07-14.elections-1960-4
    item: '[[w.obrien-no-final-victories]], 85 (O''Brien and Johnson meet for the first time, the morning after the nomination, in Kennedy''s suite: Johnson in brown, nose to nose, a five-minute monologue: he wants to be part of the team and will work tirelessly for the ticket; not the words quoted, which are Bernstein''s)'
    units: '?'
- cite:
    id: cal.1960-07-14.elections-1960
    item: '[[w.obrien-no-final-victories]], 85–86 (the nomination: to avoid a roll call, with Reuther and Governor Williams of Michigan opposed, McCormack moves to suspend the rules and nominate by voice vote, Ribicoff, with O''Brien beside him, ready if anything fails; Collins rules two-thirds needed and, to a chorus of ayes and a scattering of no''s, declares Johnson nominated by acclamation; not the offer, Robert Kennedy''s visits or the galleries)'
    units: '?'
- cite:
    id: cal.1960-07-16.democratic-party
    item: '[[w.obrien-no-final-victories]], 86 (the national committee meeting the morning after the acceptance speech, where Kennedy is to announce O''Brien as director of organization for the campaign; Robert Kennedy and O''Brien brief the party leaders, moved from room to room past checkout time; not Jackson''s naming or the press conference)'
    units: '?'
- add:
    entry:
      id: cal.1960-08-02.elections-1960-kennedy
      when: Aug. 2
      date: '1960-08-02'
      thread: elections-1960-kennedy
      c: 'Philadelphia, the Sheraton, 2 p.m. The first of the regional meetings for State and local Democrats on Robert Kennedy and O''Brien''s tour, Tuesday. O''Brien outlines the campaign program; Robert Kennedy speaks and takes questions; Green tells how his organization registers voters. Robert Kennedy to Green: "We''ll buy you a shirt, Bill," and takes him on to Boston. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 87. Names: O''Brien, Robert Kennedy, Green.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
      - name:green-william-j-jr
      - state:pa
      - city:philadelphia
- add:
    entry:
      id: cal.1960-08-02.elections-1960-kennedy-2
      when: Aug. 2
      date: '1960-08-02'
      thread: elections-1960-kennedy
      c: Boston, the Parker House, that night. The regional meeting with the party leaders of the New England States, Robert Kennedy and O'Brien. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 87. Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - state:ma
      - city:boston
- add:
    entry:
      id: cal.1960-08-03.elections-1960-kennedy
      when: Aug. 3
      date: '1960-08-03'
      thread: elections-1960-kennedy
      c: Chicago, the luncheon meeting with Democrats of Illinois, Wisconsin, Indiana, Michigan, Ohio and Minnesota. On arrival Robert Kennedy and O'Brien learn that Daley's office was only notified of the meeting, not asked; they call on him at the Morrison Hotel and apologize. Daley, satisfied, hosts it a few hours later. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 87–88. Names: Robert Kennedy, O''Brien, Daley.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1960-08-04.elections-1960-kennedy
      when: Aug. 4
      date: '1960-08-04'
      thread: elections-1960-kennedy
      c: Denver, Thursday. The regional meeting of Robert Kennedy and O'Brien's tour. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 88. Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - state:co
      - city:denver
- add:
    entry:
      id: cal.1960-08-05.elections-1960-kennedy-2
      when: Aug. 5
      date: '1960-08-05'
      thread: elections-1960-kennedy
      c: San Francisco, Friday morning. The regional meeting of Robert Kennedy and O'Brien's tour. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 88. Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - state:ca
      - city:san-francisco
- add:
    entry:
      id: cal.1960-08-05.elections-1960-kennedy-3
      when: Aug. 5
      date: '1960-08-05'
      thread: elections-1960-kennedy
      c: Los Angeles, Friday evening. The regional meeting of Robert Kennedy and O'Brien's tour. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 88. Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1960-08-06.elections-1960-kennedy-5
      when: Aug. 6
      date: '1960-08-06'
      thread: elections-1960-kennedy
      c: Kansas City, Saturday. The regional meeting of Robert Kennedy and O'Brien's tour, before St. Louis the same day. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 88. Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - state:mo
      - city:kansas-city
- add:
    entry:
      id: cal.1960-08-06.elections-1960-kennedy-4
      when: Aug. 6
      date: '1960-08-06'
      thread: elections-1960-kennedy
      c: St. Louis, Saturday, after Kansas City. The regional meeting with the border States' Democrats, Robert Kennedy and O'Brien; liberal leaders come, but very few from the State party organizations. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 88–89. Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - state:mo
      - city:st-louis
- add:
    entry:
      id: cal.1960-08-07.elections-1960-kennedy
      when: Aug. 7
      date: '1960-08-07'
      thread: elections-1960-kennedy
      c: New York, the Biltmore ballroom, Sunday night. The last of the regional meetings, with a thousand of the State's politicians; less impressed than the other regions, a number have more than a few words to say. More pep rally than business session. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 88. Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
      - state:ny
      - city:new-york
- cite:
    id: cal.1960-08.elections-1960-12
    item: '[[w.obrien-no-final-victories]], 91 (back in Washington, the Kennedy group takes over the national committee''s offices; not the address, the numbers, the sections or the frictions)'
    units: '?'
- cite:
    id: cal.1960-09-12.elections-1960
    item: '[[w.obrien-no-final-victories]], 94 (Kennedy before the Greater Houston Ministerial Association on his religion, Sept. 12; not the hotel, the questions or the words)'
    units: '?'
- add:
    entry:
      id: cal.1960-09-26.elections-1960-debates-5
      when: Sept. 26
      date: '1960-09-26'
      thread: elections-1960-debates
      c: Chicago, before the first debate. In the holding room Kennedy drinks tea, leaves the sandwiches untouched; "Mr. Kennedy," his father, Robert Kennedy, O'Donnell, Sorensen and O'Brien watch the clock. Ten minutes before air time O'Brien finds Nixon alone in the studio, pacing, mopping his brow, his make-up bad. Kennedy walks in after the countdown reaches three minutes, barely glancing at him. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 92–93. Names: Kennedy, Joseph Kennedy, Robert Kennedy, O''Donnell, Sorensen, O''Brien, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-joseph-p
      - name:kennedy-robert-f
      - name:odonnell-kenneth-p
      - name:sorensen-theodore-c
      - name:obrien-lawrence-f
      - name:nixon-richard-m
      - state:il
      - city:chicago
- cite:
    id: cal.1960-11-06.elections-1960-4
    item: '[[w.obrien-no-final-victories]], 94 (the 30,000 at Waterbury who greet Kennedy at three in the morning, running far behind schedule; not the balcony or the words)'
    units: '?'
- cite:
    id: cal.1960-11-07.elections-1960-5
    item: '[[w.obrien-no-final-victories]], 94 (Boston the night before the election: hours from the airport to the hotel to the Garden through the crowd, the car so dented it is scrapped; the Garden''s "explosion" of shouting; not Manchester or Faneuil Hall)'
    units: '?'
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-16
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      c: 'Hyannis Port, Robert Kennedy''s house, the afternoon. Kennedy, hoarse, in khakis and a tan sweater, inspects the telephone network set up for early returns from "weathervane" precincts, ten volunteers under Donahue, Dungan and Napolitan. Kennedy to Donahue: "Get me John Bailey." Kennedy: "John, how''s it going?" Bailey asks who it is. "Jack." "Jack who?" "Your candidate." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 95. Names: Kennedy, Dungan, Napolitan.'
      tags:
      - name:kennedy-john-f
      - name:dungan-ralph-a
      - name:napolitan-joseph
      - state:ma
      - city:hyannis-port
- cite:
    id: cal.1960-11-08.elections-1960-9
    item: '[[w.obrien-no-final-victories]], 95–96 (the telephone network for early returns at Robert Kennedy''s house; the family and staff, Harris among them, watch the returns together through the night; not the sunporch, the hours or the calls)'
    units: '?'
- cite:
    id: cal.1960-11-08.elections-1960-count-13
    item: '[[w.obrien-no-final-victories]], 96 (Johnson calls; Kennedy breaks the tension: "Well, I see you lost Ohio and I won Texas"; Kennedy''s retort, the other side of the call; not the house, the ranch, Texas safe, or Johnson''s words)'
    units: '?'
- cite:
    id: cal.1960-11-09.elections-1960-9
    item: '[[w.obrien-no-final-victories]], 96 (Nixon on television around 3 a.m., refusing to concede; to someone''s "Why don''t you give up?" Kennedy: "Why should he? ... I wouldn''t, in his place"; Lodge on television, "Cabot looks like he''s having a hard time staying awake"; Kennedy leaves about four, saying he is going to bed; not Salinger or the Armory)'
    units: '?'
- cite:
    id: cal.1960-11-09.elections-1960-count-7
    item: '[[w.obrien-no-final-victories]], 97 (late morning, the National Guard Armory at Hyannis: the President-elect and his family claim victory; on his way to the stage he stops to thank Elva and Lawrence O''Brien; not Klein, the words or Merriman Smith)'
    units: '?'
- add:
    entry:
      id: cal.1960-11-10.transition-and-staff
      when: Nov. 10
      date: '1960-11-10'
      thread: transition-and-staff
      c: Hyannis Port, Robert Kennedy's house, mid-morning, the day after the Armory. Robert and Edward Kennedy, Sorensen, O'Donnell, Salinger, Smith, Shriver and O'Brien wait for the President-elect; when he comes in they spring to their feet. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 97. Names: Robert Kennedy, Edward Kennedy, Sorensen, O''Donnell, Salinger, Shriver, O''Brien, Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:kennedy-edward-m
      - name:sorensen-theodore-c
      - name:odonnell-kenneth-p
      - name:salinger-pierre
      - name:shriver-r-sargent
      - name:obrien-lawrence-f
      - name:kennedy-john-f
      - state:ma
      - city:hyannis-port
- add:
    entry:
      id: cal.1960-11-14.transition-and-staff-4
      when: Nov. 14
      date: '1960-11-14'
      thread: transition-and-staff
      c: 'Washington, the Monday after the election. O''Brien back at his desk at the Democratic National Committee, on the President-elect''s first assignment to him: which campaign supporters to offer places in the Administration. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 97. Names: O''Brien, Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-11.transition-and-staff-cabinet-6
      when: Nov., mid-month
      date: 1960-11
      thread: transition-and-staff-cabinet
      c: Palm Beach, the President-elect's bedroom, the talks on appointments. Shriver first names McNamara, the new president of the Ford Motor Company, for Defense. Someone asks if he is a Catholic; no one knows; Shriver is to find out, a Catholic Attorney General being in view. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 97–98. Check: the day (the work gives "mid-November" for the talks at Palm Beach, no day for the bedroom). Names: Shriver, McNamara, Kennedy.'
      tags:
      - name:shriver-r-sargent
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      - state:fl
- add:
    entry:
      id: cal.1960-12.transition-and-staff-6
      when: Dec., mid-month
      date: 1960-12
      thread: transition-and-staff
      c: 'Washington, O''Brien''s office at the Democratic National Committee. Robert Kennedy: "Larry, the spot for you is Deputy Postmaster General," the number two post, since John Bailey "won''t stay on as national chairman forever." O''Brien: "I haven''t any interest whatsoever in that spot"; he can go back to Springfield. Robert Kennedy, annoyed, suggests that might not be a bad idea. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 100. Check: the day (the work says "one day in mid-December"). Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1960-12.transition-and-staff-7
      when: Dec., Christmas
      date: 1960-12
      thread: transition-and-staff
      c: 'O''Brien named special assistant to the President for congressional relations and personnel. The President-elect to him: "Larry, I''ve decided congressional relations is the right role for you and the personnel slot seems to go with it." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 101. Check: the day (the work says "over Christmas"). Names: O''Brien, Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-01-13.transition-and-staff
      when: Jan. 13
      date: '1961-01-13'
      thread: transition-and-staff
      c: O'Brien begins interviewing candidates for his congressional relations staff, men with Capitol Hill experience and without it. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 101. Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1961-01-21.transition-and-staff-3
      when: Jan. 21
      date: '1961-01-21'
      thread: transition-and-staff
      c: The White House, the Fish Room, 8 a.m., the morning after the Inaugural Ball, on Kennedy's order of the afternoon before. Kennedy gives the staff a brief "let's get going" talk; they scramble through the West Wing for office space. O'Brien takes Harlow's old office and the rooms beside it on the second floor, and the paneled corner office where Feldman had left his briefcase. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 102–03. Names: Kennedy, O''Brien, Harlow, Feldman.'
      tags:
      - name:kennedy-john-f
      - name:obrien-lawrence-f
      - name:feldman-myer
      - name:harlow-bryce-n
- add:
    entry:
      id: cal.1961-01-24.rules
      when: Jan. 24
      date: '1961-01-24'
      thread: rules
      c: The White House, the afternoon after the leaders' breakfast. Kennedy has Rayburn back and asks him to put off the Rules Committee vote from Jan. 25 to Jan. 31. Rayburn, reluctant, agrees. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 105. Names: Kennedy, Rayburn, O''Brien.'
      tags:
      - name:kennedy-john-f
      - name:rayburn-sam
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1961-03-24.jobs-and-wages
      when: Mar. 24
      date: '1961-03-24'
      thread: jobs-and-wages
      c: 'Rayburn''s office. Goldberg and O''Brien with Vinson, McCormack, Albert and Powell on the minimum wage bill, short of votes. Vinson would go to $1.15 for Southern votes. Rayburn: "I feel this is a decision the Administration has to make." Goldberg, nodding to O''Brien: "This really is a White House decision." O''Brien holds to $1.25 and cuts the coverage, about half a million of the four million workers, the laundry workers among them; Albert, pressed, agrees to lead the floor debate. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 124–25. Check: the day: the work dates the meeting Mar. 24 and has Albert''s speech "the next day" and the vote "that day," but the House voted on Mar. 24. Names: Rayburn, Goldberg, Vinson, McCormack, Albert, Powell, O''Brien.'
      tags:
      - name:rayburn-sam
      - name:goldberg-arthur-j
      - name:vinson-carl
      - name:mccormack-john-w
      - name:albert-carl
      - name:powell-adam-clayton-jr
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1962-07-16.medicare
      when: July 16
      date: '1962-07-16'
      thread: medicare
      c: 'The day before the Senate''s Medicare vote. Ribicoff and Wilbur Cohen call on Senator Randolph of West Virginia, whose State has overspent its federal welfare funds by some $11 million and whom Kerr has offered to relieve of it in the welfare bill: the administration, they assure him, will do the same. Randolph stays noncommittal. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 134–35. Names: Ribicoff, Cohen, Randolph, Kerr.'
      tags:
      - name:ribicoff-abraham
      - name:cohen-wilbur-j
      - name:randolph-jennings
      - name:kerr-robert-s
      - state:wv
- add:
    entry:
      id: cal.1962-07.rules
      when: July, late
      date: 1962-07
      thread: rules
      c: A Saturday afternoon, after two weeks of the liberals' filibuster against the communications satellite bill. Kerr, Bobby Baker, Manatos and O'Brien pool their intelligence and conclude that a two-thirds vote for cloture is possible but very close. Many Southerners want the filibuster stopped but are reluctant to vote against unlimited debate; the plan is to persuade them not to vote at all. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 132–33. Check: the day (the work says "in late July" and "one Saturday afternoon"). Names: Kerr, Baker, Manatos, O''Brien.'
      tags:
      - name:kerr-robert-s
      - name:baker-robert-g
      - name:manatos-mike-n
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1962-11-06.elections-1962-3
      when: Nov. 6
      date: '1962-11-06'
      thread: elections-1962
      c: 'Election night. O''Brien goes to the President''s office to say that Representative Frank W. Burke of Louisville, a staunch supporter, has been defeated. Kennedy: "It looks like a damn long night, Larry." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 142. Names: O''Brien, Kennedy, Burke.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-john-f
      - name:burke-frank-w
      - state:ky
      - city:louisville
- add:
    entry:
      id: cal.1963-11-22.succession-31
      when: Nov. 22–23, midnight
      date: '1963-11-22'
      thread: succession
      c: Gawler's Funeral Home, Wisconsin Avenue, at midnight, the body still at Bethesda. O'Brien, O'Donnell and Powers ask for "the plainest one you have in the middle price range" and take the casket with the simplest interior without asking the price; it proves expensive. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 161. Names: O''Brien, O''Donnell, Powers.'
      tags:
      - name:obrien-lawrence-f
      - name:odonnell-kenneth-p
      - name:powers-david-f
      - city:washington
- add:
    entry:
      id: cal.1963-11-23.medicare
      when: Nov. 23
      date: '1963-11-23'
      thread: medicare
      c: The White House, Saturday night, Johnson's second night as President. Henry Hall Wilson tells O'Brien of the breakthrough with Mills of the day before. O'Brien, thinking it urgent, has Wilson send a draft of the new Medicare bill to Johnson that night. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 186. See [[cal.1963-11-22.medicare]]. Names: Wilson, O''Brien, Mills, Johnson.'
      tags:
      - name:wilson-henry-hall
      - name:obrien-lawrence-f
      - name:mills-wilbur-d
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-07-29.robert-kennedy-7
      when: July 29
      date: '1964-07-29'
      thread: robert-kennedy
      also:
      - elections-1964-vice-presidency
      c: 'The White House, O''Brien''s office, before the meeting with Johnson. Robert Kennedy stops by and the two speculate on Johnson''s decision. Kennedy knows he is not likely to be chosen, and why: the two do not get along; Johnson wants to be elected in his own right, not overshadowed or challenged in 1968; the polls say he does not need Kennedy. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 174–75. The work gives no day; the meeting is [[cal.1964-07-29.robert-kennedy]]. Names: Robert Kennedy, O''Brien, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-07-29.robert-kennedy-8
      when: July 29
      date: '1964-07-29'
      thread: robert-kennedy
      also:
      - elections-1964-vice-presidency
      c: The White House, after Kennedy's lunch with O'Donnell and O'Brien. Johnson has O'Brien in and gives his version of the meeting with Robert Kennedy; told it differs at points from Kennedy's, he presses a buzzer and Jenkins reads from a long memorandum Johnson had dictated just after Kennedy left. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 175. The work gives no day; the meeting is [[cal.1964-07-29.robert-kennedy]], the lunch [[cal.1964-07-29.robert-kennedy-5]]. Names: Johnson, O''Brien, Robert Kennedy, Jenkins.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
      - name:jenkins-walter
- add:
    entry:
      id: cal.1964-08-24.elections-1964-atlantic-city-2
      when: Aug. 24–27
      date: '1964-08-24'
      thread: elections-1964-atlantic-city
      c: Atlantic City. O'Brien and O'Donnell are stationed in an out-of-the-way motel, with a room, cars and tickets to the floor and the receptions, and nothing to do; Johnson, through Jenkins and Marvin Watson, controls every detail, and the platform was written in the White House. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 176–77. Check: the days (the work gives none). Names: O''Brien, O''Donnell, Johnson, Jenkins, Watson.'
      tags:
      - name:obrien-lawrence-f
      - name:odonnell-kenneth-p
      - name:johnson-lyndon-b
      - name:jenkins-walter
      - name:watson-w-marvin
      - state:nj
      - city:atlantic-city
- add:
    entry:
      id: cal.1964-11-03.elections-1964-7
      when: Nov. 3
      date: '1964-11-03'
      thread: elections-1964
      c: 'Election night. Johnson calls O''Brien twice, elated by the landslide and the new Democratic majorities in both Houses: "We can wrap up the New Frontier program now, Larry," he says. "We can pass it all now." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 178. Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- cite:
    id: cal.1961-01.rules
    item: '[[w.obrien-no-final-victories]], 105–06 (Rayburn''s words at the first of the weekly leaders'' breakfasts, Tuesday, Jan. 24; Kennedy''s to O''Brien after Rayburn agrees that afternoon to put off the vote; the words as the entry has them)'
    units: A-B
- cite:
    id: cal.1961-01-31.rules
    item: '[[w.obrien-no-final-victories]], 106–07 (the White House whip count, which first showed a loss by seven votes, with Bolling and other House allies helping; Kennedy''s one call, to Cooley, dean of the North Carolina delegation, urging him to reconvene it, with no vote changed; the vote 217 to 212 with twenty-two Republicans and thirty-four Southern Democrats)'
    units: '?'
- cite:
    id: cal.1961-03-24.program
    item: '[[w.obrien-no-final-victories]], 125 (the House loses "by a vote of 186 to 185," Albert''s count, not one of the day''s roll calls; Kennedy, told by O''Brien: "One vote! I can''t believe it!"; the conference''s two-step increase, $1.15, then $1.25 in two years; not the roll calls, "first" or the day)'
    units: C
- cite:
    id: cal.1961-05-01.program
    item: '[[w.obrien-no-final-victories]], 126 (Kennedy signs the Area Redevelopment Act, a four-year, $451 million program, "that same week, the anniversary of his victory in the West Virginia primary"; not the day or the statute)'
    units: '?'
- cite:
    id: cal.1961-05-05.jobs-and-wages
    item: '[[w.obrien-no-final-victories]], 125–26 (the conference report approved 230 to 196; Kennedy signs on May 5; Biemiller of the AFL-CIO: "Larry, we in organized labor have been waiting seven years for this moment"; not the statute or the coverage)'
    units: '?'
- cite:
    id: cal.1961-09.press-and-broadcasting
    item: '[[w.obrien-no-final-victories]], 129–30 (after the President''s two receptions for House and Senate Democrats before the adjournment on Sept. 27, Sorensen briefs about two dozen reporters at the home of Carroll Kilpatrick of the Washington Post, O''Brien there to answer questions; the reporters resent what they see as a snow job; not the date, the memorandum or the shout)'
    units: '?'
- cite:
    id: cal.1961-11-16.congress
    item: '[[w.obrien-no-final-victories]], 115 (the funeral at Bonham, Nov. 18: the President, with O''Brien, from California; the Vice President, Eisenhower and Truman; Rayburn dies at his farm, not the day; McCormack succeeds as Speaker)'
    units: B
- cite:
    id: cal.1962-03-21.defense
    item: '[[w.obrien-no-final-victories]], 117–18 (Vinson''s language directing the Secretary of the Air Force to spend about half a billion dollars on the RS-70, against the Defense Department''s $171 million; McNamara cannot budge him; in March Kennedy has him in and, in a private walk in the Rose Garden, persuades him to withdraw the demand; not "authorize," the day or the House vote)'
    units: A-B
- cite:
    id: cal.1962-05-19.democratic-party
    item: '[[w.obrien-no-final-victories]], 151 (O''Brien and his wife at the Democratic fund-raiser at Madison Square Garden, "in May 1962," with the President''s birthday; Monroe sings "Happy Birthday to You"; Arthur Krim''s party after, Durante and Bill Green singing a duet; not the crowd, the sum or the other performers)'
    units: C
- cite:
    id: cal.1962-05-20.medicare
    item: '[[w.obrien-no-final-victories]], 133–34 (the National Council of Senior Citizens'' rally at the Garden, May 20; Kennedy agrees to a nationally televised address; it fails to rouse pressure on Congress and annoys Mills; not the AMA''s answer)'
    units: A
- cite:
    id: cal.1962-07-17.medicare-2
    item: '[[w.obrien-no-final-victories]], 134 (O''Brien''s head count to the President before the Senate vote: the Senate divided 50–50, adding "Senator Randolph has a problem"; the page does not give the leaders'' breakfast, the day or "at best")'
    units: '?'
- cite:
    id: cal.1962-07-17.medicare
    item: '[[w.obrien-no-final-victories]], 135 (Anderson''s amendment to the public welfare bill; the vote lost, 52 to 48, Randolph with Kerr; Hayden had promised to vote with the administration if Randolph did, which would have made a tie for Johnson to break; not the Javits name, the tabling motion or the broadcast)'
    units: B
- cite:
    id: cal.1962-08-14.rules
    item: '[[w.obrien-no-final-victories]], 133 (Aug. 14: cloture 63 to 27, three votes to spare, the first time since 1927 and the fifth in history; of the twenty-two senators of the eleven Confederate States, fifteen against, two for, five not voting; the five who stayed away gave the margin; not the signing)'
    units: A-B
- cite:
    id: cal.1962-09-30.mississippi-ole-miss-6
    item: '[[w.obrien-no-final-victories]], 139–40 (O''Brien and O''Donnell called to the White House about 6 p.m., the Cabinet Room, then the Oval Office, where Kennedy paces and asks his brother "What''s going on?"; Katzenbach''s telephone reports; Kennedy''s speech postponed from 7:30 to 10 p.m.; the troops from Memphis do not arrive for hours; Kennedy on the military: "No wonder it''s so hard to win a war"; the entry has the Bay of Pigs remark, which O''Brien does not give)'
    units: '?'
- cite:
    id: cal.1962-10-11.trade
    item: '[[w.obrien-no-final-victories]], 131 (Kennedy signs the Trade Expansion Act of 1962 on Oct. 11, "the most important international piece of legislation since the Marshall Plan"; not Herter)'
    units: A
- cite:
    id: cal.1962-10-13.congress
    item: '[[w.obrien-no-final-victories]], 135 (Congress adjourns on Oct. 13; O''Brien''s list of 1962 passage: the trade bill, the first omnibus tax reform since 1954, the UN bond issue, the International Wheat Agreement, the Communications Satellite Act, manpower training, accelerated public works, among others; failed: Medicare, the education bills, the Department of Urban Affairs; forty of fifty-four major proposals; not the investment credit, welfare or the literacy tests)'
    units: A
- cite:
    id: cal.1962-10-20.missile-crisis
    item: '[[w.obrien-no-final-victories]], 140–41 (Saturday, Oct. 20, in Kennedy''s Chicago hotel suite: Kennedy calls in Salinger and has him tell the press he has a cold and is returning to the White House; the plane to Andrews, the helicopter, Kennedy silent, chin in hand; not the quarantine decision)'
    units: A
- cite:
    id: cal.1963-06-19.civil-rights-bill
    item: '[[w.obrien-no-final-victories]], 144 (the civil rights bill sent to Congress on June 19: a ban on discrimination in public accommodations, authority for the Attorney General to seek school desegregation, a Community Relations Service; not the rest)'
    units: A-D
- cite:
    id: cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe
    item: '[[w.obrien-no-final-victories]], 152–54 (about fifty White House staff of Irish descent flown to Ireland; Kennedy, fresh from West Berlin, met at Dublin Airport; the motorcade and City Hall at Cork, where Kennedy has O''Brien and Powers present their relatives, O''Brien''s aunt Julia Sweeney; the choir at Shannon; O''Brien, Boland and Donahue fly on to Rome for three days; not the days)'
    units: '?'
- cite:
    id: cal.1963-10-23.civil-rights-bill
    item: '[[w.obrien-no-final-victories]], 145–46 (O''Brien urges Kennedy to deal with Halleck; Kennedy has him to his office; Halleck: "Give me until tomorrow noon, then I''ll call you and tell you what I''ve been able to do"; not the day, the others at the meeting or the seven Republicans)'
    units: '?'
- cite:
    id: cal.1963-10-29.republican-party-congress
    item: '[[w.obrien-no-final-victories]], 146 (the day after Kennedy''s talk with Halleck in his office, O''Brien with Kennedy for the noon call; none by 12:45, Kennedy calls him; Halleck: "I''ve got you the votes to get your bill out of the committee"; the bill reported out of Judiciary in late October; not the day or the recorded words)'
    units: '?'
- cite:
    id: cal.1963-10-29.civil-rights-bill
    item: '[[w.obrien-no-final-victories]], 143, 146 (the House Judiciary Committee''s approval in late October; Kennedy''s personal intervention; Halleck and McCulloch the key Republicans; not the vote of 20 to 12 or the day)'
    units: '?'
- cite:
    id: cal.1963-11-22.democratic-party-5
    item: '[[w.obrien-no-final-victories]], 156–57 (Friday morning, the President''s suite at the Hotel Texas: Kennedy tells O''Brien to end the Johnson–Yarborough "sideshow": "I don''t care if you have to throw Yarborough into the car with Lyndon"; at the window, of the speaker''s platform, the Secret Service could not stop "someone who really wanted to get you"; O''Brien then persuades Yarborough on the sidewalk by the motorcade and tells Johnson; not the telephone call, Connally or the reception)'
    units: A
- cite:
    id: cal.1963-11-22.medicare
    item: '[[w.obrien-no-final-victories]], 143, 186 (Henry Hall Wilson''s agreement with Mills that morning, "after weeks of negotiations and discussions," on a formula to finance Medicare acceptable to Mills and to the Administration; Wilson tries to telephone O''Brien in Texas)'
    units: A-B
- cite:
    id: cal.1963-11-22.succession-24
    item: '[[w.obrien-no-final-victories]], 158–60 (the hospital: Kilduff, the acting press secretary, asks what to tell the press; the casket; a coroner and a judge insist on an autopsy; O''Donnell, Powers, McHugh and O''Brien push the casket past the Dallas officials, O''Brien shoving a priest aside; the entry has Dr. Rose and Judge Ward by name, which O''Brien does not give)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession-25
    item: '[[w.obrien-no-final-victories]], 163 (before the take-off, in the stateroom, Johnson, with Mrs. Johnson, asks O''Donnell and O''Brien to stay; O''Brien tells him of the trouble at the hospital and that they should take off at once; Johnson: "No, I''ve talked with the Attorney General. He thinks I should be sworn in here"; not Johnson''s words as the entry has them)'
    units: A
- variant:
    id: cal.1963-11-22.succession-25
    unit: B
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: in the stateroom, O''Brien, not O''Donnell, tells Johnson they should take off at once'
    at: '163'
- cite:
    id: cal.1963-11-22.succession
    item: '[[w.obrien-no-final-victories]], 163–64 (Judge Hughes arrives and is handed a typed sheet with the oath; Johnson asks O''Brien whether Mrs. Kennedy would join him; she comes and stands with the Johnsons; O''Brien hands the judge a book in a white box from the President''s bedside table, a Catholic missal, not a Bible; not the hour or Andrews)'
    units: B
- cite:
    id: cal.1963-11-22.succession-26
    item: '[[w.obrien-no-final-victories]], 164 (aloft, Johnson calls O''Brien again and renews his urging: "We''re being tested. The world is watching. I need your help"; he mentions the Senate vote on the Russian wheat bill set for Monday)'
    units: '?'
- variant:
    id: cal.1963-11-22.succession-26
    unit: C
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Johnson says "I need you more than you need me—and more than Jack Kennedy needed you" to O''Donnell and O''Brien in the stateroom before the take-off, Mrs. Johnson there; aloft he calls O''Brien again'
    at: 163–64
- cite:
    id: cal.1963-11-23.assassination-6
    item: '[[w.obrien-no-final-victories]], 161 (the body brought to the East Room at 4 a.m.; before the 10 a.m. Mass, Robert Kennedy asks O''Donnell and O''Brien to decide whether to open the casket; with the honor guard there they do not, and it stays closed; not the service, Schlesinger, Tuckerman or Walton)'
    units: '?'
- cite:
    id: cal.1963-11.transition-and-staff
    item: '[[w.obrien-no-final-victories]], 165 (in the first days back in Washington, Johnson, "over and over": "I need you, Larry"; O''Brien decides to stay: "So I stayed"; not the day)'
    units: B
- variant:
    id: cal.1963-11.transition-and-staff
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: "I want you to stay and help me pass Jack Kennedy''s program."'
    at: '165'
- cite:
    id: cal.1963-11-25.trade
    item: '[[w.obrien-no-final-victories]], 164 (after the funeral, O''Brien, back at the White House, sets about checking the wheat bill; not Johnson''s words or the count)'
    units: '?'
- cite:
    id: cal.1963-11-27.succession-3
    item: '[[w.obrien-no-final-victories]], 164 (Wednesday noon: Sorensen, Salinger and O''Brien go with Johnson to the Hill for the address to the joint session; not the talk in the car)'
    units: '?'
- cite:
    id: cal.1964-07-29.robert-kennedy
    item: '[[w.obrien-no-final-victories]], 174–75 (Johnson has Robert Kennedy to his office to settle the vice presidency and tells him he will choose no member of his Cabinet as his running mate; not the hour, the Clifford memorandum, the offers or the words)'
    units: '?'
- cite:
    id: cal.1964-07-29.robert-kennedy-5
    item: '[[w.obrien-no-final-victories]], 175 (Kennedy, O''Donnell and O''Brien lunch after the meeting, Kennedy recounting it in detail; not Johnson''s word to O''Donnell, what Kennedy told him of the campaign, or the words about forming their own country)'
    units: '?'
- cite:
    id: cal.1964-09-02.medicare
    item: '[[w.obrien-no-final-victories]], 186 (Medicare attached as a rider to the Social Security amendments to bypass Byrd''s Finance Committee; passed 49 to 44, Goldwater among those against; the first time a health insurance bill had passed either house; then a month of conference, where it dies "largely because of Wilbur Mills"; the page puts the Senate vote in August; not the Gore amendment or the day)'
    units: '?'
- check:
    id: cal.1964-09-02.medicare
    text: 'Check: the month: [[w.obrien-no-final-victories]], 186, has Medicare attached to the Social Security amendments and passed, 49 to 44, "In August."'
- cite:
    id: cal.1964-10-06.elections-1964-2
    item: '[[w.obrien-no-final-victories]], 177–78 (O''Brien''s four trips for the campaign: regional meetings with Democrats and labor; his reports, critical of the lack of materials and co-ordination, telephoned in when the mail is thought too slow; Johnson reading them as they came and demanding action, by Jenkins; not the date or the forecast)'
    units: '?'
- add:
    entry:
      id: cal.1965-01.transition-and-staff-3
      when: Jan., one day
      date: 1965-01
      thread: transition-and-staff
      c: 'Johnson''s office. O''Brien, who had meant to leave after the election, tells Johnson he will stay on two conditions: that Johnson announce at his next news conference that O''Brien submitted his resignation but agreed at Johnson''s insistence to stay through the 1965 legislative session, and that at the session''s end he accept the resignation without further discussion. Johnson: "I accept your conditions." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 179–80. Check: the day (the work says "one day in January"). Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-18.vietnam-congress-3
      when: Feb. 18
      date: '1965-02-18'
      thread: vietnam-congress
      c: 'O''Brien to Johnson, by memorandum: a Vietnam debate is scheduled in the House; the leadership will lead it in support of the President''s policy and O''Brien''s office will help with facts and speech material. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 191. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-18.vietnam-congress-4
      when: Feb. 18
      date: '1965-02-18'
      thread: vietnam-congress
      c: 'O''Brien to Johnson, by memorandum: a Senate debate on Vietnam is scheduled; Dirksen''s support is "fine" and considerable additional Democratic support is available "to counteract Church, McGovern, et al." A resolution supporting the President is inadvisable, since it would go to Fulbright''s Foreign Relations Committee; instead an informal statement of support is to be circulated among Senate allies, and O''Brien''s office will keep supplying them with speeches and statements. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 191. Names: O''Brien, Johnson, Dirksen, Church, McGovern, Fulbright.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:dirksen-everett
      - name:church-frank
      - name:mcgovern-george
      - name:fulbright-j-william
- cite:
    id: cal.1965-03-26.medicare
    item: '[[w.obrien-no-final-victories]], 187–88 (in mid-March, after Ways and Means reported the bill, Johnson on television with nine Democratic leaders of Congress; all but Byrd pledge support; Johnson pins Byrd down to prompt and thorough hearings: "Yes"; the words quoted)'
    units: B
- cite:
    id: cal.1965-04-08.medicare
    item: '[[w.obrien-no-final-victories]], 188 (the House passes Medicare on April 8; Mills given a standing ovation; the Republican Bettercare substitute defeated by 45 votes; the final vote 313 to 115)'
    units: '?'
- cite:
    id: cal.1965-07-09.medicare
    item: '[[w.obrien-no-final-victories]], 188 (the Senate passes Medicare 68 to 21, after prompt hearings by Byrd''s committee; not the day)'
    units: '?'
- cite:
    id: cal.1965-07-30.medicare
    item: '[[w.obrien-no-final-victories]], 188 (Johnson signs at the Truman Library, Independence, Mo., July 30, 1965, Truman present)'
    units: '?'
- add:
    entry:
      id: cal.1965-08-27.transition-and-staff
      when: Aug. 27
      date: '1965-08-27'
      thread: transition-and-staff
      c: 'The White House, a Friday afternoon in late August, before Johnson leaves for the Ranch. Johnson, his back turned, studying a news ticker, to O''Brien: "Bad news, Larry," he says. "You''re going to have to leave the White House. I''m appointing you Postmaster General!" O''Brien is to come to the Ranch the next day. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 199. Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- cite:
    id: cal.1965-08-29.transition-and-staff
    item: '[[w.obrien-no-final-victories]], 200–01 (Sunday at the Ranch: church with Johnson, Merriman Smith of UPI: "Hey, there''s Larry O''Brien!"; Johnson''s news conference on the lawn: Gronouski ambassador to Poland, O''Brien Postmaster General and still in charge of the legislative program, "Don''t be surprised if you see him on the Hill occasionally"; not "building bridges")'
    units: A, C
- add:
    entry:
      id: cal.1965-10-03.immigration-2
      when: Oct. 3
      date: '1965-10-03'
      thread: immigration
      c: 'Liberty Island, the immigration bill signing. The word is out to do all that can be done for Abe Beame, running for mayor of New York. The politicians scramble off the ferry for places near Johnson in the news photographs; O''Brien blocks Governor Rockefeller''s path to give Beame a head start. Rockefeller: "Damn it, O''Brien, I''m the governor of New York and I have a right to get off this boat." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 184. Check: the month (the work says "the summer of 1965"; the signing on Liberty Island was Oct. 3). See [[cal.1965-10-03.immigration]]. Names: O''Brien, Beame, Rockefeller.'
      tags:
      - name:obrien-lawrence-f
      - name:beame-abraham-d
      - name:rockefeller-nelson
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1965-10-11.transition-and-staff
      when: Oct. 11
      date: '1965-10-11'
      thread: transition-and-staff
      c: The Federal City Club, Washington. A party for O'Brien given by Washington newspapermen, with songs and skits. Dirksen asks him to reserve "a few bricks and a little mortar" for post offices in his State; Art Buchwald reads a speech so funny that he leaves to phone it in for his next column. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 204. Names: Dirksen, O''Brien.'
      tags:
      - name:obrien-lawrence-f
      - name:dirksen-everett
      - city:washington
- cite:
    id: cal.1965-11-03.transition-and-staff
    item: '[[w.obrien-no-final-victories]], 202–03 (the swearing-in delayed two months because Johnson wanted him to stay with the legislative program; Johnson, at the Ranch recovering from surgery, calls him to Hye, Tex., a combination store and post office; Johnson asks the storekeeper who appointed him postmaster; "Jim Farley"; the Kraft cheese)'
    units: A
- add:
    entry:
      id: cal.1965-12-09.program
      when: Dec. 9
      date: '1965-12-09'
      thread: program
      c: 'O''Brien to Johnson, a blunt memorandum on the Post Office Department after his first month: "postal service has obviously been deteriorating rapidly while mail volume shows an extraordinary yearly increase." He lists an inadequate budget and serious management deficiencies. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 205. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-03.vietnam-support
      when: Mar.
      date: 1966-03
      thread: vietnam-support
      c: 'O''Brien, after a luncheon with the editors of the *New York Times*, to Johnson, by memorandum: a two-hour question-and-answer period, mostly on Vietnam; he reminded them of the public''s attitude, the polls, the President''s desire for a peaceful resolution and his intention to fulfil the commitment, and urged internal unity. The editors are not of one mind; some, individually, support the President. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 191. Check: the day (the work says "the next month," after a February memorandum). Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-04.vietnam-support
      when: Apr., mid-month
      date: 1966-04
      thread: vietnam-support
      c: 'California. O''Brien at a testimonial dinner for Representative Cohelan, a critic of the war who speaks twenty minutes in a "dove-like" position; O''Brien follows with the Vietnam part of his speech, hit "very hard"; the audience is cool. To Johnson, by memorandum: the extent of concern in northern California surprised him; "this could mean political trouble in the near future." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 192. Check: the day (the work says "in mid-April"). Names: O''Brien, Johnson, Cohelan.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:cohelan-jeffery
      - state:ca
- add:
    entry:
      id: cal.1966-11-02.elections-1966
      when: Nov. 2
      date: '1966-11-02'
      thread: elections-1966
      c: 'O''Brien to Johnson, his predictions for the elections: a net loss of thirty-two House seats and perhaps thirty-seven; one Senate seat and perhaps two; four governorships. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 193. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- cite:
    id: cal.1966-11-08.elections-1966
    item: '[[w.obrien-no-final-victories]], 193 (O''Brien''s account of the result: forty-seven House seats, four Senate seats and eight governorships lost, against his predictions of Nov. 2; the entry''s House figure, 295 to 248, agrees)'
    units: '?'
- cite:
    id: cal.1967-01-09.vietnam-congress-2
    item: '[[w.obrien-no-final-victories]], 213–14 (Jan. 9, 1967, the President with the Senate Democratic leaders on the war, from Manatos''s notes: Fulbright, find a way to "get out"; Russell, "go in and win, or get out," Hill endorsing him; Smathers, Symington, Magnuson, Inouye, Randolph in other words; O''Brien: the strongest face-to-face criticism the President had yet heard; not the number present or Mansfield''s suggestion)'
    units: C, G
- add:
    entry:
      id: cal.1967-04-03.program
      when: Apr. 3
      date: '1967-04-03'
      thread: program
      c: 'Postmaster General O''Brien, to the Magazine Publishers Association: the postal service should be taken out of the Cabinet and made a nonprofit government corporation, run by a board of directors appointed by the President and a professional executive, free of appropriated funds and able to issue bonds for new facilities. Front-page news across the country; several hundred editorials, most favorable. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 208–09. Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
- cite:
    id: cal.1967-04-08.program
    item: '[[w.obrien-no-final-victories]], 209–10 (April 8, five days after O''Brien''s speech of April 3 proposing a nonprofit government corporation: the President names the President''s Commission on Postal Organization, Kappel, formerly chairman of AT&T, chairman; not the executive order, the members or the terms; the commission reports in June 1968)'
    units: C
- cite:
    id: cal.1967-11-03.elections-1968
    item: '[[w.obrien-no-final-victories]], 215 (O''Brien''s long memorandum in early November at the President''s request: no early announcement; organize at once; no primaries, but let supporters work in key primary States, the New Hampshire write-in for one; stress the vision of the future; the strategy adopted at the meeting and followed for four months; not the "debacle")'
    units: '?'
- cite:
    id: cal.1967-11-30.elections-1968
    item: '[[w.obrien-no-final-victories]], 215 (McCarthy announces he will challenge Johnson in New Hampshire and other primaries; Johnson limits himself to a decidedly negative opinion of McCarthy; no one around him takes it seriously)'
    units: '?'
- add:
    entry:
      id: cal.1968-02-26.robert-kennedy-campaign-decision
      when: Feb. 26
      date: '1968-02-26'
      thread: robert-kennedy-campaign-decision
      c: 'Robert Kennedy''s Senate office, lunch. For the first time Kennedy tells O''Brien he may challenge Johnson: "I don''t want to do it, but I may have to," he says. "Johnson''s Vietnam policy is a debacle. ... He scares me." He asks O''Brien to talk to McNamara. O''Brien still doubts that he will run. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 216. Names: Robert Kennedy, O''Brien, Johnson, McNamara.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- cite:
    id: cal.1968-02.robert-kennedy
    item: '[[w.obrien-no-final-victories]], 216–17 ("a few days" after the lunch with Robert Kennedy of Feb. 26, in O''Brien''s office: Vietnam worse than the public knows, Johnson not objective; McNamara: "I think Bob has to run. I don''t see any other answer"; O''Brien: not sure it is the best way to a new policy)'
    units: B-C
- cite:
    id: cal.1968-01.elections-1968-4
    item: '[[w.obrien-no-final-victories]], 219 (O''Brien''s long memorandum to Johnson on a poll of Massachusetts Democrats: Edward Kennedy 80 to McCarthy''s 12, the President 72 to 11, McCormack 70 to 20, O''Brien 59 to 23; his offer to resign and run as Johnson''s stand-in; his advice that Johnson himself might enter; "earlier in the year," no day given)'
    units: C
- add:
    entry:
      id: cal.1968-03-02.robert-kennedy-campaign-decision
      when: Mar. 2
      date: '1968-03-02'
      thread: robert-kennedy-campaign-decision
      c: 'Hickory Hill, breakfast. Robert Kennedy speaks of the politicians urging him to run and says Unruh is having a poll taken in California. O''Brien: he shares Kennedy''s concern but cannot ignore political realities; the hope is that the men around Johnson can change his policy; he will keep their talks confidential but until then remain loyal to the President. He urges Kennedy to see Johnson face to face. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 217–18. Names: Robert Kennedy, O''Brien, Unruh, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:unruh-jesse-m
      - name:johnson-lyndon-b
      - state:ca
- cite:
    id: cal.1968-03-03.robert-kennedy-campaign
    item: '[[w.obrien-no-final-victories]], 218–19 (Sunday: Kennedy calls to say the California poll shows an Unruh slate pledged to him would run strongly, a "quickie" telephone poll; dinner at Hickory Hill, Ted Kennedy, Smith and Tunney there; Ethel Kennedy: he will have to run; Edward Kennedy tells O''Brien he will not enter the Massachusetts primary; not the order of guests)'
    units: '?'
- cite:
    id: cal.1968-03-05.elections-1968-4
    item: '[[w.obrien-no-final-victories]], 220 (Mar. 5, the filing deadline for the Apr. 30 primary; Donahue, State Senate leader, standing by to file as Johnson''s stand-in; Watson fails to return two calls; Johnson''s silence: O''Brien tells Donahue he cannot file; not McCarthy''s words)'
    units: A-B, D
- add:
    entry:
      id: cal.1968-03-07.elections-1968-johnson
      when: Mar. 7
      date: '1968-03-07'
      thread: elections-1968-johnson
      c: 'Johnson telephones O''Brien, displeased at a *New York Times* story quoting a "high official" that he will enter no primaries: "Were you the source of that?" O''Brien: the article made sense and he agrees with it. Johnson: "I''ll make my own damn decisions about the primaries and nobody is authorized to speak for me." O''Brien asks if he has any further comment and hangs up; the only unpleasant conversation between them. Ira Kapenstein had been the source. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 220–21. Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-03-15.robert-kennedy-campaign-decision-3
      when: Mar. 15
      date: '1968-03-15'
      thread: robert-kennedy-campaign-decision
      c: Boston, a luncheon in connection with the issue of a John F. Kennedy postage stamp. O'Brien, Postmaster General, speaks; Edward Kennedy, there, has to leave early for Washington and has Jimmy King of his Senate staff tell O'Brien that Robert Kennedy will announce his candidacy the next day. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 222. Names: O''Brien, Edward Kennedy, Robert Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-edward-m
      - name:kennedy-robert-f
      - state:ma
      - city:boston
- cite:
    id: cal.1968-03-16.robert-kennedy-campaign-2
    item: '[[w.obrien-no-final-victories]], 222 (O''Brien, in Massachusetts, watches Kennedy''s televised announcement Saturday morning; not the Caucus Room or the words)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-17.robert-kennedy-campaign-decision
      when: Mar. 17
      date: '1968-03-17'
      thread: robert-kennedy-campaign-decision
      c: Everett, Mass., Sunday evening, the day after Robert Kennedy's announcement. O'Brien, Postmaster General, makes a speech, introduced by Edward Kennedy. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 222. Names: O''Brien, Edward Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-edward-m
      - state:ma
      - city:everett
- add:
    entry:
      id: cal.1968-03-18.elections-1968-johnson
      when: Mar. 18
      date: '1968-03-18'
      thread: elections-1968-johnson
      c: 'Washington, the morning after O''Brien''s return late Sunday night. Rowe reads him a telegram to be sent over their joint signatures to several hundred Democratic leaders: each to pledge his support to Johnson; O''Brien to direct his re-election campaign. O''Brien: it will boomerang and cannot go out over his signature; his role is for the President and him to discuss, "there could be no emissaries." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 222–23. Names: Rowe, O''Brien, Johnson.'
      tags:
      - name:rowe-james-h-jr
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- variant:
    id: cal.1968-03-19.elections-1968-3
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: back in Washington late Sunday night, he reaches Rowe "the next morning" (Monday, Mar. 18) and then sends the memorandum, "as it was outlined to me this morning following my return from four days on the road": in Washington, the day before'
    at: 222–23
- cite:
    id: cal.1968-03-19.elections-1968-3
    item: '[[w.obrien-no-final-victories]], 222–23 (the proposed telegram, the loyalty-oath point, "an extension of the ''overkill'' tactics used in New Hampshire," "let the ''dividers'' slug it out among themselves"; the memorandum sent after Rowe''s call; O''Brien in Washington, not Massachusetts; not McPherson)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-18.robert-kennedy-campaign-decision
      when: Mar. 18
      date: '1968-03-18'
      thread: robert-kennedy-campaign-decision
      c: O'Brien's home, that evening. Edward Kennedy comes to dinner and talks over the political situation; he implies that it would be nice if O'Brien headed Robert Kennedy's campaign, and they do not pursue it. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 223. Names: Edward Kennedy, O''Brien, Robert Kennedy.'
      tags:
      - name:kennedy-edward-m
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-03-19.robert-kennedy-campaign-decision
      when: Mar. 19
      date: '1968-03-19'
      thread: robert-kennedy-campaign-decision
      c: Robert Kennedy calls O'Brien and refers again to Edward Kennedy's suggestion of the night before. Neither brother pushes him hard, as O'Brien sees it. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 223. Names: Robert Kennedy, O''Brien, Edward Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1968-03-20.robert-kennedy-campaign-decision
      when: Mar. 20
      date: '1968-03-20'
      thread: robert-kennedy-campaign-decision
      c: 'Morning, before O''Brien''s speech to the National Press Club. Robert Kennedy calls to ask what he will say; O''Brien reads him the part saying he supports Johnson. Kennedy: "Larry, I hope I''m not putting you on the spot, announcing my candidacy just before you make a speech to the Press Club. I didn''t plan it that way." O''Brien: "You''re not putting me on the spot, Bob." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 224. Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-03-21.elections-1968-johnson
      when: Mar. 21
      date: '1968-03-21'
      thread: elections-1968-johnson
      c: 'Johnson telephones O''Brien, very warm, the day after his Press Club speech; he wants to meet soon about O''Brien''s heading his campaign. Then: "You are in a position to destroy me." O''Brien tells him he disagrees. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 224. Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-03-21.vietnam-support
      when: Mar. 21
      date: '1968-03-21'
      thread: vietnam-support
      c: 'O''Brien to Johnson, a memorandum on Vietnam, after the invitation of views at the last Cabinet meeting: Americans are frustrated that South Vietnam is not carrying the burden; the need is to phase out American responsibility and phase in South Vietnamese, with the South Vietnamese government increasing its troops as the United States decreases its own; not withdrawal; meaningful negotiations unrealistic now; escalation would be matched. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 224–25. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-25.elections-1968-humphrey
      when: Mar. 25
      date: '1968-03-25'
      thread: elections-1968-humphrey
      c: O'Brien's office, a late lunch. Vice President Humphrey tells O'Brien of his doubts about the war and that he is arranging for prominent citizens who question it to meet privately with Johnson. O'Brien tells him of his own doubts and his memoranda. Each had not known the other's views; the problem is Johnson's equating criticism with disloyalty. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 225. Names: Humphrey, O''Brien, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- variant:
    id: cal.1968-03-24.elections-1968-2
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Monday, Mar. 25, "an informal meeting of the Cabinet was held in my office" at Johnson''s request, the Secretaries of State, Defense and the Treasury not invited; Freeman, Wirtz, Cohen, Udall, Clark and Weaver there'
    at: '225'
- cite:
    id: cal.1968-03-24.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 225–26 (the meeting of the Cabinet in O''Brien''s office, at Johnson''s request, the Secretaries of State, Defense and the Treasury not invited, on helping Johnson in Wisconsin; Freeman for going back; Wirtz, Cohen, Udall, Clark, Weaver despondent; Udall stays to talk of joint action by the Cabinet; O''Brien to Wisconsin on the Wednesday; the day Monday on the page, see the variant; not "a fight to save the administration")'
    units: D
- add:
    entry:
      id: cal.1968-03-26.robert-kennedy-campaign-decision
      when: Mar. 26
      date: '1968-03-26'
      thread: robert-kennedy-campaign-decision
      c: 'Edward Kennedy telephones O''Brien: "there''s a rumor all over town that you''re resigning as Postmaster General to join us." O''Brien: he is going to Wisconsin the next day to campaign for the President. Kennedy: an office is set aside in their headquarters with "Larry O''Brien" on the door. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 226. Names: Edward Kennedy, O''Brien.'
      tags:
      - name:kennedy-edward-m
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-03-27.vietnam-support
      when: Mar. 27
      date: '1968-03-27'
      thread: vietnam-support
      c: 'O''Brien to Johnson, a second memorandum on Vietnam: loyal Administration Democrats fear the Chicago convention and November. He proposes insisting on South Vietnamese responsibility; a general amnesty for political prisoners; Thieu''s offer to negotiate and a cease-fire on a date certain with a bombing pause the same day; a delegation of prominent Americans to Geneva. Before leaving for Wisconsin. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 226–28. Names: O''Brien, Johnson, Thieu.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:nguyen-van-thieu
- variant:
    id: cal.1968-03-26.elections-1968-2
    unit: B
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: on Tuesday, Mar. 26, in Washington, he is going to Wisconsin "tomorrow"; he leaves on the Wednesday, after his memorandum of Mar. 27; "my day there" ends with the rally in Milwaukee; then Springfield, and the Plaza in New York on Friday afternoon. Johnson: "You were there only one day"'
    at: 226–29
- cite:
    id: cal.1968-03-26.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 228–30 (the Milwaukee rally; Johnson''s headquarters dark, McCarthy''s busy; O''Brien to Johnson by telephone from the Plaza on Friday: "I think you are going to be badly defeated," "Sixty-forty ... Maybe two to one"; Johnson: "You were there only one day"; not the professionals'' reports)'
    units: '?'
- variant:
    id: cal.1968-03-30.elections-1968-3
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: the dinner at Toots Shor''s is "that evening," the Friday he reaches the Plaza, Mar. 29; he and his son, Breslin, then Unruh'
    at: '230'
- variant:
    id: cal.1968-03-30.elections-1968-3
    unit: E
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: "The next evening we again encountered Jesse. He apologized for his remarks and he joined Larry and me at the Plaza Hotel for a nightcap"'
    at: '231'
- cite:
    id: cal.1968-03-30.elections-1968-3
    item: '[[w.obrien-no-final-victories]], 230–31 (Toots Shor''s, O''Brien and his son, Breslin; Unruh, bitterly against the war, an early Kennedy booster: "By Christ, we''re going to knock Lyndon Johnson out of the box"; Unruh to the son, O''Brien''s rough reply, nose to nose; the apology the next evening; the day Friday on the page, see the variants)'
    units: B
- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-16
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: 'Washington, Sunday evening before Johnson''s address. Larry Temple of the White House staff telephones O''Brien: "The President wants you to know that at the end of his speech tonight he will announce that he will not be a candidate for re-election." O''Brien: "Gotcha!" and hangs up. He then doubts it as the speech runs half an hour without a mention. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 231. Names: Temple, O''Brien, Johnson.'
      tags:
      - name:temple-larry
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- cite:
    id: cal.1968-03-31.elections-1968-11
    item: '[[w.obrien-no-final-victories]], 232 (Robert Kennedy calls "a little before midnight": "I hope I got to you first"; "I hope you''ll join me"; "It''s a new ball game now"; Humphrey''s call is on the page of the next days, not the next morning)'
    units: '?'
- variant:
    id: cal.1968-03-31.elections-1968-11
    unit: C
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Humphrey, who had been in Mexico, telephones on Tuesday, Apr. 2, "later that day," after the leaders'' breakfast, probing O''Brien''s intentions'
    at: '234'
- add:
    entry:
      id: cal.1965-05.vietnam-congress
      when: May
      date: 1965-05
      thread: vietnam-congress
      c: At the President's request O'Brien's office telephones congressional offices to learn how the mail runs on Vietnam and on the intervention in the Dominican Republic. The mail is not heavy and tends to support the President, except in a few Eastern States. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 191. Check: the day (the work gives "in May 1965"). Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1966-02.vietnam-support
      when: Feb.
      date: 1966-02
      thread: vietnam-support
      c: 'New Jersey, a fund-raising dinner. O''Brien to Johnson, by memorandum: Governor Richard Hughes "made an excellent plea to support you on the Vietnam policy and this was received with obvious strong approval by the audience." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 191. Check: the day (the work gives "In February"). Names: O''Brien, Hughes, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:hughes-richard-j
      - name:johnson-lyndon-b
      - state:nj
- add:
    entry:
      id: cal.1966-06.vietnam-congress
      when: June
      date: 1966-06
      thread: vietnam-congress
      c: Johnson reads an article in the Scripps-Howard papers in which a number of Democratic congressmen criticize the war; he calls O'Brien and has his staff talk to all of them that very day and report what they say. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 192. Check: the day (the work gives "June 1966"). Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- cite:
    id: cal.1968-03-12.elections-1968
    item: '[[w.obrien-no-final-victories]], 221 (the Johnson people''s radio advertisements in the last days, implying a vote for McCarthy a vote for Hanoi; McCarthy wins more than 40 per cent, losing to Johnson by only a narrow margin; O''Brien "in no way involved" in the primary; not the Republican side or the totals)'
    units: '?'
- add:
    entry:
      id: cal.1966-06.vietnam-congress-2
      when: June
      date: 1966-06
      thread: vietnam-congress
      c: 'O''Brien to Johnson, a long memorandum on the Democratic congressmen critical of the war: most confused and concerned, wanting to support the President, but facing elections and constituents troubled by draft calls and casualties; "it is awfully important that we return every one of them we possibly can next January. ... The best procedure is for us to do what we have been doing—stay close to them." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 192–93. Check: the day (after the staff''s talks, [[cal.1966-06.vietnam-congress]]). Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- cite:
    id: cal.1967-08-21.vietnam-congress
    item: '[[w.obrien-no-final-victories]], 214 (O''Brien to Johnson, a memorandum of August reporting Pastore: "Our problem is Vietnam—boxes coming back, casualties going up. ... We are losing good Democrats in droves"; any Republican can do a better job; not the meeting, the survey or the count)'
    units: '?'
- cite:
    id: cal.1965-10-03.immigration
    item: '[[w.obrien-no-final-victories]], 184 (the President signs the immigration bill at the Statue of Liberty, flying to Liberty Island by helicopter; "the summer of 1965" on the page)'
    units: A
- variant:
    id: cal.1967-11-30.elections-1968
    unit: C
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: McCarthy announces he will challenge Johnson for the nomination "in the New Hampshire and other primaries"'
    at: '215'
- add:
    entry:
      id: cal.1968-02.robert-kennedy-campaign-decision-10
      when: Feb., end
      date: 1968-02
      thread: robert-kennedy-campaign-decision
      c: 'Robert Kennedy asks O''Brien his reaction to what McNamara said to him earlier the same day. O''Brien: impressed by McNamara''s concern about the war and his admiration for Kennedy, "But I don''t think anything McNamara said changes the political realities of the situation." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 217. Check: the day (the work says "later that day," a few days after the lunch of Feb. 26). See [[cal.1968-02.robert-kennedy]]. Names: Robert Kennedy, O''Brien, McNamara.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:mcnamara-robert-s
- cite:
    id: cal.1968-03-11.robert-kennedy-campaign
    item: '[[w.obrien-no-final-victories]], 218 (after consulting Robert Kennedy, Sorensen meets the President to propose a national commission to review Vietnam policy; Johnson rejects it; not the day, the place or the arrangement)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-05.elections-1968-johnson
      when: Mar. 5
      date: '1968-03-05'
      thread: elections-1968-johnson
      c: 'The White House legislative breakfast, the morning of Massachusetts''s filing day. Johnson takes O''Brien aside: "Larry, I want you to know how much I appreciated the offer you made earlier to stand in for me in Massachusetts. You stood solid with me and I''ll never forget it." O''Brien takes it that Johnson does not want him to run as his stand-in. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 220. Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
      - state:ma
- add:
    entry:
      id: cal.1968-03-09.robert-kennedy-campaign-decision
      when: Mar. 9
      date: '1968-03-09'
      thread: robert-kennedy-campaign-decision
      c: The Saturday before the New Hampshire primary. Robert Kennedy telephones O'Brien to discuss the ever-increasing pressures on him to run. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 221–22. Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
- cite:
    id: cal.1968-03.elections-1968-johnson-2
    item: '[[w.obrien-no-final-victories]], 221 (Boutin, who directed the Johnson effort in New Hampshire, calls O''Brien once to apologize for not keeping him posted: he had been under orders not to communicate with him; not the words)'
    units: '?'
- cite:
    id: cal.1968-03-20.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 224 (Wednesday the twentieth, O''Brien''s speech to the National Press Club, the part saying he supports Johnson; not the words)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-29.elections-1968-johnson-3
      when: Mar. 29
      date: '1968-03-29'
      thread: elections-1968-johnson
      c: 'New York, the Plaza Hotel. Johnson, on the telephone with O''Brien, has the operator get Rusk for him. Rusk: the President wants him to brief O''Brien on "some significant new developments on the war," too confidential for the telephone; can he come to Washington at once, before Rusk leaves on Saturday? O''Brien stays the weekend with his son; Katzenbach to brief him on his return. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 228–30 (Rusk''s calls of the evening before and the morning, in Springfield). Names: Johnson, Rusk, O''Brien, Katzenbach.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:obrien-lawrence-f
      - name:katzenbach-nicholas
      - state:ny
      - city:new-york
- variant:
    id: cal.1968-03-30.elections-1968-3
    unit: C
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Unruh to his son: "Why the hell aren''t you in the Army? If your father''s such a big supporter of the war, why aren''t you over there fighting?"'
    at: '230'
- check:
    id: cal.1968-03-30.elections-1968-3
    text: 'Check: the day: O''Brien, [[w.obrien-no-final-victories]], 229–30, has the dinner on Friday, Mar. 29, the evening Rusk asked him to come to Washington before leaving "the next day, Saturday" (Rusk left for Wellington Mar. 30: [[cal.1968-03-30.vietnam-2]]); Bernstein alone has Saturday.'
- cite:
    id: cal.1968-03-31.elections-1968-7
    item: '[[w.obrien-no-final-victories]], 231 (O''Brien back in Washington Sunday afternoon; "during a meeting at the White House" that afternoon Watson asks where he will be that evening; not the meeting''s business or the others there)'
    units: '?'
- variant:
    id: cal.1968-03-31.elections-1968-11
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: "Bob''s call came a little before midnight": "I hope you''ll join me"'
    at: '232'
- add:
    entry:
      id: cal.1968-04-01.elections-1968-johnson-4
      when: Apr. 1
      date: '1968-04-01'
      thread: elections-1968-johnson
      c: 'O''Brien to Johnson, a letter written at his office the morning after the withdrawal: "I am very proud of my President and of my association with you"; "my deep respect and admiration for the position you so courageously took last night"; "no American can question your sincerity of purpose." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 233. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- cite:
    id: cal.1968-04-02.congress
    item: '[[w.obrien-no-final-victories]], 233–34 (the regular Tuesday legislative breakfast: O''Brien asks why; Johnson: "I''m doing everything I humanly can do to bring peace ... So now I''ve done the one thing that proves it''s not politics ... I''ve gone the distance"; not the words of B or the tax bill)'
    units: A
- add:
    entry:
      id: cal.1968-04-04.robert-kennedy-campaign-decision
      when: Apr. 4
      date: '1968-04-04'
      thread: robert-kennedy-campaign-decision
      c: 'Lunch, Thursday. Edward Kennedy and O''Brien discuss frankly that some in the Kennedy camp, old associates and newer people, were not enamored of O''Brien for having stayed with Johnson after Dallas. Kennedy: O''Brien would be in charge and the others would have to live with it; he suggests a news conference to make the point. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 234. Check: the day (the work says "Thursday" after the Tuesday breakfast). Names: Edward Kennedy, O''Brien, Johnson.'
      tags:
      - name:kennedy-edward-m
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-04-04.robert-kennedy-campaign-decision-2
      when: Apr. 4
      date: '1968-04-04'
      thread: robert-kennedy-campaign-decision
      c: 'Robert Kennedy telephones O''Brien, after his lunch with Edward Kennedy, to confirm what Edward Kennedy said: the hour late, time short; he needs O''Brien aboard soon. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 234. Check: the day (the work: "later in the day" of the Thursday lunch). See [[cal.1968-04-04.robert-kennedy-campaign-decision]]. Names: Robert Kennedy, O''Brien, Edward Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1968-04-05.elections-1968-humphrey
      when: Apr. 5
      date: '1968-04-05'
      thread: elections-1968-humphrey
      c: 'Humphrey calls O''Brien: "I have three words for you: I need you." O''Brien says he will decide very soon; Humphrey asks to come to his office the next day, and O''Brien insists on going to him. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 234. Check: the day (the work says "Friday"). Names: Humphrey, O''Brien.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
- cite:
    id: cal.1968-04-06.elections-1968
    item: '[[w.obrien-no-final-victories]], 234–36 (Saturday, at Humphrey''s office, more than an hour: O''Brien will go with Robert Kennedy; Humphrey proposes that he, Kennedy and O''Brien stay in touch and meet midway in the struggle to avoid a bitter convention battle; O''Brien then telephones Kennedy, who is in complete agreement, in other words than the entry''s: see the variant; the page gives the day, the Saturday after Friday''s call)'
    units: A-B
- variant:
    id: cal.1968-04-06.elections-1968
    unit: C
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Kennedy, told by telephone, "was in complete agreement and mentioned his sincere affection for Hubert. He said, ''The worst thing about all this is that we''re in a fight with Hubert Humphrey. He''s a great guy.''"'
    at: '236'
- cite:
    id: cal.1968-04-10.transition-and-staff
    item: '[[w.obrien-no-final-victories]], 236 (Wednesday afternoon: Johnson reads O''Brien''s letter of resignation and asks "Are you going with Bob Kennedy?"; asks his advice on a successor, discusses Krim, then calls in Watson and names him Postmaster General; Johnson tells the press that day; not Abrams, Goodpaster or McCain)'
    units: '?'
- add:
    entry:
      id: cal.1968-04-10.robert-kennedy-campaign-3
      when: Apr. 10
      date: '1968-04-10'
      thread: robert-kennedy-campaign
      c: 'Washington, National Airport, between O''Brien''s resignation and his leaving the Post Office. Edward Kennedy, off the same flight, walks back from his car to O''Brien''s limousine: "Larry, we know you''ve made a hard decision. You''re giving up a lot. I want you to know we understand." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 237. Check: the day (the work: "during the final days between my resignation and my actual departure from government," a day or two before the farewell ceremony on the eve of Good Friday). See [[cal.1968-04-10.transition-and-staff]]. Names: Edward Kennedy, O''Brien.'
      tags:
      - name:kennedy-edward-m
      - name:obrien-lawrence-f
      - city:washington
- add:
    entry:
      id: cal.1968-04-11.transition-and-staff-2
      when: Apr. 11
      date: '1968-04-11'
      thread: transition-and-staff
      c: The Post Office Department auditorium. A farewell ceremony for O'Brien, with members of Congress and the Executive Branch; his farewell address; the Marine Band plays "Auld Lang Syne" and the audience sings. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 237. Check: the day (the work says "a day or two later" and the next day was Good Friday, Apr. 12). Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-04-12.robert-kennedy-campaign-primaries
      when: Apr. 12
      date: '1968-04-12'
      thread: robert-kennedy-campaign-primaries
      c: 'Indiana, Good Friday, the day after O''Brien leaves the Post Office: he takes up Robert Kennedy''s primary campaign, Ira Kapenstein with him from the Post Office. Edward Kennedy and Stephen Smith have set up the campaign organization already. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 237–38. Names: O''Brien, Robert Kennedy, Edward Kennedy, Smith.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
      - name:kennedy-edward-m
      - name:smith-stephen-e
      - state:in
- add:
    entry:
      id: cal.1968-04.robert-kennedy-campaign-primaries-6
      when: Apr.–May
      date: 1968-04
      thread: robert-kennedy-campaign-primaries
      c: 'Indiana. The workers and their families who line the streets of Gary and East Chicago for Robert Kennedy are enthusiastic. Two campaign decisions follow: he should go after the votes of workers and the ethnic groups, beyond his known strength, and present himself as a national candidate on pocketbook issues and crime, not a one-issue candidate or one at his party''s far left. In some speeches he stresses his law-enforcement record as Attorney General; some purists in the camp call it a sell-out. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 238. Check: the day (the work gives none: the Indiana campaign, Apr. 12 to May 7). Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - state:in
      - city:gary
      - city:east-chicago
- cite:
    id: cal.1968-05-07.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 238–39 (Kennedy 42 per cent, Branigin 31, McCarthy 27; Branigin "running as a favorite son, and in reality as a stand-in for Humphrey," not "pledged to Johnson''s cause"; not the District)'
    units: A, C
- add:
    entry:
      id: cal.1968-05-07.robert-kennedy-campaign-primaries-3
      when: May 7
      date: '1968-05-07'
      thread: robert-kennedy-campaign-primaries
      c: 'Indiana, primary night. O''Brien on a couch, tie open, waiting on the precinct figures; Kapenstein telephones for them: a Polish ward of South Bend, Kennedy 241, Branigin 62, McCarthy 86. Asked what next, O''Brien: "I go to Omaha tomorrow." Jimmy Breslin, with him, writes it in his column. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 239 (Breslin''s column, quoted). Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
      - state:in
- add:
    entry:
      id: cal.1968-04.elections-1968-humphrey
      when: Apr.–May
      date: 1968-04
      thread: elections-1968-humphrey
      c: 'Omaha, during the Indiana campaign: the hotel lobby, then the Vice President''s suite. Humphrey, in Omaha to address a party dinner, and O''Brien, on a quick trip to check on Nebraska, have a drink, an hour. Humphrey: his delegate support is doing well, but much of it less pro-Humphrey than anti-Kennedy; "My people in Indiana say you fellows ran a hell of a campaign there ... I''ll never make the mistake of underestimating a Kennedy campaign." O''Brien reminds him of the midpoint meeting with Robert Kennedy; still his intention. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 239–40. Check: the day (the work: "during the Indiana campaign," which ended May 7, before the Nebraska primary of May 14; Humphrey''s word of the Indiana campaign may put it after the vote, and his party dinner may be Omaha''s Jefferson–Jackson Day dinner of May 10). Names: O''Brien, Humphrey, Robert Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - name:kennedy-robert-f
      - state:ne
      - city:omaha
- cite:
    id: cal.1968-05-25.robert-kennedy-campaign-2
    item: '[[w.obrien-no-final-victories]], 241–42 (the weekend before the Oregon vote: O''Brien, Salinger, Edelman, Walinsky and Oregon people discuss McCarthy''s standing challenge to debate; O''Brien tends to favor it with reservations, some of the younger men opposed; Kennedy sends for O''Brien in his suite; Drew Pearson''s column on the King wiretap; decided no by default; the laughing aides)'
    units: '?'
- variant:
    id: cal.1968-05-25.robert-kennedy-campaign-2
    unit: B
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: "I tended to favor the idea, although with reservations. Some of the younger men ... were opposed"; Salinger takes the group''s conclusions to Kennedy, who then sends word for O''Brien to come'
    at: '241'
- cite:
    id: cal.1968-05-28.robert-kennedy-campaign-primaries-3
    item: '[[w.obrien-no-final-victories]], 242 (election night in Oregon: Kennedy goes first to Edith Green, saying the loss was his, not theirs; the telegram of congratulations to McCarthy argued for a half hour; Kennedy: "For Christ''s sake, we''ve lost the primary but we ought at least to be able to resolve this"; the entry''s words for the concession are not on the page)'
    units: '?'
- add:
    entry:
      id: cal.1968-05-27.robert-kennedy-campaign-primaries-3
      when: May 27
      date: '1968-05-27'
      thread: robert-kennedy-campaign-primaries
      c: 'Portland, Ore., the last night of the Oregon campaign. Kennedy''s rally in a high school gymnasium: perhaps 1,500 people. Back at the hotel reporters tell O''Brien McCarthy has packed 7,000 into a huge auditorium. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 242. Names: Robert Kennedy, O''Brien, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:mccarthy-eugene-j
      - state:or
      - city:portland
- add:
    entry:
      id: cal.1968-06-07.robert-kennedy-campaign
      when: June 7
      date: '1968-06-07'
      thread: robert-kennedy-campaign
      c: 'New York, the Waldorf-Astoria, the day before Robert Kennedy''s funeral. A Secret Service man hands O''Brien, back from St. Patrick''s Cathedral, a note: the Vice President would like him in his suite. O''Brien, Elva, Phyllis Maddock and Kapenstein go. Humphrey, depressed and shaken: "Men struggle for worthy goals," he says, "and yet they have no control over their own destinies. It all seems futile and pointless." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 245. Names: O''Brien, Humphrey, Robert Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - name:kennedy-robert-f
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1968-06-08.robert-kennedy-campaign-3
      when: June 8
      date: '1968-06-08'
      thread: robert-kennedy-campaign
      c: 'Robert Kennedy''s funeral train, New York to Washington. Many politicians aboard, and no political talk except Unruh''s remark to O''Brien: "Larry, we''ve got to get moving and get behind a candidate." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 245–46. Names: Robert Kennedy, Unruh, O''Brien.'
      tags:
      - name:unruh-jesse-m
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-06.elections-1968-humphrey
      when: June, mid-month
      date: 1968-06
      thread: elections-1968-humphrey
      c: O'Brien's home, Washington, about a week after Robert Kennedy's funeral. Humphrey keeps the talk from politics and invites O'Brien and his wife to his lake home at Waverly, Minn. As he leaves O'Brien tells him he wants no question about his feelings for Humphrey's candidacy as against McCarthy's or about his hope to see Humphrey the nominee. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 247. Check: the day (the work says "about a week after Bob''s funeral"). Names: Humphrey, O''Brien, McCarthy.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:mccarthy-eugene-j
      - city:washington
- add:
    entry:
      id: cal.1968-06.elections-1968-humphrey-2
      when: June, late
      date: 1968-06
      thread: elections-1968-humphrey
      c: Waverly, Minn., a weekend at Humphrey's lake home. Sunday evening in his kitchen he reviews his staff's weaknesses; Mondale and Harris, his co-chairmen, limited by their Senate duties; he wants O'Brien active in his campaign. O'Brien will think about it. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 247–48. Check: the day (the work: "the following weekend," after Humphrey''s call at O''Brien''s home about a week after the funeral). Names: Humphrey, O''Brien, Mondale, Harris.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:mondale-walter-f
      - name:harris-fred-r
      - state:mn
- add:
    entry:
      id: cal.1968-07.elections-1968-humphrey
      when: July
      date: 1968-07
      thread: elections-1968-humphrey
      c: 'Humphrey''s Capitol office, lunch with O''Brien on Vietnam. Humphrey reads him a statement he says he will soon make public, for a bombing halt and a negotiated end to the war; satisfied, O''Brien agrees to join his campaign through the Convention. Humphrey is to meet Johnson that evening: "I don''t think he''s going to hug me with joy." The statement does not appear. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 248–49. Check: the day (the work gives none). Names: Humphrey, O''Brien, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08.elections-1968-chicago-5
      when: Aug., after the 19th
      date: 1968-08
      thread: elections-1968-chicago
      c: 'Chicago, not long after O''Brien arrives on Aug. 19. Fred Harris and O''Brien call on Governor Connally of Texas, hostile over the challenge to his delegation and the peace plank: "If Humphrey thinks he''s got the nomination locked up, he''d better count the delegates again, because all hell will break loose if we''re kicked around. He''d better remember we in the South can deny him the nomination if we withdraw our support." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 250–51. Check: the day (the work: "not long after I arrived in Chicago on August 19"). Names: Harris, O''Brien, Connally, Humphrey.'
      tags:
      - name:harris-fred-r
      - name:obrien-lawrence-f
      - name:connally-john
      - name:humphrey-hubert-h
      - state:tx
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08.elections-1968-chicago-6
      when: Aug., after the 19th
      date: 1968-08
      thread: elections-1968-chicago
      c: Chicago, the day after their first call. Harris and O'Brien meet Connally again; he hints that if Humphrey is not careful Johnson's name will be entered in nomination. O'Brien takes it for a bluff, there having been no show of pro-Johnson feeling at the Convention. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 251. Check: the day (the work: "again the next day," after the call of [[cal.1968-08.elections-1968-chicago-5]]). Names: Harris, O''Brien, Connally, Johnson.'
