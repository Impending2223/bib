    item: '[[w.obrien-no-final-victories]], 265 (Humphrey 13 States and the District, 191 electoral votes; Nixon 32 States, 301; Wallace 5 States, 46; Ohio, California, Illinois and New Jersey lost by close margins, Texas carried; not the popular vote or the Congress)'
