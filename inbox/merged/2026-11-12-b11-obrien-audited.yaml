- cite:
    id: cal.1968-05-14.elections-1968
    item: '[[w.obrien-no-final-victories]], 240 (Nebraska: Kennedy 51 per cent, McCarthy 31, the Johnson–Humphrey slate 14; not the Republican side or West Virginia)'
    units: D
- cite:
    id: cal.1968-05-28.elections-1968
    item: '[[w.obrien-no-final-victories]], 242 (Oregon: the defeat, "the first election defeat a Kennedy had ever experienced"; Kennedy campaigning in California on the day of the voting and returning that evening; McCarthy''s organization the best of any of the primaries; not the Florida or Republican sides or the figures)'
    units: E
- cite:
    id: cal.1968-06-01.elections-1968
    item: '[[w.obrien-no-final-victories]], 243 (Kennedy accepts McCarthy''s challenge to debate, a decision O''Brien counts important after the Oregon loss; Kennedy works hard preparing and "we were all pleased with the outcome"; not the day or the hour)'
    units: '?'
- cite:
    id: cal.1968-06-05.robert-kennedy-2
    item: '[[w.obrien-no-final-victories]], 243–44 (O''Brien in a bungalow next to the Ambassador Hotel with Kapenstein, watching the last of Kennedy''s victory statement on television; room service answers: "Senator Kennedy''s been shot"; he spends the night watching reports; early in the morning calls Steve Smith at the hospital, who says there is little or no chance; not the hospital or the time)'
    units: '?'
