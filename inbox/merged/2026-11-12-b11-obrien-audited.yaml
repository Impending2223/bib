      date: 1968-05
      thread: robert-kennedy-campaign-primaries
      c: New York, three days of talks with party leaders ahead of the June 18 primary. O'Brien finds Robert Kennedy in a real fight in his own State, McCarthy popular and well organized there. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 244. Check: the days (the work says "mid-May"). Names: O''Brien, Robert Kennedy, McCarthy.'
      tags:
