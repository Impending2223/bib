      c: 'Eisenhower''s news conference. Asked whether the administration has misled the people on defense: "If anybody—anybody—believes that I have deliberately misled the American people, I''d like to tell him to his face what I think about him. This is a charge that I think is despicable." Symington had made it. His television talk before the South American tour, Sunday evening at 6:15: "such items as security and strength and so on would, of course, be included." His safety on the tour, after Nixon''s troubles: the Secret Service "have said no word to me about it"; "you just can''t worry about these things." The Vice-Presidential nominee: no reason for the contenders to abstain from primaries; the Presidential nominee must have "some say"; in 1952 he gave the Convention a list of men "completely acceptable to me." Cuban sugar: the Cuban people, "who are our friends," to be "treated justly." The Administration''s Sugar Act proposals: no provision aimed at Cuba; "not yet ready to go to the Congress." The farm message and Farm Belt votes: "I would hope that it would appeal to a lot of people and, therefore, get more votes; of course I do." Nixon: "never once that I know of has Mr. Nixon been at any major variance with me."'
      n: 'The President''s News Conference of February 17, 1960, [1960–61 Pub. Papers 189](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=241) (189–99: the talk, 189; the Vice-Presidential nominee, 190; Cuban sugar, 190–91; the farm message, 191; his safety, 192–93; Nixon, 195–96; the Sugar Act, 198; the defense answer, 198–99). [[w.kallina-kennedy-v-nixon]], 89 (Symington''s charge; the answer). [*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 2, 12, 17 ("Angry President Denies He Misled U. S. on Defenses," by Jack Raymond, at 1, 12: the defense answer, the question a reporter''s, citing charges of complacency and of economy standing in the way of weapons, not Symington''s; the talk; "Eisenhower Cool to Fight in Party on Second Place," by W. H. Lawrence, at 1, 17: the Vice-Presidential nominee and Nixon; the farm message, as "one hope" of it to win Farm Belt votes, not his words; "Capital Considers a Tougher Policy on Castro Regime," by James Reston, at 1, 2: Cuban sugar; "President Scoffs at Tour Dangers," by Felix Belair Jr., page not shown: his safety, his words as one "just can''t worry about such things"; the networks'' hour for the talk). To check: *New York Times*, [Feb. 20](https://timesmachine.nytimes.com/timesmachine/1960/02/20/issue.html), [Feb. 22](https://timesmachine.nytimes.com/timesmachine/1960/02/22/issue.html), and [Mar. 1, 1960](https://timesmachine.nytimes.com/timesmachine/1960/03/01/issue.html) (cited by [[w.kallina-kennedy-v-nixon]], 89 n.22). See [[cal.1960-01-26.defense]]. Names: Eisenhower, Symington, Nixon.'
