    entry:
      id: cal.1966-01-30.opinion-2
      when: Jan. 30
      date: '1966-01-30'
      thread: opinion
      c: 'The Harris Survey, the day before the bombing resumes: if the peace offensive fails "the vast majority of Americans
        would support an immediate escalation." All-out bombing of every part of the North if the Communists refuse to talk:
        favor 61 percent, oppose 17, not sure 22 (39 for more bombing before the pause). 500,000 troops "if that meant the
        war might be shortened": favor 60, oppose 25, not sure 15.'
      n: '[[w.gibbons-u-s-government-and]], IV, 167–68. To check: *Washington Post*, Jan. 31, 1966 (cited by [[w.gibbons-u-s-government-and]],
        IV, 167 n.158). Check: Gibbons: the question''s wording may have raised the troop figure; another poll of the time,
        45 percent. See [[cal.1966-01-03.opinion]].'
      src:
        c: 32aa4869
        rows:
        - 'w.gibbons-u-s-government-and IV, 167–68: all'
        - 'w.gibbons-u-s-government-and IV, 167 n: all'
        - 'via x.1966-01-31.washington-post-jan-31-1966: all'
