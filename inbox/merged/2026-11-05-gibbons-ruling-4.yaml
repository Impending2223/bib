      when: Aug.
      date: 1966-08
      thread: vietnam-macv
      c: 'Greene in South Vietnam argues with Westmoreland on how the war is fought: the tactics of attrition no more sensible
        than the strategy; an Army unit fights its way up a jungle ridge only to fight its way back down.'
      n: '[[w.gibbons-u-s-government-and]], IV, 200 (from Sheehan). To check: [[w.sheehan-bright-shining-lie]] (cited by [[w.gibbons-u-s-government-and]],
