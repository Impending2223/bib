      when: May
      date: 1966-05
      thread: vietnam-macv
      c: 'Krulak again with McNamara: the Marines'' program would take too many men and too much time. Krulak then sends him
        a long letter: "The raw figure of VC killed can be a dubious index of success since, if their killing is accompanied
        by devastation of friendly areas, we may end up having done more harm than good."'
      n: '[[w.gibbons-u-s-government-and]], IV, 199–200 (from Sheehan). To check: [[w.sheehan-bright-shining-lie]], 636 (cited
