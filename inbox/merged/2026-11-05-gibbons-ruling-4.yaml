      when: Mar. 29
      date: '1965-03-29'
      thread: students
      c: '209 of the Yale faculty to Johnson: stop the escalation, negotiate an end. "American opinion itself is too divided
        to sustain a long crisis in Vietnam, much less an enlargement of our participation in that war." Morse puts it in
        the Record Apr. 26, with Dahl''s letter.'
      n: '[111 Cong. Rec. 8449–50 (1965)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-12-2.pdf#page=57)
        (Senate, Apr. 26, 1965). [[w.gibbons-u-s-government-and]], III, 267 ("more than 200"). Names: Johnson, Morse.'
      src:
        c: 8ac17471
        rows:
