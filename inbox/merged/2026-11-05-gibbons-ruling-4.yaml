      date: '1965-07-11'
      thread: republican-party
      c: 'Nixon, in the *Washington Post*, takes Ford''s position: no coalition with the Communists; American air and sea
        power against the North; doubts of a large ground war.'
      n: '[[w.gibbons-u-s-government-and]], III, 306 n.84. To check: *Washington Post*, July 11, 1965 (cited by [[w.gibbons-u-s-government-and]],
        III, 306 n.84). Check: Gibbons says only "the same position as Ford"; the day of Nixon''s statement. See [[cal.1965-07-01.republican-party-congress]].
        Names: Nixon, Ford.'
