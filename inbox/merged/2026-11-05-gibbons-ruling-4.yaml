      when: Apr., mid-month
      date: 1966-04
      thread: vietnam
      c: 'For Ball''s review of the basic choices: Carver''s "Option A," for the status quo, which would fail if the government
        could not govern, and then disengagement "at less net political cost"; Unger''s "Course B-O," the optimistic case
        for going on toward a compromise. Undated.'
      n: '[[w.gibbons-u-s-government-and]], IV, 289–90. To check: Unger, "Course B-O," Apr. 1966 (cited by [[w.gibbons-u-s-government-and]],
        IV, 290 n.67). Check: the days. The review''s report: [[cal.1966-04-24.vietnam]]. Names: Ball, Carver, Unger.'
      src:
        c: 1509ca54
        rows:
        - 'w.gibbons-u-s-government-and IV, 289–90: all'
        - 'w.gibbons-u-s-government-and IV, 290 n: all'
        - 'via x.1966-04.unger-course-b-o-apr-1966: all'
      tags:
      - name:ball-george-w
      - name:carver-george-a-jr
      - name:unger-leonard
