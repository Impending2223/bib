      c: 'Gavin at the Pentagon at McNamara''s invitation, with Vance and Wheeler, on his views. By Gavin''s account McNamara
        is not sympathetic; Gavin: "You''re going to get murdered if you stay there. Your troops, you''ll have to keep reinforcing
