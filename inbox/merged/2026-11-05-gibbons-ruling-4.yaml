      date: '1965-07-25'
      thread: vietnam-congress
      also:
      - press-and-broadcasting
      c: 'Kenworthy in the *Times*: most of Congress still sees the commitment in Kennedy''s "limited and conditional terms."
        Three groups in the Senate: Morse and Gruening; Mansfield, Fulbright, Robert Kennedy, Javits and Aiken, temperate;
        Dirksen, Tower and Dodd, for the President. The large majority silent, Russell "most influential of them"; "an attitude
        of fatalism."'
