      id: cal.1965-05-05.vietnam-support
      when: May 5
      date: '1965-05-05'
      thread: vietnam-support
      c: 'Cooper to Valenti, "The American Friends of Vietnam Program": the AFV to lead a campus program and a broad public
        information program on Vietnam. The Budget Bureau says no government funds; Valenti asks Sidney Weinberg, a New York
        financier and a backer of Johnson''s, for help with money. State to send the AFV requests for speakers; the Army''s
        Historical Evaluation and Research Organization to help, free, with a monthly newsletter.'
      n: '[[w.gibbons-u-s-government-and]], III, 266. To check: Cooper to Valenti, "The American Friends of Vietnam Program,"
        May 5, 1965, C.F. ND 19/CO 312, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 266 n.124). Check: Gibbons
        spells it "Weinburg"; the newsletter''s planning, with Fishel, not dated on the page. Names: Cooper, Valenti, Fishel.'
      src:
