      id: cal.1965-04-23.students-2
      when: Apr. 23
      date: '1965-04-23'
      thread: students
      c: 'Rusk to the American Society of International Law, "The Control of Force in International Relations": "I continue
        to hear and see nonsense about the nature of the struggle there. I sometimes wonder at the gullibility of educated
        men and the stubborn disregard of plain facts by men who are supposed to be helping our young to learn—especially
        to learn how to think."'
      n: '[[w.department-of-state-bulletin]], [May 10, 1965, 694](https://archive.org/details/departmentofstat5265unit/page/694/mode/1up).
        [[w.gibbons-u-s-government-and]], III, 267 (to the faculty critics). Check: Gibbons quotes "talking nonsense." See
        [[cal.1965-03-29.students]]. Names: Rusk.'
