      c: 'The Cabinet, Rusk and McNamara reporting. Johnson leaves Rusk to the press: the record of four and a half years''
        efforts at a peaceful settlement; "we do not see at the present time active interest on the part of Hanoi and Peiping,
        active effort on the part of Moscow, to bring this matter to a peaceful conclusion."'
