      when: June 14
      date: '1965-06-14'
      thread: vietnam-congress
      also:
      - press-and-broadcasting
      c: 'Wicker in the *Times* on Congress: Democrats and some moderate Republicans troubled by Johnson''s efforts to stifle
        debate, his high-handedness and his reliance on a few advisers. Senators in foreign affairs see "''tension and strain''"
        in the President and are irritated "by his habit of lecturing them at length in private sessions"; one meeting four
        hours. Conservatives of both parties approve his course in Vietnam.'
      n: '[[w.gibbons-u-s-government-and]], III, 300. To check: *New York Times*, June 14, 1965 (cited by [[w.gibbons-u-s-government-and]],
        III, 300 n.65). Names: Wicker, Johnson.'
