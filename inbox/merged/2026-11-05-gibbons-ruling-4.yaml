    entry:
      id: cal.1965-07-07.vietnam-force-levels-2
      when: July 7
      date: '1965-07-07'
      thread: vietnam-force-levels
      c: 'Lodge, Ambassador-designate, to McGeorge Bundy, against a large deployment and against "seek-out-and-destroy": it
        might not win "a situation which is still essentially a political movement," would tie down troops, the climate the
        worst. For "coastal tactics": American troops in pitched battles, guarding the perimeters, holding Saigon if need
        be, occasional forays; the ARVN freed for the hamlets.'
      n: '[[w.gibbons-u-s-government-and]], IV, 43–44 (from Lodge''s summary in his memoir). To check: Lodge to McGeorge Bundy,
        July 7, 1965 (cited by [[w.gibbons-u-s-government-and]], IV, 43). Made public: [[w.gibbons-u-s-government-and]], IV
        (1994), from Lodge''s unpublished "Vietnam Memoir." Names: Lodge, McGeorge Bundy.'
      src:
        c: 836d39b1
        rows:
        - 'w.gibbons-u-s-government-and IV, 43–44: all'
        - 'via x.undated.lodge-unpublished-vietnam-memoir-pt-iv: all'
        - 'via x.1965-07-07.lodge-to-mcgeorge-bundy-july-7: all'
      tags:
      - name:lodge-henry-cabot
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-07-20.vietnam-july-decision
      when: July 20
      date: '1965-07-20'
      thread: vietnam-july-decision
      c: 'Lodge to Johnson, on McNamara''s report: concurs in its recommendations; strong points at the seaports, Đà Nẵng,
        Cam Ranh, Saigon; from them the Vietnamese pacify, an "oil spot procedure"; American troops to fight the pitched battle
        as the enemy attacks, but "not be committed to prolonged ''search sweeps'' in the jungle."'
      n: '[FRUS 1964–68, III: Vietnam, June–December 1965, doc. 66](https://history.state.gov/historicaldocuments/frus1964-68v03/d66).
        [[w.gibbons-u-s-government-and]], IV, 43. Made public: FRUS 1964–68, III (1996). See [[cal.1965-07-07.vietnam-force-levels-2]];
        [[cal.1965-07-20.vietnam]]. Names: Lodge, Johnson, McNamara.'
      src:
        c: e2db6a44
        rows:
