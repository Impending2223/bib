patch: 2026-11-05-gibbons-ruling-4
by: 'Claude (the Gibbons ruling: the Passed-over rows re-ruled under R18 as it stands, Gibbons, The U.S. Government and the
  Vietnam War, Parts I-IV; the follow-up run), Nov. 5, 2026'
