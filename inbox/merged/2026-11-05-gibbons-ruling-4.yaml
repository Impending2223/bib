      date: '1966-03-17'
      thread: vietnam-struggle
      c: 'Bùi Diễm, Kỳ''s assistant, to Habib, the embassy''s political officer: Thiệu and Kỳ weigh two plans against the
        Buddhists'' pressure, one a "Democracy" council. Trí Quang by telephone: Thiệu and Kỳ have promised Tâm Châu to announce
        on Mar. 18 a Constituent Assembly later in the year.'
      n: '[[w.gibbons-u-s-government-and]], IV, 272–73. Check: the cables'' numbers. See [[cal.1966-03-17.vietnam-struggle-2]].
        Names: Bùi Diễm, Habib, Nguyễn Văn Thiệu, Thích Trí Quang, Tâm Châu.'
