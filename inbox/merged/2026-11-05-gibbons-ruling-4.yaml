      when: May 14
      date: '1965-05-14'
      thread: vietnam-congress-foreign-relations
      c: 'Marcy to Fulbright, with Jones''s draft: the committee "has not been able to bring its majority view to bear on
        the President." Five courses: the letter, six to ten members perhaps signing; a Senate debate; public hearings; the
        chairmen of Foreign Relations and Armed Services made members of the NSC; a congressional committee on national security
        policy. Nothing known to come of them.'
      n: '[[w.gibbons-u-s-government-and]], III, 252. To check: Marcy to Fulbright, May 14, 1965, on Jones''s draft and five
        courses for the committee, RG 46, Marcy Chron File, National Archives (cited by [[w.gibbons-u-s-government-and]],
        III, 252 n.88). See [[cal.1965-05-13.vietnam-congress-foreign-relations]]. Names: Marcy, Fulbright, Jones.'
