      id: cal.1965-03.vietnam-congress-4
      when: Mar., late
      date: 1965-03
      thread: vietnam-congress
      c: 'Fulbright with Russell, at length: Vietnam "pretty damn dismal"; some honorable way out. Russell opposed intervention,
        but once committed the United States must use the force needed. Fulbright: a guerrilla war a great disadvantage; pressure
        on the North could bring war with China or a confrontation with Russia.'
      n: '[[w.gibbons-u-s-government-and]], III, 211 (from Coffin). To check: [[w.coffin-senator-fulbright]], 241–42 (cited
        by [[w.gibbons-u-s-government-and]], III, 211 n.185). Check: the day. Names: Fulbright, Russell.'
      src:
        c: cae85804
        rows:
        - 'w.gibbons-u-s-government-and III, 211: all'
      tags:
      - name:fulbright-j-william
      - name:russell-richard-b
