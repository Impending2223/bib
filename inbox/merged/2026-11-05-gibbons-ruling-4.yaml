      id: cal.1965-05-13.vietnam-congress-foreign-relations
      when: May 13
      date: '1965-05-13'
      thread: vietnam-congress-foreign-relations
      c: 'Norvill Jones, of the Foreign Relations staff, sends Marcy a draft letter for Fulbright to the President: the committee
        has resisted pressure for public hearings, but Johnson may not know "the deep, but silent, misgivings of a large number
        of Senators"; neither the Tonkin resolution nor the supplemental approves "in advance a widening of the war"; Congress
        to be asked for more authority before large numbers of troops go.'
      n: '[[w.gibbons-u-s-government-and]], III, 251–52. To check: Norvill Jones, draft letter for Fulbright to the President,
        sent to Marcy, May 13, 1965, RG 46, Marcy Chron File, National Archives (cited by [[w.gibbons-u-s-government-and]],
        III, 251 n.87). Names: Jones, Marcy, Fulbright.'
      src:
