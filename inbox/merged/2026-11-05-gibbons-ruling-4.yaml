      id: cal.1965-06-11.vietnam-supplemental
      when: June 11
      date: '1965-06-11'
      thread: vietnam-supplemental
      c: 'Meeker, State''s Legal Adviser, a memorandum of law: the appropriation of May "neither enlarged nor restricted the
        legal authority of the President to send combat troops to South Vietnam"; the vote "strong support" for the policy,
        with the expectation that a substantial change in the character of American actions would be preceded by the President''s
        going back to Congress "one way or another."'
      n: '[[w.gibbons-u-s-government-and]], III, 249 n.82. To check: Meeker, memorandum of law on the supplemental appropriation,
        June 11, 1965, NSF NSC History, Deployment of Forces, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III,
        249 n.82). Check: Gibbons prints "restric." Names: Meeker.'
      src:
