- add:
    entry:
      id: cal.1968-02-28.vietnam-congress
      when: Feb. 28
      date: '1968-02-28'
      thread: vietnam-congress
      c: 'Morse in the Senate, the second of his speeches on the Tonkin incidents, from the Foreign Relations staff''s draft
        report: the committees were not told in 1964 that the *Maddox* had been fitted as a "spy ship," nor of its orders
        to "stimulate" the North Vietnamese coastal radar. The longer speech "tomorrow."'
      n: '[114 Cong. Rec. 4578–81 (1968)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt4/pdf/GPO-CRECB-1968-pt4-3-2.pdf#page=95)
        (Senate, Feb. 28, 1968). [[w.gibbons-u-s-government-and]], II, 285 n.12 (the speeches chiefly the staff''s draft report).
        See [[cal.1968-02-21.vietnam-congress-2]]. Names: Morse.'
      src:
        c: 397c0c0d
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt4/pdf/GPO-CRECB-1968-pt4-3-2.pdf#page=95: all'
        - 'w.gibbons-u-s-government-and II, 285 n.12: A'
      tags:
      - name:morse-wayne
- add:
    entry:
      id: cal.1968-02-29.vietnam-congress
      when: Feb. 29
      date: '1968-02-29'
      thread: vietnam-congress
      c: 'Morse in the Senate, "The Tonkin Gulf Incident," the third speech, from the staff''s draft report: the events before
        Aug. 2, 1964, in order, then the two incidents "as seen through the logs and communications traffic." McNamara''s
        "routine patrol in international waters" not an accurate account of the *Maddox*''s mission.'
      n: '[114 Cong. Rec. 4691–97 (1968)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt4/pdf/GPO-CRECB-1968-pt4-4-1.pdf#page=55)
        (Senate, Feb. 29, 1968). [[w.gibbons-u-s-government-and]], II, 285 n.12 (the speeches chiefly the staff''s draft report).
        See [[cal.1968-02-21.vietnam-congress-2]]. Names: Morse, McNamara.'
      src:
        c: 9abed22a
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt4/pdf/GPO-CRECB-1968-pt4-4-1.pdf#page=55: all'
        - 'w.gibbons-u-s-government-and II, 285 n.12: A'
      tags:
      - name:morse-wayne
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-02-27.vietnam-force-levels
      when: Feb. 27
      date: '1965-02-27'
      thread: vietnam-force-levels
      also:
      - vietnam-air-war
      c: 'Wheeler to Sharp, JCS 736-65, 4:52 p.m., on the President''s meeting of the evening before: two battalion landing
        teams and a helicopter squadron of the 9th MEB ashore at Đà Nẵng, the third team deferred; photo reconnaissance of
        the southern North with Rolling Thunder IV. Policy: "Do everything possible to maximize our military efforts to reverse
        present unfavorable situation"; the strikes'' tempo up, short of "forcing ChiCom intervention"; "refrain from early
        negotiations."'
      n: '[FRUS 1964–68, II: Vietnam, January–June 1965, doc. 170](https://history.state.gov/historicaldocuments/frus1964-68v02/d170).
        [[w.gibbons-u-s-government-and]], III, 123 (Wheeler to Sharp and Westmoreland). Made public: FRUS 1964–68, II (1996).
        See [[cal.1965-02-26.vietnam]]. Names: Wheeler, Sharp.'
      src:
        c: d072d429
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d170: all'
        - 'w.gibbons-u-s-government-and III, 123: A, C-E'
        - 'via x.1965-02-27.jcs-0736-65-to-cincpac-feb: all'
      tags:
      - name:wheeler-earle
      - name:sharp-u-s-grant
      - name:johnson-lyndon-b
- edit:
    id: cal.1965-03-29.vietnam-force-levels
    base: 0ca20db6
    set:
      c: 'McNamara, Taylor and the Joint Chiefs: defended enclaves on the coast, decided tentatively, forces to move inland
        once a logistic base is sure. Taylor: the plan''s two American divisions and one Korean "seemed high"; Quát not persuaded
        more troops needed; limits in the country''s "absorptive capacity" and in logistics. McNamara for the deployment,
        so conditioned, the Korean division for "domestic reaction"; Rolling Thunder to be stepped up; the aerial mining of
        Haiphong to be looked at again, perhaps "4 to 12 weeks out ahead."'
      n: '[[w.marolda-united-states-navy-and]], 532 (the enclaves). [[w.gibbons-u-s-government-and]], III, 195 (the rest,
        from the report of the meeting). To check: Washington to Saigon 2131, Mar. 30, 1965 (Taylor to U. Alexis Johnson),
        NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 195 n.161). Names: McNamara,
        Taylor.'
      src:
        c: bb8baa09
        rows:
        - 'w.marolda-united-states-navy-and 532: A'
        - 'w.gibbons-u-s-government-and III, 195: B-E'
        - 'via x.1965-03-30.washington-to-saigon-2131-mar-30: B-E'
- add:
    entry:
      id: cal.1965-03-31.vietnam-force-levels-2
      when: Mar. 31
      date: '1965-03-31'
      thread: vietnam-force-levels
      c: 'Johnson with Taylor alone, 5:34 to 6:25 p.m. Bundy''s memorandum for it: Taylor''s three problems, the attack on
        the North, the American deployments, a political settlement; "prepared to go toward Hanoi faster than McNamara"; the
        two close on a coastal deployment of the Marine brigade''s remaining battalions and a Korean battle group; "in the
        long pull we need a McNaughton-type in Saigon."'
      n: '[FRUS 1964–68, II: Vietnam, January–June 1965, doc. 224](https://history.state.gov/historicaldocuments/frus1964-68v02/d224)
        (the memorandum). [[w.gibbons-u-s-government-and]], III, 195–96 (the meeting''s hours; no notes taken). Made public:
        FRUS 1964–68, II (1996). See [[cal.1965-03-29.vietnam-force-levels]]. Names: Johnson, Taylor, McGeorge Bundy, McNamara.'
      src:
        c: 1043670f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d224: B'
        - 'w.gibbons-u-s-government-and III, 195–96: all'
        - 'via x.1965-03-31.mcgeorge-bundy-to-johnson-your-meeting: B'
      tags:
      - name:johnson-lyndon-b
      - name:taylor-maxwell
      - name:bundy-mcgeorge
      - name:mcnamara-robert-s
