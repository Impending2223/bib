      when: Dec.
      date: 1965-12
      thread: vietnam-macv
      c: 'Harold Johnson in Vietnam with junior officers of the 1st Infantry Division: small units constantly moving and patrolling,
        rather than large-unit missions. He agrees with their philosophy but cannot support it: "we were not going to be able
        to respond to the public outcry in the United States about the casualties that might result."'
      n: '[[w.gibbons-u-s-government-and]], IV, 202. To check: [[w.krepinevich-army-and-vietnam]] (cited by [[w.gibbons-u-s-government-and]],
