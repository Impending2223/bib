      id: cal.1966-01-26.vietnam-pause-4
      when: Jan. 26
      date: '1966-01-26'
      thread: vietnam-pause
      c: 'Bundy to Johnson, 7:30 p.m., on his calls to McCloy and Lovett: both for prompt resumption and a prompt statement.
        Lovett, "a charter member of the Never Again Club," was against the pause; now for "a prompt and fairly massive air
        action in the North" and "a friendly blockade"; "keeping the pressure on is a kind of negotiation." McCloy: the pause
        good and useful, but no response.'
      n: '[FRUS 1964–68, IV: Vietnam, 1966, doc. 48](https://history.state.gov/historicaldocuments/frus1964-68v04/d48). [[w.gibbons-u-s-government-and]],
        IV, 161 (Lovett). To check: McGeorge Bundy''s handwritten notes of the talk with Lovett, McGeorge Bundy Papers, LBJ
        Library (cited by [[w.gibbons-u-s-government-and]], IV, 161 n.141). Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-26.vietnam-pause]].
        Names: McGeorge Bundy, Johnson, McCloy, Lovett.'
      src:
        c: 35ecd6ac
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d48: all'
