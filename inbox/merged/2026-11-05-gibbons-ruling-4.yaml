    entry:
      id: cal.1965-07-06.vietnam-diplomacy
      when: July 6
      date: '1965-07-06'
      thread: vietnam-diplomacy
      c: 'Rusk to Johnson, "Senator Morse''s Proposals for UN Action on Viet-Nam": no "remote possibility" of a UN peace force
        except in a settlement. Morse says Dobrynin, at dinner with Pearson, left an opening on a Security Council call for
        a Geneva conference; Dobrynin, July 3, denies it. With Stevenson: Stevenson to sound U Thant on a resolution for a
        conference of the Geneva powers, a Soviet abstention rather than a veto; a written report to the Council; readiness
        for a conference U Thant might call.'
      n: '[FRUS 1964–68, III: Vietnam, June–December 1965, doc. 52](https://history.state.gov/historicaldocuments/frus1964-68v03/d52).
        [[w.gibbons-u-s-government-and]], III, 315–17. Made public: FRUS 1964–68, III (1996). See [[cal.1965-06-29.vietnam-congress]];
        [[cal.1965-07-03.vietnam]]. Names: Rusk, Johnson, Morse, Dobrynin, Pearson, Stevenson, U Thant.'
      src:
