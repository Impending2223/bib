      when: Jan., late
      date: 1966-01
      thread: vietnam-supplemental
      also:
      - vietnam-congress-armed-services
      c: 'House Armed Services opens hearings on the military authorization of the supplemental, a few days after the Senate''s.
        Some 200,000 Communist troops in the South. Rivers: "This war is getting very unpopular the way we are conducting
        it. These sanctuaries ... Haiphong"; "The American people want this thing over yesterday." McNamara: "patience will
        be the key to success," a "long time," the objectives limited; he regrets the phrasing of October 1963. Wheeler: in
        1966 "substantial progress."'
      n: '[[w.gibbons-u-s-government-and]], IV, 172, 220–21. To check: House Comm. on Armed Services, *Hearings on Supplemental
        Authorization for Vietnam, Fiscal Year 1966*, 89th Cong., 2d Sess. (1966), 4903, 4952, 4977, 5008–10, 5167–68 (cited
        by [[w.gibbons-u-s-government-and]], IV, 172 n.4, 220 n.22, 221 nn.24–26). Check: the days. See [[cal.1966-01-20.vietnam-supplemental]].
        Names: Rivers, McNamara, Wheeler.'
      src:
        c: 9ffdce58
        rows:
