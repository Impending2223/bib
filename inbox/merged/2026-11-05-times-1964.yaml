      n: '[[w.mann-walls-of-jericho]], 390; [[w.kotz-judgment-days]], 110–11; [[w.whalen-longest-debate]], 119 (Johnson''s
        call to the Leadership Conference''s office; Rauh''s from a pay telephone: "What are you fellows doing about
        the Senate?"; Wilkins at 4:15). Check: Whalen, 119, has the call at 4 p.m., hours before the vote (the President''s
