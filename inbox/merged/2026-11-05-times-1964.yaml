      n: '[Johnson and Jackson, 8:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-albert-jackson-january-5-1964),
        Conversation WH6401-05-1183 (Miller Center); [Jan. 5, 11:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-albert-jackson-january-5-1964-0),
        Conversation WH6401-05-1186 (Miller Center). [[w.caro-passage-of-power]], 521–23. The Miller Center''s address
        for the first call reads "january-5"; its catalogue and PRDE''s date the call Jan. 4, 8:45 p.m. The hours
        the Ranch''s: PRDE places both calls at the LBJ Ranch. Names: Johnson.'
