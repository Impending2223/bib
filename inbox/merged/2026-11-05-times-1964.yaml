      n: '[[w.kotz-judgment-days]], 117; [[w.taking-charge]], 148. Check: [[w.taking-charge]], 147–48, has the call
        at 5:12 p.m., and prints "not going to get to cloture" and "persuade Dirksen why this is in the interest
        of the Republican party.". Check: the Miller Center''s catalogue times the call 5:12 p.m.; Kotz, 5:15. To
        check: [Johnson and Wilkins, 5:12 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-roy-wilkins-january-6-1964),
        Tape WH6401.06, PNO 8 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 117 n.10, 5:15 p.m.).
        Names: Johnson, Wilkins, Dirksen.'
