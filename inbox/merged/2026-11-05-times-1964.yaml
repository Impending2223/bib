    id: cal.1964-01-02.press-and-broadcasting
    base: 8a586687
    set:
      time: 1964-01-02T17:55Z
      n: '[Johnson and George Brown, 11:55 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-brown-january-2-1964),
        Conversation WH6401-03-1143 (Miller Center). [[w.caro-passage-of-power]], 525–27; [[w.taking-charge]], 139–143.
        The hour the Ranch''s: PRDE places the call at the LBJ Ranch. To check: Jones to Johnson, Jan. 3, 1964 (cited
        by [[w.caro-passage-of-power]], 527). See [[cal.1963-12-25.press-and-broadcasting]]. Names: Johnson, Albert
        Thomas.'
- edit:
