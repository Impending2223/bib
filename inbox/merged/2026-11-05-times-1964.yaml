    id: cal.1964-01-08.economy
    base: 012ff811
    set:
      time: 1964-01-08T20:25Z
      follows:
      - cal.1964-01-08.program
      n: '[Johnson and Byrd, 3:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-january-8-1964),
        Conversation WH6401-08-1247; [Johnson and Fowler, 5:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-henry-fowler-january-8-1964),
        Conversation WH6401-08-1254; [Johnson and Robert Anderson, 8:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-anderson-and-lady-bird-johnson-january),
        Conversation WH6401-10-1288 (Miller Center). [[w.zelizer-taxing-america]], 203–04; [[w.caro-passage-of-power]],
        553 (the call to Byrd); [[w.zelizer-fierce-urgency-of-now]], 81 (Byrd to Johnson: "That was an eloquent
        speech you made. You''ve made a good start."). After the address (the sources above). See [[cal.1964-01-08.program]];
        [[cal.1963-01-24.economy]]. Names: Johnson, Byrd, Fowler, Mills, Anderson, Byrnes, Eisenhower.'
