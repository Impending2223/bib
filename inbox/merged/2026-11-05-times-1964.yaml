- edit:
    id: cal.1964-01-08.program
    base: 3c14c8b5
    set:
      follows:
      - cal.1964-01-08.press-and-broadcasting
      n: 'Annual Message to the Congress on the State of the Union, [1963–64 Pub. Papers 112](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=196)
        (Jan. 8, 1964). [110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-2-2.pdf)
        (1964). Recording (K–J Adm. II.I). [[w.johnson-vantage-point]], 37, 75, 465 (the budget and the deficit
        halved, 37; the war on poverty, 75; enriched uranium, 465); [[w.kotz-judgment-days]], 88–89; [[w.zelizer-fierce-urgency-of-now]],
        79–80; [[w.bernstein-guns-or-butter]], 34, 36 (an administration "efficient, and honest and frugal"; tax
        policy at length); [[w.bernstein-guns-or-butter]], 97; [[w.bernstein-guns-or-butter]], 161 ("We must provide
        hospital insurance for our older citizens"); [[w.bernstein-guns-or-butter]], 252–53 ("What can you do for
        our country?"). [[w.dallek-flawed-giant]], 62. [[w.caro-passage-of-power]], 537–50 (the address, the war
        on poverty, civil rights). [[w.sundquist-politics-and-policy]], 52, 111 (the budget, $97.9 billion, 52;
        the war on poverty, 111). After the calls to Jones and Brown: [[w.caro-passage-of-power]], 527. To check:
        [[w.matusow-unraveling-of-america]]; [[w.gillette-launching-the-war-on]]; New York Times, Jan. 9, 1964 (cited
        by [[w.caro-passage-of-power]], 545). See [[cal.1963-01-14.program]]; [[cal.1963-11-27.succession]]. Names:
        Johnson. Check: the page.'
