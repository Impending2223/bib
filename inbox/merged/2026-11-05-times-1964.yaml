        "at the end of November.". After DeLoach''s word to Young, before the meeting: [[cal.1964-12-01.civil-rights-the-executive-2]].
        To check: Howell, "An Interview with Andrew Young," *Christianity and Crisis*, Feb. 16, 1976 (cited by [[w.schlesinger-robert-kennedy-and-his]],
        365 n.105b); [[w.garrow-fbi-and-martin-luther]], 129–30 (cited by [[w.branch-pillar-of-fire]], 534); [[w.garrow-bearing-the-cross]],
        362–64 (cited by [[w.branch-pillar-of-fire]], 534); [[w.deloach-hoovers-fbi]], 208–11 (cited by [[w.branch-pillar-of-fire]],
        534); Lewis, King, 256–57 (cited by [[w.branch-pillar-of-fire]], 534); Int. Andrew Young, Oct. 26, 1991
        (cited by [[w.branch-pillar-of-fire]], 534); Int. Cartha DeLoach, June 1, 1984 (cited by [[w.branch-pillar-of-fire]],
        534); Drew Pearson, "Meeting with Hoover Amazes King," WP, Dec. 5, 1964 (cited by [[w.branch-pillar-of-fire]],
        535). Made public: S. Rep. No. 94-755, Book III (1976). See [[cal.1964-11-18.civil-rights-the-executive]].
        Names: Martin Luther King, Hoover, Abernathy, Andrew Young, DeLoach.'
