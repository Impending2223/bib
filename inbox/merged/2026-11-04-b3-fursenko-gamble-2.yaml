      c: 'Khrushchev to Castro, a letter of twenty-seven pages dictated on his train home from East Germany: the crisis no
        failure; the missile decision explained, Kennedy''s talk with Adzhubei of January 1962 the one new element.'
      n: '[[w.fursenko-one-hell-of-a]], 325–26. To check: Khrushchev to Castro, Jan. 31, 1963, f. 3, op. 65, d. 915, APRF;
        a copy at the National Security Archive (cited by [[w.fursenko-one-hell-of-a]], 325 n.26). Names: Khrushchev, Castro.'
      tags:
