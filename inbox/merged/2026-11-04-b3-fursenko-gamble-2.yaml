- add:
    entry:
      id: cal.1960-09-02.cuba-2
      when: Sept. 2
      date: '1960-09-02'
      thread: cuba
      also:
      - latin-america
      c: 'Havana, the Plaza Cívica. Castro''s four-hour speech to a "General Assembly" of the Cuban people, his answer to
        San José, "only a Pyrrhic victory for imperialism": the Declaration of Havana, drafted by Carlos Rafael Rodríguez,
        approved by the crowd; more American firms to be nationalized if "economic aggression" continues; relations with the
        People''s Republic of China put to the crowd.'
      n: '[[w.fursenko-one-hell-of-a]], 56–59. To check: Havana to the Secretary of State, Sept. 2, 1960, 7:33 p.m., 9:42
        p.m. and 10:16 p.m., and Sept. 3, RG 59, 737.00, National Archives (cited by [[w.fursenko-one-hell-of-a]], 56 n.1,
        n.3, 58 n.10–14). See [[cal.1960-08-28.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 8b9eee61
        rows:
        - 'w.fursenko-one-hell-of-a 56–59: all'
        - 'via w.fursenko-one-hell-of-a 58 n.10: all'
- add:
    entry:
      id: cal.1960-09-02.cuba-3
      when: Sept. 2
      date: '1960-09-02'
      thread: cuba
      also:
      - soviet-union
      c: 'Alekseyev, by Moscow''s instructions, warns Castro privately of a plot to kill him at the night''s rally; reports
        it the same day, foreseeing a wave of terror. Sept. 7, the Center to Alekseyev: be more critical of his information.'
      n: '[[w.fursenko-one-hell-of-a]], 56–57, 63. To check: Alekseyev to Moscow, Sept. 2, 1960, file 86447, vol. 2, 65, SVR
        (cited by [[w.fursenko-one-hell-of-a]], 57 n.4, 63 n.27); Moscow to Alekseyev, Sept. 7, 1960, file 86447, vol. 2,
        80, SVR (cited by [[w.fursenko-one-hell-of-a]], 63 n.29). Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 0e985952
        rows:
        - 'w.fursenko-one-hell-of-a 56–57: A'
        - 'w.fursenko-one-hell-of-a 63: B'
        - 'via w.fursenko-one-hell-of-a 57 n.4: A'
        - 'via w.fursenko-one-hell-of-a 63 n.29: B'
- add:
    entry:
      id: cal.1960-09-04.cuba
      when: Sept. 4
      date: '1960-09-04'
      thread: cuba
      also:
      - soviet-union
      c: 'Carlos Rafael Rodríguez and Escalante to Alekseyev: the Declaration of Havana''s central theme Rodríguez''s; Castro
        has told members of the PSP that the time has come "to begin preparing public opinion for the construction of a socialist
        state."'
      n: '[[w.fursenko-one-hell-of-a]], 59. To check: Alekseyev to Moscow, Sept. 4, 1960, file 86447, vol. 2, 67–68, SVR (cited
        by [[w.fursenko-one-hell-of-a]], 59 n.16). See [[cal.1960-09-02.cuba-2]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 7ec137c4
        rows:
        - 'w.fursenko-one-hell-of-a 59: all'
        - 'via w.fursenko-one-hell-of-a 59 n.16: all'
