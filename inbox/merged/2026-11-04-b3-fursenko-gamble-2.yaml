      id: cal.1960-11-07.cuba-2
      when: Nov. 7
      date: '1960-11-07'
      thread: cuba
      also:
      - soviet-union
      c: Moscow. Guevara an honored guest atop the mausoleum for the anniversary of the revolution. During the visit he is
        said to have asked Khrushchev about Soviet missiles in Cuba; no Presidium decision in 1960.
      n: '[[w.fursenko-one-hell-of-a]], 70 (the probe: Alekseyev''s unpublished memoir for the KGB, unseen by the authors,
        70 n.54). Check: the probe. See [[cal.1960-10-22.cuba]]. Names: Guevara, Khrushchev.'
      tags:
      - name:guevara-ernesto
      - name:khrushchev-nikita-s
      src:
        c: d647ac14
        rows:
        - 'w.fursenko-one-hell-of-a 70: all'
        - 'via w.fursenko-one-hell-of-a 70 n.54: B'
- add:
    entry:
      id: cal.1960-11-08.cuba
      when: Nov. 8
      date: '1960-11-08'
      thread: cuba
      also:
      - soviet-union
      c: 'Havana, the offices of *Hoy*, from 4 a.m., five hours, after the Soviet Embassy''s reception: Castro to the PSP''s
        editors and printers, "I have been a Marxist from my student days"; "no other path for Cuba but the construction of
        socialism"; the PSP "the leading and unswerving force"; communists to hold "all of the key positions," in time; "Moscow
        is our brain and our great leader." He will spend three or four months in the Soviet Union once the threat subsides.
        Alekseyev''s report of Nov. 19 goes to Khrushchev, Mukhitdinov, Mikoyan, Suslov and Ponomarev.'
      n: '[[w.fursenko-one-hell-of-a]], 71–72. To check: Alekseyev, Havana, Nov. 19, 1960, file 86447, vol. 2, 315–17, SVR
        (cited by [[w.fursenko-one-hell-of-a]], 71 n.55–57, 72 n.58). Names: Castro, Khrushchev, Mikoyan, Suslov, Ponomarev.'
      tags:
      - name:castro-fidel
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:suslov-mikhail-a
      - name:ponomarev-boris-n
      src:
        c: a5ddf55b
        rows:
        - 'w.fursenko-one-hell-of-a 71–72: all'
        - 'via w.fursenko-one-hell-of-a 71 n.55: all'
