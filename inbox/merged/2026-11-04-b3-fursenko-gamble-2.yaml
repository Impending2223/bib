      when: Aug. 30
      date: '1962-08-30'
      thread: soviet-union
      also:
      - missile-crisis
      - defense
      c: A U-2 strays into Soviet airspace.
      n: '[[w.fursenko-one-hell-of-a]], 214. Check: where; the work gives no note. See [[cal.1962-09-10.missile-crisis]].'
      src:
