- check:
    id: cal.1960-03-14.cuba
    text: 'Check: Fursenko and Naftali date the Special Group''s meeting on the CIA''s draft plan Mar. 15 ([[w.fursenko-one-hell-of-a]],
      43, citing Jackson''s internal history of Dulles, vol. 3, 116).'
- add:
    entry:
      id: cal.1960-10-25.cuba
      when: Oct. 25
      date: '1960-10-25'
      thread: cuba
      also:
      - soviet-union
      - latin-america
      c: 'The General Assembly. Cuba''s delegation, García Inchaústegui, charges the United States with preparing an invasion
        that might set off a "conflagration of unsuspected proportions": exiles trained on American and Central American soil,
        the aircraft over Cuba of Sept. 29 dropping supplies to the guerrillas, the Masferrer landing; it foresees a staged
        attack on Guantanamo as the pretext. Zorin: "urgent measures to prevent military action against Cuba." Costa Rica,
        Haiti, Panama and Venezuela join the United States in holding up the charges.'
      n: '[[w.fursenko-one-hell-of-a]], 66. To check: Moscow to the State Department, Oct. 25, 1960, RG 59, 1960–63, 320-Cuba-Russia,
        National Archives (cited by [[w.fursenko-one-hell-of-a]], 66 n.42; the note prints 1950). See [[cal.1960-10-28.cuba]].'
      src:
        c: 050ed2ac
        rows:
        - 'w.fursenko-one-hell-of-a 66: all'
- add:
    entry:
      id: cal.1960-10-25.cuba-2
      when: Oct. 25
      date: '1960-10-25'
      thread: cuba
      c: Fidel and Raúl Castro seen in Las Villas, near the Escambray. Thousands of militiamen along the south coast from
        Pinar del Río to Camagüey; the Isle of Pines garrison reinforced; small craft on patrol. Press reports of three thousand
        arrested as "contacts" of the invaders.
      n: '[[w.fursenko-one-hell-of-a]], 67. To check: *New York Herald Tribune*, Oct. 26, 1960 (cited by [[w.fursenko-one-hell-of-a]],
        67 n.45). See [[cal.1960-10-28.cuba]]. Names: Castro, Raúl Castro.'
      tags:
      - name:castro-fidel
      - name:castro-raul
      src:
        c: d2532491
        rows:
        - 'w.fursenko-one-hell-of-a 67: all'
