- add:
    entry:
      id: cal.1962-05-29.missile-crisis
      when: May 29
      date: '1962-05-29'
      thread: missile-crisis
      also:
      - cuba
      - soviet-union
      c: Havana. The Soviet delegation, Rashidov and Biryuzov ("Engineer Petrov"), arrives; Alekseyev takes Raúl Castro aside;
        three hours later in Castro's office. Castro agrees an American attack likely; he will answer the Soviet proposal
        after talking with his inner circle. Raúl Castro takes notes.
      n: '[[w.fursenko-one-hell-of-a]], 186–87 (by Alekseyev''s account to the authors, 186 n.9–11). See [[cal.1962-05-24.missile-crisis]].
        Names: Raúl Castro, Castro.'
      tags:
      - name:castro-raul
      - name:castro-fidel
      src:
        c: 95510d2b
        rows:
        - 'w.fursenko-one-hell-of-a 186–87: all'
        - 'via w.fursenko-one-hell-of-a 186 n.9: all'
- add:
    entry:
      id: cal.1962-05-30.missile-crisis
      when: May 30
      date: '1962-05-30'
      thread: missile-crisis
      also:
      - cuba
      c: 'Fidel and Raúl Castro with Guevara, Dorticós and Valdés: Cuba will take the Soviet missiles. At his next meeting
        with Rashidov, Biryuzov and Alekseyev, Castro accepts, if put so as not to offend Cuban pride; Raúl Castro to Moscow
        in early July for the details.'
      n: '[[w.fursenko-one-hell-of-a]], 187 (the Soviets had no report of the talk). Check: the day of the answer. See [[cal.1962-05-29.missile-crisis]].
        Names: Castro, Raúl Castro, Guevara, Dorticós.'
      tags:
      - name:castro-fidel
      - name:castro-raul
      - name:guevara-ernesto
      - name:dorticos-torrado-osvaldo
      src:
        c: c1f69d05
        rows:
        - 'w.fursenko-one-hell-of-a 187: all'
- add:
    entry:
      id: cal.1962-06-01.soviet-union
      when: June 1
      date: '1962-06-01'
      thread: soviet-union
      c: Novocherkassk. Workers at an electrical plant strike against the new prices of May 31; Khrushchev orders in the army
        of the North Caucasus Military District and the local militia, with tanks and armored carriers.
      n: '[[w.fursenko-one-hell-of-a]], 186. See [[cal.1962-05-31.soviet-union]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 24065f09
        rows:
        - 'w.fursenko-one-hell-of-a 186: all'
