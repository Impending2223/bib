      when: Apr. 11
      date: '1961-04-11'
      thread: cuba
      also:
      - soviet-union
      - cuba-bay-of-pigs
      c: 'The Presidium on Cuba. Khrushchev and his colleagues discount the Cuban warnings: the summit in Vienna in view,
        no firm evidence of an American plan.'
      n: '[[w.fursenko-one-hell-of-a]], 90. To check: extract from the protocol of the Presidium, Apr. 11, 1961, f. 3, op.
        65, d. 901, 8, APRF (cited by [[w.fursenko-one-hell-of-a]], 90 n.53). See [[cal.1961-04-07.cuba-4]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 5e80adf4
        rows:
        - 'w.fursenko-one-hell-of-a 90: all'
        - 'via w.fursenko-one-hell-of-a 90 n.53: all'
- add:
    entry:
      id: cal.1961-04-08.cuba-bay-of-pigs
      when: Apr. 8
      date: '1961-04-08'
      thread: cuba-bay-of-pigs
      also:
      - soviet-union
      c: 'The KGB''s New York station to the Center: Varona, of the government in exile, negotiating an intervention for Apr.
        10–11, 3,500 men to hold a part of the island for a provisional government; the United States has accepted his plans
        but refused transport planes and submarines, and promised money. The report does not reach Khrushchev''s desk.'
      n: '[[w.fursenko-one-hell-of-a]], 91. To check: New York to the Center, Apr. 8, 1961, file 88631, vol. 3, 154, SVR (cited
        by [[w.fursenko-one-hell-of-a]], 91 n.58).'
      src:
        c: dedf1e88
        rows:
        - 'w.fursenko-one-hell-of-a 91: all'
        - 'via w.fursenko-one-hell-of-a 91 n.58: all'
- add:
    entry:
      id: cal.1961-04-14.cuba-3
      when: Apr. 14
      date: '1961-04-14'
      thread: cuba
      also:
      - soviet-union
      - cuba-bay-of-pigs
      c: 'Havana. Blas Roca to Kudryavtsev: he and Castro talked the night before of Khrushchev''s words to Thompson of Apr.
        1, which Kudryavtsev had passed to Castro; Castro "satisfied," taking them and Kennedy''s assurance of Apr. 12 for
        a deterrent that has worked again.'
      n: '[[w.fursenko-one-hell-of-a]], 91–92. To check: memorandum of the meeting with Blas Roca of Apr. 14, 1961, Apr. 28,
        1961, Kudryavtsev''s notebook, f. 5, op. 50, d. 335, 32–33, CC Secretariat archive, TsKhSD (cited by [[w.fursenko-one-hell-of-a]],
        92 n.59). See [[cal.1961-04-01.soviet-union]]; [[cal.1961-04-12.cuba]]. Names: Castro, Khrushchev, Thompson, Kennedy.'
      tags:
      - name:castro-fidel
      - name:khrushchev-nikita-s
      - name:thompson-llewellyn-e
      - name:kennedy-john-f
      src:
        c: 84c1e64e
        rows:
        - 'w.fursenko-one-hell-of-a 91–92: all'
        - 'via w.fursenko-one-hell-of-a 92 n.59: all'
