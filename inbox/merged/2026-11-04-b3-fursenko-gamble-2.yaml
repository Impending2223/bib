      also:
      - soviet-union
      c: Prague. Raúl Castro arrives, met at the airport by David, the Czechoslovak Foreign Minister.
      n: '[[w.fursenko-one-hell-of-a]], 50. To check: Kuba Req 47/2, Krabice 1, 1960, Czech Foreign Ministry archives (cited
