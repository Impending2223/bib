      when: Nov. 4
      date: '1961-11-04'
      thread: cuba
      also:
      - soviet-union
      - intelligence
      c: 'Alekseyev to Moscow: Ramiro Valdés, head of Cuban security, complains of the Soviet and East European intelligence
        services'' work in Cuba.'
      n: '[[w.fursenko-one-hell-of-a]], 141. To check: Alekseyev to Moscow, Nov. 4, 1961, file 88631, vol. 4, 47, SVR (cited
        by [[w.fursenko-one-hell-of-a]], 141 n.42).'
      src:
        c: 5b9067cf
        rows:
        - 'w.fursenko-one-hell-of-a 141: all'
