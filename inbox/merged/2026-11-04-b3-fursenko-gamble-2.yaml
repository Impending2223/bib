- add:
    entry:
      id: cal.1960-06.cuba-2
      when: June, late
      date: 1960-06
      thread: cuba
      also:
      - soviet-union
      c: 'Moscow. Mikoyan to Núñez Jiménez: thirty "topnotch" tanks and 100,000 automatic rifles, given outright.'
      n: '[[w.fursenko-one-hell-of-a]], 55. Check: the day. Names: Mikoyan.'
      tags:
      - name:mikoyan-anastas
      src:
        c: b09c3d00
        rows:
