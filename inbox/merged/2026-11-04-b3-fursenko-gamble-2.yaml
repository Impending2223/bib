        - 'via w.fursenko-one-hell-of-a 350 n.42: all'
- add:
    entry:
      id: cal.1964-02-11.soviet-union
      when: Feb. 11
      date: '1964-02-11'
      thread: soviet-union
      c: 'Semichastny to Gromyko: the election will make Johnson hold to Kennedy''s popular foreign policy while avoiding
        charges of "appeasing" the Soviet Union; no settlement of the outstanding issues before November, but no crisis. Segni,
        after seeing Johnson, expects a peace-through-strength policy like Eisenhower''s.'
      n: '[[w.fursenko-one-hell-of-a]], 352. To check: Semichastny to Gromyko, Feb. 11, 1964, file 90486, SVR (cited by [[w.fursenko-one-hell-of-a]],
        352 n.50). Names: Gromyko, Johnson, Kennedy.'
      tags:
      - name:gromyko-andrei
      - name:johnson-lyndon-b
      - name:kennedy-john-f
      src:
        c: 6c646c4b
        rows:
        - 'w.fursenko-one-hell-of-a 352: all'
        - 'via w.fursenko-one-hell-of-a 352 n.50: all'
