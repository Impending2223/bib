      when: Apr. 3
      date: '1962-04-03'
      thread: cuba
      also:
      - soviet-union
      - china
      c: 'Moscow. Escalante''s report to the Central Committee on his fall: "in the final analysis" Castro''s anger came of
        rising Chinese influence among Cuba''s leaders and opposition within the PSP to Moscow''s line on revolution.'
      n: '[[w.fursenko-one-hell-of-a]], 169. See [[cal.1962-03.cuba-2]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: b21f2426
        rows:
        - 'w.fursenko-one-hell-of-a 169: all'
- add:
    entry:
      id: cal.1962-04-11.cuba
      when: Apr. 11
      date: '1962-04-11'
      thread: cuba
      also:
      - soviet-union
      c: '*Pravda*: the Central Committee''s long account of the Escalante affair, backing Castro''s charge of "sectarianism."
        The same day Semichastny to the Central Committee: "no reason to speak of the danger of serious Chinese influence
        on Fidel Castro."'
      n: '[[w.fursenko-one-hell-of-a]], 169. To check: Semichastny to the CC, Apr. 11, 1962, file 88497, vol. 1, 61–68, SVR
        (cited by [[w.fursenko-one-hell-of-a]], 169 n.13). See [[cal.1962-04-03.cuba]]; [[cal.1962-04-12.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 11eed15b
        rows:
        - 'w.fursenko-one-hell-of-a 169: all'
        - 'via w.fursenko-one-hell-of-a 169 n.13: B'
- add:
    entry:
      id: cal.1962-04-27.cuba
      when: Apr. 27
      date: '1962-04-27'
      thread: cuba
      also:
      - soviet-union
      c: 'A telegram to Alekseyev in Havana: "You must immediately return to Moscow." At Castro''s urging he asks to stay
        for May Day, forty-one parties marching; the instructions changed: fly out May 2.'
      n: '[[w.fursenko-one-hell-of-a]], 172–73 (by Alekseyev''s interviews with the authors, 172 n.20). Check: the day ("Around
        April 27"). Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 856c3fc4
        rows:
        - 'w.fursenko-one-hell-of-a 172–73: all'
- add:
    entry:
      id: cal.1962-05-07.cuba
      when: May 7
      date: '1962-05-07'
      thread: cuba
      also:
      - soviet-union
      c: 'Moscow. Alekseyev, called to Kozlov''s office, is told by Shelepin, with Andropov, "The decision has already been
        made"; outside Khrushchev''s office Mikoyan to Gromyko: "so this is our new ambassador to Cuba." Then with Khrushchev.'
      n: '[[w.fursenko-one-hell-of-a]], 173–74 (by Alekseyev''s account). See [[cal.1962-05-11.cuba]]. Names: Kozlov, Shelepin,
        Mikoyan, Gromyko, Khrushchev.'
      tags:
      - name:kozlov-frol-r
      - name:shelepin-alexandr-n
      - name:mikoyan-anastas
      - name:gromyko-andrei
      - name:khrushchev-nikita-s
      src:
        c: 4bbe5b74
        rows:
        - 'w.fursenko-one-hell-of-a 173–74: all'
        - 'via w.fursenko-one-hell-of-a 173 n.20: all'
- add:
    entry:
      id: cal.1962-05-06.cuba
      when: May 6
      date: '1962-05-06'
      thread: cuba
      also:
      - soviet-union
      c: A Soviet military delegation arrives in Havana. Its General N. I. Gusev dies of a heart attack swimming in the Caribbean,
        his first day there.
      n: '[[w.fursenko-one-hell-of-a]], 178. To check: Malinovsky to the CC, May 7, 1962, f. 3, op. 65, d. 873, 12, APRF (cited
        by [[w.fursenko-one-hell-of-a]], 178 n.36).'
      src:
        c: 165ee641
        rows:
        - 'w.fursenko-one-hell-of-a 178: all'
        - 'via w.fursenko-one-hell-of-a 178 n.36: all'
- add:
    entry:
      id: cal.1962-05-18.cuba
      when: May 18
      date: '1962-05-18'
      thread: cuba
      also:
      - soviet-union
      c: 'Castro to a group of Soviet military representatives: three Sopka shore batteries, not one; "not fewer than 10,000"
        Soviet troops, one for each of the three likely landing regions (the plan of May 11 gives one regiment, 2,500 men);
        "I cannot support the request of our military for an increase in the number of units."'
      n: '[[w.fursenko-one-hell-of-a]], 178–79. To check: GRU (Col. Meshcheriakov) to Malinovsky, May 20, 1962, f. 3, op.
        65, d. 872, 45–47, APRF (cited by [[w.fursenko-one-hell-of-a]], 179 n.37). See [[cal.1962-05-11.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: c49ebaae
        rows:
        - 'w.fursenko-one-hell-of-a 178–79: all'
        - 'via w.fursenko-one-hell-of-a 179 n.37: all'
