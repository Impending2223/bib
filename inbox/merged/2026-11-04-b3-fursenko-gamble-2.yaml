    entry:
      id: cal.1961-08-16.latin-america
      when: Aug. 16
      date: '1961-08-16'
      thread: latin-america
      also:
      - cuba
      c: Punta del Este. Guevara, to the Inter-American Economic and Social Council, tells of the foiled attempt to kill Castro
        on July 26.
      n: '[[w.fursenko-one-hell-of-a]], 142. See [[cal.1961-07-19.cuba]]. Names: Guevara, Castro.'
      tags:
      - name:guevara-ernesto
      - name:castro-fidel
      src:
        c: 0e558b07
        rows:
        - 'w.fursenko-one-hell-of-a 142: all'
- add:
    entry:
      id: cal.1961-09-20.cuba-2
      when: Sept. 20
      date: '1961-09-20'
      thread: cuba
      also:
      - soviet-union
      c: 'Alekseyev to Moscow: from "a reliable person in the July 26 Organization in Miami," a new intervention in Cuba between
        September and December 1961; "in recent months, many reports have either closely or directly supported this information."
        It does not move Khrushchev to put the arms package to the Presidium.'
      n: '[[w.fursenko-one-hell-of-a]], 140. To check: Alekseyev to Moscow, Sept. 20, 1961, file 88631, vol. 3, 457, SVR (cited
        by [[w.fursenko-one-hell-of-a]], 140 n.36). See [[cal.1961-09-20.cuba]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 99f809ff
        rows:
        - 'w.fursenko-one-hell-of-a 140: all'
        - 'via w.fursenko-one-hell-of-a 140 n.36: all'
