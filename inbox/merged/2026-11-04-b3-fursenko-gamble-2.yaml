- add:
    entry:
      id: cal.1962-02-21.cuba
      when: Feb. 21
      date: '1962-02-21'
      thread: cuba
      also:
      - soviet-union
      c: 'Semichastny, the new chairman of the KGB, to Gromyko and Malinovsky: "military specialists of the USA had revised
        an operational plan against Cuba, which, according to this information, is supported by President Kennedy"; the land
        forces to "be supported by military air assets based in Florida and Texas."'
      n: '[[w.fursenko-one-hell-of-a]], 150. To check: Semichastny to Gromyko and Malinovsky, Feb. 21, 1962, SVR (cited by
        [[w.fursenko-one-hell-of-a]], 150 n.9). See [[cal.1962-02-22.cuba]]. Names: Gromyko, Malinovsky, Kennedy.'
      tags:
      - name:gromyko-andrei
      - name:malinovsky-rodion-yakovlevich
      - name:kennedy-john-f
      src:
        c: 4d09acac
        rows:
        - 'w.fursenko-one-hell-of-a 150: all'
        - 'via w.fursenko-one-hell-of-a 150 n.9: all'
- add:
    entry:
      id: cal.1962-03-08.cuba
      when: Mar. 8
      date: '1962-03-08'
      thread: cuba
      also:
      - soviet-union
      c: 'Malinovsky and Zakharov to the Central Committee: the arms sent Cuba, more than $250 million worth, listed; a draft
        resolution to speed the delivery of what has been promised.'
      n: '[[w.fursenko-one-hell-of-a]], 158–59. To check: Malinovsky and Zakharov to the CC, Mar. 8, 1962, f. 3, op. 65, d.
        872, 180, APRF (cited by [[w.fursenko-one-hell-of-a]], 159 n.33). Names: Malinovsky, Zakharov.'
      tags:
      - name:malinovsky-rodion-yakovlevich
      - name:zakharov-matvei-vasileevich
      src:
        c: eaaad8b1
        rows:
        - 'w.fursenko-one-hell-of-a 158–59: all'
        - 'via w.fursenko-one-hell-of-a 159 n.33: all'
- add:
    entry:
      id: cal.1962-03-15.cuba
      when: Mar. 15
      date: '1962-03-15'
      thread: cuba
      also:
      - soviet-union
      - intelligence
      c: 'Feklisov, the KGB''s resident in Washington, in two cables: Kennedy not apt to approve an invasion, which would
        undermine the Alliance for Progress; his sources, without exception, think an American intervention unlikely. YAR:
        no military operation before the November elections.'
      n: '[[w.fursenko-one-hell-of-a]], 160. To check: Feklisov''s cables of Mar. 15, 1962, SVR (cited by [[w.fursenko-one-hell-of-a]],
        160 n.38). Names: Feklisov, Kennedy.'
      tags:
      - name:feklisov-aleksandr
      - name:kennedy-john-f
      src:
        c: b24be3c6
        rows:
        - 'w.fursenko-one-hell-of-a 160: all'
        - 'via w.fursenko-one-hell-of-a 160 n.38: all'
- add:
    entry:
      id: cal.1962-03-21.cuba
      when: Mar. 21
      date: '1962-03-21'
      thread: cuba
      also:
      - soviet-union
      - intelligence
      c: 'The KGB''s First Chief Directorate, Sakharovsky, "U.S. Policy toward Cuba": one aim of the American activity to
        "strengthen counterrevolutionary groups to incite an uprising throughout the entire country in the event of a new
        intervention."'
      n: '[[w.fursenko-one-hell-of-a]], 159. To check: Sakharovsky, "O Politikye SshA V Otnoshenii Kuby," Mar. 21, 1962, file
        88497, vol. 1, 318–35, SVR (cited by [[w.fursenko-one-hell-of-a]], 159 n.35; a version of Mar. 16, n.45).'
      src:
        c: b7ec637f
        rows:
        - 'w.fursenko-one-hell-of-a 159: all'
        - 'via w.fursenko-one-hell-of-a 159 n.35: all'
- add:
    entry:
      id: cal.1962-03-29.cuba-2
      when: Mar. 29
      date: '1962-03-29'
      thread: cuba
      also:
      - soviet-union
      c: 'The Center to Alekseyev: read the KGB''s study of American policy toward Cuba and pass it to Castro.'
      n: '[[w.fursenko-one-hell-of-a]], 160. To check: instructions, the Center to "Oleg" (Alekseyev), Mar. 29, 1962, file
        88631, 244–45, SVR (cited by [[w.fursenko-one-hell-of-a]], 160 n.37). See [[cal.1962-03-21.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 46bd704a
        rows:
        - 'w.fursenko-one-hell-of-a 160: all'
        - 'via w.fursenko-one-hell-of-a 160 n.37: all'
- add:
    entry:
      id: cal.1962-03.cuba-2
      when: Mar., mid-month
      date: 1962-03
      thread: cuba
      also:
      - soviet-union
      c: 'Castro widens the ORI''s leadership with men of the noncommunist left, then, behind closed doors, rails at Escalante
        for the divisions in the movement: he took the chief decisions himself. Escalante refuses the blame; at the next meeting,
        contrite.'
      n: '[[w.fursenko-one-hell-of-a]], 163–64 (by the KGB''s report and Escalante''s statement to Soviet officials, 163 n.46).
        Check: the days.'
      src:
        c: 568f4196
        rows:
        - 'w.fursenko-one-hell-of-a 163–64: all'
- add:
    entry:
      id: cal.1962-03-20.cuba
      when: Mar. 20
      date: '1962-03-20'
      thread: cuba
      c: The ORI votes to remove Escalante as its secretary.
      n: '[[w.fursenko-one-hell-of-a]], 164. See [[cal.1962-03.cuba-2]].'
      src:
        c: 88b1a993
        rows:
        - 'w.fursenko-one-hell-of-a 164: all'
- add:
    entry:
      id: cal.1962-03-21.cuba-2
      when: Mar. 21
      date: '1962-03-21'
      thread: cuba
      c: Castro on the air denounces "sectarianism," Escalante its personification.
      n: '[[w.fursenko-one-hell-of-a]], 164 ("the following day"). Check: the day. See [[cal.1962-03.cuba-2]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 3fdbd967
        rows:
        - 'w.fursenko-one-hell-of-a 164: all'
- add:
    entry:
      id: cal.1962-03.cuba-3
      when: Mar., late
      date: 1962-03
      thread: cuba
      also:
      - soviet-union
      c: Escalante, through Aragonés and his brother, asks Castro's leave to go into exile in the Soviet Union; Castro agrees.
        A few days later he flies to Moscow.
      n: '[[w.fursenko-one-hell-of-a]], 164–65. Check: the day. See [[cal.1962-03.cuba-2]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 25f87dfc
        rows:
        - 'w.fursenko-one-hell-of-a 164–65: all'
- add:
    entry:
      id: cal.1962-03.cuba-4
      when: Mar.
      date: 1962-03
      thread: cuba
      also:
      - soviet-union
      - latin-america
      c: 'Valdés, the Interior Minister, in Moscow: for the Cuban leadership, a Soviet intelligence center in Cuba to give
        "active support to revolutionary movements in the countries of Latin America"; Castro thinks the time ripe for an
        offensive. Back in Havana, told by Alekseyev it would give Washington a pretext: "Cuba is already accused of all sorts
        of sins."'
      n: '[[w.fursenko-one-hell-of-a]], 168–69 (by the KGB''s account). To check: N. Zakharov to the CC, on the Cuban leadership
        and the national liberation movement in Latin America, SVR (cited by [[w.fursenko-one-hell-of-a]], 168 n.5); Semichastny
        to the CC, Apr. 4, 1962, file 88497, vol. 1, SVR (cited by [[w.fursenko-one-hell-of-a]], 169 n.7, n.11). Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 25c22171
        rows:
        - 'w.fursenko-one-hell-of-a 168–69: all'
        - 'via w.fursenko-one-hell-of-a 169 n.7: all'
- add:
    entry:
