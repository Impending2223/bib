      when: Nov. 23
      date: '1963-11-23'
      thread: assassination
      also:
      - cuba
      c: 'Castro, in public: "[W]ho benefits from the assassination ... except the worst reactionaries?" Oswald''s act could
        raise "anti-Soviet, anti-Cuban hysteria."'
      n: '[[w.fursenko-one-hell-of-a]], 342. To check: CIA, current intelligence memorandum, "Fidel Castro''s Speech," Nov.
        25, 1963, CMC/NSA (cited by [[w.fursenko-one-hell-of-a]], 342 n.11). Names: Castro, Oswald.'
