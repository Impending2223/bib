      when: Aug. 30
      date: '1962-08-30'
      thread: cuba
      also:
      - defense
      c: A Cuban trawler fires on an American reconnaissance plane, without effect. Kennedy has Gilpatric review the rules
        of engagement.
      n: '[[w.fursenko-one-hell-of-a]], 205. To check: Kaysen''s memorandum of Sept. 1, 1962 (cited by [[w.fursenko-one-hell-of-a]],
        205 n.31). Names: Kennedy, Gilpatric.'
      tags:
      - name:kennedy-john-f
