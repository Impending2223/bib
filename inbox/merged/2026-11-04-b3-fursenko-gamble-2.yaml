      when: May 12
      date: '1961-05-12'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Khrushchev to Kennedy, by letter: "the international atmosphere has recently become somewhat heated in connection
        with the well-known events relating to Cuba"; a good time for a general exchange of views.'
      n: '[[w.fursenko-one-hell-of-a]], 116. To check: Khrushchev to Kennedy, May 12, 1961 (cited by [[w.fursenko-one-hell-of-a]],
        116 n.41). Names: Khrushchev, Kennedy.'
