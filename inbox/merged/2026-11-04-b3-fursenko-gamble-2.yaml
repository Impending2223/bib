      when: Oct. 27
      date: '1960-10-27'
      thread: cuba
      c: The Cuban armed forces on their highest alert, for the American-backed attack expected.
      n: '[[w.fursenko-one-hell-of-a]], 67. See [[cal.1960-10-28.cuba]].'
      src:
        c: 4110debe
        rows:
        - 'w.fursenko-one-hell-of-a 67: all'
- add:
    entry:
      id: cal.1960-10-28.cuba-2
      when: Oct. 28
      date: '1960-10-28'
      thread: cuba
      also:
      - latin-america
      c: 'State''s circular to all its Latin American posts: decry Cuba''s "false charges" with local political figures. The
        OAS representative has called them a "smokescreen to cover arms procurement and military preparations in Cuba," the
        first public American word of bloc arms for Cuba.'
      n: '[[w.fursenko-one-hell-of-a]], 66, 68–69. To check: State Department circular, Oct. 28, 1960, RG 59, 611.37, National
        Archives (cited by [[w.fursenko-one-hell-of-a]], 66 n.43). Check: the day of the OAS statement. See [[cal.1960-10-25.cuba]].'
      src:
        c: 2e46f4c5
        rows:
        - 'w.fursenko-one-hell-of-a 66: all'
        - 'via w.fursenko-one-hell-of-a 66 n.43: A'
- add:
    entry:
      id: cal.1960-10-28.cuba-3
      when: Oct. 28
      date: '1960-10-28'
      thread: cuba
      also:
      - soviet-union
      c: 'The KGB passes Khrushchev, Mikoyan, Suslov and Gromyko Alekseyev''s report of Cuba''s intelligence from Mexico on
        Guatemala. The Kremlin decides to restate the nuclear threat; the same day it sends Castro, through Alekseyev, a copy
        of a State circular got in Buenos Aires: breaking relations with Cuba "not reasonable now."'
      n: '[[w.fursenko-one-hell-of-a]], 68–69. To check: Alekseyev to Moscow, Oct. 28, 1960, file 86447, vol. 2, 284, SVR
        (cited by [[w.fursenko-one-hell-of-a]], 68 n.48); Moscow to Alekseyev, Oct. 25, 1960, file 86447, vol. 2, 273, SVR
        (cited by [[w.fursenko-one-hell-of-a]], 69 n.49). See [[cal.1960-10-28.cuba]]. Names: Khrushchev, Mikoyan, Suslov,
        Gromyko, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:suslov-mikhail-a
      - name:gromyko-andrei
      - name:castro-fidel
      src:
        c: 6add42b7
        rows:
        - 'w.fursenko-one-hell-of-a 68–69: all'
        - 'via w.fursenko-one-hell-of-a 68 n.48: A'
        - 'via w.fursenko-one-hell-of-a 69 n.49: B'
- add:
    entry:
      id: cal.1960-10-29.cuba
      when: Oct. 29
      date: '1960-10-29'
      thread: cuba
      also:
      - soviet-union
      c: 'Castro, back in Havana, to Alekseyev: the Guatemalan communists report a thousand émigrés moved to Puerto Barrios;
        an invasion force of six thousand had been expected Oct. 28; "the reports are reliable." He mobilizes the capital''s
        militia.'
      n: '[[w.fursenko-one-hell-of-a]], 69 (fewer than five hundred Cubans in training in Guatemala). To check: Alekseyev
        to Moscow, Oct. 29, 1960, file 86447, vol. 2, 285, SVR (cited by [[w.fursenko-one-hell-of-a]], 69 n.50). See [[cal.1960-10-28.cuba]].
        Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: c74aa96e
        rows:
        - 'w.fursenko-one-hell-of-a 69: all'
        - 'via w.fursenko-one-hell-of-a 69 n.50: all'
- add:
    entry:
      id: cal.1960-10-31.cuba-bay-of-pigs
      when: Oct. 31
      date: '1960-10-31'
      thread: cuba-bay-of-pigs
      c: 'CIA headquarters to its people in Guatemala: ready to plan an invasion. Not over 60 men for infiltration teams;
        an assault force of one or more battalions of about 600, to seize and defend a lodgement by amphibious and airborne
        assault; conventional training; Army Special Forces cadres under study.'
      n: '[[w.fursenko-one-hell-of-a]], 69–70 ("tentative approval" from the agency''s superiors). To check: cable of Oct.
        31, 1960, Annex 4, NSF, box 61A, JFK Library, as cited by Gleijeses, "Ships in the Night," 27 J. Latin Am. Stud. (cited
        by [[w.fursenko-one-hell-of-a]], 69 n.51). See [[cal.1960-11-04.cuba]].'
      src:
        c: 3a9c227d
        rows:
        - 'w.fursenko-one-hell-of-a 69–70: all'
        - 'via w.fursenko-one-hell-of-a 69 n.51: all'
- add:
    entry:
