      when: Apr. 16
      date: '1961-04-16'
      thread: cuba
      also:
      - cuba-bay-of-pigs
      c: Castro tells the Cuban people and the world that the revolution is socialist.
      n: '[[w.fursenko-one-hell-of-a]], 99. Check: the speech and its words; the work gives no note. See [[cal.1961-04-15.cuba]].
        Names: Castro.'
      tags:
