      thread: cuba
      c: The Cuban government announces the expropriation of 382 companies and all Cuban and foreign banks but the Canadian.
      n: '[[w.fursenko-one-hell-of-a]], 61 ("Two days later"). To check: *New York Times*, Oct. 15, 1960 (cited by [[w.fursenko-one-hell-of-a]],
