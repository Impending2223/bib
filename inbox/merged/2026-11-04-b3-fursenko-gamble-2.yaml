      when: May 6
      date: '1961-05-06'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'State to Thompson, for Gromyko: the President has no intention of backing out of a summit but is not sure all can
        be ready by early June; a decision before Khrushchev returns from Central Asia on May 20.'
      n: '[[w.fursenko-one-hell-of-a]], 106. To check: Secretary of State to Moscow, May 6, 1961, RG 59, 611.61, National
        Archives (cited by [[w.fursenko-one-hell-of-a]], 106 n.12). See [[cal.1961-05-04.soviet-union]]. Names: Thompson,
        Gromyko, Kennedy, Khrushchev.'
      tags:
