      when: July 17
      date: '1962-07-17'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-jupiters
      - soviet-union
      c: 'Semichastny to Gromyko: seventeen Jupiter intermediate-range missiles in Turkey.'
      n: '[[w.fursenko-one-hell-of-a]], 195. To check: Semichastny to Gromyko, July 17, 1962, file 90782, vol. 2, 14–15, SVR
        (cited by [[w.fursenko-one-hell-of-a]], 195 n.55). Names: Gromyko.'
      tags:
