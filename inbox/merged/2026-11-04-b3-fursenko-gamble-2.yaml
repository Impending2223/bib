- add:
    entry:
      id: cal.1962-11-15.missile-crisis-3
      when: Nov. 15
      date: '1962-11-15'
      thread: missile-crisis
      also:
      - cuba
      - soviet-union
      c: 'Castro at an antiaircraft battery outside Havana: from Saturday or Sunday the order to fire again on American warplanes;
        twenty to thirty low-level flights a day over Cuba. That night with Mikoyan, told of the talks with Robert Kennedy
        on the Il-28s, he tells of his order and his letter to U Thant. Mikoyan: "Why did you not tell me about this letter
        before sending it to U Thant?" Castro will not reverse the order.'
      n: '[[w.fursenko-one-hell-of-a]], 304–5. To check: Mikoyan to Khrushchev, Nov. 17, 1962, f. 3, op. 65, d. 911, 100–103,
        126–35, APRF (cited by [[w.fursenko-one-hell-of-a]], 304–5 n.61–68). See [[cal.1962-11-16.soviet-union]]. Names: Castro,
        Mikoyan, Robert Kennedy.'
      tags:
      - name:castro-fidel
      - name:mikoyan-anastas
      - name:kennedy-robert-f
      src:
        c: df0280a4
        rows:
        - 'w.fursenko-one-hell-of-a 304–5: all'
        - 'via w.fursenko-one-hell-of-a 305 n.66: all'
- add:
