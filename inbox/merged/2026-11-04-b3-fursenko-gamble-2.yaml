- add:
    entry:
      id: cal.1961-04-29.berlin-and-vienna
      when: Apr. 29
      date: '1961-04-29'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - robert-kennedy
      c: 'Holeman of the *Daily News* asks Bolshakov of the GRU, at the Soviet Embassy, to meet Robert Kennedy. The GRU''s
        chief in Washington: "Menshikov maybe; but Bolshakov?"'
      n: '[[w.fursenko-one-hell-of-a]], 112. To check: Holeman''s interview with the authors, Aug. 6, 1995; the GRU''s record
        of Bolshakov''s meetings (cited by [[w.fursenko-one-hell-of-a]], 112 n.29). Names: Bolshakov, Robert Kennedy.'
      tags:
      - name:bolshakov-georgi
