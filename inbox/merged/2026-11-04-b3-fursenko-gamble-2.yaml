      when: Feb. 24
      date: '1961-02-24'
      thread: soviet-union
      c: Rusk sends Kennedy, at his request of Feb. 18, the memoranda of Eisenhower's talks with Khrushchev of 1959. Kennedy
        reads in them a clever, quick, stubborn Khrushchev and a colorless Eisenhower.
      n: '[[w.fursenko-one-hell-of-a]], 106. To check: Secretary of State to the President, Feb. 24, 1961, RG 59, 611.61,
        National Archives (cited by [[w.fursenko-one-hell-of-a]], 106 n.13). Names: Rusk, Kennedy, Eisenhower, Khrushchev.'
      tags:
