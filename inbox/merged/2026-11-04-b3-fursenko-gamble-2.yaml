      id: cal.1961-12-17.cuba
      when: Dec. 17
      date: '1961-12-17'
      thread: cuba
      also:
      - soviet-union
      c: 'Castro and Dorticós to Alekseyev: their concern over "the expected U.S. aggression against Cuba"; they will not
        appeal to Moscow "along official lines." No new Soviet weapons have reached Cuba since the agreement of Sept. 20.'
      n: '[[w.fursenko-one-hell-of-a]], 146. To check: Alekseyev to Moscow, Dec. 20 and 21, 1961, file 86447, vol. 4, 87,
        SVR (cited by [[w.fursenko-one-hell-of-a]], 146 n.43, n.45). See [[cal.1961-09-20.cuba]]. Names: Castro, Dorticós.'
      tags:
      - name:castro-fidel
      - name:dorticos-torrado-osvaldo
      src:
        c: 4a9ad82d
        rows:
        - 'w.fursenko-one-hell-of-a 146: all'
        - 'via w.fursenko-one-hell-of-a 146 n.43: all'
