      when: Oct. 22
      date: '1960-10-22'
      thread: cuba
      also:
      - soviet-union
      - china
      c: Guevara leaves for Prague, Moscow and Peking, to anchor Cuba's requests for aid in the invasion crisis.
      n: '[[w.fursenko-one-hell-of-a]], 70. Names: Guevara.'
      tags:
      - name:guevara-ernesto
