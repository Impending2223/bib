      when: Oct. 12
      date: '1960-10-12'
      thread: cuba
      also:
      - soviet-union
      c: 'Alekseyev to Moscow: the Cubans have told the Soviets of their draft law for "partial nationalization of all foreign
        and Cuban banks and several American enterprises"; "all main branches of industry will be in the hands of the government."'
      n: '[[w.fursenko-one-hell-of-a]], 61. To check: Alekseyev to Moscow, Oct. 12, 1960, file 86447, vol. 2, 220, SVR (cited
        by [[w.fursenko-one-hell-of-a]], 61 n.25).'
      src:
        c: a9f577ea
        rows:
