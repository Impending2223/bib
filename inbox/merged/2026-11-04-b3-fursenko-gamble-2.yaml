patch: b3-fursenko-gamble-2
by: 'Claude (batch 3 reading, group soviet: Fursenko and Naftali, "One Hell of a Gamble"), Nov. 4, 2026'
ops:
- add:
    entry:
      id: cal.1960-01.cuba
      when: Jan.
      date: 1960-01
      thread: cuba
      also:
      - soviet-union
      c: 'Mexico City. Emilio Aragonés, Guevara''s military aide, at the Soviet Embassy: a purge of the July 26 movement''s
        noncommunists, Marcelo Fernández and Faustino Pérez, to come; a new party, the Revolutionary Union, the whole left
        under Castro; a radical agrarian reform; the banks nationalized.'
      n: '[[w.fursenko-one-hell-of-a]], 35. To check: Havana to the Center, Apr. 12, 1960, file 78825, 227, SVR, on Leonov''s
        talk with Aragonés in January (cited by [[w.fursenko-one-hell-of-a]], 35 n.1). Names: Guevara, Castro.'
      tags:
      - name:guevara-ernesto
      - name:castro-fidel
      src:
        c: 71c1d938
        rows:
        - 'w.fursenko-one-hell-of-a 35: all'
        - 'via w.fursenko-one-hell-of-a 35 n.1: all'
- add:
    entry:
      id: cal.1960-01-09.cuba
      when: Jan. 9
      date: '1960-01-09'
      thread: cuba
      also:
      - soviet-union
      c: 'The KGB in Mexico City to the Center: Castro''s relations with the PSP "improving"; his position on imperialism
        "becoming stronger every day."'
      n: '[[w.fursenko-one-hell-of-a]], 36. To check: Mexico City to the Center, Jan. 9, 1960, file 78825, 52–54, SVR (cited
        by [[w.fursenko-one-hell-of-a]], 36 n.5). Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 3e588182
        rows:
        - 'w.fursenko-one-hell-of-a 36: all'
        - 'via w.fursenko-one-hell-of-a 36 n.5: all'
- add:
    entry:
      id: cal.1960-01.cuba-2
      when: Jan.
      date: 1960-01
      thread: cuba
      also:
      - soviet-union
      c: 'Castro, through Carlos Rafael Rodríguez, to the Soviets: a shift in Cuba''s foreign policy possible if done "very
        carefully"; relations with Czechoslovakia first, then Moscow.'
      n: '[[w.fursenko-one-hell-of-a]], 36. Check: the day; the work gives no note for the message. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 89681ffe
        rows:
        - 'w.fursenko-one-hell-of-a 36: all'
- add:
    entry:
      id: cal.1960-01-20.cuba-3
      when: Jan. 20
      date: '1960-01-20'
      thread: cuba
      also:
      - soviet-union
      c: The Presidium approves a covert operation devised in Prague to deliver Czech rifles to Cuba secretly.
      n: '[[w.fursenko-one-hell-of-a]], 36 ("a month later" than the warning of mid-December). To check: Protocol 260, Jan.
        20, 1960, f. 3, op. 5, d. 871, 25, APRF (cited by [[w.fursenko-one-hell-of-a]], 36 n.8).'
      src:
        c: b1e4e96c
        rows:
        - 'w.fursenko-one-hell-of-a 36: all'
        - 'via w.fursenko-one-hell-of-a 36 n.8: all'
- add:
    entry:
      id: cal.1960-01-20.cuba-4
      when: Jan. 20
      date: '1960-01-20'
      thread: cuba
      also:
      - soviet-union
      c: 'Shelepin to Mikoyan: by the Central Committee''s order, a KGB officer from Mexico City to arrange the security of
        Mikoyan''s visit with the Cubans. Raúl Castro meets him and puts Ramiro Valdés, head of the Interior Ministry''s intelligence
        and counterintelligence, in charge: a guarded house for Mikoyan, two cars, the plane''s radio free for traffic with
        Moscow.'
      n: '[[w.fursenko-one-hell-of-a]], 36–37. To check: Shelepin to Mikoyan, Jan. 20, 1960, file 82761, 158–59, SVR (cited
        by [[w.fursenko-one-hell-of-a]], 36 n.9, 37 n.10). Names: Shelepin, Mikoyan, Raúl Castro.'
      tags:
      - name:shelepin-alexandr-n
      - name:mikoyan-anastas
      - name:castro-raul
      src:
        c: 0b2c3f25
        rows:
        - 'w.fursenko-one-hell-of-a 36–37: all'
        - 'via w.fursenko-one-hell-of-a 36 n.9: all'
- add:
    entry:
      id: cal.1960-01-27.cuba
      when: Jan. 27
      date: '1960-01-27'
      thread: cuba
      also:
      - soviet-union
      c: 'Alekseyev, through the KGB in Mexico City, to Moscow: Jesús Soto, of Raúl Castro''s following, in control of the
        Cuban labor movement, David Salvador out; Castro has removed Marcelo Fernández from the direction of the July 26 movement,
        his successor "closely linked to Friends."'
      n: '[[w.fursenko-one-hell-of-a]], 36. To check: Alekseyev to Moscow, Jan. 27, 1960, file 86447, vol. 1, SVR (cited by
        [[w.fursenko-one-hell-of-a]], 36 n.3, n.4). Names: Raúl Castro, Castro.'
      tags:
      - name:castro-raul
      - name:castro-fidel
      src:
        c: 05aee5ce
        rows:
        - 'w.fursenko-one-hell-of-a 36: all'
        - 'via w.fursenko-one-hell-of-a 36 n.3: all'
- add:
    entry:
      id: cal.1960-01.cuba-3
      when: Jan., end
      date: 1960-01
      thread: cuba
      also:
      - soviet-union
      c: Castro ready to invite Mikoyan again, the Soviet exhibition with him.
      n: '[[w.fursenko-one-hell-of-a]], 36 ("By the end of January"). Check: the day, and whether announced or told to the
        Soviets. Names: Castro, Mikoyan.'
      tags:
      - name:castro-fidel
      - name:mikoyan-anastas
      src:
        c: 5491c3d6
        rows:
        - 'w.fursenko-one-hell-of-a 36: all'
- add:
    entry:
      id: cal.1960-02-10.cuba
      when: Feb. 10
      date: '1960-02-10'
      thread: cuba
      also:
      - soviet-union
      c: 'Alekseyev to Moscow: Guevara, at his home, a few days after Castro''s dinner of Feb. 3, says Cuba will ask Mikoyan
        for an enormous credit, $500 million the opening bid (Castro and Alekseyev had spoken of $100 million in November);
        the Kremlin may announce it. "It is very important for Cuba to feel independent of the U.S. and to demonstrate it."
        Shown to Mikoyan.'
      n: '[[w.fursenko-one-hell-of-a]], 38. To check: Alekseyev to Moscow, Feb. 10, 1960, file 78825, 113, SVR (cited by [[w.fursenko-one-hell-of-a]],
        38 n.17). See [[cal.1960-02-04.cuba]]. Names: Guevara, Castro, Mikoyan.'
      tags:
      - name:guevara-ernesto
      - name:castro-fidel
      - name:mikoyan-anastas
      src:
        c: 67d5a62d
        rows:
        - 'w.fursenko-one-hell-of-a 38: all'
        - 'via w.fursenko-one-hell-of-a 38 n.17: all'
- add:
    entry:
      id: cal.1960-03-03.cuba
      when: Mar. 3
      date: '1960-03-03'
      thread: cuba
      also:
      - soviet-union
      c: 'Guevara to Alekseyev: might the Soviet Union "offer assistance in the case of extreme circumstances."'
      n: '[[w.fursenko-one-hell-of-a]], 42 ("The day before La Coubre blew up"). To check: Alekseyev to Moscow, Mar. 8, 1960,
        SVR (cited by [[w.fursenko-one-hell-of-a]], 42 n.29). Names: Guevara.'
      tags:
      - name:guevara-ernesto
      src:
        c: 53164bf3
        rows:
        - 'w.fursenko-one-hell-of-a 42: all'
        - 'via w.fursenko-one-hell-of-a 42 n.29: all'
- add:
    entry:
      id: cal.1960-03-03.cuba-2
      when: Mar. 3
      date: '1960-03-03'
      thread: cuba
      c: 'Havana. Braddock, the chargé, to Bonsal at State: the embassy ill equipped for the report on Communist influence
        Washington keeps asking for. "Not only does Washington appear to be better staffed to do the job, but it also has
        experts who are better qualified than any of us here to distinguish between manifestations of Communism and manifestations
        of nationalism."'
      n: '[[w.fursenko-one-hell-of-a]], 43. To check: Braddock to Bonsal, Mar. 3, 1960, RG 59, Cuba 1960, 350.21, National
        Archives (cited by [[w.fursenko-one-hell-of-a]], 43 n.31). Names: Bonsal.'
      tags:
      - name:bonsal-philip-w
      src:
        c: cbe541ad
        rows:
        - 'w.fursenko-one-hell-of-a 43: all'
        - 'via w.fursenko-one-hell-of-a 43 n.31: all'
- add:
    entry:
      id: cal.1960-03-15.cuba
      when: Mar. 15
      date: '1960-03-15'
      thread: cuba
      also:
      - soviet-union
      c: 'Castro to Alekseyev: INRA, under Núñez Jiménez, to carry out a "step-by-step elimination of property," gradually;
        soon to control the whole press; "in a few years, INRA will be the government."'
      n: '[[w.fursenko-one-hell-of-a]], 42–43. Check: the work gives no note for the talk. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 8a866e2e
        rows:
        - 'w.fursenko-one-hell-of-a 42–43: all'
- add:
    entry:
      id: cal.1960-03.cuba
      when: Mar.
      date: 1960-03
      thread: cuba
      also:
      - soviet-union
      c: 'Alekseyev tells Castro the Central Committee has put him on its list for honoraria, payment for publishing his speeches
        in the bloc: "the first time he had been offered an honorarium." June: $385 for a piece published in Moscow, the first
        payment, in dollars.'
      n: '[[w.fursenko-one-hell-of-a]], 45. To check: Alekseyev to the Center, Mar. 7, 1960, f. 3, op. 65, d. 871, 45, APRF
        (cited by [[w.fursenko-one-hell-of-a]], 45 n.39); Alekseyev to the Center, June 8, 1960, file 78825, 299, SVR (cited
        by [[w.fursenko-one-hell-of-a]], 45 n.40). Check: the note dates the report Mar. 7, before the lunch of Mar. 6 was
        reported. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 3ee1f342
        rows:
        - 'w.fursenko-one-hell-of-a 45: all'
        - 'via w.fursenko-one-hell-of-a 45 n.39: A'
        - 'via w.fursenko-one-hell-of-a 45 n.40: B'
- add:
    entry:
      id: cal.1960-03-29.cuba
      when: Mar. 29
      date: '1960-03-29'
      thread: cuba
      also:
      - soviet-union
      c: 'The Presidium tells the Czechoslovak government it looks "favorably upon giving military assistance to the Cuban
        government": a ten-year credit on good terms for Havana; Moscow''s help in delivering the arms.'
      n: '[[w.fursenko-one-hell-of-a]], 46. Check: the work gives no note for the decision.'
      src:
        c: e955d835
        rows:
        - 'w.fursenko-one-hell-of-a 46: all'
- add:
    entry:
      id: cal.1960-06.cuba
      when: June, mid-month
      date: 1960-06
      thread: cuba
      also:
      - soviet-union
      c: 'Castro to Khrushchev, by letter: more military assistance, against an American punishment for the clash with the
        oil companies.'
      n: '[[w.fursenko-one-hell-of-a]], 48. Check: the day. Reply: [[cal.1960-06-16.cuba]]. Names: Castro, Khrushchev.'
      tags:
      - name:castro-fidel
      - name:khrushchev-nikita-s
      src:
        c: f0eafb61
        rows:
        - 'w.fursenko-one-hell-of-a 48: all'
- add:
    entry:
      id: cal.1960-06-16.cuba
      when: June 16
      date: '1960-06-16'
      thread: cuba
      also:
      - soviet-union
      c: 'Khrushchev to Castro, by the Presidium''s decision: "The Cuban republic today leads the anti-imperialist struggle
        in Latin America. In this serious struggle, the Cuban people can count on the sympathy and the support of the Soviet
        people." Later that week Núñez Jiménez, in Moscow, told Cuba will get 100,000 more rifles than asked and tanks it
        had not asked for.'
      n: '[[w.fursenko-one-hell-of-a]], 48. To check: Protocol, June 16, 1960, f. 3, op. 65, d. 892, APRF (cited by [[w.fursenko-one-hell-of-a]],
        48 n.49). See [[cal.1960-06.cuba]]. Names: Khrushchev, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-fidel
      src:
        c: a7d8165d
        rows:
        - 'w.fursenko-one-hell-of-a 48: all'
        - 'via w.fursenko-one-hell-of-a 48 n.49: A'
- add:
    entry:
      id: cal.1960-06-09.cuba
      when: June 9
      date: '1960-06-09'
      thread: cuba
      also:
      - soviet-union
      c: 'Guevara to Alekseyev: a group of counterrevolutionaries planning to kill him picked up in Havana.'
      n: '[[w.fursenko-one-hell-of-a]], 51 (no tie to the CIA, nothing on an invasion). Names: Guevara.'
      tags:
      - name:guevara-ernesto
      src:
        c: 3bf1d9a5
        rows:
        - 'w.fursenko-one-hell-of-a 51: all'
- add:
    entry:
      id: cal.1960-06-29.soviet-union
      when: June 29
      date: '1960-06-29'
      thread: soviet-union
      also:
      - defense
      c: 'Shelepin brings Khrushchev a document the KGB received June 16, a NATO liaison officer''s report to his government
        from the CIA: the Pentagon''s leaders "convinced of the need to initiate a war with the Soviet Union ''as soon as
        possible''" while American bombers can still destroy the Soviet missile bases.'
      n: '[[w.fursenko-one-hell-of-a]], 51–52. Check: the record; the work gives its note at the end of the passage. Names:
        Shelepin, Khrushchev.'
      tags:
      - name:shelepin-alexandr-n
      - name:khrushchev-nikita-s
      src:
        c: 6e615407
        rows:
        - 'w.fursenko-one-hell-of-a 51–52: all'
