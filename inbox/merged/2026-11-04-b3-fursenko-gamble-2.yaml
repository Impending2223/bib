- add:
    entry:
      id: cal.1961-05-04.cuba-4
      when: May 4
      date: '1961-05-04'
      thread: cuba
      also:
      - soviet-union
      - intelligence
      c: 'Shelepin to the Central Committee: the Cubans have arrested twenty thousand for counterrevolution since the landing;
        the CIA''s undercover center in Havana, at the Berlitz offices, closed and its director, Drexel Woodrow Wilson, arrested;
        the MRR''s papers found show its branches broken. Alekseyev: foreign intelligence "paralyzed."'
      n: '[[w.fursenko-one-hell-of-a]], 134–35. To check: Shelepin to the CC, May 4 and May 5, 1961, file 84558, 278–79, SVR
        (cited by [[w.fursenko-one-hell-of-a]], 134 n.4, 135 n.6). Check: the day; the notes give May 4 and May 5. Names:
        Shelepin.'
      tags:
      - name:shelepin-alexandr-n
      src:
        c: 0d55b5ad
        rows:
        - 'w.fursenko-one-hell-of-a 134–35: all'
        - 'via w.fursenko-one-hell-of-a 135 n.6: all'
- add:
    entry:
      id: cal.1961-06-24.cuba
      when: June 24
      date: '1961-06-24'
      thread: cuba
      also:
      - soviet-union
      - latin-america
      c: 'The Presidium, on the GRU''s copies of Guatemalan papers: Operation Condor, approved in Costa Rica by Ydígoras,
        Betancourt and Figueres, to kill Fidel and Raúl Castro and Guevara about June 26, an attack from Costa Rica to follow;
        one gunman recommended by the CIA. The Kremlin decides to "inform Fidel Castro about the attempt being prepared on
        his life."'
      n: '[[w.fursenko-one-hell-of-a]], 135–36. To check: Protocol, Presidium, June 24, 1961, f. 3, op. 65, d. 902, 73–78,
        APRF (cited by [[w.fursenko-one-hell-of-a]], 135 n.7, n.10). Names: Ydígoras, Betancourt, Castro, Raúl Castro, Guevara.'
      tags:
      - name:ydigoras-fuentes-miguel
      - name:betancourt-romulo
      - name:castro-fidel
      - name:castro-raul
      - name:guevara-ernesto
      src:
        c: 54b18db1
        rows:
        - 'w.fursenko-one-hell-of-a 135–36: all'
        - 'via w.fursenko-one-hell-of-a 135 n.10: all'
- add:
    entry:
      id: cal.1961-06-19.cuba
      when: June 19
      date: '1961-06-19'
      thread: cuba
      c: Cuban security detains Dr. Avilesa Cautina on his way to Miami, carrying plans for a Frente Nacional Cubana to unite
        the underground; his contact in Havana a CIA agent, "Caesar," of a network called Candela.
      n: '[[w.fursenko-one-hell-of-a]], 136. To check: Alekseyev to Moscow, June 28, 1961, file 88631, 262, SVR (cited by
        [[w.fursenko-one-hell-of-a]], 136 n.13).'
      src:
        c: 6dea2912
        rows:
        - 'w.fursenko-one-hell-of-a 136: all'
        - 'via w.fursenko-one-hell-of-a 136 n.13: all'
- add:
    entry:
      id: cal.1961-07-19.cuba
      when: July 19
      date: '1961-07-19'
      thread: cuba
      also:
      - soviet-union
      c: The five-man Candela group arrested, some two hundred more rounded up; Moscow has learned of its plot to kill Castro
        on July 26, Gagarin on its list, and to shell Guantanamo from Oriente for a pretext. The KGB proposes to run its radio
        operator, "Tony," against the CIA.
      n: '[[w.fursenko-one-hell-of-a]], 136–37. To check: Alekseyev to Moscow, July 19, 22 and 29, 1961, file 88631, 304,
        307, 311, SVR (cited by [[w.fursenko-one-hell-of-a]], 136 n.15–16, 137 n.18–19). Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: fab52666
        rows:
        - 'w.fursenko-one-hell-of-a 136–37: all'
        - 'via w.fursenko-one-hell-of-a 136 n.16: all'
