      id: cal.1963-11-25.assassination-6
      when: Nov. 25
      date: '1963-11-25'
      thread: assassination
      also:
      - latin-america
      c: 'Havana. The Mexican Ambassador to his political section: an "extensive conspiracy" behind the assassination, with
        "serious political consequences." From Mexico City, López Mateos quoted: Kennedy killed by "extremely right-wing elements."'
      n: '[[w.fursenko-one-hell-of-a]], 343 (by Soviet intelligence reports; the ambassador''s information likely Cuban intelligence''s).
        Check: the record. Names: López Mateos, Kennedy.'
      tags:
      - name:lopez-mateos-adolfo
      - name:kennedy-john-f
      src:
        c: 6c466ce8
        rows:
        - 'w.fursenko-one-hell-of-a 343: all'
