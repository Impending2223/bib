      when: Apr. 25
      date: '1961-04-25'
      thread: cuba
      also:
      - soviet-union
      - intelligence
      c: At Raúl Castro's request, Shelepin asks the Central Committee to send Cuba "an additional 8 KGB employees" with equipment
        costing 171,000 rubles, "to satisfy the request of Cuban leadership for intelligence cooperation." The Havana station
        proposes that Piñeiro, head of Cuba's G-2, name seven of them to head its departments.
      n: '[[w.fursenko-one-hell-of-a]], 97–98. To check: Shelepin to the CC, Apr. 26, 1961 (cited by [[w.fursenko-one-hell-of-a]],
        98 n.88); Havana to the Center, Apr. 25, 1961, file 88631, vol. 3, 200, SVR (cited by [[w.fursenko-one-hell-of-a]],
        98 n.89). Check: the text dates Shelepin''s request Apr. 25, the note Apr. 26. Names: Raúl Castro, Shelepin.'
