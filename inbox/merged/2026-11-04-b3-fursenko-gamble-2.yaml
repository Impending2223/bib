      when: Sept. 22
      date: '1960-09-22'
      thread: elections-1960
      also:
      - soviet-union
      c: 'Bowles, for Kennedy''s camp, to Herter: against a summit, a test ban or another deal with Khrushchev before the
        election.'
      n: '[[w.fursenko-one-hell-of-a]], 80. To check: Bowles to Herter, Sept. 22, 1960, Herter Papers, Houghton Library (cited
        by [[w.fursenko-one-hell-of-a]], 80 n.16). Check: what the letter says. Names: Bowles, Herter, Kennedy.'
      tags:
