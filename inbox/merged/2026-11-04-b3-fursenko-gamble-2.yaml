      id: cal.1964-01-05.soviet-union
      when: Jan. 5
      date: '1964-01-05'
      thread: soviet-union
      also:
      - transition-and-staff
      c: 'Bartlett to a KGB source in New York: "the new president would never equal Kennedy in terms of the consistency and
        sincerity" of his policy. Sent on to Brezhnev, Mikoyan, Podgorny, Suslov, Ponomarev and Kuznetsov.'
      n: '[[w.fursenko-one-hell-of-a]], 350. To check: spravka, cipher telegram from New York, Jan. 5, 1964, file 90486, SVR
        (cited by [[w.fursenko-one-hell-of-a]], 350 n.42). Check: the day of the talk. Names: Bartlett, Kennedy, Brezhnev,
        Mikoyan, Podgorny, Suslov, Ponomarev.'
      tags:
      - name:bartlett-charles
      - name:kennedy-john-f
      - name:brezhnev-leonid
      - name:mikoyan-anastas
      - name:podgorny-nikolai-v
      - name:suslov-mikhail-a
      - name:ponomarev-boris-n
