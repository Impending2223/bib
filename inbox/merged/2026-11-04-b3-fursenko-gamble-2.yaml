      id: cal.1961-05-03.cuba-2
      when: May 3
      date: '1961-05-03'
      thread: cuba
      also:
      - soviet-union
      - intelligence
      c: 'Alekseyev to Moscow: the agreement with Escalante, for Castro, and the Cuban intelligence chiefs on wider cooperation,
        the work against the United States and the emigration shared. Seventeen Cubans already in Soviet intelligence schools;
        Havana wants fifty more there.'
      n: '[[w.fursenko-one-hell-of-a]], 98. To check: Alekseyev to Moscow, May 3, 1961, file 88631, vol. 3, 205, SVR (cited
        by [[w.fursenko-one-hell-of-a]], 98 n.90–91). See [[cal.1961-04-25.cuba-2]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: dd3243bb
        rows:
        - 'w.fursenko-one-hell-of-a 98: all'
        - 'via w.fursenko-one-hell-of-a 98 n.90: all'
- add:
    entry:
      id: cal.1961-05-04.cuba-3
      when: May 4
      date: '1961-05-04'
      thread: cuba
      also:
      - soviet-union
      c: 'Malinovsky''s report for the Presidium, every piece of war materiel sent Cuba since 1959: by the end of April, from
        the Soviet Union, Czechoslovakia and China, 125 tanks, 50 self-propelled guns, 428 field guns, 920 antiaircraft guns
        among them. To come: 41 jet fighters and reconnaissance aircraft, MiG-19s and MiG-15s, 80 more tanks.'
      n: '[[w.fursenko-one-hell-of-a]], 98–99 and n.*. Check: the work gives no source for the report beyond its date.'
      tags:
      - name:malinovsky-rodion-yakovlevich
      src:
        c: 217a531e
        rows:
        - 'w.fursenko-one-hell-of-a 98–99: all'
- add:
    entry:
      id: cal.1961-06-09.cuba
      when: June 9
      date: '1961-06-09'
      thread: cuba
      also:
      - soviet-union
      c: 'Alekseyev to Moscow: Blas Roca and Escalante, on their own and hiding it from him, planned to assassinate the leaders
        of the counterrevolution, Manuel Ray first; warned by the deputy minister of the interior, he has told them that in
        Moscow''s view "it was probably not the time to take these measures."'
      n: '[[w.fursenko-one-hell-of-a]], 98. To check: Alekseyev to Moscow, June 9, 1961 (cited by [[w.fursenko-one-hell-of-a]],
        98 n.92). Check: the day of the plan and of the message.'
      src:
        c: f30b879b
        rows:
        - 'w.fursenko-one-hell-of-a 98: all'
        - 'via w.fursenko-one-hell-of-a 98 n.92: all'
- add:
    entry:
      id: cal.1961-03-07.testing
      when: Mar. 7
      date: '1961-03-07'
      thread: testing
      also:
      - soviet-union
      c: 'Washington. Sagatelyan, chief of the TASS bureau, to R. T. Davies of State, on the test ban''s inspections: "it
        would be possible to bargain"; "Perhaps the Americans will be able to come down and the Soviets will be able to come
        up and they will meet in the middle somewhere around twelve or thirteen." His own views, he says.'
      n: '[[w.fursenko-one-hell-of-a]], 109 (by the Soviet records, fishing for intelligence). To check: memorandum of conversation,
        Davies with Sagatelyan, Mar. 7, 1961, RG 59, 611.61, National Archives (cited by [[w.fursenko-one-hell-of-a]], 109
        n.20).'
      src:
        c: 0af95946
        rows:
        - 'w.fursenko-one-hell-of-a 109: all'
        - 'via w.fursenko-one-hell-of-a 109 n.20: all'
- add:
    entry:
      id: cal.1961-03-20.testing
      when: Mar. 20
      date: '1961-03-20'
      thread: testing
      also:
      - soviet-union
      c: 'Robert Esterbrook''s memorandum, sent on to Rostow by Holborn: Feklisov, the KGB''s chief in Washington, has told
        him a compromise on the test ban''s inspections "possible."'
      n: '[[w.fursenko-one-hell-of-a]], 109. To check: Holborn to Rostow, Mar. 21, 1961, enclosing Esterbrook''s memorandum
        of Mar. 20, NSF, CO, USSR, 176, JFK Library (cited by [[w.fursenko-one-hell-of-a]], 109 n.21). See [[cal.1961-03-07.testing]].
        Names: Feklisov.'
      tags:
      - name:feklisov-aleksandr
      src:
        c: 2e75d80e
        rows:
        - 'w.fursenko-one-hell-of-a 109: all'
        - 'via w.fursenko-one-hell-of-a 109 n.21: all'
