      when: Dec. 24
      date: '1960-12-24'
      thread: cuba
      also:
      - soviet-union
      c: 'A KGB report from Washington, from a friend of an employee at CIA headquarters: an invasion of Cuba imminent. The
        second scare, through the New Year.'
      n: '[[w.fursenko-one-hell-of-a]], 85. To check: report of Dec. 24, 1960, file 86447, pt. 2, 361, SVR (cited by [[w.fursenko-one-hell-of-a]],
