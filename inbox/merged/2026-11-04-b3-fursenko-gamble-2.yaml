      when: Apr., early
      date: 1961-04
      thread: cuba
      also:
      - soviet-union
      - latin-america
      c: Alekseyev leaves Havana for Moscow, recalled to go to Brazil, where Quadros, president since Jan. 31, is an old acquaintance.
        "We just did not believe" a major landing in April.
      n: '[[w.fursenko-one-hell-of-a]], 89 (by Alekseyev''s interviews with the authors, 1994–95, 89 n.47–49). Check: the
        day.'
