      when: Apr., late
      date: 1961-04
      thread: berlin-and-vienna
      also:
      - robert-kennedy
      - testing
      c: 'The President and Robert Kennedy settle on a private strategy for Vienna: lay out his thinking to Khrushchev in
        advance, a test ban compromise on inspections to be offered through a secret channel. Robert Kennedy goes looking
        for one.'
      n: '[[w.fursenko-one-hell-of-a]], 106–9. Check: the day. Names: Kennedy, Robert Kennedy, Khrushchev.'
      tags:
      - name:kennedy-john-f
