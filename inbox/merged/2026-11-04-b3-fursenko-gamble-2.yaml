- add:
    entry:
      id: cal.1962-08-15.missile-crisis
      when: Aug. 15
      date: '1962-08-15'
      thread: missile-crisis
      also:
      - cuba
      - intelligence
      c: 'A spy at Torriente to the Americans: Russian servicemen at Bahía Honda, San Antonio, San Julián and Isabel Rubio;
        at Torriente three barracks built, the juvenile camps taken over, everyone within two kilometers ordered out; more
        than a hundred crates delivered.'
      n: '[[w.fursenko-one-hell-of-a]], 195. Check: the record; the work quotes it from a Soviet file (195 n.53–54). Check:
        the place names as printed ("Banya-Honda").'
      src:
        c: e1ec7012
        rows:
        - 'w.fursenko-one-hell-of-a 195: all'
        - 'via w.fursenko-one-hell-of-a 195 n.54: all'
- add:
    entry:
      id: cal.1962-08-30.missile-crisis-2
      when: Aug. 30
      date: '1962-08-30'
      thread: missile-crisis
      also:
      - cuba
      - soviet-union
      c: 'Khrushchev with Guevara and Aragonés, Castro''s envoys, at the end of August: against publishing the newly renegotiated
        defense pact. Moscow''s view: even if found out, the missiles would stand; Kennedy would swallow them.'
      n: '[[w.fursenko-one-hell-of-a]], 196. To check: Washington to the Center, July 9, 1962, SVR (cited by [[w.fursenko-one-hell-of-a]],
        196 n.59, the source of the view of Kennedy); Semichastny''s and Alekseyev''s interviews with the authors, 1994 (196
        n.57–58). Names: Khrushchev, Guevara, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:guevara-ernesto
      - name:castro-fidel
      src:
        c: fecb491c
        rows:
        - 'w.fursenko-one-hell-of-a 196: all'
        - 'via w.fursenko-one-hell-of-a 196 n.59: B'
- add:
    entry:
      id: cal.1962-08-22.berlin-and-vienna
      when: Aug. 22
      date: '1962-08-22'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'The Soviets abolish the post of Soviet commandant in Berlin. The American mission: "long step in direction in which
        they have been moving for some time."'
      n: '[FRUS 1961–63, XV: Berlin Crisis, 1962–1963, doc. 100](https://history.state.gov/historicaldocuments/frus1961-63v15/d100)
        (the Mission at Berlin, Aug. 23, 4 p.m.); [V: Soviet Union, doc. 226](https://history.state.gov/historicaldocuments/frus1961-63v05/d226)
        (the day). [[w.fursenko-one-hell-of-a]], 202 (citing the mission''s telegram as Hulick''s).'
      src:
        c: 719c2306
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d100: B'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v05/d226: A'
