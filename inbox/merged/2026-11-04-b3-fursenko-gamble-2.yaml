      when: Apr. 7
      date: '1961-04-07'
      thread: cuba
      also:
      - soviet-union
      - cuba-bay-of-pigs
      c: Havana. The Cuban communists carry Castro's concern confidentially to Kudryavtsev; Apr. 8 they tell him the danger
        of an invasion for the Miró Cardona government in exile "very real," the "situation is more dangerous than in October
        1960 or in January"; the time and place unknown, "But the government considers the invasion inevitable."
      n: '[[w.fursenko-one-hell-of-a]], 89–90. To check: Kudryavtsev to the MFA, Apr. 7, 1961, f. 3, op. 65, d. 901, 3, APRF
        (cited by [[w.fursenko-one-hell-of-a]], 89 n.50); Kudryavtsev to the MFA, Apr. 8, 1961, f. 3, op. 65, d. 901, 4–7,
        APRF (cited by [[w.fursenko-one-hell-of-a]], 90 n.51–52). Names: Castro, Miró Cardona.'
      tags:
      - name:castro-fidel
      - name:miro-cardona-jose
      src:
        c: 7ccf6497
        rows:
        - 'w.fursenko-one-hell-of-a 89–90: all'
        - 'via w.fursenko-one-hell-of-a 89 n.50: A'
