      date: 1960-11
      thread: soviet-union
      also:
      - china
      - cuba
      c: Moscow. The conference of 81 communist and workers' parties. The Soviets bring in "national democracy" for states
        like Cuba in transition to socialism.
      n: '[[w.fursenko-one-hell-of-a]], 73. To check: Report on the Moscow Conference, Soviet home service, Jan. 19, 1961
