        rows:
        - 'w.fursenko-one-hell-of-a 214: all'
- add:
    entry:
      id: cal.1962-09-20.missile-crisis
      when: Sept. 20
      date: '1962-09-20'
      thread: missile-crisis
      also:
      - soviet-union
      c: 'Zakharov, chief of the general staff, to the leadership: the GRU reports soldiers complaining about fighting for
        Cuba, "opposition in the various parts of the Soviet armed forces to the TASS declaration"; "We don''t need Cuba."
        Since June 114 shipments sent, 94 arrived; loading to be done by Oct. 20.'
      n: '[[w.fursenko-one-hell-of-a]], 213. To check: Zakharov to the CC, Sept. 20, 1962, f. 5, op. 33, d. 164, 137, TsKhSD
        (cited by [[w.fursenko-one-hell-of-a]], 213 n.50). See [[cal.1962-09-11.missile-crisis]]. Names: Zakharov.'
      tags:
      - name:zakharov-matvei-vasileevich
      src:
        c: 654430f5
        rows:
        - 'w.fursenko-one-hell-of-a 213: all'
        - 'via w.fursenko-one-hell-of-a 213 n.50: all'
- add:
    entry:
      id: cal.1962-10-08.cuba
      when: Oct. 8
      date: '1962-10-08'
      thread: cuba
      also:
      - missile-crisis
      c: 'Dorticós to the General Assembly: Cuba could "become the starting point of a new World War"; "We are, I repeat,
        well equipped to defend ourselves."'
      n: '[[w.fursenko-one-hell-of-a]], 219. Check: the record of the Assembly. Names: Dorticós.'
      tags:
      - name:dorticos-torrado-osvaldo
      src:
        c: 2db196bd
        rows:
        - 'w.fursenko-one-hell-of-a 219: all'
- add:
    entry:
      id: cal.1962-10-09.missile-crisis-2
      when: Oct. 9
      date: '1962-10-09'
      thread: missile-crisis
      also:
      - cuba
      c: Havana. Castro with Alekseyev, the Soviet Ambassador, on his campaign to prepare Cubans to accept Soviet missiles.
      n: '[[w.fursenko-one-hell-of-a]], 220. To check: Alekseyev to the MFA, Oct. 9, 1962, f. 109, op. 17, d. 21, 58–59, AVPRF
        (cited by [[w.fursenko-one-hell-of-a]], 220 n.14). Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: b0d19eb0
        rows:
        - 'w.fursenko-one-hell-of-a 220: all'
        - 'via w.fursenko-one-hell-of-a 220 n.14: all'
- add:
    entry:
      id: cal.1962-10-10.missile-crisis-2
      when: Oct. 10
      date: '1962-10-10'
      thread: missile-crisis
      also:
      - soviet-union
      - intelligence
      c: 'Semichastny to the Central Committee: a six-point propaganda operation for the missiles'' unveiling. Ehrenburg to
        write an open letter in French for Parisian intellectuals, Sartre among them; Shostakovich to back a statement on
        American efforts to starve Cuba; a boycott of American goods. The Presidium, Oct. 16, takes the boycott and declines
        to risk Ehrenburg and Shostakovich.'
      n: '[[w.fursenko-one-hell-of-a]], 228–29. To check: Semichastny to the CC, Oct. 10, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        229 n.27); protocol of the Presidium, Oct. 16, distributed Oct. 18, APRF (cited by [[w.fursenko-one-hell-of-a]], 229
        n.28). Check: the Presidium''s decision as its own entry.'
      src:
        c: dbba4824
        rows:
        - 'w.fursenko-one-hell-of-a 228–29: all'
        - 'via w.fursenko-one-hell-of-a 229 n.27: A-B'
        - 'via w.fursenko-one-hell-of-a 229 n.28: C'
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-4
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis
      also:
      - soviet-union
      - intelligence
      c: 'The GRU''s four reports: Kennedy has not ruled out military action in the Caribbean; military planes to Puerto Rico,
        more SAC bombers on alert, the Navy in the Caribbean for ORTSAC. A report reaching the Kremlin this day: "[A] U.S.
        military adventure against Cuba is almost beyond belief."'
      n: '[[w.fursenko-one-hell-of-a]], 237. To check: "Cables Received in Moscow," Oct. 1962, GRU (cited by [[w.fursenko-one-hell-of-a]],
        237 n.54). Check: the days of the four reports.'
      src:
        c: 533ac277
        rows:
        - 'w.fursenko-one-hell-of-a 237: all'
        - 'via w.fursenko-one-hell-of-a 237 n.54: all'
- add:
    entry:
      id: cal.1962-10-21.press-and-broadcasting
      when: Oct. 21
      date: '1962-10-21'
      thread: press-and-broadcasting
      also:
      - missile-crisis
      c: 'Sunday night. Kennedy asks the *New York Times* and the *Washington Post* not to run their stories of a coming quarantine;
        both hold them. The next afternoon''s *Herald Tribune*: "Top-Secret Doings in Capital; A Cuba-Berlin Strategy Step?"'
      n: '[[w.fursenko-one-hell-of-a]], 238. To check: [[w.salinger-with-kennedy]], 253, 261 (cited by [[w.fursenko-one-hell-of-a]],
        238 n.58–59); *New York Herald Tribune*, Oct. 22, 1962 (238 n.57). See [[cal.1962-10-20.missile-crisis-3]]. Names:
        Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: a9158449
        rows:
        - 'w.fursenko-one-hell-of-a 238: all'
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-7
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis
      also:
      - soviet-union
      c: 'Pliyev, warned by Cuban and Czech sources, expects an American air strike within a day or two: more deception, and
        "a dispersal of technology," likely the warheads moved nearer the missiles. All twenty-four launchers ready; no warhead
        mated, each three and a half hours from it.'
      n: '[[w.fursenko-one-hell-of-a]], 268. Check: "a dispersal of technology" read by the authors as the warheads'' move.'
      src:
        c: 419e65f9
        rows:
        - 'w.fursenko-one-hell-of-a 268: all'
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-8
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis
      also:
      - cuba
      c: 'Castro to the general staff of the Revolutionary Army, on Prensa Latina''s intercept of an American ultimatum for
        U Thant: all forces to their command posts, the highest alert; from the next morning Cuban antiaircraft guns to fire
        on any American plane over Cuba. Raúl Castro to Oriente, Guevara to Pinar del Río.'
      n: '[[w.fursenko-one-hell-of-a]], 268. Names: Castro, Raúl Castro, Guevara.'
      tags:
      - name:castro-fidel
      - name:castro-raul
      - name:guevara-ernesto
      src:
        c: 50f8c4f5
        rows:
        - 'w.fursenko-one-hell-of-a 268: all'
- add:
    entry:
      id: cal.1962-10-28.missile-crisis-4
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis
      also:
      - cuba
      - soviet-union
      c: 'The Presidium''s second message to Havana, through Alekseyev: Castro encouraged to declare for the missiles'' removal;
        Scali''s suggestion passed on, "in complete trust," as from a source "we know well" at "the very highest levels":
        Castro to say he will dismantle the sites if Kennedy guarantees no invasion. "[T]he proposals presented by this source
        are wholly acceptable to us."'
      n: '[[w.fursenko-one-hell-of-a]], 291. To check: instructions to Alekseyev, Oct. 28, 1962, extract from Protocol 63,
        f. 3, op. 65, d. 905, 166–69, APRF (cited by [[w.fursenko-one-hell-of-a]], 291 n.3). See [[cal.1962-10-26.soviet-union]].
        Names: Castro, Scali, Kennedy.'
      tags:
      - name:castro-fidel
      - name:scali-john-a
      - name:kennedy-john-f
      src:
        c: 7fd9fe80
        rows:
        - 'w.fursenko-one-hell-of-a 291: all'
        - 'via w.fursenko-one-hell-of-a 291 n.3: all'
- add:
    entry:
      id: cal.1962-10-29.missile-crisis-2
      when: Oct. 29
      date: '1962-10-29'
      thread: missile-crisis
      also:
      - cuba
      - soviet-union
      c: Khrushchev decides to send Mikoyan to Havana to reassure the Cubans.
      n: '[[w.fursenko-one-hell-of-a]], 289. See [[cal.1962-11-02.missile-crisis]]. Names: Khrushchev, Mikoyan.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
