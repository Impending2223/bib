- add:
    entry:
      id: cal.1964-08.soviet-union-2
      when: Aug., late summer
      date: 1964-08
      thread: soviet-union
      also:
      - cuba
      c: 'Moscow. Alekseyev, on home leave, calls Semichastny before returning to Havana, having discussed Cuba with Khrushchev
        on vacation. Semichastny: "And have you discussed Cuba with Comrade Brezhnev?" "Well, you should talk to Brezhnev."
        His only warning of the plot.'
      n: '[[w.fursenko-one-hell-of-a]], 353. To check: interview with Alekseyev, Nov. 15, 1995 (cited by [[w.fursenko-one-hell-of-a]],
        353 n.53). Check: the month ("late summer"). Names: Khrushchev, Brezhnev.'
      tags:
      - name:khrushchev-nikita-s
      - name:brezhnev-leonid
      src:
        c: 42c76675
        rows:
        - 'w.fursenko-one-hell-of-a 353: all'
        - 'via w.fursenko-one-hell-of-a 353 n.53: all'
- add:
    entry:
      id: cal.1964-10-13.soviet-union-2
      when: Oct. 13
      date: '1964-10-13'
      thread: soviet-union
      also:
      - cuba
      c: 'Polyansky''s text for the report against Khrushchev to the plenum of Oct. 14. On Cuba: "plans for the military ''penetration''
        of South America were gibberish"; "You insisted that we deploy our missiles on Cuba. This provoked the deepest crisis,
        carried the world to the brink of nuclear war"; "we had to accept every demand and condition dictated by the U.S.";
        the prestige of party and state damaged, the United States'' raised. Khrushchev''s "To hell with them, let them scream."'
      n: '[[w.fursenko-one-hell-of-a]], 353–54. To check: D. S. Polyansky, text for the report to the plenum of the CC (Oct.
        14, 1964), prepared Oct. 13, 1964, register no. 8476, APRF (cited by [[w.fursenko-one-hell-of-a]], 353 n.54–58). Made
        public: Werner Hahn, "Who Ousted Nikita Sergeyevich," Problems of Communism, May–June 1991, 109–15 (cited by [[w.fursenko-one-hell-of-a]],
        353 n.54). See [[cal.1964-10-14.soviet-union]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 9727d5f7
        rows:
        - 'w.fursenko-one-hell-of-a 353–54: all'
        - 'via w.fursenko-one-hell-of-a 353 n.54: all'
