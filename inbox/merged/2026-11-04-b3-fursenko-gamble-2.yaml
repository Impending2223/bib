      when: Oct. 30
      date: '1962-10-30'
      thread: missile-crisis
      also:
      - soviet-union
      c: Malinovsky orders Pliyev to load all the MRBM warheads onto the *Aleksandrovsk*, which holds the R-14 charges that
        never came ashore. Asked about the hundred warheads left, the Defense Ministry tells him to train the Cubans on the
        Lunas, the FKR cruise missiles and the Il-28s.
      n: '[[w.fursenko-one-hell-of-a]], 311. To check: General Gribkov''s address, Moscow conference of 1994 (cited by [[w.fursenko-one-hell-of-a]],
        311 n.94). Names: Malinovsky.'
      tags:
      - name:malinovsky-rodion-yakovlevich
      src:
        c: fbb6a662
        rows:
        - 'w.fursenko-one-hell-of-a 311: all'
        - 'via w.fursenko-one-hell-of-a 311 n.94: all'
