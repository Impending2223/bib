    entry:
      id: cal.1961-05-24.berlin-and-vienna
      when: May 24
      date: '1961-05-24'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Norman Cousins to a Soviet representative: Kennedy''s advisers sharply split between those hoping for an accommodation
        with Russia and those who think it impossible.'
      n: '[[w.fursenko-one-hell-of-a]], 126. Check: the rest of the talk and its record. Names: Cousins, Kennedy.'
      tags:
      - name:cousins-norman
      - name:kennedy-john-f
      src:
        c: e22559c1
