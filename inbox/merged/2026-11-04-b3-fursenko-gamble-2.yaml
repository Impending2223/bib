      when: Feb. 24
      date: '1961-02-24'
      thread: cuba
      also:
      - soviet-union
      c: 'Kudryavtsev to Moscow, on his meeting with Escalante: the Cubans think Kennedy "decided to take action in March";
        Raúl Castro and the PSP want Soviet help with a plan for the island''s defense, Flavio Bravo of the PSP to carry the
        request.'
      n: '[[w.fursenko-one-hell-of-a]], 86–87. To check: Kudryavtsev, Havana, Feb. 24, 1961, f. 3, op. 65, d. 871, APRF (cited
        by [[w.fursenko-one-hell-of-a]], 86 n.37–39). Check: the day of the meeting. Names: Kennedy, Raúl Castro.'
      tags:
      - name:kennedy-john-f
      - name:castro-raul
      src:
        c: c54d1e6a
        rows:
        - 'w.fursenko-one-hell-of-a 86–87: all'
        - 'via w.fursenko-one-hell-of-a 86 n.37: all'
- add:
    entry:
      id: cal.1961-03-03.cuba
      when: Mar. 3
      date: '1961-03-03'
      thread: cuba
      also:
      - soviet-union
      c: 'Moscow. Kozlov and Suslov with Flavio Bravo of the PSP: glad to help Raúl Castro and the PSP plan Cuba''s defense,
        "only if Soviet specialists were sent to Cuba."'
      n: '[[w.fursenko-one-hell-of-a]], 87. To check: minutes of the meeting of Kozlov, Suslov and Flavio Bravo, Mar. 3, 1961,
        f. 3, op. 65, d. 871, APRF (cited by [[w.fursenko-one-hell-of-a]], 87 n.40–42). See [[cal.1961-02-24.cuba]]. Names:
        Kozlov, Suslov, Raúl Castro.'
