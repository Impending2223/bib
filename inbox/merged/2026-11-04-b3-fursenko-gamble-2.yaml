      when: Jan. 7
      date: '1961-01-07'
      thread: cuba
      also:
      - soviet-union
      - intelligence
      c: 'After four months of bad predictions, a KGB service dispatch: a campaign to improve its knowledge of American policy
        on Cuba.'
      n: '[[w.fursenko-one-hell-of-a]], 86. To check: service dispatch, Jan. 7, 1961, file 86447, pt. 2, 421, SVR (cited by
        [[w.fursenko-one-hell-of-a]], 86 n.36).'
