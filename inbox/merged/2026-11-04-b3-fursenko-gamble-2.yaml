- add:
    entry:
      id: cal.1962-11-23.soviet-union
      when: Nov. 23
      date: '1962-11-23'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'The Central Committee''s plenum, Nov. 19–23. Khrushchev on the crisis, the trade of the Jupiters in Turkey left
        out, the letters of Oct. 28 on it withheld: "It was not necessary to act like the czarist officer who farted at the
        ball and then shot himself"; "If a government has the misfortune to lose its head in difficult times, then this could
        threaten a tragedy for all people." A pledge not to invade Cuba: "Not bad!"'
      n: '[[w.fursenko-one-hell-of-a]], 324–25. To check: stenographic record of the plenum of Nov. 19–23, 1962, f. 2, op.
        2, d. 231, 134–36, APRF (cited by [[w.fursenko-one-hell-of-a]], 324 n.20). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 5ef91dc3
        rows:
        - 'w.fursenko-one-hell-of-a 324–25: all'
        - 'via w.fursenko-one-hell-of-a 324 n.20: all'
