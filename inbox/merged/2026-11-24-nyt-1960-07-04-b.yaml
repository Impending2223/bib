- add:
    entry:
      id: cal.1960-07-03.elections-1960-nomination-4
      when: 'By July 3'
      date: '1960-07-03'
      thread: elections-1960-nomination
      c: 'Monroney, for Stevenson, on the taped "Radio News Conference": the convention will not be "blitzed"; Kennedy will not go "the last mile," at most 604½ votes.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 (the runover of "Johnson Supports Truman in Criticizing Convention"). Check: the day of the taping and of the broadcast. See [[cal.1960-07-03.elections-1960]]. Names: Monroney, Stevenson, Kennedy.'
      tags: [ok:fields-place, name:monroney-almer-s, name:stevenson-adlai-e, name:kennedy-john-f]
- add:
    entry:
      id: cal.1960-07-03.elections-1960-nomination-5
      when: 'By July 3'
      date: '1960-07-03'
      thread: elections-1960-nomination
      c: 'Seven House members, Lee Metcalf their spokesman, write Kennedy, Johnson, Symington and Stevenson asking that Henry Jackson be considered for Vice President; with Ashley, Magnuson (Don), McGinley, George P. Miller, Rivers and Stratton.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 (the runover of "Johnson Supports Truman"). Check: the day. Names: Metcalf, George P. Miller, Stratton, Kennedy, Johnson, Symington, Stevenson, Jackson.'
      tags: [ok:fields-place, name:metcalf-lee-w, name:miller-george-p, name:kennedy-john-f, name:johnson-lyndon-b, name:symington-william-s, name:stevenson-adlai-e, name:jackson-henry-m, name:stratton-samuel-s]
- add:
    entry:
      id: cal.1960-07-03.elections-1960-nomination-6
      when: July 3
      date: '1960-07-03'
      place: los-angeles
      thread: elections-1960-nomination
      c: 'Sorensen flies from Los Angeles, where he was preparing for the convention, to be with Kennedy as he prepares his answer to Truman.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 (Clayton Knowles, "Kennedy Replies to Charge Today," the runover: "yesterday"). Names: Sorensen, Kennedy, Truman.'
      tags: [name:sorensen-theodore-c, name:kennedy-john-f, name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-02.jobs-and-wages
      when: 'By July 2'
      date: '1960-07-02'
      place: washington
      thread: jobs-and-wages
      also: [congress]
      c: 'Frank E. Smith''s amendment to the minimum wage bill, adopted by the House after a minute''s discussion, exempts some 14 million workers from wage-and-hour protection, not as he meant; Smith: "Maybe I should have let a lobbyist write it."'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 ("Random Notes in Washington," Washington, July 3: "last week"). Check: the day. Names: Smith.'
      tags: [name:smith-frank-e]
- add:
    entry:
      id: cal.1960-07-03.white-house
      when: 'By July 3'
      date: '1960-07-03'
      thread: white-house
      c: 'Eisenhower, after his and Dr. Thomas Dooley''s honorary degrees at Notre Dame, reportedly writes a hundred friends about Dooley''s Southeast Asian medical project, Medico; Medico reputed to have received a hundred checks of $100. Anne Wheaton of the press staff: "a personal matter."'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 ("Random Notes in Washington": "reportedly"). Check: the day. Names: Eisenhower.'
      tags: [ok:fields-place, name:eisenhower-dwight-d]
- add:
    entry:
      id: cal.1960-07-03.congress-4
      when: 'By July 3'
      date: '1960-07-03'
      thread: congress
      also: [trade]
      c: 'Clem Miller of California, for the Napa, Sonoma and Mendocino wine growers, seeks a law next session making foreign bottlers meet American fill standards.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 ("Random Notes in Washington"). Check: the day. Names: Miller.'
      tags: [ok:fields-place, name:miller-clement-w]
