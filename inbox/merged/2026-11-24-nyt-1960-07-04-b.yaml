      date: '1960-06-30'
      place: manokwari
      thread: indonesia
      c: 'Netherlands New Guinea. Dutch military activity grows at Manokwari and Biak; two marine battalions there, two army battalions to follow, about 3,000 men; a Papuan battalion of 600 recruiting; a reinforcing detachment due from the Netherlands.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 (Tillman Durdin, "Dutch on Alert in New Guinea; Troops Guard Against Indonesia," Manokwari, June 30). Check: the days.'
