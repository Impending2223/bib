      when: 'By July 3'
      date: '1960-07-03'
      place: washington
      thread: cuba
      also: [congress]
      c: 'Democrats and Republicans of House Agriculture squabble over which party is more anti-Castro; Belcher, Oklahoma Republican: Castro will "shoot Democrats just as quick as he''ll shoot Republicans."'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 ("Random Notes in Washington": "recently"). Check: the day. Names: Belcher, Castro.'
      tags: [name:belcher-page-h, name:castro-fidel]
- add:
    entry:
      id: cal.1960-07-02.republican-party-4
      when: 'By July 2'
      date: '1960-07-02'
      thread: republican-party
      c: 'Mundt, at a $50-a-plate testimonial luncheon for his re-election, on Kennedy: unsure "whether the Democratic nominee will be Jack Kennedy or Kennedy''s Jack."'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 ("Random Notes in Washington": "last week"). Check: the day. Names: Mundt, Kennedy.'
      tags: [ok:fields-place, name:mundt-karl-e, name:kennedy-john-f]
