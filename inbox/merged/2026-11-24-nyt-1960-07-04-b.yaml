      when: 'By July 3'
      date: '1960-07-03'
      thread: south-asia
      also: [china]
      c: 'Nepal begins moving troops north to strengthen its border defenses after the Chinese attack at Mustang; the Chinese troops ordered back from the border.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 3 ("Nepal Moves Troops," Katmandu, July 3; the *Times* of London''s dispatch). Check: the day. See [[cal.1960-07-02.china-leadership-2]].'
      tags: [ok:fields-place]
