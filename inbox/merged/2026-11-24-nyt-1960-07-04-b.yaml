      place: new-rochelle
      thread: cuba
      c: 'Raúl Roa Jr., son of Cuba''s Foreign Minister and alternate delegate to the United Nations, marries Maria Carola Baseggio in New Rochelle, N.Y.; the Foreign Minister attends.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 ("Roa Returns to Cuba": "Friday"). Names: Roa.'
      tags: [name:roa-y-garcia-raul, state:ny]
