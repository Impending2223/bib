      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 ("U.S. Envoy Scorns Warning of Death," Mexico City, July 3: "Friday night," in the dateline''s clock; where Hill was not said). Names: Hill.'
