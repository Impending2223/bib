      date: '1960-07-03'
      place: nyc
      thread: cuba
      c: 'Roa, Cuba''s Foreign Minister, leaves Idlewild for Havana after three days in New York for his son''s wedding; with him his son Raúl Roa Jr., alternate delegate to the United Nations, and the bride.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 ("Roa Returns to Cuba": "yesterday"). Names: Roa.'
