- add:
    entry:
      id: cal.1960-07-03.elections-1960-nomination-7
      when: July 3
      date: '1960-07-03'
      place: washington
      thread: elections-1960-nomination
      c: 'Rep. Charles H. Brown, chairman of the Symington for President Committee, by statement released a day early: no one will have 761 on the first several ballots; the convention will probably turn to a "dark horse"; from the third ballot the race "might well be" Symington against Stevenson, Symington the winner.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 ("Symington Appraised," Washington, July 3, UPI). Names: Symington, Stevenson.'
      tags: [ok:name-untagged, name:symington-william-s, name:stevenson-adlai-e]
- add:
    entry:
      id: cal.1960-07-03.elections-1960-rockefeller-2
      when: July 3
      date: '1960-07-03'
      thread: elections-1960-rockefeller
      also: [republican-party]
      c: 'W. E. Miller, Republican Congressional campaign chairman, on Mutual''s "Youth Wants to Know": Nixon "twice as qualified" as Rockefeller; Rockefeller''s criticism "healthy" for the party.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html) ("Governor Belittled," Washington, July 3, UPI; page not shown). Names: Miller, Nixon, Rockefeller.'
      tags: [ok:fields-place, name:miller-william-e, name:nixon-richard-m, name:rockefeller-nelson]
- add:
    entry:
      id: cal.1960-07-03.elections-1960-rockefeller-3
      when: July 3
      date: '1960-07-03'
      place: washington
      thread: elections-1960-rockefeller
