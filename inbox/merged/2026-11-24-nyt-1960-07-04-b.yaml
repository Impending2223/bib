      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 (Szulc, "Cuba Awaits Cut by U.S. on Sugar": "in recent days"). Check: the days.'
