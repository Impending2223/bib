      when: 'By July 2'
      date: '1960-07-02'
      place: lahore
      thread: south-asia
      c: 'A leading Lahore editor, to the *Times*: what hurt the United States most in Pakistan was Dulles''s death; "we aren''t sure where the United States is going now."'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 (Paul Grimes, "Pakistanis Voice Misgivings on U.S.," Karachi, July 3: "last week"). Check: the day.'
- add:
    entry:
      id: cal.1960-06-24.middle-east
      when: June 24
      date: '1960-06-24'
      thread: middle-east
      c: 'Nasser, in a speech, predicts Hussein will meet the fate of his grandfather, King Abdullah, assassinated.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 ("Jordan to Protest Attacks by Nasser," Amman, July 3). Names: Nasser, Hussein.'
      tags: [ok:fields-place, name:nasser-gamal-abdel, name:hussein-ibn-talal]
- add:
    entry:
      id: cal.1960-07-03.soviet-union-3
      when: July 3
      date: '1960-07-03'
      thread: soviet-union
      c: 'The Soviet rescue cruiser *Kapitan Afanasiev* joins the search for the missing RB-47 in the Barents Sea, the Norwegian radio at Vardø reports. Fourteen planes aloft at a time; nine Air Force C-54s from Britain at Bodø.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 3 ("Soviet Ship Joins Hunt for U.S. Jet," Bodø, Norway, July 3, AP).'
      tags: [ok:fields-place]
- add:
    entry:
      id: cal.1960-07-03.berlin-and-vienna
      when: July 3
      date: '1960-07-03'
      place: berlin
      thread: berlin-and-vienna
      c: 'West Berlin officials report 12,194 East Germans fled to West Berlin in June, 3,995 fewer than in May, 5,684 more than in June, 1959.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 3 ("12,194 Flee East Germany," Berlin, July 3, AP).'
- add:
    entry:
      id: cal.1960-07-03.europe-and-the-alliance
      when: 'By July 3'
      date: '1960-07-03'
      thread: europe-and-the-alliance
      c: 'Italy''s holiday season an "explosion of luxury"; mounting demands that tax agents watch the resorts.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 3 (Paul Hofmann, "Italians'' ''Explosion'' at Resorts," Rome, July 3). Check: the day.'
      tags: [ok:fields-place]
