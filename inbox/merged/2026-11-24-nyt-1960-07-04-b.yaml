      when: July 2
      date: '1960-07-02'
      thread: europe-and-the-alliance-federal-republic
      c: 'West Germany''s law decontrolling rents takes effect; all controls to end by 1966; rents on dwellings built before the 1948 currency reform liable to an immediate 15 percent rise.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 3 (Sydney Gruson, "Control of Rents Is Eased by Bonn," Bonn, July 3: "yesterday").'
      tags: [ok:fields-place]
