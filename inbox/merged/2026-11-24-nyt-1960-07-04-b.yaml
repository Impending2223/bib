- add:
    entry:
      id: cal.1960-07-03.congress-3
      when: 'By July 3'
      date: '1960-07-03'
      place: washington
      thread: congress
      c: 'The House passes a bill, sought by the railroads, forbidding the carriage of ordinary first-class mail by air; the Post Office had been flying it experimentally.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 ("Congress Passes Cuba Sugar Bill," the runover). Check: the day. To check: 106 Cong. Rec. (1960).'
- add:
    entry:
      id: cal.1960-07-02.cuba-8
      when: July 2–3
      date: '1960-07-02'
      place: washington
      thread: cuba
      also: [congress]
      c: 'Macomber, Assistant Secretary of State for Congressional Relations, and Harlow, of the White House staff, pass the word to members that the President would be "furious" if Congress quit without the sugar bill, and might call it back.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 (William M. Blair, "Stakes Were High for Sugar Lobby," Washington, July 3: "last night"; and the sugar story''s runover: "last night"). The time is the first day''s. See [[cal.1960-06-29.cuba]]. Names: Macomber, Harlow, Eisenhower.'
      tags: [name:macomber-william-b-jr, name:harlow-bryce-n, name:eisenhower-dwight-d]
      time_range:
      - 1960-07-03T02:00Z
      - 1960-07-03T04:00Z
      time_band: night
      time_zone: America/New_York
      range_basis: record
- add:
    entry:
      id: cal.1960-07-03.cuba-3
      when: July 3
      date: '1960-07-03'
      place: washington
      thread: cuba
      also: [congress]
      c: 'McCormack, coming from the Senate-House conference on the sugar bill soon after 5 a.m., confers about two minutes in the Speaker''s lobby with John O''Donnell, who represents the Philippine processors and growers.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 (Blair, "Stakes Were High for Sugar Lobby"). Names: McCormack.'
      tags: [name:mccormack-john-w]
      time: 1960-07-03T09:00Z
      time_approx: true
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-03.cuba-4
      when: 'By July 3'
      date: '1960-07-03'
      place: havana
      thread: cuba
      c: 'Exporters of Cuban sugar charter all the ships they can to beat the quota cut; about 200,000 tons contracted in ten days, some 800,000 left of the 1960 quota; freight to American ports up from $4 to $5.30 a ton.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 (Tad Szulc, "Cuba Awaits Cut by U.S. on Sugar," Havana, July 3). Check: the days.'
- add:
    entry:
      id: cal.1960-07-02.cuba-9
      when: 'By July 2'
      date: '1960-07-02'
      thread: cuba
      also: [latin-america]
      c: 'The United States submits to the O.A.S.''s Inter-American Peace Committee a detailed memorandum on Cuba''s "unwarranted hostility."'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2 (Szulc, "Cuba Awaits Cut by U.S. on Sugar": "last week"). Check: the day. To check: the memorandum, *Department of State Bulletin*.'
      tags: [ok:fields-place]
