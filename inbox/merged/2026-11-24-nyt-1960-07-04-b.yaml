      place: paris
      thread: europe-and-the-alliance-britain
      also: [trade]
      c: 'The twenty-one-nation trade talks at Paris. British ministers return thinking Dillon unsympathetic to British policy; a misunderstanding between Heathcoat Amory and Dillon.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 3 (Drew Middleton, "A Change for Britain?," news analysis, London, July 3). Check: the day. Names: Dillon.'
      tags: [name:dillon-c-douglas]
      at: before 1960-05-01
