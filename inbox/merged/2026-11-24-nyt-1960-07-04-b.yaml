      date: '1960-07-03'
      place: belgrade
      thread: europe-and-the-alliance
      c: 'Karamanlis, Greek Premier, ends a three-day official visit to Yugoslavia and returns home.'
      n: '[*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4 ("Greek Premier Returns Home," Belgrade, July 3, AP).'
