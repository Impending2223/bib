      set:
        c: 'The elections of 1964, from the race for the nominations to the result. The Goldwater draft, its Chicago meetings; Gallup''s trial heats, Nixon, Rockefeller, Goldwater.'
        c2: 'The elections of 1964, from the race for the nominations to the result. Rockefeller; the Goldwater draft; Goldwater announces; Gallup''s trial heats; the primaries, Mar. 10 to June 2 (CQ''s returns); San Francisco, July 13, and Atlantic City, Aug. 24; Smith announces; Scranton enters; his letter; the platform fight; Goldwater nominated; the Johnson–Goldwater meeting; the Cabinet ruled out; Hershey; Johnson and Humphrey nominated; Robert Kennedy for the Senate; the Daisy ad; Thurmond a Republican; the Lady Bird Special; Jenkins; "A Time for Choosing"; Nov. 3; the concession; Burch for Bliss.'
