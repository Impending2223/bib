patch: thread-halves
by: Claude (agent), for the calendar's two pages
ops:
  - edit:
      id: cal.thread.berlin-and-vienna
      base: 5e1349ea
      set:
        c: 'The second Berlin crisis, from the Vienna ultimatum to the wall and after. Vienna; the July buildup; Aug. 13; Clay in Berlin; Checkpoint Charlie; Powers for Abel; Fechter.'
        c2: 'The second Berlin crisis, from the Vienna ultimatum to the wall and after. Kennedy in Berlin.'
  - edit:
      id: cal.thread.cities-and-housing
      base: f0ceb9f2
      set:
        c: 'Housing, the cities, and urban transit. The Housing Act of 1961; the Urban Affairs department refused, by Rules and by the House; Weaver.'
        c2: 'Housing, the cities, and urban transit. Mass transit; the 1964 message; the Urban Mass Transportation Act; the Housing Act of 1964; Proposition 14; the 1965 message; HUD through the House; the Housing and Urban Development Act of 1965; the Department created; rent supplements.'
  - edit:
      id: cal.thread.civil-rights-organizations
      base: 2311c92b
      set:
        c: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Farmer to CORE; Highlander; Greenberg and Young; the Albany Movement; COFO revived; the Voter Education Project.'
        c2: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Lewis SNCC''s chairman; the Council for United Civil Rights Leadership; the leaders at the White House; the Freedom Democratic Party; the moratorium; the compromise refused; Waveland; CORE at Durham; McKissick; SNCC against the war.'
  - edit:
      id: cal.thread.civil-rights-the-executive
      base: f1a94a4d
      set:
        c: 'What the President did for civil rights by appointment and order. Weaver; the equal employment committee; the new judgeships, Cox and Marshall; the housing order.'
        c2: 'What the President did for civil rights by appointment and order. The Commission''s century report; Baldwin; the apprenticeship order; Cambridge; the Gesell committee and McNamara''s directive; Hoover on King; the Council on Equal Opportunity; the Klan arrests; Howard University; Executive Order 11246; "To Fulfill These Rights".'
  - edit:
      id: cal.thread.confirmations
      base: fc9517b1
      set:
        c: 'Nominations the Senate divided on by roll call. Meriwether; Holmes; the Power Commission; Robinson; McCone; McCloskey; Marshall to the Second Circuit.'
        c2: 'Nominations the Senate divided on by roll call. The satellite incorporators; Coleman to the Fifth Circuit.'
  - edit:
      id: cal.thread.congo
      base: 152d295b
      set:
        c: 'The Congo''s civil war and the UN''s war in Katanga. Lumumba''s death; Rumpunch; Hammarskjöld''s death; U Thant; Kitona; Elisabethville.'
        c2: 'The Congo''s civil war and the UN''s war in Katanga. The end of secession; the UN''s departure; Tshombe prime minister; Stanleyville taken; Dragon Rouge; Mobutu''s coup.'
  - edit:
      id: cal.thread.congress
      base: f7a27fa3
      set:
        c: 'Congress as an institution: its leaders and sessions. Rayburn''s death; McCormack Speaker; the second session''s end, Oct. 13, 1962.'
        c2: 'Congress as an institution: its leaders and sessions. The 87th''s end, Jan. 3, 1963; the 88th''s opening; Clark''s Senate establishment; the first session''s end, Dec. 30, 1963; the pay bill defeated, then passed; Edward Kennedy''s crash; Engle''s death; the 88th''s end, Oct. 3, 1964; the caucus; the 89th''s opening; Ford for Halleck; Watson leaves; the Joint Committee on the Organization of the Congress; the first session''s end, Oct. 23, 1965; Byrd resigns; the second session, Jan. 10, 1966.'
  - edit:
      id: cal.thread.court
      base: 55fc6565
      set:
        c: 'The Supreme Court''s October 1960 to October 1965 Terms, its new Justices, and Congress''s answers. *Mapp*; *Baker v. Carr*, argued, reargued, decided; *Engel v. Vitale*; White and Goldberg for Whittaker and Frankfurter.'
        c2: 'The Supreme Court''s October 1960 to October 1965 Terms, its new Justices, and Congress''s answers. *Gideon*; *Gray v. Sanders*; the sit-in cases; *Schempp*; *Wesberry*; *New York Times v. Sullivan*; *Griffin*; *Reynolds v. Sims*; *Bell*, *Escobedo*; the Tuck bill and the Dirksen rider; *Heart of Atlanta*; *Louisiana v. United States*; *Zemel*; *Lamont*; *Griswold*; Goldberg to the UN, Fortas for him; Dirksen''s apportionment amendment; *Albertson*.'
  - edit:
      id: cal.thread.crime-and-hijacking
      base: f4672931
      set:
        c: 'Robert Kennedy''s crime bills, the first hijackings to Cuba, and Johnson''s crime program. Three hijackings, May–Aug. 1961; aircraft piracy a federal crime; the Wire and Travel Acts.'
        c2: 'Robert Kennedy''s crime bills, the first hijackings to Cuba, and Johnson''s crime program. Hoffa convicted; the 1965 crime message; the Crime Commission; the Law Enforcement Assistance Act.'
  - edit:
      id: cal.thread.cuba
      base: d2311e82
      set:
        c: 'Cuba short of the missile crisis, and after. The Bay of Pigs and its inquiry; Mongoose; Punta del Este; the embargo; Northwoods; the prisoners'' ransom; the Orange Bowl.'
        c2: 'Cuba short of the missile crisis, and after. NSAM 213; the exile raids; the sabotage program; Attwood and Lechuga; Guantanamo''s water; Camarioca and the refugee airlift.'
  - edit:
      id: cal.thread.defense
      base: ae60541f
      set:
        c: 'Strategy and the defense budget under McNamara. No missile gap; the March budget; the Berlin increase; civil defense to the Pentagon; Gilpatric at Hot Springs; the RS-70; counterforce at Ann Arbor.'
        c2: 'Strategy and the defense budget under McNamara. The TFX hearings; the draft extended; *Thresher*; Anderson and Korth out; the A-11; the draft study; the base-closing veto.'
  - edit:
      id: cal.thread.desegregation-public-places
      base: bcba325b
      set:
        c: 'Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. Burton; the Freedom Rides and the ICC order; Albany; Garner. Gallup on the Freedom Riders and on integration.'
        c2: 'Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. Birmingham; the sit-in cases; Watson; Jackson; the public accommodations title; Heart of Atlanta. Gallup on integration.'
  - edit:
      id: cal.thread.desegregation-schools
      base: a6a5e1c8
      set:
        c: 'Schools and universities opened under federal court orders, each event in its own thread. Georgia; Atlanta; Meredith at Oxford. Gallup on school integration.'
        c2: 'Schools and universities opened under federal court orders, each event in its own thread. Gantt at Clemson; Goss; the schoolhouse door; Alabama''s schools in September; Prince Edward''s Free Schools; the New York boycott. Gallup on school integration.'
  - edit:
      id: cal.thread.economy
      base: 770543cb
      set:
        c: 'The recession of 1960–61, the recovery, and the tax cut. The task force; the trough; the Fed''s long rates; the gap; the debt limit; the 1962 Report; the May slide; depreciation; the investment credit; the Economic Club.'
        c2: 'The recession of 1960–61, the recovery, and the tax cut. The tax message; the House''s 271–155; the discount rate to 3½; the interest equalization tax; Johnson''s budget; the 1964 Report and budget; the Revenue Act of 1964; the Interest Equalization Tax Act; the discount rate to 4; the 1965 budget and Report; the gold cover; the excise tax cut; Martin at Columbia; the coinage act; the Fed''s December rise.'
