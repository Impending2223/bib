      id: cal.thread.europe-and-the-alliance
      base: 44c344b7
      set:
        c: 'Britain, Europe, and the alliance''s nuclear arms. Bermuda; the Declaration of Interdependence; Skybolt cancelled; Nassau.'
        c2: 'Britain, Europe, and the alliance''s nuclear arms. De Gaulle''s veto; the Élysée treaty; the MLF; Kennedy in Europe; Erhard at the Ranch; Cyprus, from the London conference to the Turkish strikes; France recognizes Peking; Wilson''s victory; the sterling crisis; Wilson''s visit; Churchill''s funeral; Rhodesia; Erhard in Washington.'
  - edit:
      id: cal.thread.farm
      base: 682d21e5
      set:
        c: 'Price supports and production controls. The emergency feed grain program; the farm bill''s defeat and the 1962 act.'
        c2: 'Price supports and production controls. The wheat referendum; the Feed Grain Act of 1963; the Agricultural Act of 1964; the Food Stamp Act; the Food and Agriculture Act of 1965.'
  - edit:
      id: cal.thread.foreign-aid
      base: 8f880a0f
      set:
        c: 'The aid program remade, and cut. The March message; AID created, long-term borrowing denied; the 1962 act and the Hickenlooper amendment.'
        c2: 'The aid program remade, and cut. The Clay report; the 1963 cuts; the Christmas Eve vote; the 1964 message; the IDA bill; the Foreign Assistance Act of 1964; Food for Peace extended; the UAR ban; the Foreign Assistance Act of 1965.'
