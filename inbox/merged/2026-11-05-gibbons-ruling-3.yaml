      id: cal.1966-01-21.vietnam-congress-foreign-relations
      when: Jan. 21
      date: '1966-01-21'
      thread: vietnam-congress-foreign-relations
      c: 'Marcy to Fulbright, an expanded and amended version of his memorandum on the pause as the "last clear chance to
        stop short of unlimited escalation": withdraw under United Nations auspices rather than escalate; only ending the
        war will win the Democrats the elections of 1966 and 1968.'
      n: '[[w.gibbons-u-s-government-and]], IV, 138 n.72. Check: the changes in the revised version. Names: Marcy, Fulbright.'
      src:
        c: 8b5382e4
        rows:
        - 'w.gibbons-u-s-government-and IV, 138 n: all'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
