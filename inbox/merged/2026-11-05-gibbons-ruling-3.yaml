- add:
    entry:
      id: cal.1966-01-22.opinion
      when: Jan. 22
      date: '1966-01-22'
      thread: opinion
      also:
      - vietnam-pause
      c: 'Lloyd Free of the Research Council, commissioned by the White House, using Gallup''s facilities, "Public Opinion
        Regarding Bombing of North Vietnam": the public "divided, confused"; hold off resuming the bombing "so as not to spoil"
        a chance of talks, 42 percent; resume, 44; don''t know, 14. "No public mandate either for continuing the pause in
        the bombing or for starting bombing again."'
      n: '[[w.gibbons-u-s-government-and]], IV, 154–55. To check: the Research Council, "Public Opinion Regarding Bombing
        of North Vietnam," Jan. 22, 1966, Office Files of Fred Panzer, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 154 n.124).'
      src:
        c: 4ffb4e3b
        rows:
        - 'w.gibbons-u-s-government-and IV, 154–55: all'
        - 'via x.1966-01-22.the-research-council-public-opinion-regarding: all'
