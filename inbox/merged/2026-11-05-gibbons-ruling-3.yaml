      c: 'Bohlen, Ambassador to France, to Llewellyn Thompson, a personal letter: "What bothers me is the possibility that
        there are some people in the United States government who believe that bombing of North Vietnam will induce or force
        Hanoi to the conference table"; "a very fallacious argument."'
      n: '[[w.gibbons-u-s-government-and]], IV, 150. To check: [[w.bohlen-witness-to-history-1929]], 524 (cited by [[w.gibbons-u-s-government-and]],
        IV, 150 n.110). Names: Bohlen, Thompson.'
