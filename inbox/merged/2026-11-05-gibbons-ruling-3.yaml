- add:
    entry:
      id: cal.1966-01-24.vietnam-pause-5
      when: Jan. 24
      date: '1966-01-24'
      thread: vietnam-pause
      c: 'McGeorge Bundy to Johnson, 5 p.m., "Pros and cons of immediate resumption of the bombing": "I think this question
        narrows to one of timing. The arguments for a complete end of the bombing are unacceptable, and no one wants to bomb
        Hanoi tomorrow morning"; resume within two days, or wait a week or two.'
      n: '[FRUS 1964–68, IV, doc. 39](https://history.state.gov/historicaldocuments/frus1964-68v04/d39). [[w.gibbons-u-s-government-and]],
        IV, 152. Made public: FRUS 1964–68, IV (1998). Check: Gibbons reads "a complete end to the bombing." Names: McGeorge
        Bundy, Johnson.'
      src:
        c: c92f6677
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d39: all'
        - 'w.gibbons-u-s-government-and IV, 152: all'
        - 'via x.1966-01-24.mcgeorge-bundy-to-johnson-pros-and: all'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
