ops:
- add:
    entry:
      id: cal.1963-11-01.vietnam-saigon-3
      when: Nov. 1–2
      date: '1963-11-01'
      thread: vietnam-saigon
      c: Saigon. Thiệu leads his Fifth Infantry Division's troops in the attack on Diệm's guard that decides the coup.
      n: '[[w.berman-lyndon-johnsons-war]], 79. Check: the day and the hour; Berman names no source. See [[cal.1963-11-01.vietnam]]. Names: Nguyễn Văn Thiệu, Ngô Đình Diệm.'
      tags: [name:nguyen-van-thieu, name:ngo-dinh-diem, place:saigon]
- add:
    entry:
      id: cal.1968-01-11.vietnam-khe-sanh
      when: Jan. 11
      date: '1968-01-11'
      thread: vietnam-khe-sanh
      c: American intelligence detects a buildup of North Vietnamese forces in the Laotian panhandle west of the DMZ, threatening Khe Sanh, two more divisions.
      n: '[[w.berman-lyndon-johnsons-war]], 139–40. Check: the report and its day; Berman names no source. See [[cal.1968-01-08.vietnam-2]].'
      tags: [place:khe-sanh]
- add:
    entry:
      id: cal.1967-08.opinion
      when: Aug.
      date: '1967-08'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, early August: Johnson''s handling of Vietnam, disapprove 54 percent, the highest yet.'
      n: '[[w.berman-lyndon-johnsons-war]], 60. Check: the release, its day and field dates; Berman names no source; the reading of July 13–18 gives 52 ([[cal.1967-07-30.opinion]]). Names: Johnson.'
      tags: [name:johnson-lyndon-b]
- add:
    entry:
      id: cal.1968-04.opinion
      when: Apr.
      date: '1968-04'
      thread: opinion
      c: 'Harris, after Johnson''s withdrawal: his job approval 57 percent, disapproval 43; at the start of March, 43 and 57.'
      n: '[[w.berman-lyndon-johnsons-war]], 202. Check: the release, its day and field dates; Berman names no source. Names: Johnson.'
      tags: [name:johnson-lyndon-b]
