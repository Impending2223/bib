# cal.1962-05-06.laos: FRUS XXIV, docs. 343, 344
- add-words:
    id: cal.1962-05-06.laos
    after: end
    words: An artillery barrage early that morning, and an infantry attack comes into the town; two Americans of a twelve-man special forces training team there are lifted out by helicopter.
    text: '[FRUS 1961–63, XXIV, doc. 343](https://history.state.gov/historicaldocuments/frus1961-63v24/d343)'
- add:
    entry:
      id: cal.1962-05-06.laos-2
      when: May 6
      date: '1962-05-06'
      time: 1962-05-06T14:15Z
      time_zone: America/New_York
      place: washington
      thread: laos
      c: '10:15 a.m., by telephone. Ball tells Bundy and U. Alexis Johnson of the barrage and the attack on Nam Tha, the two Americans taken out by helicopter. Johnson: the first clear, open breach of the cease-fire; Phoumi had reinforced Nam Tha against advice. A message for Rusk to send Gromyko; MacDonald to work on Souphanouvong; Souvanna to be reached in Paris. Ball to call the President before he goes boating.'
      n: '[FRUS 1961–63, XXIV, doc. 343](https://history.state.gov/historicaldocuments/frus1961-63v24/d343). See [[cal.1962-05-06.laos]]. Names: Ball, Bundy, U. Alexis Johnson, Phoumi Nosavan, Rusk, Gromyko, Souphanouvong, Souvanna Phouma.'
      tags:
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:johnson-u-alexis
      - name:phoumi-nosavan
      - name:rusk-dean
      - name:gromyko-andrei
      - name:souphanouvong
      - name:souvanna-phouma
- add:
    entry:
      id: cal.1962-05-06.laos-3
      when: May 6
      date: '1962-05-06'
      time: 1962-05-06T14:45Z
      time_zone: America/New_York
      place:
      - washington
      - palm-beach
      thread: laos
      c: '10:45 a.m. Ball to Kennedy at Palm Beach, by telephone, on Nam Tha: the telegram to Gromyko through Thompson, MacDonald to Souphanouvong, Souvanna in Paris; Harriman reads the attack as a warning to Phoumi. Kennedy wants the Americans evacuated interviewed at once, whether there was fighting; he asks about the *New York Times* story that morning of 200 Chinese in it.'
      n: '[FRUS 1961–63, XXIV, doc. 344](https://history.state.gov/historicaldocuments/frus1961-63v24/d344); [doc. 343](https://history.state.gov/historicaldocuments/frus1961-63v24/d343) (the President at Palm Beach). See [[cal.1962-05-06.laos]]. Names: Ball, Kennedy, Gromyko, Thompson, Souphanouvong, Souvanna Phouma, Harriman, Phoumi Nosavan.'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:gromyko-andrei
      - name:thompson-llewellyn-e
      - name:souphanouvong
      - name:souvanna-phouma
      - name:harriman-w-averell
      - name:phoumi-nosavan
