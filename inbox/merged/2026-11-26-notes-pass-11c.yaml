    - Robert Kennedy
    - Houphouet-Boigny
    - Chayes
    tags:
    - name:dillon-c-douglas
    - name:mcnamara-robert-s
    - name:kennedy-robert-f
    - name:houphouet-boigny-felix
    - name:chayes-abram
- add:
    entry:
      id: cal.1961-12-12.africa
      when: Dec. 12
      date: '1961-12-12'
      place: washington
      thread: africa
      c: Kennedy gives his final approval of the Volta project, the legal review he asked for done by State and Justice.
      n: '[FRUS 1961–63, XXI, doc. 240](https://history.state.gov/historicaldocuments/frus1961-63v21/d240) (Bundy''s notes of the NSC of Dec. 5, drafted Dec. 18). See [[cal.1961-12-05.africa]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
# cal.1962-04-04.vietnam: FRUS II, doc. 141 dates the memorandum at Washington, Galbraith in the United States: the line corrected by the audit (R22), and the reader's Check settled
- edit:
    id: cal.1962-04-04.vietnam
    base: d0e9c8d4
    kind: correct
    set:
      place: washington
      c: 'Galbraith, in Washington, to Kennedy: seek a neutral settlement, through Harriman.{1} Kennedy sends it to McNamara;{2} the Chiefs reject it.{3}'
      n: '[FRUS 1961–63, II, doc. 141](https://history.state.gov/historicaldocuments/frus1961-63v02/d141) (the memorandum: a political solution, Harriman to approach the Russians; sent by Forrestal to McNamara for comment, Apr. 7). FRUS, II, doc. 141, dates the memorandum Washington, Apr. 4; Galbraith was in the United States Mar. 27–Apr. 8, to testify on India, and sent it under a covering letter of Apr. 5. [[w.gibbons-u-s-government-and]], II, 120; [[w.schlesinger-robert-kennedy-and-his]], 709 (in April 1962 Galbraith proposes "phased withdrawal" as an element in a larger deal with the Soviet Union, which might get Hanoi to call off the Viet Cong; Kennedy asks Defense for comment; Lemnitzer, chairman of the JCS, denounces Galbraith for wishing the United States "to seek disengagement from what is now a well-known commitment"; no day, not Harriman or McNamara). [FRUS vol. 2](https://history.state.gov/historicaldocuments/frus1961-63v02). [[w.selverstone-kennedy-withdrawal]], 65–66 (the memorandum; the review at the Pentagon; the Chiefs against). [[w.preston-war-council]], 111 (Galbraith''s memorandum; Forrestal sends it to McNamara). To check: [[w.galbraith-ambassadors-journal]]; the Joint Chiefs'' comment, *Pentagon Papers*, Gravel ed., II, 671–72 (cited by [[w.gibbons-u-s-government-and]], II, 120 n.119). See [[cal.1961-01-28.vietnam]]. Check: FRUS has Forrestal, not Kennedy, send it to McNamara. Names: Galbraith, Harriman, McNamara.'
    unset:
    - time_range
    - time_band
    - time_zone
    - range_basis
- add-words:
    id: cal.1962-04-04.vietnam
    after: Kennedy sends it to McNamara;
    words: Forrestal sends it to McNamara for the Defense Department's comments on Apr. 7;
    text: '[FRUS 1961–63, II, doc. 141](https://history.state.gov/historicaldocuments/frus1961-63v02/d141)'
- names:
