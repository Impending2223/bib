# cal.1961-08-19.berlin-and-vienna: FRUS XIV, docs. 120, 121. The talk with Adenauer at Bonn is its own entry (below; the audit)
- add-words:
    id: cal.1961-08-19.berlin-and-vienna
    after: Johnson and Clay in Berlin.
    words: Johnson carries Kennedy's letter of Aug. 18 to Mayor Brandt.
    text: '[FRUS 1961–63, XIV, doc. 120](https://history.state.gov/historicaldocuments/frus1961-63v14/d120); [doc. 121](https://history.state.gov/historicaldocuments/frus1961-63v14/d121)'
- names:
    id: cal.1961-08-19.berlin-and-vienna
    add:
    - Brandt
    - Kennedy
    tags:
    - name:brandt-willy
    - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-08-19.berlin-and-vienna-2
      when: Aug. 19
      date: '1961-08-19'
      place: bonn
      thread: berlin-and-vienna
      c: 'Bonn. Johnson with Adenauer. Adenauer: economic sanctions to be reviewed by the best economic minds as a matter of extreme urgency; he will lengthen conscription, but announce it after the election, and put more Germans under arms if restrictions are lifted. Johnson asks more of the British, the French and the Germans, more and better-trained West German police among the first steps.'
      n: '[Report by Vice President Johnson](https://history.state.gov/historicaldocuments/frus1961-63v14/d121), FRUS 1961–63, XIV, doc. 121 (Johnson''s report on the visit of Aug. 19–20; the day of the talk from its note 2). To check: memorandum of Johnson''s conversation with Adenauer, Aug. 19, 1961, *Declassified Documents*, 1983, 2514 (cited by FRUS 1961–63, XIV, doc. 121 n.2). See [[cal.1961-08-19.berlin-and-vienna]]. Names: Johnson, Adenauer.'
      tags:
      - name:johnson-lyndon-b
      - name:adenauer-konrad
- add:
    entry:
      id: cal.1961-08-19.berlin-and-vienna-3
      when: Aug. 19
      date: '1961-08-19'
      place: west-berlin
      thread: berlin-and-vienna
      c: Saturday. Johnson addresses the House of Representatives of West Berlin.
      n: '[Report by Vice President Johnson](https://history.state.gov/historicaldocuments/frus1961-63v14/d121), FRUS 1961–63, XIV, doc. 121. See [[cal.1961-08-19.berlin-and-vienna]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1961-08-19.berlin-and-vienna-4
      when: Aug. 19
      date: '1961-08-19'
      place: west-berlin
      thread: berlin-and-vienna
      follows:
      - cal.1961-08-19.berlin-and-vienna-3
      c: 'Johnson and Brandt in private, by Johnson''s report his most significant talk of the visit. Brandt apologetic for his letter to Kennedy and its unauthorized publication. Johnson: no three-power arrangement in place of the four-power treaty; no appeal to the United Nations; West Berlin to do far more for its own defense. Brandt agrees.'
      n: '[Report by Vice President Johnson](https://history.state.gov/historicaldocuments/frus1961-63v14/d121), FRUS 1961–63, XIV, doc. 121 (Johnson''s account: "Immediately following that address"). To check: memoranda of Johnson''s conversations with Brandt, Aug. 20, 1961, *Declassified Documents*, 1976, 258 B, and 1983, 2515 (cited by FRUS 1961–63, XIV, doc. 121 n.2). See [[cal.1961-08-19.berlin-and-vienna]]. Names: Johnson, Brandt. Check: the day; the report puts the talk right after the address of Saturday, Aug. 19, its editors'' note the conversations with Brandt on Aug. 20.'
      tags:
      - name:johnson-lyndon-b
      - name:brandt-willy
# cal.1961-08-29.laos: FRUS XXIV, doc. 172
- add-words:
    id: cal.1961-08-29.laos
    after: end
    words: 'Kennedy: no commitment to SEATO Plan 5 "without regard to whatever else may happen in the world." Lemnitzer: the plan starts with about 13,000 Americans, 4,000 ground combat troops in Laos and nearly 9,000 supporting forces in Thailand.'
    text: '[FRUS 1961–63, XXIV, doc. 172](https://history.state.gov/historicaldocuments/frus1961-63v24/d172)'
# cal.1961-10-18.vietnam: the call on Diệm is its own entry (below; the audit)
- add:
    entry:
      id: cal.1961-10-18.vietnam-2
      when: Oct. 18
      date: '1961-10-18'
      place: saigon
      thread: vietnam
      c: 'Saigon. Taylor, Rostow and Cottrell, with Nolting, call on Ngô Đình Diệm. Taylor asks why his view of American or SEATO forces has changed; Diệm: because of Laos. He asks for tactical aviation, helicopter companies, coastal patrol forces and logistic support; by Nolting''s report he seems to want a bilateral defense treaty and plans for the use of American forces, perhaps combat forces. The emergency decree, he says, goes to the National Assembly for approval within thirty days; security and the floods both prompted it.'
      n: '[FRUS 1961–63, I, doc. 174](https://history.state.gov/historicaldocuments/frus1961-63v01/d174) (Nolting, telegram 508, Saigon, Oct. 18, noon). [[w.preston-war-council]], 91 (Nolting: Diệm "seemed to be talking about combat forces"). See [[cal.1961-10-18.vietnam]]. Names: Taylor, Rostow, Cottrell, Nolting, Ngô Đình Diệm.'
      tags:
      - ok:fields-time
      - name:taylor-maxwell
      - name:rostow-walt-w
      - name:cottrell-sterling-j
      - name:nolting-frederick-e-jr
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1961-10-25.vietnam-2
      when: Oct. 25
      date: '1961-10-25'
      time: 1961-10-25T05:00Z
      time_zone: Asia/Ho_Chi_Minh
      place: saigon
      thread: vietnam
      c: 'Saigon, 1 p.m. Taylor to Rusk and U. Alexis Johnson, eyes only, telegram 537: a task force, largely logistical, for flood relief and a military presence, on the order of 6,000 to 8,000 troops, some combat troops among them; it can be withdrawn when done, or phased "into other activities" if the United States wishes to stay longer.'
      n: '[FRUS 1961–63, I, doc. 191](https://history.state.gov/historicaldocuments/frus1961-63v01/d191). See [[cal.1961-10-18.vietnam]]. Names: Taylor, Rusk, U. Alexis Johnson.'
      tags:
      - name:taylor-maxwell
      - name:rusk-dean
      - name:johnson-u-alexis
