- add:
    entry:
      id: cal.1965-08-12.civil-disorders-watts
      when: Aug. 12
      date: '1965-08-12'
      thread: civil-disorders-watts
      c: 'Los Angeles. Finch, Nixon''s campaign director in 1960, now out of politics, at lunch with Theodore White: after the arrest of the night before, Watts on the edge of explosion; no one understands it, Mayor Yorty least of all. White, by his account, dismisses the warning.'
      n: '[[w.white-making-of-the-president-1969]], 23–24. White''s own account. See [[cal.1965-08-11.states-and-cities]]. Names: Finch, Theodore White, Yorty.'
      src:
        rows:
        - 'w.white-making-of-the-president-1969 23–24: all'
        c: 338e4463
      tags:
      - name:finch-robert-h
      - name:white-theodore-h
      - name:yorty-sam
    section: '196508'
- add:
    entry:
      id: cal.1965-03.republican-party
      when: Mar.
      date: 1965-03
      thread: republican-party
      c: Karl Hess, Goldwater's chief speechwriter in 1964, out of work, goes from office to office of the conservative members who had courted him; none will hire him. He asks to be put on a patronage list even as an elevator operator in a House or Senate office building; no one will put his name down. By summer he welds bulldozers on the night shift in a Washington machine shop.
      n: '[[w.white-making-of-the-president-1969]], 32 & n.1. Check: the month; White dates the pleading to the spring of 1965, the welding job to the summer. Names: Hess, Goldwater.'
      src:
        rows:
        - 'w.white-making-of-the-president-1969 32: all'
        c: 7ec17eaf
      tags:
      - name:hess-karl
      - name:goldwater-barry-m
    section: '196503'
- add:
    entry:
      id: cal.1967-12.elections-1968-nixon
      when: Dec.
      date: 1967-12
      thread: elections-1968-nixon
      c: 'The shuttle from Washington to New York. Nixon, Chapin with him, sits by Theodore White and questions him on his work; then politics: Robert Kennedy trapped as a Democrat under a sitting Democratic President; Romney ill-advised, his strength domestic affairs, he should have dodged Vietnam; polls on issues useful, polls of personal standing "a waste of money."'
      n: '[[w.white-making-of-the-president-1969]], 144–45. White''s own account. Check: the day; White puts it "a few weeks" after his call on Nixon of Nov. 10, 1967. Names: Nixon, Chapin, Theodore White, Robert Kennedy, Romney.'
      src:
        rows:
        - 'w.white-making-of-the-president-1969 144–45: all'
        c: fecfb3c7
      tags:
      - name:nixon-richard-m
      - name:chapin-dwight-l
      - name:white-theodore-h
      - name:kennedy-robert-f
      - name:romney-george-w
    section: '196712'
- add:
    entry:
      id: cal.1968-03-31.elections-1968-mccarthy
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-mccarthy
      c: 'Milwaukee, McCarthy''s student headquarters at the Wisconsin Hotel, Sunday. The canvass''s tallies by congressional district: the 1st, 43,000 polled, McCarthy over Johnson 60 to 40; the 2nd, 70 to 30; the 3rd, 67 to 33; McCarthy ahead by like margins in every district but the 4th, Milwaukee''s South Side, Johnson 51 to 49. Some 8,000 students in the State; over 800,000 doorbells rung.'
      n: '[[w.white-making-of-the-president-1969]], 121–22. Check: the canvass''s own figures. See [[cal.1968-03-31.elections-1968-8]]. Names: McCarthy, Johnson.'
      src:
        rows:
        - 'w.white-making-of-the-president-1969 121–22: all'
        - 'via x.1968-03-31.mccarthy-wisconsin-canvass-tallies: B-E'
        c: 47fbf1ff
      tags:
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - state:wi
      - city:milwaukee
