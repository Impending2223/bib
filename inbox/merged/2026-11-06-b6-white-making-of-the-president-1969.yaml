    entry:
      id: cal.1968-11-05.elections-1968-humphrey
      when: Nov. 5
      date: '1968-11-05'
      thread: elections-1968-humphrey
      c: Humphrey, after his telethon and a party at a friend's in Beverly Hills, flies through the night to Minnesota and votes at the Marysville township hall; out of sight until shortly before midnight, then the Leamington Hotel, Minneapolis.
      n: '[[w.white-making-of-the-president-1969]], 395. Names: Humphrey.'
      src:
        rows:
        - 'w.white-making-of-the-president-1969 395: all'
        c: 50b75be9
