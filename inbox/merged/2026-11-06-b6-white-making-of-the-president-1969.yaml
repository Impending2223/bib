      c: Chicago, the convention week. The tickets in the hands of Criswell, the party's treasurer, Johnson's man. Each morning Humphrey's son-in-law, Bruce Solomonson, lines up with the favor-seekers outside Criswell's office for extra gallery tickets for the Vice President's family.
      n: '[[w.white-making-of-the-president-1969]], 271. Check: the days; White: "every morning." Names: Criswell, Humphrey.'
      src:
