      date: '1968-08-22'
      thread: elections-1968-nixon
      c: Nixon, from Key Biscayne, sails to Walker Cay to fish, the Thursday before the Democratic convention; back to the mainland Saturday night.
      n: '[[w.white-making-of-the-president-1969]], 320 (the days by the convention''s opening, Monday, Aug. 26). Names: Nixon.'
