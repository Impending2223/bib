- add:
    entry:
      id: cal.1968-11-06.elections-1968-humphrey
      when: Nov. 6
      date: '1968-11-06'
      thread: elections-1968-humphrey
      c: Minneapolis, the Leamington, by 1 a.m. Humphrey's staff knows he cannot win in the electoral college; their hope, that Wallace deny Nixon a majority and the election go to the House. A fight there, they think, only if Humphrey wins the popular vote. Fading by four, when he goes to sleep.
      n: '[[w.white-making-of-the-president-1969]], 395. See [[cal.1968-11-05.elections-1968-humphrey]]. Names: Humphrey, Wallace, Nixon.'
