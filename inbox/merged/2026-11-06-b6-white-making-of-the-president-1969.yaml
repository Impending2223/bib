      id: cal.1968-11-05.elections-1968-nixon
      when: Nov. 5
      date: '1968-11-05'
      thread: elections-1968-nixon
      c: 'Los Angeles, the Century Plaza, election day. Nixon up at 7:20 by his log, after bed at 1:25. Nearly an hour on the telephone: Mitchell in New York, Norman Chandler of the *Los Angeles Times*, Mrs. Eisenhower, Chotiner, his brother Edward, Stans; Haldeman, Ehrlichman and Garment at intervals.'
      n: '[[w.white-making-of-the-president-1969]], 388. Names: Nixon, Mitchell, Chotiner, Stans, Haldeman, Garment.'
      src:
        rows:
        - 'w.white-making-of-the-president-1969 388: all'
        - 'via x.1968-11-05.nixon-log-election-day: B'
        c: 7bc6c92f
      tags:
      - name:nixon-richard-m
      - name:mitchell-john-n
      - name:chotiner-murray-m
      - name:stans-maurice-h
      - name:haldeman-h-r
      - name:garment-leonard
    section: '196811'
- add:
    entry:
      id: cal.1968-11-05.elections-1968-nixon-2
      when: Nov. 5
      date: '1968-11-05'
      thread: elections-1968-nixon
      c: 'Aboard the campaign plane, from Los Angeles at 9:45, Pacific time. Nixon calls his family forward: if the voters still care most about peace, a big win; if they have been reassured on peace and turn to their pocketbooks, a loss. The bombing halt could cost three to five million votes, in the East more than the South or Midwest. No one to turn on television before nine in New York. By Nixon''s account to White.'
      n: '[[w.white-making-of-the-president-1969]], 388–89. Names: Nixon.'
      follows:
      - cal.1968-11-05.elections-1968-nixon
      src:
        rows:
        - 'w.white-making-of-the-president-1969 388–89: all'
        - 'via x.undated.nixon-recollection-to-white-election-day: B-E'
        c: 5ff89c49
      tags:
      - name:nixon-richard-m
      - name:nixon-pat
    section: '196811'
- add:
    entry:
      id: cal.1968-11-05.elections-1968-nixon-3
      when: Nov. 5
      date: '1968-11-05'
      thread: elections-1968-nixon
      c: 'The flight east. Nixon thanks his writers, Price, Buchanan, Safire, Keogh, and asks whether the radio speeches did any good; then the media group, the political staff, the wives. Ellsworth: Philadelphia voting heavily. Newark at 6:15 p.m.; the Waldorf Towers, Suite 35H, at 7:05.'
      n: '[[w.white-making-of-the-president-1969]], 389–90. Names: Nixon, Price, Buchanan, Safire, Keogh, Ellsworth.'
      follows:
      - cal.1968-11-05.elections-1968-nixon-2
      src:
        rows:
        - 'w.white-making-of-the-president-1969 389–90: all'
        c: 2ad727d3
      tags:
      - name:nixon-richard-m
      - name:price-raymond-k-jr
