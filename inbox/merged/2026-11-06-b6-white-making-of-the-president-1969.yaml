      date: '1968-08-27'
      thread: elections-1968-humphrey
      also:
      - elections-1968-chicago
      c: 'Chicago, late Tuesday. Humphrey, back from his son Robert''s wedding-anniversary party, with a few aides in his suite on his two questions left: who should nominate him, and whom to choose for Vice President. Asleep after one.'
      n: '[[w.white-making-of-the-president-1969]], 290. Names: Humphrey.'
