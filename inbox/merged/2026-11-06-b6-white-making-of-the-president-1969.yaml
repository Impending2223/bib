      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      c: Schlesinger, at the convention two days in a McGovern button, flies to Japan the morning after the opening.
      n: '[[w.white-making-of-the-president-1969]], 266. White: he sensed disaster coming. Names: Schlesinger, McGovern.'
      src:
