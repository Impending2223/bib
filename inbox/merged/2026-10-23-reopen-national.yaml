patch: reopen-national
by: the reopened-sources agent (National), Oct. 23, 2026
ops:
- edit:
    id: cal.1962-01-23.right-and-the-military
    base: f237db14
    set:
      n: 'Daily Digest, [108 Cong. Rec. D15](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=13) (Jan. 23, 1962): Burke the first witness. *Military Cold War Education and Speech Review Policies* (K–J Cong. II.J.3): the hearings, [pt. 1](https://www.govinfo.gov/app/details/CHRG-87shrg88735Op1) (Jan. 23–31, 1962), of six; the subcommittee''s [report](https://www.govinfo.gov/app/details/CPRT-87SPRT90625) (1962). [[w.crespino-strom-thurmonds-america]]. See [[cal.1961-08-02.right-and-the-military]]. Names: Stennis, Thurmond.'
- edit:
    id: cal.1961-01-16.welfare-la
    base: 51c70034
    set:
      c: Flemming, Secretary of Health, Education, and Welfare, rules that a State may not deny Aid to Dependent Children for an unsuitable home while the children remain in it; Federal funds to be withheld after June 30, 1961. Louisiana's "suitable home" law of 1960 had cut 24,000 children from the rolls in August 1960. Check the day.
      n: '*Social Security Bulletin*, [Dec. 1960, 1](https://archive.org/details/sim_social-security-bulletin_1960-12_23_12/page/n2/mode/1up) (Louisiana, August: 6,400 families, 24,000 children); [July 1961, 19](https://archive.org/details/sim_social-security-bulletin_1961-07_24_7/page/n20/mode/1up) (the ruling, "in January 1961"; its effect put off by Pub. L. 87-31). [Wikipedia, "Flemming Rule"](https://en.wikipedia.org/wiki/Flemming_Rule). [[w.bell-aid-to-dependent-children]]; [[w.fairclough-race-and-democracy]]. Names: Flemming.'
- edit:
    id: cal.1960-06-02.economy
    base: 203c23b4
    set:
      c: The Federal Reserve eases. The discount rate cut from 4 to 3½ percent at Philadelphia and San Francisco, Martin's Board approving. In effect June 3; New York and eight others June 10.
      n: '[*Federal Reserve Bulletin*, July 1960, 756](https://fraser.stlouisfed.org/files/docs/publications/FRB/1960s/frb_071960.pdf#page=32) (the rates in effect, by Bank). [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.friedman-monetary-history-of-the]]; [[w.stein-fiscal-revolution-in-america]]. Names: Martin.'
- edit:
    id: cal.1963-07-26.civil-rights-the-executive
    base: dfc22373
    set:
      n: 'Dep''t of Defense Directive 5120.36, "Equal Opportunity in the Armed Forces" (July 26, 1963), quoted in part in [[w.macgregor-integration-of-the-armed]], 548 (ch. 22). Names: McNamara, Gesell.'
- edit:
    id: cal.1966-02-15.amendments
    base: 9ce04622
    set:
      n: '*Congressional Tenure of Office: Hearings before the House Committee on the Judiciary and Subcommittee No. 5*, 89th Cong. [179](https://www.govinfo.gov/content/pkg/CHRG-89hhrg60990/pdf/CHRG-89hhrg60990.pdf#page=183) (1965–66); [Statement by Attorney General Nicholas deB. Katzenbach](https://www.justice.gov/ag/aghistory/katzenbach/1966/02-15-1966.pdf) (Feb. 15, 1966). See [[cal.1966-01-20.amendments]]. Names: Celler, Katzenbach.'
- edit:
    id: cal.1965-08-18.amendments
    base: 718111c3
    set:
      n: 'Daily Digest, [111 Cong. Rec. D482](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=480) (Aug. 18, 1965). *Congressional Tenure of Office: Hearings before the House Committee on the Judiciary and Subcommittee No. 5*, 89th Cong. (1965–66) ([govinfo](https://www.govinfo.gov/app/details/CHRG-89hhrg60990)). [Congressional Research Service, *Proposals to Change the House Term of Office to Four Years*](https://www.everycrsreport.com/reports/RS21574.html) (2003). [[w.kyvig-explicit-and-authentic-acts]]. Names: Celler.'
- edit:
    id: cal.1964-01-23.baker
    base: ed9cb152
    set:
      c: 'Johnson, at a news conference called for 5 p.m.: insurance on his life, bought in 1957 by the family company, Reynolds taking a commission; $78,000 in premiums paid. The stereo set a gift of "the Baker family."'
      n: 'The President''s News Conference, [1963–64 Pub. Papers 219](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=303) (Jan. 23, 1964). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). [[w.baker-wheeling-and-dealing]]; [[w.caro-passage-of-power]]. See [[cal.1963-11-22.baker]], [[cal.1964-01-21.baker]]. Names: Johnson, Reynolds, Robert Baker.'
- add:
    entry:
      id: cal.1964-01-21.baker
      when: Jan. 21
      date: '1964-01-21'
      thread: baker
      c: Rules Committee releases Reynolds's closed testimony of Jan. 9 and 17. Advertising time on KTBC, Johnson's Austin station, bought for $1,208 when he wrote Johnson's life insurance; a Magnavox stereo set installed in Johnson's Washington home, July 1959, at Baker's suggestion.
      n: '*Financial or Business Interests of Officers or Employees of the Senate: Hearings Before the S. Comm. on Rules and Administration*, 88th Cong., [pt. 1](https://www.govinfo.gov/app/details/CHRG-88shrg27211p1), at II ("released to the public January 21, 1964"), [35–37](https://www.govinfo.gov/content/pkg/CHRG-88shrg27211p1/pdf/CHRG-88shrg27211p1.pdf#page=39) (1964). See [[cal.1963-11-22.baker]]. Names: Reynolds, Johnson, Robert Baker.'
      tags:
      - name:reynolds-don-b
      - name:johnson-lyndon-b
      - name:baker-robert-g
- add:
    entry:
      id: cal.1965-01-29.succession
      when: Jan. 29
      date: '1965-01-29'
      thread: succession
      also:
      - amendments
      c: Bayh's Subcommittee on Constitutional Amendments hears S.J. Res. 1 and four other resolutions on presidential inability and a vacancy in the Vice Presidency, one day. Katzenbach, Acting Attorney General; Brownell; Marion Folsom; Lewis Powell, the American Bar Association's president-elect.
      n: '*Presidential Inability and Vacancies in the Office of Vice President: Hearing Before the Subcomm. on Constitutional Amendments of the S. Comm. on the Judiciary*, 89th Cong. [(1965)](https://www.govinfo.gov/app/details/CHRG-89shrg42688). See [[cal.1965-01-28.succession]]. Names: Bayh, Katzenbach, Brownell, Marion Folsom, Lewis Powell.'
      tags:
      - name:bayh-birch
      - name:katzenbach-nicholas
      - name:brownell-herbert-jr
      - name:folsom-marion-b
      - name:powell-lewis-f-jr
