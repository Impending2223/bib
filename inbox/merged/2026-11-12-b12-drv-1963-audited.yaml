patch: 2026-11-12-b12-drv-1962-64
by: 'Claude (batch 12 audit, 1963: the DRV''s records, Văn kiện Đảng toàn tập, vol. XXIV), Nov. 12, 2026'
ops:
# op 37 (right): cal.1963-01-02.vietnam-hanoi
- add:
    entry:
      id: cal.1963-01-02.vietnam-hanoi
      when: Jan. 2
      date: '1963-01-02'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 65-NQ/TW on the first stage, about 1961–70, of the Red River''s control and development: the dikes raised against a flood of +13.3 m at Hanoi; temporary flood basins at Tam Nông and Thanh Thủy, in Phú Thọ, and Văn Cốc, in Sơn Tây and Hà Đông; the Chinese experts commended.'
      n: '*Nghị quyết của Bộ Chính trị số 65-NQ/TW về quy hoạch trị thuỷ và khai thác lưu vực sông Hồng thời kỳ đầu*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIV, 8–11. Made public: 2003.'
      tags:
      - polity:drv
      - polity:prc
# op 38 (fixed): cal.1963-01-02.vietnam-hanoi-2
- add:
    entry:
      id: cal.1963-01-02.vietnam-hanoi-2
      when: Jan. 2
      date: '1963-01-02'
      thread: vietnam-hanoi
      c: 'The Secretariat with the standing committee of the Council of Ministers, on the people''s land reclamation: some 160,000 hectares reclaimed in 1961–62, 45 percent of the task set; the course for the years ahead and the policies to be issued.'
      n: '*Thông báo của Ban Bí thư số 42-TB/TW về cuộc Hội nghị giữa Ban Bí thư Trung ương Đảng với Thường vụ Hội đồng Chính phủ về vấn đề nhân dân khai hoang*, Jan. 15, 1963, of the meeting of Jan. 2, signed for the Secretariat by Phạm Chung, acting chief of the office. [[w.van-kien-dang-toan]], XXIV, 50–57. Made public: 2003.'
      tags:
      - polity:drv
# op 39 (right): cal.1963-01-05.vietnam-hanoi
- add:
    entry:
      id: cal.1963-01-05.vietnam-hanoi
      when: Jan. 5
      date: '1963-01-05'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 66-NQ/TW on the 1963 plan, the five-year plan''s third year: farming grew in 1962 despite natural disasters, industry at a fair pace; for 1963, more strength for agriculture, on the campaign to improve the cooperatives'' management and technique; closer direction of the plan from the center to the localities.'
      n: '*Nghị quyết của Bộ Chính trị số 66-NQ/TW về hướng dẫn và nhiệm vụ kế hoạch năm 1963*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIV, 12–32 (the tasks, 19 ff.). Made public: 2003.'
      tags:
      - polity:drv
# op 40 (fixed): cal.1963-01-12.vietnam-hanoi
- add:
    entry:
      id: cal.1963-01-12.vietnam-hanoi
      when: Jan. 12
      date: '1963-01-12'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 67-NQ/TW on the state''s finances for 1963: domestic revenue in 1962, by the revised budget, 80 million below the year''s first plan and 4.3 percent above 1961, the slowest rise in years (28 percent a year in the three years of socialist transformation, 10.5 percent in 1961). For 1963: more revenue, less spending, capital construction at key points, aid to the cooperatives, the state''s reserves of money, materials and foreign currency built up; administrative spending cut about 10 percent below 1962.'
      n: '*Nghị quyết của Bộ Chính trị số 67-NQ/TW về phương hướng thu chi tài chính nhà nước năm 1963*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIV, 40–49. Made public: 2003.'
      tags:
      - polity:drv
# op 41 (right): cal.1963-01-31.vietnam-hanoi
- add:
    entry:
      id: cal.1963-01-31.vietnam-hanoi
      when: Jan. 31
      date: '1963-01-31'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 58-CT/TW on the drought: more than two months without rain, cold and frost since mid-December, over 120,000 hectares dry; forces to be massed against it and the winter-spring crop pressed.'
      n: '*Chỉ thị của Ban Bí thư số 58-CT/TW về việc khẩn trương tập trung lực lượng chống hạn, đẩy mạnh vụ sản xuất Đông - Xuân*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 75–80. Made public: 2003.'
      tags:
      - polity:drv
# op 42 (right): cal.1963-02-01.vietnam-hanoi
- add:
    entry:
      id: cal.1963-02-01.vietnam-hanoi
      when: Feb. 1
      date: '1963-02-01'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 68-NQ/TW on the people''s procuracy: an instrument of the dictatorship, to see the law obeyed, strictly and uniformly, and so to strengthen the dictatorship over counterrevolutionaries and secure the people''s democratic rights.'
      n: '*Nghị quyết của Bộ Chính trị số 68-NQ/TW về công tác kiểm sát*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIV, 81–86. Made public: 2003.'
      tags:
      - polity:drv
# op 43 (fixed): cal.1963-02-11.vietnam-hanoi
- add:
    entry:
      id: cal.1963-02-11.vietnam-hanoi
      when: Feb. 11
      date: '1963-02-11'
      thread: vietnam-hanoi
      c: 'The Secretariat: its resolution no. 69-NQ/TW on organization and Party building in 1963, the members'' political quality, the base organizations, the leadership and methods at the center and in the provinces, cities and districts, the training and management of cadres; and the Central Agriculture Department''s work for 1963, centered on the campaign to improve the cooperatives'' management and technique: the first round finished, the second prepared, the campaign opened in the highlands.'
      n: '*Nghị quyết của Ban Bí thư số 69-NQ/TW về nhiệm vụ và phương hướng công tác tổ chức, xây dựng Đảng năm 1963*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 87–97; *Thông báo của Ban Bí thư số 46-TB/TW, ngày 27 tháng 2 năm 1963, về cuộc họp Ban Bí thư ngày 11-2-1963 bàn về công tác của Ban Nông nghiệp Trung ương trong năm 1963*, signed for the Secretariat by Phạm Chung, acting chief of the office, 170–73. Made public: 2003.'
      tags:
      - polity:drv
# op 44 (fixed): cal.1963-02-16.vietnam-hanoi
- add:
    entry:
      id: cal.1963-02-16.vietnam-hanoi
      when: Feb. 16
      date: '1963-02-16'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 59-CT/TW on local military work in 1963: the Americans and Diệm, the harder beaten in the South, the more they sabotage the North; the militia, self-defense forces and reserves to be built up a step further, politically above all, ready against any enemy sabotage, the reserve army managed, mobilization assured.'
      n: '*Chỉ thị của Ban Bí thư số 59-CT/TW về nhiệm vụ công tác quân sự địa phương năm 1963*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 98–100. Made public: 2003. Names: Ngô Đình Diệm.'
      tags:
      - name:ngo-dinh-diem
      - polity:drv
      - polity:us
# op 45 (fixed): cal.1963-02-19.vietnam-hanoi
- add:
    entry:
      id: cal.1963-02-19.vietnam-hanoi
      when: Feb. 19
      date: '1963-02-19'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 70-NQ/TW opens the campaign "Cải tiến quản lý hợp tác xã, cải tiến kỹ thuật" (improve the cooperatives'' management, improve technique) for all-round, strong and steady farm production: the cooperatives'' yields stalled, in places fallen.'
      n: '*Nghị quyết của Bộ Chính trị số 70-NQ/TW về cuộc vận động "Cải tiến quản lý hợp tác xã, cải tiến kỹ thuật, nhằm phát triển sản xuất nông nghiệp toàn diện, mạnh mẽ và vững chắc"*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXIV, 101–17. Made public: 2003.'
      tags:
      - polity:drv
# op 46 (right): cal.1963-02-23.vietnam-hanoi
- add:
    entry:
      id: cal.1963-02-23.vietnam-hanoi
      when: Feb. 23
      date: '1963-02-23'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 71-NQ/TW on farming in the highlands: the fifth plenum''s line to apply there too, with provisions of its own for the highlands'' conditions; collectivization and production there reviewed.'
      n: '*Nghị quyết của Bộ Chính trị số 71-NQ/TW về vấn đề phát triển nông nghiệp ở miền núi*, signed for the Politburo by Nguyễn Chí Thanh. [[w.van-kien-dang-toan]], XXIV, 118–55. Made public: 2003.'
      tags:
      - polity:drv
# op 47 (right): cal.1963-03-02.vietnam-hanoi
- add:
    entry:
      id: cal.1963-03-02.vietnam-hanoi
      when: Mar. 2
      date: '1963-03-02'
      thread: vietnam-hanoi
      c: 'The Politburo, on the preliminary design of the Thác Bà hydroelectric plant, decides to go on building it: the reservoir''s normal level 58 m, 61.90 m in a ten-thousand-year flood; 108,000 kW; the whole plant done by the end of 1967.'
      n: '*Nghị quyết của Bộ Chính trị số 72-NQ/TW về thiết kế sơ bộ Nhà máy Thuỷ điện Thác Bà*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIV, 178–79. Made public: 2003.'
      tags:
      - polity:drv
# op 48 (right): cal.1963-03-07.vietnam-hanoi
- add:
    entry:
      id: cal.1963-03-07.vietnam-hanoi
      when: Mar. 7
      date: '1963-03-07'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 73-NQ/TW fixes the food obligation for the rest of the first five-year plan: the farm tax and the sales of paddy and maize to the state held at about 17 percent of the harvest for the North, on the average of 1960–62, each locality''s quota in absolute amounts.'
      n: '*Nghị quyết của Bộ Chính trị số 73-NQ/TW về chính sách ổn định nghĩa vụ lương thực trong kế hoạch 5 năm lần thứ nhất*, signed for the Politburo by Phạm Hùng. [[w.van-kien-dang-toan]], XXIV, 180–89 (the rate, 185). Made public: 2003.'
      tags:
      - polity:drv
# op 49 (fixed): cal.1963-03-08.vietnam-hanoi
- add:
    entry:
      id: cal.1963-03-08.vietnam-hanoi
      when: Mar. 8
      date: '1963-03-08'
      thread: vietnam-hanoi
      c: 'The Politburo sets up the Center''s "chỉ đạo riêng" (special direction): members of the Politburo and the Secretariat each to follow a province, city or unit and a base of their own, and those in charge of a field to lead its great campaigns. Trường Chinh for Hà Bắc, Phạm Văn Đồng Hà Đông, Phạm Hùng Hải Dương, Lê Đức Thọ Nam Định, Tố Hữu Thái Bình, Lê Thanh Nghị Haiphong, Nguyễn Văn Trân the Thái Nguyên iron and steel works; Thanh Hóa, Lạng Sơn and Hanoi directed by the Politburo and the Secretariat themselves, Nguyễn Chí Thanh for Thanh Hóa, Lê Văn Lương for Hanoi.'
      n: '*Nghị quyết của Bộ Chính trị số 74-NQ/TW về công tác chỉ đạo riêng của Trung ương*, Mar. 14, of the session of Mar. 8, signed for the Politburo by Lê Đức Thọ; Phạm Văn Đồng "đồng chí Tô" in the text, by the editors'' note. [[w.van-kien-dang-toan]], XXIV, 190–94. Made public: 2003. Names: Trường Chinh, Phạm Văn Đồng, Phạm Hùng, Lê Đức Thọ, Tố Hữu, Lê Thanh Nghị, Nguyễn Văn Trân, Nguyễn Chí Thanh, Lê Văn Lương.'
      tags:
      - name:truong-chinh
      - name:pham-van-dong
      - name:le-duc-tho
      - name:nguyen-chi-thanh
      - polity:drv
# new (from op 49): cal.1963-03-09.vietnam-hanoi
- add:
    entry:
      id: cal.1963-03-09.vietnam-hanoi
      when: Mar. 9
      date: '1963-03-09'
      thread: vietnam-hanoi
      c: 'The Politburo orders the Party''s chief experiences summed up, as the Third Congress charged, for the Fourth Congress: the Nghệ–Tĩnh Soviets, the August Revolution, the land reform, the armed forces and armed struggle, the national united front, the people''s democratic dictatorship, Party building; each to a body (the Party History Research Committee, the Central Military Party Committee, the Front Department, the government''s party group, the Organization Department), all done by September 1964.'
      n: '*Nghị quyết của Bộ Chính trị số 77-NQ/TW về vấn đề tổng kết kinh nghiệm lịch sử của Đảng*, Apr. 18, of the Politburo''s conference of Mar. 9, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXIV, 527–29. Made public: 2003.'
      tags:
      - polity:drv
# op 50 (right): cal.1963-04-16.vietnam-hanoi
- add:
    entry:
      id: cal.1963-04-16.vietnam-hanoi
      when: Apr. 16
      date: '1963-04-16'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 76-NQ/TW on the trade unions'' role and tasks in socialist industrialization: by the Third Congress''s decision, their place raised in every field under the Trade Union Law, a school of economic and state management.'
      n: '*Nghị quyết của Ban Bí thư số 76-NQ/TW về vai trò và nhiệm vụ của công đoàn trong sự nghiệp công nghiệp hoá xã hội chủ nghĩa và xây dựng chủ nghĩa xã hội*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 509–26. Made public: 2003.'
      tags:
      - polity:drv
# op 51 (fixed): cal.1963-05-21.vietnam-hanoi
- add:
    entry:
      id: cal.1963-05-21.vietnam-hanoi
      when: May 21
      date: '1963-05-21'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 80-NQ/TW on the leadership of labor and wage work and the strengthening of the Ministry of Labor: all labor and wage work, in both sectors, put under the Ministry of Labor, the state''s establishment left to the Interior Ministry; social relief, pensions and disability allowances to the Interior Ministry; labor protection rules to the Ministry of Labor, with the trade unions.'
      n: '*Nghị quyết của Bộ Chính trị số 80-NQ/TW về việc tăng cường lãnh đạo công tác lao động tiền lương và kiện toàn Bộ Lao động*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 549–52. Made public: 2003.'
      tags:
      - polity:drv
# op 52 (right): cal.1963-07-08.vietnam-hanoi
- add:
    entry:
      id: cal.1963-07-08.vietnam-hanoi
      when: July 8
      date: '1963-07-08'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 124-TT/TW on the pupils from the South: their boarding schools in the North still needed for a long time, of great political meaning for the revolution in the South now and after.'
      n: '*Thông tri của Ban Bí thư số 124-TT/TW về việc tích cực giải quyết tốt vấn đề học sinh miền Nam*, signed for the Secretariat by Phạm Chung, acting chief of the office. [[w.van-kien-dang-toan]], XXIV, 584–87. Made public: 2003.'
      tags:
      - polity:drv
# op 53 (fixed): cal.1963-07.vietnam-hanoi-2
- add:
    entry:
      id: cal.1963-07.vietnam-hanoi-2
      when: July
      date: 1963-07
      thread: vietnam-hanoi
      c: 'COSVN''s resolution on fighting and breaking the strategic hamlets: the enemy has built nearly 5,000 hamlets, wards and blocks, regrouping over 6,000,000 people, short of the 8,000 planned for 1962; the hold of 2,500 broken from one to forty times, over 300 abandoned, over 50,000 people back in their homes. The fight against the hamlets "công tác trọng tâm hàng đầu" (the foremost central task) of the whole Party, army and people; a committee for it at every level.'
      n: '*Nghị quyết của Trung ương Cục miền Nam, tháng 7 năm 1963, về công tác chống, phá khu, ấp chiến lược, gom dân* (the title the editors''). [[w.van-kien-dang-toan]], XXIV, 912–39 (appendix, its pages unnumbered in the copy, counted from 910; the figures, 914–16; the task, 938). Made public: 2003. Check: the day; the volume gives the month.'
      tags:
      - polity:drv
# op 54 (right): cal.1963-07-31.vietnam-hanoi
- add:
    entry:
      id: cal.1963-07-31.vietnam-hanoi
      when: July 31
      date: '1963-07-31'
      thread: vietnam-hanoi
      c: 'The Interzone V Party Committee''s enlarged third conference, July 15–31, closes: a people''s patriotic war, all-round and protracted; guerrilla war and political struggle to defeat the sweeps and the strategic hamlets; the enemy''s offensive plans for 1963 and 1964 to be defeated; the mountain bases held and widened, the lowlands'' liberated zones extended, the towns'' movement pressed.'
      n: '*Nghị quyết Hội nghị khu uỷ Khu V mở rộng lần thứ III, họp từ 15 đến 31 tháng 7 năm 1963*. [[w.van-kien-dang-toan]], XXIV, 940–93 (appendix, pages counted from 910; the tasks, 955). Made public: 2003.'
      tags:
      - polity:drv
# op 55 (fixed): cal.1963-07-24.vietnam-hanoi
- add:
    entry:
      id: cal.1963-07-24.vietnam-hanoi
      when: July 24
      date: '1963-07-24'
      thread: vietnam-hanoi
      c: The Politburo's resolution no. 85-NQ/TW, in place of resolution no. 51-NQ/TW of Apr. 26, 1962, on the campaign "Nâng cao ý thức trách nhiệm, tăng cường quản lý kinh tế tài chính, cải tiến kỹ thuật, chống tham ô, lãng phí, quan liêu" (raise responsibility, tighten economic and financial management, improve technique, against embezzlement, waste and bureaucracy) in industry and the state's economic units, to the end of 1965, a central steering committee and committees in the cities and provinces to direct it.
      n: '*Nghị quyết của Bộ Chính trị số 85-NQ/TW về cuộc vận động "Nâng cao ý thức trách nhiệm, tăng cường quản lý kinh tế tài chính, cải tiến kỹ thuật, chống tham ô, lãng phí, quan liêu"*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXIV, 588–602. Made public: 2003.'
      tags:
      - polity:drv
# op 56 (fixed): cal.1963-07-27.vietnam-hanoi
- add:
    entry:
      id: cal.1963-07-27.vietnam-hanoi
      when: July 27
      date: '1963-07-27'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh at the conference to make known the Politburo''s resolution on the "3 xây, 3 chống" (three builds, three antis), as he calls the campaign: it and the cooperatives'' campaign "hai bánh xe vững chắc" (two sturdy wheels); the sense of ownership and responsibility weak, economic management loose, labor discipline slack.'
      n: '*Bài nói của Chủ tịch Hồ Chí Minh tại Hội nghị phổ biến Nghị quyết của Bộ Chính trị ...*. [[w.van-kien-dang-toan]], XXIV, 603–08. To check: Hồ Chí Minh, *Toàn tập* (Chính trị quốc gia, 1996), XI, 108–12 (the volume''s source, XXIV, 608). See [[cal.1963-07-24.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - name:ho-chi-minh
      - polity:drv
# op 57 (fixed): cal.1963-08-27.vietnam-hanoi
- add:
    entry:
      id: cal.1963-08-27.vietnam-hanoi
      when: Aug. 27
      date: '1963-08-27'
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china
      c: 'The Secretariat''s circular no. 128-TT/TW on international relations, after the Central Committee has made known to the Party its views on the movement''s strategy and its stand for overcoming the differences: only the Central Committee, or those it charges, may speak abroad on the movement''s line; delegations to prepare what they will say, and ask the Politburo or the Secretariat where needed; letters abroad on the differences, and private requests to foreigners for documents on them, to be prevented.'
      n: '*Thông tri của Ban Bí thư số 128-TT/TW về một số vấn đề về quan hệ quốc tế trong tình hình trước mắt hiện nay*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 610–11. Made public: 2003.'
      tags:
      - polity:drv
# op 58 (right): cal.1963-09-11.vietnam-hanoi
- add:
    entry:
      id: cal.1963-09-11.vietnam-hanoi
      when: Sept. 11
      date: '1963-09-11'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 66-CT/TW on urgent work against the spies and commandos the Americans and Diệm drop into the North: many teams caught and punished, counterrevolutionaries sent to reeducation; but some intrusions undetected, the dangerous ones not concentrated fast enough, internal security in many offices, plants, farms and units neglected.'
      n: '*Chỉ thị của Ban Bí thư số 66-CT/TW về việc tiến hành khẩn trương các công tác để sẵn sàng đập tan âm mưu của Mỹ - Diệm tung gián điệp, biệt kích ra phá hoại miền Bắc nước ta*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 616–25. Made public: 2003. Names: Ngô Đình Diệm.'
      tags:
      - name:ngo-dinh-diem
      - polity:drv
      - polity:us
      - polity:rvn
# op 59 (right): cal.1963-09-20.vietnam-hanoi
- add:
    entry:
      id: cal.1963-09-20.vietnam-hanoi
      when: Sept. 20
      date: '1963-09-20'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 67-CT/TW on the people''s air defense: American and Diệm aircraft over the North to scout, drop commandos and supply their agents; a surprise bombing of some important place possible. The Council of Ministers'' decree no. 112 of July 25 on the people''s air defense to be studied and carried out, the Central Military Party Committee and the Defense Ministry directing.'
      n: '*Chỉ thị của Ban Bí thư số 67-CT/TW về công tác phòng không nhân dân*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 626–27. Made public: 2003. Names: Ngô Đình Diệm.'
      tags:
      - name:ngo-dinh-diem
      - polity:drv
      - polity:us
      - polity:rvn
# op 60 (right): cal.1963-10.vietnam-hanoi-3
- add:
    entry:
      id: cal.1963-10.vietnam-hanoi-3
      when: Oct.
      date: 1963-10
      thread: vietnam-hanoi
      c: 'The Interzone VI Party Committee''s enlarged conference, its resolution no. 128: the enemy has regrouped people, retaken ground and set new posts in the bases, the southern Central Highlands above all; the strategic hamlets mostly finished in the zones it controls and contests; the zone''s tasks changed to suit.'
      n: '*Nghị quyết số 128 (HN.J mở rộng ... đến tháng 10 năm 1963)*, "HN.J" the Interzone VI committee''s conference by the editors'' note. [[w.van-kien-dang-toan]], XXIV, 994–1056 (appendix, pages counted from 910; the editors could not fix the days, 994 n.2). Made public: 2003. Check: the days.'
      tags:
      - polity:drv
# op 61 (fixed): cal.1963-11-19.vietnam-hanoi
- add:
    entry:
      id: cal.1963-11-19.vietnam-hanoi
      when: Nov. 19
      date: '1963-11-19'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 68-CT/TW, a draft by its own note, on the campaign to protect the Party: revolutionary vigilance and discipline, the political vetting of cadres and members whose histories are unclear, the management of the Party''s ranks improved; three years alongside the three great campaigns, from December 1962 (the pilot) to the end of 1965. The draft, written after the Secretariat''s meeting of May 24, 1963, to be used in the wider pilot, then issued in place of instruction no. 48-CT/TW of June 4, 1962.'
      n: '*Chỉ thị của Ban Bí thư số 68-CT/TW về việc mở cuộc vận động nâng cao tinh thần cảnh giác cách mạng, ý thức tổ chức kỷ luật; làm tốt công tác thẩm tra chính trị và cải tiến công tác quản lý đội ngũ cán bộ, đảng viên để bảo vệ Đảng (gọi tắt là cuộc vận động bảo vệ Đảng)*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 630–41 (the span, 635; the note on the draft, 641). Made public: 2003.'
      tags:
      - polity:drv
# op 62 (fixed): cal.1963-11-27.vietnam-hanoi
- add:
    entry:
      id: cal.1963-11-27.vietnam-hanoi
      when: Nov. 27
      date: '1963-11-27'
      thread: vietnam-hanoi
      c: 'The Secretariat''s rules no. 86-NQ/TW for the cadres and staff the Party has sent to work in "miền Tây" (the West), at the request of "Bạn" (the friends): to serve there for the long term, home every three years or so for six months to a year of study; allowances for them and their families, in place of the Secretariat''s no. 24 of July 25, 1961.'
      n: '*Quy định của Ban Bí thư số 86-NQ/TW về một số chế độ đối với cán bộ, nhân viên công tác miền Tây*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 642–49. Made public: 2003. See [[cal.1961-07-25.vietnam-hanoi]].'
      tags:
      - polity:drv
# op 63 (right): cal.1963-11-29.vietnam-hanoi
- add:
    entry:
      id: cal.1963-11-29.vietnam-hanoi
      when: Nov. 29
      date: '1963-11-29'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 69-CT/TW for Dec. 20, the National Liberation Front''s third anniversary: a week of labor and production in support of the South, Dec. 15–22, opened by a mass rally in Ba Đình Square, Hanoi; rallies in Haiphong, Nam Định, Vinh and the towns.'
      n: '*Chỉ thị của Ban Bí thư số 69-CT/TW về việc tổ chức một tuần lễ ủng hộ mạnh mẽ cuộc đấu tranh của đồng bào miền Nam vào dịp 20 tháng 12 năm nay*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 650–54 (the week, 652). Made public: 2003.'
      tags:
      - polity:drv
# op 64 (right): cal.1963-12-13.vietnam-hanoi
- add:
    entry:
      id: cal.1963-12-13.vietnam-hanoi
      when: Dec. 13
      date: '1963-12-13'
      thread: vietnam-hanoi
      c: 'The Politburo sets up a steering committee to prepare the National Assembly''s election, under the Politburo''s direct guidance: thirteen members, among them Trường Chinh, Phạm Văn Đồng and Ưng Văn Khiêm, Hoàng Văn Hoan its head.'
      n: '*Nghị quyết của Bộ Chính trị số 87-NQ/TW về việc thành lập Ban chỉ đạo chuẩn bị việc bầu cử đại biểu Quốc hội*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 655–56. Made public: 2003. Names: Trường Chinh, Phạm Văn Đồng, Ưng Văn Khiêm, Hoàng Văn Hoan.'
      tags:
      - name:truong-chinh
      - name:pham-van-dong
      - name:ung-van-khiem
      - polity:drv
# op 65 (right): cal.1963-12-16.vietnam-hanoi
- add:
    entry:
      id: cal.1963-12-16.vietnam-hanoi
      when: Dec. 16
      date: '1963-12-16'
      thread: vietnam-hanoi
      c: 'The Politburo re-forms the Council on the Enemy Situation, first set up in October 1957, to pool the services'' secret information, agree on an estimate before it goes to the Central Committee, and coordinate strategic intelligence: Võ Nguyên Giáp, Văn Tiến Dũng, Trần Quốc Hoàn, Nguyễn Văn Vịnh, Xuân Thủy and Nguyễn Khang; Lê Trọng Nghĩa its secretary.'
      n: '*Nghị quyết của Bộ Chính trị số 88-NQ/TW về việc thành lập Hội đồng địch tình*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 667–68. Made public: 2003. Names: Võ Nguyên Giáp, Văn Tiến Dũng, Trần Quốc Hoàn, Nguyễn Văn Vịnh, Xuân Thủy, Nguyễn Khang, Lê Trọng Nghĩa.'
      tags:
      - name:vo-nguyen-giap
      - name:van-tien-dung
      - name:xuan-thuy
      - polity:drv
# op 66 (fixed): cal.1963-12-30.vietnam-hanoi
- add:
    entry:
      id: cal.1963-12-30.vietnam-hanoi
      when: Dec. 30
      date: '1963-12-30'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 72-CT/TW on improved tools and the first mechanization of farming: improved and semi-mechanized tools and machines, pumps and tractors above all, for higher labor productivity; mechanization so far only in irrigation and plowing.'
      n: '*Chỉ thị của Ban Bí thư số 72-CT/TW về việc đẩy mạnh phong trào cải tiến công cụ và bước đầu cơ khí hoá nông nghiệp*, signed for the Secretariat by Nguyễn Chí Thanh. [[w.van-kien-dang-toan]], XXIV, 678–90. Made public: 2003.'
      tags:
      - polity:drv
# op 67 (right): cal.1963-01-09.vietnam-hanoi
- add:
    entry:
      id: cal.1963-01-09.vietnam-hanoi
      when: Jan. 9
      date: '1963-01-09'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 107-TT/TW on sending cadres from the center, the provinces and the districts to strengthen the communes and cooperatives, the weak ones first, for the campaign to improve the cooperatives' management and technique.
      n: '*Thông tri của Ban Bí thư số 107-TT/TW về việc điều động cán bộ tăng cường cho cấp xã và hợp tác xã*, signed for the Secretariat by Phạm Chung, acting chief of the office. [[w.van-kien-dang-toan]], XXIV, 37–39. Made public: 2003.'
      tags:
      - polity:drv
# op 68 (right): cal.1963-01-16.vietnam-hanoi
- add:
    entry:
      id: cal.1963-01-16.vietnam-hanoi
      when: Jan. 16
      date: '1963-01-16'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 57-CT/TW on electing the Party committees of districts, towns and city wards: their members to be concentrated on farming and the base, young and women cadres promoted.'
      n: '*Chỉ thị của Ban Bí thư số 57-CT/TW về việc bầu cử cấp uỷ huyện, thị, châu, khu phố (thuộc thành phố trực thuộc)*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 58–64. Made public: 2003.'
      tags:
      - polity:drv
# op 70 (right): cal.1963-03-29.vietnam-hanoi
- add:
    entry:
      id: cal.1963-03-29.vietnam-hanoi
      when: Mar. 29
      date: '1963-03-29'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 61-CT/TW on improving the cadres' in-service study of theory and politics, of their trades and techniques, and of general education.
      n: '*Chỉ thị của Ban Bí thư số 61-CT/TW về cải tiến việc học tập tại chức về lý luận và chính trị, về nghiệp vụ và kỹ thuật và về văn hoá*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIV, 195–203. Made public: 2003.'
      tags:
      - polity:drv
# op 71 (right): cal.1963-04-01.vietnam-hanoi
- add:
    entry:
      id: cal.1963-04-01.vietnam-hanoi
      when: Apr. 1
      date: '1963-04-01'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 62-CT/TW on improving the Party schools for junior and base cadres: over 15,000 junior and nearly 55,000 base cadres trained.'
      n: '*Chỉ thị của Ban Bí thư số 62-CT/TW về việc cải tiến công tác trường Đảng bồi dưỡng cán bộ sơ cấp và cơ sở*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIV, 484–91. Made public: 2003.'
      tags:
      - polity:drv
# op 72 (right): cal.1963-04-15.vietnam-hanoi
- add:
    entry:
      id: cal.1963-04-15.vietnam-hanoi
      when: Apr. 15
      date: '1963-04-15'
      thread: vietnam-hanoi
      c: The Secretariat's resolution no. 75-NQ/TW on holding the congresses of the Party organizations of the interzones, provinces and cities.
      n: '*Nghị quyết của Ban Bí thư số 75-NQ/TW về việc mở đại hội đại biểu các cấp khu, tỉnh, thành*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 492–505. Made public: 2003.'
      tags:
      - polity:drv
# op 73 (right): cal.1963-04-15.vietnam-hanoi-2
- add:
    entry:
      id: cal.1963-04-15.vietnam-hanoi-2
      when: Apr. 15
      date: '1963-04-15'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 115-TT/TW on consolidating the highland cooperatives: the campaign to improve management not to be started there at once; some provinces'' own pilots badly prepared.'
      n: '*Thông tri của Ban Bí thư số 115-TT/TW về việc củng cố hợp tác xã nông nghiệp và đẩy mạnh sản xuất nông nghiệp ở miền núi*, signed for the Secretariat by Nguyễn Chí Thanh. [[w.van-kien-dang-toan]], XXIV, 506–08. Made public: 2003.'
      tags:
      - polity:drv
# op 74 (fixed): cal.1963-04-22.vietnam-hanoi
- add:
    entry:
      id: cal.1963-04-22.vietnam-hanoi
      when: Apr. 22
      date: '1963-04-22'
      thread: vietnam-hanoi
      c: 'The Secretariat on the People''s Courts'' work for 1963, after the Supreme Court''s party group reports: the Party committees inattentive to the courts, the state still without enough laws or rules of trial; the courts to strike at counterrevolutionaries, the American–Diệm spies and commandos above all, at economic sabotage, at murder and the rape of children; wrong judgments to be righted; a lawyers'' association prepared.'
      n: '*Thông báo của Ban Bí thư số 47-TB/TW bàn về phương hướng, nhiệm vụ công tác năm 1963 của ngành Toà án nhân dân*, signed for the Secretariat by Minh Châu, deputy chief of the office. [[w.van-kien-dang-toan]], XXIV, 530–33. Made public: 2003. Names: Ngô Đình Diệm.'
      tags:
      - name:ngo-dinh-diem
      - polity:drv
      - polity:us
# op 75 (right): cal.1963-04-30.vietnam-hanoi
- add:
    entry:
      id: cal.1963-04-30.vietnam-hanoi
      when: Apr. 30
      date: '1963-04-30'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 79-NQ/TW on the Party''s control work, after the Central Control Commission''s report: the control commissions at every level to be strengthened, their tasks and powers fixed.'
      n: '*Nghị quyết của Bộ Chính trị số 79-NQ/TW về công tác kiểm tra của Đảng*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 540–42. Made public: 2003.'
      tags:
      - polity:drv
# op 76 (right): cal.1963-05-14.vietnam-hanoi
- add:
    entry:
      id: cal.1963-05-14.vietnam-hanoi
      when: May 14
      date: '1963-05-14'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 118-TT/TW on carrying out the Marriage and Family Law further: child marriage, forced marriage and concubinage much reduced, monogamy accepted, free divorce ending feudal marriages.'
      n: '*Thông tri của Ban Bí thư số 118-TT/TW về việc đẩy mạnh hơn nữa việc thực hiện Luật Hôn nhân và gia đình*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 543–48. Made public: 2003.'
      tags:
      - polity:drv
# op 77 (fixed): cal.1963-06-01.vietnam-hanoi
- add:
    entry:
      id: cal.1963-06-01.vietnam-hanoi
      when: June 1
      date: '1963-06-01'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 120-TT/TW: the provinces and cities not yet to open the campaign to improve the handicraft, fishing and salt cooperatives, some pilots begun without study or close direction; only the pilots at Haiphong and Hà Đông, and Hanoi''s in preparation, to go on, the others to study.'
      n: '*Thông tri của Ban Bí thư số 120-TT/TW về việc thí điểm cải tiến hợp tác xã thủ công nghiệp, hợp tác xã nghề cá, hợp tác xã nghề muối*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 557–59. Made public: 2003.'
      tags:
      - polity:drv
# op 78 (right): cal.1963-06-22.vietnam-hanoi
- add:
    entry:
      id: cal.1963-06-22.vietnam-hanoi
      when: June 22
      date: '1963-06-22'
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 123-TT/TW on the Party committees' direction of the Party's finances, after the central office's conference on them for 1961 and 1962.
      n: '*Thông tri của Ban Bí thư số 123-TT/TW về việc tăng cường sự chỉ đạo của các cấp uỷ Đảng đối với công tác tài chính Đảng*, signed for the Secretariat by Phạm Chung, acting chief of the office. [[w.van-kien-dang-toan]], XXIV, 566–68. Made public: 2003.'
      tags:
      - polity:drv
# op 79 (right): cal.1963-07-04.vietnam-hanoi
- add:
    entry:
      id: cal.1963-07-04.vietnam-hanoi
      when: July 4
      date: '1963-07-04'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 64-CT/TW on strengthening the propaganda and education organs and the Party's leadership of their work.
      n: '*Chỉ thị của Ban Bí thư số 64-CT/TW về việc kiện toàn tổ chức tuyên giáo và tăng cường lãnh đạo của Đảng đối với công tác tuyên giáo*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 569–79. Made public: 2003.'
      tags:
      - polity:drv
# op 80 (right): cal.1963-07-08.vietnam-hanoi-2
- add:
    entry:
      id: cal.1963-07-08.vietnam-hanoi-2
      when: July 8
      date: '1963-07-08'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 65-CT/TW on studying and spreading the eighth plenum's resolution, which affirmed the Party's line on building socialism in the North and on industrialization.
      n: '*Chỉ thị của Ban Bí thư số 65-CT/TW về việc tổ chức nghiên cứu học tập và tuyên truyền Nghị quyết của Hội nghị Trung ương lần thứ tám*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIV, 580–83. See [[cal.1963-03-26.vietnam-hanoi]]. Made public: 2003.'
      tags:
      - polity:drv
# op 81 (fixed): cal.1963-08-19.vietnam-hanoi
- add:
    entry:
      id: cal.1963-08-19.vietnam-hanoi
      when: Aug. 19
      date: '1963-08-19'
      thread: vietnam-hanoi
      c: 'The Secretariat names the Party group of the Central Physical Culture and Sports Committee: Hoàng Văn Thái its secretary, Nguyễn Văn Quạn, Ngô Luân.'
      n: '*Nghị quyết của Ban Bí thư số 809-NQNS/TW về việc thành lập Đảng đoàn Uỷ ban Thể dục thể thao Trung ương*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 609. Made public: 2003. Names: Nguyễn Văn Quạn, Ngô Luân.'
      tags:
      - polity:drv
# op 82 (right): cal.1963-08-30.vietnam-hanoi
- add:
    entry:
      id: cal.1963-08-30.vietnam-hanoi
      when: Aug. 30
      date: '1963-08-30'
      thread: vietnam-hanoi
      c: 'The Secretariat names the Party group of the Ministry of Culture: Hà Huy Giáp its secretary, Cù Huy Cận, Nguyễn Đức Quỳ, Võ Hồng Cương, Đặng Khánh Côn.'
      n: '*Nghị quyết của Ban Bí thư số 822-NQNS/TW về việc thành lập Đảng đoàn Bộ Văn hoá*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 612. Made public: 2003. Names: Hà Huy Giáp, Cù Huy Cận, Nguyễn Đức Quỳ, Võ Hồng Cương, Đặng Khánh Côn.'
      tags:
      - polity:drv
# op 83 (fixed): cal.1963-09-05.vietnam-hanoi
- add:
    entry:
      id: cal.1963-09-05.vietnam-hanoi
      when: Sept. 5
      date: '1963-09-05'
      thread: vietnam-hanoi
      c: 'The Secretariat names the Party groups of the Committee for Cultural Relations with Foreign Countries: Phạm Hồng its secretary, Phạm Ngọc Thuần, Lưu Quý Kỳ, Trần Các; and of the Union of Literature and Arts: Nguyễn Đình Thi its secretary, Hoài Thanh, Nông Quốc Chấn, Bảo Định Giang, Đỗ Nhuận, Huỳnh Văn Thuận, Học Phi.'
      n: '*Nghị quyết của Ban Bí thư số 824-NQNS/TW về việc thành lập Đảng đoàn Uỷ ban Liên lạc văn hóa với nước ngoài* and *Nghị quyết của Ban Bí thư số 839-NQNS/TW về việc thành lập Đảng đoàn Hội Liên hiệp Văn học nghệ thuật*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 613–15. Made public: 2003. Names: Phạm Hồng, Phạm Ngọc Thuần, Lưu Quý Kỳ, Trần Các, Nguyễn Đình Thi, Hoài Thanh, Nông Quốc Chấn, Bảo Định Giang, Đỗ Nhuận, Huỳnh Văn Thuận, Học Phi.'
      tags:
      - polity:drv
# op 84 (right): cal.1963-12-14.vietnam-hanoi
- add:
    entry:
      id: cal.1963-12-14.vietnam-hanoi
      when: Dec. 14
      date: '1963-12-14'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 70-CT/TW on the course of the Party's financial work, under its decision to manage the Party's finances as one.
      n: '*Chỉ thị của Ban Bí thư số 70-CT/TW về phương hướng công tác tài chính Đảng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 657–66. Made public: 2003.'
      tags:
      - polity:drv
# op 85 (right): cal.1963-12-18.vietnam-hanoi
- add:
    entry:
      id: cal.1963-12-18.vietnam-hanoi
      when: Dec. 18
      date: '1963-12-18'
      thread: vietnam-hanoi
      c: The Secretariat sets up the Central Committee's Women's Mobilization Department, to lead the work among women.
      n: '*Nghị quyết của Ban Bí thư số 89-NQ/TW về cải tiến bộ máy tổ chức giúp Trung ương lãnh đạo và chỉ đạo công tác vận động phụ nữ*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 669–72. Made public: 2003.'
      tags:
      - polity:drv
# op 86 (right): cal.1963-12-24.vietnam-hanoi
- add:
    entry:
      id: cal.1963-12-24.vietnam-hanoi
      when: Dec. 24
      date: '1963-12-24'
      thread: vietnam-hanoi
      c: The Secretariat's instruction no. 71-CT/TW on fewer meetings and study sessions, the unnecessary ones cut, at the base and in the higher offices.
      n: '*Chỉ thị của Ban Bí thư số 71-CT/TW về việc cải tiến chế độ hội họp, học tập, giảm bớt hội họp, học tập không cần thiết*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 673–77. Made public: 2003.'
      tags:
      - polity:drv
