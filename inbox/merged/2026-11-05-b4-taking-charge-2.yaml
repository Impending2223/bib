      c: 'Johnson to Jenkins by telephone, 5:46 p.m.: McCormack might tell the convention he is asking Humphrey to run; McCarthy to be called first, then Brown and Wagner.'
      n: '[Johnson and Walter Jenkins, 5:46 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-jenkins-august-25-1964-0), Conversation WH6408-37-5187 (Miller Center). [[w.taking-charge]], 536. Names: Johnson, Jenkins, McCormack, Humphrey, McCarthy, Brown, Wagner.'
