      date: '1964-08-12'
      thread: robert-kennedy
      also:
      - elections-1964
      c: 'Johnson to Robert Kennedy in Maine by telephone, 9:00 a.m., before going to New York: Kennedy would run for the Senate there if it is plain he will not be Vice President; a loss "a reflection on the whole family." Johnson: "the best possible base," he could "win it hands down"; he will do what Kennedy wants.'
