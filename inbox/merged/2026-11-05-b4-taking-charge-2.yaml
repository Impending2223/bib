      c: 'Johnson to O''Donnell by telephone, 10:46 a.m.: Humphrey against Mansfield, the liberals and the Negroes for the one, respect for the other; Mansfield "just won''t take it." The film on Kennedy to stay where it is in the program.'
      n: '[Johnson and Kenneth O''Donnell, 10:46 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ken-odonnell-august-21-1964), Conversation WH6408-30-5063 (Miller Center). [[w.taking-charge]], 520–521. Names: Johnson, O''Donnell, Humphrey, Mansfield.'
