      date: '1964-08-17'
      thread: robert-kennedy
      c: 'Rusk to Johnson by telephone, 8:10 p.m.: Kennedy in New York a drag on Johnson there; "a ruthlessness about it that just scares the hell out of me." Johnson: Kennedy demanded revenue agents sent all over Mississippi.'
