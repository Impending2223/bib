      - cal.1968-08-07.elections-1968-miami-6
      n: '[*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), the fourth session, Aug. 7, the roll call [368–379](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/368/mode/1up), the changes and the final tabulation [379–389](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/379/mode/1up), the motions [381–389](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/381/mode/1up) (Rule 17, the chair to put "Shall the nomination of the candidate be made unanimous?", read, 381; New York, 382, and the table''s note, "not recognized under the rules of the Convention," 389; Kentucky, "not recognized for that purpose," 383; California''s motion, seconded by Maine and Virginia, put as "to suspend the rules ... for the Convention to cast a unanimous vote for Richard M. Nixon," the ayes having it, "under the motion, the Governor of California will be recognized," 386–87; Reagan''s motion and the chair''s thanks, 387; the table''s note, "Governor Reagan moved that the nomination of Richard M. Nixon be made unanimous," no outcome given, 389). [[w.nixon-rn]], 309–11 (Thurmond and Tower holding the South; the first ballot, 692, 25 more than needed; Reagan''s motion); [[w.cq-weekly-report]], Aug. 9, 1968, 2096, 2098, 2141 (the first ballot and the changes; no vote on Reagan''s motion, 2096). CQ agrees: Reagan''s motion "never put to a vote" (2096); New York''s and Kentucky''s motions ruled out of order (2141). [[w.chester-american-melodrama]], 458, 465–75 (the South held for Nixon, Thurmond and Dent at work on Alabama, Mississippi and Florida); [[w.kabaservice-rule-and-ruin]], 242–43 (the Southern delegations; Bergen County); [[w.white-making-of-the-president-1969]], 246–47 (1:19 a.m., Aug. 8: Nixon 692, Rockefeller 277, Reagan 182; Morton''s hard count 666; Reagan with Mississippi''s delegates in his trailer); [[w.bernstein-guns-or-butter]], 507–08 (Thurmond won over; Nixon 692, Rockefeller 277, Reagan 182). Order: the ballot after the nominations of the fourth session and Rockefeller''s last press conference. To check: [[w.witcover-resurrection-of-richard-nixon]]; [[w.perlstein-nixonland-2008]]; [[w.nelson-resilient-america]]. See [[cal.1968-08-05.elections-1968]]. Names: Thurmond, Nixon, Rockefeller, Reagan, Rhodes, Romney, Case.'
