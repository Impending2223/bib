      when: May
      date: 1963-05
      thread: economy
      c: Mills, in the committee's work on the tax bill, defends reforms such as limiting capital gains and presses to bring
        the individual rates down to a range of 15 to 65 percent. By Surrey's memoranda to the files.
      n: '[[w.zelizer-taxing-america]], 201. To check: Surrey to the files, May 10, 13, 14 and 24, 1963, and Surrey to Dillon,
