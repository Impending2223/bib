- add:
    entry:
      id: cal.1965-05-14.latin-america-dominican-republic-2
      when: May 14
      date: '1965-05-14'
      thread: latin-america-dominican-republic
      c: Johnson selects Vance and Bundy as his emissaries to Santo Domingo, to convey his policy. The move takes the Joint Chiefs, still advocating a military resolution, by complete surprise.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 308. See [[cal.1965-05-14.latin-america-dominican-republic]]. Names: Johnson, Vance, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:vance-cyrus
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-05-17.latin-america-dominican-republic
      when: May 17
      date: '1965-05-17'
      thread: latin-america-dominican-republic
      c: 'Wheeler, to his colleagues of the Joint Chiefs, on the Vance and Bundy mission: he did not know "what goes" with the high-powered delegation. "I''m sort of a rump member of a rump organization—rather far back in this problem."'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 308 (Wheeler "admitted to his colleagues"; the day from his n.64). To check: Commandant''s notes of the special meeting of the Joint Chiefs, No. 53, May 17, 1965, Greene Papers, MHC (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 308 n.64). See [[cal.1965-05-14.latin-america-dominican-republic-2]]. Names: Wheeler. Check: the day; Drea''s note 64 cites the Chiefs'' meeting of May 17, his text gives none.'
      tags:
      - name:wheeler-earle
- add:
    entry:
      id: cal.1967-06-02.middle-east-six-day-war
      when: June 2
      date: '1967-06-02'
      thread: middle-east-six-day-war
      also:
      - europe-and-the-alliance
      c: 'A high-level British delegation, the foreign and defense office heads with representatives of the prime minister, meets McNamara, Rusk and other senior officials, 11:30 a.m. to 1:15 p.m. Both secretaries: any use of military force needs congressional support, and given the "passionate aversion on the Hill to any unilateral action by the US" there is none. McNamara: the Israelis could delay another two to four weeks and still defeat the Arabs in a week to 10 days; a decision within two weeks; "we would have a real problem if the Soviets came in to save Egypt." No further combined naval force planning.'
      n: 'FRUS 1964–68, XIX, doc. [130](https://history.state.gov/historicaldocuments/frus1964-68v19/d130) (Leddy''s memorandum of conversation; the hour and those present: Trend, Dean, Henderson and Zuckerman for the British; Rusk, Fowler, McNamara, Bruce and Walt Rostow). [[w.drea-mcnamara-clifford-and-the-2011]], 439 (n.49). Made public: FRUS 1964–68, XIX (2004). See [[cal.1967-06-02.middle-east]]. Names: McNamara, Rusk.'
      tags:
      - name:mcnamara-robert-s
      - name:rusk-dean
      - polity:uk
- add:
    entry:
      id: cal.1967-06-02.middle-east-six-day-war-2
      when: June 2
      date: '1967-06-02'
      thread: middle-east-six-day-war
      c: 'Evron to Walt Rostow: his government will "hold steady for about two weeks," not an "ironclad" figure.'
      n: 'FRUS 1964–68, XIX, doc. [131](https://history.state.gov/historicaldocuments/frus1964-68v19/d131) (Rostow to Johnson, 12:45 p.m.). [[w.drea-mcnamara-clifford-and-the-2011]], 439 (n.48). Made public: FRUS 1964–68, XIX (2004). See [[cal.1967-06-02.middle-east]]. Names: Rostow.'
      tags:
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1968-01-24.japan-and-korea-pueblo-4
      when: Jan. 24
      date: '1968-01-24'
      thread: japan-and-korea-pueblo
      c: 'Meeting on the Korean crisis without the President, 6 p.m., senior State, OSD and JCS officials. McNamara: 100 to 300 aircraft to the region, easy, relatively riskless, "should be done." Clifford, defense secretary-designee: a cooling-off of several days, the incident too ambiguous for major military action. McNamara and Rusk: the USS Banner to the North Korean coast under heavy air cover. McNamara also: a Black Shield overflight of North Korea, and restraint on South Korean leaders.'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [220](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d220) (Smith''s minutes; the hour). [[w.drea-mcnamara-clifford-and-the-2011]], 488 ("later that same evening"; n.13). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-24.japan-and-korea-pueblo-2]]. Names: McNamara, Clifford, Rusk.'
      tags:
      - name:mcnamara-robert-s
      - name:clifford-clark
      - name:rusk-dean
- add:
    entry:
      id: cal.1968-01-24.japan-and-korea-pueblo-5
      when: Jan. 24
      date: '1968-01-24'
      thread: japan-and-korea-pueblo
      c: 'The President''s meeting, 7:50 to 8:25 p.m. McNamara: some 250 Air Force and Marine fighters and bombers and the carrier Enterprise to Korea and Japan; a selective call-up of Air Force and Marine reserve air units to replace them. Johnson approves, urging 300 aircraft at once; accepts the Banner''s return to the Korean coast; authorizes a Black Shield overflight of North Korea for the next day; agrees to a personal message to Kosygin asking Soviet help in freeing the Pueblo and crew.'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [221](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d221) (Tom Johnson''s notes; the hour). [[w.drea-mcnamara-clifford-and-the-2011]], 488 ("a subsequent meeting on 24 January, this time including the president"; n.14). Not the NSC of 1 p.m.: Drea''s note 11 cites that meeting at 480. Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-24.japan-and-korea-pueblo-4]]. Names: McNamara, Johnson, Kosygin.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1968-01-24.japan-and-korea-pueblo-6
      when: Jan. 24
      date: '1968-01-24'
      thread: japan-and-korea-pueblo
      c: 'The Pueblo Group, 10:30 a.m. McNamara: a general military deployment into the Korean area, a show of force to signal U.S. intentions and indicate "things to come," with a presidential call-up of military reserves and a request to Congress to authorize involuntary extension of the terms of active-duty servicemen.'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [217](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d217) (summary minutes of the Pueblo Group, 10:30 to 11:45 a.m.; McNamara''s two types of action, 473). [[w.drea-mcnamara-clifford-and-the-2011]], 487–88 ("on 24 January"; n.12). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]]. Names: McNamara.'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1968-01-25.japan-and-korea-pueblo-4
      when: Jan. 25
      date: '1968-01-25'
      thread: japan-and-korea-pueblo
      c: 'McNamara, after the morning meeting, to his senior military and civilian staffs: the aim the return of the crew; "Excessive military pressure" might lessen its chances. No "overt action" yet to reinforce Korea and Japan; warning orders to designated Air Force and Navy units; the Kitty Hawk to move to Korea; nothing out of Southeast Asia or Europe without written approval from him or Nitze.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 489 (n.15; Drea also has McNamara defer the Chiefs'' request for 8,500 more men for the Eighth Army, its day not given, the memoranda of Jan. 29 and Feb. 1 among the note''s sources). To check: Nitze notes, Jan. 25, 1968, Nitze Papers, LC; JCSM-53-68 for SecDef, Jan. 25, 1968 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 489 n.15). See [[cal.1968-01-25.japan-and-korea-pueblo]]. Names: McNamara, Nitze.'
      tags:
      - name:mcnamara-robert-s
      - name:nitze-paul
- add:
    entry:
      id: cal.1968-01-25.japan-and-korea-pueblo-8
      when: Jan. 25
      date: '1968-01-25'
      thread: japan-and-korea-pueblo
      c: 'Wheeler to CINCPAC: Johnson''s wish to avoid the appearance of an ultimatum to Pyongyang or Moscow; he must take into account the divisions at home over Vietnam.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 489 ("later that day"; n.15). See [[cal.1968-01-25.japan-and-korea-pueblo-4]]. Names: Wheeler, Johnson.'
      tags:
      - name:wheeler-earle
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-01-25.japan-and-korea-pueblo-5
      when: Jan. 25
      date: '1968-01-25'
      thread: japan-and-korea-pueblo
      c: 'White House working lunch. McNamara: authority for the President to summon as many as 150,000 reservists; no gaps in U.S. forces, against the charge of using the crisis "to plug up all the loopholes . . . in our current military posture." He cannot answer Johnson on the purpose of the deployments. Johnson approves 15 B-52s to Okinawa and 11 to Guam, disavowing any intent to use them against North Korea; Goldberg to ask for an urgent meeting of the Security Council. Clifford: caution on mobilization.'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [225](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d225) (Tom Johnson''s notes of the luncheon). [[w.drea-mcnamara-clifford-and-the-2011]], 489 (n.16; Goldberg and the Council, "on the same busy day," n.18 citing the luncheon at 513). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-25.japan-and-korea-pueblo]]. Names: McNamara, Johnson, Goldberg, Clifford.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      - name:goldberg-arthur-j
      - name:clifford-clark
- add:
    entry:
      id: cal.1968-01-25.japan-and-korea-pueblo-6
      when: Jan. 25
      date: '1968-01-25'
      thread: japan-and-korea-pueblo
      c: 'The Thursday night meeting on the Pueblo, 6:30 to 7:45 p.m. Wheeler: the aircraft deployments first for defense, second for reprisal attacks on North Korea if so decided. McNamara: needed to give air support to the Banner. Johnson spaces the movement of aircraft to South Korea over eight days and approves the mobilization of 28 Air Force and Navy reserve units, 14,787 men and 372 aircraft. Clifford: approaches through the UN and Kosygin with the start of a "quiet build up."'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [226](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d226) (Tom Johnson''s notes; the hour; Clifford''s "quiet build up," 518). [[w.drea-mcnamara-clifford-and-the-2011]], 489 (n.17). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-25.japan-and-korea]]. Names: Wheeler, McNamara, Johnson, Clifford, Kosygin.'
      tags:
      - name:wheeler-earle
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1968-01-26.japan-and-korea-pueblo-3
      when: Jan. 26
      date: '1968-01-26'
      thread: japan-and-korea-pueblo
      c: 'The President''s Friday morning meeting on the Pueblo, 11:08 a.m. McNamara gives Johnson a schedule of aircraft movements from Sunday, Jan. 28, to the following Thursday: 347 aircraft, 26 B-52s among them, within striking distance of North Korea. He asks that the President request from Congress an extension of enlistments and the mobilization of individual reservists, and proposes $100 million more in military assistance for South Korea in 1968. Johnson makes no decision.'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [228](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d228) (Tom Johnson''s notes, 11:08 a.m. to 12:02 p.m.; the 347 aircraft with the Enterprise''s). [[w.drea-mcnamara-clifford-and-the-2011]], 490 (n.19). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-25.japan-and-korea-pueblo-6]]. Names: McNamara, Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-01-27.japan-and-korea-pueblo
      when: Jan. 27
      date: '1968-01-27'
      thread: japan-and-korea-pueblo
      c: 'Kosygin''s reply to Johnson on the Pueblo, through the embassy in Moscow: "we cannot share the interpretation of events" the American side presents; the blame on repeated U.S. military provocations.'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [230](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d230) (Moscow 2604, the embassy''s translation). [[w.drea-mcnamara-clifford-and-the-2011]], 488, the footnote (a "prompt and negative response"; the Soviets did pass the American message to the North Koreans). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-25.japan-and-korea-pueblo-2]]. Names: Kosygin, Johnson.'
      tags:
      - name:kosygin-aleksei
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-22.soviet-union-czechoslovakia
      when: Aug. 22
      date: '1968-08-22'
      thread: soviet-union-czechoslovakia
      c: 'The Cabinet, 12:16 p.m. Johnson: "we did not assume there would be no military intervention." Rusk: a U.S. decision not to act was made Monday, Aug. 19, because military intervention would have resulted in a world war.'
      n: 'FRUS 1964–68, XVII, doc. [84](https://history.state.gov/historicaldocuments/frus1964-68v17/d84) (notes of the Cabinet meeting, 12:16 to 1:50 p.m.). [[w.drea-mcnamara-clifford-and-the-2011]], 498 (n.48). Made public: FRUS 1964–68, XVII (1996). See [[cal.1968-08-21.soviet-union-czechoslovakia]]. Names: Johnson, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
