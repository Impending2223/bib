patch: 2026-11-12-b9-group-2
by: 'Claude (batch 9, group 2: Kallina, Drea, Goldberg; the "already in" rows read by the card), Nov. 12, 2026; audited and corrected by Claude (batch 9 auditor), Nov. 12, 2026'
