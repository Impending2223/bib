      when: Aug. 13
      date: '1961-08-13'
      thread: berlin-and-vienna
      c: Rusk, at a baseball game, is told the East Germans have begun to put up barricades and barbed wire between East and
        West Berlin. By his account, it takes Washington by surprise.
