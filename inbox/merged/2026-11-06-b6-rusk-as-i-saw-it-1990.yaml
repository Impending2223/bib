      when: Aug. 9
      date: '1963-08-09'
      thread: soviet-union
      c: Khrushchev host to Rusk and Virginia Rusk at his Black Sea villa. Rusk on the defense of Leningrad; Khrushchev in
        tears. Khrushchev on the old priest who taught him from the Bible; a tour of the villa, the pool under its sliding
        cover, badminton. By Rusk's account.
      n: '[[w.rusk-as-i-saw-it-1990]], 258. Check: the day; Rusk gives the visit, not the day. See [[cal.1963-08-09.soviet-union]].
