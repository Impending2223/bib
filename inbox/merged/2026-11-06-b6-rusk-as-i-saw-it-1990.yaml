      when: Dec. 18
      date: '1962-12-18'
      thread: europe-and-the-alliance
      c: Rusk stays in Washington for the State Department's annual dinner for the diplomatic corps, set before the Nassau
        meeting was arranged; Ball goes to Nassau in his place. Rusk for Britain's having Polaris if it wanted them, and so
        advised Kennedy. By Rusk's account.
      n: '[[w.rusk-as-i-saw-it-1990]], 267. Check: the day of the dinner. See [[cal.1962-12-18.europe-and-the-alliance]].
        Names: Rusk, Ball, Kennedy.'
