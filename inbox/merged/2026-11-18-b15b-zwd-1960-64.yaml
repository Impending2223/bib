      c: Zhou Enlai writes to Bertrand Russell, the British pacifist and philosopher, thanking him for his concern over the Sino-Indian boundary. Russell had telegraphed and written Zhou on Nov. 8, 16 and 19 calling on China and India to cease fire and negotiate. Zhou tells him that China's frontier forces ceased fire along the whole boundary from 0:00 on Nov. 22 and hopes he will urge India to respond and take matching steps.
      n: '[[w.zhou-enlai-waijiao-huodong]], 342 (Nov. 24, 1962). Made public: 1993. Names: Zhou Enlai.'
