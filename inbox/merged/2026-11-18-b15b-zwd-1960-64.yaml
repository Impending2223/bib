      when: Sept. 7
      date: '1962-09-07'
      thread: china-leadership
      also:
      - china
      - middle-east
      - africa
      c: 'Peking, Xihuating. Zhou Enlai receives the UAR Ambassador, Imam, and says that in the 1950s and 1960s the world''s chief events happened in Asia, Africa and Latin America: Cuba''s revolution, Algerian and North African independence, the Suez Canal, Iraq''s overthrow of its monarchy and exit from the Baghdad Pact, Laos''s peace and neutrality, Indonesia''s recovery of West Irian, the Indochina peace agreement, the Korean war, many new African states; imperialism fares worse each day; only the Congo''s movement has had a setback, a passing one. Most of these events came after Bandung, whose spirit has gone far, and imperialism hates and tries to wreck it.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 334 (Sept. 7, 1962; 晚10时30分). Made public: 1993. Names: Zhou Enlai.'
      tags:
