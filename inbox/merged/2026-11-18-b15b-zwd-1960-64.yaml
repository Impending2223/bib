      thread: china-leadership
      also:
      - china
      - middle-east
      c: 'Peking. Zhou Enlai, at the banquet Sabri gives for China''s leaders: the talks stressed Afro-Asian solidarity; all Afro-Asian states, independent or not, face imperialism''s and old and new colonialism''s aggression and interference, so their solidarity and mutual aid are their highest interest; disputes among them exist but are secondary, to be settled fairly for the sake of that solidarity, or set aside for a time; any state that leans on imperialism to gain from them only helps imperialist interference.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 356–57 (Apr. 23, 1963; 晚上). See [[cal.1963-04-22.china-leadership]]. Names: Zhou Enlai, Ali Sabri.'
