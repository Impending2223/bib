      - laos
      c: 'Moscow. Zhou Enlai talks with Quinim Pholsena and Phoumi Vongvichit: the Zurich communiqué is signed by the Laotian three sides, which shows three forces in Laos, the strongest Prince Souvanna Phouma''s neutralists, the second the Pathet Lao''s, the weakest Phoumi''s; the coalition government must reflect this. China favors a neutral, independent and self-determining Laos, friendly with the Soviet Union and China and also with the United States, Britain and France.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 325 (Oct. 21, 1961; 下午). Made public: 1993. See [[cal.1961-10-15.china-leadership]]. Names: Zhou Enlai, Quinim Pholsena, Souvanna Phouma.'
