      c: Peking, Xihuating. Zhou Enlai receives the UAR education delegation headed by the Minister of Higher Education, Abdel Aziz Said, and says that Asian and African states need to support one another, those that won first having the duty to support those that have not or won later. At Bandung he thought Nasser knew more of West African and African affairs than the Chinese; the ten principles were adopted by the drafting committee of the Political Committee under Nasser's chairmanship, on which he sat; they need further elaboration, above all in African states' mutual support. The chief mark of Bandung was equality of states large and small.
      n: '[[w.zhou-enlai-waijiao-huodong]], 375 (Oct. 30, 1963; 下午2时). Names: Zhou Enlai, Nasser.'
