      c: 'Peking, Xihuating. Zhou Enlai receives the new Pakistani Ambassador, Raza, who hands over a letter from Foreign Minister Ali: Pakistan''s government is resolved to develop friendly relations with China on the principles and spirit of the Bandung declaration and attaches great weight to a quick interim boundary agreement with China.'
