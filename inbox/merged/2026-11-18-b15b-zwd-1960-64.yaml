- add:
    entry:
      id: cal.1963-12-14.china-leadership-3
      when: Dec. 14
      date: '1963-12-14'
      thread: china-leadership
      also:
      - china
      - middle-east
      c: 'Cairo. Zhou Enlai, at the reception given by Nasser and his wife: this is his first official visit to the friendly UAR; in 1924, passing the Suez Canal on his way home from Europe, he saw Egypt just out of its protectorate and nearly all Africa under imperialist darkness; in 1954, on his way from the Geneva conference, Egypt had overthrown Farouk''s dynasty, Algeria was brewing its armed struggle and Africa stood on the eve of the storm; now he comes as a friendly envoy of the Chinese people to an awakened and fighting continent, where the dawn of freedom has risen and the imperialist colonial system moves toward collapse.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 378 (Dec. 14, 1963; 晚上). See [[cal.1963-12-13.china-leadership]]. Names: Zhou Enlai, Nasser.'
      tags:
