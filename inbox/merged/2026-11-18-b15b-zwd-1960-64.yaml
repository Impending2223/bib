      thread: china-leadership
      also:
      - china
      - laos
      c: 'Rangoon, the President''s House. Zhou Enlai, before leaving for Moulmein, tells Ne Win on Laos: Soviet and Vietnamese aid to Phoumi is indirect; the Americans aid Phoumi''s side and have sent some troops; the Americans cannot overlook the risk of direct U.S.–Soviet conflict. Sihanouk''s Jan. 1 proposal of a 14-nation Geneva conference is good, and Souvanna Phouma is inclined to it. China opposes sending the Laos question to the United Nations.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 300 (Jan. 5, 1961; 上午). Made public: 1993. See [[cal.1961-01-02.china-leadership-2]]. Names: Zhou Enlai, Ne Win, Sihanouk, Souvanna Phouma.'
