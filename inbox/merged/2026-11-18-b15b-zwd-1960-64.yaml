      c: Peking, Xihuating. Zhou Enlai receives Sukarni, the Indonesian Ambassador, and tells him that Mao Zedong, Liu Shaoqi and he hope Sukarno will come to Peking on his way home from Japan to talk on the boundary question with India. He will send Huang Zhen, Vice Minister, to Hong Kong on Nov. 20 to convey this and the situation to Sukarno. Asked for China's highest and lowest terms for a settlement, he says China holds to its three proposals but wants to take a further positive step, of which it will consult Sukarno.
      n: '[[w.zhou-enlai-waijiao-huodong]], 341 (Nov. 19, 1962; 晚9时40分). Made public: 1993. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Sukarno.'
