      c: 'Peking, the Great Hall of the People. Zhou Enlai tells the Congolese Ambassador, Diaka, after his talks that afternoon with Nkrumah, in which he heard Nkrumah''s views on the Congo: China still backs Gizenga''s lawful government and his staying in Stanleyville; the Congo''s right of self-determination has been hurt since the United Nations came in, and the reopened parliament, guaranteed by the United Nations and so by American support, cannot be relied on; one choice is a break, the other another deception.'
