      when: Aug. 30
      date: '1963-08-30'
      thread: china-leadership
      also:
      - china
      - africa-algeria-morocco
      c: 'Peking, Xihuating. Zhou Enlai receives the Algerian press delegation headed by Maghrawi Mohammed, a member of the Constituent National Assembly, and tells it that the Algerian armed struggle has greatly influenced all of Africa''s revolution: after Bandung, Morocco and Tunisia won independence; France''s refusal to recognize Algeria''s independence and its repression forced seven years of armed struggle; this puts two roads before Africa''s peoples, independence by war or by talks, which are not opposed, since there is fighting in talks and talks in fighting; the states that won independence by talks are half independent and must go on to full and economic independence.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 370 (Aug. 30, 1963; 下午). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:algeria
