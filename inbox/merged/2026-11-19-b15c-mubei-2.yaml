      c: Departments of the Gansu 甘肅 committee compile tables of deaths in the province in 1958–60 and in 14 counties and cities. They give 849,238 dead in the three years against 142,044 in 1957; six of the 14 are above 5 percent.
      n: '[[w.yang-jisheng-mubei]], I, 140–142. Made public: 2008. To check: Gansu Provincial Committee departments, tables of deaths, 1958–60, and in 14 counties and cities (statistics of Dec. 23, 1960), Gansu Provincial Archives (tables 2-2, 2-3 of [[w.yang-jisheng-mubei]]) (named by [[w.yang-jisheng-mubei]], I, 140; no note). Check: the book calls the tables incomplete and the figures low (I, 141–142); the departments are not named.'
