- add:
    entry:
      id: cal.1960-11-09.china-leadership-7
      when: Nov. 9
      date: '1960-11-09'
      thread: china-leadership
      c: The Gansu 甘肅 committee's general office 辦公廳 issues nos. 4 and 6 of the *Bulletin of the committee's three-level cadre meeting* 《中共甘肅省委三級幹部會議簡報》. From no. 4 the book takes that in spring 1960 a team of Chengguan 城關 commune, Jingyuan 靖遠 county, on hearing the commune will take its camels, kills and eats its 40-odd, and on hearing of a commune pig farm, its 40-odd pigs. From no. 6, the lessons that Ma Jiying 馬驥英, secretary of the Dunhuang 敦煌 county committee, draws from the county's push to commune ownership of sheep and draft animals in 1958–59.
      n: '[[w.yang-jisheng-mubei]], I, 132. Made public: 2008. To check: Gansu Provincial Committee General Office (ed.), *Bulletin of the committee''s three-level cadre meeting*, no. 4, Nov. 9, 1960 (cited by [[w.yang-jisheng-mubei]], I, 132 n.6); no. 6, Nov. 9, 1960 (cited by [[w.yang-jisheng-mubei]], I, 132 n.7). Check: the book has Ma sum up the lessons "at the end of 1960" (I, 132); the bulletin is dated Nov. 9.'
      src:
        c: 2a210426
        rows:
        - 'w.yang-jisheng-mubei I, 132: all'
        - 'via w.yang-jisheng-mubei I, 132 n.6: A-B'
