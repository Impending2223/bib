      c: The labor-reform department of the Yumen 玉門 area 玉門地區勞改部門 reports to the Yumen city committee and the provincial committee that illness and deaths at the labor-reform and labor-education farms are very grave and rising. Since November 265 have died at the Yinma 飲馬 and Mogutan 蘑菇灘 farms, 34 of them at Yinma on Nov. 21; at Yinma 395 since the year began.
      n: '[[w.yang-jisheng-mubei]], I, 149–150. Made public: 2008. To check: Yumen area labor-reform department, report to the Yumen City Committee and the Gansu Provincial Committee on illness and deaths at the labor-reform and labor-education farms (named by [[w.yang-jisheng-mubei]], I, 149; no note). Check: the book gives no date for the report; its figures run to Nov. 21, 1960, so it is placed after that day.'
