      date: '1960-11-11'
      thread: china-leadership
      c: The Gansu 甘肅 committee's general office 辦公廳 issues no. 13 of the *Bulletin of the committee's three-level cadre meeting* 《中共甘肅省委三級幹部會議簡報》. The book takes from it the Shenyu 沈郁 brigade of Yongchang 永昌 commune, Wuwei 武威 county (yield 250, 157, then 63 jin a mu in 1958–60; 141 dead from January to July 1960), and the Xihu 西湖 team of Xinhe 新河 commune, Minqin 民勤 county (grain 540,000 jin in 1958, 190,000 in 1960).
      n: '[[w.yang-jisheng-mubei]], I, 133. Made public: 2008. To check: Gansu Provincial Committee General Office (ed.), *Bulletin of the committee''s three-level cadre meeting*, no. 13, Nov. 11, 1960 (cited by [[w.yang-jisheng-mubei]], I, 133 n.8–9).'
