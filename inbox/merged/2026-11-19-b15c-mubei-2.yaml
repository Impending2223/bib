      when: Dec. 9
      date: '1960-12-09'
      thread: china-leadership
      c: The industry-and-transport department 工交部 of the Gansu 甘肅 committee reports on edema in industry and transport 工交系統發生浮腫病的情況. At the Yongchang 永昌 nickel mine at Baijiazui 白家嘴, of nearly 7,000 workers 60 percent have it, 20 percent of them badly, and some have died; 55 of 94 women at the geology and construction bureaus have no menses. The general office prints it Dec. 9 for the standing committee members, 36 copies.
      n: '[[w.yang-jisheng-mubei]], I, 148. Made public: 2008. To check: Gansu Provincial Committee Industry and Transport Department, "The edema in industry and transport," printed Dec. 9, 1960 by the general office for the standing committee members, 36 copies (cited by [[w.yang-jisheng-mubei]], I, 148 n.27).'
