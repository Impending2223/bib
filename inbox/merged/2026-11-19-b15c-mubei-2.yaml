      - vis:only:prc
- add:
    entry:
      id: cal.1960-02-17.china-leadership-5
      when: Feb. 17
      date: '1960-02-17'
      thread: china-leadership
      c: Qingshui 清水 county, Gansu 甘肅. The county committee 清水縣委 reports by telephone to the provincial committee on the arrangement of livelihood and the outflow of population 關於生活安排、人口外流情況的電話彙報. The provincial committee's general office 辦公廳 prints it Feb. 19 for the standing committee members and others, 28 copies.
      n: '[[w.yang-jisheng-mubei]], I, 139. Made public: 2008. To check: Qingshui County Committee, telephone report on livelihood arrangements and population outflow, Feb. 17, 1960, printed Feb. 19 by the Gansu committee''s general office for the standing committee members, the secretaries-general, the general office and the rectification office, 28 copies (cited by [[w.yang-jisheng-mubei]], I, 139 n.12). Check: the passage the note closes (I, 139) tells of Xu Xiaorui 徐效瑞, party vice-secretary of Zhangshuyi 張樹驛 commune, sent to Songhe 松河 brigade to press the drive against concealing grain, the 110,920 jin he reported finding, the 44 dead there in the last ten days of January and the suicide of the branch secretary Mao Wenqing 毛文清; the book does not say the report held this.'
      src:
        c: ee32ecb9
        rows:
        - 'w.yang-jisheng-mubei I, 139: all'
        - 'via w.yang-jisheng-mubei I, 139 n.12: all'
