      when: Dec. 18
      date: '1960-12-18'
      thread: china-leadership
      c: The Baiyin 白銀 city committee 市委 reports to higher organs on stopping the spread of edema and what to do 關於積極防治浮腫病發展情況和今後意見的報告. It began in November at the Baiyin plant 白銀廠, the cotton mill and the transport bureau, the lower body first, in December the upper; commoner among workers than cadres, men than women; the causes malnutrition and overwork.
      n: '[[w.yang-jisheng-mubei]], I, 148. Made public: 2008. To check: Baiyin City Committee, "Report on actively preventing and treating the spread of edema and views for the future," Dec. 18, 1960, to higher organs (named by [[w.yang-jisheng-mubei]], I, 148; no note).'
