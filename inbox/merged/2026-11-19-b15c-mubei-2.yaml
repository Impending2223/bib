      c: The Party committee of the Jiuquan Iron and Steel Company 酒泉鋼鐵公司黨委 reports to higher organs on edema, listing the cases, and on the many women workers with amenorrhea and men with impotence. The workers, mostly northeasterners sent by Anshan 鞍鋼, with rations cut and no cooking oil for months, ask in growing numbers to go home; some sell their goods, some leave without notice.
      n: '[[w.yang-jisheng-mubei]], I, 149. Made public: 2008. To check: Jiuquan Iron and Steel Company Party Committee, report of Dec. 30, 1960 to higher organs on edema (named by [[w.yang-jisheng-mubei]], I, 149; no note).'
