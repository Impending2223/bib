      thread: china-leadership
      c: The Anhui 安徽 committee 省委 arranges Hefei 合肥 for foreign experts of the Xinhua News Agency 新華社 on leave, who are taken round by Fang Shi 方實, deputy head of its domestic department. Only a few places are open to them, the Xiaoyaojin 逍遙津 park among them; where they go every sign of plenty is staged, a girl boating and singing on the lake, shops stocked with food, the people kept out.
