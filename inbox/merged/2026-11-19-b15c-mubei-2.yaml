      c: 'The Ministry of Health, the Academy of Sciences and other bodies survey the health of 123 leading experts in Peking 北京: professors, doctors, scientists, writers and artists. Weights are down, bodies weaker, illness more: 34 weakened but fairly sound; 49 with much weight lost and chronic illness but able to work; 33 on full or half rest and 7 working by force.'
