      id: cal.1960-08-19.china-leadership-7
      when: Aug. 19
      date: '1960-08-19'
      thread: china-leadership
      c: 'The rural work department 農村工作部 of the Gansu 甘肅 committee reports on the problem of Min 岷 county 關於岷縣問題的報告: grave throughout, worst in Lichuan 理川, Lüjing 閭井, Nanchuan 南川 and Nanyang 南陽 communes. Over 50,000 have edema; over 21,900 are dead, 3.16 percent of the people.'
      n: '[[w.yang-jisheng-mubei]], I, 144. Made public: 2008. To check: Gansu Provincial Committee Rural Work Department, "Report on the Min county problem," Aug. 19, 1960, printed for the standing committee members, the general office and the party groups of the water, meteorology, farm-machinery and land-reclamation departments, 25 copies, department file (cited by [[w.yang-jisheng-mubei]], I, 144 n.21).'
      src:
