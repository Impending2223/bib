      when: Dec. 11
      date: '1960-12-11'
      thread: china-leadership
      c: The Yumen 玉門 city committee 市委 reports to higher organs on edema in mines, enterprises, offices and schools 關於在廠礦、企業、機關、學校中發生浮腫病情況的報告. By early December there are 3,132 cases in 14 units, among them the Yumen Petroleum Administration 玉門石油管理局, the Yumen railway office 鐵路辦事處, the Northwest Mining Machinery Works 西北礦山機械廠, the city commerce bureau and the Party school; in the worst unit 25 percent of the people have it.
      n: '[[w.yang-jisheng-mubei]], I, 148–149. Made public: 2008. To check: Yumen City Committee, "Report on the edema in mines, enterprises, offices and schools," Dec. 11, 1960, to higher organs (named by [[w.yang-jisheng-mubei]], I, 148; no note).'
