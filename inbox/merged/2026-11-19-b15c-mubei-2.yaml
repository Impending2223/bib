      id: cal.1960-07.china-leadership-18
      when: July
      date: '1960-07'
      thread: china-leadership
      c: The Gansu 甘肅 committee, forced by events, makes a self-examination and writes the Center a report on checking the "one finger" question 關於檢查一個指頭問題的報告. Of 13 counties with grave problems it reports 9; it says most of those who left have come back.
      n: '[[w.yang-jisheng-mubei]], I, 139. Made public: 2008. To check: Gansu Provincial Committee, "Report on checking the ''one finger'' question," July 1960, to the Center (named by [[w.yang-jisheng-mubei]], I, 139; no note); Gansu Provincial Committee, "Inspection report on some questions in carrying out the spirit of the Northwest Bureau''s Lanzhou meeting over two years," adopted Dec. 3, 1962 (cited by [[w.yang-jisheng-mubei]], I, 139 n.11). Check: the book gives the month only; the counts (13, 9) and the "come back" are the book''s reading, closed by the note on the 1962 report.'
      src:
        c: d655ca2a
        rows:
        - 'w.yang-jisheng-mubei I, 139: all'
        - 'via w.yang-jisheng-mubei I, 139 n.11: all'
