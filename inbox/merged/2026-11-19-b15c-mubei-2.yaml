      c: Pan Kang 潘康, deputy head of the Fujian 福建 air force's rear services department, home for the Spring Festival to Xinhua 新華 brigade, Xiaoxihe 小溪河 commune, Fengyang 鳳陽, sees the hunger of two teams, quarrels with the commune's cadres led by Miao Jian 繆堅, who are feasting, and gives his pay to buy seed. The cadres send three letters of denunciation to the Fuzhou 福州 air force; Miao writes himself; Fuzhou investigates twice, the second time learning that 66 starved in the team; Pan is punished all the same.
      n: '[[w.yang-jisheng-mubei]], I, 324. Made public: 2008. To check: Chen Zhenya, "Report on the Fengyang problem," Feb. 1, 1961 (cited by [[w.yang-jisheng-mubei]], I, 324 n.94). Check: the Spring Festival of 1960 is not converted to a day; the denunciations and the investigations are undated.'
