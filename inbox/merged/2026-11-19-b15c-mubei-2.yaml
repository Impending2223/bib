      when: Dec. 24
      date: '1960-12-24'
      thread: china-leadership
      c: The Tianshui 天水 prefectural committee 地委 reports to the provincial committee's leading group on livelihood arrangements 省委生活安排領導小組 and asks for free medical funds 關於請撥免費醫療款的報告. At the Xiakou 峽口 team of Mapaoquan 馬跑泉 commune 24.2 percent have edema, emaciation or prolapse; the grain levy is half done and rations of 12 jin a month last to February; the report counts 1,800-odd such teams, about 40 percent of the brigades.
      n: '[[w.yang-jisheng-mubei]], I, 143–144. Made public: 2008. To check: Tianshui Prefectural Committee, "Report asking for an allotment of free medical funds," Dec. 24, 1960, printed for the secretaries, the secretaries-general, the general office, the leading group on livelihood arrangements and the medical office, 26 copies, Gansu committee receipt no. [60]1725 (cited by [[w.yang-jisheng-mubei]], I, 144 n.20). Check: the book writes "teams" 生產隊 against "brigades" 生產大隊 in the same sentence (I, 144).'
