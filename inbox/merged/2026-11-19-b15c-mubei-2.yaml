      id: cal.1960-01.china-leadership-6
      when: Jan.
      date: '1960-01'
      thread: china-leadership
      c: The Gansu 甘肅 committee orders 209 reservoirs of a million cubic meters or more built 水庫, besides the Tao diversion project 引洮工程. By the book's count 191 are finished in 1960; the labor at its height is 2.7 million.
      n: '[[w.yang-jisheng-mubei]], I, 137 (no note). Made public: 2008. Check: the book gives the month only ("1960年元月") and no document; the totals are its own.'
      src:
        c: 900c3159
        rows:
        - 'w.yang-jisheng-mubei I, 137: all'
      tags:
