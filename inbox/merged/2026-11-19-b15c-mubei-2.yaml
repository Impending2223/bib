      when: Dec. 3
      date: '1960-12-03'
      thread: china-leadership
      c: The Lanzhou 蘭州 municipal committee 市委 reports to the provincial committee on edema among cadres and workers 關於幹部職工中發生的浮腫病的情況報告. Since November 3,346 of 68,096 in 51 industrial units are sick (5.6 percent), 401 of 3,313 in finance and trade, 226 of 1,882 in propaganda and education, 544 of 5,900 in Party and government offices, 31 of 145 children in the city nursery; of 23 tested in November at the leather works, 17 are low in protein.
      n: '[[w.yang-jisheng-mubei]], I, 149. Made public: 2008. To check: Lanzhou Municipal Committee, "Report on the edema among cadres and workers," Dec. 3, 1960, municipal committee document [60] no. 846 (cited by [[w.yang-jisheng-mubei]], I, 149 n.28). Check: the book gives the document''s number as [60]846 (I, 149 n.28).'
      src:
