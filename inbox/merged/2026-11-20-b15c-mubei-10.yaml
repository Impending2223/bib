      c: Bishan 璧山 county, Sichuan 四川, Shizi 獅子 commune, Hufeng 虎峰 brigade. In the buying of hens and eggs the quotas are laid by head, hens or no hens; members who fall short are punished. Households with no eggs to hand in are refused their meals at the mess hall and may not buy salt, kerosene or tobacco. Ke Zhengguo 柯政國 of the 6th team, with no eggs, has his family of seven refused their meals until his mother borrows six eggs from relatives. To meet the quota some cadres of the supply and marketing cooperative 供銷社 and of the teams take members' hens from their houses without their consent, mostly in the dead of night.
      n: '[[w.yang-jisheng-mubei]], II, 842 n.71 (the county printed 壁山). Made public: 2008. To check: Sichuan Provincial Committee Agricultural Inspection Corps, Jiangjin group, report to the provincial committee, May 3, 1960, pp. 56–59, appendix 3, 《關於財貿工作的幾個問題的材料》 (cited by [[w.yang-jisheng-mubei]], II, 842 n.71).'
