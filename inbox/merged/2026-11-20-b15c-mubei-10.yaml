      n: '[[w.yang-jisheng-mubei]], I, 638–639 (the passage runs from the author''s notes of his visit of 1995, I, 638 n.23, to I, 639 n.24, which closes it). Made public: 2008. To check: Hu Qiaomu 胡喬木, letter to Mao Zedong, Apr. 14, 1961, in the Center''s forwarding of Apr. 26, 1961 (cited by [[w.yang-jisheng-mubei]], I, 639 n.24). See [[cal.1960-05.china-leadership-14]]. Names: Mao Zedong. Check: the record of the completion; the note that closes the passage (I, 639 n.24) is Hu Qiaomu''s letter of Apr. 14, 1961, a year before it.'
      src:
