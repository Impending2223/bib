      date: '1963-11-14'
      thread: china-leadership
      also:
      - china
      c: 'Guo Moruo 郭沫若 to Chen Mingyuan 陳明遠, by letter: in the Great Leap satellites were launched everywhere, good news and gifts sent up, all in a rush and all as soon dropped; a wind of exaggeration and falsehood; lies, set phrases and empty talk are the great enemies of the new literature and art and of the new society.'
      n: '[[w.yang-jisheng-mubei]], II, 785 n.28. Made public: 1992 (the letter''s printing in Guo''s letters, as [[w.yang-jisheng-mubei]], II, 785 n.28 cites it). To check: Huang Chunhao 黃淳浩, ed., 《郭沫若書信集》 vol. 2 (Beijing: Zhongguo shehui kexue chubanshe, 1992), 144 (cited by [[w.yang-jisheng-mubei]], II, 785 n.28). Check: the letter''s authenticity, which, the book reports, Guo''s secretary doubted.'
