      n: '[[w.yang-jisheng-mubei]], I, 226–227. Made public: 2008. To check: Sichuan Provincial Committee Agricultural Inspection Corps, Jiangjin group, report, May 3, 1960 (cited by [[w.yang-jisheng-mubei]], I, 227 n.91). See [[cal.1960-04.china-leadership-23]] (its appendix 3, on finance and trade, II, 842 n.71). Check: no mark stands in the run of cases from the Shaping 沙坪 commune of Jiangbei county to the burial at I, 227, which the note closes; which of them the report holds is not shown. The book does not say the report is the one of May 2 (I, 228 n.95).'
- edit:
    id: cal.1961-01-10.china-leadership-3
    base: 5ceb4522
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 474–475 (Jan. 10, 1961; Mao''s comment of Jan. 10; printed from the manuscript); [[w.yang-jisheng-mubei]], I, 623–624 (Jan. 10: Mao''s comment on the Liaoning report of how Jinzhou''s Factory 401 settled its workers'' grain troubles, "worth spreading, but some practical problems must be solved"; the report: education, debates in group meetings, three arrested, mess halls improved). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Huang Huoqing and Zhou Yang, report of Jan. 9, 1961 on Jinzhou''s Factory 401 settling its workers'' grain troubles (cited by [[w.jianguo-yilai-mao-zedong]], XV, 474 n.1); Zhou Yang, letter of Jan. 9, 1961 to Mao Zedong sending the Jinzhou report (cited by [[w.jianguo-yilai-mao-zedong]], XV, 475 n.2a); General Office of the Central Committee, *Qingkuang jianbao*, Jan. 3, 1961: "Some noteworthy points in present school work" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 475 n.2b); Propaganda Department, *Xuanjiao dongtai*, 1961, no. 2, Jan. 9, 1961: "Some good ways to do public-order work by caring for the people''s livelihood and patient education" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 475 n.2c). See [[cal.1960-12-30.china-leadership-3]]; [[cal.1960.china-leadership-98]]. Names: Mao Zedong, Huang Huoqing, Zhou Yang.'
