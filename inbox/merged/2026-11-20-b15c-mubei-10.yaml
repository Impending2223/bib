      c: By Liu Bingxun's 劉秉勛 account, two peasants of Xiangtan 湘潭 and Xiangxiang 湘鄉, Hunan 湖南, Mao Zedong's 毛澤東 cousins Mao Zerong 毛澤榮 and Wen Dongxian 文東仙, come to Peking 北京 to report on conditions at home to him in person, cadres and masses being afraid to speak. With the National Day near, Mao has no time; they lodge with Wang Jifan 王季範, another cousin, a counselor of the State Council's counselors' office 國務院參事室, who puts their report into ten questions.
      n: '[[w.yang-jisheng-mubei]], II, 762 n.49 (Liu Bingxun''s account). Made public: 1997 (Liu Bingxun''s article, as [[w.yang-jisheng-mubei]], II, 762 n.49 cites it). To check: Liu Bingxun 劉秉勛, 《毛澤東決定解散農村食堂的來由》, *Bainian chao* 百年潮 1997 no. 6 (cited by [[w.yang-jisheng-mubei]], II, 762 n.49). Names: Mao Zedong.'
