      c: 'The Party group 黨組 of the Ministry of Commerce 商業部 reports on the 1959 plan of supply for export: goods worth 3.03 billion yuan supplied, 110.8 percent of the plan, 28.9 percent above 1958. Pork 233,000 tons, the most since 1949; frozen beef and mutton 20,000 tons, 125 percent of the plan; fresh eggs over 52 million jin, frozen eggs 6,208 tons; live fowl 9.54 million, frozen fowl 7,022 tons; apples 102,000 tons, oranges 91,000 tons.'
      n: '[[w.yang-jisheng-mubei]], II, 843–844 n.72. Made public: 2008. To check: Ministry of Commerce Party group, 《關於1959年供應出口計劃完成情況的報告》, Jan. 8, 1960, Shanghai conference document (60) no. 97 (cited by [[w.yang-jisheng-mubei]], II, 844 n.72).'
