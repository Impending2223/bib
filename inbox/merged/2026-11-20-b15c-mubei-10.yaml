patch: 2026-11-20-b15c-mubei-10
by: 'Claude (batch 15c run 10, Yang Jisheng, *Mubei*, Tiandi 2016 ed.: the crimes and the organs'' acts of ch. 14 and chs. 15–28; run 9''s leads), Nov. 20, 2026'
ops:
- edit:
    id: cal.1961-01-12.china-leadership-5
    base: 3b5eafae
    set:
      c: Zhang Guangqin 張廣欽 reports to the Sichuan 四川 provincial committee 省委 on disorder in rural security 《關於農村治安情況混亂的彙報》. In Luxian 瀘縣 county the worst teams and districts cannot even hold a meeting at night. In Yangjiu 楊九 commune there were 17 robberies and thefts in the five days of Jan. 6–10, among them the taking of six geese, twelve eggs and three sheep from a member's house on the night of the 10th; in Caoshi 曹市 commune, 104 since the end of Dec. 1960. In one week of spring 1961, 36 of the county's 69 communes had robberies or thefts.
      n: '[[w.yang-jisheng-mubei]], II, 1047 (the page prints 6隻鵝, six geese; the entry said six hens). Made public: 2008. To check: Zhang Guangqin 張廣欽, "Guanyu nongcun zhi''an qingkuang hunluan de huibao" 《關於農村治安情況混亂的彙報》, Jan. 12, 1961, Sichuan Provincial Committee general office secretariat, received (61) no. 214 (cited by [[w.yang-jisheng-mubei]], II, 1047 n.46). See [[cal.1961-01-10.china]]. Check: the last figure; the book gives "one week of spring 1961" from the political-legal departments'' count, a date after the report''s Jan. 12.'
      src:
        c: 876c70a3
        rows:
        - 'w.yang-jisheng-mubei II, 1047: all'
        - 'via w.yang-jisheng-mubei II, 1047 n.46: all'
