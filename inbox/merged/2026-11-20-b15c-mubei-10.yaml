      n: '[[w.yang-jisheng-mubei]], I, 639–640 n.25. Made public: 2008. To check: Shuai Hao 帥好, 《以酒為天：中國大饑荒中的茅台酒紀事》, online (cited by [[w.yang-jisheng-mubei]], I, 640 n.25). See [[cal.1960.china-leadership-100]].'
