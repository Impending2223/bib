      n: '[[w.yang-jisheng-mubei]], I, 629 n.16. Made public: 2008. To check: Hebei Provincial Committee document [60] no. 619, "Hebei Provincial Committee''s forwarding of Comrade Shi Xudong''s opinions on the problem of special supply in Handan city" 《河北省委批發石旭東同志反映邯鄲市特需供應問題的意見》 (cited by [[w.yang-jisheng-mubei]], I, 629 n.16). See [[cal.1960-10-07.china-leadership-10]]. Check: the day.'
