      c: By Liu Bingxun's 劉秉勛 account, Mao Zedong 毛澤東 receives his cousins Mao Zerong 毛澤榮 and Wen Dongxian 文東仙, with Wang Jifan 王季範. Mao Zerong tells him the mess halls grow worse, many eat rice bran and rotten cabbage, many have edema, and the cadres dare not report it; people will starve, and he must act. Wen tells him Xiangtan 湘潭, Xiangxiang 湘鄉 and Ningxiang 寧鄉 are all alike, and he can send people to see. The book adds that Mao, believing them, grants the halls many problems but blames bad men in them, not the halls.
      n: '[[w.yang-jisheng-mubei]], II, 762 n.49 (Liu Bingxun''s account, to Wen Dongxian''s words; Mao''s view, after the note, the book''s own). Made public: 1997 (Liu Bingxun''s article, as [[w.yang-jisheng-mubei]], II, 762 n.49 cites it). To check: Liu Bingxun 劉秉勛, 《毛澤東決定解散農村食堂的來由》, *Bainian chao* 百年潮 1997 no. 6 (cited by [[w.yang-jisheng-mubei]], II, 762 n.49). See [[cal.1960-09.china]]. Names: Mao Zedong.'
