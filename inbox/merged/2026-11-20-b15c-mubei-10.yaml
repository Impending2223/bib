      c: Jinzhou 錦州, Liaoning 遼寧, Factory 401. After its workers' grain protests 鬧糧, those who protested most are debated in group meetings, and three are arrested as elements carrying out political sabotage 進行政治破壞活動的分子.
      n: '[[w.yang-jisheng-mubei]], I, 623–624 n.9 (the account of Huang Huoqing 黃火青, first secretary of the Liaoning 遼寧 committee, and Zhou Yang 周揚, deputy head of the Propaganda Department, of how the factory settled the trouble, as the book quotes it). Made public: 2008. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Huang Huoqing and Zhou Yang, report of Jan. 9, 1961 on Jinzhou''s Factory 401 settling its workers'' grain troubles (quoted by [[w.yang-jisheng-mubei]], I, 623–624); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 419 (the note the book cites: Mao''s comment on spreading the experience of Jinzhou''s Factory 401 in settling the workers'' grain troubles). Check: the day; the report of Jan. 9, 1961, as the calendar gives it from Mao''s comment of Jan. 10, has the troubles in May–July 1960 and the education from August.'
      src:
        c: d21b995b
        rows:
        - 'w.yang-jisheng-mubei I, 623-624: all'
      tags:
      - polity:prc
      - vis:only:prc
