      - china
      c: 'The Center 中共中央 forwards the Ministry of Grain''s 糧食部 report on raising the state''s grain reserves to 100 billion jin within three years 關於今後三年內把國家糧食庫存增加到一千億斤的報告. The report: from the summer harvest of 1959 to December, 114.2 billion jin of trade grain bought, 6 percent over the 107.58 billion approved; by Dec. 25, by the grain quarters, 101.6 billion, 94 percent of the plan; 120 billion for the grain year 1959–60 possible. The Center: on the basis of a continued leap in grain output, raising the reserves step by step is both necessary and possible.'
      n: '[[w.yang-jisheng-mubei]], II, 840 n.67. Made public: 2008. To check: Center, 《中央批轉糧食部「關於今後三年內把國家糧食庫存增加到一千億斤的報告」》 (cited by [[w.yang-jisheng-mubei]], II, 840 n.67). Check: the note prints the date Jan. 26, 1969; the text sets the forwarding in January 1960.'
