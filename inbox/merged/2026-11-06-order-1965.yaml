      n: 'FRUS 1964–68, II, docs. [157](https://history.state.gov/historicaldocuments/frus1964-68v02/d157) (Rusk, Feb. 23), [168](https://history.state.gov/historicaldocuments/frus1964-68v02/d168), [170](https://history.state.gov/historicaldocuments/frus1964-68v02/d170) (Feb. 27). [[w.gibbons-u-s-government-and]], III, 123–24 (not the helicopter squadron); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 532 (the authorization, Feb. 26); [[w.cosmas-joint-chiefs-of-staff-2012]], 241 (the landing ordered); [[w.marolda-united-states-navy-and]], 526 (the authorization, Feb. 26: two battalion landing teams and a helicopter squadron; the mission); [[w.moyar-triumph-forsaken]], 354–55; [[w.branch-pillar-of-fire]], 595; [[w.drea-mcnamara-clifford-and-the-2011]], 23 (Johnson with his top civilian advisers agrees to some, not all, of the security forces asked). [[w.westmoreland-soldier-reports]], 123 (the approval, Feb. 26, subject to Saigon''s consent; McNaughton''s try for the 173d Airborne instead).
        In the evening, by Wheeler''s cable of the next day, doc. 170. To check: Msg, JCS 070001Z Mar 1965 (cited by [[w.marolda-united-states-navy-and]], 526 n.33); [[w.pentagon-papers]], II, 422; III, 389–90 (cited by [[w.branch-pillar-of-fire]], 595). See [[cal.1965-02-22.vietnam]]. Names: Johnson, Rusk, Ball, McNamara, Phan Huy Quát.'
