      when: Sept.
      date: 1965-09
      thread: vietnam
      c: Westmoreland asks the chief of the Naval Advisory Group to study a single naval component command in place of III
        MAF and the Naval Advisory Group. No proposal by the year's end.
      n: '[[w.macv-command-history-1965]], 100. Check: the day (the History: "late September"). To check: General Westmoreland''s
