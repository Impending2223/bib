      when: Nov. 28
      date: '1965-11-28'
      thread: vietnam-force-levels
      c: 'MACV''s J3 briefs McNamara: "unless we receive by March [1966] the high priority logistic units which the J4 has
        described, we cannot support any add-on until the third quarter of CY 66." Westmoreland the same day on construction
        funding: the commander on the ground to shift funds.'
