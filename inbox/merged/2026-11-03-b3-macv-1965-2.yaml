      when: Nov.
      date: 1965-11
      thread: vietnam-force-levels
      c: Westmoreland proposes more general officers for USARV's staff and an Army-level headquarters, a lieutenant general
        commanding, for Phase II. Dec. 27, Lt. Gen. J. E. Engler named USARV's deputy commander.
      n: '[[w.macv-command-history-1965]], 97. Check: the day. To check: General Westmoreland''s Historical Briefing, 25
        Oct 65 (cited by [[w.macv-command-history-1965]], 97 n.441). Names: Westmoreland.'
