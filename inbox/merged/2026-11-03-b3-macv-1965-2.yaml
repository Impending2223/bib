      id: cal.1965-05-27.vietnam-force-levels
      when: May 27
      date: '1965-05-27'
      thread: vietnam-force-levels
      c: 'McNamara tells the Joint Chiefs and CINCPAC he will separate MACV and MACTHAI: a commander of MACTHAI, an Army
        major general, at Bangkok; Westmoreland to keep SEATO planning. Westmoreland had opposed it in March.'
      n: '[[w.macv-command-history-1965]], 102. Names: McNamara, Westmoreland.'
