      when: May 14
      date: '1965-05-14'
      thread: vietnam
      c: The Joint Chiefs create a deputy commander of MACV for air operations, the 2d Air Division's commander to hold
        it besides. His terms of reference Aug. 25.
      n: '[[w.macv-command-history-1965]], 93. Check: the day; the note''s message is dated May 9. To check: Msg, JCS, 092159Z
        May 65 (cited by [[w.macv-command-history-1965]], 93 n.402); Ltr, COMUSMACV, 25 Aug 65, Subj: Terms of Reference,
