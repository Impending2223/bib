      date: '1964-12-21'
      thread: vietnam-force-levels
      c: The Joint Chiefs endorse Westmoreland's plan for an Army logistical command in Vietnam, 230 men to go at once;
        McNamara approves in principle but asks more justification, the engineer construction group especially.
      n: '[[w.macv-command-history-1965]], 105. To check: DF, MACJ4, 22 Jan 65, Subj: Improvement of US Logistical Systems
