      when: Aug.
      date: 1965-08
      thread: vietnam-force-levels
      c: A Marine Corps–MSTS board finds 22 LSTs needed for coastal shipping by Oct. 15; seven available by mid-December.
        On Oct. 30, 17 ships wait to unload at Cam Ranh Bay, 25 at Saigon.
      n: '[[w.macv-command-history-1965]], 118, 120. Check: the day.'
