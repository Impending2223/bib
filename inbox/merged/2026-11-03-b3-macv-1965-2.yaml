        Westmoreland so states at Honolulu, Apr. 18; encadrement dropped.'
      n: '[[w.macv-command-history-1965]], 81–82. Check: Honolulu''s day (the History: Apr. 18). To check: Msg, DOD, 151233Z
        Apr 65 (cited by [[w.macv-command-history-1965]], 81 n.347); Briefing Notes for Honolulu Conference, 18 Apr 65 (cited
