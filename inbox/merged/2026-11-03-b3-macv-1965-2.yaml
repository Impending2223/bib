- add:
    entry:
      id: cal.1965-04.vietnam-saigon
      when: Apr.
      date: 1965-04
      thread: vietnam-saigon
      c: Three South Vietnamese naval force commanders and other officers mutiny against the navy's commander in chief and
        charge him with graft. Brig. Gen. Khang of the Marines put in temporary command; the navy's chief of staff acting
        commander Apr. 26. The mutineers back at their posts in May but the River Force commander.
      n: '[[w.macv-command-history-1965]], 87. Check: the days.'
      src:
        c: 4c3b1f61
        rows:
