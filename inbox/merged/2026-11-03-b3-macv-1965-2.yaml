      when: Dec. 6
      date: '1965-12-06'
      thread: vietnam-force-levels
      c: 'The Red Ball Express begins, at McNamara''s direction after his visit: repair parts flown on reserved airlift.
        To Jan. 3, some 8,000 requests, 3,700 filled; 612 items off deadline, 481 of them aircraft.'
      n: '[[w.macv-command-history-1965]], 116. To check: Msg, JCS, 032052Z Dec 65 (cited by [[w.macv-command-history-1965]],
