      when: Mar. 21
      date: '1965-03-21'
      thread: vietnam-force-levels
      c: 'Westmoreland''s concept of command: he and the South''s commander in chief to coordinate as equals, a combined
        staff for combined operations only, an American chief of staff with a Vietnamese deputy; full command later, if
        Saigon accepts. CINCPAC accepts it.'
      n: '[[w.macv-command-history-1965]], 101. To check: Msg, COMUSMACV, MAC 1566, 21 Mar 65 (cited by [[w.macv-command-history-1965]],
        101 n.457). Names: Westmoreland.'
