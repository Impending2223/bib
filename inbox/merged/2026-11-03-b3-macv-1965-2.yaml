      when: June
      date: 1965-06
      thread: vietnam-force-levels
      c: 'The Joint Chiefs propose the field force headquarters be joint; Westmoreland objects: it will control only Army
        and Korean forces.'
      n: '[[w.macv-command-history-1965]], 97. Check: the day. Names: Westmoreland.'
