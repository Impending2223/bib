      when: Nov.
      date: 1965-11
      thread: vietnam-force-levels
      c: Westmoreland recommends contracting Alaska Barge and Transport for coastal shipping, at under half the cost of
        MSTS's LSTs; approved by the end of November, the contract signed Dec. 8, some 7,000 tons a month.
      n: '[[w.macv-command-history-1965]], 121. Check: the day. To check: Msg, CINCPAC, 280050Z Nov 65 (cited by [[w.macv-command-history-1965]],
        121 n.582). Names: Westmoreland.'
