      when: Nov.
      date: 1965-11
      thread: vietnam-force-levels
      c: Westmoreland begins organizing a second field force headquarters for III Corps, for a second division; operational
        Mar. 31, 1966.
      n: '[[w.macv-command-history-1965]], 99. Check: the day (the History: "late November"). To check: General Westmoreland''s
