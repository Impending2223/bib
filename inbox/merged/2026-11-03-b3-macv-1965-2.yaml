      when: June 15
      date: '1965-06-15'
      thread: vietnam-force-levels
      c: Westmoreland establishes a MACV Ammunition Officer under the J4. Nine items short worldwide, 2.75-inch rockets
        and bombs among them; 960 short tons a day used at the year's end.
      n: '[[w.macv-command-history-1965]], 114. To check: MACJ4 Monthly Historical Summary, 21 Jul 65 (cited by [[w.macv-command-history-1965]],
        114 n.537). Names: Westmoreland.'
