patch: b3-macv-1965-2
by: Claude (b3-macv reading agent, second run of the 1965 volume, Nov. 4, 2026), from MACV's Command History
ops:
- add:
    entry:
      id: cal.1965-01-23.vietnam-force-levels
      when: Jan. 23
      date: '1965-01-23'
      thread: vietnam-force-levels
      c: 'McNamara approves for military assistance the RVNAF increase of Alternative 1, modified: 275,058 regular forces,
        137,187 Regional Forces, 185,000 Popular Forces.'
      n: '[[w.macv-command-history-1965]], 58. To check: Msg, SECDEF, 232116Z Jan 65 (cited by [[w.macv-command-history-1965]],
        58 n.169). See [[cal.1964-11-29.vietnam-force-levels]]. Names: McNamara.'
      src:
        c: f4abdfad
        rows:
        - 'w.macv-command-history-1965 58: all'
        - 'via w.macv-command-history-1965 58 n.169: all'
      tags:
      - name:mcnamara-robert-s
    section: '196501'
- add:
    entry:
      id: cal.1965-03-20.vietnam-force-levels-2
      when: Mar. 20
      date: '1965-03-20'
      thread: vietnam-force-levels
      c: Westmoreland asks CINCPAC's authority to carry out Alternative 2, the J3 having urged Alternative 1 hastened and
        Alternative 2 to follow.
      n: '[[w.macv-command-history-1965]], 58. To check: Msg, COMUSMACV, 200247Z Mar 65 (cited by [[w.macv-command-history-1965]],
        58 n.171). See [[cal.1965-01-23.vietnam-force-levels]]. Names: Westmoreland.'
      src:
        c: d991381b
        rows:
        - 'w.macv-command-history-1965 58: all'
        - 'via w.macv-command-history-1965 58 n.171: all'
      tags:
      - name:westmoreland-william
    section: '196503'
- add:
    entry:
      id: cal.1965-04-13.vietnam-force-levels
      when: Apr. 13
      date: '1965-04-13'
      thread: vietnam-force-levels
      c: The Joint Chiefs approve the accelerated schedule and Alternative 2's increase of 17,247 spaces for the RVNAF.
      n: '[[w.macv-command-history-1965]], 58. See [[cal.1965-01-23.vietnam-force-levels]].'
      src:
        c: 7d546434
        rows:
        - 'w.macv-command-history-1965 58: all'
    section: '196504'
- add:
    entry:
      id: cal.1965-11-05.vietnam-force-levels
      when: Nov. 5
      date: '1965-11-05'
      thread: vietnam-force-levels
      c: 'Westmoreland asks the regular forces raised to 311,458 in fiscal 1966 and 325,256 in fiscal 1967: three infantry
        battalions, a regiment, a Marine battalion, psywar companies, 81 RF companies, 15,000 PF spaces. He would have more;
        the manpower will not bear it. McNamara approves orally at Saigon, Nov. 28.'
      n: '[[w.macv-command-history-1965]], 58, 61. To check: Msg, COMUSMACV, 051443Z Nov 65 (cited by [[w.macv-command-history-1965]],
        58 n.173); Msg, COMUSMACV, 061101Z Nov 65 (cited by [[w.macv-command-history-1965]], 58 n.175). See [[cal.1965-01-23.vietnam-force-levels]].
        Names: Westmoreland, McNamara.'
      src:
        c: fba14df1
        rows:
        - 'w.macv-command-history-1965 58, 61: all'
        - 'via w.macv-command-history-1965 58 n.173: all'
        - 'via w.macv-command-history-1965 58 n.175: all'
      tags:
      - name:westmoreland-william
      - name:mcnamara-robert-s
    section: '196511'
- add:
    entry:
      id: cal.1965-07.vietnam-2
      when: July
      date: 1965-07
      thread: vietnam
      c: Combat losses so high that 11 of the 15 South Vietnamese battalions in training are disbanded for the time, as
        fillers for the older battalions.
      n: '[[w.macv-command-history-1965]], 60. Check: the day.'
      src:
        c: 88ffc984
        rows:
        - 'w.macv-command-history-1965 60: all'
    section: '196507'
- add:
    entry:
      id: cal.1965-08.vietnam-2
      when: Aug.
      date: 1965-08
      thread: vietnam
      c: 'The Joint General Staff would add two airborne battalions; Westmoreland concurs, but takes the spaces from three
        authorized infantry battalions rather than ask more aid: 149 combat battalions authorized for 1965.'
      n: '[[w.macv-command-history-1965]], 60. Check: the day. To check: Ltr, General Westmoreland, 9 Sep 65 (cited by [[w.macv-command-history-1965]],
        60 n.189). Names: Westmoreland.'
      src:
        c: f3f711a8
        rows:
        - 'w.macv-command-history-1965 60: all'
        - 'via w.macv-command-history-1965 60 n.189: all'
      tags:
      - name:westmoreland-william
    section: '196508'
- add:
    entry:
      id: cal.1965-05-05.vietnam-4
      when: May 5
      date: '1965-05-05'
      thread: vietnam
      c: Westmoreland asks authority to support a 10th ARVN Division, made of the 43d, 48th and 52d Regiments in III Corps.
      n: '[[w.macv-command-history-1965]], 60. To check: Msg, COMUSMACV, 050428Z May 65 (cited by [[w.macv-command-history-1965]],
        60 n.190). Names: Westmoreland.'
      src:
        c: fdaf412c
        rows:
        - 'w.macv-command-history-1965 60: all'
        - 'via w.macv-command-history-1965 60 n.190: all'
      tags:
      - name:westmoreland-william
    section: '196505'
- add:
    entry:
      id: cal.1965-05-16.vietnam
      when: May 16
      date: '1965-05-16'
      thread: vietnam
      c: The Joint General Staff activates the 10th ARVN Division. The Joint Chiefs approve it June 9 and fix the ARVN ceiling.
      n: '[[w.macv-command-history-1965]], 60–61. Check: the Joint Chiefs'' day; the History gives June 9, the note''s message
        (n.191) 191928Z Jun 65. To check: Memo, RVNAF JGS, No 11331, 18 May 65 (cited by [[w.macv-command-history-1965]],
        61 n.192). See [[cal.1965-05-05.vietnam-4]].'
      src:
        c: 666d7889
        rows:
        - 'w.macv-command-history-1965 60–61: all'
        - 'via w.macv-command-history-1965 61 n.192: all'
    section: '196505'
- add:
    entry:
      id: cal.1965-01-06.vietnam-saigon
      when: Jan. 6
      date: '1965-01-06'
      thread: vietnam-saigon
      c: The Joint General Staff's Memo 22/TL bars the Popular Forces from recruiting men 20 to 25.
      n: '[[w.macv-command-history-1965]], 62.'
      src:
        c: 2dc28c76
        rows:
        - 'w.macv-command-history-1965 62: all'
    section: '196501'
- add:
    entry:
      id: cal.1965-07-02.vietnam-saigon
      when: July 2
      date: '1965-07-02'
      thread: vietnam-saigon
      c: 'Joint General Staff Memo 0815/TTL halts all Popular Force recruiting of men 17 to 30, back to Jan. 1: some 17,000
        recruits made illegal. The PF falls some 25,000 in the year, by desertion.'
      n: '[[w.macv-command-history-1965]], 62. See [[cal.1965-01-06.vietnam-saigon]].'
      src:
        c: e2e296b1
        rows:
        - 'w.macv-command-history-1965 62: all'
    section: '196507'
- add:
    entry:
      id: cal.1965-09-14.vietnam-saigon
      when: Sept. 14
      date: '1965-09-14'
      thread: vietnam-saigon
      c: After a meeting, the Popular Force recruiting restrictions relaxed until Jan. 1, 1966; the 17,000 kept.
      n: '[[w.macv-command-history-1965]], 62. To check: Rpt, MACJ1, 24 Nov 65, Subj: Command Historical Program (cited
        by [[w.macv-command-history-1965]], 62 n.200). See [[cal.1965-01-06.vietnam-saigon]].'
      src:
        c: 0c39ae8a
        rows:
        - 'w.macv-command-history-1965 62: all'
        - 'via w.macv-command-history-1965 62 n.200: all'
    section: '196509'
- add:
    entry:
      id: cal.1965-05-11.vietnam-2
      when: May 11
      date: '1965-05-11'
      thread: vietnam
      c: 'A MACV group plans the conversion of the CIDG to Regional Forces by Dec. 31, 1966: 20 companies by July 1, 69
        more by the year''s end. The 5th Special Forces Group doubts it: a like attempt failed in 1963. Westmoreland had
        begun the study in February.'
      n: '[[w.macv-command-history-1965]], 63. To check: Rpt, RF/PF Adv Det, 20 Nov 65, Subj: Monthly Report (cited by [[w.macv-command-history-1965]],
        63 n.204). Names: Westmoreland.'
      src:
        c: 4f4f21f8
        rows:
        - 'w.macv-command-history-1965 63: all'
        - 'via w.macv-command-history-1965 63 n.204: all'
      tags:
      - name:westmoreland-william
    section: '196505'
- add:
    entry:
      id: cal.1965-09-15.vietnam-3
      when: Sept. 15
      date: '1965-09-15'
      thread: vietnam
      c: The Joint General Staff agrees in principle to convert the CIDG to Regional Forces, the secure camps first, voluntary,
        not finished before Jan. 1, 1967.
      n: '[[w.macv-command-history-1965]], 63. To check: Ltr, CINCRVNAF, Subj: Conversion of CIDG to RF, 15 Sep 65 (cited
        by [[w.macv-command-history-1965]], 63 n.205). See [[cal.1965-05-11.vietnam-2]].'
      src:
        c: dc3eb682
        rows:
        - 'w.macv-command-history-1965 63: all'
        - 'via w.macv-command-history-1965 63 n.205: all'
    section: '196509'
- add:
    entry:
      id: cal.1965-05.vietnam-2
      when: May
      date: 1965-05
      thread: vietnam
      c: The South Vietnamese air force's fifth A-1 squadron, the 522d, activated at Tân Sơn Nhứt; the sixth, the 524th,
        at Nha Trang in August. A-1s from 89 in January to 146 at the year's end. The last T-28 gone in April, the last
        UH-19 in May.
      n: '[[w.macv-command-history-1965]], 65, 83. Check: the days.'
      src:
        c: 3bec8a00
        rows:
        - 'w.macv-command-history-1965 65, 83: all'
    section: '196505'
- add:
    entry:
      id: cal.1965-10.vietnam
      when: Oct.
      date: 1965-10
      thread: vietnam
      c: 'The chief of the Air Force Advisory Group proposes modernizing the South Vietnamese air force, the 2d Air Division
        concurring: jets. On Nov. 2 both recommend to Westmoreland converting all A-1 squadrons to F-5s; he does not concur,
        the A-1 proven in counterinsurgency.'
      n: '[[w.macv-command-history-1965]], 66. Check: the day (the History: "mid-October"). Names: Westmoreland.'
      src:
        c: 8cefd8ba
        rows:
        - 'w.macv-command-history-1965 66: all'
      tags:
      - name:westmoreland-william
    section: '196510'
- add:
    entry:
      id: cal.1965-11-06.vietnam-2
      when: Nov. 6
      date: '1965-11-06'
      thread: vietnam
      c: 'Westmoreland endorses the original plan for the South Vietnamese air force and sends it to CINCPAC. CINCPAC: two
        F-5 squadrons enough. Plans settled at their meeting in mid-December and sent to the Joint Chiefs.'
      n: '[[w.macv-command-history-1965]], 66–67. To check: Msg, CINCPAC, 140732Z Dec 65 (cited by [[w.macv-command-history-1965]],
        67 n.229). See [[cal.1965-10.vietnam]]. Names: Westmoreland.'
      src:
        c: 777751fc
        rows:
        - 'w.macv-command-history-1965 66–67: all'
        - 'via w.macv-command-history-1965 67 n.229: all'
      tags:
      - name:westmoreland-william
    section: '196511'
- add:
    entry:
      id: cal.1965-03.vietnam-3
      when: Mar.
      date: 1965-03
      thread: vietnam
      c: Japan authorizes the return of five military-aid LSSLs to the United States, for the South Vietnamese navy's counterinsurgency.
        The navy occupies the An Thới base.
      n: '[[w.macv-command-history-1965]], 68. Check: the day. To check: Historical Review, NAVGP, Subj: NAVGP Activities,
        Mar 65 (cited by [[w.macv-command-history-1965]], 68 n.238).'
      src:
        c: a6715e9a
        rows:
        - 'w.macv-command-history-1965 68: all'
        - 'via w.macv-command-history-1965 68 n.238: all'
    section: '196503'
- add:
    entry:
      id: cal.1965-07.vietnam-3
      when: July
      date: 1965-07
      thread: vietnam
      c: 'The Coastal Junk Force, Regional Force men, integrated into the South Vietnamese navy: 3,444 men. The navy about
        14,274 at the year''s end.'
      n: '[[w.macv-command-history-1965]], 69. Check: the day. To check: Historical Review, NAVGP, Subj: NAVGP Activities,
        Jul 65 (cited by [[w.macv-command-history-1965]], 69 n.242).'
      src:
        c: 93ebe474
        rows:
        - 'w.macv-command-history-1965 69: all'
        - 'via w.macv-command-history-1965 69 n.242: all'
    section: '196507'
- add:
    entry:
      id: cal.1965-07.vietnam-4
      when: July
      date: 1965-07
      thread: vietnam
      c: The Joint General Staff proposes another Marine battalion, for a balance among the services; on the senior Marine
        adviser's advice Westmoreland has it held to 1966.
      n: '[[w.macv-command-history-1965]], 70. Check: the day. To check: Interview with Maj W. J. Pederson, USMC, Assistant
        Senior Advisor, Marine Advisory Unit, by Maj J. Duncan, 10 Jan 66 (cited by [[w.macv-command-history-1965]], 70
        n.245). Names: Westmoreland.'
      src:
        c: 0aa62d9d
        rows:
        - 'w.macv-command-history-1965 70: all'
        - 'via w.macv-command-history-1965 70 n.245: all'
      tags:
      - name:westmoreland-william
    section: '196507'
- add:
    entry:
      id: cal.1964-12-22.vietnam-force-levels
      when: Dec. 22
      date: '1964-12-22'
      thread: vietnam-force-levels
      c: MACV's International Military Assistance Office established under the J5, for the other countries' contingents;
        renamed the Free World Military Assistance Office Oct. 1, 1965, "Third Country" dropped.
      n: '[[w.macv-command-history-1965]], 71, 95. To check: MACV GO 676, AG File, 22 Dec 64 (cited by [[w.macv-command-history-1965]],
        71 n.253).'
      src:
        c: 0734ec1c
        rows:
        - 'w.macv-command-history-1965 71, 95: all'
        - 'via w.macv-command-history-1965 71 n.253: all'
    section: '196412'
- add:
    entry:
      id: cal.1965-05-05.vietnam-force-levels
      when: May 5
      date: '1965-05-05'
      thread: vietnam-force-levels
      c: 'Military working arrangement between the commander of the Australian forces and Westmoreland: Westmoreland''s
        operational control, American administrative and logistic support. A financial arrangement follows Sept. 7, Australia
        to repay.'
      n: '[[w.macv-command-history-1965]], 71. To check: Financial Working Arrangement between COMAAFV and COMUSMACV, 7
        Sep 65 (cited by [[w.macv-command-history-1965]], 71 n.259). Names: Westmoreland.'
      src:
        c: 4ac656b2
        rows:
        - 'w.macv-command-history-1965 71: all'
        - 'via w.macv-command-history-1965 71 n.259: all'
      tags:
      - name:westmoreland-william
    section: '196505'
- add:
    entry:
      id: cal.1965-09-30.vietnam-force-levels-2
      when: Sept. 30
      date: '1965-09-30'
      thread: vietnam-force-levels
      c: 'An augmentation to the Australian battalion arrives: a 105mm battery, a field engineer troop, an APC troop, an
        air reconnaissance flight, a signal troop. 1,557 Australians at the year''s end.'
      n: '[[w.macv-command-history-1965]], 71. To check: FWMAO Monthly Historical Summary, 22 Oct 65 (cited by [[w.macv-command-history-1965]],
        71 n.260). See [[cal.1965-06-02.vietnam-force-levels]].'
      src:
        c: 86c6b004
        rows:
        - 'w.macv-command-history-1965 71: all'
        - 'via w.macv-command-history-1965 71 n.260: all'
    section: '196509'
- add:
    entry:
      id: cal.1965-06-09.vietnam-force-levels-2
      when: June 9
      date: '1965-06-09'
      thread: vietnam-force-levels
      c: 'Military working arrangement for New Zealand''s 105mm battery: American field administrative support. 119 New
        Zealanders at the year''s end.'
      n: '[[w.macv-command-history-1965]], 72. See [[cal.1965-07-21.vietnam-force-levels]].'
      src:
        c: a4e56335
        rows:
        - 'w.macv-command-history-1965 72: all'
    section: '196506'
- add:
    entry:
      id: cal.1965-02-08.japan-and-korea-korean-troops
      when: Feb. 8
      date: '1965-02-08'
      thread: japan-and-korea-korean-troops
      c: 'Military working arrangement between Westmoreland and the Korean commander: the Dove unit, an engineer battalion
        and support, under guidelines of the Free World Military Assistance Policy Council, MACV''s chief of staff, the
        Korean commander and the chief of the Joint General Staff.'
      n: '[[w.macv-command-history-1965]], 72. To check: Military Working Arrangement, COMROKMACV and COMUSMACV, 8 Feb 65
        (cited by [[w.macv-command-history-1965]], 72 n.271). See [[cal.1965-01-26.japan-and-korea]]. Names: Westmoreland.'
      src:
        c: 0c8e1ab1
        rows:
        - 'w.macv-command-history-1965 72: all'
        - 'via w.macv-command-history-1965 72 n.271: all'
      tags:
      - name:westmoreland-william
    section: '196502'
- add:
    entry:
      id: cal.1965-03-16.japan-and-korea-korean-troops
      when: Mar. 16
      date: '1965-03-16'
      thread: japan-and-korea-korean-troops
      c: The main party of the Korean Dove unit arrives, based at Dĩ An, Biên Hòa.
      n: '[[w.macv-command-history-1965]], 72. See [[cal.1965-02-08.japan-and-korea-korean-troops]].'
      src:
        c: 93d71696
        rows:
        - 'w.macv-command-history-1965 72: all'
    section: '196503'
- add:
    entry:
      id: cal.1965-09-06.japan-and-korea-korean-troops
      when: Sept. 6
      date: '1965-09-06'
      thread: japan-and-korea-korean-troops
      c: 'A new military working arrangement with the Koreans for their division: no word of command, the Policy Council''s
        guidelines; full American logistic support. In practice Field Force, Vietnam''s commander has operational control,
        his orders phrased as requests.'
      n: '[[w.macv-command-history-1965]], 72–73. To check: Military Working Arrangement between COMROKFV and COMUSMACV,
        6 Sep 65 (cited by [[w.macv-command-history-1965]], 72 n.272). See [[cal.1965-02-08.japan-and-korea-korean-troops]].'
      src:
        c: '91134748'
        rows:
        - 'w.macv-command-history-1965 72–73: all'
        - 'via w.macv-command-history-1965 72 n.272: all'
    section: '196509'
- add:
    entry:
      id: cal.1965-11-08.japan-and-korea-korean-troops
      when: Nov. 8
      date: '1965-11-08'
      thread: japan-and-korea-korean-troops
      c: The Korean Capital Division (-) and Marine Brigade fully deployed, to security at Cam Ranh Bay and Qui Nhơn. 20,620
        Koreans at the year's end.
      n: '[[w.macv-command-history-1965]], 72–73. See [[cal.1965-10-08.japan-and-korea-korean-troops]].'
      src:
        c: 36891bb1
        rows:
        - 'w.macv-command-history-1965 72–73: all'
    section: '196511'
- add:
    entry:
      id: cal.1965-11-25.vietnam-force-levels
      when: Nov. 25
      date: '1965-11-25'
      thread: vietnam-force-levels
      c: The Republic of China gives the South Vietnamese air force two C-46s, on trial, with Chinese crews, as cargo carriers.
        Its 20 political warfare advisers in the country since October 1964.
      n: '[[w.macv-command-history-1965]], 73. To check: Saigon Daily News, 26 Nov 65 (cited by [[w.macv-command-history-1965]],
        73 n.285).'
      src:
        c: '17287683'
        rows:
        - 'w.macv-command-history-1965 73: all'
        - 'via w.macv-command-history-1965 73 n.285: all'
    section: '196511'
- add:
    entry:
      id: cal.1965-09-29.vietnam-force-levels
      when: Sept. 29
      date: '1965-09-29'
      thread: vietnam-force-levels
      c: A small Thai group arrives to help train the South Vietnamese air force; 17 men at the year's end.
      n: '[[w.macv-command-history-1965]], 73.'
      src:
        c: d83ef8f8
        rows:
        - 'w.macv-command-history-1965 73: all'
    section: '196509'
- add:
    entry:
      id: cal.1965-02-01.vietnam-3
      when: Feb. 1
      date: '1965-02-01'
      thread: vietnam
      c: Westmoreland orders a 60-day test at two CIDG camps in IV Corps of Special Forces detachments as subsector advisory
        teams; found feasible. 181 subsector teams planned for the year, 29 of them Special Forces.
      n: '[[w.macv-command-history-1965]], 76. To check: Fact Sheet, MACJ-310, 19 Apr 65, Subj: CIDG Programs (cited by
        [[w.macv-command-history-1965]], 76 n.316). Names: Westmoreland.'
      src:
        c: c8e973ef
        rows:
        - 'w.macv-command-history-1965 76: all'
        - 'via w.macv-command-history-1965 76 n.316: all'
      tags:
      - name:westmoreland-william
    section: '196502'
- add:
    entry:
      id: cal.1965-07-19.vietnam-force-levels
      when: July 19
      date: '1965-07-19'
      thread: vietnam-force-levels
      c: Saigon. Westmoreland recommends to McNamara ten more Special Forces A detachments; McNamara approves, a plan for
        up to 24, TDY teams from Okinawa meanwhile. The camp study that follows asks five B and 24 A detachments (Aug. 24).
      n: '[[w.macv-command-history-1965]], 78. To check: Memo, 5SFG, 31 Jul 65, Subj: Expansion of SF in VN (cited by [[w.macv-command-history-1965]],
        78 n.330). See [[cal.1965-07-16.vietnam-force-levels]]. Names: Westmoreland, McNamara.'
      src:
        c: 864b2f33
        rows:
        - 'w.macv-command-history-1965 78: all'
        - 'via w.macv-command-history-1965 78 n.330: all'
      tags:
      - name:westmoreland-william
      - name:mcnamara-robert-s
    section: '196507'
- add:
    entry:
      id: cal.1965-09-12.vietnam
      when: Sept. 12
      date: '1965-09-12'
      thread: vietnam
      c: Westmoreland's letter on the advisory effort and MACV's primary mission, after the J1's warning (Sept. 9) that
        the staff favors American units over the advisers.
      n: '[[w.macv-command-history-1965]], 80. To check: Memo, MACJ1, 9 Sep 65, Subj: Impact of Introduction of US Units
        on the Advisory Effort in RVN (cited by [[w.macv-command-history-1965]], 80 n.343); Ltr, MACV, 12 Sep 65, Subj:
        Support of the US Advisory Effort within RVN (cited by [[w.macv-command-history-1965]], 80 n.344). Names: Westmoreland.'
      src:
        c: aac0c190
        rows:
        - 'w.macv-command-history-1965 80: all'
        - 'via w.macv-command-history-1965 80 n.343: all'
        - 'via w.macv-command-history-1965 80 n.344: all'
      tags:
      - name:westmoreland-william
    section: '196509'
- add:
    entry:
      id: cal.1965-09-18.vietnam-3
      when: Sept. 18
      date: '1965-09-18'
      thread: vietnam
