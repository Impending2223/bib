      when: Mar.
      date: 1965-03
      thread: vietnam
      c: 'The Army Chief of Staff proposes an Army component command under Throckmorton. Westmoreland: no; he should himself
        be the Army component commander, Throckmorton a field commander of combined forces.'
      n: '[[w.macv-command-history-1965]], 96. Check: the day. To check: Msg, COMUSMACV, MAC 1722, 30 Mar 65 (cited by [[w.macv-command-history-1965]],
