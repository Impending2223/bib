      when: July 6
      date: '1965-07-06'
      thread: vietnam-force-levels
      c: The 1st Logistical Command raised to a Type B unit. McNamara had approved the engineers and a full Type A command
        by the end of April, reversing himself.
      n: '[[w.macv-command-history-1965]], 106. To check: Memo, COMUSMACV''s Notebook, Honolulu, Hawaii Trip, 18 Apr 65
