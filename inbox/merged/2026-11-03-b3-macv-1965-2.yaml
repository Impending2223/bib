      when: July 10
      date: '1965-07-10'
      thread: vietnam-force-levels
      c: The U.S. Military Assistance Command, Thailand, established as a separate command.
      n: '[[w.macv-command-history-1965]], 103. To check: Msg, CINCPAC, 091911Z Jul 65 (cited by [[w.macv-command-history-1965]],
