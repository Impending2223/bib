      when: July 13
      date: '1965-07-13'
      thread: vietnam-force-levels
      c: The Naval Support Activity, Đà Nẵng, takes over the ports, beaches, depots and common supply in I Corps, CINCPAC
        having given III MAF the region's common-user supply at Honolulu, Apr. 18, and extended it in early July.
      n: '[[w.macv-command-history-1965]], 107. To check: Memo, COMUSMACV''s Notebook, 20 Aug 65 (as the note''s "Ibid."
