      when: Sept. 14
      date: '1965-09-14'
      thread: vietnam-force-levels
      c: Westmoreland schedules the phase-out of Headquarters Support Activity, Saigon, the Navy's, by June 30, 1966, its
        19 functions to the Army; the field advisers' support to the 1st Logistical Command since Sept. 1. The Joint Chiefs
        approve in November.
      n: '[[w.macv-command-history-1965]], 108. To check: Briefing, J4 to COMUSMACV, Nov 65, on the transfer of support
        functions (cited by [[w.macv-command-history-1965]], 108 n.501). Names: Westmoreland.'
