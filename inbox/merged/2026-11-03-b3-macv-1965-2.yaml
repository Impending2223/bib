      id: cal.1965-07-13.vietnam
      when: July 13
      date: '1965-07-13'
      thread: vietnam
      c: Brig. Gen. J. A. McChristian, Army, appointed MACV's J2, the Marines having no successor for Youngdale.
      n: '[[w.macv-command-history-1965]], 93. To check: Msg, DA, WDC 1576, Feb 65 (cited by [[w.macv-command-history-1965]],
