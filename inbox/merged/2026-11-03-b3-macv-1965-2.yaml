      c: 'Bushmaster, south of the Michelin plantation, Bình Dương: the 3d Brigade, 1st Infantry Division, exploiting the
        B-52 strikes of Nov. 14 on three Viet Cong regiments'' base areas. 277 Viet Cong killed, five captured; 27 Americans
        killed, 176 wounded; over 100 weapons and 100 tons of rice taken.'
