      when: July
      date: 1964-07
      thread: vietnam
      c: Westmoreland and the Ambassador recommend Lt. Gen. John L. Throckmorton as Westmoreland's deputy, an Army officer,
        the war being a ground war; CINCPAC wanted a joint approach.
      n: '[[w.macv-command-history-1965]], 92. Check: the day. To check: Msg, COMUSMACV, 180158Z Jun 64 (cited by [[w.macv-command-history-1965]],
