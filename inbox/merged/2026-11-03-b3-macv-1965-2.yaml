- add:
    entry:
      id: cal.1965-04-15.vietnam-operations
      when: Apr. 15
      date: '1965-04-15'
      thread: vietnam-operations
      c: 'War Zone C. A mass raid of some 400 2d Air Division, Seventh Fleet and VNAF fighter-bombers over twelve hours:
        443 sorties in the day, over 1,000 tons of bombs, twice 1964''s monthly average. The Viet Cong''s losses apparently
        minor, the pattern ragged in smoke and dust; the case for B-52s.'
