      when: June
      date: 1965-06
      thread: vietnam-force-levels
      c: An MSTS tanker, the *Taluga*, stationed off Đà Nẵng as floating fuel storage; Shell and Esso begin new storage
        at Đà Nẵng, Qui Nhơn, Nha Trang, Tân Sơn Nhứt, Nhà Bè, Cần Thơ and Liên Chiểu.
      n: '[[w.macv-command-history-1965]], 112. Check: the day; and the tanker''s name (the copy reads "&taluna").'
