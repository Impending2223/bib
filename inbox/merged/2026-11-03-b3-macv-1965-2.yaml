      when: Jan. 31
      date: '1965-01-31'
      thread: vietnam-force-levels
      c: An OSD group under Glen Gibson arrives in Saigon on the logistical command, at first opposed; after four days of
        conferences it recommends one, 350 men to start, the engineer construction group not yet.
      n: '[[w.macv-command-history-1965]], 105. To check: Memo, J4, 4 Feb 65, Subj: Recent Discussion on US Army Logistic
