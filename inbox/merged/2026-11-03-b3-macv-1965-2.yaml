      when: Aug.
      date: 1965-08
      thread: vietnam
      c: The Air Force Advisory Group gets approval to train South Vietnamese B-57 crews and mechanics in PACAF; jet training
        at Clark begins. Four South Vietnamese crews fly with the American B-57 unit at Đà Nẵng by the year's end.
      n: '[[w.macv-command-history-1965]], 83–84. Check: the day.'
