      when: May 15
      date: '1965-05-15'
      thread: vietnam-force-levels
      c: A briefing recommends to Westmoreland Cam Ranh Bay as a second major deep-water port and logistics complex for
        I and II Corps; the land approved May 13. Westmoreland approves the plan in concept; the Joint Chiefs concur by
        the end of May.
      n: '[[w.macv-command-history-1965]], 108. To check: Memo, MACJ4, 15 May 65, Subj: Support Areas Feasibility Briefing
        (cited by [[w.macv-command-history-1965]], 108 n.498). See [[cal.1965-06-09.vietnam-force-levels]]. Names: Westmoreland.'
