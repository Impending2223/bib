    entry:
      id: cal.1965-04.vietnam-4
      when: Apr.
      date: 1965-04
      thread: vietnam
      c: The chief of the Naval Advisory Group tells Westmoreland the South Vietnamese navy is unresponsive and patrols
        poorly; it has never been aggressive.
      n: '[[w.macv-command-history-1965]], 89. Check: the day. Names: Westmoreland.'
