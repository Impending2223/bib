      when: May 1
      date: '1965-05-01'
      thread: vietnam-saigon
      c: The South Vietnamese navy and Marine Corps made separate services, the Joint General Staff holding Khang in regard
        and the navy in low.
      n: '[[w.macv-command-history-1965]], 90.'
