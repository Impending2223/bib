- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-2
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: 'About ten at night, after the address, Cater to McPherson by telephone: the President goes to Chicago tomorrow,
        to the National Association of Broadcasters; Cater has drafted the speech; Johnson wants McPherson to come down and
        work on it. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 439. See [[cal.1968-03-31.vietnam-205000-3]]. Names: Cater, Johnson, McPherson.'
      tags:
      - name:cater-s-douglass
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      src:
        c: db94ac2e
        rows:
        - 'w.mcpherson-political-education 439: all'
    section: '196803'
