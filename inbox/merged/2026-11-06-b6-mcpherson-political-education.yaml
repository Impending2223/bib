patch: 2026-11-06-b6-mcpherson-political-education
by: Claude (agent), batch 6 reader (group 9), McPherson, Nov. 10-11, 2026
ops:
- add:
    entry:
      id: cal.1963-11-24.succession-6
      when: Nov. 24
      date: '1963-11-24'
      thread: succession
      c: 'St. Mark''s Episcopal Church. The Johnsons at the service, the sermon hymn "America." Bill Baxter, its minister:
        remember this moment, the country united in its shock, soon to be divided again; pray for Lyndon Johnson. Afterward,
        in the parish hall, Johnson talks a long while with McPherson. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 214–15. Check: the day; the book gives "two days later" than the news from
        Dallas. Names: Johnson, Lady Bird Johnson, McPherson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mcpherson-harry
      src:
        c: ac758542
        rows:
        - 'w.mcpherson-political-education 214–15: all'
    section: '196311'
- add:
