- add:
    entry:
      id: cal.1968-06-05.assassination-6
      when: June 5
      date: '1968-06-05'
      thread: assassination
      also:
      - robert-kennedy-campaign
      c: 'Evening, the Oval Office. McPherson beside Johnson, the three television sets tuned to the networks: on the middle
        one Mankiewicz reading the latest medical bulletin on Robert Kennedy; a western and a spy show on the others. By McPherson''s
        account.'
      n: '[[w.mcpherson-political-education]], 381–82. See [[cal.1968-06-05.assassination-3]]. Names: Johnson, McPherson,
        Mankiewicz, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      - name:mankiewicz-frank
      - name:kennedy-robert-f
      src:
        c: ace3927e
        rows:
