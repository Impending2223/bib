      c: 'Mao to Wu Lengxi on an article in Xinhua''s *Cankao ziliao* of July 31, "Has Khrushchev changed his attitude?", from a Cambodian news-agency dispatch: "seems publishable"; "the whole is good." The article: the Soviet distortion of China''s view on nuclear war, and its charges on peaceful coexistence, fall in with the Western states''; at the opening of the talks a compromise was hoped for, now all hope is gone and Khrushchev''s approach to the West a fact. Printed in *Renmin ribao* Aug. 1.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 24 (July 31, 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). To check: Xinhua, Cankao ziliao, July 31, 1963: Cambodian news-agency dispatch, "Has Khrushchev changed his attitude?" (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 24 n.1). Names: Mao Zedong, Wu Lengxi, Khrushchev.'
