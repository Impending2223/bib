      when: Dec. 25
      date: '1963-12-25'
      thread: china-leadership
      c: 'Mao on Mo Wenhua''s Dec. 22 report to Xiao Hua on helping the industrial system train political cadres: in the paper, titles of office ("Chairman Mao") to be made name plus "comrade" ("Comrade Mao Zedong"), and habitual titles ("Marshal Lin") likewise. The custom of decades, not good form; it has bred bureaucratic ways between officers and men and between higher and lower, and awkwardness. He proposes to change it firmly.'
