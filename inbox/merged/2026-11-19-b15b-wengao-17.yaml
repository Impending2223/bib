      c: 'Mao, Liu Shaoqi, Zhu De and Zhou Enlai telegraph Fidel Castro and Osvaldo Dorticós on the tenth anniversary of the Cuban armed uprising: Cuba the first socialist state in the Americas; the two Havana Declarations; the United States will not give up interference; the Chinese people are Cuba''s most faithful comrades-in-arms.'
