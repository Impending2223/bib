      date: '1963-12-14'
      thread: china-leadership
      c: 'Mao to Liu Shaoqi, Deng Xiaoping and Peng Zhen, on an item in the General Office''s *Qunzhong fanying* no. 83: a political commissar, instructor or propagandist for each production team, a young literate who does not leave production, to take up political and ideological work among several hundred million villagers; in city industry, commerce and neighborhoods, political departments and offices and instructors from top to bottom on the army''s model. The Secretariat to take it up, then the Standing Committee.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 144–145 (Dec. 14, 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). To check: Qunzhong fanying no. 83, Dec. 13, 1963: "Political and ideological work in the villages needs strengthening," from a letter of Nov. 1963 by Fu Jinsheng, propaganda department of the Beian county committee, Heilongjiang (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 145 n.2). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
