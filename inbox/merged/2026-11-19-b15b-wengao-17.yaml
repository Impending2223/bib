- add:
    entry:
      id: cal.1963-12-14.china-leadership-4
      when: Dec. 14
      date: '1963-12-14'
      thread: china-leadership
      c: 'Mao to Lin Biao: glad his health has improved; his view of the two rural documents right, the situation at home and abroad turned for the better. The documents went out in mid-November; early December several provinces report good effect, read to all members of production brigades and to the five types, some with over 700 listeners. The army to do likewise: regiment and battalion officers to read and explain them to every company in several sittings, with discussion; army and division cadres to go down; senior officers Luo Ruiqing, Xiao Hua, Yang Yong, Liao Hansheng, Xu Shiyou, Huang Yongsheng and Liu Yalou to take a company or two for a lecture or two; the General Political Department to send a notice; to be repeated after some months; the army could then help factories and villages. Consult Luo and Xiao. Postscript: Cao Cao''s poem "The tortoise, though long-lived" on health, to be read.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 141–143 (Dec. 14, 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). Names: Mao Zedong, Lin Biao, Luo Ruiqing, Xu Shiyou, Huang Yongsheng.'
