      when: Dec. 13
      date: '1963-12-13'
      thread: china-leadership
      c: 'Mao to Zhou Shizhao: Tian Renzun''s letter, which shows his life very hard, seems to ask help; 500 yuan sent for him. If other poor teachers or friends from Mao''s school days are in hardship, tell Mao; help to go through Zhou''s hand, a kind of socialist aid.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 133 (Dec. 13, 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). Names: Mao Zedong, Zhou Shizhao.'
