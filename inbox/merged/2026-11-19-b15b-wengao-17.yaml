- add:
    entry:
      id: cal.1963-09.china-leadership-2
      when: Sept., early
      date: 1963-09
      thread: china-leadership
      at: before 1963-09-01
      c: 'Mao writes into the first draft of "On problems of industrial development" a paragraph: from the 1840s to the mid-1940s, 105 years, nearly every imperialist power great and small attacked China, and every war but the last, the one against Japan, ended in defeat and a treaty of shame; the causes a rotten social system and a backward economy. The first is changed but not wholly, classes remain; the second will take decades. Without changing it within decades, being beaten cannot be avoided. War may be avoided or not; the work to be laid out on the footing that China may be attacked.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 41–42 (Sept. 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). See [[cal.1963-08-26.china-leadership]]. Check: the day; the note gives only the first ten days of September. Names: Mao Zedong.'
