- add:
    entry:
      id: cal.1963-12-21.china-leadership-8
      when: Dec. 21
      date: '1963-12-21'
      thread: china-leadership
      c: 'Mao to Bo Yibo on his Dec. 19 report on industry and transport departments learning the army''s political work, sent Dec. 20: read; consider printing it for the comrades at the meeting for study and discussion. Bo''s report: the departments fall in two classes, Petroleum having taken the army''s political work whole; measures proposed: all industry and transport ministries to build a political-work system on the army''s model, a draft work regulation, leading cadres sent to army political colleges, 300 to 500 army cadres transferred for political work, and later a central body to run it.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 150–151 (Dec. 21, 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). To check: Bo Yibo to Mao Zedong, report of Dec. 19, 1963 on the industry and transport departments'' learning the Liberation Army''s political work (sent Dec. 20) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 150 n.2). Names: Mao Zedong, Bo Yibo.'
