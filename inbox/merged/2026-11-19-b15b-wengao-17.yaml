      date: '1963-11-22'
      thread: china-leadership
      c: 'Mao to Xie Fuzhi and Peng Zhen on Xie''s draft speech for the NPC''s fourth session, "Rely on the broad masses, strengthen the people''s democratic dictatorship, remake most of the reactionary forces into new men": read, very good. After it is given, they are to consider sending it to the county Party committees and county public security bureaus with a few lines of introduction from the Center, as material for educating cadres, mentioning the Zhuji example, for places to copy through trial points and then spread.'
