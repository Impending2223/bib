      date: '1963-12-30'
      thread: china-leadership
      c: 'Mao on the printed draft instruction on mutual learning: to Liu Shaoqi and Deng Xiaoping to read again; then that he has changed a few words, and after their reading it may go out with the Hunan document, the date still Dec. 13. The Center had discussed and passed the instruction in late December; it went out within the Party Jan. 3, 1964.'
