      c: 'Mao''s marginal notes on a Xinhua *Neibu cankao* item of Dec. 11, "The Soviet academic world''s discussion of the philosophy of cybernetics grows hot": "reconcilers" and "cautious school" beside two passages. Of a Soviet scholar''s view that peace can and should be controlled: a subjective-idealist, metaphysical theory that denies objective laws independent of human will; the law of uneven development fixes that peace can be controlled under some conditions, since both sides are unwilling to fight; under new conditions one side, by no will of man, thinks it must fight and no longer accepts control, and war breaks out.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 127–128 (Dec. 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). Check: the day; the book dates it Dec. 1963, after the item of Dec. 11. To check: Xinhua, Neibu cankao (supplement) no. 639, Dec. 11, 1963: "The Soviet academic world''s discussion of the philosophy of cybernetics in recent years grows hot" (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 128 n.1). Names: Mao Zedong.'
