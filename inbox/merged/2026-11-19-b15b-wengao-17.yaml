- add:
    entry:
      id: cal.1963-06-30.china-leadership-3
      when: June 30
      date: '1963-06-30'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao on Wu Lengxi''s draft Central Committee statement naming the delegation to the Sino-Soviet party talks to open in Moscow July 5, with Deng Xiaoping as its head: "Do as proposed," 10:30 a.m. At 7 p.m., to Kang Sheng, on his letter of the day: seen, agrees with Deng''s view. Kang writes that Khrushchev''s report is in and translated, the passage attacking the Chinese party copied out; Deng holds that the draft statement can stand unchanged, to be broadcast that night after the Politburo passes it at 8, and to appear in the paper next day.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 5–6 (June 30, 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). See [[cal.1963-06-30.china-leadership-2]]. To check: Wu Lengxi, draft statement of the Central Committee of the Chinese Communist Party on the delegation to the Sino-Soviet party talks, June 30, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 5 n.1); Kang Sheng to Mao Zedong, letter, June 30, 1963, with Khrushchev''s passage attacking the Chinese party copied out (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 6 n.2a); Khrushchev, long speech to the plenum of the CPSU Central Committee, June 18–21, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 6 n.2b); Statement of the Central Committee of the Chinese Communist Party, Renmin ribao, July 1, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 6 n.2c). Names: Mao Zedong, Kang Sheng, Deng Xiaoping, Wu Lengxi.'
      tags:
