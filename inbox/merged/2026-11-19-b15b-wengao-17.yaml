      id: cal.1963-12-23.china-leadership-5
      when: Dec. 23
      date: '1963-12-23'
      thread: china-leadership
      c: 'Mao drafts for the Center the instruction forwarding the Jiangsu committee''s Dec. 20 report on trial readings of the two rural documents to village cadres and the masses: study it; take the matter up in earnest, to have the documents read and explained once, with some discussion, in country, city, army, offices and schools (primary schools excepted) before spring plowing; sum up experience as it goes; point work in the villages to go on by stages. To Liu Shaoqi, Deng Xiaoping, Zhu De, Peng Zhen and Tan Zhenlin: of the reports in, Jiangsu''s is the better, so forwarded; Tan Zhenlin''s earlier draft instruction not to go out, this to go in its place. Issued Dec. 27.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 154–157 (Dec. 23, 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). To check: Jiangsu provincial Party committee, report of Dec. 20, 1963 on trial readings and explanations of the Center''s two documents to village cadres and the masses (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 155 n.2); Tan Zhenlin, draft instruction on reading the two documents, Dec. 1963 (not issued) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 155 n.3). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Zhu De, Peng Zhen, Tan Zhenlin.'
