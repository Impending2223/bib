patch: 2026-11-19-b15b-wengao-17
by: 'Claude (batch 15b, cite pass of the *Jianguo yilai Mao Zedong wengao*, vol. 17, June 1963–Jan. 1965, 2023 ed.), Nov. 19, 2026'
ops:
- add:
    entry:
      id: cal.1963-06-26.china-leadership-3
      when: June 26
      date: '1963-06-26'
      thread: china-leadership
      c: 'Mao, on Zhou Enlai''s June 9 draft report on the adjusted plan for the last two years of the Second Five-Year Plan and its execution: sent to Zhou to revise; read, usable. The Hangzhou conference passages (pp. 6, 35–37, 41 of the draft) not to be used for now; the statement on spring crops on p. 1 to be rewritten. Four passages are struck: on class struggle, the struggle for production and scientific experiment as three great revolutionary movements; on where correct ideas come from; on teaching the comrades the Marxist theory of knowledge; on the socialist education movement.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 1–2 (June 26, 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). See [[cal.1963-06.china-leadership-3]]. To check: Zhou Enlai, draft report on the adjusted plan for the last two years of the Second Five-Year Plan and the execution of the plan, June 9, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 1 n.1a); Li Fuchun, report on the adjusted plan, to the 99th meeting of the NPC Standing Committee, July 3, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 1 n.1b); Central Committee, Decision on some current problems in rural work (draft), with Mao''s added passage on where correct ideas come from, Hangzhou, May 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 2 n.2a); Mao Zedong, comments on seven Zhejiang materials, with the passage on the meaning of the socialist education movement, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 2 n.2b). Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
