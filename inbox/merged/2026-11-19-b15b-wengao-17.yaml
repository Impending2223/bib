      c: 'Mao receives African guests: a Basutoland Congress Party delegation, the head of the Comoros national liberation movement, a delegation of the Federation of Black African Students in France, the Cairo representative of the Zimbabwe African People''s Union of Southern Rhodesia, and a Kenyan writer. He condemns racial discrimination in the United States, South Africa and everywhere; the race question is at bottom a class question; the oppressed free themselves first by their own struggle, then with international help. At the meeting he issues the statement supporting the American Blacks.'
