- add:
    entry:
      id: cal.1963-12-13.china-leadership-5
      when: Dec. 13
      date: '1963-12-13'
      thread: china-leadership
      c: 'Mao drafts for the Center its instruction "On strengthening mutual learning, and overcoming standing pat and complacency," forwarding the Hunan committee''s report by Li Ruishan and Hua Guofeng on a visit to Guangdong''s farm production and Hunan''s instruction of Dec. 7: to learn from other provinces'' good experience is an important method; standing pat is metaphysics, blind to the two sides of things; the Center holds Hunan''s sending of study delegations to Guangdong and Shanghai something others can and should do. To Liu Shaoqi, Deng Xiaoping, Zhu De, Peng Zhen, Luo Ruiqing, Kang Sheng, Chen Boda, Bo Yibo, Li Xiannian, Xie Fuzhi and Tan Zhenlin: the Hunan paper may be forwarded, with great benefit; review it, or hold a meeting.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVII, 134–139 (Dec. 13, 1963). Made public: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). To check: Li Ruishan and Hua Guofeng, report to the Hunan committee on a visit to Guangdong''s farm production, Nov. 6, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 137 n.2); Hunan provincial Party committee, instruction of Dec. 7, 1963 forwarding the report on the visit to Guangdong (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 138 n.3). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Zhu De, Peng Zhen, Luo Ruiqing, Kang Sheng, Chen Boda, Bo Yibo, Li Xiannian, Xie Fuzhi, Tan Zhenlin, Hua Guofeng.'
