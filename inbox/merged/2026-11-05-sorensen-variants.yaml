patch: sorensen-variants
by: 'Claude (the owner''s ruling, Nov. 5, 2026: "The record stands in the entry; Sorensen''s version goes
  in as a variant.")'
ops:
- edit:
    id: cal.1963-09-24.vietnam
    base: e3f0e6b0
    set:
      variants:
      - unit: A
        witness: w.sorensen-kennedy
        reads: the letter as sent to Diệm
        at: '658'
      n: '[FRUS 1961–63, IV: Vietnam, August–December 1963, doc. 147](https://history.state.gov/historicaldocuments/frus1961-63v04/d147)
        (telegram 476, 9:25 p.m., drafted by Hilsman, cleared with Harriman and McGeorge Bundy); the draft
        of Sept. 16, [doc. 115](https://history.state.gov/historicaldocuments/frus1961-63v04/d115). Reply:
        Lodge and McNamara, telegram 593, Sept. 25, against transmitting a letter (doc. 147 n.2). [[w.sorensen-kennedy]],
        658 (the letter''s passages on public support, assistance and the reporters; the officials to
        take part in decisions). Check: Sorensen gives the letter as written to Diệm (658); FRUS prints
        no delivery, and Lodge and McNamara advised against it. See [[cal.1963-09-23.vietnam]]. Names:
        Kennedy, Diệm, Lodge, McNamara.'
- edit:
    id: cal.1962-10-25.missile-crisis-4
    base: fea46060
    set:
      variants:
      - unit: C
        witness: w.sorensen-kennedy
        reads: U Thant's second proposal, on Friday, Oct. 26
        at: '710'
- edit:
    id: cal.1962-10-27.missile-crisis-4
    base: ef62a11f
    set:
      variants:
      - unit: J
        witness: w.sorensen-kennedy
        reads: fighter escorts authorized
        at: 713–14
      n: '[Executive Committee Meeting, 4:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/executive-committee-meeting-national-security-council-10),
        Tape 41 (Miller Center); [continued](https://millercenter.org/the-presidency/secret-white-house-tapes/executive-committee-meeting-national-security-council-11),
        Tape 41A (Miller Center). [FRUS 1961–63, XI, doc. 94](https://history.state.gov/historicaldocuments/frus1961-63v11/d94).
        [FRUS 1961–63, X–XII, microfiche supp., doc. 437](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d437)
        (record of action, meeting no. 8). [[w.caro-passage-of-power]], 216–21; [[w.schlesinger-robert-kennedy-and-his]],
        525 (Johnson, by Robert Kennedy''s memorandum of Nov. 15); [[w.sorensen-kennedy]], 713–14 (the
        flare-drop flight called off; the letter to U Thant; the Alaska U-2 ignored). To check: Robert
        Kennedy, memorandum dictated Nov. 15, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]],
        525, the footnote). Check: Sorensen has fighter escorts authorized; the record, the next day''s
        mission without escort. See [[cal.1962-10-16.missile-crisis]]. Names: Johnson, Robert Kennedy,
        Bundy, Dillon, Thompson, Kennedy, U Thant.'
