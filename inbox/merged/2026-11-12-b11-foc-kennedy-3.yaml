      c: 'Warren, Mich., Tech Plaza Shopping Center, in rain. Kennedy with McNamara and O''Hara: "only in Michigan would everybody
        stand out in the rain. The Republicans are all home in bed." Nixon''s praise of the Housing Act of 1949; his vote
        in 1949 to take a million people from the minimum wage.'
      n: 'Remarks of Senator John F. Kennedy, Tech Plaza Shopping Center, Warren, MI, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-tech-plaza-shopping-center-warren-mi)
