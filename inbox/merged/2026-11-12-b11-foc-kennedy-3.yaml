        to the Bronx as an old Bronx boy"; he lived in Riverdale.'
      n: 'Remarks of Senator John F. Kennedy, Fordham Road and Grand Concourse, Bronx, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-fordham-road-and-grand-concourse-bronx-ny)
