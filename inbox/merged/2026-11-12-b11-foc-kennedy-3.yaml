      when: Oct. 27
      date: '1960-10-27'
      thread: elections-1960-kennedy
      c: 'Brooklyn, the Eastern Parkway Arena. Kennedy with Lehman, Mayor Wagner, Celler, Farley, Prendergast and Levitt:
        a brief speech; what Roosevelt, Wilson and Truman "tried to do, the Republican Party stood against."'
      n: '[[w.communications-freedom-of-communications-part]], 780–82. APP prints only the advance release text of this speech.
        Names: Kennedy, Wagner, Celler, Levitt, Truman.'
