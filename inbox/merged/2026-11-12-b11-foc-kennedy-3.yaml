      when: Nov. 5
      date: '1960-11-05'
      thread: elections-1960-kennedy
      c: 'Nassau County, N.Y., Wantagh and Sunrise Avenues. Kennedy, late and in rain, of the last days: "we have traveled
        in nine States, all the way, from California here to Nassau County"; "on Tuesday, the sun is coming up for us."'
      n: 'Remarks of Senator John F. Kennedy, Wantagh and Sunrise Avenues, Nassau County, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-wantagh-and-sunrise-avenues-nassau-county-ny)
