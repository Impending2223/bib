      c: 'Hartford, Conn., the Hartford Times steps. Kennedy with Gov. Ribicoff, Daddario and Kowalski, and his sisters Eunice
        Shriver, Jean Smith and Patricia Lawford; ends with the Spartans'' epitaph, "Passerby: America is faithful to the
        service of freedom."'
