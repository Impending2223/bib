      c: New York, the ILGWU rally, with Dubinsky and Alex Rose. Kennedy asks support "in defeating Mr. Nixon and the Republican
        Party"; Nixon runs on "We've never had it so good," he on "We are going to have to do much better." Ends with Lincoln's
        "a place and a part" and "Help us in the next 10 days."
      n: 'Remarks of Senator John F. Kennedy, ILGWU Rally, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-ilgwu-rally-new-york-ny)
