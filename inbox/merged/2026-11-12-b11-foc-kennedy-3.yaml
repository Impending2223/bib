- check:
    id: cal.1960-10-23.cuba
    text: 'Check: whether this is Kennedy''s telegram to Nixon of the same day, [[w.communications-freedom-of-communications-part]],
      726, which reads "I have never advocated and I do not now advocate intervention in Cuba in violation of our treaty obligations"
      and "to let the forces of freedom in Cuba know that we believe that freedom will again rise in their country," not "that
      we are on their side."'
- cite:
    id: cal.1960-10-31.economy
    item: '[[w.communications-freedom-of-communications-part]], 823–27 (the statement at Philadelphia on the balance of payments;
      825: "If elected President I shall not devalue the dollar from the present rate"; the report''s heading dates it Oct.
      31, its contents Oct. 30)'
    units: A
- cite:
    id: cal.1960-11-01.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 840–44 (the First-Time Voters Convocation, University of Southern
      California, remarks 840–42 and the question period 842–44; 844: "Ninety percent of the Republicans voted against the
      social security in the mid-thirties and 95 percent in 1960 voted against the medical care for the aged tied to social
      security")'
    units: A
- primary:
    id: cal.1960-11-01.elections-1960
    text: Remarks of Senator John F. Kennedy, First-Time Voters Convocation, University of Southern California, Los Angeles,
      CA - Question and Answer Period, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-first-time-voters-convocation-university-southern)
      (Nov. 1, 1960).
    units: A
- cite:
    id: cal.1960-11-02.elections-1960-4
    item: '[[w.communications-freedom-of-communications-part]], 853–57 (the speech at the Beverly Hilton Hotel, Los Angeles,
      Nov. 2: 855, Nixon "cast the deciding vote in the Senate" against aid for teachers'' salaries; the House Republicans''
      votes on school construction, 1957, 1958 and 1960; the words "tie-breaking vote killing a Democratic bill giving the
      states money to increase teachers'' salaries" and the pledge quoted in the note are not in the report''s text)'
    units: '?'
- primary:
    id: cal.1960-11-02.elections-1960-4
    text: Speech of Senator John F. Kennedy, Beverly Hilton Hotel, Los Angeles, CA, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-beverly-hilton-hotel-los-angeles-ca)
      (Nov. 2, 1960).
    units: '?'
- check:
    id: cal.1960-11-02.elections-1960-4
    text: 'Check: the report''s text of the Beverly Hilton speech (853–57) has Nixon "cast the deciding vote in the Senate"
      against aid for teachers'' salaries (855), not the quoted "tie-breaking vote killing a Democratic bill giving the states
      money to increase teachers'' salaries."'
- cite:
    id: cal.1960-11-02.peace-corps
    item: '[[w.communications-freedom-of-communications-part]], 862–66 (the speech at the Cow Palace; 865: "a peace corps
      of talented young men and women, willing and able to serve their country in this fashion for 3 years as an alternative
      or as a supplement to peacetime selective service")'
    units: A
- cite:
    id: cal.1960-10-30.elections-1960-5
    item: '[[w.communications-freedom-of-communications-part]], 840–99 (the report''s items: Los Angeles, Nov. 1, 840–53;
      San Francisco and Oakland, Nov. 2, 860–66; Phoenix, Albuquerque, Amarillo, Wichita Falls and Oklahoma City, Nov. 3,
      866–87; Norfolk and Roanoke, Va., Toledo and Chicago, Nov. 4, 887–899; 872, Albuquerque: "I would not accuse Mr. Nixon
      of being barefaced"; 866, the Phoenix airport, 3 a.m., Nov. 3: "If they can just get Barry out of that Confederate uniform";
      not the four hours'' sleep, and not the Philadelphia suburbs on Oct. 30–31 alone)'
    units: B, C, D, E, F, G
- check:
    id: cal.1960-10-30.elections-1960-5
    text: 'Check: the report prints the Philadelphia-area stops Oct. 29 (Lawrence Park, Chester, Upper Darby, Lord & Taylor,
      Norristown, Willow Grove, Cheltenham, Valley Forge, 803–21), Levittown Oct. 30 (821) and the city Oct. 31 (827–40).'
- cite:
    id: cal.1960-11-04.elections-1960-kennedy
    item: '[[w.communications-freedom-of-communications-part]], 894–99 (Kennedy''s speech at the Chicago Auditorium rally,
      Nov. 4, with Mayor Daley, Douglas and Kerner; not the torchlight parade, the Chicago Stadium or the 28,000)'
    units: '?'
- primary:
    id: cal.1960-11-04.elections-1960-kennedy
    text: Speech of Senator John F. Kennedy, Chicago Auditorium, Chicago, IL, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-chicago-auditorium-chicago-il)
      (Nov. 4, 1960).
    units: '?'
- check:
    id: cal.1960-11-04.elections-1960-kennedy
    text: 'Check: the place; the report heads Kennedy''s speech that night "Chicago Auditorium Rally" ([[w.communications-freedom-of-communications-part]],
      894), not the Chicago Stadium.'
- cite:
    id: cal.1960-11-05.elections-1960-2
    item: '[[w.communications-freedom-of-communications-part]], 908–09 (outside the Coliseum, New York, Nov. 5, in rain, with
      Johnson, Mrs. Johnson and their daughters: the circus elephants, "Dick grabbed that tail in 1952 and 1956"; "Dick Nixon
      stands where McKinley stood and Taft," Harding, Coolidge, Landon, Dewey; "I understand that Tom Dewey has just joined
      Dick Nixon out on the coast"; Waterbury "at 1 in the morning" to come; not midnight, the street corner, "Nixon Day"
      or Stevenson''s suggestion)'
    units: C, D
- cite:
    id: cal.1960-11-06.elections-1960-4
    item: '[[w.communications-freedom-of-communications-part]], 911–13 (the street rally at Waterbury, Conn.: Ribicoff "the
      first public official in the United States to support my campaign for the Presidency" (912); Lincoln''s letter, "if
      He has a place and a part for me, I believe that we are ready"; "It is now a quarter to 3"; not the crowd, the balcony
      or the hotel)'
    units: E, F
- check:
    id: cal.1960-11-06.elections-1960-4
    text: 'Check: the report''s Waterbury text has Kennedy say "my name is Kennedy and I have come to ask your support" (911)
      and "It is now a quarter to 3" (912), not "ask for your support" and "three in the morning"; at Providence he says he
      started at Waterbury "at 3 o''clock this morning" (930).'
- cite:
    id: cal.1960-11-07.elections-1960-5
    item: '[[w.communications-freedom-of-communications-part]], 938–41 (the remarks at the park, Manchester, N.H., with his
      three sisters Jean Smith, Eunice Shriver and Patricia Lawford; 939: "there is a publisher who has less regard for the
      truth than William Loeb, but I can''t think of his name")'
    units: B
