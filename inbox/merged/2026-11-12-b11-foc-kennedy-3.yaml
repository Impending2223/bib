      when: Nov. 5
      date: '1960-11-05'
      thread: elections-1960-kennedy
      c: 'New York, the Commodore Hotel, the State Democratic Committee. Kennedy with Prendergast, Gov. Ribicoff and Mayor
        Wagner: a midnight brunch "at $85 a person"; he and Truman "are staying at the same hotel"; eight or nine States in
        48 hours.'
      n: 'Remarks of Senator John F. Kennedy, New York State Democratic Committee, Commodore Hotel, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-new-york-state-democratic-committee-commodore-hotel-new)
