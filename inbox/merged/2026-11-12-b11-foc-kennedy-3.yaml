      thread: elections-1960-kennedy
      c: 'San Diego, Horton Plaza. Kennedy with Gov. Brown and Sen. Engle: Nixon''s call three weeks ago for a housing program,
        though he "voted against the Housing Act of 1949"; Republicans 98 percent against medical care for the aged this summer,
        90 percent against social security in the thirties.'
      n: 'Remarks of Senator John F. Kennedy, Horton Plaza, San Diego, CA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-horton-plaza-san-diego-ca)
