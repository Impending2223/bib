      when: Nov. 5
      date: '1960-11-05'
      thread: elections-1960-kennedy
      c: 'Queens, the Queens County Women''s Luncheon. Kennedy: "about 60 hours left"; New York has 45 electoral votes; the
        flowers given him go to his wife, "as we will have need for them in about a month."'
      n: 'Remarks of Senator John F. Kennedy, Queens County Women''s Luncheon, Queens, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-queens-county-womens-luncheon-queens-ny)
        (Nov. 5, 1960). [[w.communications-freedom-of-communications-part]], 902–03. Names: Kennedy.'
