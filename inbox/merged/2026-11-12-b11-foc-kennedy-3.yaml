      when: Nov. 5
      date: '1960-11-05'
      thread: elections-1960-kennedy
      c: 'The Bronx, the Concourse Plaza Hotel. Kennedy with Mayor Wagner, Rep. Buckley and Mrs. Margaret Price: Nixon, in
        "a high-level or high-road campaign," has called him "an economic ignoramus, a Pied Piper, and all the rest."'
      n: 'Remarks of Senator John F. Kennedy, Concourse Plaza Hotel, Bronx, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-concourse-plaza-hotel-bronx-ny)
        (Nov. 5, 1960). [[w.communications-freedom-of-communications-part]], 900–02. Names: Kennedy, Wagner, Nixon, Buckley.'
