      date: '1960-11-03'
      thread: elections-1960-kennedy
      c: 'Phoenix, a street rally. Kennedy with Rep. Udall, Harless, Lee Ackerman and Senator Hayden: "There is no election
        in the United States that is in the bag 2 weeks ahead"; Nixon will be retired "to the beauties of California."'
      n: 'Remarks of Senator John F. Kennedy, Street Rally, Phoenix, AZ, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-street-rally-phoenix-az)
