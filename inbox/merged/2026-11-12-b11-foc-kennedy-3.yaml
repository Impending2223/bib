      when: Nov. 5
      date: '1960-11-05'
      thread: elections-1960-kennedy
      c: 'New York, the 90th Street rally. Kennedy presents Johnson, "who came all the way from Texas," with Mrs. Johnson
        and their daughters, and Gov. Ribicoff: "Lyndon Johnson and I have each been in 40 States. That makes a total of 80."
        Nixon the circus elephant grabbing the tail ahead of him; Waterbury, Conn., at 2 a.m. to come.'
      n: 'Remarks of Senator John F. Kennedy, 90th Street Rally, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-90th-street-rally-new-york-ny)
        (Nov. 5, 1960). [[w.communications-freedom-of-communications-part]], 906–07. Names: Kennedy, Johnson, Ribicoff, Nixon.'
