      when: Nov. 3
      date: '1960-11-03'
      thread: elections-1960-kennedy
      c: 'Wichita Falls, Tex. Kennedy with Johnson, Yarborough, Mrs. Johnson and Ikard: Nixon in 1952 said Acheson had graduated
        from "the College of Cowardly Communist Containment," in 1951 called Truman a traitor, in 1960 called Kennedy a liar
        and Johnson an ignoramus; 13 States in the last days.'
      n: 'Remarks of Senator John F. Kennedy, Wichita Falls, TX, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-wichita-falls-tx)
        (Nov. 3, 1960). [[w.communications-freedom-of-communications-part]], 878–81. Names: Kennedy, Johnson, Yarborough,
        Nixon, Truman, Ikard, Acheson.'
