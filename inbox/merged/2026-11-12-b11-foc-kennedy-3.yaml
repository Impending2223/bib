patch: 2026-11-12-b11-foc-kennedy-3
by: Claude (batch 11 reader, Freedom of Communications pt. 1, Oct. 21-Nov. 7, 1960); audited (batch 11 auditor)
ops:
- add:
    entry:
      id: cal.1960-10-21.elections-1960-kennedy
      when: Oct. 21
      date: '1960-10-21'
      thread: elections-1960-kennedy
      also:
      - labor
      c: 'New York, Madison Square Garden. Kennedy to the Brotherhood of Electrical Workers, Mayor Wagner present: economic
        growth for the year''s first nine months "minus 0.3 percent"; "25,000 new jobs a week" to be found for ten years;
        90 percent of Republicans against social security in 1935 and against the 25-cent minimum wage. Nixon "stands in this
        century where McKinley stood and Harding and Coolidge and Landon and Dewey."'
      n: 'Speech of Senator John F. Kennedy, Madison Square Garden, Brotherhood of Electrical Workers, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-madison-square-garden-brotherhood-electrical-workers-new)
        (Oct. 21, 1960). [[w.communications-freedom-of-communications-part]], 687–89. Names: Kennedy, Wagner, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:wagner-robert-f-jr
      - name:nixon-richard-m
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1960-10-21.women
      when: Oct. 21
      date: '1960-10-21'
      thread: women
      also:
      - elections-1960-kennedy
      c: 'Kennedy to Mrs. Emma Guffey Miller, chairman of the National Woman''s Party, on the equal rights amendment: "The
        platform has my full support." He will interpret the Democratic platform to bring about, "through concrete actions
        including the adoption of the equal rights for women amendment, the full equality for women."'
      n: 'Letter to Mrs. Emma Guffey Miller, Chairman of the National Woman''s Party, [APP](https://www.presidency.ucsb.edu/documents/letter-mrs-emma-guffey-miller-chairman-the-national-womans-party)
        (Oct. 21, 1960). [[w.communications-freedom-of-communications-part]], 689. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-10-22.elections-1960-kennedy
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960-kennedy
      c: 'Crestwood, Mo., the shopping center, morning. Kennedy, Symington and Long on the platform: Nixon called him "just
        another Truman"; "I said I regarded that as a compliment because he was just another Dewey." The balance of power
        may shift in ten years if "other Cubas in Latin America" follow; Missouri "a key State."'
      n: 'Remarks of Senator John F. Kennedy, Crestwood Shopping Center, Crestwood, MO, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-crestwood-shopping-center-crestwood-mo)
        (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 689–91. Names: Kennedy, Symington, Long, Nixon,
        Truman.'
      tags:
      - name:kennedy-john-f
      - name:symington-william-s
      - name:long-edward-v
      - name:nixon-richard-m
      - name:truman-harry-s
      - state:mo
- add:
    entry:
      id: cal.1960-10-22.elections-1960-kennedy-2
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960-kennedy
      also:
      - elections-1960-debates
      c: 'Jennings, Mo., Northland Shopping Center. Kennedy reads Eisenhower''s words of Nov. 23, 1953, "meet anyone face
        to face with whom you disagree," and asks Nixon to accept a fifth debate: "There are 18 days until the election."
        He names Dalton for governor, Eagleton for attorney general, Long for the Senate.'
      n: 'Remarks of Senator John F. Kennedy, Northland Shopping Center, Jennings, MO, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-northland-shopping-center-jennings-mo)
        (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 691–93. Names: Kennedy, Eisenhower, Nixon, Dalton,
        Eagleton, Long.'
      tags:
      - name:kennedy-john-f
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
      - name:dalton-john-m
      - name:eagleton-thomas-f
      - name:long-edward-v
      - state:mo
- add:
    entry:
      id: cal.1960-10-22.elections-1960-kennedy-3
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960-kennedy
      c: 'St. Louis, the Park Plaza Motel, a Democratic breakfast. Kennedy with Symington, Long and Dalton: no more days off,
        "for the next 17 days"; Missouri "really is key," his campaign "trying to put together 260-odd votes." He calls it
        "the smallest breakfast meeting I have spoken to since I became a candidate."'
      n: 'Remarks of Senator John F. Kennedy, Democratic Breakfast, Park Plaza Motel, St. Louis, MO, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-democratic-breakfast-park-plaza-motel-st-louis-mo)
        (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 694. Names: Kennedy, Symington, Long, Dalton.'
      tags:
      - name:kennedy-john-f
      - name:symington-william-s
      - name:long-edward-v
      - name:dalton-john-m
      - state:mo
      - city:st-louis
- add:
    entry:
      id: cal.1960-10-22.elections-1960-kennedy-4
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960-kennedy
      c: 'Joplin, Mo., airport rally. Kennedy with Symington, Long, Dalton and Eagleton: "a choice between the comfortable
        and the concerned." He is handed a miner''s hat a size too small; steel mills "50 percent," farm income down over
        25 percent in eight years.'
      n: 'Remarks of Senator John F. Kennedy, Joplin, MO, Airport Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-joplin-mo-airport-rally)
        (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 695–97. Names: Kennedy, Symington, Long, Dalton,
        Eagleton.'
      tags:
      - name:kennedy-john-f
      - name:symington-william-s
      - name:long-edward-v
      - name:dalton-john-m
      - name:eagleton-thomas-f
      - state:mo
- add:
    entry:
      id: cal.1960-10-22.elections-1960-kennedy-5
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960-kennedy
      also:
      - farm
      c: 'Wichita, Kans., Lawrence Stadium. Kennedy with Gov. Docking, for Theis for the Senate: Nixon''s headquarters count
        Kansas among its "sure" States. On farm policy, Benson''s, and Nixon''s support price tied to the market price; Nixon''s
        claim in New Jersey that food prices would rise 25 percent, against 2 cents of the wheat in a loaf of bread.'
      n: 'Remarks of Senator John F. Kennedy, Lawrence Stadium, Wichita, KS, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-lawrence-stadium-wichita-ks)
        (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 697–99. Names: Kennedy, Docking, Nixon, Benson.'
      tags:
      - name:kennedy-john-f
      - name:docking-george
      - name:nixon-richard-m
      - name:benson-ezra-taft
      - state:ks
      - city:wichita
- add:
    entry:
      id: cal.1960-10-22.elections-1960-kennedy-6
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960-kennedy
      c: 'Kansas City, Kans., by the reports heading, the Shawnee Mission East High School ("Shaunee"). Kennedy for Representative
        George''s reelection and Theis for the Senate: with 65 Democrats and 35 Republicans in the Senate, "mathematically"
        the Democrats control it whatever the races.'
      n: 'Remarks of Senator John F. Kennedy, Shaunee Mission East High School, Kansas City, KS, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-shaunee-mission-east-high-school-kansas-city-ks)
        (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 699–702. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:ks
- add:
    entry:
      id: cal.1960-10-22.elections-1960-kennedy-7
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960-kennedy
      c: Grand View, Mo., the Truman Shopping Center. Kennedy, with Randall, Long and Dalton, repeats the "Dewey" answer to
        Nixon's "just another Truman"; Truman remembered for Greece and Turkey, NATO and the Marshall plan. Farmers "average
        in pay about 60 cents an hour"; Benson "has helped liquidate the American farmer, and Mr. Nixon's program will continue
        it."
      n: 'Remarks of Senator John F. Kennedy, Truman Shopping Center, Grand View, MO, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-truman-shopping-center-grand-view-mo)
        (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 702–04. Names: Kennedy, Nixon, Truman, Benson,
        Long, Dalton, Randall.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      - name:truman-harry-s
      - name:benson-ezra-taft
      - name:long-edward-v
      - name:dalton-john-m
      - name:randall-clarence-b
      - state:mo
- add:
    entry:
      id: cal.1960-10-22.elections-1960-kennedy-8
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960-kennedy
      also:
      - elections-1960-debates
      c: 'Kansas City, Mo., the Auditorium, Truman on the platform, with Symington, Long, Dalton, Eagleton, Bolling and Randall.
        Kennedy on Nixon''s line in the fourth debate: "Our prestige abroad is not what we say it is, but what it is." He
        asks Nixon, who "would have no objection," to have the State Department''s overseas polls, wanted by Fulbright, made
        public.'
      n: 'Speech of Senator John F. Kennedy, Auditorium, Kansas City, MO, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-auditorium-kansas-city-mo)
        (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 704–07. Names: Kennedy, Truman, Symington, Long,
        Dalton, Eagleton, Bolling, Randall, Nixon, Fulbright.'
      tags:
      - name:kennedy-john-f
      - name:truman-harry-s
      - name:symington-william-s
      - name:long-edward-v
      - name:dalton-john-m
      - name:eagleton-thomas-f
      - name:bolling-richard
      - name:randall-clarence-b
      - name:nixon-richard-m
      - name:fulbright-j-william
      - state:mo
      - city:kansas-city
- add:
    entry:
      id: cal.1960-10-23.elections-1960-kennedy-2
      when: Oct. 23
      date: '1960-10-23'
      thread: elections-1960-kennedy
      c: 'Green Bay, Wis., morning, before the Packers game. Kennedy with Gov. Nelson, Lt. Gov. Nash and Attorney General
        Reynolds: "I don''t mind running against Mr. Nixon, but I have good enough sense not to run against the Green Bay
        Packers." Fifteen million substandard homes; average social security check "less than $78 a month."'
      n: 'Remarks of Senator John F. Kennedy, Green Bay, WI, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-green-bay-wi)
        (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 708–11. Names: Kennedy, Nelson, Reynolds, Nixon,
        Nash.'
      tags:
      - name:kennedy-john-f
      - name:nelson-gaylord-a
      - name:reynolds-john-w-jr
      - name:nixon-richard-m
      - name:nash-philleo
      - state:wi
- add:
    entry:
      id: cal.1960-10-23.elections-1960-kennedy-3
      when: Oct. 23
      date: '1960-10-23'
      thread: elections-1960-kennedy
      also:
      - civil-rights-the-executive
      - latin-america
      c: 'Madison, Wis., University of Wisconsin Fieldhouse. Kennedy with Kastenmeier, Gov. Nelson and Proxmire: which Nixon
        is he running against, the Republican of Arizona or the man who says "party labels don''t mean anything." Repeats
        the first debate''s Negro and white children; the United States "14th country" in radio broadcasts to Africa; 26 Negroes
        in a foreign service of 6,000.'
      n: 'Speech of Senator John F. Kennedy, Fieldhouse, University of Wisconsin, Madison, WI, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-fieldhouse-university-wisconsin-madison-wi)
        (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 712–16. Names: Kennedy, Kastenmeier, Nelson,
        Proxmire, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:kastenmeier-robert-w
      - name:nelson-gaylord-a
      - name:proxmire-william
      - name:nixon-richard-m
      - state:wi
      - city:madison
- add:
    entry:
      id: cal.1960-10-23.elections-1960-kennedy-4
      when: Oct. 23
      date: '1960-10-23'
      thread: elections-1960-kennedy
      also:
      - farm
      c: 'La Crosse, Wis., airport. Kennedy with Gov. Nelson and Proxmire, for Norman Clapp for Congress: "I have spent more
        time in the Third District than any candidate for the Presidency since George Washington." Farm productivity up 6
        percent a year, demand 3; Nixon''s New Jersey claim of a 25 percent rise in food prices; the farmer''s 2 cents of
        a loaf.'
      n: 'Remarks of Senator John F. Kennedy, La Crosse, WI, Airport, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-la-crosse-wi-airport)
        (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 717–20. Names: Kennedy, Nelson, Proxmire, Nixon,
        Clapp.'
      tags:
      - name:kennedy-john-f
      - name:nelson-gaylord-a
      - name:proxmire-william
      - name:nixon-richard-m
      - name:clapp-norman-m
      - state:wi
- add:
    entry:
      id: cal.1960-10-23.elections-1960-kennedy-5
      when: Oct. 23
      date: '1960-10-23'
      thread: elections-1960-kennedy
      also:
      - cuba
      c: 'Milwaukee, evening. Kennedy with Gov. Nelson, Lt. Gov. Nash, Zablocki and Reuss: "Here in Wisconsin this campaign
        began last winter, and I think it ought to end right here"; the State''s motto "Forward." Asked about Castro, he says
        the chance was lost in 1957 when the United States did not press Batista for free elections.'
      n: 'Speech of Senator John F. Kennedy, Milwaukee, WI, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-milwaukee-wi)
        (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 721–25. Names: Kennedy, Nelson, Zablocki, Reuss,
        Nash, Castro.'
      tags:
      - name:kennedy-john-f
      - name:nelson-gaylord-a
      - name:zablocki-clement-j
      - name:reuss-henry-s
      - name:nash-philleo
      - name:castro-fidel
      - state:wi
      - city:milwaukee
- add:
    entry:
      id: cal.1960-10-23.elections-1960-debates
      when: Oct. 23
      date: '1960-10-23'
      thread: elections-1960-debates
      also:
      - elections-1960-kennedy
      - cuba
      c: 'Kennedy by telegram to Nixon, in reply to Nixon''s of the day: "glad you have finally accepted my challenge" to
        a fifth debate; he objects to Nixon''s limit to Cuba, "to limit the subject of the fifth to one country would be to
        subvert the purpose of such a debate." He instructs Leonard Reinsch to meet Nixon''s staff on the details.'
      n: 'Text of a Telegram To Vice President Richard M. Nixon from Senator John F. Kennedy on Fifth Debate, [APP](https://www.presidency.ucsb.edu/documents/text-telegram-vice-president-richard-m-nixon-from-senator-john-f-kennedy-fifth-debate)
        (Oct. 23, 1960). Text of a Telegram To Vice President Richard M. Nixon from Senator John F. Kennedy on Fifth Debate,
        [APP](https://www.presidency.ucsb.edu/documents/text-telegram-vice-president-richard-m-nixon-from-senator-john-f-kennedy-fifth-debate)
        (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 726. Names: Kennedy, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1960-10-24.elections-1960-kennedy
      when: Oct. 24
      date: '1960-10-24'
      thread: elections-1960-kennedy
      c: 'Rockford, Ill., the Coronado Theater rally. Kennedy with Kerner and Douglas: "only in Rockford do we have rallies
        at 1 o''clock in the morning and 9 o''clock in the morning." Goldwater got Nixon in a room in Arizona and told him
        he is a Republican; Truman''s sign, "The Buck Stops Here."'
      n: 'Remarks of Senator John F. Kennedy, Rockford, IL, Coronado Theater Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-rockford-il-coronado-theater-rally)
        (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 727–31. Names: Kennedy, Kerner, Douglas, Nixon,
        Goldwater, Truman.'
      tags:
      - name:kennedy-john-f
      - name:kerner-otto
      - name:douglas-paul-h
      - name:nixon-richard-m
      - name:goldwater-barry-m
      - name:truman-harry-s
      - state:il
- add:
    entry:
      id: cal.1960-10-24.elections-1960-kennedy-2
      when: Oct. 24
      date: '1960-10-24'
      thread: elections-1960-kennedy
      c: 'Champaign-Urbana, Ill., the University of Illinois campus. Kennedy with Kerner and Douglas, to students: on Nixon,
        that aid to Latin America in 1955 "might not have" meant a Castro; the television debates against the Lincoln-Douglas
        debates, "What''s Our Line" on Friday nights.'
      n: 'Remarks of Senator John F. Kennedy, University of Illinois Campus, Champaign-Urbana, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-university-illinois-campus-champaign-urbana-il)
        (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 731–34. Names: Kennedy, Kerner, Douglas, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:kerner-otto
      - name:douglas-paul-h
      - name:nixon-richard-m
      - state:il
- add:
    entry:
      id: cal.1960-10-24.elections-1960-kennedy-3
      when: Oct. 24
      date: '1960-10-24'
      thread: elections-1960-kennedy
      c: 'Peoria, Ill., the courthouse rally, noon. Kennedy with Douglas and Kerner: Nixon runs on "We''ve never had it so
        good"; 4.5 million out of work, steel mills at 50 percent, farm income down 25 percent. He ends with the story of
        Colonel Davenport''s call for candles.'
      n: 'Remarks of Senator John F. Kennedy, Courthouse Rally, Peoria, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-courthouse-rally-peoria-il)
        (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 734–37. Names: Kennedy, Douglas, Kerner, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:douglas-paul-h
      - name:kerner-otto
      - name:nixon-richard-m
      - state:il
- add:
    entry:
      id: cal.1960-10-24.elections-1960-kennedy-4
      when: Oct. 24
      date: '1960-10-24'
      thread: elections-1960-kennedy
      c: 'East Peoria, Ill., the Caterpillar plant, a street rally. Kennedy, briefly: "the Caterpillar lays off 4,000 in the
        fall of 1960"; 4.5 million out of work, steel mills at 50 percent.'
      n: 'Remarks of Senator John F. Kennedy, Street Rally, Caterpillar Plant, East Peoria, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-street-rally-caterpillar-plant-east-peoria-il)
        (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 737. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:il
- add:
    entry:
      id: cal.1960-10-24.elections-1960-kennedy-5
      when: Oct. 24
      date: '1960-10-24'
      thread: elections-1960-kennedy
      c: 'Moline, Ill., the New Fieldhouse. Kennedy with Kerner, Douglas and Iowa''s Democratic candidate for governor: "a
        contest between the comfortable and the concerned." Khrushchev''s power rests on the Communist system''s productivity;
        Nixon insists he will carry Illinois.'
      n: 'Remarks of Senator John F. Kennedy, New Fieldhouse, Moline, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-new-fieldhouse-moline-il)
        (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 737–41. Names: Kennedy, Kerner, Douglas, Nixon,
        Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:kerner-otto
      - name:douglas-paul-h
      - name:nixon-richard-m
      - name:khrushchev-nikita-s
      - state:il
- add:
    entry:
      id: cal.1960-10-24.elections-1960-kennedy-6
      when: Oct. 24
      date: '1960-10-24'
      thread: elections-1960-kennedy
      c: 'Rock Island, Ill. Kennedy''s excerpts: not the missile gap or the economic gap but "the ''Nixon gap,'' the difference
        between Mr. Nixon''s campaign promises and his actual record." Nixon''s farm promises against his votes: six times
        in three years against Democratic soil conservation appropriations.'
      n: 'Excerpts of Remarks by Senator John F. Kennedy at Rock Island, IL, [APP](https://www.presidency.ucsb.edu/documents/excerpts-remarks-senator-john-f-kennedy-rock-island-il)
        (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 741–44. Names: Kennedy, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      - state:il
- add:
    entry:
      id: cal.1960-10-25.elections-1960-kennedy
      when: Oct. 25
      date: '1960-10-25'
      thread: elections-1960-kennedy
      c: 'Des Plaines, Ill., O''Hare Inn. Kennedy with Kerner, Douglas and his sister Eunice Shriver: "Mr. Nixon and I have
        one thing in common and that is that he just campaigns in Republican districts." He names Lake Zurich, Barrington
        and West Dundee: "we are going to take the Democratic message out to West Dundee and Libertyville."'
      n: 'Remarks of Senator John F. Kennedy, O''Hare Inn, Des Plaines, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-ohare-inn-des-plaines-il)
        (Oct. 25, 1960). [[w.communications-freedom-of-communications-part]], 744. Names: Kennedy, Kerner, Douglas, Nixon,
        Shriver.'
      tags:
      - name:kennedy-john-f
      - name:kerner-otto
      - name:douglas-paul-h
      - name:nixon-richard-m
      - name:shriver-eunice-kennedy
      - state:il
- add:
    entry:
      id: cal.1960-10-25.elections-1960-kennedy-2
      when: Oct. 25
      date: '1960-10-25'
      thread: elections-1960-kennedy
      c: Lake Zurich, Ill. Kennedy speaks briefly.
      n: '[[w.communications-freedom-of-communications-part]], 746. The report prints no text: a note, "Senator Kennedy spoke
        briefly at Lake Zurich, Ill., but his remarks are unavailable." Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:il
- add:
    entry:
      id: cal.1960-10-25.elections-1960-kennedy-3
      when: Oct. 25
      date: '1960-10-25'
      thread: elections-1960-kennedy
      c: 'Libertyville, Ill., the Cook Memorial Library. Kennedy introduces his sister Eunice Shriver, "Mrs. Sargeant Shriver,"
        of Chicago: "I have sisters living in all the key electoral states in preparation for this campaign." With Douglas
        and Kerner, for Tyler Thompson for Congress; a three-minute speech.'
      n: 'Remarks of Senator John F. Kennedy, Liberty Mall, Cook Memorial Library, Libertyville, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-liberty-mall-cook-memorial-library-libertyville-il)
        (Oct. 25, 1960). [[w.communications-freedom-of-communications-part]], 745–46. Names: Kennedy, Douglas, Kerner, Shriver.'
      tags:
      - name:kennedy-john-f
      - name:douglas-paul-h
      - name:kerner-otto
      - name:shriver-eunice-kennedy
      - state:il
- add:
    entry:
      id: cal.1960-10-25.elections-1960-kennedy-4
      when: Oct. 25
