      when: Oct. 27
      date: '1960-10-27'
      thread: elections-1960-kennedy
      c: 'New York, the Stuyvesant Town rally. Kennedy with Farbstein and Vanden Heuvel: growth "minus 0.3 percent" in nine
        months, steel at 50 percent, new homes 30 percent fewer; 200,000 more homes a year needed.'
      n: 'Remarks of Senator John F. Kennedy, Stuyvesant Town Rally, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-stuyvesant-town-rally-new-york-ny)
