- cite:
    id: cal.1960-11-07.elections-1960-5
    item: '[[w.communications-freedom-of-communications-part]], 953–58 (Faneuil Hall, "Eleven o''clock, election eve": the
      program of Citizens for Kennedy-Johnson, Johnson from Austin, Tex.; 956 Mrs. Kennedy at Hyannis Port: "The doctor wouldn''t
      let me leave Hyannis Port tonight"; 957, messages "recorded on film" shown; 958, "live from Austin, Tex., Hyannis Port,
