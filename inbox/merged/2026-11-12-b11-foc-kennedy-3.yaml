      - labor
      c: 'New York, Union Square, the Amalgamated Clothing Workers'' rally. Kennedy with Potofsky, Lehman, Vanden Heuvel,
        Levitt and Mayor Wagner, quoting Roosevelt at Franklin Field in 1936: "Governments can err, Presidents do make mistakes."'
      n: 'Remarks of Senator John F. Kennedy, Union Square, New York, NY, Amalgamated Clothing Workers Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-union-square-new-york-ny-amalgamated-clothing-workers-rally)
