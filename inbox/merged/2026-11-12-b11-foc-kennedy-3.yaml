      c: 'Mount Clemens, Mich., City Square. Kennedy with Lt. Gov. Swainson, Rep. O''Hara, McNamara and Gov. Williams: "the
        last 13 days"; 90 percent of Republicans against the 25-cent minimum wage in 1935, 80 percent against $1.25 in 1960.'
      n: 'Remarks of Senator John F. Kennedy, City Square, Mount Clemens, MI, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-city-square-mount-clemens-mi)
