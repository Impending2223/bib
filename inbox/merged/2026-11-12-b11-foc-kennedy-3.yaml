      when: Nov. 3
      date: '1960-11-03'
      thread: elections-1960-kennedy
      c: 'Amarillo, Tex., the airport. Johnson introduces Kennedy: polls "Kennedy leading 45 to 41" in September, 48 to 44
        in October, 49 to 41 "last Saturday." Kennedy, with Johnson, Yarborough, Anderson of New Mexico, Gov. Edmondson of
        Oklahoma, Rogers and Ikard: Nixon visits Texas in the next 24 hours, "ask him what the Republicans or Nixon ever did
        for Texas"; "We are a team in this effort," Massachusetts and Texas.'
      n: 'Remarks of Senator John F. Kennedy, Airport Rally, Amarillo, TX, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-airport-rally-amarillo-tx)
        (Nov. 3, 1960). [[w.communications-freedom-of-communications-part]], 875–78 (Johnson''s remarks, 875–76; Kennedy''s,
        876–78). Names: Kennedy, Johnson, Yarborough, Anderson, Edmondson, Nixon, Rogers, Ikard.'
