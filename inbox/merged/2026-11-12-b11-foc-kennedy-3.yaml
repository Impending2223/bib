      when: Nov. 7
      date: '1960-11-07'
      thread: elections-1960-kennedy
      c: 'Springfield, Mass., City Hall. Kennedy with Joe Ward for governor and the State ticket: "this is the first speech
        that I have made in this presidential campaign in my own State of Massachusetts. I saved the best to last." Nixon
        would go to Eastern Europe, Eisenhower to Russia.'
