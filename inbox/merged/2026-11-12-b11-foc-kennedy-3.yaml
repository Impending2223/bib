      c: 'Oakland, Calif., Defremery Park. Kennedy with Gov. Brown, Cohelan and George P. Miller: Nixon is coming "on Saturday,"
        after South Carolina on Thursday; 90 percent of Republicans against the 25-cent minimum wage in the thirties, 90 percent
        against $1.25 in 1960.'
      n: 'Remarks of Senator John F. Kennedy, Defremery Park, Oakland, CA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-defremery-park-oakland-ca)
