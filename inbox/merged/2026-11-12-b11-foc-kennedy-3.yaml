      c: 'Long Beach, Calif., the Douglas plant. Kennedy asks help "in retiring the Republicans and sending them out of Washington";
        Nixon takes a ride through New York with Rockefeller, Lodge and Eisenhower: "if he won''t come and meet me in a fifth
        debate, how is he going to stand up to Mr. Khrushchev?" Congress passed $370 million for the B-70.'
      n: 'Remarks of Senator John F. Kennedy, Douglas Plant, Long Beach, CA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-douglas-plant-long-beach-ca)
        (Nov. 1, 1960). [[w.communications-freedom-of-communications-part]], 849–50. Names: Kennedy, Nixon, Rockefeller, Lodge,
        Eisenhower, Khrushchev.'
