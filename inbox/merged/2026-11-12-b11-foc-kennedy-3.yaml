      when: Nov. 5
      date: '1960-11-05'
      thread: elections-1960-kennedy
      c: 'Queens, outside the Boulevard Restaurant, cold and rain. Kennedy presents Mayor Wagner and Gov. Ribicoff, Frank
        O''Connor and others: "my name is Kennedy, and I am running for the Presidency."'
      n: 'Remarks of Senator John F. Kennedy, Boulevard Restaurant (Outside), Queens, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-boulevard-restaurant-outside-queens-ny)
