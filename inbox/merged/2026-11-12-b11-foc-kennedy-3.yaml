      when: Nov. 4
      date: '1960-11-04'
      thread: elections-1960-kennedy
      c: 'Norfolk, Va., the Granby High School athletic field. Kennedy: "Can you tell me what Thomas Jefferson has in common
        with Richard Milhous Nixon?"; "I come back where it all began, and I ask Virginia to give me her vote."'
      n: '[[w.communications-freedom-of-communications-part]], 887. The report prints no text, only "exact quotations from
        this speech given in newspaper accounts" (887). Names: Kennedy, Nixon.'
