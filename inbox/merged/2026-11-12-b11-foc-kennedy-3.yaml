      when: Nov. 6
      date: '1960-11-06'
      thread: elections-1960-kennedy
      c: 'Kennedy, by statement, on the 100th anniversary of the birth of Ignace Jan Paderewski: "Poland may have a satellite
        government, but the Poles will never be a satellite people." America can help "through effective economic and political
        assistance."'
      n: 'Senator John F. Kennedy Today Issued the Following Statement on the Occasion of the 100th Anniversary of the Birth
        of Ignace Jan Paderewski, [APP](https://www.presidency.ucsb.edu/documents/senator-john-f-kennedy-today-issued-the-following-statement-the-occasion-the-100th)
        (Nov. 6, 1960). [[w.communications-freedom-of-communications-part]], 929–30. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
