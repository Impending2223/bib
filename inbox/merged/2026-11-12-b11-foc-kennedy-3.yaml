      when: Nov. 5
      date: '1960-11-05'
      thread: elections-1960-kennedy
      c: 'Flushing, N.Y., the Elchester Apartments. Kennedy with Mayor Wagner and Harry Van Arsdale of the Central Labor Council,
        on the labor-built housing: "if I don''t win on Tuesday, I may move in here."'
      n: 'Remarks of Senator John F. Kennedy, Elchester Apartments, Flushing, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-elchester-apartments-flushing-ny)
        (Nov. 5, 1960). [[w.communications-freedom-of-communications-part]], 905–06. Names: Kennedy, Wagner.'
