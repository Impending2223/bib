      date: '1960-11-04'
      thread: elections-1960-kennedy
      c: 'Roanoke, Va., airport rally. Kennedy with Governor Battle, Gov. Almond and Congressmen Jennings, Downing, Gary and
        Hardy: "I come to the mother of the Democratic Party, Virginia"; he will not believe Virginia "would vote for a Republican
        of the strip of Richard Nixon."'
      n: 'Remarks of Senator John F. Kennedy, Airport Rally, Roanoke, VA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-airport-rally-roanoke-va)
