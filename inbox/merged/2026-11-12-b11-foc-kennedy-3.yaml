      c: 'Kennedy to Oliver La Farge, president of the Association of American Indian Affairs, on Indian policy: "wholeheartedly"
        supports the platform pledge; "no change in treaty or contractual relationships without the consent of the tribes
        concerned"; ten steps, among them an area redevelopment bill, credit, a Youth Conservation Corps. The 1953–54 termination
        program was a Republican one.'
