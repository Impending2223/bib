      when: Nov. 5
      date: '1960-11-05'
      thread: elections-1960-kennedy
      c: 'New York, the Coliseum, excerpts. Kennedy: "In less than 60 hours the polls open"; the polls will not open "in Moscow
        or in Peiping or in Mr. Castro''s Cuba." He quotes the oath he will take on Jan. 20, 1961.'
      n: 'Excerpts of Remarks by Senator John F. Kennedy, New York Coliseum, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/excerpts-remarks-senator-john-f-kennedy-new-york-coliseum-new-york-ny)
