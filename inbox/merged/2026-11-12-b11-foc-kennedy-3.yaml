      when: Oct. 27
      date: '1960-10-27'
      thread: elections-1960-kennedy
      c: 'Brooklyn, Bay Parkway and 86th Street. Kennedy: "I stand here tonight where Franklin Roosevelt stood"; "The next
        President of the United States will carry New York." Asks the crowd where to eat.'
      n: 'Remarks of Senator John F. Kennedy, Bay Parkway & 86th Street, Brooklyn, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-bay-parkway-86th-street-brooklyn-ny)
