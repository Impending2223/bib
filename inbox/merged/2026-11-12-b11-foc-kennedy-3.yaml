      c: 'New Haven, Conn., a street rally. Kennedy with Gov. Ribicoff, Mayor Lee, Rep. Giaimo and Kowalski: Connecticut in
        1956 "the first State in the Union" to support him for Vice President; Nixon''s claim that prestige "has never been
        higher."'
      n: 'Remarks of Senator John F. Kennedy, Street Rally, New Haven, CT, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-street-rally-new-haven-ct)
        (Nov. 6, 1960). [[w.communications-freedom-of-communications-part]], 913–16. Names: Kennedy, Ribicoff, Nixon, Lee,
        Giaimo, Kowalski.'
