      date: '1960-10-26'
      thread: elections-1960-kennedy
      c: 'Detroit, the Coliseum, Michigan State Fair. Kennedy with Swainson, Gov. Williams, McNamara, Machrowicz and O''Hara:
        steel mills "53 percent," homes built 30 percent fewer; the USIS poll of ten countries; 208 million people and "25,000
        new jobs every week" by 1970. He cites a Negro baby''s and a white baby''s chances.'
      n: 'Speech of Senator John F. Kennedy, Detroit Coliseum, Michigan State Fair, Detroit, MI, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-detroit-coliseum-michigan-state-fair-detroit-mi)
