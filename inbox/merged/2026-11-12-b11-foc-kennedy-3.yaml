      when: Nov. 4
      date: '1960-11-04'
      thread: elections-1960-kennedy
      c: 'Toledo, Ohio, the courthouse. Kennedy with Gov. DiSalle, Sen. Young and Rep. Ashley: back in Ohio "for the sixth
        time"; Nixon "has called me everything from a barefaced liar to an economic ignoramus. I am calling him a worthy member
        of his party in 1960."'
      n: 'Remarks of Senator John F. Kennedy, Toledo, Ohio, Court House, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-toledo-ohio-court-house)
        (Nov. 4, 1960). [[w.communications-freedom-of-communications-part]], 892–94. Names: Kennedy, Nixon, DiSalle, Young,
        Ashley.'
