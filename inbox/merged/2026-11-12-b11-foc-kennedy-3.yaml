      when: Oct. 27
      date: '1960-10-27'
      thread: elections-1960-kennedy
      c: 'New York, New York University, Washington Square. Kennedy to students, over Nixon sign holders: Nixon runs on "Experience
        Counts"; three recessions in eight years, 4.5 million out of work, 3 million part time. He asks how many will serve
        abroad as doctors, engineers, teachers and nurses.'
      n: 'Remarks of Senator John F. Kennedy, New York University, Washington Square, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-new-york-university-washington-square-new-york-ny)
        (Oct. 27, 1960). [[w.communications-freedom-of-communications-part]], 776–79. Names: Kennedy, Nixon.'
