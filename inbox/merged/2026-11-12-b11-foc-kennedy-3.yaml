      c: 'Elmhurst, Ill., York Township High School. Kennedy on the USIA overseas survey: the administration "has withheld
        this report from the American people," and Nixon "has seriously misled the American people about this survey and its
        results in at least four important ways."'
      n: 'Excerpts of Remarks by Senator John F. Kennedy, York Town Ship High School, Elmhurst, IL, [APP](https://www.presidency.ucsb.edu/documents/excerpts-remarks-senator-john-f-kennedy-york-town-ship-high-school-elmhurst-il)
