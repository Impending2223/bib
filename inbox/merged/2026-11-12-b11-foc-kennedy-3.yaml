      c: 'Oklahoma City, the Reding Shopping Center, excerpts. Kennedy asks three questions of Nixon''s record in foreign
        affairs: the liberation policy of 1952 and 1956; in 1954 his recommending "the dispatch of American troops to fight
        in Indochina."'
      n: 'Excerpts of Remarks by Senator John F. Kennedy, Oklahoma City, OK, Redding Shopping Center, [APP](https://www.presidency.ucsb.edu/documents/excerpts-remarks-senator-john-f-kennedy-oklahoma-city-ok-redding-shopping-center)
