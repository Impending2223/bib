      c: 'Washington, a Democratic National Committee release. Kennedy names the first of 200 community leaders to head local
        committees for new jobs and new growth, to report to him "before the year''s end." His letter: "neither the present
        administration in Washington nor the Republican candidate for President, has a program to increase the number of jobs."'
      n: 'News Release on Unemployment from the Democratic National Committee Publicity Division, [APP](https://www.presidency.ucsb.edu/documents/news-release-unemployment-from-the-democratic-national-committee-publicity-division)
        (Oct. 27, 1960). [[w.communications-freedom-of-communications-part]], 784–85. Names: Kennedy.'
