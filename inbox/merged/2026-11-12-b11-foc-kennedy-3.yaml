      when: Nov. 3
      date: '1960-11-03'
      thread: elections-1960-kennedy
      c: 'Albuquerque, N.M. Kennedy with Gov. Burroughs, Senators Chavez and Anderson, and Navajo and Pueblo delegations:
        Nixon called his remark on Republicans and social security "a barefaced lie"; "I would not accuse Mr. Nixon of being
        barefaced." Nixon, he says, does not understand "they are not choosing a committee: they are choosing a President."'
      n: 'Remarks of Senator John F. Kennedy, Albuquerque, NM, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-albuquerque-nm)
        (Nov. 3, 1960). [[w.communications-freedom-of-communications-part]], 871–75. Names: Kennedy, Anderson, Nixon, Burroughs,
        Chavez.'
