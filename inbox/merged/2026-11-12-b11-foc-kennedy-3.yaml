      c: 'Roseville, Mich., Eastgate Shopping Center. Kennedy with Gov. Williams, Lt. Gov. Swainson, McNamara and O''Hara:
        "It is raining on Vice President Nixon today." Goldwater "puts the rubber hose" to Nixon in Arizona.'
      n: 'Remarks of Senator John F. Kennedy, Roseville, MI, Eastgate Shopping Center, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-roseville-mi-eastgate-shopping-center)
