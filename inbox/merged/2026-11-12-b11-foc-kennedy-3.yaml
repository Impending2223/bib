      - labor
      c: 'New York, the Trade Union Council of the Liberal Party. Kennedy with Dubinsky, Alex Rose, Lehman, Vanden Heuvel
        and Mayor Wagner: prestige is not "popularity," it is whether Latin America, Africa and Asia will "follow our example";
        he cites the day''s New York Times poll in England and France.'
      n: 'Remarks of Senator John F. Kennedy, Trade Union Council of Liberal Party, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-trade-union-council-liberal-party-new-york-ny)
