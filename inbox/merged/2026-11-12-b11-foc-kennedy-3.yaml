      date: '1960-11-06'
      thread: elections-1960-kennedy
      c: 'Lewiston, Maine, City Park. Kennedy with Sen. Muskie, whose voice "is just about gone," Lucia Cormier and Roberts:
        Nixon "believes that the program which we have recommended, of medical care for the aged tied to social security,
        is extreme." He ends with Colonel Davenport''s candles.'
      n: 'Remarks of Senator John F. Kennedy, City Park, Lewiston, Maine, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-city-park-lewiston-maine)
