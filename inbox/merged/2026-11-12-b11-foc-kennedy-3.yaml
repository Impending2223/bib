      c: 'Hamtramck, Mich., Keyworth Stadium. Kennedy with Machrowicz and Swainson: "the strongest Democratic city in the
        United States." By Nov. 15 "more automobiles in inventory than ever before in our history"; September homebuilding
        29 percent below the year before.'
      n: 'Remarks of Senator John F. Kennedy, Keyworth Stadium, Hamtramck, MI, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-keyworth-stadium-hamtramck-mi)
